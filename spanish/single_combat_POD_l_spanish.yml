#Aggressor Lost, Own Combat Move Fatality
#Example: "which distracts me just long enough that I don't notice the follow-up [sc_victor.Custom('SignatureWeaponAttemptedLight')] before it's [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')].\n\nI stagger, then topple backwards into the [sc_defender.Custom('GroundType')], convulsing, trying to scream but unable to manage more than a hoarse whisper. How could anyone survive this much #EMP pain#!?\n\nThey couldn't."
 single_combat.0031.desc.sc_attacker.POD_bite.fatality: "Y llega rápidamente, en forma de un golpe en la cara, partiéndola limpiamente por la mitad."
 single_combat.0031.desc.sc_attacker.POD_blood_surge.fatality: "Y esa pequeña distracción es suficiente para que mi oponente tome ventaja con un golpe rápido en tu cuello. Tu cabeza pronto rodará por el suelo, lo cual no es muy saludable."
 single_combat.0031.desc.sc_attacker.POD_blood_heal.fatality: "Y esa pequeña distracción es suficiente para que mi oponente tome ventaja con un golpe rápido en tu cuello. Tu cabeza pronto rodará por el suelo, lo cual no es muy saludable."
 single_combat.0031.desc.sc_attacker.POD_blink.fatality: "Y lo pierdo todo de forma aún más desastrosa de lo que anticipaba. Sin embargo, ya no perderé nada más, si es que eso cuenta como una bendición."
 single_combat.0031.desc.sc_attacker.POD_lightning_strike.fatality: "El contraataque de mi oponente no lo hace. Mi corazón es atravesado y estalla. Un final sangriento."
 single_combat.0031.desc.sc_attacker.POD_split_second.fatality: "Recibo su siguiente ataque como si nada hubiera pasado. Y iba dirigido a mi cuello. Un final inglorioso."
 single_combat.0031.desc.sc_attacker.POD_unerring_aim.fatality: "Acortando la distancia, mi enemigo me da un puñetazo en el estómago por mi impudencia. Luego en la cara. Después me arranca el cuello de los hombros."
 single_combat.0031.desc.sc_attacker.POD_lethal_body.fatality: "Los de mis oponentes no lo hacen, lamentablemente. Y duele. Hasta que deja de doler, mientras la oscuridad te traga."
 single_combat.0031.desc.sc_attacker.POD_brutal_feed.fatality: "Y llega rápidamente, en forma de un golpe en la cara, partiéndola limpiamente por la mitad."
 single_combat.0031.desc.sc_attacker.POD_earthshock.fatality: "Distraído por este fracaso, no veo venir el siguiente golpe. Y ahora, no volveré a ver nada jamás."
 single_combat.0031.desc.sc_attacker.POD_fist_of_caine.fatality: "Sus golpes son mucho más pesados para mí y pronto me desmorono contra el suelo, incapaz de hacer otra cosa que mirar el final demoledor que se acerca."
 single_combat.0031.desc.sc_attacker.POD_toughness.fatality: "Parece que la Fortaleza no fue suficiente esta vez. Tampoco lo fue para salvarme del poderoso golpe dirigido a tu cuello que viene a continuación."
 single_combat.0031.desc.sc_attacker.POD_flesh_of_marble.fatality: "Siento como si estuviera en el centro de un terremoto. Y pronto eres tragad[ROOT.Char.Custom('ES_OA')] por él, para no volver a ser visto jamás."
 single_combat.0031.desc.sc_attacker.POD_prowess_from_pain.fatality: "Mi oponente se asegura rápidamente de que pronto duela aún más. Hasta que deja de doler."
 single_combat.0031.desc.sc_attacker.POD_feral_weapons.fatality: "Su contraataque no es menos peligroso, y soy incapaz de salvarme de la siguiente ronda de poderosos golpes que vienen hacia mí."
 single_combat.0031.desc.sc_attacker.POD_shapechange.fatality: "Canalizando generaciones de Humanidad para domar la vida salvaje, mi oponente empieza a darme una paliza monumental en mi forma animal. Una victoria rotunda para la Humanidad en este episodio de «el hombre contra la naturaleza»."
 single_combat.0031.desc.sc_attacker.POD_vanish.fatality: "Su siguiente golpe también lo hace. Y el siguiente. Y el siguiente..."
 single_combat.0031.desc.sc_attacker.POD_nocturne.fatality: "Como lo demuestra su siguiente golpe, casi perfecto. Y el siguiente. Y el siguiente..."
 single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman.fatality: "Distraído por este fracaso, tengo que soportar una rápida represalia. En mi estado actual, no soy capaz de recuperarme lo suficientemente rápido. Esto terminará pronto."
 single_combat.0031.desc.sc_attacker.POD_the_darkness_within.fatality: "Lamentablemente, no me va muy bien contra su siguiente golpe. La inmortalidad siempre acaba en la muerte de alguna manera."
 single_combat.0031.desc.sc_attacker.POD_aegis_of_shadows.fatality: "No ser invulnerable parece que duele como el infierno. Sin embargo, estar verdaderamente muerto no lo hará, como pronto aprenderás."
 single_combat.0031.desc.sc_attacker.POD_compel.fatality: "Y entonces ordena a su puño que se clave en mi cabeza. Funciona. Mi cabeza no está contenta con ello y decide desprenderse de mi cuerpo."
 single_combat.0031.desc.sc_attacker.POD_terminal_decree.fatality: "Y entonces ordena a su puño que se clave en mi cabeza. Funciona. A mi cabeza no le gusta y decide desprenderse de mi cuerpo."
 single_combat.0031.desc.sc_attacker.POD_daunt.fatality: "Como lo demuestra su siguiente golpe, casi perfecto. Y el siguiente. Y el siguiente..."
 single_combat.0031.desc.sc_attacker.POD_dread_gaze.fatality: "Y duele bastante ser quien lo recibe. Mientras pronto sientes la maldición de Caín abandonando tu cuerpo, tienes el pequeño consuelo de haber ayudado a tu enemigo a superar brutalmente su miedo al menos."
 single_combat.0031.desc.sc_attacker.POD_extinguish_vitae.fatality: "Lo cual pronto podré confirmar cuando una patada potenciada por la sangre me golpee en las entrañas. Pronto no tendré entrañas, ni inmortalidad tampoco."
 single_combat.0031.desc.sc_attacker.POD_scorpions_touch.fatality: "Sin embargo, tú no tienes el mismo cuidado al evitar las suyas, y terminas perdiendo esta pelea. Al final, solo queda la oscuridad."
 single_combat.0031.desc.sc_attacker.POD_theft_of_vitae.fatality: "Lo mío sale disparado cuando el puñetazo de mi oponente conecta con mi cara. En protesta, mi cabeza decide desprenderse de mi cuerpo."
 single_combat.0031.desc.sc_attacker.POD_baals_curse.fatality: "Sin embargo, tú no tienes el mismo cuidado al evitar las suyas, y terminas perdiendo esta pelea. Al final, solo queda la oscuridad."
 single_combat.0031.desc.sc_attacker.POD_cauldron_of_blood.fatality: "Lo cual pronto podré confirmar cuando una patada potenciada por la sangre me golpee en las entrañas. Pronto no tendré entrañas, ni inmortalidad tampoco."
 single_combat.0031.desc.sc_attacker.POD_touch_of_oblivion.fatality: "Sin inmutarse, mi enemigo se impone y termino perdiendo esta pelea. Al final, solo queda la oscuridad."
 single_combat.0031.desc.sc_attacker.POD_stygian_shroud.fatality: "Lo cual pronto podré confirmar cuando una patada potenciada por la sangre me golpee en las entrañas. Pronto no tendré entrañas, ni inmortalidad tampoco."
 single_combat.0031.desc.sc_attacker.POD_fire_torch.fatality: "Mi patético ataque es entonces contrarrestado por un golpe magistral. No me recuperaré de este."
 single_combat.0031.desc.sc_attacker.POD_fire_bombs.fatality: "Sin embargo, no esquivo fácilmente el puñetazo en la cara que viene después. Ni el siguiente, hasta que mi cabeza cae de mis hombros."
 single_combat.0031.desc.sc_attacker.POD_fire_spewer.fatality: "El siguiente golpe de mi oponente es mucho más preciso que ese. Mi cabeza es cercenada de mis hombros con un movimiento rápido."
 single_combat.0031.desc.sc_attacker.POD_crossbow_shot.fatality: "El siguiente golpe de mi oponente es mucho más preciso que ese. Mi cabeza es cercenada de mis hombros con un movimiento rápido."
 single_combat.0031.desc.sc_attacker.POD_unleash_dogs.fatality: "Mi oponente me lanza uno de mis propios perros en represalia. Lo atrapo por reflejos, lo que parece ser un error, ya que mi oponente se abalanza sobre mí para asestarme un golpe crítico."
 single_combat.0031.desc.sc_attacker.POD_stake_attack.fatality: "Sin embargo, no esquivo fácilmente el puñetazo en la cara que viene después. Ni el siguiente, hasta que mi cabeza cae de mis hombros."
 single_combat.0031.desc.sc_attacker.POD_oculi_trust.fatality: "Soy rápidamente repelido por un asalto implacable. Acorralado, caigo al suelo, indefenso."
 single_combat.0031.desc.sc_attacker.POD_oculi_wine.fatality: "Sin embargo, no esquivo fácilmente el puñetazo en la cara que viene después. Ni el siguiente, hasta que mi cabeza cae de mis hombros."
 single_combat.0031.desc.sc_attacker.POD_acre_catechumen.fatality: "El contraataque de mi oponente me pilla desprevenido y conecta. El fin llega con un destello de acero."
 single_combat.0031.desc.sc_attacker.POD_acre_flesh.fatality: "Duele bastante. Lo suficiente como para distraerme del siguiente golpe. Este no duele por mucho tiempo."
 single_combat.0031.desc.sc_attacker.POD_acre_flight.fatality: "O incluso superarme, mientras soy empujado hacia atrás. Y hacia atrás. Hasta que no queda ningún lugar a donde ir."
 single_combat.0031.desc.sc_attacker.POD_acre_auto.fatality: "Sin embargo, no esquivo fácilmente el puñetazo en la cara que viene después. Ni el siguiente, hasta que mi cabeza cae de mis hombros."
 single_combat.0031.desc.sc_attacker.POD_murnau_mirror.fatality: "Soy empujado hacia atrás, apenas manteniéndome el ritmo. El duelo no dura mucho después de eso; estoy fuera de mi liga."
 single_combat.0031.desc.sc_attacker.POD_murnau_arcana.fatality: "Este explotó justo en mi cara. Y luego explotó mi cara también."
 single_combat.0031.desc.sc_attacker.POD_sisters_hosanna.fatality: "El contraataque de mi oponente me pilla desprevenido y conecta. El fin llega con un destello de acero."
 single_combat.0031.desc.sc_attacker.POD_sisters_oratorio.fatality: "El contraataque de mi oponente me pilla desprevenido y conecta. El fin llega con un destello de acero."
 single_combat.0031.desc.sc_attacker.POD_bone_obedience.fatality: "Soy empujado hacia atrás, apenas manteniéndome el ritmo. El duelo no dura mucho después de eso; estoy fuera de mi liga."
 single_combat.0031.desc.sc_attacker.POD_five_poison_cloud.fatality: "Sin embargo, no esquivo fácilmente el puñetazo en la cara que viene después. Ni el siguiente, hasta que mi cabeza cae de mis hombros."
 single_combat.0031.desc.sc_attacker.POD_ching_shih.fatality: "Estoy herido, pero sigo en pie. Hasta que dejo de estarlo. Termina como empezó: en la oscuridad."
 single_combat.0031.desc.sc_attacker.POD_long_neck.fatality: "Mi oponente no, y yo quedo herido. Lo suficientemente mal como para que el resto de la pelea sea un asunto asegurado."
 single_combat.0031.desc.sc_attacker.POD_bloodlash.fatality: "Antes de conectar con un golpe rápido que me hiere. Lo suficiente como para que el resto de la pelea sea una conclusión inevitable."
