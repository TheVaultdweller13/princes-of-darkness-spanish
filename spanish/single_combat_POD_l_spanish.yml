 single_combat.0031.desc.sc_attacker.POD_ashen_ladys_embrace.injury: "Mi hechizo no surte efecto y quedo expuesto a un contraataque."
 single_combat.0031.desc.sc_attacker.POD_ashen_ladys_embrace.fatality: "Mi oponente me contraataca con un ataque poderoso. Mi visión se vuelve negra."
 single_combat.0041.desc.sc_defender.POD_ashen_ladys_embrace: "Lanzo un hechizo para convertir la carne de mi enemigo en ceniza."
 single_combat.0041.desc.opponent_response.POD_ashen_ladys_embrace: "Mi oponente intenta lanzar un hechizo y convertir mi carne en ceniza."
 single_combat.0041.desc.opponent_response.POD_ashen_ladys_embrace.injury: "Lanzo un hechizo para transformar a mi enemigo en cenizas. Partes de su carne comienzan a desecarse."
