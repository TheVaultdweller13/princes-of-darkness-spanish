 single_combat.0001.POD_ashen_ladys_embrace: "¡Mi toque destruirá tu cuerpo!" 
 single_combat.0001.tt.POD_ashen_ladys_embrace: "#D Intentas alterar el estado de la sustancia enemiga en un instante.#!" 
 single_combat.0001.desc.my_feedback.POD_ashen_ladys_embrace: "Lanzo un hechizo para transformar la carne de mi oponente en cenizas."
 single_combat.0001.desc.opponent_response.POD_ashen_ladys_embrace: "Mi enemigo intenta lanzar un hechizo para convertirme en cenizas."
 single_combat.0031.desc.sc_defender.POD_ashen_ladys_embrace: "El Hechizo no llega a surtir efecto."
 single_combat.0031.desc.opponent_response.POD_ashen_ladys_embrace: "Mi enemigo intenta lanzar un Hechizo y transformar mi carne en ceniza."
 single_combat.0031.desc.opponent_response.POD_ashen_ladys_embrace.injury: "Partes de mi carne se desecar por el hechizo de mi oponente."
 single_combat.0031.desc.opponent_response.POD_ashen_ladys_embrace.fatality: "Mi enemigo lanza un hechizo para transformar mi carne en ceniza. Me desplomo al sentir que mi carne se desecaba."
