 single_combat.0041.desc.sc_defender.POD_clap_of_thunder: "Aplaudo con fuerza y un repentino y resonante estruendo de trueno sacude a [sc_loser.GetFirstNameNoTooltip] hasta la médula."
 single_combat.0041.desc.sc_defender.POD_dragon_slash: "Me lanzo contra [sc_loser.GetFirstNameNoTooltip] con una serie de zarpazos fluidos y bien ejecutados, y su respuesta resulta totalmente ineficaz."



