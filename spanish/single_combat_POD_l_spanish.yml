#Aggressor Won, Own Combat Move Injury
#Example: "sailing pommel-first for [sc_loser.GetHerHis] [sc_loser.Custom('MaskFace')].\n\nThe blow impacts [sc_loser.GetFirstNameNoTooltip] #EMP hard#!, slamming so deep I swear I can feel the bone bruise, and [sc_loser.GetSheHe] staggers backwards in a daze.\n\nWhen the [sc_loser.Custom('signature_weapon')] drops from [sc_loser.GetHerHis] hand, my opponent stammers out a yield without me needing to do anything."
 single_combat.0041.desc.sc_attacker.POD_bite.injury: "Y logra conectar; el embriagador aroma de la sangre impregna el aire. Apenas logra liberarse de este Abrazo mortal antes de que sea demasiado tarde."
 single_combat.0041.desc.sc_attacker.POD_blood_surge.injury: "Puedo verme erguido/a y más fuerte, fortalecido/a por la sangre. Aprovecho rápidamente mi ventaja."
 single_combat.0041.desc.sc_attacker.POD_blood_heal.injury: "Todas mis heridas desaparecen ante mis ojos mientras el poder de la sangre me sana. Aprovecho rápidamente mi ventaja."
