 single_combat.0041.desc.sc_attacker.POD_spark_of_ra.fatality: "La bola de fuego impacta, convirtiendo a mi oponente en una antorcha agonizante."
 single_combat.0041.desc.sc_attacker.POD_deaths_hand.fatality: "La ráfaga de energía espectral golpea a mi enemigo, derrotándolo."
 single_combat.0041.desc.sc_attacker.POD_ashes_to_ashes.fatality: "Lanzo un hechizo para convertir la carne de mi oponente en ceniza. Se desploma en el suelo."
 single_combat.0041.desc.sc_attacker.POD_dust_to_dust.fatality: "Mi enemigo se desploma en el suelo mientras su carne se transforma en arcilla."
 single_combat.0041.desc.sc_attacker.POD_khaibits_embrace.fatality: "Mi enemigo es completamente envuelto por las sombras. Ahora está a mi merced."
 single_combat.0041.desc.sc_attacker.POD_serqets_sting.fatality: "El veneno arde en sus venas y mi oponente pronto colapsa."
 single_combat.0041.desc.sc_attacker.POD_voracious_scarab_of_nyarashahim.fatality: "El escarabajo excava más profundamente y mi oponente pronto colapsa."
 single_combat.0041.desc.sc_attacker.POD_spear_of_anubis.fatality: "Derribo a mi oponente con la lanza de Anubis."
 single_combat.0041.desc.sc_attacker.POD_feral_clawing.fatality: "Derribo a mi oponente con mis propias garras."
 single_combat.0041.desc.sc_attacker.POD_feral_bite.fatality: "Le arranco la cara a mi enemigo de un mordisco."
 single_combat.0041.desc.sc_attacker.POD_feral_assault.fatality: "Ataco furiosamente a mi oponente, derribándolo a [my_foe.GetHerHim]."
 single_combat.0041.desc.sc_attacker.POD_feral_taunt.fatality: "Distraigo a mi enemigo y luego lo derribo a [my_foe.GetHerHim]."
 single_combat.0041.desc.sc_attacker.POD_feral_evasion.fatality: "Mientras esquivo a mi enemigo, me acerco a [my_foe.GetHerHim] y lo derribo."
 single_combat.0041.desc.sc_attacker.POD_jaw_lock.fatality: "Bloqueo la extremidad de mi enemigo y lo derribo a [my_foe.GetHerHim]."
 single_combat.0041.desc.sc_attacker.POD_hamstring.fatality: "Ataco las extremidades de mi oponente, derribándolo a [my_foe.GetHerHim]."
 single_combat.0041.desc.sc_attacker.POD_leaping_rake.fatality: "Me lanzo contra mi enemigo, empalándolo con mis garras a [my_foe.GetHerHim]."
 single_combat.0041.desc.sc_attacker.POD_wishbone.fatality: "Con mi inmensa fuerza, desgarro a mi enemigo."
 single_combat.0041.desc.sc_attacker.POD_manipulate_inertia.fatality: "Y no tienen ninguna; mi embestida solo se detiene cuando solo quedan cenizas ante mí."
 single_combat.0041.desc.sc_attacker.POD_manipulate_acceleration.fatality: "Y no tienen ninguna; mi embestida solo se detiene cuando solo quedan cenizas ante mí."
 single_combat.0041.desc.sc_attacker.POD_manipulate_cohesion.fatality: "Y no tienen ninguna; mi embestida solo se detiene cuando solo quedan cenizas ante mí."
 single_combat.0041.desc.sc_attacker.POD_dragons_breath.fatality: "[sc_loser.GetSheHe|U] queda atrapad[ROOT.Char.Custom('ES_OA')] en el centro mismo del mar de fuego; escucho sus desesperados gritos de dolor y, después, el silencio."
 single_combat.0041.desc.sc_attacker.POD_bark_mudpuppy.fatality: "[sc_loser.GetSheHe|U] aprieta [sc_loser.GetHerHis] dientes mientras las heridas se abren por toda [sc_loser.GetHerHis] piel, y el lapso de concentración es suficiente para que le atraviese la garganta a [sc_loser.GetHerHis] con mi arma."
 single_combat.0041.desc.sc_attacker.POD_clap_of_thunder.fatality: "[sc_loser.GetSheHe|U] no opone resistencia mientras lo decapito fácilmente y doy un final decepcionante a este duelo."
 single_combat.0041.desc.sc_attacker.POD_dragon_slash.fatality: "[sc_loser.GetSheHe|U] no tiene respuesta ante mi ofensiva y no opone resistencia, incluso mientras le arranco los brazos, lo desentraño y lo mato a golpes con su propia columna vertebral."


