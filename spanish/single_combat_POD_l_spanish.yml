 single_combat.0041.desc.sc_attacker.POD_chi_interrupt: "Me lanzo hacia mi oponente, buscando sus puntos críticos de Chi."
 single_combat.0041.desc.sc_attacker.POD_thousand_hell_stare: "El dolor, la ira y la desesperación consumen repentinamente el alma de mi oponente."
