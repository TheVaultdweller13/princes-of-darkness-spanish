 single_combat.0041.desc.sc_attacker.POD_bark_mudpuppy: "Alzo la voz y le rujo a [sc_loser.GetFirstNameNoTooltip] con todas mis fuerzas, concentrando un único grito en un arma que desgarra la carne."
