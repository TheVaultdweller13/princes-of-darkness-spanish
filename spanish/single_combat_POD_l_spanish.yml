 single_combat.0041.desc.sc_attacker.POD_typhonic_maw.fatality: "Corto a través de la monstruosa fauce. Un corte limpio a lo largo de este rostro feo pone fin a este combate."
 single_combat.0041.desc.sc_attacker.POD_cobra_fangs.fatality: "Mientras el veneno se disipa de la colmillo de mi oponente, le doy un puñetazo en su cabeza extendida con todas mis fuerzas, asegurándome de que esta vez no se vuelva a levantar."
