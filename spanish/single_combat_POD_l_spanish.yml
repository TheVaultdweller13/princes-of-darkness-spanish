#Defender Won, Opponent Finishing Move Injury
#Example: "Thinking quickly, I slam my [sc_victor.Custom('signature_weapon')]'s [sc_victor.Custom('SignatureWeaponEndType')] into [sc_victor.GetHerHis] other hand on my back-swing, sending the hidden blade flying off.\n\nNot wanting to risk more trickery, I move to [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. [sc_loser.GetFirstNameNoTooltip] only narrowly avoids a messy death with one of the fastest yields I've ever seen."
 single_combat.0041.desc.opponent_response.POD_bite.injury: "Y logra conectar; el embriagador aroma de la sangre impregna el aire. Apenas logra liberarse de este Abrazo mortal antes de que sea demasiado tarde."
 single_combat.0041.desc.opponent_response.POD_blood_surge.injury: "Puedo verme erguido/a y más fuerte, fortalecido/a por la sangre. Aprovecho rápidamente mi ventaja."
 single_combat.0041.desc.opponent_response.POD_blood_heal.injury: "Todas mis heridas desaparecen ante mis ojos mientras el poder de la sangre me sana. Aprovecho rápidamente mi ventaja."
 single_combat.0041.desc.opponent_response.POD_blink.injury: "Y no tiene ninguna; pronto se ve reducido/a a recuperarse, con dificultad, de mi embestida."
 single_combat.0041.desc.opponent_response.POD_lightning_strike.injury: "Lo cual hago; mi enemigo es pronto repelido por este ataque inesperado."
 single_combat.0041.desc.opponent_response.POD_split_second.injury: "Mi oponente no está lo suficientemente preparado/a y recibe un golpe contundente, demasiado rápido para ser evitado por su percepción distorsionada del tiempo."
 single_combat.0041.desc.opponent_response.POD_unerring_aim.injury: "Mi oponente no puede hacer más que recibirlo, sintiendo cómo su carne no-muerta protesta ante tal maltrato."
 single_combat.0041.desc.opponent_response.POD_lethal_body.injury: "Mi oponente apenas logra levantarse, sintiendo como si una casa entera se hubiera derrumbado sobre él/ella."
 single_combat.0041.desc.opponent_response.POD_brutal_feed.injury: "Mi oponente logra liberarse de este Abrazo mortal, pero no antes de haber sentido el agudo dolor causado por mis colmillos."
 single_combat.0041.desc.opponent_response.POD_earthshock.injury: "Mi oponente cae y aprovecho esta oportunidad para golpear brutalmente. Apenas evita el golpe destinado al cuello."
 single_combat.0041.desc.opponent_response.POD_fist_of_caine.injury: "Esta tempestad es como dagas contra su piel, desgarrando grandes jirones de carne no-muerta con cada movimiento."
 single_combat.0041.desc.opponent_response.POD_toughness.injury: "Nada parece ser capaz de perforar mi defensa. Mi oponente se agota intentando atravesarla."
 single_combat.0041.desc.opponent_response.POD_flesh_of_marble.injury: "Nada parece ser capaz de perforar mi defensa. Mi oponente se agota intentando atravesarla."
 single_combat.0041.desc.opponent_response.POD_prowess_from_pain.injury: "Impulsado/a por este poder terrible, asesto un golpe poderoso que hace que mi oponente retroceda tambaleándose."
 single_combat.0041.desc.opponent_response.POD_feral_weapons.injury: "Y casi ocurre, ya que mi oponente apenas logra evitar un zarpazo que seguramente sería fatal."
 single_combat.0041.desc.opponent_response.POD_shapechange.injury: "Sorprendido/a por este cambio repentino, mi oponente es golpeado/a y tiene que repeler furiosamente al monstruo en el que me he convertido."
 single_combat.0041.desc.opponent_response.POD_vanish.injury: "Como tal, mi oponente no ve venir el siguiente golpe por la espalda. Y duele."
 single_combat.0041.desc.opponent_response.POD_nocturne.injury: "Como tal, mi oponente no ve venir el siguiente golpe por la espalda. Y duele."
 single_combat.0041.desc.opponent_response.POD_arms_of_ahriman.injury: "Mi oponente esquiva uno de ellos, pero no el segundo... y estas cosas duelen."
 single_combat.0041.desc.opponent_response.POD_the_darkness_within.injury: "De repente saltan a la boca de mi oponente, y este tiene que usar toda su Fuerza de Voluntad para expulsarlos."
 single_combat.0041.desc.opponent_response.POD_aegis_of_shadows.injury: "Nada parece ser capaz de perforar mi defensa. Mi oponente se agota intentando atravesarla."
 single_combat.0041.desc.opponent_response.POD_compel.injury: "Le pilla desprevenido, y pronto se estará recuperando de un golpe asestado mientras estaba distraído."
 single_combat.0041.desc.opponent_response.POD_terminal_decree.injury: "Lo cual hace obedientemente, sintiendo primero la humillación y luego el dolor."
 single_combat.0041.desc.opponent_response.POD_daunt.injury: "Le pilla desprevenido, y pronto se estará recuperando de un golpe asestado mientras estaba distraído."
