#Aggressor Won, Own Combat Move Fatality
#Example: "sailing through [sc_loser.GetHerHis] guard and straight into [sc_loser.GetHerHis] chest.\n\n[sc_loser.GetFirstNameNoTooltip] staggers back, my off-hand dagger pulling loose as [sc_loser.GetSheHe] does, spraying gore and fragments of bone all over the floor.\n\n[sc_loser.GetSheHe|U] bleeds out quickly, though not exactly painlessly."
 single_combat.0041.desc.sc_attacker.POD_bite.fatality: "Y conecta, con el embriagador aroma de la sangre impregnando el aire. Pronto sucumben al Beso y el dulce sabor de mi victoria es sangriento."
 single_combat.0041.desc.sc_attacker.POD_blood_surge.fatality: "Puedo verme erguido y más fuerte, fortalecido por la sangre. Aprovecho rápidamente mi ventaja y termino la pelea con un rápido corte en el cuello. La cabeza del derrotado rueda, deteniéndose solo cuando choca contra mis pies."
 single_combat.0041.desc.sc_attacker.POD_blood_heal.fatality: "Todas mis heridas desaparecen ante mis ojos mientras el poder de la sangre me cura. Aprovecho rápidamente mi ventaja y termino la pelea con un rápido corte en el cuello. La cabeza del derrotado rueda, deteniéndose solo cuando choca contra mis pies."
 single_combat.0041.desc.sc_attacker.POD_blink.fatality: "Y no tienen ninguna; mi embestida solo se detiene cuando solo quedan cenizas ante mí."
 single_combat.0041.desc.sc_attacker.POD_lightning_strike.fatality: "Lo cual hago; mi enemigo es pronto repelido por este ataque inesperado. Y hacia atrás... y hacia atrás... hasta que no queda lugar para retroceder."
 single_combat.0041.desc.sc_attacker.POD_split_second.fatality: "Mi oponente no está lo suficientemente preparado, y un fuerte golpe le llega, demasiado rápido para ser evitado por su percepción alterada del tiempo. Le corta limpiamente en dos mitades perfectamente simétricas."
 single_combat.0041.desc.sc_attacker.POD_unerring_aim.fatality: "Mi oponente no puede hacer otra cosa que recibirlo de lleno entre los ojos. No disimulo una sonrisa victoriosa mientras cae hacia atrás."
 single_combat.0041.desc.sc_attacker.POD_lethal_body.fatality: "Mi oponente siente como si una casa entera se hubiera derrumbado sobre él/ella. Al caer hacia atrás, yo tengo la ventaja de la altura. Así que todo ha terminado."
 single_combat.0041.desc.sc_attacker.POD_brutal_feed.fatality: "Mi oponente no logra librarse de este Abrazo mortal. Pronto sucumbe al Beso y el dulce sabor de mi victoria es sangriento."
 single_combat.0041.desc.sc_attacker.POD_earthshock.fatality: "Mi oponente cae y aprovecho esta oportunidad para golpear brutalmente. No esquiva el golpe destinado al cuello."
 single_combat.0041.desc.sc_attacker.POD_fist_of_caine.fatality: "Esta tempestad es como dagas contra su piel, cortando grandes jirones de carne no-muerta con cada movimiento. Hasta que solo queda un esqueleto. Luego, solo cenizas."
 single_combat.0041.desc.sc_attacker.POD_toughness.fatality: "Nada parece ser capaz de atravesar mi defensa. Mi oponente se agota intentando romperla. Mi contraataque es rápido y mortal."
 single_combat.0041.desc.sc_attacker.POD_flesh_of_marble.fatality: "Nada parece ser capaz de atravesar mi defensa. Mi oponente se agota intentando romperla. Mi contraataque es rápido y mortal."
 single_combat.0041.desc.sc_attacker.POD_prowess_from_pain.fatality: "Impulsado por este terrible poder, asesto un golpe poderoso que hace estallar las entrañas de mi enemigo en un desastre sangriento."
 single_combat.0041.desc.sc_attacker.POD_feral_weapons.fatality: "Y sucede, ya que mi oponente no logra evitar un zarpazo fatal que se le echa encima."
 single_combat.0041.desc.sc_attacker.POD_shapechange.fatality: "Sorprendido por este cambio repentino, mi oponente es golpeado y tiene que repeler furiosamente al monstruo en el que me he convertido. Pero es inútil; lo salvaje ha ganado esta ronda contra el hombre."
 single_combat.0041.desc.sc_attacker.POD_vanish.fatality: "Como tal, mi oponente no ve venir el siguiente golpe por la espalda. Y es el último que sentirá jamás."
 single_combat.0041.desc.sc_attacker.POD_nocturne.fatality: "Como tal, mi oponente no ve venir el siguiente golpe por la espalda. Y es el último que sentirá jamás."
 single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman.fatality: "Mi oponente evita uno de ellos, pero no el segundo... lo que le devuelve hacia el primero. Mi victoria consiste en azotar con tentáculos."
 single_combat.0041.desc.sc_attacker.POD_the_darkness_within.fatality: "De repente saltan a la boca de mi oponente y, apenas unos segundos después, una explosión de sangre y sombras pone fin a este duelo."
 single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows.fatality: "Nada parece ser capaz de atravesar mi defensa. Mi oponente se agota intentando romperla. Mi contraataque es rápido y mortal."
 single_combat.0041.desc.sc_attacker.POD_compel.fatality: "Esto toma a mi enemigo desprevenido, y aprovecho esta distracción para cortarle el cuello limpiamente."
 single_combat.0041.desc.sc_attacker.POD_terminal_decree.fatality: "Lo cual hacen obedientemente, una y otra vez. Suelto una risa malvada mientras mi antiguo enemigo se golpea hasta morir."
 single_combat.0041.desc.sc_attacker.POD_daunt.fatality: "Esto toma a mi enemigo desprevenido, y presiono mi ventaja hasta que no queda nada que presionar."
 single_combat.0041.desc.sc_attacker.POD_dread_gaze.fatality: "Esto toma a mi enemigo desprevenido, y presiono mi ventaja hasta que no queda nada que presionar."
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae.fatality: "De este modo, mi oponente de repente se siente mucho más débil y la Bestia ruge en un triunfo anticipado. Me lanzo hacia delante y atravieso su corazón con un puñetazo para dar el golpe final."
 single_combat.0041.desc.sc_attacker.POD_scorpions_touch.fatality: "Aturdido por ello, mi enemigo se siente enfermo y sus movimientos son lentos. Le concedo una muerte misericordiosa y lo mato con un golpe rápido en lugar del lento Beso del veneno."
 single_combat.0041.desc.sc_attacker.POD_theft_of_vitae.fatality: "Mi enemigo es incapaz de detenerlo, ¡su preciosa sangre es mía! Y sin sangre, un vampiro no es más que cenizas. Como pronto se demuestra ante mí."
 single_combat.0041.desc.sc_attacker.POD_baals_curse.fatality: "Aturdido por ello, mi enemigo se siente enfermo y sus movimientos son lentos. Le concedo una muerte misericordiosa y lo mato con un golpe rápido en lugar del lento Beso del veneno."
 single_combat.0041.desc.sc_attacker.POD_cauldron_of_blood.fatality: "¡Arde, arde! Qué hoguera tan agradable para ver, para variar."
 single_combat.0041.desc.sc_attacker.POD_touch_of_oblivion.fatality: "La sangre de mi oponente se mezcla de repente con sombras agresivas que intentan apoderarse de él. Una vez que cada onza de sangre se ha extinguido, las sombras desaparecen obedientemente."
 single_combat.0041.desc.sc_attacker.POD_stygian_shroud.fatality: "Como tal, mi oponente no ve venir el siguiente golpe por la espalda. Y es el último que sentirá jamás."
 single_combat.0041.desc.sc_attacker.POD_fire_torch.fatality: "El lastimero ataque de mi oponente es contrarrestado por un golpe maestro. No se recuperará de este."
 single_combat.0041.desc.sc_attacker.POD_fire_bombs.fatality: "Sin embargo, no esquiva fácilmente el puñetazo en la cara que le sigue. Ni el siguiente, hasta que su cabeza cae de sus hombros."
 single_combat.0041.desc.sc_attacker.POD_fire_spewer.fatality: "Mi siguiente golpe es mucho más preciso, eso sí. Es un corte de cabeza limpio y satisfactorio."
 single_combat.0041.desc.sc_attacker.POD_crossbow_shot.fatality: "Mi siguiente golpe es mucho más preciso, eso sí. Es un corte de cabeza limpio y satisfactorio."
 single_combat.0041.desc.sc_attacker.POD_unleash_dogs.fatality: "En represalia, le lanzo uno de sus propios perros. Lo atrapa por reflejos, dándome tiempo más que suficiente para asestar un golpe crítico."
 single_combat.0041.desc.sc_attacker.POD_stake_attack.fatality: "Sin embargo, no esquiva fácilmente el puñetazo en la cara que le sigue. Ni el siguiente, hasta que su cabeza cae de sus hombros."
 single_combat.0041.desc.sc_attacker.POD_oculi_trust.fatality: "Mi implacable asalto lo empuja rápidamente hacia atrás. Acorralado, cae al suelo, indefenso."
 single_combat.0041.desc.sc_attacker.POD_oculi_wine.fatality: "Sin embargo, no esquiva fácilmente el puñetazo en la cara que le sigue. Ni el siguiente, hasta que su cabeza cae de sus hombros."
 single_combat.0041.desc.sc_attacker.POD_acre_catechumen.fatality: "Mi contraataque le pilla desprevenido y conecta. El fin llega con un destello de acero."
 single_combat.0041.desc.sc_attacker.POD_acre_flesh.fatality: "Duele bastante. Lo suficiente como para distraerle del siguiente golpe. Este último no duele por mucho tiempo."
 single_combat.0041.desc.sc_attacker.POD_acre_flight.fatality: "O incluso superarle, mientras lo empujo hacia atrás. Y hacia atrás. Hasta que no le quede ningún lugar a donde ir."
 single_combat.0041.desc.sc_attacker.POD_acre_auto.fatality: "Sin embargo, no esquiva fácilmente el puñetazo en la cara que le sigue. Ni el siguiente, hasta que su cabeza cae de sus hombros."
 single_combat.0041.desc.sc_attacker.POD_murnau_mirror.fatality: "Es empujado hacia atrás, apenas pudiendo seguir el ritmo. ¡Está muy por debajo de su nivel!"
 single_combat.0041.desc.sc_attacker.POD_murnau_arcana.fatality: "Este explotó directamente en su cara. Y luego explotó también su cara."
 single_combat.0041.desc.sc_attacker.POD_sisters_hosanna.fatality: "Mi contraataque le pilla desprevenido y conecta. El fin llega con un destello de acero."
 single_combat.0041.desc.sc_attacker.POD_sisters_oratorio.fatality: "Mi contraataque le pilla desprevenido y conecta. El fin llega con un destello de acero."
 single_combat.0041.desc.sc_attacker.POD_bone_obedience.fatality: "Es empujado hacia atrás, apenas pudiendo seguir el ritmo. ¡Está muy por debajo de su nivel!"
 single_combat.0041.desc.sc_attacker.POD_five_poison_cloud.fatality: "Sin embargo, no esquiva fácilmente el puñetazo en la cara que le sigue. Ni el siguiente, hasta que su cabeza cae de sus hombros."
 single_combat.0041.desc.sc_attacker.POD_ching_shih.fatality: "Está herido, pero sigue en pie. Hasta que deja de estarlo. Termina como empezó: en la oscuridad."
 single_combat.0041.desc.sc_attacker.POD_long_neck.fatality: "Yo no lo hago, y mi oponente queda herido. Lo bastante grave como para que el resto del combate sea un asunto asegurado."
 single_combat.0041.desc.sc_attacker.POD_bloodlash.fatality: "Antes de conectar con un golpe rápido que le hiere. Lo bastante grave como para que el resto del combate sea una conclusión inevitable."
 single_combat.0041.desc.sc_attacker.POD_goblin_scorch.fatality: "Sin embargo, no esquiva fácilmente el puñetazo en la cara que le sigue. Ni el siguiente, hasta que su cabeza cae de sus hombros."
