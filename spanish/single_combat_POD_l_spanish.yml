#Defender Lost, Opponent Finishing Move Injury
#Example: "I try to switch to an appropriate parry, but it's too late, and the dagger's pommel catches me hard in the cheek.\n\nMy grip on my weapon slacks, and I feel it clatter out of my hand, vision swimming from the blow."
 single_combat.0031.desc.opponent_response.POD_bite.injury: "Y logra impactar, con el embriagador aroma de la sangre impregnando el aire. Apenas logro zafarme de este abrazo mortal antes de que sea demasiado tarde."
 single_combat.0031.desc.opponent_response.POD_blood_surge.injury: "Incluso desde mi posición, puedo ver cómo se erguen más altos y fuertes, fortalecidos por la sangre."
 single_combat.0031.desc.opponent_response.POD_blood_heal.injury: "Todo mi arduo trabajo desaparece ante mis ojos mientras el poder de la sangre sana a mi enemigo."
 single_combat.0031.desc.opponent_response.POD_blink.injury: "Y no tengo nada, pronto reducido a recuperarme, con dificultad, del embate."
 single_combat.0031.desc.opponent_response.POD_lightning_strike.injury: "Y lo hacen, pronto me veo repelido por este ataque inesperado."
 single_combat.0031.desc.opponent_response.POD_split_second.injury: "No estoy lo suficientemente preparado, y un fuerte golpe viene hacia mí, demasiado rápido para ser evitado por mi percepción alterada del tiempo."
 single_combat.0031.desc.opponent_response.POD_unerring_aim.injury: "No puedo hacer más que recibirlo, sintiendo cómo mi carne no-muerta protesta ante este maltrato."
 single_combat.0031.desc.opponent_response.POD_lethal_body.injury: "Pronto apenas logro levantarme, sintiendo como si una casa entera se hubiera derrumbado sobre mí."
 single_combat.0031.desc.opponent_response.POD_brutal_feed.injury: "Logro zafarme de este abrazo mortal, pero no antes de haber sentido el agudo dolor causado por los colmillos de mi oponente."
 single_combat.0031.desc.opponent_response.POD_earthshock.injury: "Me caigo y mi oponente aprovecha esta oportunidad para golpearme brutalmente. Apenas evito que el golpe me dé en el cuello."
 single_combat.0031.desc.opponent_response.POD_fist_of_caine.injury: "Esta tempestad es como dagas contra mi piel, desgarrando grandes jirones de mi carne no-muerta con cada movimiento."
 single_combat.0031.desc.opponent_response.POD_toughness.injury: "Nada parece ser capaz de atravesar esta defensa. Me agoto intentando romperla."
 single_combat.0031.desc.opponent_response.POD_flesh_of_marble.injury: "Nada parece ser capaz de atravesar esta defensa. Me agoto intentando romperla."
 single_combat.0031.desc.opponent_response.POD_prowess_from_pain.injury: "Impulsado por este terrible poder, mi oponente asesta un golpe atroz que me hace retroceder tambaleante."
 single_combat.0031.desc.opponent_response.POD_feral_weapons.injury: "Y casi ocurre, ya que apenas logro evitar un zarpazo que seguramente sería fatal."
 single_combat.0031.desc.opponent_response.POD_shapechange.injury: "Sorprendido por este cambio repentino, soy golpeado y tengo que repeler furiosamente al monstruo."
 single_combat.0031.desc.opponent_response.POD_vanish.injury: "Por lo tanto, no veo venir el siguiente golpe por mi espalda. Y duele."
 single_combat.0031.desc.opponent_response.POD_nocturne.injury: "Por lo tanto, no veo venir el siguiente golpe por mi espalda. Y duele."
 single_combat.0031.desc.opponent_response.POD_arms_of_ahriman.injury: "Evito uno de ellos, pero no el segundo... y estas cosas duelen."
 single_combat.0031.desc.opponent_response.POD_the_darkness_within.injury: "De repente saltan dentro de mi boca, y tengo que usar toda mi Fuerza de Voluntad para expulsarlos."
 single_combat.0031.desc.opponent_response.POD_aegis_of_shadows.injury: "Nada parece ser capaz de atravesar esta defensa. Me agoto intentando romperla."
 single_combat.0031.desc.opponent_response.POD_compel.injury: "Me toma desprevenido, y pronto me estoy recuperando de un golpe asestado mientras estaba distraído."
 single_combat.0031.desc.opponent_response.POD_terminal_decree.injury: "Lo cual obedezco, sintiendo primero la humillación y luego el dolor."
 single_combat.0031.desc.opponent_response.POD_daunt.injury: "Me toma desprevenido, y pronto me estoy recuperando de un golpe asestado mientras estaba distraído."
 single_combat.0031.desc.opponent_response.POD_dread_gaze.injury: "Me toma desprevenido, y pronto me estoy recuperando de un golpe asestado mientras estaba distraído."
 single_combat.0031.desc.opponent_response.POD_extinguish_vitae.injury: "Como tal, de repente me siento bastante más débil y la Bestia ruge con ira."
 single_combat.0031.desc.opponent_response.POD_scorpions_touch.injury: "Tras ser golpeado por ello, me siento enfermo y mis movimientos son lentos."
 single_combat.0031.desc.opponent_response.POD_theft_of_vitae.injury: "¡Soy impotente para detenerlo, mi preciosa sangre!"
 single_combat.0031.desc.opponent_response.POD_baals_curse.injury: "Herido por ello, me siento enfermo y mis movimientos son lentos."
 single_combat.0031.desc.opponent_response.POD_cauldron_of_blood.injury: "¡Quema, quema!"
 single_combat.0031.desc.opponent_response.POD_touch_of_oblivion.injury: "Mi sangre se mezcla de repente con sombras agresivas que intentan apoderarse de mí. No es una experiencia agradable."
 single_combat.0031.desc.opponent_response.POD_stygian_shroud.injury: "Por lo tanto, no veo venir el siguiente golpe por mi espalda. Y duele."
 single_combat.0031.desc.opponent_response.POD_fire_torch.injury: "Apenas lo esquivo, pero no antes de que parte del fuego me queme la carne."
 single_combat.0031.desc.opponent_response.POD_fire_bombs.injury: "Apenas lo esquivo, pero no antes de que parte del fuego me queme la carne."
 single_combat.0031.desc.opponent_response.POD_fire_spewer.injury: "Apenas lo esquivo, pero no antes de que parte del fuego me queme la carne."
 single_combat.0031.desc.opponent_response.POD_crossbow_shot.injury: "Me golpea con un sonido resonante y soy repelido en esta ronda."
 single_combat.0031.desc.opponent_response.POD_unleash_dogs.injury: "Los despacho, pero no lo suficientemente rápido; logran desgarrarme durante un tiempo."
 single_combat.0031.desc.opponent_response.POD_stake_attack.injury: "La estaca falla mi corazón, pero aun así me roza con bastante dolor."
 single_combat.0031.desc.opponent_response.POD_oculi_trust.injury: "Por lo tanto, soy incapaz de evitar el siguiente golpe que viene hacia mí."
 single_combat.0031.desc.opponent_response.POD_oculi_wine.injury: "Estoy herido, y parte de mi carne se convierte en cenizas antes de que pueda reaccionar."
 single_combat.0031.desc.opponent_response.POD_acre_catechumen.injury: "El siguiente golpe que me asesta es especialmente doloroso."
 single_combat.0031.desc.opponent_response.POD_acre_flesh.injury: "No puedo romper la defensa de mi oponente, y el contraataque es doloroso."
 single_combat.0031.desc.opponent_response.POD_acre_flight.injury: "Por lo tanto, soy incapaz de evitar el siguiente golpe que viene hacia mí."
 single_combat.0031.desc.opponent_response.POD_acre_auto.injury: "No del todo, pero sigue siendo muy doloroso mientras retrocedo ante ello."
 single_combat.0031.desc.opponent_response.POD_murnau_mirror.injury: "Por lo tanto, soy incapaz de evitar el siguiente golpe que viene hacia mí."
 single_combat.0031.desc.opponent_response.POD_murnau_arcana.injury: "Sorprendid[ROOT.Char.Custom('ES_OA')] por el efecto secundario, me duele bastante."
 single_combat.0031.desc.opponent_response.POD_sisters_hosanna.injury: "El siguiente golpe que me asesta es especialmente doloroso."
 single_combat.0031.desc.opponent_response.POD_sisters_oratorio.injury: "Por lo tanto, soy incapaz de evitar el siguiente golpe que viene hacia mí."
 single_combat.0031.desc.opponent_response.POD_bone_obedience.injury: "No puedo romper la defensa de mi oponente, y el contraataque es doloroso."
 single_combat.0031.desc.opponent_response.POD_five_poison_cloud.injury: "Estoy envuelt[ROOT.Char.Custom('ES_OA')] en ello y apenas logro escapar antes de que sea demasiado tarde."
 single_combat.0031.desc.opponent_response.POD_ching_shih.injury: "Más rápido, más robusto y más fuerte que yo, no tengo ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_long_neck.injury: "Por lo tanto, soy incapaz de evitar el siguiente golpe que viene hacia mí."
 single_combat.0031.desc.opponent_response.POD_bloodlash.injury: "Me ha sorprendido y el asalto me ha hecho retroceder rápidamente."
 single_combat.0031.desc.opponent_response.POD_goblin_scorch.injury: "Estoy envuelt[ROOT.Char.Custom('ES_OA')] en ello y apenas logro escapar antes de que sea demasiado tarde."
 single_combat.0031.desc.opponent_response.POD_goblin_lantern.injury: "Esta extraña táctica me ha sorprendido y he sufrido graves quemaduras antes de recuperar el sentido."
 single_combat.0031.desc.opponent_response.POD_bone_dance.injury: "Por lo tanto, soy incapaz de evitar el siguiente golpe que viene hacia mí."
 single_combat.0031.desc.opponent_response.POD_dragon_dance.injury: "Más rápido, más robusto y más fuerte que yo, no tengo ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_chi_interrupt.injury: "Recibo un golpe, pero logro evitar el segundo. Aun así, duele."
 single_combat.0031.desc.opponent_response.POD_thousand_hell_stare.injury: "En este difícil estado mental, soy incapaz de defenderme adecuadamente."
 single_combat.0031.desc.opponent_response.POD_wind_attack.injury: "Por lo tanto, soy incapaz de evitar el siguiente golpe que viene hacia mí."
 single_combat.0031.desc.opponent_response.POD_demon_claws.injury: "Más rápido, más robusto y más fuerte que yo, no tengo ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_tormented_essence.injury: "En este difícil estado mental, soy incapaz de defenderme adecuadamente."
 single_combat.0031.desc.opponent_response.POD_adramelechs_wrath.injury: "Más rápido, más robusto y más fuerte que yo, no tengo ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_blood_atemi.injury: "Recibo un golpe, pero logro evitar el segundo. Aun así, duele."
 single_combat.0031.desc.opponent_response.POD_stand_upon_the_dragons_back.injury: "Ni siquiera puedo devolver el golpe a mi oponente, y el contraataque es doloroso."
 single_combat.0031.desc.opponent_response.POD_dragon_ward.injury: "No puedo romper la defensa de mi oponente, y el contraataque es doloroso."
 single_combat.0031.desc.opponent_response.POD_typhonic_maw.injury: "La Mandíbula Typhónica me araña. Y esta cosa infernal duele."
 single_combat.0031.desc.opponent_response.POD_cobra_fangs.injury: "Un colmillo venenoso me araña; no lo suficiente como para ser mortal, pero sí lo suficiente como para preocuparme..."
 single_combat.0031.desc.opponent_response.POD_snout_strike.injury: "Una estocada corta y viciosa me ha golpeado; no lo suficiente como para ser mortal, pero sí lo suficiente como para preocuparme..."
 single_combat.0031.desc.opponent_response.POD_chi_breaker.injury: "Mi oponente ha hundido su mano en mi torso; no lo suficiente como para ser mortal, pero sí lo suficiente como para preocuparme..."
 single_combat.0031.desc.opponent_response.POD_hundred_star_shower.injury: "El impacto de los proyectiles cargados de Chi es mucho mayor de lo que sería en circunstancias normales. ¡Duele!"
 single_combat.0031.desc.opponent_response.POD_jaw_hammer.injury: "Tengo la mandíbula rota; no lo suficiente como para ser mortal, pero sí lo suficiente como para preocuparme..."
 single_combat.0031.desc.opponent_response.POD_fading_light_strike.injury: "Me han robado mi poder; no lo suficiente como para ser mortal, pero sí lo suficiente como para preocuparme..."
 single_combat.0031.desc.opponent_response.POD_chain_snake.injury: "Mi ataque es bloqueado y, al mismo tiempo, un extremo de la cadena me golpea en la cara."
 single_combat.0031.desc.opponent_response.POD_twisting_thrust.injury: "Un corte profundo en mi cuerpo; no lo suficiente como para ser mortal, pero sí lo suficiente como para preocuparme..."
 single_combat.0031.desc.opponent_response.POD_prone_attacks.injury: "No puedo romper la defensa de mi oponente, y el contraataque es doloroso."
 single_combat.0031.desc.opponent_response.POD_dagger_claw.injury: "Más rápido, más robusto y más fuerte que yo, no tengo ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_spark_of_ra.injury: "La bola de fuego me alcanza, quemándome."
 single_combat.0031.desc.opponent_response.POD_deaths_hand.injury: "La energía espectral me golpea, causándome dolor."
 single_combat.0031.desc.opponent_response.POD_ashes_to_ashes.injury: "Partes de mi carne se desecar por el hechizo de mi oponente."
 single_combat.0031.desc.opponent_response.POD_dust_to_dust.injury: "Mi oponente me toca y siento que mi carne se transforma en arcilla negra."
 single_combat.0031.desc.opponent_response.POD_khaibits_embrace.injury: "No puedo liberarme del agarre de mi oponente y las sombras me hieren."
 single_combat.0031.desc.opponent_response.POD_serqets_sting.injury: "Siento el ardor del veneno en mis venas."
 single_combat.0031.desc.opponent_response.POD_voracious_scarab_of_nyarashahim.injury: "Siento al escarabajo voraz excavar en mi carne."
 single_combat.0031.desc.opponent_response.POD_spear_of_anubis.injury: "Siento el mordisco de la lanza de mi enemigo."
 single_combat.0031.desc.opponent_response.POD_feral_clawing.injury: "Y siento el rasguño de las garras de mi enemigo."
 single_combat.0031.desc.opponent_response.POD_feral_bite.injury: "Siento dolor mientras mi oponente me arranca un trozo de carne."
 single_combat.0031.desc.opponent_response.POD_feral_assault.injury: "Soy incapaz de escapar del furioso ataque de mi oponente. Me ha dado."
 single_combat.0031.desc.opponent_response.POD_feral_taunt.injury: "Mientras me distraigo con las crueles palabras de mi enemigo, [my_foe.GetSheHe] me ataca."
 single_combat.0031.desc.opponent_response.POD_feral_evasion.injury: "Esquivando todos mis ataques, mi oponente me golpea con rapidez, atravesando mi guardia."
 single_combat.0031.desc.opponent_response.POD_jaw_lock.injury: "Mi oponente daña mi extremidad mientras la mantiene bloqueada en su sitio."
 single_combat.0031.desc.opponent_response.POD_hamstring.injury: "Mi enemigo daña mi extremidad mientras la muerde furiosamente."
 single_combat.0031.desc.opponent_response.POD_leaping_rake.injury: "Mi enemigo salta directamente hacia mí, hiriéndome con [my_foe.GetHerHis] garras."
 single_combat.0031.desc.opponent_response.POD_wishbone.injury: "Siento dolor mientras mi oponente desgarra mi carne."
 single_combat.0031.desc.opponent_response.POD_manipulate_inertia.injury: "Y no tengo nada, pronto reducido a recuperarme, con dificultad, del embate."
 single_combat.0031.desc.opponent_response.POD_manipulate_acceleration.injury: "Y no tengo nada, pronto reducido a recuperarme, con dificultad, del embate."
 single_combat.0031.desc.opponent_response.POD_manipulate_cohesion.injury: "Y no tengo nada, pronto reducido a recuperarme, con dificultad, del embate."
 single_combat.0031.desc.opponent_response.POD_dragons_breath.injury: "Esquivo para evitar que me conviertan en cenizas, pero las llamas me alcanzan y me dejan quemaduras dolorosas. Tengo que rendirme antes de que el próximo ataque me convierta en un montón de cenizas."
 single_combat.0031.desc.opponent_response.POD_bark_mudpuppy.injury: "El ruido desgarra mi piel con tanta violencia que se me abren heridas por todas partes, como si me hubieran cortado con cuchillos incontables veces. Mientras aprieto los dientes de dolor, [sc_victor.GetFirstNameNoTooltip] se prepara para el golpe de gracia y me doy cuenta de que estoy completamente acabado."
 single_combat.0031.desc.opponent_response.POD_clap_of_thunder.injury: "Me quedo desorientad[ROOT.Char.Custom('ES_OA')] mientras el estruendo hace que me zumben los oídos y me maree la vista. Cuando recobro el sentido, [sc_victor.GetFirstNameNoTooltip] ya ha aprovechado mi falta de concentración y me ha desarmado."
 single_combat.0031.desc.opponent_response.POD_dragon_slash.injury: "No tengo respuesta ante la implacable ofensiva de [sc_victor.GetHerHis], y cuando [sc_victor.GetSheHe] se lanza al agarre y me tira al suelo, no me queda más que admitir la derrota."

#Defender Lost, Opponent Finishing Move Fatality
#Example: "The blow carves into my chest, and a veritable fountain of gore pours from the wound.\n\nPerhaps it was folly going up against a [sc_victor.GetWomanMan] who kills for sport so regularly? Maybe so, maybe not. Either way, the fast-spreading numbness in my limbs tells me I don't have long to rue my mistakes."
 single_combat.0031.desc.opponent_response.POD_bite.fatality: "Y conecta; el embriagador aroma de la sangre impregna el aire. Es demasiado tarde para escapar, pues me pierdo en el éxtasis del Beso. El resto es historia, pero ya no es mía."
 single_combat.0031.desc.opponent_response.POD_blood_surge.fatality: "Incluso desde mi posición, puedo ver cómo se erguen más altos y fuertes, potenciados por la sangre. De repente, mucho más fuertes y rápidos, ni siquiera veo venir el golpe antes de ser cortad[ROOT.Char.Custom('ES_OA')] por la mitad."
 single_combat.0031.desc.opponent_response.POD_blood_heal.fatality: "Todo mi arduo trabajo desaparece ante mis ojos mientras el poder de la sangre sana a mi enemigo. De repente, mucho más fuerte y rápido, ni siquiera veo venir el golpe antes de ser partido por la mitad."
 single_combat.0031.desc.opponent_response.POD_blink.fatality: "Y no tengo nada. El embate nunca cesa, o al menos no mientras siga con vida."
 single_combat.0031.desc.opponent_response.POD_lightning_strike.fatality: "Y lo hacen; pronto me veo repelido por este ataque inesperado. Mi oponente aprovecha esta oportunidad para golpearme de nuevo y me desplomo contra el suelo, impotente para detener el golpe final."
 single_combat.0031.desc.opponent_response.POD_split_second.fatality: "No estoy lo suficientemente preparado, y un golpe contundente viene hacia mí, demasiado rápido para que mi percepción alterada del tiempo pueda evitarlo. Será lo último que sienta jamás."
 single_combat.0031.desc.opponent_response.POD_unerring_aim.fatality: "No puedo hacer otra cosa que recibirlo de lleno entre los ojos. Mi oponente sonríe con desdén mientras caigo hacia atrás, ya sin fuerzas para protegerme."
 single_combat.0031.desc.opponent_response.POD_lethal_body.fatality: "Sintiéndome como si una casa entera se derrumbara sobre mí, apenas logro levantarme para ver cómo mi oponente me sujeta la cabeza entre las manos y... El fin."
 single_combat.0031.desc.opponent_response.POD_brutal_feed.fatality: "Y conecta; el embriagador aroma de la sangre impregna el aire. Es demasiado tarde para escapar, pues me pierdo en el éxtasis del Beso. El resto es historia, pero ya no es mía."
 single_combat.0031.desc.opponent_response.POD_earthshock.fatality: "Caigo y mi oponente aprovecha esta oportunidad para golpearme brutalmente. No puedo evitar que el golpe impacte en mi cuello. Mi cabeza rueda por el suelo y se detiene a los pies de mi oponente."
 single_combat.0031.desc.opponent_response.POD_fist_of_caine.fatality: "Esta tempestad es como dagas contra mi piel, desgarrando grandes jirones de mi carne no-muerta con cada movimiento. Quedo reducido rápidamente a un esqueleto, y aún más rápido a cenizas."
 single_combat.0031.desc.opponent_response.POD_toughness.fatality: "Nada parece ser capaz de atravesar esta defensa. Me agoto intentando romperla. No veo venir el contraataque, y no volveré a ver nada jamás."
 single_combat.0031.desc.opponent_response.POD_flesh_of_marble.fatality: "Nada parece ser capaz de atravesar esta defensa. Me agoto intentando romperla. No veo venir el contraataque, y no volveré a ver nada jamás."
 single_combat.0031.desc.opponent_response.POD_prowess_from_pain.fatality: "Impulsado por este poder terrible, mi oponente asesta un golpe devastador que reduce mi corazón no-muerto a la nada. Se oye un sonido doloroso mientras todo se oscurece."
 single_combat.0031.desc.opponent_response.POD_feral_weapons.fatality: "Y sucede; lo único que me salva es que no duele por mucho tiempo."
 single_combat.0031.desc.opponent_response.POD_shapechange.fatality: "Sorprendido por este cambio repentino, soy golpeado y pronto cornado hasta la muerte definitiva por este monstruo."
 single_combat.0031.desc.opponent_response.POD_vanish.fatality: "Por tanto, no veo venir el siguiente golpe desde mi espalda. Y me desgarra las entrañas, dejando un rastro de sangre por todas partes mientras exploto en vísceras y sangre."
 single_combat.0031.desc.opponent_response.POD_nocturne.fatality: "Por tanto, no veo venir el siguiente golpe desde mi espalda. Y me desgarra las entrañas, dejando un rastro de sangre por todas partes mientras exploto en vísceras y sangre."
 single_combat.0031.desc.opponent_response.POD_arms_of_ahriman.fatality: "Evito uno de ellos, pero no el segundo... y eso me lanza de vuelta hacia el primero. Sirvo de saco de boxeo durante un rato antes de que todo se oscurezca."
 single_combat.0031.desc.opponent_response.POD_the_darkness_within.fatality: "De repente saltan dentro de mi boca y tengo que usar toda mi Fuerza de Voluntad para expulsarlos. No lo consigo a tiempo y mi sangre, junto con mi ser, desaparece en la oscuridad."
 single_combat.0031.desc.opponent_response.POD_aegis_of_shadows.fatality: "Nada parece ser capaz de atravesar esta defensa. Me agoto intentando romperla. No veo venir el contraataque, y no volveré a ver nada jamás."
 single_combat.0031.desc.opponent_response.POD_compel.fatality: "Me toma desprevenido, y pronto estoy demasiado distraído para ver el golpe que viene a continuación. Y es el último."
 single_combat.0031.desc.opponent_response.POD_terminal_decree.fatality: "Lo cual cumplo obedientemente, matándome lentamente mientras mi oponente se ríe todo el tiempo. Mi último pensamiento es el deseo de que nadie sepa jamás cómo morí."
 single_combat.0031.desc.opponent_response.POD_daunt.fatality: "Me toma desprevenido, y pronto estoy demasiado distraído para ver el golpe que viene a continuación. Y es el último."
 single_combat.0031.desc.opponent_response.POD_dread_gaze.fatality: "Me toma desprevenido, y pronto estoy demasiado distraído para ver el golpe que viene a continuación. Y es el último."
 single_combat.0031.desc.opponent_response.POD_extinguish_vitae.fatality: "De este modo, de repente me siento bastante más débil y la Bestia ruge con ira. Sin embargo, no será por mucho tiempo, ya que mi oponente aprovecha mi distracción para asestar un golpe perfecto en mi cuello. ¿Quién necesita una cabeza, después de todo?"
 single_combat.0031.desc.opponent_response.POD_scorpions_touch.fatality: "Aturdido por ello, me siento enfermo y mis movimientos son lentos. En este lamentable estado, soy rápidamente superado por mi enemigo, que tiene la piedad de darme una muerte rápida en lugar de dejar que el veneno haga su trabajo."
 single_combat.0031.desc.opponent_response.POD_theft_of_vitae.fatality: "Soy impotente para detenerlo; me roban mi preciosa sangre hasta que no queda nada. Y sin sangre... cenizas es todo lo que queda."
 single_combat.0031.desc.opponent_response.POD_baals_curse.fatality: "Herido por ello, me siento enfermo y mis movimientos son lentos. En este lamentable estado, soy rápidamente superado por mi enemigo, que tiene la piedad de darme una muerte rápida en lugar de dejar que el veneno haga su trabajo."
 single_combat.0031.desc.opponent_response.POD_cauldron_of_blood.fatality: "¡Quema, quema! ¡Me he convertido en fuego!... y pronto en cenizas."
 single_combat.0031.desc.opponent_response.POD_touch_of_oblivion.fatality: "Mi sangre se mezcla repentinamente con sombras agresivas que intentan apoderarse de mí. A medida que mi fuerza vital se drena, me desplomo contra el suelo, reducido pronto a un montón de cenizas y oscuridad turbulenta."
 single_combat.0031.desc.opponent_response.POD_stygian_shroud.fatality: "Por tanto, no veo venir el siguiente golpe desde mi espalda. Y me desgarra las entrañas, dejando un rastro de sangre por todas partes mientras exploto en vísceras y sangre."
 single_combat.0031.desc.opponent_response.POD_fire_torch.fatality: "El fuego me envuelve por completo y pronto, todo es ceniza."
 single_combat.0031.desc.opponent_response.POD_fire_bombs.fatality: "El fuego me envuelve por completo y pronto, todo es ceniza."
 single_combat.0031.desc.opponent_response.POD_fire_spewer.fatality: "El fuego me envuelve por completo y pronto, todo es ceniza."
 single_combat.0031.desc.opponent_response.POD_crossbow_shot.fatality: "Me golpea entre los ojos y luego emerge por la parte trasera de mi cuerpo. Todo es dolor. Luego, oscuridad."
 single_combat.0031.desc.opponent_response.POD_unleash_dogs.fatality: "Pronto estoy en el suelo, apenas logrando repeler a estas bestias. Mi oponente se cierne sobre mí y ataca mi cuerpo indefenso..."
 single_combat.0031.desc.opponent_response.POD_stake_attack.fatality: "La estaca atraviesa mi corazón y todo se oscurece."
 single_combat.0031.desc.opponent_response.POD_oculi_trust.fatality: "Por tanto, soy incapaz de evitar el siguiente ataque que viene hacia mí. Y el siguiente. Y... hasta que no queda nada que ver."
 single_combat.0031.desc.opponent_response.POD_oculi_wine.fatality: "Estoy herido, y mi carne se convierte en cenizas antes de que pueda hacer nada. Al menos, un final rápido."
 single_combat.0031.desc.opponent_response.POD_acre_catechumen.fatality: "El siguiente golpe que me asesta es, en efecto, el definitivo, partiéndome por la mitad mientras mis restos caen al suelo."
 single_combat.0031.desc.opponent_response.POD_acre_flesh.fatality: "No puedo romper la defensa de mi oponente, y el contraataque es crítico. No tuve ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_acre_flight.fatality: "Por tanto, soy incapaz de evitar el siguiente ataque que viene hacia mí. Y el siguiente. Y... hasta que no queda nada que ver."
 single_combat.0031.desc.opponent_response.POD_acre_auto.fatality: "El siguiente golpe que me asesta es, en efecto, el definitivo, partiéndome por la mitad mientras mis restos caen al suelo."
 single_combat.0031.desc.opponent_response.POD_murnau_mirror.fatality: "Por tanto, soy incapaz de evitar el siguiente ataque que viene hacia mí. Y el siguiente. Y... hasta que no queda nada que ver."
 single_combat.0031.desc.opponent_response.POD_murnau_arcana.fatality: "Sorprendido, el efecto rebote es crítico y me explota en la cara. Y me hace explotar la cara también."
 single_combat.0031.desc.opponent_response.POD_sisters_hosanna.fatality: "El siguiente golpe que me asesta es un golpe crítico. No tuve ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_sisters_oratorio.fatality: "Por tanto, soy incapaz de evitar el siguiente ataque que viene hacia mí. Y el siguiente. Y... hasta que no queda nada que ver."
 single_combat.0031.desc.opponent_response.POD_bone_obedience.fatality: "No puedo romper la defensa de mi oponente, y el contraataque es crítico. No tuve ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_five_poison_cloud.fatality: "Me envuelve en su nube y muero con una tos venenosa mientras arrastro mi cuerpo por el suelo."
 single_combat.0031.desc.opponent_response.POD_ching_shih.fatality: "Más rápido, más robusto y más fuerte que yo; no tengo oportunidad. Y soy rápidamente eliminado con un golpe veloz y despiadado."
 single_combat.0031.desc.opponent_response.POD_long_neck.fatality: "Por tanto, soy incapaz de evitar el siguiente ataque que viene hacia mí. Y el siguiente. Y... hasta que no queda nada que ver."
 single_combat.0031.desc.opponent_response.POD_bloodlash.fatality: "Me sorprende y soy rápidamente repelido por el asalto. Mi enemigo aprovecha la oportunidad y pronto mi cabeza rueda por el suelo."
 single_combat.0031.desc.opponent_response.POD_goblin_scorch.fatality: "Me envuelve en su fuego y muero en un infierno abrasador."
 single_combat.0031.desc.opponent_response.POD_goblin_lantern.fatality: "Me envuelve en su fuego y muero en un infierno abrasador."
 single_combat.0031.desc.opponent_response.POD_bone_dance.fatality: "Por tanto, soy incapaz de evitar el siguiente ataque que viene hacia mí. Y el siguiente. Y... hasta que no queda nada que ver."
 single_combat.0031.desc.opponent_response.POD_dragon_dance.fatality: "Más rápido, más robusto y más fuerte que yo; no tengo oportunidad. Y soy rápidamente eliminado con un golpe veloz y despiadado."
 single_combat.0031.desc.opponent_response.POD_chi_interrupt.fatality: "Soy golpeado una vez, dos veces, luego tres... con la sangre deteniéndose en mis venas, quedo paralizado. No tarda mucho mi oponente en acabar con mi miseria."
 single_combat.0031.desc.opponent_response.POD_thousand_hell_stare.fatality: "En este difícil estado mental, soy incapaz de defenderme adecuadamente. Es una debilidad fatal, y una de la que no tendré que arrepentirme por mucho tiempo."
 single_combat.0031.desc.opponent_response.POD_wind_attack.fatality: "Por tanto, soy incapaz de evitar el siguiente ataque que viene hacia mí. Y el siguiente. Y... hasta que no queda nada que ver."
 single_combat.0031.desc.opponent_response.POD_demon_claws.fatality: "Más rápido, más robusto y más fuerte que yo; no tengo oportunidad. Y soy rápidamente eliminado con un golpe veloz y despiadado."
 single_combat.0031.desc.opponent_response.POD_tormented_essence.fatality: "En este difícil estado mental, soy incapaz de defenderme adecuadamente. Es una debilidad fatal, y una de la que no tendré que arrepentirme por mucho tiempo."
 single_combat.0031.desc.opponent_response.POD_adramelechs_wrath.fatality: "Más rápido, más robusto y más fuerte que yo; no tengo oportunidad. Y soy rápidamente eliminado con un golpe veloz y despiadado."
 single_combat.0031.desc.opponent_response.POD_blood_atemi.fatality: "Soy golpeado una vez, dos veces, luego tres... con mi sistema circulatorio volviéndose loco, quedo paralizado. No tarda mucho mi oponente en acabar con mi miseria."
 single_combat.0031.desc.opponent_response.POD_stand_upon_the_dragons_back.fatality: "Ni siquiera puedo devolver el golpe a mi oponente, y el contraataque es crítico. No tuve ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_dragon_ward.fatality: "No puedo romper la defensa de mi oponente, y el contraataque es crítico. No tuve ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_typhonic_maw.fatality: "La Mandíbula Tifónica me envuelve, terminando con mi vida inmortal en pozos de ácido estomacal."
 single_combat.0031.desc.opponent_response.POD_cobra_fangs.fatality: "Un colmillo venenoso me alcanza. El veneno se extiende rápidamente por mi sangre, convirtiéndola, y luego a mí, en ácido. Mi fin apesta a azufre y suena como la risa de mi oponente."
 single_combat.0031.desc.opponent_response.POD_snout_strike.fatality: "Un agarre en mi hocico. Soy despachado rápidamente con un golpe veloz y despiadado."
 single_combat.0031.desc.opponent_response.POD_chi_breaker.fatality: "Mi oponente ha clavado su mano en mi torso; mi flujo se ha visto interrumpido. Lo suficiente como para que el resto del combate sea una cuestión segura."
 single_combat.0031.desc.opponent_response.POD_hundred_star_shower.fatality: "El impacto de los proyectiles cargados de Chi es mucho mayor de lo que sería en circunstancias normales. No tuve ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_jaw_hammer.fatality: "Mi mandíbula está rota. Mi cráneo también."
 single_combat.0031.desc.opponent_response.POD_fading_light_strike.fatality: "Me han robado mi poder. Lo suficiente como para que el resto del combate sea una cuestión segura."
 single_combat.0031.desc.opponent_response.POD_chain_snake.fatality: "Mi ataque es bloqueado; al mismo tiempo, un extremo de la cadena golpea mis órganos vitales."
 single_combat.0031.desc.opponent_response.POD_twisting_thrust.fatality: "Un corte profundo en mi cuerpo. No tuve ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_prone_attacks.fatality: "No puedo romper la defensa de mi oponente, y el contraataque es crítico. No tuve ninguna oportunidad."
 single_combat.0031.desc.opponent_response.POD_dagger_claw.fatality: "Más rápido, más robusto y más fuerte que yo; no tengo oportunidad. Y soy rápidamente eliminado con un golpe veloz y despiadado."
 single_combat.0031.desc.opponent_response.POD_spark_of_ra.fatality: "La bola de fuego impacta y mi visión se oscurece mientras el fuego ardiente domina todos mis sentidos."
 single_combat.0031.desc.opponent_response.POD_deaths_hand.fatality: "La energía espectral me alcanza y mi visión se oscurece."
 single_combat.0031.desc.opponent_response.POD_ashes_to_ashes.fatality: "Mi enemigo lanza un hechizo para transformar mi carne en ceniza. Me desplomo al sentir que mi carne se desecaba."
 single_combat.0031.desc.opponent_response.POD_dust_to_dust.fatality: "Mi oponente me toca. Mi carne empieza a transformarse en arcilla negra. Estoy muriendo."
 single_combat.0031.desc.opponent_response.POD_khaibits_embrace.fatality: "El Abrazo de Khaibit me envuelve por completo. Ahora estoy atrapado."
 single_combat.0031.desc.opponent_response.POD_serqets_sting.fatality: "Siento el veneno arder en mis venas y mi visión se oscurece."
 single_combat.0031.desc.opponent_response.POD_voracious_scarab_of_nyarashahim.fatality: "El escarabajo se abre paso en mi carne, y pronto siento cómo devora mi corazón."
 single_combat.0031.desc.opponent_response.POD_spear_of_anubis.fatality: "Mi oponente rompe mis defensas y me abate."
 single_combat.0031.desc.opponent_response.POD_feral_clawing.fatality: "Siento dolor mientras mi oponente me abate con [my_foe.GetHerHis] garras desnudas."
 single_combat.0031.desc.opponent_response.POD_feral_bite.fatality: "Mi oponente me arranca la cara de un mordisco, rompiendo mis defensas. Caigo al suelo."
 single_combat.0031.desc.opponent_response.POD_feral_assault.fatality: "Golpeándome furiosamente desde todos los flancos, mi oponente rompe mis defensas y me abate."
 single_combat.0031.desc.opponent_response.POD_feral_taunt.fatality: "Mientras estoy distraído por las burlas de mi enemigo, [my_foe.GetSheHe] me abate."
 single_combat.0031.desc.opponent_response.POD_feral_evasion.fatality: "Evadiendo todos mis ataques, mi enemigo atraviesa mi guardia y me abate."
 single_combat.0031.desc.opponent_response.POD_jaw_lock.fatality: "Al intentar bloquear mi extremidad, mi oponente logra romper mis defensas y abatirme."
 single_combat.0031.desc.opponent_response.POD_hamstring.fatality: "Atacando mis extremidades, mi oponente rompe mi defensa y me abate."
 single_combat.0031.desc.opponent_response.POD_leaping_rake.fatality: "Al ser incapaz de esquivar el salto de mi oponente, [my_foe.GetSheHe] me empala con [my_foe.GetHerHis] garras."
 single_combat.0031.desc.opponent_response.POD_wishbone.fatality: "Superponiéndose a mí, mi enemigo me desgarra."
 single_combat.0031.desc.opponent_response.POD_manipulate_inertia.fatality: "Y no tengo nada. El embate nunca cesa, o al menos no mientras siga con vida."
 single_combat.0031.desc.opponent_response.POD_manipulate_acceleration.fatality: "Y no tengo nada. El embate nunca cesa, o al menos no mientras siga con vida."
 single_combat.0031.desc.opponent_response.POD_manipulate_cohesion.fatality: "Y no tengo nada. El embate nunca cesa, o al menos no mientras siga con vida."
 single_combat.0031.desc.opponent_response.POD_dragons_breath.fatality: "El dolor es indescriptible mientras un mar de fuego me envuelve y me quema donde estoy. Lo último que veo es mi reflejo parpadeante en los indiferentes ojos reptilianos de [sc_victor.GetFirstNamePossessiveNoTooltip]."
 single_combat.0031.desc.opponent_response.POD_bark_mudpuppy.fatality: "El ruido desgarra mi piel con tanta violencia que se abren heridas por todas partes, como si me hubieran cortado con cuchillos incontables veces. Mientras aprieto los dientes de dolor, [sc_victor.GetFirstNameNoTooltip] da el golpe de gracia y [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] conecta con mi garganta."
 single_combat.0031.desc.opponent_response.POD_clap_of_thunder.fatality: "Me quedo desorientado mientras el estruendo hace que mis oídos zumben y mi visión se nuble. Sin ser consciente de mi entorno ni de lo que hace mi oponente, mi vida se apaga sin ceremonias."
 single_combat.0031.desc.opponent_response.POD_dragon_slash.fatality: "No tengo respuesta ante la implacable ofensiva de [sc_victor.GetHerHis]. [sc_victor.GetSheHe|U] sigue y sigue, sin detenerse nunca, incluso cuando [sc_victor.GetSheHe] me arranca los brazos, me destripa y me mata a golpes con mi propia columna vertebral."


#Aggressor Lost, Own Combat Move Feedback
#Example: "Splitting my attention between two strikes proves to have been... ambitious. I'm first aware of the [sc_loser.Custom('signature_weapon')] being ripped from my grasp when my offhand-dagger jerks towards it involuntarily,"
 single_combat.0031.desc.sc_attacker.POD_bite: "Mi oponente esquiva sin esfuerzo mi estocada, dejándome totalmente expuesto para un contraataque."
 single_combat.0031.desc.sc_attacker.POD_blood_surge: "No consigo agitar la sangre en mi interior como necesito; cada ápice de concentración es vital para mantenerme por delante de mi enemigo."
 single_combat.0031.desc.sc_attacker.POD_blood_heal: "No consigo agitar la sangre en mi interior como necesito; cada ápice de concentración es vital para mantenerme por delante de mi enemigo."
 single_combat.0031.desc.sc_attacker.POD_blink: "Demasiado lejos y demasiado rápido; me he quedado fuera de posición para el siguiente asalto."
 single_combat.0031.desc.sc_attacker.POD_lightning_strike: "Mi golpe, aunque rápido, carece de precisión y falla."
 single_combat.0031.desc.sc_attacker.POD_split_second: "A pesar del paso distorsionado del tiempo, mi enemigo parece adaptarse bastante bien."
 single_combat.0031.desc.sc_attacker.POD_unerring_aim: "Una puntería perfecta... pero sin fuerza, apenas roza al objetivo."
 single_combat.0031.desc.sc_attacker.POD_lethal_body: "La fuerza no es nada sin precisión, ya que mis poderosos ataques fallan el blanco."
 single_combat.0031.desc.sc_attacker.POD_brutal_feed: "Mis colmillos apenas rozan el cuello de mi oponente, dejándome expuesto a un contraataque."
 single_combat.0031.desc.sc_attacker.POD_earthshock: "Con paso firme, mi oponente apenas se ve afectado por el terremoto."
 single_combat.0031.desc.sc_attacker.POD_fist_of_caine: "El viento provocado por mis ataques potenciados por la Potencia no es más que una leve brisa para mi enemigo."
 single_combat.0031.desc.sc_attacker.POD_toughness: "A pesar de mi resistencia mejorada, los poderosos golpes de mi oponente siguen doliendo como un demonio."
 single_combat.0031.desc.sc_attacker.POD_flesh_of_marble: "El mármol puede romperse, como están demostrando ahora mismo los golpes que hacen temblar la tierra de mi oponente."
 single_combat.0031.desc.sc_attacker.POD_prowess_from_pain: "Incluso un vampiro masoquista tiene límites. Duele demasiado como para ser placentero y útil en este momento."
 single_combat.0031.desc.sc_attacker.POD_feral_weapons: "Mi enemigo esquiva con destreza mis mortales garras, conociendo su peligro."
 single_combat.0031.desc.sc_attacker.POD_shapechange: "Abrumado por los instintos animales, mis ataques son brutales pero carecen de la precisión suficiente para asestar."
 single_combat.0031.desc.sc_attacker.POD_vanish: "Al buscar las pequeñas inconsistencias en el área, mi oponente logra detectarme."
 single_combat.0031.desc.sc_attacker.POD_nocturne: "Mi enemigo apenas parece ralentizado por las sombras; sigue luchando a su máximo nivel."
 single_combat.0031.desc.sc_attacker.POD_arms_of_ahriman: "Moviéndose rápidamente para apartarse, mi oponente logra ponerse fuera de mi alcance."
 single_combat.0031.desc.sc_attacker.POD_the_darkness_within: "No se presenta ninguna oportunidad; mi enemigo evita las sombras arremolinadas casi a la perfección."
 single_combat.0031.desc.sc_attacker.POD_aegis_of_shadows: "Así como la luz disipa la oscuridad, los poderosos movimientos de mi oponente destrozan mi armadura de sombras."
 single_combat.0031.desc.sc_attacker.POD_compel: "En un esfuerzo supremo de Fuerza de Voluntad, mi oponente ignora mi orden."
 single_combat.0031.desc.sc_attacker.POD_terminal_decree: "En un esfuerzo supremo de Fuerza de Voluntad, mi oponente ignora mi orden."
 single_combat.0031.desc.sc_attacker.POD_daunt: "Mi oponente no se siente intimidado en absoluto por mi Presencia mejorada; sigue luchando a su máximo nivel."
 single_combat.0031.desc.sc_attacker.POD_dread_gaze: "Mi oponente parece disfrutar incluso destrozar a su peor pesadilla, haciendo que la mirada de temor sea bastante ineficaz."
 single_combat.0031.desc.sc_attacker.POD_extinguish_vitae: "La sangre de mi oponente es demasiado fuerte para trucos de salón y sigue siendo tan efectiva como siempre."
