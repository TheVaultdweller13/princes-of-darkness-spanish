 single_combat.0031.desc.opponent_response.POD_split_second: "El tiempo se ralentiza a nuestro alrededor mientras la Celeridad surte efecto. Mi oponente sin duda aprovechará esa oportunidad."
 single_combat.0031.desc.opponent_response.POD_unerring_aim: "Gracias a su maestría en la Celeridad, el ataque de mi enemigo es perfectamente preciso."
 single_combat.0031.desc.opponent_response.POD_lethal_body: "Con la fuerza de una avalancha ayudada por la Potencia, mi oponente se lanza hacia mí."
 single_combat.0031.desc.opponent_response.POD_brutal_feed: "Mi enemigo se lanza hacia delante buscando mi cuello, con la esperanza de desangrarme en cuestión de segundos."
 single_combat.0031.desc.opponent_response.POD_earthshock: "Golpeando la tierra, mi enemigo hace que el suelo mismo tiemble bajo nosotros."
 single_combat.0031.desc.opponent_response.POD_fist_of_caine: "Gracias a la Potencia, el aire desplazado por los movimientos de combate de mi enemigo es un arma mortal en sí misma."
