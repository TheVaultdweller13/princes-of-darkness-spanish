#Aggressor Lost, Own Combat Move Injury
#Example: "only for #EMP that#! weapon to be smashed away from me by [sc_victor.GetFirstNamePossessiveNoTooltip] back-swing.\n\nBereft of weapon, backup weapon, and with my opponent preparing to [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')], there's only one thing to do."
 single_combat.0031.desc.sc_attacker.POD_bite.injury: "Y llega rápido, en forma de un puñetazo en la cara."
 single_combat.0031.desc.sc_attacker.POD_blood_surge.injury: "Y la pequeña distracción es suficiente para que mi oponente tome la ventaja con un golpe certero."
 single_combat.0031.desc.sc_attacker.POD_blood_heal.injury: "Y la pequeña distracción es suficiente para que mi oponente tome la ventaja con un golpe certero."
 single_combat.0031.desc.sc_attacker.POD_blink.injury: "Y lo pierdo tan estrepitosamente como anticipaba."
 single_combat.0031.desc.sc_attacker.POD_lightning_strike.injury: "El contraataque de mi oponente no lo hace."
 single_combat.0031.desc.sc_attacker.POD_split_second.injury: "Recibo su siguiente ataque como si nada hubiera pasado."
 single_combat.0031.desc.sc_attacker.POD_unerring_aim.injury: "Al acortar la distancia, mi enemigo me da un puñetazo en las entrañas por mi impudencia."
 single_combat.0031.desc.sc_attacker.POD_lethal_body.injury: "Los de mis oponentes, lamentablemente, no. Y duele."
 single_combat.0031.desc.sc_attacker.POD_brutal_feed.injury: "Y llega rápido, en forma de un puñetazo en la cara."
 single_combat.0031.desc.sc_attacker.POD_earthshock.injury: "Distraído por este fracaso, no veo venir el siguiente golpe."
 single_combat.0031.desc.sc_attacker.POD_fist_of_caine.injury: "Sus golpes son mucho más pesados para mí y pronto me recupero con dificultad de ellos."
 single_combat.0031.desc.sc_attacker.POD_toughness.injury: "Parece que la Fortaleza no ha sido suficiente esta vez."
 single_combat.0031.desc.sc_attacker.POD_flesh_of_marble.injury: "Siento como si estuviera en el centro de un terremoto."
 single_combat.0031.desc.sc_attacker.POD_prowess_from_pain.injury: "Mi oponente se asegura rápidamente de que pronto duela aún más."
 single_combat.0031.desc.sc_attacker.POD_feral_weapons.injury: "Su contraataque no es menos peligroso, y he perdido este asalto."
 single_combat.0031.desc.sc_attacker.POD_shapechange.injury: "Canalizando generaciones de Humanidad para domar la vida salvaje, mi oponente empieza a darme una paliza monumental en mi forma animal."
