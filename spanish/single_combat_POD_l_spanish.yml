 single_combat.0041.desc.opponent_response.POD_spark_of_ra.fatality: "Respondo con una chispa de Ra. Mi oponente es alcanzado por la bola de fuego y muere quemado."
 single_combat.0041.desc.opponent_response.POD_deaths_hand.fatality: "Respondo a mi enemigo con una ráfaga de energía espectral. Cae al suelo."
 single_combat.0041.desc.opponent_response.POD_ashes_to_ashes.fatality: "Esquivo el ataque de mi enemigo y lanzo un hechizo para transformar su carne en cenizas. Se desploma en el suelo mientras comienza a desecarse."
 single_combat.0041.desc.opponent_response.POD_dust_to_dust.fatality: "Esquivo el ataque de mi enemigo y toco su piel. Se desploma mientras su carne se convierte en arcilla negra."
 single_combat.0041.desc.opponent_response.POD_khaibits_embrace.fatality: "Esquivo el ataque de mi enemigo y le agarro la cara. Las sombras lo envuelven."
 single_combat.0041.desc.opponent_response.POD_serqets_sting.fatality: "Respondo con el signo de Serqet. Mi oponente se desploma por el veneno."
 single_combat.0041.desc.opponent_response.POD_voracious_scarab_of_nyarashahim.fatality: "Respondo liberando un escarabajo voraz. Se abre paso profundamente en su interior mientras este cae sometido."
 single_combat.0041.desc.opponent_response.POD_spear_of_anubis.fatality: "Respondo a mi oponente golpeándole con la lanza de Anubis. Cae al suelo."
 single_combat.0041.desc.opponent_response.POD_feral_clawing.fatality: "Contrarresto el ataque de mi oponente, derribándo[my_foe.Custom('ES_OA')] con mis propias garras."
 single_combat.0041.desc.opponent_response.POD_feral_bite.fatality: "Esquivo los ataques de mi enemigo y le arranco [my_foe.GetHerHis] cara de un mordisco."
 single_combat.0041.desc.opponent_response.POD_feral_assault.fatality: "Contrarresto los ataques de mi enemigo, atacando furiosamente y derribándo[my_foe.Custom('ES_OA')]."
 single_combat.0041.desc.opponent_response.POD_feral_taunt.fatality: "Esquivo el ataque de mi enemigo, distrayéndole con mis burlas, y luego le derribo."
 single_combat.0041.desc.opponent_response.POD_feral_evasion.fatality: "Esquivo los ataques de mi enemigo para luego derribár[my_foe.Custom('ES_OA')]."
 single_combat.0041.desc.opponent_response.POD_jaw_lock.fatality: "Contrarresto el ataque de mi enemigo, mordiendo sus extremidades y derribándo[my_foe.Custom('ES_OA')]."
 single_combat.0041.desc.opponent_response.POD_hamstring.fatality: "Contrarresto el ataque de mi enemigo, mordiendo sus extremidades y derribándo[my_foe.Custom('ES_OA')]."
 single_combat.0041.desc.opponent_response.POD_leaping_rake.fatality: "Esquivo los ataques de mi enemigo, lanzándome sobre [my_foe.GetHerHim] para derribár[my_foe.Custom('ES_OA')]."
 single_combat.0041.desc.opponent_response.POD_wishbone.fatality: "Contrarresto los ataques de mi enemigo, partiéndole en dos pedazos."
 single_combat.0041.desc.opponent_response.POD_manipulate_inertia.fatality: "Y no tienen ninguna; mi embestida solo se detiene cuando solo quedan cenizas ante mí."
 single_combat.0041.desc.opponent_response.POD_manipulate_acceleration.fatality: "Y no tienen ninguna; mi embestida solo se detiene cuando solo quedan cenizas ante mí."
 single_combat.0041.desc.opponent_response.POD_manipulate_cohesion.fatality: "Y no tienen ninguna; mi embestida solo se detiene cuando solo quedan cenizas ante mí."
 single_combat.0041.desc.opponent_response.POD_dragons_breath.fatality: "Aprovecho su exceso de confianza y le apuñalo en la garganta mientras aún brilla. Dragón asesinado."
 single_combat.0041.desc.opponent_response.POD_bark_mudpuppy.fatality: "Cierro la distancia y silencio a [sc_loser.GetHerHim] aplastándole la garganta. [sc_loser.GetSheHe|U] no volverá a gritar jamás."
 single_combat.0041.desc.opponent_response.POD_clap_of_thunder.fatality: "Casi parece que el estallido de trueno le afectó más a [sc_loser.GetHerHim] que a mí, y mis rápidos contraataques encuentran poca resistencia. En cuestión de instantes, mi [sc_victor.Custom('signature_weapon')] se clava en la carne y el duelo concluye."
 single_combat.0041.desc.opponent_response.POD_dragon_slash.fatality: "Es casi demasiado fácil dar un paso al lado y descargar mi arma sobre el cuello indefenso de [sc_loser.GetHerHis]. Para ser justos con [sc_loser.GetHerHim], su cuerpo sigue deslizándose hacia adelante un poco, como testimonio de la fuerza del ataque."


#Aggressor Won, Own Combat Move Feedback
#Example: "I swing my [sc_victor.Custom('signature_weapon')] in an almost lazy feint. My opponent doesn't see my off-hand dagger until it's too late, when it's already"
 single_combat.0041.desc.sc_attacker.POD_bite: "Me lanzo hacia adelante, intentando hundir mis colmillos afilados en el tentador cuello que tengo delante."
 single_combat.0041.desc.sc_attacker.POD_blood_surge: "Invoco los poderes de mi sangre para darme fuerzas."
 single_combat.0041.desc.sc_attacker.POD_blood_heal: "Invoco los poderes de mi sangre para cerrar mis heridas y sanarme."
 single_combat.0041.desc.sc_attacker.POD_blink: "Corro hacia adelante más rápido de lo que el ojo puede ver, esperando que mi oponente no tenga forma de anticipar mis movimientos."
 single_combat.0041.desc.sc_attacker.POD_lightning_strike: "Ataco instintivamente con el poder de la Celeridad, intentando pillar a mi oponente desprevenido."
 single_combat.0041.desc.sc_attacker.POD_split_second: "El tiempo se ralentiza a mi alrededor mientras la Celeridad surte efecto. Debo aprovechar esa oportunidad."
 single_combat.0041.desc.sc_attacker.POD_unerring_aim: "Gracias a mi maestría con la Celeridad, mi próximo ataque es perfectamente preciso."
 single_combat.0041.desc.sc_attacker.POD_lethal_body: "La Potencia me permite lanzarme contra mi oponente con la fuerza de una avalancha."
 single_combat.0041.desc.sc_attacker.POD_brutal_feed: "Me lanzo hacia adelante buscando el cuello, esperando exsanguinar a mi oponente en cuestión de segundos."
 single_combat.0041.desc.sc_attacker.POD_earthshock: "Golpeando la tierra, hago que el suelo mismo tiemble bajo nosotros."
 single_combat.0041.desc.sc_attacker.POD_fist_of_caine: "Gracias a la Potencia, el aire desplazado por mis golpes es un arma mortal por sí misma."
 single_combat.0041.desc.sc_attacker.POD_toughness: "Mi carne se vuelve antinaturalmente resistente, esperando bloquear cualquier golpe recibido."
 single_combat.0041.desc.sc_attacker.POD_flesh_of_marble: "Mi carne se convierte en mármol sobrenatural, impermeable a cualquier daño. Con suerte."
 single_combat.0041.desc.sc_attacker.POD_prowess_from_pain: "Mis heridas me alimentan; me vuelvo más fuerte cada segundo."
 single_combat.0041.desc.sc_attacker.POD_feral_weapons: "Tengo las garras extendidas, listas para partir a mi oponente por la mitad."
 single_combat.0041.desc.sc_attacker.POD_shapechange: "Uso mi forma animal para saltar sobre mi oponente primero con los colmillos."
 single_combat.0041.desc.sc_attacker.POD_vanish: "Desaparezco de la vista, intentando confundir a mi oponente."
 single_combat.0041.desc.sc_attacker.POD_nocturne: "Las sombras se arremolinan alrededor de nuestro campo de batalla, dificultando la visión."
 single_combat.0041.desc.sc_attacker.POD_arms_of_ahriman: "Unas tentáculos negros surgen de la tierra e intentan atacar a mi enemigo."
 single_combat.0041.desc.sc_attacker.POD_the_darkness_within: "Las sombras se arremolinan alrededor de mi oponente, buscando una apertura."
 single_combat.0041.desc.sc_attacker.POD_aegis_of_shadows: "Una armadura de sombras aparece a mi alrededor, protegiéndome de cualquier daño."
 single_combat.0041.desc.sc_attacker.POD_compel: "Le doy una orden rápida a mi oponente."
 single_combat.0041.desc.sc_attacker.POD_terminal_decree: "Le doy una orden a mi oponente para que se haga daño."
 single_combat.0041.desc.sc_attacker.POD_daunt: "Me muestro más imponente, más poderoso; espero que sea suficiente para disuadir a mi enemigo."
 single_combat.0041.desc.sc_attacker.POD_dread_gaze: "Me presento como la peor pesadilla de mi enemigo."
 single_combat.0041.desc.sc_attacker.POD_extinguish_vitae: "Con un movimiento de mi mano, vuelvo inerte la sangre de mi oponente."
