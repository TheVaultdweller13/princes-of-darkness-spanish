 single_combat.0001.tt.POD_feral_assault: "#D Atacas furiosamente, dándolo todo.#!" 
 single_combat.0001.POD_feral_taunt: "¡¿Te llamas a ti mismo guerrero?!" 
 single_combat.0001.tt.POD_feral_taunt: "#D Te burlas de tu enemigo.#!" 
 single_combat.0001.POD_feral_evasion: "¡Eres demasiado lento!" 
 single_combat.0001.tt.POD_feral_evasion: "#D Empiezas a esquivar a tu oponente.#!" 
 single_combat.0001.POD_jaw_lock: "¡No podrás moverte!" 
 single_combat.0001.tt.POD_jaw_lock: "#D Muerdes e intentas dejar clavado a tu enemigo en su sitio.#!" 
 single_combat.0001.POD_hamstring: "¡Te arrancaré las extremidades de un mordisco!" 
 single_combat.0001.tt.POD_hamstring: "#D Intentas arrancar las extremidades de tu oponente de un mordisco.#!" 
 single_combat.0001.POD_leaping_rake: "¡Esquiva esto!" 
 single_combat.0001.tt.POD_leaping_rake: "#D Saltas hacia tu oponente, lanzando furiosamente tus garras al mismo tiempo.#!" 
 single_combat.0001.POD_wishbone: "¡Te haré pedazos!" 
 single_combat.0001.tt.POD_wishbone: "#D Con tu fuerza legendaria, intentas despedazar a tu oponente.#!"
 single_combat.0001.POD_manipulate_inertia: "¡No puedo fallar!"
 single_combat.0001.tt.POD_manipulate_inertia: "#D Usando tu Conocimiento de los Fundamentos, atacas sin que [my_foe.GetFirstName] se dé cuenta#!"
 single_combat.0001.POD_manipulate_acceleration: "¡No me verás venir!"
 single_combat.0001.tt.POD_manipulate_acceleration: "#D Usando tu Conocimiento de los Fundamentos, atacas sin que [my_foe.GetFirstName] se dé cuenta#!"
 single_combat.0001.POD_manipulate_cohesion: "¡Te evaporaré!"
 single_combat.0001.tt.POD_manipulate_cohesion: "#D Usando tu Conocimiento de los Fundamentos, atacas sin que [my_foe.GetFirstName] se dé cuenta#!"
 single_combat.0001.POD_dragons_breath: "¡Te quemaré!" 
 single_combat.0001.tt.POD_dragons_breath: "#D Escupes fuego a tu enemigo.#!"
 single_combat.0001.POD_bark_mudpuppy: "¡Mi voz te destruirá!" 
 single_combat.0001.tt.POD_bark_mudpuppy: "#D Usas la Corteza del Mudpuppy contra tu enemigo.#!"
 single_combat.0001.POD_clap_of_thunder: "¡Escucha el rugido de los cielos!" 
 single_combat.0001.tt.POD_clap_of_thunder: "#D Un gran trueno aturde a tu enemigo#!"
 single_combat.0001.POD_dragon_slash: "¡Corte de dragón!" 
 single_combat.0001.tt.POD_dragon_slash: "#D ¡Corta a tu enemigo con la fuerza del Dragón!#!"

