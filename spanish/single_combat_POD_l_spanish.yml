 single_combat.0041.desc.opponent_response.POD_acre_catechumen.injury: "El siguiente golpe que alcanza a mi enemigo es especialmente doloroso."
 single_combat.0041.desc.opponent_response.POD_acre_flesh.injury: "Mi oponente no puede romper mi defensa, y el contraataque es doloroso."
 single_combat.0041.desc.opponent_response.POD_acre_flight.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_acre_auto.injury: "No del todo, pero sigue siendo muy doloroso mientras mi enemigo retrocede ante ello."
 single_combat.0041.desc.opponent_response.POD_murnau_mirror.injury: "Como tal, mi enemigo es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_murnau_arcana.injury: "Sorprendido, el efecto rebote le duele bastante a mi oponente."
 single_combat.0041.desc.opponent_response.POD_sisters_hosanna.injury: "El siguiente golpe que alcanza a mi enemigo es especialmente doloroso."
 single_combat.0041.desc.opponent_response.POD_sisters_oratorio.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_bone_obedience.injury: "Mi oponente no puede romper mi defensa, y el contraataque es doloroso."
 single_combat.0041.desc.opponent_response.POD_five_poison_cloud.injury: "Mi oponente queda envuelto en ella y apenas logra escapar antes de que sea demasiado tarde."
 single_combat.0041.desc.opponent_response.POD_ching_shih.injury: "Más rápido, robusto y fuerte que él, mi enemigo está superado."
 single_combat.0041.desc.opponent_response.POD_long_neck.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_bloodlash.injury: "Mi oponente se sorprende por ello y es rápidamente repelido por el asalto."
 single_combat.0041.desc.opponent_response.POD_goblin_scorch.injury: "Mi oponente queda envuelto en ella y apenas logra escapar antes de que sea demasiado tarde."
 single_combat.0041.desc.opponent_response.POD_goblin_lantern.injury: "Esta extraña táctica sorprendió a mi enemigo, y queda gravemente quemado antes de recobrar el sentido."
 single_combat.0041.desc.opponent_response.POD_bone_dance.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_dragon_dance.injury: "Más rápido, robusto y fuerte que él, mi enemigo está superado."
 single_combat.0041.desc.opponent_response.POD_chi_interrupt.injury: "Mi oponente recibe un golpe, pero logra evitar el segundo. Aun así, resulta doloroso."
 single_combat.0041.desc.opponent_response.POD_thousand_hell_stare.injury: "En este difícil estado mental, mi enemigo es incapaz de defenderse adecuadamente."
 single_combat.0041.desc.opponent_response.POD_wind_attack.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_demon_claws.injury: "Más rápido, robusto y fuerte que él, mi enemigo está superado."
 single_combat.0041.desc.opponent_response.POD_tormented_essence.injury: "En este difícil estado mental, es incapaz de defenderse adecuadamente."
 single_combat.0041.desc.opponent_response.POD_adramelechs_wrath.injury: "Más rápido, robusto y fuerte que él, mi enemigo está superado."
 single_combat.0041.desc.opponent_response.POD_blood_atemi.injury: "Mi oponente recibe un golpe, pero logra evitar el segundo. Aun así, resulta doloroso."
 single_combat.0041.desc.opponent_response.POD_stand_upon_the_dragons_back.injury: "Mi oponente ni siquiera puede devolverme el golpe, y el contraataque es doloroso."
 single_combat.0041.desc.opponent_response.POD_dragon_ward.injury: "Mi oponente no puede romper mi defensa, y el contraataque es doloroso."
 single_combat.0041.desc.opponent_response.POD_typhonic_maw.injury: "Corto a través de la monstruosa fauce. Eso tiene que doler."
 single_combat.0041.desc.opponent_response.POD_cobra_fangs.injury: "Mientras el veneno se disipa del colmillo de mi oponente, lo tomo con la mano y lo aplasto con todas mis fuerzas."
 single_combat.0041.desc.opponent_response.POD_snout_strike.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_chi_breaker.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_hundred_star_shower.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_jaw_hammer.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_fading_light_strike.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_chain_snake.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_twisting_thrust.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_prone_attacks.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_dagger_claw.injury: "Como tal, mi oponente es incapaz de evitar el siguiente golpe que se dirige hacia él."
 single_combat.0041.desc.opponent_response.POD_spark_of_ra.injury: "Mi oponente es alcanzado por la bola de fuego, quemado pero aún luchando."
 single_combat.0041.desc.opponent_response.POD_deaths_hand.injury: "Mi oponente es alcanzado por la ráfaga de energía espectral. Está herido, pero sigue luchando."
 single_combat.0041.desc.opponent_response.POD_ashes_to_ashes.injury: "Lanzo un hechizo para transformar a mi enemigo en cenizas. Partes de su carne comienzan a desecarse."
 single_combat.0041.desc.opponent_response.POD_dust_to_dust.injury: "La carne de mi oponente comienza a convertirse en arcilla negra ante mi tacto."
 single_combat.0041.desc.opponent_response.POD_khaibits_embrace.injury: "Mi oponente es incapaz de romper mi dominio, resultando herido por las sombras."
 single_combat.0041.desc.opponent_response.POD_serqets_sting.injury: "Mi oponente sufre el veneno de Serqet."
 single_combat.0041.desc.opponent_response.POD_voracious_scarab_of_nyarashahim.injury: "Mi escarabajo animado se abre paso más profundamente en el interior de mi oponente."
 single_combat.0041.desc.opponent_response.POD_spear_of_anubis.injury: "Golpeo a mi oponente con la Lanza de Anubis, hiriéndolo."
 single_combat.0041.desc.opponent_response.POD_feral_clawing.injury: "Mis golpes aciertan, hiriendo a mi oponente."
 single_combat.0041.desc.opponent_response.POD_feral_bite.injury: "Muerdo a mi oponente, hiriénd[my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_feral_assault.injury: "Ataco furiosamente a mi enemigo, hiriénd[my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_feral_taunt.injury: "Provoco a mi oponente, distrayendo a [my_foe.GetHerHim], y ataco, hiriénd[my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_feral_evasion.injury: "Esquivo los ataques de mi oponente, atravesando sus defensas e hiriénd[my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_jaw_lock.injury: "Bloqueo la pierna de mi oponente, hiriénd[my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_hamstring.injury: "Muerdo las extremidades de mi enemigo, hiriénd[my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_leaping_rake.injury: "Me lanzo contra mi oponente, hiriénd[my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_wishbone.injury: "Inflijo daño a mi enemigo, intentando despedazar[my_foe.GetHerHim]."
 single_combat.0041.desc.opponent_response.POD_manipulate_inertia.injury: "Y no tiene ninguna; pronto se ve reducido/a a recuperarse, con dificultad, de mi embestida."
 single_combat.0041.desc.opponent_response.POD_manipulate_acceleration.injury: "Y no tiene ninguna; pronto se ve reducido/a a recuperarse, con dificultad, de mi embestida."
 single_combat.0041.desc.opponent_response.POD_manipulate_cohesion.injury: "Y no tiene ninguna; pronto se ve reducido/a a recuperarse, con dificultad, de mi embestida."
 single_combat.0041.desc.opponent_response.POD_dragons_breath.injury: "Aprovecho el exceso de confianza de [sc_loser.GetHerHis] y dejo a [sc_loser.GetHerHim] inconsciente mientras su garganta aún brilla."
 single_combat.0041.desc.opponent_response.POD_bark_mudpuppy.injury: "Cierro la distancia y silencio a [sc_loser.GetHerHim] con un golpe en la garganta. No más gritos, por favor."
 single_combat.0041.desc.opponent_response.POD_clap_of_thunder.injury: "Casi parece que el trueno afectó más a [sc_loser.GetHerHim] que a mí, y mis rápidos contraataques encuentran poca resistencia. El duelo termina en cuestión de instantes."
 single_combat.0041.desc.opponent_response.POD_dragon_slash.injury: "Todo lo que tengo que hacer es dar un paso al lado y darle un golpe en la nuca a [sc_loser.GetHerHim], como si fuera un maestro de artes marciales reprendiendo a [sc_victor.GetHerHis] estudiante."


#Defender Lost, Opponent Finishing Move Fatality
#Example: "\n\nBefore [sc_loser.GetFirstNameNoTooltip] can bring [sc_loser.GetHerHis] secondary weapon to bear, I swing my own [sc_victor.Custom('signature_weapon')] round to [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))]. [sc_loser.GetHerHis|U] battered body is hurled backwards, spasming and bleeding into the [sc_defender.Custom('GroundType')].\n\nWithin the minute, all movement stops."
 single_combat.0041.desc.opponent_response.POD_bite.fatality: "Y conecta, con el embriagador aroma de la sangre impregnando el aire. Pronto sucumben al Beso y el dulce sabor de mi victoria es sangriento."
 single_combat.0041.desc.opponent_response.POD_blood_surge.fatality: "Puedo verme erguido y más fuerte, fortalecido por la sangre. Aprovecho rápidamente mi ventaja y termino la pelea con un rápido corte en el cuello. La cabeza del derrotado rueda, deteniéndose solo cuando choca contra mis pies."
 single_combat.0041.desc.opponent_response.POD_blood_heal.fatality: "Todas mis heridas desaparecen ante mis ojos mientras el poder de la sangre me cura. Aprovecho rápidamente mi ventaja y termino la pelea con un rápido corte en el cuello. La cabeza del derrotado rueda, deteniéndose solo cuando choca contra mis pies."
 single_combat.0041.desc.opponent_response.POD_blink.fatality: "Y no tienen ninguna; mi embestida solo se detiene cuando solo quedan cenizas ante mí."
 single_combat.0041.desc.opponent_response.POD_lightning_strike.fatality: "Lo cual hago; mi enemigo es pronto repelido por este ataque inesperado. Y hacia atrás... y hacia atrás... hasta que no queda lugar para retroceder."
 single_combat.0041.desc.opponent_response.POD_split_second.fatality: "Mi oponente no está lo suficientemente preparado, y un fuerte golpe le llega, demasiado rápido para ser evitado por su percepción alterada del tiempo. Le corta limpiamente en dos mitades perfectamente simétricas."
 single_combat.0041.desc.opponent_response.POD_unerring_aim.fatality: "Mi oponente no puede hacer otra cosa que recibirlo de lleno entre los ojos. No disimulo una sonrisa victoriosa mientras cae hacia atrás."
 single_combat.0041.desc.opponent_response.POD_lethal_body.fatality: "Mi oponente siente como si una casa entera se hubiera derrumbado sobre él/ella. Al caer hacia atrás, yo tengo la ventaja de la altura. Así que todo ha terminado."
 single_combat.0041.desc.opponent_response.POD_brutal_feed.fatality: "Mi oponente no logra librarse de este Abrazo mortal. Pronto sucumbe al Beso y el dulce sabor de mi victoria es sangriento."
 single_combat.0041.desc.opponent_response.POD_earthshock.fatality: "Mi oponente cae y aprovecho esta oportunidad para golpear brutalmente. No esquiva el golpe destinado al cuello."
 single_combat.0041.desc.opponent_response.POD_fist_of_caine.fatality: "Esta tempestad es como dagas contra su piel, cortando grandes jirones de carne no-muerta con cada movimiento. Hasta que solo queda un esqueleto. Luego, solo cenizas."
 single_combat.0041.desc.opponent_response.POD_toughness.fatality: "Nada parece ser capaz de atravesar mi defensa. Mi oponente se agota intentando romperla. Mi contraataque es rápido y mortal."
 single_combat.0041.desc.opponent_response.POD_flesh_of_marble.fatality: "Nada parece ser capaz de atravesar mi defensa. Mi oponente se agota intentando romperla. Mi contraataque es rápido y mortal."
 single_combat.0041.desc.opponent_response.POD_prowess_from_pain.fatality: "Impulsado por este terrible poder, asesto un golpe poderoso que hace estallar las entrañas de mi enemigo en un desastre sangriento."
 single_combat.0041.desc.opponent_response.POD_feral_weapons.fatality: "Y sucede, ya que mi oponente no logra evitar un zarpazo fatal que se le echa encima."
 single_combat.0041.desc.opponent_response.POD_shapechange.fatality: "Sorprendido por este cambio repentino, mi oponente es golpeado y tiene que repeler furiosamente al monstruo en el que me he convertido. Pero es inútil; lo salvaje ha ganado esta ronda contra el hombre."
 single_combat.0041.desc.opponent_response.POD_vanish.fatality: "Como tal, mi oponente no ve venir el siguiente golpe por la espalda. Y es el último que sentirá jamás."
 single_combat.0041.desc.opponent_response.POD_nocturne.fatality: "Como tal, mi oponente no ve venir el siguiente golpe por la espalda. Y es el último que sentirá jamás."
 single_combat.0041.desc.opponent_response.POD_arms_of_ahriman.fatality: "Mi oponente evita uno de ellos, pero no el segundo... lo que le devuelve hacia el primero. Mi victoria consiste en azotar con tentáculos."
 single_combat.0041.desc.opponent_response.POD_the_darkness_within.fatality: "De repente saltan a la boca de mi oponente y, apenas unos segundos después, una explosión de sangre y sombras pone fin a este duelo."
 single_combat.0041.desc.opponent_response.POD_aegis_of_shadows.fatality: "Nada parece ser capaz de atravesar mi defensa. Mi oponente se agota intentando romperla. Mi contraataque es rápido y mortal."
 single_combat.0041.desc.opponent_response.POD_compel.fatality: "Esto toma a mi enemigo desprevenido, y aprovecho esta distracción para cortarle el cuello limpiamente."
 single_combat.0041.desc.opponent_response.POD_terminal_decree.fatality: "Lo cual hacen obedientemente, una y otra vez. Suelto una risa malvada mientras mi antiguo enemigo se golpea hasta morir."
 single_combat.0041.desc.opponent_response.POD_daunt.fatality: "Esto toma a mi enemigo desprevenido, y presiono mi ventaja hasta que no queda nada que presionar."
 single_combat.0041.desc.opponent_response.POD_dread_gaze.fatality: "Esto toma a mi enemigo desprevenido, y presiono mi ventaja hasta que no queda nada que presionar."
 single_combat.0041.desc.opponent_response.POD_extinguish_vitae.fatality: "De este modo, mi oponente de repente se siente mucho más débil y la Bestia ruge en un triunfo anticipado. Me lanzo hacia delante y atravieso su corazón con un puñetazo para dar el golpe final."
 single_combat.0041.desc.opponent_response.POD_scorpions_touch.fatality: "Aturdido por ello, mi enemigo se siente enfermo y sus movimientos son lentos. Le concedo una muerte misericordiosa y lo mato con un golpe rápido en lugar del lento Beso del veneno."
 single_combat.0041.desc.opponent_response.POD_theft_of_vitae.fatality: "Mi enemigo es incapaz de detenerlo, ¡su preciosa sangre es mía! Y sin sangre, un vampiro no es más que cenizas. Como pronto se demuestra ante mí."
 single_combat.0041.desc.opponent_response.POD_baals_curse.fatality: "Aturdido por ello, mi enemigo se siente enfermo y sus movimientos son lentos. Le concedo una muerte misericordiosa y lo mato con un golpe rápido en lugar del lento Beso del veneno."
 single_combat.0041.desc.opponent_response.POD_cauldron_of_blood.fatality: "¡Arde, arde! Qué hoguera tan agradable para ver, para variar."
 single_combat.0041.desc.opponent_response.POD_touch_of_oblivion.fatality: "La sangre de mi oponente se mezcla de repente con sombras agresivas que intentan apoderarse de él. Una vez que cada onza de sangre se ha extinguido, las sombras desaparecen obedientemente."
 single_combat.0041.desc.opponent_response.POD_stygian_shroud.fatality: "Como tal, mi oponente no ve venir el siguiente golpe por la espalda. Y es el último que sentirá jamás."
 single_combat.0041.desc.opponent_response.POD_fire_torch.fatality: "El lastimero ataque de mi oponente es contrarrestado por un golpe maestro. No se recuperará de este."
 single_combat.0041.desc.opponent_response.POD_fire_bombs.fatality: "Sin embargo, no esquiva fácilmente el puñetazo en la cara que le sigue. Ni el siguiente, hasta que su cabeza cae de sus hombros."
 single_combat.0041.desc.opponent_response.POD_fire_spewer.fatality: "Mi siguiente golpe es mucho más preciso, eso sí. Es un corte de cabeza limpio y satisfactorio."
 single_combat.0041.desc.opponent_response.POD_crossbow_shot.fatality: "Mi siguiente golpe es mucho más preciso, eso sí. Es un corte de cabeza limpio y satisfactorio."
 single_combat.0041.desc.opponent_response.POD_unleash_dogs.fatality: "En represalia, le lanzo uno de sus propios perros. Lo atrapa por reflejos, dándome tiempo más que suficiente para asestar un golpe crítico."
 single_combat.0041.desc.opponent_response.POD_stake_attack.fatality: "Sin embargo, no esquiva fácilmente el puñetazo en la cara que le sigue. Ni el siguiente, hasta que su cabeza cae de sus hombros."
 single_combat.0041.desc.opponent_response.POD_oculi_trust.fatality: "Mi implacable asalto lo empuja rápidamente hacia atrás. Acorralado, cae al suelo, indefenso."
 single_combat.0041.desc.opponent_response.POD_oculi_wine.fatality: "Sin embargo, no esquiva fácilmente el puñetazo en la cara que le sigue. Ni el siguiente, hasta que su cabeza cae de sus hombros."
 single_combat.0041.desc.opponent_response.POD_acre_catechumen.fatality: "Mi contraataque le pilla desprevenido y conecta. El fin llega con un destello de acero."
 single_combat.0041.desc.opponent_response.POD_acre_flesh.fatality: "Duele bastante. Lo suficiente como para distraerle del siguiente golpe. Este último no duele por mucho tiempo."
 single_combat.0041.desc.opponent_response.POD_acre_flight.fatality: "O incluso superarle, mientras lo empujo hacia atrás. Y hacia atrás. Hasta que no le quede ningún lugar a donde ir."
 single_combat.0041.desc.opponent_response.POD_acre_auto.fatality: "Sin embargo, no esquiva fácilmente el puñetazo en la cara que le sigue. Ni el siguiente, hasta que su cabeza cae de sus hombros."
 single_combat.0041.desc.opponent_response.POD_murnau_mirror.fatality: "Es empujado hacia atrás, apenas pudiendo seguir el ritmo. ¡Está muy por debajo de su nivel!"
 single_combat.0041.desc.opponent_response.POD_murnau_arcana.fatality: "Este explotó directamente en su cara. Y luego explotó también su cara."
 single_combat.0041.desc.opponent_response.POD_sisters_hosanna.fatality: "Mi contraataque le pilla desprevenido y conecta. El fin llega con un destello de acero."
 single_combat.0041.desc.opponent_response.POD_sisters_oratorio.fatality: "Mi contraataque le pilla desprevenido y conecta. El fin llega con un destello de acero."
 single_combat.0041.desc.opponent_response.POD_bone_obedience.fatality: "Es empujado hacia atrás, apenas pudiendo seguir el ritmo. ¡Está muy por debajo de su nivel!"
 single_combat.0041.desc.opponent_response.POD_five_poison_cloud.fatality: "Sin embargo, no esquiva fácilmente el puñetazo en la cara que le sigue. Ni el siguiente, hasta que su cabeza cae de sus hombros."
 single_combat.0041.desc.opponent_response.POD_ching_shih.fatality: "Está herido, pero sigue en pie. Hasta que deja de estarlo. Termina como empezó: en la oscuridad."
 single_combat.0041.desc.opponent_response.POD_long_neck.fatality: "Yo no lo hago, y mi oponente queda herido. Lo bastante grave como para que el resto del combate sea un asunto asegurado."
 single_combat.0041.desc.opponent_response.POD_bloodlash.fatality: "Antes de conectar con un golpe rápido que le hiere. Lo bastante grave como para que el resto del combate sea una conclusión inevitable."
 single_combat.0041.desc.opponent_response.POD_goblin_scorch.fatality: "Sin embargo, no esquiva fácilmente el puñetazo en la cara que le sigue. Ni el siguiente, hasta que su cabeza cae de sus hombros."
 single_combat.0041.desc.opponent_response.POD_goblin_lantern.fatality: "Entonces respondo con un golpe poderoso. Su cabeza no lo agradece y decide caer al suelo en protesta."
 single_combat.0041.desc.opponent_response.POD_bone_dance.fatality: "Entonces respondo con un golpe poderoso. Su cabeza no lo agradece y decide caer al suelo en protesta."
 single_combat.0041.desc.opponent_response.POD_dragon_dance.fatality: "Es empujado hacia atrás, apenas pudiendo seguir el ritmo. ¡Está muy por debajo de su nivel!"
 single_combat.0041.desc.opponent_response.POD_chi_interrupt.fatality: "Entonces respondo con un golpe poderoso. Su cabeza no lo agradece y decide caer al suelo en protesta."
