 FLIGHT_1_PERK_EFFECT: "#F Puedes planear como un ala delta.\nSin embargo, no puedes cargar nada.#!"
 FLIGHT_2_PERK_EFFECT: "Menor probabilidad de que ocurran ciertos eventos negativos al inspeccionar tu dominio.\n#F Puedes realizar un despegue en carrera y cargar 10 kilogramos mientras vuelas.#!"
 FLIGHT_3_PERK_EFFECT: "#F Puedes realizar un despegue vertical directo si no llevas carga, o puedes despegar en carrera cargando hasta 25 kg.#!"
 FLIGHT_4_PERK_EFFECT: "#F Ahora puedes realizar un despegue vertical con hasta 25 kg de equipaje, pero puedes cargar hasta 45 kg mientras vuelas.#!"
 FLIGHTADVANCED_PERK_EFFECT: "#F Ahora puedes cargar hasta 90 kg, lo suficiente para llevarse a una persona adulta (o vampiro).\nLa velocidad máxima es de 120 kilómetros por hora.#!"
 FLIGHT_6_PERK_EFFECT: "#F Ahora puedes cargar hasta 135 kg, lo suficiente para llevarse a una persona adulta (o vampiro).\nLa velocidad máxima es de 150 kilómetros por hora.#!"
 FLIGHT_7_PERK_EFFECT: "#F Ahora puedes cargar hasta 180 kg, lo suficiente para llevarse a una persona adulta (o vampiro).\nالسرعة القصوى هي 180 كيلومتر في الساعة.#!"
 FLIGHT_8_PERK_EFFECT: "#F Ahora puedes cargar hasta 225 kg, lo suficiente para llevarse a una persona adulta (o vampiro).\nLa velocidad máxima es de 210 kilómetros por hora.#!"
 FLIGHT_9_PERK_EFFECT: "#F Ahora puedes cargar hasta 270 kg, lo suficiente para llevarse a una persona adulta (o vampiro).\nLa velocidad máxima es de 240 kilómetros por hora.#!"
 FLIGHT_10_PERK_EFFECT: "#F Ahora puedes cargar hasta 315 kg, lo suficiente para llevarse a una persona adulta (o vampiro).\nLa velocidad máxima es de 270 kilómetros por hora.#!"
 FLIGHT_11_PERK_EFFECT: "#F Ahora puedes cargar hasta 360 kg, lo suficiente para llevarse a una persona adulta (o vampiro).\nLa velocidad máxima es de 300 kilómetros por hora.#!"

 # Valeren #
 
 OBEAH_PANACEA_PERK_EFFECT: "Permite usar la curación sanguínea [character_interaction|E] en otros personajes para curar cicatrices.\n#F Así como puedes curar las heridas que causas lamiéndolas, cura las heridas causadas por otros lamiéndolas#!"
 SENSE_DEATH_PERK_EFFECT: "#F Detecta qué tan sano está un individuo u otra información sanguínea#!"
 SENSE_CYCLE_PERK_EFFECT: "#F Siente el ciclo completo de la vida, sabiendo instintivamente cuándo un individuo o un evento es importante para tu futuro#!"
 AUGURING_THE_SICKNESS_PERK_EFFECT: "#F Descubre la gravedad y la naturaleza de una enfermedad que aqueja a un objetivo#!"
 GIFT_OF_SLEEP_PERK_EFFECT: "$countermeasures_unlocks_t2_bounties_for_whispers$ \n #F Elimina la sensación de dolor de un objetivo o duerme a una criatura viva#!"
 PEACEFUL_TOUCH_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$ \n #F Calma a un objetivo hostil con un toque, dificultando que te ataque#!"
 HEALERS_TOUCH_PERK_EFFECT: "Permite usar la [character_interaction|E] de curación de sangre en otros personajes para sanar heridas.\n#F Sana las heridas de un mortal o un vampiro con un toque, incluyendo enfermedades transmitidas por la sangre#!"
 NEUTRAL_GUARD_PERK_EFFECT: "#F Crea una barrera a 10 pies de ti que impide que otros se acerquen#!"
 BURNING_TOUCH_PERK_EFFECT: "#F Provoca que la víctima sienta una agonía debilitante y puede causar Rötschreck en víctimas vampiras#!"
 PARIAHS_CARESS_PERK_EFFECT: "Como [character_interaction|E], te permite otorgar el modificador [GetModifier('pariahs_caress_perk_modifier').GetNameWithTooltip] al objetivo.\n#F Marca a un objetivo con un toque sangriento, dificultando todas sus interacciones sociales#!"
 KING_DAVIDS_BLESSING_PERK_EFFECT: "Como [character_interaction|E], te permite sanar el rasgo de estrés del objetivo.\n#F Mediante el canto o la interpretación de un instrumento, ayuda a alguien a olvidar su dolor físico, a salir de la depresión o asiste a otro sanador en su oficio#!"
 SHEPHERDS_WATCH_PERK_EFFECT: "#F Crea una barrera a 10 pies de ti que impide que otros se acerquen#!"
 ARMOR_OF_CAINES_FURY_PERK_EFFECT: "#F Crea una armadura mística que te protege del daño y facilita evitar el Frenesí por miedo#!"
 WATCHER_PEACEMAKER_PERK_EFFECT: "$countermeasures_unlocks_t2_mental_fortress$ \n #F Difunde un aura de calma y paz, como la habilidad de nivel 3 anterior#!"
 UNBURDEN_THE_BESTIAL_SOUL_PERK_EFFECT: "Como [character_interaction|E], te permite otorgar un modificador positivo o sanar rasgos mentales negativos del objetivo.\n#F Extrae el alma de alguien y mejora la calificación de Camino del sujeto, eleva sus Virtudes (Conciencia, Coraje y Autocontrol), las reduce (Convicción e Instinto) y cura los Desvaríos#!"
 ENDING_THE_WATCH_PERK_EFFECT: "Ganas experiencia de Estilo de vida al matar personajes no sobrenaturales.\n#F Mata sin dolor a un mortal que desee morir y extrae conocimiento o energía de ello#!"
 VENGEANCE_OF_SAMIEL_PERK_EFFECT: "#F Realiza un único golpe devastador que no puede ser evitado#!"
 SOULS_BREATH_PERK_EFFECT: "Como [character_interaction|E], te permite consumir el poder del objetivo para saciar tu Ansia.\n#F Subsiste de los alientos de los mortales en lugar de la sangre, o roba sangre y poder de otras criaturas sobrenaturales a través de su aliento#!"
 FATHERS_JUDGEMENT_PERK_EFFECT: "#F Deja una parte de la $pod_vitae$ de un vampiro inerte#!"
 REPULSION_PERK_EFFECT: "Reduce la probabilidad de que surjan [factions|E] en tu contra.\n#F Provoca que la gente se aleje instintivamente de ti, como si recordaran algo desagradable y no tuvieran interés en perseguirlo#!"
 RAYZEELS_SONG_PERK_EFFECT: "Como [character_interaction|E], te permite curar todas las heridas, enfermedades y enfermedades sobrenaturales en la corte del objetivo.\n#F Facilita la curación de otros#!"
 HEAVENS_GATE_PERK_EFFECT: "Crear Ghouls también les otorgará ahora el rasgo [GetTrait('revenant').GetName( GetNullCharacter )].\n#F Resucita a un mortal recientemente asesinado como un [GetTrait('revenant').GetName( GetNullCharacter )]#!"
 BLISSFUL_AGONY_PERK_EFFECT: "#F Provoca que la víctima sienta un dolor continuo que puede causar daño o llevarla al Frenesí#!"
 SWORD_OF_THE_RIGHTEOUS_PERK_EFFECT: "$unlock_enhancing_node$ [GetModifier('sword_of_the_righteous_modifier').GetNameWithTooltip]\n#F Hace que una hoja bañada en tu $pod_vitae$ arda con fuego celestial y cause Daño Agravado#!"
 SONG_OF_THE_BLOODED_PERK_EFFECT: "Otorga [GetModifier('song_of_the_blooded_perk_commander_negative_modifier').GetNameWithTooltip] [modifier|E] a los [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E].\nOtorga [GetModifier('song_of_the_blooded_perk_knight_negative_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante el [single_combat_duel_plural|E].\nOtorga [GetModifier('song_of_the_blooded_perk_commander_positive_modifier').GetNameWithTooltip] [modifier|E] a los [commanders|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E].\nOtorga [GetModifier('song_of_the_blooded_perk_knight_positive_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E] o a ti mismo durante el [single_combat_duel_plural|E].\n#F El vampiro entra en un trance de batalla, aumentando su destreza física, rodeándose de un halo resplandeciente que ciega a los espectadores y volviéndolo inmune a cualquier Disciplina de influencia mental#!"
 SAFE_PASSAGE_PERK_EFFECT: "Menos riesgo de ser el objetivo de una facción de la Inquisición.\n#F Recibe hospitalidad y ayuda sin importar la cultura local, y dificulta que los Cazadores te encuentren.#!"
 AVERSION_PERK_EFFECT: "Mejora la Caricia del Paria [character_interaction|E], permitiéndote otorgar el modificador [GetModifier('aversion_perk_modifier').GetNameWithTooltip] al objetivo, con la posibilidad de que este pierda todo su prestigio.\n#F Potencia la [GetPerk('pariahs_caress_perk').GetName(GetPlayer)], haciendo que otros detesten y ostracicen enormemente a un individuo, o se vuelvan hostiles contra él#!"
 WATCHER_PURIFICATION_PERK_EFFECT: "Como [character_interaction|E], te permite eliminar rasgos infames del objetivo.\n#F Expulsa o exorciza un espíritu o un demonio, y vincúlalo a tu servicio#!"
 WATCHER_SOUL_EXCHANGE_PERK_EFFECT: "Como [character_interaction|E], te permite intercambiar el rasgo de personalidad de dos objetivos.\n#F Intercambia las almas de dos individuos, cambiando sus Caminos, Virtudes y Naturalezas#!"
 
 # Quietus #
 
 SORCERER_SILENCE_OF_DEATH_PERK_EFFECT: "#F Como la Habilidad de Guerrero, pero se puede oír la propia voz del Hechicero#!"
 SCORPIONS_CURSE_PERK_EFFECT: "Otorga [GetModifier('scorpions_curse_perk_modifier').GetNameWithTooltip] [modifier|E] a tu enemigo durante el [single_combat_duel_plural|E].\n#F Coloca una trampa en una superficie sólida que activa la habilidad de Guerrero al ser tocada#!"
 SORCERER_DAGONS_CALL_PERK_EFFECT: "Como [character_interaction|E], te permite infligir al objetivo una herida cuya gravedad depende de tu destreza.\n#F Causa daño desde la distancia a la mente de una persona a la que hayas tocado en la última hora#!"
 SORCERER_BAALS_CARESS_PERK_EFFECT: "Desbloquea la decisión $seek_aid_of_the_spirits_decision$ [decision|E].\n#F Percibe a los seres de los Espíritus#!"
 TASTE_OF_DEATH_PERK_EFFECT: "#F Escupe sangre ácida que daña a las criaturas inmateriales#!"
 WARRIOR_SILENCE_OF_DEATH_PERK_EFFECT: "#F Deja el área a tu alrededor completamente en silencio#!"
 BLOOD_ESSENCE_PERK_EFFECT: "#P 20%#! de probabilidad de matar a un [knights|E] enemigo cuando resulte mutilado o herido en la [combat_phase|E] como [commander|E].\n#F Extrae la sangre del corazón de un objetivo exsangüeado y debilitado#!"
 WARRIOR_SCORPIONS_TOUCH_PERK_EFFECT: "Cuando se inicia una guerra, el campeón con menor destreza de tu enemigo resultará herido.\n#F Crea un veneno de contacto que debilita enormemente físicamente a la víctima#!"
 WARRIOR_DAGONS_CALL_PERK_EFFECT: "Como [character_interaction|E], te permite infligir al objetivo una herida cuya gravedad depende de tu destreza.\n#F Causa daño desde la distancia a una persona a la que hayas tocado en la última hora#!"
 WARRIOR_BAALS_CARESS_PERK_EFFECT: "Mejora el Toque del Escorpión: cuando se inicia una guerra, los dos campeones con menor destreza de tu enemigo resultarán heridos.\n#F Crea un veneno que puede aplicarse en las armas para hacerlas más peligrosas#!"
 QUICKEN_THE_MORTALS_BLOOD_PERK_EFFECT: "Al beber sangre, reduces tu Ansia como si estuvieras bebiendo el doble de la misma cantidad.\n#F Recibe dos por cada extracción#!"
 BLOOD_TEMPERING_PERK_EFFECT: "#F Preserva objetos infundiéndoles sangre#!"
 TRUTH_OF_BLOOD_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n #F Prueba la sangre de un objetivo para saber si ha mentido#!"
 ISHTARS_TOUCH_PERK_EFFECT: "#F Crea un veneno de contacto que deja al objetivo embriagado#!"
 CLEANSED_IN_BLOOD_PERK_EFFECT: "Como [character_interaction|E], te permite eliminar el Cambio de Forma del objetivo.\n#F Purifica a un individuo de las influencias mentales y emocionales sobre él, incluso maldiciones y otros efectos mágicos#!"
 RIPPLES_OF_THE_HEART_PERK_EFFECT: "#F Saborea emociones y sentimientos a través de la sangre#!"
 BLOOD_SWEAT_PERK_EFFECT: "#F Obliga a un objetivo a sudar sangre profusamente y a reflexionar sobre las cosas horribles que ha hecho#!"
 TASTE_OF_BLISS_PERK_EFFECT: "#F Exhala una niebla roja contra un objetivo que consuma su Fuerza de Voluntad#!"
 FREE_DAGONS_CALL_EFFECT: "Bonificación al Llamado de Dagon [character_interaction|E], ahora no tiene coste de piedad."
 QUIETUS_PURIFICATION_PERK_EFFECT: "Como [character_interaction|E], permite eliminar el [battle_modifier|E] de un objetivo.\n#F Purifica a un individuo de las influencias mentales y emocionales que recaen sobre él, incluso maldiciones y otros efectos mágicos#!"
 THIN_BLOOD_PERK_EFFECT: "Como [character_interaction|E], permite que un objetivo sufra [GetModifier( 'thin_blood_perk_modifier' ).GetNameWithTooltip|L].\n#F Hace que un vampiro sea incapaz de curar sus heridas con $pod_vitae$#!"
 FOUL_BLOOD_PERK_EFFECT: "#F Envenena la sangre de un objetivo para que solo tú puedas alimentarte de él#!"
 BLOOD_OF_DESTRUCTION_PERK_EFFECT: "Otorga [GetModifier('blood_of_destruction_perk_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E] o a ti mismo durante [single_combat_duel_plural|E].\n#F Hace que la sangre en el cuerpo de uno sea increíblemente ácida#!"
 CONDEMN_THE_SINS_OF_THE_FATHER_PERK_EFFECT: "Bonificación al Llamado de Dagon [character_interaction|E], ahora afecta a toda la casa del objetivo (miembros con menos edad que el objetivo).\n#F Aplica un poder de Extinción de nivel inferior a todo un linaje de vampiros#!"
 EROSION_PERK_EFFECT: "Como [character_interaction|E], permite que el objetivo sufra [GetModifier( 'erosion_perk_modifier' ).GetNameWithTooltip|L].\n#F Reduce todos los atributos físicos de un objetivo a cero#!"
 
 # Mytherceria #

 FEY_SIGHT_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n #F Siente a los changelings y los glamours de las hadas#!"
 FOLDEROL_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$ \n #F Determina si una afirmación fue una mentira#!"
 FAE_SIGHT_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$ \n #F Siente cualquier forma de magia que no esté relacionada con los fantasmas y los no-muertos#!"
 DARKLING_TRICKERY_PERK_EFFECT: "#F Crea todo tipo de efectos que normalmente se asocian con las hadas#!"
 GOBLINISM_PERK_EFFECT: "#F Sentido de la orientación intuitivo bajo tierra; invoca goblins para ayudar a deformar y remodelar la piedra#!"
 AURA_ABSORPTION_PERK_EFFECT: "Como [character_interaction|E], permite reiniciar la Resonancia del objetivo.\n#F Elimina la resonancia de un objeto#!"
 CHANJELIN_WARD_PERK_EFFECT: "#F Coloca símbolos que confunden y desorientan a la gente#!"
 RIDDLE_PHANTASTIQUE_PERK_EFFECT: "Otorga [GetModifier('riddle_phantastique_perk_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\n#F Pronuncia acertijos que hacen que la gente no haga más que sentarse y reflexionar sobre ellos#!"
 STONE_TRAVEL_PERK_EFFECT: "Como [character_interaction|E], permite teletransportar a tu ejército a la ubicación de tu objetivo, o teletransportarte a tu próximo destino cuando viajes, si el terreno lo permite.\n#F El vampiro puede tunelizar bajo tierra#!"
 STEAL_THE_MIND_PERK_EFFECT: "Como [character_interaction|E], permite eliminar temporalmente los atributos del objetivo.\n#F Elimina recuerdos y conocimientos de una víctima temporalmente#!"
 EARTH_SWORD_PERK_EFFECT: "#F Provoca que salten picos contra un objetivo desde cualquier estructura grande#!"
 ABSORB_THE_MIND_PERK_EFFECT: "Como opción de ejecución, te permite devorar la mente del objetivo para aumentar tu educación.\n#F Toma permanentemente rangos de Habilidad de una víctima para ti mismo#!"
 BASILISKS_TOUCH_PERK_EFFECT: "Como [character_interaction|E], permite convertir al objetivo en piedra.\n#F Convierte a una víctima en piedra con un toque#!"
 
 # Daimonion #
 
 SENSE_THE_SIN_PERK_EFFECT: "Como [character_interaction|E], intenta conocer el secreto de un objetivo (seleccionado al azar).\n#flavor Este poder permite a los Baali ver en el alma de su víctima para desenterrar su mayor debilidad moral.#!"
 FEAR_THE_VOID_BELOW_PERK_EFFECT: "Como [character_interaction|E], reduce la audacia del objetivo durante 10 años.\n#flavor El Baali aterroriza al objetivo con sentimientos de que irá al Infierno.#!"
 CONFLAGRATION_PERK_EFFECT: "#flavor El Baali extrae la esencia destructiva del Más Allá.#!"
 PSYCHOMACHIA_PERK_EFFECT: "Como [character_interaction|E], convoca la peor pesadilla del objetivo a la realidad, otorgándole un [modifier|E] basado en su personalidad.\n#flavor El Baali convoca una aparición del mayor miedo o trauma de la víctima.#!"
 CONDEMNATION_PERK_EFFECT: "Como [character_interaction|E], otorga a un objetivo [GetModifier('POD_condemnation_modifier').GetNameWithTooltip] durante 5 años.\n#flavor El Baali impone una maldición debilitante sobre un objetivo.#!"
 LURE_DIABOLIK_PERK_EFFECT: "Como [decision|E], convoca a un infernalista a tu [court|E].\n#flavor El Baali ordena a los infernalistas cercanos que le sirvan.#!"
 HELL_BORN_INVESTITURE_PERK_EFFECT: "Como [character_interaction|E], corrompe tu alma con gran maldad para obtener acceso al [investiture_lifestyle|E] y #V 6#! puntos de [perk|E] a un coste.\n#flavor El Baali toma su lugar legítimo como un Señor del Infierno.#!"
 BRING_THE_PLAGUE_PERK_EFFECT: "Como [character_interaction|E], convoca una [GetTrait('demonic_plague').GetName(GetPlayer)] en la ubicación del objetivo.\n#flavor El Baali propaga una plaga mortal que afecta tanto a mortales como a Cainitas por igual.#!"
 THE_RE_EMBRACE_PERK_EFFECT: "Como [character_interaction|E], vuelve a dar el Abrazo a un vampiro prisionero para integrarlo en tu $pod_clan$ sin cambiar su [Glossary('Generación','game_concept_vampgeneration_desc')].\n#flavor Cuando se invoca el Re-Abrazo, el Sire toma a sus posibles chiquillos por la garganta y los desangra en cuatro cuencos inscritos con runas antiguas y demoníacas. El Sire llena entonces otros cuatro cuencos con su propia sangre, rodeando a los chiquillos con ellos de forma alternada. Mientras el iniciado yace en el suelo, sangrando y acercándose cada vez más a su Muerte Definitiva, el Sire convoca un fragmento de alma del demonio más poderoso de las Líneas de Sangre, Namtaru, y lo combina con el alma del chiquillo para corromperla y acercar su espíritu al de un Baali.#!"
 ADRAMELECHS_WRATH_PERK_EFFECT: "Desbloquea un movimiento de [single_combat_duel|E].\nWera a los [knights|E] y [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E] si es un $POD_splat_vampire$.\n#flavor El Baali hace que un Cainita arda como si el mismísimo sol brillara sobre él.#!"
 SPEW_WIDE_THE_PIT_PERK_EFFECT: "Tras morir, otorga [GetModifier('spew_wide_the_pit_modifier').GetNameWithTooltip] a todos los [counties|E] del [duchy|E] por el que moriste durante 100 años.\n#flavor El Baali se sacrifica para que uno de los Dioses Antiguos pueda entrar en el mundo.#!"

 # Chimerstry #
 
 IGNIS_FATUUS_PERK_EFFECT: "$countermeasures_unlocks_t1_obfuscated_court$ \n #F Crea una ilusión inmóvil que afecta a uno de los cinco sentidos.#!"
 FATA_MORGANA_PERK_EFFECT: "#F Crea una ilusión inmóvil que puede afectar a cualquiera de los cinco sentidos.#!"
 APPARITION_PERK_EFFECT: "#F Añade movimiento a una ilusión creada por Ignis Fatuus o Fata Morgana.#!"
 PERMANENCY_PERK_EFFECT: "$countermeasures_unlocks_t2_obfuscated_court$ \n #F Hace que una ilusión creada por Quimerismo dure hasta que sea disipada.#!"
 HORRID_REALITY_PERK_EFFECT: "Inflige a cada gobernante del bando contrario [GetModifier('horrid_reality_perk_modifier').GetNameWithTooltip] al iniciar una [war|E] como atacante o defensor principal.\n#F Coloca la mente de la víctima en un mundo ilusorio creado por el vampiro.#!"
 HORRID_BLADE_OF_THE_DEMONS_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('artifact_prowess_2_modifier').GetNameWithTooltip]\n#F Crea un arma peligrosa de la nada.#!"
 MASS_HORROR_PERK_EFFECT: "Inflige a cada gobernante del bando contrario [GetModifier('mass_horror_perk_modifier').GetNameWithTooltip] al iniciar una [war|E] como atacante o defensor principal.\n#F Como Horrid Reality, pero afecta a múltiples personas.#!"
 AID_OF_THE_GANDHARVAS_PERK_EFFECT: "#F Hace que todo en una habitación parezca lujoso y espléndido.#!"
 MIRROS_VISAGE_PERK_EFFECT: "Como [character_interaction|E], te permite crear un clon de ti mism[X.Custom('ES_OA')].\n#F Crea duplicados de ti mism[X.Custom('ES_OA')].#!"
 PSEUDO_BLINDNESS_PERK_EFFECT: "#F Ver a través de casi todas las falsedades, incluidos los espejismos de las hadas#!"
 SENSORY_DEPRIVATION_PERK_EFFECT: "Como [character_interaction|E], permite que la víctima sufra [GetTrait('blind').GetName( GetPlayer )], [GetModifier('sensory_deprivation_deaf_modifier').GetNameWithTooltip]...\n#F Hace que una víctima sea incapaz de usar cualquiera de sus sentidos, aislándola del mundo#!"
 
 # Bardo #
 
 RESTORE_HUMANITAS_PERK_EFFECT: "Desbloquea la decisión de meditar en soledad [decision|E].\n#F Restaura la Humanidad perdida mediante la meditación#!"
 BANISHING_SIGN_OF_THOTH_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n #F Usa un gesto místico para repeler poderes sobrenaturales#!"
 GIFT_OF_APIS_PERK_EFFECT: "#P +50%#! de experiencia de [animal_lifestyle|E] de la línea de edificios de [GetDomicileBuilding('vampire_stable_01').GetName] de tipo [Concept('domicile','Escondite')|E]\n#F Obtén tanto sustento de la sangre animal como de la sangre humana.#!"
 PILLAR_OF_OSIRIS_PERK_EFFECT: "Hace que meditar en soledad [decision|E] sea gratuito y duplica la probabilidad de resultados positivos.\n#F Crea un centro místico que permite una meditación adecuada y reduce la dificultad de los poderes sobrenaturales#!"
 PARADOX_PERK_EFFECT: "Como [character_interaction|E], disuelve una facción aleatoria que te tenga como objetivo.\n#F Pronuncia una palabra que abrume a otros con dicha y les dificulte hacerte daño#!"
 BOON_OF_ANUBIS_PERK_EFFECT: "Como [character_interaction|E], otorga al objetivo el modificador [GetModifier('boon_of_anubis_perk_modifier').GetNameWithTooltip].\n#F Asegura que un mortal no pueda ser Abrazad[X.Custom('ES_OA')] y que sobreviva al intento#!"
 BRING_FORTH_THE_DAWN_PERK_EFFECT: "#F Obliga a los vampiros a dormir como si fuera de día#!"
 MUMMIFICATION_RITUAL_PERK_EFFECT: "Como [character_interaction|E], te permite hacer que el objetivo entre en $pod_torpor$.\n#F Introduce a un Ghoul o a un Cainita en un $pod_torpor$ prolongado#!"
 RAS_BLESSING_PERK_EFFECT: "Ya no sufrirás heridas por poderes que causen la luz del sol.\n#F Realiza un ritual que permite al Hijo de Osiris caminar temporalmente a la luz del día#!"

 # Thin-Blood Alchemy #
 FAR_REACH_PERK_EFFECT: "#F Telequinesis menor#!"
 COUNTERFEIT_1_PERK_EFFECT: "Desbloquea una Fórmula falsificada que da acceso a una [interaction|E] de perk de Disciplina de nivel 1.\n#F El usuario puede desarrollar una fórmula para falsificar una Disciplina de nivel 1#!"
 COUNTERFEIT_2_PERK_EFFECT: "Desbloquea una Fórmula falsificada que da acceso a una [interaction|E] de perk de Disciplina de nivel 2.\n#F El usuario puede desarrollar una fórmula para falsificar una Disciplina de nivel 2#!"
 COUNTERFEIT_3_PERK_EFFECT: "Desbloquea una Fórmula falsificada que da acceso a una [interaction|E] de perk de Disciplina de nivel 3.\n#F El usuario puede desarrollar una fórmula para falsificar una Disciplina de nivel 3#!"
 COUNTERFEIT_4_PERK_EFFECT: "Desbloquea una Fórmula falsificada que da acceso a una [interaction|E] de perk de Disciplina de nivel 4.\n#F El usuario puede desarrollar una fórmula para falsificar una Disciplina de nivel 4#!"
 
 # Faith #
 
 PATRIS_NOT_PRIMARY_TEXT: "@warning_icon!#X Sophia Patris es el camino principal de las órdenes laicas; completa el camino principal de tu orden o encuentra Fe Verdadera para desbloquearlo.#!"
 FILIUS_NOT_PRIMARY_TEXT: "@warning_icon!#X Sedulitas Filius es el camino principal de las órdenes caballerescas; completa el camino principal de tu orden o encuentra Fe Verdadera para desbloquearlo.#!"
 SPIRITUS_NOT_PRIMARY_TEXT: "@warning_icon!#X Boni Spiritus es el camino principal de las órdenes monásticas; completa el camino principal de tu orden o encuentra Fe Verdadera para desbloquearlo.#!"
 SHADOW_INQUISITION_ONLY_TEXT: "@warning_icon!#X Las Artes Sagradas son desarrolladas y utilizadas exclusivamente por los agentes de la Inquisición de las Sombras#!"
 
 DOMINUS_VOBISCUM_PERK_EFFECT: "Como [character_interaction|E], puedes bendecir a otro personaje para obtener una mejora temporal de sus atributos.\n#F La forma que toma una bendición puede variar y los resultados suelen ser caprichosos y menores. Pero, a veces, son suficientes para marcar la diferencia#!"
 INTERCESSION_PERK_EFFECT: "Como [character_interaction|E], puedes dar piedad a otro personaje con una pequeña probabilidad de otorgarle el rasgo Fe Verdadera.\n#F Los Bendecidos pueden castigar a los malvados con su mera presencia, pero también pueden inspirar a los espiritualmente desanimados a ser mejores#!"
 HOLY_BULWARK_PERK_EFFECT: "Ahora eres inmune a cualquier tipo de poder mental.\n#F La Fiel es constante en su mente. Es inmune a los efectos del Quimerismo, la Dementación, la Dominación, la Ofuscación y cualquier otro poder sobrenatural que confunda la mente o intente cambiarla#!"
 LAY_OF_HANDS_PERK_EFFECT: "Como [character_interaction|E], te permite curar heridas y rasgos mentales negativos.\n#F Imponer las manos, rezar o usar métodos más inusuales acaban con el mismo resultado. La pura Fe del creyente auténtico cierra las heridas como si nunca hubieran existido#!"
 PENANCE_PERK_EFFECT: "Como [character_interaction|E], puedes maldecir a un engendro, reduciendo sus atributos.\n#F La mera presencia de los Fieles hace que el engendro sobrenatural sienta dolor. Enfrentarse al resto de su debilidad moral les quema desde dentro#!"
 CONVERSION_PERK_EFFECT: "Como [decision|E], puedes convertir instantáneamente tu señorío a tu religión, por un gran coste de piedad.\n#F En una brillante manifestación de luz interior, el Fiel es un faro viviente que respira lo que cree que es correcto y bueno#!"
 MIRACLE_OF_FAITH_PERK_EFFECT: "Como [character_interaction|E], te permite hacer que un vampiro vuelva a ser mortal o alcanzar Golconda.\nDesbloquea un [crafting_node|E] que añade [GetModifier('bless_modifier').GetNameWithTooltip], así como un [modifier|E] basado en el tipo de [artifact|E].\n#F El Fiel bendice un icono, imbuyéndolo con parte de su fe.\nLa pura fuerza de convicción del Fiel hace que otros reconsideren su camino en la vida#!"
 MIRACLE_OF_DEVOTION_PERK_EFFECT: "Puede reclutar a [GetMaA('minion_of_the_divine').GetName] como [men_at_arms|E].\n#F Inspirados al seguir al bendecido, los corderos luchan como leones y los hombres luchan como demonios#!"
 MIRACLE_OF_TRANQUILITY_PERK_EFFECT: "Desbloquea un edificio especial de [GetBuilding('sanctified_area_01').GetName].\nComo [character_interaction|E], te permite resolver cada [Fetter|E] de un wraith.\n#F Bendiciendo una pequeña zona con la fuerza de sus convicciones, el Fiel hace que sea mucho más difícil para las criaturas hostiles o los espíritus entrar#!"
 MIRACLE_OF_PROTECTION_PERK_EFFECT: "Como [character_interaction|E], te permite [POD_banish|E] a un wraith/demonio/hada.\nYa no puedes ser poseíd[X.Custom('ES_OA')] por $POD_splat_wraith_plural$.\nGanas inmunidad al delirio.\n#F El Fiel es capaz de repeler a vampiros, muertos y otras criaturas que viven en las sombras del mundo con la fuerza de su luz interior. Puede usar oraciones, símbolos sagrados o simplemente la intensidad de su presencia para alejarlos#!"
 SHIELD_OF_FAITH_PERK_EFFECT: "#F La presencia de los verdaderamente Fieles protege a quienes les siguen, ya sea de daños espirituales o físicos#!"
 
 PRY_OPEN_PERK_EFFECT: "#F Sé testigo de los pensamientos y deseos del objetivo. Ayuda a construir una conexión#!"
 UNWAVERING_VISION_PERK_EFFECT: "Como [character_interaction|E], te permite dar [GetModifier( 'POD_ha_disrupted_contacts_modifier' ).GetNameWithTooltip|L] sobre los señoríos enemigos.\n#F Descubre los contactos del objetivo entre los hombres mortales, permitiéndote lisiar su influencia#!"
 UNEARTH_PERK_EFFECT: "Mucho más probable que [imprison|E] a [characters|E] tras un [siege|E] o una [raid|E] exitosos.\n#F Revela eventos que tuvieron lugar en un lugar determinado; útil para rastrear objetivos que escapan#!"
 LIFTING_THE_VEIL_PERK_EFFECT: "Como [character_interaction|E], te permite dar [GetModifier( 'tracked_down_modifier' ).GetNameWithTooltip|L] al objetivo prisionero, lo que te permite completar instantáneamente el viaje de Buscar Escondite [journey|E] en su señor una vez que sea liberado.\n#F Convierte los intentos de engaño del objetivo en algo inútil, dando lugar a un interrogatorio fructífero#!"
 REVELATION_PERK_EFFECT: "Como [character_interaction|E], te permite hacer que el objetivo obtenga una Célula de la Inquisición [factions|E].\n#F Expón la naturaleza impura del objetivo ante el Rebaño y déjalo sometido a su juicio#!"
 
 SUNDER_PERK_EFFECT: "Como [character_interaction|E], te permite dar [GetModifier( 'endo_holyweapon_modifier' ).GetNameWithTooltip|L] al objetivo.\n#F Este poder otorga a un arma una energía propia, permitiéndole golpear con venganza sagrada cualquier cosa que toque#!"
 CENSURE_PERK_EFFECT: "#F Por medio de este poder, el inquisidor puede frustrar a una criatura para que cometa un error estúpido ridiculizándola en nombre de todo lo que es sagrado#!"
 GODS_ARMOUR_PERK_EFFECT: "Más probable recuperarse de las heridas, y menos probable recibirlas durante el viaje de Buscar Escondite [journey|E].\n#F Este perk mejora drásticamente la recuperación de las heridas sufridas en batalla#!"
 ROD_AND_STAFF_PERK_EFFECT: "Como [character_interaction|E], permite que tus [knights|E] no puedan recibir heridas, pero tú seas más propenso a ellas en la [combat_phase|E] como [commander|E].\n#F Blandiendo este poder, el inquisidor se convierte en un baluarte sagrado contra las fuerzas del mal, evitando que cualquier daño alcance a quienes le siguen, mientras permanezca firme.#!"
 WRATH_OF_GOD_PERK_EFFECT: "Como [character_interaction|E], permite herir o matar al personaje objetivo.\n#F El inquisidor invoca la justicia del Señor en su forma más inmediata y violenta.#!"
 
 TEARS_OF_THE_MARTYR_PERK_EFFECT: "Desbloquea una opción de evento cuando un personaje poderoso intente resistirse a ser encarcelado.\n#F Los ojos piadosos del inquisidor se convierten en un espejo para el alma de cualquiera que los mire, provocando un arrepentimiento y una duda paralizantes en los esclavos del pecado.#!"
 TOUCH_OF_PEACE_PERK_EFFECT: "Como [character_interaction|E], permite curar rasgos de estrés.\n#F El toque sagrado del inquisidor es capaz de curar todos los males del alma.#!"
 AURA_OF_SANCTITY_PERK_EFFECT: "Hiere a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E], si son seres sobrenaturales.\n#F La teúrga concentra su fe en una ráfaga de energía sagrada que inflige daño a las criaturas impías que encuentra en la batalla.#!"
 RESTORATION_PERK_EFFECT: "Como [character_interaction|E], permite curar heridas y rasgos mentales negativos. Si ya puedes hacerlo por otra fuente, reduce el coste en su lugar.\n#F La inquisidora ha alcanzado una afinidad particular con el milagro de la curación; puede poner sus manos sobre compañeros enfermos con más frecuencia y a un menor coste.#!"
 JUDGEMENT_OF_HEAVEN_PERK_EFFECT: "Como [character_interaction|E], permite [imprison|E] al objetivo.\n#F El inquisidor puede confinar a una criatura sobrenatural al reino terrenal, donde no podrá conocer escape de su juicio final.#!"

 # Abombwe #

 PREDATORS_COMMUNION_PERK_EFFECT: "El Vampiro es el mayor depredador en su territorio y siente siempre que un aliado o rival potencial está cerca."
 INVOKING_THE_PREDATOR_PERK_EFFECT: "Esculpe la maleable oscuridad interior y empújala hacia fuera para copiar aspectos de animales depredadores."
 TAMING_THE_BEAST_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor Conecta con la Bestia para convertir el poder de tu Frenesí en una herramienta, mejorando tu destreza física de varias formas mientras te arriesgas a un Frenesí total.#!"
 UNSEEN_HIBERNATION_PERK_EFFECT: "El Vampiro crea su guarida dentro de formaciones naturales, plantas o tierra, fundiéndose con la oscuridad oculta bajo su superficie."
 WHISTLING_UP_THE_BEAST_PERK_EFFECT: "Usa tu maestría sobre la Bestia para atraer a la Bestia de otros (o la tuya propia) al primer plano."
 POWER_FROM_DARKNESS_PERK_EFFECT: "Los mortales y los seres sobrenaturales se encogen de miedo cuando oyen el rugido de un vampiro con este poder."
 PREDATORS_TRANSFORMATION_PERK_EFFECT: "Adopta la forma de depredadores usando la interacción de [character_interaction|E] Cambiar forma."
 STALKING_DARKNESS_PERK_EFFECT: "Un vampiro que ha dominado Abombwe es un depredador puro, acechando a sus enemigos a través de la oscuridad."
 PREDATORS_MASTERY_PERK_EFFECT: "Usa tu Bestia para dominar a otras bestias; ya sean naturales o sobrenaturales, animales o hombres."
 INCARNATE_DARKNESS_PERK_EFFECT: "Desbloquea la forma de Oscuridad Encarnada.\n#flavor Conviértete en una masa de oscuridad, retorciéndote y girando mientras intentas emular a depredadores desconocidos para el hombre.#!"
 
 # Gift #


 
 
 
 UMBRAL_MAP_PERK_EFFECT: ""
 DANCE_OF_ABANDON_PERK_EFFECT: "Como [character_interaction|E], permite que el objetivo abandone un conjura o incluso una guerra."
 SHADOW_WALK_PERK_EFFECT: ""
 TRICKSTERS_SKIN_PERK_EFFECT: "Desbloquea una [character_interaction|E] para copiar o intercambiar la apariencia propia."
 COYOTES_MASK_PERK_EFFECT: "Como [character_interaction|E], permite otorgarte a ti mismo [GetModifier( 'extra_life_1_modifier' ).GetNameWithTooltip|L]."
 UMBRAL_TARGET_PERK_EFFECT: "Como [character_interaction|E], permite enviar al objetivo a las ubicaciones de la Umbra más profundas y peligrosas."
 COYOTES_HOWL_PERK_EFFECT: "Como [character_interaction|E], permite herir a cada caballero del objetivo.\nInflige a cada gobernante del bando contrario [GetModifier('coyotes_howl_perk_modifier').GetNameWithTooltip] al unirse a una [war|E].\n#F Así como Coyote es el Creador, también es el Destructor. Con el tiempo, borrará todo lo que existe, pues ese es su deber. El Aullido de Coyote permite a los Nuwisha invocar una pequeña parte del poder destructivo de Coyote y desatar esa energía sobre una persona o zona. Cuando se usa, el Aullido de Coyote sacude toda la naturaleza y la doblega hasta convertirla en un motor de aniquilación. Este poder puede manifestarse como un tornado o como una marea gigante. Puede ser un terremoto o una tormenta eléctrica. Sea cual sea el caso, poco puede resistirse al poder del Aullido de Coyote. Este Don es uno de los más poderosos conocidos por los Nuwisha, y Coyote lo enseña a quienes considera dignos.#!"
 COYOTES_HOWL_REQUIREMENT: "@warning_icon!#X Necesitas completar una misión de Coyote (debes situar a un explorador en cualquier reino de la Umbra para encontrar una pista sobre la ubicación e iniciar una [umbra_expedition|E] para llegar a ellos y recibir entonces una misión) para desbloquear esta ventaja.#!"
 
 HATHORS_BLESSING_PERK_EFFECT: "Como [character_interaction|E], permite otorgar [GetModifier( 'hathors_blessing_perk_modifier' ).GetNameWithTooltip|L] al objetivo."
 MERCY_FOR_THE_MISBEGOTTEN_PERK_EFFECT: "Como [character_interaction|E], permite otorgar [GetModifier( 'mercy_for_the_misbegotten_perk_modifier' ).GetNameWithTooltip|L] al objetivo, y también eliminar [GetTrait('eunuch').GetName( GetPlayer )] y [GetTrait('infertile').GetName( GetPlayer )]."
 
 BATS_SHRIEK_PERK_EFFECT: "Otorga [GetModifier('bats_shriek_perk_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E]."
 BLINDING_SPITTLE_PERK_EFFECT: "Otorga [GetModifier('blinding_spittle_perk_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E]."
 THOUSAND_WINGS_FORM_PERK_EFFECT: ""
 READING_THE_DARK_HEART_PERK_EFFECT: "Como [character_interaction|E], permite conocer cada secreto y conjura del objetivo."
 
 TAINT_EVAPORATION_PERK_EFFECT: "Hiere a los [knights|E] y [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E], si sirven al $glossary_wyrm$."
 
 # Meritocracy #
 
 MERITOCRACY_LEGACY_1_PERK_EFFECT: "Cada nuevo Inquisidor será [GetTrait('strong').GetName( GetPlayer )] y [GetTrait('athletic').GetName( GetPlayer )].\n#F Mens sana in corpore sano.#!"
 MERITOCRACY_LEGACY_2_PERK_EFFECT: "Cada nuevo Inquisidor será un mejor Maestro de la Espada o un Cazador.\n#F Si vis pacem, para bellum.#!"
 MERITOCRACY_LEGACY_3_PERK_EFFECT: "Cada nuevo Inquisidor tendrá su calidad de educación aumentada en 1.\n#F Scientia potentia est.#!"
 MERITOCRACY_LEGACY_4_PERK_EFFECT: "Cada nuevo Inquisidor tendrá una mayor frecuencia o calidad de rasgos congénitos positivos.\n#F Genuflectant omnes in plano.#!"
 MERITOCRACY_LEGACY_5_PERK_EFFECT: "Cada nuevo Inquisidor tendrá una mayor probabilidad de poseer [GetTrait('truefaith').GetName( GetPlayer )].\n#F Bis orat qui bene cantat.#!"
 
 # Unity #
 
 UNITY_LEGACY_1_PERK_EFFECT: "Tendrás una mejor probabilidad de éxito al elegir el enfoque marcial o de administración en la [journey|E] Buscar Guarida.\n#F Pacta clara, boni amici.#!"
 UNITY_LEGACY_2_PERK_EFFECT: "Tus [journeys|E] de Buscar Guarida tienen una mayor [planning_speed|E].\n#F Conveniens homini est hominem servare voluptas.#!"
 UNITY_LEGACY_3_PERK_EFFECT: "#F Beatius est magis dare quam accipere#!."
 UNITY_LEGACY_4_PERK_EFFECT: "Entrenar nuevos aprendices será más efectivo.\n#F Artificem commendat opus.#!"
 UNITY_LEGACY_5_PERK_EFFECT: "#F Nulla vis maior pietate vera est.#!"
 
 #Servitude legacy #
 
 #SERVITUDE_LEGACY_2_PERK_EFFECT: "Feudal obligation will be raised."
 
 #Aspiration legacy #
 
 #ASPIRATION_LEGACY_2_PERK_EFFECT: "Feudal obligation will be lowered."
 ASPIRATION_LEGACY_5_PERK_EFFECT: "Mayor probabilidad de heredar [Glossary('Disciplinas','game_concept_discipline_desc')]."
 
 #Ventrue legacy #
 
 VENTRUE_LEGACY_1_PERK_EFFECT: "desbloquea una [character_interaction|E] especial para intercambiar anzuelos con otros Ventrue.\n#F Camilla construyó el mayor imperio que el mundo $pod_cainite$ haya conocido o conocerá jamás. Los Ventrue $pod_clan$ realmente comenzaron con él.#!"
 VENTRUE_LEGACY_2_PERK_EFFECT: "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\n#F La diosa espartana cargó valientemente contra los horrores de Cartago. Los Ventrue $pod_clan$ siempre honrarán su sacrificio.#!"
 VENTRUE_LEGACY_3_PERK_EFFECT: "Desbloquea una [character_interaction|E] especial para imponer [the_masquerade|E].\n#F La muerte idiota de Medon enseñó una lección valiosa a los Ventrue. No subestiméis a los mortales.#!"
 VENTRUE_LEGACY_4_PERK_EFFECT: "#F La exploradora nunca está verdaderamente saciada, pues el mundo es tan infinito como su sed de aventura.#!"
 VENTRUE_LEGACY_5_PERK_EFFECT: "La decisión Organizar la Casa para la Unidad de la Casa de Guerra ahora también otorga un modificador adicional.\n#F El general persa ascendió a la divinidad al sonido de los estruendosos catafractas.#!"
 
 #Setite legacy #
 
 SETITE_LEGACY_1_PERK_EFFECT: "$SNAKES_LEGACY_PERK_UNLOCK_DESC$\n#F El primer hijo, el más devoto, es un ejemplo para todos los Setitas.#!"
 SETITE_LEGACY_2_PERK_EFFECT: "Desbloquea el [scheme|E] de [GetScheme('befriend').GetTypeName].\n#F No hay vergüenza en comer el fruto prohibido en buena compañía.#!"
 SETITE_LEGACY_3_PERK_EFFECT: "#F Siempre hay redención en el Abrazo de Set, incluso para los «Vampiros» más obstinados.#!"
 SETITE_LEGACY_4_PERK_EFFECT: "Desbloquea la construcción especial [GetBuilding('founding_temple_01').GetName].\n#F Regocijaos en Su gloria y orad, pues Él volverá para salvarnos a todos.#!"
 SETITE_LEGACY_5_PERK_EFFECT: "#F La hija perdida, la maldita, la Gran Enemiga... se enfrentará al castigo.#!"
 
 #Baali legacy #
 
 BAALI_LEGACY_1_PERK_EFFECT: "#F Y miré, y he aquí un caballo pálido; y su nombre que cabalgaba sobre él era Muerte, y el Infierno le seguía.#!"
 BAALI_LEGACY_2_PERK_EFFECT: "#F Y vi cuando el cordero abrió uno de los sellos, y oí, como con estruendo de trueno, a uno de los cuatro bestias diciendo: Ven y mira.#!"
 BAALI_LEGACY_3_PERK_EFFECT: "#F Y contemplé, y he aquí un caballo negro; y el que cabalgaba sobre él tenía una balanza en su mano.#!"
 BAALI_LEGACY_4_PERK_EFFECT: "#F Y vi, y he aquí un caballo blanco; y el que cabalgaba sobre él tenía un arco; y se le dio una corona; y salió conquistando y para conquistar.#!"
 BAALI_LEGACY_5_PERK_EFFECT: "#F Y salió otro caballo que era rojo; y se le dio al que cabalgaba sobre él el poder de quitar la paz de la tierra, y que se mataran unos a otros; y se le dio una gran espada.#!"
 
 #Gangrel legacy #
 
 GANGREL_LEGACY_1_PERK_EFFECT: "#F El Padre de Todo observa, con orgullo, cómo sus hijos se enfrentan al Ragnarok con valentía y honor.#!"
 GANGREL_LEGACY_2_PERK_EFFECT: "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\n#F ¡Cabalgo con millones! ¡Soy el Azote de Dios! Y veré vuestro mundo... arder.#!"
 GANGREL_LEGACY_3_PERK_EFFECT: "#F Hukros encontró la verdad de la Madre Oscura hace mucho tiempo. Sus discípulos la han difundido por todas partes desde entonces.#!"
 GANGREL_LEGACY_4_PERK_EFFECT: "Desbloquea una [character_interaction|E] especial con otros Gangrel (excepto tu familia cercana) para realizar el Rito del Estatus, permitiendo oportunidades para profundizar vuestros vínculos.\n#F Y lloró, pues no quedaban más mundos por conquistar.#!"
 GANGREL_LEGACY_5_PERK_EFFECT: "#F La bestia acorralada protege a su rebaño y contraataca con furia y un propósito eterno.#!"
 
   #Ravnos legacy #
 
 RAVNOS_LEGACY_1_PERK_EFFECT: "#F La bondadosa madre de los Rroma protege a su pueblo y les da un propósito.#!"
 RAVNOS_LEGACY_2_PERK_EFFECT: "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\n#F Una guerra eterna necesita un general eterno. Chandraputra es ese hombre.#!"
 RAVNOS_LEGACY_3_PERK_EFFECT: "Desbloquea una [character_interaction|E] especial para realizar un ritual y ganar sabiduría.\n#F El Rakshasa de los Rakshasas se cortó el ojo para poder ver finalmente.#!"
 RAVNOS_LEGACY_4_PERK_EFFECT: "#F Si vives en Egipto, actúa como un egipcio.#!"
 RAVNOS_LEGACY_5_PERK_EFFECT: "#F La maldita, el monstruo, el demonio... el terror en cada corazón sin latido de los Ravnos.#!"
 
  #Cappadocian legacy #
 
 CAPPADOCIAN_LEGACY_1_PERK_EFFECT: "Desbloquea una [character_interaction|E] especial para enviar a tus chiquillos como consejeros a otros gobernantes. Puedes aprender un idioma más antes de alcanzar tu límite.\n#F El hijo fiel oculta sus miedos pero se prepara para lo peor que está por venir.#!"
 CAPPADOCIAN_LEGACY_2_PERK_EFFECT: "Desbloquea una cadena de eventos para contratar a un guardaespaldas Lamia.\n#F La Madre Oscura esconde secretos que solo sus hijas podrían comprender verdaderamente.#!"
 CAPPADOCIAN_LEGACY_3_PERK_EFFECT: "#F El linaje Capadocio, marginado y olvidado, algún día usará máscaras.#!"
 CAPPADOCIAN_LEGACY_4_PERK_EFFECT: "#F Bizancio era una ciudad de sueños mucho antes de que Constantino pusiera un pie en ella.#!"
 CAPPADOCIAN_LEGACY_5_PERK_EFFECT: "#F El hijo traidor conoce la verdad y une a la casa contra él con un propósito.#!"
 
  #Brujah legacy #
 
 BRUJAH_LEGACY_1_PERK_EFFECT: "#F El Rey de Esparta es tan insensible como la punta fría de su lanza. Excepto cuando se trata de un troyano en particular.#!"
 BRUJAH_LEGACY_2_PERK_EFFECT: "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\n#F Casi salvó a Cartago de la ruina. Los Brujah recuerdan su triunfo y lamentan su derrota.#!"
 BRUJAH_LEGACY_3_PERK_EFFECT: "Desbloquea un nuevo Puesto en la corte, el Maestre de Guerra Brujah, para duques y rangos superiores.\n#F El noble proscrito derrotará a tiranos y reyes con espada, arco e ingenio.#!"
 BRUJAH_LEGACY_4_PERK_EFFECT: "#F Para entender verdaderamente el sistema burocrático bizantino, parece que se necesita una princesa rusa.#!"
 BRUJAH_LEGACY_5_PERK_EFFECT: "#F La primera traidora luchó duramente por su utopía, pero Cartago cayó mucho antes de que llegara el romano.#!"
 
 
  #Tremere legacy #
 
 TREMERE_LEGACY_1_PERK_EFFECT: "Desbloquea la [character_interaction|E] ritual para crear personajes Gárgola.\n#F Cuando luchas por tu propia supervivencia, hay que hacer sacrificios. Muchos sacrificios.#!"
 TREMERE_LEGACY_2_PERK_EFFECT: "#F La única mujer que se ha ganado el respeto de Tremere es el fundamento mismo de la Pirámide.#!"
 TREMERE_LEGACY_3_PERK_EFFECT: "#F En la Pirámide, todos tenéis un propósito y un lugar. Por debajo de vuestros superiores.#!"
 TREMERE_LEGACY_4_PERK_EFFECT: "#F Ella ama a sus creaciones y ellas la aman a ella. La Pirámide pronto temblará.#!"
 TREMERE_LEGACY_5_PERK_EFFECT: "Puedes aprender un idioma más antes de alcanzar tu límite.\n#F El aprendizaje y la sabiduría son las cualidades, a menudo olvidadas, que hacen a un verdadero mago Tremere.#!"
 
  #Toreador legacy #
 
 TOREADOR_LEGACY_1_PERK_EFFECT: "#F El arte y la decadencia son una misma cosa para algunos.#!"
 TOREADOR_LEGACY_2_PERK_EFFECT: "#F La troyana se vengará, aunque el mundo tenga que arder antes.#!"
 TOREADOR_LEGACY_3_PERK_EFFECT: "La decisión de Placación de Vasallos para la Unidad de la Casa ahora también otorga un modificador adicional.\n#F El arcángel perdió la razón y el mundo perdió su última esperanza. La Edad Oscura nunca terminará.#!"
 TOREADOR_LEGACY_4_PERK_EFFECT: "$PERK_CAN_SIGN_ALLIANCE$\n#F Cuidado con la mujer despechada, pues su furia nunca terminará.#!"
 TOREADOR_LEGACY_5_PERK_EFFECT: "Desbloquea un conjunto de cinco edificios «Patrocinados», caros pero poderosos.\n#F El arte y la belleza no son el medio, son el fin digno de todos los sacrificios.#!"
 
 #Salubri legacy #
 
 SALUBRI_LEGACY_1_PERK_EFFECT: "#F Su venganza es una visión aterradora, pero ningún fuego arde para siempre.#!"
 SALUBRI_LEGACY_2_PERK_EFFECT: "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\n#F La Espada de los Salubri nunca conoció la derrota, ni siquiera en la muerte.#!"
 SALUBRI_LEGACY_3_PERK_EFFECT: "Desbloquea el sistema de castas para tu dinastía.\nLos personajes de las Casas Rayzeel, Mokur, Hrorsh y Enosh probablemente acabarán siendo Sanadores.\nLos personajes de las Casas Samiel y Twilight probablemente acabarán siendo Guerreros.\nLos personajes de la Casa Watcher probablemente acabarán siendo Vigilantes.\nLa educación también influye ligeramente.\n#F Cantará mientras el mundo arde a su alrededor. Y quizás sea suficiente.#!"
 SALUBRI_LEGACY_4_PERK_EFFECT: "#F Sabio es el hombre que se prepara para refugiarse cuando se avecina la guerra.#!"
 SALUBRI_LEGACY_5_PERK_EFFECT: "Reducción del 60 % en el coste de las Guerras Santas.\n#F El traidor nunca se enfrentó a la justicia y fue el último en reír. Una victoria amarga para un hombre destrozado.#!"
 
 #Lasombra legacy#
 
 LASOMBRA_LEGACY_1_PERK_EFFECT: "#F La hija repudiada trama su venganza. Contra las sombras usará el fuego definitivo.#!"
 LASOMBRA_LEGACY_2_PERK_EFFECT: "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\n#F La Reconquista de las Sombras tendrá éxito, pero su vencedor definitivo podría no ser el más obvio.#!"
 LASOMBRA_LEGACY_3_PERK_EFFECT: "#F Verdaderamente, el Más Misericordioso trasciende incluso la muerte.#!"
 LASOMBRA_LEGACY_4_PERK_EFFECT: "#F Cada Lasombra siente el llamado del mar, para ser parte de la sombra más profunda que existe en lo más profundo de todo.#!"
 LASOMBRA_LEGACY_5_PERK_EFFECT: "#F Constantinopla tuvo su amarga venganza mientras Venecia ardía con ella.#!"
 
  #Banu Haqim legacy#
 
 BANUHAQIM_LEGACY_1_PERK_EFFECT: "#F Ocultos tras un velo de secreto, los Banu Haqim son temidos mucho más allá de sus fronteras de Oriente Medio.#!"
 BANUHAQIM_LEGACY_2_PERK_EFFECT: "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\n#F Los Indomables alcanzarán nuevas alturas. Ni siquiera la muerte les robará su honor.#!"
 BANUHAQIM_LEGACY_3_PERK_EFFECT: "#F Ser el Primogénito no significa mucho sin el apoyo de tus iguales.#!"
 BANUHAQIM_LEGACY_4_PERK_EFFECT: "#F El traidor cartaginés todavía vaga por la noche, una vergüenza para todos los verdaderos Banu Haqim.#!"
 BANUHAQIM_LEGACY_5_PERK_EFFECT: "#F El Pastor Negro purgará la Tierra de los indignos. Esta es la única salvación que llega a este mundo condenado.#!"
 
  #Malkavian legacy#
 
 MALKAVIAN_LEGACY_1_PERK_EFFECT: "#F Los profetas del desastre rara vez son bienvenidos, pero suelen tener razón.#!"
 MALKAVIAN_LEGACY_2_PERK_EFFECT: "Desbloquea una [character_interaction|E] personal especial para «tomar prestadas» habilidades.\n#F El último auténtico Príncipe Malkavian luchó valientemente contra los horrores de Cartago y se ganó el respeto de todos.#!"
 MALKAVIAN_LEGACY_3_PERK_EFFECT: "Desbloquea una [character_interaction|E] especial para reducir la resistencia a conjuras de otro gobernante si este tiene algún cortesano Malkavian.\n#F ¿Estoy mintiendo? ¿Estás mintiendo? ¡¿ESTÁ EL MUNDO MINTIENDO?!#!"
 MALKAVIAN_LEGACY_4_PERK_EFFECT: "#F Solo una agradable y elegante cena con las cabezas de mis cortesanos.#!"
 MALKAVIAN_LEGACY_5_PERK_EFFECT: "#F ¿Es malo vender tu alma al mal cuando ni siquiera tenías alma para empezar?#!"
 
  #Nosferatu legacy#
 
 NOSFERATU_LEGACY_1_PERK_EFFECT: "$PERK_CAN_SIGN_ALLIANCE$\n#F El orgulloso monstruo se mantiene firme contra los horrores de la noche, elevando a su $pod_clan$ a mayores alturas.#!"
 NOSFERATU_LEGACY_2_PERK_EFFECT: "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial.\n#F Los antiguos de Oriente Medio no fueron rival para las probadas habilidades y la fe imperturbable de Tarique.#!"
 NOSFERATU_LEGACY_3_PERK_EFFECT: "#F Dinamarca fue creada por y para Absalón, y será destruida por él.#!"
 NOSFERATU_LEGACY_4_PERK_EFFECT: "La decisión de Imponer Red de Intriga para la Unidad de la Casa ahora otorgará su modificador durante el doble de tiempo.\n#F La furia y el odio son malos consejeros, pero un gran combustible para la Bestia.#!"
 NOSFERATU_LEGACY_5_PERK_EFFECT: "#F La Pequeña Abuela es la única y aterradora esperanza contra horrores aún más espantosos.#!"

   #Caitiff legacy#
 
 CAITIFF_LEGACY_1_PERK_EFFECT: ""
 CAITIFF_LEGACY_2_PERK_EFFECT: ""
 CAITIFF_LEGACY_3_PERK_EFFECT: ""
 CAITIFF_LEGACY_4_PERK_EFFECT: ""
 CAITIFF_LEGACY_5_PERK_EFFECT: "Desbloquea un rasgo de comandante especial para cada miembro de la dinastía con educación marcial."

  #Gargoyle legacy #
 GARGOYLE_LEGACY_1_PERK_EFFECT: "#F Proporciona un palomar para que las gárgolas errantes se unan a tu señorío.#!"
 GARGOYLE_LEGACY_2_PERK_EFFECT: "#F Podría haber liberado a más si tan solo hubieran sabido que eran esclavos.#!"
 GARGOYLE_LEGACY_3_PERK_EFFECT: "#F Un buen vuelo nunca mató a un enemigo.#!"
 GARGOYLE_LEGACY_4_PERK_EFFECT: "Los miembros de la dinastía con un alto [learning|E] ganan Hechicería de Sangre $pod_discipline$ y una interacción ritual [character_interaction|E] para crear personajes Gárgola.\n#F El conocimiento es poder; el conocimiento robado sigue siendo poder.#!"
 GARGOYLE_LEGACY_5_PERK_EFFECT: "#F Sobre todas las cosas, respétate a ti mismo.#!"
 
 #Nagaraja legacy #
 
 NAGARAJA_LEGACY_1_PERK_EFFECT: "Canibalizar [prisoners|E] otorga una pequeña cantidad de [dread_i][dread|E].\nDesbloquea la [decision|E] [GetDecision('recruit_itarajana_sorcerer_decision').GetName].\n#F Otros podrán despreciarnos por nuestra forma de alimentarnos, pero conocemos la verdad. Devorar es gobernar. Masticar es conquistar. Tragar es reinar.#!"
 NAGARAJA_LEGACY_2_PERK_EFFECT: "Desbloquea la [decision|E] [GetDecision('convene_silent_conclave_decision').GetName].\n#F Atiborrarse con la carne de los caídos es afilar la sabiduría.#!"
 NAGARAJA_LEGACY_3_PERK_EFFECT: "Desbloquea la [decision|E] [GetDecision('pilgrimage_to_enoch_decision').GetName].\n#F Las Tierras de las Sombras devoran a los que no están preparados. Solo nosotros tenemos la capacidad de navegar por ellas con un propósito mientras otros tropiezan en la oscuridad.#!"
 NAGARAJA_LEGACY_4_PERK_EFFECT: "#F Tanto los vivos como los muertos nos temen, porque no nos comprenden. Salvo una cosa: nuestra hambre es infinita.#!"
 NAGARAJA_LEGACY_5_PERK_EFFECT: "#F La vida, la muerte, los Espíritus y la carne son solo alimento. Con cada uno devorado, el mundo se pudre más rápido mientras se prepara para ser devorado.#!"

