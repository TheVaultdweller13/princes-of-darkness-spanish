 # KJ legacy #
 
 FUXI_LEGACY_PERK_EFFECT: "#F Fuxi, el primero de los Tres Soberanos, enseñó a su pueblo a pescar y cazar, cómo criar ganado y gusanos de seda y cómo construir viviendas permanentes. Fuxi también creó los ocho trigramas utilizados para la adivinación con el I Ching#!"
 SHENNONG_LEGACY_PERK_EFFECT: "#F Shennong, el segundo de los Tres Soberanos, mostró a su pueblo el arado y el tejido y cómo dejar las ofrendas adecuadas para los poderes del Cielo. Shennong fue también el primer médico#!"
 HUANGTI_LEGACY_PERK_EFFECT: "#F Huang-ti fue el tercero de los Tres Soberanos. Fue el primer alquimista y el primer constructor de barcos. También desarrolló armaduras y los primeros ejércitos para suprimir a las tribus bárbaras que amenazaban a su pueblo#!" 
 
