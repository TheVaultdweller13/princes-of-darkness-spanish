 #Inquisitors convictions
 OCULI_TRUST_PERK_TEXT: "Desbloquea la interacción de personaje «Guía espiritual» [character_interaction|E], que te permite enseñar tus rasgos virtuosos a otros Inquisidores.\nDesbloquea un movimiento de duelo.\n#flavor Al alabar a Dios, el agente puede infundir en otros el amor por Él y sus leyes.#!"
 SISTERS_CHORALE_PERK_TEXT: "Desbloquea la decisión menor «Prueba de fe», que te da la oportunidad de deshacerte de tus rasgos pecaminosos y sustituirlos por sus contrapartes piadosas.\n#flavor Obtener fuerza, conocimiento o protección mediante un canto comunitario.#!"
 RED_MARCH_PERK_EFFECT_TEXT: "#flavor Este rito permite un viaje rápido sin importar el cansancio y las condiciones difíciles tras una súplica suficiente ante Dios.#!"
 OCULI_SHEPHERD_PERK_TEXT: "Desbloquea la decisión [deceitful_progress_hostile_schemes_decision|E].\n#flavor Permite que el Ojo de Dios se oculte a plena vista mientras realiza la obra del Cielo y nuble la mente de quienes pretendan obstaculizar su santa misión.#!"
 MURNAU_OBLIGE_PERK_TEXT: "Desbloquea la decisión [diligent_development_focus_decision|E].\n#flavor Siendo todavía una casa noble hasta la médula, los Murnau ven a otros como sus protegidos. La prosperidad de sus tierras es un deber no menos sagrado que su compromiso con la Inquisición.#!"
 ACRE_RESURRECTION_PERK_TEXT: "Puede reclutar a [GetMaA('vampires_hunters').GetName] como [men_at_arms|E].\nDesbloquea una [character_interaction|E] que te permite curar la mayoría de las dolencias mundanas de un personaje.\n#flavor Algunos caballeros están investidos divinamente con el poder de controlar el flujo y reflujo de la fuerza vital dentro de sí mismos y de los demás. Incluso pueden usar el poder de la vida misma para evaporar la esencia infernal de los condenados.#!"
 RED_FORTUNES_PERK_TEXT: "Puede reclutar a [GetMaA('demons_hunters').GetName] como [men_at_arms|E].\n#flavor A través de este rito sagrado, un practicante puede bendecir a un grupo de combatientes armados en su camino hacia la batalla contra el enemigo.#!"
 MURNAU_MIRROR_PERK_TEXT: "Puede reclutar a [GetMaA('monsters_hunters').GetName] como [men_at_arms|E].\nDesbloquea un movimiento de duelo.\n#flavor La capacidad de enfrentarse a la oposición sobrenatural en igualdad de condiciones, armado con una fuerza y un conocimiento que no debería poseer. Los Murnau lo llaman inspiración divina; otros usan términos menos halagadores.#!"
 OCULI_LITURGY_PERK_TEXT: "Reclutar a un invitado ahora cuesta un 50 % menos de oro.\n#flavor Mediante la recitación de las escrituras, el Ojo de Dios puede imponer su dedicación a la causa en otro individuo.#!"
 SISTERS_GOSPEL_PERK_TEXT: "Un prisionero torturado revelará siempre sus secretos si tiene alguno.\n#flavor Otorga a las Hermanas una gran habilidad para el debate, la oratoria y, si es necesario, el interrogatorio.#!"
 ACRE_CATECHUMEN_PERK_TEXT: "Puede esparcirse contra sus propios [knights|E] en [single_combat_fight|E] para ganar [modifiers|E].\nDesbloquea un movimiento de duelo.\n#flavor Permite al inquisidor ejemplificar sus primeras lecciones de valor, humildad y constancia.#!"
 ACRE_FLESH_PERK_TEXT: "Desbloquea un movimiento de duelo.\n#flavor El caballero ha sido investido con el poder de alterar sus capacidades físicas invocando su inquebrantable virtud.#!"
 ACRE_FLIGHT_PERK_TEXT: "Desbloquea un movimiento de duelo.\n#flavor Permite al inquisidor cosechar el torbellino divino cuando está en combate con los secuaces del Adversario.#!"
 ACRE_AUTO_PERK_TEXT: "Desbloquea un movimiento de duelo.\n#flavor Una razón fundamental por la que los secuaces del Adversario temen a los Caballeros de Dios; esta bendición permite al Inquisidor concentrar su virtud y su fuerza en lo que seguramente será el golpe decisivo de cualquier duelo.#!"
 RED_VIGIL_PERK_TEXT: "#flavor Este rito proporciona al sujeto una energía que le libera de la necesidad de dormir o descansar.#!"
 RED_SUNSTONE_PERK_TEXT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n#flavor Infunde en una roca ordinaria la bendición de la primera creación del Señor, el Sol. El brillo de la piedra es entonces comandado por la virtud de quien la porta.#!"
 RED_FORGE_PERK_TEXT: "#flavor Santifica el proceso de forja de un arma para producir armamento bendecido.#!"
 SISTERS_LUX_PERK_TEXT: "$countermeasures_unlocks_t1_supernatural_high_alert$ \n #flavor Haciendo eco de las palabras del Padre, el inquisidor proclama: «¡Que se haga la luz!» y un suave nimbo de luz blanca aparece a su alrededor, iluminando a las criaturas sobrenaturales tal como son.#!"
 SISTERS_HOSANNA_PERK_TEXT: "Desbloquea un movimiento de duelo.\n#flavor Los Inquisidores usan este poder para capturar la «longitud de onda» espiritual del Canto del Cielo, usando su poder para fomentar la Gloria de Dios.#!"
 SISTERS_ORATORIO_PERK_TEXT: "Desbloquea un movimiento de duelo.\n#flavor Permite a la Hermana alzar la voz en un canto y llenar a los oyentes con la brillante radiancia de su fe, lo cual es una experiencia devastadora para los esclavos del pecado. #!"
 MURNAU_KNOWLEDGE_PERK_TEXT: "$countermeasures_unlocks_t1_supernatural_high_alert$ \n #flavor La familia Von Murnau ha sido plagada (o bendecida) con una familiaridad innata y la capacidad de sentir toda clase de corrupción durante generaciones.#!"
 MURNAU_WREATHED_PERK_TEXT: "#flavor El dominio del lado oscuro de la propia naturaleza de los Murnau que les permite afectarla en otros. «Aunque camine por el valle de la sombra de muerte...» #!"
 MURNAU_ARCANA_PERK_TEXT: "Desbloquea un movimiento de duelo.\n#flavor La capacidad de obstaculizar, desviar o evitar las acciones de los engendros del infierno. Esta habilidad suele tener un precio para el alma del Inquisidor, pero permite reflejar los poderes sobrenaturales contra el usuario cuando se domina.#!"
 OCULI_SIGHT_PERK_TEXT: "Deshabilita algunos movimientos de duelo enemigos basados en la ofuscación.\n#flavor La Visión permite al Inquisidor buscar criaturas sobrenaturales sin importar sus esfuerzos por evitar ser observadas.#!"
 OCULI_WINE_PERK_TEXT: "#flavor El inquisidor puede tomar un objeto ordinario y transformarlo en algo distinto o devolver el tejido muerto o moribundo a su estado saludable.#!"



