 # Celerity # 
 BLINK_PERK_EFFECT: "Desbloquea una [character_interaction|E] para aumentar enormemente la velocidad de movimiento de tu ejército. En esta etapa, es muy costoso.\n#flavor Ahora te mueves con tanta rapidez, entablando combate con un enemigo o escapando en un abrir y cerrar de ojos, que ante un observador desprevenido casi pareces teletransportarte; una ráfaga de viento es la única señal de tu paso.#!"
 CATS_GRACE_PERK_EFFECT: "#flavor Ganas equilibrio y gracia sobrenaturales, volviéndote capaz de caminar incluso por los salientes y soportes más estrechos.#!"
 DRAUGHT_OF_ELEGANCE_PERK_EFFECT: "Como opción de [Glossary('Draught','game_concept_blood_draught_desc')] [character_interaction|E], puedes dotar a alguien de tu rapidez sobrenatural.\n#flavor Tu sangre se satura con el poder de la Celeridad, transmitiendo parte de tu poder a cualquiera que la beba.#!"
 FLEETNESS_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$ \n#flavor Tu maestría en Celeridad ahora te permite moverte y reaccionar con una velocidad vertiginosa.#!"
 LIGHTNING_STRIKE_PERK_EFFECT: "La [character_interaction|E] de Parpadeo ya no te otorga el modificador [GetModifier('POD_drained_modifier').GetNameWithTooltip].\n#flavor Más rápido de lo que el ojo puede seguir, puedes golpear con el puño o con un arma cuerpo a cuerpo a tal velocidad que tus oponentes son incapaces de defenderse o realizar una acción evasiva.#!"
 RAPID_REFLEXES_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$ \n#flavor Aunque sus cuerpos aún no pueden desafiar las leyes de la naturaleza, los vampiros con este poder perciben los eventos instantáneamente y pueden reaccionar ante ellos con una alacridad sobrehumana.#!"
 SPLIT_SECOND_PERK_EFFECT: "La [character_interaction|E] de Parpadeo ya no te causa estrés.\n#flavor Al actuar con la velocidad de tu percepción sobrecargada, tus emboscadores encuentran a su presa ya de pie detrás de ellos, y los favores solicitados se cumplen antes de que las palabras salgan de la boca del suplicante.#!"
 TRAVERSAL_PERK_EFFECT: "$countermeasures_unlocks_t3_supernatural_high_alert$ \n#flavor Con una velocidad borrosa, puedes correr o escalar por cualquier superficie, incluyendo subir por paredes e incluso cruzar medios líquidos.#!"
 PRECISION_PERK_EFFECT: "#F Entra en un trance donde puedes operar con una manipulación excepcionalmente fina.#!"
 TIRELESS_TREAD_PERK_EFFECT: "#F Corre a 80 km/h durante al menos ocho horas.#!"
 QUICKNESS_PERK_EFFECT: "Como [character_interaction|E], permite eliminar el tiempo de reutilización de una decisión.\nComo [character_interaction|E], permite eliminar el tiempo de reutilización de una conjura.\n#F Gasta puntos de sangre extra para obtener acciones adicionales, a costa de un nivel de daño letal que no se puede mitigar por acción#!"
 PHYSICAL_DEFIANCE_PERK_EFFECT: "#F Muévete tan rápido que desafíes la gravedad y mates a los mortales instantáneamente al pasar a través de ellos.#!"
 TIME_OUT_OF_TIME_PERK_EFFECT: "$countermeasures_unlocks_t4_supernatural_high_alert$ \nComo [character_interaction|E], permite aumentar el progreso de una conjura.\n#F Reacciona instantáneamente a cualquier cosa y muévete antes de que nadie se dé cuenta de lo que has hecho.#!"
 BETWEEN_THE_TICKS_PERK_EFFECT: "Como [character_interaction|E], permite obtener el modificador [GetModifier('POD_between_the_ticks_modifier').GetNameWithTooltip].\n#F Un vampiro que ha alcanzado este nivel de maestría es literalmente más rápido de lo que el ojo humano puede ver. Otros vampiros —incluso algunos con Auspex— tienen dificultades para notarlo. Otros seres parecen casi estatuas inanimadas, congeladas en el tiempo mientras ella se mueve a su alrededor.#!"

 # Dominate # 

 COMPEL_PERK: "Invitar a la [court|E] Aceptación: #P +10#!"
 RATIONALIZE_PERK_EFFECT: "Al usar la conjura de [GetScheme('PODmesmerize').GetTypeName] una segunda vez, puedes mejorar su [weak_hook|E] a un [perpetual_hook|E].\nAl convencer a la víctima de que actuó por su propia voluntad, desbloqueas un nuevo comando de Dominación: iniciar una conjura. También puedes obtener más oro utilizando comandos de Dominación."
 CLOUD_MEMORY_PERK: "Mejora tu control sobre la Mascarada, dándote menos riesgos de ser expuesto y más oportunidades de cubrirla en instancias específicas."
 MESMERIZE_PERK: "Desbloqueas la [GetScheme('abduct').GetTypeName] [scheme|E]. Además, ganas la capacidad de comandar a otros de diversas formas, abriendo la conjura de [GetScheme('PODmesmerize').GetTypeName]."
 THE_FORGETFUL_MIND_PERK: "Desbloqueas una mejor opción para la [character_interaction|E] de cubrir la Mascarada. También permite una [character_interaction|E] que puede conducir a un aumento de opinión con el objetivo."
 SUBMERGED_DIRECTIVE_PERK: "Tus anzuelos de Dominación también duran más, permitiéndote dar órdenes en una fecha posterior."
 MASS_MANIPULATION_PERK: "Puede reclutar a [GetMaA('maniacs').GetName] como [men_at_arms|E]."
 DEEP_MEMORIES_PERK: "Puedes cambiar los rasgos de personalidad y la sexualidad de tus Ghouls y [POD_herd|E]"  
 CONDITIONING_PERK: "Al usar la conjura de [GetScheme('PODmesmerize').GetTypeName] una tercera vez, puedes mejorar su [perpetual_hook|E] a un [strong_hook|E].\n#F Al dominar a una persona varias veces y usar un comando para reducir su libre albedrío, el vampiro puede convertirla finalmente en un sirviente ideal.#!"
 WILL_CONQUERS_PERK: "Tus comandos de Dominación se vuelven mucho más difíciles de resistir."
 TERMINAL_DECREE_PERK: "Añade un nuevo comando de Dominación: Intentar suicidio."
 REWRITE_PERSONALITY_PERK: "Puedes cambiar la personalidad y la sexualidad de los personajes sobre los que hayas usado el [GetScheme('PODmesmerize').GetTypeName] [scheme|E]."
 CONCORD_OF_SUBMISSION_PERK: "Añade la opción de Dominación: Detener guerra - obliga al objetivo a cesar las hostilidades con el lanzador mediante una paz blanca."
 MOLD_HUMOURS_PERK: "Desbloquea la capacidad de cambiar el tipo de Resonancia de tu [POD_herd|E]."
 SPEAK_THROUGH_THE_BLOOD_PERK: "Emite una orden que resonará en tu Línea de Sangre, afectando a cada uno de tus progenie y obligándolos a actuar."
 PASSION_PERK: "Desbloquea la capacidad de cambiar la intensidad de la Resonancia de tu [POD_herd|E]."
 
 # Fortitude # 

 DEFY_BANE_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$ \n #flavor Al prepararse mediante el gasto de poder, el vampiro puede volverse temporalmente resistente al fuego y a la luz solar, así como a otras heridas graves que podrían amenazarle con la Muerte Definitiva. Al usar Fortaleza, el vampiro es inmune a las mutilaciones durante las grandes batallas.#!"
 DRAUGHT_OF_ENDURANCE_PERK_EFFECT: "Como opción de [character_interaction|E] de [Glossary('Draught','game_concept_blood_draught_desc')], puedes otorgar tu resistencia sobrenatural a alguien.\n#flavor Tu sangre se satura con el poder de la Fortaleza, transmitiendo parte de tu poder a cualquiera que beba de ella.#!"
 FLESH_OF_MARBLE_PERK_EFFECT: "$countermeasures_unlocks_t3_supernatural_high_alert$ \n#flavor El poder de la Sangre hace que la piel del vampiro se endurezca, adquiriendo un brillo marmóreo que sigue siendo flexible pero que detiene casi cualquier golpe antes de romperse y reformarse momentáneamente.#!"
 FORTIFY_THE_INNER_FACADE_PERK_EFFECT: "$countermeasures_unlocks_t2_mental_fortress$ \n#flavor En lugar de endurecer el cuerpo físico del vampiro, este poder permite al usuario proteger sus pensamientos y emociones de la intrusión sobrenatural.#!"
 PROWESS_FROM_PAIN_PERK_EFFECT: "Desbloquea una nueva [character_interaction|E] de Fortaleza.\n#flavor Las heridas e impedimentos ahora solo alimentan los poderes del vampiro, que se vuelve más fuerte y rápido con cada golpe, tajo o desgarro recibido.#!" #Grants you a [character_interaction|E] to embrace the pain and use it to make yourself stronger.
 RESILIENCE_PERK_EFFECT: "#flavor Dotado de resistencia sobrenatural, la determinación física del usuario se fortalece.#!"
 TOUGHNESS_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$ \n #flavor Todos los vampiros con este poder muestran una capacidad innata para ignorar el daño que, de otro modo, incomodaría e incluso incapacitaría a otros de su especie. Con esta ventaja, podrás absorber heridas, usando la sangre para evitar ser herido.#!"
 UNSWAYABLE_MIND_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$ \n #flavor El usuario gana una capacidad mística para resistir cualquier intento de influir en él mediante encantos mundanos, coerción y estratagemas.#!"
 BLESSING_OF_VITALITY_PERK_EFFECT: "Concede más de tu resistencia antinatural con tu pócima de resistencia, otorgando a tu objetivo elegido los beneficios del poder de fortaleza mientras la pócima dure."
 KNIGHTS_BANE_PERK_EFFECT: "Otorga un movimiento de [single_combat_duel|E] para destruir el arma de tu oponente con tu propia carne, infligiéndole daño en el proceso."
 CURSE_THE_LAUREL_PERK_EFFECT: "#flavor Aleja una estaca de tu corazón, eliminándola eventualmente.#!"
 WRATH_OF_THE_MARTYR_PERK_EFFECT: "Mejora la bonificación de Destreza por Dolor al aumentar el poder que extraes del dolor." 
 ARMOURED_FLESH_PERK_EFFECT: "#flavor Nada menos que un golpe letal te matará. Ninguna cantidad de heridas acabará jamás con tu vida, solo la destrucción completa o la decapitación.#!"
 RESILIENT_MIND_PERK_EFFECT: "Desbloquea una nueva [character_interaction|E] de Fortaleza.\n#flavor Tu mente se libera de la locura y de los rasgos animales mientras se vuelve resistente a los poderes que alteran la mente.#!"
 
 # Obfuscate # 
 
 CLOAK_OF_SHADOWS_PERK_EFFECT: "$countermeasures_unlocks_t1_obfuscated_court$ \n #flavor Al permanecer perfectamente inmóvil, el usuario se funde con el entorno. Mientras tenga algo de cobertura, no haga ruido y no se mueva, solo los medios mecánicos o sobrenaturales podrán detectarlo.#!"
 CLOAK_THE_GATHERING_PERK_EFFECT: "#flavor El vampiro puede proteger a sus compañeros bajo el manto de Ofuscación.#!"
 IMPOSTORS_GUISE_PERK_EFFECT: "#flavor Con preparación, el vampiro puede presentarse como un individuo específico de cualquier complexión y género. El usuario debe estudiar cuidadosamente al sujeto. De lo contrario, la farsa fracasará al encontrarse con alguien que tenga más que una familiaridad casual con la persona imitada.#!"
 MASK_OF_A_THOUSAND_FACES_PERK_EFFECT: "$countermeasures_unlocks_t3_obfuscated_court$ \n Desbloquea una [character_interaction|E] para copiar la apariencia de alguien.\n#flavor En lugar de desaparecer, el vampiro que usa este poder puede presentarse como un extraño anodino: alguien que se espera que esté presente en la zona.#!"
 MASK_OF_A_THOUSAND_FACES_PERK_BONUS_VALUE: "[GetPerk('mask_of_a_thousand_faces_perk').GetName(GetPlayer)]"
 SILENCE_OF_DEATH_PERK_EFFECT: "Desbloquea una [character_interaction|E] para reducir severamente el alcance diplomático de un personaje con tierras.\n#flavor Este poder silencia por completo al usuario, anulando todo sonido que emita. A diferencia de la Ofuscación en general, este poder solo funciona sobre el sentido del oído, pero a cambio, opera de forma más robusta. Un vampiro necesita hacer muchísimo ruido para romper este silencio.#!"
 UNSEEN_PASSAGE_PERK_EFFECT: "$countermeasures_unlocks_t2_obfuscated_court$ \n Velocidad de progreso de [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\nAumenta la probabilidad de éxito de la [decision|E] Escapar de la prisión.\n#flavor Con este poder, el vampiro ahora puede moverse mientras permanece oculto.#!"
 UNSEEN_PASSAGE_PERK_BONUS_VALUE: "[GetPerk('unseen_passage_perk').GetName(GetPlayer)]"
 VANISH_PERK_EFFECT: "Desbloquea una [character_interaction|E] para detener todas las conjuras dirigidas hacia ti.\nComo [character_interaction|E], te permite copiar la apariencia de tu objetivo.\n#flavor El vampiro parece desvanecerse en un abrir y cerrar de ojos; incluso el recuerdo de él se vuelve borroso e indistinto.#!"
 MASK_OF_JANUS_PERK_EFFECT: "$countermeasures_unlocks_t4_obfuscated_court$ \n Bonificación a Máscara [character_interaction|E], permite intercambiar apariencias.\n#F Intercambia tu apariencia, como con la Máscara de mil caras, con otra persona.#!"
 VEIL_THE_LEGIONS_PERK_EFFECT: "#F Esconde a un pequeño ejército a distancia.#!"
 VISIT_FAERIELAND_PERK_EFFECT: "#F Entra en el Sueño.#!"
 HORRID_COUNTENANCE_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_horrid_countenance_modifier' ).GetNameWithTooltip|L].\n#F Adopta la apariencia de una entidad monstruosa que cada persona ve como su pesadilla personal.#!"
 OLD_FRIEND_PERK_EFFECT: "Desbloquea una [character_interaction|E] para hacerte amigo del objetivo.\n#F Haz que alguien te vea como un amigo de confianza y confidente.#!"
 CREATE_NAME_PERK_EFFECT: "Desbloquea una [character_interaction|E] para eliminar todo [hook|E], reclamo, tregua, conocimiento secreto y relación del objetivo.\n#F Crea una identidad completamente nueva para ti mismo que supere cualquier sospecha.#!"
 
 # Necromancy # 
 
 ONE_WITH_DEAD_1_PERK_EFFECT: "Aumenta la probabilidad de éxito de los hechizos de [necromancy|E] [bs_spell|E] en un 15\nDisminuye la probabilidad de éxito de los hechizos de [necromancy|E] [bs_spell|E] hostiles en un 10"
 ONE_WITH_DEAD_2_PERK_EFFECT: "Aumenta la probabilidad de éxito de los hechizos de [necromancy|E] [bs_spell|E] en un 15\nDisminuye la probabilidad de éxito de los hechizos de [necromancy|E] [bs_spell|E] hostiles en un 10"
 ONE_WITH_DEAD_3_PERK_EFFECT: "Aumenta la probabilidad de éxito de los hechizos de [necromancy|E] [bs_spell|E] en un 15\nDisminuye la probabilidad de éxito de los hechizos de [necromancy|E] [bs_spell|E] hostiles en un 10"
 ONE_WITH_DEAD_4_PERK_EFFECT: "Aumenta la probabilidad de éxito de los hechizos de [necromancy|E] [bs_spell|E] en un 15\nDisminuye la probabilidad de éxito de los hechizos de [necromancy|E] [bs_spell|E] hostiles en un 10"

 DEATH_MASTERY_1_PERK_EFFECT: "Aumenta la velocidad de los rituales de [necromancy|E] [bs_ritual|E] en un 10%"
 DEATH_MASTERY_1_PERK_BONUS_VALUE: "[GetPerk('death_mastery_1_perk').GetName(GetPlayer)]"
 DEATH_MASTERY_2_PERK_EFFECT: "Aumenta la velocidad de los rituales de [necromancy|E] [bs_ritual|E] en un 10%"
 DEATH_MASTERY_2_PERK_BONUS_VALUE: "[GetPerk('death_mastery_2_perk').GetName(GetPlayer)]"
 DEATH_MASTERY_3_PERK_EFFECT: "Aumenta la velocidad de los rituales de [necromancy|E] [bs_ritual|E] en un 10%"
 DEATH_MASTERY_3_PERK_BONUS_VALUE: "[GetPerk('death_mastery_3_perk').GetName(GetPlayer)]"
 DEATH_MASTERY_4_PERK_EFFECT: "Aumenta la velocidad de los rituales de [necromancy|E] [bs_ritual|E] en un 10%"
 DEATH_MASTERY_4_PERK_BONUS_VALUE: "[GetPerk('death_mastery_4_perk').GetName(GetPlayer)]"

 #Sepulchre Path

 INSIGHT_PERK_EFFECT: "Si cualquiera de tus parientes o amigos es asesinado en circunstancias misteriosas, conocerás la identidad de su asesino."
 INSIGHT_PERK_FLAVOR: "#flavor Los muertos caminan entre nosotros sin ser vistos ni oídos. Para comandarlos, un nigromante debe ser capaz de percibirlos.#!"
 SUMMON_SOUL_PERK_EFFECT: "$POD_can_summon_on_death_trigger_loca$\nNúmero máximo de $POD_splat_wraith_plural$ vinculados: #P +1#!."
 SUMMON_SOUL_PERK_FLAVOR: "#flavor Invocar Alma permite a un nigromante invocar a un fantasma de vuelta desde el [UmbraGlossaryLocalized('shadowlands','Underworld')] .#!"
 COMPEL_SOUL_PERK_EFFECT: "Desbloquea la interacción [bind_wraith_interaction|E].\nNúmero máximo de $POD_splat_wraith_plural$ vinculados: #P +1#!."
 COMPEL_SOUL_PERK_FLAVOR: "#flavor Usando este poder, un vampiro puede doblegar a un fantasma a su voluntad por un corto tiempo. Esta habilidad requiere una confianza suprema, ya que un fallo en la determinación puede tener consecuencias desastrosas para un nigromante.#!"
 HAUNTING_PERK_EFFECT: "Facilita el Vincular a un [GetTrait('wraith').GetName( GetNullCharacter )] mediante la interacción de Vincular wraith [character_interaction|E]."
 HAUNTING_PERK_FLAVOR: "#flavor Una nigromante utiliza el poder de su sangre para vincular a un fantasma en un objeto o lugar.#!"
 TORMENT_PERK_EFFECT: "Puedes encarcelar, torturar, ejecutar o herir físicamente a los espíritus durante los [single_combat_duel_plural|E]."
 TORMENT_PERK_FLAVOR: "#flavor Con el uso de Tormento, un nigromante puede golpear el cuerpo incorpóreo de un fantasma como si él mismo fuera un fantasma.#!"

 #Bone Path

 SEAL_OF_ABAMIXTRA_PERK_FLAVOR: "#flavor Al invocar el Sello de Abamixtra, un nigromante puede levantar un cadáver o un grupo de cadáveres para realizar una tarea sencilla.#!"
 AWAKEN_THE_HOMONCULAR_SERVANT_PERK_FLAVOR: "#flavor Con este poder, un nigromante puede tomar un pequeño fragmento de un cadáver y transformarlo en una especie de familiar grotesco.#!"
 SHAMBLING_HORDES_PERK_FLAVOR: "#flavor Mediante el uso de este poder, un nigromante puede crear un grupo de esbirros no muertos para atacar a sus enemigos.#!"
 SOUL_STEALING_PERK_EFFECT: "Desbloquea la opción de [execution|E] #italic $EXECUTION_CONVERT_TO_WRAITH$#!."
 SOUL_STEALING_PERK_FLAVOR: "#flavor Con tan solo una palabra y un gesto contundente, un nigromante puede exorcizar el alma de un mortal de su propio cuerpo.#!"
 NECROMANCY_POSSESSION_PERK_EFFECT: "Los objetivos cuyas almas estén marcadas para su retorno o hayan sido ejecutados mediante la opción $EXECUTION_CONVERT_TO_WRAITH$ [executions|E] merodearán sin ir al [UmbraGlossaryLocalized('shadowlands','Inframundo')]."
 NECROMANCY_POSSESSION_PERK_FLAVOR: "#flavor La Posesión demoníaca permite a un nigromante canalizar un alma en un cuerpo recién muerto.#!"

 #Ash Path

 SHROUDSIGHT_PERK_EFFECT: "Desbloquea la interacción de Buscar wraith [character_interaction|E]"
 SHROUDSIGHT_PERK_FLAVOR: "#flavor La Visión del Velo permite a un vampiro mirar directamente al [UmbraGlossaryLocalized('shadowlands','Inframundo')].#!"
 LIFELESS_TONGUES_PERK_EFFECT: "Desbloquea la interacción [command_wraith_interaction|E].\nNúmero máximo de $POD_splat_wraith_plural$ vinculados: #P +1#!."
 LIFELESS_TONGUES_PERK_FLAVOR: "#flavor Al pronunciar la Lengua de los [Glossary('Reinos Oscuros','game_concept_dark_kingdom_desc')], un nigromante puede conversar con fantasmas en el [UmbraGlossaryLocalized('shadowlands','Inframundo')].#!"
 TOUCH_THE_NETHER_PERK_EFFECT: "Te permite interactuar con seres de la [umbra|E] cuando estás en el mundo material."
 TOUCH_THE_NETHER_PERK_FLAVOR: "#flavor Mientras invoca el Toque del Inframundo, un nigromante puede situarse en ambos lados del Velo; se manifiesta físicamente en el [UmbraGlossaryLocalized('shadowlands','Inframundo')] mientras permanece corpóreo en las tierras de los vivos.#!"
 EX_NIHILO_PERK_EFFECT: "Accede al [UmbraGlossaryLocalized('shadowlands','Inframundo')] durante los viajes espirituales."
 EX_NIHILO_PERK_FLAVOR: "#flavor Ex Nihilo permite a un nigromante entrar físicamente en el [UmbraGlossaryLocalized('shadowlands','Inframundo')]. Mientras está en el [UmbraGlossaryLocalized('shadowlands','Inframundo')], aparece como un fantasma particularmente sólido.#!"
 SHROUD_MASTERY_PERK_EFFECT: "Desbloquea la opción Manipular el Velo en el panel de [umbra|E]."
 SHROUD_MASTERY_PERK_FLAVOR: "#flavor Con este poder, el nigromante puede ayudar o dificultar enormemente la capacidad de los fantasmas para funcionar en el mundo de los vivos.#!"

 #Grave's Decay Path

 NECROMANCY_ASHES_TO_ASHES_PERK_EFFECT: "Reduce el riesgo de [masquerade_exposure_with_icon|E] y mejora la [character_interaction|E] de Encubrir Mascarada."
 NECROMANCY_ASHES_TO_ASHES_PERK_FLAVOR: "#flavor Mientras algunos Cainitas masacran sin distinción y no temen las consecuencias de sus actos, otros Cainitas sienten la necesidad de ser un poco más discretos. El uso de este poder convierte un cadáver humano en una pila de cenizas insignificantes que pesan aproximadamente una quinta parte del cuerpo original.#!"
 RIGOR_MORTIS_PERK_FLAVOR: "#flavor Con este poder, el nigromante puede hacer que cualquier objetivo se vuelva tan rígido e inmóvil como un cadáver.#!"
 ASHEN_LADYS_EMBRACE_PERK_EFFECT: "Desbloquea la acción Abrazo de la Dama de Ceniza [single_combat_duel|E]"
 ASHEN_LADYS_EMBRACE_PERK_FLAVOR: "#flavor El Abrazo de la Dama de Ceniza hace que una extremidad del objetivo envejezca, se seque y se marchite como uvas dejadas en la vid.#!"
 GIFT_OF_MELANCHOLIA_PERK_EFFECT: "Desbloquea la capacidad de propagar una epidemia en la ubicación del objetivo como una [character_interaction|E]"
 GIFT_OF_MELANCHOLIA_PERK_FLAVOR: "#flavor Este poder inflige una enfermedad degenerativa virulenta tanto a mortales como a Cainitas.#!"
 NECROMANCY_DUST_TO_DUST_PERK_EFFECT: "Mejora el Abrazo de la Dama de Ceniza por Polvo al Polvo"
 NECROMANCY_DUST_TO_DUST_PERK_FLAVOR: "#flavor Así como Cenizas al Polvo afecta a los cadáveres, Polvo al Polvo afecta a los cuerpos de los vampiros. Invocar Polvo al Polvo permite a un nigromante reducir a otro vampiro a una pila de cenizas, como si hubiera quedado atrapado bajo la luz del sol o hubiera sido quemado en la hoguera.#!"

 #Corpse in the Monster Path

 MORTUUS_IN_VULTUS_PERK_FLAVOR: "#flavor Un Cainita puede hacerse parecer como si fuera un cadáver muerto hace mucho tiempo.#!"
 ALGOR_MORTIS_PERK_FLAVOR: "#flavor Con el uso de Algor Mortis, un vampiro es capaz de transformarse en una criatura fría y melancólica, inmune al dolor mortal o la manipulación emocional.#!"
 INTIMATIONS_OF_MORTALITY_PERK_EFFECT: "Como [character_interaction|E], puedes aumentar la susceptibilidad de un vampiro al estrés y, al mismo tiempo, evitar que utilice el Frenesí de Sangre para aumentar sus atributos."
 INTIMATIONS_OF_MORTALITY_PERK_FLAVOR: "#flavor Los Indicios de la Mortalidad imponen los aspectos más desagradables e irritantes de la mortalidad sobre un vampiro.#!"
 BENEDICTIO_MORTEM_PERK_FLAVOR: "#flavor Con este poder, un nigromante asume plenamente el aspecto de un cadáver y es capaz de desprenderse de las debilidades de su condición vampírica.#!"
 BENEDICTIO_VITAE_PERK_FLAVOR: "#flavor Con Benedictio Vitae, un Cainita es capaz de disfrutar de muchos de los mejores aspectos de la vida mortal sin renunciar al poder de su naturaleza vampírica.#!"

 #Path of Skulls

 CALVARIA_EMISSIUS_PERK_FLAVOR: "#flavor Uno de los secretos más preciados del Clan Capadocio es la capacidad de espiar a través de las cuencas de los ojos de los muertos.#!"
 CONSILIUM_MORTUUS_PERK_EFFECT: "Velocidad de progreso de [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 CONSILIUM_MORTUUS_PERK_BONUS_VALUE: "[GetPerk('consilium_mortuus_perk').GetName(GetPlayer)]"
 CONSILIUM_MORTUUS_PERK_FLAVOR: "#flavor Al conversar con la cabeza decapitada del objetivo fallecido, resulta que arrancar una verdad garantizada de unos labios descompuestos es bastante posible.#!"
 AMMORSUS_VICARIUS_PERK_FLAVOR: "#flavor Usando este poder, el nigromante puede agarrar la mandíbula y el maxilar del cráneo para usarlo como un arma extraña de combate cuerpo a cuerpo, fijar el cráneo a la punta de una lanza para atacar a distancia, o incluso dejar el cráneo solo, actuando como una trampa.#!"
 EXEDO_ANIMUS_PERK_EFFECT: "Velocidad de progreso de [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!"
 EXEDO_ANIMUS_PERK_BONUS_VALUE: "[GetPerk('exedo_animus_perk').GetName(GetPlayer)]"
 EXEDO_ANIMUS_PERK_FLAVOR: "#flavor Al portar un cráneo —ya sea de un mortal o de un Cainita— el nigromante forma un vínculo simpático con el antiguo dueño del cráneo.#!"
 DEGULO_PERK_EFFECT: "Como [character_interaction|E] sobre ti mismo, te permite otorgarte el modificador [GetModifier('degulo_modifier').GetNameWithTooltip]. Mientras este modificador esté activo, los prisioneros ejecutados verán sus cráneos hervidos mediante un evento posterior. Además, permite intercambiar atributos básicos o [Glossary('Disciplinas','game_concept_discipline_desc')] por los de alguien cuyo cráneo hervido hayas adquirido mediante este poder con otra interacción sobre ti mismo."
 DEGULO_PERK_FLAVOR: "#flavor Degulo es el método mediante el cual un nigromante consume un fragmento de alma y lo retiene para siempre como parte de sí mismo.#!"

 #Path of the Twilight Garden

 WHISPERS_OF_THE_SOUL_PERK_FLAVOR: "#flavor El mero hecho de oír un susurro del Nombre Verdadero de la Madre Oscura es suficiente para volver locos a los mortales y llenar los corazones de los Cainitas de terror.#!"
 KISS_OF_THE_DARK_MOTHER_PERK_EFFECT: "La acción Mordisco [single_combat_duel|E] se vuelve más poderosa."
 KISS_OF_THE_DARK_MOTHER_PERK_FLAVOR: "#flavor La Lilin se muerde la lengua y llena su boca con una mezcla fétida y acre de bilis negra y $pod_vitae$. Su mordisco se vuelve aún más terrible, y puede devorar la vida de sus víctimas con facilidad.#!"
 DARK_HUMOURS_PERK_FLAVOR: "#flavor Las Lamias son conocidas por su atletismo y dominio de sus cuerpos. No solo son capaces de realizar hazañas de destreza física increíble, sino que también pueden manipular el equilibrio de los humores en su cuerpo por pura fuerza de voluntad.#!"
 CAUL_OF_THE_NEVERBORN_PERK_EFFECT: "Desbloquea la interacción de Buscar wraith [character_interaction|E]"
 CAUL_OF_THE_NEVERBORN_PERK_FLAVOR: "#flavor Mediante el uso de este poder, la Lamia fortalece su conexión con el corazón negro de la Madre Oscura, otorgándole tanto una mayor resistencia como la capacidad de ver en el [UmbraGlossary('shadowlands')].#!"
 LAMENT_OF_DHAINU_PERK_FLAVOR: "#flavor La Lamia aúlla de agonía, y la tierra misma tiembla. Una niebla de oscuridad retorcida se eleva del suelo y atrapa a sus enemigos. Atrapados por la oscuridad no están físicamente atados, pero son inmediatamente golpeados con una angustia emocional tan rica y cruda que buscan terminar con sus vidas de la manera más expedita posible.#!"

 #Nightshade Path

 TEND_THE_BODY_GARDEN_PERK_EFFECT: "Reduce el riesgo de [masquerade_exposure_with_icon|E] y mejora la [character_interaction|E] de Cubrir la Mascarada"
 TEND_THE_BODY_GARDEN_PERK_FLAVOR: "#flavor Un nigromante con este poder puede acelerar o ralentizar el proceso de descomposición, convirtiendo a un mortal muerto en un cuerpo hinchado de moscas en cuestión de segundos o anulando la descomposición de la Muerte Definitiva.#!"
 WITCHS_FRUIT_PERK_EFFECT: "Desbloquea una [character_interaction|E] que te permite envenenar a los mortales con fruta imbuida de nigromancia."
 WITCHS_FRUIT_PERK_FLAVOR: "#flavor Cada planta depende de la muerte para crecer. Las cosas podridas enriquecen el suelo, y los árboles, vides y hierbas absorben los ecos necróticos junto con los nutrientes vitales. Un nigromante puede despertar este aura de muerte exponiendo sus frutos a su sangre.#!"
 RAISE_THE_GREEN_ONE_PERK_EFFECT: "Desbloquea la habilidad de levantar a un Green One como una [character_interaction|E]."
 RAISE_THE_GREEN_ONE_PERK_FLAVOR: "#flavor Los nigromantes de la Belladona pueden levantar un cadáver atado y fortalecido por materia vegetal. Las hojas cubren su piel y fuertes vides suplementan sus tendones podridos. La cáscara viviente otorga velocidad e instintos de autoconservación no vistos en otros muertos animados.#!"
 WAILS_AND_WHISPERS_PERK_EFFECT: "Desbloquea la habilidad de hacer que un objetivo sea vulnerable a conjuras de asesinato como una [character_interaction|E]"
 WAILS_AND_WHISPERS_PERK_FLAVOR: "#flavor A medida que la comprensión del nigromante se profundiza, explora la barrera ondulante entre la vida y la muerte. Cuando grita como una banshee, puede atraer un alma a su perdición, aumentando la probabilidad de una lesión fatal.#!"
 CTHONIC_WOMB_PERK_EFFECT: "Drenar a un mortal como parte de la alimentación lo levantará como un [GetTrait('wraith').GetName( GetNullCharacter )]"
 CTHONIC_WOMB_PERK_FLAVOR: "#flavor En el ápice de este Camino, un nigromante combina el asesinato y la fertilidad para dar a luz al fantasma de un mortal que ha matado.#!"

 #Vitreous Path

 EYES_OF_THE_WRAITH_PERK_FLAVOR: "#flavor Al invocar este poder, el nigromante puede ver el mundo de la manera en que lo hacen los Muertos Inquietos.#!"
 AURA_OF_DECAY_PERK_FLAVOR: "#flavor Este poder acelera el destino inevitable de cualquier objeto inanimado atrapado dentro de la espantosa aura del nigromante, permitiendo al vampiro causar que cualquier objeto se descomponga en un montón de ruinas.#!"
 SOUL_FEASTING_PERK_EFFECT: "Permite la [character_interaction|E] de Banquete de Almas, que te permite drenar a un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado para saciar tu Ansia."
 SOUL_FEASTING_PERK_FLAVOR: "#flavor El Banquete de Pischacha permite a un vampiro subsistir con las energías ambientales de entropía que impregnan los lugares encantados del mundo, o alimentarse directamente del [Corpus|E] de un fantasma.#!"
 CURSE_OF_THE_MAELSTROM_PERK_EFFECT: "Permite la [character_interaction|E] de Maldición del Maelstrom, que te permite aterrorizar la capital de otro personaje."
 CURSE_OF_THE_MAELSTROM_PERK_FLAVOR: "#flavor El nigromante puede maldecir su entorno convocando Espectros para causar caos y destrucción.#!"
 NIGHTCRY_PERK_FLAVOR: "#flavor Con el uso del Grito Nocturno, un nigromante es capaz de mostrar su maestría sobre las fuerzas de la entropía. Puede dirigirla lejos de sus aliados para ayudarlos, o puede canalizarla directamente hacia sus enemigos para estorbarles.#!"

 #Haunting Path

 SONG_OF_THE_DEAD_PERK_EFFECT: "Desbloquea la habilidad de causar estrés a un enemigo como una [character_interaction|E]"
 SONG_OF_THE_DEAD_PERK_FLAVOR: "#flavor El vampiro canta, tejiendo palabras inaudibles en la canción e infundiendo una fascinación insana por la muerte en su oyente.#!"
 SUMMON_WISP_PERK_FLAVOR: "#flavor El vampiro infunde gotas de su sangre con la energía efímera del [UmbraGlossaryLocalized('shadowlands','Inframundo')], invocando una esfera de luces parpadeantes. El fuego fatuo puede atraer a mortales desprevenidos a una trampa o proporcionar una distracción inteligente.#!"
 HARROWING_PERK_EFFECT: "Mejora el Canto de los Muertos [character_interaction|E]"
 HARROWING_PERK_FLAVOR: "#flavor El Aturdimiento extiende el terror infligido por el Canto de los Muertos al acecharla en su sueño, convirtiendo sus sueños en visiones pesadillescas de su propia muerte.#!"
 PHANTASMS_PERK_FLAVOR: "#flavor El vampiro esculpe la energía del [UmbraGlossaryLocalized('shadowlands','Underworld')] en alucinaciones elaboradas que aterrorizan a los vivos.#!"
 SPECTRAL_MENACING_PERK_EFFECT: "Número máximo de $POD_splat_wraith_plural$ vinculados: #P +3#!."
 SPECTRAL_MENACING_PERK_FLAVOR: "#flavor El vampiro desgarra el velo entre la vida y el [UmbraGlossaryLocalized('shadowlands','Underworld')] alrededor de su víctima, llamando a fantasmas maliciosos para que la acechen.#!"

 #Cenotaph Path

 TOUCH_OF_DEATH_PERK_EFFECT: "TODO"
 TOUCH_OF_DEATH_PERK_FLAVOR: "#flavor El nigromante está sintonizado con la energía residual dejada por el paso o toque de un fantasma, permitiéndole determinar si un objeto, persona o área ha sido tocado o influenciado por un fantasma.#!"
 REVEAL_THE_CATENE_PERK_EFFECT: "TODO"
 REVEAL_THE_CATENE_PERK_FLAVOR: "#flavor El nigromante reconoce la marca cenicienta que los muertos dejan en los objetos, permitiéndole distinguir entre juguetes fantasmales y [Fetters|E].#!"
 TREAD_UPON_THE_GRAVE_PERK_EFFECT: "TODO"
 TREAD_UPON_THE_GRAVE_PERK_FLAVOR: "#flavor El nigromante siente cuando está cerca del mundo de los muertos. Un nigromante podría usar su percepción natural, mientras que otro podría realizar una adivinación, pero ambos pueden sentir dónde el [UmbraGlossaryLocalized('shadowlands','Inframundo')] toca el mundo de los vivos.#!"
 DEATH_KNELL_PERK_EFFECT: "TODO"
 DEATH_KNELL_PERK_FLAVOR: "#flavor El nigromante siente cuando está cerca del mundo de los muertos. Un nigromante podría usar su percepción natural, mientras que otro podría realizar una adivinación, pero ambos pueden sentir dónde el [UmbraGlossaryLocalized('shadowlands','Inframundo')] toca el mundo de los vivos.#!"
 EPHEMERAL_BINDING_PERK_EFFECT: "TODO"
 EPHEMERAL_BINDING_PERK_FLAVOR: "#flavor Al infundir un objeto, persona o lugar con su propia energía cenicienta, el nigromante puede crear un [Fetters|E] artificial en lugar de tener que confiar en encontrar uno por casualidad.#!"

 # Potence # 
 
 BRUTAL_FEED_PERK_EFFECT: "Desbloquea un movimiento de [single_combat_duel|E].\n#flavor En apenas unos segundos, tragas torrentes de sangre mientras despedazas a tu víctima. El resultado es eficiente pero desordenado. Ahora puedes usar tu nuevo método de alimentación en pleno combate y puedes disfrazar los restos destrozados de la víctima.#!"
 DRAUGHT_OF_MIGHT_PERK_EFFECT: "Como opción de [Glossary('Draught','game_concept_blood_draught_desc')] [character_interaction|E], puedes dotar a alguien de tu fuerza sobrenatural.\n#flavor Tu sangre se satura con el poder de la Potencia, transmitiendo parte de tu poder a cualquiera que beba de ella.#!"
 EARTHSHOCK_PERK_EFFECT: "#flavor Tu fuerza se convierte en una fuerza elemental. Puedes golpear el suelo con el puño o el pie, creando una onda de choque que derriba a los oponentes y destroza edificios.#!"
 FISTS_OF_CAINE_PERK_EFFECT: "Ganas una mayor probabilidad de herir gravemente a los [knights|E] enemigos en [combat_phase|E] como un [knight|E].\n#flavor Tus manos desnudas pueden infligir heridas gravísimas, letales tanto para mortales como para otros vampiros. Pueden desmembrar, perforar, empalar, decapitar e incluso arrancar un corazón del pecho.#!"
 LETHAL_BODY_PERK_EFFECT: "Ganas una mayor probabilidad de herir a los [knights|E] enemigos durante un [combat_phase|E] como un [knight|E].\n#flavor Al usar este poder, eres capaz de causar un daño horrendo, desgarrando la piel y rompiendo huesos con las manos desnudas.#!"
 PROWESS_PERK_EFFECT: "#flavor Los vampiros con Potencia obtienen una fuerza mucho mayor de su Sangre que aquellos que carecen de ella.#!"
 SOARING_LEAP_PERK_EFFECT: "#flavor Poseyendo una fuerza impía que va más allá de los brazos y los puños, puedes saltar mucho más alto y más lejos que cualquier mortal.#!"
 UNCANNY_GRIP_PERK_EFFECT: "$countermeasures_unlocks_t3_redouble_guards$ \n #flavor Al concentrar tu fuerza sobrenatural en los dedos de los pies y las manos, tu agarre te permite hundir tus extremidades en casi cualquier superficie, permitiéndote escalar e incluso colgarte de paredes y techos sin apoyo alguno.#!"
 RELENTLESS_PURSUIT_PERK_EFFECT: "#F El Vástago realiza saltos extraordinarios por el aire.#!"
 CRUSH_PERK_EFFECT: "Otorga [GetModifier('crush_perk_knight_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como un [commander|E] durante la [combat_phase|E], o a tu enemigo durante un [single_combat_duel_plural|E].\nInflige [GetModifier('crush_perk_ruler_modifier').GetNameWithTooltip] a cada gobernante del bando contrario al unirse a una [war|E].\n#F El Vástago que realiza un ataque exitoso contra un objeto lo destruye automáticamente.#!"
 FIST_OF_THE_TITANS_PERK_EFFECT: "Como una [character_interaction|E], te permite herir a todos los caballeros del objetivo.\n#F El Vástago ataca o lanza a alguien telequinéticamente.#!"
 THE_FORGERS_HAMMER_PERK_EFFECT: "$unlock_enhancing_node$ [GetModifier('artifact_prowess_1_modifier').GetNameWithTooltip]\n#F El Vástago crea armas que infligen daño adicional.#!"
 LEND_THE_SUPERNATURAL_VIGOR_PERK_EFFECT: "Como una [character_interaction|E], te permite otorgar tu destreza al objetivo.\n#F El Vástago concede su increíble fuerza a otro.#!"
 MIGHT_OF_THE_HEROES_PERK_EFFECT: "#F El Vástago realiza hazañas físicas de proporciones míticas.#!"

 # Presence # 

 AWE_PERK_EFFECT: "Desbloquea el [GetScheme('befriend').GetTypeName] [scheme|E].\n#F Cualquiera en presencia del vampiro siente que su atención es atraída por él de forma inexplicable. Aquellos que escuchen hablar al vampiro podrían, de repente, estar de acuerdo en temas en los que antes mantenían opiniones distintas.#!"
 DAUNT_PERK_EFFECT: "#F En lugar de atraer a la gente, el vampiro usa la Presencia para repeler. Con este poder, el usuario parece amenazante y emana un aura de hostilidad lo suficientemente poderosa como para que la mayoría de los mortales eviten su atención e incluso los vampiros se lo piensen dos veces antes de actuar contra él.#!"
 DREAD_GAZE_PERK_EFFECT: "#F Al exponer brevemente su naturaleza vampírica, el usuario infunde un terror absoluto en un solo sujeto.#!"
 ENTRANCEMENT_PERK_EFFECT: "Permite el [scheme|E] de [GetScheme('PODentrance').GetTypeName].\n#F El vampiro concentra su encanto sobrenatural en una sola persona, infundiéndole una fascinación o embelesamiento similar a enamorarse perdidamente o conocer al ídolo de toda una vida.#!"
 LINGERING_KISS_PERK_EFFECT: "Cuando cazas, puedes optar por añadir a tus víctimas a tu [POD_herd|E].\n#F El Beso de un vampiro induce un estado cercano al éxtasis en los mortales, pero este poder deja a otros Besos en la sombra. Los mortales alimentados por el usuario se vuelven adictos al Beso, obsesionándose con él e incluso buscando al vampiro para alimentarse repetidamente.#!"
 MAJESTY_PERK_EFFECT: "$countermeasures_unlocks_t4_strengthen_sentries$ \n Desbloqueas una mejor opción para la [character_interaction|E] de cubrir la Mascarada.\n#F En la cúspide de esta $pod_discipline$, el vampiro puede amplificar su semblante hasta niveles sobrenaturales. Experimentar la Majestad es estar en presencia de lo divino, o de lo infernal.#!"
 SUMMON_PERK_EFFECT: "Permite el [scheme|E] de [GetScheme('PODsummon').GetTypeName].\n#F El vampiro puede llamar a sí mismo a cualquier persona, mortal o vampiro, sobre quien haya usado previamente el Asombro, el Embelesamiento o la Majestad, o que haya probado su Sangre al menos una vez.#!"
 IRONCLAD_COMMAND_PERK_EFFECT: "Mejora la probabilidad de éxito de las facultades de Presencia anteriores."
 COOPERATION_PERK_EFFECT: "$countermeasures_unlocks_t4_bounties_for_whispers$ \n Aceptación de [peace|E]: #P +[EmptyScope.ScriptValue('cooperation_value')|0]#!"
 PHOBIA_PERK_EFFECT: "Ganas [GetModifier('phobia_5_modifier').GetNameWithTooltip] cuando actúas como [commander|E] durante la [combat_phase|E].\nLa fuerza de este modificador se basa en tu [dread|E] actual."
 MASK_OF_EMPATHY_PERK_EFFECT: "Como una [character_interaction|E], termina las relaciones de tu objetivo.\n#F Corta los vínculos emocionales entre las personas.#!"
 BLOODLUST_PERK_EFFECT: "Mejora el modificador de [GetPerk('phobia_perk').GetName(GetPlayer)] a [GetModifier('bloodlust_5_modifier').GetNameWithTooltip]."
 PERFECT_WORLD_PERK_EFFECT: "Como una [character_interaction|E], mejora tu capital con [GetModifier('perfect_world_development_modifier').GetNameWithTooltip] o [GetModifier('perfect_world_war_modifier').GetNameWithTooltip].\n#F Tu maestría emocional ha crecido hasta envolver una ciudad entera, obligando a todos sus ciudadanos a trabajar para convertirla en tu ciudad ideal.#!"

 # Kai # 

 INNER_FOCUS_PERK_EFFECT: "Si profesas una fe de autocontrol, puedes usar el poder de tu sangre para evitar el Frenesí.\n#F Tu deseo abrumador de mantener tu honor es parte de tu sangre.\nPuedes utilizar el poder de tu sangre para evitar el Frenesí que podría haber causado deshonor.#!"
 FOCUSED_STRIKE_PERK_EFFECT: "#F Al estilo de los golpes de precisión de un artista marcial, puedes concentrar tu poder interior en un único y poderoso golpe, lanzándolo con la fuerza suficiente como para enviar a los enemigos por los aires.#!"
 HONORABLE_ELIXIR_PERK_EFFECT: "#F Tu sangre se convierte en una sustancia espiritual que hace que quienes la beban actúen con honor o sufran las consecuencias.#!"
 SHIELD_FROM_FIRE_PERK_EFFECT: "Otorga protección contra el fuego.\n#F Puedes concentrar tu fuerza interior en un escudo que te proteja de aquellos que busquen dañarte e incluso protegerte del fuego.#!"
 DAIMYOS_LAW_PERK_EFFECT: "Desbloquea el [scheme|E] de [GetScheme('abduct').GetTypeName] y te permite comprar derechos sobre artefactos con un 15 % de descuento.\n#F Puedes forzar a alguien a sentirse obligado a realizar una tarea por ti.#!"
 KAI_ELDER_1_PERK_EFFECT: "La variante de [prowess|E] de Oleada de Sangre otorga 5 puntos de Destreza adicionales.\n#F Al concentrar tu sangre en el combate, esta infunde un estado de trance vertiginoso en el que luchas con la furia y el honor que corresponden a un verdadero daimyo.#!"
 KAI_ELDER_2_PERK_EFFECT: "Otorga una decisión para desbloquear un nuevo regimiento de [men_at_arms|E] entre estas opciones:\n$BULLET_WITH_TAB$[GetMaA('POD_ronin_hatamoto').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_ronin').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_yumihiki').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_yumihiki_riders').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_sojutsuka').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_sojutsuka_riders').GetName]\n#F La mera presencia de tu sangre provoca efectos similares a la ley del daimyo; sin embargo, este poder, cuando se enfoca en un estilo de combate específico del que surgen las raíces de la disciplina, tiene un efecto inusual y sustancial en los mortales, haciendo que adopten estilos de combate nativos de las tierras donde se originó, además de otorgarles notablemente capacidades sobrenaturales y hacer que te honren en combate.#!"
 KAI_ELDER_3_PERK_EFFECT: "Otorga fuertes defensas mentales.\n#F Con poder de voluntad puedes luchar ferozmente hasta el amargo final y, con tu mente concentrada, puedes rechazar fácilmente los intentos de engaño mental.#!"
 KAI_ELDER_4_PERK_EFFECT: "Hiérete a ti mismo y sacrifica a un miembro del clan encarcelado o a uno de tus Ghouls para intentar matar a tu objetivo. Si el objetivo tiene habilidades defensivas, esto causará heridas en su lugar.\n#F Al arrancar de ti mismo un fragmento de tu poder, junto con el sacrificio de la fuerza vital de alguien que comparta tu sangre, puedes asestar un golpe devastador. Este golpe buscará y destruirá a tu objetivo desde cientos de kilómetros de distancia.#!"
 KAI_ELDER_5_PERK_EFFECT: "Desbloquea una interacción de personaje para sabotear a los comandantes de tu objetivo.\n#F Desata un torrente de sangre vasto y aparentemente infinito para acechar y bombardear viciosamente a quienes elijas para usar este poder; los afectados tendrán grandes dificultades para mover y reabastecer sus ejércitos.#!"
 KAI_ELDER_6_PERK_EFFECT: "Mejora la interacción de personaje Tormenta Carmesí.\n#F Tus torrentes de sangre ahora pueden unirse en ataques verdaderamente impactantes, imitando tanto la apariencia aterradora como el efecto devastador de los tsunamis.#!"

 # Rift #

 THE_JOINING_PERK_EFFECT: "#F Ahora puedes comunicarte con otros telepáticamente.#!"
 GLIMPSE_OF_THE_PAIN_PERK_EFFECT: "Como una [character_interaction|E], reduce la [advantage|E] y la [prowess|E] de tu objetivo durante un corto periodo.\n#F Por un mero instante, puedes arrastrar a otros a tu reino de agonía.#!"
 CROSSING_THE_IRON_BRIDGE_PERK_EFFECT: "Desbloquea un evento único de nivel 3 de [mental_break|E] (con un tiempo de reutilización de 6 años).\n#F Ahora puedes confrontar a tus demonios internos entrando en tu grieta. Solo se pueden llevar contigo objetos personales.\nEsta no es una experiencia agradable, pero puede ofrecer un momento de respiro frente a las constantes intrigas y traiciones que conlleva la vida vampírica.#!"
 JOURNEYING_THE_IRON_BRIDGE_PERK_EFFECT: "#F Los objetos ya no necesitan un vínculo personal para entrar en tu grieta.#!"
 PASSING_THE_INNER_REALM_PERK_EFFECT: "Como una [character_interaction|E], gana o pierde [GetModifier('passing_the_inner_realm_modifier').GetNameWithTooltip].\n#F Puedes desaparecer por completo entrando en tu grieta y trasladarte a una nueva ubicación que puedas ver. Sin embargo, aunque esto ignore los obstáculos, no es instantáneo, ya que requiere que recorras la misma distancia en tu grieta que viajando allí sin ella.\nUsar la Grieta en combate es muy efectivo, permitiéndote esquivar golpes que serían inevitables para la mayoría, aunque usarla eficazmente en combate requiere un uso frecuente que resulta bastante estresante para la mente.#!"
 RIFT_COLLECTION_PERK_EFFECT: "Permite comprar derechos sobre artefactos con un #V 15 %#! de descuento.\n#F Ahora puedes enviar objetos inanimados a tu grieta con un solo toque, o reclamarlos a voluntad.#!"
 RIFT_TRANSPORT_PERK_EFFECT: "#F Puedes tocar un objeto para trasladarlo a un lugar a la vista (la distancia varía según las capacidades de la Grieta del usuario).#!"
 EYES_OF_A_THIEF_PERK_EFFECT: "80 % más rápido el [planning_speed|E] para el Atraco de Artefactos en [infiltration_missions|E].\n#F Similar a la recolección y al transporte, sin embargo, ya no necesitas tocar los objetos para enviarlos a una grieta; solo necesitas verlos.#!"
 DOORWAY_TO_HELL_PERK_EFFECT: "Como una [character_interaction|E], teletranspórtate de vuelta a tu capital cuando estés viajando o liderando un ejército.\n#F Esto es diferente a otros usos de la Grieta, ya que permite establecer una ubicación de grieta permanente a la que puedes vincular temporalmente tu grieta, y en la cual cualquiera puede entrar.\nEs similar a un eco de tu grieta pesadillesca que permite un viaje casi instantáneo, permitiendo que otros te sigan. No puedes mantenerla indefinidamente, no puedes viajar a través de la puerta para volver a donde estabas anteriormente y solo puede haber una puerta activa a la vez.\nCualquiera que no seas tú sufrirá efectos idénticos a [GetPerk('glimpse_of_the_pain_perk').GetName(GetPlayer)].#!"
 TOUCH_OF_SIN_PERK_EFFECT: "Desbloquea el [scheme|E] de [GetScheme('abduct').GetTypeName].\n#F Ahora puedes forzar a los individuos a entrar en tu grieta habitual agarrándolos.#!"
 RIFT_GATEWAY_PERK_EFFECT: "Mejora el modificador de [GetPerk('passing_the_inner_realm_perk').GetName(GetPlayer)] a [GetModifier('rift_gateway_modifier').GetNameWithTooltip].\n#F El Portal te permite enviar a un individuo a través de tu grieta al tocarlo de una manera similar a [GetPerk('passing_the_inner_realm_perk').GetName(GetPlayer)].\nTen cuidado con los usuarios de la Grieta que contemplen el cielo nocturno, miren fijamente un fuego rugiente o algún otro peligro, ya que podrías encontrarte cayendo del cielo nocturno o quemado hasta quedar carbonizado momentos después.#!"
 RIFT_IMPRISON_PERK_EFFECT: "Tus prisioneros prácticamente no tienen posibilidad de escapar. También desbloquea una nueva opción cuando un personaje intenta resistirse a ser encarcelado.\n#F Ahora puedes mantener a la gente en tu grieta indefinidamente, de la cual es virtualmente imposible escapar, ya sea por medios mundanos o sobrenaturales.\nSolo los más afortunados tienen alguna posibilidad de escape si logran encontrar un portal que funcione.#!"


 # Protean #
 
 EARTH_MELD_PERK_EFFECT: "#F Al fundirse con el suelo, el vampiro se hunde en la tierra. A menos que esté en $pod_torpor$, el vampiro se levantará de nuevo la noche siguiente.#!"
 EYES_OF_THE_BEAST_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\nComo opción de [shapeshift|E], ahora puedes activar [GetModifier('POD_shapeshift_form_beasteyes_modifier').GetNameWithTooltip].\n#F El vampiro puede imbuir un brillo sobrenatural rojo en sus ojos, otorgándole visión incluso en la ausencia total de luz.#!"
 FERAL_WEAPONS_PERK_EFFECT: "Como opción de [shapeshift|E], puedes hacer que tus garras crezcan hasta convertirse en [GetModifier('POD_shapeshift_form_feralweapons_modifier').GetNameWithTooltip].\n#F El vampiro puede extender sus armas naturales a proporciones monstruosas.#!"
 METAMORPHOSIS_PERK_EFFECT: "Como opción de [shapeshift|E], ahora puedes realizar un cambio de forma hacia formas bestiales más pequeñas.\n#F Tu capacidad para asumir la forma de un animal ha crecido.#!"
 MIST_FORM_PERK_EFFECT: "Como opción de [shapeshift|E], ahora puedes transformarte en un elusivo [GetModifier('POD_shapeshift_form_mist_modifier').GetNameWithTooltip].\n#F El vampiro gana el legendario poder de convertirse en una nube de niebla, perceptible a la vista pero intocable por nada que no sea el fuego, la luz solar y la agresión sobrenatural.#!"
 SHAPECHANGE_PERK_EFFECT: "Como opción de [shapeshift|E], ahora puedes realizar un cambio de forma hacia una forma bestial.\n#F El vampiro puede asumir la forma de un animal, generalmente uno asociado a su $pod_clan$ o al tipo de presa que caza con más frecuencia.#!"
 THE_UNFETTERED_HEART_PERK_EFFECT: "#F Tras dominar el poder de Protean, el interior mismo del usuario se vuelve maleable, casi viscoso. El corazón, sede de la $pod_vitae$ y de la no-vida del vampiro, se desprende y se mueve libremente, aunque con lentitud, dentro del pecho.#!"
 WEIGHT_OF_THE_FEATHER_PERK_EFFECT: "#F El vampiro puede reducir su masa y densidad efectivas, volviéndose casi ingrávido.#!"
 ADAPTABILITY_PERK_EFFECT: "#F Sintonizarse para sobrevivir en entornos extremos.#!"
 HOMUNCULUS_PERK_EFFECT: "Como [character_interaction|E], permite crearte un clon [GetTrait('mortal').GetName( GetPlayer )].\n#F Crea una versión miniatura de ti mismo para que actúe como sirviente.#!"
 TURNABOUT_PERK_EFFECT: "#F Cambiar de posición rápidamente moviéndose a través de la tierra.#!"
 MYTHIC_FORM_PERK_EFFECT: "Permite el cambio de forma hacia varias formas de épocas pasadas.\n#F Transfórmate en una criatura mítica específica.#!"
 ADAPTATION_PERK_EFFECT: "#F Tu cuerpo se adapta instintivamente para proporcionar la máxima protección.#!"
 DRAUGHT_OF_PHOENIX_BLOOD_PERK_EFFECT: "Permite la resurrección si mueres por causas antinaturales.\n#F Tras un número de días igual a la generación del vampiro después de su Muerte Definitiva, este reencarnará en un nuevo cuerpo, una generación superior, conservando este poder pero con una imagen incompleta de quién era.#!"
 
 # Obtenebration #
 
 EYES_OF_THE_ABYSS_PERK_EFFECT: "Como opción de [shapeshift|E], obtén [GetModifier('POD_shapeshift_form_abysseyes_modifier').GetNameWithTooltip].\n#F Los ojos del vampiro se vuelven negros. Ignoran todas las penalizaciones por oscuridad, incluso aquellas causadas por la oscuridad sobrenatural, y pueden ver fantasmas.#!"
 SHADOW_PLAY_PERK_EFFECT: "#F Aunque esta habilidad no permite a los personajes crear sombras que no existan ya, les permite manipular, mover y animar las sombras ambientales. Esto puede otorgar efectos sociales, como usar las sombras para resultar más imponente, o dar forma a un entorno según tus necesidades, creando áreas de sombra en las que esconder a una persona u objeto.#!"
 NOCTURNE_PERK_EFFECT: "Como [character_interaction|E], activa o desactiva [GetModifier('nocturne_power_modifier').GetNameWithTooltip].\nMientras esté activa, inflige [GetModifier('nocturne_drained_stamina_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E].\nEsto cuesta #N 10#![piety_i] por cada enemigo afectado.\n#F Al concentrarse en convocar la oscuridad, los Lasombra con esta habilidad pueden invocar una nube retorcida de oscuridad sobrenatural para envolver un área y oscurecer todas las fuentes de luz. La oscuridad es una manifestación del Abismo que amortigua el sonido y la vista, y sofoca la vida de los débiles.#!"
 NIGHT_SHADES_PERK_EFFECT: "Puede reclutar [GetMaA('shades').GetName] como [men_at_arms|E]"
 ARMS_OF_AHRIMAN_PERK_EFFECT: "#F Con esta habilidad, un Lasombra da forma a la oscuridad convirtiéndola en tentáculos que pueden atacar, retener y luchar cuerpo a cuerpo con sus enemigos.#!"
 TENEBROUS_AVATAR_PERK_EFFECT: "Como opción de [shapeshift|E], transfórmate en [GetModifier('POD_shapeshift_form_shadow_modifier').GetNameWithTooltip].\n#F El dominio de la oscuridad del vampiro es tan extenso que puede llegar a convertirse físicamente en ella. Al activar este poder, el vampiro se convierte en una mancha de sombra viscosa y ameboide.#!"
 THE_DARKNESS_WITHIN_PERK_EFFECT: "Mejora el modificador de [GetPerk('nocturne_perk').GetName(GetPlayer)] a [GetModifier('darkness_within_drained_stamina_modifier').GetNameWithTooltip].\nAdemás, también drenas #V 1#! $POD_energy_blood$ de los objetivos afectados.\nEsto cuesta #N 15#![piety_i] por cada enemigo afectado."
 OUBLIETTE_PERK_EFFECT: "Desbloquea el esquema de [GetScheme('abduct').GetTypeName] [scheme|E]"
 WALK_THE_ABYSS_PERK_EFFECT: "#F Al atravesar el Abismo, esta habilidad permite a un personaje entrar en una mancha de oscuridad y emerger de una segunda mancha de oscuridad dentro de su campo de visión. Los personajes también pueden usar esta habilidad para extender su alcance hacia una sombra y agarrar algo que esté al alcance de una segunda sombra.#!"
 DRAIN_THE_LIFE_PERK_EFFECT: "Como [character_interaction|E], inflige en la capital de tu objetivo el efecto [GetModifier('drain_the_life_power_modifier').GetNameWithTooltip].\n#F Con un movimiento de su muñeca, el vampiro abre el mundo al Abismo, creando un terrible vacío esférico en el aire. Cuando se cierra, amigos y enemigos resultan heridos y quizá destruidos. Aquellos que han muerto (o casi mueren) son arrastrados hacia la nada. Todos los rastros de ellos simplemente desaparecen.#!"
 DARK_WHISPERS_PERK_EFFECT: "#F Con esta habilidad, un personaje puede usar las sombras cercanas para proyectar sus sentimientos en ellas.#!"
 GOD_IN_DARKNESS_PERK_EFFECT: "Mejora el modificador de [GetPerk('tenebrous_avatar_perk').GetName(GetPlayer)] a [GetModifier('POD_shapeshift_form_shadow_god_in_darkness_modifier').GetNameWithTooltip]."
 DARKSIGHT_PERK_EFFECT: "Mejora el modificador de [GetPerk('eyes_of_the_abyss_perk').GetName(GetPlayer)] إلى [GetModifier('POD_shapeshift_form_darksight_modifier').GetNameWithTooltip]."
 SHADOWSTEP_PERK_EFFECT: "#F El vampiro desaparece en las sombras, deslizándose a través del [UmbraGlossary('pod_realm_labyrinth')] para reaparecer tras viajar a través de algo más impuro que la muerte y el doble de hambriento. Se adentra en una sombra lo suficientemente grande como para cubrirle y reaparece en otra que pueda ver.#!"
 SHADOW_TWIN_PERK_EFFECT: "Como [character_interaction|E], permite crearte un clon sombrío de ti mismo.\n#F El control del vampiro sobre la oscuridad ha progresado hasta tal punto que puede otorgarle un grado limitado de conciencia. Al animar su propia sombra, el $pod_cainite$ puede realmente «liberar» la sombra proyectada por la luz. Mientras este poder esté activo, el sujeto no proyecta sombra, ya que esta se ha marchado para cumplir las órdenes del vampiro.#!"
 AEGIS_OF_SHADOWS_PERK_EFFECT: "#F Cúbrete con una poderosa armadura de sombras.#!"
 DEVOUR_ALL_HOPE_PERK_EFFECT: "Mejora el modificador de [GetPerk('nocturne_perk').GetName(GetPlayer)] a [GetModifier('devour_all_hope_drained_stamina_modifier').GetNameWithTooltip].\nAdemás, ahora drenas #V 2#! $POD_energy_blood$ de los objetivos afectados.\nEsto cuesta #N 25#![piety_i] por cada enemigo afectado."
 AHRIMANS_DEMESNE_PERK_EFFECT: "Mejora [GetPerk('drain_the_life_perk').GetName(GetPlayer)] permitiéndole tener como objetivo un reino entero."
 
 # Serpentis #
 
 ENCHANTING_GAZE_PERK_EFFECT: "#flavor Este poder convierte al vampiro en la proverbial llama para una polilla. Adquiere un rasgo seductor y encantador, como los ojos dorados de una serpiente o un brillo perlado en su piel. Puede paralizar con una mirada, y los mortales en su proximidad se sienten atraídos hacia ella.#!"
 SERPENTS_FLESH_PERK_EFFECT: "Como opción de [shapeshift|E], obtén [GetModifier('POD_shapeshift_form_serpents_flesh_modifier').GetNameWithTooltip].\n#flavor Con este poder, la carne del vampiro se vuelve correosa, escamosa, viscosa y, de otro modo, monstruosa. Su cuerpo se vuelve flexible y maleable, y le resulta más difícil de herir.#!"
 TYPHONIC_MAW_PERK_EFFECT: "Desbloquea un movimiento de [single_combat_duel|E].\n#flavor La mandíbula del vampiro se convierte en algo feroz y maleable que puede controlar de diversas maneras. Su mandíbula se distiende hasta el pecho, sus colmillos crecen hasta alcanzar el tamaño de pequeñas dagas, su lengua se bifurca en la punta y azota con un metro de largo, y su garganta se expande para consumir cualquier cosa que pueda atrapar con la boca.#!"
 MASTER_OF_SNAKES_PERK_EFFECT: "Puede reclutar a [GetMaA('snakes').GetName] como [men_at_arms|E]."
 SMOOTH_SCALES_PERK_EFFECT: "Mejora el modificador de [GetPerk('serpents_flesh_perk').GetName(GetPlayer)] a [GetModifier('POD_shapeshift_form_smooth_scales_modifier').GetNameWithTooltip]."
 FORM_OF_THE_SNAKE_PERK_EFFECT: "Como opción de [shapeshift|E], transfórmate en [GetModifier('POD_shapeshift_form_snake_modifier').GetNameWithTooltip] o en [GetModifier('POD_shapeshift_form_giantserpent_modifier').GetNameWithTooltip]."
 TYPHONIC_AVATAR_PERK_EFFECT: "Como opción de [shapeshift|E], transfórmate en el [GetModifier('POD_shapeshift_form_typhonic_avatar_modifier').GetNameWithTooltip].\n#flavor El vampiro puede transformarse en una Bestia Tifónica, una criatura de leyenda. Se presenta como un chacal alto con una cola dura, bifurcada y con púas, con orejas puntiagudas y severas y un hocico largo. Alternativamente, puede tomar una forma híbrida de humano/serpiente con una larga cola prensil que sirve de piernas. Esta forma se utiliza como una especie de «forma de guerra» además de su función religiosa.#!"
 SERPENT_EYES_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$\nComo opción de [shapeshift|E], obtén [GetModifier('POD_shapeshift_form_serpenteyes_modifier').GetNameWithTooltip].\n#flavor Otorga al vampiro la legendaria mirada hipnótica de la serpiente. Los ojos del vampiro se vuelven dorados con grandes iris negros, y los mortales en las inmediaciones del personaje se sienten extrañamente atraídos hacia él. Un mortal que encuentra la mirada seductora del vampiro queda inmovilizado. Hasta que el personaje desvíe la mirada de su víctima, la persona permanecerá congelada en su sitio.#!"
 MOTHER_OF_MONSTERS_PERK_EFFECT: "Puede reclutar a [GetMaA('serpentis_monsters').GetName] como [men_at_arms|E]."
 FORM_OF_THE_STORM_PERK_EFFECT: "Mejora el modificador de [GetPerk('typhonic_avatar_perk').GetName(GetPlayer)] a [GetModifier('POD_shapeshift_form_form_of_the_storm_modifier').GetNameWithTooltip]."
 ECHIDNAS_VENOM_PERK_EFFECT: "#flavor A este nivel, la mordida del vampiro se vuelve venenosa como la de una víbora de muerte#!"
 THE_HEART_OF_DARKNESS_PERK_EFFECT: "Como una [character_interaction|E], extráete el propio corazón y gana [GetModifier('heart_of_darkness_modifier').GetNameWithTooltip].\n#flavor El Vampiro realiza un ritual en el que se extrae su propio corazón, volviéndose menos emocional y siendo inmune a la $pod_diablerie$ y a las estacas.#!"
 COBRA_FANGS_PERK_EFFECT: "#flavor Los colmillos del vampiro se vuelven venenosos.#!"
 APOPHIS_PERK_EFFECT: "Mejora el modificador de [GetPerk('typhonic_avatar_perk').GetName(GetPlayer)] a [GetModifier('POD_shapeshift_form_apophis_modifier').GetNameWithTooltip]."
 HEART_THIEF_PERK_EFFECT: "Ahora puedes robar corazones de otros personajes mediante un conjura o de prisioneros como una simple [character_interaction|E]. Si tienes el corazón de alguien, es fácil matarlo o forzarlo al Letargo."
 TEMPTATION_PERK_EFFECT: "#flavor El vampiro se vuelve extremadamente difícil de resistir.#!"
 BREATH_OF_THE_BASILISK_PERK_EFFECT: "#flavor El vampiro puede exhalar una niebla corrosiva y venenosa.#!"
 GODHEAD_PERK_EFFECT: "Como opción de [shapeshift|E], transfórmate en [GetModifier('POD_shapeshift_form_godhead_modifier').GetNameWithTooltip].\n#flavor Esta temible habilidad otorga al vampiro el manto de un dios. Mientras que la mayoría de los Setitas manifiestan este poder adoptando la cabeza de una bestia similar a los dioses egipcios, cada vampiro manifiesta la Divinidad de forma distinta. Algunos crecen un metro de altura. Otros adoptan una piel dorada y reluciente. Independientemente de la manifestación, siempre es obvia y siempre inspira asombro.#!"

 # Visceratika #
 
 SKINOFCHAMELEON_PERK_EFFECT: "$countermeasures_unlocks_t1_obfuscated_court$ \n Como opción de [shapeshift|E], transmuta tu piel para mimetizarte con el entorno, ofreciendo bonificaciones al conjura y a la resistencia al conjura."
 SCRYTHEHEARTHSTONE_PERK_EFFECT: "#flavor Conoce la ubicación de los individuos dentro de una estructura. #!"
 BONDWITHTHEMOUNTAIN_PERK_EFFECT: "#flavor Fusiónate parcialmente con la piedra. #!"
 ARMOROFTERRA_PERK_EFFECT: "#flavor Endurece tu piel para absorber el daño mucho más fácilmente. #!"
 FLOWWITHTHEMOUNTAIN_PERK_EFFECT: "Aumenta la probabilidad de éxito del [decision|E] Escapar de la prisión.\n#flavor Atraviesa la piedra. #!"
 DARKSTATUE_PERK_EFFECT: "Inmunidad a los métodos de asesinato por fuego y luz solar.\n#flavor No te ves afectado físicamente por la luz solar mientras no te muevas.#!"
 ROCKHEART_PERK_EFFECT: "Ahora eres inmune a las estacas.\n#flavor Tus entrañas se calcifican, reduciendo el daño por perforación y haciendo que las estacas sean casi imposibles.#!"
 CRAWLINGCHAMBER_PERK_EFFECT: "#flavor Puedes animar, dotar de una conciencia limitada y comandar (hasta cierto punto) un volumen de 10 pies cúbicos de piedra.#!"
  
 # Temporis #
 
 TIME_SENSE_PERK_EFFECT: "#F Tener un reloj interno perfecto#!"
 INTERNAL_RECURSION_PERK_EFFECT: "Otorga [GetModifier('internal_recursion_perk_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E].\n#F Provoca que un objetivo repita una serie de acciones una y otra vez#!"
 RAMBLE_ON_PERK_EFFECT: "Otorga [GetModifier('ramble_on_perk_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E].\n#F Provoca que un objetivo repita sin saberlo una acción simple#!"
 LAPSE_PERK_EFFECT: "Otorga a los [commanders|E] enemigos [GetModifier('lapse_perk_modifier').GetNameWithTooltip] [modifier|E] cuando actúes como [commander|E] durante la [combat_phase|E].\n#F Provoca que un objetivo se mueva más lento en el tiempo#!"
 COWALKER_PERK_EFFECT: "#F Detén el tiempo por un momento para aparecer en dos lugares a la vez#!"
 SUBJECTIVE_SUSPENSION_PERK_EFFECT: "Otorga a los [commanders|E] enemigos [GetModifier('subjective_suspension_perk_modifier').GetNameWithTooltip] [modifier|E] cuando actúes como [commander|E] durante la [combat_phase|E].\n#F Suspende temporalmente un objeto fuera del tiempo#!"
 CLOTHOS_GIFT_PERK_EFFECT: "#F Acelera tu marco temporal para poder realizar varias acciones por ronda#!"
 FROZEN_OBJECT_PERK_EFFECT: "#F Detén el tiempo para un objeto inanimado#!"
 TEMPORIS_INSIGHT_PERK_EFFECT: "#F Avanza en el tiempo para ver cómo resultarán tus próximas acciones#!"
 KISS_OF_LACHESIS_PERK_EFFECT: "Mediante una [character_interaction|E], puedes cambiar la edad física de un objetivo.\n#F Cambia la edad legal de un objetivo#!"
 HALL_OF_HADES_COURT_PERK_EFFECT: "#F Altera el flujo del tiempo en un área, haciendo que las horas pasen como minutos o los minutos como horas#!"
 CLIOS_KISS_PERK_EFFECT: "Mediante una [character_interaction|E], puedes hacer que el [title|E] seleccionado regrese a su poseedor anterior.\n#F Trae algo o a alguien del pasado al presente#!"
 TEMPORAL_UNDERSTANDING_PERK_EFFECT: "#F Avanza en el tiempo para ver las consecuencias a largo plazo de tus acciones#!"
 SUMMON_HISTORY_PERK_EFFECT: "Gana acceso a un eco aleatorio de un artefacto histórico cada #V 3#! año.\n#F Trae un momento particular al presente#!"
  
 # Dementation #
 
 INCUBUS_PASSION_PERK_EFFECT: "Bonificación a la [character_interaction|E] de Dementación, permite otorgar un modificador negativo dependiendo de la Resonancia del objetivo.\n#F Inflama uno de los cuatro humores de una víctima, haciendo que sienta, amplifique o adormezca sus emociones#!"
 PASSION_PERK_EFFECT: "Bonificación a la [character_interaction|E] de Dementación, permite otorgar un [GetModifier('passion_perk_modifier').GetNameWithTooltip].\n#F Amplifica o atenúa las emociones presentes en la víctima#!"
 THE_HAUNTING_PERK_EFFECT: "Bonificación a la [character_interaction|E] de Dementación, permite otorgar un [GetModifier('the_haunting_perk_modifier').GetNameWithTooltip].\n#F Inflige visiones enloquecedoras a una víctima#!"
 EYES_OF_CHAOS_PERK_EFFECT: "#F Obtén información sobre la naturaleza de algo a través de patrones aparentemente aleatorios#!"
 SILENCE_THE_SANE_MIND_PERK_EFFECT: "Bonificación a la [character_interaction|E] de Dementación, permite otorgar un [GetModifier('silence_the_sane_mind_perk_modifier').GetNameWithTooltip].\n#F Suprime parte de la mente de la víctima, dejándola confundida, enfurecida, catatónica, etc.#!"
 FIRE_VOICE_PERK_EFFECT: "Bonificación a la [character_interaction|E] de Dementación, permite otorgar un [GetModifier('POD_frenzy_terrified_populace_modifier').GetNameWithTooltip].\n#F Provoca que tanto mortales como Cainitas entren en Rötschreck#!"
 TOTAL_INSANITY_PERK_EFFECT: "Bonificación a la [character_interaction|E] de Dementación, permite otorgar uno de los cinco rasgos de estrés.\n#F Da a alguien cinco desvaríos temporales#!"
 STAIN_THE_SOUL_PERK_EFFECT: "Bonificación a la [character_interaction|E] de Dementación, permite otorgar un rasgo mental negativo permanente.\n#F Inflige un desvarío permanente a una víctima#!"
 CHILDMIND_PERK_EFFECT: "Bonificación a la [character_interaction|E] de Dementación, permite degradar el rasgo inteligente.\n#F Realiza una «lobotomía psíquica» a alguien, reduciendo sus atributos Mentales#!"
 COBBLE_THE_ROAD_PERK_EFFECT: "Bono a la Dementación [character_interaction|E], permite convertir el rasgo de personalidad virtuosa del objetivo en su rasgo opuesto.\n#F Cambia las virtudes de alguien, posiblemente alejándole de su moralidad adoptada#!"
 PRISON_OF_THE_MIND_PERK_EFFECT: "Bono a la Dementación [character_interaction|E], permite otorgar un [GetModifier('prison_of_the_mind').GetNameWithTooltip].\n#F Bloquea la mente de alguien en un estado delirante y deja su cuerpo catatónico#!"
 LUNATIC_ERUPTION_PERK_EFFECT: "Como una [character_interaction|E], te permite iniciar un [GetModifier( 'lunatic_summon_modifier' ).GetNameWithTooltip|L].\n#F Invoca un frenesí de locura en todas las criaturas sintientes en un radio de varios kilómetros#!"
 TOUCH_OF_THE_SAINTS_PERK_EFFECT: "Como una [character_interaction|E], te permite curar rasgos de estrés y rasgos mentales negativos.\n#F Cura a un individuo de sus desvaríos y de cualquier cosa que afecte a su mente#!"
 
 # Melpominee #
 
 THE_MISSING_VOICE_PERK_EFFECT: "#F Lanza tu voz a cualquier lugar dentro de tu vista#!"
 PHANTOM_SPEAKER_PERK_EFFECT: "#F Lanza tu voz a alguien que conozcas dondequiera que esté#!"
 TOREADORS_BANE_PERK_EFFECT: "Bono a la Melpomenia [character_interaction|E], permite otorgar el modificador [GetModifier('POD_toreador_bane_modifier').GetNameWithTooltip] al objetivo.\n#F Hipnotiza a otros con una canción, como la debilidad de los Toreador#!"
 MADRIGAL_PERK_EFFECT: "Desbloquea la [GetScheme('PODsoul_bridge').GetTypeName] [scheme|E].\n#F Proyecta una emoción en tu audiencia con una canción#!"
 SIRENS_BECKONING_PERK_EFFECT: "Bono a la Melpomenia [character_interaction|E], permite otorgar un trastorno de estrés aleatorio al objetivo.\n#F Vuelve loco a alguien con tu canción#!"
 MOSH_PIT_PERK_EFFECT: "Bono a la Melpomenia [character_interaction|E], permite otorgar el modificador [GetModifier('murderous_frenzy_modifier').GetNameWithTooltip] al objetivo.\n#F Inspira a un objetivo a entrar en Frenesí con tu canción#!"
 PRIMAL_SCREAM_PERK_EFFECT: "Bono a la Melpomenia [character_interaction|E], permite otorgar el modificador [GetModifier('POD_frenzy_terrified_populace_modifier').GetNameWithTooltip] a la ubicación del objetivo.\n#F Inspira a un objetivo a entrar en Rötschreck con tu canción#!"
 BLESSED_AUDIENCE_PERK_EFFECT: "Otorga un trastorno de estrés aleatorio a los [knights|E] y [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante el [single_combat_duel_plural|E].\n#F Usa [GetPerk('sirens_beckoning_perk').GetName(GetPlayer)] en muchas personas a la vez#!"
 SHATTERING_CRESCENDO_PERK_EFFECT: "#F Daña a personas u objetos con un grito de alta frecuencia#!"
 PERSISTENT_ECHO_PERK_EFFECT: "Probabilidad de éxito de Melpomenia [character_interaction|E] #P +100%#!.\n#F Suspende tu voz o tus poderes de Melpomenia para alguien que llegue más tarde#!"
 HAUNTING_MELODY_PERK_EFFECT: "Bono a la Melpomenia [character_interaction|E], permite otorgar el modificador [GetModifier('haunting_melody_perk_modifier').GetNameWithTooltip] al objetivo.\n#F Deja una melodía en un lugar determinado que provoque un desvarío a quienes la escuchen#!"
 CALLING_SONG_PERK_EFFECT: "Como una [character_interaction|E], te permite convocar a todos los cortesanos e invitados del objetivo a tu corte.\n#F Impregna a múltiples objetivos con una canción que los atraiga a un lugar específico#!"
 
 # Spiritus #
 
 SPEAK_WITH_SPIRITS_PERK_EFFECT: "Desbloquea $seek_aid_of_the_spirits_decision$ [decision|E].\n#F Habla telepáticamente con los espíritus que te rodean#!"
 AID_FROM_SPIRITS_PERK_EFFECT: "$unlock_enhancing_node$ Añade un [modifier|E] basado en el tipo de [artifact|E]\n#F Despierta el espíritu de un objeto, haciendo que cumpla mejor su función prevista#!"
 SUMMON_SPIRIT_BEASTS_PERK_EFFECT: "Puede reclutar [GetMaA('jagglings').GetName] como [men_at_arms|E].\n#F Invoca los espíritus de animales muertos para que te sirvan#!"
 ASPECT_OF_THE_BEAST_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma: Aspecto de la Bestia.\n#F Apela a un espíritu para obtener la habilidad de un animal#!"
 ENGLING_FURY_PERK_EFFECT: "Bono a cazar espíritus [character_interaction|E], te permite ganar prestigio con ello.\n#F Gana Fuerza de Voluntad devorando el espíritu de un animal#!"
 BEASTLY_HUNGER_PERK_EFFECT: "Bono a cazar espíritus [character_interaction|E], te permite ganar piedad con ello.\n#F Gana Fuerza de Voluntad devorando el espíritu de un animal#!"
 THE_WILD_BEAST_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma: La Bestia Salvaje.\n#F Transfórmate en una poderosa bestia feral#!"
 THE_SPIRIT_BEAST_PERK_EFFECT: "Te permite elegir un animal espiritual.\n#F Fusiónate con un espíritu animal#!"
 
