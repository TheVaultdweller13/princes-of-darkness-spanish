 POD_CAN_OBTAIN_DISCIPLINE_OF_LEVEL_ELDER_ADVANCED_EFFECT: "@warning_icon!#X Esta [elder_perk|E] requiere [TRAIT.GetName(GetPlayer)]#!"
 POD_CAN_OBTAIN_DISCIPLINE_OF_LEVEL_GHOUL_EFFECT: "@warning_icon!#X El nivel de esta [perk|E] #weak ($VALUE|0$)#! está por encima de lo que tu [ghoul_greatest_vitae_ingested|E] permite para#! #weak ([GetPlayer.MakeScope.ScriptValue('POD_allowed_discipline_level_for_ghouls_or_revenants')])#!"
 POD_CAN_OBTAIN_DISCIPLINE_OF_LEVEL_REVENANT_EFFECT: "POD_CAN_OBTAIN_DISCIPLINE_OF_LEVEL_REVENANT_EFFECT: @warning_icon!#X Como [Glossary('Aparecido','game_concept_revenant_desc')], no puedes obtener rasgos de [Glossary('Disciplina','game_concept_discipline_desc')] Avanzada#!"
 POD_CAN_OBTAIN_DISCIPLINE_OF_LEVEL_VAMPIRE_EFFECT: "@warning_icon!#X Necesitas ser al menos [GetTrait('vampgeneration$VALUE|0q$').GetName(GetNullCharacter)] o haber alcanzado el [golconda|E] para elegir esta [elder_perk|E]#!"

 # Animalism # 
 
 BOND_FAMULUS_PERK_EFFECT: "Como [character_interaction|E], puedes #V $POD_bind_famulus$#!, realizando un Vínculo de Sangre con un animal y formando un vínculo mental con él."
 BOND_FAMULUS_PERK_FLAVOR: "#flavor Solo la muerte libera a un familiar una vez vinculado. Mientras reciba sangre de vampiro de forma regular, el familiar no envejecerá#!"
 SENSE_THE_BEAST_PERK_FLAVOR: "$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor El vampiro puede sentir la [Glossary('Bestia','game_concept_beast_desc')] presente en mortales, vampiros y otros seres sobrenaturales, obteniendo una percepción de su naturaleza, ansia y hostilidad#!"
 FERAL_WHISPERS_PERK_FLAVOR: "#flavor El vampiro puede comulgar con las bestias de la naturaleza y de la ciudad. Susurros Ferales permite la comunicación bidireccional con los animales. Puede que un gato no esté interesado en debatir los méritos de las escrituras eclesiásticas, pero hablará encantado sobre la falta de presas alrededor de la catedral local.#!"
 ANIMAL_SUCCULENCE_PERK_FLAVOR: "#flavor Los vampiros suelen considerar que la sangre de un animal carece de sustento. Tiene un sabor repulsivo y apenas nutre las venas de un no-muerto. Algunos Antiguos practicantes de Animalismo, sin embargo, han desarrollado una afinidad suficiente por la sangre de las bestias como para sustentarse eficazmente en la naturaleza.#!"
 QUELL_THE_BEAST_PERK_FLAVOR: "#flavor Al cruzar la mirada con un objetivo, el vampiro somete su [Glossary('Bestia','game_concept_beast_desc')] interna a un letargo temporal. Los mortales afectados se vuelven apáticos, incapaces de realizar cualquier acción que no sea mantenerse con vida, mientras que los impulsos bestiales de los vampiros amainan temporalmente, para bien o para mal#!"
 CALL_OF_THE_WILD_PERK_EFFECT: "Desbloquea la capacidad de reclutar a [GetMaA('POD_controlled_animals').GetName] como [men_at_arms|E]. Empezarán siendo débiles, solo puedes tener un regimiento de estos y su tamaño es independiente de las innovaciones que poseas."
 CALL_OF_THE_WILD_PERK_FLAVOR: "#flavor Con este poder, la [Glossary('Bestia','game_concept_beast_desc')] imbuye la voz del vampiro con una profunda afinidad por un animal determinado. Aúlla, chilla, grazna o imita de otro modo el sonido de un animal. Cualquier animal de la especie elegida que esté al alcance del oído es convocado hacia el vampiro, y algunos vendrán, dependiendo de la capacidad bruta del vampiro#!"
 SUBSUME_THE_SPIRIT_PERK_FLAVOR: "#flavor El vampiro puede transferir completamente su mente al cuerpo de un animal. Puede controlar al animal y usar sus sentidos libremente, incluso durante el día si logra permanecer despierto.#!"
 UNLIVING_HIVE_PERK_FLAVOR: "#flavor Visto con mayor frecuencia entre los Nosferatu, este inquietante poder permite al usuario extender su influencia animal a enjambres de insectos como moscas o cucarachas.#!"
 DRAWING_OUT_THE_BEAST_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$"
 DRAWING_OUT_THE_BEAST_PERK_FLAVOR: "#flavor El vampiro puede proyectar su [Glossary('Bestia','game_concept_beast_desc')] en un momento de terror o frenesí de furia, transfiriéndola a un sujeto cercano, ya sea mortal o vampiro. Esa persona experimentará inmediatamente el frenesí en su lugar, entrando en un frenesí despiadado o huyendo despavorida según el detonante#!"
 ANIMAL_DOMINION_PERK_FLAVOR: "Como una [character_interaction|E], te permite llamar a tu mascota a la guerra.\nPuede reclutar varios tipos de animales como [men_at_arms|E].\n#flavor El poder que el vampiro ejerce sobre las bestias es ahora lo suficientemente grande como para comandar manadas y jaurías como si fueran extensiones de su propio cuerpo. Con un gesto, los animales entregan sus vidas por docenas, incluso cientos, para complacer a su amo#!"
 TONGUE_OF_BEASTS_PERK_FLAVOR: "#flavor Este poder expande los dones de Susurros a la Naturaleza. En lugar de poder hablar con un solo animal, el vampiro puede hablar con todos y cada uno de los animales sin necesidad de establecer contacto visual.#!"
 SEND_THE_EIGHTH_PLAGUE_PERK_EFFECT: "Como una [character_interaction|E], puedes lanzar [GetModifier('weather_magic_plague_modifier').GetNameWithTooltip] sobre el señorío enemigo."
 SEND_THE_EIGHTH_PLAGUE_PERK_FLAVOR: "#flavor Este es uno de los poderes más destructivos entre todas las [Glossary('Disciplinas','game_concept_discipline_desc')]. Un Antiguo Gangrel llamado Valentinian demostró su inmenso potencial de ruina poco después de la Cuarta Cruzada. Enfadado por la intrusión de los Cainitas italianos en sus tierras, apeló a su maestría en Animalismo y trajo la hambruna sobre toda una ciudad comercial.#!"
 CRIMSON_FURY_PERK_EFFECT: "$countermeasures_unlocks_t3_supernatural_high_alert$\nMuestra el evento [unconquered_soul|E] con más frecuencia para los diableristas que intenten consumir tu alma."
 CRIMSON_FURY_PERK_FLAVOR: "#flavor Este poder es objeto de muchos rumores y conjeturas, ya que tiene muy poco efecto visible. Al alcanzar este nivel de maestría, el vampiro puede optar por permitir que su [Glossary('Bestia','game_concept_beast_desc')] deambule libremente por sus venas. Su sangre provoca frenesí en los mortales y vampiros que la prueban. Si un diablerista logra consumir el alma del vampiro, bien podría encontrarse con un final atroz cuando la Bestia del vampiro lo devore desde dentro#!"
 EYES_OF_THE_FOREST_PERK_FLAVOR: "#flavor Este poder asombroso es la raíz de muchos cuentos populares sobre bosques sombríos y montañas prohibidas. Los animales e incluso los insectos de la zona sirven como ojos y oídos del vampiro, proporcionándole un conocimiento íntimo de los acontecimientos nocturnos de su dominio#!"
 PLAGUE_OF_BEASTS_PERK_FLAVOR: "#flavor Un Matusalén maestro de Animalismo puede provocar plagas de proporciones bíblicas. Expandiendo Llamar a la Naturaleza, el vampiro convoca a los animales hacia sí. Sin embargo, en lugar de llamar con la lengua de un solo animal, la propia [Glossary('Bestia','game_concept_beast_desc')] clama a lo largo de kilómetros. Esto convoca a cada animal para que se agolpe alrededor del Cainita, causando un caos absoluto#!"

 # Auspex # 
 
 CLAIRVOYANCE_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n Tu prisionero tiene menos probabilidades de escapar de tu prisión.\n#flavor Al cerrar los ojos y entrar en un ligero trance, el vampiro se convierte en maestro de su entorno.#!"
 HEIGHTENED_SENSES_PERK_EFFECT: "Tu prisionero tiene menos probabilidades de escapar de tu prisión.\n#flavor Los sentidos del vampiro se agudizan hasta un grado sobrenatural, otorgándole la capacidad de ver en la oscuridad total, oír frecuencias ultrasónicas y oler el miedo de la presa que se acobarda.#!"
 PREMONITION_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$ \n Velocidad de progreso de [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!.\nTu prisionero tiene menos probabilidades de escapar de tu prisión.\n#flavor El vampiro experimenta destellos de intuición. Estos pueden tomar la forma de vello erizado, inspiración repentina o incluso visiones vívidas. Aunque nunca son demasiado precisas, estas visiones pueden alejar al vampiro del peligro o revelar una verdad previamente pasada por alto.#!"
 PREMONITION_PERK_BONUS_VALUE: "[GetPerk('premonition_perk').GetName(GetPlayer)]"
 SCRY_THE_SOUL_PERK_EFFECT: "Permite ver la [resonance|E] de otros personajes.\nPuedes elegir qué tipo de [resonance|E] tendrán los mortales que encuentren durante la Caza en tu [journey|E] por tu Capital.\n#flavor Al concentrarse en una persona, el vampiro puede percibir el estado de la psique de esa persona como un aura cambiante de colores. Las auras revelan poca información precisa, pero proporcionan pistas sobre muchos temas, p. ej., el estado emocional, la Resonancia y los rasgos sobrenaturales.#!"
 SENSE_THE_UNSEEN_PERK_EFFECT: "#flavor Los sentidos del vampiro se sintonizan con dimensiones más allá de lo mundano, permitiéndole sentir presencias que de otro modo estarían ocultas al ojo humano.#!"
 SHARE_THE_SENSES_PERK_EFFECT: "Velocidad de progreso de [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!.\n#flavor Al extender su mente, el vampiro puede conectar con los sentidos de otro mortal o vampiro, viendo, oyendo y sintiendo lo que ellos hacen.#!"
 SHARE_THE_SENSES_PERK_BONUS_VALUE: "[GetPerk('share_the_senses_perk').GetName(GetPlayer)]"
 SPIRITS_TOUCH_PERK_EFFECT: "Velocidad de progreso de [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!.\n#flavor Al tocar un objeto inanimado o el suelo, el vampiro puede percibir residuos emocionales. Aquellos que han manipulado ese objeto o han recorrido este camino en el pasado dejan pistas para el lector experto.#!"
 SPIRITS_TOUCH_PERK_BONUS_VALUE: "[GetPerk('spirits_touch_perk').GetName(GetPlayer)]"
 TELEPATHY_PERK_EFFECT: "$countermeasures_unlocks_t3_all_seeing_eye$ \nPuedes usar la [character_interaction|E] de Telepatía para encontrar secretos.\n#flavor En los niveles más altos de Auspex, el vampiro ahora puede literalmente leer mentes, así como proyectar sus propios pensamientos en las mentes de otros.#!"
 PSYCHIC_PROJECTION_EFFECT: "#flavor El Vástago con esta habilidad proyecta sus sentidos fuera de su cuerpo físico, saliendo de su cuerpo como una entidad de puro pensamiento.#!"
 DISCERN_THE_AURA_PERK_EFFECT: "Como [character_interaction|E], permite convocar a un mortal con [skills|E] de tu elección a tu corte.\n#F Escanea a un grupo de personas con un rasgo particular en su aura.#!"
 THE_MIND_REVEALED_PERK_EFFECT: "Como [character_interaction|E], permite conocer cada conjura del objetivo.\n#F Lee continuamente los pensamientos de alguien para saber qué está pensando y qué está a punto de hacer.#!"
 PERSONALITY_METAMORPH_PERK_EFFECT: "Como [character_interaction|E], permite cambiar todos tus rasgos de personalidad.\nComo [character_interaction|E], permite cambiar tu sexualidad.\n#F Adopta personalidades ficticias como si fueran tuyas.#!"
 SUPERNAL_AWARENESS_PERK_EFFECT: "$countermeasures_unlocks_t4_all_seeing_eye$ \nRecibirás una notificación si alguien tiene la intención de asesinar a tus amigos o familiares.\nRecibirás una notificación si alguien tiene la intención de seducir a tus amantes o consortes.\nTus prisioneros tienen menos probabilidades de escapar de tu prisión.\n#F Percibe eventos y hazañas en cualquier lugar del mundo.#!"
 OMNISCIENCE_PERK_EFFECT: "Como [character_interaction|E], permite conocer cada secreto del objetivo.\n#F Conoce las personalidades e identidades de todas las criaturas que te rodean.#!"
 MASTER_OF_THE_DOM_PERK_EFFECT: "Genera automáticamente (o mejora) un edificio gratuito en cada provincia de tu condado capital cada #V 5#! años.\n#F Fusiónate con una tierra y conoce todo lo que transcurre en ella mientras ganas poder sobre la tierra y sus residentes.#!"
 MASTER_OF_THE_DOM_PERK_WARNING_EFFECT: "@warning_icon!#X Esto no funciona en edificios de una [grand_city|E].#!" 
 
