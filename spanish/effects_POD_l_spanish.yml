 ARCANE_KNOWLEDGE_1_PERK_EFFECT: "Aumenta la probabilidad de éxito de los [bs_spell|E] de [bloodsorcery|E] en un 15\nDisminuye la probabilidad de éxito de los [bs_spell|E] hostiles de [bloodsorcery|E] en un 10"
 ARCANE_KNOWLEDGE_2_PERK_EFFECT: "Aumenta la probabilidad de éxito de los [bs_spell|E] de [bloodsorcery|E] en un 15\nDisminuye la probabilidad de éxito de los [bs_spell|E] hostiles de [bloodsorcery|E] en un 10"
 ARCANE_KNOWLEDGE_3_PERK_EFFECT: "Aumenta la probabilidad de éxito de los [bs_spell|E] de [bloodsorcery|E] en un 15\nDisminuye la probabilidad de éxito de los [bs_spell|E] hostiles de [bloodsorcery|E] en un 10"
 ARCANE_KNOWLEDGE_4_PERK_EFFECT: "Aumenta la probabilidad de éxito de los [bs_spell|E] de [bloodsorcery|E] en un 15\nDisminuye la probabilidad de éxito de los [bs_spell|E] hostiles de [bloodsorcery|E] en un 10"

 ARCANE_MASTERY_1_PERK_EFFECT: "Aumenta la velocidad de los [bs_ritual|E] de [bloodsorcery|E] en un 10%"
