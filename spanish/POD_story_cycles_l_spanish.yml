l_spanish:
 POD_story_pact: "#glow_color:{0.5,0,0,1} Pacto Demoníaco#!"
 POD_story_pact_desc: "Negociaste por poder.\n¿Valió la pena?"

 #POD_story_pact_demon: "@demon_icon! Demonio"
 POD_story_pact_custom_string: "#font:TitleFont;size:19;glow_color:{0.5,0,0,1} Pacto firmado con [Story.MakeScope.Var('demon').Char.GetFirstName]#!\n#glow_color:{0.25,0,0,75} [demonic_pact_obligation|E]: [Localize(Concatenate('POD_obligation_', Story.MakeScope.GetVariable('obligation').GetFlagKey))|U]\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODPactFrequencyAndStatus')]\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODPactDeadline')]\nSi #X rompes#! el pacto:\n[GetScriptedGui('POD_sidebar_show_demonic_pacts').BuildTooltip(GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('obligation', MakeScopeFlag(Story.MakeScope.GetVariable('obligation').GetFlagKey)).AddScope('consequence', MakeScopeFlag(Story.MakeScope.GetVariable('consequence').GetFlagKey)).End)]\nEste [demonic_pact|E] vale [Story.MakeScope.GetVariable('perk_points_gained').GetValue|0V] [Select_CString( EqualTo_CFixedPoint( Story.MakeScope.GetVariable('perk_points_gained').GetValue, '(CFixedPoint)1' ), 'punto', 'puntos' )] de [perk|E] de [investiture_lifestyle|E]#!"
 POD_story_pact_deadline_normal: "#N Próximo tributo debido en [story.MakeScope.GetVariable('years_until_obligation').GetValue|0V] [Select_CString( EqualTo_CFixedPoint( story.MakeScope.GetVariable('years_until_obligation').GetValue, '(CFixedPoint)1' ), 'año', 'años' )]#!"
 POD_story_pact_deadline_fresh: "#N Próximo tributo debido en [story.MakeScope.GetVariable('frequency').GetValue|0V] [Select_CString( EqualTo_CFixedPoint( story.MakeScope.GetVariable('frequency').GetValue, '(CFixedPoint)1' ), 'año', 'años' )]#!"
 POD_story_pact_deadline_urgent: "#X El tributo vence dentro del año \n¡cumple con la [demonic_pact_obligation|E] ahora o paga el precio!#!"
 POD_story_pact_deadline_prohibitory: "#weak Esta prohibición debe respetarse en todo momento.#!"
 POD_story_pact_deadline_completed: "El demonio volverá a exigirlo dentro de [story.MakeScope.GetVariable('years_until_obligation').GetValue|0V] [Select_CString( EqualTo_CFixedPoint( story.MakeScope.GetVariable('years_until_obligation').GetValue, '(CFixedPoint)1' ), 'año', 'años' )]."
 POD_story_pact_deadline_completed_nodate: "#P Obligación cumplida: no vence por ahora.#!"
 POD_story_pact_deadline_warning.toast: "#X El pacto de [pact_demon.GetFirstName] vence dentro del año.#!"
 POD_story_pact_deadline_warning_desc: "Cumple el pacto ahora o paga el precio."

 POD_story_pact_prohibitory: "Estado: #X Prohibitorio#!"
 POD_story_pact_frequency_completed: "[demonic_pact_frequency|E]: Cada [story.MakeScope.GetVariable('frequency').GetValue|0V] años#!\nEstado: #P Completado#!"
 POD_story_pact_frequency_notcompleted: "[demonic_pact_frequency|E]: Cada [story.MakeScope.GetVariable('frequency').GetValue|0V] años#!\nEstado: #N Pendiente#!"
 POD_asakku_depth_accumulation: "El Vigilante del Pozo"
 POD_asakku_depth_accumulation_desc: "Una entidad más antigua que la memoria ha reparado en tu sangre. Ya sea una fiebre de la Bestia o demonios de episodios olvidados del Génesis que desconoces, temes averiguarlo a medida que se acerca más y más a tu mismísima alma."
 POD_asakku_story_custom_string: "Andeleon cuenta con el siguiente contenido único para representar la infección de los Asakku. \n\n#bold Corrupción Asakku#! mide el dominio de la entidad sobre ti con un valor de 1 a 100, mostrado como un modificador de personaje. Se acumula despacio con el tiempo y más deprisa cuando actúas en su interés. Cuatro umbrales, en #bold 25, 50, 75#! y #bold 100#!, marcan cambios irreversibles: un nuevo rasgo, nuevas habilidades y una atención creciente por parte de quienes cazan la infección.\n\n#bold Propagar a los Asakku#!: la Vicisitud es el vector de la entidad. Los personajes que poseen la disciplina son susceptibles. La conjura [soul_infection|E] planta la presencia en un huésped voluntario o ignorante. Una vez que se es Asakku por completo, [blood_inception|E] funciona más deprisa, pero requiere un objetivo encarcelado.\n\n#bold La Cruzada de las Sombras#!: el Tal'Mahe'Ra sabe lo que eres. A medida que crezca la corrupción, los Elioud, Vástagos entrenados para identificar y eliminar el contagio, se movilizarán contra ti. \n\n#bold El Vigilante del Pozo#!: cuatro objetivos de campaña impulsan la expansión de los Asakku: propagar la infección, ahondar la corrupción, reclamar los antiguos asientos de poder y someter a los cazadores del este. Cada fase exige más del mundo y más de ti."
 POD_asakku_story_depth_label: "Corrupción Asakku"
 POD_asakku_story_depth_min_label: "Intacto"
 POD_asakku_story_depth_max_label: "Iryi Ascendente"
 POD_maryb_story: "#glow_color:{0.75,0.5,0.21,0.5}El Sueño Negro#!"
 POD_maryb_story_desc: "Tres tablillas y un sendero que termina en una capilla bajo Santa Sofía. María la Negra lo recorre de nuevo."
 POD_maryb_story_custom_string: "[Story.GetOwner.Custom('POD_maryb_story_phase')]"
 POD_maryb_story_phase_seeking: "Fragmentos de ti misma están esparcidos por las ciudades del Levante, atados en arcilla. Dos tablillas escritas con tu propia sangre y una con la mano de un sacerdote muerto aguardan en #bold [GetTitleByKey('c_damascus').GetNameNoTier]#!, #bold [GetTitleByKey('c_mosul').GetNameNoTier]#! y #bold [GetTitleByKey('c_baghdad').GetNameNoTier]#!. Toma una ciudad, recupera su tablilla, y un poco más de lo que ella fue regresará a ti.\n\n#shinygold Todo conduce de vuelta a mí, amada. Ya lo verás.#!"
 POD_maryb_story_phase_stylus: "Tres tablillas recuperadas, tres vidas sepultadas recordadas, y la arcilla de la cuarta yace húmeda bajo su mano. No queda nada por encontrar en el Levante. Solo resta tomar el estilete y escribir el final, y decidir, con él suspendido sobre la arcilla, de quién será ese final.\n\n#shinygold Cuando estés lista, amada. He esperado más de lo que puedes saber.#!"
 POD_maryb_story_phase_blackdream: "Las tablillas están leídas, la cuarta está escrita y el silencio de la capilla es solo tuyo. Miguel ya tiene un final. El Sueño es ahora tuyo, y la única pregunta que queda es hasta qué punto puede corromperse un Sueño antes de volverse Pesadilla."
 POD_maryb_story_phase_seconddream: "#shinygold María la Negra ha muerto. Solo existió el Sueño y la mujer que lo trajo a casa, y ahora visto la carne que ella conservó para mí. Tu sangre Baali aún podría serme útil. Habré de [Concept('receive_into_the_dream', 'Abrazar de nuevo')|E] al mundo en el sueño.#!"
 POD_maryb_story_ashgold_body: "Algo distinto se alza donde estaban María y Miguel, y responde a ambos nombres. Ninguno ha sido borrado; ninguno ha vencido. Lo que hicieron mira a través de un solo par de ojos, y cuál de los dos lleva el timón cambia con una marea a la que ninguna voluntad manda.\n\nAhora podemos reconstruir la Trinidad. Necesitaremos [GetCourtPositionType('pillar_of_darkness_court_position').GetName()] y [GetCourtPositionType('pillar_of_light_court_position').GetName()]."
 POD_maryb_story_phase_ashgold_mary: "$POD_maryb_story_ashgold_body$\n\nAhora mismo es María quien mira: los ojos ensombrecidos, el Ansia de antaño agazapada bajo la piel."
 POD_maryb_story_phase_ashgold_michael: "$POD_maryb_story_ashgold_body$\n\n#shinygold Ahora mismo es Miguel quien mira: la mirada segura, el antiguo resplandor deslucido hasta un oro bruñido.#!"
 POD_maryb_story_phase_ashgold_neutral: "$POD_maryb_story_ashgold_body$"
 POD_maryb_story_balance_label: "María y Miguel"
 POD_maryb_story_balance_min_label: "#shinygold Miguel en ascenso#!"
 POD_maryb_story_balance_max_label: "#P María en ascenso#!"
 POD_maryb_story_tablets_label: "Tablillas recuperadas"
 POD_maryb_story_tablets_min_label: "Ninguna"
 POD_maryb_story_tablets_max_label: "Las tres"
 POD_story_spell_of_life_explanation: "Búsqueda del [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E]"
 POD_story_spell_of_life_explanation_desc: "El Hechizo de la Vida permite crear $POD_splat_mummy_plural$ y les concede la inmortalidad mediante un ciclo de muerte y renacimiento. Pocos lo han aprendido jamás. Si deseas unirte a ellos, el camino será largo."
 POD_story_spell_of_life_explanation_custom_string: "[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLInProgressQuest')]"
 POD_story_spell_of_life_explanation_inprogress: "Si deseas aprender tú mismo el Hechizo de la Vida, tendrás que completar una larga búsqueda y obtener más [trait_level_track_xp|E] en la senda del Hechizo de la Vida de [GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )].\n\n#T Petición a los Antiguos#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage1Desc')]\n\n#T Los Fragmentos Perdidos#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage2Desc')]\n\n#T Los Guardianes de la Puerta#!\nNada más alcanzar 90 de [trait_level_track_xp|E], varias facciones te atacarán para robarte tus investigaciones y castigar tu osadía.\n\n#T El nacimiento de la Eternidad#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage4Desc')]\n\n#R Prepárate para sacrificarlo todo en la búsqueda de la verdadera inmortalidad, ¡pues el camino está plagado de peligros!#![GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage3Task')][GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLRecommendDesc')]"
 POD_story_spell_of_life_explanation_complete: "Tras lograr una hazaña que pocos han conseguido, se te presentan nuevas oportunidades. Mediante una [character_interaction|E] puedes crear nuevos $POD_splat_mummy_plural$, pedir a otros que creen $POD_splat_mummy_plural$ o enseñar el Hechizo de la Vida a terceros. Los objetivos pueden ofrecer caminos interesantes o permitirte enseñar el Hechizo de la Vida, si ahora está restringido.\n\nCon tal poder, el mundo yace a tus pies. ¿Crearás una raza de momias que ejecute tu terrible venganza o remodelarás el mundo a tu imagen? ¿Defenderás el equilibrio o lo romperás? ¿Desgarrarás el velo entre la vida y la muerte?"
 POD_story_spell_of_life_explanation_stage1_brief: "La primera etapa ofrece 4 caminos, compuestos por varias decisiones. Completar un camino entero puede dar recompensas en etapas posteriores."
 POD_story_spell_of_life_explanation_stage1_full: "La primera etapa ofrece 4 caminos, cada uno compuesto por 3 decisiones. Algunos personajes ya han dado los primeros pasos por un camino, y no todos los caminos están disponibles para todos ni en todos los marcadores. Completar un camino entero puede dar recompensas en etapas posteriores.\n#bold Horus#!\n$BULLET_WITH_TAB$Ofrecer el Bajo Egipto a Horus\n$BULLET_WITH_TAB$Convencer a Horus de que te ayude\n$BULLET_WITH_TAB$Eliminar la amenaza setita\n#bold Kemintiri#!\n$BULLET_WITH_TAB$Hacerte amigo de Kemintiri, obtener los Fragmentos de Isis y reconquistar lugares clave\n$BULLET_WITH_TAB$Encontrar a algunos viejos amigos de Kemintiri\n$BULLET_WITH_TAB$Aniquilar a la Casa Tawaret\n#bold Cabirus#!\n$BULLET_WITH_TAB$Obtener los Escritos Secretos de Cabirus\n$BULLET_WITH_TAB$Aprender hechicería y reclutar hechiceros\n$BULLET_WITH_TAB$Debilitar la amenaza Tremere contra Cabirus\n#bold Experimentación#!\n$BULLET_WITH_TAB$Torturar a una momia prisionera y a algunos posibles hechiceros\n$BULLET_WITH_TAB$Convencer a tu familia o a tus correligionarios de que te ayuden\n$BULLET_WITH_TAB$Encarcelar a muchísimas personas, obtener algunos artefactos y conquistar una tierra muy poblada"
 POD_story_spell_of_life_explanation_stage2_brief: "Tras alcanzar 30 de [trait_level_track_xp|E], completa [journeys|E] para obtener pistas y estudiar con los pocos que conocen aunque sea un fragmento del Hechizo de la Vida."
 POD_story_spell_of_life_explanation_stage2_full: "Tras alcanzar 30 de [trait_level_track_xp|E], ya no podrás completar las decisiones de los caminos anteriores. En su lugar, completa [journeys|E] para obtener pistas y estudiar con los pocos que conocen aunque sea un fragmento del Hechizo de la Vida. Los especialmente eruditos o versados en magia pueden estudiar el Hechizo de forma pasiva y ampliar sus conocimientos. Además, quienes están cerca de $POD_splat_mummy_plural$ y quienes poseen ciertos [counties|E] #TOOLTIP:MUMMY_SOL_PASSIVE_county_explanation #L asociados con la muerte de Osiris#!#! reunirán de forma pasiva ciertas intuiciones."
 POD_story_spell_of_life_explanation_stage3_notask: ""
 POD_story_spell_of_life_explanation_stage3_task: "\n\nPara avanzar, #T #X ¡SOBREVIVE!#!#!"
 POD_story_spell_of_life_explanation_stage4_brief: "Si sobrevives, tendrás que obtener un [UmbraGlossary('shadow_realm')] para poder completar el Hechizo de la Vida. Su naturaleza determinará el destino y la naturaleza de los $POD_splat_mummy_plural$ nacidos de tu Hechizo."
 POD_story_spell_of_life_explanation_stage4_full: "Tendrás que obtener un [UmbraGlossary('shadow_realm')] para poder completar el Hechizo de la Vida atando el ritual a ese señorío. Su naturaleza determinará el destino y la naturaleza de los $POD_splat_mummy_plural$ nacidos de tu Hechizo. A menos que te unas a un señorío bien asentado y estable como [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], tendrás que abrirte paso entre hordas de #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L espectros#!#! antes de poder concluir tu búsqueda, una empresa arriesgada incluso para el gobernante más poderoso."
 POD_story_spell_of_life_explanation_using_recommend: "\n\n#help Si enseñas lo que sabes a otra persona, podrías recomendarle que lo use contigo.#!"
 POD_story_spell_of_life_explanation_blocked_recommend: ""
 POD_story_elixir_of_eternal_life_explanation: "Búsqueda del [Concept('POD_elixir_of_eternal_life', 'Elixir de la Vida Eterna')|E]"
 POD_story_elixir_of_eternal_life_explanation_desc: "El Elixir de la Vida Eterna permite crear $POD_splat_mummy_plural$ y les concede la inmortalidad mediante un ciclo de muerte y renacimiento. Pocos lo han aprendido jamás. Si deseas unirte a ellos, el camino será largo."
 POD_story_elixir_of_eternal_life_explanation_custom_string: "[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELInProgressQuest')]"
 POD_story_elixir_of_eternal_life_explanation_inprogress: "Si deseas aprender tú mismo el Elixir de la Vida Eterna, tendrás que completar una larga búsqueda y obtener más [trait_level_track_xp|E] en la senda del Elixir de la Vida Eterna de [GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )].\n\n#T En busca del Dao#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELStage1Desc')]\n\n#T Reunir secretos celestiales#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELStage2Desc')]\n\n#T La cuádruple tentación#!\nNada más alcanzar 90 de [trait_level_track_xp|E], 4 [Glossary('Reyes Yama','podgloss.yamaking')] te harán una oferta que no podrás rechazar.\n\n#T Ascender más allá de la mortalidad#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELStage4Desc')]\n\n#R Prepárate para sacrificarlo todo en la búsqueda de la verdadera inmortalidad, ¡pues el camino está plagado de peligros!#![GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELStage3Task')][GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELRecommendDesc')]"
 POD_story_elixir_of_eternal_life_explanation_complete: "Tras lograr una hazaña que pocos han conseguido, se te presentan nuevas oportunidades. Mediante una [character_interaction|E] puedes crear nuevos $POD_splat_mummy_plural$, pedir a otros que creen $POD_splat_mummy_plural$ o enseñar el Elixir de la Vida Eterna a terceros. Los objetivos pueden ofrecer caminos interesantes o permitirte enseñar el Elixir de la Vida Eterna, si ahora está restringido. Puede que incluso tengas la opción de adquirir una forma alternativa del Elixir.\n\nCon tal poder, el mundo yace a tus pies. ¿Crearás una raza de momias que ejecute tu terrible venganza o remodelarás el mundo a tu imagen? ¿Defenderás el equilibrio o lo romperás? ¿Desgarrarás el velo entre la vida y la muerte? ¿Intentarás hallar la manera de aprender ambas formas del Elixir de la Vida Eterna?"
 POD_story_elixir_of_eternal_life_explanation_stage1_brief: "La primera etapa ofrece 3 caminos, compuestos por varias decisiones. Completar un camino entero puede dar recompensas en etapas posteriores."
 POD_story_elixir_of_eternal_life_explanation_stage1_full: "La primera etapa ofrece 3 caminos, cada uno compuesto por 3 decisiones. No todos los caminos están disponibles para todos ni en todos los marcadores. Completar un camino entero puede dar recompensas en etapas posteriores.\n#bold Meditación y Alquimia Interna#!\n$BULLET_WITH_TAB$No tener rasgos negativos de salud o estrés y trabajar hacia [GetTrait('whole_of_body').GetName(GetPlayer)]\n$BULLET_WITH_TAB$No tener rasgos de personalidad excesivos, tener un rasgo de estrés positivo y tener [GetTrait('whole_of_body').GetName(GetPlayer)]\n$BULLET_WITH_TAB$Completar los estilos de vida de una habilidad y apartarte del mundo\n#bold Rituales y Alquimia Externa#!\n$BULLET_WITH_TAB$Reunir una mezcla de terrenos y ser [GetTrait('lifestyle_gardener').GetName(GetPlayer)] o [GetTrait('lifestyle_herbalist').GetName(GetPlayer)]\n$BULLET_WITH_TAB$Reunir artefactos con una variedad de beneficios de habilidad, explorar la [umbra|E] o vincular wraiths\n$BULLET_WITH_TAB$Reunir artefactos con una variedad de poderosos beneficios de habilidad u obtener algún [spirit_companion|E]\n#bold Relaciones y Vida Nutricia#!\n$BULLET_WITH_TAB$Mejorar tu señorío y complacer a tus vasallos\n$BULLET_WITH_TAB$Forjar relaciones profundas con personas hábiles\n$BULLET_WITH_TAB$Obtener el poder de actuar y no hacerlo"
 POD_story_elixir_of_eternal_life_explanation_stage2_brief: "Tras alcanzar 30 de [trait_level_track_xp|E], completa [journeys|E] para obtener pistas y medita para acercarte cada vez más a la perfección."
 POD_story_elixir_of_eternal_life_explanation_stage2_full: "Tras alcanzar 30 de [trait_level_track_xp|E], ya no podrás completar las decisiones de los caminos anteriores. En su lugar, completa [journeys|E] para obtener pistas y medita mediante una [decision|E] para acercarte cada vez más a la perfección. Los especialmente eruditos o versados en magia pueden estudiar el Elixir de forma pasiva y ampliar sus conocimientos. Además, los piadosos y los legendarios reunirán pasivamente ciertas intuiciones, mientras que los temibles y tiránicos se verán entorpecidos."
 POD_story_elixir_of_eternal_life_explanation_stage3_notask: ""
 POD_story_elixir_of_eternal_life_explanation_stage3_task: "\n\nPara avanzar, #T #X ¡SOBREVIVE O RÍNDETE!#!#!"
 POD_story_elixir_of_eternal_life_explanation_stage4_brief: "Si sobrevives, tendrás que convencer a los Ocho Inmortales de que te concedan las últimas piezas del Elixir o labrarte un espacio dentro de un Infierno Yomi."
 POD_story_elixir_of_eternal_life_explanation_stage4_full: "Para completar el Elixir de la Vida Eterna, tendrás que atarlo a un señorío dentro de las tierras de los muertos. Ese señorío hará las veces de tu [UmbraGlossary('shadow_realm')] y aportará los espíritus que se infundirán en los $POD_splat_mummy_plural$ que crees. Sin embargo, mientras que el Hechizo puede vincularse a cualquier lugar, solo las Puertas del Cielo y los Mil Infiernos pueden contener las almas de los Inmortales del Reino Medio. Tendrás que convencer al amo de un señorío para que lo ponga al servicio del Elixir. Unos pocos locos han intentado aprender ambas versiones del Elixir, pero ninguno ha logrado tal hazaña. Dicen que nadie puede servir a dos amos; quizá tú seas la excepción."
 lunar_auspice_xp_gain_message: "El favor de la Luna"
 battle_combat_encounters_enabled_tooltip: "Pueden iniciarse [pod_combat_encounters_with_icon|E] mientras diriges un [army|E]"
 POD_story_lunar_auspice_ahroun: "Ira de la Luna Llena"
 POD_story_lunar_auspice_ahroun_desc: "Texto genial"
 POD_story_lunar_auspice_ahroun_extra_text: "$TAB$#FONT:PODSubtitles;size:24 La Ira de la Luna Llena#!\n\nDe entre todos los $glossary_fera$, los $POD_splat_garou$ son los más belicosos. Y aun entre ellos, los Ahroun juegan en otra liga. ¡Asume tu herencia y muestra al mundo tu [prowess|E|l]!\n\nLos Ahroun ganan el favor de $glossary_luna$ venciendo en [pod_combat_encounters_with_icon|E] contra enemigos de destreza similar. No hay gloria en aplastar a los débiles. Cuanto más poderoso es el objetivo, más [trait_level_track_xp|E] se obtiene.\n\nPuedes desafiar a otros personajes mediante la [character_interaction|E] #V $POD_rhythm_of_war_interaction$#!. Estos [pod_combat_encounters_with_icon|E] son casi siempre letales; solo otros $POD_splat_garou$ pueden aceptar desafíos no letales, en cuyo caso la recompensa se reduce.\n\n[prowess_i|E] de tu [GetModifier('POD_werewolf_form_crinos_modifier').GetNameWithTooltip]: [Story.GetOwner.MakeScope.ScriptValue('POD_ahroun_true_prowess')|V0]\n[prowess_i|E] del objetivo válido más débil: [Story.GetOwner.MakeScope.ScriptValue('POD_ahroun_target_prowess_min')|V0]"
 POD_story_lunar_auspice_ahroun_powerful_target_list: "Enemigos dignos cerca de tu zona"
 POD_story_lunar_auspice_ahroun_target_list: "Enemigos cercanos"
 ahroun_snarl_sgui: "Gruñido de desafío"
 POD_story_lunar_auspice_galliard: "Relato de la Luna Gibosa"
 POD_story_lunar_auspice_galliard_desc: "Texto genial"
 POD_story_lunar_auspice_galliard_extra_text: "$TAB$#FONT:PODSubtitles;size:24 Relato de la Luna Gibosa#!\n\nSe cantan canciones de días pasados, de tiempos agradables, de sucesos desgarradores, de héroes y de villanos. Escucha ahora las canciones de los Galliard, que cantan sobre el pasado y sobre tu futuro. Observa cómo sus canciones dan vida a sus palabras, observa cómo se determina tu futuro.\n\nLos Galliard se ganan el favor de $glossary_luna$ entretejiendo #clickable Canciones#! mediante la [character_interaction|E] #V Canción Primigenia#!. Cuantos más #clickable versos#! contenga, más [trait_level_track_xp|E] se obtiene.\n\nUna #clickable Canción#! tarda en prepararse e impondrá una penalización a la regeneración de $POD_energy_gnosis$ hasta que esté lista. Sus efectos solo se producirán una vez completada la preparación."
 POD_story_lunar_auspice_galliard_song_targets: "Público"
 galliard_song_timer_modifier: "Canción en crescendo"
 galliard_song_timer_modifier_desc: "La Canción de un Galliard va cobrando fuerza. Solo el tiempo dirá qué relato revela."
 galliard_song_upkeep_modifier: "Canción primordial"
 galliard_song_galliard_notification: "Canción primordial"
 POD_story_lunar_auspice_philodox: "Juicio de la Media Luna"
 POD_story_lunar_auspice_philodox_desc: "Texto genial"
 POD_story_lunar_auspice_philodox_extra_text: "$TAB$#FONT:PODSubtitles;size:24 Juicio de la Media Luna#!\n\nUn lobo es peligroso, pero se le puede evitar, engañar o incluso matar con facilidad. Una manada, en cambio, compensa esas desventajas con el número y la organización. Las manadas de $POD_splat_garou$ no son distintas, y su eficacia depende de sus Philodox. ¿Llevarás a tu manada a la gloria o a la tumba?\n\nLos Philodox ganan el favor de $glossary_luna$ completando [journeys|E] de #clickable Entrenamiento de manada#!. La cantidad de [trait_level_track_xp|E] obtenida depende de su [stewardship|E] y de su Rango de Hombre lobo. El #clickable Entrenamiento de manada#! mejora a medida que avanzas en el [lifestyle|E] de [lunar_auspicegifts_lifestyle|E]."
 POD_story_lunar_auspice_philodox_pack_members: "Miembros de la manada"
 POD_story_lunar_auspice_ragabash: "Luz de la Luna Nueva"
 POD_story_lunar_auspice_ragabash_desc: "Texto genial"
 POD_story_lunar_auspice_ragabash_extra_text: "$TAB$#FONT:PODSubtitles;size:24 Luz de la Luna Nueva#!\n\nA medida que las noches se oscurecen y toda clase de monstruos empiezan a rondar en ellas, hay quienes los acechan. Los colmillos de estos depredadores, con astucia y paciencia, alcanzarán la garganta de su presa. Cuidado con la #clickable Luz de la luna#!, pues te marca como su presa.\n\nUn Ragabash gana el favor de $glossary_luna$ obteniendo [artifacts|E] de #clickable Marca de Luna#! que aparecen en otros personajes. Esto se logra sobre todo con el [journey|E] de #V Robo de artefactos#!, pero otros métodos, como las [schemes|E], funcionan igual de bien.\n\nLas #clickable Marcas#! tienen un [artifact_power|E] que determina la cantidad de recompensas que obtienes de ellas. También pueden aparecer #clickable Marcas Iluminadas por la Luna#! si tienes el don correspondiente. Son únicas y ofrecen recompensas mucho más valiosas. Aparecen mejores #clickable Marcas#! a medida que aumenta tu Rango de $POD_splat_werewolf$.\n\n#clickable Marcas Iluminadas por la Luna manifestadas:#! [Story.MakeScope.Var('total_moonlit_marks_spawned').GetValue|V0]/[EmptyScope.ScriptValue('POD_ragabash_moonlit_marks_max')|V0]"
 POD_story_lunar_auspice_ragabash_marks: "Marcas de $glossary_luna$"
 artifact_mark_of_luna: "@ragabash_icon!Marca de Luna"
 artifact_mark_of_luna_description: "Los ojos de $glossary_luna$ están sobre ti."
 artifact_moonlit_mark_of_luna: "@ragabash_icon!Marca de Luna #clickable Iluminada#!"
 artifact_moonlit_mark_of_luna_description: "La #clickable luz de la luna#! brilla con fuerza. Los ojos de $glossary_luna$ están sobre ti."
 moonlit_mark_prowess_modifier: "Vigor #clickable Iluminado#!"
 moonlit_mark_opinion_modifier: "Carisma #clickable Iluminado#!"
 moonlit_mark_heist_modifier: "Máscara #clickable Iluminada#!"
 moonlit_mark_hounds_modifier: "Parentela #clickable Iluminada#!"
 moonlit_mark_hounds_modifier_desc: "Puede reclutar [GetMaA('hounds_luna').GetName] como [men_at_arms|E]"
 moonlit_mark_immunity_modifier: "Gracia #clickable Iluminada#!"
 moonlit_mark_immunity_modifier_desc: "Obtienes inmunidad a la [silver_damage_short_with_icon|E]."
 POD_story_lunar_auspice_theurge: "Comunión de la Luna Creciente"
 POD_story_lunar_auspice_theurge_desc: "Texto genial"
 POD_story_lunar_auspice_theurge_extra_text: "$TAB$#FONT:PODSubtitles;size:24 Comunión de la Luna Creciente#!\n\nPese a la elevada sintonía espiritual de los $POD_splat_garou$, muchos de ellos ignoran las complejidades del Mundo Espiritual. Un Teúrgo puede pasar la mayor parte de su vida en la [umbra|E] y aun así captar solo meros fragmentos del poder que encierra. Pero eso no les ha impedido intentarlo.\n\nLos Teúrgos ganan el Favor de $glossary_luna$ usando la [character_interaction|E] #clickable Vinculación de espíritu#! con sus [spirit_companions|E]. Esto vincula al Espíritu a un Túmulo propio, que otorga bonificaciones adicionales a la provincia o al condado. Se pueden encontrar espíritus explorando cualquier señorío de las [UmbraGlossary('spirit_wilds')], invocándolos o al final de los [journeys|E] de #V Búsqueda espiritual#!."
 POD_story_lunar_auspice_theurge_spirit_companions: "Compañeros Espíritu"
