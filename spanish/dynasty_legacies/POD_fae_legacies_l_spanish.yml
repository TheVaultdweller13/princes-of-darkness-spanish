l_spanish:
 POD_dynasty_perk_fae_tooltip_gui: "[GetScriptedGui(Concatenate('POD_dynasty_perk_tooltip_', SCOPE.GetFlagName('saved_tooltip'))).IsValidTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('perk_level', MakeScopeValue(SCOPE.GetValue('perk_level'))).End)]"
 POD_dynasty_perk_fae_tooltip: "Debes cumplir requisitos adicionales para adquirir este [dynasty_perk|E]:"

 improve_ravaging: "Mejora [ravaging|E] otorgando #P +1#! de Glamour independientemente de la [epiphanies_quality|E]."
 improve_reverie: "Mejora [reverie|E] actuando como si todas las [Concept('relation', 'Relaciones Especiales')|E] tuvieran #P un punto adicional#! de [epiphanies_quality|E]."
 
 aesin_legacy_track_name: "Legado Aesin"
 aesin_legacy_track_desc: "Casa de la Naturaleza."
 aesin_legacy_1_name: "Llamada de la Naturaleza"
 aesin_legacy_1_perk: "#flavor Los Aesin han reclamado el dominio sobre lo salvaje; el propio Ensueño guiará a los animales salvajes para que cumplan nuestra voluntad.#!"
 aesin_legacy_2_name: "Siervos de Aesin"
 aesin_legacy_2_perk: "#flavor «¡La Naturaleza misma es nuestro dominio, el Ensueño así lo ha declarado!»#!"
 aesin_legacy_3_name: "Presa Digna"
 aesin_legacy_3_perk: "Coste base de [gold|E] de la [activity|E] de [GetActivityType('activity_hunt').GetName]: #P -50%#!.\n#flavor Conocemos el funcionamiento interno de la caza activa, sobre todo en la naturaleza salvaje.#!"
 aesin_legacy_4_name: "Combate en Todo Terreno"
 aesin_legacy_4_perk: "[decision|E]: Obtén o gana [trait_level_track_xp|E] en un [commander_trait|E] basado en la naturaleza.\n#flavor La naturaleza es nuestra casa, lo sabemos todo de ella y ella lo sabe todo de nosotros.#!"
 aesin_legacy_5_name: "Skalds Habilidosos"
 aesin_legacy_5_perk: "[decision|E]: Obtén o gana [trait_level_track_xp|E] en el [trait|E] [GetTrait('lifestyle_poet').GetName(GetNullCharacter)].\n#flavor ¡La belleza de la naturaleza debe compartirse!#!"

 ailil_legacy_track_name: "Legado Ailil"
 ailil_legacy_track_desc: "Casa de la Ambición"
 ailil_legacy_1_name: "Aprovechar cualquier oportunidad"
 ailil_legacy_1_perk: "Coste de [casus_belli|E]: #P -30%#!\n#flavor Hay que aprovechar cualquier oportunidad, cueste lo que cueste.#!"
 ailil_legacy_2_name: "Juramentos que Atan"
 ailil_legacy_2_perk: "#flavor Los juramentos deben respetarse; solo así los poderosos pueden ser poderosos.#!"
 ailil_legacy_3_name: "Líderes Inspiradores"
 ailil_legacy_3_perk: "#flavor Nuestro gobierno inspirará a todos los demás; alguien tiene que marcar el estándar.#!"
 ailil_legacy_4_name: "Zalameros"
 ailil_legacy_4_perk: "#flavor Sabemos hablar con la gente, pues nuestra ambición exige que otros nos sigan.#!"
 ailil_legacy_5_name: "Ambición Desenfrenada"
 ailil_legacy_5_perk: "#flavor ¡Nuestro destino es la gloria y la victoria!#!"

 balor_legacy_track_name: "Legado Balor"
 balor_legacy_track_desc: "Casa del Miedo"
 balor_legacy_1_name: "Sangre Fomori"
 balor_legacy_1_perk: "#flavor No somos como los demás: llevamos sangre Fomori en las venas. Y ellos lo temerán.#!"
 balor_legacy_2_name: "Eliminar Toda Oposición"
 balor_legacy_2_perk: "[decision|E]: Obtén o gana [trait_level_track_xp|E] en el [trait|E] [GetTrait('reckless').GetName(GetNullCharacter)] o [GetTrait('aggressive_attacker').GetName(GetNullCharacter)].\n#flavor ¡Nadie se alzará ante nosotros. Todos morirán!#!"
 balor_legacy_3_name: "Absolutamente Despiadados"
 balor_legacy_3_perk: "#flavor La palabra «Despiadado» debería ser nuestro nombre, nuestro título.#!"
 balor_legacy_4_name: "Rey del Pavor"
 balor_legacy_4_perk: "#flavor Todos nos temerán, si no por la sangre de nuestras venas, por nuestro pasado.#!"
 balor_legacy_5_name: "Inclinaciones Unseelie"
 balor_legacy_5_perk: "$improve_ravaging$\n#flavor Unseelie es la única forma en que deberían vivir los Fae.#!"

 beaumayn_legacy_track_name: "Legado Beaumayn"
 beaumayn_legacy_track_desc: "Casa de los Profetas"
 beaumayn_legacy_1_name: "Ocultistas"
 beaumayn_legacy_1_perk: "Coste base de [gold|E] de la [activity|E] de [GetActivityType('activity_pilgrimage').GetName]: #P -50%#!.\n#flavor Conocemos lo oculto como nuestro propio pasado: nada permanecerá escondido.#!"
 beaumayn_legacy_2_name: "Don de la Profecía"
 beaumayn_legacy_2_perk: "#flavor El propio Ensueño nos ha concedido el don de la profecía; sabemos lo que viene.#!"
 beaumayn_legacy_3_name: "Presciencia"
 beaumayn_legacy_3_perk: "#flavor Nada de lo oculto permanecerá sin ser visto para nosotros.#!"
 beaumayn_legacy_4_name: "Inclinaciones Seelie"
 beaumayn_legacy_4_perk: "$improve_reverie$\n#flavor Seelie es la única forma en que deberían vivir los Fae.#!"
 beaumayn_legacy_5_name: "Maestros de lo Oculto"
 beaumayn_legacy_5_perk: "#flavor El propio Ensueño nos concederá una visión de lo oculto.#!"

 danaan_legacy_track_name: "Legado Danaan"
 danaan_legacy_track_desc: "Casa del Ensueño"
 danaan_legacy_1_name: "Exploradores de la Umbra"
 danaan_legacy_1_perk: "#flavor Conocemos la Umbra como la palma de nuestra mano.#!"
 danaan_legacy_2_name: "Sentido de la Umbra"
 danaan_legacy_2_perk: "#flavor Entender dónde se está en la Umbra es algo que todos sabemos.#!"
 danaan_legacy_3_name: "Pactos con las Quimeras"
 danaan_legacy_3_perk: "#flavor Las Quimeras del Ensueño son nuestras aliadas.#!"
 danaan_legacy_4_name: "Inclinaciones Seelie"
 danaan_legacy_4_perk: "$improve_reverie$\n#flavor Seelie es la única forma en que deberían vivir los Fae.#!"
 danaan_legacy_5_name: "Maestros de los Trods"
 danaan_legacy_5_perk: "Mejora la línea de [building|E] [GetBuilding('trods_02').GetName] duplicando el [modifier|E] de mantenimiento de [POD_chimera_maa|E].\n#flavor Sabemos usar los Trods de maneras que amplían enormemente su eficacia.#!"

 daireann_legacy_track_name: "Legado Daireann"
 daireann_legacy_track_desc: "Casa de la Pasión"
 daireann_legacy_1_name: "Alquimistas Bien Adiestrados"
 daireann_legacy_1_perk: "#flavor La pasión que hay tras la alquimia no nos es ajena.#!"
 daireann_legacy_2_name: "Cortesía Cortesana"
 daireann_legacy_2_perk: "#flavor Todo Fae sabe que la Corte de un Daireann es magnífica.#!"
 daireann_legacy_3_name: "Festejos Generosos"
 daireann_legacy_3_perk: "Obtén [GetModifier('POD_daireann_legacy_3_modifier').GetNameWithTooltip] tras una [activity|E] de [GetActivityType('activity_feast').GetName].\n#flavor La pasión de los banquetes es algo que organizamos con gran placer.#!"
 daireann_legacy_4_name: "No Hacer Daño"
 daireann_legacy_4_perk: "[decision|E]: Obtén o gana [trait_level_track_xp|E] en el [trait|E] [GetTrait('lifestyle_physician').GetName(GetNullCharacter)].\n#flavor Conocer la vida es participar de la mayor pasión que existe.#!"
 daireann_legacy_5_name: "Salvo a Quienes Harían Daño"
 daireann_legacy_5_perk: "$unlock_brewing_node$ [GetModifier('alchemy_antidepresants_2_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_aphrodisiac_3_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_poison_3_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_antibiotics_2_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ Añade un [modifier|E] que aumenta en 1 una [skill|E] aleatoria ([GetModifier('alchemy_stimulant_diplomacy_modifier').GetNameWithTooltip])\n#flavor El propio Ensueño nos ha revelado el misterio de las artes alquímicas.#!"

 dougal_legacy_track_name: "Legado Dougal"
 dougal_legacy_track_desc: "Casa del Trabajo"
 dougal_legacy_1_name: "Artesano Bien Adiestrado"
 dougal_legacy_1_perk: "#flavor Crear algo que puedas sostener y regodearte en su gloria es el mayor placer de la vida.#!"
 dougal_legacy_2_name: "Artesano Frugal"
 dougal_legacy_2_perk: "Reduce en un 25% los costes de oro de fabricación ([gold|E]).\n#flavor Sabemos recortar gastos sin afectar al resultado final.#!"
 dougal_legacy_3_name: "Herramientas de Calidad"
 dougal_legacy_3_perk: "[durability|E] base de los [artifacts|E] de Forja: #P +20#!.\n#flavor Un buen artesano es el que lleva buenas herramientas en su haber.#!"
 dougal_legacy_4_name: "Inclinaciones Seelie"
 dougal_legacy_4_perk: "$improve_reverie$\n#flavor Seelie es la única forma en que deberían vivir los Fae.#!"
 dougal_legacy_5_name: "Diligencia"
 dougal_legacy_5_perk: "#flavor Los miembros de la Casa Dougal son ampliamente conocidos como Trabajadores Diligentes, y esa reputación es algo que nos esforzamos mucho por mantener#!"

 eiluned_legacy_track_name: "Legado Eiluned"
 eiluned_legacy_track_desc: "Casa del Conocimiento"
 eiluned_legacy_1_name: "Búsqueda del conocimiento"
 eiluned_legacy_1_perk: "#flavor Aspiramos al conocimiento, no a las explicaciones como los pensadores mortales.#!"
 eiluned_legacy_2_name: "Cartas Cerca del Pecho"
 eiluned_legacy_2_perk: "#flavor Lo que sabemos no debe compartirse a la ligera,#!"
 eiluned_legacy_3_name: "Escudo del Conocimiento"
 eiluned_legacy_3_perk: "[banality_with_icon|E] obtenida de la Razón: #P -20%#!\n#flavor Nuestro conocimiento nos protegerá de la incredulidad.#!"
 eiluned_legacy_4_name: "Expertos en Magia"
 eiluned_legacy_4_perk: "Dificultad de [bunk_with_icon|E]: #P -20%#!.\n#flavor Las Artes Mágicas son algo de lo que los Eiluned sabemos mucho.#!"
 eiluned_legacy_5_name: "Estudios Hechiceros"
 eiluned_legacy_5_perk: "Como [character_interaction|E], elige un único sendero de [sorcery_lifestyle|E] para desbloquear.\n#flavor Los misterios de las magias mortales son inescrutables para nosotros, los Fae, pero eso no significa que no podamos replicar algunos de ellos.#!"
 POD_can_obtain_eiluned_dynasty_perk: "Necesitas [SCOPE.GetValue('required_arts')|V0] [traits|E] de Arte #weak ([THIS.Char.MakeScope.ScriptValue('POD_owned_arts_value')|0])#!"

 fiona_legacy_track_name: "Legado Fiona"
 fiona_legacy_track_desc: "Casa del Amor"
 fiona_legacy_1_name: "Pasión Ilimitada"
 fiona_legacy_1_perk: "#flavor Ser Fiona es amar y ser amado.#!"
 fiona_legacy_2_name: "Amor del Pueblo"
 fiona_legacy_2_perk: "#flavor Incluso los mortales más banales nos mostrarán afecto: eso es lo que nos prometió el Ensueño.#!"
 fiona_legacy_3_name: "Juergas Constantes"
 fiona_legacy_3_perk: "Coste de las opciones de la [activity|E] de [GetActivityType('activity_feast').GetName] reducido en: #P 50%#!.\n#flavor Sabemos lo que significa disfrutar de las fiestas: ¡al fin y al cabo, lo hacemos todo el tiempo!#!"
 fiona_legacy_4_name: "Luchar por la Gloria"
 fiona_legacy_4_perk: "[decision|E]: Obtén o gana [trait_level_track_xp|E] en el [trait|E] [GetTrait('reckless').GetName(GetNullCharacter)].\n#flavor Luchamos por la gloria y moriremos por ella.#!"
 fiona_legacy_5_name: "Amor de Todos"
 fiona_legacy_5_perk: "#flavor Conocernos es amarnos.#!"
 POD_can_obtain_fiona_dynasty_perk_soulmate: "Necesitas al menos #V 1#! [soulmate|E]"
 POD_can_obtain_fiona_dynasty_perk_lovers: "Necesitas al menos [SCOPE.GetValue('required_lovers')|V0] [Concept( 'lover', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_lovers'), '(CFixedPoint)1' ), 'game_concept_lover', 'game_concept_lovers' ) )|E]"

 gwydion_legacy_track_name: "Legado Gwydion"
 gwydion_legacy_track_desc: "Casa de los Nobles"
 gwydion_legacy_1_name: "Control de la Tierra"
 gwydion_legacy_1_perk: "#flavor Ser un buen gobernante es difícil, pero es nuestro deber.#!"
 gwydion_legacy_2_name: "Tierras Prósperas"
 gwydion_legacy_2_perk: "#flavor ¡La tierra bajo nuestro mando prosperará!#!"
 gwydion_legacy_3_name: "Admiración de los Vasallos"
 gwydion_legacy_3_perk: "#flavor Nadie puede gobernar imperios por sí solo; saber subdividir el gobierno es algo que todo buen gobernante debe saber.#!"
 gwydion_legacy_4_name: "Nacido para Gobernar"
 gwydion_legacy_4_perk: "#flavor Los Gwydion estamos destinados a gobernar. ¡Tal es el decreto del Ensueño!#!"
 gwydion_legacy_5_name: "Frutos de un Gobierno Justo"
 gwydion_legacy_5_perk: "#flavor Todas las cosas buenas deberían al final volver a nosotros.#!"
 POD_can_obtain_gwydion_dynasty_perk_vassal: "Necesitas al menos [SCOPE.GetValue('required_vassals')|V0] [Concept( 'vassal', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_vassals'), '(CFixedPoint)1' ), 'game_concept_vassal', 'game_concept_vassals' ) )|E]"
 POD_can_obtain_gwydion_dynasty_perk: "Necesitas al menos [SCOPE.GetValue('required_ruler_friends')|V0] [Concept( 'friend', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_ruler_friends'), '(CFixedPoint)1' ), 'game_concept_friend', 'game_concept_friends' ) )|E] que [Select_CString( EqualTo_CFixedPoint( SCOPE.GetValue('required_ruler_friends'), '(CFixedPoint)1' ), 'sea un', 'sean' )] [Concept( 'independent_ruler', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_ruler_friends'), '(CFixedPoint)1' ), 'game_concept_independent_ruler', 'game_concept_independent_rulers' ) )|E] #weak ([SCOPE.GetValue('independent_ruler_friends')|0])#!"

 leanhaun_legacy_track_name: "Legado Leanhaun"
 leanhaun_legacy_track_desc: "Casa de los Artistas Malditos"
 leanhaun_legacy_1_name: "Patronos de los Grandes"
 leanhaun_legacy_1_perk: "Coste de [gold|E] o [prestige|E] para reclutar a una Gran Persona: #P -25%#!\n#flavor Los grandes artistas y mortales deberían ser recompensados por su trabajo, aunque sea solo para darnos más Glamour.#!"
 leanhaun_legacy_2_name: "Los Mejores Amigos"
 leanhaun_legacy_2_perk: "Desbloquea la [scheme|E] de [GetScheme('befriend').GetTypeName].\nTodos tus [friends|E] obtendrán el [modifier|E] [GetModifier('POD_leanhaun_legacy_2_modifier').GetNameWithTooltip].\n#flavor Sabemos lo que significa ser amigo de alguien.#!"
 leanhaun_legacy_3_name: "Saber Hacer Mortal"
 leanhaun_legacy_3_perk: "Mejora [GetDynastyPerk('leanhaun_legacy_2').GetName] otorgando en su lugar [GetModifier('POD_leanhaun_legacy_3_modifier').GetNameWithTooltip].\n#flavor Las mentes mortales no son un misterio para nosotros.#!"
 leanhaun_legacy_4_name: "Influyentes Culturales"
 leanhaun_legacy_4_perk: "#P +25%#! Velocidad de Conversión de Cultura.\n#flavor Guiar a la humanidad en la dirección que deseas es difícil, pero es algo que los Leanhaun dominamos.#!"
 leanhaun_legacy_5_name: "Inclinaciones Unseelie"
 leanhaun_legacy_5_perk: "$improve_ravaging$\n#flavor Unseelie es la única forma en que deberían vivir los Fae.#!"
 POD_can_obtain_leanhaun_dynasty_perk_friends: "Necesitas al menos [SCOPE.GetValue('required_friends')|V0] [Concept( 'friend', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_friends'), '(CFixedPoint)1' ), 'game_concept_friend', 'game_concept_friends' ) )|E]"
 POD_can_obtain_fiona_dynasty_perk_great_person_relation: "Debes tener una [relation|E] positiva con al menos [SCOPE.GetValue('required_great_person_relation')|V0] #TOOLTIP:GAME_TRAIT,historical_character,[GetNullCharacter] #L [Select_CString( EqualTo_CFixedPoint( SCOPE.GetValue('required_great_person_relation'), '(CFixedPoint)1' ), 'Gran Persona', 'Grandes Personas' )]#!#! #weak ([SCOPE.GetValue('great_relations')|0])#!"

 liam_legacy_track_name: "Legado Liam"
 liam_legacy_track_desc: "Casa de los Mortales"
 liam_legacy_1_name: "Aliados contra la Banalidad"
 liam_legacy_1_perk: "Velocidad de [journey|E] de #V $glamour_quests_name$#!: #P +50%#!\n#flavor Todos estamos bajo el ataque de la incredulidad, ¡pero no estamos indefensos!#!"
 liam_legacy_2_name: "Contactos de Abajo"
 liam_legacy_2_perk: "#flavor Los contactos son algo estupendo, sin importar de dónde procedan.#!"
 liam_legacy_3_name: "Mayores Enemigos de la Banalidad"
 liam_legacy_3_perk: "Duplica la [banality|E] perdida por las Búsquedas de Glamour.\n#flavor Ser Liam es ser el faro en la lucha contra la propia Banalidad.#!"
 liam_legacy_4_name: "Adoración Mortal"
 liam_legacy_4_perk: "#flavor ¡Todos los mortales nos amarán!#!"
 liam_legacy_5_name: "Inclinaciones Seelie"
 liam_legacy_5_perk: "$improve_reverie$\n#flavor Seelie es la única forma en que deberían vivir los Fae.#!"
 POD_can_obtain_liam_dynasty_perk_total_epiphanies_quality: "Tus [relations|E] deben tener una [epiphanies_quality|E] combinada de al menos [SCOPE.GetValue('required_total_epiphanies_quality')|V0] #weak ([GetPlayer.MakeScope.ScriptValue('total_epiphanies_quality')|0])#!"

 scathach_legacy_track_name: "Legado Scathach"
 scathach_legacy_track_desc: "Casa de la Batalla"
 scathach_legacy_1_name: "Inflexible"
 scathach_legacy_1_perk: "#flavor ¡No cederemos! ¡No nos rendiremos!#!"
 scathach_legacy_2_name: "Maestros del Sigilo"
 scathach_legacy_2_perk: "#flavor Las sombras de la corte: no seremos vistos.#!"
 scathach_legacy_3_name: "Comandantes Renombrados"
 scathach_legacy_3_perk: "[decision|E]: Obtén o gana [trait_level_track_xp|E] en un único [commander_trait|E].\n#flavor Conocemos todas las clases de guerra.#!"
 scathach_legacy_4_name: "Atacantes Implacables"
 scathach_legacy_4_perk: "#flavor ¡Adelante! ¡Hacia la gloria y la victoria!#!"
 scathach_legacy_5_name: "Duelistas Versátiles"
 scathach_legacy_5_perk: "#flavor El arte del duelo es algo que comprendemos muy a fondo.#!"
 POD_can_obtain_scathach_dynasty_perk_knight_prowess: "La [prowess|E] total de tus [knights|E] debe superar [SCOPE.GetValue('required_knight_prowess')|V0] #weak ([SCOPE.GetValue('total_knight_prowess')|0])#!"

 varich_legacy_track_name: "Legado Varich"
 varich_legacy_track_desc: "Casa de los Patrones"
 varich_legacy_1_name: "Apuestas Predictivas"
 varich_legacy_1_perk: "#flavor El propio Ensueño nos ha dado el poder de predecir resultados.#!"
 varich_legacy_2_name: "Presciencia"
 varich_legacy_2_perk: "#flavor Sabemos cosas que la mayoría no debería saber.#!"
 varich_legacy_3_name: "Predicción del Futuro"
 varich_legacy_3_perk: "#flavor Podemos ver lo que nos aguarda.#!"
 varich_legacy_4_name: "Futuro Claro"
 varich_legacy_4_perk: "#flavor Nuestra visión del futuro es verdaderamente magnífica.#!"
 varich_legacy_5_name: "Inclinaciones Unseelie"
 varich_legacy_5_perk: "$improve_ravaging$\n#flavor Unseelie es la única forma en que deberían vivir los Fae.#!"
 POD_can_obtain_varich_dynasty_perk_no_sluagh: "No puede haber [vassals|E] [GetTrait('sluagh').GetName(GetPlayer)] en tu [realm|E]"

 inanimae_legacy_track_name: "Legado Inanimae"
 inanimae_legacy_track_desc: "Nacidos de los Elementos"
 inanimae_legacy_1_name: "Nacida del Fuego"
 inanimae_legacy_1_perk: "Cada [nemesis|E], [best_friend|E] y [soulmate|E] mejora o da un [modifier|E] que otorga #P +0.75#! de [prestige|E] y #P +0.2#! de [dynasty_prestige|E].\n#flavor Todos procedemos del fuego del pensamiento humano...#!"
 inanimae_legacy_2_name: "Moldeados por el Viento"
 inanimae_legacy_2_perk: "#flavor ...Moldeados por los vientos de la imprevisibilidad del Ensueño...#!"
 inanimae_legacy_3_name: "Nutridos por el Agua"
 inanimae_legacy_3_perk: "[decision|E]: Obtén o gana [trait_level_track_xp|E] en el [trait|E] [GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)] o [GetTrait('lifestyle_physician').GetName(GetNullCharacter)].\n#flavor ...Nutridos por el agua que fluye de la propia realidad mundana...#!"
 inanimae_legacy_4_name: "Endurecidos por la Piedra"
 inanimae_legacy_4_perk: "#flavor ...Endurecidos por ella...#!"
 inanimae_legacy_5_name: "Para Poder Crecer"
 inanimae_legacy_5_perk: "$cantrip_hard_bunk$ Resucita a un $POD_splat_wraith$ como $POD_splat_mortal$\n$cantrip_hard_bunk$ Otorga [GetModifier('cantrip_renewal_modifier').GetNameWithTooltip] a todos los [counties|E] [de_jure|E] de un [title|E]\n$cantrip_hard_bunk$ Restaura por completo la [durability|E] de un [artifact|E]\n#flavor ...Pero aun así, seguiremos creciendo hacia el futuro.#!"

 POD_can_obtain_inanimae_dynasty_perk_friends: "Necesitas al menos [SCOPE.GetValue('required_friends')|V0] [Concept( 'friend', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_friends'), '(CFixedPoint)1' ), 'game_concept_friend', 'game_concept_friends' ) )|E] #weak ([THIS.Char.MakeScope.ScriptValue('POD_num_of_friends')|0])#!"
 POD_can_obtain_inanimae_dynasty_perk_lovers: "Necesitas al menos [SCOPE.GetValue('required_lovers')|V0] [Concept( 'lover', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_lovers'), '(CFixedPoint)1' ), 'game_concept_lover', 'game_concept_lovers' ) )|E] #weak ([THIS.Char.MakeScope.ScriptValue('POD_num_of_lovers')|0])#!"
 POD_can_obtain_inanimae_dynasty_perk_income: "Tus ingresos mensuales deben superar [SCOPE.GetValue('required_income')|V0] #weak ([GetPlayer.MakeScope.ScriptValue('POD_monthly_character_income')|2])#!"
 POD_can_obtain_inanimae_dynasty_perk_poi_visited: "Necesitas visitar al menos [SCOPE.GetValue('required_visited_poi')|V0] [Concept( 'point_of_interest', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_visited_poi'), '(CFixedPoint)1' ), 'game_concept_point_of_interest', 'game_concept_points_of_interest' ) )|E] #weak ([GetPlayer.MakeScope.ScriptValue('poi_visited')])#!"
 POD_can_obtain_inanimae_dynasty_perk_secrets_known: "Necesitas conocer al menos [SCOPE.GetValue('required_secrets_known')|V0] [Concept( 'secret', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_secrets_known'), '(CFixedPoint)1' ), 'game_concept_secret', 'game_concept_secrets' ) )|E] #weak ([SCOPE.GetValue('secrets_known')|0])#!"
 POD_can_obtain_inanimae_dynasty_perk_mortal_relations: "Necesitas tener al menos [SCOPE.GetValue('required_mortal_relations')|V0] [Concept( 'relation', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_mortal_relations'), '(CFixedPoint)1' ), 'game_concept_relation', 'game_concept_relations' ) )|E] con $POD_splat_mortal$ #weak ([SCOPE.GetValue('mortal_relations')|0])#!"

 common_fae_legacy_track_name: "Pueblo Feérico"
 common_fae_legacy_track_desc: "Del Ensueño en el Mundo Otoñal"
 common_fae_legacy_1_name: "Soñando en el Mundo Otoñal"
 common_fae_legacy_1_perk: "#flavor Incluso en el Mundo Otoñal, seguimos soñando con un mundo mejor.#!"
 common_fae_legacy_2_name: "Magos del Ensueño"
 common_fae_legacy_2_perk: "#flavor Por lo que el Mundo Otoñal nos arrebató, persistimos en traer magia a este lugar.#!"
 common_fae_legacy_3_name: "Superar las Limitaciones Otoñales"
 common_fae_legacy_3_perk: "[GetPlayer.Custom('PODFaeLegacyInanimaeBanality')].\n#flavor El Mundo Otoñal es duro para nosotros, pero aun así seguimos existiendo.#!"
 PODFaeLegacyInanimaeBanality_inanimae: "Recupera 1 de Glamour al fallar un [cantrip|E]"
 PODFaeLegacyInanimaeBanality_banality: "Ya no obtienes [banality|E] por fallar un [cantrip|E]"
 common_fae_legacy_4_name: "Fieles a Nuestra Naturaleza"
 common_fae_legacy_4_perk: "Mejora [revelry|E] duplicando el Glamour obtenido.\n#flavor Por encima de todo lo demás, somos Fae.#!"
 common_fae_legacy_5_name: "Reconocidos por el Ensueño"
 common_fae_legacy_5_perk: "[GetPlayer.Custom('PODFaeLegacyNobleHouse')]\nElimina el mantenimiento de los Exploradores de la [umbra|E] [grace_i].\n@grace_icon![umbra_sense|E]: #P +20%#!\n#flavor ¡Bañados en la gloria del Ensueño, seremos nobles!#!"
 PODFaeLegacyNobleHouse_noble: "Requisitos adicionales para los [dynasty_perks|E] Fae: #P -30%#!."
 PODFaeLegacyNobleHouse_commoner: "Desbloquea el [Concept('decision', 'Objetivo')|E] para formar tu propia Casa Noble."

 fae_loved_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_loved_legacy_track_desc: "Casa amada por el Ensueño"
 fae_loved_legacy_1_name: "Amados dondequiera que vamos..."
 fae_loved_legacy_1_perk: "#flavor Amados por el Ensueño, amados por todos los demás.#!"
 fae_loved_legacy_2_name: "...Especialmente por nuestros vasallos"
 fae_loved_legacy_2_perk: "#flavor Como nuestros vasallos proceden del Ensueño, ellos también nos aman.#!"
 fae_loved_legacy_3_name: "Maestros de la multitarea"
 fae_loved_legacy_3_perk: "#flavor ¿Qué es un buen amigo, si no uno que sabe hacer multitarea con sus relaciones?#!"
 fae_loved_legacy_4_name: "Los Mejores Amigos"
 fae_loved_legacy_4_perk: "#flavor Poder mantener muchas relaciones es nuestro orgullo.#!"
 fae_loved_legacy_5_name: "El Más Amado entre los Amados"
 fae_loved_legacy_5_perk: "#flavor Por encima de todo lo demás, nos ama el propio lugar de donde venimos.#!"

 fae_warriors_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_warriors_legacy_track_desc: "Comandantes del Ensueño"
 fae_warriors_legacy_1_name: "Gloria del Ensueño"
 fae_warriors_legacy_1_perk: "Obtén [prestige|E] de las [wars|E] ganadas, con una cantidad basada en el rango de [title|E] más alto.\n#flavor ¡Por la Gloria, por el Ensueño!#!"
 fae_warriors_legacy_2_name: "Pero no estamos solos"
 fae_warriors_legacy_2_perk: "#flavor No nos ciega nuestra misión: tenemos aliados dentro de nuestra especie.#!"
 fae_warriors_legacy_3_name: "Pues nuestras pretensiones son justas"
 fae_warriors_legacy_3_perk: "Coste de [casus_belli|E]: #P -30%#!\n#flavor Pues somos el Ensueño, somos justos#!"
 fae_warriors_legacy_4_name: "Expandir Nuestro Dominio"
 fae_warriors_legacy_4_perk: "Desbloquea el [casus_belli|E] #V $invasion_war$#!.\nReduce el enfriamiento de #V $invasion_war$#! de #N 100#! años a #P 50#! años.\n#flavor Expandir lo que el Ensueño puede influir con facilidad es nuestra misión.#!"
 fae_warriors_legacy_5_name: "Los Mayores Guerreros del Ensueño"
 fae_warriors_legacy_5_perk: "#flavor ¡Pues somos comandantes del Ensueño, en pos de la victoria!#!"

 fae_respected_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_respected_legacy_track_desc: "Siguiendo el camino del Rey Arturo"
 fae_respected_legacy_1_name: "Verdaderos Reyes"
 fae_respected_legacy_1_perk: "#flavor Somos reyes y nuestra fama se extenderá.#!"
 fae_respected_legacy_2_name: "Vasallos Leales"
 fae_respected_legacy_2_perk: "#flavor Nuestros vasallos conocen su lugar y nos ayudan como deben.#!"
 fae_respected_legacy_3_name: "Maestros en la Gestión del Dominio"
 fae_respected_legacy_3_perk: "Mejora en #P 20#! la [aptitude|E] de [GetCourtPositionType('imperial_envoy_court_position').GetName()], [GetCourtPositionType('imperial_chancellor_court_position').GetName()] y [GetCourtPositionType('imperial_minister_court_position').GetName()].\n#flavor Sabemos gobernar y cómo gestionar un dominio grande.#!"
 fae_respected_legacy_4_name: "La Más Impresionante de las Cortes"
 fae_respected_legacy_4_perk: "[GetPlayer.Custom('PODFaeLegacyRoyalCourt')].\n#flavor La corte del rey es lo que muestra al mundo su poder; no podemos quedarnos atrás.#!"
 PODFaeLegacyRoyalCourt_court_amenities: "Coste de [court_amenities|E]: #P -50%#!"
 PODFaeLegacyNobleHouse_invite_buff: "Aceptación de invitación a la [court|E]: #P +20#!"
 FAE_RESPECTED_LEGACY_4: "[GetDynastyPerk('fae_respected_legacy_4').GetName]: $VALUE|=+0$"
 fae_respected_legacy_5_name: "Emperadores entre Reyes"
 fae_respected_legacy_5_perk: "#flavor Pues somos los reyes. No del Ensueño, ¡sino de todo lo que le pertenece!#!"

 fae_feared_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_feared_legacy_track_desc: "Casa temida por los Pródigos"
 fae_feared_legacy_1_name: "Fabricantes Expertos"
 fae_feared_legacy_1_perk: "Velocidad de la [councillor_task|E] de [fabricate_claim|E]: #P +50%#! más rápida\n#flavor La fabricación es una forma de empeño creativo y nos gusta mucho entregarnos a ella.#!"
 fae_feared_legacy_2_name: "Fama Estridente"
 fae_feared_legacy_2_perk: "Obtén [prestige|E] por torturar [characters|E], con una cantidad basada en el rango de la víctima.\n#flavor Pues sabemos que los gritos pueden transmitir el conocimiento de lo que podemos hacer a los enemigos del Ensueño.#!"
 fae_feared_legacy_3_name: "Gloria del Miedo"
 fae_feared_legacy_3_perk: "#flavor El miedo puede convertir incluso a un pequeño conde en una amenaza mayor.#!"
 fae_feared_legacy_4_name: "Expertos en Intrigar"
 fae_feared_legacy_4_perk: "#flavor Sabemos algo de intrigar, pues es nuestro deber.#!"
 fae_feared_legacy_5_name: "El Más Temido entre los Pródigos"
 fae_feared_legacy_5_perk: "#flavor Pues somos el coco de los Pródigos.#!"

 fae_wise_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_wise_legacy_track_desc: "Casa de los Sabios"
 fae_wise_legacy_1_name: "Eruditos de los Nombres"
 fae_wise_legacy_1_perk: "Obtén #P 200#! de [piety|E] y #P 200#! de [prestige|E] al aprender un nuevo idioma\n#flavor Los idiomas tienen peso, un peso que debemos conocer.#!"
 fae_wise_legacy_2_name: "Magos Expertos"
 fae_wise_legacy_2_perk: "#flavor Los Fae sabios saben que el poder no puede ignorarse.#!"
 fae_wise_legacy_3_name: "Estudiar las Vías de los Soñadores"
 fae_wise_legacy_3_perk: "Como [character_interaction|E], elige un [lifestyle|E] base que recibirá 100 de experiencia cada año.\n#flavor Los soñadores saben cosas, cosas que también podemos saber nosotros.#!"
 fae_wise_legacy_4_name: "Maestros en el Aprendizaje"
 fae_wise_legacy_4_perk: "#flavor Los Pródigos tardamos en adaptarnos, en aprender. Pero eso puede cambiar.#!"
 fae_wise_legacy_5_name: "El Más Sabio entre los Sabios"
 fae_wise_legacy_5_perk: "#flavor Pues llevamos el conocimiento del Ensueño.#!"

 fae_mighty_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_mighty_legacy_track_desc: "Los Guardias del Ensueño"
 fae_mighty_legacy_1_name: "Gloria Caballeresca"
 fae_mighty_legacy_1_perk: "#flavor Somos Caballeros del Ensueño y nuestros caballeros son tan importantes como nosotros.#!"
 fae_mighty_legacy_2_name: "Grito de batalla"
 fae_mighty_legacy_2_perk: "Al inicio de una [war|E], aplica el [modifier|E] [GetModifier('POD_dynasty_battle_cry_modifier').GetNameWithTooltip] a todos los [knights|E] aliados durante 5 años.\n#flavor «¡Por el Ensueño!», ¡gritamos por la gloria!#!"
 fae_mighty_legacy_3_name: "Maestros de la Espada"
 fae_mighty_legacy_3_perk: "[decision|E]: Obtén o gana [trait_level_track_xp|E] en el [trait|E] [GetTrait('lifestyle_blademaster').GetName(GetPlayer)].\n#flavor Conocemos las vías de la espada, pues la necesitamos para guardar el Ensueño.#!"
 fae_mighty_legacy_4_name: "Poderosos Compañeros"
 fae_mighty_legacy_4_perk: "Todos los miembros de la [coterie|E] obtendrán el [modifier|E] [GetModifier('POD_dynasty_mighty_companions_modifier').GetNameWithTooltip] mientras no se marchen.\n#flavor Un solo Fae no puede defender todo el Ensueño, pero ¿quién dijo que estamos solos?#!"
 fae_mighty_legacy_5_name: "Los Más Poderosos de los Fae"
 fae_mighty_legacy_5_perk: "#flavor Pues somos los Guardianes del Ensueño.#!"