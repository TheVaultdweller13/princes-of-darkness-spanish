l_spanish:
 LOADING_TIP_0: "#high \"El erudito romano Séneca se equivocaba. El dominio injusto puede ser eterno\". #! - Hardestadt"
 LOADING_TIP_1: "#high Caín no puede ser diabolizado. Lo sentimos.#!"
 LOADING_TIP_2: "#high Los vampiros Antiguos lo son por una razón. No caerán ante una intriga mal preparada.#!"
 LOADING_TIP_3: "#high Cuida la Mascarada. No querrías enfurecer a la Iglesia.#!"
 LOADING_TIP_4: "#high Este es el Mundo de Tinieblas. No tienes amigos, solo peones.#!"
 LOADING_TIP_5: "#high Tendrás un dominio muy limitado y necesitarás vasallos. No confíes en ellos.#!"
 LOADING_TIP_6: "#high Para estar seguro, espera que todo el mundo esté conspirando para tu fin. Probablemente lo estén haciendo de todos modos.#!"
 LOADING_TIP_7: "#high \"Siempre hay un sire para dirigirnos, y un sire más allá de él, y así hasta llegar a Caín. No hay 'destino' que puedas elegir, salvo el que tus maestros te permitan\". #! - Montano"
 LOADING_TIP_8: "#high \"Sin mí no habría Sabbat. Y sin el Sabbat no habría Camarilla. Todo el rostro de la sociedad cainita es lo que es gracias a mí\". #! - Gratiano, delirando"
 LOADING_TIP_9: "#high \"Cada problema menor es como un grano de arena; cada noche heredo el desierto\". #! - Lacroix"
 LOADING_TIP_10: "#high \"Fui reina del mundo una vez, y lo seré de nuevo, te lo prometo. Ahora tienes mi permiso para morir\". #! - Petaniqua"
 LOADING_TIP_11: "#high \"No somos dioses, no importa lo que nos digamos a nosotros mismos. No hay Divinidad. El corazón del universo está vacío. ¿Caminarás a través de él conmigo?\". #! - Kemintiri"
 LOADING_TIP_12: "#high \"Un alma es solo otro trozo de arcilla para ser retorcido entre tus dedos\". #! - Sascha Vykos"
 LOADING_TIP_13: "#high \"Los finales y los principios tienen una forma de mezclarse y retorcerse hasta que es difícil separar uno del otro\". #! - Anatole" #CN DA Lasombra p231
 LOADING_TIP_14: "#high \"Eres un vampiro grande y malo. Oye, genial, felicidades. Ahora guárdatelo para ti\". #! - Jack el Sonriente"
 LOADING_TIP_15: "#high \"Si no tienes más remedio que destruir a un Nosferatu, no lo enfrentes, bajo ninguna circunstancia, en su territorio natal.\nNunca encontraremos tus cenizas\". #! - al-Ashrad"  #CB Ass Rev p62
 LOADING_TIP_16: "#high \"Entiende esto, no perdimos contra los Ventrue. Perdimos contra los Ventrue y todos sus aliados y sus sirvientes y sus amigos y cada pobre hijo de perra campesino que cometió el error de hacer contacto visual con su señor inmortal. Ahora ya sabes dónde reside la verdadera fuerza de los Ventrue\". #! - Lydia Dorn"
 LOADING_TIP_17: "#high \"Nunca, nunca, nunca subestimes a los Lasombra. Son los Ventrue sin la fragilidad moral. Son los Tremere sin las pretensiones. Son los Setitas sin el postureo... y no son ninguna de esas cosas\". #! - Fatima al-Faqadi"
 LOADING_TIP_18: "#high \"No existe tal cosa como la independencia en la Yihad. Solo existe una falta de conciencia de los propios maestros\". #! - ur-Shulgi"
 LOADING_TIP_19: "#high \"Nunca cometas el error de enfrentarte a un Setita en su propio campo de batalla, el de lo social y lo político. No notarás los colmillos hasta que estén en tu garganta\". #! - Sukainah"
 LOADING_TIP_20: "#high \"Vaya, me alegro de no haber sido abrazado en el Clan Tremere. Qué pesadilla burocrática y mezquina. Sin ofender. Es solo que estar sentado durante décadas esperando mi turno para llegar a ser el ayudante junior de nadie (de segunda clase) simplemente no me atrae\". #! - Felton"
 LOADING_TIP_21: "#high \"Estas tres cosas nunca debe hacer un Príncipe, si pretende prosperar. Enfurecer a los Brujah. Avergonzar a los Ventrue. Ignorar a los Nosferatu\".#! - desconocido"
 LOADING_TIP_22: "#high \"No apuestes con la Bestia, porque al final siempre gana\". #! - desconocido"
 LOADING_TIP_23: "#high \"Algunos temen abiertamente a los Antediluvianos y temen secretamente a los mortales. Otros temen abiertamente a los mortales y temen secretamente a los Antediluvianos. Ambos temores son exagerados. Se puede sobrevivir a la Gehena. Podemos gobernar para siempre\". #! - Mithras"
 LOADING_TIP_24: "#high \"No soy un esclavo. No soy un esclavo. No soy un esclavo.\nEso es lo que él me dijo que me dijera a mí mismo\". #! - Lambach"
 LOADING_TIP_25: "#high \"Siempre habrá otra Gehena que buscar, Beckett. Nuestras mentes las inventan. Deberías bajarte de esa rueda en particular; gira eternamente\". #! -Drácula"
 LOADING_TIP_26: "#high \"Había elegido ciegamente recorrer el camino que mi sire puso ante mí. Nunca dudé de ello durante siglos, hasta que me di cuenta de la burla hueca de alma que me había dado, de lo poco que servía para complacerme, para entenderme verdaderamente a mí mismo.\nJuré, esa noche, no sufrir más\". #! - Titus Venturus Camilla"
 LOADING_TIP_27: "#high \"Cree, Tremere, si te place hacerlo, que tú y los tuyos sabéis más de magia de sangre que alguien que la dominó antes del surgimiento de Sumeria. Pero te digo ahora: tu Clan no le hizo nada al mío que nosotros no permitiéramos\".#! - Tegyrius"
 LOADING_TIP_28: "#high \"Llega un momento, Ventrue, en que el juego juega a los jugadores\". #! - Izhim ur-Baal"
 LOADING_TIP_29: "#high \"Viajé a la tierra de nuestros ancestros y me enfrenté al heraldo. Es oscuro y terrible: la furia de vuestro cielo y el fuego de vuestro infierno. Negro e impenetrable como la noche más oscura\". #! - Thetmes"
 LOADING_TIP_30: "#high \"Las estrellas también eran de hueso, aunque no meros adornos; eran los huesos de ur-Shulgi, visibles donde la piel de medianoche se había pelado o agrietado y caído; eran las vainas de la esencia del heraldo, y su médula era la venganza\".#!"
 LOADING_TIP_31: "#high \"Estamos luchando por nuestras vidas aquí, pero los Ventrue y los Tremere todavía tienen que mearse en los zapatos del otro cada vez que tienen oportunidad, y todo lo que los Toreador quieren hacer es criticar el color del chorro\". #! - Theo Bell"
 LOADING_TIP_32: "#high \"El mundo se está yendo a la mierda, pero tenemos un trabajo que hacer\".#! - Theo Bell"
 LOADING_TIP_33: "#high \"Las viejas ideas pueden rejuvenecer. Cartago, el ideal, es viejo y nuevo otra vez\". #! - Critias"
 LOADING_TIP_34: "#high \"Cada vez que arranco una mandíbula de un cráneo y la clavo en una cuenca ocular, sé que estoy construyendo un futuro mejor\". #! - Jack el Sonriente"
 LOADING_TIP_35: "#high \"Solo hay una forma de sobrevivir a la oscuridad: haz que te tema\". #! - Jack el Sonriente"
 LOADING_TIP_36: "#high \"Tú no encontraste la revolución, chico. La revolución te encontró a ti\". #! - Tyler"
 LOADING_TIP_37: "#high \"Todo lo que está muerto lleva los ecos de la vida. Todo lo que vive oye la llamada de su muerte\". #! - Constancia"
 LOADING_TIP_38: "#high \"Podemos odiar en abundancia, y no tenemos un sujeto más adecuado para nuestro odio que nosotros mismos. Así que nos levantamos cada noche porque no queremos odiarnos más de lo que ya lo hacemos. Pero vamos a fallar incluso en eso\". #! - Chas Giovanni Tello"
 LOADING_TIP_39: "#high \"A lo largo de la historia y antes, los dioses de la noche han exigido sangre y carne a la humanidad. Estos son nuestros sires. Tú eres Ártemis. Tú eres Ahrimán. Eres la diosa del volcán de Catal Huyuk y Tezcatlipoca, el dios azteca del espejo humeante. Una oscuridad tan espesa que oscurece el sol\". #! - Demba Makemba Adoula"
 LOADING_TIP_40: "#high \"Deja que se queden boquiabiertos de asombro, Myca. Deja que me maldigan por abandonar la lucha contra la Gehena en sus términos. Deja que me llamen traidora, que me pongan en su absurda Lista Roja, que me maldigan por cobarde y tonta egoísta. Estoy harta de jugar al juego que el mundo ha puesto ante mí\". #! - Lucita de Aragón"
 LOADING_TIP_41: "#high \"Los vampiros son la apoteosis del pecado, la encarnación de la virtud violada y arruinada. Con esto, demuestras tu valía\". #! - Francisco Domingo de Polonia"
 LOADING_TIP_42: "#high \"Nosotros, los jóvenes, hablábamos a menudo por la mañana temprano, justo antes del sueño, sobre la conveniencia de nuevas oportunidades. Lo que distinguió a Gratiano fue que se atrevió a actuar en consecuencia\". #! - Hermano Oso"
 LOADING_TIP_43: "#high \"Tengo la intención de barrer las piezas del tablero... No solo libre de las Sectas, sino de la guerra eterna. Fui manipulado por mi sire y por Vykos. Su Cruzada nunca será la mía. Lucharé contra la llamada de cualquier forma que pueda. Beberé hasta saciarme de sangre espesa y seguiré siendo libre y, al final, la Yihad será rota por mí y por otros como yo\". #! - Lucius Aelius Sejanus"
 LOADING_TIP_44: "#high \"Es una lástima que la mayoría de las piezas tuvieran que ser barridas del tablero\". #! - Ambrosio Luis Moncada"
 LOADING_TIP_45: "#high \"Esta existencia puede ser una diversión gloriosa, si lo permites\". #! - Helena de Troya"
 LOADING_TIP_46: "#high \"Abandonamos la Ciudad Eterna porque su corazón hace tiempo que dejó de latir. Muere – y vosotros, los señores de una ciudad antaño gloriosa, os escondéis en sus sombras, perdidos en un laberinto de vuestra propia construcción. Cuando los de nuestra clase miren atrás a estos tiempos, verán vuestros logros y se preguntarán qué salió mal. Pero nunca, mientras os ocultáis, sabrán quién fue el responsable, a quién debe dirigirse el elogio o la condena. Vuestros actos se perderán para la posteridad, y todo lo que os llamarán será Incógnitos\". #! - Último discurso de Miguel a los cainitas de Roma en vísperas de su partida"
 LOADING_TIP_47: "#high \"La verdad no tiene una sola forma, ni un solo símbolo. Todos los ojos la ven de forma diferente. Todas las lenguas la hablan de forma diferente. Nada – nada – existe inalterado para siempre. Ni siquiera nosotros\". #! - el Dragón"
 LOADING_TIP_48: "#high \"Es casi cierto que no puede morir. Mientras exista uno de su sangre, él existe. Mientras el mundo no caiga en cenizas, puede volver a recomponerse\". #! - el Dragón sobre Tzimisce"
 LOADING_TIP_49: "#high \"Yo mismo. Metamorfosis. Ascensión. Yo soy el que soy. Soy la tierra, despertada por la sangre. Ya no soy una larva. La etapa pupal termina, para mí y para los demás\". #! - Tzimisce"
 LOADING_TIP_50: "#high \"Ha olvidado cómo ser gentil... e incluso yo no puedo decir si comprende, o recuerda, lo frágiles que somos ya\". #! - Damek Ruthven sobre Tzimisce"
 LOADING_TIP_51: "#high \"Sírveme. Realmente no tienes ningún amor por los Antediluvianos, ¿verdad? El día de la Gehena se acerca, y pretenden consumirte a ti, a tus amigos y a todos los demás vampiros. ¡Yo lo impediré! ¡Te daré la eternidad! ¡Vida eterna! ¡Recibiremos a los abuelos que despiertan con otra inundación, un diluvio de su propia sangre!\". #! - Vukodlak, dirigiéndose a Christof Romuald"
 LOADING_TIP_52: "#high \"No cometeré los errores que han cometido mis progenitores. No elegiré el miedo o la ignorancia. No me acobardaré ante mí mismo, ante quién y qué soy. No me odiaré, ni me rechazaré. Soy Myca Vykos, y una noche, el mundo me conocerá por lo que realmente soy\". #! - Myca Vykos"
 LOADING_TIP_53: "#high \"En el juego de reinas y reyes, debemos sacrificar nuestra compasión en el altar de la certeza inexpugnable. Para gobernar sabiamente, uno debe gobernar totalmente. La justicia no tiene misericordia\". #! - Hardestadt el Joven"
 LOADING_TIP_54: "#high \"La locura del liderazgo es saber que, hagas lo que hagas, a tus espaldas hay cientos, seguros de que su propia solución es la más sensata, y que tu decisión fue el subproducto de un caprichoso lanzamiento de dardo\". #! - Lacroix"
 LOADING_TIP_55: "#high \"Nuestro Padre Oscuro vaga incluso ahora por la noche exterior, llorando y arrepintiéndose en su sabiduría ganada a pulso. Si incluso el poderoso Caín hace esto, ¿cómo es que levantamos nuestros rostros con orgullo hacia la luna y decimos: \"Hay poder en mis venas y por él reclamo la soberanía sobre el hombre y la bestia, y por mi propia sangre negra justifico mis pecados\"?\" #! - Anatole" #CN DA Ravnos p270
 LOADING_TIP_56: "#high \"Me preguntas qué personas tienen más probabilidades de ser diabolistas y asesinos. Te aseguro que cualquiera puede ser un diabolista y un asesino\". #! - Harold el Zettler"
 LOADING_TIP_57: "#high \"Bailo la danza del loco. Y rezo para que me encuentres loco. Pues si pones las manos sobre la raíz. Me conocerás sin ilusión. Y me hallarás culpable de la verdad\". #! - Malkav"
 LOADING_TIP_58: "#high \"Abuelita, déjame darte un beso\". #! - Vasilisa"
 LOADING_TIP_59: "#high \"Chandraputra ha entrado en el santuario, hirviendo con la furia apenas contenida de un héroe justo de los Vedas\". #! - Beckett sobre Chandraputra"
 LOADING_TIP_60: "#high \"La Camarilla perdura para proteger a sus miembros de sí mismos; ese es el único propósito digno que sirve. Pero, un día debe fallar, cuando sus antiguos lleguen para alimentarse en la mesa de la Gehena. Una silla estará reservada para mí\". #! - Kemintiri"
 LOADING_TIP_61: "#high \"Haz las paces con tus dioses y despídete. El diamante se ahogará en sangre, y el resto del mundo poco después\". #! - Sundervere"
 LOADING_TIP_62: "#high \"La Serpiente estuvo primero en el jardín, ya sabes\". #! - Hesha Ruhadze"
 LOADING_TIP_63: "#high \"Él era el objeto de nuestra devoción, el sentido tras el sacrificio de incontables vidas – pitagóricos, cataristas, masones, alquimistas – todos luchando en la oscuridad para que un día, generaciones después, un hombre pudiera sostener en su mano el fruto prohibido, la Piedra Filosofal, el elixir de la vida eterna. Su nombre era Goratrix, nuestro portador de luz, nuestro Prometeo, nuestro Lucifer\". #! - Aisling Sturbridge"
 LOADING_TIP_64: "#high \"¿Crees que yo busqué nuestro exilio – tú, de entre todas las personas? Mejor cien gritos de \"hereje\" y mil espadas Tzimisce que las palabras de desprecio de la Orden aquella horrible noche... Pero si no nos siguen, que se extingan, como los dragones cuyos esqueletos de piedra arranco de los acantilados\". #! - Goratrix a Meerlinda"
 LOADING_TIP_65: "#high \"No soy vuestra serpiente para ordeñar o aplastar, tampoco soy un verdadero mago, pero os mostraré a su tiempo qué es exactamente lo que soy. Y mucho después de que os hayáis ido y vuestra preciosa magia mortal sea cosa de cuentos de nodrizas, yo habré tomado lo que realmente hay que tomar y sabido lo que realmente hay que saber\". #! - Jervais, respecto a Etrius"
 LOADING_TIP_66: "#high \"Muchos son los hijos del Dragón, de la Serpiente, del gran Satán, y están entre vosotros ahora. Os digo, Siervos de Cristo, que la Parusía está cerca, que la Segunda Venida llega pronto. Más fuertes aún crecen los hijos del Dragón, y se multiplican, y son una herida para la tierra. Y nosotros somos el bálsamo para esta herida, debemos limpiarla con fuego, y purificarla, y entonces la tierra estará lista para la Parusía, y seremos juzgados dignos\". #! - Leopold von Murnau"
 LOADING_TIP_67: "#high \"Conocemos la carga de la verdad a un precio alto.\nEllos pagaron de más\". #! - Malkavian sobre los Baali"
 LOADING_TIP_68: "#high \"Lo trágico es que podríamos haberlos dejado morir. Nunca nos perdonarán por haberlos salvado\".#! - Malkavian sobre los Brujah"
 LOADING_TIP_69: "#high \"Incluso si pudiera decirte lo que sé sobre ellos, no me creerías\".#! - Nosferatu sobre los Tzimisce"
 LOADING_TIP_70: "#high \"La Inquisición condena a sus víctimas a ser malditas por siempre, pero ellos solo se encargan de la matanza. Nosotros nos encargamos de la condenación\".#! - Rossellini, nigromante romano"
 LOADING_TIP_71: "#high \"Imagino que piensan que pasamos mucho tiempo espiándoles e intentando socavarles. Como si fueran tan difíciles de descifrar\". #! - Nosferatu sobre los Ventrue"
 LOADING_TIP_72: "#high \"Nada que valga la pena discutir. Pronto otros solo hablarán de su recuerdo. Luego los mataremos a ellos también, y los Tremere simplemente nunca habrán existido\". #! - Tzimisce sobre los Tremere"
 LOADING_TIP_73: "#high \"Cuando su sangre aulló de rabia ante la muerte de Saulot, la nuestra cantó de alegría. Seamos felices juntos\".#! - Baali sobre los Salubri"
 LOADING_TIP_74: "#high \"Intenta encontrar las diferencias con los Toreador si puedes. Solo hay una: tienen un plan, lo que los hace más parecidos a nosotros. No estoy seguro de lo bueno que sea eso\". #! - Giovanni sobre los Setitas"
 LOADING_TIP_75: "#high \"Este no es un lugar ni un momento para el debate. Este es un momento en el que te vas y abandonas tu insignificante búsqueda. Si persistes y sigues adelante, no morirás como un héroe. Suplicarás. Rezarás. No recibirás respuesta\".#! - Lamia desconocida"
 LOADING_TIP_76: "#high \"La manzana no cae lejos del árbol, y el árbol debería haber sido talado hace mucho tiempo\".#! - Brujah sobre los Setitas"
 LOADING_TIP_77: "#high \"Bota, conoce a cara\". #! - Brujah sobre los Ventrue"
 LOADING_TIP_78: "#high \"Te daré ventaja. Tú eres la tortuga y yo soy la liebre — una liebre cabreada, que le jodan al mundo, con una cuenta que saldar y una sed como la del mismísimo diablo\". #! - Brujah desconocido"
 LOADING_TIP_79: "#high \"Ponle la cola al— ¡AY, AY, AY, JODER!\". #! - Malkavian sobre los Gangrel"
 LOADING_TIP_80: "#high \"Emite lluvias de chispas. Apuntar lejos de la cara. Apuntar a algún otro capullo en su lugar\". #! - Nosferatu sobre los Brujah"
 LOADING_TIP_81: "#high \"Tengo este aspecto porque tengo que tenerlo. Estos cabrones lo eligen. Así es como la naturaleza dice: 'Aléjate'\". #! - Nosferatu sobre los Tzimisce"
 LOADING_TIP_82: "#high \"No hay nada malo en estos tipos que no se solucione clavándoles una estaca en sus ataúdes y prendiéndoles fuego\". #! - Ravnos sobre los Tzimisce"
 LOADING_TIP_83: "#high \"¿Por qué demonios ibas a pensar que quería que dejaras de gritar? Encuentro los resultados mucho más melodiosos cuando te entregas a tu miedo\". #! - Tzimisce desconocido"
 LOADING_TIP_84: "#high \"Mátalos. A todos. No pierdas el tiempo en lecciones que no deberían vivir lo suficiente para comprender\". #! - Tzimisce sobre los Tremere"
 LOADING_TIP_85: "#high \"Ah, los nuevos jugadores emergen en el campo de los milenios. Debemos prepararnos para recibirlos de forma adecuada y generosa\". #! - Setitas sobre los Tremere"
 LOADING_TIP_86: "#high \"Patanes traicioneros. Un gusano de Lasombra intentó atraparme en su asqueroso complot. A pesar de todos sus aires de superioridad, sus entrañas no se veían muy diferentes a las de otros vampiros\".#! - Gangrel sobre los Lasombra"
 LOADING_TIP_87: "#high \"Cuando un Malkavian hable, escucha. Cuando un Malkavian actúe, vete. Cuando dos Malkavian se reúnan, corre\". #! - Gangrel sobre los Malkavian"
 LOADING_TIP_88: "#high \"Solo tengo una cosa que decir. Set estaba más loco que Malkav. Lo juro por los huesos de mi sire\". #! - Malkavian sobre los Setitas"
 LOADING_TIP_89: "#high \"La política es sencilla. Dile a tus inferiores qué hacer, empala a los que se atrevan a desobedecer y sigue con los asuntos de verdadera importancia\". #! - Tzimisce desconocido"
 LOADING_TIP_90: "#high \"Desean que admiremos sus artes, ¡pero cómo se resisten a las nuestras! Tenlos como mascotas hasta que sus versos empiecen a aburrir; luego haz que los arrojen a los fosos de Vozhd\". #! - Tzimisce sobre los Toreador"  
 LOADING_TIP_91: "#high \"Arrancaremos su don robado de sus entrañas desolladas, los empalaremos en los picos de los Cárpatos que profanaron, alimentaremos al Danubio con sus humores biliosos y dejaremos el resto para las aves de carroña. Entonces empezaremos de verdad a enseñarles el significado del dolor\".#! - Tzimisce sobre los Tremere"
 LOADING_TIP_92: "#high \"Tienen un talento admirable para guardar rencor\". #! - Ventrue sobre los Brujah"
 LOADING_TIP_93: "#high \"Si parece una serpiente, sisea como una serpiente y se arrastra como una serpiente, entonces no extiendas la mano para acariciarle la cabeza. Si encuentras una serpiente en tu jardín, mátala\".#! - Scatha-Columbkille sobre los Setitas"
 LOADING_TIP_94: "#high \"Mola, lucha contra el poder. ¡Ayuda a la gente! Oh, espera, ¿solo vas a ayudar a la mitad de ellos? Bueno, supongo que es algo\". #! - Roehuesos sobre las Furias Negras"
 LOADING_TIP_95: "#high \"Me dan escalofríos. Crees que estás contando una historia verdaderamente trágica, y ellos se limitan a mirarte como diciendo '¿Eso es todo?'\".#! - Fianna sobre los Caminantes Silenciosos"
 LOADING_TIP_96: "#high \"Vuestros ancestros eran casi tan fuertes como los nuestros, y vosotros sois casi tan fuertes como nosotros. ¿Qué? Es un cumplido\". #! - Camada de Fenris sobre los Fianna"
 LOADING_TIP_97: "#high \"Impresionantemente astutos. Peligrosamente subestimados. Considerablemente útiles\". #! - Señores de las Sombras sobre los Roehuesos"
 LOADING_TIP_98: "#high \"Manéjalos adecuadamente y serán una parte vital de cualquier plan de batalla. Comete un error al manejarlos... en realidad, déjame decirte que no cometas un error al manejarlos\". #! - Señores de las Sombras sobre la Camada de Fenris"
 LOADING_TIP_99: "#high \"Su lealtad es muy apreciada, aunque su etiqueta sea... variable\". #! - Colmillos Plateados sobre los Fianna"
 LOADING_TIP_100: "#high \"No entienden que ganar batallas no vale la pena si se pierde la guerra\". #! - Roehuesos sobre la Camada de Fenris"
 LOADING_TIP_101: "#high \"Dales el respeto de Gaia, pero ten cuidado de no hacerte amigo si bailas con ellas\". #! - Fianna sobre las Furias Negras"
 LOADING_TIP_102: "#high \"Qué uñas tan bonitas tienes. Duras como el acero y tan, tan afiladas. Desgarrarían carne y hueso. Solo quiero... arrancarlas a mordiscos\". #! - Helena de Troya"
 LOADING_TIP_103: "#high \"Mi destino no será decidido por quién pudo haber sido mi bisabuelo-sire. No volveré a ser controlado\". #! - Lucius Aelius Sejanus"
 LOADING_TIP_104: "#high \"Y cuando Ella se preparó para regresar, el mundo se partió en dos. Los Hijos de Caín a un lado, los Hijos de Lilith al otro, y fue la Gehena\". #! - el fragmento Shaal"
 LOADING_TIP_105: "#high \"Él viene. El Pastor Negro viene a sacrificar al rebaño. El Engendro Odioso. El Heraldo de la Destrucción. Así como el Señor de la Muerte sacrificó a sus chiquillos en Kaymakli, el Pastor Negro sacrificará a los Hijos en Alamut\". #! - profetisa mortal desconocida"
 LOADING_TIP_106: "#high \"Todo lo viejo debe dejar paso a lo nuevo. Lo tercero se convierte en lo segundo, lo segundo se convierte en lo primero. Los padres mueren para que los hijos vivan. Todos somos círculos en espiral hacia abajo para reinar en el infierno\". #! - Acacia"
 LOADING_TIP_107: "#high \"El giro de la rueda es inexorable. No se puede detener, pero su curso puede cambiarse para retrasar el momento final en que seamos reducidos a la nada, y Ellos se levanten. Como es ahora, así fue antes. Como fue antes, así será en el futuro. Los Hijos de Caín siempre están al borde del olvido\". #! - Vasantasena"
 LOADING_TIP_108: "#high \"Somos viejos y sabios, pero en nuestra edad y poder, solo nos hemos enredado en telarañas que no podemos ver y nos hemos atado con hilos de marioneta que no podemos sentir, y mucho menos cortar\". #! - Vasantasena"
 LOADING_TIP_109: "#high \"A lo largo de los milenios, han surgido cultos a la muerte para dictar el fin del mundo y entregarse a sus libertadores. ¿Ha terminado ya el mundo? No. ¿Han sido esos libertadores alguna vez algo más que bastardos hambrientos? No. Mira a los Tremere\". #! - Talley"
 LOADING_TIP_110: "#high \"Y entonces el Dragón saqueó el manto de Kupala. Como se le había inducido a hacer. Y lo vistió como propio. Gobernando la tierra entre los ríos. Y cada lugar que pisó. Como era Su voluntad\". #! - Incunabulum Kupalam"
 LOADING_TIP_111: "#high \"¡Ya vienen! ¡Vienen a por todos nosotros!\". #! - Últimas palabras de Angus, Nosferatu"
 LOADING_TIP_112: "#high \"Algunos libros no están hechos para ser abiertos\". #! - Anatole"
 LOADING_TIP_113: "#high \"Disfruta de tus libros, entregados en mano en el lugar elegido. Ten por seguro que solo un Dunsirn tuvo que morir para permitir su adquisición. Asesiné a dos para enviar un mensaje\". #! - Talley"
 LOADING_TIP_114: "#high \"¿No se originaron los Tremere como una línea de sangre de los Tzimisce? Eso suena significativo\". #! - Anatole"
 LOADING_TIP_115: "#high \"Zettler. Varrick. Vegel. Leopold. Ruhadze. Beckett. Solo los nombres más recientes de aquellos que intentaron controlar el Ojo y empezaron a sucumbir a sus poderes. No abras la caja\". #! - Anatole"
 LOADING_TIP_116: "#high \"Cuando Hazimel acercó su frente a la mía, pareció abrirse un tercer ojo, y su mente tocó la mía. Él podía ver todo de mi vida, y sonrió. Yo podía ver todo de la suya, y empecé a gritar\". #! - Beckett"
 LOADING_TIP_117: "#high \"¡La mesa habla! Está muy descontenta. Intenta ser tú una mesa encantada en una casa vacía\". #! - Anatole"
 LOADING_TIP_118: "#high \"La posesión de sarcasmo real es un crimen castigado con la muerte definitiva en la Casa de Hardestadt\". #! - Calebros"
 LOADING_TIP_119: "#high \"Hablé con el Mayor. O el padre me habló. En mí. Siempre en mí. Por mucho que trague, el abuelo no baja\". #! - Lambach"
 LOADING_TIP_120: "#high \"La prima Viorica vino de parte de Damek. Quería saber por qué cesó mi comunicación. Se lo enseñé. El Mayor está alimentado. Soy un buen chico\". #! - Lambach"
 LOADING_TIP_121: "#high \"Aquella acción... hace tantos años... fue vulgar y corta de miras\". #! - Sascha Vykos"
 LOADING_TIP_122: "#high \"Shivasakti, tú eres el Divino Padre y Madre. Concédeme tu devoción, destruye al malhechor y el marchitamiento de la Rueda de las Eras de donde emana el mal. Conquista toda muerte y destino bajo el talón y deja que la quietud sea la ley eterna\". #! - Voormas"
 LOADING_TIP_123: "#high \"Cuanto más vemos, más creemos saber. Cuanto más creemos comprender, más nos cerramos en nuestros caminos y más limitamos nuestro potencial. Por tanto, la juventud es la llama que enciende el futuro. El poder es meramente pulimento en hojas desafiladas\". #! - Porthos"
 LOADING_TIP_124: "#high \"Como soy el Señor de la Luz, tengo dominio sobre aquellas esferas que iluminan el cielo. Y así te doy esta vestidura de Noche, queridísima hermana, sobre la que están cosidas la luna y las estrellas y todo lo que aparece en el cielo nocturno. Vístela y gobierna la Noche como yo gobierno ahora el Día\". #! - Lucifer a Lilith"
 LOADING_TIP_125: "#high \"¿Por qué debo acostarme debajo de ti, sobre mi espalda? Yo también fui hecha de la Tierra Verdadera, y por tanto soy tu igual\". #! - Lilith a Adán"
 LOADING_TIP_126: "#high \"Siempre están correteando en alguna misión secreta para encontrar los cráneos de sus Antiguos y molerlos para hacer polvo afrodisíaco o algo así. Se ponen muy dignos cuando los interrumpes.\nLo que sea, Gandalf\".#! - Los Brujah sobre los Tremere"
 LOADING_TIP_127: "#high \"He sido una puta para la guerra y una puta para la paz. He sido una mártir y una cínica, una asesina y una santa. He visto ocurrir la historia. He contribuido al color del avance cultural con el carmesí de mi propia sangre. He visto milagros, y he sido un milagro para muchos\".#! - Lucita de Aragón"
 LOADING_TIP_128: "#high \"Supongo que si no tuviera habilidades apreciables, ni aspiraciones, ni dinero, yo también fingiría que soy un animal\".#! - Los Giovanni sobre los Gangrel"
 LOADING_TIP_129: "#high \"Se rompen fácil. Aunque no puedes atrapar sus espíritus cuando los matas. Al parecer, se reciclan de nuevo en su mundo de sueños feliz y brillante. Qué tierno\".#! - Los Giovanni sobre los Fae"
 LOADING_TIP_130: "#high \"La cagaste al morir y volviste a casa a por más. Bienvenido de nuevo.\nAhora las reglas son diferentes\".#! - Un Giovanni a su chiquillo"
 LOADING_TIP_131: "#high \"Ambrogino Giovanni tiene el dudoso honor de ser el cabrón más interesado en sí mismo de todo un clan de cabrones interesados en sí mismos\".#! - Un Giovanni"
 LOADING_TIP_132: "#high \"Todo el mundo menos nosotros es estúpido.\nTriste pero cierto\".#! - Giovanni desconocido"
 LOADING_TIP_133: "#high \"Cargan con un nombre que nadie puede pronunciar. Eso sí que es la condenación\".#! - Accorri Giovanni sobre los Tzimisce"
 LOADING_TIP_134: "#high \"Existo. Esa es razón suficiente para que yo gobierne\".#! - Lasombra desconocido"
 LOADING_TIP_135: "#high \"Piensa en los Lasombra. Resta la inteligencia, la previsión, el estilo y la dedicación a la supremacía. Esos son los Ventrue: como nosotros, pero estúpidos\".#! - Demba Makemba Adoula"
 LOADING_TIP_136: "#high \"Dignos archienemigos. El último con el que jugué tardó cuatro noches en gritar y doce en morir. Admirable, de verdad\".#! - Tzimisce sobre los Ventrue"
 LOADING_TIP_137: "#high \"Puede que nuestro clan comprenda la colección más desesperada de traidores confabuladores que uno pueda encontrar jamás, pero son nuestros traidores confabuladores\".#! - Friedrich von Weber, Ventrue"
 LOADING_TIP_138: "#high \"Pequeños accidentes extraños siempre parecen ocurrirles a quienes se cruzan en su camino. Y si los accidentes no acaban contigo, lo harán los cánticos de muerte que te lanzan y que te hacen explotar el cerebro\".#! - Nosferatu sobre los Magos"
 LOADING_TIP_139: "#high \"Rara vez me he encontrado con criaturas tan convencidas de su importancia para el universo y, sin embargo, tan carentes de pruebas que respalden sus delirios\".#! - Ravnos sobre los Toreador"
 LOADING_TIP_140: "#high \"Son increíblemente valientes, asombrosamente duros, asesínamente poderosos como individuos... y completamente ineficaces como grupo\".#! - Setitas sobre los Gangrel"
 LOADING_TIP_141: "#high \"Los Brujah afirman que saben cómo construir una sociedad perfecta gracias a su intelecto superior. Puedes localizar esos intelectos escuchando los gritos de terror y el estrépito de objetos rompiéndose\".#! - Setitas sobre los Brujah"
 LOADING_TIP_142: "#high \"Para cuando te das cuenta de que un Toreador ha perdido los estribos, tu cabeza puede estar a varios pies de tu cuerpo\".#! - Setitas sobre los Toreador"
 LOADING_TIP_143: "#high \"Unos pocos antiguos no tienen nada que ocultar. Se les llama \"muertos\"\". #! - Zachariah Shale"
 LOADING_TIP_144: "#high \"Ahora tengo una pregunta para ti. Entre un antiguo Lasombra que es inteligente, despiadado, manipulador, fanático y decidido a joderte, y un antiguo Lasombra que es inteligente, despiadado, manipulador, fanático y está convencido de que eres maravilloso, dime cuál es más aterrador\".#! - Nadia"
 LOADING_TIP_145: "#high \"¡¿Seguir a un Gangrel?! ¿Por qué no escupir al Príncipe o ponerse a tomar el sol?\".#! - Pierre" #Blood curse 2
 LOADING_TIP_146: "#high \"Las cosas que hago por ti, Lucita... Y las cosas que hago por mí mismo\".#! - Moncada" #Conspiracies
 LOADING_TIP_147: "#high \"Y el nombre del camino era Gehena, y estaba pavimentado con sueños moribundos\".#! - Kli Kodesh" #Blood curse 3
 LOADING_TIP_148: "#high \"Y cuando la Criba haya tenido lugar, el Fratricida se presentará ante el Traidor de la Sangre. Los lamentos y el crujir de dientes son la sombra del Traidor, que sigue con más seguridad que la noche al día.\nY he aquí que la Tierra abrirá su vientre y la Bestia saldrá arrastrándose buscando la sangre para saciar su sed. Miguel, el más exaltado de la Gloriosa Compañía, tiembla ante la Tríada Impía completa. La Bestia camina por la Tierra. La Ruina de los Hijos de Caín está cerca\".#! - José de Arimatea" #Blood curse 3
 LOADING_TIP_149: "#high \"Han estado conspirando contra nosotros para vengar la muerte de Brujah durante aproximadamente 10.000 años. Estoy seguro de que se pondrán a ello cualquier noche de estas\".#! - Brujah sobre los Verdaderos Brujah" #lore of the clans
 LOADING_TIP_150: "#high \"La mitad de los Clanes del Sabbat solo están ahí porque les da la oportunidad de matar Tremere\".#! - Gangrel desconocido" #lore of the clans
 LOADING_TIP_151: "#high \"Lamentablemente, hemos tenido que escuchar a los Ventrue y a los Brujah quejarse de Cartago durante siglos. La verdad es que si Cartago fuera realmente importante, se la habríamos quitado a ambos\".#! - Lasombra desconocido" #lore of the clans
 LOADING_TIP_152: "#high \"Como puedes imaginar, organizar a un grupo de asesinos, ladrones y agentes de poder egoístas, egocéntricos y agresivamente ambiciosos no es una tarea fácil\".#! - Lasombra sobre sí mismos" #lore of the clans
 LOADING_TIP_153: "#high \"Todo Lasombra quiere que las últimas palabras de su enemigo sean: 'Ah, ya veo. Bien jugado'\".#! - Lasombra desconocido" #lore of the clans
 LOADING_TIP_154: "#high \"¿Soy Caín? ¿Eres Caín? ¿Somos Caín?\".#! - Malkavian desconocido" #lore of the clans
 LOADING_TIP_155: "#high \"Por último, pero no menos importante, tenemos a los sombríos y misteriosos Inconnu, una Secta de vampiros conocida por su sombrío misterio. Podría decirte la verdad, pero tendría que matarte.\nQuiero decir, otra vez\".#! - Malkavian desconocido" #lore of the clans
 LOADING_TIP_156: "#high \"Las bromas son un concepto difícil de traducir a la gente de fuera del Clan, y 'complots aterradoramente anárquicos con resultados inescrutables' tampoco es que sea muy pegadizo\".#! - Malkavian desconocido" #lore of the clans
 LOADING_TIP_157: "#high \"Puede que oigas a algún Vástago engreído y pagado de sí mismo soltar esa frase de los 'maestros secretos', de que los vampiros son de algún modo responsables de la historia humana. Es una historia preciosa, querido, pero simplemente no es verdad. Apenas podemos mantener el control de nuestra propia sociedad sin que las cosas se fragmenten en 'sectas', 'cuadrillas' y demás, así que ¿cómo podríamos controlar a la humanidad?\".#! - Toreador desconocido" #lore of the clans
 LOADING_TIP_158: "#high \"Los Toreador están solos en el mundo de los Vástagos. No digo que seamos mejores que los otros Clanes... aunque por supuesto que lo somos, ¿has hablado con ellos?\".#! - Toreador desconocido" #lore of the clans
 LOADING_TIP_159: "#high \"Los necios Brujah de hoy afirman que Cartago era una ciudad donde los Vástagos y el ganado vivían en armonía. Supongo que es así, si defines 'armonía' como que los mortales ni siquiera intentaban defenderse cuando los vampiros arrebataban a sus seres queridos y los desangraban sin pensarlo dos veces\".#! - Ventrue desconocido" #lore of the clans
 LOADING_TIP_160: "#high \"Reclamamos el trono que es una cruz porque la única alternativa a ser un gobernante es ser un esclavo\".#! - Ventrue desconocido" #lore of the clans
 #Bastet
 LOADING_TIP_161: "#high \"Se dice que los Ceilican están extintos. Estando yo mismo extinto, me resulta difícil de creer\".#! - Bubasti desconocido"
 LOADING_TIP_162: "#high \"Envié a un Khan contra un vampiro una vez. Los resultados fueron agradables de ver\".#! - Bubasti desconocido"
 LOADING_TIP_163: "#high \"Sí, sí, supongo que son nobles y todo eso, ¡pero qué problema de actitud!\".#! - Ceilican sobre los Simba"
 LOADING_TIP_164: "#high \"Ningún rey es tan poderoso, ningún sacerdote tan santo, ninguna virgen tan pura de corazón que su sangre no se congele ante la cara de un tigre. Ante mí, no sois nada\".#! - Khan desconocido"
 LOADING_TIP_165: "#high \"Les dijimos a Bagheera y a Khan: Si sois mejores Reyes que nosotros, intentad tomar la corona.\nHay que reconocerles que lo intentaron\".#! - Simba desconocido"
 LOADING_TIP_166: "#high \"Patético. Y muerto. Lástima\".#! - Simba sobre los Ceilican"
 LOADING_TIP_167: "#high \"No confiaría en uno ni aunque pudiera lanzarlo por encima de una pirámide, y eso no es muy lejos\".#! - Ajaba sobre los Bubasti"
 LOADING_TIP_168: "#high \"Bienvenido a la Perla Blanca. Nos especializamos en sueños salvajes y pesadillas aún más salvajes. Me pregunto por cuál de ellos estás aquí, ¿eh?\".#! - Saruuro, Quadi del Cielo Rojo"
 LOADING_TIP_169: "#high \"La principal diferencia entre nosotros y otros Vástagos es que ellos solo beben sangre de sus víctimas, mientras que los Nagaraja deben consumir también carne. De ahí nuestro apodo, los acertadamente llamados Comedores de Carne. Es como si los otros Vástagos le hubieran pedido a su sobrina de 4 años que nos pusiera un nombre, pero divago\".#! - Nagaraja desconocido" #lore of the bloodlines
 LOADING_TIP_170: "#high \"Un hombre le pregunta a un psíquico si realmente puede ver el futuro, a lo que el psíquico responde afirmativamente. Entonces el hombre le da un puñetazo en la cara al psíquico. Mientras el psíquico yace sangrando en el suelo, preguntándose qué hizo para provocar tal violencia, su atacante se inclina y dice: '¡Apuesto a que no viste venir eso!'.\nOímos mucho ese chiste\".#! - Verdadero Brujah desconocido" #lore of the bloodlines
 LOADING_TIP_171: "#high \"Miguel había encontrado la redención en el odio de una amante, demasiado lejos del Sueño para volver. Su derrota fue casi tan amarga como la victoria de ella.\nY Miguel sonrió\".#! \" #CN Nosferatu
 LOADING_TIP_172: "#high \"Aquella ciudad fue una vez tan grandiosa. Tan propia y llena de sí misma. Ahora, puesta de rodillas, Constantinopla ha sido rebajada a otro nivel - Mi nivel, y si ha de levantarse de nuevo, creo que lo hará con mi collar en su garganta\".#! - Alfonzo de Venecia" #DA CN Lasombra p130
 LOADING_TIP_173: "#high \"¿El Sueño? El sueño de Miguel de una gran ciudad es tal como siempre ha sido: Está detrás de nosotros y por delante. Lo llevamos con nosotros, y podemos reconstruirlo en cualquier imagen que podamos imaginar, y en muchas que ninguno de nosotros por separado podría imaginar\".#! - Malaquita" #DA CN Lasombra p226
 LOADING_TIP_174: "#high \"¿Condenado? Christof, eres la cima de la creación. Tienes poderes que superan incluso al hombre más virtuoso. Eres una ley para ti mismo, más dios que hombre. ¡Eres inmortal! Un ángel en forma y poder; disfruta de tu posición. Saborea el exquisito poder que tu Dios te ha otorgado. Úsalo para imponer tu voluntad en un mundo de pecadores\".#! - Serena" #Redemption, entering Prague university with Serena
 LOADING_TIP_175: "#high \"Última oportunidad, demonio. Sé cómo matar a los de tu clase rápidamente, pero estaré encantado de fingir que no\".#! - Gauthier de Dampierre a Anatole"  #DA CN Ravnos p76 
 LOADING_TIP_176: "#high \"Crearemos, dentro de la Iglesia y sin embargo sin el conocimiento de la Iglesia, un cuerpo de hombres -y mujeres también si Dios así lo quiere- en quienes el Santo Padre pueda confiar para llevar la Inquisitio sobre las mismísimas legiones del Infierno en la tierra\".#! - Cardenal Battista Marzone"  #CN DA Ravnos p143
 LOADING_TIP_177: "#high \"Es cierto que Caín es ejemplar. Es nuestro padre oscuro, progenitor de nuestra raza. Es un errante, que busca el perdón y la comprensión como nosotros. Es un maestro tiránico que castigará a quienes abandonen sus lecciones. Pero no es ningún mesías\".#! - Anatole"  #CN DA Malkavian p162
 LOADING_TIP_178: "#high \"Ser un Príncipe es muy parecido a ser el ganso asado en un festín. Los que no te están trinchando están esperando la oportunidad de masticarte\".#! - Olivier"  #CN DA Brujah p143
 LOADING_TIP_179: "#high \"Te compadezco porque nunca has logrado nada de lo que realmente deseabas. No puedes amar, solo poseer. No puedes gobernar, solo dominar. Espero que una noche encuentres la paz - no creo que lo hagas, pero lo espero de todos modos. Eres mi sire, pero el tiempo en que doblé mi rodilla ante ti como mi superior ha terminado. Ya no eres Príncipe aquí\".#! - Geoffrey a Alexander"  #CN DA Brujah p276
 LOADING_TIP_180: "#high \"Antes estábamos armados con nuestro honor, valor y acero bien templado. Ahora nos enfrentamos a él con la justa ira de Dios, y aunque levante ejércitos de las mismísimas entrañas del propio Infierno, #italic ¡no prevalecerá contra nosotros! #! \"#! - Jürgen von Verden sobre Vladimir Rustovitch"  #CN DA Toreador p119
 LOADING_TIP_181: "#high \" \"Cabalga\". La palabra era apenas reconocible como habla. \"Cabalga como si el mismísimo Diablo te pisara los talones\". Qarakh sonrió, mostrando unos dientes que se habían vuelto lobunos.\n \"Porque así será\" \".#! - Qarakh a Marqués de Langres"  #CN DA Gangrel p44
 LOADING_TIP_182: "#high \"El Rey Mono puso en evidencia a todos los de vuestra clase. Hicieron falta el Buda y los elementos para enseñarle a comportarse\".#! - Las Mil Sombras sobre las Grullas Resplandecientes"  #KOTE Core p65
 LOADING_TIP_183: "#high \"Ver reír a Rosamunda era lo más parecido a la luz del sol a lo que cualquier vampiro cuerdo se atrevió jamás a acercarse. Oírla cantar o recitar poesía era oír a una sirena. Verla caminar era ver la belleza del amor de Dios en movimiento.\nVerla llorar era insoportable\".#! - Jürgen von Verden"  #DA CN Ventrue p38
 LOADING_TIP_184: "#high \" “Y si la lucha comienza, ¿huirás?”. Hardestadt clavó sus ojos en el Lasombra, y la luz de la luna se detuvo para observarlos. Gotzon abrió los ojos un poco más y permitió que Hardestadt viera lo que había detrás de ellos por un instante. Hardestadt dio un paso atrás. No había retrocedido ante un enemigo en un siglo, tal vez más.\nPero claro, nunca había visto realmente el Infierno\". #!"  #DA CN Ventrue p12
 LOADING_TIP_185: "#high \"Mantente alejado de ellos. Mantente alejado de sus tierras. Mantente alejado de sus susurros. Mantente alejado de sus amigos, y muy alejado de sus enemigos\". - Roehuesos sobre los Señores de las Sombras#!"  #WDA Revised p59
