l_spanish:

 legend_chronicle_mithras_chronicle: "El Dios Sol Inmortal"
 legend_chronicle_mithras_chronicle_desc: "El relato del Rey de Antaño y del Futuro, Mitra"
 mithras_chronicle_opening: "Un Dios adorado por primera vez por los antiguos persas, Mitra (o Mithra, como le conocían ellos) gobernó sobre las primeras tribus de hombres en Oriente Medio como un gobernante firme pero justo. Apareciendo solo de noche, Mitra dedicaba su tiempo durante el día a ahuyentar la noche y llevar la gloria del Sol a sus fieles seguidores.\nVenerado como el Dios Sol, Mitra se convirtió en una deidad de los pactos, la verdad, el juramento y la justicia."
 mithras_chronicle_motivation: "El gobierno perfecto de Mitra parecía destinado a durar para siempre hasta la llegada de otra deidad, Kemintiri de Egipto. Cautivado por haber encontrado finalmente a su igual, Mitra la invitó a gobernar a su lado. Sin embargo, el Dios Sol ofreció su amistad demasiado pronto y Kemintiri cometió una terrible traición, robando a Mitra su heredero y a su pueblo su Dios. El Sol se puso sobre Persia mientras el Señor de la Luz caía en la desesperación."
 mithras_chronicle_famous_deed: "El luto de Mitra llegaría a su fin con la llegada de los romanos. Tomando un gran interés en este pueblo guerrero, Mitra se les reveló y ellos cayeron de rodillas, abrazando a su nuevo Dios y llamándole el Matador de Toros. Siguiendo el impulso de sus nuevos seguidores, Mitra eligió liderarlos en la batalla y, por un tiempo, el mundo fue suyo."
 mithras_chronicle_extra_deed: "El bendito reinado del Dios Sol sobre los romanos llegó a su fin cuando una religión rival, el cristianismo, empezó a ganar terreno entre los menos guerreros del pueblo romano, un grupo que Mitra había ignorado hasta entonces en favor del furioso celo de sus devotos soldados. En lugar de arriesgarse a un costoso enfrentamiento con este enemigo y poner en peligro a su rebaño, Mitra se llevó a sus más fieles y se embarcó hacia Britania para recrear su utopía en esta tierra inexplorada."
 mithras_chronicle_conclusion: "A pesar de que el cristianismo invadió incluso esta nueva tierra, Britania prosperó bajo el gobierno del Señor de la Luz, librándose de los últimos seguidores bárbaros de religiones salvajes. Eligiendo sabiamente trabajar junto a los seguidores de la Cruz en lugar de lanzar una guerra costosa, Mitra está ahora moviendo sutilmente los hilos del destino que transformarán Britania de una tierra bruta e inconquistada en una potencia mundial digna de ser su dominio."

 legend_chronicle_noddist_chronicle: "Caín: El Primero"
 legend_chronicle_noddist_chronicle_desc: "El relato del primero de vuestra clase, Caín"
 noddist_chronicle_opening: "Caín es ampliamente reconocido por la mayoría como el primer vampiro.\nEn los primeros días de la humanidad, el hijo de Adán y Eva preparó una ofrenda de sacrificio a Dios, de sus mejores frutas y verduras. Su hermano Abel también preparó una ofrenda de sacrificio, siendo esta de los mejores animales que había criado. O bien hubo una disputa sobre qué ofrenda era mejor, o Dios realmente favoreció la de Abel sobre la de Caín. El resultado final terminó con Caín \"sacrificando\" a Abel en el altar, siendo su hermano la \"mejor\" ofrenda que podía dar al todopoderoso, ya que no amaba nada más que a él.\nComo castigo, el padre de Caín, Adán, le maldijo con una marca sobre su carne y le expulsó para que vagara en la oscuridad."
 noddist_chronicle_motivation: "Vagando por la Tierra de Nod, Caín encontró a Lilith. Ella notó una mancha arremolinada en el aire a su alrededor; una marca de algún poder oscuro e insondable: el asesinato. Él poseía el poder de matar a seres superiores, no para cazar como Adán, sino para matar como Jehová.\nElla se asombró, pues él no mostraba signos de divinidad, sino que vagaba por el polvo como una bestia menor. Viendo que tenía frío y hambre, acogió a Caín en el calor de su hogar. Lilith se identificó como la Primera Mujer, la esposa original del padre de Caín. Tras quedarse con ella durante algún tiempo, los dos se convirtieron en amantes."
 noddist_chronicle_famous_deed: "Después de que Caín participara de la sangre de Lilith, fue visitado por tres ángeles en una visión. Estos ángeles, que eran agentes de Dios, ofrecieron cada uno a Caín una oportunidad de arrepentirse por el asesinato de su hermano Abel, pero Caín los rechazó por orgullo, viendo sus acciones como justificadas.\nMiguel, al ser rechazado, maldijo a Caín y a sus chiquillos a temer su llama viva como a ninguna otra.\nRafael maldijo a Caín y a sus chiquillos a temer el amanecer, ya que los rayos del sol quemarían como el fuego sagrado de Miguel.\nUriel maldijo entonces a Caín y a sus chiquillos a aferrarse a la Oscuridad, beber solo sangre, comer solo cenizas y quedar congelados en el punto de la muerte, maldecidos para que todo lo que tocaran se desmoronara en la nada.\nApareció entonces un cuarto ángel, Gabriel, para ofrecer el camino de la Golconda, el único camino hacia la \"luz\", por la misericordia de Dios."
 noddist_chronicle_extra_deed: "Tras esta experiencia, Caín quedó oficialmente \"Despertado\", poseyendo las siguientes Disciplinas: Celeridad, Potencia, Fortaleza, Ofuscación, Dominación, Presencia, Vicisitud, Animalismo y Auspex. Caín tomó entonces conciencia de la Senda de la Sangre, la Senda Final de la que parten todas las sendas. Y con todos estos poderes, rompió su vínculo con Lilith y la dejó en la tierra de Nod."
 noddist_chronicle_conclusion: "Caín continuó vagando por la Tierra de Nod en soledad, el recuerdo de su pecado ahogándole en el pesar. Pasaron muchas eras antes de que decidiera estar de nuevo entre los hombres mortales. Sus poderes y su marca eran bien conocidos por los hombres mortales, y algunos incluso le adoraban como a un dios.\nFinalmente, Caín se estableció en una pequeña comunidad agrícola llamada Ubar. Fue aquí, en esta Primera Ciudad, donde llegó a ser conocido como el \"Padre Oscuro\"."

 legend_chronicle_lilim_chronicle: "Lilith: La Primera Mujer"
 legend_chronicle_lilim_chronicle_desc: "El relato de la primera mujer, Lilith."
 lilim_chronicle_opening: "Según la mayoría de los mitos tempranos, Lilith fue la primera esposa de Adán, su igual y contraparte en poder y sabiduría. Se separó del \"hombre primordial\" y, como castigo, Dios (también conocido como Jehová) la expulsó del Edén, reemplazándola por Eva.\nAdemás, Dios maldijo a Lilith a no conocer nunca el amor de otro. A su vez, cada ser al que Lilith amara y cuidara de verdad, nunca podría amarla realmente a ella.\nAlgunos adoradores de Lilith afirman que Adán intentó violar a Lilith —o que realmente lo hizo—, lo que impulsó a Lilith a huir del Edén en lugar de ser expulsada."
 lilim_chronicle_motivation: "Según los Bahari, sin embargo, Lilith disfrutó de una extensa secuencia de amoríos tanto con Jehová como con Lucifer, que eran dioses con sus propios Jardines. Se decía que Lucifer le había dado a Lilith el \"manto de la noche\" como regalo después de que ella hubiera vagado por las tierras fuera del Edén, abrasada y torturada. Ella arrancó estrellas de su manto para usarlas como semillas para crear su primer jardín, Elona, el Jardín de la Esperanza."
 lilim_chronicle_famous_deed: "Algunas historias afirman que Lilith viajó y presenció los otros jardines, pero finalmente encontró el camino de regreso al jardín de Jehová. Lucifer fue enviado para bloquear su entrada; sin embargo, ella prometió que solo deseaba reunir información para crear su propio jardín, y que no se llevaría nada. Lucifer aceptó. Mientras Lilith estaba en el jardín, se transformó en serpiente y vio a la ignorante Eva, que no sabía nada del mundo. Le dio a Eva el fruto, lo que causó la caída del hombre y le dio a Lilith su maldición."
 lilim_chronicle_extra_deed: "Lilith y Lucifer viajaron hasta el borde del Mar Infinito, donde fundaron D'hainu, el Jardín de la Renovación.\nFinalmente abandonada por Jehová y Lucifer, conoció al descendiente desterrado y errante de su exmarido, el Primer Asesino (como se le nombra en la Biblia), Caín. Acogió a Caín, cuidó de sus heridas, le alimentó y curó, y le enseñó la sabiduría secreta, cuyas semillas florecieron en las Disciplinas vampíricas."
 lilim_chronicle_conclusion: "Y ¿cómo se lo paga él? Abandonándola también a ella, para vagar siempre aparte, madre de monstruos y ladrona de alientos infantiles. Caín pasa a fundar Enoch y Lilith abandona la escena. Se dice, sin embargo, que creó un tercer jardín, Ba'hara, el Jardín de los Pesares, desde el cual se preparará para la Gehena."

 legend_chronicle_setite_chronicle: "Set, el Maestro de la Duat"
 legend_chronicle_setite_chronicle_desc: "El relato del gran liberador, Set."
 setite_chronicle_opening: "Según su fiel rebaño, Set nació en Egipto, en el río Nilo, hace casi 7.000 años. Fue un gran cazador y guerrero cuya única rivalidad era con su hermano mayor, Osiris. Eran los nietos de Ra, un poderoso caudillo que había conquistado a los pueblos del Nilo, uniendo así el Alto y el Bajo Egipto."
 setite_chronicle_motivation: "La muerte de los padres de Set, Geb y Nut, fue ordenada por Ra, quien sintió que le habían traicionado por tener descendencia adicional. Ra se sentía amenazado por los linajes reales y ordenó que no debían tener hijos. Set se angustió por la orden de muerte de sus padres, y su voz en el asunto le valió el destierro. Osiris, por otro lado, posiblemente por miedo, expresó su lealtad a Ra y se convirtió en heredero al trono."
 setite_chronicle_famous_deed: "Tras la muerte de Ra, Osiris tomó el control del reino, deificó a su abuelo y promovió su adoración como un dios. Set regresó con su hermano Osiris, con la esperanza de reconciliarse; sin embargo, su hermano reinante mantuvo la orden de destierro. A partir de entonces, Set tomó el nombre de \"Sutekh\" y viajó al norte, a Asiria."
 setite_chronicle_extra_deed: "Según continúa la leyenda, Set regresó a Egipto y derribó al rey Osiris y a su hijo Horus. Tomando Egipto como propio, Set gobernó con poder y tal vez (o tal vez no) buscó liberar a la humanidad de los vínculos de la ley impuestos por Ra. Sea cual sea la verdad, Horus regresó de la muerte como una Momia y buscó venganza por la destrucción de su padre, expulsando a Set del trono de Egipto y comenzando una cruzada que duraría milenios."
 setite_chronicle_conclusion: "Aunque la mayoría de los setitas están de acuerdo en que Set fue un vampiro en algún momento (tal vez hasta que ascendió a la Divinidad), hay algunos que rechazan la noción de que su \"Fundador\" fuera alguna vez mortal, o incluso abrazado. En esta interpretación, Osiris, Set y Ra eran todos verdaderamente Dioses.\nSurge otro punto de discordia respecto al papel de la \"Serpiente del Caos\", $glossary_wyrm_apep$ (o $glossary_wyrm_apophis$). Algunos afirman que fue muerta por Set (y tal vez absorbida en su ser), mientras que otros afirman que es, en cambio, una aliada (o tal vez incluso maestra) de su Fundador. Ambas interpretaciones difícilmente pueden coexistir y han causado una gran fricción teológica dentro de los Seguidores de Set."
 legend_danu: "[GetDynastyByID( 'POD_fae_dynasty_tuatha_de_danaan' ).GetBaseName]"
 legend_danu_desc: "[GetScriptedCharacterByHistoryID('POD_fae_character_1000').GetFirstName], también conocida como Dana, fue la madre de los Tuatha de Danaan. Se rumorea que los Tuatha de Danaan dieron a la humanidad la capacidad de soñar. La humanidad, a su vez, dio a los Tuatha la materia prima necesaria para dar forma a la Edad de las Leyendas. De los Tuatha surgieron todos los demás linajes que poblaron el Ensueño. Danu pide que sus hijos celebren festejos en su honor en los solsticios y equinoccios."
 legend_balor: "La sangre de [ancestor.GetFirstNameNoTooltip]"
 legend_balor_desc: "En la primera batalla entre los fomoré y los [GetDynastyByID( 'POD_fae_dynasty_tuatha_de_danaan').GetBaseName], un poderoso señor de la guerra llamado [GetScriptedCharacterByHistoryID( 'POD_fae_character_09').GetFirstNameNicknamed] fue elegido para liderar a los fomoré en la batalla. En su juventud, Balor, que solo tenía un ojo, había espiado un rito solemne que tenía prohibido presenciar. Como castigo, el Ensueño le maldijo para que su ojo se convirtiera en algo terrorífico. Cada vez que se abría, una terrible luz roja brotaba de él, matando a todo lo que miraba. Tal como se profetizó, fue muerto por su propio nieto [GetScriptedCharacterByHistoryID( 'POD_fae_character_12').GetFirstNameNicknamed]."
 legend_varich: "El hijo del Sol y la Luna"
 legend_varich_desc: "Hace mucho tiempo, antes de que los sueños se hicieran añicos, [GetScriptedCharacterByHistoryID('POD_fae_character_19').GetFirstName] caminaba por las tierras del norte. Era el brillante y apuesto hijo de Miesiac, conocida como la Luna de cabellos plateados y ojos oscuros; y de Dazbóga el Sol, su orgullosa madre, con trenzas doradas que le llegaban hasta los pies y brillantes ojos de zafiro."
 legend_aesin: "Los Æsir y los Vanir"
 legend_aesin_desc: "Los [GetDynastyByID( 'POD_fae_dynasty_aesin' ).GetBaseName] descienden de los dioses de Asgard, los Æsir y los Vanir. Algunos incluso afirman descender de personajes tan notables como [GetScriptedCharacterByHistoryID('POD_fae_character_1024').GetFirstName] y [GetScriptedCharacterByHistoryID('POD_fae_character_1025').GetFirstName]."
 legend_mathonwy: "El legado de [ancestor.GetFirstNameNoTooltip]"
 legend_mathonwy_desc: "Rey de Gwynedd, Señor de Caer Dathal y un gran hechicero de los Tuatha de Danaan. La historia de los Mathonwy es la cuarta de las Cuatro Ramas del Mabinogi."
 legend_eshu: "[ancestor.GetFirstNameNicknamed]"
 legend_eshu_desc: "Después de que el gran Dios Olorun, el Orisha supremo, concibiera el mundo e hiciera que sus dos hijos, Obatala y Orunmila, lo diseñaran y ordenaran, envió a otro Orisha llamado [ancestor.GetFirstNameNoTooltip], su lingüista y mensajero, para recoger sacrificios para él. Eshu es el orisha con autoridad sobre los caminos y las puertas, y a quien le encanta causar travesuras. No es ni bueno ni malo, es simplemente él mismo. Gasta bromas porque es su forma de ser. Los buenos aprenden de sus bromas y los malvados sufren. Mientras estuvo en la tierra también engendró muchos hijos que más tarde se convertirían en los Eshu, compartiendo su nombre y sus deberes. Su progenie, desafortunadamente, llegó a robar su nombre para sí mismos, aunque sin malicia, y cuando Eshu oyó que los mortales trataban a sus parientes como si fueran él, supo que tenía que castigar a sus hijos descarriados o de lo contrario otros perderían sus nombres también y el mundo se desharía. Lo hizo a pesar de sentirse un poco orgulloso de todo lo que sus hijos habían logrado y de lo mucho que habían aprendido de él. Así que, tras observar para dar con el mejor castigo, reunió a todos sus hijos y les contó un gran y poderoso secreto y los convirtió en sus mensajeros para el mundo, ordenándoles con palabras de peso que enseñaran a sus hijos a seguir también sus caminos. Luego voló de regreso al cielo riendo. ¿La broma y el castigo? Consiguió que sus hijos hicieran su trabajo por él y que disfrutaran con ello."