 REED_OF_HIDDEN_CURRENTS_PERK_EFFECT: "Duración del efecto de la poción: #P +1#!\n#flavor La Momia imbuye un poco de heno, paja o hierba para detectar la presencia de otra sustancia específica.#!"
 SPARK_OF_RA_PERK_EFFECT: "Desbloquea movimientos de [single_combat_duel|E].\nBonus de probabilidad de herir a los [knights|E] enemigos cuando se esté en [combat_phase|E] como [knight|E].\n#flavor La Momia puede encender una sustancia inflamable con su Sekhem.#!"
