 PRINCELY_INERTION_PERK_EFFECT: "#flavor La Momia puede disipar cualquier efecto de nivel cinco en un objetivo material inanimado.#!"
 PRINCELY_REFLECTION_PERK_EFFECT: "Mejora [GetPerk('majestic_reflection_perk').GetName(GetPlayer)] al permitirte regalar [artifacts|E] #FAMEDBLUE Famosos#! a $POD_splat_wraith_plural$.\n#flavor La Momia puede encantar un objeto complejo de importancia para que pueda ser utilizado desde el [UmbraGlossaryLocalized('shadowlands','Underworld')].#!"
 PRINCELY_CREATURE_PERK_EFFECT: "#flavor La Momia crea una figurita de cualquier animal que actúa como sirviente. El animal conserva todas las habilidades y conocimientos de su creador.#!"
 PRINCELY_RELIC_PERK_EFFECT: "Mejora [GetPerk('greater_relic_perk').GetName(GetPlayer)] al aumentar la cantidad de fragmentos obtenidos de #V 2#! a #V 3#!.\n#flavor La Momia puede destruir un objeto en el mundo material para crear una versión de reliquia de alto nivel de este en el [UmbraGlossaryLocalized('shadowlands','Underworld')].#!"
 LIVING_BOND_OF_FATE_PERK_EFFECT: "Mejora [GetPerk('superior_chattel_perk').GetName(GetPlayer)] al permitirte equipar bienes muebles #ILLUSTRIOUSPURPLE Ilustres#! [artifacts|E].\n#flavor La Momia crea un vínculo simpático entre una efigie de una persona viva y su contraparte para influir en ella.#!"
