 BECALM_PERK_EFFECT: "Puede fortalecer o mitigar los desastres naturales.\nSe vuelve inmune a todos los [modifiers|E] de guerra celestial.\n#flavor La momia anula los efectos climáticos adversos en un radio de un brazo de distancia de sí misma.#!"
 WEATHER_SIGHT_PERK_EFFECT: "Puede predecir desastres naturales.\n#flavor La momia puede predecir el clima con gran precisión.#!"
 HANGING_THE_STARS_PERK_EFFECT: "#flavor La momia puede retrasar el efecto de un hekau hasta que ella lo invoque.#!"
 HIDING_THE_STARS_PERK_EFFECT: "#flavor La momia queda oculta ante hechizos de adivinación o localización.#!"
 LESSER_WEATHER_MAGIC_PERK_EFFECT: "Mejora [GetPerk('simple_weather_magic_perk').GetName(GetPlayer)] permitiéndole afectar a todo un [duchy|E].\n#flavor Como la Magia climática simple, pero la momia es capaz de provocar un cambio mayor.#!"
 WEATHER_WHISPERS_PERK_EFFECT: "#flavor la momia es capaz de oír conversaciones que ocurren a favor del viento desde su ubicación actual.#!"
 BOOK_OF_THOTH_PERK_EFFECT: "Recibirás una notificación si alguien tiene la intención de asesinar a tus amigos o familiares.\n#flavor Mediante el susurro de un encantamiento, la momia puede cobrar conciencia de los secretos en su entorno inmediato.#!"
 SAHU_RA_PERK_EFFECT: "Hiere a los [knights|E] y [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E], si son $POD_splat_vampire_plural$ (u otros [splats|E] que teman al sol).\n#flavor La momia brilla con el poder de la luz solar.#!"
 READ_THE_STARS_PERK_EFFECT: "Como [character_interaction|E], otorga a tu objetivo [GetModifier('POD_hekau_read_the_stars_modifier').GetNameWithTooltip] durante 5 años.\n#flavor La momia puede sintonizar su magia con las circunstancias, reforzando su esfuerzo para un ritual posterior.#!"
 MAJOR_WEATHER_MAGIC_PERK_EFFECT: "Mejora [GetPerk('lesser_weather_magic_perk').GetName(GetPlayer)] permitiéndole afectar a todo un [kingdom|E].\n#flavor Como la Magia climática simple, pero con efectos aún más poderosos.#!"
 CALL_THE_STARS_PERK_EFFECT: "Desbloquea la opción #V Lluvia de meteoritos#! en la [GetPerk('simple_weather_magic_perk').GetName(GetPlayer)] [character_interaction|E], reduciendo el nivel de [development|E] en #N 2#!.\n#flavor Al invocar a Nuit, la momia convoca una destructiva lluvia de meteoritos.#!"
 DIVINE_FORMS_PERK_EFFECT: "Como [character_interaction|E], otórgate a ti mismo un [modifier|E] que aumenta una [skill|E] de tu elección en #P +3#! #weak ([GetModifier('POD_hekau_divine_form_diplomacy_modifier').GetNameWithTooltip])#!.\n#flavor Al invocar a uno de los dioses, la momia puede elevar temporalmente uno de sus Atributos.#!"
 GREATER_WEATHER_MAGIC_PERK_EFFECT: "Mejora [GetPerk('major_weather_magic_perk').GetName(GetPlayer)] permitiéndole afectar a todo un [empire|E].\n#flavor Como la Magia climática simple, pero con efectos aún más poderosos.#!"
 SANDSTORM_PERK_EFFECT: "Desbloquea la opción #V Tormenta de arena#! en la [GetPerk('simple_weather_magic_perk').GetName(GetPlayer)] [character_interaction|E].\n#flavor La momia convoca un destructivo torbellino de arena.#!"
 READ_THE_TREE_OF_LIFE_PERK_EFFECT: "#flavor La momia puede leer el destino de cualquier ser, escudriñando su pasado o su futuro.#!"
 WISDOM_OF_ISIS_PERK_EFFECT: "Te vuelves inmune a la Magia climática.\nObtienes una alta resistencia a cualquier forma de magia.\n#flavor Al apelar a Isis, la momia puede contrarrestar la magia enemiga.#!"
 RAS_AWAKENING_PERK_EFFECT: "Todos tus [children|E] recibirán [GetModifier('POD_hekau_ras_awakening_modifier').GetNameWithTooltip].\n#flavor La momia canaliza el poder de Ra hacia hasta cinco objetivos.#!"
 POTENT_WEATHER_MAGIC_PERK_EFFECT: "Mejora [GetPerk('lesser_weather_magic_perk').GetName(GetPlayer)] permitiéndole afectar a todo un continente.\n#flavor El nivel más poderoso de magia climática disponible.#!"
 ROUSING_APOPHIS_PERK_EFFECT: "Mejora la opción de #V Lluvia de meteoritos#! de [GetPerk('call_the_stars_perk').GetName(GetPlayer)] a #V Apocalipsis temprano#!, reduciendo el [development|E] en un #N 5#!.\n#flavor La momia provoca un terremoto.#!"
 PLAGUE_OF_MAAT_PERK_EFFECT: "Como [character_interaction|E], convoca una [epidemic|E] mundana en la ubicación actual de tu objetivo.\n#flavor La momia puede invocar una de las Siete Plagas de Egipto.#!"
 DIVINE_GREATNESS_PERK_EFFECT: "Mejora [GetPerk('divine_forms_perk').GetName(GetPlayer)] aumentando el [modifier|E] a #P +6#! en lugar de #P +3#! #weak ([GetModifier('POD_hekau_divine_greatness_diplomacy_modifier').GetNameWithTooltip])#!.\n#flavor Como Formas Divinas, pero con efectos más poderosos.#!"
 GEBS_GRASP_PERK_EFFECT: "#flavor Este hechizo se dirige a cualquier súbdito dentro del campo de visión del lanzador. Aumenta la fuerza de gravedad que experimenta el sujeto.#!"
 INUNDATION_OF_THE_NILE_PERK_EFFECT: "La #V Inundación#! de [GetPerk('grip_the_water_perk').GetName(GetPlayer)] ya no tiene coste y dura más tiempo.\n#flavor El ritual puede causar inundaciones terribles o dejar un lecho de río seco con poco más que charcos estancados.#!"
 CALL_OF_THE_NORTH_STAR_PERK_EFFECT: "#flavor Este útil hechizo alinea las fuerzas magnéticas de la zona según la voluntad del mago.#!"
 FESTIVAL_OF_MAAT_PERK_EFFECT: "Como [character_interaction|E], convierte 500 de [piety_i] en 5 de [GetTrait('integrity').GetName(GetPlayer)] [trait_level_track_xp|E], o -50 de [static_stress|E] si no tienes [GetTrait('integrity').GetName(GetPlayer)].\n#flavor Obtén el bienestar de los celebrantes durante una duración limitada.#!"
 ARCH_OF_NUIT_PERK_EFFECT: "#flavor Este ritual potencia las influencias protectoras de Nuit al obstaculizar toda energía espiritual negativa.#!"
 CYCLE_OF_RA_PERK_EFFECT: "Desbloquea la opción de #V Ciclo de Ra#! en la [character_interaction|E] de [GetPerk('simple_weather_magic_perk').GetName(GetPlayer)].\n#flavor Este hechizo hace que el mago brille con la luz cegadora de Ra y que pulse rápidamente a través de sus ciclos de día y noche.#!"
 STAR_OF_THE_MESSIAH_PERK_EFFECT: "#flavor Este ritual otorga acceso temporal a las influencias mortales derivadas de aquellos que reciben señales de que el mago es, de algún modo, la clave de sus esperanzas y sueños.#!"
 WHISPERS_OF_THE_TREE_OF_LIFE_PERK_EFFECT: "Como [character_interaction|E], concédete [GetModifier('POD_hekau_whispers_of_the_tree_of_life_modifier').GetNameWithTooltip] durante 2 años.\n#flavor El flujo del Sekhem a través del universo transporta susurros de los secretos guardados por el Árbol de la Vida, y este hechizo permite a la momia escucharlos simplemente conectando con esta corriente mística.#!"
 CROSSED_BY_THE_STARS_PERK_EFFECT: "Como [character_interaction|E], inflige [GetModifier('POD_hekau_crossed_by_the_stars_modifier').GetNameWithTooltip] a tu objetivo.\n#flavor Los maestros del Hekau Celestial aprenden a derrotar a sus enemigos atándolos inexplicablemente a malos presagios, influencias negativas y «estrellas malignas».#!"
 
