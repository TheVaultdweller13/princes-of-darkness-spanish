 POTION_OF_VALOR_PERK_EFFECT: "Mejora [GetPerk('drink_of_seven_days_rest_perk').GetName(GetPlayer)] al sustituir [GetModifier('drink_of_seven_days_rest_modifier').GetNameWithTooltip] por [GetModifier('potion_of_valor_modifier').GetNameWithTooltip].\n#flavor La Momia crea una poción que permite a su receptor ignorar las penalizaciones por heridas durante un breve periodo de tiempo.#!"
 SALTS_OF_THE_DEAD_PERK_EFFECT: "Mejora [GetPerk('blood_of_the_snake_perk').GetName(GetPlayer)] al sustituir [GetModifier('blood_of_the_snake_modifier').GetNameWithTooltip] por [GetModifier('salts_of_the_dead_modifier').GetNameWithTooltip].\n#flavor La Momia puede ingerir sales especiales que la hacen inmune a ciertos tipos de daño que solo afectan a los vivos (como la falta de oxígeno).#!"
 TEARS_OF_ISIS_PERK_EFFECT: "Durabilidad de la poción [artifact|E]: #P +5#!\n#flavor La Momia puede destilar Sekhem en forma física, permitiendo que se almacene para un uso posterior.#!"
