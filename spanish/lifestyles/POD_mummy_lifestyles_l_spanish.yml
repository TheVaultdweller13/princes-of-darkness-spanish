 SIMPLE_CREATURE_PERK_EFFECT: "#flavor La Momia crea una pequeña figurita de un animal (por ejemplo, una rata o una rana) que actúa como sirviente.#!"
 SIMPLE_SERVITOR_PERK_EFFECT: "Como [character_interaction|E], dar o [modifier|E] dar una pequeña cantidad del recurso seleccionado[gold_i][prestige_i][piety_i][dynasty_prestige_i] a costa de #N 2#! de [stress|E] cada mes para ti mismo.\n#flavor La Momia crea un pequeño sirviente que puede ser asignado a tareas sencillas.#!"
 SIMPLE_WREST_PERK_EFFECT: "#flavor La Momia puede intentar arrebatar el control mágico de nivel uno sobre un constructo.#!"
 COMMAND_LESSER_IMPLEMENT_PERK_EFFECT: "#flavor Mediante la inscripción de jeroglíficos sencillos en un objetivo con objetos móviles, la Momia puede obtener el control sobre este y manipularlo desde lejos.#!"
 FALSE_DOOR_PERK_EFFECT: "#flavor La Momia puede crear una entrada en una pared, ya sea realizando un ritual o usando su Sekhem para forzar la pared hasta convertirla en una puerta.#!"
 LESSER_INERTION_PERK_EFFECT: "#flavor La Momia puede disipar cualquier efecto de nivel dos en un objetivo material inanimado.#!"
 LESSER_CHATTEL_PERK_EFFECT: "Como [character_interaction|E], copiar un [artifact|E] #COMMONBROWN Común#! no único.\n#flavor La momia puede fabricar una réplica en miniatura de un objeto sencillo (como una espada o un bote de remos) que puede convertirse en un objeto de tamaño real al activarse.#!"
 LESSER_CREATURE_PERK_EFFECT: "#flavor La Momia crea una pequeña figurita de un animal (como un gato o una víbora) que actúa como sirviente.#!"
 LESSER_WREST_PERK_EFFECT: "#flavor La Momia puede intentar arrebatar el control mágico de nivel dos sobre un constructo.#!"
 COMMAND_COMPLEX_IMPLEMENT_PERK_EFFECT: "#flavor Mediante la inscripción de jeroglíficos sencillos en un objetivo grande (como una casa), la Momia obtiene el control sobre su esencia espiritual.#!"
 MAJOR_INERTION_PERK_EFFECT: "#flavor La Momia puede disipar cualquier efecto de nivel tres en un objetivo material inanimado.#!"
 COMPLEX_CHATTEL_PERK_EFFECT: "Mejora [GetPerk('lesser_chattel_perk').GetName(GetPlayer)] al permitirle copiar [artifacts|E] #color_dark_green Maestros#! no únicos.\n#flavor La momia puede fabricar una miniatura de un objeto más complejo (como un coche o un arma) que puede convertirse en un objeto de tamaño real al activarse.#!"
 MAJOR_BOND_OF_FATE_PERK_EFFECT: "Permite equipar [artifacts|E] de tipo chattel #color_dark_green Maestros#!.\n#flavor La Momia crea un vínculo simpático entre una efigie de un objeto inanimado no mayor que una casa de tamaño medio y su contraparte para influir en ella.#!"
 EFFIGY_OVERSEER_PERK_EFFECT: "Mejora [GetPerk('simple_servitor_perk').GetName(GetPlayer)] al aumentar la cantidad de recursos obtenidos.\n#flavor La Momia crea una pequeña figurita que puede ser asignada para coordinar a varios sirvientes. Los supervisores son capaces de comprender órdenes más complejas.#!"
 MAJOR_CREATURE_PERK_EFFECT: "#flavor La Momia crea una figurita de un animal (como un perro o un mono) que actúa como sirviente.#!"
 MODEST_REFLECTION_PERK_EFFECT: "Permite regalar [artifacts|E] #COMMONBROWN Comunes#! a $POD_splat_wraith_plural$.\n#flavor La Momia puede encantar un objeto sencillo para que sea utilizable desde el [UmbraGlossaryLocalized('shadowlands','Inframundo')].#!"
 MAJOR_RELIC_PERK_EFFECT: "Como [character_interaction|E], destrozar un [artifact|E] en #V 1#! fragmento según su [rarity|E].\n#flavor La Momia puede destruir un objeto en el mundo material para crear una versión reliquia temporal de este en el [UmbraGlossaryLocalized('shadowlands','Inframundo')].#!"
 MAJOR_WREST_PERK_EFFECT: "#flavor La Momia puede intentar arrebatar el control mágico de nivel tres sobre un constructo.#!"
 MAJESTIC_REFLECTION_PERK_EFFECT: "Mejora [GetPerk('modest_reflection_perk').GetName(GetPlayer)] al permitirte regalar [artifacts|E] #color_dark_green Maestros#! a $POD_splat_wraith_plural$.\n#flavor La Momia puede encantar un objeto más complejo para que sea utilizable desde el [UmbraGlossaryLocalized('shadowlands','Inframundo')].#!"
 SUPERIOR_CHATTEL_PERK_EFFECT: "Mejora [GetPerk('complex_chattel_perk').GetName(GetPlayer)] al permitirle copiar [artifacts|E] #FAMEDBLUE Famosos#! no únicos.\n#flavor La momia puede fabricar una miniatura de un objeto complejo (como una aeronave o un ordenador) que puede convertirse en un objeto de tamaño real al activarse.#!"
 GREATER_RELIC_PERK_EFFECT: "Mejora [GetPerk('major_relic_perk').GetName(GetPlayer)] al aumentar la cantidad de fragmentos obtenidos de #V 1#! a #V 2#!.\n#flavor La Momia puede destruir un objeto en el mundo material para crear una versión reliquia permanente de este.#!"
 SUPERIOR_CREATURE_PERK_EFFECT: "#flavor La Momia crea una figurita de un animal (como un león o un cocodrilo) que actúa como sirviente.#!"
 GUARD_PERK_EFFECT: "Mejora [GetPerk('effigy_overseer_perk').GetName(GetPlayer)] al aumentar la cantidad de recursos obtenidos.\n#flavor La Momia crea una pequeña figurita armada que protegerá cualquier cosa que se le asigne hasta su destrucción.#!"
 SUPERIOR_INERTION_PERK_EFFECT: "#flavor La Momia puede disipar cualquier efecto de nivel cuatro en un objetivo material inanimado.#!"
 SUPERIOR_BOND_OF_FATE_PERK_EFFECT: "Mejora [GetPerk('major_bond_of_fate_perk').GetName(GetPlayer)] al permitirte equipar [artifacts|E] #FAMEDBLUE Famoso#!.\n#flavor La Momia crea un vínculo simpático entre una efigie de un objeto inanimado de cualquier tamaño y su contraparte para influir en ella.#!"
