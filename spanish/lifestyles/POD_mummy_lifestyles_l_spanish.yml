 spirit_the_body_away_perk_name: "Alejar el cuerpo"
 empower_ka_perk_name: "Potenciar el Ka"
 empower_ba_perk_name: "Potenciar el Ba"
 casting_away_perk_name: "Desechar"
 heart_of_reincarnation_perk_name: "Corazón de la reencarnación"
 transfixing_gaze_perk_name: "Mirada penetrante"
 separate_khaibit_perk_name: "Separar Khaibit"
 barring_the_gates_perk_name: "Cerrar las puertas"
 promise_made_before_ammuts_scales_perk_name: "Promesa hecha ante las balanzas de Ammit"
 unmaking_perk_name: "Deshacer"
 call_of_oblivion_perk_name: "Llamada del Olvido"
 
 DEATHS_SHROUD_PERK_EFFECT: "#flavor La Momia puede ocultar su alma mientras esté en el Duat colocando símbolos de protección en su corazón y sus ojos.#!"
 SEPARATE_KA_PERK_EFFECT: "#flavor La Momia puede separar su alma de su cuerpo, permitiéndole escapar al [UmbraGlossaryLocalized('shadowlands','Inframundo')].#!"
 GHOST_LANTERN_PERK_EFFECT: "#flavor La Momia transforma el Sekhem en un orbe de luz espectral que le guía en el [UmbraGlossaryLocalized('shadowlands','Inframundo')].#!"
 STORMWALK_PERK_EFFECT: "Ya no te perderás en la [UmbraGlossary('tempest')].\n#flavor La Momia puede orientarse en la siempre cambiante [UmbraGlossary('tempest')] bajo las [UmbraGlossary('shadowlands')] concentrándose en lugares familiares (como Amenti).#!"
 BODY_PRESERVATION_PERK_EFFECT: "#flavor Una Momia puede preservar su khat contra la decadencia consumiendo diversas mezclas y bañando el cuerpo en aceites y cremas.#!"
 JUDGE_THE_SOUL_PERK_EFFECT: "#flavor La Momia puede ver el alma de su objetivo y qué tan cerca está de alinearse con Ma'at. Las criaturas sobrenaturales también pueden identificarse con este hechizo.#!"
 SUMMON_THE_DEAD_PERK_EFFECT: "$POD_can_summon_wraith_trigger_loca$\n#flavor La Momia puede lanzar un llamado que convoca a un wraith específico que la Momia conozca. El Hechizo no otorga control sobre la criatura.#!"
 STORM_SHIELD_PERK_EFFECT: "#flavor Al canalizar su Sekhem, la Momia puede erigir protecciones contra las tormentas en el [UmbraGlossaryLocalized('shadowlands','Inframundo')], así como contra Espectros y criaturas similares.#!"
 FERTILITY_OF_OSIRIS_PERK_EFFECT: "#flavor El ritual permite que un varón muerto improgne a una mujer mortal viva.#!"
 REVISIT_DEATH_PERK_EFFECT: "Si alguno de tus parientes o amigos es asesinado en circunstancias misteriosas, conocerás a su asesino.\n#flavor Al tocar la piel de un cadáver, la Momia puede revivir las últimas experiencias de este cuerpo.#!"
 BANISH_THE_DEAD_PERK_EFFECT: "Ya no podrás ser poseído por $POD_splat_wraith_plural$.\n#flavor La Momia puede abjurar a un wraith que haya poseído un cuerpo mortal.#!"
 BIND_THE_DEAD_PERK_EFFECT: "Desbloquea a [GetMaA('wraiths').GetName] como [men_at_arms|E].\n$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#flavor La Momia puede obligar a un wraith a realizar una tarea específica.#!"
 SENSE_THE_DEAD_PERK_EFFECT: "#flavor La Momia puede sentir si un wraith la observa o está cerca.#!"
 MANIFESTATION_PERK_EFFECT: "Permite interactuar con personajes en la [UmbraGlossary('earth')] mientras permaneces en la [umbra|E].\n#flavor Mientras esté en el Duat, la Momia puede manifestar su alma como una aparición translúcida en el mundo de los vivos.#!"
 SEPARATE_BA_PERK_EFFECT: "#flavor La Momia puede entrar en cualquier [umbra|E] según desee.#!"
 SHADOW_PORTAL_PERK_EFFECT: "#flavor La Momia puede crear un portal dentro del [UmbraGlossaryLocalized('shadowlands','Inframundo')] que permita un movimiento rápido.#!"
 DEATHS_HAND_PERK_EFFECT: "#flavor La Momia puede canalizar el Plasma puro del [UmbraGlossaryLocalized('shadowlands','Inframundo')] contra sus enemigos con un toque.#!"
 BIND_THE_LIVING_PERK_EFFECT: "$POD_can_covert_to_wraith_trigger_loca$\n$POD_can_summon_on_death_trigger_loca$\n#flavor La Momia puede realizar un ritual que asegurará que la persona permanezca como un wraith.#!"
 AMENTIS_GRACE_PERK_EFFECT: "#flavor Con este ritual, una momia puede crear una protección para formar un [UmbraGlossary('shadow_realm')] temporal.#!"
 SIN_EATING_PERK_EFFECT: "Como opción de [execution|E], mata a un $POD_splat_wraith$ prisionero para perder 25 de [stress|E].\n#flavor La Momia puede absolver a un objetivo de impulsos negativos intensos o incluso de Pasiones Oscuras.#!"
 KHAIBITS_EMBRACE_PERK_EFFECT: "Desbloquea nuevas maniobras de [single_combat_duel|E].\n#flavor La Momia puede encerrar a un objetivo mortal en un ataúd de ectoplasma negro.#!"
 SEVER_SOUL_PERK_EFFECT: "Desbloquea a [GetMaA('walker').GetName], [GetMaA('shambler').GetName], [GetMaA('skeletons').GetName] y [GetMaA('dragons_teeth').GetName] como [men_at_arms|E].\n#flavor La Momia puede separar la conexión entre una criatura sobrenatural que ha abandonado su cuerpo y el cuerpo mismo.#!"
 HEART_OF_LIFE_PERK_EFFECT: "Permite interactuar con personajes en la [UmbraGlossary('earth')] mientras resucitas de la muerte.\n#flavor Tras cercenar una parte de su cuerpo, como una mano o su cabeza, la Momia puede reanimar esta parte cuando está en su ciclo de muerte para acceder al mundo de los vivos.#!"
 PANOPLY_OF_SHADOW_PERK_EFFECT: "#flavor Al invocar las fuerzas del [UmbraGlossary('oblivion')], la Momia puede envolverse en su propia sombra para convertirse en una criatura intangible que puede anular cualquier ataque físico.#!"
 SCOURING_OBLIVION_PERK_EFFECT: "Como [character_interaction|E], inflige [GetModifier('POD_hekau_scouring_oblivion_modifier').GetNameWithTooltip] a tu objetivo durante 5 años.\n#flavor La Momia puede curar a las criaturas vivas extrayendo la energía de la muerte de sus cuerpos.#!"
 ENTRAP_THE_BA_PERK_EFFECT: "#flavor La Momia puede atrapar el espíritu o el alma de un objetivo y sellarlo en un recipiente preparado específicamente.#!"
 CALL_THE_KHAIBIT_PERK_EFFECT: "Desbloquea a [GetMaA('spectres').GetName] como [men_at_arms|E].\nComo opción de [execution|E], mata a un prisionero ganando 2 de [trait_level_track_xp|E] de [GetTrait('integrity').GetName(GetPlayer)], o -10 de [static_stress|E] si no tienes [GetTrait('integrity').GetName(GetPlayer)].\n#flavor En el momento de la muerte, una Momia puede separar la Sombra de un alma, permitiéndole pasar mientras su khaibit permanece como un Espectro.#!"
 RESHAPE_THE_LOST_SOUL_PERK_EFFECT: "#flavor La Momia puede alterar las Pasiones de un wraith.#!"
 OPEN_THE_SEBKHET_PERK_EFFECT: "Puede manipular tanto el Manto como la Celosía.\n#flavor La Momia desgarra el Manto, permitiéndose a sí misma y a otras personas entrar en Duat.#!"
 KHU_OF_TWO_LANDS_PERK_EFFECT: "Te permite interactuar con seres de la [umbra|E] cuando estás en el mundo material.\n#flavor La Momia puede interactuar con el Mundo Material y el [UmbraGlossaryLocalized('shadowlands','Underworld')] sin penalización.#!"
 ASPECT_OF_DUAT_PERK_EFFECT: "Puede realizar un Cambio de Forma y mantener las formas transformadas mientras permanece en la [umbra|E].\n#flavor La Momia puede dar forma a su figura en el [UmbraGlossaryLocalized('shadowlands','Underworld')] según su voluntad.#!"
 EATING_THE_HEART_PERK_EFFECT: "Una vez cada #V 50#! años, puedes engañar a los Jueces de Ma'at durante tu proceso de resurrección para evitar el castigo.\n#flavor La Momia crea un corazón falso para engañar a los Jueces de Ma'at durante un periodo limitado de tiempo.#!"
 SHADOW_TALISMAN_PERK_EFFECT: "#flavor La Momia puede llevar el Amuleto que creó mediante el Amuleto Hekau al [UmbraGlossaryLocalized('shadowlands','Underworld')].#!"
 LIGHTEN_THE_SHADOW_PERK_EFFECT: "Mejora [GetPerk('scouring_oblivion_perk').GetName(GetPlayer)] eliminando también a [GetTrait('spectre').GetName(GetNullCharacter)], [GetTrait('shadow').GetName(GetNullCharacter)] o [GetTrait('wight').GetName(GetNullCharacter)].\n#flavor La Momia puede calmar los lados más oscuros de un objetivo, por ejemplo, sacando a un vampiro del Frenesí.#!"
 GIFT_OF_PURPOSE_PERK_EFFECT: "#flavor La Momia puede transferir partes de su propio impulso interno a un objetivo.#!"
 SPEAR_OF_ANUBIS_PERK_EFFECT: "Desbloquea nuevas maniobras de [single_combat_duel|E].\n#flavor Al abrirse la palma de la mano, la Momia puede manifestar el poder del [UmbraGlossary('oblivion')] en una lanza oscura que inflige Daño Agravado y elude cualquier protección mundana.#!"
 LOYAL_COMPANION_PERK_EFFECT: "Tus mascotas y caballos de guerra resucitarán cuando mueran.\n#flavor Tras momificar a un animal específicamente leal, la Momia puede resucitarlo como un sirviente espectral.#!"
 CALL_FORTH_THE_REAVERS_OF_UR_PERK_EFFECT: "Puede reclutar a [GetMaA('the_reavers_of_ur').GetName] como [men_at_arms|E].\n#flavor La Momia convoca una horda de horribles formas grises y ondulantes desde un lugar desconocido para despachar de forma espantosa a sus enemigos.#!"
 DARK_WALL_OF_HATSHEPSUT_PERK_EFFECT: "#flavor Desarrollado por los Shemsu-Heru Hatshepsut como una pequeña variación del Rito del Rey Sol, este hechizo crea un muro de Sekhem que impide que cualquier espíritu lo cruce y eleva el Manto local.#!"
 WALKING_IN_THE_SHADOW_OF_ANUBIS_PERK_EFFECT: "#flavor La Momia puede viajar instantáneamente a través de los diferentes mundos de la Teluria, siempre que conozca su existencia.#!"
 SPIRIT_THE_BODY_AWAY_PERK_EFFECT: "#flavor La Momia puede convertir la carne muerta en plasma, transportando su cuerpo a través del Manto.#!"
 EMPOWER_KA_PERK_EFFECT: "#flavor La Momia fortalece su ka para proteger su cuerpo de manera más eficiente durante su ciclo de muerte.#!"
 EMPOWER_BA_PERK_EFFECT: "#flavor La Momia puede fortalecer su ba para regresar más rápidamente a su cadáver.#!"
 CASTING_AWAY_PERK_EFFECT: "Como [character_interaction|E], lanza a tu objetivo al [UmbraGlossary('tempest')] tras una prueba de [prowess|E]. Si no tiene acceso al [UmbraGlossaryLocalized('shadowlands','Underworld')], morirá.\n#flavor La Momia puede arrojar a su objetivo a los vientos embravecidos de la [UmbraGlossary('tempest')].#!"
 HEART_OF_REINCARNATION_PERK_EFFECT: "Cada #V 25#! años, gana [GetModifier('extra_life_1_modifier').GetNameWithTooltip] si aún no lo tienes. Esto eludirá el proceso normal de resurrección de las $POD_splat_mummy_plural$.\n#flavor Al infundir un objeto pequeño con su esencia, la momia puede evitar la destrucción total de su cuerpo reencarnando en el hijo de la próxima mujer que toque el objeto.#!"
 TRANSFIXING_GAZE_PERK_EFFECT: "#flavor Con una mirada penetrante, la Momia puede agitar el Khaibit de un objetivo, paralizándolo durante un breve periodo de tiempo.#!"
 SEPARATE_KHAIBIT_PERK_EFFECT: "Como [character_interaction|E], te permite crear un clon de ti mismo.\n#flavor La Momia puede separar su propio khaibit, transformándolo en una criatura similar a un [GetTrait('spectre').GetName( GetNullCharacter )] que actúa por mandato de su creador.#!"
 BARRING_THE_GATES_PERK_EFFECT: "Como [character_interaction|E], manipula el Manto para todo un señorío.\n#flavor La Momia puede aumentar la fuerza del Manto local para evitar cualquier incursión de wraiths.#!"
 PROMISE_MADE_BEFORE_AMMUTS_SCALES_PERK_EFFECT: "Como [character_interaction|E], otorga a tu objetivo [GetModifier('extra_life_1_modifier').GetNameWithTooltip] mientras ganas 2 de Memoria $POD_splat_mummy$ [trait_level_track_xp|E].\n#flavor La Momia puede transferir un fragmento del Hechizo de la Vida a un mortal dispuesto tras consultar el caso con los Jueces de Ma'at.#!"
 UNMAKING_PERK_EFFECT: "Como opción de [execution|E], mata permanentemente a un prisionero, eludiendo cualquier medio de resurrección.\n#flavor La Momia puede arrojar cualquier cosa al pozo del vacío, borrándola de la existencia.#!"
 CALL_OF_OBLIVION_PERK_EFFECT: "Como [character_interaction|E], lanza a tu objetivo al [UmbraGlossary('oblivion')], borrándolo de la existencia tras una prueba de [prowess|E]. Solo funciona con objetivos no inmortales.\n#flavor La Momia obliga inmediatamente al alma de su objetivo a salir de su cuerpo, pasando al destino que le aguarde.#!"
 
