 mantle_of_divine_authority_perk_name: "Manto de Autoridad Divina"
 walk_the_barriers_perk_name: "Caminar por las Barreras"
 plague_curing_method_perk_name: "Método para curar la peste"
 ten_paces_strike_perk_name: "Golpe de diez pasos"
 fengtan_godbody_of_the_celestial_emperor_perk_name: "Cuerpo divino del Emperador Celestial"
 restoration_of_youths_vigor_perk_name: "Restauración del vigor de la juventud"
 transcendant_living_flame_perk_name: "Llama viva trascendente"
 gentle_typhoons_passing_perk_name: "El paso del tifón suave"
 
 SEE_THE_LANDS_OF_THE_SPIRIT_PERK_EFFECT: "#flavor Con este hechizo, el Wu T'ian puede entrar en la Umbra.#!"
 SENSE_LUCKS_FLOW_PERK_EFFECT: "#flavor Un Wu T'ian con este hechizo puede sentir las fluctuaciones del joss, discerniendo la buena o mala suerte que rodea a las personas, lugares y eventos.#!"
 BODY_MENDING_TECHNIQUE_PERK_EFFECT: "Como [character_interaction|E], sana a tu objetivo.\n#flavor La Técnica de Reparación Corporal permite a un inmortal sanar el daño causado por lesiones o enfermedades mediante medios rituales.#!"
 LINGERING_AID_OF_THE_CAREGIVER_PERK_EFFECT: "#flavor Un inmortal con este ritual puede transferir suficiente energía para que su paciente siga sanando a un ritmo acelerado incluso si se aleja de su lado.#!"
 SWEET_DREAMSS_CARESS_PERK_EFFECT: "Como [character_interaction|E], haz que tu objetivo pierda 50 de [static_stress|E].\n#flavor Al contrarrestar el agotamiento con la estimulante vitalidad de la energía Yang pura, la Caricia del Dulce Sueño permite a un inmortal desterrar su propia fatiga o la de otro presionando ligeramente sus dedos en los puntos principales de acupuntura.#!"
 SNAKE_FIST_STRIKE_PERK_EFFECT: "#flavor Para contrarrestar las capacidades regenerativas de los demonios y otros sobrenaturales, un Wu T'ian puede usar este hechizo para acelerar místicamente sus golpes y transformar su cuerpo en un arma mortal.#!"
 CALL_THE_SPIRITS_PERK_EFFECT: "Desbloquea [men_at_arms|E] Elementales y de Espíritus.\n#flavor Este hechizo permite a un inmortal invocar espíritus elementales y de la naturaleza.#!"
 SPIRIT_LANTERN_PERK_EFFECT: "#flavor Con un gesto, un Wu T'ian con Linterna Espiritual puede formar una bola de llama fantasmagórica en la palma de su mano, iluminando su entorno con una suave luz dorada que asusta a los demonios y a otros seres impuros.#!"
 LEAPING_TIGER_POUNCE_PERK_EFFECT: "#flavor Cargando sus músculos con energía, un Wu T'ian con este hechizo puede saltar distancias asombrosas.#!"
 DRUNKEN_MONKEY_DANCE_PERK_EFFECT: "#flavor Balanceándose y dando tumbos como si estuviera completamente ebrio, un Wu T'ian bajo los efectos de este hechizo evita de algún modo los puñetazos, las balas y cualquier otra violencia dirigida hacia él con una facilidad que desconcierta y frustra a sus oponentes.#!"
 STORMWIND_PRANA_PERK_EFFECT: "#flavor Basándose en el principio del movimiento que encarna la esencia del Yang, los Wu T'ian emplean esta familia de hechizos para aumentar drásticamente su velocidad.#!"
 BIND_THE_DEMONS_SERVANT_PERK_EFFECT: "Como [character_interaction|E], [POD_banish|E] a un $POD_splat_fae$, $POD_splat_demon$ o $POD_splat_wraith$ [imprisoned|E] a su señorío nativo.\n#flavor Este hechizo permite a un inmortal desterrar o vincular a espíritus menores y demonios de los Reinos Yang.#!"
 OPENING_THE_THIRD_EYE_PERK_EFFECT: "Como [character_interaction|E], otorga un #P +5#! a todas las [skills|E] (excepto a la [prowess|E], que gana #P +10#!) a un [GetTrait('mortal').GetName(GetPlayer)] o $POD_splat_hunter$. Además, los convierte en [GetTrait('sorcerer').GetName(GetPlayer)].\n#flavor Con este hechizo, un Wu T'ian puede perforar el Velo y despertar a los mortales al mundo oculto de los shen.#!"
 THE_CLEARING_OF_THE_WAY_PERK_EFFECT: "Puede manipular la Celosía.\n#flavor Con este hechizo, el Wu Feng puede manipular la estadística de Muro en su entorno inmediato.#!"
 FLAME_HAND_STRIKE_PERK_EFFECT: "#flavor Con sus manos envueltas en un aura de Chi ardiente, un inmortal con este hechizo baña a sus enemigos en fuego con cada toque.#!"
 ELEGANT_CRANE_DEFTNESS_PERK_EFFECT: "#flavor Impulsados por su Chi Yang, los Wu T'ian con este arte se vuelven sobrenaturalmente ligeros y ágiles, capaces de mantener el equilibrio sin esfuerzo en las repisas más estrechas, correr sobre superficies inestables como el agua o las arenas movedizas, o usar las hojas de un árbol para sostener su peso al escalar.#!"
 MANTLE_OF_DIVINE_AUTHORITY_PERK_EFFECT: "#flavor Al invocar el mandato del [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] y la fiel Administración de los Ocho Inmortales, un Wu T'ian que se atreva a pronunciar las palabras celestiales de poder en el núcleo de este hechizo invoca la autoridad y el poder justo del Trono de Jade.#!"
 WALK_THE_BARRIERS_PERK_EFFECT: "#flavor Caminar por las Barreras permite a un inmortal transferir su forma física al Reino Yang.#!"
 PLAGUE_CURING_METHOD_PERK_EFFECT: "Mejora [GetPerk('body_mending_technique_perk').GetName(GetPlayer)] reduciendo el coste tres veces.\n#flavor Con este hechizo, el Wu T'ian puede transferir energía Yang al cuerpo de un paciente tras atenderlo durante al menos 15 minutos.#!"
 TEN_PACES_STRIKE_PERK_EFFECT: "#flavor Al omitir la necesidad habitual de contacto físico, un Wu T'ian con este hechizo puede proyectar invisiblemente la fuerza de un único ataque de Artes Marciales a través de una distancia intermedia mediante el poder de su Chi concentrado.#!"
 GODBODY_OF_THE_CELESTIAL_EMPEROR_PERK_EFFECT: "#flavor Al recordar la majestad de los [Glossary('Wan Xian','game_concept_kuei_jin_desc')] antes de su caída en desgracia, el Cuerpo Divino del Emperador Celestial rodea a su lanzador en un nimbo de luz plateada que ilumina el camino ante el Wu T'ian, induce un estado mental en los mortales similar a la Niebla y obliga a los sobrenaturales corrompidos a huir.#!" 
 RESTORATION_OF_YOUTHS_VIGOR_PERK_EFFECT: "Como una [character_interaction|E], otorga un [GetTrait('mortal').GetName(GetPlayer)] o $POD_splat_hunter$ [GetModifier('tan_restoration_of_youths_vigor_modifier').GetNameWithTooltip].\n#flavor Los maestros de Feng Tan pueden realizar el milagro del renacimiento del Fénix para deshacer los estragos del tiempo y renovar la vitalidad de la juventud de un mortal.#!"
 TRANSCENDANT_LIVING_FLAME_PERK_EFFECT: "Como una [character_interaction|E], otorga a un [GetTrait('mortal').GetName(GetPlayer)] o $POD_splat_hunter$ [GetModifier('extra_life_1_modifier').GetNameWithTooltip], reduciendo tu [piety_level|E] en 1.\n#flavor Con este hechizo de último recurso, el Wu T'ian puede restaurarse a sí mismo o a un aliado a su salud completa, siempre que el Cielo considere que la situación es lo suficientemente desesperada.#!"
 GENTLE_TYPHOONS_PASSING_PERK_EFFECT: "#flavor Invocado durante el combate, el paso del Gentil Tifón transforma al maestro de Feng Tan en el ojo de una calma perfecta en el corazón de un furioso torbellino de puños.#!"
 
