 protect_against_the_demon_perk_name: "Protección contra el Demonio"
 scroll_of_the_minds_eye_perk_name: "Pergamino del ojo de la mente"
 blur_the_mind_perk_name: "Nublar la Mente"
 whispering_stones_perk_name: "Piedras Susurrantes"
 death_touch_perk_name: "Toque de Muerte"
 eye_of_the_tempest_perk_name: "Ojo de la Tempestad"
 lungtan_godbody_of_the_celestial_emperor_perk_name: "Cuerpo divino del Emperador Celestial"
 tread_the_dragon_tracks_perk_name: "Recorrer las Sendas del Dragón"
 
 STILL_THE_FLUTTERING_WING_PERK_EFFECT: "#flavor Los objetivos afectados por Saltea el Viento Agitado sufren una breve parálisis.#!"
 THE_WAY_OF_THE_CALM_SOUL_PERK_EFFECT: "#flavor El Camino del Alma Calma permite a un Wu T'ian mitigar estados de pánico o ansiedad (como el Frenesí) en un individuo.#!"
 IRON_BODY_MEDITATION_PERK_EFFECT: "#flavor La Meditación del Cuerpo de Hierro permite a un Wu T'ian canalizar energía yin a través de su carne, fortaleciendo su cuerpo contra las heridas mediante la meditación durante una hora.#!"
 HUNDRED_SHADOW_CLOUD_PERK_EFFECT: "#flavor Con este hechizo, un Wu T'ian puede hacer que una densa nube de oscuridad espectral brote de su sombra como una niebla negra.#!"
 LUNGTAN_UNSEEN_PASSAGE_PERK_EFFECT: "#flavor Al iniciar este hechizo, el Xian Lung puede usar su rango Arcano para permanecer anónimo y ser una persona casi sin rostro.#!"
 LESSER_SPIRIT_PROJECTION_PERK_EFFECT: "#flavor Con este hechizo, el Wu T'ian puede entrar en el [UmbraGlossaryLocalized('shadowlands','Underworld')].#!"
 ICE_HAND_STRIKE_PERK_EFFECT: "#flavor Envolviendo sus manos en un nimbo azul de yin gélido, un Wu T'ian bajo los efectos de este hechizo deja tras de sí un frío entumecedor con cada golpe.#!"
 NO_MIND_KATA_PERK_EFFECT: "#flavor Al despejar su mente y permitir que la serenidad del Tao le envuelva, un Wu T'ian con este hechizo puede ejercer su voluntad para realizar hazañas verdaderamente sobrehumanas en un área previamente elegida.#!"
 EBON_BONDS_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#flavor Con una palabra y un gesto, un inmortal puede conjurar cintas negras místicas de la propia sombra de un objetivo para atraparlo en vínculos tan suaves como la seda y fuertes como el acero.#!"
 KNOW_THE_WANDERING_SOUL_PERK_EFFECT: "#flavor Con este Ritual, el Xian Lung puede obtener información incluso de los mortales, animales y espíritus más extraños.#!"
 SHIELD_OF_FORTUNE_PERK_EFFECT: "#flavor El Xian Lung puede envolverse en joss, provocando mala suerte en aquellos que deseen hacerle daño.#!"
 PROJECTION_OF_INWARD_BEING_PERK_EFFECT: "#flavor Con este hechizo, un Wu T'ian puede desenmascarar a un ser sobrenatural oculto infundiendo la sombra de un objetivo con Chi para que adopte la forma del verdadero ser de su dueño (forma Crinos para los Hengeyokai, Mien para los Hsien, etc.).#!"
 GHOST_WALKING_METHOD_PERK_EFFECT: "#flavor Al invocar este hechizo, el Xian Lung se vuelve indetectable para varios sentidos elegidos.#!"
 BRAMBLES_ON_THE_ROAD_PERK_EFFECT: "Puede manipular el Manto.\n#flavor Al usar este Ritual, el Xian Lung puede aumentar la puntuación del Manto en su vecindad.#!"
 PROTECT_AGAINST_THE_DEMON_PERK_EFFECT: "Ya no puedes ser poseído por $POD_splat_wraith_plural$.\n#flavor Con este ritual, el Xian Lung puede crear protecciones que impiden que los demonios y otros sirvientes de los [Glossary('Yama Kings','podgloss.yamaking')] entren en un área.#!"
 SCROLL_OF_THE_MINDS_EYE_PERK_EFFECT: "Como una [character_interaction|E], otorga a tu objetivo [GetModifier('tan_scroll_of_the_minds_eye_modifier').GetNameWithTooltip] durante 20 años.\n#flavor Con este ritual, el Xian Lung se prepara para la [Glossary('Sixth Age','game_concept_sixth_age_desc')].#!"
 BLUR_THE_MIND_PERK_EFFECT: "#flavor Al invocar este hechizo, el Xian Lung puede hacer que su víctima olvide los sucesos ocurridos en su vecindad reciente.#!"
 WHISPERING_STONES_PERK_EFFECT: "#flavor Con este Ritual, el Xian Lung puede registrar memorias de los muertos del [UmbraGlossary('tempest')] para traducir documentos en lenguas desconocidas o extintas.#!"
 DEATH_TOUCH_PERK_EFFECT: "Como una [character_interaction|E], otorga a tu objetivo [GetModifier('tan_death_touch_modifier').GetNameWithTooltip] con un coste de 100 [static_stress|E].\n#flavor Reservado solo para los demonios más terribles, el legendario dim mak permite a los maestros del Lung Tan interrumpir catastróficamente el flujo de Chi de un único objetivo, lisiando o matando con un solo toque.#!"
 EYE_OF_THE_TEMPEST_PERK_EFFECT: "#flavor Al meditar y dejar ir todo miedo y duda, la calma interior del Xian Lung puede incluso aplacar las tormentas, o crear una «burbuja» protegida si la tormenta resulta ser demasiado feroz.#!"
 TREAD_THE_DRAGON_TRACKS_PERK_EFFECT: "Como una [character_interaction|E], te permite teletransportar a tu ejército a la ubicación de tu objetivo, o teletransportarte a tu próximo destino cuando viajas.\n#flavor Con este Ritual, el Xian Lung puede sintonizar su Chi interior con el flujo de una Línea de Dragón cercana y viajar a un nido de dragón en cuestión de segundos tras pasar una hora meditando dentro de un nido de dragón o a lo largo de una Línea de Dragón.#!"
 