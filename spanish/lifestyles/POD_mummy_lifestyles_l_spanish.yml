 ASKING_THE_TREES_PERK_EFFECT: "Como [character_interaction|E], invoca uno de tus [Glossary('True Names','podgloss.truename')] conocidos de flora para estimular su crecimiento, aplicando un [modifier|E] de condado positivo o negativo al lugar de tu objetivo.\n#flavor Los Amenti pueden controlar la vida vegetal hasta cierto grado.#!"
 FORGETTING_THE_STONE_PERK_EFFECT: "Como [character_interaction|E], invoca uno de tus [Glossary('True Names','podgloss.truename')] conocidos de metal para aniquilarlo en un área, aplicando un [modifier|E] de condado negativo al lugar de tu objetivo.\n#flavor Los Amenti pueden hacer que ciertos materiales inorgánicos desaparezcan.#!"
 FORGETTING_THE_TREE_PERK_EFFECT: "Como [character_interaction|E], invoca uno de tus [Glossary('True Names','podgloss.truename')] conocidos de flora para aniquilarlo en un área, aplicando un [modifier|E] de condado positivo o negativo al lugar de tu objetivo.\n#flavor Los Amenti pueden hacer que materiales orgánicos, como la madera, desaparezcan.#!"
 NAME_THE_SECRET_PERK_EFFECT: "#flavor Los Amenti pueden divino debilidades ocultas estudiando el Nombre Verdadero de un objetivo.#!"
 NAMING_THE_WARNING_PERK_EFFECT: "#flavor Mediante la entonación de sílabas de su Nombre Verdadero, los Amenti pueden ahuyentar a sus enemigos.#!"
 BECOMING_THE_STONE_PERK_EFFECT: "Como [character_interaction|E], realiza un Cambio de Forma en metales cuyo [Glossary('True Name','podgloss.truename')] conozcas.\n#flavor Los Amenti pueden transformar su carne en un mineral cuyo Nombre Verdadero conozcan.#!"
 BECOMING_THE_TREE_PERK_EFFECT: "Como [character_interaction|E], realiza un Cambio de Forma en flora cuyo [Glossary('True Name','podgloss.truename')] conozcas.\n#flavor Los Amenti pueden transformar su carne en una planta.#!"
 CLOUD_THE_NAME_PERK_EFFECT: "Hazte inmune al viaje «Aprender el Nombre Verdadero» [journey|E].\n#flavor Los Amenti pueden oscurecer su propio Nombre Verdadero, ocultándose de los enemigos que también usan este arte.#!"
 COMMAND_THE_BEAST_PERK_EFFECT: "Puede reclutar [men_at_arms|E] animales siempre que conozcas su [Glossary('True Name','podgloss.truename')].\n#flavor Los Amenti pueden someter a un animal a su servicio.#!"
 MEND_FLESH_PERK_EFFECT: "Como [character_interaction|E], sana una herida [trait|E] cuyo [Glossary('True Name','podgloss.truename')] conozcas.\n#flavor Los Amenti pueden ordenar que el tejido vuelva a unirse.#!"
 BECOME_ANIMAL_PERK_EFFECT: "Como [character_interaction|E], realiza un Cambio de Forma en un animal cuyo [Glossary('True Name','podgloss.truename')] conozcas.\n#flavor Los Amenti pueden transformarse en un animal cuyo Nombre Verdadero hayan divinado.#!"
 COMMAND_THOUGHT_PERK_EFFECT: "Puede usar el viaje «Aprender el Nombre Verdadero» [journey|E].\n#flavor Los Amenti pueden emitir una orden verbal que un objetivo con conciencia está obligado a seguir.#!"
 NAME_THE_HEKAU_PERK_EFFECT: "#flavor Los Amenti pueden desentrañar otros artes sobrenaturales dirigidos contra ellos.#!"
 WHISPERS_TO_THE_HEART_PERK_EFFECT: "#flavor Los Amenti pueden inspirar cualquier emoción en un objetivo.#!"
 HEKAU_ENSLAVE_PERK_EFFECT: "Al aprender el [Glossary('True Name','podgloss.truename')] de un personaje, haz que te ame #weak (+200 opinión)#!.\n#flavor Los Amenti pueden vincular a un objetivo a su voluntad durante un periodo prolongado.#!"
 FORTIFY_FLESH_PERK_EFFECT: "#flavor Los Amenti pueden otorgar a su piel las cualidades de la piedra.#!"
 NAMING_THE_BODYS_DESTRUCTION_PERK_EFFECT: "Como [character_interaction|E], inflige una herida [trait|E] cuyo [Glossary('True Name','podgloss.truename')] conozcas a tu objetivo.\n#flavor Los Amenti pueden atacar partes del cuerpo de sus enemigos pronunciando sus Nombres Verdaderos y ordenándoles que se marchiten.#!"
 SPEAKING_ALL_NAMES_PERK_EFFECT: "#flavor Los Amenti pueden adquirir un vocabulario inmediato en cualquier idioma gracias a su conocimiento de los Nombres Verdaderos.#!"
 FORGETTING_THE_NAME_PERK_EFFECT: "Como [character_interaction|E], borra de la existencia a un personaje cuyo [Glossary('True Name','podgloss.truename')] conozcas.\n#flavor Los Amenti pueden borrar el Nombre Verdadero de un objetivo, desterrándolo de la existencia y eliminando todos los registros.#!"
 PTAHS_WORD_PERK_EFFECT: "#flavor Los Amenti pueden crear un objeto pequeño e inanimado pronunciando su Nombre Verdadero.#!"
 WHISPERS_TO_THE_BODY_PERK_EFFECT: "Como [character_interaction|E], cambia tus [traits|E] físicos siempre que conozcas su [Glossary('True Name','podgloss.truename')].\n#flavor Los Amenti pueden remodelar su propia forma pronunciando su Nombre Verdadero y ordenándole que haga lo que deseen.#!"
 WORDS_OF_AUTHORITY_PERK_EFFECT: "#flavor Los Amenti pronuncian una frase que todos los que la oyen están obligados a cumplir de la mejor manera posible.#!"
 ECHO_THE_LESSER_NAME_PERK_EFFECT: "#flavor Los Amenti pueden llegar a comprender el Nombre Verdadero de las cosas o conceptos básicos simplemente escuchando la resonancia transportada por Sekhem.#!"
 NAME_OF_SEKHEM_PERK_EFFECT: "Cada mes, pierdes 5 [stress|E].\n#flavor Los Amenti pueden comandar a Sekhem, atrayéndolo hacia sí para reponer sus propias reservas, o dirigiéndolo hacia un aliado.#!"
 NAME_OF_SKILL_PERK_EFFECT: "#flavor Los Amenti pueden aprender o mejorar una habilidad mediante el conocimiento de un Nombre Verdadero relevante.#!"
 RIDDLE_OF_THE_SPHINX_PERK_EFFECT: "#flavor Los Amenti pueden hacer una pregunta e infundir la necesidad de responderla en un objetivo.#!"
 BECOMING_THE_PERSON_PERK_EFFECT: "Mejora [GetPerk('whispers_to_the_body_perk').GetName(GetPlayer)] al permitirte también cambiar la personalidad, el estrés y la salud [traits|E].\n#flavor Al utilizar el Nombre Verdadero de una persona, el Amenti se convierte en esa persona, ganando verdaderamente una comprensión de cómo es este individuo.#!"
 ECHO_THE_GREATER_NAME_PERK_EFFECT: "#flavor Los Amenti pueden llegar a comprender el Nombre Verdadero de cosas o conceptos más complejos.#!"
 NAME_OF_THE_ATTRIBUTE_PERK_EFFECT: "#flavor Los Amenti pueden aumentar sus atributos utilizando su Nombre Verdadero.#!"
 NAMES_OF_THE_FORGOTTEN_PERK_EFFECT: "Can reclutar a [GetMaA('the_lost_ancients').GetName] como [men_at_arms|E].\n#flavor Mediante una diligente investigación, el Amenti puede crear un Nombre Verdadero para un ser que ha perdido el suyo.#!"
 NAME_OF_THE_WILL_PERK_EFFECT: "Cada mes, pierdes 7 de [stress|E].\n#flavor El Amenti puede aumentar su Fuerza de Voluntad utilizando su Nombre Verdadero.#!"
 RENAMING_THE_HEKAU_PERK_EFFECT: "Desbloquea una decisión que te permite aprender #V 1#! habilidad de otro [splat|E].\n#flavor El Amenti puede reorganizar las leyes de un poder sobrenatural específico, por ejemplo, redefiniendo la Disciplina de un vampiro o el paradigma de un mago.#!"
 
