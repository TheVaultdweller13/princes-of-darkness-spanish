 COMPLEX_PHILTRE_PERK_EFFECT: "Mejora [GetPerk('essence_longing_perk').GetName(GetPlayer)] al sustituir [GetModifier('essence_longing_modifier').GetNameWithTooltip] por [GetModifier('complex_philtre_modifier').GetNameWithTooltip].\n#flavor La Momia crea un filtro superior, que induce una emoción más duradera.#!"
 COMPLEX_TONIC_PERK_EFFECT: "Mejora [GetPerk('simple_tonic_perk').GetName(GetPlayer)] al sustituir [GetModifier('simple_tonic_modifier').GetNameWithTooltip] por [GetModifier('complex_tonic_modifier').GetNameWithTooltip].\n#flavor La Momia crea un tónico más avanzado con mayores capacidades de curación.#!"
 DANGEROUS_POISON_PERK_EFFECT: "Mejora [GetPerk('cobra_spit_perk').GetName(GetPlayer)] al sustituir [GetModifier('cobra_spit_modifier').GetNameWithTooltip] por [GetModifier('dangerous_poison_modifier').GetNameWithTooltip].\n#flavor La Momia crea un veneno más eficiente.#!"
