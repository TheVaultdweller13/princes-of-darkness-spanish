 ANALYZE_MATERIAL_PERK_EFFECT: "Duración del efecto de la pócima: #P +1#!\n#flavor La Momia puede obtener información sobre la composición de un objeto.#!"
 CLOUD_OF_SMOKE_PERK_EFFECT: "#flavor La Momia hace que un fuego emita una densa nube de humo negro lanzando un polvo preparado en él.#!"
 DRINK_OF_SEVEN_DAYS_REST_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('drink_of_seven_days_rest_modifier').GetNameWithTooltip]\n#flavor Esta pócima alivia la fatiga de quien la bebe, sanándolo de daños menores.#!"
 MILD_POISON_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('mild_poison_modifier').GetNameWithTooltip]\n#flavor La Momia crea un veneno menor que puede ser bastante letal.#!"
 POTION_OF_RESILIENCE_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('potion_of_resilience_modifier').GetNameWithTooltip]\n#flavor Esta pócima actúa como un anestésico sobrenatural.#!"
 SIMPLE_ELIXIR_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('simple_elixir_diplomacy_modifier').GetNameWithTooltip]\n#flavor La Momia crea un Elixir, una pócima menor que potencia un único atributo durante su duración.#!"
 SIMPLE_PHILTRE_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('simple_philtre_modifier').GetNameWithTooltip]\n#flavor La Momia crea un filtro, una sustancia menor que induce una emoción específica en su objetivo.#!"
 SIMPLE_TONIC_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('simple_tonic_modifier').GetNameWithTooltip]\n#flavor La Momia crea un ungüento o pócima curativa.#!"
 STASIS_PERK_EFFECT: "Durabilidad de la poción [artifact|E]: #P +5#!\n#flavor La Momia impide que un solo material sea alterado por fuerzas externas.#!"
 BLOOD_OF_THE_SNAKE_PERK_EFFECT: "Mejora [GetPerk('potion_of_resilience_perk').GetName(GetPlayer)] al sustituir [GetModifier('potion_of_resilience_modifier').GetNameWithTooltip] por [GetModifier('blood_of_the_snake_modifier').GetNameWithTooltip].\n#flavor La Momia crea un antídoto que protege contra cualquier veneno natural o cura el daño causado por venenos.#!"
 COBRA_SPIT_PERK_EFFECT: "Mejora [GetPerk('mild_poison_perk').GetName(GetPlayer)] al sustituir [GetModifier('mild_poison_modifier').GetNameWithTooltip] por [GetModifier('cobra_spit_modifier').GetNameWithTooltip].\n#flavor La Momia crea un líquido ácido que es devastador contra el tejido vivo.#!"
 ESSENCE_LONGING_PERK_EFFECT: "Mejora [GetPerk('simple_philtre_perk').GetName(GetPlayer)] al sustituir [GetModifier('simple_philtre_modifier').GetNameWithTooltip] por [GetModifier('essence_longing_modifier').GetNameWithTooltip].\n#flavor La Momia crea un perfume que actúa como un afrodisíaco menor.#!"
 EYES_OF_THE_KA_PERK_EFFECT: "#flavor La Momia crea un ungüento que, al aplicarse en los ojos y los oídos, permite presenciar el [UmbraGlossary('shadowlands')].#!"
 ICE_OF_THE_DESERT_PERK_EFFECT: "Durabilidad de la poción [artifact|E]: #P +5#!\n#flavor La Momia puede alterar una cierta cantidad de un estado natural.#!"
 LESSER_QUIDDITY_PERK_EFFECT: "#flavor Con el uso del Sekhem, la Momia activa la quiddity de un objeto (sus atributos espirituales simbólicos).#!"
