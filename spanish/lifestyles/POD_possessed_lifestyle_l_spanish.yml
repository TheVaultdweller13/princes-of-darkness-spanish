 ANIMAL_CONTROL_PERK_EFFECT: "Como [character_interaction|E], te permite obtener directamente una mascota.\nComo [character_interaction|E], te permite llamar a tu mascota a la guerra.\nPuedes reclutar varios tipos de animales como [men_at_arms|E].\n#F El Control de Animales otorga al usuario la capacidad de invocar y controlar a los animales que se encuentren en el alcance en el momento en que se use el Poder.#!"
 AURA_OF_TRANQUILITY_PERK_EFFECT: "Otorga [GetModifier('aura_of_tranquility_perk_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\n#F El personaje irradia un aura de serenidad (en el caso de los Kami) o de armonía (en el caso de los Drones) que calma a cualquiera que esté en la zona. #!"
 BERSEKER_PERK_EFFECT: "Ahora puede realizar el ataque de berserker en [combat_phase|E] como [knight|E].\n#F El huésped está imbuido de Furia tal como un hombre lobo, con todas las ventajas y desventajas correspondientes.#!"
 BESTIAL_MUTATION_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_bestial_mutation_modifier' ).GetNameWithTooltip|L].\n#F El cuerpo del huésped ya no es reconocible como humano o animal; se ha distendido y deformado en una tosca parodia de su forma anterior, siendo totalmente incapaz de pasar por algo que no sea un monstruo sobrenatural.#!"
 BULKY_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_giant_modifier' ).GetNameWithTooltip|L].\n#F El cuerpo del personaje es inusualmente grande y sólido, ofreciendo una medida extra de durabilidad.#!"
 BODY_EXPANSION_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_body_expansion_modifier' ).GetNameWithTooltip|L].\n#F El personaje es capaz de aumentar su tamaño hasta tres veces su altura normal durante un corto periodo de tiempo.#!"
 BRAIN_EATING_PERK_EFFECT: "Como [character_interaction|E], te permite absorber el rasgo de inteligencia de un prisionero para ganar experiencia de estilo de vida.\n#F El fomor puede absorber las facultades mentales de un objetivo con un toque y usarlas para aprender.#!"
 CHAOS_ENGINE_PERK_EFFECT: "Otorga [GetModifier('chaos_engine_perk_modifier').GetNameWithTooltip] [modifier|E] a los [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E].\n#F Una gorgona con esta habilidad es un portavoz andante del caos, pura y simplemente. Su propia presencia trae desorden y cambio a los objetos y eventos que ocurren a su alrededor.#!"
 STASIS_ENGINE_PERK_EFFECT: "Otorga [GetModifier('stasis_engine_perk_modifier').GetNameWithTooltip] [modifier|E] a los [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E].\n#F Los ejes se realinean, los objetos se aseguran en su lugar y las cosas que parecen estar fuera de sincronía se armonizan con su entorno.#!"
 COMMAND_THE_EARTH_PERK_EFFECT: "Como [character_interaction|E], te permite desatar efectos climáticos hostiles sobre los señoríos enemigos.\n#F El personaje es capaz de obligar a la propia tierra a obedecerle, esculpiendo nuevas formaciones, hundiendo a los enemigos en arenas movedizas, etcétera.#!"
 CURSE_OF_GAIA_PERK_EFFECT: "Como [character_interaction|E], te permite otorgar [GetModifier( 'mild_curse_of_gaia_modifier' ).GetNameWithTooltip|L], [GetModifier( 'moderate_curse_of_gaia_modifier' ).GetNameWithTooltip|L], [GetModifier( 'severe_curse_of_gaia_modifier' ).GetNameWithTooltip|L] o [GetModifier( 'very_severe_curse_of_gaia_modifier' ).GetNameWithTooltip|L] a un enemigo.\n#F La Kami puede imponer la maldición de la propia Gaia contra un infractor, castigando a quienes alteren Su voluntad o el equilibrio del mundo natural. Las maldiciones menores pueden manifestarse como rachas de mala suerte, episodios de depresión o condiciones físicas vergonzosas (como la pérdida de cabello o un hedor extremo); las maldiciones mayores podrían convertir al infractor en piedra, infligiéndole una enfermedad degenerativa o incluso obligar a la tierra a tragárselo.#!"
 CYBERSENSES_PERK_EFFECT: "#F [Select_CString( GetScriptedGui('is_modern').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'Allows the user to replace his own senses with that of a machine — radar, infrared scanning, or the like.', '')]#!"
 DEVOUR_PERK_EFFECT: "Bonificación para causar un destrozo brutal a los [knights|E] enemigos cuando estés en [combat_phase|E] como [knight|E].\n#F El personaje es capaz de distender su boca y tragar objetos tan grandes como un perro de tamaño mediano o una persona pequeña. Cualquiera que sea devorado así es digerido como alimento, siendo eliminados solo los materiales verdaderamente indigeribles (como huesos, zapatos o gafas).#!"
 DISPERSION_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_swarm_modifier' ).GetNameWithTooltip|L].\n#F Este poder, uno de los cambios más evidentes que un espíritu puede realizar, permite a su huésped fragmentar su cuerpo en una serie de partes más pequeñas, cada una de ellas plenamente viva y poseedora de la conciencia de su «dueño». La mayoría se asemeja a animales pequeños como roedores o serpientes, aunque se sabe que algunas gorgonas particularmente inusuales pueden dispersarse repentinamente en varias entidades distintas a la vez.#!"
 ELECTRICAL_FIELD_PERK_EFFECT: "Bonificación para causar un destrozo brutal a los [knights|E] enemigos cuando estés en [combat_phase|E] como [knight|E].\n#F El personaje puede generar un poderoso campo eléctrico que electrocute a cualquiera que entre en contacto con su cuerpo. La corriente puede ser de naturaleza alterna o continua, con los efectos apropiados (alejar al objetivo del personaje o bloquear sus músculos en su lugar).#!"
 ENCHANTING_VOICE_PERK_EFFECT: "Otorga [GetModifier('enchanting_voice_perk_modifier').GetNameWithTooltip] [modifier|E] a los [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E].\n#F El personaje puede cautivar a sus oyentes con su canto (o, en el caso de los Drones, con su habla maravillosamente relajante).#!"
 ENTROPIC_TOUCH_PERK_EFFECT: "#F Con un toque, el personaje puede debilitar temporalmente la estructura física de un objeto, o incluso de un ser vivo.#!"
 EXTENSIBLE_LIMB_PERK_EFFECT: "#F Una o más de las extremidades del personaje —brazos, piernas, colas, incluso lenguas— pueden estirarse para manipular objetos o golpear a un oponente a distancia. Este poder suele manifestarse en los fomori como una poderosa lengua similar a la de una rana, que otorga a su dueño un habla extrañamente arrastrada (y, a veces, gusto por los insectos).#!"
 EXTRA_LIMB_PERK_EFFECT: "#F El personaje desarrolla permanentemente una serie de extremidades adicionales, ya sean brazos extra, tentáculos o incluso lenguas o intestinos alargados y prensiles. Las extremidades pueden estar unidas en lugares extraños, o incluso ocultas en sacos de carne hasta que sean necesarias.#!"
 EYES_OF_THE_WYRM_PERK_EFFECT: "#F Los ojos del fomor son de algún modo inusuales. Pueden ser ojos compuestos como los de un insecto, o poseer pupilas e iris que cambian de forma extrañamente, o incluso presentar ondas de colores iridiscentes y sucios. Quienes cruzan la mirada con el fomor ven un patrón más aterrador oculto en su interior: destellos de la condenación enloquecedora del $glossary_wyrm$.#!"
 FLIGHT_PERK_STATS_EFFECT: "#F El personaje es capaz de volar, ya sea mediante alas (de cualquier tipo) o mediante alguna otra forma de propulsión (como el vuelo sobre el viento para un Kami con aspecto de tormenta). Puede mantenerse suspendido, planear, elevarse o lanzarse en picado, según elija el jugador.#!"
 FOOT_PADS_PERK_EFFECT: "#F Los pies del personaje están acolchados como los de un animal, otorgándole una medida extra de sigilo.#!"
 FUNGAL_TOUCH_PERK_EFFECT: "Otorga [GetModifier('fungal_touch_perk_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\n#F El personaje ha sido parcialmente absorbido por una extraña sustancia fúngica, que puede transmitir con un toque virulento.#!"
 GASEOUS_FORM_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_mist_modifier' ).GetNameWithTooltip|L].\n#F El personaje puede disolver su cuerpo en un estado gaseoso, ya sea niebla, humo o un miasma fétido.#!"
 HAZARDOUS_BREATH_PERK_EFFECT: "Bonificación para causar un destrozo brutal a los [knights|E] enemigos cuando estés en [combat_phase|E] como [knight|E].\n#F El personaje puede expulsar algún tipo de sustancia peligrosa bajo demanda: fuego, aliento venenoso, saliva ácida o algo similar. El ataque no tiene por qué ser necesariamente un arma de aliento; cualquier tipo de ataque a larga distancia servirá.#!"
 HEART_SENSE_PERK_EFFECT: "#F La Kami puede ver hasta el corazón mismo de un individuo, determinando su lealtad espiritual general (Wyrm, Wyld, Tejedora, Gaia u otra), su inocencia o culpa, su forma verdadera (si está usando otra forma), e incluso sus sueños y deseos más secretos o sus conexiones con el pasado.#!"
 HOMOGENEITY_PERK_EFFECT: "Como [character_interaction|E], te permite eliminar un [battle_modifier|E] de un objetivo.\n#F El personaje puede contrarrestar todos los poderes sobrenaturales en un radio de cinco yardas, o concentrarse en un oponente y evitar que use tales poderes durante mucho más tiempo. La Homogeneidad no funciona con poderes «innatos»; por lo tanto, aunque contrarrestará los Dones de un Garou, no le impedirá realizar su Cambio de Forma.#!"
 HORROR_PERK_EFFECT: "Otorga [GetModifier('POD_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\nPuedes ignorar la inmunidad al Delirio.\n#F La presencia del personaje es tan perturbadora que evoca el mismo pánico sobrenatural en los mortales que presenciar a un Garou en forma de Crinos. Los personajes más poderosos pueden incluso infligir terror e incredulidad en lo sobrenatural. Este poder casi siempre se manifiesta en personajes con formas verdaderamente bestiales, animalescas o directamente monstruosas.#!"
 IMMUNITY_TO_THE_DELIRIUM_PERK_EFFECT: "Ya no sufrirás el #TOOLTIP:STATIC_MODIFIER,POD_delirium_modifier #N;L Delirio#!#! cuando luches contra $glossary_fera$ durante las guerras o [single_combat_duel_plural|E].\n#F El personaje no está sujeto a ninguno de los efectos del Delirio.#!"
 INFECTIOUS_BITE_TOUCH_PERK_EFFECT: "Como [character_interaction|E], te permite transmitir enfermedades.\n#F El personaje es capaz de propagar una infección viciosa mediante una mordida o un toque. Si el huésped logra infectar a un objetivo, este presentará fiebre y debilidad, y será ligeramente contagioso hasta que la infección sane.#!"
 INVISIBILITY_PERK_STATS_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_invisible_modifier' ).GetNameWithTooltip|L].\n#F El personaje desaparece de la vista. No deja huellas, pero sigue haciendo ruido y emitiendo un rastro, y seguirá siendo detectable por Dones como Sentir el $glossary_wyrm$ (si procede).#!"
 INVULNERABILITY_PERK_STATS_EFFECT: "#F El cuerpo del personaje se fortalece sobrenaturalmente sin ningún efecto externo evidente.#!"
 LIQUID_FORM_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_blood_modifier' ).GetNameWithTooltip|L].\n#F El personaje puede licuar su cuerpo, disolviéndose en un líquido espeso (lodo, sangre o similar) que puede moverse a su antojo. El personaje en forma líquida puede fluir a través de aberturas pequeñas sin dificultad, aunque le cuesta subir cuestas.#!"
 LONGEVITY_PERK_EFFECT: "#F La esperanza de vida del Kami se extiende alrededor de 50 años con la ayuda de este poder.#!"
 LORD_OF_THE_LAND_PERK_EFFECT: "#F El personaje está increíblemente sintonizado con su territorio, manteniéndose constantemente consciente de cualquier cosa que ocurra dentro de los límites que ha reclamado como suyos.#!"
 MAGNETOKINESIS_PERK_EFFECT: "#F El Dron puede generar y controlar campos magnéticos localizados, permitiéndole mover o manipular objetos ferrosos.#!"
 MALLEATE_PERK_EFFECT: "Probabilidad adicional de mutilar a un [knights|E] enemigo cuando se esté en [combat_phase|E] como [knight|E].\n#F El personaje es capaz de inyectar un veneno extraño que vuelve el cuerpo de la víctima maleable, haciendo que los huesos y los grupos musculares sean tan flexibles como la arcilla. Este poder puede afectar incluso a la carne sin vida y al tejido vegetal.#!"
 MASK_PRESENCE_PERK_EFFECT: "Como [character_interaction|E], te permite detener todas las conjuras dirigidas hacia ti.\n#F El personaje es capaz de ocultar su presencia ante cualquier observador.#!"
 MATTER_WEAVE_PERK_EFFECT: "#F El personaje es capaz de remodelar la materia en nuevas formas y funciones. Los Drones suelen usar este poder para reparar daños en estructuras o parchar imperfecciones; las Gorgonas lo usan casi a su antojo, remodelando objetos en configuraciones nuevas y extrañas para debilitar el control del $glossary_weaver$ sobre un área.#!"
 MEMORY_CARESS_PERK_EFFECT: "#F La mitad espiritual del personaje interfiere con la mente de la gente común para mantener en secreto sus actividades. Los observadores reaccionan al personaje de la forma en que lo harían normalmente, pero sus recuerdos del mismo se desvanecen una vez que el personaje se ha marchado. Este poder ciertamente tiene sus inconvenientes —es difícil mantener un trabajo si tu jefe olvida que existes cada vez que sales de la habitación—, pero para muchos poseídos, el anonimato es la defensa definitiva.#!"
 MIND_BLAST_PERK_EFFECT: "Eres capaz de [imprison|E] a [characters|E] que de otro modo habrían sido imposibles de capturar en un [siege|E] o una [raid|E].\nMucho más probabilidades de [imprison|E] a [characters|E] tras un [siege|E] o una [raid|E] exitosos.\n#F El personaje puede inmovilizar a un objetivo con un rayo de energía psíquica. La víctima se desploma en el suelo, retorciéndose de dolor, a merced de su asaltante.#!"
 FOMORI_MIND_RAPE_PERK_EFFECT: "Como [character_interaction|E], te permite conocer cada secreto y conjura del objetivo.\n#F El fomor puede invadir la mente de un objetivo y arrebatarle información por la fuerza. Aunque esto no causa daño real, la víctima tiende a sentirse desnuda y violada durante varios días después (y a menudo con un dolor de cabeza insoportable para colmo).#!"
 NATURAL_WEAPONRY_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma: Armamento Natural.\n#F El personaje manifiesta armamento natural en forma de garras, colmillos, cuernos o simplemente protuberancias óseas afiladas.#!"
 NIGHTMARE_COMMAND_PERK_EFFECT: "Desbloquea el [GetScheme('PODsoul_bridge').GetTypeName] [scheme|E].\n#F El fomor puede hacer que un objetivo sufra pesadillas horribles, privando a la víctima de un sueño reparador. El fomor puede elegir influir en el contenido de los sueños o simplemente dejar que el subconsciente de la víctima haga el trabajo sucio.#!"
 PEACEFUL_FIGHTING_PERK_EFFECT: "Más probabilidades de [imprison|E] a [characters|E] tras un [siege|E] o una [raid|E] exitosos.\n#F El personaje es capaz de luchar con toda su fuerza sin dañar permanentemente a sus oponentes. Los Kami usan este poder por misericordia; los Drones, por el deseo de evitar grandes perturbaciones.#!"
 PIERCING_GAZE_PERK_EFFECT: "#F El Kami es capaz de hacer que cualquiera al que mire se sienta incómodo y desasosegado, como si el Kami estuviera mirando directamente a su alma. Este poder suele usarse para ahuyentar a los intrusos, aunque puede servir como una excelente ayuda en interrogatorios.#!"
 PLANT_ANIMATION_PERK_EFFECT: "Puede reclutar a [GetMaA('animated_tree').GetName] como [men_at_arms|E]\n#F El personaje es capaz de animar plantas, haciendo que árboles, enredaderas, arbustos y similares se muevan de formas que normalmente les están prohibidas. Un árbol puede golpear o incluso estrangular a sus oponentes con sus ramas; las enredaderas pueden enredarse e incluso la hierba puede atrapar los pies de un enemigo.#!" 
 PLANT_KINSHIP_PERK_EFFECT: "Velocidad de progreso de [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F Este poder permite al Kami comunicarse con la vida vegetal, aunque se puede obtener muy poca información de una planta promedio.#!"
 PLANT_KINSHIP_PERK_BONUS_VALUE: "[GetPerk('kami_plant_kinship_perk').GetName(GetPlayer)]"
 PLIANT_BONES_PERK_EFFECT: "Aumenta la probabilidad de éxito del [decision|E] Escapar de la Prisión.\n#F Los huesos del personaje pueden volverse blandos y maleables, permitiéndole escurrirse por aberturas pequeñas como una rata. El personaje también puede zafarse de ataduras y restricciones con el tiempo suficiente.#!"
 POISON_PERK_EFFECT: "Probabilidad adicional de causar heridas graves a [knights|E] enemigos cuando se esté en [combat_phase|E] como [knight|E].\n#F El personaje es capaz de inyectar veneno en un enemigo, ya sea a través de glándulas venenosas o fluidos corporales tóxicos como la saliva.#!"
 POISON_TUMORS_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma: [GetModifier( 'POD_shapeshift_form_poison_tumors_modifier' ).GetNameWithTooltip|L].\n#F El cuerpo del fomor está cubierto de extraños tumores llenos de pus cáustico, generalmente de algún color y olor repugnante.#!"
 REASSURING_PRESENCE_PERK_EFFECT: "#F El personaje puede cambiar su apariencia para adaptarse a la persona que más gente respete y escuche en un momento dado. Aunque este poder pueda parecer débil, un fomor o un Dron astuto puede usarlo para ir casi a cualquier parte y obtener una cooperación limitada de casi cualquiera.#!"
 REGENERATION_PERK_STATS_EFFECT: "Elimina todas las heridas y mutilaciones cada tres meses.\n#F El personaje regenera el daño casi de inmediato, de la misma manera que un hombre lobo.#!"
 SANITY_RENDING_PERK_EFFECT: "Como [character_interaction|E], permite dar al objetivo un rasgo de estrés.\n#F El personaje es capaz de doblegar las mentes de quienes cruzan su mirada, llevándolas al límite de su resistencia.#!"
 SEASONS_BLESSINGS_PERK_EFFECT: "#F El Kami puede traer los efectos de una estación en particular a un área: pueden caer hojas de los árboles si se invocan las Bendiciones del Otoño, mientras que un Kami sintonizado con el invierno puede convocar una nevada.#!"
 SELF_IMMOLATION_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_fire_modifier' ).GetNameWithTooltip|L].\n#F El personaje puede inmolarse, convirtiéndose en una hoguera andante. Las llamas no dañan al personaje, pero dañan todo lo que toca, con todos los riesgos inherentes.#!"
 SENSE_GAIA_PERK_EFFECT: "#F El personaje puede sentir las manifestaciones de Gaia en el área cercana: fera gaiana, espíritus y similares.#!"
 SHADOWPLAY_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_shadow_modifier' ).GetNameWithTooltip|L].\n#F El personaje puede manipular las sombras locales, agrupándolas en un área de oscuridad. El personaje siempre puede ver en sus propias sombras.#!"
 SILENT_SPEECH_PERK_EFFECT: "#F El personaje es capaz de comunicarse sin hablar, hablando con los individuos de mente a mente. Este poder elude todas las barreras lingüísticas, aunque el personaje no puede comunicarse de esta forma con criaturas que carezcan de lenguaje a menos que utilice otro poder para lograrlo.#!"
 SIZE_PERK_EFFECT: "Como [character_interaction|E], te permite convertirte en [GetTrait('giant').GetName( GetPlayer )] o [GetTrait('dwarf').GetName( GetPlayer )].\n#F Mientras que el poder [GetPerk('fomori_bulky_perk').GetName( GetPlayer )] representa un espécimen particularmente masivo del tipo de cuerpo del huésped, esto representa cambios dramáticos y permanentes en el tamaño de un personaje.#!"
 SKINCHANGER_KINSHIP_PERK_EFFECT: "#F Este poder representa una gran conexión espiritual y amistad con una de las Razas Cambiantes. La versión más común de este poder es la afinidad Garou (ya que las otras Razas han caído en declive), pero un Kami puede poseer afinidad con cualquier raza cambiante, incluso Ratkin o Ananasi.#!"
 SKINSHIFT_PERK_EFFECT: "Bonificación al Cambio de Forma [character_interaction|E] para cambiar de apariencia.\n#F El personaje poseído puede alterar la apariencia de su carne, adoptando rápida y fluidamente las características y la forma corporal de una criatura completamente diferente en cuestión de instantes.#!"
 SPIRIT_AWAKENING_PERK_EFFECT: "#F El Kami es capaz de despertar a los espíritus de animales, plantas u objetos inanimados cantando o tocando música para ellos.#!"
 SPIRIT_GIFT_PERK_EFFECT: "#F El personaje puede aprender cualquier Don apropiado y desarrollarlo como su propio poder.#!"
 SPIRIT_KINSHIP_PERK_EFFECT: "Puede reclutar [GetMaA('jagglings').GetName] como [men_at_arms|E].\n$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#F El personaje tiene poderosos vínculos con los espíritus de su especie, e incluso puede llamarlos en tiempos de peligro. Los fomores están ligados a los Malignos, los Drones llaman a los espíritus del $glossary_weaver$, las Gorgonas pueden invocar a los Wyldlings y los Kami suelen convocar elementales.#!"
 SPIRIT_RENDING_PERK_EFFECT: "Puedes encarcelar, torturar, ejecutar o herir físicamente a los espíritus durante un [single_combat_duel_plural|E].\n#F Los fomores con este poder pueden usar su Furia para arremeter contra los espíritus a través de la Celosía y alimentarse de sus energías. Por supuesto, un fomor que juzgue mal a su presa podría llevarse una sorpresa fatal.#!"
 SPIRIT_SENSE_PERK_EFFECT: "Desbloquea $seek_aid_of_the_spirits_decision$ [decision|E].\n#F El personaje es capaz de ver a través de la Celosía, observando los sucesos en la Penumbra local.#!"
 SPIRIT_STATIC_PERK_STATS_EFFECT: "Desbloquea la opción Manipular la Celosía en el panel de [umbra|E].\n#F El Dron puede aumentar temporalmente la Celosía en su entorno inmediato, limitando los poderes de los enemigos del $glossary_weaver$#!"
 SPIRIT_TIES_PERK_EFFECT: "Puede usar fetiches [artifact|E].\n#F El personaje tiene una conexión innata con el [spirit_world|E] y puede usar fetiches y talentos.#!"
 STASIS_COCOON_PERK_EFFECT: "Desbloquea Entrar en Letargo [decision|E], lo que permite entrar en [GetTrait('torpor').GetName( GetNullCharacter )], lo cual te dejará en estado de letargo.\n#F El personaje se envuelve en un capullo de una cáscara endurecida mientras su metabolismo se ralentiza hasta alcanzar un estado de animación suspendida. Los personajes en capullo no envejecen y pueden permanecer vivos sin comida, agua o incluso aire casi indefinidamente.#!"
 STASIS_TOUCH_PERK_EFFECT: "Como [character_interaction|E], te permite eliminar el Cambio de Forma del objetivo.\n#F Con un solo toque, el personaje puede arrebatar a sus oponentes la capacidad de cambiar su forma.#!"
 STEP_SIDEWAYS_PERK_EFFECT: "Accede al [UmbraGlossary('spirit_wilds')].\n#F El personaje adquiere la capacidad de entrar en la [umbra|E], tal como hacen los Garou.#!"
 SUCCUBUS_VEIL_PERK_EFFECT: "Desbloquea el [GetScheme('PODenthrall').GetTypeName] [scheme|E].\n#F El personaje puede aparecer como la pareja ideal de un objetivo y, con un gesto, atraerle a su lado. Si se usa con éxito, esto indica que el objetivo está tan completamente cautivado por el personaje que hará cualquier cosa razonable para complacerle. Alternativamente, el personaje puede activar este poder para hechizar a cualquiera que le eche el ojo, aunque este «hechizo generalizado» es mucho menos potente.#!"
 TAINT_SUPPRESSION_PERK_EFFECT: "#F El fomor puede anular brevemente los efectos de cualquiera de sus Marcas. Las deformidades físicas suprimidas sanan volviendo a ser carne intacta en cuestión de segundos; los desvaríos desaparecen en un estallido de claridad perfecta, etc.#!"
 TAR_BABY_PERK_EFFECT: "Probabilidad de bonus para mutilar a un enemigo [knights|E] cuando se actúa como [knight|E] en [combat_phase|E].\n#F La piel o la «carne» del personaje está hecha de una sustancia espesa y pegajosa como melaza o alquitrán. Cualquier cosa que entre en contacto forzado con la piel se queda pegada como una mosca en papel de arroz; el contacto lento y deliberado, como ponerse la ropa, no activa las cualidades adhesivas.#!"
 THICK_SKINNED_PERK_EFFECT: "Probabilidad de bonus para mutilar a un enemigo [knights|E] cuando se actúa como [knight|E] en [combat_phase|E].\n#F El personaje posee una o varias capas adicionales de cobertura que le proporcionan protección sobrenatural contra las heridas. El estilo de protección varía según el poseído; los Drones simplemente experimentan un endurecimiento imperceptible de la piel, mientras que las Gorgonas suelen manifestar este Poder de diversas formas, desde carne altamente densa hasta una capa de escamas.#!"
 TRANSFORMATION_PERK_EFFECT: "Permite el Cambio de Forma en varios animales.\n#F El Kami es capaz de realizar cambios de forma limitados pero impecables.#!"
 TRIATIC_SCENT_PERK_EFFECT: "Permite interacciones amistosas con el $glossary_triat$ [splat|E] opuesto.\n#F El personaje es capaz de ocultar su «olor real» recurriendo al poder de una entidad Triádica rival.#!"
 TRIATIC_SENSE_PERK_EFFECT: "#F El personaje tiene la capacidad de sentir la fuerza relativa de cualquiera de los $glossary_triat$ en su entorno inmediato.#!"
 UNIVERSAL_TONGUE_PERK_EFFECT: "#F El personaje puede hablar con cualquier criatura viviente y entenderla.#!"
 UNNATURAL_STRENGTH_PERK_EFFECT: "#F Los músculos del personaje ondean con un desarrollo sobrenatural, haciendo que parezca casi el producto del uso intensivo de esteroides.#!"
 VEIL_BREACH_PERK_EFFECT: "#F Los personajes con este Poder pueden penetrar en la mente de un humano y arrancar las esquirlas de conciencia susceptibles al Delirio. Tal «cirugía psíquica» invasiva predispone a sus víctimas a la locura, pero hace que humanos normales sean capaces de interactuar con (o incluso luchar contra) los Garou sin sucumbir al pánico inmediato.#!"
 VOICE_OF_REASON_PERK_EFFECT: "#F La voz del personaje se convierte en un monótono extraño y seductor, arrullando a los oyentes en un estado de calma hipnótica.#!"
 VOICE_OF_THE_WYRMCH_PERK_EFFECT: "#F La lengua del fomor ha sido alterada en una forma extraña: posiblemente gruesa y similar a la de una babosa, posiblemente larga y bífida, o incluso transmutada en una masa de tentáculos. El fomor puede hablar con normalidad, pero también puede hablar en el propio lenguaje del Wyrm.#!"
 WALL_WALKING_PERK_EFFECT: "#F El personaje puede correr por superficies verticales como una araña, tan fácilmente como si estuviera en terreno llano.#!"
 WEBBING_PERK_EFFECT: "Tu prisionero tiene menos probabilidades de escapar de tu prisión.\n#F Permite la creación de telarañas para vincular a enemigos caídos, sellar aberturas o incluso descender desde una gran altura. El poder puede tomar muchas formas según el personaje. Los Fomori podrían tejer chorros de adhesivo maloliente de glándulas impuras, mientras que los Kami y las Gorgonas podrían producir una telaraña de seda más «natural», y los Drones tejen hebras artificiales de aspecto plástico para vincular a sus enemigos.#!"
 ANIMATE_SELF_PERK_EFFECT: "#F Las Gorgonas y los Kami vinculados a objetos inanimados como árboles o estatuas pueden tomar este poder, que les permite animar su cuerpo anfitrión. Sin este poder, un personaje con un anfitrión vegetal o mineral es inmóvil.#!"
 ARMORED_HIDE_PERK_EFFECT: "#F La piel del anfitrión está obviamente alterada, otorgando una mayor resistencia contra los ataques. Puede ser claramente escamosa o pesada, como la piel de un rinoceronte, o quizás incluso brillar con un limo que hace que los ataques resbalen sin hacer contacto pleno.#!"
 BALEFIRE_FLUX_PERK_EFFECT: "#F Cada vez que el fomor es expuesto al Fuego Infernal, las excreciones radiactivas del Wyrm, puede experimentar una transformación, ganando un nuevo Poder.#!"
 BLENDING_PERK_EFFECT: "#F El personaje es capaz de cambiar su coloración con fines de sigilo; aunque no puede duplicar patrones o texturas específicos, puede crear patrones generales suficientes para romper su silueta.#!"
 COMPUTER_LINK_PERK_EFFECT: "#F [Select_CString( GetScriptedGui('is_modern').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'The Drone becomes capable of controlling computers by touch alone.', '')]#!"
 CORRUPTED_VISIONS_PERK_EFFECT: "#F «¡Tuve que hacerlo! ¡Dios me lo ordenó!». Al utilizar este don de la corrupción, un fomor induce alucinaciones en alguna víctima indefensa. Voces de Dios, vislumbres fugaces de algo justo fuera de la vista, reprimendas, burlas y otros favoritos de los paranoicos son solo algunas de las posibilidades. Aunque este Poder funciona mejor cuando el fomor parece lo suficientemente normal como para pasar por humano, uno especialmente deforme puede usarlo mientras se esconde. Conocer a tu víctima ayuda al usar Visiones Corruptas; una persona racional sospecharía si Jesús le dijera de repente que se lance a una matanza, mientras que alguien que ya estuviera perturbado podría pensar que es una idea excelente. Por supuesto, una persona aparentemente racional podría volverse loca por visiones sutiles y bien elegidas. Después de eso, todo vale...#!"
 DARKSIGHT_PERK_STATS_EFFECT: "#F El personaje es capaz de ver en la oscuridad tan bien como lo haría a la luz del día.#!"
 DECEPTION_PERK_EFFECT: "#F El fomor puede ocultar la evidencia espiritual de su Marca del Wyrm a los demás. El Don: Sentir el Wyrm no detectará al fomor como marcado por el Wyrm. El fomor también puede usar este Poder en otros para cubrir su mancha. Por ejemplo, el fomor puede ocultar la evidencia de la Diablerie de un vampiro o incluso cambiar el aura de un Garou normal para que parezca marcado por el Wyrm cuando en realidad no lo está. Los Fomori bajo la influencia de este Poder también son inmunes a los hechizos Hekau (Nombre Verdadero) de las momias.#!"
 deception_perk_effect_1: "El rasgo [GetTrait('diablerist').GetName( GetPlayer )] se ocultará automáticamente tras ser expuesto"
 deception_perk_effect_2: "Permite interacciones amistosas con hombres lobo gaianos siendo un marcado por el Wyrm"
 deception_perk_effect_3: "No puedes ser objetivo de los conjuras [GetScheme('POD_discover_true_name').GetTypeName]"
 ECTOPLASMIC_EXTRUSION_PERK_EFFECT: "#F El personaje es capaz de generar hasta cuatro tentáculos o brazos semisólidos que pueden extenderse hasta cinco yardas, manipulando objetos o incluso asestando golpes. Las extremidades pueden ser ectoplasma real, sombra casi sólida, niebla sobrenaturalmente espesa o cualquier cosa que parezca adecuada para el tipo de personaje en cuestión.#!"
 ELEMENTAL_RESISTANCE_PERK_EFFECT: "#F La resistencia del anfitrión a un determinado tipo de energía se aumenta a niveles sobrenaturales. La fuente elegida puede ser mundana, como el fuego o el rayo, o incluso provenir de fuentes más místicas como el Fuego Infernal.#!"
 ENHANCED_ATTRIBUTE_PERK_EFFECT: "#F Las capacidades naturales del anfitrión se magnifican a niveles sobrehumanos. Este poder no se limita a los Atributos Físicos; un ser poseído por el Salvaje podría presumir de una Agudeza Mejorada, mientras que un fomor bien podría desarrollar una Apariencia sobrenatural para atraer mejor a sus víctimas.#!"
 ENHANCEMENT_PERK_EFFECT: "#F El fomor puede convertirse en la pareja ideal de cualquier criatura viviente mediante el escaneo de la mente de su objetivo.#!"
 EXOSKELETON_PERK_EFFECT: "#F El fomor tiene un crecimiento duro, similar a un caparazón, por todo su cuerpo. Suele ser muy óseo, con muchos nudos, tubos similares a venas y formas extrañas. Su coloración varía desde un rojo oxidado y marrón oscuro hasta un negro aceitoso.#!"
 EXTRA_SPEED_PERK_EFFECT: "#F El fomor puede superar en maniobrabilidad a un humano normal.#!"
 HAND_FROM_BEYOND_PERK_EFFECT: "#F El fomor puede entrar en la [umbra|E] y luego alcanzar el mundo material para arrastrar a otros al [spirit_world|E] con él. Puede arrastrar a más de una persona siempre que todos los objetivos se tomen de las manos.#!"
 IMMUNITY_PERK_EFFECT: "#F El fomor puede ignorar los efectos de algunos tipos de cosas potencialmente peligrosas.#!"
 NIMBLENESS_PERK_EFFECT: "#F El fomor es especialmente ágil y puede mantener fácilmente su equilibrio mientras realiza proezas que harían tropezar a cualquier otra persona.#!"
 NOXIOUS_BREATH_PERK_EFFECT: "Otorga [GetModifier('noxious_breath_perk_modifier').GetNameWithTooltip] [modifier|E] a los caballeros enemigos [knights|E] cuando actúa como [commander|E] durante la [combat_phase|E], o a tu enemigo durante [single_combat_duel_plural|E].\n#F El fomor puede liberar gases venenosos al aire que hacen que quienes estén a veinte yardas sientan ansias de fumar. Los gases se ven y huelen como el humo del tabaco. Además, el gas debilita el tejido pulmonar de quienes lo respiran. La exposición repetida al aliento nocivo durante varias semanas o meses provoca el desarrollo de cáncer de pulmón en las víctimas.#!"
 NUMBING_PERK_EFFECT: "#F El cuerpo del fomor puede quedar completamente entumecido. No siente dolor. Sin embargo, está insensible a toda sensación. No puede hablar correctamente (siente la lengua permanentemente anestesiada) y puede cortarse sin sentir nada, lo que puede provocar heridas infectadas o gangrenosas de las que el fomor no se dé cuenta.#!"
 PROCREATION_PERK_EFFECT: "#F El fomor puede transmitir un Mal a través de la sangre y el semen; cualquier encuentro que involucre fluidos corporales puede propagar el Mal. El Mal intentará entonces poseer al receptor de los fluidos. El fomor solo puede transmitir un Mal similar al que lo posee.#!"
 PROLONGED_LIFE_PERK_EFFECT: "#F La esperanza de vida natural del fomor se prolonga enormemente. Esto no es inmortalidad real, ya que el fomor acabará muriendo por causas naturales (la muerte natural entre los fomori es prácticamente desconocida).#!"
 ROAR_OF_THE_WYRM_PERK_EFFECT: "#F El fomor es capaz de infundir terror en el corazón de todos los que estén cerca de ella mediante este grito gutural.#!"
 SAVAGE_GENITALIA_PERK_EFFECT: "#F La pesadilla de John Bobbit; el fomor (independientemente de su sexo) tiene genitales con algún rasgo amenazador. Las variaciones masculinas incluyen una longitud excesiva (más de 14 pulgadas) o dureza, espinas, textura de papel de lija o aguijones curvados; las versiones femeninas son famosas por tener dientes, succión desgarradora y trituradoras internas de carne. Obviamente esto no es bueno en combate, pero sí es devastador en la cama.#!"
 SENSE_THE_UNNATURAL_PERK_EFFECT: "#F Similar al Don de los Garou del mismo nombre, este Poder permite al fomor oler a cualquier ser sobrenatural presente, como vampiros, hombres lobo, magos, wraiths y otros espíritus.#!"
 SKITTERSIGHT_PERK_EFFECT: "#F Este extraño Poder permite al fomor sacarse los ojos, retorcer los nervios ópticos para convertirlos en pies y enviar los ojos correteando por los pasillos y esquinas para ver cosas que normalmente están ocultas. Tendrá que tener cuidado: si los ojos se aplastan, quedará ciega para siempre.#!"
 SLITHER_SKIN_PERK_EFFECT: "#F La piel del fomor es un arma y una ayuda útil. El fomor puede mudar su piel, dándole ciertas instrucciones sencillas (no más de cinco palabras). La piel se desprende en el recto y se desliza sobre la cabeza del fomor. Puede caminar, agarrar cosas o atacar.#!"
 SLOBBER_SNOT_PERK_EFFECT: "#F La piel del fomor está cubierta de pequeñas verrugas que excretan una baba extremadamente resbaladiza y fluida. Esta baba hace que el cuerpo del fomor sea virtualmente sin fricción, lo que hace casi imposible que los oponentes lo agarren. El gel viscoso también ayuda al fomor a escurrirse por espacios estrechos. La Baba de Snot se disuelve casi instantáneamente bajo la luz solar directa.#!"
 STOMACH_PUMPER_PERK_EFFECT: "#F El fomor es capaz de vomitar todo lo que ha comido recientemente cubierto de jugos gástricos ácidos y viscosos.#!"
 TOXIC_SECRETIONS_PERK_EFFECT: "#F Este Poder convierte los fluidos corporales del fomor en desechos tóxicos.#!"
 WATER_BREATHING_PERK_EFFECT: "#F Con este sencillo Poder, el fomor puede respirar bajo el agua o no necesitar respirar en absoluto. Este Poder también confiere cierto grado de resistencia a las presiones submarinas y a los problemas de descompresión.#!"