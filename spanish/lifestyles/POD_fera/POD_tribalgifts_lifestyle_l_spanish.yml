 THOUGHT_FORM_OF_THE_TWELVE_MINISTERS_PERK_EFFECT: "Como una [character_interaction|E], te permite ganar [GetModifier( 'POD_thought_form_of_the_twelve_ministers_modifier' ).GetNameWithTooltip|L]\n#F El mantra pronunciado para este Don es Aum-ka-la-rim-sa-ka-la-rim-ha-ka-la-rim. Este Don permite que un Contemplador de Estrellas alcance el verdadero equilibrio espiritual por un solo instante. En ese momento, todos los deseos extremos y las emociones impuras son barridos por una ráfaga incontrolable del Ser. Un sorprendente chasquido de energía viaja como un rayo hacia cada uno de los puntos de chakra del Contemplador de Estrellas. Solo dura un segundo, y luego desaparece. Pero a su paso, el Contemplador de Estrellas queda fortalecido y ardiendo con un halo de luz verde pálida. Solo un puñado de Contempladores de Estrellas han sido lo suficientemente dignos como para aprender este Don, y solo puede ser enseñado por un avatar de la quimera.#!"
 THOUGHT_FORM_OF_THE_TWELVE_MINISTERS_REQUIREMENT: "@warning_icon!#X Necesitas completar una misión del Avatar de la quimera (estaciona a un explorador en cualquier Señorío de la [umbra|E] para encontrar una pista sobre su ubicación e inicia una [umbra_expedition|E] para llegar hasta ellos y recibir una misión) para desbloquear esta ventaja.#!"
 
