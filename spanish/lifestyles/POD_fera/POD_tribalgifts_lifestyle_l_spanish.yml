 SLEEP_OF_THE_HERO_PERK_EFFECT: "Ganarás [GetTrait('torpor').GetName( GetPlayer )] y serás depuesto si mueres por causas antinaturales.\n#F Este poderoso Don ha sido invocado muchas veces en la historia de los Fianna. Cuando un gran héroe muere en batalla, los Fianna toman el cuerpo y lo dedican a la tierra. Este Don forma un vínculo entre los Fianna, la tierra y el espíritu del héroe. La vida del campeón regresa, pero permanece en un sueño profundo, sin despertar hasta el Apocalipsis. El objetivo debe colocarse en algún lugar de la tierra, como una cueva o dentro de un túmulo funerario. Durante este sueño, el héroe no se ve afectado por los elementos y no necesita respirar.#!"
 SLEEP_OF_THE_HERO_REQUIREMENT: "@warning_icon!#X Necesitas completar una misión de los Espíritus Ancestrales de los Fianna (estaciona a un explorador en cualquier Señorío de la [umbra|E] para encontrar una pista sobre la ubicación e inicia una [umbra_expedition|E] para llegar a ellos y recibir una misión) para desbloquear esta ventaja.#!"
 
