 HOME_IN_ALL_LANDS_PERK_EFFECT: "Como [character_interaction|E], permite teletransportar a tu ejército a la ubicación de tu objetivo, o teletransportarte a tu próximo destino al viajar. Esto ignora el alcance diplomático, pero el objetivo debe tener un bajo [development|E].\n#F Las Leyendas entre las Garras Rojas afirman que los lobos con mayor conexión con el Lobo Progenitor no estaban limitados por la distancia, sino que podían aparecer en cualquier lugar donde se encontraran lobos. Durante mucho tiempo se pensó que esto era simple folclore, pero de hecho, un Garra Roja Antiguo con un linaje lo suficientemente fuerte bien podría aprender a desvanecerse de un lugar y aparecer en cualquier otro punto del Señorío o de la [umbra|E], siempre que el Progenitor haya estado allí antes que él.#!"
 HOME_IN_ALL_LANDS_REQUIREMENT: "@warning_icon!#X Necesitas completar una misión del propio Lobo Progenitor (estaciona a un explorador en cualquier Señorío de la [umbra|E] para encontrar una pista sobre la ubicación e inicia una [umbra_expedition|E] para llegar a ellos y recibir una misión) para desbloquear esta ventaja.#!"
 
