 CALL_GREAT_FENRIS_PERK_EFFECT: "Permite reclutar [GetMaA('war_avatar_of_great_fenris').GetName] [men_at_arms|E].\n#F Como la expresión máxima del Pacto entre la tribu y el Tótem, los héroes más grandes de la Camada pueden invocar al avatar de guerra de su Tótem tribal para que les ayude en su hora de necesidad. El avatar se une al combate, aniquilando a todo aquel que no sea de la Camada de Fenris o esté bajo su protección. Sin embargo, el Gran Fenris exige un sacrificio por su intervención; normalmente la mano izquierda del invocador. Se dice que si el avatar de guerra es llamado sin una buena razón, devorará por completo al invocador antes de marcharse.#!"
 CALL_GREAT_FENRIS_REQUIREMENT: "@warning_icon!#X Necesitas completar una misión del propio Gran Fenris (estaciona a un explorador en cualquier Señorío de la [umbra|E] para encontrar una pista sobre la ubicación e inicia una [umbra_expedition|E] para llegar a ellos y recibir una misión) para desbloquear esta ventaja.#!"
 
