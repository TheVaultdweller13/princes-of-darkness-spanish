 CONTROL_SIMPLE_MACHINE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_artisans_command')]"
 
 WEB_WALKER_PERK_EFFECT: ""
 GIFT_DOPPELGANGER_PERK_EFFECT: "Opción adicional de Cambio de Forma [character_interaction|E] que te permite cambiar de apariencia."
 


 
 shining_sigils_perk_name: "Sigilos brillantes"
 SHINING_SIGILS_PERK_EFFECT: "#flavor Sigilos relucientes que representan los relatos de Renombre del Garou aparecen sobre su piel o pelaje. Las marcas brillan en un azul glasto luminiscente, aunque cada Renombre tiene su sutil matiz de color.#!"
 haunting_howl_perk_name: "Aullido inquietante"
 maddening_howl_perk_name: "Aullido enloquecedor"
 white_fire_perk_name: "Fuego blanco"
 howl_of_healing_perk_name: "Aullido de sanación"

 HAUNTING_HOWL_PERK_EFFECT: "#flavor Uno de los Dones de aullido propios de la tribu: este grito sobrenatural solía resonar por los páramos desolados antes de una incursión de los Aulladores Blancos.#!"
 lions_bite_perk_name: "Mordisco de León"
 LIONS_BITE_PERK_EFFECT: "Inflige #V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0] de [POD_aggravated_damage|E]#! a los [knights|E] y [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E] si tiene menos [prowess|E] que tú.\n#flavor Los hijos de León aprendieron muchas cosas de su patrón, incluidas algunas tácticas de caza más propias de los grandes felinos que de los lobos. El Garou con este Don adquiere una habilidad infalible para morder la garganta de su presa, asfixiándola hasta dejarla inconsciente o muerta, o incluso aplastándole la tráquea como hacen los leones.#!"
 spectral_authority_perk_name: "Autoridad Espectral"
 SPECTRAL_AUTHORITY_PERK_EFFECT: "$POD_can_bind_wraith_trigger_loca$\n#flavor El Garou puede ordenar a cualquier fantasma o espíritu cuyo nombre completo conozca.#!"
 sense_of_the_deep_perk_name: "Sentido de las Profundidades"
 SENSE_OF_THE_DEEP_PERK_EFFECT: "#flavor Hasta la Caída, la tribu de León estaba convencida de que su deber hacia Gaia era dar caza a Sus enemigos incluso bajo la superficie de la tierra. Este Don los ayudó en sus esfuerzos por combatir a las criaturas del $glossary_wyrm$ en sus propias madrigueras.#!"
 MADDENING_HOWL_PERK_EFFECT: "Inflige #V 40#! de [stress|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n#flavor La cualidad sobrenatural de los aullidos de los Aulladores Blancos fue lo que les dio su nombre tribal, por no hablar de su reputación. Este Don de aullido representa uno de sus peores aullidos, un terrible lamento ululante que lleva al límite de la ruptura la mente de quienes lo oyen.#!"
 WHITE_FIRE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_white_fire')]\n#flavor Este Don olvidado es el último vínculo con las sagradas hogueras de hueso que los Aulladores Blancos mantenían antes de su Caída y su conversión al Fuego Maligno. El hombre lobo puede lanzar un chorro de fuego blanco cegador desde su mano, abrasando la carne de los huesos de sus enemigos.#!"
 HOWL_OF_HEALING_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_howl_of_healing')]\n#flavor La tribu de los Aulladores Blancos está muy unida y comparte un vínculo que pocos otros igualan. Este lazo les permite canalizar la curación de un modo al que otros solo pueden aspirar.#!"



#Black Spiral Dancers

 toxic_claws_perk_name: "Garras tóxicas"
 TOXIC_CLAWS_PERK_EFFECT: "Probabilidad adicional de herir o mutilar a un [knights|E] enemigo durante la [combat_phase|E] como [knight|E].\n#flavor La Bailarina puede hacer que rezume residuo tóxico de sus garras, cubriéndolas de un limo verdegrís malsano. Las heridas que dejan estas garras tienden a dejar cicatrices de aspecto insano.#!"
 spiral_shadow_dance_perk_name: "Danza de la Sombra Espiral"
 SPIRAL_SHADOW_DANCE_PERK_EFFECT: "#flavor El Danzante de la Espiral Negra aprende a entrelazarse a través de la oscuridad, volviéndose veloz como un grito. Una variedad de Banes enseñan este Don.#!"
 terrify_perk_name: "Aterrorizar"
 TERRIFY_PERK_EFFECT: "#flavor La Danzante con este Don es más intimidante y aterradora de lo normal. Un desdén de su parte es tan efectivo como un gruñido a pleno pulmón de otro.#!"
 unseelie_faerie_kin_perk_name: "Pariente Hada Oscuro"
 UNSEELIE_FAERIE_KIN_PERK_EFFECT: "Desbloquea múltiples [POD_faerie_maa|E] [men_at_arms|E].\n#flavor La Danzante puede llamar a changelings Oscuros para que le ayuden.#!"
 burning_scars_perk_name: "Cicatrices ardientes"
 BURNING_SCARS_PERK_EFFECT: "[character_interaction|E]: Inflige daño de [fire_damage_short_with_icon|E] a un personaje y a ti mismo.\n#flavor Los Bailarines de la Espiral Negra suelen tallarse en el cuerpo cicatrices estilizadas que representan su devoción a la Wyrm. Este Don hace que las cicatrices del Bailarín brillen con un fulgor oscuro que casi parece arrastrarse al interior del cuerpo de la víctima, quemándola por dentro y dejando horribles quemaduras que imitan las cicatrices del propio Bailarín.#!"
 summon_wyrm_elemental_perk_name: "Invocar Elemental de $glossary_wyrm$"
 SUMMON_WYRM_ELEMENTAL_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_summon_wyrm_elemental')]\n#flavor El Bailarín ejecuta un breve baile alrededor de un trozo de un elemento puro. El baile corrompe el elemento e invoca a un Elemental del $glossary_wyrm$.#!"

 the_white_howl_perk_name: "El Aullido Blanco"
 THE_WHITE_HOWL_PERK_EFFECT: "Otorga [GetModifier('the_white_howl_modifier_enemy').GetNameWithTooltip] a los [knights|E] enemigos y [GetModifier('the_white_howl_modifier_ally').GetNameWithTooltip] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\n#flavor Lo que antaño fue la bendición más sagrada de los Aulladores Blancos, este poderoso Don se transmite aún entre las filas de los Danzantes de la Espiral Negra como un recordatorio del pasado para sus enemigos Garou. El sonido del Aullido Blanco es suficiente para desgarrar tanto las obras del Wyrm como los oídos de los Garou que lo escuchan y se dan cuenta de todo lo que Gaia ha perdido.#!"
 totem_form_perk_name: "Forma de Tótem"
 TOTEM_FORM_PERK_EFFECT: "Desbloquea una transformación de Forma de Tótem que se corresponde con tu [pack_totem|E].\n[PODUnlocksCombatMove('POD_combat_move_werewolf_balefire')]\n#flavor Este poderoso Don permite a una Espiral Negra adoptar la apariencia, y buena parte del poder, del tótem Perverso de su manada.#!"
 prelude_to_apocalypse_perk_name: "Preludio al Apocalipsis"
 PRELUDE_TO_APOCALYPSE_PERK_EFFECT: "Desbloquea «Derribar la Celosía» en la acción Manipular la Celosía en la [umbra|E].\n#flavor La Danzante puede desgarrar durante un breve tiempo las obras de eones de la $glossary_weaver$. Este Don rompe la Celosía por completo, fusionando los mundos de la carne y el espíritu tal como eran en los días de leyenda. Además, esta región reparada actúa como un faro brillante para los espíritus del Wyrm, llamando a una oleada de Banes para asistir a la Danzante.#!"
 PRELUDE_TO_APOCALYPSE_REQUIREMENT: "@warning_icon!#X Necesitas completar una misión de un Incarna Maeljin (estaciona a un explorador en el [UmbraGlossary('black_spiral_labyrinth')] e inicia una [umbra_expedition|E] para llegar a ellos y luego recibir una misión) para desbloquear esta ventaja.#!"


#Hakken
 dream_of_a_thousand_cranes_perk_name: "Sueño de mil grullas"
 DREAM_OF_A_THOUSAND_CRANES_PERK_EFFECT: "#flavor Este Don otorga al usuario buena suerte durante un breve periodo de tiempo.#!"
 fair_path_perk_name: "Camino Justo"
 FAIR_PATH_PERK_EFFECT: "#flavor Aparecer ante el propio clan en un consejo o durante los ritos en un estado desaliñado o impuro se considera altamente deshonroso. Este Don permite a un Hakken aparecer perfectamente arreglado y vestido.#!"
 storm_winds_slash_perk_name: "Tajo de vientos de tormenta"
 STORM_WINDS_SLASH_PERK_EFFECT: "[character_interaction|E]: Inflige [POD_superficial_damage|E] a un personaje; la cantidad depende de la [rarity|E] de tu katana equipada.\n[PODUnlocksCombatMove('POD_combat_move_werewolf_storm_winds_slash')]\n#flavor Mientras la Hakken corta con su katana desde la distancia, aparece una herida muy real en su oponente, que refleja el tajo del Garou.#!"
 dark_of_night_perk_name: "Oscuridad de la noche"
 DARK_OF_NIGHT_PERK_EFFECT: "[character_interaction|E]: Inflige [GetModifier('dark_of_night_perk_modifier').GetNameWithTooltip] a un personaje.\n#flavor Provoca ceguera temporal en una víctima elegida; no podrá ver nada más que una oscuridad absoluta. El uso de este Don en un duelo formal se considera una gran ofensa.#!"
 living_treasure_perk_name: "Tesoro Viviente"
 LIVING_TREASURE_PERK_EFFECT: "[buy_claim_interaction|E] y [buy_artifact_claim_interaction|E] Coste: #P -25%#!\n#flavor Los Hakken valoran las antiguas piezas de arte y a menudo tienen tales objetos en sus hogares. Este Don persuade a los espíritus de los objetos para que hablen y cuenten sus historias.#!"
 divine_wind_perk_name: "Viento Divino"
 DIVINE_WIND_PERK_EFFECT: "Desbloquea la opción de Magia Climática: #V Tormenta#! a nivel de [duchy|E].\n[PODUnlocksCombatMove('POD_combat_move_werewolf_divine_wind')]\n#flavor El Hakken invoca una tormenta aterradora sobre una zona objetivo.#!"
 banish_totem_perk_name: "Desterrar Tótem"
 BANISH_TOTEM_PERK_EFFECT: "Aplica [GetModifier('banish_totem_modifier').GetNameWithTooltip] a todos los gobernantes del bando contrario al iniciar una [war|E] como atacante o defensor principal.\n[PODUnlocksCombatMove('POD_combat_move_werewolf_banish_totem')]\n#flavor Pronunciando palabras antiguas y poderosas, el Uktena puede impedir que un tótem ayude a sus hijos, perturbando su sensación de formar parte de una manada.#!"
 banish_totem_modifier: "Desterrar Tótem"
 banish_totem_modifier_desc: "Objetivo de un poderoso Don, este personaje ya no puede usar el trabajo en equipo ni tácticas de manada."
 spirit_bird_perk_name: "Pájaro Espíritu"
 SPIRIT_BIRD_PERK_EFFECT: "#flavor Casi nadie espera que un hombre lobo se eleve como un pájaro, lo que es una excelente razón para que el Uktena lo haga. Este Don permite a un Garou volar o cernerse en el sitio.#!"
 spirit_fish_perk_name: "Pez Espíritu"
 SPIRIT_FISH_PERK_EFFECT: "#flavor El hombre lobo puede respirar bajo el agua y nadar tan rápido como corre en forma Hispo#!"
 uktena_invisibility_perk_name: "Invisibilidad"   
 UKTENA_INVISIBILITY_PERK_EFFECT: "Desbloquea una [character_interaction|E] para detener todos los planes dirigidos contra ti.\n#flavor Concentrándose, el Garou puede desaparecer de la vista. Debe caminar despacio y no puede llamar la atención sobre sí mismo mientras lo hace.#!"
 uktena_call_elemental_perk_name: "Invocar Elemental" 
 UKTENA_CALL_ELEMENTAL_PERK_EFFECT: "Desbloquea [men_at_arms|E] Elementales.\n#flavor El Garou puede invocar en su ayuda a uno de los elementales clásicos.#!"
 fetish_doll_perk_name: "Muñeco Fetiche" 
 FETISH_DOLL_PERK_EFFECT: "Tras realizar con éxito una [infiltration_mission|E] de robo de artefactos u oro, se infligen tres de daño [POD_aggravated_damage_with_box|E] al dueño de la corte al que se ha robado.\n#flavor El hombre lobo puede dañar a sus víctimas desde lejos usando una efigie fabricada especialmente. Debe tener un pequeño fragmento de la víctima o un objeto que le pertenezca, que debe incorporar al muñeco.#!"