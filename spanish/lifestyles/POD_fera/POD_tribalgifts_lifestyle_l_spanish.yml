 RENEW_THE_CYCLE_PERK_EFFECT: "Como una [character_interaction|E], te permite hacer que el no-muerto objetivo vuelva a su estado natural (convertirse en polvo o simplemente perder su animación).\n#F Uno de los poderes más potentes disponibles para los Garou, este Don permite corregir un agravio cometido contra el ciclo natural de Gaia. El no-muerto, cuya existencia misma es una afrenta al orden natural de las cosas, se marchita y se desmorona en polvo cuando es golpeado por el poder de este Don. Ya sea que el no-muerto sea un cadáver animado de un mes de antigüedad o un vampiro ancestral, el Colmillo puede destruirlo con tan solo una mirada.#!"
 RENEW_THE_CYCLE_REQUIREMENT: "@warning_icon!#X Necesitas completar una misión del propio Avatar de Gaia (estaciona a un explorador en cualquier Señorío de la [umbra|E] para encontrar una pista sobre su ubicación e inicia una [umbra_expedition|E] para llegar hasta ellos y recibir una misión) para desbloquear esta ventaja.#!"
 
