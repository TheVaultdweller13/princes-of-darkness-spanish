l_spanish:
 
 
  #Dones: Homínido
  persuasion_perk_name: "Persuasión"
 PERSUASION_PERK_EFFECT: "#flavor Este Don permite a un homínido volverse más persuasivo al tratar con otros; sus afirmaciones y argumentos se impregnan de sentido o credibilidad.#!"
 apecrafts_blessing_perk_name: "Bendición del Arte del Simio"
 APECRAFTS_BLESSING_PERK_EFFECT: "#flavor Aunque muchos de los hijos de Gaia usan herramientas, ninguno las ha dominado tan a fondo como la humanidad. El homínido concentra este dominio en las herramientas que usa, haciendo que sus espíritus despierten y le presten ayuda.#!"
  divide_perk_name: "Dividir"
 DIVIDE_PERK_EFFECT: "[character_interaction|E]: Aplica un modificador negativo de opinión de vasallos.\n#flavor Este Don levanta odio y sospecha entre los enemigos del Garou.#!"
  staredown_perk_name: "Duelo de miradas"
 STAREDOWN_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_staredown')]\n#flavor La $glossary_rage$ arde en los ojos de un hombre lobo y siembra el miedo en los corazones de mortales y animales, haciéndolos huir para salvar la vida.#!"
 reshape_object_perk_name: "Remodelar Objeto"
 RESHAPE_OBJECT_PERK_EFFECT: "$unlock_forging_node$ Añade un modificador según el tipo de Artefacto y [GetModifier('artifact_minor_monthly_prestige_mult_2_modifier').GetNameWithTooltip]\n#flavor El Garou puede dar forma a materia que fue viva y convertirla en una variedad de objetos. Los árboles pueden convertirse en refugio, las cornamentas de ciervo en lanzas, las pieles de animal en armadura y las flores en perfumes.#!"
 weave_of_steel_perk_name: "Tejido de Acero"
 WEAVE_OF_STEEL_PERK_EFFECT: "#flavor El homínido puede reforzar místicamente cualquier estructura o material hecho por el hombre, dando a los tablones la fuerza del acero y al acero la dureza del diamante.#!"
 body_shift_perk_name: "Cambio de Cuerpo"
 BODY_SHIFT_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_werewolf_fang_rush')]\n#flavor Los Garou criados en el cambiante laberinto de la sociedad humana están bien preparados para las interminables adaptaciones que Gaia exige a sus protectores.#!"
 false_comfort_perk_name: "Falso Consuelo"
 FALSE_COMFORT_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_false_comfort')]\nAplica [GetModifier('false_comfort_modifier').GetNameWithTooltip] a los [rulers|E] enemigos al iniciar una [war|E] como atacante o defensor principal.\n#flavor La humanidad ha hecho mucho por rodearse de comodidad y seguridad. Un Garou que usa este Don no destroza armaduras ni derriba puertas: simplemente las ignora por completo. La seguridad es una ilusión.#!"
 false_comfort_modifier: "Falso Consuelo"
 cousins_coat_perk_name: "Pelaje del Primo"
 COUSINS_COAT_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_cousins_coat')]\n#flavor Los Garou con este Don pueden camuflarse con su entorno natural con más facilidad que otros de su especie.#!"
 hares_leap_perk_name: "Salto de la Liebre"
 HARES_LEAP_PERK_EFFECT: "#flavor El hombre lobo puede dar saltos de distancias verdaderamente increíbles al invocar este Don.#!"
 sense_the_unnatural_perk_name: "Sentir lo Antinatural"
 SENSE_THE_UNNATURAL_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_werewolf_bloodhound')]\n$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor El hombre lobo puede detectar cualquier presencia antinatural y calcular su fuerza y tipo aproximados.#!"
 devils_child_perk_name: "Hijo del Diablo"
 DEVILS_CHILD_PERK_EFFECT: "#flavor A los lobos se les suele ver como la progenie del propio Diablo y, aunque no comprenden del todo esa implicación, los lupus se alegran de aprovechar el miedo que inspira. El Garou lanza un feroz gruñido que aterroriza a los oponentes y los intimida hasta someterlos. #!"
 gift_of_the_porcupine_perk_name: "Don del Puercoespín"
 GIFT_OF_THE_PORCUPINE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_gift_of_the_porcupine')]\n#flavor Este Don permite que el pelaje de un Garou se vuelva erizado y afilado como las púas de un puercoespín, y con un puercoespín nunca te metes.#!"
 lord_of_the_wilds_perk_name: "Señor de lo Salvaje"
 LORD_OF_THE_WILDS_PERK_EFFECT: "#flavor El Garou no solo puede comunicarse con los animales, sino atraerlos y darles órdenes.#!"
 umbral_body_perk_name: "Cuerpo Umbral"
 UMBRAL_BODY_PERK_EFFECT: "Puedes transformarte y mantener las formas transformadas mientras permaneces en la [umbra|E].\n#flavor Con este Don, el usuario puede alcanzar parcialmente la Umbra, enviando ciertas partes del cuerpo a ella mientras mantiene otras en el mundo físico.#!"
 
 
 
  #Dones: Lupus
  elemental_gift_perk_name: "Don elemental"
 ELEMENTAL_GIFT_PERK_EFFECT: "Desbloquea [men_at_arms|E] Elementales.\n#flavor El hombre lobo invoca la fuerza primigenia de la propia Gaia y ordena así a los espíritus de los elementos que se alcen, ondulen hacia delante e incluso envuelvan a los enemigos.#!"
 
 
 
 
 
  lunar_auspicegifts_lifestyle_name: "Dones Lunares"
  lunar_auspicegifts_lifestyle_desc: "Céntrate en los dones que vienen con tu Auspicio Lunar."
  lunar_auspicegifts_lifestyle_highlight_desc: "Debido a tu $POD_energy_gnosis$, ganas un #P [GetPlayer.MakeScope.ScriptValue('gnosis_lifestyle_xp_mult')|%0]#! más de [experience|E] en este estilo de vida."
  monthly_lunar_auspicegifts_lifestyle_xp_gain_mult: "[experience|E] mensual de [lifestyle|E] de Dones de Auspicio Lunar"
  lunar_auspicegifts_focus: "Enfoque en Dones de Auspicio Lunar"
  lunar_auspicegifts_focus_modifier: "[GetFocus('lunar_auspicegifts_focus').GetName]"
  lunar_auspicegifts_focus_desc: "Los Dones de las cinco fases lunares."
  lunar_auspicegifts_focus_effect_desc: "Centrarse en Dones de Auspicio Lunar otorga:"
  lunar_auspicegifts_ahroun_visible: "Ahroun"
  lunar_auspicegifts_galliard_visible: "Galliard"
  lunar_auspicegifts_ragabash_visible: "Ragabash"
  lunar_auspicegifts_philodox_visible: "Philodox"
  lunar_auspicegifts_theurge_visible: "Theurge"
 
 
  #Dones: Ahroun
  true_fear_perk_name: "Miedo verdadero"
 TRUE_FEAR_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_true_fear')]\n#flavor El Ahroun puede abrumar a un enemigo concreto con la magnitud de su poder, asustándolo hasta la inacción.#!"
 snarl_of_challenge_perk_name: "Gruñido de desafío"
 SNARL_OF_CHALLENGE_PERK_EFFECT: "#flavor Con un gruñido temible, el Ahroun puede obligar a un enemigo a luchar contra él hasta que el suelo se tiña de sangre.#!"
 primal_anger_perk_name: "Ira Primigenia"
 PRIMAL_ANGER_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_primal_anger')]\nElimina todos los costes de transformarte en [GetModifier('POD_werewolf_form_crinos_modifier').GetNameWithTooltip]\n#flavor El Ahroun deja que su Furia consuma su propia fuerza vital para alimentar una destrucción mayor.#!"
 strength_of_will_perk_name: "Fuerza de Voluntad"
 STRENGTH_OF_WILL_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_werewolf_face_the_apocalypse')]\n#flavor Un Garou con este Don es un pilar de voluntad indomable. También puede compartir esta aterradora determinación con otros y conducirlos incluso a una perdición segura sin un instante de miedo.#!"
 shake_the_earth_perk_name: "Sacudir la Tierra"
 SHAKE_THE_EARTH_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_shake_the_earth')]\n#flavor La fuerza de la Furia del Ahroun parte el suelo ante él y causa grandes daños a su entorno.#!"
 lunas_armor_perk_name: "Armadura de $glossary_luna$"
 LUNAS_ARMOR_PERK_EFFECT: "Obtienes inmunidad al [fire_damage_short_with_icon|E].\n#flavor El Ahroun se baña en la pura luz de luna de Luna, que lo protege de las llamas de sus enemigos.#!"
 full_moons_light_perk_name: "Luz de la Luna Llena"
 FULL_MOONS_LIGHT_PERK_EFFECT: "#flavor La luna llena es la fase guerrera de $glossary_luna$, cuando asume el semblante de Diana la Cazadora y busca a sus enemigos. El Ahroun puede invocar su determinación para encontrar a sus rivales e iluminar a quienes se le oponen.#!"
  unstoppable_warrior_perk_name: "Guerrero imparable"
 UNSTOPPABLE_WARRIOR_PERK_EFFECT: "Casillas de [POD_health_track|E]: #P +1#!\nCura #V 2#! [POD_aggravated_box|E] tras ganar un [pod_combat_encounter|E]\n#flavor El hombre lobo se ha convertido en la representación suprema de su Auspicio. Ninguna herida puede detenerlo, solo la muerte.#!"
 
  NEEDS_AHROUN_TEXT: "@warning_icon!#X Requiere los [traits|E] [GetTrait('ahroun').GetName( GetPlayer )] para comprar ventajas en este árbol.#!"
  UNSTOPPABLE_WARRIOR_REQUIREMENT: "@warning_icon!#X Necesitas terminar una misión del Incarna Guerrero (estaciona a un explorador en cualquier reino de la umbra para encontrar una pista sobre la ubicación e inicia una [umbra_expedition|E] para llegar a ellos y luego recibir una misión) para desbloquear esta ventaja.#!"
 
 
 
 
  #Dones: Galliard
  primal_song_perk_name: "Canción primordial"
 PRIMAL_SONG_PERK_EFFECT: "[character_interaction|E]: Entreteje #clickable Versos de Canción#! para crear diversos efectos.\n#clickable Verso de Canción: [GetModifier('galliard_song_development_decline_modifier').GetNameWithTooltip]#!\n#clickable Verso de Canción: Invoca a un Espíritu aleatorio#!\n#flavor El Galliard entreteje poderosas canciones con su Gnosis. Una canción en apariencia normal puede tener los efectos más impredecibles.#!"
 galliard_song_development_decline_modifier: "Retorno Primigenio"
 song_of_valor_perk_name: "Canción del Valor"
 SONG_OF_VALOR_PERK_EFFECT: "#clickable Verso de Canción: Cura 2 [POD_aggravated_box|E]#!\n#clickable Verso de Canción: [GetModifier('galliard_song_prowess_modifier').GetNameWithTooltip]#!\n[PODUnlocksCombatMove('POD_combat_move_werewolf_song_of_valor')]\n#flavor Canta las hazañas heroicas de los antiguos Garou para reforzar a quienes escuchan. El deseo de heroísmo los impulsa cada vez más adelante.#!"
 galliard_song_prowess_modifier: "Fuerza Valerosa"
 canine_call_perk_name: "Llamada Canina"
 CANINE_CALL_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_canine_call')]\n[character_interaction|E]: Obtén un [GetModifier('dog_story_modifier').GetNameWithTooltip]\n#flavor Desde el Impergium y la Guerra de la Rabia, todo lo demás del planeta ha vivido con asombro y terror ante el sonido de los lobos aullando. Modulando su voz justo así, el Galliard emite una llamada que solo los cánidos pueden oír.#!"
 song_of_rage_perk_name: "Canción de la Furia"
 SONG_OF_RAGE_PERK_EFFECT: "#clickable Verso de Canción: [GetModifier('galliard_song_irrational_modifier').GetNameWithTooltip]#!\n#clickable Verso de Canción: [GetModifier('galliard_song_countermeasure_modifier').GetNameWithTooltip]#!\n#flavor El grito del hombre lobo libera al animal en el corazón del objetivo y lo azuza hasta el frenesí.#!"
 galliard_song_irrational_modifier: "Señor de la Guerra Furioso"
 galliard_song_irrational_modifier_desc: "Este personaje está tan furioso que ha perdido la capacidad de actuar con racionalidad."
 galliard_song_irrational_storyteller_modifier: "Señor de la Guerra Furioso Legendario"
 galliard_song_irrational_storyteller_modifier_desc: "$galliard_song_irrational_modifier_desc$"
 galliard_song_countermeasure_modifier: "Furia Cegadora"
 galliard_song_countermeasure_modifier_desc: "Tanta furia los ciega ante los peligros ocultos. Las [scheme_countermeasures|E] ya no son eficaces."
 galliard_song_countermeasure_storyteller_modifier: "Furia Cegadora Legendaria"
 galliard_song_countermeasure_storyteller_modifier_desc: "$galliard_song_countermeasure_modifier_desc$"
 words_like_wind_perk_name: "Palabras como Viento"
 WORDS_LIKE_WIND_PERK_EFFECT: "#clickable Las Canciones ignoran el [diplomatic_range|E]#!\n#flavor La música, la poesía y las frases pegadizas son contagiosas y barren culturas y comunidades como una brisa entre los árboles. El Galliard sabe aprovechar esta costumbre de las criaturas sociales y envía sus mensajes por el mundo oído a oído.#!"
 song_of_the_siren_perk_name: "Canción de la Sirena"
 SONG_OF_THE_SIREN_PERK_EFFECT: "#clickable Verso de Canción: Aumenta la [opinion|E] hacia el Galliard#!\n#clickable Verso de Canción: Obtén un [hook|E]#!\n#flavor El sonido de la voz del Garou puede embelesar a cualquiera que la oiga. Normalmente, el Garou canta o aúlla al usar este Don, aunque algunos han optado por la declamación poética.#!"
 galliard_song_of_the_siren_opinion: "Tentación de la Sirena"
 song_of_the_siren_weak_hook: "Dominio de la Sirena"
 song_of_the_siren_strong_hook: "Control de la Sirena"
 howl_of_assembly_perk_name: "Aullido de Convocatoria"
 HOWL_OF_ASSEMBLY_PERK_EFFECT: "Aceptación de invitación a la [court|E] para $POD_splat_werewolf_plural$: #P +10#!\n#flavor El aullido del Galliard se oye a grandes distancias y convoca a los Garou a la batalla.#!"
 HOWL_OF_ASSEMBLY_INVITE: "[GetPerk('howl_of_assembly_perk').GetName(GetPlayer)]: $VALUE|=+0$"
 song_of_mockery_perk_name: "Canción de la Burla"
 SONG_OF_MOCKERY_PERK_EFFECT: "#clickable Verso de Canción: [GetModifier('galliard_song_vassal_opinion_modifier').GetNameWithTooltip]#!\n#clickable Verso de Canción: Transfiere [prestige|E] al Galliard#!\n[PODUnlocksCombatMove('POD_combat_move_werewolf_song_of_mockery')]\n#flavor Estas canciones pretenden burlarse de los enemigos del Galliard. Por desgracia, la mayoría son demasiado incultos para darse cuenta.#!"
 galliard_song_vassal_opinion_modifier: "Oda Burlona"
 song_of_serenity_perk_name: "Canción de la Serenidad"
 SONG_OF_SERENITY_PERK_EFFECT: "#clickable Verso de Canción: Reduce el [stress|E]#!\n#clickable Verso de Canción: [GetModifier('galliard_song_no_war_modifier').GetNameWithTooltip] y detiene las guerras ofensivas activas#!\n#flavor Los sonidos más relajantes pueden calmar incluso a los corazones más violentos.#!"
 galliard_song_no_war_modifier: "Serenidad Total"
 galliard_song_no_war_modifier_desc: "Su mente está tan en calma que ni siquiera pueden plantearse iniciar [wars|E]"
 galliard_song_no_war_storyteller_modifier: "Serenidad Total Legendaria"
 galliard_song_no_war_storyteller_modifier_desc: "$galliard_song_no_war_modifier_desc$"
 song_of_the_storm_perk_name: "Canción de la Tormenta"
 SONG_OF_THE_STORM_PERK_EFFECT: "#clickable Verso de Canción: Inflige daño de [lightning_damage_short_with_icon|E]#!\n#clickable Verso de Canción: [GetModifier('galliard_song_speed_modifier').GetNameWithTooltip]#!\n#flavor La Galliard puede aprovechar el tejido mismo de la Umbra de la Tormenta con su canción, extrayendo un caótico torbellino de energías del Wyld para obrar un cambio en el entorno o en quienes están atrapados en él.#!"
 galliard_song_speed_modifier: "Caminata de tormenta"
  storyteller_perk_name: "Cuentacuentos"
 STORYTELLER_PERK_EFFECT: "#clickable Los Versos de Canción ahora se activan dos veces u obtienen efectos adicionales#!\n#flavor En lugar de limitarse a contar y volver a contar las historias de antaño, o incluso a esperar a que los sucesos del día se conviertan en las nuevas historias, la Galliard puede cambiar los acontecimientos del drama en curso que se desarrolla a su alrededor. Puede añadir nuevos «personajes», alterar cadenas de acontecimientos e incluso cambiar los motivos de los principales participantes.#!"
 command_the_gathering_perk_name: "Dominar la Asamblea"
 COMMAND_THE_GATHERING_PERK_EFFECT: "#flavor La Philodox atrae todas las miradas hacia sí con una gran exclamación, una palmada, el golpe de un klaive contra un escudo u otro gesto similar. Hasta que haya dicho lo suyo, nadie puede marcharse ni interrumpirla. #!"
 aura_of_the_just_perk_name: "Aura de los Justos"
 AURA_OF_THE_JUST_PERK_EFFECT: "#flavor Cuando quien usa el Don comete un acto justo, todos a su alrededor lo saben con solo mirarlo. El Aura de los Justos proclama a todos que este Garou tiene la razón. Allí donde las circunstancias o las percepciones puedan nublar el juicio de los testigos, el Don despeja todas las dudas.#!"
 building_a_legend_perk_name: "Forjar una Leyenda"
 BUILDING_A_LEGEND_PERK_EFFECT: "#clickable Entrenamiento de Manada:#! Todos los $POD_splat_garou$ ganan [trait_level_track_xp|E] en sus Auspicios.\n#flavor Los Philodox son los líderes naturales de los Garou en tiempos de paz, respaldados por la fe y la confianza que les otorgan sus pupilos.#!"
 truth_of_gaia_perk_name: "Verdad de Gaia"
 TRUTH_OF_GAIA_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$\nVelocidad de progreso de [espionage|E]: #P +25%#!\n#flavor Como jueces de la $glossary_werewolf_litany$, los Philodox tienen la capacidad de intuir si otros han dicho verdad o falsedad.#!"
 TRUTH_OF_GAIA_REASON: "$truth_of_gaia_perk_name$: $VALUE|+=0$"
 bonds_that_tie_us_perk_name: "Lazos que nos Unen"
 BONDS_THAT_TIE_US_PERK_EFFECT: "#clickable Entrenamiento de Manada:#! Cada miembro obtiene un [modifier|E] por cada Auspicio Lunar distinto de la Manada.\nLos miembros de la manada ya no pueden hacerse [rival|E] unos a otros.\n#flavor El Philodox es mediador y juez, pero también líder. Este Don ayuda al Philodox en tales asuntos revelando las emociones y opiniones que existen entre los demás.#!"
 philodox_pack_auspice_ahroun_modifier: "Poderío del Ahroun"
 philodox_pack_auspice_galliard_modifier: "Canción del Galliard"
 philodox_pack_auspice_philodox_modifier: "Voluntad del Philodox"
 philodox_pack_auspice_ragabash_modifier: "Sombra del Ragabash"
 philodox_pack_auspice_theurge_modifier: "Sabiduría del Theurge"
 curse_the_betrayer_perk_name: "Maldecir al Traidor"
 CURSE_THE_BETRAYER_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_curse_the_betrayer')]\n[character_interaction|E]: Aplica [GetModifier('curse_the_betrayer_modifier').GetNameWithTooltip] a un $glossary_fera$ de otra [religious_family|E].\nProbabilidad de [imprison|E]: #P +10%#!\n#flavor Quien traiciona a los Philodox paga por su deshonestidad. El Juicio no puede eludirse.#!"
 CURSE_THE_BETRAYER_REASON: "$curse_the_betrayer_perk_name$: $VALUE|+=0$"
 curse_the_betrayer_modifier: "Maldecir al Traidor"
 rally_to_the_cause_perk_name: "Unirse a la Causa"
 RALLY_TO_THE_CAUSE_PERK_EFFECT: "#clickable Entrenamiento de Manada:#! Todos los miembros pierden [stress|E].\nAplica [GetModifier('rally_to_the_cause_modifier').GetNameWithTooltip] a los [knights|E] $glossary_fera$ aliados cuando actúes como [commander|E] durante la [combat_phase|E], o a ti mismo durante los [single_combat_duel_plural|E].\n#flavor A veces un Philodox necesita reunir a los Garou para lograr un objetivo. Este Don ayuda al Philodox a inspirar a otros Garou a seguir su causa, a pesar de las diferencias tribales o personales.#!"
 rally_to_the_cause_modifier: "Mando del Philodox"
 balance_man_and_beast_perk_name: "Equilibrar Hombre y Bestia"
 BALANCE_MAN_AND_BEAST_PERK_EFFECT: "Elimina todos los costes de transformarte en [GetModifier('POD_werewolf_form_hispo_modifier').GetNameWithTooltip]\n#flavor Un Philodox necesita mantener bien sujeto su lado bestial por miedo a perder el control y, quizá peor aún, a permitir que sus pasiones controlen su juicio. Sin embargo, un Garou no puede negar su naturaleza animal; la racionalidad no puede reinar sola.#!"
 honour_bound_perk_name: "Ligado por el Honor"
 HONOUR_BOUND_PERK_EFFECT: "Un miembro disponible de tu [GetPlayer.Custom('PODCoterie')] se unirá a ti en [pod_combat_encounters_with_icon|E]\n#clickable Entrenamiento de Manada:#! Todos los $glossary_fera$ obtienen [prestige|E] y [legitimacy|E] en proporción a su Rango.\n#flavor Muchas manadas Garou comparten fuertes lazos entre sí. Este Don amplifica ese sentido del honor y del respeto.#!"
 wisdom_of_the_ancient_ways_perk_name: "Sabiduría de los Caminos Antiguos"
 WISDOM_OF_THE_ANCIENT_WAYS_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_wisdom_of_the_ancient_ways')]\n#clickable Entrenamiento de Manada:#! Todos los miembros obtienen [GetModifier('philodox_ancient_ways_modifier').GetNameWithTooltip] y recuperan 2 de $POD_energy_gnosis$ si tienes un [pack_totem|E].\n#flavor Todos los Garou tienen una conexión innata con sus espíritus tótem, una forma de inconsciente racial a la que se puede acceder mediante meditación intensa. El Garou puede aprovechar profundamente estos recuerdos hondos y recordar hechos y saberes antiguos que podrían ser útiles hoy.#!"
 philodox_ancient_ways_modifier: "Caminos Antiguos"
 break_the_bonds_perk_name: "Romper los vínculos"
 BREAK_THE_BONDS_PERK_EFFECT: "[character_interaction|E]: Libera a un personaje [imprisoned|E].\nObtén Fuertes Defensas Mentales.\nNo se te puede [blackmailed|E].\n#flavor Este Don rompe todos los vínculos, ya sean físicos o mentales, desde recias cadenas de hierro hasta la esclavitud de la sangre hechizada de un vampiro.#!"
 fools_gold_perk_name: "Oro de Tontos"
 FOOLS_GOLD_PERK_EFFECT: "#clickable Ahora pueden aparecer Marcas de Luna#!\n#flavor Lo que no vale nada para unos es impagable para otros. El favor de Luna es para quienes lo buscan.#!"
 open_seal_perk_name: "Abrir Sello"
 OPEN_SEAL_PERK_EFFECT: "#flavor Con este Don el Garou puede abrir casi cualquier tipo de dispositivo cerrado o con llave.#!"
 reynards_lie_perk_name: "Mentira de Reynard"
 REYNARDS_LIE_PERK_EFFECT: "#flavor El Ragabash con este Don puede explicar con calma que el cielo es verde o regalar con regocijo a otros las hazañas de un Ragabash solitario y heroico, sin miedo a que lo desenmascaren por la mentira.#!"
 taking_the_forgotten_perk_name: "Tomar lo Olvidado"
 TAKING_THE_FORGOTTEN_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_taking_the_forgotten')]\nElimina todas las [artifact_claims|E] de cualquier [artifacts|E] obtenido\n#flavor La Ragabash no solo es una ladrona consumada, sino que aquellos a quienes roba a menudo ni siquiera se dan cuenta de que los han robado.#!"
 turn_the_moon_perk_name: "Girar la Luna"
 TURN_THE_MOON_PERK_EFFECT: "#clickable Ahora pueden aparecer Marcas de Luna a la luz de la luna#!\nLos [schemes|E] que usan [secrecy_grace|E] comienzan con 12 meses adicionales de ella\nDesbloquea la [buy_artifact_claim_interaction|E]\n#flavor El poder de un Garou crece y mengua junto con la luna. Pero un Ragabash da la vuelta al reloj de arena una vez más.#!"
 terrain_shift_perk_name: "Desplazamiento de Terreno"
 TERRAIN_SHIFT_PERK_EFFECT: "#flavor La naturaleza acepta al Ragabash como aliado y ve a sus perseguidores como enemigos. La tierra y la piedra se apartan para crear túneles o asideros por los que trepar, el follaje se agolpa tras él, infranqueable, y los ríos crean tramos secos para que los cruce.#!"
 chimerical_form_perk_name: "Forma Quimérica"
 CHIMERICAL_FORM_PERK_EFFECT: "Desbloquea varias formas animales de transformación.\n#flavor Los grandes embaucadores de las leyendas son todos maestros del cambio de forma, y el Ragabash que domina este Don no es una excepción. Con él, puede cambiar su forma por la de cualquier animal entre el tamaño de un diminuto pinzón y el de una enorme morsa. #!"
 mark_of_shame_perk_name: "Marca de Vergüenza"
 MARK_OF_SHAME_PERK_EFFECT: "Siempre que obtengas un [artifact|E], su anterior dueño recibe [GetModifier('mark_of_shame_modifier').GetNameWithTooltip]\n#flavor El Ragabash puede invocar una terrible maldición sobre el cuerpo de un oponente, que lo debilita o lo marchita, a menudo como represalia por algún acto. Un recordatorio terrible y frustrante de la humillación infligida al objetivo.#!"
 mark_of_shame_modifier: "Marca de Vergüenza"
 umbral_dodge_perk_name: "Esquiva Umbral"
 UMBRAL_DODGE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_umbral_dodge')]\n#flavor El Ragabash descubre que la mejor manera de tratar con un enemigo es enviarlo muy lejos, quizá a un lugar donde aprenda la locura de sus actos. Puede abrir un agujero en el Gauntlet mientras esquiva el ataque de un enemigo y enviarlo a la tierra de los espíritus.#!"
 madness_season_perk_name: "Temporada de locura"
 MADNESS_SEASON_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_werewolf_bloodhound')]\nDesbloquea [GetTravelOption('werewolf_ragabash_option').GetName]\n#flavor A menudo existe una línea fina entre el humor disparatado y el precipicio de la demencia. La comprensión que la Luna Nueva tiene de este límite le permite enviar a los enemigos tambaleándose al borde de la locura.#!"
 madness_season_modifier: "Temporada de locura"
 madness_season_modifier_desc: "Este personaje ha sido empujado a la locura absoluta, lo que le hace unirse a [factions|E] sin motivo."
 MADNESS_SEASON_FACTION_REASON: "[GetModifier('madness_season_modifier').GetNameWithTooltip]: $VALUE|0+=$"
 
  NEEDS_GALLIARD_TEXT: "@warning_icon!#X Requiere los [traits|E] [GetTrait('galliard').GetName( GetPlayer )] para comprar ventajas en este árbol.#!"
 
 
 
  #Dones: Philodox
 
  NEEDS_PHILODOX_TEXT: "@warning_icon!#X Requiere los [traits|E] [GetTrait('philodox').GetName( GetPlayer )] para comprar ventajas en este árbol.#!"
 
 
 
  #Dones: Ragabash
  firebringer_perk_name: "Portador del fuego"
 FIREBRINGER_PERK_EFFECT: "#clickable Obtén Puntos de [perk|E] acordes a la [education|E] del propietario al obtener Marcas con 75 o más de [artifact_power|E]#!\nLos objetivos de tu [character_interaction|E] #V Entrenar Don#! obtienen un [perk|E] adicional.\n#flavor El Ragabash ejecuta el truco definitivo: robar un poder y convertirlo en suyo. Es más, el poder puede enseñarse a otros, como si la Luna Nueva fuera un espíritu maestro.#!"
 airt_perception_perk_name: "Percepción de Airt"
 AIRT_PERCEPTION_PERK_EFFECT: "#clickable[character_interaction|E]: Ata a un [spirit_companion|E] a una provincia con un Túmulo#!\n#flavor Un Theurge puede identificar aproximadamente a un espíritu por su airt, el rastro que deja a su paso. Esto funciona esencialmente como rastrear en el mundo corpóreo y no es más informativo.#!"
 
  NEEDS_RAGABASH_TEXT: "@warning_icon!#X Requiere los [traits|E] [GetTrait('ragabash').GetName( GetPlayer )] para comprar ventajas en este árbol.#!"
 
  
  #Dones: Theurge
  sense_chiminage_perk_name: "Sentir Chiminage"
 SENSE_CHIMINAGE_PERK_EFFECT: "#flavor Los Theurge con este Don pueden saber, de un vistazo, dónde se sitúa el equilibrio del chiminage en cualquier ser con conciencia espiritual.#!"
 eyes_of_the_lynx_perk_name: "Ojos del Lince"
 EYES_OF_THE_LYNX_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n#flavor Los espíritus de lince, que encarnan el ideal Umbral de la potente vista de sus homólogos terrenales, pueden ver incluso más allá de los obstáculos físicos. Los Theurge que aprenden este Don pueden mirar a través de paredes o bajo tierra.#!"
  spirit_skin_perk_name: "Piel de espíritu"
 SPIRIT_SKIN_PERK_EFFECT: "Puedes transformarte y mantener las formas transformadas mientras permaneces en la [umbra|E]\n#flavor La Theurge se disfraza de espíritu lobo dentro de la Umbra. Físicamente sigue pareciéndose exactamente a su forma Lupus; simplemente da la impresión de ser un espíritu y no un Garou.#!"
 SPIRIT_SKIN_REASON: "$spirit_skin_perk_name$: $VALUE|+=0$"
 name_the_spirit_perk_name: "Nombrar al Espíritu"
 NAME_THE_SPIRIT_PERK_EFFECT: "Puedes reclutar [GetMaA('jagglings').GetName] como [men_at_arms|E].\n[PODUnlocksCombatMove('POD_combat_move_werewolf_name_the_spirit')]\n#flavor El Garou es capaz de detectar el tipo y los niveles aproximados de habilidad de un Espíritu. Con ello puede después llamar al Espíritu a su ubicación.#!"
 placation_perk_name: "Aplacamiento"
 PLACATION_PERK_EFFECT: "Todos tus [spirit_companions|E] reciben [trait_level_track_xp|E] al final de los [journeys|E] de #V Búsqueda Espiritual#!.\nPuedes aprender #V 2#! [language|E] adicionales sin penalizaciones.\n#flavor Un Theurge con este Don siempre sabe exactamente qué clase de sacrificio es necesario para expiar una ofensa contra el mundo espiritual o para rendir simplemente tributo.#!"
 prophecy_perk_name: "Profecía"
 PROPHECY_PERK_EFFECT: "Desbloquea la [decision|E] Adivinar las Estrellas.\n[PODImprovesCombatMove('POD_combat_move_werewolf_face_the_apocalypse')]\n#flavor Este Don ofrece al Theurge una verdadera visión del futuro. Tales visiones son esporádicas y a veces enigmáticas, pero, a menos que se haga un esfuerzo específico por cambiar lo que viene, siempre son exactas.#!"
 healing_the_soul_perk_name: "Sanar el Alma"
 HEALING_THE_SOUL_PERK_EFFECT: "#clickable Atadura de Espíritu: Cura todas las [diseases|E] y reduce el [stress|E] de todos los [courtiers|E]#!\n#clickable Atadura de Espíritu: Atar a un Espíritu de Rango máximo eliminará tus [traits|E] negativos de [stress|E]#!\n#flavor Mediante una prueba de una semana de ayuno, estados de trance y comunión espiritual, el Theurge es capaz de poner en perfecto equilibrio dentro de las almas los elementos del Rasgo.#!"
 mold_the_spirit_perk_name: "Moldear al Espíritu"
 MOLD_THE_SPIRIT_PERK_EFFECT: "#flavor El Garou puede cambiar la forma o el propósito de un Espíritu. Curiosamente, al Espíritu no le importa.#!"
  spirit_vessel_perk_name: "Receptáculo espiritual"
 SPIRIT_VESSEL_PERK_EFFECT: "#clickable Atadura de Espíritu: Obtén [GetModifier('theurge_spirit_vessel_modifier').GetNameWithTooltip] en proporción al Rango del Espíritu#!\nDesbloquea formas Elementales de transformación.\n[PODUnlocksCombatMove('POD_combat_move_werewolf_spirit_vessel')]\n#flavor Uno de los secretos mejor guardados de los ancianos Theurge es la capacidad de canalizar espíritu. Durante un breve tiempo, Garou y espíritu se convierten en una sola criatura con las habilidades de ambos.#!"
 theurge_spirit_vessel_modifier: "Poder Desatado"
 SPIRIT_VESSEL_SCALE: "Rango del Espíritu Atado"
 invoked_presence_perk_name: "Presencia Invocada"
 INVOKED_PRESENCE_PERK_EFFECT: "[character_interaction|E]: Sacrifica a un [spirit_companion|E] de Rango máximo para obtener [GetTrait('truefaith').GetName(GetPlayer)]\n#flavor El Theurge puede invocar directamente a una Incarna o a un Celestino, llevando su atención al área que lo rodea. Esto no invoca a un Avatar; más bien, la presencia es una permeación mística del principio que representa el espíritu invocado. Tal gran poder, sin embargo, conlleva un gran coste.#!"
 
  NEEDS_THEURGE_TEXT: "@warning_icon!#X Requiere los [traits|E] [GetTrait('theurge').GetName( GetPlayer )] para comprar ventajas en este árbol.#!"
 AUSPICE_ENDPERK_REQUIREMENT: "@warning_icon#!#X Esta ventaja solo se puede obtener completando el [story_cycle|E] de tu Auspicio."
 rhythm_of_war_perk_name: "Ritmo de Guerra"
 RHYTHM_OF_WAR_PERK_EFFECT: "#clickable [character_interaction|E]: Desafía a otro personaje a un [pod_combat_encounter_with_icon|E].#!\n#flavor Mientras el Ahroun siga luchando al ritmo de su tambor de guerra interior, no se le puede detener. Los golpes que abatirían a un combatiente menor no son más que picaduras de avispa para los guerreros más poderosos del Garou.#!"
 steadfast_perk_name: "Firme"
 STEADFAST_PERK_EFFECT: "#flavor Sea cual sea la tarea, el Ahroun no se cansa. Este Don permite al Garou trabajar, correr o luchar mucho más allá de sus límites normales.#!"
 iron_claws_perk_name: "Garras de Hierro"
 IRON_CLAWS_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_fera_beast_strike')]\n#flavor Las garras del Garou se vuelven de hierro afilado, lo que le permite desgarrar con facilidad tanto la carne como la armadura.#!"
