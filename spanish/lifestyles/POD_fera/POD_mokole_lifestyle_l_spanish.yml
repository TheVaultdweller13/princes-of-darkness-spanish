 age_of_man_perk_name: "Era del hombre"
 AGE_OF_MAN_PERK_EFFECT: "Permite encontrar fragmentos de artefactos en los [UmbraGlossary('astral_reaches')]."
 sun_spark_perk_name: "Chispa del Sol"
 SUN_SPARK_PERK_EFFECT: "$unlock_forging_node$ Añade un modificador según el tipo de artefacto y añade 10 de [durability|E]; esto reemplaza a un Nodo de Forja Base."
 strengthening_chant_perk_name: "Cántico de Fortalecimiento"
 STRENGTHENING_CHANT_PERK_EFFECT: "$unlock_forging_node$ Aumenta la [durability|E] en 20; esto reemplaza a un Nodo de Forja Base."
 curing_the_body_perk_name: "Curar el cuerpo"
 CURING_THE_BODY_PERK_EFFECT: "$unlock_brewing_node$ Cura 1 de [POD_superficial_damage_with_box|E] y enfermedades mortales.\n$unlock_brewing_node$ Añade 25 de [supply|E] al ejército que lidere el objetivo."
 brews_of_the_mokole_perk_name: "Brebajes del Mokolé"
 BREWS_OF_THE_MOKOLE_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('matre_medicine_modifier').GetNameWithTooltip], si el personaje es mujer y está casada, quedará embarazada.\n$unlock_brewing_node$ [GetModifier('snake_herbs_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('swimmers_medicine_modifier').GetNameWithTooltip]."
 stones_of_power_perk_name: "Piedras de poder"
 STONES_OF_POWER_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('sunstones_modifier').GetNameWithTooltip]\n$unlock_enhancing_node$ [GetModifier('bloodstones_modifier').GetNameWithTooltip]"
 flood_the_land_perk_name: "Inundar la tierra"
 FLOOD_THE_LAND_PERK_EFFECT: "Desbloquea la opción de Magia Meteorológica: #V Inundación#!"
 bring_the_apocalypse_perk_name: "Traer el Apocalipsis"
 BRING_THE_APOCALYPSE_PERK_NAME: ""
 the_devisor_perk_name: "El [Glossary('Devisor', 'glossary_wyld_tt')]"
 THE_DEVISOR_PERK_EFFECT: ""
 the_designer_perk_name: "El [Glossary('Designer', 'glossary_weaver_tt')]"
 THE_DESIGNER_PERK_EFFECT: "Financiar las inspiraciones para artefactos o encargar uno es ahora menos costoso."
 the_dissolver_perk_name: "El [Glossary('Dissolver', 'glossary_wyrm_tt')]"
 THE_DISSOLVER_PERK_EFFECT: ""


 age_of_beasts_perk_name: "Era de las bestias"
 AGE_OF_BEASTS_PERK_EFFECT: "La Magia Meteorológica ahora puede tener como objetivo los [duchies|E]"
 sun_ray_perk_name: "Rayo de Sol"
 SUN_RAY_PERK_EFFECT: "Mejora [GetPerk('sun_spark_perk').GetName(GetPlayer)] pero ya no añade [durability|E]."
 turtle_blessing_perk_name: "Bendición de la Tortuga"
 TURTLE_BLESSING_PERK_EFFECT: "Mejora [GetPerk('strengthening_chant_perk').GetName(GetPlayer)] al añadir 10 de [durability|E] adicional\n$unlock_forging_node$ El próximo [crafting_node|E] que reduzca la [durability|E] no reducirá la [durability|E]."
 see_the_form_perk_name: "Ver la Forma"
 SEE_THE_FORM_PERK_EFFECT: "$unlock_enhancing_node$ Gasta fragmentos de artefacto para añadir [artifact_power_with_icon|E] a un [artifact|E] #COMMONBROWN Común#! o #color_dark_green Maestro#!.\n[character_interaction|E]: Desmantela un [artifact|E], convirtiéndolo en fragmentos de artefacto."
 cleansing_the_mind_perk_name: "Limpiar la mente"
 CLEANSING_THE_MIND_PERK_EFFECT: "$unlock_forging_template$ Lungin: Un artefacto que no se puede equipar con 4 cargas que reduce el [stress|E] según su [artifact_power_with_icon|E]."
 tools_of_destruction_perk_name: "Herramientas de destrucción"
 TOOLS_OF_DESTRUCTION_PERK_EFFECT: "$unlock_forging_template$ Flechas del Sol: Un artefacto que no se puede equipar que inflige daño solar a un personaje según su [artifact_power_with_icon|E].\n$unlock_forging_template$ Dardo de Trueno: Un artefacto que no se puede equipar que causa bajas en un [army|E] según su [artifact_power_with_icon|E]."
 dream_the_beast_perk_name: "Soñar a la Bestia"
 DREAM_THE_BEAST_PERK_EFFECT: "Puede reclutar a [GetMaA('archators').GetName] como [men_at_arms|E].\nPermite encontrar $POD_bygones_maa$ dinosaurios adicionales en el [UmbraGlossary('astral_reaches')].\n[character_interaction|E]: Invoca una Montura de Dinosaurio [artifact|E]; se desbloquearán más opciones a medida que descubras más dinosaurios en el [UmbraGlossary('astral_reaches')]."
 beast_kin_perk_name: "Pariente de las bestias"
 BEAST_KIN_PERK_EFFECT: ""
 apis_rebirth_perk_name: "Renacimiento de Apis"
 APIS_REBIRTH_PERK_EFFECT: "Puede reclutar a [GetMaA('apis_minotaurs').GetName] como [men_at_arms|E]."
 camazotz_paranoia_perk_name: "Paranoia de Camazotz"
 CAMAZOTZ_PARANOIA_PERK_EFFECT: "Puede reclutar a [GetMaA('camazotz_megachiropteras').GetName] como [men_at_arms|E]."
 grondr_purification_perk_name: "Purificación de Grondr"
 GRONDR_PURIFICATION_PERK_EFFECT: "Puede reclutar a [GetMaA('grondr_daeodons').GetName] como [men_at_arms|E].\nAumenta la probabilidad de éxito de las [interactions|E] de [GetTrait('mokole').GetName(GetNullCharacter)] cuando el objetivo sea un siervo del $glossary_wyrm$."


 age_of_sleep_perk_name: "Edad del sueño"
 AGE_OF_SLEEP_PERK_EFFECT: "La magia climática ahora puede tener como objetivo [kingdoms|E]"
 sun_flame_perk_name: "Llama del Sol"
 SUN_FLAME_PERK_EFFECT: "Mejora [GetPerk('sun_ray_perk').GetName(GetPlayer)] pero ahora reduce la [durability|E] en 10."
 dragon_scale_perk_name: "Escama de Dragón"
 DRAGON_SCALE_PERK_EFFECT: "$unlock_forging_node$ Gasta fragmentos de artefacto para duplicar la [durability|E]; el coste escala con la durabilidad actual del artefacto."
 dream_the_form_perk_name: "Soñar la Forma"
