l_spanish:



####Common Gifts####

 razor_claws_perk_name: "Garras afiladas"
 RAZOR_CLAWS_PERK_EFFECT: "#flavor Al pasar sus garras sobre piedra, acero u otra superficie dura, el Mokolé las afila hasta dejarlas como cuchillas.#!"
 talk_perk_name: "Hablar"
 TALK_PERK_EFFECT: "Puede aprender #V 1#! [language|E] adicional sin penalización alguna.\n#flavor Este Don permite al Mokolé hablar cualquier lengua humana que conozca mientras esté en su forma Suchid o Archid.#!"
 blessings_of_the_nest_perk_name: "Bendiciones del Nido"
 BLESSINGS_OF_THE_NEST_PERK_EFFECT: "Puede reclutar [GetMaA('crocodiles').GetName] como [men_at_arms|E].\n#flavor Siseando una bendición en la lengua de los Dragones, el Mokolé otorga un don de fertilidad.#!"
 mokole_axis_mundi_perk_name: "Axis Mundi"
 MOKOLE_AXIS_MUNDI_PERK_EFFECT: "#flavor El Mokolé extiende su espíritu para sentir la presencia de Gaia, centrándose en relación con su Madre.#!"
 dragonfear_perk_name: "Temor del Dragón"
 DRAGONFEAR_PERK_EFFECT: "#flavor El Mokolé muestra todo su aterrador poder: enseñando dientes o garras, rugiendo o simplemente acechando ominosamente sobre un enemigo.#!"
 mokole_walking_between_worlds_perk_name: "Caminar entre mundos"
 MOKOLE_WALKING_BETWEEN_WORLDS_PERK_EFFECT: "#flavor El Mokolé puede atravesar la Celosía y entrar en la Umbra. Aunque debe tener cuidado con los [innocents|E] mientras la atraviesa.#!"
 dragons_breath_perk_name: "Aliento de dragón"
 DRAGONS_BREATH_PERK_EFFECT: "Desbloquea un nuevo movimiento de [single_combat_duel|E].\n#flavor El Mokolé escupe fuego a sus enemigos.#!"
 cocoon_perk_name: "Capullo"
 COCOON_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$\n#flavor El Mokolé se envuelve en un sarcófago de quitina, grueso y opaco, inmovilizándose pero volviéndose casi invulnerable al daño.#!"
 serenity_perk_name: "Serenidad"
 SERENITY_PERK_EFFECT: "#flavor El Mokolé puede llenar un corazón ardiente con la paz de Gaia, incluso en mitad de la batalla.#!"
 grasp_the_beyond_perk_name: "Asir lo Trascendente"
 GRASP_THE_BEYOND_PERK_EFFECT: "Puede realizar el Cambio de Forma y mantener las formas transformadas mientras permanece en la [umbra|E].\n#flavor El Mokolé puede transportar objetos hacia dentro y fuera de la Umbra sin tener que dedicarlos a sí mismo.#!"
 song_of_the_great_beast_perk_name: "Canto de la Gran Bestia"
 SONG_OF_THE_GREAT_BEAST_PERK_EFFECT: "Inflige a los [rulers|E] enemigos un poderoso [modifier|E] negativo por cada rango de [GetTrait('mokole').GetName(GetNullCharacter)] al iniciar una [war|E] como atacante o defensor principal.\n#flavor El Mokolé viaja a la naturaleza salvaje y lanza un rugido largo y lúgubre. Una de las Grandes Bestias de la Antigüedad responde al llamado, apareciendo en el Señorío cercano al licántropo reptiliano.#!"



####Stream Gifts####
 streamgifts_lifestyle_name: "Dones de Corriente"
 streamgifts_lifestyle_desc: "Las cuatro Corrientes de los Mokolé están moldeadas por la naturaleza de sus tierras elegidas y los parientes reptiles que habitan en ellas."
 streamgifts_lifestyle_highlight_desc: "Debido a tu $POD_energy_gnosis$, ganas un #P [GetPlayer.MakeScope.ScriptValue('gnosis_lifestyle_xp_mult')|%0]#! más de [experience|E] en este estilo de vida."
 monthly_streamgifts_lifestyle_xp_gain_mult: "Experiencia mensual de Dones de Corriente [lifestyle|E] [experience|E]"
 streamgifts_mokole_mbembe_visible: "Dones de Mokolé-mbembe"
 streamgifts_gumagan_visible: "Dones de Gumagan"
 streamgifts_makara_visible: "Dones de Makara"
 streamgifts_zhong_lung_visible: "Dones de Zhong Lung"
 
 streamgifts_mokole_mbembe_focus: "Enfoque de Mokolé-mbembe"
 streamgifts_mokole_mbembe_focus_modifier: "[GetFocus('streamgifts_mokole_mbembe_focus').GetName]"
 streamgifts_mokole_mbembe_focus_desc: "Dones de la Corriente de los Luchadores."
 streamgifts_mokole_mbembe_focus_effect_desc: "Centrarse en los Dones de Mokolé-mbembe otorga:"

 streamgifts_gumagan_focus: "Enfoque de Gumagan"
 streamgifts_gumagan_focus_modifier: "[GetFocus('streamgifts_gumagan_focus').GetName]"
 streamgifts_gumagan_focus_desc: "Dones de la Corriente de los Precursores."
 streamgifts_gumagan_focus_effect_desc: "Centrarse en los Dones de Gumagan otorga:"

 streamgifts_makara_focus: "Enfoque de Makara"
 streamgifts_makara_focus_modifier: "[GetFocus('streamgifts_makara_focus').GetName]"
 streamgifts_makara_focus_desc: "Dones de la Corriente del Pueblo."
 streamgifts_makara_focus_effect_desc: "Centrarse en los Dones de Makara otorga:"

 streamgifts_zhong_lung_focus: "Enfoque de Zhong Lung"
 streamgifts_zhong_lung_focus_modifier: "[GetFocus('streamgifts_zhong_lung_focus').GetName]"
 streamgifts_zhong_lung_focus_desc: "Dones de la Corriente de los Filósofos."
 streamgifts_zhong_lung_focus_effect_desc: "Centrarse en los Dones de Zhong Lung otorga:"

 NEEDS_MOKOLE_MBEMBE_STREAM: "@warning_icon!#X Tu corriente debe ser Mokolé-mbembe#!"
 NEEDS_GUMAGAN_STREAM: "@warning_icon!#X Tu corriente debe ser Gumagan#!"
 NEEDS_MAKARA_STREAM: "@warning_icon!#X Tu corriente debe ser Makara#!"
 NEEDS_ZHONG_LUNG_STREAM: "@warning_icon!#X Tu corriente debe ser Zhong Lung#!"


 speed_of_thought_perk_name: "Velocidad del pensamiento"
 SPEED_OF_THOUGHT_PERK_EFFECT: "#flavor El Mokolé duplica su velocidad de carrera.#!"
 sense_dissolver_perk_name: "Sentir al [Glossary('Dissolver', 'glossary_wyrm_tt')]"
 SENSE_DISSOLVER_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n#flavor El Mokolé puede sentir manifestaciones cercanas del [Glossary('Dissolver', 'glossary_wyrm_tt')].#!"
 silver_claws_perk_name: "Garras de plata"
 SILVER_CLAWS_PERK_EFFECT: "[character_interaction|E]: Otorgarse a sí mismo [GetModifier('POD_mokole_silver_claws_modifier').GetNameWithTooltip] durante 3 años.\n#flavor Luna envía a sus hijos para enseñar este poderoso pero doloroso Don a aquellos guerreros que ganan su favor. Al invocarse, transforma las garras del Mokolé en plata.#!"
 bark_of_the_mudpuppy_perk_name: "Ladridos de la Salamandra"
 BARK_OF_THE_MUDPUPPY_PERK_EFFECT: "Desbloquea un nuevo movimiento de [single_combat_duel|E].\n#flavor Este Don permite al Mokolé ladrar con fuerza a cualquier persona u objeto, rompiendo cristales, astillando madera ligera o incluso abriendo heridas en un ser vivo.#!"
 beak_of_the_finch_perk_name: "Pico del Pinzón"
 BEAK_OF_THE_FINCH_PERK_EFFECT: "#flavor El Mokolé se adapta a nuevas situaciones para sobrevivir. Lo hace remodelándose en una forma que pueda cumplir su objetivo.#!"
 heat_wave_perk_name: "Ola de Calor"
 HEAT_WAVE_PERK_EFFECT: "#flavor El Mokolé puede invocar el calor del Señor Sol para quemar a sus enemigos.#!"
 walk_into_my_eyes_perk_name: "Caminar en mis ojos"
 WALK_INTO_MY_EYES_PERK_EFFECT: "[character_interaction|E]: Forzar una [truce|E] con el objetivo. Cuando la tregua expire, uno de sus [personality_traits|E] cambiará a su rasgo opuesto.\n#flavor Este poderoso Don obliga al objetivo a ver el mundo desde el punto de vista del Mokolé. Durante este tiempo, no podrá atacar al Mokolé. Tras recuperar el sentido, el objetivo suele quedar profundamente cambiado.#!"

 songlines_perk_name: "Líneas de Canción"
 SONGLINES_PERK_EFFECT: "#flavor Este Don cubre el paisaje con canciones. El Gumagan puede navegar de un extremo a otro de Bandaiyan utilizando las Leyendas.#!"
 dreamwalk_perk_name: "Caminar por el Sueño"
 DREAMWALK_PERK_EFFECT: "Puede manipular la Celosía.\n#flavor El Gumagan puede usar su conexión con el Tiempo del Sueño para debilitar la Celosía.#!"
 bunyips_boom_perk_name: "El Estruendo del Bunyip"
 BUNYIPS_BOOM_PERK_EFFECT: "Otorga [GetModifier('POD_mokole_bunyips_boom_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúe como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\n#flavor El Gumagan puede alcanzar la Mnesis e imitar el lúgubre grito del Bunyip.#!"
 landspeak_perk_name: "Habla de la Tierra"
 LANDSPEAK_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\nObtén una oportunidad para aprender pasivamente un [secret|E] de uno de tus [vassals|E] cada tres años.\n#flavor Al escuchar con atención, un Gumagan puede oír las canciones de la Tierra.#!"
 nightmare_mnesis_perk_name: "Mnesis de pesadilla"
 NIGHTMARE_MNESIS_PERK_EFFECT: "[character_interaction|E]: Forzar a un personaje a sufrir un [mental_break|E].\n#flavor El Gumagan puede vencer a cualquier enemigo con la Mnesis, obligándole a recordar las atrocidades que ha cometido.#!"
 bilabong_walk_perk_name: "Caminar por el Bilabong"
 BILABONG_WALK_PERK_EFFECT: "#flavor El Gumagan utiliza este Don para cruzar con éxito grandes extensiones de terreno utilizando el agua como atajo.#!"
 bloody_mindedness_perk_name: "Sangre Fría"
 BLOODY_MINDEDNESS_PERK_EFFECT: "Ganas [GetModifier('POD_mokole_bloody_mindedness_nemesis_modifier').GetNameWithTooltip] mientras tengas un [nemesis|E] o [GetModifier('POD_mokole_bloody_mindedness_rival_modifier').GetNameWithTooltip] mientras tengas un [rival|E].\n#flavor El Gumagan puede «fijarse» en un objetivo o enemigo elegido. Perseguirá este objetivo hasta la muerte y más allá.#!"

 sense_prey_perk_name: "Sentir a la Presa"
 SENSE_PREY_PERK_EFFECT: "Reduce el coste de la actividad de Caza [activity|E] en un #P -10%#!\n#flavor Este Don permite a un weresaurian localizar suficiente presa para alimentar a su nidada.#!"
 SENSE_PREY_REASON: "$sense_prey_perk_name$: $VALUE|+=0$"
 scent_of_sweet_nectar_perk_name: "Aroma de dulce néctar"
 SCENT_OF_SWEET_NECTAR_PERK_EFFECT: "[character_interaction|E]: Otorgar a un personaje [GetModifier('POD_mokole_scent_of_sweet_nectar_modifier').GetNameWithTooltip].\nPuede reclutar [GetMaA('insects').GetName] como [men_at_arms|E].\n#flavor La víctima del Mokolé comienza a exudar un aroma maravillosamente dulce. Todo tipo de vermes aparecen rápidamente y cubren a la víctima. El manto resultante de mosquitos, moscas, abejas y escarabajos se arrastra, pica y, en general, nubla la visión y el oído.#!"
 shed_perk_name: "Muda"
 SHED_PERK_EFFECT: "Aumenta la probabilidad de éxito de la decisión Escapar de la Prisión [decision|E].\n#flavor El Mokolé puede mudar una capa de piel y/o plumas, deslizándose del agarre de un oponente o escapando de sus ataduras con facilidad.#!"
 waxwork_monster_perk_name: "Monstruo de Cera"
 WAXWORK_MONSTER_PERK_EFFECT: "$countermeasures_unlocks_t3_supernatural_high_alert$\n#flavor Este Don permite a un Mokolé aprovechar el hecho de que «los dinosaurios están extintos» para esconderse a plena vista.#!"
 view_the_seed_perk_name: "Ver la semilla"
 VIEW_THE_SEED_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n[character_interaction|E]: Descubre un [scheme|E] o un [secret|E] aleatorio de un personaje.\n#flavor Este Don proviene de la creencia de que todas las cosas no son más que un sueño de la idea u objeto que las engendró. Permite al usuario ver la «semilla» de cualquier cosa, desde los padres de un hijo hasta el cerebro de una conspiración.#!"
 the_thousand_arrows_perk_name: "Las Mil Flechas"
 THE_THOUSAND_ARROWS_PERK_EFFECT: "#flavor Este Don permite a un tirador Makara multiplicar enormemente sus proyectiles en pleno vuelo.#!"
 great_as_a_white_hill_perk_name: "Grande como una Colina Blanca"
 GREAT_AS_A_WHITE_HILL_PERK_EFFECT: "#flavor El Makara crece hasta alcanzar tres veces su tamaño normal o se encoge hasta el tamaño de un pequeño cocodrilo mugidor.#!"


 dragon_milk_perk_name: "Leche de dragón"
 DRAGON_MILK_PERK_EFFECT: "[character_interaction|E]: Curar 1 [POD_aggravated_damage_with_box|E] a otro personaje.\n#flavor El Zhong Lung canaliza poder espiritual a través de su sangre, sanando las heridas de cualquier otra criatura viviente.#!"
 chiih_ming_perk_name: "Chi'ih Ming"
 CHIIH_MING_PERK_EFFECT: "#flavor Este Don permite al Zhong Lung caminar por el aire.#!"
 clap_of_thunder_perk_name: "Estruendo de Trueno"
 CLAP_OF_THUNDER_PERK_EFFECT: "Desbloquea un nuevo movimiento de [single_combat_duel|E].\n#flavor El Zhong Lung choca sus manos, creando un poderoso estruendo que aturde a quienes lo oyen.#!"
 the_dragons_tongue_perk_name: "La lengua del dragón"
 THE_DRAGONS_TONGUE_PERK_EFFECT: "[character_interaction|E]: Infligir hasta 2 [POD_aggravated_damage_with_box|E] a un personaje.\n#flavor El Zhong Lung convoca el rayo sobre su enemigo.#!"
 anger_of_the_wani_perk_name: "Ira del Wani"
 ANGER_OF_THE_WANI_PERK_EFFECT: "Desbloquea opciones de Magia Climática: #V Tormenta#! y #V Ventisca#!\n#flavor El Zhong Lung puede convocar casi cualquier efecto climático que desee: la niebla, los tornados, las ventiscas y las tormentas eléctricas aguardan su llamado.#!"
 sleep_of_hsi_wang_mu_perk_name: "Sueño de Hsi Wang Mu"
 SLEEP_OF_HSI_WANG_MU_PERK_EFFECT: "#flavor Este Don permite al Zhong Lung hibernar, concentrando su fuerza vital para prolongar su vida.#!"
 a_thousand_secret_faces_perk_name: "Mil rostros secretos"
 A_THOUSAND_SECRET_FACES_PERK_EFFECT: "[character_interaction|E]: Permite editar tus propios [personality_traits|E] o copiar la apariencia de otro personaje.\n#flavor Este Don permite al Zhong Lung asumir el parecido perfecto de cualquier humano, de cualquier edad, etnia o posición.#!"



####Solar Auspice Gifts####
 solar_auspicegifts_lifestyle_name: "Dones Solares"
 solar_auspicegifts_lifestyle_desc: "Céntrate en los Dones que provienen del Auspicio Solar."
 solar_auspicegifts_lifestyle_highlight_desc: "Debido a tu $POD_energy_gnosis$, ganas un #P [GetPlayer.MakeScope.ScriptValue('gnosis_lifestyle_xp_mult')|%0]#! más de [experience|E] en este estilo de vida."
 monthly_solar_auspicegifts_lifestyle_xp_gain_mult: "Experiencia mensual de Dones de Auspicio Solar [lifestyle|E] [experience|E]"
 solar_auspicegifts_rising_sun_visible: "Sol Naciente"
 solar_auspicegifts_noonday_sun_visible: "Sol de Mediodía"
 solar_auspicegifts_setting_sun_visible: "Ocaso"
 solar_auspicegifts_midnight_sun_visible: "Medianoche"
 solar_auspicegifts_shrouded_sun_visible: "Nublado"
 solar_auspicegifts_decorated_sun_visible: "Decorado"
 solar_auspicegifts_eclipsed_sun_visible: "Eclipsado"


 solar_auspicegifts_focus: "Enfoque de Dones de Auspicio Solar"
 solar_auspicegifts_focus_modifier: "[GetFocus('solar_auspicegifts_focus').GetName]"
 solar_auspicegifts_focus_desc: "El Gran Sol"
 solar_auspicegifts_focus_effect_desc: "Centrarse en los Dones de Auspicio Solar otorga:"


 RISING_SUN_PERK_REQ: "@warning_icon!#warning Requiere uno de los siguientes rasgos:\n$BULLET_WITH_TAB$[GetTrait('rising_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('vasanta').GetName(GetPlayer)]#!"
 NOONDAY_SUN_PERK_REQ: "@warning_icon!#warning Requiere uno de los siguientes rasgos:\n$BULLET_WITH_TAB$[GetTrait('noonday_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('nam_hsia').GetName(GetPlayer)]#!"
 SETTING_SUN_PERK_REQ: "@warning_icon!#warning Requiere uno de los siguientes rasgos:\n$BULLET_WITH_TAB$[GetTrait('setting_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('tung_chun').GetName(GetPlayer)]#!"
 MIDNIGHT_SUN_PERK_REQ: "@warning_icon!#warning Requiere uno de los siguientes rasgos:\n$BULLET_WITH_TAB$[GetTrait('midnight_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('hemanta').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('pei_tung').GetName(GetPlayer)]#!"
 SHROUDED_SUN_PERK_REQ: "@warning_icon!#warning Requiere uno de los siguientes rasgos:\n$BULLET_WITH_TAB$[GetTrait('shrouded_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('zarad').GetName(GetPlayer)]#!"
 DECORATED_SUN_PERK_REQ: "@warning_icon!#warning Requiere uno de los siguientes rasgos:\n$BULLET_WITH_TAB$[GetTrait('decorated_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('grisma').GetName(GetPlayer)]#!"
 ECLIPSED_SUN_PERK_REQ: "@warning_icon!#warning Requiere uno de los siguientes rasgos:\n$BULLET_WITH_TAB$[GetTrait('eclipsed_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('sai_chau').GetName(GetPlayer)]#!"



 bellow_perk_name: "Rugido"
 BELLOW_PERK_EFFECT: "El Mokolé libera un rugido reptiliano poderoso y aterrador."
 master_of_fire_perk_name: "Maestro del Fuego"
 MASTER_OF_FIRE_PERK_EFFECT: "Ganas inmunidad al daño de fuego.\n#flavor Un Mokolé recuerda el antiguo pacto hecho con los espíritus del fuego. Protegiéndose a sí mismo mientras los últimos fuegos del Apocalipsis se ciernen sobre él.#!"
 eye_of_the_raptor_perk_name: "Ojo del Raptor"
 EYE_OF_THE_RAPTOR_PERK_EFFECT: "#flavor El Mokolé puede ver con claridad a kilómetros de distancia.#!"
 paint_the_meadows_perk_name: "Pintar las praderas"
 PAINT_THE_MEADOWS_PERK_EFFECT: "#flavor El Mokolé puede emitir gemidos y lamentos lastimeros para atraer a la presa.#!"
 call_the_tides_perk_name: "Llamar a las mareas"
 CALL_THE_TIDES_PERK_EFFECT: "Desbloquea la opción de Magia Climática: #V Inundación#!\nReduce el coste e incrementa la duración de la #V Inundación#! si tienes [GetPerk('flood_the_land_perk').GetName(GetPlayer)]\n#flavor Este Don hace que el Mokolé sea capaz de doblegar las mareas a su voluntad.#!"
 might_of_kings_perk_name: "Poder de los reyes"
 MIGHT_OF_KINGS_PERK_EFFECT: "Ganas una mayor probabilidad de herir a [knights|E] enemigos durante una [combat_phase|E] como [knight|E].\n#flavor El Mokolé puede aumentar su fuerza tremendamente para así aniquilar mejor a sus enemigos.#!"
 lash_of_ages_perk_name: "Látigo de las eras"
 LASH_OF_AGES_PERK_EFFECT: "#flavor El Sol Naciente puede destruir cualquier sustancia creada por el hombre.#!"
 scream_of_gaia_perk_name: "Grito de Gaia"
 SCREAM_OF_GAIA_PERK_EFFECT: "[character_interaction|E]: Inflige 1 [POD_superficial_damage_with_box|E] a todos los [knights|E] de tu objetivo.\n#flavor El Mokolé emite un grito horrible y rasgado, imbuido de la Furia y el dolor de Gaia.#!"
 jointsnakes_mojo_perk_name: "Mojo de la serpiente de articulación"
 JOINTSNAKES_MOJO_PERK_EFFECT: "#flavor El Mokolé puede volver a unir partes del cuerpo cercenadas sin siquiera tocarlas.#!"
 wall_of_granite_perk_name: "Muro de Granito"
 WALL_OF_GRANITE_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('shards_of_granite_modifier').GetNameWithTooltip]\n#flavor Mientras esté en contacto con la tierra o la roca, el Sol Naciente puede invocar un muro para protegerse.#!"


 truth_of_olodumare_perk_name: "Verdad de Olodumare"
 TRUTH_OF_OLODUMARE_PERK_EFFECT: "Velocidad de progreso de [espionage|E]: #P +25%#!\n#flavor Como jueces de los Deberes, los Soles de Mediodía pueden separar fácilmente la verdad de la falsedad.#!"
 TRUTH_OF_OLODUMARE_REASON: "$truth_of_olodumare_perk_name$: $VALUE|+=0$"
 fangs_of_judgement_perk_name: "Colmillos del juicio"
 FANGS_OF_JUDGEMENT_PERK_EFFECT: "Probabilidad de [imprison|E] con un [imprisonment_reason|E]: #P +20%#!\nAceptación de [revoke|E] Título: #P +10#!\n#flavor Corresponde al Sol de Mediodía imponer no solo el juicio, sino también el castigo contra aquellos que han caído de su posición adecuada.#!"
 strength_of_purpose_perk_name: "Fuerza de propósito"
 STRENGTH_OF_PURPOSE_PERK_EFFECT: "#flavor Los Soles de Mediodía usan este Don para fortalecerse ante el Apocalipsis, convirtiendo la pasión ardiente y la Furia abrasadora en una resolución fría y férrea.#!"
 tame_sunbeam_perk_name: "Rayo de sol domesticado"
 TAME_SUNBEAM_PERK_EFFECT: "[character_interaction|E]: Inflige 2 [POD_aggravated_damage_with_box|E] a otro personaje que sea vulnerable al sol y le impide curarse durante 5 años.\n#flavor El sol ha sido durante mucho tiempo el aliado más incondicional de los Mokolé, y envía su luz cuando más la necesitan.#!"
 clear_mind_perk_name: "Mente despejada"
 CLEAR_MIND_PERK_EFFECT: "#flavor Este Don fomenta la claridad de pensamiento, sin importar las distracciones.#!"
 weak_arm_perk_name: "Brazo débil"
 WEAK_ARM_PERK_EFFECT: "#flavor Al observar el estilo de lucha de un oponente, el Sol de Mediodía puede evaluar rápidamente sus fortalezas y debilidades.#!"
 eye_of_the_cobra_perk_name: "Ojo de la cobra"
 EYE_OF_THE_COBRA_PERK_EFFECT: "Otorga [GetModifier('POD_mokole_eye_of_the_cobra_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúe como [commander|E] durante la [combat_phase|E], o a tu enemigo durante [single_combat_duel_plural|E].\n#flavor Con una mirada sobrenatural, el licántropo puede atraer a cualquiera a su distancia de ataque.#!"
 raptors_gaze_perk_name: "Mirada de raptor"
 RAPTORS_GAZE_PERK_EFFECT: "#flavor Uno de los ojos del Mokolé brilla con un rojo lívido, y todos los enemigos atrapados por su mirada quedan azotados por una agonía terrible.#!"
 wisdom_of_the_sun_perk_name: "Sabiduría del sol"
 WISDOM_OF_THE_SUN_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('suns_wisdom_modifier').GetNameWithTooltip].\n#flavor Al meditar bajo el rostro del Señor Sol, el Sol de Mediodía se convierte en un canal para la sabiduría de Teluria y puede hallar la respuesta a casi cualquier pregunta.#!"
 sleep_of_the_dragon_perk_name: "Sueño del Dragón"
 SLEEP_OF_THE_DRAGON_PERK_EFFECT: "#flavor El Mokolé entra en un estado de estivación. No envejece mientras duerme, aunque puede soñar.#!"


 resist_pain_perk_name: "Resistir el dolor"
 RESIST_PAIN_PERK_EFFECT: "#flavor Fortaleciéndose con propósito y voluntad, el Mokolé ignora el dolor de sus heridas.#!"
 rage_of_the_nest_mother_perk_name: "Furia de la madre de la nidada"
 RAGE_OF_THE_NEST_MOTHER_PERK_EFFECT: "Ganas una acumulación de [GetModifier('POD_mokole_rage_of_the_nest_mother_modifier').GetNameWithTooltip] por cada uno de tus hijos no adultos.\n#flavor Cuando se enfrenta a una amenaza contra un miembro indefenso de la familia o la nidada del Mokolé, el Sol Poniente puede elevarse sobre sus límites normales para defenderlos.#!"
 combat_healing_perk_name: "Curación en combate"
 COMBAT_HEALING_PERK_EFFECT: "#flavor Este Don permite al licántropo remendar sus heridas sin descanso ni vacilación, incluso en mitad de la batalla.#!"
 warding_dance_perk_name: "Danza vigilante"
 WARDING_DANCE_PERK_EFFECT: "#flavor Al proyectar el fuego de su corazón hacia sus extremidades, el Sol Poniente se lanza ileso a través de las filas de los enemigos de Gaia.#!"
 clenched_jaw_perk_name: "Mandíbula apretada"
 CLENCHED_JAW_PERK_EFFECT: "Más probabilidades de [imprison|E] a los [characters|E] tras un [siege|E] o una [raid|E] exitosos.\n#flavor El licántropo muerde con tal fuerza que su agarre no se aflojará hasta que decida soltar; incluso en la muerte, sus mandíbulas permanecen trabadas.#!"
 armor_of_the_tortoise_perk_name: "Armadura de tortuga"
 ARMOR_OF_THE_TORTOISE_PERK_EFFECT: "#flavor El Mokolé puede formar un caparazón duro alrededor de su piel, protegiéndose del daño.#!"
 clarity_perk_name: "Claridad"
 CLARITY_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n#flavor Este Don otorga la capacidad de ver a través de la niebla, la oscuridad total, la invisibilidad y de reconocer ilusiones.#!"
 hand_of_the_earth_lords_perk_name: "Mano de los señores de la tierra"
 HAND_OF_THE_EARTH_LORDS_PERK_EFFECT: "Puede reclutar [GetMaA('earth_elemental').GetName] como [men_at_arms|E].\n#flavor Al recurrir a las energías de la tierra, el Sol Poniente puede mover cualquier objeto con un simple gesto.#!"
 halo_of_the_sun_perk_name: "Halo del sol"
 HALO_OF_THE_SUN_PERK_EFFECT: "$unlock_forging_node$ [GetModifier('cleansing_sun_modifier').GetNameWithTooltip].\n#flavor El personaje pronuncia una palabra antigua sagrada para Helios y queda inmediatamente rodeado por una esfera de luz solar abrasadora.#!"
 fossilize_perk_name: "Fosilizar"
 FOSSILIZE_PERK_EFFECT: "[character_interaction|E]: Envía a un personaje al [GetTrait('torpor').GetName(GetNullCharacter)].\n#flavor El Mokolé condena a un enemigo al recuerdo, fosilizándolo para la edificación de las generaciones venideras.#!"


 brothers_scent_perk_name: "Aroma de hermano"
 BROTHERS_SCENT_PERK_EFFECT: "#flavor Al recurrir a la hermandad universal de todas las criaturas de Gaia, el Mokolé parece encajar dondequiera que vaya.#!"
 spirits_of_laughter_perk_name: "Espíritus de la risa"
 SPIRITS_OF_LAUGHTER_PERK_EFFECT: "[faction_military_power|E] Límite para [vassals|E]: #P +10%#!\n#flavor El Sol de Medianoche invoca espíritus de buen humor, aligerando el ánimo de todos.#!"
 FACTION_POWER_SPIRITS_OF_LAUGHTER: "$spirits_of_laughter_perk_name$: $VALUE|+=0$"
 glib_tongue_perk_name: "Lengua sagaz"
 GLIB_TONGUE_PERK_EFFECT: "#flavor Los oyentes oyen lo que el Mokolé desea. El Sol de Medianoche puede decir cualquier cosa, incluso disparates absolutos, pero cualquiera que escuche estará de acuerdo con entusiasmo.#!"
 GLIB_TONGUE_ACCEPTANCE: "$glib_tongue_perk_name$: $VALUE|+=0$"
 dreamspeak_perk_name: "Habla onírica"
 DREAMSPEAK_PERK_EFFECT: "[espionage|E] Velocidad de progreso: #P +25%#!\n#flavor El Sol de Medianoche puede caminar entre los sueños de otros y, por lo tanto, afectar su curso.#!"
 DREAMSPEAK_REASON: "$dreamspeak_perk_name$: $VALUE|+=0$"
 invisibility_perk_name: "Invisibilidad"
 INVISIBILITY_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier('POD_shapeshift_form_invisible_modifier').GetNameWithTooltip].\n#flavor Los Mokolé pueden desvanecerse de la vista, aunque deben concentrarse para mantener su invisibilidad.#!"
 shadows_by_the_firelight_perk_name: "Sombras a la luz del fuego"
 SHADOWS_BY_THE_FIRELIGHT_PERK_EFFECT: "[character_interaction|E]: Reduce tu propio [stress|E].\n#flavor El Sol de Medianoche invoca sombras y sueños para preparar el escenario de una obra en la que otros Mokolé participan.#!"
 open_sun_bridge_perk_name: "Abrir puente solar"
 OPEN_SUN_BRIDGE_PERK_EFFECT: "[character_interaction|E]: Teletranspórtate a un Cenagal o Túmulo como [army_commander] o mientras estás [traveling|E].\n#flavor El licántropo tiene la capacidad de abrir un puente solar, con o sin el permiso del tótem de ese cenagal.#!"
 take_the_true_form_perk_name: "Adoptar la forma verdadera"
 TAKE_THE_TRUE_FORM_PERK_EFFECT: "[character_interaction|E]: Elimina los cambios de forma de un personaje y haz que sea incapaz de realizar un Cambio de Forma durante 10 años.\n#flavor El Sol de Medianoche puede forzar a un ser a su forma verdadera.#!"
 fools_luck_perk_name: "Suerte del tonto"
 FOOLS_LUCK_PERK_EFFECT: "Este Don otorga inmunidad temporal a la mala suerte."
 thousand_forms_perk_name: "Mil Formas"
 THOUSAND_FORMS_PERK_EFFECT: "Desbloquea varias formas de Cambio de Forma animal.\n$unlock_forging_node$ [GetModifier('beast_rampage_modifier').GetNameWithTooltip].\n#flavor El licántropo con este Don puede transformarse en cualquier animal de un tamaño comprendido entre un pájaro pequeño y un bisonte.#!"



 sense_magic_perk_name: "Sentir la Magia"
 SENSE_MAGIC_PERK_EFFECT: "Ya no puedes ser poseído por $POD_splat_wraith_plural$.\n#flavor El licántropo puede sentir el pulso y el flujo de las energías místicas, sin importar su origen.#!"
 mokole_spirit_speech_perk_name: "Habla de los espíritus"
 MOKOLE_SPIRIT_SPEECH_PERK_EFFECT: "#flavor Este Don otorga la comprensión del lenguaje del Mundo Espiritual, permitiendo al Mokolé entender y hablar claramente con cualquier espíritu que encuentre.#!"
 command_spirit_perk_name: "Comandar Espíritu"
 COMMAND_SPIRIT_PERK_EFFECT: "Puede reclutar a [GetMaA('jagglings').GetName] como [men_at_arms|E].\n#flavor El Sol Velado puede dar órdenes a los espíritus que encuentra y esperar obediencia.#!"
 COMMAND_SPIRIT_REASON: "$command_spirit_perk_name$: $VALUE|+=0$"
 umbral_shadow_wings_perk_name: "Alas de Sombra Umbrales"
 UMBRAL_SHADOW_WINGS_PERK_EFFECT: "#flavor Este Don permite a un Mokolé volar a través de la «nada» de la Umbra, ignorando los diversos caminos y rastros en favor de una ruta más directa de Señorío en Señorío.#!"
 breaking_the_tomorrow_wall_perk_name: "Romper el Muro del Mañana"
 BREAKING_THE_TOMORROW_WALL_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\nRecibirás una notificación si alguien tiene la intención de asesinar a tus amigos o familiares.\n#flavor El Mokolé nada río arriba a través del río de Mnesis, captando vagas visiones del futuro.#!"
 call_water_spirit_perk_name: "Llamar al Espíritu del Agua"
 CALL_WATER_SPIRIT_PERK_EFFECT: "Puede reclutar a [GetMaA('water_elemental').GetName] como [men_at_arms|E].\n#flavor El Mokolé es capaz de llamar a un elemental de agua para que le ayude.#!"
 walk_the_matres_mind_perk_name: "Caminar por la mente de la Matre"
 WALK_THE_MATRES_MIND_PERK_EFFECT: "Puede entrar físicamente en la [umbra|E].\n#flavor Este Don permite al Mokolé entrar físicamente en la Umbra sin dejar un cuerpo indefenso atrás y sin necesidad de un hilo de plata.#!"
 gorgons_gaze_perk_name: "Mirada de la gorgona"
 GORGONS_GAZE_PERK_EFFECT: "[character_interaction|E]: Reduce la [prowess|E] de un personaje y dale el rasgo [GetTrait('scaly').GetName(GetNullCharacter)] [trait|E].\n#flavor Los ojos del Mokolé arden en rojo, oro y verde mientras este espantoso poder de leyenda transforma la carne viva en piedra con tan solo una mirada.#!"
 mokole_living_treasure_perk_name: "Tesoro Viviente"
 MOKOLE_LIVING_TREASURE_PERK_EFFECT: "[buy_claim_interaction|E] y [buy_artifact_claim_interaction|E] Coste: #P -25%#!\n$unlock_forging_node$ [GetModifier('inscribed_legacy_modifier').GetNameWithTooltip].\n#flavor Un Sol Velado puede convencer al espíritu de un tesoro para que relate su historia y leyenda.#!"
 malleable_spirit_perk_name: "Espíritu Maleable"
 MALLEABLE_SPIRIT_PERK_EFFECT: "#flavor El Mokolé puede cambiar la forma o el propósito de un espíritu.#!"



 mercy_perk_name: "Misericordia"
 MERCY_PERK_EFFECT: "#flavor Los Soles Decorados no ven utilidad en la fuerza letal cuando no luchan contra los siervos del [Glossary('Dissolver', 'glossary_wyrm_tt')].#!"
 mokole_pack_tactics_perk_name: "Tácticas de manada"
 MOKOLE_PACK_TACTICS_PERK_EFFECT: "#flavor Al tomar el liderazgo y coordinar a los demás Mokolé, el Sol Decorado dota a todos sus compañeros de nidada con una gran competencia en el fragor de la batalla.#!"
 mothers_touch_perk_name: "Toque de la Madre"
 MOTHERS_TOUCH_PERK_EFFECT: "[character_interaction|E]: Cura 1 [POD_superficial_damage_with_box|E] en otro personaje.\n#flavor El Sol Decorado canaliza poder espiritual a través de sus manos, sanando las heridas de cualquier criatura viviente.#!"
 pilot_snake_perk_name: "Serpiente Piloto"
 PILOT_SNAKE_PERK_EFFECT: "Puede reclutar a [GetMaA('snakes').GetName] como [men_at_arms|E].\n#flavor Este don permite al Mokolé convocar a la útil serpiente piloto, una criatura que sabe cómo llegar a cualquier parte.#!"
 wind_beneath_my_wings_perk_name: "Viento bajo mis alas"
 WIND_BENEATH_MY_WINGS_PERK_EFFECT: "#flavor Este Don ayuda al Mokolé a viajar con mayor facilidad marchando o volando en formación.#!"
 call_to_duty_perk_name: "Llamada al Deber"
 CALL_TO_DUTY_EFFECT: "#flavor Los nombres poseen poder en el Mundo Espiritual, y el Sol Decorado puede explotar esto para convocar y comandar a cualquier espíritu que conozca por su nombre.#!"
 dragon_drill_perk_name: "Entrenamiento de Dragón"
 DRAGON_DRILL_PERK_EFFECT: "Otorga [GetModifier('POD_mokole_dragon_drill_modifier').GetNameWithTooltip] a los [knights|E] aliados cuando actúe como [commander|E] durante la [combat_phase|E], o a ti mismo durante un [single_combat_duel_plural|E].\n#flavor El Mokolé puede organizar a sus aliados en una fuerza de trabajo potente, compartiendo las habilidades aprendidas con todos los miembros.#!"
 reshape_object_perk_name: "Remodelar Objeto"
 RESHAPE_OBJECT_PERK_EFFECT: "Gana [gold|E] al desmantelar [artifacts|E]\n#flavor El Mokolé puede dar forma instantáneamente a material que alguna vez estuvo vivo para convertirlo en algo distinto.#!"
 chaos_mechanics_perk_name: "Mecánica del Caos"
 CHAOS_MECHANICS_PERK_EFFECT: "$unlock_forging_node$ Añade uno de cuatro modificadores aleatorios.\n#flavor Este Don permite al weresauriano convocar la energía primordial y una forma mística al mismo tiempo.#!"
 strength_of_the_dominator_perk_name: "Fuerza del dominador"
 STRENGTH_OF_THE_DOMINATOR_PERK_EFFECT: "[character_interaction|E]: Reduce el recurso de [splat|E] de un personaje y gana [prowess|E] igual a un tercio de su [prowess|E].\n#flavor El weresauriano aprovecha la ira del objetivo para alimentar la suya propia.#!"




 mokole_aura_of_confidence_perk_name: "Aura de confianza"
 MOKOLE_AURA_OF_CONFIDENCE_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$\n#flavor El Mokolé proyecta un aura de superioridad, impidiendo intentos de encontrar fallos o leer auras.#!"
 lambent_flame_perk_name: "Llama latente"
 LAMBENT_FLAME_PERK_EFFECT: "#flavor El weresauriano hace que su cuerpo se encienda con una luz plateada.#!"
 mokole_awe_perk_name: "Asombro"
 MOKOLE_AWE_PERK_EFFECT: "#flavor El Mokolé se convierte en un inconfundible avatar de gloria y majestad primordial, coronado por el sol y envuelto en los años.#!"
 dazzle_perk_name: "Deslumbrar"
 DAZZLE_PERK_EFFECT: "#flavor El Mokolé puede inundar la mente de un objetivo con la gloria y el amor de Gaia.#!"
 dragon_kings_majesty_perk_name: "La majestad del Rey Dragón"
 DRAGON_KINGS_MAJESTY_PERK_EFFECT: "#flavor El Sol Eclipsado parece crecer y volverse más imponente, convirtiéndose en una terrible versión sombría de sí misma.#!"
 wrath_of_the_dragon_perk_name: "Ira del Dragón"
 WRATH_OF_THE_DRAGON_PERK_EFFECT: "Inflige 40 de [stress|E] a los [knights|E] y [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante un [single_combat_duel_plural|E] si sirve al $glossary_wyrm$.\n#flavor El Mokolé se muestra en toda su terrible gloria como el guerrero elegido de Gaia. Su esplendor abruma a los secuaces del [Glossary('Dissolver', 'glossary_wyrm_tt')].#!"
 mokole_mastery_perk_name: "Maestría"
 MOKOLE_MASTERY_PERK_EFFECT: "[character_interaction|E]: Gana un [strong_hook|E] sobre otro [GetTrait('mokole').GetName(GetNullCharacter)].\n#flavor El Sol Eclipsado puede comandar a otros Mokolé, incluso a aquellos que han caído ante el [Glossary('Dissolver', 'glossary_wyrm_tt')], para que cumplan sus órdenes.#!"
 army_of_the_ancestors_perk_name: "Ejército de los ancestros"
 ARMY_OF_THE_ANCESTORS_PERK_EFFECT: "Se invocan tres poderosos [ancestor_spirits|E] para ayudarte como [knights|E] durante la guerra.\n#flavor El Mokolé puede llamar a los ancestros que le dieron la forma que viste, trayéndolos desde las brumas de la Memoria para desafiar a sus oponentes.#!"
 sun_enfleshed_perk_name: "Sol encarnado"
 SUN_ENFLESHED_PERK_EFFECT: "Inflige 1 de [POD_aggravated_damage_with_box|E] a los [knights|E] y [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante un [single_combat_duel_plural|E] si es vulnerable al sol.\n$unlock_forging_node$ [GetModifier('sun_scales_modifier').GetNameWithTooltip].\n#flavor El Mokolé se convierte en una encarnación viviente del fuego sagrado del sol. Estalla en silenciosas llamas solares, quemando a sus oponentes con un solo toque.#!"
 dream_semblence_perk_name: "Semblante de sueño"
 DREAM_SEMBLENCE_PERK_EFFECT: "[character_interaction|E]: Gana [GetModifier('POD_mokole_dream_semblence_modifier').GetNameWithTooltip] durante un año y maximiza tu [dread|E].\n#flavor Este raro Don permite al Mokolé soñar con convertirse en la forma de un Dragón Verdadero. Una vez terminada la confrontación, el sueño se marchará.#!"







####Mnesis####
 mnesis_lifestyle_name: "Mnesis"
 mnesis_lifestyle_desc: "Recuerda las habilidades y artes de los antiguos Mokolé."
 monthly_mnesis_lifestyle_xp_gain_mult: "[experience|E] mensual de [lifestyle|E] de Mnesis"
 mnesis_lifestyle_tree_visible: "Mnesis"

 MNESIS_PERK_COST_EFFECT: "#clickable Esta ventaja cuesta $VALUE|V0$ [Select_CString( EqualTo_CFixedPoint( '(CFixedPoint)$VALUE|q$', '(CFixedPoint)1' ), 'punto', 'puntos' )] de ventaja#!"
 MNESIS_PREVIOUS_AGE_REQ: "@warning_icon!#warning ¡Debes obtener todas las [perks|E] en la Era anterior!#!"
 DEEPER_MNESIS_EFFECT: "Tus [skills|E] se verán aún más #N reducidas#! mientras viajas más profundo en la Mnesis."

