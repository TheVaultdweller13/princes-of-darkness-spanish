 thorn_lifestyle_name: "Espina"
 thorn_lifestyle_desc: "Centrarse en las herramientas que la Sombra utiliza para ganar el control sobre la Psique o provocar que esta cometa un error y acelere su espiral descendente hacia el [UmbraGlossary('oblivion')]."
