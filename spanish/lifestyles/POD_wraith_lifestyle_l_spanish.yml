 MASTERS_VOICE_PERK_EFFECT: "Desbloquea un nivel superior de la interacción de personaje [character_interaction|E] [GetPerk('twitch_perk').GetName(GetPlayer)].\n#F Un Titiritero puede hablar temporalmente en nombre de un huésped mortal.#!"
 REIN_IN_THE_MIND_PERK_EFFECT: "Desbloquea el nivel más alto de la interacción de personaje [character_interaction|E] [GetPerk('twitch_perk').GetName(GetPlayer)].\n#F Un Titiritero puede tomar casi el control total sobre un huésped.#!"
