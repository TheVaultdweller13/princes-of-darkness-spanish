 STONEHAND_PUNCH_PERK_EFFECT: "#F Una aparición puede aplastar a un objetivo con pura fuerza emocional.#!"
 WINGS_OF_RAGE_PERK_EFFECT: "#F Una aparición puede potenciar su atletismo y velocidad.#!"
 DEATHS_TOUCH_PERK_EFFECT: "#F Una aparición puede manipular libremente objetos en las [Glossary('Tierras de Piel','game_concept_skinlands_desc')] y proyectar sus manos telequinéticamente en el [underworld|E].#!"
