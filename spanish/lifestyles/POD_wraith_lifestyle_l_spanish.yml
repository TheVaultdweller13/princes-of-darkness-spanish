 game_concept_true_jade: "Jade Verdadero"
 game_concept_true_jade_desc: "Se cree que el Jade Verdadero es una porción del alma del Universo en forma sólida. Cuando el Jade Verdadero llega a las Aguas Amarillas, solo los Artesanos saben cómo crear objetos nuevos y poderosos con él."

 game_concept_dark_arcanoi: "Arcanos Oscuros"
 game_concept_dark_arcanoi_lifestyle: "Arcanos Oscuros"
 game_concept_dark_arcanoi_lifestyle_desc: "El $game_concept_dark_arcanoi_lifestyle$ es adecuado para los $POD_splat_wraith_plural$. Un Arcano Oscuro es un Arcano especializado alimentado por la Angustia y el [UmbraGlossary('oblivion')]. Estas habilidades son utilizadas principalmente por los Espectros para servir al [UmbraGlossary('oblivion')] y atormentar tanto a los wraiths como a los Quick."

 game_concept_misc_arcanoi: "Arcanos misceláneos"
 game_concept_misc_arcanoi_lifestyle: "Arcanos misceláneos"
