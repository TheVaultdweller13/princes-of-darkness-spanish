 DREAM_SEQUENCE_PERK_EFFECT: "#F Un Soñador puede nublar la mente de un mortal que haya visto a través de la Niebla, convenciéndole de que fue un sueño. Los Soñadores poderosos pueden usar este poder para convencer a un ser sobrenatural de que no vio algo que sí vio.#!"
 MORPHEAN_EMBRACE_PERK_EFFECT: "Como [character_interaction|E], te permite someter lentamente al objetivo, lo que eventualmente conducirá al [GetTrait('torpor').GetName( GetPlayer )].\n#F Un Soñador puede otorgar sueño y sueños a un wraith.#!"
 INCUBUS_PERK_EFFECT: "Desbloquea la interacción de personaje [character_interaction|E] Drenar energía, permitiendo usar el recurso del objetivo para ganar pathos.\n#F Un Soñador puede drenar la energía de un mortal como Pathos.#!"
 AGON_PERK_EFFECT: "$POD_can_covert_to_wraith_trigger_loca$\n#F Un Soñador puede arrancar el alma de un mortal de su cuerpo.#!"
 ONEIRATAXIA_PERK_EFFECT: "Como [character_interaction|E], te permite hacer que el objetivo entre en [GetTrait('torpor').GetName( GetPlayer )].\n#F Permite a un Soñador impedir que un mortal duerma, evitar que un wraith entre en Letargo, detener a un durmiente de despertar o evitar que un mortal sueñe.#!"
 
