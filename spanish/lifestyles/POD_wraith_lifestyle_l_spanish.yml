 LIFELINE_PERK_EFFECT: "Permite usar la interacción $POD_manipulate_fetters_interaction$ [character_interaction|E] en [GetTrait('wraith').GetName( GetNullCharacter )] con más de 75 de opinión.\n#F Un Monitor puede crear un «pseudo-[Fetter|E]» entre dos wraiths que les permite trabajar juntos.#!"
 STRAND_CHANNEL_PERK_EFFECT: "Permite interactuar con tus [Fetters|E] desde cualquier lugar de la [umbra|E].\n#F Un Monitor puede hablar a través de una [Fetter|E], o usar sus Arcanos a través de una [Fetter|E].#!"
 SPLICE_STRAND_PERK_EFFECT: "Bono a la interacción $POD_manipulate_fetters_interaction$ [character_interaction|E], permite asignar un punto de [Fetter|E] gratuito a unas [Fetters|E] ya existentes.\nDesbloquea la interacción $POD_manipulate_fetter_interaction$ [character_interaction|E], permite crear una [Fetter|E] temporal.\n#F Un Monitor puede crear una [Fetter|E] temporal.#!"
 EARLY_WARNING_PERK_EFFECT: "Recibirás una notificación cuando tus [Fetters|E] vayan a morir por causas naturales.\n#F Un Monitor puede marcar a un mortal para que le alerte si el Quick está a punto de morir.#!"
 SEVER_STRAND_PERK_EFFECT: "Bono a la interacción $POD_manipulate_fetters_interaction$ [character_interaction|E], permite disminuir el nivel de una [Fetter|E] así como destruir [Fetters|E] de nivel 1.\n#F Un Monitor puede despojar de su [Fetter|E] a otro wraith.#!"
 WALK_THE_WEB_PERK_EFFECT: "Como [character_interaction|E], te permite teletransportarte a la ubicación de una [Fetter|E].\n#F Un Monitor puede viajar rápidamente hasta una [Fetter|E].#!"
 SOULS_INTERWOVEN_PERK_EFFECT: "Desbloquea la interacción $POD_sprout_fetter_seed_character_interaction$ [character_interaction|E] para plantar una semilla de [Fetter|E] en [GetTrait('mortal').GetName(GetNullCharacter)].\n#F Un Monitor puede tomar a un mortal dispuesto (o a un sobrenatural vivo/no-muerto) como una [Fetter|E], y a cambio este puede comunicarse con el Monitor cuando quiera, independientemente de dónde se encuentre cualquiera de los dos.#!"
 
