 SPECTRE_PRESTIGE_PERK_EFFECT: "Durante la Catarsis, obtienes [GetModifier('spectre_prestige_modifier').GetNameWithTooltip].\n#F La Sombra es respetada por los Espectros y acudirán en ayuda del wraith durante la Catarsis.#!"
 DARK_ALLIES_PERK_EFFECT: "Durante la Catarsis, obtienes [GetModifier('dark_allies_modifier').GetNameWithTooltip].\n#F La Sombra del personaje se comunica regularmente con Espectros específicos y puede llamarlos para pedirles ayuda.#!"
 TAINTED_RELIC_PERK_EFFECT: "Aumenta el coste de [static_stress|E] por mantener una [Fetter|E] en la Catarsis.\n#F La Sombra posee una reliquia importante que se manifiesta cuando toma el control: un arma o algún otro objeto útil.#!"
 INFAMY_PERK_EFFECT: "Durante la Catarsis, obtienes [GetModifier('infamy_modifier').GetNameWithTooltip].\n#F Como memoria para la Sombra, la Infamia es la medida de cuánto miedo y odio inspira el wraith aún en los vivos.#!"
 DEATHS_SIGIL_PERK_EFFECT: "Cada 5 años, un 25 % de probabilidad de obtener [GetModifier('deaths_sigil_modifier').GetNameWithTooltip].\n#F El Sigilo de la Muerte es una señal prominente del toque del [UmbraGlossary('oblivion')] en el personaje, que se manifiesta sin importar a dónde vaya.#!"
 SHADOW_TRAITS_PERK_EFFECT: "Disminuye la probabilidad de éxito al recuperar el control sobre tu Sombra.\n#F La Sombra puede comprar Habilidades, pero estas Habilidades extra solo están disponibles durante la Catarsis.#!"
 NIGHTMARES_PERK_EFFECT: "Cada 5 años, un 50 % de probabilidad de obtener [GetModifier('nightmares_modifier').GetNameWithTooltip].\n#F Cuando la Psique entra en Hibernación, una Sombra con esta Espina puede provocarle pesadillas intensas.#!"
 AURA_OF_CORRUPTION_PERK_EFFECT: "Cada 5 años, un 25 % de probabilidad de obtener [GetModifier('aura_of_corruption_modifier').GetNameWithTooltip].\n#F A través de los efectos de esta Espina, la Sombra de algún modo desfigura la apariencia del wraith, haciendo que su presencia sea desagradable para otros wraiths.#!"
 MIRROR_MIRROR_PERK_EFFECT: "Cada 5 años, un 25 % de probabilidad de obtener [GetModifier('mirror_mirror_modifier').GetNameWithTooltip].\n#F Siempre que el Wraith se ve en una superficie reflectante, la Sombra puede hacer que el reflejo se vea horriblemente distorsionado, de la manera que la Sombra desee.#!"
 SHADOW_CALL_PERK_EFFECT: "Durante la Catarsis, obtienes [GetModifier('shadow_call_modifier').GetNameWithTooltip].\n#F Llamada de la Sombra permite que la Sombra de un wraith invoque Espectros cercanos.#!"
 PACT_OF_DOOM_PERK_EFFECT: "Como una [character_interaction|E], obtén 2 [perk|E] de [arcanoi_lifestyle|E] a costa de aumentar el poder de tu Sombra.\n#F Si un wraith tiene esta Espina, ella y su Sombra pueden negociar un Pacto mediante el cual la Sombra le enseñará un número predeterminado de niveles en un Arcano.#!"
 TRICK_OF_THE_LIGHT_PERK_EFFECT: "Cada 5 años, un 25 % de probabilidad de obtener [GetModifier('trick_of_the_light_modifier').GetNameWithTooltip].\n#F Al usar esta Espina, la Sombra altera sutilmente la Percepción de la Psique.#!"
 BAD_LUCK_PERK_EFFECT: "Cada 5 años, un 25 % de probabilidad de obtener [GetModifier('bad_luck_modifier').GetNameWithTooltip].\n#F La Sombra puede gastar una Angustia para provocar que la Psique entre en un reintento.#!"
 SHADOWED_FACE_PERK_EFFECT: "Durante la Catarsis, obtienes [GetModifier('shadowed_face_modifier').GetNameWithTooltip].\n#F Con esta Espina, la Sombra cambia completamente la apariencia de su Psique cuando toma el control.#!"
 HONEYED_TONGUE_PERK_EFFECT: "Aumenta la probabilidad de perder el control sobre tu Sombra.\n#F La Sombra es casi sobrenaturalmente persuasiva y puede desplegar todo su encanto cuando decide hacerlo.#!"
 TAINTED_TOUCH_PERK_EFFECT: "Cada 5 años, un 25 % de probabilidad de obtener [GetModifier('tainted_touch_modifier').GetNameWithTooltip].\n#F Esta Espina convierte al wraith en algo así como una Mary Tifoidea entre los Inquietos.#!"
 THORN_SHADOWPLAY_PERK_EFFECT: "#F La Sombra puede ofrecer una acción adicional a la Psique después de que el Wraith haya agotado todas sus acciones.#!"
 SHADOW_FAMILIAR_PERK_EFFECT: "Disminuye la probabilidad de éxito al recuperar el control sobre tu Sombra.\n#F Mientras la Sombra permanezca dentro de la conciencia del wraith, un Familiar de la Sombra puede servir como sus ojos, oídos y pies.#!"
 FREUDIAN_SLIP_PERK_EFFECT: "Cada 5 años, un 25 % de probabilidad de obtener [GetModifier('freudian_slip_modifier').GetNameWithTooltip].\n#F A costa de un punto de Angustia, la Sombra puede forzar al wraith a realizar una acción repentina e involuntaria o a pronunciar una declaración rápida y sin filtro.#!"
 SHADOW_LIFE_PERK_EFFECT: "Aumenta la probabilidad de perder el control sobre tu Sombra.\n#F Siempre que un wraith con esta Espina entre en Hibernación, su Sombra toma el control de su [Corpus|E] compartido y se dispone a hacer lo peor.#!"
 THORN_WHISPERS_PERK_EFFECT: "Aumenta la probabilidad de perder el control sobre tu Sombra.\nDisminuye la probabilidad de éxito al recuperar el control sobre tu Sombra.\n#F La Sombra con esta Espina puede hablar con las Sombras de otros wraiths sin que sus Psiques lo sepan.#!"
 THORN_MANIFESTATION_PERK_EFFECT: "Cada 5 años, un 25 % de probabilidad de obtener [GetModifier('thorn_manifestation_modifier').GetNameWithTooltip].\n#F Al gastar Angustia, la Sombra puede materializarse como una entidad separada del wraith.#!"
 DEVILS_DARE_PERK_EFFECT: "Número de Pasiones Oscuras: #N +1#!\n#F El desafío del diablo es el equivalente emocional a un juego de nervios. Para usar esta Espina, la Sombra invierte una cantidad de Angustia y escribe algo que desafía a la Psique a hacer.#!"
 VAMPIRIC_NATURE_PERK_EFFECT: "Cada 5 años, un [perk|E] que potencie tu Sombra te otorga otra oportunidad de activarse.\n#F Esta Espina permite a una Sombra succionar Angustia de otros para sus propios fines.#!"

