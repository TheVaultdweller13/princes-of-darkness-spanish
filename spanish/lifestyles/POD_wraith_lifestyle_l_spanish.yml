 REND_PERK_EFFECT: "Hiere a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante unos [single_combat_duel_plural|E].\n#F Un Masquer puede despedazar el [Corpus|E] de otro wraith.#!"
