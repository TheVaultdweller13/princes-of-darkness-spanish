 OBLIVIATE_PERK_EFFECT: "Desbloquea la opción de [execution|E] $EXECUTION_UNMAKING$.\nPermite recibir [artifact|E] de los Rápidos de las [Glossary('Tierras de Piel','game_concept_skinlands_desc')].\n#F Una aparición puede dañar a un mortal, wraith o cosa de forma tan severa que caiga directamente al [UmbraGlossary('oblivion')]. Cuando se usa en un objeto material habitado por un wraith, este se convierte en una reliquia.#!"
