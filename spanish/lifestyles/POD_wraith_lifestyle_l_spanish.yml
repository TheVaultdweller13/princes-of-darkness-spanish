 BITE_ME_PERK_EFFECT: "#F Un habitante puede crear comida de aspecto realista (pero de sabor asqueroso) con su [Corpus|E].#!"
 DARK_ETHER_PERK_EFFECT: "Otorga [GetModifier('dark_ether_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante unos [single_combat_duel_plural|E].\n#F Un habitante puede alterar las condiciones de luz o el clima en un área.#!"
 ESCHERS_STAIR_PERK_EFFECT: "Como [character_interaction|E], te permite teletransportar a tu ejército a la ubicación de tu objetivo, con el riesgo de perderse en el [UmbraGlossary('pod_realm_labyrinth')].\n#F Un habitante puede vincular dos puertas u otros portales a través del [UmbraGlossary('pod_realm_labyrinth')].#!"
 FOUL_HUMOUR_PERK_EFFECT: "Otorga a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E], o a ti mismo durante unos [single_combat_duel_plural|E], [GetModifier('foul_humour_modifier').GetNameWithTooltip] [modifier|E] cuando actúes como [commander|E] durante la [combat_phase|E].\n#F Un espectro puede producir un efecto material y fuerte a través del Manto.#!"
 STIGMATA_PERK_EFFECT: "#F Un habitante puede crear la apariencia de heridas sangrantes en su objetivo.#!"
 FORM_OF_CHAOS_PERK_EFFECT: "Permite fabricar un personaje [GetTrait('automaton').GetName( GetPlayer )].\n#F Un habitante puede crear una forma humanoide tosca a partir de lo que parecen ser objetos asquerosos (como sangre, gusanos, insectos, etc.).#!"
 TEMPUS_FUGIT_PERK_EFFECT: "Otorga [GetModifier('tempus_fugit_modifier').GetNameWithTooltip] [modifier|E] a los [commanders|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E].\n#F Un habitante puede manipular la distancia y el tiempo de forma limitada.#!"
 TESSERACT_BOMB_PERK_EFFECT: "Otorga a los [commanders|E] enemigos el modificador [GetModifier('tesseract_bomb_modifier').GetNameWithTooltip] [modifier|E] cuando actúen como [commander|E] durante la [combat_phase|E].\n#F Un Acechador puede convertir una estructura en un laberinto de geometría de Pesadilla, haciendo que sea imposible entrar o salir.#!"
 
