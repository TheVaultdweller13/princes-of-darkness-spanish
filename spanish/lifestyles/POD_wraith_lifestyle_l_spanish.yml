 game_concept_arcanoi_lifestyle: "Arcanoi"
 game_concept_arcanoi_lifestyle_desc: "El $game_concept_arcanoi_lifestyle$ es adecuado para los $POD_splat_wraith_plural$. Las artes de los muertos, los Arcanoi son habilidades espirituales secretas que pueden enseñarse o adquirirse mediante la experiencia."
 
