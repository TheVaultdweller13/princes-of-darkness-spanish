 NOBLE_ARTS_MANNIKIN_INABILITY: "@warning_icon!#X ¡Los [GetTrait('mannikin').GetName(GetPlayer)] son incapaces de aprender Artes más allá del nivel 3!#!"

 noble_arts_backwards_glance_perk_name: "Mirada Atrás"
 noble_arts_effect_and_cause_perk_name: "Efecto y Causa"
 noble_arts_set_in_stone_perk_name: "Grabado en Piedra"
 noble_arts_deja_vu_perk_name: "Déjà Vu"
 noble_arts_time_dilation_perk_name: "Dilatación del Tiempo"

 NOBLE_ARTS_BACKWARDS_GLANCE_PERK_EFFECT: "Si alguno de tus familiares o amigos es asesinado en circunstancias misteriosas, conocerás a sus asesinos.\n#flavor Para empezar, el estudiante de la magia del tiempo aprende a mirar hacia atrás en el tiempo. Aunque se considera un uso rudimentario de Chronos, la utilidad del cantrip hace que incluso los novatos sean solicitados en freeholds y pandillas. Una sidhe que investiga la desaparición de su vasallo mira el pasado del lugar donde se le vio por última vez. Desconfiado de su amante, un troll atisba su día y ve una cita con su amante.#!"
 NOBLE_ARTS_EFFECT_AND_CAUSE_PERK_EFFECT: "$passive_cantrip_fae$ Aplica [GetModifier('cantrip_effect_and_cause_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_chronos_effect_and_cause')].\n#flavor Primer cantrip que trata de la distorsión del tiempo, Efecto y Causa dispersa la progresión normal del tiempo para el objetivo del cantrip. El sonido de cristales rotos podría preceder a la caída del vaso al suelo, o una herida aparecería antes de que la espada la alcanzase.#!"
 NOBLE_ARTS_SET_IN_STONE_PERK_EFFECT: "$cantrip_standard_bunk$ Vuelve irrompible un [artifact|E] y añade [GetModifier('cantrip_set_in_stone_modifier').GetNameWithTooltip].\nTus Mascotas ya no pueden morir de vejez.\n#flavor Las manipulaciones menores del flujo del tiempo preceden a que el Kithain aprenda a represar el río y a detener temporalmente el propio tiempo. Lanzar Grabado en Piedra sobre un objetivo impide los efectos normales del envejecimiento y de la exposición al mundo exterior, pero no impide que el objetivo tenga interacciones normales o sea destruido de forma intencionada. El tiempo ya no tiene el mismo efecto sobre el objetivo, lo que impide el crecimiento, el envejecimiento, el deterioro y a veces el progreso. Los patrones climáticos podrían permanecer constantes durante semanas, mientras la comida seguiría madura y comestible indefinidamente. El cantrip no impide el daño intencionado, lo que significa que la espada del Kithain quizá nunca necesite mantenimiento, pero sufriría daños si se la martillea.#!"
 NOBLE_ARTS_DEJA_VU_PERK_EFFECT: "$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_deja_vu_modifier').GetNameWithTooltip].\n#flavor Más allá de la manipulación de la percepción temporal, más allá de detener el flujo del tiempo alrededor del objetivo, el Fae aprende a continuación a revivir un momento reciente y a reexperimentar el presente armado con conocimiento del futuro. A medida que el tiempo avanza, las posibilidades ramificadas hacen inútil cualquier aplicación a largo plazo del cantrip, pero durante hasta unos minutos el adepto de Chronos se convierte en un viajero en el tiempo. Con semejante poder innegable, el Fae también acepta el riesgo de verse abrumado por futuros posibles. El uso repetido de Déjà Vu durante la misma escena se vuelve cada vez más difícil a medida que los hilos del destino se enredan.#!"
 NOBLE_ARTS_TIME_DILATION_PERK_EFFECT: "$cantrip_hard_bunk$ Envejece al objetivo #V 25#! años.\n$passive_cantrip_fae$ Aplica [GetModifier('cantrip_time_dilation_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_chronos_time_dilation')].\n#flavor Origen de las leyendas de Rip Van Winkle, dilatar el tiempo empuja al objetivo hacia delante en el tiempo y lo desincroniza del resto del mundo. El objetivo envejecerá y sufrirá los efectos normales del paso del tiempo, pero el mundo a su alrededor apenas cambia.#!"

 noble_arts_burning_chew_perk_name: "Masticar Ardiente"
 noble_arts_confounding_coils_perk_name: "Espirales Desconcertantes"
 noble_arts_dragonscales_perk_name: "Escamas de Dragón"
 noble_arts_holy_strike_perk_name: "Golpe de Acebo"
 noble_arts_tripping_the_ire_perk_name: "Provocar la Ira"

 NOBLE_ARTS_BURNING_CHEW_PERK_EFFECT: "$unlock_forging_node$ Añade [GetModifier('artifact_prowess_2_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_burning_chew_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ Aplica [GetModifier('cantrip_burning_chew_modifier').GetNameWithTooltip] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E], o a ti mismo durante los [single_combat_duel_plural|E].\n$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor Este cantrip infunde a su objetivo el poder ardiente de la leyenda y le otorga una fuerza y un poder destructivo tremendos. Para quienes tienen ojos Fae, el sujeto parece vagamente perfilado por un aura dorada que se alza y parpadea como llamas.#!"
 NOBLE_ARTS_CONFOUNDING_COILS_PERK_EFFECT: "$unlock_forging_node$ Añade [GetModifier('artifact_soak_2_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_confounding_coils_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ Aplica [GetModifier('cantrip_confounding_coils_modifier').GetNameWithTooltip] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E], o a ti mismo durante los [single_combat_duel_plural|E].\n$countermeasures_unlocks_t2_supernatural_high_alert$\n#flavor Una sidhe danza por el campo de batalla y abate a sus enemigos sin que la toque ni siquiera la sangre que derrama. Al sujeto de este cantrip se le concede la gracia de una serpiente enroscada. Sus movimientos se vuelven sinuosos, casi hipnóticos, y puede evitar el daño con facilidad. Incluso un objeto inanimado bendecido por este cantrip parece retorcerse y desplazarse sutilmente, desbaratando los intentos de golpearlo.#!"
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT: "Esto sustituye al [cantrip|E] de [GetPerk('noble_arts_burning_chew_perk').GetName(GetPlayer)] y de [GetPerk('noble_arts_confounding_coils_perk').GetName(GetPlayer)]"
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT2: "Esto sustituye al [passive_cantrip|E] de [GetPerk('noble_arts_burning_chew_perk').GetName(GetPlayer)] y de [GetPerk('noble_arts_confounding_coils_perk').GetName(GetPlayer)]"
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT: "$cantrip_standard_bunk$ #underline;TOOLTIP:NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT @warning_icon!#! Aplica al objetivo [GetModifier('cantrip_dragonscales_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ #underline;TOOLTIP:NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT2 @warning_icon!#! Aplica [GetModifier('cantrip_dragonscales_modifier').GetNameWithTooltip] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E], o a ti mismo durante los [single_combat_duel_plural|E].\n$countermeasures_unlocks_t3_supernatural_high_alert$\n[PODUnlocksCombatMove('POD_combat_move_fae_dragons_ire_dragonscales')].\n#flavor El Fae infunde a su sujeto la resistencia mística de la piel de dragón. Para quienes pueden ver más allá de las Brumas, el sujeto parece centellear con una calima de calor y su piel o superficie reluce bajo la luz directa.#!"
 NOBLE_ARTS_HOLY_STRIKE_PERK_EFFECT: "$cantrip_hard_bunk$ Inflige [EmptyScope.ScriptValue('noble_arts_holy_strike_interaction_damage')] de [POD_aggravated_damage_with_box|E] al objetivo.\n$passive_cantrip_fae$ Inflige [EmptyScope.ScriptValue('noble_arts_holy_strike_perk_damage')] de [POD_superficial_damage_with_box|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_dragons_ire_holy_strike')].\n#flavor Nombrado por la planta del legendario guerrero, es un cantrip de pura destrucción que adapta su manifestación externa a la naturaleza del Fae que lo empuña. Siempre adopta la forma de una explosión de poder sobrenatural, pero puede ser desde una ola fría de oscuridad marchitante hasta un destello esmeralda que hace pedazos a un objetivo o una rugiente ola de fuego de dragón.#!"
 NOBLE_ARTS_TRIPPING_THE_IRE_PERK_EFFECT: "$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_tripping_the_ire_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ Aplica [GetModifier('cantrip_tripping_the_ire_modifier').GetNameWithTooltip] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E], o a ti mismo durante los [single_combat_duel_plural|E].\n$countermeasures_unlocks_t4_supernatural_high_alert$\n#flavor El Fae invoca la sabiduría marcial de incontables guerreros de la leyenda arcadiana para que habiten en su sujeto, lo que le permite una aterradora danza de batalla contra la que ningún enemigo puede aspirar a prevalecer.#!"

 noble_arts_between_the_lines_perk_name: "Entre Líneas"
 noble_arts_nicknames_perk_name: "Apodos"
 noble_arts_saining_perk_name: "Saining"
 noble_arts_runic_imprint_perk_name: "Impronta Rúnica"
 noble_arts_reweaving_perk_name: "Tejido"

 NOBLE_ARTS_BETWEEN_THE_LINES_PERK_EFFECT: "#flavor El discernimiento es la primera lección de las magias de Naming. Hasta que el Fae no entienda el mensaje real de todo lo dicho o escrito, no podrá comprender el conocimiento íntimo oculto en los Nombres Verdaderos. Engañosamente poderoso, Entre Líneas capacita al Kithain para entender cualquier idioma o para aprender el significado pretendido tras todo lo que pueda ver u oír.#!"
 NOBLE_ARTS_NICKNAMES_PERK_EFFECT: "$cantrip_easy_bunk$ Hace que el objetivo pierda 500 de [prestige|E] y obtenga 25 de [stress|E].\n#flavor Antes de que un Fae desarrolle el talento y el discernimiento necesarios para descubrir Nombres Verdaderos, aprende a aplicar una etiqueta más superficial a algo o alguien. El efecto se desvanece con el tiempo, pero la identidad del objetivo se deforma y se pliega al apodo que le da el Fae. Mientras el cantrip sigue activo, todos los que rodean al foco del cantrip lo ven a través del prisma del Apodo.#!"
 NOBLE_ARTS_SAINING_PERK_EFFECT: "Puede usar el [journey|E] «Aprender Nombre Verdadero».\nPuede aprender los [Glossary('Nombres Verdaderos','podgloss.truename')] de los [traits|E].\n#flavor La capacidad de discernir Nombres Verdaderos es el corazón de la magia de Naming. Una vez que el Fae puede etiquetar la naturaleza inherente del sujeto, obtiene una profunda comprensión de quién o qué es, así como el poder de esgrimir cualquier magia contra él con poca resistencia. El poder que el místico de Naming obtiene sobre alguien puede parecer beneficioso al principio, pero las lealtades cambian, los amigos se vuelven enemigos y nada permanece secreto para siempre.#!"
 NOBLE_ARTS_RUNIC_IMPRINT_PERK_EFFECT: "$unlock_forging_node$ Añade 2 [modifiers|E] según el tipo de [artifact|E].\n$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_runic_imprint_survival_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_runic_imprint_scholar_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_runic_imprint_ruler_modifier').GetNameWithTooltip]).\n[PODUnlocksCombatMove('POD_combat_move_fae_naming_runic_imprint')].\n#flavor Habiendo aprendido a ver la verdadera naturaleza de cualquier cosa a su alrededor, el Fae se instruye ahora en el antiguo lenguaje de las runas y en cómo aplicarlas para fortalecer a sus aliados o debilitar a sus enemigos. El cantrip de Impronta Rúnica siempre implica escritura o movimiento físico para formar la runa sobre el objetivo o cerca de él. Después, el Fae puede moldear los atributos básicos del foco del cantrip como estime oportuno.#!"
 NOBLE_ARTS_REWEAVING_PERK_EFFECT: "$cantrip_hard_bunk$ Cambia libremente la personalidad, la salud, el estrés y los [traits|E] físicos de un objetivo cuyo [Glossary('Nombre Verdadero','podgloss.truename')] conozcas.\n#flavor Tras aprender el Nombre Verdadero del sujeto, un maestro de Naming puede reescribir ese nombre y cambiar fundamentalmente al objetivo. Los Seelie podrían volverse Unseelie, los Legados podrían cambiarse, etc. Incluso los lugares pueden cambiarse y su propósito o estructura redefinirse.#!"

 noble_arts_protocol_perk_name: "Protocolo"
 noble_arts_grandeur_perk_name: "Grandeza"
 noble_arts_guest_list_perk_name: "Lista de Invitados"
 noble_arts_dictum_perk_name: "Dictum"
 noble_arts_geas_perk_name: "Geas"

 NOBLE_ARTS_PROTOCOL_PERK_EFFECT: "$cantrip_standard_bunk$ Obtén un [weak_hook|E] sobre el objetivo.\n#flavor Las reglas Kithain para los tratos cortesanos suelen ser arcanas y a veces inescrutables. El primer cantrip que aprenden los Kithain que estudian Sovereign aplica esa etiqueta a casi cualquier situación. Cualquiera bajo los efectos del Protocolo queda ligado por las reglas del decoro Kithain y sufre las consecuencias de violarlas, incluso sin querer.#!"
 NOBLE_ARTS_GRANDEUR_PERK_EFFECT: "$passive_cantrip_fae$ Aumenta la aceptación de [peace|E] en #P +10#!.\n$passive_cantrip_fae$ Aumenta en #P +20#! la aceptación de invitaciones a la [court|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_sovereign_grandeur')].\n#flavor Con un cantrip sencillo, el Fae encarna la Grandeza inherente a todos los hijos de Arcadia y hace que quienes lo rodean clamen por atención y eviten el conflicto. Todos los que están bajo la influencia del cantrip ven al Fae como un líder, salvador o miembro de la realeza. Puede que en realidad no posea el aplomo y la gracia que se atribuyen a los reyes y reinas de antaño, pero la Grandeza ofrece un práctico sustituto de lo auténtico.#!"
 noble_arts_grandeur_perk_modifier: "Tienes [GetPerk('noble_arts_grandeur_perk').GetName(GetPlayer)]: $VALUE|0P=$"
 NOBLE_ARTS_GUEST_LIST_PERK_EFFECT: "#flavor El uso de este cantrip impide que nadie ni nada entre en el objetivo del cantrip, lo use o interactúe con él sin permiso del lanzador. El Fae puede instituir una contraseña formada por una frase o acción que añade al sujeto a la «lista» y le permite acceder al foco del cantrip.#!"
 NOBLE_ARTS_DICTUM_PERK_EFFECT: "Mejora el [cantrip|E] [GetPerk('noble_arts_protocol_perk').GetName(GetPlayer)] otorgando un [perpetual_hook|E] en lugar de un [weak_hook|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_sovereign_dictum')].\n#flavor El título y el estatus suelen bastar para obligar a quienes rodean a un Fae a cumplir su voluntad. Cuando los atributos de la nobleza no bastan, el Dictum ofrece un recordatorio inconfundible de quién manda. El Fae lanza el cantrip y luego da una orden sencilla al objetivo, que debe obedecer. Un objetivo del Dictum puede ser capaz de resistir la orden, pero la mayoría no tiene la voluntad y se convierte al menos en servidor temporal del Fae.#!"
 NOBLE_ARTS_GEAS_PERK_EFFECT: "Mejora el [cantrip|E] [GetPerk('noble_arts_dictum_perk').GetName(GetPlayer)] otorgando un [strong_hook|E] en lugar de un [perpetual_hook|E].\n#flavor Los relatos de búsquedas encomendadas a héroes y villanos desterrados al exilio pueblan el folclore, y los antiguos moradores del Ensueño hacen realidad esas historias con un dominio de Sovereign. Un Geas moldea el Glamour en una directriz, similar a un juramento o contrato pero sin la reciprocidad que normalmente se exige. El Fae unce al objetivo a una directriz o prohibición junto con una maldición acompañante si no cumple el edicto.#!"

 noble_arts_done_deal_perk_name: "Trato Hecho"
 noble_arts_liars_bell_perk_name: "Campana del Mentiroso"
 noble_arts_castigate_perk_name: "Castigar"
 noble_arts_casual_contract_perk_name: "Contrato Casual"
 noble_arts_sanctified_words_perk_name: "Palabras Santificadas"

 NOBLE_ARTS_DONE_DEAL_PERK_EFFECT: "$cantrip_standard_bunk$ Da al objetivo un [strong_hook|E] sobre ti para obligarlo a realizar una tarea concreta (declarar guerra, dar oro, iniciar un plan de asesinato o convocar a la corte). El objetivo debe tener al menos #V 50#! de opinión de ti.\n#flavor Este poderoso cantrip permite al Fae pactar juramentos vinculantes con otros o santificar juramentos de los que es testigo formal. Quienes rompen acuerdos y contratos sellados con Glamour son castigados por las propias fuerzas del Ensueño.#!"
 NOBLE_ARTS_LIARS_BELL_PERK_EFFECT: "$passive_cantrip_actor$ Los [characters|E] sobre los que tienes un [hook|E] no pueden unirse a [schemes|E] ni [factions|E] contra ti.\n$passive_cantrip_actor$ Tus [councillors|E] no pueden unirse a [schemes|E] ni [factions|E] contra ti.\n#flavor A medida que crece el dominio del Fae sobre los Contratos, se vuelve muy sensible a las brechas en el Glamour vinculante que tendió. Se da cuenta al instante cada vez que alguien ha roto un contrato que santificó: no necesariamente sabe dónde ni por qué, pero sabe quién y cuándo. Además, le resulta fácil usar las Artes del Glamour para buscar al perjuro.#!"
 faction_noble_arts_liars_bell_perk_hook_modifier: "No es posible iniciar ni unirse a una [faction|E] contra alguien con [GetPerk('noble_arts_liars_bell_perk').GetName(GetNullCharacter)] que también tenga un [hook|E] sobre ti"
 faction_noble_arts_liars_bell_perk_councillor_modifier: "No es posible iniciar ni unirse a una [faction|E] contra alguien con [GetPerk('noble_arts_liars_bell_perk').GetName(GetNullCharacter)] si también estás en su [council|E]"
 noble_arts_liars_bell_perk_hook_modifier: "El objetivo tiene [GetPerk('noble_arts_liars_bell_perk').GetName(GetNullCharacter)] y un [hook|E] sobre mí: $VALUE|0N=$"
 noble_arts_liars_bell_perk_councillor_modifier: "El objetivo tiene [GetPerk('noble_arts_liars_bell_perk').GetName(GetNullCharacter)] y soy su [councillor|E]: $VALUE|0N=$"
 NOBLE_ARTS_CASTIGATE_PERK_EFFECT: "Mejora el [cantrip|E] [GetPerk('noble_arts_done_deal_perk').GetName(GetPlayer)] dando al objetivo un [weak_hook|E] sobre ti en lugar de un [strong_hook|E].\n#flavor El Fae no solo sabe cuándo alguien ha roto un juramento que santificó, sino que puede alargar la mano para infligir su propio castigo al perjuro, además de las penas normales por violar un Contrato.#!"
 NOBLE_ARTS_CASUAL_CONTRACT_PERK_EFFECT: "Mejora el [cantrip|E] [GetPerk('noble_arts_done_deal_perk').GetName(GetPlayer)] permitiendo además usarlo contra cualquier objetivo en la misma ubicación.\n#flavor Este temible encantamiento otorga al Fae poder incluso sobre los acuerdos más casuales, lo que le permite santificar compromisos descuidados («claro, allí estaré»), bravatas ociosas («si ese redcap pone un pie en este bar, lo azotaré a él y a toda su pandilla a la vez») e incluso réplicas sarcásticas («oh, claro que apoyaré al Duque Dray, con lo mucho que quiero a los nobles»).#!"
 NOBLE_ARTS_SANCTIFIED_WORDS_PERK_EFFECT: "$passive_cantrip_actor$ Aplica [GetModifier('cantrip_sanctified_words_modifier').GetNameWithTooltip] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E], o a ti mismo durante los [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_contract_sanctified_words')].\n#flavor Este impresionante cantrip permite al Fae tejer Glamour adicional en un contrato y conceder potentes bendiciones a quienes están atados por él. El poder de las Palabras Santificadas solo puede usarse para ayudar a cumplir el contrato, pero algunos juramentos pueden ser muy amplios («juro proteger al Duque con mi vida»).#!"

 noble_arts_creeping_shadows_perk_name: "Sombras Rastreras"
 noble_arts_autumn_eyes_perk_name: "Ojos de Otoño"
 noble_arts_the_poisoned_apple_perk_name: "La Manzana Envenenada"
 noble_arts_the_withering_perk_name: "El Marchitamiento"
 noble_arts_shivers_perk_name: "Escalofríos"

 NOBLE_ARTS_CREEPING_SHADOWS_PERK_EFFECT: "$countermeasures_unlocks_t1_obfuscated_court$.\n#flavor El Fae ordena a las sombras cercanas que se plieguen a su capricho. Un sátiro invoca la sombra de una pareja reacia para que baile con ella. Una sluagh cuaja las sombras nocturnas del dormitorio de un matón en un teatro de amenaza. Este Arte puede usarse con sutileza, retorciendo o manipulando ligeramente las sombras para dar un aspecto siniestro a la escena, o puede usarse para apropiarse de las sombras y convertirlas en grandes cosas aviesas, totalmente desconectadas de los actos de quienes las proyectan, o incluso para tragarse al Fae (o a otro) y ocultar al sujeto de la vista.#!"
 NOBLE_ARTS_AUTUMN_EYES_PERK_EFFECT: "$cantrip_standard_bunk$ Descubre una [scheme|E] aleatoria contra el personaje objetivo.\n#flavor Al infundir el Glamour del Otoño en sus ojos, el Fae sintoniza sus sentidos con la decadencia y la perdición. Puede ver la enfermedad y la debilidad en quienes la rodean, reconocer las debilidades y puntos de tensión de los objetos, o incluso reconocer a quienes están marcados por alguna gran perdición o una perdición inminente.#!"
 NOBLE_ARTS_THE_POISONED_APPLE_PERK_EFFECT: "$cantrip_standard_bunk$ Da al objetivo un [trait|E] de enfermedad aleatorio.\n$cantrip_standard_bunk$ Reduce en #V 20#! la [durability|E] de un artefacto.\n$passive_cantrip_fae$ Aplica [GetModifier('cantrip_the_poisoned_apple_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_autumn_poisoned_apple')].\n#flavor Este terrible cantrip ha dado a generaciones de mortales sobrados motivos para temer tanto los dones como la ira del pueblo feérico. Condensando su rabia en una mortífera infusión de Glamour dirigida a algo al alcance de su brazo, el Fae envenena a su sujeto.#!"
 NOBLE_ARTS_THE_WITHERING_PERK_EFFECT: "Mejora el [cantrip|E] de [character|E] [GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)] otorgando además [GetModifier('cantrip_the_withering_modifier').GetNameWithTooltip].\nMejora el [cantrip|E] de [artifact|E] [GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)] reduciendo en su lugar la [durability|E] en #V 40#!.\nMejora el [passive_cantrip|E] [GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)] otorgando en su lugar [GetModifier('cantrip_the_withering_knight_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_autumn_withering')].\n#flavor Con un gesto vicioso, el Fae roba la vitalidad de un objetivo y deja solo la apariencia de vejez y decadencia.#!"
 NOBLE_ARTS_SHIVERS_PERK_EFFECT: "$cantrip_standard_bunk$ Da al objetivo #V 100#! de [stress|E] (50 si es [GetTrait('brave').GetName(GetPlayer)] y 150 si es [GetTrait('craven').GetName(GetPlayer)]).\n$cantrip_standard_bunk$ Da a un artefacto un [modifier|E] que reduce en 1 una [skill|E] elegida. Cada [modifier|E] de [skill|E] solo puede aplicarse una vez por artefacto.\n#flavor El Fae extrae sus propios sueños de muerte y oscuridad y los lega a un objetivo. La persona o cosa así maldecida se convierte en un faro para los fantasmas y sufre durante un tiempo las atenciones de los muertos inquietos.#!"

 noble_arts_awaken_perk_name: "Despertar"
 noble_arts_verdant_reclamation_perk_name: "Reclamación Verdeante"
 noble_arts_well_of_life_perk_name: "Pozo de la Vida"
 noble_arts_faerie_ring_perk_name: "Anillo de Hadas"
 noble_arts_renewal_perk_name: "Renovación"

 NOBLE_ARTS_AWAKEN_PERK_EFFECT: "$cantrip_standard_bunk$ Aplica [GetModifier('cantrip_awaken_title_modifier').GetNameWithTooltip] a todos los [counties|E] del [title|E] del objetivo.\n$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_awaken_modifier').GetNameWithTooltip].\n#flavor Vida nueva, una semilla que brota: en el corazón de la Primavera está la promesa de los comienzos y del despertar del letargo o del sueño. El Fae comienza su viaje por el Arte de la Primavera aprendiendo a poner fin a la hibernación y a fomentar el crecimiento. El Fae planta una semilla de Glamour y luego observa cómo echa raíces y despierta el foco del cantrip.#!"
 NOBLE_ARTS_VERDANT_RECLAMATION_PERK_EFFECT: "Mejora el [cantrip|E] de [title|E] [GetPerk('noble_arts_awaken_perk').GetName(GetPlayer)] otorgando en su lugar [GetModifier('cantrip_verdant_reclamation_title_modifier').GetNameWithTooltip].\nMejora el [cantrip|E] de [character|E] [GetPerk('noble_arts_awaken_perk').GetName(GetPlayer)] otorgando en su lugar [GetModifier('cantrip_verdant_reclamation_modifier').GetNameWithTooltip].\n#flavor Todas las cosas proceden de la tierra y a la tierra todas las cosas volverán. Con tiempo suficiente, la naturaleza reclama todo y, con un poco de Glamour, el Fae que lanza un cantrip de Reclamación Verdeante puede acelerar el proceso. Útiles como exhibición de poder y para causar distracción, las plantas y el follaje que cubren al objetivo siguen creciendo y abrumando durante toda la escena.#!"
 NOBLE_ARTS_WELL_OF_LIFE_PERK_EFFECT: "$passive_cantrip_actor$ Cura [EmptyScope.ScriptValue('POD_base_heal_value')] de [POD_superficial_damage_with_box|E] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E], o a ti mismo durante los [single_combat_duel_plural|E].\n$cantrip_standard_bunk$ Cura [EmptyScope.ScriptValue('POD_spring_interaction_superficial_heal_value')] de [POD_superficial_damage_with_box|E] al objetivo.\n[PODUnlocksCombatMove('POD_combat_move_fae_spring_well_of_life')].\n#flavor Las leyendas del agua de la vida, un pozo o elixir místico que cura heridas o concede vida eterna, aparecen en la mayoría de las culturas a lo largo de las eras. Este cantrip de Primavera no revierte el envejecimiento ni concede inmortalidad, pero sí infunde al objetivo Glamour que cura a cualquiera cercano o en contacto con el cantrip. El clurichaun que observa el duelo de dos amigos se interpone entre ellos y cura las heridas de ambos. Desesperado por las vidas perdidas en ambos bandos, un caballero troll hace que la lluvia devuelva la vida a los heridos del campo de batalla. Con la esperanza de consolar a un médico fatigado, un pooka lo convierte en recipiente de curación al comenzar sus rondas. Tras ser emboscado, un redcap ofrece la carne y la sangre de su enemigo derrotado para curar a su pandilla.#!"
 NOBLE_ARTS_FAERIE_RING_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_fae_spring_faerie_ring')].\n#flavor Las leyendas humanas hablan de círculos de setas, flores silvestres o piedras conocidos como anillos de hadas: lugares peligrosos para los mortales porque los fae que viven y bailan en ellos pueden secuestrar o maldecir a cualquier intruso. El folclore guarda un germen de verdad. El Anillo de Hadas es un cantrip de Primavera que permite a un Fae crear un círculo que ofrece protección y ocultación frente a cualquier extraño, con graves consecuencias para quien se inmiscuya.#!"
 NOBLE_ARTS_RENEWAL_PERK_EFFECT: "$cantrip_hard_bunk$ Resucita a un $POD_splat_wraith$ como $POD_splat_mortal$.\n$cantrip_hard_bunk$ Aplica [GetModifier('cantrip_renewal_modifier').GetNameWithTooltip] a todos los [counties|E] del [title|E] del objetivo.\n$cantrip_hard_bunk$ Restaura por completo la [durability|E] de un [artifact|E].\n#flavor Cada año, la Primavera realiza el milagro supremo de descongelar el suelo y resucitar la vida en un paisaje temporalmente yermo por el invierno. Los maestros de la magia de Primavera aprovechan el ciclo de muerte y renacimiento para conceder temporalmente vida a cualquier cosa inerte o muerta. El círculo se cierra poco después, sin embargo, pues el Glamour solo sostiene la resurrección unos preciosos momentos.#!"

 noble_arts_flicker_files_perk_name: "Moscas Titilantes"
 noble_arts_enkindle_perk_name: "Avivar"
 noble_arts_aphrodisia_perk_name: "Afrodisia"
 noble_arts_vestas_blessing_perk_name: "Bendición de Vesta"
 noble_arts_the_beltane_blade_perk_name: "La Hoja de Beltane"

 NOBLE_ARTS_FLICKER_FILES_PERK_EFFECT: "$cantrip_standard_bunk$ Convoca al objetivo a tu [court|E].\n#flavor Este cantrip invoca de la sustancia del Ensueño motas brillantes y danzantes de luz de colores. Las moscas titilantes no solo iluminan la zona que las rodea, sino que sus colores, que palpitan con suavidad, evocan en quienes las ven una sutil resonancia de una emoción a elección del Fae. Tanto las moscas titilantes como la luz que proyectan son invisibles para los seres mundanos, pero los mortales tocados por su luz aún reaccionan a su resonancia emocional.#!"
 NOBLE_ARTS_ENKINDLE_PERK_EFFECT: "$passive_cantrip_fae$ Aplica [GetModifier('cantrip_enkindle_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_summer_enkindle')].\n#flavor Un matón tiembla en la oscuridad y una sluagh enrolla esa tensión en un terror aullante. La broma de una pooka apenas arranca risitas, hasta que ella fuerza un poco de magia en la respuesta de su público y llena la sala de risa incontenible. Exhalando un aliento de Glamour, el Fae aviva las llamas de la pasión hasta una altura rugiente y maníaca. Cualquier emoción que un individuo sienta cuando es hechizado con Avivar se intensifica drásticamente: la irritación se vuelve resentimiento hirviente, la ira se convierte en rabia desatada, la tristeza se ahonda en pena paralizante, la felicidad se despliega en alegría desbordante y el amor se convierte en una pasión que todo lo consume. Si se dirige a un objeto, cualquier emoción que ese objeto inspire en quienes interactúan con él se inflama de modo similar.#!"
 NOBLE_ARTS_APHRODISIA_PERK_EFFECT: "$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_aphrodisia_modifier').GetNameWithTooltip].\nMejora el [cantrip|E] [GetPerk('noble_arts_flicker_files_perk').GetName(GetPlayer)] reduciendo en 1 el coste de Glamour.\n#flavor Muy apreciado por los merfolk, sátiros, clurichauns y ciertos otros fae, este cantrip es el Arte de crear asombro, fascinación e incluso deseo que lo abarcan todo. El sujeto de este Hechizo gana una atracción magnética. Si se hechiza a una persona, cada palabra y acción suya se vuelve cautivadora y fascinante. Si se lanza Afrodisia sobre un objeto, todos los que lo contemplan lo codician al instante.#!"
 NOBLE_ARTS_VESTAS_BLESSING_PERK_EFFECT: "$passive_cantrip_actor$ Aplica [GetModifier('cantrip_vestas_blessing_modifier').GetNameWithTooltip] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E], o a ti mismo durante los [single_combat_duel_plural|E].\n#flavor El hogar de una casa representa seguridad y hospitalidad. Al emplear la Bendición de Vesta, un Fae crea la comodidad del hogar allí donde pueda levantar refugio o fuego. Útil para viajeros y para cualquiera que esté siendo cazado, el Glamour del Fae actúa como centinela y ofrece una advertencia instintiva ante cualquier intrusión. Además, cualquiera invitado al espacio santificado se siente restaurado y rejuvenecido.#!"
 NOBLE_ARTS_THE_BELTANE_BLADE_PERK_EFFECT: "Velocidad de [journey|E] de #V $glamour_quests_name$#!: #P +100%#!\n[PODUnlocksCombatMove('POD_combat_move_fae_summer_beltane_blade')].\n#flavor El Fae hace un gesto y la mancha de Banalidad dentro de su objetivo estalla en brillantes llamas destructivas de rojo y oro. Hubo un tiempo en que este cantrip era la gran y reluciente espada del Verano, usada para expulsar a los mortales y la mancha de lo mundano de los freeholds secretos y los países ocultos de los fae. Ahora que la Banalidad ha anegado el Mundo Otoñal, este cantrip sigue siendo un arma potente, pero cuyo feroz calor parece lamentablemente insuficiente para mantener a raya el Invierno que se acerca.#!"

 noble_arts_chill_perk_name: "Escalofrío"
 noble_arts_hardened_heart_perk_name: "Corazón Endurecido"
 noble_arts_terror_of_the_long_night_perk_name: "Terror de la Larga Noche"
 noble_arts_sculpt_perk_name: "Esculpir"
 noble_arts_stasis_perk_name: "Estasis"

 NOBLE_ARTS_CHILL_PERK_EFFECT: "$passive_cantrip_fae$ Aplica [GetModifier('cantrip_chill_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_winter_chill')].\n#flavor La primera y más benigna aplicación de las magias de Invierno permite al Fae bajar significativamente la temperatura del objetivo en un corto período. El Escalofrío no causa herida ni daño al lanzarse sobre una criatura viva, pero las plantas y los objetos pueden marchitarse o romperse, respectivamente. Siempre que el Kithain pueda ver el foco del cantrip, puede hacer llegar un frío profundo y desagradable.#!"
 NOBLE_ARTS_HARDENED_HEART_PERK_EFFECT: "Te vuelves inmune a las [character_interaction|E] mentales hostiles.\n$countermeasures_unlocks_t3_mental_fortress$\n#flavor El Invierno no llora al viajero perdido que se congela en la nieve. El Invierno no protege a la presa rastreada por lobos o atrapada en la trampa del cazador. Aprovechando el corazón del frío, los adeptos del Invierno acallan la emoción y aíslan el foco de su cantrip de la manipulación y la influencia. El objetivo se vuelve incapaz de reunir su propia pasión y voluntad, un precio considerable por resistir incluso las manipulaciones más poderosas.#!"
 NOBLE_ARTS_TERROR_OF_THE_LONG_NIGHT_PERK_EFFECT: "$passive_cantrip_fae$ Expulsa de la batalla a todos los [knights|E] enemigos [GetTrait('craven').GetName(GetNullCharacter)] cuando actúes como [commander|E] durante la [combat_phase|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_winter_terror_long_night')].\n#flavor El verdadero invierno atenúa la luz y se traga el calor. Solos y fríos, incluso los más valientes sienten un miedo hondo y existencial ante una oscuridad gélida e interminable. El caballero sluagh hace que su enemigo se eche atrás ante toda la corte. El cantrip de una pooka hace huir a sus cómplices mortales y deja los frutos de su latrocinio solo para ella. Escabulléndose por patios traseros para huir de un Dauntain, un nocker manda a los pastores alemanes residentes a esconderse acobardados en sus casetas.#!"
 NOBLE_ARTS_SCULPT_PERK_EFFECT: "$passive_cantrip_fae$ Inflige [EmptyScope.ScriptValue('noble_arts_sculpt_perk_damage')] de [POD_superficial_damage_with_box|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_winter_ice_shackles')].\n#flavor Yendo más allá de las invocaciones básicas del frío, el Fae conjura hielo con su Glamour y lo esculpe para el fin que desee. La creación no puede confundirse con nada que no sea hielo y resulta amargamente fría al tacto de cualquier otro, pero la escultura no se derrite salvo que se la exponga a calor o llama mágicos.#!"
 NOBLE_ARTS_STASIS_PERK_EFFECT: "$passive_cantrip_fae$ Expulsa de la batalla a los dos [knights|E] enemigos con más [prowess|E] cuando actúes como [commander|E] durante la [combat_phase|E] (si no están protegidos de los poderes mentales).\n$cantrip_exceptional_bunk$ Fuerza al objetivo a [GetTrait('torpor').GetName(GetPlayer)].\n#flavor El último cantrip que se enseña a los maestros del Invierno permite al Fae atrapar a un objetivo en escarcha mágica durante períodos prolongados, manteniéndolo exactamente como está pero inmóvil y (si procede) inconsciente. Cualquier cosa o persona puesta en estasis no envejece, ni se descompone, ni se rompe, ni cambia. Mientras dure el cantrip, el objetivo permanece suspendido en el tiempo. Romper la escarcha requiere magia poderosa, como la de un maestro de Pyretics o de la Primavera.#!"