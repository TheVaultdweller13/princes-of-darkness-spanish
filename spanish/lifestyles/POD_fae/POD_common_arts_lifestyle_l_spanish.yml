 common_arts_omen_perk_name: "Presagio"
 common_arts_seers_wisp_perk_name: "Fuego Fatuo del Vidente"
 common_arts_tattletale_perk_name: "Chivato"
 common_arts_augury_perk_name: "Augurio"
 common_arts_face_fate_perk_name: "Fuego del Destino"

 COMMON_ARTS_OMEN_PERK_EFFECT: "$cantrip_easy_bunk$ Descubre un [secret|E] aleatorio del objetivo.\n$countermeasures_unlocks_t2_all_seeing_eye$\n[PODUnlocksCombatMove('POD_combat_move_fae_soothsay_omen')].\n#flavor Este rudimentario cantrip ofrece el más breve vistazo al hilo del destino de una persona, lugar o cosa. El Presagio revelado es siempre vago y rara vez se refiere a sucesos inmediatos: a este nivel, el vidente a lo sumo puede atisbar la naturaleza general del destino de una cosa.#!"
 COMMON_ARTS_SEERS_WISP_PERK_EFFECT: "$cantrip_standard_bunk$ Descubre (Invoca) un [artifact|E] con una [rarity|E] basada en tu [fae_realm|E] de $fae_prop_realm$.\n$cantrip_easy_bunk$ Obtén una cantidad de [gold|E] basada en tu [fae_realm|E] de $fae_prop_realm$.\n#flavor El vidente obtiene la capacidad de conjurar un fragmento brillante del corazón del Ensueño que lo guíe adonde necesite viajar. Puede susurrar al Fuego Fatuo el nombre o la descripción de la cosa, persona o lugar que busca y este lo conducirá sin error por los senderos de Dán.#!"
 COMMON_ARTS_TATTLETALE_PERK_EFFECT: "Mejora los [cantrips|E] [GetPerk('common_arts_omen_perk').GetName(GetPlayer)] y [GetPerk('common_arts_seers_wisp_perk').GetName(GetPlayer)] en $cantrip_difficulty_reduce$.\n$countermeasures_unlocks_t3_all_seeing_eye$\n#flavor Este útil cantrip permite al vidente escrutar escenas lejanas a través de un objeto o individuo que ha hechizado a tal efecto. Tradicionalmente, todo lo que hay en las inmediaciones del foco del Chivato se muestra en una superficie reflectante cercana o en la que el Fae elija. El Fae puede usar cualquier cantrip basado en la percepción a través del foco una vez establecida la conexión.#!"
 COMMON_ARTS_AUGURY_PERK_EFFECT: "$cantrip_standard_bunk$ Convoca a tu [court|E] a un $POD_splat_mortal$ con las [skills|E] que elijas.\n$countermeasures_unlocks_t4_all_seeing_eye$\n#flavor El vidente se adentra en la trama y la urdimbre de Dán y persuade a las fuerzas del destino y del Ensueño para que revelen un camino hacia el deseo de su corazón. El Augurio es un Arte notoriamente traicionero e incierto, pues el camino que revela es siempre fragmentario y nublado, pero, seguido con diligencia, conducirá al futuro que el Fae busca. En lugar de dar una lista de instrucciones para lograr el objetivo consultado, el Augurio ofrece insinuaciones, pistas, presagios y visiones interpretativas tentadoras. Pero el Augurio solo promete un camino predestinado, no uno corto, fácil o barato. Cuanto más precioso es el futuro buscado con este cantrip, más exigente tiende a ser el camino que traza.#!"
 COMMON_ARTS_FACE_FATE_PERK_EFFECT: "$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_face_fate_positive_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_face_fate_negative_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_soothsay_face_fate')].\n#flavor En esta, la mayor hazaña de Soothsay, la vidente pone las manos directamente sobre los hilos que componen el gran tapiz de Dán y los dobla a su voluntad, bendiciendo a un sujeto con buena fortuna o maldiciéndolo con funestos presagios. La expresión precisa de esta manipulación del destino es siempre difícil de predecir, pero las señales no pueden confundirse.#!"

 common_arts_trick_of_the_light_perk_name: "Truco de la Luz"
 common_arts_veiled_eyes_perk_name: "Ojos Velados"
 common_arts_dream_logic_perk_name: "Lógica Onírica"
 common_arts_veiled_mind_perk_name: "Mente Velada"
 common_arts_lost_in_the_mists_perk_name: "Perdido en las Brumas"

 COMMON_ARTS_TRICK_OF_THE_LIGHT_PERK_EFFECT: "$passive_cantrip_fae$ Aplica [GetModifier('cantrip_trick_of_the_light_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n#flavor Una sutil manipulación del Glamour para enturbiar las percepciones: el Truco de la Luz crea malentendidos y errores. Un pooka que monta una estafa de secuestro suena igual que la madre de la víctima por teléfono. Un eshu acosado por un cazador trastornado entra en un mercado y se confunde con la multitud. Sin suerte, una sidhe hace pasar una sola moneda de oro por 100 para poder comer esta noche.#!"
 COMMON_ARTS_VEILED_EYES_PERK_EFFECT: "$cantrip_hard_bunk$ Destruye un [artifact|E], con un límite de [rarity|E] basado en tu [fae_realm|E] de $fae_prop_realm$.\n[PODUnlocksCombatMove('POD_combat_move_fae_chicanery_veiled_eyes')].\n#flavor Donde el Truco de la Luz hace que el observador confunda una cosa con otra, los Ojos Velados usan las Brumas para que el objetivo del cantrip resulte instantáneamente olvidable. Un Kithain vestido con ropajes cortesanos puede atravesar una multitud de mortales sin ser notado, el ornamentado espadón de una troll cuelga libremente de su cadera pero se ignora cuando entra en un banco, y los enemigos del Fae siguen ajenos a las nubes de tormenta que ruedan por el cielo hacia su hogar. El objetivo no se vuelve físicamente invisible, simplemente no merece ser notado. Los changelings pueden crear aplicaciones maliciosas de los Ojos Velados, haciendo que carros desbocados o enemigos que se acercan pasen desapercibidos hasta que es demasiado tarde.#!"
 COMMON_ARTS_DREAM_LOGIC_PERK_EFFECT: "$cantrip_easy_bunk$ Aplica al objetivo [GetModifier('cantrip_dream_logic_modifier').GetNameWithTooltip].\n#flavor Las conexiones inconexas e ilógicas prosperan en el caos del Ensueño, y los changelings diestros en Chicanery aprovechan lo extraño de la lógica onírica para confundir y manipular. A medida que la mente del objetivo queda envuelta por el Glamour y las Brumas consiguientes, se desorienta y no cuestiona afirmaciones u órdenes que normalmente le resultarían poco sensatas. Los eshu encubiertos pasan mensajes y paquetes a través de mensajeros mortales confundidos. La troll cuidadora del zoo doma animales nuevos a los que nadie más puede acercarse con seguridad.#!"
 COMMON_ARTS_DREAM_LOGIC_PERK_REASON: "[GetPerk('common_arts_dream_logic_perk').GetName(GetPlayer)]: $VALUE|0+=$"
 COMMON_ARTS_VEILED_MIND_PERK_EFFECT: "$cantrip_standard_bunk$ Destruye una [relation|E] aleatoria del objetivo.\nMejora el [passive_cantrip|E] [GetPerk('common_arts_trick_of_the_light_perk').GetName(GetPlayer)] otorgando en su lugar [GetModifier('cantrip_veiled_mind_modifier').GetNameWithTooltip].\n#flavor Las leyendas y la mitología pintan fantásticas, y bien merecidas, escenas de hadas robando recuerdos a los mortales. Yendo más allá de la mera vista o el oído, el Fae envuelve el foco del cantrip con Glamour y las Brumas que lo acompañan para borrar temporalmente el foco del cantrip de la mente de todos. La amante que despreció a un Kithain puede ver a su familia mirándola con rostros vacíos al volver a casa por vacaciones, o el oponente del Fae olvida desenvainar su espada durante el duelo.#!"
 COMMON_ARTS_LOST_IN_THE_MISTS_PERK_EFFECT: "$cantrip_hard_bunk$ Cambia los [personality_traits|E] del objetivo.\n[PODUnlocksCombatMove('POD_combat_move_fae_chicanery_lost_in_mists')].\n#flavor ¿Qué es peor que no poder fiarte de tus sentidos, ser invisible o incluso ser olvidado? Los maestros de Chicanery emplean la manipulación definitiva de las Brumas para arrebatar la identidad de su objetivo. El foco de este cantrip no solo olvida quién es, sino que el Fae puede emplear su conocimiento de otros Reinos para hacerle creer que es algo completamente distinto. El rival de un nocker empieza a comportarse como un perro al presentar un nuevo invento. La vampira que aterroriza a una pandilla local se despierta sin recuerdo de su estado no-muerto y entra en pánico cuando sale fuera y la luz del sol le quema la piel. Un clurichaun hace creer a un mortal que es una nube de lluvia para crear al instante arte escénico.#!"

 common_arts_ensnare_perk_name: "Atrapar"
 common_arts_mooch_perk_name: "Gorrón"
 common_arts_effigy_perk_name: "Efigie"
 common_arts_gimmix_perk_name: "Gimmix"
 common_arts_smoke_and_mirrors_perk_name: "Humo y Espejos"

 COMMON_ARTS_ENSNARE_PERK_EFFECT: "$passive_cantrip_fae$ Aplica [GetModifier('cantrip_ensnare_modifier').GetNameWithTooltip] a los [knights|E] enemigos al inicio de una guerra.\n[PODUnlocksCombatMove('POD_combat_move_fae_legerdemain_ensnare')].\n#flavor Útil para huir de una víctima o dar alcance a alguien que debe dinero al personaje, el enredo hace que el objetivo se ralentice o quede inmóvil. Parece que los muebles saltan en su camino, los baches desinflan neumáticos y parten ejes, o el suelo se alza para desviar el agua que se precipita. Aunque no haya cerca una razón plausible para el obstáculo, los zarcillos de Glamour creados por este cantrip igualmente hacen tropezar, ralentizan y lastran al objetivo.#!"
 COMMON_ARTS_MOOCH_PERK_EFFECT: "$cantrip_exceptional_bunk$ Roba un [artifact|E].\n#flavor Gorrón ofrece a los changelings un método rápido y fácil de pagar una comida. Si tiene éxito, Gorrón transfiere al instante un objeto inanimado de la posesión del objetivo al Fae. El objeto puede aparecer en la mano del personaje, en su bolsillo o en su calcetín: en cualquier parte de su persona que desee.#!"
 COMMON_ARTS_EFFIGY_PERK_EFFECT: "Desbloquea varios [men_at_arms|E] de $POD_construct_maa$.\n$cantrip_standard_bunk$ Copia un [artifact|E] que poseas.\n#flavor Manipular el Glamour de forma lo bastante compleja para copiar algo lleva tiempo y paciencia para perfeccionarse, pero, una vez dominado, puede crear réplicas lo bastante buenas para engañar a un observador, al menos durante un tiempo. Una ladrona pooka puede hacer una buena copia del cuadro que accedió a robar y vender, pero que ahora quiere quedarse para su colección. El vendedor puerta a puerta redcap podría esculpir una réplica del pug que acaba de comerse para que la familia no note que falta su perro hasta que él se haya ido.#!"
 COMMON_ARTS_GIMMIX_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_fae_legerdemain_gimmix')].\n#flavor Los magos mortales pasan incontables horas montando elaborados trucos para convencer a otros de que pueden mover y controlar objetos con el poder de su mente. Al lanzar Gimmix, un Fae solo necesita gastar Glamour para mover y manipular cualquier cosa que pueda ver con una precisión y una fuerza considerables. Un caballero sidhe detiene una flecha a centímetros del pecho de su señor. El aparcacoches sluagh envía un carro conducido por un vampiro despeñándose por el borde del aparcamiento. Un cirujano redcap mantiene quieto a su «paciente» el tiempo suficiente para aplicar las ataduras. El nocker fuerza la cerradura de la puerta de su celda sin herramientas.#!"
 COMMON_ARTS_SMOKE_AND_MIRRORS_PERK_EFFECT: "Mejora el [passive_cantrip|E] [GetPerk('common_arts_ensnare_perk').GetName(GetPlayer)] otorgando en su lugar [GetModifier('cantrip_smoke_and_mirrors_modifier').GetNameWithTooltip].\n#flavor Los maestros de Legerdemain van más allá de copias paupérrimas o manipulaciones temporales y pueden conjurar ilusiones duraderas y convincentes con su Glamour. Un puente ruinoso y roto podría parecer lo bastante sólido para que lo cruce un carro, o el matón troll podría echarse atrás al ver al sátiro con toda una multitud de amigos furiosos (e ilusorios) a su espalda. El personaje podría incluso crear una fiesta entera con comida, invitados y música.#!"

 common_arts_willow_whispers_perk_name: "Susurros del Sauce"
 common_arts_eldritch_prime_perk_name: "Primal Arcano"
 common_arts_oakenshield_perk_name: "Escudo de Roble"
 common_arts_elder_form_perk_name: "Forma Ancestral"
 common_arts_dance_of_the_five_kings_perk_name: "Danza de los Cinco Reyes"

 COMMON_ARTS_WILLOW_WHISPERS_PERK_EFFECT: "#flavor Este útil retazo de magia permite al Fae hablar con el mundo y oír sus respuestas. Puede usar los Susurros del Sauce para hablar con cualquier planta, animal, objeto o elemento natural: cualquier piedra, cualquier anillo con joyas, cualquier hoja reluciente, cualquier bestia normalmente incapaz de hablar.#!"
 COMMON_ARTS_ELDRITCH_PRIME_PERK_EFFECT: "$cantrip_standard_bunk$ Manipula el clima en una zona según tu $fae_scene_realm$ y tu $fae_nature_realm$.\nDesbloquea varios [men_at_arms|E] elementales.\n#flavor Este cantrip permite al Fae conjurar manifestaciones de los elementos de tierra, agua, madera, fuego o aire. Esto aparece en la forma más natural posible: el agua cae del cielo como lluvia o brota de la tierra como un pequeño manantial, por ejemplo. Rocas surgen del suelo con un estruendo. Plantas crecen del suelo con una rapidez antinatural. Estas manifestaciones pueden ocurrir, sin embargo, en lugares decididamente antinaturales, como lluvia dentro de un edificio o ramas floridas que crecen de la cabeza de un profesor de matemáticas furioso como hermosas astas.#!"
 COMMON_ARTS_OAKENSHIELD_PERK_EFFECT: "$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_oakenshield_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_primal_oakenshield')].\n#flavor Este útil cantrip fortifica a su objetivo con una vaina elemental protectora. A pesar del nombre, no tiene por qué ser necesariamente una capa de corteza a modo de armadura; también podría volver la piel de una persona dura como el mármol o hacer que la superficie aparentemente sólida de una puerta salpique y se rehaga como agua al ser golpeada.#!"
 COMMON_ARTS_ELDER_FORM_PERK_EFFECT: "Opción de [shapeshift|EU]: Convertirte en un elemental.\n#flavor Este poderoso cantrip permite al Fae imbuir a alguien o algo con la esencia misma de uno de los elementos, transformándolo en una manifestación viva de poder elemental.#!"
 COMMON_ARTS_DANCE_OF_THE_FIVE_KINGS_PERK_EFFECT: "$unlock_forging_node$ Añade un [modifier|E] según el tipo de [artifact|E], con una fuerza basada en tu $fae_prop_realm$.\n[PODUnlocksCombatMove('POD_combat_move_fae_primal_dance_five_kings')].\n#flavor Este potente cantrip convierte al Fae en maestro de los cinco elementos. Ella ordena y las llamas, la tierra y el agua saltan a obedecer. Puede guiar cualquier manifestación elemental ya presente para atacar, sujetar, atrapar, abrir camino o simplemente remodelarse a su gusto.#!"

 common_arts_hopscotch_perk_name: "Rayuela"
 common_arts_quicksilver_perk_name: "Azogue"
 common_arts_portal_passage_perk_name: "Paso por Portal"
 common_arts_wind_runner_perk_name: "Corredor del Viento"
 common_arts_flicker_flash_perk_name: "Parpadeo Fugaz"

 COMMON_ARTS_HOPSCOTCH_PERK_EFFECT: "#flavor Este es el Arte de los saltos prodigiosos, que potencialmente permite al sujeto salvar edificios altos de un solo salto. La Rayuela mueve al sujeto hacia delante o hacia arriba según desee el lanzador, y el Glamour infundido en el salto asegura que el aterrizaje no cause daño nunca, por muy lejos que caiga el objetivo antes del impacto. Algunos pooka insisten en que la Rayuela fue en su día su propia magia especial, robada por un embaucador eshu en la época de las leyendas y extendida al resto de los Fae... pero ¿quién cree a un pooka?#!"
 COMMON_ARTS_QUICKSILVER_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_fae_wayfare_quicksilver')].\n#flavor Con una sonrisa veloz, el sujeto de este cantrip se mueve como un borrón literal, dejando tras de sí trazos de Glamour gastado como líneas de velocidad, rayos chisporroteantes u otro tipo de descarga visual. Una pandilla de piskies da alcance a un carro desbocado que lleva un tesoro robado, quemando el camino a su paso. Un caballero sidhe estalla en un borrón de acero relampagueante y magia crepitante.#!"
 COMMON_ARTS_PORTAL_PASSAGE_PERK_EFFECT: "$cantrip_standard_bunk$ Teletransporta tu ejército.\n#flavor Este es el Arte de entrar o salir cuando y donde el Fae desee. El Paso por Portal crea una puerta lo bastante grande para que el Fae pase, que atraviesa cualquier barrera de hasta 3 metros de grosor; que sea un muro de ladrillo, un seto o el lateral de una furgoneta en marcha no supone diferencia para el cantrip. Las puertas creadas con Paso por Portal son únicas del Fae que las lanza y pueden ser reconocidas e identificadas por quienes lo conocen.#!"
 COMMON_ARTS_WIND_RUNNER_PERK_EFFECT: "#flavor Corredor del Viento es el glorioso Arte del vuelo. La mayoría cree que esta magia concreta fue trocada o robada a los inanimae o a algún espíritu similar de los vientos, aunque los Nunnehi murmuran que originalmente era suya, aprendida a gran coste de la terrible bestia conocida como wendigo.#!"
 COMMON_ARTS_FLICKER_FLASH_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_fae_wayfare_flicker_flash')].\n#flavor Este temible cantrip permite a su maestra ir adonde le plazca y nadie puede cerrarle el paso. Es el maravilloso truco de los hechiceros que se esfuman y de los ladrones jactanciosos, y permite al sujeto desaparecer y reaparecer donde desee.#!"

 common_arts_dream_walk_perk_name: "Paseo Onírico"
 common_arts_dream_craft_perk_name: "Artesanía Onírica"
 common_arts_dream_portal_perk_name: "Portal Onírico"
 common_arts_manifest_perk_name: "Manifestar"
 common_arts_dream_puppet_perk_name: "Marioneta Onírica"

 COMMON_ARTS_DREAM_WALK_PERK_EFFECT: "$cantrip_easy_bunk$ Da al objetivo #V 20#! de [static_stress|E].\n#flavor Tras aprender el primer cantrip de la Oniromancia, un Fae puede forjar un puente entre el Ensueño y la mente de su objetivo, lo que le permite entrar de lleno en un sueño. Debe elegir como objetivo a alguien o algo dormido que conozca bien o pueda ver. El personaje entra entonces por completo en los sueños del objetivo y desaparece del mundo mundano. El sujeto puede darse cuenta o no de que el Fae es algo más que una parte de su sueño, pero recordará el sueño al despertar.#!"
 COMMON_ARTS_DREAM_CRAFT_PERK_EFFECT: "$cantrip_standard_bunk$ Reduce el [stress|E] del objetivo en #V 30#!.\nMejora el [cantrip|E] [GetPerk('common_arts_dream_walk_perk').GetName(GetPlayer)] otorgando en su lugar #V 40#! de [static_stress|E].\n#flavor Algunos sueños permanecen con los soñadores incluso tras despertar y tiñen el ánimo y el tono de su día. Ya no limitado a entrar en el sueño del objetivo y a tener interacciones mínimas, el Oniromante puede ejercer control sobre el paisaje onírico para crear apacibles cuadros en la mente del durmiente o infligir terrores espantosos que la atormentarán al día siguiente.#!"
 COMMON_ARTS_DREAM_PORTAL_PERK_EFFECT: "$cantrip_easy_bunk$ Teletranspórtate a tu siguiente destino de [travel|E].\n#flavor Aprovechando la fina división entre la mente que sueña y el propio Ensueño, un Oniromante puede superponer ambos para crear un portal. El sueño del sujeto se convierte en una estación de paso dentro del Ensueño que conecta la ubicación del lanzador con la del durmiente.#!"
 COMMON_ARTS_MANIFEST_PERK_EFFECT: "Desbloquea varios [men_at_arms|E] de $POD_chimera_maa$ si eres un $POD_splat_changeling$.\n#flavor Bajo el mando del Oniromante, elementos de un sueño pueden cobrar vida en el mundo despierto como quimeras. Mantiene un control limitado sobre las quimeras sintientes durante un tiempo tras despertar el soñador, pero sin el Glamour del lanzador, la quimera se desvanecerá cuando el sueño se olvide. Al volcar su voluntad en la manifestación, el Oniromante puede incluso traer a la quimera al mundo mundano, aunque se desvanecerá aún más rápido.#!"
 COMMON_ARTS_DREAM_PUPPET_PERK_EFFECT: "$cantrip_exceptional_bunk$ [imprison|E] al objetivo.\n#flavor Algunos estudiantes de Oniromancia abandonan el camino cuando queda clara la culminación de su formación. Ya no limitado a la manipulación de los sueños o a su intersección con el Ensueño, un Oniromante maestro puede invadir la mente de un objetivo y asumir el control de su cuerpo mientras duerme.#!"

 common_arts_sparrows_and_nightingales_perk_name: "Gorriones y Ruiseñores"
 common_arts_worms_and_giants_perk_name: "Gusanos y Gigantes"
 common_arts_thousandskins_perk_name: "Mil Pieles"
 common_arts_beastskin_perk_name: "Piel de Bestia"
 common_arts_chimeric_exultation_perk_name: "Exaltación Quimérica"

 COMMON_ARTS_SPARROWS_AND_NIGHTINGALES_PERK_EFFECT: "Opción de [shapeshift|EU]: Cambia tu edad aparente y tus rasgos faciales.\n#flavor Este cantrip permite al Fae separar a su objetivo de sí mismo, cambiando un rasgo fundamental por alguna alternativa plausible. Podría convertir a un hombre en mujer, a un pelirrojo en moreno, hacer alta a una mujer baja o blanco a un hombre negro.#!"
 COMMON_ARTS_WORMS_AND_GIANTS_PERK_EFFECT: "Opción de [shapeshift|EU]: Cambia al tamaño de [GetTrait('dwarf').GetName(GetPlayer)] o [GetTrait('giant').GetName(GetPlayer)].\nPuedes montar animales pequeños, como gatos domésticos, como monturas.\n[PODUnlocksCombatMove('POD_combat_move_fae_metamorphosis_giants_stature')].\n#flavor Este legendario cantrip puede usarse para encoger o agrandar a su sujeto, produciendo ratones de montar para los caballeros errantes pooka, encogiendo a los boggans para que hagan un trabajo de detalle verdaderamente fino en los zapatos, convirtiendo cuchillos de mesa en espadas improvisadas o castigando a mortales groseros con una verdadera vista de gusano del Mundo Otoñal.#!"
 COMMON_ARTS_THOUSANDSKINS_PERK_EFFECT: "Opción de [shapeshift|EU]: Convertirte en un animal.\n#flavor Este poderoso cantrip permite al Fae transformar a una persona u objeto en un animal. Los individuos así transformados conservan su propia mente e instintos, pero ganan los rasgos físicos, las capacidades y limitaciones sensoriales y las capacidades especiales del animal en que se hayan convertido. Los objetos transformados en animales ganan la mente de un miembro «típico» de la especie en que se hayan convertido mientras dure la transformación, de modo que un conejo será asustadizo, un león cazará, etc. Los humanos y fae transformados conservan el poder del habla, pero solo para quienes pueden percibir la realidad quimérica.#!"
 COMMON_ARTS_BEASTSKIN_PERK_EFFECT: "$cantrip_easy_bunk$ Da al objetivo un [modifier|E] que aumenta una única [skill|E] en #P 5#!.\n[PODUnlocksCombatMove('POD_combat_move_fae_metamorphosis_beastskin_talons')].\n#flavor Esta práctica bendición o maldición refina Metamorphosis para permitir transformaciones parciales. A un mortal grosero podría concedérsele cara de cerdo, mientras que un noble corcel podría ganar alas de cisne y una plebeya acorralada podría concederse feroces garras o colmillos envenenados con los que luchar.#!"
 COMMON_ARTS_CHIMERIC_EXULTATION_PERK_EFFECT: "Opción de [shapeshift|EU]: Convertirte en una bestia mítica.\n#flavor Este fantástico cantrip permite al Fae transformar a su objetivo en una criatura de leyenda, o incluso en una bestia fantástica de su propia imaginación, mezclando los rasgos y naturalezas de diferentes criaturas. Dragones, mantícoras, grifos, el kraken de la leyenda: cualquiera puede ser invocado por la Exaltación Quimérica.#!"

 common_arts_kindle_perk_name: "Encender"
 common_arts_illuminate_perk_name: "Iluminar"
 common_arts_purity_perk_name: "Pureza"
 common_arts_engulf_perk_name: "Engullir"
 common_arts_phoenix_song_perk_name: "Canción del Fénix"

 COMMON_ARTS_KINDLE_PERK_EFFECT: "$passive_cantrip_fae$ Aplica [GetModifier('cantrip_kindle_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n#flavor Cantrip básico pero eminentemente útil, Encender calienta el foco del Glamour lo bastante para causar molestia pero no daño. Encender puede cocinar comida, ayudar a prender un fuego o hacer que alguien sude y parezca febril.#!"
 COMMON_ARTS_ILLUMINATE_PERK_EFFECT: "$passive_cantrip_fae$ Aplica [GetModifier('cantrip_illuminate_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_pyretics_illuminate')].\n#flavor Incontables mitos de creación de los mortales comienzan con una luz divina que atraviesa la oscuridad. Los changelings diestros en Pyretics empuñan el poder que late en el corazón de tales historias. Al canalizar Glamour en este cantrip, el Kithain puede crear una luz que disipa la oscuridad, la ilusión y los subterfugios mezquinos.#!"
 COMMON_ARTS_PURITY_PERK_EFFECT: "$cantrip_standard_bunk$ Cura cualquier enfermedad.\n$cantrip_standard_bunk$ Cura [EmptyScope.ScriptValue('POD_pyretics_interaction_superficial_heal_value')] de [POD_superficial_damage_with_box|E].\n$cantrip_standard_bunk$ Cura [EmptyScope.ScriptValue('POD_pyretics_interaction_aggravated_heal_value')] de [POD_aggravated_damage_with_box|E].\n#flavor Ninguna impureza resiste el calor suficiente, pero el estudiante de Pyretics puede quemar los contaminantes con un fuego quimérico que no daña ni consume al objetivo. Purificar hace seguros para el consumo el agua y la comida, puede destruir infecciones o venenos e incluso curar temporalmente enfermedades. Al combinar el cantrip con el Reino Fae, el lanzador puede incluso quemar maldiciones y efectos de otros cantrips.#!"
 COMMON_ARTS_ENGULF_PERK_EFFECT: "$passive_cantrip_fae$ Inflige [EmptyScope.ScriptValue('common_arts_engulf_perk_damage')] de [POD_aggravated_damage_with_box|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_pyretics_engulf')].\n#flavor A veces un Fae simplemente necesita prender fuego a algo. Cantrip sencillo y poderoso, Engullir hace que el objetivo combustione. El Fae puede elegir si el foco de la magia arde con la llama o permanece protegido de la guirnalda de fuego mágico.#!"
 COMMON_ARTS_PHOENIX_SONG_PERK_EFFECT: "$cantrip_hard_bunk$ Aplica al objetivo [GetModifier('extra_life_1_modifier').GetNameWithTooltip].\n#flavor El fénix arde hasta las cenizas y, de la destrucción de las llamas, resurge nuevo. El dominio de Pyretics otorga al Fae el poder de la vida nueva frente a la destrucción. Tras invocar el Fae la Canción del Fénix, si el receptor de esta bendición muere o es destruido de otro modo, arderá hasta las cenizas y resurgirá nuevo poco después.#!"

 common_arts_howling_gale_perk_name: "Vendaval Aullante"
 common_arts_electric_gremlins_perk_name: "Gremlins Eléctricos"
 common_arts_hurricane_speed_perk_name: "Velocidad de Huracán"
 common_arts_storm_shroud_perk_name: "Mortaja de Tormenta"
 common_arts_lord_of_levin_perk_name: "Señor del Rayo"

 COMMON_ARTS_HOWLING_GALE_PERK_EFFECT: "$cantrip_standard_bunk$ Aplica al objetivo [GetModifier('cantrip_howling_gale_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_skycraft_howling_gale')].\n#flavor El Fae puede invocar un viento poderoso y usarlo para acelerar el movimiento propio o el de sus aliados, para confundir a sus enemigos o simplemente para soplar como desee.#!"
 COMMON_ARTS_ELECTRIC_GREMLINS_PERK_EFFECT: "$cantrip_hard_bunk$ Aplica a un [artifact|E] objetivo [GetModifier('cantrip_electric_gremlins_modifier').GetNameWithTooltip].\n#flavor Este cantrip invoca una hueste de gremlins, quimeras menores que causan estragos en los objetos complejos. Los gremlins son diminutas criaturas verdeamarillentas dotadas de la capacidad de esconderse detrás de cualquier cosa, por pequeña que sea, cuando se las observa directamente, y cuya presencia perturba los objetos complejos.#!"
 COMMON_ARTS_HURRICANE_SPEED_PERK_EFFECT: "Mejora el [cantrip|E] [GetPerk('common_arts_howling_gale_perk').GetName(GetPlayer)] otorgando en su lugar [GetModifier('cantrip_hurricane_speed_modifier').GetNameWithTooltip].\n#flavor El Fae invoca la esencia misma del viento y la infunde en una persona o cosa. Quienes están imbuidos de Velocidad de Huracán no solo ganan la presteza del viento, sino también su perspectiva expansiva, lo que acelera sus reflejos y reacciones. Los objetos se funden con el viento y recorren distancias enormes una vez impulsados al movimiento.#!"
 COMMON_ARTS_STORM_SHROUD_PERK_EFFECT: "$passive_cantrip_fae$ Inflige [EmptyScope.ScriptValue('common_arts_storm_shroud_perk_damage')] de [POD_superficial_damage_with_box|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n#flavor El Fae hace descender la esencia del rayo sobre el objetivo de este cantrip y lo rodea de un nimbo vacilante de destrucción eléctrica.#!"
 COMMON_ARTS_LORD_OF_LEVIN_PERK_EFFECT: "$cantrip_hard_bunk$ Inflige [EmptyScope.ScriptValue('common_arts_lord_of_levin_perk_interaction_damage')] de [POD_aggravated_damage_with_box|E] al objetivo.\nMejora el [passive_cantrip|E] [GetPerk('common_arts_howling_gale_perk').GetName(GetPlayer)] infligiendo en su lugar [EmptyScope.ScriptValue('common_arts_lord_of_levin_perk_damage')] de [POD_superficial_damage_with_box|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_skycraft_lord_of_levin')].\n#flavor Un maestro de Skycraft domina los mismos fuegos del cielo y puede enviar el rayo para abatir a sus enemigos. Este cantrip normalmente solo funciona a cielo abierto, pero un Fae que se haya encantado con la Mortaja de Tormenta puede usar Señor del Rayo para arrojar rayos desde la punta de los dedos mientras persista la Mortaja de Tormenta.#!"