 FANCY_PERK_EFFECT: "Como [character_interaction|E], permite que el objetivo desarrolle una opinión positiva de ti.\n#F Crea una buena primera impresión, dando a alguien la noción de que le gusta un objeto específico que nunca antes ha visto.#!"
 YEARN_PERK_EFFECT: "Como [character_interaction|E], permite que los vecinos del objetivo intenten robar sus artefactos.\n#F Cambia el hilo de pensamiento de una persona, llevándola a la conclusión de que desea a cierta persona, lugar o cosa en algún momento del futuro.#!"
 COVET_PERK_EFFECT: "Como [character_interaction|E], permite que el objetivo anhele ser tu amigo o amante.\n#F Provoca obsesión, llevando a una persona a suspirar por alguien o algo en lo que anteriormente podría no haber tenido interés.#!"
 CRAVE_PERK_EFFECT: "Como [character_interaction|E], permite que los vecinos del objetivo intenten reclamar sus títulos.\n#F Crea un deseo irracional por el objeto de afecto, llevando al sujeto a hacer casi cualquier cosa para obtenerlo, salvo ponerse en peligro a sí mismo.#!"
 NEED_PERK_EFFECT: "Como [character_interaction|E], permite que el objetivo inicie un [single_combat_duel|E] contra cualquier personaje que posea su título o artefacto reclamado, o un personaje que comparta el mismo amigo, amante o consorte que él.\n#F La forma más aterradora y menos sutil de esta Arte; a este nivel se crea una necesidad efímera, pero tan fuerte que cualquiera, incluso el sujeto o el objeto de sus deseos, puede ser sacrificado para satisfacerla.#!"
 COLD_SHOCK_PERK_EFFECT: "Como [character_interaction|E], permite que los cortesanos e invitados del objetivo desarrollen una opinión negativa de ellos.\n#F Enfría una habitación o a una persona, rara vez causando daño real, pero haciendo que quienes lo sientan se sientan incómodos por la temperatura.#!"
 GELID_RIME_PERK_EFFECT: "Otorga [GetModifier('gelid_rime_perk_commander_modifier').GetNameWithTooltip] [modifier|E] a los [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E].\nOtorga [GetModifier('gelid_rime_perk_knight_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante unos [single_combat_duel_plural|E].\n#F Cubre una pequeña zona con una fina capa de hielo, impidiendo que cualquier persona sobre la que se coloque pueda mover esa parte de su cuerpo.#!"
 FROST_FACSIMILE_PERK_EFFECT: "$unlock_forging_node$ Añade un [modifier|E] basado en el tipo del [artifact|E], además de aumentar la [durability|E] máxima\n#F Produce un objeto de hielo sólido, que puede ser frágil como el hielo común o, si está bien elaborado, tan fuerte como el metal.#!"
 CRYSTA_PRISON_PERK_EFFECT: "Como [character_interaction|E], permite [imprison|E] al objetivo.\n#F Encierra algo en un bloque sólido de hielo, enfriándolo rápidamente y posiblemente asfixiándolo si es un ser vivo.#!"
 COLDHEART_PERK_EFFECT: "Como [character_interaction|E], permite que el objetivo caiga en [GetTrait('torpor').GetName( GetPlayer )].\n#F Congela completamente a un sujeto, haciendo que se vuelva frío, pierda el conocimiento y sea propenso a hacerse añicos; despertar de este estado es difícil, especialmente antes de que termine el tiempo del conjuro.#!"
 HIDDEN_FORM_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_invisible_modifier' ).GetNameWithTooltip|L].\n#F Camufla a un sujeto, haciendo que sea casi imposible que sea detectado por la vista.#!"
 IMPERSONATE_PERK_EFFECT: "Bono al Cambio de Forma [character_interaction|E] para cambiar de apariencia.\nComo [character_interaction|E], permite copiar la apariencia de tu objetivo.\n#F Cambia de forma a otra persona, incluyendo el enmascarar el linaje propio por otro.#!"
 GO_ASK_ALICE_PERK_EFFECT: "Desbloquea las opciones de Cambio de Forma [GetModifier( 'POD_shapeshift_form_giant_modifier' ).GetNameWithTooltip|L] y [GetModifier( 'POD_shapeshift_form_lilliputian_modifier' ).GetNameWithTooltip|L].\n#F Permite cambios de tamaño, haciendo que las personas y los objetos sean más grandes que la vida misma o fantásticamente pequeños.#!"
 MERLINS_LESSONS_PERK_EFFECT: "Permite el Cambio de Forma a varias formas animales.\n#F Un cambio de forma más dramático que el de Suplantar, permitiendo transformarse en un animal; al combinarse con «Ve a preguntarle a Alice», ese animal puede ser de cualquier tamaño.#!"
 MYTHIC_TRANSFORMATION_PERK_EFFECT: "Permite el Cambio de Forma a varias formas del Pretérito, como [GetModifier( 'POD_shapeshift_form_celestial_dragon_modifier' ).GetNameWithTooltip|L].\n#F Transforma a las hadas en una criatura que no es de este mundo, con todos sus poderes, siempre que el usuario pueda resistir el opresivo yermo de la Banality que conlleva ese poder.#!"
 WIL_O_THE_WISP_PERK_EFFECT: "#F Produce una bola de llama falsa que guía a su creador por un camino indirecto hacia un objeto o persona deseada.#!"
 WILLOW_LIGHT_PERK_EFFECT: "#F Crea un brillo intenso durante varias horas, haciendo que un objeto sea luminoso y difícil de ignorar.#!"
 PROMETHEUS_FIST_PERK_EFFECT: "Otorga [GetModifier('prometheus_fist_perk_commander_modifier').GetNameWithTooltip] [modifier|E] a los [commanders|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E].\nOtorga [GetModifier('prometheus_fist_perk_knight_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E] o a ti mismo durante unos [single_combat_duel_plural|E].\n#F Rodea un objeto con una llama que no quema el objeto en sí, pero cualquier cosa que el objeto toque se prenderá fuego como es normal.#!"
 BURN_AND_BOIL_PERK_EFFECT: "#F Prende fuego a un objeto de una manera que no daña al objeto en sí; este fuego consumirá el objeto y no puede ser controlado, igual que el fuego estándar.#!"
 STAR_BODY_PERK_EFFECT: "#F Transforma un objeto en puro fuego, sin causar cambios en sus propiedades intrínsecas, pero otorgándole el brillo y la posibilidad de encender objetos con fuego.#!"
 
