 FUDDLE_PERK_EFFECT: "Como [character_interaction|E], permite otorgar [GetModifier( 'fuddle_perk_positive_modifier' ).GetNameWithTooltip|L] o [GetModifier( 'fuddle_perk_negative_modifier' ).GetNameWithTooltip|L] al objetivo.\n#F Altera una percepción existente de forma sutil, como cambiar un sonido fuerte por otro, o fingir invisibilidad bajo una cobertura de sombras.#!"
 VEILED_EYES_PERK_EFFECT: "Como [character_interaction|E], permite obtener una tregua del objetivo o detener todas las conjuras dirigidas a él.\n#F Hace que un objeto pase desapercibido; aunque no sea verdaderamente invisible, los observadores no pensarán en notar el objeto.#!"
 FUGUE_PERK_EFFECT: "Como [character_interaction|E], permite que un secreto conocido no pueda ser expuesto por el objetivo, eliminar una pretensión del objetivo sobre ti, o gastar un anzuelo que el objetivo posea sobre ti.\nComo [character_interaction|E], permite que un rasgo criminal vuelva a ser un secreto.\n#F Elimina un recuerdo de la mente de una persona, o hace que un momento específico destaque y oculte otros.#!"
 HAUNTED_HEART_PERK_EFFECT: "Desbloquea la [scheme|E] [GetScheme('PODsoul_bridge').GetTypeName].\n#F Evoca algún tipo de emoción fantasmagórica en un sujeto, al reavivar una emoción sentida en el pasado.#!"
 CAPTIVE_HEART_PERK_EFFECT: "Otorga [GetModifier('captive_heart_perk_commander_modifier').GetNameWithTooltip] [modifier|E] a los [commanders|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E].\nOtorga [GetModifier('captive_heart_perk_knight_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E] o a ti mismo durante los [single_combat_duel_plural|E].\n#F Usa la emoción como una fuerza de control, haciendo que una persona crea cosas sobre sí misma que podrían no haber sido ciertas nunca.#!"
 GIMMIX_PERK_EFFECT: "#F Produce un simple movimiento telequinético, permitiendo mover un objeto a distancia, pero sin poder manipularlo con precisión.#!"
 ART_ENSNARE_PERK_EFFECT: "#F Mueve un objeto demasiado pesado para ser movido por Gimmix, o un objeto flexible para intentar vincular a un individuo.#!"
 EFFIGY_PERK_EFFECT: "Como [character_interaction|E], permite copiar el artefacto del objetivo.\n#F Produce una copia de carbón de un objeto dado, aunque las propiedades de ese objeto bajo la superficie no logran copiarse.#!"
 MOOCH_PERK_EFFECT: "Como [character_interaction|E], permite robar el artefacto del objetivo.\n#F Un objeto que es visible para el lanzador se transfiere inmediatamente a la posesión del usuario.#!"
 PHANTOM_SHADOWS_PERK_EFFECT: "Como [character_interaction|E], permite crear un clon del objetivo.\n#F Produce una quimera temporal que aparece con la forma de lo que el usuario desee, con cierta limitación.#!"
 WILLOW_WHISPER_PERK_EFFECT: "Desbloquea la decisión $seek_aid_of_the_spirits_decision$ [decision|E].\n#F Habla con los objetos, tengan o no boca para hablar o mente para pensar.#!"
 ELDRITCH_PRIME_PERK_EFFECT: "Como [character_interaction|E], permite lanzar un conjuro elemental de clima en el área objetivo.\nPermite detener o fortalecer peligros naturales.\n#F Crea una manifestación pura de uno de los elementos más básicos: fuego, agua, tierra, aire o madera.#!"
 OAKENSHIELD_PERK_EFFECT: "Como [character_interaction|E], permite invocar [GetModifier('oakenshield_modifier').GetNameWithTooltip] sobre el área objetivo.\n#F Recubre un objeto con corteza protectora, ayudándole a protegerse contra el daño.#!"
 HEATHE_BALM_HOLLY_STRIKE_PERK_EFFECT: "Como [character_interaction|E], permite curar o herir a un objetivo, o romper el artefacto del objetivo en pedazos.\n#F Repara un objeto o cura a una persona (Bálsamo de brezo); daña un objeto o persona en la misma medida en que podría ser curada (Golpe de acebo).#!"
 ELDER_FORM_PERK_EFFECT: "Permite el Cambio de Forma hacia los elementos.\n#F Toma la forma de un objeto elemental, obteniendo sus propiedades si existe, o simplemente su apariencia si no es así.#!"
 OMEN_PERK_EFFECT: "Como [character_interaction|E], te permite conocer todos los secretos y conjuras del objetivo.\n#F La forma más básica de profecía; este encantamiento otorga un destello momentáneo de intuición sobre el destino final de un objeto.#!"
 FAIR_IS_FOUL_FOUL_IS_FAIR_PERK_EFFECT: "Como [character_interaction|E], te permite gastar experiencia de Arte común para que el objetivo gane o pierda oro y prestigio.\n#F Interviene ligeramente en los asuntos del destino, otorgando un poco de buena suerte a un aliado o una pizca de mala suerte al enemigo.#!"
 TATTLETALE_PERK_EFFECT: "Como [character_interaction|E], te permite otorgar [GetModifier('artifact_tattletale_modifier').GetNameWithTooltip] al artefacto del objetivo.\n#F Mira el mundo desde la perspectiva de un objeto que el usuario ha encontrado en el pasado, o cuyo Nombre Verdadero conoce.#!"
 AUGURY_PERK_EFFECT: "Como [character_interaction|E], te permite tener una probabilidad de que ocurra un evento aleatorio para el objetivo.\n#F Determina un evento que ocurrirá en el futuro; pase lo que pase, ese evento se producirá, aunque la verdad sobre cómo ocurre pueda ser terriblemente inesperada.#!"
 FATE_FIRE_PERK_EFFECT: "Como [character_interaction|E], te permite aumentar el progreso de una conjura.\n#F Un encantamiento extraño y complicado; este acelera los estragos del karma, haciendo que lo que sea que le aguarda a alguien, ya sea bueno o malo, le alcance mucho más rápido de lo esperado.#!"
 HOPSCOTCH_PERK_EFFECT: "#F Produce un salto imposible, ya sea hacia arriba o hacia abajo, sin sufrir daño por la colisión resultante.#!"
 QUICKSILVER_PERK_EFFECT: "#F Permite que un objeto se mueva a una velocidad increíblemente rápida.#!"
 PORTAL_PASSAGE_PERK_EFFECT: "#F Crea una apertura temporal a través de cualquier barrera, permitiendo atravesarla.#!"
 WIND_RUNNER_PERK_EFFECT: "#F Permite que un objetivo vuele, elevándose al cielo como si tuviera alas.#!"
 FLICKER_FLASH_PERK_EFFECT: "Como [character_interaction|E], te permite teletransportar tu ejército a la ubicación del objetivo, o teletransportarte a tu próximo destino cuando viajas.\n#F Desaparece instantáneamente y reaparece en otro lugar del mundo, o en el [UmbraGlossary('dreaming')].#!"

