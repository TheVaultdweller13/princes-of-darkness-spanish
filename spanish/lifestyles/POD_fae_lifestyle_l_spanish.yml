 STONESKIN_PERK_EFFECT: "#F Recubre un objeto con piedra protectora, ayudándole a protegerse contra el daño.#!"
 IRONARM_PERK_EFFECT: "Otorga [GetModifier('ironarm_perk_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E] o a ti mismo durante [single_combat_duel_plural|E].\n#F Otorga fuerza adicional a un sujeto, dándole la capacidad de mover piedras pesadas.#!"
 ART_STASIS_PERK_EFFECT: "Otorga [GetModifier('stasis_perk_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu adversario durante [single_combat_duel_plural|E].\n#F Ralentiza a un objetivo, haciendo que apenas pueda moverse.#!"
 QUAKE_PERK_EFFECT: "Inflige a cada gobernante del bando contrario [GetModifier('quake_perk_modifier').GetNameWithTooltip] al unirse a una [war|E].\n#F Parte la tierra, dañando a personas y cosas en la zona.#!"
 AURA_PERCEPTION_PERK_EFFECT: "#F Aprende diversas cualidades de una persona, como su estado emocional y su honestidad, a partir de su aura.#!"
 HOLD_PERK_EFFECT: "#F Detiene el movimiento de un objeto en vuelo antes de que alcance al lanzador.#!"
 ART_TEMPUS_FUGIT_PERK_EFFECT: "#F Permite que un objeto se mueva a una velocidad increíblemente rápida.#!"
 FRICTION_PERK_EFFECT: "Otorga [GetModifier('friction_perk_knight_positive_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E] o a ti mismo durante [single_combat_duel_plural|E].\nOtorga [GetModifier('friction_perk_knight_negative_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu adversario durante [single_combat_duel_plural|E].\n#F Calienta o enfría el agua dentro de un objeto, hasta el punto de hervirla o congelarla en hielo.#!"
 HEALING_WATERS_PERK_EFFECT: "Como una [character_interaction|E], te permite curar a un objetivo o reparar un artefacto objetivo.\n#F Repara un objeto o cura a una persona vertiendo agua sobre la herida.#!"
 FLAME_PERK_EFFECT: "#F Produce una llama de tamaño variable, desde una pequeña vela hasta una gran hoguera.#!"
 TORTURED_HEART_PERK_EFFECT: "#F Tira del corazón para editar la intensidad de una emoción existente.#!"
 ARES_FIST_PERK_EFFECT: "Otorga [GetModifier('ares_fist_perk_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E] o a ti mismo durante [single_combat_duel_plural|E].\n#F Canaliza fuerza divina para mejorar la destreza en el combate cuerpo a cuerpo.#!"
 STRINGS_OF_THE_SOUL_PERK_EFFECT: "Desbloquea el [GetScheme('PODsoul_bridge').GetTypeName] [scheme|E].\n#F Crea una emoción de la nada y la implanta en el objetivo.#!"
 INFERNO_PERK_EFFECT: "Como una [character_interaction|E], te permite otorgar [GetModifier('firebombs_modifier').GetNameWithTooltip] o [GetModifier('firespewer_modifier').GetNameWithTooltip] al objetivo.\n#F Permite el control total de un fuego, moldeándolo y doblegándolo a la voluntad del usuario.#!"
 MARATHON_PERK_EFFECT: "#F Reduce el tiempo de viaje, aunque paradójicamente el usuario no parece ir más rápido.#!"
 CONCEAL_CONFUSE_PERK_EFFECT: "Otorga [GetModifier('conceal_confuse_perk_knight_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu adversario durante [single_combat_duel_plural|E].\nOtorga [GetModifier('conceal_confuse_perk_commander_modifier').GetNameWithTooltip] [modifier|E] a los [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E].\nInflige a cada gobernante del bando contrario [GetModifier('conceal_confuse_perk_ruler_modifier').GetNameWithTooltip] al unirse a una [war|E].\n#F Produce una ilusión simple y estática que engaña a uno o dos sentidos.#!"
 FLIGHT_PERK_EFFECT: "#F Permite que un objetivo vuele, elevándose al cielo como si tuviera alas.#!"
 ILLUSION_PERK_EFFECT: "Como una [character_interaction|E], te permite hacer que la víctima gane [GetTrait('blind').GetName( GetPlayer )], [GetModifier('sensory_deprivation_deaf_modifier').GetNameWithTooltip]...\n#F Produce una ilusión más compleja capaz de engañar a muchos sentidos distintos.#!"
 ART_PHANTASM_PERK_EFFECT: "#F Produce ilusiones poderosas y vivas que actúan como Quimeras por derecho propio.#!"
 SOLARIUM_PERK_EFFECT: "Como [character_interaction|E], permite otorgar un modificador de planta al condado objetivo.\n#F Produce un cambio en el tamaño, la salud o la forma de una planta viva.#!"
 BABEL_PERK_EFFECT: "Coste de [buy_claim_interaction|E] y [buy_artifact_claim_interaction|E]: #P -50%#!\n#F Permite al usuario hablar con cualquier objeto como si poseyera inteligencia humana.#!"
 COALESCE_PERK_EFFECT: "Como [character_interaction|E], permite obtener oro del glamour.\n#F Transforma la materia vegetal en cualquier objeto deseado.#!"
 WEB_OF_LIFE_PERK_EFFECT: "#F Al examinar un aspecto de un ecosistema interconectado, se pueden determinar aspectos de su futuro.#!"
 MOLD_PERK_EFFECT: "$unlock_forging_node$ Sacrifica a un [prisoner|E] para mejorar el [artifact|E] basándose en los [traits|E] del sacrificio\n#F Transforma un tipo de materia viva en otro, sin matarla en el proceso.#!"
 
 ### Wu Tan ###

 game_concept_wu_tan_lifestyle: "Wu Tan"
 game_concept_wu_tan_lifestyle_desc: "Los Wu Tan son las Artes de las extrañas hadas orientales: los Hsien. Cada una se basa en uno de los elementos clásicos de Oriente."
 game_concept_metal_soul: "Alma de Metal"
 game_concept_metal_soul_desc: "El Alma de Metal contiene el Sentido de la Justicia, la honestidad y el juego limpio de una persona. Los jueces, vigilantes, activistas de los derechos humanos y defensores de los derechos civiles poseen almas de metal fuertes."
 game_concept_wood_soul: "Alma de Madera"
 game_concept_wood_soul_desc: "El Alma de Madera es responsable de la moralidad de una persona. Controla la lujuria y la Empatía. Todas las criaturas vivas poseen un alma de madera. Aunque la vida se alimenta de la vida, también abarca la compasión. Enfermeros, atletas, médicos y la mayoría de las madres poseen almas de madera fuertes."
 game_concept_water_soul: "Alma de Agua"
 game_concept_water_soul_desc: "El Alma de Agua abarca la fe de una persona en los demás y en los poderes del universo. También corresponde a la fidelidad y la confianza. Los capitalistas, los señores del crimen y aquellos que aman ser objeto de Lealtad y poder tienen grandes almas de agua, al igual que los verdaderamente fieles."
 game_concept_fire_soul: "Alma de Fuego"
 game_concept_fire_soul_desc: "El Alma de Fuego regula el sentido de la propiedad y la comprensión de las normas y códigos de conducta. Controla el sentido del deber y el afán por hacer cumplir las leyes de la sociedad. Policías e incluso funcionarios gubernamentales pueden poseer almas de Fuego fuertes."
 game_concept_earth_soul: "Alma de Tierra"
 game_concept_earth_soul_desc: "El Alma de Tierra de una criatura sintiente gobierna la sabiduría, la perspicacia, la comprensión y el sentido común. Gobierna la capacidad de tomar decisiones sabias. Líderes, sacerdotes y consejeros suelen tener poderosas Almas de Tierra."

