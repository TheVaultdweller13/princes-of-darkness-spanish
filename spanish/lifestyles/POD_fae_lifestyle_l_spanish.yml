 WYRD_PERK_EFFECT: "Otorga [GetModifier('wyrd_perk_commander_modifier').GetNameWithTooltip] [modifier|E] a los [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E].\nOtorga [GetModifier('wyrd_perk_knight_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante los [single_combat_duel_plural|E].\n#F Provoca que otro pierda la noción del orden temporal, siendo incapaz de distinguir qué eventos ocurrieron antes o después de otros.#!"
 BACKWARD_GLANCE_PERK_EFFECT: "#F Echa un vistazo a algo que ocurrió en el pasado, ayudando a recordar imágenes vistas anteriormente y proporcionando nuevas imágenes que no se vieron en su momento.#!"
 DREAM_TIME_PERK_EFFECT: "Como [character_interaction|E], permite dar un modificador de velocidad positivo o negativo al personaje o condado objetivo.\n#F Cambia la velocidad del tiempo en un área o para una persona, ya sea haciendo que transcurra mucho más rápido de lo normal o a un ritmo de tortuga.#!"
 PERMANENCE_PERK_EFFECT: "Como [character_interaction|E], permite renovar el modificador de cantrip del objetivo.\n#F Extiende la duración de un Arte lanzado por otro, permitiendo que dure sustancialmente más de lo que el resultado exigía originalmente.#!"
 REVERSA_OF_FORTUNE_PERK_EFFECT: "Como [character_interaction|E], te permite darte a ti mismo [GetModifier( 'reversa_of_fortune_perk_modifier' ).GetNameWithTooltip|L] durante #V 1#! día.\n#F Un Arte extremadamente complejo y costoso que permite al usuario revertir los últimos minutos y tomar nuevas decisiones.#!"
 FIND_SILVER_PATH_PERK_EFFECT: "#F Muestra la ubicación del Camino de Plata, el camino que guía a las hadas a través del [UmbraGlossary('dreaming')], y otorga información sobre quién o qué se encuentra actualmente en él.#!"
 DETERMINISM_PERK_EFFECT: "Probabilidad de encontrar eventos en la [umbra|E]: [grace_i]#P +100%#!\n#F Muestra lo que hay al otro lado de un Paso, un sendero misterioso del [UmbraGlossary('dreaming')] sobre el cual el espacio y el tiempo están fuertemente distorsionados.#!"
 THE_MERRY_DANCE_PERK_EFFECT: "Probabilidad de encontrar eventos en la [umbra|E]: [grace_i]#P +100%#!\n#F El Firchlis es una fuerza poderosa dentro de los Reinos Míticos. El Sueño está en constante cambio, y el Firchlis es una fuente clave de ese cambio. Las hadas expertas pueden, con concentración y preparación, influir en los cambios que el Firchlis trae consigo.#!"
 HOMESTEAD_PERK_EFFECT: "Desbloquea la construcción [GetBuilding('homestead_freehold_01').GetName].\n#F Fija un punto del [UmbraGlossary('dreaming')] para que, en lugar de cambiar constantemente según los caprichos del $glossary_wyld$, permanezca tal como el lanzador deseaba.#!"
 ANCHOR_PERK_EFFECT: "Tiempo de desbloqueo de construcción [building|E] en el [UmbraGlossary('dreaming')]: #P -50%#!\n#F Con este cantrip, un changeling puede «solidificar» el [UmbraGlossary('dreaming')] hasta cierto grado, lo que le permite establecer una fortaleza permanente dentro del Reino Mítico.#!"
 ATTUNEMENT_PERK_EFFECT: "Recibirás una notificación si alguien tiene la intención de asesinar a tus amigos o familiares.\nRecibirás una notificación si alguien tiene la intención de seducir a tus amantes o consortes.\nTu prisionero tendrá menos probabilidades de escapar de tu prisión.\n#F Vincula a un Kithain con una persona, lugar o cosa, haciendo que, pase lo que pase, el Kithain sea el primero en saberlo.#!"
 DREAM_RIDING_PERK_EFFECT: "Permite interactuar con personajes en la [UmbraGlossary('earth')] mientras permaneces en el [UmbraGlossary('dreaming')].\nComo [character_interaction|E], permite ganar opinión del objetivo.\n#F Este cantrip permite a un changeling interactuar con un sueño mortal mientras el Kithain está en el [UmbraGlossary('dreaming')]. No siempre es una decisión sabia, ya que las interacciones del Kithain pueden causar alteraciones extrañas en el propio sueño. Aunque la interacción es posible, el control real sobre el sueño no lo es.#!"
 DREAM_WEAVING_PERK_EFFECT: "#F Produce una quimera, similar al cantrip de Sombras Fantasmales, pero, mientras que esa quimera es temporal, esta es permanente, siempre y cuando nunca abandone el [UmbraGlossary('dreaming')].#!"
 SEEK_N_SPELL_PERK_EFFECT: "#F Ya sea que entiendas el lenguaje o no, o incluso si el contenido está bloqueado mágicamente, se vuelve posible leer cualquier texto.#!"
 RUNE_PERK_EFFECT: "$unlock_enhancing_node$ Añade un [modifier|E] basado en el tipo de [artifact|E]\n#F Inscribe una palabra de poder en un objeto, permitiendo que sea mucho más eficaz para una tarea específica.#!"
 RUNIC_CIRCLE_PERK_EFFECT: "Otorga el modificador [GetModifier('runic_circle_perk_modifier').GetNameWithTooltip] a cada cortesano, consejero, amigo y amante.\n#F Produce un círculo de palabras protectoras que proporciona resistencia contra las fuerzas sobrenaturales que intenten traspasar el círculo.#!"
 SAINING_PERK_EFFECT: "Como [character_interaction|E], puedes descubrir el nombre verdadero de otro personaje.\n#F Evoca el ritual del Nombre Verdadero que se utiliza cuando un Kithain atraviesa la Crisálida por primera vez, mostrando al usuario el Nombre Verdadero de ese individuo.#!"
 REWEAVING_PERK_EFFECT: "Como [character_interaction|E], permite editar los rasgos del objetivo.\n#F Una vez conocido el Nombre Verdadero, este cantrip permite al lanzador editar ese Nombre y, al hacerlo, edita los rasgos esenciales de lo que esa persona u objeto es.#!"
 PROTOCOL_PERK_EFFECT: "#F Convoca una Corte asegurada mágicamente, evitando que los plebeyos interrumpan el transcurso de la sesión.#!"
 DICTUM_PERK_EFFECT: "Como [character_interaction|E], te permite obtener un Anzuelo sobre el objetivo.\n#F Especifica una petición al sujeto del cantrip, la cual debe cumplir de la mejor manera posible, a menos que sea demasiado peligroso.#!"
 GRANDEUR_PERK_EFFECT: "Como [character_interaction|E], permite reclutar o [imprison|E] a un personaje sin tierras objetivo.\n#F Asume un manto de pura belleza y Gracia, haciendo que sea casi imposible que otros intenten contradecir tus deseos.#!"
 WEAVER_WARD_PERK_EFFECT: "Más probabilidades de [imprison|E] a [characters|E] tras un [siege|E] o [raid|E] exitoso.\nOtorga un artefacto al desterrar a un personaje sin tierras.\n#F Bloquea una puerta o un pasaje estrecho, haciendo que sea imposible que un grupo específico de objetos lo atraviese.#!"
 GEAS_BAN_PERK_EFFECT: "Desbloquea el Juramento [character_interaction|E], convirtiendo al objetivo en [GetTrait('oathbreaker').GetName( GetPlayer )] si lo incumple.\n#F Produce un Juramento, ya sea exigiendo que una persona cumpla una acción (Geas), o absteniéndose de realizar cierta acción (Prohibición); quienes rompan este Juramento sufrirán alguna maldición como consecuencia.#!"
 HARDEN_PERK_EFFECT: "#F Prepara una quimera salvaje convirtiéndola en una quimera artesanal, permitiendo que se le apliquen más Infusiones.#!"
 TOUGHEN_PERK_EFFECT: "#F Añade durabilidad a los materiales quiméricos, incluyendo a otros changelings, otorgando resistencia tanto al daño como al Deshacer de la Banidad.#!"
 FUBAR_GENERATION_PERK_EFFECT: "Permite crear un recipiente de Glamour.\n#F Crea y esclaviza un JYTI, una criatura quimérica que puede servir como batería de Glamour.#!"
 ANIMANTIS_PERK_EFFECT: "Permite fabricar un personaje [GetTrait('automaton').GetName( GetPlayer )].\nPuede reclutar [GetMaA('golems').GetName] como [men_at_arms|E].\n#F Produce un gólem, un sirviente mecánico que servirá al Nocker y le ayudará en su trabajo.#!"
 GILGUL_PERK_EFFECT: "Como una [character_interaction|E], permite editar libremente los rasgos mentales y físicos del [GetTrait('automaton').GetName( GetPlayer )] objetivo.\n#F Un encantamiento terriblemente peligroso que, si tiene éxito, añade pensamiento consciente a una quimera o animantis, y posiblemente incluso un alma verdadera.#!"
 AGEMOS_BLESSING_PERK_EFFECT: "#F Lee las emociones de toda una multitud a la vez, con el fin de determinar la mejor manera de entretenerlos.#!"
 FLICKERING_FIRELIGHT_PERK_EFFECT: "#F Moldea una pequeña ilusión quimérica en algo de lo que se habla en la historia, proporcionando elementos escénicos con los que contar el relato.#!"
 MURMUR_IN_THE_CROWD_PERK_EFFECT: "#F Infunde una emoción en la multitud, aumentando el atractivo de la historia del Eshu, además de proporcionarles un motivo para contarla.#!"
 STICKS_AND_STONES_PERK_EFFECT: "#F Convierte las palabras en un refugio temporal, protegiendo al narrador del daño, siempre que siga contando su relato sin pausa.#!"
 MOMENT_OF_TRUTH_PERK_EFFECT: "#F Produce una quimera temporal que aparece con la forma que el usuario desee, con cierta limitación.#!"

