 READ_METAL_SOUL_PERK_EFFECT: "#F Comunicarse con el [Glossary('Metal Soul','game_concept_metal_soul_desc')] de una persona te dirá si ha dicho la verdad o si ignora lo que es justo.#!"
 COMMUNE_WITH_METAL_PERK_EFFECT: "#F Al igual que otros objetos elementales, los de metal tienen sentidos y formas de comunicarse limitadas.#!"
 TIEH_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F El Alquimista puede hablar con Espíritus de Metal, siempre que pueda encontrarlos.#!"
 NURTURE_DIMINISH_METAL_SOUL_PERK_EFFECT: "#F Ampliar el [Glossary('Metal Soul','game_concept_metal_soul_desc')] puede hacer que una persona diga la verdad. Disminuirlo facilita la mentira.#!"
 INCREASE_DECREASE_METAL_ATTRIBUTES_PERK_EFFECT: "#F El Alquimista puede afectar la Percepción o la Destreza del objetivo.#!"
 TIEH_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F Invocar un Bote de Dragón asociado al Metal es útil cuando la Línea de Dragón que sigue ha sido cubierta por una vía férrea o si el nido de dragón al que se viaja o del que se sale está asociado al Metal o a la Justicia.#!"
 SUMMON_DISPEL_TIEH_SHEN_PERK_EFFECT: "Puede reclutar a [GetMaA('metal_elemental').GetName] como [men_at_arms|E].\n#F Un Alquimista de Metal puede invocar o disipar un espíritu de metal.#!"
 TIEH_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F El metal es quizás el segundo objeto que más fácilmente se puede envuelto y también es práctico.#!"
 METAL_FORM_PERK_EFFECT: "Desbloquear la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_metal_modifier' ).GetNameWithTooltip|L].\n#F Este es un I Chih común tanto para los Chu-ih-yu como para los Tanuki, que suelen ser marciales, y la defensa de una coraza de metal o el poder destructivo de un puño de metal es útil.#!"
 PATHS_OF_IRON_PERK_EFFECT: "#F Cables de cobre, conductos metálicos o vigas de acero de edificios... los Caminos del Metal son muchos, al menos en las ciudades.#!"
 TIEH_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Como [character_interaction|E], permite despertar el [Glossary('True Jade','game_concept_true_jade_desc')] para almacenar Chi.\n#F El Alquimista puede despertar el jade blanco.#!"
 MOVE_METAL_PERK_EFFECT: "#F Un truco muy útil para el guerrero cuya arma ha sido lanzada de su mano.#!"
 SHAPE_SUNDER_METAL_PERK_EFFECT: "#F Los grandes maestros de la Alquimia del Metal son artesanos destacados y crean espadas hermosas y otras armas.#!"
 SUMMON_DISPEL_METAL_PERK_EFFECT: "#F Cuando necesitas un arma y no te importa cuál sea, esta habilidad puede ser útil.#!"
 TIEH_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F A este nivel de poder, un Maestro puede hacer que el acero sea tan blando como el oro o el oro tan resistente como el acero.#!"
 TRANSMUTE_METAL_PERK_EFFECT: "Como [character_interaction|E], permite gastar Chi para obtener [gold|E].\n#F Con esta habilidad, el metal puede transformarse en otro metal completamente distinto.#!"
 READ_WOOD_SOUL_PERK_EFFECT: "#F Las [Concept('wood_soul','Wood Souls')|E] comunican el estado de salud de un ser, entre otras cosas.#!"
 COMMUNE_WITH_WOOD_PERK_EFFECT: "#F Como la mayoría de los elementos, la madera y sus correspondencias solo pueden proporcionar información limitada.#!"
 LIN_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F El Alquimista es capaz de hablar con Lin Shen, siempre que se manifiesten o que el hsien tenga la habilidad de atravesar el Muro.#!"
 NURTURE_DIMINISH_WOOD_SOUL_PERK_EFFECT: "#F Ampliar el alma puede crear lujuria, mientras que disminuirla puede causar impotencia.#!"
 INCREASE_DECREASE_WOOD_ATTRIBUTES_PERK_EFFECT: "#F El Alquimista puede aumentar o disminuir los atributos de Apariencia o Fuerza.#!"
 LIN_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F El Alquimista puede invocar un bote de dragón para viajar a lo largo de una Línea de Dragón desde un nido de dragón al siguiente.#!"
 SUMMON_DISPEL_LIN_SHEN_PERK_EFFECT: "Puede reclutar a [GetMaA('wood_elemental').GetName] como [men_at_arms|E].\n#F El Alquimista puede invocar y disipar Espíritus de Madera, lo que incluye espíritus de plantas, pero no animales.#!"
 LIN_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F El Alquimista puede ocultar un objeto regido por la Madera dentro de su propio cuerpo.#!"
 WOOD_FORM_PERK_EFFECT: "Desbloquear la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_wood_modifier' ).GetNameWithTooltip|L].\n#F El alquimista puede convertir todo o parte de su cuerpo en madera, permitiéndole recibir o distribuir más daño en el combate cuerpo a cuerpo.#!"
 PATHS_OF_WOOD_PERK_EFFECT: "#F Las finas redes de raíces, hongos y musgo crean un gran camino por el que el alquimista puede viajar.#!"
 LIN_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Como [character_interaction|E], permite despertar el [Glossary('True Jade','game_concept_true_jade_desc')] para almacenar Chi.\n#F El alquimista puede despertar el jade azul o verde.#!"
 MOVE_WOOD_PERK_EFFECT: "#F Este I Chih hace posible mover objetos de madera de una manera similar a la psicocinesis.#!"
 SHAPE_SUNDER_WOOD_PERK_EFFECT: "#F Los artesanos de la madera pueden usar esta habilidad para crear artesanías hermosas o destruir objetos de madera.#!"
 SUMMON_DISPEL_WOOD_PERK_EFFECT: "#F El shinma puede invocar o disipar la madera.#!"
 LIN_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F A este nivel, el roble podría hacerse tan blando como el pino o los pétalos de flores, o la hierba tan resistente como el roble con el mismo grosor.#!"
 TRANSMUTE_WOOD_PERK_EFFECT: "#F Transmutar una madera en otra puede tener una utilidad limitada, pero si el cuerpo humano está regido por este Elemento, uno podría transformar razonablemente un árbol en un humano.#!"
 READ_WATER_SOUL_PERK_EFFECT: "#F Comunicarse con el [water_soul|E] ayuda a evaluar la lealtad de una persona, su confianza, etc...#!"
 COMMUNE_WITH_WATER_PERK_EFFECT: "#F Todos los elementos físicos tienen límites en cuanto a la comunicación. El agua podría hablar sobre el sabor de alguien nadando en ella, su nivel de autoconfianza o si abandonó a la otra persona en el agua para que se ahogara por ser desleal.#!"
 SHUI_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F Con este I Chih, el alquimista puede hablar con Shui Shen.#!"
 NURTURE_DIMINISH_WATER_SOUL_PERK_EFFECT: "#F Los líderes astutos usan este efecto para crear lealtad en sus seguidores o para robar los seguidores de otros para sí mismos.#!"
 INCREASE_DECREASE_WATER_ATTRIBUTES_PERK_EFFECT: "#F Con estas invocaciones, el Alquimista puede bendecir o maldecir a un objetivo modificando su atributo de Manipulación o Resistencia.#!"
 SHUI_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F Un alquimista usaría Shui Tan para invocar un bote de dragón si la Línea de Dragón viaja a través del agua o el cielo.#!"
 SUMMON_DISPEL_SHUI_SHEN_PERK_EFFECT: "Puede reclutar a [GetMaA('water_elemental').GetName] como [men_at_arms|E].\n#F Con esta habilidad, un alquimista puede ejercer cierto control sobre Shui Shen.#!"
 SHUI_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F Esta parece una habilidad bastante improbable de usar con el Agua, pero podría ser muy útil en los efectos de cohorte, quizás envolviendo cantimploras.#!"
 WATER_FORM_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_water_modifier' ).GetNameWithTooltip|L].\n#F En la discusión sobre el Wu Tan se afirma que las formas elementales siguen las leyes de la física.#!"
 PATHS_OF_WATER_PERK_EFFECT: "#F Moverse a través del agua es, obviamente, algo muy práctico y, para aquellos que puedan soportar lo desagradable que resulta, hay alcantarillas por todas partes en las ciudades.#!"
 SHUI_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Como [character_interaction|E], permite despertar el [Glossary('True Jade','game_concept_true_jade_desc')] para almacenar Chi.\n#F El Alquimista puede despertar el jade negro.#!"
 MOVE_WATER_PERK_EFFECT: "#F Con este I Chih, el Alquimista podría provocar una avalancha, detener el flujo de sangre en un objetivo o elevar el agua de una piscina para salvar a una víctima de ahogamiento y, si eso fuera demasiado tarde, podría extraer el agua de los pulmones de una víctima.#!"
 SHAPE_SUNDER_WATER_PERK_EFFECT: "#F Partir un mar me viene a la mente. También se podría hacer que el agua se extienda para agarrar a alguien y ahogarlo. La escultura en hielo es sencilla con este I Chih.#!"
 SUMMON_DISPEL_WATER_PERK_EFFECT: "#F Expulsar el aire de los pulmones de alguien puede ser devastador, y extraerlo de la habitación detrás de alguien puede causar un efecto de vacío que puede resultar muy útil.#!"
 SHUI_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F Con este efecto, se podría dar al agua dulce el punto de congelación del agua salada, o bien un gas nocivo podría volverse no más dañino que el vapor de agua.#!"
 TRANSMUTE_WATER_PERK_EFFECT: "#F Ser capaz de transformar el agua o la solución salina en sangre es muy útil cuando no hay suministros de emergencia cerca.#!"
 READ_FIRE_SOUL_PERK_EFFECT: "#F Al comulgar con un [Glossary('Fire Soul','game_concept_fire_soul_desc')], el shinma puede determinar los significados ocultos de la etiqueta y sus infracciones.#!"
 COMMUNE_WITH_FIRE_PERK_EFFECT: "#F El fuego en sí mismo es un elemento difícil de comulgar, ya que no permanece mucho tiempo en un mismo lugar. Los rayos, los incendios forestales... tienen una vida corta.#!"
 HOU_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F El alquimista puede hablar con cualquier Hou Shen que encuentre.#!"
 NURTURE_DIMINISH_FIRE_SOUL_PERK_EFFECT: "#F Al disminuir la [Glossary('Fire Soul','game_concept_fire_soul_desc')], el Nyan puede hacer que una persona sea más susceptible a sus avances, mientras que el Chu Jung puede aumentar las [Concept('fire_soul','Fire Souls')|E] de sus cortes para crear un efecto muy similar al primer nivel de Soberano.#!"
 INCREASE_DECREASE_FIRE_ATTRIBUTES_PERK_EFFECT: "#F Al aumentar su Carisma y su Astucia, el Alquimista puede volverse tan popular y rápido como los grandes actores de artes marciales o, al disminuir ambos, hacer que su objetivo sea tan socialmente inepto que nunca recupere su prestigio ante su corte.#!"
 HOU_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F Con este I Chih, el alquimista puede convocar un Bote Dragón para viajar por Líneas de Dragón de Luz o Magma.#!"
 SUMMON_DISPEL_HOU_SHEN_PERK_EFFECT: "Puede reclutar a [GetMaA('fire_elemental').GetName] como [men_at_arms|E].\n#F Como su nombre indica, el Alquimista puede disipar o convocar a un elemental de Fuego.#!"
 HOU_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F Desafortunadamente, es casi imposible para un Alquimista de Fuego usar esta habilidad sin un efecto mixto. Además, ninguno de los Cohortes del Fuego es particularmente bueno almacenando fuego. La Tecnología, como los teléfonos móviles, los ordenadores o las linternas, tiende a requerir tanto alquimia de Fuego como de Metal para ser afectada, y esto causa sus propias dificultades, ya que el Fuego es adversario del Metal.#!"
 FIRE_FORM_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_fire_modifier' ).GetNameWithTooltip|L].\n#F Las reglas generales para esta habilidad dicen que el fuego debe obedecer las leyes de la física... que necesita combustible.#!"
 PATHS_OF_FIRE_PERK_EFFECT: "#F Aunque a primera vista esto parezca relativamente inútil (¿quién necesita viajar a través del fuego excepto en un incendio?), a medida que la electricidad y la fibra óptica se extienden por todo el Reino Medio, también lo hacen los caminos del Fuego.#!"
 HOU_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Como [character_interaction|E], permite despertar [Glossary('True Jade','game_concept_true_jade_desc')] para almacenar Chi.\n#F Con esta habilidad, el Alquimista de Fuego puede despertar el Jade Rojo.#!"
 MOVE_FIRE_PERK_EFFECT: "Ya no recibes daño por fuego.\n#F Aunque esta habilidad pueda parecer limitada a la pirocinesis al principio, a este nivel se incluye la capacidad de doblegar la luz, lo que permite efectos como la invisibilidad o incluso la creación de hologramas e ilusiones que solo implican la vista.#!"
 SHAPE_SUNDER_FIRE_PERK_EFFECT: "#F Combinada con la Alquimia de Metal, uno podría manipular objetos tecnológicos.#!"
 SUMMON_DISPEL_FIRE_PERK_EFFECT: "Hiere a [knights|E] y [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante unos [single_combat_duel_plural|E], si son vampiros (u otros sobrenaturales que teman al sol).\nOtorga [GetModifier('summon_dispel_fire_perk_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante unos [single_combat_duel_plural|E].\n#F Aunque el Alquimista no puede controlar de dónde viene el fuego, ser capaz de llamar al fuego desde el cielo o traer luz, o incluso luz solar donde antes no la había, tiene sus ventajas.#!"
 HOU_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F Una persona con inclinaciones científicas sabe que la electricidad se rige por el Fuego y que el electromagnetismo es la fuerza real.#!"
 TRANSMUTE_FIRE_PERK_EFFECT: "#F De Luz a Fuego. De Electricidad a Luz. De Luz a Calor. De Magma a Luz. Todo esto es posible.#!"
 READ_EARTH_SOUL_PERK_EFFECT: "#F La gente suele decir más o menos de lo que sabe sobre un tema. Reflexionar sobre el [Glossary('Earth Soul','game_concept_earth_soul_desc')] de una persona puede revelarlo.#!"
 COMMUNE_WITH_EARTH_PERK_EFFECT: "#F El alquimista puede hablar con los objetos de Tierra o Piedra, etc... pero los objetos inanimados no poseen todos los sentidos que tienen los humanos.#!"
 DI_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F El Alquimista puede hablar con Di Shen.#!"
 NURTURE_DIMINISH_EARTH_SOUL_PERK_EFFECT: "#F Aumentar el [Glossary('Earth Soul','game_concept_earth_soul_desc')] de una persona le ayudará a tomar decisiones sabias, mientras que disminuirlo hará que tomar decisiones acertadas sea más difícil.#!"
 INCREASE_DECREASE_EARTH_ATTRIBUTES_PERK_EFFECT: "#F El Alquimista puede aumentar o disminuir el atributo de Inteligencia de su objetivo.#!"
 DI_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F El Alquimista puede convocar transporte a lo largo de una Línea de Dragón que pase por la Tierra o las montañas.#!"
 SUMMON_DISPEL_DI_SHEN_PERK_EFFECT: "Puede reclutar a [GetMaA('earth_elemental').GetName] como [men_at_arms|E].\n#F El Alquimista puede convocar y comandar a Di Shen.#!"
 DI_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F El Alquimista puede ocultar un objeto regido por la Tierra dentro de su propio cuerpo.#!"
 EARTH_FORM_PERK_EFFECT: "Desbloquea la opción de Cambio de Forma [GetModifier( 'POD_shapeshift_form_earth_modifier' ).GetNameWithTooltip|L].\n#F El Alquimista puede cambiar temporalmente todo o parte de su cuerpo a Tierra.#!"
 PATHS_OF_EARTH_PERK_EFFECT: "#F El Alquimista puede viajar a través de cualquiera de los elementos asociados con la Tierra.#!"
 DI_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Como [character_interaction|E], permite despertar [Glossary('True Jade','game_concept_true_jade_desc')] para almacenar Chi.\n#F El Alquimista puede despertar el Jade Amarillo.#!"
 MOVE_EARTH_PERK_EFFECT: "#F El Alquimista puede mover objetos vinculados a la Tierra mediante la psicocinesis.#!"
 SHAPE_SUNDER_EARTH_PERK_EFFECT: "#F Aunque este poder puede tener muchas aplicaciones creativas, también puede ser utilizado por un Komuko enfurecido para crear terremotos, mientras que los benevolentes pueden crear nuevos pasos a través de las montañas.#!"
 SUMMON_DISPEL_EARTH_PERK_EFFECT: "#F Para esos momentos en los que necesitas ese diamante brillante en la bóveda.#!"
 DI_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F Con este I Chih, la piedra puede volverse tan maleable como la arcilla y los diamantes tan quebradizos como el talco.#!"
 TRANSMUTE_EARTH_PERK_EFFECT: "Como [character_interaction|E], permite gastar Chi para ganar [prestige|E].\n#F Con este efecto, un juguetón Hanuman puede convertir un puñado de guijarros en gemas... hasta que la magia se desvanece y el destinatario se da cuenta de que ha sido engañado.#!"
 ART_SHAPECHANGE_PERK_EFFECT: "Permite el Cambio de Forma en varias formas animales.\n#F Alterando el rostro, el sexo, la raza o la especie.#!"
 VISAGE_OF_DEAD_PERK_EFFECT: "#F Este efecto Yin permite a los hsien matar eficazmente sus cuerpos durante un periodo de tiempo.#!"
 AXIS_OF_TIME_PERK_EFFECT: "#F Los Hsien pueden disminuir el dominio del tiempo sobre ellos, acelerando su propio movimiento a través del tiempo.#!"
 THE_MUTABLE_FURIES_PERK_EFFECT: "#F Los hsien pueden manipular sus valores de Chi.#!"
 THE_TYPHOONS_EYE_PERK_EFFECT: "#F El T'ai Chi otorga al shinma el poder de atravesar las tormentas ileso.#!"
 THE_BENEVOLENT_HAND_OF_JADE_PERK_EFFECT: "#F Este I Chih hace que lo improbable sea probable...#!"
 BACKSIDE_OF_THE_MONKEY_KING_PERK_EFFECT: "#F Este I Chih hace que lo probable sea improbable...#!"
 FORTIFY_THE_WALL_PERK_EFFECT: "Desbloquea la opción Manipular la Muralla en el panel [umbra|E].\n#F El poseedor de la llave puede fortalecer temporalmente la Muralla de un lugar.#!"
 UNLOCK_THE_JADE_PORTAL_PERK_EFFECT: "#F Para desbloquear la Muralla y viajar más allá de ella.#!"