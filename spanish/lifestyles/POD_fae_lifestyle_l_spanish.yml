l_spanish:
 game_concept_realm_lifestyle: "Reino"
 game_concept_realm_lifestyle_desc: "Los seis aspectos del mundo con los que los kithain tienen afinidades, los cuales se aplican directamente a quién o qué puedes afectar. Sin conocer los señoríos adecuados, un kithain es incapaz de afectar nada. Los señoríos son una parte necesaria para lanzar un [cantrip|E]."
 
 realm_lifestyle_name: "Reino"
 realm_lifestyle_desc: "Centrarse en los aspectos del mundo con los que los kithain tienen afinidades."
 realm_lifestyle_highlight_desc: "Debido a tu Glamour, ganas un #P [GetPlayer.MakeScope.ScriptValue('glamour_lifestyle_xp_mult')|%0]#! más de [experience|E] en este Estilo de vida."
 monthly_realm_lifestyle_xp_gain_mult: "[experience|E] mensual de Señorío de [lifestyle|E]"
 
 realm_actor_focus: "Enfoque en Actor"
 realm_actor_focus_modifier: "[GetFocus('realm_actor_focus').GetName]"
 realm_actor_focus_desc: "El Actor es el señorío conectado con todos los seres mundanos, con una correlación directa con cuánto los conoces."
 realm_actor_focus_effect_desc: "Centrarse en Actor otorga:"
 
 realm_fae_focus: "Enfoque en hadas"
 realm_fae_focus_modifier: "[GetFocus('realm_fae_focus').GetName]"
 realm_fae_focus_desc: "Fae trata con otros seres del [UmbraGlossary('dreaming')]. Afectar a otros Changelings, a los Nobles Sidhe, Adhene, Quimeras, o incluso controlar la propia magia Changeling, todo cae bajo el reino de Fae."
 realm_fae_focus_effect_desc: "Centrarse en hadas otorga:"
 
 realm_prop_focus: "Enfoque en Objeto"
 realm_prop_focus_modifier: "[GetFocus('realm_prop_focus').GetName]"
 realm_prop_focus_desc: "El Objeto es el control y la manipulación de todos los objetos creados. Cuanto más complicado sea el dispositivo, más maestría del señorío del Objeto se requerirá."
 realm_prop_focus_effect_desc: "Centrarse en Objeto otorga:"
 
 realm_nature_focus: "Enfoque en la naturaleza"
 realm_nature_focus_modifier: "[GetFocus('realm_nature_focus').GetName]"
 realm_nature_focus_desc: "Naturaleza es el control de las plantas, la tierra y las bestias. Cualquier cosa no tocada por la creación se presta a ser controlada por el reino de la Naturaleza."
 realm_nature_focus_effect_desc: "Centrarse en la naturaleza otorga:"
 
 realm_scene_focus: "Enfoque en la escena"
 realm_scene_focus_modifier: "[GetFocus('realm_scene_focus').GetName]"
 realm_scene_focus_desc: "Escena es el control del espacio. Cuanto más domines el reino de Escena, mayor será el área o más objetivos (en conjunción con otros reinos) podrás afectar."
 realm_scene_focus_effect_desc: "Centrarse en la escena otorga:"
 
 realm_time_focus: "Enfoque en el tiempo"
 realm_time_focus_modifier: "[GetFocus('realm_time_focus').GetName]"
 realm_time_focus_desc: "Tiempo es el control de cuándo ocurrirán tus cantrips o cuánto durarán. La maestría del Tiempo dicta la duración que pueden tener tus hechizos o cuánto tiempo puedes establecer un \"activador\" sobre ellos."
 realm_time_focus_effect_desc: "Centrarse en el tiempo otorga:"
 
