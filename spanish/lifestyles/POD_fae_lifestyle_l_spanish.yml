 REALM_ACTOR_1_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a un [friend|E], un [lover|E], un [courtier|E], un [direct_vassal|E], un miembro de la casa, a un personaje sobre el que tengas un [title_claim|E] o un [strong_hook|E] fuerte, o a un personaje cuyo [secret|E] criminal conozcas.\nAdemás, el personaje no debe tener ninguna mala relación, [war|E] o [truce|E] contigo, ni estar prisionero por ti."
 REALM_ACTOR_2_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a un [friend|E], un [lover|E], un [courtier|E], un [guest|E], un [vassal|E], un [liege|E], un miembro de la dinastía, a un personaje sobre el que tengas un [title_claim|E] o un [hook|E], o a un personaje cuyo [secret|E] conozcas.\nAdemás, el personaje no debe tener ninguna mala relación, [war|E] o [truce|E] contigo, ni estar prisionero por ti."
 REALM_ACTOR_3_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a un personaje con cualquier buena relación, un [courtier|E], un [guest|E], un [vassal|E], un [liege|E], un miembro de la dinastía, un [ally|E], a un personaje sobre el que tengas una pretensión o un [hook|E], o a un personaje cuyo [secret|E] conozcas.\nAdemás, el personaje no debe tener ninguna mala relación o [war|E] contigo."
 REALM_ACTOR_4_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a cualquier personaje, siempre que no sea un [rival|E] o esté en [war|E]."
 REALM_ACTOR_5_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a cualquier personaje, incluso a un [rival|E] o durante una [war|E]."
 REALM_FAE_1_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a sobrenaturales menores o mortales con poderes menores."
 REALM_FAE_2_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a los changelings."
 REALM_FAE_3_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a las hadas."
 REALM_FAE_4_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a la mayoría de los sobrenaturales o mortales con poderes poderosos."
 REALM_FAE_5_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] incluso al sobrenatural más raro."
 REALM_PROP_1_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a artefactos misceláneos comunes o de obra maestra del tribunal."
 REALM_PROP_2_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a artefactos comunes o de obra maestra."
 REALM_PROP_3_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a artefactos famosos o ilustres que no sean únicos."
 REALM_PROP_4_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a artefactos famosos únicos."
 REALM_PROP_5_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a artefactos ilustres únicos."
 REALM_NATURE_1_PERK_EFFECT: "Puede lanzar [cantrips|E] sobre materiales orgánicos sin vida."
 REALM_NATURE_2_PERK_EFFECT: "Puede lanzar [cantrips|E] sobre material vegetal orgánico vivo."
 REALM_NATURE_3_PERK_EFFECT: "Puede lanzar [cantrips|E] sobre Animales vivos que carezcan de sentido."
 REALM_NATURE_4_PERK_EFFECT: "Puede lanzar [cantrips|E] sobre fenómenos naturales."
 REALM_NATURE_5_PERK_EFFECT: "Puede lanzar [cantrips|E] sobre elementos naturales en su forma pura."
 REALM_SCENE_1_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a un personaje que se encuentre aproximadamente a un pequeño Señorío de distancia (por ejemplo: de norte a sur Gales).\nPuede lanzar [cantrips|E] de área a escala de condado."
 REALM_SCENE_2_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a un personaje que se encuentre aproximadamente a un Señorío de distancia (ejemplo: de norte a sur en Irlanda).\nPuedes lanzar [cantrips|E] de área a escala de ducado."
 REALM_SCENE_3_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a un personaje que se encuentre aproximadamente a un gran Señorío de distancia (ejemplo: de norte a sur en Francia).\nPuedes lanzar [cantrips|E] de área a escala de reino."
 REALM_SCENE_4_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a un personaje que se encuentre aproximadamente a un Señorío masivo de distancia (ejemplo: de izquierda a derecha en el Sacro Imperio Romano Germánico).\nPuedes lanzar [cantrips|E] de área a escala de imperio."
 REALM_SCENE_5_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] a cualquier personaje del mapa.\nPuedes lanzar [cantrips|E] de área a escala global."
 REALM_TIME_1_PERK_EFFECT: "Los modificadores de [cantrip|E] ahora duran #V 1#! año en lugar de #V 4#! meses.\nReduce el tiempo de reutilización de [cantrip|E] a 3/4."
 REALM_TIME_2_PERK_EFFECT: "Los modificadores de [cantrip|E] ahora duran #V 2#! años en lugar de #V 1#! año.\nReduce el tiempo de reutilización de [cantrip|E] a la mitad."
 REALM_TIME_3_PERK_EFFECT: "Los modificadores de [cantrip|E] ahora duran #V 5#! años en lugar de #V 2#! años.\nReduce el tiempo de reutilización de [cantrip|E] a 1/4."
 REALM_TIME_4_PERK_EFFECT: "Los modificadores de [cantrip|E] ahora duran #V 10#! años en lugar de #V 5#! años.\nReduce el tiempo de reutilización de [cantrip|E] a una unidad."
 REALM_TIME_5_PERK_EFFECT: "Los modificadores de [cantrip|E] ahora son permanentes.\nSin tiempo de reutilización para [cantrip|E]."
 
