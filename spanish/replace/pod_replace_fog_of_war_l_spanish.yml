l_spanish:
 # Resultados aleatorios
 RANDOM_LIST_EFFECT_ENTRY_CHANCE: "[GuiScope.AddScope( 'value', MakeScopeValue( '(CFixedPoint)$CHANCE|2q$' ) ).Custom( 'PODRandomOutcome' )]:"
 RANDOM_LIST_EFFECT_ENTRY_DESC_CHANCE: "[GuiScope.AddScope( 'value', MakeScopeValue( '(CFixedPoint)$CHANCE|2q$' ) ).Custom( 'PODRandomOutcome' )] #F – $DESC$:#!"
 CHARACTER_AGE_VALUE: "[Character.Custom('PODCharacterAge')]"
 SKILL_ITEM_VALUE: "[GuiScope.SetRoot(Character.MakeScope).AddScope('value',MakeScopeValue(IntToFixedPoint(SkillItem.GetValue))).Custom('PODSkill')]"
 CHARACTER_PROWESS: "[GuiScope.SetRoot(Character.MakeScope).AddScope('value',MakeScopeValue(IntToFixedPoint(Character.GetProwess))).Custom('PODSkill')]"
 CHARACTER_PROWESS_TOOLTIP: "[Select_CString( GetScriptedGui('POD_show_character_skills').IsShown(GuiScope.SetRoot(Character.MakeScope).End), Character.GetProwessBreakdown, GuiScope.SetRoot(Character.MakeScope).AddScope('value',MakeScopeValue(IntToFixedPoint(Character.GetProwess))).Custom('PODSkillTooltip') )]"
 #RANDOM_LIST_EFFECT_ENTRY_CHANCE: "$CHANCE|0$%:"
 #RANDOM_LIST_EFFECT_ENTRY_DESC_CHANCE: "$CHANCE|0$% #F – $DESC$:#!"

 # Habilidades de personaje
 # TODO: hacer macros para esto
 # TODO: desglose de valores diferente para proeza
 SKILL_ITEM_TOOLTIP: "[Select_CString( GetScriptedGui('POD_show_character_skills').IsShown(GuiScope.SetRoot(Character.MakeScope).End), Concatenate3(SkillItem.GetSkillBreakdownTooltip,'\n\n#S Efectos:#!\n',SkillItem.GetSkillEffects), GuiScope.SetRoot(Character.MakeScope).AddScope('value',MakeScopeValue(IntToFixedPoint(SkillItem.GetValue))).Custom('PODSkillTooltip') )]"
 #SKILL_ITEM_TOOLTIP: "[SkillItem.GetSkillBreakdownTooltip]\n\n#S Efectos:#!\n[SkillItem.GetSkillEffects]"