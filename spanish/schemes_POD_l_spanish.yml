 PODbloodbond_desc: "¡Vincularé con sangre a [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]!"
 PODbloodbond_desc_general: "El $PODbloodbond$ es un [hostile_scheme|E] para obtener un anzuelo o reforzar un débil [Glossary('Blood Bond','game_concept_bloodbond_desc')] hasta convertirlo en un anzuelo fuerte. Es un [secret_scheme|E] basado en la [intrigue|E], que puede reclutar [agents|E]. Tu objetivo puede aceptar el Vínculo de Sangre sin resistencia, dependiendo de si eres su señor, su doctrina de fe sobre los Juramentos de Sangre y de si confía en ti.\n\n #X A diferencia de una conjura normal, la probabilidad de éxito que aparece no es relevante. Sin embargo, el poder de la conjura sí afecta a la rapidez con la que se puede completar. Una vez finalizada la conjura, un duelo combinado de intriga y destreza determinará el éxito. #!"
