 PODentrance: "Embeleso"
 PODentrance_action: "Entrada"
 POD_entrance_interaction: "Entrada #weak (Conjura)#!"
 POD_entrance_interaction_desc: "Mediante la $pod_discipline$ de Presencia, invoca la sangre para entrar en trance a un ser y hacer que le agrades." 
 PODentrance_desc: "«¡Mediante el trance, haré que [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] me quiera!»"
 PODentrance_desc_general: "El $PODentrance$ es un [personal_scheme|E] que tiene como objetivo hacer que el objetivo te agrade. Se pone a disposición mediante la $pod_discipline$ de [GetTrait('presence').GetName( GetNullCharacter )] [GetPerk('entrancement_perk').GetName(GetNullCharacter)] [perk|E]. \n\n #X A diferencia de una conjura normal, la probabilidad de éxito de la conjura indicada no es relevante. Una vez completada la conjura, un duelo de diplomacia determinará el éxito. #! \n\nLas probabilidades de éxito aumentan con [GetPerk('majesty_perk').GetName(GetNullCharacter)], [GetTrait('presenceadvanced').GetName(GetNullCharacter)] y [GetPerk('ironclad_command_perk').GetName(GetNullCharacter)].  \n\nSi el defensor posee [GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)], [GetPerk('fortify_the_inner_facade_perk').GetName(GetNullCharacter)], o ha lanzado el hechizo de Hechicería de Sangre «Canción de Júpiter», las probabilidades disminuyen." 
 scheme_interaction_tt_PODentrance_approved: "[GetScheme('PODentrance').GetTypeName] [recipient.GetFirstName]. \nEsto terminará con un duelo de diplomacia.\nSi tiene éxito, la víctima aumentará su opinión sobre ti."
 PODENTRANCE_SUCCESS_DESC: "¡La [opinion|E] que [TARGET_CHARACTER.GetShortUINamePossessive] tiene de ti aumentará!"
 PODentrance_my_learning: "Tu Aprendizaje: $VALUE|=+0$"
 PODentrance_my_diplomacy: "Tu Diplomacia: $VALUE|=+0$"
 PODentrance_my_rival: "Tu Víctima: $VALUE|=+0$"
 
 PODmesmerize: "Hipnotizar"
 PODmesmerize_action: "Dominación"
 POD_mesmerize_interaction: "Hipnotizar #weak (Conjura)#!"
 POD_mesmerize_interaction_desc: "Mediante la $pod_discipline$ de Dominación, invoca la sangre para obligar a un ser a seguir tus órdenes."  
 PODmesmerize_desc: "«¡Mediante la Dominación, conseguiré un anzuelo sobre [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] que me permitirá darle diversas órdenes!»"
 PODmesmerize_desc_general: "$PODmesmerize$ es un [personal_scheme|E] que tiene como objetivo forzar a un ser a seguir tus órdenes. Se pone a disposición mediante la $pod_discipline$ de [GetTrait('dominate').GetName( GetNullCharacter )] [GetPerk('mesmerize_perk').GetName(GetNullCharacter)] [perk|E]. \n\n #X A diferencia de una conjura normal, la probabilidad de éxito que aparece no es relevante. Tras completar la conjura, un duelo de Administración determinará el éxito. #! \n\nVampiros con una [Glossary('Generación','game_concept_vampgeneration_desc')] inferior a la del atacante son inmunes. También lo son los vampiros que han alcanzado [golconda|E]. \n\nLos personajes con personalidades sumisas son más fáciles de mesmerizar. Los vampiros con una [Glossary('Generación','game_concept_vampgeneration_desc')] inferior a la de su oponente tendrán ventaja. La mayoría de los mortales tienen pocas defensas contra este poder. Las probabilidades de éxito también aumentan con [GetPerk('rationalize_perk').GetName(GetNullCharacter)], [GetTrait('dominateadvanced').GetName(GetNullCharacter)] y [GetPerk('will_conquers_perk').GetName(GetNullCharacter)]. \n\n[mesmerize_defenses|E]"
 scheme_interaction_tt_POD_mesmerize_approved: "[GetScheme('PODmesmerize').GetTypeName] a [recipient.GetFirstName] para que te preste un servicio.\nEsto terminará con un duelo de Administración."
 PODmesmerize_SUCCESS_DESC: "¡Obtendrás un anzuelo sobre [TARGET_CHARACTER.GetShortUIName]!"
 PODmesmerize_my_stewardship: "Tu Administración: $VALUE|=+0$"
 PODmesmerize_my_rival: "Tu Víctima: $VALUE|=+0$"
 
 PODsummon: "Convocar"
 POD_summon: "Convocar"
 PODsummon_action: "Convocar"
 POD_summon_interaction: "Invocar #weak (Conjura)#!"
 POD_summon_interaction_desc: "A través de la $pod_discipline$ de Presencia, invoca la sangre para convocar a un ser a tu corte."  
 PODsummon_desc: "Mediante el uso de tu presencia mística, [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] será convocado a tu corte."
 PODsummon_desc_general: "El $PODsummon$ es un [personal_scheme|E] que tiene como objetivo atraer a otros personajes a tu corte. Esta conjura se basa principalmente en tu [diplomacy|E], no es un [secret_scheme_single|E] y no utiliza [agents|E]. Se pone a disposición mediante el [perk|E] [GetPerk('summon_perk').GetName(GetNullCharacter)] de la $pod_discipline$ de [GetTrait('presence').GetName( GetNullCharacter )]. \n\n #X A diferencia de una conjura normal, la probabilidad de éxito que aparece no es relevante. Al comenzar la conjura, un duelo basado en el promedio de Diplomacia e Intriga determinará el éxito. El éxito permitirá que la conjura progrese y tiene la posibilidad de costar un punto de sangre por mes. El fracaso terminará la conjura y no te permitirá intentar convocar al objetivo durante 10 años. También existe la posibilidad de un fallo o éxito crítico. Un éxito crítico reducirá a la mitad el tiempo que tarda tu objetivo en llegar, mientras que un fallo crítico no te permitirá intentar convocar al objetivo durante 50 años.#! \n\nLas probabilidades de éxito aumentan con [GetPerk('majesty_perk').GetName(GetNullCharacter)], [GetTrait('presenceadvanced').GetName(GetNullCharacter)] y [GetPerk('ironclad_command_perk').GetName(GetNullCharacter)].  \n\nSi el defensor tiene [GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)], [GetPerk('fortify_the_inner_facade_perk').GetName(GetNullCharacter)], o ha lanzado el hechizo de Hechicería de Sangre «Canción de Júpiter», las probabilidades disminuyen. \n\nSi el objetivo sirve a otro Señor o es su invitado, la resistencia a la conjura personal de su Señor aumentará el tiempo que tarda en ser convocado."
 scheme_interaction_tt_PODsummon_approved: "Convocar a [recipient.GetFirstName].\nEsto comenzará con un duelo entre el promedio de tu Diplomacia e Intriga frente al promedio de Diplomacia e Intriga de [recipient.GetHerHis]."
 PODSUMMON_SUCCESS_DESC: "¡[TARGET_CHARACTER.GetShortUIName] será convocado ante tu presencia!"
 PODsummon_my_diplomacy: "Tu Diplomacia: $VALUE|=+0$"
 PODsummon_my_rival: "Tu Víctima: $VALUE|=+0$"
 PODsummon_monthly_notification_t: "Posible gasto de sangre para mantener la convocatoria"

