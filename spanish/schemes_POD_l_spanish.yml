 diablerize: "Diablerizar"
 diablerize_action: "Diablerizar"
 diablerize_interaction: "[Glossary('Diablerizar','game_concept_diablerie_desc')] #weak (Scheme)#!"
 diablerize_desc: "¡[Glossary('Diablerizar','game_concept_diablerie_desc')] a [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] y devoraré su alma!"
 diablerize_desc_general: "La $diablerize$ es un [hostile_scheme|E] para matar a un objetivo [GetTrait('vampire').GetName( GetNullCharacter )] y devorar toda su sangre y su alma. Es un [secret_scheme|E] basado en la [intrigue|E], que puede reclutar [agents|E].\n\nUna $pod_diablerie$ exitosa resultará en la [character_death_death|E] del [scheme_target|E]. \n\nUn asesinato que logre permanecer en secreto otorgará al [scheme_owner|E] un [secret|E] de $pod_diablerie$.\n\nSer descubierto intentando [Glossary('Diablerizar','game_concept_diablerie_desc')], o diablerizar con éxito a un [GetTrait('vampire').GetName( GetNullCharacter )] es un [crime|E] grave para la mayoría de las creencias de los [GetTrait('vampire').GetName( GetNullCharacter )]. También llamada «Amaranth» por la primera víctima de $pod_diablerie$, este es el proceso mediante el cual un [GetTrait('vampire').GetName( GetNullCharacter )] drena a otro [GetTrait('vampire').GetName( GetNullCharacter )] de toda su sangre, incluida su alma. Esto permite al [Glossary('Diablerista','game_concept_diablerie_desc')] ganar [blood_potency|E] e incluso una [Glossary('Generación','game_concept_vampgeneration_desc')] inferior a la de su víctima. A menudo tiene como precio el fortalecer la [Glossary('Bestia','game_concept_beast_desc')] de un [GetTrait('vampire').GetName( GetNullCharacter )]. Esto se representa perdiendo niveles de [piety|E]. La mayoría de los [GetTrait('vampire').GetName( GetNullCharacter )] tienen una mala opinión de los #TOOLTIP:GAME_TRAIT,diablerist,[GetNullCharacter] #L Diableristas#!#!."
 scheme_interaction_tt_diablerize_approved: "[Glossary('Diablerize','game_concept_diablerie_desc')] [recipient.GetFirstName]."
 DIABLERIZE_SUCCESS_DESC: "¡La sangre y el alma de [TARGET_CHARACTER.GetShortUIName] serán tuyas!"
