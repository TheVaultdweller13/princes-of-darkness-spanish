l_spanish:
 groom_successor_decision: "Buscar un sucesor"
 groom_successor_decision_tooltip: "Tus sirvientes sugerirán varios candidatos adecuados"
 groom_successor_decision_desc: "Los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] no pueden realizar el $pod_Embrace$ ni, la mayoría de las veces, tener hijos de forma natural. Por lo tanto, si no quieres que tu duro trabajo se desperdicie en caso de un accidente desafortunado, debes estar preparado. Pedirás a tus sirvientes que traigan a varios candidatos adecuados."
 groom_successor_decision_effect_tooltip: "Se te presentará un grupo de candidatos y podrás aceptar a uno como tu propio hijo por un coste de prestigio"
 groom_successor_decision_confirm: "Comenzar la búsqueda"
 
 POD_kueijin_become_enlightened_decision: "Alcanzar la iluminación"
 POD_kueijin_become_enlightened_decision_tooltip: "El paso final del viaje dhármico."
 POD_kueijin_become_enlightened_decision_desc: "Estás cerca, tan cerca de liberarte de cualquier deuda kármica que te impida ascender. Casi sabes cómo funciona el mundo, el Yin y el Yang casi se han fusionado. Tu Hun y tu P'o casi han dejado de luchar. El mundo espiritual y el material son casi lo mismo. Y es hora de fusionarlos todos finalmente..."
 POD_kueijin_become_enlightened_decision_confirm: "Seré libre"
 POD_kueijin_become_enlightened_decision_deviltigers_religion: "Debes torturar prisioneros 150 veces"
 POD_kueijin_become_enlightened_decision_thousandwhispers_religion: "Debes haber perdido 50 relaciones en total"
 POD_kueijin_become_enlightened_decision_thrashingdragons_religion: "Debes tener 15 relaciones vivas"
 POD_kueijin_become_enlightened_decision_flameoftherisingphoenix: "Debes celebrar 25 banquetes"
 POD_kueijin_become_enlightened_decision_faceofthegods: "Debes ganar 25 guerras"
 POD_kueijin_become_enlightened_decision_inwardway: "Debes meditar 50 veces"
 
 POD_kj_notime: "No tengo tiempo."
 you_will_get_dharma_10_tt: "Si tienes éxito, alcanzarás la cima de la iluminación, [Glossary('Dharma','podgloss.dharma')] 10, lo que te dará la oportunidad de terminar la partida al alcanzar las [Glossary('Hundred Clouds','podgloss.hundredclouds')]."
 
 practicing_arts_decision: "Practicar tus artes"
 practicing_arts_decision_desc: "La iluminación no llega sin disciplina. Como enseñan todas las filosofías orientales, debes perfeccionarte en cuerpo, mente y espíritu antes de que las nieblas puedan abrirse para ti. El entrenamiento intenso quema los delirios mortales; en este estado elevado, (con suerte) aparece el den."
 practicing_arts_decision_tooltip: "Concentrarás tu tiempo en la práctica de las artes."
 practicing_arts_decision_confirm: "Quiero practicar mis artes"
 practicing_arts_decision_custom: "No tiene el [focus|E] de arte correspondiente"
  
 treking_wilds_decision: "Recorrer las tierras salvajes"
 treking_wilds_decision_desc: "Muchos [Glossary('Wu','podgloss.wu')] practican rituales transmitidos desde las primeras noches de la [Glossary('Fourth Age','game_concept_fourth_age_desc')]. Un [Glossary('Wu','podgloss.wu')] podría adentrarse en las tierras salvajes frecuentadas por los hengeyokai para meditar sobre los Sutras de Sangre."
 treking_wilds_decision_tooltip: "Concentras tu tiempo en buscar aventuras."
 treking_wilds_decision_confirm: "Quiero adentrarme en lo salvaje"
 mortal_living_decision: "Vivir entre mortales"
 mortal_living_decision_desc: "Muchos [Glossary('Wu','podgloss.wu')] practican rituales transmitidos desde las primeras noches de la [Glossary('Fourth Age','game_concept_fourth_age_desc')]. Un [Glossary('Wu','podgloss.wu')] podría vivir como mortal durante un mes cada año."
 mortal_living_decision_tooltip: "Visitarás el mundo mortal."
 mortal_living_decision_confirm: "Quiero vivir con mortales"
 
 POD_kueijin_dharma_lifestyle_spend_decision: "Búsqueda del conocimiento"
 POD_kueijin_dharma_lifestyle_spend_decision_tooltip: "El conocimiento es un fin, no un medio"
 POD_kueijin_dharma_lifestyle_spend_decision_desc: "Para comprender tu [Glossary('Dharma','podgloss.dharma')], necesitas #italic;bold saber#!, ¿y qué mejor manera que recluirte y estudiar hasta que finalmente lo comprendas todo?"
 POD_kueijin_dharma_lifestyle_spend_decision_confirm: "Tal es el [Glossary('Dharma','podgloss.dharma')]"
 
 POD_kueijin_dharma_blood_spend_decision: "Sacrificio sangriento"
 POD_kueijin_dharma_blood_spend_decision_tooltip: "Iluminación por la sangre"
 POD_kueijin_dharma_blood_spend_decision_desc: "La sangre (o $pod_vitae$ para la sangre transformada mágicamente) es verdaderamente la fuente de todo. Como enseña tu [Glossary('Dharma','podgloss.dharma')], este preciado fluido rojo es la clave hacia la iluminación. Es hora de derramarla..."
 POD_kueijin_dharma_blood_spend_decision_confirm: "Un paraíso rojo"
 
 POD_kueijin_dharma_piety_spend_decision: "Reparar dos mundos"
 POD_kueijin_dharma_piety_spend_decision_tooltip: "De la Golconda al Nirvana"
 POD_kueijin_dharma_piety_spend_decision_desc: "Para comprender verdaderamente tu [Glossary('Dharma','podgloss.dharma')], primero debes comprenderte a ti mismo y tu lugar en este mundo. Viaja, enseña y escucha hasta que tanto el Oeste como el Este no tengan misterios para ti."
 POD_kueijin_dharma_piety_spend_decision_confirm: "Tal es la Fe"