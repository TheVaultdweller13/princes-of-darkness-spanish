 destroy_inquisition_objective_decision_effect1: "El evento de la Era de la Inquisición no ocurrirá en el futuro"

 constantinian_objective_decision: "Integrarse con la Iglesia"
 constantinian_objective_decision_desc: "En lugar de ver la Iglesia como un enemigo al que oponerse y frenar, los Constantinianos la ven como un misterio por revelar, estudiar y guiar. Una vez comprendido el poder de las creencias de los mortales, quizá incluso las Brumas vuelvan a su equilibrio más benévolo y los Fae puedan cosechar el glamour de la creatividad de los fieles."
 constantinian_objective_decision_tooltip: "La Iglesia llegará a ver a los Fae como santos siervos de lo divino: ángeles, profetas, taumaturgos y verdaderos bendecidos."
 constantinian_objective_decision_confirm: "Establecer el Catecismo Constantiniano"
 constantinian_objective_decision_custom_artifact: "Debes tener uno de los [artifacts|E] de reliquias sagradas del cristianismo: el Santo Grial, un Fragmento de la Vera Cruz, la Lámpara de Constantino, el Flagrum de la Pasión, la Lanza del Destino, el Cáliz de Valencia o la Trompeta de Gabriel."
 constantinian_objective_decision_custom1: "[GetTitleByKey('c_byzantion').GetNameNoTier] debe estar en manos de un $POD_splat_fae$/$POD_splat_changeling$ [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName], o de un $POD_splat_hunter$ [GetFaithByKey('shadowinquisition').GetName]"
 constantinian_objective_decision_custom2: "[GetTitleByKey('c_roma').GetNameNoTier] debe estar en manos de un $POD_splat_fae$/$POD_splat_changeling$ [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName], o de un $POD_splat_hunter$ [GetFaithByKey('shadowinquisition').GetName]"
 constantinian_objective_decision_custom3: "[GetTitleByKey('c_jerusalem').GetNameNoTier] debe estar en manos de un $POD_splat_fae$/$POD_splat_changeling$ [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName], o de un $POD_splat_hunter$ [GetFaithByKey('shadowinquisition').GetName]" 
 constantinian_objective_decision_effect1: "Todas las [faiths|E] occidentales de $POD_splat_hunter$ #weak ([GetFaithByKey('shadowinquisition').GetName], [GetFaithByKey('akritai').GetName], [GetFaithByKey('independenthunters').GetName], etc.)#! obtendrán [GetFaithDoctrine('special_doctrine_constantinian_catechism').GetBaseName] y aceptarán a los $POD_splat_fae$ como ángeles"
 constantinian_objective_decision_effect2: "Puedes reclutar [GetMaA('witchhunters').GetName] como [men_at_arms|E]"
 constantinian_objective_decision_effect3: "Un cazador de [GetFaithDoctrine('special_doctrine_constantinian_catechism').GetBaseName] siempre aceptará tu oferta de vasallaje"
 constantinian_objective_decision_effect4: "Los $POD_splat_fae$ ya no obtendrán [GetTrait('banality').GetName(GetNullCharacter)] de los [counties|E] bajo el gobierno de [GetFaithByKey('shadowinquisition').GetName]"
 
 prevent_black_death_objective_decision_before_last_date: "Este objetivo debe completarse antes del año #V 1347#!"

 prevent_black_death_rat_objective_decision: "Planes de los Ratkin"
 prevent_black_death_rat_objective_decision_desc: "Muchos videntes Fae tienen sueños proféticos sobre un suceso cataclísmico futuro que mata a millones de soñadores. Los detalles son vagos, pero parece implicar hordas de ratas que vienen del amanecer, montones de cadáveres ardiendo, esqueletos danzantes, dedos de manos y pies ennegrecidos. Algunos fae están convencidos de que los Ratkin y sus enfermizos accesorios de la Wyrm deben ser destruidos."
 prevent_black_death_rat_objective_decision_tooltip: "Intentarás impedir que se cumpla la Profecía de la Rata."
 prevent_black_death_rat_objective_decision_confirm: "Prevenir la Peste Negra"
 prevent_black_death_rat_objective_decision_custom1: "Debes emplear a un [GetCourtPositionType('court_physician_court_position').GetName()] con [aptitude|E] Excelente"
 prevent_black_death_rat_objective_decision_custom2: "No debe haber ningún [independent_ruler|E] que siga la [religion|E] de la [GetReligionFamily('rf_wyrm').GetName] en el mapa"
 prevent_black_death_rat_objective_decision_custom2_ex: "$prevent_black_death_rat_objective_decision_custom2$ #weak ([example.GetFirstName])#!"        

 prevent_black_death_cat_objective_decision: "¡Gatitos!"
 prevent_black_death_cat_objective_decision_desc: "Está claro: para impedir la Profecía de la Rata, ¡debes hacer que todos amen a los gatos!"
 prevent_black_death_cat_objective_decision_tooltip: "Impedirás la Profecía de la Rata haciendo que todos adoren a los gatos."
 prevent_black_death_cat_objective_decision_confirm: "¡Miau!"
 prevent_black_death_cat_objective_decision_custom1: "Todo rey y emperador debe tener el modificador [GetModifier('cat_story_modifier').GetNameWithTooltip]"
 prevent_black_death_cat_objective_decision_custom1_ex: "$prevent_black_death_cat_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 prevent_black_death_cat_objective_decision_custom2: "Puedes reclutar [GetMaA('cats').GetName] como [men_at_arms|E]"

 destroy_order_of_reason_objective_decision: "Más Allá de la Razón"
 destroy_order_of_reason_objective_decision_desc: "Los hombres de saber buscan atar el mundo con la Razón y la Ciencia. Sus mundanos esfuerzos por catalogar, definir y limitar el mundo amenazan con poner fin a la creencia en lo misterioso e incontrolable. Rastrean las líneas ley para hallar fuentes de glamour, que llaman nodos, que luego drenan y destruyen. Estos «hombres razonables» masacraron a todas las Brujas y Fae que hallaron en las ruinas de Mistridge y sus alrededores. ¡Hay que detenerlos a toda costa!"
 destroy_order_of_reason_objective_decision_tooltip: "Impedirás que la Orden de la Razón traiga más banalidad al mundo."
 destroy_order_of_reason_objective_decision_confirm: "No más estasis"
 destroy_order_of_reason_objective_decision_mutually_exclusive: "#X Mutuamente excluyente con $POD_qareen_objective_decision$#!."
 destroy_order_of_reason_objective_decision_effect1: "Los $POD_splat_fae$ ya no obtendrán [GetTrait('banality').GetName(GetNullCharacter)] de la [era|E]"
 
 arcadian_restoration_objective_decision: "Restauración Arcadiana"
 arcadian_restoration_objective_decision_desc: "Incluso en la [Glossary('Era Mítica','game_concept_mythic_age_desc')], el Mundo Otoñal no había estado tan cerca del [UmbraGlossary('dreaming')]. Pero, inevitablemente, esta era también girará, nuestros sueños están condenados a desvanecerse y la Banalidad reanudará su implacable marcha sobre la realidad.\n\nY yo digo: ¡no! ¡No repetiremos los errores de nuestros antepasados! No nos quedaremos de brazos cruzados mientras nuestras esperanzas y nuestra alegría se marchitan hasta la nada, ahogadas por un mundo que aborrece lo que no puede explicar. Traeremos el propio Ensueño al Mundo Otoñal y los mitos y la realidad serán uno."
 arcadian_restoration_objective_decision_tooltip: "Recuperarás la [Glossary('Era Mítica','game_concept_mythic_age_desc')]." 
 arcadian_restoration_objective_decision_confirm: "Sueños, por siempre jamás"
