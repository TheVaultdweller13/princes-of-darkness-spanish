 a_way_back_to_heaven_objective_decision: "Un Camino de Vuelta al Cielo"
 a_way_back_to_heaven_objective_decision_desc: "En un principio, los hsien carecían de mucha protección frente a enemigos que drenaban el chi, hasta que el Rey Mono logró hallar un camino de vuelta al Cielo y compartió su conocimiento del equilibrio entre los pequeños dioses. Estudiando el Nei Tan y obteniendo el nido del dragón más poderoso, puedes convertirte en Tao Te Hsien y regresar tú mismo al Cielo."
 a_way_back_to_heaven_objective_decision_tooltip: "Te convertirás en Tao Te Hsien"
 a_way_back_to_heaven_objective_decision_confirm: "El Cielo a la vista"