 become_santa_objective_decision: "Convertirse en Papá Noel"
 become_santa_objective_decision_desc: "Tienes un plan particularmente demente para evitar la pérdida de la inmortalidad que trae el Quebranto. Repartiendo regularmente juguetes quiméricos a incontables niños cada Yule, vivirás eternamente gracias a su creencia en ti. Te escribirán cartas pidiendo ayuda. Honrarán las viejas costumbres y dejarán ofrendas para saciar tu hambre sin fondo."
 become_santa_objective_decision_shattering: "Debes convertirte en Papá Noel antes del [Glossary('Quebranto','game_concept_shattering_desc')] o lo peor de él debe haber pasado. #weak No puedes tener ninguno de estos [modifiers|E]: [GetModifier('POD_shattering_1_modifier').GetNameWithTooltip], [GetModifier('POD_shattering_2_modifier').GetNameWithTooltip], [GetModifier('POD_shattering_3_modifier').GetNameWithTooltip] ni [GetModifier('POD_shattering_4_modifier').GetNameWithTooltip]#!"
 become_santa_objective_decision_winter_capital: "Debe ser invierno en tu capital"
 become_santa_objective_decision_court_antiquarian_excellent: "Debes emplear a un [GetTrait('boggan').GetName( GetPlayer )] o [GetTrait('nocker').GetName( GetPlayer )] como [GetCourtPositionType('antiquarian_court_position').GetName()] con [aptitude|E] excelente"
 become_santa_objective_decision_tooltip: "Te volverás inmortal repartiendo juguetes quiméricos a incontables niños cada Yule"
 become_santa_objective_decision_deer_pooka: "Necesitas al menos un cortesano [GetTrait('pooka').GetName( GetPlayer )] con [GetModifier('POD_pooka_deer_affinity_modifier').GetNameWithTooltip]. ¡Papá Noel necesita un reno!"
 become_santa_objective_decision_elves: "Necesitas al menos tres cortesanos [GetTrait('nocker').GetName( GetPlayer )] y tres [GetTrait('boggan').GetName( GetPlayer )]. El taller de Papá Noel necesita «elfos»."
 become_santa_objective_decision_confirm: "Me convertiré en Papá Noel, el Portador de Regalos"
 become_santa_objective_decision_louhi: "[GetScriptedCharacterByHistoryID('790633').GetFirstName] la Malvada puede intentar impedir tu ascensión; necesita estar muerta o en $pod_torpor$" 
 become_santa: "¡Te conviertes en Papá Noel!"

