 destroy_inquisition_objective_decision: "Destruir la Inquisición de las Sombras"
 destroy_inquisition_objective_decision_desc: "La Iglesia y su temida Inquisición persiguen a paganos y Fae. Convierte por la espada, tortura o quema hasta la muerte a los seguidores de los Antiguos Dioses y a los practicantes de las artes Místicas. Sus sacerdotes usan el bautismo ritual sobre niños Changeling para arrebatarles para siempre su naturaleza encantada y apagar la chispa del Glamour. Para que los Fae permanezcan en la Tierra, es hora de detener esto."
 destroy_inquisition_objective_decision_tooltip: "Destruirás la Inquisición de las Sombras."
 destroy_inquisition_objective_decision_confirm: "Poner fin a los Tiempos de la Hoguera"
 destroy_inquisition_objective_decision_custom: "No debe haber ningún [independent_ruler|E] que siga la [faith|E] [GetFaithByKey('shadowinquisition').GetName] en el mapa"
 destroy_inquisition_objective_decision_custom_ex: "$destroy_inquisition_objective_decision_custom$ #weak ([example.GetFirstName])#!"  
 destroy_inquisition_objective_decision_custom1: "[GetTitleByKey('c_roma').GetNameNoTier] debe estar en manos de un $POD_splat_fae$ o $POD_splat_changeling$ que no siga una fe con [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName] ni [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName]"
