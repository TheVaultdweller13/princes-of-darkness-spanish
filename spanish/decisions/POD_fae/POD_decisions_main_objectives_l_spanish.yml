 the_middle_way_objective_decision: "El Camino Medio"
 the_middle_way_objective_decision_desc: "En el fondo, todos somos Inanimae. Todos elegimos ligarnos a la naturaleza o a la humanidad y todos, por algún motivo, actuamos como si fuéramos superiores a los demás. Para sobrevivir y prosperar no podemos seguir ciegamente el futuro ni abandonar por completo la tradición. La humanidad ha venido para quedarse y la naturaleza es el suelo en el que se nutre; el uno no puede sobrevivir sin el otro, ¿por qué fingimos lo contrario? Deberíamos unirnos como Inanimae, mantener la tradición en el corazón mientras avanzamos. ¡Prosperaremos con ambos bandos!"
