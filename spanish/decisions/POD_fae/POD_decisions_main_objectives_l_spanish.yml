 elemental_ascension_objective_decision_custom3: "Debes haber visitado al menos #V 5#! [holy_sites|E] en una [GetActivityType('activity_pilgrimage').GetName] #weak ([GetPlayer.MakeScope.ScriptValue('POD_num_of_visited_holy_sited')])#!"

 the_peace_of_making_objective_decision: "La Paz de la Creación"
 the_peace_of_making_objective_decision_desc: "Los Krofted se equivocan. Para hacer retroceder el Largo Invierno no debemos abandonar la naturaleza y huir hacia la humanidad, ¡sino hacer retroceder a la humanidad y obligarla a abrazar la naturaleza! ¡Y el primer paso es limpiar de Krofted a los [GetTrait('fae').GetName(GetPlayer)] y por fin unirnos bajo una única bandera Elemental!"
