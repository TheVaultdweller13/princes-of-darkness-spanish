 elemental_ascension_objective_decision: "Ascensión Elemental"
 elemental_ascension_objective_decision_desc: "Los [GetTrait('fae').GetName(GetPlayer)] son casi espíritus de la naturaleza, pero no del todo. Son lo más cercano a elementos puros que están los Fae, pero algunos [GetTrait('fae').GetName(GetPlayer)] consideran esta «imperfección» al fundirse con el elemento un defecto que corregir.\n\n¡Pensando y actuando de verdad como el elemento, los [GetTrait('fae').GetName(GetPlayer)] pueden volverse perfectos!"
 elemental_ascension_objective_decision_tooltip: "Uno con el Elemento"
 elemental_ascension_objective_decision_confirm: "$elemental_ascension_objective_decision$"
 elemental_ascension_objective_decision_custom1: "Tú o tus [vassals|E] debéis controlar al menos #V 5#! [holy_sites|E] de tu [faith|E] #weak ([GetPlayer.MakeScope.ScriptValue('POD_num_of_controlled_holy_sites')])#!"
