 the_krofted_way_objective_decision: "El Camino Krofted"
 the_krofted_way_objective_decision_desc: "Las viejas costumbres mueren. La naturaleza será abandonada poco a poco en la búsqueda de poder e influencia de la humanidad. Para sobrevivir y prosperar, ¡debemos integrarnos en la humanidad para convertirnos en un nuevo elemento de ella!\n\n¡Ese es el único camino hacia la salvación!"
