l_spanish:
 POD_region_seasons_struggle: "Campo de Batalla Estacional"
 
 the_red_and_white_apple_of_avalon_decision: "La Manzana Roja y Blanca de Ávalon"
 the_red_and_white_apple_of_avalon_decision_desc: "En la cima del Tor de Glastonbury hay dos manantiales, el Blanco y el Rojo, que representan las fuerzas de la vida y la muerte. Cerca de los dos manantiales hay un pequeño manzano que da manzanas todo el año, sea invierno, verano o primavera. La mitad de las manzanas son rojas, pero la otra mitad tiene la piel blanca como la nieve."
 the_red_and_white_apple_of_avalon_decision_confirm: "Escoger una Manzana"
 the_red_and_white_apple_of_avalon_decision_tooltip: "Obtén un artefacto de manzana."
 
 albion_pools_decision: "Pozas de Albión"
 albion_pools_decision_desc: "Las tres místicas Pozas de Albión, ocultas respectivamente en Cymru, Alba y Breizh, están entre los tesoros más deseados que buscan los magos, pues se dice que quien tenga poder sobre las tres pozas gobernará toda Inglaterra. Se decía que una concedía juventud eterna, otra curaba todas las heridas y la tercera, supuestamente, otorgaba control sobre los corazones de los mortales."
 albion_pools_decision_confirm: "Albión debería ser mío"
 albion_pools_decision_tooltip: "Reclama Albión."
 albion_pools_decision_custom: "Tu [realm_capital|E] está situada en la [region|E] de [GetGeographicalRegion('ghw_region_britannia').GetName]"
 
 foster_sprite_decision: "Buscar un sucesor"
 foster_sprite_decision_tooltip: "Tus sirvientes sugerirán varios candidatos adecuados"
 foster_sprite_decision_desc: "Los verdaderos fae no son fértiles, pero pueden acoger a un sprite para crear un verdadero fae. Por ello, si no quieres que tu duro trabajo se pierda en caso de un desafortunado accidente, debes estar preparado. Pedirás a tus sirvientes que traigan a varios candidatos adecuados."
 foster_sprite_decision_effect_tooltip: "Se te presentará un grupo de candidatos y podrás aceptar a uno como tu propio hijo por un coste de prestigio"
 foster_sprite_decision_confirm: "Comenzar la búsqueda"

 POD_fable_decision: "Relatos"
 POD_fable_decision_desc: "Los Fae están muy conectados con los mitos de los Soñadores; incluso podría decirse que son hechos y deshechos por ellos.\n\nPor ello, muchos Fae que fracasaron o no se interesan por la intriga política de las Cortes han decidido establecer un mito propio.\n\nEsta es una elección importante. Quizá sea una Gran Sombra, infame por manipular reinos enteros, o un Gran Heraldo cuya legendaria diplomacia unió a los peores enemigos. ¿Qué Relato perseguiré?"
 POD_fable_decision_tooltip: "Una nueva Leyenda."
 POD_fable_decision_confirm: "Un Relato Propio"
 POD_fable_decision_advance: "Harás avanzar tu Relato al siguiente nivel, mejorando las [domicile_building_upgrade|E] que desbloquea el Relato, pero también aumentando los requisitos del siguiente avance."
 POD_fable_decision_chose_fable: "Elegirás un Relato al que aspirar. #X Esta acción no puede revertirse ni cambiarse después.#!"

# TODO FAE
 POD_eccentric_pooka_decision: "Buscar un Pooka"
 POD_eccentric_pooka_decision_desc: "¡Los Pooka son muy divertidos! Hay tantos tipos distintos que ¡tengo que tener uno! (Quizá lleve algún tiempo encontrarlos)"
 POD_eccentric_pooka_decision_tooltip: "¡Quiero este!"
 POD_eccentric_pooka_decision_confirm: "¡Un compañero peludo!"

 POD_lilin_objective_decision: "Uno con Lilith"
 POD_lilin_objective_decision_desc: "Igual que los pródigos que se hacen llamar vampiros, los Lilin descendemos de Lilith, una demonio que se rebeló contra su creador y se negó a someterse al hombre con el que la habían obligado a casarse. Pero muchas cosas nos diferencian de ella: carecemos de sus poderes, carecemos de su estatus y, sobre todo, carecemos de su esencia.\n\nPero somos Fae, ¡lo imposible es posible! Si reuniera artefactos relacionados con la Madre Oscura y esclavizara a su hermano y hermanas, quizá pueda recrear la vida de Lilith."
 POD_lilin_objective_decision_tooltip: "Bendición de la Madre Oscura"
 POD_lilin_objective_decision_confirm: "Recrear la leyenda"
 POD_lilin_objective_decision_custom1: "Debes conocer los [Glossary('Nombres Verdaderos','podgloss.truename')] de #V 3#! $POD_splat_demon_plural$"
 POD_lilin_objective_decision_effect: "Desbloqueas los [journeys|E] para aprender nuevas [bs_traditions|E] de [GetTrait('bloodsorcery').GetName(GetPlayer)]"

 POD_qareen_objective_decision: "Consejero de la Humanidad"
 POD_qareen_objective_decision_desc: "Eres un inmortal con inmenso conocimiento del mundo, estás dotado, o quizá maldito, de no olvidar nada, y hay muchos mortales sin ninguna guía, que tropiezan a ciegas con la esperanza de hallar el camino. \n\nNo sorprende, pues, que los mortales encuentren un camino malo para todo lo fae. Pero, con tu control sobre las principales fuentes de conocimiento, estás en una posición inmejorable para guiar a la humanidad hacia un futuro que beneficie a un Fae de tu clase."
 POD_qareen_objective_decision_tooltip: "Preguntar a un Jinn"
 POD_qareen_objective_decision_confirm: "Convertirte en la luz que guía a la humanidad"
 POD_qareen_objective_decision_mutually_exclusive: "#X Mutuamente excluyente con $destroy_order_of_reason_objective_decision$#!."
 POD_qareen_objective_decision_effect1: "Mejora considerablemente la tarea de consejero @task_promote_culture! #V $task_promote_culture$#! y obtén acceso a la decisión [diligent_development_focus_decision|E] si no eres [GetDoctrine('doctrine_fae_morality_unseelie').GetBaseName]."
 POD_fae_qareen_goal_achieved_modifier_culture: "Eres una guía de la humanidad"

 POD_shaytan_objective_decision: "Legado de Deseos del Djinn"
 POD_shaytan_objective_decision_desc: "Siendo un shaytan, no eres ajeno a las travesuras. Al engañar a los poderosos para que acepten tu oferta de conceder deseos, asegurarás que los djinn perduren y sobrevivan a los estragos de la banalidad, pues la historia de los djinn y su concesión de deseos durará por toda la eternidad."
 POD_shaytan_objective_decision_tooltip: "Tu deseo es una orden"
 POD_shaytan_objective_decision_confirm: "Se contarán muchos relatos de esto"
 POD_shaytan_objective_decision_custom1: "Debes haber usado con éxito la [character_interaction|E] #V $POD_shaytan_trick_wish_interaction$#! al menos 30 veces."
 POD_shaytan_objective_decision_info: "#I La [character_interaction|E] #V $POD_shaytan_trick_wish_interaction$#! se desbloquea al tener [GetTrait('art_naming_advanced').GetName(GetPlayer)], [GetTrait('realm_fae').GetName(GetPlayer)], [GetTrait('realm_scene').GetName(GetPlayer)] y [GetTrait('realm_time').GetName(GetPlayer)]#!"

 POD_aesin_legacy_4_decision: "Entrenamiento de Comandante de la Casa"
 POD_aesin_legacy_4_decision_desc: "La Casa Aesin tiene experiencia en comandar bajo diversas condiciones climáticas y terrenos. ¿Deseas buscar entrenamiento?"
 POD_aesin_legacy_4_decision_tooltip: "Quiero ser el mejor"
 POD_aesin_legacy_4_decision_confirm: "Que comience el entrenamiento"
 POD_aesin_legacy_4_decision_effect1: "¡Solo puedes obtener hasta #V 4#! [commander_traits|E]!"

 POD_aesin_legacy_5_decision: "Entrenamiento de Poeta de la Casa"
 POD_aesin_legacy_5_decision_desc: "La Casa Aesin está compuesta por muchos grandes poetas, maestros de la canción y la palabra. ¿Deseas buscar entrenamiento?"
 POD_aesin_legacy_5_decision_tooltip: "Quiero ser el mejor"
 POD_aesin_legacy_5_decision_confirm: "Que comience el entrenamiento"

 POD_balor_legacy_2_decision: "Entrenamiento de Comandante de la Casa"
 POD_balor_legacy_2_decision_desc: "La Casa Balor tiene experiencia en comandar ejércitos para eliminar a sus enemigos hasta el último, cueste lo que cueste. ¿Deseas buscar entrenamiento?"
 POD_balor_legacy_2_decision_tooltip: "Quiero ser el mejor"
 POD_balor_legacy_2_decision_confirm: "Que comience el entrenamiento"

 POD_daireann_legacy_4_decision: "Entrenamiento de Médico de la Casa"
 POD_daireann_legacy_4_decision_desc: "La Casa Daireann está compuesta por muchos grandes médicos y maestros de pociones. ¿Deseas buscar entrenamiento?"
 POD_daireann_legacy_4_decision_tooltip: "Quiero ser el mejor"
 POD_daireann_legacy_4_decision_confirm: "Que comience el entrenamiento"

 POD_fiona_legacy_4_decision: "Entrenamiento de Comandante de la Casa"
 POD_fiona_legacy_4_decision_desc: "La Casa Fiona tiene muchos comandantes valientes y audaces. ¿Deseas buscar entrenamiento?"
 POD_fiona_legacy_4_decision_tooltip: "Quiero ser el mejor"
 POD_fiona_legacy_4_decision_confirm: "Que comience el entrenamiento"

 POD_scathach_legacy_3_decision: "Entrenamiento de Comandante de la Casa"
 POD_scathach_legacy_3_decision_desc: "La Casa Scathach tiene una gran variedad de comandantes expertos. ¿Deseas buscar entrenamiento?"
 POD_scathach_legacy_3_decision_tooltip: "Quiero ser el mejor"
 POD_scathach_legacy_3_decision_confirm: "Que comience el entrenamiento"

 POD_inanimae_legacy_3_decision: "Entrenamiento de Sanador Natural"
 POD_inanimae_legacy_3_decision_desc: "Hay muchos Inanimae en sintonía con Aquis que también son sanadores hábiles y que podrían transmitirte su conocimiento de remedios naturales o técnicas de curación. ¿Deseas buscar entrenamiento?"
 POD_inanimae_legacy_3_decision_tooltip: "Quiero ser el mejor"
 POD_inanimae_legacy_3_decision_confirm: "Que comience el entrenamiento"

 POD_fae_mighty_legacy_3_decision: "Entrenamiento de Maestro de la Espada"
 POD_fae_mighty_legacy_3_decision_desc: "La Casa [GetPlayer.GetDynasty.GetNameNoTooltip] tiene la tradición de estudiar las vías de la espada. ¿Deseas continuar con esta tradición?"
 POD_fae_mighty_legacy_3_decision_tooltip: "Quiero ser el mejor"
 POD_fae_mighty_legacy_3_decision_confirm: "Que comience el entrenamiento"

 POD_santa_presents_decision: "Repartir Regalos"
 POD_santa_presents_decision_desc: "¡Repartir regalos es alegre y de buen ánimo!\nEs difícil no querer creer en alguien que esparce alegría y jolgorio a todos."
 POD_santa_presents_decision_tooltip: "Cascabeles"
 POD_santa_presents_decision_confirm: "Esparcir la Alegría por el Mundo"

 POD_grigori_faith_channel_decision: "Plegarias Divinas"
 POD_grigori_faith_channel_decision_desc: "Eres el Profeta, una figura divina para estos mortales. Su creencia te protege de cualquier incredulidad que el mundo pueda imponerte, pero eso no es todo...\n\nSus plegarias portan glamour; Glamour que es tuyo por derecho, y solo tienes que prestar oído y escuchar sus necesidades más profundas."
 POD_grigori_faith_channel_decision_tooltip: "Escuchar con atención"
 POD_grigori_faith_channel_decision_confirm: "Quizá no lo sepáis, pero os escucho"


