 POD_war_of_seasons_peace_victory_objective: "Tregua Eterna"
 POD_war_of_seasons_peace_victory_objective_desc: "La Guerra de las Estaciones empieza a ser una pesadilla lejana y los Kithain van olvidando la guerra. Eso crea el ambiente perfecto para una paz verdaderamente eterna"
