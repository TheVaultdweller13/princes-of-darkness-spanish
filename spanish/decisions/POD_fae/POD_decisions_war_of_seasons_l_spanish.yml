 POD_form_united_seasons_decision: "Estaciones Unidas"
 POD_form_united_seasons_decision_desc: "La Guerra de las Estaciones terminó por tu decreto y todos los $POD_splat_fae$ te consideran su líder evidente. Y es hora de que reclames tu [title|E]"
