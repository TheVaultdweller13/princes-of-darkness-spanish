l_spanish:
 elixir_of_eternal_life_starter_decision: "Búsqueda del [Concept('POD_elixir_of_eternal_life', 'Elixir de la Vida Eterna')|E]"
 elixir_of_eternal_life_starter_decision_desc: "Para muchos, el Elixir de la Vida Eterna fue un regalo de los 8 Inmortales o de sus siervos, los Wu T'ian. Sin embargo, las historias hablan de quienes alcanzaron tal estado de iluminación, y la inmortalidad que lo acompaña, sin su ayuda. Muchos consideran imposible semejante hazaña. Como dijo el propio Maestro, aunque el sordo no oye el trueno ni aprecia la música, y el sol y el esplendor de las túnicas del Emperador son invisibles para el ciego, eso no significa que estas cosas no existan. Algunos dicen que obtener el Elixir por uno mismo es una prueba para demostrar que se es digno de él. Otros dicen que son los Cielos que te dan a elegir si quieres condenarte.\n\n#R Tus probabilidades de éxito en esta búsqueda son absurdamente bajas. No lo intentes si aprecias el bienestar de tu personaje.\nIncluso guardar y recargar la partida para tentar a la suerte no te salvará más adelante. Estás advertido.#!"
 elixir_of_eternal_life_starter_decision_tooltip: "El Elixir de la Vida Eterna podría concedernos la inmortalidad sin inconvenientes."
 elixir_of_eternal_life_starter_decision_confirm: "Empecemos"
 elixir_of_eternal_life_starter_decision_requirement_you: "Tienes al menos @skill_learning_icon!#color_white 25#! de [learning|E], tienes al menos #color_white 50#! de [trait_level_track_xp|E] en Elaboración #weak ([GetTrait('pod_crafter').GetName(GetNullCharacter)])#!, eres [GetTrait('erudite').GetName(GetNullCharacter)], eres un [GetTrait('sorcerer').GetName(GetNullCharacter)] o eres un [GetTrait('theurgist').GetName(GetNullCharacter)]"
 elixir_of_eternal_life_starter_decision_requirement_courtiers: "Tienen al menos @skill_learning_icon!#color_white 15#! de [learning|E], tienen al menos #color_white 20#! de [trait_level_track_xp|E] en Elaboración #weak ([GetTrait('pod_crafter').GetName(GetNullCharacter)])#!, son [GetTrait('erudite').GetName(GetNullCharacter)], son un [GetTrait('sorcerer').GetName(GetNullCharacter)] o son un [GetTrait('theurgist').GetName(GetNullCharacter)]"
 elixir_of_eternal_life_starter_decision_requirement_master_of_samsara: "Tienes la [perk|E] [GetPerk('master_of_samsara_perk').GetName(GetPlayer)] #weak ($blood_magic_path_of_karma_visible$)#!"
 elixir_of_eternal_life_starter_decision_requirement_hunger_of_the_void: "Tienes la [perk|E] [GetPerk('hunger_of_the_void_perk').GetName(GetPlayer)] #weak ($blood_magic_kraina_of_enoch_visible$)#!"
 elixir_of_eternal_life_starter_decision_requirement_heave_the_host_of_hell: "Tienes la [perk|E] [GetPerk('heave_the_host_of_hell_perk').GetName(GetPlayer)] #weak ($blood_magic_kraina_of_the_well_visible$)#!"
 elixir_of_eternal_life_starter_decision_requirement_minions_of_deep_marmora: "Tienes la [perk|E] [GetPerk('minions_of_deep_marmora_perk').GetName(GetPlayer)] #weak ($blood_magic_black_sea_kraina_visible$)#!"
 elixir_of_eternal_life_starter_decision_requirement_dutchman: "Posee y equipa el [artifact|E] #TOOLTIP:artifact_flying_dutchman_description #L $artifact_flying_dutchman_name$#!#! #weak (se puede encontrar en la [umbra|E])#!"
 elixir_of_eternal_life_starter_decision_requirement_redeyes: "Posee y equipa el [artifact|E] #TOOLTIP:artifact_redeyes_description #L $artifact_redeyes_name$#!#! #weak (se puede encontrar en la [umbra|E])#!"
 elixir_of_eternal_life_starter_decision_requirement_quarters: "Posee y equipa el [artifact|E] #TOOLTIP:artifact_ship_of_the_four_quarters_description #L $artifact_ship_of_the_four_quarters_name$#!#! #weak (se puede encontrar en la [umbra|E])#!"
 elixir_of_eternal_life_starter_decision_requirement_zadkiel: "Posee y equipa el [artifact|E] #TOOLTIP:artifact_lens_of_zadkiel_description #L $artifact_lens_of_zadkiel_name$#!#! #weak (se puede encontrar en la [umbra|E])#!"
 elixir_of_eternal_life_starter_decision_requirement_mooncrystal: "Posee y equipa el [artifact|E] #TOOLTIP:artifact_mooncrystal_description #L $artifact_mooncrystal_name$#!#! #weak (se puede encontrar en la [umbra|E])#!"
 elixir_of_eternal_life_stage1_unlock_next_phase: "Desbloquea el siguiente paso del camino actual"
 elixir_of_eternal_life_stage1_unlock_next_phase_caveat: "$spell_of_life_stage1_unlock_next_phase$ si lo logras"
 elixir_of_eternal_life_stage1_do_multiple_stages: "#help \n\nAunque es más difícil, puede que completar un camino ofrezca recompensas adicionales más adelante.#!"
 elixir_of_eternal_life_stage1_warning: "\n\n#R ¡Prepárate para sacrificarlo todo en la búsqueda de la verdadera inmortalidad, pues el camino está plagado de peligros!#!"
 elixir_of_eternal_life_stage1_decision_completion_message_title: "Tu Comprensión se Profundiza"
 elixir_of_eternal_life_stage1_decision_completion_message_desc: "Has desbloqueado el siguiente objetivo de este camino"

 elixir_of_eternal_life_request_aid_decision: "Pedir Ayuda"
 elixir_of_eternal_life_request_aid_decision_desc: "Ya has logrado lo que pocos siquiera consideraron posible: proteger el Reino Medio contra el ascenso del [Glossary('Emperador Demonio','podgloss.demonemperor')]. Al hacerlo, fuiste elevado hasta unirte a los Ocho Inmortales que gobiernan a los Wu T'ian. Ahora que buscas el Elixir de la Vida Eterna, los Ocho podrían estar dispuestos a ayudarte."
 elixir_of_eternal_life_request_aid_decision_confirm: "Buscaré su guía"
 elixir_of_eternal_life_request_aid_decision_tooltip: "Como Noveno Inmortal, los demás podrían estar dispuestos a ayudar en mi última búsqueda"
 elixir_of_eternal_life_ninth_immortal_bonus_xp: "Cada vez que completes un [journey|E], las intuiciones de los Ocho Inmortales te otorgan #color_white 5.00#! de [trait_level_track_xp|E] adicionales en el Elixir de la Vida Eterna #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"


 elixir_of_eternal_life_remove_bad_traits_decision: "Maestría interna"
 elixir_of_eternal_life_remove_bad_traits_decision_tooltip: "Disciplina forjada en la adversidad, claridad nacida de la agitación."
 elixir_of_eternal_life_remove_bad_traits_decision_desc: "Las cargas que llevo no tienen por qué definirme. Donde antes flaqueaba bajo la tensión, ahora veo una oportunidad.\n\nYa no me entregaré a hábitos destructivos. En su lugar, me dominaré a mí mismo."
 elixir_of_eternal_life_remove_bad_traits_decision_confirm: "Soy el dueño de mí mismo."
 elixir_of_eternal_life_remove_bad_traits_decision_effect: "Los rasgos serán sustituidos por otros nuevos"

 elixir_of_eternal_life_stage1_internal_phase1_decision: "Refinar la Esencia en Aliento"
 elixir_of_eternal_life_stage1_internal_phase1_decision_desc: "En la búsqueda del [Concept('POD_elixir_of_eternal_life', 'Elixir de la Renovación Eterna')|E], cada uno de los tres componentes principales del cosmos y del ser humano (espíritu, aliento y esencia) se reintegra en el anterior. Esto se hace para invertir la secuencia en que surgen del Tao y retornar así al origen del proceso. Mediante tal retorno se almacena el aliento y pueden desatarse los nudos de la muerte.\n\nPara empezar, hay que refinar, concentrar y coagular la esencia interior de la mente para concebir un embrión interno hecho de aliento.$elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_internal_phase1_decision_tooltip: "Reintegra la esencia en aliento para retornar al origen del proceso."
 elixir_of_eternal_life_stage1_internal_phase1_decision_confirm: "Así comienza"
 elixir_of_eternal_life_stage1_internal_phase1_decision_requirement_stress: "Tienes #color_white 0#! de [stress|E]"
 elixir_of_eternal_life_stage1_internal_phase1_decision_requirement_illness: "#bold No#! tienes ninguna enfermedad"

 elixir_of_eternal_life_stage1_internal_phase2_decision: "Refinar el Aliento en Espíritu"
 elixir_of_eternal_life_stage1_internal_phase2_decision_desc: "Con el embrión del renacimiento concebido, es hora de seguir refinando y unificando las tres fuerzas interiores. Todas las enfermedades y dolencias de tu forma proceden de los nudos que bloquean la circulación del aliento y oprimen las 5 vísceras. La circulación interna adecuada del aliento oculto, sin trabas del cuerpo, curará tales males. Como toda materia, tu aliento debe fluir de forma cíclica, formando un patrón sin fin. El proceso integra diversos movimientos físicos, como flexionar, expandir, contraer y extender, junto con técnicas de respiración."
 elixir_of_eternal_life_stage1_internal_phase2_decision_tooltip: "Reintegra el aliento en espíritu para retornar al origen del proceso."
 elixir_of_eternal_life_stage1_internal_phase2_decision_confirm: "El segundo se convierte en el primero"

 elixir_of_eternal_life_stage1_internal_phase3_decision: "Refinar el Espíritu para Retornar al Vacío"
 elixir_of_eternal_life_stage1_internal_phase3_decision_desc: "A medida que tu espíritu se refina, tus órganos se transmutarán en oro y jade, uno tras otro. Tu aliento se vuelve como de azufre y tu sangre como de cinabrio. Con tiempo, aislamiento y autoexamen, tu espíritu se purifica hasta la nada y tu cuerpo queda vacío. Donde los ignorantes ven el final en el vacío, tú ves el potencial de una conectividad infinita.\n\nSi las cosas no tienen vacío en el centro, si no tienen la forma como sustancia, si el yin no tiene yang, ¿cómo pueden llegar a ser? Conoce la luz y aférrate a la oscuridad. Este es el secreto de la existencia, un secreto conocido por pocos y ahora... conocido por ti."
 elixir_of_eternal_life_stage1_internal_phase3_decision_tooltip: "Retorna al origen del proceso."
 elixir_of_eternal_life_stage1_internal_phase3_decision_confirm: "El primero retorna al Tao"
 elixir_of_eternal_life_stage1_internal_phase3_decision_requirement_schemes: "Necesitas tener #color_white 0#! [schemes|E] activas"

 elixir_of_eternal_life_stage1_external_phase1_decision: "Recolectar las Flores de Oro y el Rocío de Jade"
 elixir_of_eternal_life_stage1_external_phase1_decision_desc: "Tus experimentos y rituales para crear el [Concept('POD_elixir_of_eternal_life', 'Elixir de la Renovación Eterna')|E] requerirán una vasta cantidad de ingredientes, no todos los cuales crecen en tu tierra natal. Necesitarás acceso fácil a estos ingredientes y a sus biomas de origen si esperas completar tu búsqueda. $elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_external_phase1_decision_tooltip: "Los ingredientes deben recolectarse en muchos lugares"
 elixir_of_eternal_life_stage1_external_phase1_decision_confirm: "Trasplantarlos a mis jardines"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_desert: "Tu territorio contiene una provincia de [terrain|E] de Tierras Secas, Desierto o Montañas Desérticas"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_cold: "Tu territorio contiene una provincia de [terrain|E] de Montañas o Taiga"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_cultivated: "Tu territorio contiene una provincia de [terrain|E] de Tierras de Cultivo o Colinas en Terrazas"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_water: "Tu territorio contiene una provincia de [terrain|E] de Llanuras Aluviales u Oasis"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_forest: "Tu territorio contiene una provincia de [terrain|E] de Bosque o Colinas"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_wet_forest: "Tu territorio contiene una provincia de [terrain|E] de Jungla o Humedales"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_plains: "Tu territorio contiene una provincia de [terrain|E] de Llanuras o Estepa"

 elixir_of_eternal_life_stage1_external_phase2_decision: "Preparar la Infusión de Brasa Incandescente"
 elixir_of_eternal_life_stage1_external_phase2_decision_desc: "Con los ingredientes herbales recolectados, es hora de preparar la Infusión de Brasa Incandescente. Para elaborarla, necesitarás reunir una variedad de objetos que potencien distintas partes de tu cuerpo físico. Si estás dispuesto a explorarlo, podrían obtenerse ingredientes alternativos de la [umbra|E]."
 elixir_of_eternal_life_stage1_external_phase2_decision_tooltip: "Para continuar, debes reunir una variedad de ingredientes"
 elixir_of_eternal_life_stage1_external_phase2_decision_confirm: "Primero, muele juntas una garra de wyvern y una seta de nueve tallos..."
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_bygones: "Tienes al menos 1 de las [POD_bygones_maa|E] Mayor o Potente"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_umbra_aptitude: "Tienes un #V 150%#! de [umbra_aptitude|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_bound_wraith_skills: "La suma total de las habilidades de tus $POD_splat_wraith_plural$ vinculados debe superar #V 100#!"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_can_use: "#color_white Tú#! puedes usar el artefacto"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_health: "Tiene un modificador de artefacto que da un impulso a la [health|E] o anula las penalizaciones de [health|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_diplomacy: "Tiene un modificador de artefacto que aumenta la [diplomacy|E] o anula las penalizaciones de [diplomacy|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_martial: "Tiene un modificador de artefacto que aumenta la [martial|E] o anula las penalizaciones de [martial|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_stewardship: "Tiene un modificador de artefacto que aumenta la [stewardship|E] o anula las penalizaciones de [stewardship|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_intrigue: "Tiene un modificador de artefacto que aumenta la [intrigue|E] o anula las penalizaciones de [intrigue|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_learning: "Tiene un modificador de artefacto que aumenta el [learning|E] o anula las penalizaciones de [learning|E]"

 elixir_of_eternal_life_stage1_external_phase3_decision: "Elaborar el Elixir de Oro Violeta"
 elixir_of_eternal_life_stage1_external_phase3_decision_desc: "Completada la infusión, el siguiente paso consiste en elaborar el Elixir de Oro Violeta en el corazón de un nido de dragón. Es imprescindible la Orquídea del Alma de Amatista Celestial, que solo puede obtenerse del [UmbraGlossary('heavenly_flower_garden')]. Para los demás ingredientes, podrías mezclar el contenido de otras pociones y extraer las propiedades de objetos potentes. Alternativamente, los pactos con ciertos espíritus podrían proporcionar los componentes y la magia necesarios."
 elixir_of_eternal_life_stage1_external_phase3_decision_tooltip: "Este elixir tiene unos requisitos de ingredientes bastante inusuales."
 elixir_of_eternal_life_stage1_external_phase3_decision_confirm: "Deja los pétalos en un baño de vino de hierba durante..."
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_health: "Tiene un modificador de artefacto que da un impulso sustancial a la [health|E] o anula sustancialmente las penalizaciones de [health|E], sin contar las bonificaciones acumuladas de varias instancias del mismo modificador"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_diplomacy: "Tiene un modificador de artefacto que aumenta sustancialmente la [diplomacy|E] o anula sustancialmente las penalizaciones de [diplomacy|E], sin contar las bonificaciones acumuladas de varias instancias del mismo modificador"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_martial: "Tiene un modificador de artefacto que aumenta sustancialmente la [martial|E] o anula sustancialmente las penalizaciones de [martial|E], sin contar las bonificaciones acumuladas de varias instancias del mismo modificador"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_stewardship: "Tiene un modificador de artefacto que aumenta sustancialmente la [stewardship|E] o anula sustancialmente las penalizaciones de [stewardship|E], sin contar las bonificaciones acumuladas de varias instancias del mismo modificador"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_intrigue: "Tiene un modificador de artefacto que aumenta sustancialmente la [intrigue|E] o anula sustancialmente las penalizaciones de [intrigue|E], sin contar las bonificaciones acumuladas de varias instancias del mismo modificador"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_learning: "Tiene un modificador de artefacto que aumenta sustancialmente el [learning|E] o anula sustancialmente las penalizaciones de [learning|E], sin contar las bonificaciones acumuladas de varias instancias del mismo modificador"

 elixir_of_eternal_life_stage1_nourishing_phase1_decision: "Una Visión, un Propósito"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_desc: "Antes de poder nutrir su [Concept('POD_elixir_of_eternal_life', 'vida interior')|E], hay que nutrir la vida de quienes nos rodean. A diferencia de los que respiran con fuelle, un verdadero seguidor del Tao busca la inmortalidad junto a su familia y su comunidad, y en beneficio de ellas. Una sola mano se esfuerza donde muchas manos construyen, y la vida sin fin nace de una conexión fructífera con toda la creación. $elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_tooltip: "Mantengámonos como uno solo"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_confirm: "Juntos resistimos; solos caemos."
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_development: "Tu reino contiene al menos 100 de [development|E]"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_prisoners: "#bold No#! tienes [prisoners|E]"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_dread: "Tienes menos de #color_white 10#! de [dread|E]"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_vassals: "Todos tus vasallos poderosos tienen al menos #color_green 20#! de opinión sobre ti."

 elixir_of_eternal_life_stage1_nourishing_phase2_decision: "Alientos Unidos"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_desc: "Con las vidas de los demás mejoradas, es hora de volver la mirada hacia dentro, hacia el cultivo de tu vida interior. Debes generar un embrión interno que no se vea afectado por la muerte y sea la semilla de tu futuro renacimiento. Donde otros buscan refinar su aliento interior, tú conoces un camino alternativo. Para dar a luz un embrión, debes estimular e intercambiar tu chi con otra persona. El yin debe encontrarse con el yang."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_tooltip: "El yin debe encontrarse con el yang."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_confirm: "Dos alientos deben hacerse uno"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_relations: "Tienes al menos #color_white 1#! [spouse|E], [concubine|E] o [lover|E]"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_spouses_skills: "Todos tus [spouses|E] tienen un promedio de todas las habilidades de al menos #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_spouses_opinions: "Todos tus [spouses|E] tienen al menos #color_green 25#! de opinión sobre ti."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_concubines_skills: "Todas tus [concubines|E] tienen un promedio de todas las habilidades de al menos #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_concubines_opinions: "Todas tus [concubines|E] tienen al menos #color_green 25#! de opinión sobre ti."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_lovers_skills: "Todos tus [lovers|E] tienen un promedio de todas las habilidades de al menos #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_lovers_opinions: "Todos tus [lovers|E] tienen al menos #color_green 25#! de opinión sobre ti."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_high_skill: "Al menos #color_white 1#! [spouse|E], [concubine|E] o [lover|E] tiene un promedio de todas las habilidades de al menos #color_white 25#!."

 elixir_of_eternal_life_stage1_nourishing_phase3_decision: "Destino sin Viaje"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_desc: "Una meta perseguida nunca se alcanza. El sabio no actúa, y sin embargo nada queda sin hacer. Enraizadas en la quietud, las innumerables cosas florecen. La riqueza y la vida fluyen y no se atesoran. Como el agua, el sabio beneficia a toda vida sin ser notado. Fluye incluso hasta los lugares más humildes donde nadie elige estar, inalterable y constante, pero capaz de remodelar el paisaje."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_tooltip: "Sin actuar, nada queda sin hacer"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_confirm: "Podría actuar, pero elijo no hacerlo"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_child_count: "Tienes al menos #color_white 5#! hijos"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_friends_skills: "Todos tus [friends|E] tienen un promedio de todas las habilidades de al menos #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_friends_lowborn: "Al menos #color_white 1#! [friend|E] es [lowborn|E] o tiene un [prestige_level|E] de @prestige_level_1_icon! [GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L] o inferior."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_income: "Tienes unos [income|E] de [gold_i] [gold|E] de al menos #color_white 10#!."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_gold_hoard: "Tienes como máximo [gold_i] #color_white 250#! de [gold|E]."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_lifestyle_perks: "La suma de puntos de ventaja sin gastar de [diplomacy_lifestyle|E], [martial_lifestyle|E], [stewardship_lifestyle|E], [intrigue_lifestyle|E] y [learning_lifestyle|E] es de al menos #color_white 10#!"

 elixir_of_eternal_life_stage2_meditation_decision: "Meditaciones sobre la Eternidad"
 elixir_of_eternal_life_stage2_meditation_decision_tooltip: "Meditar sobre lo que has aprendido podría profundizar tu comprensión."
 elixir_of_eternal_life_stage2_meditation_decision_desc: "Aunque la investigación y el estudio son importantes, nada supera a meditar en reclusión sobre las lecciones aprendidas. El camino que queda puede ser lento y exigente, pues no es cosa sencilla considerar asuntos tan profundos. Sin embargo, las enseñanzas se reforzarán y los conceptos se refinarán."
 elixir_of_eternal_life_stage2_meditation_decision_confirm: "Es hora de cultivarse."
 elixir_of_eternal_life_stage2_meditation_decision_effect: "Elegirás un lugar donde meditar y harás un [journey|E] hasta allí"

 elixir_of_eternal_life_stage4_internal_decision: "Equilibrio Perfecto"
 elixir_of_eternal_life_stage4_internal_decision_tooltip: "Me equilibraré antes de aquietar por fin mi corazón."
 elixir_of_eternal_life_stage4_internal_decision_desc: "Cuando llegue el momento, completarás lo que empezaste hace tanto tiempo. A partir del aniversario de tu concepción, desatarás los nudos de la muerte. Con el paso del tiempo, tu corazón, bazo, pulmones, hígado y riñones se volverán como jade. A la hora de tu nacimiento, aquietarás tu corazón con solo un pensamiento. Así se cortarán tus ataduras físicas, pues lo que está encadenado a lo terrenal nunca puede volverse celestial. Así ascenderá tu espíritu, pues lo que es mortal nunca puede refinarse de verdad. Si los Ocho Inmortales tienen a bien concederte el Elixir, volverás con una nueva forma digna de un siervo del Augusto Personaje de Jade.\n\n#N Si fracasas, los Ocho Inmortales no te concederán otra audiencia durante cien años, lo que garantizará tu crecimiento.#!"
 elixir_of_eternal_life_stage4_internal_decision_confirm: "Me aislaré."
 #elixir_of_eternal_life_stage4_internal_decision_skills: "No [skill|E] is more than #color_white 15#! above the average of your [skills|E] #weak ([GetPlayer.MakeScope.ScriptValue('average_of_all_skills')])#!"
 elixir_of_eternal_life_stage4_internal_decision_skills: "Tu Yang ([diplomacy_i][diplomacy|E] + [martial_i][martial|E]) #bold no#! está más de un #color_white 15%#! por encima ni por debajo del promedio de tu Yin ([intrigue_i][intrigue|E] + [stewardship_i][stewardship|E])"

 elixir_of_eternal_life_stage4_external_decision: "Elaborar el Elixir de Nueve Ciclos"
 elixir_of_eternal_life_stage4_external_decision_tooltip: "Elaboraré el elixir perfecto para poder hablar con los Ocho Inmortales."
 elixir_of_eternal_life_stage4_external_decision_desc: "Ha llegado el momento de elaborar el último elixir necesario. Tendrás que escalar el pico más alto en un día propicio y preparar a la perfección un elixir hecho con muchos ingredientes exóticos, incluidos componentes de criaturas pretéritas. No puede haber ningún error. No son posibles las pruebas previas. Quienes los Ocho Inmortales juzguen justos regresarán a un cuerpo renovado.\n\n#N Si fracasas, los Ocho Inmortales no te concederán otra audiencia durante cien años, lo que garantizará tu crecimiento.#!"
 elixir_of_eternal_life_stage4_external_decision_confirm: "Comencemos el ascenso."
 elixir_of_eternal_life_stage4_external_decision_bygones: "Tienes al menos 3 [POD_bygones_maa|E] Mayores o Potentes distintas #weak ([GetPlayer.MakeScope.ScriptValue('number_maa_regiments_greater_and_potent_bygones')])#!"
 elixir_of_eternal_life_stage4_external_decision_dragon_nest: "Controlas directamente uno de los Nidos de Dragón únicos"

 elixir_of_eternal_life_stage4_nourishing_decision: "Dar a Luz al Inmortal Embrionario"
 elixir_of_eternal_life_stage4_nourishing_decision_tooltip: "Juntos comenzaremos el ritual de trascendencia."
 elixir_of_eternal_life_stage4_nourishing_decision_desc: "No trasciendes solo; otros asisten a tu renacimiento. Cuando llegue el momento, tu coterie de confianza iniciará el ritual de trascendencia, bastante íntimo. Después de que te mates con un arma ceremonial que tú mismo hayas elaborado y que desaloja la sede de tu vida, ellos continuarán el ritual. Pintarán símbolos en tu cadáver, te vestirán con una prenda especial y colocarán tu cuerpo sobre el lugar de chi. Hasta que el sol vuelva a ponerse o a salir, meditarán, rezarán y entonarán cánticos para preparar el camino de tu regreso. Sin duda volverás triunfante, tras haber conmovido a los Ocho Inmortales.\n\n#N Si fracasas, los Ocho Inmortales no te concederán otra audiencia durante cien años, lo que garantizará tu crecimiento.#!"
 elixir_of_eternal_life_stage4_nourishing_decision_confirm: "Preparar el ritual."
 elixir_of_eternal_life_stage4_nourishing_decision_coterie_size: "Tu [GetPlayer.Custom('PODCoterie')] tiene [EmptyScope.ScriptValue('coterie_max_size')] miembros"
 elixir_of_eternal_life_stage4_nourishing_decision_coterie_skills: "Tu [GetPlayer.Custom('PODCoterie')] debe tener al menos 25 en todas las [skills|E]"
 elixir_of_eternal_life_stage4_nourishing_decision_wu_shi: "Poseer y equipar el [artifact|E] [GetPODArtifactName('wu_shi_link')]"
 elixir_of_eternal_life_stage4_nourishing_decision_demon_jade: "Poseer y equipar el [artifact|E] [GetPODArtifactName('demon_jade_talisman_link')]"

 elixir_of_eternal_life_stage4_infernalist_decision: "El Campo de Formación"
 elixir_of_eternal_life_stage4_infernalist_decision_tooltip: "Con la ayuda del Maestro Más Generoso, puedes entrar en su dominio"
 elixir_of_eternal_life_stage4_infernalist_decision_desc: "El Maestro Más Sabio tiene planes. A diferencia de los esclavos akuma, tú estás verdaderamente vivo, no eres un mero fantasma que anima carne muerta, lo que ofrece muchas oportunidades. El Maestro Más Prudente proclama que hacen falta más como tú. Muchos mortales buscan la vida eterna. Por medio del Maestro Más Generoso la obtienen al mero precio de un servicio tan eterno como sus nuevas vidas. Sin embargo, tales individuos necesitarán un espacio en el que prepararse dentro del dominio del Maestro Más Poderoso, para ser fortalecidos por el chi vital del Maestro Más Potente y así poder regresar a la vida, y para ser instruidos si los necios fallan al Maestro Más Misericordioso. El Maestro Más Generoso te ha regalado una fórmula alquímica para que puedas descender al dominio del Maestro Más Pujante y abrir ese espacio."
 elixir_of_eternal_life_stage4_infernalist_decision_confirm: "El Maestro Más Exaltado me aguarda"
 elixir_of_eternal_life_stage4_infernalist_decision_effect: "Entrarás en el reino del Maestro Más Soberano"
 elixir_of_eternal_life_stage4_infernalist_decision_success: "El Maestro Más Generoso concede un gran poder"
 elixir_of_eternal_life_stage4_infernalist_decision_failure: "La decepción del Maestro Más Temible perdura durante mucho tiempo"

 elixir_of_eternal_life_stage4_success_eoel_caveat: "Recibirás el Elixir de la Vida Eterna completo si lo logras"
 POD_mummy_elixir_of_eternal_life_wutian: "Obtienes la capacidad de crear Momias Wu T'ian"
 POD_mummy_elixir_of_eternal_life_wukuei: "Obtienes la capacidad de crear Momias Wu Kuei"
