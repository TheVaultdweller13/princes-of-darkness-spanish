 spell_of_life_correcting_your_form_decision: "Corregir Tu Forma"
 spell_of_life_correcting_your_form_decision_desc: "Has obtenido una vida más larga mediante una forma incompleta de magia que concede la inmortalidad. A medida que tu conocimiento de esa magia ha aumentado, surge la posibilidad de corregir tu forma, por lo demás defectuosa, y mejorar tu actual fuente de inmortalidad. Por desgracia, tales magias solo te permiten mejorar tu propia forma en lugar de potenciar los cuerpos defectuosos de otros."
 spell_of_life_correcting_your_form_decision_confirm: "Nada me detendrá"
 spell_of_life_correcting_your_form_decision_tooltip: "Tu inmortalidad podría necesitar algunas mejoras"
