 spell_of_life_starter_decision: "Búsqueda del [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E]"
 spell_of_life_starter_decision_desc: "Muchos han buscado un medio de renacimiento eterno, una forma pura de inmortalidad libre de las debilidades y maldiciones que acarrean las demás opciones. Un método probado, el Hechizo de la Vida, es el que emplean las #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Momias#!#! de occidente. Aunque quizá sea una empresa que lleve toda una vida y debas estar preparado para sacrificarlo todo, la búsqueda de la verdadera inmortalidad puede merecer la pena.\n\n#R Tus probabilidades de éxito en esta búsqueda son absurdamente bajas. No lo intentes si aprecias el bienestar de tu personaje.\nIncluso guardar y recargar la partida para tentar a la suerte no te salvará más adelante. Estás advertido.#!"
 spell_of_life_starter_decision_tooltip: "El Hechizo de la Vida podría concedernos la inmortalidad sin inconvenientes."
 spell_of_life_starter_decision_confirm: "Empecemos"
 spell_of_life_starter_decision_requirement_you: "Tienes al menos @skill_learning_icon!#color_white 25#! de [learning|E], eres [GetTrait('erudite').GetName(GetNullCharacter)], eres un [GetTrait('sorcerer').GetName(GetNullCharacter)] o eres un [GetTrait('theurgist').GetName(GetNullCharacter)]"
 spell_of_life_starter_decision_requirement_courtiers: "Tienen al menos @skill_learning_icon!#color_white 15#! de [learning|E], son [GetTrait('erudite').GetName(GetNullCharacter)], son un [GetTrait('sorcerer').GetName(GetNullCharacter)] o son un [GetTrait('theurgist').GetName(GetNullCharacter)]"
 spell_of_life_starter_decision_requirement_sorcery_of_life: "Tienes la [perk|E] [GetPerk('the_sorcery_of_life_perk').GetName(GetPlayer)] #weak ($blood_magic_revelations_of_duat_visible$)#!"
 spell_of_life_starter_decision_requirement_hand_of_heka: "Tienes la [perk|E] [GetPerk('hand_of_heka_perk').GetName(GetPlayer)] #weak ($blood_magic_divine_hand_visible$)#!"
 spell_of_life_starter_decision_requirement_dark_invocation: "Tienes la [perk|E] [GetPerk('dark_invocation_perk').GetName(GetPlayer)] #weak ($blood_magic_immanence_of_set_visible$)#!"
 spell_of_life_starter_decision_requirement_mutate: "Tienes la [perk|E] [GetPerk('mutate_perk').GetName(GetPlayer)] #weak ($blood_magic_alchemy_visible$)#!"
 spell_of_life_starter_decision_requirement_power_over_life: "Tienes la [perk|E] [GetPerk('power_over_life_perk').GetName(GetPlayer)] #weak ($blood_magic_conjuring_visible$)#!"
 spell_of_life_starter_decision_requirement_duality: "Tienes la [perk|E] [GetPerk('duality_perk').GetName(GetPlayer)] #weak ($blood_magic_spirit_manipulation_visible$)#!"
 spell_of_life_stage1_unlock_next_phase: "Desbloquea el siguiente paso del camino actual"
 spell_of_life_stage1_unlock_next_phase_caveat: "$spell_of_life_stage1_unlock_next_phase$ si lo logras"
 spell_of_life_stage1_do_multiple_stages: "#help \n\nAunque es más difícil, puede que completar un camino ofrezca recompensas adicionales más adelante.#!"
 spell_of_life_stage1_warning: "\n\n#R ¡Prepárate para sacrificarlo todo en la búsqueda de la verdadera inmortalidad, pues el camino está plagado de peligros!#!"
 spell_of_life_stage1_hide_requirement: ""
 spell_of_life_stage1_decision_completion_message_title: "Tu Comprensión se Profundiza"
 spell_of_life_stage1_decision_completion_message_desc: "Has desbloqueado el siguiente objetivo de este camino"

 spell_of_life_stage1_horus_phase1_decision: "Ganarse una Audiencia"
 spell_of_life_stage1_horus_phase1_decision_desc: "El precepto 6 del Código de Horus dice: «No busques crear a otros como nosotros». Convencerlo de que lo quebrante es casi imposible. Sin embargo, los beneficios son incalculables, pues es el único poseedor del [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E] completo e impecable. Antes de poder convencerlo, tenemos que ganarnos una audiencia con él. Quizá baste un regalo. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_horus_phase1_decision_tooltip: "Para convencer a Horus, necesitamos ganarnos una audiencia con él."
 spell_of_life_stage1_horus_phase1_decision_confirm: "¡Te regalamos... el Alto Egipto!"
 spell_of_life_stage1_horus_phase1_decision_cairo: "Tú o [GetScriptedCharacterByHistoryID('792593').GetFirstName] [completely_control|E] [GetTitleByKey('d_cairo').GetNameNoTier]"
 spell_of_life_stage1_horus_phase1_decision_delta: "Tú o [GetScriptedCharacterByHistoryID('792593').GetFirstName] [completely_control|E] [GetTitleByKey('d_delta').GetNameNoTier]"
 spell_of_life_stage1_horus_phase1_decision_alexandria: "Tú o [GetScriptedCharacterByHistoryID('792593').GetFirstName] [completely_control|E] [GetTitleByKey('d_alexandria').GetNameNoTier]"

 spell_of_life_stage1_horus_phase2_decision: "Un Gran Debate"
 spell_of_life_stage1_horus_phase2_decision_desc: "Si logramos hacernos amigos de Horus, nuestro regalo o nuestro servicio previo deberían bastar para ganarnos una audiencia con él. No será fácil, pero nadie sabe más del [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E] que él."
 spell_of_life_stage1_horus_phase2_decision_tooltip: "Nuestro regalo nos ha granjeado una audiencia. Aprovechémosla al máximo."
 spell_of_life_stage1_horus_phase2_decision_confirm: "Partir hacia su corte"

 spell_of_life_stage1_horus_phase3_decision: "Demostrar Nuestra Valía"
 spell_of_life_stage1_horus_phase3_decision_desc: "Nuestros argumentos convencieron a Horus, que se dignó concedernos la oportunidad de demostrar que somos aliados leales a su causa. Los Hijos de Set y los traidores deben caer ante nuestra hoja. Solo entonces Horus nos ayudará en nuestra búsqueda del Hechizo de la Vida, aunque no nos lo dará completo. Solo adquiriéndolo nosotros mismos podremos demostrar que somos dignos de usarlo."
 spell_of_life_stage1_horus_phase3_decision_tooltip: "Para recibir el conocimiento de Horus, debemos demostrar que somos dignos"
 spell_of_life_stage1_horus_phase3_decision_confirm: "Y así las arenas se tiñeron de rojo..."
 spell_of_life_stage1_horus_phase3_decision_no_emperor_requirement: "Ningún #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Setita#!#! ni seguidor de una [faith|E] con la [doctrine|E] [GetFaithDoctrine('special_doctrine_set_pillars_kindred').GetBaseName] o [GetFaithDoctrine('special_doctrine_set_corrupted_kindred').GetBaseName] puede poseer un [title|E] de Imperio"
 spell_of_life_stage1_horus_phase3_bonus_xp: "Cada vez que completes un [journey|E], las intuiciones de Horus te otorgan #color_white 5.00#! de [trait_level_track_xp|E] adicionales en el Hechizo de la Vida #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"
 spell_of_life_stage1_horus_phase3_decision_effect: "Con el tiempo, tu relación con él puede permitirte entrar en el [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]"

 spell_of_life_stage1_kemintiri_phase1_decision: "Restaurar los Recuerdos Perdidos"
 spell_of_life_stage1_kemintiri_phase1_decision_desc: "Antaño sacerdotisa de Isis y poseedora del [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E], Kemintiri perdió mucho durante su estancia bajo los #EMP tiernos cuidados#! de Set. Si pudiéramos ganarnos su confianza y recuperar restos de su vida pasada, quizá lográramos ayudarla a restaurar algunos de esos recuerdos perdidos. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_kemintiri_phase1_decision_tooltip: "Kemintiri conoció una vez el Hechizo de la Vida. Quizá pueda recordarlo..."
 spell_of_life_stage1_kemintiri_phase1_decision_confirm: "Hablo de los albores del tiempo..."
 
 spell_of_life_stage1_kemintiri_phase2_decision: "Amigos Perdidos Hace Mucho"
 spell_of_life_stage1_kemintiri_phase2_decision_desc: "Al leer un artefacto que ella ayudó a escribir, quedan demasiadas lagunas en los recuerdos de Kemintiri. Sin embargo, ha mencionado que otros han intentado ayudarla en el pasado, y sabes que muchas historias de su pasado sobreviven en ciertas tradiciones. Si pudiéramos contactar con estas personas y ganarnos su confianza, quizá podrían restaurar lo que Kemintiri ha perdido, incluido el conocimiento del [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E]."
 spell_of_life_stage1_kemintiri_phase2_decision_tooltip: "No somos los primeros en intentar ayudar a Kemintiri. Quizá los otros puedan sernos útiles."
 spell_of_life_stage1_kemintiri_phase2_decision_confirm: "Mucho de lo que fue se ha perdido, pero esto permanece..."
 spell_of_life_stage1_kemintiri_phase2_decision_osiris_requirement: "Un miembro de la [house|E] [GetDynastyHouseByID('house_osiris').GetName] es tu [friend|E], [best_friend|E], miembro de tu [coterie|E], [lover|E] o [soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_bubasti_requirement: "Un [GetFaithByKey('bubasti').GetName] es tu [friend|E], [best_friend|E], miembro de tu [coterie|E], [lover|E] o [soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_sobek_requirement: "Un #TOOLTIP:FAITH,children_sobek #L Hijo de Sobek#!#!#! es tu [friend|E], [best_friend|E], miembro de tu [coterie|E], [lover|E] o [soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_silent_strider_requirement: "Un #TOOLTIP:RELIGION,silentstrider_religion #L Caminante Silencioso#!#!#! es tu [friend|E], [best_friend|E], miembro de tu [coterie|E], [lover|E] o [soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_khetamon_requirement: "[GetScriptedCharacterByHistoryID('791151').GetFirstName], que estuvo cerca de sanar la psique de Kemintiri, está activo y o bien está en tu [court|E] o bien es tu [friend|E], [best_friend|E], miembro de tu [coterie|E], [lover|E] o [soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_effect: "[GetScriptedCharacterByHistoryID('790512').GetFirstName] aprenderá el Hechizo de la Vida"

 spell_of_life_stage1_kemintiri_phase3_decision: "La Venganza es un Plato que se Sirve Frío"
 spell_of_life_stage1_kemintiri_phase3_decision_desc: "Aunque la mayoría de sus recuerdos han vuelto y recuerda lo bastante del [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E] para ayudarnos, Kemintiri nos ha informado de que no puede dedicar tiempo a enseñarnos hasta que haya obtenido su venganza. Ta-urt y toda su [house|E] deben ser aniquiladas. Solo entonces dirigirá su atención a otros asuntos."
 spell_of_life_stage1_kemintiri_phase3_decision_tooltip: "Kemintiri necesita venganza antes de estar dispuesta a enseñarnos"
 spell_of_life_stage1_kemintiri_phase3_decision_confirm: "Primero la venganza, luego las lecciones"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed: "Ningún miembro vampírico de la [house|E] [GetDynastyHouseByID('house_tawaret').GetName] es [ruler|E]."
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed_ex: "$spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed$ #weak ([landed_tawaret_example.GetFirstName])#!"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living: "5 o menos miembros de la [house|E] [GetDynastyHouseByID('house_tawaret').GetName] siguen vivos, activos y son vampiros."
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living_ex: "$spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living$ #weak ([living_tawaret_example.GetFirstName])#!"
 spell_of_life_stage1_kemintiri_phase3_decision_effect: "Con el tiempo, tu relación con ella puede permitirte entrar en el [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]"

 spell_of_life_stage1_cabirus_phase1_decision: "Leer los Escritos Secretos de Cabirus"
 spell_of_life_stage1_cabirus_phase1_decision_desc: "Los Escritos Secretos de Cabirus son una versión completa, aunque mal traducida, del libro original de Cabirus. No obstante, describen el funcionamiento interno del [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E] de Osiris y podrían aportar intuiciones útiles si tuviéramos acceso a ellos y los conocimientos para aprovecharlos. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_cabirus_phase1_decision_alt_desc: "Los Escritos Secretos de Cabirus fueron en su día una versión completa, aunque mal traducida, del libro original de Cabirus. Antes de su destrucción, describían el funcionamiento interno del [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E] de Osiris y podrían haber aportado intuiciones útiles, razón por la que Horus se encargó de destruirlos.\n\nAunque el manuscrito original se ha perdido, sobreviven fragmentos en forma de papiros deteriorados, pergaminos de vitela dañados, palimpsestos, extractos en tiestos, inscripciones en edificios en ruinas, relatos orales, libros de texto y leccionarios de magos, comentarios y debates transcritos. Si se reúnen los suficientes, una crítica textual adecuada podría permitir reconstruir los escritos de Cabirus. $spell_of_life_stage1_do_multiple_stages$"
 spell_of_life_stage1_cabirus_phase1_decision_tooltip: "Si pudiéramos traducir los escritos de Cabirus, obtendríamos algunas intuiciones."
 # Those are accurate translations for that bohairic coptic word, though I did have to transliterate it into latin characters to be displayed properly
 spell_of_life_stage1_cabirus_phase1_decision_confirm: "¿«Ebol» significa «salir» o «muerte»?"
 spell_of_life_stage1_cabirus_phase1_decision_alt_confirm: "Pocos conocimientos están verdaderamente fuera de toda recuperación."
 spell_of_life_stage1_cabirus_phase1_decision_writing_access: "Tener acceso a [GetPODArtifactName('writings_cabirus_link')]"
 spell_of_life_stage1_cabirus_phase1_decision_university: "Uno de tus [counties|E] tiene un [building|E] universitario, [GetBuilding('black_college_01').GetName], [GetBuilding('library_malta_01').GetName], [GetBuilding('vienna_chantry_01').GetName], [GetBuilding('erciyes_01').GetName] o una de sus versiones mejoradas"

 request_access_writings_cabirus_decision: "Solicitar Acceso a los Escritos Secretos de Cabirus"
 request_access_writings_cabirus_decision_desc: "Para proseguir nuestra investigación sobre los medios de renacimiento eterno, necesitaremos acceso a los Escritos Secretos de Cabirus. Por fortuna, podemos convencer a su actual propietario o usar nuestra influencia para exigir el acceso. Sin embargo, quizá nos pida un precio por ello."
 request_access_writings_cabirus_decision_tooltip: "Quizá podríamos solicitar el acceso en lugar de robarlos"
 request_access_writings_cabirus_decision_confirm: "Oigamos el precio"
 request_access_writings_cabirus_decision_effect: "Obtienes acceso a [GetPODArtifactName('writings_cabirus_link')]"

 spell_of_life_stage1_cabirus_phase2_decision: "Hablar con Cabirus"
 spell_of_life_stage1_cabirus_phase2_decision_desc: "Los libros no pueden competir con el autor original. Si lográramos convencer a [GetScriptedCharacterByHistoryID('792600').GetFirstName] de que nos ayude apelando a su lado académico, podríamos aprender muchísimo sobre el [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E]. Dicho esto, necesitaremos aprender más sobre magia si esperamos comprender sus lecciones."
 spell_of_life_stage1_cabirus_phase2_decision_tooltip: "Los libros no pueden competir con el original."
 spell_of_life_stage1_cabirus_phase2_decision_confirm: "Hablemos con él"
 
 spell_of_life_stage1_cabirus_phase3_decision: "Aliviar la Presión"
 spell_of_life_stage1_cabirus_phase3_decision_desc: "Los Tremere cercanos están ocupando demasiado tiempo de Cabirus con sus propias búsquedas de la inmortalidad, obligándolo a trasladarse constantemente. Si debilitáramos su influencia, tendría más tiempo para ayudarnos, aunque sus preocupaciones respecto a Horus le impedirían darnos el Hechizo de la Vida completo."
 spell_of_life_stage1_cabirus_phase3_decision_tooltip: "Cabirus está sometido a demasiada presión por parte de los Tremere"
 spell_of_life_stage1_cabirus_phase3_decision_confirm: "Volvamos a nuestras lecciones"
 spell_of_life_stage1_cabirus_phase3_decision_no_emperor_requirement: "Ningún #TOOLTIP:GAME_TRAIT,tremere,[GetNullCharacter] #L Tremere#!#! ni seguidor de una [faith|E] [GetReligionByKey('codeoftremere_religion').GetName] puede poseer un [title|E] de Imperio"
 spell_of_life_stage1_cabirus_phase3_decision_effect: "Con el tiempo, tu relación con él puede permitirte entrar en [UmbraGlossary('hades')]"

 spell_of_life_stage1_setite_phase1_decision: "Experimentos Iniciales de Renacimiento"
 spell_of_life_stage1_setite_phase1_decision_desc: "Aunque puede haber varias vías para lograr el renacimiento eterno, el [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E] es un método probado. Si bien todos los demás lo recibieron como regalo, esos regalos no son la única forma de obtenerlo. Como han intentado antes que tú Set y otros, con suficiente experimentación y sujetos de prueba, quizá logremos recrearlo por nuestra cuenta.$spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_setite_phase1_decision_tooltip: "Los experimentos continuarán hasta que mejore mi ánimo"
 spell_of_life_stage1_setite_phase1_decision_confirm: "Que comiencen los experimentos..."
 spell_of_life_stage1_setite_phase1_decision_bean_nighe_caul: "Tener equipada la $artifact_bean_nighe_caul_name$"
 spell_of_life_stage1_setite_phase1_decision_mummy_prisoner: "Tener al menos #color_white 1#! [prisoner|E] que sea una [GetTrait('mummy').GetName(GetNullCharacter)]."
 spell_of_life_stage1_setite_phase1_decision_sorcery_prisoner: "Tener al menos #color_white 5#! [prisoners|E] que #italic podrían#! aprender #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#! #weak ([GetTrait('bastet').GetName(GetNullCharacter)] o [mortal_like_splats|E])#!"
 spell_of_life_stage1_setite_phase1_decision_execution_effect: "Todos los prisioneros usados en nuestros experimentos morirán"

 spell_of_life_stage1_setite_phase2_decision: "Convocar el Consejo"
 spell_of_life_stage1_setite_phase2_decision_desc: "Perseguir el [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E] no es empresa menor y exigirá gran parte de nuestra atención. Si lográramos el apoyo de nuestros congéneres, tendríamos más tiempo y más recursos que dedicar a nuestros esfuerzos. Incluso una promesa de no injerencia bastaría."
 spell_of_life_stage1_setite_phase2_decision_tooltip: "Quizá podamos obtener ayuda, o al menos evitar interferencias"
 spell_of_life_stage1_setite_phase2_decision_confirm: "¡Reunidlos!"
 spell_of_life_stage1_setite_phase2_decision_house_head: "#color_white Eres#! el cabeza de #color_white tu#! [house|E]"
 spell_of_life_stage1_setite_phase2_decision_dynasty_members: "Al menos #color_white 5#! miembros de tu [dynasty|E] poseen tierras"
 spell_of_life_stage1_setite_phase2_decision_faith_members: "Al menos #color_white 5#! seguidores de tu [faith|E] poseen tierras"
 spell_of_life_stage1_setite_phase2_decision_debate: "Si tienes al menos #color_white 5#! miembros de tu [dynasty|E] o [faith|E], los invitarás a un consejo."

 spell_of_life_stage1_setite_phase3_decision: "Experimentos Avanzados de Renacimiento"
 spell_of_life_stage1_setite_phase3_decision_desc: "Nos estamos acercando, muy cerca de la siguiente fase de comprensión. Sin embargo, algo en el núcleo del Hechizo de la Vida aún se nos escapa. Claramente, necesitamos más textos, más recursos y más sujetos de prueba. Pero el coste es irrelevante. ¿Qué son unas pocas vidas comparadas con toda la eternidad, mi eternidad?"
 spell_of_life_stage1_setite_phase3_decision_tooltip: "Con suficientes pruebas y un excedente de vidas prescindibles, hasta lo imposible se vuelve plausible."
 spell_of_life_stage1_setite_phase3_decision_confirm: "Que continúen los experimentos..."
 spell_of_life_stage1_setite_phase3_decision_mummies_prisoner: "Tener al menos #color_white 3#! [prisoners|E] que sean $POD_splat_mummy_plural$."
 spell_of_life_stage1_setite_phase3_decision_sorcerer_prisoner: "Tener al menos #color_white 3#! [prisoners|E] que sean [GetTrait('sorcerer').GetName(GetNullCharacter)] o [GetTrait('theurgist').GetName(GetNullCharacter)]."
 spell_of_life_stage1_setite_phase3_decision_sorcery_prisoner: "Tener al menos #color_white 10#! [prisoners|E] que #italic podrían#! aprender #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#! #weak ([GetTrait('bastet').GetName(GetNullCharacter)] o [mortal_like_splats|E])#!"
 spell_of_life_stage1_setite_phase3_decision_knowledgeable_people: "Encarcelar a cualquiera de #color_white 1#! entre [GetScriptedCharacterByHistoryID('792600').GetFirstName], [GetScriptedCharacterByHistoryID('792593').GetFirstName], [GetScriptedCharacterByHistoryID('790512').GetFirstName], [GetScriptedCharacterByHistoryID('792870').GetFirstName], [GetScriptedCharacterByHistoryID('792804').GetFirstName], [GetScriptedCharacterByHistoryID('792605').GetFirstName], un [GetTrait('ferryman').GetName(GetNullCharacter)] u otro personaje que conozca parte del Hechizo de la Vida #weak (Tener más de 15 de [trait_level_track_xp|E] en $trait_track_spell_of_life$ [GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)])#!."
 spell_of_life_stage1_setite_phase3_decision_knowledgeable_people_no_mummies: "Encarcelar a cualquiera de #color_white 1#! entre [GetScriptedCharacterByHistoryID('790512').GetFirstName], [GetScriptedCharacterByHistoryID('792870').GetFirstName], un [GetTrait('ferryman').GetName(GetNullCharacter)] u otro personaje que conozca parte del Hechizo de la Vida #weak (Tiene al menos 16 de [trait_level_track_xp|E] en $trait_track_spell_of_life$ [GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)])#!."
 spell_of_life_stage1_setite_phase3_decision_grand_city: "Poseer una [grand_city|E]"



 spell_of_life_stage1_setite_phase3_decision_big_3_prisoner: "Encarcelar a cualquiera de #color_white 1#! entre [GetScriptedCharacterByHistoryID('792600').GetFirstName], [GetScriptedCharacterByHistoryID('792593').GetFirstName], [GetScriptedCharacterByHistoryID('790512').GetFirstName] u otro personaje que haya conocido el Hechizo de la Vida completo."
 spell_of_life_stage1_setite_phase3_decision_big_3_prisoner_no_mummies: "Encarcelar a cualquiera de #color_white 1#! entre [GetScriptedCharacterByHistoryID('790512').GetFirstName] u otro personaje que haya conocido el Hechizo de la Vida completo."
