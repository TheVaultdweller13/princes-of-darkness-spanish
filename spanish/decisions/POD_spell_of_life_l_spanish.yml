 POD_newborn_mummy_modifier: "Recién Nacido"
 POD_newborn_mummy_modifier_desc: "#help Se perderá al morir#!\nEres nuevo en el mundo de las $POD_splat_mummy_plural$. Aún no has pasado por el ciclo del renacimiento ni llevas mucho tiempo en tu nueva forma."

 spell_of_life_give_to_horus_decision: "Entregar el Hechizo de la Vida a Horus"
 spell_of_life_give_to_horus_decision_desc: "El precepto 6 del Código de Horus prohíbe el uso del Hechizo de la Vida y la creación de nuevas momias. Si fueras un seguidor leal de Horus, le entregarías toda tu investigación y le permitirías borrar el conocimiento de tu memoria. Tal regalo probablemente te redimiría ante sus ojos por cualquier acto prohibido que hayas cometido. Además, Horus siempre ha recompensado las grandes hazañas en proporción a los servicios prestados."
 spell_of_life_give_to_horus_decision_confirm: "Solicitar una audiencia"
 spell_of_life_give_to_horus_decision_tooltip: "Un Shemsu-heru leal entregaría su Hechizo de la Vida"
 spell_of_life_decision_must_know_sol: "Conocer el Hechizo de la Vida completo #weak (Tener 100 de [trait_level_track_xp|E] en $trait_track_spell_of_life$ [GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)])#!"

 spell_of_life_give_to_kemintiri_decision: "Usar el Hechizo de la Vida con Kemintiri"
 spell_of_life_give_to_kemintiri_decision_desc: "Antaño sacerdotisa de Isis, Kemintiri fue Abrazada por Set solo para castigarla por su lealtad. Desde ese momento, ha dedicado buena parte de su tiempo a cazar Setitas. Leal a las enseñanzas de Isis, no estaba dispuesta a entregarte el Hechizo de la Vida solo por su propio bien. Sin embargo, dada tu amistad con ella y tu recién adquirido conocimiento del Hechizo, no sería difícil convencerla de que te deje lanzar el Hechizo de la Vida sobre ella."
 spell_of_life_give_to_kemintiri_decision_confirm: "Hablemos con la última sacerdotisa de Isis"
 spell_of_life_give_to_kemintiri_decision_tooltip: "Abrazada en su día para torturarla, Kemintiri podría interesarse por una forma de dejar atrás su vampirismo"

 spell_of_life_give_to_set_decision: "Entregar el Hechizo de la Vida a Set"
 spell_of_life_give_to_set_decision_desc: "Set ha pasado milenios buscando el Hechizo de la Vida y ha urdido un número increíble de intrigas para robarlo. Donde él fracasó, tú has triunfado y ahora tienes la oportunidad de dárselo. Siempre que seas lo bastante servil, te estará agradecido y te recompensará con generosidad en lugar de castigarte por celos."
 spell_of_life_give_to_set_decision_confirm: "Soy el siervo de Set"
 spell_of_life_give_to_set_decision_tooltip: "Set busca el Hechizo de la Vida, y tú tienes la oportunidad de dárselo."

 spell_of_life_give_to_apophis_decision: "Servir el Mundo en Bandeja de Oro"
 spell_of_life_give_to_apophis_decision_desc: "[UmbraGlossaryLocalized('oblivion','Apofis')] busca el Hechizo de la Vida. Sirve el Hechizo en un festín y observa cómo la magia del Hechizo de la Vida consume el mundo. Es hora de que [UmbraGlossaryLocalized('oblivion','Apofis')] se dé un festín con el mundo."
 spell_of_life_give_to_apophis_decision_confirm: "El fin está aquí"
 spell_of_life_give_to_apophis_decision_tooltip: "El festín de Apofis"
 spell_of_life_give_to_apophis_decision_prisoners: "Conseguir al menos #color_white 25#! prisioneros con al menos #color_white 50#! de [prowess|E] para darse un festín con ellos"

 spell_of_life_find_new_home_decision: "Encontrar un Nuevo Hogar"
 spell_of_life_find_new_home_decision_desc: "Tras una ardua investigación, has obtenido una versión del Hechizo de la Vida. Sin embargo, está diseñada para atar las almas a un [UmbraGlossary('shadow_realm')] distinto de aquel al que viajas tras la muerte. Aunque no puedes modificar el Hechizo de la Vida para que use el mismo [UmbraGlossary('shadow_realm')] que tu propia alma, deberías poder revincular tu alma a otro señorío volviendo a lanzar el Hechizo de la Vida sobre ti mismo, con una ligera modificación."
 spell_of_life_find_new_home_decision_confirm: "¡Por los nuevos comienzos!"
 spell_of_life_find_new_home_decision_tooltip: "Tu Hechizo de la Vida está atado a un Señorío de las Sombras distinto del de tu propia alma."

 spell_of_life_stabilize_new_realm_decision: "Estabilizar [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')]"
 spell_of_life_stabilize_new_realm_decision_desc: "A diferencia del más asentado [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], tu recién fundado [UmbraGlossary('shadow_realm')] carece de cierta estabilidad. La resurrección es un viaje peligroso con muchos riesgos. Sin jueces, pueden crearse nuevos Imperecederos que actúen sin supervisión. [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')] debe estabilizarse."
 spell_of_life_stabilize_new_realm_decision_confirm: "Empuñaré el mazo"
 spell_of_life_stabilize_new_realm_decision_tooltip: "Nuestro propio lugar para descansar"
 spell_of_life_stabilize_new_realm_decision_wraith_friends: "Tiene al menos 5 [friends|E] [GetTrait('wraith').GetName(GetNullCharacter)] u otras [relations|E] positivas"
 spell_of_life_stabilize_new_realm_decision_faith_followers: "Hay al menos 10 seguidores de [GetFaithByKey('custom_mummy_dynasty').GetName]"
 spell_of_life_stabilize_new_realm_decision_effect1: "Todas las $POD_splat_mummy_plural$ [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] dejarán de sufrir el doble de pérdida de Memoria tras la muerte"
 spell_of_life_stabilize_new_realm_decision_effect2: "Todas las $POD_splat_mummy_plural$ [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] obtendrán [GetTrait('integrity').GetName(GetNullCharacter)]"

 spell_of_life_preserving_roots_decision: "Preservar Nuestras Raíces"
 spell_of_life_preserving_roots_decision_desc: "[GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')] se fundó sobre una cultura determinada dentro de una tierra determinada, e infundió esas características a [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] y ató de forma irreversible el [UmbraGlossary('shadow_realm')] a esa memoria cultural concreta. Sin embargo, con cada año que pasa, lo que fue una gran civilización se va perdiendo lentamente en las arenas del tiempo. No podemos permitirlo, pues nuestros recuerdos son lo que nos hace humanos y lo que preserva nuestro nuevo hogar."
 spell_of_life_preserving_roots_decision_confirm: "Permanecer en la mente de los mortales"
 spell_of_life_preserving_roots_decision_tooltip: "Manteniendo nuestros corazones vivos"
 spell_of_life_preserving_roots_decision_custom1: "Debe haber al menos #V 10#! condados con tu [culture|E]"
 spell_of_life_preserving_roots_decision_custom2: "Debe haber al menos #V 5#! gobernantes $POD_splat_mummy$ de tu [culture|E]"
 spell_of_life_preserving_roots_decision_effect1: "Las $POD_splat_mummy_plural$ [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] resucitarán el doble de rápido #weak (5 años en lugar de 10)#!"

 spell_of_life_establish_ourselves_decision: "La Quinta Dinastía"
 spell_of_life_establish_ourselves_decision_desc: "Redescubrimos el Hechizo de la Vida. Creamos un nuevo [UmbraGlossary('shadow_realm')], [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')]. Fundamos [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] a partir de ese Hechizo, con sede en ese señorío. Sin embargo, los Shemsu-Heru, los Ismaelitas, los Cabiri y los Apepnu nos ven como poco más que advenedizos que se inmiscuyen en un juego que somos demasiado jóvenes para comprender.\n\nQué poco saben. Superaremos a los antiguos necios. ¡Demostraremos que somos dignos de contarnos entre ellos!"
 spell_of_life_establish_ourselves_decision_confirm: "¡Somos la Quinta Dinastía!"
 spell_of_life_establish_ourselves_decision_tooltip: "Hoy, advenedizos. ¡Mañana, conquistadores!"
 spell_of_life_establish_ourselves_decision_custom1: "Debe haber al menos #V 25#! condados con la [faith|E] [GetFaithByKey('custom_mummy_dynasty').GetName]"
 spell_of_life_establish_ourselves_decision_custom2: "Debe haber al menos #V 5#! gobernantes $POD_splat_mummy$ [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)]"
 spell_of_life_establish_ourselves_decision_effect1: "Todas las $POD_splat_mummy_plural$ [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] obtendrán [GetModifier('custom_mummy_dynasty_secured_future_modifier').GetNameWithTooltip]"

 spell_of_life_joining_the_league_decision: "Unirse a la Liga"
 spell_of_life_joining_the_league_decision_desc: "Aunque apoyas su causa, Horus no te perdonará la existencia. Sin embargo, existen alternativas.\n\nLa última vez que estuvo ausente durante un tiempo, sus seguidores se corrompieron y empezaron a perder la guerra. Si eso volviera a ocurrir, te acogerían con los brazos abiertos, y a su regreso, Horus podría mostrarse reacio a expulsarte. Quizá pudieras apresurar las cosas."
 spell_of_life_joining_the_league_decision_confirm: "Gracias por vuestra bienvenida"
 spell_of_life_joining_the_league_decision_tooltip: "Deberíamos considerar unirnos a la Liga Osiriana"
 spell_of_life_joining_the_league_decision_custom1: "No debe haber ningún [GetTrait('shemsuheru').GetName(GetPlayer)] $POD_splat_mummy_plural$ de la [faith|E] [GetFaithByKey('code_of_horus').GetName] cuya [opinion|E] sobre ti sea inferior a #V 25#!"
 spell_of_life_joining_the_league_decision_custom1_ex: "$spell_of_life_joining_the_league_decision_custom1$ #weak ([example.GetFirstName])#!"

 spell_of_life_ending_the_hunt_decision: "El Fin de la Cacería"
 spell_of_life_ending_the_hunt_decision_desc: "Demasiados buscan tu cabeza, tu conocimiento o ambas cosas. Si lograras eliminar a los líderes de las facciones más poderosas y a la mayoría de los buscadores, podrías poner fin a esta amenaza para tu existencia. Ya no tendrías que estar mirando constantemente por encima del hombro, esperando al siguiente grupo que te dé caza. Como beneficio añadido, la muerte de individuos tan críticos sumiría a sus facciones en el caos, dejándote margen para asegurar tu poder."
 spell_of_life_ending_the_hunt_decision_confirm: "Paz por fin..."
 spell_of_life_ending_the_hunt_decision_tooltip: "¿Podría acabar por fin la cacería?"
 spell_of_life_ending_the_hunt_decision_custom1: "No debe haber ningún #TOOLTIP:GAME_TRAIT,eternal_rebirth_seeker,[GetNullCharacter] #L Buscador del Hechizo de la Vida#!#! que no sea $POD_splat_mummy_plural$, no esté sin mente y no sea tu [friend|E], [best_friend|E], miembro de tu [coterie|E], [lover|E] o [soulmate|E]"
 spell_of_life_ending_the_hunt_decision_custom1_ex: "$spell_of_life_ending_the_hunt_decision_custom1$ #weak ([example.GetFirstName])#!"
 spell_of_life_ending_the_hunt_decision_custom2: "Debes tener más [prowess|E] que [GetScriptedCharacterByHistoryID('505094').GetFirstName] #weak (#V [GetPlayer.GetProwess]#! contra #V [GetScriptedCharacterByHistoryID('505094').GetProwess]#!)#!"
