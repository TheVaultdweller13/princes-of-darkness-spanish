 spell_of_life_stage4_warning: "\n\n#warning Tus probabilidades de éxito en esta búsqueda son absurdamente bajas. No lo intentes si aprecias el bienestar de tu personaje.\nIncluso guardar y recargar la partida para tentar a la suerte no te salvará.\nEstás advertido.#!"
 spell_of_life_stage4_amenti_decision: "Hacer de Amenti Tu Hogar"
 spell_of_life_stage4_amenti_decision_desc: "El último paso para crear el [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E] es atar el hechizo a un espacio dentro del [UmbraGlossaryLocalized('shadowlands','Inframundo')] donde nuestras almas residan hasta renacer. Aunque otros quizá deban abrirse su propio espacio, nuestras buenas relaciones con la Primera Dinastía de los Imperecederos y sus partidarios, como Kemintiri, nos han ofrecido una alternativa más fácil. Si pudiéramos viajar al [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], podríamos reunirnos con los agentes de Osiris y convencerlos de que nos den un hogar dentro del [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')].\n\n#warning Esta fase final entraña cierto peligro, y los Jueces de Maat solo te darán una oportunidad de exponer tu argumento.#!"
 spell_of_life_stage4_amenti_decision_tooltip: "Quizá podamos encontrar un hogar dentro del [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]"
 spell_of_life_stage4_amenti_decision_confirm: "¡Abrid la puerta!"
 spell_of_life_stage4_amenti_decision_wraith_friends: "Tener al menos 2 [friends|E] [GetTrait('wraith').GetName(GetNullCharacter)] u otras [relations|E] positivas"
 spell_of_life_stage4_amenti_decision_control_land: "[hold|E] al menos el #Z [SCOPE.ScriptValue('POD_mummy_lands_of_faith_target_percent_value')|0]%#! de los [counties|E] de la [region|E] [GetGeographicalRegion('pod_lands_of_faith').GetName] (Actual: [SCOPE.ScriptValue('POD_mummy_lands_of_faith_percent_value')|0]%)\n"
 spell_of_life_stage4_amenti_decision_underworld_access: "Tú o tu [friend|E], [lover|E], miembro de tu [coterie|E], wraith vinculado o demonio vinculado tenéis $underworld_access$"

 spell_of_life_stage4_hades_decision: "Expandir y Estabilizar el Hades"
 spell_of_life_stage4_hades_decision_desc: "El último paso para crear el [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E] es atar el hechizo a un espacio dentro del [UmbraGlossaryLocalized('shadowlands','Inframundo')] donde nuestras almas residan hasta renacer. Tras tus esfuerzos por ayudarlo, Cabirus ha accedido a dejarte usar el [UmbraGlossary('hades')] como nuestro [UmbraGlossary('shadow_realm')]. Esto eliminará la necesidad de abrirte tu propio espacio para el Hechizo de la Vida. Sin embargo, el [UmbraGlossary('hades')] no es tan estable como el [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] egipcio y causa enormes problemas al resucitar tras la muerte. Tales problemas solo empeorarán con el mayor número de ocupantes cuando empieces a usarlo. Si esperas usar el [UmbraGlossary('hades')], tendrás que mejorar el señorío.$spell_of_life_stage4_warning$"
 spell_of_life_stage4_hades_decision_tooltip: "Quizá podamos encontrar un hogar dentro del [UmbraGlossary('hades')]"
 spell_of_life_stage4_hades_decision_confirm: "¡Afilad vuestras espadas!"
 spell_of_life_stage4_hades_decision_pomegranate: "Debes tener [GetPODArtifactName('pomegranate_link')]"

 spell_of_life_stage4_custom_decision: "Abrir un Nuevo Señorío"
 spell_of_life_stage4_custom_decision_desc: "El último paso para crear el [Concept('POD_spell_of_life', 'Hechizo de la Vida')|E] es atar el hechizo a un espacio dentro del [UmbraGlossaryLocalized('shadowlands','Inframundo')] donde vuestras almas residan hasta renacer. Como careces de aliados con su propio [UmbraGlossary('shadow_realm')], tendrás que abrirte tu propio espacio para el Hechizo de la Vida. Será difícil, pues la [umbra|E] y todos sus habitantes se te opondrán.$spell_of_life_stage4_warning$"
 spell_of_life_stage4_custom_decision_tooltip: "Quizá podamos abrir un nuevo [UmbraGlossary('shadow_realm')]"
