 spell_of_life_abandon_vampirism_decision: "Abandonar el Vampirismo por el Renacimiento Eterno"
 spell_of_life_abandon_vampirism_decision_desc: "Aunque pueda tener algunas ventajas, el vampirismo acarrea muchas maldiciones. Sin embargo, tu conocimiento ofrece una forma alternativa de inmortalidad con menos inconvenientes: el renacimiento eterno.\n\nDesgraciadamente, los no-muertos como los vampiros no pueden convertirse en momias. Además, los vampiros no pueden usar magia como el Hechizo de la Vida. Por ello, tendrás que encontrar la manera de sortear tales problemas... y decidir si estás dispuesto. Al fin y al cabo, debes morir como parte del ritual, así que tendrás que hallar a una persona de confianza que lo realice.\n\n#warning Si sobrevives, te convertirás en una Momia, lo que cambiará radicalmente tu forma de jugar, desactivará tus edificios y podría destruir tus títulos de señorío superiores.\nEs probable que esto arruine tu campaña si no estás preparado.#!"
 spell_of_life_abandon_vampirism_decision.second_step: "¿Cómo lo lograré?"
