l_spanish:


 podgrandcity.01.t: "Pagando tu deuda"
 podgrandcity.01.desc: "No es un secreto para los demás vampiros de París que has financiado la expansión de la Capilla Tremere. Tales actos en la sociedad vampírica nunca se hacen gratuitamente, y tus súbditos son muy conscientes de este hecho.\nLos Tremere se han presentado ante ti con múltiples regalos. En realidad, estos regalos pretenden ser un pago para saldar su deuda contigo. Para ellos es mejor ofrecer lo que tienen, antes que esperar a que tú exijas lo que no tienen."
 podgrandcity.01.option.a: "Enséñame tus secretos"
 podgrandcity.01.option.b: "Fomenta mis estudios"
 podgrandcity.01.option.c: "Muéstrame el poder de la piedra"
 podgrandcity.01.tooltip: "Aprende a crear tus propios sirvientes [GetTrait('gargoyle').GetName(GetNullCharacter)]\n\n@warning_icon! #N Seguirás necesitando [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)]#!"
 podgrandcity.100.t: "Enseñanzas de la Corte del Sueño"
 podgrandcity.100.desc: "Gracias a tus esfuerzos, gran parte del templo ha sido reconstruida. Muchos Setitas recorren ahora estos salones, susurrando, conspirando y glorificando a Set a su manera.\nSin embargo, por razones que no sabes explicar, muchos de los Setitas que vienen aquí olvidan su propósito original y buscan en cambio formas placenteras de entretenerse. Quizá esto también sea una forma de culto, una que ha empezado a interesarte."
 podgrandcity.100.option.a: "Los placeres de la carne me liberarán."
 podgrandcity.100.tooltip.a: "Tu futura fe obtendrá [GetDoctrine('tenet_carnal_exaltation').GetBaseName]."
 podgrandcity.100.option.b: "¿Para qué existen si no es para la satisfacción personal?"
 podgrandcity.100.tooltip.b: "Tu futura fe obtendrá [GetDoctrine('tenet_hedonistic').GetBaseName]."
 podgrandcity.100.option.c: "¡Cuantos más, mejor!"
 podgrandcity.100.tooltip.c: "Tu futura fe obtendrá [GetDoctrine('tenet_ritual_celebrations').GetBaseName]."
 podgrandcity.101.t: "Enseñanzas de la Corte del Polvo y los Huesos"
 podgrandcity.101.desc: "Este templo está bien nombrado, pues ¿qué más queda sino polvo y huesos al verse expuesto a una poderosa magia de sangre? Los numerosos tomos de aquí hablan de Set, de sus logros y de sus poderes. Un tesoro de conocimiento yace ante ti; solo tienes que tomarlo."
 podgrandcity.101.option.a: "Set es el Rey."
 podgrandcity.101.tooltip.a: "Tu futura fe obtendrá [GetDoctrine('tenet_ashen_faith').GetBaseName]."
 podgrandcity.101.option.b: "Set es el Tifón."
 podgrandcity.101.tooltip.b: "Tu futura fe obtendrá [GetDoctrine('tenet_sacred_shadows').GetBaseName]."
 podgrandcity.101.option.c: "Set es el Triunfante."
 podgrandcity.101.tooltip.c: "Tu futura fe obtendrá [GetDoctrine('tenet_pursuit_of_power').GetBaseName]."
 podgrandcity.102.t: "Enseñanzas del Templo del Cocodrilo"
 podgrandcity.102.desc: "Aquí yace Sobek, hijo bendito de Set. Se dice que Set convirtió a los Mokolé en una abominación mediante poderosos rituales de sangre. Ser a la vez un matusalén y una abominación hace de Sobek una de las criaturas más poderosas que existen. Ahora hiberna aquí, el aspecto del Ansia misma. Hay fuerza, caos y carnicería en esta hambre. Quizá adorando al Dios Cocodrilo pueda obtenerse esa fuerza."
 podgrandcity.102.option.a: "El Ansia es una lucha eterna."
 podgrandcity.102.tooltip.a: "Tu futura fe obtendrá [GetDoctrine('tenet_struggle_submission').GetBaseName]."
 podgrandcity.102.option.b: "El sacrificio ritual saciará la sed de sangre."
 podgrandcity.102.tooltip.b: "Tu futura fe obtendrá [GetDoctrine('tenet_gruesome_festivals').GetBaseName]."
 podgrandcity.102.option.c: "A través de la furia se rompen mis cadenas."
 podgrandcity.102.tooltip.c: "Tu futura fe obtendrá [GetDoctrine('tenet_warmonger').GetBaseName]."
 podgrandcity.103.t: "Se revela un nuevo Camino"
 podgrandcity.103.desc: "Los tres templos han sido restaurados. El conocimiento que has obtenido de ellos te ofrece nuevas perspectivas sobre el culto a Set.\n¿Quizá sea hora de que el mundo también las conozca?\n¿O quizá deberían abandonarse estos pensamientos heréticos?"
 podgrandcity.103.option.a: "Este es el camino."
 podgrandcity.103.option.b: "Interesante, pero mi camino sigue siendo el mismo."
 podgrandcity.201.t: "La pira de Bagdad"
 podgrandcity.201.desc: "Ninguna ciudad es eterna. Una verdad tan simple es conocida por los tuyos y, aun así, no estabas preparado para lo que ha sucedido. El saqueo de Bagdad tuvo lugar durante toda una semana de pillaje y matanza mientras las fuerzas mongolas de Hulagu arrasaban lo que fue la joya del islam. Quizá murieron cerca de un millón de personas, probablemente más a causa de las epidemias que trajo consigo el recuento de muertos.\nTantos libros de las bibliotecas de Bagdad fueron arrojados al Tigris que el color del río se volvió negro por su multitud. El califato abasí, de 500 años de antigüedad, se desmorona y con él el centro del saber de Oriente Medio.\n\nAunque se sabe que los sobrenaturales se ocultan bien, la carnicería y el derramamiento de sangre llevaron a muchos a las garras de la locura, y más de uno cayó abatido por los victoriosos mongoles.\n\nAhora gobiernas una ciudad de cenizas, pulgas y muerte."
 podgrandcity.201.option.a: "¿Qué podemos hacer ante tal destrucción?"
 podgrandcity.201.tooltip.a: "Bagdad ya no es la gran ciudad que fue, y nunca volverá a alcanzar la categoría que tuvo. Pero quizá aún puedas reconstruirla."
 podgrandcity.202.t: "Bagdad se recupera"
 podgrandcity.203.t: "De las cenizas"
 podgrandcity.203.desc: "Aunque siempre llevará las cicatrices de lo ocurrido, Bagdad ha resistido. Su papel destacado en Oriente Medio se ha visto reducido, pero sigue siendo un lugar donde la gente vive, aprende y muere. Tu ciudad, tu joya, no está tan pulida como antaño, pero ha logrado sobrevivir. Quizá esta refundición a fuego bajo tu influencia sea lo que necesita para recuperar, o incluso superar, sus cotas anteriores."
 podgrandcity.203.option.a: "Un nuevo comienzo para la venerable ciudad."
 podgrandcity.203.tooltip.a: "Nuevas historias que contar, nuevas gentes a las que gobernar, la misma ambición."




