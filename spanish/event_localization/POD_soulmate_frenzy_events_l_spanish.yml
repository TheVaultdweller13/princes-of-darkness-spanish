l_spanish:

 POD_soulmate_frenzy.001.t: "El alma deshilachada"
 POD_soulmate_frenzy.001.desc: "Acabas de enterarte del anuncio y tu mundo se derrumba. [lost_soulmate.GetFirstName] ha abrazado la muerte definitiva. Tu mente se estremece y niega este hecho. Necesitas instantes interminables antes de comprender realmente lo que significa: una parte de ti se ha ido para siempre. Estás solo bajo el cielo nocturno, y esta soledad vertiginosa estrangula tu mente. Pero hay un monstruo que acecha esperando tu debilidad. La Bestia surge en tu interior, cabalgando sobre tu dolor y desesperación. Pronto, sus rugidos asediarán tu alma. Porque con el pesar llega la rabia."
 POD_soulmate_frenzy.001.option.a: "Debo resistir con todas mis fuerzas."
 POD_soulmate_frenzy.001.option.a.tt: "#beast ¡No puedes resistirte a mí!#!"
 POD_soulmate_frenzy.001.option.b: "Debo resistir el tiempo suficiente para abandonar mi corte."
 POD_soulmate_frenzy.001.option.b.tt: "#beast ¡No puedes huir de mí!#!"
 POD_soulmate_frenzy.001.option.c: "Acepto su abrazo; la Bestia nunca sufre."
 POD_soulmate_frenzy.001.option.c.tt: "#beast ¡Es hora del festín!#!"
 
 POD_soulmate_frenzy.002.t: "Intentar resistir"
 POD_soulmate_frenzy.002.desc: "Una presencia aterradora crece en tu interior. Está llena de pasiones rojas, de deseos mortales, y te gustaría rendirte. Podrías olvidar todos tus sufrimientos y hallar alivio acogiendo a la Bestia. Un respiro, mientras te asfixias con tu dolor. Pero tienes tus propias razones para resistir. Sabes que la Bestia es un depredador interior y que tú eres su presa.\nNo hay nada bueno que pueda darte, si no es más desesperación. Y así, luchas contra la Bestia, luchas contra ti mismo y contra tu propio deseo de rendirte. Tu mente es un campo de batalla y la luz se desvanece. Estás solo frente a tu propia oscuridad, y esta te engulle."
 POD_soulmate_frenzy.002.option.a: "Continuar la contienda."
 POD_soulmate_frenzy.002.option.a.tt: "#beast Tienes el control... por ahora#!"
 
 POD_soulmate_frenzy.102.t: "Trascender el dolor"
 POD_soulmate_frenzy.102.desc: "Las noches siguientes parecen no terminar nunca. La Bestia está aquí, lista para aprovechar la más mínima molestia, el más mínimo sollozo, para apoderarse de ti. Tus cortesanos sienten que algo va mal contigo y, por fortuna, te evitan instintivamente. Tu mirada está llena de carnicería, e incluso un humano puede verla. Poco a poco, sin embargo, haces retroceder a tu monstruo interior. Sus garras ya no encuentran asidero en tu conciencia. Y así, tras semanas de dura contienda, vuelves a encerrar a la Bestia en su jaula. Has ganado, pero a costa de un gran esfuerzo. Al menos, probablemente se salvaron muchas vidas gracias a ello.\nTu pesar sigue aquí y tu inmortalidad tiene un sabor amargo. Pero el tiempo es, no obstante, tu aliado. Quizá, una noche, los cielos vuelvan a estar estrellados."
 POD_soulmate_frenzy.102.option.a: "Se acabó."
 POD_soulmate_frenzy.102.option.a.tt: "Lograste resistir el frenesí, pero aún sientes el vacío en tu interior..."
 
 POD_soulmate_frenzy.003.t: "Bajo el cielo rojo"
 POD_soulmate_frenzy.003.desc: "Logras mantener las riendas de la Bestia, al menos por un tiempo. Abandonas tu dominio, como si el Infierno estuviera tras de ti. Te adentras en la noche, tan lejos de tu hogar como puedes, mientras la Bestia golpea en tu interior con furia. En un momento dado, no recuerdas bien cuándo, haces lo único que queda por hacer: abres la jaula. Y te ahogas en el tormento de tus emociones contenidas durante demasiado tiempo.\nMucha gente morirá probablemente, pero no serán tus cortesanos."
 POD_soulmate_frenzy.003.option.a: "La sangre correrá esta noche."
 POD_soulmate_frenzy.003.option.a.tt: "#beast ¡Finalmente! ¡Les mostraremos nuestra ira!#!"
 
 POD_soulmate_frenzy.103.t: "Cuando el pueblo sangra"
 POD_soulmate_frenzy.103.desc: "El frenesí se apodera de ti durante semanas. Cruzas tu dominio como una tormenta sedienta de sangre. Enseguida, los rumores hablan de un monstruo que viene por la noche y mata todo a su paso. Los días se vuelven demasiado cortos para la gente y las noches, promesas mortales.\nNo recuerdas cuándo se detiene. Simplemente estás en el centro de una aldea, con los restos de sus habitantes esparcidos a tu alrededor. Esta imagen se te ha vuelto familiar, pero ahora puedes apreciar su horror. Por fin llegas a tu refugio. Tu verdad interior se expresa en la sangre seca que te mancha el rostro y las manos. Eres el monstruo de los cuentos y los niños crecerán temiéndote."
 POD_soulmate_frenzy.103.option.a: "Tus crímenes son incontables."
 POD_soulmate_frenzy.103.option.a.tt: "#beast Fue un buen festín#!"
 
 POD_soulmate_frenzy.203.t: "Una cicatriz de dolor y furia"
 POD_soulmate_frenzy.203.desc: "El gran frenesí no apaciguó tu dolor. El duelo no se hace con rabia y carnicería. Te sientes vacío, asaltado por una impresión de irrealidad. La Bestia ha dejado su marca en tu mente, de maneras que aún no comprendes. Nunca volverás a ser el mismo.\nPero sobrevivirás, noche tras noche. Tal es el destino de los inmortales."
 POD_soulmate_frenzy.203.option.a: "De ahora en adelante, todo sabe a polvo."
 POD_soulmate_frenzy.203.option.a.tt: "Sucumbiste al frenesí, pero aún sientes el vacío en tu interior..."
 
 POD_soulmate_frenzy.303.t: "Hijo del $glossary_wyrm$"
 POD_soulmate_frenzy.303.desc: "Los frenesíes se apoderan de ti durante semanas. Cruzas tu dominio como una tormenta sedienta de sangre. Enseguida, los rumores hablan de un monstruo que viene por la noche y mata todo a su paso. Los días se vuelven demasiado cortos para la gente y las noches, promesas mortales.\nPero a veces hasta los monstruos se topan con su propio coco. Tu Bestia ha sido demasiado ruidosa, demasiado visible por su apetito de muerte. Varios seres han oído las lágrimas de la tierra. Olieron el rastro de tu carnicería y lo siguieron. Una noche, por fin te encuentran, y tú te conviertes en la presa. Una manada de hombres lobo te rodea de repente, decididos a poner fin a tu existencia sacrílega. A pesar de todo el poder de tu furia, sus colmillos y sus garras son demasiados. Este podría ser tu último combate."
 POD_soulmate_frenzy.303.option.a: "Los monstruos no temen a los cachorros."
 POD_soulmate_frenzy.303.option.a.tt: "#beast ¡Que vengan!#!"
 POD_soulmate_frenzy.303.option.a.desc: "Una lucha por tu no-vida"
 POD_soulmate_frenzy.303.option.a.success: "Sales victorioso"
 POD_soulmate_frenzy.303.option.a.tt.win: "Ganas"
 POD_soulmate_frenzy.303.option.a.failure: "Eres derrotado"
 POD_soulmate_frenzy.303.option.a.tt.lose: "Pierdes"
 
 POD_soulmate_frenzy.403.t: "Tras las garras"
 POD_soulmate_frenzy.403.desc: "Los gruñidos de los lobos se mezclan con los tuyos y comienza la terrible confrontación. Tu Bestia no tiene el menor discernimiento, pero sabe por instinto cómo matar y sobrevivir. Te hallas en el corazón de la batalla; tu danza, en medio de la tempestad feral. Esquivas algunos golpes, fallas en otros y, con cada nueva herida, tu furia crece más y más.\nEn tu mente febril te ves agarrar la carne que pasa a tu alcance, reventar ojos, arrancar mandíbulas y cercenar brazos igual que cabezas. El dolor llega para desgarrar estas visiones. Tu cuerpo tiene límites y toda la furia del mundo no puede superarlos. El cansancio y tus heridas se vuelven demasiado grandes y el miedo se apodera del monstruo que te controla. Así que huyes, a pesar de los hombres lobo enloquecidos que te persiguen. Tras horas de persecución, por una especie de milagro, logras escapar de ellos."
 POD_soulmate_frenzy.403.option.a: "Ahora necesito descansar."
 POD_soulmate_frenzy.403.option.a.tt: "#beast ¡No son rival para nuestro poder!#!"
 
 POD_soulmate_frenzy.503.t: "Soy uno de los que quedan"
 POD_soulmate_frenzy.503.desc: "Finalmente estás en casa. La Bestia está en silencio, y estás solo. Tu amante ya no está, dejándote solo con su ausencia y los recuerdos. Sigues vivo, pero ¿a qué precio? Tu existencia parecerá mucho más larga."
 POD_soulmate_frenzy.503.option.a: "De ahora en adelante, todo sabe a polvo."
 POD_soulmate_frenzy.503.option.a.tt: "Sucumbiste al frenesí, pero aún sientes el vacío en tu interior..."
 
 POD_soulmate_frenzy.603.t: "El amor puede salvar"
 POD_soulmate_frenzy.603.desc: "Los gruñidos de los lobos se mezclan con los tuyos y comienza la terrible confrontación. Te hallas en el corazón de la batalla; tu danza, en medio de la tempestad feral. Esquivas algunos golpes, fallas en otros y, con cada nueva herida, tu furia crece más y más. El dolor llega para desgarrar estas visiones. Tu cuerpo tiene límites y toda la furia del mundo no puede superarlos. El cansancio y tus heridas se vuelven demasiado grandes. De pronto, la furia te abandona.\nLos guerreros de Gaia te atrapan con brutalidad. Sus armas asesinas golpean los órganos marchitos tras la piel de tu vientre, machacan tus huesos y reducen tu ser a una infinidad de pedacitos. Te sientes vacío mientras mueres, pero un ruido extraño capta tu atención. A pesar de la sangre en los ojos, ves algo que se precipita hacia ti y la manada. Reconoces a [friend_savior.GetFirstName]. Comienza una nueva batalla, pero estás demasiado herido para verla. Todo es borroso, hasta que [friend_savior.GetFirstName] se inclina sobre ti. «Estoy aquí. Estoy aquí para ti, ahora.»"
 POD_soulmate_frenzy.603.option.a: "Hola, oscuridad, vieja amiga."
 POD_soulmate_frenzy.603.option.a.tt: "[friend_savior.GetFirstName] te salva"
 
 POD_soulmate_frenzy.703.t: "Abraza tu final"
 POD_soulmate_frenzy.703.desc: "Los gruñidos de los lobos se mezclan con los tuyos y comienza la terrible confrontación. Te hallas en el corazón de la batalla; tu danza, en medio de la tempestad feral. Esquivas algunos golpes, fallas en otros y, con cada nueva herida, tu furia crece más y más. En tu mente febril te ves agarrar la carne que pasa a tu alcance, reventar ojos, arrancar mandíbulas y cercenar brazos igual que cabezas. El dolor llega para desgarrar estas visiones.\nTu cuerpo tiene límites y toda la furia del mundo no puede superarlos. De pronto, la furia te abandona y solo queda el miedo. Los guerreros de Gaia te atrapan con brutalidad. Sus armas asesinas golpean los órganos marchitos tras la piel de tu vientre, machacan tus huesos y reducen tu ser a una infinidad de pedacitos. Te sientes vacío antes de que tu cabeza abandone el cuello. Ves las estrellas, por última vez, y luego llega la oscuridad."
 POD_soulmate_frenzy.703.option.a: "El descanso eterno aguarda"
 POD_soulmate_frenzy.703.option.a.tt: "Mueres en una batalla desigual con hombres lobo"
 
 POD_soulmate_frenzy.004.t: "La Bestia desatada"
 POD_soulmate_frenzy.004.desc: "Tu flujo de conciencia se interrumpe de repente. Una furia intensa ahoga tu pensamiento y te conviertes en un caparazón vacío que solo se mueve para la violencia. Esta cosa, que eres tú sin ser tú, corre por tu dominio. Es ciega al arrepentimiento, solo le importa dar muerte, porque la muerte le dio a luz. Así, sus garras golpean rostros y aplastan huesos, y sus dientes desgarran gargantas, como si arrancaran corazones del pecho.\nTu casa está ahora anegada de sangre y gritos. Pronto la noche volverá a quedar en silencio. Es tanto una promesa como una condena."
 POD_soulmate_frenzy.004.option.a: "La tierra estará roja al amanecer."
 POD_soulmate_frenzy.004.option.a.tt: "#beast ¡Empecemos el festín!#!"
 
 POD_soulmate_frenzy.104.t: "Resaca sangrienta"
 POD_soulmate_frenzy.104.desc: "Finalmente, te despiertas. El velo sobre tus ojos se levanta, y puedes ver lo que has hecho durante esta larga noche. A tus pies, una marea de sangre. Estás rodeado de cadáveres, partes de cuerpos atormentados y otras cosas inidentificables. Puedes reconocer a muchos de tus guardias, de tus sirvientes, de tus cortesanos, y algunos rostros son menos anónimos para ti. Todos están ahora congelados con una expresión de terror. Tu casa es como un cementerio abierto, y tú eres el sepulturero."
 POD_soulmate_frenzy.104.option.a: "Tus crímenes son incontables."
 POD_soulmate_frenzy.104.option.a.tt: "#beast ¡Matar cortesanos es divertido, deberíamos hacerlo de nuevo!#!"
 
 POD_soulmate_frenzy.204.t: "Una cicatriz de dolor y furia"
 POD_soulmate_frenzy.204.desc: "Los frenesíes no apaciguaron tu dolor. El duelo no se hace con rabia y carnicería. Te sientes vacío, asaltado por una impresión de irrealidad. La Bestia ha dejado su marca en tu mente, de formas que aún no comprendes. Nunca volverás a ser el mismo. Pero sobrevivirás, noche tras noche. Tal es el destino de los inmortales."
 POD_soulmate_frenzy.204.option.a: "De ahora en adelante, todo sabe a polvo."
 POD_soulmate_frenzy.204.option.a.tt: "Sucumbiste al frenesí, pero aún sientes el vacío en tu interior..."