 POD_test_of_faith.101.t: "Una prueba exitosa"
 POD_test_of_faith.101.desc: "Has tenido éxito. Ahora casi has terminado. Le servirás bien, y el camino virtuoso es el camino correcto. ¿Qué parte de tu vida y comportamiento quieres mejorar?" 
 POD_test_of_faith.101.option.a: "La mente antes que la carne"
 POD_test_of_faith.101.option.a.tt: "Te vuelves casto" 
 POD_test_of_faith.101.option.b: "Estaré tranquilo sin importar las circunstancias"
 POD_test_of_faith.101.option.b.tt: "Te vuelves calmado" 
 POD_test_of_faith.101.option.c: "Compartir es vivir"
 POD_test_of_faith.101.option.c.tt: "Te vuelves generoso" 
 POD_test_of_faith.101.option.d: "Pondré la otra mejilla"
 POD_test_of_faith.101.option.d.tt: "Te vuelves compasivo" 
 POD_test_of_faith.101.option.e: "No soy mejor que los demás"
 POD_test_of_faith.101.option.e.tt: "Te vuelves humilde" 
 POD_test_of_faith.101.option.f: "Sé cuándo es suficiente"
 POD_test_of_faith.101.option.f.tt: "Te vuelves templado" 
 POD_test_of_faith.101.option.g: "Descansaré en el cielo"
 POD_test_of_faith.101.option.g.tt: "Te vuelves diligente" 
  
 POD_test_of_faith.201.t: "Una prueba fallida"
 POD_test_of_faith.201.desc: "Has fallado. Tu concentración no fue lo suficientemente impecable. ¿Quizás deberías intentarlo de nuevo más tarde?\nNo hay vergüenza en fracasar al escalar la montaña, solo en negarse a intentarlo en primer lugar."
 POD_test_of_faith.201.option.a: "Aún no estoy preparado"
 POD_test_of_faith.201.option.a.tt: "Has fallado"