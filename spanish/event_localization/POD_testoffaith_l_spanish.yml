l_spanish:

 POD_test_of_faith.001.t: "Una prueba de fe"
 POD_test_of_faith.001.desc: "Algunas personas pueden vivir en el pecado, los servidores de Dios no. No mereces Su gracia si no eres lo suficientemente virtuoso, y sabes que no lo eres. Es hora de cambiar, de deshacerte de esos pecados que te hacen indigno. Un camino arduo, sin duda, pero necesario."
 POD_test_of_faith.001.option.a: "La lujuria no nublará mi mente"
 POD_test_of_faith.001.option.a.tt: "Intentarás deshacerte de tu lujuria"
 POD_test_of_faith.001.option.a.desc: "Prueba de fe"
 POD_test_of_faith.001.option.a.success: "Tienes éxito"
 POD_test_of_faith.001.option.a.failure: "Fracasas"
 POD_test_of_faith.001.option.a.failure.tt: "Fallas la prueba"
 POD_test_of_faith.001.option.b: "No soy tan grande después de todo"
 POD_test_of_faith.001.option.b.tt: "Intentarás deshacerte de tu arrogancia"
