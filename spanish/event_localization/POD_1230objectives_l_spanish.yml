 pod1230objectives.174.desc: "Las órdenes militares suelen adoptar un estilo de combate adaptado a su propósito y a sus probables enemigos. Las órdenes vampíricas no son la excepción, desde los disciplinados Caballeros de la Cruz Negra hasta las grandes bandas errantes de salvajes Woodwose. Como gran maestro de esta nueva organización, te corresponderá dirigir tu orden hacia la estrategia que prefieras."
 pod1230objectives.174.a: "Orden y disciplina." 
 pod1230objectives.174.b: "¡Atacantes salvajes!" 
 pod1230objectives.174.c: "Contraatacaremos a nuestros enemigos." 
 pod1230objectives.174.d: "Un enfoque equilibrado." 
 pod1230objectives.174.e: "Pequeños equipos de élite." 
   
