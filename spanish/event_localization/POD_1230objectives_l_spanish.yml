l_spanish:

 pod1230objectives.1.t: "Ocaso del Sol"
 pod1230objectives.1.desc: "La mayoría de vosotros habéis oído durante mucho tiempo el falso relato del «Dios» persa, Mitras, sobre sus interminables hazañas y ambiciones por las islas. Esta noche, escucharéis la triste verdad completa. Mitras quería que pensáramos que llegó a las Islas Británicas como un salvador, pero la verdad es que huía de sus fracasos en la Antigua Roma, viendo nuestra Tierra Natal como un rincón remoto apenas apto para reconstruir su base de poder. Ahora, ha fracasado una vez más, ya que Britania está bajo un nuevo y unido liderazgo. Su culto se dispersa, expulsado por el fuego y la espada, destinado a convertirse en una mera nota al pie de la historia de las islas. Mientras os proclamo la caída del «Sol Inconquistable», también proclamo que Britania está finalmente lista para convertirse en su propia fuerza motriz en la sociedad $pod_cainite$."
 pod1230objectives.1.a: "Un discurso bastante bueno, si me lo preguntas a mí"
 pod1230objectives.2.a: "Mitras ha sufrido su última derrota... probablemente"
 pod1230objectives.2.b: "El Sol Inconquistible volverá a salir, siempre lo hace."
 pod1230objectives.3.t: "El Cetro y el Sol"
 pod1230objectives.3.desc: "La línea entre un Antiguo Vampiro y un Dios es delgada. Pero en el caso de Mitras, es aún más borrosa. El puro carisma y poder de la entidad conocida como Dios por los antiguos persas y romanos sigue siendo asombroso y, aunque los mortales han seguido adelante, recientemente se ha producido un cambio de paradigma. Ante la falta de rivales creíbles para el manto del liderazgo Ventrue, el culto de Mitras ha logrado reunir la influencia suficiente para convertirse, en cierto modo, en el propio $pod_clan$ Ventrue. Ya no confinados a Britania, los fieles del Sol Inconquistible son más poderosos que nunca y su innegable fe está sacudiendo los principios de los Vampiros hasta la médula. La historia bíblica de los orígenes está empezando a desvanecerse de la memoria de los vampiros más jóvenes, sustituida por relatos inspiradores de campeones inmortales fieles al Dios Sol Guerrero. La sociedad de la Estirpe nunca volverá a ser la misma."
 pod1230objectives.3.a: "¡Alabado sea el Sol!"
 pod1230objectives.3.b: "A veces, me asombro de mí mismo"
 pod1230objectives.3.custom: "Todos los gobernantes Ventrue tendrán la oportunidad de convertirse al Culto de Mitras."
 pod1230objectives.4.a: "Mitras ha ganado esta ronda. Simplemente aceptémoslo."
 pod1230objectives.4.b: "¿Alabar al Sol? ¿Como un mortal? ¡Ja!"
 pod1230objectives.5.a: "¿Añadirán un Sol a su escudo de armas?"
 pod1230objectives.6.t: "¿Soñando de nuevo?"
 pod1230objectives.6.desc: "Vienen trayendo regalos. Poderosos $pod_cainites$ de toda Europa, ansiosos por ver al nuevo gobernante de Constantinopla. Mientras entran en tu sala del trono tan ricamente decorada, te preguntas cuántos tendrán propuestas, amenazas o dagas esperándote antes del final de la noche. También te preguntas con desidia si este ha sido el plan de Michael todo este tiempo. ¿Sabía que su Sueño requería un cambio de liderazgo, una nueva visión? Probablemente nunca lo sepas. Lo que sí sabes es que todos tus ilustres invitados quieren aprender algo esta noche y sus regalos son parte de esta conjura. Michael, el autoproclamado Arcángel, habría rechazado tales ofrendas mundanas o incluso se habría sentido ofendido por ellas. Si tú también las rechazas, serás visto verdaderamente como el Heredero de Michael. Pero quizás el Sueño necesite tomar un nuevo camino bajo tu liderazgo, y puedes dar el primer paso ahora mismo. ¿Lo harás...?"
 pod1230objectives.6.a: "¿Rechazar los regalos?"
 pod1230objectives.6.custom: "Tomarás el largo camino, reviviendo la fe del difunto Codex de Legados. La mayoría de tus vasallos se convertirán a ella." 
 pod1230objectives.6.b: "¿Aceptar los regalos?"
 pod1230objectives.7.a: "1204 fue simplemente un contratiempo, por lo visto."
 pod1230objectives.8.t: "Completar la Reconquista"
 pod1230objectives.8.desc: "La sangrienta guerra civil de los Lasombra españoles ha terminado. Ahora te alzas como el único vencedor, un señor de ruinas. Fue una batalla duramente luchada, pero no es más que un peldaño en tu camino hacia un mayor poder. La victoria decisiva te ha otorgado una gran magnanimidad y ha abierto muchas puertas. De hecho, se te ha ofrecido el codiciado puesto de maestro del Mar de las Sombras y, por tanto, de toda la $pod_clan$ Lasombra. Es obviamente una trampa, y todos esperan que fracases estrepitosamente. Que tu reinado termine tan rápido como empezó para que puedan volver a sus mezquinas disputas sin que tú te interpongas en su camino. Pero esto no sucederá. Tienes la intención de hacerles lamentar su fútil conjura. Al fin y al cabo, has domado Iberia; doblegar el Mediterráneo y a unos cuantos Antiguos decrépitos no puede ser mucho más difícil... ¿verdad?"
 pod1230objectives.8.a: "Escalando la escalera, peldaño a peldaño"
 pod1230objectives.8.custom: "Tomarás el largo camino, reviviendo la fe del difunto Codex de Legados. La mayoría de tus vasallos se convertirán a ella." 
 pod1230objectives.9.a: "El liderazgo de los Lasombra no es el lugar más seguro para estar"
 pod1230objectives.9.b: "El mar borrará las ambiciones mezquinas"
 pod1230objectives.10.t: "Derrotando al Ragnarök"
 pod1230objectives.10.desc: "Durante siglos, los Hijos de Canarl han ido muriendo lentamente. El constante asalto de los siervos de la Cruz, tanto mortales como no-muertos, había convertido a su antaño piadoso rebaño en un pueblo pequeño y débil. Pero eso se acabó. Mientras la invasión de los Ventrue alemanes colapsa y los orgullosos [Glossary('Einherjar','game_concept_einherjar_desc')] infunden de nuevo el terror en los corazones de los Hijos de Caín, la fe renace. Bajo un nuevo líder, con nuevas doctrinas y liderazgo, los [Glossary('Einherjar','game_concept_einherjar_desc')] son ahora algo más grande de lo que incluso Odín podría haber imaginado; el Vagabundo los ha elegido bien y ahora son su familia, los Aesir del mañana. Se adentran con audacia en esta era como los dioses vikingos que realmente son. Mientras se amontonan, aterrorizados en sus sombríos castillos, los débiles vampiros del sur no tienen más esperanza que una muerte misericordiosa cuando llegue su propio Ragnarok. Y llegará."
 pod1230objectives.10.a: "¡Cuánta gloria aguarda!"
 pod1230objectives.11.a: "¿Es que no han comprendido que su era ha terminado?" 
 pod1230objectives.11.b: "¡La Era de los Dioses está sobre nosotros!"  
 pod1230objectives.12.t: "Iberia después de la Medianoche"
 pod1230objectives.12.desc: "La guerra civil de los Lasombra en Iberia fue un asunto sangriento, nacido de la Reconquista española mortal y del creciente malestar entre cristianos y [Glossary('Ashirra','game_concept_ashirra_desc')] $pod_cainites$. Fue un periodo sórdido para los Fieles al principio, con traiciones, ciudades caídas y secretos oscuros conspirando para derribar la Media Luna de Medianoche. Como tal, vuestra victoria fue muy inesperada. Mientras las Taifas ibéricas mortales caen una tras otra, los fieles [Glossary('Ashirra','game_concept_ashirra_desc')] lograron superar a sus vecinos cristianos del norte. Es un giro de los acontecimientos verdaderamente extraño. Mientras el Mar de Sombras se desmorona debido a su errónea alianza con los cristianos, ahora gobernáis sobre una tierra y un pueblo nuevos y apenas reconocibles. En cierto modo, vuestra victoria salvó el último relicario de la edad de oro musulmana en Iberia. Sois tanto vencedores como custodios de una rica historia. Una perspectiva desalentadora, pero a la que os enorgullece asistir."
 pod1230objectives.12.a: "Somos el pasado y el futuro de esta tierra" 
 pod1230objectives.12.custom: "Mientras los últimos $pod_cainites$ que no son [Glossary('Ashirra','game_concept_ashirra_desc')] huyen de vuestro señorío, algunas provincias se convertirán a vuestra fe." 
 every_non_root_faith_county_world_europe_west_iberia: "Cada condado de un señorío que no sea de vuestra fe en Iberia." 
 pod1230objectives.13.a: "Los Magister están conmocionados" 
 pod1230objectives.13.b: "¡Están condenando a nuestro $pod_clan$!" 
 pod1230objectives.13.c: "Somos los custodios de Su palabra" 
 pod1230objectives.14.t: "La Pequeña Broma"
 pod1230objectives.14.desc: "¡Finalmente, estáis aquí! ¡En Jerusalén!... ¿o era en Bohemia? Bueno, no importa, vuestro viaje ha terminado. Durante mucho tiempo, habíais tenido la sensación de que estabais destinados a estar aquí con vuestros hermanos y hermanas de $pod_clan$ Malkavian a vuestro lado. No fue fácil; tuvisteis que pedirlo amablemente, y a veces no tan amablemente, a los Príncipes en el camino. Incluso tuvisteis que echar a algunos de sus cómodos tronos. Oís rumores en las cortes de que estáis en camino de crear un $pod_clan$ Malkavian unificado. Es curioso porque nunca fue vuestra intención, pero de alguna manera lo habéis hecho. Lo importante es que estáis aquí ahora, y las voces se vuelven más fuertes, deciéndoos que hagáis... ¡cosas! ¡El tiempo de la Iluminación ha llegado! ¿O era el de la salvación? No estáis muy seguros. En cualquier caso, ¿cómo van esas «cosas»?"
 pod1230objectives.14.a: "¡Las cosas van algo mal!" 
 pod1230objectives.14.customa: "Obtendréis los rasgos Genio y Astuto si se aplican, a expensas del resto de $pod_clan$ Malkav, que sufrirán altos niveles de estrés." 
 pod1230objectives.14.b: "¡Las cosas van mal!" 
 pod1230objectives.14.customb: "Todo el $pod_clan$ Malkav obtiene el rasgo Genio, pero de algún modo se vuelven aún más inestables mentalmente." 
 pod1230objectives.14.c: "¡Las cosas van muy mal!" 
 pod1230objectives.14.customc: "El $pod_clan$ Malkav gana el rasgo Astuto, pero los gobernantes de otros Clanes sufren una enorme ganancia de estrés." 
 pod1230objectives.14.d: "¡Todo se va al garete!" 
 pod1230objectives.14.customd: "El $pod_clan$ Malkav gana el rasgo Genio, pero los gobernantes de otros Clanes se vuelven locos. Ahora ellos son los locos." 
 pod1230objectives.15.a: "No me siento muy bien..." 
 pod1230objectives.15.b: "¡Veo nuevas puertas abriéndose! Ah, espera, no. Cerrándose. Definitivamente cerrándose..." 
 pod1230objectives.16.t: "La República Eterna"
 pod1230objectives.16.desc: "«Queridos amigos, seamos honestos... ¿Cuántos de vosotros esperabais que llegáramos tan lejos tan pronto? Tras la caída de nuestro orgulloso Senado a manos de líderes corruptos y parásitos, nuestros ideales republicanos parecían perdidos ante los tiránicos invasores alemanes, tanto mortales como no-muertos. Pero la luz de Roma nunca podrá extinguirse del todo, y seguirá guiándonos mientras el sol nos rehúye cada vez más. Sed orgullosos de nuestra herencia pero conscientes de nuestros enemigos. Nunca debemos volver a caer en la complacencia o la decadencia, pues hemos visto qué tiempos oscuros aguardan a nuestra especie sin nuestra mano guía. ¡Compañeros Senadores de Roma, me complace declarar abierta la primera sesión del renovado Senado Eterno!»"
 pod1230objectives.16.a: "Se siente bien sacudir el polvo de la toga por fin." 
 pod1230objectives.17.a: "La no-muerte es un círculo plano" 
 pod1230objectives.17.b: "Bueno, de todos modos seguimos en la cima." 
 pod1230objectives.18.t: "Una carga pesada"
 pod1230objectives.18.desc: "La espada se siente pesada en vuestra mano. La encontrasteis mientras explorabais las ruinas de la utopía por la que tanto luchasteis: Cartago. Pero no sois un recién nacido, sabéis muy bien que cada mito es una amalgama compleja de mentiras y verdades. Todo un $pod_clan$ os contempla con asombro, ¿reclamaréis el manto de Troile y traeréis una nueva Edad de Oro para los Vampiros? Esta elección os creará muchos enemigos nuevos, y sabéis que incluso Troile no logró salvaguardar Cartago de la influencia infernal. ¿O reclamaréis Cartago como una herramienta política, rechazando su legado mixto? Este movimiento os ganará el respeto de muchos otros Clanes, pero entonces no seréis mejores que los Ventrue. La espada de Troile a la que os aferráis es un poderoso símbolo de esta difícil elección. ¿Lo haréis...?"
 pod1230objectives.18.a: "¿Conservar la espada?" 
 pod1230objectives.18.b: "¿Soltar la espada?" 
 pod1230objectives.19.a: "Un viejo jugador regresa al juego." 
 pod1230objectives.19.b: "Hora de quemarlo todo, otra vez." 
 pod1230objectives.20.t: "Tu Abuela Cariñosa"
 pod1230objectives.20.desc: "Baba Yaga es conocida por muchos nombres: La Anciana, la Bruja, la Abuela... Pero vos sabéis la verdad. Ella es la que escapó, la única superviviente de la loca cacería de Absimilliard contra sus propios chiquillos. La progenitora del $pod_clan$ Nosferatu sigue cazando hasta esta noche, y ya habría matado a su propio $pod_clan$ si no fuera por su continuo desafío. Ella duerme ahora, pero sentís su placer, ya que vuestra continua lealtad y esfuerzos han logrado inclinar al $pod_clan$ Nosferatu hacia su lado en la Contienda actual. La guerra final por el destino de los Ocultos está comenzando y, como campeona de la Abuela, no tenéis intención de fallarle."
 pod1230objectives.20.a: "Te haremos sentir orgullosa, Abuela"
 pod1230objectives.20.custom: "Todos los Nosferatu son ahora obedientes al mandato de Baba Yaga, y por tanto al vuestro. Obtienen una gran bonificación de opinión hacia vos.\nComo [character_interaction|E], os permite reclutar a [GetMaA('zmei').GetName] [men_at_arms|E]." 
 pod1230objectives.21.a: "Algo perverso se acerca..." 
 pod1230objectives.21.b: "¡Bendícenos, Abuela!" 
 pod1230objectives.22.t: "Horrores en la Oscuridad"
 pod1230objectives.22.desc: "Incluso los vampiros temen a las sombras. Pero vuestro $pod_clan$ está mucho más que asustado; saben que algo acecha allí, esperando el momento de atacar. Se llaman a sí mismos «Nictuku», la progenie del fundador, Absimilliard, que han jurado destruir a sus hijos errantes. Desde el amanecer de los Tiempos, vuestros hermanos y hermanas han optado por huir, por esconderse en las sombras y rezar por su no-vida. Estás cansado de eso. Si el Fundador quiere una guerra, la tendrá bajo vuestros términos. Vuestro $pod_clan$ fue cauteloso con vuestra iniciativa al principio, llamándola temeraria, pero ahora ven la verdad. Solo triunfaréis unidos, con tierras y gente bajo vuestra guía y aliados en la noche. Ahora os miran a vos, preparándose para el embate y confiando en vuestras habilidades de liderazgo. Los Nictuku deben de estar siseando en sus madrigueras, maldiciendo vuestro nombre y tramando vuestra muerte. Que vengan."
 pod1230objectives.22.a: "Somos más fuertes de lo que crees, «Padre»"
 pod1230objectives.23.a: "¿Las ratas se están amontonando?" 
 pod1230objectives.23.b: "Es hora de enfrentarse a los horrores."   
 pod1230objectives.24.t: "Un Dios Sueña"
 pod1230objectives.24.desc: "Te encuentras en la cripta de Ur-Shulgi, donde duerme el favorecido chiquillo de Haqim. Traes buenas noticias, ya que el $pod_clan$ Assamita ha cumplido finalmente con su deber como jueces de la sangre. Hizo falta algo de... persuasión por tu parte para purgar al $pod_clan$ de Antiguos de mente débil y de fanáticos de religiones indignas. El juicio final ha comenzado y, como se ha descubierto que los Hijos de Khayyin no han estado a la altura, la reclamación ha comenzado. Bajo tu guía, los Hijos de Haqim pronto lavarán el mundo con sangre, hasta que solo los puros permanezcan en pie. Ves un escalofrío recorrer el cuerpo de Ur-Shulgi, antes de quedar cegado por un repentino destello de sangre negra. Y, de algún modo, comprendes que tu maestro acaba de bendecirte con una ventaja considerable para la purga venidera..."
 pod1230objectives.24.a: "La marea roja ha comenzado."
 pod1230objectives.24.custom: "La mayoría de los personajes $pod_clan$ Assamita se convertirán al Camino de la Rectitud." 
 pod1230objectives.24.customa: "El ataque mental de Ur-Shulgi matará a la mayoría de los usuarios de Hechicería de Sangre que no sean Assamitas." 
 pod1230objectives.25.a: "La Red de Cuchillos tenía razón todo el tiempo." 
 pod1230objectives.25.b: "Nunca seguiré a estos cultistas delirantes."   
 pod1230objectives.26.a: "Los extraños asesinos orientales están locos de verdad. ¿Quién lo hubiera dicho?" 
 pod1230objectives.27.t: "Una Casa Unida"
 pod1230objectives.27.desc: "El Trono Negro de Haqim se alza con orgullo en el centro de Alamut, tu fortaleza. Mientras te sientas en él, contemplas la augusta asamblea que aguarda tus palabras. Los representantes de las tres castas, Mullah, Amr y Vizir, están aquí. El Consejo de los Pergaminos también está presente, junto a emisarios de toda la vasta red de espías de Haqim. ¡Tanto progreso en tan poco tiempo! Hace no mucho, todos estos eminentes hijos de Haqim se habrían cortado el cuello unos a otros antes siquiera de entrar en la misma habitación. Pero eso fue antes de tu ascensión a Antiguo del $pod_clan$. Por la fuerza de las armas, la intriga y la diplomacia, detuviste las luchas internas, aseguraste la posición del $pod_clan$ y restableciste la Disciplina como el valor primordial de los Assamitas. Ahora, todos aguardan tu visión para el futuro. Sabes que obedecerán, pues los Hijos de Haqim no son nada si no es por su sentido del deber."
 pod1230objectives.27.a: "El legado de Jamal, el Camino del Fanático."
 pod1230objectives.27.custom: "Los personajes Haqimitas recibirán un modificador de Destreza." 
 pod1230objectives.27.b: "El legado de Nakurtum, el Camino del Diplomático."
 pod1230objectives.27.customb: "Los personajes Haqimitas recibirán un modificador de diplomacia." 
 pod1230objectives.27.c: "El legado de Al-Ashrad, el Camino del Hechicero."
 pod1230objectives.27.customc: "Los personajes Haqimitas recibirán un modificador de aprendizaje." 
 pod1230objectives.28.a: "El más Antiguo es, en verdad, sabio." 
 pod1230objectives.28.b: "Espera, ¿no estaban unidos antes?" 
 pod1230objectives.29.t: "El Pecado Político"
 pod1230objectives.29.desc: "«La mayoría de los forasteros juzgan erróneamente la Via Peccati como un camino de mera gratificación personal. A decir verdad, es una parte importante de la doctrina, pero el panorama general es distinto. La Via Peccati trata sobre el control político y la conciencia. Cuando los $pod_cainites$ se dejan llevar y sus Bestias son saciadas, se convierten en criaturas indolentes y fáciles de controlar. El verdadero Pecador conoce cada deseo y secreto de su corte, y utiliza cada uno en su beneficio. Como tal, que Roma haya sido controlada por un Ventrue de la Via Peccati durante tanto tiempo no tiene por qué ser una anomalía o una excepción, podría ser la norma. Si quiero dejar un legado a mis compañeros Pecadores, es este: Controlad el mundo con todos los excesos que podáis imaginar, y divertíos haciéndolo». Camilla, primera Cónsul Eterna"
 pod1230objectives.29.a: "La Via Peccati es el verdadero camino al poder."
 pod1230objectives.29.b: "Aún tengo lo mío."
 pod1230objectives.29.custom: "Tu fe se extenderá, convirtiendo a algunos de los $pod_cainites$ más... afables que te rodean." 
 pod1230objectives.30.a: "No entiendo cómo no se han canibalizado todavía." 
 pod1230objectives.30.b: "¿Satisfacer a la Bestia Y el poder temporal? El camino perfecto." 
 pod1230objectives.31.t: "Rey de Reyes"
 pod1230objectives.31.desc: "Hay verdades evidentes en la sociedad $pod_cainite$. Los Gangrel vagan por la naturaleza como salvajes, los Toreador se desviven por baratijas insignificantes, los Malkavian están perdidos entre profecías y locura... y, con solo los más arrogantes Lasombra para negarlo, los Ventrue están destinados a gobernar sobre la Estirpe. Es un hecho simple de la no-muerte, cierto desde las noches de la Segunda Ciudad, Persia y Roma. Sin importar la fe o la estructura política, toda construcción $pod_cainite$ está condenada sin un Ventrue al mando. Esta verdad ha despertado a menudo una pregunta entre tus hermanos: ¿quién gobierna a los gobernantes? Muy pocos se han atrevido a reclamar el manto del propio Ventrue como señor del principal $pod_clan$ $pod_cainite$. Ahora, tú eres uno de esos pocos. Puede que la Guerra de los Príncipes aún continúe, pero nadie negaría que los Ventrue ya no son meros Reyes de los no-muertos. Son Emperadores."
 pod1230objectives.31.a: "Primero el $pod_clan$ Ventrue, ahora el mundo."
 pod1230objectives.32.a: "Bastardos arrogantes." 
 pod1230objectives.32.b: "El orden natural de las cosas se respeta." 
 pod1230objectives.33.t: "Fe en las Sombras"
 pod1230objectives.33.desc: "«Nuestro $pod_clan$ es un $pod_clan$ de gobernantes. Sí, los Ventrue también reclaman este título, pero no entienden lo que es el verdadero gobierno. El verdadero gobierno no trata de poder, ni siquiera de influencia. Trata de la acción decisiva. Toma la crisis de la [Glossary('Ashirra','game_concept_ashirra_desc')] como ejemplo; cuando esto llegó a mi conocimiento, muchos ofrecieron consejo, abogando por la prudencia y la paciencia. Afirmaban que nuestros hermanos perdidos podrían ser perdonados, y que el $pod_clan$ se uniría de nuevo con el tiempo. Yo no estuve de acuerdo. Y, como sabe el lector instruido, la [Glossary('Ashirra','game_concept_ashirra_desc')] es ahora una mera nota al pie en la historia $pod_cainite$, debido al uso decisivo de todos los recursos del $pod_clan$ a mi disposición en aquel momento. ¡La misericordia y la compasión habrían traído la desunión al $pod_clan$ y la [Glossary('Ashirra','game_concept_ashirra_desc')] podría incluso seguir existiendo hoy en día! Toma este consejo de corazón, querido hermano o hermana: ponte una meta y no cedas hasta que la alcances. Entonces, y solo entonces, habrás dominado el arte del gobierno Lasombra». Crónicas del $pod_clan$ Lasombra pág. 45"
 pod1230objectives.33.a: "«Y ahora hablemos del arte de la Manipulación de las Sombras...»"
 pod1230objectives.33.custom: "Los gobernantes independientes de la [Glossary('Ashirra','game_concept_ashirra_desc')] verán cómo su autoridad se desmorona." 
 pod1230objectives.34.a: "La política Lasombra es un asunto sangriento." 
 pod1230objectives.34.b: "Una página de nuestra historia $pod_clan$ ha pasado." 
 pod1230objectives.35.t: "Crescente sobre Sombras"
 pod1230objectives.35.desc: "Desde las murallas de Medina hasta el Castel d’Ombro, el Faqih contempla su imperio y se pregunta: «¿Está segura mi gente?». Mientras la última batalla concluye con la victoria, el Faqih piensa: «¿Cómo evito más derramamiento de sangre?». Cuando todos los de la [Glossary('Ashirra','game_concept_ashirra_desc')] acuden a él en busca de guía, protección y consejo, el Faqih no se siente orgulloso, se siente humilde. Mientras se pone sus nuevas insignias, dignas de un Califa Eterno, el Faqih piensa en el futuro, en las mejores formas de asegurar que los fieles $pod_cainites$ estén a salvo, para siempre. Y cuando el último de los kuffar Lasombra es puesto de rodillas, el Faqih pregunta: «¿Elegirás la Media Luna... o el Sol?»."
 pod1230objectives.35.a: "Un fin y un comienzo"
 pod1230objectives.35.custom: "Los personajes Lasombra que sobrevivan recibirán una última oportunidad para convertirse." 
 pod1230objectives.351.title: "Tierras bajo la Media Luna"
 pod1230objectives.351.desc: "Durante mucho tiempo, las tierras del Islam han estado bajo el ataque de toda clase de enemigos. Adoradores del demonio, infieles, demonios, hombres lobo y muchos otros infestaban estas tierras, pero ya no. Ahora la tierra pura puede crecer, ahora puede ser el verdadero hogar de nuestra fe. Aunque muchos mortales ignoran este avance, notarán el cambio.\n\nLa fuerza de la [Glossary('Ashirra','game_concept_ashirra_desc')] es inigualable ahora. Su fe, implacable. Sus espíritus, invictos. Muchos claman ahora por la paz, mientras otros sugieren expandirse más allá de las tierras de la fe. Todos te miran ahora, listos para seguirte por cualquier camino que elijas."
 pod1230objectives.351.a: "Que nuestra fe nunca flaquee."
 pod1230objectives.352.title: "Espadas del Islam"
 pod1230objectives.352.desc: "La discrepancia entre Suleimán y Khalid hace muchos años sobre el papel de la Ashirra fue lo que llevó a la creación de los Pastores. Ahora está claro para todos que la oración por sí sola no nos servirá. Dejar el liderazgo del Islam en manos de mortales que pretenden comprender las palabras del Profeta es una locura. Muchos de nosotros caminamos junto al Profeta; somos nosotros quienes mantenemos su mensaje impoluto.\n\nNuestra posición es ahora clara para toda la Ashirra. Defenderemos el Islam con la espada. Estuvimos allí en el principio."
 pod1230objectives.352.a: "Y estaremos allí al final."
 pod1230objectives.36.a: "...La Media Luna." 
 pod1230objectives.36.b: "¡Jamás! ¡Esta guerra no ha terminado, [Glossary('Ashirra','game_concept_ashirra_desc')]!" 
 pod1230objectives.37.a: "¿Es este el fin de los $pod_clan$ Lasombra?" 
 pod1230objectives.38.t: "Verdad hasta Caín"
 pod1230objectives.38.desc: "«Dijeron que la muerte de Narsés, nuestro primer Arzobispo, sería nuestro fin. Resistimos. Dijeron que el asesinato del piadoso obispo St-Lys por parte del pagano Anatole era justo. No lo olvidamos. Dijeron que nuestra religión era una abominación, una parodia de las tradiciones de Caín. Nos mantuvimos firmes en nuestra creencia en el Tercer Caín y en la crueldad del Demiurgo. Dijeron que pronto seríamos un mal recuerdo, un remanente de una era olvidada. Somos más fuertes que nunca. Dijeron que la Iglesia mortal y su Inquisición nos acabarían. Nos mantenemos orgullosos en la Ciudad Santa, y los agentes de la odiada Iglesia de Pilatos se acobardan ante nosotros. ¿Ahora? No dicen nada y rezan con nosotros»."
 pod1230objectives.38.a: "Pronto, el Tercer Caín nos bendecirá"
 pod1230objectives.38.custom: "El resurgimiento de la Iglesia convertirá a algunos oportunistas a nuestra causa." 
 pod1230objectives.39.a: "Es hora de unirse al bando ganador." 
 pod1230objectives.39.b: "Al final seguirán fracasando." 
 pod1230objectives.40.a: "Un regreso improbable." 
 #pod1230objectives.41.t: "Eye of the Storm"
 #pod1230objectives.41.desc: "We are the sons and daughters of Genghis and Dobrul. Like them, we are conquerors, as our swift subjugation of the western steppes proved. But now, we must also be diplomats and statesmen. The $pod_wan_kuei$ are plotting their revenge, and our solid stronghold in the west will be a crucial point in protecting Dobrul's legacy. As such, we must still conquer, yes, but we must also make allies, like our western cousins of the Gangrel [Clan|E]. Be merciful when you win, graceful when you lose, and ruthless when you are crossed. Take pride in your ancestry, your family and your [Clan|E] but be wise enough to know when even their help isn't enough. Do not let pride blind you to the benefits of temporary alliances with westerners. With the old and new ways combined, we will crush the $pod_wan_kuei$ counterattack and then... then the world will be ours."
 #pod1230objectives.41.a: "Come, Demons of Xia, we are ready"
 #pod1230objectives.41.custom: "The western Gangrel, impressed by your swift conquest, will be receptive to your diplomacy for a time." 
 #pod1230objectives.42.a: "Are there even more threats coming from the east?" 
 #pod1230objectives.42.b: "Our cousins are very impressive." 

 pod1230objectives.43.t: "Lobos a la puerta"
 pod1230objectives.43.desc: "«La caída de la civilización $pod_cainite$ medieval puede rastrearse poco después de la primera caída de la Constantinopla mortal. La quema del Sueño de Miguel, por traición, fue un irónico presagio de los años venideros. Los llamados Altos Clanes pensaron que su posición era segura y sus imperios estaban a salvo y, en su arrogancia, conspiraron unos contra otros y no vieron la verdadera amenaza. Cuando la horda Gangrel barrió Europa y derribó a los poderosos, no fue ninguna sorpresa para el observador culto. Matasuntha con los hunos, y los [Glossary('Einherjar','game_concept_einherjar_desc')] con los vikingos; ambos fueron precursores del poderoso señor de la guerra que unió a los dispares Gangrel $pod_clan$ en una fuerza imparable. A medida que los castillos caían y los Príncipes morían, comenzó una nueva era de la historia $pod_cainite$. La Era de los Gangrel». «Ascenso y caída de la civilización $pod_cainite$» de Cuthbert Beckett."
 pod1230objectives.43.a: "Ya no tan altos ni poderosos"
 pod1230objectives.43.custom: "Los gobernantes civilizados recibirán una penalización masiva al control y a la guerra mientras su autoridad colapsa bajo el asalto de los lobos." 
 pod1230objectives.44.a: "Hemos ignorado las tierras salvajes durante demasiado tiempo" 
 pod1230objectives.44.b: "¡Es hora de derribar algunos castillos!" 
 pod1230objectives.45.t: "La Voluntad de Tremere"
 pod1230objectives.45.desc: "Mientras te arrodillas ante él, puedes sentir la envidia de todos los $pod_clan$. Tremere no despierta para cualquiera. Pero tú no eres cualquiera. Antes de tu ascenso, el $pod_clan$ estaba amenazado, su lugar en la noche era tenue en el mejor de los casos. ¿Ahora? Los engendros son un chiste triste, solos en sus castillos en ruinas. Esos astutos infernalistas, los ladrones de almas, han sido destruidos. Todos los Vástagos europeos te agradecen por aplastar sus últimos reductos. El $pod_clan$ Tremere está en camino a su destino legítimo, convirtiéndose en maestros de la noche. Mientras estás ante él, Tremere simplemente dice: «Lo has hecho bien». Por primera vez, Tremere tendrá una voz para su voluntad, alguien en quien confía lo suficiente como para ser señor del Círculo Interno. Tú."
 pod1230objectives.45.a: "Estoy en la cima de la Pirámide"
 pod1230objectives.45.custom: "Desatarás una maldición que paralizará a los Tzimisce, Salubri y taumaturgos renegados." 
 pod1230objectives.46.a: "Siguen siendo el $pod_clan$ de los Usurpadores" 
 pod1230objectives.46.b: "La inmortalidad y el poder son finalmente nuestros" 
 pod1230objectives.47.t: "Cambio eterno"
 pod1230objectives.47.desc: "Al entrar en la sala, sabes que la mayoría de ellos no saldrán de ella. Respondieron a tu llamada porque no tuvieron otra opción. Pues tú eres el Martillo de los Tremere, el Destructor de los Ventrue y ningún Tzimisce puede ignorarte más. Eso no significa que te respeten, sin embargo. Retomas tu trono mientras tus guardias entran y comienzan a masacrar a los inútiles. Suplican por sus vidas, maldicen tu nombre o intentan alcanzarte, pero tú estás concentrado en una pregunta mucho más importante: ¿a qué grupo perdonar? Necesitas apoderarte, de una vez por todas, del $pod_clan$ Tzimisce para ti, pero no puedes hacerlo solo. Mientras aplastas la cabeza de uno audaz que se lanzó hacia tu garganta, sabes que debes tomar tu decisión ahora o gobernarás sobre un montón de cenizas."
 pod1230objectives.47.a: "Guardias, perdonad a los descendientes de las dinastías reinantes."
 pod1230objectives.47.custom: "Fortaleces al $pod_clan$ Tzimisce en su conjunto, asegurando su legado como gobernantes intimidantes." 
 pod1230objectives.47.b: "Estimados sacerdotes Koldun, espero que no os resulten demasiado molestos"
 pod1230objectives.47.customb: "Todos los personajes Tzimisce se convertirán a [GetReligionByKey('roadofmetamorphosis_religion').GetName]." 
 pod1230objectives.47.c: "¡Tú, el de la capucha! Da un paso al frente..."
 pod1230objectives.47.customc: "Otros personajes Tzimisce serán drenados para alimentar tu ascenso al poder demoníaco." 
 pod1230objectives.48.a: "Un $pod_clan$ Tzimisce unido es una perspectiva aterradora..." 
 pod1230objectives.48.b: "La voluntad del Anciano en juego, sin duda" 
 pod1230objectives.49.t: "Conocimiento Prohibido"
 pod1230objectives.49.desc: "Todo el conocimiento del mundo... justo al alcance de tus manos. ¿Se sintieron así Adán y Eva antes de la Manzana? Tomó mucho tiempo y una inversión masiva recuperar los fragmentos destrozados del Códice, perdidos después de que Constancia lo hiciera pedazos durante su lucha contra Lazarus. Pero ya está hecho, y el Códice brilla ante ti, tentándote a acercarte, a leer solo una pequeña frase. Conoces los rumores: este texto modesto fue escrito por el propio Capadocio, luego llamado Sargón, y contiene todos los rituales, conocimientos y profecías de Enoc. Presuntamente, una forma de convertirse en igual de Dios también se encuentra en algún lugar de aquí, casi terminada por Sargón antes de su $pod_Embrace$. Pero sabes en lo más profundo de tu alma que este Códice no está destinado a mortales, ni siquiera a vampiros, y tu cordura podría quedar destrozada sin reparación. Mientras tu mano se acerca cada vez más, tomas una última decisión..."
 pod1230objectives.49.a: "¡Someteré el Códice a mi voluntad!"
 pod1230objectives.49.b: "...Mejor destrocemos esta cosa de nuevo y olvidémonos de ello."
 pod1230objectives.49.custom: "Tus hermanos Capadocios te agradecerán tu cautela." 
 pod1230objectives.50.a: "Algunos secretos es mejor dejarlos enterrados..." 
 pod1230objectives.50.b: "¡Tócalo! ¡Será divertido!" 
 pod1230objectives.51.t: "La Conspiración"
 pod1230objectives.51.desc: "Mientras hundes tus colmillos en su cuello, el tiempo parece detenerse a tu alrededor. Las imágenes empiezan a aparecer en los límites de tu conciencia mientras te dejas llevar hacia un éxtasis sublime. Te ves a ti mismo, investido como Jefe de la ilustre familia Giovanni en tu bastión italiano. Ves a tu pequeño consejo de familiares de confianza, ayudándote a planificar tu gran conspiración. Ves la noche de Europa redefinida por tu creciente imperio comercial, con todos los Clanes aceptando a regañadientes tu nueva presencia, tus sabios consejos y tu recién descubierta importancia, muy lejos de la inutilidad de vuestros hermanos Capadocio. Ves la Conspiración en marcha, utilizando todos tus recursos para convertirla en el éxito rotundo que merece ser. Al recuperar el sentido, y con el necio reducido a cenizas, ves a tu familia... no, a tu $pod_clan$... a tu alrededor. La noche es joven. Y será de los Giovanni."
 pod1230objectives.51.a: "Hermanos y hermanas, ha llegado el momento de que comience la Purga."
 pod1230objectives.51.custom: "Los $pod_clan$ Giovanni se separarán de los $pod_clan$ Capadocio y pondrán en marcha la conspiración. Los Giovanni serán muy eficaces en la Intriga durante un tiempo, mientras que los Capadocio serán muy susceptibles a ella." 
 pod1230objectives.52.a: "Esta repentina aparición de Clanes Usurpadores está empezando a ser preocupante..." 
 pod1230objectives.52.b: "La Purga está comenzando, será mejor que estés preparado." 
 pod1230objectives.53.t: "Nuevos Comienzos"
 pod1230objectives.53.desc: "En un sorprendente giro de los acontecimientos, el corrupto dominio de los Antiguos que existía desde el principio de los tiempos ha sido desafiado. No estás exactamente seguro de cuál fue el catalizador o de si este estado de cosas durará mucho tiempo, mientras tus enemigos conspiran para aplastar tu rebelión insurgente. Pero, tras tu lucha contra los Príncipes de la noche, muchos se han reunido para unirse a tu causa. Algunos siguen tu ejemplo, mientras que otros han comenzado a experimentar con nuevos Constructos políticos. Es, en verdad, una nueva y extraña noche, ya que te encuentras en la posición de un respetado pacificador entre las diversas facciones que cobran vida. No eres un gobernante anticuado, sino la roca sólida que defiende los Estados Libres de los contraataques y la interferencia mortal. Es una posición precaria de honor dudoso, rodeada de peligros y amenazas por todos lados. Pero, en realidad, no hay otro lugar donde preferirías estar ahora mismo."
 pod1230objectives.53.a: "Nos adentramos con audacia en una nueva era."
 pod1230objectives.54.a: "Tenemos que enseñar a esos recién nacidos su lugar." 
 pod1230objectives.54.b: "La revolución está en marcha." 
 pod1230objectives.55.t: "El Abrazo de la Serpiente"
 pod1230objectives.55.desc: "«Una vez, estabas ciego ante la belleza de Set. Os llamabais $pod_cainites$, pues un falso progenitor os engañó para que lo adoraseis. Ahora, lo sabéis mejor: solo se debe adorar a un Dios. Un Dios misericordioso, porque Él perdonará vuestras transgresiones pasadas contra Él, pero también un Dios vengativo, porque de esta noche en adelante, los últimos $pod_cainites$ serán marcados como enemigos de Set y convertidos, o llevados ante el implacable ojo de Ra. No habrá tregua hasta que toda Europa alabe Su glorioso nombre; entonces, y solo entonces, ¡nos bendecirá con Su regreso! ... Venid, hijos míos, recemos en el templo por la llegada de este tiempo glorioso. Entonces, disfrutad de las recompensas de vuestra sabia elección, pues la noche aún es joven...»"
 pod1230objectives.55.a: "No hay $pod_cainites$, solo Setitas."
 pod1230objectives.55.custom: "Algunos de los $pod_cainites$ de Europa y de más allá, con una mentalidad más... avanzada, se convertirán a la gloriosa verdad." 
 pod1230objectives.55.customb: "Obtendrás reclamaciones sobre vuestros enemigos ancestrales, los Assamita $pod_clan$." 
 pod1230objectives.56.a: "Puede que estos locos egipcios tengan razón en algo..." 
 pod1230objectives.56.b: "¡Alabado sea Set, y bienvenidos sean su inminente regreso!" 
 pod1230objectives.57.t: "El Ajuste de Cuentas"
 pod1230objectives.57.desc: "Este debería ser el momento de tu mayor triunfo... Entonces, ¿por qué se siente tan vacío? Contra todo pronóstico, has rescatado a tu $pod_clan$ del borde de la extinción, has ejecutado tu venganza contra los Tremere y has pacificado a los Baali una vez más, pues es tu deber. Pero, en el camino, lo has perdido mucho más. Saulot era un cuidador, un alma bondadosa que habría derramado tantas lágrimas por los sacrificios, la sangre y el dolor que has traído en tu camino. Te llaman «El Ángel Vengador», pues no has tenido piedad y, tal vez, has sido fiel a los rumores que los Tremere contaban sobre tu $pod_clan$. Eres la espada de los Salubri, la luz del $pod_clan$. Pero también estás perdido, sin alma, y eres la mayor amenaza para tu propia gente ahora que tus enemigos han sido erradicados. Ahora, como tantas otras veces, sientes la mirada vigilante de Saulot sobre ti, ofreciéndote una última oportunidad para detenerte antes de que sea demasiado tarde..."
 pod1230objectives.57.a: "Saulot se equivocaba, todos pagarán."
 pod1230objectives.57.b: "¿Qué he hecho? Padre, perdóname..." 
 pod1230objectives.57.custom: "Las mentiras de los Tremere sobre tu $pod_clan$ quedan expuestas y sufren un importante revés político por ello." 
 pod1230objectives.58.a: "El $pod_clan$ Salubri vuelve a estar en juego una vez más." 
 pod1230objectives.58.b: "¡Demonios! ¡Ladrones de almas!" 
 pod1230objectives.59.t: "El Fin de las Eras"
 pod1230objectives.59.desc: "«Construís imperios inimaginables, la cúspide del logro humano y $pod_cainite$, la envidia del mundo... ¿Creísteis que duraría? Vuestras prestigiosas ciudades, monumentos de poder, sabiduría y gloria se mantienen en pie, pero yacen heridas por chacales, rodeadas de buitres, perforadas hasta la muerte por mil pequeños cortes, abatidas por vuestra propia arrogancia. Estos son los estertores de muerte de los Hijos de Caín; la luz de la civilización se desvanece. Aprovechad el poco tiempo que os queda para hacer las paces con vuestros pecados, pues incluso en el momento de vuestra derrota final, no hallaréis consuelo en el olvido... Voy a por vosotros. Llego con millones. ¡Traigo el Fin de las Eras! ¡Soy el Azote de los Dioses! Esta es la Tercera Guerra Baali... y no habrá una cuarta»."
 pod1230objectives.59.a: "Veré arder vuestro mundo."
 pod1230objectives.60.a: "¡Debemos derrotarlos a cualquier precio!" 
 pod1230objectives.60.b: "Y así, comienza..." 
 pod1230objectives.61.t: "Protegiendo el Mal"
 pod1230objectives.61.desc: "Hay horrores acechando en las profundidades que incluso el $pod_cainite$ más inquebrantable temería imaginar. Los llamáis «Hijos», pues son los Hijos de las primeras noches, antes de que la humanidad comenzara. Estas criaturas duermen y nadie sabe ya de ellas, excepto vuestra orden. Comprendéis que no pueden ser destruidas, solo alimentadas para mantenerlas en letargo. Y, como se alimentan de los Inocentes, vuestra gente es vista con desconfianza como infernalistas y algo peor. Pero alguien tiene que hacerlo, y solo vuestra gente posee la Fortaleza. Ahora que habéis purgado a vuestros hermanos locos de la Orden de Azaneal, los Hijos pueden continuar su sueño y el mundo puede seguir girando. Vuestra orden lo mantendrá así, sea cual sea el coste."
 pod1230objectives.61.a: "Y así, nuestra vigilia continúa."
 pod1230objectives.62.a: "Divagaciones dementes de adoradores del mal." 
 pod1230objectives.62.b: "Solo podemos esperar un sueño sin sueños."        
 pod1230objectives.63.t: "Oeste y Este"
 pod1230objectives.63.desc: "El $pod_clan$ Ravnos tiene profundas raíces en la India, donde es respetado como un $pod_clan$ de gobernantes con una autoridad sabia. En el mundo occidental, sin embargo, los Ravnos eran una mezcla incoherente de fes en conflicto, a menudo incomprendidos y rechazados por los poderes locales. Esta larga opresión ha llegado a su fin con vuestro ascenso al poder. Por primera vez, un Ravnos posee un poder considerable en Occidente y puede desafiar incluso a su clase gobernante $pod_cainite$, muy bien establecida. Mejor aún, esto ha llamado la atención de vuestros clanes en la India, que han enviado embajadores para elogiar a sus parientes errantes y pedir una alianza. Algunos se preguntarían, sin embargo... ¿Dónde estaban durante las noches más oscuras de vuestros hermanos en Europa? Pero quizás este sea el momento del perdón..."
 pod1230objectives.63.a: "Tenemos un nuevo hogar, pero no olvidaremos la India."
 pod1230objectives.63.b: "El nuevo $pod_clan$ Ravnos no olvida tan fácilmente." 
 pod1230objectives.63.custom: "La autoridad de los Clanes gobernantes tradicionales de Occidente, Ventrue, Lasombra y Tzimisce, será desafiada por vuestro ascenso durante un tiempo." 
 pod1230objectives.63.customb: "Los Ravnos del este enviarán a un fuerte candidato para el $pod_Embrace$ como regalo. Este personaje se convertirá en vuestro cortesano."  
 pod1230objectives.64.a: "Ya tenemos suficientes «[Glossary('Clans','game_concept_Clan_desc')] gobernantes»." 
 pod1230objectives.64.b: "Una nueva y brillante era para nuestra estirpe."
 pod1230objectives.65.t: "Terminando lo Eterno"
 pod1230objectives.65.desc: "La India nunca ha estado en paz. Los [Glossary('Asuratizayya','game_concept_kuei_jin_desc')], o [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] en su lengua, han invadido constantemente nuestra tierra, utilizando nuestras divisiones internas para enfrentarnos los unos contra los otros. Estos llamados Demonios Hambrientos no se preocupan por nuestras Tradiciones y no tienen reparos en usar las tácticas más rastreras para imponer su ventaja en su llamada «Guerra Baja». A veces, hemos sido empujados al borde de la extinción por los pactos demoníacos que realizan con tanta facilidad. Pero ahora, la India despierta. Ya sean Ravnos, Nagaraja o Danava, los $pod_cainites$ nativos están encontrando una nueva fuerza y unidad de propósito. No os engañéis, la Guerra Eterna no terminará hasta que ningún [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] se atreva a vagar por nuestras tierras. Como el nuevo Chakravarti de la India, esta es mi primera orden: matadlos a todos."
 pod1230objectives.65.custom: "Los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] supervivientes serán cazados implacablemente." 
 pod1230objectives.65.customb: "Unificaréis la India en un nuevo imperio."  
 pod1230objectives.65.a: "La India contraataca."  
 pod1230objectives.66.a: "India finalmente está reaccionando." 
 pod1230objectives.66.b: "No es más que un contratiempo." 
 pod1230objectives.67.t: "Auge del Sol Escarlata"
 pod1230objectives.67.desc: "«...A decir verdad, deberías haber derrotado a esos bárbaros hace siglos». Apenas puedes reprimir al demonio que llevas dentro para que no desgarre la garganta del embajador de las Cortes Domésticas, que ha venido a «felicitarte» por tu victoria. Miles de [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] fracasaron en la invasión de la India antes de que tú tomaras el mando pero, aun así, apenas eres reconocido por tus iguales, y su desdén por tu nueva corte se manifiesta en cada ocasión. No tienen ni idea de la realidad de la situación aquí; los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] incluso podrían haber perdido si no hubieras intervenido para salvar la noche. Aun así, los necesitas si quieres aspirar a ambiciones mayores y convertirte en un Ancestro plenamente formado... ¿o no? No habrá mejor oportunidad para actuar por cuenta propia que sobre las cenizas de tu mayor triunfo..."
 pod1230objectives.67.custom: "Unificaréis la India en un nuevo imperio."  
 pod1230objectives.67.a: "Envía mis más sinceras gracias a los Reverenciados Ancestros." 
 pod1230objectives.67.b: "Anunciaré mi independencia ante vuestros amos. Con vuestra cabeza."  
 pod1230objectives.68.a: "Los Demonios Asiáticos han ganado esta ronda." 
 pod1230objectives.68.b: "Una nueva Corte surge. Con todas sus oportunidades."  
 pod1230objectives.69.t: "El Reino de Ébano"
 pod1230objectives.69.desc: "Los no-muertos en África provienen de diversas fuentes, desde los hijos de Caín hasta la hechicera autoproclamada de los Ramanga, pero todos comparten un sentido de afinidad cultural que les lleva a presentarse como «Laibon». Hasta ahora, no ha sido más que eso, con la fachada de unidad resquebrajándose fácilmente ante la presión de forasteros, ya sean [Glossary('Ashirra','game_concept_ashirra_desc')] $pod_cainites$ o incluso enemigos más antiguos. Sin embargo, los tiempos están cambiando, ya que los no-muertos africanos han encontrado un líder común, al que llaman el «Primer Magaji». No será una tarea fácil, pues vuestros hermanos no están acostumbrados a la unidad y los ánimos ya están muy caldeados. Pero, al menos por ahora, gozáis del beneficio de la duda y del respeto reticente de vuestros iguales. Eso es más de lo que nadie antes que vosotros ha conseguido jamás."
 pod1230objectives.69.a: "Un líder compartido para una unidad compartida." 
 pod1230objectives.70.a: "Para bien o para mal, África se levanta." 
 pod1230objectives.70.b: "Seguiremos estas historias con gran interés."  
 pod1230objectives.71.t: "La Espada de Dios brilla"
 pod1230objectives.71.desc: "La orden más militante de la Inquisición de las Sombras, los Caballeros de Acre, siempre han sido los más ansiosos por centralizar la organización de Retoños. Quizás demasiado ansiosos, dirían algunos, ya que el fanatismo de los Caballeros a veces roza el Frenesí desenfrenado, sin distinguir realmente entre amigos y enemigos.\nSin embargo, los tiempos han cambiado, y la destrucción final de algunos de sus enemigos más antiguos y la purga de Constantinopla han forjado la Espada de Dios como un arma nueva y más letal. Pero también una más precisa y sutil cuando es necesario, asegurando que la Inquisición no tenga que enfrentarse nunca más a problemas internos causados por ellos.\nGauthier, mientras nos observa desde el Cielo, debe de estar sonriendo por fin."
 pod1230objectives.71.custom: "Estás un paso más cerca de unificar la Inquisición de las Sombras."  
 pod1230objectives.71.customb: "El recluta más elitista de los Caballeros de Acre se ha unido a tu corte"   
 pod1230objectives.71.a: "No hay mayor furia que la de un caballero despreciado." 
 pod1230objectives.72.a: "La Inquisición de las Sombras se ilumina..." 
 pod1230objectives.72.b: "Una victoria para la Santa Iglesia."  
 pod1230objectives.73.t: "La Mano Protectora de Dios"
 pod1230objectives.73.desc: "Las Hermanas de San Juan son quizás la orden menos visible de la Inquisición, pero desempeñan el deber más arduo. Atormentadas por visiones que llevan a muchos a la locura, las Hermanas soportan una carga que pocos podrían aspirar a sobrevivir.\nSu compromiso con la causa ha flaqueado en ocasiones, y algunos han pensado que elegirían retirarse a la vida monástica con la esperanza de evitar estas visiones traumáticas. Pero las Hermanas aún no han terminado; en una ceremonia silenciosa y digna, han renovado su participación en la gran causa. Su sufrimiento no terminará hasta que la última alma maldita sea purgada de la Tierra de Dios."
 pod1230objectives.73.custom: "Estás un paso más cerca de unificar la Inquisición de las Sombras."  
 pod1230objectives.73.customb: "El recluta más elitista de las Hermanas de San Juan se ha unido a tu corte"   
 pod1230objectives.73.a: "Las mujeres bendecidas no rehuirán su deber"     
 pod1230objectives.75.t: "Los Ojos Abiertos"
 pod1230objectives.75.desc: "El Oculi Dei es un mal necesario; la policía secreta de la Inquisición ha recibido la ingrata tarea de vigilar a los cazadores. Compuestos por locos totalmente paranoicos, si es que se puede confiar en los otros Inquisidores, aun así han descubierto muchos nidos de corrupción dentro de la Santa Iglesia.\nA pesar de la constante presión para disolver la orden, el Oculi Dei sigue ahí y ha purgado silenciosamente a sus miembros más extremistas. Recientemente, se han ganado el respeto reticente de las otras órdenes, que ahora los ven como una herramienta útil, aunque peligrosa.\nLos ojos se dirigen ahora totalmente contra los siervos del Mal, ya sea dentro de la Iglesia o fuera de ella."
 pod1230objectives.75.custom: "Estás un paso más cerca de unificar la Inquisición de las Sombras."  
 pod1230objectives.75.customb: "El recluta más elitista del Oculi Dei se ha unido a tu corte"   
 pod1230objectives.75.a: "El Mal ya no podrá esconderse"     
 pod1230objectives.77.t: "Guardianes de Secretos"
 pod1230objectives.77.desc: "La Orden Roja tuvo una historia complicada con la Inquisición. Su búsqueda de conocimiento es invaluable, ya que contrarresta la naturaleza hermética de los siervos del Infierno. Pero también situó a los miembros de la Orden en una posición peligrosa, donde la corrupción y los tomos prohibidos acechan en cada esquina.\nTras la destrucción de algunas de las influencias vampíricas más insidiosas de Italia, la Orden Roja está mejor equipada para juzgar qué merece la pena perseguir y qué debe ser destruido.\nCon este nuevo enfoque, la Orden Roja es un activo más poderoso para la Inquisición de lo que jamás ha sido."
 pod1230objectives.77.custom: "Estás un paso más cerca de unificar la Inquisición de las Sombras."  
 pod1230objectives.77.customb: "El descendiente más elitista de los Von Murnau se ha unido a tu corte"   
 pod1230objectives.77.a: "Conocimiento sin tentación"     
 pod1230objectives.79.t: "Trabajando con laicos"
 pod1230objectives.79.desc: "La Casa von Murnau es un aliado extraño para las otras órdenes de la Inquisición. Siendo una casa noble alemana sin vínculos reales con el clero, Dios los ha bendecido (o algunos dicen que los ha maldecido) para ser capaces de oler literalmente el Mal. Este poder, junto al fuerte liderazgo de figuras como Otto y Leopold von Murnau, los ha convertido en aliados incondicionales de la Santa Sede.\nA pesar de esto, ha hecho falta tiempo para que la familia von Murnau y su prolífica influencia se sumen plenamente al proyecto de la Inquisición. Ahora, seguros en sus posesiones alemanas, están listos para desempeñar su papel en la guerra en las sombras con aún más celo."
 pod1230objectives.79.custom: "Estás un paso más cerca de unificar la Inquisición de las Sombras."  
 pod1230objectives.79.customb: "El descendiente más elitista de los Von Murnau se ha unido a tu corte"    
 pod1230objectives.79.a: "Nobleza por una causa piadosa"      
 pod1230objectives.81.t: "De las Sombras a la Luz"
 pod1230objectives.81.desc: "A pesar de haber sido fundada por individuos extraordinarios, la Inquisición de las Sombras siempre fue frágil. Sumado a los feroces, pero obvios, enemigos que son los chupasangre, los conflictos internos entre las distintas órdenes eran un problema constante. Casi parecía que la Inquisición estaba destinada a caer en múltiples ocasiones.\nYa no más. Tras lograr una serie de victorias clave contra los vampiros, la Inquisición de las Sombras emerge más fuerte que nunca y más unida en su propósito que antes. Ningún siervo de la oscuridad podrá perforar el escudo de la humanidad nunca más.\nLa Inquisición ha ganado y pronto ejecutará el juicio final de Dios sobre los $pod_cainites$."
 pod1230objectives.81.a: "La batalla final comienza"     
 pod1230objectives.83.t: "El Principio del Fin"
 pod1230objectives.83.desc: "La secta más antigua del mundo, los Tal'mahe'Ra, trabaja incansablemente para destruir la raza $pod_cainite$, acelerando la Gehenna para lograr este objetivo.\nLa pérdida de contacto entre las partes oriental y occidental de la secta, cortada por los Assamita de Persia, ha sido un grave obstáculo durante siglos, algo que acabas de reparar. Con la verdadera Mano Negra restaurada, se han logrado grandes éxitos hacia el objetivo final. Con la enorme red de agentes a disposición de la secta, ha comenzado una guerra sombría de manipulación y engaño, con la esperanza de desestabilizar las instituciones $pod_cainite$.\nEn el caos que se producirá, planeas que los mortales sean capaces de destruir la mayor parte de la decadente civilización $pod_cainite$. Entonces, por fin, la maldición de Caín será purgada de este mundo miserable."
 talmahera_objective_custom: "Sembrarás la semilla de la rebelión en los vasallos de los señoríos $pod_cainite$"  
 pod1230objectives.83.a: "Un paso más cerca..."      
 pod1230objectives.84.b: "El Del'Roh es sabio"     
 pod1230objectives.84.a: "¡¿Qué locura es esta?!"
 pod1230objectives.85.t: "Bajo la Cruz Negra"
 pod1230objectives.85.desc: "El ascenso del prominente Ventrue alemán ha sido vertiginoso para los estándares de $pod_cainite$. Lo que en la era antigua no era más que un rincón remoto para exiliados, se ha convertido en el centro del $pod_clan$ en un corto periodo de tiempo tras la caída de Roma.\nSu primer revés fue la paz blanca impuesta a Jürgen von Verden tras su fallida invasión del Voivodato Tzimisce. Pero los Ventrue nunca dejaron de mirar hacia el este, y sus esfuerzos finalmente han dado frutos.\nCon la venganza por la derrota de Jürgen consumada y los Ferales de Livonia pacificados, los Ventrue han asegurado su flanco oriental.\nAhora, el oeste les llama, ya que la ascensión de la Cruz Negra está lejos de terminar. Y un nuevo y prometedor humano ha sido presentado en la vanguardia de los Ventrue como recompensa por su éxito, y como arma para futuras conquistas."
 pod1230objectives.85.a: "Esto no es más que el principio"      
 pod1230objectives.86.a: "¡Debemos detener a estos arrogantes Ventrue!"     
 pod1230objectives.86.b: "Como debe ser"
 
 pod1230objectives.87.t: "Un nuevo Matusalén"
 pod1230objectives.87.desc: "Tanto los Tremere como los Nagaraja demostraron en su día que el vampirismo puede adquirirse mediante la hechicería mágica, algo que tú has estado estudiando durante un tiempo. Este complejo proceso está lejos de ser seguro y requiere sangre potente. No tienes acceso al repositorio de magia que tenían los Tremere, así que te has centrado en adquirir la sangre más fuerte posible con los prisioneros que ahora mismo se encuentran en tu mazmorra.\nHa llegado el momento de ejecutar el ritual y, con suerte, convertirte en un poderoso vampiro del clan con el que estás experimentando. Si todo sale bien, serás un inmortal que no debe nada a ningún sire y con más poder del que cualquier neonato podría soñar. ¡Tu esclavitud ante despiadados amos vampiros termina ahora!"
 pod1230objectives.87.sucess: "¡La inmortalidad te aguarda!"
 pod1230objectives.87.fail: "¡No, no, no!"
 pod1230objectives.87.fail.tt: "Has fallado, pero obtienes una parte del poder de la sangre, lo que te da acceso al [elder_perk|E] y podrás intentar el ritual de nuevo cuando el efecto desaparezca."
 
 pod1230objectives.88.t: "Un nuevo Matusalén"
 pod1230objectives.88.desc: "Tanto los Tremere como los Nagaraja demostraron en su día que el vampirismo puede adquirirse mediante la hechicería mágica, y esta hazaña se ha repetido una vez más. Un nuevo Matusalén surge, alguien que antaño fue un mero aparecido, decidido a dejar su propia huella en la sociedad nocturna que tan bien conoce."
 pod1230objectives.88.a: "Esto no es más que el principio"
 
 pod1230objectives.89.a: "¡Más ladrones arrogantes!"
 pod1230objectives.89.b: "Nuestro ejemplo."
 
 # pod1230objectives.87.t: "Satiated with Power"
 # pod1230objectives.87.desc: "The sacrifices turned to withered husks, their blood is now coursing through your veins saturating your mind and body with divine vigour. Unlike your experiment subjects, you remain very much alive, the curse of unlife was distilled away from the $pod_vitae$ leaving only power. The only curse cast today has befallen those foolish enough to stand in your way.\nYou have outdone even the Tremere magi that stole the divine blood to become vampires, and your achievements will be remembered, and feared, for generations to come."
 # pod1230objectives.87.a: "What belonged to my masters is now mine."
 # pod1230objectives.88.t: "A Ritual Most Unholy"
 # pod1230objectives.88.desc: "News speaking of an arrogant [ghoul|E] upstart performing vile sorcery to usurp the power of Kindred $pod_vitae$ reach your court. The rumours of the degree of transgression against the sanctity of the blood are disturbing to say the least."
 # pod1230objectives.88.a: "What does that mean for the Kindred?"
 # pod1230objectives.88.b: "The Kindred will punish that fool."
 # pod1230objectives.89.t: "The Price of Hubris"
 # pod1230objectives.89.desc: "You might be the only one seeing the ugly truth. This war will not be won by force of arms alone. You need a new, more terrible, approach.\nThey think you mad. They think you are lost to God's warm light. But the truth is, you have never been closer. Only you know that, to win decisively, all tactics must be employed. And you will not shy from that duty, as painful for your soul it might be.\nAfter all, God will recognize his own."
 # pod1230objectives.89.a: "...Oil the rack"
 
 # pod1230objectives.890.t: "Dear [ROOT.Char.GetFirstNameNoTooltip],"
 # pod1230objectives.890.desc: "You are hereby cordially invited to [host.GetTitledFirstNamePossessive] grand feast held to celebrate [host.GetHouse.GetBaseNameNoTooltip] entering a new era of greatness."
 # pod1230objectives.890.a: "I can't wait!"
 # pod1230objectives.890.b: "New era? I don't like the sound of that."
 # pod1230objectives.891.t: "The Feast for the New Generation"
 # pod1230objectives.891.desc: "As the evening falls, the great hall slowly fills with guests. The pent-up excitement characteristic of those last moments before a feast is to begin in earnest is palpable in the air, but you can safely assume that none of those present feel it as strongly as you. Certainly not those blissfully unaware of their role in the festivities. Your majordomo signals that all guests who responded to invitations are present and accounted for and you signal back to have the guards silently bar the doors. As you make your way to the head of the table, your [blood_father.Custom2('RelationToMeShort', SCOPE.sC('obsolete_child'))] [obsolete_child.GetFirstNameNoTooltip] intercepts you and asks: \n - My [obsolete_child.Custom2('RelationToMeShort', SCOPE.sC('blood_father'))], the feast is starting, alas I can not see or smell any food. Are you planning to make us fast?" 
 # pod1230objectives.891.a: "Do not fret, [obsolete_child.GetFirstNameNoTooltip], [ROOT.Char.GetFaith.HighGodName] will send us the the nourishment."
 # pod1230objectives.892.t: "To health! To power!"
 # pod1230objectives.892.desc: "Kinsmen! - you being - All of you gathered here tonight will be granted the honour of lending the strength of your noble blood to the cause of elevating the name of House [blood_father.GetHouse.GetBaseNameNoTooltip] to new heights of glory. Many of you will do so with the help of your younger brothers and sisters who's bodies and minds are better suited for the task, yet do not despair for your service will be remembered and your sacrifice will be honoured. Now, my children of the true $pod_vitae$, boldly reach for your inheritance and make it your strength, take your predecessors' blood and rid them of the burden of it power. Gorge yourself on the past and become the future!"
 # pod1230objectives.892.a: "Take them and feast!"
 # pod1230objectives.893.t: "Consolidated power"
 # pod1230objectives.893.desc: "The feeding frenzy subsides. As gruesome of an ordeal it was, there is not a hint of shame or guilt among even your relatively soft-hearted children. There is a profound sense of satisfaction, gratitude and contentment permeating the blood-splattered hall. What is done, is done."
 # pod1230objectives.893.a: "A new era begins!"
 
 pod1230objectives.255.title: "Sangre Nueva"
 pod1230objectives.255.desc: "Finalmente, estás listo para formar parte de la sociedad de $pod_cainite$. Probablemente te rechacen, temerosos como son de las profecías insignificantes, pero ahora eres demasiado poderoso para ser ignorado.\nYa no eres un mero caitiff; te encuentras en una posición única para moldear tu nueva Línea de Sangre a tu imagen, y ya no podrán detenerte. Ahora bien, ¿qué camino elegirás?"
 pod1230objectives.255.option.diplomacy: "La diplomacia siempre es la respuesta"
 pod1230objectives.255.option.war: "¡Es hora de la guerra!"
 pod1230objectives.255.option.prowess: "No les mostraremos piedad"
 pod1230objectives.255.option.stewardship: "Los gobernaremos, porque sabemos cómo hacerlo"
 pod1230objectives.255.option.intrigue: "Ni siquiera nos verán venir"
 pod1230objectives.255.option.learning: "No tenemos tiempo para esto, el conocimiento aguarda"
 pod1230objectives.255.option.secret: "Somos los verdaderos herederos de Caín y pronto aprenderán a obedecer"
 pod1230objectives.256.title: "Poder de la Sangre"
 pod1230objectives.256.desc: "Ahora debes elegir tres [Glossary('Disciplinas','game_concept_discipline_desc')] distintivas de tu Línea de Sangre. Solo puedes elegir aquellas [Glossary('Disciplinas','game_concept_discipline_desc')] que poseas tú mismo" 
