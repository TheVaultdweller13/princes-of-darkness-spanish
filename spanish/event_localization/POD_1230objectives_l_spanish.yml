 pod1230objectives.173.desc: "Las órdenes militares suelen tener requisitos previos específicos para fines de reclutamiento. Los mortales, por ejemplo, suelen ser monjes guerreros de algún tipo, aunque no siempre es el caso. En el mundo de los vampiros hay muchas más posibilidades.\nAlgunas órdenes se enorgullecen de defender las virtudes caballerescas hasta el extremo, considerando solo a candidatos honorables.\nOtras, como los Caballeros de la Cruz Negra, son famosas por utilizar una orden mortal como centro de reclutamiento, infiltrándose en la organización para buscar candidatos potenciales.\nAlgunas son especialmente elitistas, con requisitos y procedimientos de prueba muy estrictos antes de aceptar a un recluta.\nA otras no les importan tales asuntos en absoluto, simplemente acogiendo a todo aquel que muestre el más mínimo interés.\nPor último, existen órdenes especializadas, aquellas que solo aceptan un género, un clan o una fe para sus miembros."
 pod1230objectives.173.a: "El honor por encima de todo." 
 pod1230objectives.173.b: "Usaremos una orden mortal como tapadera." 
 pod1230objectives.173.c: "¡Solo los mejores pueden unirse a nosotros!" 
 pod1230objectives.173.d: "¡Todos son bienvenidos!" 
 pod1230objectives.173.e: "Tenemos algunas necesidades específicas." 
