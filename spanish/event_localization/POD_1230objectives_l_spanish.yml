 pod1230objectives.176.desc: "La presencia de un culto en una región puede ser una fuerza muy perturbadora. Es raro que los poderes locales quieran oponerse a ellos directamente, ya que una guerra en su propia puerta puede ser más destructiva de lo que merece la pena. Algunos esperan hallar un acuerdo con el culto, lo cual resulta más fácil si sus puntos de vista coinciden.\nEn cualquier caso, la población suele estar demasiado ansiosa por seguir la palabra de un maestro de culto. Dotado de poderes sobrenaturales, con gran carisma y sabiduría, y seguido por una comitiva de creyentes fervientes, es más que suficiente para impresionar al campesinado supersticioso."
 pod1230objectives.176.a: "¡Escuchad la verdad!" 
 pod1230objectives.176.b: "¡Vuestro señor es una engendro del infierno!" 
 pod1230objectives.176.c: "¡No os resistáis a lo que está por venir!" 
 pod1230objectives.176.d: "Quedaos un rato y escuchad." 
 pod1230objectives.176.e: "Rezad y trabajad duro." 
 pod1230objectives.176.f: "Las donaciones son apreciadas." 
 
 year_black_kites_japan_decision: "Año de los Milanos Negros"
 year_black_kites_japan_decision_tooltip: "Es hora de hacer oficial la división."
 year_black_kites_japan_decision_desc: "Aunque técnicamente abarca tanto Corea como Japón, la Corte del Dragón Azul ha perdido su poder fuera del continente hace mucho tiempo. Si Japón va a alzarse como su propia fuerza política, tendrá que hacer oficial esta división."
 year_black_kites_japan_decision_confirm: "Ya no sois necesarios."
 year_black_kites_japan_custom_decision: "El año debe ser al menos #V 1242#!"
 year_black_kites_japan_custom_decision2: "[GetTitleByKey('e_goryeo').GetNameNoTier] no debe poseer tierras en Japón."
 year_black_kites_japan_decision_effect: "Japón se convertirá en su propio Imperio y se desbloquearán nuevos objetivos."
 
 pod1230objectives.177.desc: "La Corte del Dragón Azul fue instituida como la Corte gobernante de Japón y Corea cuando el [Glossary('Dharma','podgloss.dharma')] ortodoxo (y alineado con China) se extendió por las islas hace mucho tiempo. Desde entonces, Japón ha crecido en influencia, llegando incluso a ser el centro de la propia corte. Esto ha causado fricciones con el continente, que sigue viendo a Japón como un «hermano pequeño» algo indisciplinado que necesita guía.\nCon el lento declive de las Cortes continentales y la consolidación del poder de Japón, era solo cuestión de tiempo que la división se hiciera oficial. Se ha consumado esta noche, y los indignados $pod_kueijin$ chinos y coreanos no pueden hacer más que maldecir y lanzar vacías amenazas de represalia.\nLa Corte del Dragón Azul ya no existe y las Cortes Uji se erigen ahora como un nuevo contendiente en el panorama político nocturno de Asia Oriental.\n\nComo gobernante que ha anunciado formalmente esta división, deberás lidiar con las secuelas y con los muchos vampiros menores de lealtad china o coreana que permanecen en Japón.\nAlgunos Clanes aconsejan una separación pacífica, permitiéndoles quedarse o irse según deseen siempre que sigan las nuevas reglas. Otros Clanes, más agresivos, abogan por una retribución más dura, confiscando sus bienes y expulsándolos de las islas por la fuerza."
 pod1230objectives.177.a: "Seremos magnánimos." 
 pod1230objectives.177.b: "¡Largo de aquí!" 
 peaceful_year_black_kites_modifier: "Año pacífico del Milano Negro"
 aggressive_year_black_kites_modifier: "Año hostil del Milano Negro"

 pod1230objectives.178.desc: "La Corte del Dragón Azul fue instituida como la Corte gobernante de Japón y Corea cuando el [Glossary('Dharma','podgloss.dharma')] ortodoxo (y alineado con China) se extendió por las islas hace mucho tiempo. Desde entonces, Japón ha crecido en influencia, llegando incluso a ser el centro de la propia corte. Esto ha causado fricciones con el continente, que sigue viendo a Japón como un «hermano pequeño» algo indisciplinado que necesita guía.\nCon el lento declive de las Cortes continentales y la consolidación del poder de Japón, era solo cuestión de tiempo que la división se hiciera oficial. Se ha consumado esta noche, y los indignados $pod_kueijin$ chinos y coreanos no pueden hacer más que maldecir y lanzar vacías amenazas de represalia.\nLa Corte del Dragón Azul ya no existe y las Cortes Uji se erigen ahora como un nuevo contendiente en el panorama político nocturno de Asia Oriental."
 pod1230objectives.178.a: "Un signo del cambio de eras." 
 
 dominant_uji_decision: "Uji Dominante"
 dominant_uji_decision_tooltip: "Debemos liderar la nueva era de Japón."
 dominant_uji_decision_desc: "Cada Uji (clan) japonés tiene un enfoque diferente. Por tanto, para lograr la dominación sobre los demás, primero deben demostrar que son maestros de sus artes."
 dominant_uji_decision_confirm: "¡Llevando a Japón a la gloria!"
 dominant_uji_knight_tt: "Necesitas cinco campeones o más con #V 35#! o más de [prowess|E]"

 rising_sun_japan_decision: "El Sol Naciente"
 rising_sun_japan_decision_tooltip: "El ascenso de Japón no es negociable."
 rising_sun_japan_decision_desc: "Con Japón ahora libre de la Corte del Dragón Azul, es hora de que los Uji competidores se sometan a un solo gobernante. Solo entonces seremos tomados en serio como la principal Corte de Asia."
 rising_sun_japan_decision_confirm: "Nuestra ascensión comienza ahora."
 rising_sun_japan_decision_effect: "Las Cortes Uji serán ascendidas a un título de rango Hegemón. Abarcarán otros imperios dependiendo de tu elección."
 
 pod1230objectives.179.desc: "Con la Corte del Dragón Azul formalmente abolida, la mayoría predijo que Japón caería en una guerra civil tarde o temprano. Cumpliendo esa predicción, los muchos Clanes y forasteros de las islas se apresuraron a afilar sus cuchillos (literales o no) para alzarse en la cima de las recién creadas Cortes Uji.\nLa sorpresa llegó con la rapidez de la consolidación bajo un mismo estandarte, lo que ha preocupado a las Cortes continentales. Japón está anunciando ahora sus ambiciones y ya no quiere que se le vea como el «hermano pequeño».\n\n¿Vendrá la unificación de las Cortes asiáticas desde la Tierra del Sol Naciente?"
 pod1230objectives.179.a: "La Tortuga necesita nuestra guía." 
 pod1230objectives.179.b: "¿Un Dragón Azul japonés?" 
 pod1230objectives.180.a: "Debemos mirar hacia el este." 

 death_wang_hongben_decision: "Antaño unidos..."
 death_wang_hongben_decision_tooltip: "¿Qué podría salir mal en la estable y próspera Corte del Emperador Amarillo?"
 death_wang_hongben_decision_desc: "La Corte del Emperador Amarillo parece estable y próspera, sin preocuparse por las insignificantes amenazas de sus fronteras. Pero hay un aire de anticipación de que algo importante se avecina..."
 death_wang_hongben_decision_confirm: "...deben dividirse"
 death_wang_hongben_decision_effect: "¿Quién sabe?"
 death_wang_hongben_decision_custom_decision: "Se augura que 1240 será un año crítico."

 pod1230objectives.182.t: "El Colapso"
 pod1230objectives.182.desc.wang: "Nadie sabe realmente quién golpeó a [GetScriptedCharacterByHistoryID('795039').GetFirstName]. Algunos dicen que fue un compañero [Glossary('Wu','podgloss.wu')] frustrado, otros dicen que fue un [akuma|E] o un agente de una corte rival. Pero su muerte reveló la absoluta fragilidad del [GetTitleByKey('h_china').GetNameNoTier].\nSus ministros, la Sociedad de Jade Dorado, desmoronan la corte y se disputan el poder entre ellos. Sin una autoridad central respetada, estallan escaramuzas por todas partes y las cortes regionales, ya cercanas a la independencia, ahora se niegan a escuchar a Changán. Los [Glossary('Anda','podgloss.anda')] que esperaban en el norte una buena oportunidad para seguir el ejemplo de sus contrapartes mongolas mortales, ven ahora la puerta abierta de par en par.\n\nLa caída de las cortes chinas del Cielo será larga y sangrienta."
 pod1230objectives.182.desc.notwang: "El [GetTitleByKey('h_china').GetNameNoTier], que se creía un ejemplo de corte estable, resultó no ser más que un castillo de arena. A pesar de la destitución de Wang Hongben del poder (o quizás debido a ella), la situación solo ha empeorado.\nLos antiguos ministros de Wang, la Sociedad de Jade Dorado, desmoronan la corte y se disputan el poder entre ellos. Sin una autoridad central respetada, estallan escaramuzas por todas partes y las cortes regionales, ya cercanas a la independencia, ahora se niegan a escuchar a Changán. Los [Glossary('Anda','podgloss.anda')] que esperaban en el norte una buena oportunidad para seguir el ejemplo de sus contrapartes mongolas mortales, ven ahora la puerta abierta de par en par.\n\nLa caída de las cortes chinas del Cielo será larga y sangrienta." 
 pod1230objectives.182.b: "Las noticias sobre mi muerte fueron muy exageradas." 
 pod1230objectives.182.a: "El ciclo continúa..."
 pod1230objectives.182.tt: "Como eres un jugador, no te mataremos directamente (no somos tan crueles). Sin embargo, el colapso seguirá ocurriendo, ya que es parte integral de la narrativa de la región china."
 end_consolidation_china_cb_tt: "La CB de Consolidar China ya no estará disponible."
 activate_consolidation_china_cb_tt: "La CB de Consolidar China ahora estará disponible para gobernantes independientes con su capital de jure bajo la Hegemonía de la Corte del Emperador Amarillo."
 
 pod1230objectives.183.a: "El centro no se mantuvo." 
 pod1230objectives.183.b: "¡A cabalgar!"
 pod1230objectives.183.tt: "La Corte del Emperador Amarillo ha colapsado. La Horda [Glossary('Anda','podgloss.anda')] gana impulso para atacar a las debilitadas Cortes chinas."

 quincunx_formation_decision: "El Consejo de los Dragones"
 quincunx_formation_decision_tooltip: "Si China ha de unirse una vez más, las Cortes deben reunirse."
 quincunx_formation_decision_desc: "La caída de la Corte del Emperador Amarillo presagió una época de tribulaciones para China. Primero debemos repeler a los invasores de nuestras tierras y, después, trabajar de nuevo para crear una Corte unida."
 quincunx_formation_decision_confirm: "La unidad está cerca."
 quincunx_formation_decision_custom_decision_ex: "$quincunx_formation_decision_custom_decision$ #weak ([example.GetName])#!"
 quincunx_formation_decision_custom_decision: "Los miembros de la Casa [GetDynastyHouseByID('house_anda').GetName] no deben poseer tierras en [GetGeographicalRegion('world_asia_china').GetName]."
 quincunx_formation_decision_custom_decision2: "Los cinco imperios chinos (Cortes de Sangre, Llama, Hueso, Carne y Jade) deben estar o bien deshechos, bajo tu control, o en manos de un personaje aliado (opinión de ti superior a 50)."
 quincunx_formation_decision_effect: "Las tribulaciones han quedado atrás."
 
 quincunx_offensive_modifier: "Ofensiva del Quincuncio"
 quincunx_offensive_modifier_desc: "Este modificador te permite iniciar guerras tributarias de forma gratuita."
 quincunx_consolidation_modifier: "Consolidación del Quincuncio"
 quincunx_consolidation_modifier_desc: "Este modificador te ofrece un #P +25#! de aceptación plana a la vasallización cuando tu objetivo sea $pod_kueijin$"

 pod1230objectives.184.desc: "La caída de la Corte del Emperador Amarillo podría haber parecido un golpe mortal para la hegemonía del sistema de cortes chino ante los ojos externos. Para los iluminados, sin embargo, no fue más que un giro más del ciclo. Aunque este periodo será recordado como uno difícil para la China nocturna, terminará como empezó, con una Corte unificada gobernando sobre todo.\n\nEsto ha sido posible gracias a un evento conocido como el Consejo de los Dragones, que ha reunido a las Cortes políticamente más poderosas de la región. Con la amenaza [Glossary('Anda','podgloss.anda')] contenida, los Ancestros pudieron formalizar el inicio de una nueva organización llamada el Quincuncio. Tendrá un papel más de supervisión que la Corte del Emperador Amarillo, pero se espera que sea capaz de liderar esfuerzos poderosos y unidos por parte de las Cortes.\nSu primer asunto pendiente está en manos del primer «Ancestro del Quincuncio»."
 pod1230objectives.184.a: "Corea debe volver a estar bajo el mando de las Cortes."
 pod1230objectives.184.b: "Debemos asegurar nuestras fronteras."
 pod1230objectives.184.c: "El Quincuncio tiene la ambición de unificar todo $pod_kueijin$." 
 pod1230objectives.185.a: "De vuelta al principio."

 year_black_kites_korea_decision: "Año de los Milanos Negros"
 year_black_kites_korea_decision_tooltip: "Japón debe ser controlado."
 year_black_kites_korea_decision_desc: "Aunque técnicamente abarca tanto a Corea como a Japón, la Corte del Dragón Azul ha perdido poder fuera del continente hace mucho tiempo. No queda mucho tiempo antes de que la división se haga oficial."
 year_black_kites_korea_decision_confirm: "Ya no más divisiones."
 year_black_kites_korea_custom_decision: "Japón hará oficial la separación para 1242. Sin embargo, si para esa fecha se cumplen las condiciones de esta decisión, la Corte del Dragón Azul impedirá que lo hagan."
 year_black_kites_korea_custom_decision2: "El [GetTitleByKey('e_goryeo').GetNameNoTier] debe poseer tierras en [GetGeographicalRegion('world_asia_japan').GetName]."
 year_black_kites_korea_decision_effect: "Se desbloquearán nuevos objetivos, diferentes dependiendo de si Japón se separó del continente o no."
 
 pod1230objectives.186.desc: "La Corte del Dragón Azul fue instituida como la Corte gobernante de Japón y Corea cuando la expansión de la [Glossary('Dharma','podgloss.dharma')] ortodoxa (y alineada con China) llegó a las islas hace mucho tiempo. Desde entonces, Japón ha crecido en influencia, llegando incluso a ser el centro de la corte por derecho propio. Esto ha causado fricciones con el continente, que sigue viendo a Japón como un «hermano pequeño» algo indisciplinado que necesita guía.\nAunque el declive de las Cortes continentales hizo que muchos esperaran que Japón siguiera su propio camino, el sorprendente Resurgimiento de la Corte del Dragón Azul ha puesto fin a esa posibilidad. Aunque los obstinados Uji japoneses están lejos de ser humillados, al menos aceptan que su destino sigue ligado a las Cortes principales.\nQueda por ver qué hará Corea con este inesperado impulso político."
 pod1230objectives.186.a: "Unidos, como debe ser."
 azure_dragon_consolidation_modifier: "Consolidación del Dragón Azul"
 azure_dragon_consolidation_modifier_desc: "Este modificador te ofrece un #P +25#! de aceptación plana a la vasallización cuando tu objetivo sea $pod_kueijin$ en Japón y Corea."
 pod1230objectives.187.a: "Este dragón no está durmiendo."

 new_seat_heaven_decision: "El Nuevo Asiento del Cielo"
 new_seat_heaven_decision_tooltip: "El Dragón Azul asciende."
 new_seat_heaven_decision_desc: "Mientras la agitación envuelve a las Cortes, Corea y el Dragón Azul deben demostrar su derecho al dominio logrando la unidad y la prosperidad en su territorio tradicional. Entonces, podría ser el momento de que el centro del mundo asiático cambie del Amarillo al Azul..."
 new_seat_heaven_decision_confirm: "La Persona Augusta nos sonríe."
 new_seat_heaven_custom_decision: "Tus vasallos de nivel [duchy|E] o superior deben tener todos al menos un #P 25#! de opinión sobre ti."
 new_seat_heaven_decision_effect: "La Corte del Dragón Azul abarcará nuevas tierras de jure y será mejorada a un nivel de Hegemón."
 
 pod1230objectives.188.desc: "Corea siempre ha sido considerada una encrucijada para las Cortes Augustas, un terreno neutral útil entre las cortes con mayor poder político. El ascenso de Japón y su (difícil pero finalmente aceptada) reintegración formal en la Corte del Dragón Azul han elevado el prestigio de la zona a nuevas alturas.\nA medida que el tradicionalmente más influyente Emperador Amarillo y la Tortuga Negra se encogen y flaquean bajo la presión interna y externa, muchos han visto el ascenso del Dragón Azul como una señal del cambio de era.\nFortalecida por este creciente capital político, solo era cuestión de tiempo que la vecina Tortuga Negra fuera absorbida formalmente bajo la nueva organización hegemónica centrada en Corea. China y su Emperador Amarillo son otro asunto; sin embargo, milenios de dominio no pueden borrarse en un instante.\nEl Dragón Azul tendrá que gastar parte de su recién estrenado poder blando para lograr que los hastiados Ancestros chinos acepten este cambio radical."
 pod1230objectives.188.a: "Debemos mirar hacia nuestro interior durante un tiempo." 
 pod1230objectives.188.b: "La era del Amarillo ha terminado." 
 pod1230objectives.189.a: "La encrucijada es ahora el centro." 
 
 green_crossroads_decision: "Encrucijada Verde"
 green_crossroads_decision_tooltip: "La prosperidad es su propia recompensa."
 green_crossroads_decision_desc: "La caída de la Corte Azul afectó a la relevancia política de Corea. Pero las ganancias territoriales no son la única forma de lograr influencia.\nCorea se asienta en una encrucijada importante entre las otras Cortes y sobre el depósito más importante de Jade mágico en Asia Oriental. Estos activos pueden aprovecharse."
 green_crossroads_decision_confirm: "El jade es el color de nuestro triunfo."
 green_crossroads_decision_effect: "Varios condados en Corea, incluida tu capital, recibirán un modificador de [GetModifier('jade_trade_modifier').GetNameWithTooltip], que otorgará varios bonos relacionados con la prosperidad."
 jade_trade_modifier: "Comercio de Jade Mágico"
  
 pod1230objectives.190.desc: "Aunque el colapso de la Corte del Dragón Azul dejó una huella en la ambición política de Corea, la influencia puede provenir de muchas fuentes distintas. Al estar sentada sobre el depósito más importante de Jade mágico en Asia y encontrarse en la encrucijada de tres grandes Cortes, Corea siempre fue un terreno neutral y un centro comercial de referencia.\nAprovechando esta envidiable posición, las recién creadas Cortes Verdes están haciendo honor a su nombre. El jade fluye hacia las cortes extranjeras mientras el oro entra en las arcas de los Ancestros coreanos.\nAlgunos se preguntan si esta creciente prosperidad aumentará las ambiciones de la Corte Verde hacia asuntos más políticos una vez más, o si el oro y el jade serán los únicos colores en el futuro de los habitantes nocturnos de Corea."
 pod1230objectives.190.a: "¡El jade debe fluir!" 
 pod1230objectives.191.a: "¿Comprar el camino hacia la Iluminación?" 
 
 thriving_in_chaos_decision: "Prosperar en el Caos"
 thriving_in_chaos_decision_tooltip: "El caos es una escalera; es hora de quitársela de debajo a los demás."
 thriving_in_chaos_decision_desc: "El declive de la Corte del Fénix Escarlata ha dejado un vacío de poder. La naturaleza explosiva de la política en la región significa que la estabilidad solo se restaurará cuando un nuevo poder ocupe su lugar."
 thriving_in_chaos_decision_confirm: "Una victoria de Escarlata y Oro."
 thriving_in_chaos_decision_effect: "Elegirás entre un camino de conquista o de consolidación y desbloquearás el siguiente objetivo."
   
 scarlet_phoenix_consolidation_modifier: "Consolidación del Fénix Escarlata"
 scarlet_phoenix_consolidation_modifier_desc: "Este modificador te ofrece un #P +25#! de aceptación plana para la vasallización cuando te dirijas a personajes en el Sudeste Asiático."
 scarlet_consolidation_house_modifier: "Consolidación del Fénix Escarlata"
 scarlet_consolidation_house_modifier_desc: "Esta casa tiene un fuerte peso político en el Sudeste Asiático y se especializa en fortalecer esta base de poder."
 golden_courts_birth_modifier: "Fundadores de las Cortes Doradas"
 golden_courts_birth_modifier_desc: "Las sangrientas y brutales Cortes Doradas fueron fundadas por esta casa, convirtiéndolas en maestras de la guerra implacable."
 golden_courts_birth_tt: "El siguiente objetivo estará más centrado en la conquista."
 scarlet_phoenix_consolidation_tt: "El siguiente objetivo estará más centrado en asuntos internos."
 
 pod1230objectives.192.desc: "La Corte del Fénix Escarlata, que antaño fue un próspero centro para el [Glossary('Dharma','podgloss.dharma')] más enfocado al Yang, ha estado en un declive pronunciado durante un tiempo. Ha llegado al punto de que la Corte se ganó la reputación de ser un antro infestado de [akuma|E], llegando incluso a presionar a la Corte del Emperador Amarillo chino para que considerara intervenir, algo que no hicieron principalmente debido a su propia indolencia.\n\nConsolidar la zona pondrá al futuro gobernante en una encrucijada. Recuperar el manto del Fénix Escarlata se centraría en un camino más orientado hacia el interior (aunque no necesariamente pacífico, considerando algunos de los violentos [Glossary('Dharma','podgloss.dharma')] que habitan en esta zona). Otro camino sería renunciar a este legado y, en su lugar, construir algo nuevo, algo con mucha más probabilidad de centrarse en conquistar (y probablemente purgar) el resto de la región, y quizás incluso más allá más adelante."
 pod1230objectives.192.a: "El renacimiento del Fénix."
 pod1230objectives.192.b: "La sangre pavimentará nuestro camino de oro."
 pod1230objectives.193.a: "Retumbos desde la selva..."
 
 phoenix_rise_decision: "El Renacimiento del Fénix"
 phoenix_rise_decision_tooltip: "La Edad de Oro de la Corte del Fénix Escarlata aún se vislumbra en el horizonte."
 phoenix_rise_decision_desc: "Con la Corte del Fénix Escarlata centrada una vez más en torno a un solo gobernante, es hora de centrarse en el crecimiento interno y volver a ser la envidia del norte."
 phoenix_rise_decision_confirm: "El vuelo cegador del Fénix."
 phoenix_rise_decision_effect: "Obtendrás un poderoso modificador, un espacio de construcción adicional en todas tus provincias de propiedad directa y tus consejeros mejorarán en sus funciones."
 phoenix_rise_custom_decision: "Todos tus poderosos vasallos tienen al menos #P 50#! de opinión sobre ti."

 pod1230objectives.194.desc: "Bajo un liderazgo renovado, la Corte del Fénix Escarlata se ha convertido una vez más en un próspero centro para los vampiros del sur. Aunque los del norte sigan burlándose de sus vecinos, incluso ellos deben darse cuenta ahora de la formidable fuerza interna que se esconde tras esta Corte rejuvenecida.\nUnidos en su propósito y aprovechando la próspera población mortal a su disposición, los Fénix del sur recuperan con orgullo su asiento como una Corte de primer orden. Si no, algunos se atreven a susurrar: «la» Corte de primer orden."
 pod1230objectives.194.a: "Un triunfo escarlata."
 pod1230objectives.195.a: "La perla de la selva."
 
 bloody_gold_decision: "Oro sangriento"
 bloody_gold_decision_tooltip: "El nacimiento de una nueva Corte, entre sangre y vísceras."
 bloody_gold_decision_desc: "Nacidas del caos provocado por la caída de la Corte del Fénix Escarlata, las Cortes Doradas son sangrientas y violentas hasta la médula. A medida que crecen en poder, las otras Cortes estremecen ante este nuevo y brutal camino hacia la Iluminación."
 bloody_gold_decision_confirm: "Alcanzad el cielo mediante la violencia, entonces."
 bloody_gold_decision_effect: "Obtendrás dos poderosos artefactos, así como la capacidad de usar el Casus Belli de Invasión."
 bloody_gold_decision_tt: "Debes tener 10 o más caballeros con 35 o más de Destreza."
 
 POD_invasion_war_modifier: "Invasor decidido"
 POD_invasion_war_modifier_desc: "Este modificador permite el uso del Casus Belli de Invasión."
 
 pod1230objectives.196.desc: "Aunque algunos se sienten aliviados de ver una Corte del sur llenar el vacío dejado por la caída del Fénix Escarlata, la mayoría teme las tendencias sangrientas impulsadas por su nuevo líder. Si bien el Fénix Escarlata siempre fue indisciplinado debido a su enfoque en la energía Yang, al menos intentaba mantener cierto decoro. No tanto con las recién creadas Cortes Doradas.\nQuizás, lo que resulta más sorprendente, es que este enfoque en la expansión agresiva no mermó tanto la búsqueda de la Iluminación como la mayoría creería. En todo caso, los cortesanos dorados parecen prosperar gracias a las crudas y excesivas energías Yang que derraman durante sus conquistas, eludiendo la necesidad más tradicional de equilibrio.\n\nComo las Cortes Doradas no muestran señales de detener su marcha hacia la dominación, muchos se preguntan si se está pavimentando un nuevo camino hacia el Cielo ante sus propios ojos. Uno mucho más sangriento que no deja lugar para medias tintas ni neutralidades."
 pod1230objectives.196.a: "¡Temed al oro sangriento!" 
 pod1230objectives.197.a: "Las selvas han despertado." 

 bring_down_courts_decision: "Vanguardia del Emperador Demonio"
 bring_down_courts_decision_tooltip: "Una entrada digna del próximo gobernante de la Rueda."
 bring_down_courts_decision_desc: "El [Glossary('Emperador Demonio','podgloss.demonemperor')] gobernará la [Glossary('Sexta Era','game_concept_sixth_age_desc')]. Pero sin duda podríais hacer que su ascensión fuera más agradable si prepararais el terreno primero..."
 bring_down_courts_decision_confirm: "Una vista placentera para el Infierno."
 bring_down_courts_decision_effect: "Muchos $pod_kueijin$ restantes se convertirán en [akuma|E]. Desbloquearás el uso de todos los hombres de armas de [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')]. También desbloquearás el Casus Belli de Invasión."
 bring_down_courts_decision_tt: "No debe haber Emperadores o Hegemones $pod_kueijin$ que no sean [akuma|E]."
 
 POD_yama_vanguard_modifier: "Vanguardia del [Glossary('Demon Emperor','podgloss.demonemperor')]"
 POD_yama_vanguard_modifier_desc: "Este individuo se ha ganado el favor de todos los [Glossary('Yama Kings','podgloss.yamaking')]. Ellos le permiten el uso de sus tropas de élite siempre que sea necesario."

 pod1230objectives.198.desc: "Aunque se supone que el [Glossary('Emperador Demonio','podgloss.demonemperor')] ascenderá solo en la [Glossary('Sexta Era','game_concept_sixth_age_desc')], sus agentes ya están trabajando arduamente para allanar el camino de su ascensión. Es cierto que las Cortes hicieron la mayor parte del trabajo por su cuenta al caer en la indolencia y el declive, pero sería injusto culpar al sutil (y a veces no tan sutil) empuje dado por los [akuma|E].\nCon las Cortes ahora en completo desorden y los $pod_kueijin$ desesperados porque los Cielos están cerrando sus puertas, muchos buscan una vía alternativa de salvación.\n\nUna vía que los ahora prósperos [akuma|E] están más que ansiosos por ofrecer."
 pod1230objectives.198.a: "...y el camino de descenso es largo." 
 pod1230objectives.199.a: "El Cielo se ha vuelto de espaldas." 
 pod1230objectives.198.tt: "Muchos [Glossary('Kuei-Jin','game_concept_kuei_jin_desc')] se convertirán a tu fe."


 enduring_tortoise_decision: "La Tortuga Perseverante"
 enduring_tortoise_decision_tooltip: "Es hora de volver a ponerse en pie."
 enduring_tortoise_decision_desc: "La Corte de la Tortuga Negra está a la defensiva y muchos piensan que será arrasada por los [Glossary('Anda','podgloss.anda')] o por los [akuma|E]. Quizás este destino aún pueda evitarse."
 enduring_tortoise_decision_confirm: "Lento pero seguro."
 enduring_tortoise_decision_effect: "La Corte de la Tortuga Negra se convertirá en un título de Hegemón. Tendrás acceso al Casus Belli de Invasión. Tu casa obtendrá el modificador [GetModifier('enduring_tortoise_modifier').GetNameWithTooltip]."
 
 enduring_tortoise_modifier: "Tortuga Perseverante"
 enduring_tortoise_modifier_desc: "Tras haber sobrevivido a una era casi fatal, esta casa ha devuelto a la Tortuga Negra su gloria pasada."

 pod1230objectives.200.desc: "La Corte de la Tortuga Negra siempre ha sido algo ajena entre las Cortes Augustas. Considerada extraña, o cómplice de extranjeros hostiles debido a sus vínculos con las estepas, siempre se ha ganado, en el mejor de los casos, un respeto tenso o, en el peor, una hostilidad absoluta por parte de sus iguales.\nCuando los [Glossary('Anda','podgloss.anda')] empezaron a presionar desde el oeste y los [akuma|E] causaron problemas internos, las otras Cortes no derramaron lágrimas; la Corte del Emperador Amarillo llegó incluso a atacarla en su momento de mayor debilidad.\nCon su liderazgo indolente incapaz de reaccionar ante estos problemas, la caída de la Corte de la Tortuga Negra parecía una conclusión inevitable. Pero parece que los Cielos aún tienen un lugar para los Demonios de Xia. Un esfuerzo centrado ha visto recientemente a la otrora asediada Corte triunfar sobre muchos de sus vecinos y restaurar su hegemonía sobre las estepas.\n\nSin embargo, la Corte de la Tortuga Negra no olvidó el pasado. Las viejas rencillas nunca mueren realmente, pues los inmortales y la Corte han comenzado ahora una renovada campaña de agresión, quizás inspirada por sus raíces esteparias, reclamando incluso la mayor parte del norte de China en el proceso."
 pod1230objectives.200.a: "¡A cabalgar!" 
 pod1230objectives.201.a: "Las estepas nunca podrán ser domadas." 

 anda_steppes_decision: "Vientos del Este"
 anda_steppes_decision_tooltip: "Gengis nos mostró el camino."
 anda_steppes_decision_desc: "Los Demonios de Xia son un enemigo temible y China será un hueso duro de roer. El curso de acción más sensato es asegurar primero nuestras fronteras con ellos."
 anda_steppes_decision_confirm: "Estamos a las puertas."
 anda_steppes_decision_effect: "#N ¡Si este objetivo no se alcanza como máximo en 1300, los [Glossary('Anda','podgloss.anda')] perderán impulso y quedarán lisiados!#!\n\nSi se logra para entonces, se desbloqueará el siguiente objetivo de la cadena. Obtendrás el rasgo [GetTrait('conqueror').GetName(GetNullCharacter)] (si no lo tienes ya). Tendrás acceso al Casus Belli de Invasión."

 pod1230objectives.202.desc: "La conquista mongola de China pilló a todos por sorpresa, incluidos los inmortales que vivían entre ellos, los [Glossary('Anda','podgloss.anda')]. En lugar de apresurarse a seguir a sus contrapartes mortales, los hijos de Dobrul adoptaron un enfoque más prudente, sabiendo perfectamente que poderes más amenazadores que el ejército mortal de China les aguardan más allá de la Gran Muralla.\nConsolidando las estepas bajo su mando, a veces por la fuerza de las armas y otras mediante una diplomacia despiadada usando la fuerza del Imperio mongol como su carta de triunfo, los [Glossary('Anda','podgloss.anda')] están ahora plenamente preparados para llevar su conquista un paso más allá.\n\nMomentum también está de su parte, ya que su enemigo potencialmente más peligroso, la Corte del Emperador Amarillo, se encuentra debilitada y fracturada, aparentemente felizmente ajena a la amenaza que proviene del norte.\n\nA medida que la vanguardia de los [Glossary('Anda','podgloss.anda')] sondea las defensas de las Cortes del $pod_kueijin$ del norte con cada vez más fuerza, no tardarán en darse cuenta."

 pod1230objectives.204.t: "Los últimos Kan"
 pod1230objectives.204.desc: "El impulso de la Horda [Glossary('Anda','podgloss.anda')] se debió principalmente a lo rápido e inesperado que fue su ascenso. El Imperio mongol alcanzó alturas increíbles en un abrir y cerrar de ojos para lo que respecta a los inmortales, por lo que les llevó tiempo darse cuenta de lo que estaba sucediendo y considerar que también podría ocurrirles a ellos.\nLos [Glossary('Anda','podgloss.anda')] disfrutaron de un éxito sólido explotando este fallo en las primeras etapas de su campaña pero, quizás debido a un exceso de prudencia o al encontrarse con más resistencia de la esperada, no lograron asaltar el mundo tan bien como los mongoles.\nCon sus vecinos finalmente conscientes de la amenaza que representan y movilizando todos sus recursos para obstaculizarles, los [Glossary('Anda','podgloss.anda')] están volviendo a lo que eran originalmente: una simple Línea de Sangre de los [GetTrait('gangrel').GetName(GetNullCharacter)] con poco peso político.\nParece que no habrá una era de Kan entre los inmortales."
 pod1230objectives.204.a: "Tardamos demasiado..." 
 pod1230objectives.205.a: "Nadie dominará el mundo."
 anda_lost_momemtum_tt: "#N Dado que los [Glossary('Anda','podgloss.anda')] no lograron su objetivo a tiempo, cualquier gobernante de su nivel Emperador (o más) perderá el rasgo [GetTrait('conqueror').GetName(GetNullCharacter)] (si lo tenía) y obtendrá el modificador [GetModifier('broken_authority_modifier').GetNameWithTooltip].#!"
 
 anda_china_decision: "Hacia China"
 anda_china_decision_tooltip: "Romper la Muralla."
 anda_china_decision_desc: "Estamos a sus puertas y ya sabemos lo suficiente sobre ellos. ¡Es hora de seguir a nuestros victoriosos contrapartes mongoles!"
 anda_china_decision_confirm: "¡No pueden detener nuestra marcha!"
 anda_china_decision_effect: "#N Si este objetivo no se logra antes de 1350 como máximo, los [Glossary('Anda','podgloss.anda')] perderán impulso y quedarán lisiados. #! \n\nSi se logra para entonces, se desbloqueará el siguiente objetivo de la cadena. Obtendrás el rasgo [GetTrait('conqueror').GetName(GetNullCharacter)] (si aún no lo tienes). Tendrás acceso al Casus Belli de Invasión. Una cuantiosa suma de oro tomada de las arcas de China también será tuya."
 
 pod1230objectives.206.desc: "Tras un periodo de reconocimiento y de mejorar su conocimiento sobre los $pod_kueijin$, los [Glossary('Anda','podgloss.anda')] finalmente irrumpieron en la China propiamente dicha. Aunque su invasión fue obviamente menos visible y traumática que la mongola, siguió siendo un evento catastrófico para los inmortales chinos, que no habían tenido que lidiar con amenazas externas decididas desde la Quema de los Libros.\nCiegos ante la escala de la invasión y arrastrados por el impulso de los [Glossary('Anda','podgloss.anda')], la primera parte de la guerra resultó claramente ser un éxito rotundo para los hijos de Dobrul.\n\nSin embargo, ambas partes saben que la guerra no ha terminado. China es un lugar enorme y sus Ancestros restantes son ahora mucho más conscientes de la verdadera amenaza que proviene del norte."
 pod1230objectives.206.a: "¡China caerá!" 
 
 anda_final_decision: "Pax Anda"
 anda_final_decision_tooltip: "La última marcha."
 anda_final_decision_desc: "China yace maltrecha tras nuestra campaña en el norte. Sin embargo, subestimar a los Demonios de Xia sería un error. ¡Debemos acabar con ellos mientras el viento sopla a nuestra espalda!"
 anda_final_decision_confirm: "¡Como hizo Gengis!"
 anda_final_decision_effect: "#N Si este objetivo no se logra antes de 1400 como máximo, los [Glossary('Anda','podgloss.anda')] perderán impulso y quedarán lisiados. #! \n\nSi se logra para entonces, desbloquearás un dogma especial de fe y un modificador positivo. Obtendrás el rasgo [GetTrait('conqueror').GetName(GetNullCharacter)] (si aún no lo tienes). Tendrás acceso al Casus Belli de Invasión. La Horda [Glossary('Anda','podgloss.anda')] será ascendida a título de Hegemón, abarcando territorios desde Rusia hasta China."
 
 pod1230objectives.208.desc: "El triunfo de los [Glossary('Anda','podgloss.anda')] es total. Su política de estudiar a sus enemigos y esperar el momento oportuno para atacar resultó ser un éxito. Los hastiados inmortales de China los subestimaron al principio antes de apresurarse a preparar sus defensas. Pero fue demasiado poco y demasiado tarde.\nLa victoria de los [Glossary('Anda','podgloss.anda')] es quizás incluso más impresionante que la de sus contrapartes mongoles. Siendo una Línea de Sangre relativamente joven y desconocida hace un par de siglos, han barrido el dominio de los $pod_kueijin$, que han disfrutado de su posición privilegiada en Asia durante milenios. Algunos dicen que esta victoria es la señal del cambio de Era (o de la Gehenna, según a quién preguntes), pero para el observador más objetivo, se trata principalmente de la audacia e innovación de los jóvenes arrebatándole el poder a los indolentes y obstinados ancianos.\nY en el mundo inmortal, pocas cosas son más aterradoras que eso.\n\nSea como fuere, las noches de China operan ahora bajo un nuevo amo. ¿Continuarán los [Glossary('Anda','podgloss.anda')] su marcha o se establecerán en su nueva y próspera tierra? Solo ellos lo saben, pues el mundo es su estepa."
 pod1230objectives.208.a: "La madre Itügen está orgullosa."
 
 great_clan_victory_objective_decision: "El ascenso de la Ciudad Perversa"
 great_clan_victory_objective_decision_tooltip: "Todo cobrará sentido."
 great_clan_victory_objective_decision_desc: "Un mundo banal y estéril es nuestro sueño, donde todo tiene sentido. Tal es el mundo que el verdadero maestro desea. Al aplastar y desorientar a nuestros enemigos, [Glossary('Mikaboshi','podgloss.mikaboshi')] me elevará por encima de todos."
 great_clan_victory_objective_decision_confirm: "Dando la bienvenida al Emperador Demonio."
 great_clan_victory_objective_decision_effect_tooltip: "Obtendrás el rasgo [GetTrait('conqueror').GetName(GetNullCharacter)]. [Glossary('Mikaboshi','podgloss.mikaboshi')] te ofrecerá conocimiento de poderes infernales. Tu título será renombrado como el Cónclave de las Estrellas."

 pod1230objectives.210.desc: "Ha tardado mucho tiempo en llegar. Mientras contemplas el balcón de la Torre de [Glossary('Mikaboshi','podgloss.mikaboshi')], puedes sentir al Rey Perverso detrás de ti, forjando tu nueva corona como su mano derecha. Tal es tu derecho. En milenios, ningún discípulo de ningún Rey Demonio ha tenido tanto éxito como tú. Las Cortes permanecen rotas y destrozadas. La Tribu de Sangre, enemigos jurados de nuestra causa, yace ahora derrotada, con su líder convertido en cenizas por el viento. Pocas mentiras se oponen ante ti, salvo locos dispersos y quebrantados.\n\nLa corona descansa mientras se desentraña en esencia y se fusiona contigo. Eres especial. Ahora, tú y [Glossary('Mikaboshi','podgloss.mikaboshi')] bien podéis ser uno solo. Sus manos de hierro acarician bajo tu barbilla y te levantas, un recién nacido Semidiós de la Profanación.\nÉl todavía desea un mundo de capitalismo aplastante y tedioso trabajo rutinario. Un mundo entero sometido a la mundanidad y al trabajo robótico. Su camino al Trono es ahora inevitable.\nY tú estarás a su lado, el honrado, el más grande bajo el cielo y el infierno."
 pod1230objectives.210.a: "Como debe ser. Como será." 
 pod1230objectives.210.b: "Por supuesto, mi Emperador. Su Emperatriz no desea menos..." 

 blood_tribe_victory_objective_decision: "Ningún hombre es rey, ningún monstruo es dios"
 blood_tribe_victory_objective_decision_tooltip: "La espada nos hará libres."
 blood_tribe_victory_objective_decision_desc: "Se nos advirtió de sociedades dedicadas a la subyugación y conquista de todos aquellos que se atrevieran a ser libres, y se nos advirtió de su llegada. Debemos formar una sociedad de inmortales que se nieguen a inclinarse, que se nieguen a ser conquistados. Nuestros enemigos deben ser aniquilados y dispersados, y solo entonces la gran obra podrá comenzar de verdad."
 blood_tribe_victory_objective_decision_confirm: "Unidos en nuestro propósito."
 blood_tribe_victory_objective_decision_effect_tooltip: "Obtendrás el rasgo [GetTrait('conqueror').GetName(GetNullCharacter)]. Tu fe obtendrá un poderoso dogma especial. Tu título será renombrado como la Comuna de Sangre."

 pod1230objectives.211.desc: "Por primera vez desde que la Tormenta elevó al Primero de la Tribu de Sangre, contemplas la ingravidez sobre tus hombros. El Profeta del Tirano de Hierro ha muerto. La opresión de las Cortes se encuentra en el caos. Todo lo que queda... es aquello que llamaste familia.\nNo son hombres ni mujeres pacíficos, dispuestos a aceptar la voluntad de los dioses. No, son una sociedad en guerra. En guerra con el mundo, con ellos mismos y con quienes más aman. La Tribu de Sangre siempre ha luchado para romper las cadenas, para superar a la [Glossary('Bestia','game_concept_beast_desc')] con celo revolucionario y orgullo.\n¿Y ahora? Ahora nada te detiene.\n\nTe pones en pie y abres las puertas a tus iguales reunidos. Te observan mientras despliegas una colección de mapas y documentos que detallan tu camino.\nLos miras a todos, haciéndoles saber que este es el momento de marcharse o de mantenerse unidos. Todos sostienen tu mirada y sonríen. Sacas un cuchillo y lo clavas en la mesa, sobre los mapas.\n\nAbres la brecha hacia el oeste. Donde se dice que residen las Tradiciones."
 pod1230objectives.211.a: "Mostremos nuestra praxis." 
 pod1230objectives.211.b: "Es hora de que los humildes hereden la tierra." 
 pod1230objectives.211.c: "No perdamos más tiempo pidiendo a otros lo que podemos obtener nosotros mismos."

 kizoku_victory_objective_decision: "El ascenso del Séptimo Hijo"
 kizoku_victory_objective_decision_tooltip: "De plagas a invitados de honor."
 kizoku_victory_objective_decision_desc: "Mientras los Uji japoneses te toleren, estarás lejos de ser respetad[ROOT.Char.Custom('ES_OA')]. Si quieres hacer tuyo este territorio, tendrás que demostrar tanto tu fuerza como tu prestigio."
 kizoku_victory_objective_decision_confirm: "El respeto se gana, no es un derecho."
 kizoku_victory_objective_decision_effect_tooltip: "Elegirás a un aliado entre los Uji japoneses, obteniendo un modificador de casa y otras recompensas en el proceso."

 pod1230objectives.212.desc: "Tsuchigumo, así te llamaron una vez.\n\nEn Japón, siempre os habían visto a ti y a los tuyos como meros parásitos. Aunque nunca fuisteis odiados como la engendrada demente del tirano o los lunáticos del demonio de la tormenta, se os seguía considerando inferiores.\n\nEso se acabó.\n\nHay un vacío de poder que has llenado con maestría. Mostraste respeto a su Emperador y a sus costumbres. Te mantuviste con la cabeza alta y orgullosa mientras ellos se inclinaban y eran despedazados. Donde había desunión, impusiste orden. Donde había caos, trajiste estabilidad. Todo esto y más.\n\nLos Uji finalmente os aceptan como uno de los suyos y ahora buscan vuestro favor. ¿Quién será vuestro aliado para las noches venideras?"
 pod1230objectives.212.a: "Uji Bishamon."
 pod1230objectives.212.b: "Uji Genji."
 pod1230objectives.212.c: "Uji Iga."
 pod1230objectives.212.d: "Uji Echizen."
 pod1230objectives.212.e: "Uji Taira."

 anh_victory_objective_decision: "Azote de los Mares"
 anh_victory_objective_decision_tooltip: "Si la tierra trae la guerra, la tierra recibirá la guerra."
 anh_victory_objective_decision_desc: "Tras haber sido señores de los mares sin perturbaciones durante mucho tiempo, los Anh se enfrentan ahora a amenazas nuevas y más agresivas para sus islas. Hazles aprender su error."
 anh_victory_objective_decision_confirm: "Ahora sirven de alimento para los peces."
 anh_victory_objective_decision_effect_tooltip: "Nusantara pasará a llamarse los Mares de Sangre. Todos los condados en la #ONCLICK:GEOGRAPHICAL_REGION,world_asia_philippines #TOOLTIP:GEOGRAPHICAL_REGION,world_asia_philippines #L Filipinas#!#!#! recibirán [GetModifier('POD_secure_seas_modifier').GetNameWithTooltip]."
 anh_custom_decision: "[GetScriptedCharacterByHistoryID('791113').GetFirstName] debe estar muerto."
 
 POD_secure_seas_modifier: "Mares Seguros"
 POD_secure_seas_modifier_desc: "Ahora bajo el firme control de tu pueblo, los mares se han convertido en un aliado para los asentamientos en lugar de un enemigo caprichoso."
 
 pod1230objectives.213.desc: "Los océanos hierven.\n\nDurante mucho tiempo hemos acechado estos mares. Durante mucho tiempo hemos luchado contra los monstruos de las profundidades, durante mucho tiempo hemos desafiado a los tiburones por la supremacía. Pero últimamente, tú y tu linaje habéis sido arrastrados a las costas, de vuelta a la tierra firme, mientras pretendientes conquistadores y reinas fantasmas buscaban sus propios fines, perturbando vuestros objetivos.\nY ahora, las tierras están tranquilas. Las islas principales están tranquilas. Los demonios de carne yacen despedazados. Los vampiros fantasma han sido relegados a ser uno con los espectros que antaño gobernaron. El statu quo del que disfrutabas ha desaparecido para siempre. En tu guerra, la costa se ha acostumbrado a ti. Pero ahora, con todos los caminos abiertos, tienes una opción para el destino de aquellos que comandas.\n\nYa no somos cazadores. Ahora construimos. Gobernamos. Nadamos. Luchamos."
 pod1230objectives.213.a: "Seremos el Azote de los Mares." 
 
 kuntilanak_victory_objective_decision: "Lo que los monstruos temen"
 kuntilanak_victory_objective_decision_tooltip: "Incluso estando tan lejos de Él, su engendro aún nos acecha."
 kuntilanak_victory_objective_decision_desc: "Como es la verdadera maldición del linaje de Absimilliard, los Kuntilanak son perseguidos por los monstruos de su progenitor. Para protegerse, deben aprender más y usar la Necromancia como su escudo."
 kuntilanak_victory_objective_decision_confirm: "Protegido por la muerte."
 kuntilanak_victory_objective_decision_effect_tooltip: "Reemplazarás tu modificador de casa por uno más poderoso que también te dará acceso a nuevos Milicia."

 pod1230objectives.214.desc: "Durante mucho tiempo los Kuntilanak se han ocultado. Durante mucho tiempo los horrores en lugares olvidados os han acechado. Pero a pesar de todo, ahora los Fantasmas Sedientos de Sangre abundan por las islas. Los muertos advierten del acercamiento de los cazadores y los asaltan por adelantado mientras tú y los tuyos escapáis. Y ahora, en el cenit de vuestra fuerza, ya no necesitáis ocultaros.\n\nEl pozo se quiebra cuando el horror surge de él. El cazador aúlla cerca, ajeno a lo que le espera. Los Muertos Neverborn que convocas reconocen el poder que ejerces y lamen sus labios esqueléticos por la presa que les has entregado. Se levanta, mientras el pozo se abre y una corriente de Espectros y Malfeans brota de él, buscando a los cazadores.\n\nYa no somos la presa. Ahora nosotros somos los cazadores."
 pod1230objectives.214.a: "Y los muertos son nuestros perros de caza." 
 house_kuntilanak_improved_modifier: "Casa Kuntilanak"
 
 sangun_victory_objective_decision: "El Oso Gobierna, No Se Arrodilla"
 sangun_victory_objective_decision_tooltip: "Somos gobernantes, aunque ellos piensen lo contrario."
 sangun_victory_objective_decision_desc: "El «Clan de los Reyes» en Corea solo gobierna sobre un pequeño territorio montañoso, sometido al ridículo por sus vecinos más poderosos. Esto tiene que cambiar."
 sangun_victory_objective_decision_confirm: "¿Se atreven a reírse ahora?"
 sangun_victory_objective_decision_effect_tooltip: "Obtendrás un poderoso modificador de casa que también facilitará la vasallización de personajes en Asia Oriental."
 sangun_victory_objective_decision_custom: "El Imperio de Goryeo (también conocido como la Corte del Dragón Azul o las Cortes Verdes) debe ser poseído por ti o destruido."

 pod1230objectives.215.desc: "No hace mucho, los Sangun eran vistos como pequeños osos acampando en las montañas. Cortesanos sin renombre que jugaban a ser reyes de montaña insignificantes, señores solo de nombre.\n\nPero tú no lo olvidaste. En tu sangre sois reyes.\n\nEl dominio que has construido no se parece a nada que los Linajes hayan visto, con un poder que hace que incluso tus antiguos soberanos retrocedan con temor. Tu maldición ya no es motivo de burla, sino de miedo. Un rey no necesita ser visto para gobernar si es verdaderamente un rey. La nobleza del progenitor vive en ti tanto como en los demás.\nTu papel es ahora evidente. Nadie podrá volver a negar el derecho de nacimiento del Clan de los Reyes. No importa cómo se manifieste."
 pod1230objectives.215.a: "Nuestra labor no ha hecho más que empezar."
 
 banpaia_victory_objective_decision: "La Pirámide Oriental"
 banpaia_victory_objective_decision_tooltip: "Lejos de casa, pero creando la tuya propia."
 banpaia_victory_objective_decision_desc: "¿Qué puede lograr una expedición Tremere varada tan lejos de Ceoris? Bueno, bastante, si tienes voz y voto en ello..."
 banpaia_victory_objective_decision_confirm: "Enviar un mensaje a Europa."
 banpaia_victory_objective_decision_effect_tooltip: "Tendrás la opción de reintegrarte al Clan [GetTrait('tremere').GetName(GetNullCharacter)] principal o cortar los lazos con ellos."
 
 pod1230objectives.216.desc: "Reflexionas sobre el potencial que se extiende ante ti.\n\nCuando los Banpaia llegaron por primera vez a Japón, no lo hicieron bajo ese nombre. Érase una vez, los Banpaia eran simplemente una única expedición Tremere, una de las muchas enviadas al Este en una mezcla de misiones suicidas y misiones de exploración, todas ellas destinadas a la destrucción, salvo la que se convertiría en tu linaje.\nAl ser acogidos por Kagaseo, has crecido desde entonces más allá de ella. La Iluminación de [Glossary('Mikaboshi','podgloss.mikaboshi')] te otorgó un nuevo huésped, una nueva corte. Los Antiguos en el Oeste se quedarían atónitos al enterarse de todo esto, de tu éxito y de la formación de una Pirámide completamente nueva, contigo a la cabeza.\n\nPero la pregunta sigue siendo: ¿y ahora qué? Se presentan dos opciones ante ti. O bien informar de tus avances y obtener los beneficios de pertenecer al clan principal. Sin duda te convertirías en un Consejero con tus logros... pero ¿realmente quieres estar bajo el mando de alguien?\nPodrías construir una nueva pirámide, una mejor. Pero si los Tremere volvieran a encontrarte, no escatimarían esfuerzos para destruirte, y estarías por tu cuenta desde tu ascenso.\n\nOpciones, opciones..."
 pod1230objectives.216.a: "Las recompensas de la lealtad son inmensas. Me convertiré en consejero." 
 pod1230objectives.216.b: "«Arbitrium Vincit Omnia». Aquí permaneceremos." 

 ashen_grandmaster_initial_kj_decision: "[ashen_grandmaster|E]"
 ashen_grandmaster_initial_kj_decision_tooltip: "Siempre hay más que aprender sobre la guerra."
 ashen_grandmaster_initial_kj_decision_desc: "Los $pod_kueijin$ han creado muchas formas diferentes de guerra a lo largo de los siglos. Tus viajes son una buena oportunidad para aprender y, con suerte, dominar esas raras estrategias."
 ashen_grandmaster_initial_kj_decision_confirm: "¿En qué debo centrar mis esfuerzos?"
 ashen_strategist_initial_effect_tt: "Comenzarás tu Viaje como estratega, lo que te permitirá ganar experiencia para el [ashen_grandmaster|E] y luego usarla para aprender nuevas tácticas." 
 
 ashen_grandmaster_kj_decision: "[ashen_grandmaster|E]"
 ashen_grandmaster_kj_decision_tooltip: "Siempre hay más que aprender sobre la guerra."
 ashen_grandmaster_kj_decision_desc: "Los $pod_kueijin$ han creado muchas formas diferentes de guerra a lo largo de los siglos. Tus viajes son una buena oportunidad para aprender y, con suerte, dominar esas raras estrategias."
 ashen_grandmaster_kj_decision_confirm: "¿En qué debo centrar mis esfuerzos?"
 ashen_strategist_effect_tt: "Gastarás tu experiencia de [ashen_grandmaster|E] para aprender un estilo de guerra específico de los $pod_kueijin$ nuevo o mejorar uno existente." 
 need_50_ashen_grandmaster_xp: "Necesitas 50 o más de experiencia de Gran Maestre Ceniciento."

 pod1230objectives.217.desc: "Los Vástagos del Este tienen una larga Tradición de dedicación marcial. Siguiendo los pasos del legendario Sun Li, aquel que codificó el arte de la guerra para los no-muertos, estos estrategas errantes recorren el mundo para aprender y mejorar su conocimiento de este arte mortal.\n\nLa primera Tradición que se creó fue las Guerras del Crepúsculo, una forma de conflicto diseñada para resolver disputas crecientes. Debido a su naturaleza no letal, se ha utilizado para experimentar y mejorar formas más indirectas de obstaculizar al enemigo.\n\nLas Guerras de la Medianoche fueron la continuación, codificadas cuando las del Crepúsculo resultaron insuficientes para resolver una rivalidad especialmente feroz. Estas son a muerte, pero imponen una conducta honorable y limitan severamente la posibilidad de bajas ajenas al conflicto.\n\nFinalmente, los [Glossary('Penangallan','podgloss.penangallan')] del sudeste asiático desarrollaron recientemente la guerra Wayang Kulit. Esta hace uso del terreno accidentado y de poderes diseñados específicamente para confundir al enemigo hasta que esté lo suficientemente desorganizado para un enfrentamiento directo."
 pod1230objectives.217.a: "Dominaré el Crepúsculo." 
 pod1230objectives.217.b: "La Medianoche es mi hora." 
 pod1230objectives.217.c: "La guerra en la selva me llama." 
 pod1230objectives.217.d: "Pensándolo mejor..." 

 road_horizon_victory_objective_decision: "Ascenso de la Sociedad de las Sombras"
 road_horizon_victory_objective_decision_tooltip: "Forasteros con buen comportamiento."
 road_horizon_victory_objective_decision_desc: "En nuestra larga Contienda por integrarnos en las Cortes, otros como nosotros amenazan con hacerlo todo colapsar. Los Ferales del Mar, los Bandidos de la Espada y los Cultistas de la Carne amenazan con convertirnos a todos en carne.\nPara nuestra supervivencia, deben ser destruidos. Para nuestro ascenso, deben ser barridos."
 road_horizon_victory_objective_decision_confirm: "Demostrar nuestro valor ante nuestros anfitriones."
 road_horizon_victory_objective_decision_effect_tooltip: "Tendrás acceso a cinco [men_at_arms|E] que de otro modo estarían bloqueados para los $pod_kueijin$."
 road_horizon_victory_objective_decision_custom: "No debe haber ningún gobernante independiente de la Casa [GetDynastyHouseByID('house_chibo').GetName], [GetDynastyHouseByID('house_bushi').GetName] o [GetDynastyHouseByID('house_anh').GetName]."

 pod1230objectives.218.desc: "Finalmente, pasas una noche sin interrogatorios. Durante mucho tiempo has librado la guerra contra tus llamados «parientes». Los ritos de la [Glossary('Wicked City','podgloss.wickedcity')] permanecen sin realizar. Los océanos están en calma. Y no hay sonido de hojas saliendo de sus vainas. Finalmente, hay paz.\nAbres los ojos mientras los Ancestros reunidos debaten tu existencia. Aunque puedes ser un «no probado», al menos has demostrado ser útil.\nTras mucho debate, regresan a sus puestos y, formalmente, te nombran «Ancestro». Sonríes; el peso de tus grandes obras finalmente se manifiesta. Varios [Glossary('Wu','podgloss.wu')] se arrodillan ante ti, como enviados y tributos. [GetTrait('dhampyr').GetName(GetNullCharacter)] se inclina mientras tu propia corte a tus espaldas se relaja visiblemente.\n\nAhora sois iguales, ya no sois solo otra variante de los Pequeños Dioses. Los Cortesanos del Cadáver se mantienen codo con codo con los [Glossary('Hungry Dead','game_concept_kuei_jin_desc')]. Ahora el verdadero trabajo puede comenzar."
 pod1230objectives.218.a: "Ya no somos cortesanos. Ahora somos reyes." 
 pod1230objectives.218.b: "Mi porte no merecía menos. Alcanzaré mucho más allá de lo que se me negó."
 pod1230objectives.218.c: "Gracias a Dios esto ha terminado. Ahora puedo volver a casa."
 pod1230objectives.218.d: "Ahora podríamos estar finalmente a salvo de los Cazadores. Verlos intentar llegar a nosotros ahora."

 chibo_victory_objective_decision: "Susurros de la Ciudad Cruel"
 chibo_victory_objective_decision_tooltip: "Secretos revelados."
 chibo_victory_objective_decision_desc: "La [bloodsorcery|E] siempre ha sido una lucha para tu Línea de Sangre aislada debido a la falta de recursos. Sin embargo, con la ayuda de los recién llegados de Occidente y el patrocinio de [Glossary('Mikaboshi','podgloss.mikaboshi')], podrías ser capaz de solucionar esta debilidad tan evidente."
 chibo_victory_objective_decision_confirm: "Perfeccionando nuestras propias artes mágicas."

 pod1230objectives.219.desc: "El Gran Clan había trabajado durante mucho tiempo para perfeccionar las artes de la Magia de Sangre y, durante la mayor parte del tiempo, sin importar su habilidad, habían permanecido como un león en una jaula, restringidos y estrangulados por la falta de alcance, la falta de comprensión y, lo que es peor, la falta del poder de la magia adecuada.\n\nPero no más. Desde el reclutamiento de la Expedición Occidental, se te han revelado más artes. A través del dominio de los principios subyacentes y de antiguos Arcanos y Ritos de [Glossary('Mikaboshi','podgloss.mikaboshi')], lo has logrado. Este artefacto es tu gran obra, una tesis sobre el principio subyacente de la magia, una teoría unificada. Y a través de ella..."
 pod1230objectives.219.a: "...toda la magia queda al descubierto." 
 artifact_hand_mikaboshi_name: "La Mano de Mikaboshi"
 artifact_hand_mikaboshi_description: "#bold Proporciona un +25% de probabilidad de éxito de hechizo y un bono del +10% en la velocidad de los rituales para la Hechicería de Sangre.#!\nA tablilla de aspecto sencillo imbuida de magia; puede servir como un importante objeto arcano si se pronuncian las palabras de activación adecuadas. La mancha demoníaca de [Glossary('Mikaboshi','podgloss.mikaboshi')] es obvia para cualquiera que tenga un ápice de conocimiento sobre lo sobrenatural."

 monomi_victory_objective_decision: "La Espada de las Estrellas"
 monomi_victory_objective_decision_tooltip: "Un triunfo en ciernes."
 monomi_victory_objective_decision_desc: "Lord [Glossary('Mikaboshi','podgloss.mikaboshi')] tiene muchos enemigos. Como sus siervos con mayor inclinación marcial, te corresponde a ti hacerlos desaparecer. Las recompensas no tardarán en llegar, pues la [Glossary('Wicked City','podgloss.wickedcity')] provee al fuerte."
 monomi_victory_objective_decision_confirm: "Es hora de dejar mi huella."

 pod1230objectives.220.desc: "A veces, incluso tu corazón inerte puede acelerarse.\n\nEsto se ha demorado mucho tiempo. Pasas las manos sobre la recompensa por tu trabajo, traída por uno de los Demonios de Hierro de [Glossary('Mikaboshi','podgloss.mikaboshi')] en reconocimiento a tu servicio. La empuñadura de una hoja, magnífica y pulida en un acero sin igual, lo suficientemente duradera como para que ni la forja de los dioses pudiera fundirla. Y en lugar de una vaina, un movimiento del pulgar saca una cruel hoja curva, con el filo chisporroteando con una malicia siniestra.\n\nUna espada capaz de partir los cielos."
 pod1230objectives.220.a: "Un gran regalo. Se le dará un buen uso."
 artifact_sword_stars_name: "Espada de las Estrellas"
 artifact_sword_stars_description: "#bold Convierte el daño en [POD_aggravated_damage|E].#!\n\nLa empuñadura de una hoja, magnífica y pulida en un acero sin igual, lo suficientemente duradera como para que ni la forja de los dioses pudiera fundirla. Y en lugar de una vaina, un movimiento del pulgar saca una cruel hoja curva, con el filo chisporroteando con una malicia siniestra."

 bushi_victory_objective_decision: "Engullendo al Dragón"
 bushi_victory_objective_decision_tooltip: "Amor y poder."
 bushi_victory_objective_decision_desc: "Existen rumores de que los $pod_cainites$ pueden aprender los poderes de los $pod_kueijin$. Sin embargo, el coste podría ser demasiado para ti. ¿Será como perder una parte de ti mismo o convertirte en algo superior?"
 bushi_victory_objective_decision_confirm: "Es el momento."
 bushi_victory_objective_decision_custom: "Necesitas un alma gemela $pod_kueijin$."
 bushi_victory_objective_decision_custom2: "#X Tu alma gemela $pod_kueijin$ morirá.#!\nTendrás acceso a los poderes $pod_kueijin$ (representados como nuevos estilos de vida)."
 
 pod1230objectives.221.desc: "Lo has hablado con ellos y muestran cierto recelo. Lo que sugieres es una blasfemia de primer orden. Y, además, si algo sale mal, ellos morirán y es probable que tú entres en frenesí.\nAsí es la naturaleza de este pecado. Pero durante demasiado tiempo los $pod_kueijin$ te han llamado engendro impuro. Durante demasiado tiempo las otras estirpes los han llamado demonios. Se parecen más de lo que se diferencian. Si fueran uno solo, tal vez podrían abrirse nuevos caminos, nuevas sendas por recorrer.\nUna cosa es segura: este rito será difícil. La Bestia luchará contra ti; su lado más oscuro también lo hará. Nadie ha intentado algo así jamás. Si tan solo..."
 pod1230objectives.221.a: "Quiero que lleguemos a ser uno. De verdad." 
 
 golden_children_decision: "Los Hijos de Oro"
 golden_children_decision_tooltip: "Los pecados de nuestros padres no son los nuestros."
 golden_children_decision_desc: "Hace mucho tiempo, los dhampyr eran conocidos como Jin Hai, los «Hijos de Oro» de los heroicos $pod_kueijin$ de antaño. Cuando sus padres cayeron en la decadencia, intentaron razonar con ellos, pero fueron rechazados en cada ocasión. La llamada «Revuelta de los Niños» fue aplastada mientras el mismísimo Cielo lloraba por esta terrible pérdida.\n\nSe necesitaría un dhampyr muy exitoso para recordar a sus semejantes su pasado y romper las cadenas que les han impuesto durante todos estos años."
 golden_children_decision_confirm: "Nuestro legado renacido."
 golden_children_decision_incompatibility_tt: "#warning El objetivo de los Hijos de Oro y el de Caminantes de las Sombras son mutuamente excluyentes. Solo puedes lograr uno u otro.#!"
 golden_children_decision_effect: "Obtendrás el título de imperio de los Hijos de Oro y el rasgo [GetTrait('dhampyr').GetName(GetNullCharacter)] ahora será heredable."
 
 pod1230objectives_kj.5.desc: "Hace miles de años, durante la Era de las Leyendas, los Diez Mil Inmortales eran los guardianes de los pueblos mortales. De vez en cuando, tenían un amante mortal y, a veces, nacía un hijo de esa unión. Llamados Jin Hai, estos semidivinos estaban bendecidos y eran héroes del pueblo mientras caminaban entre ellos y no por encima de ellos.\n\nA medida que sus padres $pod_kueijin$ caían cada vez más en la corrupción, los Hijos de Oro intentaron expresar sus preocupaciones antes de que fuera demasiado tarde. Una y otra vez, fueron rechazados. ¿Qué saben los niños que no sepan los dioses, después de todo?\n\nEl comportamiento despreciable de los $pod_kueijin$ se intensificó hasta que los Hijos de Oro ya no pudieron limpiar sus desastres. Se reunieron en el monte Meru y decidieron enfrentarse a los $pod_kueijin$ con honor y determinación. Así nació la Revuelta de los Niños.\n\nFue un espectáculo increíble, pero inútil al final. Por muy bendecidos que estuvieran por el Cielo, la furia justa de los Jin Hai no fue rival para la sed de sangre de sus padres. La sangre de los Hijos de Oro tiñó para siempre de rojo las baldosas del palacio de Meru.\nEl Cielo y la Tierra lloraron por los Niños.\n\nSus padres no.\n\nDesde entonces, los hijos nacidos de $pod_kueijin$ son conocidos como dhampyr y son sombras pálidas de los antiguos Hijos de Oro, obligados a trabajar para el beneficio de sus progenitores. Sin embargo, cada uno de ellos posee el alma de un Hijo de Oro, y esa alma está despertando ahora.\n\nLa Revuelta de los Niños, ya sea mediante la palabra o las armas, no será sofocada una segunda vez."
 pod1230objectives_kj.5.a: "Volveremos a ver Meru." 
  
 shade_walkers_decision: "Los Caminantes de las Sombras"
 shade_walkers_decision_tooltip: "Podemos caminar por donde ellos no pueden, y eso nos hace útiles."
 shade_walkers_decision_desc: "El sabio $pod_kueijin$ valora a su siervo dhampyr. Los llamados «caminantes de las sombras» pueden actuar durante el día y entre los mortales con mucha más facilidad que sus maestros. Para aquellos verdaderamente habilidosos, se pueden conceder beneficios impresionantes."
 shade_walkers_decision_confirm: "Prosperamos en el crepúsculo."
 shade_walkers_decision_tt: "Debes tener un alma gemela o un mejor amigo que sea un $pod_kueijin$ con [Glossary('Dharma','podgloss.dharma')] 8 o más."
 shade_walker_modifier: "Caminante de las Sombras Favorecido"
 shade_walker_modifier_desc: "#warning Este modificador te da acceso a los poderes del Estilo de vida de Artes del Chi.#!\n\nUn dhampyr recompensado por su impresionante servicio, este caminante de las sombras ha recibido amplios beneficios de sus benefactores $pod_kueijin$."

 pod1230objectives_kj.6.desc: "Al ser mitad mortales y poder caminar a plena luz del día, los dhampyr cumplen una función muy útil en la sociedad $pod_kueijin$. A la mayoría se les enseña desde el nacimiento que su papel será servir como embajadores, administradores o espías para sus padres, aunque también existen tareas más variadas.\n\nPor cada $pod_kueijin$ que trata a su hijo dhampyr como una herramienta prescindible, hay otro que lo mima sin fin, embelesado por el hecho de que todavía es capaz de dar vida. Esto hace que la existencia de cada dhampyr sea muy diferente a la de sus hermanos.\n\nAun así, la constante es la necesidad de ser útil. Incluso el progenitor más paciente no pondrá en peligro sus aspiraciones dhármicas (o más mundanas) durante mucho tiempo por culpa de un hijo insensato. Sin embargo, para los verdaderamente dotados, podría haber esperanzas de atraer la atención de los $pod_kueijin$ más iluminados, esos que se dice que otorgan beneficios poderosos como la enseñanza de sus misteriosas Artes del Alma.\n\nAlgunos incluso dicen que varios dhampyr alcanzaron la verdadera inmortalidad al encontrar al patrón $pod_kueijin$ adecuado, aunque tales rumores solo se susurran, ya que la sociedad de no-muertos no permitiría que tal posibilidad fuera ampliamente conocida por sus hijos."
 pod1230objectives_kj.6.a: "El servicio tiene sus recompensas." 
 1300_current_date_tt: "Este objetivo solo está disponible antes de 1300" 
 1350_current_date_tt: "Este objetivo solo está disponible antes de 1350" 
 1400_current_date_tt: "Este objetivo solo está disponible antes de 1400" 
 

 pod1230objectives.222.t: "La Grande Tragédie"
 pod1230objectives.222.desc: "Toda tragedia necesita una obra maestra, y la nuestra ha consumido el señorío. Por toda Francia, los lirios se han marchitado debido a nuestros esquemas meticulosamente diseñados para infligir desesperación. Las llamadas «Cortes del Amor» de los degenerados Toreador se han convertido en un gran teatro de llanto. Ahora, con nuestro dominio tiránico asegurado y nuestros maestros herederos portando la melodía de nuestra crueldad, el cristal destrozado de nuestro linaje finalmente puede volver a unirse.\n\nMientras caen las cortinas y hacemos una reverencia, puedo sentir a nuestro maestro sonriéndonos. Puedo sentir su oscura influencia enroscada en mi mente, compartiendo la sensación de su infinita crueldad. Si ahora cargo con su bendición o si simplemente he sido vaciada para ser un recipiente perfecto, no importa. Ennamaru renace en nuestra sangre, y el mundo pronto conocerá su nombre."
 pod1230objectives.222.a: "Que caiga el telón. Que comience el llanto de un señorío destrozado."
 
 pod1230objectives.223.t: "Maestro de la Carne y el Hueso"
 pod1230objectives.223.desc: "El clamor finalmente ha cesado.\n\nNo porque de repente hayas decidido mostrar misericordia, sino porque las materias primas que tus musas proporcionaron tan generosamente finalmente se asentaron en su configuración prevista. Los engendros alardean de sus formas de guerra, pero no son más que bestias horribles. Como artista, sin embargo, sabes que el verdadero arte requiere sufrimiento, algo que has infligido tanto a ti mismo como a tus musas durante todo este proceso.\n\nEl resultado de tu arduo trabajo es impresionante. Contemplar tu forma ahora es ver un ángel, nacido de hueso y sangre.\n\nLo que se veía como mera carnicería ha sido elevado a lo divino, todo gracias a tus esfuerzos."
 pod1230objectives.223.a: "¡Perfección!"
 
 pod1230objectives.224.t: "Francia, purificada"
 pod1230objectives.224.desc: "Está hecho. Los adoradores de demonios que buscaban corromper este dominio han sido erradicados y destruidos.\n\nAl observar tus tierras, el cambio ya es evidente. Sin la sutil corrupción de los Hijos de Ennamaru y con tu propia Bestia firmemente atada por tus puntos de anclaje mortales, los mortales son libres para prosperar. El comercio florece, los campos se cuidan con renovado vigor y se retoma la armonía que tu clase mantenía con el ganado. Una edad de oro para Francia ha llegado."
 pod1230objectives.224.a: "¡Que el señorío florezca bajo nuestra vigilancia!"



 koldunic_ways_objective_decision: "Ampliar las Vías Koldúnicas"
 koldunic_ways_objective_decision_tooltip: "Siempre hay más poder por encontrar."
 koldunic_ways_objective_decision_desc: "Las [krainas|E] koldúnicas, aunque poderosas, están ligadas a la tierra. Para combatir esta debilidad, se deben encontrar nuevas formas de practicar el koldunismo antes de que otras artes de hechicería lo superen o se pierda en el tiempo. Métodos que cualquier neonato debería poder aprender y usar fácilmente."
 koldunic_ways_objective_decision_confirm: "El koldunismo será eterno."
 koldunic_ways_objective_decision_requirement: "Poseer el [GetPODArtifactName('incunabulum_kupalam_link')]"
 koldunic_ways_objective_decision_requirement2: "Tener #V 5#! [prisoners|E] de [GetTrait('tremere').GetName(GetNullCharacter)]"
 koldunic_ways_objective_decision_requirement3: "Tener #V 10#! [prisoners|E] con cualquier forma de [GetTrait('bloodsorcery').GetName(GetNullCharacter)]"
 koldunic_ways_objective_decision_effect: "Las #V [perks|E]#! adicionales de Hechicería Koldúnica estarán disponibles para todos los personajes."
 pod1230objectives.225.t: "Los Caminos Koldúnicos"
 pod1230objectives.225.desc: "El koldunismo es una de las formas más antiguas de Hechicería de Sangre conocidas por los $pod_cainites$. Además de sus múltiples complejidades, los Tzimisce han custodiado codiciosamente este poder frente a otros, lo que ha dado lugar a muy pocos practicantes vivos de este antiguo poder. Con el auge de la Taumaturgia y su facilidad de aprendizaje, el koldunismo se enfrenta a una elección: debe adaptarse o perderse en los estragos del tiempo.\n\nGracias a tu sabiduría y conocimiento, has logrado crear cinco caminos adicionales para el koldunismo. A diferencia de los [krainas|E], estos Caminos extraen poder de todos los elementos y no están vinculados a la tierra misma. Lo que los hace tanto más fáciles de aprender como de usar."
 pod1230objectives.225.a: "Los elementos están bajo mi mando."
 pod1230objectives.226.t: "Los Caminos Koldúnicos"
 pod1230objectives.226.desc: "Los informes dicen que [koldunic_expander.GetFirstNameNoTooltip] ha expandido la Hechicería Koldúnica.\n\nEl koldunismo es una de las formas más antiguas de Hechicería de Sangre conocidas por los $pod_cainites$. Además de sus múltiples complejidades, los Tzimisce han custodiado codiciosamente este poder frente a otros, lo que ha dado lugar a muy pocos practicantes vivos de este antiguo poder. Con el auge de la Taumaturgia y su facilidad de aprendizaje, el koldunismo se enfrenta a una elección: debe adaptarse o perderse en los estragos del tiempo.\n\nGracias a la sabiduría y conocimiento de [koldunic_expander.GetFirstNameNoTooltip], [koldunic_expander.GetSheHe] ha logrado crear cinco caminos adicionales para el koldunismo. A diferencia de los [krainas|E], estos Caminos extraen poder de todos los elementos y no están vinculados a la tierra misma. Lo que los hace tanto más fáciles de aprender como de usar."
 pod1230objectives.226.a: "¿Más poderes que aprender?"

 tzimisce_land_for_dragons_objective_decision: "Una tierra para los Dragones"
 tzimisce_land_for_dragons_objective_decision_tooltip: "Se construirá un nuevo imperio sobre la carne de nuestros inferiores."
 tzimisce_land_for_dragons_objective_decision_desc: "Muchos [GetTrait('tzimisce').GetName(GetNullCharacter)] residen en el [GetTitleByKey('e_voivodate').GetNameNoTier]; sin embargo, nosotros estamos muy alejados de sus tierras y su política. Nuestra $pod_clan$ siempre ha echado raíces en nuestros dominios; es hora de que plantemos nuestras propias raíces aquí."
 tzimisce_land_for_dragons_objective_decision_confirm: "Los Dragones se alzarán."
 tzimisce_land_for_dragons_objective_decision_requirement: "Posees al menos #V 3#! [kingdom|E] [titles|E]"
 tzimisce_land_for_dragons_objective_decision_effect: "Ganarás el [GetTitleByKey('e_tzimisce_dragons').GetNameNoTier] [title|E], que incluirá cualquier [kingdoms|E] y [empires|E] que poseas."
 pod1230objectives.227.t: "El Nuevo Señorío"
 pod1230objectives.227.desc: "Gracias a tu poder, se ha labrado un nuevo señorío para los Tzimisce. Lejos del centro de tu $pod_clan$, este nuevo dominio es tuyo para gobernarlo. Tus hermanos podrán disputarse el Voivodato y fracasar, pero tú... tú lograrás lo que ellos no pudieron.\nLos Dragones gobernarán la noche y tú gobernarás sobre todos ellos."
 pod1230objectives.227.a: "Mi mandato es absoluto."


 pod1230objectives.228.t: "Curar la Sangre Marchita"
 pod1230objectives.228.desc: "El conocimiento está completo. Los rituales están preparados. Tras siglos de búsqueda, dos caminos se presentan ante nosotros; cada uno ofrece una salvación de distinta clase.\n\nPodemos renovar el antiguo pacto, uniendo a Impundulu y Bomkazi para siempre mediante un ritual de vida y muerte entrelazadas. O podemos realizar el Rito Ishologu, rompiendo la dependencia para siempre y transformándonos en algo nuevo: los Mla Watu, libres pero solos."
 pod1230objectives.228.a: "Renovar el Pacto. Vida y Muerte, juntas para siempre."
 pod1230objectives.228.b: "Realizar el Rito Ishologu. Romper las cadenas."

 ### Observer event
 pod1230objectives.229.t: "La elección del Impundulu"
 pod1230objectives.229.desc: "Nos llega la noticia de que la Línea de Sangre Impundulu ha tomado una decisión crucial con respecto a su antiguo pacto con las brujas Bomkazi. El equilibrio entre la vida y la muerte se desplaza."
 pod1230objectives.229.a: "Interesante..."