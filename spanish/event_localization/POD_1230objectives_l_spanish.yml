 pod1230objectives.258.title: "Pensándolo bien"
 pod1230objectives.258.desc: "¿Estás verdaderamente satisfecho con los colores del escudo de armas de tu Línea de Sangre, o lo reconsiderarás?"
 pod1230objectives.258.option.a: "Reconsiderarlo."
 pod1230objectives.258.option.b: "Conservar este."
 pod1230objectives.258.option.c: "¡Que sea el símbolo de mi Señorío!"
 pod1230objectives.91.t: "El fuego arde de nuevo."
 pod1230objectives.91.desc: "Tu búsqueda ha terminado. Ya sea que la fórmula que has ensamblado a partir de fragmentos de información mediante una experimentación incansable sea el auténtico fuego griego o no, la sustancia ciertamente arde bien. La prueba inicial ya dio resultados espectaculares: el líquido es tan pegajoso como la miel y casi imposible de extinguir; todo lo que cubre mientras está encendido deja de existir antes de que deje de arder. Aunque el método de aplicación óptimo sigue siendo un área de mejora potencial, los artesanos a tu servicio ya han preparado diseños lo suficientemente efectivos.\nMientras observas al fuego consumir a los maniquíes de prueba, sientes como si un gran peso se hubiera quitado de tus hombros; en el fondo sabes que es la carga de la culpa que sufriste al enviar a tus hermanos y hermanas contra las fuerzas del Infierno sin estar adecuadamente armados."
 pod1230objectives.91.a: "Que el fuego arda tan intensamente como nuestra fe."
 pod1230objectives.92.t: "Fuego en el horizonte."
 pod1230objectives.92.desc: "Últimamente has estado escuchando extraños rumores de refugios consumidos por las llamas en cuestión de minutos, Vástagos quemados hasta las cenizas en sus propias cámaras de descanso y Antiguos que desaparecen sin dejar rastro. Hoy, uno de tus espías ha confirmado que son ciertos y que todo procede de algún nuevo invento de una de las organizaciones de Cazadores. Presuntamente han recreado la fórmula del fuego griego y la han adaptado para su uso en tierra con efectos devastadores."
 pod1230objectives.92.a: "Esos malditos mortales y sus juguetes insensatos."
 pod1230objectives.92.b: "Espero que compartan este invento."
 pod1230objectives.93.t: "El regreso de los fieles"
 pod1230objectives.93.desc: "Han pasado muchos años desde que los hermanos Gantenbein, engañados por sus malditos amos, se vieron obligados a huir de la gran ciudad de Constantinopla; sin embargo, aunque la ciudad fue saqueada y con ella la fe de los hermanos en la doctrina que les impusieron sus manipuladores, una nueva fe surgió de las cenizas. Los Condenados de Calomena vieron la locura de aquellos que se llaman a sí mismos elegidos: la santidad no puede brotar de lo que es impío. Los Gantenbein han luchado durante mucho tiempo contra todos aquellos que se autoproclamaban piadosos, siendo expulsados a las afueras de la sociedad civilizada, pero la verdadera fe prevaleció. La piedad de los hermanos les llevó a ellos y a todos los que estaban dispuestos a unirse a ellos a un regreso triunfal a la Ciudad, donde innumerables oídos anhelan escuchar su evangelio."
 pod1230objectives.93.a: "¡Levantaos, Condenados de la Tierra!"
 pod1230objectives.94.t: "El fervor religioso se apodera de Constantinopla."
 pod1230objectives.94.desc: "Las noticias de Constantinopla hablan de un culto que llega a la ciudad para envenenar los oídos de la plebe con todo tipo de sandeces calumniosas dirigidas contra sus superiores. Sus palabras impuras se propagan por la ciudad como el fuego y la turba que las sigue ya es demasiado numerosa y agitada para que alguien pueda silenciarlos. ¿Qué será de una ciudad dominada por un celo tan irracional?"
 pod1230objectives.94.a: "Herejes asquerosos."
 pod1230objectives.95.t: "Una Nueva Sede de Poder"
 pod1230objectives.95.desc: "El frío viento de medianoche acaricia tu cabello; bajo tus pies, el Vístula brilla con la luz de las estrellas. Cada criatura que este río sustenta está a tu disposición para comandar y alimentarte. La muralla del castillo en la que te encuentras protege a su monarca solo de ser reemplazado por alguien más útil. Tú eres el verdadero gobernante de esta tierra y tus maquinaciones la han convertido en un dominio más próspero y envidiable que cualquiera de los feudos áridos y desolados de tus ensimismados parientes carpatos.\nPronto se darán cuenta de que sus preciosos pedigríes no significan nada cuando se enfrenten a la competencia pura. El corazón frío de la hegemonía Tzimisce yace ahora aquí, en la colina de Wawel."
 pod1230objectives.95.a: "¡Mi poder hará temblar las montañas!"
 pod1230objectives.96.t: "El recién llegado del norte"
 pod1230objectives.96.desc: "La última pieza del informe sobre los acontecimientos recientes en los asuntos de la Estirpe capta tu atención. [victorious_poltzimi.GetUIName], a quien has estado observando durante algún tiempo, al parecer ya no está satisfecho con [victorious_poltzimi.GetHerHim] férreo control sobre el reino de Polonia. [poltzimi.GetSheHe] ha lanzado un desafío abierto a los Antiguos Señores y reclama el dominio del Voivodato por derecho de poder y mérito. Hasta un niño sabría que esto solo puede significar la guerra."
 pod1230objectives.96.a: "Como si esos necios no tuvieran ya suficientes enemigos."
 pod1230objectives.96.b: "Que venga [victorious_poltzimi.GetHerHim], veremos de qué está hecho [poltzimi.GetSheHe]."
 blood_curse_objective_decision: "Poner fin a la Maldición"
 blood_curse_objective_decision_tooltip: "Esta Maldición de Sangre está destrozando al clan, debemos actuar."
 blood_curse_objective_decision_desc: "La Maldición de Sangre Tremere supone un gran tributo para la mente de nuestros compañeros de Clan. Debemos hacer todo lo posible por encontrar una solución."
 blood_curse_objective_decision_confirm: "¡Lo hemos logrado!"
 blood_curse_objective_decision_effect_tooltip: "Eliminarás la maldición de sangre de tu clan, humillando a los Tremere en el proceso." 
 pod1230objectives.97.t: "Una Maldición deshecha"
 pod1230objectives.97.desc: "Ha requerido los esfuerzos de los miembros más eruditos de tu $pod_clan$ y una reunión de conocimiento arcano quizás sin precedentes, pero finalmente se ha logrado: la llamada Maldición de Sangre Tremere ha sido deshecha, liberándote a ti y a los tuyos de sus terribles efectos.\nAdemás de los beneficios obvios de tal hazaña, también ha sido una gran victoria política, ya que tus hermanos han resistido durante este periodo difícil y han salido fortalecidos. El propio Tremere de $pod_clan$ está empezando a sentir el revés, siendo objeto de burlas abiertas mientras su maldición «perfecta» es deshecha públicamente.\nRara vez la victoria ha sabido tan dulce."
 pod1230objectives.97.a: "¿Quiénes son los mejores hechiceros de sangre ahora?"
 tremere_blood_curse_removed_tt: "La Maldición de Sangre Tremere ha sido eliminada de todo tu $pod_clan$."
 pod1230objectives.98.a: "Eso les dará una lección de humildad a los Tremere."
 pod1230objectives.98.b: "¿Qué? ¿Cómo? ¡Esto no puede ser!"
 tremere_blood_curse_decision_custom: "Alamut, la Gran Obra ubicada en el condado de [GetTitleByKey('b_qazvin').GetNameNoTier], debe estar completamente construida"
 pod1230objectives.99.t: "Patronazgo inmortal"
 pod1230objectives.99.desc: "Como orgulloso Toreador, has nutrido durante mucho tiempo a los artistas, sean mortales o no, en tu zona. Tu corte se ha convertido en un centro de poesía, escritura, deportes y todas las demás actividades que consideras dignas. Mejor aún, también has logrado rodearte de un talentoso consejo de los diversos [Glossary('Clanes','game_concept_Clan_desc')], asegurándote de que tu renombre se extienda incluso más allá de tus propios hermanos Toreador.\nApenas pasa una noche sin que se produzca un nuevo descubrimiento, una nueva teoría o una nueva obra maestra gracias a tu sutil pero siempre presente cuidado. En cierto modo, has alcanzado el sueño de todo Toreador: no quedarte nunca sin nuevas maravillas para entretener la, por lo demás, agónicamente lenta inercia de la inmortalidad."
 pod1230objectives.99.a: "Por fin cada noche se siente nueva"
 toreador_grandeur_event_tooltip: "Un personaje especialmente bien inspirado se ha unido a tu corte."
 pod1230objectives.100.a: "¡Qué postureo de Toreador!"
 pod1230objectives.100.b: "¡Debo ver estas maravillas por mí mismo!"
 toreador_grandeur_modifier: "Patrón inmortal"
 toreador_grandeur_modifier_desc: "El más grande patrón Toreador, siempre a la vanguardia de las innovaciones mortales y ampliamente respetado por ello."
 
 pod1230objectives.101.t: "Biblioteca de los muertos"
 pod1230objectives.101.desc: "Con los escritos más importantes de la historia Cainita ahora en tu posesión, y con el alojamiento adecuado para albergarlos, no cabe duda de que has creado el mayor repositorio de conocimiento eterno en la historia de tu estirpe.\nPuede que la inmortalidad misma no sea suficiente para que lo leas todo y descifres todos estos secretos. Pero lo intentarás y entonces, tal vez, finalmente comprendas el propósito de esta maldita existencia. La respuesta tiene que estar ahí en algún lugar. No te atreves a considerar la alternativa..." 
 pod1230objectives.101.a: "Uno a uno..."
 custodian_library_undead_modifier: "Custodio de la Biblioteca"
 custodian_library_undead_modifier_desc: "La biblioteca Cainita más grande te ha sido confiada. Y todo tiene una respuesta, si sabes dónde buscar."
 pod1230objectives.102.a: "¿Puedo tomar prestados algunos libros?"
     
 pod1230objectives.103.t: "Los elegidos de Arikel"
 pod1230objectives.103.desc: "Hace mucho tiempo, el [Glossary('Antediluviano','game_concept_antediluvian_desc')] del $pod_clan$ Toreador, Arikel, reinaba en Sumeria como una diosa benévola y amada. Entonces llegó Ennoia.\nLa furiosa madre de los Gangrel, junto con sus chiquillos, asoló el paraíso de Arikel y robó la Tabla del Destino tras una larga batalla donde muchos orgullosos Toreador perdieron la vida. Por fin, este crimen ha sido vengado.\nLa Tabla está ahora de vuelta en manos de los Toreador; Enkidu y Gilgamesh han muerto y el clan Gangrel solo puede escabullirse en sus tugurios avergonzado por esta derrota.\nY, mientras contemplas tu sala del trono tras este trascendental anuncio, de repente notas la escultura más magnífica que hayas visto apareciendo, aparentemente, de la nada. Mientras contemplas esta obra maestra, oyes la voz más hermosa susurrando «Gracias» en tu oído.\nAl darte la vuelta para ver, ella ya se ha ido."
 pod1230objectives.103.a: "¿Podría ser...?"
 #pod1230objectives.103.a.tt: ""
 shamed_gangrel_modifier: "Gangrel avergonzado"
 shamed_gangrel_modifier_desc: "Los Toreador han recuperado la Tabla del Destino y han matado a Gilgamesh y Enkidu. Esto es una gran vergüenza para todos los Gangrel."
 
 pod1230objectives.104.a: "Las rosas están floreciendo"
 pod1230objectives.104.b: "¡Mentiras y engaños!"
 
 pod1230objectives.105.t: "Una Nueva Era"
 pod1230objectives.105.desc: "El destino de los $pod_clan$ Toreador ha estado entrelazado con Constantinopla y su Sueño durante siglos, pero la muerte de Michael durante la Cuarta Cruzada marcó un rumbo distinto.\nTras dejar atrás las ruinas del Imperio Romano, los Toreador se han aferrado a Francia y su floreciente nación y cultura, llena de poetas, artistas y otras mentes creativas. Ha llevado tiempo asegurar la zona de las manos de los Ventrue, e incluso más tiempo para que los Toreador se unieran bajo un único líder, pero ya está hecho.\nPara bien o para mal, Francia y los $pod_clan$ Toreador son ahora uno solo, y sus destinos se compartirán en el futuro previsible."
 pod1230objectives.105.a: "Un nuevo hogar"
 #pod1230objectives.105.a.tt: ""
 french_toreador_modifier: "Francia es Toreador. Toreador es Francia."
 french_toreador_modifier_desc: "Los destinos de Francia y del Clan Toreador están ahora intrínsecamente ligados."
 breton_opinion: "Opinión bretona"

 pod1230objectives.106.a: "¡Ja, artistas unidos!"
 pod1230objectives.106.b: "¿Un nuevo hogar?"  
 
 pod1230objectives.107.t: "Camino dividido"
 pod1230objectives.107.desc: "Una vez más, el Ejército Celestial ha sido restaurado; ahora todos los [GetTrait('shih').GetName( GetPlayer )] te seguirán. Siendo antaño el ejército de cazadores más poderoso que este mundo haya visto jamás, el Ejército Celestial cayó ante la decadencia y la corrupción interna, lo que llevó a los más virtuosos de tu clase a destruirlo por el bien común.\nMuchos temen que se cometan los mismos errores de nuevo, pero tú les aseguras que sabes cómo evitarlo.\nEl tiempo lo dirá."
 pod1230objectives.107.a: "Sin paz, solo guerra."
 pod1230objectives.107.a.tt: "Ya no tendrás acceso a la decisión «Acción reflexiva»."
 pod1230objectives.107.a.tt2: "Podrás usar el [GetPlayer.GetFaith.Custom('GHWName')] para una [casus_belli|E] de [empire|E] cuando llegue el momento."
 pod1230objectives.107.b: "Mantengamos el viejo camino."
 
 pod1230objectives.115.t: "Robando Sabiduría"
 pod1230objectives.115.desc: "Los Ancestros [GetTrait('kueijin').GetName( GetNullCharacter )] cuentan que el bárbaro Zao-lat fue instruido por [GetScriptedCharacterByHistoryID('791111').GetFirstName] en el uso de este poder, pero sus propias deficiencias le impidieron dominarlo y su P'o lo corrompió. Cuando [GetScriptedCharacterByHistoryID('791111').GetFirstName] vio que su discípulo era imperfecto, lo expulsó; el Traidor se marchó al oeste, repartiendo su forma bastardizada entre sus seguidores.\nDesde entonces ha partido de la India, pero te ha dejado la misión de dominar finalmente los secretos mejor guardados de los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')]. Una tarea que finalmente has cumplido, haciendo que Zao-Lat se sienta orgulloso... y que todos los «Parientes del Este» sean aún más hostiles de ahora en adelante."
 pod1230objectives.115.a: "El robo como búsqueda académica."
 wisdom_stealer_modifier: "Ladrón de sabiduría"
 unlock_chiiumuh_tooltip: "Desbloquear la decisión $awake_hun_and_po_objective_decision$ [decision|E]"
 
 pod1230objectives.116.t: "Los Tigres de Meru"
 pod1230objectives.116.desc: "La poderosa «Corte del Oeste» siempre se ha visto obstaculizada por el faccionalismo. Los competidores [Glossary('Wu','podgloss.wu')] gobiernan como señores de la guerra en sus propios feudos, y la división total solo se ha evitado durante mucho tiempo gracias al profundo respeto que todos sentían hacia la Emperatriz Fan. Entonces, de repente, desapareció.\nLa Corte del Tigre Blanco se dividió oficialmente en facciones enfrentadas a pesar de los torpes intentos de la sucesora de Fan por mantener la unidad. Desde entonces, muchos han intentado traer la paz a la Corte del Oeste, pero todos fracasaron.\nSin embargo, esa época ha terminado, y tu llegada al puesto de Emperador ha consolidado una vez más la Corte Blanca, que finalmente se erige como un socio igualitario de las Augustas Cortes del Este.\nEl monte Meru tiene sus protectores una vez más."
 pod1230objectives.116.a: "El tigre vuelve a rugir."
 
 
 #pod1230objectives.123.t: "The Tortoise Endures"
 #pod1230objectives.123.desc: "The Black Tortoise Court, also called the Wandering Court, is one of the Five August Courts of the [Glossary('Fourth Age','game_concept_fourth_age_desc')]. It encompasses northern East Asia and thus represents the North Direction.\nWith the rise of the Mongols, the Black Tortoise Court followed them into China, where they came into conflict with the other August Courts. Their contact with the south also showed several [akuma|E] in their ranks. As more and more [akuma|E] were detected, the Black Tortoise Court sent the gross of their forces against them. Many of these [Glossary('Wu','podgloss.wu')] were defeated, their members tortured and eventually turned in [akuma|E] themselves.\nAll hope seemed lost, until you managed to unite the remaining pure [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] and remove the [Glossary('Anda','podgloss.anda')] and [akuma|E] infestation on the Steppes. The Tortoise stands tall once again, and the [Glossary('Wheel of Ages','podgloss.wheelofages')] has been slowed down."
 #pod1230objectives.123.a: "We won't fall again."
 
 pod1230objectives.124.t: "La Verdad sobre los Brujah"
 pod1230objectives.124.desc: "Hace mucho tiempo, los $pod_clan$ Brujah fueron un faro para eruditos y filósofos. Entonces llegó Troile, cuyo atroz acto contra nuestro fundador allanó el camino para la caída de nuestro antaño noble linaje. Desde entonces, el legado de Troile ha prosperado y solo nuestra oportuna intervención salvó al mundo de sus rituales de Abominación en Cartago.\nSin embargo, no nos detuvimos ahí. Difundir la verdad nos llevó tiempo y mucho esfuerzo para convencer a los seguidores más devotos de Troile, pero ya está hecho. Mientras vigilamos el lugar de descanso del traidor en las ruinas de Cartago, proclamamos esto: llamados «Brujah», hijos de Troile, es hora de unirse al Clan Verdadero y abandonar vuestro linaje maldito. Nosotros, los Verdaderos, estamos listos para acogeros entre nosotros con los brazos abiertos... o con las espadas desenvainadas si intentáis aferraros a vuestros traicioneros ancestros. Elegid bien."
 pod1230objectives.124.a: "Abrid vuestros brazos..."
 pod1230objectives.124.b: "...¿o desenvainad vuestra espada?"
 pod1230objectives.125.a: "¿No habrá más rebeldes?"
 pod1230objectives.125.b: "¡Esto no puede ser cierto!"

 pod1230objectives.126.t: "Ayudar a los Portadores de Luz"
 pod1230objectives.126.desc: "Las Momias son un misterio para los de tu clase. Estas entidades son claramente de estirpe pagana y tienen poca reverencia por el Gran Ser, pero sus contribuciones para el bien común de la Tierra de la Fe son incalculables.\nLos tiempos difíciles exigen soluciones pragmáticas, y has optado por ignorar sus tonterías místicas sobre los antiguos dioses egipcios para centrarte en asuntos más estratégicos. A pesar de sus defectos, ciertamente son poderosos y saben mucho sobre cómo cazar a los malditos chupasangre. Esta extraña alianza ha dado sus frutos y ambas organizaciones se han beneficiado de ello. Un estado de cosas aceptable, al menos por ahora.\nEl líder de este extraño grupo, alguien que se hace llamar Horus, se ha presentado con la propuesta de unirse a sus filas. No estás muy seguro de esta propuesta y esto probablemente paralizaría tu organización. Por otro lado, la verdadera inmortalidad no se le ofrece a un mero mortal todos los días...\nSintiendo tu conflicto interno, Horus ofrece una alternativa, un elixir más sencillo, uno que te otorgará una vida prolongada manteniéndote tal como eres. La elección es, en última instancia, tuya."
 pod1230objectives.126.a: "El elixir sencillo será suficiente, gracias."
 pod1230objectives.126.b: "¿Inmortalidad verdadera? Bueno..."
 become_mummy_ikwan_tt: "Te convertirás en una Momia, lo que cambiará radicalmente tu forma de jugar, desactivará tus edificios y destruirá tus títulos de alto Señorío.\nEs probable que esto paralice tu campaña si no estás preparado para ello."

 pod1230objectives.127.t: "Liberar el Lamento"
 pod1230objectives.127.desc: "El Keening comenzó después de que el Profeta conquistara La Meca y generalmente se cree que es una manifestación del poder de Alá, que emana de la Piedra Negra dentro de la Kaaba. Cualquier ser impuro puede sentir el poder de la Fe Verdadera que se canaliza a través de la Piedra Negra. El Keening se detuvo solo una vez en su historia, cuando los Qarmatas, miembros de una secta islámica, robaron la Piedra Negra de la Kaaba en 950. Esto permitió que Tarique, un Nosferatu, erigiera protecciones mágicas que pueden contener parte del Keening, aunque no pueden silenciarlo por completo.\nCon tus nuevos conocimientos y la limpieza de la zona, pudiste eliminar el ritual de Tarique y liberar el poder total de la fe una vez más. Los sobrenaturales impuros, como los vampiros, sienten el Keening de nuevo como una cacofonía clamorosa de lamentos y gritos. Se vieron obligados a abandonar Arabia, con suerte para siempre, y tus fuerzas solo tuvieron que marchar por las ciudades vacías para restablecer el orden. Una victoria tremenda para los fieles."
 pod1230objectives.127.a: "¡Alá ha hablado!"

 pod1230objectives.128.t: "La aprobación de la Tejedora"
 pod1230objectives.128.desc: "Los magos persas conocidos como los Taftani son un enigma para la mayoría de los cazadores. Estos «maestros de los Djinn» son muy... llamativos y les gusta alardear de sus (posiblemente impresionantes) poderes mágicos. Afortunadamente para los Ikhwan al-Safa, están firmemente en el lado «bueno» de la lucha, pues sienten un odio particular por los vampiros, a quienes consideran parte de una especie de «gran mentira».\nTus recientes esfuerzos por comprender su naturaleza mística y tus acciones más mundanas para repeler a los vampiros de Oriente Medio han captado su atención. Han enviado maestros para ayudarte a formalizar tu comprensión básica de las fuerzas místicas en algo más útil.\nCon suerte, podrás transmitir este nuevo poder a tu familia en el futuro, obteniendo otra herramienta para la interminable lucha que tienes por delante."
 pod1230objectives.128.a: "¿Una amistad duradera?"

 pod1230objectives.130.t: "Hun y P'o despiertos"
 pod1230objectives.130.desc: "Para descifrar el secreto de Hun y P'o, has tenido que conocer al Wan-Kuei judío de Kaifeng, estudiar el Kànbujiàn y el [UmbraGlossaryLocalized('yomi_wan','Inframundo')], y has viajado al monte Meru, encontrando el complejo de templos que servía como cuartel general de los [Glossary('Wan Xian','game_concept_kuei_jin_desc')].\n¡Ahora has comprendido el segundo aliento, has despertado a tu Hun y a tu P'o y te has convertido en un [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] en toda regla!\nTal vez esto es lo que Saulot buscaba hace tantos años y tal vez incluso lo hayas logrado mejor que él. Ahora eres único, un vínculo entre dos mundos muy diferentes."
 pod1230objectives.130.a: "He logrado lo imposible."
 
 pod1230objectives.131.t: "Unidos por la Caza"
 pod1230objectives.131.desc: "Aunque la Inquisición y los Akritai tengan el mismo objetivo, que es purgar el mundo de lo sobrenatural, las fricciones entre ambos son comunes. El año 1204 aún está fresco en la memoria de los cazadores Akritai y sus heridas aún no han sanado. La desconfianza a menudo se convierte en hostilidad abierta y los siervos del Diablo ríen mientras los cazadores se cazan entre sí.\nSin embargo, esto ya no será así, pues los Akritai han alcanzado una posición dominante en los asientos tradicionales de la cristiandad. Con esta nueva primacía, los cazadores ortodoxos han sometido a sus hermanos católicos bajo su mando, unificando a los guerreros de la cristiandad bajo una fuerza más poderosa que nunca. Los demonios y los monstruos pronto temblarán de miedo al presenciar de primera mano la recién descubierta fuerza unida de los cazadores cristianos."
 pod1230objectives.131.a: "¡La Inquisición de las Sombras ha sido integrada en el grupo!"
 
 pod1230objectives.132.t: "Maestro del Talmud Secreto"
 pod1230objectives.132.desc: "La reliquia mejor guardada de los Jueces, el Talmud secreto, es una compilación de enseñanzas y argumentos de los antiguos Jueces. Esta gran cantidad de sabiduría acumulada también es muy complicada y nunca ha sido comprendida del todo por la generación actual. Sin embargo, este estado de cosas ha cambiado gracias a tus esfuerzos, permitiendo que los Jueces modernos redescubran los secretos de la magia de frontera cabalista.\nCon tu interpretación pulida y fácil de entender de esta sabiduría antigua, confías en que la próxima generación de cazadores no tendrá problemas para aprender estos secretos que antes se creían reservados a una élite."
 pod1230objectives.132.a: "El infinito Ein Sof."
 
 #pod1230objectives.133.t: "Theurgy"
 #pod1230objectives.133.desc: "After studying the sacred texts, you have finally found the secret of how to invoke power from God. Now you will teach this to your brothers and sisters, as you are united in your stand against the darkness."
 #pod1230objectives.133.a: "God is watching!"
 
 pod1230objectives.135.t: "Creación de Visceratika"
 pod1230objectives.135.desc: "Una extensión de su afinidad natural por la piedra, la tierra y las cosas hechas de ellas, Visceratika es para las Gárgolas una versión codificada de estos poderes que les surgían de forma natural. Habiendo estado cautivadas por los Tremere durante mucho tiempo, hasta ahora no habían sido capaces de comprender realmente esta afinidad por tales poderes, pero esto ha cambiado recientemente. Impulsadas por un individuo innovador, estas extrañas habilidades se están extendiendo finalmente como la pólvora entre las muy comunitarias Gárgolas, bajo el nombre de Visceratika. Una nueva disciplina se une a las filas del poder de la sangre."
 pod1230objectives.135.a: "Maestros de la Tierra y la Piedra."
 
 pod1230objectives.136.t: "Creación de Visceratika"
 pod1230objectives.136.desc: "Una extensión de su afinidad natural por la piedra, la tierra y las cosas hechas de ellas, Visceratika es para las Gárgolas una versión codificada de estos poderes que les surgían de forma natural. Habiendo estado cautivadas por los Tremere durante mucho tiempo, hasta ahora no habían sido capaces de comprender realmente esta afinidad por tales poderes, pero esto ha cambiado recientemente. Impulsadas por un individuo innovador, estas extrañas habilidades se están extendiendo finalmente como la pólvora entre las muy comunitarias Gárgolas, bajo el nombre de Visceratika. Una nueva disciplina se une a las filas del poder de la sangre."
 pod1230objectives.136.a: "Maestros de la Tierra y la Piedra."
 
 pod1230objectives.137.t: "Creación de Visceratika"
 pod1230objectives.137.desc: "Los informes decían que [visceratika_creator.GetFirstNameNoTooltip] creó una nueva disciplina llamada [GetTrait('visceratika').GetName(GetNullCharacter)].\nUna extensión de su afinidad natural por la piedra, la tierra y las cosas hechas de ellas, Visceratika es para las Gárgolas una versión codificada de estos poderes que les surgían de forma natural. Habiendo estado cautivadas por los Tremere durante mucho tiempo, hasta ahora no habían sido capaces de comprender realmente esta afinidad por tales poderes, pero esto ha cambiado recientemente. Impulsadas por un individuo innovador, estas extrañas habilidades se están extendiendo finalmente como la pólvora entre las muy comunitarias Gárgolas, bajo el nombre de Visceratika. Una nueva disciplina se une a las filas del poder de la sangre."
 pod1230objectives.137.a: "¿Más poderes que aprender?"
 pod1230objectives.137.b: "Bueno para nuestra Línea de Sangre."
 
 pod1230objectives.7000.t: "Sin agobios"
 pod1230objectives.7000.desc: "Tus luchas han terminado.\n\nPor fin, las maldiciones que te han estado acechando durante tanto tiempo se han disipado."
 pod1230objectives.7000.a: "Finalmente..."
 pod1230objectives.7000.tt: "Tus maldiciones han sido levantadas."
 
 pod1230objectives.138.t: "Victoria secreta de los mongoles"
 pod1230objectives.138.desc: "El Baghatur de Qorjin comenzó como un pequeño esfuerzo, una salvaguarda creada por el propio Gran Kan tras presenciar de primera mano el aterrador poder de lo sobrenatural. Qorjin gestionó esta tarea de forma notable, reuniendo información e incluso entablando alianzas entre los más dignos de confianza de los seres sobrenaturales. Utilizando el poder del Imperio mongol y sus estados sucesores, la banda de Qorjin creció hasta convertirse en una fuerza paramilitar cohesionada dedicada a defender a su gente.\nVictoria tras victoria, los cazadores lograron eliminar la perniciosa influencia de los [Glossary('Anda','podgloss.anda')] y otros monstruos de las estepas hasta que el corazón de los mongoles fue finalmente considerado seguro.\nCon este triunfo y el colapso de los [Glossary('Anda','podgloss.anda')], los rumores de una potencial invasión desde el este han muerto y los líderes del Baghatur ahora consideran el futuro. ¿Deberían cabalgar hacia el oeste como hicieron sus antepasados, pero esta vez liderando una formidable hueste de cazadores? ¿O deberían consolidar su alianza con los amigables cambiaformas de las estepas para prepararse para los desafíos que se avecinan?"
 pod1230objectives.138.a: "¡Cabalguemos al oeste!"
 pod1230objectives.138.b: "Nuestra alianza nos hace más fuertes."
 quincunx_invasion_removed_tt: "La invasión de la Vanguardia del Quincunx, prevista para 1360, ya no ocurrirá. No tiene efecto si ya ha ocurrido."
 werewolves_friendship_variable_tt: "Tendrás acceso a los [GetMaA('werewolf_pack').GetName] y a los [GetMaA('heavenlysuccessors_maa').GetName]."
 
 pod1230objectives.139.t: "Heredero del Dios Guerrero del Sol"
 pod1230objectives.139.desc: "En la antigüedad, una gran serpiente de oscuridad cayó de los cielos. La criatura odiosa se enterró bajo la tierra mientras el sol quemaba su carne. El sol otorgó un único rayo de luz divina a Svarog, dios de la forja y el fuego celestial. Svarog creó entonces a Dazbog: dios guerrero del sol y enemigo de todo lo impío.\nDazbog rastreó a la serpiente hasta la tierra de los eslavos, y su batalla fue terrible de presenciar. Ató a la serpiente a la tierra, pero Dazbog sabía que las hordas de oscuridad eran demasiado numerosas para él solo y se desesperó. Una guerrera mortal se acercó al dios mientras este lloraba, y reprendió a Dazbog cuando este le explicó la causa de su desesperación. El propósito de la batalla no siempre era ganar, le dijo ella, sino más bien seguir luchando. La salvadora y compatriota de Dazbog murió hace eones, pero los guerreros siguen acudiendo a su estandarte.\nLos guerreros mantienen una antigua enemistad con los siervos de Kupala, incluyendo al Clan Tzimisce. Por muy temibles que sean, la mayoría de los guerreros mueren mucho antes de haber logrado siquiera su primera baja vampírica. Pero tú seguiste intentándolo, como hizo Dazbog, y tus victorias recientes han animado a tus hermanos a alcanzar alturas más grandiosas que nunca."
 pod1230objectives.139.a: "¡La primera de muchas victorias!"
 
 pod1230objectives.140.t: "Un legado de cazadores"
 pod1230objectives.140.desc: "A pesar de tus numerosas victorias sobre el mal que plaga este mundo, has aceptado la triste realidad. Hay demasiados monstruos alrededor para que un solo cazador pueda lidiar con ellos, por muy hábil que sea. Como tal, tus esfuerzos recientes se han centrado en preparar a la próxima generación de cazadores, enseñándoles la vasta experiencia que acumulaste durante tus años de caza de monstruos.\nCon suerte, este conocimiento tan importante será suficiente para que eviten los errores que cometiste en el pasado e incluso te superen. Serán tu legado para este mundo y tu último acto de rencor contra el gran enemigo."
 pod1230objectives.140.a: "Ganarse al pueblo es primordial."
 pod1230objectives.140.b: "La violencia es la única respuesta."
 pod1230objectives.140.c: "Se les puede engañar."
 pod1230objectives.140.d: "La magia nos hace más fuertes."
 pod1230objectives.140.e: "Los poderes divinos son una bendición que debemos usar."
 
 dynasty_hunter_administrative_modifier: "Cazadores conectados"
 dynasty_hunter_administrative_modifier_desc: "Con contactos por todo el mundo mortal, estos cazadores siempre pueden contar con encontrar ayuda cuando la necesiten."
 dynasty_hunter_military_modifier: "Cazadores guerreros"
 dynasty_hunter_military_modifier_desc: "Por muy superados que estén, luchan con todas sus fuerzas para purificar este mundo."
 dynasty_hunter_intrigue_modifier: "Cazadores de las sombras"
 dynasty_hunter_intrigue_modifier_desc: "Puede que los monstruos habiten en las sombras, pero estos cazadores son más que capaces de igualarlos en este campo de batalla."
 dynasty_hunter_sorcery_modifier: "Cazadores de hechicería"
 dynasty_hunter_sorcery_modifier_desc: "Estos cazadores son maestros de la magia de frontera, utilizando estos impresionantes poderes para luchar contra la oscuridad."
 dynasty_hunter_theurgist_modifier: "Cazadores teurgos"
 dynasty_hunter_theurgist_modifier_desc: "Imbuidos de poderes divinos, estos cazadores traen el poder de los cielos a sus enemigos."

 
 #pod1230objectives.142.t: "Charon"
 #pod1230objectives.142.desc: ""Charonists" believe that the Charon who lead the Empire of the Dead, and demon Charon, supposed creator of the Underworld are one and the same. Despite your best efforts, you can't find enough evidence to prove it and, frankly, it might just be a case of mistaken identity. Still, your work was not in vain, you have recovered the great scythe Siklos and infused it with pure demonic power tamed from your demonology discoveries, creating a mighty weapon in the process indeed."
 #pod1230objectives.142.a: "One day I may know the truth."
 
 #pod1230objectives.144.desc: "The Demon Warrior Empire formed from those fallen [Glossary('Wan Xian','game_concept_kuei_jin_desc')] that accepted their new, demonic state and sought to embrace it, likely during the early [Glossary('Fourth Age','game_concept_fourth_age_desc')]. Warring against each other and those [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] that had not joined with them, the Demon Warrior Empire sought to encompass all former immortals into their ranks. Its members were diverse, comprising of those that simply sought power and those that sought to accept the new role Heaven had apparently laid on them.\nThe Demon Warrior Empire found opposition from the Five Emperors, who gathered those around them that believed that the original mandate of the [Glossary('Wan Xian','game_concept_kuei_jin_desc')] had not been taken from them, forerunners of the Way of the Resplendent Crane. The Emperors were powerful enough to suppress any uprisings of the Demon Warriors, but could not extinguish them completely. To try to avert conflicts, the Five Emperors created basics of the Great Principle to establish rules for all fallen [Glossary('Wan Xian','game_concept_kuei_jin_desc')] to follow.\nThe Five Emperors were aided in their endeavour by the appearence of [GetScriptedCharacterByHistoryID('791111').GetFirstName], whose teachings had synthesized the five ways that would lead back to Heaven and who further refined the Fivefold Way. The Demon Warrior Empire's sympathizers turned towards the new teachings and applied them to their own philosophy.\nAmong the Courts, the Demon Warrior Empire is a half-remembered memory of the barbaric times before [GetScriptedCharacterByHistoryID('791111').GetFirstName]'s teachings. Some Devil-Tigers, however, always sought to return to the state of the Empire, forming the Searing Wind sect that seeks to create a new Demon Warrior Empire without the strictures of the Courts."
 #pod1230objectives.144.a: "A new Celestial Devil uprising"
 
 pod1230objectives.145.t: "Batalla por un futuro maldito"
 pod1230objectives.145.desc: "El tercer Mundo Espiritual, aunque pocos quieran hablar de él, es también el más terrible. Es el temible Mundo Yomi, guarida de los [Glossary('Yama Kings','podgloss.yamaking')] y sus sirvientes demoníacos. También conocido como los Mil Infiernos, el Mundo Yomi es un lugar terrible, aparentemente compuesto por los peores elementos de los Mundos Yin y Yang. Los señores de Yomi, los temibles [Glossary('Yama Kings','podgloss.yamaking')], poseen señoríos infernales en lo más profundo del firmamento del Mundo Yomi. Allí, rodeados de tempestades aullantes y campos de carnicería, libran guerras entre ellos y contra seres sobrenaturales de naturaleza más pura, anhelando siempre la noche en que la Sexta Era se desate sobre el mundo y uno de los suyos alcance el mandato del [Glossary('Demon Emperor','podgloss.demonemperor')].\nAunque varios [Glossary('Yama Kings','podgloss.yamaking')] son increíblemente antiguos, otros no lo son. La Humanidad siempre encuentra nuevas formas creativas de atormentarse a sí misma y estas innovaciones a veces terminan provocando un cambio en la jerarquía demoníaca. Algunos [Glossary('Yama Kings','podgloss.yamaking')] fueron antiguos $pod_kueijin$, espíritus más débiles o incluso simples mortales. Todos, sin embargo, tienen algo en común: lucharon una sangrienta batalla para ascender a lo más alto de Yomi." 
 pod1230objectives.145.a: "Mejor reinar en el Infierno..."
 pod1230objectives.145.b: "No nos precipitemos demasiado."
 
 #pod1230objectives.146.t: "Wheeling"
 #pod1230objectives.146.desc: "Did you truly stop the wheel? Or just played by the whims of fate to end up at the same point in the future? Only time will tell."
 #pod1230objectives.146.a: "I did it"
 
 #pod1230objectives.147.t: "Reverse the Wheel"
 #pod1230objectives.147.desc: "Did you truly stop the wheel? Or just played by the whims of fate to end up at the same point in the future? Only time will tell."
 #pod1230objectives.147.a: "I did it"
 
 pod1230objectives.148.desc: "Hace mucho tiempo, los $pod_kueijin$ comenzaron a caer en desgracia y a consumir el Chi que se les administraba para vigilar por su cuenta, y empezaron a enfrentar a los cambiaformas entre sí mediante mentiras, traiciones y poderes obtenidos de la oscuridad de [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')].\nLos Cambiaformas, aliados con los $pod_kueijin$ desde su creación, les creyeron y comenzaron una masacre entre ellos. Este vergonzoso evento resultó en la pérdida de confianza entre las razas y la casi completa exterminación de los cambiaformas oso del Este, los Okuma.\n\nTus esfuerzos por reclamar y purificar los nidos de dragón perdidos durante esta guerra y entrar en contacto con los espíritus ancestrales caídos de los Okuma han dado sus frutos. Las cicatrices de este oscuro pasado se están curando lentamente, dando esperanza a muchos de que los errores del pasado puedan rectificarse después de todo."
 pod1230objectives.148.a: "Ahora podemos sanar."
 
 pod1230objectives.149.desc: "Durante los últimos días de la dinastía Shang, los $pod_kueijin$ caídos habían comenzado a gobernar sobre los mortales desde las sombras. Haciéndose pasar por sacerdotes y chamanes, exigían sacrificios en forma de chi y manipulaban a los gobernantes mortales mediante el uso de sus poderes. Del mismo modo, magos campesinos como los Wu-Keng extorsionaban a la población para obtener protección, mientras que aquellos que practicaban la magia superior solían recluirse del mundo.\n\nEste alcance llevó a que otros seres sobrenaturales, especialmente los Hsien Fae y los cazadores de demonios Shih, se unieran para detenerlos. La guerra fue larga y muy costosa (incluyendo el daño colateral para la gente común), pero terminó con el triunfo del líder de los cazadores de demonios, Yi, quien infligió a los $pod_kueijin$ la maldición del sol.\n\nSi bien el castigo de Yi era ciertamente justificado en su momento, desde entonces se ha visto como uno de los catalizadores del giro de la rueda. Los $pod_kueijin$ han estado lejos de ser perfectos desde la guerra, pero han aprendido su lección y no han intentado volver a gobernar la Humanidad.\nComo tal, revocar la maldición sobre ellos podría traer un panorama sobrenatural más armonioso para Asia, sanado de los errores del pasado."
 pod1230objectives.149.a: "Disfrutando de una renovación soleada."
 
 pod1230objectives.150.desc: "Antiguos servidores de los dioses más poderosos en la jerarquía Celestial, los Hsien eran responsables de responder a las oraciones de los mortales de acuerdo con los deseos de sus superiores y de actuar como mediadores entre los otros seres sobrenaturales. Durante los terribles sucesos de la Guerra del Río Dragón y la caída de los $pod_kueijin$, muchos de ellos se rebelaron contra su posición en la Burocracia Celestial, ya fuera para ayudar a los mortales o para volverse contra ellos. Como resultado, fueron castigados por el [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')].\nAquellos que se atrevieron a ponerse en la posición de los dioses fueron expulsados y obligados a vivir entre los mortales del Reino Medio.\n\nFraccionados e inciertos, algunos buscan responder a las oraciones mortales sin la ayuda de la burocracia celestial, mientras que otros buscan un dominio egoísta sobre los humanos o incluso destruir el mundo, aliándose con los [Glossary('Yama Kings','podgloss.yamaking')] como un acto de venganza por su exilio.\n\nTus esfuerzos diplomáticos concertados (incluyendo una no despreciable cantidad de coerción) han dado sus frutos y un número sustancial de Hsien ha regresado a sus roles ancestrales, mientras que otros seres sobrenaturales han prometido, al menos, escuchar su juicio.\nPuedes estar orgulloso de haber rectificado un error de larga duración, acercando el mundo al orden celestial una vez más."
 pod1230objectives.150.a: "Burocracia Celestial Ordenada"
 
 pod1230objectives.151.t: "De vuelta a la Tercera Era"
 pod1230objectives.151.desc: "¿Realmente detuviste la rueda? ¿O simplemente jugaste con los caprichos del destino para terminar en el mismo punto en el futuro? Solo el tiempo lo dirá."
 pod1230objectives.151.a: "Lo logré"
 
 #pod1230objectives.152.t: "Tear Down the Wall"
 #pod1230objectives.152.desc: "With the domination of humanity curtailed, the wall between worlds has been weakened. The Centipede's servants are cleansed and won't provide their lord with any evil help. Now if you just cut the spiritual leash you hold, the Centipede would be free... but it is not the time yet."
 #pod1230objectives.152.a: "Hold on"
 
 pod1230objectives.153.desc: "Los [Glossary('Yama Kings','podgloss.yamaking')] están jugando sus juegos para reclamar el trono del [Glossary('Demon Emperor','podgloss.demonemperor')]. Saben que el tiempo está de su lado, ya que el [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] un día renunciará y dejará la Creación al más fuerte de ellos. Aun así, no son invencibles, al menos todavía no.\nHostigando a sus sirvientes, los [akuma|E], se avanza mucho hacia su debilitamiento. Algunos incluso plantean la hipótesis de que el [Glossary('Demon Emperor','podgloss.demonemperor')] estará en su punto más débil durante su ascensión al trono celestial. Si esto es cierto, acabar con los sirvientes del Infierno antes de la «coronación» haría posible que valientes seres sobrenaturales se enfrentaran al Emperador cara a cara en este momento climático.\n\nY quizás incluso ganaran.\n\nSea cual sea el caso, este evento aún está lejos, pero recientemente has hecho tu parte. Las fuerzas de Yomi han aprendido a temer tu impresionante destreza y determinación, y su anterior audacia para allanar el camino a su señor se ha reducido a un mero correteo en las sombras."
 pod1230objectives.153.a: "Estaré esperando, Emperador."
 
 #pod1230objectives.154.t: "Imbued"
 #pod1230objectives.154.desc: "On the remains of Meru, the most holy site in all Creation, divine power has once again come to this world. The mortals have been imbued with the spark for divinity as it was intended so long ago. It will take time for them to truly grasp their newfound powers but you have paved the road for the ascension of humankind into something much greater."
 #pod1230objectives.154.a: "The Ascension begins."
 
 #pod1230objectives.155.t: "Exalted"
 #pod1230objectives.155.desc: "It is ready. The Middle Kingdom is united, the Scarlet Queen and the Ebon Dragon have send us their divine essence with the return of the imbued mortals; truly the [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] is watching us. We will destroy the [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] and [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')], ending all infernal; We will break the Grand Spider's wall and web, recover the Centipede‘s sanity. We will become... Exalted!"
 #pod1230objectives.155.a: "Exalted"

 azhi_dahaka_objective_decision: "Cambio eterno"
 azhi_dahaka_objective_decision_tooltip: "Uno con el cambio."
 azhi_dahaka_objective_decision_desc: "Azhi Dahaka es un estado mítico de ser perseguido por los Tzimisce. Es el presagio de la transformación, un estado donde las normas y estructuras físicas y mentales pierden su dominio sobre el alma misma del vampiro. Para lograrlo, cada aspirante debe encontrar su propio camino, ya que el estancamiento es, después de todo, la extinción."
 azhi_dahaka_objective_decision_confirm: "Empecemos a experimentar..."
 azhi_dahaka_objective_decision_requirement: "Tienes al menos #V 3#! [bound_ghouls|E] con #V 25#! o más de [GetTrait('fleshcrafted').GetName(GetNullCharacter)] [trait_level_track_xp|E]"
 azhi_dahaka_objective_decision_requirement2: "Tienes al menos #V 10#! [prisoners|E] con [GetTrait('vampgeneration7').GetName(GetNullCharacter)] o inferior"
 pod1230objectives.156.t: "Una nueva forma"
 pod1230objectives.156.desc: "Como regla general, con algunas excepciones notables, los Tzimisce no tienden hacia la piedad devota. ¿Por qué adorar a un dios distante cuando puedes transformarte tú mismo en uno? No precisamente una deidad. No precisamente un dogma. Azhi Dahaka es el símbolo, el fetiche y el foco del trascendentalismo del Clan.\nDesde el Dracon hasta Illuyankas, desde Drácula hasta el Leviatán, los dragones están profundamente entretejidos en la mitología Tzimisce. Aquello que el ganado teme, nosotros lo aspiramos: no la forma física y literal, sino lo que el dragón representa como presagio de transformación. Buscamos lo trascendental, recorriendo la sinuosa espiral de las vueltas de Azhi Dahaka, contemplando sus múltiples bocas y ojos. Donde el caos y la eternidad se encuentran en movimiento, ahí es donde encontraremos el corazón palpitante del dragón, y beberemos profundamente.\nMetáfora hecha realidad. Acertijo hecho carne. Azhi Dahaka es el querubín quiroptérico de nuestra espiritualidad atea y alienígena."
 pod1230objectives.156.a: "Mi ascenso comienza."
 pod1230objectives.156.tooltip: "#help Para progresar hacia [GetTrait('azhi_dahaka').GetName(GetNullCharacter)] debes aumentar tu [trait_level_track_xp|E] mediante un [journey|E]#!"


 pod1230objectives.157.t: "El abismo más profundo"
 pod1230objectives.157.desc: "Tras muchos preparativos y sacrificios, finalmente estás aquí. En la parte más profunda del Abismo, donde la luz nunca ha existido. Sin embargo, no tienes tiempo para pensar en ello, ya que tu alma se está deteriorando rápidamente. Debes actuar ahora o arriesgarte a convertirte en una de las muchas sombras inquietas que vagan eternamente por este lugar."
 pod1230objectives.157.a: "Vinculo al Leviatán a mi voluntad."
 pod1230objectives.157.a.t: "Tendrás acceso a los [GetMaA('the_leviathan').GetName] [men_at_arms|E]."
 pod1230objectives.157.b: "Me imbuo con el conocimiento del Abismo."
 pod1230objectives.157.b.t: "Obtendrás acceso a dos poderosos rituales de Misticismo del Abismo [bs_rituals|E]."

 pod1230objectives.158.t: "Ascensión impía"
 pod1230objectives.158.desc: "Los lugartenientes de Namtaru, los Decani, al parecer han oído hablar de tu proyecto para unirte a sus filas... matando a uno de ellos. Se toman en serio la amenaza que representas, tal como lo hicieron otros influyentes infernalistas ambiciosos como tú en el pasado.\nUno de ellos está tomando la iniciativa, ofreciendo mantener una conversación pacífica sobre diversas alternativas potenciales a tu proyecto. El lugar de esta «conversación» ya ha sido decidido. Esto podría ofrecerte una gran oportunidad para acercarte a uno de ellos más fácilmente de lo que anticipabas."
 pod1230objectives.158.a: "¿La presa acudiendo al depredador?"
 pod1230objectives.158.a.t: "Esperarás a la fecha especificada y hablarás con el representante de los Decani."

 pod1230objectives.1581.t: "Una propuesta infernal"
 pod1230objectives.1581.desc: "Como prometimos, el Decani te espera. El lugarteniente infernal de Namtaru viene con una oferta tentadora: renuncia a tu ambición de usurpar su posición y acepta, en su lugar, una parte no despreciable de sus poderes. La fuerza Demoníaca es, después de todo, lo que buscas.\nLa amenaza por su parte es implícita: si te niegas, tendrán que recurrir a medios más violentos para persuadirte. Ambos venís preparados y los Decani son entidades poderosas; no se sabe cómo terminaría un combate."
 pod1230objectives.1581.a: "Podemos llegar a un acuerdo."
 pod1230objectives.1581.a.t: "Obtendrás una parte del poder del Decani."
 pod1230objectives.1581.b: "...¡pero yo lo quiero todo!"
 pod1230objectives.1581.b.t: "Empezarás una lucha para devorar su alma y su poder. "
 pod1230objectives.1581.sucess: "Has ganado y estás listo para reclamar tu premio."
 pod1230objectives.1581.failure: "Has perdido, tu alma alimentará el poder de este Decani."

 pod1230objectives.159.t: "Caza del Códice Sargon"
 pod1230objectives.159.desc: "El Códice de Sargon es una tablilla de arcilla escrita por Capadocio durante sus años mortales. Tras su $pod_Embrace$, la pérdida de su Avatar causó caos y destrucción en sus recuerdos. No podía recordar qué había escrito ni dónde lo había dejado. Tras milenios, el Códice de Sargon fue destruido y sus partes quedaron dispersas por el mundo. Si alguien lograra restaurarlo, un poder inmenso le aguardaría.\n\nParece que no eres el primero en intentar esta búsqueda. Tus investigaciones te han indicado que Lazarus, el chiquillo desterrado de Capadocio, realizó el mismo Viaje que tú en su día. En aquel entonces, el Códice aún estaba completo... pero eso lo hacía aún más peligroso, ya que el conocimiento supremo suele tener como precio abrumar la mente de quien lo busca. Lazarus optó por romper un fragmento del Códice y estudiarlo lentamente a lo largo de los siglos. Casi logra terminar su trabajo antes de ser detenido por sus compañeros de clan, Constancia y Markus Musa Giovanni. La batalla resultante provocó la explosión del Códice, que se fracturó en múltiples fragmentos que pronto se dispersaron por el mundo.\nAquí es donde comienza tu propia búsqueda."
 pod1230objectives.159.a: "Todo en nombre del conocimiento."

 pod1230objectives.1591.t: "Códice Sargon"
 pod1230objectives.1591.desc: "Y aquí estoy, a las puertas de la divinidad. Solo un paso más y lograré algo que ni siquiera Capadocio consiguió: recuperar la chispa divina que la maldición de Caín borra en todos nosotros. Seré uno de los elegidos, bendecidos y malditos al mismo tiempo... pero mucho más poderosos por ello."
 pod1230objectives.1591.a: "Apoteosis."

 pod1230objectives.1592.t: "Gehenna: La Calma"
 pod1230objectives.1592.desc: "A diferencia de muchos de sus contemporáneos, Capadocio anhelaba un poder que iba incluso más allá de lo que poseía como Antediluviano. Su búsqueda de conocimiento era infinita; toda su estirpe de chiquillos fue cultivada con ese fin. Durante milenios, los Eruditos han trabajado para lograrlo. Entre el Códice, el wraith del Mesías, la Necromancia y las profundidades del Inframundo, no se ha dejado piedra sin remover en esta búsqueda.\n\nY al fin, ha sido hallado.\n\nLo sientes primero. Un torrente de energía, una vitalidad que te fue esquiva durante mucho tiempo. El propio Capadocio ha reconocido tu papel crucial en este desarrollo y te ha recompensado por permitirle realizar lo imposible. Tu mente se expande y acelera mientras todo lo que él había aprendido fluye hacia ti en un instante. Tu $pod_vitae$ grita, tu mente ruge, la Bestia aúlla y la existencia a tu alrededor comienza a girar. Con meros pensamientos, sientes cómo lo que has aprendido doblega el mundo a tu voluntad. En tus últimos momentos de lucidez vampírica antes de convertirte en algo superior, sonríes, saboreando el fruto de tus ambiciones como el néctar más dulce."
 pod1230objectives.1592.a: "Su Reino Venidero."
 pod1230objectives.1592.a.tt: "Todo y nada se despliega ante ti ahora. Puedes saborearlo todo. Es hora de dejarlo todo atrás."

 pod1230objectives.1593.t: "Gehenna: La Tormenta"
 pod1230objectives.1593.desc: "Capadocio había encontrado algo que ni siquiera Caín podría ignorar. Algo tan pavoroso que ni el Padre Oscuro se atrevería a pensar que tal cosa pudiera existir. Y la ira del primero vendrá. Caín está aquí. Y ha venido para imponer su propio castigo a sus hijos errantes, y quizás la furia sobre todos los descendientes de Adán y Eva. Un castigo impuesto #R en ríos de sangre.#!"
 pod1230objectives.1593.a: "#R ...en ríos de sangre.#! Y, sin embargo, nos levantamos."
 pod1230objectives.1593.a.tt: "El fin ha llegado, pero eso ya no te importa. Caín está más allá de tus preocupaciones. Capadocio te llama. Haga lo que haga Caín, estarás listo para cualquier ira que pueda desatar. La infinitud te aguarda."

 pod1230objectives.160.t: "Aenigmatis: El mayor enigma"
 pod1230objectives.160.desc: "La Ordo Aenigmatis busca obliterar la locura Malkavian enfrentándose a lo inimaginable y magnífico, ya sea Dios, el tiempo, la totalidad del Cosmos o el propio Caín. Cada misterio merece la pena buscarle una solución."
 pod1230objectives.160.a: "¡Los resolveré todos!"

 pod1230objectives.1601.t: "Aenigmatis: Momento de claridad"
 pod1230objectives.1601.desc: "Absorber una vasta cantidad de conocimiento te ha acercado a los objetivos de todos los Aenigmatis: comprender el mundo hasta convertirte verdaderamente en uno con él. Puedes sentir tu potencial divino despertando tras cada misterio que resuelves. Al entregarte a la razón y al conocimiento, se te concede un vislumbre del mayor premio: la lucidez."
 pod1230objectives.1601.a: "¿Me siento #weak diferente#!?"
 pod1230objectives.1601.a.tt: "Algo ha cambiado en ti; la maldición de Caín está debilitando su dominio."

 pod1230objectives.1602.t: "Aenigmatis: Verdadera divinidad"
 pod1230objectives.1602.desc: "El verdadero conocimiento te ha llevado al punto en el que te has curado de tu maldición de sangre y de tu locura. Quizá sea un vislumbre de la divinidad misma, renaciendo a imagen del propio Malkav, o quizá simplemente una canalización de su energía a través de ti, permitiéndote ver con claridad por primera vez. Al final, la noche se ilumina ante ti mientras desterras la oscuridad de la ignorancia con tu propia presencia."
 pod1230objectives.1602.a: "¿Finalmente libre?"
 pod1230objectives.1602.a.tt: "No volverás a encontrarte con tu [Glossary('Bestia','game_concept_beast_desc')] jamás."

 pod1230objectives.161.t: "Éxtasis: Dolor y Placer"
 pod1230objectives.161.desc: "El Ordo Éxtasis sostiene que la verdadera locura reside en la forma mortal. Desde su perspectiva, la Bestia es la verdadera creación divina y, por tanto, debe ser escuchada y apaciguada. Comprenderla es la clave para entender tanto a Dios como a uno mismo."
 pod1230objectives.161.a: "El torrente de las emociones puras."

 pod1230objectives.1611.t: "Ecstasis: Momento de claridad"
 pod1230objectives.1611.desc: "Si la Bestia es verdaderamente divina, como afirman los Ecstasis, entonces es un reflejo del Todopoderoso. Los sabios Ecstasis pronto comprenden que esto no la hace menos peligrosa. Ser consumido por sus necesidades antes de entenderla realmente significa perderlo todo. El dolor y el placer son medios, no fines."
 pod1230objectives.1611.a: "¿Me sentí #weak diferente#!?"
 pod1230objectives.1611.a.tt: "Algo ha cambiado en ti; la maldición de Caín está debilitando su dominio."

 pod1230objectives.1612.t: "Ecstasis: Compromiso divino"
 pod1230objectives.1612.desc: "Al entregarte a tu Bestia con tanta frecuencia sin perder tu sentido de identidad, has alcanzado el sueño de todo Ecstasis. Has encontrado un equilibrio lo suficientemente fuerte como para que la Bestia ya no se sienta como una intrusa. En cierto modo, se ha convertido en parte de ti, sin intentar incitarte a obedecerla, sino aceptando que la tendrás en cuenta de todos modos.\nQuizá no sea la divinidad misma, sino algo aún más importante para un Malkavian: la lucidez."
 pod1230objectives.1612.a: "¿Finalmente libre?"
 pod1230objectives.1612.a.tt: "No volverás a encontrarte con tu [Glossary('Bestia','game_concept_beast_desc')] jamás."

 pod1230objectives.162.t: "Maleficus: Oscuridad Interior"
 pod1230objectives.162.desc: "El más secreto (y herético) de los Ordos, Maleficus cree en la oscuridad inherente a la condición cainita. Como tal, no existen límites a los extremos a los que llegarán para curar su locura. ¿Qué es el infernalismo para aquel que ya está verdaderamente condenado?"
 pod1230objectives.162.a: "El llamado de $greatdemon_name_asmodeus$."
 pod1230objectives.162.b: "El llamado de $greatdemon_name_dagon$."
 pod1230objectives.162.c: "El llamado de $greatdemon_name_azrael$."
 pod1230objectives.162.d: "El llamado de $greatdemon_name_belial$."
 pod1230objectives.162.e: "El llamado de $greatdemon_name_abaddon$."

 pod1230objectives.1621.t: "Maleficus: Momento de claridad"
 pod1230objectives.1621.desc: "La maldición de Caín, por su propia naturaleza divina, es casi irrompible. Sin embargo, no es inusual que los más poderosos ángeles rebeldes de Dios sean capaces de contrarrestarla hasta cierto punto. Obviamente, lidiar con tales criaturas no es para cardíacos ni para quienes deseen mantener su alma intacta. Algunos, sin embargo, están dispuestos a pagar el precio, cualquier precio, siempre que los resultados lleguen.\nSi no hay otra opción, los Infiernos siempre están dispuestos a ofrecer soluciones fascinantes."
 pod1230objectives.1621.a: "¿Me siento #weak diferente#!?"
 pod1230objectives.1621.a.tt: "Algo ha cambiado en ti; la maldición de Caín está debilitando su dominio."

 pod1230objectives.1622.t: "Maleficus: Pacto infernal"
 pod1230objectives.1622.desc: "Tu patrón infernal está complacido con tu obra impía. Fortalecidos por tus esfuerzos, cumplen su parte del pacto, mitigando la Bestia y la locura que infestaba tu mente.\nLos resultados son... discutibles. Con esta nueva claridad, ahora comprendes verdaderamente las profundidades a las que has llegado para lograr esta hazaña. Si antes aún conservabas una chispa de lo divino en tu alma, esta se ha extinguido hace tiempo. Ahora serás parte de lo infernal para siempre, pero al menos tienes tu recompensa: lucidez para contemplar verdaderamente lo que has hecho."
 pod1230objectives.1622.a: "¿Finalmente libre? ¿O solo una nueva prisión?"
 pod1230objectives.1622.a.tt: "No volverás a encontrarte con tu [Glossary('Bestia','game_concept_beast_desc')] jamás."
 ordomaleficus_objective_tt: "Necesitas tener 100 de experiencia en Demonología y ya sea 100 de experiencia en Esclavo o 100 de experiencia en Diabolista."
 
 ikhwan_al_safa_landless_objective_decision: "Fortalecer al Ikhwan"
 ikhwan_al_safa_landless_objective_decision_tooltip: "Necesitamos la ayuda de los cazadores del desierto."
 ikhwan_al_safa_landless_objective_decision_desc: "Aunque el Ikhwan tiene una fuerte presencia en la península arábiga, su influencia en el Magreb es, en el mejor de los casos, débil. Asegurar la importante ciudad de Túnez ayudaría mucho a garantizar que puedan operar en la zona."
 ikhwan_al_safa_landless_objective_decision_confirm: "Un buen punto de partida."

 pod1230objectives.164.desc: "Con la seguridad de Túnez ya completada, el Ikhwan Al-Safa se ha acercado a ti. Aunque te felicitan por esta victoria contra lo sobrenatural, también te recuerdan sutilmente que consideran a Túnez como parte de su esfera de influencia. Te piden una muestra de buena voluntad de tu orden cediéndoles el control de la ciudad, fortaleciendo así los lazos con estos compañeros cazadores.\nSi aceptas, es probable que esta nueva amistad perdure al menos por un tiempo, aportando beneficios a tu orden en su conjunto durante el proceso."
 pod1230objectives.164.a: "¡Uníos, cazadores!"
 pod1230objectives.164.b: "Ahora no es el momento."
 
 judges_landless_objective_decision: "Fortalecer a los Jueces"
 judges_landless_objective_decision_tooltip: "Necesitamos la ayuda de nuestros compañeros cazadores."
 judges_landless_objective_decision_desc: "Los Jueces, aunque quizás sean la orden de cazadores más erudita, carecen de una base de operaciones para lanzar campañas más serias contra lo sobrenatural. Asegurar un centro de actividad ayudaría mucho a garantizar que puedan operar en la zona."
 judges_landless_objective_decision_confirm: "Un buen punto de partida."

 pod1230objectives.165.desc: "Con la seguridad de Jerusalén ya completada, los Jueces se han acercado a ti. Aunque te felicitan por esta victoria contra lo sobrenatural, también te recuerdan sutilmente que consideran a Jerusalén como parte de su esfera de influencia. Te piden una muestra de buena voluntad de tu orden cediéndoles el control de la ciudad, fortaleciendo así los lazos con estos compañeros cazadores.\nSi aceptas, es probable que esta nueva amistad perdure al menos por un tiempo, aportando beneficios a tu orden en su conjunto durante el proceso."

 akritai_landless_objective_decision: "Fortalecer a los Akritai"
 akritai_landless_objective_decision_tooltip: "Necesitamos la ayuda de nuestros compañeros cazadores."
 akritai_landless_objective_decision_desc: "Los Akritai sufrieron un duro golpe con la Cuarta Cruzada y desde entonces desconfían de colaborar con otros cazadores. Asegurar Constantinopla ayudaría mucho a reparar las relaciones rotas."
 akritai_landless_objective_decision_confirm: "Un buen punto de partida."

 pod1230objectives.166.desc: "Con la seguridad de Constantinopla ya completada, los Akritai se han acercado a ti. Aunque te felicitan por esta victoria contra lo sobrenatural, también te recuerdan sutilmente que consideran a Constantinopla como parte de su esfera de influencia. Te piden una muestra de buena voluntad de tu orden cediéndoles el control de la ciudad, fortaleciendo así los lazos con estos compañeros cazadores.\nSi aceptas, es probable que esta nueva amistad perdure al menos por un tiempo, aportando beneficios a tu orden en su conjunto durante el proceso."

 shadow_landless_objective_decision: "Fortalecer a la Inquisición de las Sombras"
 shadow_landless_objective_decision_tooltip: "Necesitamos la ayuda de nuestros compañeros cazadores."
 shadow_landless_objective_decision_desc: "La Inquisición de las Sombras es poderosa, pero las raíces de su corrupción calan hondo en la Santa Sede. Si pudiéramos asegurar Roma y luego entregársela, estarían mucho más dispuestos a considerar una posible colaboración."
 shadow_landless_objective_decision_confirm: "Un buen punto de partida."

 pod1230objectives.167.desc: "Con la seguridad de Roma ya completada, la Inquisición de las Sombras se ha acercado a ti. Aunque te felicitan por esta victoria contra lo sobrenatural, también te recuerdan sutilmente que consideran a Roma como parte de su esfera de influencia. Te piden una muestra de buena voluntad de tu orden cediéndoles el control de la ciudad, fortaleciendo así los lazos con estos compañeros cazadores.\nSi aceptas, es probable que esta nueva amistad perdure al menos por un tiempo, aportando beneficios a tu orden en su conjunto durante el proceso."

 qorjin_landless_objective_decision: "Fortalecer a los Baghatur de Qorjin"
 qorjin_landless_objective_decision_tooltip: "Necesitamos la ayuda de nuestros compañeros cazadores."
 qorjin_landless_objective_decision_desc: "Lejos de las otras órdenes, los Baghatur de Qorjin deben competir por la atención de los Jan con otros seres sobrenaturales. Asegurar Karakorum sería una ventaja decisiva en esta competición."
 qorjin_landless_objective_decision_confirm: "Un buen punto de partida."

 pod1230objectives.168.desc: "Con la seguridad de Karakorum ya completada, los Baghatur de Qorjin se han acercado a ti. Aunque te felicitan por esta victoria contra lo sobrenatural, también te recuerdan sutilmente que consideran a Karakorum como parte de su esfera de influencia. Te piden una muestra de buena voluntad de tu orden cediéndoles el control de la ciudad, fortaleciendo así los lazos con estos compañeros cazadores.\nSi aceptas, es probable que esta nueva amistad perdure al menos por un tiempo, aportando beneficios a tu orden en su conjunto durante el proceso."

 pod_gift_county_order_tt: "#X Entregarás este condado a un miembro de la orden. #!"
 
 ashen_ambassador_decision: "[ashen_ambassador|E]"
 ashen_ambassador_decision_tooltip: "¿Podré encontrar a un gobernante digno de mis habilidades?"
 ashen_ambassador_decision_desc: "Los embajadores expertos son un activo valioso en el arsenal de cualquier ambicioso gobernante de la noche. Diplomacia, intriga, conquista... utilizan todas las herramientas para ayudar a difundir la influencia de su patrón en tierras lejanas."
 ashen_ambassador_decision_confirm: "Puedo ser de utilidad para su ascenso."
 POD_ashen_ambassador_decision_tt: "Obtienes acceso a una nueva interacción de personaje con gobernantes con tierras donde puedes pedir convertirte en su embajador oficial.\n #X Si ya tienes un patrón embajador, lo verán como una traición. #! "
 set_relation_ashen_ambassadorial_patron: "Te comprometes con este personaje como [ashen_ambassador|E]"
 
 pod1230objectives.169.desc: "Inclinándote profundamente ante la corte reunida de tu nuevo señor, juras trabajar incansablemente para difundir su influencia por todas partes, ya sea mediante la pluma, la espada o cualquier otra herramienta a tu disposición. Mientras se te presenta respetuosamente el sello de su mandato, te levantas con orgullo, listo para comenzar tu viaje con esta prestigiosa responsabilidad en mente.\n #X Como embajador, desbloqueas una nueva interacción con gobernantes extranjeros para difundir la influencia de tu patrón de diversas maneras. También puedes regalarles siempre las tierras que conquistes durante una guerra. Asimismo, puedes pedirles un favor mediante una interacción de personaje.\nThe trayectoria de Embajador de tu rasgo Aventurero de las Cenizas desbloqueará habilidades de embajador nuevas y mejoradas a medida que progreses."
 pod1230objectives.169.a: "Seré vuestra arma más poderosa." 
 pod1230objectives.169.b: "Pensándolo mejor..."

 pod1230objectives.170.desc: "Los viajes de un embajador de la noche están llenos de peligros. Gobernantes rivales, intrigas fallidas o simplemente decir la palabra equivocada en el momento inoportuno significan que incluso los diplomáticos expertos pueden convertirse en diplomáticos muertos muy rápidamente. Como tal, se espera que tu patrón te proporcione toda la ayuda que pueda permitir si se la pides.\nLa política es la política, sin embargo, solicitar tal ayuda suele verse como una señal de debilidad y aún tendrás que convencer a la corte de la importancia de tu petición."
 pod1230objectives.170.a: "Necesito apoyo político." 
 pod1230objectives.170.b: "Tengo preocupaciones materiales en mente."
 pod1230objectives.170.c: "Mi séquito necesita refuerzos."
 pod1230objectives.170.effect.success.desc: "¡Convencido!"
 pod1230objectives.170.failure.effect.desc: "Dudoso"
 pod1230objectives.170.critical.failure.effect.desc: "Rechazado"
 pod1230objectives.170.effect.success.desc.tt: "Todos tus regimientos de hombres de armas dañados serán reabastecidos"
 pod1230objectives.170.effect.failure.desc.tt: "Uno de tus regimientos de hombres de armas dañados será reabastecido"
 pod1230objectives.170.d: "Mi orden militar puede proporcionar tropas de apoyo."
 pod1230objectives.170.e: "La sangre, la sangre es mi ama."
 
 pod1230objectives.171.desc: "El deber principal de un embajador es representar a su patrón en cortes extranjeras. Dicha representación puede adoptar muchas formas, desde una presentación formal hasta la intriga más turbia. En cualquier caso, puedes comenzar tu labor en una región mediante una visita oficial en la que expondrás tus objetivos. Al representar a tu señor en esto, el no comportarte de la manera adecuada afectará negativamente a tu reputación."
 pod1230objectives.171.a: "Traigo conmigo los mejores deseos de mi patrón." 
 pod1230objectives.171.b: "Esta es una corte... pintoresca comparada con la de mi señor." 
 pod1230objectives.171.c: "Tengo cartas que reconocen las fronteras de nuestros dominios." 
 pod1230objectives.171.d: "Podría «solicitar» fondos para mi benefactor mientras esté aquí..." 
 pod1230objectives.171.e: "Trabajemos juntos para asegurar nuestros señoríos." 
 pod1230objectives.171.f: "El colapso de este señorío beneficiaría a mi patrón." 
 
 ashen_grandmaster_decision: "[ashen_grandmaster|E]"
 ashen_grandmaster_decision_tooltip: "¿Es hora de nutrir mi séquito caballeresco?"
 ashen_grandmaster_decision_desc: "Muchas bandas de combatientes rondan la noche. Algunas están lo suficientemente formalizadas (o son lo bastante poderosas) como para ser consideradas órdenes militares, disfrutando de la reputación y el prestigio que este título aporta. Un [ashen_grandmaster|E] astuto puede dirigir su orden en la dirección que elija y asegurar su prosperidad continua."
 ashen_grandmaster_decision_confirm: "Revisemos nuestra situación."
 initial_ashen_grandmaster_decision_tt: "Crearás tu orden militar y elegirás sus preceptos." 
 later_ashen_grandmaster_decision_tt: "Usarás la experiencia de tu rastro de rasgos de [ashen_grandmaster|E] para mejorar tu orden militar."
 #POD_ashen_ambassador_xp_on_success_tt: "25% chance to get 3 Ashen Ambassador Trait Experience"
 
 pod1230objectives.172.desc: "Lo que separa a una orden militar de una banda de guerreros sin rumbo es un propósito común. Puede ser cualquier cosa, desde proteger una fe hasta luchar contra demonios o salvaguardar reliquias en peligro. Tal objetivo es el pilar que, con suerte, agrupará a muchas almas valientes en torno a ti. Elígelo sabiamente."
 pod1230objectives.172.a: "¡Seremos guerreros sagrados!" 
 pod1230objectives.172.b: "Tengo una causa específica en mente..." 
 pod1230objectives.172.c: "Seremos una orden mendicante." 
 pod1230objectives.172.d: "Lucharemos por el mejor postor." 
 pod1230objectives.172.e: "Encontraremos un señor digno." 
 initial_ashen_grandmaster_zealous_tt: "#bold Orden Sagrada#!: Puedes solicitar la conversión de tus cortesanos. En el segundo nivel, obtienes un modificador de guerra positivo al unirte a una guerra que involucre a un gobernante de tu fe. En el nivel más alto, todos tus caballeros obtienen este modificador."
 initial_ashen_grandmaster_specific_tt: "#bold Motivo Específico#!: Desbloquearás nuevas mejoras internas para el edificio de Domicilio de Cuarteles Militares: [GetDomicileBuilding('vampire_military_our_cause_1').GetName], [GetDomicileBuilding('vampire_military_our_cause_2').GetName] y [GetDomicileBuilding('vampire_military_our_cause_3').GetName]."
 initial_ashen_grandmaster_mendicant_tt: "#bold Orden Mendicante#!: Tras una peregrinación, repondrás a tus hombres de armas dañados en el primer nivel, obtendrás provisiones en el segundo y ganarás piedad adicional en el último."
 initial_ashen_grandmaster_mercenaries_tt: "#bold Banda de Mercenarios#!: Obtendrás recompensas mejoradas al aceptar contratos de mercenarios; cuanto mayor sea el nivel de este precepto, mayor será la mejora."
 initial_ashen_grandmaster_dedicated_tt: "#bold Orden Dedicada#!: Sinergia con [ashen_ambassador|E], donde podrás crear tropas para tu patrón embajador y ganar experiencia de rasgo de [ashen_ambassador|E]; cuanto mayor sea el nivel de este precepto, más tropas crearás."
 
