l_spanish:
 
  POD_travel_events.1.t: "Alamut: el Nido del Águila"
  POD_travel_events.1.desc: "En las montañas de Asia Menor, si uno sabe dónde mirar, hay un sendero estrecho que se bifurca de la carretera comercial principal donde no hay aldeas en decenas de kilómetros. Esta ruta asciende por las laderas más empinadas, pasando cerca de profundidades traicioneras donde los vientos fríos aúllan para barrer a los incautos hacia la muerte en las rocas afiladas como espadas que se encuentran muy abajo. Este es el camino a Alamut, el Nido del Águila, la antigua fortaleza de los Banu Haqim.\nDesde fuera, Alamut es poco digno de ver: un pequeño fuerte en una colina hecho de basalto negro con muros demasiado bajos y delgados para resistir un asedio. Sin embargo, esto es simplemente la puerta de entrada a la fortaleza.\nDentro de la estructura central, se abre un camino ancho y plano que desciende hacia las montañas. Aquí es donde comienzan las defensas reales de Alamut y los miembros de las tres castas las mantienen y supervisan constantemente. Los encantamientos mantienen su ubicación oculta de todos aquellos que desean dañar a sus habitantes.\nAquí están las salas de entrenamiento, donde cien guerreros ponen a prueba su temple. Aquí hay innumerables laboratorios para que los hechiceros experimenten con magia perdida hace mucho tiempo para la humanidad. Aquí está la gran biblioteca, donde los visires reflexionan sobre los secretos del universo.\nY aquí está el Trono Negro de Haqim, dominando el centro mismo de la fortaleza en el gran salón, esperando el regreso de su legítimo y terrible maestro."
  POD_travel_events.1.a: "Hay muchas cosas que aprender aquí."
  POD_travel_events.1.b: "No debería demorarme."
  
  POD_travel_events.2.t: "Ceoris: el orgullo de Tremere"
  POD_travel_events.2.desc: "Los visitantes o atacantes deben acercarse a Ceoris desde las estribaciones traicioneras y fuertemente fortificadas al sur. Lluvia, niebla y tormentas antinaturales protegen el valle mientras los guardias patrullan día y noche. El sendero termina en una pendiente pronunciada hacia las puertas de Ceoris. Es lo suficientemente rocoso y sinuoso como para evitar el transporte de armas de asedio para atacar la capilla. Enormes rocas movidas por Gárgolas proporcionan lugares de emboscada ideales para los defensores.\nEl visitante que se aproxima no ve nada más que niebla y no oye nada más que vientos aullantes. Es un vasto pozo de roca negra que sobresale de una meseta artificial. Su superficie no tiene decoraciones, solo docenas de ventanas largas y estrechas, ahora tapiadas y selladas con láminas de plomo, interrumpen la perfecta verticalidad de sus superficies. Ocho torres se elevan desde el bulto de la estructura, actuando como señuelos ya que ninguna de ellas da entrada a la propia Ceoris. Un par de ellas estallan en llamas cuando se aplica peso sobre ellas. Parece que los Tremere no pueden detener fácilmente sus impulsos teatrales.\nUn gran abismo rodea la capilla, con solo el puente más estrecho para atravesarlo. Finalmente, la casa de la puerta es el último obstáculo, protegida por soldados experimentados y las Gárgolas más feroces. Incluso si fueran derrotados, poderosas trampas mágicas esperan al invasor obstinado. Tras la casa de la puerta se encuentra finalmente la propia Ceoris, el corazón y el alma de los desalmados Tremere."
  POD_travel_events.2.a: "La guarida de los Usurpadores."
  POD_travel_events.2.b: "Impresionante, por decir lo menos."
  
  POD_travel_events.3.t: "Cartago: Sueño y Pesadilla"
  POD_travel_events.3.desc: "Los Brujah todavía se inspiran en las leyendas de los grandes eruditos y filósofos que florecieron en Cartago, una cultura donde los Vástagos y el ganado estaban más cerca unos de otros que en cualquier momento anterior o posterior. De hecho, algunos Brujah (y unos pocos más) recuerdan a Cartago como la \"Tercera Ciudad\", la heredera espiritual y política de la Primera y Segunda Ciudades. Sin embargo, otros relatos más oscuros hablan de un culto de sangre degenerado bajo nada menos que Troile, el ancestro Antediluviano de los Brujah; de sacrificios humanos —incluyendo sacrificios de infantes— a poderes infernales; y de colusión entre Troile y el matusalén Baali Moloch.\nLos Ventrue de Roma eran feroces rivales de sus primos Brujah en Cartago. Mientras Moloch arrastraba a Troile hacia la desensibilización y la degeneración, las noticias de la corrupción endémica entre los Brujah cartagineses se extendieron a los clanes romanos. La vidente Malkavian Trifosa guio al príncipe romano Camilla dirigiéndolo a actuar contra Cartago, y la Toreador cartaginesa Helena traicionó a su ciudad ante los romanos. A través de la Antediluviana Toreador, Artemis Orthia, Lisandro y el príncipe Alquias se formó una alianza contra los Brujah de Cartago; bajo el liderazgo de los Ventrue romanos, la alianza abarcó a los Malkavian, Toreador, Lasombra y sus aliados. Cuando la Tercera Guerra Púnica arrasó Cartago en el 146 a.C., las fuerzas colectivas de la alianza cainita romana derrotaron a los maestros Brujah y Baali de Cartago. Al final, Troile y Moloch fueron sumidos en el letargo, entrelazados en un eterno abrazo de amantes bajo los campos salados de Cartago."
  POD_travel_events.3.a: "Una pesadilla durmiente."
  POD_travel_events.3.b: "Las ruinas de nuestra utopía."
   
  POD_travel_events.4.t: "Erciyes: la locura de Capadocio"
  POD_travel_events.4.desc: "A veces llamado el Monasterio de las Sombras debido a su ubicación, los altos acantilados en todos los lados significan que recibe solo unas pocas horas de luz solar directa cada día, Erciyes fue tomado por los Capadocios en un asalto masivo (la única acción militar en la historia del clan) en algún momento del siglo I a.C., cuando reemplazaron un monasterio de montaña que originalmente servía como culto para un Malkavian. Desde ese momento, el clan mantuvo un complejo de templos en la montaña dedicado al estudio capadocio de la muerte y de Dios. Este templo es cristiano (como suelen ser los Capadocios), pero es conocido por sus extraños y horripilantes secretos.\nSu \"ciudad hermana\", Kaymakli, se encuentra cerca y ostenta una reputación aún más oscura. La ciudad era una comunidad híbrida de Capadocios y mortales; los mortales proporcionaban todas las comodidades y servían como ganado para los eruditos no muertos en sus filas. Aunque difícilmente ideal, el acuerdo parecía ser moderadamente satisfactorio para ambas partes, posiblemente atenuado tanto por las condiciones generalmente desagradables de un campesino turco del siglo IX como por las actitudes generalmente pasivas y algo más humanas de Capadocio.\nCuando el clan fue purgado durante el Festín de la Locura, la ciudad se convirtió en una tumba para miles de desafortunados Capadocios. Después de eso, el clan trasladó la mayor parte de su actividad de vuelta a Erciyes."
  POD_travel_events.4.b: "El descanso final de nuestros hermanos y hermanas."
    
  POD_travel_events.5.t: "La Catedral de la Carne: la locura de Yorak"
  POD_travel_events.5.desc: "La Catedral es la creación, el refugio y la protección de Yorak, un chiquillo del Antediluviano Tzimisce. Fue construida para proteger un germen de la conciencia del Antediluviano de la que Yorak fue encargado, y con el tiempo tomó la forma de una desgarradora iglesia-fortaleza, esculpida a partir de la carne de campesinos, esclavos, rivales, bestias y cualquier número de otras víctimas que fueron integradas en los muros palpitantes y supurantes de la estructura construida por el matusalén y su séquito a lo largo de milenios.\nSin embargo, la Catedral es mucho más que eso, es un receptáculo vivo (o quizás no muerto) de una conciencia colectiva loca. La catedral muestra un ambiente muy inquietante, como un pozo de sangre bordeado de víctimas sentadas que puedes usar como silla, pilares de cuerpos injertados, paredes de bocas que cantan un coro de lamentos al pasar junto a ellas, o la galería abierta donde los cadáveres permanecen empalados por estalactitas. Esas gruesas estalactitas y estalagmitas forman los pilares de la Catedral, con armaduras de hueso sobre las que crece la piedra caliza y forma una mezcla ósea de arquitectura líquida. O bien cráneos —con sus ojos y la estructura muscular circundante aún intactos— lo suficientemente delgados como para contemplar el mar de vísceras y órganos flotantes componen las paredes.\nDecenas de ghouls humedecen los ojos para que puedan parpadear correctamente. Aún más Aparecidos realizan el tatuaje ritual pasando hilos empolvados con carbón a través de la piel de sus víctimas con agujas de hueso. Más tarde, Yorak y sus chiquillos desprenderían cuidadosamente la carne de sus sacrificios gritando, tratarían el lienzo de carne en un conservante y lo estirarían sobre las ventanas como un mosaico."
  POD_travel_events.5.a: "Los Tzimisce no tienen límites."
  POD_travel_events.5.b: "¡Qué maravilla!"
    
  POD_travel_events.6.t: "El Castel d'Ombro: la guarida de Lasombra"
  POD_travel_events.6.desc: "Hay fenómenos misteriosos ocasionales asociados con este lugar, y un viejo relato sobre cómo las sombras aquí permanecieron intactas incluso cuando los flujos de lava del cercano Monte Etna proyectaron su espeluznante resplandor rojo sobre todo lo demás. Ni los residentes locales ni las autoridades visitantes se dan cuenta de cuán profundamente se retuercen sus mentes de forma regular para ocultar todo lo que es genuinamente interesante sobre este castillo en el centro de la propiedad. Para la visión vampírica es un asunto totalmente diferente.\nEl castillo en sí es de un diseño simple, modificado incontables veces a lo largo de los siglos y sin depender realmente de la fuerza física para sus defensas. Un largo muro exterior, precisamente cuadrado, encierra dos torres interiores, también cuadradas. La torre oriental se eleva más alto, con una cubierta superior extendida para permitir a los vigilantes la mejor vista de cualquier problema que venga del volcán, así como de otras direcciones. Es imposible decir desde la distancia de qué están hechos los muros, precisamente, porque sombras animadas se arrastran sobre cada superficie en un flujo y reflujo apenas visible. Mareas de sombra surgen de las profundidades después de la puesta del sol cada noche y envuelven el castillo en un patrón generalmente espiral, invirtiéndose después de la medianoche para drenarse gradualmente.\nSe dice que las puertas solo se abren cuando el propio Lasombra está lejos del castillo, una visión preocupante para el mundo en general."
  POD_travel_events.6.a: "Espeluznante."
  POD_travel_events.6.b: "El corazón de nuestro clan."
     
  POD_travel_events.7.t: "El Pozo de Malkav: la locura encarnada"
  POD_travel_events.7.desc: "Los túneles corren por debajo de Jerusalén, abandonados mucho antes de que la ciudad fuera siquiera algo. Este laberinto de pasadizos colapsados es casi impasable en algunos lugares, con altos arcos de piedra que conducen a caídas de acantilados que se extienden hacia la oscuridad absoluta. En algunos lugares, el equilibrio que mantiene abierto un pasadizo de piedra puede ser tan frágil como un hueso. Un solo impacto pequeño, y una sección enorme del corredor caerá. Los pasajes se entrelazan en tres dimensiones y hay muchas capas además de la primera.\nUno podría vagar aquí verdaderamente por la eternidad.\nEs imposible mapear esas ruinas pero tres lugares destacan.\nLa Sala de los Garabatos, donde las paredes están cubiertas de garabatos oscuros y calcáreos. Imágenes enloquecedoras asaltan al pobre necio que intenta descifrarlas.\nEl Río de Sangre, del cual cualquier cainita que intente beber sufrirá consecuencias nefastas por su pura toxicidad.\nY finalmente, el legendario lugar de descanso del Antediluviano, soñando y a veces llamando a su progenie hacia él. Pero no importa cuán fuerte o por cuánto tiempo llame, nadie ha logrado llegar a él todavía."
  POD_travel_events.7.a: "Este no es un lugar para los de mi clase."
  POD_travel_events.7.b: "¡Padre, te escucho!"
     
  POD_travel_events.8.t: "La Corte de Fuego: el ojo de la serpiente"
  POD_travel_events.8.desc: "La Corte de Fuego se encuentra cerca del Valle de los Reyes. Usando el señuelo del poder y las riquezas de la zona, los Setitas a menudo reclaman a los aspirantes a aventureros en sus garras para ser atraídos a la Corte.\nCualquiera que entre se encuentra en una caverna profunda pintada con una extraña luz naranja. Pinturas cuelgan de las paredes, con la más prominente representando a una gran serpiente negra devorando el sol. El túnel conduce a una gran sala tallada en arenisca. Seis enormes estatuas de hombres y mujeres con serpientes enroscadas a su alrededor sirven como pilares, sosteniendo el techo abovedado en lo alto. Las expresiones de las estatuas son de éxtasis o de agonía. El techo está velado por sombras que parecen ondular con vida propia; aquellos con vista aguda se dan cuenta de que serpientes talladas cubren todo el techo. Docenas de serpientes reales se deslizan por la habitación también.\nUn gran pozo de fuego circular está cerca del centro de la habitación. Su fuego arde con un verde fantasmal y emite un humo embriagador. Detrás del fuego hay un estrado, unas escaleras conducen desde él a una cobra de piedra enroscada que extiende su capucha sobre un trono de oro. Aquí es donde se sienta la señora de la Corte de Fuego, de alguna manera más intimidante que cualquier otra cosa en esta habitación."
  POD_travel_events.8.a: "Realmente aman a sus serpientes."
  POD_travel_events.8.b: "El poder de Set, mostrado a todos."
       
  POD_travel_events.9.t: "El Laberinto de Cnosos: la guarida de Namtaru"
  POD_travel_events.9.desc: "Nergal es un nombre de pavor, el vampiro que vendió su alma a poderes superiores y logró amenazar a la Segunda Ciudad con su ejército de demonios e infernalistas. Sus primeros esfuerzos fueron frustrados, pero después de haber discernido que el lugar de descanso de la bestia oscura que buscaba despertar estaba en el norte de Galilea, reapareció, llamándose a sí mismo Shaitan, el fundador del Clan Baali.\nConstruyendo la fortaleza de Corozaín sobre la tumba de Namtaru, el Portador de la Plaga, logró excavar el cuerpo latente y lo trasladó a Cnosos en el Mar Egeo, construyendo un gran laberinto inspirado en los abismos superficiales y los canales del cerebro humano. Cuando la realidad misma se deformó alrededor de la isla a medida que Namtaru se volvía más y más consciente, otros vampiros se alarmaron y atacaron a Nergal en su fortaleza. Juntos, los trece clanes hicieron que el volcán bajo Cnosos entrara en erupción, hundiendo a Namtaru bajo el mar y destruyendo aparentemente a Nergal para siempre.\nHasta esta noche, Cnosos sigue siendo un lugar que la mayoría de los vampiros evitan instintivamente, excepto aquellos que buscan formas de relacionarse con seres que no deberían ser molestados."
  POD_travel_events.9.a: "El Infierno en la Tierra."
  POD_travel_events.9.b: "El poder más oscuro y grande aguarda aquí."
     
  POD_travel_events.10.t: "Monasterio de Sernog: la guarida de los Tzimisce"
  POD_travel_events.10.desc: "La estructura se encuentra en lo alto de una cresta por encima del límite de los árboles. Una fortaleza abandonada se cierne amenazadoramente, sus muros ennegrecidos formando un esqueleto oscuro contra el cielo, el caparazón de un edificio abierto a las estrellas. Junto a la fortaleza hay una antigua catedral, ostensiblemente en mejor estado pero no menos siniestra que su edificio compañero. Profanada hace mucho tiempo, la tierra alrededor de la catedral del monasterio ya no califica como suelo sagrado; los cainitas pueden pisar las instalaciones con impunidad.\nEl interior de la catedral refleja una atmósfera de oscuro presentimiento. La arquitectura parece tallada en la imaginación febril de algún diseñador loco. Tallas grotescas de seres que podrían ser ángeles pero se parecen a demonios miran fijamente a quienes pasan por el arco de entrada al antiguo santuario. El aire dentro de la catedral tiene un olor rancio y empalagoso, como si algo eternamente moribundo se hubiera incrustado dentro de las piedras y ahora rezumara su esencia en un miasma de perpetua decadencia. Sonidos de gemidos espeluznantes llenan la cavernosa cámara central, resonando en las altas vigas abovedadas y reverberando en una cacofonía de gritos agudos que imitan los lamentos de las víctimas que sufren las agonías de una tortura prolongada y exquisita.\nHay una trampilla oculta bajo el altar de la iglesia. Tallada en el entablado de madera del suelo, la puerta se abre tirando de su anillo de hierro. Una escalera estrecha y oscura desciende a la cripta de la catedral, que contiene un sarcófago custodiado por un pequeño ejército de criaturas servidoras."
  POD_travel_events.10.a: "Donde Samiel encontró su fin, si las historias son ciertas."
  POD_travel_events.10.b: "Está durmiendo, esperando el momento adecuado para volver."
      
  POD_travel_events.11.t: "Hunedoara: la guarida de los Ocultos"
  POD_travel_events.11.desc: "Pregunta a la gente de Hunedoara dónde se encuentra el castillo y recibirás una mirada inexpresiva. Se sorprenderían mucho al saber que los mapas más antiguos muestran un magnífico castillo a menos de una hora de su aldea. El castillo es desconocido.\nInconnu.\nProhibitivo y desolado en su grandeza decadente, sus restos ocultos del mundo en general, escondidos en una morada rocosa. Ningún mortal puede entrar en el castillo, pues el ritual hace que todos los que pasan a la vista de él sientan un gran miedo. Cuanto más se alejan de él, más tenues se vuelven sus recuerdos, hasta que no lo recuerdan más.\nEntrar en el castillo es una tarea casi imposible, incluso los grandes poderes vampíricos no pueden obligar a alguien a evitar este miedo. Como tal, aquellos que logran llegar al castillo suelen ser obligados a ello. La entrada al castillo solo se puede obtener por un camino de montaña largo y sinuoso, delgado y traicionero, y a menudo con un profundo abismo a su lado. Los muros exteriores están en un estado de gran deterioro, y casi todos los edificios exteriores se han derrumbado, haciendo que toda la zona parezca más desierta y malévola. Cualquiera que intente entrar por cualquier otro camino que no sea la puerta principal es rechazado por vientos, rayos y finalmente ráfagas de llamas.\nEn su interior reside la mayor concentración de poder vampírico desde Cartago... y algo aún más peligroso."
  POD_travel_events.11.a: "Donde murió la Golconda y comenzó el Infierno."
      
  POD_travel_events.12.t: "Viena, la casa que Etrius construyó"
  POD_travel_events.12.desc: "Creada después de que Etrius expresara sus serias preocupaciones sobre la transformación de la Casa Tremere en un clan de vampiros demasiado rápido, Viena pronto se convirtió en el refugio más seguro para la facción conservadora del clan.\nEncaramada en un promontorio dentado a varios kilómetros al norte de la ciudad, la capilla de Viena parece un pabellón de caza grande e imponente. Sus muros están compuestos por bloques masivos de piedra gris, tallados de la Tierra por la magia de Etrius. Vigas masivas actúan como pilares y travesaños en toda la estructura. Cada cámara es grandiosa y de gran tamaño. Una extensa red de cámaras en desuso cruza la colina sobre la que se asienta el edificio. Etrius las construyó para permitir espacio para futuras expansiones sin despertar una atención no deseada.\nLos laboratorios de Viena son grandes y están bien equipados y la biblioteca es la mejor que los Tremere tienen a su disposición fuera de Ceoris. Las áreas comunes son al mismo tiempo suntuosas y prohibitivas. Los pesados muebles de madera están acolchados en terciopelo bordado en oro. Incienso de una dulzura abrumadora emana de numerosos incensarios de cobre. Los tapices representan a Tremere, Etrius y Goratrix mirando con desaprobación a los ocupantes de la habitación, mientras que enormes cuernos de ciervo, cabezas de jabalí y otros trofeos aparecen por todo el edificio.\nViena carece de las elaboradas medidas de protección de Ceoris, pero el suelo sigue estando plagado de ingeniosas trampas."
  POD_travel_events.12.a: "El plan de reserva de los Usurpadores."
  POD_travel_events.12.b: "Un oasis de calma lejos de nuestros enemigos."
      
  POD_travel_danger_events.13.success: "¡Son derrotados!"
  POD_travel_danger_events.13.wound: "Una victoria difícil."
  POD_travel_danger_events.13.failure: "Escapada costosa..."
  POD_travel_events.13.t: "$travel_danger_prefix$ ¡Emboscada de hombres lobo!"
  POD_travel_events.13.desc: "Los bosques son el dominio de los Lupinos y, a pesar de tus mejores esfuerzos por permanecer sigiloso, esos malditos lobos sobredimensionados lograron rastrear tu olor. Por suerte, estabas preparado para la posibilidad y no te han pillado completamente por sorpresa.\nAun así, son criaturas poderosas, mucho más acostumbradas a una pelea aquí de lo que tú lo estarás jamás. Esto no será fácil."
  POD_travel_events.13.a: "¡Mantén tu posición!"
  POD_travel_events.13.b: "¡Tú, protégeme!"
 
  POD_travel_danger_events.14.success: "¡Te dejan pasar!"
  POD_travel_events.14.t: "$travel_danger_prefix$ Cazadores al acecho"
  POD_travel_events.14.desc: "A pesar de tus mejores esfuerzos por mantener el sigilo durante tus viajes, parece que los rumores de tu convoy han sido escuchados por una banda de cazadores emprendedores. Han bloqueado un puente que tendrás que cruzar para continuar tu viaje pero, por suerte, no parecen estar del todo seguros de a quién (o qué) esperar.\nComo tal, no eres atacado a primera vista, lo que te da la oportunidad de intentar engañarlos, tal vez evitando una pelea en el proceso."
  POD_travel_events.14.a: "¡Carga antes de que reaccionen!"
  POD_travel_events.14.b: "Tú, ocúpate de ellos."
  POD_travel_events.14.c: "Somos humildes mercaderes de paso..."
  
  POD_travel_events.15.t: "$travel_danger_prefix$ Profeta loco"
  POD_travel_events.15.desc: "Un individuo desaliñado, claramente no del todo cuerdo, ha empezado a seguir a tu convoy desde hace algún tiempo. Está soltando tonterías sobre la Gehenna, el Apocalipsis, la Ascensión, el Tiempo del Juicio y otras sandeces. Tus mejores esfuerzos por ahuyentarlo han fallado, e incluso recurrir a la violencia solo parece hacer que reaparezca más tarde con aún más pesimismo en su discurso.\nTu caravana está empezando a irritarse por la constante charla sobre el fin del mundo, obligándote a considerar actuar."
  POD_travel_events.15.a: "Háblame a mí en su lugar."
  POD_travel_events.15.b: "Simplemente ignora al loco."
  POD_travel_events.15.c: "¡Yo también tengo mis propias profecías!"
   
  POD_travel_events.16.t: "$travel_danger_prefix$ Pueblo tranquilo"
  POD_travel_events.16.desc: "Desde que has entrado en esta región, se han extendido rumores a tu caravana sobre un pueblecito pintoresco por el que tu plan de viaje te hace pasar. Los lugareños hablan de abominaciones impías que gobiernan la noche allí, obligando a la gente del pueblo a rezar para ver el amanecer lo antes posible.\nA medida que te acercas, los rumores se vuelven aún más gráficos y tu séquito comparte su inquietud contigo. Abogan por un pequeño desvío en lugar de arriesgarse a poner un pie en esta aldea maldita y enfurecer a quienquiera que esté gobernando aquí realmente."
  POD_travel_events.16.a: "¡No temo a ninguna historia de fantasmas!"
  POD_travel_events.16.b: "Sí, un desvío. No es que tenga miedo..."
  POD_travel_events.16.c: "¡Siento un espíritu afín!"
   
  POD_travel_events.17.t: "$travel_danger_prefix$ Guerras mortales"
  POD_travel_events.17.desc: "Los despistados mortales están librando una guerra en esta región por una razón insignificante u otra. No es que te importe, pero la devastación traída por los ejércitos en conflicto y el riesgo de tropezar con uno de ellos es una preocupación para tu plan de viaje. Una opción sería simplemente dar un rodeo bastante largo, con la esperanza de evitar cualquier contacto con los mortales enfrentados. También podrías contratar a más guías locales de lo planeado originalmente, ya que serían los más adecuados para encontrar una ruta de viaje alternativa segura.\nLa solución más poco ortodoxa sería unirse a la refriega con tu séquito, una solución que consume tiempo pero que es potencialmente esclarecedora para observar las últimas tácticas de guerra de los mortales."
  POD_travel_events.17.a: "Simplemente evitémoslos."
  POD_travel_events.17.b: "Contrata a más lugareños para acelerar las cosas."
  POD_travel_events.17.c: "¿Una guerra? ¡Dejadme unirme!"
  
  POD_travel_events.18.t: "$travel_event_prefix$ Bajo el disfraz de la noche"
  POD_travel_events.18.desc: "Viajar largas distancias para un vampiro es un asunto miserable ya que el sol resulta ser un disuasivo formidable. Si intentas moverte de día, tendrás que tener algunos alojamientos muy específicos (y sospechosos) para asegurarte de que tu lugar de descanso permanezca perfectamente a prueba de sol y solo pueda ser protegido por aquellos sirvientes menores que realmente pueden soportar la luz del día. Si viajas solo de noche, es probable que atraigas aún más atención no deseada y necesites tener en cuenta el horario de sueño de esos mismos sirvientes diurnos...\nNo hay una solución fácil para ese problema y, como tal, los viajes con un vampiro tienden a ser mucho más largos que sin uno, incluso con la mejor preparación hecha de antemano."
  POD_travel_events.18.a: "Es lo que hay."
  POD_travel_events.18.b: "¡Seguid adelante! ¡Más rápido!"
  
  POD_travel_events.19.t: "$travel_event_prefix$ Al viejo estilo egipcio"
  POD_travel_events.19.desc: "Como momia, has vivido mucho tiempo y has visto (y probablemente incluso liderado) grandes civilizaciones de la Antigüedad. La pompa y la gloria de este mundo pasado contrastan fuertemente con la penumbra de estas \"Edades Oscuras\". ¿Dónde están los músicos, las procesiones, los oradores anunciando tus gloriosos títulos mientras caminas por la tierra? ¿Y qué se supone que son esos horribles carruajes? ¡No le llegan ni a la suela de los zapatos a tu carro de oro!\nDe repente tienes el capricho de retrasar tu viaje actual hasta que seas capaz de recrear algo de esta gloria pasada. Un esfuerzo costoso y largo, pero realmente quieres mostrar a esta gente moderna cómo viaja un verdadero Faraón."
  POD_travel_events.19.a: "¡Traedme mi Hemhemet!"
  POD_travel_events.19.b: "...La nostalgia me ha golpeado fuerte."
  
  POD_travel_events.20.t: "$travel_event_prefix$ Cazadores del pueblo"
  POD_travel_events.20.desc: "Como cazador de todas las cosas horribles que se aprovechan de la humanidad, tu deber tiene que ser un voto secreto. Tus semejantes entrarían en pánico si conocieran el alcance de la amenaza que acecha tras cada esquina. Este secreto a menudo causa algunos problemas, ya que mucha gente te confunde con algún tipo de autoridad clerical y luego descarga sus problemas actuales, a menudo muy mundanos, sobre ti mientras viajas por sus tierras.\nAdministrar justicia es algo que sabes hacer, pero también sería un retraso considerable en tu combate más apremiante (y mucho más importante) contra lo sobrenatural."
  POD_travel_events.20.a: "Escucharé y juzgaré."
  POD_travel_events.20.b: "Los esbirros del Diablo no me esperarán."
  
  POD_travel_events.21.t: "$travel_event_prefix$ Encuentro de los lobos"
  POD_travel_events.21.desc: "Como tradición, se supone que los hombres lobo que viajan pueden encontrar refugio en los Túmulos locales siempre que respeten la autoridad y las costumbres de sus habitantes. También se espera que no se queden por mucho tiempo, ya que los hombres lobo son criaturas territoriales y no les gusta la competencia potencial.\nTus exploradores han notado un Túmulo cercano que podría servir como un refugio amistoso potencial. Retrasaría tu viaje por un tiempo, pero se reflejaría bien en ti y en los tuyos participar en las tradiciones de los Garou con los lugareños."
  POD_travel_events.21.a: "¿Podemos compartir vuestro fuego por un rato?"
  POD_travel_events.21.b: "No hay tiempo para retrasos."
  
  POD_travel_events.22.t: "$travel_event_prefix$ El infierno en tu pueblecito"
  POD_travel_events.22.desc: "Viajar trae oportunidades para los de tu clase y sus sirvientes. Es una forma de descubrir aldeas pequeñas y aisladas que apenas son reconocidas como existentes por las diversas autoridades de su país. Una presa tan fácil de corromper constituye una recreación relajante durante un viaje largo y aburrido. Obviamente retrasaría tu viaje por un tiempo, pero ¿no vale la pena la autogratificación al final?"
  POD_travel_events.22.a: "Las delicias que os mostraré..."
 
  ghouled_entourage_option: "Séquito de ghouls"
  ghouled_entourage_option_desc: "Los vampiros necesitan un séquito fuerte y leal durante los viajes, ya que no pueden actuar durante la luz del día. Los ghouls son una buena opción."               
  
  mummies_grandeur_option: "Viajes del Faraón"
  mummies_grandeur_option_desc: "Las momias recuerdan una época en la que eran Faraones y viajaban con un séquito y una grandeza que podría hacer sonrojar a los insignificantes reyes de hoy. A veces, quieren recuperar esa era."
  
  werewolves_umbra_option: "Puentes lunares"
  werewolves_umbra_option_desc: "Los hombres lobo pueden viajar usando los legendarios Puentes Lunares que cruzan la [umbra|E]. En muchos casos, esto es mucho más rápido y seguro que tomar el camino mundano."
  
  spread_cults_option: "Extender cultos"
  spread_cults_option_desc: "Viajar te brinda la oportunidad de infiltrar miembros leales de tu culto en las aldeas y pueblos locales por los que pasarás. Esto te retrasará un poco, pero aumentar tu influencia es ciertamente beneficioso."
 
  nosferatu_hajj_option: "El Hajj"
  nosferatu_hajj_option_desc: "El Hajj es un grupo de Nosferatu celosos dentro de los [Glossary('Ashirra','game_concept_ashirra_desc')]. Se ven a sí mismos como los guardianes de los lugares sagrados del Islam y de sus peregrinos."
  
  POD_travel_events.23.t: "Ombos, el ojo de Set"
  POD_travel_events.23.desc: "Desde lejos, Ombos parece montículos de tierra, unas pocas columnas derribadas y fragmentos de muros, nada más. Muy poco queda de lo que una vez fue el centro del culto mortal de Set. Mientras caminas por las ruinas a la luz de las estrellas, un hombre sale de detrás de una mastaba erosionada. Viste una túnica negra sencilla y lleva la vara de medir de un antiguo sacerdote egipcio. \"Bienvenido a la Casa de Set\".\nCaminas por el desierto durante casi una hora hasta que una solitaria puerta de pilono se alza ante ti. \"El Gran Set espera más allá. Camina recto y llegarás a Él. Él mismo responderá a tus preguntas\".\nNunca has visto las estrellas tan brillantes en el cielo negro de luna. Los afloramientos de roca proyectan sombras opacas sobre las arenas plateadas del desierto. Sin embargo, tú no proyectas sombras, no dejas huellas en las arenas. Miras una estrella en el horizonte y cuentas hasta mil, tres veces. No se mueve.\n¿Teme el tiempo mismo al poderoso Set? No lo sabes, pero podrías saberlo pronto si continúas caminando hacia el horizonte..."
  POD_travel_events.23.a: "Sutekh triunfante, escucha mi oración."
  POD_travel_events.23.b: "Siento algo o a alguien..."
    
  POD_travel_events.24.t: "Sherwood, guarida de la anarquía"
  POD_travel_events.24.desc: "Un gran bosque de caza real bordeado al oeste por el río Erewash y el bosque de East Derbyshire, Sherwood es el coto de caza favorito de la nobleza posterior a la invasión normanda. Sin embargo, realmente cobró importancia una vez que se convirtió en la base del famoso proscrito Robin Leeland.\nAunque los orígenes del hombre son misteriosos, Robin ha luchado contra los tiranos desde siempre. Sus rasgos duros y sucios estuvieron presentes en varios levantamientos plebeyos, tomando parte directa en varias revueltas campesinas contra la nobleza inglesa, siendo un defensor particularmente fuerte de las tendencias anarquistas, a menudo luchando en primera línea durante las escaramuzas militares.\nSu \"gran roble\", un árbol enorme en el centro del bosque que usa como refugio, es ahora casi un lugar de peregrinación para los futuros luchadores por la libertad que esperan encontrar sabiduría bajo la guía de \"el Capucha\"."
  POD_travel_events.24.a: "¡Abajo los tiranos!"
  POD_travel_events.24.b: "Una vista peculiar."
   
  POD_travel_events.25.t: "La Corte del Amor"
  POD_travel_events.25.desc: "Incluso entre las muchas prestigiosas Cortes del Amor, la Corte de Salianna es considerada la más suntuosa. A menudo organizadas en lugares históricamente ricos, las \"soirées\" de Salianna son el lugar ideal para mostrar la destreza intelectual o marcial. El objetivo final de tales exhibiciones es siempre el mismo: entretener a la Reina de París y ganar su preciado favor.\nDurante el invierno, la Corte se vuelve más política, teniendo lugar en la propiedad de Salianna, donde los muchos giros y vueltas del dominio favorecen a los conspiradores y chismosos para ejercer su oficio. Todo lo que ocurre durante una Corte está regulado por las \"Belles Dames sans Merci\" (bellas y despiadadas damas), cuatro señoras de la corte que están más que dispuestas a destruir la reputación de cualquier cainita impudente con unas pocas palabras elegidas.\nLa Corte del Amor de Salianna, aunque menos insensible que la de Isouda, sigue sin ser apta para cardíacos y muchos neonatos esperanzados han sido aplastados bajo sus juegos de poder misericordiosos (y a menudo tácitos)."
  POD_travel_events.25.a: "¡Necesito emular esto!"
 
  POD_travel_events.26.t: "El santuario de Telyavel"
  POD_travel_events.26.desc: "Telyavel es el Guardián de los Muertos, pero también el dios herrero conocido como el Hacedor de Cosas. La creencia popular lituana sostenía que un herrero trabajaba con los elementos básicos de la creación misma —aire, fuego, agua y tierra— y los moldeaba a su antojo, por lo que ser herrero no era solo una forma de honrar a los dioses, era una forma de saber, de manera limitada, qué se sentía al ser ellos. Telyavel reencarna las almas de los muertos, usándolas como materia prima para crear las hojas metálicas de la Arboleda de las Sombras.\nPara ello, un alma aparecería sobre su yunque en forma de una persona pequeña (homúnculo). Telyavel agarraría el alma con las tenazas y la sumergiría en el fuego. El homúnculo gritaría de dolor, pero cuando el herrero retirara las tenazas de las llamas, ahora sostendría una pieza de metal caliente lista para ser moldeada. El herrero pondría el metal en el yunque y lo golpearía mientras sangre humeante saldría disparada con cada golpe de martillo, corriendo por los surcos y cayendo en un orificio inferior, llenando un vasto mar de sangre cercano. Al final de todo el proceso, una hoja metálica perfecta emergería y sería llevada por el viento hacia la Arboleda.\nTelyavel es adorado sobre todo por una línea de sangre conocida como los Tremere Telyavélicos, que protegen ferozmente la Arboleda."
  POD_travel_events.26.a: "Un Dios poderoso y un sitio mágico poderoso."
  POD_travel_events.26.b: "Una vista peculiar."
      
  POD_travel_events.27.t: "El Mausoleo, el corazón muerto de Venecia"
  POD_travel_events.27.desc: "“¿Quieres conocer Venecia, visitante?”. Los ojos de tu guía, su voz, se habían vuelto de repente muy fríos. “Entonces escucha bien”.\n “En Venecia, los Nosferatu acechan en las alcantarillas y en los canales, esperando que los ojos de los que están por encima de ellos no los vean. Los Ventrue vienen con los mercaderes itinerantes, y piensan en establecer refugios, pero no se quedan mucho tiempo, no. Venecia, visitante, pertenece a los Giovanni”.\n “Los Giovanni no tienen rival. Otros Vástagos habitan aquí por su tolerancia, o no habitan aquí en absoluto. Ningún conflicto abierto perturba la noche veneciana, pues los Giovanni no lo permiten. Son una familia, visitante, además de un clan. Durante siglos, han tenido su guarida aquí, en su hogar ancestral, pudriéndose en sus fincas familiares, en las universidades, en los bancos y prestamistas. ¡Conocen los secretos que yacen más allá de la muerte, visitante, pues han construido todo su imperio sobre las espaldas de los muertos!”.\n “Una noche, una noche terrible, abrirán la puerta a la tierra prohibida y Venecia se convertirá en el mundo, los Giovanni finalmente dueños de una tierra muerta y estéril”."
  POD_travel_events.27.a: "Hora de pagar mi tributo a la Familia."
  POD_travel_events.27.b: "Solo rumores... ¿verdad?"
