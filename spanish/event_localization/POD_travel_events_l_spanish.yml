l_spanish:
 
  POD_travel_events.1.t: "Alamut: el Nido del Águila"
  POD_travel_events.1.desc: "En las montañas de Asia Menor, si uno sabe dónde mirar, hay un sendero estrecho que se bifurca de la ruta comercial principal, donde no hay aldeas en decenas de millas. Esta ruta asciende por las laderas más empinadas y pasa cerca de profundidades traicioneras donde los vientos fríos aúllan para arrastrar a los incautos a la muerte contra las rocas, afiladas como espadas, que hay muy abajo. Este es el camino a Alamut, el Nido del Águila, la antigua fortaleza de los Banu Haqim.\nDesde fuera, Alamut tiene poco que ver: un pequeño fuerte en una colina, de basalto negro, con muros demasiado bajos y delgados para resistir un asedio. Sin embargo, esto es solo la entrada de la fortaleza.\nDentro de la estructura central se abre un camino ancho y llano que desciende hacia las montañas. Aquí es donde comienzan las verdaderas defensas de Alamut, que los miembros de las tres castas mantienen y supervisan sin cesar. Los encantamientos mantienen su ubicación oculta a todos los que desean mal a sus habitantes.\nAquí están las salas de entrenamiento, donde cien guerreros ponen a prueba su temple. Aquí hay innumerables laboratorios donde los hechiceros experimentan con magia perdida hace mucho para la humanidad. Aquí está la gran biblioteca, donde los visires reflexionan sobre los secretos del universo.\nY aquí está el Trono Negro de Haqim, que domina el mismo centro de la fortaleza, en el gran salón, a la espera del regreso de su legítimo y terrible amo."
  POD_travel_events.1.a: "Hay muchas cosas que aprender aquí."
  POD_travel_events.1.b: "No debería demorarme."
  
  POD_travel_events.2.t: "Ceoris: el orgullo de Tremere"
  POD_travel_events.2.desc: "Los visitantes o atacantes deben acercarse a Ceoris desde las traicioneras y fuertemente fortificadas estribaciones del sur. Una lluvia, una niebla y unas tormentas antinaturales protegen el valle mientras los guardias patrullan de día y de noche. El sendero acaba en una pendiente empinada hasta las puertas de Ceoris. Es lo bastante rocoso y sinuoso como para impedir el transporte de armas de asedio para atacar la capilla. Enormes rocas removidas por las Gárgolas ofrecen emplazamientos ideales de emboscada para los defensores.\nEl visitante que se acerca no ve más que niebla ni oye más que vientos aulladores. Es un vasto fuste de roca negra que se alza de una meseta artificial. Su superficie no está estropeada por adornos; solo docenas de ventanas largas y estrechas, ahora tapiadas y selladas con láminas de plomo, interrumpen la perfecta verticalidad de sus paredes. Ocho torres se elevan de la mole de la estructura y hacen de señuelos, pues ninguna da acceso a la propia Ceoris. Un par de ellas estallan en llamas cuando se les aplica peso. Parece que los Tremere no pueden contener con facilidad sus impulsos teatrales.\nUn gran abismo rodea la capilla, con solo un puente estrechísimo para cruzarlo. Por último, la casa de la puerta es el último obstáculo, protegida por soldados curtidos y por las Gárgolas más feroces. Incluso si fueran derrotados, poderosas trampas mágicas aguardan al invasor obstinado. Tras la casa de la puerta se halla por fin la propia Ceoris, el corazón y el alma de los desalmados Tremere."
  POD_travel_events.2.a: "La guarida de los Usurpadores."
  POD_travel_events.2.b: "Impresionante, por decir lo menos."
  
  POD_travel_events.3.t: "Cartago: Sueño y Pesadilla"
  POD_travel_events.3.desc: "Los Brujah todavía se inspiran en las leyendas de los grandes eruditos y filósofos que florecieron en Cartago, una cultura en la que los Vástagos y el ganado estuvieron más próximos entre sí que en ningún otro momento, antes o después. De hecho, algunos Brujah (y unos pocos más) recuerdan Cartago como la «Tercera Ciudad», la heredera espiritual y política de la Primera y la Segunda Ciudad. Sin embargo, otros relatos más oscuros hablan de un culto de sangre degenerado bajo nada menos que Troile, el ancestro Antediluviano de los Brujah; de sacrificios humanos, incluidos sacrificios de niños, a poderes infernales; y de connivencia entre Troile y el matusalén Baali Moloch.\nLos Ventrue de Roma eran feroces rivales de sus primos Brujah de Cartago. Mientras Moloch arrastraba a Troile hacia la insensibilización y la degeneración, las noticias de la corrupción endémica entre los Brujah cartagineses se extendieron por los clanes romanos. La vidente Malkavian Trifosa aconsejó al príncipe romano Camilla que actuara contra Cartago, y la Toreador cartaginesa Helena traicionó a su ciudad ante los romanos. A través de la Antediluviana Toreador, Artemis Orthia, Lisandro y el príncipe Alquias, se formó una alianza contra los Brujah de Cartago; bajo el liderazgo de los Ventrue romanos, la alianza abarcó a los Malkavian, los Toreador, los Lasombra y sus aliados. Cuando la Tercera Guerra Púnica arrasó Cartago en el 146 a. C., las fuerzas conjuntas de la alianza cainita romana derrotaron a los amos Brujah y Baali de Cartago. Al final, Troile y Moloch fueron sumidos en el Letargo, entrelazados en un eterno abrazo de amantes bajo los campos salados de Cartago."
  POD_travel_events.3.a: "Una pesadilla durmiente."
  POD_travel_events.3.b: "Las ruinas de nuestra utopía."
   
  POD_travel_events.4.t: "Erciyes: la locura de Capadocio"
  POD_travel_events.4.desc: "A veces llamado el Monasterio de las Sombras por su ubicación (los altos acantilados que lo rodean por todos lados hacen que reciba solo unas pocas horas de luz solar directa al día), Erciyes fue tomado por los Capadocios en un asalto masivo (la única acción militar en la historia del Clan) en algún momento del siglo I a. C., cuando sustituyeron a un monasterio de montaña que servía originalmente como culto de un Malkavian. Desde entonces, el Clan mantuvo en la montaña un complejo de templos dedicado al estudio capadocio de la muerte y de Dios. Este templo es cristiano (como suelen serlo los Capadocios), pero es conocido por sus extraños y horripilantes secretos.\nSu «ciudad hermana», Kaymakli, se halla cerca y goza de una reputación aún más oscura. La ciudad era una comunidad híbrida de Capadocios y mortales; los mortales proveían todas las comodidades y servían de rebaño para los eruditos no-muertos de sus filas. Aunque distaba de ser ideal, el arreglo parecía moderadamente satisfactorio para ambas partes, posiblemente atemperado tanto por las condiciones por lo general desagradables de un campesino turco del siglo IX como por las actitudes generalmente pasivas y algo más humanas de Capadocio.\nCuando el Clan fue purgado durante el Festín de la Locura, la ciudad se convirtió en una tumba para miles de desafortunados Capadocios. Después, el Clan trasladó la mayor parte de su actividad de vuelta a Erciyes."
  POD_travel_events.4.b: "El descanso final de nuestros hermanos y hermanas."
    
  POD_travel_events.5.t: "La Catedral de la Carne: la locura de Yorak"
  POD_travel_events.5.desc: "La Catedral es la creación, el refugio y la pupila de Yorak, un Chiquillo del Antediluviano Tzimisce. Fue construida para proteger un germen de la conciencia del Antediluviano que se le encomendó a Yorak y, con el tiempo, adoptó la forma de una iglesia-fortaleza atormentada, esculpida con la carne de campesinos, esclavos, rivales, bestias y un sinfín de otras víctimas que fueron integradas en los muros palpitantes y supurantes de la estructura que el matusalén y su séquito levantaron a lo largo de milenios.\nSin embargo, la Catedral es mucho más que eso: es un recipiente vivo (o quizá no-muerto) de una enloquecida conciencia colectiva. La catedral exhibe un ambiente muy inquietante, como un estanque de sangre bordeado de víctimas sentadas que puedes usar como silla, pilares de cuerpos injertados, paredes de bocas que cantan un coro lastimero cuando pasas junto a ellas o la galería abierta donde los cadáveres siguen empalados en estalactitas. Esas gruesas estalactitas y estalagmitas forman los pilares de la Catedral, con armazones de hueso sobre los que crece la caliza y forma una mezcla ósea de arquitectura líquida. Los muros están hechos de cráneos, con los ojos y la musculatura circundante aún intactos, tan delgados que permiten contemplar el mar de vísceras y órganos flotantes.\nDecenas de Ghouls humedecen los ojos para que puedan parpadear como es debido. Aún más Aparecidos realizan el tatuaje ritual pasando por la piel de sus víctimas, con agujas de hueso, hilos espolvoreados de carbón. Después, Yorak y sus Chiquillos desprenden con cuidado la carne de sus sacrificios, que gritan, tratan el lienzo de carne con un conservante y lo extienden sobre las ventanas como un mosaico."
  POD_travel_events.5.a: "Los Tzimisce no tienen límites."
  POD_travel_events.5.b: "¡Qué maravilla!"
    
  POD_travel_events.6.t: "El Castel d'Ombro: la guarida de Lasombra"
  POD_travel_events.6.desc: "Hay fenómenos misteriosos ocasionales asociados a este lugar y un viejo relato sobre cómo las sombras de aquí permanecieron intactas incluso cuando las coladas de lava del cercano Etna proyectaron su macabro resplandor rojo sobre todo lo demás. Ni los lugareños ni las autoridades visitantes se dan cuenta de hasta qué punto se les retuercen las mentes de forma regular para ocultar todo lo que de verdad resulta interesante de este castillo, en el centro de la finca. Para la vista vampírica es algo del todo distinto.\nEl castillo en sí es de diseño sencillo, modificado incontables veces a lo largo de los siglos y que en realidad no depende en absoluto de la fuerza física para sus defensas. Un largo muro exterior, perfectamente cuadrado, encierra dos torres interiores, también cuadradas. La torre oriental se eleva más, con una cubierta superior ensanchada que da a los vigías la mejor vista de cualquier problema que llegue del volcán o de otras direcciones. Desde lejos es imposible saber de qué están hechos exactamente los muros, porque sombras animadas se arrastran sobre cada superficie en un flujo y reflujo apenas visible. Mareas de sombra emergen de las profundidades tras la puesta de sol cada noche y envuelven el castillo en una pauta más o menos espiral, que se invierte después de medianoche para drenarse poco a poco.\nSe dice que las puertas solo se abren cuando el propio Lasombra está fuera del castillo, una visión inquietante para el mundo en general."
  POD_travel_events.6.a: "Espeluznante."
  POD_travel_events.6.b: "El corazón de nuestro clan."
     
  POD_travel_events.7.t: "El Pozo de Malkav: la locura encarnada"
  POD_travel_events.7.desc: "Bajo Jerusalén discurren túneles abandonados mucho antes de que la ciudad existiera siquiera. Este laberinto de pasadizos derrumbados es casi impracticable en algunos tramos, con altos arcos de piedra que dan a precipicios que se hunden en la más absoluta oscuridad. En algunos puntos, el equilibrio que mantiene abierto un pasadizo de piedra puede ser tan frágil como un hueso. Un solo impacto pequeño y caerá una enorme sección del corredor. Los pasadizos se entretejen en tres dimensiones y hay muchas capas además de la primera.\nUno podría vagar aquí de verdad por toda la eternidad.\nEs imposible cartografiar esas ruinas, pero tres lugares destacan.\nLa Sala de los Garabatos, donde las paredes están cubiertas de garabatos oscuros y calcáreos. Imágenes enloquecedoras asaltan al pobre necio que intenta descifrarlos.\nEl Río de Sangre, del que cualquier Cainita que intente beber sufrirá consecuencias funestas por su pura toxicidad.\nY, por último, el legendario lugar de reposo del Antediluviano, que sueña y a veces llama a su progenie. Pero por muy fuerte o durante cuánto tiempo llame, nadie ha logrado aún llegar hasta él."
  POD_travel_events.7.a: "Este no es un lugar para los de mi clase."
  POD_travel_events.7.b: "¡Padre, te escucho!"
     
  POD_travel_events.8.t: "La Corte de Fuego: el ojo de la serpiente"
  POD_travel_events.8.desc: "La Corte del Fuego se halla cerca del Valle de los Reyes. Valiéndose del señuelo del poder y las riquezas de la zona, los Setitas atraen a menudo a posibles aventureros a sus garras en la Corte.\nQuien entra se encuentra en una profunda caverna bañada por una extraña luz anaranjada. De las paredes cuelgan pinturas, y la más destacada representa a una gran serpiente negra devorando el sol. El túnel conduce a una gran sala tallada en arenisca. Seis enormes estatuas de hombres y mujeres con serpientes enroscadas sirven de pilares y sostienen en alto el techo abovedado. Las expresiones de las estatuas son de éxtasis o de agonía. El techo está velado por sombras que parecen ondular con vida propia; quienes tienen buena vista advierten que serpientes talladas cubren todo el techo. Docenas de serpientes reales se deslizan también por la sala.\nUn gran hoyo de fuego circular se halla cerca del centro de la sala. Su fuego arde con un verde espectral y desprende un humo embriagador. Tras el fuego hay un estrado; de él parten unas escaleras hasta una cobra de piedra enroscada que despliega su capucha sobre un trono dorado. Aquí es donde se sienta la señora de la Corte del Fuego, de algún modo más intimidante que cualquier otra cosa de esta sala."
  POD_travel_events.8.a: "Realmente aman a sus serpientes."
  POD_travel_events.8.b: "El poder de Set, mostrado a todos."
       
  POD_travel_events.9.t: "El Laberinto de Cnosos: la guarida de Namtaru"
  POD_travel_events.9.desc: "Nergal es un nombre de pavor: el vampiro que vendió su alma a poderes superiores y logró amenazar a la Segunda Ciudad con su ejército de demonios e infernalistas. Sus primeros esfuerzos fueron frustrados, pero tras averiguar que el lugar de reposo de la oscura bestia que buscaba despertar estaba en el norte de Galilea, reapareció proclamándose Shaitán, el fundador del Clan Baali.\nAl construir la fortaleza de Corozaín sobre la tumba de Namtaru, el Portador de la Plaga, logró excavar el cuerpo latente y lo trasladó a Cnosos, en el mar Egeo, donde levantó un gran laberinto inspirado en los surcos y canales de la superficie del cerebro humano. Cuando la propia realidad se deformó en torno a la isla a medida que Namtaru cobraba cada vez más conciencia, otros vampiros se alarmaron y atacaron a Nergal en su bastión. Juntos, los trece clanes hicieron entrar en erupción el volcán bajo Cnosos, hundieron a Namtaru bajo el mar y, al parecer, destruyeron a Nergal para siempre.\nHasta esta noche, Cnosos sigue siendo un lugar que la mayoría de los vampiros evitan por instinto, salvo quienes buscan maneras de tratar con seres a los que no se debería molestar."
  POD_travel_events.9.a: "El Infierno en la Tierra."
  POD_travel_events.9.b: "El poder más oscuro y grande aguarda aquí."
     
  POD_travel_events.10.t: "Monasterio de Sernog: la guarida de los Tzimisce"
  POD_travel_events.10.desc: "La estructura se encuentra en lo alto de una cresta por encima del límite de los árboles. Una fortaleza abandonada se cierne amenazadoramente, sus muros ennegrecidos formando un esqueleto oscuro contra el cielo, el caparazón de un edificio abierto a las estrellas. Junto a la fortaleza hay una antigua catedral, ostensiblemente en mejor estado pero no menos siniestra que su edificio compañero. Profanada hace mucho tiempo, la tierra alrededor de la catedral del monasterio ya no califica como suelo sagrado; los cainitas pueden pisar las instalaciones con impunidad.\nEl interior de la catedral refleja una atmósfera de oscuro presentimiento. La arquitectura parece tallada en la imaginación febril de algún diseñador loco. Tallas grotescas de seres que podrían ser ángeles pero se parecen a demonios miran fijamente a quienes pasan por el arco de entrada al antiguo santuario. El aire dentro de la catedral tiene un olor rancio y empalagoso, como si algo eternamente moribundo se hubiera incrustado dentro de las piedras y ahora rezumara su esencia en un miasma de perpetua decadencia. Sonidos de gemidos espeluznantes llenan la cavernosa cámara central, resonando en las altas vigas abovedadas y reverberando en una cacofonía de gritos agudos que imitan los lamentos de las víctimas que sufren las agonías de una tortura prolongada y exquisita.\nHay una trampilla oculta bajo el altar de la iglesia. Tallada en el entablado de madera del suelo, la puerta se abre tirando de su anillo de hierro. Una escalera estrecha y oscura desciende a la cripta de la catedral, que contiene un sarcófago custodiado por un pequeño ejército de criaturas servidoras."
  POD_travel_events.10.a: "Donde Samiel encontró su fin, si las historias son ciertas."
  POD_travel_events.10.b: "Está durmiendo, esperando el momento adecuado para volver."
      
  POD_travel_events.11.t: "Hunedoara: la guarida de los Ocultos"
  POD_travel_events.11.desc: "Pregunta a la gente de Hunedoara dónde se alza el castillo y recibirás una mirada en blanco. Se sorprenderían mucho al saber que mapas más antiguos muestran un magnífico castillo a menos de una hora de su aldea. El castillo es desconocido.\nInconnu.\nSombrío y desolado en su grandeza marchita, sus ruinas ocultas al mundo en general, recogidas en una morada rocosa. Ningún mortal puede entrar en el castillo, pues el ritual hace que todos los que pasan al alcance de su vista sientan un gran miedo. Cuanto más se alejan, más se desdibujan sus recuerdos, hasta que ya no lo recuerdan.\nEntrar en el castillo es una tarea casi imposible; ni siquiera los grandes poderes vampíricos pueden obligar a alguien a superar ese miedo. Por eso, quienes llegan al castillo suelen hacerlo a la fuerza. Solo se accede al castillo por un largo y sinuoso sendero de montaña, estrecho y traicionero, y a menudo con un profundo abismo a un lado. Los muros exteriores se hallan en un estado de grave deterioro y casi todos los edificios exteriores se han derrumbado, lo que hace que toda la zona parezca más desierta y malévola. Quien intenta entrar por cualquier vía que no sea la puerta principal es rechazado por vientos, rayos y, por último, estallidos de llamas.\nEn su interior reside la mayor concentración de poder vampírico desde Cartago... y algo aún más peligroso."
  POD_travel_events.11.a: "Donde murió la Golconda y comenzó el Infierno."
      
  POD_travel_events.12.t: "Viena, la casa que Etrius construyó"
  POD_travel_events.12.desc: "Creada después de que Etrius expresara sus serias reservas sobre transformar la Casa Tremere en un clan de vampiros demasiado deprisa, Viena se convirtió pronto en la morada más segura de la facción conservadora del Clan.\nEncaramada a un promontorio escarpado varias millas al norte de la ciudad, la capilla de Viena parece un pabellón de caza grande e imponente. Sus muros están hechos de enormes bloques de piedra gris, extraídos de la Tierra por la magia de Etrius. Enormes vigas hacen de pilares y travesaños en toda la estructura. Cada cámara es grandiosa y sobredimensionada. Una extensa red de cámaras en desuso cruza la colina sobre la que se alza el edificio. Etrius las construyó para dejar espacio a futuras ampliaciones sin despertar atención no deseada.\nLos laboratorios de Viena son grandes y están bien surtidos, y la biblioteca es la mejor de que disponen los Tremere fuera de Ceoris. Las zonas comunes son a la vez suntuosas y sombrías. Los pesados muebles de madera están tapizados de terciopelo bordado en oro. Un incienso de dulzura abrumadora flota desde numerosos incensarios de cobre. Los tapices representan a Tremere, Etrius y Goratrix mirando con desaprobación a los ocupantes de la sala, mientras que enormes cornamentas de ciervo, cabezas de jabalí y otros trofeos aparecen por todo el edificio.\nViena carece de las elaboradas medidas de protección de Ceoris, pero el suelo sigue sembrado de ingeniosas trampas."
  POD_travel_events.12.a: "El plan de reserva de los Usurpadores."
  POD_travel_events.12.b: "Un oasis de calma lejos de nuestros enemigos."
      
  POD_travel_danger_events.13.success: "¡Son derrotados!"
  POD_travel_danger_events.13.wound: "Una victoria difícil."
  POD_travel_danger_events.13.failure: "Escapada costosa..."
  POD_travel_events.13.t: "$travel_danger_prefix$ ¡Emboscada de hombres lobo!"
  POD_travel_events.13.desc: "Los bosques son el dominio de los Lupinos y, a pesar de tus mejores esfuerzos por permanecer sigiloso, esos malditos lobos sobredimensionados lograron rastrear tu olor. Por suerte, estabas preparado para la posibilidad y no te han pillado completamente por sorpresa.\nAun así, son criaturas poderosas, mucho más acostumbradas a una pelea aquí de lo que tú lo estarás jamás. Esto no será fácil."
  POD_travel_events.13.a: "¡Mantén tu posición!"
  POD_travel_events.13.b: "¡Tú, protégeme!"
 
  POD_travel_danger_events.14.success: "¡Te dejan pasar!"
  POD_travel_events.14.t: "$travel_danger_prefix$ Cazadores al acecho"
  POD_travel_events.14.desc: "A pesar de tus mejores esfuerzos por pasar inadvertido durante tus viajes, parece que una banda de cazadores emprendedores ha oído rumores sobre tu convoy. Han bloqueado un puente que tendrás que cruzar para continuar tu viaje, pero, por suerte, no parecen estar del todo seguros de a quién (o a qué) esperar.\nPor eso no te atacan nada más verte, lo que te da la oportunidad de intentar engañarlos y quizá evitar una pelea en el proceso."
  POD_travel_events.14.a: "¡Carga antes de que reaccionen!"
  POD_travel_events.14.b: "Tú, ocúpate de ellos."
  POD_travel_events.14.c: "Somos humildes mercaderes de paso..."
  
  POD_travel_events.15.t: "$travel_danger_prefix$ Profeta loco"
  POD_travel_events.15.desc: "Un individuo desaliñado, claramente no del todo cuerdo, ha empezado a seguir a tu convoy desde hace algún tiempo. Está soltando tonterías sobre la Gehenna, el Apocalipsis, la Ascensión, el Tiempo del Juicio y otras sandeces. Tus mejores esfuerzos por ahuyentarlo han fallado, e incluso recurrir a la violencia solo parece hacer que reaparezca más tarde con aún más pesimismo en su discurso.\nTu caravana está empezando a irritarse por la constante charla sobre el fin del mundo, obligándote a considerar actuar."
  POD_travel_events.15.a: "Háblame a mí en su lugar."
  POD_travel_events.15.b: "Simplemente ignora al loco."
  POD_travel_events.15.c: "¡Yo también tengo mis propias profecías!"
   
  POD_travel_events.16.t: "$travel_danger_prefix$ Pueblo tranquilo"
  POD_travel_events.16.desc: "Desde que entraste en esta región, han llegado a tu caravana rumores sobre un pintoresco pueblecito por el que te hace pasar tu plan de viaje. Los lugareños hablan de abominaciones impías que gobiernan allí la noche y obligan a los aldeanos a rezar para ver llegar el amanecer cuanto antes.\nA medida que te acercas, los rumores se vuelven aún más truculentos y tu séquito te comparte su inquietud. Abogan por un pequeño desvío en lugar de arriesgarse a poner un pie en esta aldea maldita y enfurecer a quienquiera que de verdad gobierne aquí."
  POD_travel_events.16.a: "¡No temo a ninguna historia de fantasmas!"
  POD_travel_events.16.b: "Sí, un desvío. No es que tenga miedo..."
  POD_travel_events.16.c: "¡Siento un espíritu afín!"
   
  POD_travel_events.17.t: "$travel_danger_prefix$ Guerras mortales"
  POD_travel_events.17.desc: "Los despistados mortales están librando una guerra en esta región por una razón insignificante u otra. No es que te importe, pero la devastación traída por los ejércitos en conflicto y el riesgo de tropezar con uno de ellos es una preocupación para tu plan de viaje. Una opción sería simplemente dar un rodeo bastante largo, con la esperanza de evitar cualquier contacto con los mortales enfrentados. También podrías contratar a más guías locales de lo planeado originalmente, ya que serían los más adecuados para encontrar una ruta de viaje alternativa segura.\nLa solución más poco ortodoxa sería unirse a la refriega con tu séquito, una solución que consume tiempo pero que es potencialmente esclarecedora para observar las últimas tácticas de guerra de los mortales."
  POD_travel_events.17.a: "Simplemente evitémoslos."
  POD_travel_events.17.b: "Contrata a más lugareños para acelerar las cosas."
  POD_travel_events.17.c: "¿Una guerra? ¡Dejadme unirme!"
  
  POD_travel_events.18.t: "$travel_event_prefix$ Bajo el disfraz de la noche"
  POD_travel_events.18.desc: "Viajar largas distancias para un vampiro es un asunto miserable ya que el sol resulta ser un disuasivo formidable. Si intentas moverte de día, tendrás que tener algunos alojamientos muy específicos (y sospechosos) para asegurarte de que tu lugar de descanso permanezca perfectamente a prueba de sol y solo pueda ser protegido por aquellos sirvientes menores que realmente pueden soportar la luz del día. Si viajas solo de noche, es probable que atraigas aún más atención no deseada y necesites tener en cuenta el horario de sueño de esos mismos sirvientes diurnos...\nNo hay una solución fácil para ese problema y, como tal, los viajes con un vampiro tienden a ser mucho más largos que sin uno, incluso con la mejor preparación hecha de antemano."
  POD_travel_events.18.a: "Es lo que hay."
  POD_travel_events.18.b: "¡Seguid adelante! ¡Más rápido!"
  
  POD_travel_events.19.t: "$travel_event_prefix$ Al viejo estilo egipcio"
  POD_travel_events.19.desc: "Como momia, has vivido mucho tiempo y has visto (y probablemente incluso dirigido) grandes civilizaciones de la Antigüedad. La pompa y la gloria de aquel mundo pasado contrastan con crudeza con la penumbra de estas «Edades Oscuras». ¿Dónde están los músicos, las procesiones, los oradores que anuncian tus gloriosos títulos mientras recorres la tierra? ¿Y a qué se supone que se parecen esos horribles carruajes? ¡No le llegan ni a la suela del zapato a tu carro de oro!\nDe pronto te entra el capricho de retrasar tu viaje actual hasta que puedas recrear parte de aquella gloria pasada. Una empresa costosa y larga, pero de verdad quieres mostrar a esa gente moderna cómo viaja un auténtico Faraón."
  POD_travel_events.19.a: "¡Traedme mi Hemhemet!"
  POD_travel_events.19.b: "...La nostalgia me ha golpeado fuerte."
  
  POD_travel_events.20.t: "$travel_event_prefix$ Cazadores del pueblo"
  POD_travel_events.20.desc: "Como cazador de todas las cosas horribles que se aprovechan de la humanidad, tu deber tiene que ser un voto secreto. Tus semejantes entrarían en pánico si conocieran el alcance de la amenaza que acecha tras cada esquina. Este secreto a menudo causa algunos problemas, ya que mucha gente te confunde con algún tipo de autoridad clerical y luego descarga sus problemas actuales, a menudo muy mundanos, sobre ti mientras viajas por sus tierras.\nAdministrar justicia es algo que sabes hacer, pero también sería un retraso considerable en tu combate más apremiante (y mucho más importante) contra lo sobrenatural."
  POD_travel_events.20.a: "Escucharé y juzgaré."
  POD_travel_events.20.b: "Los esbirros del Diablo no me esperarán."
  
  POD_travel_events.21.t: "$travel_event_prefix$ Encuentro de los lobos"
  POD_travel_events.21.desc: "Como tradición, se supone que los hombres lobo que viajan pueden encontrar refugio en los Túmulos locales siempre que respeten la autoridad y las costumbres de sus habitantes. También se espera que no se queden por mucho tiempo, ya que los hombres lobo son criaturas territoriales y no les gusta la competencia potencial.\nTus exploradores han notado un Túmulo cercano que podría servir como un refugio amistoso potencial. Retrasaría tu viaje por un tiempo, pero se reflejaría bien en ti y en los tuyos participar en las tradiciones de los Garou con los lugareños."
  POD_travel_events.21.a: "¿Podemos compartir vuestro fuego por un rato?"
  POD_travel_events.21.b: "No hay tiempo para retrasos."
  
  POD_travel_events.22.t: "$travel_event_prefix$ El infierno en tu pueblecito"
  POD_travel_events.22.desc: "Viajar trae oportunidades para los de tu especie y sus siervos. Es una manera de descubrir aldeas pequeñas y aisladas que las diversas autoridades de su país apenas reconocen que existan. Una presa tan fácil de corromper constituye un entretenimiento relajante durante un largo y aburrido viaje. Por supuesto, retrasaría tu viaje un tiempo, pero ¿no merece la pena, al fin y al cabo, la autocomplacencia?"
  POD_travel_events.22.a: "Las delicias que os mostraré..."
 
  ghouled_entourage_option: "Séquito de ghouls"
  ghouled_entourage_option_desc: "Los vampiros necesitan un séquito fuerte y leal durante los viajes, ya que no pueden actuar durante la luz del día. Los ghouls son una buena opción."               
  
  mummies_grandeur_option: "Viajes del Faraón"
  mummies_grandeur_option_desc: "Las momias recuerdan una época en la que eran Faraones y viajaban con un séquito y una grandeza que podría hacer sonrojar a los insignificantes reyes de hoy. A veces, quieren recuperar esa era."
 werewolf_moon_bridge_option: "Puente Lunar"
 werewolf_moon_bridge_option_desc: "Los hombres lobo pueden viajar por los legendarios Puentes Lunares que cruzan la [umbra|E]. En muchos casos, esto es mucho más rápido y seguro que tomar el camino corriente."
  
  
  spread_cults_option: "Extender cultos"
  spread_cults_option_desc: "Viajar te brinda la oportunidad de infiltrar miembros leales de tu culto en las aldeas y pueblos locales por los que pasarás. Esto te retrasará un poco, pero aumentar tu influencia es ciertamente beneficioso."
 
  nosferatu_hajj_option: "El Hajj"
  nosferatu_hajj_option_desc: "El Hajj es un grupo de Nosferatu celosos dentro de los [Glossary('Ashirra','game_concept_ashirra_desc')]. Se ven a sí mismos como los guardianes de los lugares sagrados del Islam y de sus peregrinos."
 werewolf_ragabash_option: "Temporada de locura"
 werewolf_ragabash_option_desc: "#clickable El dueño de cada [duchy|E] que atravieses y que no esté en tu [realm|E] obtendrá [GetModifier('madness_season_modifier').GetNameWithTooltip]. Esto costará 1$POD_energy_gnosis$ por gobernante.#!\n¡La locura, nuestra vieja amiga!"
  
  POD_travel_events.23.t: "Ombos, el ojo de Set"
  POD_travel_events.23.desc: "Desde lejos, Ombos parece montículos de tierra, unas pocas columnas derribadas y fragmentos de muros, nada más. Queda muy poco de lo que fue el centro del culto mortal de Set. Mientras caminas entre las ruinas a la luz de las estrellas, un hombre sale de detrás de una mastaba erosionada. Viste una sencilla túnica negra y lleva la vara de medir de un antiguo sacerdote egipcio. «Bienvenido a la Casa de Set.»\nCaminas por el desierto durante casi una hora hasta que una solitaria puerta de pilono se alza ante ti. «El Gran Set aguarda más allá. Camina todo recto y llegarás hasta Él. Él mismo responderá a tus preguntas.»\nJamás has visto estrellas tan brillantes en un cielo negro iluminado por la luna. Los afloramientos de roca proyectan sombras opacas sobre las arenas plateadas del desierto. Sin embargo, tú no proyectas sombra ni dejas huellas en la arena. Miras una estrella en el horizonte y cuentas hasta mil, tres veces. No se mueve.\n¿Teme el propio tiempo al poderoso Set? No lo sabes, pero quizá pronto lo sepas si sigues caminando hacia el horizonte..."
  POD_travel_events.23.a: "Sutekh triunfante, escucha mi oración."
  POD_travel_events.23.b: "Siento algo o a alguien..."
    
  POD_travel_events.24.t: "Sherwood, guarida de la anarquía"
  POD_travel_events.24.desc: "Un gran bosque de caza real, limitado al oeste por el río Erewash y el bosque de East Derbyshire, Sherwood es el coto de caza favorito de la nobleza tras la invasión normanda. Sin embargo, cobró verdadera relevancia cuando pasó a ser la base del célebre proscrito Robin Leeland.\nAunque los orígenes de este hombre son misteriosos, Robin lleva luchando contra los tiranos desde siempre. Sus rasgos duros y mugrientos estuvieron presentes en varios levantamientos plebeyos: intervino de forma directa en diversas revueltas campesinas contra la nobleza inglesa, fue un defensor especialmente firme de las tendencias anarquistas y a menudo luchó en primera línea en las escaramuzas militares.\nSu «roble mayor», un enorme árbol en el centro del bosque que usa como cobijo, es hoy casi un lugar de peregrinación para aspirantes a luchadores por la libertad que esperan hallar sabiduría bajo la guía de «el Capucha»."
  POD_travel_events.24.a: "¡Abajo los tiranos!"
  POD_travel_events.24.b: "Una vista peculiar."
   
  POD_travel_events.25.t: "La Corte del Amor"
  POD_travel_events.25.desc: "Incluso entre las muchas prestigiosas Cortes del Amor, la Corte de Salianna se considera la más suntuosa. A menudo organizadas en lugares de rico pasado histórico, las «soirées» de Salianna son el sitio donde hay que estar para exhibir destreza intelectual o marcial.\nEl objetivo final de tales exhibiciones es siempre el mismo: entretener a la Reina de París y ganarse su preciado favor.\nDurante el invierno, la Corte adopta un talante más político y se celebra en la propiedad de Salianna, donde los muchos recovecos del dominio favorecen a conspiradores y chismosos en el ejercicio de su oficio. Todo lo que ocurre durante una Corte está regulado por las «Belles Dames sans Merci» (bellas y despiadadas damas), cuatro señoras cortesanas más que dispuestas a destruir la reputación de cualquier Cainita impertinente con unas pocas palabras escogidas.\nLa Corte del Amor de Salianna, aunque menos cruel que la de Isouda, sigue sin ser apta para corazones débiles, y más de un Neonato esperanzado ha sido aplastado por sus misericordiosos (y a menudo tácitos) juegos de poder."
  POD_travel_events.25.a: "¡Necesito emular esto!"
 
  POD_travel_events.26.t: "El santuario de Telyavel"
  POD_travel_events.26.desc: "Telyavel es el Guardián de los Muertos, pero también el dios herrero conocido como el Hacedor de las Cosas. La creencia popular lituana sostenía que un herrero trabajaba con los elementos básicos de la propia creación (aire, fuego, agua y tierra) y los moldeaba a su antojo, de modo que ser herrero no era solo una forma de honrar a los dioses, sino una forma de saber, de manera limitada, qué se sentía al ser uno de ellos. Telyavel reencarna las almas de los muertos y las usa como materia prima para crear las hojas metálicas de la Arboleda de las Sombras.\n Para ello, un alma aparecería sobre su yunque con forma de persona diminuta (un homúnculo). Telyavel agarraría el alma con las tenazas y la sumergiría en el fuego. El homúnculo gritaría de dolor, pero cuando el herrero retirara las tenazas de las llamas, sostendría ya una pieza de metal candente lista para ser moldeada. El herrero pondría el metal en el yunque y lo martillearía mientras sangre humeante brotaría a chorros con cada martillazo, correría por los surcos y caería por un orificio inferior, llenando un vasto mar de sangre cercano. Al final de todo el proceso, surgiría una hoja metálica perfecta que el viento llevaría hasta la Arboleda.\nTelyavel es adorado sobre todo por una Línea de Sangre conocida como los Tremere Telyavos, que protegen con fiereza la Arboleda."
  POD_travel_events.26.a: "Un Dios poderoso y un sitio mágico poderoso."
  POD_travel_events.26.b: "Una vista peculiar."
      
  POD_travel_events.27.t: "El Mausoleo, el corazón muerto de Venecia"
  POD_travel_events.27.desc: "«¿Quieres conocer Venecia, visitante?» Los ojos de tu guía, su voz, se habían vuelto de pronto muy fríos. «Pues escucha bien.»\n «En Venecia, los Nosferatu acechan en las alcantarillas y en los canales, con la esperanza de que los ojos de quienes están sobre ellos no los vean. Los Ventrue llegan con los mercaderes ambulantes y creen que pueden establecer refugios, pero no se quedan mucho, no. Venecia, visitante, pertenece a los Giovanni.»\n «Los Giovanni no tienen rival. Otros Vástagos viven aquí por su tolerancia, o no viven aquí en absoluto. Ningún conflicto abierto perturba la noche veneciana, pues los Giovanni no lo permiten. Son una familia, visitante, además de un clan. Durante siglos han tenido aquí su guarida, en su hogar ancestral, pudriéndose en sus fincas familiares, en las universidades, en los bancos y entre los prestamistas. Conocen los secretos que yacen más allá de la muerte, visitante, ¡pues han construido todo su imperio a lomos de los muertos!»\n «Una noche, una noche terrible, abrirán la puerta a la tierra prohibida y Venecia se convertirá en el mundo, y los Giovanni serán por fin amos de una tierra muerta y yerma.»"
  POD_travel_events.27.a: "Hora de pagar mi tributo a la Familia."
  POD_travel_events.27.b: "Solo rumores... ¿verdad?"
 POD_travel_events.28.t: "Bandidos del puente"
 POD_travel_events.28.desc: "Mientras tú y tu séquito avanzáis, vuestro grupo se detiene de pronto ante un viejo puente de piedra, con el camino bloqueado por una banda de hombres mortales fuertemente armados.\n\nSu líder, un hombre curtido y lleno de cicatrices, da un paso al frente. «¡Salve, viajeros! Este puente nos pertenece a nosotros, los señores de este paso.» Sus compañeros bandidos ríen y asienten, con las manos en las empuñaduras de sus armas. «Aquí se exige peaje. Obedeced y podréis pasar. Negaos y sangraréis todos.»\n\nAunque no son más que mortales, están bastante bien armados y tienen rodeado a tu séquito. Una pelea sería un reto, pero no imposible."
 POD_travel_events.28.a: "Toma la moneda y atragántate con ella."
 POD_travel_events.28.b: "Os apartaréis. Ahora."
 POD_travel_events.28.c: "¡Habéis elegido a quienes no debíais robar!"
 POD_travel_events.28.d: "Hay otros modos de rodear..."
 POD_travel_danger_events.28.success: "¡El contraataque es eficaz!"
 POD_travel_danger_events.28.failure: "¡Os hacen retroceder!"
 POD_travel_events.29.t: "El amo oculto"
 POD_travel_events.29.desc: "Mientras viajas, cada vez resulta más evidente que tu séquito ha entrado sin saberlo en las tierras de una criatura muy territorial y reservada. Todo llega a un punto crítico cuando una coterie de Vástagos pequeños pero experimentados te corta el paso, con unas decenas de mortales harapientos detrás. Están claramente listos para intentar echarte.\n\n«¡Invadís el dominio de nuestro amo!», sisea su líder. «O sois necios o muy valientes por andar por estas tierras sin presentaros ante él. Explicaos, o os estacaremos y os dejaremos al sol.»\n\nEsta coterie tiene la ventaja del terreno y del número, pero parece dispuesta a escucharte."
 POD_travel_events.29.a: "¿Complacerá a vuestro amo este regalo de oro?"
 POD_travel_events.29.b: "¡¿Os atrevéis a amenazarme?!"
 POD_travel_events.29.c: "¡Es hora de que desaparezcamos!"
 POD_travel_danger_events.29.success: "¡Huyen!"
 POD_travel_danger_events.29.failure: "¡La coterie se defiende!"
 POD_coterie_escort_modifier: "Escoltado por una coterie"
 POD_coterie_escort_modifier_desc: "Pagar el peaje te ha granjeado la ayuda de esta coterie local."
 POD_harass_coterie_modifier: "Hostigado por una coterie"
 POD_harass_coterie_modifier_desc: "¡Una coterie de vampiros a los que has enfurecido te acosa a cada paso!"
 POD_travel_events.30.t: "Un campo de batalla sembrado de trampas" #This title doesn't seems to show up in-game? Cannot figure out why - Typhon
 POD_travel_events.30.desc: "Tu camino te lleva a ti y a tu séquito hacia un campo lleno de cadáveres en putrefacción, armas y armaduras rotas y tierra veteada de sangre vieja. Las secuelas de una reciente escaramuza entre partidas de mortales.\n\nQuizá los muertos ya no puedan hacer daño con sus armas maltrechas, pero la tierra aún esconde algunos peligros. El ejército en retirada ha esparcido, al parecer, cientos de abrojos afilados y ha ocultado hoyos profundos para disuadir cualquier persecución.\n\nUn caballo de tu grupo ya ha sido herido con un clavo en el casco. Si quieres cruzar este lugar traicionero, debes ir muy despacio y con mucho cuidado, o pensar en otro modo."
 POD_travel_events.30.a: "Debemos despejar un camino antes de que todos nuestros caballos queden tullidos."
 POD_travel_events.30.b: "¡Pasemos sin más, no podemos retrasar nuestro viaje!"
 POD_travel_events.30.c: "Tiene que haber un patrón en estas trampas."
 POD_travel_danger_events.30.success: "¡Cruzas el campo sin percance!"
 POD_travel_danger_events.30.failure: "¡Las trampas te tullen a ti y a tus monturas!"
 POD_clear_path_modifier: "Un camino despejado"
 POD_clear_path_modifier_desc: "Has cruzado sin percance un campo de batalla sembrado de trampas."
 POD_delay_path_modifier: "Un camino agónico"
 POD_delay_path_modifier_desc: "No lograste cruzar un campo lleno de trampas, y muchas monturas resultaron heridas."
 POD_travel_events.31.t: "Luz del cielo"
 POD_travel_events.31.desc: "El amanecer, que se acerca deprisa, te obliga a refugiarte en el primer sitio que encuentres. Por desgracia, la única opción parece ser las ruinas de un viejo edificio.\n\nEl tejado ha desaparecido casi por completo, el suelo cruje con fuerza a cada paso y las plantas inferiores están totalmente inundadas. No parece haber lugar alguno en esta cáscara vacía de edificio que ofrezca a ti y a tu séquito protección frente al sol. El cielo ya empieza a proyectar un resplandor dorado..."
 POD_travel_events.31.a: "No queda más remedio que correr de aquí para allá reuniendo madera y piedra..."
 POD_travel_events.31.b: "Con lo que tengo a mano, quizá pueda construir algo que dure la noche."
 POD_travel_events.31.c: "¡Busca el rincón más oscuro y reza para que funcione!"
 POD_travel_danger_events.31.success: "Eres un buen arquitecto"
 POD_travel_danger_events.31.failure: "Eres un pésimo arquitecto"
 POD_travel_events.32.t: "Público cautivo"
 POD_travel_events.32.desc: "Aunque los caminos nocturnos suelen ser tranquilos y calmados, esta noche una figura extraña ha interrumpido tu camino. Un Toreador vestido con lujo y su exasperantemente lento séquito de cortesanos mortales se han topado contigo. Encantado con este encuentro inesperado en los caminos silenciosos, el hombre ha insistido en que detengas tu viaje y os intercambiéis chismes.\n\nDurante horas lo has oído hablar y hablar de toda clase de historias, desde simples cotilleos sobre de quién está enamorado uno de sus seguidores hasta lo que se rumorea que hacen en secreto ciertos reyes mortales.\n\nTodo es sencillamente tedioso.\n\nSe escurren horas preciosas, horas que podrías haber pasado en el camino, todo para entretener a este vanidoso señor que celebra corte al borde de un camino de tierra."
 POD_travel_events.32.a: "Si me permitís interrumpir..."
 POD_travel_events.32.b: "¡Estoy harto de esto!"
 POD_travel_events.32.success: "Demuestras tener una lengua de plata"
 POD_travel_events.32.failure: "Demuestras ser bastante torpe"
 POD_failed_convo_modifier: "Conversador fallido"
 POD_failed_convo_modifier_desc: "Los rumores dicen que eres una persona completamente grosera, ruda e incivilizada."
 POD_travel_events.33.t: "Cierre inesperado"
 POD_travel_events.33.desc: "Frunces el ceño con fastidio al llegar a un punto vital de tu ruta y ver que las puertas del asentamiento han sido cerradas y que el lugar está plagado de soldados armados. Al parecer, los mortales han impuesto un toque de queda inesperado. Un giro muy inesperado y desafortunado para tu grupo.\n\nPodrías esperar a que se abran de nuevo las puertas o pasar por el tedioso proceso de buscar otra ruta, pero eso llevará tiempo. Podrías intentar colarte, pero eso entraña sus propios peligros."
 POD_travel_events.33.a: "Nos colaremos sin más..."
 POD_travel_events.33.b: "Hace falta un camino alternativo."
 POD_travel_events.33.success: "Pasas inadvertido"
 POD_travel_events.33.failure: "Te descubren"
 travel_danger_events.7000.h: "Puedo arreglar esto..."
 travel_danger_events.7000.h_tt: "Curas a [snake_victim.GetFirstName] con Obeah."
 travel_danger_events.1011.d: "Puedo curar estas heridas..."
 travel_danger_events.1011.d_tt: "Curas a [frostbite_victim.GetFirstName] con Obeah."
 travel_danger_events.4010.f: "Puedo purgar esta enfermedad..."
 travel_danger_events.4010.f_tt: "Curas a [ill_character.GetFirstName] con Obeah."
