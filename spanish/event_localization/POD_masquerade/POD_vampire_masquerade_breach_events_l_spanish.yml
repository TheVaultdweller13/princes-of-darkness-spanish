l_spanish:
 POD_vampire_masquerade_breach.100.title: "Violación de la Mascarada"
 POD_vampire_masquerade_breach.100.desc: "[mortal.GetTitledFirstName] te vio violar el Silencio de la Sangre, revelándote como un vampiro. La [the_masquerade|E] ha sido vulnerada. ¿Qué se hará con [mortal.GetHerHim]?"
 POD_vampire_masquerade_breach.100.a: "Hacer que lo olvide."
 POD_vampire_masquerade_breach.100.b: "Ignorarlo por ahora."
 POD_vampire_masquerade_breach.100.c: "Sobornarlo para que no diga nada."
 POD_vampire_masquerade_breach.100.d: "Matarlo."
 POD_vampire_masquerade_breach.100.e: "Drenar la sangre de [mortal.GetTitledFirstName], matándolo."
 POD_vampire_masquerade_breach.100.d.tt.beast: "#beast La presa ha olido al depredador; ataca ahora, no sea que te conviertas tú mismo en presa.#!"
 POD_vampire_masquerade_breach.100.e.tt.beast: "#beast ¡Dos pájaros de un tiro!#!" 
 POD_vampire_masquerade_breach.100.d.notwounded: "Vences al insignificante mortal sin un rasguño"
 POD_vampire_masquerade_breach.100.d.wounded: "El mortal resulta ser.... problemático"
 POD_vampire_masquerade_breach.100.d.woundedtoast: "Antes de caer, [mortal.GetTitledFirstName] logró herirte."
 POD_vampire_masquerade_breach.100.d.woundedtoastitle: "Herido"

 POD_vampire_masquerade_breach.300.title: "Violación de la Mascarada"       
 POD_vampire_masquerade_breach.300.desc: "[mortal.GetTitledFirstName] vio a [vampire_exposes_masquerade.GetTitledFirstName] violar el Silencio de la Sangre, revelando a [vampire_exposes_masquerade.GetFirstName] como un vampiro. La [the_masquerade|E] ha sido vulnerada. ¿Qué se hará con [mortal.GetFirstName]?"
 POD_vampire_masquerade_breach.300.a: "Hacer que [mortal.GetTitledFirstName] lo olvide."
 POD_vampire_masquerade_breach.300.b: "Ignorar a [mortal.GetTitledFirstName] por ahora."
 POD_vampire_masquerade_breach.300.c: "Sobornar a [mortal.GetTitledFirstName] para que no diga nada."
 POD_vampire_masquerade_breach.300.d: "Matar a [mortal.GetTitledFirstName]."
 
 POD_vampire_masquerade_breach.400.title: "Violación de la Mascarada"
 POD_vampire_masquerade_breach.400.desc: "[vampire_exposes_masquerade.GetTitledFirstName] ha violado el Silencio de la Sangre, revelándose como un vampiro. La [the_masquerade|E] ha sido vulnerada. ¿Qué se hará con [vampire_exposes_masquerade.GetFirstName]?"
 POD_vampire_masquerade_breach.400.a: "Perdonar a [vampire_exposes_masquerade.GetTitledFirstName] a cambio de un favor."
 POD_vampire_masquerade_breach.400.b: "Perdonar a [vampire_exposes_masquerade.GetTitledFirstName]."
 POD_vampire_masquerade_breach.400.c: "Ordenar a mis esbirros que arresten a [vampire_exposes_masquerade.GetTitledFirstName]."
 POD_vampire_masquerade_breach.400.d: "Esto no será perdonado ni olvidado, [vampire_exposes_masquerade.GetTitledFirstName]."
 POD_vampire_masquerade_breach.400.e: "No tenemos nada que temer del ganado"
 POD_vampire_masquerade_breach.400.c.Arrest: "[vampire_exposes_masquerade.GetTitledFirstName] es llevado a mi mazmorra encadenado."
 POD_vampire_masquerade_breach.400.c.ArrestNotificationtitle: "Violación contenida"
 POD_vampire_masquerade_breach.400.c.ArrestNotification: "[vampire_exposes_masquerade.GetTitledFirstName] ha sido encarcelado."
 POD_vampire_masquerade_breach.400.c.Escape: "[vampire_exposes_masquerade.GetTitledFirstName] evade la captura."
 POD_vampire_masquerade_breach.400.c.EscapeNotificationtitle: "¡[vampire_exposes_masquerade.GetTitledFirstName] escapó!"
 POD_vampire_masquerade_breach.400.c.EscapeNotification: "Tus esbirros no lograron traer a [vampire_exposes_masquerade.GetTitledFirstName]. [AddTextIf( PlayerHasBeast, '#beast Alfeñiques.#!' )]"

 POD_opinion_breached_masquerade: "Violó la Mascarada"
 POD_masquerade_breach: "Violación de la Mascarada"
 POD_masquerade_breach_desc: "Un vampiro violó el Silencio de la Sangre. La [the_masquerade|E] ha sido vulnerada."
 
 trait_POD_knows_too_much: "Sabe demasiado"
 trait_POD_knows_too_much_desc: "Este mortal ha sido testigo de un atisbo de lo sobrenatural y ha sobrevivido... por ahora."
