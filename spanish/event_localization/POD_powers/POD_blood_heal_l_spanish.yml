l_spanish:

 POD_vampire_blood_heal.100.t: "#BLOODRED ¡Curación por sangre!#!"
 POD_vampire_blood_heal.100.desc: "#BLOODRED La sangre puede curar sobrenaturalmente tus heridas, pero corres el riesgo de despertar tu hambre.#!"
 POD_vampire_blood_heal.100.option.a: "Curar mis heridas" 
 POD_vampire_blood_heal.100.option.a.tt.beast: "#BLOODRED Necesitaremos conseguir más sangre.#!"
 POD_vampire_blood_heal.100.option.b: "Curar mi mutilación" 
 POD_vampire_blood_heal.100.option.b.tt.beast: "#BLOODRED Realmente has hecho un desastre.#!"
 POD_vampire_blood_heal.100.option.c: "Regenerar mi ojo perdido"
 POD_vampire_blood_heal.100.option.c.tt.beast: "#BLOODRED ¡Los depredadores tienen dos ojos!#!"   
 POD_vampire_blood_heal.100.option.d: "Reimplantar mi pierna"
 POD_vampire_blood_heal.100.option.d.tt.beast: "#BLOODRED Ahora podremos darles caza.#!"   
 POD_vampire_blood_heal.100.option.e: "No me arriesgaré a aumentar mi hambre, por ahora."  
 POD_vampire_blood_heal.100.option.e.tt.beast: "#BLOODRED Pero lo harás, y pronto. Estaré esperando.#!"  
 POD_vampire_blood_heal.100.option.f: "Curar uno de mis ojos cegados."  
 POD_vampire_blood_heal.100.option.f.tt.beast: "#BLOODRED O simplemente podríamos cazar como un murciélago.#!"   
 POD_vampire_blood_heal.100.option.g: "Curar mis cicatrices."  
 POD_vampire_blood_heal.100.option.g.tt.beast: "#BLOODRED Desperdicio de sangre.#!"
