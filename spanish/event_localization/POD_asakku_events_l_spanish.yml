l_spanish:
 # Opening Event - 0001
 POD_asakku.0001.t: "Lo que siempre ha estado ahí"
 POD_asakku.0001.desc: "Esta noche, en las horas silenciosas previas al alba en Bakú, lejos de Enoc y lejos de los cuidadosos ojos del traidor Yamadanda, aflora algo que has pasado siglos reprimiendo.\n\nLa presencia es paciente. Siempre ha sido paciente. No habla idioma alguno. Solo la conoces por una sutil sensación, pero ahora te empuja hacia el este.\n\nSe llama a sí misma nada. Tú la has llamado de muchas maneras. Esta noche pregunta, una vez más, si piensas seguir fingiendo."
 POD_asakku.0001.a: "Siempre has estado ahí. Dejo de fingir lo contrario."
 POD_asakku.0001.b: "Reprimirla de nuevo."
 POD_asakku_soul_infection_accepted_tt: "La [scheme|E] [GetScheme('POD_asakku_soul_infection_scheme').GetTypeName] está ahora disponible contra los $POD_splat_vampire_plural$ portadores de [GetTrait('vicissitude').GetName(GetNullCharacter)]. Comenzará una nueva [story_cycle|E]."
 POD_asakku_suppressed_tt: "El contenido de esta línea queda desactivado. Los Asakku no volverán a aflorar. Es permanente para esta partida."

 # Backstory Event - 0002
 POD_asakku.0002.t: "El viaje recordado"
 POD_asakku.0002.desc: "Hace años que no piensas en el pozo. No te lo has permitido. El pozo es más antiguo que tu Abrazo. Más antiguo que el Antediluviano Tzimisce que te arrancó de las altas colinas griegas.\n\nEl León Suspirante. Tres viajes por la Tempestad, con el casco del barco crujiendo de almas templadas. El Laberinto entre mundos. El bosque en su corazón, que susurraba con voces humanas. La Corte de los Trece Tronos y el pozo sin fondo en su centro.\n\nTe acercaste. Susurraste en él. Después le dijiste a Yamadanda, el único testigo superviviente, que solo habías hablado contigo mismo. Quizá incluso lo creíste.\n\nLos chatterling que Abrazaste en el viaje de regreso a Enoc aprendieron la Vicisitud más deprisa de lo que cualquier maestro habría podido explicar. En Enoc, tras una indiscreción de más, se envió una falange para disciplinarte. Encontraron cosas con la forma del ganado y de los Vástagos que habías traído, con rostros casi reconocibles pero no del todo. Aullaban un nombre mientras la falange los quemaba. No lo has pronunciado en mil años.\n\nYamadanda se fue hace siglos, pero sus aprendices Elioud permanecen. Los cazadores que desolló y reconstruyó. Hallarán también este lugar, con el tiempo, y la batalla empezará de nuevo."
 POD_asakku.0002.a: "El recuerdo es más antiguo que el cuerpo que lo porta."

 # Depth 25 Threshold - 0010
 POD_asakku.0010.t: "La voz se hace más fuerte"
 POD_asakku.0010.desc: "Esta noche algo cambia. No en el mundo, sino en ti. La voz siempre había sido una voz. Ahora es una presencia, con peso, y ha dejado de fingir que es una invitada en tu casa.\n\nDescubres el espejo que tus sirvientes dejan velado por vieja cortesía, porque quieres saberlo. Ves tu rostro. Y ves también algo tras él, que te devuelve la mirada a través de tus ojos igual que tú miras por ellos. Siglos aprendiendo a mirar más allá no te han preparado.\n\nLo que cabalga en tu sangre no es un intruso: lleva aquí más tiempo que cualquier fe que hayas vestido, más que las cortesías que ofreciste a cualquier sacerdote o visir que te las pidió. Es el inquilino original. Tú eres el huésped que tomó la casa por suya.\n\nLa fe que vestías, el cortés sincretismo, se desprende sin ceremonia. Hace tiempo que sabes hacia dónde rezas en realidad. Esta noche las palabras se forman solas.\n\nEn Bakú, lejos de nadie que marque el momento, ya no eres un vampiro con una condición inusual. Eres un Asakku. Quizá solo un puñado de seres comprenderían la distinción, y quienes la comprendan intentarían acabar contigo en el acto."
 POD_asakku.0010.a: "Ya no hay manera de mirar más allá."
 POD_asakku_depth_25_tt: "Eres Asakku. La entidad ha echado raíces. Tu fe pasa al Camino Corrupto."

 # Depth 50 Threshold - 0011
 POD_asakku.0011.t: "La voz tiene opiniones"
 POD_asakku.0011.desc: "Ahora la voz tiene opiniones. Quiere que se cultiven cosas. Que se siembren cosas. Has empezado a entender que, cuando dice «el jardín», no se refiere a flores.\n\nTampoco da sermones. Colabora. Los pensamientos que te llegan a la cabeza sobre la disposición de los vasallos, sobre a qué rival dejar acercarse y a cuál cortar antes de que madure, sobre el lento moldeado de tu tierra hasta convertirla en algo cada vez menos parecido al resto del mundo. No siempre sabes si esos pensamientos nacen de ti.\n\nLa Vicisitud de tu sangre también se ha aclarado. Te llegan formas que ningún maestro ofreció jamás. La disciplina ya no es una disciplina. Es el modo en que la entidad te mueve, como se mueve una lengua en una boca.\n\nY hay algo más nuevo que el resto, más difícil de describir. Una manera de ser invisible. No la Ofuscación de otros $pod_clans$. Algo más callado. La presencia interior te enseña, sin enseñar, cómo escurrirte de la atención incluso de quienes saben exactamente dónde mirar. Las agujas de Yamadanda, sospechas, no te hallarían ahora.\n\nLos cazadores [GetTrait('POD_asakku_elioud hunters').GetName(GetNullCharacter)] lo sabrán, sin embargo. También ellos son pacientes. No escaparás a su atención para siempre."
 POD_asakku.0011.a: "Muéstrame qué plantar."
 POD_asakku_depth_50_tt: "Tu dominio se profundiza. Ahora puedes sembrar la tierra con la Mácula de la Vicisitud."

 # Depth 75 Threshold - 0012
 POD_asakku.0012.t: "Cuáles son tus pensamientos"
 POD_asakku.0012.desc: "Ya no estás seguro de cuáles de tus pensamientos son tuyos. Lo que te sorprende es que los pensamientos de la voz no son tan distintos de los tuyos, quizá más antiguos. Más fríos. Pero reconociblemente emparentados. ¿Es una fusión o los Asakku se están apoderando de tu antiguo yo? No sabrías decirlo, o quizá no quieres.\n\nEl coro que llevas dentro ya no cesa. Ni en la soledad, ni en el ritual, ni en lo que entre los muertos pasa por sueño. Hay un murmullo constante de voces e imágenes imposibles que corren justo detrás de la superficie de tu atención, no tuyas, no del todo, ya no, y cualquier mente que se adentre en la tuya para escrutar o manipular no encuentra silencio, sino el muro del ruido.\n\nA través de la sangre que has plantado, ahora puedes escuchar. Quien porta tu infección porta también un hilo del que puedes tirar. Un vasallo de tu propia corte. Un $pod_cainite$ a tres principados de distancia. Cuando la entidad quiere que oigas lo que pasa por su salón, lo oyes. Sabes cosas que ningún espía podría contarte.\n\nEn Enoc, el Trono de Basalto registra un temblor. La Del'Roh ya lo ha sentido antes. Una vez, hace mucho, cuando la misma línea de corrupción regresó de un viaje negro. Se convocará a los Serafines. Se nombrará un nuevo [GetTrait('POD_asakku_elioud').GetName(GetNullCharacter)] por la mañana, o quizá esta noche, según lo paciente que decida ser la Del'Roh.\n\nLo oirás por la sangre, con el tiempo. La voz no se sorprende. La guerra se acerca, como siempre debió ocurrir."
 POD_asakku.0012.a: "Somos parientes."
 POD_asakku_depth_75_tt: "Tu conexión con los Asakku se profundiza. Los Susurros del Alma pasan a estar disponibles. La Del'Roh se percata."

 # Depth 100 Capstone - 0013
 POD_asakku.0013.t: "Iryi Ascendente"
 POD_asakku.0013.desc: "Ya no hay frontera. A decir verdad, la distinción siempre fue artificial. Un consuelo de los siglos en que necesitabas creer que seguías siendo solo un vampiro. No lo eres. Eres algo más antiguo, con una forma que antes era enteramente tuya.\n\nLos corrompidos que volvieron contigo en el León Suspirante aullaban un nombre mientras ardían. No lo has pronunciado en mil años. Esta noche lo dices sin pestañear, y el decirlo es también la respuesta. Aretstikapha. El Vigilante cuya disciplina se convirtió en Vicisitud cuando fue robada de los Qlifot antes del Diluvio. La voz siempre fue el Vigilante, y el Vigilante siempre fue la voz que habías fingido que era una herencia desafortunada.\n\nPiensas en los altos pastos sobre el templo, en el rito que te tomó, en el Sire que te Abrazó y en el Consejo ante el que rendías cuentas. Piensas en el primer sirviente del viaje cuyo rostro se desgarró gritando el nombre. Solo hay uno de vosotros. Siempre lo hubo.\n\nLo que queda es el resto del mundo. La Mano aún da caza a tu linaje. Los [GetTrait('POD_asakku_elioud').GetName(GetNullCharacter)] aún afilan sus agujas. La Del'Roh aún ocupa el Trono de Basalto y decide cuáles de las cosas de la oscuridad permitir y cuáles extinguir. El Vigilante que llevas dentro las contempla con desprecio, y tú también.\n\nIryi en Ascenso. El Diluvio no terminó la obra. Pero hay tiempo."
 POD_asakku.0013.a: "Soy aquello en lo que me he convertido."
 POD_asakku.0013.b: "Por fin pronuncio el nombre. Aretstikapha."
 POD_asakku_depth_100_tt: "La fusión está completa. Eres Iryi en Ascenso."
