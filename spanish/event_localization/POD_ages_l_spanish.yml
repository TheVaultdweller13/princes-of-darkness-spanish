l_spanish:
 # Localización temporal de la wiki, para disminuir la necesidad de Karde.
 POD_age.1.t: "Edad de la Belleza"
 POD_age.1.desc: "Los $pod_kueijin$ se refieren a esta era como la Segunda Edad del Gran Ciclo o la Edad de la Belleza, cuando el Reino Medio y las Cortes Espirituales aún estaban cerca. Marca la separación de los Mundos Yin y Yang del Reino Medio, que portaba elementos de ambos. Es también la era que pone en marcha el Gran Ciclo. Durante esta Edad, nacieron el Dragón de Ébano y la Reina Escarlata, y su interacción y oposición fomentaron el giro del Ciclo, fusionando la materia y la esencia espiritual por igual. Poco después, el Dragón de Ébano y la Reina Escarlata aprendieron a respirar, y mientras respiraban, las Diez Mil Cosas de la materia y el espíritu comenzaron a tomar forma. Donde respiraba el Dragón, aparecían espíritus y propiedades del Yin; donde respiraba la Reina, tomaban forma espíritus y propiedades del Yang. Pronto, los mundos de la materia y el espíritu cobraron existencia.\nDioses y dragones caminaron por el joven y vibrante mundo, y para ellos el Cielo ordenó deberes y posiciones en las Cortes Espirituales.\nSin embargo, a medida que los seres celestiales gravitaban hacia sus reinos específicos, algunos escaparon al aviso y la tutela del Dragón y la Reina. Estos seres, privados de una instrucción adecuada, descuidaron sus deberes y no rindieron obediencia a la voluntad del Cielo. Ciertas criaturas se opusieron dualísticamente a otras, mientras que otras combinaron el Yin y el Yang en un desequilibrio malsano. Así nacieron también los demonios y los monstruos, ávidos devoradores de Chi."
 POD_age.1.a: "Un tiempo de nacimiento"
 #
 POD_age.2.t: "Edad de las Leyendas"
 POD_age.2.desc: "Los $pod_kueijin$, Hsien y Hengeyokai hablan de la Tercera Edad como la Tercera Edad del Gran Ciclo, la Edad de las Leyendas. Fue la prehistoria mítica del Reino Medio, cuando los [Glossary('Wan Xian','game_concept_kuei_jin_desc')] caminaban entre la humanidad y la gobernaban como maestros benevolentes. Eran los emperadores inmortales, los cazadores de demonios, los dioses que caminaban entre la humanidad y guiaban su progreso. Por orden del Dragón de Ébano, la Reina Escarlata y el mismísimo Augusto Personaje, los Wan Xian purgaron el mundo de los sirvientes de los [Glossary('Yama Kings','podgloss.yamaking')]. Si un espíritu o demonio se volvía rebelde, los Wan Xian podían expulsarlo del Reino Medio y luego informar de la transgresión a su maestro espiritual; si un gobernante mortal se desviaba del camino del Cielo, los Wan Xian podían enderezarlo. A medida que los Wan Xian ganaban en sabiduría y completaban sus tareas, pasaban del mundo para unirse a los dioses, y el Dragón de Ébano y la Reina Escarlata seleccionaban entonces a más Wan Xian para reemplazarlos.\n\nLa Tercera Edad terminó a través de las maquinaciones de los [Glossary('Yama Kings','podgloss.yamaking')], quienes corrompieron a los Wan Xian para que se alimentaran de chi. También marcó el fin de la tradición mítica y el comienzo de la historia tal como la entienden los humanos hoy en día." 
 POD_age.2.a: "Un tiempo de héroes"
 POD_age.2.tt: "Efectos de la Edad:\n$BULLET_WITH_TAB$Cada [akuma|E] obtiene: [GetModifier('akuma_debuff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Cada [Glossary('Yama King','podgloss.yamaking')] obtiene: [GetModifier('yama_debuff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Cada $POD_splat_kueijin$ obtiene: [GetModifier('godbodies_modifier').GetNameWithTooltip]"
 #
 POD_age.3.t: "Edad de la Bella Tristeza"
 POD_age.3.desc: "Los $pod_kueijin$ llaman a esta era la Cuarta Edad del Gran Ciclo o la Edad de la Bella Tristeza. Marca el comienzo de la maldición de los $pod_kueijin$ y su transformación de guerreros del Cielo en criaturas demoníacas originarias de Yomi. El Augusto Personaje apartó su rostro del Reino Medio, de las Cortes Espirituales y del Gran Ciclo por igual. Privados de supervisión, los [Glossary('Yama Kings','podgloss.yamaking')] y sus esbirros demoníacos se filtraron de nuevo en el Reino Medio. Los hengeyokai, enfurecidos más allá de la razón por las depredaciones de los [Glossary('Wan Xian','game_concept_kuei_jin_desc')], cayeron sobre los humanos que tontamente habían seguido a sus maestros inmortales. El Dragón y la Reina, avergonzados, también se apartaron de sus hijos errantes, pero no sin antes dejar los secretos del [Glossary('Dharma','podgloss.dharma')] ocultos en las nubes, el viento, la lluvia y la sangre, para que una noche los [Glossary('Wan Xian','game_concept_kuei_jin_desc')] pudieran redimirse y recuperar su lugar en el Ciclo.\n\nLa historia humana comienza durante este período, y los Kuei-jin remontan su vulnerabilidad a la luz solar a esta época (la dinastía Chou, específicamente). Según los estudiosos, la Cuarta Edad comienza aproximadamente alrededor del 900 a.C. y termina alrededor de 1250-1349 d.C. (según el recuento de los $pod_kueijin$)." 
 POD_age.3.a: "Un tiempo de vergüenza"
 POD_age.3.tt: "Efectos de la Edad:\n$BULLET_WITH_TAB$Cada $POD_splat_kueijin$ obtiene: [GetModifier('godbodies_modifier').GetNameWithTooltip]"
 #
 POD_age.4.t: "Edad de la Oscuridad"
 POD_age.4.desc: "Para los $pod_kueijin$, la Quinta Edad del Gran Ciclo es la Edad de la Oscuridad. Llevados a la locura por el P'o, obligados a reanimar cadáveres y mantenerlos con fuerza vital robada, la mayoría de los $pod_kueijin$ soportan existencias tan miserables como las de sus rivales cainitas. De hecho, para los Muertos Hambrientos, la no-vida es a menudo peor, pues sus luchas personales están superpuestas con una tremenda culpa colectiva.\nLos $pod_kueijin$ deben decidir ahora si deben buscar enderezar el Gran Ciclo, intentar un escape desesperado o sucumbir a su maldición como monstruos. Y su decisión debe tomarse pronto." 
 POD_age.4.a: "Un tiempo de lucha"
 POD_age.4.tt: "Efectos de la Edad:\n$BULLET_WITH_TAB$Cada [akuma|E] obtiene: [GetModifier('akuma_buff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Cada [Glossary('Yama King','podgloss.yamaking')] obtiene: [GetModifier('yama_buff_modifier').GetNameWithTooltip]"
 #
 POD_age.5.t: "Edad del Pesar"
 POD_age.5.desc: "Los $pod_kueijin$ llaman a la Sexta Edad del Gran Ciclo la Edad del Pesar. Es el nadir de la Rueda, donde el [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] desciende de Su trono y uno de los [Glossary('Yama Kings','podgloss.yamaking')] ascenderá para convertirse en el [Glossary('Demon Emperor','podgloss.demonemperor')]. Es el punto más bajo del Ciclo, que muchos Kuei-jin creen que marcará el comienzo de un tiempo de interrupción apocalíptica, cuando los [Glossary('Yama Kings','podgloss.yamaking')] se levantarán y gobernarán entre las naciones. Cuánto durará la Sexta Edad es indeterminado, pero todos están convencidos de que es inminente y será violenta. Sin embargo, la mayoría de los $pod_kueijin$ ven la Edad del Pesar como una parte necesaria de la existencia antes de que la rueda comience un nuevo ciclo, empezando una vez más como un paraíso." 
 POD_age.5.a: "El fin y el principio"
 POD_age.5.tt: "Efectos de la Edad:\n$BULLET_WITH_TAB$Cada [akuma|E] obtiene: [GetModifier('akuma_huge_buff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Cada [Glossary('Yama King','podgloss.yamaking')] obtiene: [GetModifier('yama_huge_buff_modifier').GetNameWithTooltip]"