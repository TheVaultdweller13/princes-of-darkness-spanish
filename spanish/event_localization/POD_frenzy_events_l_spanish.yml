l_spanish:

 POD_vampire_frenzy_events.001.t: "¡Frenesí de hambre!"
 POD_vampire_frenzy_events.001.desc: "La bestia aúlla en tu interior, luchando por ser liberada. La has matado de hambre durante demasiado tiempo, y ahora exige que le entregues las riendas para poder saciarse. La bestia pretende liberarse y encontrar un vasallo del que alimentarse para saciar su insaciable sed de sangre de la fuente más cercana. Su control sobre tu cuerpo aumenta con cada momento que pasa, y los bordes de tu visión se vuelven rojos. Puedes intentar luchar contra la bestia, pero dejarte llevar se sentiría tan bien...... #beast ¿Por qué luchar, cuando ambos sabemos que ganaré?#!"
 POD_vampire_frenzy_events.001.succumb: "Sucumbir al frenesí"
 POD_vampire_frenzy_events.001.succumb.beast: "#beast Déjame mostrarte la verdadera satisfacción.#!"
 POD_vampire_frenzy_events.001.fight: "Luchar contra el frenesí"
 POD_vampire_frenzy_events.001.fight.beast: "#beast Esto no es suficiente. TÚ no eres suficiente.#!"
 POD_vampire_frenzy_events.001.fightwp: "Luchar contra el frenesí con toda tu fuerza de voluntad"
 POD_vampire_frenzy_events.001.fightwp.beast: "#beast Si no es hoy, será mañana.... mejor ríndete ahora, cariño.#!"
 POD_vampire_frenzy_events.kai: "El honor lo es todo"
 POD_vampire_frenzy_events.kai.beast: "#beast Con el tiempo te darás cuenta de que tu sentido del deber está equivocado, entrégate a mí.#!"
 POD_vampire_frenzy_events.001.fight.failed: "La bestia toma el control"
 POD_vampire_frenzy_events.001.desc.instinct: "La bestia aúlla en tu interior, luchando por ser liberada. La has matado de hambre durante demasiado tiempo, y ahora exige que le entregues las riendas para poder saciarse. La bestia pretende liberarse y encontrar un vasallo del que alimentarse para saciar su insaciable sed de sangre de la fuente más cercana. Su control sobre tu cuerpo aumenta con cada momento que pasa, y los bordes de tu visión se vuelven rojos. Puedes sentir la presión detrás de tus ojos, y sabes que es hora de cabalgar la ola y dejar salir a la bestia a jugar. Pero, ¿cómo lo harás?"
 POD_vampire_frenzy_events.001.drain: "Iré a buscar a uno de mis sirvientes mortales y lo drenaré."
 POD_vampire_frenzy_events.001.drain.beast: "#beast Simple y directo. ¡Me gusta!#!"
 POD_vampire_frenzy_events.001.vamp: "Puedo oler la dulce vitae en los otros vástagos de la corte."
 POD_vampire_frenzy_events.001.vamp.beast: "#beast ¿Beber de otro vampiro? ¡Qué exótico!#!"
 POD_vampire_frenzy_events.001.social: "Me alimentaré aquí mismo, ahora mismo. No me importa lo que piense la corte."
 POD_vampire_frenzy_events.001.social.beast: "#beast ¡Escandaloso!#!"
 POD_vampire_frenzy_events.001.breach: "Correré a las calles y me alimentaré de un mortal que pase."
 POD_vampire_frenzy_events.001.breach.beast: "#beast Porque eso siempre sale bien, ¿verdad?#!"
 POD_vampire_frenzy_events.201.t: "Frenesí de hambre: Repercusiones"
 POD_vampire_frenzy_events.201.desc: "Te despiertas en completo éxtasis, incapaz de concentrarte en nada de lo que te rodea. Pasan unos momentos y te das cuenta de que el placer emana del mortal bajo tus colmillos. Te apartas para descubrir a [mortal.GetTitledFirstName], uno de tus sirvientes humanos. Parece que la bestia le atacó usando tu cuerpo.\n[mortal.GetTitledFirstName] no se mueve, y una rápida comprobación demuestra que no le queda sangre. A menos que hagas algo, [mortal.GetTitledFirstName] morirá en tus brazos. #beast Nos sirvió más en la muerte que en la vida.#!"
 POD_vampire_frenzy_events.201.kill: "No hay nada que pueda hacer. [mortal.GetTitledFirstName] morirá."
 POD_vampire_frenzy_events.201.kill.beast: "#beast El mortal cumplió su propósito.#!"  
 POD_vampire_frenzy_events.201.embrace: "Le haré el $pod_Embrace$ para salvar su vida."
 POD_vampire_frenzy_events.201.embrace.beast: "#beast ¿Es su vida lo que estás salvando, o tu conciencia?#!"
 POD_vampire_frenzy_events.301.t: "Frenesí de hambre: Repercusiones"
 POD_vampire_frenzy_events.301.desc: "Lo último que viste antes de caer en el frenesí fue a [bonder.GetTitledFirstName]. Ahora te despiertas en sus aposentos, con sangre goteando de tus colmillos. [bonder.GetTitledFirstName] está ante ti con el ceño fruncido en su rostro ceniciento. Notas que sostiene su mano sangrante. El rastro de sangre conduce a ti, y sientes una punzada de pesar pensando que heriste a [bonder.GetTitledFirstName]. Las nuevas emociones hacia [bonder.GetTitledFirstName] son confusas, pero más aún el hecho de que tu frenesí te llevara a beber de otro vampiro. [bonder.GetTitledFirstName] tampoco parece ansioso por dar explicaciones."
 POD_vampire_frenzy_events.301.a: "Temo que esto vuelva para perseguirme."
 POD_vampire_frenzy_events.301.a.beast: "#beast Tendremos que asegurarnos de que no lo haga.#!"
 POD_vampire_frenzy_events.401.t: "Frenesí de hambre: Repercusiones"
 POD_vampire_frenzy_events.401.desc: "La bestia eligió el peor momento para asomar la cabeza: estabas en medio de una reunión de la corte de suma importancia. Intentas alejarte, pero la bestia se niega a esperar. Terminas lanzándote sobre un sirviente mortal menor de un vampiro cuyo nombre no recuerdas. El mortal sobrevivió y su dueño era demasiado insignificante para exigir una compensación, pero tu corte ahora te ve como alguien débil. Sientes como si hubieras perdido algo de respeto en tu reino."
 POD_vampire_frenzy_events.401.a: "Me aseguraré de tener un mortal a mano en el futuro."
 POD_vampire_frenzy_events.401.a.beast: "#beast No servirá de nada.#!"
 POD_vampire_frenzy_events.501.t: "Frenesí de hambre: Repercusiones"
 POD_vampire_frenzy_events.501.desc: "La bestia eligió el peor momento para asomar la cabeza: estabas en medio de una reunión de la corte de suma importancia. Logras alejarte antes de que la bestia tomara el control, ahorrándote la humillación en la corte. Afuera, la bestia salta sobre el mortal más cercano, haciéndote hundir tus colmillos en su carne. Te despiertas después de que se haya extinguido. Te limpias la sangre de los labios, creyendo que el problema ha terminado. Solo entonces notas al mortal mirándote fijamente."
 POD_vampire_frenzy_events.501.a: "Debo encargarme de esto."
 POD_vampire_frenzy_events.501.a.beast: "#beast Qué adorable es el terror en sus ojos.#!"
 POD_vampire_frenzy_events.401.opinion_malus: "La opinión de tus vasallos sobre ti disminuye."
 
 POD_vampire_frenzy_events.601.t: "¡Frenesí de rabia!"
 POD_vampire_frenzy_events.601.desc.instinct: "Todos los vampiros tienen una [Glossary('Beast','game_concept_beast_desc')] en su interior: una fuerza animal de malicia, rabia y hambre. Cuando los vástagos pierden el control, la bestia los vence, tomando la correa y persiguiendo sus deseos más básicos, ya sean venganza, sangre o seguridad. Los vástagos de tu senda intentan domar a la bestia, cabalgar la ola del frenesí hacia sus objetivos. Usar su poder.\n\nTu bestia ha sido provocada por la rabia que sientes ahora, y está intentando liberarse. Los bordes de tu visión se enrojecen mientras fijas la mirada en lo que te ha contrariado. Tus puños se aprietan dolorosamente mientras intentas mantener la compostura. El momento del frenesí es ahora, pero ¿hacia quién dirigirás tu rabia?"
 POD_vampire_frenzy_events.601.desc: "Todos los vampiros tienen una [Glossary('Beast','game_concept_beast_desc')] en su interior: una fuerza animal de malicia, rabia y hambre. Cuando los vástagos pierden el control, la bestia los vence, tomando la correa y persiguiendo sus deseos más básicos, ya sean venganza, sangre o seguridad. Los vástagos de tu senda intentan luchar contra la bestia, mantenerla encerrada en su interior. Negarle el control.\n\nTu bestia ha sido provocada por la rabia que sientes ahora, y está intentando liberarse. Los bordes de tu visión se enrojecen mientras fijas la mirada en lo que te ha contrariado. Tus puños se aprietan dolorosamente mientras intentas mantener la compostura. Si hay un momento para luchar contra la bestia, es ahora, pero dejar que ella resuelva el problema por ti sería tan fácil..."
 POD_vampire_frenzy_events.601.succumb: "Sucumbir al frenesí"
 POD_vampire_frenzy_events.601.succumb.beast: "#beast Déjame mostrarte la verdadera satisfacción.#!"
 POD_vampire_frenzy_events.601.fight: "Luchar contra el frenesí"
 POD_vampire_frenzy_events.601.fight.beast: "#beast Esto no es suficiente. TÚ no eres suficiente.#!"
 POD_vampire_frenzy_events.601.fightwp: "Luchar contra el frenesí con toda tu fuerza de voluntad"
 POD_vampire_frenzy_events.601.fightwp.beast: "#beast Si no es hoy, será mañana.... mejor ríndete ahora, cariño.#!"
 POD_vampire_frenzy_events.601.troops: "Esos guardias de ahí parecen una buena pelea...."
 POD_vampire_frenzy_events.601.troops.beast: "#beast ¿Qué? ¿Ellos? Al menos elige a alguien que sea un desafío.#!"
 POD_vampire_frenzy_events.601.person: "He estado queriendo pelear con esa persona durante años..."
 POD_vampire_frenzy_events.601.person.beast: "#beast ¿Cuánto tiempo dejarás que te pasen por encima?#!"
 POD_vampire_frenzy_events.601.social: "¡Destrozo cualquier objeto que esté más cerca de mí!"
 POD_vampire_frenzy_events.601.social.beast: "#beast Golpear una pared... Qué original.#!"
 POD_vampire_frenzy_events.601.breach: "¡Mostraré mi ira a los mansos mortales!"
 POD_vampire_frenzy_events.601.breach.beast: "#beast ¡Sí, deja que se acobarden ante nosotros!#!"
 POD_vampire_frenzy_events.601.fight.failed: "La bestia toma el control"
 POD_vampire_frenzy_events.701.desc: "Estabas caminando por el patio cuando uno de tus cortesanos se atrevió a hacer un comentario mezquino sobre tu carácter. Inmediatamente, entraste en frenesí y te lanzaste hacia el cortesano. Por suerte, un regimiento de guardias entrenados y equipados se interpuso entre tú y el pobre cortesano. Estás muy orgulloso de estos hombres de élite: tú mismo los hiciste entrenar, precisamente para tratar con vampiros. Ahora, sin embargo, puede que te arrepientas de haberlos entrenado, ya que utilizan eficazmente tus propias tácticas contra ti.\n\nEres detenido antes de que pudieras causar un daño mayor, pero no saliste ileso y tu reputación tampoco."
 POD_vampire_frenzy_events.701.a: "Frustrado por mis propios hombres."
 POD_vampire_frenzy_events.701.t: "Frenesí de rabia: Repercusiones"
 POD_vampire_frenzy_events.801.t: "Frenesí de rabia: Repercusiones"
 POD_vampire_frenzy_events.801.desc: "Frenesí de rabia: Repercusiones"
 POD_vampire_frenzy_events.801.victorydesc: "Miras a tu vasallo [target.GetTitledFirstName] yaciendo en el suelo dolorido. Recuerdas lo que pasó: [target.GetTitledFirstName] te había estado tratando con desdén últimamente, y estaba empezando a afectar a vuestra relación profesional. Fuiste a sus aposentos privados para confrontar[target.GetHerHim], ¡y se atrevió a acusarte de difamación!\n\nLa escandalosa afirmación te hizo entrar en frenesí, y el resultado yace ante ti. Si lo que pasó sale de esta habitación, el resultado será desastroso. No solo tu vasallo te guardará rencor, sino que todo tu reino ridiculizará tu falta de control.\n\nY sin embargo... Tú y [target.GetTitledFirstName] estáis solos aquí. Todavía es posible asegurar que lo que pasó se quede en esta habitación."
 POD_vampire_frenzy_events.801.lossdesc: "Miras hacia arriba a tu vasallo [target.GetTitledFirstName], sosteniéndote el estómago desgarrado por el dolor. Recuerdas lo que pasó: [target.GetTitledFirstName] te había estado tratando con desdén últimamente, y estaba empezando a afectar a vuestra relación profesional. Fuiste a sus aposentos privados para confrontar[target.GetHerHim], ¡y se atrevió a acusarte de difamación!\n\nLa escandalosa afirmación te hizo entrar en frenesí, y el dolor y la vergüenza resultantes te recorren. Si lo que pasó sale de esta habitación, el resultado será desastroso. No solo tu vasallo te guardará rencor, sino que todo tu reino ridiculizará tu falta de control. ¡Y encima de eso, perdiste!\n\nY sin embargo... Tú y [target.GetTitledFirstName] estáis solos aquí. Todavía es posible asegurar que lo que pasó se quede en esta habitación."
 POD_vampire_frenzy_events.801.kill: "No podrán contárselo a nadie si están muertos...."
 POD_vampire_frenzy_events.801.bribe: "Si promete no contárselo a nadie, le prometeré un favor."
 POD_vampire_frenzy_events.801.leave: "No me quedaré aquí ni un momento más, independientemente de las opiniones de la corte."
 POD_vampire_frenzy_events.901.t: "Frenesí de rabia: Repercusiones"
 POD_vampire_frenzy_events.901.desc: "La fiesta iba bien hasta que dos de tus invitados borrachos decidieron pelearse en medio de la pista de baile. Les ordenas que se detengan, y te ignoran descaradamente. Repites tu orden, más fuerte esta vez. Te desafían todavía. Hirviendo de rabia indignada, te acercas a ellos y les gritas, sin efecto. ¡Qué indignidad!\n\nIntentas separarlos físicamente y tienen la audacia de empujarte. ¡A ti, su legítimo señor! Tu rabia abruma tu razón mientras gritas y golpeas un pilar con la fuerza suficiente para destrozarlo. Todo el mundo te está mirando ahora, y te das cuenta de cómo debe de verse: perdiste los estribos y causaste daños en tu propio castillo. Ya puedes ver algunas miradas de desaprobación."
 POD_vampire_frenzy_events.901.a: "Arreglar esto costará oro."
 POD_vampire_frenzy_events.101.t: "Frenesí de rabia: Repercusiones"
 POD_vampire_frenzy_events.101.desc: "Miras tus manos ensangrentadas, tu boca goteando gotas de $pod_vitae$ sobre tus ropas sucias y desgarradas. Ha sido una noche intensa.... No recuerdas cómo empezó, pero sí recuerdas haber salido a las calles mortales con rabia y haber destruido todo a la vista. Te sentías como un dios: imparable, todopoderoso y aterrador. Los mortales huyen despavoridos, y los pocos que se resistieron cayeron ante tus colmillos.\n\nDejando a un lado las implicaciones morales de tus horribles acciones, has causado un gran revuelo en el mundo mortal. No muchos escaparon, pero los que lo hicieron seguramente difundirán historias sobre tu gran poder y monstruosidad. Asustará a tus súbditos, sin duda, pero también atraerá atención no deseada."
 POD_vampire_frenzy_events.101.a: "Las cosas que puedo hacer si cedo el control...."
 
 POD_vampire_frenzy_events.801.toast: "Has perdido una pelea con [target.GetTitledFirstName]"