 POD_camarilla.1400.title: "Cambiar doctrina"
 POD_camarilla.1400.desc: "Las reuniones del Círculo Interno son el lugar donde se discute la política general de la Camarilla. Los tratos sombríos y los favores con siglos de antigüedad pueden provocar cambios drásticos en la organización de la secta.\n¿Quieres cambiar una doctrina?"
 POD_camarilla.1400.a: "Sí"
 POD_camarilla.1400.b: "No"
 
 POD_camarilla.2001.t: "Ventrue aceptados"
 POD_camarilla.2001.desc: "Has aceptado a los Ventrue en la Camarilla; su representante, [ventrue_justicar_candidate_1.GetFirstNameNoTooltip], te agradece tu apoyo y promete el apoyo eterno de su clan a la secta.\nPalabras bonitas que, al menos, no cuestan mucho decir."
 POD_camarilla.2001.a: "Bienvenido al bando ganador."
 POD_camarilla.2101.t: "Ventrue de la Camarilla"
 POD_camarilla.2101.desc: "Como principal representante de los Ventrue, se te invita a ser el nuevo miembro del [Glossary('Círculo Interno','game_concept_inner_circle_desc')] para tu clan. Un gran honor que te convierte en una de las figuras principales de la secta más poderosa que existe."
 POD_camarilla.2101.a: "Me lo merezco"
 POD_camarilla.2201.t: "Justicar Ventrue"
 POD_camarilla.2201.desc: "Los Ventrue han ganado el derecho de tener un [Glossary('Justicar','game_concept_justicar_desc')]. Tradicionalmente, cada clan miembro de la Camarilla tiene un Justicar que representa la voluntad de su miembro del Círculo Interno. Es lógico que un nuevo clan miembro también tenga acceso a esta posibilidad."
