 POD_camarilla.1220.title: "Voluntad del Círculo Interno"
 POD_camarilla.1220.desc: "#X Al usar una interacción con un personaje del mismo clan que pueda ser un [Glossary('Justicar','game_concept_justicar_desc')], y luego seleccionar la opción de confirmar en este evento, lo convertirás en [Glossary('Justicar','game_concept_justicar_desc')].#!"
