 POD_camarilla.1221.b: "Cambié de opinión."

 POD_camarilla.1301.title: "Lista Roja"
 POD_camarilla.1301.desc: "La Lista Roja es el listado de aquellos Vástagos a quienes la Camarilla desea ver purgados con mayor fervor de la faz de la tierra. Los vampiros en la Lista Roja, conocidos como Anatema, son considerados bajo una Caza de Sangre continua. La Camarilla suele dejar la caza y destrucción de estos Vástagos en manos de los Alastors. Tradicionalmente, contiene 13 nombres.\nLa Lista Roja es más pequeña que 13 en este momento y, por tanto, podrías añadir un nuevo Anatema a tu conveniencia."
 POD_camarilla.1301.a: "[red_list_candidate_1.GetFirstNameNoTooltip]"
