l_spanish:

 PODthorns.0002.t: "La Convención de Thorns"
 PODthorns.0002.desc: "Mientras la Rebelión Anarquista arrecia por todo el mundo $pod_cainite$, ayudada por la aún presente Inquisición, ha ocurrido un evento sin precedentes. Varios Antiguos de diversos Clanes han convocado una reunión de paz y la creación de una nueva organización para la Estirpe.\nEsta organización, la Camarilla, sería una secta inclusiva dedicada a proteger [the_masquerade|E] y las relaciones entre Antiguos y Neonatos. Muchos Vástagos, especialmente entre los Anarquistas, desconfían de esta iniciativa, pero ya es un sorprendente éxito político, ya que representantes de casi toda Europa se están reuniendo para debatir la propuesta.\nEl futuro de la Estirpe podría decidirse en este pequeño pueblo inglés en las próximas noches."
 PODthorns.0002.a: "El cambio se acerca"
 thorn_begins_effect_message: "Cada $pod_clan$ elegirá una postura respecto a esta propuesta. Si eres lo suficientemente fuerte, podrías ser el representante de tu propio $pod_clan$." 
 PODthorns.0003.t: "Thorns: Los Ventrue"
 PODthorns.0003.desc: "Las viejas costumbres son inmortales y, como tales, es el $pod_clan$ Ventrue el que abrirá la Convención. Muchos esperan que los Reyes encuentren la forma de asegurar su liderazgo sobre cualquier nueva secta. Es muy probable que su elección también afecte a sus rivales tradicionales como gobernantes de la noche: los Lasombra y los Tzimisce."
 PODthorns.0003.a: "La Camarilla es el futuro."
 PODthorns.0003.b: "¡Nunca formaremos parte de esta locura!"
 PODthorns.0003.c: "La neutralidad es la clave de nuestra supervivencia."
 choose_camarilla_effect_message: "Te unes a la Camarilla; la mayoría de tu $pod_clan$ te seguirá" 
 choose_opposition_effect_message: "Te opones, uniéndote a los Anarquistas con la mayoría de tu $pod_clan$" 
 choose_independance_effect_message: "Nada cambia para ti o para tu $pod_clan$." 
 PODthorns.0004.t: "Thorns: Ventrue de la Camarilla"
 PODthorns.0004.desc: "En un movimiento no muy sorprendente, los Ventrue se han alineado con la naciente Camarilla, probablemente con la esperanza de tomar las riendas del poder mientras aún pueden. La Convención continúa mientras los demás representantes debaten este movimiento."
 PODthorns.0004.a: "Una victoria para la Camarilla."
 PODthorns.0004.b: "¡Debo unirme a ellos!"
 PODthorns.0005.t: "Thorns: Ventrue de la Oposición"
 PODthorns.0005.desc: "Un giro sorprendente de los acontecimientos en las etapas iniciales de la Convención de Thorns, ya que el representante Ventrue se ha levantado bruscamente de la mesa de negociación, calificando todo el proceso de broma pesada. Parece que el $pod_clan$ Ventrue no participará en la Camarilla y se ha alineado con la oposición Anarquista, quizás con la esperanza de aportar orden al movimiento, que hasta ahora carecía de líderes."
 PODthorns.0005.a: "Una victoria para la Oposición."
 PODthorns.0006.t: "Thorns: Ventrue Neutral"
 PODthorns.0006.desc: "Un giro sorprendente de los acontecimientos en las etapas iniciales de la Convención de Thorns, ya que el representante Ventrue ha anunciado la neutralidad total de su $pod_clan$ para el futuro previsible. ¿Quizás los Ventrue no estaban en posición de reclamar el liderazgo sobre las sectas emergentes? Eso es lo que afirman los audaces negociadores Lasombra y Tzimisce, que ahora huelen la oportunidad de asumir ellos mismos un papel protagonista."
 PODthorns.0006.a: "¿Qué hace que un $pod_clan$ se vuelva neutral?"
 PODthorns.0007.t: "Thorns: Los Lasombra"
 PODthorns.0007.desc: "Mientras el representante Lasombra prepara su declaración, muchos esperan que los Magister estén en el bando opuesto al de los Ventrue. Después de todo, solo puede haber un número limitado de Clanes gobernantes en una secta."
 PODthorns.0008.t: "Thorns: Lasombra de la Camarilla"
 PODthorns.0008.desc: "En un discurso apasionado, el representante Lasombra declara que su $pod_clan$ está totalmente a favor de la naciente Camarilla. Esbozando ya un plan para sus instituciones, aparentemente siguiendo la jerarquía de la Iglesia mortal, muchos esperan que los Magister ocupen el asiento principal de la nueva secta."
 PODthorns.0009.t: "Thorns: Lasombra de la Oposición"
 PODthorns.0009.desc: "Parece que la Camarilla tendrá un poderoso enemigo en forma del $pod_clan$ Lasombra. Su representante ha maldecido la resolución propuesta y se ha marchado de la Convención con prisas. Agrupándose en torno a la causa Anarquista, los Magister ya están preparando un borrador para su propia y nueva secta."
 PODthorns.0010.t: "Thorns: Lasombra Neutral"
 PODthorns.0010.desc: "Parece que el $pod_clan$ Lasombra ha terminado de pretender el trono de gobernantes de la noche. Mientras su representante anuncia su elección de neutralidad, otros ya teorizan que los Magister centrarán ahora sus esfuerzos en asuntos más sombríos y místicos."
 PODthorns.0011.t: "Thorns: Los Brujah"
 PODthorns.0011.desc: "Una gran mayoría del movimiento Anarquista original, los miembros del $pod_clan$ Brujah, siguen bastante divididos sobre cómo abordar la Convención. Algunos lo ven como una rendición humillante, otros como la posibilidad de un tratado de paz honorable. Con una visión tan dividida y apasionada de la negociación, dependerá de su representante ser la voz decisiva."
 PODthorns.0012.t: "Thorns: Brujah de la Camarilla"
 PODthorns.0012.desc: "Finalmente, los Brujah han depuesto sus armas. Ha sido un proceso largo y arduo, pero se ha firmado la paz. El $pod_clan$ es ahora parte integrante de la Camarilla, a pesar de las quejas de sus sectores más radicales."
 PODthorns.0013.t: "Thorns: Brujah de la Oposición"
 PODthorns.0013.desc: "La guerra nunca cambia, y lo mismo ocurre con los Brujah. El rebelde $pod_clan$ se ha negado a dar un paso atrás y firmar un tratado de paz con la naciente Camarilla. La Rebelión Anarquista continúa, pero algunos buscan reformar el dividido movimiento en una secta más cohesiva para continuar mejor la lucha."
 PODthorns.0014.t: "Thorns: Brujah neutral"
 PODthorns.0014.desc: "Pocos habrían podido predecir el desenlace de la negociación por los $pod_clan$ Brujah. En un discurso decidido, su representante se ha limitado a decir que nunca volverán a inclinarse ante otra autoridad. Como tal, los Brujah abandonan la convención tan divididos como entraron en ella."
 PODthorns.0015.t: "Thorns: Los Malkavian"
 PODthorns.0015.desc: "Seamos sinceros. Nadie tiene pistas sobre la postura que tomará el $pod_clan$ Malkavian durante la convención, probablemente ni siquiera su representante. Aun así, por muy peligrosos que sean, no se debe subestimar a los lunáticos, y muchas facciones reunidas aquí intentan cortejarles."
 PODthorns.0016.t: "Espinas: Camarilla Malkavian"
 PODthorns.0016.desc: "El $pod_clan$ Malkav se ha unido a la Camarilla ante el prudente aplauso de los representantes de esta secta. Aunque algunos llamarían a tal ayuda una maldición, la naciente Camarilla parece satisfecha de tener a los peligrosos profetas de su lado."
 PODthorns.0017.t: "Thorns: Oposición Malkavian"
 PODthorns.0017.desc: "Parece que el $pod_clan$ Malkav ha previsto... algo importante sobre la Revuelta Anarquista. Su representante, con una descripción algo lúgubre de un evento apocalíptico, ha unido oficialmente a su $pod_clan$ a la causa de la rebelión. Los Anarquistas, por su parte, están tan sorprendidos como cualquier otro ante este repentino giro de los acontecimientos."
 PODthorns.0018.t: "Thorns: Malkavian neutral"
 PODthorns.0018.desc: "Volviendo a sus raíces como un $pod_clan$ de profetas y consejeros, los Malkavian han declarado su neutralidad en el conflicto actual. Parece que todos tendrán el dudoso placer de lidiar con ellos en el futuro."
 PODthorns.0019.t: "Thorns: Los Toreador"
 PODthorns.0019.desc: "Aunque Michael se ha ido hace mucho, los Toreador siguen siendo un $pod_clan$ poderoso con una sólida base de poder en toda Europa. Como fueron los primeros en proponer la idea de imponer la Mascarada para la Camarilla, probablemente elegirán esta secta, pero su naturaleza apasionada también podría acercarlos a la Revuelta..."
 PODthorns.0020.t: "Espinas: Camarilla Toreador"
 PODthorns.0020.desc: "Como era de esperar, el $pod_clan$ Toreador se ha unido formalmente a la Camarilla; su preocupación por hacer cumplir [the_masquerade|E] ha pesado más que su espíritu apasionado."
 PODthorns.0021.t: "Thorns: Oposición Toreador"
 PODthorns.0021.desc: "La pasión ardiente y la emoción han ganado la partida, ya que el representante de los Toreador pronunció un discurso inspirador alabando la causa Anarquista. Parece que la alianza tradicional de los Toreador con los Clanes gobernantes ha terminado, por ahora."
 PODthorns.0022.t: "Thorns: Toreador neutral"
 PODthorns.0022.desc: "Sorprendiendo a todos, el representante de los Toreador anunció la neutralidad de su $pod_clan$ durante el futuro previsible. ¿Quizás las Rosas se han hartado de la guerra y la rebelión?"
 PODthorns.0023.t: "Thorns: Los Tremere"
 PODthorns.0023.desc: "Los Magii han hecho una entrada explosiva en el mundo de la política de los Vástagos y a muchos no les gustaría otra cosa que verlos aplastados para siempre. Es probable que se unan a la Camarilla, con la esperanza de encontrar refugio en ella, a cambio de poner su poderoso dominio de la Hechicería de Sangre a disposición de la secta."
 PODthorns.0024.t: "Espinas: Camarilla Tremere"
 PODthorns.0024.desc: "Como la mayoría de los asistentes a la convención esperaba, los Tremere han jurado lealtad a la Camarilla. Muchos ya los ven como el verdadero poder tras el trono en esta naciente secta."
 PODthorns.0025.t: "Thorns: Oposición Tremere"
 PODthorns.0025.desc: "Un giro sorprendente de los acontecimientos en la Convención, ya que los Tremere han anunciado su apoyo al Movimiento Anarquista. ¿Es esto un fallo en su pirámide o parte de un conjura mayor?"
 PODthorns.0026.t: "Thorns: Tremere neutral"
 PODthorns.0026.desc: "Parece que los Magos no se inclinarán ante nadie más que ante los suyos, ya que su representante ha anunciado su neutralidad en el conflicto actual. Sin duda, sus servicios como hechiceros mercenarios serán muy solicitados."
 PODthorns.0027.t: "Thorns: Los Tzimisce"
 PODthorns.0027.desc: "Se espera que el poderoso $pod_clan$ de los Demonios del Este tome partido en oposición a sus odiados enemigos Tremere. La neutralidad es también una opción considerada seriamente por muchos de sus miembros más antiguos, ya que la mayoría no se preocupa por el mundo fuera de sus lúgubres castillos."
 PODthorns.0028.t: "Espinas: Camarilla Tzimisce"
 PODthorns.0028.desc: "Aunque el debate fue arduamente disputado, el $pod_clan$ Tzimisce aceptó unirse a la Camarilla. Sin embargo, aún quedan muchos detalles finos por debatir, como [the_masquerade|E] en Transilvania..."
 PODthorns.0029.t: "Thorns: Oposición Tzimisce"
 PODthorns.0029.desc: "La confusión y la ira se palpan en la Convención de Thorns, ya que el representante de los Tzimisce acaba de lanzar una parte desproporcionada de su anatomía contra uno de sus oponentes antes de salir furioso. Parece que los Tzimisce no están contentos con la propuesta de la Camarilla."
 PODthorns.0030.t: "Thorns: Tzimisce neutral"
 PODthorns.0030.desc: "Los miembros más antiguos del $pod_clan$ Tzimisce parecen haber ganado el debate interno, ya que su representante acaba de anunciar la neutralidad de los Demonios en la guerra actual. Muchos han expresado su preocupación por el estado de [the_masquerade|E] en Transilvania ante tal decisión."
 PODthorns.0031.t: "Thorns: Los Gangrel"
 PODthorns.0031.desc: "Los Gangrel ya no pueden negarlo: su mundo se está muriendo. Sin importar su Destreza bajo el cielo nocturno, sus mortales se han dejado llevar por la Cruz o el Creciente. En este entorno que cambia rápidamente, muchos buscan un lugar al que pertenecer. A todas las facciones les encantaría ser ese lugar."
 PODthorns.0032.t: "Espinas: Camarilla Gangrel"
 PODthorns.0032.desc: "El representante de los Gangrel ha aceptado a regañadientes unirse a la Camarilla. Quizás el $pod_clan$ encuentre ahora un nuevo propósito como ejecutores y rastreadores de sangre de esta secta."
 PODthorns.0033.t: "Thorns: Oposición Gangrel"
 PODthorns.0033.desc: "Algunos dirían que los Gangrel han cedido ante su lado feral, ya que han optado por jurar su apoyo a la causa Anarquista, quizás buscando una guerra que valga la pena luchar. En cualquier caso, un beneficio tremendo para los rebeldes."
 PODthorns.0034.t: "Thorns: Gangrel neutral"
 PODthorns.0034.desc: "Los cautos $pod_clan$ Gangrel parecen estar hartos de este extraño y nuevo mundo en el que se han visto arrojados. Al declarar su neutralidad, solo ellos elegirán el próximo objetivo de su interminable caza."
 PODthorns.0035.t: "Thorns: Los Nosferatu"
 PODthorns.0035.desc: "A primera vista, los Nosferatu parecen muy interesados en la idea de la Camarilla. Buscando siempre protección contra los horrores de su progenitor, buscan fuerza en la unión. Sin embargo, con una diplomacia astuta podrían encontrar esa fuerza en otros lugares."
 PODthorns.0036.t: "Thorns: Nosferatu de la Camarilla"
 PODthorns.0036.desc: "No fue una gran sorpresa cuando el representante de los Nosferatu anunció el apoyo total de su $pod_clan$ a la naciente Camarilla. La nueva secta puede contar a partir de ahora con una leal y poderosa red de informantes."
 PODthorns.0037.t: "Thorns: Nosferatu de la oposición"
 PODthorns.0037.desc: "Noticias sorprendentes durante la Convención de Thorns: los Nosferatu se han unido al movimiento Anarquista. Muchos se preguntan si los Ocultos poseen alguna información secreta que ha inclinado la balanza contra la Camarilla..."
 PODthorns.0038.t: "Thorns: Nosferatu neutral"
 PODthorns.0038.desc: "Hicieron falta varias noches para que esto se notara, pero el representante de los Nosferatu ha desaparecido de la Convención. Parece que los Ocultos no participarán en el nacimiento de las sectas."
 PODthorns.0039.t: "Thorns: Los Seguidores de Set"
 PODthorns.0039.desc: "Aunque se les ha invitado oficialmente a unirse a la Camarilla, nadie espera realmente que los hijos de Set acepten. Sus métodos místicos los mantienen muy alejados del marco propuesto para la nueva secta."
 PODthorns.0040.t: "Thorns: Setitas de la Camarilla"
 PODthorns.0040.desc: "Mientras el representante de los Seguidores de Set acepta la propuesta de unirse a la Camarilla ante una audiencia atónita, todos se preguntan ya cuál es el motivo oculto tras esta elección. ¿Se ha aceptado finalmente a la serpiente en el jardín?"
 PODthorns.0041.t: "Thorns: Setitas de la oposición"
 PODthorns.0041.desc: "Parece que la creación de la Camarilla, una autoridad centralizada para los vampiros, ha enfurecido a los Setitas más de lo esperado. Al hablar de la percepción de Set como un «Gran Liberador», su representante ha comprometido al $pod_clan$ con la causa Anarquista."
 PODthorns.0042.t: "Thorns: Setitas neutrales"
 PODthorns.0042.desc: "Rechazando cortésmente la tibia oferta de la Camarilla, el representante de los Setitas ha hecho lo que todos consideraban el resultado más probable: confirmar la neutralidad de su $pod_clan$ en la Contienda actual."
 PODthorns.0043.t: "Thorns: Los Assamita"
 PODthorns.0043.desc: "Mientras la expansión otomana amenaza Europa, la naciente Camarilla está dividida sobre cómo gestionarlo. Los Assamita han estado muy activos a la sombra de los turcos, y la Convención de Thorns será una oportunidad para que ambos bandos intenten, al menos, resolver sus diferencias."
 PODthorns.0044.t: "Thorns: Assamita de la Camarilla"
 PODthorns.0044.desc: "En una sorprendente muestra de diplomacia por ambas facciones, los Assamita y la Camarilla han llegado a un acuerdo trascendental, integrando firmemente a los Hijos de Haqim en la nueva secta. Se abre una nueva era de relaciones entre Oriente y Occidente."
 PODthorns.0045.t: "Thorns: Assamita de la oposición"
 PODthorns.0045.desc: "Las conversaciones entre la Camarilla y los Assamita se han roto. Parece que toda la Convención ha empeorado las cosas, ya que los Hijos de Haqim han prometido su ayuda al movimiento Anarquista, con la esperanza de destrozar el viejo y nuevo orden de los $pod_cainites$ europeos."
 PODthorns.0046.t: "Thorns: Assamita neutral"
 PODthorns.0046.desc: "Mientras el representante de los Assamita abandona la Convención, no ha cambiado mucho. Continúa la tenue neutralidad de los Hijos de Haqim en los asuntos de los $pod_cainites$ occidentales."
 PODthorns.0047.t: "Thorns: El Capadocio"
 PODthorns.0047.desc: "El $pod_clan$ de la Muerte siempre ha estado dividido y ha soportado muchas purgas y reestructuraciones. Aun así, siempre ha sido un $pod_clan$ respetado y, a pesar de sus hábitos reclusivos, ha recibido una invitación formal para unirse a la Camarilla."
 PODthorns.0048.t: "Thorns: Capadocio de la Camarilla"
 PODthorns.0048.desc: "Tras una larga discusión, parece que la Camarilla y el $pod_clan$ de la Muerte han llegado a un acuerdo. La naciente secta tiene un miembro más y ya se felicita por este logro."
 PODthorns.0049.t: "Thorns: Capadocio de la oposición"
 PODthorns.0049.desc: "Aunque nadie está muy seguro de lo que ocurrió exactamente, las conversaciones entre la Camarilla y el $pod_clan$ de la Muerte han resultado ser un fracaso total. Sintiéndose insultados y maltratados, han optado por unir fuerzas con el movimiento Anarquista, que se muestra bastante sorprendido por este apoyo repentino."
 PODthorns.0050.t: "Thorns: Capadocio neutral"
 PODthorns.0050.desc: "Como la mayoría de los presentes en la Convención esperaba, el $pod_clan$ de la Muerte ha declarado su neutralidad en el conflicto actual. Seguirán siendo el mismo grupo misterioso y recluso de eruditos que siempre han sido."
 PODthorns.0051.t: "Thorns: Los Salubri"
 PODthorns.0051.desc: "A pesar de sus muchos enemigos, los Salubri siguen siendo una fuerza a tener en cuenta. Han sobrevivido hasta esta noche y obviamente fueron invitados a la Convención. La mayoría espera que tomen el bando opuesto al odiado $pod_clan$ Tremere, pero la neutralidad también es una posibilidad sólida, ya que la guerra interminable ya les ha costado caro."
 PODthorns.0052.t: "Thorns: Salubri de la Camarilla"
 PODthorns.0052.desc: "La Camarilla se felicita a sí misma mientras los Salubri se unen oficialmente a ella. Ya se han comprometido a ayudar a frenar la campaña de desinformación que circula sobre sus nuevos aliados y a devolverles su verdadero lugar como el $pod_clan$ de los Sanadores."
 PODthorns.0053.t: "Thorns: Salubri de la oposición"
 PODthorns.0053.desc: "La retribución es el nombre del momento para el $pod_clan$ Salubri. Quieren venganza por todos los horrores que soportaron y han encontrado nuevos aliados en el movimiento Anarquista. Quizás su sufrimiento común los ha unido."
 PODthorns.0054.t: "Thorns: Salubri neutrales"
 PODthorns.0054.desc: "Su lucha por la supervivencia ha costado mucho a los $pod_clan$ Salubri. Es hora de que sanen, tanto el alma como el cuerpo. Con estas palabras, su representante confirma la neutralidad del $pod_clan$ en la crisis actual."
 PODthorns.0055.t: "Thorns: Los Ravnos"
 PODthorns.0055.desc: "Los Ravnos siempre han sido forasteros para los $pod_cainites$ occidentales, pero esta situación está cambiando rápidamente a medida que el $pod_clan$ indio está cada vez más presente en Europa. Como guiño a esta nueva fuerza, han sido invitados a la Convención, aunque la mayoría piensa que mantendrán una cautelosa neutralidad en la guerra actual."
 PODthorns.0056.t: "Thorns: Ravnos de la Camarilla"
 PODthorns.0056.desc: "En un giro trascendental de los acontecimientos, los Ravnos están realizando su movimiento más crucial en Europa hasta la fecha: han decidido unirse a la naciente Camarilla. La secta siente un optimismo cauteloso ante el anuncio de esta alianza."
 PODthorns.0057.t: "Thorns: Ravnos de la Oposición"
 PODthorns.0057.desc: "Para sorpresa de todos, los $pod_clan$ Ravnos se han puesto del lado del Movimiento Anarquista. ¿Es esa consecuencia del mal trato que recibieron de los Príncipes occidentales cuando llegaron por primera vez a Europa? Pocos pueden responderlo, pero los Anarquistas reciben a sus nuevos hermanos con los brazos abiertos."
 PODthorns.0058.t: "Thorns: Ravnos neutrales"
 PODthorns.0058.desc: "Como la mayoría esperaba, los Ravnos han confirmado su neutralidad en la guerra entre Antiguos y Neonatos. El $pod_clan$ indio está jugando a largo plazo y aún se encuentra en el arduo proceso de ser aceptado en estas tierras lejanas."
 PODthorns.0059.t: "Thorns: Los Caitiff"
 PODthorns.0059.desc: "Los Caitiff eran un mero rumor hace dos siglos, y se les cazaba hasta la muerte si aparecían en una ciudad. Pero los tiempos han cambiado y ya no pueden ser ignorados. Se han invitado a sí mismos a la Convención y se espera que ayuden al Movimiento Anarquista, que comparte muchos de sus agravios."
 PODthorns.0060.t: "Thorns: Caitiff de la Camarilla"
 PODthorns.0060.desc: "Un acontecimiento impactante en la Convención: los Caitiff se han unido a la Camarilla. Tras muchos debates y cambios en la propuesta de constitución oficial de la secta, las dos facciones han llegado a un acuerdo. Un nuevo amanecer brilla para los oprimidos de la raza $pod_cainite$."
 PODthorns.0061.t: "Thorns: Caitiff de la Oposición"
 PODthorns.0061.desc: "El Movimiento Anarquista se ve reforzado con la lealtad de los Caitiff. No es realmente una sorpresa, ya que comparten mayoritariamente los mismos agravios y enemigos, pero sigue siendo un beneficio poderoso para la causa de los Neonatos."
 PODthorns.0062.t: "Thorns: Caitiff neutrales"
 PODthorns.0062.desc: "Los Caitiff han optado por un curso de acción prudente en la Convención. A pesar de sus recelos con la Camarilla, intentan no antagonizarla más anunciando su neutralidad."
 PODthorns.0063.t: "Thorns: el Fin"
 PODthorns.0063.desc: "Mientras los últimos representantes abandonan la zona de la convención, todos ya están planeando su próximo movimiento. La Camarilla aún no ha logrado la supremacía total prevista sobre la raza Vástago. La Oposición habla de reformar el Movimiento Anarquista en una organización totalmente nueva para contrarrestar a la Camarilla. Finalmente, los neutrales preparan pactos y alianzas para asegurar su supervivencia. Comienza una nueva era de la historia $pod_cainite$, con un futuro incierto por delante."
 PODthorns.0063.a: "¿Cuál será el próximo movimiento del Gran Juego?"
                                         
 PODthorns.1001.t: "¿Qué será la Camarilla?"
 PODthorns.1001.desc: "El concepto de la Camarilla aún está en su infancia y, aunque muchos coinciden en la necesidad de esta organización vampírica unida, hay muchos debates sobre qué debería representar exactamente la Camarilla. ¿Participarás en esos debates?"
 PODthorns.1001.a: "¡Mi opinión debe ser escuchada!"
 PODthorns.1001.a.tt: "#R Participarás en una votación para definir las doctrinas y preceptos de la Camarilla.#!"
 PODthorns.1001.b: "No me importan los detalles."
 PODthorns.1001.b.tt: "La Camarilla mantendrá sus preceptos y doctrinas predeterminados actuales."
 PODthorns.1002.t: "Mecánica de las votaciones: Preceptos"
 PODthorns.1002.desc: "Se ha elegido un procedimiento para la votación sobre qué debería ser exactamente la Camarilla. Como siempre con las Cainitas, esto implica mucha política y acuerdos entre bastidores. Nada fuera de lo común para ti.\n #R En la nueva ventana que aparecerá, la primera pestaña enumerará todos los preceptos en disputa sobre los que se puede votar. La segunda pestaña enumerará tus votos actuales que puedes cambiar libremente.\nLos tres preceptos con más votos se mantendrán y se convertirán en el núcleo de la Camarilla. Si algunos preceptos tienen el mismo número de votos, se elegirá uno al azar.\nPuedes usar la [character_interaction|E] negociar para hacer que el objetivo vote por un precepto que hayas elegido o hacer que retire todos sus votos actuales (absteniéndose así).\nCuantos más preceptos elijan los electores, más querrán unirse a la Camarilla al final.#!"
 PODthorns.1002.a: "Entendido."
 PODthorns.1002.a.tt: "La ventana de votación de preceptos aparecerá ahora."
 PODthorns.1003.t: "Mecánica de las votaciones: Doctrinas"
 PODthorns.1003.desc: "El debate por el alma de la Camarilla continúa. Aunque muchos se han unido a esta discusión principalmente por razones políticas, esta elección seguirá siendo muy importante, ya que es lógico que algunas opciones no sean aceptadas por todos los Clanes.\n #R Puedes cambiar tu voto en la segunda pestaña, el resplandor representa tu opción elegida y una marca de verificación representa qué doctrina será la final considerando los votos actuales.\nLos electores estarán descontentos si se aceptan menos de 10 de sus propuestas o si una doctrina elegida los convierte en criminales o parias.\nPuedes usar la [character_interaction|E] negociar voto para hacer que un objetivo vote exactamente como tú.\nLa marca en el retrato tiene información sobre sus elecciones de doctrina.#!"
 PODthorns.1003.a: "Entendido."
 PODthorns.1003.a.tt: "La ventana de votación de doctrinas se abrirá ahora."
 
 PODthorns.2001.t: "El segundo encuentro de la Camarilla"
 PODthorns.2001.desc: "Se ha programado el segundo encuentro, que se celebrará en los primeros meses del año en una pequeña ciudad a las afueras de Viena. En esta reunión, los Fundadores, que han servido como Justicieros hasta este momento, pretenden dirigir un pequeño Cónclave de miembros invitados de la Camarilla para votar nuevos candidatos que ocupen los siete puestos de Justiciero. Los Fundadores pasarán a formar el Círculo Interno, un consejo supervisor sobre la Camarilla en su conjunto. Muchos de los presentes seguramente se opondrán a la creación de un grupo tan poderoso, pero los Fundadores pueden recurrir a beneficios significativos para inclinar la balanza y nombrarse a sí mismos como el Círculo Interno."
 PODthorns.2001.a: "Una buena propuesta."
 PODthorns.2001.b: "No me interesa."
 PODthorns.2001.c: "La Camarilla y su aburrida política."
 
 POD_camarilla.110.title: "Caza de Sangre"
 POD_camarilla.110.desc: "La institución legal tradicional detrás de la Caza de Sangre es la Lextalionis (o Lex Talionis), un principio legal que puede resumirse como «ojo por ojo». Tal orden se da habitualmente cada vez que un Vástago ha cometido una falta grave, como el asesinato de parientes, la Diablerie, romper la Mascarada, la invasión de un dominio que haya resultado en cualquiera de las faltas anteriores, el desafío repetido a la autoridad del Príncipe, o cualquier otro comportamiento que un Príncipe considere una amenaza suficiente para la seguridad de la Mascarada y de los Vástagos de la ciudad en su conjunto.\nSe espera que cualquier Vástago que oiga la orden de una Caza de Sangre participe, aunque esto no es oficialmente obligatorio. ¿Llamarás a tus vecinos de la Camarilla para unirse a esta guerra?"
 POD_camarilla.110.a: "Llamarlos."
 POD_camarilla.110.b: "Cazo solo."
 
 POD_camarilla.200.title: "Guerra interna en la Camarilla"
 POD_camarilla.200.desc: "¿Cómo ha podido [attacker.GetFirstName] iniciar una guerra contra ti, un noble [defender.Custom('CamarillaStatus')] de la Camarilla? ¡Quizá deberías convocar un cónclave y reclamar a [attacker.GetHerHim] como [GetTrait('anathema').GetName( GetPlayer )]!\nThe Camarilla en su conjunto rehúye la guerra abierta entre sus miembros, ya que tiende a debilitarlos ante amenazas externas como el Sabbat o los Anarquistas. Sin embargo, cada ofensa se trata por separado, y no hay poca intriga política de por medio para alcanzar el acuerdo final."
 POD_camarilla.200.a: "Convócala."
 POD_camarilla.200.b: "No es necesario."

 POD_camarilla.300.opening: "[recipient.Custom2('AppropriateGreeting', actor )]"
 POD_camarilla.300.desc: "Mi reino es mío y seguirá siéndolo hasta que yo decida lo contrario. Tu autoridad es reconocida pero tu abuso de poder también es notado. Tu \"demanda\" es rechazada."
 POD_camarilla.300.a: "Tendré que explorar otras opciones..."

 POD_camarilla.999.title: "Reunión del Círculo Interno"
 POD_camarilla.999.desc: "Las reuniones del Círculo Interno son algo que ocurre cada 13 años, y donde los [Glossary('Justicar','game_concept_justicar_desc')] son relevados o mantienen su posición."
 POD_camarilla.999.desc_spoiler: "Si posees el estatus de miembro del [Glossary('Círculo Interno','game_concept_inner_circle_desc')], también puedes incluir a alguien en la Lista Roja o iniciar un cambio doctrinal en la Camarilla."
 POD_camarilla.999.a: "Entendido."

 POD_camarilla.1100.title_justicar: "Desafío al estatus de Justicar"
 POD_camarilla.1100.title: "Candidato a Justicar"
 POD_camarilla.1100.desc_justicar: "Las reuniones del Círculo Interno son algo que ocurre cada 13 años, y donde los [Glossary('Justicar','game_concept_justicar_desc')] son relevados o mantienen su posición.\nHan pasado ya los 13 años y, por tanto, podrías perder tu estatus de [Glossary('Justicar','game_concept_justicar_desc')]."
 POD_camarilla.1100.desc: "Has sido elegido como candidato a [Glossary('Justicar','game_concept_justicar_desc')]."
 POD_camarilla.1100.a: "Era la elección obvia."
 POD_camarilla.1100.a.tt: "Será más probable que mantengas tu estatus de [Glossary('Justicar','game_concept_justicar_desc')] si el Círculo Interno te aprecia."
 POD_camarilla.1100.b: "Lo conseguiré."

