 POD_camarilla.2300.t: "Triunfo de la Camarilla"
 POD_camarilla.2300.desc: "Para muchos, la Camarilla siempre ha sido el estado por defecto de la sociedad vampírica. Como defensora del Status Quo, a menudo reflejando prácticas mortales muy anticuadas, ha resistido muchas pruebas y rebeliones, desde el bárbaro Sabbat hasta los desesperados Anarquistas.\nSea cual sea el caso, una sucesión de victorias militares y diplomáticas ha relegado recientemente a sus rivales a una irrelevancia casi total. Para muchos, la Camarilla fue alguna vez la peor opción para una sociedad de la Estirpe.\n¿Ahora? Es la única."
 POD_camarilla.2300.a: "Una gran familia disfuncional."