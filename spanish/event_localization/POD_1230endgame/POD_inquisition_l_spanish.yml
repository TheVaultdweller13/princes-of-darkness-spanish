  PODinquisition.100.t: "Inquisidores sin tierras"
  PODinquisition.100.desc: "Como facción afiliada a la Iglesia Católica, estás sujeto al escrutinio de la Curia Romana incluso si no posees tierras propias. La mayor parte de tu apoyo (ya sea espiritual o material) proviene de miembros de la Iglesia simpatizantes con tu causa. Si quieres mantener tu orden sagrada en funcionamiento, tendrás que acatar el escrutinio de la Curia sobre tus acciones.\n #X Como inquisidor sin tierras, tienes un valor (que puedes consultar en la decisión del mismo nombre) llamado Apoyo de la Curia que muestra cuánto valora la Iglesia tus acciones. Puedes mejorar tu Apoyo de la Curia logrando contratos específicos o ganando guerras contra seres sobrenaturales. Puedes gastar Apoyo de la Curia para pedir varios favores (a través de una decisión) que pueden acelerar el alcance de tu objetivo final: Europa y Tierra Santa libres de los esbirros del Infierno.\nTen en cuenta que cada vez que los cardenales elijan a un nuevo Papa, se enviará un Legado Papal a tu campamento para evaluar tu celo. Se sentirá disgustado si se entera de que utilizas conocimientos no autorizados como la Hechicería o la Demonología. Si vas un paso más allá, como convertirte en infernalista o inmortal por cualquier medio, serás excomulgado.#!"
  PODinquisition.100.a: "Necesitamos a Roma y Roma nos necesita." 
  POD_landless_inquisition_victory_decision_custom: "Todos los [independent_ruler|E]s en [GetGeographicalRegion('world_europe').GetName] y la #ONCLICK:GEOGRAPHICAL_REGION,world_middle_east_jerusalem #TOOLTIP:GEOGRAPHICAL_REGION,world_middle_east_jerusalem #L Tierra Santa#!#!#! deben ser de la [religion|E] [GetReligionFamily('rf_hunters').GetName]"
  POD_landless_inquisition_victory_decision_custom_ex: "$POD_landless_inquisition_victory_decision_custom$ #weak (Ejemplo de un gobernante no válido: [example.GetFirstName])#!"        
  POD_landless_inquisition_victory_decision: "El Último Pacto"
  POD_landless_inquisition_victory_decision_tooltip: "Para que la Inquisición triunfe, todos deben ser purgados de nuestras tierras."
  POD_landless_inquisition_victory_decision_desc: "El objetivo final de la Inquisición en las Sombras es tan sencillo de entender como difícil de lograr. La cristiandad, desde Londres hasta Jerusalén, debe estar libre de los monstruos sobrenaturales que se aprovechan de ella."
  POD_landless_inquisition_victory_decision_confirm: "La Cruz triunfante"
  pod1230objectives.163.desc: "Peregrinos rezando en la iglesia, niños jugando en las calles, gente que va a lo suyo, a veces discutiendo, a veces riendo... Por esto es por lo que luchaste. Es probable que la humanidad nunca sepa lo que tú y tus predecesores hicisteis por ella. Nunca conocerán los horrores contra los que luchaste, los monstruos que mataste, los males antiguos que sacaste a la luz purificadora.\nPero... no importa realmente. No lo hiciste por la gloria, lo hiciste por ver a una humanidad libre para mejorar por sí misma. ¿Habrá nuevos desafíos por venir y nuevos errores que cometer? Ciertamente, pero por primera vez desde que Dios creó esta Tierra, la humanidad es libre de seguir adelante por su cuenta.\nLa noche seguirá siendo oscura..."
  pod1230objectives.163.a: "...pero ya no está llena de terrores." 
  landless_inquisition_victory_objective_decision_effect_tooltip: "Ahora siempre tendrás el apoyo total del Papa. También se te permite una dispensa especial para usar magias heréticas (solo para este personaje).\nHas logrado el objetivo final de un viaje de Inquisidor sin tierras." 
