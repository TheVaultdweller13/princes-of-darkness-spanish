l_spanish:
 
  PODinquisition.0001.t: "La Era de la Inquisición"
  PODinquisition.0001.desc: "Te han llegado informes preocupantes. La llamada 'Inquisición en las Sombras' parece haber tenido suficiente con la parte de 'Sombras' de su título. De repente están reuniendo apoyo entre los gobernantes e instituciones de los mortales, lo que ha causado un efecto dominó en todo el mundo. Este movimiento ha sido planeado durante décadas, quizás siglos, y todos sus ataques hasta ahora han sido meras misiones de contención y expediciones de recopilación de información. El alcance real de la conspiración contra los vampiros podría ser mucho mayor de lo que habías previsto.\nEn todas partes, los mortales se están armando tras Cazadores dotados, decididos a acabar con los monstruos de la noche que los han plagado durante tanto tiempo.\nSe acerca la retribución."
  PODinquisition.0001.a: "Seguramente esto pasará."
  PODinquisition.0001.b: "¡A las armas, hermanos y hermanas! ¡Terminemos la caza!"
  PODinquisition.1001.player_warningb: "Los Inquisidores que aparezcan durante este periodo de tiempo siempre aceptarán ofertas de vasallaje de tu parte, si decides ofrecérselas."
  PODinquisition.1001.t: "La Inquisición: Francia"
  PODinquisition.1001.desc: "Fue aquí donde comenzó la Inquisición.\nDurante el levantamiento cátaro, muchos hombres de fe llegaron al sur de Francia buscando herejes. Encontraron mucho más. La Francia $pod_cainite$ estaba envuelta en una intriga entre París y Toulouse, y ambos bandos estaban encantados de usar a los mortales y el levantamiento para su propio beneficio.\nNo esperaban la fe y determinación absolutas de la Iglesia. Los vampiros fueron asesinados en masa durante la Cruzada Albigense, y se llevó información a la Santa Sede sobre esta nueva amenaza. El resto es historia.\nComo tal, no sorprende que Francia sea un objetivo principal y temprano de la Inquisición abierta que se está llevando a cabo en todo el mundo ahora."
  PODinquisition.1001.a: "La Cruz ha venido a purgar Francia una vez más."
  PODinquisition.1001.player_warning: "No queda mucho tiempo para prepararse."
  PODinquisition.1002.t: "La Inquisición: Britania"
  PODinquisition.1002.desc: "La Inquisición siempre tuvo problemas para operar en Inglaterra. El control de Mitras sobre el país, y la insularidad de la gente aquí, dificultaron que los agentes de Dios cumplieran su santa misión. Sin embargo, nunca se rindieron, y se encontró una solución adecuada: usar la Orden bretona del Armiño como base de operaciones para la purga de Inglaterra.\nY así ha comenzado; tras su Gran Maestra, bretones y britanos leales y piadosos marchan juntos hacia el proceso de limpieza de las islas. Es un asalto total; la Iglesia no tiene reservas y pretende golpear decisivamente el baluarte de los chupasangres. Si esta audaz táctica funciona, Inglaterra aún podría salvarse."
  PODinquisition.1002.a: "Parece que la Iglesia nunca cederá, ni siquiera aquí."
  PODinquisition.1003.t: "La Inquisición: Alemania"
  PODinquisition.1003.desc: "Aunque Francia es donde se encuentra el verdadero origen de la Inquisición, Alemania es su corazón palpitante. Una vez que la Inquisición en las Sombras de la Alta Edad Media comenzó a disolverse, fue un noble austriaco, Leopold von Murnau, quien reunió a todos los que atendieron la llamada de Dios en su sociedad secreta. Esta 'Sociedad de Leopoldo' ha sido la fuerza líder tras el asalto de la Iglesia durante siglos, y ahora prepara su asalto final.\nSin embargo, la Sociedad no es una fuerza militar y, tras algunos compromisos, corresponderá a la Orden Teutónica purgar a los esbirros del Infierno del Sacro Imperio Romano Germánico. Debidamente informados de la destreza de sus enemigos, los Caballeros han ganado ahora un punto de apoyo en Dortmund, desde donde planean expandir lenta pero seguramente la furia justa de Dios."
  PODinquisition.1003.a: "¿Están los teutones a la altura de esta tarea monumental?"
  PODinquisition.1005.t: "La Inquisición: Iberia"
  PODinquisition.1005.desc: "Iberia siempre ha sido un centro de fe. Como tal, las órdenes militares abundan, lo que presentó una oportunidad muy sólida para la Inquisición en las Sombras. Fue bastante fácil convencer a las diversas órdenes de la necesidad de purgar Iberia de chupasangres, pero fue más difícil hacer que trabajaran juntas.\nLa Iglesia utilizó la figura de Rodrigo de Navarra, el fundador de la rama más temprana de la Inquisición, como punto de encuentro para los ibéricos. Este plan demostró funcionar bien, y es una inmensa fuerza de caballeros de la Cruz la que se está concentrando ahora en Portugal para comenzar la liberación de Iberia. Con todos los reinos y órdenes finalmente trabajando mano a mano, parece que la victoria de la Inquisición aquí está asegurada."
  PODinquisition.1005.a: "Era de esperar."
  PODinquisition.1006.t: "La Inquisición: Escandinavia"
  PODinquisition.1006.desc: "El alcance de la Inquisición en Escandinavia siempre ha sido escaso. La tierra es dura, está dividida, e incluso los inquisidores más celosos dudan de que los $pod_cainites$ puedan prosperar realmente aquí. Como tal, atacar esta zona no estaba en el plan inicial de la Santa Sede.\nEs la dedicación y la verdadera fe de un norteño, Albjorn, lo que hizo cambiar de opinión a Su Santidad. Albjorn defendió su caso, describiendo el control insidioso de los vampiros sobre el buen rebaño de Escandinavia, especialmente en el lejano norte. Convencida, Roma ha visto conveniente armar una sólida expedición para ayudar a Albjorn en su búsqueda. El tiempo dirá si fue una buena elección o no."
  PODinquisition.1006.a: "La Cruz llega incluso al confín del mundo."
  PODinquisition.1007.t: "La Inquisición: Italia"
  PODinquisition.1007.desc: "No debería sorprender que la Inquisición haya reservado sus mejores tropas para la propia Italia. Corrompida durante mucho tiempo por los hijos malditos de Caín, la Santa Sede quiere desatar una retribución sobre los italianos no vista desde el diluvio bíblico.\nJean de Lastic, el famoso defensor de Rodas y gran maestro de los Caballeros Hospitalarios, tiene la tarea de quemar a cada vampiro que encuentre. Se le ha asignado una fuerza formidable para ayudarle en este empeño divino. En lo que respecta a la Santa Sede, el mundo entero depende de la batalla italiana. No habrá compromisos, ni rendición, ni piedad. Italia será salvada, como Dios lo exige."
  PODinquisition.1007.a: "¿Es este el fin de los $pod_cainites$ italianos?"
  PODinquisition.1008.t: "La Inquisición: Levante"
  PODinquisition.1008.desc: "Los Estados Cruzados desaparecieron hace tiempo en el Levante, pero la Iglesia nunca olvidó los inquietantes informes que llegaban de ellos. Estaba claro que, incluso en esta tierra santísima, los malditos $pod_cainites$ gobiernan la noche.\nMontar un ataque aquí siempre fue una perspectiva difícil para la Inquisición en las Sombras, ya que la tierra estaba en manos hostiles pero... estas manos hostiles siguen siendo humanas. Y así, comenzó un largo y arduo proceso diplomático, con los mejores negociadores de Italia trabajando día y noche para convencer a sus antiguos enemigos de que les dejaran operar en el Levante. Finalmente lograron persuadirlos y, mientras la Inquisición surge en todas partes, un contingente dedicado de caballeros santos se mantiene listo para salvar Tierra Santa de la más vil de las amenazas."
  PODinquisition.1008.a: "En Tierra Santa, los $pod_cainites$ han unido a los mortales contra ellos."
  PODinquisition.1009.t: "La Inquisición: Arabia"
  PODinquisition.1009.desc: "Aunque el mundo musulmán carece de una larga tradición de órdenes sagradas, no significa que sea ciego a la amenaza $pod_cainite$. Durante mucho tiempo, la propia Meca sirvió como una protección perfecta, repeliendo a los monstruos por la pura fe que emanaba de ella. Pero los tiempos están cambiando, y los astutos chupasangres parecen haber ideado una contramedida.\nSin embargo, no todo está perdido, ya que una pequeña familia de miembros de tribus con ideas afines se ha encargado de organizar la caza. Creciendo rápidamente gracias a sus considerables éxitos hasta ahora, esta nueva sociedad, los Ikhwan al-Safa, es ahora lo suficientemente fuerte como para lanzar un asalto importante sobre posiciones $pod_cainite$ conocidas."
  PODinquisition.1009.a: "El sol abrasador podría ser el fin de los Vástagos de Arabia."
  PODinquisition.1010.t: "La Inquisición: Persia"
  PODinquisition.1010.desc: "Una excepción en el mundo musulmán en general, los cazadores nunca pudieron echar raíces realmente en Persia, siendo el control total del $pod_clan$ Haqimita en la región el culpable más probable. Sin embargo, una organización no es lo único que importa para un cazador dedicado y, como tal, individuos, o incluso pequeñas bandas, fueron siempre una espina clavada en el costado de los Hijos de Caín aquí.\nMientras el resto del mundo se ve envuelto en el contraataque mortal, se ha formado una alianza apresurada de varios grupos pequeños en Persia, para aprovechar el caos circundante y, con suerte, asestar un golpe demoledor a los monstruos de la noche."
  PODinquisition.1010.a: "Persia es más antigua de lo que la mayoría de los humanos creen."
  PODinquisition.1011.t: "La Inquisición: India"
  PODinquisition.1011.desc: "La India tiene una larga tradición de caza de monstruos. Sin embargo, a menudo esta tradición ha sido utilizada como fuente por grupos no mucho mejores que las propias presas, y esta práctica ha obstaculizado gravemente la creación de una organización unificada similar a las de Europa.\nComo tal, incluso mientras el mundo occidental estalla en llamas, la India permanece relativamente intacta por el caos. Sin embargo, pequeños informes indican una congregación de cazadores con ideas afines alrededor de Sindh, lo que podría justificar cierta precaución por parte de los verdaderos gobernantes de la India."
  PODinquisition.1011.a: "Nada cambia realmente en la tierra de la Guerra Eterna."
  PODinquisition.1012.t: "La Inquisición: Magreb"
  PODinquisition.1012.desc: "Lejos del alcance de la Inquisición cristiana, el Magreb observa con interés el asalto masivo a los $pod_cainites$. Habiendo sufrido durante mucho tiempo la misma amenaza, sus habitantes han formado una tradición de cazadores solitarios, los Sayyad al-Ghulan.\nEstos cazadores están ahora, por primera vez, buscando unirse, esperando aprovechar el caos europeo para cazar a aquellos $pod_cainites$ que busquen refugio en sus costas."
  PODinquisition.1012.a: "No hay refugio para los vampiros aquí."
  PODinquisition.1013.t: "La Inquisición: Egipto"
  PODinquisition.1013.desc: "Los egipcios son conscientes de la presencia de monstruos desde hace mucho tiempo. Fue el propio Baybars, el primer sultán mameluco, quien descubrió la verdad sobre los adoradores de serpientes que se escondían en su tierra. La purga que orquestó todavía la sienten hoy los Setitas pero, lamentablemente, el propio Baybars fue asesinado por uno de sus agentes.\nDesde entonces, los $pod_cainites$ han estado regresando a sus templos, recuperando su fuerza perdida. Pero en medio del levantamiento europeo contra este enemigo, el legado de Baybars es continuado por un grupo masivo de jóvenes mamelucos, decididos a vengar a su antepasado caído."
  PODinquisition.1013.a: "¿Podrán las Serpientes soportar esta tormenta una vez más?"
  PODinquisition.1014.t: "La Inquisición: Transilvania"
  PODinquisition.1014.desc: "Hasta el día de hoy, la Iglesia sigue conmocionada por la gran cantidad de informes sobre vampiros que se arrastran por Transilvania. ¡Con algunos de ellos actuando como verdaderos nobles, o peor aún, como dioses! Lamentablemente para la Inquisición en las Sombras, el disputado panorama religioso de esta zona nunca les permitió afianzarse realmente y contener la situación aquí.\nAsí que tuvieron que hacer algo nuevo, y esto ha llegado en forma de 'delegar' la tarea de purga a la Orden del Dragón. Esta sociedad caballeresca sabe una cantidad sorprendente sobre vampiros y similares, y ha sido un gran aliado para la Inquisición hasta ahora. Pero, en los rincones de Roma, algunos sospechan que podría ser necesario vigilarlos más de cerca una vez terminada su tarea..."
  PODinquisition.1014.a: "Dragones contra Vampiros."
  PODinquisition.1015.t: "La Inquisición: Grecia"
  PODinquisition.1015.desc: "La Inquisición en las Sombras conoce la presencia de chupasangres en Grecia desde la 4ª Cruzada, de la cual son obviamente culpables. ¿De qué otra forma podría haber salido tan mal si no? Durante mucho tiempo, el Imperio Latino fue pensado como una base para atacar cuando la Inquisición se revelara pero... esta parte del plan obviamente ha salido mal.\nSu Santidad no ha olvidado las almas cristianas del este, por muy descarriadas que estén. Como tal, recientemente creó la Orden de Nuestra Señora de Belén, con la justa tarea de purgar a los inmundos $pod_cainites$ de estas tierras perdidas. Entonces, tal vez, Bizancio pueda ser verdaderamente salvado en alma, si no en cuerpo."
  PODinquisition.1015.a: "Los francos han vuelto a la Roma Oriental."
  PODinquisition.1016.t: "La Inquisición: Rusia"
  PODinquisition.1016.desc: "La Iglesia Ortodoxa tiene su propio cuerpo inquisitorial, el grupo de cazadores conocido como los Akritai. Respetados incluso por la Inquisición en las Sombras por su incansable búsqueda de justicia, los Akritai estaban al tanto del plan de sus homólogos occidentales para una gran ofensiva contra los no muertos.\nCostó algo de persuasión y negociación, pero finalmente aceptaron participar en ella, recopilando información sobre los $pod_cainites$ rusos y sus agentes. Esta inteligencia será de gran utilidad ahora, ya que el propio Exarca de los Akritai está entrando en combate cerca de Moscú para lanzar la ofensiva más importante de su organización hasta la fecha."
  PODinquisition.1016.a: "Desde Rusia vienen..."
  PODinquisition.1017.t: "La Inquisición: Europa Oriental"
  PODinquisition.1017.desc: "La Inquisición en las Sombras tiene sentimientos encontrados sobre Europa Oriental. Aunque la gran presencia de paganos en tiempos pasados parece indicar la influencia de los $pod_cainites$, tuvieron problemas para confirmar realmente esa teoría. Como tal, Roma decidió jugar a largo plazo, creando la Orden de Dobrzyn hace dos siglos.\nEstos caballeros han mantenido un perfil bajo, incluso siendo disueltos oficialmente después de un tiempo, pero su verdadera tarea no hace más que empezar ahora. Reuniendo a un grupo de guerreros de la fe dedicados, y ayudados por el largo alcance de la red de la Inquisición en las Sombras, la Orden está lanzando su ataque a gran escala contra las abominaciones impías como parte de la gran Cruzada de la Inquisición contra los vampiros."
  PODinquisition.1017.a: "¡Incluso las órdenes olvidadas vuelven a la lucha!"
