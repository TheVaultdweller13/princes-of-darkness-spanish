l_spanish:
 
 pod1230objectives_fae.1.t: "Fin de la Inquisición"
 pod1230objectives_fae.1.desc: "La creación de la Inquisición fue la culminación de la Escisión, cuando la Iglesia, en su afán doctrinal, trató de eliminar del mundo todos los elementos sobrenaturales indeseables, incluidos los fae. Pero ahora ha terminado."
 pod1230objectives_fae.1.a: "¡Más supersticiones!"
 
 pod1230objectives_fae.2.t: "Catecismo Constantiniano"
 pod1230objectives_fae.2.desc: "Padre nuestro que estás en los cielos,\nsantificados sean tus nombres.\nVenga a nosotros tu reino.\nVengan tus Santos Espíritus sobre nosotros y límpianos.\nHágase tu voluntad, en la tierra como en los cielos.\nDanos hoy nuestro pan para mañana,\ny perdona nuestros pecados, pues nosotros mismos honramos nuestras obligaciones.\nY no nos traigas al tiempo de prueba —la Fractura— ni nos tientes a la banalidad.\nPorque tuyos son el reino, el poder y la gloria por siempre."
 pod1230objectives_fae.2.a: "Amén."
 
 pod1230objectives_fae.3.t: "Más Allá de la Razón"
 pod1230objectives_fae.3.desc: "Las maquinaciones de la Orden de la Razón han sido deshechas. Sus planes de atar el mundo a la Razón y la Ciencia han fracasado. Sus talleres de hierro frío han sido silenciados. Con los Tremere destruidos, su Guerra Massasa contra la Orden de Hermes terminó en derrota para los brujos usurpadores no muertos.  Las casas herméticas unidas pudieron dirigir toda su atención y su ira, por la destrucción de Mistridge, contra los Canteros y su furtiva alianza con eruditos afines, avaros tacaños, beatos mojigatos y otros propagadores de la banalidad. Sin los filósofos «racionales», la humanidad ya vuelve a sus viejas creencias y a sus viejos pactos con los fae para dar sentido al mundo fantástico y sobrevivir en él."
 pod1230objectives_fae.3.a: "Hay más cosas en el cielo y en la Tierra de las que sueña tu filosofía"
 
 pod1230objectives_fae.4.t: "El plan de los Ratkin"
 pod1230objectives_fae.4.desc: "Los viles Ratkin urdieron un oscuro plan y crearon la enfermedad más mortífera jamás conocida, la Peste Negra. Te alegras de haberlos detenido antes de que la soltaran por completo sobre el mundo."
 pod1230objectives_fae.4.a: "Ratas asquerosas."
 
 pod1230objectives_fae.5.t: "GATástrofe"
 pod1230objectives_fae.5.desc: "Ahora todo el mundo adora a los gatos, la Profecía de la Rata no se cumplirá, pero puede que haya otro problema que resolver."
 pod1230objectives_fae.5.a: "Vaya..."
 
 pod1230objectives_fae.6.t: "Restauración Arcadiana"
 pod1230objectives_fae.6.desc: "Y cuando el telón cayó sobre el gran escenario que es el Mundo Otoñal, te recostaste y te permitiste una sonrisa.\n\nLo lograste. La banalidad, el gran dragón, la muerte silenciosa, la marea insaciable que extingue la vida verdadera, ya no existe. La chispa en los ojos de los soñadores jamás se apagará, pues [UmbraGlossary('arcadia')] ha llegado y se queda. La humanidad ha recuperado su capacidad de asombro.\n\nHas tejido una bella historia. Ahora solo necesita unas palabras para despedirla.\n\nQué tal: «y vivieron felices para siempre...»"
 pod1230objectives_fae.6.a: "Fusionar el Ensueño con la Tierra."
 pod1230objectives_fae.6.b: "Iniciar el proceso, pero no terminarlo."
 pod1230objectives_fae.6.a.tt: "Con la fusión de [UmbraGlossary('arcadia')] con la Tierra, tu partida terminará, pues el mundo que conocías cambia para siempre."
 pod1230objectives_fae.6.b.tt: "Aunque incompleta, la fusión de la Tierra y el [UmbraGlossary('dreaming')] sigue haciendo que el «Mundo Otoñal» se vuelva onírico, de modo que cualquier [bunk|E] siempre tenga éxito y el Glamour se regenere por completo cada mes."
 
 # The Latin text is probably a musical parody of an earlier 12th century song beginning "intonent hodie voces ecclesie", written in honour of Saint Nicholas, the patron saint of Russia, sailors and children – to whom he traditionally brings gifts on his feast day, 6 December. https://en.wikipedia.org/wiki/Personent_hodie
 pod1230objectives_fae.7.t: "¡Santa Eterno!"
 pod1230objectives_fae.7.desc: "¡Está hecho! Incontables niños han recibido regalos quiméricos. ¡Incontables niños creen en ti! ¡Sus sueños te llenan de una fuente inagotable de glamour! El mundo puede estar asolado por guerras sangrientas, plagas horribles, inquisiciones espantosas y una banalidad que aplasta el alma, ¡pero tú perdurarás!\n\n #EMP 'En este día la tierra resonará \ncon el canto de los niños \nal Señor, Cristo nuestro Rey, \nnacido en la tierra para salvarnos; \nel Padre nos lo dio.\n\nSuyo el destino, nuestra la alegría; \ncuando bajó a la tierra, \nBelén vio su nacimiento; \nbuey y asno a su lado \ndel frío lo resguardaban.\n\nLa brillante estrella de Dios sobre su cabeza, \ntres Sabios a él guió; \nse arrodillan junto a su lecho, \nponen sus dones ante él, \nlo alaban y lo adoran. \n\nEn este día cantan los ángeles; \ncon su canto la tierra resonará, \nalabando a Cristo, Rey del cielo, \nnacido en la tierra para salvarnos; \npaz y amor nos dio. \n\nIdeo, o, o, Ideo, o, o, \n¡ideo gloria in excelsis Deo!'#!" 
 pod1230objectives_fae.7.a: "¡Jo, jo, jo!"

