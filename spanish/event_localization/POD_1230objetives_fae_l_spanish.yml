 pod1230objectives_fae.15.t: "Tao Te Hsien"
 pod1230objectives_fae.15.desc: "Tras estudiar el Nei Tan y obtener el nido de dragón más poderoso, te has convertido en Tao Te Hsien y puedes volver a comulgar con el Cielo."
 pod1230objectives_fae.15.a: "He vuelto"

 #########################################

 pod1230objectives_fae.30.t: "Guerra de las Estaciones: Victoria"
 pod1230objectives_fae.30.desc: "La Guerra de las Estaciones ha terminado. Con tu clara victoria, toda la sociedad $POD_splat_fae$ está en tus manos."
 pod1230objectives_fae.30.a: "La victoria sabe dulce"

 pod1230objectives_fae.31.t: "Guerra de las Estaciones: Tregua eterna"
 pod1230objectives_fae.31.desc: "La Guerra de las Estaciones ha terminado, con todos los $POD_splat_fae$ por fin en paz unos con otros."
 pod1230objectives_fae.31.a: "La paz es lo mejor."

 #########################################

 pod1230objectives_fae.150.t: "Rey de Underbridge"
 pod1230objectives_fae.150.desc: "He asegurado más y más puentes y he expandido mi reino de Bajopuente hasta convertirlo en un poderoso reino. Recibiré lo que se me debe. Lástima del pobre viajero que no pueda pagar mis peajes. Fae unseelie y terribles monstruos acuden en masa a mis estandartes y a la corriente oscura."
 pod1230objectives_fae.150.a: "Nadie cruzará sin mi permiso"
 
 pod1230objectives_fae.151.t: "Alto Rey de Underbridge"
 pod1230objectives_fae.151.desc: "Con los ríos de toda Europa del Este bajo tu control, el espacio aterrador bajo tantos puentes será tu mayor dominio. Nadie podrá cruzar las aguas rugientes sin tu consentimiento. Todos te pagarán lo debido, mientras tú puedes hacer pasar criaturas de pura pesadilla al mundo con la misma facilidad que un agradable paseo."
 pod1230objectives_fae.151.a: "Nadie cruzará sin mi permiso"
 
 pod1230objectives_fae.1100.t: "¡Borbetomagus reconquistada!"
 pod1230objectives_fae.1100.desc: "La sede ancestral de la Vieja Borgoña forma ahora parte de tu reino."
 pod1230objectives_fae.1100.a: "El camino hacia el Rin se abre ante mí."

 pod1230objectives_fae.1200.t: "¡Rey del Rin!"
 pod1230objectives_fae.1200.desc: "Todo el río Rin está ahora bajo tu control. Sin duda el Oro del Rin se encontrará en algún punto de este río místico."
 pod1230objectives_fae.1200.a: "En la tierra del Rin, sé... ¡Rey, rey, rey, rey!" 
 
 pod1230objectives_fae.1300.t: "¡Imperio del Rin!"
 pod1230objectives_fae.1300.desc: "Con todos los ducados del Rin asegurados y el Oro del Rin a buen recaudo en tu tesoro, nadie puede disputar tu derecho a gobernar el Rin."
 pod1230objectives_fae.1300.a: "¡El Rin, mío y para siempre!" 
 