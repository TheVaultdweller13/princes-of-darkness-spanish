 pod1230objectives_shih.1.t: "Redescubriendo el Estilo de Entrenamiento de Wan Kung Yi"
 pod1230objectives_shih.1.desc: "Wan Kung Yi es tradicionalmente considerado como el primer Shih. Este hombre de la dinastía Shang tuvo una vida larga y aventurera, comenzando con una clara hostilidad hacia lo sobrenatural que gobernaba la tierra antes de comprender que ellos también tenían un lugar en el ciclo del orden natural.\nYi dedicó así su larga vida a luchar solo contra aquellos que realmente amenazaban a la humanidad y, por lo tanto, aprendió mucho de seres sobrenaturales comprensivos en el proceso. Estas enseñanzas se convirtieron en la base de los Shih en su conjunto y los convirtieron en la fuerza formidable que siguen siendo hoy en día. Entre otras cosas, Yi codificó el Qiao, dando acceso a estos poderes a sus estudiantes dignos para que pudieran combatir el mal verdadero en igualdad de condiciones."
 pod1230objectives_shih.1.a: "El Maestro Yi era sabio."

 pod1230objectives_shih.2.t: "Continuando el Legado de Wan Kung Yi"
 pod1230objectives_shih.2.desc: "Wan Kung Yi no era un hombre perfecto. El fundador de los Shih, pese a su postura conciliadora hacia lo sobrenatural, montó en cólera cuando algunos de ellos mataron a su familia. Con su arco fabricado con los Árboles de la Inmortalidad, Yi purgó con saña a quienes lo habían agraviado en un diluvio de ira y sangre. Eso le valió el apodo de «Arquero Excelente» entre los seres sobrenaturales que aún recuerdan su arrebato.\nLos Shih, sin embargo, saben que Yi pagó caro su desahogo y el quebranto de sus propias enseñanzas. Cada flecha que disparó con ira le costó su propia fuerza vital y, una vez terminada la purga, el alma misma de Yi quedó mancillada. No mucho después abandonó este mundo.\nLos Shih sabios aprenden de este ejemplo y centran su adiestramiento tanto en lo mental como en lo físico."
 pod1230objectives_shih.2.a: "La ira es el enemigo."

 pod1230objectives_shih.3.t: "La Causa Justa y Sabia"
 pod1230objectives_shih.3.desc: "Tras la muerte del fundador de los Shih, Wan Kung Yi, los cazadores de demonios no tardaron en reorganizarse en un gran Ejército Celestial dedicado a purgar lo sobrenatural. Se volvieron arrogantes, se enseñorearon de los mortales y mataron a todo el que se les oponía. Los Shih más sabios se atuvieron a las enseñanzas de Yi y se negaron a inclinarse ante el Ejército Celestial.\nResultó un rumbo propicio cuando, en un movimiento sin precedentes, los seres sobrenaturales se aliaron para destruir por completo al Ejército Celestial y su cuartel general en Kun Lun.\nLos Shih, ahora últimos supervivientes del legado de cazadores de demonios de Yi, sintieron que el orden natural había devuelto el golpe a sus primos descarriados y siguieron adelante.\nSin embargo, a medida que crecen tu poder y tus seguidores, algunos sostienen que la causa del Ejército Celestial era justa y que solo sus métodos y su liderazgo eran defectuosos. Te instan a retomar ese manto divisivo y a hacerlo tuyo."
 pod1230objectives_shih.3.a: "Fue una locura entonces, y sigue siendo una locura."
 pod1230objectives_shih.3.b: "¡El Ejército Celestial ha renacido!"
 pod1230objectives_shih.3.c: "Me mantendré por mi cuenta."
