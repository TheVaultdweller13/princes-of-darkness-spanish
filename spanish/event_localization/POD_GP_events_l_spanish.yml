l_spanish:

 podgreatpersons.0001.t: "Abd al-Latif al-Bagdadí"
 podgreatpersons.0001.desc: "Un renombrado historiador y filósofo, Abd al-Latif al-Bagdadí, ha regresado recientemente a Bagdad tras años de extensos viajes por Oriente Medio. Sus escritos y su conocimiento del alma, la mente y el cuerpo humano ya son muy valorados, e incluso el propio Saladino fue su mecenas. A medida que envejece y se vuelve más solitario, podría ser tu única oportunidad de adquirir a un Chiquillo tan distinguido para ti."
 podgreatpersons.0001.a: "El oro no es una preocupación."
 podgreatpersons.0001.b: "Es hora de mover algunos hilos."
 podgreatpersons.0001.c: "Estamos mejor sin otro competidor."
 podgreatpersons.0001.d: "¡Dámelo y ya!" 
 podgreatpersons.0001.custom: "Esta Gran Persona se unirá a tu corte, dándote la oportunidad de usar sus habilidades o adaptarlas para un uso futuro como el $pod_Embrace$ (si eres un vampiro). Sin embargo, jugar con un individuo así aumentará tu [masquerade_exposure|E] si eres un vampiro."
 podgreatpersons.0001.customb: "No intentarás influir en esta Gran Persona. Un gobernante vampiro cercano probablemente aprovechará la oportunidad para darle el $pod_Embrace$."
 podgreatpersons.0002.t: "Alice Kyteler"
 podgreatpersons.0002.desc: "Una curiosa historia ha llegado a tu atención. Una astuta mortal llamada Alice Kyteler ha escapado recientemente de su juicio por brujería, herejía, sacrificio de animales y fornicación con un demonio aparentemente llamado «Robin». Todas sus asociadas ya han sido quemadas en la hoguera o lo serán pronto, pero ella logró frustrar a la Iglesia en tantas ocasiones que su capacidad es innegable. Como uno de tus contactos te informa de que se ha refugiado cerca de tu dominio, te preguntas si te gustaría tener a una bruja ambiciosa e inteligente como Chiquilla..."
 podgreatpersons.0003.t: "Jalal ad-Din Muhammad Rumi"
 podgreatpersons.0003.desc: "Un consumado jurista y teólogo, Rumi, como se le conoce más ampliamente, es aún más famoso por sus Ghazals, o poemas persas. Un hombre muy querido, incluso fuera de las comunidades musulmanas, ha terminado recientemente su obra maestra, el Masnavi. Hay noticias de que la enfermedad le está alcanzando y de que ha predicho su propia muerte. Tienes una pequeña ventana para actuar si quieres darle el $pod_Embrace$, ya sea para patrocinar sus futuras obras o para fines más... relacionados con lo Cainita."
 podgreatpersons.0004.t: "Agnes Randolph"
 podgreatpersons.0004.desc: "Mientras la guerra mortal por la independencia de Escocia arrecia, el nombre de Agnes Dunbar ha llegado a tu atención. Esta feroz escocesa ha defendido su castillo sin líderes con un espíritu tan indomable como cualquier mortal pueda reunir. Al burlarse de 20.000 ingleses con astutos trucos y rapidez mental, la señora del castillo ha demostrado más que suficiente su valor. Atrapada en un matrimonio sin amor y con pocas perspectivas de herencia, probablemente podrías convencer a una mujer tan valiente para que ponga sus considerables habilidades a tu servicio. Quizás incluso como Chiquilla..."
 podgreatpersons.0005.t: "Agnes Sorel"
 podgreatpersons.0005.desc: "Acabas de ser informado de que Luis XI, el hijo del rey mortal de Francia, planea envenenar a Agnes Sorel, la favorita real. Esta dama, a menudo escandalosa, ha sido una fuerte influencia para el rey desde hace tiempo y los relatos sobre su belleza han llegado incluso a tu corte. Si no actúas rápido, Francia perderá una de sus flores más bellas. Si lo haces... bueno, tal vez puedas asegurarte de que esta flor en particular nunca se marchite."
 podgreatpersons.0006.t: "¿Alexander Nevsky?"
 podgreatpersons.0006.desc: "En un giro inesperado de los acontecimientos, has oído que alguien que afirma ser Alexander Nevsky ha aparecido recientemente en una ciudad cercana. Es poco probable, en el mejor de los casos, ya que el famoso Gran Príncipe de Vladímir se encuentra actualmente en una misión diplomática con la Horda de Oro. Este individuo afirma haber conocido la sociedad $pod_cainite$ y desea ser «Abrazado bajo sus propios términos» para obtener la inmortalidad, pero no la esclavitud. Tienes dudas sobre esta historia, pero ¿puedes permitir que un rival pueda dar el $pod_Embrace$ al Héroe de la Rus, azote de alemanes y suecos por igual? Como mínimo, puedes hacer que venga a tu corte y juzgar por ti mismo..."
 podgreatpersons.0007.t: "¿Antonio de Padua?"
 podgreatpersons.0007.desc: "Uno de tus agentes informa de que alguien que afirma ser Antonio de Padua, el famoso santo, ha sido visto en una ciudad cercana. Es poco probable, en el mejor de los casos, ya que estás bastante seguro de que el verdadero Antonio murió el año pasado y fue canonizado por Roma. El auténtico monje franciscano era un santo viviente, con un aura capaz de quemar a los de tu clase desde kilómetros de distancia. Aun así... quizá valga la pena investigar. Podría ser uno de sus Compañeros que aún vive o un hombre lo suficientemente instruido como para considerarlo un potencial Chiquillo."
 podgreatpersons.0008.t: "Antonio de Nebrija"
 podgreatpersons.0008.desc: "Uno de los humanistas más grandes de la época, Antonio de Nebrija ha escrito muchos libros que tu corte suele citar. No te entusiasma especialmente esta moda del «humanismo» que tienen los mortales ahora mismo, pero no puedes negar el talento de este hombre. Sin embargo, la edad le está pasando factura y te preguntas si ahora sería el momento adecuado para acercarlo a tu corte. Quizá tener un Chiquillo con «mentalidad moderna» propio podría resultar beneficioso."
 podgreatpersons.0009.t: "Baba Ishak Kafarsurdi"
 podgreatpersons.0009.desc: "Un mortal ha causado un gran revuelo en el noreste de Anatolia recientemente. Proclamándose Mesías inmortal, este Ishak ha reunido a muchos seguidores e incluso ha liderado una rebelión abierta contra el Sultanato Selyúcida. Como suele ocurrir con los mortales, este fue un intento efímero y el llamado «Inmortal» será ejecutado pronto. Consideras que a este hombre no le falta carisma ni determinación. Quizá con el maestro adecuado, podría convertirse en un Chiquillo interesante..."
 podgreatpersons.0010.t: "¿Beatriz da Silva?"
 podgreatpersons.0010.desc: "Algo ha ocurrido en el palacio de Toledo dedicado al nuevo orden de la Inmaculada Concepción. Los informes son difusos, pero tus agentes afirman que finalmente han podido acercarse al lugar a pesar del aura de Fe Verdadera que lo rodea. Siguieron a supervivientes de lo que parece ser un ataque de partes desconocidas y creen que tienen localizada a la fundadora de la orden, Beatriz da Silva, tras el suceso. Parece poco probable, especialmente porque Da Silva debe de ser demasiado santa para que los $pod_cainites$ se acerquen, pero aun así, es una oportunidad. Podrías localizar a esta mujer y traerla ante ti. Podrías tener un uso para ella..."
 podgreatpersons.0011.t: "Birgitta Birgersdotter?"
 podgreatpersons.0011.desc: "Conociendo tu reputación, una joven que afirma ser Birgitta Birgersdotter se ha acercado a uno de tus agentes pidiendo ser «liberada de los lazos de la Iglesia». Tus hombres dicen que hay similitudes entre esta mujer y lo que se sabe de la santa que está a punto de fundar una nueva orden religiosa en Suecia, pero la edad no coincide. Tras investigar un poco, puedes decir con seguridad que se trata de una de sus hijas, Cecilia, a quien su santísima madre obligó a entrar en un convento contra su voluntad siendo muy joven. Aunque no es un premio tan grande como la propia Birgitta, Cecilia parece una joven decidida y potencialmente útil. ¿Una candidata adecuada para el $pod_Embrace$?"
 podgreatpersons.0012.t: "¿Catalina de Siena?"
 podgreatpersons.0012.desc: "Has oído hablar de Catalina de Siena, una joven santa que se ha hecho un nombre como fuerza errante de Dios, quizás la defensora más ardiente de la Iglesia de Roma en la actualidad, aunque a veces parezca estar en desacuerdo. Como tal, te sorprendió que otra mujer saliera a la luz recientemente, afirmando ser la presunta hermana muerta de Catalina, Bonaventura. Parece que ha sobrevivido hasta ahora con métodos que es mejor no mencionar y que ahora desea desaparecer de la historia, ya que su «muerte» fue una profunda lección de guía para Catalina. Es una petición inusual, ya que parece que la mujer sigue siendo muy ferviente en su amor por Dios y por su hermana, pero no lo suficiente como para quitarse la vida. Reflexionas sobre tu próximo movimiento."
 podgreatpersons.0013.t: "¿Clara de Asís?"
 podgreatpersons.0013.desc: "Un rival menor tuyo ha realizado un movimiento audaz contra San Damián, la iglesia donde la santa Clara de Asís reside con sus hermanas en la fe. Obviamente, el necio y sus secuaces no sobrevivieron a la Fe Verdadera que impregna la zona, pero lograron causar un gran alboroto. Parece que una de las hermanas de Clara, Beatrix, se «perdió» durante el asalto. Aunque no tienes ninguna posibilidad contra la propia y piadosa Clara, abrazar a su hermana supondría un golpe moral para la Iglesia..."
 podgreatpersons.0014.t: "César Borgia"
 podgreatpersons.0014.desc: "César Borgia, el despiadado italiano, está liderando actualmente un difícil asedio en Viana. El hombre ha demostrado ser inmensamente ingenioso hasta ahora, con muchas victorias y traiciones a su nombre durante sus campañas en Italia. Con la muerte de su padre Rodrigo y el ascenso de un nuevo y hostil Papa, empieza a verse acorralado por sus muchos enemigos. No habría mejor momento para actuar si deseas tener un Chiquillo prestigioso propio. Después de todo, cualquier cosa puede pasar durante un asedio..."
 podgreatpersons.0015.t: "Christine de Pizan"
 podgreatpersons.0015.desc: "Un espectáculo común en las cortes francesas durante décadas, la famosa escritora y maestra Christine de Pizan se ha trasladado recientemente a un convento para los últimos años de su vida mortal. Su obra ha recibido grandes elogios en muchos círculos, incluidos los $pod_cainite$, ya que profundiza en la verdadera definición del mandato, visiones optimistas sobre el futuro y el lugar de la mujer en la historia de Francia. Puede que su cuerpo se esté debilitando, pero su mente parece tan aguda como siempre, ya que recientemente ha publicado un poema sobre el destino de Juana de Arco. Algunos de tus cortesanos fantasean con la idea de integrarla en la sociedad $pod_cainite$. Para salvaguardar su talento, por supuesto."
 podgreatpersons.0016.t: "Cola di Rienzo"
 podgreatpersons.0016.desc: "La Roma mortal ha estado en un alboroto aún mayor de lo habitual últimamente. La causa principal es un tal Cola di Rienzo, un plebeyo que ha logrado convertirse en líder de la ciudad por puro carisma... dos veces. Sueña con un nuevo Imperio Romano, claramente embriagado de sus propios delirios de grandeza. El hombre también parece bastante pusilánime en lo que respecta a la guerra y es fácil de intimidar. Tus agentes dudan de si realmente tiene talento o si solo tiene una suerte demencial. El hecho es que la turba romana claramente se está volviendo contra él, una oportunidad para que tú realices el $pod_Embrace$ de un Chiquillo improbable, pero quizás útil."
 podgreatpersons.0017.t: "Dante Alighieri"
 podgreatpersons.0017.desc: "Aunque tu corte y tus iguales no lo comprenden, te has encariñado con una epopeya publicada recientemente llamada «La Divina Comedia». Tiene... algo que llega a lo más profundo de tu alma, especialmente en tu condición, como si el autor supiera más de lo que un mortal debería sobre dioses y demonios. Este hombre, Dante Alighieri, está pasando por una mala racha, tras haber sido exiliado y abandonado por la mayoría de sus antiguos aliados políticos. Es poco probable que a nadie le importe si sufre algún accidente desafortunado... Y entonces, podrías traerlo a tu corte y obtener las respuestas que buscas. Después de todo, una vida inmortal debería ser tiempo suficiente para comprender lo Divino."
 podgreatpersons.0018.t: "Diane de Poitiers"
 podgreatpersons.0018.desc: "Diane de Poitiers ha sido el verdadero poder tras el trono de Francia durante casi 25 años. Por lo que puedes saber, no ha conspirado ni matado realmente para alcanzar esta posición... lo que la habría convertido en una candidata perfecta para el $pod_Embrace$. Aun así, no se llega a ser tan poderosa en Francia sin un intelecto astuto y un gran sentido político, cualidades que a la favorita real le sobran. Con la reciente muerte de Enrique II, su principal rival, Catalina de Médici, ya ha intervenido para eliminar todo el poder y los bienes que el rey le otorgó. Diane no parece decidida a tomar represalias y parece aceptar su destino de caer en el olvido. Podría ser un buen momento para asegurarte un consejero principal propio..."
 podgreatpersons.0019.t: "¿Eduardo I?"
 podgreatpersons.0019.desc: "El último rey de Inglaterra, Eduardo I, murió hace cuatro años. Seguiste su vida con interés, ya que era un renombrado legislador, un político astuto y un general capaz, todas ellas cualidades valoradas en la sociedad $pod_cainite$... con un toque de miedo y brutalidad, por supuesto, cualidades que también poseía el difunto rey. Abrazarlo siempre estuvo descartado, debido a la protección de los agentes de la Iglesia que reciben los reyes, pero recientemente has oído que Henry de Lacy, su compañero más fiel, muestra signos de dejar su cuerpo mortal. Siendo él mismo un hombre leal y capaz, podría ser un buen testigo de las tácticas de Longshanks, o incluso un candidato para el $pod_Embrace$."
 podgreatpersons.0020.t: "Erzsebet Bathory"
 podgreatpersons.0020.desc: "Uno de tus agentes regresó del castillo de Csejte con un informe inquietante: parece que Erzsebet Bathory, la mujer acusada de más de 600 asesinatos, de bañarse en sangre de vírgenes y de canibalismo, no es en realidad una vampiro... todavía. Su juicio fue un asunto despiadado, capaz incluso de inquietar al $pod_cainite$ más resistente con relatos detallados de sus prácticas de tortura, que incluyen quemaduras, congelación, el uso de hormigas vivas o la evisceración. A veces, todo a la vez. Pero si no es una vampiro... eso significa que sería una excelente, aunque quizás un poco desequilibrada, candidata para el $pod_Embrace$."
 podgreatpersons.0021.t: "¿Isabel de Hungría?"
 podgreatpersons.0021.desc: "Un rival menor tuyo ha hecho recientemente un movimiento contra Konrad von Marburg, un renombrado inquisidor y antiguo mentor de la recientemente fallecida Santa Isabel de Hungría. El necio fue aplastado, pero las secuelas son complicadas, con rastros que conducen a más pistas sobre la «Conspiración del $pod_cainite$». Una de ellas es una mujer joven, otra pupila del inquisidor, que presenció de primera mano los dones de Caín. Hacerla desaparecer causaría Sospecha, pero podría ser útil, tanto como un golpe contra la Inquisición como como una potencial candidata al $pod_Embrace$. Curiosamente, la mujer también se llama Isabel y parece tener una edad cercana a la que la Santa debería tener en este momento. Quizá Konrad tenga sus propios secretos..."
 podgreatpersons.0022.t: "Ernst von Manfeld"
 podgreatpersons.0022.desc: "Tus agentes informan de que Ernst von Manfeld, el infame líder mercenario, se encuentra actualmente en Bosnia, aparentemente con una enfermedad terminal. Este astuto alemán se ha hecho un nombre como un hombre a sueldo hábil, aunque no del todo fiable. Es bastante conocido por haber luchado en el bando protestante durante la Guerra de los Treinta Años... a pesar de considerarse un católico devoto. Con su excelente pedigrí militar y... su mentalidad abierta, podría ser un candidato interesante para el $pod_Embrace$."
 podgreatpersons.0023.t: "Eustace Folville"
 podgreatpersons.0023.desc: "La llamada banda de «Folville» ha sido el tema de conversación en Inglaterra durante décadas. Probablemente no sean mucho mejores que simples matones; estos forajidos tuvieron la buena fortuna, o la habilidad, de atacar a miembros del séquito de Eduardo II. El rey, por muy despreciado que sea, no logra convencer a nadie de que la banda de Eustace no sea una especie de grupo popular de figuras heroicas. Tras muchos años de investigación, tus agentes finalmente han rastreado al envejecido forajido. Ahora tienes la posibilidad de adquirir para ti a un hábil combatiente y agitador."
 podgreatpersons.0024.t: "Fibonacci"
 podgreatpersons.0024.desc: "Una nueva moda está llegando a los mortales. El sistema de numeración «indoarábigo» está empezando a utilizarse por encima del romano, el antiguo y, en tu opinión, obviamente superior. Estás bastante seguro de que los mortales recobrarán el sentido a su debido tiempo, pero tienes curiosidad por el proponente de esta teoría, un tal Leonardo Bonacci, también conocido como Fibonacci. El ahora anciano se ha establecido en Pisa tras publicar su tratado. No puedes negar el conocimiento del hombre y podrías «invitarlo» a tu corte para un debate. ¿O quizás para fines más... familiares?"
 podgreatpersons.0025.t: "Florian Geyer"
 podgreatpersons.0025.desc: "La mortal Guerra de los Campesinos ha sido una molesta espina en tu costado durante algún tiempo, ya que conseguir comida se vuelve más difícil cuando los campesinos mueren por millares en una guerra. Sin embargo, se ha presentado una oportunidad en la forma de Florian Geyer, el noble caído en desgracia que lidera la «Compañía Negra», una unidad de caballería pesada que luchó junto a los campesinos. Aunque ya es un héroe popular para el pueblo llano, Geyer también es despiadado y se enfurece con facilidad, lo que lo convierte en un elemento impredecible en la naturaleza. Y todo parece indicar que, tras su última derrota en Ingolstadt, tus agentes pudieron localizar su ubicación. Acorralado y en el lado perdedor de la Historia, solo es cuestión de tiempo antes de que Geyer se enfrente a la muerte. Pero si decidieras intervenir..."
 podgreatpersons.0026.t: "Galeazzo Maria Sforza"
 podgreatpersons.0026.desc: "En estos últimos años te has entretenido con las historias de un tal Galeazzo Maria Sforza, el duque mortal de Milán. Un hombre con una imaginación vívida que ha creado muchas formas nuevas de tortura, tanto psicológicas como físicas. Tu corte se divirtió especialmente con la de «clavar a un hombre vivo en su ataúd». Obviamente, esto no le ha hecho ganar muchos amigos en Milán y alrededores, y es lógico pensar que pronto será apartado del poder, probablemente de forma violenta. Estás considerando la idea de organizar su muerte tú mismo para luego traerlo a tu corte. Como mínimo, podría ser un vampiro muy animado..."
 podgreatpersons.0027.t: "Geoffrey Chaucer"
 podgreatpersons.0027.desc: "Te han informado de que el famoso poeta y funcionario, Geoffrey Chaucer, ha sido emboscado por bandidos y herido durante el ataque. El hombre ya no es joven y sus días de gloria pasaron con la abdicación de su mecenas, Ricardo II. Aun así, es un diplomático hábil y un poeta prodigioso, uno de los primeros en utilizar el inglés medio como recurso literario. Una persona tan culta tanto en política como en poesía merece cierto interés como posible Chiquillo."
 podgreatpersons.0028.t: "Gilles de Rais"
 podgreatpersons.0028.desc: "Uno de los compañeros de Juana de Arco, Gilles de Rais, ha caído muy bajo recientemente. Tras perder su fortuna y cualquier buena voluntad de sus pares, el noble parece haber recurrido a patrones más... demoníacos. Su juicio ha sido un asunto sórdido, con testimonios de asesinatos con un grado de crueldad que incluso la mayoría de los $pod_cainites$ encontrarían desagradable. La veracidad de las acusaciones es difícil de confirmar ya que, después de todo, incluso los mortales conspiran unos contra otros. Lo cierto es que Gilles se enfrentará a la muerte por horca muy pronto... a menos que intervengas y lo sustituyas por otra pobre alma. Para ser un humano, Gilles ciertamente ha mostrado potencial como candidato al $pod_Embrace$..."
 podgreatpersons.0029.t: "Girolamo Savonarola"
 podgreatpersons.0029.desc: "Florencia ha estado sumida en el caos recientemente, cuando un fraile dominico, Savonarola, destronó a los gobernantes Médici predicando visiones de gloria para la buena gente, y ruina para sus enemigos. Este hombre ha demostrado ser resiliente, resistiendo los intentos de excomunión de la Iglesia e incluso apaciguando al rey de Francia en una pseudoalianza. Sin embargo, su suerte se ha agotado últimamente, ya que arruinó la prueba de fuego destinada a demostrar su llamado divino ante el pueblo de Florencia. Ahora encarcelado por una turba enfurecida y sin ningún apoyo, el que fuera gobernante de facto de Florencia se enfrentará pronto a la muerte por fuego... a menos que intervengas. Ciertamente, Savonarola tiene talento para hacer que la gente le siga, y esa es una cualidad valiosa en la política de $pod_cainite$."
 podgreatpersons.0030.t: "Gottfried von Berlichingen"
 podgreatpersons.0030.desc: "El líder mercenario Gottfried —Gotz— von Berlichingen se ha convertido en el tema de conversación de tu corte últimamente. Se sabe que el colérico y malhablado alemán guarda rencores durante mucho tiempo, y es aún más famoso por haber perdido el brazo durante un asedio. Un hecho que no detuvo a Gotz por mucho tiempo, ya que rápidamente utilizó un extraño dispositivo de hierro para reemplazarlo y volver al campo de batalla. Tras una larga carrera de guerras, capturas y heridas, la «Mano de Hierro» finalmente está empezando a mostrar su edad y ha regresado a su patrimonio familiar para pasar sus últimos días en paz. Tu corte sostiene que un individuo tan tenaz y experimentado sería un gran activo para tu causa, sin duda justa, como gobernante de la noche."
 podgreatpersons.0031.t: "Hadewijch"
 podgreatpersons.0031.desc: "Te ha llegado la noticia de una noble viajera llamada Hadewijch que pasa por tu ciudad. Aunque su investigación no reveló mucho sobre su pasado, tus agentes la describen como una hábil poetisa y escritora con el aspecto de alguien que ha enfrentado mucho en su vida, pero que aún resiste. Esta personalidad fuerte y su formación culta la convierten en alguien digno de vigilar, y quizás incluso de considerar como candidata al $pod_Embrace$."
 podgreatpersons.0032.t: "Hermann von Salza"
 podgreatpersons.0032.desc: "El Gran Maestro de la Orden Teutónica ha sido un enorme dolor de cabeza para los $pod_cainites$ en Alemania desde el inicio de su mandato. Ni siquiera la Cruz Negra, la orden de caballeros $pod_cainite$ alemanes, pudo traspasar la Fe Verdadera que protege a este hombre. Como tal, y con sus impresionantes talentos tanto como comandante como diplomático, Hermann ha sido capaz de frenar la mayor parte de la influencia $pod_cainite$ en su orden. Sin embargo, algo ha cambiado recientemente, ya que los caballeros teutónicos han emprendido una rebelión silenciosa que lo está relegando a un papel de mera figura decorativa. A medida que la vejez le alcanza y el trabajo de su vida se desmorona, la fe de Hermann disminuye. Esta podría ser la mejor oportunidad para una dulce e irónica venganza contra este soldado de la Iglesia..."
 podgreatpersons.0033.t: "Ibn Arabi"
 podgreatpersons.0033.desc: "Uno de los hombres más cultos del mundo musulmán se ha trasladado recientemente a Damasco. Ibn Arabi es un renombrado erudito, místico y filósofo con casi 850 obras atribuidas. Incluso el mundo $pod_cainite$ ha tomado nota, con varios debates surgiendo sobre su verdadero conocimiento de los mecanismos internos del mundo. Ahora, siendo un anciano, parece que Ibn Arabi intenta frenéticamente terminar su segundo borrador de la Futuḥat al-Makkiyya antes de que la muerte lo alcance. Conceder el don de la inmortalidad a un individuo así es tentador, incluso si sabes que la maldición de Caín puede cambiar profundamente a una persona..."
 podgreatpersons.0034.t: "Ibn Khaldun"
 podgreatpersons.0034.desc: "El renombrado erudito, político e historiador Ibn Khaldun se encuentra, una vez más, amenazado por sus numerosos enemigos. El viejo aventurero ha experimentado una vida de conjuras, conquistas militares y muchos y prestigiosos cargos gubernamentales. Aun así, es más conocido por su notable obra sobre la naturaleza cíclica de los imperios, lo que le ha convertido en uno de los enviados para parlamentar con el amenazante señor mongol, Timur. Tras haber regresado recientemente, su lealtad a un partido político secreto está volviendo para atormentarlo y sus días parecen contados, tanto por su propensión a los problemas como por la vejez. Algunos de tus cortesanos te instan a considerarlo como un posible Chiquillo antes de que sea demasiado tarde."
 podgreatpersons.0035.t: "Imperia Cognita"
 podgreatpersons.0035.desc: "La «Reina de las cortesanas» ha sido una presencia bienvenida en Roma desde su llegada. Una mujer astuta, logró abrirse paso hasta la cima de las celebridades más famosas de Roma: las cortesanas. Adorada tanto por el clero como por los artistas, como Rafael, es una presencia rica e influyente en la Ciudad Santa. Sin embargo, parece que esto está llegando a su fin, ya que actualmente está librando, y perdiendo, una batalla contra un veneno que, al parecer, se ha administrado ella misma. Aunque no estás seguro de por qué intentó suicidarse, tal vez por una mezquina razón mortal como el «amor verdadero», sabes que esta es una oportunidad para $pod_Embrace$ a alguien que debería encontrar fácilmente su lugar en las cortes de la noche."
 podgreatpersons.0036.t: "¿Jan Hus?"
 podgreatpersons.0036.desc: "El «movimiento husita» ha sido una gran preocupación para los $pod_cainites$ recientemente. Algunos están entusiasmados con la idea de que la Iglesia se desmorone, otros parecen genuinamente interesados en esta teoría reformista. El líder del movimiento, el propio Jan Hus, no tiene mucha vida por delante, ya que su juicio muy probablemente resulte en su pronta ejecución. Un grupo de jóvenes $pod_cainites$ «husitas» ha organizado un audaz rescate del prisionero... y ha fracasado estrepitosamente. Tras el incidente, sin embargo, tus agentes notaron a un hombre solitario vagando por las calles, afirmando ser el propio predicador. Es muy poco probable, ya que el juicio continúa con normalidad, pero podría ser un discípulo de Hus, conmocionado por el ataque. En cualquier caso, como superviviente de un asalto $pod_cainite$, representa una amenaza para tu secreto..."
 podgreatpersons.0037.t: "Jan Zizka"
 podgreatpersons.0037.desc: "Has estado siguiendo de cerca la carrera de un brillante general llamado Jan Zizka. Este líder husita ha demostrado ser inmensamente capaz, convirtiendo a una banda de campesinos en una fuerza capaz de derrotar a los mejores caballeros de Europa mediante tácticas innovadoras. Especialmente con la llegada de lo que se conoce como «pólvora», un nuevo y mortal arma que podría causar problemas a los de tu clase. Te has enterado de que Zizka está de nuevo en campaña, pero la peste le ha alcanzado y sus días parecen contados. Consideras seriamente montar una operación para traerlo a tu corte, ya que sería un valioso líder militar y alguien que podría explicarte de primera mano el peligro de estas nuevas armas."
 podgreatpersons.0038.t: "Madame de Pompadour"
 podgreatpersons.0038.desc: "Francia tiene una larga tradición de poderosas amantes y confidentes para sus reyes. Pero debes admitir que lo que te han contado de Jeanne Antoinette Poisson es extraordinario. La amante real, que luego pasó a ser «amiga del rey» cuando pasaron a tener una relación más casta, ha tenido tanto poder como Luis XV en los últimos años, si no más. Su carisma, su perspicacia política y su sólida red de amigos la han hecho poderosa... y odiada en muchos círculos de la corte. Sin embargo, esto está llegando a su fin, ya que su frágil constitución finalmente ha vencido su determinación, con una enfermedad que probablemente no sobreviva. La Francia mortal perderá una joya, pero quizás la Francia $pod_cainite$ podría ganar una..."
 podgreatpersons.0039.t: "Jeanne de Clisson"
 podgreatpersons.0039.desc: "Tus agentes te informan de que la infame «Leona de Bretaña» y sus hijos han naufragado recientemente en una zona remota. La Leona es Jeanne de Clisson, una noble bretona que ha jurado venganza al rey de Francia por la cobarde ejecución de su marido hace más de 10 años. Desde entonces, ha estado realizando corso con un éxito sorprendente contra las flotas francesas cerca de Bretaña. Una mujer obstinada y práctica, conocida por dejar solo a un superviviente cada vez para que cuente la historia, ha impresionado a muchos de tus cortesanos. Su reciente derrota y su aislamiento de sus aliados y tripulantes te dan la oportunidad de «invitarla» a tu corte. Quizás podrías usar a tal Leona como una Chiquilla..."
 podgreatpersons.0040.t: "¿Jeanne d'Arc?"
 podgreatpersons.0040.desc: "La «Doncella de Orleans» ha sido un gran problema para los $pod_cainites$ mientras la guerra arrecia entre Francia e Inglaterra. Lo que era una gran oportunidad para intrigar con facilidad y alimentarse más fácilmente se ha convertido en una guerra casi religiosa. La Fe Verdadera se extiende sin control, y has perdido la cuenta del número de $pod_cainites$ quemados por los fanáticos que acuden en masa bajo el estandarte de Jeanne. Ella misma es inexpugnable, protegida por una convicción que parece divina por naturaleza pero... sus parientes cercanos no lo son. Es mezquino, pero podrías vengarte de su familia por todos los dolores de cabeza que te ha causado, especialmente ahora que los ingleses finalmente la han atrapado, dejándola, con suerte, inofensiva. Y con un poco de suerte, incluso podrían convertirlos en peones útiles."
 podgreatpersons.0041.t: "John Cabot"
 podgreatpersons.0041.desc: "Estamos en una época de cambios y exploración, dos cosas que los $pod_cainites$ no están capacitados para manejar. A medida que Europa lanza más y más expediciones hacia el gran desconocido, los de tu clase se preguntan qué tipo de horrores, y oportunidades, les aguardan. Estás decidido a no quedarte atrás y, como tal, has hecho indagaciones sobre uno de los más grandes exploradores de la era, John Cabot. Este impávido capitán de barco ha regresado recientemente de uno de sus muchos viajes al gran oeste y probablemente podría realizar muchos más con un patrón inmortal como tú. Concederle la inmortalidad también es una opción, una que podría darte una ventaja considerable en el futuro, tanto aquí como más allá del vasto océano azul."
 podgreatpersons.0042.t: "John Hawkwood"
 podgreatpersons.0042.desc: "Los Condottieri son una realidad en Italia. Estos hombres cobran por hacer la guerra a los ricos estados italianos y suelen ser tan volubles en su lealtad como codiciosos por las monedas. Uno de sus líderes, el inglés John Hawkwood, ha desarrollado la mayor parte de su carrera aquí, luchando por y contra muchas ciudades. Un hombre despiadado y codicioso según la mayoría de los relatos, también es aclamado como uno de los mejores comandantes y estrategas del grupo. A medida que la edad le pasa factura y tras haber completado lo que debería ser su última expedición, algunos de tus cortesanos argumentan que este sería un buen momento para acercarse a él. La promesa de la inmortalidad seduciría fácilmente a un hombre así y podría resultar útil... si logras vincularlo a tu voluntad."
 podgreatpersons.0043.t: "Leonardo da Vinci"
 podgreatpersons.0043.desc: "Desde hace algún tiempo, Francisco I se ha encariñado bastante con un artista italiano, llegando incluso a regalarle un castillo para su uso personal. Has espiado al hombre y debes reconocer el puro genio que posee en múltiples campos. Sin embargo, no eres el único que lo admira, pues parece haber una cábala de manipuladores vigilándolo de cerca, haciendo imposible cualquier contacto cercano. Recientemente, sin embargo, te has enterado de que la salud de Leonardo está decayendo, lo que ha empujado al rey a programar una visita a su viejo amigo. Esta podría ser tu mejor oportunidad para «invitar» a la mente más brillante de esta generación a tu corte..."
 podgreatpersons.0044.t: "Lucrezia Borgia"
 podgreatpersons.0044.desc: "Siempre estás en busca de posibles candidatos para el $pod_Embrace$, y a la familia Borgia no le faltan. Lucrezia, hija del Papa Alejandro VI, ha sido un gran activo para su padre y su hermano. Bella, inteligente y de voluntad fuerte, es la princesa perfecta del Renacimiento. Los rumores de envenenamientos e intrigas despiadadas que la rodean son un punto a favor en tu lista, ya que la harían aún más apta para la no-muerte. Tus agentes esperan tus órdenes."
 podgreatpersons.0045.t: "Marco Polo"
 podgreatpersons.0045.desc: "El mundo $pod_cainite$ es vasto y siempre estás ansioso por aprender más sobre qué extraños amigos, o muy probablemente enemigos, podrías hacer en el extranjero. Ha surgido una oportunidad con un mercader veneciano llamado Marco Polo. Presuntamente, el hombre que ahora lleva una vida familiar tranquila ha viajado hasta Catay durante varias décadas. Es probable que haya recopilado información o pistas interesantes sobre el mundo nocturno en el extranjero durante este tiempo. Obviamente, podrías limitarte a leer sus notas, pero también podrías hacer algo mucho mejor... Tus agentes están listos para visitar la propiedad de los Polo bajo tu mando."
 podgreatpersons.0046.t: "Margarita I"
 podgreatpersons.0046.desc: "Durante casi 20 años, Borgoña y Flandes han estado gobernadas por Margarita Capeto. La muerte prematura de su marido y su fuerte influencia sobre su hijo la han convertido en una fuerza a tener en cuenta en la región. De voluntad firme, no es la gobernante más amable, como pueden atestiguar las numerosas rebeliones que han surgido y sido aplastadas durante su reinado. Aun así, es una estadista capaz con una mente capaz de soportar los rigores de la no-muerte y, por ello, estás considerando una audaz operación para darle el $pod_Embrace$ antes de que la muerte se la lleve."
 podgreatpersons.0047.t: "Michael Scot"
 podgreatpersons.0047.desc: "El consejero científico y astrólogo de la corte del emperador Federico II es un extraño inglés llamado Michael Scot. Este individuo evidentemente culto es acusado a menudo de practicar la magia negra, ya que parece saber más sobre el funcionamiento interno del mundo de lo que cualquiera debería. Por lo que puedes ver, sin embargo, no está poseído por ninguna fuerza sobrenatural... todavía. Su conocimiento sobre el Cielo y Dios es de especial interés para ti, un ser maldito por el propio Creador, y te preguntas si Scot podría ser un activo en este empeño. Separarlo de la corte del Emperador y fingir su muerte como un accidente no sería fácil, pero está en tu poder."
 podgreatpersons.0048.t: "Mindaugas"
 podgreatpersons.0048.desc: "La Lituania mortal se está convirtiendo lentamente al cristianismo, como han hecho antes muchos países orientales. Aquí, sin embargo, el proceso es sangriento e implacable, con las religiones nativas luchando contra las órdenes sagradas. Un punto de inflexión se ha alcanzado quizás con la coronación de Mindaugas, el primer rey de Lituania, con su bautismo en la Iglesia. Lejos de ser un fanático, ya ha cambiado de religión varias veces mientras luchaba contra los tártaros y duques rivales por la corona. Aunque sin duda es cínico, Mindaugas ha logrado mucho militar y administrativamente y, por tanto, cuando te enteras de una conspiración mortal para matarlo por una venganza mezquina, consideras tus opciones. Abrazar a un rey siempre es arriesgado, pero su base de poder es lo suficientemente débil como para que pudieras tener éxito."
 podgreatpersons.0049.t: "Niccolò Machiavelli"
 podgreatpersons.0049.desc: "Te ha fascinado un manuscrito que te han regalado recientemente. «El Príncipe» es un estudio perfecto de la política y el gobierno del $pod_cainite$... ¡y fue escrito por un mero mortal! Este Machiavelli está lejos de recibir la fama que crees que merece, con su obra maestra siendo destrozada por preocupaciones mezquinas de «moralidad» y «gobierno justo». Si los mortales no pueden apreciar el genio detrás de esta obra, ciertamente podrías ofrecerle un trato mejor. Un trato de inmortalidad..."
 podgreatpersons.0050.t: "Nicolaas Zannekin"
 podgreatpersons.0050.desc: "Flandes ha estado plagada de revueltas campesinas desde hace varios años. Ciertamente es una oportunidad para los $pod_cainites$ ya que, después de todo, alimentar es mucho más fácil en tiempos de guerra. Esta revuelta específica es extrañamente duradera, en lo que respecta a las disputas mortales, y sorprendentemente exitosa con la captura de varias ciudades y del propio conde. No tienes duda de que será aplastada con el tiempo pero... esta resistencia es la señal de un buen líder al mando de los campesinos. Quizás podrías enviar a algunos de tus agentes a «indagar» sobre el líder rebelde durante la próxima batalla..."
 podgreatpersons.0051.t: "Nikephoros Blemmydes"
 podgreatpersons.0051.desc: "La caída de Constantinopla ha provocado la pérdida de muchos grandes eruditos. Algunos, sin embargo, han sido capaces de prosperar en las caóticas secuelas, como Nikephoros Blemmydes. Maestro, escritor y teólogo, se ha establecido en Nicea, donde el emperador le ofrece un amplio mecenazgo. Ya ha enseñado a muchas figuras importantes, como el Príncipe, y está considerando retirarse para vivir el resto de su vida en la serena paz de un monasterio. Tales faros de la cultura tardorromana son cada vez más raros a medida que la fortuna del imperio disminuye. Como tal, estás considerando regalarle la inmortalidad, para preservar al menos esa pequeña parte de ella."
 podgreatpersons.0052.t: "Pons de Capduelh"
 podgreatpersons.0052.desc: "Las Cruzadas han sido un golpe terrible para la región que gobiernas, pero tienen la ventaja de traerte a algunas personas interesantes. Un Pons de Capduelh, por ejemplo, un trovador de Auvernia, ha sido el tema de conversación en tu corte durante un tiempo. Un tipo encantador y optimista, con un ingenio rápido y una palabra aún más rápida, parece capaz de cautivar incluso al cruzado más severo con audaces canciones de amor y caballería. Tal talento ciertamente podría tener utilidad en la política de los $pod_cainite$, donde una lengua de plata puede llevarte muy lejos."
 podgreatpersons.0053.t: "Rodrigo Borgia"
 podgreatpersons.0053.desc: "El Papado siempre ha sido un dolor de cabeza para los vampiros; el puro poder de la Fe Verdadera que emana de él hace que cualquier incursión sea imposible. Esto ha cambiado un poco con el Papa actual, Alejandro VI, quien parece mucho más preocupado por los asuntos terrenales que por las preocupaciones espirituales. También ha tenido bastante éxito en ello, extendiendo el área de influencia de los Estados Pontificios y el poder de su familia mediante conquistas y una diplomacia astuta. Su espiritualidad, poco brillante, te ofrece una oportunidad única en una vida inmortal: podrías enviar agentes a la propia Sede Santa para «salvar» a Rodrigo Borgia, actualmente postrado en cama por una intoxicación alimentaria o un envenenamiento. Entonces, una vez oculto en tu corte, tendrías a un Papa solo para ti..."
 podgreatpersons.0054.t: "Roi Xordo"
 podgreatpersons.0054.desc: "Galicia es un país en sí mismo a pesar de estar gobernada por el Rey de Castilla. Esta región aislada es el hogar de gobernantes muy autocráticos, incluso para los estándares de la época. Estos nobles suelen ser descuidados con la población común y hace cuatro años se alcanzó un punto crítico con el inicio de una revuelta. Los rebeldes están liderados por un Fidalgo menor —un título de nobleza inferior— llamado Roi Xordo. El hombre ha logrado algunos éxitos iniciales, pero el viento está cambiando, ya que las tropas más experimentadas de la nobleza están reprimiendo duramente la rebelión. Aunque parecen destinados al fracaso, quizás su líder aún podría serte de alguna utilidad. Un Chiquillo apasionado y con mentalidad militar tiene su encanto..."
 podgreatpersons.0055.t: "Skanderbeg"
 podgreatpersons.0055.desc: "Los otomanos han sido una preocupación importante para Europa desde hace un tiempo. La derrotada cruzada de Varna y la caída de Constantinopla allanaron el camino para una mayor expansión por su parte. Pero, durante casi 25 años, han sido frustrados por un hombre llamado Skanderbeg, quien, con un número insignificante de tropas, ha logrado detener la poderosa maquinaria de guerra turca. Ya aclamado como héroe en toda Europa, el anciano general está una vez más al frente de una nueva coalición, pero una enfermedad mortal se ha apoderado de él. Sin esperanza de recuperación, te preguntas si este sería un buen momento para «salvarlo» y traerlo a tu corte. Después de todo, sería una lástima perder a un defensor tan brillante."
 podgreatpersons.0056.t: "Snorri Sturluson"
 podgreatpersons.0056.desc: "Islandia es una tierra remota, incluso para otros escandinavos, pero ha llamado tu atención con la historia de un tal Snorri Sturluson, aparentemente el político más poderoso de la isla. Erudito de la mitología nórdica, Snorri ha navegado por la caótica política islandesa y noruega durante décadas, pero parece que el Rey de Noruega ya ha tenido suficiente. Uno de tus agentes informa que hay una conspiración de asesinato en marcha contra el legislador islandés. No es de tu interés, por supuesto, pero existe la opción de salvar a Snorri y traerlo a tu corte si lo deseas. Podría ser un candidato interesante para el $pod_Embrace$."
 podgreatpersons.0057.t: "Subutai"
 podgreatpersons.0057.desc: "La Horda Mongola ha arrasado con todos sus enemigos desde China hasta Polonia. Políticamente, Gengis Kan es ciertamente el factor principal, pero militarmente, Subutai, su principal estratega, es el hombre detrás de escena. Habiendo orquestado más de 20 campañas y ganado 65 batallas, el leal general ya es famoso en todas las estepas. A la avanzada edad de 72 años, Subutai finalmente ha decidido retirarse del campo de batalla, ofreciéndote una oportunidad de oro para darle el $pod_Embrace$ sin los ojos indiscretos de todo un ejército."
 podgreatpersons.0058.t: "¿Teresa de Ávila?"
 podgreatpersons.0058.desc: "Iberia se ha vuelto bastante incómoda para los vampiros desde el inicio de la Inquisición española. Has intentado muchas conjuras, grandes y pequeñas, para reducir la influencia de la Iglesia, y estaba funcionando bastante bien hasta que apareció Teresa de Ávila. Esta monja obstinada ha reformado y reavivado casi por sí sola la pasión por el cristianismo en los corazones mortales de Iberia. Has puesto muchos obstáculos en su camino, incluyendo a tus agentes en la Inquisición y la Iglesia, pero sin éxito. Por ahora, estás dejando pasar el asunto y cubriendo tus huellas. El último paso para hacerlo es «encargarse» de tu protegido Legado Papal, Egidio Cajal, que ha estado huyendo de tu Furia desde su fracaso al intentar detenerla. Pero nadie escapa a tu alcance por mucho tiempo..."
 podgreatpersons.0059.t: "Theodore Metochites"
 podgreatpersons.0059.desc: "La política romana es voluble y la fortuna de un hombre puede cambiar fácilmente. Uno de esos hombres es Theodore Metochites, el favorito del difunto emperador Andrónico II. Erudito, mecenas de las artes y diplomático de renombre, Theodore debió la mayor parte de su carrera a su talento personal, pero también a su amistad con las personas adecuadas. Cuando Andrónico fue destituido del poder, Metochites perdió todo crédito en la corte y ahora vive recluido en un monasterio para pasar el resto de su vida. Algunos de tus cortesanos piensan que ese final es un desperdicio criminal de un hombre talentoso, y tú podrías intervenir, quizás recuperando en el proceso a un agradecido posible Chiquillo."
 podgreatpersons.0060.t: "Theodora Palaiologina"
 podgreatpersons.0060.desc: "Constantinopla ha sido reconquistada por los restos de Roma tras casi 60 años de dominio latino. Se está llevando a cabo un periodo de ardua restauración, encabezado por la propia Emperatriz, Theodora Palaiologina. Una firme matriarca de la renovada familia imperial, ha capeado muchas tormentas políticas y religiosas. La muerte prematura de su marido la dejó en una posición de poder relativo que utilizó para impulsar un sabio mecenazgo y obras arquitectónicas. Es un símbolo poderoso del regreso de los griegos al poder y sabes que muchos de tus rivales quieren interferir con ella. Si deseas actuar para tener este símbolo solo para ti, el momento es ahora."
 podgreatpersons.0061.t: "Theodor von Neuhoff"
 podgreatpersons.0061.desc: "Un personaje colorido ha llegado recientemente a Zutphen. Este hombre, Theodor von Neuhoff, está lisiado por las deudas de las que se recuperó vendiendo su título como... Rey de Córcega. De hecho, tras una rebelión de corta duración en la isla genovesa, los habitantes han «coronado» a este aventurero alemán como su futuro rey. Un mandato que solo tuvo durante un par de meses antes de que su «Reino» se hiciera pedazos. Y ahora, aquí está, no mucho más que un estafador colorido que lo ha perdido todo. Al menos, constituye una buena historia. Ha habido peores candidatos a Chiquillo que uno que podría entretenerte."
 podgreatpersons.0062.t: "Thibaut de Navarra"
 podgreatpersons.0062.desc: "Pocos individuos representan mejor los ideales caballerescos que Thibaut de Navarra. Ha vivido a través de intrigas mortales (y ha orquestado algunas), ha participado en una cruzada exitosa, ha amado a una mujer prohibida (una reina, nada menos) y ha escrito muchas canciones como un querido «trovador». Mientras tanto, también ha logrado ascender en la jerarquía feudal desde conde de Champaña hasta rey de Navarra, donde tuvo un reinado exitoso. Recientemente has sabido que, de regreso de un viaje a Champaña, Thibault ha caído gravemente enfermo y su escolta se ha retrasado. Esta podría ser una oportunidad única para que tus agentes «salven» al rey moribundo y lo lleven a tu corte. Un hombre tan consumado como él es un candidato interesante para el $pod_Embrace$."
 podgreatpersons.0063.t: "¿Thomas Aquinas?"
 podgreatpersons.0063.desc: "Uno de tus rivales menores ha lanzado un ataque temerario contra una mansión en Aquino. No estás del todo seguro de por qué; parece que tenía peones en la familia de allí y que han sido completamente purgados por un miembro de la casa llamado Thomas. Este hombre erudito quiere unirse a la Orden Dominicana y parece bendecido por un intelecto soberbio, trabajando ya en muchas ideas nuevas para la Iglesia. En cualquier caso, su Fe Verdadera ha reducido a cenizas a tu rival y ahora te has quedado con un lío con el que lidiar, ya que ha habido muchos testigos. El propio Thomas es inexpugnable, pero podrías empezar por hacer que su madre «desaparezca». Tus agentes piensan que la mujer es en realidad una candidata potencial para el $pod_Embrace$, habiendo utilizado tácticas mezquinas para lograr sus objetivos en el pasado."
 podgreatpersons.0064.t: "Thomas Muntzer"
 podgreatpersons.0064.desc: "La Reforma está en pleno apogeo y, si al principio pareció algo bueno para los Vampiros con el debilitamiento de la Iglesia, ahora hay incluso más hombres santos que nunca rondando por ahí. Cualquier esfuerzo por tu parte para aplastarlos ha sido, en el mejor de los casos, inconcluso. Un predicador llamado Thomas Muntzer te está dando problemas especialmente con su creación de una «Liga eterna de Dios», que consiste principalmente en un número creciente de campesinos rebeldes. Sus fervientes discursos sobre un Apocalipsis inminente te están sacando de quicio y estás considerando enviar a algunos de tus agentes durante su próxima batalla para llevarlo a tu corte. Entonces, podrás mostrarle la verdadera cara del Infierno..."
 podgreatpersons.0065.t: "¿Timur?"
 podgreatpersons.0065.desc: "El señor de la guerra conocido como Timur ha sido un problema importante para ti desde que comenzó su despiadada senda de conquistas. Autoproclamado heredero del legado de Gengis Kan, nadie ha podido interponerse en su camino hasta ahora y sus guerras han resultado en innumerables ciudades saqueadas y quemadas, lo cual no es algo bueno para los territorios de caza de un Vampiro. A medida que los refugiados $pod_cainite$ empiezan a causar problemas en tu corte, consideras una posible solución. Hasta ahora, cualquier intento de capturarlo o matarlo ha fracasado, como si estuviera protegido por alguna fuerza sobrenatural. Un curso de acción alternativo sería secuestrar a su esposa favorita y a su consejero más cercano. Con algo de suerte, esto podría retrasarlo un poco. En el peor de los casos, se sabe que ella es talentosa y hermosa, dos cualidades interesantes para un potencial $pod_Embrace$."
 podgreatpersons.0066.t: "Tomás de Torquemada"
 podgreatpersons.0066.desc: "La Inquisición ya ha estado en pleno apogeo durante bastante tiempo en el mundo de la noche. Pero, recientemente, ha reunido apoyo suficiente para propagarse en el reino mortal, con la Inquisición española siendo reconocida oficialmente por el Papa. Esto ha hecho que la vida sin alma de los $pod_cainites$ en Iberia sea aún más difícil y tus súbditos te menosprecien por no «hacer lo suficiente». La Inquisición es demasiado poderosa para derribarla ahora, pero un ataque quirúrgico contra su líder, Tomás de Torquemada, podría ser una victoria moral de la que podrías sacar provecho. Más aún si pudieras darle el $pod_Embrace$ de alguna manera..."
 podgreatpersons.0067.t: "Ulrich von Liechtenstein"
 podgreatpersons.0067.desc: "Una nueva moda está llegando a estos volubles mortales: el «amor cortés», con relatos de caballeros con armaduras brillantes y romances castos con damas casadas. Como todo lo relacionado con los mortales, esto no sobrevivirá a la prueba del tiempo, pero hasta entonces... siempre es bueno entender su capricho actual. Tus agentes recomiendan la ayuda de un tal Ulrich von Liechtenstein, un caballero errante y poeta de cierto renombre conocido como un ejemplo de caballería. El hombre tiene una lengua de plata y un brazo firme con la espada, y podría serte útil de más de una forma."
 podgreatpersons.0068.t: "Vasco da Gama"
 podgreatpersons.0068.desc: "Los contactos con Europa han aumentado últimamente gracias a los viajes de un explorador portugués llamado Vasco da Gama. Aunque el hombre habla de un comercio próspero y grandes alianzas, sus acciones dicen lo contrario. Ha masacrado a civiles en un barco musulmán de viaje y se ha vengado con una armada completa por un supuesto desaire del Rey de Zamorín. Está claro ahora que los portugueses vienen con mentalidad de conquistadores y hay que darles una lección. Capturar y abrazar al despiadado «Virrey de la India» serviría como advertencia para cualquier $pod_cainites$ europeo que intente invadir tu Tierra Natal."
 podgreatpersons.0069.t: "Wat Tyler"
 podgreatpersons.0069.desc: "Hay un aura de anticipación sobre el resultado del encuentro entre el rey Ricardo II y Wat Tyler, quienes organizan una especie de conferencia de paz entre los nobles y la revuelta campesina. Tyler ha sido el más obstinado de los líderes rebeldes, rechazando cualquier concesión hecha por el Rey hasta ahora. Estás bastante seguro de que muchas figuras importantes $pod_cainite$ se están reuniendo en las sombras del encuentro, especialmente alrededor de la amante de Tyler, una tal Patricia de Bolingbroke. Como tal, estás ansioso por enviar a algunos de tus propios agentes al lugar para asegurarte de no quedarte atrás en las conjuras de tus rivales. Lo único que queda es la cuestión de la libertad de acción de tus agentes. ¿Los enviarás con recursos y dinero suficientes para atrapar un «premio» del evento, o simplemente les ordenarás observar?"
 podgreatpersons.0070.t: "William Wallace"
 podgreatpersons.0070.desc: "Mientras la guerra por la independencia escocesa arrecia, los escoceses han perdido a uno de sus principales comandantes. William Wallace había caído en desgracia tras su derrota en Falkirk, pero seguía siendo uno de los «Guardianes de Escocia» y un poderoso símbolo para su pueblo. Elusivo desde Falkirk, se ha visto a Wallace viajando por Europa buscando apoyo para su causa hasta su regreso a Inglaterra, donde fue capturado recientemente. Ha comenzado un juicio, uno en el que el veredicto no sorprenderá a nadie. Los escoceses probablemente resistirán y se unirán tras su mártir, pero sería una lástima perder a un hombre tan decidido. Podrías mover algunos hilos y organizar un reemplazo antes de su ejecución. Entonces, sería todo tuyo..."
 podgreatpersons.0071.t: "Nagash"
 podgreatpersons.0071.desc: "Un viejo demente ha estado dando mucha guerra en Egipto últimamente. Este individuo afirma ser el «Primer Inmortal» y Emperador de «Nehekhara». Cuenta que uno de sus hechizos salió terriblemente mal y lo dejó en «nuestro mundo». Lo extraño es que conoce a los Vampiros, aunque tiene algunas concepciones erróneas sobre ellos (insiste en que solo existen 5 «linajes»). En cualquier caso, es un problema, ya que claramente es un egocéntrico y podría atraer atención no deseada hacia nosotros. Como tal, podrías enviar a algunos de tus agentes para llevarlo a tu corte y ocuparte de él tú mismo."
 podgreatpersons.0072.t: "Sa'ad al-Dawla"
 podgreatpersons.0072.desc: "Un estadista judío se ha dado a conocer por todas partes recientemente. Sa'ad ha surgido de orígenes humildes, y su asombroso dominio sobre los asuntos del Estado lo ha convertido en un activo invaluable en la corte del Kan mongol. También famoso por su amplio conocimiento médico y su patrocinio de las artes, este Gran Visir judío todavía tiene un gran defecto: su arrogancia.\nSus enemigos son abundantes, desde funcionarios mongoles azotados por corrupción hasta musulmanes que se sienten obstaculizados por un extranjero. Protegido por el Kan, Sa'ad ha logrado mantenerse un paso por delante hasta ahora, pero su suerte se está agotando, ya que su patrón ha caído enfermo recientemente. El número de conjuras para asesinarlo es incluso impresionante para los estándares $pod_cainite$. Por ello, si quieres actuar y eliminarlo de la política mortal, este es el momento. Un hombre así seguramente sería un buen candidato para el $pod_Embrace$."
 Sa_ad_al_Dawla: "Sa'ad al-Dawla"
 Abu_al_Baqa_ar_Rundi: "Abu al-Baqa ar-Rundi"
 podgreatpersons.0073.t: "Abu al-Baqa ar-Rundi"
 podgreatpersons.0073.desc: "A medida que las ciudades de al-Ándalus caen una tras otra ante la Reconquista cristiana, el legado de una Edad de Oro cae con ellas. Un escritor sevillano se ha propuesto inmortalizar la gloria de las ciudades perdidas.\n Su poema, escrito en la tradición clásica de la Ritha, es conocido como «Elegía a al-Ándalus» y ha ganado un amplio reconocimiento en los reinos magrebíes donde huyó como refugiado.\nA pesar de esto, se ha reunido poco apoyo real para ayudar a los andalusíes, y Abu al-Baqa es ahora un viejo cansado con pocas probabilidades de ver su sueño cumplido. A menos que le regalaras una eternidad para conspirar y preparar su venganza..."
 Sheikh_Bedreddin: "Sheikh Bedreddin"
 podgreatpersons.0074.t: "Sheikh Bedreddin"
 podgreatpersons.0074.desc: "El Sultanato otomano está sufriendo un brote masivo de revueltas. Aunque la situación militar parece resolverse a favor del Sultán, te interesa el líder de los rebeldes.\nEsta compleja figura, Sheikh Bedreddin, es ante todo un teólogo que predica la propiedad comunal de los bienes y la igualdad entre cristianos y musulmanes. Tampoco es ningún aficionado en asuntos militares, habiendo sido el principal juez militar del Príncipe otomano Musa. Una mentalidad revolucionaria es algo peligroso en la lenta política de los vampiros, pero aún estás considerando la idea de asegurarte de que este rebelde acabe a tu merced..."
 Alauddin_Ali_Shah: "Alauddin Ali Shah"
 podgreatpersons.0075.t: "Alauddin Ali Shah"
 podgreatpersons.0075.desc: "Bengala ha sido recientemente el escenario de una amarga Contienda por el poder entre tres Príncipes que luchan por el control del sultanato. Esta guerra te ha interesado debido a la despiadada ambición de un beligerante, Alauddin Ali Shah.\nEste hombre, que ya fue expulsado una vez de una posición de poder, ha matado y usurpado su base de poder actual con una eficiencia fría. Es difícil decir si podrá repetir esta hazaña en la guerra actual, pero un líder tan hábil y despiadado podría ser de utilidad para tu corte..."
 Birger_Jarl: "Birger Jarl"
 podgreatpersons.0076.t: "Birger Jarl"
 podgreatpersons.0076.desc: "Un consumado estadista, tanto en diplomacia como en la guerra, Birger Jarl ha sido el verdadero poder en Suecia durante varias décadas. Utilizando hábilmente a la Iglesia para promover sus propios objetivos, ha frenado el poder de la mayoría de los magnates, allanando el camino para un fuerte reino centralizado de Suecia en el futuro.\nSin embargo, el hombre no solo se mueve por la guerra y la ambición, ya que sus indagaciones sobre la fundación de una nueva ciudad en un lugar remoto llamado «Estocolmo» han dado sus frutos. La edad finalmente le está pasando factura, y el autoproclamado Duque de Suecia podría encontrarse pronto con su destino final. A menos que estés planeando otro destino para él..."
 Zawisza_Czarny: "Zawisza Czarny"
 podgreatpersons.0077.t: "Zawisza Czarny"
 podgreatpersons.0077.desc: "Has seguido la carrera de un tal Zawisza Czarny con gran interés. Este caballero polaco, conocido por su destreza en el combate y su valentía, ha sido un objetivo tentador para el $pod_Embrace$ desde hace mucho tiempo.\nGanador de muchos torneos, líder de fuerzas militares e incluso diplomático cuando llega el momento de la palabra, Zawisza posee muchos talentos útiles que estás ansioso por poner a tu servicio. Recientemente ha llamado cobarde a su Rey por huir en la batalla contra los turcos otomanos y planea continuar la guerra por su cuenta. Un movimiento valiente, aunque suicida. Ahora que ha sido apartado de la corte real y de la mayor parte del ejército, sería un buen momento para que ataques."
 Seguin_de_Badefol: "Seguin de Badefol"
 podgreatpersons.0078.t: "Seguin de Badefol"
 podgreatpersons.0078.desc: "Un mercenario al servicio de Juan II de Francia, Seguin no aceptó con agrado el fin de la guerra y, en su lugar, se dedicó al bandidaje y al saqueo. Tras capturar sesenta castillos y aplastar al ejército real, fue el gobernante de facto del este de Francia hasta que el Papa y el Rey le pagaron una suma exorbitante para que se detuviera.\nAhora rico, pero continuando con su trabajo de mercenario, Seguin fue contratado por el rey Carlos II de Navarra... hasta que intentó extorsionarle más oro. El Rey lo hizo envenenar, y Seguin está muriendo lentamente.\nUn «emprendedor» así podría ser un buen candidato potencial..."
 Owain_Lawgoch: "Owain Lawgoch"
 podgreatpersons.0079.t: "Owain Lawgoch"
 podgreatpersons.0079.desc: "El último descendiente por línea masculina de los antiguos reyes galeses de Gwynedd y uno de los mejores guerreros de la tierra ha llamado recientemente tu atención. El hombre tiene una larga trayectoria, ya que está decidido a recuperar su trono legítimo e incluso lanzó dos invasiones, causando pánico en Inglaterra.\nSu primera flota no pudo desembarcar debido a las tormentas, mientras que la segunda fuerza fue desviada para ayudar al rey de Francia. Cuando no estaba invadiendo Gales, Owain luchó por los franceses en la Guerra de los Cien Años y comandó una compañía de mercenarios galeses contra Pedro el Cruel de Castilla.\nRecientemente ha llegado a un acuerdo con el Rey de Castilla y planea una nueva invasión de su Tierra Natal con su ayuda. Te has enterado de que los ingleses han enviado a un espía para matarlo, lo que podría ser la cobertura perfecta para que lo secuestres y lo lleves a tu corte."
 Roger_de_Flor: "Roger de Flor"
 podgreatpersons.0080.t: "Roger de Flor"
 podgreatpersons.0080.desc: "Originalmente miembro de los Caballeros Templarios, Roger de Flor fue expulsado de la orden tras su deshonrosa conducta en el Sitio de Acre, donde tomó el control de una galera templaria y cobró tarifas enormes por llevar a civiles a salvo en Chipre. Tras un periodo como pirata, Roger vio una oportunidad para asegurar su fortuna. Creó un grupo de mercenarios, la Compañía Catalana, con soldados aragoneses dados de baja.\nDesde entonces se ha convertido en una fuerza importante en la política bizantina, como un exitoso capitán mercenario contra los turcos. Sin embargo, la audacia de Roger podría ser su perdición, ya que su ambición de crear un reino mercenario en Anatolia le ha ganado muchos enemigos.\nEsto te presenta la oportunidad de fingir su asesinato y reclamar a este general probado como tuyo."
 podgreatpersons.0081.t: "Adam el Leproso"
 podgreatpersons.0081.desc: "Inglaterra está experimentando una ola de crímenes recientemente, siendo el líder bandido más famoso un tal Adam el Leproso.\nEn su crimen más famoso, Adam supo que la reina Filipa había dejado sus joyas con un mercader local. La banda del leproso rodeó la casa del mercader y exigió que entregara las gemas. El indignado mercader se negó y resistió valientemente varios ataques hasta que Adam se exasperó e incendió el edificio. Entonces las tornas cambiaron, con el mercader y su familia intentando salir y Adam manteniéndolos dentro hasta que arrojaran las joyas.\nEl ahora rico bandido nunca fue capturado desde entonces... hasta que tus agentes tropezaron con su guarida, mayormente por suerte.\nEl envejecido proscrito ha demostrado astucia y fuerza, y te preguntas si podría ser un Chiquillo digno."
 podgreatpersons.0082.t: "Momchil"
 podgreatpersons.0082.desc: "Un bandido búlgaro que construyó un ejército personal de campesinos en las montañas de Rodopi, Momchil sirvió brevemente a Stefan Dušan de Serbia, pero realmente encontró su lugar durante la actual Guerra Civil Bizantina. En una impresionante exhibición de traiciones, Momchil cambió de bando en 1343, 1344 y 1345.\nAl jugar en ambos bandos, pudo establecer su propio poder en las tierras fronterizas.\nSe ha convertido en tal amenaza que bizantinos y turcos están ahora aliados para acabar con él de una vez por todas. Parece poco probable que pueda resistir tal asalto.\nEl hombre ha demostrado claramente la ambición pura y la astucia necesarias para prosperar en la sociedad vampírica y, como tal, tus cortesanos te instan a considerar enviar a alguien para fingir su muerte durante la próxima batalla y luego llevártelo."
 Arnaud_de_Cervole: "Arnaud de Cervole"
 podgreatpersons.0083.t: "Arnaud de Cervole"
 podgreatpersons.0083.desc: "Arcipreste de Velines hasta que descubrió que una carrera como mercenario le gustaba más, Arnaud formó la primera «Gran Compañía» y la llevó a Provenza, que había evitado daños graves en la guerra. En poco tiempo, los mercenarios la habían convertido en un páramo.\nEn 1358, el Arcipreste aseguró su infamia tomando esencialmente al Papa como rehén, rodeando la sede papal en Aviñón y exigiendo 20.000 florines para abandonar la región. Después de eso, Arnaud volvió mayormente al trabajo de mercenario legítimo.\nDurante su carrera, se ha ganado muchos enemigos y, por ello, se ha ofrecido como voluntario para unirse a una Cruzada lejos de Francia. Sin embargo, la parte logística de esta campaña es inestable, y el Arcipreste se encuentra ahora varado no muy lejos de tu área de influencia.\n¿Quizás sea una oportunidad para pedirle que preste sus habilidades a tu corte?"
 Robert_of_Geneva: "Robert de Ginebra"
 podgreatpersons.0084.t: "Robert de Ginebra"
 podgreatpersons.0084.desc: "Has sospechado durante mucho tiempo que el actual Papa de Aviñón, Clemente VII, podría ser un vampiro. Principalmente porque engañó a una ciudad sitiada prometiendo clemencia, para luego matar a todos los que había dentro con el grito de «¡Sangre y más sangre!», lo que le valió su apodo.\nSin embargo, curiosamente, parece que no es más que un mortal ambicioso, aunque desequilibrado. Como Papa, es culto, astuto y está familiarizado con la guerra desde su juventud como Legado.\nAdemás, claramente no está protegido por la Fe Verdadera, como la mayoría de los otros Papas de los que has oído hablar. Por ello, es un candidato tentador para el $pod_Embrace$..."
 Louis_d_Estouteville: "Louis d'Estouteville"
 podgreatpersons.0085.t: "Louis d'Estouteville"
 podgreatpersons.0085.desc: "Mientras Francia se desmorona bajo el asalto de Inglaterra durante esta Guerra de los Cien Años, el Mont-Saint-Michel sigue resistiendo. Defendido por apenas 119 caballeros franceses, este pequeño lugar sagrado ya ha repelido a más de 20.000 ingleses... dos veces.\nLos caballeros están liderados por un tal Louis d'Estouteville, un estoico capitán del ejército francés. Envalentonados por su victoria milagrosa, los caballeros ya han comenzado a liberar la campiña normanda mientras los ingleses se apresuran a montar una defensa.\nEn el caos actual, y con Louis lejos del lugar sagrado, esta podría ser una oportunidad única para que reclutes a un líder de hombres tan hábil."
 Lodewyk_van_Bercken: "Lodewyk van Bercken"
 podgreatpersons.0086.t: "Lodewyk van Bercken"
 podgreatpersons.0086.desc: "Una nueva moda surge de estos volubles mortales: el diamante. Esta joya, ciertamente bonita, es el tema de conversación en todas sus cortes y la marca del verdadero noble moderno. Quizás quieras imitarlos, para estar al día con los tiempos, como dicen.\nLa mejor oportunidad para hacerlo ha aparecido recientemente en la forma de Lodewyk van Bercken, el astuto joyero flamenco que inventó una nueva herramienta para cortar diamantes, ayudando a su repentino aumento de popularidad. ¿Qué mejor manera de despreciar a los mortales y superarlos que robarles a su preciado artesano justo delante de sus narices?"
 Lorenz_Helmschmied: "Lorenz Helmschmied"
 podgreatpersons.0087.t: "Lorenz Helmschmied"
 podgreatpersons.0087.desc: "El armero de la corte de los Habsburgo, un tal Lorenz Helmschmied, ha llamado hace poco tu atención. Este artesano de talento excepcional ha creado algunas de las armaduras más innovadoras y artísticamente complejas de la época: nada menos que dos emperadores del Sacro Imperio han ido a la batalla protegidos por sus creaciones.\nComo vampiro, no necesitas tanta protección como esos débiles mortales, pero aun así, tener a tu servicio a alguien tan dotado sería tan prestigioso como útil... Y no querrías que tus enemigos se te adelantaran, no vaya a ser que acaben usando esas soberbias armaduras contra ti..."
 Robert_Porter: "Robert Porter"
 podgreatpersons.0088.t: "Robert Porter"
 podgreatpersons.0088.desc: "Como gobernante de la noche, necesitas individuos con talento en campos diversos, como la guerra, la Administración, la diplomacia... Rara vez alguien puede presumir de dominar varios de ellos, pero quizá hayas encontrado una excepción en la persona de un tal Robert Porter.\nCeloso miembro de la facción parlamentaria, Porter empezó como herrero a su servicio antes de ser nombrado capitán de caballería. Después publicó además un panfleto de propaganda y acabó siendo nombrado tesorero de una de sus guarniciones. Sin duda, un hombre con habilidades tan variadas podría serte útil en tu corte."
 Daniel_Hopfer: "Daniel Hopfer"
 podgreatpersons.0089.t: "Daniel Hopfer"
 podgreatpersons.0089.desc: "Un hombre ingenioso llamado Daniel Hopfer ha captado hace poco tu atención. Este artista alemán es el primero en usar el aguafuerte en el grabado, lo que da como resultado armaduras decoradas con más belleza que nunca. También trabaja con otros artesanos y ya tiene una prole de hijos entusiastas que siguen sus pasos.\nLa calidad de su trabajo ha llamado la atención de la corte imperial, pero podrías adelantarte a ella si actúas ahora. ¿Qué gobernante de la noche que se precie renunciaría a una prestigiosa armadura forjada por uno de los mejores maestros del oficio?"
 William_Dampier: "William Dampier"
 podgreatpersons.0090.t: "William Dampier"
 podgreatpersons.0090.desc: "Pirata, explorador, navegante, corsario y naturalista, el capitán William Dampier es probablemente una de las perspectivas más emocionantes de las que has oído hablar en mucho tiempo. Ha demostrado una y otra vez el temple necesario para llegar lejos en la no-vida, gracias a su mezcla de valentía y crueldad hacia sus semejantes.\nUn hombre así podría ser un activo poderoso... si lo llevas con la correa corta. Ten en cuenta que se sabe que ha traicionado a quienes lo empleaban en numerosas ocasiones. Esa clase de canalla solo responde ante sí mismo."
 Catherine_Deshayes: "Catherine Deshayes"
 podgreatpersons.0091.t: "Catherine Deshayes"
 podgreatpersons.0091.desc: "Mañana quemarán en la hoguera a alguien por brujería en París. No es nada raro, en realidad, pero esta «bruja» en concreto ha despertado tu interés. Esta mujer se especializó en adivinar el porvenir a los grandes y poderosos. Luego en la alquimia, luego en el envenenamiento, luego en la misa negra... parece que no había límite a lo que estaba dispuesta a hacer para sacarle oro a la crédula aristocracia francesa.\nSu suerte cambió cuando empezó a usar imaginería satánica en sus Rituales, lo que hizo que se le atribuyera una serie de envenenamientos en la corte francesa.\nSea cual sea la verdad, una... «emprendedora» tan innovadora podría serle útil a tu corte de muchas maneras."
 Ontsifor_Lukinich: "Ontsifor Lukinich"
 podgreatpersons.0092.t: "Ontsifor Lukinich"
 podgreatpersons.0092.desc: "Nacido en una familia de boyardos de Nóvgorod, Ontsifor ha sido elegido posadnik (alcalde) de la ciudad en varias ocasiones. Apareció por primera vez en los informes de tus agentes cuando dirigió las tropas de la ciudad contra la reciente invasión sueca, y salió bastante airoso a pesar de estar en desventaja.\nNo es solo un soldado: Ontsifor también reformó el cargo de posadnik y creó un nuevo órgano de gobierno colegiado, algo inédito en la política de Nóvgorod hasta donde tú sabes. Un hombre con semejantes habilidades sin duda podría ser útil para tu noble causa."
 podgreatpersons.0093.t: "Iván"
 podgreatpersons.0093.desc: "Un joven, en apariencia simplón, ha dado mucho que hablar últimamente en tu región. Hermano menor de su familia, Iván es siempre alegre y amable hasta rozar la necedad. También es a menudo el (reacio) héroe de muchos cuentos fantásticos, con dragones y princesas secuestradas, en los que de algún modo siempre acaba ganando.\nSospechas que la verdadera causa de esta historia es una astuta travesura de algún Malkavian, pero ¿y si Iván estuviera realmente dotado de una suerte extraordinaria o de algún otro don sobrenatural? Como mínimo, podrías traerlo a tu corte para investigarlo."
 Kudeyar: "Kudeyar"
 podgreatpersons.0094.t: "Kudeyar"
 podgreatpersons.0094.desc: "Hermano mayor ilegítimo de Iván el Terrible, según parece, el hombre conocido como Kudeyar se ha convertido rápidamente en una leyenda en tu región. Al frente de una banda de cosacos cerca del río Don, su destreza marcial y su valentía temeraria lo han hecho famoso en todo el país. Que ataque sobre todo a nobles y a otras figuras poco queridas también contribuye a forjar su imagen de héroe de los pobres y los oprimidos. Un comandante tan imponente y un propagandista tan hábil como él podría serte de utilidad."
 Ivan_Bolotnikov: "Iván Bolotnikov"
 podgreatpersons.0095.t: "Iván Bolotnikov"
 podgreatpersons.0095.desc: "El Tiempo de las Revueltas ha caído sobre la Rusia mortal, y varios señores de la guerra compiten entre sí. Uno de ellos es un antiguo obispo lleno de recursos, que escapó varias veces de la prisión y de la esclavitud antes de regresar como líder rebelde.\nSin embargo, en estos tiempos caóticos pronto abandonó cualquier pretensión de luchar por algo que no fuera él mismo y enseguida fue más temido que respetado, sobre todo tras la destrucción de varias poblaciones que él mismo orquestó. Sin duda, una cualidad valiosa si llegara a unirse al mundo de la noche. De hecho, tienes la oportunidad de conseguirlo, ya que se ha rendido hace poco y probablemente se enfrente pronto a la ejecución."
 Dmitri_Ivanovich: "Dmitri Ivanovich"
 podgreatpersons.0096.t: "Dmitri Ivanovich"
 podgreatpersons.0096.desc: "Tras un ataque fallido contra Moscú, otro señor de la guerra muerde el polvo mientras continúa el Tiempo de las Revueltas en Rusia. Este se hizo pasar por el hijo perdido de Iván el Terrible, lo cual no es muy original, pero de algún modo logró la credibilidad suficiente para reunir un ejército impresionante.\nSu fortuna militar fue irregular, pero lo que más admiraste fue su capacidad para sostener una mentira, pues supo reunir tras su falsa bandera tanto a nobles como a campesinos. ¿Quizá podrías sacarle provecho? Desde luego, parece reunir lo necesario para convertirse en un Chiquillo capaz, aunque no muy digno de confianza."
 Alena_Arzamasskaia: "Alena Arzamasskaia"
 podgreatpersons.0097.t: "Alena Arzamasskaia"
 podgreatpersons.0097.desc: "Otra revuelta campesina está siendo aplastada en la Rusia mortal, pero esta te despierta un interés especial. Uno de los cabecillas rebeldes era una mujer temible, al parecer una antigua monja, que se hacía pasar por hombre para dirigir su ejército. Su destreza con el arco y en la medicina la convirtió en una enemiga formidable, y solo la capturaron después de que abatiera a varios zaristas en el convento donde se había refugiado.\nNi siquiera la tortura pudo quebrarla, y pronto arderá en la hoguera sin haber traicionado a sus hombres. Sería una lástima perder tan pronto a una mortal tan prometedora, y te preguntas si intervenir o no."
 Domentijan: "Domentijan"
 podgreatpersons.0098.t: "Domentijan"
 podgreatpersons.0098.desc: "Monje, escriba, escritor y filósofo, Domentijan goza desde hace tiempo de gran aprecio en tu corte, donde sus obras se debaten largamente. Aunque es muy aficionado a la vida monástica, tampoco es un ermitaño: ha trabajado para varias cortes y ha hecho su propia peregrinación a Jerusalén.\nUn hombre tan culto y tan viajado podría ser un activo para tu corte, quizá incluso un posible Chiquillo. Como ya es bastante mayor, sería muy fácil fingir su muerte si así lo desearas."
 Milos_Obilic: "Milos Obilic"
 podgreatpersons.0099.t: "Milos Obilic"
 podgreatpersons.0099.desc: "El sultán de los otomanos, Murad, ha sido asesinado hace poco en el campo de batalla por un intrépido caballero serbio. Los detalles son escasos, pero parece que fue un ataque audaz, quizá con una pizca de engaño. Estás atento a una posible implicación de los $pod_cainite$, pero las leyendas populares que rodean a este nuevo héroe ya dificultan distinguir la verdad.\nDudas mucho que sea «hijo de un dragón» o que recibiera ayuda de Baba Yaga antes de matarla. Una cosa es segura: este hombre es un gran luchador y tiene recursos. Cualidades suficientes para que lo consideres un posible candidato al $pod_Embrace$."
 Jefimija: "Jefimija"
 podgreatpersons.0100.t: "Jefimija"
 podgreatpersons.0100.desc: "Una madre infeliz y una esposa afligida, Jefimija lo perdió todo en su vida... varias veces. Su hijo murió siendo un bebé, su marido y sus hermanos murieron en la guerra, antes de que su patrón y su amigo murieran en la misma guerra más tarde. Entonces, su país fue repartido por austriacos y otomanos.\nSin embargo, estas penurias resultaron ser su inspiración, y creó algunos lamentos muy bien recibidos, una forma de poesía larga y triste. Su corazón impasible no se conmueve fácilmente hoy en día, pero esto podría ser una excepción. ¿Qué le queda por perder si ya lo ha perdido todo, salvo la vida?"
 Ivan_Gundulic: "Ivan Gundulic"
 podgreatpersons.0101.t: "Ivan Gundulic"
 podgreatpersons.0101.desc: "Un consumado diplomático y hombre culto de la República de Ragusa, Deivo Franov Gundulic proviene de un linaje noble que ha estado en su zona durante mucho tiempo. Este descendiente en particular es un ferviente católico y está utilizando su talento literario para ayudar a esta causa. Como miembro del gobierno de la ciudad, también muestra capacidades interesantes en habilidades administrativas.\nEstá considerando dar un paso; un hombre así podría ser de utilidad. ¿Tal vez para escribir un panfleto incendiario contra sus rivales?"
 Giorgio_da_Sebenico: "Giorgio da Sebenico"
 podgreatpersons.0102.t: "Giorgio da Sebenico"
 podgreatpersons.0102.desc: "Un maestro arquitecto italiano lleva décadas renovando la Catedral de Santiago en Šibenik. Mostrando claramente una destreza y una paciencia muy distintas a las de esos mortales fugaces, te ha intrigado este hombre y su obra. Algunos contemplan sus logros y ven inspiración divina y, aunque tú tienes una relación con Dios muy diferente a la de la mayoría de los mortales, también sientes algo peculiar al menos.\nSi bien un arquitecto no es precisamente el camino profesional que desearías para un candidato al $pod_Embrace$, podría haber cierto mérito en mirar más allá esta vez. Si no por otra cosa, al menos para renovar tu interior, probablemente bastante anticuado."
 Marin_Drzic: "Marin Drzic"
 podgreatpersons.0103.t: "Marin Drzic"
 podgreatpersons.0103.desc: "Un mortal peculiar ha estado cautivando tu corte últimamente. Tras una carrera como intérprete, escribano y músico de iglesia, Marin Drzic vive la vida de un aventurero, forajido y escritor de comedias. Siendo aún más interesante, en realidad se está acercando bastante a desenterrar la presencia $pod_cainite$ en Dubrovnik.\nDe hecho, tus agentes interceptaron varias cartas suyas dirigidas a los Médici de Florencia, pidiéndoles ayuda para librarse de «la pequeña aristocracia elitista que realmente gobierna su ciudad». No corres un peligro inmediato, pero no puedes negar que este mortal ha demostrado sus talentos y su ingenio más que suficientes como para, quizás, merecer una audiencia contigo.\nEs hora de que conozca a esos «amos secretos»."
 Rodion_Oslyabya: "Rodion Oslyabya"
 podgreatpersons.0104.t: "Rodion Oslyabya"
 podgreatpersons.0104.desc: "Mientras los rusos celebran su victoria sobre los mongoles en la batalla de Kulikovo, se te ha informado de las contribuciones de uno de sus comandantes. Este hombre, aparentemente un monje o un boyardo, lideró a los caballeros rusos con gran valor y eficiencia.\nTras ser derribado de su caballo, se pensó que había muerto durante un tiempo, pero reapareció durante la batalla y se distinguió una vez más. Sus logros le han ganado el respeto de los líderes rusos, y pronto partirá al Imperio bizantino para una misión diplomática. Podrías interferir, ya que un general tan celoso y carismático ciertamente podría ser de utilidad para tus planes."
 Alexander_Peresvet: "Alexander Peresvet"
 podgreatpersons.0105.t: "Alexander Peresvet"
 podgreatpersons.0105.desc: "Sigues las noticias del mundo mortal de forma casual, y parece que los mortales rusos están haciendo todo lo posible por liberarse del yugo mongol. No es de gran importancia para ti, pero la guerra suele engendrar talento útil y, como tal, tus agentes han estado vigilando la situación.\nSu último descubrimiento fue un tal Alexander Peresvet, un monje que luchó en un duelo al inicio de la reciente batalla contra un campeón tártaro. Terminó en tablas, y tus agentes apenas salvaron al mortal antes de que comenzara la batalla. Claramente, este guerrero es un alma valiente y comprometida, pues pocos están dispuestos a arriesgar su vida de tal modo. Podrías usarlo como un campeón propio o, tal vez, incluso darle el $pod_Embrace$."
 Ivan_Vyrodkov: "Ivan Vyrodkov"
 podgreatpersons.0106.t: "Ivan Vyrodkov"
 podgreatpersons.0106.desc: "Los días de Rusia parecen sombríos para sus mortales, ya que Iván el Terrible ha instituido la Oprichnina, una política de represión masiva y ejecuciones para consolidar su dominio. Una de las víctimas potenciales es un hombre que te dolería perder ante la mezquina política de los mortales.\nIvan Vyrodkov ha sido el principal ingeniero militar de Rusia durante décadas y ha inventado nuevos diseños revolucionarios como la torre de batería. También se le atribuyen proezas arquitectónicas masivas en varias ciudades, como la construcción de una torre de asedio de 12 metros de altura en una sola noche. Podrías interferir y ahorrarle la ira de Iván el Terrible, lo que resultaría en un brillante y agradecido ingeniero militar a tu servicio."
 Yermak_Timofeyevich: "Yermak Timofeyevich"
 podgreatpersons.0107.t: "Yermak Timofeyevich"
 podgreatpersons.0107.desc: "Mientras el naciente Imperio ruso mortal realiza sus primeras conquistas en Siberia, un hombre los ha estado liderando: Yermak Timofeyevich, un cosaco, aventurero y carismático líder de hombres. Antaño un simple matón y pirata fluvial, su experiencia en combate le aseguró un puesto militar donde pronto destacó. Fue entonces elegido como líder de la expedición siberiana y has oído hablar de sus hazañas y conquistas desde entonces.\nSin embargo, la muerte no espera a nadie, y también has oído hablar de una emboscada planeada por los tártaros que probablemente acortará su carrera. Podría ser el momento perfecto para fingir su muerte e introducirlo en tu corte. Quizás tú también tengas tierras inexploradas que conquistar."
 Ridolfo_Fioravanti: "Ridolfo Fioravanti"
 podgreatpersons.0108.t: "Ridolfo Fioravanti"
 podgreatpersons.0108.desc: "Los caprichos de los poderosos son a veces muy mezquinos; hace poco oíste que Iván III, gobernante de la Rusia mortal, metió en la cárcel a su antiguo arquitecto italiano favorito. Ridolfo Fioravanti procede de Bolonia, donde trabajó como uno de los arquitectos más solicitados de Italia antes de ser invitado a Moscú. Desde entonces, ha estado construyendo la Catedral de la Dormición y todo iba bien hasta que tuvo la audacia de pedir al Zar volver a su Italia natal para sus últimos años.\nSiendo alguien que no acepta tales injusticias, podrías rescatarlo de su celda... y vincularlo para que sea tu eterno servidor en su lugar."
 Dionisius: "Dionisius"
 podgreatpersons.0109.t: "Dionisius"
 podgreatpersons.0109.desc: "Una pintura mural monumental de la Catedral de la Natividad de la Virgen del Monasterio de Ferapontov en la región de Vólgoda ha sido presentada recientemente al público. Una obra tremenda que es la culminación de una sólida carrera en la pintura de iconos por parte de un hombre llamado Dionisio.\nSus creaciones se caracterizan por un aura de serenidad y paz que parece afectar incluso a las furiosas Bestias internas de los $pod_cainites$. Sin embargo, ahora está viejo y cansado, y esta fue ciertamente su última obra. Como siempre ocurre con la tentación de tales mortales interesantes, tienes la posibilidad de salvar su genio artístico maldiciéndolo para siempre."
 William_de_Burgh: "William de Burgh"
 podgreatpersons.0110.t: "William de Burgh"
 podgreatpersons.0110.desc: "Irlanda es una tierra de peligros y héroes. No temes al peligro y podrías usar a los héroes, así que vigilas a los mortales de la Isla Esmeralda. Uno se ha distinguido recientemente.\nWilliam de Burgh, magnate y vicejusticia, es un comandante probado, habiendo liderado a sus hombres tanto en la victoria como en la derrota. Sus sólidas habilidades diplomáticas y su inquebrantable lealtad a su conde también mantuvieron bajo control a las familias enfrentadas de Connacht durante su mandato; algo que no es fácil de lograr en la complicada política de la Isla.\nWilliam contrajo una enfermedad grave recientemente y probablemente no sobrevivirá, lo que podría ser la ocasión para que lo «invites» a tu corte."
 Godred_Magnusson: "Godred Magnusson"
 podgreatpersons.0111.t: "Godred Magnusson"
 podgreatpersons.0111.desc: "El último remanente de la Britania vikinga, la Isla de Man, ha caído finalmente ante las fuerzas escocesas, pero los hombres del norte no tienen intención de rendirse fácilmente. Liderados por el hijo bastardo del último Rey de las Islas, prepararon una rebelión e irrumpieron en las posiciones escocesas antes de verse obligados a una batalla campal.\nAnte un número superior, los rebeldes fueron derrotados contundentemente, pero su líder, Godred Magnusson, logró escapar. A pesar de este revés, este «último vikingo» de Britania ha mostrado un fuerte temperamento y ambición que podrían ser útiles. Ahora que está solo y en fuga, podría ser fácil para ti traerlo a tu corte para discutir más a fondo su destino."
 Lucino_Dal_Verme: "Lucino Dal Verme"
 podgreatpersons.0112.t: "Lucino Dal Verme"
 podgreatpersons.0112.desc: "Uno de esos «Condottiero», los mercenarios italianos, se ha trasladado recientemente a Constantinopla. Este es toda una leyenda: defensor de Lucca y Bolonia, gobernador de Génova, capitán general de Piamonte, conquistador de Creta... y disponible para el mejor postor, como la mayoría de estos mercenarios.\nLuchino es ciertamente una perspectiva interesante, un hombre de guerra, por supuesto, pero también un hombre que ha sobrevivido a las mortíferas intrigas italianas e incluso ha prosperado gracias a ellas. Quizás podrías organizar un encuentro con él y convertirte en su nuevo empleador..."
 Julian_Cesarini: "Julian Cesarini"
 podgreatpersons.0113.t: "Julian Cesarini"
 podgreatpersons.0113.desc: "La última Cruzada mortal contra los otomanos terminó en caos tras la desastrosa batalla de Varna, pero también te proporcionó una oportunidad tentadora. Tus agentes han localizado al cardenal Julian Cesarini, solo y vulnerable.\nEste hombre ha sido el cerebro detrás de los esfuerzos diplomáticos del Papado durante décadas, casi resolviendo el Cisma con la Iglesia Ortodoxa y reuniendo después a los reyes occidentales para la actual Cruzada. Un diplomático tan brillante con un fuerte sentido del deber no entra a menudo en tu red, y estás considerando tus próximos movimientos con cuidado."
 podgreatpersons.0114.t: "Vidyapati"
 podgreatpersons.0114.desc: "Las costumbres mortales cambian a menudo, y demasiado rápido para tus gustos la mayor parte de las veces. Ni siquiera un concepto básico como el lenguaje está exento. El prakrit tardío Abahattha acaba de empezar a transicionar hacia versiones tempranas de las lenguas orientales como el maithili y el bhojpuri.\nNecesitarás a un experto mortal para descifrar estos cambios por ti. Tus agentes dicen que no habrá nadie mejor que Vidyapati, un popular poeta de las cortes reales de Bengala que se ha retirado recientemente a su ciudad natal. También es conocido como un diplomático hábil y un hindú celoso, lo que significa que podría ser útil como [ghoul|E] o como chiquillo, y no solo como traductor."
 Atukuri_Molla: "Atukuri Molla"
 podgreatpersons.0115.t: "Atukuri Molla"
 podgreatpersons.0115.desc: "Una interesante mortal ha llamado tu atención recientemente. Atukuri Molla es una poeta popular y, a medida que su fama se extendió, fue invitada a la corte de Sessions y tuvo la oportunidad de recitar el Ramayana ante Krishnadevaraya y sus poetas.\nMolla afirma que Sri Shiva es su Gurú, y se dice que su inspiración provino de Pothanna, quien escribió el Bhagavata Purana en telugu. Al igual que él, es una hindú saiva, pero escribe la historia de Rama (una encarnación de Vishnu) y también se niega a dedicar su Ramayana a cualquier rey, una práctica generalizada para los poetas hoy en día.\nLos poetas famosos son siempre una distracción animada y prestigiosa en la corte, lo que significa que estás considerando acercarla al mundo nocturno."
 Boleslaus: "Boleslaus"
 podgreatpersons.0116.t: "Boleslaus"
 podgreatpersons.0116.desc: "Los conflictos mortales siempre son una oportunidad para tu clase. La reciente invasión mongola de Europa Central no es la excepción. Los cristianos perdieron la batalla de Legnica y tus agentes han acechado en las sombras, trayéndote noticias sobre el paradero de un tal Boleslaus, autoproclamado «duque de Bohemia».\nEste hombre ambicioso ha pasado toda su vida luchando por una pretensión de su familia perdida hace mucho tiempo, antes de unirse a sus antiguos enemigos para defender el Señorío. A pesar de la derrota, se distinguió por su valentía y habilidades tanto como comandante como guerrero. Tus agentes están preparados para traerlo a tu corte, si quieres usarlo como un [ghoul|E] o como un potencial candidato a Chiquillo."
 Guillaume_de_Sonnac: "Guillaume de Sonnac"
 podgreatpersons.0117.t: "Guillaume de Sonnac"
 podgreatpersons.0117.desc: "La Séptima Cruzada mortal está llegando a su fin tras la derrota de los cruzados en la batalla de Mansurah. A pesar de sus victorias anteriores, los cristianos cargaron demasiado pronto contra la ciudad y solo tres caballeros de los 280 originales regresaron a su campamento.\nUno de ellos es Guillaume de Sonnac, el Gran Maestro de la orden de los Templarios, quien luchó para salir de la ciudad pero perdió un ojo en el proceso. Ahora lidera desesperadamente una defensa perdida contra el contraataque musulmán. Conocido como un diplomático hábil y un general experimentado, de Sonnac podría ser un recluta interesante para tu corte. Tus agentes están listos para aprovechar el caos actual para fingir su muerte y luego traértelo."
 Ibn_Taymiyyah: "Ibn Taymiyyah"
 podgreatpersons.0118.t: "Ibn Taymiyyah"
 podgreatpersons.0118.desc: "Jurista islámico, erudito, muhaddith, teólogo, juez, filósofo, economista y polímata, Ibn Taymiyyah ha llamado tu atención por su implicación diplomática con el gobernante ilkanato Ghazan Khan y por su participación en la batalla de Marj al-Saffar, que puso fin a las invasiones mongolas en el Levante.\nComo miembro de la escuela hanbalí, las opiniones iconoclastas de Ibn Taymiyyah sobre doctrinas ampliamente aceptadas, como la veneración de los santos y las visitas a sus santuarios, lo hacen impopular entre muchos eruditos y gobernantes de la época, bajo cuyas órdenes fue encarcelado varias veces.\nAhora que languidece en una prisión de Damasco, no puedes evitar sentir que el talento del hombre que salvó el Levante se está desperdiciando. Quizás una intervención por tu parte sea necesaria."
 Madan_Rai: "Madan Rai"
 podgreatpersons.0119.t: "Madan Rai"
 podgreatpersons.0119.desc: "Un nuevo gobernante mortal ha ascendido al trono del Reino de Gour y esto ha provocado un cambio en la mayoría de los funcionarios del Señorío. De especial interés para ti es el despido de Madan Rai, el último ministro principal del difunto rey, quien siempre pareció ser un hombre competente y diligente.\nEs famoso por atraer al general principal del rival Reino de Brahmachal a su bando, desencadenando una serie de eventos que culminaron en la victoria del Reino de Gour sin siquiera tener que iniciar una guerra. Una mente tan astuta y comprometida ciertamente podría serte útil."
 Sikandar_Khan_Ghazi: "Sikandar Khan Ghazi"
 podgreatpersons.0120.t: "Sikandar Khan Ghazi"
 podgreatpersons.0120.desc: "Noticias sorprendentes: tus agentes han logrado capturar al Wazir (ministro principal) del Reino de Lakhnauti. Parece que el hombre casi se ahoga mientras pescaba y quedó separado de su séquito. Esto plantea algunas cuestiones interesantes para ti ya que, a pesar de este evento algo vergonzoso, Sikandar es un general renombrado y un administrador capaz. Ha sido fundamental en la conquista de la zona por parte de su señor. ¿Quizás podría ser fundamental en la tuya?\nSolo mantenlo alejado de los lugares de pesca."
 podgreatpersons.0121.t: "Ertugrul"
 podgreatpersons.0121.desc: "Un cortesano Malkavian tuyo no ha dejado de insistir en que debes interferir en la vida de un Bey del Sultanato de Rum llamado Ertugrul. Este líder de tribu por nacimiento es algo insignificante, aunque al menos hábil como gobernante de su pequeño rincón de Asia Menor. Como tal, has ignorado los desvaríos de este Malkavian durante mucho tiempo.\nHasta que el loco Malkavian se suicidó enfrentándose al sol, gritando que «¡es demasiado tarde!». Con un sentimiento algo espeluznante tras este siniestro suceso, revisas tu posición respecto a Ertugrul. ¿Quizás este mortal esté realmente destinado a grandes cosas y pueda serte útil?"
 Qutui_Khatun: "Qutui Khatun"
 podgreatpersons.0122.t: "Qutui Khatun"
 podgreatpersons.0122.desc: "El Imperio mongol mortal se está desmoronando bajo sucesiones problemáticas y guerras civiles, pero el caos trae oportunidades para alguien como tú. Qutui Khatun, la madre de uno de los Kanes recientemente asesinados, ha sido una fuerza política importante a pesar de la pérdida de su marido y ahora de su hijo. La mejor prueba es que el nuevo Kan está marchando actualmente hacia su ciudad para detenerla, mientras ella intenta asegurar apoyo para sí misma.\nComo también es conocida como una administradora y diplomática hábil, posee suficientes cualidades para merecer tu atención. Podrías fingir su muerte y traerla a tu corte, donde su destino final estaría en tus manos."
 Tiramakhan_Traore: "Tiramakhan Traore"
 podgreatpersons.0123.t: "Tiramakhan Traore"
 podgreatpersons.0123.desc: "Tus agentes están siguiendo de cerca a los mortales de África y recientemente te han traído noticias sobre una perspectiva interesante. Tiramakhan Traore es un general del Imperio de Malí que ha liderado una expedición hacia el oeste en busca de nuevas tierras para conquistar y colonizar. Lo hizo todo de forma admirable, derrotando al rey Bainuk Kikikor y anexando su estado antes de fundar muchas ciudades mandingas nuevas.\nCon su misión cumplida, Traore descansa ahora en Mampating sin su ejército, una rara posición de vulnerabilidad que podrías explotar. Probablemente podrías usar a un hombre así para tus propios fines."
 Abul_Hasan_ash_Shadhili: "Abul Hasan ash-Shadhili"
 podgreatpersons.0124.t: "Abul Hasan ash-Shadhili"
 podgreatpersons.0124.desc: "Un anciano erudito se ha detenido recientemente en tu zona debido a una enfermedad. Este anciano es el renombrado Abul Hasan ash-Shadhili, un teólogo de gran prestigio. Conocido por haber viajado por todo el mundo para reunirse con los eruditos más famosos de esta era, Abul fundó después su propia escuela de pensamiento, y muchos discípulos ya están difundiendo su palabra por todos los rincones del mundo musulmán.\nSiendo también un gran debatiente y hábil en la administración legal, posee muchas cualidades que lo convierten en un objetivo atractivo. Podrías, tal vez, fingir su muerte por enfermedad y luego traerlo a tu corte. Podría ser útil, quizás como un [ghoul|E] o incluso como un posible Chiquillo."
 Sayyida_al_Hurra: "Sayyida al Hurra"
 podgreatpersons.0125.t: "Sayyida al Hurra"
 podgreatpersons.0125.desc: "La reina pirata de Tetuán es una leyenda entre los musulmanes y una pesadilla para los cristianos. Nacida en una familia andalusí exiliada, recibió la mejor educación y luego se casó con el gobernador de su ciudad. Cuando este murió, el pueblo le confió su cargo, pues ya la respetaban como una administradora capaz.\nSayyida al Hurra vivió entonces una vida de aventuras y romance, casándose con un Sultán, convirtiéndose en corsaria y convirtiendo el Mediterráneo en un infierno para los españoles. Pero todo tiene un final, y recientemente ha sido derrocada tras un golpe de Estado. Has estado esperando mucho tiempo con la esperanza de encontrar la forma de atrapar a esta mujer prodigiosa en tu red. Esta podría ser la oportunidad."
 Mary_Wolverston: "Mary Wolverston"
 podgreatpersons.0126.t: "Mary Wolverston"
 podgreatpersons.0126.desc: "Una peculiar «contrabandista» ha sido sentenciada recientemente a muerte en Londres. Esta noble cornualesa, Mary Wolverston, aparentemente disponía de una vasta red de sobornos, amenazas y matones para saquear los barcos cerca del puerto de Carrick. Disfrutaba mucho de esta vida de piratería institucionalizada, e incluso abordó el Marie de San Sebastián cuando oyó rumores de sus tesoros.\nEste ataque directo fue un paso demasiado lejos y fue sorprendida mientras revendía bienes robados de su propio hurto. Como su sentencia de muerte ha sido promulgada, pronto desaparecerá de las mentes mortales. ¿Quizás una oportunidad para «salvar» a esta despiadada mujer de negocios para tus propios fines?"
 Agnes_Hotot: "Agnes Hotot"
 podgreatpersons.0127.t: "Agnes Hotot"
 podgreatpersons.0127.desc: "Una joven causó un gran revuelo en un torneo reciente. Como su padre enfermó y no pudo proteger su honor, Agnes tomó secretamente su armadura, cabalgó y derribó a su oponente de su caballo. Mientras él yacía en el suelo, ella se quitó el casco y se soltó el cabello para revelar su verdadera identidad.\nTus investigaciones han revelado que pertenece a un linaje menor, y podría ser capturada fácilmente por tus agentes y traída a tu corte si así lo desearas. ¿Acaso te hace ilusión una gallarda dama caballero defendiendo tu honor no-muerto?"
 Vendela_Skytte: "Vendela Skytte"
 podgreatpersons.0128.t: "Vendela Skytte"
 podgreatpersons.0128.desc: "Llevas un tiempo siguiendo la vida de una joven noble sueca. Famosa por sus cualidades académicas e intelectuales, Vendela Skytte también es admirada por su belleza y agudeza. Organiza salones literarios y participa en los debates intelectuales de la época. Además, se rodea de científicos y artistas y dirige debates religiosos.\nLa mujer aún es bastante joven, pero tú ya sientes cierto afecto por ella y te preocupa que pronto pueda atraer la atención de algunos de tus rivales. Por ello, estás considerando actuar para traerla a tu corte ahora mismo, solo para estar seguro."
 Samuel_Cockburn: "Samuel Cockburn"
 podgreatpersons.0129.t: "Samuel Cockburn"
 podgreatpersons.0129.desc: "Varios ejércitos mortales han estado atravesando tu zona desde hace algún tiempo, aparentemente enredados en las guerras de Gustavo II de Suecia en Rusia y los países bálticos. Uno de los comandantes es un mercenario escocés llamado Samuel Cockburn, veterano de numerosas batallas y asedios. La cantidad de campañas en las que parece haber participado es impresionante, y el hombre ciertamente sabe cómo dirigir su compañía.\nPuedes comprender a un alma así, impulsada tanto por la sed de gloria como por el oro. Podría ser un excelente Chiquillo o un rival mortífero. Tal vez aún valga la pena el riesgo."
 Torsten_Stalhandske: "Torsten Stalhandske"
 podgreatpersons.0130.t: "Torsten Stalhandske"
 podgreatpersons.0130.desc: "Siempre estás al acecho de posibles reclutas y uno de tus agentes te habla de un oficial finlandés que promete mucho. Aunque es un hombre bajo, Torsten Stalhandske es excepcionalmente fuerte; cuando un oficial enemigo capturado es llevado al campamento sueco, le aprieta la mano con tanta fuerza que la sangre brota bajo las uñas, en lo que él llama «un honesto apretón de manos sueco».\nTambién tiene reputación de ser un brillante comandante de hombres, liderando tanto cargas de caballería aterradoras como defendiendo posiciones durante varios años.\nUn hombre tan poderoso, tanto mental como físicamente, podría ser sin duda una perspectiva interesante."
 Ibn_Battuta: "Ibn Battuta"
 podgreatpersons.0131.t: "Ibn Battuta"
 podgreatpersons.0131.desc: "Un fascinante mortal regresó recientemente a Marrakech tras un Viaje asombroso. Ibn Battuta visitó la mayor parte del sur de Eurasia, incluyendo Asia Central, el sudeste asiático, el sur de Asia, China y la península ibérica, y ahora está compilando un relato de sus viajes en un libro. Incluso para una criatura de tu edad y experiencia, este mortal vio cosas que probablemente ni siquiera puedas empezar a imaginar. Y vivió para contarlo, demostrando una fortaleza de carácter poco común.\nSi quieres saber más sobre un hombre tan culto y sus Viajes, podrías «invitarlo» a tu corte. Los relatos en primera persona son más fiables que los simples libros, claramente."
 Saadi_Shirazi: "Saadi Shirazi"
 podgreatpersons.0132.t: "Saadi Shirazi"
 podgreatpersons.0132.desc: "Proveniente de un largo linaje de eruditos religiosos, Saadi Shirazi es quizás el mejor de ellos. Gran poeta y escritor de prosa, ya es reconocido como uno de los más grandes de su época.\nSu obra principal, el Bustan, consiste en historias que ilustran acertadamente las virtudes estándar recomendadas a los musulmanes (justicia, liberalidad, modestia, contentamiento) y reflexiones sobre el comportamiento de los derviches y sus prácticas extáticas.\nHabiendo completado sus obras y con la edad pesándole, Saadi vive ahora en su Shiraz natal como un respetado erudito. Algunos de tus cortesanos han propuesto la idea de «salvarlo» de la muerte trayéndolo a tu corte."
 Ibrahim_Pasha: "Ibrahim Pasha"
 podgreatpersons.0133.t: "Ibrahim Pasha"
 podgreatpersons.0133.desc: "El poderoso Gran Visir del Imperio otomano ha sido considerado durante mucho tiempo como el verdadero poder detrás del trono. Diplomático magistral, estuvo detrás de la alianza franco-otomana y convenció a los cristianos occidentales para convertir a Hungría en un estado vasallo otomano.\nSu riqueza y arrogancia crecieron junto con sus éxitos, hasta que empezó a comportarse como si él fuera el que mandaba, y no el Sultán. Esto finalmente le ha pasado factura, y Suleimán parece estar muy cerca de ordenar su ejecución. Ibrahim ignora la amenaza, pero tú no. Podría ser la perfecta oportunidad para fingir su muerte y traerlo a tu corte. Un Gran Visir podría ser útil... siempre que sepa cuál es su lugar."
 Krokodeilos_Kladas: "Krokodeilos Kladas"
 podgreatpersons.0134.t: "Krokodeilos Kladas"
 podgreatpersons.0134.desc: "En el mundo mortal, Grecia ha caído ante las conquistas de los otomanos, pero el pueblo sigue resistiendo. Uno de esos rebeldes, Krokodeilos Kladas, ha estado trabajando con Venecia para hostigar a los turcos. Líder militar competente, ha ganado varias batallas campales antes de que Venecia firmara un tratado de paz con los otomanos.\nAhora que se ha quedado sin apoyo externo, Krokodeilos tiene un precio por su cabeza tanto por parte de los turcos como de sus antiguos aliados venecianos, y su fortuna ha cambiado. A pesar de varios intentos audaces de ayudar a que nuevas rebeliones se extiendan por Grecia, fue capturado recientemente tras una batalla cerca de Monemvasia. Su destino está sellado, a menos que desees intervenir."
 Ivo_Senjanin: "Ivo Senjanin"
 podgreatpersons.0135.t: "Ivo Senjanin"
 podgreatpersons.0135.desc: "Entre los mortales de tu región, las hazañas de un hombre llamado Ivo Senjanin están empezando a volverse legendarias. Como capitán hajduk, luchó contra los otomanos por todo los Balcanes, incluyendo Albania, Bosnia, Herzegovina y Croacia. Participó en batallas de la guerra otomano-veneciana en Lepanto, Chipre, Egipto, Morea, y durante la Guerra Turca Larga en Sisak, Klis y Petrinja.\nTras el fin de su carrera militar, se convirtió en un Uskok, una especie de pirata mientras estaba en Senj, donde fue arrestado recientemente por robo y finalmente declarado culpable. Su ejecución está prevista para muy pronto, dejándote solo una pequeña ventana de oportunidad para actuar si así lo deseas."
 Starina_Novak: "Starina Novak"
 podgreatpersons.0136.t: "Starina Novak"
 podgreatpersons.0136.desc: "Un renombrado hajduk, el mortal que se rebela contra los otomanos, ha sido capturado y pronto será quemado cerca de tu ciudad. Este hombre, Starina Novak, tiene una carrera bastante notable. Formó parte del ataque a Sofía, en Bulgaria, que le valió una gran reputación después de que él y sus 700 soldados engañaran a los turcos cambiando su ruta a través de las montañas de los Balcanes y atacaran por sorpresa a las fuerzas turcas, dejando atrás solo a 8 de sus soldados y capturando grandes cantidades de ganado y suministros de los otomanos. Luego liberó Plevna, Rahovo, Vratsa, Vidin y Florentin.\nTambién se le atribuyen numerosas victorias menores, lo que lo convierte en un comandante militar muy hábil. Podría serte de más utilidad vivo que quemado."
 Sinan_Reis: "Sinan Reis"
 podgreatpersons.0137.t: "Sinan Reis"
 podgreatpersons.0137.desc: "Un corsario berberisco ha desembarcado recientemente en costas indias, aparentemente para ayudar a un gobernante mortal contra una invasión portuguesa. Sinan Reis es uno de los piratas que navegan bajo el mando del famoso almirante otomano Hayreddin Barbarroja. Con un profundo odio hacia los ibéricos desde su exilio forzado de su hogar, Sinan luchó en varias batallas clave contra España y el Sacro Imperio Romano Germánico.\nFamoso por su buen sentido táctico y por ser uno de los favoritos de Barbarroja, este hombre posee muchas cualidades que podrían servirte. Después de todo, comprendes muy bien el atractivo de la venganza."
 Gaspar_de_Gama: "Gaspar de Gama"
 podgreatpersons.0138.t: "Gaspar de Gama"
 podgreatpersons.0138.desc: "Una expedición portuguesa llegó recientemente a Ormuz y un personaje intrigante está con ellos. Incluso el nombre de este lingüista es misterioso, ya que adoptó su nombre actual tras ser encontrado por el famoso explorador Vasco de Gama. Lo que se sabe, sin embargo, es que domina muchos idiomas y conoce la geopolítica y las costumbres de la India.\nEstos activos, junto con su carisma natural, lo han hecho muy valorado por los portugueses, que siempre confían en él cuando comercian con (o conquistan) nuevas tierras. Claramente, este hombre tiene habilidades que pueden ser de utilidad para tu causa y podrías usar tu influencia local para asegurarte de que caiga en tu red."
 Constantine_de_Baberon: "Constantine de Baberon"
 podgreatpersons.0139.t: "Constantine de Baberon"
 podgreatpersons.0139.desc: "Llevas un tiempo siguiendo la carrera de un noble armenio. Constantine conspiró recientemente para asegurarse de que su hijo heredara el trono armenio. Para lograrlo, primero mató (tras torturarlo y envenenarlo) al rey actual, engañó a los nobles leales en una misión de rescate errónea y luego tomó el castillo donde se encontraba la reina y la obligó a casarse con él.\nTal ambición despiadada es digna de las intrigas de muchos $pod_cainites$ y ciertamente merece tu atención. ¿Quizás Constantine esté listo para poner sus talentos al servicio de los señores de la noche? Podrías fingir su muerte y traerlo a tu corte, donde podría convertirse en un agente útil, o incluso en un potencial Chiquillo."
 Beatriz_Galindo: "Beatriz Galindo"
 podgreatpersons.0140.t: "Beatriz Galindo"
 podgreatpersons.0140.desc: "Una de las practicantes más hábiles del latín en Iberia es una hija de la baja nobleza de Zamora llamada Beatriz Galindo. Esta renombrada erudita ha captado la atención de los gobernantes mortales de Iberia y ya ha sido tutora de cinco reinas.\nFigura pública muy respetada, también fundó el hospital de la Santa Cruz y produjo poesía y comentarios sobre Aristóteles. Es una carrera impresionante, una que podría motivarte a «invitarla» a tu corte. No es que tengas hijos a los que educar, pero ciertamente tienes tu parte de molestos neonatos que actúan como tales."
 Jean_Bodin: "Jean Bodin"
 podgreatpersons.0141.t: "Jean Bodin"
 podgreatpersons.0141.desc: "De fraile, académico, abogado profesional y asesor político sucesivamente, Jean Bodin tuvo una vida plena desde sus humildos comienzos como hijo de un sastre. Tras estudiar entre el pensamiento humanista de la universidad de París, Bodin es un defensor convincente de la tolerancia religiosa... pero también del absolutismo político. Sus teorías, muy populares entre las clases altas, lo convirtieron en el asesor político predilecto de varios nobles, periodo en el que demostró ser capaz de maniobrar con cautela en el mundo lleno de intriga de la nobleza.\nEl concepto del absolutismo político ciertamente resuena en ti y estás contemplando la idea de acercar al hombre para aprender más."
 Janus_Pannonius: "Janus Pannonius"
 podgreatpersons.0142.t: "Janus Pannonius"
 podgreatpersons.0142.desc: "Un latinista, poeta, diplomático y obispo de Pécs, Janus Pannonius se ha convertido en una de las figuras más conocidas de la poesía humanista en Europa. Considerado el alumno más brillante de su generación tanto por sus maestros como por sus compañeros, escribió poesía siguiendo las reglas de la prosodia clásica; tenía unos trece años cuando escribió sus primeros epigramas.\nDesde entonces, trabajó en la Cancillería Real y llegó a ser vicerrecetor del país. Claramente, un hombre con tales talentos podría ser de utilidad para tu corte si necesitas un diplomático o un erudito. Fingir su «muerte repentina» es factible si te interesa."
 Anseau_de_Cayeux: "Anseau de Cayeux"
 podgreatpersons.0143.t: "Anseau de Cayeux"
 podgreatpersons.0143.desc: "Uno de los instigadores mortales de la Cuarta Cruzada ha regresado hace poco a Francia. Antaño un noble menor de Picardía, Anseau vio cómo su fortuna mejoraba enormemente con la caída de Constantinopla. Tras crear su base de poder en el nuevo «Imperio Latino», logró sobrevivir a las mortíferas intrigas de la era posterior a la cruzada e incluso fue nombrado regente al casarse con una princesa bizantina.\nSin duda es un hombre con el temple necesario para convertirse en una potencia en el mundo $pod_cainite$. Es ambicioso, despiadado y no teme a los escrúpulos morales mezquinos. Ahora que está lejos de su base de poder, podrías organizar su «muerte» y llevarlo después a tu corte. Podría ser un [ghoul|E] interesante, o incluso un candidato a Chiquillo."
 Angele_de_la_Barthe: "Angele de la Barthe"
 podgreatpersons.0144.t: "Angele de la Barthe"
 podgreatpersons.0144.desc: "La Inquisición no arde solo contra los vampiros. Cada vez más mortales son quemados en la hoguera, pero una historia en particular ha captado tu atención. En Toulouse, una mujer ha sido acusada de acostarse con el Diablo, dar a luz a sus hijos y luego alimentarlos con bebés. No lo negó todo y hasta alardeó de más, como ser una asistente constante en una reunión llamada «Sabbat». No es de extrañar, entonces, que será quemada muy pronto por el mismísimo Gran Inquisidor.\nPuedes salvarla haciéndola desaparecer, aunque solo sea para despreciar a la odiada Inquisición. La mujer misma podría ser interesante, ya que claramente ya sabe mucho sobre lo sobrenatural y no le teme lo más mínimo."
 Garcia_de_Resende: "Garcia de Resende"
 podgreatpersons.0145.t: "Garcia de Resende"
 podgreatpersons.0145.desc: "El secretario privado de los reyes portugueses Juan II y Manuel I ha tenido una larga carrera como estimado noble de la casa real. Uno de los consejeros más de confianza de los dos reyes, Garcia de Resende ha sido un astuto tesorero, católico devoto y un consumado estadista durante varias décadas.\nSu fama es también de índole literaria, con sus habilidades como poeta empezando a ser ampliamente reconocidas. Sus victorias durante los juicios simulados ante la ley, valorados como entretenimiento por la corte portuguesa, también son bien conocidas.\nUn servidor tan consumado, con una lengua de plata y una gran variedad de talentos, podría ser útil para tu corte."
 Pedro_Alvares_Cabral: "Pedro Alvares Cabral"
 podgreatpersons.0146.t: "Pedro Alvares Cabral"
 podgreatpersons.0146.desc: "Es la era de la exploración, con estos sorprendentes mortales realizando impresionantes incursiones hacia nuevos continentes. Un hombre en el origen de estos descubrimientos es Pedro Alvares Cabral, un noble portugués de menor rango convertido en explorador.\nNavegando lejos hacia el oeste, Cabral encontró una nueva masa continental que rápidamente reclamó para la corona de Portugal. Desde entonces ha participado en otras expediciones, pero una disputa con el rey Manuel I le hizo perder el favor y pronto se hundió en el olvido. Tal hombre ha demostrado sus talentos: un aventurero audaz, un líder de hombres, un renombrado almirante de flota... Si los mortales no saben apreciarlo, quizás podrías presentárselo a una nueva «familia» que valore sus méritos..."
 Abu_al_Hasan_Ali_ibn_Othman: "Abu al-Hasan Ali ibn Othman"
 podgreatpersons.0147.t: "Abu al-Hasan Ali ibn Othman"
 podgreatpersons.0147.desc: "Has estado siguiendo de cerca la vida de Abu al-Hasan Ali ibn Othman, el sultán mariní del norte de África. Bajo su liderazgo, Marruecos extendió su dominio sobre Tremecén e Ifriqiya, que juntos cubren todo el norte de África. Bajo su mando, los dominios marines en el Magreb cubrieron brevemente un área que rivalizaba con la del anterior Califato Almohade.\nSus campañas contra los ibéricos tuvieron resultados más mixtos, pero también mostraron cierta astucia política al tratar con el difícil Sultanato de Granada. Un gobernante tan poderoso suele estar lejos del alcance de los vampiros, pero se ha presentado una oportunidad.\nUna serie de contratiempos ha debilitado severamente su mandato. Mientras viajaba para asegurar su señorío, fue traicionado por su hijo y obligado a abdicar, antes de huir a las montañas del Atlas para escapar de la muerte.\nEste podría ser tu momento para atacar y ofrecer una segunda oportunidad al sultán exiliado..."
 Nanda_Pakyan: "Nanda Pakyan"
 podgreatpersons.0148.t: "Nanda Pakyan"
 podgreatpersons.0148.desc: "El Reino de Sagaing ha visto tres reyes diferentes en los últimos años... pero solo un primer ministro. Nanda Pakyan ha sido el poder detrás del reino durante décadas, traicionando fácilmente a cualquiera que se interponga en su camino y colocando títeres en el trono, reemplazándolos cuando es necesario. A todos los efectos, él gobierna el país. Su maestría en la intriga de la corte es casi suficiente para envidiar a algunos vampiros.\nSin embargo, el tiempo no espera a ningún hombre mortal, y la vejez ha alcanzado al primer ministro. Los numerosos enemigos que se hizo durante su carrera pronto cerrarán sobre él, a menos que intervengas..."
 Sulaiman_Al_Mahri: "Sulaiman Al Mahri"
 podgreatpersons.0149.t: "Sulaiman Al Mahri"
 podgreatpersons.0149.desc: "Es una época de exploración y descubrimientos para los mortales. Pocas personas representan mejor este periodo que Sulaiman Al Mahri. Este capitán otomano es un erudito estudiante de filosofía y ciencia, pero también un alma audaz que ha descubierto nuevas tierras lejos en el Este.\nEn sus diarios, Al Mahri anota las islas frente a la costa oeste de Malasia, pero también Malaca, Singapur, partes de Samarra, Java, China, las costas de Birmania y las Islas Andamán y Nicobar.\nA medida que la vejez le alcanzó y con sus diarios terminados, Sulaiman ha regresado a su Tierra Natal para terminar su aventura. Pero podrías asegurarte de que una nueva comience para él muy pronto..."
 Diego_de_Ordaz: "Diego de Ordaz"
 podgreatpersons.0150.t: "Diego de Ordaz"
 podgreatpersons.0150.desc: "Has estado siguiendo de cerca las hazañas de los conquistadores, esos mortales que buscan fama y fortuna en ultramar. Lamentablemente, solo tienes acceso a relatos de segunda mano, ya que mitos y realidades suelen entrelazarse con tales personajes. Sin embargo, la suerte está de tu parte, pues un tal Diego de Ordaz ha desembarcado en un pequeño puerto cerca de tus agentes.\nEste hombre fue uno de los soldados de Cortés y participó en la conquista de Tenochtitlán y en la búsqueda de El Dorado. Si tan solo la mitad de los rumores que has oído sobre tales eventos fueran ciertos, quizás querrías preservar la existencia de Diego para «uso futuro»..."
 Gulbadan_Begum: "Gulbadan Begum"
 podgreatpersons.0151.t: "Gulbadan Begum"
 podgreatpersons.0151.desc: "Varias mujeres reales del Imperio mogol regresan a la India tras una peregrinación a La Meca. Has estado vigilando de cerca su progreso, ya que entre ellas se encuentra Gulbadan Begum, la «tía real», una figura importante y querida en la corte del emperador Akbar.\nEjerciendo una gran influencia y respeto en la casa imperial de Agra, también es conocida como una talentosa poeta. Pero su obra más notable es el Humayun-Nama, el relato de la vida de su medio hermano, el emperador Humayun.\nSu regreso de La Meca es una oportunidad única para organizar un «accidente», ya que algunos cortesanos tuyos insisten en que su conocimiento sobre la política mortal actual podría ser de gran utilidad."
 Jacob_Palaeologus: "Jacob Palaeologus"
 podgreatpersons.0152.t: "Jacob Palaeologus"
 podgreatpersons.0152.desc: "Un hombre extraño ha sido arrestado cerca de tu área de influencia. Afirmando ser descendiente de la familia imperial bizantina, este Jacob Palaeologus podría tener más enemigos que tú mismo.\nUn incansable polémico contra el calvinismo y el poder papal, Palaeologus cultiva una amplia gama de contactos y corresponsales de alto nivel en las casas imperial, real y aristocrática de Europa del Este y el Imperio otomano; mientras formula y propaga una versión radicalmente heterodoxa del cristianismo, en la que no se debía invocar a Jesucristo en el culto, y donde las supuestas diferencias irreconciliables entre el cristianismo, el islam y el judaísmo eran rechazadas como fabricaciones espurias.\nEs perseguido continuamente por sus muchos enemigos, escapando repetidamente gracias a sus numerosos apoyos encubiertos. ¿Tal vez podrías añadirte tú mismo a esa lista? El hombre claramente tiene pasión, talento y una pura osadía que merece ser admirada."
 Reynold_Basztely: "Reynold Basztely"
 podgreatpersons.0153.t: "Reynold Basztely"
 podgreatpersons.0153.desc: "Has estado siguiendo la carrera de un mortal durante bastante tiempo. Este Reynold Basztely es un barón, soldado y cortesano húngaro que fue un ferviente partidario del duque Esteban. Originario de una familia de servidores reales, ascendió a la nobleza gracias a sus éxitos militares y su lealtad.\nHungría ha pasado por muchos problemas recientemente, con varias guerras civiles, pero Reynold siempre se ha mantenido fiel a su señor, llegando muy cerca de la muerte para proteger a la familia real. Cuando el trono fue finalmente heredado por un niño, Reynold fue el pilar inamovible de la corte, asegurándose de que su rey no sufriera ningún daño.\nTal exhibición constante de lealtad, destreza en las armas y agudo sentido político es intrigante y, dado que Reynold ha sido ascendido recientemente a otro cargo lejos de la corte, podrías estar interesado en organizar un «accidente» para hacerlo desaparecer de la historia mortal."
 Michael_Tarchaneiotes_Glabas: "Michael Tarchaneiotes Glabas"
 podgreatpersons.0154.t: "Michael Tarchaneiotes Glabas"
 podgreatpersons.0154.desc: "El Imperio Bizantino, aunque se ha recuperado un poco de la Cuarta Cruzada, sigue sumido en la agitación. Atacado por el Segundo Imperio Búlgaro, Serbia, los Angevino de Nápoles y el Despotado de Épiro, su supervivencia se debe principalmente a un hombre: Michael Tarchaneiotes Glabas. Comandante diligente y hábil, Glabas ha sido un general exitoso durante casi 40 años. Incluso los contratiempos o derrotas ocasionales solo fortalecieron sus habilidades, y pocos pueden jactarse de haberle ganado realmente una guerra.\nAhora convertido en un anciano, Glabas ha estado escribiendo un manual de guerra para transmitir su valiosa experiencia. Pero como criatura de la noche, tú tienes otra posibilidad, una que podría darte al hombre mismo y no solo un libro."
 Haci_Ilbey: "Haci Ilbey"
 podgreatpersons.0155.t: "Haci Ilbey"
 podgreatpersons.0155.desc: "En las guerras turcas en Anatolia, el beylik otomano está ganando terreno cada día más. Has sabido que este progreso se debe en parte a un tal Haci Ilbey, un comandante de otro beylik que desertó a los otomanos.\nDesde entonces, se ha hecho un nombre, capturando Lüleburgaz y Edirne, que pronto se convirtió en la capital del imperio. Mientras el nuevo sultán Murat I estaba ocupado capturando Biga en Anatolia, un ejército cruzado apareció cerca del río Maritsa en Rumelia. Haci Ilbey fue enviado con una fuerza de expedición relativamente pequeña contra los cruzados. Los derrotó en un ataque nocturno sorpresa.\nSin embargo, la política otomana es incluso más mortal que sus campos de batalla, y los rumores dicen que la corte está planeando el fin de Haci, preocupada por su repentino ascenso de fama y poder. Este podría ser el momento de intervenir."
 Malik_Kafur: "Malik Kafur"
 podgreatpersons.0156.t: "Malik Kafur"
 podgreatpersons.0156.desc: "Un prominente general esclavo del Sultanato de Delhi, de quien se rumorea que fue comprado por 1000 dinares según su apodo, Malik Kafur ascendió rápidamente en los rangos, principalmente debido a su probada capacidad como sabio consejero y comandante militar.\nComo general de las fuerzas de Delhi, Kafur derrotó a los invasores mongoles en 1306. Posteriormente, lideró una serie de expediciones en la parte sur de la India, contra los Yadavas (1308), los Kakatiyas (1310), los Hoysalas (1311) y los Pandyas (1311). De estas campañas trajo muchos tesoros, así como muchos elefantes y caballos para el Sultanato de Delhi.\nDespués de que el sultán enfermara gravemente, fue llamado de vuelta a Delhi, donde ahora ejerce el poder como Na'ib (virrey). Malik claramente está intentando usurpar el poder, usando al hijo menor del sultán como títere.\nTus contactos en la corte te advierten que Malik está fuera de su liga y que se está formando una coalición contra él para destituirlo del poder. Esta podría ser la ocasión perfecta para «salvarlo» y usar sus considerables habilidades para tu causa."
 Mikolaj_Hussowczyk: "Mikolaj Hussowczyk"
 podgreatpersons.0157.t: "Mikolaj Hussowczyk"
 podgreatpersons.0157.desc: "Un poeta, un cortesano, un tesorero, un cazador... el llamado Mikolaj Hussowczyk ha sido muchas cosas durante su larga carrera en las cortes polaca y lituana. Cercano al movimiento que los mortales llaman «Renacimiento», su obra es considerada la primera obra de ficción a gran escala sobre Lituania, lo que le ha valido mucho respeto y un creciente orgullo nacional por parte del Gran Ducado.\nEnviado como embajador ante el Papa en 1522, Mikolaj también sirvió como clérigo y notario público de la Santa Sede. Es un currículum impresionante que muestra una gran variedad de habilidades. Esto convierte a Mikolaj en un objetivo inusual pero tentador para un potencial $pod_Embrace$."
 Magdalena_de_la_Cruz: "Magdalena de la Cruz"
 podgreatpersons.0158.t: "Magdalena de la Cruz"
 podgreatpersons.0158.desc: "Una historia extraña ha llegado a tu corte recientemente. Magdalena de la Cruz, una mujer santa de la que se cree que mantiene una comunicación constante e íntima con Dios, ha confesado sus pecados recientemente. Estos incluyen «falsas profecías, visiones, milagros y acostarse con el diablo durante treinta años».\nTras su confesión, parece que sus estigmas demoníacos desaparecieron de algún modo. Es difícil saber la verdad en este asunto. ¿Fue un fraude? ¿Fue forzada su confesión? ¿Qué hay de sus milagros y supuestas conversaciones tanto con Dios como con el Diablo?\nTienes curiosidad, y esa curiosidad podría llevarla a encontrarse con otro tipo de criaturas malditas..."
 Audun_Hugleiksson: "Audun Hugleiksson"
 podgreatpersons.0159.t: "Audun Hugleiksson"
 podgreatpersons.0159.desc: "El rey Eirik Magnusson de Noruega murió recientemente, lo que ha provocado un gran revuelo en la política mortal. Su sucesor es su hermano menor, el rey Haakon V, quien ha comenzado a destruir la mayor parte de la antigua estructura política dejada por su predecesor.\nUno de esos hombres acorralados es Audun Hugleiksson, la mano derecha del difunto rey Eirik, que desempeñó un papel importante como abogado, político y ministro de hacienda. Quizás un papel demasiado importante, ya que el rey Haakon ha empezado a actuar contra él, confiscando sus propiedades y revocando sus títulos. Es solo cuestión de tiempo antes de que la propia vida de Audun se vea amenazada.\nHabiendo demostrado ser un administrador capaz y un consejero competente, podrías querer actuar para evitarle ese sombrío destino."
 podgreatpersons.1000.t: "Un competidor"
 podgreatpersons.1000.desc: "Tu última «adquisición» ha despertado la curiosidad de un gobernante cercano que ahora presiona para que tu nuevo mortal «visite» su corte. Estás bastante seguro de lo que pasará si aceptas esta petición y no te agrada especialmente perder a tu nuevo invitado.\n¿Cómo lidiarás con la situación?"
 podgreatpersons.1000.a: "Los distraeré con otros esquemas insignificantes."
 podgreatpersons.1000.b: "¡Este mortal es mío!"
 podgreatpersons.1000.c: "Si yo no puedo tenerlo, nadie lo hará."
 podgreatpersons.1000.d: "Je, de todos modos no me importaba mucho."
 podgreatpersons.1000.customa: "Mantendrás al Gran Personaje en disputa bajo tu cuidado."
 podgreatpersons.1000.customb: "Cederás al Gran Personaje en disputa a tu competidor."
 podgreatpersons.0160.t: "Shajar al-Durr"
 podgreatpersons.0160.desc: "Una esclava infantil destacada por su inteligencia y belleza, Shajar al-Durr ha ascendido hasta convertirse en la gobernante del poderoso Sultanato de Egipto. La muerte de su marido, el caos provocado por la Séptima Cruzada y su propia y considerable astucia política y ambición han contribuido ciertamente a ello, pero esto sigue siendo una hazaña impresionante considerando los prejuicios contra su género, especialmente por parte del califa abasí que se negó a reconocer su mandato.\nTales gobernantes poderosos suelen estar fuera del alcance de la política de los $pod_cainite$, ya que son demasiado visibles, pero tus agentes informan de un acontecimiento interesante. La implicación de Shajar en el asesinato de su último marido ha sido revelada públicamente y su capital político no es suficiente para encubrirlo. Los partidarios de su marido la han arrestado y ahora está encarcelada en la Torre Roja, donde lo más probable es que sufra un «accidente» en los próximos días, como suele ser costumbre en este tipo de conspiraciones palaciegas.\nEste podría ser el momento perfecto para que finjas su muerte e introduzcas a la ambiciosa sultana en un nivel totalmente nuevo de poder e intrigas."
 Mohammad_al_Sahuir: "Mohammad al-Sahuir"                         
 podgreatpersons.0161.t: "Mohammad al-Sahuir"
 podgreatpersons.0161.desc: "Un carismático comandante andalusí se ha hecho un nombre considerablemente recientemente. Este «al-Azraq» (el Azul) es vasallo del rey de Aragón, pero tiene una concepción muy discutible de la lealtad, habiendo lanzado ya varias rebeliones militares contra su señor, incluyendo un intento personal contra su vida. Curiosamente, al-Azraq parece lo suficientemente agradable como para que sus «estallidos» fueran perdonados cada vez, llegando incluso a ganar algunas tierras cerca del Reino de Valencia.\nEs raro que un mero mortal muestre tales habilidades tanto en política como en la guerra, y por ello lo has mantenido vigilado. Es una buena idea, ya que al-Azraq ha comenzado recientemente otra de sus pintorescas insurrecciones. A su avanzada edad, sin embargo, todo puede pasar, y pocos levantarían la ceja si llegaras a orquestar sutilmente su «muerte»..."
 Ibn_al_Khatib: "Ibn al-Khatib"                         
 podgreatpersons.0162.t: "Ibn al-Khatib"
 podgreatpersons.0162.desc: "Un poeta, escritor, historiador, filósofo, médico y político del Emirato de Granada, Lisan Al-Din Ibn Al-Khatib es reconocido por su amplio conjunto de habilidades. A menudo se le considera la principal potencia en Granada; sin embargo, Ibn al-Khatib siempre fue leal ante todo a Marruecos, y esta complicada relación con Al-Ándalus le ha traído problemas.\nUn nuevo sultán marroquí ha llegado al poder, alguien que tiene una deuda con Granada, y esa deuda podría tomar la forma de la cabeza de Ibn al-Khatib, todavía buscada por el actual emir de Granada. Si bien el hombre ciertamente ha cometido errores en su carrera política, también mostró potencial como candidato para tu corte. Como mínimo, sus poemas y sus detalladas obras sobre medicina merecen una lectura; de este modo, también podría serte útil con ese conocimiento específico."
 Nasir_al_Din_al_Tusi: "Nasir al-Din al-Tusi"                   
 podgreatpersons.0163.t: "Nasir al-Din al-Tusi"
 podgreatpersons.0163.desc: "Un polímata persa, arquitecto, filósofo, médico, científico y teólogo. Nasir al-Din al-Tusi es un autor muy prolífico que escribe sobre temas de matemáticas, ingeniería, prosa y misticismo. Además, al-Tusi realizó varios avances científicos. En astronomía, creó tablas muy precisas del movimiento planetario, un modelo planetario actualizado y críticas a la astronomía ptolemaica. También logró avances en lógica, matemáticas, pero especialmente en trigonometría, biología y química.\nNo cabe duda de que es una de las mentes más brillantes de esta era y varios otros $pod_cainites$ ya han estado haciendo incursiones para atraerlo a sus cortes. Al-Tusi es ahora anciano, y los mortales no viven para siempre, por lo que podría ser tu última oportunidad de asegurar a semejante genio para tu servicio."
 Nils_Dacke: "Nils Dacke"                   
 podgreatpersons.0164.t: "Nils Dacke"
 podgreatpersons.0164.desc: "Los campesinos mortales se están rebelando contra su Rey en Suecia. No es un suceso especialmente raro, pero su éxito ciertamente sí lo es. Liderados por un audaz rebelde llamado Nils Dacke, los campesinos han derrotado a un ejército de mercenarios extranjeros y han tomado el control de la mayor parte del sur de Suecia. Su éxito, y el fuego de la rebelión que se extiende, incluso han forzado al Rey a un humillante tratado de paz...\nQue rompió un año después. Dacke se había vuelto demasiado confiado en aquel momento, y la batalla campal se inclinó a favor del más disciplinado ejército real, terminando con el líder campesino huyendo para salvar su vida. Se ha puesto la caza sobre el famoso proscrito pero, si así lo deseas, deberías ser capaz de acorralar a Nils antes de que los soldados del Rey lleguen a él. Aunque podría ser tentar al destino dar la vida eterna a semejante agitador, será, como mínimo, un cambio de ritmo bienvenido frente a las habituales intrigas nocturnas de la política vampírica."
 Pero_da_Covilha: "Pero da Covilha"                    
 podgreatpersons.0165.t: "Pero da Covilha"
 podgreatpersons.0165.desc: "Un aventurero de bajo nacimiento pero hábil espadachín y leal servidor de la Corona portuguesa, Pero da Covilha emprendió una Misión de exploración en el Próximo Oriente y las regiones adyacentes de Asia y África, así como otras misiones diplomáticas a los Señoríos vecinos. Sus aventuras lo llevaron hasta el océano Índico, hasta que encontró el camino de vuelta a Etiopía. Allí fue recibido y desde entonces es tratado como un invitado respetado, pero también se le prohíbe marcharse.\nPero ha aceptado esta jaula de oro con Gracia, sirviendo como una especie de embajador portugués mientras esté aquí. Aunque es amado por la corte etíope, y sigue siendo querido por la portuguesa, parece que la carrera de este hombre tan dedicado terminará aquí, lejos tanto de su hogar como de sus aventuras. A menos que tú intervengas..."
 podgreatpersons.0166.t: "Khutulun"
 podgreatpersons.0166.desc: "La hija del poderoso Kaidu Khan es una mujer temible, reconocida como una luchadora que planteaba un desafío a cualquier pretendiente que se atreviera a vencerla en combate singular. Esto resultó ser una tarea imposible y pronto Khutulun ganó cientos de caballos como salario de sus pretendientes derrotados. Era, con diferencia, la favorita de su padre, quien a menudo buscaba su apoyo en asuntos tanto políticos como militares e incluso consideró nombrarla su sucesora.\nSin embargo, tras el reciente fallecimiento del Khan, sus hijos no están tan dispuestos a ser gobernados por una mujer, ni siquiera por alguien tan formidable como su hermana. Se están afilando dagas y parece probable que los días de Khutulun estén contados, ya que su honesta bravura no es muy adecuada para tal Intriga palaciega. Podría ser un buen momento para que intervengas y salves a la famosa «mujer tigre de las estepas»."
 Guush_Luvsandanzan: "Guush Luvsandanzan"                              
 podgreatpersons.0167.t: "Guush Luvsandanzan"
 podgreatpersons.0167.desc: "La historia del gran Gengis Khan, plagada de mitos y exageraciones, ha sido aclarada recientemente por un tal Guush Luvsandanzan, historiador y escritor mongol. En su Altan Tobchi, el erudito describe con detalle la historia del pueblo mongol desde su nacimiento mítico hasta el propio Gengis. También es significativa en cuanto a que es una fuente principal de conocimiento sobre el «Chingisiin Bilig» o la Sabiduría de Gengis, un código de conducta ética dirigido específicamente a las futuras generaciones de la nobleza gobernante mongola.\nLa vida de Gengis fue corta para un inmortal como tú, pero el hombre en sí estaba claramente por encima de los otros mortales. Como tal, estás considerando leer el libro tú mismo para quizás extraer algo de sabiduría de él... o tal vez «invitar» a su autor a tu corte. Después de todo, siempre es mejor volver a la fuente original."
 Job_Charnock: "Job Charnock"                          
 podgreatpersons.0168.t: "Job Charnock"
 podgreatpersons.0168.desc: "Los británicos y sus representantes están ganando cada vez más control sobre la India. Como tal, has estado vigilando sus actividades durante un tiempo. El actual administrador inglés de la Compañía de las Indias Orientales es un hombre interesante. Ha sido diligente en erradicar la corrupción y los peores excesos de sus compatriotas desde hace un tiempo. Esto, sumado a su matrimonio con una mujer hindú, le ha ganado muchos enemigos, especialmente porque se le conoce como un hombre algo melancólico y con poco tiempo para la diplomacia.\nAun así, sus logros son muchos, desde su conflicto contra el Nawab mogol hasta la expedición de Chittagong en las profundidades de Bengala. Sin embargo, la vejez le está alcanzando, y podría ser el momento de que actúes y lo traigas a tu corte si buscas a algún mortal talentoso."
 Al_Sahili: "Al Sahili"                    
 podgreatpersons.0169.t: "Al Sahili"
 podgreatpersons.0169.desc: "El Hajj de Mansa Musa fue un acontecimiento glorioso del que todavía se habla en todo el mundo musulmán. Por ello, muchos eruditos han realizado el Viaje hacia la capital de Musa, Tombuctú, para ver por sí mismos la gloria de Malí. Uno de esos eruditos es Abu Ishaq al-Sahili, un poeta granadino muy apreciado por el propio Musa.\nEl andalusí ha establecido su nuevo hogar en Malí y sus contribuciones, incluyendo proyectos arquitectónicos y gestiones diplomáticas, son muy valoradas por la corte. Recientemente regresó de una embajada en Marruecos y se ha sentido mal desde entonces. A su avanzada edad, a nadie le sorprendería que muriera por esta dolencia, lo que te daría la oportunidad de traértelo, quizás como candidato al $pod_Embrace$."
 Emotan: "Emotan"                     
 podgreatpersons.0170.t: "Emotan"
 podgreatpersons.0170.desc: "Los hermanos se enfrentaban entre sí en la última guerra civil que asoló gran parte de Benín. Oba Ewuare ha emergido triunfante recientemente, debido principalmente a la inesperada ayuda de una humilde mujer del mercado llamada Emotan, que le advirtió sobre las conspiraciones de su hermano. Su asistencia fue decisiva para ayudar a poner fin al conflicto y, aunque no conoces los detalles, parece que el nuevo gobernante planea recompensarla generosamente con algunos cargos prestigiosos e incluso plantando un sagrado árbol Uruhe en su honor.\nA pesar de todo esto, Emotan sigue llevando una vida mayormente tranquila hasta ahora, lo que significa que tienes una ventana de oportunidad potencial para fingir su muerte y traerla a tu corte antes de que su fama sea demasiado grande para actuar."
 Thomais_Orsini: "Thomais Orsini"                    
 podgreatpersons.0171.t: "Thomais Orsini"
 podgreatpersons.0171.desc: "La política de los mortales se está moviendo a un ritmo vertiginoso en los Balcanes últimamente y te está costando seguir la serie de conquistas, guerras civiles y asesinatos. Uno de tus agentes te está entregando un informe sobre la situación, indicando que el Imperio Serbio está en ascenso tras otra guerra civil en el Imperio Bizantino. Los nuevos gobernantes de la región han comenzado a consolidar su poder mediante el nombramiento de gobernadores y matrimonios con nobles locales.\nUna de esas nobles es Thomais Orsini, hija tanto de un prestigioso linaje bizantino como de los anteriores gobernantes italianos de Épiro. Esto la ha convertido en un premio codiciado por cualquiera que desee gobernar Épiro, y su vida ha sido una sucesión de tales movimientos políticos e intrigas a su alrededor.\nEsto podría haber sido una buena preparación para la vida eterna en la mortal política de los $pod_cainites$, algo de lo que pocos mortales pueden presumir. Estás considerando organizar un «accidente» para ella y traerla a tu corte como una potencial candidata al $pod_Embrace$."
 Dilshad_Khatun: "Dilshad Khatun"                   
 podgreatpersons.0172.t: "Dilshad Khatun"
 podgreatpersons.0172.desc: "Los mongoles han gobernado Persia durante un tiempo, pero la estabilidad de su Señorío se está desmoronando lentamente. Un estado sucesor, el Sultanato Jalayirid, está surgiendo en este vacío de poder. Una mujer está navegando durante este difícil periodo con habilidades considerables. Dilshad, una princesa mongola, estaba destinada inicialmente a convertirse en Emperatriz del Ilkanato pero, con la disolución de este reino, ha migrado a Diyarbakir, donde se ha convertido en un premio muy buscado por los muchos señores de la guerra ambiciosos de la región.\nApaciguando con cuidado a los más agresivos cuando era necesario, logró convertirse en la mujer más poderosa de Irak y en una fuerza política considerable por derecho propio. Ha utilizado esta posición tanto para su beneficio, vengándose de quienes la menospreciaron, como para el bien común, siendo conocida como una gobernante caritativa cercana al pueblo.\nSin embargo, su historia parece estar llegando a su fin, ya que uno de los señores de la guerra agraviados está, según tus fuentes, planeando envenenarla en un próximo evento. Esta advertencia te da una pequeña ventana para intervenir si así lo deseas."
 Zaria: "Zaria"          
 podgreatpersons.0173.t: "Zaria"
 podgreatpersons.0173.desc: "África Central arde mientras una nueva Reina ha iniciado una larga campaña de conquista en los fracturados estados Hausa. Esta temible mujer llamada Amina ya ha subyugado a muchos de sus vecinos tras asegurarse de que todo su pueblo porta un arma en todo momento. Ya circulan relatos sobre la poderosa Reina Guerrera que ha jurado no detener su marcha de guerra hasta que África esté unida bajo su estandarte.\nEn este elevado objetivo, cuenta con el apoyo de su hermana, no menos temible, Zaria, a quien se ve a menudo liderando las cargas de caballería junto a su soberana. La propia Amina está fuera de tu alcance, ya que es una gobernante demasiado popular y cualquier interferencia podría recaer sobre ti. Zaria, sin embargo... si así lo desearas, podrías fingir una muerte en el campo de batalla y traerla ante ti. No todos los días un mortal tan impetuoso y talentoso está potencialmente a tu alcance."
 Dmitry_Gerasimov: "Dmitry Gerasimov"                    
 podgreatpersons.0174.t: "Dmitry Gerasimov"
 podgreatpersons.0174.desc: "Un traductor, diplomático y filólogo ruso, Dmitry Gerasimov se hizo un nombre como embajador ante el Papa Clemente VII, donde conversó y dejó una fuerte impresión en muchos eruditos del Renacimiento italiano. De vuelta en Rusia, Dmitry dedicó su vida como traductor a muchas obras religiosas latinas al idioma eslavo, codificando muchas reglas útiles para la naciente gramática eslava.\nUn hombre tan culto y viajado no aparece tan a menudo como se pensaría, y su relativo aislamiento de la política mortal lo convierte en un objetivo algo fácil si deseas emplear sus servicios."
 Jamal_ud_Din_Yaqut: "Jamal ud-Din Yaqut"                      
 podgreatpersons.0175.t: "Jamal ud-Din Yaqut"
 podgreatpersons.0175.desc: "Un esclavo africano de origen humilde, Jamal ud-Din Yaqut ascendió muy rápidamente en la estructura de poder del Sultanato de Delhi gracias a su amistad (algunos dirían «aventura») con Razia Sultana, la monarca actual. Leal y devoto a su soberana, la perspicacia marcial y la destreza física de Jamal son valoradas por la corte, pero su repentino ascenso como confidente de Razia le ha ganado muchos enemigos. Este desafío al poder de la nobleza turca de Delhi está llegando a un punto crítico, ya que han comenzado una rebelión abierta.\nLa causa de Jamal y Razia parece desesperada, ya que están muy superados en número por las tropas turcas, mejor entrenadas, y su reciente derrota a las afueras de Delhi no ha hecho más que acelerar lo inevitable. Sin embargo, en la confusión de la guerra y la actual contienda por el poder, podrías encontrar una oportunidad. Jamal es un hombre ingenioso y podría ser un valioso candidato para el $pod_Embrace$."
 Khwaju_Kermani: "Khwaju Kermani"                    
 podgreatpersons.0176.t: "Khwaju Kermani"
 podgreatpersons.0176.desc: "Un famoso poeta persa y místico sufí ha llamado recientemente tu atención. Un hombre muy viajado, Khwaju Kermani ha estado por todo el mundo musulmán antes de establecerse en Bagdad para escribir su Homay o Homayun, un poema que narra el acontecimiento de un apuesto Príncipe que se enamora de una Princesa extranjera. También conocido como un hombre erudito, ha servido como poeta de la corte de muchos gobernantes de la zona, lo que lo convierte en un diplomático sólido y bien familiarizado con los tiempos. Estas numerosas cualidades lo han convertido en el tema de conversación de tu corte y has detectado varias oportunidades que podrían acercarlo a tu esfera de influencia si así lo desearas."
 Mawlana_Jami: "Mawlana Jami"                     
 podgreatpersons.0177.t: "Mawlana Jami"
 podgreatpersons.0177.desc: "Conocido por sus logros como prolífico erudito y escritor de literatura mística sufí, Mawlana Jami es principalmente un destacado poeta-teólogo de la escuela de Ibn Arabi y un sufí Khwajagani, reconocido por su elocuencia y por su análisis de la metafísica de la misericordia. También ocupó un puesto importante en la corte timúrida, involucrado en la política, economía, filosofía y vida religiosa de la época. Jami escribió aproximadamente ochenta y siete libros y cartas. Sus obras abarcan desde la prosa hasta la poesía, y desde lo mundano hasta lo religioso. También ha escrito obras de historia y ciencia.\nUn erudito tan completo ciertamente podría impresionar en tu corte si logras «adquirirlo» antes de que la Muerte lo haga."
 Zafar_Khan: "Zafar Khan"                     
 podgreatpersons.0178.t: "Zafar Khan"
 podgreatpersons.0178.desc: "Alauddin Khalji, el último Sultán de Delhi, ha estado cosechando éxito tras éxito desde su usurpación del trono gracias a un brillante general llamado Zafar Khan. Asociado con Alauddin desde sus días como gobernador de Kara, Zafar Khan lideró una división principal del ejército de Alauddin desde Kara hasta Delhi después de que Alauddin asesinara a su predecesor Jalaluddin en 1296. Luego lideró el ejército que invadió Multán para eliminar a los miembros supervivientes de la familia de Jalaluddin.\nZafar Khan también lideró el ejército de Delhi que infligió una derrota aplastante a los invasores mongoles chagatai en Jaran Manjur en 1298. Más tarde ese año, Alauddin envió a Zafar Khan para recapturar Sivistan de manos de los mongoles. Zafar Khan derrotó decisivamente a los invasores y llevó a su líder a Delhi como prisionero.\nSin embargo, la habilidad de Zafar no parece ser suficiente para salvarlo del regreso del ejército mongol. A pesar de infligirles graves bajas en Kili, la enorme diferencia de números es simplemente demasiado grande para superarla. No obstante, podrías aprovechar el caos de tal batalla para secuestrar a Zafar y traerlo a tu corte."
 podgreatpersons.0179.t: "Anu"
 podgreatpersons.0179.desc: "El legado del Imperio mongol todavía se siente en las estepas y muchos señores de la guerra compiten por una parte de este otrora poderoso señorío. Galdan Boshughtu Khan es el último en esta larga lista y ha disfrutado de un éxito notable desde China hasta Kazajistán. Pero el poderoso Imperio Qing ha tomado nota.\nEl emperador Kangxi de la dinastía Qing lideró personalmente las fuerzas expedicionarias. Galdan movió su ejército hacia el sur desde las montañas Khentii para encontrarse con la columna occidental del ejército Qing en la batalla de Jao Modo en mayo de 1696, pero sus tropas pronto fueron rodeadas por las superiores fuerzas Qing. Anu, la esposa de Galdan, lideró personalmente un contraataque que permitió a su marido escapar.\nSin embargo, recibió una flecha durante su valiente carga y ahora yace en su lecho de muerte. La sangre vampírica sería suficiente para salvarla y podría ganarte la lealtad de una valiente y hábil princesa en el proceso."
 Idia: "Idia"            
 podgreatpersons.0180.t: "Idia"
 podgreatpersons.0180.desc: "La Reina Madre de Benín se ha vuelto famosa recientemente por haber desempeñado un papel fundamental en el ascenso y reinado de su hijo, siendo descrita como una gran guerrera que luchó implacablemente antes y durante el reinado de su hijo como oba (rey) del pueblo Edo. La reina Idia fue decisiva para asegurar el título de oba para Esigie tras la muerte de su padre, el oba Ozolua. Con ese fin, levantó un ejército para combatir a su hermano Arhuaran, quien fue posteriormente derrotado en batalla. Así, Esigie se convirtió en el 17.º oba de Benín.\nPosteriormente, el pueblo vecino Igala envió guerreros a través del río Benue para arrebatar el control de los territorios septentrionales de Benín. Esigie conquistó a los Igala, restableciendo la unidad y la fuerza militar del reino. Su madre, Idia, recibió gran parte del mérito de estas victorias, ya que su consejo político, junto con sus poderes mágicos y conocimientos medicinales, fueron considerados elementos críticos del éxito de Esigie en el campo de batalla.\nUna mujer tan talentosa no aparece a menudo y estás considerando seriamente si los beneficios potenciales de traerla a tu corte podrían compensar los riesgos de quedar expuesto."
 podgreatpersons.0001.generic: "Un personaje intrigante ha mostrado un potencial real últimamente en el mundo mortal. Podrías usar parte de tu influencia para traerlo a tu corte si necesitas individuos talentosos como este."                                     
 podgreatpersons.0181.t: "Miguel"
 podgreatpersons.0181.desc: "La Reforma se está extendiendo por toda Europa, debilitando el control de la Iglesia sobre la gente y su capacidad para cazar vampiros y otros seres sobrenaturales. Como tal, muchos están siguiendo de cerca los últimos avances de este movimiento.\nMartin Lutero, una figura destacada de la Reforma, ha estado conversando recientemente con alguien a quien los europeos llaman «Miguel el Diácono», aparentemente un representante de la Iglesia Copta de Etiopía. Los dos hombres encontraron muchas similitudes entre sus filosofías y Miguel ha regresado recientemente a Etiopía con la oferta de Lutero de invitar a la Iglesia etíope a una plena comunión.\nAunque las consecuencias de este acontecimiento aún no están claras, es evidente que el diácono es un diplomático experimentado, un teólogo erudito y alguien que no teme a los viajes largos y peligrosos. Tales cualidades podrían convertirlo en un candidato interesante para el «reclutamiento»."
 Soumaoro_Kante: "Soumaoro Kante"                    
 podgreatpersons.0182.t: "Soumaoro Kante"
 podgreatpersons.0182.desc: "El Imperio de Ghana se está desmoronando y varios señores de la guerra han estado aprovechando sus restos durante algún tiempo. El más exitoso ha sido Soumaoro Kante, el llamado Rey Hechicero, reputado por sus poderes mágicos que le han ayudado a subyugar a varios señores de la guerra menores.\nSin embargo, Kante se ha encontrado recientemente con su rival, ya que el príncipe mandinga Sundiata Keita formó una coalición de reinos menores para oponerse a él en la batalla de Kirina, derrotándolo y obligándolo a huir a una cordillera cercana. Los hombres del príncipe le pisan los talones en este momento, pero eso podría ser una oportunidad interesante para intervenir. Sería fácil fingir la muerte de Kante y traerlo a tu corte. Si realmente tiene acceso a poderes mágicos, sería un candidato bastante atractivo para el $pod_Embrace$..."
 al_Hasan_Muhammad_al_Wazzan: "al-Hasan Muhammad al-Wazzan"                     
 podgreatpersons.0183.t: "al-Hasan Muhammad al-Wazzan"
 podgreatpersons.0183.desc: "Un viajero y diplomático andalusí, al-Hasan Muhammad al-Wazzan, pasó la mayor parte de su vida en África, donde fue un miembro valorado de varias cortes importantes como la de Tombuctú. Al regresar a su hogar, fue capturado por los Caballeros Hospitalarios y, con sus historias intrigando a los cristianos, fue presentado ante el Papa, donde fue liberado, recibió una pensión y se convirtió como «Leo Africanus».\nSus relatos sobre las riquezas africanas dieron lugar a varios libros patrocinados por la propia Santa Sede y despertaron la excitación de los exploradores europeos a medida que sus obras se volvían cada vez más populares. Tras una muy exitosa gira por Italia, la fortuna de al-Wazzan cambió cuando el nuevo Papa demostró desconfianza hacia un musulmán convertido en la corte. Como tal, decidió regresar al norte de África, concretamente a Túnez, donde volvió a convertirse al islam. Todavía permanece allí hasta la noche de hoy, presentándose como un objetivo intrigante para un potencial $pod_Embrace$ o Ghoul."
 Ilya_Muromets: "Ilya Muromets"                    
 podgreatpersons.0184.t: "Ilya Muromets"
 podgreatpersons.0184.desc: "Hijo de un granjero lisiado hasta avanzada su edad, Ilya fue curado milagrosamente por dos peregrinos. Desde entonces, sus relatos de valor han ido volviéndose cada vez más extravagantes, desde defender él solo la ciudad de Chernígov de las invasiones nómadas hasta derrotar al «monstruo del bosque» Nightingale. De mente sencilla pero también temperamental, Ilya es conocido por sus frenéticos arrebatos casi tanto como por sus hazañas heroicas.\nNo puedes evitar sentir curiosidad por un personaje así. Si tan solo una pequeña parte de su historia fuera cierta, seguiría siendo un guerrero bastante formidable que probablemente ya conoce lo sobrenatural. Su intelecto simplista también es una ventaja, permitiéndote controlarlo con relativa facilidad.\nSi enviaras a tus agentes para que lo tengan como objetivo y lo traigan a tu corte, podrías evaluarlo para un puesto de Ghoul, o incluso para un potencial $pod_Embrace$..."
 Helene_Kottanner: "Helene Kottanner"                       
 podgreatpersons.0185.t: "Helene Kottanner"
 podgreatpersons.0185.desc: "La corte mortal húngara está en pleno caos porque su Corona Imperial ha sido robada recientemente. No es solo una reliquia inestimable, sino también el símbolo de la realeza húngara, y ningún Rey puede ser proclamado sin ella. Divertido por esta pequeña historia, hiciste que tus agentes investigaran un poco más y descubrieran a la culpable, una tal Helene Kottanner, sirvienta y niñera de la nobleza austriaca. Esto demuestra claramente que los mortales pueden ser bastante buenos en la intriga de pasillo cuando se lo proponen.\nKottanner entregó recientemente su bien robado a los austriacos, asegurando sus posibles grandes recompensas y la enemistad de los húngaros a cambio. Algunos miembros de tu corte están presionando con la idea de poner a la improbable ladrona bajo tu custodia. Después de todo, ha demostrado ser ingeniosa pero también muy leal a sus empleadores, cualidades muy fuertes para tener en un sirviente."
 Albertas_Gostautas: "Albertas Gostautas"                      
 podgreatpersons.0186.t: "Albertas Gostautas"
 podgreatpersons.0186.desc: "En el mundo mortal, los pueblos y las costumbres lituanas se están sumergiendo cada vez más en sus hermanos polacos de la «Mancomunidad Polaco-Lituana» a medida que pasa el tiempo, un desarrollo que sigues con moderado interés. Sin embargo, el último Gran Canciller del Ducado de Lituania, Albertas Gostautas, ha estado trabajando duro para preservar parte del legado de su pueblo. Es el iniciador y editor del Primer Estatuto de Lituania y cuida especialmente de los representantes de la literatura lituana mientras lucha contra la expansión polaca.\nAunque su influencia en el país es importante, llegando incluso a construir un castillo para sí mismo, la fortuna de su familia ha disminuido con los años. Este revés político lo ha convertido en un hombre más accesible de lo que era antes y la idea de traértelo ha estado circulando por la corte. Después de todo, un canciller competente y diligente siempre puede resultar útil."
 Mikhailo_Olelkovich: "Mikhailo Olelkovich"                                       
 podgreatpersons.0187.t: "Mikhailo Olelkovich"
 podgreatpersons.0187.desc: "La política de los principados rusos está evolucionando rápidamente y un noble sin tierras llamado Mikhailo Olelkovich ha estado en el centro de ella durante algún tiempo. Hermano del príncipe de Kiev, Mikhailo estuvo involucrado desde temprano en el intento de romper la dominación moscovita sobre la Rus mediante la forja de una alianza con la Mancomunidad Polaco-Lituana. Esto le llevó a provocar un levantamiento en Nóvgorod durante varios años hasta su derrota contra Moscovia.\nAl perder sus títulos en Rusia, Mikhailo se retiró a la Mancomunidad, donde se convirtió en un importante actor político, lo que resultó en su intento de golpe de Estado contra el Gran Duque. Sin embargo, la conspiración fue descubierta y Mikhailo pudre ahora en una celda, esperando su inevitable ejecución. Estás ponderando los méritos de intervenir para traerlo a la noche. El hombre ciertamente demostró capacidad para manipular bien la política, pero también tiene una preocupante falta de lealtad hacia sus señores..."
 Marfa_Boretskaya: "Marfa Boretskaya"                      
 podgreatpersons.0188.t: "Marfa Boretskaya"
 podgreatpersons.0188.desc: "En la política mortal, Moscovia está ganando cada vez más poder entre los principados rusos. La ciudad rival de Nóvgorod ha sido su último objetivo, con varios tratados vinculantes realizados para reducir su independencia. Esto ha derivado recientemente en una revuelta abierta encabezada por una tal Marfa Boretskaya, la esposa del alcalde de la ciudad.\nAl encontrar apoyo entre otros príncipes rusos e incluso en la cercana Mancomunidad Polaco-Lituana, Marfa logró reunir un ejército grande, aunque muy dispar. Al final, sin embargo, todo fue en vano, ya que Iván III, príncipe de Moscovia, marchó para derrotarlo.\nAunque logró proteger la independencia de la ciudad durante varios años más, Iván finalmente anexionó la ciudad y la arrestó, y ahora ella viaja hacia Moscú para enfrentar su sentencia.\nAlgunos miembros de tu corte, impresionados por el carisma y la resiliencia de esta mujer, abogan por que tomes medidas y la salves, pensando que podría ser un activo poderoso para tu causa."
 podgreatpersons.0189.t: "Fatima"
 podgreatpersons.0189.desc: "El poderoso (mortal) Imperio Mongol ha sido liderado durante varios años por una regente, Toregene Khatun. La ambiciosa mujer arrebató el poder a la viuda de Ogodei y se apresuró a reemplazar a sus ministros por sus protegidos. Entre ellos se encuentra una extraña persa chií llamada Fatima, aparentemente una refugiada de guerra deportada que de algún modo se convirtió en la favorita de la nueva Emperatriz. Este personaje improbable ha sido ascendido a un papel de alto rango dentro del Imperio Mongol, convirtiéndose básicamente en la segunda política más importante del imperio más poderoso del mundo.\nSin embargo, las mesas siempre cambian y Guyuk, el hijo de Toregene, alcanzó recientemente la mayoría de edad y obligó a su madre a dimitir. El reinado de Guyuk comenzó con una purga, eliminando a los ministros de su madre hasta que solo quedó Fatima. Hasta ahora, Toregene se ha negado a entregarla, llegando incluso a amenazar con suicidarse si Guyuk intenta algo insensato. Pero el destino está escrito y los días de Fatima están contados.\nPodría ser una buena oportunidad para ofrecerle otra escapatoria a esta talentosa mujer que podría ser una candidata interesante para ser Ghoul o incluso para un $pod_Embrace$..."
 Mamai: "Mamai"                        
 podgreatpersons.0190.t: "Mamai"
 podgreatpersons.0190.desc: "El Imperio Mongol continúa su desintegración tras sus éxitos iniciales. Uno de los remanentes más poderosos es la Horda de Oro, cuya política ha sido dominada por un solo hombre durante décadas: Mamai.\nAunque no pudo estabilizar la autoridad central durante un periodo de constantes guerras civiles, Mamai se mantuvo como un líder notable y persistente durante años, mientras otros venían y se iban en rápida sucesión. Este prominente comandante mostró habilidad en la política de la corte, actuando como el poder tras el trono en múltiples ocasiones, al tiempo que mantenía una diplomacia constructiva con los vecinos de la Horda.\nLo has estado vigilando durante un tiempo y parece que su buena fortuna finalmente se ha agotado. Tras perder una batalla contra un nuevo pretendiente, Mamai huye de unos asesinos que le pisan los talones. Esta podría ser una oportunidad única en la vida para conseguir a un estadista tan talentoso para tu propio uso."
 podgreatpersons.0191.t: "Teodora"
 podgreatpersons.0191.desc: "En el borde de las estepas, una página de la historia está cambiando. El último remanente del Imperio Romano de Oriente (a su vez, el último vestigio de los días romanos de antaño) sucumbe ante un asedio liderado por los invasores otomanos. El pequeño principado-estado de Teodoro, una extraña mezcla de godos crimeos y griegos, había permanecido sin ser molestado hasta ahora debido a su casi completa irrelevancia en el gran juego de la política, pero la atención de los otomanos finalmente se ha centrado en ellos y la ciudad ha caído.\nLa ciudad arde ahora, sus tesoros están siendo saqueados, sus líderes capturados para ser ejecutados en Estambul y las hijas del príncipe reunidas para el harén del Sultán.\nLos vampiros tienen vidas largas, y a veces incluso memorias más largas, y las noches de Roma siguen siendo una nostalgia a la que muchos se aferran. Tus agentes informan de que una de las hijas del Príncipe ha logrado escapar de la captura hasta ahora, eludiendo a los otomanos en las calles de la ciudad en llamas. Salvarla y darle la inmortalidad sería, como mínimo, un acto de desafío contra el terrible paso del tiempo."
 Sufi_Khalil_Beg_Mawsilu: "Sufi Khalil Beg Mawsilu"                           
 podgreatpersons.0192.t: "Sufi Khalil Beg Mawsilu"
 podgreatpersons.0192.desc: "Un oficial militar turcomano del clan Mawsillu que sirve a los Aq Qoyunlu, Sufi Khalil Beg Mawsilu fue la figura principal durante el reinado del sultán Ya'qub Beg, y desempeñó un papel fundamental en la contienda por la sucesión que tuvo lugar tras la muerte de este último. Colocó al primogénito de Ya'qub, Baysunghur (que entonces tenía nueve años), en el trono, gobernando como el sultán virtual del señorío.\nVeterano de varias campañas militares en las que demostró tanto crueldad como competencia, el sombrío mandato de Sufi ha tenido menos éxito. Su flagrante favoritismo por su tribu ha creado muchos enemigos que, en su mayoría, han sido contenidos por las rutinarias acusaciones de herejía de Sufi y sus demostraciones de fuerza contra ellos.\nTal forma de gobernar no podría durar para siempre y el futuro sultán ha sido derrotado recientemente por Sulayman Beg Bijan, un antiguo rival suyo, y su ejército en retirada se encuentra ahora en fuga. Es poco probable que Sulayman muestre piedad alguna con Sufi, un hecho que podrías aprovechar para hacer desaparecer al segundo de los ojos mortales antes de su muerte. Quizás podrías encontrar un uso para un comandante militar probado con aspiraciones a la intriga política."
 Khayr_al_Nisa_Begum: "Khayr al-Nisa Begum"                        
 podgreatpersons.0193.t: "Khayr al-Nisa Begum"
 podgreatpersons.0193.desc: "El Imperio persa se está recuperando de una crisis de sucesión y es el débil Mohammad Khodabanda quien es actualmente el Shah. Sin embargo, el verdadero poder reside en manos de su esposa principal.\nKhayr al-Nisa Begum fue antaño la hija de un jefe regional asesinado por su propio primo. Jurando vengarse algún día, logró llegar a la corte real y captar la atención del futuro Shah. Tras su ascenso al trono, mantuvo una amarga contienda con la hermana de este, que también ostentaba un poder e influencia considerables. Esto terminó cuando Khayr la hizo asesinar en un golpe de estado en el palacio junto con otros pretendientes.\nAhora que asume el control efectivo sobre Persia, no perdió el tiempo en ejecutar una sangrienta venganza contra la familia de su primo por su participación en la muerte de su padre. Aunque su control sobre Persia es seguro por ahora, la venganza pronto resultará ser su perdición. Miembros del clan al que se vengó han tomado la capital mediante un golpe propio y marchan hacia el palacio con la intención de decapitar a Khayr.\nTienes poco tiempo para actuar si quieres arrebatar a una mortal tan prometedora de manos de sus futuros asesinos."
 Lizdeika: "Lizdeika"                       
 podgreatpersons.0194.t: "Lizdeika"
 podgreatpersons.0194.desc: "El sumo sacerdote pagano del gran duque de Lituania, Gediminas, es un hombre extraño envuelto en el misterio. Se rumorea que fue encontrado en un nido de águila cuando era niño, y se ha ganado la reputación de ser un intérprete de sueños fiable en la corte del Gran Ducado.\nSu última profecía, surgida del sueño del duque sobre un enorme lobo de hierro aullando, le ha llevado a determinar el lugar de fundación ideal para lo que se convertiría en la ciudad más grande de Lituania, Vilnius.\nTanta magia potente rara vez se ve entre los mortales sin influencia sobrenatural. Podrías usar a tus agentes en el Gran Ducado para invitar a este sacerdote a tu corte, lo que podría abrir una vía para usar sus poderes en tu beneficio en el futuro."
 podgreatpersons.0195.t: "Birute"
 podgreatpersons.0195.desc: "Uno de los hombres más poderosos de Lituania, Kestutis, murió recientemente durante una guerra contra su sobrino. No tiene gran importancia para alguien como tú, pero la historia de la esposa de Kestutis, Birute, te intriga. Esta sacerdotisa pagana, famosa por su belleza, fue obligada a casarse con su marido cristiano y vivió tranquilamente a su sombra durante décadas. Aun así, sus creencias parecen no haber flaqueado nunca y un culto local surgió en torno a ella, considerándola una diosa o una mártir por la población pagana de la zona.\nCon Kestutis ya muerto y el señorío en pleno caos, te has enterado de que Birute simplemente desapareció de la ciudad hace no mucho tiempo, para reaparecer en el santuario que se vio obligada a abandonar cuando era una joven doncella. Un alma tan dedicada despierta tu interés, mientras algunos de los miembros de tu corte se preguntan si realmente podrías convertirla en la diosa inmortal que su pequeño culto cree que es..."
 Torkel_Knutsson: "Torkel Knutsson"                        
 podgreatpersons.0196.t: "Torkel Knutsson"
 podgreatpersons.0196.desc: "Uno de los hombres más poderosos de Suecia se encuentra actualmente encarcelado en Estocolmo, esperando su ejecución. Torkel Knutsson era un amigo de confianza del anterior rey, Magnus Ladulas, y fue confiado como regente para el joven sucesor. Torkel cumplió esta tarea con diligencia, recortando el poder de la Iglesia, estableciendo nuevas rutas comerciales y liderando la defensa contra la república de Nóvgorod, lo que terminó con Suecia ganando nuevos territorios gracias a sus victorias.\nTorkel tuvo menos éxito al lidiar con una crisis de sucesión entre el rey y sus dos hermanos. Defendió a su rey con honor y logró presionar para lograr la paz entre los hermanos más adelante. Lamentablemente para él, esto resultaría ser un error, ya que los amargados duques envenenarían la mente del rey contra Torkel con falsas acusaciones, lo que finalmente resultó en su situación actual.\nUn estadista tan fiel y hábil es difícil de encontrar. ¿Quizás podrías echarle una mano antes de que ocurra su ejecución?"
 podgreatpersons.0197.t: "¿Margaret?"
 podgreatpersons.0197.desc: "La corte de Noruega lleva décadas comentando el relato de Margaret, una princesa noruega que acabó siendo la última heredera del trono escocés. Su repentina muerte en el camino hacia su nuevo señorío sumió a Escocia en una mortal guerra civil sin fin a la vista. Aunque Noruega se ha visto librada de este problema, el relato de la «doncella de Noruega» ha vuelto recientemente al primer plano tras la llegada repentina de una mujer a Bergen, que afirmaba ser la perdida Margaret y acusaba a varios nobles de alto rango de traición.\nAunque su historia sobre cómo evitó la muerte y fue enviada a Alemania tiene inconsistencias, la gente de Bergen y el clero apoyan su reclamo. Sin embargo, este no es el caso del Rey quien, quizás para evitar enredarse más en los problemas escoceses, ha decidido simplemente enviar a la mujer a la hoguera por traición en un par de días.\nAlgunos de tus agentes están considerando la idea de ayudarla a escapar de la prisión y unirse a tu corte, lo que probablemente confundiría aún más a los mortales y tal vez permitiría ganar un activo valioso en el proceso."
 Yasaur: "Yasa'ur"                    
 podgreatpersons.0198.t: "Yasa'ur"
 podgreatpersons.0198.desc: "Dos de los principales reinos sucesores del imperio mongol están en guerra. Los Chagatai han sido derrotados recientemente por su enemigo el Ilkanato, debido principalmente a la traición de un tal Yasa'ur, un príncipe chagatai relativamente menor. Algunos acusan a Yasa'ur de conspirar abiertamente con su enemigo desde el principio, mientras que otros dicen que fue objeto de un complot de asesinato y solo se defendió.\nLas competentes campañas militares de Yasa'ur (en ambos bandos) le aseguraron un pequeño feudo, pero su lealtad siempre fue cuestionada. Un nuevo Ilkan ha ascendido al trono y ha acusado a Yasa'ur de ser «poco cooperativo». Rodeado por enemigos por todos lados, el príncipe exiliado logró escapar, pero ahora son sus antiguos amigos de la Horda de los Chagatai quienes se le echan encima.\nEl hombre ciertamente ha mostrado algo de carácter y una capacidad de engaño que podría ser valiosa para tus necesidades. Como ahora se dirige hacia tu área de influencia, ponderas tu próximo movimiento."
 Kurbat_Ivanov: "Kurbat Ivanov"                      
 podgreatpersons.0199.t: "Kurbat Ivanov"
 podgreatpersons.0199.desc: "A medida que Rusia expande sus fronteras en el mundo mortal, aventureros audaces se dirigen cada vez más hacia el este para cartografiar (y a veces reclamar) nuevas tierras en las gélidas profundidades de Siberia. Un hombre así es Kurbat Ivanov, un cosaco que acaba de realizar el primer mapa de la zona conocida ahora como «Lejano Oriente ruso».\nSus exploraciones le llevan a nuevas regiones como el lago Baikal, Chukotka e incluso un incipiente conocimiento de Alaska. Sus descubrimientos fueron ganados con esfuerzo, ya que la mayoría de sus expediciones de 74 hombres no regresaron para contar la historia, ya fuera por el clima inclemente o por emboscadas de tribus locales.\nIvanov, sin embargo, lo logró y ahora traza planes para otros viajes peligrosos en el futuro. Esta pausa en su carrera podría ser la oportunidad para que lo traigas a tu corte. Tales aventureros audaces son raros y quizás podrías encontrar un uso para él en tus propias aventuras (nocturnas)."
 Yuri_Smolensk: "Yuri de Smolensk"                         
 podgreatpersons.0200.t: "Yuri de Smolensk"
 podgreatpersons.0200.desc: "Un príncipe ruso exiliado ha llamado repentinamente tu atención al refugiarse en la corte de la Horda de Oro. Este hombre era aparentemente el príncipe de la gran ciudad de Smolensk, y afirmaba haber librado múltiples guerras para defender su ciudad de las invasiones lituanas. Cuenta la historia de la traición de sus hermanos moscovitas, que se negaron a ayudarle y sabotearon sus esfuerzos bélicos, antes de concluir que temía por su vida en Moscú, razón por la cual entró en este exilio voluntario.\nLos rumores en la corte no son tan halagadores sobre él. Aunque es, en efecto, el príncipe de Smolensk, se le describe como un individuo despiadado y libertino que ha malgastado la ayuda de Moscú y la buena voluntad de sus propios soldados con su actitud.\nEs difícil encontrar la verdad sobre este asunto pero, como mínimo, el hombre parece competente tanto en asuntos militares como políticos. Esto lo convierte en un candidato inusual pero quizás interesante para presentarlo en tu corte."
 Andre_Longjumeau: "Andre de Longjumeau"                      
 podgreatpersons.0201.t: "Andre de Longjumeau"
 podgreatpersons.0201.desc: "A medida que las hordas mongolas arrasan el este, ejerciendo una gran presión sobre los señoríos musulmanes en su camino, los cristianos de occidente han empezado a fijarse en ellos. En 1245, el Papa Inocente IV envió su primera misión diplomática a los mongoles, liderada por el francés Andre de Longjumeau. Este talentoso diplomático cumplió bien su misión y ha sido desde entonces el intermediario de confianza entre el Papado, Francia y los mongoles.\nParece propenso a exagerar un poco los intereses comunes de los occidentales y los pueblos de la estepa, pero su hábil lengua ha logrado iniciar el proceso de una alianza tentativa entre Francia y los mongoles. Es bastante dudoso que algo resulte realmente de esto, ya que ambos señoríos están muy alejados, pero, en cualquier caso, Andre ha logrado pintar un cuadro vívido de la historia y la cultura mongola en occidente (con bastantes adornos respecto a San JuanES_XA).\nUn diplomático tan talentoso no aparece todas las noches y, como Andre está visitando de nuevo las estepas, algunos miembros de vuestra corte están considerando dar un paso para traerlo ante vuestra presencia, donde podría ser de utilidad en el futuro."
 Euphrosyne_Palaiologina: "Efrosina Palaiologina"                     
 podgreatpersons.0202.t: "Efrosina Palaiologina"
 podgreatpersons.0202.desc: "La aparentemente imparable Horda de Oro mongola ha invadido recientemente Tracia, poniendo en peligro al atribulado Imperio bizantino. El emperador Miguel VIII Palaiologos, ansioso por forjar una alianza, entregó a su hija Efrosina a Nogai Kan, de la Horda de Oro, como esposa. A pesar del fuerte choque cultural que la joven tuvo que soportar, se adaptó notablemente bien a su nueva vida.\nAl participar en la política de la corte, se ha convertido en una consejera de confianza de su marido Nogai, manteniendo siempre presentes los intereses de Constantinopla. La apuesta de Miguel parece haber dado sus frutos, ya que la relación entre ambos estados se ha templado gracias a la prudente mediación de su hija.\nEl talento de Efrosina ha atraído atención no deseada, tanto de vampiros locales como de otros más extranjeros que intentan desbaratar esta recién descubierta amistad para sus propios fines. Podríais intervenir, tal vez protegiendo a la princesa bizantina de sus posibles asaltantes, o bien optando por usarla para vuestros propios fines."
 Buscarello_de_Ghizolfi: "Buscarello de Ghizolfi"                      
 podgreatpersons.0203.t: "Buscarello de Ghizolfi"
 podgreatpersons.0203.desc: "Un italiano que se estableció en Persia cuando formaba parte del Ilkanato mongol, Buscarello comenzó su carrera como oficial de la guardia del gobernante mongol Arghun.\nEn 1289, Arghun envió una misión a Europa con Buscarello como embajador, iniciando así su carrera oficial como intermediario entre Europa y los mongoles desde 1289 hasta 1305, sirviendo a los gobernantes mongoles Arghun, Ghazan y luego a Oljeitu.\nAunque las alianzas que intentó fomentar entre Oriente y Occidente nunca se materializaron, Buscarello llegó a ser un agente de máxima confianza para grandes gobernantes, desde Inglaterra hasta Mongolia.\nDe vuelta en las estepas, Buscarello ha sido el objetivo de agentes de la [Glossary('Ashirra','game_concept_ashirra_desc')] que buscan venganza por su participación en el percibido ataque conjunto de los francos y los mongoles contra los mamelucos. Tenéis la oportunidad de «salvarlo», quizás utilizando sus considerables habilidades para vuestras propias perspectivas diplomáticas en el futuro."
 Maria_Perez: "María Pérez"               
 podgreatpersons.0204.t: "María Pérez"
 podgreatpersons.0204.desc: "Lleváis tiempo oyendo hablar de una extraña artista itinerante llamada María Pérez. Esta noble (aparentemente en exilio voluntario) se le han atribuido muchas hazañas, desde escribir poesía pomposa hasta participar en una cruzada o ser espía de varios reyes. A veces aparece en alguna corte, cantando y entreteniendo a los nobles, avergonzando a algunos con sus aparentemente considerables habilidades con el arco, para luego desaparecer ante la consternación de sus muchos pretendientes.\nLo extraño es que esto lleva décadas ocurriendo, mucho más tiempo del que cualquier mujer mortal debería ser capaz de mantener tal actuación. Vuestros agentes no han sido capaces de encontrar respuesta a ese misterio, así que aún no sabéis si «María Pérez» es realmente una sola persona o si varias mujeres aventureras usan este nombre para ganar algo de fama.\nEn cualquier caso, habéis podido averiguar que ella (o al menos una de ellas) está pasando por vuestra zona. Vuestra corte os insta a considerar integrarla en sus filas, probablemente ansiosa por conocer a la leyenda en persona."
 Hammu_ibn_Abd_al_Haqq: "Hammu ibn Abd al-Haqq"                   
 podgreatpersons.0205.t: "Hammu ibn Abd al-Haqq"
 podgreatpersons.0205.desc: "Un príncipe marroquí, Hammu ibn Abd al-Haqq, se rebeló sin éxito contra el sultán meriní. Como muchos príncipes disidentes, fue exiliado a Granada para unirse a los «Voluntarios de la Fe», un cuerpo militar compuesto por norteafricanos que luchaban para defender a los musulmanes en la península ibérica.\nAllí comandó las tropas que capturaron Bedmar de Castilla en abril de 1302, dos semanas después de la ascensión del sultán. Sin embargo, este éxito no duró mucho, ya que Granada pronto se vio envuelta en varias crisis en las que Hammu eligió el bando equivocado. Derrotado por su compañero príncipe exiliado Uthman, Hammu se vio obligado pronto a marcharse de nuevo sin nada más que la ropa que llevaba puesta.\nEste es un hombre que ha demostrado experiencia militar y ha navegado la política cortesana. Como ahora se encuentra básicamente solo y indefenso, esto lo convierte en un objetivo tentador para el secuestro y, tal vez, para darle una segunda oportunidad bajo vuestra guía."
 Tegueste: "Tegueste"          
 podgreatpersons.0206.t: "Tegueste"
 podgreatpersons.0206.desc: "Los mortales españoles han descubierto recientemente un nuevo conjunto de islas que llaman «Canarias». Como suelen hacer los mortales, han intentado conquistarlas desde entonces.\nLas divididas tribus indígenas de las islas se han agrupado en torno a un hombre llamado Tegueste.\nLos españoles esperaban una victoria fácil, pero fueron repelidos decisivamente en varias ocasiones. Solo la propagación de una epidemia que debilitó gravemente a los guanches permitió a los españoles montar otro ataque... que también resultó infructuoso.\nEntonces recurrieron a una táctica de «divide y vencerás», logrando aislar a la tribu de Tegueste al ocuparse primero de los otros reyes menores. Superado en número, Tegueste se vio obligado a rendirse y desde entonces ha sido convertido en esclavo para ser exhibido por los victoriosos cristianos.\nEste hombre ha demostrado una gran fortaleza de carácter y considerables habilidades en la guerra. Podríais organizar su «desaparición» para que sea llevado a vuestra corte. Ciertamente podría ser más útil aquí que como trofeo para los españoles."
 podgreatpersons.0207.t: "Doramas"
 podgreatpersons.0207.desc: "Los mortales españoles han descubierto recientemente un nuevo conjunto de islas que llaman «Canarias». Como suelen hacer los mortales, han intentado conquistarlas desde entonces.\nLos lugareños se han agrupado en torno a un joven guerrero llamado Doramas. Conocido por su destreza en el combate y su capacidad de liderazgo, porta una gran espada de madera y se le describe con un escudo hecho de madera de dragón.\nAlcanzó un gran éxito como jefe del ejército canario, lo que lo convirtió en un líder carismático en la resistencia aborigen. Debido a la gran fama que Doramas ganó en la guerra, el capitán castellano inició una campaña decisiva contra él personalmente, atacándolo en su propio territorio. El 20 de agosto de 1481, mientras participaba en una feroz batalla en la región de Arucas, Doramas fue víctima de una herida de lanza y murió.\nSin embargo, puede que haya más en esta historia, ya que un joven que afirma ser este famoso héroe guanche ha aparecido repentinamente en vuestra corte. Dice que los españoles utilizaron otro cadáver para escenificar su muerte y quebrar el espíritu de los guanches. El resto de su historia puede esperar, pero ahora tenéis una decisión que tomar, ya que parece que busca un patrón inmortal, tal vez para vengarse verdaderamente de su pueblo.\n¿Seréis vos este patrón?"
 Yalbugha_al_Umari: "Yalbugha al-Umari"          
 podgreatpersons.0208.t: "Yalbugha al-Umari"
 podgreatpersons.0208.desc: "El Sultanato Mameluco que gobierna Egipto es notoriamente inestable, con la casta de soldados esclavos (los mencionados mamelucos) chocando a menudo por el poder con los sultanes. Un ejemplo de ello es Yalbugha al-Umari. Originalmente un mameluco del sultán an-Nasir Hasan, ascendió en la escala de mando a medida que los emir seniores Shaykhu y Sirghitmish eran eliminados, convirtiéndose en amir majlis (señor de la audiencia) y alcanzando el rango militar más alto de amir mi'a muqaddam alf. Los vínculos entre Yalbugha y an-Nasir Hasan se deterioraron y el primero hizo matar al segundo, su señor, en una violenta lucha por el poder en 1361.\nTras la eliminación de an-Nasir Hasan, Yalbugha se convirtió en la figura más poderosa del sultanato de al-Mansur Muhammad, a quien Yalbugha ayudó a nombrar y bajo cuyo mando sirvió. Su poder fue moderado por los otros emir seniores.\nDurante estos años, Yalbugha construyó su propia y enorme casa mameluca, compuesta por unos 3.000 mamelucos en 1366. Ese mismo año, Yalbugha hizo arrestar a Taybugha y consolidó su dominio.\nSin embargo, el tiempo de Yalbugha está llegando a su fin, ya que ha estallado una rebelión mameluca que probablemente causará la irónica caída del que fuera el titiritero mameluco. Esto os da la oportunidad de atacar mientras está debilitado si así lo deseáis."
 Bayram_Pasha: "Bayram Pasha"           
 podgreatpersons.0209.t: "Bayram Pasha"
 podgreatpersons.0209.desc: "El Imperio otomano ha gobernado vastas extensiones de tierra durante un tiempo y su peculiar administración ha dado lugar a la aparición de muchos burócratas cualificados. Bayram Pasha es uno de esos hombres.\nOriginalmente miembro del famoso cuerpo de los Jenízaros, Bayram ascendió por todos los rangos, #italic turnacıbasi#! (jefe de equipos de reclutamiento), #italic kethuda#! (camarero), #italic beylerbey de Egipto#! (gobernador general) y finalmente #italic gran visir#!, el cargo más alto del imperio después del del sultán.\nBayram Pasha es reputado tanto en Egipto como en Anatolia por sus esfuerzos en la construcción de obras públicas. Reparó las murallas de Constantinopla y encargó una mezquita y un kulliye (complejo religioso) en la ciudad. También encargó una instalación de riego y un caravansarai en Amasya. Bayram Pasha también es conocido como el patrón de varias posadas en las ciudades de Anatolia.\nSin embargo, la vida de Bayram está llegando a su fin, ya que su salud le falla rápidamente. Ahora, lejos de los salones del poder, esa podría ser la oportunidad para que reclutes a un talentoso administrador para tu propio imperio nocturno."
 Al_Hajj_Salim_Suwari: "Al-Hajj Salim Suwari"
 nick_suwarian_father: "Padre de Suwarian"
 podgreatpersons.0210.t: "Al-Hajj Salim Suwari"
 podgreatpersons.0210.desc: "Proveniente de la ciudad saheliana de Ja, en el núcleo de Mali, Al-Hajj Salim Suwari ha realizado la peregrinación (hajj) a La Meca varias veces y ha dedicado su carrera intelectual a desarrollar una comprensión de la fe que ayudara a las minorías musulmanas a residir en tierras «paganas».\nFormuló un importante razonamiento teológico para la coexistencia pacífica con las clases gobernantes no musulmanas, llamado la Tradición Suwarian.\nA medida que crece la tensión entre los Laibon nativos y los vampiros de la [Glossary('Ashirra','game_concept_ashirra_desc')] que viajan con los comerciantes musulmanes, contar con un hombre que haya dedicado su considerable intelecto a tender puentes entre ambas comunidades podría ser de ayuda."
 nick_the_resurrected: "el Resucitado"       
 podgreatpersons.0211.t: "Kristos Samra"
 podgreatpersons.0211.desc: "Una extraña historia ha llamado tu atención últimamente.\nKristos Samra nació en una familia rica y piadosa de una provincia fronteriza del imperio cristiano de Etiopía. Cuando tenía unos cuarenta años, un día se enfureció con una sirvienta maleducada y le clavó una brasa ardiente en la garganta, y la sirvienta murió. Entonces Kristos Samra se sintió terrible y culpable, y rezó para que Dios restaurara la vida de la sirvienta. Afortunadamente, su oración fue escuchada y la criada volvió a estar viva. Así, Kristos Samra quedó asombrada y pensó: «si Dios escucha mi oración mientras estoy en esta vida terrenal, ¿cuánto responderá a mis oraciones en un monasterio?». Decidió ser monja y desde entonces ha comenzado su Viaje hacia una vida espiritual.\nAunque su fe la sitúa fuera de tu alcance, te intriga la perspectiva de que una (aparentemente) simple mortal realice una resurrección. Como monja, Kristos Samra ya no necesita a su sirvienta salvada milagrosamente, lo que te facilitaría estudiar tú mismo a esta misteriosa mujer resucitada."
 Ugolino_Vivaldi: "Ugolino Vivaldi"            
 nick_the_first_explorer: "el Primer Explorador"            
 podgreatpersons.0212.t: "Ugolino Vivaldi"
 podgreatpersons.0212.desc: "Una extraña embarcación llegó a la orilla no muy lejos de tu dominio recientemente. Aparentemente golpeados por una tormenta, la mayoría de la desafortunada tripulación no sobrevivió a su brutal llegada a tu tierra. Uno, sin embargo, escapó de esta odisea herido pero vivo.\nLlevó tiempo comprender su lengua, pero parece que se llama Ugolino Vivaldi y procede de una ciudad llamada Génova. Él y su hermano (que no sobrevivió) estaban organizando una expedición a la India.\nVarado, solo en una tierra extraña y sin conocimiento de la zona, este hombre está básicamente a tu merced. Ciertamente tiene un espíritu aventurero y buena cabeza para los números (al parecer también es comerciante además de capitán), lo que podría resultar útil para tu causa."
 Kassi: "Kassi"
 nick_qasa: "Qasa"
 podgreatpersons.0213.desc: "Esposa principal del emperador malí Suleimán, Kassi gobernó conjuntamente con su marido. Era extremadamente popular en la corte real, que contaba con muchos de sus parientes entre sus miembros. Pero pronto perdió el favor de su marido, que prefería a una plebeya llamada Bendjou. Finalmente, se divorció de ella para casarse con esta última. Las nobles damas de la corte se pusieron del lado de Kassi, continuando con el reconocimiento de su legitimidad y negándose a honrar a la nueva esposa real. Tal insubordinación —arrojaban tierra sobre sus cabezas para honrar a Kassi mientras arrojaban tierra sobre sus manos para insultar a Bendjou— pronto enfureció a Suleimán y a su nueva esposa, hasta el punto de que Kassi se vio obligada a buscar refugio en la mezquita.\nLa guerra civil estalló poco después, ya que ella alentó a la nobleza, incluidos sus parientes, a rebelarse. La guerra fue una Contienda entre dos facciones ideológicas; un grupo apoyaba a Suleimán, mientras que el otro apoyaba no solo a Kassi, sino también a los hijos del antiguo gobernante, Maghan. Suleimán y sus jefes finalmente derrotaron a Kassi y a sus primos, desacreditándola al demostrar que ella y su primo, Djathal, que había sido desterrado por traición, estaban compinchados.\nEsta reciente derrota te ha ofrecido una oportunidad. Podrías «rescatar» a Kassi antes de que los hombres de Suleimán la acorralen. Ciertamente ha demostrado tener una mente aguda para la política a pesar de su derrota."
 nick_the_cuman: "el Cumano"         
 podgreatpersons.0214.t: "Isabel la Cumana"
 podgreatpersons.0214.desc: "Cuando su padre, el Kan Koten de los cumanos, negoció la paz con los húngaros tras una larga guerra, Isabel se casó con el entonces Príncipe Esteban. En su boda, Isabel se convirtió al catolicismo romano, aunque muchos en la corte dudaban de su verdadera devoción a su nueva religión. Su mandato como reina fue discreto, pero pronto se vio impulsada a la primera línea cuando su marido murió y se convirtió en regente por su hijo Ladislao.\nEl joven pronto mostró un profundo aprecio por la herencia cumana de su madre y fomentó movimientos políticos para favorecerlos, lo que la corte atribuyó a la influencia «pagana» de Isabel. Como tal, la regencia de Isabel y el reinado de Ladislao estuvieron llenos de guerras civiles y golpes de estado. Lo último en esta sucesión ha visto perecer a Ladislao, dejando pocas dudas sobre el destino final de Isabel ahora que la hostil corte ha recuperado el control. Podría ser el momento de que intervengas si ves a la experimentada reina como una candidata potencial para ser [ghoul|E] o $pod_Embrace$."
 syrgiannes_palaiologos: "Syrgiannes Palaiologos"  
 nick_the_shifting: "el Cambiante"            
 podgreatpersons.0215.desc: "Recientemente has sabido que la carrera de uno de los hombres más infames del Imperio bizantino está a punto de llegar a su fin. La vida de Syrgiannes Palaiologos es casi una lección de traición y ambición desenfrenada. Traicionó a dos emperadores, a múltiples amigos de la infancia, rompió varios tratados y sedujo a la emperatriz bizantina en sus constantes intentos por obtener poder y oro. Arrestado varias veces, siempre lograba de algún modo ganarse el favor de sus captores... antes de traicionarlos una vez más cuando llegaba el momento oportuno.\nSyrgiannes Palaiologos es también un comandante militar adecuado (su cargo oficial a pesar de su constante política) y tiene experiencia gobernando regiones, habilidades que lo harían valioso para un señor $pod_cainite$ lo bastante audaz como para no temer su naturaleza engañosa.\nActualmente trabaja para los serbios, liderando una invasión de Bizancio para ellos, pero su suerte finalmente se ha agotado, ya que has sabido que las conversaciones de paz ofrecidas por el emperador son solo una fachada para tener la oportunidad de matar a Syrgiannes de una vez por todas. Un buen momento para actuar si ese es tu deseo."
 podgreatpersons.0216.t: "Sasaki Kojiro"
 podgreatpersons.0216.desc: "A través de los excitados murmullos de los mortales bajo tu dominio, te has enterado de un próximo duelo entre dos guerreros legendarios y amargos rivales: Sasaki Kojirō y Miyamoto Musashi. Kojirō parece ser el favorito entre la gente gracias a su innegable elegancia y carisma. Alumno del legendario Toda Seigen, sirve a un respetado daimyo como hatamoto e instructor de esgrima. Kojirō es famoso por su maestría en el veloz y regio estilo Ganryū, que le valió el apodo de «Demonio de las Provincias Occidentales». Sasaki es un maestro espadachín, pero tienes la sensación de que su honorable forma de luchar puede que no le dé la victoria sobre su rival más pragmático. Un oficial del Clan Hosokawa que presencie la legitimidad del duelo podría ser convencido para retirar rápidamente a un herido Kojirō de la escena, directamente a tus manos."
 podgreatpersons.0217.t: "Hwang Jini"
 podgreatpersons.0217.desc: "Nacida fuera del matrimonio, Hwang Jini era considerada intocable, a pesar de su extraordinaria belleza e ingenio. Para escapar de ese destino, eligió el Camino de la [Glossary('kisaeng','podgloss.kisaeng')|l], convirtiéndose en cortesana, poeta y maestra del gayageum, conocida bajo el nombre de Myeongwol.\nSu legendaria belleza y astuta mente la hicieron muy conocida y deseada por muchos, aunque su posición no permitía que nadie se casara con ella. De todo Joseon, los hombres acudían a ella intentando resolver el Jeomiligu Idubulchool, un acertijo que cualquiera que quisiera ser su amante debía resolver primero. También escribió algunos de los mejores sijo; el más famoso, «Arroyo azul», trata sobre su anhelo por un amante y las luchas que sentía al actuar como kisaeng.\nAhora se está retirando de sus obligaciones, centrándose en escribir poesía e aislándose de su círculo social, y tal vez podrías intentar resolver el Jeomiligu Idubulchool una última vez."
 podgreatpersons.0218.t: "Yang Miaozhen"
 podgreatpersons.0218.desc: "En su juventud, Yang Miaozhen fue la esposa y la igual en el campo de batalla de Li Quan, el líder bandido del legendario Ejército de las Capas Rojas de Shandong. Tras la muerte de Li Quan, la propia Yang Miaozhen tomó el mando de los Capas Rojas, liderándolos hacia más victorias que obligaron a los mongoles a nombrarla gobernadora imperial de Shandong. Han pasado décadas desde entonces. Yang Miaozhen disfruta ahora de un tranquilo retiro rural con su hijo adoptivo como sucesor. Nadie cuestionaría su desaparición, si se pudiera encontrar un cadáver convincente..."
 podgreatpersons.0219.t: "Kusunoki Masasue"
 podgreatpersons.0219.desc: "Desde el momento en que tomó las armas, Kusunoki Masasue se convirtió en una figura de lealtad inquebrantable y brillantez táctica. Fiel defensor del emperador Go-Daigo, lideró audaces campañas de guerrilla contra las fuerzas Ashikaga junto a su hermano mayor Masashige, utilizando la estrategia y el engaño para lograr victorias casi imposibles. Aunque su hermano es más renombrado, el propio Masasue no es menos impresionante por derecho propio y probablemente sería un servidor leal si así lo desearas. Aunque los hermanos han recibido la orden de enfrentarse a un enemigo superior por parte del emperador Go-Daigo, aún tienes una pequeña ventana de tiempo para intervenir y poner al leal Pequeño Dragón a tu servicio."
 podgreatpersons.0220.t: "Mochizuki Chiyome"
 podgreatpersons.0220.desc: "Noble, poeta y descendiente directa del legendario fundador del Clan Ninja Koga, Izumo-no-kami, Mochizuki Chiyome fue la elección natural para convertirse en los ojos y oídos del tío de su difunto esposo, Takeda Shingen. Bajo su patrocinio, acogió a niñas huérfanas de ciudades asoladas por la guerra y urbes bulliciosas, forjándolas como agentes maestras en espionaje, sabotaje y asesinato. Se rumorea que tiene no menos de 300 mujeres por todo Japón cumpliendo sus órdenes. Sin embargo, tras la reciente y sospechosa muerte de Takeda Shingen, la kunoichi parece haber desaparecido por completo. No obstante, tus propios contactos podrían ponerse a trabajar para localizarla, ya que sus talentos pueden ser demasiado grandes para desperdiciarlos." 
 podgreatpersons.0221.t: "Tempest Peacock"
 podgreatpersons.0221.desc: "Últimamente has estado escuchando rumores sobre un misterioso y pícaro extranjero que ha desembarcado recientemente en las costas cercanas. Un hombre de codicia insaciable que teje mentiras con la misma destreza con la que un marinero hace nudos, alardeando de sus recientes logros en Japón. Su capitán, William Adams, es alguien de quien has oído hablar y este marinero parece ser uno de sus tripulantes. Bueno, lo fue, al menos. Tempest ha abandonado el barco con la esperanza de ganarse el favor de los oficiales japoneses, aprovechando su estatus de comerciante extranjero. Tras llegar junto a Adams con el White Lion, pronto se vio envuelto en tratos dudosos, pero su partida ocurrió poco después gracias a los esfuerzos de la Compañía Británica de las Indias Orientales. Aunque este Tempest puede no ser un marinero tan hábil como su capitán, potencialmente podrías encontrar algún uso para un comerciante de lengua ágil en tu corte."
 podgreatpersons.0222.t: "Hong Pok-wǒn"
 podgreatpersons.0222.desc: "Un señor de la guerra que desertó a los mongoles durante una de las invasiones de Goryeo, Hong Pok-wǒn se rebeló después contra la corte de Goryeo. Logró matar al general asignado para defender los intereses de la élite, pero su rebelión fue finalmente derrotada y apenas logró escapar, suplicando a los mongoles que se quedaran con ellos. Fue nombrado [Glossary('kwanryong kuibu koryo kunmin changgwan','podgloss.kwanryong_kuibu_koryo_changwan')|l] por ellos y se le ordenó planificar otra invasión de Goryeo.\nLa campaña fue un éxito, lo que llevó a la firma de un tratado de sumisión eterna de Goryeo a los mongoles. Sin embargo, los aspectos políticos están llevando a Hong Pok-wǒn a su fin, ya que se encuentra en el punto de mira de una conjura de la corte, liderada por su esposa y un Príncipe de Goryeo, Wang Chun.\nTus agentes te han advertido que ahora espera su ejecución en una celda, y hay una oportunidad para que actúes y reclames a ese tumultuoso señor de la guerra para ti."
 podgreatpersons.0223.t: "Han Lin'er"
 podgreatpersons.0223.desc: "La guerra civil de los Yuan está llegando a su fin. Un líder bandido de una pequeña aldea del sur, Zhu Yuanzhang, ha conquistado la mitad de China y está preparado para duplicar ese territorio. Pero uno no puede evitar notar a cierto emperador al que sirve, un hombre joven que afirma ser tanto el emperador Song como el Buda Maitreya. Algunos dicen que es simplemente un títere de sus generales, pero otros no pueden reconocer a un hombre santo..."
 podgreatpersons.0224.t: "Yu Zijun"
 podgreatpersons.0224.desc: "El gobernador chino del bucle de Ordos, Yu Zijun, ha servido con capacidad y honestidad. De hecho, su propuesta estrella, construir una serie de murallas de tierra a lo largo de la frontera norte, fue clave para emboscar y derrotar a una gran invasión mongola. Sin embargo, últimamente se ha convertido en víctima de la intriga de la corte y ha sido despojado de sus rangos. Podría valer la pena reclutar a un hombre de su competencia."
 podgreatpersons.0225.t: "Wang Qinghui"
 podgreatpersons.0225.desc: "A pesar de toda su riqueza y patrocinio, los emperadores de la dinastía Song necesitaban a muchas #EMP daibi#!, o escritoras fantasma, para realizar la escritura y caligrafía que sus gobernantes no podían. Una #EMP daibi#! fue incluso lo suficientemente talentosa como para convertirse en la consorte oficial del emperador Duzong, a pesar de su falta de belleza y linaje. Se ganó el nombre de Zhaoyi, o «Porte Luminoso».\n\nHan pasado años desde que cayó la corte Song, pero quienes trabajaron para ella aún reconocen a cierta poeta talentosa de la corte Yuan. Ahora lleva un nombre diferente y ha escrito muy poco. Sin embargo, circulan rumores sobre una hermosa canción que talló en la pared de una taberna mientras era llevada al norte. Quizá todavía le queden algunos versos para un oído más exigente."
 podgreatpersons.0226.t: "Chǒng Tojǒn"
 podgreatpersons.0226.desc: "Taejo de Joseon es el rostro y la fuerza de la reforma de Corea, que sustituye a la decadente dinastía Goryeo. Pero el cerebro detrás de esta reforma, el filósofo que eligió el confucianismo sobre el budismo, el administrador que codificó la mayoría de las ambiciosas reformas en el [Glossary('Joseon Gyeonggukjeon','podgloss.joseon_gyeonggukjeon')], es Chǒng Tojǒn.\nAl intentar asegurar la posición del octavo hijo de Taejo para el trono, Chǒng Tojǒn participó en una conjura palaciega para matar al quinto hijo de Taejo, dando inicio a la Primera Lucha de Príncipes. Horrorizado por lo que sus hijos estaban dispuestos a hacerse entre sí, Taejo abdicó en favor de su segundo hijo tras solo seis años de reinado.\nChǒng Tojǒn pagará pronto el precio de su apoyo, y corre el rumor de que ya ha empezado a escribir un poema de muerte. Si quieres salvar esta mente brillante, ahora es el momento de actuar."
 podgreatpersons.0227.t: "Ju Nongae"
 podgreatpersons.0227.desc: "Has estado vigilando a Ju Nongae, una [Glossary('kisaeng','podgloss.kisaeng')|l], desde que tus vasallos te hablaron de su belleza y de cómo logró asegurar su posición como la amante de Choi Geyong-hwi, un magistrado local encargado de procesar a su madre. Cuando los japoneses iniciaron la guerra Imjin, Nongae se mantuvo al lado de su amante y señor cuando este intentó organizar las defensas de la provincia, antes de ser finalmente derrotada y asesinada.\nLos ocupantes japoneses obligaron a todas las #EMP kisaeng#! a servirles en el pabellón Choseokru. Decidiendo vengar la muerte de Choi Gewong-hwi, Ju Nongae usó su belleza para atraer a Keyamura Rokusuke, el general japonés, para que se uniera a ella en un acantilado sobre el río Nam, donde ella lo abrazó, le rodeó el cuello con las manos y los lanzó a ambos al abismo hacia una muerte inevitable.\nTu vasallo la encontró en la orilla del río, apenas respirando, con su belleza desvaneciéndose mientras exhala sus últimos alientos. Si tenías planes para ella, debes actuar ahora y decidir si quieres $pod_Embrace$ o no."
 podgreatpersons.0228.t: "Dae Jang-geum"
 podgreatpersons.0228.desc: "Proveniente de orígenes humildes y convertida en una [Glossary('ǔinyǒ','podgloss.uinyo')|l], Jang-geum trabajó duro para ganarse la confianza del rey Jungjong. Aunque no logró salvar a la reina Janggyeong mientras daba a luz al heredero al trono, Jungjong le pidió que se convirtiera en su médica personal.\nSu enfoque para curar dolencias mediante la comida resultó ser innovador y eficiente, y curó numerosas enfermedades que aquejaban al rey. Él finalmente murió pacíficamente de vejez, liberando a Dae Jang-geum de su servicio.\nSe retiró, asumiendo la tarea de entrenar a otras #italic ǔinyǒ#!, pero su salud parece estar finalmente flaqueando.\nAhora es el momento de ir a verla si tienes curiosidad por descubrir qué podría hacer la Dae con el don del $pod_Embrace$."
 podgreatpersons.0230.t: "Shinran"
 podgreatpersons.0230.desc: "Los monjes budistas son una vista común, pero la presencia de un sabio controvertido ha captado tu atención. Un viejo monje llamado Shinran, fundador de la escuela budista de la Tierra Pura Verdadera, aparentemente ha estado desafiando las creencias monásticas tradicionales durante mucho tiempo. Fue exiliado debido al asombroso crecimiento y popularidad de sus enseñanzas, y durante este exilio Shinran se casó, desafiando abiertamente la tradición monástica del celibato. Sus enseñanzas parecen enfatizar la confianza en el Voto de Amida para la salvación y la fe en la Gracia de Buda por encima de cualquier otra cosa. Un hombre culto y exiliado puede ser útil en tu corte, si así lo deseas."
 podgreatpersons.0231.t: "Kim T'ong-jǒng"
 podgreatpersons.0231.desc: "Cuando el rey Wonjong se rindió a las exigencias de Kubilai Khan y desmanteló el gobierno militar de Goryeo, los [Glossary('sambyeolcho','podgloss.sambyeolcho')] se negaron a la orden e iniciaron una rebelión.\nAl estar en inferioridad numérica, lideraron una campaña de guerra de guerrillas desde la isla de Jindo, hostigando puertos, destruyendo las flotas de Yuan y Goryeo y recopilando información. Finalmente, la guerrilla cayó y huyó a la pequeña isla de Tamna bajo el liderazgo de Kim T'ong-jǒng, el último de los #italic sambyeolcho#!.\nSi quieres dar a ese feroz líder una oportunidad de vengarse de los mongoles, deberías ir a Tamna ahora y asegurarte de que esté a salvo, antes de que los ejércitos conjuntos de Kubilai Khan y Wongjong destruyan lo que queda de la rebelión."
 podgreatpersons.0232.t: "Borjigin Yilianzhenbala"
 podgreatpersons.0232.desc: "Para mantener el control sobre Goryeo, la dinastía Yuan envía a sus hijas para casarse con el rey de Goryeo. Yilianzhenbala ha estado casada con el rey Chungsuk durante tres años, pero la infatuación del rey por la Consorte Virtuosa Hong, una de sus esposas de Goryeo, ha mermado su cordura, hasta el punto de que confrontó abiertamente a su marido durante un banquete. Ambos pelearon y, desde ese día, ella ha sufrido frecuentes e inexplicables hemorragias nasales.\nUno de sus sirvientes se ha puesto en contacto con vuestros vasallos para preguntar si podríais ayudar a su señora a alejarse del alcance del rey y vengarse de su rival. Os preguntáis cuánto sabe Yilianzhenbala de vuestra verdadera naturaleza, pero su carácter y determinación la convierten en una interesante prospecto de $pod_Embrace$."
 podgreatpersons.0233.t: "Ulus Bukha"
 podgreatpersons.0233.desc: "Comandante militar y administrador de la dinastía Yuan en Ssangseong, Ulus Bhuka regresó a Hamju cuando Goryeo comenzó a reclamar sus tierras frente a los mongoles. Conoció a Ch'oe Uihye en un viaje de negocios a la casa de su padre e inmediatamente se enamoró de su forma directa y sensual de ser. Ulus Bhuka adoptó entonces el nombre de Yi Chach'un y desertó hacia Goryeo.\nDe sus dos hijos, Yi Sõng Ye sigue la carrera de su padre, pero sus ambiciones se centran en todo Goryeo, planeando una reforma para resistir el desmoronamiento del dominio Yuan, adoptando el neoconfucianismo como los pilares fundamentales de lo que él llama Joseon.\nPero Yi Chach'un no vivirá lo suficiente para ver a su hijo convertirse en [Glossary('Taejo of Joseon','podgloss.taejo_joseon')]. Se encuentra rodeado por una incursión de los Turbantes Rojos y no hay mucho tiempo para que os mováis y captéis al padre del futuro líder de Goryeo."
 podgreatpersons.0234.t: "Choe Yong-deok"
 podgreatpersons.0234.desc: "Yong-deok nació como [Glossary('nobi','podgloss.nobi')|l] y trabajó como dama de la corte antes de atraer la mirada del rey U de Goryeo. Al convertirse rápidamente en Consorte Real, supo jugar bien las pocas cartas que tenía para mantener su influencia sobre el rey U, a pesar de los intereses de este por otras #italic nobi#!.\nMientras U intentaba aprovechar el ascenso de la dinastía Ming para separar a Goryeo del dominio chino, Yong-deok perdió su favor, fue acusada de conspirar y desterrada de la corte. Su familia fue ejecutada y sus cuerpos exhibidos públicamente.\nPero el rey tenía una mente voluble y ambiciosa, lo que le llevó a enfrentarse a los Ming a pesar de los deseos de su consejo asesor. Cambiará rápidamente de opinión respecto a Yong-deok, restaurándola y perdonándola.\nEl rey U caerá eventualmente y Yong-deok será expulsada de la corte, volviendo a ser una #italic nobi#!, esperando otra oportunidad para elevar su estatus. Sería una candidata al $pod_Embrace$ tumultuosa pero despiadada, y ahora que vuelve a no ser nadie, es el momento de actuar."
 podgreatpersons.0235.t: "Yi Hye-bi"
 podgreatpersons.0235.desc: "Cuando la consorte del rey Gongmin, al no poder dar un heredero, le pidió que eligiera una concubina, el rey Gongmin eligió a la hija del filósofo poeta Yi Che-hyǒn. El rey se había rodeado de [Glossary('jajewi','podgloss.jajewi')|l] y se centraba más en las artes que en sus esposas y concubinas, lo que llevó a la gente a creer que era impotente.\nGongmin, desesperado por un heredero y al no poder tener uno por su cuenta, ordenó a los #italic jajewi#! que violaran a sus concubinas para poder reclamar a un posible hijo como suyo.\nEsta orden, con la amenaza de que los #italic jajewi#! fueran ejecutados una vez que una concubina quedara embarazada, llevó a los #italic jajewi#! a asesinar al rey Gongmin, liberando a Yi Hye-bi de su obligación.\nSe rapó la cabeza y se retiró a un monasterio budista, viviendo una larga vida y presenciando la caída de Goryeo y el ascenso de Joseon.\nLa vejez le está alcanzando, y si queréis $pod_Embrace$ a esa testigo de la historia coreana, vuestros vasallos os han dicho que no le queda mucho tiempo de vida."
 podgreatpersons.0236.t: "Park Paeng-nyeon"
 podgreatpersons.0236.desc: "Erudito de la dinastía Joseon, nombrado para la Sala de los Sabios, Paeng-nyeon formalizó el alfabeto coreano y participó en la creación del [Glossary('Hunminjeongeum','podgloss.hunminjeongeum')] bajo el patrocinio del rey Sejong el Grande.\nNominado para un cargo superior por el rey Danjong, Paeng-nyeon se negó a reconocer al rey Sejo cuando este derrocó a Danjong. A pesar de su participación en una conspiración para restaurar a Danjong, el rey Sejo ofreció el perdón a Paeng-nyeon si negaba su implicación en el golpe y reconocía la autoridad del rey Sejo. Ante la negativa de Park Paeng-nyeon, quien hizo todo lo posible por no reconocer la autoridad del rey mediante su ingenioso uso del lenguaje que él ayudó a crear, el rey Sejo encarceló a Park Paeng-nyeon para torturarlo.\nVuestros agentes han traído un plan para liberarlo de la prisión, si decidís $pod_Embrace$ o convertir en [ghoul|E] al erudito caído en desgracia."
 podgreatpersons.0237.t: "Park Gu-ma"
 podgreatpersons.0237.desc: "La dinastía Joseon introdujo la segregación de género confuciana, lo que provocó un aumento en la severidad de la persecución de las mujeres. Una de ellas, Park Gu-ma, se vio obligada a divorciarse del príncipe Taegang tras un caso de adulterio.\nAprovechó la oportunidad para expresarse a través de la danza y la poesía, volviéndose famosa. Su belleza, ingenio, encanto e inteligencia fueron elogiados por todos, especialmente por hombres de todas las clases sociales. Pero lo que ha llegado a vuestros oídos no son sus poemas. Son las noticias de su juicio por adulterio, que involucra a cincuenta y dos hombres, desde príncipes hasta esclavos, y especialmente la forma en que se mantuvo orgullosa, feroz y sin remordimientos durante su calvario.\nLa sentencia en tales casos suele ser ser convertida en una [Glossary('kisaeng', 'podgloss.kisaeng')]. Pero podríais usar vuestra influencia sobre los oficiales de la corte para que sea sentenciada a «muerte» en su lugar, permitiéndoos arrebatársela y $pod_Embrace$ a ella."
 podgreatpersons.0238.t: "Jo Gwang-jo"
 podgreatpersons.0238.desc: "Nacido en la facción Hungu, Jo Gwang-jo ha enfrentado mucha adversidad por sus intereses y su estudio del neoconfucianismo, un principio de la facción Sarim que se oponía a los Hungu en su contienda por controlar el destino de Joseon. Exiliado durante la segunda [Glossary('sahwa', 'podgloss.sahwa')|l], vivió como un [Glossary('seonbi', 'podgloss.seonbi')|l] antes de regresar a la corte para entrar en la Academia Real de Seonggyungwan una vez que el rey Yeonsangun hubiera sido depuesto.\nJo Gwang-jo obtuvo rápidamente la confianza incondicional del rey Jungjong y, tras graduarse, comenzó a trabajar en la reforma de la administración de Joseon, codificando el hyangyak y estableciendo un nuevo sistema de exámenes centrado no solo en el conocimiento, sino también en el sentido común.\nEsto último permitirá que los Hungu recuperen el poder, lo que conducirá al exilio del erudito durante la tercera #italic sahwa#!, después de que sembraran la discordia entre el rey y Gwang-jo.\nExiliado y sentenciado a muerte por veneno, Gwang-jo aún espera la buena voluntad del rey Jungjong, dejando su puerta norte siempre abierta. Vuestros contactos os han dicho que los soldados encargados de entregarle el veneno están en camino. Ahora es el momento de decidir si queréis $pod_Embrace$ o convertir en [ghoul|E] al erudito."
 podgreatpersons.0239.t: "Yi Sun-sin"
 podgreatpersons.0239.desc: "Iniciando su carrera militar, Yi Sun-sin comenzó defendiendo las incursiones de los Jurchen contra la frontera, durante las cuales rápidamente se ganó una reputación por sus habilidades estratégicas y de liderazgo. Muy pronto fue ascendido a comandante del Distrito Naval de Jeolla Izquierda, lo que le permitió comenzar el desarrollo de la armada. Ese esfuerzo culminó cuando diseñó el [Glossary('geobukseon', 'podgloss.geobukseon')|l].\nCuando los japoneses finalmente iniciaron la guerra Imjin para invadir Corea, Yi Sun-sin los hizo retroceder implacablemente una y otra vez, intentando preservar tantos soldados y barcos como fuera posible, ganándose la reputación de héroe popular que se enfrentaba a los japoneses mientras el rey Seonjo era percibido como incapaz.\nYi Sun-sin resultó gravemente herido durante la batalla de Noryang, en la que logró hundir y capturar casi la totalidad de la flota japonesa, estando en inferioridad numérica de dos contra uno. Según vuestros agentes, hay una breve ventana de oportunidad en medio del caos de la batalla, y podéis intentar $pod_Embrace$ al Chungmu-gong antes de que dé su último suspiro."
 podgreatpersons.0240.t: "Kwak Chaeu"
 podgreatpersons.0240.desc: "Debido a su dura postura contra el gobierno, Kwak Chaeu no pudo aprobar el examen para la función pública y se ocultó, esperando una oportunidad. Cuando los japoneses iniciaron la guerra de Imjin, comenzó a reunir un ejército de irregulares justicieros y, mediante tácticas poco convencionales, logró masacrar a los invasores mientras intentaban cruzar el río Nam.\nReconociendo sus esfuerzos e intentando ganarse la aprobación popular, el rey Seonjo le concedió un cargo oficial poco después de su victoria. Lideró numerosas batallas más con su ejército justiciero, vistiendo su emblemática Túnica Roja y dirigiendo los combates desde la primera línea.\nSobrevivió a la guerra ileso. Sus oponentes afirman que se debe a su Túnica Roja, la cual supuestamente empapó en sangre menstrual de virgen, proporcionándole suficiente Yin para absorber el Yang de sus balas. Sea esto cierto o no, despertó vuestro interés.\nDisfrutando de una vida tranquila y recluida, tras haber guardado su Túnica Roja hace ya días, Kwak Chaeu aguarda ahora la muerte sin temor."
 podgreatpersons.0241.t: "Trân Thù Đô"
 podgreatpersons.0241.desc: "El arquitecto del ascenso de la dinastía Trân, Trân Thù Đô manipuló a la reina regente infantil Lý Chiêu Hoàng, la desposó con Trân Thái Tông y la obligó a abdicar en favor de su marido, estableciendo la dinastía Trân para gobernar Đai Viêt.\nCuando Lý Chiêu Hoàng no pudo engendrar un heredero, obligó a Trân Liêu a entregar a su esposa embarazada, la princesa Thuân Thiên, al emperador, lo que provocó que Trân Liâ se rebelara contra la familia real, obligara al emperador a retirarse como monje por sus sentimientos y derivara en la ejecución de cada soldado que se rebeló una vez que el emperador regresó.\nDesde entonces, logró repeler una invasión mongola y permaneció ocupado con los asuntos de la corte, incluso ahora que su vida decae. Ahora es el momento de acercarse a él y darle otro clan entero de los que cuidar: el vuestro."
 podgreatpersons.0242.t: "An Tu"
 podgreatpersons.0242.desc: "An Tu es una de las damas de compañía de la dinastía Trân. Cuando los mongoles invadieron Đai Viêt, derrotando al ejército defensor, la familia imperial intentó huir de la capital en pequeñas barcas, tratando de atraer a los mongoles con su barco imperial. Los invasores descubrieron el plan urdido apresuradamente y rodearon la flota.\nEl emperador Trân Thánh Tông tuvo que recurrir a otro truco. Usando la belleza natural de An Tu, se la ofreció a Toghon, hijo de Kubilai Khan, líder de los invasores, presentándola como una de las princesas Trân. La belleza de An Tu, con un toque de desesperación, ayudó a vender la historia y dio tiempo suficiente para que los ejércitos Trân se reagruparan y masacraran a los mongoles.\nEl destino de An Tu tras la batalla es desconocido, siendo ya objeto de muchas historias extrañas y contradictorias. Podríais aprovechar este caos como una oportunidad para poner vuestras manos sobre esta «Princesa de hojas y ramas preciosas»."
 podgreatpersons.0243.t: "Trân Húng Đao"
 podgreatpersons.0243.desc: "Tras tener que ceder a su esposa al emperador infantil Trân Thai Tông, Trân Húng Đao inició una carrera militar que le llevaría a convertirse en uno de los generales más exitosos de Đai Viêt.\nSobreviviendo a la primera invasión mongola como oficial de frontera, estuvo al frente de las fuerzas combinadas terrestres y navales de Đai Viêt durante la segunda invasión mongola. A pesar de las graves pérdidas, y debido al clima hostil y a las enfermedades que azotaban a los mongoles, logró repeler a los invasores en el río Rojo.\nDos años después, Kublai Khan envió a su hijo favorito, el príncipe Toghan, a invadir Đai Viêt. Una vez más, se encontraron con una feroz resistencia y fueron derrotados por el genio táctico de Trân Húng Đao, quien logró atrapar y destruir cuatrocientas naves mongolas en el río Bach Đang.\nAhora retirado, las noticias de la enfermedad del gran general han llegado a vuestros oídos. Si queréis $pod_Embrace$ a él, deberíais hacerlo antes de que sea demasiado tarde."
 podgreatpersons.0244.t: "Lê Van Huu"
 podgreatpersons.0244.desc: "Nacido de orígenes humildes, Lê Van Huu demostró ser un erudito muy competente, ocupando el segundo lugar en los exámenes imperiales con solo diecisiete años. A partir de ahí, fue nombrado funcionario de la corte, miembro de la academia Hanlin y, finalmente, se hizo cargo de la oficina real de registros históricos.\nAprovechando su acceso a esos registros, comenzó a compilarlos en un libro histórico exhaustivo de Đai Viêt. Un libro de treinta [Glossary('quyên','podgloss.guyen')|l] de largo, el #italic Đai Viêt su ky!# es un relato completo de Đai Viet, destinado a establecer que el imperio siempre ha sido independiente e igual a China. Sus escritos se utilizan ahora para reforzar la legitimidad de la dinastía Tran que ostenta actualmente el poder.\nAhora retirado y cerca de cumplir un siglo, el frágil hombre se ha recluido en su casa, esperando que llegue la muerte. Pero dejar que una mente así desaparezca para siempre sería una lástima, y podríais $pod_Embrace$ a él."
 podgreatpersons.0245.t: "Huyên Trân"
 podgreatpersons.0245.desc: "Hija del emperador retirado Tran Nhân Tông, Huyên Trân fue utilizada por su hermano como moneda de cambio para asegurar un plan de expansión diplomática y una alianza política con el Reino de Champa, siendo desposada con el rey Jaya Simhavarman III.\nApenas un año después, el rey Jaya murió en circunstancias misteriosas. Negándose a ser incinerada con su difunto marido, como dicta la costumbre local, envió a buscar a un hombre del que se sospechaba que era su amante para que fuera a rescatarla.\nEl audaz y extravagante conjura tuvo éxito y los amantes desaparecieron sin dejar rastro.\nLo que es más importante, uno de vuestros agentes logró asegurar un lugar en la expedición y puede deshacerse del amante si deseáis ofrecer a esa audaz poetisa el regalo del $pod_Embrace$."
 podgreatpersons.0246.t: "Mac Đinh Chi"
 podgreatpersons.0246.desc: "A pesar de su cuerpo frágil y su fealdad, Mac Đinh Chi aprobó brillantemente el examen imperial y se convirtió en el más joven en alcanzar el título de [Glossary('Thai Hoc Sinh','podgloss.thai_hoc_sinh')]. Su ingenio, integridad y maestría en la poesía para transmitir sus argumentos lograron impresionar al emperador Trân Minh Tông.\nSus sucesores utilizaron las habilidades de Mac Đinh Chi para liderar dos misiones diplomáticas con la dinastía Yuan. Sus viajes dejaron una impresión duradera entre los Yuan y le permitieron acercarse y establecer fuertes vínculos con los diplomáticos de Goryeo, en particular con la sobrina del embajador, con quien se casó.\nLa vida del poeta-erudito está llegando a su fin, retirado de la corte. Si desapareciera en un extraño accidente, Đai Viêt no perdería mucho, pero vos ganaríais mucho."
 podgreatpersons.0247.t: "Nga Tet Pya"
 podgreatpersons.0247.desc: "Durante la unificación de los reinos de Sagaing y Pinya en el Reino de Ava, tras las brutales incursiones de los Shan Maw, Tet Pya se hizo un nombre aprovechando que el nuevo rey se encontraba frecuentemente en campaña contra los rebeldes. Eligiendo objetivos de alto perfil, lideró una campaña de atracos y robos a lo largo del río Irrawaddy. Tras evadir su captura durante un tiempo, finalmente fue arrestado en 1366 por los hombres del rey Thado Minbya.\nCuando el rey le preguntó qué arma debería usar para ejecutarlo, respondió con su famosa frase: #italic «He elegido a vuestra reina más hermosa, Saw Omma»#!. Lo que provocó la respuesta más inesperada del cruel y brutal rey, que le ofreció un mando en su ejército.\nSu protector acaba de morir, obligándole a huir de la corte para esconderse, ante la desesperación de numerosos sirvientes y princesas que anhelan su abrazo. Vuestros sirvientes han encontrado la forma de llegar hasta él, si deseáis $pod_Embrace$ o convertirlo en [ghoul|E]."
 podgreatpersons.0248.t: "Piya Yaza Dewi"
 podgreatpersons.0248.desc: "Nacida como una plebeya, Mwei Manet comenzó su vida vendiendo flores en Dagon, cuando el rebelde príncipe Binnya Nwe la vio y cayó bajo su hechizo, tomándola por esposa contra los deseos de su corte. La primera esposa del príncipe, Tala Mi Daw, se sintió profundamente herida por la obsesión del príncipe con Mwei Manet.\nCuando murió el rey Binnya U de Pegu, los nobles invitaron al príncipe exiliado a regresar para gobernar el reino, pero el hechizo bajo el que se encontraba el príncipe era tan fuerte que Mi Daw se negó a ser coronada con él mientras Yaza Dewi permaneciera allí. Reforzando su control sobre el rey, Yaza Dewi se convirtió en reina y empujó a Tala Mi Daw al suicidio por desesperación. También sugirió a Binnya Nwe que ejecutara a su único hijo, Balawkyantaw.\nSu suerte, o sus hechizos, se están agotando y se ha visto envuelta en un complot de asesinato contra ella. Podrías quitarle el suelo bajo los pies a sus asesinos y $pod_Embrace$ o convertirla en [ghoul|E] a ella en su lugar."
 podgreatpersons.0249.t: "Đang Dung"
 podgreatpersons.0249.desc: "Bajo la dinastía Ho, Đang Dung ayudó a su padre a gobernar Thuân Hoa. Cuando el ejército Ming llegó y ocupó el país, poniendo fin a la dinastía Ho, se unió a la insurrección iniciada por la dinastía Trân y ayudó a asegurar el trono para Trân Ngoi.\nAl darse cuenta de que el emperador era manipulado por sus eunucos, Đang Dung se rebeló una vez más y depuso a Trân Ngoi, lo que permitió que su amigo Trân Quy Khoáng tomara el trono. La paz no duró y los Ming invadieron el reino, infligiendo graves derrotas a un gran coste en los ejércitos liderados por Đan Dung. Sin intención de rendirse, lideró una campaña de resistencia perdedora contra los invasores durante años, antes de que su emperador fuera capturado y asesinado.\nVuestros agentes, siguiendo el rastro del brillante general, os han advertido de que escribió un poema de muerte y que podría quitarse la vida en solidaridad con su amigo. $pod_Embrace$ a él ahora, o asumid el riesgo de perder la brillante mente del general poeta."
 podgreatpersons.0250.t: "Keo Phimpha"
 podgreatpersons.0250.desc: "Durante la última década, el reino de Lan Xang ha sido el escenario de tantas guerras de facciones que te ha resultado difícil seguirles la pista a todas. Tras la muerte de Lan Kham Deng, una crisis sucesoria se descontroló, provocando el asesinato de al menos siete reyes distintos en menos de diez años.\nAdemás, el cerebro detrás de todo esto parece ser la anciana Keo Phimpha. Sus motivos solo los conoce ella, pero su determinación no conoce límites.\nSin embargo, antagonizar a la corte la llevó a ser arrestada y condenada a una ejecución planificada, atada a su marido y abandonada para que se la comieran los naga.\nLa peligrosa y amargada anciana probablemente se adapte muy bien a la vida eterna, si decides darle el $pod_Embrace$ o convertirla en [ghoul|E]."
 podgreatpersons.0251.t: "Trinh Kha"
 podgreatpersons.0251.desc: "Un amigo cercano y consejero de Lê Loi, Trinh Kha fue fundamental en la rebelión contra la dinastía Ming y en la restauración de Đai Viêt como un señorío independiente, obteniendo el título de [Glossary('Hành khiên', 'podgloss.hanh_khien')]. Exiliado durante la regencia tras la muerte de su amigo, conspiró para asegurar una posición como el único poder tras el trono, deshaciéndose de un regente atrincherado.\nCuando el joven rey murió, la reina Nguyen Thi Anh se convirtió en regente del infante Lê Nhân Tông. Trinh Kha logró manipular a la relativamente joven regente y compartió el poder con ella.\nEso fue hasta hace poco. Ahora está encarcelado y espera su ejecución. Tus agentes oyeron rumores de que Trinh Kha intentó forzar a la reina, pero no se ha dado ninguna razón oficial para su desgracia.\nSi quieres conseguir a este consejero y hábil conspirador para ti, deberías actuar ya."
 podgreatpersons.0252.t: "Shin Sawbu"
 podgreatpersons.0252.desc: "Nacida como hija en una turbulenta familia de monarcas, Shin Sawbu fue secuestrada para casarse con el rey de Ava durante una crisis sucesoria que involucraba a sus hermanos. Se quedó en un monasterio tras la muerte de su marido y logró regresar a Pegu gracias a la ayuda de dos monjes.\nDespués de que todos los miembros varones de su familia se mataran entre sí, se encontró sentada en el trono, inaugurando un largo periodo de paz y estabilidad en el reino.\nSintiendo de nuevo el llamado del monasterio, abdicó siete años después en favor de uno de los monjes que la ayudaron a escapar de Ava y se trasladó al [Glossary('stûpa','podgloss.stupa')|l] budista de Shwedagon, donde gobernó como una reina monja. El [Glossary('Binnya Thau', 'podgloss.binnya_thau')] espera el próximo ciclo de la rueda para llevársela, pero podrías conseguir a una de las pocas reinas de la zona para tus propios planes."
 podgreatpersons.0253.t: "Yazathingyan"
 podgreatpersons.0253.desc: "Yazathingyan sirvió a siete reyes de Ava durante una vida llena de acontecimientos como oficial militar y consejero. Comenzando su carrera durante las guerras de cuarenta años entre Ava y Hanthawaddy, lideró después una exitosa campaña de expansión, sobrevivió a la crisis sucesoria de la rebelión de Mohnyi y demostró su valor al nuevo rey asesorándole durante la guerra civil de Ava, hasta que la excentricidad del rey resultó ser demasiado para él.\nApoyó al nuevo rey para restablecer el dominio de Ava sobre sus antiguos vasallos por la fuerza y, finalmente, repelió una invasión china.\nPero su rey fue apuñalado en el palacio bajo su supervisión y no pudo salvarlo. Ahora, caído en desgracia, se retiró, esperando una muerte que finalmente se acerca. Ya sea en forma de vejez o por tu mano, si decidieras darle el $pod_Embrace$."
 podgreatpersons.0254.t: "Diogo Soares"
 podgreatpersons.0254.desc: "Las aventuras de Diogo Soares están llegando a su fin con la muerte de Tabinshwehti, rey y fundador del Imperio Toungoo. Murió debido al alcoholismo que le provocaron los «exploradores» portugueses.\nDesterrado de la India por su sangrienta carrera como corsario, Soares desembarcó en Birmania debido al mal tiempo. Allí conoció rápidamente a Tabinshwehti y se hizo su amigo, quien lo nombró general durante la guerra de Shwehti, con consecuencias desastrosas.\nSu última aventura, secuestrar a la hija de un rico mercader durante su boda para casarse con ella, matando a todo el que intentó rescatarla solo para que la novia se suicidara, es la razón de su arresto por parte del sucesor de Tabinshwehti.\nSu casa está en llamas, sus riquezas han sido saqueadas por una turba enfurecida y, si quieres conseguir a este conocedor del buen vino, deberías moverte rápido para darle el $pod_Embrace$."
 podgreatpersons.0255.t: "Nguyen Thi Lô"
 podgreatpersons.0255.desc: "Nguyen Tran es un erudito confuciano, político despiadado y maestro estratega que casi por sí solo logró sacar a Đai Viêt del dominio de los Ming, asesorando y sirviendo al futuro rey Lê Loi.\nCansado de los aduladores y conspiradores de la corte, optó por retirarse a su casa de campo con sus esposas.\nSu segunda esposa, Nguyen Thi Lô, fue clave en sus estrategias y una de sus mejores consejeras, además de la tutora del joven rey Lê Thai Tông. El rey, deseando visitar a su tutora y amante, acudió a la finca de Nguyen Tran y, curiosamente, murió al día siguiente de su llegada.\nNguyen Tran alega su inocencia, pero ha sido sentenciado a [Glossary('miezu','podgloss.miezu')|l]. No puedes salvar a una figura de tan alto perfil, pero Nguyen Thi Lô, la acusada amante, sí puede ser salvada si logras sobornar a algunos de sus guardias y decides darle el $pod_Embrace$ o convertirla en [ghoul|E]."
 podgreatpersons.0256.t: "Tachibana Dōsetsu"
 podgreatpersons.0256.desc: "Uno de los guerreros más feroces que pisaron los campos de Sengoku Kyushu, Tachibana Dōsetsu es un prodigio militar que sirve al clan Ōtomo con lealtad inquebrantable. Aunque la mitad inferior de su cuerpo quedó paralizada más adelante en su vida, participó en 37 campañas y más de 100 enfrentamientos menores. Es considerado uno de los vasallos más sabios de los Ōtomo. Organizó una unidad de élite de 48 guerreros, conocidos como los «Halcones Blancos», entrenados y adiestrados personalmente bajo su estricto código de disciplina. Maestro de un estilo de espada único y mortal conocido como [Glossary('tachiuchi ni myō o etaru', 'podgloss.tachiuchi_ni_myo_o_etaru')], se dice que Dōsetsu posee una fuerza inhumana. Llamó a su hoja [Glossary('Chidori', 'podgloss.chidori')] hasta que un día, un rayo golpeó el árbol bajo el cual se refugiaba. Se dice que, en un destello de instinto, desenvainó su espada y partió al Dios del Trueno dentro del relámpago, sobreviviendo a lo que debería haber sido una muerte segura. A partir de entonces, renombró su hoja como [Glossary('Raikiri', 'podgloss.raikiri')]. Sin embargo, hay rumores de que Dōsetsu está muriendo actualmente de una enfermedad. Su muerte parece segura ahora, pero un $pod_Embrace$ podría salvar al guerrero si así lo desearas."
 podgreatpersons.0257.t: "Ikkyū"
 podgreatpersons.0257.desc: "El hijo ilegítimo del emperador Go-Komatsu y una mujer de baja estirpe, Ikkyū fue criado con un estilo de vida monástico desde los cinco años. Estudió en el Ankoku-ji de Kioto y luego se trasladó al Daitoku-ji, donde se convirtió en un discípulo brillante pero volátil del Zen. Rechazó el budismo institucional, condenando la corrupción que veía en los templos. Eligió el vagabundeo, el sake y la poesía por encima de las túnicas y el incienso. Alcanzó el [Glossary('kenshō', 'podgloss.kensho')] mientras escuchaba el graznido de un cuervo en una barca en el lago Biwa. Después, enseñó Zen a través de la pasión y la burla. Se acostó con cortesanas, especialmente con una cantante ciega llamada Mori, de quien se enamoró. Ahora, Ikkyū ha regresado al Daitoku-ji en el ocaso de su vida. Claramente en sus últimos días, el monje yace con respiración febril, esperando la muerte. Tu $pod_Embrace$ podría salvar al monje loco y, tal vez, en tu corte encuentre un lugar."
 podgreatpersons.0258.t: "Kō no Moronao"
 podgreatpersons.0258.desc: "Un samurái del clan Kō, Moronao ascendió de rango gracias a su brillantez. Como administrador de Ashikaga Takauji, ganó mucha influencia en la corte imperial. Esto desencadenó la sangrienta y divisiva perturbación de Kannō, una guerra civil con repercusiones muy graves para todo el país. Moronao purgó a sus enemigos con furia y crueldad hasta que se llegó a un armisticio con la ayuda de un maestro Zen cercano a ambos bandos. Despreciado tanto por nobles como por monjes, finalmente fue obligado a retirarse.\nÚltimamente has oído rumores creíbles de que el clan Uesugi planea ejecutar al hombre. Podrías simplemente ignorar a este guerrero derrotado y dejarlo a su suerte, o concederle una nueva oportunidad en tu corte."
 podgreatpersons.0259.t: "Ben no Naishi"
 podgreatpersons.0259.desc: "Hija de un pintor y poeta, Ben no Naishi llegó a la corte imperial con gracia. Sirvió al emperador Go-Fukakusa como naishi-no-kami, encargada de los ritos sagrados y de la propia regalia divina. Ha registrado la vida palaciega con pinceladas magistrales, ofreciendo muchas ventanas al mundo real. Más que una escriba, era una consejera, una guardiana de la belleza.\nSin embargo, de forma bastante abrupta, parece haber desaparecido de la corte tras la abdicación del emperador. Algunos dicen que ha elegido un retiro tranquilo; otros piensan en posibilidades más oscuras. Sea cual sea la verdad, encontrar a esta dama de la corte debería ser posible si mueves algunos hilos."
 podgreatpersons.0260.t: "Lohgawe"
 podgreatpersons.0260.desc: "Lohgawe es un brahmán indio, sin parangón en virtud y asuntos espirituales. Viajó desde lejos de la India hasta la isla de Java, buscando la encarnación de Vishnu.\nFue mentor del joven paria Ken Arok, convirtiéndolo de un astuto líder de ladrones en un rey. También profetizó a Ken Arok que Ken Dedes, la esposa de su empleador, daría a luz a reyes, pero aconsejó a Ken Arok que se mantuviera alejado de ella.\nIgnorando el consejo de su mentor y embriagado por la belleza de Ken Dedes, Ken Arok mató a su empleador, tomó a Ken Dedes como esposa y llegaría a gobernar el Reino de Singhasari.\nAhora débil y frágil, puedes organizar fácilmente la desaparición de Lohgawe y reclamarlo para ti."
 podgreatpersons.0261.t: "Ken Dedes"
 podgreatpersons.0261.desc: "Ken Dedes nació de un humilde sacerdote hindú. Cuando el gobernante local, Tunggul Ametung, se enamoró de ella, la secuestró y se casó con ella; Ken Dedes esperó una oportunidad para ejecutar su venganza. Esa oportunidad tomó la forma de Ken Arok, el guardaespaldas de Tunggul. Tras seducirlo, llevó a Ken Arok a planear el asesinato de su secuestrador.\nEl hijo que tuvo de su primer matrimonio, Anusapati, tras conocer la verdad sobre su padre y su fin, emprendió más tarde el camino de la venganza y asesinó a Ken Arok, solo para ser asesinado por el otro hijo de Ken Dedes, Tohjava.\nSupuestamente criada con virtudes budistas, uno solo puede preguntarse si todos esos asesinatos se deben a sus maquinaciones. En cualquier caso, con la mayoría de sus hijos matándose entre sí y fuera de la vista de la corte, podrías reclamar como la primera reina de Singhasari, y esperar que no engendre a alguien que acabe reemplazándote."
 podgreatpersons.0262.t: "Mahisa Anabrang"
 podgreatpersons.0262.desc: "Mahisa Anabrang es el almirante que lideró la expedición singhasari al reino de Pamalayu. Tras 18 años de guerra en el extranjero, regresó con dos princesas de Pamalayu para casarse con su rey. Sin embargo, Kertanegara, su rey, había muerto en la rebelión de Jayakatwang el año anterior. Anabrang decidió jurar lealtad a Raden Wijawa, uno de los parientes de Kertanegara, quien venció a los rebeldes y creó el Reino de Majapahit poco después. Para asegurar aún más su posición, el rey tomó a las princesas que Anabrang trajo consigo como esposas.\nLa primera rebelión de Majapahit ha comenzado desde entonces, y la posición de Mahisa Anabrang es precaria, siendo el último seguidor leal de Raden Wijawa, atrapado cerca del río Tamba Besas.\nSi quieres arrebatar al leal almirante para $pod_Embrace$ a él, deberías moverte cuanto antes."
 podgreatpersons.0263.t: "Dyah Halayudah"
 podgreatpersons.0263.desc: "Celosa, traicionera y ambiciosa, Dyay Halayudah se vio privada del cargo de [Glossary('Rakryan patih', 'podgloss.rakryan_patih')] en favor de personas de menor linaje. Sus maquinaciones provocaron la caída de los tres héroes de Majapahit: Rangga Lawe se rebeló y murió a manos de Mahisa Anabrang, Lembu Sora fue exiliado, y ella hizo creer al rey que Nambi, el primer [Glossary('Rakryan patih', 'podgloss.rakryan_patih')], se había rebelado contra Jayanagara, el rey, para provocar su muerte.\nJayanagara, el rey de Majapahit, consintió estas maquinaciones ya que era inmoral y propenso a los conjuros, y los conjuros de Mahapati ayudaron a recuperar la mitad oriental de Majapahit desde Wirarja hacia el este.\nSin embargo, ahora que Majapahit está firmemente asegurada en manos de Jayanagara, sus crímenes están siendo expuestos uno por uno. Sentenciada a morir por mil cortes, podrías arrebatar a Mahapati para ti y reemplazarla con un señuelo."
 podgreatpersons.0264.t: "Citra Rashmi"
 podgreatpersons.0264.desc: "Cuando Hayam Wuruk se convirtió en el emperador de Majapahit, decidió casarse con la hermosa princesa sundanesa Citra Rashmi para asegurar una alianza con su vecino del oeste. Cuando la familia real llegó a la plaza de Bubat en Trowulan para celebrar el matrimonio y la alianza entre los dos reinos, Gajah Mada, el [Glossary('Mahapatih','podgloss.maha_patih')] de Majapahit, deseaba establecer el dominio de Majapahit sobre Sunda y pidió que Citra Rashmi no fuera más que una concubina.\nLa propuesta no sentó bien a la familia real y se negaron, preparándose para defender su honor. Las tropas de Majapahit superan en número al séquito real de Sunda por una cantidad ridícula y lo que vendrá no será una batalla, sino una masacre.\nCitra Rashmi, conocida como Pitaloka, así como la mayoría de las mujeres de la familia real, probablemente se suicidará, tal como dicta el ethos del [Glossary('kshatriya','podgloss.kshatriya')], para evitar ser deshonrada.\nNo queda mucho tiempo para salvar a Pitaloka de su destino, pero podrías sustituir a la princesa por un señuelo."
 podgreatpersons.0265.t: "Gajah Mada"
 podgreatpersons.0265.desc: "Comenzando como un comandante [Glossary('Bhayangkara', 'podgloss.bhayangkara')] y salvando la vida de Jayanegara, Gajah Mada ascendió al cargo de [Glossary('Mahapatih', 'podgloss.maha_patih')] tras aplastar rebeliones y ayudó a la reina Tribhuwana a asegurar el imperio Majapahit.\nDurante su nombramiento, hizo el [Glossary('Sumpah Palapa', 'podgloss.sumpah_palapa')] para expandir el imperio hasta que abarcara la totalidad del archipiélago de Nusantara.\nSu ambición, sin embargo, será su perdición. La muerte de Pitaloka y su familia durante la batalla de Bubat llevó a Hayam Wuruk a obligarle a retirarse, y su cargo de Mahapatih se dividió entre cuatro Patih diferentes.\nOlvidado por muchos, el último Mahapatih espera ahora la muerte en su finca, y te resultaría fácil añadirlo a tu séquito."
 podgreatpersons.0266.t: "Urduja"
 podgreatpersons.0266.desc: "El reino de Talawasi es extraño. Hogar de los [Glossary('Kinalakian', 'podgloss.kinalakian')], es una sociedad matriarcal dirigida por princesas guerreras. Una de ellas, Urduja, ha hecho el voto de casarse solo con el hombre que pueda vencerla en combate singular y, a día de hoy, sigue sin casarse ni tener hijos, pues la mayoría de los hombres temen sus habilidades marciales.\nLa hospitalidad de Talawasi se extiende, no obstante, a cualquier mercader o viajero que llegue a las islas del norte de Nusantara, como puede atestiguar Ibn Battuta, el navegante que visitó todas las tierras musulmanas y habló de los banquetes y la prosperidad de Talawasi.\nSin embargo, los días de Urduja están llegando a su fin; sus planes de una invasión de la isla de la pimienta, lo que tú conoces como la India, no pueden terminar bien para la princesa guerrera.\nSe podría organizar un accidente fortuito si decidieras reclutarla, dejando el reino Kinalakian en manos de su hermana."
 podgreatpersons.0267.t: "Tantular"
 podgreatpersons.0267.desc: "Mpu Tantular es poeta, teólogo y filósofo, y sobrino de Hayam Wuruk, el emperador de Majapahit. Inquebrantable en sus creencias budistas, Tantular es conocido por su tolerancia y aprecio por otras creencias, y dedicó sus escritos a ellas.\nSu obra más famosa, sin embargo, sigue siendo el [Glossary('Kakawin Sutasoma','podgloss.kakawin')], del cual proviene el verso [Glossary('Bhinneka Tunggal Ika', 'podgloss.bhinneka_tunggal_ika')], y que glorifica la diversidad cultural y religiosa del imperio Majapahit.\nAunque nunca ocupó un cargo oficial en la corte imperial, es maestro y consejero personal de Hayam Wuruk, utilizando su visión filosófica para guiar a Majapahit a través de la indianización del archipiélago.\nAhora que el emperador ha muerto, hacerlo desaparecer y que se una a tu corte para un $pod_Embrace$ es relativamente sencillo."
 podgreatpersons.0268.t: "Sang Adi Putra"
 podgreatpersons.0268.desc: "Sang Adi Putra, maestro de [Glossary('Silat', 'podgloss.silat')], estaba meditando en una cueva en el monte Ledang. Cuando el almirante Hang Tuah, del sultanato malayo de Malaca, fue a buscarlo, este aceptó posponer su búsqueda personal de introspección para entrenarlo a él y a sus compañeros. Una vez que el maestro consideró que su entrenamiento era suficiente, regresaron a Malaca y, para sorpresa del [Glossary('Bentahara', 'podgloss.bentahara')], lograron repeler a los rebeldes y bandidos que asolaban la región.\nTras haber sido interrumpido en su meditación, Sang Adi Putra regresó a la cueva de la montaña para meditar.\nTus agentes han encontrado el lugar mítico donde descansa y podrías intentar subyugarlo para $pod_Embrace$ a él."
 podgreatpersons.0269.t: "Sayyid Ali Rahmatullah"
 podgreatpersons.0269.desc: "Nacido en Champa, Sayyid Ali Rahmatullah se trasladó a Java cuando su tía se casó con Kertawijawa, rey de Majapahit. Desde allí, comenzó a difundir el Islam y ha sido el maestro de Raden Patah. Raden Patah ha fundado desde entonces el Sultanato de Demak, uno de los primeros sultanatos del archipiélago.\nDescendiente de Muhammad, el Profeta, Sayyid Ali Rahmatullah se ha convertido en uno de los [Glossary('Wali Songo', 'podgloss.wally_songo')] y se ganó el nombre de Sunan Ampel por sus esfuerzos en la difusión del Islam y su ayuda en la consolidación del Sultanato. Su esfuerzo llevó a la construcción de la Gran Mezquita de Demak, y ahora que la obra de esta notable mezquita está terminada, Sunan Ampel se ha retirado, dejando que sus hijos asuman el trabajo de su vida.\nEl viejo sabio espera ahora pacíficamente la muerte, y una intervención por tu parte podría llevarte a $pod_Embrace$ a él."
 podgreatpersons.0270.t: "Shi Da-jie"
 podgreatpersons.0270.desc: "La hija de Shi Jinqing, quien ayudó a Zheng He a derrotar a los piratas de Palembang, perdió el control de los bienes de su familia cuando su padre murió en beneficio de su hermana. Expulsada de Palembang, Shi Da-jie se trasladó a Java y fue nombrada [Glossary('shahbander','podgloss.shahbander')] de Gresik por el gobernante de Majapahit. Centrada en reconstruir una base de poder, desarrolló los puertos y el comercio de Gresik, convirtiéndolo en uno de los puertos comerciales más grandes de la zona, enviando barcos a Bali, las Molucas y Camboya.\nPara facilitar el comercio con los sultanatos, fomentó la expansión del Islam en el archipiélago y crió a sus hijos según los principios del Islam. Uno de ellos, Sunan Giri, será fundamental en la conversión a gran escala del archipiélago.\nAhora retirada, la Gran Dama de Gresik disfruta de los frutos de su vida de trabajo en su finca. Si quieres $pod_Embrace$ a ella, ahora es el momento de actuar."
 podgreatpersons.0271.t: "Tun Perak"
 podgreatpersons.0271.desc: "Comenzando su carrera como un gobernador muy eficaz para el Sultanato de Malaca, Tun Perak fue fundamental en la derrota de los siameses durante su invasión de Malaca. Lo logró, notablemente, permitiendo la presencia de mujeres en el ejército para motivar a los hombres a luchar con más ahínco. Su victoria sobre los siameses llevó al Sultán a nombrarlo [Glossary('Bentahara', 'podgloss.bentahara')].\nLeal hasta la médula al sultanato, ayudó a asegurar el señorío y lo expandió bajo cuatro sultanes diferentes, y cuando el hijo del sultán asesinó a su propio hijo, evitó buscar venganza y llevó al Sultanato a su apogeo.\nSu salud está decayendo y su hermano está tomando el relevo. Organizar su desaparición de la vida pública te permitiría $pod_Embrace$ a él."
 podgreatpersons.0272.t: "Tun Fatimah"
 podgreatpersons.0272.desc: "La hija del [Glossary('Bentahara', 'podgloss.bentahara')] de Malaca, Fatimah aprendió a luchar desde temprana edad. Cuando los portugueses llegaron al puerto por primera vez, Fatimah, vestida de hombre, y sus hermanos lucharon ferozmente y empujaron a los comerciantes y colonizadores de vuelta al mar. Impresionado tanto por su destreza marcial como por su belleza, el Sultán deseó casarse con ella. Su padre se negó, pues tenía otros planes para ella.\nLleno de furia, el Sultán asesinó a toda su familia y la obligó a casarse. Intentando vengar a su familia, Fatimah nunca sonrió al sultán y abortó al menos tres veces antes de lograr asegurar a su hijo como el primero en la línea de sucesión.\nSin embargo, sus planes no tendrían tiempo de dar frutos, ya que los portugueses regresaron. Y, esta vez, temiendo a Tun Fatimah, arrollaron a la flota de Malaca y empujaron al Sultán y a su séquito al exilio.\nAhora sin poder y en fuga, puedes darle a Tun Fatimah el poder que siempre quiso asegurando un $pod_Embrace$."
 podgreatpersons.0273.t: "Laksamana Malahayati"
 podgreatpersons.0273.desc: "La hija de un [Glossary('laksamana','podgloss.laksamana')], Malahayati fue criada con una educación marcial y lideró la guardia real del Sultanato de Aceh. Cuando la delegación holandesa, encabezada por Cornelis de Houtman, insultó al Sultán, fueron Malahayati y su ejército de viudas quienes lograron luchar contra los holandeses y matar al infractor. Manteniendo un fuerte control sobre la costa de Aceh, expulsó a los comerciantes europeos y mantuvo los estrechos abiertos solo para barcos musulmanes y asiáticos.\nCuando el reino de Inglaterra quiso abrir el comercio en la zona, decidieron minimizar sus pérdidas y enviar un emisario al Sultán para negociar pacíficamente un acuerdo. Malahayati fue la negociadora que el Sultán eligió, ya que se negó a confiar cualquier asunto de este tipo a un hombre.\nPor desgracia, los portugueses no tienen el tacto diplomático de Inglaterra y ahora rodean la flota de Malahayati.\nSi quieres $pod_Embrace$ a ella, tendrás que enviar a tu agente y secuestrarla antes de su inevitable fin."
 podgreatpersons.0274.t: "Zhao Rukuo"
 podgreatpersons.0274.desc: "Zhao Rukuo es una leyenda dentro del Reino Medio y más allá. Nacido en una rama lejana del Clan Imperial Song, ascendió en los rangos hasta convertirse finalmente en Supervisor del Comercio Marítimo.\nSu mayor logro es el Zhu Fan Zhu. Esta obra de dos tomos contiene una descripción enciclopédica de las muchas culturas, lugares y pueblos conocidos por el Reino Medio. Desde Indonesia hasta las estepas, de la India a Arabia, e incluso más allá, el libro lo detalla todo.\nSin embargo, la vida de este gran hombre llega a su fin; está enfermo y es probable que no se recupere. Aunque quizás este no sea el fin de su existencia. El primer tomo del Zhu Fan Zhu detallaba la cultura y el segundo, los bienes.\n$pod_Embrace$ a él, y quizás un tercer tomo detalle lo sobrenatural."
