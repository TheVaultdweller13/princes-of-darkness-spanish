 POD_gargoyle.200.desc.start: "Una nueva aspirante aparece en tu corte. Una gárgola llamada [new_gargoyle_aspirant.GetFirstName] afirma haber huido de los Tremere. Pudo escapar cuando su maestro, [destroyed_tremere_master.GetFullName], fue destruido "
