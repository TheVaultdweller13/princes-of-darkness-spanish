 POD_gargoyle.200.desc.tzimisce: "por los Tzimisce. "
 POD_gargoyle.200.desc.lupines: "por una manada de lupinos. "
 POD_gargoyle.200.desc.gangrel: "por un Gangrel vengativo. "
 POD_gargoyle.200.desc.nosferatu: "por una intriga de los Nosferatu. "
