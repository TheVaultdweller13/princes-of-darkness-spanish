 POD_jerusalem.35.t: "Equilibrio de poder"
 POD_jerusalem.35.desc: "La [grand_city|E] de [holy_jerusalem|E] se mantiene en el filo de la navaja, vacilando entre las tres principales facciones religiosas. Según tus objetivos, tendrás que inclinar el equilibrio de poder a favor de unas facciones u otras. Ten en cuenta que el equilibrio cambiará cada año en #TOOLTIP:POD_jerusalem_tt_muslim #L;V [GetPlayer.MakeScope.ScriptValue('POD_jerusalem_muslim_influence_passive')|=2]% musulmán#!#!, #TOOLTIP:POD_jerusalem_tt_christian #L;V [GetPlayer.MakeScope.ScriptValue('POD_jerusalem_christian_influence_passive')|=2]% cristiano#!#! y #TOOLTIP:POD_jerusalem_tt_jewish #L;V [GetPlayer.MakeScope.ScriptValue('POD_jerusalem_jewish_influence_passive')|=2]% judío#!#!, tendiendo siempre hacia los valores de equilibrio de #V [GetPlayer.MakeScope.ScriptValue('POD_jerusalem_equilibrium_muslim_influence')|0]%#! musulmán, #V [GetPlayer.MakeScope.ScriptValue('POD_jerusalem_equilibrium_christian_influence')|0]%#! cristiano y #V [GetPlayer.MakeScope.ScriptValue('POD_jerusalem_equilibrium_jewish_influence')|0]%#! judío. Recuerda que los equilibrios cambian a medida que varían los poderes mortales y la población."
