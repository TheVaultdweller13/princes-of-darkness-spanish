 setites_corrupt_hunters_decision: "El silencioso enroscarse de la Serpiente"
 setites_corrupt_hunters_decision_desc: "Hace mucho que los Cazadores nos importunan: refuerzan la prisión erigida por los Eones de Ra y exterminan a quienes buscan escapar de ella. Están tan desesperados por la aprobación de su supuesto «Dios».\n\nPodríamos aprovechar la inusual locura que rodea Jerusalén y servirnos de su importancia como lugar santo para redirigir el fervor de esos Cazadores. Algunos de ellos ya aceptan la magia y prometen hondos misterios a sus miembros. Podemos limitarnos a insertar algunas ideas más «liberadoras», redirigir sus misterios hacia Set e infiltrarnos en sus pintorescas «células». Pronto su fanatismo y sus armas servirán a Set."
 setites_corrupt_hunters_decision_confirm: "Bienvenidos, hermanos míos"
 setites_corrupt_hunters_decision_tooltip: "Los Cazadores malgastan demasiados recursos en su supuesto «Dios», recursos que servirían mejor para cumplir los propósitos de Set."
 setites_corrupt_hunters_decision_effect: "Los $POD_splat_hunter_plural$ dejarán de ver a los Vampiros, y en especial a los Setitas, como un enemigo irreconciliable. En su lugar, se os verá como ángeles, profetas, taumaturgos y santos"
 setites_corrupt_hunters_decision_holy_city_jerusalem_requirement_tooltip: "Debes controlar y convertir la ciudad de [GetTitleByKey('c_jerusalem').GetNameNoTier], pues es el lugar santo fundamental de las fes abrahámicas, lo que aumenta tu influencia sobre los cazadores"
 setites_corrupt_hunters_decision_holy_city_mecca_requirement_tooltip: "Debes controlar y convertir la ciudad de [GetTitleByKey('c_mecca').GetNameNoTier], pues es el lugar santo fundamental de las fes abrahámicas, lo que aumenta tu influencia sobre los cazadores"
 setites_corrupt_hunters_decision_holy_city_constantinople_requirement_tooltip: "Debes controlar y convertir la ciudad de [GetTitleByKey('c_byzantion').GetNameNoTier], pues es el lugar santo fundamental de las fes abrahámicas, lo que aumenta tu influencia sobre los cazadores"
 setites_corrupt_hunters_decision_holy_city_rome_requirement_tooltip: "Debes controlar y convertir la ciudad de [GetTitleByKey('c_roma').GetNameNoTier], pues es el lugar santo fundamental de las fes abrahámicas, lo que aumenta tu influencia sobre los cazadores"
 demons_temptation_revelry_decision: "Regodearte en tu depravación"
 demons_temptation_revelry_decision_desc: "A medida que abrazas más a fondo tu pecaminosa depravación, ecos psíquicos se extienden entre la población que rodea Jerusalén y la tientan hacia abismos similares. Cada pecado se convierte en adoración de tu glorioso ser. Cada caída fortalece tu dominio sobre esta supuesta Tierra Santa. Con el tiempo conocerán tu verdadero poder y llamarán a este lugar por su nombre adecuado, uno que te honre como mereces: la Tierra Infernal."
 demons_temptation_revelry_decision_confirm: "¡Todos me servirán!"
 demons_temptation_revelry_decision_tooltip: "Canalizaré los ecos de esta tierra para mis propios fines"
 demons_temptation_revelry_decision_effect: "Si el objetivo de tu [character_interaction|E] «$POD_read_the_heart_interaction$» tiene un [trait|E] correspondiente a #bold cualquier#! pecado, se convertirá a tu [faith|E]"
 salubri_saulots_plans_decision: "Los planes de Saulot"
 salubri_saulots_plans_decision_desc: "Al margen de los esfuerzos de los Usurpadores, nuestro fundador, Saulot, tenía muchos planes e intenciones. Por razones que ninguno de nosotros ha comprendido, muchos de ellos tenían que ver con Jerusalén. Quizá fue la oscura presencia que duerme cerca lo que atrajo su atención. Quizá fue la manía religiosa que consume esta región. Quizá fue su eterna búsqueda del centro del mundo, el punto en torno al cual parecían girar todos los acontecimientos y toda la política. Quizá lo encontró en Jerusalén, dentro de las tierras veneradas por tantos, cerca de tantas otras ciudades grandes e importantes. Sea como fuere, tenemos la posibilidad de cumplir uno de sus objetivos y cosechar las recompensas que buscaba."
 salubri_saulots_plans_decision_confirm: "Sus planes darán fruto"
 salubri_saulots_plans_decision_tooltip: "Saulot tenía un plan para Jerusalén. Deberíamos completarlo, fuera cual fuese."
 salubri_saulots_plans_decision.second_step: "Su plan era..."
