 salubri_saulots_plans_decision.tt.warrior_route: "Exterminar la mancha"
 salubri_saulots_plans_decision.tt.warrior_route_desc: "Cosas oscuras acechan bajo Jerusalén. Aunque ellas mismas escapan a nuestro alcance, podríamos exterminar a los cinco vampiros contaminados por su influencia, aquellos que hoy solo se conocen por el número que repiten sin fin. Sin duda la mancha volverá con el tiempo, pero nos dará paz durante un tiempo."
 warrior_route_tooltip: "#bold $salubri_saulots_plans_decision.tt.warrior_route$#!\n\n#weak $salubri_saulots_plans_decision.tt.warrior_route_desc$#!"
 salubri_saulots_plans_decision.tt.healer_route: "Calmar lo que duerme"
 salubri_saulots_plans_decision.tt.healer_route_desc: "Una oscuridad y una locura engullen Jerusalén, cosas malignas despertadas por sucesos recientes. Si se las arrullara para que volvieran a dormirse, quizá regresaría la paz a este lugar atribulado y la tierra podría empezar a sanar."
 healer_route_tooltip: "#bold $salubri_saulots_plans_decision.tt.healer_route$#!\n\n#weak $salubri_saulots_plans_decision.tt.healer_route_desc$#!"
 salubri_saulots_plans_decision.tt.watcher_route: "Robar a la oscuridad"
 salubri_saulots_plans_decision.tt.watcher_route_desc: "Algo duerme bajo Jerusalén y ejerce su influencia sobre los mortales e incluso sobre los vampiros. Los Baali infernalistas y los Malkavian enloquecidos parecen particularmente afectados e interesados, así que quizá guarden pistas de los secretos más profundos. Podríamos dar a esos secretos y poderes un uso mucho mejor."
 watcher_route_tooltip: "#bold $salubri_saulots_plans_decision.tt.watcher_route$#!\n\n#weak $salubri_saulots_plans_decision.tt.watcher_route_desc$#!"
 freed_from_taint_modifier: "Libre de la mancha"
 freed_from_taint_modifier_desc: "Las marionetas de la mancha infernal han sido exterminadas, lo que libera temporalmente la tierra de su influencia directa."
 soothed_mania_modifier: "Manía calmada"
 soothed_mania_modifier_desc: "A medida que la manía religiosa se aplaca, la tierra se recupera y la ciudad se estabiliza."










 jerusalem_shift_balance_of_power_decision: "Cambiar el equilibrio de poder de Jerusalén"
 jerusalem_shift_balance_of_power_decision_desc: "La [grand_city|E] de [holy_jerusalem|E] se equilibra en el filo de una navaja, tambaleándose entre las tres principales facciones religiosas. Judíos, cristianos y musulmanes luchan constantemente por un mayor control dentro de su ciudad santa. Sus contrapartes sobrenaturales se involucran con frecuencia en estos conflictos por un motivo u otro. Si dispones de los recursos, podrías inclinar la balanza del poder a favor de tu facción preferida, o podrías intentar mantener el equilibrio."
