 jerusalem_recover_ark_covenant_decision: "Recuperar el Arca"
 jerusalem_recover_ark_covenant_decision_desc: "«Entonces los sacerdotes llevaron el arca de la alianza del Señor a su lugar, en el santuario interior de la casa, en el Lugar Santísimo, bajo las alas de los querubines. Pues los querubines extendían sus alas sobre el lugar del arca, de modo que los querubines cubrían el arca y sus varas. Y las varas eran tan largas que sus extremos se veían desde el Lugar Santo, delante del santuario interior, pero no se veían desde fuera. Y allí están hasta hoy. En el arca no había nada, salvo las dos tablas de piedra que Moisés puso allí en Horeb, donde el Señor hizo alianza con los hijos de Israel cuando salieron de la tierra de Egipto.»\n\nAy, la mayor de las desdichas, pues el Lugar Santísimo debe ser reconstruido y el Arca ya no está allí. Esta tragedia debe ser corregida si hemos de reconstruir el Templo."
 jerusalem_recover_ark_covenant_decision_confirm: "¡Una vez más, reposará en el Lugar Santísimo!"
 jerusalem_recover_ark_covenant_decision_tooltip: "La pérdida del Arca es una de las mayores tragedias e impide la reconstrucción completa del Templo. Esta tragedia debe ser corregida."
 jerusalem_recover_ark_covenant_decision_effect: "Inicia una búsqueda para recuperar el Arca de la Alianza"
 POD_jerusalem.50.t: "La búsqueda: investigar los rumores"
 POD_jerusalem.50.desc: "Innumerables relatos rodean el Arca de la Alianza, pues ni siquiera se conoce con certeza el momento de su desaparición, registrada por última vez de forma fehaciente en tiempos del rey Yoshiyyah. Ninguno de nuestros registros la menciona en el Templo de Salomón tras su muerte, ni estaba en el Templo de Zorobabel ni en el de Herodes. ¿La robaron los babilonios y se la llevaron con sus fuerzas, exhibida en templos de falsos dioses? ¿La vendió a Egipto uno de nuestros reyes infieles y acabó llegando a las Islas del Estaño? ¿Dice la verdad el dudoso Segundo Libro de los Macabeos cuando afirma que el profeta Yirmeyah ocultó el Arca en el monte Nebo? ¿Y qué hay de nuestros hermanos perdidos entre los samaritanos, que creen que el Arca está escondida en el monte Garizim? ¿Tienen razón los cristianos al decir que el hijo que la reina de Saba tuvo con Salomón se llevó el Arca consigo a Etiopía? Quizá la verdad la guarde otro relato.\n\nSi hemos de hallar el Arca, primero debemos determinar qué leyenda señala el camino."
 POD_jerusalem.50.a: "¡No escatimaremos en gastos!"
 POD_jerusalem.50.b: "¡Reunid a los eruditos!"
 POD_jerusalem.50.c: "Ha permanecido oculta durante siglos. Podemos tomarnos nuestro tiempo."
 POD_jerusalem.51.t: "La búsqueda: grandes excavaciones"
 POD_jerusalem.51.desc: "Hemos hallado la verdad en los escritos de Moshe ben Maimon, más conocido como el rabino Maimónides. En su sabiduría, el rey Salomón previó un tiempo en que los Hijos de Abraham volverían a dar la espalda a D-os y atraerían así Su ira y la destrucción de Su morada entre ellos, el Templo. Por eso ordenó a los demonios que había ligado que construyeran bajo el Templo bóvedas en forma de laberinto donde pudiera sepultarse el Arca, de modo que no se perdiera como ocurrió antes, en tiempos del juez Elí. Como está escrito, el rey Josías dijo a los levitas que colocaran el Arca Santa en la cámara construida por Salomón, protegiéndola así de los babilonios. En tiempos de Zorobabel se descubrió el escondite del Arca, pero D-os ocultó su ubicación, pues aún no había llegado el momento oportuno. Porque se dice: «Una vez, un sacerdote del segundo Templo vio un bloque de pavimento distinto del resto del suelo y comprendió que allí había una entrada a un túnel subterráneo, y se lo contó a un amigo. Antes de que pudiera terminar de contárselo, su vida lo abandonó. Entonces supieron con certeza que aquel era el lugar donde yacía oculta el Arca.»\n\nAunque el Arca quizá repose bajo el Monte del Templo, hay innumerables cuevas, muchas selladas o perdidas desde aquellos días. Sin excavaciones masivas de toda la zona, será casi imposible descubrir las bóvedas de Salomón."
 POD_jerusalem.51.a: "No hay otra opción."
 POD_jerusalem.51.b: "La magia facilitará la búsqueda."
 rioting_city_modifier: "Disturbios en toda la ciudad"
 rioting_city_modifier_desc: "Tus actos han soliviantado a la población"
 POD_jerusalem.52.t: "La búsqueda: una gran batalla"
 POD_jerusalem.52.desc: "Tras atravesar muchos muros de piedra, topas con una barrera casi invencible que ninguna de tus herramientas ni de tus magias logra romper. Excavando a su alrededor, descubres una barrera pequeña y perfectamente circular, hecha de una piedra cuyo color parece ligeramente distinto de la roca que la rodea, un color que se estira en los bordes de tu vista, un color que se derrama en el aire, un color más allá de la comprensión y, sin embargo, perfectamente natural. Solo existe una imperfección, una única puerta que conduce al interior.\n\nAl abrir la puerta y cruzarla, te das la vuelta y ves que nadie más puede pasar: todos chocan contra un muro invisible. Aceptando que este es un desafío que deberás afrontar a solas, te vuelves hacia los amplios salones que se extienden ante ti, mucho más allá de lo que cabría en este espacio. Bóvedas de crucería sostienen incontables toneladas de roca y de gente que camina sobre tu cabeza. En verdad, estas son las bóvedas de las que hablan el Talmud y la Mishná.\n\nTras vagar durante un tiempo, llegas a una gran mesa. Sobre ella hay pequeñas estatuas de soldados con armas y estandartes, varios cientos con la Estrella de David y varios miles con una simple lanza. Unas instrucciones en el lateral de la mesa dicen que, una vez comience la batalla, podrás dar órdenes a tus tropas y que tu objetivo es llevarlas a la victoria. Tras algunos ensayos, descubres que por ahora puedes retirar y recolocar las que llevan la estrella, lo que te permite prepararte antes de que empiece el combate. La batalla tendrá lugar en las llanuras, mientras asaltas a las fuerzas enemigas. ¿Qué estrategia debes emplear para asegurar la victoria?"
 POD_jerusalem.52.a: "Realizar un ataque en pinza para envolverlos"
 POD_jerusalem.52.b: "Fingir una retirada para atraerlos"
 POD_jerusalem.52.c: "Reunirlos para abrir una brecha en un punto central"
 POD_jerusalem.52.d: "Ordenar que la mayoría rece y atacar solo con una fracción"
 POD_jerusalem.52.effect.success: "Una luz divina aniquila al enemigo"
 POD_jerusalem.52.effect.failure: "Tus fuerzas son arrolladas"
 POD_jerusalem.53.t: "La búsqueda: Su Palabra"
 POD_jerusalem.53.desc: "Mientras las piezas de la mesa se desvanecen, alzas la vista y ves a 3 hombres de pie a su alrededor. Cada uno lleva una barba larga pero cuidada y viste túnicas blancas. Son casi indistinguibles entre sí, aunque enseguida te concentras de nuevo cuando los 3 empiezan a hablar a la vez. A pesar de que las voces se solapan, son por completo distintas. «Uno de nosotros es el representante del Señor, pues el Señor es uno. Formula tus preguntas, 3, y cada uno de nosotros responderá a su turno. Contrasta cada respuesta con las palabras ya dadas, pues Él ha hablado y Su palabra permanecerá para siempre.» Tras meditarlo con cuidado, eliges tres preguntas que crees que revelarán la verdad.\n\nTú: «¿Cuál es el mayor atributo de D-os?»\nPrimera Voz: «Su santidad, mostrada en el juicio, pues está dicho: el Se-ñor nuestro D-os es fuego consumidor.»\nSegunda Voz: «El Se-ñor es D-os; no hay otro fuera de Él. Es bueno. Es santo. Es infinito. Es.»\nTercera Voz: «Dad gracias al Se-ñor, porque su amor firme perdura para siempre. Poco importa nada más allá de su amor.»\n\nTú: «¿Qué agrada más a D-os: el sacrificio o la obediencia?»\nPrimera Voz: «Se nos dieron los Diez Mandamientos, y no cumplirlos exige sacrificio para repararlo.»\nSegunda Voz: «¿Acaso se complace el Se-ñor tanto en holocaustos y sacrificios como en que se obedezca su voz? Obedecer es mejor que el sacrificio.»\nTercera Voz: «¿No está escrito: "Porque deseo amor firme y no sacrificio"? Ni el sacrificio ni la obediencia le complacen.»\n\nTú: «¿Por qué disciplina D-os a su pueblo?»\nPrimera Voz: «¿No le dijo al profeta Isaías: "Yo, el Se-ñor, amo la justicia; aborrezco el robo y la iniquidad"? Simplemente sufren Su ira y Su castigo.»\nSegunda Voz: «Como está escrito: "Reconoce, pues, en tu corazón que, como un hombre disciplina a su hijo, el Se-ñor tu D-os te disciplina." Toda disciplina es justa y su propósito es corregir y restaurar.»\nTercera Voz: «Como un padre se compadece de sus hijos, así se compadece el Se-ñor. Cualquier dificultad es mera apariencia.»\n\nHabiendo formulado tus tres preguntas, ¿quién es el representante del Señor?"
 POD_jerusalem.53.a: "Primera Voz"
 POD_jerusalem.53.b: "Segunda Voz"
 POD_jerusalem.53.c: "Tercera Voz"
 POD_jerusalem.53.effect.success: "Una elección sabia"
 POD_jerusalem.53.effect.failure: "Atiende siempre al contexto"
 POD_jerusalem.54.t: "La búsqueda: el Vigía"
 POD_jerusalem.54.desc: "Con sus últimas palabras aún resonando por la sala, sus formas se desvanecen en motas de luz que giran en círculo antes de fundirse en una sola partícula, un punto brillante y luminoso. Entonces el punto se expande y crece, adquiere dimensiones y brazos y toma una forma más humanoide. Al final, se concreta en un hombre. No parece viejo por su aspecto, sino por sus ojos, su porte, el peso de su presencia. Unos ojos castaños centellean en un rostro de barba poblada, con muy pocas canas. Su túnica, de un azul tan claro que casi es blanco, es sencilla y de confección casera, limpia pero vieja, raída y a la vez fiable.\n«Soy Ahikam de los Tzaddikim. Un amigo cercano me encomendó proteger la reliquia más preciada puesta a su cuidado, una que sospecho que buscas.»\n\nTe estudia en silencio, con una mirada que ve mucho más y mucho más hondo de lo que debería.\n«He montado esta guardia durante muchos días y he visto a muchos intentar hallar lo que custodio. Conquistadores que se imaginaban elegidos. Sacerdotes que confundían el ritual con la sabiduría. Eruditos que creían que todo misterio podía reducirse a tinta sobre pergamino. Algunos vinieron con el corazón puro, otros con ambición egoísta. Cada uno se creía digno donde sus antepasados no lo fueron. Cada uno se equivocaba. Ni siquiera la construcción de nuevos templos les dio derecho a reclamar lo perdido, pues lo que de verdad se había perdido no se había recuperado. Tu prueba final es sencilla. Recurre a todas tus capacidades dialécticas, a todas tus hazañas de fe, a todos tus grandes logros y convénceme.»"
 POD_jerusalem.54.a: "Ojalá mi sabiduría baste."
 POD_jerusalem.54.effect.success: "Hay sabiduría en tus palabras"
 POD_jerusalem.54.effect.failure: "Como tantos otros..."
 POD_jerusalem.55.t: "La búsqueda: la recuperación del Arca"
 POD_jerusalem.55.desc: "El rostro de Ahikam sigue siendo indescifrable. Busca engaño, negación o autoengaño. Pasado un largo rato, una leve sonrisa le levanta las comisuras de la boca.\n\n«Me alegra el corazón ver que los tiempos por fin han cambiado, que ha surgido un pueblo que volverá a asumir la alianza en plenitud y en verdad, que reconstruirá el templo, que será guiado por un líder justo. Durante generaciones incontables permanecí porque el encargo que se me confió seguía inconcluso. Ahora... ahora puedo volver a casa. Pero, antes de irme, sabe esto por encima de todo: el Arca se conservó porque los hombres necesitan recordatorios. La alianza perduró porque D-os no necesitaba ninguno. Ahora, ese recordatorio puede reposar de nuevo entre los fieles.»\n\nAntes de que puedas responder, Ahikam alza una mano abierta, con una suave sonrisa en el rostro. La luz florece desde su mano y engulle la cámara, las paredes, el suelo. Por un instante solo hay resplandor. Luego... gente. De nuevo entre el equipo de excavación, el muro de piedra que antes te detenía y la puerta que había en él han desaparecido. En su lugar, lejos de donde nadie pueda tocarla por accidente, hay un cofre de madera de acacia, decorado con amor con oro. En cuatro anillas de su base descansan dos varas de madera. Sobre la tapa, dos querubines alados."
 POD_jerusalem.55.a: "¡El Arca!"
 POD_jerusalem.55.a.tt: "Obtendrás $artifact_pod_ark_of_covenant_name$"
 pod_is_jewish_trigger: "Debe ser seguidor de una [jewish_derived_faiths|E]"
 fervor_recovered_ark: "Recuperada $artifact_pod_ark_of_covenant_name$"
 POD_jerusalem.56.t: "La búsqueda: la alianza de otro tiempo"
 POD_jerusalem.56.desc: "El rostro de Ahikam sigue siendo indescifrable. Pasado un largo rato, cierra los ojos y suspira. No hay ira ni decepción en su mirada. Solo la melancolía de un hombre cuyo deber aún no ha terminado, de un hombre que ha presenciado el mismo fracaso incontables veces.\n\n«Has respondido como todos los demás, con gran convicción. Has reunido conocimiento, desentrañado misterios y recorrido distancias imposibles. Sin embargo, el Arca es solo el símbolo y el recordatorio de una alianza. No eres el único al que debo poner a prueba, y el Arca no es un premio que se gane superando un desafío. Por desgracia, mi guardia aún no ha terminado.»\n\nAntes de que puedas responder, Ahikam alza una mano abierta. La luz florece desde ella y engulle la cámara, las paredes, el suelo. Por un instante solo hay resplandor. Luego... roca. De nuevo entre el equipo de excavación, lo único que ves es un muro de piedra intacto."
 POD_jerusalem.56.a: "¡No!"