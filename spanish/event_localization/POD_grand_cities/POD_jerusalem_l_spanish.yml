 mummies_tap_web_faith_decision: "Canalizar el Corazón"
 mummies_tap_web_faith_decision_desc: "Durante mucho tiempo hemos dependido de la energía que fluye por las Tierras de la Fe. Alimenta las habilidades que usamos e infunde vitalidad a nuestros cuerpos. Dentro de sus límites, pocos esbirros de Apofis pueden derrotarnos sin ayuda. Sin embargo, esa fuerza es también nuestra mayor debilidad, pues nos impide perseguir a esos esbirros.\n\nCanalizando el Corazón de las Tierras de la Fe, podríamos ampliar nuestras áreas de operación y purgar la influencia de Apofis en tierras aún más lejanas."
 mummies_tap_web_faith_decision_confirm: "¡Las Tierras de la Fe crecerán!"
 mummies_tap_web_faith_decision_tooltip: "Demasiado tiempo hemos estado constreñidos por los límites de las Tierras de la Fe."
