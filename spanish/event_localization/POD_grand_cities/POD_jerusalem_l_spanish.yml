 POD_jerusalem.36.t: "Influencia cristiana en Jerusalén"
 POD_jerusalem.36.desc: "Durante casi dos siglos, Jerusalén ha pasado de manos de unos a otros entre las distintas facciones cristianas y musulmanas. Recientemente, la Sexta Cruzada concluyó con la exitosa toma de Jerusalén por parte de Federico II, el emperador del Sacro Imperio Romano Germánico. Además, el tratado de paz ha provocado que el sultán al-Kamil de Egipto desvíe su atención de Jerusalén hacia el emir an-Nasir Dawud de Damasco. Cinco órdenes de caballeros tienen presencia en Jerusalén para apoyar los objetivos cristianos. Tres estados cruzados proporcionan apoyo adicional desde el norte. Además, la población de la ciudad ha crecido hasta alcanzar los cien mil habitantes, lo que iguala o supera su tamaño bajo el califato fatimí, aumentando la influencia cristiana a medida que más gente se traslada a Jerusalén.\n\nLamentablemente, los cristianos se enfrentan a diversas contiendas. El Reino de Jerusalén está dividido por una guerra civil, un conflicto que se extiende incluso a las órdenes de cruzados. Más allá de eso, la tregua de Federico expirará en 1239, y no cabe duda de que los países musulmanes circundantes atacarán."
 POD_jerusalem.36.a: "@gold_icon! Apoyar a los mercaderes italianos"    #gold to strengthen
 POD_jerusalem.36.b: "@prestige_icon! Aumentar la unidad en la región" #prestige to strengthen
 POD_jerusalem.36.c: "@gold_icon! Organizar ataques selectivos"     #gold to weaken
 POD_jerusalem.36.d: "@prestige_icon! Avivar las llamas de la guerra civil"      #prestige to weaken

 POD_jerusalem.37.t: "Influencia musulmana en Jerusalén"
 POD_jerusalem.37.desc: "Durante casi dos siglos, Jerusalén ha pasado de manos de unos a otros entre las distintas facciones cristianas y musulmanas. Recientemente, la Sexta Cruzada concluyó con la exitosa toma de Jerusalén por parte de Federico II, el emperador del Sacro Imperio Romano Germánico. Aunque el gobierno de la ciudad se perdió temporalmente, el tratado garantizó el derecho de los musulmanes a continuar su culto. Tras la caída de Jerusalén en 1244 ante el Imperio Corasmio, no volverá a caer en manos musulmanas durante siglos. Incluso antes de eso, tanto los gobernantes como los habitantes mortales y sobrenaturales de esta región son predominantemente musulmanes.\n\nSin embargo, en este momento, Jerusalén está controlada por mortales cristianos. Los sultanes y emires musulmanes luchan entre sí, y la incursión mongola de 1260 debilitará aún más la influencia musulmana en la región."
 POD_jerusalem.37.a: "@gold_icon! Expandir los esfuerzos de islamización"    #gold to strengthen
 POD_jerusalem.37.b: "@prestige_icon! Fomentar las incursiones de ghazwa"         #prestige to strengthen
 POD_jerusalem.37.c: "@gold_icon! Distraer a los gobernantes musulmanes mortales"  #gold to weaken
 POD_jerusalem.37.d: "@prestige_icon! Expulsar a los alborotadores musulmanes"     #prestige to weaken

 POD_jerusalem.38.t: "Influencia judía en Jerusalén"
 POD_jerusalem.38.desc: "Durante casi dos siglos, Jerusalén ha pasado de manos de unos a otros entre las distintas facciones cristianas y musulmanas. Solo una cosa ha permanecido constante: muchos judíos han muerto. En las Semanas de Sangre, los cruzados cristianos masacraron y mantuvieron en cautiverio a muchos judíos. Aunque los gobernantes musulmanes han sido más tolerantes, nunca han rehuido de diezmar a la población judía. Las sinagogas y los antiguos lugares sagrados son frecuentemente reclamados, profanados o simplemente destruidos.\n\nAnte todas estas dificultades que enfrentan los judíos en Jerusalén, podrías aniquilarlos fácilmente o luchar por mantenerlos dependiendo de tus intenciones."
