l_spanish:
 
 # Nickname
 nick_scourge_of_sutekh: "el Azote de Sutekh"

 # Character Interaction
 podnagaraja_send_childe_to_enoch_interaction: "Enviar a Enoch"
 podnagaraja_send_childe_to_enoch_interaction_desc: "Envía a este miembro de la dinastía Nagaraja en un viaje sin retorno a la ciudad fantasma de Enoch en el Inframundo, donde servirá a los intereses de nuestro clan desde más allá del Velo."
 send_childe_to_enoch_effect_tooltip: "Tu chiquillo partirá hacia el Inframundo, sin regresar jamás. Ganarás un modificador y prestigio dinástico."
 send_childe_to_enoch_not_primary_heir: "No puedes enviar a tu heredero principal a Enoch"

 # ============================
 # Feature 1 Events
 # ============================

 podnagaraja.1.t: "Purga de la Serpiente"
 podnagaraja.1.desc: "Está hecho. Los últimos de los Daitya y sus primos Setitas han sido expulsados de las cortes de la India y de las tierras altas del Tíbet. Los hijos de Sutekh ya no susurrarán sus mentiras al oído de los gobernantes del subcontinente. Una nueva era despunta para los Nagaraja, una en la que nos erigimos como los dueños indiscutibles de la noche en nuestra Tierra Natal ancestral."
 podnagaraja.1.a: "Que hablen de esta victoria durante los siglos venideros."

 podnagaraja.2.desc: "Te ha llegado la noticia de que un gobernante Nagaraja ha expulsado los últimos vestigios de la influencia Setita y Daitya de la India y el Tíbet. El equilibrio de poder en la región ha cambiado drásticamente."
 podnagaraja.2.a: "Las noches están cambiando."

 # ============================
 # Feature 2 Events (Journey)
 # Events 10-21: Pilgrimage to Enoch
 # ============================

 # --- Event 10: Arrival/Setup ---
 podnagaraja.10.t: "El Velo se desgarra"
 podnagaraja.10.desc: "Los rituales se han completado, los preparativos están hechos. Mientras el Velo se desgarra ante ti como un telón de niebla fría, el Inframundo abre sus fauces. El aire se vuelve denso con susurros y la temperatura desciende a niveles que van mucho más allá del frío. El camino hacia Enoch yace ante ti: traicionero, incognoscible y lleno de cosas que incluso un Nagaraja debería temer."
 podnagaraja.10.a: "Comenzar el descenso."
 podnagaraja.10.a.tt: "Tu peregrinaje por el Inframundo comienza..."

 # --- Event 12: Entering the Shadowlands (Pool) ---
 podnagaraja.12.t: "Entrando en las Tierras de las Sombras"
 podnagaraja.12.desc: "Las [UmbraGlossary('shadowlands')] se extienden ante ti: un espejo gris del mundo que dejaste atrás, poblado por los muertos inquietos y cosas mucho peores. La frontera entre el mundo de los vivos y las profundidades del Inframundo es delgada aquí. Tu sangre Nagaraja canta en reconocimiento."
 podnagaraja.12.a: "Concéntrate en el camino."
 podnagaraja.12.b: "Abro mis sentidos a los muertos."
 podnagaraja.12.b.success: "Tus sentidos se expanden. Los muertos susurran verdades útiles"
 podnagaraja.12.b.failure: "El torrente de sensaciones espectrales te abruma momentáneamente"

 # --- Event 13: The Tempest (Pool) ---
 podnagaraja.13.t: "La Tempestad"
 podnagaraja.13.desc: "Entre las [UmbraGlossary('shadowlands')] y los confines más profundos del Inframundo se encuentra la [UmbraGlossary('tempest')]: un torbellino aullante de energía espectral que ha consumido incontables almas. Te azota con vientos que portan los gritos de los condenados. Hay formas de atravesarlo, pero ninguna es agradable."
 podnagaraja.13.a: "Avanzar con disciplina."
 podnagaraja.13.a.success: "Logras abrirte paso a través de lo peor de la tormenta"
 podnagaraja.13.a.failure: "La Tempestad te azota sin piedad"
 podnagaraja.13.b: "Usa la necromancia para calmar los vientos de los muertos."
 podnagaraja.13.b.tt: "La Necromancia avanzada garantiza el éxito"
 podnagaraja.13.b.success: "Tu maestría sobre los muertos aquieta la tormenta a tu alrededor."
 podnagaraja.13.b.failure: "Tu habilidad necromántica es insuficiente para domar la Tempestad."
 podnagaraja.13.c: "Esperar a que pase."

 # --- Event 14: Whispers of the Drowned (Pool) ---
 podnagaraja.14.t: "Susurros de los Ahogados"
 podnagaraja.14.desc: "Los Espectros se reúnen en los límites de tu percepción, atraídos por el calor de tu fuerza vital robada. Fantasmas de aquellos consumidos por los Nagaraja a lo largo de los siglos: recuerdan lo que se les hizo. Ofrecen conocimiento, advertencias, mentiras. Es imposible distinguir cuál es cuál."
 podnagaraja.14.a: "Ordénnales que me guíen."
 podnagaraja.14.a.success: "Los Espectros se doblegan ante tu voluntad y revelan caminos útiles"
 podnagaraja.14.a.failure: "Los Espectros resisten tus órdenes con rencor"
 podnagaraja.14.b: "Ignóralos y sigue adelante."
 podnagaraja.14.c: "Devora su ectoplasma para ganar fuerzas."
 podnagaraja.14.c.tt: "Sacia tu Ansia con esencia espectral"

 # --- Event 15: The False Necropolis (Pool) ---
 podnagaraja.15.t: "La Falsa Necrópolis"
 podnagaraja.15.desc: "Una vasta ciudad surge de la niebla espectral: torres, murallas y puertas que parecen increíblemente antiguas. Por un momento, tu sangre late con reconocimiento. ¿Enoch? No. Algo va mal. Las proporciones son sutilmente erróneas, la arquitectura una falsificación convincente. Esto es una trampa, construida para atrapar a los peregrinos que no conocen la verdadera ciudad."
 podnagaraja.15.a: "Investigar con cautela; puede haber restos útiles."
 podnagaraja.15.a.success: "Entre los escombros, encuentras un diario dejado por un peregrino anterior"
 podnagaraja.15.a.failure: "Las defensas de la ciudad falsa te pillan desprevenido"
 podnagaraja.15.b: "Evitarla por completo."
 podnagaraja.15.c: "Destruirla para que ningún otro Nagaraja caiga en este truco."

 # --- Event 16: A Spectral Anomaly (Pool) ---
 podnagaraja.16.t: "Una Anomalía Espectral"
 podnagaraja.16.desc: "Una bolsa de energía pura del Inframundo bloquea el camino; un vórtice agitado de fuerza espectral que deforma el tejido mismo de las Tierras de las Sombras a su alrededor. Los muertos evitan este lugar. Incluso los wraiths le dan una amplia distancia."
 podnagaraja.16.a: "Atravesarlo."
 podnagaraja.16.a.success: "La energía te sacude, pero te deja más fuerte"
 podnagaraja.16.a.failure: "La anomalía desgarra tu esencia"
 podnagaraja.16.b: "Da la vuelta."
 podnagaraja.16.c: "Estudia la anomalía desde una distancia segura."
 podnagaraja.16.c.success: "Obtienes información sobre la naturaleza del Inframundo"
 podnagaraja.16.c.failure: "La anomalía desafía toda comprensión"

 # --- Event 17: The Wraith Market (Pool) ---
 podnagaraja.17.t: "El Mercado de los wraiths"
 podnagaraja.17.desc: "Una reunión de wraiths comercian entre ellos en un vacío entre los vientos de la Tempestad. Negocian con recuerdos, remordimientos y fragmentos del mundo de los vivos. Algunos de ellos han estado aquí desde antes de la caída de Roma. Te observan con una mezcla de miedo y Ansia; los Nagaraja son conocidos por los muertos."
 podnagaraja.17.a: "Cambia oro por información."
 podnagaraja.17.b: "Devora a uno de ellos."
 podnagaraja.17.b.tt: "Sacia tu Ansia, pero los muertos lo recordarán"
 podnagaraja.17.c: "Ignóralos y sigue adelante."

 # --- Event 18: Echoes of the Silk Road (Pool) ---
 podnagaraja.18.t: "Ecos de la Ruta de la Seda"
 podnagaraja.18.desc: "El Camino pasa por el eco espectral de una ciudad destruida de la Ruta de la Seda. Mercaderes fantasmales siguen ofreciendo sus mercancías en un bucle infinito, sin saber que ellos y su ciudad perecieron hace siglos. Los edificios brillan con una grandeza desvanecida y, en algún lugar profundo de las ruinas, algo antiguo aguarda."
 podnagaraja.18.a: "Busca conocimiento oculto entre las ruinas."
 podnagaraja.18.a.success: "Descubres saberes olvidados entre las ruinas espectrales"
 podnagaraja.18.a.failure: "Las ruinas no ofrecen más que polvo y decepción"
 podnagaraja.18.b: "Investiga a los habitantes fantasmales."
 podnagaraja.18.b.success: "Los fantasmas comparten recuerdos de dinastías olvidadas hace mucho tiempo"
 podnagaraja.18.b.failure: "Los fantasmas retroceden ante tu Presencia"
 podnagaraja.18.c: "Registraré lo que vea y seguiré adelante."

 # --- Event 19: A Fellow Traveler (Pool) ---
 podnagaraja.19.t: "Una compañera de Viaje"
 podnagaraja.19.desc: "Una figura emerge de la niebla espectral: otra Nagaraja que regresa de Enoch en una Misión de la Tal'Mahe'Ra. Está demacrada, con los ojos hundidos por el Viaje, pero se desenvuelve con la serena confianza de quien ha sobrevivido a las profundidades del Inframundo. Se ofrece a compartir información."
 podnagaraja.19.a: "Compartir información libremente; somos parientes."
 podnagaraja.19.a.tt: "Existe un pequeño riesgo de que no sea lo que parece"
 podnagaraja.19.b: "Intercambia información por información."
 podnagaraja.19.b.success: "Un intercambio justo. Aprendes cosas de valor"
 podnagaraja.19.b.failure: "No te da nada útil"
 podnagaraja.19.c: "Rechaza su compañía; viajo solo."
 podnagaraja.19.d: "Parece tener Ansia; ofrécele compartir mis suministros de Viscus."
 podnagaraja.19.d.tt: "Tu generosidad será recordada por el clan"

 # --- Event 20: Gates of Enoch (Final) ---
 podnagaraja.20.t: "Las Puertas de Enoch"
 podnagaraja.20.desc: "Ante ti se alzan las puertas imposiblemente antiguas de Enoch, la Primera Ciudad, ahora un fantasma de su antigua gloria en las profundidades del Inframundo. El aire vibra con un poder más antiguo que la historia registrada. Este es un lugar donde los límites entre la vida y la muerte, el conocimiento y la locura, se disuelven por completo. Te encuentras ante el umbral del mayor misterio que los Nagaraja han conocido jamás. Los siervos del Del'Roh observan desde las sombras, midiendo tu valía."
 podnagaraja.20.a: "Entra y rinde respeto al Del'Roh."
 podnagaraja.20.a.tt: "Ganarás el rasgo Peregrino de Enoch, prestigio y prestigio dinástico"
 podnagaraja.20.b: "Entra y estudia las bibliotecas de Brujah."
 podnagaraja.20.c: "Permanece en Enoch y sirve."
 podnagaraja.20.c.tt: "Entrarás en Letargo, ganarás el rasgo Peregrino de Enoch y obtendrás un gran prestigio dinástico"

 # --- Event 21: Fellow Traveler Spy Follow-up ---
 podnagaraja.21.t: "Una traición en las sombras"
 podnagaraja.21.desc: "Algo va mal. La información que compartiste con la compañera de Viaje ha aparecido en lugares donde no debería haber estado. O bien ella no era quien decía ser, o bien vendió tus secretos a otros. El Daño puede estar ya hecho."
 podnagaraja.21.a: "Investiga la traición."
 podnagaraja.21.a.success: "Detectas el engaño antes de que se cause un daño real"
 podnagaraja.21.a.failure: "Tus secretos ya se han difundido. El daño es real"
 podnagaraja.21.b: "Déjalo pasar; algo de información es prescindible."

 # ============================
 # Feature 4 Events
 # ============================

 podnagaraja.100.t: "Preparativos"
 podnagaraja.100.desc: "El Cónclave Silencioso requiere una preparación cuidadosa. Se deben enviar mensajes a través de canales que ni siquiera otros vampiros puedan rastrear, reunir materiales rituales del [UmbraGlossaryLocalized('shadowlands','Inframundo')] e identificar un lugar seguro. La tarea es tediosa pero necesaria."
 podnagaraja.100.a: "Comenzar los preparativos."
 podnagaraja.100.a.tt: "El cónclave se reunirá en un mes"

 podnagaraja.101.t: "La Reunión"
 podnagaraja.101.desc: "Llegan uno a uno, emergiendo de las sombras y cruzando el Velo mismo. Tus compañeros Nagaraja, cada uno portando secretos y conocimientos de sus propios dominios. El Cónclave Silencioso ha sido convocado. La pregunta es: ¿cuál será su objetivo?"
 podnagaraja.101.a: "Centrarse en asuntos de intriga y protección."
 podnagaraja.101.a.tt: "El cónclave discutirá métodos de defensa y subterfugio"
 podnagaraja.101.b: "Centrarse en estudios nigrománticos y rituales."
 podnagaraja.101.b.tt: "El cónclave explorará misterios más profundos de la muerte"

 podnagaraja.102.t: "La Ofrenda"
 podnagaraja.102.desc: "En el corazón de cada Cónclave Silencioso reside la Ofrenda: un ritual que aprovecha la conexión única de los Nagaraja con el Inframundo. Se debe ofrecer carne para alimentar el rito, como es la costumbre de nuestro clan."
 podnagaraja.102.a: "Ofrecer libre y generosamente."
 podnagaraja.102.b: "Hacer solo una ofrenda simbólica."

 podnagaraja.103.t: "Descubrimiento"
 podnagaraja.103.desc: "El cónclave ha llamado la atención. Alguien —mortal o de otro tipo— ha notado la reunión y puede haber presenciado cosas que deberían permanecer ocultas. Se debe lidiar con las pruebas antes de que la Mascarada se vea más comprometida."
 podnagaraja.103.a: "Pagar para cubrir nuestros rastros."
 podnagaraja.103.a.tt: "Gastar oro para eliminar las pruebas"
 podnagaraja.103.b: "Dispersarse y esperar lo mejor."

 # ============================
 # Feature 6 Events
 # ============================

 podnagaraja.200.t: "El Practicante Itarajana"
 podnagaraja.200.desc: "Las noticias sobre tu búsqueda de un hechicero Itarajana han dado frutos. Se ha localizado a un practicante de la antigua tradición de Hechicería de Sangre hindú y se le ha traído ante ti. [new_sorcerer.GetHerHis|U] conocimiento de las artes místicas nativas del subcontinente podría resultar invaluable."
 podnagaraja.200.a: "Dar la bienvenida a [new_sorcerer.GetHerHim] a nuestro servicio."
 podnagaraja.200.a.tt: "[new_sorcerer.GetShortUIName|U] será [new_sorcerer.GetHerHis|U] vinculado como tu [ghoul|E] y se unirá a tu corte"

 podnagaraja.201.t: "La investigación del hechicero"
 podnagaraja.201.desc: "Tu hechicero Itarajana, [sorcerer.GetFirstName], ha estado realizando investigaciones en tu corte, profundizando en la intersección entre el misticismo hindú y las artes nigrománticas. [sorcerer.GetSheHe|U] se acerca a ti con [sorcerer.GetHerHis] hallazgos."
 podnagaraja.201.a: "Fomentar [sorcerer.GetHerHis] investigación continua."
 podnagaraja.201.b: "Explotar [sorcerer.GetHerHis] conocimiento para obtener beneficios inmediatos."

 # ============================
 # Feature 3 Events
 # ============================

 podnagaraja.300.t: "Un Viaje sin Retorno"
 podnagaraja.300.desc: "Te encuentras ante [recipient.GetFirstNameNoTooltip], tu chiquillo, preparado para enviarle al cumplimiento del deber más solemne: una peregrinación de ida a la ciudad fantasma de Enoch. Allí, servirá los intereses del clan desde el otro lado del Velo, manteniendo conexiones que los vivos no pueden."
 podnagaraja.300.a: "Ve y sirve a nuestro clan en el mundo de ultratumba."
 podnagaraja.300.a.tt: "[recipient.GetFirstNameNoTooltip] partirá hacia el Inframundo, para no volver jamás. Ganarás prestigio y serás honrado por tu dinastía."
 podnagaraja.300.b: "He cambiado de opinión."
 podnagaraja.300.b.tt: "[recipient.GetFirstNameNoTooltip] permanece en tu corte"

 # ============================
 # Feature 5 Events
 # ============================

 podnagaraja.400.t: "El riesgo del devorador de carne"
 podnagaraja.400.desc: "El Ansia corroe. No es la mera sed de sangre que aflige a los vampiros menores, sino el deseo más profundo y terrible que define a los Nagaraja: la necesidad de carne viva. La maldición exige ser saciada, y cuanto más te resistas, más peligroso será el festín final."
 podnagaraja.400.a: "Alimentarse con cuidado, acechando a una víctima con precisión."
 podnagaraja.400.b: "Alimentarse imprudentemente y saciar el Ansia por completo."
 podnagaraja.400.b.tt: "Existe el riesgo de que se descubran las pruebas de tu festín"
 podnagaraja.400.c: "Aliméntate de uno de mis ghouls en su lugar."
 podnagaraja.400.c.tt: "Seguro, pero tu Ghoul no lo agradecerá"
 podnagaraja.400.d: "Soporta el Ansia mediante pura fuerza de voluntad."

 podnagaraja.401.t: "Pruebas descubiertas"
 podnagaraja.401.desc: "Tu imprudente alimentación ha dejado rastros. Alguien ha encontrado pruebas; tal vez restos, tal vez testigos, tal vez algo peor. Las pruebas amenazan con exponer tu naturaleza monstruosa ante aquellos que nunca deberían saberlo."
 podnagaraja.401.a: "Paga para que destruyan las pruebas."
 podnagaraja.401.a.tt: "Gasta oro para hacer desaparecer el problema"
 podnagaraja.401.b: "Ignóralo y sigue adelante."
 podnagaraja.401.c: "Culpa a alguien más por el acto."
 podnagaraja.401.c.success: "Has logrado culpar con éxito a otra persona"
 podnagaraja.401.c.failure: "Tu intento de culpar a otra persona ha fallado"


 # ============================
 # Feature 1: Purge the Serpent
 # ============================

 purge_serpent_india_decision: "Purga la Serpiente de la India"
 purge_serpent_india_decision_tooltip: "Expulsa a todos los gobernantes Setita y Daitya de las cortes de la India y el Tíbet para reclamar el dominio sobre el subcontinente"
 purge_serpent_india_decision_desc: "Los seguidores de Sutekh —los Setitas y los Daitya— han entrelazado su influencia durante mucho tiempo en las cortes de la India y los monasterios del Tíbet. Como Nagaraja, nos corresponde limpiar nuestra Tierra Natal de su presencia corruptora y establecer nuestro dominio sobre el subcontinente."
 purge_serpent_india_decision_confirm: "Los Daitya conocerán el miedo"
 purge_serpent_capital_requirement: "Tu capital debe estar en [GetGeographicalRegion('world_india').GetName] o en [GetGeographicalRegion('world_tibet').GetName]"
 purge_serpent_no_setite_india: "Ningún Setita o Daitya puede poseer un condado o un título de mayor rango en [GetGeographicalRegion('world_india').GetName]"
 purge_serpent_no_setite_tibet: "Ningún Setita o Daitya puede poseer un condado o un título de mayor rango en [GetGeographicalRegion('world_tibet').GetName]"
 purge_serpent_effect_tooltip: "Serás aclamado como el Azote de Sutekh y recibirás grandes recompensas"

 # ============================
 # Feature 2: Pilgrimage to Enoch
 # ============================

 pilgrimage_to_enoch_decision: "Peregrinaje a Enoc"
 pilgrimage_to_enoch_decision_tooltip: "Viaja a través de las Tierras de las Sombras hasta la ciudad fantasma de Enoch y regresa con conocimientos prohibidos"
 pilgrimage_to_enoch_decision_desc: "La ciudad fantasma de Enoch se encuentra en lo profundo del [UmbraGlossaryLocalized('shadowlands','Inframundo')], un lugar de poder terrible y conocimiento prohibido. Con el dominio de la Necromancia y el apoyo de una [coterie|E] leal, puedes realizar el peligroso viaje hasta allí y regresar con una sabiduría que escapa a la comprensión mortal."
 pilgrimage_to_enoch_decision_confirm: "Hacia las Tierras de las Sombras"
 pilgrimage_to_enoch_effect_tooltip: "Comienza un [journey|E] a la ciudad fantasma de Enoch en el Inframundo"

 # ============================
 # Feature 4: Silent Conclave
 # ============================

 convene_silent_conclave_decision: "Convoca un Cónclave Silencioso"
 convene_silent_conclave_decision_tooltip: "Organiza una reunión secreta de Antiguos Nagaraja para intercambiar conocimientos y realizar rituales oscuros"
 convene_silent_conclave_decision_desc: "El Cónclave Silencioso es una reunión secreta de Nagaraja, donde se intercambian conocimientos prohibidos y se realizan rituales oscuros al servicio del clan. Tales reuniones son raras, peligrosas y sumamente valiosas."
 convene_silent_conclave_decision_confirm: "Reunámonos"
 convene_silent_conclave_effect_tooltip: "Organiza una reunión secreta de Nagaraja para intercambiar conocimientos y realizar rituales oscuros"

 # ============================
 # Feature 6: Recruit Sorcerer
 # ============================

 recruit_itarajana_sorcerer_decision: "Recluta a un Hechicero Itarajana"
 recruit_itarajana_sorcerer_decision_tooltip: "Busca a un practicante de la Hechicería de Sangre Itarajana y vincúlalo como un Ghoul a tu servicio"
 recruit_itarajana_sorcerer_decision_desc: "La tradición Itarajana de Hechicería de Sangre se nutre de las prácticas místicas hindúes y es nativa del subcontinente indio. Un practicante hábil, debidamente vinculado como Ghoul, podría resultar un activo invaluable para nuestra corte."
 recruit_itarajana_sorcerer_decision_confirm: "Su conocimiento nos servirá"
 recruit_itarajana_region_requirement: "Tu capital debe estar en [GetGeographicalRegion('world_india').GetName], [GetGeographicalRegion('world_tibet').GetName], en el [GetGeographicalRegion('world_middle_east').GetName] o en el [GetGeographicalRegion('world_steppe').GetName]"
 recruit_itarajana_max_cap: "No puedes tener más de 3 #TOOLTIP:GAME_TRAIT,itarajana_sorcerer,[GetNullCharacter] #L Hechiceros Itarajana#!#! en tu corte"
 recruit_itarajana_ghoul_cap: "Ya tienes la cantidad máxima de [Concept('ghoul','Ghouls')|E] ([SCOPE.GetValue('ghoul_amount')|0])"
 recruit_itarajana_effect_tooltip: "Un [GetTrait('ghoul').GetName(GetNullCharacter)] practicante de #TOOLTIP:GAME_TRAIT,itarajana_sorcerer,[GetNullCharacter] #L Hechicería Itarajana#!#! se unirá a tu corte"