l_spanish:

 POD_fae_maintenance.1.t: "Crisálida"
 POD_fae_maintenance.1.desc: "La Crisálida es el proceso por el cual un linaje se vuelve consciente de su naturaleza feérica."
 POD_fae_maintenance.1.option.a: "Estoy despierto."
 POD_fae_maintenance.21.t: "La Fractura"
 POD_fae_maintenance.21.desc: "No pudiste evitar la Profecía.\nAl final los hilos entre el reino mortal y el [UmbraGlossary('dreaming')] se estiraron tanto que empezaron a romperse. Esta ruptura ha traído la [Glossary('Fractura','game_concept_shattering_desc')]. No solo quebró los lazos entre [UmbraGlossary('arcadia')] y la Tierra, sino que también destrozó las esperanzas de poder revertirlo.\nDebes elegir cómo afrontarlo."
 POD_fae_maintenance.21.a: "¿Y qué?"
 POD_fae_maintenance.21.b: "Adoptar la Senda Changeling y renunciar a tu inmortalidad."
 POD_fae_maintenance.21.c: "Huir a Arcadia."
 POD_fae_maintenance.21.d: "Recluirte en un Freehold" #Become a Lost One.
 POD_fae_maintenance.22.t: "La Fractura"
 POD_fae_maintenance.22.desc: "Al final los hilos que se habían estirado tanto entre el reino mortal y el [UmbraGlossary('dreaming')] empezaron a romperse. Esta ruptura es la [Glossary('Fractura','game_concept_shattering_desc')]. No solo quebró los lazos entre [UmbraGlossary('arcadia')] y la Tierra, sino que también destrozó las esperanzas de poder revertirlo."
 POD_fae_maintenance.22.a: "¿Yupi?"
 POD_fae_maintenance.31.t: "El Interregno"
 POD_fae_maintenance.31.desc: "El periodo en que casi no quedaron sidhe ni Fae Verdaderos en la Tierra, con los changelings «aguados» que quedaban teniendo que valerse por sí mismos tras los últimos estertores de la [Glossary('Fractura','game_concept_shattering_desc')] hacia el 1400 d. C., es el Interregno, pues los changelings tuvieron que descubrir cómo sobrevivir por su cuenta."
 POD_fae_maintenance.31.a: "Nuestro tiempo ha pasado."
 POD_fae_maintenance.31.b: "Nuestro tiempo ha llegado."
 POD_fae_maintenance.40.t: "Relatos"
 POD_fae_maintenance.40.desc: "$POD_fable_decision_desc$"
 POD_fae_maintenance.40.a: "Relato del Heraldo"
 POD_fae_maintenance.40.a.tt: "Para mejorar este relato, tendrás que completar muchos contratos de [diplomacy|E] y aumentar tu [prestige_level|E]. A cambio, desbloquearás poco a poco la [domicile_building_upgrade|E] [GetDomicileBuilding('fae_the_appearance_legendary_01').GetName] y sus siguientes niveles con cada avance del Relato."
 POD_fae_maintenance.40.b: "Relato del Mariscal"
 POD_fae_maintenance.40.b.tt: "Para mejorar este relato, tendrás que completar muchos contratos [martial|E] y ganar muchas batallas como [commander|E]. A cambio, desbloquearás poco a poco la [domicile_building_upgrade|E] [GetDomicileBuilding('fae_the_interior_training_ground_of_marshal_01').GetName] y sus siguientes niveles con cada avance del Relato."
 POD_fae_maintenance.40.c: "Relato del Senescal"
 POD_fae_maintenance.40.c.tt: "Para mejorar este relato, tendrás que completar muchos contratos de [stewardship|E] y amasar una gran cantidad de [gold|E]. A cambio, desbloquearás poco a poco la [domicile_building_upgrade|E] [GetDomicileBuilding('fae_the_appearance_perfect_01').GetName] y sus siguientes niveles con cada avance del Relato."
 POD_fae_maintenance.40.d: "Relato de la Sombra"
 POD_fae_maintenance.40.d.tt: "Para mejorar este relato, tendrás que completar muchos contratos de [intrigue|E] y tener éxito en muchas [hostile_schemes|E]. A cambio, desbloquearás poco a poco la [domicile_building_upgrade|E] [GetDomicileBuilding('fae_the_atmosphere_oppressive_01').GetName] y sus siguientes niveles con cada avance del Relato."
 POD_fae_maintenance.40.e: "Relato del Sabio"
 POD_fae_maintenance.40.e.tt: "Para mejorar este relato, tendrás que completar muchos contratos de [learning|E] y enseñar muchos puntos de [perk|E] a otros [characters|E]. A cambio, desbloquearás poco a poco la [domicile_building_upgrade|E] [GetDomicileBuilding('fae_the_interior_library_of_the_sage_01').GetName] y sus siguientes niveles con cada avance del Relato."
