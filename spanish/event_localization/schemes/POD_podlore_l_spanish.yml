# Folklore Fae

# Fedlimid became Maine Athramail ("like his father") https://en.wikipedia.org/wiki/Medb#Medb's_7_Sons
 POD_podlore.100.desc.POD_fae_character_203: "Maeve y Ailill tuvieron siete hijos, todos llamados Maine. Originalmente todos tenían otros nombres, pero cuando Maeve le preguntó a un druida cuál de sus hijos mataría a Conchobar, él respondió: 'Maine'. Ella no tenía un hijo llamado Maine, así que renombró a todos sus hijos. Fedlimid se convirtió en Maine Athramail ('como su padre')."
 POD_podlore.100.t.POD_fae_character_203: "Folclore: Fedlimid"

