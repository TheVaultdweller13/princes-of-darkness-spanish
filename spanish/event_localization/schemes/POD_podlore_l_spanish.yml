 POD_persistentpodlore.1.t: "Saber: [target.GetFirstNameNoTooltip]"
 POD_persistentpodlore.1.desc: "[Localize(Concatenate('POD_persistentpodlore.desc.',target.GetHistoryId))]"

 POD_persistentpodlore.desc.793278: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nA lo largo de la historia mongola, era habitual que muchos de sus miembros menos valorados fueran enviados al exilio en imperios vecinos. Para muchos, esto era algo horrible: ser expulsado de su hogar. Pero para Batbaybar, no pudo haber sido más feliz. Desde su juventud, Batbaybar sintió un gran y profundo aprecio por las artes. Empezando por la fabricación de arcos y la pluma, prefería pasar su tiempo tejiendo tapices y tallando que cazando. Estaba tan absorto en sus artes que, cuando su comunidad fue atacada y un guerrero irrumpió en su yurt para matarlo, la batalla se perdió pero él, tan inmerso en su oficio, ni siquiera se había dado cuenta. Logró escapar con éxito y huyó hacia el suroeste, hacia la meseta iraní. Allí quedó prendado de sus obras y practicó con entusiasmo su habilidad como artesano. Fue aquí donde llamó la atención de los Banu Haqim y fue acogido en su seno como miembro de los Visires.\n\nBatbaybar es la viva imagen del frenesí creativo que atrapa a los Visires. Pero ahora sus obras se han visto interrumpidas. A medida que los mongoles avanzan en el corazón de Irán, está aterrorizado por la destrucción que algunos de sus generales están provocando. Y lo que es peor, los [Glossary('Anda','podgloss.anda')] cabalgan en su sombra. Batbaybar odia su marcha y quiere preservar esas grandes obras. Por ello, ha decidido mantener la línea en nombre del Clan, eligiendo morir antes de permitir que los [Glossary('Anda','podgloss.anda')] destruyan las obras que tanto tiempo le ha costado proteger."
 POD_persistentpodlore.desc.793279: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nTanto en la vida como en la muerte, Navneet y el camino han sido amigos cercanos. Nacida entre exiliados dalit de la India que viajaban hacia el oeste, Aglaia estuvo entre los primeros de su gente en ver las murallas de Constantinopla. Inmediatamente rechazada y rápidamente encadenada, Navneet planeaba huir con su gente hacia el interior de Europa, si no hubiera aparecido una mujer que la saludara por la noche y le pidiera hablar de filosofía. A pesar de haber pasado su tiempo en el camino, Navneet anhelaba una Tierra Natal. Deseaba un mundo donde ella y su familia pudieran respirar tranquilamente y con libertad, sin cadenas ni cargas. Habló de los lugares que esperaba encontrar y lamentó que, si tan solo tuviera el poder para ello, los haría realidad.\nLa mujer pensó que sería una Brujah perfecta mientras Navneet hablaba de su mundo ideal.\n\nDesde su Abrazo, Navneet se ha desplazado mucho, buscando el lugar donde pudiera intentar construir la esperanza de su pueblo, ahora templada y con claridad gracias a la utopía de Cartago de la que le habló su Sire. Sin embargo, desde el ascenso del Imperio mongol, ha visto una oportunidad. Ve potencial allí, un lugar donde puede construir un paraíso en las profundidades de las estepas, un sincretismo de Cartago y el santuario que soñó para la gente que llegaría a ser llamada Romani."
 POD_persistentpodlore.desc.793280: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nNacido en el Imperio Han, en Qingyang, Fu era un joven erudito, pero más tarde pasaría a la acción buscando fama y gloria al servicio de los Han. Encontraría su gloria cuando el rey de Loulan, Angui, asesinara a varios diplomáticos. A pesar de ser un mozo de cuadra en aquel entonces, Fu fue elegido para ir a apuñalar al rey hasta matarlo, pero en su lugar propuso un plan diferente y mató a Angui engañándolo con regalos y embriagándolo, momento en el que sus guardias se encargaron inmediatamente del Rey. Concedido un título por su servicio, Fu se sintió orgulloso y se ocupó de su nuevo cargo.\nPero algo en él persistía. Extrañaba el estudio. Había encontrado su gloria, pero algo seguía atormentándolo. Quería aprender más, quería estudiar y quería ampliar sus conocimientos.\nPara su sorpresa, encontró un espíritu afín que siempre venía por la noche a hablar con él sobre la naturaleza de la muerte, cubierto con pesadas túnicas. En los últimos años de su vida mortal, eran amigos íntimos. Y cuando empezó a sucumbir a su edad, el viajero le ofreció un regalo: poder tener la vida que dejó atrás, pero en un nuevo estado. Fu aceptó y fue Abrazado por los Capadocios.\n\nDesde entonces, Fu se ha conformado principalmente con sus estudios. Sin embargo, el reciente aumento de la muerte a medida que los mongoles se expanden le ha decidido a tomar medidas más drásticas. Los mongoles le recuerdan mucho al Loulan de su propia vida y, ante las grandes perturbaciones que están causando entre los muertos, se ha decidido a actuar. Después de todo, siempre quiso ser algo más que un ratón de biblioteca. ¿Y qué es uno para un segundo rey, cuando ya puede ser asesinado tan fácilmente?"
 POD_persistentpodlore.desc.793281: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nNacido durante la marcha a través de los Urales, Temüülen era enfermizo, débil y raquítico. Desde su nacimiento, su vida en las estepas fue una constante Contienda. Siempre enfermo y abiertamente despreciado por sus compañeros, la vida de Temüülen estuvo marcada por vivir en los márgenes y ser ridiculizado abiertamente por el resto de su familia extendida. Mientras su familia formaba parte de los equipos de incursión hacia Europa, él solía ser demasiado débil físicamente para usar un arco adecuadamente y, como tal, era tratado como alguien sin valor en tales campañas.\nSin embargo, en una incursión, cometieron el error de atacar la iglesia equivocada. Por la noche, esta explotó en la oscuridad, tragándose a todos los que estaban dentro. Temüülen huyó tan rápido como pudo, y esa noche fue la peor y última de su vida. A pesar de lo imposible, lo afrontó como siempre lo había hecho. Luchando ante lo imposible y negándose a dejarse vencer y morir. Y esto impresionó al atacante, quien entonces llevó a Temüülen a los Lasombra.\nSu «educación» no hizo más que reafirmar la voluntad de sobrevivir de Temüülen, pero también su odio. Más que nada, Temüülen odiaba el sistema que siempre le veía como alguien débil. Y ahora es fuerte. Es como un dios para los mortales, y disfruta de la sensación de superioridad objetiva que ahora tiene sobre ellos. Disfruta de la corona de oscuridad colocada sobre su cabeza, y no desea nada más que hacerla eterna, para mostrar a todos aquellos que lo habían dejado de lado que es fuerte."
 POD_persistentpodlore.desc.793282: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEntre los Toreador, existen muchas formas de arte que buscan proteger. Tapices, música, esculturas, pinturas, instrumentos, arquitectura y otras innumerables formas de arte, tanto físicas como emocionales, son habituales. Pero Otgonbayar ve una belleza mucho mayor en un animal bien criado que en una simple pintura.\nEn su vida mortal, Otgonbayar era la principal cuidadora de los caballos y el ganado de su clan. Cada cruce era elección suya, y encontraba una gran satisfacción al ver cómo los rebaños y las existencias de su clan mejoraban a través de las generaciones de animales. Y tan magnífico era su propio caballo de pura raza que, durante un viaje comercial a una ciudad, una figura en la noche quedó tan cautivada por su trabajo que no pudo permitir que tal artista muriera antes de poder crear su obra maestra.\nEn general, su Abrazo no cambió mucho a Otgonbayar, porque ahora tiene todo el tiempo del mundo para perfeccionar sus ciencias y artes. Sus propios rebaños se encuentran entre los mejores del mundo, con cruces controlados durante siglos para crear la progenie perfecta. Sin embargo, mientras contempla sus perfectos rebaños, desea dar el siguiente paso. Mira hacia atrás a los humanos que la rodean y se pregunta, posiblemente, si en este tiempo de lucha se puede hacer lo mismo con el hombre..."
 POD_persistentpodlore.desc.793283: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nUna de las creaciones más esotéricas de los Pozos de Gárgolas de Ceoris, Delta, junto con las otras Gárgolas que formaban su camada, fue enviada en una expedición hacia el este para investigar a los mongoles en nombre de los Tremere. Sin embargo, durante el Viaje, su supervisor Tremere sufrió la Muerte Definitiva y Delta, junto con su camada, los guio a un lugar seguro en los Urales antes de volar más hacia el este.\nAhora libre del Vínculo de Sangre y escapada con sus compañeros jurados, Delta guarda celosamente su nueva libertad. El mundo nocturno en las estepas es un caos, y ellas poseen una habilidad única para sobrevivir en estas regiones tanto con sus alas como con su capacidad para fundirse con la tierra. Pero lo que más teme es que los Tremere busquen a esta camada perdida, sin importar lo inútil que sea encontrarlos. Así que guarda celosamente su refugio compartido, cazando juntas y sin separarse nunca. Y a medida que el caos de la [Glossary('Anda','podgloss.anda')] se acerca, se ve obligada a tomar una decisión.\n¿Continuarán escondiéndose? ¿O intentarán construir algo duradero para protegerse en su interior?"
 POD_persistentpodlore.desc.793287: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nUna de las más esotéricas de las Gárgolas de Ceoris, Omega era una creación particularmente extraña y, por razones que escapaban a su comprensión, se emparejó con Delta. Enviada con su manada hacia el este, la muerte de su supervisor Tremere ante la intervención mongola la liberó y, al no tener otro lugar a donde ir, se mantuvo cerca de Delta, acompañándola a lo más profundo de las estepas.\nOmega es el corazón de su manada, pero sobre todo es la más fanáticamente leal del grupo hacia Delta. Más allá de ser simplemente la protectora de Omega en los pozos de Gárgolas, Delta ha permitido que Omega permanezca cerca. Ella es devota y, ante la ausencia del Vínculo de Sangre, Omega se entrega aún más al Abrazo de Delta en busca de la profunda sensación de claridad y protección que esta le ofrece.\nPero Omega se preocupa por su manada. A medida que la [Glossary('Anda','podgloss.anda')] y otros Cainitas de las estepas se mueven a su alrededor, Omega le ruega a Delta que construya un lugar donde puedan esconderse no como animales, sino para gobernar como sus maestros lo hicieron alguna vez. Anhela ver una corona en la cabeza de Delta y está dispuesta a hacer cualquier cosa para que su Líder de Manada lo logre. Solo desearía que Delta lo viera de la misma manera."
 POD_persistentpodlore.desc.793289: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nJayendra nació en una época extraña para la India. Nacido como hijo de Shashigupta de los Paropamisadae, Jayendra vio cómo su hogar era amenazado por un conquistador extrañamente exitoso y desquiciado que venía del lejano oeste. Pero mientras su padre vacilaba erráticamente con respecto a Alejandro, Jayendra siempre supo que este no traería nada bueno. Contra los deseos de su padre, lideró inmediatamente a sus hombres contra los griegos, enfrentándolos donde Alejandro no estaba. En su mayor parte, tuvo éxito. Sin embargo, cuando empezaba a progresar considerablemente, fue emboscado repentinamente por la noche por una horrible criatura de la locura, que utilizaba magias horribles y la propia manía para destrozar a su ejército. No obstante, se negó a huir y, en su lugar, cargó contra la criatura a través de las llamas infernales y el diluvio de locura. Su golpe no llegó a conectar y fue derribado por ellos.\nJayendra habría muerto allí si no hubiera impresionado a otra figura que lo observaba.\n\nEl hombre que Abrazó a Jayendra puso sus habilidades a trabajar de inmediato. Como diplomático y como general, Jayendra luchó con regularidad y éxito en la Guerra Eterna, pero a menudo, su propio descontento ante la autoridad hacía que siempre discutiera con su Sire. Así, cuando llegaron noticias a los Kshatriya sobre la expansión de la Gran Nación Mongola y el propio viaje de la [Glossary('Anda','podgloss.anda')], Chandraputra envió a Jayendra como enviado y asesor militar.\nEn lo que a Jayendra respectaba, esto era lo mejor, ya que había deseado un cambio de ritmo tras luchar contra los Muertos Hambrientos. Espera aprender muchas estrategias nuevas en su posición actual, donde aguarda con ansias cualquier dirección que sople el viento."
 POD_persistentpodlore.desc.793290: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nNacida en una pequeña aldea de la meseta tibetana, Tshering, bajo cualquier estándar, estaba destinada a una vida modesta y sin incidentes, con cada día igual al anterior. Sin embargo, ya de niña, la veta rebelde que ardía en su interior era evidente, la misma llama que un día la cambiaría para siempre.\nEmpezando por cosas pequeñas, como las bandas para el pelo de su madre o los zapatos del maestro de la aldea, fue escalando cada vez más alto, hasta llegar a su mayor golpe: se infiltró en un templo que se creía abandonado y robó un talismán de jade custodiado por un anciano que se convirtió en demonio, huyendo tan rápido como sus piernas le permitieron tras el robo. Mientras desaparecía en su aldea natal, exhaló un suspiro de alivio. Pero lo había logrado de verdad, ya que después de aquello, unos demonios asaltaron la aldea buscándola. Así que usó toda su habilidad como ladrona para desaparecer de nuevo en la naturaleza, pero fue detenida por alguien que, en realidad, la había estado acechando durante su golpe.\nEl otro ladrón se ofreció a entrenarla y a hacerla más grande de lo que jamás podría haber soñado. Tshering aceptó de todo corazón y se convirtió en una de las Ladronas de los Salubri de Wu Zao.\n\nTshering es buena en lo que hace, y le encanta hacerlo. Como vampira, ahora busca golpes cada vez mayores, superando siempre sus hazañas anteriores. Ahora pone su mirada en Mongolia, ya que lo único que nunca ha robado es un trono, y la [Glossary('Anda','podgloss.anda')] marcha por el mundo. Quizás es hora de un nuevo tipo de atraco, un golpe mucho más audaz.\nDespués de todo, ¿qué es más valioso que un trono?"
 POD_persistentpodlore.desc.793291: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nDesde todos los puntos de vista, Jiang debería haber sido una nota a pie de página en la historia. Nacida durante el declive y el eventual colapso de la dinastía Han, Jiang vería, y experimentaría de primera mano, lo que era estar en un imperio en decadencia. Su aldea natal fue extorsionada de todo su alimento y, cuando su padre y sus hermanos recurrieron al bandidaje para alimentarse, fueron capturados por los señores de la guerra y ejecutados. Cuando la aldea protestó por la matanza e intentó insistir en que nunca habían saqueado a sus soberanos, el señor de la guerra mandó incendiar la aldea entera. Muy pocos sobrevivieron, pero entre ellos estaba Jiang. Todo el calvario la radicalizó profundamente, pues juró destruir a los señores de la guerra y al imperio que vio cómo masacraban a su familia y destruían su hogar.\n\nJunto a su hermana de juramento Zheng, emprendieron el camino. Sin embargo, eran una fuerza pequeña, conocida únicamente por la novedad de que mujeres comandaran bandidos, y cuando fueron derrotadas en batalla por Cao Pi, fueron sentenciadas a muerte de inmediato.\nPero había alguien vigilándolas a ambas. Tras un suplicio especialmente brutal con un guardia de la prisión, Jiang despertó con un grito mientras una figura de tres ojos abría su celda. La criatura, Zao-Zei, se abalanzó sobre ella y la Abrazó en el Wu Zao. Sin embargo, Jiang estaba furiosa. Aquella pretenciosa ladrona le estaba sermoneando, la había matado, se había quedado de brazos cruzados mientras la mutilaban y había permitido que ocurrieran todos los males del mundo.\nEn cuanto tuvo la oportunidad, junto a Zheng, que también había sido transformada de forma similar, huyó en la noche. En sus viajes, conocerían a otro errante que defendía un Camino más cercano al suyo, el de un mundo sin dioses ni amos. Las tres juraron entonces un pacto: su nueva Tribu de Sangre vería cumplida su utopía.\nY pase lo que pase, Jiang luchará por su revolución. Cueste lo que cueste."
 POD_persistentpodlore.desc.793292: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nDel caos surge el cambio. Del tumulto de su vida, esa es la lección que Zheng interiorizó. Nacida en una pequeña aldea del norte de China durante el declive y colapso de la dinastía Han, Zheng hizo todo lo posible por mantener a su comunidad como cazadora, mientras los señores de la guerra locales la exprimían de todo lo que podían. Sin embargo, las cosas no fueron así, ya que varios miembros de la aldea recurrieron al bandidaje para sobrevivir y, en una horrible cadena de acontecimientos, un día, mientras estaba fuera cazando, regresó para encontrar a varios de sus aldeanos huyendo hacia las montañas, y al coronar una colina, vio la aldea en llamas. Horrorizada y furiosa, decidió coger su arco y buscar justicia, costara lo que costara, por su hogar destruido. Así, se unió a otra de las supervivientes, Jiang, en su propia y celosa campaña contra los Han.\nSin embargo, a pesar de la familiaridad de Zheng con la región, eran una pequeña masa de bandidos contra el creciente poder de Cao Pi. Nunca tuvieron oportunidad y, tras ser capturada, Zheng fue condenada a muerte. Destrozada internamente, esperó su fin pasando sus últimos días con una monotonía robótica. Una noche, tras un encuentro especialmente brutal con uno de los guardias, un hombre de tres ojos irrumpió en su celda y, para horror de Zheng, la mataron y la trajeron de vuelta como vampira.\nZheng estaba horrorizada más allá de toda creencia. Quería morir, su hogar había desaparecido, su causa estaba destruida y ahora le habían robado su propia vida. Y su asesino tuvo la audacia de llamarlo un regalo, para luego castigarla por su dolor. Así que huyó con su amiga de su vida mortal, buscando algo, cualquier cosa que llenara el vacío de su corazón vacío. No fue hasta que conoció a un extranjero errante de Japón, que luchaba por una sociedad en la noche sin señores ni amos, cuando volvió a encontrar un fuego. Uno que ahora desea desesperadamente mantener encendido."
 POD_persistentpodlore.desc.793293: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nNacida como hija de un jinete Laktan y una cautiva rusa, Sati era una niña insignificante destinada a una vida insignificante. La tribu era altiva y a veces dura con ella debido a su linaje, pero aun así se sentía mayormente satisfecha con su vida, pues había visto destinos mucho peores en las estepas asoladas por la guerra.\nTodo esto cambió en un instante cuando un Ventrue ruso lanzó una expedición para «adquirir conocimiento» sobre los invasores orientales que se aproximaban a su Tierra Natal. Sati fue capturada durante la incursión y tuvo el dudoso honor, principalmente porque podía hablar algo de ruso entrecortado gracias a su madre, de ser elegida para el Abrazo con el fin de enseñar a su nueva ama no-muerta las costumbres de su pueblo.\n\nSati cumplió con eso durante un par de años antes de ser prácticamente olvidada por su Sire, que nunca tuvo planes para ella más allá de ese punto. Cuando Sati se marchó una noche, nadie la detuvo ni siquiera lo notó.\nAunque apenas había recibido educación en asuntos vampíricos, la joven Ventrue sabía que había monstruos con incluso más poder que su propio Sire por toda Rusia y más allá, hacia el oeste. Sin embargo, recordó que su pequeña tribu Laktan nunca parecía tener a un vampiro de ese tipo entre ellos y decidió, por tanto, rastrearlos. Estar en un entorno familiar sin otros vampiros cerca le pareció la mejor opción.\n\nPara su sorpresa, el plan de Sati funcionó bien, considerando las circunstancias. Encontró los restos de su tribu y, gracias a sus nuevos poderes, fue aceptada fácilmente de nuevo.\nEn los años siguientes, Sati empezó a disfrutar de la vida (o la no-vida) por primera vez, mientras usaba su influencia para fortalecer a su tribu, mantenerla a salvo de otros e intentar frenar sus peores tendencias.\n\nCuando la Horda [Glossary('Anda','podgloss.anda')], siguiendo a los mongoles, envió emisarios a las tribus más pequeñas (incluida la suya) para exigir sumisión o la muerte, Sati se encontró hablando con otros señores no-muertos por primera vez en años. Tomó la única decisión racional y se arrodilló ante los poderosos invasores, salvando a su pueblo de la destrucción total.\nAhora espera en su pequeño rincón de las estepas, esperando que ella y su pueblo sobrevivan a la tormenta que se avecina."    
 POD_persistentpodlore.desc.793294: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nNacida en un lugar de aguas puras y criada en Burkhan Khaldun, Alan era una chica como cualquier otra, destacada entre su clan solo por su gran belleza y su sabiduría aún mayor. Tras haberse casado dos veces, tuvo cinco hijos que a menudo se peleaban entre sí. Como no quería que sus hijos se destruyeran entre sí o murieran solos, los invitó a una cena y les ordenó que cada uno rompiera una flecha. Cuando lo hicieron, les entregó un fajo de 5 flechas atadas y les pidió que intentaran hacer lo mismo. Al fallar, enfatizó la importancia de la unidad. Los hijos lo interiorizaron y llegarían a convertirse en los ancestros del pueblo mongol, según cuenta la Historia Secreta de los Mongoles. Pero otra oyente se había tomado su lección muy en serio.\n\nYesira de los [Glossary('Anda','podgloss.anda')] se acercó a Alan y le preguntó si aplicaría su sabiduría para proteger a sus hijos y sus linajes en la noche, mientras ellos la protegían a ella durante el día. Al no ver mayor honor para una madre, Alan aceptó y se unió a los [Glossary('Anda','podgloss.anda')]. Y en ellos, encontró una causa a la que podía dedicarse de mente, cuerpo y espíritu. Cada una de sus acciones, cada curso y cada directriz se dedicarían al bienestar de las familias de sus hijos y, con el tiempo, aceptaría su lugar como la ejecutora personal de Dobrul, un fantasma en la estepa incluso entre aquellos que se esconden en la oscuridad.\nNo temía nada, disfrutaba del cielo nocturno y buscaba siempre metas más altas para el pueblo que descendía de ella. Formaría la Vanguardia del Viento Negro, una orden de guerreros [Glossary('Anda','podgloss.anda')] que serían el Azote de todos los demonios que acecharan a los mongoles.\n\nDestino futuro: Alan tendría éxito en sus batallas, pero no pudo ganar la guerra. Cuando los $pod_kueijin$ asaltaran más tarde el lugar de descanso de Dobrul, su propia ubicación en las profundidades del territorio $pod_kueijin$ hizo imposible salvar a su antepasado.\nEn lugar de aceptar la muerte, huiría con su Vanguardia del Viento Negro hacia Siberia, donde desaparecieron, sin volver a ser vistos, a menos que se susurre en rumores temerosos que están una vez más al lado de Dobrul mientras llega la Sexta Era."    
 POD_persistentpodlore.desc.793295: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nTodas las grandes cosas deben terminar, un axioma cuyos extremos Dilay conoce bien.\n\nCriada como una chamán del pueblo Massegetae, Dilay estaba más sintonizada con el mundo sobrenatural que la mayoría de los mortales y, bajo la sombra de la guerra entre persas y Massegetae, su posición en la corte Massegetae la expuso a todo tipo de secretos y horrores. Pero en lugar de huir, Dilay lo afrontó directamente. A uno de esos asesinos que buscaban a su reina se le recibió con una rama de árbol atravesándole el pecho, mientras Dilay tomaba su sangre para obtener poder. Sacerdotisa de día y asesina de noche, hizo todo lo posible por erradicar a los asesinos de la nación de su pueblo, pero ella era una y ellos eran muchos.\nTras perder el favor de la corte debido a su influencia, fue enviada al exilio en las estepas. En su Contienda y voluntad de perdurar, de no doblegarse jamás ante tales indignidades, captó la atención de Alan, quien la Abrazó cuando Dilay sucumbió a la exposición.\n\nCuando Alan le ofreció los medios para perpetuar su venganza contra monstruos igualmente sedientos de sangre, Dilay aprovechó la oportunidad para asegurarse de que todos aquellos que se saciaran con sangre de corazón se asfixiaran con ella. Dentro de la Vanguardia del Viento Negro, los asesinos y jueces de Irán no hallarían santuario ante la Reina Guerrera renacida bajo el cielo infinito."    
 POD_persistentpodlore.desc.793296: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAunque muchos Gangrel afirman ser maestros de lo salvaje, pocos provienen de aquellos cuyas vidas enteras fueron definidas por la Contienda contra los elementos. Como Parentela Siberakh y procedente de las profundidades de Siberia, Virtyana está mucho más acostumbrada que muchos entre el linaje de Caín.\n\nVirtyana creció centrada principalmente en sobrevivir y proveer. El estilo de vida de los Siberakh es brutal; viven deliberadamente en las profundidades más inhóspitas de la corona del mundo, mientras que también entregan casi todo lo que recolectan a los escasos y preciosos hombres lobo de la tribu.\nEn su mayor parte, Virtyana sacó el máximo partido posible. Pero todo tiene un límite. Y una noche, cuando un Siberakh ebrio intentó buscar pareja en Virtyana y se negó a escuchar cuando ella le pedía que parara —para asombro de ambos—, la Furia que la Parentela sintió en ese momento fue suficiente para tener suerte con una baratija extranjera: un tenedor de plata que le atravesó la mandíbula hasta la cabeza, matándolo allí mismo.\nSabedora de que solo la muerte la esperaba, Virtyana huyó rápidamente, haciendo todo lo posible por ocultar su rastro y escapar. Pero incluso para los nacidos allí, Siberia puede quebrar a cualquiera, y en el umbral de las estepas, yacía agonizando por el agotamiento, la inanición y la exposición.\nSu historia habría terminado allí si la [Glossary('Anda','podgloss.anda')] Dilay no la estuviera estudiando. Y cuando Dilay le mostró un mundo donde podría ser lo suficientemente fuerte como para vivir más allá de su tribu, ella aceptó la naturaleza Cainita que se le impuso.\n\nDentro de los Vientos Negros, Virtyana se ha forjado como una asesina del Pueblo Feroz. Una posición extremadamente peligrosa para cualquiera; su experiencia como Parentela Siberakh la abre a más verdades sobre su condición que el simple rumor, haciéndola excepcionalmente apta para el papel. Y al empezar a deleitarse con ello, sabrá disfrutar de ser la Loba Negra, la Plaga de los Siberakh."    
 POD_persistentpodlore.desc.793297: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nMuchos de sus antiguos camaradas dirían que Sorkhaghtani ha caído. Pero aunque sus medios han cambiado, su propósito nunca lo ha hecho. Ella mata Demonios. Sin importar los métodos, el fin de los Demonios de Xia siempre es justo.\n\nSorkhaghtani formó parte de los pocos y raros Cazadores de Demonios de los Xiongnu, nacida en una de sus culturas vasallas y entrenada por un maestro de los Han. Iluminada por la oscuridad del mundo, Sorkhaghtani eligió combatirla con fuego. Pero las enseñanzas le perturbaban: estar sola y no unir a otros en la causa.\nAsí que, aunque era una celosa asesina de demonios, los métodos de sus contemporáneos le molestaban. Por ello, rompió las enseñanzas y comenzó a entrenar a su clan en las Artes de la Caza de Demonios. Esto ofendió a su maestro, quien procedió a masacrar a la asamblea. Dejando a Sorkhaghtani para el final, se burló de sus esfuerzos y reiteró la importancia de la soledad. Pero en su jactancia, pasó por alto la figura que se aproximaba por detrás, y Sorkhaghtani se salvó gracias a que Alan partió a su antiguo maestro por la mitad. Alan le hizo entonces una oferta sencilla: unirse a él y luchar contra los Demonios más allá de la muerte. La elección era obvia.\n\nSorkhaghtani se encuentra entre los más celosos de la [Glossary('Anda','podgloss.anda')] Vanguardia contra los $pod_kueijin$. Los odia con cada fibra de su ser desde que era una niña entrenada para matarlos. Especialista en la práctica, ha refinado el acto de matar a los Mil Demonios hasta convertirlo en un arte. Y aunque los Cazadores de Demonios puedan buscarla ahora, está dispuesta a dejar que vengan.\nElla los ha superado."    
 POD_persistentpodlore.desc.793298: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nPara la mayoría que sabe lo que son los magos, la idea de especializarse en matarlos suena de locos. Por suerte para Samga, se le ha dado bastante bien.\n\nCriada en un clan bastante pequeño, la familia de Samga vivía bajo la tiranía de un mago con complejo de dios. Ejerciendo el Derecho de la Primera Noche, teniendo la primera elección sobre todos los adultos jóvenes del clan, manteniendo una pequeña masa de concubinas e indulgiendo en muchas depravidades que harían vomitar incluso a los tiranos más curtidos, Samga creció bajo la sombra de un terror y miedo constantes. La cabeza de su padre fue puesta del revés por cocinar de más a una marmota, y a su madre le quitaron todas las extremidades y la injertaron al cuello de un burro por no mostrar suficiente entusiasmo mientras se acostaba con el tirano.\nY para la mayoría del clan, ese terror los mantenía a raya. Pero no Samga. Con la muerte de sus padres, permaneció en las sombras, siendo una nadie, esperando el momento en que pudiera entregarse a su venganza. Y finalmente, mientras él invocaba rayos para destruir a otra tribu, ella vio su oportunidad. Desde detrás de una colina, lanzó una flecha de metal al ojo del tirano, provocando que el rayo golpeara la cabeza del mago y lo hiciera estallar en el acto.\nY entonces, sin nada más que perder, simplemente se recostó y esperó lo que viniera.\n\nCuando despertó, era diferente, y una criatura de la noche aguardaba a su lado. Cuando le prometió la oportunidad de aniquilar a los enemigos de todos aquellos que amenazaran a su gente, consideró que era una causa noble y se puso de su lado. Como Viento Negro, se convertiría en la plaga de muchos magos, aplicando las reglas de combate contra los manipuladores de la realidad para asegurar que nunca volvieran a ser una amenaza."    
 POD_persistentpodlore.desc.793299: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nNacida en las tierras de la dinastía Mahameghavahana, Shailaja vivió bajo la sombra del colapso de los Maurya. Pasando la mayor parte de su vida mortal como cualquier otro miembro de su aldea, dedicó mucho tiempo a cuidar de los ancianos. Ya fuera llevándoles agua, ayudando a preparar la comida o simplemente escuchándolos, era muy hábil proporcionándoles consuelo cuando estaban abandonados. Su amor por ellos era tan grande que, una noche, cuando uno de sus protegidos fue atacado por un tigre joven, sin dudarlo tomó un sable de un guardia y, de un solo tajo, le abrió la cabeza.\nTan audaz y directa, captó la atención de uno de los últimos ecos de las conquistas de un griego en particular, y de algunas de las entidades que se ocultaban en su sombra. Una de esas figuras determinó que esta cuidadora de ancianos y cazadora de tigres sería perfecta para su linaje. Y esa noche, Shailaja fue convertida en Lamia.\n\nShailaja no gestionó el Abrazo tan bien como su Sire esperaba. Su educación dentro del clan fue difícil, especialmente porque se negó en gran medida a abandonar sus propias creencias Shakti por el culto a Lilith. Su Sire intentó presionar el tema, pero una noche los ánimos se caldearon y volaron colmillos, y Shailaja se vio obligada a huir.\nSimplemente viajó a donde sintió que era correcto, deteniéndose finalmente ante la puerta del refugio del Capadocio Fu Jiezi. Al ver destellos de su llamado en la posibilidad de proteger a este erudito de la muerte, se ofreció de inmediato a ser su guardaespaldas, papel que él aceptó sin dudar. Y mientras el mundo a su alrededor se vuelve más tempestuoso, no se encontrará a la Plaga de los Khotanos sin su Cazadora de Tigres."    
 POD_persistentpodlore.desc.791510: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nBelgutei está lejos de ser un ejemplo de lo mejor que el [Glossary('Anda','podgloss.anda')] tiene para ofrecer. De hecho, es prácticamente lo opuesto. Como un jactancioso jinete mongol, sus adecuadas habilidades de combate intrigaron a su presunto Sire, que esperaba que la inmortalidad permitiera moldear dichas habilidades en algo más. Por desgracia, no fue así.\nDesde que se convirtió en vampiro, Belgutei hizo muy poco para impresionar a sus Antiguos, solo lo suficiente para no ser castigado por su pereza. El día que su vida eterna dio un giro funesto fue cuando huyó del campo de batalla durante un difícil encuentro con los $pod_kueijin$. Tal cobardía debería haber sido castigada con una ejecución rápida, pero Belgutei tuvo suerte, ya que se necesitaba un «embajador» para el último tributario del [Glossary('Anda','podgloss.anda')], la tribu Laktan. Al ser considerado un puesto sin importancia y poco agradecido, Belgutei fue enviado a servir allí hasta nuevo aviso.\nPronto recayó en sus peores hábitos y, como es el representante de un poder mucho más fuerte, se considera el legítimo gobernante de la tribu. Sati, la actual gobernante vampírica de esta comunidad, apenas puede hacer algo contra él, ya que se arriesgaría a provocar la ira del [Glossary('Anda','podgloss.anda')]. Ha decidido esperar que la cobardía de Belgutei garantice que nunca intente actuar realmente contra ella."    
 POD_persistentpodlore.desc.793300: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nComo la mayoría de su tribu, Begluk creció pensando que Sati era única, la protectora e guía inmortal de su comunidad. Su buena cabeza para los números le ganó el favor de ella y se contentaba con trabajar para su beneficio (y el de su tribu). Las cosas cambiaron cuando llegó Belgutei.\nEste arrogante mongol pronto demostró a todos que Sati era solo una inmortal entre muchas otras, y una bastante débil, ya que parece no estar dispuesta a arriesgarse a un enfrentamiento con los amos de Belgutei. El mongol pronto se fijó en Begluk y lo Abrazó, aparentemente sobre todo para alardear de su «autoridad» sobre Sati. Begluk estuvo aterrorizado durante sus primeras noches como vampiro, especialmente porque su Sire no tenía intención de educarlo ni de ayudarle a comprender su nueva condición. Afortunadamente, Sati le dio un resumen de qué hacer y qué no hacer, principalmente para protegerlo de la tribu (y viceversa).\nBegluk se está recuperando lentamente de esta experiencia traumática y, aunque odia a Belgutei con pasión por lo que hizo, también le guarda rencor a Sati por no haberlos defendido mejor del mongol. Su resentimiento podría empujarle a cometer un error crítico en el futuro."    
 POD_persistentpodlore.desc.793301: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nUn lobo no está hecho para arrodillarse. Eso es dominio de los perros. E Ilker no siente nada más que rencor por haber sido convertido en uno de los Perros del [Glossary('Anda','podgloss.anda')]. \nNacido en la edad dorada del Kanato Kimek, Ilker fue un cazador en su vida mortal. Y era excelente en ello. Particularmente, ganaba buen dinero cazando lobos y osos, buscando bestias y devoradores de hombres de los que muchos cazadores huirían. En su audacia, acabó buscando a un devorador de hombres bastante extraño. En esa caza, mordió más de lo que podía masticar y conoció a su futuro Sire. Sin embargo, impresionados por su capacidad para cazarlos, decidieron no desperdiciar a un posible Chiquillo. Y el monstruo interior de Ilker salió a la luz, expuesto ante todo el mundo.\n\nIlker despreciaba su forma actual e intentó matar a su Sire por vergüenza y humillación. Pero al ser incapaz de atraparlos una vez más, lo único que pudo hacer fue enfurecer impúdicamente. Con bestias engendradas, se labró un dominio propio entre el Kanato Kimek, aferrándose a los últimos vestigios de orgullo que le quedaban como Kan de la Noche. Solo para que se los arrebataran cuando fue acorralado y forzado a la sumisión por el [Glossary('Anda','podgloss.anda')]. Ilker espera una vulnerabilidad, deseando desesperadamente la venganza, sin importar el coste.\n\nDestino futuro: Cuando el poder del [Glossary('Anda','podgloss.anda')] comenzara a menguar, Ilker atacaría buscando ganar más poder en el Quincunx. Se unió a la purga del [Glossary('Anda','podgloss.anda')], presentándolos con avidez ante los $pod_kueijin$. Y por sus acciones, le recompensaron como merecía: ser estacado, encerrado en un ataúd y arrojado a las profundidades de las fosas oceánicas más abismales, donde nunca más se le ha vuelto a ver."    
 POD_persistentpodlore.desc.793125: "Este personaje es parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, ha sido ampliado por los desarrolladores de PoD para aportar mayor profundidad al escenario.\n\nMawar, más que cualquier otro miembro de los Compañeros de Piyau, ha estado a su lado en las buenas y en las malas. Incluso desde el principio.\n\nMawar fue una vez, en su vida mortal, simplemente una ama de casa. Cuidaba del hogar de su marido, criaba a sus hijos y les ayudaba con diligencia dondequiera que lo necesitaran. Y, sin embargo, una parte de ella nunca se sintió verdaderamente feliz, como si algo siempre se le escapara. Su vida era estancada y la detestaba. Y una de sus mayores ironías es que nunca se sintió realmente viva hasta el día en que murió, cuando su marido, cansado de su envejecida esposa, la atacó, la despedazó y la arrojó al mar para alimentar a los peces. Y en la siguiente vida, se encontró en el Infierno de los Mares Ardientes.\n\nPero Mawar se sentía viva en la violencia. Herir y ser herida, matar y ser matada, luchar y ser combatida; esa adrenalina la llenaba de vida y celo. Se convirtió en una depredadora alfa, abriéndose paso de vuelta a los vivos sobre una montaña de cadáveres. A su regreso, luchó contra otro demonio hasta el estancamiento. Su propia furia loca e intoxicada por la adrenalina fue suficiente para igualar la tenacidad y voluntad de su oponente. Y allí, ambos encontraron su cordura y juraron ser hermanas de sangre.\n\nMawar ha estado al lado de Piyau desde entonces.\nDestino futuro en el canon\nMawar se convertirá en la [Glossary('Penangallan','podgloss.penangallan')] más prominente tras la ascensión de Piyau a las [Glossary('Hundred Clouds','podgloss.hundredclouds')]. Será la voz informal de las Cortes Doradas y atraerá a los combatientes (y festejadores) más hábiles a su corte. Estará muy cerca de alcanzar su propia ascensión a principios de la década de 2000."    
 POD_persistentpodlore.desc.793124: "Este personaje es parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, ha sido ampliado por los desarrolladores de PoD para aportar mayor profundidad al escenario.\n\nIntan estaba condenada desde el principio, en la mayoría de las circunstancias. Nacida nueve meses después de que una incursión pirata saqueara su aldea, Intan fue abandonada rápidamente en la selva siendo apenas una niña pequeña, sin poder hablar todavía. Viviendo en esa selva, luchó inmensamente día tras día solo para sobrevivir. Abandonada por la civilización y dejada sola, siendo constantemente perseguida y hambrienta, cada día era una lucha por la supervivencia.\nCualquier otra persona que veía simplemente la veía como una criatura cubierta de barro acechando en el bosque, comiendo cualquier cosa que pudiera encontrar. Un día, sin embargo, cazó a la presa equivocada y una tropa de aldeanos comenzó a quemar secciones de la selva por ella. Cuando atraparon a la entonces joven mujer, ella no tenía palabras para entender lo que estaba pasando mientras la arrastraban al centro de una aldea y la colgaban allí, mientras se retorcía como un tigre capturado. Aulló mientras empezaban a lanzarle piedras, hasta que finalmente perdió las fuerzas y la luz abandonó sus ojos, antes de que arrojaran su cadáver de vuelta a la selva.\n\nPero Intan no cambió. Lo único que sabía era sobrevivir. Incluso cuando se encontró en el Infierno de los Pecadores al Revés, la extrañeza del lugar fue superada lentamente por su sentido de seguridad. Y a través de su inquebrantable tenacidad, encontró el camino de vuelta. Regresó a las selvas de su juventud, masacrando a todo aquel que se cruzara en su camino.\nHasta el día en que una mujer la encontró, mucho más fuerte y con un poder demoníaco similar. Al reconocer que había sido atrapada, Intan se sometió. La mujer, Piyau, la llevó a su templo y le dio a Intan su nombre y su lengua. Fue un proceso largo, pero con el tiempo, Intan pudo unirse adecuadamente al mundo de su madre adoptiva. Y como siempre lo había hecho, sobreviviría, pero ahora, finalmente tenía la oportunidad de prosperar."    
 POD_persistentpodlore.desc.793126: "Este personaje forma parte de $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nNacida en una pequeña aldea costera, Melati tuvo, en su mayor parte, una vida bastante mundana. Ayudando a su familia como pescadora, Melati simplemente vivía tranquilamente y prefería no llamar la atención. Y quizás así habría sido su vida si los dos señores de los otros lados de su aldea no se hubieran enfrascado en una disputa por quién era el verdadero dueño de ella. Cuando llegaron los soldados, la aldea intentó simplemente hacer que se marcharan, pero una sola fruta lanzada y un guardia irritable provocaron que la aldea fuera saqueada, robada y quemada hasta los cimientos. Melati estuvo entre las muchas personas allí brutalizadas y luego asesinadas por los soldados, uno de tantos muertos sin importancia apilados en un montón en el centro de la aldea y prendidos fuego.\n\nMelati se encontró en el Pozo de Sal y Hierro, con sus últimos momentos de vida repitiéndose de forma horrorosa. Pero, aun así, la ira en su interior se afiló como una daga cruel. Esperó su momento. Finalmente, cuando llegó el momento oportuno, se abrió paso a sangre y fuego entre los burdeles de hierro y huyó rápidamente de vuelta al mundo de los vivos tan rápido como sus piernas se lo permitieron. Y finalmente, volvió a ser libre. Y cuando Piyau la encontró, ella ya tenía un propósito.\n\nMelati sigue estando intensamente enfadada. Pero, a diferencia de sus compañeros, es paciente. Es metódica. Es una acechadora. Aprendió de primera mano lo que conlleva la imprudencia. Y no volverá a pasar por eso."    
 POD_persistentpodlore.desc.793127: "Este personaje forma parte de $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nNacida como hija de un próspero agricultor, Siti, comparativamente, nació en un entorno de lujo comparable al de sus contemporáneos. Pero, por supuesto, su vida seguía estando lejos de ser deseable. Desposada y enviada lejos para casarse con otro terrateniente rico a la edad de 14 años con un hombre tres veces mayor que ella, pronto descubrió que el confort que tenía no era más que una jaula pintada de oro. A pesar de su curiosidad por la administración, cada intento de aprender a leer o gestionar monedas se topaba con la violencia. Y una noche, tras años de matrimonio sin hijos, su marido simplemente le cortó la cabeza y se buscó una esposa nueva. Y Siti despertó en la Ciudad de los Demonios, presionada por las bandas y atrapada en el ciclo de violencia hecho realidad metafísicamente.\n\nSiti estaba terriblemente fuera de lugar en Lanka, pero a pesar de los agravios recibidos, lo que había sucedido no podía ser el final de su historia. Se hizo fuerte a regañadientes, volviéndose viciosa, buscando el porqué de lo que le había pasado. Y con el tiempo, se abriría paso luchando mediante la explotación de las vulnerabilidades de los muros del infierno, encontrando una grieta y deslizándose hacia fuera, siendo finalmente encontrada por Piyau. Y en su ambición emergente, una mujer con conocimiento de los detalles más finos de las estructuras e infraestructuras resultaría invaluable.\n\nAunque Siti acepta ahora que debe luchar, finalmente puede hacer honor a los sueños que tanto tiempo le fueron negados."    
 POD_persistentpodlore.desc.793128: "Este personaje forma parte de $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nWati representa no solo dos extremos, sino también dos caras de la feminidad. Una verduga y una cuidadora. Un demonio y una defensora. Un monstruo y una madre. Y todo ello de alguien que originalmente no nació para nada de eso.\n\nWati fue una vez solo un niño pequeño que odiaba su reflejo. Que odiaba su propia debilidad física. Que veneraba a su madre, viendo su fuerza silenciosa como algo maravillosamente trascendental, y que no deseaba nada más que ser como ella. Un día, tras hablar con su madre, ella le permitió probarse sus vestidos, y no encontró nada más liberador. Sin embargo, tal felicidad no duraría mucho tiempo.\nUn día se vistió para salir y una patrulla que pasaba vio lo que inicialmente creyó que era una hermosa joven solitaria. Y cuando descubrieron la incongruencia en sus suposiciones, la mataron, brutalmente, desollándola viva antes de dejarla desangrándose en la selva mientras los jabalíes se la comían.\n\nCuando Wati despertó en el Infierno de ser Desollado Vivo, su antigua y suave naturaleza fue reemplazada por una furia absorbente. La agonía y los tormentos endurecieron su resolución. Tendría su venganza, sin importar qué. Acechó por esos páramos yermos, matando a todo lo que encontraba, aullando los nombres de sus asesinos para recordarlos.\nFinalmente, pudo encontrar una cueva de regreso al mundo de los vivos, encontró a sus asesinos y se los comió vivos. Los demonios la persiguieron, y ella también se los comió. Se deleitó en su ira, ahora orgullosa e imperiosa.\nY cuando Piyau la encontró, era una bestia difícil de domar. Pero Piyau lo entendió. Y tras algo de modelado de carne, sugirió que Wati tuviera un hijo. Accediendo con vacilación, ese infante abrió los ojos de Wati tanto como su regocijo. Como madre y como monstruo, se siente plena y completa. Y está más que ansiosa por ser finalmente feliz."    
 POD_persistentpodlore.desc.795048: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nYao Wei era originalmente una de tantos aldeanos en las regiones del Yuan del Norte en China, cerca de Corea. Originalmente anhelaba cosas como una cosecha lo suficientemente grande como para llenar la mesa y esperaba buen tiempo; sus plegarias se amargaron cuando su aldea recibió la respuesta de una tormenta de piratas. Saquearon su hogar, matando a la mayor parte de su familia y todo lo que conocía, y la tomaron como una de varias «presas» frescas.\nCuando los piratas comenzaron a saquear, uno notó que, unos meses después de haberla tomado por primera vez, ya estaba embarazada. Los piratas, al no querer lidiar con un bebé, simplemente la ataron con todas sus fuerzas, la conectaron a una roca y la arrojaron por la borda.\n\nCuando Yao perdió el conocimiento por ahogamiento, para su horror, se encontró en el mismo estado, pero ahora en el Infierno de los Mares Hirvientes, hundiéndose y ahogándose eternamente. Pero la roca que una vez la mató de una forma extraña resultó ser su salvación, ya que la llevó más profundo, hasta que finalmente despertó de nuevo sin necesidad de respirar bajo el agua, pero con una forma diabólica, una que rompió sus cuerdas fácilmente y nadó de vuelta al mundo de los vivos.\nY cuando fue encontrada por el [Glossary('Civilizador del Diablo Infantil','podgloss.infantdevilcivilizer')], fue integrada en el seno de los Pétalos de la Virtud.\n\nToda la experiencia la sacudió hasta la médula. La vida es tan fugaz, la suya tan pequeña y extinguida de forma tan trivial y fácil. No podía permitir que eso volviera a suceder. No, nunca volvería a ser pequeña.\nDebía ser magnífica, esplendorosa, malvada y demasiado fuerte para volver a ahogarse jamás. Y para alguien tan joven, no, debía ser radiante. Se convertiría en una villana digna de recordar, digna de temer. Nunca se atrevería a ser pequeña de nuevo.\n\nDestino futuro en el canon\n\nEl entusiasmo y el celo de Yao Wei le sirvieron de mucho. Su éxito como pirata acabaría elevándola con el futuro Quincunx, y se convertiría en una pirata no-muerta extremadamente exitosa. Incluso contra el poder de la Armada Británica, obtendría victoria tras victoria y llegaría a ser fabulosamente rica en las noches actuales."    
 POD_persistentpodlore.desc.795052: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nEn el Mundo de la Noche, la Guerra Eterna del subcontinente indio es algo que muy pocos forasteros han logrado vulnerar con éxito. A pesar del éxito de sus contemporáneos mortales, las conquistas musulmanas en la India tuvieron menos éxito entre los vampiros; la gran mayoría murió ante el poder de los Ilusionistas de los Ravnos o contra las Artes Diabólicas de los Condenados. Pero alguien perduraría a la sombra de uno de los más grandes conquistadores mortales de la región.\n\nShuja era la hija de Mahmud de Ghazni, antaño Mano Derecha del Estado y luego Sultán de los Ghaznavid. Con toda la educación adecuada para una mujer de su estatus, Shuja habría estado destinada a una vida como esposa de otro señor; sin embargo, el intento de la primera Ashirra por abrirse paso en el subcontinente indio llegó antes que su destino.\nSeparada de sus padres y hermanos, pero educada y capaz, era una Chiquilla evidente. Abrazada y educada en las costumbres de la Ashirra, no contó con mucho apoyo de ellos durante mucho tiempo, ya que huyeron rápidamente hacia el oeste ante el poder de los Ravnos.\nPero Shuja no abandonaría su hogar sin luchar. Con los beneficios de su vida y los privilegios de su no-muerte, rompió el primer asalto Ravnos a su dominio y ascendió rápidamente hasta convertirse en una Sultana Ashirra. A pesar de estar sola, Shuja era tenaz e implacable, audaz y ambiciosa. No se quebraría, ni siquiera cuando el imperio en el que nació se desmoronara. No, ella perduraría.\nDestino futuro en el canon\nA pesar de la furia de los Ravnos y la posterior ira de los Muertos Hambrientos, Shuja no se quebraría como tantos otros Sultanes Ashirra. Aunque acabaría siendo expulsada de Afganistán, lograría tomar Bombay, más tarde Mumbai, de manos de los Ravnos y establecería y fortalecería el principal centro de poder de la Ashirra en el subcontinente indio."    
 POD_persistentpodlore.desc.795055: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nGuiying es uno de los ayudantes más antiguos, firmes y leales de Wang Hongben. Vital y enérgico, siempre busca cada vez más qué hacer por su señor. ¿Y con qué fin? No por sentido del deber, sino porque Guiying simplemente desea a Wang, y está dispuesto a hacer todo lo posible para intentar captar su atención, para detrimento extremo de la salud de la Corte del Emperador Amarillo.\n\nGuiying era uno de los pueblos de las selvas del sur de China que llegarían a ser los Bandun. No habla mucho de su vida mortal, más allá de que fue atacado por un tigre y estuvo vivo mientras este lamía la carne de sus huesos, enviándolo así al Infierno de ser Desollado Vivo. Y cuando escapó, encontró un nuevo y salvaje amor por la vida. Y a través de ella, por el líder de su [Glossary('Wu','podgloss.wu')], Wang.\nFue un ferviente partidario de su ascenso por las cortes, mientras perseguía con destreza los edictos de los Dragones Azotadores. Y cuando Wang llegó a liderar la Corte del Emperador Amarillo, colocó a sus seguidores en posiciones clave, situando notablemente a Guiying en el sur de China.\n\nGuiying, sin embargo, ha sido una plaga para la región. Voraz y codicioso, extrae nuevos placeres y experiencias de los ancestros que yacen bajo ellos, mientras desprecia constantemente a la Corte del Fénix Escarlata al menospreciar los detalles más finos de las mujeres frente a la nobleza de la forma de los hombres de manera constante.\nY cuando no está allí, siempre le está susurrando a Guiying, intentando constantemente ganarse su favor sin descanso. Compite con el resto de su antiguo [Glossary('Wu','podgloss.wu')] por la atención de Wang, mientras el Sur se decae y sufre bajo sus ansias de carne, comida y moneda.\n\nDestino futuro en el canon\nEl asesinato de Wang destruiría a Guiying. Se retiraría a su propia corte, donde se le oía lamentarse y llorar su pérdida durante meses. Finalmente, el sollozo cesó y, cuando sus ayudantes fueron a verlo, ya no estaba. Nunca más se le volvió a ver."    
 POD_persistentpodlore.desc.795056: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nDe Majiayuan surgió alguien que antaño fue un verdadero maestro de la muerte. Pero ese sol se ha puesto hace mucho tiempo, pues ese viejo tigre ahora ronronea a los pies de su Emperador, buscando cada vez más atención por poco más que el simple hecho de tenerla.\n\nBai procedía del oeste, dentro de la Corte del Emperador Amarillo, entre los Majiayuan del pueblo Xirong. Según su testimonio, era alguien sin renombre, que moría de fiebre y entraba en el Infierno de las Larvas Cavadoras; tuvo la suerte de escapar y mucho más de ser puesta al servicio del [Glossary('Wu','podgloss.wu')] de Wang Hongben.\nSu humildad y paciencia le ganaron gran favor junto a sus propias habilidades mortales; durante un tiempo fue una excelente Cantora de Sombras, y especialmente entre los [Glossary('Wu','podgloss.wu')], existía la esperanza de que el ascenso de Wang a la Corte del Emperador Amarillo significara un aumento de las relaciones con la Corte del Tigre Blanco. Pero, desafortunadamente, no estaba destinado a ser.\n\nBai era exasperantemente cautelosa, letárgica y excesivamente deferente con Wang. Las propias excentricidades de este se veían incluso realzadas por Bai, que solo quería lo que su señor le ordenaba. Incluso cuando los invasores nómadas acechan la Corte, ella solo espera las órdenes de Wang para intervenir, siempre temerosa de extralimitarse y nunca dispuesta a tomar la iniciativa. Todo en aras de obtener cada vez más atención de su señor.\n\nDestino futuro en el canon\nEl asesinato de Wang destruiría a Bai. Simplemente se quedó sentada en sus aposentos sin moverse durante años, limitándose a beber chi de forma ambiental y a mirar fijamente a la nada. Y tras años de vacío, simplemente caminó hacia el Himalaya, para no ser vista nunca más."    
 POD_persistentpodlore.desc.795057: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nMientras los Jin arden, muchos en la zona callan lo grave que se está volviendo la situación. Porque saben que, de hacerlo, Li vendrá sin vacilar para silenciarlo.\n\nLi nació entre los Di, el pueblo del norte que ocupaba la zona inmediatamente al norte de China. Como uno de los primeros muertos en encontrarse en el [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')], tras su escape, Li pareció transformado por la experiencia y abrazó con prontitud la cultura china, abandonando activamente la suya.\nAl ver al líder de su [Glossary('Wu','podgloss.wu')], Wang Hongben, como un ejemplo de ella, encontró una gran satisfacción como su ejecutor ardiente, incuestionable e implacable. El propio odio de Li hacia los pueblos nómadas hacía que las relaciones diplomáticas con la Corte de la Tortuga Negra fueran... difíciles, por decir lo menos, pero ha encontrado una gran realización enviando huestes enteras de [Glossary('Wu','podgloss.wu')] para oponerse a los [Glossary('Anda','podgloss.anda')].\nDesafortunadamente, es un desastre absoluto en las artes marciales; un ejecutor temerario y brusco. A medida que la guerra contra los [Glossary('Anda','podgloss.anda')] se vuelve cada vez más contra los Muertos Hambrientos, él mantiene la línea silenciando toda disidencia con su hacha.\n\nDebe ganar, porque eso es lo que Wang exige. Y no aceptará nada menos.\n\nDestino futuro en el canon\nEl asesinato de Wang conmociona a Li e, inmediatamente, sin la amenaza del grueso de la Corte del Emperador Amarillo respaldándolo, muchos [Glossary('Wu','podgloss.wu')] del norte se rebelan abiertamente contra sus tácticas brutales y autoritarias.\nLi estalla en furia y busca activamente dar ejemplos de todo el [Glossary('Wu','podgloss.wu')] enviado contra los [Glossary('Anda','podgloss.anda')], sean leales o no. Por suerte para ellos, Li desaparecería por completo cuando un [Glossary('Wu','podgloss.wu')] al que buscaba fue emboscado por una fuerza de tarea de los [Glossary('Anda','podgloss.anda')] conocida como la Vanguardia de los Vientos Negros, tras cuyo encuentro compartido no se volvió a saber ni a ver nada de él."    
 POD_persistentpodlore.desc.795058: "Este personaje forma parte de $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nPor un lado, buscar la Iluminación es algo noble que los $pod_kueijin$ persiguen. Por otro, rara vez resulta agradable presenciarlo cuando es un Tigre Diablo quien lo hace. Especialmente uno que está a merced de un señor tan tempestuoso como Wang. Y Qing no es más que lealtad, por supuesto. No querría que se la viera de otra manera.\n\nQing nació en las costas orientales de China, entre los Dongyi. Originaria de una comunidad pesquera, en un momento dado fue asesinada por lo que ella describe como un hombre horrendo que surgió de las profundidades con tiburones a su espalda, arrebatándole toda la sangre de las venas y dejándola como un caparazón momificado bajo las olas. Y cuando su alma se encontró en el Infierno de los Mares Hirvientes, no escapó por astucia o sagacidad, sino agarrando al demonio más cercano, desollándolo y usando sus huesos como guía hacia la seguridad.\nSu brutalidad celosa le valió un lugar fácil entre los Tigres Diablo, donde se notó especialmente que poseía una Ansia por el poder verdaderamente aterradora. Y con ese fin, suele estar siempre ansiosa por escuchar a Wang para obtener más de ella.\n\nQing nunca se siente más viva castigando pecadores, con extremos nuevos y horribles que incluso otros Antiguos Tigres Diablo se escandalizarían ante sus obras de arte. Y no discrimina, ya que a menudo pregunta a Wang si hay algún «pecador» que necesite ser castigado. Y aunque muchos hablan de que conspira a sus espaldas, ella parece contenta, hasta cierto punto, al recibir todos los prisioneros de Wang, sin importar su virtud.\n\nDestino futuro en el canon\nCuando Wang es asesinado, la mayoría de las miradas recaen sobre Qing. Intenta mantener su control como su Ancestral designada del Este de la Corte del Emperador Amarillo, pero finalmente es expulsada e intenta huir al sur hacia aquellos que creía que pensaban como ella. Sin embargo, la última vez que se le vio, cayó por la borda arrastrada bajo el agua, gritando algo como «¡otra vez él, por favor no, cualquiera menos él!», según sus ayudantes, y nunca más se supo de ella."    
 POD_persistentpodlore.desc.793302: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial de $pod_wod$.\n\nCuando la Ashirra llegó tras los mercaderes mortales e imanes, las esperanzas iniciales por las tierras de Indochina y las islas del Mar de China Meridional fueron, para muchos Ashirra, excesivamente ambiciosas y estaban condenadas al fracaso. La audacia y la determinación se toparon con una resistencia extrema por parte de los habitantes de sus noches; como pálidos señores de bestias y espíritus, la manada de Muertos Hambrientos que venía del interior, y cosas acechantes en las profundidades de las olas, la gran mayoría de la Ashirra enviada a esta región alcanzó la Muerte Definitiva.\n\nHafiz ha caminado hasta ahora por la cuerda floja de la letal política con gran éxito al no ser reducido a pasta de carne.\n\nHafiz en vida era un mercader, una profesión que disfrutaba bastante. Pero mientras viajaba por nuevas rutas comerciales en el Mar Arábigo, fue contratado por un comerciante en la India para un trabajo. Y al partir, casi todo lo que podía salir mal, salió mal. Velas a la deriva, fallos de navegación, tormentas, animales extrañamente hostiles que parecían buscar sangre y piratas rutinarios; llegar al puerto fue una odisea que casi mata a Hafiz. Pero lo logró, y su socio quedó impresionado. Y por su tenacidad, fue recompensado con el Abrazo y recibió su verdadero propósito.\nLlevar a la Ashirra a una nueva tierra, llevar la palabra donde tantos otros habían fracasado. Al sobrevivir, su sire Shuja estaba seguro de que podría lograrlo donde tantos otros fallaron. Y al no ver otra opción, zarpó una vez más.\n\nDestino futuro\nHafiz lograría tener éxito donde muchos otros habían perecido. Gestionando cuidadosamente sus relaciones con los Vástagos nativos de la región y evitando provocar a las Cortes Doradas, se le permitió expandir la Ashirra en la región. Hasta el día de hoy, gobierna como un Sultán de la Ashirra incluso a la sombra de las Cortes Doradas, lo cual, para ser justos, es precisamente donde un Lasombra quiere estar."    
 POD_persistentpodlore.desc.795059: "Este personaje es parte de $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para añadir mayor profundidad al escenario.\n\nSi bien el declive de la Corte del Fénix Escarlata permitió que muchos infernalistas, herejes y otros engendros impuros echaran raíces en la noche del Mar de China Meridional, hay un horror que acecha en esas profundidades desde tiempos inmemoriales, tan antiguo como el más viejo de los [akuma|E], y entre sus más terribles.\nIncluso en las distantes Cortes de la Tortuga Negra, hay susurros sobre un Corrupto de un poder verdaderamente terrible, uno que podría desafiar a los [Glossary('Reyes Yama','podgloss.yamaking')] por derecho propio. Un temido Conquistador, un Despertado, pero con una Iluminación tan terrible que pondría al mundo de rodillas. Simplemente y elocuentemente llamada Bestia, la Devoradora de Llamas se gana con creces ese título.\n\nLos orígenes de la Devoradora de Llamas son desconocidos, pero se cree que fue una discípula de Mahanaga de alguna manera, una de las primeras caminantes de los Mil Gritos. La eterna quemadura en su carne hace que algunos crean que es del Infierno del Aceite Hirviente, pero tal cosa no es más que una conjetura, pues nadie le ha preguntado y haya sobrevivido para contarlo. Lo que se sabe es que tiene un apetito verdaderamente voraz en todo, buscando siempre a la presa más peligrosa. Otros $pod_kueijin$, los pocos y raros Vampiros, $glossary_fera$, Magos, Espíritus, Demonios y otras incontables cosas; aunque sea capaz de beber el chi ambiental, prefiere la suculenta dulzura de la carne fresca.\nSe ganó su nombre devorando a un Ancestro Tigre Diablo, al que fue desmembrando lentamente en agonía mientras él intentaba consumirla con su Cuerpo Divino de Fuego, y lo único que logró fue cocinarle la comida. Se ha despertado de su letargo una vez más, mientras acumula un culto de fuego y un ejército de piratas saqueadores.\nTodo para su perversa y malvada Iluminación. Ya sea carne para su mesa, cuerpos cálidos para su placer o los deliciosos gritos de sus víctimas, de ellos extraerá mil gritos.\n\nDestino futuro en el canon\nA pesar del temible poder del monstruo, el peso de la superioridad numérica permitió que los restos de la Corte del Fénix Escarlata la abrumaran.\nPero no pudieron matarla, así que en su lugar la vincularon a las profundidades de la tierra, donde permanece hasta el día de hoy. Pero desafortunadamente, Hong Kong se alzó sin saberlo sobre su prisión, donde la sangre vital de la ciudad comienza a filtrarse en su celda oculta, donde empieza a soñar con los manjares del fuego y el asesinato una vez más, agitándose a medida que la Sexta Era se acerca."    
 POD_persistentpodlore.desc.795061: "Este personaje forma parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, ha sido ampliado por los desarrolladores de PoD para dar mayor profundidad al escenario.\n\nA veces, a pesar de hacer algo que sobre el papel siempre sería lo correcto, el matiz de las circunstancias puede seguir llevándoles a montañas de problemas.\n\nThitkwa fue una de esas discípulas del venerable Piyau, una seguidora celosa y pintoresca de sus Caminos. Tras encontrar la muerte a manos de un hombre que venía del mar y ser Civilizada tras su escape del Infierno de los Mares Ardientes, Thitkwa abrazó la filosofía liberadora de Piyau, deleitándose en ella con un grado de celo y constancia que desafió incluso a algunos de sus discípulos predilectos.\nSin embargo, Thitkwa era quizás demasiado celosa, para detrimento de las realidades políticas en las que se encontraban las Flores de Sangre. Thitkwa, sin que nadie se lo pidiera, a menudo cazaba fantasmas y los masacraba, independientemente de sus vidas pasadas, con el fin de darles descanso y proteger al mundo de la presencia de la muerte. Incluso a aquellos bajo la protección de Piyau, incluyendo una colección bastante extraña de «fantasmas» en Indonesia.\nSin embargo, uno que intentó abatir resultó ser mucho más capaz de lo que ella creía, dándole una paliza que casi acaba con su no-vida mediante una poderosa necromancia, un mando absoluto sobre las Bestias y evadiéndola en cada momento. Enfurecida por el incidente diplomático, Piyau envió a Thitkwa al norte para que se probara a sí misma y abatiéramos al terrible horror que era el Devorador de Llamas. Thitkwa, furiosa porque Piyau perdonara a los fantasmas, decidió probar su valía en esta empresa, y luego pedir la aniquilación del fantasma tras su éxito.\n\nDestino futuro en el canon\nThitkwa tuvo un éxito parcial. Consiguiendo contactos de otros Ancestros y negándole al Devorador de Llamas su culto, logró derrotar al Devorador de Llamas, pero no matarlo. Pero para cuando lo hizo, Piyau ya se había dedicado a asuntos espirituales, y Mawar no tenía intención de lidiar con el temperamento explosivo de Thitkwa.\nDespechada y enfadada, recurrió discretamente a los sacrificios a la Reina de Hierro, deseando ser la primera en lograr tenderle una trampa, mientras se mostraba deliberadamente contraria para escharrecer a las Cortes Doradas al permitir el paso de otros Bebedores de Sangre que creía que podrían desbaratar las Cortes Doradas más adelante. Todo ello fue una serie de empresas necias que la llevarían a su fin definitivo en 1913, atrapada en un edificio en llamas provocado por su sucesora como Ancestro de Hong Kong, Anguo Chun."    
 POD_persistentpodlore.desc.795101: "Este personaje forma parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, ha sido ampliado por los desarrolladores de PoD para dar mayor profundidad al escenario.\n\nEn gran medida, la Orden de las Cenizas Amargas ha visto la amenaza que representan el [Glossary('Anda','podgloss.anda')] y, en términos generales, el Imperio Mongol, y en su mayoría, tienen poca capacidad (o, francamente, deseo) de actuar contra ellos hasta que empiecen a amenazar activamente las posesiones de la Orden. Sin embargo, un caballero se ha propuesto descubrir el verdadero alcance y la naturaleza de la Sombra Mongola sobre el mundo.\n\nTancred es un caballero de linaje bastante modesto que, a pesar de su diligencia y valentía, no ha llegado muy lejos en la mayoría de las Órdenes Militares Cainitas desde su Abrazo debido a su origen entre la gente común y no en la nobleza. Entre los Toreador de las Cortes del Amor, se sintió totalmente fuera de lugar, y el frío punzante de la Bestia le perturbaba enormemente.\nSu propio sire, un monstruoso moldeador de carne entre artistas, hizo que finalmente abandonara la decadencia del mundo nocturno de su Tierra Natal. Y entre los Caballeros del Grial, se entregó a ellos con una tenacidad decidida que impresionó a muchos, hasta el punto de ofrecerse voluntario para investigar el Imperio Mongol de primera mano y juzgar qué tipo de respuesta necesitaría el [Glossary('Anda','podgloss.anda')]. Algunos en la Orden sospechan que su orgullo es la principal fuerza que le mueve en lugar del deber, pero el tiempo dirá qué será de la Expedición de Tancred.\n\nDestino futuro\nLas intenciones de Tancred resultarían ser... menos que nobles. Los objetivos de Tancred pasarían de ser una fuerza de reconocimiento a ser más bien «conquistar y derrotar al [Glossary('Anda','podgloss.anda')] por su cuenta en aras de su propio orgullo».\nFinalmente perdería las bendiciones del Grial y respondería a ello recurriendo al infernalismo, desapareciendo en Rusia. La Orden repudiaría a Tancred y lo borraría de sus historias."    
 POD_persistentpodlore.desc.795102: "Este personaje forma parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, ha sido ampliado por los desarrolladores de PoD para dar mayor profundidad al escenario.\n\nEn 1229, la Corte de la Tortuga Negra, la institución $pod_kueijin$ que supervisaba los confines septentrionales del mundo, se vio sumida en cierta confusión cuando una mujer con poco parecido al hombre que puso en marcha la conquista del mundo se presentó ante los Ancestros de la Corte y formuló una afirmación verdaderamente audaz: que ella fue una vez él, el Señor Oceánico, Genghis Khan, antaño Temujin.\nAfirmaron que en su pira funeraria su cuerpo fue destruido, y que en su escape del Infierno se vieron obligados a tomar un nuevo cuerpo y un nuevo nombre. Y así, él había pasado de un aliento al siguiente.\n\nA pesar de lo absurdo de la afirmación, el Ancestro de la Corte que Tömörbaatar presentó también ha optado por no verificar realmente sus pretensiones y, en su lugar, hizo que Tömörbaatar continuara con los rituales de iniciación estándar que se consideran habituales. Tömörbaatar se siente indignada por esto, sintiéndose despreciada y privada de lo que debería ser su lugar legítimo.\nPero su audacia siempre ha conocido pocos límites, de una forma u otra. Y anhela un imperio tan grande como el que poseía en vida, al menos eso cree.\n\nDestino futuro en el canon\nDesafortunadamente para la historia de Tömörbaatar, entre los $pod_kueijin$ estaba Bortai la Bella, una de las consortes de Genghis Khan. Tras avergonzar públicamente a Tömörbaatar por la farsa de hacerse pasar por el Khan de los Khans y despojarla creíblemente de su título, Tömörbaatar fue trasladada discretamente al frente contra el [Glossary('Anda','podgloss.anda')], donde desaparece por completo de los registros.\nPero ellos establecerían una Tradición entre muchos recién muertos que afirmarían ser el regreso de Temujin. Si bien los $pod_kueijin$ serían más minuciosos con futuros pretendientes, sería difícil olvidar al primero en hacerlo."    
 POD_persistentpodlore.desc.793303: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nHace mucho, mucho tiempo, existió un erudito Jōmon y una bruja Jōmon. Ambos buscadores de la sabiduría en el fondo, el erudito asistió a escuelas de magia y acero, mientras que la bruja se alejó buscando rumores de criaturas en la noche. La bruja viajó lejos por instancia del erudito, alcanzando finalmente a una figura terrible de carne agitada y terror veraz.\nLa bruja, sin embargo, no buscaba el conflicto, sino un intercambio de poder. Profesó su lealtad al demonio que da forma a la carne y le pidió que la abrazara. El cambiante de la carne, queriendo ver qué le sucedería a una maga transformada por su maldición, accedió de inmediato. Y entonces, mientras la bruja era asesinada y probaba la sangre del monstruo, la magia del erudito la transportó de vuelta a su hogar compartido. Y cuando ella regresó, descubrió que el erudito ya no era un mero mago, sino un rey de demonios.\nElla se entregó de nuevo a su verdadero maestro, mientras ambos reían bajo las estrellas por el orgullo de su ambición. Y así Kagaseo se convirtió en el primer [akuma|E] de aquel que llegaría a ser el [Glossary('Rey Yama','podgloss.yamaking')] [Glossary('Mikaboshi','podgloss.mikaboshi')].\n\nDesde entonces, Kagaseo ha estado poniendo en marcha planes durante milenios. Esperando con cautela, seleccionó a tres mortales para tomarlos en su propio Abrazo y hacer que se arrodillaran ante [Glossary('Mikaboshi','podgloss.mikaboshi')]. Su Gran Clan era una herramienta de su señor, y con ese fin ella daría forma a su linaje para actuar donde su maestro no puede. Ha recibido amplias recompensas por su lealtad duradera, incluyendo el conocimiento prohibido que le permite acercarse a Caín.\nY ahora, mientras la Corte del Dragón Azul del $pod_kueijin$ se retira de Japón y se acerca la próxima Era, comienza a galvanizar a su linaje en su adhesión a su maestro. Su objetivo es reconstruir Japón a imagen de su señor, y ser quien lo corone como el [Glossary('Emperador Demonio','podgloss.demonemperor')]."    
 POD_persistentpodlore.desc.793304: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nMiyako vio cómo su mundo terminaba.\n\nMiyako era una entre muchos de los innumerables pueblos que vivían en Japón antes del ascenso del dominio Yamato. Pero cuando era niña, vio cómo empezaban a marchar hacia sus tierras. Su propio señor afirmaba ser descendiente de Susanno-o y lideró a su pueblo contra los Yamato.\nPerdieron, de forma horrible.\nMuchos de los soldados bajo el mando de su señor fueron pasados por la espada, y los soldados enemigos comenzaron a pisotear sus tierras. Así que Miyako, una simple aldeana, rezó y rezó por la liberación, por poder, por la fuerza para resistir. Pero ni un solo dios respondió. Y la noche en que su aldea fue quemada, algunos soldados se volvieron hacia ella.\nSe rieron mientras le hundían la cara en las brasas ardientes, pero entonces, en un instante, fueron silenciados. Lo único que ella vio al levantar la vista fue una tormenta, con relámpagos en sus ojos.\nEstaba muriendo, su rostro empezaba a carbonizarse por trozos. Le suplicó ayuda. Así que él se inclinó y abrió la boca. Y a la noche siguiente, Miyako despertó con la piel fría, el corazón inmóvil y una furia abrasadora en su pecho.\n\nSu salvador no apareció por ninguna parte. Pero ese día, hizo un juramento. La Furia que ahora aullaba y temblaba en su interior sería templada y convertida en una hoja feroz. Ella sería la hoja honorable en la oscuridad de la que otros como ella carecieron alguna vez. La primera de los Bushi Cainitas, la Chiquilla de la Tormenta.\n\nDesde esa noche, Miyako vagó por Japón sola, un fantasma en la noche que acababa con señores abusivos y mataba a soldados que atacaban a los conquistados. Con el tiempo descubriría que un bizantino sistema de cortes gobernaba la noche, y juró que su tolerancia hacia los males del día sería castigada con sangre.\nSe establecería en Amakusa, donde otros parias de la noche acudirían a su causa.\nSus chiquillos serían elegidos para estar a su lado con su celo, constantes y con un fuego contra la tiranía ardiendo en sus pechos. Y ahora, mientras su Tribu de Sangre se mantiene fuerte mientras las Cortes menguan, ella tendrá su ajuste de cuentas."    
 POD_persistentpodlore.desc.793305: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nSéptimo hijo del Emperador Kanmu y de la dama de la corte Ki no Wakako, Asuka nunca iba a heredar el trono. Sin embargo, se le permitió recibir la exhaustiva y extensa educación del palacio imperial, y creció hasta convertirse en un joven capaz y competente, una voz poderosa en la corte que podía tejer muchos relatos y contar cien más.\nFue aquí donde captó la atención de una figura enigmática que se hacía llamar Hiruko. Cuando Hiruko se encontró con Asuka en la noche, le pidió que le contara un relato. Asuka accedió y le tejió una historia tan impecable y cautivadora que Hiruko permaneció allí sentada toda la noche.\nSin embargo, al amanecer, Hiruko le suplicó a Asuka que lo escondiera en su habitación, lejos de la luz del sol. Siendo un noble, Asuka accedió. Y cuando la noche volvió a caer, tan impresionado por el honor de Asuka, que Hiruko «compartió» con él su don antes de marcharse, y ordenó que, aunque Asuka nunca gobernaría Japón como sus hermanos durante el día, podría gobernarlo durante la noche. Todo lo que tenía que hacer era arrebatárselo de las manos de los intrusos extranjeros.\n\nAsuka pronto descubrió que el mundo a su alrededor estaba lleno de otras cosas que acechaban en la noche, pero que él, de forma única, poseía el poder de hacer reales sus historias. La percepción, la ilusión, incluso la propia Alma podían ser moldeadas por la Sangre. Y sería un relato maravilloso si el Séptimo Hijo de un Emperador reclamara un derecho de nacimiento que nunca podría tener y se convirtiera en Emperador por derecho propio.\nAsí que comenzó a extender su alcance y a jugar sus cartas. Un rostro sonriente en las sombras, con ambiciones de un trono y del mundo que buscaba crear. Todo lo que necesitaría serían aliados.\n\nO eso dice la historia, según la cuenta Asuka. Y es una historia magnífica."
 POD_persistentpodlore.desc.793306: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLos fundadores de los Ika y los Koga están unidos, tanto en la vida como en la muerte. Yasu y Yū son hermanos gemelos idénticos, y originalmente herederos en competencia de un clan menor cuyo nombre se ha perdido en la historia. Mientras que Yasu era astuto, Yū era impetuoso. Sin embargo, ambos hermanos se resistieron violentamente a la introducción del Código Taihō, una iniciativa del Príncipe Osakabe para intentar hacer a Japón más confuciano.\n\nAmbos hermanos se resistieron violentamente a lo que consideraban influencia extranjera. Ambos fueron captados y sentenciados a muerte, pero la intervención de extrañas Bestias los llevó a la seguridad. Kagaseo les ofreció un trato similar: arrancar violentamente las influencias en Japón de las sombras extranjeras y servirle, siendo recompensados por ella y su maestro con la vida eterna. Ambos hermanos aceptaron.\n\nAl principio de su no-vida, Yū comenzó a usar la eternidad para perfeccionar su habilidad como maestro de armas. A diferencia de su hermano, más sutil, encontró una gran satisfacción como la espada de [Glossary('Mikaboshi','podgloss.mikaboshi')]. Al ocupar los roles más presentes de las ambiciones del Gran Clan, Yū pronto empezó a ser temido por los pocos $pod_kueijin$ que conocían al [akuma|E] del Gran Clan.\nSin embargo, sus crecientes frustraciones con su hermano y con los otros Chiquillos de Kagaseo, Michiko, provocaron el inicio de grietas dentro del Gran Clan. Aunque sabe que actuar contra ellos cuando Kagaseo está cerca es un suicidio funcional, anhela la oportunidad de atacar a Michiko por su presunción y a su hermano por su cobardía amante de las sombras.\n\nY quizás pronto, ese momento finalmente se presente..."    
 POD_persistentpodlore.desc.793307: "Este personaje ha sido creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nLos fundadores de los Ika y los Koga están unidos, tanto en la vida como en la muerte. Yasu y Yū son hermanos gemelos idénticos y, originalmente, herederos rivales de un clan menor cuyo nombre se ha perdido en la historia. Mientras que Yasu era astuto, Yū era impetuoso. Sin embargo, ambos hermanos se resistieron violentamente a la introducción del Código Taihō, una iniciativa del Príncipe Osakabe para intentar hacer Japón más confuciano.\n\nAmbos hermanos se resistieron con violencia a lo que ellos consideran una influencia extranjera. Ambos fueron capturados y sentenciados a muerte, pero la intervención de extrañas Bestias los puso a salvo. Kagaseo les ofreció un trato similar: arrancar violentamente las influencias de las sombras extranjeras en Japón y servirle, para ser recompensados por ella y su señor con la vida eterna. Ambos hermanos aceptaron.\n\nEn los inicios de su no-vida, Yasu destacó como el asesino de [Glossary('Mikaboshi','podgloss.mikaboshi')]. Como un fantasma, atacaba cualquier cabo suelto que empezara a ser consciente de la verdadera naturaleza del Gran Clan, y era, con diferencia, el usuario de la manipulación de carne más competente entre los Chiquillos de Kagaseo. Y por ello, él y su linaje eran temidos como un horror que acecha en la noche.\n\nSin embargo, las burlas de Michiko y la impetuosidad de su hermano le irritan inmensamente. No es estúpido, sin embargo, y sabe que Kagaseo los está vigilando. Así que, en su lugar, aguarda y hace tiempo. Espera con ansias el momento en que, cuando el monstruo no esté, el asesino juegue."    
 POD_persistentpodlore.desc.793387: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nMichiko del Clan Soga, fundadora de los [GetTrait('chibo').GetName(GetNullCharacter)], era hija de Soga no Emishi. Al ver la caída de su clan de primera mano en el incidente Isshi, habría desaparecido en la oscuridad junto a su familia si no se hubiera topado, mientras huía del incidente Isshi, con una mujer de cabello plateado y ojos sangrientos en la noche. La mujer era [GetScriptedCharacterByHistoryID('793303').GetFirstName].\n\nKagaseo le ofreció una elección. Morir en la oscuridad como estaba destinada, o terminar la obra de su familia y trabajar para erradicar las tradiciones de Japón desde las sombras. Michiko, enfurecida y rencorosa, aceptó. Kagaseo la Abrazó y le ordenó crear una Línea de Sangre propia. Michiko fundaría entonces los Chibo del Gran Clan a partir de su estirpe.\n\nMichiko se toma muy en serio su papel como la mayor del Gran Clan tras lo de Kagaseo. Es una maestra de Hoshi No Ryōiki, segunda solo después de Kagaseo, y sus chiquillos continúan su práctica.\nCon una presencia intensa en el clan, Michiko no acepta nada menos que la perfección. Y es por esa razón que no logra comprender por qué Kagaseo Abrazaría a [GetScriptedCharacterByHistoryID('793307').GetFirstName] y a [GetScriptedCharacterByHistoryID('793306').GetFirstName]. En lo que a Michiko respecta, ella es todo lo que Kagaseo necesitaba, y la falta de fiabilidad de Yasu y el celo testarudo de Yū son peligrosos cuando necesitan permanecer ocultos y no desviarse del Camino.\nPero sabe que su sire no la escuchará cuando le ruegue por la muerte de ellos, así que, en su lugar, espera y continúa guiando a sus sabios. Porque sabe que, a su debido tiempo, llegará el momento de Yasu y Yū."
 POD_persistentpodlore.desc.793334: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEntre el zoológico de horrores que emplean los Cultos de Vástagos de [Glossary('Mikaboshi','podgloss.mikaboshi')], una ejecución atroz sigue siendo la más temida tanto por los desertores como por los enemigos del clan. El acto de tomar a dos seres, mutilarlos y despedazarlos para reformarlos en un nuevo monstruo torturado. Dentro de los salones de la Ciudadela Malvada, un extranjero con estas artes, rescatado de una misión suicida y dotado de un nuevo propósito, trabaja en feliz ignorancia en aras de la creación.\n\nHannah es de Northumbria, de la aldea de Slaggyford. Abrazada originalmente para vigilar una capilla, Hannah era algo idiota, así que en lugar de simplemente destruirla, el $pod_clan$ de [GetTrait('tremere').GetName(GetNullCharacter)] le propuso formar parte de muchas expediciones al Este. A diferencia de otros que fueron enviados con #TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L Gárgolas#!#!, Hannah fue enviada sola. A pesar de lo que aquello suponía como misión suicida, logró llegar a China por pura suerte, antes de ser capturada en una Incursión Diabólica. Pero allí, la mente maestra de la incursión, [GetScriptedCharacterByHistoryID('793303').GetFirstName], vio una oportunidad. Kagaseo había visto otras expediciones y quería a sus Gárgolas. Así que le propuso a Hannah servirle a ella y a Mikaboshi, y Mikaboshi le revelaría a Hannah su fijación especial. Hannah, sin comprender del todo lo que esto implicaba, aceptó de inmediato, lista y emocionada. Fue traída a Japón con Kagaseo, donde puso inmediatamente a prueba sus conocimientos infernalmente adquiridos, formando varias castas enteras de nuevas Gárgolas a partir de los bebedores de sangre nativos de Asia Oriental. Las #TOOLTIP:STATIC_MODIFIER,POD_gargoyle_caste_bingmayong_modifier #P;L Bingmayong#!#!, las #TOOLTIP:STATIC_MODIFIER,POD_gargoyle_caste_kintsugi_modifier #P;L Kintsugi#!#!, las #TOOLTIP:STATIC_MODIFIER,POD_gargoyle_caste_rogata_modifier #P;L Rogata#!#! y las #TOOLTIP:STATIC_MODIFIER,POD_gargoyle_caste_totai_modifier #P;L Totai#!#! fueron sus creaciones, y se convertirían en las Gárgolas estándar que su estirpe formaría. Y así, se formó una nueva pirámide bajo el Rey Diabólico de las Estrellas.\n\nDestino futuro:\nLa posición de Hannah dentro del culto de Mikaboshi fue su salvación. Siempre rodeada de numerosas Gárgolas y a una distancia segura de los principales Tremere, su estirpe florecería dentro de los [GetTrait('chibo').GetName(GetNullCharacter)], [GetTrait('monomi').GetName(GetNullCharacter)] y [GetTrait('kishu').GetName(GetNullCharacter)] como magos y trascendentes manipuladores de la carne. Sin embargo, en las noches actuales, a medida que el cuerpo principal de los Tremere empieza a darse cuenta de la magnitud del error que supuso enviarla al Este, puede que no pase mucho tiempo antes de que los Tremere decidan atar cabos sueltos y evitar que Hannah destruya pactos y alianzas que ella nunca supo que existían."
 POD_persistentpodlore.desc.793309: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nNgải siempre ha acechado el Mar de China Meridional.\nSu vida mortal es en gran medida un misterio para su estirpe. Es uno de los más antiguos $pod_cainites$ en Asia Oriental, y su propia sire es igualmente misteriosa. Ella habla de cómo surgió de la arena mientras él pescaba en la noche y lo arrastró bajo las olas. Cuando Ngải regresó a la orilla, se abalanzó sobre sus compañeros pescadores con un frenesí de sangre desenfrenado y los dejó secos.\nVolvió a desaparecer en el océano, acechando los mares como un Azote en la noche. Sin embargo, en ocasiones, merodeaba cerca de la costa. Siempre sintió una afinidad especial por los pescadores y observó a algunos. Por corazonada, drenó a uno bajo el agua, se abrió su propia muñeca con los dientes y dejó que el cadáver bebiera. Cuando este se agitó y se convirtió en algo parecido a él, lo comprendió.\nAbrazó a varios más, mientras empezaba a dirigirlos a través de los mares. Los tiburones de estas aguas acechaban a sus personas favoritas, y él no lo toleraría.\nSu Línea de Sangre acecharía las costas y regresaría a las olas para luchar contra estos monstruosos hombres-tiburón. Y así, Ngải fundó la Línea de Sangre [GetTrait('anh').GetName(GetNullCharacter)] de los [GetTrait('gangrel').GetName(GetNullCharacter)], una estirpe de Marineros que acechan el Mar de China Meridional y hacen la guerra contra los Same-Bito."
 POD_persistentpodlore.desc.793310: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nA Naja le dijeron que era una señora. Aunque en vida nunca se sintió como tal.\n\nNaja era la hija de un menor jefe khitano bajo un nombre ahora perdido en el tiempo, nacida originalmente en los confines occidentales de donde habita su pueblo. Una noche, su clan fue atacado y sus posesiones saqueadas durante la oscuridad. Cogió su caballo y cabalgó con fuerza para huir, pero mientras atravesaba la naturaleza, una noche finalmente colapsó por el agotamiento durante su huida.\nUna extraña mujer de cabello pelirrojo y tez pálida la acogió y la abrazó. Educó a Naja sobre lo que era y la historia de su especie. Esta exploradora invirtió entonces en su propio destino, un feroz deseo de viajar que acabó por apoderarse de Naja.\nNaja se ocultó entonces en las sombras de influyentes khitanos, instándoles a ascender y convertirse en reyes. Pero cuando surgió la dinastía Liao, mientras viajaba, decidió que construiría algo para sí misma. Dirigiendo silenciosamente la construcción de una fortaleza en las montañas de Hamgyong, allí elegiría a personas con una mentalidad similar a la suya y las rodearía.\nAquí prosperaría su linaje, aislados y como arquitectos de su propio Camino. Y aquí adoptaría un nombre de la lengua de los lugareños: Naja.\n\nEn estas noches modernas, a Naja le preocupan enormemente los presagios que trae el viento respecto al [Glossary('Anda','podgloss.anda')]. Había comenzado a consolidarse aún más, llamando a su linaje para que tomara un firme control de las montañas. Se pregunta si ahora es el momento de terminar con su aislamiento y convertirse en reyes, no mediante la conquista, sino mediante la diplomacia, y rechazar al [Glossary('Anda','podgloss.anda')]."    
 POD_persistentpodlore.desc.793311: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nIndah es un fantasma, pero todo lo que habita en la noche a su alrededor conoce su obra.\n\nIndah fue una vez solo la hermosa hija de un granjero indonesio, notable únicamente por ser bastante bella en su aldea. Sin embargo, una tarde encontró a una mujer encapuchada huyendo de algo en la noche. Cuando la cosa le preguntó a dónde iba la mujer, Indah mintió, sospechando que podrían hacerle daño. Pero cuando se dio la vuelta, la figura oscurecida le dio las gracias, pero luego se disculpó por tener tanta hambre.\nSe sintió abrumada y murió allí mismo. Pero por ayudarla, la misteriosa mujer le obsequió su sangre. E Indah resucitó de la muerte mientras su cuerpo se retorcía en agonía. Todo su cuerpo se volvió translúcido, como si fuera un fantasma físico, además de sentir un ansia de sangre y repulsión por el sol.\n\nIndah fue maldecida a acechar Indonesia, pero lo hizo como un fantasma. Siempre débil, no dependía de la fuerza, sino del ocultamiento y los Animales.\nLos muertos también eran sus amigos, viendo parentesco en ella. Y cuando bebía demasiado y entraba en pánico, aprendió que podía hacer que otros fueran como ella, con los mismos dones y maldiciones. Se convirtieron en el [GetTrait('kuntilanak').GetName(GetNullCharacter)], los $POD_splat_vampire_plural$ de Indonesia, los hombres y mujeres blancos de las colinas, donde comulgan con los muertos y las Bestias en secreto."    
 POD_persistentpodlore.desc.793174: "Este personaje forma parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, los desarrolladores de PoD lo ampliaron para dar mayor profundidad al escenario.\n\nDiosa atrapada, hija bastarda de sabios, dragón en forma mortal: Ahn ha afirmado ser todas estas cosas y más, pero la verdad de tales asuntos elude incluso a ella misma.\n\nAhn no tiene recuerdos de su mortalidad. Todo lo que sabe es que sus recuerdos solo retroceden hasta los Mil Infiernos. Recuerda despertar en las profundidades del Infierno del Aceite Hirviendo, con una cadena alrededor del cuello mientras su alma era cocinada una y otra vez en grasa humana. Cada grito llenaba sus pulmones de aceite hirviendo, cada lágrima cocía su carne y cada espasmo privaba a sus músculos inmortales del oxígeno que ansiaban.\nPero luchó, ¡oh, cómo luchó! En sus espasmos y estertores de agonía, el agua arrastró varias reliquias hacia ella. Y finalmente, en la bruma de los infiernos, rompió sus cadenas con una sola escama negra y nadó con todas sus fuerzas hacia la superficie, emergiendo con una pluma ardiente en la mano, que la transportó de vuelta al mundo de los vivos, y al mundo de los $pod_kueijin$.\n\nAhn ha estado meditando sobre sus dos reliquias desde su escape de forma profunda e intensa. No sabe dónde encontró esta escama negra o esta pluma ardiente, pero está convencida de que son regalos del Dragón Ébano y el Fénix Escarlata. Por qué los tiene ella y nadie más lo desconoce, pero siente un gran sentido del deber ante este regalo.\nEncontrará la verdad sobre sí misma, pues todos sus cuentos exagerados podrían palidecer ante lo que realmente es.\n\nDestino futuro en el Canon\nSe convertirá en una especie de leyenda entre los sobrenaturales coreanos; su afán por compartir sus muchas aventuras (aunque la mayoría duda de la veracidad de tales relatos) y su estricta neutralidad política la convertirán en el lugar de encuentro pacífico más favorecido de la región.\nAlgunos seguirán convencidos de que posee la clave de un gran misterio que, tal vez, eligió olvidar."    
 POD_persistentpodlore.desc.793153: "Este personaje es parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, fue ampliado por los desarrolladores de PoD para dar mayor profundidad al escenario.\n\nDonde hay gran poder, cabría esperar que hubiera gran sabiduría. Y aunque Xiao puede afirmar tener ambos, ambas afirmaciones son más fáciles de decir que de demostrar.\n\nOriginalmente un magistrado menor que acumulaba riqueza en su vida mortal a tal escala que accidentalmente causó una hambruna, Xiao vio el fin de su primera vida cuando los campesinos asaltaron su mansión y le obligaron a comer grano crudo hasta morir, enviándolo así al Infierno del Aceite Hirviendo. Cómo escapó es desconocido; sin embargo, fue educado bastante bien en las Cortes del Emperador Amarillo.\nUn estudiante entusiasta que se obsesionó con la austeridad y la reserva, Xiao era visto como el modelo de piedad. Por ello, cuando el antiguo Ancestro de las Cortes del Dragón Azul se marchó hacia las [Glossary('Cien Nubes','podgloss.hundredclouds')], la Corte del Emperador Amarillo solicitó encarecidamente que Xiao tomara las riendas.\nA pesar de la protesta de los $pod_kueijin$ locales, las amenazas de conflicto lograron mantenerlos en línea cuando Xiao asumió el mando de la corte.\n\nSin embargo, el trauma de Xiao por el Infierno del Aceite Hirviendo condenó su reinado desde el principio. Al desmantelar su autoridad y supervisión sobre las Cortes del Dragón Azul y su falta de acción directa para mitigar el daño que las Guerras Genpei causaron a los ancestros de la Corte, la Corte del Dragón Azul ha entrado en una espiral descendente, lamentablemente predecible.\n\nDestino futuro\n\n Xiao no cambiaría. Un último esfuerzo por poner en línea a los desobedientes Ancestros de Japón fracasaría estrepitosamente y acabaría siendo expulsado de sus posesiones por sus vasallos restantes, desapareciendo en la oscuridad; solo se recordarían sus edictos de descentralización y su nombre."    
 POD_persistentpodlore.desc.795103: "Este personaje forma parte del $pod_wod$, pero solo cuenta con un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nSe dice que el camino al infierno está empedrado de buenas intenciones, una verdad que Ru comprende de un modo profundamente personal.\n\nSirviente de la corte de los primeros Han en vida, Ru creció desempeñando labores de servidumbre en la Corte Imperial, y durante casi toda su vida cada día fue idéntico al anterior. Pero un día llegó una delegación extranjera de otra nación que se proclamaba imperio, con una flota de presentes, soldados y sirvientes propios. Uno de los esclavos de aquellos extranjeros, un hombre llamado Lucien, llamó la atención de Ru, igual que Ru llamó la suya.\nSin embargo, el escándalo que se avecinaba, el de un esclavo y un sirviente de palacio, era algo que ninguno de los dos imperios quería, de modo que Lucien fue crucificado y Ru enterrado vivo. Ru, en el terror de su muerte, despertaría en los Infiernos de Ser Desollado Vivo.\nAtravesó sus yermos en un delirio enloquecido, buscando el contacto de su amado. Pero cuando llegó al Infierno de los Pecadores al Revés, encontró a su amado en el palacio de [Glossary('Tou Mu','podgloss.toumu')].\nAnte tan interesante oportunidad, se dice que Ru se vio obligado a enfrentarse a una elección imposible\n\nCuando Ru regresó al mundo mortal, logró recuperar la cordura a fuerza de voluntad. Fundaría la Corte de Jade, donde se haría célebre por su feroz celo al atormentar a los pecadores y su increíble diligencia al reunir textos y literatura.\nPero, a pesar de todo, extraños rumores rodean a Ru y a sus lecturas. Algunos Ancestros incluso han llegado a decir que quizá fue demasiado lejos en su encuentro con [Glossary('Tou Mu','podgloss.toumu')], aunque pocos se atreven a decirlo en voz alta.\nDestino futuro en el Canon\nLa revelación de Qiang como [akuma|E] sería lo que muchos consideran el giro hacia la Quinta Era. Para cuando Piyau Piyung se abra paso a través de las cortes del sur para librar batalla contra Qiang Ru en Changan, se descubrirá que la inmensa mayoría de la Corte de Jade ya había caído en la corrupción, lo que horrorizará hasta la médula a los demás $pod_kueijin$."    
 POD_persistentpodlore.desc.793336: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nMuchos dhampyr del Nusantara hablan en susurros de un terror que acecha en las junglas y que los caza a ellos en concreto: un infernalista $pod_kueijin$ del Infierno de las Larvas Cavadoras que ha desarrollado un gusto especialmente virulento por los hijos de los $pod_kueijin$. Y Bachtiar no querría que su fama fuera otra.\n\nEn vida, Bachtiar fue el curandero de su aldea, el pilar principal de su salud y su seguridad. Sin embargo, mientras su mentor lo instruía, Bachtiar se entretenía con las muchachas más jóvenes del lugar y no prestaba atención a sus estudios.\nCuando llegó el momento de trabajar, empleó su escasa experiencia no para sanar, sino para dar una ilusión de alivio. Con aceites prensados de serpiente, hierbas al azar y conocidos calmantes del dolor, muchos murieron a su cuidado, aunque no hasta después de abandonarlo.\nSu castigo llegaría, pues más tarde moriría solo y de forma horrible a causa de la viruela del amante. Y con toda justicia fue enviado al Infierno de las Larvas Cavadoras.\n\nBachtiar era débil. Escapó, pero en gran parte a base de súplicas y medicina de charlatán. Y cuando Rangda lo recapturó, en lugar de intentar abrirse paso a la fuerza o huir, le suplicó que lo perdonara y le ofreció lo que fuera a cambio.\nElla aprovechó la ocasión para ganar otro [akuma|E] y lo envió de vuelta al exterior, donde de inmediato volvió a entregarse a sus excesos. Descubriría que sus presas favoritas eran los dhampyr, en especial los más jóvenes, tanto para saciar su lujuria como su hambre.\nSu trono está cubierto de los huesos de incontables dhampyr devorados, mientras él se sacia con su esencia tras la muerte, delirantemente satisfecho de su poder."    
 POD_persistentpodlore.desc.793337: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEn las junglas de Indonesia hay un chamán que predica una doctrina radicalmente divergente. Habla de un dios enigmático que mostrará a todos el camino de la salvación, entregándolos a quienes fracasaron voluntariamente para iluminar el mundo terrenal.\nMuchos mueren en suicidios rituales que alimentan a su profeta. Y en esa base de poder se encuentra el [akuma|E] llamado Cahaya.\n\nCahaya fue siempre un hombre de fe, tanto en la vida como en la muerte. Seguidor de la religión tradicional javanesa, su espiritualidad salvaje ardía con una furia intensa. Veía las religiones foráneas como una amenaza, así que desde los catorce años empezó a buscar a santones extranjeros y a matarlos en el monte, en actos de violencia purificadora, según él los entendía.\nSu celo resultaba repelente: muchos lo tenían por completamente loco, incluso su propia familia. Así que tuvo que matarlos también, para que no le impidieran buscar revelaciones.\nAl final, el problema se resolvió solo: en una prueba de su fe meditó una semana en las colinas y halló su fin devorado por un cocodrilo.\n\nPero su muerte solo lo envalentonó. En el Infierno de los Pecadores al Revés, Cahaya la abrazó y se profesó devoto del dios que lo gobernaba, sin saberlo o sin que le importara. Al abrazarla, escapó por accidente del Infierno.\nNaturalmente lo interpretó como ser el profeta del amo de aquel Infierno, y volvió a predicar y a matar."    
 POD_persistentpodlore.desc.793339: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nDicen que el dinero es la raíz de todos los males. Harta es una de las muchas pruebas de esa afirmación.\n\nEn vida, Harta fue un mercader, y un avaro sin remordimientos. Había que exprimir a cada trabajador hasta los huesos, sacar tajada de cada trato, extorsionar a cada pobre granjero y repartir sobornos entre las autoridades para poder seguir. Dedicado sobre todo al comercio de alimentos y con matones a sueldo para extorsionar a los granjeros, Harta se hizo fabulosamente rico.\n\nY a pesar de toda su riqueza, de nada le sirvió cuando lo atravesaron con una lanza en un callejón y lo arrojaron a un río, donde murió vaciando las tripas boca abajo entre aguas fecales.\n\nSin embargo, Harta aplicó todas sus artes mientras caía en espiral hacia el Infierno. Aunque tardó, logró robar lo suficiente para sobornar su salida. Comprendió entonces que no tendría nada, y que semejante existencia era peor que la muerte. Así que acudió a la Señora Innombrable del Infierno del Aceite Hirviendo y le pidió poder a cambio de ser su agente.\nCuando regresó con la investidura infernal, puso de inmediato a trabajar los recursos obtenidos con el pacto. Acaparó con rapidez varios mercados locales y luego se aseguró de que encontraran al hombre que lo mató: mató a toda su familia, lo hundió en la pobreza y después lo desolló vivo. Cumplida su venganza, Harta vuelve a lo que siempre ha considerado el más alto propósito de la vida.\n\nGanar más dinero, tanto como sea posible, cueste lo que cueste."    
 POD_persistentpodlore.desc.793340: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nMuchos dirían que el poder puede expresarse de maneras que van más allá del mero control. La intriga, la influencia, el dinero, la religión: incontables medios de controlar a la gente. Purnama lo considera todo una farsa. El único poder es la fuerza, pura y simple. Y ella quiere gobernar, y tiene el poder para hacerlo; si alguien quiere detenerla, solo tiene que matarla.\nSeguramente los mortales que ha conquistado estarán contentos con ello, ¿verdad?\n\nLa vida mortal de Purnama se ha vuelto una bruma en el proceso de su muerte. Hasta donde sabe, siempre fue una buscadora de poder, hasta que unos hombres que no podían soportarla la mataron injustamente con una decapitación limpia. En Lanka vio la expresión pura de poder de Ravana y, en ese instante, comprendió el modo del mundo. Selló una serie de pactos con varios [Glossary('Reyes Yama','podgloss.yamaking')], con la intención de mantener libre su propia alma hasta el día en que pueda reclamar un Infierno propio y, después, su puesto predestinado como [Glossary('Emperador Demonio','podgloss.demonemperor')].\nPara ello usó su nuevo poder de $pod_kueijin$ para raptar a numerosos hombres y, cuando tuvo un hijo, se deshizo de todos ellos y usaría solo lo que ella misma creara para obtener poder. Y para ello se aseguraría de que sus hijos se mantuvieran sometidos.\nA quienes se resistían, le resultaba bastante fácil convertirlos en Demonios.\n\nEl mundo será algo hermoso que reclamar."    
 POD_persistentpodlore.desc.793341: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nAunque, según la cuenta de la Corte del Emperador Amarillo, los Dhampyr infestan las junglas de Nusantara, cuando muchos en el continente piensan en las locuras de sus Dhampyr, quien suele venirles a la mente es Putra.\n\nPutra era hijo de un hombre sin nombre y de Purnama, y desde su nacimiento fue educado para ser el marido ideal, un general perfectamente servil y un guerrero obediente pero temible. Y con tal fin, Purnama está sumamente complacida con su hijo y con su virilidad. Sin embargo, decir que Putra es inestable como consecuencia de ello es quedarse corto.\nDepende por completo de los elogios de su madre y está dispuesto a cometer actos de terror cada vez mayores por una sola frase de alabanza. Dispuesto a obedecer cualquier orden, por inmunda o profana que sea, solo por una caricia.\n\nSolo es un muchacho que quiere que su madre se sienta orgullosa.\n\nDestino futuro\nPutra fue, con mucho, un adversario más terrible para las conquistas de Piyau que su propia madre.\nAunque su nombre cayó en el olvido, llegaría a ser la mayor encarnación de la locura de la debilidad masculina entre los Dhampyr y reforzaría la costumbre de las [Glossary('Penangallan','podgloss.penangallan')] de no insuflar vida a sus hijos varones y, en mayor medida, su habitual contención a la hora de tener hijos. Pues, aunque el mundo ha olvidado al propio Putra, las Cortes Doradas no han olvidado sus Cruzadas de la Consternación."    
 POD_persistentpodlore.desc.793342: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nSiendo el hijo de algunos de los primeros musulmanes que llegaron a Malasia, el Rey de las Cenizas recuerda poco después de eso. Recuerda que murió joven y violentamente. Sus recuerdos de la Ciudad Demonio son igualmente borrosos, aunque recuerda que era bueno luchando allí.\nTanto que los Raksha tuvieron que rastrear sus movimientos durante un breve tiempo e informar a Ravana. A Yusuf le importaba poco. Simplemente quería luchar.\n\nLas cosas cambiaron cuando los Raksha dejaron de enfrentarse a él. Empezó a aburrirse, a irritarse, a desesperarse. Finalmente, en un frenesí de locura, irrumpió en el palacio de Ravana y fue rápidamente derrotado.\nRavana le dio una única opción: o bien le despojaba de sus extremidades y lo reducía a un juguete para los Raksha, o se le concedía un número infinito de enemigos con los que luchar como uno de sus [akuma|E].\n\nMientras Yusuf marcha al frente del ejército de sus demonios, su elección es sumamente clara. Quiere la guerra. Y solo la guerra."    
 POD_persistentpodlore.desc.793343: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nA veces puedes poner a un Diablo en una oveja, pero eso no evita que siga siendo una oveja. Y Wira es la encarnación perfecta de esa sabiduría.\n\nWira era un simple zapatero en vida, pero en general siempre fue asustadizo e isolationista. La mayor parte de su trabajo lo vendía en nombre de su hermana, mientras él se escondía fabricando sus zapatos. Era bueno en ello y se dedicaba con fervor a su trabajo, pero todo eso terminó cuando una banda de matones atacó su tienda.\nWira, en esta hora de necesidad, ofreció en su lugar venderles a su hermana, darles su pequeña tienda y hacer cualquier cosa que le pidieran si no le hacían daño. Para sorpresa de todos, su hermana, horrorizada por todo aquello, agarró una de las lanzas de los matones y se la clavó en el ojo.\n\nIncluso cuando acabó en los Infiernos, era espantoso y temeroso, y se escondía de todo, renunciando voluntariamente a muchos otros a la Muerte Definitiva con tal de asegurar que nunca tocaran su propio pellejo.\nCuando finalmente fue capturado, se doblegó de inmediato, suplicando ser convertido en un [akuma|E] con tal de que le perdonaran la vida. Al verlo como alguien inofensivo y un problema potencial adicional para cualquier $pod_kueijin$, fue enviado de vuelta al mundo de los vivos, donde se esconde y envía demonios para intentar matar cualquier amenaza que lo aceche."    
 POD_persistentpodlore.desc.793344: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the $pod_wod$.\n\nVoracidad encarnada: varios pueblos aislados escondidos alrededor de un templo presentan sacrificios ante una horrible criatura, mientras una hueste de demonios exige ofrendas tanto de grandes cantidades de comida como de doncellas, para evitar ser saqueados por la noche. En el templo, profanado con sangre, comida podrida, mujeres mortales y tanto $pod_kueijin$ capturados como otros, se encuentra el odiado [akuma|E] Sabri.\n\nEn su mortalidad, Sabri era un noble mujeriego y monstruoso, a quien poco le importaba nada que no fuera lo que podía conseguir y la rapidez con la que lo obtenía. Tenía la costumbre de recorrer sus feudos y tomar a cualquier mujer que le gustara como consorte, matando felizmente a sus maridos o padres si protestaban, y a sus hermanas y madres como más consortes si se resistían.\nPero como era de esperar, una vida miserable exigía una muerte miserable, así que murió de sepsis, solo en su diván, después de que, demasiado obeso para levantarse, se le dejara pudrir hasta la muerte en sus propios excrementos.\n\nSin embargo, sus depravaciones no terminaron ahí. Como demonio, pronto empezó a ejercer su voluntad una vez más con fuerza demoníaca, y varios otros que sometió a su servicio fueron tan malos que se sacrificaron para ayudarle a encontrar su propia salida.\nY aun así, con un trabajo tan ajeno a él, empezó de inmediato a negociar con los [Glossary('Reyes Yama','podgloss.yamaking')], queriendo mujeres y lujos a cambio de ser su mano en el mundo de los vivos. Todo lo que tenía que hacer era aumentar el sufrimiento de quienes le rodeaban, lo cual, dado el tipo de hombre que era, le resultó más que fácil de cumplir."    
 POD_persistentpodlore.desc.793345: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the $pod_wod$.\n\nEntre las mujeres de la noche, circulan rumores sobre un maestro secreto que se lleva su justa parte de monedas para protegerlas de clientes terribles. A algunas se les conceden dones superiores, desde una belleza extrema o armas para protegerse, hasta favores aún más extraños. Y en el corazón de todo, la araña secreta en el centro de esa red es Nurhayati, que transmite demonios a través de sus redes de trabajadoras sexuales y burdeles.\n\nNurhayati es extremadamente reservada sobre su Camino y, según su propia versión de la historia, simplemente fue una esposa que murió por una infección, una muerte bastante común para los campesinos. Sin embargo, su extenso conocimiento del Estilo de vida y la administración de las trabajadoras sexuales sugiere una vida mortal más sombría, un destino no del todo desconocido para muchos $pod_kueijin$.\nNo obstante, su propia huida del Pozo de Sal y Hierro y su tiempo en los Burdeles de Hierro la transformaron en quien es ahora, independientemente de ello. Tras escapar, renunció inmediatamente al [Glossary('Dharma','podgloss.dharma')] y, en su lugar, se aferró a la mortalidad; con ese fin, puso su suerte en manos de los [Glossary('Reyes Yama','podgloss.yamaking')] como guardaespaldas.\n\nPara sus propios fines, Nurhayati utiliza a sus trabajadoras sexuales para propagar espíritus demoníacos entre sus clientes, convirtiéndolos en Bakemono leales. Es un proceso lento, pero la experiencia y paciencia de Nurhayati han demostrado tener una base sólida para el éxito.\n\nY si tiene tiempo, podría ser el [akuma|E] que una Nusantara."    
 POD_persistentpodlore.desc.793346: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nAunque es doctrina estándar entre las augustas cortes que los [akuma|E] son, sin duda alguna, aquellos totalmente quebrantados por la locura por parte de sus maestros infernales, pocos lo encarnan tanto como Kasih.\nDondequiera que aparezca desde sus retiros ocultos poblados por locos y demonios, siempre está carcajeando, enloquecida por lo que sea que haya transcurrido en los Infiernos. A través del dolor y el placer, la dicha y la desgracia, el fanatismo y el fatalismo, Kasih lo recibe tal como recibe todo lo demás: con los ojos desorbitados, la boca abierta, goteando sangre y frenética en el éxtasis de la matanza. Más allá de eso, es un misterio.\n\nEn sus momentos lúcidos en sus retiros, siempre está susurrando, hablando siempre de los tiempos venideros. De carne y sangre, de feminidad coronada de sangre. Quizás se ve a sí misma en ello.\nO quizás ve otra fuerza comenzando a surgir de las selvas..."    
 POD_persistentpodlore.desc.793313: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nHideaki recuerda su servicio mortal con afecto, aunque estuviera condenado. Considerado el más presentable de los Chiquillos originales de Miyako, es augusto, diplomático y respetable. Pero una sombra pende sobre él, un fuego latente que se niega a extinguirse.\n\nHideaki pertenecía al pueblo Emishi. Era un soldado bajo el jefe Emishi de los Isawa, considerados bárbaros por los Yamato.\nEn las buenas y en las malas, Hideaki luchó con su señor leal y orgullosamente. Sin embargo, cuando Aterui se rindió, Hideaki se horrorizó y enfureció. Buscó a su señor para suplicarle que lo reconsiderara.\nPero la noche que lo hizo, mientras se dirigía al campamento de su señor, fue emboscado por un maestro de armas y guerrero de una habilidad aterradora. El maestro de armas, conocido solo por él como «la Espada del Gran Clan», humilló y derrotó estrepitosamente a Hideaki, quien le propinó cien cortes antes de abalanzarse sobre él para drenarle la sangre.\nPero mientras Hideaki agonizaba, un rayo golpeó de vuelta a la Espada del Gran Clan, y este huyó ante un guerrero enmascarado. El guerrero le ofreció un trato: morir y seguir adelante, o abrazar la noche y luchar contra los tiranos por siempre. Hideaki aceptó, y Miyako Abrazó a su segundo Chiquillo.\n\nLa muerte cambió a Hideaki. Aprendió que la franqueza era peligrosa y la reservó para cuando fuera necesario. Era carismático, orgulloso y dominaba la estancia.\nPero todo esto era para avanzar en los objetivos de la Tribu de Sangre. El mismo fuego de venganza por el pueblo pisoteado por los conquistadores arde en él, aunque de forma más sutil.\nAspira a ganar, por cualquier medio que pueda, más allá de los métodos más directos de su sire."    
 POD_persistentpodlore.desc.793312: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nDada su Sire, Yoshino es un giro radical de lo que cabría esperar. Lasciva, impulsiva y testaruda, la Chiquilla mayor del Fundador de los Bushi es a menudo considerada una insolente, pero bajo eso hay una ira demasiado familiar para su Sire.\n\nYoshino nació de padres Emishi en una ciudad Yamato en Miyagi. Nacida sin nada y tratada como una extraña, Yoshino, por necesidad, se convirtió en trabajadora sexual desde muy joven; cada día era una Contienda para poder alimentarse una y otra vez.\nSin embargo, cuando los Yamato comenzaron a reprimir la resistencia Emishi en general, los guardias señalaron a Yoshino como una posible espía Emishi. Robada y arrastrada en la noche, fue golpeada repetidamente por los guardias, quienes le exigieron que revelara cualquier secreto que se creyera que poseía.\nComo no tenía nada que decirles, continuaron hasta que la muerte fue casi segura.\nPero mientras moría, una extraña tormenta comenzó a soplar y, en cuanto empezó a llover, notó lo extraño de que fuera roja.\nPerdió el conocimiento y, cuando despertó, sus labios estaban Pura Sangre y su Sire Miyako estaba sobre ella.\n\nDesde que recibió una segunda oportunidad en la vida, Yoshino la ha utilizado para entregarse a las cosas que siempre le habían sido negadas. Luchar y matar con la espada en mano, sexo bajo sus propios términos y el poder de no aguantar mierdas: todo eso era suyo.\nDisfrutó de su don y atesoró la segunda oportunidad que se le otorgó."    
 POD_persistentpodlore.desc.793314: "Este personaje fue creada por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nMasami era, en gran medida, una nadie. Solo una mujer joven que una vez se interpuso en el camino de una mujer mucho más poderosa. Antiguamente una doncella del santuario, originalmente parte de una delegación temprana enviada a las tierras Emishi recientemente conquistadas tras la Guerra de los Treinta y Ocho Años.\nEn aquel tiempo, ella y el resto del personal del templo enviado allí habían contratado a un guerrero bastante extraño, que nunca se marchaba de día y, en su lugar, los vigilaba diligentemente por la noche. Algunos de los sirvientes que trataban mal a los Emishi desaparecieron en la noche, pero la propia y cansada amabilidad de Masami hacia ellos hizo que el guerrero se encariñara con ella.\n\nSin embargo, una noche, mientras preparaba un rito, oyó un grito; una figura horrorosa con una magia elemental espantosa estaba arrasando el santuario. Este santuario la había ofendido de algún modo, así que la mujer, llamándose a sí misma la Sabia del Gran Clan, estaba reduciendo a sangre a todos los sirvientes presentes.\nMasami fue la última, mientras suplicaba y rogaba que alguien la salvara. La Sabia simplemente se rió, drenó la sangre de Masami y la dejó agonizando en el altar. Pero mientras suplicaba a cualquiera que quisiera escucharla que la salvara, el guerrero entró arrastrándose, herido pero aún en pie.\nEl guerrero escuchó su plegaria, acercó una herida a los labios de Masami y la Abrazó en los Bushi.\n\nLos estudios de Masami habían resultado útiles. Entre los líderes de la Tribu de Sangre, llegó a convertirse en la principal especialista arcana. En parte debido a que las rutinas y Rituales le resultaban naturales, pero también por el deseo de superar a quien intentó matarla.\nEl mismo fuego que ardía en todos ellos también ardía en ella, aunque de forma distinta.\nY tendrá su venganza, o morirá en el intento."    
 POD_persistentpodlore.desc.795014: "Este personaje es parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, ha sido ampliado por los desarrolladores de PoD para aportar mayor profundidad al escenario.\n\nIndra, desde el momento en que respiró por segunda vez, no recibió nada más que la tormenta.\n\nLa segunda «hija» de Sita y discípula de Shiva-Ohm, Indra-gha estuvo entre los miembros fundadores de la Cara de los Dioses, presente desde el principio. Recordando poco de su vida mortal, e incluso menos de su tiempo en los Mil Infiernos —más allá de un horrible viento de desollamiento y tormentas de hierro—, llegó a atesorar profundamente la nueva familia en la que fue integrada.\nPero mientras sus compañeras discípulas se aislaban en su búsqueda de la Iluminación, ella eligió integrarse en el centro de su colectivo. Aquí es donde muchas habrían flaqueado, ya fuera por la falta de Presencia, la falta de voluntad o la falta de habilidad para establecer un Camino centrado en la exaltación del ser por encima de todo.\n\nPero Indra-gha se sintió como en casa en el Ojo de la Tormenta. Tanto que se convirtió en la divinidad que buscaba.\n\nCon el tiempo llegaría a convertirse en el centro del poder temporal dentro de la Tribu Celestial. Mediante una combinación de ambición, tenacidad y carisma, lograría mantenerlos unidos. Aunque no era una general, su capacidad para equilibrar a los que lo eran con los que querían serlo, y su habilidad para elegir las batallas, permitió que la Tribu Celestial resistiera los asaltos por todos los flancos durante la Guerra Eterna.\nY mientras el mundo avanza hacia la siguiente Era, ella continúa este baile salvaje mientras los titanes chocan en la tormenta que la rodea, continuando su persecución del corazón de la misma por el bien de su nueva familia y su propia grandeza.\n\nDestino futuro en el canon\nLa arrogancia de Indra-gha en el corazón de la tormenta que es la Guerra Eterna no carecía, al menos, de mérito.\nIncluso a través del tumulto de la Larga Noche, el Azote de los [Glossary('Anda','podgloss.anda')], la formación del Quincuncio e incluso la Semana de las Pesadillas, Indra-gha lideraría a la Tribu Celestial hacia la modernidad, con suficiente poder político y astucia diplomática como para enviar enviados a sus enemigos tradicionales en aras de unirse contra las amenazas de las Noches Finales."    
 POD_persistentpodlore.desc.793335: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nA pesar de haber nacido como un medio para un fin, un mero instrumento para iluminar a su madre, a veces solo hace falta el impulso adecuado para elevar a una persona hacia una causa mayor.\n\nHija de Wati y de un hombre anónimo y no particularmente importante, Nidhi fue, desde el momento en que su madre la acunó por primera vez, bañada en amor y afecto infinitos. A pesar de la reputación de su madre como una berserker empapada en sangre que goteaba las entrañas de cualquier [akuma|E] Piyau que se le cruzara, Nidhi se convertiría en una persona radicalmente distinta al sostener a su hija, a quien juró darle también el mundo.\nNidhi creció entre los Monos Desolladores y aprendió sus costumbres. A pesar de las reservas de la mayoría de ellos respecto a los niños, Nidhi se convirtió en una hija para todos ellos. Fue cuidada, no conoció ninguno de los dolores que su madre o sus compañeros jurados enfrentaban y, a pesar de no tener sangre noble, vivió como una princesa.\nInstruida en encantamientos y recibiendo la mejor educación que su madre pudo costearle, fue preparada para la mejor vida que Wati pudiera darle.\n\nY fue por esa razón que la noción de un predicador, hablando de la naturaleza caída de los $pod_kueijin$, y de que los Dhampyr eran reflejos miserables de un poder superior, hizo que Nidhi finalmente conociera la Furia que ardía en el corazón de su madre.\n¿Quiénes eran esos impudentes miserables para atreverse a cuestionar a sus padres? ¿Qué locura predicaban al decir que las personas que le dieron un mundo perfecto eran degenerados corruptos de algún poder más noble? ¡Qué insulto que se atrevieran a llamar degenerados a tales amados hijos! ¡Qué profanidad decir que su madre nunca la amó!\nNo, una vez que Nidhi escuchó esto, buscó al predicador con un hacha, intentando partirle la cabeza allí mismo. Y cuando este huyó, ella juró encontrarlo y estrangularlo con su propia lengua por semejante insulto.\nCon el tiempo, la Furia de Nidhi evolucionó, viendo a los Hijos Dorados que los Dhampyr fueron alguna vez como necios engreídos, cuyos ecos debían ser extirpados para salvarlos en el presente.\n\nY si necesitaba perseguirlos hasta las entrañas del infierno para terminar con sus mentiras, entonces partirá, desgarrará, mutilará, matará, quemará y destripará, hasta que esté hecho."    
 POD_persistentpodlore.desc.795030: "Este personaje es parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, fue ampliado por los desarrolladores de PoD para aportar mayor profundidad al escenario.\n\nWu Zetian es una mujer que no necesita presentación. Nacida como hija de un funcionario de la madera y una mujer noble, la joven, alentada a leer y escribir, mediante la astucia, la ambición, la crueldad y el empuje, se apoderó de todo el Imperio. No solo a través de un hijo o un esposo, sino en su propio nombre. Y luego, tras una serie de malas decisiones y vientos políticos, fue destituida del poder en el ocaso de su vida, y murió tras años de lucha contra la enfermedad.\nPero ahí no terminó su camino. Y por subvertir su lugar como concubina convertida en Emperatriz, el Infierno de los Pecadores Al Revés le esperaba.\n\nTras toda una vida de Contienda, la locura del Infierno la destrozó y la rehizo mil veces en la agonía de ese Infierno. Milenios en momentos, un momento en décadas, un trono de mendigos, un contenedor de coronas, ejércitos de pacifistas, sabios sin trabas, mentiras en verdades, desplomarse por un solo paso y pasos que son caídas desde los cielos.\nCada preocupación se convirtió en siglos de trauma, cada duda en una parálisis de terror. Y un darnos cuenta. Y una vez que se dio cuenta, no pudo parar. Y en un momento, suplicó volver a casa.\n\nAsí que el señor del Infierno la envió de vuelta al mundo de los vivos, despierta en su tumba con pulmones aún funcionales, un cuerpo rejuvenecido y todo lo que había aprendido. Y una Furia que su cuerpo no podía contener.\n\nWu fue encontrada por los $pod_kueijin$, y con su ira, fue enviada a los Tigres Diablo. La ira en ella se convirtió en un crisol. Ver todo lo que logró, todo lo que hizo reducido a un monumento vacío, sumado al sufrimiento que soportó, se convirtió en un crisol de venganza ardiente.\nElla crearía una nueva grandeza, una obra maestra de rencor, y tomaría el poder bajo sus propios términos sin arrodillarse. Cabalgando a su demonio como un carro, la luz cegadora y la oscuridad que le sigue, una Emperatriz renacida que, si no podía gobernar todo bajo el Sol, gobernaría todo bajo las estrellas.\n\nNo importa cuánto tarde. Wu Zetian recuperará su Imperio."    
 POD_persistentpodlore.desc.793347: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSe dice que en la base de la garganta del mundo hay una canción. Muchos de los Muertos Hambrientos la buscan, pero pocos cuidan la tierra que conduce a ella. Uno de los pocos afortunados que se daría por satisfecho sería el venerable Tenzing, Guardián de Shigatse. Sin embargo, mientras los vientos del norte comienzan a aullar, se ha visto obligado a actuar.\n\nTenzing nació durante la decadencia de la Dinastía Yarlung, rodeado del caos que naturalmente acompaña a un imperio en declive. Mientras la mayor parte de su Tierra Natal se sumía en el pánico con el asesinato del Rey Darma U Dum Tsen, Tenzing vio en ese caos una oportunidad para lucrarse. Transformando su pequeña aldea en un supuesto «refugio», en realidad pagaba a matones para asaltar y matar gente en su camino hacia la seguridad en pasos de montaña estratégicos, usando el caos de la época como cobertura.\nSe hizo fabulosamente rico, pero eso sirvió de poco para protegerlo cuando, durante esta Era de Fragmentación, uno de los supervivientes de la incursión logró descubrir su traición, lo secuestró y lo dejó morir por la exposición en el Himalaya, enviando su alma disparada al Infierno de ser Desollado Vivo.\n\nLa experiencia fue intensamente aleccionadora, ya que a Tenzing se le despojó de todo lo que tenía y de todo lo que era. Aunque finalmente logró escapar, se convirtió en un asceta, detestando la riqueza y dedicándose al aprendizaje. Ascendió entre los monjes de Shigatse, propuso numerosas teorías críticas e impulsó sus cacerías de demonios.\nSin embargo, cuando Fan se retiró y Da asumió el liderazgo de la Corte del Tigre Blanco, el necio tuvo la audacia de intentar imponer una supervisión más profunda sobre los monjes de Shigatse. Por ello, rechazaron las súplicas de ayuda de Da cuando el [Glossary('Anda','podgloss.anda')] comenzó a corroer la Corte, y Tenzing, el líder de los monjes en aquel entonces, vio cómo se desmoronaba. Pero ahora, Tenzing se lanza una vez más al caos, buscando reconstruir la Corte del Tigre Blanco en algo más parecido a lo que los de Shigatse imaginaron cuando se unieron.\nTodo lo que debe hacer es tener éxito donde una vez fracasó, y prosperar en el caos.\n\nDestino futuro\nLos monjes de Shigatse, aunque fuertes, estaban demasiado aislados para hacer mucho contra el [Glossary('Anda','podgloss.anda')]. Pero mientras la mayoría de los otros exiliados huían hacia el Este, él ordenó que se ocultaran y fortificaran el Himalaya contra el [Glossary('Anda','podgloss.anda')].\nTenzing simplemente se retiraría a sus investigaciones tras esa última orden, para dedicarse una vez más a su estudio sobre los Corruptos y los Semidemonios."    
 POD_persistentpodlore.desc.793348: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nIncluso si Fan se retirara de su imperio, entre sus compañeros hay quienes intentarían asegurar que todo lo que construyó no se desmorone. Y entre los Cuernos de Hielo, Fu Hao permanece donde siempre ha estado: en la vanguardia.\n\nEn vida, Fu Hao fue una de las 64 esposas de Wu Ding de la dinastía Shang, casada como parte de una alianza entre los Shang y una de las tribus periféricas de su dominio. Fu Hao destacó entre las esposas de su marido por ser una líder capaz e inteligente, con una mente brillante para los asuntos militares. Ascendió entre ellas hasta convertirse en la segunda esposa de Wu Ding, sacerdotisa, oficial militar y general, poseyendo tierras a su propio nombre.\nSus campañas la elevaron a ser la mayor general de Wu Ding al mando de su ejército más numeroso y, aunque murió antes que su marido, fue enterrada con honores en su capital.\n\nPero para Fu Hao, despertó de la muerte en Lanka, convertida en un demonio por sus conquistas. Sin embargo, a través de los tormentos, perseveró, y las oraciones de su marido pidiendo su guía la condujeron de vuelta a los vivos. Y cuando Wu Ding murió, su esposa guerrera le hizo una última visita final, asegurándose de que ella estaría allí sin importar qué.\nY cuando él pasó a lo que fuera que siguiera, ella se unió a la sociedad de los $pod_kueijin$ con deferencia y respeto.\n\nLa experiencia militar de Fu Hao, su templanza, diligencia e inquebrantable resolución en batalla la llevaron al ámbito de Fan, donde la imponente y formidable mujer aceptó un lugar dentro de su [Glossary('Wu','podgloss.wu')] como su guerrera. Un estudio de la Secta de las Diez Estaciones y una resolución fría le otorgaron una posición fundamental en la corte de Fan, y cuando se retiró, Fan intentó respetar sus deseos y se arrodilló ante Da. Pero cuando el [Glossary('Anda','podgloss.anda')] comenzó a llegar e intentó reunir un ejército, Da se negó a enviarle hombres, lo que provocó el saqueo de varias Cortes.\nAl no tolerarlo más, se separó de las Cortes y reunió su propio ejército, poniendo en marcha la disolución de la Corte. Ahora, ella reúne las fuerzas para reconstruir la Corte de Fan, y para llevar la lucha contra el [Glossary('Anda','podgloss.anda')] y verlos dispersos.\n\nDestino futuro\nLas fuerzas que pudo reunir no fueron suficientes para detener al [Glossary('Anda','podgloss.anda')]. Con la Corte del Tigre Blanco dividida, fue una presa fácil para los invasores. Leal a su [Glossary('Wu','podgloss.wu')] hasta el final, Fu Hao desapareció sin dejar rastro, siendo vista por última vez luchando contra el [Glossary('Anda','podgloss.anda')] mientras el resto de los Cuernos de Hielo huían hacia lugares desconocidos."    
 POD_persistentpodlore.desc.793349: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nMuchos Dhampyr viven una mentira. Sufren, sangran, lloran, suplican, rezan, todo en vano. A veces, sin embargo, la última gota hace que el animal de carga colapse. Y mientras algunos se derrumban, otros contraatacan. Y Reyhangül quiere una libra de carne.\n\nReyhangül era la hija de una mortal secuestrada y un monstruo devorador de carne. Llamada «Caminante de las Sombras» desde su nacimiento, se le inculcó que toda su vida sería un objeto de diversión para su padre, y que su agonía sería el poder de su verdadero dios. Al crecer sola con solo su padre, no necesitó historias del Infierno a las que rezar, porque no había un día en el que no lo viviera.\nSus sueños estaban acechados por la luz y la servidumbre, por una muerte repetida mil veces en su mente. Y cuando tuvo edad suficiente, su padre la tomó como esposa para cumplir el propósito para el que nació.\nMás rezó y suplicó en secreto a la luz que una vez derribó a los monstruos de sus sueños. Desafortunadamente, esa no fue la que respondió. Otros demonios sedientos de sangre encontraron a su padre y, tras una batalla, se los llevaron a ambos a las montañas.\nAllí fue torturada día y noche, con sus captores diciéndole que era un monstruo. Pecadora, malvada y merecedora de dolor, mientras que lo único que Reyhangül podía sentir era confusión y terror. Empezó a encontrar consuelo en los demonios ardientes de su sueño, deleitándose en los momentos en que morían con agonía, deseándolo fervientemente.\nFinalmente, una noche su sueño fue interrumpido por un látigo y, en la bruma del dolor y el sueño, usó sus uñas descuidadas y sus colmillos malvados para despedazarlos. Reunió más almas condenadas, se las llevó y huyó de regreso a las tierras que recordaba.\n\nTras tomar los libros que poseían, las cosas cobran un poco más de sentido. Reyhangül sabe que es una de las Hijos Dorados, traicionada, masacrada y renacida en un estado inferior. Lo mismo ocurre con todos los demás Dhampyr con los que huyó.\nAlgunos se conforman con sus padres, pero ella conoce la verdad. Sabe que debe evitarles la tiranía de sus progenitores. No, la inminente maldad de los muertos debe ser erradicada y arrancada.\nLos $pod_kueijin$ están condenados. Todos deben ser barridos para que sus hijos, una vez asesinados, pongan las cosas en orden. Tiene que ser eso.\n\nTener que serlo.\n\nTener que serlo."    
 POD_persistentpodlore.desc.793350: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEntre muchos dentro de las Cortes de los Muertos Hambrientos, existe el estereotipo común de que casi todos los $pod_kueijin$ de la India son de algún tipo de herejes. Entre esos detractores en la Corte del Tigre Blanco, el Jabalí está ahí para... mostrarles elocuentemente el error de su sabiduría.\n\nNarayan, en su vida mortal, vivía a orillas del Golfo de Bengala. Pescador toda su vida, vivía bajo el principio de que si su vida iba bien, no había mucha razón para cambiarla. Aburrido y constante, tuvo una vida muy mundana hasta que un día, mientras pescaba, enganchó accidentalmente a un tigre que nadaba, y fue rápidamente ahogado y devorado por el iracundo Khan. Y por el pecado de herir a uno de los campeones de la Madre Esmeralda, fue arrojado al Infierno de los Mares Hirvientes.\nA pesar de la injusticia de todo aquello, aceptó su infierno y se hundió hasta el fondo, cayendo a través de una cueva y despertando después en el mundo mortal, en las costas. Cuando el [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] lo encontró, simplemente estaba pescando una vez más.\n\nNarayan fue llevado a la Corte, donde, tras una sola discusión con su [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')], fue enviado inmediatamente a las Cortes de los Ocho Lotos en Flor. A pesar de su temperamento, Narayan se adaptó como un pez en el agua, y a veces incluso discutía con sus mentores, logrando que cambiaran de opinión sobre ciertos temas o asuntos.\nSu decidida y colérica Fortaleza lo convirtió en un representante ideal de las Grullas Resplandecientes, y su previsibilidad y lealtad lo hicieron amigo cercano de Fan, convirtiéndose fácilmente en un Guardián dentro del [Glossary('Wu','podgloss.wu')] de los Cuernos de Hielo. Y aunque no le dio tregua con sus amonestaciones por su retiro, finalmente cedió al convencerle de que muy poco iba a cambiar.\nPero la perturbación causada por la llegada del [Glossary('Anda','podgloss.anda')] fue tal molestia para él, que cuando Fu Hao comenzó a reunir fuerzas contra ellos, se unió a ella, decidido a llevar a esos alborotadores a la calma de la tumba y restaurar el orden una vez más."    
 POD_persistentpodlore.desc.793351: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nIncluso en una corte tan laxa como la de Fan, dada la naturaleza sediciosa y espantosa de sus enemigos, sería un necio no tener un maestro de espías. Y siempre en las sombras de la corte de Fan, el Milpiés estaba presente.\n\nErke-kara nació en las estepas hace mucho tiempo, pero habla poco de esa época de su existencia. Como uno de los innumerables perdidos por una fiebre, fue encontrado por el [Glossary('Civilizador del Diablo Infantil','podgloss.infantdevilcivilizer')] todavía cubierto de la vermina del Infierno de las Larvas que Excavan, sacudiéndoselas todavía como una bestia salvaje. Pero cuando fue presentado, siempre se mantuvo fuera de la vista.\nRápidamente acudiendo ante sus señores, susurraba entre las cosas pequeñas y observaba a través de una red de espías para mantenerse siempre alerta, vigilando constantemente cualquier amenaza. Ascendiendo lentamente mediante ascensos y recomendaciones, encontró su lugar predilecto en la corte de Fan, ya que adoraba la confianza general que ella depositaba en él.\nSin hacer demasiadas preguntas cuando [akuma|E] desaparecía, sin indagar demasiado cuando surgían amenazas potenciales. Y cuando ella se retiró, ninguno de los que tenía agravios contra ella tuvo mucho tiempo para persistir.\n\nSin embargo, en el caos que siguió, Erke-kara descubrió que le gustaban bastante los métodos de Tenzing. Incluso más desprendido que Fan; con la bendición de esta, se unió a su corte.\nA pesar de que se opone a su miembro del [Glossary('Wu','podgloss.wu')], Fu Hao, prefiere la estructura más laxa que cultiva Tenzing. Pero a pesar de su exterior frío, espera fervientemente no recibir nunca la orden de volver la hoja contra sus compañeros..."    
 POD_persistentpodlore.desc.793352: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEntre las muchas fuerzas que antaño eran comunes en la Corte del Tigre Blanco, entre las más fuera de lugar parecía estar la de un rostro hermoso entre una corte de guerreros, sabios, filósofos y maestros espías. Pero tras la voz melosa, el dominio de los cantos y la seducción de las formas, se escondía un Abrazo letal que apagaba la luz de enemigos con corazones que no podían ser persuadidos.\n\nYahui, en su vida mortal, fue un huérfano del periodo de los Reinos Combatientes de la historia de China, en el estado de Wei. Al principio, todo lo que tenía era su encanto, su ingenio y su belleza, poco más. Les dio el mejor uso posible, pero en una época así, el destino de los hombres de la noche solía ser brutal, y cuando el periodo llegaba a su fin, Yahui no era más que uno de los incontables muertos Sin Nombre de las Conquistas Qin. Y en la muerte se encontró despojado de su identidad en los horrores de los Burdeles de Hierro del Infierno de Sal y Hierro.\nDespojado de las herramientas de la vida, se limó los dientes hasta convertirlos en colmillos de víbora y se arrancó las manos y los tobillos para escapar, saliendo del Infierno como una serpiente. Cuando fue encontrado por el [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')], quedaron asombrados al ver que el rostro de la Víbora Demoniaca era capaz de aturdirlos a todos.\n\nYahui fue civilizado y entrenado como un Talón de Hierro, utilizando su increíble encanto y astucia para abatir a los [akuma|E] demasiado cegados para ver los colmillos que acechaban debajo. Sin embargo, una vez que se le dio a elegir, se apresuró hacia la corte de Fan y le juró lealtad.\nLe sirvió intensamente, fiel a la Corte que ella moldeó. Aunque no pudiera conquistar a la persona que tenía su corazón, al menos salvaguardaría su obra. Pero cuando Fan se retiró, Yahui se perdió.\nEn lugar de desmoronarse como la mayoría de sus [Glossary('Wu','podgloss.wu')], Yahui simplemente acompañó a Fan en su retiro y continúa como siempre lo ha hecho."    
 POD_persistentpodlore.desc.793353: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nDentro de Tashi, circulan rumores entre los Espíritus sobre reuniones y tratos secretos. De algunos de ellos, se habla de un ladrón, de un cadáver con el revelador ojo de las Artes del Alma.\n\nEn parte tienen razón. Pero sería absurdo que Jetsun aclarara la historia.\n\nJetsun, en su vida mortal, era solo un guardia de la ciudad. Se le daba bastante bien, e incluso a pesar de que su pequeño pueblo estaba apartado, era capaz de atrapar a un buen número de ladrones. Pero una noche, un ladrón coría por su ciudad, uno que desconcertaba a todos sus compañeros guardias. Jetsun se dedicó a atraparlo con las manos en la masa.\nMediante un cuidadoso cebo, preparó un premio demasiado tentador para que el ladrón lo rechazara, y estuvo seguro de que lo tenía. Y en el momento en que la cuerda que lo sujetaba vibró, se lanzó sobre él, riendo de victoria.\n\nHabía atrapado al Matusalén Salubri Zao-zei, y fue Abrazado por sus problemas. Y fue rápidamente integrado en el seno de los Wu Zao.\n\nDesde su Abrazo y entrenamiento, Jetsun, aunque era excelente atrapando ladrones, era terrible siendo uno de ellos, así que fue trasladado a otra posición crítica. Los Wu Zao necesitaban acceso a China a través de Tashi, por lo que enviaron a Jetsun para asegurarse de que esos caminos permanecieran abiertos.\nAllí esperó y se ganó pacientemente la confianza de la corte del Ancestro Jiang Shahua, consiguiendo finalmente la audiencia que necesitaba. Allí permanece, manteniendo esas puertas abiertas mientras juega al juego de la espera. Así que, aunque antes atrapaba ladrones, ahora les abre la puerta."
 POD_persistentpodlore.desc.793354: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEs deber de un médico curar y proteger. Aunque no siempre sea con las personas, Yangwa nunca ha errado en su propósito, ya sea como mortal o como Vampiro.\n\nViviendo como médico en la ciudad que llegaría a conocerse como Tashgar, el oficio de Yangwa como facultativo y médico era increíblemente importante en el umbral de China. También era bueno en ello, envejeciendo y salvando a cientos de personas en sus viajes. Y fue por sus habilidades que fue vigilado durante un largo periodo, y otro sanador lo visitó mientras dormía y le otorgó $pod_vitae$ para elevar su capacidad de curación.\n\nAunque la muerte le costó algo acostumbrarse a Yangwa, era un lugareño en la ciudad, la cual los Wu Zao necesitaban asegurar que permaneciera abierta para ellos. Sus habilidades como sanador le abrieron las puertas de su gobernante nocturno, Jiang Shahua. Exteriormente, se presentaba ante la corte y la ayudaba con sus «Artes del Alma», mientras que silenciosamente abría su tienda a otros Wu Zao, un refugio y santuario hacia la China propiamente dicha.\nNo sabe del todo qué hacen, pero su deber es proteger. Y así permanece firme, manteniendo ese camino abierto.\n\nSeguramente nada malo saldrá de esto."
 POD_persistentpodlore.desc.793355: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEntre los pocos visitantes de confianza de Jiang Shahua, una destaca. Una mujer siempre vestida con finas sedas, con los ojos sangrando en rojo, pero que no es un [akuma|E] ni un Tigre Diablo. Algo distinto, y aun así, una usuaria de algún tipo de Artes del Alma. Aunque su tercer ojo suele estar oculto, cuando aparece, todos sienten un escalofrío por la columna vertebral. Algo viejo y ancestral, con una mirada terrible que inspira temor por donde camina.\n\nAkari nació mucho más al Este, pero es una camaleona cultural, adaptándose a donde va. Su vida mortal fue breve; fue Abrazada antes de cumplir los 20 años, por una fuerza de terror y oscuridad. Esto la educó, enseñándole los horrores de su maestro y, lo que es más extraño, inculcándole lo importante que es que aquellos con tres ojos y que beben sangre puedan ir a donde se les necesite.\nSi hacía eso, su Sire no interferiría en lo que ella hiciera.\n\nAkari encontró esto perfecto, y al oír el latido de aquello que soñaba bajo la tierra, sonrió y se dirigió a las puertas. Encantadora y astuta, abriéndose paso hacia la garganta principal del mundo que conocía, construyó su poder allí, comportándose bien y esperando. Y cuando llegaron los vigilantes, se aseguró de que pudieran pasar sin ser molestados con las palabras y los regalos adecuados para el Ancestro.\n\nTodo según lo planeado, por supuesto. Es lo que aquellos que sueñan debajo querrían."
 POD_persistentpodlore.desc.793356: "Este personaje fue creado para el suplemento de fans Relentless Age y se utiliza con permiso. No forma parte oficial del $pod_wod$.\n\nMa Hai-Lan era la hija de un funcionario menor de Zhongdu y vivió una vida sin incidentes hasta que los mongoles llegaron y destruyeron la ciudad, matando a innumerables personas en el proceso, incluyéndola a ella y a su amiga de la infancia Lin Xiao. Ambas fueron arrojadas al [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] y fue allí donde Ma Hai-Lan se reveló, liderando a un grupo de prisioneros para escapar. Se convertirían en sus [Glossary('Wu','podgloss.wu')], los Demonios de Zhongdu.\n\nElla ve la ruptura de las Cinco Cortes de Agosto como algo decepcionante, pero no sorprendente. Cuando se unió a los Muertos Hambrientos, juntándose con los guerreros Grullos que acabarían fundando las ciudades de la carta de la Corte del Emperador Amarillo, escuchó más de lo que le correspondía de quejas y lamentos, siempre de los inmortales menos dignos, príncipes de bambú que actuaban como si se merecieran el mundo. Para la «General Ma», una orgullosa y militante creyente en el Camino del Loto de Ocho Dobleces, la verdad es simple: tomas lo que mereces con manos sangrientas y maltrechas, y solo entonces puedes decir que te lo has ganado.\n\nTal como ve la General Ma, el mundo nocturno de la China continental ha vuelto al bandidaje y la anarquía de los tiempos antiguos, lo cual, para ella, representa las oportunidades recuperadas de su brumosa juventud. China está madura para ser tomada una vez más, si hay Muertos Hambrientos dispuestos a seguirla.\n\nNo hay lugar para el rencor. Puede que las antiguas Cortes de Agosto hayan perdido, ¿pero qué importa? Habían perdido el favor del cielo, se habían vuelto gordas e indolentes en un mundo hermoso que pensaban que duraría para siempre. Los [Glossary('Anda','podgloss.anda')] y sus aliados en las sectas heréticas no son los herederos del cielo; no han construido una entidad política a partir del caos que sembraron.\nSon simplemente una prueba que los próximos campeones dignos deberán enfrentar y derrotar. Ma Hai-Lan tiene la firme intención de ser esa campeona, construyendo un ejército para tomar las ciudades una por una.\n\nHubo una vez un imperio de los muertos, justo y puro... y ahora China está lista para el siguiente.\n\nDestino futuro\nA pesar de que la sentencia de muerte que a menudo suponía oponerse directamente a los [Glossary('Anda','podgloss.anda')], gracias al liderazgo y la tenacidad de Ma Hai-Lan, ella y sus [Glossary('Wu','podgloss.wu')] sobrevivirían a esta amenaza y superarían el Infierno al que una vez pertenecieron.\nSe convertiría en una ancestra aislada del temprano Quincunx, y atendería su corte con diligencia hasta que su disputa con los ancestros más conservadores se convirtiera en un cisma a principios del siglo XX."
 POD_persistentpodlore.desc.793357: "Este personaje fue creado para el suplemento de fans Relentless Age y se utiliza con permiso. No es parte oficial de $pod_wod$.\n\nContando historias fantásticas y capaz de tejer mil relatos sobre su pasado, Lin Xiao oculta la verdad tras el velo del engaño y el mito en ciernes. Todo para suprimir su ira.\n\nLin Xiao era hija de mercaderes establecidos en Zhongdu y se crió en su oficio. Pero desde niña, nada amaba más que las historias. Adoraba las Leyendas de grandes héroes y dioses, y a menudo se entregaba a ellas.\nQuizás el mayor regalo que le dieron sus padres fue enseñarle a leer y escribir, pues pronto ya componía sus propias historias. Rara vez salía, a menos que fuera a jugar con su amiga Ma Hai-Lan; Lin Xiao siempre envidió a la fundadora de dinastías, que surgió de orígenes humildes para gobernar todo el mundo conocido.\nTan absorta estaba en todo aquello que ni siquiera se dio cuenta de que las murallas de Zhongdu habían caído, hasta que una espada mongola ya le separaba la cabeza de los hombros y la lanzaba a las profundidades del [Glossary('Infierno de Cadenas con Púas','podgloss.hellspikedchains')].\n\nLa experiencia quebró a Lin Xiao. Vio destellos de su hogar ardiendo mientras caía al infierno; las brasas humeantes de sus historias, tanto las que ella compuso como las que adoraba, la seguían.\nEn su mayor parte, simplemente aceptó su destino. Incluso cuando su amiga de la infancia la rescató, se mantuvo callada y melancólica durante toda su huida y recolección.\nNunca hablaba, y simplemente deambulaba como una sombra de lo que fue. Al menos hasta que vio las ruinas de Zhongdu. Algo en su interior se encendió, una conflagración de ira y dolor que consumió su ser.\nEl Aullido del Tigre Diablo la llamó, y ella dejaría que el [Glossary('Anda','podgloss.anda')] escuchara su rugido junto a su [Glossary('Wu','podgloss.wu')]. En una tormenta de mentiras y trucos, volcaría todas sus fuerzas en apoyar a su [Glossary('Wu','podgloss.wu')].\n\nDestino Futuro\nLin Xiao sobreviviría a la guerra contra el [Glossary('Anda','podgloss.anda')] y vería cómo el Quincunx se apoderaba del Mundo de la Noche.\nSe retiró silenciosamente a su hogar y permaneció allí mientras se reconstruía. Durante el exceso de poder de la Corte de Sangre y la Rebelión del Siglo, en el caos del cambio de milenio, tras siglos de espera, la ahora Gran Maestra Lin asumió el control de la noche en la ciudad que surgió sobre su hogar, Beijing.\nSe alinearía con su amiga de la infancia una vez más, pero esta vez será igual a los relatos fantásticos que cuenta a sus alumnos. Será más grande que todos ellos."
 POD_persistentpodlore.desc.793358: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial de $pod_wod$.\n\nEs algo triste nacer en una vida militar en los últimos días de la vida de un imperio. Y quizás, si Yanxiang hubiera vivido en otra época, podría haber sido un soldado verdaderamente condecorado. Ahora, tendrá que conformarse con ello en la muerte.\n\nYanxiang fue uno de tantos soldados en los últimos años de la Dinastía Jin, destinado en Zhongdu como recompensa por su éxito temprano en su carrera al repeler las primeras incursiones de la nación que se convertiría en el Imperio Mongol.\nSin embargo, este nombramiento acabaría matándolo, ya que el eventual asedio y destrucción de Zhongdu lo vería caer en las murallas de la ciudad, muriendo en defensa de la misma y encontrándose en el [Glossary('Infierno de Cadenas con Púas','podgloss.hellspikedchains')]. Luchando contra las cadenas, su esencia fue simplemente succionada para los fines inmundos de su señor.\nNo obstante, por pura suerte, fue uno de los pocos afortunados cerca de otra fugitiva que, en su huida, les ayudó a escapar y, a cambio, Yanxiang ayudó a luchar junto a ellas mientras se abrían paso de vuelta al mundo de los vivos.\n\nTras ser descubiertos por el [Glossary('Infante Demonio Civilizador','podgloss.infantdevilcivilizer')], Yanxiang fue colocado entre los otros fugitivos como el corazón moral de su [Glossary('Wu','podgloss.wu')], ya que a pesar de ser soldado, era en realidad uno de los más templados en lo que respecta al combate.\nSin embargo, al apoyarlos con ardor, su experiencia de vida será crítica en la guerra contra el [Glossary('Anda','podgloss.anda')].\n\nDestino Futuro\nLa sabiduría practicada de Yanxiang haría que cada miembro de su [Glossary('Wu','podgloss.wu')] sobreviviera para ver la formación del Quincunx. Llegaría a convertirse en un Ancestro de la ciudad que sería Zhuhai y, a medida que el Quincunx entre en decadencia, se reconectaría con su antiguo [Glossary('Wu','podgloss.wu')], ansioso por ayudar en las ambiciones de Ma Hai-Lan para restaurar el Quincunx, utilizando su posición como Ancestro de Zhuhai para ayudar a los Demonios de Zhongdu."
 POD_persistentpodlore.desc.793359: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial de $pod_wod$.\n\nCuando uno ve al [Glossary('Wu','podgloss.wu')] de los Demonios de Zhongdu, pocos llegan a otra conclusión que no sea que Tai es un hombre bestial, de constitución alta y figura ancha, con una fuerza y una Furia a su altura. Dada la fama que tiene, su vida mortal resulta irónica para quienes la conocieron.\n\nTai era hijo de carniceros y se crió como tal. Fuerte por cargar carne y hábil con el cuchillo por cortar, en realidad era bastante feliz con su vida y llegó a casarse con su novia de la infancia, Shufen.\nNo habría deseado nada más que envejecer como carnicero. Pero eso no ocurriría, ya que su hogar sería destruido por los mongoles en su conquista inicial, siendo uno de los muchos muertos en el saqueo de Zhongdu que acabarían cayendo en el [Glossary('Infierno de Cadenas con Púas','podgloss.hellspikedchains')].\n\nA pesar de lo terrible de todo, perder a su amada Shufen incitó una inmensa ira en Tai. Su rabia se convirtió en algo horroroso; incluso los Demonios evitaban al recién creado demonio en sus frenéticos forcejeos en las Cadenas con Púas.\nY cuando fue liberado por otro fugitivo, corrió inmediatamente hacia su amada como un toro enfurecido y partió las cadenas de ella con sus propias manos. Escaparon juntos, junto a su libertador y otros pocos demonios, de vuelta al mundo de los vivos.\nTras ser reunidos, fueron puestos en un [Glossary('Wu','podgloss.wu')] compartido después de su entrenamiento. El propio Tai estaba ansioso por luchar junto a ellos para vengarse, ya que fueron posicionados como un [Glossary('Wu','podgloss.wu')] para luchar contra el [Glossary('Anda','podgloss.anda')].\n\nDestino Futuro\nLa Furia de Tai le permitiría sobrevivir a la guerra contra el [Glossary('Anda','podgloss.anda')], y se convertiría en uno de los pocos Ancestros que derriban Dinastías.\nSin embargo, cuando el Quincunx comenzó a decaer a principios del siglo XX, por recomendación de Ma Hai-Lan, buscaría posicionarse como Ancestro Gran Maestro. Al oír susurros sobre un posible regreso de Dobrul el Bravo, estará más de acuerdo que nunca con sus compañeros.\nEl Quincunx debe ser restaurado, y la Legión del Cielo y el Infierno es la mejor para lograrlo."
 POD_persistentpodlore.desc.793360: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nÉrase una vez, Shufen habría sido feliz envejeciendo como una esposa. Ahora, sin embargo, anhela mucho más.\n\nShufen nació entre los sirvientes de un palacio menor en Zhongdu, la capital de la extinta Dinastía Jin. Sus padres eran clientes habituales de un carnicero local, y fue allí donde conoció al hombre que se convertiría en su mejor amigo, el amor de su vida y, después, en su esposo.\nRegocijada por ser una de las pocas afortunadas capaces de casarse con alguien a quien amaba y deseaba, se casó felizmente con Tai y ayudó a cuidar la carnicería cuando sus padres murieron.\nPero, desafortunadamente, su final feliz se vio truncado por el saqueo mongol de Zhongdu, que la redujo a cenizas, siendo Shufen una de las muchas víctimas arrastradas al [Glossary('Infierno de Cadenas con Púas','podgloss.hellspikedchains')]. Separada de Tai y sirviendo como mera leña para su amo, fue azotada mientras luchaba sin cesar por liberarse, llamando interminablemente a Tai para que la salvara.\nContra todo pronóstico, él respondió gracias a un demonio que se liberó, y escaparon juntos junto a otros hacia el mundo de los vivos.\n\nY con este segundo aliento, no volvería a ser indefensa. Todo el asunto de ser una simple damisela trastornó el orden en el alma de Shufen, y nunca volvería a tolerar la debilidad. No, tomaría todo el poder que pudiera, derribando a los malvados que volvieran a amenazarla. Y ahora, eso es claramente la [Glossary('Anda','podgloss.anda')].\nLas otras fugitivas están a su lado, y Tai tiene ahora su propia ira. Su belleza es ahora una herramienta, su encanto ahora una daga. Ella lucharía ahora. Para asegurarse de no volver a sufrir el mismo destino.\n\nDestino futuro\nShufen sobreviviría a la guerra contra la [Glossary('Anda','podgloss.anda')], junto al resto de los Demonios de Zhongdu.\nNi ella ni Tai se conformarían con el retiro, así que se convirtieron en Ancestros errantes. Pero cuando la Corte de Sangre amenazó la estabilidad del Quincunx y recibieron noticias de Ma Hai-Lan de que lucharían una vez más...\nShufen afirmó sin dudar su Lealtad a la nueva Legión del Cielo y el Infierno, y buscó convertirse en la Gran Maestra de las Garras de Hierro de Shenzhen con ese fin. Entonces se uniría a la nueva guerra de Ma Hai-Lan, con entusiasmo y con todo su corazón una vez más."
 POD_persistentpodlore.desc.793361: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEn toda Asia, hay susurros sobre hombres y mujeres que visten la forma de serpientes. Entre el mundo nocturno, son agentes secretos y ejecutores de las Cortes de la Bestia, asesinos poderosos y temibles subordinados a la voluntad inescrutable de su diosa madre. Y entre los suyos, hay muchos que viven y mueren en el olvido.\n\nAmphai no toleraría el mismo destino. Si Gaia lo desechara, él la rompería y la dejaría destrozada a sus pies.\n\nAmphai era un Parentela Nagah nacido en la selva de Indochina. No bendecido con el Primer Cambio, Amphai fue rápidamente emparejado con una esposa Nagah tres veces mayor que él. Cuando protestó y pidió otra forma de ser útil, su padre Nagah le rompió las piernas, diciéndole sin ambages que si no tenía hijos, lo mataría. Desafortunadamente para Amphai, su esterilidad sería una sentencia de muerte, y fue ejecutado por el imperdonable crimen de no querer ni poder concebir un hijo. Y por ello, su alma fue enviada al Infierno de la Magia Miserable.\nPero a diferencia de tantos otros, él simplemente aceptó su destino, despertando la curiosidad de la Abuela Bruja, la [Glossary('Rey Yama','podgloss.yamaking')] del Infierno. Cuando ella le preguntó qué haría cuando escapara, él se limitó a decirle que mataría al alma de la tierra y que, si no tenía nada más que decir, lo dejara en paz. Impresionada por su respuesta, ella lo acogió, lo entrenó y luego lo liberó de nuevo en el mundo de los vivos investido de poder infernal.\nLentamente, su deseo de cada vez más poder tras un engaño de debilidad con el fin de destruir a Gaia ha dado sus frutos; mientras la Corte del Fénix Escarlata decae, todo un archipiélago listo para la conquista se extiende ante él. Y a su lado están finalmente los amantes de su propia elección, atrapados en sus espirales, para escarnecer a la familia que lo abandonó.\n\nDestino futuro\nAmphai estaría entre los pocos Defiled en Indochina que no encontrarían la muerte antes de la campaña de Piyau, ocultándose en las profundidades del continente y esperando.\nPara cuando lleguen las noches modernas, habrá perfeccionado ritos de invulnerabilidad y espionaje con numerosos Nagah cautivados bajo su mando, alertándole de cualquier intruso en su dominio de Vientiane.\nAquí, se acerca a otro precipicio final: asumir él mismo todo el poder de un [Glossary('Rey Yama','podgloss.yamaking')] y usar ese poder para lanzar su propia campaña para conquistar Gaia."
 POD_persistentpodlore.desc.793362: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nDentro del refugio del Soberano de la Serpiente, al lado del maestro, siempre hay un demonio que es una bestia. Alto, robusto como un buey y con una habilidad a la altura de tal fuerza, para ser el más honrado entre los muchos hombres en el trono del Soberano.\nPero a pesar de todo ese aire, Vixay tiene lo que siempre quiso más: una luz guía. No importa a dónde le lleve, incluso a las profundidades de la condenación.\n\nVixay fue simplemente un soldado en vida, en uno de los muchos estados de Indochina. Era un buen soldado, increíblemente hábil con la lanza y sin parangón en su forma.\nPor su servicio, fue el orgullo de su ciudad. Sin embargo, era tan prescindible como cualquier otro hombre, así que fue gastado como tal y murió sin luto en un campo de batalla olvidado. Y en la Ciudad Demonio, la falta de sentido de todo aquello lo quebró. Aceptó su lugar como soldado en la ciudad, un cascarón vacío de lo que fue.\nSin embargo, acabaría encontrando una clase de luz. Un hombre con porte de serpiente se le acercó como una luz de los cielos, ofreciéndole una causa por la cual luchar, una eterna, donde tendría a alguien que lo apreciara. Alguien que lo amara. Alguien que lo tomara y nunca lo soltara.\n\nY aun cuando eso lo condenó, Vixay lo aceptó con entusiasmo, una lanza leal para su rey serpiente. Y sin importar cómo lo necesitara su rey, Vixay estaría allí para él."
 POD_persistentpodlore.desc.793363: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\n¿De qué sirve una serpiente sin su veneno? No importa la forma ni el tamaño, es una serpiente pobre la que carece de los medios para matar a sus enemigos con agonía. Y, sin embargo, tal veneno también puede curar, y en el mundo de la noche existen innumerables formas de dolor que pueden aliviarse.\nY al lado de Amphai, Sengdeuane es su maestro en ambas, en un maravilloso paquete compartido.\n\nSengdeuane era originalmente un médico rural, dedicado principalmente a antídotos para mordeduras de serpiente, pero un médico bastante bueno al fin y al cabo. Un día, sin embargo, una mujer acudió a él pidiéndole una medicina que pudiera deshacer un horrible agravio que les habían causado.\nIncluso a pesar de las adamantinas exigencias de su mentor de que no lo hiciera, Sengdeuane preparó la Pócima para ella. A pesar de la buena acción, fue atrapado y asesinado por el pretendiente padre por negarle su «derecho» sobre su víctima, encerrándolo en una caja y enterrándolo vivo tras dejarlo inconsciente.\nY Sengdeuane sería maldecido a [Glossary('Kakuri','podgloss.kakuri')]. Y allí, maldijo al mundo sin cesar por su crueldad, suplicando algún medio para destrozarlo y triturarlo mientras aullaba en aquella llanura insensata. Y fue allí donde, mientras se arrastraba por las cuevas y salía del frío, su llegada al mundo de los vivos fue recibida por una semiserpiente, investida con el poder del infierno.\nLe dijo que podía hacer todo eso y más. Si tan solo servía.\n\nFue la decisión más fácil de la existencia de Sengdeuane. E incluso si no era el favorito, sabiendo lo que podría venir, sabiendo que los terrores y dolores del mundo podrían finalmente terminar, lo haría feliz.\nHasta el día en que pueda ver al [Glossary('Emperador Demonio','podgloss.demonemperor')] surgir y arrasarlo todo."
 POD_persistentpodlore.desc.793364: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEn un mundo en constante cambio, incluso el más celoso de los lunáticos caerá ante el poder de la logística y el suministro. Parte del éxito de las Serpientes no se debió a su propio poder individual o habilidad en batalla, ni al celo por su maestro en el Infierno de la Magia Miserable, sino simplemente a tener a alguien que pudiera gestionar adecuadamente el flujo de monedas.\nY tal arte es algo que Oudom descubrió que le salía de forma natural.\n\nEn su vida mortal, Oudom era simplemente un mercader que ejercía la peligrosa profesión de transportar mercancías a través de una naturaleza potencialmente rica en piratas y bandidos para llegar a pueblos y aldeas aislados. Sin embargo, la abundancia de riqueza que su Tierra Natal le ofrecía le brindaba muchas oportunidades, así que recorría las rutas peligrosas.\nY todo por el bien de su aldea natal en el Mekong. Desafortunadamente para ellos, mientras Oudom ejercía su oficio, cometió el error de insultar al hombre equivocado. Buscando humillarlo por completo por el desprecio a su orgullo, se encargó de cada caravana y cada línea que Oudom atacó, para poder observarle y burlarse de él mientras caía en la pobreza.\nY finalmente, cuando Oudom realizaba un último viaje con mercancías, fue emboscado, capturado y golpeado hasta la muerte con monedas de plomo para burlarse de él. Y tal muerte le enviaría al Infierno de la Falta de Dinero.\n\nLa experiencia quebró a Oudom, que simplemente se quedó tirado en la tierra y aceptó su lugar como un nuevo demonio mendigo. Y tras un tiempo inconcebible para él, finalmente tuvo suficientes sobras para escapar gateando. Pero el primero en encontrarlo fue el Soberano de las Serpientes, quien reconoció el intelecto que poseía y lo acogió. Le ofreció un lugar donde realmente pudiera usar su mente, gestionar todo el dinero y el comercio de un nuevo mundo, contar con el consuelo de un Señor que lo protegería y un amante que nunca lo abandonaría.\nOudom, tras haber soportado la vergüenza de una pobreza convertida en infierno, simplemente no quiso volver a sufrir aquello y aceptó sin dudarlo."
 POD_persistentpodlore.desc.793365: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nDe niño, Khamxay solo quería criar Animales y hacer amigos. Y el mundo lo quebraría por ello, todo por un solo pecado.\n\nKhamxay nació en una pequeña aldea, como hijo de la familia que solía cuidar a la mayoría de los bueyes. Desde su juventud, fue un alma alegre y honesta, y le encantaba cuidar y jugar con los Animales.\nNunca quiso ser el centro de atención y se sentía contento con lo que tenía. Sin embargo, su vida entraría en una espiral cuando un hombre que deseaba los bueyes de su familia le propuso casar a Khamxay con su hija.\nSin embargo, Khamxay simplemente no estaba interesado. No quería preocuparse por la posibilidad de perder a sus Animales.\n\nDesafortunadamente, el hombre tomó el rechazo como un desprecio y, por la noche, mientras Khamxay atendía los corrales, prendió fuego a ellos, matando a Khamxay junto con la mayoría de los Animales de su familia. Y en la confusión de la muerte, se encontró en los horrores del Infierno de los Pecadores del Mundo al Revés.\nAterrorizado y deseando simplemente que todo parara, suplicó y rezó a cualquier cosa que le escuchara. Sin embargo, poco a poco aprendería las reglas invertidas del infierno y, desafiando toda lógica mortal, confió en una serpiente.\nLa siguió de vuelta al mundo de los vivos, hacia un maestro. La serpiente pálida que lo encontró le devolvió, hasta cierto punto, la lucidez, donde le ofreció un trato: servirle en mente y cuerpo, y él tendría las recompensas de su alma en el próximo mundo. Usar su franqueza y amabilidad para él, y conocer la grandeza.\nUnirse a su refugio y a sus consortes, y no volver a conocer jamás la amenaza del peligro.\n\nKhamxay aceptó la oferta en el momento en que Amphai terminó la propuesta."
 POD_persistentpodlore.desc.793366: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nCon su Tierra Natal invadida, sus ancestros menguando y nuevas blasfemias propagándose sin control. Es suficiente para volver locos a hombres y mujeres. Pero todos ellos abandonan aquello que podría elevarlos a mayores alturas. Y Thiri no abandonará a quienes estén con ella, en la vida o en la muerte.\n\nAntigua discípula de Dyanang, Thiri fue, hace tiempo, una Acólita de los Dragones Azotadores. Sin embargo, su Camino estuvo en muchas ocasiones plagado de ir demasiado lejos en el mundo de los vivos.\nEn su esencia, Thiri todavía se preocupaba profundamente por los ecos de su vida mortal, y los excesos cada vez más desenfrenados de otros Dragones Azotadores la perturbaban enormemente. Sus aspiraciones de convertir su hogar tranquilo en un espantoso torbellino de sexo y violencia, la decadencia de las cortes y, a veces, una introspección más profunda en Caminos llamados heréticos por los señores extranjeros, hicieron que Thiri finalmente se hartara.\n\nRompiendo contacto con la Corte del Fénix Escarlata, llamó a todos los discípulos que pudo. Su ambición era poner su hogar en orden, liberarse de las cadenas del dominio exterior y restaurar a la familia en el centro. Tal era su ambición. Tal sería su Camino. Y así se haría.\n\nDestino Futuro\nA pesar de algún éxito inicial, el declive de la Corte del Fénix Escarlata y el ascenso de las Cortes Doradas obligarían a Thiri al exilio, huyendo de las fuerzas de Piyau, que la confundieron con los [akuma|E].\nPero Thiri aguardaría su momento en el exilio, antes de regresar finalmente para intentar retomar donde lo dejó en Final Nights."
 POD_persistentpodlore.desc.793367: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSi simplemente hubieran dejado las cosas como estaban, Nanda se habría conformado con ello. Sin embargo, dado que su hogar está en peligro y tanto Demonios como Tiranos llaman a su puerta, ¿cómo no iba a verse impulsado a actuar?\n\nNanda era un hombre que apareció de la nada cuando fue encontrado por el Demonio [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] de la Corte del Fénix Escarlata. Con su pasado como una bruma, guiado solo por sus principios y los traumas del Infierno del Aceite Hirviendo, intentó adoptar a los Dragones Azotadores tal como se esperaba de él, pero una parte de él simplemente no lo entendía. Nada de aquello tenía sentido: renunciar al regalo que era la Humanidad.\n\nSi los Muertos Hambrientos estaban condenados, ¿por qué debían ellos renunciar a la Humanidad? Todas estas preguntas le atormentaban y, cuando las planteaba, no recibía como respuesta la razón, sino el reproche. No es de extrañar, entonces, que se uniera inmediatamente a Thiri en su campaña para restaurar el orden bajo el Abrazo de la familia.\n\nLos dos se volvieron increíblemente cercanos y eligieron afirmar su dedicación a la familia construyendo la suya propia. Mientras ella protege y lidera la casa, él toma las armas y guía a su nueva familia a la guerra contra los demagogos extranjeros y los malvados demonios que asaltan sus hogares.\nHasta que la mancha sea borrada, él luchará."
 POD_persistentpodlore.desc.795041: "Este personaje es parte de $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, ha sido ampliado por los desarrolladores de PoD para dar mayor profundidad al escenario.\n\nIncluso entre los Infiernos, el Infierno de ser Desollado Vivo es particularmente desagradable. Todos los que escaparon de sus páramos tienen una enemistad especial por parte de su antiguo carcelero. Y así, Wu Lishan, desde su huida de sus horrores, se ha escondido tras una red de conexiones en el corazón de Chang'an, utilizando el aparato de la Corte del Emperador Amarillo como el escudo definitivo.\n\nEn vida, Wu Lishan era la esposa de un noble menor, que en particular amaba todos los beneficios que conllevaba ser la esposa de un hombre rico. Extravagante y amante de las cosas bellas, exprimía vorazmente las tierras de su marido para obtener más lujos con los que enriquecerse.\nPero tales cosas traen enemigos, por supuesto. Cuando su marido dejó a una familia en la indigencia, su cocinero, el hermano de la madre de la familia, los envenenó a todos, y Wu Lishan fue humillada y despojada de toda su riqueza por arenas cargadas de hierro.\nPero la muerte impartió lecciones y, mediante el uso experto de venenos, logró envenenar a sus carceleros para escapar.\n\nPero eso fue hace mucho tiempo, y ahora Wu Lishan es una Anciana entre la Corte del Emperador Amarillo. Fue la fuerza impulsora tras el giro de Amber Wren hacia las actividades mercantiles, actuando como el principal brazo financiero de la Corte.\nPromete cada vez más a medida que diversos negocios los enriquecen, pero su atención se está dispersando. Tendrá que ser astuta y capaz para poder equilibrar los detalles más finos de la corte mientras evita el temor omnipresente de que el Infierno vuelva por ella.\n\nDestino Futuro\nPara su horror, la Corte del Emperador Amarillo estaba a tan solo un asesinato de implosionar. El caos resultante destruyó sus cadenas de suministro y, como no pudo pagar las cuentas, numerosos deudores vinieron a cobrar.\nY así, con todo su temor al Infierno de ser Desollado Vivo, fue enviada al vacío final, despojada de toda su riqueza una vez más."    
 POD_persistentpodlore.desc.793368: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the $pod_wod$.\n\nAmong the Amber Wren within the Yellow Emperor Court, one of their members is rarely seen. Their supposed center, the ties that bind them all. A core that never leads, a guiding force that lends them their heart, and uniter who seems to shunt the open areas.\nAnd yet, the kind Hungry Dead with the face of the old lady is the foundation upon which the accomplishments of the Amber Wren stand.\n\nJingyi was always old at heart. Quiet and kind, yet meek and supportive, she is the friend everyone wants yet never sees. Overworking herself in life straight into the [Glossary('Ciudad Malvada','podgloss.wickedcity')], she moved on further into the world of undeath with the same degree of earnest support for her new companions, the locus of her purpose.\nShe was fast friends with all of them, the shoulder they could cry on and the ear that could never turn them away. And even if she was often enabling, she was a critical source of advice for them all, and the binding glue that held them all together.\nAnd as the [Glossary('Anda','podgloss.anda')] draw closer, her ironclad support of her [Glossary('Wu','podgloss.wu')] will be needed now more than ever.\n\nFuture Fate\nThe ensuing chaos of the eventual crumbling of the Yellow Emperor Court would strike the Amber Wren harder than most of the old ruling class.\nAnd as Jingyi traveled to try and rally her companions, a Black Wind fell upon her, and she was sent to the final void as ash on the wind."
 POD_persistentpodlore.desc.793369: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEn una época de guerreros, no es de extrañar que tantos [Glossary('Wu','podgloss.wu')] se hayan reunido para la guerra contra los [Glossary('Anda','podgloss.anda')]. Y, sin embargo, limitarse a enviar Demonios a combatir contra el azote los desangraría. Por eso se los equipa, se los arma y se los conecta mediante una compleja red de logística militar que dejaría en ridículo a muchas otras.\nRecogiendo las enseñanzas de los sabios que lo precedieron, Xue ha dominado esas líneas.\n\nSu vida mortal quedó desgarrada por los tormentos de [Glossary('Kakuri','podgloss.kakuri')], y Xue recuerda poco de su mortalidad. Cuando escapó del Infierno, lo hizo hacia las enseñanzas de Sun Li.\nAl interiorizarlas, su lugar dentro de la red logística del Chochín Ámbar resultó evidente. Mientras ellos se ocupaban de los mensajeros y la información, era Xue quien llevaba la parte militar.\n\nCuando la Corte del Emperador Amarillo movilizó sus fuerzas contra los [Glossary('Anda','podgloss.anda')] y los [akuma|E], estas fueron armadas y enlazadas por las redes de Xue. Su intensa atención al detalle, unida a un talante furioso a la hora de asegurarse de que los enemigos de los demonios regresados fueran destruidos, lo hizo ascender mucho.\nY en tiempos como estos, los hombres con celo para castigar a los malvados y talento para organizarlos pueden llegar lejos.\n\nDestino futuro\nEl colapso de la Corte del Emperador Amarillo y el caos que siguió entre sus fuerzas del norte llevaron muchas de las redes de información y cadenas logísticas de Xue al límite de su resistencia.\nSin embargo, él se aferró a ellas con un deseo obstinado de mantener viva la lucha. Y aunque los [Glossary('Anda','podgloss.anda')] hallarían su escondite y lo destruirían, sus sólidos sistemas e instituciones sobrevivirían a la guerra y renacerían entre los Quincunx."
 POD_persistentpodlore.desc.793370: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEntre los Dhampyr de la Corte del Emperador Amarillo, muchos hablan de un Padrino, una figura de inmensa riqueza que se acercaba a todas sus madres, les ofrecía la oportunidad de ser algo más grande y luego regresaba para insuflar vida en sus hijos 9 meses después.\nEstos son un torbellino de rumores de los que Lian está bastante orgulloso. Especialmente cuando casi todos esos Dhampyr son, en realidad, suyos.\n\nTanto en la vida como en la muerte, Lian siempre ha escuchado los caprichos más bajos de su cuerpo, tanto que el Infierno de Sal y Hierro era casi una certeza para él.\nY cuando escapó y fue llevado al [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')], incluso siendo un Demonio, sabían que sería un Dragón Azotador.\nY en el transcurso de un año desde su regreso, ya había engendrado a muchos Dhampyr. Y con el tiempo, realmente pondría a sus hijos al servicio de la Corte, no como sirvientes, guardaespaldas u otras vanidades, sino como mensajeros.\nLa base de la red de información del Gorrión de Ámbar es fruto de las entrañas de Lian. Y a medida que se necesitan más y más mensajeros conforme crece la influencia y la necesidad de los servicios de la Corte del Emperador Amarillo, Lian encuentra un propósito adicional al crear más ojos y oídos para el Gorrión de Ámbar.\n\nDestino futuro\nDebido a las lealtades personales que cultivó, entre el Gorrión de Ámbar sus contactos permanecieron bastante seguros cuando la Corte del Emperador Amarillo se desmoronó.\nDe hecho, a medida que los elementos dispares de las Cortes se unieron, lo hicieron sobre la base de sus hijos.\nY cuando se formó el Quincuncio, Lian se apartó en gran medida del poder, convirtiéndose en un ancestro respetado y, finalmente, ascendiendo al [Glossary('Hundred Clouds','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793371: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nDado el enorme volumen de obras literarias tanto establecidas como prohibidas que se conocen en el $pod_kueijin$, no es de extrañar que tengan mercados enteros dentro de su mundo nocturno dedicados a ellas. Y entre los vendedores más antiguos y respetados se encuentra el venerable Jianhong del Gorrión de Ámbar.\n\nJianhong fue el segundo de sus [Glossary('Wu','podgloss.wu')] en escapar del Infierno, donde parecía tener un deseo fanático por aferrarse al conocimiento. Buscando cada libro que tenía y memorizándolos, pocas cosas dejó de leer entre las grandes obras conocidas entre los $pod_kueijin$.\nY a medida que su [Glossary('Wu','podgloss.wu')] comenzó a centrarse en las comunicaciones, su propia franqueza le granjeó una gran confianza entre los posibles compradores de libros. Y a medida que más y más obras esotéricas llegaban a sus colecciones e intercambios, también se ganó una reputación tácita de estar dispuesto a transportar cualquier tipo de material, incluidos los textos infernalistas enseñados por [akuma|E].\n\nComo seguidor del Canto de las Sombras [Glossary('Dharma','podgloss.dharma')], se le concedió una mayor libertad y confianza. Y a pesar de la guerra en curso, ahora más que nunca muchos $pod_kueijin$ buscan la Iluminación y la sabiduría entre sus antepasados. Y Jianhong está más que dispuesto a suministrárselas.\n\nDestino futuro\nA pesar de que sus propios archivos fueron ignorados en gran medida por el [Glossary('Anda','podgloss.anda')], la destrucción de la Corte del Emperador Amarillo también destrozó sus protecciones.\nFinalmente, un solo error al aceptar un pedido de una copia de la Grulla de Alas Rotas para las Cortes Doradas resultaría en su fin, ya que fue devorado entero por el Devorador de Demonios, un discípulo de Piyau, por «difundir el Infernalismo»."
 POD_persistentpodlore.desc.795042: "Este personaje es parte del $pod_wod$ pero solo tiene una historia muy limitada. Por eso, ha sido ampliada por los desarrolladores de PoD para dar mayor profundidad al escenario.\n\nMientras las preciosas planchas de imprenta del fundamento literario de la Corte del Emperador Amarillo están amenazadas, existe un protector. Frágil y anémico, simplemente se sienta en una silla al fondo, perdido en sus pensamientos. Pero en el momento en que un demonio se atreve a hacer travesuras, la pálida Flor de Hueso se levanta y lo envía de vuelta al infierno con saña.\n\nTan Xuan es un miembro muy antiguo de los Wan Xian y, en general, un discípulo bastante estudioso de los caminos de las Flores de Hueso. Silencioso, contemplativo y, con diferencia, increíblemente posesivo con sus cosas, parece haber salido del Infierno de ser Desollado Vivo con una codicia fanática por aquello que considera suyo y con el deseo de inmortalizar sus obras.\n\nFue una elección fácil para encargarse del [Glossary('Wu','podgloss.wu')] que supervisaba la literatura y la reproducción de las obras fundacionales de los $pod_kueijin$. Pero a medida que los ataques se multiplican, Tan Xuan está empezando a negarse a hablar con los sicofantes de Hongben, y no quiere tener nada que ver con las otras Cortes a menos que hagan algo con respecto a la gente que saquea sus archivos.\n\nDestino futuro\nInicialmente, Tan Xuan celebraría el asesinato de Hongben, viéndolo como una especie de justicia por no hacer nada. Sin embargo, el caos del colapso resultaría ser su perdición, ya que finalmente fue hallado muerto, con cada plancha de imprenta que poseía incrustada en cada uno de sus orificios con gran dificultad por un agresor desconocido."    
 POD_persistentpodlore.desc.793372: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nHuai ha presenciado una gran cantidad de trabajo en esta era, especialmente en su campo de especialización. Mientras la Corte de la Tortuga Negra arde con sus $pod_kueijin$ dispersos entre llamas, y los [Glossary('Anda','podgloss.anda')] se agitan en la puerta norte de la Corte del Emperador Amarillo, Huai simplemente detalla e informa, registra y entrega. Sin juicios, sin pensamientos, es el reportero y escriba perfecto mientras el Norte arde.\n\nHuai es... extraño, incluso entre los Escribas Ilustres más concentrados. Con pocos intereses más allá de la escritura, la caligrafía y la documentación, parece tener poco fuego por cualquier otra cosa.\nY sin embargo, cuando se trata de sus bloques de imprenta y documentos, lo aborda con tal fervor y vigor que parecería que fuera una apasionada Flor de Sangre en una orgía. Y luego, una vez terminado, vuelve a la meditación.\nEn una ocasión, ni siquiera se inmutó cuando le dispararon una flecha entre las piernas para llamar su atención; simplemente siguió escribiendo, felizmente ajeno mientras componía sus informes sobre la destrucción de un Ancestro de la Tortuga Negra y una reproducción de los Comentarios de las Huellas en Sangre.\n\nDestino futuro\nHuai no duraría mucho en el mundo sin la Corte del Emperador Amarillo. A medida que la oposición organizada contra los [Glossary('Anda','podgloss.anda')] se desmoronaba, una coterie de guerreros [Glossary('Anda','podgloss.anda')] encontraría a Huai en sus escritos.\nA diferencia de los cortesanos burlones, su flecha no fallaría el blanco."
 POD_persistentpodlore.desc.793373: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEs una hipótesis común: si un árbol cae en el bosque, ¿hace ruido? Y Zhizhou a menudo se hace la misma pregunta. O al menos, si un escriba escribe algo que nunca se lee, ¿se ha escrito realmente.\n\nZhizhou es el miembro principal del Escriba Ilustre encargado de transcribir, replicar y formar bloques de imprenta para las obras escritas en la Corte del Fénix Escarlata para la lectura de la Corte del Emperador Amarillo.\nY sin embargo, a pesar de las inmensas preocupaciones que siente por los escritos limítrofes con lo infernal, la ficción descaradamente erótica y violenta, y las tradiciones locales heréticas que se filtran en todo, por cada libro que ha copiado, ha escrito cinco consultas y peticiones para enviar una fuerza que los ponga en línea.\nY sin embargo, cada vez que intenta llegar a la Corte, el informe simplemente es tomado y colocado junto a la creciente pila.\n\nCada vez siente más que podría tener que actuar, que podría tener que intervenir directamente. Y mientras la Corte del Fénix Escarlata se desmorona cada vez más en cenizas, siente que el tiempo de los informes puede haber pasado.\n\nDestino futuro\nTales nociones acabarían siendo su perdición. Mientras Piyau comienza su cruzada a través de Nusantara, Zhizhou sale furioso de la Corte del Emperador Amarillo en el caos de la muerte de Hongben, y desafía directamente a un ancestro local para oponerse a ella.\nDesafortunadamente, en su prisa, se lanzó directamente a las fauces de la Corte del Rey Serpiente.\n\nSu cuerpo nunca fue encontrado."
 POD_persistentpodlore.desc.793374: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nA pesar de las suposiciones de aquellos menos estudiosos, se está componiendo una gran cantidad de literatura por parte de los Muertos Hambrientos dentro del dominio de la Corte del Tigre Blanco. Y dado que el complejo proceso de clasificar la herejía y la ortodoxia es una tarea inmensa que ha quebrado a muchos escribas.\nPero la actual, Feishan, ha roto un récord en su puesto por el mayor tiempo servido en su cargo sin abandonarlo, volverse loca por exceso de trabajo o sucumbir a las obras heréticas que flotan a través de la Guerra Eterna.\n\nOriginalmente, Feishan era solo una de tantos escribas jóvenes que trabajaban bajo el anterior Escriba del Tigre, antes de que este tuviera un colapso mental y se lanzara por una ventana desde una torre hacia un cañón. Elegida por el resto de los [Glossary('Wu','podgloss.wu')] por su habilidad para fabricar bloques de imprenta, fue trasladada a la tediosa tarea en su lugar.\n\nFeliz de tener un lugar, lo asumió con estudio y firmeza. Además, añadía numerosos comentarios en ellos, que se convirtieron en obras respetadas por derecho propio. Pero a medida que la situación se vuelve más compleja con los [Glossary('Anda','podgloss.anda')], el trabajo crece lenta y cada vez más de forma abrumadora incluso para ella.\nY en esta tormenta venidera, el propio sauce podría ser arrancado de raíz por el viento.\n\nDestino futuro\nA pesar del inmenso estrés, la complejidad de la era venidera y el caos de los [Glossary('Anda','podgloss.anda')], Feishan resistiría contra todo pronóstico. De hecho, su propio trabajo fue fundamental para preservar las obras de las Cortes Augustas en el Quincuncio."
 POD_persistentpodlore.desc.793375: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nHay una amenaza en la Corte del Dragón Azul. Por la traducción y copia de sus textos, resulta obvio. Pero contrariamente a las creencias de la corte principal de que se trata de los Uji, Junko sabe la verdad.\nAlgo más, algo que ellos insisten en que no es problema. Esos demonios de tres ojos, monstruos que moldean la carne, portadores de pesadillas, mutantes tímidos, todos ellos.\nSon una amenaza, Junko intenta decírselo. Si tan solo escucharan.\n\nJunko es una anomalía en la Corte del Emperador Amarillo, ya que no es originaria del continente. Más bien, fue una de las muchas que murieron en la Guerra Yamato contra los Emishi, asesinada por alguna reliquia horrorosa de los bárbaros que la mató durante la noche. Le tomó mucho tiempo escapar del [Glossary('Kakuri','podgloss.kakuri')] Yomi y, cuando lo hizo, se alejó inmediatamente de ellos todo lo que pudo.\n\nSin embargo, su determinación y celo le valieron un lugar entre los Escribas, donde parecía ser experta especialmente en copiar textos sobre la destrucción de los Descendientes del Ladrón. Pero últimamente, a medida que el [Glossary('Anda','podgloss.anda')] se acerca, Junko parece estar cada vez más agitada.\nSuelta tonterías diciendo que están conectados con las mismas cosas que originalmente la mataron, que también podrían estar conectados con los extraños muertos del Sur.\nAunque tales teorías son descartadas de plano, puede que esté en lo cierto...\n\nDestino futuro\nLo estaba. Y por ello, cuando la Corte del Emperador Amarillo se desmoronó y dejó de estar protegida, una mujer de la noche en particular, de la misma gente que ella llamaba bárbaros, le hizo una visita y le enseñó que incluso los dragones pueden ser devorados."
 POD_persistentpodlore.desc.795043: "Este personaje es parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, fue ampliado por los desarrolladores de PoD para dar mayor profundidad al escenario.\n\nA pesar del letargo general de la Corte del Emperador Amarillo, los [Glossary('Anda','podgloss.anda')] aún no la han quebrado a pesar de su triunfo en la Corte de la Tortuga Negra. Uno se preguntaría cómo podrían resistir la furia de los [Glossary('Anda','podgloss.anda')].\n\nEl Primer Oni es la razón.\n\nWei Anzang es viejo incluso entre los $pod_kueijin$. Pero no deseaba poder ni una corte, sino violencia. Era un asesino y vida y asesino y muerte, y ni siquiera el Infierno de los Pecadores del Mundo Al Revés pudo cambiar su naturaleza.\n\nSus demonios custodian el interior, presionando a los criminales de la noche para que sirvan contra aquello que los azota. Numerosas Incursiones Infernales fueron detenidas por su mano, y ha rechazado a los [Glossary('Anda','podgloss.anda')] muchas veces.\nPero incluso él está probando su suerte. Mantiene la corte de Hongben bajo una ley marcial casi constante, y aunque sus peones de voluntad débil hacen poco para detenerlo, asegurar descaradamente artillería y confiscar Bakemonos en hordas es a veces un paso demasiado lejos.\nPero Wei permanece resuelto.\nEl centro resistirá. No debe caer.\n\nDestino futuro\nEl centro cayó.\nWei intentaría mantener el poder en la corte, pero su propio intento desesperado por el poder tendría un efecto desastroso.\nLa intensa concentración de sus [Glossary('Wu','podgloss.wu')] y demonios atraería la atención de los Cazadores de Demonios, y Wei fue asesinado por un solo guerrero armado con la furia de lo divino y las artes de matar demonios en sus puños."    
 POD_persistentpodlore.desc.793376: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nAunque la mayoría de las miradas se centran en el líder de una fuerza tan estimada de cazadores de demonios, dentro del propio Estandarte de Bronce, la mayoría de sus miembros subalternos no responden a Wei Anzang. Más bien, ven en él a su segundo al mando, su voz y su furia.\nUn hombre bajo con una expresión de estar dispuesto a estrellar la cabeza contra un muro de ladrillos si eso significa la victoria; Da'an es el pegamento fundamental que los mantiene unidos.\n\nLa vida mortal de Da'an fue sencilla. Guardia de una finca para un señor menor, y a la Ciudad de los Demonios en su muerte. Escapó abriéndose paso a zancadillas, tras lo cual se adaptó rápidamente a ser el primer y más ferviente discípulo de Wei.\n\nMenos un guerrero y más un gestor, el Estandarte de Bronce está organizado, armado y suministrado por Da'an. Para hablar con Wei, a menudo es a través de él.\nY en tiempos como estos, siempre se necesita a hombres como Da'an.\n\nDestino futuro\nA pesar de su posición entre el despreciado Estandarte de Bronce, la habilidad de Da'an para organizar [Glossary('Wu','podgloss.wu')] y grupos de combate le serviría de mucho y le ganaría un lugar dentro del Quincunx; se retiraría silenciosamente en las sombras y ascendería al [Glossary('Cien Nubes','podgloss.hundredclouds')] sin ser reconocido, pero con su labor como base fundamental."
 POD_persistentpodlore.desc.793380: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEl norte de China sigue siendo un territorio en disputa. La Corte de la Tortuga Negra tradicionalmente lo ha reclamado, los [Glossary('Anda','podgloss.anda')] corren por él con desenfreno, y ahora la Corte del Emperador Amarillo está reuniendo fuerzas para reclamarlo.\nPero siempre hubo una colección de Cortes presentes. Y a Maedaeri no le importa quién lo reclame. Ella es quien lo gobierna de verdad.\nPero ahora amenazan su hogar. Y eso no lo tolerará.\n\nNacida entre el pueblo Jurchen, y tras morir y regresar del [Glossary('Kakuri','podgloss.kakuri')], Maedaeri era considerada extraña entre las Cortes, ya que no se alineó con la Corte de la Tortuga Negra, como muchos esperaban que hiciera una mujer nómada. Más bien, parecía anhelar el cosmopolitismo del Sur.\n\nComenzando como una guerrera contra los Demonios, llegaría a convertirse en la Ancestra de las Llanuras de Hebei, un punto de intercambio y puerta de enlace entre la Corte de la Tortuga Negra y la del Emperador Amarillo. Pero aun así, a pesar de su naturaleza civil, era una guerrera, ante todo.\n\nReuniendo a su [Glossary('Wu','podgloss.wu')] entre otras almas endurecidas de los Jurchen, convirtió su hogar en un umbral. En realidad, no confiaba en la longevidad de la Corte de la Tortuga Negra. Más bien, esperaba que acabara cayendo debido a su naturaleza descentralizada.\nY, ominosamente, parece tener razón. Mientras el «Señor del Norte» de Hongben les ordena luchar, Maedaeri espera en los flancos de sus impulsivos ejércitos.\nEspera al momento oportuno, usando su buena voluntad como ancestra para ganar tiempo. Espera algo. Y las puertas están a punto de abrirse.\n\nDestino futuro\nLa muerte de Hongben sacude a la Corte del Emperador Amarillo hasta su colapso, pero lo único que logra es liberar a Maedaeri.\nMientras Li lanza docenas de [Glossary('Wu','podgloss.wu')] a la muerte, Maedaeri se convierte en una fuerza de sabiduría y poder en el Wu del Norte de la Corte del Emperador Amarillo y los restos de la Corte de la Tortuga Negra. Cuando llega el momento, lidera la vanguardia contra el lugar de descanso de Dobrul, en un ataque de todo o nada.\nAunque perece temprano en la batalla, sus movimientos logran abrir a golpes el lugar de descanso de Dobrul, asegurando la victoria para los $pod_kueijin$ y el eventual nacimiento del Quincuncio."
 POD_persistentpodlore.desc.793381: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nTodo Visionario necesita una mano derecha. Y ante las puertas de lo que muchos $pod_kueijin$ consideran el ejército del [Glossary('Emperador Demonio','podgloss.demonemperor')], Wugunai mantiene esa línea por Maedaeri.\n\nEn su día, Wugunai no era más que uno de los incontables jinetes Jurchen. Vivió y murió como tal, una vida anodina sin mucha sustancia.\nPero el [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] pareció sacudir algo en la médula de su alma. Su huida le llevaría al sur, donde buscó a un Visionario de su pueblo. Maedaeri, la guerrera, fue a quien encontró y se convirtió en su primera discípula. Y por ello, se ha convertido en su mano de confianza.\n\nDentro de su dominio, Wugunai supervisa a todos los que pasan. Ambos, incluso dentro de su [Glossary('Wu','podgloss.wu')], son hermanos de sangre jurados.\nMaedaeri ha dejado claro que, si algo le hacen a él, ella lo pagará por cuatro. Y ahora, mientras los [Glossary('Anda','podgloss.anda')] se acercan, Li se vuelve más impulsivo y la Corte de la Tortuga Negra comienza a caer en la violencia, Wugunai es puesto a prueba.\nPero no puede fallar. No cuando sirve bajo el mando de su mejor amiga. Él llevará a cabo su causa hasta el final.\n\nDestino futuro\nWugunai sobreviviría al colapso de la Corte del Emperador Amarillo y más tarde atacaría contra los [Glossary('Anda','podgloss.anda')], pero con un gran coste.\nQue Maedaeri diera su vida por la victoria lo destruyó, e incluso cuando se formó el Quincuncio, él simplemente esperó en su corte. Al final, el vacío de la vida fue demasiado. Se despidió de su [Glossary('Wu','podgloss.wu')], salió al exterior y esperó a ver el sol de la mañana una última vez."
 POD_persistentpodlore.desc.793382: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nDentro de la Corte del Emperador Amarillo, el Norte bajo el mando de Li se ha desconectado, incluso del [Glossary('Wu','podgloss.wu')] del Gorrión Ámbar. Pero por esa razón, los poderosos Ancestros de Hebei tienen un mensajero personal a su disposición.\nY en una época como las noches actuales, ser mensajero en tierras tan divididas y caóticas como estas es a menudo una sentencia de muerte. Pero los Guerreros de Hebei tienen uno excepcional. E incluso entre los mensajeros Dhampyr del Gorrión Ámbar, Mutawuta es respetado por encima de todos.\n\nMensajero Jurchen en vida, Mutawuta murió de la forma en que muchos mensajeros lo hacen: al entregar malas noticias, fue hervido vivo por la ira de aquel señor. Pero la ejecución le dio un mensaje propio que entregar, y que el Infierno no lo retendría.\nY lo entregó con sangre al señor que lo mató.\n\nMás tarde civilizado por los $pod_kueijin$, se convirtió en discípulo de Maedaeri, sirviendo como su voz incluso sin acceso a la Corte del Emperador Amarillo. Mutawuta se convirtió en un mensajero absolutamente soberbio.\nY ahora, a petición de ella, se ha estado desplazando discretamente por el [Glossary('Wu','podgloss.wu')] del Norte, preparándose para una fuerza unida ante la tormenta que se avecina. Como ella le dice, un enfrentamiento con los [Glossary('Anda','podgloss.anda')] en China es inevitable. Y deben estar listos.\n\nDestino futuro\nMutawuta permitiría que los $pod_kueijin$ del norte de China se unieran contra los [Glossary('Anda','podgloss.anda')], logrando que sus misivas lleguen a los oídos adecuados.\nSin embargo, su habilidad y reputación lo harían una amenaza y, con el tiempo, será asesinado entre el Quincunx, supuestamente por el Dhampyr que antaño lo respetaba, tras la orden de su padre de eliminar esta amenaza."
 POD_persistentpodlore.desc.793383: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEs un estereotipo común entre las Cortes del Emperador Amarillo que todos en las estepas son jinetes. Si bien es cierto que es útil, no todo el mundo prefiere luchar a caballo, y algunos son tan peligrosos a pie como un jinete montado.\nEntre los Guerreros de Hebei, Mapo es la prueba de ello. El hombre bestia con su hacha es temido entre los $pod_kueijin$ del norte; su reputación y su apetito por la destrucción le preceden.\n\nPero en vida, su historia fue mucho menos accidentada. Hijo de reserva tras el heredero de un caudillo Jurchen, Mapo era un chico tranquilo, pesado y tímido.\nAl principio odiaba luchar y, en gran medida, temía herir a los demás. E incluso siendo adulto, era bastante solitario y se dedicaba a la gestión de recursos. Pero un accidente mientras cabalgaba provocó la muerte de Mapo, ahogándose en un río tras un golpe en la cabeza. Y en el Infierno de los Mares Hirvientes, ser una boya hinchada durante lo que parecieron siglos fue una agonía, antes de que un $pod_kueijin$ lo salvara y lo llevara ante Maedaeri para su entrenamiento.\n\nAsustado de volver a ser débil, Mapo se entregó al combate como pez en el agua. Su Ansia por la batalla y el sustento creció, hasta que se convirtió en el titán que es ahora. A menudo, él es el músculo en la corte de Maedaeri, aquel en quien la gente piensa cuando oye hablar de los Guerreros de Hebei.\n\nDestino futuro\nMapo cabalgaría con Maedaeri cuando ella pusiera en marcha la destrucción de los [Glossary('Anda','podgloss.anda')]. Pero para su consternación, ella le exigió que se quedara y custodiara sus hogares en caso de que ella fallara.\nCuando supo de su muerte, quedó devastado, pero luchó por preservar su legado como una de las voces fundadoras del Quincunx."
 POD_persistentpodlore.desc.793384: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEntre las cortes guerreras de Hebei, muchos asumen que afrontan cada problema de frente. Y es cierto: en su corte, todos son guerreros. La situación política en la que se encuentran no exige menos. Y eso hace que aquellos que mueren en caminos inseguros por una sola flecha bien colocada resulten aún más trágicos.\n\nSeguramente el silbido a lo lejos no sea más que el viento.\n\nSain es un enigma entre los Guerreros. Un arquero y halconero soberbiamente hábil incluso entre los Guerreros; rara vez está en el frente. Más bien, siempre está en la retaguardia junto a sus [Glossary('Wu','podgloss.wu')], con sus flechas especializadas y bien colocadas aniquilando numerosas amenazas; algunos incluso dicen que están impregnadas con el veneno de los asesinos de la Madre Esmeralda.\n\nAlgunos sospechan que incluso pudo haber sido uno de ellos en vida. Pero la verdad del asunto queda entre él y Maedaeri. En realidad, es un asesino, simple y llanamente.\nEl rostro de un guerrero es una máscara conveniente. Y en tiempos como estos, la flecha sutil es la más mortal.\n\nDestino futuro\nSe desconoce qué ocurrió con Sain. Maedaeri le dio órdenes especiales para alejar a un escuadrón de la muerte [Glossary('Anda','podgloss.anda')] de la fortaleza de su maestro.\nPero nunca pudieron encontrar su espíritu, por lo que se asume que murió. Pero al final, logró desviar a los jinetes negros de los [Glossary('Anda','podgloss.anda')] para que no interfirieran en el plan de Maedaeri. Mapo está seguro de que, si murió, lo hizo con una sonrisa en el rostro y desafío en los labios, sabiendo que lo habían logrado."
 POD_persistentpodlore.desc.560126: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nDữu Thúy, oculta durante mucho tiempo en las sombras, observa cómo un Dragón danza entre las nubes en detrimento de todos los que están debajo, mientras otro surge de la selva en un frenesí que amenaza con atraer la ira de la tierra sobre ellos. A medida que las Cortes a su alrededor caen, ¿qué puede hacer siquiera una discípula?\n\nDữu Thúy, en vida, fue trabajadora sexual en la costa vietnamita, asesinada por su «gestor» en una disputa de pagos. En el Pozo de Sal y Hierro, se encontró con que su vida mortal simplemente se llevaba al extremo.\nPero era paciente y hábil con el látigo, tanto con sus clientes como con ella misma. En el Infierno, aprendió que incluso en la muerte, nunca se sintió más viva que cuando estaba bañada en dolor.\n\nUsando su entusiasmo como cobertura, logró convencer a un demonio para que les permitiera realizar una sesión en el mundo de los vivos, de donde escapó rápidamente hacia su libertad.\nEncontrada y luego civilizada por Dyanang como una de sus discípulas, Dữu Thúy fue una devota, aunque aterradora, seguidora de los Dragones Azotadores.\n\nPero eso fue entonces. Y ahora, se encuentra en una encrucijada. Su mentora se ha vuelto distante y, en gran medida, ha dejado atrás el mundo, y los [akuma|E] ahora andan sueltos.\n\nSin embargo, una compañera discípula, Piyau, es más radical que ella misma. Dữu Thúy está dividida, ya que la situación exige acción. Así que debe actuar, no sea que también caiga víctima de los demonios que la rodean.\n\nLa pregunta es: ¿con qué Dragón debería aliarse?"
 POD_persistentpodlore.desc.793386: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEntre los $pod_kueijin$ de Echizen, pocas artes son tan respetadas como la del modelado del tapiz de esencia y vida. Los talismanes se suministran en grandes cantidades. Los artesanos mortales encuentran gran trabajo y respeto entre sus miembros, y en el origen de todo se encuentra su fundador, el Sabio de la Vida.\n\nKasumi nació en el periodo Asuka, hija de herreros en la provincia de Yamato. Su familia tenía una posición relativamente acomodada... al menos hasta la institución del Código Taihō. Su padre, a pesar de ser una figura respetada localmente, no era de nacimiento noble y, por tanto, bajo el nuevo edicto, fue despojado de la influencia y el prestigio que poseía.\nDurante un tiempo se resistió a ello, pero el Estado no lo permitió. Cuando la capital fue trasladada, intentó llevar a su familia a la nueva para seguir defendiendo sus derechos, pero un altercado con los guardias escaló y Kasumi fue apuñalada en la garganta por un guardia.\n\nEl [Glossary('Kakuri','podgloss.kakuri')] fue horrible para Kasumi. Cuando escapó, se encontró buscando desesperadamente aferrarse a la vida. No deseaba nada más que vivir, crear, moldear. El frío de la muerte le asustaba más que cualquier otra cosa. Mientras que la mayoría de su clan serían nobles Grullas o decididas Sombras, Kasumi luchaba por puro miedo al [Glossary('Kakuri','podgloss.kakuri')]. Mantuvo contacto con el continente, moldeó y creó, y pronto otros se reunieron a su alrededor.\n\nEn su danza de artificio, construyó todo un clan. Y debido a su interés por los visitantes, un rebelde de piel fría le robó el corazón. Sin que la mayoría lo supiera, la tolerancia de Echizen hacia los otros Bebedores de Sangre en Japón no nació de la practicidad, sino del amor.\n\nDestino futuro\nKasumi elevaría su Clan aún más, pero su tiempo se agotaría. Durante el ascenso del Shogunato Tokugawa, mientras bailaba con su amante Yoshino, unos asesinos de [Glossary('Mikaboshi','podgloss.mikaboshi')] la emboscaron.\n\nFue abatida, pero su amante, conociendo el miedo de Kasumi a la Muerte Definitiva, le concedió una misericordia. Kasumi utilizó su maestría en el modelado del alma e instruyó a Yoshino en un acto profano: Yoshino devoró a Kasumi entera, alma y todo, arrancándole los ojos para reemplazarlos con los de Kasumi y, finalmente, consumiendo sus propios ojos para integrar a Kasumi en su interior.\n\nAsí, el primer acto de un Vástago devorando el alma de un $pod_kueijin$ no se realizó por la lujuria del poder, sino por amor. Y ese nuevo ser llegaría para guiar su linaje hacia una nueva noche."
 POD_persistentpodlore.desc.793219: "Este personaje es parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por eso, fue ampliado por los desarrolladores de PoD para aportar mayor profundidad al escenario.\n\nEntre los sirvientes más temidos de los [Glossary('Reyes Yama','podgloss.yamaking')] se encuentran aquellos que pertenecen a [Glossary('Emma-O','podgloss.emmao')], los Asesinos [Glossary('Shikome','podgloss.shikome')]. Inspiran una lujuria servil en quienes son susceptibles a los encantos de una mujer y una Furia asesina en quienes no sienten atracción por ellos, con un temible dominio de las artes óseas y métodos de asesinato. A excepción de aquellos que huyeron tras escuchar las palabras de un monje errante en [Glossary('Kakuri','podgloss.kakuri')], ninguno se ha liberado de [Glossary('Emma-O','podgloss.emmao')]. Todos menos uno.\n\nEn su vida mortal, Yukio era una actriz tradicional del precursor del Noh, renombrada en su aldea por su voz. Sin embargo, su vida fue corta y fue abatida durante la noche por un patrón que le arrebató el aliento. Y en [Glossary('Kakuri','podgloss.kakuri')], su canto para centrarse atrajo la atención de [Glossary('Emma-O','podgloss.emmao')], quien rápidamente envió a sus [Glossary('Shikome','podgloss.shikome')] para recogerla y recluirla en su harén.\n\nMoldeándola a sus deseos, haciendo que cantara para su ocio y actuara como una sirena para las almas condenadas, y satisfaciendo sus deseos más bajos con los [Glossary('Shikome','podgloss.shikome')], durante un tiempo no fue más que otro monstruo en el harén militar de [Glossary('Emma-O','podgloss.emmao')]. Pero Yukio ocultó fragmentos de su alma en su voz y, cuando se le encomendó la tarea de custodiar la Cueva de las Doncellas, mató a sus compañeras y huyó.\nPocos confiaban en una antigua [Glossary('Shikome','podgloss.shikome')], pero Kuro-sama, el respetado mentor de los asesinos $pod_kueijin$, decidió arriesgarse con Yukio.\nVio en sus ojos esa Furia, un deseo oculto de venganza por la profanación que [Glossary('Emma-O','podgloss.emmao')] le había infligido. Así, ha pasado a estar bajo su protección y se está consolidando rápidamente como una de sus mejores alumnas.\n\nDestino futuro\nCon el tiempo, Yukio llegaría a ser la mejor asesina entre un clan de asesinos. Su sed de venganza se convirtió en una infalible flecha de determinación, formando un [Glossary('Wu','podgloss.wu')] de asesinos igualmente hábil a su alrededor como la mano oculta de los Koga.\nAunque una mala Misión en Shanghái empañó su imagen, aprendió de ello y templó aún más su voluntad. Se esforzaría por restaurar su reputación tras haber olvidado su motivación. Así que, una vez más, recorre el Camino de la maestra asesina, buscando la confrontación final y la liberación de la venganza que la muerte de [Glossary('Emma-O','podgloss.emmao')] le traerá."    
 POD_persistentpodlore.desc.793388: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nA pesar de las largas afirmaciones en contra, la Corte del Fénix Escarlata nunca ha estado unificada. No, eso fue simplemente una pretensión de Dyanang. Las tierras del río siempre se han opuesto al dominio de la Corte y, al frente de las diversas cortes Shan, Karen y Mon, estaba la antigua Ancestral Solyna, la venerable maestra de las artes del fuego.\n\nSolyna es del pasado remoto de los Mon. Nacida en la ciudad de Pegu poco después de su fundación, Solyna tuvo una vida corriente en su mayor parte, pero un descuido con el fuego de la cocina la acortó cuando murió cuando su casa colapsó entre llamas y la envió al Infierno de los Mares Ardientes.\nA pesar de esto, Solyna abrazó su muerte y, en su lugar, utilizó el alquitrán de los mares ardientes como medio de su liberación, grabando la llama en su alma y escapando de vuelta al mundo como parte de un incendio forestal. Fue recogida por el [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')], pero siempre lo encontró una alma increíblemente intrépida y obstinada de civilizar. Menos preocupada por la Iluminación, se dedicó a proteger su hogar de las influencias externas, y regresaba al lugar de su nacimiento para convertirse en pieza clave en la construcción de las primeras Cortes Mon, desde donde gobierna hasta el día de hoy.\n\nDestino futuro\nLa tenaz voluntad de independencia de Solyna se convertiría en su gran guerra. Aunque aceptó brevemente la pacificación por parte de Piyau, sabía que Piyau estaba cerca del ascenso.\nTan pronto como Piyau alcanzó las [Glossary('Hundred Clouds','podgloss.hundredclouds')], Solyna reanudó inmediatamente su guerra contra los birmanos, esta vez bajo la forma de la Ancestral de las Cortes Doradas de Mandalay. La llegada de los británicos le presentará una oportunidad para tomar finalmente la delantera."
 POD_persistentpodlore.desc.793389: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nNormalmente, entre los ancestros más antiguos de los $pod_kueijin$, se asume que una vez que se encuentran ante las puertas de la salvación, la cruzan. Aquellos que se quedan atrás son raros y resultan casi ajenos a la mentalidad tanto de mortales como de no-muertos.\nY, sin embargo, dentro de los cargos de los $pod_kueijin$ del Monasterio Shaolin, hay alguien que lleva mucho tiempo en ese paso y que, aun así, se niega a cruzarlo, sirviendo como una luz al final del túnel para los aspirantes.\n\nWuji es antiguo, y no posee Renombre ni en la vida ni en la muerte. Ni siquiera recuerda de qué Infierno proviene, y algunos jóvenes aspirantes susurran que podría haber sido uno de los Mil Inmortales originales. Wuji les disuade de ello, pero, no obstante, su mandato como una de las autoridades supremas del Camino Quíntuple desde el ascenso de Xue ha sido un pilar central de la autoridad de la Corte del Emperador Amarillo. Wuji siempre ha tenido la atención de los principales ancestros de cada corte, y especialmente dentro de China, siempre ha estado al lado de la Corte del Emperador Amarillo.\nY aun ahora, en estos tiempos de tribulaciones, mantiene el rumbo. Lo hace porque sabe que si él entra en pánico, todos lo harán. Así que permanece como un faro resuelto en esta tormenta de caos.\n\nDestino futuro\nWuji, sin embargo, sabe leer el ambiente. Con el asesinato de Wang Hongben y el colapso de la Corte del Emperador Amarillo, el caos resultante es tan profundo y terrible que Wuji, al verlo todo, se cierra sobre sí mismo y asciende a las [Glossary('Hundred Clouds','podgloss.hundredclouds')], dejando atrás este mundo mortal para siempre."
 POD_persistentpodlore.desc.793390: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEn un ala de los Monasterios Shaolin, en la torre más alta, alcanza una altura tal que los nidos de dragón autóctonos provocan una regular y suave nevada. Orientada hacia el norte, resulta ominosa, mientras el Sabio Lübing observa una tormenta que siente que podría presagiar la perdición para las Cortes.\n\nLübing es el segundo más antiguo de los Sabios del Camino Quíntuple, y el más enigmático de ellos. Contemporáneo de Wuji, él y Wuji estuvieron codo con codo como jóvenes $pod_kueijin$, e incluso Lübing atestigua que Wuji lo rescató de [Glossary('Kakuri','podgloss.kakuri')].\nA diferencia de muchos, Lübing encontró un extraño consuelo en el frío, y halló el mordisco invernal como un amigo familiar y un crisol de sabiduría. Y al igual que Wuji, permaneció a pesar de ser plenamente capaz de ascender más.\nCon ese fin, predica y da sermones principalmente sobre la templanza y la piedad, combinadas con resolución estoica y paciencia silenciosa. Es un modelo de todas ellas, e incluso con sus sermones de temperamento equilibrado, apenas más fuertes que un susurro, muchos estudiantes han encontrado sus caminos intensamente inspiradores.\nLleva una oscuridad en su interior, pero una que lo ha hecho mucho más fuerte y, para sus alumnos, mucho más noble. Y en tiempos como estos, esa fuerza de voluntad escasea.\n\nDestino futuro\nEl Sabio de la Nieve reaccionaría ante la muerte de Wang Hongben con su clásica y resuelta voluntad. Cuando Wuji ascendió, Lübing simplemente puso sus asuntos en orden, preparó a los otros Sabios y luego se retiró a su balcón. Y cuando llegó la mañana, se había ido, habiéndose marchado con su hermano de sangre hacia cualesquiera mundos que existan más allá."
 POD_persistentpodlore.desc.793391: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nPara la gran mayoría de la gente, el fuego es algo terrible, algo que chamusca y mutila, algo que destruye y arrebata. Pero entre los Sabios, el Sabio Hongjian insiste en que la gente recuerde para qué se usa también el Fuego: cocinar carne, mantener el calor en el frío, crear más combustible y, en un sentido más oculto, renutrir la tierra, ya que los campos con cenizas son más fértiles que los que no han sido quemados.\nEsa es su lección. Una que aprendió de forma muy directa en los Mil Infiernos.\n\nLa vida mortal de Hongjian fue la de un pirata, pero su tiempo en el Infierno de los Mares Ardientes le enseñó muchas lecciones duras. Al dejar esa vida atrás al morir, fue rápidamente reconocido como un prodigio del Cuerpo Divino de la Llama, y su propia sabiduría y sagacidad le valieron un rápido lugar entre los Cinco Sabios.\n\nEs destructivo, pero nunca de una forma que aniquile. Más bien, crea para permitir que surjan cosas nuevas, para ser el terreno de otras cosas de grandeza. Su pasión es fácilmente visible, ya que en sus sermones pone a prueba a sus estudiantes mientras está envuelto en llamas, permaneciendo en un gran brasero para mostrarles su determinación.\nY ahora, como parece que el mundo entero está en llamas, se está convirtiendo rápidamente en un punto de inspiración y piedad.\n\nDestino futuro\nHongjian se vio conmocionado por la muerte de Wang Hongben, pero tras su tiempo de duelo y preparación antes de Wuji y Lübing, afrontó este desafío de frente.\nMuchos habrían esperado que le fuera bien, pero eso llegó a un final abrupto cuando un día, mientras realizaba una Misión contra los degenerados no-muertos menores de Japón, uno de ellos lo embistió en la pira y lo desintegró en una tempestad de relámpagos salpicados de sangre."
 POD_persistentpodlore.desc.793392: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nPara quienes solo conocen a los Sabios del Camino Quíntuple por lo que otros dicen de ellos, Renyuan parece un miembro imposible. Un joven apuesto que suele verse relajado rodeado de sus hijas, a las que alimenta con cortes selectos de carne y otros manjares, parece la viva imagen del hedonismo y no de la sagacidad. Y, sin embargo, esto también es una suposición.\nComo parte de los Dragones Azotadores, pocos lo encarnan más que Renyuan.\n\nLa vida mortal de Renyuan fue originalmente la de un monje, pero esa vida nunca funcionó para él. Su estancia en el Infierno de ser Desollado Vivo lo dejó extrañamente... embriagado por las sensaciones del dolor y la experiencia.\nPero con su escape, parecía tener más ganas de ser simplemente el cuerpo que siempre era despedazado solo para volver a tambalearse. Pero el maestro Kang Cho-lu arriesgó con él y descubrió que su entrenamiento monástico no se había desperdiciado. Renyuan registró cada experiencia con un detalle profundo. A veces era un cretino codicioso, glotón y lujurioso, pero realmente meditaba sobre las experiencias de una vida vivida al máximo, con el mismo grado de crítica y reflexión que un Sabio.\nComo tal, fue enviado como enviado a los Cinco Sabios, quienes en realidad lo elevaron a uno de los suyos como Sabio de los Dragones Azotadores. Y, de forma más práctica, sus numerosos hijos dhampir se convirtieron en un personal bastante hábil para su Monasterio. Sus escritos se convertirían en piezas clave de estudio para los jóvenes Dragones, asumiendo que pudieran al menos tolerar los olores, por supuesto.\n\nDestino futuro\nRenyuan afrontó la muerte de Wang Hongben con un extraño grado de certeza y acción directa, sin perder tiempo en hacer que su linaje fortificara sus propiedades.\nSobrevivieron a la [Glossary('Anda','podgloss.anda')], y cuando el Quincuncio se reformó, Renyuan se esmeró en reconstruir las grandes obras de los Sabios hasta su pleno esplendor. Sin embargo, mientras la Larga Noche se convertía en Noches Modernas, murió tal como vivió: cuando un estudiante resultó ser un asesino y lo devoró en su lecho procreador hasta el último trozo de carne."
 POD_persistentpodlore.desc.793393: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEntre los cuatro Sabios más conocidos, siempre se mencionan a un quinto, aunque rara vez visto. Teorizado por quienes nunca los ven como un Tigre Diablo para completar los auspicios de su [Glossary('Wu','podgloss.wu')], muchos piensan que es un asesino que rara vez enseña sus caminos a otros a menos que sean dignos.\n\nEn realidad, el Quinto Sabio suele estar realizando la labor honesta de Civilizar Demonios Infantes. Como sabe que una mujer Xianbei sería un escándalo andante, Pusuwan se esconde de la vista, aunque no sea menos igual al resto de su [Glossary('Wu','podgloss.wu')].\n\nBuscando demonios feroces para civilizar y traer para su entrenamiento, rara vez da sermones porque, para ella, la meditación es acción en sí misma. No medita en una habitación en busca de salvación; lo hace salvando las existencias de los demonios feroces de la destrucción o de caer en manos de los Reyes Demonio.\nUno no alcanza el cielo sentado en una habitación sin hacer nada; se logra arrancando la podredumbre del mundo mediante la matanza de [akuma|E]. Y desde sus oficinas en el Monasterio de Shaolin, Pusuwan organiza las diversas funciones de los Tigres Diablo para su guerra contra los Reyes Demonio, habiendo sido cambiada para siempre por el [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] en su vida mortal como la esposa de un olvidado jefe Xianbei.\n\nSus sermones no son algo que se predique, son misiones. Sus libros no son textos polvorientos, son manuales de combate para luchar contra los Profanados. Así es lo que el Cuervo Sin Sombra le enseñó. Así es lo que ella enseñará a sus estudiantes.\n\nDestino futuro\nPusuwan sería la única de los Sabios en sobrevivir hasta las noches actuales. Protegiendo el monasterio y organizando más y más misiones, ni siquiera las turbulentas noches actuales pudieron quebrarla. Pero ahora, mientras [Glossary('Mikaboshi','podgloss.mikaboshi')] asciende cada vez más hacia ese trono, la condición del mundo la inquieta enormemente. Así que ha comenzado a invertir para mejorar las vidas mortales con redes de bienestar y apoyo, abriendo un nuevo campo de batalla en su guerra eterna contra los Reyes Demonio."
 POD_persistentpodlore.desc.793394: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\Nacido como un trabajador tradicional de la medicina en los días de Gaozu, la vida mortal de Xilie estuvo definida por la guerra. Forzado a vivir las secuelas de la caída de la Dinastía Xin y la violencia del periodo de los Dieciocho Reinos, la vida de Xilie estuvo plagada de violencia. Todo lo que quería era un fin para ello.\n\nSin embargo, su vida sería en vano, ya que a lo largo de la guerra, no fue más que uno de tantos que murieron en la marea de violencia.\n\nY en Lanka, al darse cuenta de que su destino era solo violencia interminable, se quebró. Huyó rápidamente y tan rápido como sus piernas se lo permitieron, suplicando a cualquiera que quisiera escucharle. Y alguien respondió después de mucho tiempo. Qiang Ru, un demonio joven pero astuto, vio la inteligencia de Xilie como algo útil.\nAsí que le ofreció un trato, en nombre de... algo más. Fuera lo que fuese, Xilie aceptó de buen grado y con todo su corazón. Y traído al mundo de los vivos, el tranquilo doctor trabaja en las sombras para su [Glossary('Wu','podgloss.wu')], evitando el protagonismo.\nEse es su deseo. Esa fue la naturaleza de su trato."
 POD_persistentpodlore.desc.793395: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nLa más joven de las Cervezas Esmeralda, Hemavati es la que más destaca. Desde el mismo borde de las tierras donde habitan los $pod_kueijin$, Hemavati nació en la región de Cachemira, hija de Dalits. Expulsada al exilio siendo niña por las invasiones Ghaznavid, estuvo entre los desplazados enviados a un largo exilio en Europa. Pero Hemavati murió joven, pereciendo justo antes del Muro.\nY por ese crimen, se encontró, por alguna retorcida broma, en Lanka, donde fue maldita a vivir constantemente como una refugiada en la violencia de la Ciudad Demonio.\n\nHemavati siempre estuvo desesperada por escapar. Dispuesta a hacer lo que fuera necesario por el bien de la liberación. Y con ese fin, encontró a alguien que buscaba a otros dispuestos a hacer lo que fuera necesario. El extranjero Qiang Ru encontró a la desesperada demonio y le ofreció un trato.\n\nHemavati no discute la naturaleza de ese trato. Pero lo aceptó. Necesitaba recuperar su libertad, extrañaba el cielo abierto. Extrañaba la comunidad, anhelaba un escape de la violencia constante. Y Qiang Ru también le dio eso.\n\nDesde entonces, Hemavati ha sido la profetisa de las Cervezas Esmeralda. Divina y trabaja como narradora, una agente del destino para el bien de las Cervezas.\nCómo aprendió esto es desconocido, pero la Mujer Sabia no se atreve a contarlo. No quiere poner en peligro su libertad perdida."
 POD_persistentpodlore.desc.793396: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nQun, al igual que su hermana Youwu, es una figura aterradora para quienes se encuentran con Qiang Ru. De pie a su lado como una sombra invertida, Qun simplemente mira con desdén a todos los que suplican en la corte.\nUn terror con un aire implícito de malicia.\n\nEn vida, era radicalmente diferente. Qun y Youwu eran gemelos semidenticos. Y ambos simplemente querían una vida normal. Y, sin embargo, para el resto de su aldea, eran dos niños monstruosos que parecían fantasmas, odiaban el sol y eran inquietantemente cercanos, mucho más de lo que un hermano y una hermana deberían ser.\nY finalmente, como adultos, cuando no mostraron indicios de volverse más normales, los gemelos fueron acusados de brujería. Los gemelos intentaron negarlo, pero su propio dolor de pánico y las quemaduras solares por su albinismo los condenaron, así que ambos fueron asesinados.\n\nY por la angustia de su muerte como brujos, se encontraron en el Infierno de la Magia Miserable. Así que ambos gemelos se acurrucaron juntos, haciendo todo lo posible por sobrevivir. Y cuando Qiang Ru les ofreció un trato, lo aceptaron. De forma inmediata e instantánea.\n\nAhora, Qun está contento. Como guardaespaldas, puede tener una vida lo más cercana posible a la normalidad con su hermana. Incluso siendo un cadáver, y fuera cual fuese su trato, ahora al menos puede ser respetado, valorado y atesorado.\nY su lealtad no llevará ni una sola mancha."
 POD_persistentpodlore.desc.793397: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nYouwu, al igual que su hermano, es una figura amenazante para quienes se encuentran con Qiang Ru. De pie a su lado como una sombra reflejada, Youwu simplemente observa a todos los que acuden a su corte.\nUn Azote con un castigo tácito para quienes lo desafíen.\n\nEn vida, ella era radicalmente diferente. Youwu y Qun eran gemelas semidenticas. Y ambas solo querían una vida normal. Y, sin embargo, para el resto de su aldea, eran dos niñas monstruosas que parecían fantasmas, odiaban el sol y estaban inquietantemente unidas, mucho más de lo que un hermano y una hermana deberían estar.\nY finalmente, al llegar a la edad adulta, cuando no mostraron indicios de volverse más normales, las gemelas fueron acusadas de brujería. Las gemelas intentaron negarlo, pero su propio dolor y pánico, junto con las quemaduras solares por su albinismo, las condenaron, por lo que ambas fueron asesinadas.\n\nY ante la angustia de morir como brujas, se encontraron en el Infierno de la Magia Miserable. Así que ambas gemelas se acurrucaron juntas, haciendo todo lo posible por sobrevivir. Y cuando Qiang Ru les ofreció un trato, lo aceptaron. Con prontitud e instantáneamente.\n\nDesde entonces, Youwu ha sido con alegría la Maestra de la Guerra de Sombras de Qiang Ru. Se deleita en ello, teniendo poder y un sentido de pertenencia en la guerra y la planificación.\nY ahora con su hermano, tiene todo lo que siempre quiso en la vida. Mientras los Biers Esmeralda elevan a la Corte de Jade, ella lo hace siempre sonriendo desde las sombras. Y mientras está en ella, se pone sin dudarlo la máscara de la carnicería asumida."
 POD_persistentpodlore.desc.793398: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEntre las Cortes de la Noche, un [Glossary('Wu','podgloss.wu')] ocupaba una posición precisamente única: controlar las manos del poder mortal. Todos estos [Glossary('Wu','podgloss.wu')], las Dagas de Hielo Plácidas, provienen en realidad de los Eunucos de la Corte. Y la más antigua de ellas es aquella que trascendió lo que «él» fue una vez para convertirse en la Diosa que Mueve las Manos del Estado.\n\nYi'an fue una vez un eunuco sin importancia al servicio del Imperio Han, pero cometió el error de nacer en el peor momento para tal ocupación. Aunque entró al servicio siendo joven, tanto que nunca le creció barba, siempre fue solo una figura en segundo plano.\nPero cuando un grupo diferente de eunucos empezó a hacerse con el poder, la reacción en cadena de acontecimientos llevaría a que la gran mayoría de ellos fuera ejecutada a pesar de no ser responsables, incluida Yi'an, durante la Masacre de los Diez Asistentes.\n\nY cuando despertó de la muerte, se encontró convertida en una esclava sexual en el Pozo de Sal y Hierro. Pero, a pesar de lo que muchos habrían considerado el peor destino posible, el eunuco se sintió extrañamente... liberado.\nAl hacerse pasar por mujer, pudo convencer a varios otros esclavos para conspirar, y utilizó eso como trampolín para escapar del Infierno. Y cuando el [Glossary('Civilizador del Diablo Infantil','podgloss.infantdevilcivilizer')] le preguntó su nombre, Yi'an eligió uno nuevo y aceptó su feminidad asumida.\n\nYi'an construiría su poder a lo largo de su no-vida en las estructuras que conocía. Nunca se molestó en curar los cambios que sufrió y aceptó su nueva identidad.\n\nLas Dagas de Hielo Plácidas se convertirían en el principal puente $pod_kueijin$ hacia la política mortal, como patrocinadores ocultos de eunucos y utilizándolos como sus pantallas. Sin embargo, a medida que la dinastía Song flaquea ante la marcha del Kan, Yi'an podría perder sus grandes obras.\n\nDestino Futuro\nLa base del poder de Yi'an sería destruida por los mongoles, pero no su influencia. A pesar del declive de la clase de los eunucos, Yi'an se reposicionaría entre las trabajadoras sexuales y se convertiría en una Madame, antes de que, tras milenios de paciencia e influencia, ascendiera a las [Glossary('Cien Nubes','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793399: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nNacido en la etnia Qiang, Yuanheng fue, en su juventud, un rebelde. Y luego, cuando eso falló, un eunuco como castigo por sus crímenes. Y después, en la edad adulta, un hábil servidor del estado. Y desde que murió por una infección intestinal y tras su regreso del Infierno de las Larvas Cavadoras, el Financiero de las Dagas de Hielo Plácidas.\n\nLa vida de Yuanheng existió a la sombra de los Wei del Norte. Nacido entre los Qiang, su familia se unía con frecuencia a los rebeldes contra ellos, y más tarde él mismo se unió a ellos.\n\nPero Yuanheng no fue más que uno de ellos que fue capturado y castigado con la castración. Pero a diferencia de muchos otros rebeldes, Yuanheng pareció reaccionar al calvario como una especie de penitencia, e hizo todo lo posible por servir al estado que, en su mente, lo había conquistado legítimamente.\nY cuando murió, lo habría tolerado, pero el destino resultante del Infierno no era algo que pudiera soportar. Almacenando tantas larvas especiales como podía tolerar para canjearlas por su libertad, finalmente logró escapar del Infierno y fue Civilizado entre los $pod_kueijin$.\n\nYuanheng cayó en la órbita de Yi'an y las Dagas de Hielo Plácidas poco después. Era astuto con el dinero y bastante bueno controlando su flujo, encontrando en los Tigres Diablo Mercantiles un inmenso consuelo.\nEstudioso y de temperamento equilibrado, se manejó bastante bien, junto con su frío desdén por sus semejantes. Y a medida que empezó a abrirse paso en los cargos de los eunucos de la Emperatriz, utilizó esas vetas de poder para vigilar constantemente la política mortal, incluso en tiempos tan caóticos como estos.\n\nDestino Futuro\nYuanheng vería la destrucción de la dinastía Song como un mensaje, y en su lugar desvió su riqueza acumulada hacia actividades mercantiles.\nComo un capitalista implacable a medida que se adentraba en el [Glossary('Dharma','podgloss.dharma')], continúa con sus cálculos monetarios hasta la era moderna; su pasado como eunuco Qiang de los Wei del Norte es ahora casi olvidado en su mente."
 POD_persistentpodlore.desc.793400: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nIncluso entre los antiguos eunucos de las Dagas de Hielo Plácidas, en términos de sus logros mortales, pocos podrían superar lo que Jiru había logrado. Un eunuco de rostro suave que se había ganado la atención del primer emperador de la dinastía Han, el Emperador Gaozu.\nA pesar de la actitud tosca del propio Emperador, la elegancia y belleza de Jiru le cautivaron y lo elevaron a gran altura. Y cuando Jiru llegó a la muerte, por un breve momento, se sintió satisfecho con lo que había logrado.\n\nSin embargo, para un eunuco que sedujo y encantó su camino hacia el poder, fue recompensado con el Infierno del Aceite Hirviendo. Solo por ofrecerse como esclavo de cama de un Rakshasa de paso logró escapar tras siglos de tormento, experiencia que le dejó el tacto de una mujer como algo repugnante.\nY cuando fue civilizado, se sintió simplemente eufórico de ser libre y tener la oportunidad de hablar con otros. Y con su carisma, su cuidado por los demás y su voluntad de dejar el pasado atrás, se convirtió en la voz del [Glossary('Wu','podgloss.wu')] que llegaría a ser las Dagas de Hielo Plácidas.\nLo cual sería un lugar en el que destacaría; si su carisma podía conquistar emperadores, seguramente podría conquistar a sus séquitos mortales.\n\nDestino Futuro\nJiru vería la destrucción de la dinastía Song y de su clase de eunucos con dolor, ya que veía genuinamente a la mayoría de los mortales allí como amigos.\nPero con el tiempo intentaría seguir adelante. Avanzaría hacia las noches modernas intentando cada vez más sonreír, antes de desvanecerse en la oscuridad como el antepasado de un pequeño pueblo en Xuzhao, donde desaparecería de los registros del Quincunx."
 POD_persistentpodlore.desc.793401: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAunque las Dagas de Hielo de la Felicidad son conocidas por sus talentos y conexiones como controladores de los Eunucos, algunos audaces [akuma|E] han asumido que están indefensos. Para su consternación, uno de los suyos ha derrotado a una gran cantidad de demonios. Y todo esto sin vista.\n\nAnqi, a diferencia de muchos Eunucos, no fue castigad[ROOT.Char.Custom('ES_OA')] ni ocupó el cargo por obligación. Más bien, Anqi era originalmente un monje budista, y uno bastante devoto.\nSin embargo, un día, mientras cumplía con sus deberes, sintió un repentino e inmenso dolor en la entrepierna y se despertó con un hombre con forma de serpiente rociándole veneno en los ojos. Y aun así, en ese pánico repentino, se concentró y se lanzó contra este monstruo desarmad[ROOT.Char.Custom('ES_OA')], y contra todo pronóstico, lo derribó antes de sucumbir a sus heridas y encontrarse en la Ciudad Demoniaca de Lanka.\n\nAl llegar allí, seguía mutilad[ROOT.Char.Custom('ES_OA')] y ciego, pero entonces, viéndolo como una prueba, volvió a sus meditaciones. A pesar de los mejores esfuerzos de los Rakshasa, no pudieron forzarlo a la violencia. Así que, finalmente, simplemente le dieron su libertad, expulsando a este obstinado pacifista del Infierno de la Violencia.\nY luego, tras algunas suposiciones iniciales por parte de los [Glossary('Civilizador del Diablo Infantil','podgloss.infantdevilcivilizer')], simplemente lo colocaron entre el [Glossary('Wu','podgloss.wu')] de los Eunucos, sin importarle que perdiera su «bastón» a manos de un cambiapieles de serpiente.\n\nEl papel de Anqi dentro de su [Glossary('Wu','podgloss.wu')] es el de protector. Habiendo utilizado una vez las Artes Marciales como forma de meditación, ahora le resultan sumamente útiles para proteger a su [Glossary('Wu','podgloss.wu')] de los Demonios.\nY aunque sigue sin matar, su sola presencia los protege. E incluso a pesar de su ceguera, es un terror sin parangón cuando se ve forzado a luchar.\n\nDestino futuro\nA Anqi no le afectó en gran medida la pérdida del principal medio de poder de su [Glossary('Wu','podgloss.wu')]. Su meditación y sus deberes hacia ellos tenían prioridad.\nY finalmente, gracias a su obstinado enfoque en su [Glossary('Dharma','podgloss.dharma')], ascendería al [Glossary('Cien Nubes','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793402: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nDada la intensa y profunda conexión de las Dagas de Hielo de la Felicidad con la cultura de la Corte de los Eunucos, uno asumiría que se abstienen en gran medida de cualquier cosa relacionada con «lo que perdieron». Pero para quienes interactuaron con él, Rangneng se siente como una tempestad de ira y frustración por lo que ya no tiene.\n\nRangneng en vida fue un guardia del palacio, pero muy rara vez hacía su trabajo. Un mujeriego en serie y un playboy arrepentido, Rangneng solía revolotear y dormir con las concubinas de forma rutinaria. Sin embargo, no era un hombre de sutilezas y, finalmente, fue descubierto y sentenciado a la castración por su crimen, siendo puesto al servicio de los Eunucos.\n\nPara Rangneng, este destino fue el infierno mismo, y en menos de un mes se quitó la vida para escapar de él. Solo para encontrarse entonces en el Infierno de la Sal y el Hierro, donde sus nuevos Atormentadores disfrutaban empujándolo aún más hacia la ira. Y durante siglos, estuvo allí.\nHasta que finalmente, tras demasiados tormentos, estalló y se abrió paso a golpes, gritando por el mundo de los vivos, siendo finalmente capturado por las Dagas de Hielo de la Felicidad e integrado en su seno.\n\nRangneng es un hombre colérico. Increíblemente colérico. Cruel, lujurioso y sin desahogo, y un hombre legendario por sus rencores, supervisa en gran medida las artes más sutiles de las Dagas de Hielo de la Felicidad, lo que le permite tener cierta vía de escape al eliminar cabos sueltos y silenciar amenazas.\nY a medida que más y más Eunucos entran en pánico ante la aproximación de las fuerzas mongolas, él, al menos, no tiene escasez de medios para desahogar su ira.\n\nDestino futuro\nA Rangneng no le importó mucho cuando la clase de Eunucos de Song fue destruida. Más bien, tan pronto como supo que los $pod_kueijin$ del sudeste asiático habían descubierto nuevas artes de la carne, corrió inmediatamente hacia ellos, presentándose ante su líder y exigiéndoles que le enseñaran cómo restaurar su virilidad.\nSu historia terminó siendo simplemente otra cena para el [Glossary('Penangallan','podgloss.penangallan')] Wati."
 POD_persistentpodlore.desc.793403: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nA lo largo de las muchas carreteras de peaje y controles de China, algunos de ellos tienen figuras extrañas que recaudan diversas «tasas de la corte» y similares. Pagos por protección y castigos para quienes no los pagan. Equilibrados entre puntos clave, pero no lo suficiente como para atraer la atención imperial.\nDispersos por todas partes y en su interior, extorsionando una cantidad masiva de monedas. Y a medida que fluye, entra en las manos del amo del Candado de Plata.\n\nXinfu siempre fue dotad[ROOT.Char.Custom('ES_OA')] con el dinero. Y siempre tan increíblemente despiadad[ROOT.Char.Custom('ES_OA')]. Estableció varios esquemas de protección siendo adolescente y luego se convirtió en la viva imagen de un terrateniente. Cuando sus inquilinos podían pagar más, él siempre tenía razones para que lo hicieran. Cuando fallaban, sus matones siempre estaban allí para cobrar.\n\nSolo le importaba que pagaran el alquiler. Y cuando se quejaban de que no podían permitirse comida, él les ofrecía generosamente tierra. No hace falta decir que, cuando murió de viejo, se encontró en el Infierno de ser Desollado Vivo, despojad[ROOT.Char.Custom('ES_OA')] de todo y quedado al desnudo.\nPero esto no le hizo cambiar. Se arrancó trozos de su alma para sobornar y salir de allí, donde regresó al mundo de los vivos en poco tiempo y pronto volvió a cobrar el alquiler.\nY desde esa base de poder, fundaría el [Glossary('Wu','podgloss.wu')] del Candado de Plata, el principal [Glossary('Wu','podgloss.wu')] financiero de la Corte del Emperador Amarillo. Xinfu pagó lo que se le debía, y lo hizo muy bien. Y así, sin apenas motivos para cuestionarle, se le deja a su aire.\n\nDestino futuro\nLa desaparición de los Song, a pesar de la agitación, no perturbó demasiado a Xinfu y a su [Glossary('Wu','podgloss.wu')]. Sin embargo, aunque su [Glossary('Wu','podgloss.wu')] se dispersara, él se mantuvo en su trabajo.\nNo obstante, durante la Revolución Comunista China, una masa de soldados acudió para matarlo. Y murió como cualquier otro terrateniente, siendo enviado gritando hacia la Muerte Definitiva."
 POD_persistentpodlore.desc.793404: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nLos refugios del Candado de Plata son algunas de las bóvedas más pesadas y cargadas de China. Siglos de explotación y recaudación de impuestos son algo difícil de proteger y, sin embargo, el Candado de Plata se ha mantenido en su mayor parte.\nY con ese fin, deben la mayor parte de su éxito a Huaizhen.\n\nHuaizhen en su vida mortal era un simple guardia de aldea, pero murió durante una incursión jurchen en China. Horrorizad[ROOT.Char.Custom('ES_OA')] por el [Glossary('Infierno de Cadenas con Púas','podgloss.hellspikedchains')], esperó pacientemente su momento y finalmente escapó haciéndose pasar por un guardia de zona, antes de huir por una puerta hacia el mundo de los vivos, donde conoció a su futuro [Glossary('Wu','podgloss.wu')] por mandato de los Ancestros.\n\nDada su vida mortal, Huaizhen fue una elección fácil para proteger su riqueza y, a medida que esta crecía, tuvo que mejorar. Organizando sus pantallas mortales, coordinando Dhampyres y, más tarde, a los jóvenes $pod_kueijin$, lo hizo todo y más para proteger sus numerosos alijos ocultos y bóvedas de riqueza y dinero.\n\nDestino futuro\nA pesar de su increíble éxito a largo plazo, Huaizhen perecería por un error. Cuando una incursión mongola se llevó uno de los alijos, para su gran sorpresa, Xinfu estaba furioso.\nConfundid[ROOT.Char.Custom('ES_OA')], intentó hacer más preguntas, solo para que Xinfu volcara un brasero y quemara a Huaizhen hasta la muerte."
 POD_persistentpodlore.desc.793405: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nUna parte importante de los «servicios» de los Silver Lock es la protección. Los guardias armados en caravanas de pago, las patrullas de carretera y otros medios de control son fundamentales para su éxito a largo plazo.\nEn su mayor parte, esto se hace bien y mediante un sistema increíblemente estructurado, con una protección de nivel militar bien financiada, todo ello financiado por Juyuan.\n\nEn su vida mortal, Juyuan fue tesorero de un puesto de guardia. Gestionar las finanzas militares era algo que siempre hacía, y lo hacía bien. La logística era su fuerte e, incluso con una financiación escasa, realizaba pequeños milagros mediante el buen uso de las cadenas de suministro y el forrajeo.\nSin embargo, tal función conlleva peligros peligrosos, y en una guerra que hace tiempo olvidó, fue una de las muchas víctimas cuando el fuerte fue saqueado, y uno de los pocos que se encontró en Lanka.\n\nNo obstante, Juyuan pudo oler el dolor en el viento y, mientras eran acorralados, aprovechó errores en su recuento y se escabulló de vuelta al mundo de los vivos. Recogido y civilizado, su mente para la logística hizo que fuera seleccionado por los Silver Lock, un papel en el que destacaría. Y con ese fin, sus servicios son ahora más importantes que nunca, especialmente a medida que los [Glossary('Anda','podgloss.anda')] se acercan a China.\n\nDestino futuro\nEl destino de Juyuan no duraría mucho después de aquello. Cuando los [Glossary('Anda','podgloss.anda')] se hicieron más presentes y el comercio chino se estremeció de miedo, Xinfu respondió a las advertencias de Juyuan sobre la necesidad de frenar arrancándole la mandíbula y golpeándolo hasta convertirlo en una mancha de músculo y pulpa."
 POD_persistentpodlore.desc.793406: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nPara un maestro de asesinos, pasar desapercibido es una bendición. En los escondites y bases ocultos del Candado de Plata, hay quienes hablan de un quinto miembro, pero pocos lo ven. En realidad, Fengji simplemente ve poca necesidad de interactuar con otros. De todos modos, odia la conversación.\n\nFengji ha estado enfadado toda su vida. Nacido con una estatura increíblemente baja y siendo objeto de burlas por parte de sus propios padres, envidiaba el amor que recibía su hermana. Lo deseaba desesperadamente.\nY, sin embargo, cuando crecieron y ella se casó, sus padres trataron a Fengji de forma horrible a pesar de ser el heredero. Al no casarse nunca debido a su incapacidad para encontrar esposa, se volvió profundamente amargado y colérico, arremetiendo con regularidad mientras se aislaba.\n\nY así fue su vida: morir viejo, solo y sin amor, para luego despertar en [Glossary('Kakuri','podgloss.kakuri')]. Al menos por su parte, su desprecio por el mundo era tan poderoso que ni siquiera la belleza sobrenatural de los [Glossary('Shikome','podgloss.shikome')] pudo avivar su lujuria. Así que, en su lugar, capturó a una, le obligó a mostrarle la salida y luego la hizo pedazos y se las dio de comer a otro pobre diablo antes de escapar.\nY con su ira y sutileza, sus Ancestros lo pusieron en el [Glossary('Wu','podgloss.wu')] del Candado de Plata. Ahora, al menos, tiene vías para su ira, organizando asesinatos y secuestros para enemigos de la Corte del Emperador Amarillo y del Candado de Plata, sintiéndose feliz por primera vez en su vida al ser, al menos, valorado y respetado.\n\nDestino futuro\nA diferencia de sus contemporáneos, Fengji prosperó gracias a la plétora de objetivos que proporcionó la invasión de los [Glossary('Anda','podgloss.anda')], y sus servicios como maestro de espías en el mundo posterior a la Corte del Emperador Amarillo.\nY con el tiempo, su trascendental comprensión de los asesinatos le haría ascender a las [Glossary('Cien Nubes','podgloss.hundredclouds')] a través del Camino de los Talones."
 POD_persistentpodlore.desc.793407: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSe dice que la guerra es un crisol para la innovación. Así lo han visto incontables veces los $pod_kueijin$, donde pasan siglos sin que ocurra nada y años en los que ocurren siglos de cambios. Con ese fin, en este tiempo de guerra, han reclutado a un antiguo ingeniero para ayudar a guiar sus inversiones.\n\nChujun fue, desde joven, un alma bastante brillante, aunque ingenua. Al encontrar con fervor cosas como las matemáticas y la ingeniería fascinantes, anhelaba y atesoraba la inversión.\nSin embargo, murió joven, uno de tantos que perecieron en las fases iniciales de las Conquistas Mongolas. Pero su tiempo en el [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] fue breve, tras una fuga masiva de prisioneros.\n\nConfundido y desorientado, fue hallado rápidamente con los demás, pero reclutado aún más rápido por la Cerradura de Plata en busca de alguien que les ayudara a decidir en qué proyectos invertir. Con ese fin, es un sabio joven y dedicado, esperanzado por lo que depara el futuro.\n\nDestino futuro\nChujun no sería $pod_kueijin$ por mucho tiempo. En su primera incursión, su falta de comprensión de las finanzas le hizo invertir en un inútil herrero de pólvora, lo que costó mucho a la Cerradura de Plata. Chujun fue castigado en consecuencia: lo obligaron a comer tanta pólvora como pudiera y luego le prendieron fuego."
 POD_persistentpodlore.desc.793408: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEn la aldea de la que era Yingmei, había susurros aterrorizados sobre la Prostituta de Cristal Roto, una asesina en serie que era una artista usando cristales rotos para hacer que el dolor de sus víctimas fuera lo más prolongado posible. Finalmente, la guardia de la ciudad encontró un único hilo conductor: todas las víctimas habían rechazado las atenciones de una sirvienta menor. Cuando investigaron más a fondo, encontraron en su casa innumerables instrumentos de cirugía y paneles de vidrio.\nYingmei fue recompensada como merecía, yendo a la muerte riendo.\n\nPero el Infierno de ser Desollado Vivo le enseñó a Yingmei una dura lección. Siendo desollada durante lo que parecieron siglos, incluso una asesina en serie endurecida podía ser obligada a arrepentirse. Y cuando, por pura casualidad, sus vínculos se rompieron justo cuando se había rendido por completo, logró escapar.\nY encontró el camino de vuelta al mundo de los vivos.\n\nYingmei sabe que merecía el Infierno. Era un monstruo. Era una engendro que buscaba atención y que mataría con tal de no ser ignorada. Ahora, como fundadora y líder del [Glossary('Wu','podgloss.wu')] de Hielo Eterno, se ha convertido en una reconocida médica, buscando la Iluminación a través de la Sanación.\nY en épocas como estas, los sanadores escasean cada vez más."
 POD_persistentpodlore.desc.793409: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEn tiempos de tribulación, el mundo no ha sido ajeno a los bandidos. Aunque muchos se ven obligados a ello por desesperación, pocos son más viles que aquellos que lo hacen por puro placer. La euforia de saquear al débil. El placer de quitarle al débil y ser fuerte. Y Yu'er afirma rotundamente que ella fue una de las peores.\n\nNacida durante el Periodo de los Reinos Combatientes, Yu'er vivió en una gran época para ser bandido. De niña detestaba la debilidad y era una matona de pies a cabeza. Cuando un practicante local de artes marciales tradicionales la acogió para intentar templarla, Yu'er jugó al largo plazo y, en su lugar, lo utilizó como un medio para volverse fuerte.\nUna vez que pudo vencer a sus compañeros de clase, los asesinó a todos por la noche, le cortó los talones a su maestro y lo dejó desangrarse hasta la muerte. Luego tomó el camino del bandidaje y lo disfrutó inmensamente. Al menos hasta que fue capturada y ejecutada por los Qin. Y ahí es donde comenzó su nueva historia, al aprender exactamente lo que había hecho cuando ahora era la víctima en Lanka.\n\nEl recuerdo de Yu'er sobre aquella época es borroso, pero sabía que pasó siglos en Lanka y terminó odiando la vida mortal que la arrojó allí. Ahora, ha convertido su habilidad marcial en una búsqueda de la Iluminación atacando a bandidos en esta época de caos, y luchando en el Inframundo para intentar liberarlo de la crueldad de su dictador.\nSabe que solo puede expiar mediante la acción, así que lucha ahora. Su Camino hacia la redención es largo, pero está segura de que lo recorrerá lo mejor que pueda."
 POD_persistentpodlore.desc.793410: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAunque considerar que las acciones del conquistador Piyau son una locura no es un sentimiento poco común entre la Corte del Emperador Amarillo, en su mayor parte, los discípulos de Piyau prestan poca atención a la Corte central, más conservadora. Sin embargo, una crítica hiere más profundo. Lo suficiente como para escocer.\n\nHuitong, en su vida mortal, habría tenido todas las razones para seguir su camino. Nacida en la indigencia, obligada al trabajo sexual desde muy joven y tratada de forma horrible, con todos los motivos debería ver el camino de Piyau como un medio de liberación.\nY, sin embargo, Huitong también tiene claro que tal amargura la convirtió en una cáscara vacía y llena de odio. Envenenaba indiscriminadamente, odiaba a cualquiera a quien pudiera pisotear y, a veces, deseaba simplemente revertir la situación y crear un nuevo tipo de infierno.\n\nY en el Pozo de Sal y Hierro vio la verdad. Hombres obligados a ser monstruos. Haciendo que los hombres nieguen su humanidad, convirtiendo el amor en una debilidad y la ternura en una farsa. Los dolores pueden ser distintos, pero decir que los [Glossary('Penangallan','podgloss.penangallan')] no tienen más que beneficios es erróneo y falso.\n\nAsí que, en su lugar, lo defiende ante todos. La voz del Hielo Eterno y la crítica más mordaz; sus tratados están empezando a dar que hablar, especialmente entre la Parentela de las Cortes de la Bestia y los hombres que desean ser suaves y gentiles. Y a medida que la influencia del Hielo Eterno crece, incluso la escarcha podría llegar a devorar a las flores apasionadas."
 POD_persistentpodlore.desc.793411: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEs bastante común entre los $pod_kueijin$ que hayan hecho cosas horribles o estén implicados en actos de gran maldad, ya sea como víctimas o perpetradores. Todos fueron al Infierno, por supuesto. Pero al oír lo que Fumihito hizo, muchos apenas podían soportar su presencia. Y solo en el Hielo Eterno encontró a aquellos que confiaban en que él deseaba sinceramente la redención.\n\nEn su vida mortal, Fumihito era un hombre despreciable. Enojado, hostil y violento; todo el pueblo sabía lo vil que era por los sonidos que salían de su casa desde su esposa. Si algo no era perfecto, él respondía con el mismo bastón ensangrentado.\nY cuando tuvo una hija, Fumihito se puso tan furioso por no tener un hijo que ahogó a la niña y encerró a su esposa en un sótano, donde ella pereció. Su muerte fue igualmente miserable, al menos, pues murió solo en el invierno, ya que el resto de su aldea se negó a darle refugio por miedo a lo que pudiera hacerles.\n\nY fue recompensado por su vida con [Glossary('Kakuri','podgloss.kakuri')]. Y fue allí donde encontró a su esposa de nuevo, ahora como una consorte [Glossary('Shikome','podgloss.shikome')] del Señor de [Glossary('Kakuri','podgloss.kakuri')], sonriendo mientras sostenía ese mismo bastón ensangrentado.\n\nFumihito no sabe cuánto tiempo pasó en [Glossary('Kakuri','podgloss.kakuri')], pero cuando la Corte del Emperador Amarillo [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] lo encontró, era un despojo humano, con cada onza de crueldad erradicada a golpes.\nAl ser interrogado, fue llevado al Hielo Eterno, a pesar de las protestas de un [Glossary('Penangallan','podgloss.penangallan')] de visita, que exigía su muerte. Pero el Hielo Eterno no cedió, exigiendo que la causa por la que luchaban no exigía menos.\n\nDesde entonces, Fumihito se ha dedicado a comulgar con los muertos, haciendo todo lo posible por resolver sus remordimientos y penas persistentes en aras de la expiación. Y cada día sigue siendo atormentado. Y en estos tiempos difíciles, sabe que será puesto a prueba como merece."
 POD_persistentpodlore.desc.793412: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEn tiempos de caos, no es raro que se produzca uno de los peores negocios: la venta del hombre común a otros, utilizando el caos de la guerra para secuestrar a los más vulnerables, arrebatarlos de sus hogares, encerrarlos en hierro y venderlos a lugares desconocidos para ser usados en quién sabe qué.\nY los hombres hicieron que la recolección de esta «mercancía» los hiciera extremadamente ricos. Y Benli era uno de esos hombres.\n\nBenli desarrolló su carrera mortal como un recolector de esclavos patrocinado por el Estado, liderando rutinariamente incursiones en tierras extranjeras y recolectando «salvajes» para ser llevados como prisioneros y cautivos, ya sea para trabajo esclavo o para otros Estilos de vida dudosos en los que se pudiera empujar a los esclavos.\nSin embargo, Benli se dio cuenta de que capturar adultos podía ser un problema, así que se especializó en secuestrar niños y se volvió experto en ello. Algunos clientes los querían para cosas que él nunca se molestaba en cuestionar y, con el tiempo, empezó a aceptar trabajos de secuestro de los hijos de sus rivales, marcándolos y desfigurándolos para que nunca pudieran ser rastreados, y vendiéndolos.\n\nAsí era la vida de Benli, hasta que una madre furiosa lo encontró al reconocer una marca de nacimiento en una niña con el rostro totalmente quemado mientras pasaba junto a un burdel; era su propia hija. Y Benli fue castigado adecuadamente por sus crímenes dentro del Infierno de los Pecadores Invertidos, oscilando entre la locura y la desesperación. Su propio ser se invirtió, pasando de ser un monstruo frío, codicioso y vanidoso a un demonio cálido, generoso y desbordante de humildad.\nPero recuerda lo que hizo. No puede olvidarlo. Ahora es un patrocinador secreto de esclavos que buscan liberarse, creando aliados entre ellos para su [Glossary('Wu','podgloss.wu')] de modo que tenga ojos y oídos en todas partes.\nLa mayoría de ellos no sabe que la persona suave y gentil que es ahora habría explotado de forma absoluta a sus víctimas en su vida mortal. Pero él lo habría hecho así. Se agrada mucho más a sí mismo ahora de lo que jamás se agradó siendo un canalla."
 POD_persistentpodlore.desc.793413: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\n «Yo soy la Reina, la recolectora de tesoros, la más reflexiva, la primera de aquellos que merecen adoración. Así, los Dioses me han establecido en muchos lugares con muchos hogares donde entrar y habitar.\nSolo a través de mí todos comen el alimento que los nutre; cada hombre que ve, respira, escucha la palabra en voz alta. No lo saben, pero yo resido en la esencia del Universo. Escuchad, todos, la verdad tal como la declaro».\n\nTal es lo que Shodashi enseña y que los Descendidos negarían, que la progenie de Zapathasura atormentaría y que los elevados herejes del Norte negarían.\nLa luz radiante y evidente de la diosa que ellos negarían.\n\nShodashi es vieja para ser una Muerta Hambrienta, contemporánea de Shiva-Ohm. Pero mientras Shiva-Ohm afirmaría ser el hijo del mentiroso Sita, Shodashi no niega que fue mortal. Nació en Bengala, de un hombre y una mujer mortales, y vivió su vida como una nadie mundana, apenas piadosa, centrándose demasiado en el mundo mortal. Y por ello fue iluminada por el Infierno.\nY por su sabiduría, la esencia divina de Mahavidya la inspiró. Una pizca de divinidad. Una oportunidad de ser más. Una oportunidad de ser más grande. Una oportunidad de ser como los Dioses, rectificada por la imperfecta comprensión de la moralidad.\n\nComo tal, tomó el nombre de Tripura Sundari, aquello que la completó. Y desde su regreso al mundo de los vivos, ha predicado para unir a la Diosa y completar a la humanidad. El Infierno está roto. Y por sus manos será reparado.\nPero las mentiras deben terminar, los pecadores deben ser llevados a la sabiduría y los demonios que plagan el centro del mundo deben ser erradicados. Rechaza la dualidad y la limitación, elévate por encima de todo y sé como un dios para poner el mundo en orden. Tal es su causa. Tal será su voluntad."
 POD_persistentpodlore.desc.793414: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nDesde el momento en que emergieron por primera vez de los Infiernos, la familia Chen captó la atención y el oído de los ancestros locales. Era raro que la gente escapara del Infierno en grupos. Más raro aún era cuando personas de una misma familia escapaban del Infierno en general. Pero, ¿una familia que escapó del Infierno unida? Eso es algo totalmente distinto.\n\nLa mayor de los hermanos, Chen Ming, era exteriormente fría, pero albergaba en su interior una inmensa audacia y una resolución inquebrantable. Bajo la tutela de Sun Li, los [Glossary('Infant Devil Civilizers','podgloss.infantdevilcivilizer')] inicialmente esperaban que Ming se convirtiera en una general como su mentora, pero Ming era una alumna conflictiva.\nAprovechando cada oportunidad para desafiar sus enseñanzas, terminaban discutiendo. Sin embargo, Ming seguía siendo alumna de una de las mentes militares más brillantes, y su audacia al liderar su [Glossary('Wu','podgloss.wu')] no como una Grulla sino como un Ciempiés fue un pequeño escándalo; pero la habilidad de Ming para defender las regiones del suroeste de la Corte del Emperador Amarillo de las incursiones Ravnos le valió un gran respeto.\n\nEn este momento, es plenamente la cabeza de los Soberanos de la Virtud, aunque en gran medida por la fuerza de su voluntad. Y en estos tiempos difíciles, esos lazos familiares serán puestos a prueba.\n\nDestino futuro\nMing acabaría, tras la guerra contra los [Glossary('Anda','podgloss.anda')], dejándose llevar por la insensatez. Al ver el éxito contra los [Glossary('Anda','podgloss.anda')], intentó liderar una iniciativa similar contra los Kshatriya.\nY aun siendo alumna de uno de los mejores maestros de la guerra, no era como su maestra, y fue quebrantada ante el poder de Chandraputra."
 POD_persistentpodlore.desc.793415: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nDesde el momento en que emergieron por primera vez de los Infiernos, la familia Chen captó la atención y el oído de los ancestros locales. Era raro que la gente escapara del Infierno en grupos. Más raro aún era cuando personas de una misma familia escapaban del Infierno en general. Pero, ¿una familia que escapó del Infierno unida? Eso es algo totalmente distinto.\n\nEl segundo hijo de la familia, Jiang, es un alma agradable pero reflexiva. Habiendo querido ser médico en su vida mortal, su segundo aliento ha revelado en él un increíble don para las Artes del Alma. Sumando su habilidad con las monedas, se convirtió en el pilar de los Soberanos de la Virtud, financiando sus Misiones y objetivos desde su refugio compartido.\nA pesar de no ser el mayor, a menudo se le asume como el más franco. Dado que es el núcleo emocional de la familia, los guía y consuela a sus hermanos donde tienen Contienda, recordándoles su huida compartida del Infierno para impulsarlos más allá.\nY con ese fin, permanece aquí para apoyar a su familia.\n\nDestino futuro\nDada la amenaza potencial que los Soberanos de la Virtud suponían para las rutas de invasión de los [Glossary('Anda','podgloss.anda')], eran un objetivo especial. Mientras supervisaba a nuevos estudiantes, una fuerza de asesinos [Glossary('Anda','podgloss.anda')] conocida como los Vientos Negros le tendió una emboscada y puso fin a su historia allí mismo."
 POD_persistentpodlore.desc.793416: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nDesde el momento en que emergieron por primera vez de los Infiernos, la familia Chen captó la atención y el oído de los ancestros locales. Era raro que la gente escapara del Infierno en grupos. Más raro aún era cuando personas de una misma familia escapaban del Infierno en general. Pero, ¿una familia que escapó del Infierno unida? Eso es algo totalmente distinto.\n\nUn hijo mediano, Hui parecía notablemente contento con ello. Un erudito con amor por las ciencias y las estrellas, también poseía una mente ágil para la química y la ingeniería. Al ser civilizado, parecía sumergirse en misterios similares del universo, estudioso hasta un grado casi sobrenatural.\nIncluso para sus hermanos, rara vez sale de su habitación en su refugio, dejando que sus hermanos den sentido a sus estudios y planes. Pero cuando pueden, muestran una brillantez y sagacidad subyacentes que los ha salvado muchas veces.\nSin embargo, mientras el mundo se agita a su alrededor, Hui pronto podría verse obligado a actuar en un mundo que lo obligará a enfrentarlo.\n\nDestino futuro\nCon la muerte de Jiang, Hui se quedó increíblemente perdido en el mundo. Buscó al [Glossary('Wu','podgloss.wu')] más cercano del que había leído informes en las obras de sus hermanos y se dirigió a los Biers Esmeralda.\nSin embargo, esta proximidad acabaría condenándolo, ya que cuando se descubrió una horrible verdad sobre ellos, moriría como tantos otros en su corte, como otra cena más para el Devorador de Demonios."
 POD_persistentpodlore.desc.793417: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nDesde el momento en que emergieron por primera vez de los Infiernos, la familia Chen captó la atención y el oído de los ancestros locales. Era raro que la gente escapara del Infierno en grupos. Más raro aún era cuando personas de una misma familia escapaban del Infierno en general. Pero, ¿una familia que escapó del Infierno unida? Eso es algo totalmente distinto.\n\nZhihao, entre sus hermanos, siempre ha sido el mayor problema. Siendo el segundo más joven, respondió a la restauración de su cordura por parte de su [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] rompiéndoles la nariz, golpeando a su maestro en la garganta y luego intentando arrancarle los ojos al Dhampyr que le atendía.\nUn temperamento salvaje incluso para un Tigre Diablo, Zhihao pasa de una cosa a otra con toda la Gracia de un incendio forestal, toda la contención de una explosión y toda la humildad de un emperador con algo que demostrar. Su audacia, al menos, lo hace eficaz, pero incluso su ferocidad puede ser peligrosa.\nA falta de otra cosa, sus hermanos pueden señalarlo hacia los [Glossary('Anda','podgloss.anda')] por ahora, pero una vez que esa amenaza se agote, existe una preocupación real sobre si podrán controlar a su hermano.\n\nDestino futuro\nZhihao moriría poco después que Jiang. Con el núcleo de su familia desaparecido, Zhihao cargó tras sus asesinos como una Bestia poseída, hacia lo más profundo del territorio [Glossary('Anda','podgloss.anda')], donde encontró su predecible final."
 POD_persistentpodlore.desc.793418: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nDesde el momento en que emergieron por primera vez de los Infiernos, la familia Chen captó la atención y el oído de los ancestros locales. Era raro que la gente escapara del Infierno en grupos. Más raro aún es que personas de una misma familia escapen del Infierno sin más. Pero ¿una familia que escapó del Infierno unida? Eso es algo totalmente distinto.\n\nYong, la más joven de los hermanos, fue considerada por el [Glossary('Civilizador del Diablo Infantil','podgloss.infantdevilcivilizer')] una apuesta segura para los Dragones Azotadores por su belleza, pero para su sorpresa, Yong no quería saber nada de los placeres de la carne ni del amor.\nEstudiante quintaesencial del Florecimiento de los Ocho Lotos, es ante todo una sabia, la consejera espiritual y la brújula de su familia.\n\nEs la única con la que todos pueden estar de acuerdo, la que logra convertir el torbellino de emociones que son en un todo cohesionado. Y especialmente ahora, mientras le confían sus preocupaciones y penas a medida que los [Glossary('Anda','podgloss.anda')] se acercan y China arde, es puesta a prueba más que nunca. Pero lo sobrelleva lo mejor que puede.\n\nDestino futuro\nYong sobreviviría a todos sus hermanos, pero solo para algo mucho más trágico. Yong defendería brevemente al Quincunx, pero luego se retiraría a sus meditaciones.\nPero en las noches modernas vio presagios de una gran amenaza, un ejército de demonios en marcha. Así que fue a confrontar al demonio tuerto que vio liderándolo. Simplemente les ordenó que se retiraran. El Demonio, veterano de la guerra contra los [Glossary('Anda','podgloss.anda')] y General de la Legión del Cielo y el Infierno, no lo toleraría, y la ahora Gran Ancestral del Florecimiento de los Ocho Lotos trató de abatir al General por su insolencia.\n\nEl cadáver de Yong se convertiría en el primer paso del ascenso al poder de Ma Hai-Lan."
 POD_persistentpodlore.desc.793419: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEl discípulo más joven de Dyanang ha sido un maravilloso rayo de esperanza para muchos en la actual época de declive de la Corte del Fénix Escarlata. A pesar de ser un hombre en la Corte matriarcal, Sokkate ha Abrazado al [Glossary('Dharma','podgloss.dharma')] del Arcoíris Sonriente con los brazos abiertos y lo ha hecho suyo en tiempo récord.\nSu comportamiento compasivo, curioso y despreocupado lo convierte en un modelo de las enseñanzas de la Madre de las Mil Grullas, la fundadora de esta filosofía. Esto lo convirtió en una elección fácil para que Dyanang se encargara de los dominios occidentales del Fénix Escarlata, ya que era nativo de Birmania.\n\nSu mandato como Ancestro ha sido menos perfecto que su educación Dhármica, ya que su naturaleza relajada ha permitido que Ancestros regionales más ambiciosos escapen de su control. Aun así, para aquellos más interesados en explorar la pasión de los Dragones Azotadores que en la política, no hay mejor lugar que la corte de Sokkate.\n\nDestino futuro\nAl no ofrecer una resistencia real a la conquista de Piyau, Sokkate se enfrentará a la misma elección que ella le dio a cada Ancestro masculino. Él elegirá la abdicación en lugar de traicionar su [Glossary('Dharma','podgloss.dharma')].\nRespetando su reputación (y su rendición incondicional en lugar de una resistencia sangrienta), Piyau le permitirá a él y a su corte marcharse ilesos. Sokkate no volverá a ser visto tras cruzar por última vez la puerta de su palacio, aunque sus seguidores jurarán que ascendió a las [Glossary('Hundred Clouds','podgloss.hundredclouds')] en ese preciso instante."
 POD_persistentpodlore.desc.793420: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nCuando oyó que se convertiría en la discípula de la estrella ascendente de la Corte Escarlata, Sokkate, Linlun se llenó de alegría. Vio una gran oportunidad para elevar rápidamente su propio estatus, quizás convirtiéndose ella misma en Ancestro mucho antes de tiempo. Pronto fue despreciada por tales nociones. Si bien Sokkate es ciertamente un maestro diligente y amable, es un chiste cuando se trata de política.\nLinlun vio la Corte birmana fragmentarse ante sus propios ojos, mientras cada una de sus sugerencias para tomar medidas decisivas era ignorada por su indolente maestro.\n\nFúrica al ver cómo se desperdiciaban sus oportunidades de poder, Linlun se ha convertido en la única y verdadera voz de disidencia en la corte de Sokkate. No es que eso signifique mucho, ya que dicha corte está compuesta básicamente por celosos estudiantes Dhármicos que se burlan de sus preocupaciones «más mundanas».\n\nDestino futuro\nLinlun no derramará ni una lágrima cuando su maestro sea destituido por Piyau Piyung. De hecho, abrazará con entusiasmo la ideología de las Flores de Sangre de la Pasión, lo que llevará a Piyau a nombrarla Reina Dorada de Birmania.\nSin embargo, Linlun sobreestimó sus propias capacidades políticas y nunca podrá subyugar completamente las cortes regionales. Aunque trasladar su sede de poder a Mandalay en el futuro será un movimiento astuto, se verá sorprendida por la llegada de los británicos y perderá su capital político restante para ese entonces."
 POD_persistentpodlore.desc.793421: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nCuando Sokkate lo eligió por primera vez como estudiante, Wanna no podía dar crédito a lo que oía. Como un joven $pod_kueijin$ tímido y modesto que aún se recuperaba de su tiempo en los Infiernos, pensó que los vibrantes y exuberantes [Glossary('Dharma','podgloss.dharma')] Dragones Azotadores nunca encajarían con él.\nTenía razón en su mayoría... pero no tanto como temía. A decir verdad, todavía no entiende por qué Sokkate lo eligió, ya que sigue siendo obvio que este [Glossary('Dharma','podgloss.dharma')] no se le da de forma natural en absoluto. Sin embargo, está progresando y agradece haber sido rescatado de los peores dolores de su temprana experiencia Dhármica.\n\nFuera de su propia Iluminación, Wanna se ha convertido en el administrador no oficial de la corte de su maestro, ya que el propio Sokcate no tiene interés en la política. Aunque Wanna está feliz de tener algo que hacer, le preocupa ver que sus esfuerzos básicamente no dan frutos a medida que las Cortes regionales se vuelven cada vez más indisciplinadas. Para su continua sorpresa, sin embargo, a Sokcate no parece importarle en absoluto que Wanna esté básicamente arruinando su dominio a pesar de sus mejores esfuerzos.\n\nDestino futuro\nTras la abdicación de Sokkate, Wanna considerará quedarse con su compañera discípula (y ahora reina), Linlun. Al considerar que ella se ha vuelto demasiado extrema para su gusto, se centrará en su [Glossary('Dharma','podgloss.dharma')] durante los siglos siguientes.\nAunque nunca alcanzará las [Glossary('Cien Nubes','podgloss.hundredclouds')], llegará incluso a unirse al estimado séquito de la Madre de las Mil Grullas y aprender directamente de ella, algo que Wanna espera que haya hecho sentir orgulloso a Sokkate."
 POD_persistentpodlore.desc.793422: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nNarasingha no era nadie en su vida mortal, incluso él estaría de acuerdo con ello. Ni siquiera está seguro de por qué acabó en los [UmbraGlossaryLocalized('yomi_wan','Infiernos de Yomi')] cuando solo cometió pequeños hurtos y nunca mató a nadie. Sea cual sea el caso, su insignificancia era su fuerza. Los Guardianes de Yomi ni siquiera lo registraron realmente y, mientras no hiciera ninguna estupidez, estaban encantados de dejarlo en paz y centrarse en prisioneros más prestigiosos.\nEl escape de Narasingha fue, por tanto, bastante anodino, nada parecido a los relatos heroicos de otros $pod_kueijin$. Sin embargo, sus primeras noches de vuelta fueron todo lo contrario.\n\nEncontrado por los servidores de la «Diosa» Shodashi, a Narasingha se le enseñó de repente que él mismo era un dios... y no creyó ni una palabra. Sin embargo, fue demasiado astuto para dejarlo notar y representó el papel de alumno entusiasta. No está seguro de si Shodashi creyó su actuación, pero su disposición a escuchar y obedecer al menos le valió una calificación aprobatoria.\nAhora Narasingha ha aprendido lo suficiente sobre los caminos de su [Glossary('Dharma','podgloss.dharma')] como para gobernar su corte llena de sicofantes y servidores ansiosos por complacer todos sus caprichos.\n\nY así, mientras que su Iluminación Dhármica es básicamente postergada, la vida de Narasingha nunca ha sido mejor. Es bueno ser un dios."
 POD_persistentpodlore.desc.791542: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nSegún su propio recuerdo, Eindra estaba contenta con su vida mortal. Un marido cariñoso, muchos hijos sanos y una pequeña aldea remota donde vivir. Por ello, sintió un fuerte sentido de injusticia cuando acabó en el [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')], pensando que no merecía esa sentencia en absoluto.\nEindra no estaba preparada para la experiencia, pero encontró algo en su interior que no esperaba: terquedad. Se repetía a sí misma (y a cualquiera que quisiera escucharla) que su sentencia no era justa y, por tanto, nunca se rebajó a sentir nada ante la tortura de sus captores. Finalmente, aburridos de esta mujer inflexible, simplemente la dejaron ir.\n\nPara sorpresa de nadie, Eindra no prosperó precisamente cuando se vio empujada a convertirse en un Dragón Azotador (como se espera que lleguen a ser la mayoría de los cortesanos del Fénix Escarlata). Un [Glossary('Dharma','podgloss.dharma')] demasiado aleatorio y voluble para sus gustos. Aunque no encontró un maestro adecuado para una alternativa, la variante de Carbones Brillantes del [Glossary('Dharma','podgloss.dharma')] al menos le permitió desahogar sus frustraciones con más facilidad.\n\nIncluso con el asunto de su [Glossary('Dharma','podgloss.dharma')] resuelto, Eindra resultó ser una presencia sombría, melancólica y que cortaba el ambiente en la exuberante y vibrante Corte Escarlata. Como estaba políticamente aislada, era de esperar que acabara básicamente exiliada a la frontera más occidental de la Corte Escarlata.\nUn trabajo más que ingrato, ya que tiene que ser la guardiana contra todas las herejías indias.\n\nSorprendentemente, Eindra pronto aprendió a amar ese exilio político. Su naturaleza inquebrantable brilla en un papel donde se supone que debe reprender básicamente cualquier intento de cruzar la frontera Escarlata.\n\nDestino futuro\nEindra apenas notará la conquista de Piyau. Dado que su trabajo no ha cambiado, ¿por qué le importaría?\nPor su parte, las Reinas Doradas estarán más que felices de dejar que su sombría guardiana siga encargándose de la frontera."
 POD_persistentpodlore.desc.791534: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEn su vida mortal, Raya era una sacerdotisa de Po Inu Naga, la mítica fundadora del pueblo Cham. Solo conserva recuerdos gratos de aquella época, un marcado contraste con su muerte, de la cual no tiene recuerdo alguno. Dado que terminó en Yomi, teme haber hecho algo tan terrible que su mente optó por olvidarlo durante las décadas perdidas en el Infierno.\n\nSea cual sea la verdad, Raya encontró una fuerza serena y una fe constante en su diosa para ayudarla a soportar Yomi. Menospreciada por sus captores, aprovechó la primera oportunidad que encontró para escapar.\n\nRaya se adaptó con facilidad a la sociedad $pod_kueijin$, convirtiéndose en alumna de la propia Dyanang y siendo fundamental en algunos de los éxitos de la Corte Escarlata, como su cálida diplomacia con las Cortes de la Bestia. Estos logros y su constante ascenso en el [Glossary('Dharma','podgloss.dharma')] la convirtieron en la heredera obvia de Dyanang a medida que se acercaba a las [Glossary('Cien Nubes','podgloss.hundredclouds')].\n\nEsto cambió en tiempos recientes. Raya parece haber caído en una melancolía creciente; algunos susurran que se debe a su fuerte apego a su diosa y al darse cuenta de que es la última que realmente la recuerda. La propia Dyanang ha intentado animar a su alumna, aparentemente sin éxito, obligando a la Emperatriz de la Corte Escarlata a retrasar su propia Iluminación por temor a dejar la Corte en manos de una Raya poco preparada.\n\nLa doncella del santuario solo se ha reanimado recientemente al pedir permiso para partir hacia Champa y convertirse en un Ancestro regional aquí, una petición que ha sido concedida con la esperanza de reavivar su llama.\n\nDestino futuro\nRaya no opondrá resistencia a la conquista de Piyau a pesar de los deseos de muchos en la corte. Tras abandonar Angkor, Dyanang irá a buscarla y se marcharán juntas.\nAlgunos dicen que hacia las [Glossary('Cien Nubes','podgloss.hundredclouds')], otros dicen que para saludar al sol una última vez."
 POD_persistentpodlore.desc.793423: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEl éxito de las Caras de la Diosa [Glossary('Dharma','podgloss.dharma')] ha sido un choque sorprendente para muchos ancestros. A pesar de su separación de la Tribu Celestial y su posición rodeada de enemigos, sorprendería a muchos ver que la filosofía de Shodashi no se consumió ni colapsó en llamas.\nPero cuando miran más profundamente, descubren que el fuego que ardía en una de sus discípulas era mucho más ardente, mucho más salvaje. Uno que, si se desatara, podría convertirse en un incendio forestal capaz de consumir tanto al Diablo como a la Diosa.\n\nElla recuerda su vida mortal en una brumosa confusión de ira y frustración. Su tiempo en el Infierno de Sal y Hierro fue el de un juguete que luchaba contra su dueño para su diversión; un destino humillante y desalentador, pero que avivó el fuego en ella cada vez más.\nFinalmente, este se descontroló y Bhairavi no pudo soportarlo más. Rompiéndose las extremidades para escapar de sus cadenas, apretando la mandíbula hasta pulverizarla para evitar sus propios gritos, despojándose de su propia piel para negarles un agarre, huyó en un torbellino de desesperación y determinación. No permitiría que la quebraran.\nNo pudo serlo. Y mientras huía, visiones y brumas de una mujer de una belleza extrema recorrieron su mente atormentada.\n\nY cuando se encontró de nuevo en el mundo de los vivos, fue Shodashi quien la encontró primero. Y la tomó como su primera discípula, pues claramente Bhairavi le había otorgado la chispa de la divinidad.\nPara el demonio de cabello rojo, esto tenía sentido. Funcionaba. Y con ese fin, ella sería su furia. Su ira. Ella sería la Diosa Feroz de las Caras de la Diosa."
 POD_persistentpodlore.desc.793424: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nA pesar de haber sido un hombre que antaño dominó al Emperador de China, Li Jue se convirtió en una mera nota a pie de página histórica, eclipsado por hombres mucho más grandiosos. Un señor de la guerra amargado, ambicioso y cruel, no se sorprendió demasiado cuando su ignominiosa muerte lo envió al [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')].\nComo una «celebridad» menor, Li Jue se encontró formando parte de los «Favoritos» y aparentemente feliz de obedecer las órdenes del [Glossary('Rey Yama','podgloss.yamaking')] [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. En realidad, Li Jue seguía recibiendo las órdenes con el mismo mal humor que en vida y, por tanto, utilizó su (relativa) posición de prestigio para escapar.\n\nEnviado a la Corte de la Tortuga Negra para aprender las debidas costumbres $pod_kueijin$, Li Jue apenas escuchó, viendo todo esto como otra forma de la política que le costó su poder hace tanto tiempo. En cierto modo, este aislamiento político fue su salvación.\n\nA medida que la influencia del [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] se extendía en la Corte de la Tortuga Negra, Li Jue fue capaz de ver las señales y abandonó la corte tras ser objeto de un intento de asesinato, ya que el [Glossary('Rey Yama','podgloss.yamaking')] aún guardaba rencor contra su general rebelde. Dirigiéndose a la zona más remota bajo la jurisdicción (sobre el papel) de la Corte, Li Jue se contentó con ignorar la tormenta que se avecinaba y vivir por su cuenta. Las cosas cambiaron cuando llegó Sagezhi.\n\nLa joven fugitiva que se pintó a sí misma una imagen de Li Jue como una gran figura heroica capaz de salvar la Corte despertó algo en el cansado señor de la guerra. No fue compasión ni deber per se —Li Jue había olvidado esas nociones hace mucho tiempo—, sino al menos la sensación de que podría quedar una última guerra en él por la que valiera la pena luchar.\nSi eso lograba que Sagezhi dejara de importunarlo y le daba al [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] más razones para estar enfadado con él... pues por qué no.\nA medida que más y más refugiados de la Tortuga Negra se reúnen a su alrededor, Li Jue se pregunta si, esta vez, logrará figurar en primera plana de los libros de historia.\n\nDestino futuro\nAunque será Sagezhi quien represente a la Corte de la Tortuga Negra en la firma del tratado de Quincunx, será Li Jue quien aseste los golpes más determinantes a las fuerzas y dominios del [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] a través de las estepas, precipitando la caída del [Glossary('Rey Yama','podgloss.yamaking')] en el siglo XIV.\nCuando Sagezhi regrese para dar la buena noticia, Li Jue no estará por ninguna parte. Mientras que la mayoría creería que un servidor errante del [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] finalmente encontró su objetivo, Sagezhi se aferrará a la esperanza de que el viejo y gruñón señor de la guerra encontrara su propio y retorcido camino hacia las [Glossary('Cien Nubes','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793425: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nA medida que la influencia del [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] sobre la Corte de la Tortuga Negra crecía, también lo hacía su audacia. Ya no satisfecho con esperar a que las almas de los muertos llegaran a su señorío, empezó a enviar asesinos para acelerar el fin de individuos especialmente interesantes. Tal fue el caso de Sagezhi.\n\nSiendo una hábil rastreadora para su tribu, fue asesinada mientras dormía simplemente porque el [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] pensó que uno de sus clanes del Infierno necesitaba un poco de favoritismo con tal incorporación. Lo que el [Glossary('Rey Yama','podgloss.yamaking')] no tuvo en cuenta es que puede ser difícil rastrear al rastreador, incluso en tu propio señorío. Así que Sagezhi esperó, evitando por poco ser detectada hasta que encontró una salida y se lanzó a ella.\n\nEl regreso a la Tierra no fue realmente una salvación para Sagezhi. Al venir directamente del [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')], pudo ver fácilmente las señales de que la mayoría de la Corte ya estaba bajo su esclavitud. Fue entonces cuando oyó hablar de Li Jue, aparentemente un famoso disidente que abandonó la Corte hace mucho tiempo.\nY aunque él no tenía deseos de ser encontrado, Sagezhi seguía siendo una rastreadora excelente.\n\nSus primeros encuentros con el señor de la guerra fueron... decepcionantes. Un hombre viejo, enfadado y amargado que amenazaba con castigar su «insolencia» distaba mucho de lo que ella había oído. Sin embargo, Sagezhi es testaruda y, a decir verdad, no tenía otra opción, ya que la idea de rendirse y dejar que el [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] hiciera lo que quisiera nunca pasó por su mente. Así que perseveró hasta que, principalmente por puro fastidio, Li Jue aceptó reanimarse.\n\nSagezhi es ahora su segunda al mando aunque, a decir verdad, se encarga de todo lo que no esté relacionado con asuntos militares directos. Su naturaleza sociable la ha convertido en una favorita entre los refugiados de la Tortuga Negra y es el nexo entre ellos y su reacio mentor.\n\nDestino futuro\nMientras que Li Jue será la mente militar, Sagezhi será la única razón por la que su improbable coalición se mantuvo durante tanto tiempo. Fue, por tanto, la elección obvia para representarlos durante la formación de Quincunx y, tras la desaparición de él, suceder al señor de la guerra.\nSigue siendo una influyente Ancestro de la estepa hasta la noche de hoy, aunque su sonrisa se ha apagado un poco.\nDebe admitir que, en cierto modo, echa de menos al viejo cabrón."
 POD_persistentpodlore.desc.793426: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEl ritual favorito del Kan de Dokhor son las «Cadenas con Púas», donde las víctimas son atadas fuertemente con cadenas de hierro de Yomi y colgadas de las estalactitas en una gran cueva ventosa durante años. Luchar por escapar solo empeora la agonía, y [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] disfruta colocando pequeñas limas y ganzúas justo fuera de su alcance. Aunque nunca lo admitiría, esta técnica de tortura le costó en realidad un prisionero a [Glossary('Dokhor-Khan','podgloss.dokhorkhan')].\nYangdai, un joven aparentemente con una flexibilidad sobrenatural, logró resistir las Cadenas con Púas durante menos de dos días antes de alcanzar una ganzúa y escapar. Enfurecido, [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] hizo que matar al fugitivo fuera la prioridad para su [akuma|E] durante varios años.\n\nCon la Corte de la Tortuga Negra fuertemente bajo el control del [Glossary('Rey Yama','podgloss.yamaking')], Yangdai encontró muy poco refugio y posibilidades para la Iluminación Dhármica. Aunque había considerado ir hacia el sur, no sabía qué podría esperarle allí, ya que quizás incluso los chinos estaban aliados con su atormentador. Así que se dirigió al norte, alejándose lo máximo posible de la civilización.\n\nFue la falta de tutela Dhármica lo que obligó a Yangdai a buscar la compañía de otros $pod_kueijin$ una vez más. Afortunadamente para él, en ese momento, los Jinetes de la Hoja de Plata de Li Jue y Sagezhi estaban empezando a tomar forma y estaban encantados de dar la bienvenida a otra víctima de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')].\nAun siendo reservado y silencioso, Yangdai ha estado ansioso por asumir las misiones más sigilosas que el grupo necesita. De hecho, es uno de los pocos que informa directamente a Li Jue en lugar de a Sagezhi; este último bromea diciendo que una conversación entre ambos suele terminar siendo, la mayoría de las veces, de menos de diez palabras.\n\nDestino futuro\nYangdai sobrevivirá para ver la caída de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], dejando una ganzúa rota en uno de los nidos de dragón purificados. Aunque desaparecerá en gran medida después, seguirá visitando a Sagezhi con poca frecuencia, llegando incluso a decir más de diez palabras en ocasiones."
 POD_persistentpodlore.desc.793427: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nBaohuoli no tuvo nada que ver con [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] y ahora podría ser su enemigo más obstinado.\nNacido y muerto en una tribu de cazadores-recolectores siberianos, Baohuoli no era un hombre amable y pagó el precio al entrar en el [UmbraGlossaryLocalized('yomi_wan','Infierno de Yomi')] de [Glossary('Tou Mu','podgloss.toumu')] al morir. Afortunadamente para él, el alcance de [Glossary('Tou Mu','podgloss.toumu')] tan cerca del patio de recreo de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] era muy débil y así pudo escapar antes de ser capturado formalmente.\nSu regreso como $pod_kueijin$ fue tan anodino como la pequeña Corte siberiana, aislacionista, donde terminó.\nHasta que [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] envió a su primer [akuma|E] «Bendecido» para una prueba de campo contra este objetivo débil. La matanza resultante solo dejó con vida a Baohuoli.\n\nCon una mente más fría y calculadora antes de este evento, Baohuoli sintió que una Furia ardiente se apoderaba de él y lo transformaba firmemente de una Flor de Hueso en un Tigre Diablo [Glossary('Dharma','podgloss.dharma')]. Luego visitó la mayoría de las principales Cortes de la Tortuga Negra y solo encontró desdén, desprecio o incluso violencia cuando defendía ataques audaces contra [Glossary('Dokhor-Khan','podgloss.dokhorkhan')].\n\nFue durante una batalla contra un [akuma|E] «Bendecido» cuando Baohuoli fue encontrado por los Jinetes de la Hoja de Plata (y, aunque no lo admitirá, salvado en el proceso). Aunque Sagezhi se mostraba reacia al ver su ira como algo autodestructivo, Li Jue aceptó a Baohuoli en sus filas.\nSe convirtió en una vanguardia temida, siendo siempre el primero en lanzarse al combate. Sagezhi sostiene que su comportamiento autodestructivo y su constante insistencia en acciones cada vez más agresivas es, en realidad, más un obstáculo para el grupo que una bendición. Sin embargo, este es uno de los pocos casos en los que Li Jue no la escucha, aparentemente contenta de tener a un tigre en Frenesí al que señalar hacia objetivos difíciles que otros no se atreverían a abordar.\n\nDestino futuro\nBaohuoli sobreviviría, para sorpresa de muchos, a la caída de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. Sin embargo, se opondrá firmemente a unirse al Quincuncio, ya que sentirá que las Cortes del Sur hicieron poco para ayudar.\nTras un enfrentamiento especialmente fuerte con Sagezhi, Baohuoli desaparecerá. La nueva líder indiscutible de los Jinetes de la Hoja de Plata iniciará una investigación sin éxito, aunque un oscuro brillo en los ojos de Yangdai la hará dudar..."
 POD_persistentpodlore.desc.793428: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nMinggan nunca pensó que cabalgaría junto a una banda de curtidos jinetes veteranos. Como la hija erudita de un funcionario menor de la dinastía Jin, su mayor preocupación era el día de su matrimonio. Algo que nunca llegó, ya que murió durante las revueltas contra los Jin en 1127.\nMinggan no estaba nada preparada para los Infiernos de las Cadenas con Púas y se quebró fácilmente. Solo el acto de compasión de otros fugitivos que la llevaron con ellos la salvó.\n\nSu introducción en la sociedad $pod_kueijin$ fue una revelación para Minggan y leyó todo lo que pudo conseguir de los Grandes Sabios. Fue entonces cuando descubrió que la Corte donde residía básicamente ignoraba la mayoría de estos preceptos y, cuando uno de sus maestros puso en sus manos un libro que sabía que estaba prohibido, lo comprendió.\n\nMinggan tomó la iniciativa quizás por primera vez en su vida cuando oyó la intención de la Corte de reprimir a la cercana «resistencia herética». Montando el primer caballo que encontró, se adelantó y advirtió a los Jinetes de la Hoja de Plata del ataque inminente.\nEsta advertencia ayudó a los Jinetes de la Hoja a montar una emboscada y le aseguró un lugar en el grupo.\n\nMinggan está floreciendo rápidamente en su nuevo entorno. Aunque la falta de decoro y el desdén por la política de la corte la entristecen, les está enseñando muchos datos históricamente relevantes y, de hecho, está sirviendo de mentora para la Iluminación Dhármica de muchos, ya que es una de las pocas con un amplio conocimiento al respecto.\nNunca interactuó con Li Jue, pero Sagezhi está demostrando convertirse en una amiga cercana y en algo así como una mentora para los conocimientos más prácticos de los que Minggan carece.\n\nDestino futuro\nMinggan cronificará la caída de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] y se convertirá en una de las maestras más respetadas de las Cortes de la Estepa. Su influencia sobre muchos de la Nueva Generación será fundamental para mantener a Sagezhi como la fuerza líder en la era post-Tortuga Negra para la región."
 POD_persistentpodlore.desc.793429: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nMaoying nunca sintió que realmente perteneciera a algún lugar. Aunque esto templó su determinación y la ayudó a escapar de los [UmbraGlossaryLocalized('yomi_wan','Infiernos de Yomi')], significó que su Iluminación Dhármica nunca llegó a echar raíces. A pesar de que muchos maestros intentaron instruir a esta mujer, obviamente dotada y dedicada, nunca se sintió atraída por ningún [Glossary('Dharma','podgloss.dharma')] específico. Incluso estudió algunos poco ortodoxos (aunque puso el límite en los de tipo Infernalista) sin éxito. Entonces llegó Shan Bo.\nA un diligente, aunque estricto, mentor Tigre Diablo, logró que un [Glossary('Dharma','podgloss.dharma')] pareciera realmente atractivo para Maoying. Así, ella se dedicó a convertirse en la mejor estudiante posible. Gracias a su naturaleza más práctica en comparación con el muy introspectivo Shan Bo, pronto se convirtió más bien en una asistente, asegurándose de que su maestro pudiera proveer para sus muchos alumnos y no cayera en trampas políticas. La vida era buena, hasta que Shan Bo cambió.\n\nNo sabía qué ocurrió realmente, pero cuando su mentor empezó a criticar al propio [Glossary('Augusto Personaje de Jade','podgloss.augustpersonageofjade')] y a hablar de desafiarlo, se horrorizó. Sin embargo, ningún debate o súplica pudo persuadirlo y pronto se encontró ante una elección. Temiendo perder el único lugar que realmente sentía como su hogar, silenció sus preocupaciones y se «unió» a la herejía de su maestro.\nMaoying dirige ahora involuntariamente el creciente culto de Shan Bo, mientras espera encontrar una salida que pueda salvar su propia alma.\n\nDestino futuro\nMaoying ni siquiera intentará detener a Shan Bo cuando este parta en su Viaje para desafiar al Augusto Personaje de Jade. Cuando él, como era de esperar, no regrese, ella disolverá rápidamente el culto y volverá a su propio camino.\nSe convertirá en una especie de leyenda urbana para los Ancestros modernos, una $pod_kueijin$ errante que nunca encontró un [Glossary('Dharma','podgloss.dharma')] ni una Corte a la que pertenecer. Su llegada a algún lugar será vista como un presagio de problemas venideros."
 POD_persistentpodlore.desc.793430: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nXingcheng fue miembro de un culto menor durante su vida. Sin ser un creyente de verdad, utilizó este poder relativo para salir adelante por cualquier medio necesario hasta que un creyente auténtico lo descubrió y se encargó de él sin demora. Al encontrarse en la [Glossary('Wicked City','podgloss.wickedcity')], Xingcheng se adaptó bien, estafando a los carroñeros para mejorar su propia posición. Sin embargo, la [Glossary('Wicked City','podgloss.wickedcity')] es mucho más resistente de lo que un simple estafador puede llegar a ser astuto, y Xingcheng comprendió rápidamente que nunca alcanzaría el poder y las riquezas allí si no se le permitía.\n\nDe vuelta al mundo mortal, Xingcheng se convirtió en un $pod_kueijin$ bastante insignificante, probablemente destinado a un Puesto en la corte menor. Si era lo suficientemente hábil como para engañar a algunos aldeanos y refugiados de la [Glossary('Wicked City','podgloss.wickedcity')], Xingcheng no era más que un niño comparado con los arraigados Ancestros y, por tanto, cada uno de sus intentos terminaba solo en su humillación y castigo.\nShan Bo entró en la Corte en ese momento, seguido por todo un grupo de sus estudiantes listos para defender los méritos de sus enseñanzas, aparentemente locas. Xingcheng reconoció a un culto en cuanto lo vio y se alistó en el acto.\n\nAl principio, para él fue como cualquier otro negocio y rápidamente obtuvo algunas riquezas y respeto de los estudiantes más ingenuos de Shan Bo. Pero entonces algo cambió. Empezó a escuchar verdaderamente al maestro y la Iluminación dawned sobre él. Toda su vida le ha llevado hasta este punto y Xingcheng no puede esperar a escalar el Monte Meru para cuestionar al [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] con su mentor.\n¡Qué espectáculo será! ¡Él, el humilde estafador, diciendo finalmente las verdades en la cara a la entidad más poderosa de los Cielos!\n\nDestino futuro\nEn el camino al Monte Meru, Xingcheng será ejecutado cuando sea enviado a convertir a la Ancestral Fu Hao y su Corte."
 POD_persistentpodlore.desc.793431: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nTooril tiene pocos recuerdos de su vida mortal. Teniendo en cuenta lo que ocurrió después, cree que podría ser lo mejor.\nAbrazado por un Gangrel que le dio una paliza demoledora a pesar de que Tooril era un hábil luchador, nunca volvió a ver a su [Glossary('Sire','game_concept_Sire_desc')], quedando abandonado para valerse por sí mismo, lo cual, según supo décadas después, era una costumbre entre los Gangrel.\nA decir verdad, le fue muy mal.\n\nAl verse abrumado por su nueva condición de vampiro, Tooril se volvió muy cercano a una Bestia sin mente, escuchando a su demonio interior mucho más de lo que debería. Se convirtió en un monstruo local, matando indiscriminadamente a tribus o asentamientos de paso y, dado que la región era tan remota, no había otras criaturas de la noche que lo detuvieran. Tooril teme que podría haber aniquilado a toda la población de su «reino» si no fuera por la llegada de los [Glossary('Anda','podgloss.anda')].\n\nAunque el bestial Gangrel era ciertamente un guerrero fuerte, no era rival para la vanguardia disciplinada y más controlada. Aunque su historia podría haber terminado aquí, un respetado ex chamán y ahora mentor de Via Yasaq, Kuchuguden, detuvo a los jinetes antes de que pudieran matar a Tooril.\nPasaron meses (y muchas luchas por el dominio) antes de que se lograra un progreso, pero ocurrió. Tooril, instruido en el camino de los [Glossary('Anda','podgloss.anda')], recuperó lentamente el control de sí mismo y logró mantener a raya a su Bestia. Aunque estaba ciertamente muy agradecido por la ayuda, todavía quedaba una cosa por considerar: el precio.\n\nTooril fue enviado de vuelta a su Gobi natal con el mandato de buscar debilidades en esta retaguardia de la Corte del Emperador Amarillo.\nEl Gangrel no es tonto. Aunque dirán que es un puesto de honor y uno obvio debido a su conocimiento de la región, Tooril comprende que nunca pertenecerá realmente a la Horda al no ser un [Glossary('Anda','podgloss.anda')] y, por tanto, es prescindible.\nAl final, sin embargo, eso no le importa. Descubrir Via Yasaq le salvó la vida y tiene la intención de devolver este regalo con honor, Lealtad y celo por la Horda.\nIncluso si siempre será un forastero en quien no se confía."
 POD_persistentpodlore.desc.793432: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAunque los [Glossary('Anda','podgloss.anda')] están acostumbrados a que los chamanes sean extraños a veces, siguen pensando que Kuchuguden es directamente raro. Por su parte, el mentor responde que solo sigue los cambios de humor de Tengri: una lluvia suave y purificadora por la mañana puede dar paso a una tormenta destructiva por la noche.\nLo que sí está acordado es que es uno de los mentores más respetados de Via Yasaq y actúa como un maestro errante para los nómadas [Glossary('Anda','podgloss.anda')]. Aunque siempre será bienvenido, solo los verdaderamente iluminados (y pacientes) buscan deliberadamente su consejo. Con frecuencia son los neonatos indisciplinados los que acaban en sus manos con la esperanza de que sus inusuales técnicas de enseñanza den algún resultado cuando otras no lo han hecho.\n\nKuchuguden no tiene un hermano de sangre ni un arban (las fuerzas de combate de los [Glossary('Anda','podgloss.anda')]) propio, y algunos de sus detractores han interpretado esto como que, aunque está claramente dedicado a Yasaq, Kuchuguden podría no estar tan dedicado a la Horda de los [Glossary('Anda','podgloss.anda')] en su conjunto.\nNo están muy lejos de la verdad.\n\nKuchuguden detesta el camino militarista que Dobrul y sus sucesores han marcado para los [Glossary('Anda','podgloss.anda')]. Aunque no es un pacifista, no ve beneficios en antagonizar a sus vecinos. No es como si pudieran erradicar de forma realista a todos los Demonios de Xia o a los $pod_cainites$. Por tanto, en el mejor de los casos, los [Glossary('Anda','podgloss.anda')] se verán envueltos en conflictos muy largos o, en el peor, exterminados por sus muchos enemigos.\nSu falta de influencia política hace que su punto de vista sea irrelevante en el gran esquema de las cosas y él lo sabe. Por ello, sus esfuerzos por instruir a neonatos obstinados (o incluso a no [Glossary('Anda','podgloss.anda')]) se ven impulsados por el objetivo de tener muchos antiguos alumnos que, con suerte, le escuchen cuando llegue el momento oportuno.\nKuchuguden no quiere traicionar a su pueblo, así que no está seguro de «cuándo» será el momento oportuno, pero confía en que Tengri le enviará una señal. Solo espera poder verla a tiempo."
 POD_persistentpodlore.desc.793433: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSaryk era un miembro de la baja aristocracia tribal tradicional de los Naiman cuando fueron aplastados por el entonces llamado Temujin. Por tanto, también formaba parte de los Naiman que eligieron a Jemugha, el hermano de sangre de Temujin, como «gobernante universal» para oponerse a él. Jemugha tuvo dificultades para construir una coalición duradera para oponerse a su antiguo hermano y muchos de los aristócratas que reclutó terminaron decepcionando. Saryk fue algo mejor, al tener al menos un conocimiento sólido de la guerra de estepa. Lamentablemente, eso no significó mucho cuando ocurrió la Batalla de los Trece Lados.\nCon Jemugha aplastado y aparentemente muerto, Saryk huyó para salvar su vida hacia los Naiman del Kanato de Kara-Khitan. A pesar del ascenso al poder de su tribu en esta región, Saryk no logró mucho más hasta que fue emboscado una noche. Al principio, temiendo que su asaltante fuera un hombre de Temujin, se sorprendió aún más al ver a Jemugha, aparentemente todavía muy vivo en la Tierra. Sin embargo, antes de que pudiera reaccionar, Saryk murió y renació como vampiro.\n\nJemugha se tomó su tiempo para instruir a su primer Chiquillo en lo poco que sabía sobre los vampiros y la causa de los [Glossary('Anda','podgloss.anda')], pero resultó ser demasiado para Saryk en muy poco tiempo. Siguiendo pensando como un mortal, los Naiman veían en Temujin la verdadera amenaza y no comprendieron cuando vio que Jemugha no le guardaba rencor. Todas sus sugerencias para obstaculizar el ascenso de Genghis Khan fueron despreciadas o recibidas con desdén por los [Glossary('Anda','podgloss.anda')], y Saryk se volvió cada vez más amargado y aislado.\n\nHoy en día, el Gran Kan finalmente ha muerto, pero se ha convertido en una leyenda tanto para los mongoles como para los [Glossary('Anda','podgloss.anda')]. Como Saryk aún no se guarda sus pensamientos al respecto, fue enviado finalmente a Gobi para «vigilar» al Gangrel Tooril. Aunque claramente es solo un exilio que no menciona su nombre, Saryk al menos se siente satisfecho de no estar ya en medio de gente adorando a su némesis unilateral.\nA medida que su ánimo mejora, podría considerar incluso hacer un esfuerzo y ayudar a planificar el ataque a la retaguardia de la Corte del Emperador Amarillo."
 POD_persistentpodlore.desc.793434: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nIbakha era una niña jovial y enérgica en una tribu que recorría el Gobi. Aunque siempre lo consideró su hogar, su madre le contaba historias sobre su propia madre, quien aparentemente procedía de una tribu totalmente distinta, una que había sido aniquilada por un monstruo terrible. Ibakha escuchaba con atención pero, al fin y al cabo, no le prestaba importancia, como hacen la mayoría de los niños. No fue hasta que se convirtió en una mujer joven cuando empezó a preguntarse más sobre esa historia.\n\nIbakha tenía la inquietante sensación de ser observada por una presencia invisible. Aunque no ocurría todo el tiempo, sucedía lo suficiente como para inquietarla. Hablar con otros miembros de la tribu solo le reportaba respuestas bruscas; la mayoría no quería atraer potencialmente la ira del monstruo.\n\nEntonces, un día, su tribu perdió una escaramuza contra otra y fue capturada junto a muchos de los no combatientes. No tuvo tiempo de ser maltratada por sus captores antes de que un torbellino de colmillos y garras los destrozara a todos y la liberara.\nSu salvador fue un hombre de aspecto tosco que no respondió a la mayoría de sus preguntas.\n\nHa pasado el tiempo desde entonces e Ibakha ha aprendido (con dificultad) algunas cosas sobre Tooril. Él solo sale por la noche, es ferozmente protector con ella por alguna razón desconocida (aunque ella está empezando a descifrar el enigma) y su sangre tiene propiedades mágicas. Cuando ella enfermó, la curó más rápido que cualquier brebaje de chamán.\n\nSin embargo, los tiempos están cambiando y Tooril ya no puede mantener a Ibakha completamente fuera de su alcance. Él le ha explicado que otros como él se dirigen al Gobi y que tiene que prepararse para una guerra.\nIbakha sabe que, si presionara un poco más, es probable que él respondiera a sus preguntas sobre quién es, qué es y qué está sucediendo.\n\nEl problema es que no está segura de si le gustarían sus respuestas."
 POD_persistentpodlore.desc.793435: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nVietnam es, comparada con gran parte del resto del mundo nocturno, una zona de guerra. El colapso de la Corte del Fénix Escarlata ha abierto las puertas tanto a interesados señores de la guerra de los Muertos Hambrientos del sur, de Indonesia y Malasia, como a aduladores del norte de las Cortes chinas, para vigilar con codicia una región que no les pertenece. Un insulto que Phùng Thị Chính no tolerará.\n\nChính nació hace mucho tiempo, en una época en la que Vietnam era explotada por el gobernador local. Surgieron muchos guerreros, hombres y mujeres, bajo las hermanas Trưng para expulsar a los supervisores imperiales. Chính fue una de tantos alineados con su causa, que alcanzó la fama como una guerrera especialmente dotada que no podía ser detenida, llegando incluso a dar a luz en un campo de batalla activo y a luchar con su recién nacido en brazos.\nSin embargo, por justa que fuera su causa, el mando militar de Ma Yuan vio destruida su rebelión. Y Chính, a pesar de su valentía y su fuerza de voluntad, se convirtió en una de las muchas víctimas entre los capturados.\n\nChính, no obstante, no permitiría que la historia de su pueblo terminara allí. Más bien, la muerte le enseñó el peligro del atrevimiento. En Lanka se convirtió en un fantasma. En su escape fue un espectro.\nY al regresar a través del mundo de los vivos, fue brevemente discípula de alguien que podría entenderla, y luego regresó a Vietnam. Fue entonces cuando numerosos ancestros instalados por Dyanang sufrieron muertes ignominiosas, los oficiales de Wang Hongben tuvieron finales sangrientos y las hijas del escándalo de Piyau encontraron sus últimos bailes.\nFinalmente, mientras la Corte del Fénix Escarlata se desmorona, Chính sale de detrás de la cortina, afirmándose como una Ancestral que no defiende a Dyanang ni a Wang Hongben, sino a su pueblo y a la nación por la que luchó una vez.\n\nDestino futuro\nA pesar de este comienzo más audaz, Chính jugaría la política con cautela y desconfiaría de todo lo que la rodea. Cuando se reveló que Piyau era totalmente imparable en sus conquistas, negoció ayudar en las cacerías de [akuma|E] a cambio de una autonomía local sin precedentes.\nY en las noches modernas, su propia visión de las Cortes Doradas de Vietnam florecerá donde otras no resistieron el paso del tiempo."
 POD_persistentpodlore.desc.793436: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nOng estaba acostumbrada a vivir entre dos mundos. Hija de un comerciante chino y de la hija de un mercader coreano, desde su infancia estaba acostumbrada a destacar.\nPero sí encontró una vocación. Se sentía como en casa en el mar. El vaivén de los barcos, la veta de una barandilla, el viento en su cara, el olor a sal... todo aquello la hacía sentir en casa. Incluso se casó con su marido solo para asegurarse de que no perdería su hogar. E incluso llegando a la madurez avanzada para la época, al menos podía considerarse algo feliz.\n\nAl menos antes de que se lo arrebataran.\n\nOng tuvo la desgracia de ser el objetivo de un Abrazo de los Lasombra. Una sucesión de infortunios que llevó a la caravana mercantil de su marido a encontrarse con piratas, su hogar saqueado por bandidos y todo lo que había construido destruido por el fuego; intentó todo lo posible por aferrarse a su sueño agonizante. Y cuando su último barco se hundía, ella eligió hundirse con él.\nY fue entonces cuando Hafiz se le acercó y le ofreció restaurarlo todo, si decidía convertirse en vampiro. Ong, que simplemente quería navegar por el mar de nuevo, aceptó. Y entonces descubrió que Hafiz era el arquitecto de todo su dolor, y que ahora quería que adorara a un dios extranjero.\nTramará su libertad, su regreso al mar. Su orgullo no exige menos.\n\nDestino futuro\nOng y Hafiz discutían con frecuencia y casi constantemente. Ella se negó a unirse a la Ashirra y escapó con su propia flota mercantil para reconstruirlo todo, llegando incluso a alinearse con la Camarilla cuando llegó al este de Asia para fastidiar a su Sire.\nA pesar del dominio de los $pod_kueijin$ en la ciudad, se proclamaría «Príncipe» de Singapur como un desaire a su Sire, organizando a la tripulación que formó en un pequeño dominio dentro de Singapur para negar el acceso a los puertos a la Ashirra."
 POD_persistentpodlore.desc.793437: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nYoudao es el último de una larga estirpe de Ancestros enviados desde la Corte del Emperador Amarillo para asegurarse de que la región fronteriza de Vietnam no caiga en manos de la Corte del Fénix Escarlata. A diferencia de sus predecesores, tiene bastante éxito en esta labor.\n\nSu secreto es sencillo: no es un individuo con mentalidad política. Contento con predicar el más tradicional [Glossary('Dharma','podgloss.dharma')] de cinco niveles a los Viets, no ha hecho ningún movimiento para extender su alcance a pesar de que la Corte Viet alineada con el Fénix Escarlata colapsara por sí sola. Su única política respecto a este evento ha sido dar la bienvenida a los refugiados de los [akuma|E] que avanzan por el sur. Las facciones más belicosas de la Corte del Emperador Amarillo no están contentas con esto y presionan para que Youdao sea más agresivo o se enfrente a su llamada de regreso a Changan. Youdao, por su parte, tiene la corazonada de que este postureo no servirá de mucho por mucho tiempo.\n\nDestino futuro\nCuando la Corte del Emperador Amarillo colapse, Youdao verá lo que se avecina. Simplemente haciendo las maletas y marchándose a la todavía estable Corte de Hueso, renunciará a cualquier ambición política y dedicará su tiempo al estudio de su [Glossary('Dharma','podgloss.dharma')].\nEsto lo convertirá en una figura sorprendentemente apreciada y respetada por los $pod_kueijin$ de Viet, quienes lo visitarán a menudo por asuntos académicos. A pesar de que muchos Ancestros le presionan para que se convierta en diplomático entre las Cortes china y Viet, Youdao siempre se negará."
 POD_persistentpodlore.desc.793438: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nLuong Trac nació durante los últimos años de la dinastía Ly y fue una de las víctimas de la conquista china de Vietnam. Arrojada a Lanka, Luong Trac renació en las llamas de este Señorío belicoso. Cultivando su talento latente para el derramamiento de sangre, llegó a ser respetada entre los Raksha como una prisionera digna y un potencial [akuma|E] para su señor Ravana. Sin embargo, al parecer no estaba destinado a serlo, ya que Luong luchó por salir de Yomi tras varias décadas de agotadoras guerras.\n\nAl emerger como una $pod_kueijin$, Luong se enfureció al ver Vietnam bajo el yugo de un lacayo de la Corte del Emperador Amarillo. Evitando su Iluminación Dhármica, lideró a una fuerza de $pod_kueijin$ con ideas afines para conquistar su Señorío natal con el apoyo de la Corte del Fénix Escarlata. Tras varias décadas de conflicto, Luong tuvo un éxito casi total, iniciando su reinado como la Ancestral Escarlata de Vietnam.\nLlegó el momento de centrarse en su Iluminación Dhármica, una tarea que resultó ser un desafío mucho mayor. Al negarse a aceptar maestros, pues se consideraba a sí misma una Ancestral por encima de eso, intentó emular la agresiva filosofía de las Flores de Sangre de la Pasión que empezaba a arrasar el sudeste asiático.\nSin embargo, fue en vano; Luong confundió la violencia desenfrenada y la destrucción con la liberación. El estigma de ser una Ancestral con un [Glossary('Dharma','podgloss.dharma')] muy bajo tuvo repercusiones en su corte, ya que muchos la abandonaron una vez terminado el conflicto por Vietnam.\nAl detectar debilidad, la Corte del Emperador Amarillo recuperó la mayor parte de sus tierras perdidas y otros Ancestrales regionales declararon su independencia. Con su colapso Dhármico bien conocido, Luong ha perdido su capital político y no es capaz de reunir las fuerzas que antes podía.\n\nMientras todo se desmorona a su alrededor, Luong finalmente encontró una salida. Si la guerra era lo único en lo que era buena, quizá sea el momento de traer al mundo este Señorío de guerra eterna donde tanto prosperó...\n\nDestino futuro\nLa promesa de Luong a Ravana será una seria amenaza para la región durante un tiempo. La efímera alianza entre Phùng Thị Chính y Quyen Vien la derribará, y las fuerzas de Piyau perseguirán a sus seguidores restantes.\nLos recuerdos de su sangriento reinado serán un factor para que la política de los $pod_kueijin$ de Vietnam sea más moderada que la del resto de las Cortes Doradas."
 POD_persistentpodlore.desc.793439: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAl vivir durante la tumultuosa era de la Anarquía de los 12 Señores de la Guerra, a Quyen Vien le contaron muchas historias sobre figuras legendarias como la dama Trieu y las hermanas Trưng, con la esperanza de que ella se convirtiera en la figura de esta era. Esto no iba a suceder, ya que su posible superior militar estaba más interesada en su atractivo femenino que en su espíritu ardiente. Arrojada a Lanka, Quyen descubrió que, en efecto, tenía talento para el combate, pero seguía anhelando encontrar una causa digna tras ello. Así que huyó tan pronto como tuvo la oportunidad.\n\nCuando conoció a Luong Trac, Quyen quedó asombrada. Esta mujer, con un origen similar al suyo, había logrado tanto que parecía haber liberado a Vietnam de los $pod_kueijin$ chinos. Suplicando su caso con terquedad, logró convertirse en su alumna.\n\nLa verdad pronto resultó ser menos perfecta de lo que Quyen esperaba. Luong era una maestra muy deficiente, ya que ella misma carecía de Iluminación Dhármica. Al no tener responsabilidades reales en la corte, Quyen simplemente decidió marcharse y buscar sus propias respuestas.\nFue entonces cuando conoció a Phùng Thị Chính, una auténtica heroína de sus historias de la infancia. Sin embargo, su [Glossary('Dharma','podgloss.dharma')] le pareció ajeno a Quyen y así se separaron rápidamente, aunque de forma amistosa. No fue hasta el ascenso de las Flores de Sangre de la Pasión cuando Quyen encontró verdaderamente su camino. Tras lograr sus primeros avances, regresó emocionada con su primera mentora, Luong, para compartir la buena noticia. Lo que encontró la horrorizó.\n\nQuyen fue así la primera en acusar a Luong de ser un [akuma|E] y en unir a otros cortesanos preocupados a su causa. Con la ayuda de Phùng Thị Chính, Quyen está lista para llevar la lucha contra su caída mentora y convertirse en la protagonista de su propia leyenda.\n\nDestino futuro\nAunque Quyen y Phùng Thị Chính alcanzarán la victoria, su relación se amargará, ya que Quyen se alineará estrechamente con las Cortes Doradas de Piyau.\nNo estallará ninguna guerra entre ambas, pero Vietnam permanecerá dividida entre sus dos cortes rivales durante un tiempo.\nLa llegada de los franceses en el siglo XIX desestabilizará seriamente la base de poder de Quyen en el sur de Vietnam, hasta el punto de su destrucción a manos del Príncipe $pod_cainite$ de Manila."
 POD_persistentpodlore.desc.793440: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEl hijo de la hija de un comerciante chino y un pescador filipino, Isagani pasó su juventud creciendo durante el auge del comercio de la dinastía Song en Filipinas. Y entonces, una noche mientras navegaba, al ver un reflejo en el agua, fue asesinado rápidamente por uno de los Cainitas de Filipinas y arrojado al Infierno de los Mares Hirvientes.\nY fue entonces cuando su abuelo se manifestó: un barco de $pod_kueijin$ que naufragó en el infierno y encontró a Isagani, hijo de un Dhampyr, cultivado desde su nacimiento para liderar.\n\nIsagani estaba profundamente confundido y desorientado por su rápida muerte, su descenso al infierno y su posterior rescate en lo que pareció un instante. Pero fue elegido por una razón. Preciso, leal, sociable, astuto y apuesto gracias al desarrollo enfocado de sus padres; se podría decir que su único defecto sería su constante miedo a las profundidades y a las amenazas que le rodeaban.\nAsí, su maestro lo entrenó para liderar la recién establecida Corte del Coral Violeta, lo puso al mando como su alumno más destacado y luego se dedicó a sus estudios dhármicos.\n\nIsagani camina por la cuerda floja. Por un lado, las crecientes exigencias de la Corte del Emperador Amarillo hacia su corte y la amenaza latente de Piyau respirándole en la nuca han hecho poco por calmar su paranoia.\nY complicando aún más las cosas está una parte de ellos que ha caído ante la hermosa, peligrosa y salvaje Bestia que lo mató, compartiendo ahora batallas feroces o encuentros apasionados con el progenitor del linaje que es su enemigo.\n\n¿Tenía razón su mentor al prepararlo para esto? ¿O fracasará porque, a pesar de todas sus ventajas, carecía de la voluntad para prosperar?\n\nDestino futuro\nIsagani lograría aguantar, pero no prosperar. El colapso de la Corte del Emperador Amarillo le otorga algo de tiempo, y las astutas distracciones de los Anh hacia las Cortes Doradas de Piyau le conceden un respiro, pero el atrincheramiento de los Anh es casi imposible de erradicar.\nPero cuando un nuevo linaje los amenace a ambos, Isagani y Ngai podrían finalmente tener la causa política para enterrar el hacha de guerra y enfrentar la creciente amenaza de los Hari en una tierra que ambos consideran su hogar."
 POD_persistentpodlore.desc.793441: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAunque las Cortes Augustas tienen espacio de sobra y necesitan Dhampyr, a veces alguien puede ser demasiado temerario al crearlos, haciendo que el velo entre el Mundo de la Noche y el del Día se desvanezca, y la atención no deseada puede ser peligrosa.\nAsí pues, con ese fin, el Gran Maestro Yuan recibió «la oportunidad de una era» tan pronto como el contacto comercial con Filipinas llegó a oídos de los altos cargos de la Corte del Emperador Amarillo.\n\nYuan es un hombre inconsistente y de corazón indómito. Oscilando entre el hedonismo icónico de los Dragones Azotadores con una ferocidad que podría hacer sonrojar a un [Glossary('Penangallan','podgloss.penangallan')] o una crueldad indulgente que haría retroceder a un endurecido Ancestral Tigre Diablo, Yuan era más conocido por el auténtico ejército de Dhampyr que producía; tantos, de hecho, que un número no despreciable regresó como $pod_kueijin$. Esto fue lo que provocó su traslado a Filipinas.\nYuan está perfectamente conforme con ello, ya que ha reflexionado sobre cómo se ha cansado de las mujeres chinas; y tan pronto como varios de sus hijos murieron y regresaron como $pod_kueijin$, los elevó y se retiró para centrarse en sus «búsquedas dhármicas», que en realidad consistían en una flota de doncellas vinculadas por el alma para atender todos sus «caprichos».\nY, mientras el Mundo de la Noche en el continente arde por el asalto de los [Glossary('Anda','podgloss.anda')], Yuan disfruta despreocupadamente de los placeres de la carne a un océano de distancia, sin importarle el horroroso lío político en el que metió a sus hijos.\n\nDestino futuro\nYuan, fiel a su [Glossary('Dharma','podgloss.dharma')] en forma, función y mente, para sorpresa de los ancestros supervivientes que se enteraron, ascendería más tarde a las [Glossary('Hundred Clouds','podgloss.hundredclouds')] antes de la llegada de los españoles a Filipinas, para gran dolor de cabeza y júbilo de sus hijos sobrevivientes.\nSin embargo, era tan despreciado por sus hijos que su nombre quedaría prácticamente olvidado para el año 1600, y su impacto solo permanecería en su progenie, que tuvo que limpiar su desastre."
 POD_persistentpodlore.desc.793442: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nSi bien hay susurros en las cortes continentales sobre artes de la carne, entre la miríada de poderes y facciones del sudeste asiático, el dominio de Piyau y su [Glossary('Penangallan','podgloss.penangallan')] es demasiado real, y algo así como una medida temida: sus artes más grandes son solo suyas.\nAl menos, lo eran. Hasta que la Manananggal logró tomarlas. Y deben su propia desviación en el Shintai de Carne a su Primer Divisor.\n\nKalinaw, como muchos de los ancestros superiores de la Corte del Coral Violeta, era una Dhampyr descendiente del Gran Maestro Yuan. Una de tantos posicionados para comenzar a expandir su corte por Filipinas, Kalinaw fue una de las pocas con la mala suerte de morir de noche en una tormenta, siendo exiliada al [Glossary('Kakuri','podgloss.kakuri')].\nAl menos, por suerte para Kalinaw, los «gustos» de [Glossary('Emma-O','podgloss.emmao')] por las víctimas no se aplicaban a ella, así que bajo el amparo de una tormenta, se escabulló de vuelta al mundo de los vivos. Y, como sus compañeros discípulos de Yuan, fue elevada rápidamente a figura de autoridad entre la Corte del Coral Violeta, específicamente como enviada a la decadente Corte del Fénix Escarlata.\nY fue allí donde conoció por primera vez a los discípulos de Piyau.\n\nAunque ellos, en su mayor parte, predicaban su diatriba matriarcal, Kalinaw prestaba poca atención. Lo que realmente le interesaba era su Shintai de Carne.\nSe hizo la desentendida con ellos, fingiendo estar totalmente de acuerdo, citando sus «frustraciones» y «maltratos» como antigua Dhampyr. Uno de ellos se lo creyó y, una vez que ella lo internalizó, huyó inmediatamente de vuelta a su hogar, donde compartió las artes con su Corte.\n\nDestino futuro\nLa maniobra de Kalinaw no favorecería mucho a la Corte Violeta, pero la propia ascensión de Piyau al menos les dio un respiro, ya que la formación del Quincunx era un problema mucho mayor.\nKalinaw se convertiría en una de las principales expertas en Shintai de Carne fuera de las Cortes Doradas y, más tarde, se convertiría en una pieza crítica para contrarrestar las monstruosidades de carne creadas por los Cainitas Magos de Sangre que un día más tarde se establecerían y dominarían Filipinas."
 POD_persistentpodlore.desc.793443: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nMakisig no es muy dado a la teoría. Es un hombre de praxis. De acción. No quiere quedarse sentado balbuceando tonterías sobre la acción justa mientras no hace nada. Y por esa razón, muchos se burlan de él desde lejos. Pero para los discípulos de la Corte del Coral Violeta, pocos Ancestros son más queridos.\n\nMakisig fue uno de los numerosos descendientes Dhampyr de Yuan, pero a diferencia de la mayoría, era considerado un fracasado, ya que, a diferencia de muchos otros, aunque bendecido con un cuerpo inmensamente fuerte y una virilidad potente, era más lento en sus estudios y a menudo tenía dificultades con conceptos que su Ancestro consideraba esenciales, por lo que fue descartado como un bruto.\n\nEnviado a su muerte en una batalla condenada contra los nativos Vástagos de Filipinas, y tras ser convertido en carnaza en el mar, fue condenado al Infierno de los Mares Hirvientes. Y sin embargo, en un giro de los acontecimientos bastante irónico, su franqueza, su fuerza y los trucos y acertijos de los demonios que no lograba comprender hicieron que, simplemente rompiendo suficientes cráneos, los demonios lo dejaran ir por miedo a su fuerza.\nY, aunque Yuan todavía lo rechazaba, algo que Makisig no le perdonaría, Isagani y Kalinaw lo acogieron en su seno, algo por lo que estaría eternamente agradecido.\n\nMakisig tiene lo que cualquiera consideraría una posición poco envidiable, pero él lo sabe y lo hace con orgullo. Encargado de asegurar que los Anh nunca lleguen más allá de Visayas, mantiene la línea mediante pura y constante violencia y una determinación obstinada, inquebrantable en su vigilia.\nEs uno de los pocos Muertos Hambrientos que ha sobrevivido alguna vez a un enfrentamiento con el progenitor de los Anh, y castiga el mal con una voluntad ferviente y orgullosa. Y mientras pueda resistir, luchará para proteger su hogar de los horrores de sangre impura que lo profanan.\n\nDestino futuro\nMakisig sería fundamental para la supervivencia de la Corte del Coral Violeta, pero a un coste terrible.\nCon la llegada de los saqueadores Hari, él investigaría personalmente el asunto. Cuando descubriera el verdadero horror en el corazón del mismo, lo desafiaría directamente y, aunque esto acabaría con su vida, Makisig compraría al Mundo Nocturno de Asia Oriental siglos preciosos de paz frente a Kagaseo, ya que se convertiría en el primer ser en forzarla al $pod_torpor$, demostrando al Mundo Nocturno que incluso la Mano del Tirano de Hierro puede ser derrotada, y negándole sus presencia durante más de dos siglos."
 POD_persistentpodlore.desc.793444: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSiendo la más joven de los Dhampyr descendientes de Yuan, Adhika ya se ha esforzado por tener una vida muy plena. Sus primeros recuerdos son de su madre siendo arrastrada al mar y devorada, de las miradas lascivas que un discípulo más joven dirigía hacia ella cuando era adolescente; así, desde el momento en que pudo empuñar un arma, Adhika comenzó a desafiar estos horrores, cara a cara, sin preocuparse por los peligros, y por ninguna otra razón que no fuera, a sus ojos, hacer lo correcto.\n\nYuan, encontrando las «fantasías» de la joven Dhampyr desconcertantes, hizo que entrenara entre antiguos contactos de Shih, y Adhika no encontró ningún Camino más satisfactorio. Aunque pocos tomarían en serio a una Cazadora de Demonios Dhampyr, Adhika se volvió muy, muy buena en ello.\nLo suficiente como para que los otros Ancestros del Corte de Coral Violeta, más sensatos, quisieran saber qué demonios estaba pensando Yuan. Pero importaba poco, ya que cuando Adhika regresaba, al menos podía ser utilizada contra los Anh y otros intrusos en su Corte.\nDada una autorización especial, a pesar de ser solo una Dhampyr, Adhika goza de un alto grado de libertad en el Corte. Y en lo que a ella respecta, la usará para ser el puño que castigue el mal.\n\nDestino futuro\nAdhika seguiría matando y moriría como vivió. Una Cazadora de Demonios.\nSin embargo, a diferencia de muchos otros Cazadores de Demonios, ella transmitiría lo que sabía a sus descendientes. Tendría sus propios hijos y les heredaría su guerra, creando un linaje de Cazadores filipinos que, aunque acabarían desapareciendo del Corte de Coral Violeta, mantendrían su caza tanto contra los Vástagos como contra los Muertos Hambrientos, denominados «Aswang» por este linaje."
 POD_persistentpodlore.desc.793445: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nHa pasado mucho tiempo desde que Munsuq caminó sobre la Tierra. Extrañaba un poco esa sensación.\n\nLíder de los Favorecidos de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], Munsuq ha dejado atrás hace tiempo su pasado como asaltante huno. Su maestro era todavía un muy joven [Glossary('Rey Yama','podgloss.yamaking')] en ese momento y Munsuq cosechó las recompensas de ser uno de los primeros lo suficientemente crueles como para hacer lo que [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] le ordenaba. A medida que el [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')] se expandía, su Lealtad fue recompensada convirtiéndolo en el lugarteniente de facto, líder de la tribu de los Favorecidos y, básicamente, la autoridad más alta en el [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] fuera del propio Dokhor.\nMunsuq disfrutó enormemente de estos privilegios durante siglos, quizás incluso demasiado. Aunque hace mucho tiempo era un hombre militar relativamente astuto, los siglos dedicados simplemente a cazar y acosar a prisioneros indefensos no mantuvieron sus habilidades agudas. Esto resultó en muchos y vergonzosos fallos de seguridad y, aunque el [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')] es claramente cada vez más poderoso mucho más rápido que la mayoría, también es uno donde un número de prisioneros superior al habitual logra escapar. Esto ha ascendido hasta un punto en el que el propio [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] se ha dado cuenta.\nMientras el [Glossary('Rey Yama','podgloss.yamaking')] está ocupado terminando de afirmar su control sobre las estepas y la Corte de la Tortuga Negra, le ha encargado a Munsuq que lidere a algunos de sus mejores [akuma|E] para aplastar la oposición restante, castigar a los fugitivos de su infierno y allanar el camino para su llegada al mundo mortal.\nDespués de todo, no sería conveniente que el dominio del futuro [Glossary('Emperador Demonio','podgloss.demonemperor')] fuera algo menos que inexpugnable.\n\nY así, Munsuq ha vuelto a las estepas de su vida mortal y, aunque han cambiado mucho desde entonces, él no lo ha hecho. Más que confiado en las muchas e impresionantes «bendiciones» que [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] le otorgó a lo largo de los años, el Favorecido no puede esperar a reencontrarse con algunos antiguos reclusos.\nQuizás incluso opongan más resistencia que su habitual y miserable presa."
 POD_persistentpodlore.desc.793446: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nLa mayoría de los [akuma|E] recurren primero al Infernalismo por lujuria de poder, gloria o venganza. Salikh lo hizo porque estaba muerto de aburrimiento.\n\nHombre de voluntad firme en su vida mortal, Salikh se abrió paso fuera de los [UmbraGlossaryLocalized('yomi_wan','Infiernos Yomi')] con habilidad y valor. Como $pod_kueijin$, se convirtió en discípulo de las Grullas Resplandecientes y fue elogiado por su conducta ordenada, su gran dedicación a los estudios y su afán por actuar correctamente. Y todo esto importaba poco cuando Salikh comprendió que tendría que hacer lo mismo una y otra vez durante siglos antes de ascender verdaderamente de rango o alcanzar la Iluminación.\nComo miembro de una tribu nómada en vida, el asfixiante confinamiento de las cortes sedentarias, sumado a la impresión de que, aunque hacía todo correctamente, nada importaba realmente, finalmente le afectó.\nUna noche, sin previo aviso, cabalgó hacia las estepas, sin saber realmente qué buscaba. La influencia de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] ya era omnipresente en ese momento y Salikh comprendió rápidamente lo que pasaría si se quedaba. Lo hizo, no obstante.\n\nEmpezó poco a poco, con algunos (¡emocionantes!) Rituales prohibidos que conducían a (¡interesantes!) nuevos poderes. Luego pasó a actos más oscuros: vender su propia alma, someter a otras cortes a la influencia del [Glossary('Rey Yama','podgloss.yamaking')]... En realidad, Salikh sabe que lo que hace es malvado y que se ha condenado a ser un peón por toda la eternidad. Pero realmente no le importa, ya que la vida como [akuma|E] es emocionante y ansía esta sensación como ninguna otra.\n\nCon la inminente toma de control total de las estepas por parte de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], no puede esperar a ver qué nuevos horrores aparecerán cuando este mundo se fusione con el Infierno de las Cadenas Espinosas..."
 POD_persistentpodlore.desc.793447: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSongul nació en una tribu Shatuo y vivió una vida mayormente insignificante hasta que mató a su marido en circunstancias que hoy no recuerda. Ejecutada por el hermano de su marido tras lo sucedido, terminó en [Glossary('Kakuri','podgloss.kakuri')], el [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] de [Glossary('Emma-O','podgloss.emmao')]. Más tarde sabría que fue una de las últimas mortales de las estepas en acabar allí antes de que la influencia de [Glossary('Emma-O','podgloss.emmao')] en esta zona fuera suplantada por [Glossary('Dokhor-Khan','podgloss.dokhorkhan')].\nEn cualquier caso, Songul quedó horrorizada hasta la médula por este señorío de mujeres rotas, moldeadas para obedecer cada orden y capricho de [Glossary('Emma-O','podgloss.emmao')]. Afortunadamente para ella, al ser una mujer de las estepas, el [Glossary('Rey Yama','podgloss.yamaking')] no tenía interés en ella y, por tanto, fue ignorada.\nSu escape coincidió desafortunadamente con una expansión del señorío de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] y, en lugar de regresar al mundo mortal, terminó en su [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')].\n\nEsta vez, Songul encontró este señorío casi... normal. Es cierto que era un extremo retorcido de la dura vida en las estepas, pero seguía siendo reconocible en sus patrones. Encontró fácilmente su lugar entre los Favorecidos y utilizó esa posición para escapar.\n\nEl regreso como $pod_kueijin$ fue otra experiencia impactante para Songul. Había toda una sociedad de seres sobrenaturales bajo la superficie que básicamente no hacía nada contra los [Glossary('Reyes Yama','podgloss.yamaking')], contentos con seguir a sabios míticos y con la tenue esperanza de una Redención de un dios en el que no creía.\nSus mejores esfuerzos por concienciar sobre la amenaza de los [Glossary('Reyes Yama','podgloss.yamaking')] se toparon con burlas y réplicas ante su insolencia juvenil. Cuando su humillación pública y estruendosa de un Ancestro terminó en su exilio, Songul supo lo que tenía que hacer.\n\nPara ella está claro como el día que los [Glossary('Reyes Yama','podgloss.yamaking')] triunfarán. Así que lo único que aún puede asegurar es que gane el menos horroroso. Y así, Songul se consagró a [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], convirtiéndose quizás en su [akuma|E] más celosa, sin que él haya movido un solo dedo para que esto sucediera."
 POD_persistentpodlore.desc.793448: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nQurdjaquz fue una vez un nombre muy conocido entre la Corte de la Tortuga Negra. Un dedicado Tigre Diablo respetado por su empeño en salvaguardar la Corte frente a las muchas amenazas que la rodeaban. Junto a Lei Fan, fue el defensor más firme de redirigir los esfuerzos contra los Akumas de [Glossary('Anda','podgloss.anda')] y [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] en lugar de contra la Corte del Emperador Amarillo.\nUn hombre de acción ante todo, Qurdjaquz logró varias victorias contra incursiones menores de los [Glossary('Rey Yama','podgloss.yamaking')], aunque un triunfo verdadero se le escapó. La posibilidad de lograr precisamente eso llegó cuando descubrió el plan a largo plazo de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]: la corrupción de los nidos de dragón de las estepas.\n\nFue una gran noche para la Corte de la Tortuga Negra, con poderosos guerreros reunidos por Qurdjaquz preparándose para un golpe decisivo contra [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. Incluso los hastiados Ancestros dieron su bendición a esta oportunidad sin precedentes. La batalla iba a ser un poderoso revés para el ascenso del [Glossary('Emperador Demonio','podgloss.demonemperor')].\n\nAl final, todos fueron masacrados excepto el propio Qurdjaquz. Algunos dicen que [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] estaba en el lugar del nido de dragón corrupto, ya que su verdadero plan requería su presencia. El [Glossary('Rey Yama','podgloss.yamaking')] no solo quería corromper los nidos de dragón; pretendía «vincularlos» a sus propios Akumas. Esto le permite obtener el uso exclusivo del Chi corrupto (que acaba debilitando a otros [Glossary('Reyes Yama','podgloss.yamaking')]) y transferir el Chi corrupto de una criatura a otra a su antojo.\nQurdjaquz fue el primer cautivo vinculado por la fuerza a un nido de dragón corrupto y enloquecido por completo por el estallido de Chi maligno que fluía constantemente a través de él.\n\nAsí terminó la noche del mayor triunfo de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. Una ventaja revolucionaria contra sus rivales asegurada, un enemigo moldeado para ser su siervo y el espíritu combativo de la Corte de la Tortuga Negra roto sin remedio, listo para ser tomado."
 POD_persistentpodlore.desc.793449: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nJakhangir creció con cuentos de héroes, dioses y monstruos y disfrutó cada minuto de ello. El hecho de que muchos de ellos sirvieran como advertencia contra peligros muy reales nunca llegó a calarle realmente.\nAl convertirse en un diligente miembro de su tribu gracias a su deseo de emular a aquellos héroes, Jakhangir mostró suficiente promesa como para ser $pod_Embraced$ por los [Glossary('Anda','podgloss.anda')]. Entusiasmado por formar parte de una comunidad tan fuerte como esta, Jakhangir seguía sabiendo que tenía que hacer algo para distinguirse de verdad, como siempre hacen las figuras heroicas. Por ello, decidió otorgar la inmortalidad a su amor de la infancia antes de que ella pudiera envejecer sin él.\nLos [Glossary('Anda','podgloss.anda')], que solo permiten el Abrazo una vez que eres lo suficientemente experimentado y son más estrictos con la incorporación de mujeres, no se lo tomaron bien. Tanto es así que desterraron a Jakhangir y a su nueva Chiquilla, Aslihan, de su campamento.\nJakhangir, aunque entristecido por ello, lo aceptó con naturalidad. Aslihan estaba agradecida por volverse inmortal y ambos continuaron sus vidas en las estepas como un dúo improbable.\n\nAunque carecían de algunos conocimientos básicos sobre lo sobrenatural, demostraron ser lo suficientemente ingeniosos para sobrevivir y su buena naturaleza los hizo bienvenidos entre varios grupos, incluidos algunos clanes [Glossary('Anda','podgloss.anda')] que no conocían su exilio.\n\nFue cuando cabalgaron más al este que el grueso de los [Glossary('Anda','podgloss.anda')] cuando sus destinos dieron un giro funesto. Emboscados por los Akumas de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], que buscaban [Glossary('Anda','podgloss.anda')] aislados, fueron llevados a un nido de dragón corrupto y sometidos a los últimos experimentos de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], creando «[akuma|E] de [Glossary('Anda','podgloss.anda')]». Para su placer, la prueba fue un éxito, deformando las mentes de la desafortunada pareja con una cantidad abrumadora de Chi maligno.\nAunque queda un fragmento de sus antiguos yo, enterrado bajo el dolor y el horror constantes de los experimentos, Jakhangir y Aslihan son ahora marionetas del [Glossary('Rey Yama','podgloss.yamaking')], incapaces de desobedecer sus órdenes para atraer a más [Glossary('Anda','podgloss.anda')] hacia él.\n\nSi todo sale según lo previsto, ambos no serán más que los primeros de un ejército interminable de [akuma|E] de [Glossary('Anda','podgloss.anda')] que asegurará el ascenso de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] como el [Glossary('Emperador Demonio','podgloss.demonemperor')]."
