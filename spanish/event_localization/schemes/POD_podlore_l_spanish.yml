entos de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], creando «[akuma|E] de [Glossary('Anda','podgloss.anda')]». Para su placer, la prueba fue un éxito, deformando las mentes de la desafortunada pareja con una cantidad abrumadora de Chi maligno.\nAunque queda un fragmento de sus antiguos yo, enterrado bajo el dolor y el horror constantes de los experimentos, Jakhangir y Aslihan son ahora marionetas del [Glossary('Rey Yama','podgloss.yamaking')], incapaces de desobedecer sus órdenes para atraer a más [Glossary('Anda','podgloss.anda')] hacia él.\n\nSi todo sale según lo previsto, ambos no serán más que los primeros de un ejército interminable de [akuma|E] de [Glossary('Anda','podgloss.anda')] que asegurará el ascenso de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] como el [Glossary('Emperador Demonio','podgloss.demonemperor')]."
 POD_persistentpodlore.desc.793451: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nComo ancestra regional de la Corte de la Tortuga Negra, Khanda tiene el dudoso honor de tener un asiento en primera fila para lo que parece ser el fin del mundo.\n\nFue una ancestra capaz y respetada; ella misma será la primera en admitir que subestimó las primeras señales. Las desapariciones, la indolencia que se extendía desde la corte central, el desdén casual por los rumores de [akuma|E]... sonaba como el habitual pesimismo que prevalece en las Generaciones más jóvenes que no conocen nada mejor. Solo cuando un ministro en quien confiaba intentó envenenar su nido de dragón frente a ella comprendió la gravedad. Él pensó que ella ya estaba «de acuerdo con los cambios», pero pagó por ello con su vida, aunque fue demasiado poco y demasiado tarde.\n\nKhanda lo ve ahora: la influencia de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] está en todas partes en las estepas. Sus [akuma|E] se pavonean como si fueran los dueños del lugar, y quién sabe si los $pod_cainites$ de los [Glossary('Anda','podgloss.anda')] también están bajo su control. Pero... ¿qué se suponía que debía hacer? Su muestra de desafío contra su corrupto ministro la puso en la lista de los más buscados por el [Glossary('Rey Yama','podgloss.yamaking')], y no fue cuestión de tiempo para que fuera calumniada, amenazada y chantajeada a diario. Fue cuando ocurrió el primer intento de asesinato cuando Khanda supo que ya no tenía otra opción.\n\nAl hacer su primer pacto con [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], Khanda se convirtió en un peón más de él.\nO eso cree él. La verdad es que la asediada ancestra está más que lista para ser una mártir. Ahora que el [Glossary('Rey Yama','podgloss.yamaking')] no la vigila de cerca, ha empezado a interferir sutilmente en sus planes. No puede ser demasiado descarada, pero engañar Akumas, dejar que las tropas de resistencia escapen de su territorio, calumniar a «rivales»... no es mucho, pero suma, o al menos eso espera.\nPor ahora, Khanda está feliz de ser considerada una idiota incompetente en las fuerzas de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. Teme el día en que comprendan que en realidad es muy capaz en lo que hace.\n\nDestino futuro\nLas contribuciones de Khanda a la caída de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] permanecerán en el anonimato. Cuando el [Glossary('Rey Yama','podgloss.yamaking')] sea finalmente destruido y su alma vendida sea aniquilada con él, ella partirá hacia el Olvido con una sonrisa en el rostro."
 POD_persistentpodlore.desc.793452: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nTayisung siempre fue un soldado sencillo y llevaba una vida que le satisfacía. Aunque oía los rumores de que la Corte de la Tortuga Negra estaba siendo corrompida por [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], solía dejar esos asuntos en manos de quienes parecían más cualificados para gestionarlos. Hoy se arrepiente de esa elección.\n\nNunca le interesó el poder y, al tener un historial impecable, Tayisung se sintió cómodo cuando fue enviado a ser cortesano en una corte regional menor. Incluso prosperó allí, logrando el honor de convertirse en el Primer Oni y guardián del nido de dragón de dicha corte, una tarea que se tomó muy en serio.\nLamentablemente, ni siquiera este puesto lejano pudo mantener la influencia de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] alejada para siempre. Tayisung vio las señales pero se mantuvo firme, deteniendo a varios [akuma|E] incipientes que intentaban acceder al nido. Solo lo hizo cuando recibió una orden del Ancestro de retirarse.\nOtra elección de la que hoy se arrepiente.\n\nLamentablemente, no le sorprendió ver su nido de dragón completamente corrompido cuando regresó a su puesto. A estas alturas, sin embargo, hay poco que pueda hacer. Necesita las energías del Chi para sobrevivir y, por tanto, acabará corrompido también, y lo sabe.\nLa rebelión nunca ha estado en el vocabulario de Tayisung, pero lo último que quiere prometerse a sí mismo mientras su mente siga siendo suya es no arrepentirse de una elección por tercera vez.\n\nDestino futuro\nCuando los Jinetes de la Hoja de Plata ataquen su nido de dragón para purificarlo, Tayisung solo ofrecerá una resistencia simbólica y «olvidará» advertir a su Corte antes de ser asesinado. Este será su primer y último acto de desafío."
 POD_persistentpodlore.desc.793453: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nBaatar fue víctima de una de las infames «redadas de [akuma|E]» de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], donde comunidades enteras son masacradas para acabar potencialmente como prisioneros en el [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')]. Aunque fue un niño problemático y un adulto indeciso en su vida mortal, Baatar demostró ser fuerte bajo presión y soportó la tortura mejor que la mayoría.\nMejor que su Hermano Mayor, en cualquier caso, quien también acabó como prisionero al mismo tiempo que él. Aunque Baatar no era particularmente cercano a él cuando era mortal, hizo todo lo posible por ayudarle y consolarle en esa terrible prisión. Sin embargo, no funcionó y, al ver el espíritu de su hermano destrozado, Baatar aprovechó la oportunidad para escapar sin él.\n\nAunque probablemente fue la decisión correcta en aquel momento, esta elección decisiva obstaculizó el crecimiento de Baatar como $pod_kueijin$, ya que siempre intentaba encontrar la forma de volver allí y salvarlo. Obviamente, sus súplicas para atacar el [UmbraGlossaryLocalized('yomi_wan','Inframundo Yomi')] de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] fueron recibidas con risas burlonas y, por tanto, Baatar cayó en la desesperación. Todo cambió cuando la Corte de la Tortuga Negra se sumió más en la corrupción y el conocimiento sobre cómo negociar con los [Glossary('Reyes Yama','podgloss.yamaking')] se extendió más.\nBaatar hizo entonces un trato con [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. Su servicio como [akuma|E] a cambio de la liberación de su hermano. Y, aunque el contrato fue sellado y, por tanto, vinculante para ambas partes, Baatar no especificó «dónde» debía ser liberado su hermano y así no volvió a verle. Sus nuevos deberes como [akuma|E] le prohíben intentar localizarlo y Baatar se está desesperando una vez más.\nCon su alma vendida y su hermano varado en un lugar que solo [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] conoce, el futuro parece ciertamente sombrío.\n\nDestino futuro\nDurante los años que precedieron a la caída de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], Baatar oirá hablar de un feroz guerrero de las Cortes Chinas que coincide con la descripción de su hermano. De hecho, cuando el Quincuncio lance sus ataques finales, los dos hermanos estarán en bandos opuestos.\nBaatar intentará explicarse, pero su voz será silenciada por el mezquino [Glossary('Rey Yama','podgloss.yamaking')], asegurando así que Baatar sea asesinado por su hermano como un simple [akuma|E]."
 POD_persistentpodlore.desc.793454: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nDel caos de la Guerra Eterna hay desbordamientos rutinarios. Últimamente, soplan vientos de cambio a medida que las nuevas cosas empiezan a asomar y presionar más allá. Y mientras estos horrores nocturnos intentan atravesar las tierras del pueblo Tai, encuentran finales espantosos. Lawan no tolerará influencias externas ni vientos mortales que manchen sus obras.\n\nLawan, en vida, fue una esclava de los pueblos Champa, secuestrada y puesta al servicio de la construcción de sus obras. Y esa fue toda su vida, una esclava propiedad de otros. Y por esa vida, el cielo consideró oportuno enviarla al Infierno de la Nada, donde, tras una vida de fatigas, se le dejó mendigando migajas y restos para seguir trabajando.\nPero Lawan, que en vida buscó desesperadamente una escapatoria y estaba harta de la tiranía de los hombres mortales y del [Glossary('Rey Yama','podgloss.yamaking')], se convirtió en una fortaleza de polvo y un huracán de alientos, donde después barrería a sus carceleros. Más tarde sería encontrada por la Corte del Fénix Escarlata tras su escape.\n\nDecir que Lawan tiene rencor por su vida mortal es quedarse corta. Detesta y desprecia la sociedad mortal, viéndola como monstruos depravados que han convertido el Infierno en lo que es con su maldad. Son ganado que aplastaría a los suyos con tal de evitar al carnicero.\nAsí que no, ella evitará que manchen esta sociedad más pura, y será un baluarte entre las Cortes y la pecaminosidad mortal.\n\nDestino futuro:\nLawan sería una aliada temprana de Piyau, viendo en su ideología, tan divergente de la sociedad mortal, la liberación definitiva. Sin embargo, su propio resentimiento hacia la sociedad mortal acabaría por aislarla de sus aliados potenciales, siendo usurpada y relegada a la oscuridad por cortes más integracionistas en las noches actuales."
 POD_persistentpodlore.desc.793455: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nMientras muchos Ancianos se centran demasiado en el [Glossary('Dharma','podgloss.dharma')], y algunos herejes se obsesionan con su vida mortal, todo eso le parece bastante absurdo a Klahan. Uno puede buscar poderes superiores y seguir cuidando de quienes le rodean. De hecho, él lo considera la cumbre de la sabiduría. Y además, sus experiencias mortales exigen nada menos que eso.\n\nKlahan nació siendo esclavo, e incluso a través de aquel infierno mortal, fue un optimista. Amable con quienes le rodeaban, agradable y carismático, y siempre dispuesto a esperar a que los demás reaccionaran, Klahan era muy querido por todos sus allegados.\nPero su vida fue una nota al pie, y cuando murió, fue enviado al Infierno de ser desollado vivo por los pecados de las personas que le poseían. Pero Klahan estaba acostumbrado a no tener nada más que su ingenio y su carisma, y los usó bien para persuadir a los viajeros para que le ayudaran en su escape.\n\nKlahan es una Presencia sobria y, por eso, se le considera un poco aguafiestas en la más vivaz Corte del Fénix Escarlata. Pero no le importan sus nombramientos rurales, ya que establece vínculos entre la gente y construye poder blando entre los mortales.\nTiene planes, metas y esperanzas. La Expiación puede llegar algún día. Solo necesita esperar la oportunidad.\n\nDestino futuro\nLa astuta paciencia de Klahan y su disposición a permanecer en las sombras le recompensan bien. Totalmente dispuesto a ser sumiso y deferente con Piyau y sus fuerzas, es ignorado y absorbido silenciosamente.\nPero en la modernidad, la hábil política y el apoyo mortal le permitirán derrocar a sus antiguos amos, ascendiendo debidamente y saliendo a la luz como los verdaderos protectores de su Tierra Natal.\nY a medida que el [Glossary('Emperador Demonio','podgloss.demonemperor')] se acerca, su sabiduría es necesaria ahora más que nunca."
 POD_persistentpodlore.desc.793456: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEn una ocasión, Sakchai fue asignado a su corte para asegurar que ningún sobrenatural pasara por las rutas del sudeste asiático sin la aprobación o supervisión de Dyanang. Ahora, solo le importa su propia aprobación y supervisión.\nCon su vida mortal convertida en un miasma de fragmentos de aislamiento y cadenas, apenas recuerda su tiempo en el Infierno de los Pecadores del Mundo Al Revés. Pero al menos sabe que una mentalidad libre fue lo que lo liberó. Su apertura de mente fue originalmente lo que le valió su posición como supervisor de viajeros, pero la Corte del Fénix Escarlata no vio la ambición y la vanagloria rapaz en su corazón.\nSiempre quiso una justificación. Y la encontró cuando conoció a otra extraña criatura nocturna vestida de sombras, predicando la palabra de un dios extranjero.\n\nSakchai, al menos superficialmente, llegaría a adoptar esta mentalidad hasta cierto punto, permitiendo que este extraño se adentrara en la Corte del Fénix Escarlata. A medida que llegan más, busca ganarse su favor e intenta aumentar su poder entre estos «$pod_cainites$», buscando más vínculos y conexiones para consolidar su autoridad.\nDesde su perspectiva, rechazar a estos extranjeros es una idiotez. Para tener éxito es necesario abrazar a los forasteros, al menos de una manera que los complazca.\nAsí que ha dicho a estos «[Glossary('Ashirra','game_concept_ashirra_desc')]» que está totalmente de acuerdo con ellos, utilizando su fe como justificación para aumentar su poder y autoridad.\n\nDestino futuro\nSakchai, debido a su determinación y audacia, intentaría abarcar más de lo que puede morder. Cuando la Monja Desolladora Intan llegó a su corte, sus exigencias de sumisión y conversión de corazón y mente a su nueva «iluminación» provocaron que ella considerara que su posición ya no era necesaria; el hecho de que él intentara hacerla ejecutar por desafiarle empeoró las cosas. Incluso intentaría arrestar al siguiente discípulo de Piyau enviado para «eliminarlo».\n\nAcabaría en el mismo estómago que incontables Akuma cuando Wati se lo devorara entero."
 POD_persistentpodlore.desc.793457: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nTodos en la Corte de Angkor claman que Tilaka es fuerte, hábil e iluminada. Como líder del famoso Manto Dorado [Glossary('Wu','podgloss.wu')], su condición de sucesora obvia de Dyanang es un hecho. ¿Cómo podría ser de otra manera?\nLa verdad es un poco más complicada.\n\nTilaka es, en efecto, la líder del famoso grupo que negoció una paz duradera con los feroces cambiaformas de la selva. Sin embargo, ser la líder no significa que ella fuera la pieza clave y, a decir verdad, fue casi lo contrario.\nTilaka es ambiciosa hasta el exceso y, cuando su compañero [Glossary('Wu','podgloss.wu')] Vedavati se ofreció a iniciar las negociaciones con los cambiaformas, Tilaka solo vio dos resultados. El éxito le traería fama, mientras que el fracaso probablemente costaría la vida de Vedavati, un precio que ella estaba dispuesta a pagar.\nSu evaluación resultó ser correcta y Tilaka fue rápida en poner su nombre al frente del naciente tratado de alianza. Tan rápida, de hecho, que casi amarga los procedimientos hasta que Vedavati intervino.\n\nAl final, no importó realmente y Tilaka ha estado aprovechando esta gran victoria al máximo desde entonces. Hay que reconocerle que lo hizo bien y la Corte de Angkor come de su mano en este momento, aunque, curiosamente, la propia Dyanang se muestra inusualmente fría y distante con ella.\nNo importa realmente; es probable que la Emperatriz de la Corte Escarlata alcance pronto las [Glossary('Cien Nubes','podgloss.hundredclouds')] dejando el trono totalmente libre para Tilaka. Entonces, reorganizará la Corte a su imagen y comenzará verdaderamente su ascenso.\n\nDestino futuro\nEl ascenso de Piyau preocupará a Tilaka. Una preocupación que se convertirá en pánico absoluto cuando el Dragón Rojo demuestre un éxito impresionante.\nTilaka intentará aprovechar todo su poder político para tacharla de herética y enviar fuerzas contra ella, pero será detenida en cada paso por Dyanang.\nCuando la Emperatriz Escarlata finalmente abandone Angkor, será demasiado tarde. Los seguidores de Tilaka se negarán a morir por una causa perdida, dejándola sin otra opción que desafiar a duelo a quien considera su némesis.\n\nPiyau la despachará rápidamente, preguntándose ociosamente quién era esa mujer frenética que aparentemente la odiaba tanto."
 POD_persistentpodlore.desc.793458: "Este personaje fue creada por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSriteja tiene gratos recuerdos de su vida mortal como parentela de los Khan. Siempre fue alta, fuerte y llamativa, lo que hacía que los hombres Khan la trataran con respeto e intentaran conquistarla. Sin embargo, esto no llegó a suceder, ya que murió protegiendo a su tribu de las fuerzas del [Glossary('Rey Yama','podgloss.yamaking')] Ravana.\nAl terminar en Lanka, el [UmbraGlossaryLocalized('yomi_wan','Inframundo')] de Ravana, Sriteja simplemente lo vio como una continuación de su batalla anterior. Luchó con determinación y paciencia, ganándose su escape y su regreso como una $pod_kueijin$. Dicho regreso fue una experiencia difícil para ella, al encontrar el despiadado ambiente político de las Cortes muy alejado de la vida mucho más sencilla de su tribu mortal.\nAl quedarse a la deriva durante un tiempo, terminó asignada al Manto Dorado [Glossary('Wu','podgloss.wu')] cuando empezaron a negociar con los cambiaformas debido a su pasado.\n\nEl regreso a casa de Sriteja no fue tan cálido como esperaba al principio, ya que su gente ahora la veía con sospecha en el mejor de los casos por ser una $pod_kueijin$. Sin embargo, no se rindió y se reconectó con ellos tanto como pudo, ayudada por el hecho de que las negociaciones de paz iban bien al mismo tiempo.\n\nCuando estas finalizaron, Sriteja se dio cuenta de que, incluso con estas relaciones más cálidas, nunca podría vivir con su gente y estaba condenada para siempre a ser una forastera. Esto la sumió en un malestar que se convirtió en desesperación.\nCuando su líder Tilaka la llevó a la Corte para ser apartada del Manto Dorado porque ahora era «inútil», la Emperatriz Escarlata Dyanang se negó y, en su lugar, nombró a Sriteja Primera Oni, actuando como general de las fuerzas de la Corte de Angkor.\n\nEl motivo subyacente de este nombramiento sorpresa pronto se hizo evidente. Sriteja tenía que trabajar estrechamente con los ahora aliados cambiaformas para mantener la paz y manejar las amenazas comunes. Ahora prospera en su nuevo papel, convirtiéndose en una respetada coordinadora entre ambas fuerzas.\n\nDestino futuro\nSriteja no parpadeará cuando su líder Tilaka se autodestruya contra Piyau. En su lugar, será confirmada en su cargo. Incluso la fragmentación de las Cortes tras Piyau no cambiará mucho para ella; las muchas Reinas Doradas seguirán confiando en ella para mantener la paz con el Feroz Pueblo de la selva, algo que sigue haciendo hasta el día de hoy."
 POD_persistentpodlore.desc.793459: "Este personaje fue creada por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nVedavati, a pesar de lo que muchos piensan, fue la verdadera mente maestra detrás del tratado que alió a la Corte del Fénix Escarlata con los feroces cambiaformas de la selva. Pocos lo creerían al verla, ya que su presencia tímida y modesta no encaja bien con tal hazaña diplomática.\n\nNo habla de su tiempo en el [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] pero es seguro suponer que dejó un estigma profundo en ella. También le dio la convicción inquebrantable de que los Reyes Yama [Glossary('Reyes Yama','podgloss.yamaking')] deben ser detenidos. Lamentablemente, pronto aprendió que muchos $pod_kueijin$ hablan más de enfrentarse a ellos que de hacer algo al respecto.\nSer asignada al Manto Dorado [Glossary('Wu','podgloss.wu')] no ayudó a la situación. Su líder Tilaka estaba más preocupada por la gloria personal y la ambición que por la verdadera amenaza. Todo llegó a un punto de ruptura y Vedavati estaba considerando abandonar la corte cuando la Emperatriz Escarlata Dyanang la convocó para una conversación privada. No se sabe qué se dijo allí, pero Vedavati salió con un fuego renovado en sus ojos que la llevó a encabezar los esfuerzos diplomáticos con los cambiaformas.\n\nCuando, a pesar de los muchos obstáculos, resultó ser un éxito, se contentó con dejar el elogio para Tilaka y, en su lugar, trabajó en sus propios proyectos. Quién sabe cuáles sean.\n\nDestino futuro\nVedavati ayudará sutilmente al ascenso de Piyau al poder actuando como diplomática con varias Cortes indecisas. Cuando se le cuestione por esta ayuda improbable de alguien que no es muy adecuada para el extremo [Glossary('Dharma','podgloss.dharma')] de Piyau, Vedavati simplemente dirá que el Dragón Rojo hizo más contra las fuerzas infernales de lo que la mayoría de las Cortes creyeron posible.\nLuego se desvanecerá en el fondo, convirtiéndose en una especie de leyenda urbana entre las Cortes Doradas, ya que su destino nunca será registrado."
 POD_persistentpodlore.desc.793460: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nBhadra, a todos los efectos, era una $pod_kueijin$ bastante insignificante que se convirtió en la insignificante integrante más joven del Manto Dorado [Glossary('Wu','podgloss.wu')]. Vagó a través de la Iluminación dhármica y la política de la corte, contenta de apoyar a su líder Tilaka en sus proyectos más ambiciosos. Se la valoraba por su lealtad, pero en realidad era más bien una apatía general lo que la impulsaba a hacer lo que se le pedía. Las cosas cambiaron drásticamente en 1177 cuando tropezó, francamente por puro azar, con una conspiración [akuma|E] para apoderarse de un nido de poder de los Zhong Lung (los cambiaformas dragón).\n\nCon su [Glossary('Wu','podgloss.wu')] a su lado, cargó hacia la batalla y salvó al cambiador de dragón llamado Nongkhai en el proceso, ganándose de repente una fama y unos galardones para los que no estaba nada preparada.\nEste cambio repentino ha avivado el sentido de identidad y la ambición de Bhadra, y ahora está (no muy sutilmente) cuestionando el liderazgo de Tilaka sobre el Manto Dorado. La seria brecha de edad y poder significa que Bhadra no hará movimientos audaces pronto, pero finalmente ha empezado a jugar al juego de la política de la corte y ha descubierto que le gusta.\n\nDestino futuro\nCuando la cabeza de Tilaka ruede por el suelo tras su desafío contra Piyau, Bhadra jurará sabiamente lealtad a las Cortes Doradas.\nAl convertirse en una de las primeras Reinas Doradas, sin embargo, acabará rápidamente mordiendo más de lo que puede masticar al amenazar el territorio de otra Reina Dorada, Mawar.\nSu destino final será ser arrojada a un foso de carne, convirtiéndose en la primera víctima prominente del constante estado de guerra civil de baja intensidad de las Cortes Doradas."
 POD_persistentpodlore.desc.793461: "Este personaje fue creada por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nNacida con una discapacidad física, Konti fue cuidada por su familia hasta que dejó de serlo cuando su despiadado hermano se convirtió en cabeza de familia y la abandonó a su suerte.\nAunque sumergirse en un [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] fue un shock, el hecho de que este mundo espiritual le permitiera ser independiente por primera vez en su existencia la impulsó a aguantar hasta que encontró una oportunidad.\n\nRegresar como una $pod_kueijin$ en la Corte del Fénix Escarlata fue una experiencia tremenda para ella. Al abrazar el vivaz estilo de vida de la Corte alineada con el Yang, Konti nunca se cansó de experimentar al máximo todo lo que se perdió durante su vida. Así, a pesar de su respetable edad y su carrera en varios cargos ministeriales, sigue siendo considerada una discípula excesivamente entusiasta por muchos.\nIntentando centrarla y enfocarla, la Corte de Angkor asignó a Konti al Manto Dorado [Glossary('Wu','podgloss.wu')]. Como todo lo demás, Konti se lanzó de cabeza a este nuevo papel y fue una ayuda crucial en los muchos logros diplomáticos y militares que el Manto acumuló. Aun así, su Iluminación dhármica [Glossary('Dharmic','podgloss.dharma')] permaneció tan estancada como siempre y la Corte de Angkor está empezando a ser menos indulgente con sus ocurrencias; algunos argumentan que está en un camino directo a ser tentada por un Rey Yama [Glossary('Rey Yama','podgloss.yamaking')]\n\nDestino futuro\nSus temores no se cumplirán, ya que el ascenso de Piyau ofrecerá una nueva oportunidad para Konti. Al enterarse de las Flores de Sangre de la Pasión [Glossary('Dharma','podgloss.dharma')], se unirá a ellas en la primera oportunidad que tenga.\nAprendiendo bajo la discípula de Piyau, Mawar, Konti prosperará en los extremos de las Flores de Sangre de la Pasión, pero también logrará progresar en el camino hacia la Iluminación gracias a ello.\nAl convertirse en ministra regional de Mawar y luego en una Reina Dorada por derecho propio, Konti será el principal ejemplo que las Cortes Chinas señalarán cuando describan (con temor) los increíbles excesos por los que serán conocidas las Cortes Doradas.\n\nSin embargo, a Konti no le importará y ascenderá constantemente hasta las Cien Nubes [Glossary('Cien Nubes','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793462: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nIncluso desde su vida mortal, contemplando el Pacífico en la costa china, Shenyou siempre se preguntó qué habría al otro lado. E incluso después de su Segundo Aliento, no puede evitar seguir preguntándose.\n\nShenyou fue marinero en su vida mortal, nacido incluso en un barco. Entre navegar por las primeras rutas hacia Filipinas, los pasos hacia Japón y Vietnam, y otras islas más pequeñas alrededor del Mar de la China Meridional, el mar abierto siempre lo llamaba, incluso cuando lo mataba en una tormenta.\nPero el Infierno de los Mares Hirvientes no fue el peor destino para él, ya que podía comprender las rutas que seguían los barcos. Al aferrarse al casco de un barco de Muertos Hambrientos que pasaba, encontró su escape y fue acogido por la comunidad.\nY con sus conocimientos de navegación, Hao lo reclutó inmediatamente por su habilidad y sabiduría. Manteniéndolo cerca, la sabiduría de Shenyou se puso en uso de inmediato para mantener el contacto con la decadente Corte del Fénix Escarlata, abierta a acoger a refugiados cualificados que huían del caos.\nCon ello, Shenyou se volvió invaluable, seleccionando a los mejores de el Sudeste Asiático y Nusantara para elevar aún más la Corte de Hao.\n\nDestino futuro\nShenyou seguiría con entusiasmo a Hao en su eventual plan maestro del Gran Salto hacia el Exterior. Cruzaría con entusiasmo el Pacífico e intentaría establecer una Corte en Mazatlán. Sin embargo, varios ataques insensatos contra el Sabbat llevaron a la destrucción de su corte, y regresó al Quincuncio avergonzado, sometiéndose al juicio ante el Ojo del Cielo por su fracaso."
 POD_persistentpodlore.desc.793463: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nMientras las Cortes del Emperador Amarillo han caído durante mucho tiempo en manos de sicofantes y aduladores, no todos sufren las dolencias de un gobierno cargado por una gestión demasiado mediocre. Jingxinan es uno de los afortunados. Y quien la puso en orden fue alguien que antes era un nadie sumiso, asesinado por la guerra y reducido a nada, que juró no volver a ser débil jamás.\n\nChujun fue uno de los miles asesinados en el avance mongol por China. Eso es casi todo lo que Chujun recuerda, pero también cómo fue débil en su vida mortal.\nEl Infierno de ser Desollado Vivo lo cambió hasta la médula. Las arenas de piel le iluminaron, mostrándole cómo incluso los granos más pequeños podrían convertir a un demonio en niebla en cuestión de minutos si se guiaban correctamente. Y esos fueron los principios que guiaron el escape de Chujun.\n\nInmediatamente tras entrar en la Corte de Hao Wei Liang, Chujun se dedicó a estudiar las obras de Sun Li, queriendo hacerse grande y negarse a ser débil de nuevo. Seleccionado como el ejecutor personal de Hao, tuvo un éxito rotundo en ese camino. Y a medida que se acerca una era caótica, su camino permanece inalterado.\n\nDestino futuro\nChujun prosperaría y florecería bajo Hao, y a través de sus expansiones en el Gran Salto hacia el Exterior, Chujun escribiría sus propias obras y tratados sobre cómo luchar contra los $pod_cainites$.\nSin embargo, su propia audacia sentenciaría su fin, cuando intentaría valientemente liderar una fuerza expedicionaria para tomar Lima de manos de los nativos Karai Pyhare. Los Legados Ahogados lo desafiaron y diezmaron sus ejércitos, y cuando regresó al Quincunx para pedir refuerzos, se encontró con una institución en colapso, y su propia Corte estaba sumida en el caos bajo la usurpación de la Legión del Cielo y el Infierno.\n\nY así, el hombre que una vez juró no volver a ser débil, encontró su fin balbuceando y suplicando antes de que Shufen le succionara el último aliento de los pulmones y sus restos, rápidamente en descomposición, fueran arrojados al océano."
 POD_persistentpodlore.desc.793464: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nPara la mayoría de los antiguos ancestros de la Corte del Emperador Amarillo, la amenaza de los [akuma|E] es distante, como las contiendas de las Cortes de la Tortuga Negra y el Fénix Escarlata. Simplemente, están demasiado lejos y las virtudes del Camino Quíntuple los protegen, así que se regocijan en sus laureles.\n\nLingyuan no puede permitirse ese lujo.\n\nLa vida mortal de Lingyuan es una bruma para ella; sabe que en vida fue cocinera en un restaurante y que murió en algún tipo de incendio.\nPero en el Infierno de los Pecadores de la Inversión, vio destellos de maldad, una oscuridad acechante y ejércitos de demonios marchando bajo un soberano de un solo ojo. Su escape no fue por libertad personal, sino por el deseo de salvar al mundo de esa amenaza.\n\nSu determinación y voluntad para lograrlo le ganaron un lugar fácil entre las cortes más competentes de Jingxinan, donde se ha dedicado a centrarse en encontrar a estos demonios ocultos.\n\nDestino futuro\nLingyuan llegaría a ver a este demonio de un solo ojo como Zao-Lat, conocido en Occidente como Saulot, y se dedicaría a purgar a los $pod_cainites$ como parte del Gran Salto hacia el Exterior. Pero tras la caída de Hao en desgracia, su propia posición sería sistemáticamente destrozada por los Ancestros de la Legión del Cielo y el Infierno, y tras un intento fallido de asesinato contra Lin Xiao, fue llevada ante la conquistora de la Legión, Ma Hai-Lan.\n\nY en sus últimos momentos antes de la muerte, solo pudo reír al ver la mirada del demonio de un solo ojo mientras se enfrentaba al juicio."
 POD_persistentpodlore.desc.793465: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSiendo el miembro más extraño de la Corte de Hao Wei Liang, el hecho de que haya un [Glossary('Penangallan','podgloss.penangallan')] entre ellos es un shock. Pero la errante estudiante del ancestro exiliado Thitkwa ha encontrado un lugar crítico en la corte de Hao.\n\nHayati nació en Malasia, una Tejedora sin renombre ni notoriedad, al menos hasta su muerte, donde su vida de mediocridad la condenó al Infierno de la Indigencia. Desorientada y horrorizada por que esto fuera motivo de condenación, Hayati hizo todo lo posible por intentar dar sentido a las cosas; lo único que finalmente pudo tener sentido fue la adquisición de riqueza.\nAsí, atesoró todo lo que pudo en la desolada extensión y finalmente pudo sobornar su camino hacia el Segundo Aliento. Y a partir de esa experiencia, se volvió notablemente hábil gestionando dinero, analizando cada moneda.\nY aunque inicialmente fue instruida por el [Glossary('Penangallan','podgloss.penangallan')] Thitkwa, Hayati fue una estudiante extraña, mucho más centrada en el dinero y la estabilidad que en el sexo y la violencia, pero con el mismo celo salvaje que cabría esperar de ellos.\n\nEnviada a tratar con los enviados a Jingxinan, Hayati descubrió que Hao Wei Liang era un ancestro mucho más capaz, así que simplemente nunca se marchó. Se volvió fundamental para ayudarle con las traducciones y navegar la política del Sudeste Asiático, y su perspicacia fue invaluable para evitar la arrogancia habitual que plagaba sus relaciones.\n\nDestino futuro\nEventualmente, Hayati sería el vínculo principal que el Quincunx tendría para comprender las Cortes Doradas. Y cuando Hao tomara el mando del Gran Salto hacia el Exterior, Hayati sería su hilo conductor guiándolos hacia Australia.\nSin embargo, su creciente conflicto con la Legión del Cielo y el Infierno, más centrada en lo interno, sentenciaría su fin, ya que sería acusada de conspirar con las Cortes Doradas, y su condena final desencadenaría la reacción en cadena que llevaría al fracaso del Gran Salto hacia el Exterior y al desastre de la Rebelión del Siglo."
 POD_persistentpodlore.desc.793466: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAunque las cortes de Jingxinan se centran menos en la Cultura de Corte, siguen enorgulleciéndose de una adecuada construcción de la Corte y de la política. Sin embargo, hay momentos en los que deben enviar a alguien para una negociación difícil con otras Cortes. Y Xiao'e teje hilos con maestría.\n\nActriz en vida, Xiao'e siempre tuvo un don para entender a la gente. Abrir puertas y despejar caminos para el éxito de otros era algo que se le daba muy bien.\nSu encanto la ayudó a escapar del Infierno de la Sal y el Hierro, y su determinación la convirtió en una miembro fundacional de los Gibbons Saltadores, especialmente como la primera discípula de Hao. Y como hay susurros de un inminente cambio masivo, sus servicios serán necesarios ahora más que nunca.\n\nDestino futuro\nXiao'e presenciaría el colapso de las Cortes Augustas y, gracias a su influencia, se consolidaría a sí misma y a Hao como miembros fundacionales del Quincunx.\n\nAl impulsar lo que se convertiría en el Gran Salto hacia el Exterior, Xiao'e fue fundamental para su éxito. Sin embargo, su enfoque en el extranjero la convirtió en enemiga de muchos y, en cuanto quedó claro que ella era quien abría las puertas, encontró un final espantoso una noche cuando el Toro Demonio de la Legión del Cielo la recibió con el martillo en la mano."
 POD_persistentpodlore.desc.793467: "Este personaje fue creada por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nMientras que pocos Muertos Hambrientos abandonan el Infierno de ser Desollado Vivo con amor por los señores de los [UmbraGlossaryLocalized('yomi_wan','Infiernos Yomi')], Xiaowan destaca incluso entre ellos por su odio. Su refugio está revestido con los cuerpos de pecadores y demonios desollados, esparcidos con la sangre y el tendón de los malvados, mientras ella espera en el centro, meditando sobre la maldad que está por venir.\n\nXiaowan es una de las primeras discípulas de Hon Li, y con diferencia la más competente y leal. Incluso sus recuerdos de la mortalidad fueron desollados por las arenas de los Mil Infiernos, y todo lo que ardía en ella era un odio inquebrantable hacia los demonios, el deseo de verlos sangrar y la fuerza de voluntad para enfrentarse incluso al [Glossary('Emperador Demonio','podgloss.demonemperor')] con los dientes apretados y la espada en la mano.\n\nElla no hace caso a la palabra de ancestros o señores; en su lugar, reúne a sus pantallas y discípulos en sus propias guerras, en sus propias purgas sangrientas contra la podredumbre que se abre paso en las Cortes.\nNo tiene nada, así que lo negará todo a los [Glossary('Reyes Yama','podgloss.yamaking')], tal como hicieron ellos con ella. Un Camino simple, brutal y directo para seguir. En realidad, el único que le queda.\n\nDestino futuro\nXiaowan mataría durante un tiempo a muchos [akuma|E], pero con la formación del Quincunx, sus audaces actos de violencia acabarían siendo demasiado temerarios y destructivos para que el Quincunx los tolerara.\nMientras que las primeras parejas de [Glossary('Wu','podgloss.wu')] enviadas tuvieron finales violentos, la veterana de la Guerra de Anda y antigua Ogro de los Guerreros de las Llanuras de Hebei Mapo puso fin a su herejía de una vez por todas."
 POD_persistentpodlore.desc.793468: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nPara que el experimento de la Aldea de las Tres Montañas funcione correctamente, debe haber alguna amenaza tras las leyes instituidas por Wang Ping. Una condenación muy presente que deben temer. Una razón para buscar una vida pacífica aunque sea aburrida.\n\nYouqiu está más que dispuesto a ser ese demonio.\n\nYouqiu era un nativo de la aldea, aunque uno que recurría habitualmente al bandidaje y a actos horribles de violencia. Incluso en su avanzada edad y tamaño, estaba muy ansioso por comandar a sus hijos en el saqueo de los pequeños lugares que abundaban, y vivió una vida larga y violenta gracias a ello, al menos hasta que una noche una chica regresó de entre los muertos y lo abrió en canal.\n\nCondenado al [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] de Lanka, se encontró en su elemento, sin que disminuyeran los estragos de la edad ni su crueldad. Devoró a numerosos Rakshasa y tomó a varios como esposas, hasta que una noche una Ravana finalmente se hartó de él y lo desterró de vuelta al mundo de los vivos, donde una antigua víctima y ahora maestra, su asesina, lo puso en cintura.\nLo que exactamente le hizo es desconocido, pero definitivamente salió peor. Se convirtió en su puño de hierro, el motor de terror y miedo para quienes se resistían a sus reformas. Y con los hijos y las vidas de los hombres que se resisten, y los cuerpos y ojos de las mujeres que desafían, no podría estar más feliz y contento.\n\nDestino futuro\nYouqiu sería bastante eficaz en su papel, quizás demasiado.\nEventualmente la aldea olvidó a sus monstruos a medida que estos obedecían, y tras la ausencia de Wang Ping, los otros cuidadores no vieron más razón para tolerar a un monstruo tan cerca de la danza hacia la condenación. Y así, fue atrapado en un cuenco de té de bronce, y los aldeanos descansaron tranquilos mientras sus últimos gritos los arrullaban en una noche olvidable."
 POD_persistentpodlore.desc.793469: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAunque se supone que los médicos deben curar en lugar de herir, tras su muerte, Zongmin se mantiene firme en seguir ese principio. Más bien, ahora comprende que curar a los malvados causará más daño que sanación, por lo que es la obligación del médico, cuando se le presente, curar el mundo extirpando la infección de su malidad en ese mismo instante.\n\nZongmin, en su vida mortal, era médico, condenado al infierno tras su muerte por perdonar y curar a un asesino en serie.\nEn el Infierno de los Pecadores del Mundo Al Revés, esa verdad se le grabó a golpes, tanto metafórica como literalmente, mientras era azotado y desollado con un látigo hecho con los dientes de las víctimas del asesino. Finalmente, aceptó la verdad y fue liberado del Infierno en ese momento, sin que mediara asunto alguno.\n\nZongmin, asimilando la revelación internamente, se mostró bastante desequilibrado en sus primeras noches, y fue enviado ante el Ancestro Hon Li para su educación.\nZongmin, disgustado por la inacción de las Cortes, aceptó muy bien su palabra y llegó a convertirse en uno de sus más ardientes y celosos discípulos. Eligió obedecer a los Vientos Ardientes devorando las almas de los asesinos y usando su energía para curar a los enfermos virtuosos. Equilibrando la balanza, por así decirlo.\n\nTiene mucho trabajo que hacer."
 POD_persistentpodlore.desc.793470: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nUno de los discípulos más enigmáticos de Hon Li, Yushi no pronuncia palabra alguna al seguir el camino de su mentor. Por escrito, ha dicho que es del Infierno de la Sal y el Hierro, y que sabe poco antes de eso. Pero por las cosas que aprendió allí, no puede tolerar la Presencia de las Cortes por algo que hicieron.\n\nHon Li no era de los que desprecian un regalo. La condición muda de Yushi se convirtió en algo que infundía temor entre sus discípulos, como una amenaza silenciosa siempre dispuesta a actuar en nombre de las órdenes de Hon Li, siendo al mismo tiempo un adherente radicalmente devoto de su camino.\nYushi llegaría a especializarse en asesinar a miembros caídos de las Cortes, algo que no provoca el fin de la furia de las Cortes principales, pero de lo que se han distraído debido a la creciente amenaza de los [Glossary('Anda','podgloss.anda')].\nAl no ser alguien que se quede de brazos cruzados, Yushi ha comenzado desde entonces a cazar a los lunáticos hedonistas de la creciente amenaza que proviene de la Corte del Fénix Escarlata. Si logrará progresar o no, está por verse..."
 POD_persistentpodlore.desc.793471: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nUna de las discípulas más jóvenes pero más fanáticas de Hon Li, Aiqin era bastante única entre los Muertos Hambrientos, ya que su propio Infierno era el vasto tapiz de los Mil Infiernos en sí mismos, en lugar de uno individual. Encadenada al Soberano Errante, este remodeló su memoria para convertirla en la de una oráculo. Y allí habría permanecido, si no hubiera previsto una ruptura en sus cadenas y luego la hubiera aprovechado para escapar.\nY de todos los mentores que podrían haberla encontrado, fue Hon Li quien la introdujo adecuadamente en el Mundo de la Noche.\n\nAiqin, sin embargo, ha conservado su capacidad oracular; tiene constantes destellos de sombras con bocas sangrientas y cuchillos levantados, y más allá de ellos, un trono carbonizado del que se alzaba un dios de sangre carbonizada.\nAiqin está convencada de que la figura pesadillesca podría ser el [Glossary('Emperador Demonio','podgloss.demonemperor')], e insiste en que deben estar preparados para oponerse a ellos.\nCon ese fin, Hon Li permite que Aiqin sea los ojos de su secta, vigilando a estos demonios. Y a medida que empieza a encontrar cada vez más información sobre los enigmáticos vampiros asesinos, sus temores se van haciendo realidad.\n\nDestino futuro\nAiqin acabaría siendo la fuerza principal que llevaría a la secta de Hon Li al Afganistán moderno, y sus visiones cobrarían aún más peso con el regreso de Ur-Shulgi.\nA medida que la Sexta Era se acerca, es posible que los Vientos Ardientes hayan encontrado a uno de los posibles [Glossary('Emperadores Demonio','podgloss.demonemperor')].\nPero, ¿estarán preparados? Aiqin no lo sabe, ya que todas sus visiones terminan antes de la batalla."
 POD_persistentpodlore.desc.793472: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nUmikana no recuerda mucho de su pasado. De hecho, no sabe realmente en qué se ha convertido. Tiene vagos recuerdos de morir, de un lugar terrible y luego de regresar para convertirse en un monstruo apenas consciente. No sabe cuánto tiempo permaneció en ese estado, pero teme que hayan sido décadas, si no más, antes de que su mente (apenas) lograra recomponerse.\n\nSu primer recuerdo tangible tras aquel lamentable estado fue ver un santuario dedicado a Amamikyu y a las sacerdotisas noro rezando allí. Tiene la sospecha de que pudo ser su salvación, quizás desbloqueando un recuerdo central de su pasado que le permitió sanarse un poco a sí misma.\n\nCualquiera que sea el caso, Umikana ha ido aprendiendo lentamente de su nueva condición desde entonces. También se ha encontrado con otros como ella, pero la mayoría estaban perdidos y eran monstruos sin mente como ella lo era. Todavía no sabe si debería acabar con su miseria antes de que dañen a otros o dejarles una oportunidad para salvarse, como hizo ella.\nHasta ahora, ha estado demasiado preocupada por su propio estado mental como para actuar, pero a medida que aumenta su comprensión, también lo hace la responsabilidad que siente de salvaguardar Ryukyu.\n\nDestino futuro\nCon la llegada de los chinos y, más tarde, de los japoneses, Umikana sabrá qué es. Las tensiones con los arrogantes forasteros serán constantes hasta que se proclame a sí misma como la Ancestra de Ryukyu para despreciarlos.\nAunque sus diligentes esfuerzos por mantener su isla independiente jugando con las Cortes entre sí serán suficientes por un tiempo, llegará un punto en el que el Bishamon japonés simplemente se hartará de la «falta de respeto de Okinawa»..."
 POD_persistentpodlore.desc.793473: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSuryawati es considerada la más antigua $pod_kueijin$ de las islas Maluku aunque, a decir verdad, sabe que esta historia fue escrita por los vencedores. Apenas había salido del infierno cuando la Corte del Fénix Escarlata hizo el primer contacto con las islas, consideró que el $pod_kueijin$ varón que gobernaba era «insuficiente», lo pasó por la espada y luego empezó a «civilizar» a los supervivientes según el [Glossary('Dharma','podgloss.dharma')] adecuado, incluyéndola a ella.\nSuryawati fue, francamente, una estudiante mediocre (aunque alegre), pero era una mujer nativa que no se resistía al Fénix Escarlata, lo cual fue suficiente para que ellos la nombraran Ancestra de las islas, regresaran a sus barcos y olvidaran prontamente a Maluku.\n\nSuryawati estableció su asiento de poder en Nusa Isa (la «Isla Madre») para cosechar el poco prestigio que pudiera y comenzó su gobierno, algo patético (y no deseado), sobre el número tan limitado de $pod_kueijin$ de su «dominio». No es de extrañar que se convirtiera en una gobernante indolente a la que la mayoría ni siquiera reconoce.\n\nMientras algunos de la generación más joven hablan de un cambio muy necesario, especialmente con la Corte del Fénix Escarlata demasiado desorganizada para intervenir, la verdadera amenaza reside más bien en la creciente presencia de [akuma|E] que aprovechan este gobierno laxo para prosperar.\n\nDestino futuro\nSuryawati sobrevivirá a la tormenta que supondrá la fundación de las Cortes Doradas siendo básicamente irrelevante. Perdiendo el poco poder temporal que le quedaba ante una nueva generación de gobernantes, se convertirá en una especie de curiosidad muy apreciada de las islas, una Ancestra benigna y agradable con muchas historias coloridas que contar."
 POD_persistentpodlore.desc.793474: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLa esposa de un pescador, Dara se lanzó al mar cuando supo que su amado no regresaría tras una terrible tormenta. Al encontrarse en el [UmbraGlossaryLocalized('yomi_wan','Inframundo Yomi')] de Hine-Nui-Te-Po para aquellos que mueren por suicidio en el Pacífico, se enfureció al ver que su acto de amor se volvió contra ella. Mientras el Inframundo esperaba que se hundiera en el autodesprecio, ella luchó en cada ocasión, logrando finalmente romper las barreras para regresar al mundo una vez más como un $pod_kueijin$.\n\nDara encontró la organización (o la falta de ella) de la Corte de Maluku como algo molesto en el mejor de los casos, y preocupante en el peor. Sus súplicas para una reestructuración y una acción decisiva contra la creciente amenaza de los [akuma|E] cayeron en saco roto y su paciencia se está agotando.\n\nDestino futuro\nDara será quien guíe a Piyau hacia Maluku al final de su purga. Entusiasmada por ver victorias tan claras por una vez, Dara abrazará las Flores de Sangre de la Pasión y se convertirá en la Reina Dorada de Ternate tras el ascenso de este poder regional.\nSin embargo, sus relaciones con las otras Cortes serán tensas, ya que Dara no impondrá el matriarcado con la misma crueldad que las otras Reinas; algunos dicen que es por sus recuerdos de su vida mortal. No obstante, esta reputación la llevará a atraer refugiados de otras Cortes e incluso a disfrutar de relaciones relativamente estables con los entrantes [Glossary('Ashirra','game_concept_ashirra_desc')] y, más adelante, con los $pod_cainites$ de Australia.\n\nPor tanto, no fue ninguna sorpresa que Dara se opusiera al ataque del Gran Salto hacia el Exterior contra Australia. Se convertirá en una espina clavada para Seok Kwan Sook, la líder de la invasión, y la situación se «estabilizará» en una Guerra Fría entre las dos poderosas Reinas."
 POD_persistentpodlore.desc.793475: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nAl no haber conocido nunca a su familia, Suryani se valió por sí misma hasta que no pudo más, muriendo de hambre, sola y olvidada. Sumergida en el [UmbraGlossaryLocalized('yomi_wan','Inframundo Yomi')] de Malaveyovo, lo que vio allí la cambió hasta la médula. Aunque nunca habla de lo que ocurrió exactamente, está claro que este es el catalizador de su afán por cazar a los [akuma|E].\n\nComo $pod_kueijin$, Suryani encontró una amiga atenta en Dara, una mujer que comparte su pasión por la justicia, aunque a veces rehúye algunas de las soluciones más extremas que propone. Sin embargo, Suryani no la culpa; después de todo, Dara no sabía lo que ella vio.\nNinguna de ellas lo sabía.\nSin que siquiera su amiga lo sepa, Suryani planea ahora destituir a «la Ancestral» Suryawati del poder, por la fuerza si fuera necesario. Los tiempos de los compromisos han terminado, si es que alguna vez existieron.\n\nDestino futuro\nSuryani no tendrá tiempo de poner en marcha su plan, ya que la purga de Piyau básicamente logrará lo que ella quería. Sin embargo, la formación de la Corte Dorada de Ternate bajo el mando de Dara causará una brecha entre las dos mujeres.\nSuryani se volverá más extrema y recriminará a Dara su laxitud hasta que se alcance un punto de ebullición cuando lleguen los holandeses y sus partidarios $pod_cainite$.\n\nAcusándolos de estar aliados con Malaveyovo y teniendo como motivo su repentino Resurgimiento, Suryani actuará por libre y llevará a cabo sus propios ataques contra ellos.\nEl ataque del Gran Salto hacia el Exterior contra Australia hará que lidere la Flor de Razor [Glossary('Wu','podgloss.wu')] durante las primeras batallas.\nLa firma de la tregua de Sídney y el estado de Guerra Fría resultante harán que Suryani vuelva a actuar por libre y su [Glossary('Wu','podgloss.wu')] se convierta en un elemento muy peligroso e impredecible en la tensa arena política de Australia."
 POD_persistentpodlore.desc.793476: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nComo [Glossary('Rey Yama','podgloss.yamaking')] de aquellos que participaron en el canibalismo o murieron de hambre, Malaveyovo suele recibir algunas almas especialmente miserables en su [UmbraGlossaryLocalized('yomi_wan','Inframundo Yomi')]. Anangga era una de ellas.\n\nEl propio hombre no sabe de dónde proviene realmente su gusto por la carne humana. Solo sabe que lo disfrutaba, y que lo disfruta aún más desde que entró al servicio de Malaveyovo. Aunque está lejos de ser el [akuma|E] más poderoso al servicio de su señor (ni siquiera él se atreve a acercarse a los corruptos cambiaformas tiburón que acechan alrededor de su amo), se considera una mente creativa. Aunque en vida no era un hombre especialmente sexista (cualquiera puede saber bien si se prepara adecuadamente), ha visto el ascenso de la matriarcal Corte del Fénix Escarlata y sus derivaciones aún más extremas como una oportunidad.\nTal vez estas mujeres agraviadas deseen saborear de verdad su victoria sobre los hombres miserables.\nTal vez incluso disfruten de la experiencia.\nSi lo hacen... bueno, él estaría encantado de compartir algunas recetas con ellas y luego presentárselas a su señor.\n\n¡Qué banquete será!"
 POD_persistentpodlore.desc.793477: "Este personaje fue creado por los desarrolladores de Princes of Darkness para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nDashi no es el [Glossary('Anda','podgloss.anda')] más hábil, carismático o poderoso que existe, lo que lleva a muchos a preguntarse por qué ha sido elegido para el prestigioso papel de Vanguardia Oriental de la horda en lugar de vampiros más famosos como los Vientos Negros. Por su parte, Dashi conoce perfectamente la razón. Es porque es prescindible.\n\nA pesar de haber sido vecinos durante mucho tiempo, los [Glossary('Anda','podgloss.anda')] saben alarmantemente poco sobre los $pod_kueijin$, ya que sus pocos encuentros han terminado en derrotas costosas.\nCon el ascenso de Gengis Kan y sus hermanos mongoles mortales asaltando ahora China, los tiempos están cambiando y surgen oportunidades.\n\nDashi sabe lo que se espera de él: aprender todo lo que pueda sobre los no-muertos de China, sondear sus defensas y dar la señal para lanzar la invasión cuando llegue el momento... si es que sigue vivo para entonces. Se le ha dado un amplio margen para seleccionar a los miembros de la vanguardia entre los otros jóvenes, prometedores (y prescindibles) miembros de los [Glossary('Anda','podgloss.anda')]. Ha aprovechado esto plenamente y ha creado un grupo hábil que ahora está aprendiendo lentamente más sobre los $pod_kueijin$.\nDemasiado lento para algunos de los Antiguos más impacientes, pero Dashi sabe que es su cabeza la que está en juego, no la de ellos. Así que será meticuloso, paciente y solo presionará para actuar si ocurriera algún evento cataclísmico en esta aparentemente invencible «Corte del Emperador Amarillo» de los no-muertos chinos..."
 POD_persistentpodlore.desc.793478: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nCuando Dashi empezó a reunir su Vanguardia Oriental, su hermano de sangre Ketuyu era una opción obvia. Los dos, aunque muy diferentes en su comportamiento, siempre trabajaron bien juntos. Dashi es un individuo más sombrío y retraído, por lo que es el alegre Ketuyu quien es el rostro de la Vanguardia para muchos. Es incluso el rostro de los [Glossary('Anda','podgloss.anda')] en su conjunto para los $pod_kueijin$.\n\nDe hecho, las habilidades diplomáticas de Ketuyu se han utilizado para infundir en las Cortes de los $pod_kueijin$ una falsa sensación de seguridad. El astuto [Glossary('Anda','podgloss.anda')] está encantado de rebajarse ante sus supuestos superiores para inducirlos a ignorar la creciente amenaza en sus fronteras. Ha tenido tanto éxito en ese empeño que sus tributos se han convertido en una marca de prestigio entre muchas Cortes, todas demasiado ansiosas por ver a extranjeros bárbaros arrodillándose ante su superioridad con baratijas lujosas y exóticas en las manos.\nY mientras se ríen y lo degradan en cada ocasión, Ketuyu aprende cada vez más sobre cómo piensan, cómo operan y, lo que es más importante, sus debilidades.\n\nAl igual que su hermano de sangre, Ketuyu es paciente y acepta cada insulto con una sonrisa. Dashi sabe que su hermano no olvida ni perdona, sin embargo.\nSi una noche los [Glossary('Anda','podgloss.anda')] llegaran a marchar sobre China, el $pod_kueijin$ al que menospreció podría darse cuenta finalmente del tono cruel y casi desquiciado que Ketuyu esconde cuidadosamente tras su agradable sonrisa..."
 POD_persistentpodlore.desc.793479: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\n$pod_Embraced$ fuera del linaje de Yesira, Saige se enfrentó a la desaprobación de los [Glossary('Anda','podgloss.anda')] Tradicionalistas desde el inicio de su existencia como no-muerta. Apenas teniendo en cuenta a su [Glossary('Sire','game_concept_Sire_desc')] que la $pod_Embraced$ como algo secundario, Saige huyó al Sur tan pronto como pudo, buscando libertad y el reconocimiento de sus habilidades.\nPronto aprendió a odiar a los $pod_kueijin$ chinos mucho más de lo que jamás odió a sus hermanos [Glossary('Anda','podgloss.anda')].\n\nExhibida como un animal exótico (e indomable) en las Cortes «iluminadas» de los $pod_kueijin$, pasó de una humillación a otra hasta que escapó una vez más. Regresó con los [Glossary('Anda','podgloss.anda')] justo a tiempo para que Dashi viera en ella un recurso útil para la Vanguardia Oriental, ya que su conocimiento (y odio) hacia los $pod_kueijin$ tenía pocos rivales entre los miembros más jóvenes de la horda. Recibiendo más crédito y respeto del que jamás obtuvo desde que se convirtió en vampiro, Saige aceptó con gusto, siendo la perspectiva de una venganza sangrienta un dulce extra.\n\nAunque el conocimiento de Saige ya ha demostrado ser útil para la horda, ella todavía los resiente y elige disfrazarse de hombre cuando trata con los [Glossary('Anda','podgloss.anda')] fuera de la Vanguardia Oriental. Por suerte, tiene poco o ningún contacto con ellos, y prefiere dejar que Dashi y los demás se encarguen de ellos en su lugar.\n\nA medida que pasan los años y la esperada invasión aún no ha comenzado, Saige está perdiendo la paciencia. Solo la perspectiva de ser reconocida por los Vientos Negros, o por la propia Yesira, la mantiene a raya.\nSi tiene que escalar una montaña de cráneos de $pod_kueijin$ para llegar allí, mejor." 
 POD_persistentpodlore.desc.793480: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nCuando se le encomendó la difícil tarea de dirigir la Vanguardia Oriental de los [Glossary('Anda','podgloss.anda')], Dashi supo lo que debía hacer y, gracias a la libertad que le concedía la misión, incluso pudo salirse con la suya. Para comprender a los $pod_kueijin$ chinos, necesitaba a un chino que le sirviera de espía.\nLe llevó meses localizar a un candidato adecuado, un bandido bastante menor, y ofrecerle la inmortalidad. Dashi necesitaba que su futuro espía le fuera completamente leal y, por eso, no le ocultó nada.\nDeyi aceptó y así nació el primer [Glossary('Anda','podgloss.anda')] chino.\n\nTras un tiempo para aclimatarse, el antiguo bandido fue enviado a una corte menor de los $pod_kueijin$ para interpretar el papel de un alma ingenua recién regresada del infierno. Aunque al principio Deyi no era el mentiroso más convincente, la sola imposibilidad de que existiera un $pod_cainite$ chino bastó para dar a su historia un aire de verdad. Y así comenzó su «educación» formal, en la que aprendió sobre los [Glossary('Dharmas','podgloss.dharma')], las Cinco Cortes Augustas, los [Glossary('Reyes Yama','podgloss.yamakings')] y mucho más.\n\nDeyi sabía que no debía tentar a la suerte y, cuando llegó el momento de asignarle un mentor como es debido, huyó y volvió con los [Glossary('Anda','podgloss.anda')]. Desde entonces se ha infiltrado en otras dos cortes y ha perfeccionado sus dotes de actor.\nSin embargo, a medida que crece su maestría, crece también su ambición. Mientras Dashi se mantiene evasivo, Deyi comprende ahora que nunca será aceptado del todo entre los [Glossary('Anda','podgloss.anda')], ni tampoco entre los $pod_kueijin$.\n\nPor eso sopesa sus opciones, plenamente consciente de que, por el momento, son bastante limitadas."
 POD_persistentpodlore.desc.793481: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo ampliaron para dar mayor profundidad al escenario.\n\nSeok Kwan Sook siempre fue una mujer ambiciosa que, de joven, soñaba con lograr hazañas espectaculares. Por desgracia, las normas de la época y su humilde origen hacían que solo el matrimonio con un comerciante en apuros pudiera ayudarla a ascender. Más triste aún, morir de parto truncó todavía más sus ambiciones.\n\nVarada en un [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] que la obligaba a revivir una y otra vez el trauma de su muerte, Seok decidió luchar y logró escapar. Su regreso como $pod_kueijin$ y sus primeras experiencias con las Cortes fueron momentos exultantes, pues su género ya no era un problema y parecía que, con estudio y diligencia, por fin podría lograr cualquier cosa.\nAhora, casi un siglo después, la luna de miel de Seok con su nueva condición quedó atrás hace mucho y comprende que ascender a la cima de una sociedad inmortal puede llevar literalmente una eternidad. Ahora vigila el debilitamiento de la Corte del Dragón Azul en busca de oportunidades para hallar algún atajo.\n\nDestino futuro\nSeok prosperará durante un tiempo en el caótico cambio de era, pero tendrá que retirarse durante la formación de las Cortes Verdes.\nAl enterarse de la formación de las violentas y fracturadas Cortes Doradas en el Sudeste Asiático, se unirá a la refriega y se labrará allí su propio feudo.\nLas demás [Glossary('Penangallan','podgloss.penangallan')] respetarán su habilidad, pero exigirán que se convierta en una de ellas antes de aceptarla.\nAsí lo hará y se convertirá en una reina respetada por derecho propio, con fuertes contactos en Corea.\n\nEsta posición culminará cuando sea elegida para dirigir el ataque de las Cortes contra Australia. Logrará sólidos éxitos iniciales dividiendo y conquistando a los $pod_cainites$ de allí, aunque la situación seguirá sin resolverse durante mucho tiempo."
 POD_persistentpodlore.desc.793482: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nGwang Hwa apenas era un hombre joven cuando el general Ajagae pasó por su pueblo para reclutar a los lugareños. Inspirado por el carisma del hombre, su humilde origen y su aparente voluntad de ayudar a la gente, Gwang Hwa se alistó en el acto.\nTal trepidación le sirvió de poco cuando recibió una flecha en la cara durante su primera batalla.\n\nEn el caótico [UmbraGlossaryLocalized('yomi_wan','Inframundo Yomi')] de Lanka, Gwang Hwa presenció y participó en más guerras de las que desearía en varias vidas, y cada una de esas batallas fue en vano. Finalmente fue desechado cuando su espíritu se agotó por completo y resultó inútil para los demonios en guerra.\n\nComo $pod_kueijin$, Gwang Hwa se reconstruyó y encontró consuelo en las estrictas normas que regulaban las Cortes. El hecho de que el general Ajagae pasara a ser apenas una nota histórica también terminó por extinguir su último vigor juvenil. Gwang Hwa se convirtió en un estudiante ejemplar, y luego en un respetado miembro de los tradicionalistas que aceptaban la intromisión de la Corte del Emperador Amarillo chino en los asuntos de Corea.\n\nGwang Hwa está cansado de los conflictos y las disputas, pero no es ningún tonto. El control del poder del emperador Xiao es, en el mejor de los casos, inestable, y los actuales tiempos turbulentos podrían crear grandes problemas para Corea. Por ello, recientemente ha empezado a cambiar su postura hacia una posición más central, intentando actuar como mediador entre las diversas facciones.\n\nDestino futuro\nGwang Hwa resultará ser fundamental en el ordenado cambio de la Corte del Dragón Azul a las Cortes Verdes. Actuando como una voz de razón y careciendo de la voluntad de tomar el poder para sí mismo, ayudará en la reorganización pacífica antes de convertirse en un respetado Ancestro regional.\nSin embargo, su falta de voluntad para tomar medidas directas y su actitud conciliadora en general jugarán un papel importante en la reputación de las Cortes Verdes como un refugio seguro para muchos personajes de dudosa reputación."
 POD_persistentpodlore.desc.793483: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nElegida para ser una de las Wonhwa, las mujeres guerreras de la Corea del siglo VI, Ji So asumió su papel con orgullo y llegó a dominar tanto el arco como la espada. La disolución del grupo, avergonzado antes incluso de pisar un campo de batalla, fue un golpe para ella, y decidió convertirse en guerrera errante para ayudar a la gente.\nPronto aprendió que aquello funcionaba mejor en las historias: su destreza no fue rival para bandidos muy superiores en número y sufrió una muerte atroz.\n\nEl Infierno de Ser Desollado Vivo no fue amable con Ji So. Comprobó que su habilidad marcial no bastaba para vencer a los numerosos demonios y tuvo que recurrir a artimañas para escapar. Conserva en el fondo de su mente la inquietante intuición de que quizá la dejaron marchar.\n\nComo $pod_kueijin$, Ji So se sintió atraída de forma natural hacia los Tigres Diablo y volvió a afinar sus habilidades, aunque la falta de amenaza [akuma|E] en Corea hizo que, una vez más, todo quedara sobre todo en la teoría. Con el paso de los siglos su reputación creció y recibió el honor de ser elegida guardaespaldas del Emperador Dragón Azul. Aunque sin duda se sintió halagada por el ofrecimiento, Ji So no pudo librarse de la sensación de que aquello significaba que volvía a quedar relegada a ser una guerrera ceremonial.\nMientras la Corte del Dragón Azul se debilita y las tensiones con las Cortes china y japonesa aumentan, Ji So espera en secreto que por fin llegue el momento de demostrar su valía en un campo de batalla.\n\nDestino futuro\nLa transición pacífica hacia las Cortes Verdes volverá a frustrar a Ji So. Aunque muchos Ancestros solicitarán sus servicios, ella rechazará todas las ofertas y abandonará la escena política.\nLas leyendas dirán que regresó al [UmbraGlossaryLocalized('yomi_wan','Infierno de Yomi')] para luchar contra [Glossary('Tou Mu','podgloss.toumu')]. Otros rumores, más oscuros, cuentan que la han visto junto a las fuerzas de la Emperatriz de Hierro..."
 POD_persistentpodlore.desc.793484: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nNacida durante la época del «Protectorado General para Pacificar el Este» que la Dinastía Tang impuso sobre Corea, Bo Hui llegó a ver su presencia como una muestra de las complejidades de la fuerza y la debilidad. Aunque no participó directamente, escuchó atentamente las noticias políticas del día y llegó a sus propias conclusiones. Su muerte, resultado de que las autoridades descubrieran su «intromisión», solo reforzó sus nuevas creencias.\n\nBo Hui no habla de lo que tuvo que hacer para escapar del Pozo de Sal y Hierro, pero está claro que no se enorgullece de ello. En su lugar, se lanzó de cabeza a la política de los $pod_kueijin$, algunos dicen a expensas de su Iluminación personal, y jugó el juego tan pronto como pudo.\nLa situación de que la Corte del Dragón Azul esté dominada por intereses chinos le recuerda su vida mortal y, aunque no tiene convicciones profundas sobre la independencia de las Cortes coreanas, eligió apostar por esta carta y se convirtió en la cabeza de la facción de la oposición.\nAunque sus éxitos en este cargo han sido escasos, el clima político actual parece preparado para darle nuevas oportunidades a medida que las Cortes muestran sus primeros signos de debilidad.\n\nDestino futuro\nBo Hui será vista como la «ganadora» de la transición hacia las Cortes Verdes. Como líder de la facción coreana, logrará la independencia pacífica de China y cortará los lazos con Japón.\nLa verdad es que podría haber presionado para conseguir mucho más, pero la perspectiva de gobernar como una «Emperatriz Verde» le atraía poco. Le sentaba mucho mejor que las divididas Cortes Verdes se convirtieran en un cruce de caminos neutral «gobernado» débilmente por un consejo de Ancestros.\n\nNo hay diversión en jugar al juego si ya has ganado después de todo."
 POD_persistentpodlore.desc.793485: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nYeong Chang, gracias a su pasado como encargado de las finanzas de un respetado $pod_kueijin$, siempre supo que el Infierno era muy real. Pero ni siquiera su viva imaginación bastó para prepararlo para él.\n\nEscarmentado por un rival de su amo, Yeong se vio en el Infierno de Ser Desollado Vivo, y los horrores que soportó allí lo quebraron. Tras prometer que haría lo que fuera por ser liberado, los demonios lo dejaron marchar con la advertencia de que, tarde o temprano, vendrían a cobrar.\n\nComo $pod_kueijin$, Yeong vive movido por el miedo a volver a [UmbraGlossaryLocalized('yomi_wan','Yomi')], y por eso empezó a valerse de su fino olfato para las oportunidades financieras con el fin de ganar aliados, granjearse favores y, en suma, hacerse tan útil como fuera posible para no crearse enemigos. Actualmente invierte en el naciente mercado del jade ritual, algo que podría abrirle nuevos clientes fuera de Corea.\n\nDestino futuro\nYeong prosperará en las futuras Cortes Verdes, e incluso tendrá parte en su bautizo, pues su mercado de jade ritual despegará más allá de sus sueños más descabellados.\nPara sorpresa de muchos, Yeong no se hará realmente rico con su comercio, ya que sus precios siempre estarán por debajo de lo esperable. Por su parte, el «padre del jade» se reirá de tales inquietudes y dirá que solo busca nuevos amigos, no nuevos clientes.\n\nSin embargo, cada vez que alguien nuevo entra en su dominio, se ve a Yeong sobresaltarse un instante, como si aguardara con pavor a un cliente sin cita previa..."
 POD_persistentpodlore.desc.793486: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nRuhui es un hombre que conoce su valor. Aunque algunos dirían que su vida mortal como el hijo menor de un clan de la nobleza le dio una visión inflada de sí mismo.\n\nComo $pod_kueijin$, Ruhui quería el camino más rápido hacia la relevancia y, por ello, su molesto mentor lo dirigió a la Sociedad del Derrocamiento del Diablo, el grupo de jóvenes inmortales destinados a mantener bajo control las Cortes en decadencia (o acelerar dicha decadencia en algunos casos).\nAprovechando esta oportunidad, Ruhui puso sus ojos en Corea del Norte, donde la autoridad de la Corte del Dragón Azul se había debilitado debido a los disturbios en P'yong'yang; Ruhui lideró una banda de otros descontentos y se labró su propio feudo en la zona.\nAunque esto podría haberse visto como un acto de guerra entre la Corte del Emperador Amarillo de China y la Corte del Dragón Azul de Corea, el hecho de que Ruhui actuara bajo el estandarte de la Sociedad del Derrocamiento del Diablo le otorgó inmunidad política y su toma de poder se convirtió en un hecho consumado.\n\nRuhui está ahora reuniendo sus fuerzas para marchar sobre la propia P'yong'yang, ya que su nuevo Ancestro también es considerado un advenedizo y es poco probable que reciba ayuda de las Grandes Cortes.\n\nDespués de eso... bueno, si toda la Corte del Dragón Azul necesita ser derrocada para dar paso a una nueva era, Ruhui está listo para ser el hombre que la inaugure. Y para terminar en la cima.\n\nDestino futuro\nDurante la creación de las Cortes Verdes, Ruhui intentará que la situación caiga en el caos. Una noche recibirá una advertencia de no hacerlo por parte del ser conocido como Marioneta de Sombras.\nTras ignorarla, y en la noche que precede a su llamado a las armas, se encontrarán las cenizas de Ruhui esparcidas sobre la carta de advertencia."
 POD_persistentpodlore.desc.793487: "This character was created by PoD Developers to add greater depth to the setting and is not an official part of the $pod_wod$.\n\nA long time ago, Tokiko had the dubious honor of being one of the first souls imprisoned by a young and ambitious [Glossary('Rey Yama','podgloss.yamaking')], [Glossary('Mikaboshi','podgloss.mikaboshi')]. The demon, in a way, was much more open about his goals in these formative years and Tokiko saw it all, the soulless grind of a maddening society that would twist humanity to become no more than tools in his hands. She swore to fight it with all her being and never wavered in this promise still.\n\nAs a $pod_kueijin$, Tokiko progressed quickly, becoming a respected Bishamon Ancestor and even the Japanese representative to the Azure Dragon Court several times. Her diligence at hunting down [akuma|E] was highly praised and she took to the field herself many times. Many demon hunters of the Bishamon still use her tactics, though none would admit it openly nowadays.\n\nDespite these victories, Tokiko saw signs of [Glossary('Mikaboshi','podgloss.mikaboshi')]'s rise everywhere. The growing cities, the new inventions and philosophies invented by humanity were insidious tools of the enemy to her. When she uncovered that [Glossary('Mikaboshi','podgloss.mikaboshi')] had ensnared a powerful group of strange creatures to his bidding, she alerted the entire courts and rallied every ally she could.\n\nIt ended in a wild goose chase, these creatures were slippery and besides the name «Kagaseo», Tokiko had nothing to show for her work.\nShe didn't stop however, and soon isolated herself in what others thought were a growing paranoid madness. It was when she finally confirmed the existence of the «Great Clan» but could not confront them on her own that she took the most critical decision of her life.\n\nThe next night, Tokiko entered [Glossary('Kakuri','podgloss.kakuri')] and was received with respect and honors by [Glossary('Emma-o','podgloss.emmao')] himself.\n\nThis night, the «Daimyo of the Dark» gained his most fanatic and devoted [Glossary('Shikome','podgloss.shikome')] and he didn't even have to lift a finger."
 POD_persistentpodlore.desc.793488: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nHubo un tiempo en que el Juez del Equilibrio, Yen-Lo, presidía las almas de los justos y compasivos. Los demás [Glossary('Reyes Yama','podgloss.yamaking')] veían su conducta honorable como una afrenta, pues codiciaban las muchas almas que podrían corromper en el reino de Yen-Lo. Así, encabezados por [Glossary('Emma-o','podgloss.emmao')], invadieron su territorio y lo abatieron. Pero el triunfo que esperaban duró poco: Yen-Lo había dispuesto un seguro que se activaba con su muerte, y todos fueron arrojados fuera de su reino, que se selló para siempre.\n\nEscapando a duras penas de la prueba, [Glossary('Emma-o','podgloss.emmao')], furioso por no tener nada que mostrar de su victoria, advirtió que, en el fugaz instante entre la muerte de Yen-Lo y el cierre de su reino, algunas almas desafortunadas se habían dispersado.\nSiguiéndoles la pista, solo pudo capturar una, y era el alma más dulce que había visto jamás. Al fin y al cabo, Yen-Lo daba cobijo a los bondadosos y compasivos, y la verdadera pureza era un espectáculo muy raro.\n\nAislado en las profundidades de Kyuken no Kakuri, [Glossary('Emma-o','podgloss.emmao')] no emergió hasta terminar, acompañado de aquella a la que llamó Kiyoko, la primera de sus [Glossary('Shikome','podgloss.shikome')].\n\nDesde entonces, todas las Shikome han sido modeladas a imagen de Kiyoko: calladas, sin emociones y de una astucia gélida. Sin embargo, ninguna supera de verdad a la que Emma-o considera su obra maestra, muy probablemente por lo que él llama el «material de origen»: la pureza del alma original.\n\nUna noche, cuando se convierta en el [Glossary('Emperador Demonio','podgloss.demonemperor')], Emma-o sabe que podrá romper el sello de Yen-Lo y por fin dispondrá de los medios para crear un ejército de [Glossary('Shikome','podgloss.shikome')] más poderosas y perfectas que lo sirvan durante la eterna Sexta Era..."
 POD_persistentpodlore.desc.793489: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nSi bien [Glossary('Kakuri','podgloss.kakuri')] es un paisaje desolado y espantoso para la mayoría de las almas torturadas allí, este no es el caso de las personas de ascendencia Ainu. Incluso hoy en día, [Glossary('Emma-o','podgloss.emmao')] se toma muy en serio su papel como dios de los muertos Ainu, y por ello son tratados con respeto y cuidado antes de ser guiados al Inframundo de sus ancestros, donde los justos y compasivos entre ellos pueden esperar una vida después de la muerte pacífica. A veces, sin embargo, un alma se resiste a esta oferta. Tal fue el caso de Pirka.\n\nEsta mujer, sintiéndose inquieta incluso en la muerte, eligió vagar por el Señorío en lugar de aceptar su recompensa. No tardó mucho en ver que [Glossary('Emma-o','podgloss.emmao')], aunque respetuoso con su pueblo, se ha vuelto loco y corrupto más allá de toda razón respecto a todo lo demás. Protegida por su inmunidad como Ainu, entró en su dominio y le exigió respuestas.\n\nAunque sorprendido, [Glossary('Emma-o','podgloss.emmao')] mostró paciencia, una preocupación casi paternal, y escuchó. Y entonces le lo contó todo. La lenta muerte de su pueblo, las realidades locas de los otros [Glossary('Reyes Yama','podgloss.yamaking')], el descuidado e indiferente [Glossary('Augusto Personaje de Jade','podgloss.augustpersonageofjade')]. Pirka comprendió, pero no estuvo totalmente de acuerdo y se negó a que Emma-o la escoltara al Inframundo Ainu. En su lugar, eligió entrar en su servicio.\n\nAl regresar como un [akuma|E], la relación de Pirka con Emma-o ha sido complicada desde entonces. Ella espera servir como su brújula moral mientras él asciende al trono del [Glossary('Emperador Demonio','podgloss.demonemperor')]. El [Glossary('Rey Yama','podgloss.yamaking')], por su parte, se debate sobre cómo actuar con ella y hasta ahora le ha dejado hacer lo que quiera, aunque siempre con un grupo de [Glossary('Shikome','podgloss.shikome')] cerca para asegurar su protección."
 POD_persistentpodlore.desc.793490: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nIeko estuvo enfadada toda su vida. Enfadada por ser llamada fea cuando era joven. Enfadada por verse obligada a un matrimonio sin amor con un viejo Bruto. Enfadada porque fue ejecutada por defenderse de él.\nNi siquiera la muerte le trajo la paz, ya que estaba destinada al [Glossary('Kakuri','podgloss.kakuri')].\n\nAl aliarse con otras almas perdidas en este reino oscuro, pensó por un momento que la huida era posible hasta que el grupo se encontró con su primer [Glossary('Shikome','podgloss.shikome')] y los hombres se volvieron instantáneamente contra ella por «amor» a la criatura. Abandonada a pudrirse en la arena desolada, se habría rendido de no ser por la intervención de Jizo-Bosatsu.\n\nEl extraño y amable anciano la ayudó a levantarse y le enseñó los caminos del mundo, los [Glossary('Reyes Yama','podgloss.yamaking')], su potencial para regresar como una $pod_kueijin$ y la Iluminación que podría alcanzar allí. Ieko escuchó, pero también notó que el viajero estaba asustando a los [Glossary('Shikome','podgloss.shikome')] e incluso al propio [Glossary('Emma-o','podgloss.emmao')]. Esta era la parte que más le interesaba.\nSin embargo, Jizo guardó silencio sobre la verdad del asunto, lo que molestó mucho a Ieko. Aquí había un gran ser con el aparente poder de arreglar las cosas, ¿y cuál era su objetivo en su lugar? Instruir a las almas perdidas para que siguieran un camino largo y arduo que «podría» llevar a algo bueno al final.\n\nSu relación nunca se recuperó realmente tras este desencuentro; Ieko nunca vio sentido en evitar la acción directa que podría ayudar a las cosas ahora, en lugar de hacerlo siglos en el futuro. Al final, tomaron caminos distintos, pero no antes de que Jizo le mostrara un medio para escapar.\n\nIeko permaneció allí mucho tiempo, mirando la puerta al mundo exterior y, aparentemente, los siglos de agotadora Iluminación Dhármica que le aguardaban, muy probablemente con el estigma añadido de ser una recién llegada. Al final, se dio la vuelta y entró en el castillo de Emma-o, Kyuden no Kakuri.\n\nCuando emergió, la más joven de las [Glossary('Shikome','podgloss.shikome')] estaba lista para tomar medidas decisivas por su señor."
 POD_persistentpodlore.desc.793491: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nPara alguien que afirma ser un dios, el Muerto Hambriento que ahora se hace llamar Hari realmente no tiene apariencia de tal. Y en el consejero, curtido por el sol y físicamente débil, que suele esconderse en la sombra de Indra-gha, no hay una mente más temible al mando de la Tribu Celestial.\n\nHari nació en el Reino de Chutia y, desde su nacimiento, su extraño físico fue considerado ominoso. Pálido, anémico y, a lo largo de su vida, apenas apto para el trabajo, no obstante, resultó ser asombrosamente inteligente desde una edad temprana, capaz de realizar matemáticas avanzadas y estudios religiosos desde muy joven. Sus padres, deseando que tuviera algún grado de ascenso como terratenientes menores, lo enviaron a estudiar al mahavihara de Nalanda con la esperanza de que tuviera la oportunidad de hacer algo grande.\nEstudió allí y le apasionó enormemente, poseyendo una gran mente para las ciencias, las artes y las religiones, pero trágicamente, cuando regresaba a casa, murió una noche mientras, al despertar fuerzas que yacen latentes en todos los mortales, era arrasado por un rayo de su propia creación, y fue condenado al Infierno de la Magia Malvada. Y en ese Infierno, se volvió amargado. Furioso. Condenado como mago cuando solo había sido uno durante apenas un minuto, una chispa diferente se encendió en él.\nSe abrió paso a zarpazos fuera del Infierno como un fantasma, hasta que finalmente regresó a la vida y fue encontrado por la Tribu Celestial. Y, al oírles explicar las cosas, al menos tuvo una causa. Y a alguien a quien culpar.\n\nHari es una de las pocas personas en el mundo con educación superior, inteligencia, determinación y la mentalidad para lograrlo. Demasiado débil físicamente para enfrentarse directamente a la mayoría de las amenazas, ha perfeccionado la guerra sutil hasta convertirla en un arte. Siendo aún joven, es un artista de la mentira, distante ante el dolor que inflige, y lo suficientemente sabio como para saber cuándo ser humilde; podría llevar a la Tribu Celestial a nuevas alturas.\n\nDestino futuro\nHari progresaría rápidamente en el [Glossary('Dharma','podgloss.dharma')], como el Dios que despeja la oposición a la Tribu Celestial, pero sin extralimitarse nunca. Eventualmente superaría a su mentor Indra-gha en Dharma, pero desapareció poco después de la Semana de las Pesadillas.\nVe un último gran obstáculo para el ascenso de la Tribu Celestial, y su papel es despejarlo. Así que desaparece, preparándose para cuando la Tribu Celestial se enfrente al [Glossary('Emperador Demonio','podgloss.demonemperor')]."
 POD_persistentpodlore.desc.793492: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nLos Godlings son bien conocidos por la diversidad de colores y estilos de vida que poseen entre sus miembros. Aunque, ciertamente, incluso para ellos, Prajapati es un poco... excéntrico.\n\nNo está claro quién era antes de ir a los [UmbraGlossaryLocalized('yomi_wan','Mil Infiernos')]. Pero terminó en el Infierno de los Pecadores al Revés. Allí, al abrazar su manía y confusión, logró ser expulsado, ya que el Infierno, por naturaleza, no da la bienvenida a quienes se han acostumbrado a él.\nAsí, mientras arrasaba por el centro de la India como un Muerto Hambriento feral, los Godlings encontraron a este hijo de Sita y lo integraron en su círculo. Pero incluso a través de su educación, nunca quedó claro qué aspecto de la Devi encarna. Para complicar las cosas, el nombre que tomó, Prajapati, podría aplicarse a Brahma... pero también a Vishvakarma, Agni, Indra, Daksha y a numerosas otras entidades.\nY dado que parece desviarse salvajemente de a cuál de ellos está más cerca en cada momento, hacer una comparación directa es, como mínimo, un dolor de cabeza.\n\nAl menos, su familiaridad con el Infierno de los Pecadores al Revés, aunque le ha dejado innegablemente «diferente», lo convierte en un verdadero sabio de los mundos más allá de la Tierra, y sus enseñanzas son, como mínimo, iluminadoras.\n\nCuando se pueden comprender, al menos."
 POD_persistentpodlore.desc.793493: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\n¿Qué serían los dioses si no tuvieran la apariencia adecuada? Ser como Dioses en todo sentido es un principio fundamental de la Tribu Celestial. Y en lo que respecta a la armería y la moda, no es diferente. Y para ayudarles con ello, Tvashtr está encantado de encargarse de la forja.\n\nTvashtr siempre fue un artesano. En su vida mortal incluso idolatró a su homónimo cuando leyó sobre él en el Mahabharata. En todas esas cosas, eso es lo que deseaba ser.\nAsí que siempre se estuvo exigiendo más y más en esas artes. Entre fabricar armas y fabricar joyas, se esforzaba constantemente por ser cada vez mejor. Y un día, su trabajo resultó ser fantástico, cuando uno de sus antiguos clientes le separó la cabeza de los hombros, enviándolo al Infierno de ser Desollado Vivo.\n\nNo puede recordar su escape, pero Tvashtr está eternamente agradecido con los Godlings que lo salvaron. Ahora está seguro de su [Glossary('Dharma','podgloss.dharma')], creyendo con todo su corazón que su adoración anterior a Tvashtr significaba que eran uno y el mismo. Para él, tiene todo el sentido del mundo.\nY ahora, entre los Godlings, pocos son tan fieles a su Camino como el Maestro de las Forjas."
 POD_persistentpodlore.desc.793494: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nCuando Chitrangada despertó en los [UmbraGlossaryLocalized('yomi_wan','Mil Infiernos')], estaba segura de una cosa: no pertenecía a este lugar. Pero como una de las muchas consortes de Ravana, tenía poco que decir al respecto.\n\nChitrangada no recuerda su vida mortal en absoluto y, por lo que puede recordar, su vida comienza en el castillo de Ravana, seleccionada como una de sus consortes. Mientras que muchos otros en esta situación horrorosa sucumbieron a la desesperación o a la codicia, convirtiéndose en Rakshasa, Chitrangada fue una de las que se negó a sucumbir por completo; en su lugar, supo jugar bien sus cartas, aferrándose a todo el alma que pudo.\nY por eso, una noche, cuando el Muerto Hambriento conocido como Hanuman estaba en uno de sus habituales arrebatos por la Ciudad Demonio, la encontró a ella, una consorte que no se rendía ante Ravana. Al ver en ella una divinidad que la Tribu Celestial apreciaba, la rescató y la trajo a la Tribu Celestial para recibir una educación adecuada.\n\nDesde entonces, Chitrangada ha encarnado esto, presentándose como una Diosa de la Fuerza de Voluntad, el Trauma y la Humildad. Y por encima de todo, es una de las Caras de los mayores detractores de la Diosa.\nLa idea de que eran malvados es fundamentalmente falsa, ya que ella nunca hizo nada malo. Su historia comenzó en el Infierno. Así que que afirmen que merecía ese destino es un insulto. Por ello, ella los lidera en ese sentido, siendo la principal oponente de su doctrina y la primera entre las defensoras intelectuales de la Tribu Celestial."
 POD_persistentpodlore.desc.793495: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSurpanakha, antes de morir, era una Ghoul de un Ravnos verdaderamente antiguo. Aunque afirmaba ser la hermana de Ravana, se convirtió en Ghoul para servirle en la inmortalidad, sus afirmaciones no pueden probarse. Al menos, era una tejedora de artes arcanas y magias terribles, la mano ensangrentada del antiguo monstruo, alimentándose de su sangre a cambio de un servicio inmortal.\n\nFue un Azote para los primeros Muertos Hambrientos de la India, una terrible mano de justicia, una infernalista de gran Renombre y una bruja de poder terrible. Al menos, hasta que fue finalmente asesinada por Hanuman. Mientras muchos pensaron que ese sería el fin de todo, de una forma extraña, resultó ser simplemente un nuevo comienzo, ya que en la muerte aprendió el verdadero precio del servicio infernal en Lanka.\n\nRugiendo contra la traición de su hermano, los antiguos Hechizos que se desvanecían se convirtieron en el medio de su liberación, y Hanuman la encontró una vez más revivida en el mundo de los vivos. Subyugándola y civilizándola, le dio un ultimátum: ser una Diosa o ser un Demonio. Ella eligió ser ambas.\n\nEntre los Godlings, pocos conocen lo que ella afirma, y menos aún lo creen. Al menos, ella parece estar totalmente convencida de que es verdad. Y con ese fin, ella es su monstruo. La cosa que desatan cuando toda esperanza se ha perdido, para recordar a otros contra qué existe la bondad.\nY aunque está más controlada, no es menos violenta ni indulgente. Al menos escucha y actúa contra las fuerzas que está convencida de que la traicionaron.\n\nDestino futuro\nAunque sus orígenes exactos nunca llegarían a probarse de forma concreta, cuando la Guerra Eterna se restaure al unirse una vez más Chandraputra y Hazimel, Surpanakha, tan antigua como es, entrará en un ataque maníaco de Furia y terror, abriéndose paso a zarpazos hacia los dominios de los Ravnos que luchan tras la Semana de las Pesadillas, antes de desaparecer en Lanka.\nNo se sabe qué será de ella."
 POD_persistentpodlore.desc.793496: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nGayatri prefiere evitar la grandiosidad, ya que la escala de los juegos de Ancestros y Príncipes es tan vasta que le cuesta comprenderla realmente. Sabe lo que es y lo que aspira a ser. Y eso es suficiente para ella.\n\nGayatri nació, creció, vivió y murió en una pequeña aldea a lo largo de la mitad sur del río Brahmaputra. Desde su nacimiento hasta su muerte, la vida siguió su curso como siempre lo había hecho. Al estar relativamente apartada y alejada de las grandes guerras de la época, estaba preparada para una vida sin incidentes. Creció, se casó, tuvo una familia, cuidó de sus medios como agricultora y luego falleció siendo anciana; y a través de su vida, estuvo satisfecha. Fue feliz con ello.\n\nPor eso despertar en el Reino de la Noche fue tan desorientador. Pero, al menos, recordaba las reglas de la vida mortal, siguió los ríos y, finalmente, a través de ellos y, en ocasiones, guiándose únicamente por el sonido del agua chapoteando contra el lecho de un río, encontró el camino de vuelta al mundo de los vivos, pero ahora existe toda una sociedad de monstruos y deidades menores que dicen que es una Diosa.\nY aunque al menos puede comprender que el poder que posee es divino, que sus contemporáneos pretendan ser aspectos encarnados de seres tan elevados como Indra o Shiva no le sienta precisamente bien.\n\nGayatri, en lugar de desafiar esto, ha optado por regresar a su hogar. Centrando un pequeño culto en torno a ella, se siente perfectamente satisfecha y feliz de protegerlos, de guiarlos y de ser su diosa protectora. Eso es suficiente para ella.\n\nSolo el tiempo dirá si tiene el lujo de mantenerse pequeña."
 POD_persistentpodlore.desc.793497: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nMientras que la mayoría de los Fénix Nacientes persiguen su [Glossary('Dharma','podgloss.dharma')] protegiendo a su familia biológica, el [Glossary('Dharma','podgloss.dharma')] se centra principalmente en la comunidad y el parentesco, algo en lo que la sangre no es una necesidad. Civatêvi estuvo entre los primeros Fénix en las Cortes del Trueno Infinito en encarnar verdaderamente este principio.\n\nCivatêvi siempre vivió en los márgenes de la sociedad. Al crecer sintiéndose fuera de lugar siendo un chico, se sintió atraída desde temprano por los diversos Aravanis e Hijra que pasaban por la ciudad donde vivía. Sin embargo, sus padres no aceptaron esta «fase» e intentaron presionarle para que la abandonara. Pero ellos fueron mucho más acogedores con ella de lo que su «familia» llegó a serlo.\nPero, en definitiva, habría significado poco, ya que Civatêvi murió más tarde durante una disputa por un pago y, debido a su proximidad a una trabajadora sexual cuando murió, acabó en el Infierno de Sal y Hierro. Pero a diferencia de tantos otros, las torturas del Infierno de Sal y Hierro, de una forma extraña, terminaron por hacerla realizarse plenamente.\nAl alcanzar su autorrealización, su escape fue inevitable, ya que se entregó por completo a su ser perfeccionado, logró salir mediante el encanto y tomó su segundo aliento.\n\nDesde entonces, Civatêvi se ha conectado más estrechamente con las comunidades indias que existen fuera de los límites normales de la masculinidad y la feminidad, y en la protección de quienes transitan por esos umbrales. Siente que ellos son su familia y, por ello, hace todo lo posible por ayudarlos. Y mientras la Guerra Eterna arrecia, todo el mundo necesita protectores."
 POD_persistentpodlore.desc.793498: "Este personaje forma parte del $pod_wod$, pero solo cuenta con un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nThratri ha sido siempre la aliada más antigua de Ravana. Hace mucho, muchísimo tiempo, cuando los pueblos protoindoeuropeos se separaron y los que llegarían a la India iniciaron sus conquistas, Thratri estaba allí, hija única de un general al servicio de un conquistador. Nacida en campaña, criada entre soldados y crecida a lo largo de una conquista, Thratri solo había conocido la guerra.\nY cuando el señor de su padre cayó bajo la mirada de un dios de sangre, ella marcharía con su ejército hacia la noche, primero como Ghoul y más tarde como la primera progenie de un hermano de sangre del conquistador. Entonces Thratri empezó a comprender. Y siguió a su [Glossary('Sire','game_concept_Sire_desc')], a quien llegaría a ver como un padre por el poder que le había dado, hasta la condenación.\n\nCuando Ravana traicionó al resto de los Ravnos, no fue solo su propio poder lo que le dio la victoria. Chandraputra era un general casi sin igual y más antiguo que Ravana. Por grandes que fueran las artes infernales de Ravana, los ejércitos de Chandraputra lo habrían arrollado de no ser por Thratri, que comandaba sus fuerzas.\n\nThratri había nacido y se había criado en el campamento de Chandraputra y se había formado en su forma de hacer la guerra. Desde su $pod_Embrace$, Ravana le había ordenado moldear sus propias estrategias de batalla con el único fin de contrarrestar a Chandraputra. Así, cuando Chandraputra llegó para aplastar a su traicionero hermano de sangre, Thratri entró en acción y lideró sus fuerzas infernales y sus huestes demoníacas contra él con estratagemas hechas a medida para neutralizarlo, muy distintas de las de los Condenados o los Asesinos de Sangre.\nSus campañas de contención bastaron, y Ravana se convirtió en un [Glossary('Rey Yama','podgloss.yamaking')]. ¿Y la recompensa de Thratri? Un asesinato violento y humillante: despojada de todo, descuartizada con cuantas armas conocían, muerta de hambre, empalada y prendida en llamas mientras los demonios la golpeaban hasta la muerte. La condenaron a la recién nacida Ciudad Demonio como su primera pecadora y su primera Raksha.\n\nThratri nunca perdonó a Ravana por ello. Le gustaba ser vampira. Odiaba su nuevo estado de monstruo Asuratizayya.\nPero su padre era ahora un Rey Demonio. Tenía que esperar su oportunidad. Al fin y al cabo, ella había levantado su imperio.\n\nY reclamaría su herencia.\n\nDestino futuro\nThratri esperaría milenios, incluso más allá del declive de la Ciudad Demonio. En las noches actuales, va cobrando fuerza poco a poco, pues algunos sospechan que su traición es inevitable. Y a medida que se acerca la Sexta Era, Thratri por fin empieza a mover ficha tras la Semana de las Pesadillas."
 POD_persistentpodlore.desc.793499: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al entorno y no forma parte oficial del $pod_wod$.\n\nJayamala fue un hombre de guerra en vida. Nació durante el colapso de los Pala de Kamarupa, y no podía ser de otro modo, pues la inestabilidad de la región dejaba poco espacio para los hombres de paz. Lamentablemente, Jayamala era fuerte, pero no lo bastante para sobrevivir mucho tiempo en ese oficio, y el [UmbraGlossaryLocalized('yomi_wan','Infierno de Yomi')] de Lanka fue su recompensa.\n\nLa desolación de Lanka y su falta de una autoridad central fuerte eran familiares para el soldado. Pronto lo encontraron los muchos refugiados (o audaces aventureros) que usaban este Señorío como zona de respiro (relativamente) segura. Jayamala no era lo bastante valiente para seguir a quienes intentaban escapar, pero era hábil y estaba dispuesto a defender a las almas más quebradas que solo querían continuar con su «vivir» aquí.\n\nAunque los Raksha de Lanka en su mayoría dejaban en paz a los refugiados (por razones desconocidas), los más sádicos aún los cazan a veces por deporte. Jayamala se hizo un nombre durante esas cacerías, capaz de enfrentarse y plantar cara a varios Raksha.\nLamentablemente, eso lo volvió interesante, y estaba terriblemente superado cuando la reina Raksha Thratri se enfrentó a él en persona. Ignorando a los refugiados que tenía a su cargo, Thratri lo arrastró al Torreón Demoníaco.\n\nCuando emergió, Jayamala era ya un Raksha él mismo.\n\nDesde entonces ha sido un guerrero sólido y estoico que responde directamente ante Thratri, aunque otros Raksha dudan de su compromiso con la causa. Se le considera de buen corazón (aunque a algunos que lo pensaban se les ha mostrado el error de sus maneras en exhibiciones muy públicas) y su lealtad parece ser hacia Thratri y no hacia el propio Ravana.\nDicho esto, otros rumores sostienen que es el as en la manga de Ravana, para jugarlo cuando Thratri lo traicione inevitablemente.\n\nEs poco probable que se conozca la verdad hasta que el destino mismo de Lanka penda de un hilo."
 POD_persistentpodlore.desc.793500: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nRenben siempre fue un hombre astuto. Si no hubiera buscado siempre el camino fácil, podría haber llegado a ser alguien importante.\n\nNacido durante el reinado del emperador Taizong, Renben se dio cuenta rápidamente de la desproporcionada influencia de la escuela Shangqing en los asuntos de Estado. Al ver esto como una vía rápida hacia el poder cortesano con un barniz de legitimidad filosófica, se convirtió en un practicante aparentemente diligente y ávido.\n\nA decir verdad, su comprensión era, en el mejor de los casos, superficial, ya que intentaba buscar oportunidades para obtener prestigiosos puestos en la corte en cada ocasión. No fue cuestión de tiempo antes de que lo descubrieran. Renben intentó intimidar y amenazar al erudito, aparentemente frágil, que le reprendió, solo para encontrarse con una bola de fuego en la cara.\n\nAl encontrarse en el [UmbraGlossaryLocalized('yomi_wan','Inframundo')] de Feng-tu, Renben fue invitado por un extraño individuo llamado Ku. Presentándose como un [Glossary('Rey Yama','podgloss.yamaking')], esta entidad le ofreció poder y reconocimiento a cambio de su lealtad. Renben, asombrado por lo que parecía ser el interés de una entidad divina, aceptó con entusiasmo.\n\nVarios siglos después, el periodo de luna de miel ha terminado hace mucho. Desde entonces, Renben ha comprendido que Ku es un [Glossary('Rey Yama','podgloss.yamaking')] muy menor, que apenas mantiene su señorío bajo la nariz de entidades mucho más poderosas. Aunque ha considerado desertar, Renben no es tonto y sabe que su señor todavía es capaz de aplastarlo sin mucho esfuerzo.\nRecientemente ha comprendido que su señor le ocultó su activo más poderoso, los magos Wu-Keng, y se pregunta por qué. ¿Se considera a los magos prescindibles? ¿O se considera él?\n\nRenben ahora reflexiona sobre cómo utilizar esta información. Podría servirle como moneda de cambio para cambiar de bando hacia otro señor o quizás incluso posicionarse como intermediario entre los magos y Ku, usando a uno contra el otro."
 POD_persistentpodlore.desc.793501: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAmpliamente considerado como el menos humano de los [Glossary('Reyes Yama','podgloss.yamaking')], Hluh evita el uso de [akuma|E], prefiriendo la compañía de los organismos parásitos que habitan en su [UmbraGlossaryLocalized('yomi_wan','Inframundo')]. Sin embargo, hay excepciones, como Namwaran.\n\nNadie sabe mucho sobre él (¿ella? ¿ellos?) ya que su propia forma parece manifestarse como una pesadilla cambiante más que como algo racional. Los rumores dicen que es el primer [akuma|E] de Hluh (lo que explicaría su poder), otros dicen que es simplemente su favorito actual. Los más perturbadores cuentan que Namwaran no es una entidad única, sino un amalgama de pobres almas injertadas por la mente trastornada de Hluh, o incluso simplemente un huésped para una forma de vida parásita malévola, testimonio de lo que Hluh tiene preparado para la humanidad si llegara a ascender como el [Glossary('Emperador Demonio','podgloss.demonemperor')].\n\nSea cual sea el caso, Namwaran rara vez habla, aunque es capaz de mostrar emociones humanas en ocasiones (aunque de una forma deforme y extraña, como si imitar a los humanos le costara). Sin embargo, es más conocido como un carnicero que cosecha las almas del Infierno del Aceite Hirviendo y ocasionalmente viene a la propia Tierra.\nAunque sus objetivos durante estas incursiones nunca se comprenden del todo, los resultados son siempre sangrientos y horripilantes de presenciar. Cada audaz fuerza $pod_kueijin$ que ha intentado detenerlo no ha hecho más que aumentar la espantosa reputación del Segador Hirviente."
 POD_persistentpodlore.desc.793502: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nHubo un tiempo en que el [Glossary('Rey Yama','podgloss.yamaking')] Tou Shen era un rival digno de Rangda, la señora de la pestilencia. Ese tiempo ha pasado hace mucho, ya que el [UmbraGlossaryLocalized('yomi_wan','Inframundo')] de Tou Shen se está despoblando lentamente mientras Rangda refuerza su control sobre las almas muertas por enfermedades. Sin embargo, Tou Shen puede jactarse de una victoria, y su nombre es Ensima.\n\nUna de las muchas pobres almas que morían por una peste rabiosa, Ensima terminó en el dominio de Rangda y pronto se convirtió en el sujeto de prueba favorito para las últimas creaciones de la señora de la pestilencia. Atrapada en una agonía sin fin, la salvadora de Ensima no fue un $pod_kueijin$ ni otra alma perdida, sino el propio Tou Shen. Liderando por su cuenta un ataque al señorío de Rangda, Tou Shen supuso (con razón) que la señora del señorío no se mostraría por miedo a una confrontación costosa. Al ser quien perdía la guerra, Tou Shen no tenía este problema y los [akuma|E] de Rangda no eran rival para su poder personal. Antes de marcharse, aseguró varias almas para su propio uso, incluida la de Ensima.\n\nThe mujer, habiendo soportado ya innumerables horrores bajo el «cuidado» de Rangda, ya poseía una resistencia sobrenatural y una gratitud ferviente hacia su salvador. Tou Shen no perdió el tiempo en regalarle su propio conjunto de poderes, transformándola en un ser formidable bendecido por los dos [Glossary('Reyes Yama','podgloss.yamaking')] de la enfermedad.\n\nCuriosamente para una de las principales [akuma|E] de la pestilencia, Ensima parece una mujer de aspecto sano, intacta por cualquier signo de enfermedad. La verdad sobre este asunto es sencilla: Tou Shen se ganó aún más su lealtad asegurándose de que ella nunca tuviera que sufrir enfermedades, aunque siguiera siendo perfectamente capaz de infligirlas a otros.\nElla está más que ansiosa por hacer precisamente eso, deseosa de complacer a su salvador y vengarse de Rangda en el proceso."
 POD_persistentpodlore.desc.793503: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nHumamay, en cuanto puede recordar, odiaba su vida. Una familia indiferente, el peso de las expectativas de aceptar su papel y la incapacidad de rebelarse la volvieron furiosa, hasta que su padre la golpeó lo suficiente como para transformar esa furia en desesperación. No pasó mucho tiempo antes de que Humamay se lanzara al océano para acabar con todo.\n\nEl pequeño [UmbraGlossaryLocalized('yomi_wan','Infierno de Yomi')] de Hine-Nui-Te-Po, una [Glossary('Reina Yama','podgloss.yamaking')] menor, fue el final de su viaje. Hine-Nui-Te-Po se alimenta de la desesperación y la furia, y su pequeño Señorío le permite brindar un «cuidado» personal a cada alma de su dominio, y Humamay no fue la excepción.\nReavivó la furia juvenil de Humamay y se aseguró de que lo abarcara todo.\n\nHumamay aparece ahora como una presencia rara pero temida en el Sudeste Asiático, alimentándose de la desesperación y el autodesprecio, fomentándolos a cada paso para empoderar a su señora.\nSin embargo, reserva su desprecio personal para las [Glossary('Penangallan','podgloss.penangallan')]. Estas mujeres que intentan alcanzar la Iluminación rebelándose salvajemente contra el orden social le repugnan.\nEn el fondo, sabe que su furia contra ellas nace de su propia experiencia, la que la llevó a este punto, pero está demasiado perdida para que le importe. Aunque aún no ha logrado esa hazaña, anhela poder capturar a una de esas [Glossary('Penangallan','podgloss.penangallan')] y quebrarla por completo mostrándole que nada cambiará, por mucho que patalee.\n\nLa desesperación de la que se alimentará a partir de este día será verdaderamente materia de Leyendas."
 POD_persistentpodlore.desc.793504: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEn otro tiempo, Ni Luh era una discípula prometedora. Antes de eso, recuerda neblinas de llamar a algún lugar su hogar. Pero ahora, eso es solo una pesadilla, ecos y tormentos de un tiempo lejano. Todo lo que tiene ahora son sus hermanos y su madre. Su reina, y su propósito.\n\nNi Luh, antes de su servicio a Rangda, formaba parte de un trío de discípulas encargadas de investigar un Espejo Roto en la India, hasta que se enfrentaron a un horror de seis brazos y carne bullente. Las tres fueron capturadas brevemente y, en su cautiverio, probaron la sangre del horror. Y algo... entró en ellas.\nAlgo ajeno, algo más allá del conocimiento, pero algo que seguía siendo claramente humano, claramente odioso y claramente ambicioso. El primero de los Muertos Hambrientos en convertirse en vector de esta plaga sobrenatural, las atormentó sin cesar, jugando con ellas como si fueran juguetes, mientras vomitaban sus estómagos solo para ver cómo se transformaban en horrores insectoides decididos a matarse entre sí.\n\nBuscando huir de esta abominación en su interior, huyeron a través de la Umbra, encontrando respiro solo en los [UmbraGlossaryLocalized('yomi_wan','Mil Infiernos')]. Desesperadas por auxilio, buscaron alivio para esta aflicción por todas partes. Y de todos los lugares, lo encontraron en Rangda.\n\nComo la mayor del grupo, Rangda remodeló el alma de Ni Luh con mayor intensidad. Fue recreada bajo el toque de Rangda, desmembrada y reformada. Rangda vio la maleabilidad de la carne como un resultado fascinante de la plaga, y permitió que creciera hasta convertirse en algo similar al Shintai.\n\nEstos horrores se revelaron más estrechamente ante Ni Luh, quien se convertiría en una experta de primer orden en ellos, y usaría esto para moldear su cuerpo en un auténtico zoológico de nuevos horrores, extendiendo el dolor. Rangda, complacida con ella, la nombró Ni Luh y la puso a trabajar dentro de su Infierno.\n\nPero ahora, hay otros Muertos Hambrientos que pueden moldear la carne. Ni Luh tiene un regalo que darles. Una plaga de un horror en sangre de la que solo Rangda puede salvarlos. El Cáncer Primigenio que se extiende a través de sus labios.\n\nHermanas, venid a la Hija de Rangda y encontrad vuestro propósito."
 POD_persistentpodlore.desc.793505: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEn otro tiempo, Madek era un discípulo prometedor. Antes de eso, recuerda neblinas de llamar a algún lugar su hogar. Pero ahora, eso es solo una pesadilla, ecos y tormentos de un tiempo lejano. Todo lo que tiene ahora son sus hermanos y su madre. Su reina, y su propósito.\n\nMadek, antes de su servicio a Rangda, formaba parte de un trío de discípulos encargados de investigar un Espejo Roto en la India, hasta que se enfrentaron a un horror de seis brazos y carne bullente. Los tres fueron capturados brevemente y, en su cautiverio, probaron la sangre del horror. Y algo... entró en ellos.\nAlgo ajeno, algo más allá del conocimiento, pero algo que seguía siendo claramente humano, claramente odioso y claramente ambicioso. El primero de los Muertos Hambrientos en convertirse en vector de esta plaga sobrenatural, los atormentó sin cesar, jugando con ellos como si fueran juguetes, mientras vomitaban sus estómagos solo para ver cómo se transformaban en horrores insectoides decididos a matarse entre sí.\n\nBuscando huir de esta abominación en su interior, huyeron a través de la Umbra, encontrando respiro solo en los [UmbraGlossaryLocalized('yomi_wan','Mil Infiernos')]. Desesperados por auxilio, buscaron alivio para esta aflicción por todas partes. Y de todos los lugares, lo encontraron en Rangda.\n\nMadek, al ser «curado» por Rangda, fue hecho ideal para servir como el comandante de sus Zombies infestados de gusanos. Madek tenía una mente para la guerra, y su mente fue puesta a prueba al mando de sus fuerzas, con gusanos de asedio destrozando murallas hechas de los afligidos que gritaban.\n\nAdemás, descubrió que la enfermedad misma podía ser un arma en la guerra, y frecuentemente evitaba los motores de asedio directos para, en su lugar, armarlos con cuerpos de afligidos llenos de la fétida sangre de la enfermedad que le devora las entrañas. Solo cuando otros mueren y se infectan, sus dolores amainan. La plaga y la guerra es todo lo que alivia su dolor.\n\nAsí que conquista. Se propaga. Tu dolor lo alivia. Por tanto, serás afligido."
 POD_persistentpodlore.desc.793506: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEn otro tiempo, Nyoman era una discípula prometedora. Antes de eso, recuerda neblinas de llamar a algún lugar su hogar. Pero ahora, eso es solo una pesadilla, ecos y tormentos de un tiempo lejano. Todo lo que tiene ahora son sus hermanos y su madre. Su reina, y su propósito.\n\nNyoman, antes de su servicio a Rangda, formaba parte de un trío de discípulas encargadas de investigar un Espejo Roto en la India, hasta que se enfrentaron a un horror de seis brazos y carne bullente. Las tres fueron capturadas brevemente y, en su cautiverio, probaron la sangre del horror. Y algo... entró en ellas.\nAlgo ajeno, algo más allá del conocimiento, pero algo que seguía siendo claramente humano, claramente odioso y claramente ambicioso. El primero de los Muertos Hambrientos en convertirse en vector de esta plaga sobrenatural, las atormentó sin cesar, jugando con ellas como si fueran juguetes, mientras vomitaban sus estómagos solo para ver cómo se transformaban en horrores insectoides decididos a matarse entre sí.\n\nBuscando huir de esta abominación en su interior, huyeron a través de la Umbra, encontrando respiro solo en los [UmbraGlossaryLocalized('yomi_wan','Mil Infiernos')]. Desesperadas por auxilio, buscaron alivio para esta aflicción por todas partes. Y de todos los lugares, lo encontraron en Rangda.\n\nCuriosamente para un Señorío definido por la desfiguración y las larvas, cuando Rangda levantó a los Muertos Hambrientos, nombró a Nyoman de sus Pozos de Gestación; Nyoman los dejó hermosos sin parangón, pero esto fue un señuelo edulcorado para quienes la buscaran.\n\nEn su interior corría cada aflicción que pudiera fluir por las entrañas de la humanidad, y Rangda sembró en ella un deseo insaciable de propagarla por todas partes, y el conocimiento sobre cómo manipular a hombres y mujeres entre sus dedos y convertirse en nuevos recipientes para los «regalos» de Rangda. Nyoman dejaría los Pozos de Gestación con esa misión, sonriendo y soñando delirantemente con los placeres venideros."
 POD_persistentpodlore.desc.793507: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEn el cambio de Eras, cuando los Muertos Hambrientos cayeron de la Gracia del cielo, fueron las recientemente unidas Cortes de la Bestia quienes los derribaron. Las Cortes de la Bestia se habían unido después de que los Ministros del Cielo engañaran a los Hijos de la Madre Esmeralda para una guerra, mientras los Ministros abusaban de su autoridad para matarla.\nEl Pueblo Feroz vio esto y se levantó como uno solo para deponerlos y salvar a su madre. Pero para su sorpresa, ella buscó aniquilarlos a todos, ya que no era su deber oponerse a los Ministros. No, deberían haberse matado entre ellos y dejado que ella muriera. Pero su ira se desvió cuando la Leyenda Hakken, Chi You, aceptó la condena por sus «pecados», donde permanecería, cargando con el peso de todos sus pecados y evitando que cualquier otro Fera fuera enviado a los [UmbraGlossaryLocalized('yomi_wan','Mil Infiernos')].\n\nPero un Portador de Espada Hakken se desesperó ante esto. La condena de la Madre Esmeralda era cruel, injusta e ilegítima. Pero nadie lo escuchaba.\nAsí que sus protestas se convirtieron en resentimiento, su desesperación en odio y su pesar en Furia. Desafió los edictos de su Diosa Madre y descendió al Infierno para salvarse. Pero allí se perdería y vagaría, hasta encontrarse en el Infierno de ser Desollado en Vida.\n\nSu piel bendita sanaba contra los vientos de la desolladura mientras avanzaba, aullando por las cabezas de los Ministros que desencadenaron toda esta tragedia. La señora de este infierno, la [Glossary('Iron Queen','podgloss.toumu')], miró desde su fortaleza y sonrió al encontrar a alguien que realmente igualaba su odio por los caídos Ministros del Cielo. Abrió el camino a su palacio para este lobo y le ofreció una cena.\nSe unieron a través de su odio, y [Glossary('Tou Mu','podgloss.toumu')] se ofreció a liberar a Chi You cuando se convirtiera en la Emperatriz Demonio, y asegurar que el Lobo tuviera su amor. Y lo único que tenía que hacer era ayudarla a aniquilar aquello que condenó a Chi You.\n\nY el Lobo que era murió allí, y Matador-de-Muertos nació por acuerdo. Rehecho en Hierro Infernal, los pecadores ahora susurran sobre el Perro de Caza de la Reina de Hierro, el asesino más temido entre los [akuma|E].\nLo que no saben es que cuando aúlla, aúlla por lo que ha perdido, jurando que aquellos que lo condenaron sufrirán hasta el fin de los tiempos por sus pecados."
 POD_persistentpodlore.desc.793508: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nTal vez, si Daoyi hubiera muerto más tarde, habría sido enviada a los [UmbraGlossaryLocalized('yomi_wan','Mil Infiernos')], y posiblemente habría regresado como una Muerta Hambrienta. Pero nació demasiado pronto. Nacida mucho, mucho antes de que la Rueda de las Eras girara hacia tiempos más sombríos, Daoyi fue una trabajadora sexual olvidada que vivió una vida sin celebraciones, antes de su fin a manos de alguien que la vio y decidió que, en lugar de pagar por sus servicios, los tomaría y la mataría.\n\nY luego, en las Fuentes Amarillas como un wraith, se vio empujada al mismo destino. Pero mientras los días se convertían en siglos, un cliente en las Fuentes Amarillas fue diferente, y vio un fuego en Daoyi que aún ardía. Así que le susurró una verdad prohibida. Daoyi aprovechó la oportunidad para reclamar su destino, cometiendo una blasfemia y regresando de entre los muertos, con su cuerpo surgiendo del polvo como una Resucitada; y aquel cliente volvió a ella, orgulloso de su éxito, y le ofreció un trabajo como su primer [akuma|E].\n\nDesde entonces, Daoyi ha servido fielmente a [Glossary('Wu Hua','podgloss.wuhua')], ayudándole mientras la Rueda gira mediante la gestión de uno de los lugares más depravados de todos los Infiernos. Y a diferencia de sus otros sirvientes, ella recuerda su Humanidad, y eso la inflama.\nSupervisa el Burdel de Hierro, la construcción favorita de Wu Hua en su Infierno. Comanda su colección de demonios, buscando a los perpetradores de violencia sexual no solo en otros Infiernos, sino también por todo el Inframundo para ser secuestrados y arrastrados de vuelta al Burdel de Hierro.\n\nCon una mezcla de Moliación y Jade Arcanoi, se deleita castrándolos, convirtiendo sus virilidades arrebatadas en jades de cadena que pueden controlar sus emociones, y moliándolos hasta convertirlos en las mujeres que trabajan en el Burdel de Hierro. Su agonía y tormento es de los más ricos que cualquiera de los sirvientes de Wu Hua les ha proporcionado, por lo que Daoyi tiene muchos privilegios especiales, especialmente dado su estatus único como Resucitada.\n\nÉl ha moldeado su alma como cabría esperar de una discípula predilecta, y Daoyi no ve razón para arruinar su relación. Mientras tenga más gente a quien atormentar, está contenta. Y si [Glossary('Wu Hua','podgloss.wuhua')] se convierte en el [Glossary('Emperador Demonio','podgloss.demonemperor')], por supuesto que elegiría a su Madonna y Consorte Principal para ser su Emperatriz."
 POD_persistentpodlore.desc.793509: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEn las profundidades del Infierno de los Mares Ardientes, todos los pecadores temen a un monstruo grande y temible que puede verse incluso a leguas de distancia: una sombra colosal que acecha en los confines mismos del Infierno. Los servidores menores de Haha No Fukami han visto ciudades enteras ser aniquiladas por su paso, e incluso Escuelas enteras de Rokea han perecido y quedado pudriéndose en los mares que rodean a esta Bestia.\nSolo la propia Haha No Fukami se ha encontrado con el Pez-Diablo, y ambas parecen tener una especie de acuerdo. Sus cantos son un breve momento de respiro cuando nadan juntas, antes de que se separen y ella regrese a sus ambiciones, y el Pez-Diablo retome su caza.\n\nEn realidad, el Pez-Diablo es uno de los pocos seres provenientes de otro ciclo de la Rueda de las Eras. En su tiempo, la Madre Esmeralda era la Diosa suprema y sus hijos eran lo único que dominaba el mundo. El Pez-Diablo era uno de los Recuerdos de la Madre Esmeralda, pero incluso entonces, era una herética.\n\nDeseaba la inmortalidad de los Tiburones, así que llenó los océanos con su sangre y devoró su esencia vital, nadando con los horrores cefalópodos en busca de la inmortalidad. Pero cuando las Ruedas giraron, el Pez-Diablo durmió en las fosas oceánicas más profundas, hasta que Haha No Fukami la encontró y la despertó una vez más.\nY entonces la Madre de las Perlas comprendió lo que estaba viendo. Un Mokolé nacido como un Mosasaurio, una criatura de una Gnosis increíble y memoria robada. Pero se perdería en esta nueva era, y la [Glossary('Yama Queen','podgloss.yamaking')] no podía tolerar eso.\nElla agitó al Mokolé, que tenía el nombre de «Ansia-de-Qyrl», y lo guio al Infierno de los Mares Ardientes, donde este le ofreció la oportunidad de cazar a todos los Rokea, almas y Demonios que deseara; a cambio, nadaría con ella y la asesoraría sobre la Rueda de las Eras, sobre el Dios de la Última Era y sobre lo que podría hacer para convertirse en la actual.\n\nAnsia-de-Qyrl acepta esto, al menos por ahora. Es una criatura simple. Siente Ansia. Sueña. Persiste. Como siempre lo ha hecho."
 POD_persistentpodlore.desc.793510: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nA diferencia de la mayoría en las Cortes del Trueno Infinito, Talia está lejos de los lugares que alguna vez llamó hogar. Incluso en su vida mortal, habría visto este lugar como algo que debía ser conquistado y donde se debía mostrar la luz. Pero ahora, tras haber visto el mismísimo infierno, se lo ha pensado dos veces.\n\nTalia era la hija de un capitán de Ghaznavid, y su favorita, además. Él le permitió entrenar con espadas, leer sus libros, hacer ejercicio y aprender directamente de su padre. Naturalmente, una hija tan libre habría sido un escándalo, así que aprendió pronto a ser sutil, reservada y coqueta.\n\nComo adulta, siempre estuvo cerca de su padre, y su agudo ingenio, forjado en una juventud ocultando su espíritu libre, la convirtió en una astuta tejedora de susurros. Pero no estaba destinado a ser así, ya que durante la invasión y el tránsito, una emboscada terminó con su historia para el resto del mundo viviente. Y la propia Talia despertó de la muerte en el horror que era el Reino de la Noche.\n\nHorrorizada por las demonios acechantes y obligada a vivir horrores, se concentró y utilizó su sutileza y la oportunidad largamente negada para reafirmarse y liberarse. Y al liberarse internamente, se liberó del infierno, encontrándose lejos de donde murió, en lo profundo del continente indio, ya que parece que su cuerpo flotó una gran distancia por el Ganges. Y las Cortes del Trueno Infinito la encontraron.\n\nTalia estuvo inconsolable durante mucho tiempo, intentando asimilar cómo Alá podía permitir esto. Además, ahora estaba rodeada de gente a la que antes no le habría importado destruir, pero que ahora la dejaban vivir como quisiera en público.\nY solo escapó del infierno al realizarse a sí misma, aceptándose como una tejedora de intrigas y guerrera-asesina. Ahora podía amar como quisiera, sin verse obligada a existir a la sombra de su padre o de un marido al que nunca habría amado. Le pareció correcto. Simplemente tenía sentido. Así que aceptó la nueva comunidad que la rodeaba. No podía volver con su familia mortal.\nAsí que las Cortes del Trueno Infinito serían su nueva familia. Ya no era una extranjera para ellos. Era libre.\n\nPudo arreglarlo."
 POD_persistentpodlore.desc.793511: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSi bien los Muertos Hambrientos, al pensar en la Guerra Eterna, se centran principalmente en la guerra constante contra los Ravnos, hay otro teatro a menudo olvidado pero no menos aterrador existencialmente que debe mantenerse. Mientras los Semidioses y las Cortes Augustas luchan en el norte contra el General Eterno, el Azote y el de Muchos Brazos libran una guerra no menos constante e implacable.\n\nSanjaya fue una vez un tipo cualquiera. Ni conquistador, ni guerrero, ni príncipe, ni ningún otro título grandioso y elevado. Era un leñador. Tenía una esposa a la que amaba profundamente, un hijo y dos hijas que eran su mundo. Y un día, su hogar fue atacado por los Yakshi de Kartarirya, y Sanjaya fue una de sus muchas víctimas.\n\nEnviado al Infierno, la desesperación por su familia fue tan inmensa que su frenesí destructivo en el infierno olvidado del que procedía fue tan grande que se arrancó de él poseído, goteando la sangre de los demonios. La siguiente vez que los Yakshi llegaron a una pequeña comunidad, la gente solo vio con terror cómo un nuevo horror brotaba de la tierra, con la condenación pisándole los talones, aullando a su creador para que le enfrentara y le hiciera justicia.\nLas Cortes del Trueno Infinito lo encontraron, y devolverlo a la lucidez fue una odisea. Pero incluso recuperada la cordura, Sanjaya era un hombre de visión y propósito claros.\nLideraría a cualquiera que le siguiera para cazar y destruir a los seguidores de Muchos Brazos y a sus Yakshi dondequiera que aparecieran. Su odio obsesivo floreció en una guerra que duraría milenios, mientras que el Azote de los Demonios se convertiría en el mayor enemigo de Muchos Brazos. Aunque sus seguidores dicen que lucha contra el Contendiente por el Trono de la Sexta Era que corre por las venas de los demonios, para Sanjaya, su odio es mucho más sencillo.\n\nPor su amor, y por sus hijos, lo matará. Lo matará en cada lugar donde se manifieste. La guerra ha agudizado su mente. Ha despejado su camino. Las manos de la muerte no pudieron derrotarlo. Tendrá su venganza."
 POD_persistentpodlore.desc.793512: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nA pesar de lo que asumirían las Cortes de Agosto, los dos «herejes» [Glossary('Dharmas','podgloss.dharma')] de la India, tan presentes, no están vinculados de ninguna manera. De hecho, sus propios conflictos entre las Cortes del Trueno Infinito, la Corte de Manidvipa y la Tribu Celestial son feroces, violentos y brutales. Si bien la ira de los Godlings es famosa, la crueldad de la humanidad no conoce límites.\nY entre la Tribu Celestial, encargada de proteger las Cortes de los Godlings, se encuentra un ejemplar particularmente radiante del potencial infinito de la humanidad para la violencia y la humillación.\n\nNazia fue una de las muchas desolladas en el Infierno de ser Desollada en Vida, pero su escape y su descubrimiento por parte de la Tribu Celestial la dejaron algo perdida. Vagó durante un tiempo, pero un Godling que desde entonces ha sido reducido a materia fecal se aprovechó de ella cuando aún era nueva en su [Glossary('Dharma','podgloss.dharma')], manipulándola psicológicamente y obligándola a cometer muchos horrores.\n\nAl recuperar la claridad, mientras él dormía durante el día, ella se alejó a la fuerza, lo empaló con una vara de hierro y rió histéricamente mientras le succionaba la vida, para luego devorar todo lo que quedaba de su cadáver estancado. Regresó a las Cortes del Trueno Infinito y pidió ser su escudo contra los Godlings.\n\nNazia ve a los Godlings como cultistas, abusadores e idiotas que se engañan con la divinidad. Por tanto, su matanza es una forma de justicia, ya que la gente sobre la que ellos ejercen su señorío no puede resistirse a ellos. Pero ella sí puede. Así que se deleita en sus muertes, en sus agonías, aprendiendo toda clase de nuevas formas de extender y prolongar su dolor. Entonces, y solo entonces, los devorará ante su culto, demostrándoles que esos «dioses» delirantes no son más que lechones gritando que mueren igual que cualquier otro hombre cuando una mujer demoníaca psicótica les está comiendo el corazón.\n\nJusticia, claramente."
 POD_persistentpodlore.desc.895501: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSi bien entre los [Glossary('Dharmas','podgloss.dharma')] Ortodoxos es motivo de burlas y escarnio tacharlos de racionalización insensata de la religión mortal hacia una verdad que debería ser evidente por sí misma, para aquellos enviados a «gestionar» a las Caras de la Diosa, al ver a su campeona, finalmente comprenden que, de hecho, podrían estar en lo cierto.\n\nLa Godling conocida como Mahakali es un misterio incluso para otros Godlings superiores. Aunque muchos la considerarían bastante audaz por reclamar ese nombre, ella encarna a la Diosa que cree que la salvó tanto como puede. Una tempestad de furia y destrucción, inquebrantable ante el peligro, dedicada a su nueva familia y causa sin cuestionarlo, y con un deleite en la muerte; ciertamente luce el papel en batalla. Pero antes de todo eso, no puede decirlo, pues ya no existe.\nAlgunos Godlings sospechan que pudo haber sido una Maga del Tiempo en vida, antes de que de algún modo se destruyera a sí misma y su pasado, de ahí que escapara del Infierno de la Magia Malvada. Y su muerte, de algún modo, la despojó de todo poder hasta que, mediante la furia y la iluminación divina, se abrió paso no con magia, sino con pura ira y fuerza. Se necesitó a la mayoría de los Godlings para someterla como un Demonio Feral, pero muchos se alegran ahora de haberlo hecho.\nMahakali es la principal protectora de las Caras de la Diosa.\n\nDestino futuro\nCon el tiempo, la encarnación de Mahakali de los ideales de las Caras de la Diosa acabará por hacerla superar incluso a Shodashi en términos de poder dhármico. Sin embargo, desapareció poco después de la Semana de las Pesadillas. Se desconoce a dónde fue, pero el último mensaje que dejó a sus compañeros Godlings les infundió a todos un temor increíble, aunque no entendieran por qué.\n\n«Un monstruo profana el nombre de aquello que me ha convertido en una Diosa. Enderezaré las cosas». "
 POD_persistentpodlore.desc.895502: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nLos Godlings tienden a ser un grupo artificial y violento, y eso es tan cierto para las Caras de la Diosa como para la Tribu Celestial. Después de todo, rechazar la dualidad y la limitación puede aplicarse a las normas y los vínculos. Pero quien los guía es la estudiante más competente de Shodashi.\n\nAntes de ser una Muerta Hambrienta, Tārā era solo una de las muchas personas comunes en las numerosas comunidades pesqueras de la Bahía de Bengala. Casada con un hombre bondadoso, bendecida con hijos hermosos, con lo suficiente para salir adelante sin problemas y viviendo en una época de relativa paz para su comunidad. Era feliz. Al menos, eso creía. Pero un día, mientras recogía trampas, confundió un cocodrilo con un tronco y, por su vida mundana, se encontró en el Infierno de los Pecadores al Revés, donde su vida de mundanidad se convirtió en un infierno de constante confusión y caos.\nSe maldijo a sí misma por su debilidad mortal y clamó por escapar. Pero solo cuando aceptó lo absurdo de todo aquello empezó a despertar mientras caía de nuevo al Mundo Vivo en la Bahía de Bengala, donde las Caras de la Diosa acabarían encontrándola.\n\nBajo su paradigma, al menos, el epifanía que supuso su escape tuvo sentido para la recién llegada $pod_kueijin$, que tomó el nombre de Tārā para honrar a la Shakti que la elevó a diosa. Ya no desea la vida mundana que tenía; desea más. Quiere vivir, quiere experimentar, quiere tener algo por lo que luchar y vivir.\nAsí que ha tomado el camino con intensa precisión y dirección, siendo una autoridad primordial en las Caras de la Diosa, segunda solo después de Shodashi. Se ha convertido en una fuente de guía y protectora para su causa. Y nunca ha estado más realizada."
 POD_persistentpodlore.desc.895503: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEs un deber a menudo subestimado de los Muertos Hambrientos vigilar los Mundos Espirituales. Mientras que los [Glossary('Dharmas','podgloss.dharma')] Ortodoxos afirmarían que los [Glossary('Dharmas','podgloss.dharma')] Herejes son obsesivos en su exceso de enfoque en los Mundos Vivos, y tienen razón hasta cierto punto, negar que se realiza un esfuerzo es un error garrafal. Y entre las Caras de la Diosa, Bhuvaneshvari se ha dedicado a ser el principal cruce de caminos entre los mundos físico y espiritual.\n\nAntes de morir, era simplemente una mujer de fe y devoción, pero siempre tuvo dudas. Sin importar la dedicación de sus meditaciones o el enfoque que les prestara, siempre estaba plagada de incertidumbre, miedo y melancolía. Así que murió joven, por su propia mano. Y a ese tormento, encontró su camino hacia el Infierno de la Verdad Amarga, uno diseñado para despojar a los fieles de su causa y devoción, y engañarlos para que adoren a su señor.\n\nPero tan quebrantada por la devoción, decidió seguir su propio camino. En la falta de fe, encontró su propósito. Algo despertó en ella y logró abrirse paso a lucha. Y cuando las Caras de la Diosa la encontraron, su logro al navegar a través de uno de los infiernos más profundos de vuelta al mundo de los vivos sin recurrir a la invención la llevó a tomar el título de Bhuvaneshvari.\n\nY con ese fin, ahora gestiona tanto sus asuntos terrenales como espirituales. No es una luchadora sino una navegante; prefiere evitar el combate y ocuparse de las monedas y los recursos. Traza mapas de los Señoríos para que los Godlings los utilicen, envía emisarios y organiza a los Godlings más jóvenes para tales fines.\nSin embargo, siempre queda una duda. Encontró su salida del infierno rechazando lo divino.\n¿Tendría que hacer lo mismo? ¿Y significaría eso que tendría que negar la divinidad que los demás creen que reside en ella ahora?"
 POD_persistentpodlore.desc.895504: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEn su vida mortal, antes de convertirse en Chinnamasta, fue una de las muchas víctimas de la Guerra Eterna. Originalmente convertida en Ghoul como uno de los muchos sirvientes de los Ravnos, Chinnamasta luchó contra el Vínculo de Sangre, temiendo el peligro que podría sufrir su familia al ser arrastrada al conflicto. Desobedecía órdenes habitualmente, desafiando su voluntad y ayudando a su familia a escapar de convertirse en comida para los Ravnos.\n\nFinalmente, cuando su señor tuvo suficiente, la ató a una estaca y le exigió que, si quería seguir siendo difícil, podía ceder y delatarlos, o ser dominada hasta la servidumbre. Con ese fin, Chinnamasta, reuniendo toda la voluntad que tenía, superó el poder de la $pod_vitae$ para lanzarse en su lugar desde el pedestal que le habían preparado, decapitándose contra una sierra antes de ser utilizada con ese propósito.\n\nY parecía que en Lanka estaba destinada a vivir en un arrepentimiento eterno por haber tenido la audacia de desafiarlos. Al ser presentada ante innumerables víctimas, se le dio la sádica opción de elegir entre sufrir más por ellos o aceptar su dolor voluntariamente a través de mil muertes.\n\nNi una sola vez erró. Ni una sola vez declinó. Y cada vez, tomó el instrumento de su dolor en sus propias manos y lo aceptó. Y en cada horror se encontró fortaleciéndose. Con cada decapitación recuperó su claridad. Con cada desollamiento comprendió su forma. Cada tortura restauró su voluntad.\n\nSu escape fue algo silencioso. No quedaba nadie en ese pequeño sector de Lanka excepto ella, ya que todos los anteriores habían sido absueltos, y simplemente abrió sus ojos rotos y sangrientos en el mundo de los vivos. Y cuando los Rostros de la Diosa la encontraron, lo que parte de la Shakti la había bendecido le resultó obvio. Y ahora, con el recipiente de lo divino, mucho más allá de su antiguo sentido mortal, puede hacer algo más que retrasar aquello que la mató para empezar."
 POD_persistentpodlore.desc.895505: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAunque la violencia entre los Semidioses es común, hay quienes preferirían que no lucharan. Al menos según su entendimiento, los Descendidos deberían ver a los Rostros de la Diosa como miembros erróneos de Devi, y para los Rostros de la Diosa, los Descendidos aún conservan fragmentos de la Shakti en su interior. Dhumavati es una de las pocas de la gran Tribu Celestial que realmente se esfuerza por cerrar la brecha entre ellos.\n\nDhumavati, en su vida mortal, fue originalmente una médium, capaz de escuchar los susurros de los fantasmas. Pero debido a eso y a su propia apariencia, la trataron más como a un monstruo que como a una persona la mayor parte del tiempo. Sin embargo, sus servicios como médium al menos hicieron que la toleraran, y murió pacíficamente; durante un tiempo, fue al Infierno de la Magia Miserable por su falta de determinación para dar descanso a los muertos.\nSin embargo, ella aceptó esto con entereza y utilizó el aislamiento impuesto para convertirlo en el medio de su escape. Y cuando Shodashi la encontró, inicialmente la descartó, pero luego notó lo increíblemente sabia que era la anciana y lo que ellos entendían como una parte de la Shakti en ella. Así, la anciana fue acogida y recibió el nombre con el que recorrería el Mundo de la Noche: Dhumavati.\n\nDhumavati, al menos nominalmente, tiene la tarea de lidiar con los muertos, pero en realidad, es la principal fuente de conversación entre los jóvenes Semidioses y los Descendidos de los Rostros de la Diosa. Buscando influir en ellos hacia la verdadera naturaleza de la Shakti que llevan dentro, se dedica increíblemente a esta tarea, asumiendo que no la juzguen por las primeras impresiones."
 POD_persistentpodlore.desc.895506: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nUno de los principios fundamentales de los Rostros de la Diosa es que, antes de que los Muertos Hambrientos reciban una parte de la Shakti para hacerlos dignos del Segundo Aliento, todos fueron simplemente mortales, pecadores y malvados. Y, como mínimo, Bagalā encarnó eso en su vida mortal.\n\nIncluso siendo niña, era malvada. Disfrutaba pescando para ver cómo se asfixiaban, ahogando conejos, empujando perros a aguas infestadas de cocodrilos y matando animales sagrados. Escaló hasta llegar a las personas antes de cumplir los 14 años, y para cuando fue adulta, su racha de asesinatos era tan prolífica que incluso los selectos Tigres de Guerra Khan enviados para lidiar con la asesina en serie encontraron su hogar repleto de trampas horribles y fosas de asesinato esperándoles.\nSin embargo, finalmente encontró su fin cuando asesinó al Dhampyr equivocado, y una mujer con el nombre de un dios de la tormenta la mató en una inundación repentina y la sentenció al Infierno de los Mares Hirvientes. El dolor de ahogarse y un infierno repetido, obligada a sufrir el mismo destino que infligió a otros, al menos la humilló, al menos hasta cierto punto.\n\nY cuando finalmente escapó del Infierno dejándose convertir en un lienzo de dolor hasta que fue arrojada de vuelta a los vivos, al menos sintió que necesitaba templar sus... «indulgencias». Con una parte de la Shakti en su interior, podría ser mejor.\n\nAl menos, Bagalā lo intenta. Ese gusto por el asesinato sigue en ella. Pero venenos de parálisis, trampas, cuchillos de plata, estacas y muchos otros implementos de asesinato ahora simplemente... elige mejor a sus objetivos. Ravnos, [akuma|E], Nagaraja, Demonios y una gran variedad de malvados pasan a ser objeto de la atención de Bagalā, quien siente un placer especial al despedazarlos y hacer un espectáculo de su muerte.\n\nAunque dista mucho de la Devi que da nombre a su homónimo, al menos es útil para los Rostros de la Diosa. Y eso es lo que importa, ¿no es así?"
 POD_persistentpodlore.desc.895507: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEn su mayor parte, las Caras de la Diosa están un poco divididas de los tradicionalmente marginados. A menudo se les pasa por alto debido a los prejuicios de la vida, por lo que es fácil ignorarlos. Y es por esa razón que la Muerta Hambrienta que ahora responde al nombre de Matangi se niega a abandonar sus raíces mortales, incluso siendo una Semidiosa.\n\nAntes de ser Matangi, era una Paria, dedicada específicamente al ingrato oficio de deshacerse de los cadáveres. Con sus padres en una profesión similar, no tenía mucho más que aspirar a lograr.\nAsí que, desde muy joven, se dedicó al mismo oficio y lo hizo con diligencia. Pero el escarnio que sentía como alguien que desechaba a los muertos era algo que nunca la abandonó. Y una noche, las cosas empeoraron infinitamente cuando, mientras enterraba un cuerpo, este comenzó a retorcerse, surgiendo de nuevo de la tierra. Entró en pánico; el miedo existencial a la muerte la atenazó mientras el cadáver recién levantado la mataba a golpes, se la comía y dejaba sus huesos y tendones pudriéndose bajo el sol.\nY tras el pecado de ser asesinada por un Resucitado, se envolvió a sí misma en el Infierno de las Larvas Cavadoras. Pero a pesar de todo, su antigua fuente de aislamiento se convirtió en algo liberador. Saber cómo se pudren los cuerpos y cómo se descompone la muerte le permitió cronometrar los ciclos de las larvas, y utilizó las moscas que brotaban de su cuerpo para transportarla de vuelta al mundo de los vivos.\n\nDesde que se convirtió en estudiante de Shodashi y adoptó el nombre de Matangi para recordarle siempre sus orígenes, Matangi no puede evitar notar incluso ahora, a pesar de ser llamada Semidiosa, que sigue estando en la periferia de sus nuevas Cortes.\nAl menos ha aceptado su papel como Diosa de los Parias, protegiéndolos de destinos como el suyo. Quizás, al menos si la Shakti la elige, pueda ayudar a arreglar las cosas."
 POD_persistentpodlore.desc.895508: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nPara la mayoría de los Godlings, aunque muchos tuvieron vidas marcadas por presagios, muy pocos han venido de posiciones o trasfondos de riqueza o poder. Pero, como en todas las normas, existen excepciones. Y entre las Caras de la Diosa, hay una antigua princesa. Cuál, sin embargo, Kamalā no lo dirá. Ella deja bastante claro que quien era ha muerto. Y quien está aquí ahora es lo único que importa.\n\nEn su vida mortal, Kamalā fue una princesa del Imperio Pāla. Criada en el privilegio y junto al corazón del pueblo bengalí, lo tenía todo lo que materialmente pudo haber deseado en la vida. Al menos, todo excepto al hombre al que realmente amaba.\n\nDesposada por razones políticas, tuvo sus aventuras con él, pero fueron algo fugaz en la gran escala de las cosas. En cuanto al porqué, cuando su prometido se enteró, simplemente la ahogó y luego tomó a una hermana como esposa.\n\nAsí, condenada al Infierno de los Mares Hirvientes por adulterio y ahogamiento, su único compañero aparte de la asfixia fueron las corrientes. Así que, en lugar de arriesgarse en la superficie ardiente, siguió la corriente en los Infiernos. Y al atravesarlo y confiar en el flujo, se encontró extraditada de vuelta al mundo de los Vivos.\n\nY cuando fue encontrada por las Caras de la Diosa, su competencia y habilidad en el gobierno la hicieron increíblemente valiosa, y fue una elección fácil para la última estudiante de Shodashi. Así, al tomar el nombre de Kamalā, puede dejar atrás los fantasmas de su vida mortal y empezar de nuevo. Tiene muchas ganas de ser una gobernante por derecho propio."
 POD_persistentpodlore.desc.793513: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nYanling se ha vinculado desde hace mucho tiempo a la Corte de la Tortuga Negra. Quizás la seguidora más cercana de Pu Shoukeng, estuvo a su lado desde el principio. Cuando la Cuarta Era comenzó, y el Bosque Brillante llegó a la estepa tras el paso de los Cazadores Arrepentidos, los Jinetes de las Llanuras de Ceniza y los Hijos de Tengri, Yanling fue una fuerza mayormente silenciosa en el Bosque Brillante, apoyándolos mientras se convertían en el compromiso para el liderazgo entre las tres facciones.\n\nLa vida de Yanling terminó en la vergüenza y la humillación, ya que en su vida fue una adúltera y fue asesinada por su primer marido por ello, donde se encontró en posesión de Dou Tingzhang, el Mutilador de los Infieles. Sin embargo, su fatídico deseo de tomar las Bibliotecas del Cielo llevó a que fuera liberada no por voluntad o deseo, sino por las circunstancias.\nSin embargo, fue salvada por Pu Shoukeng, a quien luego siguió a todas partes donde él fuera. Como uno de los primeros «verdaderos» Muertos Hambrientos, su perspicacia les resultó valiosa por ello, y tenía una buena mente para guardar y manipular secretos. Se hundió silenciosamente en la sombra de Pu Shoukeng, contenta y adorando a su salvador, y más tarde, aceptando con gusto su papel como esposa de él que, en la superficie, era para Dhampyr, pero los dos habían llegado a ser genuinamente cercanos como alguien en quien él podía confiar.\nCon sus compañeros Lìn, Rong y Xiaoli, los cinco liderarían la Corte en aquellos días críticos del inicio de la Cuarta Era contra el [akuma|E].\n\nPero Yanling está cansada. Muy cansada. Y lo que es peor, está experimentando cierto aburrimiento en su matrimonio. Ama a Pu Shoukeng, pero los nuevos hombres y mujeres que se presentan ante la Corte no pueden evitar atraer su atención, ya que frecuentemente se excluye para «reenfocarse». Entre eso y el deseo de restar importancia a la amenaza del [Glossary('Anda','podgloss.anda')], Yanling está bailando sobre una línea muy peligrosa mientras lucha por gestionar su agotamiento y su lujuria a medida que la Quinta Era se acerca..."
 POD_persistentpodlore.desc.793514: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nUno de los miembros más antiguos de la Corte de la Tortuga Negra, Xiaoli siempre ha estado en la silla, ya que es donde se siente más como en casa. Un jinete Qiang en vida y Muerto Hambriento en la muerte, fue fundamental para la comunicación entre los tres [Glossary('Wus','podgloss.wu')] que fundaron la Corte de la Tortuga Negra, actuando como su mensajero. Y fue él quien ayudó a Pu Shoukeng a liderarlos mediante el compromiso.\n\nTambién exploraba el infierno, buscando pecadores valiosos, y fue allí donde conoció a su amigo más cercano y confidente, Lìn. Cabalgaba entre ellos y, por su palabra y la de Dhampyr, fueron unidos.\n\nPero las cosas se amargaron con el tiempo. Llegó a odiar las disputas entre Badmaarag, Tugmandakh y Achitbaatar. Sus visitas se convirtieron en un intercambio frecuente de insultos y pullas entre noticias. Su matrimonio comunitario con los Chacha dentro del Viento Yermo se convirtió en un nuevo tipo de infierno para él.\n\nA pesar de ser su diplomático, Xiaoli sembraba las semillas de un intenso conflicto doméstico en toda la Corte de la Tortuga Negra, y su capacidad de respuesta disminuyó con ello a medida que los canales de poder se negaban a fluir hacia él. Y ahora, a medida que los [Glossary('Anda','podgloss.anda')] se acercan, las cosas se están volviendo desordenadas, complicadas y llenas de presagios funestos. Y, sin embargo, lo único que Xiaoli parece capaz de hacer es desahogarse con Lìn, aferrarse a sus amigos y continuar el descenso de la Tortuga Negra hacia el caos."
 POD_persistentpodlore.desc.793515: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLa miembro más joven del Bosque Brillante, Lìn fue quizás la más crítica para el éxito duradero que disfrutó la Tortuga Negra. Esposa del General Ma Yuan, en su vida mortal fue testigo de las campañas de su marido contra las hermanas Trung y las tribus Wulin, y pereció con él en campaña por una enfermedad.\nSin embargo, a diferencia de su marido, su historia continuó en el Infierno de las Larvas Cavadoras. Al despertar siendo devorada, había vivido una vida de comodidades y ahora estaba confinada al horror. Presa del pánico, sus lamentos y gritos fueron suficientes para captar la atención del Xiaoli del Bosque Brillante, quien la sacó del Infierno y la trajo de vuelta a la Tortuga Negra. Y cuando conversaron, Xiaoli quedó impresionado por su comprensión de la guerra e insistió al resto de los Bosques Brillantes en que desafiaran la convención e incluyeran a Lìn entre sus filas.\n\nLìn era gran amiga de Xiaoli, y se llevaba bastante bien con el resto. Conocía las notas de campaña de su marido, y aplicar sus estratagemas fue fundamental para que la Corte de la Tortuga Negra consolidara su victoria contra el [akuma|E] antes de Dokhor Khan y la amenaza del [Glossary('Anda','podgloss.anda')]. Sin más ambiciones que sus logros pasados, Lìn estaba orgullosa de retirarse simplemente apoyando a Pu Shoukeng, jugando juegos de mesa con Xiaoli y buscando su propia Iluminación.\n\nSin embargo, su juventud provocó bastantes problemas con la Corte del Emperador Amarillo, especialmente con Li, el emisario del norte de Wang Hongben. Lìn y Li pronto llegaron a despreciarse mutuamente, un odio y una furia que florecerían en las constantes escaramuzas fronterizas que plagan las Cortes. Incluso ahora, está más centrada en Li que en el [Glossary('Anda','podgloss.anda')], ya que persigue cada intento de humillar al bastardo que continuamente la menosprecia como nada más que «una ramera de bárbaro», decidida a demostrar su propio valor frente a ellos."
 POD_persistentpodlore.desc.793516: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEn los primeros días de la Corte de la Tortuga Negra, se encontraban en un nuevo territorio competitivo. Rodeado de los primeros [Glossary('Anda','podgloss.anda')] y Fera, Rong se ganó la reputación de ser una fuerza imbatible capaz de quebrar a cualquiera ante él. Él era quien expulsaba a los [Glossary('Anda','podgloss.anda')] de los lugares principales donde las Tortugas Negras construirían, y la fuerza de poder que aseguraría que los Siberakh permanecieran demasiado aislados como para unirse a otros cambiaformas.\nPu Shoukeng se convertiría en un amigo cercano suyo, ya que su elevada perspectiva ayudó a darle dirección a Rong. Él se convertiría en el protector de los Bosques Brillantes y en la roca sobre la cual construirían su Imperio.\n\nPero ahora, los [Glossary('Anda','podgloss.anda')] están ascendentes bajo el Imperio Mongol y los [akuma|E] corren sin control. Y Rong lleva mucho tiempo fuera de práctica y sin aliados más allá de sus [Glossary('Wu','podgloss.wu')]. Rong llegó a odiar la impudencia de los grandes actores políticos de la Corte de la Tortuga Negra, antagonizando a Tarugha, Tan Banshi y Xiang Li por su ambición política, y su propio desinterés por cualquier camino romántico lo dejó aislado del acceso a la Corte de Pu Shoukeng.\n\nSimplemente estaba demasiado centrado en el servicio, y en la estructura altamente política e informal de las cortes, eso le supuso problemas a gran escala. Y como es posible que necesite ayuda contra los [Glossary('Anda','podgloss.anda')], esa postura bien podría haberle condenado una vez más."
 POD_persistentpodlore.desc.793517: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nAntigua incluso para muchos de los más viejos $pod_kueijin$ que sufrieron directamente en el Infierno, la no-vida de Badmaraag no ha sido menos accidentada. La primera líder de uno de los más antiguos [Glossary('Wu','podgloss.wu')] de la Estepa, desde los primeros días de la Cuarta Era hasta el presente. Pero ahora, no es más que una sombra del temido terror de lo que las Cortes de la Bestia de la Estepa solían susurrar, y mientras observa cómo se acerca la destrucción, parece cada vez más sumida en su depresión.\n\nBadmaraag fue una de las mujeres más hermosas de su tribu cuando vivía, la consorte favorita de un caudillo. Pero, en muchos sentidos, seguía siendo vista como «defectuosa» por su ceguera.\nSin embargo, cumplió bien su deber como consorte, dándole muchos hijos, y cuando la Rueda de las Eras giró y comenzó el Tiempo de la Bella Tristeza, Badmaraag murió durante el parto de su decimotercer hijo y fue al [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')].\nPero sabía cómo explotar la política de la que este se burlaba, así que escapó rápidamente. Y en su huida, instruida por los antiguos sabios de estas primeras eras, se dirigió hacia el norte con almas afines, para liberarse de las restricciones de la Corte en el núcleo chino de su sociedad.\n\nY a pesar de su ceguera, su nueva capacidad para ver almas y espíritus junto a sus sentidos mucho más practicados, se convirtió en la más grande de los Muertos Hambrientos de la Estepa en términos de destreza de caza, optando por cazar a todos los miembros rivales de la Corte de la Bestia que los amenazaran.\n\nPero milenios de violencia desgastan a cualquiera. Luchar con Xiaoli en política y la interminable Contienda contra el misógino Achibaatar y la brutalidad de Tugmandakh la ha llevado a retirarse en gran medida y centrarse en la Iluminación. Ha encontrado una amiga entre los jóvenes [Glossary('Wu','podgloss.wu')], y tomar a su primera y única estudiante, Khorkhoi, es una especie de seguro.\nSabe que la Corte de la Tortuga Negra está condenada, pero hay lugares que deben ser protegidos. Así pues, con ese fin, mientras los Cazadores se estancan, ella pone su fe en la sangre nueva.\n\nDestino futuro\nLa experiencia de Badmaraag tras siglos de Contienda finalmente alcanzó un punto de inflexión al tomar una estudiante, y cuando los [Glossary('Anda','podgloss.anda')] llamaban a su refugio, lo encontraron vacío, ya que acababa de ascender a las [Glossary('Hundred Clouds','podgloss.hundredclouds')] momentos antes, finalmente libre."
 POD_persistentpodlore.desc.793518: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nGatlmaa una vez soñó con la gloria. De niña, era la única hija del líder de un pequeño grupo de nómadas de la estepa, y deseaba desde hacía mucho tiempo seguir sus pasos de gloria. Y aunque las circunstancias del destino harían que muriera antes que él, nunca abandonó ese sueño, incluso cuando fue condenada al [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')].\n\nSin prestar atención a cómo su sed de poder y prestigio pudo haber interferido con el destino de su alma, Gatlmaa luchó contra el Infierno y, en sus protestas y furia contra el mundo, se liberó y escapó de vuelta al mundo de los vivos. Con suficiente orgullo como para asfixiar a una ballena y un deseo por todo y todas las cosas, asumió el riesgo de la oportunidad en la estepa por encima de la seguridad en la Corte del Emperador Amarillo.\n\nQuizás la menos «arrepentida» de los Cazadores Arrepentidos, persiguió cada gloria que pudo y fue la mayor impulsora de la persecución y absorción de tribus en su red de influencia, convirtiéndose en una señora y generala oculta, utilizando varias tribus y campamentos como piezas en un tablero para sus propios juegos de estrategia.\n\nNaturalmente, esta buscadora de gloria con toda la moderación de un perro hambriento, la paciencia de un colibrí y la humildad de un demonio, encontró pocos amigos. Su propio [Glossary('Wu','podgloss.wu')] apenas la toleraba; su antagonismo descarado con los otros [Glossary('Wu','podgloss.wu')] fundadores, el hecho de que rutinariamente causara la muerte de sus Dhampyr y su solución habitual de luchar contra alguien prendiendo fuego a campos enteros, la han dejado en gran medida sola mientras continúa persiguiendo más y más gloria."
 POD_persistentpodlore.desc.793519: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al entorno y no forma parte oficial del $pod_wod$.\n\nLos frecuentes actos de guerra con las Cortes de la Bestia entre las Cortes de la Tortuga Negra se han convertido, entre los Cazadores Arrepentidos, en una gran vergüenza. Con escaramuzas fronterizas rutinarias, la búsqueda de los ocultos dragones siberianos y el trato con la Esencia distorsionada y mutilada que fluye por la Gran Muralla, en su mayor parte han aceptado que sus acciones habrían estado mejor empleadas en otra parte.\n\nPor eso Chinzorig huye de su pasado.\n\nUna rareza por haber venido del Infierno de [Glossary('Kakuri','podgloss.kakuri')], Chinzorig era, sin embargo, un cazador competente, curtido en la búsqueda de despojos. Su habilidad para el rastreo fue esencial para el éxito de los Cazadores Arrepentidos, pues era el maestro supremo e indiscutible a la hora de encontrar nidos de dragón y, como las Cortes de la Bestia llamaban a ellos, «Caerns».\n\nY con las fuerzas de la primera Corte, muchas de sus ahora más antiguas fuentes fueron halladas y ganadas por él. Pero fue demasiado codicioso en su búsqueda, y ahora la relación con las Cortes de la Bestia permanece rota para siempre. Chinzorig ha reaccionado a este arrepentimiento negándose a vivir en el pasado; en su lugar, busca ahora cualquier conflicto en el que pueda hundir la cabeza.\n\nPero ahora Chinzorig está provocando al oso. En su obstinada huida de la culpa, provoca a los [Glossary('Anda','podgloss.Anda')], y de forma bastante descarada. Enfrentándose a ellos desde el principio mientras el resto de la Corte se entretiene con sus dramas, Chinzorig ya ha perdido a numerosos alumnos a manos de un grupo de jinetes [Glossary('Anda','podgloss.anda')].\n\nLos [Glossary('Wu','podgloss.wu')] más jóvenes lo desprecian como el colmo de la necedad, y a medida que los [Glossary('Anda','podgloss.anda')] se acercan, bien puede haber puesto la primera ficha del dominó para condenar a la Corte de la Tortuga Negra."
 POD_persistentpodlore.desc.793520: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nA pesar del nombre de su [Glossary('Wu','podgloss.wu')], el propio Khongor nunca fue realmente un cazador. Pastor en vida, cuya muerte fue causada por los tiempos de escasez, el trauma del Infierno de la Pobreza y su propia huida hicieron que Khongor se convirtiera en algo nuevo y mucho más letal. Sin embargo, su alma permanece inalterada. Lo que fue en vida, será en la muerte, solo que en un nuevo contexto.\n\nKhongor es el principal emisario de los grupos mortales de las Estepas para los Cazadores Arrepentidos ante los diversos clanes y tribus nómadas. Ha preparado tanto a buena gente para alimentarse como los medios para su propia seguridad.\n\nTras haber pasado gran parte del tiempo con Nesulte, que fue una vez una aliada que se convirtió en la madre de sus hijos Dhampyr, siguió adelante con sus magras tareas a pesar de las críticas de otros miembros del antiguo [Glossary('Wu','podgloss.wu')]. Pero les presta poca atención, avivando aún más su desconfianza hacia él.\nIncluso ha aceptado a una nueva estudiante, Sansar, a quien tiene como una amiga y aliada cercana en la que confía.\n\nPero las cosas se están volviendo mucho más sombrías de lo que Khongor está preparado. Los [Glossary('Anda','podgloss.anda')] se acercan, y muchas de sus tribus desertan y se unen al resto de la Gran Nación Mongola o son destruidas por completo, proporcionándole cada vez menos aliados. Y mientras los [Glossary('Anda','podgloss.anda')] le pisan los talones a la Corte de la Tortuga Negra, su gentileza puede resultar ser su perdición."
 POD_persistentpodlore.desc.793521: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nNormalmente, cuando alguien es el núcleo emocional de un [Glossary('Wu','podgloss.wu')], suele estar en esa posición por habilidad o por voluntad propia. Sin embargo, en el caso de Naidan, tiene un problema mucho peor. Casado con una lunática, un pusilánime, un agitador y un líder increíblemente deprimido, el tipo mediocre acabó siendo su corazón. Para consternación de Naidan.\n\nA pesar de su edad, Naidan no es el mejor siendo uno de los Muertos Hambrientos. La Iluminación se le escapa, y los [Glossary('Reyes Yama','podgloss.yamaking')] le sacan el aliento del cuerpo. Incluso como uno de los antiguos de la Corte de la Tortuga Negra, es quien llegó a su posición en gran medida por antigüedad y por la presencia de su [Glossary('Wu','podgloss.wu')].\nEn su lugar, se dedica principalmente a equilibrar el tener que escuchar las inanes o sombrías penas de su familia jurada, mientras es arrastrado cada vez más lejos del mundo que conoce.\n\nSimplemente quería volver a la humanidad, y cada vez que surge algo con lo que se identifica, esta conexión se corta con la misma rapidez. Aunque la herejía humanista en la India le fascina, está tan alejada de ella que podría ser inútil intentar buscarlos para obtener respuestas. Y mientras tanto, los agitadores que le rodean no dejan de intentar dañar a sus chiquillos o su poder, empeorando las cosas.\n\nEn realidad, solo tiene a su esposa, e incluso así sospecha traición en su unión. A pesar de estar rodeado de otros, está totalmente solo. Obligado a escuchar a su [Glossary('Wu','podgloss.wu')], su matrimonio con Uleken y su disputa con Zevseg y Khünbish, y sus encuentros prohibidos con Sansar, toda su posición política tambalea al borde del colapso."
 POD_persistentpodlore.desc.793522: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEl Soberano Errante es un enigma para muchos, incluso entre los pocos sirvientes que tiene. No acepta servidores, no tolera a necios que le sigan. Existen algunos discípulos, pero muy pocos han tenido algún grado de comunión con el Rey al que profesan servir. Es un cataclismo errante de sufrimiento, el ojo de un huracán de miseria. Pero hay una alma Profanada que se ha ganado su favor más que la mayoría.\n\nMiracala es una rareza, originalmente una de las Esclavas de Sangre de un caballero $pod_cainite$ enviado a las estepas para investigar el [Glossary('Anda','podgloss.anda')]. Fascinado por su increíble habilidad como médica, el caballero Vástago no es consciente del torbellino de oscuridad que ruge en el corazón de su Ghoul, ni de la peculiaridad del destino que permite que su mente permanezca clara en su servicio y siempre a salvo del Vínculo de Sangre. Numerosos vampiros que él derrotó murieron extrañamente, completamente exsanguinados, sin saber que su Ghoul les estaba arrebatando el poder.\n\nY una vez que entraron plenamente en las estepas, un encuentro fortuito con un viajero en el camino despertó algo en su cirujana. Por capricho, el extraño le dio un regalo de hechicería y desapareció. Buscándolo más, la cirujana usaría esto para entrar en los Reinos de los [UmbraGlossaryLocalized('yomi_wan','Mil Infiernos')], desertando del Caballero con esclavos deformados propios con poder robado y fuentes de sangre atrapadas. Ella persigue la estela del Soberano, recibiendo bendiciones y sangre mientras la Ghoul persigue a su amo elegido.\nTodo ello mientras su excitada y depravada lujuria por el sufrimiento, el celo y el placer carnal en nombre de su dios la empuja más profundamente hacia las profundidades de la locura y la profanación.\n\nY ahora, siente que su dios elegido le ordena regresar al oeste y derribar el muro que mantiene a su amo alejado de él. Cómo sabe esto, no lo sabe, pero lo hará, con orgullo y sin remordimientos. Despedazará a los chiquillos de Caín, robará su poder y derribará el muro por el bien de su Emperador. Y al menos las víctimas que gritan en su mesa le reportan un sinfín de alegrías."
 POD_persistentpodlore.desc.793523: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nMientras que para la mayoría del resto del mundo nocturno, cuando se trata de los chiquillos de la de Muchos Brazos, Ratti-Ben y su guerra personal la convierten en la más famosa, al sur de la Meseta del Decán su segundo chiquillo es más temido y odiado, la fuente de muchos horrores y monstruosidades nuevos. Y cuando lo ven, nunca sospecharían que algo va mal. Al menos no hasta que sus manos entran en contacto con sus víctimas.\n\nPero para alguien que ahora tiene un comportamiento tan agradable, pocos creerían su vida mortal. Un segundo hijo descontento y deprimido de un señor local, que siempre aspiró a ser artista. Pero tras la muerte de su padre y el ascenso de su hermano, este último lo puso en posiciones e humillaciones inútiles como «supervisión de impuestos» y «senescal de la corte».\nAkhed resentía a su hermano por impedirle alcanzar su sueño, despreciando las burlas y la mofa que sin duda se ocultaban a sus espaldas. Incluso cuando el trono fue sucedido por su sobrino, simplemente resentía al pequeño mocoso por aceptar su derecho de nacimiento con naturalidad y nunca preguntarle a Akhed qué quería hacer. Pero ese resentimiento latente llamó la atención de un monstruo, que vio en Akhed lo que realmente era.\n\nUn artista.\n\nÉl bendijo a Akhed con la muerte, y Akhed regresó con su sobrino y lo moldeó como una obra de arte que se extendía por todo un bosque, con los nervios encendidos por la sinfonía del dolor. La luz en sus ojos regresó, mientras toda la familia que se burlaba de él y le negaba el arte se convertía en arte mismo.\nAsí que ahora compensa el tiempo perdido, disfrutando de la inmortalidad y el Elíseo con nuevo vigor, mientras busca la perfección del arte mismo.\n\nDestino Futuro\nAkhed crearía muchas obras maestras más, y con la decimación de los Ravnos en la Semana de las Pesadillas, empezaría a chocar más con Ratti-Ben en su visión artística.\nY a medida que lo hacían cada vez más, empieza a ver a su hermano, muerto hace mucho tiempo, en ella. Y en la hora del triunfo Tzimisce en la India, podría verse sometido a una nueva y desastrosa disputa fraternal."
 POD_persistentpodlore.desc.793524: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nMuy pocos Tzimisce sobreviven tras no cumplir las expectativas de su [Glossary('Sire','game_concept_Sire_desc')]. Ezlynn tuvo suerte por ser la estudiante ideal de su antepasado. $pod_Embraced$ de entre los Esclavos de Sangre a los que la de Muchos Brazos tenía acceso, Ratti-Ben esperaba que Ezlynn siguiera sus propios pasos, volcando sus poderes hacia lo idealista y decidido, buscando la liberación tal como ella lo hizo. Sin embargo, Ezlynn era idealista, solo que no de la forma que ella esperaba.\nEzlynn quedó fascinada por la Vicisitud y el poder que esta poseía, y no quiso tener nada que ver con su antiguo estado mortal. Mientras Ratti-Ben quería destruirla por el uso perdido de $pod_vitae$, su propio [Glossary('Sire','game_concept_Sire_desc')] se lo prohibió, ya que Ezlynn estaba cruzando territorios que pocos entre los Señores de la Noche se atreven a pisar.\n\nEzlynn sabe que la carne es débil. Es algo que se corta, se quema y se separa fácilmente. El metal era firme, duradero e inmortal. Como criaturas inmortales, ¿no deberían moldearse a sí mismas en acero? Ezlynn usó sus artes de moldeado de carne para buscar la perfección no en el espíritu o en la carne pura, sino haciendo que su carne y el metal fueran uno solo.\nExperimentando rutinariamente con sujetos y usando su propio cuerpo como lienzo para este camino. Y para la Edad Oscura, queda poco de su cuerpo físico, habiendo sido reemplazado por acero y plomo sobre el músculo, sus huesos sustituidos por hierro y sus órganos por bronce y cobre.\nSolo queda su músculo, otorgándole un grado de flexibilidad, visible solo a través de las costuras donde el metal se conecta y queda abierto para la articulación.\nEs un tipo de terror especial, uno que inspira un tipo especial de miedo entre aquellos que luchan contra los Señores de la Noche."
 POD_persistentpodlore.desc.793525: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al entorno y no forma parte oficial del $pod_wod$.\n\nNethmi es peculiar, no cabe duda. Normalmente, ser el Ghoul de un Tzimisce es cosa de terror y miedo constantes, sabiendo que un solo momento equivocado puede hacer que te transformen en algún tipo de horror nuevo. Y sin embargo, durante milenios, Kartarirya tuvo un súbdito que no solo estaba dispuesto, sino plenamente ansioso en cuerpo, mente y alma. Y así, hizo algo que muchos Tzimisce considerarían impensable.\n\n$pod_Embraced$ a un Szlachta.\n\nEl recuerdo de Nethmi anterior a su condición de Ghoul de Kartarirya es un misterio para ella, pues él convertía rutinariamente su cerebro en plastilina cuando era un Ghoul. E incluso ahora, como Vampiro, está más que ansiosa por someterse de nuevo a su obra.\nPero ahora tiene en mente un objetivo mucho más práctico para ella. Siglos de tiempo moldeados en horrores y plagas alienígenas han dado a Nethmi una perspectiva única sobre la existencia como Yakshi, una que, cuando los crea, da lugar a una creación particularmente letal.\n\nY así, cuando Kartarirya no los crea, solo a Nethmi se le permite siquiera tratar con sus Ghouls. Los comprende, los calma y les deja las cosas claras, antes de remodelarlos como ella fue remodelada y convertirlos en hermosos horrores nuevos. Incluso ahora, mientras la Guerra Eterna arrasa, la necesidad de cuerpos y horrores se dispara, así que ella añade más y más a su guerra interminable con un increíble grado de diligencia y una concentración implacable que haría parecer voluble hasta a una mula.\nEs todo lo que conoce, y su propio camino hacia la perfección. Y no aspira a nada más que a ser digna de su amo y [Glossary('Sire','game_concept_Sire_desc')], sea lo que sea que eso conlleve."
 POD_persistentpodlore.desc.791174: "Este personaje es parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por eso, fue ampliado por los desarrolladores de PoD para aportar mayor profundidad al escenario.\n\nTras el error de Ravana y las crecientes frustraciones con la impudencia de su segundo chiquillo, Jayendra, Chandraputra sintió que era necesario un cambio en la forma de seleccionar a sus chiquillos. La sangre que ofrecía era potente y poderosa, y la metodología y el protocolo anteriores habían sido insuficientes. Así que probó un nuevo método. El que adoptaría para todos sus futuros chiquillos cuando su tercer Indraja superara todas sus expectativas.\n\nIndraja nació de la legendaria Ashoka el Grande y su última consorte Tishyaraksha, el último hijo en una línea de sucesión increíblemente larga. Incluso sus hermanos mayores por parte de su madre Tishyaraksha eran los favoritos de ella, y él no era más que una ocurrencia tardía, relegado al servicio militar y a matrimonios políticos.\nPero lo que le faltaba en orden de nacimiento, lo compensaba con creces en su conducta. Un hombre severo y sin humor, resuelto ante el peligro y que nunca flaqueaba ni ante las órdenes más sombrías; este distante príncipe captó la atención de Chandraputra. En lugar de $pod_Embrace$ directamente, Chandraputra lo tomó como Ghoul y comenzó a ponerlo a prueba en los valores de la Mayaparisatya para ver cómo se desempeñaba como comandante. Y aunque Indraja era al menos capaz en el mando de la guerra de campo abierto, su verdadera habilidad residía en las mismas artes por las que su madre era infame, y demostró ser un visionario al detectar y cortar los insidiosos conjuras de los asuratizayya antes de que pudieran prosperar.\nY tras dos siglos de experiencia, entrenamiento y pruebas, Chandraputra consideró oportuno recompensar finalmente a Indraja con el Abrazo.\n\nY el [Glossary('Sire','game_concept_Sire_desc')] de Indraja no se sintió decepcionado. Indraja fue un contrapeso crítico y una medida defensiva contra las intrigas de sus enemigos, y era especialmente hábil para mitigar la influencia de los Banu Haqim en la India. Se convertiría en el guardián principal de las cámaras ocultas y refugios que albergaban a los miembros críticos de los Kshatriya, y se convertiría en una pieza invaluable en el eterno juego de ajedrez contra sus enemigos.\n\nDestino futuro\nEl papel de Indraja como guardián de sus refugios y maestro de sus redes de espionaje llegó a salvarlo de lo impensable. Mientras realizaba la seguridad de la tumba de Hazimel, ocurrió la Semana de las Pesadillas, y solo gracias a que estaba atrapado en su interior logró escapar de correr hacia su muerte bajo el despertar de su abuelo.\nCuando la semana terminó, guardaría la tumba hasta que un viajero se revelara con un ojo faltante, y lograría reunir una fuerza lo suficientemente fuerte como para romper finalmente un estancamiento interminable."
 POD_persistentpodlore.desc.793526: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nA menudo, tan poco se destaca en la búsqueda de la guerra el aspecto siempre crítico y fundamental que es su financiación y financiamiento. E incluso para los bebedores de sangre no-muertos, eso no es distinto. Y para la máquina de guerra $pod_cainite$ más grande que jamás haya hecho la guerra en la noche, Mahi realmente tenía mucho trabajo por delante. Hijo del emperador Yuezhi Kushan Kanishka el Grande, creció a la sombra de sus conquistas en el norte de la India.\nPero a diferencia de su hermano mayor Huvishka, a Mahi no se le permitió aprender las artes de la guerra en las que su padre se había vuelto glorioso, sino más bien en su apoyo. Criado para ser el apoyo de su hermano, Mahi al menos destacó en ello, ya que su atención al detalle y su agudo entendimiento y adhesión a la ley mostraron tal dedicación que, junto con las conquistas de su padre, captó la atención de un conquistador mucho más antiguo que buscaba tener otro «hijo».\n\nMahi se sometió a la práctica estándar de sire que Chandraputra llegó a adoptar: primero ser convertido en Ghoul y luego evaluado personalmente durante un siglo de estudio, entrenamiento, teología $pod_cainite$ y pruebas. Mahi era ante todo un financiero y administrador, y Chandraputra vio un potencial inmenso en convertirlo en un contable que pudiera prosperar incluso en una región tan militantemente caótica como el norte de la India.\n\nUna vez que estuvo seguro, Mahi fue $pod_Embraced$ e integrado en los Kshatriya, donde inmediatamente se le asignó la tarea de gestionar las finanzas del clan Ravnos principal. Y con un nuevo y leal propósito hacia los Mayaparisatyas, se negó a fallarle jamás a Chandraputra, quien finalmente lo validó con un principado propio en la guerra contra los Muertos Hambrientos.\n\nDestino futuro\nMahi, debido a que nunca fue un general por encima de su entrenamiento con Chandraputra y sus mandos ocasionales en asedios de refugios, se encontraba muy cerca del epicentro del despertar de su abuelo durante la Semana de las Pesadillas.\nComo la mayoría de su clan, encontró su Muerte Definitiva antes que el progenitor de los Ravnos."
 POD_persistentpodlore.desc.793527: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSripurusha tuvo una vida mortal verdaderamente salvaje. Uno de los numerosos hijos de Gautamiputra Satakarni que crecía sin expectativas de llegar a gobernar, especialmente siendo el quinto hijo. Así que, en su juventud, salía con frecuencia en busca de cada vez más aventuras, fiestas y asuntos sociales, con su lengua de plata sacándolo siempre de problemas. Adoraba la presencia de los demás y tenía un talento natural para reunir y organizar gente.\nPero el desastre se produjo en una reacción en cadena. Con el crecimiento de los ascendentes Satraps occidentales de los Satavahana y el declive del poder de su familia tras la muerte de su padre, lo que llevó a que solo su hermano mayor se convirtiera en rey, él logró salir adelante bastante bien.\nLo cual, sumado a su juventud, captó la atención de Chandraputra.\n\nChandraputra inicialmente tenía pocas esperanzas en Sripurusha, pero quedó impresionado por sus habilidades de organización y su capacidad para aliviar y mitigar conflictos. Podía mantener la cabeza fría y, con el tiempo, incluso empezó a seguir verdaderamente el Camino de la Paradoja.\nTras un periodo completo de entrenamiento, Chandraputra lo comprendió. Tenía a su canciller.\n\nSripurusha fue $pod_Embraced$, y para Chandraputra, en cierto modo, lo salvó del caos del declive del Imperio Satavahana, por lo que le estuvo eternamente agradecido. Chandaputra le recordaba en muchos aspectos a su padre, y era alguien que nunca moriría de vejez.\n\nSe convirtió en el engrane crítico de la maquinaria de guerra Ravnos, manteniéndola sin obstrucciones mientras presentaba un rostro confiado y orgulloso ante los Banu Haqim y los Danava. Incluso llegó a sentirse bastante orgulloso de la única vez que logró encantar a uno de los subordinados de los Many-Armed.\nPero a medida que la Larga Noche avanza, la necesidad de mantener la paz sigue siendo siempre relevante.\n\nDestino futuro\nSripurusha, a pesar de todo lo que logró conseguir, finalmente se encontró con un monstruo al que no pudo encantar cuando, en la Semana de las Pesadillas, su abuelo lo devoró de todos modos."
 POD_persistentpodlore.desc.793528: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nDentro de la Contienda Eterna, la mayoría de los asuratizayya temen al inmortal general Chandraputra. Sin embargo, en otras campañas, se habla de otro general; que mientras Chandraputra ataca en las selvas, este lo hace en campo abierto. Un borrón que muchos no logran distinguir entre hombre o mujer, un ilusionista que forma ciudades enteras por la noche para atraer a los condenados hacia su fin definitivo.\nY para los Cainitas de la India que escuchan esta historia, y finalmente conocen al Príncipe Ravnos de Anahilapataka, no esperan ver al $pod_cainite$ de apariencia joven y con un resplandor inigualable.\n\nArdhagupta era el hijo del segundo emperador del Imperio Gupta, Samudragupta, su mayor conquistador. Pero a diferencia de sus hermanos, Ardhagupta, el pequeño de la familia, no soñaba con el trono. Más bien, debido a su amor por los juegos de estrategia y los textos de antiguos conquistadores, era un amante de la historia. Estudiando la guerra en campo abierto, leyendo las conquistas de su padre y aspirando a las mismas glorias, a menudo cogía armas y cargaba hacia los campos de entrenamiento, enfrentándose a enemigos más grandes y poderosos, pues él también quería ser un conquistador como los de las leyendas.\nUna noche, mientras entrenaba con sus tutores, cayó en la órbita de un Conquistador que vio potencial en él.\n\nChandraputra se llevó a Ardhagupta como su nuevo Ghoul durante el caos de la muerte de Samudragupta y la disputa por la sucesión entre sus hermanos, y encontró en Ardhagupta una mente militar que incluso a él le impresionó. Aunque carecía de experiencia, era astuto y destacaba en áreas en las que el propio Chandraputra tenía dificultades.\nY el entusiasmo de Ardhagupta en la guerra contra los asuratizayya finalmente le dio a Chandraputra al Chiquillo que tanto había estado esperando. $pod_Embraced$ y recibido un mando provisional, Ardhagupta luchaba donde Chandraputra destacaba, pero prosperaba donde él no lo hacía.\nSiendo todavía su segundo, Ardhagupta ascendió rápidamente hasta convertirse en el segundo general más importante al mando de los Kshatriya. Y le encanta cada segundo de ello.\n\nDestino futuro\nArdhagupta desapareció durante la Semana de las Pesadillas, pero una serie de circunstancias provocaron una emboscada de los Fiends que lo lanzó al $pod_torpor$, cayendo en el delta del río Ganges y desapareciendo en sus aguas. Se rumorea que todavía duerme en sus profundidades, esperando el momento de despertar cuando su [Glossary('Sire','game_concept_Sire_desc')] le llame una vez más para completar su guerra."
 POD_persistentpodlore.desc.793529: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial de $pod_wod$.\n\nEntre los sudra de los Kshatriya Ravnos, la mayor parte del tiempo los diversos generales y otras castas se centran en otras campañas y deberes. En su día, habrían contratado a los Aparecidos Marijav para cubrir las lagunas de su servicio donde necesitan operar de día.\nPero ya desde pronto, Chandraputra advirtió que uno solía ir más allá del deber en el servicio, con una mente a la altura y una atención al detalle muy necesaria. Y entre la prohibición del Camino de la Paradoja sobre el $pod_Embrace$ de mujeres (al menos en teoría, que se ignora con tanta frecuencia como los que siguen el Camino de la Humanidad tendrían pensamientos codiciosos siendo pecaminosos) y la necesidad de alguien que opere de día, Chandraputra se cansó de quienes dependían de la moneda. Y Hara fue una elección fácil para un asistente dedicado.\n\nHara ha estado al servicio de Chandraputra como coordinadora de los sudra Kshatriya durante milenios, antaño una Aparecida Marijav y desde entonces convertida en su Ghoul personal. Incluso sin el Vínculo de Sangre, se atiene a los más altos estándares de lealtad, una atención constante al detalle y nunca sucumbe al pánico pese a las adversidades.\n\nY con ello, no hay temor a la traición por parte de quien guarda a los Ravnos de día. Concedida una cantidad de libertad comparativamente asombrosa para un Ghoul, sin embargo nunca ha fallado en sus tareas, nunca ha vacilado y nunca ha puesto en duda su lealtad.\nEs la principal guardiana de Chandraputra mientras este duerme de día, y aunque a estas alturas está tan ligada a $pod_vitae$ que el sol se ha vuelto molesto para ella, se aferra a su tarea por pura fuerza de voluntad y dedicación a su dormitor, y ha traído a numerosos Marijav para fortalecer su red de sudra.\n\nSabe que su lugar no es como vampiro, sino como Ghoul. Y por eso, le parece bien. Mientras su corazón lata, les servirá fielmente.\n\nDestino futuro\nLa increíble extensión del servicio de Hara se probaría una vez más durante la Semana de las Pesadillas, cuando de algún modo logró impedir el despertar de Chandraputra y su destrucción asegurada. Pero quedó mortalmente herida en lo que quiera que ocurriera.\nSe aferró a la vida hasta que las pesadillas terminaron, y Chandraputra pudo despedirse de su fiel asistente, pues ella pudo morir en paz y feliz, sostenida en los brazos del hombre al que nunca admitió amar."
 POD_persistentpodlore.desc.EA0001: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEntre la miríada de vampiros que se encuentran en la órbita del Rey de la Ciudad Maldita, pocos están tan fuera de su elemento como Atsushi. Originalmente fabricante de muñecas en el norte de Japón, su habilidad para fabricar juguetes infantiles atrajo la atención de una compradora bastante inusual, de tez mortecina, cabello extraño y un acento terrible. No le dio importancia en aquel momento, simplemente feliz de tener a alguien tan interesada en su trabajo, hasta el momento en que ella lo mató y lo trajo de vuelta con su sangre, explicándole alegremente cómo iba a fabricar muñecas para ella.\n\nPara siempre.\n\nAtsushi no estaba nada preparado para convertirse en uno de los Banpaia, para ver su habilidad como fabricante de muñecas convertida en fines horripilantes, mientras usaba sus nuevos poderes derivados de la sangre para deformar a súbditos que gritaban en nuevos monstruos. Una culpa interminable lo atormentaba, y todo bajo el miasma de confusión de que su [Glossary('Sire','game_concept_Sire_desc')] estuviera orgullosa de él. Todo empezó a pesarle, a quebrarlo, hasta que finalmente estalló. Se escabulló en el refugio de su maestra y simplemente ansiaba su aprobación. La apoyó, solo deseaba hacer algo bueno, así que cedió y cumplió todo lo que ella le pedía, convirtiéndose en su mayor apoyo, su artesano más orgulloso y en la sombra que siempre la seguía como un perro tembloroso. Todo por el bien del propósito. Todo por el bien de la claridad."
 POD_persistentpodlore.desc.EA0002: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEn su mayor parte, mientras que los cazadores llaman monstruos a los Vástagos, la mayoría lucha contra el monstruo que llevan dentro, esforzándose por aferrarse a su Humanidad. Pero unos pocos seleccionados abrazan al monstruo interior, encontrando las partes más oscuras de sí mismos y utilizando tales indulgencias para encadenar a su Bestia bajo el peso de la depravación. Akane era uno de esos Vástagos.\n\nNacida en la clase noble, Akane tenía todo lo que podría haber deseado en la vida, pero seguía deseando todo lo que no podía tener. Engañaba a su marido con el personal más joven del castillo, robaba a los lugareños por placeres mezquinos y lo encubría; el frenesí de violar las normas crecía más y más hasta que tuvo un escondite especial donde torturaba al campesinado cercano y los asesinaba. Cubrió bien sus huellas, pero cuando tuvo un arrebato cuando dos de sus amantes se casaron, los secuestró y los cosió entre sí. Y casi logra salirse con la suya, solo falló porque su marido fue capaz de ver a través de la mentira. Sus crímenes se ocultaron discretamente para no avergonzar a su familia, y fue sentenciada a muerte. Pero su malicia y crueldad, así como su sutileza, impresionaron a la antigua vampiro Kagaseo. Kagaseo, sin querer darle más poder del que debía, hizo que Hannah la Abrazara a la Banpaia.\n\nAkane descubriría que, entre sus deberes y poderes como vampiro, prosperaba. Se deleitaba fabricando Gárgolas, encontraba delicioso el poder de tomar sangre y adoraba el poder que tenía al vincular a la gente con su sangre. Tras convertir a su antiguo marido en vampiro, transformarlo en una gárgola y luego realizarle un diablerie, su danza salvaje de nuevos horrores y crímenes se elevó cada vez más a medida que ansiaba más y más poder. La manipulación de la carne y la Profanación se convirtieron en sus placeres, en su propósito. Ahora, amasa un harén de titiriteros y monstruos vinculados por sangre, como una verdadera reina de la profanación, ahogando a su Bestia en el placer mientras se entrega sin descanso a sus excesos."
 POD_persistentpodlore.desc.EA0007: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLa primera de las Gárgolas de Bingmayong, formada por la fusión de un Vástago y un Wan Kuei e inspirada en unas pequeñas figuras que Hannah vio en las tiendas, la Gárgola conocida como «Clay» se convertiría en la aterradora sombra de Hannah. Quién era Clay antes de convertirse en gárgola es ahora irrelevante. Formada por un Bushi capturado y un $pod_kueijin$ de la Casa Bishamon. Hannah, que inicialmente no quería desperdiciar nada, hizo a Clay del tamaño de dos hombres, asombrosamente alta y con más o menos el músculo de dos personas superpuestas. Y cuando «Clay» despertó al permitir que Hannah vertiera su $pod_vitae$ en su boca, Clay la reconoció como su maestra.\n\nA diferencia de muchas otras Gárgolas, especialmente en Occidente, Clay tiene muchos más derechos que la mayoría de las Gárgolas. Se le permite a Clay liderar las fuerzas de Hannah, replicarle y salir sin supervisión. Incluso a pesar de las preocupaciones iniciales de los líderes de los linajes, la insistencia de Hannah y la posterior demostración de Lealtad por parte de Clay fueron suficientes para que se le permitiera actuar como siempre lo había hecho. Y ahora, incluso cuando Hannah olvida el Vínculo de Sangre, la propia amabilidad de Hannah hacia Clay las ha convertido en una guardaespaldas ferozmente devota. Clay sabe qué horrores y esclavitud le aguardan si su señora muere. Así que Clay le servirá fielmente hasta la noche.\n\nDestino futuro:\n\nClay protegería a Hannah en las noches modernas, pero una noche, un extraño vampiro con una sangre que le recordaba a Hannah la encontró. Él secuestraría a Clay con su Hechicería de Sangre, descubriría qué la formó y luego mataría a Clay, para después salir a crear su propia versión de Clay en Los Ángeles."
 POD_persistentpodlore.desc.EA0008: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLa primera de la Casta Kintsugi e inspirada en la cerámica que Hannah vio en sus viajes, Porcelain, a pesar de ser uno de sus primeros trabajos, es uno de sus mayores orgullos. Formada por un Bushi quemado casi hasta quedar carbonizado por su entrenamiento y un desastre mentalmente inestable roto por las Pesadillas, Hannah se alegró de «repararlos» al despedazarlos y reformarlos en un nuevo ser, uno tanto íntegro como sano. Y una vez terminado, tras ser separados y vueltos a unir, Hannah la nombró... Porcelain.\n\nPorcelain, como todas las «Primeras» Gárgolas creadas por Hannah, recibió un grado de libertad significativamente mayor que las demás tras el Vínculo de Sangre. La nueva Gárgola era rápida, increíblemente presente cuando se le necesitaba, o «extremadamente carismática» cuando hacía falta. Saber que Hannah era la única maestra que le permitiría tener cualquier grado de libertad fue... liberador, en cierto modo. Así que volcó sus poderes en asegurar que su maestra permaneciera a salvo. Aunque era Leal, Porcelain era implacablemente precisa, se ocultaba tras mentiras y era astuta. Protegería a su maestra de sí misma, incluso cuando Hannah se viera abrumada por la belleza de su propia creación.\n\nDestino futuro:\n\nEn todo menos en el nombre, Porcelain se convertiría en el corazón de la red de Intriga de los Banpaia, siendo la segunda solo después de Akane en influencia, aunque con mucho menos respeto externo. Y, sin embargo, la libertad tan extrema que Hannah le dejó a Porcelain le permitió coordinar una enorme red de espías y agentes para proteger a los Banpaia y, en mayor medida, al Culto Vástago de [Glossary('Mikaboshi','podgloss.mikaboshi')]."
 POD_persistentpodlore.desc.EA0009: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nCualquiera que fuera el vampiro que formara a Iron, ambos eran claramente de estirpe severa. Mientras que Japón está comparativamente plagado de hombres lobo, los Hakken no han podido erradicar a los Banpaia en sus tentativos y peligrosos primeros años. Porque, cuando los lobos salen a jugar, la estatua guerrera en sus refugios abre los ojos, desenvaina una hoja ruin y se dispone a mostrar a esos lobos quién es el verdadero monstruo.\n\nIron fue hecha de un Bushi y una Monomi, fuerte en todas las encarnaciones de su existencia. A diferencia de su contraparte Clay, Iron era pesada y estruendosa, menos elegante pero horriblemente letal. Envuelta en músculos de hierro fundido, Iron era letal desde el momento en que dejó la Ciudadela Malvada. Como Hannah no fue autoritaria con ella, Iron la adoraba, hasta el punto de que, a pesar de que Hannah la creó, Iron la mimaba casi como a una hija. Y con ese fin, cada vez que Hannah celebra su corte, la misma estatua está siempre en la sala, con ojos de fundición que siempre las acechan.\n\nDestino futuro:\n\nLa vigilancia constante de Iron definió su vida eterna. Rara vez abandonando el refugio de Hannah, Iron simplemente se erguía sobre ellas, pero sus deberes se expandieron. Organizando ejércitos y actuando como el puño de metal de Hannah, Iron sería la que aplastaría la disidencia en los Banpaia, la voluntad absoluta de una líder que a menudo era demasiado dócil para actuar. E Iron siempre actuará."
 POD_persistentpodlore.desc.EA0010: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLa primera de los Totai, Ceramic fue creada originalmente como un desenfreno impenitente por parte de Hannah. Formada por una hermosa traidora Chibo y un apuesto y persuasivo Kizoku que se volvió demasiado audaz para su propio bien, la Gárgola que Hannah nombró «Ceramic» fue hecha para ser un objeto de belleza objetiva, y ella estaba más que encantada con el resultado. Como la última de las Primeras, a pesar de lo que muchos asumirían que sería una concubina, Ceramic recibió en su lugar todos los mismos privilegios que las otras Primeras Gárgolas que Hannah creó. Más bien, Hannah quería un romance de cuento de hadas, porque no bastaba con crear una consorte perfecta; Hannah quería que Ceramic realmente la amara.\n\nCeramic llegaría a ser una guardiana del refugio, pero casi siempre fuera de la vista, ocultándose entre otras Gárgolas. Innumerables animales convirtiéndose en ghouls merodeaban el refugio, mientras Ceramic espiaba desde la distancia con Auspex. Y cuando llegaba el momento de la verdad, su capacidad para tejer ilusiones era la última línea de defensa para proteger a su excéntrica pero, por lo demás, laxa maestra. Además, sabiendo que Hannah excusaría cualquier cosa que hiciera, Ceramic se volvería un poco indulgente jugando con sus presas, siendo increíblemente minuciosa en ello y más que dispuesta a convertir las mentiras en dagas letales. Y dado que Hannah rara vez hacía preguntas, Ceramic encontraba la situación perfecta. Ceramic toleraba las «citas para cenar» de cacerías compartidas, diversos regalos de baratijas inútiles y ropa excesivamente elaborada, a cambio de que Hannah, más o menos, le permitiera hacer lo que quisiera. Normalmente, el placer y la estimulación mental de cazar y matar Shih por deporte.\n\nDestino futuro:\n\nCeramic acabaría convirtiéndose en la maestra oculta de los Banpaia. Eventualmente, vincularía a Hannah a ella misma mediante un Vínculo de Sangre en una Boda de Sangre, asegurando su seguridad a largo plazo mientras Hannah permaneciera. Y a medida que las amenazas se acumulan en torno a Japón mientras las Noches Modernas avanzan hacia las Noches Finales, la Titiritera comienza a controlar mejor sus hilos para asegurarse de que cualquiera que amenace su situación perfecta acabe estrangulado."
 POD_persistentpodlore.desc.EA0011: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLa Noche más Negra es la Alianza que custodia la residencia del Shogun de las fuerzas que operan desde las sombras, fuerzas que están más allá de su comprensión y que deben seguir reglas diferentes al resto del mundo. Tal es la naturaleza de sobrevivir en el mundo nocturno. Y en ese tiempo, sin duda la serpiente más astuta de ese jardín es el Guardián Sombrío.\n\nKakue es un misterio para la mayoría de los miembros de su propia casa, una fuerza en la noche que rara vez abandona Kamakura. Siempre oculto a la vista, diciendo pocas verdades y siendo con mucha diferencia el más amargado contra la influencia de los [Glossary('Dharmas','podgloss.dharma')], el escape de Kakue del Infierno es principalmente una conjetura por parte del resto de su [Glossary('Wu','podgloss.wu')]. Según su propio testimonio, fue al [Glossary('Kakuri','podgloss.kakuri')] y llegó a ser tan irrelevante y digno de ignorar que los [Glossary('Shikome','podgloss.shikome')] y el [Glossary('Emma-o','podgloss.emmao')] olvidaron que existía. Aunque parezca un poco absurdo y venga de un hombre conocido por sus mentiras, su [Glossary('Wu','podgloss.wu')] sospecha que esto bien podría ser cierto. Y dadas sus habilidades con la ofuscación y la sedición, es soberbio ocultando la verdad y lanzándola a plena vista.\n\nKakue, sin embargo, trabaja para fines mayores. Tiene sospechas bastante profundas sobre los rumores de una horda de Tsuchigumo más allá de las estepas en el continente que viajan en las sombras de los mongoles y los Yuan. Al resto de los Bishamon, les alimenta con verdades y mentiras para radicalizarlos contra el continente, mientras se niega a autenticar nada que pueda hacer que se abran a esta amenaza más profunda. Y a medida que el ciclo de mentiras y creencias aumenta, consigue su bendito silencio frente al parloteo e insustancialidad de los ancestros en el continente.\n\nDestino futuro:\n\nKakue siempre sería central para la Noche más Negra. Sin embargo, su vehemencia contra los Tsuchigumo marcaría su fin en algún momento, cuando una noche, poco después de la llegada de los portugueses a Japón, fue encontrado como un montón de carne podrida; la única pista del asesino fueron unos vapores negros humeantes..."
 POD_persistentpodlore.desc.EA0012: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nUn visionario de la ingeniería y las obras; muchos herreros, albañiles y carpinteros en Kamakura reciben su financiación de este mecenas oculto. Y a su alrededor, sus obras se unen para crear una obra mayor, todo con el fin de proteger y servir de escudo contra las influencias externas.\n\nNorinaka es ese mecenas, y un fugitivo del Infierno de los Mares Ardientes. Asesinado por piratas coreanos mientras ayudaba a su aldea a construir muelles al ser arrastrado al mar con una cuerda lanzada desde la popa, Norinaka nunca pudo superar su muerte. Aunque muchos en el Bishamon son aislacionistas, Norinaka lo lleva a un nivel completamente nuevo, alimentándose exclusivamente de extranjeros si puede evitarlo y sintiendo un placer especial por la arquitectura que carece por completo de influencia extranjera. Dentro de Kamakura, utiliza la magia arquitectónica para confundir y desorientar a los muertos, y provocar que las cabezas de quienes no están familiarizados con el lugar den vueltas de confusión cuando pisan los terrenos que él ha diseñado. Más allá de eso, es un arquitecto genuinamente hábil, increíblemente concentrado y meticuloso en su trabajo. Cree sinceramente en la causa del Bishamon y, por eso, es casi incorruptible. Es un pilar fundamental en el secreto y la planificación de las obras más profundas de la Noche más Oscura, y es crucial para sus operaciones continuas mientras protegen a los Shoguns.\n\nDestino futuro:\n\nNorinaka mantendría su posición en el Bishamon, y protestaría y se desataría contra el declive del Bishamon con el fin del aislacionismo de Japón. Se volvería rabiosamente xenófobo y, hasta cierto punto, desequilibrado, y una noche, su deseo de acercarse a los extranjeros para matarlos lo llevaría a su fin, cuando viajó al extranjero para intentar cazar, solo para que un refugio temporal fuera alcanzado por un bombardeo incendiario durante la Segunda Guerra Mundial."
 POD_persistentpodlore.desc.EA0013: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nNacido nueve meses después de un saqueo pirata, criminal de carrera y, en términos generales, un azote social y una vergüenza para el resto del Bishamon desde su iniciación, cuando se trata de la necesidad de un guerrero para proteger las instituciones mortales de poder de la interferencia sobrenatural, Ujiyori no tiene parangón. Ujiyori nació de la violencia y vivió una vida de violencia. Abandonado temprano por su madre, que no quería saber nada de él debido a la naturaleza de su nacimiento, y comenzando su vida como un niño ladrón y rufián, sus crímenes crecieron más y más, convirtiéndose en un bandido y asesino a sueldo. Sin embargo, a pesar de las lucrativas oportunidades de las Guerras Genpei, encontró su fin en ellas, cuando un oficial dedicado hizo que un grupo entero de guardias le tendiera una emboscada y finalmente pudiera organizar su ejecución. Y fue castigado aún más al ser condenado a la Ciudad Demonio. Ujiyori era, sin embargo, una fuerza astuta y carismática, y el dulce hablar con muchos Rakshasa le permitió encontrar a un Dragón Azotador para escapar. Cuando regresó al mundo mortal con un Segundo Aliento, celebró con una escapada maratónica que dejaría tras de sí a numerosos Dhampyres.\n\nUjiyori es una anomalía entre los Bishamon, y especialmente entre la Noche más Negra. Es un Dragón Azotador, pero sigue siendo profundamente leal a la Casa. Aunque fue instruido más allá de Japón, regresó a ella y la llama su hogar fundamental. A pesar de formar parte de una Casa que se comporta con honor, es un pervertido libertino que deja innumerables bastardos a su paso.\n\nSin embargo, es fundamentalmente útil. Carismático y espontáneo, puede adaptarse a las amenazas, y su experimentada destreza con la espada y su habilidad como cazador de hombres y bestias lo hacen invaluable. Y, además, sus bastardos Dhampyres son útiles como una red de aliados. Y para col de, con su carisma magnético, puede atraer la mirada de hombres y mujeres por igual. Así que su [Glossary('Wu','podgloss.wu')] lo tolera, ya que su mezcla de utilidad a pesar de sus hábitos desenfrenados le otorga un lugar en el [Glossary('Wu','podgloss.wu')].\n\nDestino futuro:\n\nAunque los Caminos y el propósito de la Noche cambiaron, Ujiyori nunca escapó de su naturaleza. Y debido a ello, su pasión desenfrenada por la vida y su alegría por la sensación lo llevarían a ascender al [Glossary('Cien Nubes','podgloss.hundredclouds')], dejando a un amante confundido bajo él, desconcertado por saber a dónde se había ido su amante."
 POD_persistentpodlore.desc.EA0014: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nLos Uji son, en su esencia, orgullosamente divergentes de los Muertos Hambrientos del continente. Uno de los puntos de su divergencia es cómo se trata a sus Dhampyres. Los Dhampyres entre los Bishamon son una cuestión de linaje, de prestigio y de estatus. La mayoría, sin embargo, no suele encontrar el camino de vuelta a los sistemas de poder y edificios de cargos que definen a los Uji. Al menos, normalmente.\n\nHiinashi es una figura tranquila, reflexiva y voluntariamente deferente con la Noche más Negra. Sin embargo, una de las andanzas de Ujiyori por una familia joven que tenía vínculos más profundos con una organización conocida como «Jidai» le ha otorgado una herencia única de la familia de su madre. Como puente entre el Jidai y el Bishamon, tiene acceso a Artes y medios que los Muertos Hambrientos suelen temer, pero es tan devota que el resto del [Glossary('Wu','podgloss.wu')] duda seriamente de que llegue a conspirar contra el Bishamon. E incluso así, lo único que el Bishamon puede afirmar sobre este orden oculto es que tienen puntos de vista similares al resto del mundo, por lo que se le permite transitar por esa línea. Y así, esta «Hechicera» se ha convertido en una parte fundamental del [Glossary('Wu','podgloss.wu')] debido a que sus poderes compensan activamente aquello de lo que carece el resto del [Glossary('Wu','podgloss.wu')]. Sus protecciones pueden repeler espíritus, sus creaciones pueden arder como el fuego, sus conjuros pueden perdurar y sostenerse. Y además, es increíblemente devota a Yasutami de formas que muchos susurran que su relación podría ser más profunda... pero tales rumores nunca han sido corroborados. Y, como mínimo, es una piedra angular crítica en la oculta Corte Bishamon de Kamakura.\n\nDestino futuro:\n\nHiinashi envejecería, y ni una sola vez flaqueó en su devoción a la Noche más Negra. Desde 1227, cuando era una mujer adulta, hasta 1678, permaneció firme en su servicio a la Casa Bishamon. Aunque sus vínculos con el Jidai morirían con ellos, su legado duradero dentro del Bishamon la elevaría al estándar de oro de lo que un Dhampyr debería aspirar a ser." 
 POD_persistentpodlore.desc.EA0015: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nPara el resto de los Uji, en términos generales, el pueblo Emishi pasaba desapercibido, ya que entre su propio desprecio por ellos y la ausencia de una estructura de Corte para absorber a los miembros feroces que escapaban del Infierno, en su mayor parte, no dejaron legado entre los Uji. Sin embargo, unos pocos elegidos fueron encontrados en los Infiernos y traídos al mundo de los vivos por las Augustas Cortes del continente. Esperaban que quizás pudieran utilizarlos como una herramienta contra los Uji, nativos de Japón que podrían presentar un rostro para las Augustas Cortes frente a las hegemonías de los Uji. Y tuvieron éxito más allá de sus peores pesadillas.\n\nToshie fue la única alma que sobrevivió cuando su aldea natal fue subyugada por los predecesores de los samuráis, sin llegar siquiera a ser una nota al pie. Los ancestros que la trajeron la encontraron como un manojo de nervios, llorando constantemente y arañándose las muñecas y los tobillos donde había sido arrastrada por caballos. Era propensa a ataques de violencia ante la mención de la Ciudad Demonio, e incluso sus mentores sospechaban que podría haber ido originalmente al [Glossary('Kakuri','podgloss.kakuri')], solo para ser intercambiada por [Glossary('Emma-o','podgloss.emmao')]. Su educación en el Mundo de la Noche fue larga y dura, pero finalmente logró comprender al Tigre Diablo [Glossary('Dharma','podgloss.dharma')]. De hecho, una vez que lo comprendió, pareció entregarse a él con un celo salvaje que avergonzó incluso a sus mentores. Y por esa razón, nunca se le debería haber permitido volver a casa.\n\nTras su regreso, comenzó a acechar las tierras asentadas que los Emishi alguna vez llamaron hogar, convirtiéndose en un monstruo sediento de sangre que ahora asociaba a todo el pueblo Yamato con [Glossary('Emma-o','podgloss.emmao')], y como una Garra de Hierro, todos debían morir. Mortales, Lobos, Ladrones de Rayos, Tsuchigumo y Gaki debían morir por igual. Solo los obstinados remanentes Emishi y los Ainu se libraron de su ira. Y a medida que los Uji comiencen a consolidarse, su frenesí como monstruo de la noche será puesto a prueba.\n\nDestino futuro:\n\nToshie solo pudo cazar durante un tiempo. Finalmente, los agentes de Kishu lograron abrumarla y fue paralizada con una vara de hierro en el pecho. El maestro del Cónclave de las Estrellas observó cómo su artesano personal remodelaba a Toshie y a uno de sus enemigos más odiados en una nueva y leal bestia de arcilla y $pod_vitae$." 
 POD_persistentpodlore.desc.EA0016: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEn vida, Nariaki era el hijo de un comerciante japonés y de una antigua mujer nómada de la estepa que se asentó en Corea, y su vida estuvo definida por constantes viajes entre Corea y Japón. Aunque siempre estuvo cerca de su padre, interiorizó muchas lecciones de su madre y las amó desde su nacimiento. Sin embargo, tales corrientes son siempre caprichosas, y las tormentas regulares entre la península y las islas golpearon sus barcos; Nariaki se ahogó y fue arrastrado al Infierno de los Mares Hirvientes. A pesar de esto, aplicó las lecciones de navegación que su padre le enseñó y las habilidades de supervivencia de su madre para sobrevivir. Y con el tiempo, logró deslizarse a través de una caverna submarina y despertar en las costas de Tsushima.\n\nCuando el Uji lo encontró, la entonces naciente Casa Genji era una de las pocas casas que lo acogió. Por haberlo aceptado, Nariaki es profundamente protector con su Casa. Una fuerza constante y calmada, ha destacado como la principal aprendiza de la Espada Celestial, con una franqueza dedicada e implacable muy bien merecida. Además, su constante exposición a la moneda y al comercio lo hizo experto en facilitar el intercambio y, por eso, se convertiría en una estrella ascendente y prueba de lo que los Genji representan: que pueden funcionar perfectamente.\n\nDestino futuro:\n\nNariaki siempre fue un cauteloso defensor de que el Uji estuviera dispuesto a relacionarse con otros sobrenaturales. En las Noches Modernas, mantiene un contacto estrecho con todos los que puede encontrar. Ocultistas, las Cortes de la Bestia, Pequeños Dioses y más; se sitúa en una red más amplia con el fin de aprender todo lo que pueda."
 POD_persistentpodlore.desc.EA0017: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nPara muchos capataces, es fácil desapegarse de sus trabajadores. Sin embargo, en la muerte, Sukehisa se vio obligado a afrontar el peso de lo que hacía. En su vida, Sukehisa fue un capataz que supervisaba la construcción de castillos y fuertes, y uno muy brutal. Innumerables esclavos de guerra murieron en sus procesos, y muchos de los que fueron brutalizados por él resentían el hecho de que muriera de vejez. Sin embargo, recibió su merecido en la Ciudad Malvada. Y solo cuando finalmente fue quebrantado y soportó cuatro vidas de trabajos serviles, encontró una escapatoria.\n\nDesde su regreso, se ha dedicado a lo contrario. El Sukehisa que regresó ya no era el bastardo avaro y de corazón frío. El hombre que volvió irradiaba calidez, tenía un nuevo amor por la no-vida más allá de la Ciudad Malvada y una generosidad a su altura. Dispuesto a adaptarse a los tiempos, gravitó hacia los Hiyorumi, aprovechando la oportunidad de abrir hogares y lugares seguros para los desplazados por el conflicto y la guerra. Al conectar con la gente, creó una red de informantes que se extendió por todo Japón y que eran leales a su benefactor. Y ahora, mientras los mongoles conquistan más territorios y los [Glossary('Anda','podgloss.anda')] se acercan, no faltan refugiados. Todo lo que necesita para ser feliz es superar la obstinada estrechez de miras de los Bishamon y dejar claro lo que conlleva ser un avaro odioso.\n\nDestino futuro:\n\nComo filántropo, Sukehisa hizo todo lo posible a pesar del aislamiento de Japón. Cuando terminó el periodo aislacionista de Japón, se alegró inmensamente e intentó extender su labor filantrópica a lugares lejanos. Sin embargo, como ferviente defensor de la esperanza y la generosidad, fue marcado para morir por [Glossary('Mikaboshi','podgloss.mikaboshi')], y su [akuma|E] cumplió su cometido, poniendo fin a su historia de una vez por todas."
 POD_persistentpodlore.desc.EA0018: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nOriginalmente solo Kogoko, Kogoko-no-Nukekubi es una de las pocas y preciosas discípulas de uno de los pocos [Glossary('Bodhisattva','podgloss.bodhisattva')] verdaderos que tiene el Uji. Y con ello, ya ha destacado de formas que pocos estudiantes han logrado. Originalmente solo era una sirvienta en un restaurante que murió de disentería y fue condenada al Infierno de No Tener Dinero; escapó gracias a la generosidad de su mentora, que buscaba estudiantes en aquel entonces. Y entre muchos de ellos, Kogoko tenía algo que Nukekubi buscaba. Su civilización fue algo apresurada, ya que Nukekubi tenía un propósito para ella.\n\nTan pronto como Kogoko-no-Nukekubi comprendió qué era y cuál era su papel en el Uji, fue enviada como parte de una misión comercial a Indonesia, buscando a un maestro que hubiera desarrollado un nuevo Shintai. Kogoko-no-Nukekubi se presentó ante el Dragón Rojo con regalos de su mentora y numerosos y poderosos Pactos Espirituales, a cambio del Shintai de Carne. Piyau aceptó solo bajo la prohibición de que solo se enseñara a mujeres, y la propia Kogoko-no-Nukekubi estuvo de acuerdo. Inmediatamente regresó a casa y compartió el arte con Nukekubi. Y aunque Kogoko-no-Nukekubi fue quien trajo el Shintai de Carne a Japón, fue su mentora quien lo definió. Ahora, mientras Nukekubi planea su mayor desarrollo para la Casa, Kogoko-no-Nukekubi espera pacientemente en la retaguardia, sabiendo que a su debido tiempo su mentora la recompensará.\n\nDestino futuro:\n\nCon el tiempo, Nukekubi se retiraría de la política, cambiando su papel al de una guía distante. La segunda líder de la Casa sería Kogoko-no-Nukekubi, quien asumiría el cargo con orgullo. Sin embargo, Kogoko-no-Nukekubi llegaría a detestar la política y más tarde pasaría el cargo de liderazgo a su propia futura estudiante, Danrin-no-Nukekubi, para luego retirarse de la política por completo. Rara vez se le ve en las noches actuales, habiéndose desvanecido en la oscuridad."
 POD_persistentpodlore.desc.EA0019: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nAunque muchos de los parientes de Izanami permanecen ocultos, debido a la naturaleza de su [Glossary('Dharma','podgloss.dharma')], que se mueve peligrosamente cerca de lo profano de los Reyes Demonio, la codificadora de su camino siempre fue la excepción. Antigua, terrible, magnífica y cruel, Yūki es un ejemplo del camino, temida y respetada por igual. Muy pocos de sus contemporáneos del Uji saben cómo era cuando era joven. Algunos susurran que incluso se civilizó a sí misma. La verdad es más compleja.\n\nYūki es una de las Gaki más antiguas de Japón. Nacida en los primeros días del periodo Yayoi, cuando el corazón de Yūki aún latía, la gente de Japón apenas comenzaba a construir distintivos túmulos funerarios en forma de cerradura. Pero para Yūki, eso importaba poco. Ella era simplemente la novia de un antiguo Mago japonés. Eran felices juntos, pero con el paso del tiempo, tuvo la desgracia de morir debido a un invierno particularmente brutal, y su marido hizo todo lo posible por salvarla de la muerte. La buscó y, para su horror, la encontró en el Infierno de la Magia Malvada. Intentó negociar por ella, pero cuando el ritual estaba por completarse, un descuido causó su fracaso y la condenación de Yūki. Ante este fracaso, Yūki vio cómo su marido la abandonaba y la dejaba en el infierno. Y en ese momento, lo comprendió. Él volvió a ver a su esposa fallecida allí donde ella era arrastrada de vuelta al infierno, cubierta de cicatrices autoinfligidas y de la sangre de su aldea, y tuvo una revelación de las revelaciones que definirían a los Hijos de Izanami.\n\nYūki se considera a sí misma un modelo para los Hijos. Lo suficientemente depravada como para hacer que incluso los endurecidos Tigres Diablo se encojan ante ella; cuando el Uji la busca, a menudo la encuentran en una cueva de tormentos indescriptibles, donde mortales, no-muertos y demonios aúllan juntos mientras ella busca a otros que han caído como ella. Con su cuerpo convertido en un lienzo de agonía, pocos se arriesgarían a pedir su sabiduría. Afortunadamente para el Uji, al menos, probablemente, está de su lado.\n\nDestino futuro:\n\nYūki ignora en gran medida la insustancial política de sus contemporáneos y, en su lugar, construye su culto. Como la Profeta de Izanami, no tiene rival en sabiduría dentro del Culto, y lo sabe. Y en el giro de la Rueda en las Noches Modernas, sueña con un mundo que no sea de un Emperador Demonio, sino de una Reina Cadáver...\n\nIzanami está tan cerca. Espiralando y girando sobre sí misma como un dragón colosal."
 POD_persistentpodlore.desc.EA0020: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEn la base del monte Daisen, hay un templo oculto, parcialmente recluido dentro de la Umbra. Los nuevos estudiantes de todos los Clanes son bienvenidos, y sus graduados son respetados en todos los Grandes Clanes... pero el coste de ser estudiante allí es elevado. En su núcleo, la maestra del templo es una señora implacable. Y su Dios no lo querría de otra manera. Yaeko fue una vez una doncella del santuario, cuya vida siempre volvía al fuego. Nacida a la sombra de la montaña, siempre ha llamado a Daisen su hogar. Como Doncella de los Santuarios de allí, se dedicó a apoyar a los monjes ascéticos en el santuario del Dios del Fuego, Kagutsuchi-no-mikoto. Y estaba tan devota a su dios que, cuando un rito fallido provocó que su santuario ardiera, rezó en lugar de huir, confiando en que él la protegería. Incluso pensó que era una prueba cuando se encontró en el Infierno de los Mares Ardientes, atada a madera siempre llameante en los mares, bañada en alquitrán para arder eternamente. Sin embargo, resistió, rezando a su dios. Sus plegarias fueron tan intensas que Haha No Fukami no pudo tolerarlo más y la devolvió al mundo de los vivos.\n\nTras recuperar la lucidez, regresó al cuidado de los Santuarios. Sin embargo, su nuevo miedo instintivo al fuego la angustiaba, así que puso a prueba su fe una vez más, clavándose en un poste de hierro en el templo y prendiendo fuego al foso. Y en la agonía del rito, fue marcada eternamente, pues tuvo visiones de un espíritu que se llamaba a sí mismo el alma vasalla de Kagutsuchi, un chico hecho de puro fuego con ojos y cabello bermellón, transformándose en un terrible dragón con rubíes hirvientes como escamas. Y entonces lo comprendió. Cuando el incendio amainó, emergió aún íntegra, quemada pero con su propósito claro. Yaeko construiría un templo alrededor del foso, y crearía otro para entrenar estudiantes.\n\nDestino futuro:\n\nEl acto de fe insana de Yaeko y su maestría sobre el Shintai de la Llama la convirtieron en una mentora seductora, pero también en la maestra del temido Rito de Daisen del Dios del Fuego. Sigue en Daisen hasta el día de hoy, como una de las tres monjas que supervisan el rito y vigila este duro crisol de entrenamiento."
 POD_persistentpodlore.desc.EA0022: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nA hombre militar hasta la médula, Nagamatsu estuvo entre los primeros de la clase Bushi en servir en las guerras del periodo Heian, los precursores de los Samurai. Un noble menor, obtuvo gran reconocimiento en batalla y en su servicio, y vio un gran éxito personal civilizando a los bárbaros del norte. Pero vivir por la espada es morir por la espada, y pereció en una emboscada. De una vida de violencia, obtuvo sus tormentos en la Ciudad Demonio, para su consternación. Pero Nagamatsu era tan obstinado como decidido, y con resolución de hierro y voluntad de esperar y resistir, desgastó un muro en el Infierno y escapó, regresando al mundo de los vivos. Dentro del Uji, Nagamatsu se sintió atraído por el Uji Taira, ya que encontraba el nuevo mundo desorientador y confuso. Le gustaban las cosas tal como eran y despreciaba el cambio. Se convirtió en un modelo para el clan y se entregó con alegría y profundidad al servicio y a la devota atención de sus nuevos señores. Sus viejas conexiones se convirtieron en un acceso a los Samurai, permitiendo que el Uji mantiera su relevancia. Y con ese fin, no ha cesado en su servicio.\n\nDestino futuro:\n\nNagamatsu se definiría por su servicio y por la guerra. Llegó a ser temido y odiado por su brutal mentalidad de combate y por usar a sus agentes para asesinar rivales a plena luz del día. Y, en un giro de las circunstancias más irónico, cuando los estadounidenses dispararon contra el refugio donde su cuerpo dormitaba, su cuerpo fue lanzado al cielo y quedó reducido a cenizas antes de que su cadáver tocara el mar."
 POD_persistentpodlore.desc.EA0023: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEntre los Uji más conservadores del Mundo Nocturno de Japón, muchos entre los Grandes Clanes ven como peligrosos a los constructores de barcos y artesanos que desean aprender más. ¿Pero desperdiciar todo ese conocimiento? Ieko no puede soportarlo. Nació no muy lejos de Enuma, de constructores de barcos y marineros. La proximidad al Hoshi Ryokan siempre significó negocios, y su familia prosperó inmensamente gracias a ello. Pero las costas son algo caprichoso. Un día, mientras probaba un barco, Ieko cayó por la borda, una corriente la arrastró mar adentro y se la llevó en ese instante. Y perecer de esa forma le valió un lugar en el Infierno de los Mares Ardientes.\n\nSin embargo, entre madera a la deriva y restos, Ieko encontró un medio para escapar. Al construir un nuevo barco, pudo navegar libremente, y desde su barco forjado en el infierno despertó en el mundo de los vivos. Navegó de vuelta a casa y fue encontrada por el Uji. Pero aun así, carecía de rumbo, ya que pocos querían sus habilidades. Así que se sintió atraída por quienes sí lo hacían, los Echizen. Y desde que cayó en la órbita de Kasumi, ha sido feliz por primera vez desde sus días mortales.\n\nDestino futuro:\n\nLa habilidad de Ieko para la construcción naval fue fundamental para el éxito de los Echizen, y su proximidad a Kasumi le permitió adquirir suficientes habilidades de liderazgo como para dirigir el Clan tras la muerte de Kasumi. En la era de las Noches Modernas, sigue liderándolos y ha mostrado gran interés en la construcción naval moderna y en cómo puede aplicar esas nuevas técnicas de construcción."
 POD_persistentpodlore.desc.EA0024: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nQuién era Koreko antes de su muerte importa poco. Su nombre ni siquiera era el que tenía en vida, sino uno nuevo otorgado por [Glossary('Emma-o','podgloss.emmao')], quien odiaba su nombre original. En otro tiempo, podría haber despreciado tal degradación. Ahora, lo ve como algo tan fundamental para ella como lo es respirar para un mortal. Desde el comienzo de su servicio como [Glossary('Shikome','podgloss.shikome')], Koreko se ha convertido en la principal supervisora de las prisiones en [Glossary('Kakuri','podgloss.kakuri')]. Ella es la encargada de encadenar a los hombres que encuentran, de negarles el descanso y de frotar sus tormentos en sus caras. Disfruta de esto y le encanta gratificarse con sus sufrimientos. Y, sin embargo, en el momento en que una de sus superiores [Glossary('Shikome','podgloss.shikome')] acude a ella, se muestra inmediatamente deferente y sumisa.\n\nEs una sicofanta útil, cruel y mezquina, y [Glossary('Emma-o','podgloss.emmao')] encuentra gran satisfacción en la criatura en la que moldeó a Koreko. Naturalmente, su capacidad y habilidad para quebrantar personas la convirtieron en la candidata ideal para el grupo de tareas enviado a quebrar las fuerzas de la Ciudad Malvada. En particular, siente una curiosidad desmedida por las rumoreadas artes de modelado de carne que se dice que poseen estos Infernalistas. Con eso, se le hace la boca agua solo de pensarlo. Está ansiosa por quebrarlos a todos."
 POD_persistentpodlore.desc.EA0025: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nUna más entre las indistinguibles [Glossary('Shikome','podgloss.shikome')], Haneko es en realidad bastante singular. Porque, a diferencia de todas las demás [Glossary('Shikome','podgloss.shikome')], es la única cuya no-vida se parece de verdad a la mortal. Su recuerdo de aquella, por supuesto, está fragmentado y hecho añicos, pero Haneko siempre fue una asesina que usaba su cuerpo como señuelo. ¿Y con qué fin? Porque podía. Le gustaba matar. Asesinó a decenas de personas, hasta que, al matar a un guardia, acabó con alguien al que se echaría demasiado en falta, y halló su fin en una ejecución. Y por su vida sin amor fue condenada a [Glossary('Kakuri','podgloss.kakuri')], donde la abrumadora malicia que emanaba de ella llamó la atención de las [Glossary('Shikome','podgloss.shikome')].\n\n[Glossary('Emma-o','podgloss.emmao')] quiso al principio descartarla, pero la curiosidad le bastó para preguntarse si podría crearse una [Glossary('Shikome','podgloss.shikome')] a partir de un alma que ya se le pareciera, en lugar de una inocente. El resultado fue... un éxito, en cierto modo. Tenía el aspecto y estaba igual de muerta por dentro, pero era errática, desquiciada y propensa a súbitos arrebatos de gritos y sensaciones. Era una cazadora implacablemente eficaz, pero a veces perseguía objetivos que no existían y pasaba por alto los evidentes. Está completa y absolutamente loca, y aun así es lo bastante eficaz como para que [Glossary('Emma-o','podgloss.emmao')] la conserve, al menos por la lección. De hecho, quizá sea esa la razón de que la incluyeran en el grupo de trabajo destinado a destruir a [Glossary('Mikaboshi','podgloss.mikaboshi')]. Su propia locura es un anatema para la monotonía que [Glossary('Mikaboshi','podgloss.mikaboshi')] encarna, y sus propios desvaríos y espasmos podrían bastar para romperla por completo."
 POD_persistentpodlore.desc.EA0026: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nFamosa por sus obras maestras y su artesanía, la Casa Echizen no suele ser conocida por sus guerreros. Sin embargo, hay una excepción. Algunas armas fabricadas por ellos nunca son utilizadas por nadie que no sea su creador. Y esas armas son las más temidas. Por esa razón, Akira es el más temido de los Echizen.\n\nNunca fue una persona particularmente extrovertida. Incluso de niño, siempre tuvo un comportamiento sombrío y evitaba la mirada pública. Hijo de un herrero, por suerte encontró una gran alegría en la creación. Amaba esto más que a la gente, hasta cierto punto. En realidad, lo único que podía competir con su amor por la metalurgia era su amor por herir a las personas. Siempre le gustó cuando los transeúntes intentaban robar, ya que siempre aprovechaba la excusa para reventarle el cráneo a alguien con un martillo. Lo cual acabaría siendo su perdición, cuando mató al hijo de un noble en la ciudad y pagó por ello terminando en la Ciudad Demonio. Y allí, resultó ser increíblemente útil como fabricante de armas. Y había suficientes enemigos para practicar. Se volvió verdaderamente temible con la hoja, de una clase que pocos otros Muertos Hambrientos podrían aspirar a igualar con tanta experiencia como la que él obtuvo. Y tras escapar, buscó a aquellos que no le molestaran mientras fabricaba cosas. Naturalmente, cayó en la órbita de Kasumi y se unió a los Echizen.\n\nDestino futuro:\n\nLa falta de interés de Akira por el poder le ayudó enormemente. Aunque hizo poco para detener la muerte de Kasumi, le irritó profundamente que su trabajo se viera ahora retrasado por el conflicto, y juró la destrucción de los Tsuchigumo por perturbarle. Su búsqueda implacable de ellos acabaría convirtiéndolo en una espina constante en su costado."
 POD_persistentpodlore.desc.EA0027: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nLa mayoría de los Uji, cuando se les pregunta qué debería hacerse con los Tsuchigumo, suelen andarse con rodeos: que erradicarlos sería costoso y estaría mal hecho, y que hay preocupaciones mayores. Sin embargo, cuando se le pregunta a una de ellos, sus ojos arden con un celo furioso y afirma las amenazas y los monstruos ocultos que acechan en Satsuma, Hokkaido y Shikoku. Un odio que solo puede nacer en lo más hondo del corazón. Al fin y al cabo, los Tsuchigumo la mataron. Y a su hermana se la llevaron y la condenaron para siempre. Cuando aún respiraba, se contentaba con una vida tranquila en el norte de la isla principal de Japón, pero una noche llegaron demonios pálidos con horrores y se llevaron a algunos en la oscuridad. Los condujeron a una fortaleza despreciable, donde Mikoto fue despedazada y convertida en un ser amalgama, hasta que este murió en alguna batalla. Pero la bestia perduró, mientras su cadáver engrosaba su masa.\n\nFue a la Ciudad Malvada, condenada por la sangre inmunda de la progenie. Pero tras ser una pieza literal de una máquina biológica, la falsa no pudo retenerla. La bestia, aún tambaleante, reventó cuando ella escapó y su cuerpo se restauró; huyó al sur y fue hallada por los Uji. Por ello, Mikoto es entre los Uji la mayor experta en los demás bebedores de sangre nativos de Japón. Y insiste en que hay que destruirlos a todos. Ya sean aduladores que acechan, infernalistas del dinero o bandidos ligados a la tormenta, todos son una amenaza, y su sangre lleva consigo una condenación tan perversa que incluso su propia condenación, tal como la enseña Xue, no es nada comparada con ella. Y no dejará de tocar ese tambor hasta que el azote sea erradicado.\n\nDestino futuro:\n\nMikoto sería, entre los Uji, el principal obstáculo para los Vástagos nativos de Japón, hasta que una noche, mientras defendía la destrucción de los más amistosos, un hábil orador solicitó un parlamento. Nunca escapó de la pesadilla en la que él la arrojó."
 POD_persistentpodlore.desc.EA0028: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nLa traición es un pecado difícil de expiar. Karuki lo sabe y no intenta ocultar sus transgresiones pasadas; al contrario, trabaja sin descanso y con constancia para enmendarlas. En su vida mortal, Karuki fue una de las Go Kamisori Gama, un oficio de magos asesinos. Sin embargo, sentía unos celos profundos de su maestro y, conspirando con dos de sus compañeros de estudios, ideó una forma verdaderamente brutal y sádica de matarlo y condenarlo a los Mil Infiernos. Pero la intervención de Jizo el Caminante hizo que su maestro regresara, y ella recibió una justicia rápida y merecida. De los tres traidores, Karuki fue la única que aprendió de verdad su lección en los Infiernos. Al caer en el Infierno de ser Despedazado, todo lo que hizo a su mentor le fue devuelto multiplicado por cien. Y solo cuando, en el nivel más profundo posible, comprendió lo que había hecho y deseó de veras expiarlo, despertó en la tumba poco profunda en la que su víctima y verdugo la había dejado. Y fue él quien la encontró.\n\nKaruki se humilló ante él, suplicó perdón e incluso le permitió matarla de nuevo si creía que lo merecía. Pero Kuro-sama decidió ponerla a prueba y la educó con la más brutal eficiencia. Y cuando llegó su prueba final y él dijo que debía morir, ella lo aceptó. Entonces él le dijo que se ganara su redención.\n\nDesde entonces ha servido como la principal asesina de los Uji en la Cuarta Era y llegaría a fundar el Clan Uji de los Iga. Sin embargo, es exigente con sus objetivos y siempre se asegura de que lo merezcan. Después les da una muerte rápida e indolora. En su conducta personal es adusta y reservada, exigente y profesional, y aún se considera una bestia que se esfuerza por ser mejor. Pero por fin se está permitiendo abrirse. Abundan los rumores de citas secretas con Taira Kaito. Karuki ha pasado tanto tiempo expiando que quizá por fin esté intentando volver a aprender a vivir.\n\nDestino futuro:\n\nEl Clan Iga de Karuki nunca sería tan grande como los demás Uji, y Yukio la superaría en objetivos. Sin embargo, a la hora de acabar con objetivos internos, Karuki seguía siendo una antepasada fácil de convocar. Todavía ocupa su cargo en las noches modernas. Y, si los rumores son ciertos, las citas con Kaito florecieron en numerosos dhampyr que ayudan a los Iga."
 POD_persistentpodlore.desc.EA0029: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nNinguna organización es jamás verdaderamente homogénea. Incluso los Uji más aislados y desafiantemente conservadores de Japón tienen sus excepciones. Y esta procede del lugar más extraño. Nacido de auténticas líneas Taira, Kaito sigue siendo un contraste asombroso con el resto de los Uji a los que lo obligaron a unirse.\n\nKaito nació entre los Taira, en concreto de la línea descendiente de Kohehira, pero era lo bastante lejano a ella como para no haber sido considerado digno de los textos históricos. Una de las muchas bajas de las Guerras Genpei, la Ciudad Demonio lo llamó por su vida de conflicto. Pero el alma libre que tenía no podía ser contenida, así que escapó en poco tiempo y fue hallado por el Clan Uji que tomó el nombre de su familia y lo obligó enseguida a integrarse. Sin embargo, Kaito detestaba las nuevas cadenas. No creía de verdad en los valores que proclamaban. En cierta medida, solo querían usarlo por su tamaño y su pericia con la espada, y poco más que como un pedazo de carne con el que aporrear a sus enemigos. Pero él quería vivir libre de tradiciones. La no vida era una oportunidad de experimentar lo que nunca pudo en vida, ver obras de teatro que se le negaron, amar libremente sin ser juzgado, ver lugares que nunca pudo y ser algo más que un asesino.\n\nMientras sus amos querían convertirlo en un antepasado, él sería su propio antepasado. Aunque su destreza con la espada y su físico inspiraban un gran respeto, adoraba las artes y, en general, afrontó la vida con un celo nuevo. Ya fueran reuniones privadas con la asesina Karuki, viajes por Japón, disfrutar de las artes o explorar ciudades que nunca pudo ver en vida, se entrega a todo con un vigor y un orgullo innegables.\n\nDestino futuro:\n\nTras el Año de los Milanos Negros, Kaito decepcionaría a los Taira al no aspirar a gran cosa y caer, en cambio, en el olvido. Las únicas pistas sobre su paradero fueron varios dhampyr de noble estirpe, increíblemente bien formados y apuestos, que rodeaban a Karuki, y las historias de un samurái errante en la Umbra que buscaba todo lo que había por ver."
 POD_persistentpodlore.desc.EA0030: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nDurante la mayor parte de la historia de la Corte del Dragón Azul, el Ancestro de Tsushima, a pesar del tamaño comparativamente pequeño de la Corte, siempre ha sido de una importancia crítica. Tradicionalmente, quien poseía Tsushima controlaba el punto de unión crítico para los viajes entre las dos mitades de la Corte. Durante un tiempo, esta posición fue siempre neutral. Sin embargo, en estos tiempos difíciles en los que los presagios de lo que se avecina flotan en el viento, su actual guardián ha tomado partido. Miki se encuentra entre los Uji más respetados, aunque no tenga apariencia de serlo. Antigua discípula de Miura Yasutami, fue un compromiso entre él, Masao Iwase y los ancestros de las Cortes Augustas, elegida a mano por su neutralidad política en aquel entonces. Como alguien desconectada de sus vínculos mortales debido a que su memoria fue destrozada por el Infierno de los Pecadores del Lado Opuesto, y dedicada en gran medida a su labor como guardiana guerrera, la decisión fue fácil para ella. Sin embargo, con la marcha de los mongoles, Miki puede ver que los vientos soplan hacia el Este. Y, además, el [Glossary('Anda','podgloss.anda')] que rodea la puerta no muy lejos de Corea y China ha traído una inmensa causa de alarma. Cuando recorrió la Corte de la Tortuga Negra para comprobar la amenaza, se horrorizó.\n\nRegresó a su puesto y contempló su siguiente curso de acción. Y, tras un año de deliberación, regresó con Iwase y Yasutami e informó de su intención de cerrar las Líneas de Dragón normales que conducen a Japón en interés de frenar la amenaza, manteniendo el control tan firmemente como pudiera mientras no aceptaba viajeros. Simplemente está esperando la señal.\n\nDestino futuro:\n\nMiki fue una pieza crítica en la conspiración que fue el Año de los Milanos Negros. Emitió una orden de expulsión en Tsushima para todos los $pod_kueijin$ leales a la Corte del Dragón Azul, y ejecutó a quienes no se marcharon. Y con la ruptura, comenzó el distanciamiento que dividiría a los Clanes del Sol del resto del mundo sobrenatural."
 POD_persistentpodlore.desc.EA0031: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nAunque la mayoría de los $pod_kueijin$ prestan poca atención a los Dioses Menores nativos (conocidos como «Fae» o «Changelings» más al oeste), hay momentos en los que se necesitan enlaces entre los Ancestros y estas divinidades menores. Aunque los Uji, en su conjunto, detestan tener que lidiar con ellos, cuentan con una persona dedicada para tales asuntos. Y Rina se pregunta si es el objeto de alguna broma.\n\nRina ha servido a los Uji fielmente durante varios siglos y es una competente mediadora Genji y, a menudo, una enviada al resto de la Corte del Dragón Azul. Pero a medida que los Clanes del Sol y las facciones de la corte continental se distancian, Rina ha estado encontrando puestos bastante diferentes en la propia Japón, tratando a menudo con los caprichosos, erráticos y confusos Dioses Menores. Y, desafortunadamente para ella, siempre ha sido diplomática, y las alternativas son ser diplomática ante los Tsuchigumo (lo que casi con seguridad terminaría en su muerte) o ante los Hakken (que probablemente la matarían en el acto); ella acepta el dolor de cabeza con naturalidad porque le permite mantener la cabeza fría."
 POD_persistentpodlore.desc.EA0032: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nDado su especial interés por los japoneses, [Glossary('Emma-o','podgloss.emmao')] inspira un temor particular entre los Uji, y por ello los Espejos Rotos por los que han pasado sus fuerzas siempre han merecido una atención especial. Y con todo un batallón de [Glossary('Shikome','podgloss.shikome')] activo, los Uji están decididos a que no los tomen por sorpresa. Aunque la mayoría rechazaría semejante destino, Kazuko se ofreció voluntaria. Escapada de [Glossary('Kakuri','podgloss.kakuri')], Kazuko intenta vivir la vida al máximo y siente que siempre falta... algo. Siempre estuvo algo apartada de sus contemporáneos: mientras que las [Glossary('Shikome','podgloss.shikome')] suelen llenar de rabia a las demás mujeres de los Uji y los hombres suelen sucumbir a sus artes, Kazuko nunca entendió por qué ella no reaccionaba con violencia. Y aunque le horroriza la posibilidad de caer ante [Glossary('Emma-o','podgloss.emmao')], ante las [Glossary('Shikome','podgloss.shikome')]... tiene sentimientos más encontrados.\n\nAl menos, sus informes para sus superiores son extremadamente detallados y su habilidad de rastreo es soberbia. Así que las [Glossary('Shikome','podgloss.shikome')] que combaten a los cultistas de la Ciudad Perversa están siendo vigiladas. Y con mucha atención.\n\nDestino futuro:\n\nLa «dedicación» de Kazuko a su cometido era intensa. Pero estar tan cerca de los [akuma|E] sin matarlos es siempre peligroso, y la belleza sobrenatural de las [Glossary('Shikome','podgloss.shikome')] la convirtió en una presa fácil para su esclavización cuando la capturaron. Se desconoce qué fue de ella, pero algunos de los sucesores en su puesto sospechan que la presencia de una nueva [Glossary('Shikome','podgloss.shikome')] que se desvivía por las otras Mujeres Demonio podría arrojar luz sobre lo ocurrido."
 POD_persistentpodlore.desc.EA0033: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nIncluso de niña, Haruka siempre fue la pequeña que husmeaba donde no debía y la que siempre tenía una sombra sobre ella. Carente de energía y vigor, un día atrapó a una avispa y a una mosca en un frasco y observó cómo la avispa se aferraba al lomo de la mosca y se la comía, hasta que un solo ala flotó hasta el fondo. Haruka tuvo una revelación aquel día: ella era la mosca y la vida era la avispa. Solo un dolor constante y agitador que la devoraba viva. Su mentalidad nunca cambió y finalmente perdió la batalla contra la crueldad de la vida, y encontró un lugar tranquilo para dejar ganar a la avispa.\n\nPero al hacerlo, lo que esperaba que fuera finalmente el sueño fue, en cambio, el Infierno de ser Devorada Viva, su metáfora hecha realidad. Haruka, sin embargo, aborreció la cruel broma de todo aquello y, finalmente, al darse cuenta de que se había equivocado, se comió a la avispa que tenía en la espalda y dio su Segundo Aliento. Y entre los Uji, Haruka es un tanto extraña, ya que su fascinación por la muerte simplemente cambió. Una lucha de toda la vida contra la depresión la hizo increíblemente empática con los wraiths, y ellos pueden reconocer sus luchas en su propia guerra contra sus sombras. Sin embargo, para el resto de los Clanes resulta frustrante que ella tenga poca paciencia para la política, por lo que el potencial poder para reclutar wraiths en masa no es utilizado por los Uji. Al menos, es una exorcista excelente que cumple con su trabajo y lo hace bien.\n\nDestino futuro:\n\nEl pausado caminar de Haruka entre las Flores de Hueso la recompensaría con el tiempo. Una noche, mientras ayudaba a un wraith que murió como ella a encontrar la paz, avanzaron juntos hacia la Trascendencia, y Haruka hacia las [Glossary('Cien Nubes','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.EA0034: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLas claves de la influencia y el poder mortal son algo caprichoso, especialmente entre las vanidades y excesos de la clase alta. Mantenerse al tanto de los cotilleos, seguir la moda, mantener las redes de contactos y reiniciarse cada pocas décadas puede ser agotador. Pero Hidaka está recuperando el tiempo perdido.\n\nHija de unos padres en constante disputa, Hidaka pertenecía a la baja nobleza y no era más que una herramienta para sus progenitores. Pero ella intentó ser una buena hija. Esbozó una sonrisa cuando se casó con un hombre sencillo al que nunca había visto. Se tragó su orgullo ante el descuido. Soportó la daga en el corazón que representaba su amante. No dijo nada sobre las infecciones de transmisión sexual que traía la aventura.\n\nHidaka no puede decir con certeza qué la llevó al límite. Fue o bien el gobierno confiscando su escape, o el aborto provocado por las palizas de su marido ebrio. De cualquier modo, Hidaka terminó las cosas con un cuchillo. Después de acabar con él, por supuesto. Sus últimos pensamientos antes de que ese cuchillo la enviara al Infierno de la Castración Eterna fueron una risa profunda con lágrimas rodando por sus mejillas ante lo absurdo de todo aquello. Pero en el Infierno, Hidaka tuvo otra oportunidad. Era noble. Obtendría la vida glamurosa que siempre le fue negada. Las jaurías de demonios tomaban víctimas y vagaban durante un tiempo; ella se dejó llevar y escapó. Y al regresar al mundo mortal, iba a vivir. Disfrutaba especialmente encontrando a personas como su marido mortal para destrozarlas por dentro, mientras se movía y se deleitaba en la luz del privilegio, la riqueza y la alta sociedad. Esta vez sería ella la amante, sería ella quien recibiera los elogios, sería ella la gema brillante en la noche. Y vaya si ama la no-muerte.\n\nDestino futuro:\n\nHidaka siempre seguiría moviéndose, deleitándose siempre con los beneficios de la riqueza. Pasando de hombre en hombre y destruyéndolos por infidelidad, su juego continúa en la modernidad, dejando un rastro de cadáveres y cotilleos a su paso."
 POD_persistentpodlore.desc.EA0035: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nHasta que alcanzan las etapas superiores de su Iluminación, los más jóvenes de los muertos tienden a dejar un rastro de cadáveres tras de sí. Ya sea por una alimentación que se volvió demasiado dura, por respirar demasiado accidentalmente o por tener un arrebato de ira que redujo el censo de una aldea a cero. Evitar que esos actos caigan en ojos que no deberían verlos es un asunto complicado. Pero, por otra parte, Yoriie siempre ha estado limpiando los desastres de los demás. Yoriie nació en una familia de sirvientes y, desde joven, supo que ese era su propósito. Al crecer en la casa de un noble, no como el noble sino como el personal de limpieza, Yoriie pasó 7 décadas de su vida en el mismo castillo, siempre limpiando, cocinando, cuidando a los Animales y sirviendo a los amos. Nunca se casó, pues las mujeres no le interesaban. Nunca tuvo amantes, pues la carne nunca le interesó. Limpiaba, escuchaba y aconsejaba. Había poder en ser el hombre que hacía la cama y preparaba el té.\n\nCuando fue recompensado con una vida mundana en el Infierno, se negó a aceptar el desastre que había dejado atrás, y [Glossary('Emma-o','podgloss.emmao')] quedó perplejo al ver cómo escapaba el amable mayordomo. Ahora, Yoriie sirve directamente a los Clanes del Sol. Ya no está vinculado a una sola propiedad; es un terapeuta mercenario, conserje, limpiador y «limpiador». Sea cual sea el desastre, Yoriie lo limpiará. Un Grulla inusual, pero de alto rango a pesar de todo. Su falta de ambición política, su actitud de no hacer preguntas y su falta de deseo de acostarse con la esposa lo convierten en el hombre en quien todos en los Uji confían. ¿Para Yoriie? Él solo está feliz de estar ocupado."
 POD_persistentpodlore.desc.EA0036: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nDe niño, Moroie siempre soñó con el escenario. Desde la primera vez que vio un espectáculo de marionetas, Moroie siempre quiso actuar. Amaba el teatro y aspiraba, por encima de todo, a tener la oportunidad de estar en ese escenario. Con ese fin, gastó todo el dinero que tenía de su tiempo en una familia de mercaderes en estudiar artes marciales escénicas, oratoria y actuación. Se alegró inmensamente cuando tuvo su primera oportunidad de audicionar. Y todo se esfumó en un instante cuando, mientras viajaba, fue emboscado por bandidos. Disparado en el ojo con una flecha, abandonado a su suerte para desangrarse y desnudado tras ser despojado de todas sus pertenencias, la historia de vida de Moroie terminó allí.\n\nUn nuevo capítulo comenzó cuando, debido a que el mejor día de su vida se convirtió en el peor, fue condenado al Infierno de los Pecadores Al Revés. Pero incluso entonces, cuando sus sufrimientos alcanzaron su cenit, despertó de nuevo en el mundo de los vivos. Moroie era libre y fue encontrado por un Susurrador. Todavía lucha por orientarse, pero ha encontrado un lugar para sí mismo. Sin embargo, a medida que las escenas teatrales locales de Japón comienzan a florecer, él se desprende como un árbol sin raíces y finalmente vive su sueño. Está haciendo amigos en todo el mundo del teatro y, lo que es más, su amor por la acción lo ha convertido en un guerrero bastante capaz. Ya sea para una actuación o para una paliza, Moroie es una pieza crítica en los vínculos que fortalecen a Uji."
 POD_persistentpodlore.desc.EA0037: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nMidorikawa, en un sistema donde muchos de los $pod_kueijin$ tenían una maldad mediocre, era una excepción. Merecía el Infierno. Y lo más extraño de todo es que él, entre todos, tuvo una segunda oportunidad. Midorikawa era un mago de una furia y depravación verdaderamente terribles. Estaba tan ansioso por devorar a los débiles que condenó no solo su cuerpo y mente, sino también su alma en eterna reencarnación. Se bañaba en sangre para mantener su juventud, atraía a niños hacia personas que los convertirían en carne de la peor manera posible, sonreía cuando exponía a cónyuges desesperados ante parejas violentas. Si podía hacer sufrir a alguien, se sentía satisfecho. Pero su tiempo se agotó cuando el Akashayana finalmente lo encontró y acabó con él mediante una hoja encantada que destruyó su ser superior y lo condenó.\n\nPero aun así no murió por completo. Su avatar se hizo añicos y despertó en el [Glossary('Kakuri','podgloss.kakuri')]. Un lugar en el que ya había estado antes. Y con ese conocimiento, pensó que estaba a salvo. Pero su mente lo abandonó durante su escape, los Tigres Diablo de los Uji lo encontraron y lo sometieron. Y él estaba... profundamente desorientado por su condición. La influencia de la condenación de su avatar ya no recaía sobre él y su mente estaba despejada. Tan centrado en el dolor y en herir a la gente, nunca llegó a vivir de verdad. Fue marcado como un demonio, y ahora realmente lo era. El camino de Midorikawa ha sido tortuoso y confuso. Ha luchado intensamente con la Redención, pero al menos busca vivir libre. No solo brutalizando a otros, sino compartiendo verdaderamente el placer, haciendo felices a las personas y disfrutando de la existencia. Sin su maldito avatar, podría disfrutar de eso. Es nuevo en esto, pero va a intentar recorrer ese camino."
 POD_persistentpodlore.desc.EA0038: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nSi bien el reinado de Xiao ha sido definido en gran medida como un tratado magistral sobre las locuras del nepotismo y los peligros de la descentralización dentro de la Corte del Dragón Azul, decir que ese fue su único legado sería un error. Y para un hombre tan aterrorizado por el exceso y el acaparamiento de riqueza, su única alumna es un marcado contraste.\n\nJi-so nació en una época de gran caos. Nacida en Gyeongju cuando el reino de Silla aún era joven en su unificación, Ji-so era una más entre la escoria, la más pobre de los pobres. Toda su vida estuvo definida por la mendicidad, y nunca conoció un día en que el Ansia no le roñera el vientre. Y finalmente, entre la desnutrición, la exposición y estar mayormente sola, sucumbió a la crueldad del mundo y cayó en el Infierno de No Tener Dinero. Pero a pesar de esta injusticia, finalmente le dio a Ji-so algo que siempre le había faltado. Un tipo de poder. Ella arrancaba los huesos de sus enemigos y los usaba como una especie de moneda, ya que nada más existía en el Infierno. Muchos de sus habitantes estaban ansiosos por dinero de cualquier tipo, y ella compró su salida. Y cuando la encontró la Corte del Dragón Azul, inicialmente le sugirieron que fuera discípula de Xiao como una broma. Él aceptó, con la esperanza de «iluminarla». Pero Ji-so prestó poca atención a su mentor e inmediatamente gravitó hacia la órbita del Cártel Mercantil del Tigre Carmesí. Juró que nunca volvería a pasar necesidad de nada. Ya fuera sangre, jade, hueso o poder, nunca le faltaría. Y mientras Xiao se ganaba la ira de la Corte, Ji-so empezó a tomar sus propios alumnos y comenzó a construir su propia red de poder, esparciendo contactos por todo lo que conocía como Silla. Y a medida que los Uji se alejan más y más, puede que llegue el momento de su mayor adquisición.\n\nDestino futuro:\n\nAunque siempre vio la caída de Xiao del poder como algo inevitable, el Año de las Mil Aves de Tormenta le pilló por sorpresa. El [Glossary('Anda','podgloss.anda')] que saqueaba la región causó un gran daño y ella perdió una buena parte. Pero recuperó a sus agentes y preparó su tiempo bajo las reorganizadas Cortes Verdes. Tras la división de Corea tras la Segunda Guerra Mundial, espoleó a sus alumnos a la acción y formó una «Nueva Corte Verde» en Corea del Sur. Lidera su «Sociedad del Hueso Verdadero» hasta el día de hoy."
 POD_persistentpodlore.desc.EA0039: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nQuizás uno de los más emblemáticos de la Facción del Hueso Verdadero dentro del Mundo Nocturno coreano, Ji-un escucha a sus detractores e ignora gran parte de lo que dicen. No tiene tiempo para perder con chismes. No cuando tiene dinero que ganar.\n\nJi-un vio de primera mano a qué males puede llevar el dinero a los hombres. Después de todo, fue un asesino a sueldo en su vida mortal. Y uno bueno y fiable. Funcionarios, vagabundos, soldados, niños, cualquiera; Ji-un aceptaba el pago. Y cuando el trabajo acabó con él, se sintió conforme con tal destino. Vivir por la espada, morir por la espada. Y su reacción al estar en la Ciudad Demonio también fue bastante templada. Vio de primera mano a dónde van los asesinos. Estar rodeado de gente que disfrutaba matando, que amaba causar dolor, todo eso le perturbaba enormemente. Él era un profesional, no un psicópata. Y su dedicación le permitiría abrirse paso fuera del Infierno y hacia su Segundo Aliento. Cuando fue interrogado, llamó la atención de Ji-so, quien lo acogió. Y Ji-un se sintió profundamente aliviado. Ella era una profesional y él podía empatizar con eso. Amplió sus habilidades y se puso a trabajar gestionando las finanzas de su creciente sociedad. Y además, si alguien incumplía un préstamo, aunque un asesino fuera algo preocupante, un demonio que viene a cobrar es mucho peor."
 POD_persistentpodlore.desc.EA0040: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nCuando uno piensa en Nigromantes, suele venir a la mente esa figura de túnica negra y anciana rodeada de fantasmas que revolotean. A Yeon-jin no le importa tal reputación, ya que le favorece. Ser capaz de desorientar a los muertos cuando, en su lugar, se encuentran con él en una habitación mientras sostiene un precioso recuerdo de su pasado mediante mera atmósfera, hace maravillas para financiar las Sociedades.\n\nAntaño un rufián al que recibían con un cuchillo en el vientre, Yeon-jin siempre supo cómo extorsionar a los demás, y ahora sabe qué no hacer. Pero siempre ha estado ansioso por encontrar nuevas formas de conseguir monedas. Desde que se convirtió en discípulo de Ji-so, las Artes Fantasmales han sido de gran interés para él. Después de todo, cuando la gente muere, suele dejar fortunas atrás. Y tras examinar los archivos de la Corte del Dragón Azul y conversar con muchos de los Antiguos nigromantes, ha aprendido muchísimas cosas sobre los otros tipos de muertos. Lo más útil es saber lo preciosas que son las «Ataduras» para ellos. Si solo convoca a uno de los muertos mientras amenaza con una Atadura, siempre parecen retorcerse y aceptar cualquier cosa que diga. Es dinero fácil, y mejor aún para pagar sus respetos a Ji-so. Ya está haciendo el agosto."
 POD_persistentpodlore.desc.EA0041: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLa más joven de las discípulas de Ji-so, A-ji es la excepción entre los Huesos Verdaderos en general. Mientras que la mayoría de sus iguales, sus discípulos y su mentor son fuerzas implacables y decididas, ella es un alma bastante tranquila que prefiere su taller. Habiendo muerto por una disputa de pago en la tienda de su padre, el tipo de personas con las que ahora tienen que lidiar le parecen del tipo que alguna vez habría derramado sus sesos por todo el suelo. Pero ahora, son ellos quienes hacen los pedidos.\n\nA pesar de esto, Ji-so afirma continuamente lo importante que es A-ji para su Sociedad. El Jade, el Hueso y el Chi son todos un dolor de cabeza para trabajar, y ella es muy hábil en ello. Sus trabajos permiten al resto continuar su conflicto tanto contra los [akuma|E] en el norte como con el comercio en general. Y dado que es la única artesana que tienen, al menos se siente cómoda con el hecho de ser demasiado preciosa como para permitir que se le ponga en peligro. Numerosos Semidemonios custodian siempre su taller, así como Dhampiros empleados por ella misma como seguridad adicional. Y a cambio, sus aliados obtienen trabajos impecables para su propio uso en sus conflictos. A pesar de todo, le preocupan los Caminos que están recorriendo. Son un cártel, sí, y mientras luchan contra los [akuma|E], ella ha estado estudiando. ¿En qué punto se pasan de la raya? ¿En qué punto se convertirán en algo peor que los registros que ve de un joven Rey Demonio llamado [Glossary('Mikaboshi','podgloss.mikaboshi')]?"
 POD_persistentpodlore.desc.EA0042: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEn su día, Bo-jeon pensó que una vida de erudición le vendría bien. Al menos, antes de acabar en el Infierno. A pesar de haber pasado casi 7 décadas intentando llevar la mejor vida posible, resistiendo las abrumadoras presiones de otros para debilitar su posición, luchó contra ello intentando mantener su moralidad. Y aun así, la viruela lo condenó al Infierno Febril. Bo-jeon, furioso ante esta injusticia cósmica, se desolló la piel enferma de sus pústulas, dejando que el Infierno la regenerara y se fabricó a sí mismo una escalera para salir del Infierno hecha de carne enferma.\n\nCuando dio su segundo aliento, los Sangun fueron acusados de actos de terror, solo para que se revelara que el oso demoníaco que aterrorizaba una zona era el frenesí de Bo-jeon recién salido del Infierno. Desde que fue traído al Mundo Nocturno, Bo-jeon ya no tiene consideración por el honor ni la virtud. Aunque sigue siendo tan ingenioso y sabio como antes, apenas lo utiliza. ¿Qué sentido tendría? No, en su lugar disfruta siendo la fuerza bruta de la Sociedad del Hueso Verdadero. Cuando sus deudores no cumplen con sus pagos, arrancará las puertas de sus bisagras y los perseguirá hasta los confines de la tierra para asegurarse de que paguen lo debido. Cuando alguien critica a sus compañeros, les hace una visita para «discutir» las cosas. Y finalmente se está divirtiendo. Y vaya si le encanta ahora."
 POD_persistentpodlore.desc.EA0043: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nUn enigma dentro de la Sociedad de Huesos Verdaderos, Ja-hyo nunca les ha dirigido la palabra a ninguno de ellos. Y, sin embargo, es con diferencia el más temido entre ellos por el resto del Mundo Nocturno de Corea. Habiendo venido del Infierno de los Pecadores del Pecado Invertido, y según sus propios escritos, se cree que no tiene recuerdos del pasado; en su mentoría de Ja-Hyo, al menos Ji-un se alegra de ver que es notablemente leal y obediente a la sociedad en general. Y aun así, Ja-hyo tiene sus... peculiaridades. Además de ser mudo, al menos.\n\nA veces, si no está custodiando un lugar, la gente desaparece por donde él pasa. Médicos falsos hallados sin mandíbula. Ladrones profesionales con los brazos incrustados en los hombros hasta que solo sobresalen las manos. Piernas giradas en círculos sobre un cuerpo 15 veces para aquellos que huyen constantemente de la ley. Aquellos que practican la violencia sexual, hallados castrados y ensartados en un árbol a través del recto. Y Ja-hyo, de vuelta en su refugio, cubierto de sangre y contemplando su Camino. Es por esta razón que Ja-hyo es considerado muy valorado como un terrorista mercenario. Si alguien necesita ser aterrorizado para que cumpla sus juramentos, él es sin duda el Ancestro al que llamar para lograrlo. Y a menudo, definitivamente enviará el mensaje. Y todo ello sin una sola palabra de protesta. Solo un asentimiento, y entonces alguien es mutilado.\n\nUn pintoresco Tigre Diablo, si es que existe alguno."
 POD_persistentpodlore.desc.EA0044: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEn una sociedad donde cualquiera puede pasar de ser una persona normal a un monstruo demoníaco de emociones salvajes, extremadamente resistente, capaz de lanzar árboles y con velocidad de relámpago, aquellos que pueden persuadir a otros o evitar que se produzcan peleas son de un valor crítico para cualquier civilización a largo plazo. Con ese fin, Ui-min ha sido un miembro fundamental de la Sociedad de Huesos Verdaderos. Tercer hijo de un noble menor en vida, Ui-min era carismático, pero sufría mucho con sus exámenes. Y como no era ni el heredero ni el sustituto, esa era más o menos su única oportunidad de ascenso social. El estrés de todo aquello empezó a quebrar a Ui-min y, finalmente, entre los reproches de sus padres, su propio fracaso y la presión de los exámenes, Ui-min se rompió y se lanzó a la Ciudad Perversa tras una noche con demasiado alcohol para lo que su cuerpo podía soportar. Y allí, se vio obligado a repetir los mismos exámenes que lo mataron cada día, hasta que finalmente se liberó de sus ataduras y atravesó cada muro que le separaba del mundo de los vivos.\n\nFue encontrado por la Corte del Dragón Azul y educado en el [Glossary('Dharma','podgloss.dharma')], y en términos generales, está exhausto. Está totalmente dispuesto a usar el dinero para debilitar a los [Glossary('Reyes Yama','podgloss.yamaking')], pero por encima de todo, solo quiere un lugar. Quiere estar rodeado de otros, ser valorado y ser deseado. Como mínimo, tranquiliza a los demás miembros de los Huesos Verdaderos, por lo que es un excelente pacificador. Y esa es, finalmente, una función con la que se siente feliz."
 POD_persistentpodlore.desc.EA0045: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nUno de los campos de guerra menos conocidos es el de las sustancias alteradas, donde los [akuma|E] a menudo mezclan estimulantes y depresivos con esencia impura para abrir a sus usuarios a la infección y la Posesión, para vincular sus almas al servicio de ellos sin que se den cuenta. Y como la gente cae en el olvido, la Sociedad de Huesos Verdaderos ha decidido no confiar en las instituciones mortales para mitigar su uso, sino utilizarlo para obtener más fondos para su Misión y también controlar aquello a lo que son adictos. Y Ja-gyeom ha perfeccionado eso hasta convertirlo en un arte.\n\nEn su vida mortal era cervecero, un hábil fabricante de alcohol. Pero cuando murió y fue recibido en el Infierno de ser Desollado Vivo, no lo comprendió, pero no le hizo falta. Le gustó no ser desollado vivo, así que se enterró lo mejor que pudo y cavó su salida.\n\nDesde que entró en la órbita de la Sociedad de Huesos, se ha definido por sus antiguos talentos y los ha expandido aún más. Un cervecero brillante, pero también muy hábil fabricando otras drogas; hace que sus súbditos y agentes se muevan, introduciendo productos «mejores» de los que ser adictos. Aunque es muy lucrativo, están mezclados con esencia para purificarlos de la impureza de los [UmbraGlossaryLocalized('yomi_wan','Mil Infiernos')]. Por eso, a pesar de los reparos morales que tendrían los Ancestros de mayor rango, no pueden negar que Ja-gyeom es un guerrero eficaz en las batallas que libra."
 POD_persistentpodlore.desc.EA0046: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLa miembro más joven de los Huesos Verdaderos y la única que se desvía de ser una seguidora de los métodos del Cartel Mercantil del Tigre Carmesí, Yu-hwa compensa con creces esa diferencia con su rendimiento y celo. Originalmente solo era una joven que disfrutaba siendo el centro de atención en su aldea por su belleza; su vida cambió cuando un noble vino a ver a esta dama de la que sus sirvientes hablaban como una visión de belleza, se enamoró de ella inmediatamente y le ofreció tomarla como amante. A Yu-hwa no le entusiasmaba perder su estatus de celebridad local, pero sabía que rechazar a un señor no era una opción real. Así que aceptó y, para gran pesar de su esposa, él pasaba todo el tiempo que podía con ella. Y fue por esa razón que la esposa, negándose a ser reemplazada, drogó a Yu-hwa, le ató los tobillos y las muñecas con una cadena y la arrojó al mar.\n\nYu-hwa ya no recuerda cuánto tiempo pasó en el Infierno de los Mares Hirvientes atada a una roca en el fondo, pero un demonio codicioso que buscaba dar un bocado cortó sus ataduras lo suficiente como para que pudiera escapar.\n\nDesde toda esa experiencia, y con parte de su educación realizada con Seok Kwan Sook, Yu-hwa ha adoptado métodos de Iluminación bastante interesantes. La Carbón Brillante adora atraer a los necios lujuriosos a su perdición, antes de asumir su Forma de Demonio en pleno coito, convirtiéndose en un colosal demonio zorro. Aunque es leal a Ji-so y a los otros Huesos Verdaderos, constantemente bordea el límite por demasiado tiempo, y cada noche pone a prueba sus límites mientras busca constantemente el éxtasis carnal y un final visceral. Cada afirmación de que «solo está disfrutando de su vida no mortal» se vuelve cada vez más vacía a medida que aparecen más y más asesinatos a su paso.\n\nDestino futuro:\n\nEl caos del Año de los Milanos Negros y sus secuelas hicieron que los Huesos Verdaderos dejaran de preocuparse por las predilecciones de Yu-hwa y, en su lugar, la pusieran a trabajar como una seductora asesina. Sus cacerías fueron tan prolíficas que los $pod_kueijin$ más jóvenes asumieron que ella era la inspiración de la kumiho. Pero para ese entonces, a ella ya no le importa mucho. Tiene sus Caminos, ha avanzado mucho en su Iluminación y su vida no mortal es suya para disfrutarla. Y no lo querría de otra manera."
 POD_persistentpodlore.desc.EA0047: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nNo ajena a lo liminal, no ha pasado un solo día, ni en su vida mortal ni en la de la muerte, en el que Shigeno no haya sido empujada hacia caminos que no deseaba recorrer. ¿Pero ahora? Se atreve a recorrer su propio Camino. Nacida en el cambio del periodo Nara al Heian, séptima hija del Emperador Kanmu y de la dama de la corte Fujiwara no Kamiko. Pero Shigeno era una hija única entre los 36 hijos de Kanmu, y tenía poca importancia en la gran escala de la historia. Y, a un nivel profundo, Shigeno lo resentía. Pero fue presionada a la posición de esposa de un señor menor para consolidar el equilibrio de poder. Hasta que murió a los 48 años sin descendencia; estaba amargada, insatisfecha y murió sintiendo que su vida había sido desperdiciada.\n\nY las cosas empeoraron de forma incomprensible cuando se encontró en el Reino Nocturno. Inmediatamente, fue perseguida por las Shikohime, ya que Emma-O estaba más que ansioso por retorcer y violar a una princesa para convertirla en una de sus consortes asesinas. Incluso persiguieron a Shigeno de vuelta al mundo de los vivos, y solo con la intervención del Ancestro Yūki. Durante un tiempo, Shigeno agradeció la protección, hasta que vio lo que su «salvador» intentaba convocar. Shigeno se horrorizó por lo que vio y se convirtió en la primera miembro del Uji en denunciar a los Kin de Izanami, rompiendo formalmente con ellos. Debido al venerado estatus de Yūki, este fue un movimiento que la aisló políticamente, pero no le importó. Terminó su educación bajo Riyan y se negó a negar su fascinación por el mundo de los vivos con las Dharmas extranjeras que consideraba impuestas al Uji. El Mundo Espiritual era real. Las Cortes de la Bestia lo hacían flagrantemente evidente. Negar eso era una locura. Desafió las órdenes y tomó sus propios estudiantes, confiando en la importancia de sus deberes como cuidadora de espíritus para asegurar su protección. Todavía camina por una línea peligrosa, atreviéndose a recorrer su propio Camino ahora que ya no está vinculada al estatus con el que nació.\n\nDestino futuro:\nA pesar del constante vaivén que los Sotogawa No sufrirían como Velos Cerúleos, Shigeno resistió. Con la partida de Riyan del Mundo Material y el distanciamiento de los Velos, Shigeno se convertiría en la líder nominal de los Animsit $pod_kueijin$ en Japón. Incluso permaneciendo exiliada del Uji, su influencia es innegable. Y también la necesitará. Alguien tiene que detener a Yūki. Y Shigeno no se quedará corta."
 POD_persistentpodlore.desc.EA0048: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLos Genji, aunque conocidos como los Uji xenófilos, son más progresistas en su mentalidad en algo más que solo su postura ante la influencia extranjera dentro de los Clanes Uji. Esas mentalidades se extienden más allá, en lo que se considera aceptable tanto en la conducta como en los medios para acumular poder. Debido a eso, Ruri es una de las seguidoras más fervientes de los Genji... y una agente útil.\n\nRuri fue quizás una de las cortesanas más queridas en su vida mortal en Saga. Hija de un linaje de ellas, la lenta acumulación de poder entre las mujeres que la precedieron permitió a Ruri tener un papel más cómodo dentro de su «teatro». Vista como una mujer para hombres refinados, aprendió muchísimo por proximidad y se volvió increíblemente hábil leyendo a la gente. Esperaba poder seducir a un hombre rico y ascender en el poder, pero un cliente tenía algo distinto en mente, y la vida de Ruri terminó con ella asfixiada, y su cuerpo arrojado al mar con piedras atadas a los tobillos para evitar un escándalo. Y las cosas simplemente empeoraron para ella, ya que fue intercambiada fuera de las Aguas Amarillas hacia el Burdel de Hierro. Pasó una cantidad incalculable de tiempo allí, pero ese tiempo le dio algo de perspectiva, y pudo manipular a un Demonio para que la comprara como esposa y, con una daga bien colocada hecha de su propia alma, escapó de vuelta al mundo de los vivos.\n\nSin embargo, desde su civilización, Ruri se ha definido a sí misma como una estrella ascendente entre los Genji. Siendo una de las únicas Ujis que no fue convertida en paria por no abandonar sus habilidades como cortesana, utiliza esas habilidades aprendidas para manipular y controlar a quienes ocupan posiciones de poder en el mundo mortal para ayudar a los Uji. Pero aspira a cosas mayores. La perspectiva de Ruri simplemente ha crecido. Y a pesar de las máscaras modestas que usa ante sus clientes y aliados, aspira a mucho más.\n\nDestino futuro:\nRuri se adaptaría a los clientes y, por el bien de nuevas vías de poder, a nuevos medios. Pasando de ser una cortesana a una actriz para adultos, ha encontrado la forma de cosechar grandes cantidades de esencia de sus consumidores, y lo fortalece todo para sí misma para estar aún más preparada cuando busque al Ángel Dragón de la Muerte..."
 POD_persistentpodlore.desc.EA0049: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nAunque son infames por su terquedad y su actitud general de inflexibilidad, los valores tradicionales de los Uji Taira pueden manifestarse de más formas que no sea solo resistir toda influencia extranjera y cualquier avance social. También puede darse de otras maneras. Y Tsuguko, quien trajo al mundo a uno de los Taira mortales más influyentes, es un ejemplo de los valores sociales que tales cosas conllevan.\n\nA concubina del mortal Taira no Takamochi, Tsuguko fue la madre de su quinto hijo, Taira no Yoshifumi. Diligente y devota, Tsuguko hizo todo lo que se esperaba de una mujer de su posición. Vivió una vida tan virtuosa como pudo, y cuando la enfermedad la alcanzó, estaba, al menos, emocionalmente satisfecha con lo que había logrado, mientras su hijo se disponía a dominar el mundo. Pero fue condenada al Infierno de las Larvas Cavadoras y, para su consternación, la enfermedad la azotó sin descanso ni razón alguna. Solo el paso de una Patrulla de Guerra Uji la salvó, y la devolvió con sus tutores para una debida civilización. Y con su vida mortal, los Uji Taira la reclamaron de inmediato. Pero para su sorpresa, tan pronto como pudo, abandonó su centro de poder y regresó inmediatamente con su salvador, Tashimoto Hanko. Él la había salvado, y ella le juró que no tendría más siervos devotos. No ha fallado en ese juramento desde entonces.\n\nDestino futuro:\nCuando se revelaron las verdaderas profundidades de lo que yacía en el pasado de Hanko, Tsuguko fue quien más se sorprendió. Desapareció buscándolo y, hasta el día de hoy, no se le ha visto en su búsqueda de la verdad sobre el hombre que la salvó de la condenación."
 POD_persistentpodlore.desc.793166: "Este personaje es parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, fue ampliado por los desarrolladores de PoD para dar mayor profundidad al escenario.\n\nSi le hubieras dicho a Masao Iwase que lideraría una facción progresista durante su vida, se habría reído de ti. Y, sin embargo, el maestro de los Genji solo puede reflexionar sobre cómo llegó a este lugar.\n\nA un hombre severo y tradicionalista durante sus días de respirar, Iwase era lo suficientemente hábil como para liderar hombres en la batalla, pero no para triunfar contra peores adversidades. Muriendo por la espada con la cabeza en alto hasta el último momento, Iwase entró en el Infierno de ser Desollado Vivo con un fuerte sentido de injusticia. ¿Acaso no había hecho nada de lo que se esperaba de él? ¿Por qué crimen tuvo que expiar? Pronto aprendió que estas preocupaciones no importaban, ya que los [UmbraGlossaryLocalized('yomi_wan','Mil Infiernos')] estaban rotos sin reparación y eran una parodia del castigo celestial.\nAsí, por primera vez en su vida, Iwase se rebeló, utilizando su conocimiento marcial para liderar a una banda de almas con ideas afines en un escape audaz.\n\nAl regresar como un $pod_kueijin$, se esperaba plenamente que liderara a sus agradecidos nuevos seguidores en la política del Japón nocturno. No encontró ninguno de los Clanes existentes de su agrado.\nAunque Iwase seguía siendo un hombre militar severo que respetaba el decoro, ahora creía firmemente que el sistema, fuera lo que fuese, no funcionaba. Las viejas Tradiciones y formas de pensamiento solo conducen a este Cielo e Infierno rotos; por lo tanto, todo tendría que ser reconstruido desde abajo. ¿Pero cómo? Esto, Iwase no pretende saberlo, razón por la cual se espera que sus seguidores Genji sean pensadores avanzados y proporcionen nuevos caminos para que los $pod_kueijin$ caminen y alcancen la Iluminación.\n\nEl propio Iwase sigue sin tener una mente innovadora. Mientras protege a su clan, actúa como el segundo general más importante de los Uji (detrás de Tashimoto Hanko) y cultiva una buena relación con Yasutami de los Bishamon. Esto llevó a algunos a creer que Iwase podría ser el árbol que oculta el bosque para los Genji, y que si se retirara o desapareciera, la enemistad entre Bishamon y Genji podría despedazar a los $pod_kueijin$ japoneses."
 POD_persistentpodlore.desc.795054: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por eso, ha sido ampliado por los desarrolladores de PoD para aportar mayor profundidad al escenario.\n\nEl pasado de Antoku es un misterio incluso para los más doctos $pod_kueijin$ de Japón. Su afirmación de descender de las antiguas familias aristocráticas de Japón y su impecable conocimiento de la vida cortesana del periodo Kofun lo situarían como uno de los seres activos más antiguos de Japón, algo que sus críticos se burlan diciendo que explicaría su mentalidad.\n\nBajo su liderazgo, el clan Taira es el principal Uji conservador de Japón, que considera a los Bishamon como innovadores peligrosos. A lo largo de su larga existencia, Antoku defendió con firmeza el dominio imperial y mantuvo su Uji en Kioto durante todos los siglos en los que el Emperador no fue más que una figura decorativa. Los Taira se resisten a todo cambio, abogan por un gobierno imperial directo y una adherencia casi militar a las Tradiciones. Esta postura intransigente solo ha servido para marginarlos políticamente, ya que son incapaces de adaptarse a los tiempos cambiantes.\n\nSin embargo, para su mérito, Antoku fomenta una cultura de apertura en lo que respecta a la aceptación del [Glossary('Dharma','podgloss.dharma')] y la representación de género. Le preocupan poco las Tradiciones en la sociedad $pod_kueijin$, considerándolas secundarias frente a las instituciones del Japón mortal. Esto ha convertido al Uji Taira en una extraña mezcla de tradicionalistas acérrimos que conviven con $pod_kueijin$ que prefieren ignorar el panorama político y centrarse en su Iluminación dhármica, algo que pueden hacer fácilmente siempre que den las apariencias ante la línea del Uji.\n\nDestino futuro en el Canon\n\nAntoku disfrutará de su momento de gloria durante la Restauración Meiji, donde su postura proimperial y sus contactos imperiales serán repentinamente cortejados por todos los demás Uji preocupados por el aumento del poder del Emperador.\nSin embargo, será un triunfo efímero. La frenética carrera de Japón hacia la modernidad dejará a los Taira como una peculiar reliquia de tiempos pasados con poca relevancia política."
 POD_persistentpodlore.desc.795307: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nElior se encuentra entre los últimos de los Menahemites, fieles seguidores de Menahem ben Shlomo ben Dawid, asesinado hace varias Generaciones. El qa'im de Shlomo ben Ruji juró eliminar el yugo impuesto a su pueblo por los musulmanes, los cruzados y la prole de Lilith que los seguía. Liberaría primero Amadiya, luego Bagdad y, finalmente, la propia ciudad santa de Jerusalén. Sin embargo, fue abatido por la traición de su familia por 10.000 monedas de oro, un acto que sus seguidores creen que fue impulsado por esas malditas criaturas de las sombras, pues nadie más podría financiar tal esfuerzo.\n\nMientras muchos se mofan de quienes siguen siendo leales a lo que ven como un Mesías caído, ellos afirman conocer la verdad. Menahem estudió con el Rosh Hakehillah, Chisdai el Jefe de la Cautividad, el principal Rosh Yeshiva, Gaon Jacob y un Magi, seguidor del profeta Daniel. Nadie estaba más versado en todos los asuntos ocultos y mágicos, tanto judíos como árabes, que sus maestros. Aprendió muchas cosas de estos maestros que le ayudaron en su gran lucha: la capacidad de ocultarse de la vista de su enemigo, cruzar masas de agua sin necesidad de un barco, convocar la luz divina para disipar la oscuridad... y quizás escapar del reclamo de la muerte.\n\nSe dice que si su visión se cumpliera, Menahem y su padre regresarán para liberar verdaderamente a los judíos y erradicar la infestación de la prole de Lilith que asola su tierra santa.\n\nPero recuerda, si Elior ha de capear la tormenta que se avecina y lograr tal objetivo, necesitará recurrir a las enseñanzas transmitidas por Menahem. Muchas amenazas se interponen en su camino, y poco separa al último de los Menahemites de la muerte."
 POD_persistentpodlore.desc.795201: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nUna vez, existió la Cofradía de la Llama Brillante.\nUna vez, nació una cofradía de cuatro.\nLas crías aprendieron a hablar, a cantar, a gritar. Una no lo hizo.\nUna no habló durante muchos años y la Cofradía no logró encontrar un remedio.\nUna evitaba a los demás. Una nunca podía ser encontrada. Una no aparecía por ninguna parte. Una siempre estaba justo ahí.\nUna había aprendido a evitar las miradas de lástima. Una había aprendido a caminar en silencio. Una había aprendido su propio Camino.\nEntonces llegó el Primer Cambio.\nLa antigua cría habló, pero sus palabras eran lentas. Cantó, pero la melodía era amarga. Gritó, pero los vientos no la oyeron. El Mokolé tartamudearía con sus palabras.\nLa Cofradía se regocijó, pues finalmente habló. Entrenaron al Mokolé en todo. Cómo luchar, cómo pensar, cómo soñar.\nSu Cofradía valoraba la fuerza, pero él no era fuerte.\nSu Cofradía valoraba la sabiduría, pero él no era sabio.\nSu Cofradía valoraba el honor, pero él era una sombra.\n\nUna vez, la Cofradía fue atacada.\nLa fuerza no los salvó.\nLa sabiduría no los ayudó.\nEl honor no los perdonó.\nUna sombra permaneció.\n\nUna sombra aún permanece."
 POD_persistentpodlore.desc.795202: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nDesde que era un joven cachorro, Khabash siempre estuvo fascinado con las historias sobre la antigua Khem. La magia, las momias, las bestias, incluso los impuros vampiros. Sus preguntas eran muchas, pero las respuestas que recibía eran pocas. ¿Qué pasó con nuestra Tierra Natal? ¿Por qué no podemos volver? ¿A dónde fue Sobek, el Dios Cocodrilo? Sus maestros le decían que descubriría todo esto cuando creciera y pudiera experimentarlo a través de su propia Mnesis. Así que Khabash esperó con ansias, idolatrando a los héroes de estas historias.\n\nCuando Khabash finalmente lo comprendió, su mundo se derrumbó. Sus héroes habían perdido, Khem se había perdido. Ahora anhela regresar a un hogar que nunca conoció. Vengar a personas que no conoce. Matar a Sobek para que su memoria ya no esté empañada."
 POD_persistentpodlore.desc.795203: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nNacido en el seno de una familia de ministros adinerados, Hao Zhi recibió una educación excelente en toda clase de temas esperados para su estatus. Pasó su infancia asistiendo a clases y ayudando a su familia en sus empresas. La vida era sencilla y Hao Zhi estaba contento, hasta que experimentó el Primer Cambio.\n\nQuizás debido a su naturaleza tranquila, su experiencia fue bastante contenida y pasó completamente desapercibida para quienes le rodeaban. Sin embargo, Hao Zhi se sentía inquieto a medida que los recuerdos del Mokolé empezaban a fluir por su mente. Durante años dedicó su tiempo a perfeccionar su mente e intentar controlar su Mnesis. Finalmente tuvo éxito y logró viajar a través de los ríos del tiempo bajo sus propios términos. Pasaba muchas noches soñando con el pasado, con las figuras legendarias de las que le habían hablado. Una figura le interesaba en particular: Zhuge Liang.\n\nHao Zhi siempre tuvo afinidad por la táctica militar, sorprendiendo a menudo a sus maestros con su intelecto. Ahora, armado con antiguas estrategias perdidas hace mucho tiempo, sus habilidades crecieron rápidamente. Decidido a valerse por sí mismo, Hao Zhi decidió presentarse a uno de los grandes exámenes para convertirse en oficial militar. Fue allí donde ganó prominencia y pronto fue notado por los otros Zhong Lung. Bajo la seguridad y compañía de los suyos, su conocimiento creció aún más. Pasa muchos de sus días en un sueño profundo mientras continúa explorando los tiempos de los Reinos Combatientes. Debido a su constante letargo, se le conoció como «el Dragón Durmiente», muy probablemente como una broma. Sin embargo, el nombre solo alegraba a Hao Zhi, pues se ha convertido en aquello que más idolatró."
 POD_persistentpodlore.desc.795204: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLong Yanshao nació en una familia de agricultores en el río Amarillo, mucho después del colapso de la dinastía Tang. Después de que su despertar revelara que era uno de los Dragones Medios, su curiosidad y los susurros sobre los Reyes Dragón que antaño habían gobernado los grandes ríos le impulsaron a viajar por la Ruta de la Seda. Solo después de viajar durante meses seguidos decidió establecerse.\n\nYanshao es un verdadero sabio: paciente, deliberado en cada palabra y gentil con todos. Su objetivo es hacer que los demás cuestionen todo lo que les rodea, para que puedan encontrar las verdades por sí mismos. Su forma de hablar es a menudo vaga y llena de metáforas, dejando frecuentemente a los mortales y a los Dragones Medios más jóvenes frustrados hasta que su significado les aclara días después.\n\nSu sed de viajar sigue en su interior. Incluso asentado, suele recorrer las rutas de las caravanas, buscando gente nueva, nueva sabiduría e historias olvidadas."
 POD_persistentpodlore.desc.795107: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nLa apariencia aparentemente plácida de aquel conocido como Nongkhai delata una mente aguda que ha prosperado en las caóticas selvas del sudeste asiático durante siglos. Aunque es un depredador temido por derecho propio, el Zhong Guo comprendió recientemente el valor de colaborar con otros. En 1190, un encuentro difícil con una banda de [akuma|E] estuvo a punto de acabar con él, hasta que la oportuna llegada del Manto Dorado [Glossary('Wu','podgloss.wu')] le salvó la piel.\n\nNongkhai es un ser de honor y desde entonces ha honrado su deuda de vida con las extrañas reinas del Fénix Escarlata... siempre que estas le muestren el respeto debido. Ahora, más interesado en el mundo exterior, Nongkhai está empezando a preocuparse. Los [akuma|E] parecen estar propagándose sin control por todas partes y sus «aliados» $pod_kueijin$ no muestran señales de ser capaces (o, a veces, de estar dispuestos a) detenerlos.\n\nNongkhai está decidido a no dejarse sorprender otra vez. Si tiene que reunir él mismo a los demás seres sobrenaturales preocupados de las selvas para detener esta marea de oscuridad, que así sea. Después de todo, los Mokolé fueron reyes de todo hace mucho tiempo."
 POD_persistentpodlore.desc.795108: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nA solitario «Dragón del Norte», Tong Long Hua ha sido una figura conocida por la poderosa Corte del Emperador Amarillo durante siglos. En sus primeros días, incluso se le veía a menudo asistiendo a la corte, ofreciendo conocimientos inestimables heredados de las impresionantes memorias de los Mokolé. Algunos incluso afirman que invitaba a $pod_kueijin$ sabios y respetuosos a su retiro para debatir sobre el fin de las dinastías mortales. Sin embargo, esto no ha sucedido en mucho tiempo.\n\nTong Long Hua se ha vuelto más recluso en las últimas décadas, algo que la Corte del Emperador Amarillo atribuye a la vejez. Las mentes más sabias, sin embargo, lo ven como una señal del declive espiritual de la Corte: el gran dragón sabio no está satisfecho con lo que experimentó en sus últimas visitas.\n\nLa verdad solo la conoce el propio Tong Long Hua y no piensa compartirla. Queda por ver si el erudito dragón tiene la intención de actuar o de quedarse al margen del aparentemente inevitable colapso moral de los sobrenaturales de China."
 POD_persistentpodlore.desc.795109: "Este personaje forma parte de $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo ampliaron para dar mayor profundidad al escenario.\n\nUna joven (según sus estándares) Mokolé, Red-Sky-Waiting se debate entre su terquedad natural y las realidades del mundo que se hunden en su ser.\nDotada para acceder a la memoria colectiva de los suyos, vio la gloriosa era pasada como una señal de lo que estaba por venir y hacia lo que debía esforzarse. Su primer contacto con la realidad fue amargo, al descubrir que los sobrenaturales de la India no simpatizaban mucho con sus ideas y que incluso sus parientes preferían una vida de contemplación.\n\nCurtida por la experiencia, Red-Sky-Waiting ha dedicado las últimas décadas a empresas más eruditas. Aun así, el fuego de su juventud no se ha extinguido todavía y solo haría falta una pequeña oportunidad para que persiga una vez más sus ambiciosos sueños."
 POD_persistentpodlore.desc.795110: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nLa «Luz Radiante», la «Reina de los Muchos Colores», Wolaru es conocida por muchos nombres por su pueblo, los Gumagan. Líder de los cambiaformas de Bandaiyan, la Tierra del Fuego, Wolaru vive al margen de las preocupaciones de otros sobrenaturales. Protege a la Madre, da la bienvenida a quienes hacen lo mismo (como los niños Possum de cara de perro, o «Bunyip») y aniquila a quienes no lo hacen. Una existencia sencilla pero plena.\n\nSin embargo, la vida es un ciclo y todas las cosas deben cambiar. Wolaru lo sabe y ha visto las señales de tiempos turbulentos por venir. Le preocupa que defender Bandaiyan no sea suficiente y que la próxima oleada de atacantes sea demasiado fuerte para su Clan.\nAl dirigirse al límite de la tierra de su pueblo en Papúa, Wolaru observa ahora el mundo exterior y reflexiona. Una postura proactiva, algo tan ajeno a su mentalidad, podría ser lo único que salve el futuro de su pueblo.\n\nDestino futuro en el Canon\nWolaru luchará valientemente para defender Australia contra los sobrenaturales que se aproximan. El genocidio de los Bunyip eliminará a sus únicos aliados y, sin embargo, la interminable horda de vampiros resultará ser demasiado. Tras un último acto de desafío que reducirá a cenizas a muchos vampiros y Ghouls, Wolaru caerá en el letargo, sin llegar a presenciar jamás el exilio de su pueblo de la Tierra del Fuego."
 POD_persistentpodlore.desc.795112: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nA pesar de ser una Mokolé muy joven, Se-Alza-Sobre-los-Reyes está muy orgullosa de quién (y especialmente de qué) es. Aunque su nombre elegido ha sido considerado un poco demasiado grandioso por muchos de los habitantes de la isla de Komodo, ella siente que su linaje de Dragones Medios significa que está destinada a la grandeza. Muchos piensan que la exposición prolongada a la memoria colectiva de los Mokolé debería disipar rápidamente las ilusiones de grandeza de Se-Alza-Sobre-los-Reyes, y ella está de acuerdo... razón por la cual accede a ella tanto como le es posible.\nEsta situación es precaria, ya que limitarse en ese sentido sin duda frenará su crecimiento espiritual, pero el miedo a perder quién es (y su alta opinión de sí misma) también es un buen disuasivo. Esto, sorprendentemente, la ha llevado a encontrar nuevas formas de mejorar y demostrar sus pretensiones de una manera más mundana. Por eso, Se-Alza-Sobre-los-Reyes es en realidad una administradora hábil (para los habitualmente indolentes Mokolé de su nidada) y está atenta a la evolución de las situaciones políticas de las islas circundantes ante posibles amenazas contra su pueblo.\n\nSi continúa de esta manera, podría convertirse en una líder inusual pero fiable para la isla de Komodo en el futuro."
 POD_persistentpodlore.desc.795113: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nComo indica su nombre elegido, Swims-in-Mbembe's-Wake está orgulloso de su herencia. Aun así, vivir a la sombra del mítico primer Mokolé no es el camino más fácil de seguir.\n\nSwims-in-Mbembe's-Wake es uno de los muchos hijos de Mokolé-Mbembe y recibió su educación de manos de los muchos compañeros de parentela de su padre. Rara vez vio al hombre en persona, ya que Mokolé-Mbembe no opera en la misma línea temporal que los demás, durmiendo a menudo durante siglos. Swims-in-Mbembe's-Wake pronto se dio cuenta de que no era el más inteligente ni el guerrero más hábil entre sus hermanos y se desesperó por encontrar una forma de ser digno de su nombre. Fue solo su encuentro con otros cambiaformas lo que cambió su destino.\n\nAl darse cuenta de que poseía una curiosidad innata de la que carecían otros Mokolé, Swims-in-Mbembe's-Wake pronto se esforzó por aprender más sobre aquellos bendecidos por la Madre. Esto lo convirtió poco a poco en el intermediario entre el Clan de Mokolé-Mbembe, antes aislacionista, y el mundo exterior, una tarea en la que prosperó. Tras décadas perfeccionando este talento, Swims-in-Mbembe's-Wake ha fundado su propio Clan y ha mostrado una gran promesa en ello, testimonio de sus habilidades únicas.\n\nDestino futuro en el Canon\nAl llegar la era moderna, Swims-in-Mbembe's-Wake se habrá convertido en el líder más conocido y de facto de los Mokolé africanos. Su participación como líder de la alianza Ahadi resultará decisiva para salvar África de una terrible amenaza."
 POD_persistentpodlore.desc.795114: "Este personaje forma parte del $pod_wod$, pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nA pesar de que la mayoría de los Mokolé son criaturas plácidas y contemplativas, Sand's-Last-King es un guerrero audaz hasta la médula. Francamente, no tuvo otra opción más que serlo.\n\nComo indica su nombre elegido, Sand's-Last-King lidera su Clan de la Orilla del Río Negro en el sombrío presente, donde los Hijos de Set han triunfado sobre la $glossary_osirian_league$. Aunque es demasiado joven para haber participado, las memorias colectivas de los Mokolé le han mostrado mucho, incluyendo al propio Set secuestrando y realizando magia impía sobre el progenitor Mokolé, Sobek.\nEsta experiencia y la realidad de que su Tierra Natal está invadida por sus enemigos Setitas ha convertido a Sand's-Last-King en un general sombrío propenso a arrebatos de ira. Lamentablemente, esto lo ha distanciado de los demás remanentes de la Liga Osiria, lo que a su vez hace que la victoria definitiva de Set sea aún más posible. Queda por ver si la pura determinación y valentía de Sand's-Last-King serán suficientes para ganar esta guerra eterna por su cuenta.\n\nDestino futuro en el Canon\nSand's-Last-King se suavizará con la edad, lo que le llevará a aceptar unirse a la alianza Ahadi —una especie de Liga Osiria renacida— en los tiempos modernos. Sus capacidades de liderazgo resultarán críticas para los esfuerzos de la alianza, pero su salud debilitada lamentablemente acortará el próspero futuro que su Clan podría haber visto."
 POD_persistentpodlore.desc.795115: "Este personaje forma parte de $pod_wod$ pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para aportar mayor profundidad al escenario.\n\nLa integrante más joven de los Hijos de Sobek es una de las pocas que no sufre por los recuerdos de sus antepasados caídos. Aunque ella los ha experimentado como el resto de su Clan, Swali los ve como una especie de advertencia, una forma de asegurarse de que los errores del pasado no se repitan.\n\nA la antigua Liga Osiriana le faltaba cohesión y, aunque muchos de sus miembros eran poderosos, este defecto los hacía, en última instancia, más débiles que los Seguidores de Set, mucho más unidos en su propósito. Así, Swali espera, escucha y explica más que muchos de sus parientes. Sin embargo, su valentía no es cuestionable, ya que ya se ha unido a sus Antiguos en varias cacerías.\n\nEn muchos sentidos, parece la encarnación del equilibrio entre el habitual y contemplativo Mokolé y los Hijos de Sobek, más asertivos y a veces coléricos. Algunos se preguntan si dicho equilibrio acabará siendo la clave de su futuro."
 POD_persistentpodlore.desc.795116: "Este personaje forma parte de $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nEl heredero de Sand's-Last-King es, al menos para el mundo exterior, muy parecido a su padre. Atormentado por los recuerdos colectivos de la derrota de la Liga Osiriana a manos de los Seguidores de Set, Unseen-in-Shallow-Water es un militar audaz y colérico que no se detendrá ante nada para vengar el linaje caído de Sobek. Esta es, de hecho, la diferencia clave entre padre e hijo.\n\nLa visión de Sand's-Last-King sobre la situación es sombría y más fatalista; aunque rendirse no está en su naturaleza, acepta que la derrota es un desenlace probable. Unseen-in-Shallow-Water no lo hace. Hay muy poco que no esté dispuesto a hacer para asegurar una victoria para los Mokolé, incluyendo cruzar líneas que serían imperdonables para su padre y muchos otros.\n\nSin embargo, ante la desesperada situación en la que ve a su Clan, puede que solo haya lugar para medidas desesperadas.\n\nDestino futuro en el Canon\nEn los tiempos modernos, cuando la decadente salud de su padre finalmente se lo lleve, Unseen-in-Shallow-Water ascenderá como líder del Clan. Su primer plan de acción será sumamente desagradable para cualquiera que viva en Egipto..."
 POD_persistentpodlore.desc.795213: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial de $pod_wod$.\n\nLittle, llamada así por su diminuto tamaño al ser la más pequeña de su camada, era un raro tigre blanco. Pero su vida fue casi muy corta, ya que los [akuma|E] habían capturado a sus padres. A su padre tigre le quitaron la piel y lo arrojaron al mar, y su madre Khan fue masacrada. Como en un juego, los hombres-demonio liberaron a los cachorros, y Little solo pudo desesperar mientras sus hermanos eran cazados y masacrados por los demonios. Pero la pequeña tigresa recibió el favor de la Madre Esmeralda, la cual tomó al poderoso Chatro y mató a los demonios. Al ver lo que les pasó a sus hermanas, juró que ninguno de sus hijos sufriría tales destinos, fueran de su sangre o no. Numerosos Khans fueron adoptados por ella y tuvo muchos compañeros. Tras perder a toda su familia, deseaba una enorme. Y sin importar qué tan lejos fueran, siempre los recibiría en casa. El Khan que inicialmente le enseñó a ser una Khan, Soft-Walker, solía transmitirle noticias de aquellos por todo el mundo. Y le recomendó a una mujer que buscaba proteger a las mujeres de las desgracias que a menudo se les imponen. Little la buscó y, cuando la Khan Antigua conoció a la Flor de Sangre Piyau, se hicieron grandes amigas; no mucho después compartieron «comuniones especiales» en los Pozos Yang de Piyau y en el Señorío de la Guarida de Little cuando necesitaban un descanso de sus compañeros varones.\n\nSin embargo, mientras Little contempla su situación, las cosas parecen ir a peor. Los demonios se están activando de nuevo y, esta vez, ella tiene mucho que perder. Es fuerte, pero le preocupa profundamente la seguridad de sus hijos. Piyau está en una senda de guerra, y involucrarse podría ser potencialmente desastroso. Pero al mismo tiempo, ¿no los dejaría el aislamiento desprevenidos para cuando lleguen? ¿Qué puede hacer una madre en una situación así?\n\nDestino futuro:\nEn última instancia, recordando a sus hermanos muertos y temiendo lo que pasaría si moría como su madre, Little se unió a la marcha de Piyau, con sus propias hijas luchando junto a los Monos Desolladores. Little envejecería y tendría el raro honor de morir de vejez, convirtiéndose en una Leyenda para los Khans de Malasia. Y rodeada de sus hijas, sus nietos y su familia extendida, murió derramando lágrimas de alegría."
 POD_persistentpodlore.desc.795214: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial de $pod_wod$.\n\nAntaño, los tigres de Malasia e Indochina eran la $glossary_fera$ dominante en la vasta región del sudeste asiático. Pero esos días de gloria han pasado. Y murieron con Noble-Fang, y no hay ningún Khan en la región que no llore su pérdida.\n\nEl mayor de su linaje, Noble-Fang, procedía de una larga estirpe de líderes Khan, con un porte impecable y un físico perfecto. Astuto, capaz, amable, carismático e inquebrantable ante el peligro, era un rey ideal para una era peligrosa. Con el declive de sus aliados en la Corte del Fénix Escarlata, Noble-Fang se encontraba en una posición increíblemente peligrosa, pero la afrontó directamente. Al tomar como poderosa pareja a Little White-Fur, aspiraba a construir algo que perdurara para que sus hijos lo heredaran, como hicieron sus antepasados antes que él. Sabía que su hermano menor continuaría su linaje y, sabiendo cuánto deseaba Little tener una familia, afirmó que sus hijos serían White-Furs, y por sus futuros pelajes, tal cosa era segura. Así, con un legado a sus espaldas y un destino por delante, lideró a las huestes de Khans reunidas para diezmar a las fuerzas [akuma|E] en Malasia. Ya consagrado y honrado siendo joven, los Bon Bhat partieron para poner todo en orden bajo la Madre Esmeralda.\n\nY fracasó.\n\nRangda esperaba que los Khans atacaran, así que envió a sus Leyaks a la acción. Una enfermedad sobrenatural y horrorosa asoló su campamento, afectándoles con un enemigo contra el que no podían luchar. En cuanto respiraron el miasma enviado, las pústulas cubrieron sus cuerpos, transformándose en voraces gusanos que los devoraban vivos antes de estallar en un miasma infeccioso similar. Sabiendo que si se propagaba Rangda podría condenar continentes enteros, Noble-Fang pidió a varios espíritus que enviaran unos últimos mensajes a su esposa y a su hermano antes de que, junto a sus hombres, se pusieran en cuarentena yéndose al Señorío Umbrío de Erebus para lanzarse a la plata fundida. Héroes moribundos, pero condenando su sueño en su propia Generación."
 POD_persistentpodlore.desc.795217: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nPara las Cortes de la Bestia, la Madre de los Harimau es venerada por su lugar entre los Kan de Malasia. Los Muertos que han regresado, los Cambiantes de la Realidad, la miríada de Hijos de la Madre Esmeralda y otras cosas más extrañas le rinden homenaje. Cuando miran a sus hijas, esperan ver herederas tan poderosas y orgullosas como ella. Y cuando miran a su hija homínida mayor, Ratna, rompe rápidamente esa imagen.\n\nRatna nació enfermiza y débil. Durante 5 años, Ratna estuvo a menudo confinada en el Señorío-Guarida de su madre por su seguridad, e incluso ahora, rara vez se aleja. A diferencia de su madre, Ratna era pequeña, incapaz de levantar la mayoría de los objetos pesados y se asfixiaba rápidamente. Y cuando el Primer Cambio la pasó por alto, Ratna sintió una gran vergüenza de lo que llegaban a ser. A pesar de la constante afirmación de Little de que aún la amaban, Ratna seguía sintiéndose horriblemente inútil. Envidiaba a los otros Kan y Mujeres-Diablo, erguidas y orgullosas en su feminidad y fuerza, mientras que en aquel entonces ella era un patético cascarón de lo que era su madre. Algunos en el clan de Little susurran que Little hizo que Ratna se entrenara en las artes de la hechicería para intentar evitar que hiciera algo «drástico». Y aunque Ratna encontró una gran alegría en la Alquimia (evidenciado por cómo su antigua presentación masculina ha quedado casi olvidada debido a las alteraciones de sus medicinas en su cuerpo, hasta el punto de que nadie sabría jamás que Little tuvo un hijo), todavía anhela la oportunidad de sentirse digna de su madre. Mientras estudia los discursos de Little, Ratna anhela unirse a la cruzada de Piyau. Quizá allí, con su Alquimia, pueda ser útil.\n\nDestino futuro:\nLa vida de Ratna, y luego su no-vida, dio varios giros críticos. Cuando Little se unió formalmente a Piyau, Ratna huyó para unirse al ejército de Piyau, pero fue emboscada por el [akuma|E] en el camino. Pero Little se adentró en los Infiernos por su hija y encontró a Ratna llamándola en el Infierno de la Magia Malvada. Ratna fue rescatada por su madre y llevada ante Piyau para su educación. Ratna se convirtió en discípula de Wati y, con su nuevo cuerpo de diablo, las debilidades de la vida desaparecieron y se convirtió en una [Glossary('Penangallan','podgloss.penangallan')], un vínculo eterno entre los Pelos Blancos y las Cortes Doradas. En la modernidad, Ratna se convertiría en una de las Reinas Penangallan, con un servicio legendario y honrado como heroína entre los suyos."
 POD_persistentpodlore.desc.795218: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nPara la gran mayoría de las personas que van a ver a Little, suelen buscar rumores sobre ella y la majestad que sus cachorros han alcanzado. Y al ver a Somya, no cabe duda de quién la sucederá.\n\nLa segunda de sus hijas humanas, Somya, desde su nacimiento, siempre fue una niña grande. Pesando 4 kilogramos al nacer, Somya tenía la musculatura de un tigre y se alzaba sobre sus hermanas con facilidad. No fue ninguna sorpresa cuando, durante una caza, tomó la forma de Chatro para abatir a un elefante. Aunque no es una gigante real, se le acerca bastante. Heredando la fuerza de su madre, ya ha logrado mucho, destruyendo una guarida de [akuma|E] y liderando una guarida por derecho propio hasta el día en que pueda hacerse cargo del clan.\n\nPero Somya es más que su fuerza. Somya ha estudiado las obras de la Guerra de la Vergüenza y las conquistas iniciales que formaron las Cortes Augustas. Acostumbrada a la selva y una logística increíblemente capaz, cree firmemente que el futuro de los Kan está en la guerra. Sabe que su familia no puede durar mucho tiempo sola, así que se esfuerza por unir fuerzas con los actualmente reclusos [Glossary('Penangallan','podgloss.penangallan')] y formar una gran hueste para purgar Malasia y Nusantara de los azotes que las atormentan.\n\nDestino futuro:\nLas súplicas de Somya serían escuchadas. Aunque Somya no se unió directamente a la hueste de Piyau, apoyó las fuerzas de su madre en la guerra mientras marchaban por el continente, tomando sus posesiones continentales. Tras el fallecimiento de Little, Somya asumiría el liderazgo del clan y apoyaría directamente la purga de la Corte de Jade por parte de la Corte Dorada. Además, expandiría enormemente la Línea de Sangre de Little, engendrando crías y bebés con tanto fervor como su madre."
 POD_persistentpodlore.desc.795219: "Este personaje fue creado por los desarrollos de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nSi bien se sabe que Little tiene 3 hijas humanas, a menudo solo ven a la retraída y dócil Ratna o a la poderosa y orgullosa Somya. Pero entonces pueden sentir a la tercera. Mahendradatta siempre está acechando no muy lejos después de todo.\n\nMahendradatta es una caso aparte, similar a su hermana mayor Ratna en el hecho de ser la oveja negra de la familia. Aunque experimentó el Primer Cambio mientras nadaba y luchaba contra una corriente de resaca, eso hizo poco por la aversión de Mahendradatta a ser observada. Se mantuvo evasiva, tanto en palabra como en apariencia. Y, sin embargo, los enemigos del Sept solían ser encontrados más tarde, horriblemente destrozados y expuestos como advertencia. E incluso sus amantes realmente no la ven más allá del dormitorio. Solo su familia puede decir realmente qué es lo que motiva al tigre.\n\nPero Mahendradatta es una asesina devota, y sin remordimientos al respecto. A donde Little le pida ir, ella irá, y a quien Little le pida matar, ella matará. Su agencia política es prácticamente inexistente y, para horror de su madre, ha afirmado que incluso mataría a sus hermanos si se le diera la orden. Al menos, es constante en su devoción por su madre y su Sept, como una buena hija debería ser, en su mente.\n\nDestino futuro:\nMahendradatta sería una de las hijas que Little envió para ayudar directamente a Piyau. Como agente más sutil, a menudo era utilizada como asesina en lugar de un arma contundente para lanzarla contra una línea. Y tras su impresionante servicio, Mahendradatta se uniría a la batalla contra Qiang Ru en la Corte de Jade. Allí, moriría gloriosamente abatiendo a los gemelos diabólicos albinos e incestuosos, regresando a la Madre Esmeralda con los más altos honores."
 POD_persistentpodlore.desc.795220: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLa hija mayor de los hijos felinos de Little, Grim-Whiskers, representa un factor retorcido y aterrador en el clan de su madre. Cuando era una cachorra, mientras Little aún aprendía a gestionar un clan, un [akuma|E] que buscaba cenas particularmente ricas en esencia encontró a una joven tigresa e hizo un juego para ver cuánto podía abrirle la cara antes de que se desangrara, festejando con su esencia. Pero para su horror, el trauma de la desfiguración causó que la tigresa se levantara, se ajustara y tomara la Crinos, y la partiera en dos tan rápido que el Akuma no se dio cuenta de que estaba descendiendo a la Muerte Definitiva para cuando su cuerpo salía volando hacia el Océano Índico. Y cuando Little acudió a los gritos, encontró a una niña llorando mientras se sujetaba su rostro aún mutilado por las heridas mágicas.\n\nGrim-Whiskers nunca ha superado realmente el incidente. Una sombra pende sobre ella, y evita en gran medida la corte de su madre cuando puede. Enojada y furiosa con el Akuma por lo que le hizo, siente un placer especial al matarlos. Atormentada aún más por el fuego que lleva dentro por amor tanto al corazón como a la carne, tan marcada está que lucha con muy pocas mujeres que la encuentran tolerable. Enojada, amargada, deprimida y frustrada, es una guerrera que arrasa con todo a su paso, desquitándose con aquellos a quienes mata cuando es enviada a la guerra. Dado su enfoque en el combate, todas las demás ocupaciones han quedado en segundo plano. Si Somya la ha pasado por alto para la sucesión y se ha quedado con las cartas que le tocaron, que sea lo último que vean esos demonios.\n\nDestino futuro:\nGrim-Whiskers se uniría a Mahendradatta cuando fuera enviada con Piyau, y encontraría su propósito en sus ejércitos. Pero lo que es aún más asombroso es que encontró a alguien que no solo vio sus cicatrices de batalla, sino que la vio tal como es, inmaculada. Grim-Whiskers y la Dhampyr Nidhi se volvieron inseparables, y aunque Nidhi tomaría varios consortes en la tradición [Glossary('Penangallan','podgloss.penangallan')], los berserkers siempre encontraban que sus corazones volvían el uno al otro. Y Grim-Whiskers moriría pacíficamente de vieja como una Kan Antigua, sonriendo en los brazos de su Dhampyr."
 POD_persistentpodlore.desc.795221: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLa segunda de los gatitos de Little, Noble-Mane, estaba entre los más omnidiciplinarios. Una Twilight hábil y casi sin parangón, Noble-Mane se esforzó desde su Primer Cambio por dominar todo lo que pudo. Las Leyes de la Madre Esmeralda fueron sus estudios favoritos, y llegó a ser una experta central de su sept en su interpretación. Tras tutorizar con Antiguos extranjeros y estudiar todo lo que pudo, regresó y se le reconoció como la líder espiritual de su sept, a pesar de su corta edad. Y aunque las estructuras excéntricas del hombre se le escapan, comprende la magia. Estudia sin cesar sobre lo oculto, buscando cualquier ventaja posible contra los Infernalistas que saquean sus hogares. Y cuando dicta sentencia, prefiere impartirla ella misma, con colmillo y garra.\n\nAhora, Noble-Mane vela por los augurios y presagios de sus dones, haciendo todo lo posible por aconsejar a su madre. Ve presagios temibles trazados en la sangre de las serpientes y en el fuego, pero también en el acero y el rayo. Lo que esto significa aún no lo sabe, pero sabe que los Khan deben actuar. Insta a su madre a actuar, insistiendo en que no deben permitir que llegue el tiempo del metal y el rayo, pues todos los presagios tras tal evento terminan. Y ahora, mientras Little reflexiona sobre el consejo de Noble-Mane, esta ya ha estado dirigiendo sus propias fuerzas para empezar a acumular poder.\n\nDestino futuro:\nNoble-Mane se sintió orgullosa de la decisión de Little de unirse a Piyau y supervisó su Sept mientras Somya hacía la guerra y Little se reunía con Piyau. Aunque le molestaban los sermones de su hermana menor, Proud-Eyes, lo llevaba con calma mientras buscaba sus propias respuestas a la profecía. Al final nunca llegó a saber qué había sucedido y murió fiel a la Madre Esmeralda, tras aniquilar una guarida de Kumo."
 POD_persistentpodlore.desc.795222: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nLa más joven de los hijos de Little, e indudablemente la más engreída, Proud-Eyes actúa a veces como si no tuviera consideración por el funcionamiento de su madre, sino que se beneficia de ello. El cachorro de su camada con el pelaje más impecable, su primera vez adoptando la forma Homid irradió una belleza que avergonzó a sus hermanas, y adoró la atención. Una mariposa social hasta la médula, también amaba los lujos y refinamientos de su posición. Coqueteando ya con los hombres más guapos de la corte y rodeada de riqueza, adora deleitarse con todos los beneficios de ser una hija de sangre pura de la Madre Esmeralda. Al ver el combate como una obligación secundaria, suele pasar el tiempo en su posición, vestida de oro y ropas finas en un fastuoso Señorío-Guarida decorado con delicias maravillosas y exóticas. Cuando llega a luchar, suele elegir [akuma|E] que sean ricos, para así saquear sus refugios, tomar la riqueza para sí misma y encontrar nuevas formas de adornarse. Y a pesar de tal vanidad, sigue siendo una Khan, y un gigante hombre-tigre vestido de oro tiene su propia Presencia.\n\nProud-Eyes, sin embargo, está frustrada con este discurso sobre la guerra. Preferiría mil veces disfrutar de los placeres de la vida y siente que se le ignora. Incluso la pequeña Guarida que se le concedió con la esperanza de que le enseñara responsabilidad ha resultado ser otra forma de financiar sus deleites, y sus protestas son cada vez más fuertes. Quizá su madre ceda, ya que realmente ama a su pequeña princesa. O quizás Proud-Eyes tenga finalmente que dar un paso al frente y ser responsable.\n\nDestino futuro:\nLa unión formal de Little con Piyau provocó un gran berrinche en Proud-Eyes, pero al menos la obligó a afrontar la realidad. Siendo realmente la más sociable de la familia White-Fur, fue la principal encargada de tratar con los delegados de las Cortes de la Bestia y las Cortes Doradas. Y hay que reconocerlo, lo hizo bastante bien. Y aunque los innumerables padres de sus hijos hicieron poco por linajes más «respetables», ella acabó engendrando a muchos más Khan que se extenderían por Malasia y Nusantara."
 POD_persistentpodlore.desc.793530: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nMuchos esperan que los discípulos de la filosofía del Retorno al Poder sean individuos ambiciosos impulsados por su codicia o arrogancia. Hanzhang demuestra que las generalizaciones rara vez son sabias.\n\nUn funcionario menor durante sus días mortales, Hanzhang tenía suficientes recursos para alimentar a su gran familia y era feliz con su suerte. Sin embargo, no era ciego al sufrimiento de los demás, pero lamentaba no poder hacer mucho para mejorar la situación. Murió con una familia amorosa a su alrededor y una comunidad local que lloró su partida, pero esta preocupación terrenal seguía atormentando su alma. Los [UmbraGlossaryLocalized('yomi_wan','Mil Infiernos ')] fueron su única recompensa por esa vida benévola pero llena de dudas.\n\nHanzhang demostró ser un alma más resistente de lo que muchos (incluyéndose él mismo) habrían anticipado. Aunque suplicó, rogó e hizo cosas de las que no se sentía orgulloso, nunca se quebró del todo y encontró su propio escape de vuelta al mundo. La sociedad de los $pod_kueijin$ no le atraía, ya que la consideraba un delirio retorcido destinado a evitar que abordaran los problemas reales. Alejándose de la Iluminación con cada noche que pasaba, solo cuando encontró a Kang Cho-lu fue cuando Hanzhang halló un nuevo propósito.\n\nA diferencia de su mentor, Hanzhang no ve la filosofía del Retorno al Poder como una forma de enmendar sus faltas ante el [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] (de todos modos, no cree realmente en los mitos fundacionales de su especie), sino como un medio más pragmático para mejorar la suerte de los mortales. Aunque sabe que los $pod_kueijin$ ciertamente no son perfectos, su impulso hacia una Iluminación muy tangible aún les obliga potencialmente a cumplir con un código moral, algo que él puede decir mucho más que la mayoría de los mortales.\nEs por ello que Hanzhang espera que la filosofía de su mentor cree una nueva sociedad $pod_kueijin$ dedicada a liderar y proteger a los mortales. Espera que uno de los discípulos de Kang Cho-lu (o el propio maestro) alcance pronto las [Glossary('Hundred Clouds','podgloss.hundredclouds')], creando potencialmente un efecto dominó de nuevos conversos ansiosos por guiar a la humanidad hacia un futuro próspero, incluso si se hace por su propio interés."
 POD_persistentpodlore.desc.793531: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nJilan apenas tuvo tiempo de experimentar su vida mortal antes de que una plaga la arrastrara y la lanzara a los [UmbraGlossaryLocalized('yomi_wan','Mil Infiernos')]. Tuvo que aprender rápida y eficazmente cómo sobrevivir, tanto física como mentalmente, una vez pasado el horror inicial de su situación. Por lo que pudo saber, acabó pasando décadas asimilando su situación. A decir verdad, su escape fue más un golpe de suerte que de habilidad. Su llegada a la sociedad $pod_kueijin$ fue otro shock.\n\nHasta ahora, Jilan solo conocía sus días despreocupados como una joven mortal o la experiencia de Tormento de los Infiernos. La naturaleza asfixiante, extremadamente estructurada y exigente de las Cortes no era algo para lo que estuviera preparada. Saltando de maestro en maestro sin lograr apenas progreso, Jilan fue declarada pronto un caso perdido.\n\nSu historia probablemente habría terminado aquí, en un colapso [Glossary('Dharmic','podgloss.dharma')], si no la hubiera encontrado Kang Cho-lu y sus discípulos. No le exigieron mucho y su estrecha relación con la sociedad mortal le permitió experimentar gran parte de lo que se perdió durante su vida truncada.\nAunque aún no ha logrado un progreso real en su Iluminación, al menos se ha estabilizado. Kang Cho-lu y sus seguidores se conforman con que finja ser una mortal en cada nueva ciudad que visitan, lo que ha resultado ser muy útil para recopilar información de las partes más desfavorecidas de la sociedad.\n\nEl recuerdo más orgulloso de Jilan hasta ahora es cuando el propio Kang la elogió por estar más en contacto con la Humanidad que cualquier otro en su grupo. Aun así, sabe que sus noches de experimentos relativamente despreocupados tendrán que terminar en algún momento. Cada vez que se pone la máscara de una nueva chica mortal, un sentimiento de vacío crece en su interior. Sabe que solo está imitando algo que ha perdido para siempre y teme el día en que sienta más tristeza que alegría al interactuar con los mortales."
 POD_persistentpodlore.desc.793532: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial de $pod_wod$.\n\nAnarya es una figura envuelta en el mito. Según sus discípulos, los otros Outriders que siguen a los imperios de la estepa, ella fue una Enaree escita capaz de magia despierta, pero paria por sus tratos con demonios.\nVagó por el Umbra, pero algo en el [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')] la reconfortó. Y tanto tiempo permaneció allí que su cuerpo físico se desvaneció, y pasó a formar parte del entonces incipiente infierno tanto como si hubiera muerto allí como pecadora. Cuando regresó al Mundo de los Vivos, lo hizo como $pod_kueijin$.\n\nEl entonces joven [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] se enfrentó a ella, pues era una hija de la estepa más allá de su alcance, un concepto que detestaba. Pero ella tenía experiencia en tratar con tales fuerzas, así que se ofreció a ser sus manos más allá, y entrenaría a cazadores semejantes. Él lo consideró aceptable y envió a la sacerdotisa al extranjero.\nY aunque [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] nunca confió en la sacerdotisa, ella recolectó una gran cantidad de valiosos juguetes y trofeos de los diversos imperios de la estepa que cabalgaban por el mundo. Pero no es eso lo que la hace temible. Se la teme por su reputación de crueldad insondable, fría alegría y perversa satisfacción al quebrar a sus víctimas en su propio nicho de la Cueva de las Cadenas de Púas. Convirtiendo a campesinos, caudillos y campeones por igual en monstruos con sus mentes vaciadas hasta la de meras bestias.\n\nLos otros Outriders han intentado emular sus prácticas, pero hay pocos tan grandes como la original. Y aunque [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] no confía en ella lo más mínimo, al menos es eficaz, y por ello se la tolera. Y además, solo sus pasos pueden amedrentar a cualquier fugitivo hasta someterlo aterrorizado, y muchos orgullosos $pod_kueijin$ de la Corte de la Tortuga Negra temen su susurro.\n\nDestino futuro\n\n Pese a que [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] encontró su fin, la Primera Outrider logró preservar su propia Cueva de las Cadenas de Púas como un reino infernal independiente mientras los rivales de su antiguo patrón despedazaban el [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')]. Se ocultó, pero emergió de nuevo creando nuevos Akuma para hostigar a los Ancestros de la Estepa.\n\nY llegadas las noches actuales, susurran sobre sus ambiciones de convertirse en un [Glossary('Rey Yama','podgloss.yamaking')], buscando las armas nucleares en la naturaleza salvaje de Siberia, para instaurar una era de fuego nuclear que arrase con todo salvo la estepa y ahogue el sol en un invierno nuclear, para que ella pueda alzarse como el [Glossary('Emperador Demonio','podgloss.demonemperor')] del Último Imperio de la Estepa."
 POD_persistentpodlore.desc.793533: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nLa primera Exploradora después de la Enaree en ganarse el favor de Dobrul, Roxolaia es un título, un apelativo de sus orígenes entre la Tribu Roxolani de los Sarmatas, la única parte de su pasado que su [Glossary('Rey Yama','podgloss.yamaking')] le permitió conservar.\nComo uno de los muchos pueblos fuera del alcance de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] pero muy dentro de su influencia deseada, él encargó a su Exploradora que recolectara a uno de ellos. Entonces, siendo solo la tercera hija de un guerrero, su vida cambió cuando una figura de ojos saltones en la noche masacró a su familia, la arrastró a las profundidades del infierno y la despedazó con Cadenas de Hierro. Su mente también fue fragmentada al ser injertada en la de otro recolector.\n\nRecibiendo un nuevo apelativo, la última parte de su memoria que se le permitió conservar, comenzó su servicio reformulada como una titán de poder diabólico.\n\nFácilmente la más prolífica de los Exploradores de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], muchos de los $pod_kueijin$ dentro de la Corte de la Tortuga Negra nacidos más allá del Indo fueron llevados a su fin y asesinados por Roxolaia. Simple, eficaz, implacable y brutal; cuando su [Glossary('Rey Yama','podgloss.yamaking')] hace una petición, ella la cumple.\nSin embargo, tiene poca paciencia para retenerlos, y por tanto todas sus capturas están propensas a las mismas tasas de escape que el resto de los Infiernos a los que los lleva. Pero, por suerte para ella, suele estar distante de sus víctimas, lo que hace que las represalias sean poco probables. Así que caza, buscando aún más hijos perdidos de la estepa para devolverlos a su hogar «adecuado».\n\nDestino futuro\n\nAl igual que los otros Exploradores, Roxolaia no estuvo presente en la destrucción de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. Siguiendo las órdenes de su mentor, se ocultó en las regiones fuera del alcance del Quincuncio.\nCuando este comenzó a debilitarse con la edad, sus capturas, bajo un nuevo carcelero, se convirtieron en nuevas amenazas recurrentes de Akuma para los nuevos Ancestros de la Estepa."
 POD_persistentpodlore.desc.793534: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAunque la mayoría de los Exploradores son aquellos nacidos más allá de los confines del [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')], algunos talentos hacen una excepción. Y un Xiongnu nacido en el momento de la muerte de Yuwen, el Explorador que tomó su nombre ha demostrado con creces que tiene una Ferocidad a la altura de los fuegos que consumieron su hogar.\n\nMientras iba a Lanka como pecador, Yuwen fue capturado por los Demonios de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] y llevado al [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')], donde vio algo en él que sospechó que lo convertiría en un buen Explorador.\nEl pecador fue lacerado en tiras y reformado por el [Glossary('Rey Yama','podgloss.yamaking')], y luego puesto bajo la tutela de los Enaree para su entrenamiento. Se convirtió en un Explorador ideal para adentrarse en las tierras de Rusia, un especialista en aniquilar a los horrores invocados de los Señores no-muertos nativos.\nFue un entrenamiento útil, ya que también era igual de eficaz desgarrando a los Tigres Diablo y sus Bakemono. Lo último que muchos verían antes de que los arrastrara al Infierno sería al Explorador empapado en sangre y vistiendo pieles de demonios, jadeante y aullando entre la sangre mientras los arrastraba a su perdición.\n\nDestino futuro\n\nAl igual que los otros Exploradores, Yuwen evadió la destrucción de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] gracias a que se encontraba lejos de las regiones activas.\nSin embargo, continuó su silenciosa matanza en Rusia, hasta que las fuerzas de Baba Yaga lo obligaron a volver a la atención de los Enaree. Y entonces, regresó a su antiguo servicio bajo un nuevo líder como si nada hubiera pasado."
 POD_persistentpodlore.desc.793535: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nLa gran mayoría de los pecadores sedentarios que dieron con el [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')] son los que se quiebran con mayor facilidad, pero siempre hay excepciones. Aún más raros son aquellos que abrazan el Estilo de vida y llegan a servir al señor del Infierno. Y aunque el pecador que sacrificó su alma para ser un Explorador ha sido olvidado hace mucho tiempo, el Señor es ahora quizás el Explorador más decidido.\n\nA diferencia de la mayoría de los otros Exploradores, Zhu recuerda su mortalidad con bastante claridad. Era hijo de un soldado del norte y una mujer trabajadora, quien se inclinó hacia el servicio militar porque le fascinaban los caballos. Incluso llegó a tener un contacto muy cercano con ellos, cuando fue pisoteado hasta la muerte con una flecha en la garganta durante los inicios de las conquistas del Kanato Rouran.\nPero en el [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')], su envidia era obvia para sus captores. Incluso cuando fue despedazado, contra todo pronóstico pareció mantener su mirada de hierro, con una crueldad desenfrenada que se deleitaba al ver la evisceración de los otros pecadores. Por recomendación de la Primera Exploradora, fue liberado y acogido bajo su tutela.\n\nDemostró ser increíblemente hábil navegando en cortes, un talento no aprovechado que floreció hasta convertirse en una gran habilidad, haciéndolo asombrosamente eficaz como cebo para la condenación de otros, ya que rara vez estaba solo entre los Exploradores. Sin embargo, a diferencia de los demás, ocasionalmente liberaba deliberadamente a pecadores del [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')]. Solo para que muchos de los que liberaba encontraran el camino de vuelta algún día, listos para ser quebrados de nuevo y rehechos como Akuma.\n\nDestino futuro\n\nZhu estaba con su mentora cuando [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] fue asesinado, y por ello la siguió en un breve exilio mientras el [Glossary('Anda','podgloss.anda')] y otros Akuma del caído [Glossary('Rey Yama','podgloss.yamaking')] eran aniquilados.\nA diferencia de los otros Exploradores, sin embargo, se quedó en el pequeño Señorío infernal preservado por su mentora. Allí se dedicaría a cuidarlo de nuevo, esperando con ansias el día en que pudiera ser la mano derecha y el rey del Imperio Final."
 POD_persistentpodlore.desc.793536: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nAntiguo entre los Ancestros de la Estepa, famoso por su disputa con Badmaraag y Achibaatar desde sus inicios, no hay defensor más profundo y ardiente de la pureza de la Corte de la Tortuga Negra que el maestro de los Jinetes de la Llanura de Ceniza.\n\nHabiendo su vida mortal desvanecido de la memoria hace mucho tiempo, Tugmandakh sabía que siempre sería un hijo de la estepa. Esto le infundió un orgullo tal que la presencia de aquellos que morían y partían a otros Infiernos más allá del [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')] le irritaba; no tenía tiempo ni paciencia para ellos.\nSi dejaban las estepas por las ciudades, o iban al oeste, para Tugmandakh bien podrían ser agua de escoria del fondo de un estanque estancado.\n\nSu primer gran logro fue la destrucción de una bestia como el [Glossary('Anda','podgloss.anda')] que llegó al este, con poderes de sangre similares y extraída de los pueblos conocidos como turcos. Los quebró y desolló antes de que se convirtieran en ceniza, y viste frecuentemente con las pieles de los lobos que ellos veneran y las pieles que él considera bastardos falsos y errantes de su Tierra Natal.\n\nUn Tigre Diablo si es que ha existido alguno; su brutalidad hacia todos aquellos que considera inferiores es infame. Por eso, ha dejado claro que la respuesta de la Corte al [Glossary('Anda','podgloss.anda')] debería ser cabalgar y matar al llamado Juez en combate singular. Incluso presume de que lo hará él mismo, clamando la guerra ahora e inmediatamente.\n\nDestino futuro\n\nPara sorpresa de muchos Ancestros de la Corte de la Tortuga Negra y nadie más, la temeraria carga de Tugmandakh contra Chinkai fue recibida con una eficiencia despiadada y la misma brutalidad que él siempre defendió.\nFue apaleado hasta perder el sentido, ensartado en la cima de un árbol solitario, y el Juez dictó su sentencia sobre Tugmandakh al amanecer."
 POD_persistentpodlore.desc.793537: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nPara gran pesar de los miembros más jóvenes de la Corte de la Tortuga Negra, el mayor defensor de las viejas costumbres sigue ocupando una posición de profundo respeto cultural. Un purista hasta la médula, que se niega a hablar con la gente si no encarna sus estándares; tratar con él es la prueba de paciencia más famosa de la Tortuga Negra.\n\nAchitbaatar, no obstante, se ganó su posición en la Corte. Como uno de sus miembros más antiguos, fundador y líder de los honrados y antiguos Hijos de Tengri, Achitbaatar estuvo al frente de los jinetes $pod_kueijin$ en sus gloriosas cargas contra las Cortes de la Bestia, [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], y muchas otras amenazas. Codificó la mayoría de sus leyes y nunca erró al hacerlo.\nEs absoluta y perfectamente sincero en todas ellas, lo que hizo que su deslizamiento hacia la adhesión absoluta a la Tradición y la pureza fuera aún más enfurecedor para los miembros más jóvenes de la Corte. Tan tradicional es que incluso la Corte del Emperador Amarillo no cumpliría sus estándares. Con todo el decoro mantenido, cada [Glossary('Wu','podgloss.wu')] equilibrado para hablar con él, e incluso permitiendo solo a hombres estar cerca de él, el Sabio Ciempiés disparó una vez a Badmaraag cuando ella le mostró una pequeña muestra de escarnio.\nY ahora, ante una nueva amenaza totalmente distinta a cualquier otra que hayan enfrentado, Achitbaatar insiste en que el [Glossary('Anda','podgloss.anda')] debe ser combatido como las Cortes de la Bestia, seguro de que vienen por los nidos de dragón y adamantino en que vendrán a través de la Umbra para asaltarlos.\n\nAhora, reúne a quienes están bajo su mando en preparación para su guerra, una que está absolutamente seguro de ganar, y no presta atención ni actúa con consideración hacia otros [Glossary('Wus','podgloss.wu')] Antiguos, escuchando solo a Shoukeng, ya que es el único con una sabiduría igual a la suya.\n\nDestino futuro\n\nAchitbaatar se negó a creer que el [Glossary('Anda','podgloss.anda')] (ignorando el hecho de que la mayoría de los Cainitas no pueden moverse a través de la Umbra) venía al mundo físico. Y como tal, no era consciente de que estaba siendo emboscado mientras observaba el centro de un nido de dragón, cuando flechas ardientes de la Vanguardia del Viento Negro lo mataron una vez más."
 POD_persistentpodlore.desc.793538: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nKumud vivió como pescador y murió como pescador, perdido en el mar. Su única recompensa por una vida sencilla fue el Infierno de los Siete Mares Ardientes.\n\nLe llevó mucho tiempo asimilar esta nueva existencia, pero logró encontrar el camino de vuelta, principalmente porque la señora del señorío no tenía reparos con él. Kumud siempre respetó y temió legítimamente al mar, y ella lo sabía. Así pues, regresó al mundo como un $pod_kueijin$... no es que supiera nada de eso en ese momento, ya que la isla de Liuqiu no tenía ningún Ancestro o Corte capaz de enseñarle. Y así vagó, siendo poco más que una bestia durante años.\n\nEs probable que Kumud hubiera sido abatido por un Cazador o un grupo de mortales si no fuera por la llegada de Yao Wei. La joven $pod_kueijin$ china apenas estaba comenzando su propio viaje espiritual, pero su sentido del deber era demasiado fuerte como para dejar que Kumud continuara con su frenesí.\nLe llevó mucho tiempo, y francamente bastante suerte, pero logró enseñarle lo suficiente como para salvarlo.\n\nDesde entonces, Yao Wei ha servido como una especie de mentora para Kumud mientras establece su tripulación y sus vastas ambiciones. Yao Wei respeta el mar pero no le teme, y Kumud está a la vez asustado y maravillado por su determinación.\n\nEn sus días más oscuros, Kumud se pregunta si debería huir al continente para recibir una educación adecuada. En sus días más brillantes, se pregunta si la ama.\n\nDestino futuro\n\nLa infatuación de Kumud por su mentora se atenuará con la edad, pero su respeto no lo hará. A medida que Yao Wei se embarque en su gran destino, él se convertirá en una parte respetada, aunque introvertida, de su tripulación. Se impondrá como su deber recordar a su capitana que el mar nunca debe darse por sentado, ni siquiera para el «Bandido que cabalga sobre el océano»."
 POD_persistentpodlore.desc.793539: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nA pesar de la ironía de sus títulos, Zevseg siempre estuvo entre las personas más cercanas al Gran Ancestro Tugmandakh durante sus primeros días, cuando la Corte de la Tortuga Negra ascendía a la prominencia. Silencioso pero siempre astuto, poseía toda la paciencia y el engaño de un cazador persistente.\nPocos [akuma|E] pudieron alguna vez pretender sobrevivir a sus cacerías, y menos aún pudieron hacer tales alardes sin caer en los años venideros.\nSuperando la debilidad de su constitución mortal, muchísimos demonios cayeron ante sus flechas. Y como tal, se convirtió en un botín cada vez más deseable de matar.\n\nPero a medida que la Corte envejecía, sus habilidades se embotaron. Descansando sobre los laureles de su posición, atesoraba el exceso y los privilegios de su cargo, ocupando puestos cómodos cazando jóvenes y necios [akuma|E] y dejando a los Antiguos Infernalistas de los [Glossary('Reyes Yama','podgloss.yamaking')] en manos de jóvenes [Glossary('Wu','podgloss.wu')], sin sentir ni un ápice de remordimiento mientras sufrían una muerte atroz tras otra.\n\nIncluso ahora, está demasiado ansioso por entregarse a los juegos de la corte en lugar de lidiar con la amenaza del [Glossary('Anda','podgloss.anda')], que no puede considerar seriamente como una amenaza legítima. Más bien, se la ha encargado a los otros [Glossary('Wu','podgloss.wu')], mientras él se retira a sus excesos.\n\nDestino futuro\n\nZevseg sobreviviría a la muerte de su hermano de sangre, pero su destino final es desconocido. Desapareció antes de que el [Glossary('Anda','podgloss.anda')] cayera; lo último que se escuchó de su refugio fue el traqueteo de cadenas de hierro y susurros en una lengua muerta hace mucho tiempo.\nNo se le volvió a ver."
 POD_persistentpodlore.desc.793540: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial de $pod_wod$.\n\nAunque la Corte Negra siempre ha tenido su buena dosis de rumores debido a su decadencia, a menudo se le desacredita. Después de todo, si fuera cierto, ¿no estaría plagada de Dhampyr? Al menos, esa es la razón oficial. Y Tamir se asegura de que esa imagen no se vea empañada.\n\nSiempre siendo un hijo indeseado en su mortalidad, Tamir era el hijo primogénito de un jefe, pero el menos favorito. La actitud y el narcisismo de Tamir siempre irritaron a su padre, y fue enviado al infierno cuando su padre, su hermano menor, su madre y sus tres hermanas lo llenaron de flechas tras golpear a su entonces hermano bebé por la ira de que el niño le derramara leche encima, enviándolo al Infierno de las Cadenas de Púas.\n\nSin embargo, su estancia allí fue breve, ya que la tribu a la que fue asignado se hartó tan pronto de él que lo expulsaron.\nFinalmente encontró un espíritu afín en Tugmandakh. Y una vocación aún mayor al lidiar con los Dhampyr indeseados. Ya repulsado por los asquerosos goblins llamados niños y cualquier cosa relacionada con su creación, sintió un orgullo algo desconcertante al destruir Dhampyr no aprobados, y entre sus hazañas con su [Glossary('Wu','podgloss.wu')], su edad y su servicio en la época de las Leyendas, pocos pueden desafiarlo cuando reduce a un engendro del diablo a una papilla de carne.\nLa Iluminación es difícil, y proteger el mundo requiere decisiones difíciles. Y a medida que los [Glossary('Anda','podgloss.anda')] se acercan, tener más soldados no es razón para contaminar el mundo con más niños. Así que masacra para que sean guerreros, todo por el bien de imponer la ley de la Corte de la Tortuga Negra.\n\nDestino futuro\n\nEl destino de Tamir solo fue una sorpresa para él mismo. Cuando los [Glossary('Anda','podgloss.anda')] lanzaron su asalto total contra la Corte de la Tortuga Negra y buscaron aliados, Tamir amenazó a la hija de un embajador $pod_kueijin$ malayo; la mujer lo despedazó rápidamente allí mismo en el momento en que él tocó un solo pelo de la cabeza de su hija."
 POD_persistentpodlore.desc.793541: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial de $pod_wod$.\n\nUno de los pocos Ancestros de la Corte de la Tortuga Negra fue objeto de burlas a sus espaldas; ningún cortesano de las Cortes de la Estepa puede negar el rencor que carga Madava. Una de las almas extremadamente desafortunadas en entrar en el Infierno de las Cadenas de Púas, no por morir en la Estepa Oriental, Madava era un escita, nacido como uno de los muchos hijos del rey Ateas de Escitia. Pero tuvo la profunda desgracia de ser príncipe cuando su padre perdió numerosas guerras contra el rey Filipo II de Macedonia, el padre de Alejandro Magno.\n\nLas pérdidas de su padre contra Filipo fueron lo suficientemente horribles como para destruir su reino, pero el Primer Explorador se fijó en Madava y lo llevó a través de la extensión de tierras que conquistó el hijo de su rival, burlándose y quebrándolo con mofas de que tal vez, tal vez, podría haber sido él. Su último recuerdo antes de su condena al Infierno de las Cadenas de Púas fue ver a los griegos marchar hacia el valle del Indo.\n\nMadava fue un trofeo de Dohkor-Khan durante un tiempo, pero las primeras guerras contra el [Glossary('Rey Yama','podgloss.yamaking')] lo liberaron. Fue integrado en los Jinetes de la Llanura de Ceniza como una concesión, y encontró genuinamente un lugar en ellos como general.\nHa llevado a cabo grandes campañas contra las Cortes de la Bestia y los [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. Pero las inquietantes experiencias de su prolongada muerte le atormentan. Es lento para animarse, está atormentado y a veces le cuesta moverse.\n\nSus sentimientos de inferioridad ante una comparación imposible le persiguen. Los [Glossary('Anda','podgloss.anda')] cabalgan, y puede que tenga una oportunidad de demostrar su valía. O al menos eso es lo que reza.\n\nDestino futuro\n\nAl principio de la campaña de los [Glossary('Anda','podgloss.anda')], Madava desapareció sin previo aviso. Se desconoce qué fue de él. Pero la noche antes de ser enviado a luchar contra los [Glossary('Anda','podgloss.anda')], sus ayudantes jurarían haber oído el toque de un tambor antiguo."
 POD_persistentpodlore.desc.793542: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial de $pod_wod$.\n\nSi bien la opinión de las Cortes sobre la mortalidad siempre ha sido imprecisa debido a las estructuras familiares que emulan, incluso ellas suelen evitar que sus Ancestros sean demasiado flagrantes al dejar que los mortales sepan demasiado.\nDe todos los Ancestros de la Corte de la Tortuga Negra, Tatahaui es la más laxa en esto, tomando flagrantemente amantes mortales por toda la estepa y dejando que sus propios hijos salgan y funden tribus, tanto que su método típico de cortejo es ahora una causa frecuente de la fundación de una tribu, independientemente de su presencia real.\n\nSu vida mortal fue olvidada en gran medida, pero sabe que fue una de las Donghu antes de que fueran conquistadas por los Xiongnu. Quería ser madre, pero las circunstancias de la mortalidad la dejaron perpetuamente estéril, muriendo sin realizarse tras un invierno especialmente duro.\nPero cuando aprendió como pecadora que si escapaba podría llegar a tener Dhampyr, el diablo que la encarcelaba no tuvo ninguna oportunidad.\n\nFue una de las primeras miembros de la Corte de la Tortuga Negra y fue la madre de sus Dhampyr originales. Y desde aquellos días, ha hecho lo que siempre ha hecho: regocijarse en la formación de un hijo y deleitarse en su crianza, antes de retirarse y observar cómo florece su linaje, para volver a hacerlo todo de nuevo.\nHa hecho esto durante siglos, e incluso mientras los [Glossary('Anda','podgloss.anda')] presionan sobre las Cortes, se niega a cambiar.\n\nDestino futuro\n\nA pesar de las capas de Dhampyr, no fueron suficientes para detener a los [Glossary('Anda','podgloss.anda')]. Mientras huía, quedó atrapada en un río por un [Glossary('Anda','podgloss.anda')] que se hundía principalmente en la tierra, y se vio indefensa mientras se pudría bajo el sol, con su cuerpo en rápida descomposición mezclándose con lo que antaño fue su ritual de cortejo central."
 POD_persistentpodlore.desc.793543: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAunque tiene muchos enemigos, nadie ha logrado derrotar al Campeón del Cielo. Sin embargo, a su lado desde el principio ha estado Batbold, el Segundo Hijo de Tengri, uno de los guerreros más temidos de la Corte de la Tortuga Negra.\nUno de los muchos pecadores en el Infierno de las Cadenas de Púas, Batbold era temido incluso como un hombre muerto, ya que podía superar fácilmente incluso a las Tribus favorecidas de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], y podía recibir golpe tras golpe sin pronunciar palabra. Batbold era excelente usando su mutismo en su beneficio, siendo una fuerza terrible de carnicería. Y cuando finalmente se abrió paso a base de cortes a través de los Infiernos, regresó rápidamente a su Tierra Natal y encontró un gran amigo en Achitbaatar.\n\nAunque Batbold nunca dejó de ser un guerrero, era un hombre sorprendentemente astuto y se convirtió en un adherente profundamente purista del Camino del Loto Octogonal mediante el espiritualismo y la meditación. Pero cuando no está meditando, toda la Corte teme la fuerza silenciosa que Achitbaatar puede convocar. Y ahora, las meditaciones de Batbold se ven interrumpidas por el ruidoso [Glossary('Anda','podgloss.anda')], así que él se posiciona según los deseos de su amigo.\n\nDestino futuro\n\nLa confianza de Batbold en su amigo fue su perdición, ya que sus insensatas exigencias de vigilar los nidos de dragón provocaron que el [Glossary('Anda','podgloss.anda')] atrapara a Batbold aislado y vulnerable, encontrando su fin brutalmente ante el avance del [Glossary('Anda','podgloss.anda')]."
 POD_persistentpodlore.desc.793544: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nUno de los Ancestros más temidos de la Corte de la Tortuga Negra ante las fuerzas de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], Elbegsaikhan es un antiguo guerrero en los Hijos de Tengri y, a pesar de su reputación más tradicional, es un ser poco ortodoxo.\n\nSiempre un hombre apuesto, Elbegsaikhan siempre había usado el encanto y su apariencia en su beneficio, seduciendo a su carcelero para escapar del Infierno de las Cadenas de Púas y luego atrayendo al [akuma|E] de los [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] a su perdición; la Flor de Hueso ganó rápidamente reputación por ser una figura verdaderamente aterradora que progresó velozmente en el [Glossary('Dharma','podgloss.dharma')].\n\nEn este tiempo de agitación, sin embargo, el Ancestro se encuentra ahora en los umbrales de la Iluminación, y sus tácticas habituales no funcionan bien contra los [Glossary('Anda','podgloss.anda')] debido a la falta de una libido Cainita en las formas que le son familiares. Y con su creciente desapego por el mundo, cada vez encuentra menos motivos de qué preocuparse. Los [Glossary('Hundred Clouds','podgloss.hundredclouds')] están tan cerca, y con la salvación al alcance, el destino del mundo es algo insignificante.\n\nDestino futuro\n\nMientras su [Glossary('Wu','podgloss.wu')] se reagrupaba en el frente, Elbegsaikhan se retiró a su propio nido de dragón, supuestamente para vigilarlo, pero en realidad para centrarse en su [Glossary('Dharma','podgloss.dharma')].\nNumerosos [akuma|E] desaparecieron, y cuando el [Glossary('Anda','podgloss.anda')] finalmente localizó su refugio, todo lo que encontraron fueron los cadáveres destrozados de los seguidores de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] y un conjunto de ropa vacía."
 POD_persistentpodlore.desc.793545: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nLos Dhampyrs sancionados de la Corte de la Tortuga Negra muy rara vez tienen vidas separadas de la Corte. Muchos son entrenados, preparados y moldeados para la guerra contra el siempre presente [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. Y el brutal instructor de los Hijos de Tengri es el encargado principal de supervisar tales ejércitos.\n\nLa vida mortal de Khünbish fue como la de muchos hombres en la antigua estepa, la de un pastor que vivió una vida pastoral sin incidentes antes de su fallecimiento y su condena a los Infiernos.\nFue entonces cuando aprendió que la brutalidad de su padre como cazador era la razón por la que fue condenado, y se dio cuenta de que los hijos son quienes pagan los pecados de sus padres. Cuando escapó y vio a otros demonios, supo entonces qué era lo que debía hacer.\n\nCada Dhampyr que entrena paga los pecados de sus padres, librando guerras y muriendo en su nombre. Entrenó a los grandes ejércitos que lideraban los Hijos de Tengri y forjó una poderosa fuerza de combate en aquellos tiempos de Leyendas. Pero ahora, está cayendo en viejos patrones, con más abusos que entrenamiento, especialmente mientras los Dhampyrs protestan por estar fuera de posición y la guerra contra los [Glossary('Anda','podgloss.anda')] parece cada vez más incierta...\n\nDestino futuro\n\nA pesar de sus preparativos, Khünbish nunca vio a los [Glossary('Anda','podgloss.anda')]. Un escenario de entrenamiento particularmente brutal provocó que sus soldados se le echaran encima en grupo, desgarrándole las extremidades, matándolo de hambre, atándolo con una soga a un caballo y lanzándolo hacia el amanecer. No se le volvió a ver."
 POD_persistentpodlore.desc.793546: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEl más joven de los Hijos de Tengri, Sansar es quien, sin embargo, es considerado con mucha frecuencia como el cerebro detrás de su orden. Un mortal que cuidaba cabras en vida y, más tarde, un pecador del Infierno de las Cadenas de Púas; el escape de Sansar en el vientre de un animal demoníaco durante el primer gran asalto al Infierno por parte de la Corte de la Tortuga Negra y su evidente habilidad como pastor lo convirtieron en la pieza final perfecta para completar la dirección de los Hijos de Tengri.\n\nA pesar de que su temperamento parecía fuera de lugar entre sus [Glossary('Wu','podgloss.wu')], Sansar era increíblemente hábil cuidando los rebaños de la Corte de la Tortuga Negra y, más tarde, su principal Anciano agrícola. Convirtiéndose rápidamente en una figura central de la Secta de las Diez Estaciones, Sansar viajó mucho más y frecuentó la Corte del Emperador Amarillo y la Corte del Tigre Blanco para entrenar a nuevos estudiantes antes de regresar a sus pastos. Pero tales especializaciones lo mantienen desconectado de la crisis actual.\nA medida que los [Glossary('Anda','podgloss.anda')] desbaratan sus proyectos, se siente cada vez más desorientado e inquieto por el daño causado a sus obras. Ve amenazas en cada esquina, y el caos de la era podría quebrarlo.\n\nDestino futuro\n\nSansar se destrozaría mentalmente bajo el caos de los [Glossary('Anda','podgloss.anda')], la muerte de su [Glossary('Wu','podgloss.wu')] y al ser abandonado por un amigo, y acabaría desapareciendo aullando en la noche.\nMás tarde, las Cortes sucesoras alineadas con el Quincuncio susurrarían sobre el «Ancestro Feral», sospechando que Sansar cayó de su [Glossary('Dharma','podgloss.dharma')] de forma tan estrepitosa que se convirtió en un Chi-Meh sin mente."
 POD_persistentpodlore.desc.793547: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEntre los [Glossary('Wus','podgloss.wu')] más jóvenes que están ganando prominencia en la Corte de la Tortuga Negra, la líder de los Dragones de Papel es, con diferencia, la más enigmática de su número. Al no provenir de ninguno de los grandes Infiernos, Khorkoi fue hallada en el Bosque de los Goblins, un paisaje infernal de telarañas y árboles.\nSu forma espiritual quedó tan eviscerada, masticada y triturada que salió siendo más cicatriz que demonio. Pero el Halcón Kumo, como se le ha empezado a llamar, es una líder en potencia.\n\nKhorkoi se ha especializado en limpiar las Líneas de Dragón de los Kumo que las infestan. Mientras que la mayoría de los Dragones de Papel son eruditos, su líder es única en la forma en que aplica sus conocimientos. Marchando al infierno armada con oraciones, reliquias y tesoros, es un torbellino punzante de muerte, despejando los caminos de tránsito hacia lo más profundo, con algún fin invisible.\n\nFrustrada por el Ancestro y el Antiguo [Glossary('Wus','podgloss.wu')] de la Corte, se ha alineado, junto con las Serpientes del Río de Sangre y los Excelentes Susurros del Bosque, con las Hojas de Plata y el viejo señor de la guerra. Despeja Líneas de Dragón de Kumo hasta el propio Infierno de las Cadenas de Púas. Con qué fin... solo el tiempo lo dirá.\n\nDestino futuro\n\nLa erudición de los Dragones de Papel y la ira de Khorkoi despejaron muchas Líneas de Dragón, que se convirtieron en puntos de lanzamiento críticos para las puntas de lanza que permitieron al $pod_kueijin$ sumergirse profundamente en las líneas del [Glossary('Anda','podgloss.anda')] y, más tarde, en el Señorío de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')].\nLa propia Khorkoi no se unió al asalto, ya que se dedicó a cubrir las líneas para asegurar que no hubiera emboscadas. Estuvo presente en la fundación del Quincuncio y se convertiría en el Ancestro de Hailar, supervisando las Líneas de Dragón entre las Cortes China y de la Estepa."
 POD_persistentpodlore.desc.793548: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nAunque el término «jovencito» siempre le irrita, el líder de los Excelentes Susurros del Bosque no puede hacer mucho por el momento para detener tales calumnias. Él hace lo que nadie más quiere. Es el principal vínculo que la Corte de la Tortuga Negra tiene con algunos de sus enemigos más antiguos.\n\nChono fue un Parentela Siberakh en vida, y uno devoto y bueno. Como único esposo de una Jefa Siberakh, engendró muchos hijos, tres de los cuales fueron bendecidos con el Primer Cambio. Su esposa era amable y gentil, noble y heroica. Él la adoraba y, aunque lloró su muerte en batalla, cuidó de su familia hasta que murió de viejo en su invierno número 78.\n\nPero el Infierno tiene poco amor por la gente de la Madre Esmeralda, así que el Infierno de las Verdades Amargas le esperaba. Pero incluso allí, su devoción a la Madre Esmeralda fue una luz guía, y encontró su camino de vuelta a su diosa.\nAhora, sin embargo, es un demonio que camina sobre terreno peligroso. Sabe que el Gran Destructor lo ha favorecido, pero eso no lo definirá. Tomó medidas audaces al reconectar con sus hijos y nietos, y otros cambiantes.\nEllos ven que alguna vez fue de su sangre, comprenden su situación y están dispuestos a escucharlo. Ha construido su [Glossary('Wu','podgloss.wu')] de espíritus afines, aquellos que quieren reconciliar a los Campeones Caídos del [Glossary('Augusto Personaje de Jade','podgloss.augustpersonageofjade')] y a los Guerreros de la Madre Esmeralda. Todos ellos necesitarán trabajar juntos para derrotar la gran amenaza del [Glossary('Anda','podgloss.anda')], un Azote que es una amenaza para todos ellos.\n\nDestino Futuro\n\nEl [Glossary('Anda','podgloss.anda')], tan experto en aniquilar $pod_kueijin$, fue incapaz de derrotar a Chono cuando las Líneas de Dragón se abrieron y los aliados Fera de los Susurros del Bosque se estrellaron contra ellos como un martillo. La familia Siberakh de Chono fue guiada al Infierno de las Cadenas de Púas, donde ayudaron en la desaparición de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] mientras Chono mantenía el lugar abierto.\n\nCuando presenció el nacimiento de las nuevas Cortes de la Estepa, aceptó con gracia el papel de Ancestro en los confines más fríos de Siberia, como enlace entre las Cortes de los Muertos y las Cortes de las Bestias."
 POD_persistentpodlore.desc.793549: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nA un juego peligroso se está jugando bajo las narices del [Glossary('Anda','podgloss.anda')] y la Corte de la Tortuga Negra. Uno en el que una nueva y audaz demonio camina por una línea muy fina, decidida a demostrar quién es.\n\nKhongortsetseg tiene todavía menos de un siglo de edad como uno de los $pod_kueijin$, pero ya ha empezado a dar que hablar con su [Glossary('Wu','podgloss.wu')] de las Serpientes del Río de Sangre. Tras morir por la exposición en el desierto de Gobi para acabar en el Infierno de ser Desollada Viva por el orgullo de su padre, Khongortsetseg ha aprendido a hacer mucho con muy poco. Encontrada como una pecadora en las arenas de afeitar que se transformó en la apariencia de un Gusano de la Muerte, causó sensación en la política de la Corte de la Tortuga Negra al establecer Pantallas Escarlatas en los terrenos de caza del [Glossary('Anda','podgloss.anda')], y atacando a los soldados del [Glossary('Anda','podgloss.anda')] bajo tierra usando su propio Shintai de demonio para excavar y encontrarlos en su momento más vulnerable. Pero cuando sus tácticas poco ortodoxas fueron recibidas con escarnio, pasó su información a las Hojas de Plata, decidida a no dejar que su red de espionaje se desperdiciara.\n\nSi es descubierta, será un escándalo para la Corte de la Tortuga Negra o la destrucción para el [Glossary('Anda','podgloss.anda')]. Pero ella sabe cómo esconderse. Y si [Glossary('Tou Mu','podgloss.toumu')] no pudo quebrarla, ellos tampoco lo harán.\n\nDestino Futuro\n\nLa línea de Khongortsetseg entre la mentira, la valentía y la planificación meticulosa dio sus frutos. Cuando la Corte de la Tortuga Negra cayó y se planeó el contraataque, ella se presentó como objetivo para numerosos grupos de batalla del [Glossary('Anda','podgloss.anda')] y la temida Vanguardia del Viento Negro, jugando un letal juego del gato y el ratón con ellos.\nTuvo éxito y los cazó de vuelta hacia Siberia. Cuando se formó el Quincuncio, se convirtió con orgullo en la Ancestra de donde sus espías se encontraban a lo largo del río Orkhon, y más tarde se convirtió en la Ancestra de Darkhan en las noches actuales."
 POD_persistentpodlore.desc.793550: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nUn Azote y una figura abiertamente aborrecida en la Corte del Emperador Amarillo, Aisūltan es quizás el miembro más vengativo de los Vientos Áridos, incluso más celoso que su Hermano de Sangre Tarugha.\nNacido entre los Kök-Türks y soldado en sus ejércitos cuando invadieron China, Aisūltan nunca perdonó el «desaire» que supuso su muerte por una flecha china durante las invasiones iniciales. Nunca superó el no poder ver todo el poder de los Göktürk orientales, así que hizo de su misión en la vida eterna asegurarse de que las sociedades de los muertos nunca olvidaran lo grandes que eran. En cada escaramuza entre la Corte de la Tortuga Negra y la Corte del Emperador Amarillo, Aisūltan está siempre al frente, cortando de raíz la Iluminación de los plácidos y decadentes Ancestros de China.\n\nIncluso ahora, mientras el [Glossary('Anda','podgloss.anda')] viene del norte, él mira al sur, castigando a aquellos demasiado complacientes incluso cuando las Cortes arden.\n\nDestino Futuro\n\nA la insistencia de Aisūltan por el conflicto le aseguró encontrar su segunda muerte tal como la primera. En un enfrentamiento en las fronteras de las Cortes, Aisūltan encontró su destino ante la hoja de la estrella naciente Ma Hai-Lan, la primera victoria verdaderamente grande en su carrera."
 POD_persistentpodlore.desc.793551: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nNacido entre los kirguís, Ulugbek fue hijo de una época de grandes cambios. Con su padre siendo un general menor del Kanato Kirguís, Ulugbek se unió a sus ejércitos como un jinete mortal verdaderamente aterrador, usando su tamaño colosal para infundir miedo. Pero tal fuerza tuvo un coste, ya que murió de un ataque al corazón debido a su tamaño en mitad de la batalla.\n\nEn el Infierno de las Cadenas con Púas, esto le ayudó una vez más, ya que una de las cadenas que lo izaba se rompió por el peso del titán. Y al ser llevado a los Vientos Áridos, se convirtió fácilmente en su puño. Al ser agrandado como demonio, solo los caballos Bakemono podían soportar su peso. Se convirtió en una amenaza verdaderamente horrible para cualquier pobre [akuma|E] enviado contra él, y en el conflicto de los Vientos Áridos con la Corte del Emperador Amarillo, para cualquier alma desafortunada enviada a oponerse a él.\n\nPero ahora está preocupado. Los últimos restos del Kanato Kirguís fueron absorbidos por los mongoles, y ahora sus contrapartes del [Glossary('Anda','podgloss.anda')] están marchando. Y a pesar de su fuerza, teme que él sea el siguiente.\n\nDestino Futuro\n\nUlugbek fue el único Viento Árido en sobrevivir al [Glossary('Anda','podgloss.anda')], ya que comprendió rápidamente la amenaza que representaban por lo que les ocurrió a sus parientes mortales. Desertó silenciosamente hacia los Guerreros de la Llanura de Hebei y las Hojas de Plata, y luchó en sus asaltos.\nFue uno de los más antiguos presentes para las Cortes de la Estepa durante la formación del Quincuncio, y se retiró a un papel de Ancestro en la Estepa."
 POD_persistentpodlore.desc.793552: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nA una reliquia del Imperio Xiongnu, y aparentemente el menos temido de los Vientos Áridos, numerosos asesinatos en toda la Corte del Emperador Amarillo tienen el soplo de los vientos vacíos entre ellos.\nUn rostro amable que siempre conduce a un ancestro muerto. O eso afirman los detractores de Ankang.\n\nAnkang es fácilmente el miembro más sutil de los [Glossary('Wus','podgloss.wu')] Ancestros, la clara y más consumada tejedora de Intriga en la órbita de la Corte de la Tortuga Negra. Mintiendo con tanta facilidad como respira, prestando poca atención a los asuntos de [Glossary('Dharma','podgloss.dharma')] tras aniquilar a los malvados, y considerando que la monogamia es un concepto ridículo, la pecadora de los páramos desolados del Infierno de ser Desollada Viva parece disfrutar siendo todo y nada al mismo tiempo.\n\nMuchos enemigos de la Corte de la Tortuga Negra han sido silenciados por sus redes, y mientras el [Glossary('Anda','podgloss.anda')] se acerca a ellos, ella parece estar aún más concentrada en sus detractores de la Corte del Emperador Amarillo.\n\nDestino Futuro\n\nCon la desaparición de Wang Hongben, un buen número de Ancestros de la Corte del Emperador Amarillo sospecharon que Ankang era la culpable del asesinato.\nPor primera vez en su vida, negó que el asesinato fuera obra suya, pero habiendo mentido tanto, nadie le creyó. Su muerte presa del pánico fue sentenciada por el gran juez Qiang Ru, imponiéndole una Muerte Definitiva por el crimen, incluso si todavía cabía la duda de si había sido ella quien lo cometió."
 POD_persistentpodlore.desc.793553: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nSer expulsado de un [Glossary('Wu','podgloss.wu')] es algo raro y profundamente humillante. Muy pocas veces el miembro expulsado perdona el desaire y, lo que es peor, algunos pueden guardar rencor.\n\nSaekae hizo algo más que guardar rencor.\n\nSaekae fue una vez una Guerrera de la Llanura de Hebei en sus inicios, hasta que una disputa con Mapo por su decoro provocó que matara a uno de los suyos, un Dhampyr, lo que la llevó a ser expulsada del [Glossary('Wu','podgloss.wu')] con un divorcio igualmente desastroso.\nSu disputa con Mapo y luego con Maedaeri escaló aún más, ya que entonces se unió a los Vientos Áridos [Glossary('Wu','podgloss.wu')], como su Azote dedicado contra los Guerreros de la Llanura de Hebei.\n\nAl ser los Guerreros un amortiguador neutral, la Corte del Emperador Amarillo no se molestaba con sus ataques sostenidos, y la Corte de la Tortuga Negra no la detenía. Debido a su experiencia entre esas Cortes, es experta en explotarlas, pero su impulsividad no le favorece.\n\nIncluso ahora, con problemas mucho mayores, su disputa contra su ex sigue viva mientras luchan mientras el [Glossary('Anda','podgloss.anda')] se aproxima.\n\nDestino futuro\n\nLa desaparición de Saekae fue impactante, ya que un plan para olvidar a Mapo la llevó a tener un nuevo amante sin nombre. Pero entonces desapareció y no se le volvió a ver. Al menos, eso es lo que se dice.\nMapo puede jurar que tras la muerte de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], uno de los Exploradores tiene una bestia infernal con unos ojos idénticos a los de Saekae. A pesar del mal recelo, espera con ansias que no sea ella. Pero una parte de él está aterrorizada de que lo peor ya haya sucedido."
 POD_persistentpodlore.desc.793554: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nConocida por pocos pero amada por su [Glossary('Wu','podgloss.wu')], la Llama Curativa es considerada fácilmente el miembro más importante de su [Glossary('Wu','podgloss.wu')] internamente. Al menos entre ellos.\n\nMientras la Tormenta de Fuego rastrea el desierto de Gobi en busca de reliquias y recursos, la presencia del [Glossary('Anda','podgloss.anda')] y los peligros naturales del desierto hacen que tales expediciones sean un desafío incluso para un Ancestro [Glossary('Wu','podgloss.wu')]. Por eso, una alquimista que comercia con pociones de esencia pura es increíblemente valiosa.\n\nMiray siempre fue una mujer sabia, incluso cuando era mortal en la estepa. No nacida en ningún imperio, no era más que otra turca que vivió y murió en los campos abiertos, y su vida como doctora le granjeó la ira de Rangda, condenándola al Infierno de las Larvas Cavadoras. Pero sabiendo cómo curarse a sí misma, pudo liberarse y escapar.\n\nSu comprensión de la medicina la convirtió en una elección fácil para los Centípedos Sabios, y así dedicó su alquimia a esos fines, y con amistades se unió a la Tormenta de Fuego [Glossary('Wu','podgloss.wu')] debido a lo necesarias que eran sus artes. Sus pociones eran codiciadas en toda la Corte de la Tortuga Negra, y con Xiang Li actuando como mercader, Miray se contenta con su soledad y su medicina.\nTanto es así que apenas ha prestado atención al [Glossary('Anda','podgloss.anda')] que asalta el desierto que tan a menudo exploran.\n\nDestino futuro\n\nMiray siempre fue una pieza central de su [Glossary('Wu','podgloss.wu')]. Los asesinos del [Glossary('Anda','podgloss.anda')] se enteraron de esto y la atacaron a ella primero para romperlos. Y con su muerte, la Corte de la Tortuga Negra perdió a su mejor doctora."
 POD_persistentpodlore.desc.793555: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nExperta en las Líneas de Dragón del desierto de Gobi, las vastas extensiones del desierto albergan muchos manantiales ocultos de poder. Y más que incluso las Cortes de la Bestia, Chagur conoce esas arenas mejor que nadie.\n\nA una Kerait que una vez los exploró antes del ascenso al poder de los mongoles, Chagur puede que no haya sido una jinete, pero conocía bien esos lugares. Pero los desiertos siempre son peligrosos incluso para los viajeros más experimentados, y el desierto se la cobró.\n\nLa naturaleza más estructurada del Infierno de ser Desollado Vivo era notablemente más predecible, y el escape de Chagur fue mucho más fácil que el del desierto de Gobi. Y en sus experiencias como $pod_kueijin$ en la Tormenta de Fuego, ha ascendido como maestra del Cuerpo Divino de Fuego, utilizando las Artes del Alma de los Muertos para controlar mejor el flujo de esencia a través del desierto. Aunque choca constantemente con otros Ancestros por «sus» dominios, nadie puede negar que es una maestra en lo que hace.\nPero a medida que el [Glossary('Anda','podgloss.anda')] tiene cada vez más presencia en el desierto de Gobi, el conflicto se vuelve inevitable.\n\nDestino futuro\n\nCon la muerte de Miray, Chagur fue entonces blanco del [Glossary('Anda','podgloss.anda')] durante una caza prolongada que la agotó, persiguiéndola finalmente hasta el amanecer y dejándola a merced del sol mientras el [Glossary('Anda','podgloss.anda')] se hundía de nuevo bajo la tierra."
 POD_persistentpodlore.desc.793556: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nA medida que el desierto de Gobi cae bajo la influencia del [Glossary('Anda','podgloss.anda')], el [Glossary('Wu','podgloss.wu')] que ha dedicado su no-vida a explorar y recolectar sus muchos tesoros debe estar siempre vigilante, siempre atento. Y como tal, los servicios del Escorpión de Arena son más relevantes ahora que nunca.\n\nAntiguo cazador, antes de su muerte y condena al [Glossary('Kakuri','podgloss.kakuri')], Jagambu fue guiado de vuelta a su hogar en la estepa por la sensación de calor de las ricas Líneas de Dragón del desierto de Gobi. Su llamado lo hizo caer fácilmente en la órbita de la Tormenta de Fuego, donde puso sus habilidades como cazador y su nuevo Shintai Diabólico como guardián de los límites de sus operaciones, acechando sus fronteras mientras el resto de su [Glossary('Wu','podgloss.wu')] realiza sus propias tareas a través de sus arenas.\n\nAunque no lo admitiría (y de hecho ha llegado a extremos para ocultarlo), los [Glossary('Anda','podgloss.anda')] eran demasiados para que él pudiera manejarlos. Sus antiguos límites están dañados y las venas espirituales están cambiando.\nÉl los persigue con más tenacidad, buscando un medio para reconstruir la obra de su preciosa no-vida.\n\nDestino futuro\n\nSiendo el último de su [Glossary('Wu','podgloss.wu')] en caer, Jagambu pudo esconderse mejor que el resto de su [Glossary('Wu','podgloss.wu')]. Pero finalmente, con sus aliados muertos o dispersos, se quedó solo y, por tanto, fue una presa fácil para los maestros Vástagos de la Estepa."
 POD_persistentpodlore.desc.793557: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEl especialista en buscar reliquias en el desierto, Taibuka es quizás el $pod_kueijin$ más paciente de todas las Cortes Augustas. Tendría que serlo para su labor de buscar reliquias y artefactos en el desierto de Gobi, rastreando activamente las arenas pulgada a pulgada en la oscuridad de la noche, luchando contra las amenazas sobrenaturales que le molestan antes de volver a su búsqueda.\n\nAunque en su vida solo fue otro pastor, una estancia en el Infierno de los Pecadores del Revés le dio algo de perspectiva. ¿Por qué apresurarse? Ahora tiene todo el tiempo del mundo. Y esa mentalidad lo convirtió en un aliado ideal para la Tormenta de Fuego [Glossary('Wu','podgloss.wu')], y después en un miembro central.\nPuede que sea lento para reaccionar ante los cambios, pero es meticuloso hasta un grado impresionante, y aunque tiene debilidad por las delicias de la carne, esto no le distrae de su trabajo.\n\nA la gran mayoría de las reliquias de la Tormenta de Fuego fueron encontradas por él, e incluso ahora, sigue encontrando cosas mientras rastrea los desiertos una y otra vez mientras la tormenta [Glossary('Anda','podgloss.anda')] los atraviesa.\n\nDestino futuro\n\nTaibuka quedó profundamente horrorizado por la muerte de Miray y huyó lo más profundo posible en el desierto de Gobi para esperar a que pasara la [Glossary('Anda','podgloss.anda')]. Se le dio por muerto, hasta que fue encontrado 200 años después de su desaparición tras la derrota de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')].\nY en la modernidad, sigue rastreando el desierto de Gobi en busca de tesoros."
 POD_persistentpodlore.desc.793558: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nPrincipal entre los infames y violentos Jinetes de la Pezuña Negra, el que muchos [akuma|E] encuentran es al temido Isiha. El juez, jurado y verdugo de la Corte de la Tortuga Negra, el Bunraku ha servido con devoción en tal función desde su muerte y emancipación de Lanka.\nSiempre un soldado y tosco fuera de su labor, su atención al detalle y su búsqueda implacable, su audacia y su convicción ciega lo convierten en un monstruo irracional para muchas de las amenazas que enfrenta. Pero, notablemente, con tal furia, a veces es muy fácil de provocar, lo que le ha hecho infame por ser una herramienta sencilla para eliminar rivales.\n\nHa recibido numerosas censuras de la Corte del Emperador Amarillo, pero francamente no le importa lo que los blandos ancestros del centro tengan que decir sobre él. Es un asesino. Lo sabe. Y le parece bien. Y si alguien lo ha olvidado, se lo recordará.\n\nY parece que los [Glossary('Anda','podgloss.anda')] necesitan una buena charla.\n\nDestino futuro\n\nAl principio de la embestida de los [Glossary('Anda','podgloss.anda')] contra la Corte de la Tortuga Negra, dos Jueces se encontrarían.\n\nChinkai no recordaría a Isiha en menos de un mes tras haberlo matado."
 POD_persistentpodlore.desc.793559: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nSi bien los Jinetes de la Pezuña Negra tienen reputación de ser brutos, ser fuerte por sí solo solo te lleva hasta cierto punto. Las fuerzas de los [Glossary('Reyes Yama','podgloss.yamaking')] son expertas en agazaparse, esconderse, velar activamente su presencia y atrincherarse. Desenterrarlos requiere no solo a alguien fuerte, sino también capaz de superarlos en maniobras y derribar sus fortalezas. Y para el puño mortal de la Corte de la Tortuga Negra, Dumu es su guía, su estratega, general y guía militar.\n\nTan testarudo y colérico como sus compatriotas, su mente, sin embargo, es aguda en los campos de la guerra. Aunque carece de teología, es un táctico sólido e incluso ha estudiado los textos de Sun Li con respecto a sus continuas escaramuzas de la Guerra del Crepúsculo.\nEspecialista contra los [akuma|E], posee una historia de éxitos militares contra ellos. Y a diferencia de casi todos los demás en la Corte de la Tortuga Negra, le entusiasma que los [Glossary('Anda','podgloss.anda')] se hayan convertido en una amenaza relevante.\n\nDurante mucho tiempo ha deseado un nuevo desafío, y los [Glossary('Anda','podgloss.anda')] seguramente lo proporcionarán.\n\nDestino futuro\n\nDumu de hecho consiguió su deseo de tener iguales estratégicos, e incluso consiguió a alguien superior. Sus tácticas habituales contra [akuma|E] no tuvieron en cuenta el Protean de los [Glossary('Anda','podgloss.anda')], y cuando lideró una fuerza contra ellos, destruyó la hueste de guerra de los Jinetes de la Pezuña Negra en una emboscada que acabó con su vida y con la mayor parte de su [Glossary('Wu','podgloss.wu')]."
 POD_persistentpodlore.desc.793560: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nA pesar de la reputación de la Corte de la Tortuga Negra, no muchos entre ellos practican todavía activamente la arquería a caballo como medio principal de batalla. Sencillamente, su Magia del Diablo y del Alma, el Shintai y sus cuerpos divinos hacen que tales mecanismos de guerra sean bastante complicados, ya que los caballos no pueden seguir el ritmo. Por tanto, la mayoría de las batallas entre los $pod_kueijin$ se asemejan más a duelos que a incursiones reales.\n\nLa mayor parte del tiempo, al menos.\n\nMaestra del Viento del Diablo, Giahun ha aplicado las artes de la estepa a la existencia de los $pod_kueijin$. Golpeando como un borrón y desapareciendo, es la principal maestra de tales tácticas en su Corte. Como los otros Jinetes de la Pezuña Negra, es una guerrera, pura y sencilla. Aparece, mata a su objetivo de un disparo y huye hacia el horizonte antes de que se den cuenta de lo que ha pasado.\n\nA las órdenes de su marido Dumu, es un terror en el campo de batalla, imperturbable ante cualquier peligro y con un celo similar, con todo el orgullo que uno imaginaría que tendría tal guerrera. Y al igual que Dumu, le entusiasma ver qué pueden lanzarle los [Glossary('Anda','podgloss.anda')]. Nunca ha estado más preparada.\n\nDestino futuro\n\nGiahun, al igual que Dumu, caería en una trampa de los [Glossary('Anda','podgloss.anda')] debido a la incapacidad de Dumu para predecir el Protean. Murió junto a su marido, aniquilada por la furia de los [Glossary('Anda','podgloss.anda')]."
 POD_persistentpodlore.desc.793561: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nCon los [akuma|E] siendo tan inexhaustibles como son, la labor de las Cortes nunca termina. Entre sus propias manos, las de sus pantallas y otros medios de la Guerra del Crepúsculo, la batalla interminable siempre necesita más espadas y garras. Y con ese fin, los Dhampyr son uno de sus mayores activos. E incluso en un [Glossary('Wu','podgloss.wu')] de guerreros como los Jinetes de la Pezuña Negra, aunque ellos realizan la mayor parte de los combates, la presencia de un Dhampyr nunca viene mal.\nNo es que el embarazo haya detenido a Sogiaen antes.\n\nUna mujer de la estepa que encontró la muerte en el parto; el escape de Sogiaen del [UmbraGlossaryLocalized('yomi_wan','Inframundo')] no es algo que recuerde con claridad, pero la mayor parte de su pasado no está muy claro. Pero ahora, al menos, Sogiaen ha comprendido que debe compensar lo que perdió en vida.\n\nHabiendo engendrado a más de cien Dhampyr durante su tiempo como guerrera, abriéndose paso entre la multitud mientras estaba embarazada, y siendo susurrada como la amante de cada hombre en la Corte de la Tortuga Negra, ha sido, no obstante, la columna vertebral de las campañas militares de los Jinetes de la Pezuña Negra. Y ahora, especialmente cuando los [Glossary('Anda','podgloss.anda')] comienzan a resquebrajar sus dominios, sus fuerzas son más necesarias que nunca.\nAsí que se ha puesto manos a la obra, sentando las bases para que lleguen más Dhampyr contra el asalto de los [Glossary('Anda','podgloss.anda')].\n\nDestino futuro\n\nAl igual que Dumu y Giahun, Sogiaen encontraría su fin durante el fatídico asalto de Dumu, muriendo en el campo de batalla tras ser abatida. Los [Glossary('Anda','podgloss.anda')] sabían que ella era la fuente de la mayoría de sus Dhampyr, por lo que fue la primera de los Jinetes de la Pezuña Negra en caer."
 POD_persistentpodlore.desc.791120: "Este personaje es parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por eso, ha sido ampliado por los desarrolladores de PoD para aportar mayor profundidad al escenario.\n\nTarugha tiene el dudoso honor de ser el líder del [Glossary('Wu','podgloss.wu')] que domina actualmente en la decadente y en ruinas Corte de la Tortuga Negra. Un gran honor y responsabilidad, aunque el arrogante nómada solo reconoce lo primero.\nPara Tamugha y el Viento Yermo, el éxito proviene principalmente de su disposición a abrazar el cambio y de los diversos pueblos nómadas que recorrieron las estepas a lo largo de los siglos. Esta voluntad de adaptarse los ha impulsado a la vanguardia de la política de la Corte de la Tortuga Negra, mientras que los otros [Glossary('Wu','podgloss.wu')] ahora los ven como los más aptos para navegar por estos tiempos turbulentos y conflictivos.\nSin embargo, algunos temen que dar más poder a Tarugha solo traerá más problemas.\n\nLamentablemente, tienen razón.\n\nA pesar de ser un juez de carácter competente y un político hábil, Tarugha es un mal estratega y carece de una visión más allá de sus propias maquinaciones políticas. Al descartar por completo a los [Glossary('Anda','podgloss.anda')] como una amenaza potencial, ha mantenido su [Glossary('Wu','podgloss.wu')] firmemente orientado hacia las interminables y mezquinas escaramuzas con la Corte del Emperador Amarillo al sur, donde siente que podría obtener más gloria. En asuntos internos, Tarugha también carece de previsión. Su continuo conflicto con los Jinetes de la Pezuña Negra [Glossary('Wu','podgloss.wu')] solo ha causado más desconfianza y el debilitamiento de la Tortuga Negra. Con estos errores repetidos, no haría falta mucho para que todo lo que ha construido hasta ahora se derrumbe.\n\nDestino futuro\n\nLos espías de los [Glossary('Anda','podgloss.anda')] clasificarán a Tarugha como una amenaza baja e incluso como un factor desestabilizador potencialmente útil si se le deja con vida. Tendrán razón.\nTarugha se negará a redirigir su [Glossary('Wu','podgloss.wu')] contra ellos hasta que sea demasiado tarde, lo que resultará en que tenga que huir vergonzosamente hacia la Corte del Emperador Amarillo en busca de ayuda cuando Daidu caiga.\n\nDado que la propia Corte del Emperador Amarillo estaba en proceso de desintegración, su advertencia será ignorada y será ejecutado por sus transgresiones pasadas contra las cortes chinas."
 POD_persistentpodlore.desc.791121: "Este personaje forma parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nEl aparentemente severo y estricto Tan Banshi lidera a los Jinetes de la Pezuña Negra [Glossary('Wu','podgloss.wu')], considerados por algunos como la segunda facción más poderosa de la Corte de la Tortuga Negra. Muchos pensarían que el líder de un [Glossary('Wu','podgloss.wu')] tan tradicionalista sería él mismo un intransigente estricto pero, a decir verdad, Tan Banshi llegó a este papel por motivos políticos.\n\nAl ver pronto en su vida eterna que los innovadores Vientos Áridos carecían de una contraparte organizada, Banshi asumió este papel como una forma de ganarse rápidamente el respeto de Ancestros más desapegados de la política, pero tradicionalmente conservadores. Este estratagema funcionó bien, quizá incluso demasiado bien.\n\nBanshi se vio rodeado de personajes, incluso en su propio [Glossary('Wu','podgloss.wu')], que se movían en la línea entre las «Tradiciones» y el «fanatismo». Esto provocó que cada vez más jóvenes [Glossary('Wu','podgloss.wu')] se distanciaran de la Tortuga Negra y buscaran otras formas de prosperar fuera de las asfixiantes limitaciones y reglas defendidas por los secuaces de Banshi.\n\nSin embargo, el hombre no es ningún tonto y sabe que este camino solo puede conducir al debilitamiento de la Corte, especialmente a medida que el conflicto con los Vientos Áridos se vuelve cada vez más intenso. Ahora está sopesando la posibilidad de cambiar sutilmente su postura política para, con suerte, salvar la Corte de la Tortuga Negra. Por ahora, ha concluido que no merece la pena el coste de su capital político.\n\nDestino futuro\n\nBanshi será una de las víctimas del infame asalto [Glossary('Anda','podgloss.anda')] a la reunión de liderazgo de la Corte de la Tortuga Negra en 1261.\n\nIrónicamente, fue entonces cuando finalmente planeaba proponer su plan para un cambio de rumbo."
 POD_persistentpodlore.desc.791122: "Este personaje forma parte del $pod_wod$ pero solo tiene un trasfondo muy limitado. Por ello, los desarrolladores de PoD lo han ampliado para dar mayor profundidad al escenario.\n\nLa sombría Xiang Li es la líder informal de la Tormenta de Fuego [Glossary('Wu','podgloss.wu')], aunque a ella misma le disgusta que la llamen por ese título. Este honorífico se le otorgó por ser el miembro más visible de su facción en la corte. Mientras los demás recorren el desierto del Gobi en busca de reliquias y artefactos, ella gestiona el comercio entre su gente y la Corte de la Tortuga Negra.\n\nEste conocimiento de una zona traicionera y la posesión de valiosos artefactos le han otorgado mucho crédito político (no deseado), lo que lleva a algunos a pensar que la Tormenta de Fuego podría ser la fuerza estabilizadora que la Corte de la Tortuga Negra necesita para sobrevivir a la tormenta que se avecina. Si este es el caso, entonces esas voces se verán decepcionadas.\nXiang Li representa bien a su gente, y su gente no tiene tiempo para problemas políticos.\n\nSin embargo, no es ciega ante la tormenta que se aproxima y ha comenzado discretamente a establecer contactos con otras Cortes para, potencialmente, reubicar su [Glossary('Wu','podgloss.wu')] si la Tortuga Negra fuera invadida o se fracturara por sí sola. Lamentablemente, hasta ahora estos contactos han servido de poco. Muchas Cortes periféricas parecen haber caído ya bajo la influencia de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] o son demasiado débiles para ser un refugio potencial.\nAsí pues, exteriormente, Xiang Li sigue siendo la severa comerciante que representa a su [Glossary('Wu','podgloss.wu')] con su lengua afilada y su mirada aguda. Por dentro, sin embargo, está al borde del pánico al ver cómo el tiempo para los preparativos se acorta cada vez más.\n\nDestino futuro\n\nXiang Li desaparecerá cuando los [Glossary('Anda','podgloss.anda')] comiencen su asalto, dejando a su [Glossary('Wu','podgloss.wu')] como una presa fácil.\n\nLa verdad no se descubrirá hasta décadas después, cuando el victorioso Quincuncio purgue una Corte periférica que aún esté bajo la esclavitud de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] y encuentre un tesoro de artefactos y reliquias empapados en sangre."
 POD_persistentpodlore.desc.795401: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nAltın-Arığ era la joya de una tribu de kirguís del Yeniséi. Llegó a ser una Alyp-Kız, una doncella guerrera. Su rasgo más llamativo eran sus ojos de color dorado, un atributo que su pueblo veía como una bendición de la propia Umay Ana. Sin embargo, al llegar a la edad adulta, su vida pacífica se desmoronó. Todo empezó con una hambruna que acabó con todas las cosechas y el ganado. Entonces, los lobos y los leopardos de las nieves enloquecieron, destrozando sus yurtas sin motivo aparente.\n\nAltın-Arığ se negó a quedarse sentada mirando cómo moría su pueblo. Cabalgó hacia un sendero montañoso prohibido, muy lejos de su hogar. Fue allí donde comenzó su búsqueda del rumoreado Bengi su, el agua de la inmortalidad.\n\nCerca de la cima, dentro de una caverna llena de metales preciosos, encontró a un hombre demacrado con un solo ojo, cuyo cuerpo se reparaba y cambiaba de forma constantemente.\n\nEn el suelo, esparcida a su alrededor, había sangre espesa. Altın-Arığ creyó que era el Bengi su y, desesperada por salvar a su pueblo, lo bebió y se desmayó. Cuando la joven volvió a abrir los ojos, él se había ido y ella había cambiado.\n\nAl regresar con su tribu, utilizó sus nuevas habilidades para ocultar la carne enfermiza de los recién nacidos para que parecieran sanos, y usó su fuerza para repeler a los animales enloquecidos.\n\nPasaron las décadas mientras la amada hija vigilaba su hogar. La enfermedad y los animales frenéticos cesaron, pero llegó una nueva amenaza. Hombres y mujeres del Este sintieron al «Demonio» en la tribu y vinieron a purgarlo. Los guerreros del este masacraron a su tribu hasta que solo quedaron ella y un joven niño.\n\nElla lo llevó de vuelta a la montaña donde recibió el $pod_Embrace$ por primera vez, y vagó para reunir a otras personas de diferentes tribus. Cuando se formó una pequeña comunidad, Altın-Arığ ocultó el valle del mundo exterior. Durante 400 años, los protegió.\n\nEn el siglo VI, Altın-Arığ decidió que era hora de desatar la horda. Se acercó a un mortal herrero bajo la forma de un lobo dorado y lo guio para que liderara al pueblo del valle hacia la salida. Justo después de que salieran, el agotamiento alcanzó a Altın-Arığ. Enterrándose profundamente bajo la tierra, cayó en Letargo.\n\nDestino futuro: Altın-Arığ despertará siglos después e intentará reunir a sus cachorros para trabajar como una familia una vez más, sabiendo que solo serán fuertes si están juntos." 
 POD_persistentpodlore.desc.795402: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nIshbara no nació siendo un gran guerrero ni líder. Tercer hijo de un Beg menor, era considerado un guerrero débil y un hombre sombrío. Mientras su padre y sus hermanos entrenaban para perfeccionar sus habilidades de combate, él descubrió su talento en la administración. Cuando un invierno catastrófico azotó a su tribu, Ishbara se aseguró de que sobrevivieran mientras los demás morían congelados o por hambre. Racionando y acumulando recursos con precisión, mantuvo el orden. En medio de esta crisis, un Lobo Dorado fue testigo de cómo esta tribu solitaria sobrevivía mientras ninguna otra lo hacía. Al ver a este hombre derrotar a esos vientos gélidos mediante el orden, comprendió que, aunque podía conquistar bien por su cuenta, necesitaba gente para mantenerlo todo en marcha. Ishbara recibió el $pod_Embrace$ esa noche en su yurta.\n\nDurante casi mil años, Ishbara actuó como la mano derecha de Altın-Arığ. Codificó el Töre y se aseguró de que el Erk prosperara. En el siglo VI, concedió el $pod_Embrace$ a un Chiquillo propio: Ay-Toldı. Él era todo lo que Ishbara no era: un guerrero carismático con corazón de poeta. Ishbara lo amaba de verdad y comenzó a educarlo para que algún día pudiera dejar el Erk en sus manos. Años después, el Erk salió a apoyar a sus aliados [Glossary('Anda','podgloss.anda')] contra la amenaza del Este. La batalla iba mal, ya que sus enemigos los aniquilaban con demasiada facilidad. Desesperado por terminar con aquello y salvar a su pueblo, Ishbara tejió una destrucción absoluta en todo el campo de batalla. Miles de hojas llenaron el aire, destrozando la carne y los huesos de todos los que estaban alrededor. Ay-Toldı corrió hacia él, con la esperanza de ayudar a su [Glossary('Sire','game_concept_Sire_desc')]. Ishbara, exhausto, no lo vio. La tormenta hizo pedazos a su Chiquillo hasta que solo quedaron cenizas.\n\nIshbara trabaja ahora incansablemente junto a sus aliados [Glossary('Anda','podgloss.anda')] para acallar el silencio en su cabeza. No suele cabalgar él mismo al combate, pero cuando lo hace, siempre recibe los golpes de sus enemigos. Su única esperanza es que un día, el Lobo Dorado despierte y lo declare culpable. Espera que ella lo ejecute, concediéndole la paz que desea. Hasta entonces, cumplirá con su deber.\n\nDestino futuro: La Loba Dorada no le juzgará, pero obtendrá la paz que desea tras una escaramuza temeraria contra los $pod_kueijin$."
 POD_persistentpodlore.desc.795403: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nModu nació en el moribundo Imperio Xiongnu en el siglo I d. C.. Poseía un gran encanto y ambición desde el principio, deseando convertirse en un gran héroe. Cuando tenía diecinueve años, utilizó su influencia y carisma para reunir guerreros y les prometió participar en la batalla que destruiría a los traidores rebeldes del sur. Liderando a la vanguardia de un ejército de 7.000 hombres, guio a los guerreros hacia lo que él creía que sería una victoria aplastante.\n\nModu se equivocó. El comandante enemigo condujo a las fuerzas Xiongnu a una trampa, rodeándolos y masacrándolos. El caballo de Modu murió por una flecha y no pudo hacer más que yacer entre la sangre y el barro, viendo morir a sus hombres y escuchando sus gritos. Cuando los pocos supervivientes que quedaban le ayudaron a levantarse, contempló el campo en un silencio inquietante y solo pudo pensar en por qué había llevado a tantos a la muerte. Cabalgando de vuelta a su tribu sobre un caballo cojo, entre las yurtas ahora vacías, no pudo soportar mirar a nadie a los ojos. Las miradas que le lanzaron las esposas, hijos y madres fueron lo suficientemente devastadoras. Sin embargo, un extranjero silencioso vio más allá del hombre aparentemente destrozado. Este error podría convertirse en algo bueno, aunque tarde siglos. Ishbara dio el Abrazo al joven derrotado esa noche.\n\nAquel impetuoso guerrero murió en ese campo de batalla, pero un Lobo Vigilante tomó su lugar. Modu ya no lucharía de forma temeraria. Para evitar que una tragedia como aquella batalla volviera a ocurrir, dominó el uso de sus poderes, utilizándolos para camuflarse. Ahora sirve como el comandante principal de su [Glossary('Sire','game_concept_Sire_desc')], Ishbara. Modu ha cambiado mucho desde sus días mortales. Sigue teniendo ese encanto innegable, pero es uno contenido y humilde. Algunos pueden considerar su cautela como una debilidad, pero es indiscutible que se preocupa profundamente por su gente.\n\nDestino futuro: Modu seguirá siendo un mentor y líder muy querido para los Erk, especialmente para los más jóvenes."
 POD_persistentpodlore.desc.795404: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nYidu nació en una de las muchas tribus Shatuo que servían como guardias fronterizos menores para la dinastía Tang. Durante 52 años, fue el sirviente perfecto. Un bárbaro incivilizado a ojos de los Tang, pero al menos un bárbaro servil. Odiaba cada segundo de ello. Fue testigo de cómo él mismo y su pueblo eran utilizados como escudos humanos por los generales chinos contra sus enemigos. Los Shatuo eran despreciados constantemente, castigados por cada pequeño error e incluso por algunos que no cometían. Yidu se convirtió en uno de los generales Shatuo a la edad de 50 años. Un hombre cínico y lleno de cicatrices, se dio cuenta de que nunca habría paz con sus opresores. Solo un golpe de bota en el cuello sería la respuesta adecuada.\n\nEn el año 884 d. C., Yidu aprovechó una oportunidad. Reunindo a hombres leales a él, asesinó a sus supervisores chinos, quemando sus mansiones con sus familias dentro. Tras haber oído rumores sobre un táctico hábil y oportunista, Ishbara lo rastreó y concedió el $pod_Embrace$ a Yidu, con la esperanza de convertir su odio en algo más productivo. Lo consiguió, pero no de la forma que esperaba.\n\nYidu se convirtió en un hombre aún más competente y diligente. Sus fríos y mezquinos Conjuras también crecieron, pero nadie podía negar los resultados que obtenía. Yidu odia que su [Glossary('Sire','game_concept_Sire_desc')] se conforme con ser un mero sirviente de los [Glossary('Anda','podgloss.anda')], cuando el Este está tan listo para la conquista. Yidu controla las regiones más orientales pertenecientes a los Erk. Últimamente, ha empezado a reclutar masivamente entre los remanentes Shatuo, utilizándolos como su ejército personal. El Cuervo Negro tiene la intención de provocar una guerra forzando a los Catayanos a reaccionar ante uno de sus ataques secretos, obligando así a su [Glossary('Sire','game_concept_Sire_desc')] a unirse y defenderlo.\n\nDestino futuro: Yidu se separará del resto de los Erk siglos después y gobernará su tierra en el Este con un éxito aterrador. Solo la hoja de un asesino pondrá fin a sus ambiciones."
 POD_persistentpodlore.desc.795405: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nNacido como el único hijo de un talentoso mercenario, Chixin pasó su infancia viajando y esgrimiendo. Tenía un talento natural para hacer amigos y aliados con facilidad, seduciendo a muchas mujeres y luchando con sus espadas gemelas. Se unió a su primera escaramuza a los 15 años, y se movía con una rapidez aterradora por el campo de batalla, cargando sin miedo contra las líneas de frente. Su fama creció con el paso de los años, atrayendo la atención de Yidu, que buscaba reunir a más gente leal a él. En lugar de darle el Abrazo de inmediato, Yidu persuadió al joven impetuoso de que le aguardaban innumerables oportunidades si aceptaba su oferta. Sin ser alguien que rechazara una oportunidad para obtener más lucha y gloria, aceptó.\n\nChixin se acostumbró a su nueva no-vida sorprendentemente bien. Yidu trajo a muchos maestros de la espada para perfeccionar su educación, y le enseñó cómo un hombre debe liderar a su pueblo: de forma eficiente y sin dudas. El Joven Cuervo es muy apreciado entre los Erk debido a su carisma natural y su Destreza. Aunque no es tan despiadado como su [Glossary('Sire','game_concept_Sire_desc')], muchos temen que las grandes ambiciones de Chixin puedan sentenciar su destino.\n\nDestino futuro: Tras haber sido preparado para ser un gran heredero, Chixin tomará el mando de lo que quede de las tierras de Yidu tras su asesinato. Furioso y sumido en el duelo, lanzará ataques temerarios en represalia. Puede que sea una guerra que esté destinado a perder, pero Chixin no descansará hasta vengar a su [Glossary('Sire','game_concept_Sire_desc')]."
 POD_persistentpodlore.desc.795408: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEn sus días mortales, Çiçek era la amada hija de una adinerada familia de mercaderes uigures. Criada en un mundo de regateos, seda y economía, sus padres le enseñaron que un cumplido o una promesa bien dicha podían abrir puertas que ninguna cantidad de violencia o soborno podría.\n\nCuando Ay-Toldı, el amado de su propia comunidad, visitó su ciudad por negocios, quedó cautivado por su amabilidad y su alma gentil. Pasaron una semana caminando y hablando bajo el suave cielo nocturno. Sin embargo, cuando llegó el momento de marcharse, se negó a llevársela con él. La amaba demasiado como para infligirle la maldición que su estirpe había impuesto a una joven Inocente. Çiçek podía ser gentil y amable, pero eso no significaba que fuera débil. Lo rastreó antes de que pudiera marcharse y le suplicó a Ay-Toldı, argumentando que una vida bajo el sol brillante no significaba nada si no podían estar juntos. Conmovido por su devoción, Ay-Toldı le concedió el $pod_Embrace$.\n\nÇiçek solo llevaba unos pocos años en su no-vida cuando su amado [Glossary('Sire','game_concept_Sire_desc')] fue asesinado accidentalmente por Ishbara. Cuando el hombre destrozado regresó y le confesó lo que había hecho, se preparó para que ella reaccionara con furia. En su lugar, Çiçek abrazó al hombre y lo perdonó, sabiendo que nunca habría cometido un acto tan terrible con intención. Çiçek sirve ahora como diplomática de los Erk, haciendo todo lo posible para evitar que su única familia restante se desintegre.\n\nDestino futuro: Çiçek seguirá viviendo, trasladándose a la Turquía moderna. Operando desde Estambul, será la única razón por la que los Erk no se despedacen entre sí."
 POD_persistentpodlore.desc.795407: "Este personaje ha sido creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nEn sus días mortales, Bayan era un recaudador de peajes kazaro destinado cerca de un importante centro comercial. Era un hombre de apetitos masivos desde el principio: comida, bebida, buena compañía y mujeres. A pesar de lo que pudiera sugerir su naturaleza jovial y despreocupada, poseía una mente aguda para los números. Podía echar un vistazo a la caravana de un mercader persa y calcular un peaje que dejara a todos satisfechos.\n\nEl joven Ay-Toldı le concedió el $pod_Embrace$, tanto por su constante capacidad para hacerlo reír como por sus talentos como tesorero. Los dos se hicieron amigos cercanos casi de inmediato. Cuando Bayan perdió a su [Glossary('Sire','game_concept_Sire_desc')], se volvió más ruidoso y estrepitoso. Siempre está rodeado de gente en algún festín o evento, reacio a estar solo con sus pensamientos.\n\nDestino futuro: El $pod_kueijin$ contraatacará los ataques de Yidu tomando como objetivo a Bayan y Çiçek. Cuando sus defensas sean vulneradas, para ganar tiempo para que los demás escapen, utilizará sus habilidades al máximo y conjurará la ilusión de un ejército que brilla en plata y oro. Cargando contra las líneas enemigas, riendo, la viva imagen de un Dios de la Riqueza. Ganará tiempo suficiente para que otros escapen, pero el propio Bayan morirá, falleciendo tal como vivió: dando un espectáculo ruidoso para que nadie vea el dolor que oculta."
 POD_persistentpodlore.desc.795411: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no forma parte oficial del $pod_wod$.\n\nEn vida, Kreka fue un verdadero pilar del Imperio Huno. Maestra de la diplomacia y de la administración, contaba con la lealtad de innumerables gobernantes y trataba con multitud de enviados. Cuando le llegó la noticia de que Atila había muerto de una hemorragia nasal al contemplar la belleza de su nueva esposa, Ildico, el mundo que conocía se hizo añicos. Mientras el imperio se desgarraba desde dentro, Kreka solo pudo observar cómo se derrumbaba aquel señorío tan meticulosamente forjado. Llegó a odiar a la joven Ildico, convencida de que la muchacha era la maldición que los había condenado a todos.\n\nCuando los hunos se desintegraron, los Erk, aislados del mundo, oyeron hablar de los talentos de Kreka. Fue llevada en secreto a Ergenekon y allí recibió el $pod_Embrace$. Durante cientos de años sirvió como matriarca del oro y del arte de gobernar.\n\nKreka nunca se había preguntado qué fue de Ildico después. Pero mientras el [Glossary('Anda','podgloss.anda')] golpea a la Corte de la Tortuga Negra, unos susurros inquietantes sobre un [Glossary('Wu','podgloss.wu')] de novias demoníacas llegan a sus oídos. Rumores de una mujer de rostro trágicamente hermoso y familiar.\n\nEl desdén de Kreka hacia Ildico se convirtió en profundo respeto en cuanto los susurros se confirmaron. Ya no era una niña débil: se había convertido en alguien capaz de escapar de las garras del horrendo [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. Y no era la única que recordaba la visión y el olor del gran salón de Atila.\n\nDestino futuro: Conscientes de que una guerra entre los Erk y los $pod_kueijin$ no beneficiaría a nadie, las dos reinas inmortales forjarán una alianza clandestina. Ildico usará su influencia, cada vez mayor, para mantener a los Muertos Hambrientos fuera del territorio Erk. Kreka se dedicará a frenar el avance de Yidu hacia el este y persuadirá a los Erk de que marchen hacia el oeste, en dirección a Anatolia. Kreka establecerá su corte en la actual Turquía y se convertirá en una titana del comercio, de lengua de plata."
 
 POD_persistentpodlore.desc.793562: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nLo que antaño fue el mayor regalo que los Exploradores dieron al [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], la última novia de un Señor de la Estepa que casi destruyó dos imperios, por derecho propio, Ildico nunca debería haber visto al [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], destinada a morir mucho más allá del alcance del [UmbraGlossaryLocalized('yomi_wan','Inframundo')]. Sin embargo, la marcha de los hunos estaba ensombrecida por los Exploradores del [Glossary('Rey Yama','podgloss.yamaking')], y de la corte de Atila el Huno, su última esposa fue su trofeo.\n\nTan hermosa que mató a su marido con una hemorragia nasal en su noche de bodas, los Exploradores la acogieron en el caos de su muerte y la llevaron al dominio de su [Glossary('Rey Yama','podgloss.yamaking')], la asesinaron y se la ofrecieron al [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] como una pecadora elegida. Ildico fue convertida inmediatamente en la novia trofeo de cualquier tribu maldita que su infierno [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] favoreciera.\n\nPero los tiempos están cambiando.\n\nCon el éxito de la Progenie de Dobrul, el [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] se ha distraído. E Ildico, que durante mucho tiempo se pensó que solo era un rostro hermoso con poco tras sus ojos, junto con las otras novias, orquestó su escape mediante una serie de sobornos, seducciones y asesinatos para asegurar su huida. Y de vuelta en el mundo de los vivos, la arquitecta de su libertad, Ildico, mantiene unido al recién formado [Glossary('Wu','podgloss.wu')] de novias demoníacas.\n\nQueriendo mantenerse móvil para evitar a los Exploradores, Ildico lidera el [Glossary('Wu','podgloss.wu')] como diplomática exteriormente, pero quiere más. Por una sola noche, fue una Reina. La echa de menos profundamente. Y ella y sus nuevas hermanas sufrieron en el Infierno durante mucho más tiempo de lo que la mayoría de los Ancestros de la Corte de la Tortuga Negra han existido. Tiene Ansia de más.\n\nSiendo un trofeo en el Infierno, jura ser algo más.\n\nDestino futuro\n\nIldico mantuvo la paz tanto como pudo, pero cuando le quedó claro que la guerra era inevitable, reposicionó a sus hermanas y a sí misma hacia el norte, dejando que el [Glossary('Anda','podgloss.anda')] desgaste su hoja contra el caparazón de la Corte de la Tortuga Negra.\n\nCuando comenzó el contraataque, Ildico lideró los Claros Silenciosos como negociadora y mediadora. Al coordinar su hueste, se le concedió el rango de Ancestra, donde comenzaría inmediatamente a construir su poder.\nEn las noches actuales, ayuda discretamente en la Rebelión del Siglo junto a Ji-yeon, vigilando el Quincuncio con el Ansia de una Reina privada de su derecho."
 POD_persistentpodlore.desc.793563: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nSi bien la vasta y abrumadora mayoría de las amenazas infernales con las que los Muertos Hambrientos están familiarizados son productos ya sea del [UmbraGlossaryLocalized('yomi_wan','Inframundo')], los sueños locos de la humanidad, o las manifestaciones de la entropía, existen otras fuerzas más raras.\nUno de esos horrores es la entidad ctónica conocida como el Jardinero del Infierno, Sarisel. Convocado por magos hace mucho tiempo, las conquistas de los mongoles han perturbado el hogar de los Terrestres, y algunos de sus seguidores lo han traído a la península de Corea para mantenerlo a salvo. Allí, el demonio engendró una hija con una mujer local. Y Ji-yeon ha sufrido la indiscreción de su padre desde entonces.\n\nPreparada para ser una herramienta de su padre infernal incluso tras su partida, fue entrenada para ser uno de sus ejecutores, a pesar de las protestas de su corazón. Pero la hoja de un Cazador de Demonios no se preocupó por cuánto deseaba ella la libertad, y se aseguraron específicamente de que fuera a los pozos más profundos de la Prisión de la Tierra.\n\nPero el Infierno no la reconoció como algo que le perteneciera. Y como siempre había rechazado la voluntad de su padre, la prisión más profunda a la que él pertenecía no la llamó.\n\nTras escapar, su naturaleza doblemente infernal la puso bajo una sospecha inmediata, por lo que Ji-yeon comprende que ni siquiera una tutela de Ancestros de poder puede salvarla. Solo la acción puede hacerlo. Así que reunió a otras cuatro estudiantes de un impulso similar y las lideró hacia el [Glossary('Anda','podgloss.anda')].\n\nTodas las Cortes les temen, así que, ¿qué mejor lugar para demostrar su valía?\n\nDestino futuro\n\nAunque las hazañas de Ji-yeon no fueron celebradas directamente fuera de la Estepa, fue una pieza innegablemente crítica en la derrota del [Glossary('Anda','podgloss.anda')]. Donde la mayoría de los Ancestros solo veían a los señores de la guerra Cainitas, Ji-yeon sabía que cada cerebro maestro tiene sus partidarios.\nLos innumerables aliados del [Glossary('Anda','podgloss.anda')], concretamente los Erk, se vieron sometidos a un acoso implacable y a campañas de hostigamiento, mientras Ji-yeon utilizaba caminos ocultos en la Umbra para herir profundamente. Aunque ellos la odiarían, ella evitó que rescataran a Dobrul. Pero su falta de reconocimiento y su continua condena la llenan de furia, por lo que se alía con Ildico en las Noches Modernas en apoyo a la Rebelión del Siglo, para castigar a los necios que todavía la ven como algo más que un engendro sin mente."
 POD_persistentpodlore.desc.793564: "Este personaje fue creado por los desarrolladores de PoD para aportar mayor profundidad al escenario y no es parte oficial del $pod_wod$.\n\nDesde presenciar cómo el imperio en el que nació entraba en un duro periodo de declive hacia una fuerza nómada, y tras casarse con él, Sabina siente que conoce demasiado bien el destino de la Corte de la Tortuga Negra. Después de todo, ¿cuántas veces más ha visto esto antes?\n\nNacida como hija de unos mercaderes bizantinos menores, las conquistas de Asparuh tras la batalla de Ongal hicieron que Sabina viviera gran parte de su vida a la sombra de tales conquistas. Vendida por sus padres al Kan convertido en Emperador, Sabina fue una de sus muchas esposas y, aunque su belleza le valió la atención especial de Asparuh, su falta de hijos aseguró que, tras la muerte de este, se quedara sola y sin aliados en una corte extranjera. Y es ahí donde los Exploradores atacaron, secuestrándola, llevándola a las estepas y sacrificándola como un regalo para el [Glossary('Dokhor-Khan','podgloss.dokhorkhan')].\n\nComplacido con la ofrenda, Sabina se convirtió en una de las novias del diablo entregadas a los pecadores favorecidos del [Glossary('Dokhor-Khan','podgloss.dokhorkhan')].\n\nPero con su reciente escape bajo el ahora disperso enfoque del [Glossary('Rey Yama','podgloss.yamaking')], Sabina ve la [Glossary('Anda','podgloss.anda')] como solo otra iteración de las incontables amenazas que había visto en el Infierno, y las Cortes Augustas como otra permutación de pueblos asentados demasiado contentos con su suerte para lidiar con el problema. Y ella ha terminado de revivir esa tragedia.\n\nAunque exteriormente actúa como diplomática junto a sus hermanas-novias, Sabina ya ha estado comunicando sigilosamente movimientos al Claro Silencioso y a sus aliados Heraldos. Como sus hermanas, ella quiere más. Y los tendrá.\n\nDestino futuro\n\nMientras su [Glossary('Wu','podgloss.wu')] se dedicaba a sus propios asuntos, Sabina aseguró la influencia que necesitarían para volverse demasiado importantes como para ser descartados. Y cuando el polvo se asentó tras la [Glossary('Anda','podgloss.anda')], se mantuvo cerca de sus hermanas y construyó su propio poder. Y al llegar la modernidad, mientras la Rebelión del Siglo sacude el Quincuncio, los estudiantes rebeldes y los Cazadores mortales siempre podrán encontrar un patrocinador en Sabina."
 POD_persistentpodlore.desc.793565: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nMientras que para la mayoría de sus compañeras, las Novias del Diablo, la humillación de ser esposas de la Tribu Favorecida del [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')] era algo nuevo, para Perozdukht aquello era simplemente su vida.\n\nUna princesa sasánida capturada por los Heftalitas y tomada como trofeo de sus conquistas; así fue cuando los Exploradores vinieron a por ella, lo que en aquel momento no fue más que otra tragedia en su existencia. Pero tras su sacrificio, la comprensión de que ese estado de ser podría ser todo lo que le quedara despertó algo en Perozdukht.\n\nCuando [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] se regocijó con el éxito del [Glossary('Anda','podgloss.anda')], fue Perozdukht quien instó a sus hermanas a escapar. Fue ella quien las mantuvo unidas, la que las sostuvo en la prueba y la tribulación, y las consoló en su huida. Y una vez de vuelta en el mundo mortal, fue ella quien sugirió que permanecieran juntas cuando todas carecían de palabras para describir que deseaban lo mismo.\n\nAunque exteriormente no era más que otra de las bellezas de los Claros Silenciosos, en su interior es su corazón y alma, su consuelo y guía. Aunque desea la grandeza como todas las demás, no perderá a ninguna de sus hermanas. Pasaron el infierno juntas, y ella verá cómo todas vuelven a convertirse en reinas.\n\nDestino futuro\n\nCon su discreto papel en los Claros Silenciosos, Perozdukht no fue recompensada con ningún Ancestros tras la muerte del [Glossary('Anda','podgloss.anda')], pero sus hermanas se negaron a separarse de ella y se convirtió en su nexo de unión.\n\nCon la llegada de las noches actuales, también está avivando las llamas de su Ansia. Cuando el Quincuncio flaquee, ellas serán las nuevas heroínas que se alzarán sobre él. Después de todo, ¿quién mejor para resistir al [Glossary('Emperador Demonio','podgloss.demonemperor')] que quienes soportaron el Infierno durante mucho más tiempo que la mayoría?"
 POD_persistentpodlore.desc.793566: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nEl primer cambio respecto a las prácticas habituales de recolección de los Exploradores fue, sin embargo, el interés especial de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], hija noble de un pretendiente al trono de China y casada con un señor de la estepa. Así, cuando Changle conoció por primera vez a Bumin Qaghan del Kanato de los Göktürks, no era consciente de los Demonios en las sombras.\nDespués de todo, ella solo era una pieza más en el tablero entre los Wei y los Göktürks, y la política de la corte era mucho más relevante para una mujer noble que hacía todo lo posible por evitar un fin prematuro. Pero cuando su marido murió de vejez y los ojos se apartaron de ella, los Exploradores atacaron, la arrastraron a las estepas y la enviaron al [Glossary('Hell of Spiked Chains','podgloss.hellspikedchains')] para convertirse en una Esposa del Diablo de la Tribu Favorecida de Dohkor-Khan.\n\nChangle languideció en el Infierno, obligada a ser una esposa trofeo cuando en realidad tenía deseos de gobernar. La logística y los números eran su fuerte, pero lo único que se valoraba de ella era lo buena que era como novia.\nDebido a eso, cuando [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] celebraba el [Glossary('Anda','podgloss.anda')], se unió con gusto a sus hermanas para escapar del Infierno. Pero, de nuevo, se encontró con muchos que la ignoraban y solo veían en ella una cara bonita. Aprieta los dientes, sabiendo que puede ser mucho más.\n\nCumplirá el papel por ahora, pero una vez que pueda liberarse de él, se negará a ser solo un adorno estético.\n\nDestino futuro\n\nLa realpolitik del Claro Silencioso le aseguraría a Changle un Ancestros en el Quincunco, pero incluso entonces, los Claros Silenciosos seguían siendo vistos como bellezas con poco tras la mirada.\nAsí que aceptó el puesto y se propuso construir su dominio de nidos de dragón de forma profunda y exhaustiva. Y al llegar la modernidad, mientras los Muertos Jóvenes de la Rebelión del Siglo buscan atacar a los Ancestros, Changle siempre parece tener un plan prudente preparado para ellos."
 POD_persistentpodlore.desc.793567: "Este personaje fue creado por los desarrolladores de PoD para dar mayor profundidad al escenario y no es una parte oficial del $pod_wod$.\n\nTras haber sido la joya preciosa de las Novias del Diablo para Dokhor Khan, y ahora la principal diplomática del Claro Silencioso entre las Cortes, Xiaoguo ocupa una posición envidiable que asume con un entusiasmo sorprendente.\n\nEn vida, hija del Emperador Suzong de Tang y casada con Bayanchur Khan del Kanato Uigur durante un año antes de su muerte, Xiaoguo, mientras regresaba con su padre tras la muerte de este un año después de su matrimonio, fue víctima de la tragedia; los Exploradores, buscando el premio de ser la hija de un Emperador por su cuenta, cabalgaron y la arrastraron hacia las estepas.\n\n[Glossary('Dokhor-Khan','podgloss.dokhorkhan')] estaba eufórico con este sacrificio y, como última Novia del Diablo, Xiaoguo fue la más inconsolable de sus hermanas y, hasta su escape, la más melancólica.\n\nPero el escape la cambió. Aquel primer aliento libre del infierno... y nunca quiso que se acabara. Juró construir algo, experimentarlo todo y vivir de verdad. Murió siendo apenas una mujer, y ahora era esta poderosa inmortal.\nLa maldición que ya sentía, y ahora podía reclamar el mundo. De la más deprimida a la más enérgica, Xiaoguo disfruta su papel como diplomática entre las Cortes, pues ahora no solo puede ver el mundo, sino también aquello que algún día podría tomar.\n\nDestino futuro\n\nLos contactos de Xiaoguo en todas las Cortes permitieron que el Claro Silencioso evitara los embates del [Glossary('Anda','podgloss.anda')], y la constante presencia de Xiaoguo aseguró que el Quincunco los recompensara bien.\nPero eso no fue suficiente para saciar su nuevo amor por la vida. Está totalmente comprometida con las ambiciones de sus hermanas y desempeña el papel de la mediadora bonita y jovial en tiempos difíciles, asegurándose de que ninguna mirada recaiga sobre sus militarizadas hermanas."

 
