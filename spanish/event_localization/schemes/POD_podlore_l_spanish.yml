# Findabair https://en.wikipedia.org/wiki/Findabair 
 POD_podlore.100.desc.POD_fae_character_210: "La hija de Ailil y Maeve. Como hija, no formaba parte de la profecía del druida sobre cuál de los hijos de Maeve mataría a Conchobar. En consecuencia, no fue renombrada «Maine». La traducción literal de su nombre significa «Fantasma Blanco». Su madre, Maeve, la utiliza como un posible premio para cualquiera que luche contra Cú Chulainn. Tras la muerte de este, Maeve también la utiliza para forjar alianzas con otros señores.\nEste personaje se basa en el folclore y no tiene un destino canónico conocido.\nSu último y quizás auténtico interés amoroso, Rochad Mac Faithemain, se unió a las fuerzas de Ulster antes de la última gran batalla. Para persuadirle de que no luchara contra Connacht, Maeve utilizó el afecto de su hija para pactar una tregua. Finnabair pasó la noche con Rochad y, finalmente, la noticia llegó a los 7 reyes de Munster, a todos los cuales también se les ofreció a Finnabair a cambio de su lealtad. Estos presentaron sus quejas ante los hijos de Ailill, lo que resultó en una batalla y la eventual muerte de 700 hombres. Al enterarse de cómo había sido utilizada y de cuántos hombres habían muerto por su culpa, Finnabair murió de la vergüenza. «De ahí el nombre Finnabair Sléibe, Finnabair de la Montaña»."

# Knud
# Implied father of Harald Knudson 
# https://whitewolf.fandom.com/wiki/Kingdom_of_Jutland#Overview
# https://en.wikipedia.org/wiki/Cnut
# https://en.wikipedia.org/wiki/King_Canute_and_the_tide
 POD_podlore.100.desc.POD_fae_character_250: "Dos siglos después, el hijo de Ragnelf y Sweyn Barba de Hierro decidió probar suerte gobernando a los mortales. Conocido como Canuto el Grande, gobernó el Imperio del Mar del Norte (Inglaterra, Dinamarca y Noruega) hasta el año 1034 d. C. Para gobernar sobre la población, recientemente convertida (según la cuenta de las hadas) a la Iglesia cristiana, Knud aprendió los rituales y el saber de la fe. Imitó demasiado bien a los piadosos y acabó uniéndose a la causa constantiniana, aunque con la perspectiva particular de Winter como un rey saqueador vikingo obsesionado con la conquista. El momento de su conversión se narra en la historia «Canuto y la marea». El rey colocó su trono a la orilla del mar y ordenó a la marea entrante que se detuviera y no mojara sus pies ni sus ropas. Intentó un poderoso encantamiento para ello y, ante la vista de los verdaderos creyentes... su magia flaqueó. La marea continuó subiendo como de costumbre y pasó sobre sus pies y piernas sin respetar su persona real. Knud saltó hacia atrás diciendo: «Que todos sepan cuán vacío y carente de valor es el poder de los reyes, pues no hay ninguno digno del nombre, salvo Aquel a quien el cielo, la tierra y el mar obedecen por leyes eternas». Luego colgó su corona de oro en un crucifijo y nunca volvió a usarla «en honor a Dios, el Rey todopoderoso». Cansado de saquear y de gobernar a los mortales, fingió su muerte y regresó a la Casa Aesin para difundir la fe constantiniana en su casa ancestral."

