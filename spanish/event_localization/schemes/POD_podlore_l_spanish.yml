# Sin became Maine Mílscothach ("honey-speech") https://en.wikipedia.org/wiki/Medb#Medb's_7_Sons
 POD_podlore.100.desc.POD_fae_character_208: " \nEste personaje se basa en el folclore y no tiene un destino canónico conocido.\nMaeve y Ailill tuvieron siete hijos, todos llamados Maine. Originalmente todos tenían otros nombres, pero cuando Maeve preguntó a un druida cuál de sus hijos mataría a Conchobar, él respondió: «Maine». Ella no tenía ningún hijo llamado Maine, así que renombró a todos sus hijos. Sin se convirtió en Maine Mílscothach («habla de miel»)."

# Dáire became Maine Móepirt ("beyond description") https://en.wikipedia.org/wiki/Medb#Medb's_7_Sons
