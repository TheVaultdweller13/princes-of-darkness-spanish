l_spanish:

 POD_hunteradoption.100.t: "Una nueva luz"
 POD_hunteradoption.100.desc: "Tras un entrenamiento exhaustivo, confías en que tu escudero esté listo para unirse a la lucha contra la oscuridad. Con este empeño, te aseguras de que la obra de Dios te sobreviva y continúe hasta la inevitable victoria. Esperas que tu pupilo, algún día, haga retroceder a las fuerzas del Infierno con su mera presencia. Pero hasta entonces, queda mucho trabajo por hacer..."
 POD_hunteradoption.100.option.a: "Le enseñé sobre asuntos militares"
 #POD_hunteradoption.100.option.a.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza"  
 POD_hunteradoption.100.option.b: "La habilidad con las armas fue nuestro enfoque principal"
 #POD_hunteradoption.100.option.b.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza" 
 POD_hunteradoption.100.option.c: "Mi escudero sabe que hay agentes del Infierno en cada sombra"
 #POD_hunteradoption.100.option.c.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza" 
 POD_hunteradoption.101.t: "Una nueva luz"
 POD_hunteradoption.101.desc: "Como corazón palpitante de la Inquisición de las Sombras, las Hermanas de San Juan cargan con un pesado fardo que no se comparte fácilmente. A pesar de ello, confías en las habilidades de tu nueva pupila tras este periodo de entrenamiento exhaustivo. Otra novia de Dios está lista para asumir tu manto si la oscuridad te vence, o cuando lo haga. Un pequeño consuelo, pero consuelo al fin y al cabo."
 POD_hunteradoption.101.desc.joan: "Actuando mayoritariamente por separado de la Inquisición de las Sombras, los seguidores de Juana están menos centrados en un conjunto de habilidades particular en comparación con sus contrapartes inquisidoras. Cada hermana tiende a ser una persona autosuficiente, capaz de manejar tanto la diplomacia como el combate.\nAun así, solo tienes un tiempo limitado para instruir a tu nueva pupila antes de tener que volver a tus deberes, y hay que tomar decisiones."
 POD_hunteradoption.101.option.a: "Ha aprendido mucho"
 #POD_hunteradoption.101.option.a.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza"  
 POD_hunteradoption.101.option.b: "Ayudará a prosperar a la Santa Iglesia"
 #POD_hunteradoption.101.option.b.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza" 
 POD_hunteradoption.101.option.c: "Está lista para difundir la Palabra"
 POD_hunteradoption.101.option.d: "Se enfrentará a la oscuridad de frente"
 POD_hunteradoption.101.option.e: "Su poder latente debe ser explorado"
 POD_hunteradoption.101.option.c.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza" 
 POD_hunteradoption.102.t: "Una nueva luz"
 POD_hunteradoption.102.desc: "A menudo calumniada, la Orden Roja es, no obstante, una parte crucial de la Inquisición. Impulsados por una sed infinita de conocimiento, muchos de sus miembros se vieron a menudo atraídos por un camino más oscuro. Enseñaste a tu pupilo lo mejor que pudiste para evitar tal destino."
 POD_hunteradoption.102.option.a: "Mi pupilo ha aprendido mucho"
 #POD_hunteradoption.102.option.a.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza"  
 POD_hunteradoption.102.option.b: "Mi pupilo ayudará a prosperar a la Santa Iglesia"
 #POD_hunteradoption.102.option.b.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza" 
 POD_hunteradoption.102.option.c: "Mi pupilo conoce el poder de los secretos"
 #POD_hunteradoption.102.option.c.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza" 
 POD_hunteradoption.103.t: "Una nueva luz"
 POD_hunteradoption.103.desc: "Una fuerza justamente temida, incluso por los otros Inquisidores, los Oculi Dei son la policía secreta de los Cazadores. Saben mucho, mucho más de lo que la mayoría de la gente piensa y son la fuente de información más creíble sobre los habitantes de la noche. Sin embargo, los miembros de los Oculi tienden a ser paranoicos hasta el extremo, viendo complots por todas partes... pero la mayoría de las veces, en realidad tienen razón."
 POD_hunteradoption.103.option.a: "¡Abre los ojos!"
 #POD_hunteradoption.103.option.a.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza"  
 POD_hunteradoption.104.t: "Una nueva luz"
 POD_hunteradoption.104.desc: "La familia von Murnau tiene la dudosa bendición de ser capaz de 'oler' el mal. Como tales, son los Sabuesos de la Inquisición y un activo valioso, incluso si sus formas no clericales los convierten en extraños compañeros de cama para las otras órdenes. Es práctica común que un Inquisidor de la familia tome a otro miembro más joven de la misma como pupilo hasta que sea capaz de luchar contra la oscuridad por su cuenta."
 POD_hunteradoption.104.option.a: "Mi pupilo conoce el poder de los secretos"
 #POD_hunteradoption.104.option.a.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza"  
 POD_hunteradoption.104.option.b: "Mi pupilo ayudará a prosperar a la Santa Iglesia"
 #POD_hunteradoption.104.option.b.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza" 
 POD_hunteradoption.104.option.c: "Mi pupilo está listo para difundir la Palabra de Dios"
 #POD_hunteradoption.104.option.c.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza" 
 POD_hunteradoption.105.t: "Una nueva luz"
 POD_hunteradoption.105.desc: "Atrás quedaron los días en que el peso de proteger al rebaño fiel de los servidores de la oscuridad era llevado solo por Bayezid y Basil. Una nueva generación de pastores guiará a las almas puras hacia la luz."
 POD_hunteradoption.105.option.a: "Mi pupilo dirigirá la ira de los fieles."
 #POD_hunteradoption.105.option.a.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza"  
 POD_hunteradoption.105.option.b: "Mi pupilo avivará las llamas del celo."
 #POD_hunteradoption.105.option.b.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza" 
 POD_hunteradoption.106.t: "Una nueva luz"
 POD_hunteradoption.106.desc: "Atrás quedaron los días en que el peso de mantener el equilibrio entre los shen y los mortales recaía solo sobre tus hombros. Una nueva generación ayudará a mantener esta paz."
 POD_hunteradoption.106.option.a: "Mi pupilo seguirá el rastro de Yi."
 #POD_hunteradoption.106.option.a.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza"  
 POD_hunteradoption.106.option.b: "Mi pupilo ayudará en mi venganza."
 #POD_hunteradoption.106.option.b.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza" 
 POD_hunteradoption.107.t: "Una nueva luz"
 POD_hunteradoption.107.desc: "Atrás quedaron los días en que el peso de proteger a la humanidad contra los monstruos de la noche recaía solo sobre tus hombros. Una nueva generación se alzará y luchará."
 POD_hunteradoption.107.option.a: "Mi pupilo se convertirá en un líder extraordinario."
 #POD_hunteradoption.107.option.a.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza"  
 POD_hunteradoption.107.option.b: "Mi pupilo se unirá a la causa."
 #POD_hunteradoption.107.option.b.tt: "El periodo de entrenamiento fue estresante, pero ahora tienes un nuevo heredero en caso de que la oscuridad te venza" 
