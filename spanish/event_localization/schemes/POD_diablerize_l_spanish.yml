l_spanish:

 POD_diablerize.100.t: "Diablerie: [diablerie_location.GetNameNoTooltip]"
 POD_diablerize.100.desc: "He seguido el rastro de [defender.GetFirstName] hasta su [defender.Custom('PODDomicile')] en [diablerie_location.GetNameNoTooltip]. Todo está listo, y ahora por fin puedo atacarl[defender.Custom('ES_OA')] para drenar toda su sangre, ¡y hasta su propia alma! El riesgo personal es considerable, pero las recompensas, mayores. ¿Debo seguir adelante y lanzar mi ataque más letal contra [defender.GetFirstName]?"
 POD_diablerize.100.option.a: "¡Atacar a [defender.GetTitledFirstName]!"
 POD_diablerize.100.option.a.tt: "Se producirá una Contienda; si pierdo, yo también podría ser destruid[ROOT.Char.Custom('ES_OA')]. Usaré toda mi fuerza de voluntad y los poderes de la sangre para tener éxito."  
 POD_diablerize.100.option.a.tt.beast: "#beast ¡Atacar! ¡Tendremos la sangre de su corazón!#!"   
 POD_diablerize.100.option.b: "Abandonar esta asquerosa búsqueda."
 POD_diablerize.100.option.b.tt.beast: "#beast Sabemos que [defender.GetSheHe] es débil. ¡Puedo olerlo! ¡No retrocedas ahora!#!"

 POD_diablerize.101.t: "Diablerie: Fracaso..."
 POD_diablerize.101.desc: "Por muchos recursos que haya volcado en esta empresa, al final todo fue en vano. [defender.GetFirstName] sigue eludiéndome, y mis intentos de seguir sus movimientos no han dado resultado alguno. Sorprenderl[defender.Custom('ES_OA')] desprevenid[defender.Custom('ES_OA')] y sin defensa parece imposible en estos momentos."
 POD_diablerize.101.option.a: "Hora de abandonar este conjura."
 POD_diablerize.101.option.a.tt.beast: "#beast ¡No puedes negármelo para siempre!#!"
     
 POD_diablerize.200.t: "¡Un ataque mortal!"
 POD_diablerize.200.desc: "[attacker.GetFirstName] me ha pillado a solas en [diablerie_location.GetNameNoTooltip]. ¡Sus ojos brillan con el Ansia de la Bestia! ¿Qué debo hacer?"
 POD_diablerize.200.option.a: "¡Huye!"
 POD_diablerize.200.option.a.tt.beast: "#beast ¡Corre, necio!#!"
 POD_diablerize.200.option.a.tt: "Un duelo de maniobra determinará si puedes escapar del ataque de [attacker.GetFirstNamePossessive]."
 POD_diablerize.200.option.a.desc: "Un concurso de maniobra"
 POD_diablerize.200.option.a.success: "[defender.GetFirstName] gana"
 POD_diablerize.200.option.a.tt.defender_wins: "¡Escapo!"
 POD_diablerize.200.option.a.tt.celerityadvanced: "¡Tengo Celeridad avanzada!"
 POD_diablerize.200.option.a.tt.potenceadvanced: "¡Tengo Potencia avanzada!"
 POD_diablerize.200.option.a.tt.blink: "Puedo moverme en un abrir y cerrar de ojos."
 POD_diablerize.200.option.a.tt.traversal: "Puedo correr por las paredes y sobre el agua."
 POD_diablerize.200.option.a.tt.soaring_leap: "Puedo dar saltos prodigiosos."
 POD_diablerize.200.option.a.tt.uncanny_grip: "Tengo un agarre sobrenatural."
 POD_diablerize.200.option.a.failure: "[attacker.GetFirstName] gana"
 POD_diablerize.200.option.a.tt.attacker_wins: "[attacker.GetFirstName] me atrapa"
 POD_diablerize.200.option.b: "¡Esconderse!"
 POD_diablerize.200.option.b.tt: "Un duelo de Intriga de esconderse y buscar determinará si puedes escapar del ataque de [attacker.GetFirstNamePossessive]."
 POD_diablerize.200.option.b.desc: "Un concurso de esconderse y buscar"
 POD_diablerize.200.option.b.tt.beast: "#beast ¡La noche será nuestra armadura!#!"
 POD_diablerize.200.option.b.tt.obfuscateadvanced: "¡Tengo Ofuscación avanzada!"
 POD_diablerize.200.option.b.tt.oblivionadvanced: "¡Tengo Olvido avanzado!" 
 POD_diablerize.200.option.b.tt.cloak_of_shadows: "Puedo cubrirme con las sombras."
 POD_diablerize.200.option.b.tt.silence_of_death: "Me muevo con el silencio de la muerte."
 POD_diablerize.200.option.b.tt.unseen_passage: "Mi paso es invisible."
 POD_diablerize.200.option.b.tt.vanish: "Simplemente puedo desvanecerme."
 POD_diablerize.200.option.b.success: "[defender.GetFirstName] gana"
 POD_diablerize.200.option.b.tt.defender_wins: "¡Me escondo!"
 POD_diablerize.200.option.b.failure: "[attacker.GetFirstName] gana"
 POD_diablerize.200.option.b.tt.attacker_wins: "[attacker.GetFirstName] me atrapa."
 POD_diablerize.200.option.c: "¡Entrar!"
 POD_diablerize.200.option.c.tt.beast: "#beast ¡¿Cómo podría [attacker.GetSheHe] atacarnos?! ¡Somos tan maravillosos!#!"
 POD_diablerize.200.option.c.desc: "Un conflicto de personalidad"
 POD_diablerize.200.option.c.tt: "Un duelo de diplomacia determinará si puedes usar la Presencia $pod_discipline$ para lograr que [attacker.GetFirstName] detenga su ataque."
 POD_diablerize.200.option.c.tt.entrancement: "Soy fascinante."
 POD_diablerize.200.option.c.tt.majesty: "¡Soy majestuoso/a!"
 POD_diablerize.200.option.c.success: "[defender.GetFirstName] gana"
 POD_diablerize.200.option.c.tt.defender_wins: "¡Fascino a [attacker.GetFirstName]!"
 POD_diablerize.200.option.c.failure: "[attacker.GetFirstName] gana"
 POD_diablerize.200.option.c.tt.attacker_wins: "[attacker.GetFirstName] es inmune a mis encantos." 
 POD_diablerize.200.option.d: "¡Mesmerizar!"
 POD_diablerize.200.option.d.desc: "Un conflicto de dominación"
 POD_diablerize.200.option.d.tt.beast: "#beast ¡[attacker.GetSheHe|U] obedecerá!#!"
 POD_diablerize.200.option.d.tt: "Un duelo de Administración determinará si puedes usar la $pod_discipline$ de Dominación para ordenar a [attacker.GetFirstName] que detenga su ataque."
 POD_diablerize.200.option.d.tt.mesmerize: "Puedo mesmerizar mentes inferiores."
 POD_diablerize.200.option.d.tt.rationalize: "Puedo hacer que los Esclavos racionalicen mis órdenes como si fueran suyas."
 POD_diablerize.200.option.d.tt.submerged_directive: "Puedo submerge las directrices para convertir a los débiles en mis peones."
 POD_diablerize.200.option.d.tt.terminal_decree: "Puedo emitir un decreto terminal."
 POD_diablerize.200.option.d.success: "[defender.GetFirstName] gana"
 POD_diablerize.200.option.d.tt.defender_wins: "¡Domino a [attacker.GetFirstName]!"
 POD_diablerize.200.option.d.failure: "[attacker.GetFirstName] gana"
 POD_diablerize.200.option.d.tt.attacker_wins: "La voluntad de [attacker.GetFirstNamePossessive] es demasiado fuerte para ser dominada."  
 POD_diablerize.200.option.e: "¡Cambio de Forma!"
 POD_diablerize.200.option.e.tt.beast: "#beast ¡[attacker.GetSheHe] no puede comer lo que no puede sujetar!#!"
 POD_diablerize.200.option.e.tt: "Un duelo de aprendizaje determinará si puedes usar tu $pod_discipline$ para realizar un Cambio de Forma en una forma incorpórea y evadir la trampa de [attacker.GetFirstNamePossessive]."
 POD_diablerize.200.option.f: "¡Atacar!"
 POD_diablerize.200.option.f.tt.beast: "#beast ¡Tomaremos su sangre!#!"
 POD_diablerize.200.option.f.tt: "Un duelo de Destreza determinará si [attacker.GetFirstName] o tú ganáis en combate."

# Flight Martial Duel Result
#250 notify atacker
 #POD_diablerize.250.t: "Diablerie: Flight!"
 #POD_diablerize.250.desc.success: "[defender.GetFirstName] runs away from me.  No matter how hard I try, I can not catch up."
 #POD_diablerize.250.desc.failure: "[defender.GetFirstName] tried to run away, but they were not fast enough. Now to cross the remaining distance and hunt [defender.GetHerHim] down."
 #POD_diablerize.250.option.a.success: "Foiled!"
 #POD_diablerize.250.option.a.failure: "Attack!"
 
#275 Martial Duel Result notify defender
 POD_diablerize.275.t: "¡Huir de la lucha!"
 POD_diablerize.275.desc.success: "He logrado escapar de [attacker.GetFirstName]. [attacker.GetSheHe|U] se ha quedado muy atrás, fuera de mi vista."
 POD_diablerize.275.desc.failure: "He corrido, pero no lo suficientemente rápido. [attacker.GetFirstName] me ha atrapado."
 POD_diablerize.275.option.a.success: "Debo mantenerme lejos de [attacker.GetHerHim]."
 POD_diablerize.275.option.a.failure: "¡Es su vida o la mía!"

# Hide Duel
#300 hide duel notify atacker
 POD_diablerize.300.t: "Diablerie: ¡Esconderse!"
 POD_diablerize.300.desc.success: "[defender.GetFirstName] ha logrado esconderse de mí rápidamente. No puedo encontrar[ROOT.Char.Custom('ES_AlAla')] en ninguna parte."
 POD_diablerize.300.desc.failure: "[defender.GetFirstName] intentaba esconderse de mí. Eso no va a funcionar. Puedo ver dónde está [defender.GetSheHe]."
 POD_diablerize.300.option.a.success: "¡Frustrado!"
 POD_diablerize.300.option.a.failure: "¡Atacar!"
 
#325 hide duel notify defender
 POD_diablerize.325.t: "¡Esconderse de la lucha!"
 POD_diablerize.325.desc.success: "Ha estado cerca. He logrado esconderme de [attacker.GetFirstName]. Ahora, si tan solo puedo moverme con suficiente sigilo sin atraer la atención, lograré alejarme de [attacker.GetHerHim]."
 POD_diablerize.325.desc.failure: "Intenté esconderme, pero [attacker.GetFirstName] me encontró."
 POD_diablerize.325.option.a.success: "Necesito cubrir mis huellas."
 POD_diablerize.325.option.a.failure: "¡Es su vida o la mía!"
 
# Negotiate Presence Duel
#350 entrance duel notify atacker
 POD_diablerize.350.t: "Diablerie: ¡Enajenación!"
 POD_diablerize.350.desc.success: "Al mirar a [defender.GetHerHis] ojos, me asombra lo maravilloso[ROOT.Char.Custom('ES_XA')] que es [defender.GetFirstName]. Realmente me agrada. Jamás podría hacer nada para herir[ROOT.Char.Custom('ES_AlAla')] [defender.GetHerHim]. ¿Por qué estoy aquí, si no es para deleitarme en la gloria de [defender.GetHerHis]?"
 POD_diablerize.350.desc.failure: "[defender.GetFirstName] intentó seducirme, pero mi mente no es tan débil como para caer ante un truco tan burdo. ¡Tendré su sangre!"
 POD_diablerize.350.option.a.success: "Te quiero muchísimo."
 POD_diablerize.350.option.a.success.tt: "Mientras esté enajenad[ROOT.Char.Custom('ES_OA')] por [defender.GetFirstName], no podré intentar [Glossary('Diablerize','game_concept_diablerie_desc')] a [defender.GetHerHim] de nuevo."
 POD_diablerize.350.option.a.failure: "Tus encantos no me impresionan."

#375 entrance duel notify defender
 POD_diablerize.375.t: "Enajenar al enemigo"
 POD_diablerize.375.desc.success: "Con mi $pod_discipline$ de Presencia, he enajenado a [attacker.GetFirstName]. Mientras esté seducid[ROOT.Char.Custom('ES_OA')], [attacker.GetSheHe] no es una amenaza para mí."
 POD_diablerize.375.desc.failure: "Intento captar la mirada de [attacker.GetFirstName] y irradiar mi Presencia hacia [attacker.GetHerHim] para volverle pasiv[ROOT.Char.Custom('ES_OA')]. Con la velocidad y la ira con la que [attacker.GetSheHe] se aproxima a mí, parece que he fallado."
 POD_diablerize.375.option.a.success: "Sí, así es. Yo soy a quien adoras."
 POD_diablerize.375.option.a.success.tt: "Mientras [attacker.GetFirstName] esté enajenad[ROOT.Char.Custom('ES_OA')] por mí, [attacker.GetSheHe] no podrá intentar [Glossary('Diablerize','game_concept_diablerie_desc')] a mí de nuevo."
 POD_diablerize.375.option.a.failure: "¡Por qué [attacker.GetSheHe] no me ama!"

# Dominate Duel

#425 dominate duel notify defender 
 POD_diablerize.425.t: "Hipnotizar al enemigo"
 POD_diablerize.425.desc.success: "Con mi $pod_discipline$ de Dominación, doblego su voluntad como un alfarero dobla la arcilla. Primero obligo a [attacker.GetHerHim] a que diga «¡Detente!». Ahora, unas órdenes más interesantes."
 POD_diablerize.425.desc.failure: "Intento alcanzar la mente de [attacker.GetHerHis]. Es como una fortaleza que no puedo penetrar. [attacker.GetSheHe|U] es sordo[ROOT.Char.Custom('ES_OA')] a mis repetidas órdenes."
 POD_diablerize.425.option.a: "Abandona este lugar. No regreses."
 POD_diablerize.425.option.a.tt: "El conjura de $pod_diablerie$ de [attacker.GetFirstNamePossessive] contra ti termina."
 POD_diablerize.425.option.b: "Me harás un favor importante."
 POD_diablerize.425.option.b.tt: "Conseguiré un Anzuelo sobre [attacker.GetFirstName]" 
 POD_diablerize.425.option.e: "Ahora eres mi prisionero." 
 POD_diablerize.425.option.e.tt: "Imprisonaré a [attacker.GetFirstName]."
 POD_diablerize.425.option.c: "Ve y contempla el amanecer." 
 POD_diablerize.425.option.c.sunrise: "Ve y contempla el amanecer."
 POD_diablerize.425.option.c.behead: "Al bloque, prisionero. Con calma y sin prisas."
 POD_diablerize.425.option.c.fire: "Lánzate a la pira funeraria."
 POD_diablerize.425.option.c.tt: "[attacker.GetFirstName] se suicidará y sufrirá la Muerte Definitiva."
 POD_diablerize.425.option.d: "¡Por qué [defender.GetSheHe] no me obedece!"

#400 dominate duel notify atacker
 POD_diablerize.400.t: "Diablerie: ¡Dominación!"
 POD_diablerize.400.desc.success: "[defender.GetFirstName] entra en mi mente. No puedo resistirme a su voluntad. He sido completamente dominad[ROOT.Char.Custom('ES_OA')]. [defender.GetSheHe|U] me ordena: «¡Detente!»."
 POD_diablerize.400.desc.leave: "Entonces [defender.GetFirstName] ordena: «Abandona este lugar y no regreses»." 
 POD_diablerize.400.desc.favor: "Entonces [defender.GetFirstName] ordena: «Me harás un favor importante»." 
 POD_diablerize.400.desc.favor.tt: "[defender.GetFirstName] te consigue un anzuelo."
 POD_diablerize.400.desc.die: "Entonces [defender.GetFirstName] dicta un decreto terminal: «Ve y contempla el amanecer»." 
 POD_diablerize.400.desc.sunrise: "Entonces [defender.GetFirstName] dicta un decreto terminal: «Ve y contempla el amanecer»." 
 POD_diablerize.400.desc.behead: "Entonces [defender.GetFirstName] dicta un decreto terminal: «Al bloque, prisionero. Con calma y sin prisas»." 
 POD_diablerize.400.desc.fire: "Entonces [defender.GetFirstName] dicta un decreto terminal: «Lánzate a la pira funeraria»." 
 POD_diablerize.400.desc.prison: "Entonces [defender.GetFirstName] te ordena que vayas a una celda: «Ahora eres mi prisionero»." 
 POD_diablerize.400.desc.failure: "Mientras me lanzo contra [defender.GetFirstName], [defender.GetSheHe] me mira intensamente y con voz autoritaria me ordena: «¡Detente!». ¡[defender.GetSheHe|U] no tiene poder sobre mí!"
 POD_diablerize.400.option.a.success: "Tu deseo es mi orden."
 POD_diablerize.400.option.d.failure: "¡Fuera de mi mente!"

# Learning Shapeshift Duel
#450 shapeshift duel notify atacker
 POD_diablerize.450.t: "Diablerie: ¡Cambio de Forma!"
 POD_diablerize.450.desc.success: "Ante mis ojos, [defender.GetFirstName] se transforma místicamente en una forma intangible. No puedo atrapar[ROOT.Char.Custom('ES_LoLa')]. Ni siquiera puedo tocar[ROOT.Char.Custom('ES_LoLa')]. Y así, sin más, [defender.GetSheHe] ha desaparecido."
 POD_diablerize.450.desc.failure: "[defender.GetFirstName] comienza a transformarse. Su cuerpo empieza a sufrir un Cambio de Forma. ¡[defender.GetSheHe] no es lo suficientemente rápida para escapar de mí!"
 POD_diablerize.450.option.a.success: "¡Atacar!"
 POD_diablerize.450.option.a.failure: "¡Frustrado!"
 
#475 shapeshift duel notify defender
 POD_diablerize.475.t: "Forma cambiante"
 POD_diablerize.475.desc.success: "Me concentro en mi $pod_discipline$ y me transformo en una forma intangible. Se completa antes de que [attacker.GetFirstName] pueda alcanzarme. Luego escapo con facilidad."
 POD_diablerize.475.desc.failure: "Comienzo el proceso para transformarme en una forma intangible. No puedo hacerlo lo suficientemente rápido antes de que [attacker.GetFirstName] se abalance sobre mí."
 POD_diablerize.475.option.a.success: "Este no será el último truco que me salve."
 POD_diablerize.475.option.a.failure: "¡Carne contra carne!"
 
# Prowess Duel, Last Chance to turn back
 POD_diablerize.500.t: "Diablerie: La batalla final"
 POD_diablerize.500.desc: "Se acabó la huida, se acabaron los escondites y los juegos mentales. [defender.GetFirstName] no puede escapar de mí. Es hora del conflicto final."
 POD_diablerize.500.option.a: "¡Ataca a [defender.GetHerHim]!"
 POD_diablerize.500.option.a.tt.beast: "#beast ¡Sí! ¡Toda su sangre será mía!... Quiero decir, nuestra. ¡Toda su sangre será nuestra!#!"
 POD_diablerize.500.option.a.tt.attacker_wins: "¡[attacker.GetFirstName] gana!"
 POD_diablerize.500.option.a.tt.defender_wins: "¡[defender.GetFirstName] gana!"
 POD_diablerize.500.option.a.desc: "Una batalla de proeza"
 POD_diablerize.500.option.a.success: "¡Victoria!"
 POD_diablerize.500.option.a.failure: "¡Derrota!"
 POD_diablerize.500.option.b: "Demasiado arriesgado, abandono este conjura."

# Prowess Duel, Attacker Backs down
 POD_diablerize.510.t: "Retirada"
 POD_diablerize.510.desc: "[attacker.GetFirstName] no se compromete con el ataque y se retira."
 POD_diablerize.510.option.a: "Qué alivio"

#515 notify [Glossary('Diablerist','game_concept_diablerie_desc')] of prowess duel result
 POD_diablerize.515.t: "Diablerie: ¡El botín para el vencedor!"
 POD_diablerize.515.desc.success: "La batalla es brutal pero también rápida. Soy victorioso y [defender.GetFirstName] yace a mis pies."
 POD_diablerize.515.desc.failure: "Pensé que estaba preparado, pero la Destreza de combate de [defender.GetFirstNamePossessive] es demasiado para superarla. He sido derrotado."
 POD_diablerize.515.option.a.success: "¿Y ahora qué hago con mi premio?"
 POD_diablerize.515.option.a.failure: "Empiezo a caer en el $pod_torpor$, preguntándome cuál será mi destino." 

#525 notify defender of prowess duel result, pick fate of defeated [Glossary('Diablerist','game_concept_diablerie_desc')]
 POD_diablerize.525.t: "¡La lucha!"
 POD_diablerize.525.desc.success: "La Destreza de combate de [attacker.GetFirstNamePossessive] es demasiado para superarla. He sido derrotado."
 POD_diablerize.525.desc.failure: "La batalla es brutal pero también rápida. Soy victorioso y [attacker.GetFirstName] yace a mis pies."
 POD_diablerize.525.option.a.failure: "Destruye a [attacker.GetFirstName]. Es la Muerte Definitiva para [attacker.GetHerHim]." #Kill
 POD_diablerize.525.option.b.failure: "[attacker.GetSheHe] es ahora mi prisionero/a." #Stake & Imprison
 POD_diablerize.525.option.c.failure: "Simplemente me marcharé, la victoria es lo suficientemente dulce." #Release
 POD_diablerize.525.option.d.failure: "¡Tendré la sangre de su corazón!" #Diaberlize! 
 POD_diablerize.525.option.e.success: "Empiezo a caer en el $pod_torpor$, preguntándome cuál será mi destino."   

#550 defeated attacker notified of victorious defender decision
 POD_diablerize.550.t: "Diablerie: Derrota"
 POD_diablerize.550.desc.destruction: "He sido destruido/a por [defender.GetFirstName]."
 POD_diablerize.550.desc.imprisonment: "He sido encarcelado/a por [defender.GetFirstName]."
 POD_diablerize.550.desc.release: "[defender.GetFirstName] me dejó ir. No lo entiendo..."
 POD_diablerize.550.desc.diablerie: "Los colmillos de [defender.GetFirstName] se hunden en mi carne. [defender.GetSheHe] bebe toda mi sangre. Yo iba a ser el cazador, pero yo era la presa."
 POD_diablerize.550.option.a: "Así es como termina."

# Getting to the Yum Yum!
 POD_diablerize.600.t: "¡Diablerie!"
 POD_diablerize.600.desc: "No solo matar, sino devorar el alma de otro ser, se encuentra entre las acciones más atroces posibles. La mayoría de los Vástagos lo consideran el peor de los crímenes. Sin embargo, no hay nada que la Bestia desee más.\n\nFinalmente, [victim.GetFirstName] está en mis manos. ¿Drenaré a [victim.GetHerHis] hasta el núcleo de su ser? ¿Beberé la sangre de su corazón? ¿Me tomaré todo lo que es [victim.GetHerHim]?"
 POD_diablerize.600.option.a: "¡Devora el alma de [victim.GetTitledFirstNamePossessive]!"
 POD_diablerize.600.option.a.tt: "¡[victim.GetTitledFirstName] ha sido destruido/a!"  
 POD_diablerize.600.option.a.tt.beast: "#beast ¡SÍ! ¡HAZLO!#!"   
 POD_diablerize.600.option.b: "No [Glossary('Diablerize','game_concept_diablerie_desc')] a [victim.GetFirstName]."
 POD_diablerize.600.option.b.tt.beast: "#beast ¡No los dejes ir! ¡[victim.GetSheHe] no merece la sangre! ¡Nosotros sí!#!"    
 POD_diablerize.600.option.c: "Solo mátalos, la Diablerie es demasiado peligrosa."
 POD_diablerize.600.option.c.tt.beast: "Un simple y normal asesinato, sin riesgo para tu alma con esa opción. Pero tampoco hay aumento de poder."    
 
 # Attacker decides not to [Glossary('Diablerize','game_concept_diablerie_desc')]
 POD_diablerize.650.t: "¿Misericordia?"
 POD_diablerize.650.desc: "Fui derrotado/a. Estaba seguro/a de que [attacker.GetFirstName] me destruiría. Curiosamente, [attacker.GetSheHe] simplemente se marchó."
 POD_diablerize.650.option.a: "¿Fue algún último retazo de Humanidad?"
 
 POD_diablerize.700.t: "¡Amaranto!"
 POD_diablerize.700.option.a: "."
 POD_diablerize.700.desc: "Devorar el alma de [victim.GetTitledFirstNamePossessive]" 
  
 POD_diablerize.800.t: "El Alma Inconquistada"
 #POD_diablerize.800.desc: "I feel [unconquered_soul.GetFirstName] inside my mind, struggling to take control over my body! What have I done?!?"  
 #POD_diablerize.800.option.a: "Resist! I will not be defeated!"
 #POD_diablerize.800.option.b: "Give in, and let [unconquered_soul.GetFirstName] take over." 
 # 
 #POD_diablerize.810.t: "Signs of an [unconquered_soul|E]"
 #POD_diablerize.810.desc: "One of your servants pointed out that you changed some of your habits recently, something that doesn't happen frequently to your kind. This reminds you of the rumors about the terrible consequences of $pod_diablerie$ and its potential toll on your very soul.\nCould it be that your latest victim is trying to fight back? A worrying prospect indeed..."  
 #POD_diablerize.810.option.a.tt: "Something very bad will happen soon:"
 #POD_diablerize.810.option.a: "Something is very very wrong..."
 unconquered_soul_warning_tooltip: "@alert_icon! #alert_trial #high $VALUE|0$%#! de probabilidad de ¡[unconquered_soul|E]!#!"

 POD_diablerize.808.tt: "Todos los edificios en [targetprovince.GetName] son eliminados."
 POD_diablerize.801.desc: "Otra noche desastrosa en la corte. Esto ha sido algo recurrente durante unos meses con tus vasallos afirmando que has cambiado para peor, tomando decisiones precipitadas en un momento y gritando airadamente que no lo hiciste al siguiente. Es como si hubiera dos personalidades en conflicto gobernando en tu lugar y compitiendo por el poder.\n¿Has sido maldecido/a? ¿Afectado/a por un poder extraño? Sea cual sea el caso, está muy claro que tu corte apenas está dispuesta a visitarte, ya que parece que no estás en condiciones de gobernar o, quizás más importante, no estás en condiciones de recordar cuando te ignoraron."   
 POD_diablerize.801.option.a: "¡Pagarán por su insolencia!"
 POD_diablerize.801.option.b: "¿Simplemente estoy... cambiando?" 

 generic_legitimacy_debuff_modifier: "Legitimidad cuestionada"
 generic_legitimacy_debuff_modifier_desc: "Tu derecho a gobernar es seriamente debatido." 
 POD_diablerize.802.desc: "¿Se han reído de ti?\nLamentablemente, este tipo de cuestionamientos ha estado muy presente en tu mente últimamente. Desde hace un tiempo, parece que has perdido tu agudeza o, más precisamente, una parte de ti la ha perdido. Cada decisión decisiva que tomas se ve socavada por dudas y un cambio de parecer poco después. Francamente, ya no gobiernas realmente, sino que dependes de tu autoridad pasada y tu corte parece haberse dado cuenta lentamente.\nTal debilidad puede ser letal en el mundo de los malditos, pero no estás seguro/a de cuál es la causa raíz. Es como si hubiera alguien más dentro de tu cabeza, contradiciendo constantemente todo lo que haces..."   
 POD_diablerize.802.option.a: "¡Sigo siendo su Señor!"
 
 POD_diablerize.803.desc: "¿Por qué hay un cadáver muriendo lentamente a tus pies? No puedes recordar qué pasó pero, a juzgar por la sangre en tus manos, es probable que tú seas el culpable. Especialmente porque parece que tu corte no se sorprende por tu comportamiento.\nTales sucesos erráticos han estado ocurriendo mucho últimamente, como si alguien más estuviera tomando repentinamente el control de tu cuerpo y ejecutando sus oscuros deseos cada vez que puede. ¿Podría ser... no.\nEn cualquier caso, tienes un lío que limpiar, literal y figuradamente."   
 POD_diablerize.803.option.a: "¡Todos viven y mueren cuando a mí me plazca!"
 unconquered_soul_in_progress_tt: "#N Tu crimen de $pod_diablerie$ está volviendo para atormentarte...#!"

 POD_diablerize.804.desc: "Algo va muy mal contigo. Lo has estado sospechando desde hace tiempo, pero ya no queda duda en tu mente. Tu comportamiento ha sido errático, por decir lo menos, pasando de insultar a tus vasallos a concederles favores (¡a veces ambos al mismo tiempo!) aparentemente sin razón ni sentido.\nEs como si alguien más estuviera tomando el control de tus pensamientos y siguiendo su propia agenda, muy distinta a la tuya, resultando en estos lapsos de juicio.\nTienes un creciente sentimiento de temor de que podrías haber subestimado la Fuerza de Voluntad de [unconquered_soul.GetFirstName]..."   
 POD_diablerize.804.option.a: "¡Ganaré ahora como gané entonces!"

 POD_diablerize.805.desc: "La situación empeora.\nTe has sorprendido rompiendo tu propio código moral una y otra vez, aparentemente sin siquiera pensarlo. Quizás incluso peor, has estado actuando de forma distinta en su conjunto, como si estuvieras siguiendo un nuevo conjunto de reglas. Ha quedado absolutamente claro que tu propio ser está bajo el ataque del alma vengativa de [unconquered_soul.GetFirstName], que intenta asegurarse de que sigas el camino «adecuado»."   
 POD_diablerize.805.option.a: "¡No me dejaré engañar tan fácilmente!"
 
 complete_same_faith_generic_debuff_modifier: "Blasfemo creativo"
 complete_same_faith_generic_debuff_modifier_desc: "De algún modo, siempre encuentras nuevas formas de molestar o insultar a tus hermanos." 
 POD_diablerize.806.desc: "Todo está mal.\nA pesar de tus mejores esfuerzos, parece que, sin quererlo, estás haciendo todo lo posible por quebrantar los preceptos más sagrados de tu fe de la forma más pública posible.\nTe ha costado tiempo darte cuenta, pero ahora está claro que la influencia maliciosa de [unconquered_soul.GetFirstName] está detrás de esto, tomando el control de tus pensamientos y acciones en los momentos más inoportunos, intentando (y lográndolo con gran éxito) hacer que parezcas un blasfemo impenitente. Parece que la batalla por tu alma aún no ha terminado."   
 POD_diablerize.806.option.a: "Debo enmendar mis errores."

 POD_diablerize.807.desc: "Durante un tiempo, has creído que la influencia de [unconquered_soul.GetFirstName] sobre tu mente se había disipado, ya que parecía que tenías el control de tus acciones en la corte. La verdad es, lamentablemente, más perniciosa.\nMientras centrabas tus esfuerzos en tus intereses más cercanos, parece que tu enemigo ha estado retorciendo tus órdenes y erosionando tu influencia en tu señorío. Estructuras de poder cuidadosamente diseñadas siguiendo tu código moral se han desmoronado en esta región, aparentemente debido a tus propias órdenes, pero muy probablemente a aquellas dadas mientras tu indeseado pasajero espiritual tenía el control."   
 POD_diablerize.807.option.a: "Puede rectificarse."
   
 POD_diablerize.808.t: "El Alma Inconquistada: Final"   
 POD_diablerize.808.desc: "[unconquered_soul.GetFirstName] lucha por el control de tu cuerpo más que nunca. Su interferencia ha desorganizado completamente tu ejército; las órdenes contradictorias que emanan de «ambos» han dejado a tus campeones confundidos y tu influencia sobre las milicias mortales locales hecha pedazos.\nTiene que parar... de una forma u otra. Todavía hay una gran posibilidad de que puedas resistir los cambios más... permanentes y salir con tu sentido de la identidad casi intacto. O tal vez la batalla ya haya desgastado tu Fuerza de Voluntad lo suficiente como para que estés listo para renacer en el cuerpo de aquel lo suficientemente necio como para pensar que te había matado.\nLa única pregunta real sigue siendo la misma: ¿quién eres?"   
 POD_diablerize.808.option.a: "¡Lárgate! ¡Ya te derroté!"
 POD_diablerize.808.option.b: "#italic ¡He renacido! #!"

 POD_diablerize.809.desc: "[unconquered_soul.GetFirstName] lucha por el control de tu cuerpo más que nunca. Su interferencia te ha hecho cometer algunos errores críticos en tu gestión nocturna, haciendo que parezcas un necio mientras alertas a las autoridades mortales de tu presencia.\nTiene que parar... de una forma u otra. Todavía hay una gran posibilidad de que puedas resistir los cambios más... permanentes y salir con tu sentido de la identidad casi intacto. O tal vez la batalla ya haya desgastado tu Fuerza de Voluntad lo suficiente como para que estés listo para renacer en el cuerpo de aquel lo suficientemente necio como para pensar que te había matado.\nLa única pregunta real sigue siendo la misma: ¿quién eres?"   
 POD_diablerize.810.desc: "[unconquered_soul.GetFirstName] lucha por el control de tu cuerpo más que nunca. Su interferencia ha debilitado gravemente tu influencia sobre partes de tu señorío, haciendo que pierdas algo de oro valioso que invertiste allí.\nTiene que parar... de una forma u otra. Todavía hay una gran posibilidad de que puedas resistir los cambios más... permanentes y salir con tu sentido de la identidad casi intacto. Or tal vez la batalla ya haya desgastado tu Fuerza de Voluntad lo suficiente como para que estés listo para renacer en el cuerpo de aquel lo suficientemente necio como para pensar que te había matado.\nLa única pregunta real sigue siendo la misma: ¿quién eres?"   
      
 POD_diablerize.4000.t: "¡Conjura de Diablerie frustrada!"
 POD_diablerize.4000.desc: "Por algún giro del destino, mi conjura para [Glossary('Diablerize','game_concept_diablerie_desc')] a [defender.GetFirstName] ha fallado."  
 POD_diablerize.4000.option.a: "¡Maldición! ¡Una noche más, [defender.GetFirstName], tu sangre será mía!"
 
 POD_diablerize.250.option.a.tt.defender_wins: "¡El defensor escapó!"
 POD_diablerize.250.option.a.failure: "¡He atrapado a esta rata que huía!"
 POD_diablerize.250.t: "Diablerie: ¡Huida!"
 POD_diablerize.250.desc: "¡[defender.GetFirstName] huye de mí! Tengo que hacer todo lo posible por alcanzarle, o toda esta conjura se desmoronará. ¡Cobarde maldito!"
 POD_diablerize.250.option.a: "¡Que comience la persecución!"
 POD_diablerize.250.option.b: "No merece la pena el esfuerzo en este punto."
 POD_diablerize.250.option.a.tt.attacker_wins: "Ya no tiene dónde esconderse..."
 POD_diablerize.250.option.a.success: "...¡Demasiado rápido!"
 POD_diablerize.250.option.b.tt.beast: "#beast ¡No dejes que escapen! ¡La sangre llama!#!"
 POD_diablerize.250.option.a.toast: "¡Escapó!"

 POD_diablerize.1000.t: "Diablerie: El Duelo"
 POD_diablerize.1000.desc: "Se acabaron los juegos, es hora de terminar con esto de una vez por todas. Solo uno de vosotros saldrá vivo de esto.\nUno busca el poder mientras el otro busca proteger su alma, pero no hay causas dignas en el Mundo de Tinieblas. El más fuerte, o el más astuto, ganará."  
 POD_diablerize.1000.option.a: "Ya no hay vuelta atrás."
  
 POD_diablerize.601.t: "Diablerie: ¡Victoria!"
 POD_diablerize.601.desc: "Has derrotado al necio vampiro que intentó devorar tu propia alma. El castigo debe estar a la altura de la gravedad de este intento."  
 POD_diablerize.601.option.a: "Seré misericordioso y te mataré rápidamente."
  
 POD_diablerize.251.t: "Diablerie: ¡Esconderse!"
 POD_diablerize.251.desc: "¡[defender.GetFirstName] intenta escapar de mí! Probablemente se esconda en algún lugar cercano, o use sus poderes para confundir mis sentidos... Debo estar atento a cada pequeño detalle para atrapar a este cobarde."
 POD_diablerize.251.option.a: "¡Que comience la persecución!"
 POD_diablerize.251.option.b: "No merece la pena el esfuerzo en este punto."
 POD_diablerize.251.option.a.tt.attacker_wins: "¡Has encontrado al cobarde!"
 POD_diablerize.251.option.a.success: "Ya no tiene dónde esconderse..."
 POD_diablerize.251.option.a.desc: "El gato y el ratón"
 POD_diablerize.251.option.a.failure: "Desaparecido..."
 POD_diablerize.251.option.a.tt.defender_wins: "¡El defensor escapó!"

 POD_diablerize.252.t: "Diablerie: ¡Enajenación!"
 POD_diablerize.252.desc: "¡[defender.GetFirstName] intenta usar sus poderosos poderes de Presencia para hechizarme! Debo resistir, o no podré hacer nada. Debo razonar contra este seductor, perfecto y mortal encanto... ¿o debería? [AddTextIf( PlayerHasBeast, '\n#beast ¡Piensa en la sangre, necio, nada más importa!#!' )]"
 POD_diablerize.252.option.a: "¡Mi voluntad es mía!"
 POD_diablerize.252.option.a.tt.attacker_wins: "¡Hora de terminar con esto!"
 POD_diablerize.252.option.a.success: "¡Has fallado!"
 POD_diablerize.252.option.a.desc: "Resistencia a la perfección."
 POD_diablerize.252.option.a.failure: "Qué hermoso..."
 POD_diablerize.252.option.a.tt.defender_wins: "¿Por qué resistirse?"

 POD_diablerize.253.t: "Diablerie: ¡Racionalizar!"
 POD_diablerize.253.desc: "¡[defender.GetFirstName] intenta usar sus poderosos poderes de Dominación para controlarme! Debo resistir, o no podré hacer nada. Debo conjurar toda mi Fuerza de Voluntad para resistir esta intrusión en mi mente. No quiero imaginar lo que pasará si pierdo...[AddTextIf( PlayerHasBeast, '\n#beast ¡Resiste, necio! ¡Ten algo de columna vertebral mental!#!' )]"
 POD_diablerize.253.option.a: "¡Mi voluntad es mía!"
 POD_diablerize.253.option.a.tt.attacker_wins: "¡Hora de terminar con esto!"
 POD_diablerize.253.option.a.success: "¡Has fallado!"
 POD_diablerize.253.option.a.desc: "Choque de voluntades"
 POD_diablerize.253.option.a.failure: "Vivo para servir."
 POD_diablerize.253.option.a.tt.defender_wins: "¿Cuál es su deseo?"

 POD_diablerize.254.t: "Diablerie: ¡Cambio de Forma!"
 POD_diablerize.254.desc: "¡[defender.GetFirstName] intenta escapar de mí! Usando sus considerables poderes de Cambio de Forma, ha logrado evitarme hasta ahora. Tendré que usar el entorno y ser astuto para encontrar la manera de acorralar a este cobarde."
 POD_diablerize.254.option.a: "¡Te atraparé!"
 POD_diablerize.254.option.b: "No merece la pena el esfuerzo en este punto."
 POD_diablerize.254.option.a.tt.attacker_wins: "¡Has atrapado a tu presa!"
 POD_diablerize.254.option.a.success: "¡Te tengo!"
 POD_diablerize.254.option.a.desc: "Comida escurridiza"
 POD_diablerize.254.option.a.failure: "Desaparecido..."
 POD_diablerize.254.option.a.tt.defender_wins: "¡El defensor escapó!"
 POD_diablerize.254.option.a.toast: "¡Escapó!"

 POD_diablerize.200.option.g: "¡Soltad a los perros!"
 POD_diablerize.200.option.g.tt.beast: "#beast ¡Hora de la merienda, chicos!#!"
 POD_diablerize.200.option.g.tt: "Un duelo marcial determinará si [attacker.GetFirstName] o tú ganáis en combate."

 POD_diablerize.255.t: "Diablerie: ¡Animalismo!"
 POD_diablerize.255.desc: "[defender.GetFirstName] no está solo. Una horda de feroces Bestias se dirige hacia mí, intentando proteger a su amo. Tendré que abrirme paso a zarpazos si quiero llegar a mi presa."
 POD_diablerize.255.option.a: "¡Quítate de mi camino!"
 POD_diablerize.255.option.b: "...¡Huye!"
 POD_diablerize.255.option.a.tt.attacker_wins: "¡Has atrapado a tu presa!"
 POD_diablerize.255.option.a.success: "¡No habrá más amigos peludos para ti!"
 POD_diablerize.255.option.a.desc: "Comida escurridiza"
 POD_diablerize.255.option.a.failure: "¡Aléjate de mí!"
 POD_diablerize.255.option.a.tt.defender_wins: "¡Detenedlos! ¡Detenedlos!"
 POD_diablerize.255.option.b.tt.beast: "#beast ¡Cobarde! ¡Quédate y lucha!#!"

 POD_diablerize.200.option.h: "¡Quémalos vivos!"
 POD_diablerize.200.option.h.tt.beast: "#beast ¡Fuego! ¡Para ellos, no para nosotros!#!"
 POD_diablerize.200.option.h.tt: "Un duelo de aprendizaje determinará si [attacker.GetFirstName] o tú ganáis en combate."

 POD_diablerize.256.t: "Diablerie: ¡Hechicería de Sangre!"
 POD_diablerize.256.desc: "[defender.GetFirstName] no estaba desprevenido. Una serie de Rituales y poderosos Hechizos protegían el [defender.Custom('PODDomicile')] y tendré que tener mucho cuidado de no caer en alguna trampa... Esto podría ponerse feo muy rápido."
 POD_diablerize.256.option.a: "¡Lo lograré!"
 POD_diablerize.256.option.b: "...¡Huye!"
 POD_diablerize.256.option.a.tt.attacker_wins: "¡Has atrapado a tu presa!"
 POD_diablerize.256.option.a.success: "¡Ahora somos tú y yo!"
 POD_diablerize.256.option.a.desc: "Trampas por doquier"
 POD_diablerize.256.option.a.failure: "¿Qué es esto...?"
 POD_diablerize.256.option.a.tt.defender_wins: "#beast ¡ME QUEMA!#!"
 POD_diablerize.256.option.b.tt.beast: "#beast ¡Cobarde! ¡Ve a por ellos!#!"
    
 POD_diablerize.602.t: "Diablerie: Alguien ha desaparecido"
 POD_diablerize.602.desc: "Han pasado varios días desde que hiciste desaparecer a un Morador de tu [ROOT.Char.Custom('PODDomicile')] (al devorar su propia alma) y tu corte está llena de rumores respecto a esta «persona desaparecida». Aunque has hecho todo lo posible por calmar (o desviar) sus preocupaciones hasta ahora, los rumores no cesan y cada vez más personas te lanzan miradas furtivas, quizás intentando detectar alguna señal reveladora que pruebe sus sospechas..."
 POD_diablerize.602.option.a: "¡Está bien! ¡Lo hice!"
 POD_diablerize.602.option.b: "¡Es hora de desviar la atención con más fuerza!"
 POD_diablerize.602.option.c: "El próximo que hable de estos rumores visitará la mazmorra"
 
 
 