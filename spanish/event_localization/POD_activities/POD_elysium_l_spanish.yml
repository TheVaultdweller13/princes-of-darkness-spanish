l_spanish:

 host_elysium_decision: "Organizar el Élitium"
 host_elysium_decision_tooltip: "Se celebrará un Élitium, seguido de una Reunión del Consejo"
 host_elysium_decision_opening_desc: "Tu corte asistirá al Élitium esta noche; después, consultarás con tu consejo sobre asuntos actuales. Si son lo suficientemente hábiles, sus consejos podrían ser útiles."
 elysium_decision_effect_tooltip: "Se celebrará un Élitium, luego tu consejo te presentará varios planes dependiendo de su nivel de habilidad"
 host_elysium_decision_confirm: "Comenzar el Élitium"
 host_elysium_decision_desc_shy: "Como eres tímido, esta actividad puede resultar estresante"
 ignored_my_plan_opinion: "Ignoró mis consejos"
 busy_chancellor_modifier: "Diligente $councillor_chancellor_vampire$"
 busy_chancellor_modifier_desc: "Tu chambelán está ocupado alabándote por todo tu dominio"
 marshal_elysium_levies_modifier: "Población controlada"
 marshal_elysium_levies_modifier_desc: "Tu Sheriff tiene un fuerte control sobre esta zona, asegurándose de que se sienta tu autoridad"
 capital_reined_in_modifier: "Inversiones sangrientas"
 capital_reined_in_modifier_desc: "Al apoyar a las personas adecuadas, estás aumentando tu influencia en esta región"
 spymaster_elysium_scheme_modifier: "Fuentes de $councillor_spymaster_vampire$"
 spymaster_elysium_scheme_modifier_desc: "Tu Azote está utilizando una red de fuentes y contactos muy eficiente en este momento"
 cheap_elysium_opinion: "Élitium cutre"
 roaming_elysium_modifier: "Élitium errante"
 roaming_elysium_modifier_desc: "Estás viajando por tus tierras, lo que dificulta que te atrapen"



 POD_elysium_events.1.t: "La Reunión del Consejo"
 POD_elysium_events.1.desc: "Se ha programado una reunión del consejo para esta noche. Un suceso clásico en el mundo vampírico; este es el momento en que tus consejeros más cercanos podrán decir lo que piensan sobre diversos asuntos y cómo abordarlos. Como su Señor, obviamente dependerá de ti si aceptas sus sugerencias o no."
 POD_elysium_events.1.option.a: "Empecemos"
 POD_elysium_events.1.option.b: "Esta noche no"
 POD_elysium_events.1.option.meeting: "Cuanto más hábil sea tu consejo, mejor será el resultado. No esperes nada bueno si son mediocres en su trabajo."

 POD_elysium_events.100.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]: Un plan mediocre"
 POD_elysium_events.100.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName|l] propone un plan para ganarse el favor de algún gobernante cercano mediante halagos, regalos y demás. Aunque es una perspectiva inofensiva, el coste en oro de tal empresa parece bastante alto para un resultado poco efectivo. Aun así, tienes que elegir."
 POD_elysium_events.100.option.a: "Espero que valga la pena..."
 POD_elysium_events.100.option.b: "¡No vale la pena!"

 POD_elysium_events.101.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]: Un plan mediocre"
 POD_elysium_events.101.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName|l] propone un plan para ganarse el favor de algún gobernante cercano con halagos, regalos y demás. La mayor parte del trabajo ya ha sido realizado por tu consejero y solo tienes que pagar el regalo en sí. Si la idea te interesa, obviamente."
 POD_elysium_events.101.option.a: "Espero que valga la pena..."
 POD_elysium_events.101.option.b: "¡No vale la pena!"

 POD_elysium_events.102.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]: Un buen plan"
 POD_elysium_events.102.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName|l] propone un plan para ganarse el favor de algún gobernante cercano con halagos, regalos y demás. En realidad, ya es un trato hecho, puesto que tu hábil consejero ha realizado el trabajo necesario para que se lleve a cabo. Solo tienes que aprobarlo."
 POD_elysium_events.102.option.a: "Buen trabajo"
 POD_elysium_events.102.option.b: "No necesito esto"

 POD_elysium_events.103.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]: Un plan mediocre"
 POD_elysium_events.103.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName|l] propone una gran gira por tus vasallos más prominentes para cantar tus alabanzas y tu grandeza, con la esperanza de aumentar su respeto por tu mandato. Aunque es una idea sólida, el precio para organizar tal gira es bastante elevado..."
 POD_elysium_events.103.option.a: "Espero que valga la pena..."
 POD_elysium_events.103.option.b: "¡No vale la pena!"

 POD_elysium_events.104.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]: Un plan mediocre"
 POD_elysium_events.104.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName|l] propone una gran gira por tus vasallos más prominentes para cantar tus alabanzas y tu grandeza, con la esperanza de aumentar su respeto por tu mandato. Solo tienes que pagar parte de los gastos y se pondrá en marcha."
 POD_elysium_events.104.option.a: "Espero que valga la pena..."
 POD_elysium_events.104.option.b: "¡No vale la pena!"

 POD_elysium_events.105.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]: Un buen plan"
 POD_elysium_events.105.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName|l] propone una gran gira por tus vasallos más prominentes para cantar tus alabanzas y tu grandeza, con la esperanza de aumentar su respeto por tu mandato. La mayor parte de los viajes ya está pagada, y tu hábil asesor solo espera tu bendición para partir."
 POD_elysium_events.105.option.a: "Buen trabajo"
 POD_elysium_events.105.option.b: "No necesito esto"

 POD_elysium_events.200.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]: Un plan mediocre"
 POD_elysium_events.200.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l] se presenta con una conjura para respaldar a un grupo local de matones y cobrar parte de sus «ganancias» como recompensa. No es precisamente la actividad más glamurosa, y preferirías evitar que se te vincule con ella. Lamentablemente, tu [ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l] no parece haber tenido en cuenta este asunto de antemano."
 POD_elysium_events.200.option.a: "El prestigio está sobrevalorado"
 POD_elysium_events.200.option.b: "Este es el peor plan de la historia de los planes"

 POD_elysium_events.201.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]: Un plan mediocre"
 POD_elysium_events.201.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l] se presenta con una conjura para respaldar a un grupo local de matones y cobrar parte de sus «ganancias» como recompensa. No es precisamente la actividad más glamurosa, y preferirías evitar que se te vincule con ella. Tu consejero ha pensado en algunas salvaguardas para proteger tu reputación, lo que facilitará el proceso."
 POD_elysium_events.201.option.a: "El oro siempre es importante"
 POD_elysium_events.201.option.b: "No necesito esto"

 POD_elysium_events.202.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]: Un buen plan"
 POD_elysium_events.202.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l] se presenta con una conjura para respaldar a un grupo local de matones y cobrar parte de sus «ganancias» como recompensa. No es precisamente la actividad más glamurosa, y preferirías evitar que se te vincule con ella. Por suerte, tu astuto consejero ya ha tomado medidas para evitar manchar tu prestigioso nombre tanto como sea posible."
 POD_elysium_events.202.option.a: "Buen trabajo"
 POD_elysium_events.202.option.b: "No necesito esto"

 POD_elysium_events.203.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]: Un plan mediocre"
 POD_elysium_events.203.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l] se presenta con una propuesta para expandir tu influencia en tu capital. Después de todo, siempre hay más y nuevas instituciones mortales de las que echar el colmillo. Lamentablemente, tu consejero, que no es precisamente brillante, pide una enorme cantidad de oro solo para poner en marcha la idea, ya que no se colocaron agentes de antemano para preparar esta conjura."
 POD_elysium_events.203.option.a: "El oro está sobrevalorado"
 POD_elysium_events.203.option.b: "¡¿Estás loco?!"

 POD_elysium_events.204.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]: Un plan mediocre"
 POD_elysium_events.204.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l] se presenta con una propuesta para expandir tu influencia en tu capital. Después de todo, siempre hay más y nuevas instituciones mortales de las que echar el colmillo. El trabajo preparatorio ya se ha realizado, dejándote solo los últimos sobornos y demás por pagar para poner en marcha esta idea."
 POD_elysium_events.204.option.a: "Tienes mi bendición"
 POD_elysium_events.204.option.b: "Esto no es necesario"

 POD_elysium_events.205.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]: Un buen plan"
 POD_elysium_events.205.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l] se presenta con una propuesta para expandir tu influencia en tu capital. Después de todo, siempre hay más y nuevas instituciones mortales de las que echar el colmillo. La mayor parte del trabajo ya ha sido realizado por tu hábil consejero, dejándote solo algunos pequeños sobornos que pagar para poner en marcha esta conjura."
 POD_elysium_events.205.option.a: "Buen trabajo"
 POD_elysium_events.205.option.b: "Esto no es necesario"

 POD_elysium_events.300.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]: Un plan mediocre"
 POD_elysium_events.300.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName|l] se presenta con un plan para aumentar tu control general sobre una de tus provincias. Esto te permitiría extraer más influencia de ella, pero también podría atraer atención no deseada. Lamentablemente, es un detalle que tu consejero no supo preparar, lo que hace que este esfuerzo sea más arriesgado de lo que debería haber sido."
 POD_elysium_events.300.option.a: "Sigue siendo una conjura útil"
 POD_elysium_events.300.option.b: "La previsión no es tu fuerte, ¿eh?"

 POD_elysium_events.301.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]: Un plan mediocre"
 POD_elysium_events.301.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName|l] se presenta con un plan para aumentar tu control general sobre una de tus provincias. Esto te permitiría extraer más influencia de ella, pero también podría atraer atención no deseada. Tu asesor ya ha preparado algunas medidas para evitar lo peor de las repercusiones."
 POD_elysium_events.301.option.a: "Una conjura útil"
 POD_elysium_events.301.option.b: "Sigue siendo demasiado peligroso"
               
 POD_elysium_events.302.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]: Un buen plan"
 POD_elysium_events.302.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName|l] se presenta con un plan para aumentar tu control general sobre una de tus provincias. Esto te permitiría extraer más influencia de ella, pero también podría atraer atención no deseada. Afortunadamente, tu hábil asesor ya se ha ocupado de este problema potencial, lo que resulta en solo un pequeño riesgo de ser descubierto."
 POD_elysium_events.302.option.a: "Buen trabajo"
 POD_elysium_events.302.option.b: "Esto no es necesario"
               
 POD_elysium_events.303.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]: Un plan mediocre"
 POD_elysium_events.303.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName|l] quiere centrar los esfuerzos de tu corte en mejorar las habilidades de tus campeones. Un esfuerzo digno, pero uno que podría resultar costoso. Sin embargo, tu asesor no parece considerarlo un problema real y pide una cantidad exorbitante de dinero para establecer un régimen de entrenamiento «adecuado»."
 POD_elysium_events.303.option.a: "El dinero, de hecho, no es una preocupación para mí"
 POD_elysium_events.303.option.b: "¡No estoy hecho de oro, idiota!"
               
 POD_elysium_events.304.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]: Un plan mediocre"
 POD_elysium_events.304.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName|l] quiere centrar los esfuerzos de tu corte en mejorar las habilidades de tus campeones. Un esfuerzo digno, pero que podría resultar costoso. Tu asesor tiene algunas ideas innovadoras que podrían reducir algunos de los costes, pero el precio solicitado sigue siendo elevado."
 POD_elysium_events.304.option.a: "El dinero no me preocupa"
 POD_elysium_events.304.option.b: "¡No estoy hecho de oro!"
   
 POD_elysium_events.305.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]: Un buen plan"
 POD_elysium_events.305.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName|l] quiere centrar los esfuerzos de tu corte en mejorar las habilidades de tus campeones. Un esfuerzo digno, pero que podría resultar costoso. Tu asesor se ha ocupado de la mayoría de los gastos y tiene algunas ideas para evitar generar nuevos. Gracias a este enfoque experto, el precio no es demasiado elevado."
 POD_elysium_events.305.option.a: "Buen trabajo"
 POD_elysium_events.305.option.b: "Esto no es necesario"
                  
 POD_elysium_events.400.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]: Un plan mediocre"
 POD_elysium_events.400.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l] tiene un plan para legitimar tu dominio sobre una zona cercana. Obviamente incluye una gran cantidad de sobornos y favores por otorgar. Lamentablemente, tu asesor, que no es muy hábil, no ha sido capaz de encontrar la forma de reducir los costes, lo que resulta en una propuesta bastante prohibitiva."
 POD_elysium_events.400.option.a: "Estoy hecho de dinero"
 POD_elysium_events.400.option.b: "No estoy hecho de dinero"
                  
 POD_elysium_events.401.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]: Un plan mediocre"
 POD_elysium_events.401.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l] tiene un plan para legitimar tu dominio sobre una zona cercana. Obviamente incluye una gran cantidad de sobornos y favores por otorgar. Tu asesor ya ha realizado una parte sustancial del trabajo de preparación, dejándote solo una parte del coste final por pagar."
 POD_elysium_events.401.option.a: "Una conjura digna"
 POD_elysium_events.401.option.b: "Sigue siendo demasiado costoso"                                    
                  
 POD_elysium_events.402.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]: Un buen plan"
 POD_elysium_events.402.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l] tiene un plan para legitimar tu dominio sobre una zona cercana. Obviamente incluye una gran cantidad de sobornos y favores por otorgar. Pero tu hábil asesor ha logrado cubrir todos los gastos, haciendo que este plan esté prácticamente listo."
 POD_elysium_events.402.option.a: "Buen trabajo"
 POD_elysium_events.402.option.b: "Esto no es necesario"  

 POD_elysium_events.403.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]: Un plan mediocre"
 POD_elysium_events.403.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l] aboga por que te tomes un descanso en tus deberes principescos. Este periodo sería bueno para tu alma maltrecha, pero menos bueno para tu Señorío. Lamentablemente, tu asesor, que no es muy hábil, no es muy fiable, por lo que de todos modos tendrías que encargarte tú mismo de gran parte del trabajo real."
 POD_elysium_events.403.option.a: "Menos idiotas a mi alrededor suena bien"
 POD_elysium_events.403.option.b: "...¡pero no puedo dejar que ellos gobiernen en mi lugar!"  

 POD_elysium_events.404.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]: Un plan mediocre"
 POD_elysium_events.404.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l] aboga por que te tomes un descanso en tus deberes principescos. Este periodo sería bueno para tu alma maltrecha, pero menos bueno para tu Señorío. Tu asesor es lo suficientemente fiable como para que pudieras realmente recentrarte durante este tiempo si así lo desearas."
 POD_elysium_events.404.option.a: "Unas vacaciones sonarían bien"
 POD_elysium_events.404.option.b: "Descansaré cuando esté... bueno"  

 POD_elysium_events.405.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]: Un buen plan"
 POD_elysium_events.405.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName|l] aboga por que te tomes un descanso en tus deberes principescos. Este periodo sería bueno para tu alma maltrecha, pero menos bueno para tu Señorío. Tu asesor es muy hábil, lo que significa que podrías relajarte un tiempo si así lo desearas."
 POD_elysium_events.405.option.a: "Unas vacaciones sonarían bien"
 POD_elysium_events.405.option.b: "Descansaré cuando esté... bueno"  

 POD_elysium_events.500.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]: Un plan mediocre"
 POD_elysium_events.500.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l] siempre está preocupado por una posible brecha de la Mascarada, incluso donde no parece haber ninguna. Como es parte de su trabajo, lo dejas pasar la mayor parte del tiempo. Esta noche, el plan de tu asesor es que renuncies a varias fuentes de influencia prestigiosas para asegurarte de que no te veas comprometido."
 POD_elysium_events.500.option.a: "¿Quién necesita prestigio de todos modos?"
 POD_elysium_events.500.option.b: "Estaremos bien"
 POD_elysium_events.500.option.c: "Estamos tan ocultos como podemos estar ahora mismo, no hace falta eso"
 perfectmasquerade_tooltip: "Esta opción está disponible porque estás en tu nivel mínimo de [masquerade_exposure_with_icon|E] ahora mismo"
 
 POD_elysium_events.501.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]: Un plan mediocre"
 POD_elysium_events.501.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l] siempre está preocupado por una posible brecha de la Mascarada, incluso donde no parece haber ninguna. Como es parte de su trabajo, lo dejas pasar la mayor parte del tiempo. Tu asesor quiere que reduzcas algunas de tus actividades más visibles para asegurar que sigues oculto a los ojos mortales."
 POD_elysium_events.501.option.a: "Un buen consejo"
 POD_elysium_events.501.option.b: "Estaremos bien"
 
 POD_elysium_events.502.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]: Un buen plan"
 POD_elysium_events.502.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l] siempre está preocupado por una posible brecha de la Mascarada, incluso donde no parece haber ninguna. Como es parte de su trabajo, lo dejas pasar la mayor parte del tiempo. Tu asesor ha aislado una fuente de influencia muy visible pero no tan importante que estás utilizando. Renunciar a ella no sería costoso y aseguraría tu seguridad frente a los ojos de los mortales."
 POD_elysium_events.502.option.a: "Buen trabajo"
 POD_elysium_events.502.option.b: "No temo a los mortales" 

 POD_elysium_events.503.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]: Un plan mediocre"
 POD_elysium_events.503.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l] tiene varios informantes nuevos y prometedores, así como otros contactos que deberían resultar útiles para tu causa. El problema es que tu asesor, que no es muy hábil, ha estropeado algunos contactos iniciales con ellos, y tendrás que lidiar con ellos tú mismo si quieres aprovechar esta nueva oportunidad."
 POD_elysium_events.503.option.a: "¿Debo hacerlo todo yo mismo?"
 POD_elysium_events.503.option.b: "No es mi trabajo" 

 POD_elysium_events.504.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]: Un plan mediocre"
 POD_elysium_events.504.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l] tiene varios informantes nuevos y prometedores, así como otros contactos que deberían resultar útiles para tu causa. Aunque la mayor parte del trabajo inicial está hecho, todavía se te necesita para asegurar algunos de los contactos más reclusivos."
 POD_elysium_events.504.option.a: "Un precio aceptable"
 POD_elysium_events.504.option.b: "No es mi trabajo" 

 POD_elysium_events.505.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]: Un buen plan"
 POD_elysium_events.505.desc: "Tu [ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l] tiene varios informantes nuevos y prometedores, así como otros contactos que deberían resultar útiles para tu causa. Tu hábil asesor ha hecho casi todo el trabajo necesario y solo se requiere que atiendas personalmente a algunos de los activos potenciales más obstinados."
 POD_elysium_events.505.option.a: "Buen trabajo"
 POD_elysium_events.505.option.b: "Esto no es necesario"     
 
 POD_elysium_events.106.t: "El Consejo: Un éxito crítico"
 POD_elysium_events.106.desc: "Tú y tu muy hábil asesor tuvisteis una charla larga y muy instructiva durante esta sesión del consejo. Sientes que comprendes mejor algunos de los detalles más finos del gobierno gracias a la aportación de un individuo tan talentoso."
 POD_elysium_events.106.option.a: "Aprender de los mejores"
  
 POD_elysium_events.107.t: "El Consejo: Un fallo crítico"
 POD_elysium_events.107.desc: "Tu asesor, sumamente inepto, ha sido aún más aburrido de lo que anticipabas en la sesión del consejo de esta noche. El tonto ignorante no tiene idea de las complejidades del puesto y ha desperdiciado tu valioso tiempo."
 POD_elysium_events.107.option.a: "Estoy rodeado de idiotas"
  
 POD_elysium_events.108.t: "El Consejo: Otra noche cualquiera"
 POD_elysium_events.108.desc: "Nada especial que informar sobre esta parte del consejo, todo sigue igual. El discurso de tu asesor fue algo aburrido, pero aun así lograste captar algunos detalles útiles."
 POD_elysium_events.108.option.a: "Una noche a la vez..."
  
 POD_elysium_events.2.t: "El Élysium: ¿Gran gastador?"
 POD_elysium_events.2.desc: "Mientras preparas el próximo Élysium, recuerdas el siempre presente problema del coste. Obviamente, tus vasallos esperarían las reuniones más extravagantes para quedar realmente impresionados por tu poder y riqueza.\nEl caso es que el oro no crece en los árboles y quizás quieras escatimar en gastos. O eliminar todos los gastos."
 POD_elysium_events.2.option.a: "El oro no me preocupa"
 POD_elysium_events.2.option.b: "El oro es algo de una preocupación para mí"
 POD_elysium_events.2.option.c: "¡Este granero tan bonito parece perfecto para la reunión!"
  
 POD_elysium_events.3.t: "El Élysium: Refrigerios"
 POD_elysium_events.3.desc: "Con tantos vampiros reunidos en un solo lugar, necesitarás alguna fuente de sangre. Preferiblemente fresca y aún viva. Los mortales son fáciles de encontrar, pero algo más difíciles de convencer para que sirvan de refrigerio para tus invitados. Entonces, ¿cómo procederás?"
 POD_elysium_events.3.option.a: "Saquear la región"
 POD_elysium_events.3.option.b: "Lo haré yo mismo"
 POD_elysium_events.3.option.c: "Pagaré a expertos para que lo hagan discretamente"
  
 POD_elysium_events.4.t: "El Élysium: ¿Seguridad?"
 POD_elysium_events.4.desc: "El Élysium es tradicionalmente un espacio seguro para los vampiros, donde nada malo puede suceder. Obviamente, «tradiciones» y «realidad» son dos cosas muy distintas, y quizás quieras preparar algún tipo de fuerza de seguridad para asegurar que todo transcurra sin contratiempos."
 POD_elysium_events.4.option.a: "Contratar a algunos guardias"
 POD_elysium_events.4.option.b: "Sin seguridad. Eso los mantendrá en vilo"
 POD_elysium_events.4.option.c: "Yo soy seguridad suficiente"
 elysium_security_tooltip: "Esta opción está disponible porque eres una potencia"

 favored_elysium_opinion: "Me favoreció durante el Élysium"
 disfavored_elysium_opinion: "Me despreció durante el Élysium"

 POD_elysium_events.5.t: "El Élysium: Duelo amistoso"
 POD_elysium_events.5.desc: "Dos de tus campeones desean un duelo amistoso entre ellos para entretener a la corte. Obviamente, cada uno de ellos quiere tu favor antes del duelo. Puedes estar seguro de que aquel al que no elijas se sentirá resentido. Después de todo, esto es política vampírica."
 POD_elysium_events.5.option.a: "¡[duelingknight.GetFirstNameNoTooltip], tienes mi favor!"
 POD_elysium_events.5.option.b: "¡[otherknight.GetFirstNameNoTooltip], te elijo a ti!"
 POD_elysium_events.5.option.c: "Nah, no me gusta ninguno de los dos"
 
 really_disfavored_elysium_opinion: "Se burló de mí durante el Élysium"

 POD_elysium_events.6.t: "El Élysium: ¿Una mano amiga?"
 POD_elysium_events.6.desc: "La cabeza de [baffledvassal.GetFirstNameNoTooltip] no está en el juego esta noche. [baffledvassal.GetSheHe|U] ha sido el tema de conversación en la corte, y no precisamente en un buen sentido. Esta es una situación bastante difícil pero también una oportunidad, ya que puedes rescatar a esta pobre alma con unas pocas palabras acertadas. O simplemente podrías burlarte de su situación."
 POD_elysium_events.6.option.a: "Estoy aquí para ayudar"
 POD_elysium_events.6.option.b: "Este no es mi problema"
 POD_elysium_events.6.option.c: "Ponerse con ello suena divertido..."
 
 POD_elysium_events.7.t: "El Élysium: Una oportunidad"
 POD_elysium_events.7.desc: "Has escuchado por casualidad a uno de tus vasallos hablar sobre una posible nueva posibilidad de influencia entre los mortales. Según tus propias fuentes, se trata de una perspectiva lucrativa, pero que los odiados cazadores ya han infiltrado, lo que hace que toda la empresa sea bastante arriesgada. Advertir a tu subordinado al respecto podría ganarte su favor."
 POD_elysium_events.7.option.a: "¡Invirtamos juntos en este proyecto!"
 POD_elysium_events.7.option.b: "Escucha mi consejo, es una trampa"
 POD_elysium_events.7.option.c: "No investigarás este rastro, es una orden"
 
 POD_elysium_events.8.t: "El Élysium: Vecino ruidoso"
 POD_elysium_events.8.desc: "Parece que tu Élysium no ha sido tan tranquilo como esperabas. Tanta gente reunida durante la noche está atrayendo la atención no deseada de los mortales cercanos. Nada que no puedas manejar, obviamente, pero estás poniendo en peligro [the_masquerade|E] al continuar con la reunión."
 POD_elysium_events.8.option.a: "No hay de qué preocuparse"
 POD_elysium_events.8.option.b: "Cerremos el Élysium por esta noche"
 POD_elysium_events.8.option.c: "Cierra el Élysium y luego encárgate de los mortales"
 ending_elysium_tooltip: "Esta opción está disponible porque tienes poderosos poderes mentales"

 POD_elysium_events.9.t: "El Élysium: La sangre fluye"
 POD_elysium_events.9.desc: "Como digno anfitrión del Élysium, has proporcionado sangre en abundancia a tus invitados. Todo va bien, pero la visión de tanto licor rojo y delicioso está excitando a tu Bestia. ¿Quizás podrías darte un pequeño capricho tú también? No es lo más apropiado que lo haga el anfitrión, pero después de todo, tú eres el soberano aquí."
 POD_elysium_events.9.option.a: "Disfruta de tus refrigerios"
 POD_elysium_events.9.option.b: "Solo un poco para mí, por favor"
 POD_elysium_events.9.option.c: "¡Más! ¡Quiero más!"

 POD_elysium_events.10.t: "El Élysium: Noche lenta"
 POD_elysium_events.10.desc: "Esta noche es un Élysium muy normal, hay que admitirlo. Algunos complots pero no demasiados, algunas amenazas veladas pero nada demasiado peligroso... Es agradable tener algo parecido a un respiro de vez en cuando. Incluso podrías ir más allá y dar la noche por terminada."
 POD_elysium_events.10.option.a: "Simplemente disfruta de la calma"
 POD_elysium_events.10.option.b: "¡El Élysium se ha acabado! Déjame en paz"

 POD_elysium_events.11.t: "El Élysium: Preparativos"
 POD_elysium_events.11.desc: "Hay mucho que considerar y preparar para un Élysium exitoso. Has cubierto las necesidades básicas, pero ahora estás considerando ir un poco más allá para impresionar realmente a tus invitados. ¿Pondrás a prueba tus dotes de anfitrión para asegurar un Élysium más prestigioso?"
 POD_elysium_events.11.option.a: "¡Regateemos!"
 POD_elysium_events.11.option.b: "Simplemente paga a gente cualificada para que se encargue"
 POD_elysium_events.11.option.c: "Mi Élysium es perfecto tal como está"
 POD_elysium_events.11.effect.success.desc: "¡Has hecho un muy buen trato!"
 POD_elysium_events.11.success: "Un trato perfecto"
 POD_elysium_events.11.failure.effect.desc: "Has hecho un trato adecuado"
 POD_elysium_events.11.failure: "Un trato mediocre"
 POD_elysium_events.11.critical.failure.effect.desc: "Has hecho un muy mal trato" 
 POD_elysium_events.11.critical.failure: "Un mal trato"
 
 POD_elysium_events.12.t: "El Élysium: Juegos de guerra"
 POD_elysium_events.12.desc: "Una orgullosa y larga Tradición en la mayoría de los Élysium, los juegos de guerra son una buena forma de pulir tus habilidades marciales. Uno de tus vasallos está jugando a uno ahora mismo, comentando cuál es la mejor forma de representar los nuevos avances en la guerra mortal. ¿Quizás convendría una partida? Podrías aprender algo."
 POD_elysium_events.12.option.a: "¿Catapultas en el frente? ¿En serio?"
 POD_elysium_events.12.option.b: "Gracias, esta noche no"
 POD_elysium_events.12.effect.success.desc: "¡Una victoria decisiva!"
 POD_elysium_events.12.success: "¡Una victoria decisiva!"
 POD_elysium_events.12.failure.effect.desc: "Una victoria pírrica"
 POD_elysium_events.12.failure: "Una Victoria Pírrica"
 POD_elysium_events.12.critical.failure.effect.desc: "Una derrota..." 
 POD_elysium_events.12.critical.failure: "Derrotado"
 
 POD_elysium_events.13.t: "El Élysium: ¿Un discurso?"
 POD_elysium_events.13.desc: "La mayoría de las veces, el Élysium es un asunto tranquilo que favorece a pequeños grupos de personas conspirando juntas. Pero hay momentos en los que te entra el deseo de pronunciar un gran discurso recordando a todos su propósito y, por supuesto, tu autoridad sobre ellos. ¿Es esta noche uno de esos momentos?"
 POD_elysium_events.13.option.a: "¡Escuchad todos!"
 POD_elysium_events.13.option.b: "No lo es"
 POD_elysium_events.13.effect.success.desc: "¡Un gran discurso!"
 POD_elysium_events.13.success: "¡Un Gran Discurso!"
 POD_elysium_events.13.failure.effect.desc: "Un discurso mediocre"
 POD_elysium_events.13.failure: "Un Discurso Mediocre"
 POD_elysium_events.13.critical.failure.effect.desc: "Un discurso desastroso" 
 POD_elysium_events.13.critical.failure: "Un Discurso Desastroso"
 
 POD_elysium_events.14.t: "El Élysium: Conspiraciones a pequeña escala"
 POD_elysium_events.14.desc: "El Élysium es un lugar de rumores y engaños. Aunque nada demasiado importante, ya que la mayoría de los conjuras críticos tienen lugar en lugares menos públicos, aun así aquí todavía hay reputaciones que crear o destruir. Uno de tus vasallos está entregado a este arte vampírico de una manera bastante celosa esta noche. Esto podría ser una oportunidad para ponerte a prueba."
 POD_elysium_events.14.option.a: "¡Oh, qué escándalo!"
 POD_elysium_events.14.option.b: "Estoy por encima de tales conjuras mezquinas"
 POD_elysium_events.14.effect.success.desc: "¡Una demostración perfecta!"
 POD_elysium_events.14.success: "¡Una Demostración Perfecta!"
 POD_elysium_events.14.failure.effect.desc: "Una actuación adecuada"
 POD_elysium_events.14.failure: "Una Actuación Adecuada"
 POD_elysium_events.14.critical.failure.effect.desc: "Un intento fallido" 
 POD_elysium_events.14.critical.failure: "Un Intento Fallido"
 
 POD_elysium_events.15.t: "El Élysium: Teorías"
 POD_elysium_events.15.desc: "Esta noche, tu Élysium está muy interesado en una de las últimas modas procedentes de los mortales. Como siempre, muchos vampiros afirman ser los precursores de tales ideas e inventos mortales, pero sin ninguna prueba. Es un debate interminable, pero también es una buena oportunidad para presentar tus propias teorías sin ningún riesgo real de peligro."
 POD_elysium_events.15.option.a: "Sobre eso..."
 POD_elysium_events.15.option.b: "Juegos mentales inútiles"
 POD_elysium_events.15.effect.success.desc: "¡Un razonamiento convincente!"
 POD_elysium_events.15.success: "¡Un Razonamiento Convincente!"
 POD_elysium_events.15.failure.effect.desc: "Un razonamiento adecuado"
 POD_elysium_events.15.failure: "Un Razonamiento Adecuado"
 POD_elysium_events.15.critical.failure.effect.desc: "Un razonamiento desastroso" 
 POD_elysium_events.15.critical.failure: "Un Razonamiento Desastroso"
            
 POD_elysium_events.16.t: "El Élysium: ¿Una corte errante?"
 POD_elysium_events.16.desc: "Una tradición nacida de los Ventrue alemanes, el Élysium errante es el proceso de trasladar tu corte de un lugar a otro durante varios años, visitando a todos tus «súbditos» por el camino. Además de ser una propuesta favorecida por tus vasallos, también es bastante buena para fines de seguridad, ya que no te quedas quieto en un solo lugar durante demasiado tiempo. El inconveniente es tu incapacidad para controlar eficazmente tu propio dominio mientras estás fuera. ¿Adoptarás esta tradición durante los próximos cinco años?"
 POD_elysium_events.16.option.a: "De nuevo en el camino..."
 POD_elysium_events.16.option.b: "En realidad soy una criatura sedentaria"
   
 POD_elysium_events.17.t: "El Élysium: Un protegido"
 POD_elysium_events.17.desc: "Uno de tus vasallos está muy orgulloso de un gran descubrimiento que [patronvassal.GetSheHe] ha hecho recientemente. Un mortal aparentemente lo suficientemente prometedor como para ser exhibido por el Élysium, lo cual es una ocasión rara... y no permitida oficialmente. Como gobernante aquí, podrías aprovechar este «faux-pas» para apoderarte de este mortal si así lo deseas. Sin embargo, no esperes que tu vasallo te perdone pronto."
 POD_elysium_events.17.option.a: "Tengo grandes planes para ti"
 POD_elysium_events.17.option.b: "Qué mascota tan agradable"
   
 POD_elysium_events.18.t: "El Élysium: ¿Quién es Caín?"
 POD_elysium_events.18.desc: "La verdadera naturaleza de Caín siempre ha sido objeto de debate en la comunidad vampírica. Como tal, no es ninguna sorpresa que tu Élysium esté, una vez más, hablando de él. Todo el mundo tiene su propia opinión sobre este tema, incluido tú. ¿Quién fue el primer vampiro? ¿Un salvador, un monstruo, un simple asesino mortal o algo completamente distinto?"
 POD_elysium_events.18.option.a: "Hijo de Adán y Eva, fue el primer asesino"
 POD_elysium_events.18.option.b: "Él es nuestra perdición y nuestra salvación" 
 POD_elysium_events.18.option.c: "Un don nadie que se ha ido hace mucho" 
 POD_elysium_events.18.option.d: "¿Tal vez un buen cochero?" 

 POD_elysium_events.19.t: "El Élysium: Invitado de honor"
 POD_elysium_events.19.desc: "Antes de que tu próximo Élysium comience de verdad, uno de tus vasallos acude a ti con una petición: ser el invitado de honor de la próxima reunión. Obviamente, alguna intriga mezquina entre tus vasallos es la razón de esta exigencia, y aceptar te haría parecer débil ante el resto de tu corte. Pero aceptar significaría que este queda en deuda contigo, lo cual podría resultar útil."
 POD_elysium_events.19.option.a: "Ahora me debes una"
 POD_elysium_events.19.option.b: "No me interesa" 

 POD_elysium_events.20.t: "El Élysium: Un regalo"
 POD_elysium_events.20.desc: "Uno de tus vasallos se presenta ante ti con un regalo, al parecer una especie de reliquia familiar. Es una oferta tentadora, ya que podrías conservarla como un objeto de vanidad o venderla por algo de dinero útil. Pero, obviamente, nada se regala de verdad en el mundo vampírico. Estás seguro de que habrá un precio que pagar más adelante por tal generosidad."
 POD_elysium_events.20.option.a: "Acéptalo y luego véndelo"
 POD_elysium_events.20.option.b: "Acéptalo y guárdalo" 
 POD_elysium_events.20.option.c: "Puedes quedártelo" 

 POD_elysium_events.21.t: "El Élysium: La Segunda Generación"
 POD_elysium_events.21.desc: "El debate del Élysium de esta noche parece girar en torno a la Segunda Generación. Estos míticos chiquillos del mismísimo Caín fueron, posiblemente, destruidos por su propia progenie en la legendaria ciudad de Enoc. Algunos, sin embargo, cuestionan esta teoría, o incluso la existencia misma de tales criaturas. ¿Cuál es tu opinión?"
 POD_elysium_events.21.option.a: "Se han ido hace mucho, asesinados por la Tercera Generación"
 POD_elysium_events.21.option.b: "Son una lección sobre el orgullo y la caída" 
 POD_elysium_events.21.option.c: "Cuentos de hadas y hombres del saco" 
 POD_elysium_events.21.option.d: "Les habría diablerizado si hubiera tenido la oportunidad" 

 POD_elysium_events.109.t: "[ROOT.Char.GetCouncillorPosition('councillor_chancellor').GetPositionName]: ¿Entrenamiento diplomático?"
 POD_elysium_events.109.desc: "Tu asesor te pide ayuda esta noche para un asunto de formación. Un Viaje entre las cortes cercanas para aprender más sobre sus Tradiciones y peculiaridades podría resultar en una mejora significativa. Sin embargo, esto te dejaría mal parado, ya que admitirías que tu consejo podría mejorarse."
 POD_elysium_events.109.option.a: "Tienes mi permiso"
 POD_elysium_events.109.option.b: "Eres lo suficientemente hábil" 

 POD_elysium_events.209.t: "[ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName]: ¿Entrenamiento administrativo?"
 POD_elysium_events.209.desc: "Tu asesor te pide ayuda esta noche para un asunto de formación. Una gran suma de oro invertida en varios proyectos mortales nuevos podría aportar información importante para tu [ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName|l]. Sin embargo, hay pocas esperanzas de que vuelvas a ver ese dinero."

 POD_elysium_events.309.t: "[ROOT.Char.GetCouncillorPosition('councillor_marshal').GetPositionName]: ¿Entrenamiento militar?"
 POD_elysium_events.309.desc: "Tu asesor te pide ayuda esta noche para un asunto de formación. Los mortales han inventado nuevas armas de guerra, y estudiarlas podría resultar revelador. Sin embargo, adquirirlas sería costoso y requeriría una gran cantidad de sobornos."

 POD_elysium_events.409.t: "[ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]: ¿Entrenamiento académico?"
 POD_elysium_events.409.desc: "Tu asesor te pide ayuda esta noche para un asunto de formación. Varios libros importantes han llamado la atención de tu asesor y adquirirlos podría ser importante. Por supuesto, sería bastante costoso asegurarse de que esos escritos acaben en tu Posesión."

 POD_elysium_events.509.t: "[ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName]: ¿Entrenamiento en las sombras?"
 POD_elysium_events.509.desc: "Tu asesor te pide ayuda esta noche para un asunto de formación. Han surgido varias oportunidades pequeñas en tu zona y a tu [ROOT.Char.GetCouncillorPosition('councillor_spymaster').GetPositionName|l] le gustaría aprovecharlas para probar nuevas formas de lidiar con tales asuntos. Sin embargo, estar asociado con intrigas de tan pequeña escala no te sentaría bien."

 POD_elysium_events.22.t: "El Élysium: El extraño"
 POD_elysium_events.22.desc: "Un vampiro modesto ha venido a tu Élysium inesperadamente esta noche. No lo conoces y no le debes nada, pero pide tu hospitalidad y la oportunidad de discutir y debatir contigo y tus cortesanos antes de seguir su camino. Recibir a lo que parece ser un don nadie errante no es precisamente prestigioso, pero tienes la sensación de que podría ser más interesante de lo que parece."
 POD_elysium_events.22.option.a: "Eres mi invitado esta noche"
 POD_elysium_events.22.option.b: "¡Lárgate, miserable!" 
 strangeraccepted_tooltip: "¿Está ocultando algo?" 

 POD_elysium_events.23.t: "El Élysium: El extraño II"
 POD_elysium_events.23.desc: "El solitario de aspecto extraño que vino a tu Élysium hace varios años ha vuelto, pidiendo una vez más tu hospitalidad. Esta noche quiere jugar algunos juegos de mesa contigo y tu corte, incluyendo algunos cuya existencia ni siquiera conocías. Sigues siendo bastante suspicaz con este hombre y tus cortesanos no le aprecian, pero no puedes quitarte la sensación de que podría ser mejor complacerle."
 POD_elysium_events.23.option.a: "Entonces, ¿cuáles son las reglas?"
 POD_elysium_events.23.option.b: "¡Lárgate, miserable!" 

 POD_elysium_events.24.t: "El Élysium: El extraño III"
 POD_elysium_events.24.desc: "El extraño vampiro que ya ha venido a tu Elíseo dos veces está de vuelta. Esta noche parece más alto y formidable que antes y no pide tu hospitalidad. En su lugar, pide hablar contigo en privado. Te sientes obligado a aceptar, lo que le lleva a una parte remota de tu palacio.\nEl hombre tiene una sonrisa extraña y simplemente dice «Eres digno» antes de entregarte una pequeña copa de sangre. Antes de que puedas procesar nada más, ya se ha ido, dejándote con esta pequeña ofrenda rebosante de poder."
 POD_elysium_events.24.option.a: "...y es la sangre más deliciosa que hayas probado jamás"

 perfectstress_tooltip: "Esta opción está disponible porque no tienes estrés."
 POD_elysium_events.403.option.c: "Ya me siento bastante relajado, gracias."

 POD_elysium_events.26.t: "El Elíseo: ¿Un arma digna?"
 POD_elysium_events.26.desc: "Un extraño misterioso, que podría ni siquiera ser un vampiro, ha aparecido de algún modo en tu Elíseo esta noche. Se dirige directamente a ti con una propuesta: oro a cambio de una de las armas que porta.\nSin interés alguno por nada que no sea este posible trato, acepta, no obstante, mostrártelas antes de comprometerse con ninguna decisión. Basta un rápido vistazo para ver que son auténticas, armas poderosas y raras de verdad.\nEl extraño espera impaciente tu respuesta."
 POD_elysium_events.26.option.a: "Esta espada parece magnífica."
 POD_elysium_events.26.option.b: "¡Un gladius! ¡Qué retro!" 
 POD_elysium_events.26.option.c: "¿Qué es esta cosa tan extraña?" 
 POD_elysium_events.26.option.d: "Esta parece amenazante." 
 POD_elysium_events.26.option.e: "No necesito nada." 
