l_spanish:

 POD_gehenna_seer.100.t: "Rumores extraños"
 POD_gehenna_seer.100.desc.1: "Tu $court_seer_court_position$ entra tropezando en el gran salón, murmurando:\n\"En los, ejem, últimos días...\n... sangre por todas partes ...\n... una sombra... algo...\"\n\nLuego se desmaya."
 POD_gehenna_seer.100.desc.2: "Se produce un alboroto cuando encuentran a tu $court_seer_court_position$ inconsciente con espuma sangrienta alrededor de su boca. Al parecer, tuvo algún tipo de visión ominosa que fue demasiado para [gehenna_seer.GetHerHim]."
 POD_gehenna_seer.100.desc.3: "Tu $court_seer_court_position$ proclama en voz alta:\n\n'¡Las palabras de sangre!\n¡Las almas de los Trece arrancarán los corazones!\n¡El Padre de la grasa dorada!'\n\nNo tiene sentido."
 POD_gehenna_seer.100.a: "Necesito un mejor $court_seer_court_position$."
 POD_gehenna_seer.100.b: "¡Traed más recipientes drogados para este [gehenna_seer.GetWomanMan]!"
 POD_gehenna_seer.100.c: "Estas tonterías de profecías apocalípticas son solo eso, tonterías."

# localización genérica para las profecías del Vidente de la Gehena
 POD_gehenna_seer.gen.t: "Profecía de la Gehena"
 POD_gehenna_seer.gen.a: "¡Aceptar la profecía!"
 POD_gehenna_seer.gen.b: "¡Rechazar la profecía!"

# localizaciones no genéricas para las profecías del Vidente de la Gehena
 POD_gehenna_seer.300.desc: "[gehenna_seer.GetTitledFirstName] anuncia una funesta profecía a tu corte:\n\n'Y la propia Madre Oscura\nserá traída\ny allí, en el valle de Enoch, habrá una batalla\nun duelo entre el Padre Oscuro y la Madre Oscura\nLa Reina Demonio morderá profundo\nEl Rey Maldito morderá más profundo'."
 POD_gehenna_seer.400.desc: "[gehenna_seer.GetTitledFirstName] señala los signos de la Gehena:\n\n'Observad la\nsombra que\nvuela\nobservad al dragón\nque se alza\nobservad la oscuridad\nque se mueve\nobservad la sombra de la\nluna'."
 POD_gehenna_seer.500.desc: "[gehenna_seer.GetTitledFirstName] cae en trance murmurando:\n\n'Conoceréis estos tiempos, pues una mano\nnegra se alzará y asfixiará a todos los\nque se le opongan\ny aquellos que comen la sangre del corazón\nprosperarán\ny los Vástagos se amontonarán cada uno con\nlos suyos, y la $pod_vitae$ será tan rara como\nlos diamantes'."
 POD_gehenna_seer.600.desc: "[gehenna_seer.GetTitledFirstName] tiene una revelación:\n\n'Llegará un tiempo,\nen que las cabezas de tres Príncipes\nverán el arder del amanecer\nsobre un pilar blanco'."
 POD_gehenna_seer.700.desc: "[gehenna_seer.GetTitledFirstName] tiene una advertencia profética:\n\n'Y conoceréis estos últimos tiempos\npor el Tiempo de la Sangre Débil,\nque marcará a los vampiros que\nno pueden Engendrar,\nlos conoceréis por los Sin Clan,\nque llegarán a gobernar'."
 POD_gehenna_seer.800.desc: "[gehenna_seer.GetTitledFirstName] revela que la esperanza vendrá del ganado:\n\n'la última Hija de Eva,\ny en ella se decidirá el destino de todos.\nY no conoceréis a esta mujer, excepto por la\nmarca de la Luna en ella,\ny se enfrentará a la traición, al odio y al dolor\npero en ella reside la última esperanza'."
 POD_gehenna_seer.900.desc: "[gehenna_seer.GetTitledFirstName] advierte de la llegada de la madre devoradora:\n\n'Llegará un tiempo\nen que un hambre antigua despertará\nen lo profundo de los bosques del norte\ny consumirá a todos sus chiquillos'."
 POD_gehenna_seer.1000.desc: "[gehenna_seer.GetTitledFirstName] profetiza una amenaza subterránea:\n\n'Llegará un tiempo\nen que una Oscuridad Primordial se agitará\nen lo profundo de una ciudad que ha olvidado\ny sorprenderá al Antiguo, a sus hijos'."
 POD_gehenna_seer.1100.desc: "[gehenna_seer.GetTitledFirstName] advierte de los tiempos finales:\n\n'Por estos signos, debéis saber,\nque la Gehena espera, incluso a la puerta,\ncomo un actor espera entre bastidores\n¡Ya viene! ¡Está cerca!\n\n¡Que el sol brille negro!\n¡Que la luna brille sangre!\nLa Gehena llegará pronto'."
 POD_gehenna_seer.1200.desc: "Cayendo en trance, [gehenna_seer.GetTitledFirstName] balbucea:\n\n'¡Silencio! ¡Oíd el grito del cuervo!\nLa quietud del viento\nalzándose caliente en la calle\nlas torres ocultan\nla oscuridad del día\nCuando los sueños de Lasombra se hagan realidad\nen el día en que la luna corra como sangre\ny el sol salga negro en el cielo,\nese es el día de los Malditos, cuando los hijos de Caín se alzarán de nuevo'."
 POD_gehenna_seer.1300.desc: "[gehenna_seer.GetTitledFirstName] mira al suelo y luego al cielo:\n\n'Y el mundo se volverá frío\ny cosas impuras brotarán del suelo\ny grandes tormentas rodarán, los rayos encenderán\nfuegos, los animales se pudrirán y sus cuerpos,\nretorcidos, caerán.\nAsí también, nuestros Abuelos se alzarán\ndel suelo\nRomperán su ayuno con la\nprimera parte de nosotros\nNos consumirán por completo'."
 POD_gehenna_seer.1400.desc: "Murmurando en lenguas, las palabras de [gehenna_seer.GetTitledFirstName] ganan claridad de repente:\n\n'No conoceremos lo que sucederá,\npero el cielo se desgarrará, y la tierra abajo\nY las fuerzas del Infierno brotarán del suelo\nAl Tercer Día, habrá silencio\nlos cuervos se alimentarán de la carroña\nla peste bailará entre las ruinas\nel último de los Salvajes dejará este lugar\nla última de las Bestias de la Luna luchará\ny caerá'."
 POD_gehenna_seer.1500.desc: "[gehenna_seer.GetTitledFirstName] cae en trance y murmura:\n\n'Y los [Glossary('Antediluvians','game_concept_antediluvian_desc')] crearán para sí mismos\nun Imperio de Sangre\nGobernarán con garras de hierro\nArrancarán los corazones de todos los que aún vivan\nY la suma total de los vivos de la tierra vendrá\ny vivirá en la Última Ciudad, llamada Gehena'."
 POD_gehenna_seer.1600.desc: "[gehenna_seer.GetTitledFirstName] vaticina:\n\n'Y habrá un reinado de mil años,\ny no habrá amor, ni vida, ni piedad,\nlos poderosos serán como esclavos\nlos virtuosos se volverán inmundos\ncada buen don, y cada don perfecto será corrompido\npor el Padre de las Tinieblas, cuyo poder vendrá de\nlos reinos inferiores'."
 POD_gehenna_seer.1700.desc: "[gehenna_seer.GetTitledFirstName] presagia:\n\n'No te convertirás en un Dios para los Hijos de Seth.\npues el de Arriba, volviéndose celoso en su cielo,\ngolpeará el linaje de Caín para siempre.\nRecordad a Ashtareth de rostro gentil,\nRecordad a Baal de grasa dorada.\nRecordad al fuerte Tammauz,\nSabed que los Hijos de Seth se alzarán\ncon armas del de Arriba,\ny nos conquistarán, si somos como Dioses para ellos'."
 POD_gehenna_seer.1800.desc: "[gehenna_seer.GetTitledFirstName] pronostica:\n\n'Nos servirán mientras el Sol recorra el cielo,\ny vigilarán nuestras casas, con agua refrescante,\ncontra el Fuego de Miguel.\nNos alimentarán y nos proporcionarán ropa,\nBailarán para nosotros y nos proporcionarán canciones,\nYacerán con nosotros y nos proporcionarán consuelo.\nNos aconsejarán y escucharemos sus consejos.\nNos adorarán, y no debemos permitir su adoración'."
 POD_gehenna_seer.1900.desc: "[gehenna_seer.GetTitledFirstName] profetiza:\n\n'¡Y de aquellos cuya sangre es Agua!\nLas ciudades del Oeste arderán de rabia,\nY una gran rueda del Este,\nDe las tierras sin forma,\n¡Los aplastará!\nEn la última noche\nCuando la luna sea una plata de oscuridad\n¡Llega el $pod_Embrace$ final!\n¡Que el sol brille negro!\n¡Que la luna brille negra!\n¡Las aguas suben!'"
 POD_gehenna_seer.2000.desc: "[gehenna_seer.GetTitledFirstName] predice:\n\n'Ved al coloso de acero a horcajadas sobre el mundo\nContemplad los gusanos en sus pies.\nMientras el gigante se tambalea, los gusanos se regocijan,\nPues habrá comida en abundancia cuando el gigante caiga'."
 POD_gehenna_seer.2100.desc: "[gehenna_seer.GetTitledFirstName] vaticina:\n\n'Oíd los aullidos en la noche\nMientras los lobos de Adán\nSe lanzan a los anillos del Dragón.\nOled la sangre del hermano desde el principio de los tiempos'."
 POD_gehenna_seer.2200.desc: "[gehenna_seer.GetTitledFirstName] presagia:\n\n'Ved la cámara rota de 500 años\nY el cristal destrozado sobre el suelo.\nVed las piedras llorando y los dragones libres.\nLilith está aquí.\nLilith es libre'."
 POD_gehenna_seer.2300.desc: "[gehenna_seer.GetTitledFirstName] declara:\n\n'Durante quinientos años siete estarán unidos\nGobernando en desafío a los ángeles\nBuscando la unidad entre los malditos.\nCuidado con el $pod_cainite$ que tanto olvida su maldición\nComo para soñar con la armonía mortal'."
 POD_gehenna_seer.2400.desc: "[gehenna_seer.GetTitledFirstName] aconseja:\n\n'Escuchad las palabras del profeta sobre sueños llenos de sangre y noches acortadas.\nDel hambre alzada para reclamar lo suyo, de la arrogancia convertida en ceniza.\nEscuchad las palabras del vidente, cuya visión desgarra el velo del tiempo\nY al guerrero de noches perdidas, cuya espada clama venganza.\nEscuchad la palabra del erudito, para quien el conocimiento es una maldición'."
 POD_gehenna_seer.2500.desc: "[gehenna_seer.GetTitledFirstName] advierte:\n\n'Los horrores antiguos no son sino sueños de lo que está por venir.\nDe ellos vendrá la advertencia.\nDe ellos vendrá la sabiduría\nDe ellos vendrá la matanza'."
 POD_gehenna_seer.2600.desc: "[gehenna_seer.GetTitledFirstName] profetiza:\n\n'Dentro de la estirpe de Caín hay un hambre agitándose.\nUna, dos, tres veces la llamada al poder y a la muerte\nDesgarrará las almas de los Trece.\nEsta es la muerte sin derramamiento de sangre,\nEsta es la tumba que no tiene fantasmas'."
 POD_gehenna_seer.2700.desc: "[gehenna_seer.GetTitledFirstName] presagia:\n\n'He aquí, uno muere en silencio, gritos no escuchados.\nLos hijos llevarán su nombre pero no su sangre.\nDichosos en la ignorancia, saboreando la ceguera,\nSu estirpe vive los minutos uno a uno,\nMientras aquellos que saborean el conocimiento secreto tiemblan,\nRecorriendo el mundo por cada última gota de verdad.\nNo hay salvación en matar.\nNi los malditos olvidan jamás'."
