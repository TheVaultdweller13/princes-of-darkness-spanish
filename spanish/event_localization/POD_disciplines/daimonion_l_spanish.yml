l_spanish:

 POD_daimonion_events.1000.title: "Sentir el pecado - La lucha"
 POD_daimonion_events.1000.desc: "Incluso con poderes demoníacos, las barreras de ignorancia que los necios levantan para contener sus propios deseos son difíciles de derribar. Depende de ti deslizarte en la mente de [recipient.GetFirstName] y liberarlos. Pero primero, debes abrirte paso."
 POD_daimonion_events.1000.option.a: "El poder de la sangre es suficiente."
 POD_daimonion_events.1000.a.tt_true_faith: "¡Su Fe me resiste!"
 POD_daimonion_events.1000.a.success.desc: "¡Victoria!"
 POD_daimonion_events.1000.a.failure.desc: "Pérdida"
 POD_daimonion_events.1000.a.tt_success: "Sus pecados crecerán y los consumirán"
 POD_daimonion_events.1000.a.tt_failure: "[recipient.GetSheHe] permanecerá fuera de mi alcance"
 POD_daimonion_events.1000.option.b: "¡Mi propia voluntad aplastará sus defensas!"
 POD_daimonion_events.1000.option.c: "Esta noche no es el momento adecuado...."
 POD_daimonion_events.1000.option.c.tt: "Rendirse"
 POD_daimonion_events.1000.option.b.tt.beast: "#beast Pensé que yo era el malo aquí....#!"
 POD_daimonion_events.2000.title: "Sentir el pecado - Triunfo"
 POD_daimonion_events.2000.desc: "He atravesado las defensas mentales, el poder demoníaco retuerce y corrompe a [recipient.GetName]."
 POD_daimonion_events.2000.option_a: "Otra alma en mi lista"
 POD_daimonion_events.3000.title: "Sentir el pecado - Profanado"
 POD_daimonion_events.3000.desc: "Toda tu vida reprimiste tus emociones, tus necesidades. Escuchaste a otros decirte qué está bien y qué está mal. Te reprimiste y te esforzaste por ser mejor.\n[AddTextIf( PlayerHasBeast, '#beast ¿Por qué?#!\n' )]No más. Sabes lo que quieres, lo que tienes que hacer."
 POD_daimonion_events.3000.desc.auspex: "Sin embargo, algo va mal. Estos sentimientos no provienen de ti. Ves visiones de un ser.... ¿Hombre? ¿Mujer? ¿Demonio? Difícil de decir. Pero tus sentidos sobrenaturales te gritan un nombre: [actor.GetFirstNameNoTooltip]"
 POD_daimonion_events.3000.option_a: "Se siente bien"
 POD_daimonion_events.4000.title: "Sentir el pecado - Fracaso"
 POD_daimonion_events.4000.desc: "Esta no era la noche para que tu objetivo sucumbiera a sus pecados, pero es solo cuestión de tiempo: todos los ángeles caen, y tú estarás esperándolos cuando lleguen al infierno."
 POD_daimonion_events.4000.option_a: "Pronto....."
 POD_daimonion_events.5000.title: "Psicomaquia - El resultado"
 POD_daimonion_events.5000.option.loss: "Hola oscuridad, mi vieja amiga...."
 POD_daimonion_events.5000.option.loss.ct: "Ganarás varios pecados nuevos, con su versión amplificada"
 POD_daimonion_events.5000.option.victory: "El héroe más grande es el que se domina a sí mismo"
 POD_daimonion_events.5000.desc.victory: "Luchaste contra las peores partes de ti mismo: los pecados, los defectos y la oscuridad. Y ganaste. La oscuridad sigue dentro de ti, pero ahora te responde.\n\nEl poder de tus pecados es tuyo para ejercerlo."
 POD_daimonion_events.5000.desc.loss: "Todo fue tan repentino: la manifestación apareció de la nada y atacó con la fuerza de cada parte dentada y defectuosa de ti mismo. No había esperanza.... ¿Cómo podrías haber luchado contra una criatura que ejemplifica todo lo que te hace tan, tan débil?\n\n No puedes. Es mejor rendirse."
 POD_daimonion_events.5000.loss.toast: "[recipient.GetFirstName] perdió"
 POD_daimonion_events.5000.loss.toast.torpor: "Cayeron rápidamente en $pod_torpor$ para escapar"
 POD_daimonion_events.5000.loss.toast.sins: "Sucumbieron a la depravación"
 POD_daimonion_events.5000.victory.toasttitle: "[recipient.GetFirstName] ganó"
 POD_daimonion_events.5000.victory.toast: "[recipient.GetFirstName] ha tomado el control de sus propios pecados"
 POD_daimonion_events.5001.title: "Psicomaquia - El comienzo"
 POD_daimonion_events.5001.desc: "Una batalla con las partes más oscuras de la psique: tal es el destino que has decretado para [recipient.GetName]. Por desgracia, no conocen el valor de tal confrontación e intentan resistirse. Que comience la brecha."
 POD_daimonion_events.5001.a.tt_success: "La lucha comenzará"
 POD_daimonion_events.5001.a.tt_failure: "[recipient.GetSheHe] permanecerá a salvo en la ignorancia"
 POD_daimonion_events.5001.power_fail: "Psicomaquia fallida"
 invite_infernalist_decision: "Atraer infernalista"
 invite_infernalist_decision_desc: "Sumergiéndote en tu propio poder retorcido, encuentra a un mortal enredado con demonios y atráelo hacia ti"
 invite_infernalist_decision_tooltip: "Trae a un infernalista talentoso a tu servicio"
 invite_infernalist_decision_effect_tooltip: "Un infernalista se une a tu corte"
 invite_infernalist_decision_tp: "La oscuridad provee..."
 invite_infernalist_decision_confirm: "Como una araña en una telaraña..."
 tempt_ct: "Inicia una intriga para tentar al objetivo hacia el infernalismo."
 demonic_plague_contraction: "Peste demoníaca contraída"
 demonic_plague_contraction_ct: "Has enfermado con la temida peste demoníaca, condenado a morir de una muerte lenta y agonizante."
 demonic_plague_wound: "La peste demoníaca progresa"
 demonic_plague_overcome: "Peste demoníaca resistida"
 demonic_plague_overcome_ct: "Al menos por un tiempo, tu vitalidad y fuerza mantienen a raya la plaga. Sigue así y podrás superarla."
 demonic_plague_overcome_complete: "Peste demoníaca superada"
 demonic_plague_overcome_complete_ct: "¡Has vencido a la temida peste demoníaca y la has purgado de tu sistema!"
