 POD_secrets.0001.t: "¡Mi secreto expuesto!"
 POD_secrets.0001.desc: "He sido expuesto por ser un [Glossary('Diablerist','game_concept_diablerie_desc')]... Uno de los peores crímenes en la historia Cainita, esto podría ser un golpe serio a mi reputación, ya que ahora todos temerán por su alma cuando estén cerca de mí." 
