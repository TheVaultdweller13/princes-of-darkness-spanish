 POD_secrets.0201.t: "Un amigo diabolizado, [victim.GetFirstNameNoTooltip|U]"
 POD_secrets.0201.desc: "La pérdida de mi querido amigo, [victim.GetFirstName], pesa mucho; el lento flujo de súbditos afligidos y sus consuelos no son nada comparados con el vacío en mi corazón. \n\nTodavía no puedo creer que [victim.GetSheHe] [victim.GetDeathReasonHideKiller], o que [diablerist.GetTitledFirstName], [victim.GetHerHis] asesino, quede impune. \n\n"
 POD_secrets.0201.desc.prisoner: "Aunque [diablerist.GetSheHe] se pudre en las mazmorras de [murderer.GetImprisonedBy.GetTitledFirstNameNoTooltip], ese conocimiento no apaga la furia en mi corazón."
 POD_secrets.0201.desc.free: "Mis puños se aprietan y la sangre late en mis oídos cuando pienso en esa bestia caminando libre... una afrenta a la justicia, y a [ROOT.Char.GetFaith.HighGodName]."
 POD_secrets.0201.a: "Algún día te vengaré, amigo mío..."
 POD_secrets.0201.b: "El rastro de sangre termina aquí."