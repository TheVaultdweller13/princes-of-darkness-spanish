l_spanish:

 POD_vampire_torpor_events.001.title: "Sueño profundo"
 POD_vampire_torpor_events.001.desc: "Tus heridas te han debilitado, ahora sientes una extraña llamada en tu interior, una llamada que te obliga a entrar en $pod_torpor$, un sueño profundo que puede durar miles de años."
 
 POD_vampire_torpor_events.001.resist: "¡Resistiré!"
 POD_vampire_torpor_events.001.resist.fight: "Intentarás resistirte a caer en $pod_torpor$. Tus heridas y tu nivel de hambre influirán en esta decisión."
 POD_vampire_torpor_events.001.surrender: "No me resistiré..."
 POD_vampire_torpor_events.001.surrender.surrender: "Entrarás en $pod_torpor$ voluntariamente. Esto te obligará a abdicar."
 POD_vampire_torpor_events.101.title: "Sueño eterno"
 POD_vampire_torpor_events.101.desc: "No te quedan fuerzas para continuar tu no-vida con tales heridas, es hora de descansar. Solo esperas que no te pase nada mientras estés en $pod_torpor$."
 POD_vampire_torpor_events.101.defeat: "El sueño eterno aguarda."
 POD_vampire_torpor_events.101.defeat.sleep: "Entrarás en $pod_torpor$, abdicando en tu heredero"
 POD_vampire_torpor_events.201.title: "Resistiendo al $pod_torpor$"
 POD_vampire_torpor_events.201.desc: "Has resistido. Esa extraña sensación de debilidad ha desaparecido y aún tienes cosas que hacer antes de descansar."
 POD_vampire_torpor_events.201.success: "Mi trabajo aquí aún no ha terminado."
 POD_vampire_torpor_events.201.success.victory: "No entrarás en $pod_torpor$ todavía."
 
 POD_vampire_torpor_events.002.title: "No-vida eterna"
 POD_vampire_torpor_events.002.desc: "Tu no-vida se ha prolongado durante muchos cientos de años, empiezas a sentirte aburrido de esta era, ¿quizás es hora de descansar? La no-vida del vampiro es un sufrimiento largo y prolongado donde los amigos van y vienen y los mortales cambian tan rápido que pronto te resultan ajenos.\nQuizás la próxima era sea mejor... pero probablemente no."
 
 POD_vampire_torpor_events.002.resist: "Aún tengo cosas que hacer."
 POD_vampire_torpor_events.002.resist.nosleep: "No estás listo para descansar."
 POD_vampire_torpor_events.002.rest: "Creo que es hora de descansar."
 POD_vampire_torpor_events.002.rest.sleep: "Entrarás en $pod_torpor$ voluntariamente. Esto te obligará a abdicar."
 POD_vampire_torpor_events.102.title: "No hay tiempo para el descanso"
 POD_vampire_torpor_events.102.desc: "Aún no estás listo para entrar en $pod_torpor$, muchos mortales aún requieren tu atención precisa, y tus enemigos deberían temblar de miedo por un poco más de tiempo."
 POD_vampire_torpor_events.102.resist: "Aún tengo asuntos que atender."
 POD_vampire_torpor_events.102.resist.nosleep: "No entrarás en $pod_torpor$... todavía."
 POD_vampire_torpor_events.202.desc: "Has estado despierto durante tanto tiempo... Es hora de descansar, los enemigos pueden esperar. Quizás la próxima era sea la prometida edad de oro... o la temida Gehena. Pero eres lo suficientemente viejo para saber que probablemente será otra era aburrida y prolongada de mortales estropeando las cosas..."
 POD_vampire_torpor_events.202.title: "Sueño eterno"
 POD_vampire_torpor_events.202.accept: "El $pod_torpor$ aguarda."
 POD_vampire_torpor_events.202.accept.sleep: "Entrarás en $pod_torpor$ voluntariamente."
 
 POD_vampire_torpor_events.003.title: "Despierto"
 POD_vampire_torpor_events.003.desc: "Has estado en $pod_torpor$ durante algún tiempo. ¿No es el momento de volver a tu no-vida?"
 POD_vampire_torpor_events.003.awake: "Hora de volver."
 POD_vampire_torpor_events.003.awake.torpor: "Despertarás del $pod_torpor$, y tus enemigos deberían tener miedo."
 POD_vampire_torpor_events.003.sleep: "Aún no estoy listo."
 POD_vampire_torpor_events.003.sleep.nowake: "Permanecerás en $pod_torpor$ durante algún tiempo."
 POD_vampire_torpor_events.103.title: "Sueño eterno"
 POD_vampire_torpor_events.103.desc: "Aún no estás listo para volver."
 POD_vampire_torpor_events.103.sleep: "Dulces sueños."
 POD_vampire_torpor_events.103.sleep.continue: "Seguirás durmiendo."
 POD_vampire_torpor_events.203.title: "Regreso a la no-vida"
 POD_vampire_torpor_events.203.desc: "Finalmente estás listo para volver, tus enemigos deberían temblar"
 POD_vampire_torpor_events.203.awake: "He vuelto"
 POD_vampire_torpor_events.203.awake.torpor: "Estás regresando al mundo de las tinieblas"