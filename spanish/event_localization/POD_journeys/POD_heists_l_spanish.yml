 # MGS1 route [karde]
  
 POD_heists.2001.t: "Complicación: Encuentro"
 POD_heists.2001.desc.coterie: "Esta corte está bien vigilada.\n\nYa hemos notado varias patrullas siguiendo horarios estrictos que cubren casi la totalidad de la zona.\n\nTendremos que proceder con cautela si no queremos alertar a los guardias."
 POD_heists.2001.desc.nocoterie: "Esta corte está bien vigilada.\n\nYa he notado varias patrullas siguiendo horarios estrictos que cubren casi la totalidad de la zona.\n\nTendré que proceder con cautela si no quiero alertar a los guardias."
 POD_heists.2001.a: "De sombra a sombra." #intrigue static duel
 POD_heists.2001.a.success: "Continuando la Misión" 
 POD_heists.2001.a.failure: "!" # suspicion
 #secret option if eccentric/lunatic
 POD_heists.2001.b: "¡Puedo esconderme en ese barril!" #lose stress, continue heist

 POD_heists.2002.t: "Complicación: Duelo"
 POD_heists.2002.desc.coterie: "Estamos progresando de forma constante. El siguiente obstáculo parece ser un tipo robusto que custodia una puerta crítica.\n\nNo estoy seguro de sus capacidades sobrenaturales (si es que tiene), pero enfrentarlo directamente parece la única solución.\n\nTambién tenemos el tiempo en nuestra contra, ya que el clamor de la batalla probablemente atraerá atención no deseada muy pronto."
 POD_heists.2002.desc.nocoterie: "Estoy progresando de forma constante. El siguiente obstáculo parece ser un tipo robusto que custodia una puerta crítica.\n\nNo estoy seguro de sus capacidades sobrenaturales (si es que tiene), pero enfrentarlo directamente parece la única solución.\n\nTambién tengo el tiempo en mi contra, ya que el clamor de la batalla probablemente atraerá atención no deseada muy pronto."
 POD_heists.2002.a.coterie: "[prowess_duelist.GetFirstName] puede acabar con él." #prowess duel
 POD_heists.2002.a.nocoterie: "Puedo acabar con él." #prowess duel
 POD_heists.2002.a.success: "Amenaza eliminada" #just continue
 POD_heists.2002.a.failure: "Fallo crítico" # get sent to liege (likely death)
 POD_heists.2002.b: "Debe haber otra forma de entrar, aunque suponga un gran desvío..." # add stress + suspicion

 POD_heists.2003.t: "Complicación: Escape"
 POD_heists.2003.desc.coterie: "Bueno, hemos cometido un error.\n\nNo tenemos tiempo para lamentarnos en este momento, ya que nos persigue una horda de guardias enfurecidos gritando con la fuerza suficiente como para despertar a los muertos. Alertados por el sonido, otros nuevos aparecen de cada rincón, obligándonos a esquivarlos a duras penas.\n\nTenemos que perderlos pronto."
 POD_heists.2003.desc.nocoterie: "Bueno, he cometido un error.\n\nNo tengo tiempo para lamentarme en este momento, ya que me persigue una horda de guardias enfurecidos gritando con la fuerza suficiente como para despertar a los muertos. Alertados por el sonido, otros nuevos aparecen de cada rincón, obligándome a esquivarlos a duras penas.\n\nTengo que perderlos pronto."
 POD_heists.2003.a: "Puedo lograrlo..." #martial contest, representing an improvised escape instead of a brawl
 POD_heists.2003.a.success: "Por poco." #just continue
 POD_heists.2003.a.failure: "Ahora, frente a ti, finalmente puedo morir." #death


 # MGS3 route [karde]
  
 POD_heists.2011.t: "Complicación: Devorador de hierba"
 POD_heists.2011.desc.coterie: "Para alcanzar el objetivo de nuestra [infiltration|E], hemos concluido que el jardín privado del dominio era la vía más segura. Este entorno lujoso, rebosante de vegetación, nos ofrece muchas oportunidades para progresar mientras permanecemos ocultos.\n\nEstamos avanzando entre la hierba alta cuando noto que un perro callejero se acerca hacia nosotros. Si este invitado no deseado empieza a ladrar, las cosas podrían ponerse feas muy rápido..."
 POD_heists.2011.desc.nocoterie: "Para alcanzar el objetivo de mi [infiltration|E], he concluido que el jardín privado del dominio era la vía más segura. Este entorno lujoso, rebosante de vegetación, me ofrece muchas oportunidades para progresar mientras permanezco oculto.\n\nEstoy avanzando entre la hierba alta cuando noto que un perro callejero se acerca hacia mí. Si este invitado no deseado empieza a ladrar, las cosas podrían ponerse feas muy rápido..."
 POD_heists.2011.a: "¡Fuera, vete!"
 POD_heists.2011.b: "No te muevas ni un músculo..."
 POD_heists.2011.c: "¿Podrías mirar para otro lado, colega?"

 POD_heists.2012.t: "Complicación: Camaleón de la Oscuridad"
 POD_heists.2012.desc.coterie: "Parece que este jardín es más bien un bosque. Estoy bastante segura de que ya nos hemos perdido varias veces y, por desgracia, también resulta que está muy vigilado por varios guardias.\n\nSe me ocurre una idea. Nuestra ropa desentona demasiado en este entorno tan verde. ¿Quizás usar algo de tierra y hierba para atenuar los colores ayudaría a evitar una atención indebida?"
 POD_heists.2012.desc.nocoterie: "Parece que este jardín es más bien un bosque. Estoy bastante segura de que ya me he perdido varias veces y, por desgracia, también resulta que está muy vigilado por varios guardias.\n\nSe me ocurre una idea. Mi ropa desentona demasiado en este entorno tan verde. ¿Quizás usar algo de tierra y hierba para atenuar los colores ayudaría a evitar una atención indebida?"
 POD_heists.2012.a: "Si debo hacerlo..."
 POD_heists.2012.b: "¡Eso es cruzar la línea!"

 POD_heists.2013.t: "Complicación: Quemarlo todo"
 POD_heists.2013.desc: "Ya es suficiente. Pasar por este «jardín» fue una idea terrible. No tengo ni idea de dónde estoy, mi ropa está sucia y huelo como un campesino. Es hora de replanteárselo todo.\n\nTengo el fuerte impulso de buscar la antorcha más cercana y quemarlo todo, pero esto podría ser una reacción exagerada.\n\n¿O no lo es?"
 POD_heists.2013.a: "¡Táctica de tierra quemada!"
 POD_heists.2013.a.success: "¡Uso el caos para prevalecer!"
 POD_heists.2013.a.failure: "Espera. ¿¡FUEGO!?"
 POD_heists.2013.b: "Odio la naturaleza."


 # Assassin's Creed route [karde]
  
 POD_heists.2031.t: "Complicación: Aventura en las azoteas"
 POD_heists.2031.desc.coterie: "Mi estudio preliminar de nuestro objetivo me ha llevado a concluir que el mejor enfoque sería uno aéreo. Podríamos alcanzar una posición ventajosa escalando una torre cercana y luego saltando de tejado en tejado para evitar la mayoría de las defensas.\n\nUn plan perfecto, de verdad; solo tengo que no caerme."
 POD_heists.2031.desc.nocoterie: "Mi estudio preliminar de mi objetivo me ha llevado a concluir que el mejor enfoque sería uno aéreo. Podría alcanzar una posición ventajosa escalando una torre cercana y luego saltando de tejado en tejado para evitar la mayoría de las defensas.\n\nUn plan perfecto, de verdad; solo tengo que no caerme."
 POD_heists.2031.a: "No mires abajo..." #prowess duel
 POD_heists.2031.a.success: "Salto, salto, salto..." #continue
 POD_heists.2031.a.failure: "...Me resbalé" #lose prestige, gain minor wound, gain suspicion

 POD_heists.2032.t: "Complicación: Muerte desde arriba"
 POD_heists.2032.desc.coterie: "Nos estamos acercando a nuestro objetivo. Según nuestro plan, ahora tenemos que bajar al nivel del suelo durante un breve tiempo antes de volver a subir. Echan un vistazo antes de comenzar el descenso y rápidamente notan a un guardia apostado allí.\n\nEstamos en una posición ventajosa para lanzarnos sobre él, literalmente.\n\nA forma perfecta de deshacerse de una amenaza de manera eficiente. Y lucir increíble mientras lo hacemos."
 POD_heists.2032.desc.nocoterie: "Me estoy acercando a mi objetivo. Según mi plan, ahora tengo que bajar al nivel del suelo durante un breve tiempo antes de volver a subir. Echan un vistazo antes de comenzar el descenso y rápidamente noto a un guardia apostado allí.\n\nEstoy en una posición ventajosa para lanzarme sobre él, literalmente.\n\nA forma perfecta de deshacerme de una amenaza de manera eficiente. Y lucir increíble mientras lo hago."
 POD_heists.2032.a: "Uno, dos y..." #prowess duel
 POD_heists.2032.a.success: "...¡tres!" #continue, gain prestige
 POD_heists.2032.a.failure: "...¡ay!" #continue, gain wound, lose prestige
 
 POD_heists.2033.t: "Complicación: Salto de fe"
 POD_heists.2033.desc: "Uno de los últimos obstáculos que hay que superar es un salto. Un gran salto desde lo alto de una torre, aterrizando (con suerte) en un carro de heno colocado muy convenientemente aquí.\n\nNo hay mucho en qué pensar. No fallaré el objetivo.\n\n¿Verdad?"
 POD_heists.2033.a: "¡Puedo oír el grito de un águila!" #prowess duel (representing athletic and such)
 POD_heists.2033.a.success: "Maldición, soy genial" #continue heist, gain prestige
 POD_heists.2033.a.failure: "Las futuras generaciones pensarán que te suicidaste" #death
 #secret option if fortitude advanced
 POD_heists.2033.b: "Puedo apuntar al suelo sin problemas." #continue heist
 

 # Dungeon Keeper route [karde]
  
 POD_heists.2041.t: "Complicación: ¿Trampas?"
 POD_heists.2041.desc.coterie: "Hemos estado progresando prudentemente en nuestro atraco hasta ahora, cautelosos ante la atención no deseada, y parece que ha valido la pena por otra razón. Un pasillo mundano revela diminutos agujeros en sus paredes tras una inspección más cercana.\n\nTenemos que pasar por aquí, así que tendremos que encontrar la forma de desactivar o evitar este mecanismo."
 POD_heists.2041.desc.nocoterie: "He estado progresando prudentemente en mi atraco hasta ahora, cauteloso ante la atención no deseada, y parece que ha valido la pena por otra razón. Un pasillo mundano revela diminutos agujeros en sus paredes tras una inspección más cercana.\n\nTengo que pasar por aquí, así que tendré que encontrar la forma de desactivar o evitar este mecanismo."
 POD_heists.2041.a.coterie: "¿Quizás [learning_duelist.GetFirstName] pueda desactivar el detonador?" #learning duel
 POD_heists.2041.a.nocoterie: "¿Quizás yo pueda desactivar el detonador?" #learning duel
 POD_heists.2041.a.success: "...y listo" #continue
 POD_heists.2041.a.failure: "¡Espera, eso no está bien!" #gain stress, gain minor wound
 POD_heists.2041.b: "¿Tal vez si soy lo suficientemente rápido?" #prowess duel
 POD_heists.2041.b.success: "¡Fácil!" #continue
 POD_heists.2041.b.failure: "¡Ay!" #gain stress, gain minor wound

 POD_heists.2042.t: "Complicación: Trampas"
 POD_heists.2042.desc.coterie: "Ahora, cautelosos ante más «sorpresas» desagradables que nos esperan, somos aún más prudentes en nuestro enfoque. El siguiente desafío que tenemos delante parece ser un suelo irregular que sospecho que podría abrirse sobre algo desagradable, como un foso lleno de picas.\n\nComo preferiría evitar un final lleno de picas, considero mis opciones."
 POD_heists.2042.desc.nocoterie: "Ahora, cauteloso ante más «sorpresas» desagradables que me esperan, soy aún más prudente en mi enfoque. El siguiente desafío que tengo delante parece ser un suelo irregular que sospecho que podría abrirse sobre algo desagradable, como un foso lleno de picas.\n\nComo preferiría evitar un final lleno de picas, considero mis opciones."
 POD_heists.2042.a.coterie: "Solo tenemos que evitar las losas con trampa." #learning duel
 POD_heists.2042.a.nocoterie: "Solo tengo que evitar las losas con trampa." #learning duel
 #Same end duel loca as above, failure kills you here however. Spikes.
 #POD_heists.XXXX.a.success:0 "...and voila." #continue
 #POD_heists.XXXX.a.failure:0 "Wait, that's not right!" #death
 POD_heists.2042.b: "Hay un patrón numérico en juego aquí..." #stewardship duel
 #Same results and loca as above

 POD_heists.2043.t: "¡Complicación: Trampas!"
 POD_heists.2043.desc: "La [infiltration|E] ha llegado a una etapa crítica. Debido a experiencias pasadas, espero que las peores trampas estén aquí. Sin embargo, no parezco notar nada fuera de lo común a primera vista, lo que no logra calmar mis nervios. Es mucho más probable que algo esté muy bien oculto a que no haya nada en absoluto."
 POD_heists.2043.a: "Comprobemos todo dos veces..." #intrigue duel
 POD_heists.2043.a.success: "¡Ja! ¡Te tengo!" #continue
 POD_heists.2043.a.failure: "# sin cambios" #death
 POD_heists.2043.b: "¿Dónde podría estar la emboscada?" #martial duel
 #Same results and loca keys as above


 # Inside Help route [karde]

 POD_heists.2061.t: "Complicación: El infiltrado"
 POD_heists.2061.desc.coterie:0 "Para tener éxito en nuestra [infiltration|E], hemos elegido un enfoque indirecto. Todo hombre tiene su debilidad y descubrimos qué tipo de soborno funcionaba mejor con el guardia de la entrada trasera.\n\nComo el hombre nos deja entrar según lo acordado, espero fervientemente no haberlo juzgado mal y no estar caminando hacia una emboscada."
 POD_heists.2061.desc.nocoterie: "Para tener éxito en mi [infiltration|E], he elegido un enfoque indirecto. Todo hombre tiene su debilidad y descubrí qué tipo de soborno funcionaba mejor con el guardia de la entrada trasera.\n\nComo el hombre me deja entrar según lo acordado, espero fervientemente no haberlo juzgado mal y no estar caminando hacia una emboscada."
 POD_heists.2061.a: "Serás bien recompensado." # lodsamonee
 POD_heists.2061.b: "Reconozco tu valor." #diplomacy duel
 POD_heists.2061.b.success: "Según lo acordado" #continue, lose gold
 POD_heists.2061.b.failure: "¡¿Por qué cierras la puerta tras nosotros?!" #imprison
 POD_heists.2061.c: "Tus sueños prohibidos están cerca." #intrigue duel
 #Same loca and results for the duel

 POD_heists.2062.t: "Complicación: Guía poco fiable"
 POD_heists.2062.desc.coterie: "Nuestro infiltrado no ha sido tan útil como esperaba hasta ahora. Su aparente falta de conocimiento sobre las partes más recónditas del dominio nos ha costado tiempo valioso y nos ha estado a punto de delatar varias veces.\n\nAun así, pese a mis sospechas, no puedo negar que estamos progresando.\n\nMe tomaré la molestia de comprobar todo lo que diga."
 POD_heists.2062.desc.nocoterie: "Mi infiltrado no ha sido tan útil como esperaba hasta ahora. Su aparente falta de conocimiento sobre las partes más recónditas del dominio me ha costado tiempo valioso y me ha estado a punto de delatar varias veces.\n\nAun así, pese a mis sospechas, no puedo negar que estoy progresando.\n\nMe tomaré la molestia de comprobar todo lo que diga."
 POD_heists.2062.a: "Algo va mal, pero continuemos." #gain suspicion
 POD_heists.2062.b.coterie: "Deberíamos irnos mientras aún podamos." #gain stress
 POD_heists.2062.b.nocoterie: "Debería irme mientras aún pueda." #gain stress

 POD_heists.2063.t: "Complicación: Traición esperada"
 POD_heists.2063.desc.coterie: "A medida que nuestra [infiltration|E] alcanza una etapa crítica, nuestro guía conduce a $POD_player_coterie$ a una nueva sala. Antes de que podamos reaccionar, la puerta se cierra con llave y oigo el sonido de espadas siendo desenvainadas y ballestas siendo tensadas.\n\nHice bien en desconfiar de nuestro infiltrado, pero aparentemente no fui lo bastante prudente para no verme acorralad[ROOT.Char.Custom('ES_OA')] en una emboscada bien preparada.\n\nEs hora de ver si somos lo suficientemente fuertes como para dejar atrás este error."
 POD_heists.2063.desc.nocoterie: "Mientras mi [infiltration|E] alcanza una etapa crítica, mi guía me conduce a una nueva sala. Antes de que pueda reaccionar, la puerta se cierra con llave y oigo el sonido de espadas desenvainándose y ballestas siendo tensadas.\n\nHice bien en desconfiar de nuestro infiltrado, pero aparentemente no fui lo bastante prudente para no verme acorralad[ROOT.Char.Custom('ES_OA')] en una emboscada bien preparada.\n\nEs hora de ver si soy lo suficientemente fuerte como para dejar atrás este error."
 POD_heists.2063.a: "Esto aún no ha terminado." #very difficult prowess challenge. They are prepared, they have been warned in advance and you had options to back out before
 POD_heists.2063.a.success: "Una rata acorralada, luchando como un león" #continue
 POD_heists.2063.a.failure: "Un error demasiado" #death


 POD_heists.6001.t: "Un final prematuro"
 POD_heists.6001.desc: "La muerte es solo un pequeño contratiempo para mí.\n\nDesafortunadamente, debido a la naturaleza de mi habilidad de resurrección, mi nuevo cuerpo ha aparecido en algún lugar muy alejado de la ubicación de mi [infiltration_mission|E].\n\nSi quiero intentarlo de nuevo, tendré que empezar desde el principio."
 POD_heists.6001.a: "Sigue siendo mejor que ser mortal."
 POD_heists.6001.a.tt: "Tu [infiltration_mission|E] ha terminado prematuramente debido a tu muerte."


 POD_heists.7777.t: "Venganza contra el Narrador"
 POD_heists.7777.desc: "Estás a punto de intentar robar el [charon_artifact.Custom('ColorizedArtifactName')] de [GetScriptedCharacterByHistoryID('POD_wraith_01').GetFirstNameNicknamed].\n\n¿Te parece una buena idea?"
 POD_heists.7777.a: "Sí, totalmente."
 POD_heists.7777.b: "No realmente..."