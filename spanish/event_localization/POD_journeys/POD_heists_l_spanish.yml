 POD_heist_option_prisoners: "Liberar a uno de los prisioneros."
 POD_heist_option_prisoners_empty: "@warning_icon!#X [CurrentHeistTarget.GetFirstNameNicknamed] no tiene prisioneros#!"

 POD_heist_wounded_toast: "Has resultado herido"
 POD_heist_stress_toast: "Una experiencia estresante"

 POD_heist_title_node_exit: "Estás en una Salida"
 POD_heist_desc_node_exit: "Este es el lugar por donde puedes entrar y salir.\nUna vez que hayas logrado el objetivo de esta [infiltration|E], aún tendrás que regresar a una salida para poder marcharte a salvo."

 POD_heist_title_node_empty: "¡Un pasaje oculto!"
 POD_heist_desc_node_empty: "Este pasillo está completamente vacío.\nPuedes pasar por aquí sin temor a despertar la [suspicion|E]."

 POD_heist_title_node_scramble: "Esperar y ver"
 POD_heist_desc_node_scramble: "Puedes mantener un perfil bajo y esperar en este rincón oculto.\nLas cosas se calmarán, los guardias se moverán y, con suerte, obtendrás nuevas oportunidades."
 POD_heist_effect_node_scramble: "La mayoría de los nodos de esta [infiltration|E] serán reemplazados por otros nuevos."

 POD_heist_title_node_key: "La llave de la cámara acorazada"
 POD_heist_desc_node_key: "Esta sala contiene una llave.\nAbrirá la sala donde se guardan las pertenencias más valiosas."

 POD_heist_title_node_key_half: "Una llave para la cámara acorazada"
 POD_heist_desc_node_key_half: "Esta sala contiene una llave.\nNecesitas #bold dos#! de estas para abrir la sala donde se guardan las pertenencias más valiosas."

 POD_heist_node_key_empty: "#weak Ya has encontrado la llave en este lugar#!"

 POD_heist_gain_key_toast: "Llave encontrada"
 POD_heist_found_key_desc: "Tendrás $VALUE|V0$ de las [CurrentHeist.Var('keys_required').GetValue|V0] llaves necesarias para abrir la cámara acorazada"
 POD_heist_found_key_desc_past: "Ahora tienes $VALUE|V0$ de las [CurrentHeist.Var('keys_required').GetValue|V0] llaves necesarias para abrir la cámara acorazada"
 POD_heist_found_all_keys_desc: "Podrás abrir la cámara acorazada"
 POD_heist_found_all_keys_desc_past: "Ahora puedes abrir la cámara acorazada"

 POD_heist_vault_no_key: "@warning_icon!#X $POD_heist_vault_no_key_basic$#!"
 POD_heist_vault_no_key_basic: "Tienes [CurrentHeist.Var('keys_found').GetValue|V0] de las [CurrentHeist.Var('keys_required').GetValue|V0] llaves necesarias para abrir esta cámara acorazada"
 
 POD_heist_title_node_artifact: "Un tesoro incalculable"
 POD_heist_desc_node_artifact: "Ahí está.\nHas encontrado el [artifact|E] que venías a robar.\nAhora solo tienes que salir..."
 POD_heist_gain_artifact_toast: "Has encontrado el [artifact|E]"
 POD_heist_gain_artifact_desc: "[CurrentHeist.Var('target_artifact').Artifact.Custom('ColorizedArtifactName')] se añadirá a tu botín"
 POD_heist_gain_artifact_desc_past: "[CurrentHeist.Var('target_artifact').Artifact.Custom('ColorizedArtifactName')] se ha añadido a tu botín"
 POD_heist_gain_artifact_hint: "Obtendrás todo tu botín una vez que salgas de la [infiltration|E]"

 POD_heist_title_node_vault: "Una cámara acorazada masiva"
 POD_heist_desc_node_vault: "Una sala llena de montones de oro. Esto es lo que venías a buscar.\nCuidado: cuanto más tiempo pases recogiéndolo, más aumentará tu [suspicion|E]."
 POD_heist_treasury_amount_desc: "\n#I [CHARACTER.GetShortUINameNoTooltipNoFormat] le quedan [gold_i|E][CHARACTER.GetGold|V0]#!"

 POD_heist_title_node_event: "Ocurrirá algo inesperado"
 POD_heist_desc_node_event: "Alguien te hace señas, con la intención de hablar contigo.\n¿Qué querrán? Solo hay una forma de saberlo..."
 POD_heist_effect_node_event: "Un evento aleatorio... tal vez bueno, tal vez malo."

 POD_heist_title_node_diplomacy: "Se necesitan conversadores hábiles"
 POD_heist_desc_node_diplomacy: "Un cortesano insiste en que ya te ha visto antes.\nMás vale que le convenzas de lo contrario, o esto podría resultar problemático."
 POD_heist_effect_node_diplomacy_success: "Tu encanto no tiene parangón"
 POD_heist_effect_node_diplomacy_fail: "Tu encanto tiene sus semejantes"
 POD_heist_effect_node_diplomacy_critfail: "Un ejemplo perfecto de lo que NO se debe hacer"

 POD_heist_title_node_martial: "Movimientos de tropas"
 POD_heist_desc_node_martial: "Hay muchos guardias aquí, realizando algún tipo de ejercicio.\nEl conocimiento de la estrategia te permitirá predecirlos y evitarlos."
 POD_heist_effect_node_martial_success: "Claramente, estudiaste a Sun Tzu"
 POD_heist_effect_node_martial_fail: "¿Sun quién?"
 POD_heist_effect_node_martial_critfail: "No conocías ni al enemigo ni a ti mismo"

 POD_heist_title_node_stewardship: "Puede que los sobornos sean necesarios"
 POD_heist_desc_node_stewardship: "Algunos cortesanos te han pillado merodeando.\nEstán dispuestos a cerrar la boca... por un precio."
 POD_heist_effect_node_stewardship_success: "El soborno ha funcionado"
 POD_heist_effect_node_stewardship_fail: "Los cortesanos no han quedado impresionados"
 POD_heist_effect_node_stewardship_critfail: "Te han estafado"

 POD_heist_title_node_intrigue: "El enfoque sutil"
 POD_heist_desc_node_intrigue: "La patrulla de guardias en esta zona no te ha visto.\nTodavía.\nEs hora de poner a prueba tus habilidades de sigilo."
 POD_heist_effect_node_intrigue_success: "Eres como una sombra"
 POD_heist_effect_node_intrigue_fail: "Eres como una sombra bastante ruidosa"
 POD_heist_effect_node_intrigue_critfail: "Eres tan sutil como una trama del Sabbat"

 POD_heist_title_node_learning: "Trampas discretas"
 POD_heist_desc_node_learning: "Este pasillo está lleno de trampas.\nUn poco de ingenio y conocimiento de la construcción te ayudarán a evitarlas."
 POD_heist_effect_node_learning_success: "Je. Pan comido"
 POD_heist_effect_node_learning_fail: "Las trampas te rozan un poco"
 POD_heist_effect_node_learning_critfail: "# sin cambios"

 POD_heist_title_node_prowess: "¡Guardias!"
 POD_heist_desc_node_prowess: "Una patrulla te ha atrapado. Es demasiado tarde para huir.\nLos guardias no son rival para ti, pero ¿podrás derrotarlos lo suficientemente rápido como para no atraer la atención?"
 POD_heist_effect_node_prowess_success: "Como un cuchillo caliente a través de la mantequilla"
 POD_heist_effect_node_prowess_fail: "Tu pelea hace algo de ruido"
 POD_heist_effect_node_prowess_critfail: "# sin cambios"

 POD_heist_title_node_fight_elite: "Una lucha peligrosa"
 POD_heist_desc_node_fight_elite: "Ves a uno de los [CurrentHeistTarget.Custom('KnightCulturePlural')] de [CurrentHeistTarget.GetFirstNamePossessive].\nLidiar con ellos rápidamente te permitirá salir sin levantar [suspicion|E]."
 POD_heist_effect_node_fight_elite: "Comenzarás un duelo hasta la @death_icon!#N;bold muerte#!."
 POD_heist_fight_elite_error_toast: "El caballero ha desaparecido..."

 POD_heist_title_node_fight_hunt: "El objetivo de tu Misión"
 POD_heist_desc_node_fight_hunt: "Este debe ser el escondite del engendro.\nEl Cazador ha encontrado a su presa. Pero, ¿quién puede asegurar quién es quién?"
 POD_heist_effect_node_fight_hunt: "Te enfrentas a [CurrentHeist.Var('hunt_target').Char.GetShortUIName]. Una vez que lo hagas, no habrá vuelta atrás."
 POD_heist_effect_node_fight_hunt_invalid: "#weak [CurrentHeist.Var('hunt_target').Char.GetShortUIName] ya ha sido derrotad[X.Custom('ES_OA')]#!"

 POD_heist_title_node_money: "¡Una cámara acorazada abierta!"
 POD_heist_desc_node_money: "Esta sala está llena de montones de oro.\nPuedes dedicar algo de tiempo a recogerlo, pero hacerlo aumentará tu [suspicion|E]."

 POD_heist_title_node_fame: "Una oportunidad para impresionar"
 POD_heist_desc_node_fame: "Algunos cortesanos comparten historias sobre [coteries|E] famosas.\nPodrías ganar [prestige|E] hablando de tus propios logros, pero hacerlo aumentará tu [suspicion|E]."

 POD_heist_title_node_gossip: "Documentos secretos"
 POD_heist_desc_node_gossip: "Esta sala contiene cartas, libros de contabilidad y otras pruebas escritas de malas acciones.\nPuedes dedicar algo de tiempo a buscarlos y ganar [secrets|E] o [hooks|E], pero hacerlo aumentará tu [suspicion|E]."
 POD_heist_effect_node_gossip: "Aprendes un [secret|E] o ganas un [hook|E] sobre un asunto de [CurrentHeist.Var('court_owner').Char.GetFirstNameNicknamed]."

 POD_heist_title_node_destress: "Disfrutar de algo de hospitalidad"
 POD_heist_desc_node_destress: "Esta es una sala de estar con comodidades para los invitados de la corte.\nPuedes dedicar algo de tiempo a relajarte y perder [stress|E], pero hacerlo aumentará tu [suspicion|E]."

 POD_heist_title_node_map: "Planos y mapas"
 POD_heist_desc_node_map: "Esta sala contiene no solo un mapa de este [CurrentHeistTarget.Custom('PODDomicile')], sino también horarios de guardias y cortesanos.\nEsto es una gran ventaja para tu [infiltration|E], una vez que te hayas tomado el tiempo de leerlo todo."
 POD_heist_effect_node_map: "Descubrirás cada punto de esta [infiltration|E]."

 POD_heist_title_node_prisoners: "La prisión"
 POD_heist_desc_node_prisoners: "Los prisioneros de [CurrentHeistTarget.GetFirstNameNicknamed] se custodian aquí.\nPuedes liberarlos si así lo deseas, pero hacerlo aumentará tu [suspicion|E]."
 POD_heist_release_prisoner_desc: "Te acercarás a la celda de la prisión de [CHARACTER.GetNameNicknamed] y decidirás qué hacer con [CHARACTER.GetHerHim]."


 ######################
 ####### Events #######
 ######################

 POD_heist_arrival_title: "Comienza la Infiltración"
 POD_heist_arrival_confirm: "Esta será una noche inolvidable."
 POD_heist_arrival_decline: "He cambiado de opinión. Volvamos."

 POD_heists.1.desc.hostile.coterie: "Hemos llegado.\n\nNo hay sonido, salvo por los pasos amortiguados de $POD_player_coterie$. Nos hemos asegurado de permanecer ocultos y no llamar la atención, porque una vez que estemos en este lugar, será #bold;N matar a la vista#!. Este es el territorio de nuestros enemigos.\n\nAhora lo único que tenemos que hacer es conseguir la llave de la cámara acorazada, encontrar el [PlayerJourneyArtifact.GetName] y agarrarlo sin que nadie nos vea."
 POD_heists.1.desc.hostile.nocoterie: "He llegado.\n\nNo hay sonido, salvo por mis pasos amortiguados. Me he asegurado de permanecer oculto y no llamar la atención, porque una vez que esté en este lugar, será #bold;N matar a la vista#!. Este es el territorio de mis enemigos.\n\nAhora lo único que tengo que hacer es conseguir la llave de la cámara acorazada, encontrar el [PlayerJourneyArtifact.GetName] y agarrarlo sin que nadie me vea."
 POD_heists.1.desc.coterie: "Hemos llegado.\n\nLos guardias de [PlayerJourneyArtifact.GetOwner.GetShortUINamePossessive] [PlayerJourneyArtifact.GetOwner.Custom('PODDomicile')] nos hacen pasar a $POD_player_coterie$, y con eso, ya estamos dentro. Por supuesto que debíamos estar aquí. No hay razón para pensar lo contrario.\n\nNinguna en absoluto.\n\nAhora todo lo que tenemos que hacer es conseguir la llave de la bóveda, encontrar el [PlayerJourneyArtifact.GetName] y agarrarlo sin causar alboroto."
 POD_heists.1.desc.nocoterie: "He llegado.\n\nLos guardias de [PlayerJourneyArtifact.GetOwner.Custom('PODDomicile')] de [PlayerJourneyArtifact.GetOwner.GetShortUINamePossessive] me dan la bienvenida, y con eso, ya estoy dentro. Por supuesto que debía estar aquí. No hay razón para pensar lo contrario.\n\nNinguna en absoluto.\n\nAhora lo único que tengo que hacer es conseguir la llave de la cámara acorazada, encontrar el [PlayerJourneyArtifact.GetName] y agarrarlo sin armar un escándalo."

 POD_heists.2.desc.hostile.coterie: "Hemos llegado.\n\nNo hay sonido, salvo por los pasos amortiguados de $POD_player_coterie$. Nos hemos asegurado de permanecer ocultos y no llamar la atención, porque una vez que estemos en este lugar, será #bold;N matar a la vista#!. Este es el territorio de nuestros enemigos.\n\nAhora lo único que tenemos que hacer es conseguir la llave, encontrar la cámara acorazada de [PlayerJourneyTarget.GetFirstNamePossessiveNoTooltip] y llenar nuestros bolsillos sin que nadie nos vea."
 POD_heists.2.desc.hostile.nocoterie: "He llegado.\n\nNo hay sonido, salvo por mis pasos amortiguados. Me he asegurado de permanecer oculto y no llamar la atención, porque una vez que esté en este lugar, será #bold;N matar a la vista#!. Este es el territorio de mis enemigos.\n\nAhora lo único que tengo que hacer es conseguir la llave, encontrar la cámara acorazada de [PlayerJourneyTarget.GetFirstNamePossessiveNoTooltip] y llenar mis bolsillos sin que nadie me vea."
 POD_heists.2.desc.coterie: "Hemos llegado.\n\nThe guardias de [PlayerJourneyTarget.GetShortUINamePossessive] [PlayerJourneyTarget.Custom('PODDomicile')] nos hacen pasar a $POD_player_coterie$, y con eso, ya estamos dentro. Por supuesto que debíamos estar aquí. No hay razón para pensar lo contrario.\n\nNinguna en absoluto.\n\nAhora todo lo que tenemos que hacer es conseguir la llave, encontrar la bóveda de [PlayerJourneyTarget.GetFirstNamePossessiveNoTooltip] y llenarnos los bolsillos sin causar alboroto."
 POD_heists.2.desc.nocoterie: "He llegado.\n\nThe guardias de [PlayerJourneyTarget.Custom('PODDomicile')] de [PlayerJourneyTarget.GetShortUINamePossessive] me dan la bienvenida, y con eso, ya estoy dentro. Por supuesto que debía estar aquí. No hay razón para pensar lo contrario.\n\nNinguna en absoluto.\n\nAhora lo único que tengo que hacer es conseguir la llave, encontrar la cámara acorazada de [PlayerJourneyTarget.GetFirstNamePossessiveNoTooltip] y llenar mis bolsillos sin armar un escándalo."

 POD_heists.3.t: "En la guarida del león"
 POD_heists.3.desc.coterie: "Hemos llegado.\n\nNo hay sonido, salvo por los pasos amortiguados de $POD_player_coterie$. Nos hemos asegurado de permanecer ocultos y no llamar la atención, porque una vez que estemos en este lugar, será #bold;N matar a la vista#!. Este es el territorio de nuestros enemigos.\n\nAhora debemos encontrar rápidamente el escondite de [PlayerJourneyTarget.GetShortUIName] y acabar con [PlayerJourneyTarget.GetHerHim], no sea que alertemos a sus lacayos de nuestra presencia."
 POD_heists.3.desc.nocoterie: "He llegado.\n\nNo hay sonido, salvo por mis pasos amortiguados. Me he asegurado de permanecer oculto y no llamar la atención, porque una vez que esté en este lugar, será #bold;N matar a la vista#!. Este es el territorio de mis enemigos.\n\nAhora debo encontrar rápidamente el escondite de [PlayerJourneyTarget.GetShortUIName] y acabar con [PlayerJourneyTarget.GetHerHim], no sea que alerte a sus lacayos de mi presencia."
 POD_heists.3.a: "La caza ha comenzado."

 POD_heists.100.t: "Escape exitoso"
 POD_heists.100.desc.coterie: "Hemos abandonado la corte de [CurrentHeistTarget.GetShortUIName]. Por fin somos libres.\n\n"
 POD_heists.100.desc.nocoterie: "He abandonado la corte de [CurrentHeistTarget.GetShortUIName]. Por fin soy libre.\n\n"
 POD_heists.100.desc.artifact: "El/la [displayed_artifact.GetName] está a salvo en mi morral. Nadie me vio tomarlo. Un éxito rotundo, en lo que a mí respecta."
 POD_heists.100.desc.noartifact: "No he logrado conseguir el/la [CurrentHeist.Var('target_artifact').Artifact.GetName]. Esta vez no. Una decepción, sin duda, pero la próxima vez estaré más preparado."
 POD_heists.100.desc.hunt: "[CurrentHeist.Var('hunt_target').Char.GetShortUIName] ha sido derrotad[ROOT.Char.Custom('ES_OA')]. Un monstruo menos en este mundo. Una causa de celebración, desde luego, pero aún quedan más monstruos en la noche.\n\nLa labor de un Cazador nunca termina."
 POD_heists.100.desc.nohunt: "[CurrentHeist.Var('hunt_target').Char.GetShortUIName] sigue suelto/a. Esta caza ha fracasado. Sea como sea, puedo considerarme afortunad[ROOT.Char.Custom('ES_OA')] de seguir con vida y poder cazar otro día.\n\nLa labor de un Cazador nunca termina."
 POD_heists.100.desc.gold: "Su tesorería es [gold_i|E][CurrentHeist.Var('stolen_gold').GetValue|V0] más ligera, gracias a mis esfuerzos. Una salida nada mala."
 POD_heists.100.desc.nogold: "Esta vez no he logrado robar nada de [gold|E]. Una decepción, sin duda, pero la próxima vez estaré más preparado."
 POD_heists.100.a.success.coterie: "Otra victoria para $POD_player_coterie$."
 POD_heists.100.a.success.nocoterie: "Otra medalla en mi historial."
 POD_heists.100.a.failure: "Ya estoy planeando mi próximo movimiento..."

 POD_heist_levelup_hint_desc: "Si completas con éxito $VALUE|V0$ [Concept( 'infiltration', SelectLocalization( EqualTo_int32( '(int32)1', '(int32)$VALUE|0q$' ), 'game_concept_infiltration_mission', 'game_concept_infiltration_missions' ) )|E], ganarás [GetModifier('infiltration_experience_modifier').GetNameWithTooltip]."

 POD_heists.101.t: "Y así termina"
 POD_heists.101.desc: "Has forzado la suerte. Era inevitable que se agotara tarde o temprano.\n\nEl séquito de [heist_imprisoner.GetFirstNameNicknamed] te rodea. No hay escapatoria. No hay fanfarria mientras te escoltan a una celda de prisión.\n\nSentad[ROOT.Char.Custom('ES_OA')] tras los barrotes, te das cuenta de que es poco probable que tengas un juicio justo."
 POD_heists.101.desc.spirit: "Has forzado la suerte. Era inevitable que se agotara tarde o temprano.\n\nEl séquito de [heist_imprisoner.GetFirstNameNicknamed] te rodea. No hay escapatoria. No hay fanfarria mientras te escoltan a una celda de prisión.\n\nUna celda mundana no puede retener a un Espíritu como tú, por supuesto. En un instante, ya estás fuera. Pero el daño a tu reputación no se solucionará tan fácilmente."
 POD_heists.101.desc.landless: "Has forzado la suerte. Era inevitable que se agotara tarde o temprano.\n\nEl séquito de [heist_imprisoner.GetFirstNameNicknamed] te rodea. No hay escapatoria. No hay fanfarria mientras te escoltan fuera.\n\nTienes suerte de que este/a [heist_imprisoner.Custom('PODDomicile')] no tenga una celda de prisión; de lo contrario, estarías en ella ahora mismo. Pero, de cualquier modo, es seguro que los rumores sobre tu falta de fiabilidad se extenderán rápidamente tras esto."
 POD_heists.101.a: "Solo un contratiempo temporal, seguramente."

 POD_heists.103.desc: "Has forzado la suerte. Era inevitable que se agotara tarde o temprano.\n\nEl séquito de [heist_imprisoner.GetFirstNameNicknamed] te rodea. No hay escapatoria. No hay fanfarria ni juicio, solo la mirada despectiva del/de la [heist_imprisoner.Custom('PODSplat')] mientras [heist_imprisoner.GetSheHe] te pasa por la espada.\n\nAl menos [heist_imprisoner.GetSheHe] lo terminó rápido."
 POD_heists.103.a.resurrection: "Volveré, acuérdate de lo que te digo..."

 POD_heist_legitimacy_loss_tt: "Debido a que te atraparon robando a un/a [vassal|E], has perdido [legitimacy_i][EmptyScope.ScriptValue('major_legitimacy_loss')|V0] de [legitimacy|E]"

 POD_heists.200.t: "¿Qué hacer contigo?"
 POD_heists.200.t.relation: "Reencuentro"
 POD_heists.200.desc: "Al recorrer las celdas de la prisión de [CurrentHeistTarget.GetShortUIName], me encuentro con mi/a [GetPlayer.Custom2('RelationToMeShort', SCOPE.sC('prisoner_to_release'))], [prisoner_to_release.GetShortUIName]. [prisoner_to_release.GetSheHe|U] se muestra visiblemente aliviad[ROOT.Char.Custom('ES_OA')] de verme."
 POD_heists.200.desc.stranger: "Al recorrer las celdas de la prisión de [CurrentHeistTarget.GetShortUIName], me encuentro con [prisoner_to_release.GetShortUIName]."
 POD_heists.200.desc.hostile: "Al recorrer las celdas de la prisión de [CurrentHeistTarget.GetShortUIName], me encuentro con [prisoner_to_release.GetShortUIName].\n\nNo le tengo mucha utilidad a un/a despreciable [prisoner_to_release.Custom('PODSplat')] como [prisoner_to_release.GetHerHim], pero quizá pueda sacar provecho de [prisoner_to_release.GetHerHim] de otra manera."
 POD_heists.200.a: "Vamos, salgamos de aquí."
 POD_heists.200.b: "Te sacaré de aquí... por un precio."
 POD_heists.200.c: "¿Te gustaría unirte a mi corte?"
 POD_heists.200.d: "Podría matarte aquí mismo y nadie se enteraría..."

 POD_heists.202.t: "Una victoria muy disputada"
 POD_heists.202.desc: "[sc_loser.GetShortUIName] ya no puede interponerse en mi camino.\n\n¿Qué debería hacer con/con [sc_loser.GetHerHim]?"
 POD_heists.202.a: "Muere de una vez."
 POD_heists.202.a.dead: "No mucho, ya que [sc_loser.GetSheHe] murió durante la Contienda."
 POD_heists.202.b: "Someter a/a [sc_loser.GetHerHim] y llevarlo/la a mi prisión."
 POD_heists.202.c: "Dejar ir a/a [sc_loser.GetHerHim] sería una humillación adecuada."

 POD_heists.203.t: "Última luz"
 POD_heists.203.desc.rational: "[adversary.GetFirstName] parece imperturbad[ROOT.Char.Custom('ES_OA')] por mi llegada, con sus ojos irradiando una inteligencia gélida que parece tener el control absoluto de cualquier situación. A este no hay que subestimarlo/a."
 POD_heists.203.desc.irrational: "Incluso para un engendro, [adversary.GetFirstName] parece trastornad[ROOT.Char.Custom('ES_OA')] e impredecible. Pase lo que pase después, esto se va a complicar."
 POD_heists.203.desc.compassionate: "[adversary.GetFirstName] casi parece triste cuando entro con mi arma desenvainada, como diciendo: «es una lástima que haya tenido que llegar a esto». Pero ambos sabemos que no hay otra manera."
 POD_heists.203.desc.callous: "Desde el primer momento, está claro que a [adversary.GetFirstName] no le queda nada de Humanidad. Este es el tipo de enemigo más peligroso: aquel que no valora a sus semejantes, excepto como piezas en un tablero de juego o, tal vez, como carne."
 POD_heists.203.desc.honorable: "[adversary.GetFirstName] me mira a los ojos con determinación, sin perder nunca su compostura y porte caballeresco."
 POD_heists.203.desc.dishonorable: "Al entrar, los ojos de [adversary.GetFirstNamePossessive] recorren la habitación como si buscaran una ruta de escape, una trampa oculta o algo con lo que golpearme sigilosamente. Debería considerarme afortunad[ROOT.Char.Custom('ES_OA')] de que [adversary.GetSheHe] se haya quedado corto."
 POD_heists.203.desc.coterie: "\n\n$POD_player_coterie$ solo tiene un segundo para decidir qué curso de acción tomar."
 POD_heists.203.desc.nocoterie: "\n\nNo hay lugar donde escapar. Solo queda una opción."
 POD_heists.203.a: "He venido a acabar contigo."
 POD_heists.203.a.tt: "Lucharás contra [adversary.GetShortUIName] en un duelo singular."
 POD_heists.203.b: "[prowess_duelist.GetFirstName], toma la iniciativa."
 POD_heists.203.b.success: "Una victoria decisiva"
 POD_heists.203.b.failure: "Un movimiento en falso y todos pereceremos"

 POD_heists.205.desc: "Mi sombrío trabajo ha terminado. El engendro [sc_loser.GetFirstName] ha sido derrotado.\n\nLa piedad nunca fue una opción."

 POD_heists.206.t: "Demasiado lento"
 POD_heists.206.desc.coterie: "Esto solo podría haber funcionado si hubiéramos tomado la iniciativa. Hemos fallado.\n\n[adversary.GetFirstName|U] esquiva nuestros golpes con facilidad y, cuando la puerta se abre de golpe y los guardias rodean nuestro grupo, me doy cuenta de que [adversary.GetSheHe] solo estaba ganando tiempo.\n\nSin ninguna posibilidad de ganar, nos aniquilan uno a uno.\n\nMi [GetPlayer.Custom2('RelationToMeShort', SCOPE.sC('friend'))] [friend.GetFirstName], mi valiente camarada de armas, me mira suplicante una última vez antes de que [friend.GetSheHe] perezca como los demás.\n\nLos he condenado. Los he condenado a todos."
 POD_heists.206.desc.nocoterie: "Esto solo podría haber funcionado si yo hubiera tomado la iniciativa. He fallado.\n\n[adversary.GetFirstName|U] esquiva mis golpes con facilidad y, cuando la puerta se abre de golpe y los guardias me rodean, me doy cuenta de que [adversary.GetSheHe] solo estaba ganando tiempo.\n\nAhora no tengo ninguna posibilidad de ganar.\n\nLos guardias también lo saben y me infligen una herida superficial tras otra. Con desprecio. Como si estuvieran jugando con su comida. Pero sé que es solo cuestión de tiempo antes de que se cansen de esto.\n\n¿En qué estaba pensando al venir aquí yo solo?"
 POD_heists.206.a: "¡ESPERA! ¡No me mates! Puedo servirte como Ghoul."
 POD_heists.206.b: "¡ESPERA! ¡No me mates! Puedo servirte como Esclavo." # unused
 POD_heists.206.c: "Afrontaré mi muerte con dignidad."

 POD_heists.207.t: "El primer golpe es gratis"
 POD_heists.207.desc.rational: "[adversary.GetFirstNameNoTooltip|U] parece absort[ROOT.Char.Custom('ES_OA')] en sus pensamientos. Para su crédito, [adversary.GetSheHe] considera seriamente mi oferta. Luego, asiente con brusquedad. «Sí, esto es aceptable».\n\n[adversary.GetSheHe|U] saca un cuchillo y se corta la muñeca con naturalidad. «Tus antiguos aliados te perseguirán por esto. Tienes una estrategia de escape, ¿verdad? Si no es así, formula una. Espero cierto grado de iniciativa de mis subordinados».\n\nPuedo ver lo que esto significa para [adversary.GetHerHim]. Una transacción. Nada más, nada menos.\n\nAhora todo lo que tengo que hacer es beber su sangre y entregarme."
 POD_heists.207.desc.irrational: "[adversary.GetFirstNameNoTooltip|U] se detiene en seco. Por una vez, este desquiciado chupasangre se ha llevado una sorpresa. Su rostro se contorsiona de un lado a otro, pasando por todo un Viaje de expresiones antes de asentarse en una gran sonrisa. Se supone que es amistosa. Creo.\n\n«Sí, por #italic supuesto#! podemos ser amigos. Dejemos las cosas en el pasado, ¿eh? Vamos, vamos. Celebremos nuestra nueva amistad con un bocado».\n\n[adversary.GetSheHe|U] se refiere a su sangre. Naturalmente."
 POD_heists.207.desc.compassionate: "[adversary.GetFirstNameNoTooltip|U] sonríe ante mis palabras. «Me alivia oír eso. Sería una lástima librar al mundo de un/a [ROOT.Char.Custom('WomanManGirlBoy')] tan notable. Aunque hayamos empezado como enemigos».\n\n[adversary.GetSheHe|U] vacila un momento. «Tenía que asegurarme de que lo hicieras por tu propia voluntad. Una vez que pruebes mi sangre, tu voluntad dejará de ser tuya. No me tomo esto a la ligera».\n\nCon una gran solemnidad, [adversary.GetSheHe] se corta la muñeca y deja que su sangre brote."
 POD_heists.207.desc.callous: "Mientras las palabras salen de mi boca, me pregunto si he cometido el mayor error de mi vida. [adversary.GetFirstNameNoTooltip|U] me rodea lentamente y me mira de arriba abajo, como un animal depredador que sabe que su presa no puede escapar.\n\nNo. [adversary.GetSheHe|U] es algo distinto. Un animal parpadearía, o respiraría, o mostraría emoción, o cualquier otra señal de vida. [adversary.GetFirstNameNoTooltip|U] simplemente observa, con el rostro como una máscara.\n\nLentamente, [adversary.GetSheHe] toma una daga y se abre la muñeca. La sangre se acumula alrededor de la punta de la hoja. [adversary.GetSheHe|U] nunca rompe el contacto visual.\n\n«Sí», dice finalmente [adversary.GetSheHe].\n\n«Te vendrás bien»."
 POD_heists.207.desc.honorable: "«Impresionante. Después de todo lo que ha transcurrido esta noche, sabiendo que habías planeado cazarme como a un animal, todavía me miras a los ojos y apelas a mi sentido del honor. Podría ejecutarte aquí mismo, y estaría justificado al hacerlo».\n\n[adversary.GetFirstNameNoTooltip|U] suspira. Un gesto teatral para un ser que no necesita respirar.\n\n«Pero no lo haré. Tienes razón, tengo sentido del honor. Pero me has contraído una gran deuda esta noche. Demuéstrame que estás dispuesto a pagarla. Jura este juramento sobre mi sangre».\n\n[adversary.GetSheHe] se corta la muñeca y me ordena que beba."
 POD_heists.207.desc.dishonorable: "«¿Qué?», suelta [adversary.GetFirstNameNoTooltip]. «¿Es una trampa? ¿Por qué clase de bufón me tomas?»\n\n[adversary.GetSheHe|U] parece indignad[ROOT.Char.Custom('ES_OA')] por un momento, pero se tranquiliza rápidamente.\n\n«No, por supuesto que no. Solo intentas salvar tu propio pellejo. Puedo respetar eso. Incluso llegarías al extremo de convertirte voluntariamente en mi peón».\n\n«Para responder a tu pregunta... sí, aceptaré encantad[ROOT.Char.Custom('ES_OA')] un nuevo peón. Obviamente». [adversary.GetSheHe|U] muerde su muñeca y me la acerca, como si no pudiera esperar a terminar con esto. «Bebe y lárgate de mi vista. Tendré trabajo para ti muy pronto»."
 POD_heists.207.a: "Bebo de la muñeca ofrecida y mi destino queda sellado..."

# unused event: demon thrall version
# not implemented since demon hunts don't have a heist version currently
 POD_heists.208.t: "El diablo que conoces..."
 POD_heists.208.desc: "«¡Excelente!», dice [adversary.GetFirstNameNoTooltip], con aspecto muy satisfecho. «Como has consentido, esto solo llevará un momento». [adversary.GetSheHe|U] presiona su dedo contra mi frente y #italic LO GIRA#!.\n\n#italic Los eones pasan en un instante.#!\n\n#italic en lagos de fuego mi piel es desollada y veo el fin de todas las cosas, toda la creación tiembla ante el Señor y somos Sus hijos impenitentes y cuando Su justa ira se revele, Él#!\n\n«¡Ahí lo tienes!», exclama [adversary.GetFirstNameNoTooltip] radiante mientras [adversary.GetSheHe] retira su dedo de mi frente. «Ahora, si me disculpas, tengo otros pecadores a los que atender. Por cierto, ahora tú también eres un pecador. ¡Chao!».\n\n[adversary.GetSheHe|U] se aleja tranquilamente y me deja solo con mis pensamientos."
 POD_heists.208.a: "No puedo evitar sentir que he perdido algo importante."

 ####### Suspicion Events

 # Chancellor route (Vassal opinion) [Dee]

 POD_heists.1001.t: "Complicación: Demasiado popular"
 POD_heists.1001.desc.coterie: "Nuestra [infiltration|E] ha ido bien hasta ahora... demasiado bien, de hecho. Nadie ha dudado de nuestra historia de cobertura de estar en una «misión diplomática», así que estamos teniendo que responder a muchas preguntas sobre relaciones exteriores."
 POD_heists.1001.desc.nocoterie: "Mi [infiltration|E] ha ido bien hasta ahora... demasiado bien, de hecho. Nadie ha dudado de mi historia de cobertura de estar en una «misión diplomática», así que estoy teniendo que responder a muchas preguntas sobre relaciones exteriores."
 POD_heists.1001.desc.end: "\n\n[diplomacy_courtier.GetFirstNameNicknamed] se aclara [diplomacy_courtier.GetHerHis] garganta. «¿Qué propones que se haga en respuesta a la creciente amenaza del expansionismo [flavortext_realm.GetAdjective]?»"
 POD_heists.1001.a: "Es sencillo. Déjame explicarlo..."
 POD_heists.1001.a.success: "Tu historia de cobertura se mantiene"
 POD_heists.1001.a.failure: "Hay algunas inconsistencias"
 POD_heists.1001.b.coterie: "Discúlpennos un momento."
 POD_heists.1001.b.nocoterie: "Discúlpame un momento."

 POD_heists.1002.t: "Complicación: El [chancellor.GetCouncilTitle]"
 POD_heists.1002.t.target: "Complicación: El/la [chancellor.Custom('WomanManGirlBoy')] [chancellor.GetHerselfHimself]"
 POD_heists.1002.desc.coterie: "Logramos escabullirnos de la bulliciosa multitud de cortesanos, pero parece que nuestras andanzas han llamado la atención de alguien.\n\n"
 POD_heists.1002.desc.nocoterie: "Logré escabullirme de la bulliciosa multitud de cortesanos, pero parece que mis andanzas han llamado la atención de alguien.\n\n"
 POD_heists.1002.desc: "Es [chancellor.GetCouncilTitle] de [CurrentHeistTarget.GetFirstNamePossessive], [chancellor.GetFirstNameNicknamed].\n\n"
 POD_heists.1002.desc.target: "Es [chancellor.GetFirstNameNicknamed], nadie menos que la persona a cargo.\n\n"
 POD_heists.1002.desc.end.coterie: "[chancellor.GetSheHe|U] nos invita a mantener una conversación más profunda sobre asuntos de importancia política, como convendría a diplomáticos de nuestra posición."
 POD_heists.1002.desc.end.nocoterie: "[chancellor.GetSheHe|U] me invita a mantener una conversación más profunda sobre asuntos de importancia política, como convendría a un diplomático de mi posición."
 POD_heists.1002.desc.end: "\n\n¿Sospecha [chancellor.GetSheHe] algo? [chancellor.GetHerHis|U] rostro es inexpresivo."
 POD_heists.1002.a.coterie: "Por supuesto. Nos uniremos a vos."
 POD_heists.1002.a.nocoterie: "Por supuesto. Me uniré a vos."
 POD_heists.1002.a.success: "Habéis tenido una charla encantadora"
 POD_heists.1002.a.failure: "Habéis logrado parecer sospechosos"
 POD_heists.1002.b.coterie: "Debemos declinar."
 POD_heists.1002.b.nocoterie: "Debo declinar."

 POD_heists.1003.t: "Complicación: Solo una cosa más..."
 POD_heists.1003.desc.coterie: "[chancellor.GetFirstNameNicknamed] se cruza en nuestro camino una vez más, intentando que parezca algo tan sumamente casual que raya en la parodia."
 POD_heists.1003.desc.nocoterie: "[chancellor.GetFirstNameNicknamed] se cruza en mi camino una vez más, intentando que parezca algo tan sumamente casual que raya en la parodia."
 POD_heists.1003.desc.end: "\n\n«Oh, escuchad, hay otra cosa que quería preguntaros», comienza [chancellor.GetSheHe]. «Un sirviente me dice que os ha visto pasar demasiado tiempo en lugares prohibidos para los visitantes. Suena absurdo, lo sé. En cualquier caso, solo quería verificar vuestras credenciales, un pequeño trámite, en realidad...»"
 POD_heists.1003.a: "Oh, puedo aclarar este simple malentendido."
 POD_heists.1003.a.success: "Resulta que puedes"
 POD_heists.1003.a.failure: "Resulta que no puedes"
 POD_heists.1003.b: "Quítate de mi camino."


 # Spymaster route (Rivalries) [Dee]

 POD_heists.1011.t: "# sin cambios"
 POD_heists.1011.desc.coterie: "Habíamos elegido el peor momento posible para infiltrarnos en [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]. "
 POD_heists.1011.desc.nocoterie: "Había elegido el peor momento posible para infiltrarme en [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier]. "
 POD_heists.1011.desc: "Alguna disputa territorial ha sumido a esta corte en el caos. Se habla de guerra.\n\nLa tensión es tan densa que podrías cortarla con un cuchillo. Todo el mundo aquí solo busca una excusa para degollar a alguien. "
 POD_heists.1011.desc.end.coterie: "Y como recién llegados a esta corte, somos presas fáciles.\n\n[potential_rival.GetFirstNameNicknamed] nos interpela: «¿Estáis con nosotros? ¿O estáis contra nosotros?»."
 POD_heists.1011.desc.end.nocoterie: "Y como recién llegada a esta corte, soy presa fácil.\n\n[potential_rival.GetFirstNameNicknamed] me interpela: «¿Estás con nosotros? ¿O estás contra nosotros?»."
 POD_heists.1011.a.coterie: "Estamos con vos."
 POD_heists.1011.a.nocoterie: "Estoy con vos."
 POD_heists.1011.a.success: "Vuestra muestra de solidaridad parece sincera"
 POD_heists.1011.a.failure: "No es muy convincente"
 POD_heists.1011.b: "Intento cambiar de tema."
 POD_heists.1011.b.success: "Vuestro juego de manos funciona"
 POD_heists.1011.b.failure: "Error crítico"
 POD_heists.1011.c.coterie: "¿Os atrevéis a cuestionarnos?"
 POD_heists.1011.c.nocoterie: "¿Te atreves a cuestionarme?"

#  POD_heists.1011.t: "Complication: Method Acting"
#  POD_heists.1011.desc: "The key to a successful [infiltration|E] is to look non-threatening and forgettable. A clueless, backwater [GetPlayer.Custom('PODSplat')] does not draw suspicion. So that's who I pretend to be.\n\nI realize that my \"country bumpkin\" routine might've gone a little too far when [potential_rival.GetTitledFirstNamePossessive] face darkens in response to one of my comments. \"What did you just say about me, you uncouth swine?\""
#  POD_heists.1011.a: "My apologies."
#  POD_heists.1011.a.success: "You smooth things over"
#  POD_heists.1011.a.failure: "Not so smooth after all"
#  POD_heists.1011.b: "I try to change the subject."
#  POD_heists.1011.b.success: "Your sleight of hand works"
#  POD_heists.1011.b.failure: "Critical fumble"
#  POD_heists.1011.c: "Yeah. You heard what I said."
 
 POD_heists.1012.t.spymaster: "Complicación: El/la [spymaster.GetCouncilTitle]"
 POD_heists.1012.t.rando: "Complicación: El intrigante"
 POD_heists.1012.desc.coterie: "La atmósfera militarista de esta corte ha complicado nuestros planes. Nos escabullimos por un pasillo lateral, queriendo reagruparnos y hablar sobre nuestros próximos pasos. Pero no estamos solos.\n\n"
 POD_heists.1012.desc.nocoterie: "La atmósfera militarista de esta corte ha complicado mis planes. Me escabullo por un pasillo lateral, queriendo pensar en mis próximos pasos en un lugar tranquilo. Pero no estoy solo/a.\n\n"
 POD_heists.1012.desc.spymaster: "La sonrisa de [spymaster.GetFirstNamePossessive] apenas es visible desde las sombras. Qué coincidencia encontrarnos aquí con [CurrentHeistTarget.GetFirstNamePossessive] [spymaster.GetCouncilTitle].\n\n"
 POD_heists.1012.desc.rando: "La sonrisa de [spymaster.GetFirstNamePossessive] apenas es visible desde las sombras. Qué coincidencia encontrarnos aquí con el intrigante más prolífico de este Señorío.\n\n"
 POD_heists.1012.desc.end: "«No me prestéis atención», dice [spymaster.GetSheHe]. «Solo estoy haciendo ronda, vigilando posibles amenazas para la corona»."
 POD_heists.1012.a.coterie: "No tenemos ningún problema contigo."
 POD_heists.1012.a.nocoterie: "No tengo ningún problema contigo."
 POD_heists.1012.a.success: "[spymaster.GetFirstName] está satisfecho/a"
 POD_heists.1012.a.failure: "[spymaster.GetFirstName] te vigilará más de cerca"
 POD_heists.1012.b: "Deberías preocuparte más por el resto de esta corte."
 POD_heists.1012.b.success: "Has logrado desviar [spymaster.GetHerHis] atención con éxito"
 POD_heists.1012.b.failure: "Exactamente lo que diría alguien culpable"
 POD_heists.1012.c: "Vete a acechar a otra parte."

 POD_heists.1013.t: "Complicación: El antagonista principal"
 POD_heists.1013.desc: "Y ahora [court_owner.GetFirstNameNicknamed] también se ha interesado personalmente. [court_owner.GetSheHe|U] está vigilando los acontecimientos de la corte como un halcón, "
 POD_heists.1013.desc.coterie: "con [court_owner.GetHerHis] ojos posándose en nosotros más a menudo de lo habitual.\n\nTenemos que hacer algo con respecto a [court_owner.GetHerHim], si esta [infiltration|E] ha de continuar."
 POD_heists.1013.desc.nocoterie: "con [court_owner.GetHerHis] ojos posándose en mí más a menudo de lo habitual.\n\nTengo que hacer algo con respecto a [court_owner.GetHerHim], si esta [infiltration|E] ha de continuar."
 POD_heists.1013.a.coterie: "Fingimos apoyar el mandato de [court_owner.GetHerHis]."
 POD_heists.1013.a.nocoterie: "Fingo apoyar el mandato de [court_owner.GetHerHis]."
 POD_heists.1013.a.success: "Los halagos siempre funcionan"
 POD_heists.1013.a.failure: "Los halagos siempre funcionan, excepto cuando no es así"
 POD_heists.1013.b.coterie: "Intentamos escondernos entre la multitud."
 POD_heists.1013.b.nocoterie: "Intento esconderme entre la multitud."
 POD_heists.1013.b.success: "Desapareces"
 POD_heists.1013.b.failure: "Llamas aún más la atención"
 POD_heists.1013.c: "[court_owner.GetSheHe|U] puede pensar lo que quiera."


 # Coterie opinion route [Dee]

 POD_heists.1021.t: "Complicación: Discordia"
 POD_heists.1021.desc: "Algo en esta salida está sacando lo peor de $POD_player_coterie$.\n\nDiscutimos por nimiedades. Luego, por cosas importantes. Pase lo que pase, no logramos ponernos de acuerdo sobre cómo debería llevarse a cabo esta [infiltration|E]. Los desacuerdos corteses se están convirtiendo en dardos venenosos.\n\nEsto no augura nada bueno para el éxito de nuestra misión."
 POD_heists.1021.a: "Tenemos que mantenernos racionales y concentrados."
 POD_heists.1021.a.success: "Suena convincente"
 POD_heists.1021.a.failure: "Suena insultante"
 POD_heists.1021.b: "Ciñámonos al plan."
 POD_heists.1021.b.success: "Eres un líder nato"
 POD_heists.1021.b.failure: "Ni hablar"
 POD_heists.1021.c: "Supongo que necesitan desahogarse un poco."

 POD_heists.1022.t: "Complicación: La puerta"
 POD_heists.1022.desc: "Hemos encontrado nuestro rival.\n\nEs una puerta.\n\nLlevamos media hora discutiendo sobre cuál es la mejor forma de abrir su cerradura. O si debemos destruirla. O rodearla. O abrirla después de todo. ¡Media hora! Esto es absurdo."
 POD_heists.1022.a: "Si unimos fuerzas, podremos superar este desafío."
 POD_heists.1022.a.success: "La sabiduría prevalece"
 POD_heists.1022.a.failure: "¿Qué sabiduría?"
 POD_heists.1022.b: "Solo seguidme la corriente."
 POD_heists.1022.b.success: "Tus dotes de mando prevalecen"
 POD_heists.1022.b.failure: "¿Qué dotes de mando?"
 POD_heists.1022.c: "Romped la maldita cosa."

 POD_heists.1023.t: "Complicación: ¿Una lección aprendida?"
 POD_heists.1023.desc: "El conflicto puede unir a la gente. Cuando se resuelven los desacuerdos, surge una camaradería más profunda. Esta noche, hemos aprendido el valor de este tipo de experiencias de cohesión de equipo.\n\nEs broma. $POD_player_coterie$ sigue peleándose.\n\nA este paso, uno de nosotros acabará soltando algo incriminatorio."
 POD_heists.1023.a: "Sigo pensando que esto podría ser una experiencia de aprendizaje."
 POD_heists.1023.a.success: "Tu [GetPlayer.Custom('PODCoterieNoTooltip')] está de acuerdo"
 POD_heists.1023.a.failure: "Has fracasado estrepitosamente al no saber leer la situación"
