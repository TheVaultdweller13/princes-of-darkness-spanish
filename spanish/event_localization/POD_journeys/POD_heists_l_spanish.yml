 # Chaplain route (Stress) [karde]

 POD_heists.1031.t: "Complicación: Oremos"
 POD_heists.1031.desc.coterie: "Al parecer, la corte en la que nos infiltramos esta noche está en un estado de ánimo teológico.\n\n[court_chaplain.GetFirstNameNicknamed] está dando un largo sermón sobre las complejidades de su fe. Todo el mundo parece estar reunido aquí, al menos para el inicio del sermón, lo que significa que no podemos intentar escabullirnos sin parecer sospechosos.\n\nBueno, parece que toca quedarse un rato y escuchar."
 POD_heists.1031.desc.nocoterie: "Al parecer, la corte en la que me infiltro esta noche está en un estado de ánimo teológico.\n\n[court_chaplain.GetFirstNameNicknamed] está dando un largo sermón sobre las complejidades de su fe. Todo el mundo parece estar reunido aquí, al menos para el inicio del sermón, lo que significa que no puedo intentar escabullirme sin parecer sospechoso.\n\nBueno, parece que toca quedarse un rato y escuchar."
 POD_heists.1031.a: "Espero que no sea demasiado aburrido."
 POD_heists.1031.b: "¡Discursos interminables! Mi única debilidad."

 POD_heists.1032.t: "Complicación: Fervor religioso"
 POD_heists.1032.desc.coterie: "Bueno, resulta que el sermón ha sido mucho más largo de lo que anticipábamos. De hecho, seguimos allí, sin haber encontrado forma de excusarnos sin alertar potencialmente a esta corte, aparentemente muy piadosa.\n\nHace tiempo que perdí el hilo de la historia de [court_chaplain.GetFirstNamePossessive], algo sobre gente mítica haciendo cosas míticas y demás.\n\nSe detendrán en algún momento, ¿verdad?\n\n¿Verdad?"
 POD_heists.1032.desc.nocoterie: "Bueno, resulta que el sermón ha sido mucho más largo de lo que anticipé. De hecho, sigo allí, sin haber encontrado forma de excusarme sin alertar potencialmente a esta corte, aparentemente muy piadosa.\n\nHace tiempo que perdí el hilo de la historia de [court_chaplain.GetFirstNamePossessive], algo sobre gente mítica haciendo cosas míticas y demás.\n\nSe detendrán en algún momento, ¿verdad?\n\n¿Verdad?"
 POD_heists.1032.a: "Fascinante..."
 POD_heists.1032.b: "Mi paciencia tiene un límite."

 POD_heists.1033.t: "Complicación: Locura de oración"
 POD_heists.1033.desc.coterie: "Sigue igual.\n\nHemos estado a punto de quedarnos dormidos varias veces, solo despertados por un repentino arrebato de [court_chaplain.GetFirstName] cuando [court_chaplain.GetSheHe] llega a la parte más «épica» de [court_chaplain.GetHerHis] sermón. Cómo [court_chaplain.GetSheHe] consigue convertir un relato interesante en un tostón tan terriblemente largo seguirá siendo un misterio para los siglos venideros.\n\nAunque está claro que solo tenemos que esperar un poco más antes de que [court_chaplain.GetSheHe] pare y podamos reanudar nuestra misión. En cualquier momento.\n\nEspera, ¿[court_chaplain.GetSheHe] está empezando un capítulo nuevo?"
 POD_heists.1033.desc.nocoterie: "Sigue igual.\n\nHe estado a punto de quedarme dormido varias veces, solo despertado por un repentino arrebato de [court_chaplain.GetFirstName] cuando [court_chaplain.GetSheHe] llega a la parte más «épica» de [court_chaplain.GetHerHis] sermón. Cómo [court_chaplain.GetSheHe] consigue convertir un relato interesante en un tostón tan terriblemente largo seguirá siendo un misterio para los siglos venideros.\n\nAunque está claro que solo tengo que esperar un poco más antes de que [court_chaplain.GetSheHe] pare y podamos reanudar nuestra misión. En cualquier momento.\n\nEspera, ¿[court_chaplain.GetSheHe] está empezando un capítulo nuevo?"
 POD_heists.1033.a: "Quiero irme a casa."
 POD_heists.1033.b: "¡Ningún tesoro vale tanto como esto!"


