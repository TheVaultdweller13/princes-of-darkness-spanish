 # Easy route [Dee]

 POD_heists.1051.t: "Complicación: Esto es pan comido"
 POD_heists.1051.desc: "No siempre un plan sale tan bien.\n\nVerdaderamente, el [GetPlayer.Custom('PODCoterie')] de $POD_player_coterie$ está en su elemento esta noche. Estamos dando vueltas alrededor de esta corte que no sospecha nada. ¡Qué necios! Nadie sospecha ni una palabra.\n\n[coterie_member.GetFirstNameNicknamed] me guiña un ojo, disfrutando claramente de esto tanto como yo."
 POD_heists.1051.a: "Podemos bajar la guardia, esta vez."
 POD_heists.1051.b: "No tentemos a la suerte."

 POD_heists.1052.t: "Complicación: Una emoción"
 POD_heists.1052.desc: "La presión aumenta en torno a $POD_player_coterie$, pero eso solo hace que las cosas sean más emocionantes. ¿Sospecha la corte de [GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier] que algo ocurre? ¿Qué importa? Nunca nos atraparán.\n\nActuaciones como esta son las que consolidarán a $POD_player_coterie$ como un [GetPlayer.Custom('PODCoterie')] digno de leyenda."
 POD_heists.1052.a: "Contarán historias de nuestra prestidigitación en casa."
 POD_heists.1052.b: "Mejor mantener la humildad y pasar desapercibidos."

 POD_heists.1053.t: "Complicación: Sufrir por el éxito"
 POD_heists.1053.desc: "[court_owner.GetFirstNameNicknamed], también, llega para presenciar este espectáculo.\n\nPero, ¡ay! [court_owner.GetSheHe|U] ni siquiera se da cuenta de que está ocurriendo un espectáculo. La destreza de $POD_player_coterie$ es tan grande que tendrá que permanecer sin ser apreciada.\n\n¿Pero tiene por qué ser así? Un plan demencial se forma en mi cabeza..."
 POD_heists.1053.a: "«¡Oye! ¿Sabías que alguien se ha infiltrado en tu corte?»"
 POD_heists.1053.b: "No estoy TAN loco."
 POD_heists.1053.b.mad: "Puede que esté loco, pero no TAN loco."

 
