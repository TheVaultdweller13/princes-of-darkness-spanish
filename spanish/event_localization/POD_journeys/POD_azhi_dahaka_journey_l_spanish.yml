l_spanish:
 POD_azhi_dahaka_journey.1.t: "Misterios de la carne y el espíritu"
 POD_azhi_dahaka_journey.1.desc: "No hay un solo camino hacia Azhi Dahaka, sino muchos. Para estudiar el cambio en sí mismo, tu mente debe adaptarse al cambio constante. Cualquier avance debe ser investigado inmediatamente antes de que la idea cambie. Los desafíos físicos también deben ser superados, para que tu cuerpo no se pierda en el torbellino del cambio."
 POD_azhi_dahaka_journey.1.a: "Debo esforzarme aún más."
 
 
 POD_azhi_dahaka_journey.2.t: "Precipicio del poder"
 POD_azhi_dahaka_journey.2.desc: "Azhi Dahaka, Dracon, Illuyankas, Drácula y Leviatán; todos dragones. Te preguntas por qué esta bestia en particular influye tanto en la mitología de los Tzimisce. Es sencillo, en realidad. Desde la infancia de la humanidad, los dragones han plagado sus leyendas. El ganado temía a estas grandes serpientes, pero para los Tzimisce representaban un gran cambio. Los dragones son heraldos de la transformación en el borde del caos y están siempre en movimiento con formas espirales y sinuosas. No es su apariencia lo que te atrae, sino su potencial para la crisálida... y más allá. Son encarnaciones vivas de un cambio que aún no hemos comprendido verdaderamente.\nDécadas de estudio y experimentación han dado finalmente sus frutos. Has inventado un ritual que provocará una rápida metamorfosis de tu carne y tu espíritu. Solo necesitas mantener la cordura durante el proceso, o terminarás siendo una masa de carne sin mente."
 POD_azhi_dahaka_journey.2.a: "Mi ascensión está cerca."
 POD_azhi_dahaka_journey.2.tooltip: "#help Un nuevo [journey|E] está ahora disponible#!"
 
 POD_azhi_dahaka_journey.3.t: "Azhi Dahaka"
 POD_azhi_dahaka_journey.3.desc: "Como regla general, con algunas excepciones notables, los Tzimisce no tienden a la piedad devota. ¿Por qué adorar a algún dios lejano cuando puedes convertirte en uno? No es realmente una deidad. No es realmente un dogma. Azhi Dahaka es el símbolo, fetiche y foco del trascendentalismo del Clan.\nDesde el Dracon hasta Illuyankas, desde Drácula hasta el Leviatán, los dragones están profundamente entretejidos en la mitología de los Tzimisce. Lo que el ganado teme, nosotros lo anhelamos; no la forma física literal, sino lo que el dragón representa como heraldo de la transformación. Buscamos lo trascendental, recorriendo la espiral sinuosa de los anillos de Azhi Dahaka, contemplando sus muchas bocas y ojos. Donde el caos y la eternidad se encuentran en movimiento, allí es donde encontraremos el corazón palpitante del dragón, y beberemos profundamente.\nMetáfora hecha manifiesta. Acertijo hecho carne. Azhi Dahaka es el querubín quiróptero de nuestra espiritualidad alienígena y sin dioses.\nY ahora es tuyo."
 POD_azhi_dahaka_journey.3.a: "Con un solo pensamiento, la realidad cambia."
 
