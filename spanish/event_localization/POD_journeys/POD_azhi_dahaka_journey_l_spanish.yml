 #"Azhi Dahaka es el término persa para el dragón de tres cabezas del demonio Ahriman. Para los Tzimisce, es el Santo Grial del Metamorfosista, un estado de ser iluminado y definitivo, posiblemente provocado por el uso extensivo de la Vicisitud.\nTus estudios han confirmado tu primera impresión: no hay un solo camino hacia Azhi Dahaka, sino muchos. Tendrás que forjar el tuyo propio y evitar los errores de los que cayeron antes."