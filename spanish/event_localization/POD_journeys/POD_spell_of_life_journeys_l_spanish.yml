 POD_mummy_elixir_of_eternal_life_journeys.31.t: "Brebajes extraños"
 # Yes, my notes do look like this. It works... mostly
 POD_mummy_elixir_of_eternal_life_journeys.31.desc: "Tras una extensa investigación y enviar a tus agentes por todas partes, has obtenido un único vial. Al descorcharlo, un cóctel de aromas surge del líquido inescrutable que contiene, claramente una poción en preparación. Según tu pericia con las infusiones y los rumores recogidos por tus agentes, al vial solo le falta un ingrediente para estar completo. Junto al vial, en su escondite, había una colección de 7 ingredientes: Raíz de Guarnición, Aceite de Sicómoro Arcoíris, Sal de Psion, Perejil, Violeta Esquelética, Escutelaria Dorada, Boca de Dragón. Cada ingrediente confiere un efecto distinto al vial, y añadir varios arriesga que toda la mezcla explote. Por desgracia, para completar tu experimento actual necesitas precisamente una poción de amor. Sin embargo, todas las notas supervivientes están escritas en taquigrafía y la tinta se ha desvanecido durante los largos años en que quedaron desatendidas. O eso, o el autor no dominaba la caligrafía.\n\nGorr dor aviva fgo y prmv yin. Ac arcoír dsncd cmbst en jain d sol. Hrb sbrs bn pa sopa, ámlo. Bca Drgn prvc alnto d fgo. Grnsrt evta gngrna en hrds. Scut s rsdo crsoso d lagos sbtrrns; prmv obsesn cn ahnc. Crn púrp sa dslt x su ácd."
 POD_mummy_elixir_of_eternal_life_journeys.31.a: "Escutelaria Dorada"
 POD_mummy_elixir_of_eternal_life_journeys.31.b: "Perejil"
 POD_mummy_elixir_of_eternal_life_journeys.31.c: "Sal de Psion"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.31.d: "Violeta Esquelética"
 POD_mummy_elixir_of_eternal_life_journeys.31.e: "Probar a añadirlos todos"  # 25 learning
