 POD_mummy_spell_of_life_journeys.26.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que algunas pistas yacen enterradas en un antiguo templo. Sin embargo, en su interior aguarda una prueba mortal, pues los sacerdotes eran muy exigentes respecto a quién consideraban digno de sus sagrados misterios. Has encontrado una trampilla oculta tras el altar que desciende hacia la oscuridad. Tras avanzar por estrechos túneles dispuestos como un laberinto, las paredes se abren ante ti en una gran cámara circular. Ante ti hay tres portales, aparentemente tallados en la pura oscuridad del vacío y sujetos por grabados dorados. Sobre cada portal hay una cabeza de distinto color: roja, verde y azul. Al entrar en la sala, activas un mecanismo invisible y las tres cabezas empiezan a hablar en perfecta sincronía.\n\n«Oíd, buscadores del conocimiento prohibido.\nAnte vosotros se alzan los caminos del juicio.\nDe las voces que ahora os hablan, al menos una dice solo la verdad\ny al menos una dice solo mentiras.\nSabed también esto: solo una puerta conduce más allá,\nmientras que las otras dos solo dan la muerte, rápida, cierta y definitiva.\nAnte vosotros reposan la eternidad o la perdición.\nElegid con cuidado vuestro camino.»\n\nLa cabeza roja dice: «El camino seguro se encuentra bajo la única cabeza que dice la verdad.»\nLa cabeza verde dice: «Solo una cabeza dice la verdad.»\nLa cabeza azul dice: «La cabeza roja se halla sobre el camino seguro.»"  # solution is blue

 POD_mummy_spell_of_life_journeys.27.t: "Camino de oscuridad"
 POD_mummy_spell_of_life_journeys.27.desc: "Pasas entre los grabados dorados y caminas hacia el vacío, dejando que te trague. La oscuridad tira de ti y deshace tu forma como un ovillo de lana mal atado. En la mano que sostienes ante tu rostro, tus dedos se estiran como hilo tensado. Aunque dentro de este vacío infinito no tienes nada con que compararte, sabes que tu cuerpo se vuelve más largo y delgado, se estira y se enrosca, se retuerce y gira. En el telar del espacio, tu hebra es extraída y tejida en un nuevo lugar mientras tu cuerpo abandona el templo.\n\nSabes que tu única oportunidad es restablecer tu cuerpo en torno a tu mente y tu voluntad para poder adentrarte más en el templo."
 POD_mummy_spell_of_life_journeys.27.a: "Reúno mi voluntad..."  # 25 stewardship check
 POD_mummy_spell_of_life_journeys.27.effect.success: "Alcanzas tu premio"
 POD_mummy_spell_of_life_journeys.27.effect.failure: "El templo te escupe"

 POD_mummy_spell_of_life_journeys.28.t: "Huesos que repiquetean"
 POD_mummy_spell_of_life_journeys.28.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que algunas pistas yacen enterradas en una antigua tumba. Los registros históricos difieren sobre sus habitantes. Algunos dicen que allí fue enterrado un mago o hechicero. Quizá los restos de un liche fueron depositados allí por sus seguidores. Otros dicen que una momia, quizá el propio Horus, guardó su cuerpo en esta tumba entre renacimientos. Sea cual sea la verdad, las pistas yacen entre los cadáveres.\n\nTras romper piedras que han visto caer más años de los que tú has visto caer hojas, entras en una extraña caverna. Un extraño pedestal se alza en el centro y cuatro sarcófagos están erguidos, alineados con los puntos cardinales. Sobre el pedestal hay un pergamino en un recipiente sellado, y cuatro botones sobresalen de los lados del pedestal. En sus caras hay un octógono, un cuadrado, dos líneas paralelas de arriba a la izquierda a abajo a la derecha y una línea vertical. Por toda la sala hay frases extrañas, inscritas en los sarcófagos, talladas en el suelo, impresas en las paredes. «Huesos que repiquetean» aparece 4 veces. «Huesos malditos» aparece 4 veces. «Perdición atrapada» aparece 3 veces."
 POD_mummy_spell_of_life_journeys.28.a: "Pulsar los botones del octógono, el cuadrado y la línea vertical"
 POD_mummy_spell_of_life_journeys.28.b: "Pulsar el botón del cuadrado"
 POD_mummy_spell_of_life_journeys.28.c: "Pulsar el botón de las líneas paralelas"
 POD_mummy_spell_of_life_journeys.28.d: "Pulsar los botones del cuadrado, las líneas paralelas y la línea vertical"
 POD_mummy_spell_of_life_journeys.28.e: "Pulsar los botones del octógono, las líneas paralelas y la línea vertical"  # correct answer
 POD_mummy_spell_of_life_journeys.28.f: "Pulsar los botones de las líneas paralelas y la línea vertical"
 POD_mummy_spell_of_life_journeys.28.effect.success: "El recipiente se desliza"

 POD_mummy_spell_of_life_journeys.29.t: "Las estatuas se alzan"
 POD_mummy_spell_of_life_journeys.29.desc: "Al empezar a introducir la secuencia elegida, un resplandor anaranjado inunda el pedestal. Con la última pulsación, el suave resplandor anaranjado es sustituido por un destello rojo y un chirrido que proviene de todas partes. Las tapas talladas de los sarcófagos cardinales se deslizan con los gemidos dolientes de un hombre tan viejo como la propia tumba. De sus profundidades, antes ocultas, salen cuatro estatuas animadas que portan armaduras cinceladas y espadas esculpidas. Incrustados en la piedra hay huesos humanos cubiertos de antiguas runas que animan estas efigies humanoides. Trabajando en perfecta armonía, empiezan a atacarte y blanden con facilidad hojas que pesan tanto como tú."
 POD_mummy_spell_of_life_journeys.29.a: "¡Ninguna figurilla antigua puede conmigo!"  # 50 prowess check
 POD_mummy_spell_of_life_journeys.29.effect.success: "Se desmoronan ante ti"
 POD_mummy_spell_of_life_journeys.29.effect.failure: "Te hacen retroceder"

 POD_mummy_spell_of_life_journeys.30.t: "Como arriba, así abajo"
 POD_mummy_spell_of_life_journeys.30.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que algunas pistas yacen enterradas en un antiguo templo. En otro tiempo fue hogar de un culto mistérico. Algunos teorizan que los sacerdotes de aquí adoraban a Osiris e Isis, aunque sus verdaderos dioses se han perdido en las arenas del tiempo. Se supone que el culto hacía hincapié en la continuación de la vida tras la muerte. Hoy solo queda el edificio de piedra de su lugar de culto.\n\nBajo el templo hay otro oculto, en mucho mejor estado y antaño testigo de los misterios internos del culto. Es un reflejo perfecto de lo que antes estaba sobre la superficie, invertido de modo que, al descender por las escaleras, te acercas a lo que habría sido una torre que se alzaba hacia el cielo. En lo más profundo hay una sala perfectamente circular. Un haz de luz brilla desde una serie de espejos ocultos en el techo de la sala e ilumina una porción por lo demás vacía de la estancia. Sobre un pedestal sorprendentemente ligero, en el centro de la sala, hay un pergamino de papiro, antiguo y aun así intacto. Un sello con la Pluma del Juicio reposa en el frente del pergamino. Debajo, las palabras grabadas en el pedestal dicen: «¿No hay un buen escriba y hombre instruido que pueda leer esta carta que he traído a Egipto ante el Faraón sin estropear su sello? ¿Quién leerá lo escrito dentro sin romper la cera?»"
 POD_mummy_spell_of_life_journeys.30.a: "Me corto y sangro sobre el sello"
 POD_mummy_spell_of_life_journeys.30.b: "Lo envuelvo en papiro para leerlo"
 POD_mummy_spell_of_life_journeys.30.c: "Duermo con la cabeza junto a él"
 POD_mummy_spell_of_life_journeys.30.d: "Lo reubico bajo los espejos"  # correct answer
 POD_mummy_spell_of_life_journeys.30.e: "Lanzo un hechizo para leer el contenido del pergamino"  # 65 learning check; big bonus if Sorcerer/Theurgist trait
 POD_mummy_spell_of_life_journeys.30.effect.success: "Memorizas las palabras que ves"
 POD_mummy_spell_of_life_journeys.30.effect.failure: "El pergamino se desmorona al tocarlo"

 POD_mummy_spell_of_life_journeys.31.t: "Lo que queda"
 # Note: wen - an overcrowded city, a boil/cyst/tumor
 POD_mummy_spell_of_life_journeys.31.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que algunas pistas yacen enterradas entre las ruinas de una ciudad cadavérica y sepultada, pero no muerta. Más allá de las Columnas de Melqart y de las Puertas de Gades, seres impíos reclamaron una ciudad y se dieron un festín. Su ruindad se filtró en superficies que recuerdan a esferas, con ángulos que se clavan en espacios invisibles. Lo plano se inclinó, lo convexo se volvió cóncavo y las esquinas se convirtieron en bocas. Se engendraron Pesadillas, llegó el Cíclope, los siete siguieron su camino y el gran tumor se ahogó. Bueno... eso dicen las historias.\n\nAl nadar hacia abajo, ves una mampostería enferma, tan parecida a la arquitectura conocida y, sin embargo, cancerosa, tan firme y, sin embargo, rezumante como el limo de una orilla. Masas de carne y tentáculos se deslizan en silencio sobre sonrisas que sostienen rostros que reposan en la oscuridad mientras sobre ellos pasaban los siglos. Quizá esperan granos golpeados. Te abres paso hacia una ciudadela coronada de monolitos y engalanada con efigies indescriptibles y jeroglíficos indefinibles. En la cima reposa una placa cuyos símbolos cambian y se retuercen ante tu vista.\n«Soporta tu mente. Di la frase.\n2-1-16 1-2-5 1-2-17»"
 # Book cipher decoded via paragraph - sentence - word
 POD_mummy_spell_of_life_journeys.31.a: "Melqart canceroso se dio un festín"  # correct answer
 POD_mummy_spell_of_life_journeys.31.b: "Muerto pero soñando"
 POD_mummy_spell_of_life_journeys.31.c: "Cadavérico cíclope ahogado"
 POD_mummy_spell_of_life_journeys.31.d: "Más allá del tumor, lo convexo se volvió cóncavo, cambia y se retuerce"
 POD_mummy_spell_of_life_journeys.31.e: "Dejo que mi intuición me guíe"  # 25 learning check
 POD_mummy_spell_of_life_journeys.31.effect.success: "Los secretos se revelan en el retorcerse"
 POD_mummy_spell_of_life_journeys.31.effect.failure: "Se retuerce y se aleja de ti"

 POD_mummy_spell_of_life_journeys.32.t: "El Dique de los Sueños"
 POD_mummy_spell_of_life_journeys.32.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que algunas pistas yacen en los restos de la casa de un noble. La ruina está enterrada bajo la tierra que dejaron incontables crecidas del río cercano. Dentro de la casa debería haber un libro encerrado en una caja de hierro. En la caja de hierro hay una caja de cobre. En la caja de cobre hay una caja de madera de enebro. En la caja de madera de enebro hay una caja de marfil y ébano. En la caja de marfil y ébano hay una caja de plata. En la caja de plata hay una caja de oro, y en ella está el libro.\n\nRaspas las capas de tierra y atraviesas lo que fue una puerta. Cruzas antiguos salones y desciendes a lo que fue un sótano y ahora es poco más que un agujero iluminado por un verde antinatural. Y qué verde: viene de todos los ángulos y, sin embargo, claramente se origina en un desgarro irregular de la realidad. Las historias te hablaron del llamado Dique de los Sueños. Cruzarlo te deja al borde de un acantilado. El aire zumba con el verde que viste antes y late al compás de tu corazón. Extendidas ante ti y por debajo hay seis millas de serpientes gigantes, cocodrilos, arañas, escorpiones y toda forma de reptil y arácnido jamás vista o imaginada. Se enroscan y desenroscan y forman vastos patrones vivos. Círculos dentro de círculos, colas rozando dientes, consumiéndose sin fin. Al otro lado del Mar de Serpientes reposa un uróboros, con los colmillos hundidos en su propia cola, que rodea eternamente la caja que buscas.\n\nLas antiguas historias dicen que estas criaturas aguardan una única orden. Una palabra para detener sus movimientos, para cambiar sus patrones, para formar un puente."
 POD_mummy_spell_of_life_journeys.32.a: "Conclusión"
 POD_mummy_spell_of_life_journeys.32.b: "Conflicto"
 POD_mummy_spell_of_life_journeys.32.c: "Incesante"  # correct answer
 POD_mummy_spell_of_life_journeys.32.d: "Cósmico"
 POD_mummy_spell_of_life_journeys.32.e: "Formaré una tripulación de cera y me abriré paso a cortes"  # 25 martial check
 POD_mummy_spell_of_life_journeys.32.effect.success: "Abres la caja y obtienes tu premio"
 POD_mummy_spell_of_life_journeys.32.effect.failure: "El mar de serpientes es infinito"

 POD_mummy_spell_of_life_journeys.33.t: "¡Afinidad o muerte!"
 POD_mummy_spell_of_life_journeys.33.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que algunas pistas yacen en el interior de una antigua tumba, aunque si hay o no un cuerpo en ella es objeto de gran debate. Las leyendas hablan de un sabio maestro que llevó a la locura, y a cosas peores, a varios discípulos. Era célebre por sus pruebas y por los castigos que imponía a quien no cumplía sus exigencias. Para él, quienes eran indignos de su conocimiento debían demostrar que merecían la vida. Si no, estaba más que dispuesto a corregir el problema.\n\nTras abrir la tumba y avanzar hacia abajo, entras y ves una estatua de nueve metros de altura que sostiene un pergamino tallado sobre un pedestal con una placa y 5 botones. En orden, los botones son rojo, naranja, amarillo, verde y azul. La placa bajo la estatua dice: «Descifra mis enseñanzas para demostrar tu afinidad con la magia y ganar mi conocimiento. Quizá puedas describir un automorfismo de un espacio afín. Si resultas incapaz de leer un mensaje tan simple o de hacer matemáticas tan simples, todo mi conocimiento será destruido. No intentes abrirte paso por la fuerza como un bruto ignorante.» El pergamino que sostiene la estatua dice lo siguiente:\nG2w mooi sg ix26nojyo 2t s4y8e m2 7h21o g2whmont 74hr64g e2s7oroxr. G2w m32wnj 7homm r3o 2h4xyo 9wrr2x."
 # Affine Cipher: coefficients are a=5 and b=30 (the only numbers in the event)
 # Ultimately just a monoalphabetic substitution cipher, so o always means e
 # Decodes to "You seek my knowledge of magic so prove yourself partway competent. You should press the orange button."
 POD_mummy_spell_of_life_journeys.33.a: "Pulsar el botón rojo"
 POD_mummy_spell_of_life_journeys.33.b: "Pulsar el botón naranja"  # correct answer
 POD_mummy_spell_of_life_journeys.33.c: "Pulsar el botón amarillo"
 POD_mummy_spell_of_life_journeys.33.d: "Pulsar el botón verde"
 POD_mummy_spell_of_life_journeys.33.e: "Pulsar el botón azul"
 POD_mummy_spell_of_life_journeys.33.f: "Dejo que mi intuición me guíe"  # 25 learning check
 POD_mummy_spell_of_life_journeys.33.effect.success: "El pergamino se desmorona y deja ver papel"
 POD_mummy_spell_of_life_journeys.33.effect.failure: "La estatua estalla en llamas"

 POD_mummy_spell_of_life_journeys.34.t: "La guarida del Buscador"
 POD_mummy_spell_of_life_journeys.34.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has descubierto un ingrediente necesario para el ritual final. Ese ingrediente es la bilis de un reptil extinto hace mucho, del que se dice que podía abrir la boca lo bastante para que un hombre cruzara por ella sin agacharse. Por desgracia, un antiguo buscador del Hechizo de la Vida exterminó a todos esos reptiles por culpa de sus esfuerzos fallidos. Por suerte, has hallado un lugar con fama de ser la cámara de ese buscador.\n\nMarchas por el bosque, abriéndote paso entre la maleza y las bestias. Los nudos de la madera parecen seguir tus movimientos y reprochar cada uno de tus pasos. Ramas cargadas cuelgan hacia abajo y arañan tu armadura y tu piel como garras. Por fin llegas. Huesos amarillentos asoman de la tierra y unas fauces abiertas emergen del paisaje. El viento silba entre los dientes y los afila como piedras de afilar invisibles. Bajando con cuidado las escaleras, te dejas tragar por la oscuridad. Al fondo hay primero un par de mandíbulas abiertas y luego un par de mandíbulas cerradas. En los dientes de ambas se tallaron letras ásperas y angulosas. Leyendo de izquierda a derecha desde la esquina superior, el par abierto dice: «Demuestra que debes estar aquí y se te concederá el acceso.» El par cerrado dice algo más confuso: «BTELDIIEBTELDIOETBRBRYHBAELVDYHBAEHPDOEEON»."
 # Rail fence cipher decodes to "BY THE BLADE I LIVED BY THE BLADE I HOPED TO BE REBORN" with 2 rows (like teeth)
 POD_mummy_spell_of_life_journeys.34.a: "Mostrar un vial de ácido"
 POD_mummy_spell_of_life_journeys.34.b: "Mostrar un cadáver"
 POD_mummy_spell_of_life_journeys.34.c: "Mostrar una espada"  # correct answer
 POD_mummy_spell_of_life_journeys.34.d: "Mostrar una campana"
 POD_mummy_spell_of_life_journeys.34.effect.success: "La bilis es tuya"

 POD_mummy_spell_of_life_journeys.35.t: "Un revoltijo de fauces"
 POD_mummy_spell_of_life_journeys.35.desc: "Las mandíbulas se abren con un crujido, como el de una espada que se desenvaina. Donde esperabas una escalera hacia abajo o quizá una botella a medio vaciar de bilis, hay bestias, reptiles de una clase que nunca habías visto. Se parecen a cocodrilos, aunque sus 6 patas tienen las articulaciones más parecidas a las de un caimán y una cola con púas arrastra tras sus cuerpos de tronco. De sus bocas sobresalen visiblemente decenas de dientes que apuntan hacia arriba y hacia abajo. Al parecer, aquel buscador decidió que criar a estas bestias por su bilis era mucho más fácil que cazarlas en libertad. Útil, aunque parece que se han vuelto salvajes en las eras transcurridas."
 POD_mummy_spell_of_life_journeys.35.a: "Nada que una espada no pueda arreglar"  # 50 prowess check
 POD_mummy_spell_of_life_journeys.35.effect.success: "La bilis es tuya"
 POD_mummy_spell_of_life_journeys.35.effect.failure: "Te hacen huir"

 POD_mummy_spell_of_life_journeys.36.t: "Cifras esotéricas"
 POD_mummy_spell_of_life_journeys.36.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que algunas pistas yacen en el interior de una antigua tumba, aunque si hay o no un cuerpo en ella es objeto de gran debate. Las leyendas hablan de un sabio maestro que llevó a la locura, y a cosas peores, a varios discípulos. Era célebre por sus pruebas y por los castigos que imponía a quien no cumplía sus exigencias. Para él, quienes eran indignos de su conocimiento debían demostrar que merecían la vida. Si no, estaba más que dispuesto a corregir el problema.\n\nTras abrir la tumba y avanzar hacia abajo, entras y ves una estatua de nueve metros de altura que sostiene un pergamino tallado sobre un pedestal con una placa y 4 botones. Cada botón lleva un número. La placa bajo la estatua dice: «Descifra mis enseñanzas para demostrar tu afinidad con la magia y ganar mi conocimiento. Si resultas incapaz de leer un mensaje tan simple o de hacer matemáticas tan simples, todo mi conocimiento será destruido. No intentes abrirte paso por la fuerza como un bruto ignorante.» El pergamino que sostiene la estatua dice lo siguiente:\n\nNaranja + Azul = 5 ; Azul + Rojo = 3 ; Naranja + Rojo = 4 ; Morado = ?."
 POD_mummy_spell_of_life_journeys.36.a: "Pulsar el 3" # correct answer
 POD_mummy_spell_of_life_journeys.36.b: "Pulsar el 4"  
 POD_mummy_spell_of_life_journeys.36.c: "Pulsar el 5"
 POD_mummy_spell_of_life_journeys.36.d: "Pulsar el 6"
 POD_mummy_spell_of_life_journeys.36.e: "Dejo que mi intuición me guíe"  # 25 learning check
 POD_mummy_spell_of_life_journeys.36.effect.success: "El pergamino se desmorona y deja ver papel"
 POD_mummy_spell_of_life_journeys.36.effect.failure: "La estatua estalla en llamas"

 # I made up a name for a half man-half scorpion creature, loosely based on a minotaur and Serket (scorpion goddess of protection, healing, magic)
 POD_mummy_spell_of_life_journeys.37.t: "El centinela serketaur"
 POD_mummy_spell_of_life_journeys.37.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que algunas pistas yacen en el interior de una pirámide. Los detalles de su contenido son escasos, aunque has oído hablar de su poderoso guardián. Queda por ver cuánta verdad hay en los relatos.\n\nUna niebla antinatural impregna el aire, más espesa que cualquier sopa que hayas comido y curiosamente parecida en el olor. Mientras la atraviesas, de pronto parece detenerse, como contenida por una barrera invisible. Ante ti se extienden infinitas olas de arena carmesí de sangre, resaltadas por el sol. La cumbre plateada de la pirámide se alza a lo lejos y va descendiendo lentamente hacia un mármol negro mientras coronas las dunas y te acercas cada vez más. La puerta sellada está flanqueada por dos obeliscos que parecen absorber casi la luz del sol y hacerla pulsar por las venas del mármol. Ante la puerta hay lo que al principio parece un hombre gigante con un hacha, aunque la arena se aparta enseguida y revela las patas de escorpión y el aguijón bajo su cintura. Al acercarte, el serketaur te corta el paso y habla.\n\n«Puedes hacer una declaración. Si es verdadera, te cortaré la cabeza. Si es falsa, te abriré el vientre.»"
 POD_mummy_spell_of_life_journeys.37.a: "Me cortarás la cabeza."
 POD_mummy_spell_of_life_journeys.37.b: "Me abrirás el vientre."  # correct answer
 POD_mummy_spell_of_life_journeys.37.c: "Me matarás"
 POD_mummy_spell_of_life_journeys.37.d: "¡Yo te mataré primero!"  # 50 prowess check
 POD_mummy_spell_of_life_journeys.37.effect.success: "El hacha se aparta y te deja pasar"
 POD_mummy_spell_of_life_journeys.37.effect.failure: "El hacha cae donde antes estabas"

 POD_mummy_spell_of_life_journeys.38.t: "El poder de la partida"
 POD_mummy_spell_of_life_journeys.38.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que algunas pistas yacen en el interior de una tumba. Mientras la mayoría de los buscadores del Hechizo de la Vida trabajaban por su cuenta, esta cábala de magos trabajó en conjunto para avanzar en sus objetivos. Mientras otros perseguían a solas la magia del Hechizo de la Vida, ellos buscaron un enfoque más holístico en el que mejoraban cuerpo, mente y alma. Algunos dicen que los influyeron tradiciones llegadas de tierras al este de Kemet, siguiendo las rutas comerciales. Quedan pocos detalles de su obra, aunque la palabra «akasha» aparece unas cuantas veces y su fracaso es evidente.\n\nAl principio parece no más que un agujero en el suelo, cubierto por la tierra de eras muy pasadas. Esperabas una escalera o una escalerilla, pero en su lugar una rampa desciende ante ti y se curva hacia la derecha. A cada paso y a cada giro, bajas cada vez más. Paso tras paso, giro tras giro, pasas junto a imágenes talladas que representan muchas escenas de estudio, canto, meditación, artesanía, cultivo, danza y más. Así continúa mientras cruzas portal tras portal hasta que quedan 4 portales a tu espalda. Por fin te plantas ante un portal cerrado. Sobre él hay unas palabras inscritas: «Di la verdad para continuar. Cuando somos dos de mí, somos mejores que uno. Cuando somos doscientos de mí, somos un necio ruidoso. Cuando nos movemos como uno, nada puede oponerse a nosotros. Cuando nos movemos en direcciones opuestas, no vamos a ninguna parte. ¿Qué soy?»"
 POD_mummy_spell_of_life_journeys.38.a: "Mentes"  # correct answer
 POD_mummy_spell_of_life_journeys.38.b: "Bueyes"
 POD_mummy_spell_of_life_journeys.38.c: "Tambores"
 POD_mummy_spell_of_life_journeys.38.d: "Ruedas"
 POD_mummy_spell_of_life_journeys.38.e: "Dejo que mi intuición me guíe"  # 25 learning check
 POD_mummy_spell_of_life_journeys.38.effect.success: "El portal se abre..."
 POD_mummy_spell_of_life_journeys.38.effect.failure: "Los giros solo conducen hacia arriba"

 POD_mummy_spell_of_life_journeys.39.t: "¿Qué permanece?"
 # Poem by W.H. Auden from 1940. Chosen for being generally close in theme, the repeated lines (what I use for the puzzle), and its structure as a villanelle
 POD_mummy_spell_of_life_journeys.39.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que algunas pistas yacen en el interior de una tumba. Según las leyendas, la tumba es hoy el hogar de un buscador que tejió su magia mediante la poesía. Buscaba la inmortalidad. Con su magia prolongó su vida solo para descubrir la maldición inherente a ella. Con cada año que pasaba, moría otro pariente. Con cada gran guerra, se perdían más amigos. Y, aun así, él permanecía. Mientras pasaban las estaciones y las hojas caían solo para volver a nacer, abandonó la búsqueda del renacimiento eterno. Dejó que el tiempo lo alcanzara. Y ahora... ahora su tumba está lista para que la registres en tu búsqueda de la inmortalidad.\n\nSobre el dintel de la tumba hay una frase sencilla: «Teme aquello que permanece más allá de su tiempo». El interior de la tumba es de piedra sencilla, bien labrada pero no ornamentada. Con el tiempo llegas a un largo pasillo con placas de presión, cada una con un número del 1 al 19. Al fondo hay un ataúd con 13 gemas opacas. Frente a las placas de presión hay un pedestal con un poema.\n\n«El Tiempo no dirá más que "ya te lo dije",\nel Tiempo solo conoce el precio que hay que pagar;\nsi pudiera decírtelo, te lo haría saber.\n\nSi hemos de llorar cuando los payasos hacen su número,\nsi hemos de tropezar cuando los músicos tocan,\nel Tiempo no dirá más que "ya te lo dije".\n\nNo hay fortunas que predecir, aunque,\nporque te quiero más de lo que puedo decir,\nsi pudiera decírtelo, te lo haría saber.\n\nLos vientos han de venir de alguna parte cuando soplan,\nhan de existir razones por las que las hojas se pudren;\nel Tiempo no dirá más que "ya te lo dije".\n\nQuizá las rosas de verdad quieren crecer,\nla visión pretende seriamente quedarse;\nsi pudiera decírtelo, te lo haría saber.\n\nSupón que todos los leones se levantan y se van,\ny todos los arroyos y soldados huyen;\n¿dirá el Tiempo algo más que "ya te lo dije"?\nSi pudiera decírtelo, te lo haría saber.»"
 POD_mummy_spell_of_life_journeys.39.a: "Pulsar todas las placas salvo la 3, 6, 9, 12, 15 y 18"
 POD_mummy_spell_of_life_journeys.39.b: "Pulsar todas las placas salvo la 3, 5, 7, 11, 13 y 17"
 POD_mummy_spell_of_life_journeys.39.c: "Pulsar todas las placas salvo la 4, 6, 9, 12, 15 y 19"
 POD_mummy_spell_of_life_journeys.39.d: "Pulsar todas las placas salvo la 6, 9, 12, 15, 18 y 19"  # correct answer
 POD_mummy_spell_of_life_journeys.39.e: "Pulsar todas las placas salvo la 1, 6, 9, 12, 15 y 19" 
 POD_mummy_spell_of_life_journeys.39.f: "Pulsar tantas combinaciones como sea posible"  # 25 intrigue check
 POD_mummy_spell_of_life_journeys.39.effect.success: "Las gemas brillan y la tapa se desplaza"
 POD_mummy_spell_of_life_journeys.39.effect.failure: "Las placas caen a la lava"

 POD_mummy_spell_of_life_journeys.40.t: "Camino al infierno"
 POD_mummy_spell_of_life_journeys.40.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que pueden encontrarse algunas pistas en una pirámide perdida. Algunos dicen que las pirámides de antaño recogían la luz del sol en su cima y la usaban para crear un río de luz que el alma seguía hacia el más allá. Sin embargo, no todos veían en la luz solar el mejor camino hacia las Tierras de las Sombras. Unos pocos buscaron canalizar energías más oscuras de lo profundo de la tierra y las emplearon en sus fallidos intentos del Hechizo de la Vida. Construyeron una pirámide pentagonal invertida que se hundía hondo, muy hondo en la roca. Los rumores hablan también de su obsesión por el papel de la numerología en los rituales mágicos, incluida una serie particular que funcionaba como su marca de identidad.\n\nPasas la entrada y miras hacia un vacío desierto con 5 escaleras que descienden. La vasta extensión está llena de un eco vacío que reverbera sin fin. El vacío oscuro oculta los extraños canales tallados en la piedra ennegrecida que forma las paredes de la pirámide. Más gruesas que el tronco de un árbol, unas cadenas estigias veteadas de plata van del techo al suelo y a puntos clave de las paredes. En cada uno de los 5 pisos hay una serie de números.\n13\n1113\n3113\n132113\n1113122113\n\nEn el punto más bajo de la pirámide hay un altar triangular conectado a los canales de las paredes. En los lados del altar hay 3 botones, cada uno con un número del 1 al 3."
 POD_mummy_spell_of_life_journeys.40.a: "Pulsar «132»"
 POD_mummy_spell_of_life_journeys.40.b: "Pulsar «213»"
