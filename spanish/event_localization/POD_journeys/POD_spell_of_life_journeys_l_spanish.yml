 POD_mummy_spell_of_life_journeys.43.effect.failure: "«Déjame esperar a un necio digno de mis secretos»"
 
 POD_mummy_spell_of_life_journeys.44.t: "Salones antiguos"
 POD_mummy_spell_of_life_journeys.44.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que pueden encontrarse algunas pistas en el interior de una antigua fortaleza. Al acercarte, poderosas cumbres se alzan ante ti, casi como si quisieran asir la inmortalidad de los dioses. Caminas sobre lo que antaño fue una calzada y ahora es un campo, con los pocos ladrillos de piedra que quedan apilados a lo lejos como parte de una cerca. Tus libros afirman que esto fue una concurrida ruta comercial que conducía a una ciudad minera custodiada por una ciudadela entre las montañas. Es difícil imaginar grandes caravanas cuando lo único que ves es hierba. De la ciudad no queda poco más que madera podrida, y el resto lo han recuperado quienes permanecieron en la zona. La escalinata que antaño subía a la fortaleza, tallada en las entrañas de la montaña, es ahora indistinguible de una mina abandonada. Hasta los escalones se han erosionado y dejan algo que con generosidad podría llamarse rampa. Cada paso resuena en las paredes curvas y rebota en la quietud. En lo alto hay un portal, ya sin los adornos que sin duda tuvo, pero aún firme. Los diseños que antaño se tallaron en él con esmero se han desgastado, la pintura se ha desvanecido y los adornos de oro han sido robados. Aun así, la puerta y su letrero permanecen.\n\n«Nunca fui, siempre he de ser, nadie me vio jamás ni me verá, no soy de nadie, ni tú me gobiernas. Y sin embargo soy la confianza de todos, para vivir y respirar en este salón sagrado.»"
 POD_mummy_spell_of_life_journeys.44.a: "Esperanza"
 POD_mummy_spell_of_life_journeys.44.b: "Tiempo"
 POD_mummy_spell_of_life_journeys.44.c: "Mañana"  # correct answer
 POD_mummy_spell_of_life_journeys.44.d: "Alma"  
 POD_mummy_spell_of_life_journeys.44.e: "Dejo que mi intuición me guíe"  # 25 learning check
 POD_mummy_spell_of_life_journeys.44.effect.success: "Las puertas crujen y se abren..."
 POD_mummy_spell_of_life_journeys.44.effect.failure: "Las puertas siguen cerradas, inflexibles"

 POD_mummy_spell_of_life_journeys.45.t: "Fracasos olvidados"
 # § - a whole is 1 so this represents 1
 # Ð - life and death are 2 things so 2
 # ß - 3 things so 3
 # Ǿ - 4 cardinal directions so 4
 # Ѭ - 5 fingers in a fist so 5
 # 5x5 Sudoku puzzle with unicode characters with the completed grid being:
 # 2 1 3 4 5
 # 4 2 5 3 1
 # 5 3 4 1 2
 # 1 4 2 5 3
 # 3 5 1 2 4
 POD_mummy_spell_of_life_journeys.45.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que pueden encontrarse algunas pistas en unas ruinas, aunque nadie recuerda el propósito del lugar. Los caminos pavimentados han sido quebrados por vetas de hierba. Antaño grandiosas columnas yacen hechas añicos en el suelo. Queda poco de donde antaño ondearon orgullosos los estandartes. Los muros se han vuelto decrépitos, se derrumban por toda la estructura y oscurecen aún más lo que fue. El imponente salón parece diseñado para guiar a la gente hacia un punto concreto. A cada paso pasas junto a intrincados murales y detalladas tallas que yacen entre el fango del suelo. Algunas baldosas sueltas llevan símbolos y algunas piedras, frases completas. «§ Soy la fuente, el universo, el todo inseparable §», dice la primera piedra que encuentras. La segunda dice: «Ð Soy el dominador, señor de la vida y de la muerte Ð.» Así continúa con «ß Soy todo lo que es, fue y será ß» y «Ǿ Soy la dirección primaria del planeta, símbolo de falsa libertad Ǿ.» Más adelante ves otra piedra: «Ѭ Soy el agarre de la existencia, sostenido en un puño Ѭ.» Es curioso cómo algunos símbolos son reconocibles y otros te desconciertan.\n\nCon el tiempo llegas a un portal sellado con magia y fuerza mortal. En las puertas, toscamente grabadas, están las palabras «Y así el palacio del mundo se convierte en la prisión de un necio», seguidas de una cuadrícula con algunos caracteres ausentes. Tendrás que colocar las baldosas caídas en los lugares adecuados para continuar.\n\n Ð (a) ß (b) Ѭ \n(c) Ð  Ѭ  ß (d)\n Ѭ (e) Ǿ (f) Ð \n §  Ǿ  Ð  Ѭ (g)\n ß  Ѭ (h) Ð (i)"
 POD_mummy_spell_of_life_journeys.45.a: "a=§, b=Ǿ, c=Ǿ, d=§, e=ß, f=§, g=ß, h=§, i=Ǿ"  # correct answer
 POD_mummy_spell_of_life_journeys.45.b: "a=§, b=§, c=§, d=§, e=§, f=§, g=§, h=§, i=§"
 POD_mummy_spell_of_life_journeys.45.c: "a=§, b=Ð, c=Ð, d=§, e=Ǿ, f=§, g=Ǿ, h=§, i=Ð"
 POD_mummy_spell_of_life_journeys.45.d: "a=Ð, b=§, c=§, d=Ð, e=Ǿ, f=Ð, g=Ǿ, h=§, i=Ð"  
 POD_mummy_spell_of_life_journeys.45.e: "a=ß, b=ß, c=§, d=Ð, e=Ð, f=ß, g=Ð, h=ß, i=§"
 POD_mummy_spell_of_life_journeys.45.effect.success: "El portal se abre con un chirrido..."
 
 POD_mummy_spell_of_life_journeys.46.t: "Fracasos olvidados"
 POD_mummy_spell_of_life_journeys.46.desc: "Tras elegir tu respuesta, crujidos, golpes y estallidos llegan de las paredes y del lugar que hay tras las puertas. Quizá las puertas se estén abriendo, pero tienes la sensación de que esos antiguos mecanismos no gestionaron bien tu respuesta incorrecta.\n\nAl entrar en la sala, ves dos orbes rojos que brillan tenuemente entre las sombras. Bajo ellos hay dos colmillos que cuelgan de unos labios retorcidos en una sonrisa depredadora. «Era cuestión de tiempo que me liberaran. Esos necios mortales nunca aceptaron mi nueva y gloriosa forma, ni entendieron que yo tenía toda la eternidad para esperar a que murieran. Nunca comprendieron el poder que ahora poseo, que en verdad soy el amo de la vida y de la muerte, ¡COMO SIEMPRE ESTUVE DESTINADO A SER! AHORA, ahora...», dice una forma retorcida y demacrada mientras se abalanza hacia ti. «¡Me darás poder para que ocupe mi lugar legítimo como AMO de este mundo! Todo lo que necesito de ti es algo tan barato: tu vida. Pero no te preocupes, me aseguraré de que mis adoradores te veneren como un mártir.» Esos colmillos reluyentes saltan hacia ti..."
 POD_mummy_spell_of_life_journeys.46.a: "Abatiré al necio"  # 75 prowess check
 POD_mummy_spell_of_life_journeys.46.effect.success: "Su cabeza rueda"
 POD_mummy_spell_of_life_journeys.46.effect.failure: "Ganas, pero a qué precio"
 



 POD_mummy_elixir_of_eternal_life_journeys.10.t: "Meditaciones sobre la Eternidad"
 POD_mummy_elixir_of_eternal_life_journeys.10.desc: "Solo mediante la meditación podemos llegar a comprender de verdad el ciclo del renacimiento.\n\nAunque signifique descuidar mis otras responsabilidades, retirándome en reclusión para meditar puedo aprender más sobre mí mismo y sobre cómo alcanzar el renacimiento eterno."
 POD_mummy_elixir_of_eternal_life_journeys.10.a: "Me recluiré en mi [ROOT.Char.Custom('ResidenceBuilding')]"
 POD_mummy_elixir_of_eternal_life_journeys.10.b: "Buscaré un lugar en la espesura"
 POD_mummy_elixir_of_eternal_life_journeys.10.c: "Me retiraré a un lugar aislado"
 POD_mummy_elixir_of_eternal_life_journeys.10.a.tt: "En lugar de iniciar un [journey|E], meditarás aquí, un lugar #P seguro y fácil#!"
 POD_mummy_elixir_of_eternal_life_journeys.10.b.tt: "Iniciarás un [journey|E] a #bold $elixir_of_eternal_life_stage2_meditation_name$#!, viajando a un lugar #Z moderadamente exigente#! para meditar en él"
 POD_mummy_elixir_of_eternal_life_journeys.10.c.tt: "Iniciarás un [journey|E] a #bold $elixir_of_eternal_life_stage2_meditation_name$#!, viajando a un lugar #N difícil y peligroso#! para meditar en él"
 POD_mummy_elixir_of_eternal_life_journeys.10.success: "Tu cultivo te aporta algunas revelaciones"
 POD_mummy_elixir_of_eternal_life_journeys.10.failure: "Tu meditación no aporta ninguna revelación"

 POD_mummy_elixir_of_eternal_life_journeys.11.t: "Meditaciones sobre la Eternidad"
 POD_mummy_elixir_of_eternal_life_journeys.11.desc: "Al viajar a la espesura, mi mente quedó libre de trabas y pudo vagar a su antojo. Con la ayuda del ayuno y la meditación, mis pensamientos se volvieron hacia dentro. Consideré todo lo que había aprendido. Me esforcé por afianzar mi base de cultivo y profundizar mi comprensión del renacimiento eterno."
 POD_mummy_elixir_of_eternal_life_journeys.11.a: "Las interrupciones plantearon algunas dificultades..."
 POD_mummy_elixir_of_eternal_life_journeys.11.a.success.critical: "Pero resbalaron de mi conciencia como el agua sobre el cristal"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.success: "Pero las superé"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.failure: "Y me impidieron hallar la paz interior"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.failure.critical: "Y la cacofonía interminable me frustró"
 POD_mummy_elixir_of_eternal_life_journeys.11.b: "El viaje y el propio aislamiento plantearon algunos retos..."
 POD_mummy_elixir_of_eternal_life_journeys.11.b.success.critical: "Pero la privación me dio una epifanía"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.success: "Pero las superé"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.failure: "Y me obligaron a retirarme a un refugio"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.failure.critical: "Y mis labios se agrietaron enseguida de sed"
 POD_mummy_elixir_of_eternal_life_journeys.11.internal: "Tu experiencia con la meditación y tu dominio de tu cuerpo aumentan tu probabilidad de éxitos críticos y reducen tu probabilidad de fallos críticos"

 POD_mummy_elixir_of_eternal_life_journeys.21.t: "[Concept('translation_minigame', 'Traducción')|E] de registros esotéricos"
 POD_mummy_elixir_of_eternal_life_journeys.21.desc: "Tus esfuerzos han dado con un registro esotérico de una antigüedad indeterminada. A pesar de tu familiaridad con varios idiomas y de las capacidades lingüísticas de tus cortesanos, vuestros esfuerzos combinados no han bastado para hacerlo interpretable. Una tinta invisible oculta detalles cruciales. Palabras cifradas salpican el texto. Las partes escritas en una lengua conocida apenas son interpretables y exigen un dominio técnico y mágico que apenas empiezas a alcanzar. La taquigrafía del autor complica aún más tus esfuerzos de traducción.\n\nUna palabra concreta, de cinco letras, parece ser la clave para traducir el resto. Por desgracia, solo tendrás 6 oportunidades, pues tus esfuerzos son bastante destructivos."
 POD_mummy_elixir_of_eternal_life_journeys.21.b: "¡Me rindo!"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.success: "Tu traducción tiene éxito"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.failure: "Tu traducción fracasa"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.failure.details: "Tus intentos fallidos destruyeron el registro"

 POD_mummy_elixir_of_eternal_life_journeys.22.t: "Salones del reflejo infinito"
 POD_mummy_elixir_of_eternal_life_journeys.22.desc: "A través de tus investigaciones y exploraciones, descubriste una antigua técnica para ayudar en el cultivo: los Salones del Reflejo Infinito. Al colocarte en el centro de una formación ritual hecha de espejos, el poder que llevas dentro se reflejará sobre sí mismo y en sí mismo muchas veces antes de volver a entrar en tu cuerpo. Ese poder se amplificará aún más al recorrer las formas geométricas empleadas para construir la formación.\n\nAl situarte en el núcleo de la formación, hay dos espejos colocados casi uno frente al otro, de modo que puedes verte por encima del hombro, curvándote sin fin hacia el universo del espejo. Al volver los ojos hacia dentro, sientes cómo te viertes en ti mismo y te multiplicas a través de los reflejos infinitos. Desde la perspectiva de un observador, sería casi imposible determinar dónde terminan los espejos y dónde empiezas tú.\n\nAl principio todo va bien. Tu cultivo avanza a pasos agigantados. Entonces sientes cómo te resquebrajas y te haces añicos en infinitas esquirlas, cada una un reflejo fractal de tu forma, antes de fluir hacia la superficie plateada del espejo que tienes delante. Cuando despiertas, un mundo plateado y estratificado se extiende ante ti, perfectamente liso, perfectamente interminable. En cada giro hay un reflejo tuyo, perfecto pero inmaterial, que te imita aunque cada uno lleva una expresión distinta, única incluso entre todos los demás. No hay dos sonrisas exactamente iguales, ni dos ceños fruncidos. No se mueven mientras caminas entre ellos y a través de ellos, solo se giran para que sus ojos te sigan. Entre la sorpresa y el pánico, te viene a la mente una vieja historia del Señorío del Espejo. «Solo hallando lo real puede uno escapar de la prisión de su propio reflejo.»"
 POD_mummy_elixir_of_eternal_life_journeys.22.a: "Señalarte a ti mismo"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.22.b: "Intentar hallar la copia imperfecta"
 POD_mummy_elixir_of_eternal_life_journeys.22.c: "Cerrar los ojos y correr a través de las copias"
 POD_mummy_elixir_of_eternal_life_journeys.22.d: "Buscar patrones y formas"
 POD_mummy_elixir_of_eternal_life_journeys.22.e: "¿Recuerdo más de aquella historia?"  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.22.effect.success: "Los reflejos se hacen añicos y se funden contigo"
 POD_mummy_elixir_of_eternal_life_journeys.22.effect.failure: "Atraviesas muchos reflejos antes de escapar"

 POD_mummy_elixir_of_eternal_life_journeys.23.t: "Un alijo de píldoras"
 POD_mummy_elixir_of_eternal_life_journeys.23.desc: "Tu última expedición te condujo a un alijo de 4 píldoras medicinales que dejó atrás alguien que antes buscó el Elixir de la Vida Eterna. Entre los restos de las notas, averiguas que te beneficiarías enormemente tomando exactamente una de cada uno de los 2 tipos de píldora cada día. Sin embargo, tomar demasiado de un solo tipo anulará los beneficios. Por desgracia, las píldoras están mezcladas en un solo frasco, sin marcar y con idéntico aspecto. ¿Cómo puedes asegurarte de tomar las píldoras correctas?"
 POD_mummy_elixir_of_eternal_life_journeys.23.a: "Tomar 3 píldoras el primer día y 1 el segundo"
