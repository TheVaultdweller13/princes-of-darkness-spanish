 POD_mummy_spell_of_life_journeys.40.effect.failure: "Mientras los canales brillan, te encuentras en otro lugar"
 
 POD_mummy_spell_of_life_journeys.41.t: "Piedras que se desmoronan"
 POD_mummy_spell_of_life_journeys.41.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que pueden encontrarse algunas pistas en el lugar ritual de un buscador que desapareció tras realizar su versión del Hechizo de la Vida. Más que en casi cualquier otro lugar que hayas visitado, de esta tumba queda poco. La niebla se arremolina en el aire y forma rocío en tus manos. El aire está cargado de ozono, que te abruma las fosas nasales. Las plantas crujen y los sonidos de los animales llegan suavemente a tus oídos como desde gran distancia. Al pasar, los helechos se doblan bajo tus pies antes de erguirse lentamente a tu espalda y borrar todo rastro de tu camino. La naturaleza se ha apoderado del otrora gran templo. Los capiteles de las columnas yacen entre las raíces de árboles que quizá son anteriores incluso a ti. Los ladrillos de piedra tallada se desmoronan a cada paso. Por fin llegas a lo que fueron los cimientos de la tumba y ahora es un círculo de piedras resquebrajadas. En el centro hay un hombre translúcido de edad indescifrable, que parece sentado en una silla invisible.\n\n«Ah, pocos necios llegan a este lugar. Hace mucho que no se veía. Responde a mi acertijo y te daré lo que busqué en mi necedad. Un mago tiene la edad que tendrá el hechicero cuando el mago tenga el doble de la edad que tenía el hechicero cuando la edad del mago era la mitad de la suma de sus edades actuales. ¿Qué edad tiene cada uno?»"
 POD_mummy_spell_of_life_journeys.41.a: "El mago tiene 30. El hechicero tiene 20."
 POD_mummy_spell_of_life_journeys.41.b: "El mago tiene 60. El hechicero tiene 20."
 POD_mummy_spell_of_life_journeys.41.c: "El mago tiene 45. El hechicero tiene 30."
 POD_mummy_spell_of_life_journeys.41.d: "El mago tiene 60. El hechicero tiene 45."  # correct answer
 POD_mummy_spell_of_life_journeys.41.e: "Dejo que mi intuición me guíe"  # 25 learning check
 POD_mummy_spell_of_life_journeys.41.effect.success: "«El secreto que buscas es...»"
 POD_mummy_spell_of_life_journeys.41.effect.failure: "«Déjame esperar a un necio digno de mis secretos»"

 POD_mummy_spell_of_life_journeys.42.t: "Glifos crípticos"
 # Symbols CK3 supports that resemble hieroglyphs 𓋴 𓊪 𓉔 𓇋 𓈖 𓐍 which spell out solution
 # Also, only SPHINX has right number of letters without repeating characters
 # Finally, it's a riddle so of course the answer is SPHINX
 POD_mummy_spell_of_life_journeys.42.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que pueden encontrarse algunas pistas entre las ruinas de un antiguo templo. Llegas y encuentras el templo enterrado, con los restos de su tejado crujiendo bajo tus pies. Lo único visible es un solo obelisco, de algún modo intacto tras el paso de las eras. La cima dorada parece capturar la luz del sol antes de redirigirla a tus ojos, lo que acentúa aún más cómo reluce la piedra, con pequeñas motas de cristal que reflejan la luz en todas direcciones. En la base del obelisco hay una placa.\n\n«Habla, buscador, y elige con cuidado tu palabra,\npues la verdad es una luz que solo responde a los dignos.\nPronuncia la palabra adecuada y serás iluminado por su resplandor,\npero habla con falsedad y la oscuridad reclamará tu oportunidad para siempre.\n∫ ο љ ₫ …  ҈»"
 POD_mummy_spell_of_life_journeys.42.a: "HORUS"
 POD_mummy_spell_of_life_journeys.42.b: "KEMET"
 POD_mummy_spell_of_life_journeys.42.c: "OSIRIS"
 POD_mummy_spell_of_life_journeys.42.d: "ESFINGE"  # correct answer
 POD_mummy_spell_of_life_journeys.42.e: "Dejo que mi intuición me guíe"  # 25 learning check
 POD_mummy_spell_of_life_journeys.42.effect.success: "La luz del obelisco brilla sobre ti y revela..."
 POD_mummy_spell_of_life_journeys.42.effect.failure: "La cima dorada se ennegrece y luego se desmorona"

 POD_mummy_spell_of_life_journeys.43.t: "Lugares perdidos"
 POD_mummy_spell_of_life_journeys.43.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que pueden encontrarse algunas pistas en el lugar ritual de un buscador que desapareció tras realizar su versión del Hechizo de la Vida. Más que en casi cualquier otro lugar que hayas visitado, queda poco de lo que fuera esto. Ni siquiera tus agudos sentidos pueden decir qué hubo en este sitio. La niebla se arremolina en el aire y forma rocío en tus manos. El aire está cargado de ozono, que te abruma las fosas nasales. Las plantas crujen y los sonidos de los animales llegan suavemente a tus oídos como desde gran distancia. Al pasar, los helechos se doblan bajo tus pies antes de erguirse lentamente a tu espalda y borrar todo rastro de tu camino. La historia ha seguido su curso y ha dejado este lugar abandonado. La magia recorre el aire y pulsa como un latido. Sin embargo, parece apática. En el centro del campo hay un hombre translúcido de edad indescifrable, que parece sentado en una silla invisible.\n\n«Ah, pocos necios llegan a este lugar. Hace mucho que no se veía. Responde a mi acertijo y te daré lo que busqué en mi necedad. ¿Qué vuela y no puede estarse quieto? ¿Qué devora todo lo que toca y, sin embargo, no come nada? ¿Qué no puede prestarse jamás y, sin embargo, siempre se malgasta? ¿Qué se gasta siempre y nunca se gana?»"
 POD_mummy_spell_of_life_journeys.43.a: "Muerte"
 POD_mummy_spell_of_life_journeys.43.b: "Tiempo"  # correct answer
 POD_mummy_spell_of_life_journeys.43.c: "Viento"
 POD_mummy_spell_of_life_journeys.43.d: "Riqueza"  
 POD_mummy_spell_of_life_journeys.43.e: "Dejo que mi intuición me guíe"  # 25 learning check
