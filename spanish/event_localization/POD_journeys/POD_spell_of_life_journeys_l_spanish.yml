 POD_mummy_spell_of_life_journeys.10.t: "Las lecciones de Wepauwet"
 POD_mummy_spell_of_life_journeys.10.desc: "Wepauwet no posee el Hechizo de la Vida. Sin embargo, sabe lo bastante de él como para aportar algunas ideas que impulsen tus propios esfuerzos. Pocas cosas ayudan más que oír el mismo material de boca de otra persona.\n\nPor ello, buscaste a Wepauwet y lo hallaste entre las arenas arremolinadas de África. En su día fue uno de los mayores guerreros de los Caminantes Silenciosos, hermano de sangre de Shu Horus y diplomático ante los Shemsu-heru. Ayudó a guiar a su pueblo en grandes batallas contra el Culto de Sutekh en las tierras de Khem. Ahora vive entre las ruinas de su pueblo en una tierra extranjera, separado de sus espíritus ancestrales por la maldición de Set. Intentó burlar la maldición sirviendo a Horus, pero el espíritu Búho lo castigó por violar el plan de Gaia. Solo le queda intentar preservar la historia y el conocimiento de su pueblo con la única vida, aunque eterna, que le resta. Siendo el único capaz de oír a los ancestros de la tribu, existe entre la vida y la muerte, guía a su pueblo, se comunica con los espíritus en su patria tribal y trata de resucitar los recuerdos de sus pasadas glorias de los días de Khem.\n\nEntre los conocimientos de Wepauwet hay algunos fragmentos sobre el Hechizo de la Vida. Sin embargo, es inmensamente leal a Horus, que prohíbe compartir tales detalles. Además, su historia lo ha vuelto desconfiado con los desconocidos. Tendrás que convencerlo de que te enseñe."
 POD_mummy_spell_of_life_journeys.10.a: "Como colega erudito, enséñame, por favor"
 POD_mummy_spell_of_life_journeys.10.b: "¿Y si ayudo a tu pueblo?"
 POD_mummy_spell_of_life_journeys.10.c: "Horus me ha concedido permiso"
 POD_mummy_spell_of_life_journeys.10.effect.success.desc: "Resulto convincente"
 POD_mummy_spell_of_life_journeys.10.critical.failure.effect.desc: "No logro persuadirlo"

 POD_mummy_spell_of_life_journeys.11.t: "Las lecciones de Milarepa"
 POD_mummy_spell_of_life_journeys.11.desc: "Milarepa no posee el Hechizo de la Vida. Sin embargo, sabe lo bastante de él como para aportar algunas ideas que impulsen tus propios esfuerzos. Pocas cosas ayudan más que oír el mismo material de boca de otra persona.\n\nPor ello, buscaste a Milarepa y lo hallaste entre las altas cumbres del Himalaya. En otro tiempo, Khetamon fue filósofo y mago en la corte de Osiris, Abrazado para preservar sus habilidades. Uno de los pocos vástagos de Osiris que sobrevivieron a la batalla de Mestha, Khetamon condujo a los Hijos de Osiris en un viaje espiritual hacia el este, siguiendo los pasos del propio viaje de Osiris. Cuando Osiris regresó, lo hizo con las enseñanzas del Bardo y, por eso, Khetamon buscó la misma fuente de iluminación. El poeta hechicero Milarepa, discípulo de Khetamon, acompañó a su maestro. Asentado en el Himalaya, Milarepa ayudó a los Contemplaestrellas, amigos de los Caminantes Silenciosos y de la tribu de su amigo Justinian, a matar a una bestia llamada el Vagabundo de los Nexos y acabó alcanzando su propia iluminación, un estado llamado Golconda.\n\nGracias a su tiempo trabajando junto a los místicos de los Shemsu-heru y del Culto de Isis, aprendió algunos fragmentos sobre el Hechizo de la Vida. Sin embargo, su lealtad pertenece a las fuerzas de Osiris y considera que muchas criaturas sobrenaturales están, en el mejor de los casos, descarriadas. Tendrás que demostrar que cumples sus estándares éticos, intelectuales y metafísicos."
 POD_mummy_spell_of_life_journeys.11.a: "Permíteme meditar a tu lado"
 POD_mummy_spell_of_life_journeys.11.b: "Nada se compara con un buen debate filosófico"

 POD_mummy_spell_of_life_journeys.12.t: "Las lecciones de Astrokhen"
 POD_mummy_spell_of_life_journeys.12.desc: "Astrokhen no posee el Hechizo de la Vida. Sin embargo, sabe lo bastante de él como para aportar algunas ideas que impulsen tus propios esfuerzos. Pocas cosas ayudan más que oír el mismo material de boca de otra persona.\n\nPor ello, buscaste a Astrokhen y lo hallaste escondido entre las arenas cambiantes de África. En su día, Astrokhen fue un mago de las tierras de Khem que buscaba la inmortalidad. En su arrogancia, ordenó a Horus que le aplicara el Hechizo de la Vida, lo que acabó mal. Tras años de búsqueda, dio con los escritos de otro mago que se hacía llamar Hermes. Empleando todos sus recursos para seguir un rastro muerto hacía mucho, Astrokhen acabó encontrando a «Hermes», que resultó ser Cabirus, un mago que al parecer reconstruyó (o robó) el Hechizo de la Vida. Cuando Horus descubrió la nueva inmortalidad de Astrokhen, lo maldijo a proteger para siempre los poderosos artefactos de Horus y a adquirir otros artefactos que necesitaran protección. El propio amor de Astrokhen por los secretos y el conocimiento oculto reforzó la maldición y aseguró que pasara incontables siglos persiguiendo tomos antiguos y poderes ocultos. La moral nunca fue para él una gran consideración.\n\nEntre esos secretos hay algunos fragmentos sobre el Hechizo de la Vida. Más allá de la maldición, no le debe lealtad alguna a Horus. Si satisfaces las necesidades de la maldición y alivias temporalmente su carga, quizá esté dispuesto a desprenderse de algunos retazos de información."
 POD_mummy_spell_of_life_journeys.12.a: "Yo mismo tengo una colección nada desdeñable"
 POD_mummy_spell_of_life_journeys.12.b: "Puedo financiar tus esfuerzos"
 POD_mummy_spell_of_life_journeys.12.c: "Me niego a ayudar a un hombre así"
 POD_mummy_spell_of_life_journeys.12.effect.success.desc: "Derrotas a Astrokhen y saqueas sus cámaras"
 POD_mummy_spell_of_life_journeys.12.critical.failure.effect.desc: "Él repele tu asalto"

 POD_mummy_spell_of_life_journeys.13.t: "Las lecciones de Inauhaten"
 POD_mummy_spell_of_life_journeys.13.desc: "Inauhaten no posee el Hechizo de la Vida. Sin embargo, sabe lo bastante de él como para aportar algunas ideas que impulsen tus propios esfuerzos. Pocas cosas ayudan más que oír el mismo material de boca de otra persona.\n\nPor ello, buscaste a Inauhaten y lo hallaste entre las muchas cuevas ocultas del Himalaya. Antaño arquitecto mortal, fue convertido en momia por el Culto de Isis y decidió dedicar su recién hallada inmortalidad a estudiar la muerte y el más allá. Con el tiempo, determinó que la cruzada de Horus contra Set era una distracción de asuntos mayores: vigilar una gran ciudad sin sol entre los muertos, que se eleva desafiante por encima del fin de todo. Impresionado por su conocimiento de la necromancia, Inauhaten ofreció un trato a un culto de magos. A cambio de su ayuda para cuidar una ciudad olvidada, empleó una versión fragmentaria del Hechizo de la Vida para transformar a los Idran en yamasattvas. A través de ellos, contactó con una antigua secta de vampiros que adoraba a los Antediluvianos. Les enseñó sobre el Inframundo y su gobierno. Los guio hasta la ciudad y les ayudó a capturarla. Les entregó una serie de volúmenes que destilaban sus milenios de experiencia con la praxis necromántica. Los ayudó mientras reunían uno de los archivos más completos de la historia cainita primitiva del mundo, uno cuyo tamaño superaba incluso la legendaria Biblioteca de los Olvidados. Iluminó un camino para los Tal'mahe'Ra y los puso en un rumbo del que no podían desviarse.\n\nAunque solo conoce una forma corrupta del Hechizo de la Vida, podría enseñarte mucho. Sin embargo, quizá debas hacer un trato con él, como los Idran hace tanto tiempo."
 POD_mummy_spell_of_life_journeys.13.a: "Ya estoy ligado por el trato de los Idran"
 POD_mummy_spell_of_life_journeys.13.b: "Me consagro a la causa"
 POD_mummy_spell_of_life_journeys.13.c: "¿Necesitan algunos recursos?"
 
 POD_mummy_spell_of_life_journeys.14.t: "Las lecciones de Mestha"
 POD_mummy_spell_of_life_journeys.14.desc: "Mestha no posee el Hechizo de la Vida. Sin embargo, sabe lo bastante de él como para aportar algunas ideas que impulsen tus propios esfuerzos. Pocas cosas ayudan más que oír el mismo material de boca de otra persona.\n\nPor ello, buscaste a Mestha y lo hallaste viviendo en una tranquila granja a la vista del río Nilo. En su día fue un sencillo granjero del Bajo Nilo que cultivaba la misma tierra que su padre y el padre de su padre, durante muchas generaciones. Sus hijos sirvieron en los ejércitos mortales de Osiris y de Horus, valientes, fervorosos y, al final, muertos. Su segundo hijo llevó a Isis y a Horus a la granja de Mestha, donde él los cobijó. Mestha sacrificó el toro cuya sangre alimentó la recuperación de Osiris. Presenció la creación y la preparación del Hechizo de la Vida. Cuando Isis se mostró reacia a probar el hechizo en su hijo herido, Mestha se ofreció a someterse a él, tomó veneno para detener su corazón, sintió cómo su Ba pasaba al mundo espiritual y renació por primera vez. Presenció el ritual que dio a Horus la vida eterna. Con el paso de su inmortalidad, sirvió como confidente de Osiris en las raras ocasiones en que su señor abandonaba Amenti.\n\nHa visto mucho a lo largo de sus milenios, lo que le ha dado algunos fragmentos de conocimiento sobre el Hechizo de la Vida. Sin embargo, su lealtad a Osiris y a Horus es absoluta."
 POD_mummy_spell_of_life_journeys.14.a: "Es un hombre amable. Intentemos hablar"
 POD_mummy_spell_of_life_journeys.14.b: "Puede que sea leal, pero aún siente dolor..."



 POD_mummy_spell_of_life_journeys.20.t: "[Concept('translation_minigame', 'Traducción')|E] de registros esotéricos"
 POD_mummy_spell_of_life_journeys.20.desc: "Tus esfuerzos han dado con un registro esotérico de una antigüedad indeterminada. A pesar de tu familiaridad con varios idiomas y de las capacidades lingüísticas de tus cortesanos, vuestros esfuerzos combinados no han bastado para hacerlo interpretable. Una tinta invisible oculta detalles cruciales. Palabras cifradas salpican el texto. Las partes escritas en una lengua conocida apenas son interpretables y exigen un dominio técnico y mágico que apenas empiezas a alcanzar. La taquigrafía del autor complica aún más tus esfuerzos de traducción.\n\nUna palabra concreta, de cinco letras, parece ser la clave para traducir el resto. Por desgracia, solo tendrás 6 oportunidades, pues tus esfuerzos son bastante destructivos."
 POD_mummy_spell_of_life_journeys.20.a: "Probemos"
 POD_mummy_spell_of_life_journeys.20.b: "¡Me rindo!"
 POD_mummy_spell_of_life_journeys.20.effect.success: "Tu traducción tiene éxito"
 POD_mummy_spell_of_life_journeys.20.effect.failure: "Tu traducción fracasa"
 POD_mummy_spell_of_life_journeys.20.effect.failure.details: "Tus intentos fallidos destruyeron el registro"

 POD_mummy_spell_of_life_journeys.21.t: "Caminos que se bifurcan"
 POD_mummy_spell_of_life_journeys.21.desc: "En tu búsqueda de registros esotéricos sobre el Hechizo de la Vida, has hallado indicios de que algunas pistas yacen enterradas en un antiguo templo. Sin embargo, en su interior aguarda una prueba mortal, pues los sacerdotes eran muy exigentes respecto a quién consideraban digno de sus sagrados misterios. Has encontrado una trampilla oculta tras el altar que desciende hacia la oscuridad. Tras avanzar por estrechos túneles dispuestos como un laberinto, las paredes se abren ante ti en una gran cámara circular. Ante ti hay tres portales, aparentemente tallados en la pura oscuridad del vacío y sujetos por grabados dorados. Sobre cada portal hay una cabeza de distinto color: roja, verde y azul. Al entrar en la sala, activas un mecanismo invisible y las tres cabezas empiezan a hablar en perfecta sincronía.\n\n«Oíd, buscadores del conocimiento prohibido.\nAnte vosotros se alzan los caminos del juicio.\nDe las voces que ahora os hablan, al menos una dice solo la verdad\ny al menos una dice solo mentiras.\nSabed también esto: solo una puerta conduce más allá,\nmientras que las otras dos solo dan la muerte, rápida, cierta y definitiva.\nAnte vosotros reposan la eternidad o la perdición.\nElegid con cuidado vuestro camino.»\n\nLa cabeza roja dice: «Una cabeza mentirosa se halla sobre el camino seguro.»\nLa cabeza verde dice: «La cabeza roja dice solo la verdad.»\nLa cabeza azul dice: «La cabeza roja se halla sobre el camino seguro.»"  # solution is blue
 POD_mummy_spell_of_life_journeys.21.a: "Tomo el portal rojo"
 POD_mummy_spell_of_life_journeys.21.b: "Tomo el portal verde"
 POD_mummy_spell_of_life_journeys.21.c: "Tomo el portal azul"
 POD_mummy_spell_of_life_journeys.21.effect.success: "El camino conduce al conocimiento"

