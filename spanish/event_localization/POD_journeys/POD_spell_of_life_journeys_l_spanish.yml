 POD_mummy_elixir_of_eternal_life_journeys.32.t: "Descender de la cima"
 POD_mummy_elixir_of_eternal_life_journeys.32.desc: "En tu viaje más reciente has buscado un antiguo relato oral que se supone que contiene uno de los secretos de la ascensión. Encontrar a un narrador que lo conociera fue extremadamente difícil y acabó llevándote hasta una anciana. Aunque su cuerpo flaqueaba, no tuvo dificultad para contar la historia.\n\n«Hace muchos veranos y dinastías hubo un cultivador llamado Jian. Como tantos otros, buscaba la Puerta Celestial, para ascender más allá de los límites mortales. Durante cien años meditó en el pico más alto sin hablar con ningún alma. Refinó su núcleo hasta que ni el viento se atrevía a rozarlo. Un invierno, una ventisca espiritual, alimentada por la desesperación de la tierra, engulló la montaña. En medio de la locura, pero completamente indemne, Jian logró todo lo que había buscado y se plantó por fin ante la Puerta. Sin embargo, los vientos traían los lamentos de una aldea hambrienta en la base de la montaña, helada por la ferocidad de la ventisca. Con un solo paso podría haber ascendido. Si los dejaba, la ascensión era suya. Si se quedaba, la tormenta devoraría gran parte de su cultivo ganado a pulso. Si los ayudaba, le costaría aún más.\nSin pensarlo, Jian descendió la montaña. Les dio piedras de fuego para calentarlos, talismanes para protegerlos y, al final, su propio aliento, que calentaba sus cuerpos mientras el suyo se enfriaba. La ventisca, airada por el robo de sus víctimas, descargó toda su fuerza contra él y su cultivo se quebró como hielo fino. Al amanecer, la tormenta se evaporó en un instante, con su hambre saciada no por la desesperación sino rebasada por la generosidad. La Puerta seguía en la cima, esperando, pero Jian ya no podía verla. Cuando la luz del sol cayó sobre él, su cuerpo se desplomó en polvo, y cada uno de sus largos años lo alcanzó en un momento. Lo último en desvanecerse fue su sonrisa.»\n\n¿Qué lección extraes de este relato?"
 POD_mummy_elixir_of_eternal_life_journeys.32.a: "Si hubiera sido más sabio, podría haberlos ayudado y conservar su fuerza"
 POD_mummy_elixir_of_eternal_life_journeys.32.b: "Al abandonar la inmortalidad, trascendió el yo que la buscaba"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.32.c: "El sacrificio visible es el único camino a la trascendencia"
 POD_mummy_elixir_of_eternal_life_journeys.32.d: "El mundo castiga la virtud y la generosidad."
 POD_mummy_elixir_of_eternal_life_journeys.32.e: "Una pregunta difícil, desde luego"  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.32.effect.success: "Aplicar esta lección potencia tu propio cultivo"
 POD_mummy_elixir_of_eternal_life_journeys.32.effect.failure: "Esta lección no parece favorecer tus esfuerzos"

 POD_mummy_elixir_of_eternal_life_journeys.33.t: "El inmortal y el sanador"
 POD_mummy_elixir_of_eternal_life_journeys.33.desc: "En tu viaje más reciente has buscado un antiguo relato oral que se supone que contiene uno de los secretos de la ascensión. Encontrar a un narrador que lo conociera fue extremadamente difícil y acabó llevándote hasta un herborista de un pueblo pequeño. Mientras molía hierbas y vendía píldoras a los aldeanos, recitó un relato que le transmitió su maestro.\n\n«Hace muchos veranos y dinastías, uno de los Ocho Inmortales caminaba por las tierras y dio con una ciudad azotada por una enfermedad mortal. Los enfermos llenaban las calles y, entre ellos, había un alquimista que probaba elixires sin contrastar con los moribundos. Algunos se salvaron, mientras que el final de otros se aceleró o se volvió mucho más agónico. Cuando la Inmortal lo vio, declaró: "Jugar con la vida es desafiar el mandato del Cielo. Perseguir la luz brillante de un futuro deseado sin cuidar de los riesgos es prender fuego al bosque." Con un soplo, curó la ciudad por completo, pero hizo recaer sobre el alquimista toda la agonía que había infligido. Él vagó por la tierra como un loco, con los sentidos consumidos por el dolor. La ciudad se regocijó y alabó su misericordia.\nSin embargo, con el tiempo llegó otra enfermedad y ninguno de los sanadores se atrevió a arriesgarse a errar. Se aferraron a lo conocido, paralizados por el miedo. Muchos que podrían haberse salvado fueron enterrados con oraciones.»\n\n¿Qué lección extraes de este relato?"
 POD_mummy_elixir_of_eternal_life_journeys.33.a: "Solo el necio adora a ciegas, e incluso el sabio toma decisiones cuestionables"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.33.b: "De haberse quedado la inmortal, la enfermedad no habría vuelto"
 POD_mummy_elixir_of_eternal_life_journeys.33.c: "El sufrimiento es un precio necesario del progreso"
 POD_mummy_elixir_of_eternal_life_journeys.33.d: "La búsqueda del conocimiento genera crueldad"
 POD_mummy_elixir_of_eternal_life_journeys.33.e: "Una pregunta difícil, desde luego"  # 25 learning
