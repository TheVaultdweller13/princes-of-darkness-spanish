 POD_mummy_elixir_of_eternal_life_journeys.35.t: "Maravillas olvidadas"
 POD_mummy_elixir_of_eternal_life_journeys.35.desc: "En tu búsqueda de registros esotéricos sobre el Elixir de la Vida Eterna, has hallado indicios de que algunas pistas yacen enterradas en un antiguo templo. El dios o los dioses adorados en su interior hace tiempo que fueron olvidados. Incluso su función de templo es una mera conjetura. Hacia el mediodía llegas por fin al templo, enterrado por incontables eras de crecimiento del bosque.\n\nLas puertas se abren a una tierra de noche eterna, pero no de oscuridad. La luz titilante de innumerables estrellas ahuyenta las sombras que proyectan árboles muchas veces más altos que tú. A través de las ramas, muy por encima de tu cabeza, una luz suave se derrama para jugar sobre las flores silvestres en flor. Donde cabría esperar bestias sombrías y donde normalmente acechan depredadores ocultos, solo hay formas alegres proyectadas por las estrellas, que saltan entre el caleidoscopio de colores. Aves, ranas, grillos y muchos otros que no sabrías nombrar se unen en una armonía perdida para la humanidad, sin que ninguno ahogue a otro, como una gran orquesta que recuerda la canción de un día lejano.\n\nAl otro lado hay una puerta cerrada. Sobre el dintel hay una inscripción:\n¿Qué es algo que, si afirmas tenerlo, no tienes?\nSi lo echas en falta en ti, quizá lo tengas."
 POD_mummy_elixir_of_eternal_life_journeys.35.a: "Confianza"
 POD_mummy_elixir_of_eternal_life_journeys.35.b: "Cordura"
