 POD_mummy_elixir_of_eternal_life_journeys.28.t: "El gran ciclo de la generación"
 POD_mummy_elixir_of_eternal_life_journeys.28.desc: "En tu búsqueda de registros esotéricos sobre el Elixir de la Vida Eterna, has hallado indicios de que algunas pistas yacen enterradas en el salón de una secta. Oculto en una zona aislada y protegido por antiguas magias, su antiguo salón yace ahora abandonado. Árboles y plantas han crecido a su alrededor y forman un segundo techo sobre la estructura, sorprendentemente intacta. Enredaderas y hierba hacen casi de barrera en torno al salón y se detienen justo antes de sus muros. Ante el portal sellado hay 5 estatuas dispuestas en círculo. Sus cuerpos de terracota están moldeados con esmero y son asombrosamente realistas. Sus armaduras están elaboradas con cariño y pintadas de verde, gris, azul, rojo y amarillo. Sus hachas... bueno, sus hachas no están moldeadas en absoluto. Las hachas son reales, con mangos de madera de melocotonero y hojas de hierro frío. En torno a las bases de las estatuas ves unas extrañas marcas de rozaduras, y un breve experimento revela que cada estatua gira con facilidad. Sobre el portal hay una placa:\n«Un bosque se convirtió en un infierno rugiente que cambió la noche por el día. Aguas termales y magma se volvieron piedra mientras la tierra se encabritaba y se agitaba como un ser vivo. Rocas enormes martillearon la tierra. El mármol y el granito se tornaron hierro y estaño, matando la tierra y envenenando el agua. Las vastas minas estallaron cuando el mineral se transformó en diez veces su volumen de agua. Los lagos y los ríos fueron asfixiados por una interminable extensión de verde que volvería a quemarse. Así fue cuando el mundo se rehízo. Así fue cuando la rueda giró una vez más.»\n\n¿Cómo giras cada estatua? ¿Hacia qué estatua mira cada una?"
 POD_mummy_elixir_of_eternal_life_journeys.28.a: "Verde a Amarillo. Amarillo a Azul. Azul a Rojo. Rojo a Gris. Gris a Verde."
 POD_mummy_elixir_of_eternal_life_journeys.28.b: "Verde a Rojo. Rojo a Amarillo. Amarillo a Gris. Gris a Azul. Azul a Verde."  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.28.c: "Verde a Gris. Gris a Rojo. Rojo a Azul. Azul a Amarillo. Amarillo a Verde."
 POD_mummy_elixir_of_eternal_life_journeys.28.d: "Verde a Azul. Azul a Gris. Gris a Amarillo. Amarillo a Rojo. Rojo a Verde."
 POD_mummy_elixir_of_eternal_life_journeys.28.e: "¿Reconozco este ciclo?"  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.28.effect.success: "Las estatuas miran hacia el portal y descargan sus hachas, abriendo las puertas"
 POD_mummy_elixir_of_eternal_life_journeys.28.effect.failure: "Las estatuas te miran y descargan sus hachas, expulsándote"

 POD_mummy_elixir_of_eternal_life_journeys.29.t: "El orden adecuado"
 POD_mummy_elixir_of_eternal_life_journeys.29.desc: "Tras una extensa investigación y enviar a tus agentes por todas partes, has obtenido 5 frascos, brebajes de un alquimista que se convirtió en Wu T'ian hace varios siglos. El frasco rojo arde con una llama interior que danza gozosa dentro de su prisión de cristal. El frasco verde zumba con una sutil vitalidad, y unos zarcillos se despliegan y se enroscan de nuevo como un latido lento. El frasco azul chapotea con fluidez innata, como si formara parte de las mareas. El frasco amarillo pesa en tu mano, y cada mínimo movimiento parece el asentarse de una montaña. Por último, el frasco blanco resuena como el tintineo de las campanillas y reluce con un brillo de espejo. Si los combinas en el orden adecuado, se obtendrían beneficios sustanciales para tu cultivo. Por desgracia, solo ha sobrevivido un único fragmento de sus notas:\n«La poción blanca no es la primera. La poción roja va antes que la amarilla. La poción verde no va antes que la blanca, pero sí antes que la amarilla. La poción azul debe ir en segundo lugar.»"
 POD_mummy_elixir_of_eternal_life_journeys.29.a: "Rojo, Azul, Blanco, Verde, Amarillo"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.29.b: "Rojo, Azul, Verde, Blanco, Amarillo"
 POD_mummy_elixir_of_eternal_life_journeys.29.c: "Rojo, Azul, Verde, Amarillo, Blanco"
 POD_mummy_elixir_of_eternal_life_journeys.29.d: "Azul, Rojo, Blanco, Verde, Amarillo"
 POD_mummy_elixir_of_eternal_life_journeys.29.e: "Mmm, quizá esa y luego esa otra..."  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.29.effect.success: "Con un destello, se vuelve perfectamente transparente"
 POD_mummy_elixir_of_eternal_life_journeys.29.effect.failure: "Con un destello, de él surge una columna de humo"

 POD_mummy_elixir_of_eternal_life_journeys.30.t: "Ingredientes extraños"
 POD_mummy_elixir_of_eternal_life_journeys.30.desc: "Tras una extensa investigación y enviar a tus agentes por todas partes, has obtenido un antiguo libro de recetas alquímicas, aunque la mayoría de sus anticuadas páginas son irrecuperables. En la primera página figuran Ajenjo, Centinodia, Polvo de Perla, Icor de Araña, Rocío de Luna, Hojas de Flor de Sombra, Polvo de Pez Globo, Bilis de Serpiente, Agua de Miel y Ojos de Rana. El Rocío de Luna es un ingrediente especialmente extraño, pues es en sí una mezcla líquida de varios otros ingredientes y fue difícil de conseguir. La única receta superviviente parece haber sido escrita en verso. Sin embargo, descifrarla podría reportar beneficios sustanciales y permitir elaborar un elixir muy potente.\n\n«Cinco debes rehuir.\nPara empezar el brebaje, ningún extremo has de elegir\nEl segundo de dentro, solo uno servirá\nNo necesitarás ninguna criatura de la tierra\nY solo una planta una mano te echará\nTres deseas, todos en hilera\nEl último es un polvo, criado en salmuera\nPara hacer el elixir añade los vecinos y remueve bien, en sentido horario\nLuego añade el líquido y burbujas surgirán\nEl último ingrediente debes espolvorear, y luego mezclar\nAhora es hora de beberlo.»"
 POD_mummy_elixir_of_eternal_life_journeys.30.a: "Ajenjo, Centinodia, Polvo de Perla, Rocío de Luna, Polvo de Pez Globo"
 POD_mummy_elixir_of_eternal_life_journeys.30.b: "Polvo de Perla, Rocío de Luna, Hojas de Flor de Sombra, Bilis de Serpiente, Polvo de Pez Globo"
 POD_mummy_elixir_of_eternal_life_journeys.30.c: "Hojas de Flor de Sombra, Polvo de Pez Globo, Agua de Miel, Polvo de Perla, Rocío de Luna"
 POD_mummy_elixir_of_eternal_life_journeys.30.d: "Rocío de Luna, Hojas de Flor de Sombra, Polvo de Pez Globo, Agua de Miel, Polvo de Perla"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.30.e: "Una pizca de esto y un toque de aquello..."  # 25 learning
 POD_mummy_elixir_of_eternal_life_journeys.30.effect.success: "Con un destello, se vuelve perfectamente transparente"
