 POD_mummy_elixir_of_eternal_life_journeys.34.t: "Siembra y cosecha"
 POD_mummy_elixir_of_eternal_life_journeys.34.desc: "En tu viaje más reciente has buscado un antiguo relato oral que se supone que contiene uno de los secretos de la ascensión. Encontrar a un narrador que lo conociera fue extremadamente difícil y acabó llevándote hasta un viejo granjero. Tiene la espalda encorvada y la piel oscurecida por muchos años de cuidar sus cultivos. Con cada golpe de azada, fue transmitiendo una historia que aprendió de su abuelo.\n\n«Tras muchos largos años de lucha, un soldado se retiró del ejército y vagó por la tierra. Dio con un valle yermo asfixiado por una vegetación antigua. El río del valle bramaba y destrozaba todo a su paso. El suelo estaba plagado de peñascos capaces de romper un arado y el metal envenenaba la tierra. En lugar de maldecir al destino, taló los árboles uno a uno, aunque su hacha se rompió tres veces. Desvió las aguas por canales tallados con paciencia, aunque cada estación las crecidas deshacían su obra. Rompió las rocas con fuego y martillo, aunque le sangraban las manos. Lavó las toxinas plantando setas y esparciendo carbón, aunque cada estación solo vio marchitarse lo plantado.\nPasaron años antes de que sembrara una sola semilla. Muchos se rieron, pues solo veían esfuerzo y ningún fruto, pero él jamás vaciló. Cuando por fin el valle se ablandó, plantó. Cuando llegaron las lluvias, nutrieron en lugar de destruir. Al acercarse el otoño, recogió una cosecha tan vasta que alimentó a diez aldeas.»\n\n¿Qué lección extraes de este relato?"
 POD_mummy_elixir_of_eternal_life_journeys.34.a: "Destruye siempre lo que existe para que pueda construirse algo mejor"
 POD_mummy_elixir_of_eternal_life_journeys.34.b: "Transfórmate para que el éxito sea inevitable"
 POD_mummy_elixir_of_eternal_life_journeys.34.c: "Ignora las advertencias de los demás, pues son necios"
 POD_mummy_elixir_of_eternal_life_journeys.34.d: "Antes de buscar el poder, despeja lo que te obstruye"  # correct answer
 POD_mummy_elixir_of_eternal_life_journeys.34.e: "Una pregunta difícil, desde luego"  # 25 learning
