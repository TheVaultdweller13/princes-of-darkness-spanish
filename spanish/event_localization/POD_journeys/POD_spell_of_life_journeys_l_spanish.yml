 POD_mummy_elixir_of_eternal_life_journeys.24.t: "Números de arena"
 POD_mummy_elixir_of_eternal_life_journeys.24.desc: "En tu búsqueda de registros esotéricos sobre el Elixir de la Vida Eterna, has hallado indicios de que algunas pistas yacen enterradas en un antiguo templo. Esta secta era conocida por sus enseñanzas esotéricas sobre las matemáticas y las simetrías divinas. Según sus registros supervivientes, creían que solo mediante las matemáticas podía comprenderse, rastrearse o afectarse la Rueda de las Eras. Sin embargo, sus misterios internos y la naturaleza de estas ecuaciones se perdieron cuando la secta decayó en popularidad.\n\nAl llegar, te diste cuenta de que el templo era poco más que un pequeño espacio de reunión con asientos dispuestos en torno a un foso de arena. Frente a la entrada había una puerta bloqueada con alguna forma de magia. Aunque el viento había barrido casi todo el foso, viste varias placas de piedra incrustadas en la arena ante la puerta. Tras limpiar la arena que las cubría, comprendiste que cada placa tenía un número. Sospechas que debes dibujar en la arena, entre las placas, los números que faltan.\na 1 b\n3 5 7\nc 9 d"
