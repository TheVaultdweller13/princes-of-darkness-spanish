 kueijin_scheme.300.t: "Proyectar energía psíquica negativa"
 kueijin_scheme.300.desc: "Canalizas toda tu culpa, frustración, ira y Ansia en tu alma Hun y luego proyectas esta energía psíquica negativa como un cuchillo en el alma de [recipient.GetNamePossessive]."
 kueijin_scheme.300.a: "¡Sufre mi dolor!"
 
 kueijin_scheme.310.t: "Energía psíquica negativa proyectada"
 kueijin_scheme.310.desc: "¡Toda la culpa, frustración, ira y Ansia de [owner.GetName] se ha proyectado como un cuchillo en tu alma!"
 kueijin_scheme.310.a: "¡Ahhh!"
 
 POD_darkling_mirror.001.t: "Espejo de las tinieblas"
 POD_darkling_mirror.001.desc: "Con tu maestría en el Cultivo, puedes intentar separar tu P'o de tu Hun y de tu cuerpo para usarlo como un siervo maligno."
 POD_darkling_mirror.001.option.a: "¡Demonio mío! Sírveme."
 POD_darkling_mirror.001.option.a.tt: "Intentarás separar tu P'o"
 POD_darkling_mirror.001.option.a.desc: "Una contienda con tu demonio interior"
 POD_darkling_mirror.001.option.a.tt.success: "Tu P'o ha sido separado con éxito"
 POD_darkling_mirror.001.option.a.tt.failure: "Has fallado al dividir tu P'o"
 POD_darkling_mirror.001.option.b: "Ahora no es el momento adecuado"
 POD_darkling_mirror.001.option.b.tt: "Abandonarás tu idea de dividir tu P'o"

 POD_darkling_mirror.002.t: "Espejo Oscuro II"
 POD_darkling_mirror.002.desc: "Con tu maestría en el Cultivo, has logrado dividir con éxito tu P'o de tu Hun y de tu cuerpo; ahora es el momento de dar órdenes."
 POD_darkling_mirror.002.option.a: "Mi propio monstruo"
 POD_darkling_mirror.002.option.a.tt: "Tu P'o ha sido dividido con éxito."

 POD_darkling_mirror.003.t: "Espejo Oscuro II"
 POD_darkling_mirror.003.desc: "Ni siquiera tu maestría en el Cultivo es suficiente para dividir tu P'o... por ahora."
 POD_darkling_mirror.003.option.a: "Aún no estoy preparado"
 POD_darkling_mirror.003.option.a.tt: "Has fallado al dividir tu P'o"

 POD_darkling_mirror.death_management.t: "El regreso del P'o"
 POD_darkling_mirror.death_management.desc: "Tu P'o dividido ha sufrido un incidente y debe regresar a ti."
 POD_darkling_mirror.death_management.option.a: "Mi maldad ha regresado"
 POD_darkling_mirror.death_management.option.a.tt: "Tu P'o dividido y tú sois uno de nuevo"

 #PODquincunx.100.t: "News from China"
 #PODquincunx.100.desc: "A messenger comes to you, bearing news from the East.\nIn a scroll sent to Emperor Da of the White Tiger Court, the remaining true Black Tortoise Court [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] renounce both the light of Heaven and the darkness of [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')].\nThis letter confirms the former faction's legitimacy, which make the White Tiger and Yellow Emperor Courts call for a meeting of all influential Ancestors in three year from now to assess the situation."
 #PODquincunx.100.option.a: "Should I assist?"
 #
 #PODquincunx.110.t: "News from China: Council of Dragons"
 #PODquincunx.110.desc: "The congregation of Ancestors met at the Shaolin monastery near Changan, it declared that foreigners, particular those Kin-Jin, were to blame for the fall of the August Courts.\nIn response, they will establish a new order - the Quincunx. It will consist of several courts in the five cardinal directions: the Blood Court in the north, the Flesh Court in the east, the Flame Court in the south, the Bone Court in the west, and the Jade Court in the center."
 #PODquincunx.110.option.a: "A new order rises in China."
 #
 #PODquincunx.201.t: "Destiny of Scarlet Phoenix Court"
 #PODquincunx.201.desc: "The Chinese Black Tortoise and Yellow Emperor [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] are pressing against your court, and politically minded [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] in all courts hurl allegations of [akuma|E] with little or no evidence. It is time for you to decide the fate of the Scarlet Phoenix. Separate from the northerner's courts and proclaim a new Court? Or obey their mandate to maintain unity with China?"
 #PODquincunx.201.option.a: "Declare independence."
 #PODquincunx.201.option.b: "Purge all [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')]-tainted."
 #
 #PODquincunx.200.t: "The End of the Scarlet Phoenix Court"
 #PODquincunx.200.desc: "The Scarlet Phoenix Court has always been isolated from the Chinese courts and it has come to no surprise that they decided to not take part in the Quincunx meeting.\nAs a new age dawns upon them, they have decided to rename themselves into the Golden Courts and keep their independence."
 #PODquincunx.200.option.a: "The [Glossary('Wheel of Ages','podgloss.wheelofages')] is turning."
 #
 #PODquincunx.210.t: "News from China: The End of the Azure Dragon Court"
 #PODquincunx.210.desc: "The civility between Japanese gaki and the [Glossary('Hungry Dead','game_concept_kuei_jin_desc')] of the mainland has ended. Korean survivors eventually traveled south and helped form the Quincunx. The Korean/Japanese Azure Dragon Court is no more, divided between the Green Courts of Korea, allied to the Quincunx, and the Clans of the Sun in Nihon/Japan."
 #PODquincunx.210.option.a: "The [Glossary('Wheel of Ages','podgloss.wheelofages')] is turning."
 #
 #PODquincunx.220.t: "News from China: The End of the Yellow Emperor Court"
 #PODquincunx.220.desc: "The attack on Emperor Wang Hongben fragmented the Golden Jade Society, pulling the Courts of the Yellow Emperor apart. The situation worsened by the destruction of the Mongol conquest and accusation of helping the infernalists [akuma|E].\nWith the Treaty of the Quincunx, the Yellow Emperor Court is now reformed into the Jade Court."
 #PODquincunx.220.option.a: "The [Glossary('Wheel of Ages','podgloss.wheelofages')] is turning."
 #
 #PODquincunx.230.t: "News from China: The End of the White Tiger Court"
 #PODquincunx.230.desc: "The Court of the White Tiger split into competing factions when Empress Fan abandoned her position, Emperor Da's attempts to bring peace failed.\nAfter the swath of destruction brought by the Mongols and Akuma from the Black Tortoise court; the survivors joined the newly formed Quincunx.\nThe White Tiger Court is no more."
 #PODquincunx.230.option.a: "The [Glossary('Wheel of Ages','podgloss.wheelofages')] is turning."
 #
 #PODquincunx.240.t: "News from China: The End of the Black Tortoise Court"
 #PODquincunx.240.desc: "As the Ming armies attack Karakorum, dozen of [Glossary('Wu','podgloss.wu')] from all the August Courts descend on the city for revenge, and the nighttime battle lasts for weeks. In the end, the [akuma|E] infested Black Tortoise Court is no more: those still uncorrupted have joined the Quincunx, the others have been put to the torch or the sword."
 #PODquincunx.240.option.a: "The [Glossary('Wheel of Ages','podgloss.wheelofages')] is turning."
 #
 #PODquincunx.260.t: "News from Yomi: The End of the Hell of Spiked Chains"
 #PODquincunx.260.desc: "After the creation of the Quincunx, the [GetTrait('kueijin').GetName( GetNullCharacter )] attacked the holdings of [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] in the former territories of the Black Tortoise Court, severing him from his input of Tainted Chi, which allowed his rivals, among them Rangda and [Glossary('Tou Mu','podgloss.toumu')], to destroy him and add parts of the former Hell to their own territories."
 #PODquincunx.260.option.a: "The [Glossary('Wheel of Ages','podgloss.wheelofages')] is turning."
 
 POD_demon_regalia.1.t: "Atuendo Demoníaco"
 POD_demon_regalia.1.desc: "La Regalia Demoniaca toma la forma de mutaciones monstruosas o de armamento sobrenatural, reflejando el [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] del que brota dicho poder.\nTen en cuenta que, aunque las siguientes características se agrupan temáticamente por el Infierno, los $pod_kueijin$ no tienen prohibidas ciertas características según de dónde hayan escapado. De hecho, a medida que crecen en poder y su deuda kármica se vuelve simultáneamente más clara y compleja para ellos, los Muertos Hambrientos adquieren rasgos que superan con creces las torturas que experimentaron una vez."
