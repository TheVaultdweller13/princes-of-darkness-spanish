 kueijin_scheme.130.t: "Fusionar el alma"
 kueijin_scheme.130.desc: "Puedes devorar el alma de una víctima, fusionándola así con la tuya propia. Este acto cuesta automáticamente un nivel de [Glossary('Dharma','podgloss.dharma')], a menos que sigas el Aullido del Tigre Diablo [Glossary('Dharma','podgloss.dharma')] o estés al servicio de un [Glossary('Yama King','podgloss.yamaking')]. Un vampiro que devora el alma de un ser gana acceso a los recuerdos y a las habilidades de Conocimiento de ese ser. La víctima muere inmediatamente."
 kueijin_scheme.130.a: "Accederé a su conocimiento."
 kueijin_scheme.130.b: "Accederé a sus recuerdos."
