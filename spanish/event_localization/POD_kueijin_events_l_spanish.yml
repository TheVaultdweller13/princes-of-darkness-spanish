l_spanish:

 podkueijin.1.t: "¿Un sucesor digno?"
 podkueijin.1.desc: "Tus siervos han regresado con los [Glossary('Hungry Dead','game_concept_kuei_jin_desc')] más prometedores que han podido encontrar. Algunos de ellos tienen más talento que otros, pero también requerirán más influencia para vincularlos a tu servicio. Aun así, será una apuesta; no tienes tiempo para revisarlos personalmente antes de tomar tu decisión, ya que la repentina atención que les has prestado atraerá la mirada de tus rivales."
 podkueijin.1.a: "No necesito a alguien demasiado hábil. No sea que se convierta en una amenaza..."
 podkueijin.1.a.tt: "Aparecerá un nuevo heredero, considerado como tu propio chiquillo."
 podkueijin.1.b: "Este parece, al menos, tolerable."
 podkueijin.1.c: "Seguiremos la carrera de este con gran interés."
 podkueijin.1.d: "Solo el mejor prospecto servirá."

 POD_shadow_self.death_management.t: "Perdiendo una parte de ti mismo"
 POD_shadow_self.death_management.desc: "Han llegado noticias funestas: tu Sombra, una parte de tu propia alma, ha muerto. Puedes sentir un vacío terrible en tu interior. Parece que dividir tu propio ser podría tener consecuencias después de todo."
 POD_shadow_self.death_management.option.a: "Otro más que cae."
 POD_shadow_self.death_management.option.a.tt: "Tu Sombra ha muerto"

 podkueijin.10.t: "Crisis de [Glossary('Dharma','podgloss.dharma')]"
 podkueijin.10.desc: "La elección del [Glossary('Dharma','podgloss.dharma')] no tiene por qué ser permanente. La mayoría de los $pod_kueijin$ comienzan siguiendo un camino y luego lo abandonan en favor de otros destinos. A veces, incluso regresan a su propósito original. La inmortalidad ofrece una gama de opciones mayor que cualquier vida mortal, y esas elecciones nunca son tan obvias como parecen.\nDe cualquier modo, hay un coste. Se renuncian todos los niveles de [Glossary('Dharma','podgloss.dharma')]; el Kuei-jin comienza un nuevo Camino y pierde cualquier estatus o beneficio otorgado por su antiguo rango. Si se encuentra en sus primeros 50 años de no-vida, es de esperar tales fallos; puede anticipar que será reprendido, pero no severamente avergonzado."
 podkueijin.10.a: "Sigue tu instinto."
 podkueijin.10.b: "Estoy perfectamente bien..."
 
 # Initial event
 
 #podkueijin.100.t: "[Glossary('Dharma','podgloss.dharma')]"
 #podkueijin.100.desc: "Wan-Kuei have been sent back to fulfill their karmic purpose, and it is imperative that they discover what that purpose is. Each and every Wan-Kuei learns to follow a [Glossary('Dharma','podgloss.dharma')], a way of unlife whereby the Wan-Kuei seeks to discover her purpose in the Great Cycle. Through the following of a [Glossary('Dharma','podgloss.dharma')], a Wan-Kuei learns to channel Chi, understand her undead nature and re-attune herself to the karmic wheel."
 #podkueijin.100.a: "I have already achieved a [Glossary('Bodhisattva','podgloss.bodhisattva')] level of [Glossary('Dharma','podgloss.dharma')]."
 #podkueijin.100.b: "I aspire to be a [Glossary('Bodhisattva','podgloss.bodhisattva')]."
 #podkueijin.100.c: "I have already achieved an Ancestor level of [Glossary('Dharma','podgloss.dharma')]."
 #podkueijin.100.d: "I have already achieved a Mandarin level of [Glossary('Dharma','podgloss.dharma')]."
 #podkueijin.100.e: "I have already achieved a Jina level of [Glossary('Dharma','podgloss.dharma')]."
 
 podkueijin.110.t: "Yin Yang"
 podkueijin.110.desc: "Los Wan-Kuei de aspecto Yin son reservorios de energía negativa orientada a la muerte. Suelen ser calmados, racionales y crueles.\nLos Wan-Kuei de aspecto Yang, por el contrario, consumen ávidamente la energía vital. Son criaturas apasionadas, sintonizadas con los mortales y las emociones.\nAlgunos Wan-Kuei son criaturas del Equilibrio, sus cuerpos mantienen las energías de la vida y la muerte en equilibrio."
 podkueijin.110.a: "Prefiero el Yin." 
 podkueijin.110.b: "Prefiero estar en Equilibrio." 
 podkueijin.110.c: "Prefiero el Yang." 
 
 podkueijin.120.t: "Chi"
 podkueijin.120.desc: "Esta [Glossary('Wheel of Ages','podgloss.wheelofages')] gira mediante las interacciones del Yin y el Yang, representados por el divino Dragón de Ébano y la Reina Escarlata. Las energías de la creación permean el mundo, fluyendo hacia y desde el Yin y el [Glossary('Yang Worlds','game_concept_yang_world_desc')]. Llamada Chi, esta energía fluye a través e interacciona entre las Diez Mil Cosas.\n\nAl igual que los Vástagos, los Wan-Kuei sufren de hambre. Cuando un Wan-Kuei tiene cinco o menos puntos de Chi (de cualquier tipo) en su cuerpo, experimenta hambre.\n\nLas Virtudes de Chi de un Wan-Kuei indican cuánto Chi de un tipo determinado puede canalizar de forma segura a través de su cuerpo. El Wan-Kuei es capaz de ingerir más Chi temporal de lo que indican sus Virtudes de Chi (un Desequilibrio permanente permite ingerir más Chi de ese tipo sin efectos adversos). Sin embargo, un Wan-Kuei que abuse de esta práctica corre el riesgo de sufrir un Desequilibrio: una peligrosa «sobredosis» de Chi. Un Wan-Kuei que no tenga ningún tipo de Chi en su cuerpo también cae automáticamente en un estado de Desequilibrio temporal."
 podkueijin.120.a: "Aquí está mi Chi." 
 
 # Maintance event

 podkueijin.200.t: "Crisis mental: Desequilibrio"
 podkueijin.200.desc: "[GetTrait('kueijin').GetName( GetNullCharacter )] debe regular su ingesta de Chi con cuidado, para no sufrir un desequilibrio de Chi. Un desequilibrio de Chi Yin a menudo provoca que el vampiro se vuelva más cadavérico e inhumano con el tiempo; por el contrario, un desequilibrio de Yang puede provocar la aparición de diversas enfermedades vampíricas mortales y sumamente contagiosas."
 podkueijin.200.a: "Castigo por el enfoque excesivo en el Ser." 
 podkueijin.200.a.tt: "Tu cercanía al Yin te hizo más feo y un objetivo potencial para los cazadores de brujas." 
 podkueijin.200.b: "Castigo por una vida de Deseo." 
 podkueijin.200.b.tt: "Tu cercanía al Yang te convirtió en la fuente de un brote de enfermedades vampíricas." 
 podkueijin.200.c: "Enfocaré el Chi Yin en mi cuerpo para estar un poco más equilibrado." 

 podkueijin.201.t: "Ch'ing Shih"
 podkueijin.201.desc: "Ch'ing Shih son auténticas monstruosidades y no pueden pasar por humanos ordinarios de ninguna manera. La carne de los Wan Kuei se vuelve de un gris enfermizo, mientras que los huesos se tornan negros como el azabache. La piel se arruga y se comprime alrededor de los huesos. Los colmillos crecen y gotean veneno, y unas espinas negras sobresalen de la espalda, las articulaciones y la caja torácica. Todo el cuerpo brilla con fosforescencia y destella con energía Yin."
 podkueijin.201.a: "Soy un monstruo entre monstruos."
 
 # Chi mechanic event
 
 podkueijin.210.t: "Perder el control"
 podkueijin.210.desc: "Te has quedado sin Chi, quizá porque eres un Wan Kuei de tipo Yang y sientes más el Ansia, o quizá porque has gastado todo tu Chi y no puedes usar el otro aspecto del Chi porque no dominas el flujo. Así que perdiste el control y te lanzaste en un frenesí contra una multitud para conseguir algo de Chi..."
 podkueijin.210.a: "Qué lástima."

 podkueijin.211.t: "Falta de Chi"
 podkueijin.211.desc: "Un [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] sin Chi en su cuerpo comienza a desmoronarse y pudrirse. Cada vez que debas gastar Chi (para activar una $pod_discipline$ o simplemente animar tu cadáver), perderás Salud en su lugar, hasta que tu alma dual huya del cuerpo y tu existencia como un Muerto Emergente llegue a su fin."
 podkueijin.211.a: "¡Necesito Chi!" 
 
 podkueijin.220.t: "Ajustes de la mecánica de Chi"
 podkueijin.220.desc: "Puedes seleccionar qué reserva de aspectos de Chi quieres utilizar primero al usar Chi, y si sufrirás una sobredosis o no al devorar Chi."
 podkueijin.220.a: "Primero gastar: #bold Chi Yin#! / Chi Yang / Aleatorio" 
 podkueijin.220.b: "Primero gastar: Chi Yin / #bold Chi Yang#! / Aleatorio" 
 podkueijin.220.c: "Primero gastar: Chi Yin / Chi Yang / #bold Aleatorio#!" 
 podkueijin.220.d: "Al devorar Chi: #bold Sin sobredosis#! / Sobredosis" 
 podkueijin.220.e: "Al devorar Chi: Sin sobredosis / #bold Sobredosis#!" 
 podkueijin.220.f: "Confirmar" 

 # Dharma event
 
 podkueijin.230.t: "[Glossary('Dharma','podgloss.dharma')] avanzado"
 podkueijin.230.desc: "Como has alcanzado un [Glossary('Dharma','podgloss.dharma')] elevado, ahora cada avance mejorará tu Virtud de Chi, así que ahora tienes que elegir qué aspecto de la Virtud de Chi quieres expandir."
 podkueijin.230.a: "Todo a Yin."
 podkueijin.230.b: "Todo a Yang."
 podkueijin.230.c: "A ambos."
 
 podkueijin.231.t: "[Glossary('Hundred Clouds','podgloss.hundredclouds')]"
 podkueijin.231.desc: "Aunque muchos afirman que ya no quedan [Glossary('Arhats','podgloss.arhat')] en el mundo despierto, existe un saber secreto que contradice esto, uno que dice que sí, que todavía hay algunos de estos seres divinos e iluminados rondando por aquí. Aunque se supone que deben pasar al Cielo (y muchos de hecho lo hacen), los pocos mencionados permanecen en el Reino Medio por elección. Esto es especialmente cierto con los Tigres Diablo, cuyos [Glossary('Arhats','podgloss.arhat')] están esperando a que llegue la [Glossary('Sixth Age','game_concept_sixth_age_desc')]..."
 podkueijin.231.a: "Yo también me quedaré."
 podkueijin.231.b: "Quiero irme."
 
 # Misc event
 
 podkueijin.240.t: "Shintai"
 podkueijin.240.desc: "Se ha desarrollado un nuevo arte, el shintai, descendiente del arte del cuerpo divino."
 podkueijin.240.a: "Un desarrollo interesante."
 podkueijin.240.a.tt: "Todos los [GetTrait('kueijin').GetName( GetPlayer )] obtienen acceso al [shintai_lifestyle|E]."
 
 podkueijin.250.t: "La Quinta Era"
 podkueijin.250.desc: "La [Glossary('Wheel of Ages','podgloss.wheelofages')] ha alcanzado la siguiente era; a medida que las eras progresan, alimentarse se vuelve más difícil, el Chi es cada vez más raro y la Iluminación tarda más tiempo."
 podkueijin.250.a: "La era de la oscuridad."
 
 #podkueijin.260.t: "Spiritual Component Destroyed"
 #podkueijin.260.desc: "Dhampyr are dhampyr regardless of any special parentage. The power of [GetTrait('kueijin').GetName( GetPlayer )] blood either overwhelms any other inherited spiritual component or kills the child in the womb."
 #podkueijin.260.a: "My breeding plan is ruined."
 
 # Adoption event
 
 podkueijin.300.t: "¿Un sucesor digno?"
 podkueijin.300.desc: "Llamas a tus siervos para buscar información sobre los chih-mei (recientemente regresados $pod_kueijin$) en tu dominio, y has preparado el material necesario para el ritual que les haga recuperar el sentido. Puedes especificar más requisitos para involucrarte más en el proceso, pero cuanto más específico seas, más costoso será.\nEn primer lugar, ¿quieres a alguien que haya regresado recientemente de [UmbraGlossaryLocalized('yomi_wan','Inframundo Yomi')] y que haya tenido el Segundo Aliento? Esta es la opción habitual y mucho más común. Pero también podrías pedir a algún [GetTrait('shih').GetName( GetPlayer )] que haya perdido toda su Humanidad y haya despertado su P'o. Esos cazadores de demonios caídos son mucho más raros, pero obviamente conservaron algunas de sus habilidades incluso tras su muerte."
 podkueijin.300.a: "No hace falta complicarse."
 podkueijin.300.b: "Necesito a un antiguo cazador de demonios."
 podkueijin.300.c: "El Señor [Glossary('Emma-O','podgloss.emmao')] me concederá un [Glossary('Shikome','podgloss.shikome')]."

 podkueijin.310.desc: "¿Qué edad y género quieres para tu sucesor? La gente muere sin importar su juventud en esta época, así que esto no supondrá mayores dificultades para que tus exploradores lo encuentren."
 podkueijin.310.a: "Un hombre joven."
 podkueijin.310.b: "Un hombre de mediana edad."
 podkueijin.310.c: "Un hombre anciano."
 podkueijin.310.d: "Una mujer joven."
 podkueijin.310.e: "Una mujer de mediana edad."
 podkueijin.310.f: "Una mujer anciana."
 passion_bloodflowers_extra_cost_tt: "Las Flores de Sangre de la pasión no impiden técnicamente que los hombres conozcan su [Glossary('Dharma','podgloss.dharma')], pero intentar iluminar a uno sigue considerándose un acto muy inculto."
 
 #podkueijin.320.t: "A Worthy Successor?"
 #podkueijin.320.desc: "With time and efforts, your servant will eventually find a target with the necessary requirements, but this will add to the end cost of this whole endeavor."
 #podkueijin.320.a: "Find me someone that had this body feature before their second breath."
 #podkueijin.320.a.tt: "You will be presented with a choice of body features"
 #podkueijin.320.b: "Some average body is enough."

 podkueijin.321.desc: "La belleza está en el ojo del espectador... y esta vez tú eres el espectador. Podrías pedir a tu grupo de exploradores que busque candidatos que cumplan algunos criterios específicos tuyos.\nPor suerte, los $pod_kueijin$ que regresan de los Infiernos tienen sus cuerpos rejuvenecidos por aquello que los mató en primer lugar. Algunos incluso se encuentran notablemente más jóvenes, quizás porque así es como imaginan su «mejor versión». La razón exacta de este extraño proceso sigue siendo objeto de debate entre los eruditos."
 podkueijin.321.a: "Una Diaochan renacida."
 podkueijin.321.b: "Una belleza sin igual."
 podkueijin.321.c: "Ser guapa no vendría mal."
 podkueijin.321.d: "Alguien normal."

 podkueijin.322.desc: "El Iluminación dhármica no es un camino fácil. Y ciertamente no es para idiotas.\nSi bien los [UmbraGlossaryLocalized('yomi_wan','Infiernos de Yomi')] actúan como una forma bastante eficiente de deshacerse de aquellos que nunca deberían volver en primer lugar, también funcionan como una fuerza igualadora. Incluso el campesino analfabeto puede mostrar la brillantez reservada a los sabios ante tal adversidad."
 podkueijin.322.a: "¡Quiero un Zhuge Liang moderno!"
 podkueijin.322.b: "Alguien digno de mi intelecto."
 podkueijin.322.c: "Tener algo de astucia es útil."
 podkueijin.322.d: "Alguien normal."

 podkueijin.323.desc: "Mientras que algunos [UmbraGlossaryLocalized('yomi_wan','Infiernos de Yomi')] favorecen la tortura intelectual o mental, la mayoría incorpora al menos algunas formas de componentes físicos. Los $pod_kueijin$ que regresan también se encuentran en un estado de frenesí, lo que significa que instintivamente llevan su destreza física al límite en esta etapa.\nAlgunos [Glossary('Dharma','podgloss.dharma')], como los Tigres Diablo, realmente intentan cultivar esos talentos físicos tempranos, mientras que otros, como las Flores de Hueso, tienden a hacer una pausa en ello más adelante para favorecer búsquedas más intelectuales."
 podkueijin.323.a: "¡Encuéntrame a mi propio Guan Yu!"
 podkueijin.323.b: "La fuerza es, de hecho, importante."
 podkueijin.323.c: "Con estar en forma es suficiente."
 kj_education_wait_tt: "La búsqueda de tu estudiante comenzará. Llevará un par de meses."   

 #podkueijin.324.t: "A Worthy Successor?"
 #podkueijin.324.desc: "Any extra prerequisites?"
 #podkueijin.324.a: "Albino."
 #podkueijin.324.b: "Giant."
 #podkueijin.324.c: "Dwarf."
 #podkueijin.324.d: "Nothing more."

 #podkueijin.325.t: "A Worthy Successor?"
 #podkueijin.325.desc: "This is you last chance to change your target before sending out the search party."
 #podkueijin.325.a: "That is all. Get searching!"
 #podkueijin.325.b: "Go back and choose again."
 
 podkueijin.350.t: "Un estudiante digno"
 podkueijin.350.desc: "Tu sirviente te trae a quien mejor se ajusta a todos tus criterios; ahora es el momento de que este Hin aprenda sobre el [Glossary('Dharma','podgloss.dharma')] y se convierta en tu estudiante.\nRecién llegados de los horrores de los [UmbraGlossaryLocalized('yomi_wan','Infiernos de Yomi')], los $pod_kueijin$ recién llegados aparecen con más frecuencia que no en un estado de frenesí que pone en peligro tanto a ellos mismos como a su entorno.\nEs la tarea del [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] localizar a esos monstruos recién nacidos, someterlos si es necesario y luego traerlos de vuelta a su corte.\nUna vez allí, se realiza un ritual para calmar el furioso P'o de los $pod_kueijin$, haciéndolos aptos para la vida civilizada una vez más.\nSolo después de que todo esto se haya completado puede comenzar la debida erudición dhármica."
 podkueijin.350.a: "Proceder con el ritual de restauración del equilibrio dhármico."
 podkueijin.351.desc: "Tu sirviente te trae el último regalo de tu Señor [Glossary('Emma-O','podgloss.emmao')]; ahora es el momento de que este Hin aprenda sobre el [Glossary('Dharma','podgloss.dharma')] y se convierta en tu estudiante.\nRecién llegados de los horrores de [Glossary('Kakuri','podgloss.kakuri')], los [Glossary('Shikome','podgloss.shikome')] recién llegados aparecen con más frecuencia que no en un estado de frenesí que pone en peligro tanto a ellos mismos como a su entorno.\nEs la tarea del [Glossary('Infant Devil Civilizer','podgloss.infantdevilcivilizer')] someterlos y enseñarles sobre la gloriosa tarea que se les ha encomendado.\nUna vez recuperados el sentido, se realiza un ritual para calmar el furioso P'o de los [Glossary('Shikome','podgloss.shikome')], haciéndolos aptos para la vida civilizada una vez más.\nSolo después de que todo esto se haya completado puede comenzar la debida erudición dhármica para preparar al recién devoto sirviente de [Glossary('Emma-O','podgloss.emmao')] para su vida como una hermosa arma para el Daimyo de la Oscuridad."
 
 podkueijin.400.t: "Educación de [Glossary('Dharma','podgloss.dharma')]: Equilibrio"
 podkueijin.400.desc: "Los Vástagos del Este se dividen en tres tipos generales, dependiendo de sus proporciones de energías Yin/Yang. Cuanto mayor sea la diferencia entre el Yin y el Yang, más pronunciada será la personalidad del vampiro.\nEl Yin es la energía de la muerte, a menudo fría y despiadada, mientras que el Yang es la de la vida, cálida pero a veces salvaje.\nLos $pod_kueijin$ jóvenes tienden a luchar por mantener el Equilibrio entre esas energías en competencia y, aunque algunos [Glossary('Dharma','podgloss.dharma')] predican el desequilibrio, no es algo que un recién llegado pueda comprender fácilmente. Por tanto, suelen verse abrumados por una energía o la otra hasta que finalmente logran entenderlo por sí mismos.\n\n¿De qué desequilibrio sufre tu estudiante en este momento?"
 podkueijin.400.a: "Uno de Yang claro. Son inquietos."
 podkueijin.400.b: "Uno de Yin. Son reclusos."
 podkueijin.400.c: "Por ahora están notablemente equilibrados."
 
 podkueijin.401.t: "Educación de [Glossary('Dharma','podgloss.dharma')]: Direcciones"
 podkueijin.401.desc: "La mayoría de los $pod_kueijin$ reciben asignada una «dirección», un propósito particular que se espera que cumplan a lo largo de su no-vida. A través de la interacción adecuada entre la dirección y el [Glossary('Dharma','podgloss.dharma')], dicen los mandarines, cada $pod_kueijin$ descubre su destino general.\nLa asignación de una dirección es un evento importante en muchas cortes; los adivinos $pod_kueijin$ consultan laboriosamente textos de adivinación y estudian las estrellas bajo las cuales el nuevo vampiro experimentó el Segundo Aliento, todo ello en un intento de determinar la dirección ordenada divinamente.\n\nLos vampiros del norte son los preservadores y ejecutores de la tradición; son los magistrados, verdugos y jueces tanto de los $pod_kueijin$ como de la sociedad mortal.\nLos vampiros del oeste estudian los Mundos Espirituales para servir como mensajeros y guardianes del Chi; irónicamente, también sirven como espías y asesinos cuando es necesario.\nLos vampiros del este son la casta de los «cosechadores», los «agricultores» que aseguran que el rebaño mortal permanezca armonioso y sano; actúan como agentes provocadores cuando es necesario.\nLos vampiros del sur son los «Pájaros de Fuego»; su deber es fomentar el cambio en el Ciclo y guiar a los $pod_kueijin$ a la batalla.\nFinalmente, los vampiros del centro son estudiantes de la interacción eterna entre Hun y P'o, Yin y Yang, $pod_kueijin$ y otros shen. Su deber es descubrir —o crear— los enigmas de la existencia sobrenatural.\n\n¿A qué dirección acaba siendo asignado tu estudiante?"
 podkueijin.401.a: "Norte"
 podkueijin.401.b: "Este"
 podkueijin.401.c: "Centro"
 podkueijin.401.d: "Sur"
 podkueijin.401.e: "Oeste"

 podkueijin.402.t: "Educación de [Glossary('Dharma','podgloss.dharma')]: [Glossary('Wu','podgloss.wu')]"
 podkueijin.402.desc: "La idea del apoyo mutuo natural entre $pod_kueijin$ con ideas afines dicta el nivel primario de interacción y definición social dentro de la sociedad $pod_kueijin$. Se organizan en grupos de cinco (normalmente), llamados tradicionalmente [Glossary('Wu','podgloss.wu')]. Un [Glossary('Wu','podgloss.wu')] funciona como la familia sustituta de un $pod_kueijin$ durante esta segunda oportunidad de existencia.\nUn grupo de cinco vampiros (uno de cada dirección) se considera el número más auspicioso y armonioso para un [Glossary('Wu','podgloss.wu')]; sin embargo, muchos [Glossary('Wu','podgloss.wu')] incluyen más o menos $pod_kueijin$ y mezclan direcciones.\n\nLos Wu no son algo «para toda la vida» y es normal que un joven recién llegado, como tu estudiante, reciba un «[Glossary('Wu','podgloss.wu')] introductorio» con otros jóvenes para dar sus primeros pasos juntos. Como no se trata de un [Glossary('Wu','podgloss.wu')] real a largo plazo (aunque puede llegar a serlo), este acuerdo está bajo tu control. Puedes, por tanto, elegir centrar sus esfuerzos en cualquier campo en particular."
 podkueijin.402.a: "Serviréis como mis embajadores."
 podkueijin.402.b: "Ayúdame a gestionar mi dominio."
 podkueijin.402.c: "Algunas tareas delicadas requieren tu atención."
 
 podkueijin.403.t: "Educación de [Glossary('Dharma','podgloss.dharma')]: Un final"
 podkueijin.403.desc: "En la antigüedad, se tardaba diez años en educar a un Hin, pero con la actual y turbulenta era, dos años se han convertido en la norma.\nTu discípulo es ahora una adición valiosa para la sociedad $pod_kueijin$, lo suficientemente seguro de su [Glossary('Dharma','podgloss.dharma')] como para no dejar que su naturaleza feral se apodere de él. Ahora es el momento de que busque nuevas experiencias y momentos de claridad por su cuenta, o quizás se una a tu bando para asuntos más prácticos.\n¿Se convertirá en un aliado incondicional o en un enemigo tenaz? El tiempo lo dirá, como siempre lo hace."
 podkueijin.403.a: "El mundo te espera."
 
 #podkueijin.500.t: "Forge Personality"
 #podkueijin.500.desc: "Recently regaining conscience, your disciple missed a lot of first breath experience. As sifu, you should teach your disciple how to truly look into the world, and you recently found a opportunity to do just that."
 #podkueijin.500.skip: "Maybe next time"
 #podkueijin.501.a: "Be bold, even in trouble."
 #podkueijin.501.b: "Be careful if trouble arises."
 #podkueijin.502.a: "You have time."
 #podkueijin.502.b: "Show your wrath."
 #podkueijin.503.a: "Loyal to your consort."
 #podkueijin.503.b: "Love is for all."
 #podkueijin.504.a: "You are ok."
 #podkueijin.504.b: "Go for more."
 #podkueijin.505.a: "You have a cause."
 #podkueijin.505.b: "Time is on our side."
 #podkueijin.506.a: "There always is another way."
 #podkueijin.506.b: "Stay as your are."
 #podkueijin.507.a: "Revenge is eternal."
 #podkueijin.507.b: "Hatred is not the point."
 #podkueijin.508.a: "Gold is not the concern."
 #podkueijin.508.b: "Nothing is possible without money."
 #podkueijin.509.a: "You can trust people."
 #podkueijin.509.b: "You can't trust no one."
 #podkueijin.510.a: "Be honest."
 #podkueijin.510.b: "A little lie doesn't hurt."
 #podkueijin.511.a: "You are just one among many."
 #podkueijin.511.b: "You are excellent."
 #podkueijin.512.a: "Law above all."
 #podkueijin.512.b: "You above all."
 #podkueijin.513.a: "Give it time."
 #podkueijin.513.b: "Time doesn't wait."
 #podkueijin.514.a: "Pleasures are a distraction."
 #podkueijin.514.b: "Enjoy your life."
 #podkueijin.515.a: "Trust is the key."
 #podkueijin.515.b: "Betray the world before it betrays you."
 #podkueijin.516.a: "Loyal to your path."
 #podkueijin.516.b: "Your path is not so important."
 #podkueijin.517.a: "Be nice."
 #podkueijin.517.b: "Think of yourself first."
 #podkueijin.517.c: "Share your pain to the world."
 
 # Celebration general event
 
 podkueijin.1010.desc: "No sé por qué aceptarías mi invitación solo para asistir a la celebración de [other_host.GetTitledFirstNamePossessive] en su lugar, pero que sepas que lo recordaré."
 podkueijin.1010.a: "Lamentable."
 
 podkueijin.1011.opening: "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 podkueijin.1011.opening_desc: "¡Por la presente os invito a una celebración en mi corte en [barony.GetNameNoTier]!"
 podkueijin.1011.host_likes_me: "Espero que asistáis, ya que, de lo contrario, vuestra presencia se echaría de menos."
 podkueijin.1011.host_gets_along_with_me: "Como notable [ROOT.Char.GetTitleTierName], me sentiría honrado por vuestra asistencia."
 podkueijin.1011.host_dislikes_me: "Espero que todos los de importancia estén allí, lo cual, desafortunadamente, te incluye a ti."
 podkueijin.1011.a: "Por supuesto que asistiré."
 podkueijin.1011.b: "Asistiré. A regañadientes."
 podkueijin.1011.c: "Me entristece decir que estoy ocupad[ROOT.Char.Custom('ES_OA')]."
 podkueijin.1011.d: "¡No, me niego!"

 podkueijin.1012.desc: "¡Por la presente os invito a una celebración en mi corte en [barony.GetNameNoTier]! Será un evento grandioso, digno de vuestra honorable presencia."
 podkueijin.1012.a: "Será un placer para mí."
 podkueijin.1012.b: "Tengo asuntos más importantes que atender."

 podkueijin.1013.desc: "¡Por la presente os invito a una celebración en mi corte en [barony.GetNameNoTier]! Será un evento grandioso, con un «postre» y un entretenimiento encantadores."
 podkueijin.1013.a: "Será un placer para mí."
 podkueijin.1013.b: "Tengo asuntos más importantes que atender."
 
 podkueijin.1021.t: "Celebración: Una reunión alegre"
 podkueijin.1021.desc: "Los invitados se han reunido en el gran salón; nobles de los rincones más cercanos y lejanos del Señorío.\n\n¡El ambiente es animado y los espíritus están por las nubes mientras comienza la celebración!"
 podkueijin.1021.a: "¡Bienvenidos, amigos!"
 podkueijin.1021.a.tt: "La celebración comienza"
 
 podkueijin.1022.t: "Una cálida bienvenida"
 podkueijin.1022.likes_host: "Todos los invitados se han reunido en el gran salón, ¡y nuestro amable anfitrión, [activity.GetOwner.GetTitledFirstName], nos ha dado la bienvenida a todos a la celebración!"
 podkueijin.1022.dislikes_host: "Todos los invitados se han reunido en el gran salón, y nuestro [activity.GetOwner.Custom('InsultAdjective')] anfitrión, [activity.GetOwner.GetTitledFirstName], finalmente nos ha dado la bienvenida a todos a la celebración."
 podkueijin.1022.a.gregarious: "¡No puedo esperar para hablar con todo el mundo!"
 podkueijin.1022.a.shy: "Hay mucha gente aquí..."
 podkueijin.1022.a: "¡Espero con ansias este momento!"
 podkueijin.1022.b: "Más vale que esto merezca mi tiempo."
 
 podkueijin.1041.t: "Celebración: Mientras mis invitados se marchan"
 podkueijin.1041.desc: "Con todo el mundo dirigiéndose a sus respectivos hogares, ¡me enorgullece decir que la celebración ha sido un éxito!"
 podkueijin.1041.spouse: "\n\nTengo que agradecer gran parte de su éxito a mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName], y no siento más que gratitud mientras [spouse.GetSheHe] despide a los últimos invitados."
 podkueijin.1041.no_spouse: "No obstante, sigo agradecido de que la empresa haya terminado por ahora."
 podkueijin.1041.a: "¡Hasta la próxima!"

 podkueijin.1042.t: "Celebración: Regreso a casa"
 podkueijin.1042.desc: "¡Qué celebración! Recordaré durante mucho tiempo los días pasados en los salones de [host.GetTitledFirstNamePossessive].\n\nAhora es el momento de lavarse los rastros de regocijo y «postre», y retomar una vez más mis deberes como gobernante en el mundo sobrenatural."
 podkueijin.1042.a: "¡Adiós, mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]!"

 podkueijin.1090.t: "Deberes abandonados"
 podkueijin.1090.desc: "¡Qué desastre!\n\nTras todos mis preparativos, ¡mis invitados llegaron a una celebración sin anfitrión!\nSe han ido a casa y les he dejado una terrible impresión de mí."
 podkueijin.1090.a: "Puede que me arrepienta de esto."
 
 podkueijin.1091.t: "Una pobre celebración"
 podkueijin.1091.desc: "No puedo creerlo. A pesar de mis invitaciones y preparativos, ni un solo invitado se presentó en mi celebración.\n\n¡No importa! ¡Disfrutaré de todo este «postre» yo solo, y el eco de los pasos en mi gran salón es toda la compañía que necesito!"
 podkueijin.1091.a: "¿De verdad estoy tan solo?"
 podkueijin.1091.b: "Me siento un poco aliviad[ROOT.Char.Custom('ES_OA')]."
 
 podkueijin.1092.t: "Celebración: Desatendida"
 podkueijin.1092.desc: "¡Qué escándalo! ¡[activity.GetOwner.GetTitledFirstName] no se ha presentado en su propia celebración!\n\n¿Está [activity.GetOwner.GetSheHe] intentando dejarnos a todos en evidencia?"
 podkueijin.1092.a: "¡Esto ha sido una pérdida de tiempo!"

 podkueijin.1093.t: "Celebración: Fin de las festividades"
 podkueijin.1093.desc: "Con el paso de la celebración de [host.Custom2('MyCharacterIntroduction', ROOT.Char)], esta llega a su fin.\n\nA medida que los invitados se retiran, ruego que [ROOT.Char.GetFaith.HighGodNameAlternate] reciba a [host.GetFirstName] con tanto calor en el [ROOT.Char.GetFaith.PositiveAfterLife] como [host.GetSheHe] nos recibió en sus salones."
 podkueijin.1093.a: "Fin de la celebración."

 podkueijin.1094.desc: "Dado que ahora estoy tras las rejas, mi gran celebración será cancelada. Oh, todas esas horas que pasé preparándola... ¡Perdidas!"

 podkueijin.1095.desc: "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ha sido encarcelad[ROOT.Char.Custom('ES_OA')], y su gran celebración ha llegado a su fin. ¡Qué mala suerte de tiempos!"
 
 # Art Traning event
 art_train_header: "Entrenamiento de artes:"
 
 podkueijin.1101.t: "$art_train_header$ Palabra extraña"
 podkueijin.1101.desc: "Buscas entre tu colección de libros extraños para encontrar inspiración cuando uno de ellos capta tu atención; ha sido escrito por un autor occidental. En una línea, dice que los vampiros orientales usan «que vivas en tiempos interesantes» como insulto... pero, ¿qué significa esto?"
 podkueijin.1101.a: "No tiene ningún significado."
 podkueijin.1101.b: "Lo traduciré como «que nazcas en una familia mejor»."
 
 podkueijin.1102.t: "$art_train_header$ Estancamiento"
 podkueijin.1102.desc: "Te has entrenado duro y lo has logrado, pero tienes la sensación persistente de que puedes hacerlo mejor; tal vez deberías exigirte un poco más, aunque quizá, en su lugar, retrocedas."
 podkueijin.1102.a: "No me forzaré."
 podkueijin.1102.b: "Me forzaré."
 
 podkueijin.1199.t: "$art_train_header$ Resultado del entrenamiento"
 podkueijin.1199.desc_shintai: "Tu continua lucha y entrenamiento con otros ha dado algún resultado.\n\n"
 podkueijin.1199.desc_chi_arts: "Tu continua coordinación con la energía chi del ambiente ha dado algún resultado.\n\n"
 podkueijin.1199.desc_soul_arts: "Tu continuo trabajo en las artes del alma ha dado algún resultado.\n\n"
 podkueijin.1199.desc_demon_arts: "Tu continua interacción con tu Demonio ha dado algún resultado.\n\n"
 podkueijin.1199.desc_qiao: "Tus continuos intentos de conectarte con el mundo han dado algún resultado.\n\n"
 podkueijin.1199.desc_tan: "Tus continuos experimentos con nuevos materiales han dado algún resultado.\n\n"
 podkueijin.1199.desc_wu_tan: "Tus continuos experimentos con los elementos han dado algún resultado.\n\n"
 podkueijin.1199.desc_no_focus: "Tu rápido cambio de enfoque podría darte algún resultado extraño...\n\n"
 podkueijin.1199.desc_good: "Has mejorado mucho en tu poder artístico."
 podkueijin.1199.desc_good_bad: "Has ganado mucha experiencia para tu arte."
 podkueijin.1199.desc_same: "Solo has aprendido un poco."
 podkueijin.1199.desc_bad_good: "Te has forzado demasiado; esto le ha dado a tu Demonio la oportunidad de atacar."
 podkueijin.1199.desc_bad: "Tu Demonio se ha desatado por completo debido a que tu práctica ha salido mal."
 podkueijin.1199.desc_fallback: "Espero que lo hagas mejor la próxima vez."
 podkueijin.1199.a: "Muy bien."
 podkueijin.1199.a.ex: "¡Usaré mi conocimiento del [Glossary('Dharma','podgloss.dharma')] para entender aún más!"
 podkueijin.1199.b: "Es suficiente."
 podkueijin.1199.b.ex: "¡Usaré mi conocimiento del [Glossary('Dharma','podgloss.dharma')] para llegar a una conclusión!"
 podkueijin.1199.c: "Mejor que nada."
 podkueijin.1199.c.ex: "Mi conocimiento del [Glossary('Dharma','podgloss.dharma')] me ayudará a conseguir más."
 podkueijin.1199.d: "Resistiré."
 podkueijin.1199.d.ex: "Usaré mi experiencia en el [Glossary('Dharma','podgloss.dharma')] para calmar esta situación."
 podkueijin.1199.e: "Aquí viene..."
 podkueijin.1199.e.ex: "Gastaré gran parte de mi progreso en el [Glossary('Dharma','podgloss.dharma')] para evitar esto."
 
 # Trek the Wild event
 trek_header: "Explorar lo salvaje:"
 
 podkueijin.1201.t: "$trek_header$ Un aprendiz [GetTrait('shih').GetName( GetPlayer )]"
 podkueijin.1201.desc: "Caminabas por lo salvaje cuando un joven cazador de monstruos te detiene. ¿Aceptas a este desafiante?"
 podkueijin.1201.a: "Te lo demostraré."
 podkueijin.1201.b: "Será mejor que huya."
 
 podkueijin.1202.t: "$trek_header$ Un mentor [GetTrait('shih').GetName( GetPlayer )]"
 podkueijin.1202.desc: "Parece que el mentor de ese discípulo estaba cerca; rescató a su aprendiz de ti y antepuso el autocontrol a la necesidad de venganza, incluso después de que lastmaras a su discípulo. Una rara muestra de moderación por parte del [GetTrait('shih').GetName( GetPlayer )]."
 podkueijin.1202.a: "Otro cadáver."
 podkueijin.1202.b: "Les dejaré ir."
 
 podkueijin.1211.t: "$trek_header$ Animal exótico"
 podkueijin.1211.desc_opening: "Llevabas tiempo viajando por medio de la nada hasta que te topaste con algunos "
 podkueijin.1211.desc_white_deer: "ciervos blancos"
 podkueijin.1211.desc_rhinoceros: "rinocerontes"
 podkueijin.1211.desc_green_peafowl: "pavorreales verdes"
 podkueijin.1211.desc_panda: "pandas"
 podkueijin.1211.desc_snub_nosed_monkey: "monos de nariz chata"
 podkueijin.1211.desc_ending: "cerca de ti; cazar un animal tan raro seguramente te dará prestigio."
 podkueijin.1211.a: "Los capturaré."
 podkueijin.1211.a.success: "Lo logré."
 podkueijin.1211.a.failure: "He fracasado."
 podkueijin.1211.b: "Les dejaré ir."
 
 podkueijin.1221.t: "Encuentro con la Serenísima Maestra Perla Negra, Madre de las Sombras"
 podkueijin.1221.desc: "Has conocido a la renombrada [Glossary('Arhat','podgloss.arhat')] de las Flores de Hueso, que además tiene el aspecto de una chica de dieciséis años. Difícil de encontrar y protegida por un formidable séquito de seguidores y sus sirvientes espíritus invocados, no obstante, está dispuesta a compartir su sabiduría con quienes logren encontrarla. Su sincero deseo es preservar todo el conocimiento que pueda en preparación para la próxima [Glossary('Sixth Age','game_concept_sixth_age_desc')]."
 podkueijin.1221.a: "Es un honor para mí."
 
 podkueijin.1299.t: "$trek_header$ Regreso de la naturaleza"
 podkueijin.1299.desc_opening: "Terminaste tu aventura y regresas a casa para descansar.\n\n"
 podkueijin.1299.desc_good: "Tu gran acción se ha conocido por todas partes; admiran tu hazaña."
 podkueijin.1299.desc_good_bad: "Ahora circulan algunas historias inventadas sobre ti, incluso algunas buenas."
 podkueijin.1299.desc_same: "Casi nadie sabe lo que hiciste; algunos incluso notaron tu ausencia."
 podkueijin.1299.desc_bad_good: "Ahora circulan algunas historias inventadas sobre ti, la mayoría malas."
 podkueijin.1299.desc_bad: "Tu vergonzoso acto se ha conocido por todas partes; esto afectará a tu prestigio."
 podkueijin.1299.desc_fallback: "Por alguna razón, tu acción nunca fue registrada..."
 podkueijin.1299.a: "Excelente."
 podkueijin.1299.a.ex: "¡Que alguien busque un cuentista, todos deberían conocer mi leyenda!"
 podkueijin.1299.b: "Bien."
 podkueijin.1299.b.ex: "¡No! ¡Debo contratar a alguien para que hable por mí!"
 podkueijin.1299.c: "Está bien."
 podkueijin.1299.c.ex: "Bueno, siempre recibo bien algún rumor útil."
 podkueijin.1299.d: "Preferiría que esperaran menos de mí."
 podkueijin.1299.d.ex: "Esto podría ser malo si no tenemos «otra versión» de la historia..."
 podkueijin.1299.e: "Que hablen, no me importa."
 podkueijin.1299.e.ex: "Pagaré a alguien para que limpie esto."

 # Living between Mortal event
 mortal_business_header: "Entre los mortales:"
 
 podkueijin.1301.t: "$mortal_business_header$ Presagios"
 podkueijin.1301.desc: "Eres excepcionalmente hábil en prácticas formales e informales de adivinación y lectura de presagios. Dependiendo de tu nivel de habilidad, podrías ser capaz de establecer un próspero negocio en el mundo mortal."
 podkueijin.1301.a: "Sé leer las manos."
 podkueijin.1301.b: "Puede que sepa algo sobre Tzu Wei."
 podkueijin.1301.c: "Predigo los destinos."
 
 podkueijin.1311.t: "Encuentro con la Madre de las Mil Grullas"
 podkueijin.1311.desc: "Has conocido a la [Glossary('Arhat','podgloss.arhat')] de los Dragones Azotadores; ella es la fundadora directa de la secta de los Arcoíris Sonrientes y fundadora indirecta de todas las demás. Se mantiene presente en los Reinos Mortales, cambiando de retiro cada cuatro años. Sigue consultando regularmente con los adeptos del [Glossary('Dharma','podgloss.dharma')] sobre asuntos de Iluminación, aunque hoy en día prefiere hablar con jinas de bajo rango que con mandarines."
 podkueijin.1311.a: "Es un honor para mí."
 
 podkueijin.1399.t: "$mortal_business_header$ Regreso del mundo mortal"
 podkueijin.1399.desc_opening: "Tras pasar tiempo entre los mortales, finalmente regresas a tu mundo, separándote de ellos como debes.\n\n"
 podkueijin.1399.desc_good: "Durante la estancia, has ganado una fortuna fácilmente."
 podkueijin.1399.desc_good_bad: "Has obtenido algo de oro en el proceso."
 podkueijin.1399.desc_same: "Has obtenido algo de oro por tu trabajo."
 podkueijin.1399.desc_bad_good: "Te has quedado tablas."
 podkueijin.1399.desc_bad: "Has perdido algo de oro."
 podkueijin.1399.desc_fallback: "Tu cuenta muestra unos números extraños..."
 podkueijin.1399.a: "¡Soy rico!"
 podkueijin.1399.b: "Cuanto más, mejor."
 podkueijin.1399.c: "Mejor que nada."
 podkueijin.1399.d: "Hum..."
 podkueijin.1399.e: "Una exhibición vergonzosa."
 
 # Second Breathday event
 
 podkueijin.1501.t: "Segundo Breathday: El mejor regalo"
 podkueijin.1501.desc: "Los invitados entraban uno a uno, mientras el canciller anunciaba los exóticos tesoros que habían entregado como regalo; el más especial de todos era el de [friendly_guest.GetFirstNameNoTooltip], algo verdaderamente inaudito."
 podkueijin.1501.a: "¡Muy bien!"
 
 podkueijin.1502.t: "Segundo Breathday: El peor regalo"
 podkueijin.1502.desc: "Los invitados entraban uno a uno, mientras el canciller anunciaba los exóticos tesoros que habían entregado como regalo. Pero cometiste el error de invitar a [unfriendly_guest.GetFirstNameNoTooltip], ¡porque [unfriendly_guest.GetSheHe] te ha regalado una campana funeraria!"
 podkueijin.1502.a: "¡Cómo te atreves!"
 
 podkueijin.1510.t: "Segundo Breathday: El niño melocotón"
 podkueijin.1510.desc: "En medio de la celebración, cuando abres tus Melocotones de la Inmortalidad, ¡descubres que hay un niño dentro!"
 podkueijin.1510.a: "Ummm... ¡postre extra!"
 podkueijin.1510.b: "Saca a este Momotaro de aquí."
 
 # Dragon Boat festival event
 
 podkueijin.1601.t: "Carrera de barcos dragón: Inicio"
 podkueijin.1601.desc: "La carrera de barcos dragón ha comenzado y los competidores se dividen en dos equipos, el escarlata y el negro; podrías hacer una pequeña apuesta sobre qué equipo ganará."
 podkueijin.1601.a: "Equipo escarlata."
 podkueijin.1601.b: "Equipo negro."
 podkueijin.1601.c: "No me interesa."
 
 podkueijin.1602.t: "Carrera de barcos dragón: Ventaja"
 podkueijin.1602.desc: "Los competidores reman desesperadamente contra las olas crecientes y el fuerte viento, avanzando rápidamente hacia la vanguardia. Tu equipo preferido ya lleva varios centímetros de ventaja sobre el otro equipo, lo cual es genial..."
 podkueijin.1602.a: "Cambiar la apuesta."
 podkueijin.1602.b: "Mantener la apuesta."
 
 podkueijin.1603.t: "Carrera de barcos dragón: Desventaja"
 podkueijin.1603.desc: "Los competidores reman desesperadamente contra las olas crecientes y el fuerte viento, avanzando rápidamente hacia la vanguardia. Tu equipo preferido ya lleva varios centímetros de retraso respecto al otro equipo, esto es malo..."
 podkueijin.1603.a: "Cambiar la apuesta."
 podkueijin.1603.b: "Mantener la apuesta."
 
 podkueijin.1604.t: "Carrera de barcos dragón: Victoria"
 podkueijin.1604.desc: "Como una flecha lanzada por la cuerda, los barcos dragón se perseguían unos a otros, ¡y tu equipo preferido ha ganado! ¡Esto es increíble!"
 podkueijin.1604.a: "Sé que tengo buena intuición."
 
 podkueijin.1605.t: "Carrera de barcos dragón: Derrota"
 podkueijin.1605.desc: "Como una flecha lanzada por la cuerda, los barcos dragón se perseguían unos a otros, y tu equipo preferido ha perdido. Has perdido tu apuesta."
 podkueijin.1605.a: "Pasa a veces."
 
 # Art Scheme
 
 kueijin_scheme.100.t: "Devoración de Espíritus"
 kueijin_scheme.100.desc: "Realmente puedes ver el alma fantasmal fluir desde el cuerpo de la víctima y entrar en tu tercer ojo. Ahora puedes decidir qué hacer."
 kueijin_scheme.100.a: "Purgar el alma."
 kueijin_scheme.100.b: "Torturar el alma."
 kueijin_scheme.100.c: "¡Devora el alma!"
 
 kueijin_scheme.110.t: "Purga del alma"
 kueijin_scheme.110.desc: "El alma de la víctima se une a la tuya, y puedes comenzar un proceso de purificación en ella."
 kueijin_scheme.110.a: "Intento devolverle a su Camino Dhármico."
 kueijin_scheme.110.b: "Intento restaurar su Humanidad perdida."
 
 kueijin_scheme.120.t: "Tortura del alma"
 kueijin_scheme.120.desc: "Mientras atormentas el alma, puedes implantar cualquier orden deseada o incluso llegar al extremo de cambiar la Naturaleza de la víctima." 
 kueijin_scheme.120.craven: "Quiero cambiar su naturaleza a cobarde."
 kueijin_scheme.120.brave: "Quiero cambiar su naturaleza a valiente."
 kueijin_scheme.120.wrathful: "Quiero cambiar su naturaleza a colérico."
 kueijin_scheme.120.calm: "Quiero cambiar su naturaleza a calmado."
 kueijin_scheme.120.lustful: "Quiero cambiar su naturaleza a lujurioso."
 kueijin_scheme.120.chaste: "Quiero cambiar su naturaleza a casto."
 kueijin_scheme.120.ambitious: "Quiero cambiar su naturaleza a ambicioso."
 kueijin_scheme.120.content: "Quiero cambiar su naturaleza a conforme."
 kueijin_scheme.120.lazy: "Quiero cambiar su naturaleza a perezoso."
 kueijin_scheme.120.diligent: "Quiero cambiar su naturaleza a diligente."
 kueijin_scheme.120.stubborn: "Quiero cambiar su naturaleza a obstinado."
 kueijin_scheme.120.fickle: "Quiero cambiar su naturaleza a voluble."
 kueijin_scheme.120.eccentric: "Quiero cambiar su naturaleza a excéntrico."
 kueijin_scheme.120.vengeful: "Quiero cambiar su naturaleza a vengativo."
 kueijin_scheme.120.forgiving: "Quiero cambiar su naturaleza a indulgente."
 kueijin_scheme.120.greedy: "Quiero cambiar su naturaleza a codicioso."
