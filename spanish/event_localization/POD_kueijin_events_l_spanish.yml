 kueijin_scheme.200.t: "Inyectar emoción"
 kueijin_scheme.200.desc: "Transmites silenciosamente impulsos empáticos simples al objetivo. Así, podrías llenar a [recipient.GetName] de miedo, alegría, tristeza o emociones similares. La emoción es lo suficientemente fuerte como para que [recipient.GetName] se vea obligado a actuar en consecuencia."
 kueijin_scheme.200.a: "Una emoción que aumente una parte de su personalidad."
 kueijin_scheme.200.b: "Una que disminuya una parte de su personalidad."
 
