l_spanish:
 
 POD_spirit_travel.1300.t: "El sueño es mi realidad"
 POD_spirit_travel.1300.desc: "La Periferia puede ser un lugar hermoso a veces. Cuando la humanidad sueña y tiene esperanzas, el reflejo del mundo material en la Periferia es tan hermoso como puede llegar a ser, calmando a cualquier visitante con una cálida sensación de paz y seguridad.\nSin embargo, los sueños nunca duran, y estos momentos fugaces es mejor saborearlos siempre que puedas."
 POD_spirit_travel.1300.a: "Qué calma..."
 POD_spirit_travel.1300.b: "No es relajante. ¡Es aburrido!"
 
 POD_spirit_travel.1301.t: "Portales a los sueños"
 POD_spirit_travel.1301.desc: "El área más onírica de la [umbra|E], la Periferia, representa ese extraño estado de conciencia incompleta entre el sueño y el despertar total.\nComo tal, es un lugar muy extraño, similar al mundo material pero no del todo. Es donde la gente espera, reza o teme por el mañana. Es dicha y dolor al mismo tiempo, y sería fácil perderse en esas sensaciones extremas."
 POD_spirit_travel.1301.a: "Mejor seguir adelante..."
 POD_spirit_travel.1301.b: "La vida es una Contienda."

 POD_spirit_travel.1302.t: "Incurriendo en los sueños"
 POD_spirit_travel.1302.desc: "Casi todo el mundo tiene acceso a la Periferia de alguna manera, ya que es donde se forman los sueños y cobran sustancia. Para un viajero experimentado de la [umbra|E] (como tú), no es muy difícil incursionar en los sueños de otras personas. Sin embargo, no hay forma de saber exactamente con quién te estás metiendo, así que es realmente dar palos de ciego."
 POD_spirit_travel.1302.a: "¡Se viene un mal sueño!"
 POD_spirit_travel.1302.b: "No seamos crueles."

 POD_spirit_travel.1400.t: "Ves gente muerta"
 POD_spirit_travel.1400.desc: "Las [UmbraGlossary('shadowlands')] son un lugar árido y desesperanzador, incluso para los wraiths. Todos los seres aquí están condenados a una agonía lenta hasta su inevitable descenso al [UmbraGlossary('oblivion')]. Es difícil no sentirse atormentado por la desesperación que rodea el lugar, y quedarse mucho tiempo pasará factura incluso a las almas más resistentes."
 POD_spirit_travel.1400.a: "Debo seguir adelante."
 POD_spirit_travel.1400.b: "¡Hola, oscuridad, mi vieja amiga!"
 
 POD_spirit_travel.1401.t: "Cementerio de civilizaciones"
 POD_spirit_travel.1401.desc: "La muerte no espera a nadie y las [UmbraGlossary('shadowlands')] están llenas de wraiths de civilizaciones extranjeras (o incluso desaparecidas hace mucho tiempo). Algunos de ellos pueden ser bastante habladores sobre su cultura pasada y agradecen un compañero de conversación dispuesto a aprender sobre ella. La nostalgia es un sentimiento poderoso para los perdidos y los condenados.\nMientras escuchas a uno de estos wraiths, tu mente divaga y casi puedes sentirte viviendo en ese tiempo y lugar junto a ellos..."
 POD_spirit_travel.1401.a: "¡Es hora de un cambio!"
 POD_spirit_travel.1401.b: "Estoy bien con quien soy."
 
 dead_insight_modifier: "Perspicacia desde la tumba"
 dead_insight_modifier_desc: "Conoces la sabiduría de eruditos desaparecidos hace mucho tiempo. Pero también apestas a muerte e instintivamente repeles a cualquiera que se te acerque."
 
 POD_spirit_travel.1402.t: "Conocimiento del más allá"
 POD_spirit_travel.1402.desc: "Las almas perdidas confinadas en las [UmbraGlossary('shadowlands')] proceden de todos los rincones de la Tierra y puedes encontrar una sorprendente cantidad de perspicacia en ellas. Sin embargo, los wraiths son notoriamente reservados y aprender de ellos requiere un esfuerzo no despreciable. Si estás dispuesto a quedarte un poco más en el Reino de los Muertos, podrías convencer a algunos de que te enseñen algún conocimiento útil."
 POD_spirit_travel.1402.a: "Tengo tiempo."
 POD_spirit_travel.1402.b: "No me demoraré más de la cuenta."
  
 back_to_nature_modifier: "Volver a la naturaleza"
 back_to_nature_modifier_desc: "Tu viaje por las [UmbraGlossary('spirit_wilds')] te hizo darte cuenta de la belleza de la naturaleza y del horror que la humanidad le ha causado."
 
 POD_spirit_travel.1500.t: "Volver a la naturaleza"
 POD_spirit_travel.1500.desc: "Las [UmbraGlossary('spirit_wilds')] son una representación espiritual de la Tierra en su forma más pura y natural. En muchos sentidos, es un Paraíso indómito y salvaje, pero tampoco está completamente aislado del mundo material. La corrupción traída por la humanidad puede verse infiltrándose en los lugares donde las civilizaciones son especialmente poderosas."
 POD_spirit_travel.1500.a: "¿Civilización? ¡Una plaga!"
 POD_spirit_travel.1500.b: "El progreso no se puede detener."
  
 POD_spirit_travel.1501.t: "La Tortuga Negra"
 POD_spirit_travel.1501.desc: "Te has topado con el esquivo Genbu, un espíritu de tortuga anciana y sabia. Genbu es un pensador lento pero poderoso, a menudo confundido con un Tótem de la Sabiduría debido a su dependencia del pensamiento para resolver problemas, pero también disfruta usando el ingenio para burlar a sus enemigos. Es un enemigo astuto, que normalmente se subestima, y sus elaborados esquemas suelen ser extraños e impredecibles.\nEste encuentro fortuito podría ser una oportunidad única para asegurar su ayuda, si eres capaz de demostrarle que eres digno, por supuesto."
 POD_spirit_travel.1501.a: "Engañar al embaucador."
 POD_spirit_travel.1501.effect.success.desc: "¡Genbu está impresionado!" 
 POD_spirit_travel.1501.success: "¡Genbu está impresionado!"
 POD_spirit_travel.1501.failure.effect.desc: "Genbu no está impresionado..."
 POD_spirit_travel.1501.failure: "Genbu no está impresionado..."
  
 POD_spirit_travel.1502.t: "El mundo salvaje"
 POD_spirit_travel.1502.desc: "Como representación espiritual del estado natural del mundo, los [UmbraGlossary('spirit_wilds')] son un lugar salvaje habitado por toda clase de criaturas extintas en el mundo material (o que nunca existieron en él). La mayoría de ellas no son precisamente amigables y una manada de estas te ha visto y ha decidido que serías una comida perfectamente aceptable. Quizás quieras evitar ese destino."
 POD_spirit_travel.1502.a: "¡El hombre contra la naturaleza!"
 POD_spirit_travel.1502.b: "¡Huye!"

 POD_spirit_travel.1600.t: "Sobrecarga"
 POD_spirit_travel.1600.desc: "El Plano Astral es el señorío de las ideas, los pensamientos y las invenciones. Claramente un gran lugar para aprender mucho... pero quizás demasiado grande en realidad. Hay tanto que asimilar aquí, posibilidades sin explorar, un potencial loco... el cerebro humano simplemente no está hecho para ese tipo de exploración ilimitada. Puedes sentir cómo te vas alejando, perdiéndote lentamente en esta infinitud..."
 POD_spirit_travel.1600.a: "¡Cuántas posibilidades!"
 POD_spirit_travel.1600.b: "Debo concentrarme..."
  
 mind_blown_modifier: "Mente explotada"
 mind_blown_modifier_desc: "¡Lo ves todo!"
 
 POD_spirit_travel.1601.t: "Racionalidad"
 POD_spirit_travel.1601.desc: "El Plano Astral es una representación completa del potencial ilimitado de las ideas y los pensamientos. Todo es posible para el visitante erudito si tiene la Fuerza de Voluntad para quedarse y escuchar. Sin embargo, esta amalgama etérea y sin forma de ideas tiene poca paciencia para conceptos triviales como la «sociabilidad» y, cada vez que aprendes algo, puedes sentirte cada vez más molesto ante la perspectiva de tener que hablar con otros seres en algún momento."
 POD_spirit_travel.1601.a: "¿Quién necesita amigos?"
 POD_spirit_travel.1601.b: "Ya sé suficiente."
   
 POD_spirit_travel.1602.t: "Redirección"
 POD_spirit_travel.1602.desc: "Hay demasiadas ideas flotando en el [UmbraGlossary('astral_plane')] como para que puedas explorarlas todas, pero podría haber otra opción a considerar para explotar el potencial de este lugar. A las ideas les encanta encontrar un nuevo «hogar» en el mundo material y, con la Fuerza de Voluntad adecuada, podrías ser capaz de empujar suavemente una hacia los sueños y pensamientos de alguien cercano a ti. Entonces, ¿quién sabe qué podría resultar de esta «repentina» inspiración?"
 POD_spirit_travel.1602.a: "Te guiaré hacia tu nuevo huésped."
 POD_spirit_travel.1602.b: "No soy una Musa."
     
 POD_spirit_travel.1700.t: "El río del lenguaje"
 POD_spirit_travel.1700.desc: "En el interior de la [UmbraGlossary('vulgate')] se puede encontrar el Río del Lenguaje. Como su nombre sugiere, este río es una representación espiritual de las múltiples lenguas de la humanidad. Un espíritu de paso te ha contado que cuanto más arriba subas por el río, más antiguas serán las lenguas que encuentres allí.\nPuedes intentar beber de él en esos puntos específicos para obtener algún conocimiento perdido, pero aprender instantáneamente una lengua antigua puede resultar bastante costoso para la mente."
 POD_spirit_travel.1700.a: "¿Quizás aquí?"
 POD_spirit_travel.1700.b: "Este lugar parece el Nilo."
 POD_spirit_travel.1700.c: "Un pequeño e interesante afluente por aquí."
 POD_spirit_travel.1700.d: "Nada interesante."

 POD_spirit_travel.1701.t: "Simplificación"
 POD_spirit_travel.1701.desc: "La [UmbraGlossary('vulgate')] es donde las impresiones e ideas más básicas cobran forma. Cosas como una silla, el cielo estando sobre las personas y otros conceptos simples en los que la humanidad no piensa demasiado y da por sentados. Como tal, este lugar es bastante pacífico y reconfortante, pero no muy estimulante intelectualmente. Podrías perderte fácilmente dejándote llevar, teniendo pensamientos simples, si no tienes cuidado."
 POD_spirit_travel.1701.a: "El fuego quema."
 POD_spirit_travel.1701.b: "Es hora de pensar en la política de mi señorío."

 vulgate_confused_modifier: "Confundido"
 vulgate_confused_modifier_desc: "Eso no tiene ningún sentido... ¿verdad?"

 vulgate_understanding_modifier: "Comprensión extraña"
 vulgate_understanding_modifier_desc: "Supongo que tiene sentido."
 
 POD_spirit_travel.1702.t: "Filosofía baja"
 POD_spirit_travel.1702.desc: "Al ser el lugar donde las ideas y conceptos más básicos de la humanidad cobran forma, la [UmbraGlossary('vulgate')] es el hogar de algunos espíritus... peculiares. Estos «filósofos» han tenido una eternidad para reflexionar sobre las verdades más simples del universo y luego han ideado algunas soluciones «interesantes».\nCometiste el error de quedar atrapado en uno de sus argumentos y estás completamente desconcertado por la forma en que hacen que ideas simples suenen tan complejas. Parece que los filósofos son iguales en todas partes."
 POD_spirit_travel.1702.a: "¡Estuve equivocado todo este tiempo!"
 POD_spirit_travel.1702.b: "¡Eso no tiene ningún sentido!"
 POD_spirit_travel.1702.c: "Supongo que tiene algún tipo de sentido..."

 POD_spirit_travel.1800.t: "Paz y Tranquilidad"
 POD_spirit_travel.1800.desc: "Pareciéndose al Himalaya, así llaman a su hogar; las Patria Tribal de los Contempladores de Estrellas es un lugar de autorreflexión cubierto de paisajes majestuosos y pacíficos hasta donde alcanza la vista. Para un miembro de esta tribu es, verdaderamente, su hogar, el lugar donde puede encontrarse a sí mismo y finalmente comprender su verdad interior."
 POD_spirit_travel.1800.a: "La verdad está aquí."
 
 POD_spirit_travel.1801.t: "Las cinco pruebas"
 POD_spirit_travel.1801.desc: "La Patria Tribal de los Contempladores de Estrellas es un lugar de contemplación, pero también un lugar diseñado para poner a prueba a los Garou tanto física como mentalmente. Como Contemplador de Estrellas que eres, se te da la bienvenida a probar cualquiera de los cinco cursos de entrenamiento. Sin embargo, sabes muy bien que se espera que fracases mucho por el camino, lo cual podría no ser lo más prestigioso para que lo vean tus hermanos."
 POD_spirit_travel.1801.a: "Mi conocimiento es vasto."
 POD_spirit_travel.1801.b: "Puedo ser más astuto que el $glossary_wyrm$."
 POD_spirit_travel.1801.c: "Mi Túmulo está en orden."
 POD_spirit_travel.1801.d: "Cuando hablo, me escuchan."
 POD_spirit_travel.1801.e: "Puedo conducirnos a la victoria."
 POD_spirit_travel.1801.f: "Aún no estoy listo."

 POD_spirit_travel.1802.t: "Visitante no deseado"
 POD_spirit_travel.1802.desc: "La Patria Tribal de los Contempladores de Estrellas no es un lugar amigable para los forasteros de la tribu como tú. Aunque sus habitantes no son abiertamente hostiles, se empeñan en confundirte y mantenerte alejado de los lugares realmente importantes del Señorío. Incluso las discusiones simples con ellos terminan haciéndote sentir más confundido tras sus respuestas de lo que estabas antes de hacer tus preguntas."
 POD_spirit_travel.1802.a: "No debería quedarme aquí mucho tiempo."
 
 POD_spirit_travel.1900.t: "El amor es una montaña"
 POD_spirit_travel.1900.desc: "Los [UmbraGlossary('spires')] actúan como un pasaje entre el [UmbraGlossary('vulgate')] y las Epifanías. Es una cadena de montañas muy altas, cada una representando uno de los conceptos fundamentales experimentados por la humanidad desde el principio de los tiempos. Para navegar por los Chapiteles, tienes que escalar metafóricamente una de esas montañas, confiando en tu propia visión e interpretación del concepto asociado a ella.\nPor suerte, has comenzado tu viaje cerca de la representación espiritual del amor, lo que ahora está poniendo a prueba tus conocimientos sobre este difícil tema."
 POD_spirit_travel.1900.a: "Sé un par de cosas sobre el amor..."
 POD_spirit_travel.1900.b: "¡El amor es una mentira!"
 love_spires_tt: "Como tienes al menos un amante o alma gemela, puedes permanecer en los [UmbraGlossary('spires')] sin daño."
 unlove_spires_tt: "Como no tienes al menos un amante o alma gemela, te sientes mentalmente agotad[X.Custom('ES_OA')] por tu estancia en los [UmbraGlossary('spires')]."

 POD_spirit_travel.1901.t: "Montaña de la guerra"
 POD_spirit_travel.1901.desc: "Los [UmbraGlossary('spires')] actúan como un pasaje entre el [UmbraGlossary('vulgate')] y las Epifanías. Es una cadena de montañas muy altas, cada una representando uno de los conceptos fundamentales experimentados por la humanidad desde el principio de los tiempos. Para navegar por los Chapiteles, tienes que escalar metafóricamente una de esas montañas, confiando en tu propia visión e interpretación del concepto asociado a ella.\nPor suerte, has comenzado tu viaje cerca de la representación espiritual de la guerra, lo que ahora está poniendo a prueba tus conocimientos sobre este difícil tema."
 POD_spirit_travel.1901.a: "Sé un par de cosas sobre la guerra..."
 POD_spirit_travel.1901.b: "Empleo a otras personas para hacer la guerra."
 war_spires_tt: "Como tienes al menos un buen conocimiento de asuntos marciales, puedes permanecer en los [UmbraGlossary('spires')] sin daño."
 unwar_spires_tt: "Como no tienes al menos un buen conocimiento de asuntos marciales, te sientes mentalmente agotad[X.Custom('ES_OA')] por tu estancia en los [UmbraGlossary('spires')]."

 POD_spirit_travel.1902.t: "Escalando tu destino"
 POD_spirit_travel.1902.desc: "Los [UmbraGlossary('spires')] actúan como un pasaje entre el [UmbraGlossary('vulgate')] y las Epifanías. Es una cadena de montañas muy altas, cada una representando uno de los conceptos fundamentales experimentados por la humanidad desde el principio de los tiempos. Para navegar por los Chapiteles, tienes que escalar metafóricamente una de esas montañas, confiando en tu propia visión e interpretación del concepto asociado a ella.\nPor suerte, has comenzado tu viaje cerca de la representación espiritual del destino, lo que ahora está poniendo a prueba tus conocimientos sobre este difícil tema."
 POD_spirit_travel.1902.a: "Sé un par de cosas sobre el destino..."
 POD_spirit_travel.1902.b: "¿Puedes repetir la pregunta?"
 destiny_spires_tt: "Como tienes al menos un buen conocimiento de asuntos eruditos, puedes permanecer en los [UmbraGlossary('spires')] sin daño."
 undestiny_spires_tt: "Como no tienes al menos un buen conocimiento de asuntos eruditos, te sientes mentalmente agotad[X.Custom('ES_OA')] por tu estancia en los [UmbraGlossary('spires')]."

 POD_spirit_travel.2000.t: "Centinelas celestiales"
 POD_spirit_travel.2000.desc: "Lo que antaño fue un terreno abierto para aventureros y filósofos espirituales, el [UmbraGlossary('grand_hall')] ha sido ocupado durante el primer siglo d. C. por una raza de misteriosos centinelas. Su propósito principal parece ser asegurarse de que la gente no merodee por el [UmbraGlossary('grand_hall')] como solía hacerlo. Básicamente, su lema es: «haz tus asuntos aquí y luego sigue adelante».\nSu presencia y sus constantes miradas de sospecha hacia ti hacen que este Señorío, de otro modo agradable, sea una estancia más estresante de lo que anticipabas."
 POD_spirit_travel.2000.a: "No me quedaré mucho tiempo, lo prometo"
 
 POD_spirit_travel.2001.t: "Deambulando"
 POD_spirit_travel.2001.desc: "El [UmbraGlossary('grand_hall')] es en realidad un nombre bastante erróneo. Es principalmente un laberinto muy grande de pasillos con un estilo mediterráneo clásico. Como la mayoría de las cosas en la [umbra|E], también está en constante cambio, lo que significa que puedes deambular posiblemente para siempre y seguir descubriendo cosas nuevas. Sin embargo, algunos de los posibles descubrimientos no son tan benignos como otros, así que nunca sabrás cuál será el resultado final de tal deambulación."
 POD_spirit_travel.2001.a: "Me siento con suerte."
 POD_spirit_travel.2001.b: "Me quedaré quieto por ahora, gracias."

 POD_spirit_travel.2002.t: "La fuente"
 POD_spirit_travel.2002.desc: "En una gran cámara nexo, se encuentran doce pasillos. En el centro de ese espacio, una fuente está rodeada de figuras muy realistas incrustadas en piedra. Uno de los centinelas, los guardianes autoproclamados de este Señorío, te explica que estas estatuas fueron antaño visitantes que pensaron que estaban por encima de las leyes de los centinelas para este lugar. Evidentemente, se equivocaron.\nEl centinela concluye su historia aconsejándote que no muestres la misma arrogancia."
 POD_spirit_travel.2002.a: "Una historia curiosa."
 POD_spirit_travel.2002.b: "¡Yo los habría aplastado!"

 mirror_zone_modifier: "Experimentó la Zona Espejo"
 mirror_zone_modifier_desc: "Has visto demasiadas cosas inquietantes en la Zona Espejo como para que te sigan molestando los problemas mundanos."

 POD_spirit_travel.2100.t: "Frente al Espejo"
 POD_spirit_travel.2100.desc: "Siempre moviéndose entre señoríos, la Zona Espejo es una presencia inquietante en la [umbra|E]. Provoca alucinaciones localizadas que son, a la vez, imposibles y sumamente personales. Amantes del pasado, enemigos muertos y otras relaciones personales te aguardan en su interior.\nPor fortuna, estas alucinaciones son solo temporales y pueden ser una buena forma de reforzar tu psique para las pruebas que se avecinan. Aun así, aquí y ahora, supondría un gran coste para tu cordura."
 POD_spirit_travel.2100.a: "Desafiaré a los fantasmas de mi pasado."
 POD_spirit_travel.2100.b: "Evitarlos parece más seguro."

 POD_spirit_travel.2101.t: "Posibilidades reflejadas"
 POD_spirit_travel.2101.desc: "La misteriosa Zona Espejo disfruta mostrando a sus «huéspedes» lo que podría haber sido. El tapiz infinito de posibilidades que surgiría de una simple elección diferente en algún punto de tu vida. Alarmantemente, también se sabe que intenta forzar esas realidades alternativas en los visitantes por algún tipo de perversa diversión astral.\nAl enfrentarte a uno de los espejos, te ves como un gran general incluso en tus primeros días, uno que nunca ha conocido la derrota y que siempre será recordado por la Historia."
 POD_spirit_travel.2101.a: "...es verdad, ¿no?"
 POD_spirit_travel.2101.b: "¡Espera, ese no soy yo!"

 POD_spirit_travel.2102.desc: "La misteriosa Zona Espejo disfruta mostrando a sus «huéspedes» lo que podría haber sido. El tapiz infinito de posibilidades que surgiría de una simple elección diferente en algún punto de tu vida. Alarmantemente, también se sabe que intenta forzar esas realidades alternativas en los visitantes por algún tipo de perversa diversión astral.\nAl enfrentarte a uno de los espejos, te ves como un gran diplomático incluso en tus primeros días, uno que siempre podía salirse con la suya y que siempre será recordado por la Historia."

 POD_spirit_travel.2200.t: "Caminos de Wyck"
 POD_spirit_travel.2200.desc: "En su esencia, los Caminos del Wyck son solo un enorme laberinto de pequeños senderos que conducen a casi cualquier lugar en la [umbra|E] y más allá. Es bastante difícil orientarse en un lugar así, pero también se sabe que los Caminos están fuera del concepto material del tiempo, lo que significa que tienes, literalmente, todo el tiempo del mundo para hacerlo. El único problema con el que puedes encontrarte aquí es morir de aburrimiento, ya que nunca ocurre nada de interés real."
 POD_spirit_travel.2200.a: "Al menos no es peligroso."
 
 POD_spirit_travel.2201.t: "Caminando solo"
 POD_spirit_travel.2201.desc: "En su esencia, los Caminos del Wyck son solo un enorme laberinto de pequeños senderos que conducen a casi cualquier lugar en la [umbra|E] y más allá. Es bastante difícil orientarse en un lugar así, pero también se sabe que los Caminos están fuera del concepto material del tiempo, lo que significa que tienes, literalmente, todo el tiempo del mundo para hacerlo. El único problema con el que puedes encontrarte aquí es morir de aburrimiento, ya que nunca ocurre nada de interés real.\nSientes que llevas días aquí y no hay nada que hacer más que seguir caminando, y caminando, y caminando..."
 POD_spirit_travel.2201.a: "De hecho, lo encuentro bastante refrescante."
 POD_spirit_travel.2201.b: "Aburridoooo"

 POD_spirit_travel.2202.t: "Entrenamiento astral"
 POD_spirit_travel.2202.desc: "En su esencia, los Caminos del Wyck son solo un enorme laberinto de pequeños senderos que conducen a casi cualquier lugar en la [umbra|E] y más allá. Es bastante difícil orientarse en un lugar así, pero también se sabe que los Caminos están fuera del concepto material del tiempo, lo que significa que tienes, literalmente, todo el tiempo del mundo para hacerlo. El único problema con el que puedes encontrarte aquí es morir de aburrimiento, ya que nunca ocurre nada de interés real.\nSientes que llevas días aquí y no hay nada que hacer más que seguir caminando, y caminando, y caminando... Al menos, es un buen entrenamiento si no hay otra cosa."
 POD_spirit_travel.2202.a: "Uno, dos, uno, dos..."

 POD_spirit_travel.2300.t: "Días felices"
 POD_spirit_travel.2300.desc: "Las Epifamias encarnan conceptos de abstracción completa y a menudo se materializan como nubes coloridas en el cielo umbrío del [UmbraGlossary('vulgate')].\nPor un golpe de buena fortuna, has alcanzado la [UmbraGlossary('epiphamy')] de la Felicidad. Flotando en una nube placenteramente esponjosa, te sientes más vigorizado y, bueno, más feliz de lo que jamás has sido en toda tu vida."
 POD_spirit_travel.2300.a: "¡Sin una sola preocupación en el mundo!"
 POD_spirit_travel.2300.b: "La felicidad está sobrevalorada. De vuelta al trabajo."

 epiphamie_love_modifier: "Días felices"
 epiphamie_love_modifier_desc: "¿Por qué debería importarte algo? ¡Eres feliz!"

 POD_spirit_travel.2301.t: "Ex Nihilo"
 POD_spirit_travel.2301.desc: "Las Epifamias encarnan conceptos de abstracción completa y a menudo se materializan como nubes coloridas en el cielo umbrío del [UmbraGlossary('vulgate')].\nPor un golpe de mala fortuna, has alcanzado la [UmbraGlossary('epiphamy')] del Olvido. Terminando en una tormenta de nubes negras y siniestras, apenas puedes liberarte antes de ser arrastrado para convertirte en parte de esta Epifamia siempre hambrienta."
 POD_spirit_travel.2301.a: "He perdido una parte de mí mismo."
 POD_spirit_travel.2301.b: "Eso ha estado demasiado cerca..."
 POD_spirit_travel.2301.c: "¡Hola, oscuridad, mi vieja amiga!"

 POD_spirit_travel.2302.t: "Gloria astral"
 POD_spirit_travel.2302.desc: "Las Epifamias encarnan conceptos de abstracción completa y a menudo se materializan como nubes coloridas en el cielo umbrío del [UmbraGlossary('vulgate')].\nPor un golpe de buena fortuna, has alcanzado la [UmbraGlossary('epiphamy')] de la Gloria. Rodeado por nubes que lucen de algún modo regales, puedes sentirte más erguido que antes, con tu poderosa mirada imponiendo el respeto de quienes te rodean."
 POD_spirit_travel.2302.a: "Puedes dirigirte a mí como «su majestad»."
 
 POD_spirit_travel.2400.t: "Tecnobalbuceo"
 POD_spirit_travel.2400.desc: "El [UmbraGlossary('inventium')] es un señorío lleno de cada invención con la que la humanidad haya soñado jamás. Un grupo de magos, herederos de quienes descubrieron este lugar, controla este señorío en parte con la esperanza de hacer avanzar el conocimiento humano y, en otra parte, para lucrarse con él.\nHoy, te encuentras acorralado por uno de sus excéntricos miembros que divaga sobre su última extravagancia. Aunque no está muy bien estructurado, casi puedes ver la brillantez tras sus teorías... o la pura locura."
 POD_spirit_travel.2400.a: "¡Tiene todo el sentido del mundo!"
 POD_spirit_travel.2400.b: "Si me disculpa..."
 POD_spirit_travel.2400.c: "Querido colega, está cometiendo algunos errores clave..."

 POD_spirit_travel.2401.t: "Herramientas del Oficio"
 POD_spirit_travel.2401.desc: "El [UmbraGlossary('inventium')] es un señorío lleno de cada invención con la que la humanidad haya soñado jamás. Un grupo de magos, herederos de quienes descubrieron este lugar, controla este señorío en parte con la esperanza de hacer avanzar el conocimiento humano y, en otra parte, para lucrarse con él.\nHoy has encontrado un extraño conjunto de herramientas aparentemente bastante avanzadas. Aunque no estás de humor para construir cosas nuevas, aún puedes usarlas para darles un poco de brillo a tus pertenencias actuales."
 POD_spirit_travel.2401.a: "¡Como nuevas!"
 
 POD_spirit_travel.2402.t: "Eruditos ladrones"
 POD_spirit_travel.2402.desc: "El [UmbraGlossary('inventium')] es un señorío lleno de cada invención con la que la humanidad haya soñado jamás. Un grupo de magos, herederos de quienes descubrieron este lugar, controla este señorío en parte con la esperanza de hacer avanzar el conocimiento humano y, en otra parte, para lucrarse con él.\nEstos llamados «Saqueadores» suelen estar cegados por la codicia y han olvidado hace tiempo sus antaño elevados ideales. Lo molesto es que ahora son bastante buenos robando a los visitantes del Inventium sin ser notados. Lamentablemente, hoy has sido una de sus víctimas y no puedes ir acusando a cada mago de aquí de robo menor sin crear una situación difícil."
 POD_spirit_travel.2402.a: "¿Robo astral? ¿En serio?"
 
 POD_spirit_travel.2500.t: "Clío, Musa de la Historia"
 POD_spirit_travel.2500.desc: "Las Cortes de las Musas han sufrido mucho con la casi completa extinción de la creencia helénica clásica. Aun así, mientras su Señorío se reduce cada día, las nueve hijas de Zeus siguen practicando su arte, con la esperanza de que su pasión logre retrasar el Olvido un poco más.\nClío es la Musa de la Historia y está más que dispuesta a enseñarte su tema favorito. Aun así, al ser entidades espirituales, es probable que tal enseñanza tenga un impacto profundo en cómo ves el mundo que te rodea."
 POD_spirit_travel.2500.a: "Enséñame, oh Musa."
 POD_spirit_travel.2500.b: "Debo declinar cortésmente."

 POD_spirit_travel.2501.t: "Melpómene, Musa de la Tragedia"
 POD_spirit_travel.2501.desc: "Las Cortes de las Musas han sufrido mucho con la casi completa extinción de la creencia helénica clásica. Aun así, mientras su Señorío se reduce cada día, las nueve hijas de Zeus siguen practicando su arte, con la esperanza de que su pasión logre retrasar el Olvido un poco más.\nMelpómene es la Musa de la Tragedia y está más que dispuesta a enseñarte su tema favorito. Aun así, al ser entidades espirituales, es probable que tal enseñanza tenga un impacto profundo en cómo ves el mundo que te rodea."
 
 POD_spirit_travel.2502.t: "Talía, Musa de la Comedia"
 POD_spirit_travel.2502.desc: "Las Cortes de las Musas han sufrido mucho con la casi completa extinción de la creencia helénica clásica. Aun así, mientras su Señorío se reduce cada día, las nueve hijas de Zeus siguen practicando su arte, con la esperanza de que su pasión logre retrasar el Olvido un poco más.\nTalía es la Musa de la Comedia y está más que dispuesta a enseñarte su tema favorito. Aun así, al ser entidades espirituales, es probable que tal enseñanza tenga un impacto profundo en cómo ves el mundo que te rodea."
 
 POD_spirit_travel.2600.t: "Anfitriones hostiles"
 POD_spirit_travel.2600.desc: "La [UmbraGlossary('city_of_brass')] es el hogar de los Djinns y sus ciudadelas más poderosas. Estos espíritus son notoriamente hostiles con los visitantes tras unos desagradables altercados con magos en el pasado. Para colmo, se les conoce por ser mentirosos compulsivos.\nLos Djinns han sentido tu aproximación y te han acorralado, preguntando por qué deberían vagar libremente por su fabuloso hogar. Claramente, podrías ofrecer una «muestra de aprecio» para tus anfitriones..."
 POD_spirit_travel.2600.a: "Espíritus codiciosos..."
 POD_spirit_travel.2600.effect.success.desc: "Los Djinns te dejan continuar" 
 POD_spirit_travel.2600.success: "Los Djinns te dejan continuar"
 POD_spirit_travel.2600.failure.effect.desc: "Un impuesto fronterizo..."
 POD_spirit_travel.2600.failure: "Tienes que pagar el precio"
 
 POD_spirit_travel.2601.t: "Djinns mentirosos"
 POD_spirit_travel.2601.desc: "La [UmbraGlossary('city_of_brass')] es el hogar de los Djinns y sus ciudadelas más poderosas. Estos espíritus son notoriamente hostiles con los visitantes tras unos desagradables altercados con magos en el pasado. Para colmo, se les conoce por ser mentirosos compulsivos.\nLos Djinns se han interesado en ti y te han coaccionado a participar en uno de sus infames juegos de acertijos. Si no quieres quedar mal ante tus no tan amables anfitriones, tendrás que adivinar la respuesta correcta. Lo cual se complica por el hecho de que incluso las reglas mienten..."
 POD_spirit_travel.2601.a: "Espíritus mentirosos..."
 POD_spirit_travel.2601.effect.success.desc: "¡Has acertado!" 
 POD_spirit_travel.2601.success: "¡Has acertado!"
 POD_spirit_travel.2601.failure.effect.desc: "Te has equivocado..."
 POD_spirit_travel.2601.failure: "Te has equivocado..."
  
 POD_spirit_travel.2602.t: "Djinns apostadores"
 POD_spirit_travel.2602.desc: "La [UmbraGlossary('city_of_brass')] es el hogar de los Djinns y sus ciudadelas más poderosas. Estos espíritus son notoriamente hostiles con los visitantes tras unos desagradables altercados con magos en el pasado. Para colmo, se les conoce por ser mentirosos compulsivos.\nEl Califa de los Djinns, al-Dimiryat, te ha invitado a un juego de suerte con grandes apuestas; si ganas, obtendrás una parte del legendario tesoro de los Djinns. Sin embargo, obviamente hay truco: el juego está amañado en tu contra y el Califa inventa las reglas sobre la marcha. Pero si existe una mínima posibilidad de que puedas ganar... ¿quizá valga la pena?"
 POD_spirit_travel.2602.a: "Me siento con suerte"
 POD_spirit_travel.2602.b: "La dama Fortuna es demasiado caprichosa"
  
 POD_spirit_travel.2700.t: "Prohibido el paso"
 POD_spirit_travel.2700.desc: "El Reino Etéreo es accesible desde las nubes de los [UmbraGlossary('spirit_wilds')]. Su punto más bajo son las fantásticas montañas hechas de nubes e habitadas por espíritus aéreos. Tienen una capa superior esponjosa, pero son sólidas y fáciles de caminar. Las nubes se desplazan y fluyen con sus propios ritmos, formando maravillosos paisajes de llanuras, colinas, valles y montañas que comparten la misma solidez esponjosa.\nEs un reino controlado completamente por la Nación Garou y sus aliados y, como tal, es muy poco acogedor para los forasteros. En cuanto llegaste, has estado huyendo, perseguido por los muchos y poderosos guardianes del reino."
 POD_spirit_travel.2700.a: "Debería marcharme rápido"
 
 POD_spirit_travel.2701.t: "Escalada astral"
 POD_spirit_travel.2701.desc: "El Reino Etéreo es accesible desde las nubes de los [UmbraGlossary('spirit_wilds')]. Su punto más bajo son las fantásticas montañas hechas de nubes e habitadas por espíritus aéreos. Tienen una capa superior esponjosa, pero son sólidas y fáciles de caminar. Las nubes se desplazan y fluyen con sus propios ritmos, formando maravillosos paisajes de llanuras, colinas, valles y montañas que comparten la misma solidez esponjosa.\nAunque es posible usar las nubes como medio para viajar por los reinos, algunos prefieren escalar las numerosas montañas que salpican el lugar. Ciertamente es una tarea más estresante, pero podría ser un buen ejercicio."
 POD_spirit_travel.2701.a: "¡Hasta la cima del mundo!"
 POD_spirit_travel.2701.b: "Saltar entre nubes es más divertido."

 POD_spirit_travel.2702.t: "Observar las estrellas de cerca"
 POD_spirit_travel.2702.desc: "El Reino Etéreo es accesible desde las nubes de los [UmbraGlossary('spirit_wilds')]. Su punto más bajo son las fantásticas montañas hechas de nubes e habitadas por espíritus aéreos. Tienen una capa superior esponjosa, pero son sólidas y fáciles de caminar. Las nubes se desplazan y fluyen con sus propios ritmos, formando maravillosos paisajes de llanuras, colinas, valles y montañas que comparten la misma solidez esponjosa.\nLa Éter es quizás el lugar más cercano a las estrellas accesible para la mayoría de los viajeros del [umbra|E]. Se refleja en el mundo físico como los cielos que ciclan constantemente entre el día y la noche. Como tal, ofrece una visión verdaderamente única de lo que hay más allá."
 POD_spirit_travel.2702.a: "¿Qué hay ahí arriba?"

 POD_spirit_travel.2800.t: "Sufrimiento eterno"
 POD_spirit_travel.2800.desc: "Forjado con dolor humano. Milenios de sufrimiento de todas las víctimas del mundo han creado este Señorío, un lugar donde las peores crueldades y torturas han sido inmortalizadas.\nNo es un lugar para los débiles de corazón, ni siquiera para alguien que tenga corazón."
 POD_spirit_travel.2800.a: "Qué desperdicio..."
 POD_spirit_travel.2800.b: "Je, no está tan mal."

 POD_spirit_travel.2801.t: "Sufrimiento hastiado"
 POD_spirit_travel.2801.desc: "Forjado con dolor humano. Milenios de sufrimiento de todas las víctimas del mundo han creado este Señorío, un lugar donde las peores crueldades y torturas han sido inmortalizadas.\nEs difícil no verse afectado por el aura de sufrimiento que impregna el aire en este reino. Te guste o no, pronto parecerás más imponente que antes, intimidando a quienes te rodean con la amenaza implícita de un tormento eterno."
 POD_spirit_travel.2801.a: "El miedo es para otros."
 
 full_intimidation_tooltip: "Obtendrás el árbol de Estilo de vida de Intimidación completo."
 
 POD_spirit_travel.2802.t: "Distribuidor de dolor"
 POD_spirit_travel.2802.desc: "Criador de dolor humano. Milenios de sufrimiento de las víctimas de todo el mundo han creado este Señorío, un lugar donde las peores crueldades y torturas han sido inmortalizadas.\nPara el alma verdaderamente hastiada, hay mucho que aprender aquí sobre las complejidades del sufrimiento mental y físico. Pero incluso esa alma hastiada podría verse abrumada por la pura agonía que se siente en este páramo. Después de todo, nadie es verdaderamente inmune al dolor."
 POD_spirit_travel.2802.a: "Un arte en sí mismo."
 POD_spirit_travel.2802.b: "Debo seguir adelante."
  
 POD_spirit_travel.2900.t: "General de sillón"
 POD_spirit_travel.2900.desc: "El Campo de Batalla es un señorío dedicado a la violencia y la Furia, y el caos lo gobierna mientras los ejércitos se mezclan: los soldados Qin terminan luchando contra las legiones romanas y los Cruzados se alían con los bárbaros vikingos contra las tropas mayas. Mientras uno no entre en uno de los conflictos, un visitante camina por una «pista» apropiada para la batalla que presencia (un barco para una batalla naval, un camino romano para un conflicto durante las guerras púnicas, etc.). Mientras no se salga de la pista, no será atacado directamente.\nEsta peculiaridad hace que te resulte muy fácil presenciar una de esas batallas y criticar a los generales claramente incompetentes desde tu cómodo asiento. ¡Obviamente lo harías mucho mejor en su lugar!"
 POD_spirit_travel.2900.a: "¡Es tan fácil que podría subir la dificultad!"
 
 POD_spirit_travel.2901.t: "La guerra cambia"
 POD_spirit_travel.2901.desc: "El Campo de Batalla es un señorío dedicado a la violencia y la Furia, y el caos lo gobierna mientras los ejércitos se mezclan: los soldados Qin terminan luchando contra las legiones romanas y los Cruzados se alían con los bárbaros vikingos contra las tropas mayas. Mientras uno no entre en uno de los conflictos, un visitante camina por una «pista» apropiada para la batalla que presencia (un barco para una batalla naval, un camino romano para un conflicto durante las guerras púnicas, etc.). Mientras no se salga de la pista, no será atacado directamente.\nCon tantas eras y culturas representadas, es fácil ver que la guerra, en efecto, cambia. Siempre hay una razón detrás de cada uno de esos cambios, por insignificantes que parezcan. Estudiarlos podría ser una buena oportunidad para aprender."
 POD_spirit_travel.2901.a: "¿A dónde se han ido los carros?"
 POD_spirit_travel.2901.b: "La guerra es un medio, no un fin."
 
 POD_spirit_travel.2902.t: "Una vida de guerra"
 POD_spirit_travel.2902.desc: "El Campo de Batalla es un señorío dedicado a la violencia y la Furia, y el caos lo gobierna mientras los ejércitos se mezclan: los soldados Qin terminan luchando contra las legiones romanas y los Cruzados se alían con los bárbaros vikingos contra las tropas mayas. Mientras uno no entre en uno de los conflictos, un visitante camina por una «pista» apropiada para la batalla que presencia (un barco para una batalla naval, un camino romano para un conflicto durante las guerras púnicas, etc.). Mientras no se salga de la pista, no será atacado directamente.\nMientras atraviesas la zona, un grupo de guerreros te saluda y, aunque no les entiendes por completo, parece que se burlan de ti por el hecho de no estar participando en una de esas batallas. Claramente piensan que eres débil."
 POD_spirit_travel.2902.a: "Solo estoy de paso."
 POD_spirit_travel.2902.b: "¡Te mostraré si soy débil!"
  
 POD_spirit_travel.3000.t: "Conversación canina clásica"
 POD_spirit_travel.3000.desc: "Érebo es un lugar de limpieza espiritual, lleno de ríos de plata fundida que queman y curan al mismo tiempo, prolongando el tormento de los internos durante meses, años, posiblemente incluso siglos.\nLas puertas de Érebo están custodiadas por el temible Cerbero, un gran monstruo canino de tres cabezas. Cerbero puede estar emparentado con el clásico sabueso de la mitología griega y romana, o puede haber tomado el nombre y la apariencia de esos mitos. Nunca ha confirmado ninguna de las dos opciones, pero encuentra interesantes los relatos de este periodo y disfruta debatiéndolos.\nSe le considera un compañero de conversación agradable y educado a pesar de su apariencia. Pronto te estarás imaginando en uno de esos relatos épicos de héroes y monstruos de la antigüedad."
 POD_spirit_travel.3000.a: "La cultura griega es fascinante, en verdad."
 POD_spirit_travel.3000.b: "Una conversación interesante, nada más."
 
 charyss_umbra_modifier: "Evaluación de Charyss"
 charyss_umbra_modifier_desc: "Charyss miró tu alma y te encontró insuficiente."

 POD_spirit_travel.3001.t: "La Dama de la Salvación"
 POD_spirit_travel.3001.desc: "Érebo es un lugar de limpieza espiritual, lleno de ríos de plata fundida que queman y curan al mismo tiempo, prolongando el tormento de los internos durante meses, años, posiblemente incluso siglos.\nLa señora del señorío es la enigmática Charyss. Su fortaleza se alza en el centro de un lago y da la bienvenida a cualquier suplicante. La imponente Dama de Érebo contempla entonces el alma del peticionario y, la gran mayoría de las veces, la encuentra insuficiente. Solo con la aprobación de Charyss se puede considerar a alguien verdaderamente purificado."
 POD_spirit_travel.3001.a: "Buscaré la aprobación de la Dama."
 POD_spirit_travel.3001.b: "Estaré bien por mi cuenta."
  
 POD_spirit_travel.3002.t: "Salvación a través del dolor"
 POD_spirit_travel.3002.desc: "Érebo es un lugar de limpieza espiritual, lleno de ríos de plata fundida que queman y curan al mismo tiempo, prolongando el tormento de los internos durante meses, años, posiblemente incluso siglos.\nTraicionado por tu propia culpa, te encuentras sumergido en las aguas de plata fundida de Érebo. Rápidamente descubres que la única salida es a través de los espejos del alma. Los guardianes de este señorío trabajan por parejas para cruzar los espejos y entrar en la mente de cada sufriente. Aquí trabajan para buscar las fuentes de la culpa, obligándote a enfrentarte a cada una y reconocer tus fallos. Y mientras no se haga, seguirás nadando en este río tan doloroso..."
 POD_spirit_travel.3002.a: "¡Me arrepiento! ¡Me arrepiento!"
  
 POD_spirit_travel.3100.t: "¿Qué te gusta?"
 POD_spirit_travel.3100.desc: "Como uno de los Anclas del $glossary_wyld$ dentro del mundo, el Flux es un lugar de caos, de cambio constante y posibilidad infinita. Cada ser dentro del reino del Flux comienza a cambiar de numerosas formas, ya que las propias leyes de la realidad son maleables y cambiantes.\nTe resulta difícil permanecer aquí y mantener tu identidad central. Con cada momento que pasa, nuevos pensamientos e ideas invaden tu mente, intentando hacerte creer que siempre fueron tuyos..."
 POD_spirit_travel.3100.a: "La verdad es relativa."
 POD_spirit_travel.3100.b: "¡Resistiré!"
   
 umbra_random_dna_tt: "Tu apariencia cambiará aleatoriamente."

 POD_spirit_travel.3101.t: "¿Qué aspecto tienes?"
 POD_spirit_travel.3101.desc: "Como uno de los Anclas del $glossary_wyld$ dentro del mundo, el Flux es un lugar de caos, de cambio constante y posibilidad infinita. Cada ser dentro del reino del Flux comienza a cambiar de numerosas formas, ya que las propias leyes de la realidad son maleables y cambiantes.\nTe resulta difícil permanecer aquí y mantener tu identidad central. Con cada momento que pasa, tu propia apariencia está cambiando, alejándose rápidamente de lo que era hacia una forma nueva e impredecible..."
 POD_spirit_travel.3101.a: "Siempre tuve este aspecto."
 POD_spirit_travel.3101.b: "¡Resistiré!"
   
 POD_spirit_travel.3102.t: "¿Qué aspecto tienes?"
 POD_spirit_travel.3102.desc: "Como uno de los Anclas del $glossary_wyld$ dentro del mundo, el Flux es un lugar de caos, de cambio constante y posibilidad infinita. Cada ser dentro del reino del Flux comienza a cambiar de numerosas formas, ya que las propias leyes de la realidad son maleables y cambiantes.\nTe resulta difícil permanecer aquí y mantener tu identidad central. Con cada momento que pasa, tu propio físico está cambiando, alejándose rápidamente de lo que era hacia una forma nueva e impredecible..."
 POD_spirit_travel.3102.a: "Siempre tuve este aspecto."
 POD_spirit_travel.3102.b: "¡Resistiré!"
     
 devoted_mariana_modifier: "Devoto de Mariana"
 devoted_mariana_modifier_desc: "Te has dedicado a la reina hada Mariana. Ella consume cada uno de tus pensamientos."

 sorcery_gain_tt: "El rasgo de hechicería abre un nuevo Estilo de vida."

 POD_spirit_travel.3200.t: "La Princesa Hada Oscura"
 POD_spirit_travel.3200.desc: "Hy-Brasil aparece como una tierra de historias de fantasía interminables. Aquí, las estaciones nunca cambian y el día permanece atrapado eternamente en el crepúsculo.\nLa Princesa Mariana gobierna la corte de hadas Oscuras aquí y está sumida en una guerra eterna contra el Príncipe Lysander de los Luminosos. La astuta belleza oscura es joven pero posee un talento sobrenatural en las más grandes Magias de las hadas. Se ha ofrecido a compartir algunos de sus secretos contigo, si tan solo te consagraras a su causa..."
 POD_spirit_travel.3200.a: "¡Salve a la futura Reina!"
 POD_spirit_travel.3200.b: "¡Esto no es base para un sistema de gobierno!"
  
 POD_spirit_travel.3201.t: "Campo de batalla de las hadas"
 POD_spirit_travel.3201.desc: "Hy-Brasil se presenta como una tierra de historias de fantasía interminables. Aquí, las estaciones nunca cambian y el día permanece anclado eternamente en el crepúsculo.\nEste señorío es un campo de batalla disputado entre dos facciones de hadas, los Luminosos y los Oscuros. Aunque la mayor parte de su competencia toma la forma de intriga cortesana, a veces también termina en el campo de batalla. Pobre del forastero, como tú, que se encuentre atrapado entre las líneas de batalla mágicas."
 POD_spirit_travel.3201.a: "¿Eso es una bola de fuego?"
 POD_spirit_travel.3201.b: "¡Huye!"
  
 POD_spirit_travel.3202.t: "El valiente Príncipe hada"
 POD_spirit_travel.3202.desc: "Hy-Brasil se presenta como una tierra de historias de fantasía interminables. Aquí, las estaciones nunca cambian y el día permanece anclado eternamente en el crepúsculo.\nEl Príncipe Lysander gobierna la corte de las hadas Luminosas aquí y está sumido en una guerra eterna contra la princesa Mariana de los Oscuros. La bella y oscura mujer es astuta, joven pero con un talento sobrenatural para las más grandes Magias de las hadas. El honorable caballero es un combatiente temible, y siempre está dispuesto a aceptar nuevos aprendices, siempre que no les importe sufrir algunos golpes en el proceso."
 POD_spirit_travel.3202.a: "¿Un combate de práctica, Príncipe?"
 POD_spirit_travel.3202.b: "Puedo pasar sin eso, gracias."
   
 POD_spirit_travel.3300.t: "Exhibición vergonzosa"
 POD_spirit_travel.3300.desc: "El Reino de las Leyendas puede recrear los recuerdos del linaje de alguien, permitiéndole experimentar las vidas de sus antepasados legendarios.\nAunque algunas leyendas es mejor dejarlas en el olvido, acabas de revivir un doloroso momento de cobardía de uno de tus antepasados. El recuerdo permanece vívido lo suficiente como para hacerte dudar de ti mismo por un momento."
 POD_spirit_travel.3300.a: "Espero ser mejor de lo que él fue."
 
 POD_spirit_travel.3301.t: "Grandes hazañas"
 POD_spirit_travel.3301.desc: "El Reino de las Leyendas puede recrear los recuerdos del linaje de alguien, permitiéndole experimentar las vidas de sus antepasados legendarios.\nAlgunas leyendas son relatos poderosos para experimentarlos de primera mano, y acabas de revivir un inspirador momento de valentía de uno de tus antepasados. El recuerdo permanece vívido lo suficiente como para hacerte sentir una oleada de orgullo."
 POD_spirit_travel.3301.a: "¡Una larga estirpe de héroes, sin duda!"
  
 POD_spirit_travel.3302.t: "¿Linaje heroico?"
 POD_spirit_travel.3302.desc: "El Reino de las Leyendas puede recrear los recuerdos del linaje de alguien, permitiéndole experimentar las vidas de sus antepasados legendarios.\nEste es el reino perfecto para glorificar tu linaje... si hay algo con qué glorificarlo. No controlas qué recuerdos aparecerán y las historias de cobardía tienen tantas probabilidades de ocurrir como los relatos de valentía. Quizá lo mejor sea dejar el pasado en el pasado."
 POD_spirit_travel.3302.a: "¡Claramente, siempre fuimos héroes!"
 POD_spirit_travel.3302.b: "Busquemos el futuro en su lugar."
  
 POD_spirit_travel.3400.t: "Sabiduría para novatos"
 POD_spirit_travel.3400.desc: "Una gran cadena de montañas, que empequeñece incluso al imponente Himalaya, se alza sobre un mar de nubes. Algunos viajeros sabios creen que hay pagodas y ciudades ocultas en la cordillera, más allá del alcance de la mayoría de los espíritus.\nHabitadas por grandes espíritus Dragón, las Montañas son una fuente de sabiduría para quienes preguntan con amabilidad. Uno de esos Dragones se ha tomado a bien tu presencia y te ofrece algunos sabios consejos."
 POD_spirit_travel.3400.a: "Gracias, poderoso Dragón"
 
 POD_spirit_travel.3401.t: "Sabiduría inescrutable"
 POD_spirit_travel.3401.desc: "Una gran cadena de montañas, que empequeñece incluso al imponente Himalaya, se alza sobre un mar de nubes. Algunos viajeros sabios creen que hay pagodas y ciudades ocultas en la cordillera, más allá del alcance de la mayoría de los espíritus.\nHabitadas por grandes espíritus Dragón, las Montañas son una fuente de sabiduría para quienes preguntan con amabilidad. Uno de esos Dragones se ha tomado a bien tu presencia y te ofrece algunos sabios consejos. Lamentablemente, es apenas comprensible y acabas más confundido que otra cosa."
 POD_spirit_travel.3401.a: "¿Gracias?"
 
 POD_spirit_travel.3402.t: "Tesoros de Dragón"
 POD_spirit_travel.3402.desc: "Una gran cadena de montañas, que empequeñece incluso al imponente Himalaya, se alza sobre un mar de nubes. Algunos viajeros sabios creen que hay pagodas y ciudades ocultas en la cordillera, más allá del alcance de la mayoría de los espíritus.\nLas Montañas están habitadas por grandes espíritus Dragón y, cuando hay Dragones cerca, también lo hay tesoros. Podrías intentar pasar sigilosamente junto a uno de ellos para arrebatar algo del oro que atesoran aquí. Obviamente, esta línea de acción conlleva ciertos riesgos..."
 POD_spirit_travel.3402.a: "No te despiertes, no te despiertes..."
 POD_spirit_travel.3402.b: "¡Solo pasaba por aquí!"
 
 POD_spirit_travel.3500.t: "Furia primigenia"
 POD_spirit_travel.3500.desc: "Pangea es un reflejo de la Tierra primigenia, mostrando el mundo tal como era antes de la civilización, la historia humana e incluso el Impergium. Es una época en la que los continentes de la Tierra eran uno solo, una recreación templada con anacronismos y horrores atávicos olvidados hace mucho tiempo.\nGrandes y olvidadas Bestias bloquean tu camino. Es hora de mostrarles quién es realmente el depredador alfa."
 POD_spirit_travel.3500.a: "¡Ven a por mí!"
 POD_spirit_travel.3500.effect.success.desc: "Te abres paso luchando." 
 POD_spirit_travel.3500.success: "¡Has ganado!"
 POD_spirit_travel.3500.failure.effect.desc: "Escapas maltrecho."
 POD_spirit_travel.3500.failure: "¡Has perdido!"
    
 POD_spirit_travel.3501.t: "Reino Jurásico"
 POD_spirit_travel.3501.desc: "Pangea es un reflejo de la Tierra primigenia, mostrando el mundo tal como era antes de la civilización, la historia humana e incluso el Impergium. Es una época en la que los continentes de la Tierra eran uno solo, una recreación templada con anacronismos y horrores atávicos olvidados hace mucho tiempo.\nPoderosos Reyes Dinosaurio reclaman vastas extensiones de este territorio y no reciben bien a los forasteros. Tienes que luchar por cada centímetro que recorras en estas tierras salvajes."
 POD_spirit_travel.3501.a: "¡No pedí más dientes!"
  
 POD_spirit_travel.3502.t: "Horrores de la Creación"
 POD_spirit_travel.3502.desc: "Pangea es un reflejo de la Tierra primigenia, que muestra el mundo tal como era antes de la civilización, la historia humana e incluso el Impergium. Es una época en la que los continentes de la Tierra eran uno solo, una recreación ataviada con anacronismos y horrores atávicos olvidados hace mucho tiempo.\nUno de esos horrores olvidados te persigue ahora, molesto por tu imprevista incursión en su territorio. Es hora de luchar o huir, o lo más probable es que ambas cosas a la vez."
 POD_spirit_travel.3502.a: "¡¿Cuántos ojos tiene esa cosa?!"
   
 POD_spirit_travel.3600.t: "El cielo primigenio"
 POD_spirit_travel.3600.desc: "El País del Verano es un reflejo del amor puro e ilimitado de Gaia por sus hijos. En las leyendas antiguas, héroes consumados y aspirantes errantes estaban destinados a encontrarlo en momentos cruciales de sus vidas, puntos de inflexión elegidos por Gaia cuando podían recibir sanación, paz, sabiduría e incluso dones de poder espiritual o intuición.\nSi un espíritu herido puede sanar en algún lugar, es aquí. El simple hecho de sentarse y contemplar esta tierra de infinita quietud y belleza es suficiente para la mayoría."
 POD_spirit_travel.3600.a: "Paz y tranquilidad al fin."
   
 POD_spirit_travel.3601.t: "Enseñanzas primigenias"
 POD_spirit_travel.3601.desc: "El País del Verano es un reflejo del amor puro e ilimitado de Gaia por sus hijos. En las leyendas antiguas, héroes consumados y aspirantes errantes estaban destinados a encontrarlo en momentos cruciales de sus vidas, puntos de inflexión elegidos por Gaia cuando podían recibir sanación, paz, sabiduría e incluso dones de poder espiritual o intuición.\nUna de esas súbitas revelaciones te ocurre, acercándote a la Iluminación espiritual gracias a la poderosa magia del Señorío."
 POD_spirit_travel.3601.a: "Gracias, Madre."
    
 POD_spirit_travel.3602.t: "El fin del cielo"
 POD_spirit_travel.3602.desc: "El País del Verano es un reflejo del amor puro e ilimitado de Gaia por sus hijos. En las leyendas antiguas, héroes consumados y aspirantes errantes estaban destinados a encontrarlo en momentos cruciales de sus vidas, puntos de inflexión elegidos por Gaia cuando podían recibir sanación, paz, sabiduría e incluso dones de poder espiritual o intuición.\nLamentablemente, está claro que el País del Verano está viviendo sus últimos días. El Señorío se está desmoronando lentamente, reemplazando sus hermosos paisajes por el vacío hambriento. Pronto no quedará nada."
 POD_spirit_travel.3602.a: "Qué tragedia."
    
 POD_spirit_travel.3700.t: "Palacio del Rey Mono"
 POD_spirit_travel.3700.desc: "Las Tierras del Tigre son un Señorío Yang dentro de la [umbra|E] oriental que actúa como refugio para los espíritus de animales amenazados y espíritus que han perdido sus hogares tras la deforestación humana. Cada especie animal tiene un palacio y una corte espiritual en las Tierras del Tigre.\nEl Rey Mono es un ser astuto a quien le agradan las personas sagaces. Mientras estás ante él, evalúa rápidamente tu valía."
 POD_spirit_travel.3700.a: "Se ha tomado un aprecio por ti."
 POD_spirit_travel.3700.b: "Le has aburrido al Rey."
    
 POD_spirit_travel.3701.t: "Palacio del Rey Tigre"
 POD_spirit_travel.3701.desc: "Las Tierras del Tigre son un Señorío Yang dentro de la [umbra|E] oriental que actúa como refugio para los espíritus de animales amenazados y espíritus que han peridido sus hogares tras la deforestación humana. Cada especie animal tiene un palacio y una corte espiritual en las Tierras del Tigre.\nEl Rey Tigre es un ser fuerte a quien le agradan las personas valientes. Mientras estás ante él, evalúa rápidamente tu valía."

 POD_spirit_travel.3702.t: "Palacio del Rey Panda"
 POD_spirit_travel.3702.desc: "Las Tierras del Tigre son un Señorío Yang dentro de la [umbra|E] oriental que actúa como refugio para los espíritus de animales amenazados y espíritus que han perdido sus hogares tras la deforestación humana. Cada especie animal tiene un palacio y una corte espiritual en las Tierras del Tigre.\nEl Rey Panda es un ser paciente a quien le agradan las personas perezosas. Mientras estás ante él, evalúa rápidamente tu valía."
    
 POD_spirit_travel.3800.t: "Una audiencia con el Rey Dragón"
 POD_spirit_travel.3800.desc: "Uno de los Señoríos Umbrales más poderosos del Reino Medio, el dominio de Umi reclama todo el Pacífico como su ámbito.\nDesde su palacio en el fondo del Señorío, el Rey Dragón de Umi supervisa las innumerables responsabilidades de su dominio: enviar calmas y tempestades, guiar barcos a puerto o enviar tiburones para atacar a marineros náufragos. Un ser muy poderoso que puede conceder audiencias a visitantes prestigiosos, a menudo colmándolos de regalos y comentarios condescendientes al mismo tiempo."
 POD_spirit_travel.3800.a: "Eres digno de su presencia."
 POD_spirit_travel.3800.b: "Se te considera indigno."
        
 POD_spirit_travel.3801.t: "Una audiencia con la Princesa Dragón"
 POD_spirit_travel.3801.desc: "Uno de los Señoríos Umbrales más poderosos del Reino Medio, el dominio de Umi reclama todo el Pacífico como su ámbito.\nConsorte del Rey Dragón, la Princesa Dragón es una persona curiosa siempre interesada en las creencias de los demás. Sin embargo, su vasto conocimiento sobre el tema suele hacer que sus invitados se sientan inadecuados."
 POD_spirit_travel.3801.a: "Una conversación reveladora."
 POD_spirit_travel.3801.b: "La Princesa no ha quedado impresionada por tu piedad."
    
 POD_spirit_travel.3802.t: "Una audiencia con el Mayordomo"
 POD_spirit_travel.3802.desc: "Uno de los Señoríos Umbrales más poderosos del Reino Medio, el dominio de Umi reclama todo el Pacífico como su ámbito.\nGajyra, un espíritu de dragón brutal y colosal, es el mayordomo del Rey Dragón. Al respetar solo la fuerza, no es acogedor con los visitantes y a menudo los desafía a un duelo para afirmar su dominio."
 POD_spirit_travel.3802.a: "Una difícil batalla por delante."
 POD_spirit_travel.3802.b: "Se te considera demasiado débil para ser desafiado."
         
 POD_spirit_travel.3900.t: "Práctica de caza"
 POD_spirit_travel.3900.desc: "Un reino duro e implacable donde los lobos pueden convertirse en presas tan fácilmente como asumen su papel de depredadores; Lobera es una vasta extensión de naturaleza virgen.\nCazar, o ser cazado, es la verdadera expectativa de cualquiera que ponga un pie en este lugar. No hay término medio."
 POD_spirit_travel.3900.a: "Debo aprender el camino del Cazador."
 POD_spirit_travel.3900.b: "¡Yo soy el Cazador!"
      
 POD_spirit_travel.3901.t: "La emoción de la caza"
 POD_spirit_travel.3901.desc: "Un reino duro e implacable donde los lobos pueden convertirse en presas tan fácilmente como asumen su papel de depredadores; Lobera es una vasta extensión de naturaleza virgen.\nCazar puede ser liberador, especialmente para depredadores natos como tu clase. La simple emoción de la lucha y la muerte definitiva pueden ser un alivio frente al estrés de gobernar."
 POD_spirit_travel.3901.a: "Una buena oportunidad para aprender esta habilidad."
 POD_spirit_travel.3901.b: "Buscar, correr, matar."
      
 POD_spirit_travel.3902.t: "Llevando tus límites al máximo"
 POD_spirit_travel.3902.desc: "Un reino duro e implacable donde los lobos pueden convertirse en presas tan fácilmente como asumen su papel de depredadores; Lobera es una vasta extensión de naturaleza virgen.\nComo Cazador experimentado, la propia Lobera intenta llevarte al límite, enfrentándote a los enemigos más astutos y peligrosos, alternando entre convertirte en el cazador o en la presa."
 POD_spirit_travel.3902.a: "¿¡Eso es todo?!"
      
 POD_spirit_travel.4000.t: "Miedo y locura"
 POD_spirit_travel.4000.desc: "Una Calumn es un señorío que se desarrolla cuando se expresa una emoción negativa especialmente fuerte en un lugar del mundo físico, dejando una huella en la [umbra|E]. Es un imán para los Banes y Espíritus; los que viven cerca de una Calumn muestran signos de su respectiva emoción e incluso los objetos inanimados quedan contaminados por la proximidad.\nRealmente no es un lugar para quienes aún no están corrompidos. Deberías marcharte pronto."
 POD_spirit_travel.4000.a: "¿Dónde está la salida?"
  
 POD_spirit_travel.4001.t: "Miedo y horror"
 POD_spirit_travel.4001.desc: "Una Calumn es un señorío que se desarrolla cuando se expresa una emoción negativa especialmente fuerte en un lugar del mundo físico, dejando una huella en la [umbra|E]. Es un imán para los Banes y Espíritus; los que viven cerca de una Calumn muestran signos de su respectiva emoción e incluso los objetos inanimados quedan contaminados por la proximidad.\nRealmente no es un lugar para quienes aún no están corrompidos. Deberías marcharte pronto."
 POD_spirit_travel.4001.a: "¿Dónde está la salida?"
  
 POD_spirit_travel.4002.t: "Bañarse en miedo"
 POD_spirit_travel.4002.desc: "Una Calumn es un señorío que se desarrolla cuando se expresa una emoción negativa especialmente fuerte en un lugar del mundo físico, dejando una huella en la [umbra|E]. Es un imán para los Banes y Espíritus; los que viven cerca de una Calumn muestran signos de su respectiva emoción e incluso los objetos inanimados quedan contaminados por la proximidad.\nEl $glossary_wyrm$ es fuerte aquí, y este es un lugar perfecto para absorber los horrores que tu maestro traerá al mundo y rejuvenecerte con ellos."
 POD_spirit_travel.4002.a: "Dulce corrupción."
  
 POD_spirit_travel.4100.t: "Grecia perfeccionada"
 POD_spirit_travel.4100.desc: "La Tierra Natal de las Furias Negras se asemeja a los paisajes de la Grecia mítica: montañas rocosas se alzan sobre numerosas islas pequeñas y penínsulas que se extienden hacia un mar turquesa. Frondosos bosques de pinos y olivos, siempre cargados de frutos, cubren la isla junto a edificios construidos con estilos griegos.\nPara cualquier Furia Negra que se precie, esto es lo más parecido al Paraíso que se puede encontrar en la [umbra|E]."
 POD_spirit_travel.4100.a: "Perfección."
    
 POD_spirit_travel.4101.t: "Guerreros y Sabios"
 POD_spirit_travel.4101.desc: "La Tierra Natal de las Furias Negras se asemeja a los paisajes de la Grecia mítica: montañas rocosas se alzan sobre numerosas islas pequeñas y penínsulas que se extienden hacia un mar turquesa. Frondosos bosques de pinos y olivos, siempre cargados de frutos, cubren la isla junto a edificios construidos con estilos griegos.\nAquí se pueden encontrar muchas Furias Negras poderosas y sabias, siempre dispuestas a prestar su sabiduría a cualquier cachorro que sea debidamente respetuoso."
 POD_spirit_travel.4101.a: "Guerra..."
 POD_spirit_travel.4101.b: "...¿o sabiduría?"
  
 POD_spirit_travel.4102.t: "Invitado no deseado"
 POD_spirit_travel.4102.desc: "La Tierra Natal de las Furias Negras se asemeja a los paisajes de la Grecia mítica: montañas rocosas se alzan sobre numerosas islas pequeñas y penínsulas que se extienden hacia un mar turquesa. Frondosos bosques de pinos y olivos, siempre cargados de frutos, cubren la isla junto a edificios construidos con estilos griegos.\nLas Furias Negras son muy protectoras con su Tierra Natal y persiguen a cualquiera lo bastante necio como para invadirla. Deberías marcharte pronto."
 POD_spirit_travel.4102.a: "Rápida y silenciosamente..."
   
 POD_spirit_travel.4200.t: "Paraíso sombrío"
 POD_spirit_travel.4200.desc: "La Tierra Natal de los Roehuesos se asemeja al barrio bajo de una ciudad. Las tabernas abren las 24 horas del día y todas sirven cerveza barata por jarra. Hay locales de Joyhouse en cada manzana, pero el astuto Roehuesos sabe que los mejores se encuentran en los callejones traseros, llamando a las puertas adecuadas.\n¿Qué más podría pedir un Roehuesos, en realidad?"
 POD_spirit_travel.4200.a: "Huele a mierda. Y a hogar."
    
 POD_spirit_travel.4201.t: "Mentores de callejón"
 POD_spirit_travel.4201.desc: "La Tierra Natal de los Roehuesos se asemeja al barrio bajo de una ciudad. Las tabernas abren las 24 horas del día y todas sirven cerveza barata por jarra. Hay locales de Joyhouse en cada manzana, pero el astuto Roehuesos sabe que los mejores se encuentran en los callejones traseros, llamando a las puertas adecuadas.\nAquí se pueden encontrar muchos Roehuesos curtidos y respetados, listos para compartir sus trucos con el cachorro que sea debidamente respetuoso."
 POD_spirit_travel.4201.a: "Una cara de la moneda..."
 POD_spirit_travel.4201.b: "...y la otra"
 
 POD_spirit_travel.4202.desc: "La Tierra Natal de los Roehuesos se asemeja al barrio bajo de una ciudad. Las tabernas abren las 24 horas del día y todas sirven cerveza barata por jarra. Hay locales de Joyhouse en cada manzana, pero el astuto Roehuesos sabe que los mejores se encuentran en los callejones traseros, llamando a las puertas adecuadas.\nEste es el territorio de los Roehuesos y, como cualquiera sabe, las ratas de alcantarilla pueden ser ferozmente territoriales en su propia tierra. Como tal, eres más que un indeseable aquí y deberías moverte rápido antes de que te vean."

 POD_spirit_travel.4300.t: "Armonía celestial"
 POD_spirit_travel.4300.desc: "La Tierra Natal de los Hijos de Gaia es una vasta extensión de bosques frondosos, colinas onduladas y arroyos burbujeantes que serpentean por los valles. Los humanos libres del Delirio vagan como nómadas por la Tierra Natal, con metrópolis centrales que reflejan versiones más puras de las ciudades de la antigua Sumeria.\nRepresenta el objetivo último de los Hijos de Gaia y aquello por lo que luchan. Un recordatorio útil en tiempos de problemas."
 POD_spirit_travel.4300.a: "Algún día, dejará de ser solo un sueño."
 
 POD_spirit_travel.4301.t: "Mentores espirituales"
 POD_spirit_travel.4301.desc: "La Tierra Natal de los Hijos de Gaia es una vasta extensión de bosques frondosos, colinas onduladas y arroyos burbujeantes que serpentean por los valles. Los humanos libres del Delirio vagan como nómadas por la Tierra Natal, con metrópolis centrales que reflejan versiones más puras de las ciudades de la antigua Sumeria.\nAlgunos respetados Hijos de Gaia están aquí, listos para enseñar su sabiduría, ganada a pulso, a los cachorros respetuosos."
 POD_spirit_travel.4301.a: "Me quedaré y escucharé."
  
 POD_spirit_travel.4302.desc: "La Tierra Natal de los Hijos de Gaia es una vasta extensión de bosques frondosos, colinas onduladas y arroyos burbujeantes que serpentean por los valles. Los humanos libres del Delirio vagan como nómadas por la Tierra Natal, con metrópolis centrales que reflejan versiones más puras de las ciudades de la antigua Sumeria.\nSe sabe que los Hijos de Gaia son amables con los hombres lobo, pero siguen siendo hombres lobo. Este es su lugar más sagrado y lo defienden con ferocidad. No deberías quedarte aquí mucho tiempo o te atraparán."
 
 POD_spirit_travel.4400.t: "Paraíso alborotado"
 POD_spirit_travel.4400.desc: "La Tierra Natal de los Fianna es un paisaje verde de colinas, valles y cañadas que parece sacado de las tradiciones de las novelas de fantasía histórica. Las hadas juegan en el bosque y los espíritus ciervo recorren la tierra bajo la guía del Ciervo como la «Caza Salvaje», protegiendo la Tierra Natal de los intrusos.\nPara cualquier Fianna que se precie, así es como debería ser siempre la vida."
 POD_spirit_travel.4400.a: "Hogar, un hogar alborotado."
  
 POD_spirit_travel.4401.t: "Mentores jactanciosos"
 POD_spirit_travel.4401.desc: "La Tierra Natal de los Fianna es un paisaje verde de colinas, valles y cañadas que parece sacado de las tradiciones de las novelas de fantasía histórica. Las hadas juegan en el bosque y los espíritus ciervo recorren la tierra bajo la guía del Ciervo como la «Caza Salvaje», protegiendo la Tierra Natal de los intrusos.\nMuchos Fianna poderosos están aquí, listos para enseñar su sabiduría a los recién llegados... si están dispuestos a escuchar largos relatos de hazañas exageradas."
 POD_spirit_travel.4401.a: "¿Has hablado por encima de toda una manada de Fenris?"
 POD_spirit_travel.4401.b: "¿Tanto oro?"
 
 POD_spirit_travel.4402.desc: "La Tierra Natal de los Fianna es un paisaje verde de colinas, valles y cañadas que parece sacado de las tradiciones de las novelas de fantasía histórica. Las hadas juegan en el bosque y los espíritus ciervo recorren la tierra bajo la guía del Ciervo como la «Caza Salvaje», protegiendo la Tierra Natal de los intrusos.\nComo no eres Fianna, eres uno de esos intrusos. Escapar de la Caza Salvaje durante tu estancia aquí será difícil, y será mejor que te muevas tan rápido como puedas."
 POD_spirit_travel.4402.a: "Debería correr. Más rápido."
  
 POD_spirit_travel.4500.t: "Paraíso helado"
 POD_spirit_travel.4500.desc: "Los fiordes, vastas extensiones de tundra y taiga fría y oscura, todo envuelto en un invierno perpetuo, conforman la Tierra Natal de los Fenrir. Las manadas de megafauna de la era glacial, como lobos gigantes y mamuts, recorren la tierra y atacan a cualquier hombre lobo solitario. Los Fenrir se reúnen en aldeas-refugio donde beben, luchan, se entretienen y transmiten las sagas de sus hazañas.\nPara un miembro de la Camada de Fenris, esta es la mejor vida y la única que realmente merece la pena vivir."
 POD_spirit_travel.4500.a: "¡Banquetes y lucha!"
   
 POD_spirit_travel.4501.t: "Maestros de la guerra"
 POD_spirit_travel.4501.desc: "Los fiordes, vastas extensiones de tundra y taiga fría y oscura, todo envuelto en un invierno perpetuo, conforman la Tierra Natal de los Fenrir. Las manadas de megafauna de la era glacial, como lobos gigantes y mamuts, recorren la tierra y atacan a cualquier hombre lobo solitario. Los Fenrir se reúnen en aldeas-refugio donde beben, luchan, se entretienen y transmiten las sagas de sus hazañas.\nAquí abundan los guerreros experimentados, listos para compartir sus enseñanzas con aquellos lo bastante humildes como para escuchar."
 POD_spirit_travel.4501.a: "Dominar el arte de la guerra."
 POD_spirit_travel.4501.b: "Dominar el combate."
  
 POD_spirit_travel.4502.desc: "Los fiordes, vastas extensiones de tundra y taiga fría y oscura, todo envuelto en un invierno perpetuo, conforman la Tierra Natal de los Fenrir. Las manadas de megafauna de la era glacial, como lobos gigantes y mamuts, recorren la tierra y atacan a cualquier hombre lobo solitario. Los Fenrir se reúnen en aldeas-refugio donde beben, luchan, se entretienen y transmiten las sagas de sus hazañas.\nAllí, o eres de la Camada de Fenris o eres un enemigo al que hay que abatir. Lamentablemente, perteneces a la segunda categoría, así que no deberías demorarte mucho."
  
 POD_spirit_travel.4600.t: "Paraíso cristalino"
 POD_spirit_travel.4600.desc: "La Tierra Natal de los [GetPlayer.Custom( 'glasswalker_custom_name' )] es una metrópolis construida conforme a los diseños gaianos. Las altas torres tienen docenas de niveles de jardines al aire libre rebosantes de vegetación y de las aves y animales que se sienten atraídos naturalmente por estas plantas. Cada jardín atiende a una ecología diferente. Muchos humanos pasan felizmente sus vidas en apenas unas pocas torres.\nEsta vida perfectamente estructurada es todo un espectáculo para cualquier Protector de los Hombres cansado, recordando a su alma su propósito superior."
 POD_spirit_travel.4600.a: "Todo en orden."
    
 POD_spirit_travel.4601.t: "Líderes de hombres y lobos"
 POD_spirit_travel.4601.desc: "La Tierra Natal de los [GetPlayer.Custom( 'glasswalker_custom_name' )] es una metrópolis construida conforme a los diseños gaianos. Las altas torres tienen docenas de niveles de jardines al aire libre rebosantes de vegetación y de las aves y animales que se sienten atraídos naturalmente por estas plantas. Cada jardín atiende a una ecología diferente. Muchos humanos pasan felizmente sus vidas en apenas unas pocas torres.\nMuchos Antiguos respetados de la tribu se reúnen aquí, listos para impartir su sabiduría al oyente dócil."
 POD_spirit_travel.4601.a: "Crear orden a partir del caos."
  
 POD_spirit_travel.4602.desc: "La Tierra Natal de los [GetPlayer.Custom( 'glasswalker_custom_name' )] es una metrópolis construida conforme a los diseños gaianos. Las altas torres tienen docenas de niveles de jardines al aire libre rebosantes de vegetación y de las aves y animales que se sienten atraídos naturalmente por estas plantas. Cada jardín atiende a una ecología diferente. Muchos humanos pasan felizmente sus vidas en apenas unas pocas torres.\nLos Protectores vigilan contra cualquiera que intente perturbar su amado orden. Como tal, tienes que moverte rápido antes de que te encuentren."
    
 POD_spirit_travel.4700.t: "Paraíso salvaje"
 POD_spirit_travel.4700.desc: "La Tierra Natal de las Garras Rojas es una naturaleza vasta e virgen. Los depredadores cazan sin restricciones y compiten entre sí. Destacan las grandes manadas de lobos que han llegado a dominar la Tierra Natal.\nLas Garras Rojas se sienten como en casa aquí, finalmente libres para dejar que sus instintos primordiales se desaten."
 POD_spirit_travel.4700.a: "Como debe ser."
   
 POD_spirit_travel.4701.t: "Líderes de la manada"
 POD_spirit_travel.4701.desc: "La Tierra Natal de las Garras Rojas es una naturaleza vasta e virgen. Los depredadores cazan sin restricciones y compiten entre sí. Destacan las grandes manadas de lobos que han llegado a dominar la Tierra Natal.\nAquí se pueden encontrar poderosos líderes de manada, listos para enseñar su experiencia en la naturaleza a los cachorros dignos."
 POD_spirit_travel.4701.a: "Aprender de los mejores."
    
 POD_spirit_travel.4702.desc: "La Tierra Natal de las Garras Rojas es una naturaleza vasta e virgen. Los depredadores cazan sin restricciones y compiten entre sí. Destacan las grandes manadas de lobos que han llegado a dominar la Tierra Natal.\nSi no eres una Garra Roja en este lugar, eres una presa. Y te enfrentas a algunos de los mejores cazadores que jamás existieron..."
  
 POD_spirit_travel.4800.t: "Paraíso sombrío"
 POD_spirit_travel.4800.desc: "Los Señores de la Sombra viven en una zona dominada por una Gran Montaña, con el cielo perpetuamente cubierto por nubes oscuras y tormentas eléctricas. Los picos y los bosques de abajo yacen en una sombra eterna, donde los Señores de la Sombra se reúnen en castillos para conspirar unos contra otros para encontrar la forma de escalar la montaña.\nPor muy extraño que parezca para un forastero, esto es el paraíso para los astutos Señores de la Sombra."
 POD_spirit_travel.4800.a: "¡Quiero mi propio castillo aquí!"
   
 POD_spirit_travel.4801.t: "Maestros conspiradores"
 POD_spirit_travel.4801.desc: "Los Señores de la Sombra viven en una zona dominada por una Gran Montaña, con el cielo perpetuamente cubierto por nubes oscuras y tormentas eléctricas. Los picos y los bosques de abajo yacen en una sombra eterna, donde los Señores de la Sombra se reúnen en castillos para conspirar unos contra otros para encontrar la forma de escalar la montaña.\nAquí se encuentran los más astutos Señores de la Sombra y, aunque no entregarán sus secretos fácilmente, pueden ser persuadidos para hacerlo con la deferencia adecuada."
 POD_spirit_travel.4801.a: "Escucho, sutil uno."
      
 POD_spirit_travel.4802.desc: "Los Señores de la Sombra viven en una zona dominada por una Gran Montaña, con el cielo perpetuamente cubierto por nubes oscuras y tormentas eléctricas. Los picos y los bosques de abajo yacen en una sombra eterna, donde los Señores de la Sombra se reúnen en castillos para conspirar unos contra otros para encontrar la forma de escalar la montaña.\nLos forasteros como tú son vistos como distracciones entretenidas en este reino. Los Señores de la Sombra residentes ya están ideando algunas formas retorcidas de capturarte y «jugar» contigo..."
  
 POD_spirit_travel.4900.t: "Paraíso señorial"
 POD_spirit_travel.4900.desc: "La Tierra Natal de los Colmillos Plateados es una vasta extensión de territorio que se asemeja a las estepas rusas. En el centro del señorío se alza el Castillo de los Héroes, un monumento a las hazañas de los Colmillos Plateados al servicio de la Nación Garou.\nVerdaderamente, este es un reino donde todos pueden ver que los Colmillos Plateados están destinados a ser Reyes y Reinas."
 POD_spirit_travel.4900.a: "Nos mantenemos firmes."
    
 POD_spirit_travel.4901.t: "Reyes de los lobos"
 POD_spirit_travel.4901.desc: "La Tierra Natal de los Colmillos Plateados es una vasta extensión de territorio que se asemeja a las estepas rusas. En el centro del señorío se alza el Castillo de los Héroes, un monumento a las hazañas de los Colmillos Plateados al servicio de la Nación Garou.\nMuchos gobernantes sabios habitan aquí, legítimamente orgullosos de su posición y listos para hablar de ello con cualquier cachorro inquisitivo."
 POD_spirit_travel.4901.a: "Orgullosos gobernantes de los Garou."
 POD_spirit_travel.4901.b: "Robustos líderes guerreros de la Nación."
  
 POD_spirit_travel.4902.desc: "La Tierra Natal de los Colmillos Plateados es una vasta extensión de territorio que se asemeja a las estepas rusas. En el centro del señorío se alza el Castillo de los Héroes, un monumento a las hazañas de los Colmillos Plateados al servicio de la Nación Garou.\nEsta es una tierra solo apta para los Colmillos Plateados y el poderoso Halcón y sus hijos, aliados de la tribu, que advierten de cualquier intruso. La caza ha comenzado."
  
 POD_spirit_travel.5000.t: "Paraíso infernal"
 POD_spirit_travel.5000.desc: "La antigua Tierra Natal de los Aulladores Blancos ha sido retorcida de forma irreconocible por el $glossary_wyrm$. El aire es denso por el humo y vibra con el calor. Un sol de un verde enfermizo castiga la superficie, sin la protección de ningún tipo de capa de ozono. La noche no trae alivio, ya que los contaminantes se enfrían y se hunden hacia la superficie, haciendo que la luna parezca de un amarillo fluorescente a través de los vapores.\nSolo los Danzantes de la Espiral Negra pueden apreciar realmente semejante paisaje infernal, un recordatorio del objetivo final de su maestro de la Wyrm."
 POD_spirit_travel.5000.a: "¡Dulce corrupción!"
   
 POD_spirit_travel.5001.t: "Patrones infernales"
 POD_spirit_travel.5001.desc: "La antigua Tierra Natal de los Aulladores Blancos ha sido retorcida de forma irreconocible por el $glossary_wyrm$. El aire es denso por el humo y vibra con el calor. Un sol de un verde enfermizo castiga la superficie, sin la protección de ningún tipo de capa de ozono. La noche no trae alivio, ya que los contaminantes se enfrían y se hunden hacia la superficie, haciendo que la luna parezca de un amarillo fluorescente a través de los vapores.\nAquí se pueden encontrar poderosos Espíritus de la Perdición, listos para enseñar sus caminos corruptores a los ávidos Danzantes de la Espiral Negra."
 POD_spirit_travel.5001.a: "¡Corrompe el mundo!"
 POD_spirit_travel.5001.b: "¡Lucha contra el mundo!"

 POD_spirit_travel.5002.desc: "La antigua Tierra Natal de los Aulladores Blancos ha sido retorcida de forma irreconocible por el $glossary_wyrm$. El aire es denso por el humo y vibra con el calor. Un sol de un verde enfermizo castiga la superficie, sin la protección de ningún tipo de capa de ozono. La noche no trae alivio, ya que los contaminantes se enfrían y se hunden hacia la superficie, haciendo que la luna parezca de un amarillo fluorescente a través de los vapores.\nEste es uno de los Señoríos más contaminados del Wyrm y cualquier intruso será cazado rápidamente y (en el mejor de los casos) asesinado pronto. Tú no perteneces aquí."
   
 POD_spirit_travel.5100.t: "Paraíso hogareño"
 POD_spirit_travel.5100.desc: "La Tierra Natal de los Caminantes Silenciosos está dominada por un río gigantesco llamado el Río de la Vida. Envuelto en una noche eterna, está compuesto por grandes desiertos plateados y dominado por obeliscos y edificios monumentales similares inscritos con jeroglíficos, cuidadosamente alineados para resaltar las constelaciones que conmemoran a los héroes de antaño de los Caminantes Silenciosos.\nLa Maldición de Set separó a los Caminantes Silenciosos de su Tierra Natal durante mucho tiempo, y un profundo sentimiento de alivio recorre a cualquier miembro de esta tribu que tenga la suerte de encontrar el camino de vuelta."
 POD_spirit_travel.5100.a: "Por fin en casa."
     
 POD_spirit_travel.5101.t: "Lecciones del exiliado"
 POD_spirit_travel.5101.desc: "La Tierra Natal de los Caminantes Silenciosos está dominada por un río gigantesco llamado el Río de la Vida. Envuelto en una noche eterna, está compuesto por grandes desiertos plateados y dominado por obeliscos y edificios monumentales similares inscritos con jeroglíficos, cuidadosamente alineados para resaltar las constelaciones que conmemoran a los héroes de antaño de los Caminantes Silenciosos.\nHay mucho que aprender aquí; los relatos de antes del exilio, en particular, proporcionan al Caminante inquisitivo una visión única de la turbulenta historia de su tribu."
 POD_spirit_travel.5101.a: "Alguna vez formamos parte de una gran alianza."
 POD_spirit_travel.5101.b: "El búho actúa de formas misteriosas."
  
 POD_spirit_travel.5102.desc: "La Tierra Natal de los Caminantes Silenciosos está dominada por un río gigantesco llamado el Río de la Vida. Envuelto en una noche eterna, está compuesto por grandes desiertos plateados y dominado por obeliscos y edificios monumentales similares inscritos con jeroglíficos, cuidadosamente alineados para resaltar las constelaciones que conmemoran a los héroes de antaño de los Caminantes Silenciosos.\nAunque mayormente vacía, el Señorío aún espera a sus ocupantes Caminantes Silenciosos. Cualquier intruso tendrá la desagradable sorpresa de ser azotado por maldiciones y caer en trampas mientras permanezca aquí."
  
 POD_spirit_travel.5200.t: "Prisioneros orgullosos"
 POD_spirit_travel.5200.desc: "El Abismo, también conocido como el Infierno o el Foso, es la turbia dimensión de oscuridad creada por Dios como una prisión eterna para los Caídos.\nPara aquellos atrapados aquí, no hay escape del tormento constante, excepto mediante el arrepentimiento propio y la Expiación. En este vacío infinito, este podría ser el único camino para mantener la cordura bajo control un poco más de tiempo."
 POD_spirit_travel.5200.a: "Cometí errores..."
       
 POD_spirit_travel.5201.t: "Prisioneros celosos"
   
 POD_spirit_travel.5202.t: "Castigo divino"
 POD_spirit_travel.5202.desc: "El Abismo, también conocido como el Infierno o el Foso, es la turbia dimensión de oscuridad creada por Dios como una prisión eterna para los Caídos.\nLos demonios en su interior se dejan pudrir en sus propios remordimientos, desesperación y furia impotente, y las maquinaciones y manipulaciones de los gobernantes infernales no son más que juegos mentales dementes, ya que los Caídos no pueden dañarse ni destruirse entre sí. Quedar atrapado en una de esas maquinaciones es una forma segura de perderse a uno mismo rápidamente."
 POD_spirit_travel.5202.a: "¿Qué más puedo hacer?"
    
 POD_spirit_travel.5300.t: "Orden obstinada"
 POD_spirit_travel.5300.desc: "Los [UmbraGlossary('weaver_reaches')] son hebras de realidad calcificada, similares al mapa computarizado de un astrónomo. Los nodos que se cruzan en la telaraña fijan estrellas frías y planetas congelados en una simetría antinatural.\nPara prosperar y comprender este lugar, debes tener la mentalidad adecuada: alguien que valore el orden y la precisión por encima de todo."
 POD_spirit_travel.5300.a: "¡Suena como mi tipo de lugar!"
 POD_spirit_travel.5300.b: "No me gusta este lugar..."
  
 POD_spirit_travel.5301.t: "Soledad astral"
 POD_spirit_travel.5301.desc: "Los [UmbraGlossary('weaver_reaches')] son hebras de realidad calcificada, similares al mapa computarizado de un astrónomo. Los nodos que se cruzan en la telaraña fijan estrellas frías y planetas congelados en una simetría antinatural.\nNo existen signos de vida aquí, lo que lo convierte en el lugar perfecto para personajes tímidos... pero no es exactamente igual para quienes disfrutan de tener algo de compañía."
   
 POD_spirit_travel.5302.t: "Diligencia astral"
 POD_spirit_travel.5302.desc: "Los [UmbraGlossary('weaver_reaches')] son hebras de realidad calcificada, similares al mapa computarizado de un astrónomo. Los nodos que se cruzan en la telaraña fijan estrellas frías y planetas congelados en una simetría antinatural.\nEspíritus colosales de la $glossary_weaver$, como las «arañas estelares», patrullan y mantienen la telaraña y aseguran que todo permanezca en su lugar ordenado. Aquí no hay lugar para la pereza y todo sigue su curso previsto con la mayor diligencia posible."
     
 POD_spirit_travel.5400.t: "Naturaleza voluble"
 POD_spirit_travel.5400.desc: "Los [UmbraGlossary('wyld_reaches')] son un lugar de caos. Aquí, la Naturaleza reina sin trabas y el Señorío entero está en constante cambio. Solo los individuos con mentes particularmente adaptables pueden prosperar aquí."
     
 POD_spirit_travel.5401.t: "Amigos naturales"
 POD_spirit_travel.5401.desc: "Los Reaches [UmbraGlossary('wyld_reaches')] están poblados por toda clase de criaturas espirituales. Aunque algunas son hostiles, puedes encontrar aquí algunos compañeros de conversación intrigantes y lo suficientemente amigables si así lo deseas."
     
 POD_spirit_travel.5402.t: "Frenesí natural"
 POD_spirit_travel.5402.desc: "Los Reaches [UmbraGlossary('wyld_reaches')] son un lugar de caos.\nLa Naturaleza no espera a nadie aquí. Como el paisaje cambia y se transforma a tu alrededor todo el tiempo, tienes que adaptar tu mentalidad a esta verdad si quieres sobrevivir en este Señorío. Puede que esto no sea posible para todos."
     
 POD_spirit_travel.5500.t: "Reino del dolor"
 POD_spirit_travel.5500.desc: "Las estrellas dentro de los [UmbraGlossary('wyrm_reaches')] se han agotado hasta convertirse en cáscaras sin vida o han colapsado en agujeros negros que suelen conducir a [UmbraGlossary('malfeas')]. Nebulosas de contaminación y Fuego Infernal se arremolinan a su alrededor, ocultando sus constelaciones a cualquiera que las mire, convirtiéndolas en manchas oscuras dentro del cielo Umbral.\nUn lugar de dolor y locura; solo las almas más curtidas pueden prosperar aquí."
     
 POD_spirit_travel.5501.t: "Reino del odio"
 POD_spirit_travel.5501.desc: "Las estrellas dentro de los [UmbraGlossary('wyrm_reaches')] se han agotado hasta convertirse en cáscaras sin vida o han colapsado en agujeros negros que suelen conducir a [UmbraGlossary('malfeas')]. Nebulosas de contaminación y Fuego Infernal se arremolinan a su alrededor, ocultando sus constelaciones a cualquiera que las mire, convirtiéndolas en manchas oscuras dentro del cielo Umbral.\nLas peores emociones son libres y prosperan aquí. El odio alimentará al odio."
     
 POD_spirit_travel.5502.t: "Reino del engaño"
 POD_spirit_travel.5502.desc: "Las estrellas dentro de los [UmbraGlossary('wyrm_reaches')] se han agotado hasta convertirse en cáscaras sin vida o han colapsado en agujeros negros que suelen conducir a [UmbraGlossary('malfeas')]. Nebulosas de contaminación y Fuego Infernal se arremolinan a su alrededor, ocultando sus constelaciones a cualquiera que las mire, convirtiéndolas en manchas oscuras dentro del cielo Umbral.\nPensamientos de traición cruzan constantemente tu mente, recordándote a las muchas personas que intentaron traicionarte... o a las que tú mismo traicionaste."
             
 POD_spirit_travel.5600.t: "Caminar por la Espiral"
 POD_spirit_travel.5600.desc: "El [UmbraGlossary('black_spiral_labyrinth')], también llamado el [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')] en el Reino Medio, es un laberinto en espiral dentro del señorío de [UmbraGlossary('malfeas')] que contiene horrores inimaginables del $glossary_wyrm$.\nEsta es una de las fortalezas del Wyrm donde nacieron sus siervos más fieles, los Danzantes de la Espiral Negra. Para alguien que adora a esta entidad, esto es muy parecido a un lugar sagrado, pero de una forma retorcida."
 POD_spirit_travel.5600.a: "Una peregrinación de locura."
      
 POD_spirit_travel.5601.t: "Danzando en la Espiral"
 POD_spirit_travel.5601.desc: "El [UmbraGlossary('black_spiral_labyrinth')], también llamado el [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')] en el Reino Medio, es un laberinto en espiral dentro del señorío de [UmbraGlossary('malfeas')] que contiene horrores inimaginables del $glossary_wyrm$.\nEl Laberinto está lleno de dones para los celosos siervos del Wyrm. Pero bailar la espiral es una perspectiva enloquecedora, una que puede quebrar incluso las mentes ya rotas."
 POD_spirit_travel.5601.a: "¡Bailemos!"
 POD_spirit_travel.5601.b: "No me apetece."
     
 POD_spirit_travel.5602.desc: "El [UmbraGlossary('black_spiral_labyrinth')], también llamado el [UmbraGlossaryLocalized('black_spiral_labyrinth','Ebon Maze')] en el Reino Medio, es un laberinto en espiral dentro del señorío de [UmbraGlossary('malfeas')] que contiene horrores inimaginables del $glossary_wyrm$.\nEl Laberinto ha quebrado las mentes de tribus enteras y de un número incalculable de los llamados héroes, ahora celosos siervos del Wyrm. Mientras permanezcas aquí, estarás sometido a la $glossary_wyrm_corruption$ en su punto más poderoso. Deberías huir, rápido."
 POD_spirit_travel.5602.a: "Perdiendo la cordura con el baile..."
     
 POD_spirit_travel.5700.t: "Gloria eterna"
 POD_spirit_travel.5700.desc: "Aquí se pueden ver los ecos de las tierras vivas formados por las pasiones y deseos depositados en las grandes ciudades, tumbas y templos del antiguo Egipto. Este es el lugar donde los Inmortales, o Momias, construyeron su extenso Reino para protegerse al atravesar la traicionera Duat, la tierra de los Muertos.\nCon el antiguo Egipto desaparecido hace mucho de la mente de los mortales, este es quizá el último vestigio de la gloria que alguna vez fue. Cualquier Momia que venga aquí puede sentir el orgullo de su civilización, pero también la tristeza de su pérdida."
 POD_spirit_travel.5700.a: "Debo mantenerme fiel a Khem."
 POD_spirit_travel.5700.b: "Orgullo doloroso."
 POD_spirit_travel.5700.c: "El antiguo Egipto está muerto y enterrado."
  
 POD_spirit_travel.5701.t: "Secretos de Khem"
 POD_spirit_travel.5701.desc: "Aquí se pueden ver los ecos de las tierras vivas formados por las pasiones y deseos depositados en las grandes ciudades, tumbas y templos del antiguo Egipto. Este es el lugar donde los Inmortales, o Momias, construyeron su extenso Reino para protegerse al atravesar la traicionera Duat, la tierra de los Muertos.\nMuchos de los secretos más profundos del antiguo Egipto se encuentran aquí, preservados por las Momias que pasan durante su propio proceso de resurrección. Para quien se tome el tiempo de leer los jeroglíficos, hay mucho que aprender."
 POD_spirit_travel.5701.a: "Secretos de los muertos."
 POD_spirit_travel.5701.b: "Secretos del alma."
 POD_spirit_travel.5701.c: "Secretos del cielo."
 POD_spirit_travel.5701.d: "Solo estoy de paso."
    
 POD_spirit_travel.5702.t: "La maldición de la Momia"
 POD_spirit_travel.5702.desc: "Aquí se pueden ver los ecos de las tierras vivas formados por las pasiones y deseos depositados en las grandes ciudades, tumbas y templos del antiguo Egipto. Este es el lugar donde los Inmortales, o Momias, construyeron su extenso Reino para protegerse al atravesar la traicionera Duat, la tierra de los Muertos.\nEste lugar está destinado solo a los Inmortales de Egipto y tú no eres uno de ellos. Como tal, ingeniosas trampas surgen por todas partes mientras intentas saquear los secretos de antaño. Cada vez que intentas acercarte a una, retrocede aún más."
 POD_spirit_travel.5702.a: "Esto es una causa perdida..."
   
 POD_spirit_travel.5800.t: "Secretos de los Primigenios"
 POD_spirit_travel.5800.desc: "La Primera Ciudad es el mítico lugar de nacimiento de los vampiros Cainitas. Inundada hace mucho por la ira de Dios, todavía se conserva como un eco en el [UmbraGlossaryLocalized('shadowlands','Underworld')].\nComo refugio para algunas de las entidades más poderosas que jamás caminaron sobre la Tierra, la Primera Ciudad es un repositorio de recuerdos y conocimientos sin igual. Sin embargo, algunas verdades es mejor dejarlas enterradas, y hay cosas aquí que podrían destrozar la fe del individuo más celoso."
 POD_spirit_travel.5800.a: "El camino de los gigantes..."
 POD_spirit_travel.5800.b: "Esto es demasiado peligroso."

 POD_spirit_travel.5801.t: "Guerra por Enoch"
 POD_spirit_travel.5801.desc: "La Primera Ciudad es el mítico lugar de nacimiento de los vampiros Cainitas. Inundada hace mucho por la ira de Dios, todavía se conserva como un eco en el [UmbraGlossaryLocalized('shadowlands','Underworld')].\nEnoch es un campo de batalla entre las fuerzas del espectral Imperio de Estigia y la secreta clan vampírico Tal'mahe'Ra. Cada noche, se libran batallas por los distritos disputados de la que antaño fue una gran ciudad."
 POD_spirit_travel.5801.a: "¡Un esfuerzo que vale la pena!"
 POD_spirit_travel.5801.effect.success.desc: "Luchas con valentía y aprendes sobre asuntos marciales." 
 POD_spirit_travel.5801.success: "¡Una buena batalla!"
 POD_spirit_travel.5801.failure.effect.desc: "Escapas maltrecho."
 POD_spirit_travel.5801.failure: "No ha valido la pena..."
   
 POD_spirit_travel.5802.t: "El Palacio del Temor, Ghemal"
 POD_spirit_travel.5802.desc: "La Primera Ciudad es el mítico lugar de nacimiento de los vampiros Cainitas. Inundada hace mucho por la ira de Dios, todavía se conserva como un eco en el [UmbraGlossaryLocalized('shadowlands','Underworld')].\nLa Gran Casa de Caín, conocida como el Palacio del Temor Ghemal, se alza en el centro mismo de la ciudad. Obviamente es solo un eco del lugar real, pero sigue siendo una vista muy impresionante. Y una espeluznante también, ya que casi puedes sentir la presencia del Padre Oscuro en este lugar hace tanto tiempo..."
 POD_spirit_travel.5802.a: "No está allí, ¿verdad?"

 POD_spirit_travel.5403.t: "Caos amistoso"
 POD_spirit_travel.5403.desc: "Los [UmbraGlossary('wyld_reaches')] están poblados por toda clase de espíritus. En constante movimiento, crean, evolucionan y mueren a una velocidad vertiginosa. Algunas de esas creaciones podrían ser útiles si lograras obligar a estos espíritus a que simplemente se calmaran un poco. Esto podría requerir algo de esfuerzo para convencerlos, pero el resultado probablemente valdrá la pena, aunque no puedes estar seguro."
 POD_spirit_travel.5403.a: "¡Una Klaive siempre es útil!"
 POD_spirit_travel.5403.b: "Qué bolsa tan extraña."
 POD_spirit_travel.5403.c: "¿Qué hace esta aguja?"
 POD_spirit_travel.5403.d: "¡Qué artilugio tan extraño!"
 POD_spirit_travel.5403.e: "No necesito ninguna de esas baratijas."
 
 POD_spirit_travel.3903.t: "Recompensas de la Caza"
 POD_spirit_travel.3903.desc: "Un reino duro e implacable donde los lobos pueden convertirse en presas tan fácilmente como asumen su papel de depredadores; Lobera, la es una vasta extensión de naturaleza virgen.\nComo cazador consumado que eres, has estado participando en una de las muchas cacerías organizadas por todo el señorío. Cada una de ellas será un esfuerzo agotador, pero también ofrecen algunas baratijas espirituales como recompensa."
 POD_spirit_travel.3903.a: "Un pendiente interesante."
 POD_spirit_travel.3903.b: "¿Una manta? ¿En serio?"
 POD_spirit_travel.3903.c: "Una máscara aterradora..."
 POD_spirit_travel.3903.d: "¿Un cuenco como fetiche?"
 
 POD_spirit_travel.4003.t: "Abre tu camino"
 POD_spirit_travel.4003.desc: "Una Calumn es un reino que se desarrolla cuando una emoción negativa particularmente fuerte se expresa en un lugar del mundo físico, dejando una huella en la [umbra|E]. Es un imán para los Banes y Espíritus que viven cerca de una Calumn, mostrando signos de su respectiva emoción; incluso los objetos inanimados quedan contaminados por la proximidad.\nMuchos artefactos espirituales se perdieron en este lugar y podrían ser recuperados por un aventurero emprendedor. Sin embargo, los Banes guardianes no los dejarán ir fácilmente."
 POD_spirit_travel.4003.a: "¿Una muñeca en este lugar?"
 POD_spirit_travel.4003.b: "Una calavera. Adecuado."
 POD_spirit_travel.4003.c: "Esta piedra emana energía."
 POD_spirit_travel.4003.d: "¿Unas grebas? Nada mal." 
 POD_spirit_travel.4003.e: "Un hacha de aspecto poderoso." 
 POD_spirit_travel.4003.f: "Este hueso es mágico, no hay duda." 
 
 POD_spirit_travel.2603.t: "Negociar con los Djinn"
 POD_spirit_travel.2603.desc: "La [UmbraGlossary('city_of_brass')] es el hogar de los Djinn y sus ciudadelas más poderosas. Estos espíritus son famosamente hostiles con los visitantes tras unos desagradables tratos con magos en el pasado. Para colmo, son conocidos por ser mentirosos compulsivos.\nLos astutos espíritus han estado acumulando artefactos durante mucho tiempo y disfrutan exhibiéndolos ante sus invitados. También les gusta regatear y podrían dejarse convencer para desprenderse de algunos a cambio de un precio."
 POD_spirit_travel.2603.a: "Un libro interesante."
 POD_spirit_travel.2603.b: "¿Una capa? Qué majestuoso."
 POD_spirit_travel.2603.c: "Esta lanza parece estar bien equilibrada."
 POD_spirit_travel.2603.d: "Veamos esta pequeña pieza." 
  
 POD_spirit_travel.2503.t: "Inspiración con las Musas"
 POD_spirit_travel.2503.desc: "Las Cortes de las Musas han sufrido mucho debido a la casi completa extinción de las creencias helénicas clásicas. Aun así, mientras su señorío se reduce cada día, las nueve hijas de Zeus siguen practicando su arte, esperando que su pasión retrase el Olvido un poco más.\nLas Musas son amables y a menudo se sienten solas. Como tales, te piden que pases un poco de tiempo con ellas mientras te narran grandes relatos de la Grecia Clásica, ofreciéndote una recompensa si lo haces. Sin embargo, sus historias son quizás demasiado encantadoras; te encuentras perdiéndote a ti mismo de vez en cuando mientras escuchas."
 POD_spirit_travel.2503.a: "¿Un amuleto? No era necesario."
 POD_spirit_travel.2503.b: "¿Este martillo perteneció a grandes héroes?"
 POD_spirit_travel.2503.c: "¿Esto puede controlar el clima?"
 POD_spirit_travel.2503.d: "Qué máscara tan interesante. Gracias, mis señoras." 
   
 POD_spirit_travel.4403.effect.success.desc: "¡Has encontrado el artefacto!"
 POD_spirit_travel.4403.success: "Un nuevo tesoro"
 POD_spirit_travel.4403.failure.effect.desc: "La búsqueda ha sido un fracaso."
 POD_spirit_travel.4403.failure: "Un fracaso"
 
 POD_spirit_travel.4403.t: "Los tres de Tara"
 POD_spirit_travel.4403.desc: "La Tierra Natal de los Fianna es un paisaje verde de colinas, valles y cañadas que parece sacado de las tradiciones de las novelas de fantasía histórica. Las hadas juegan en los bosques y los espíritus ciervo recorren la tierra bajo la guía del Ciervo como la «Caza Salvaje», protegiendo la Tierra Natal de los intrusos.\nHace mucho tiempo, los Fianna perdieron tres poderosas reliquias durante la difícil batalla de la Colina de Tara. Desde entonces, ha sido un rito de iniciación común para los líderes dignos de los Fianna emprender una búsqueda para recuperar estos artefactos. Sin embargo, tal empresa será costosa y sin garantías de éxito."
 POD_spirit_travel.4403.a: "¡Debemos encontrar el cuerno del ciervo blanco!"
 POD_spirit_travel.4403.b: "¡El torc de oro puede ser recuperado!"
 POD_spirit_travel.4403.c: "La lengua de la Arpía me llama."
  
 POD_spirit_travel.3503.t: "El tesoro de un dragón"
 POD_spirit_travel.3503.desc: "Pangea es un reflejo de la Tierra primigenia, mostrando el mundo tal como era antes de la civilización, la historia humana e incluso el Impergium. Es una época en la que los continentes de la Tierra eran uno solo, una recreación templada con anacronismos y horrores atávicos olvidados hace mucho tiempo.\nCriaturas feroces similares a dragones habitan esta tierra y, como cuentan las historias, han acumulado un gran tesoro primordial que guardan celosamente para sí mismas. Podrías intentar realizar un audaz robo, pero estas criaturas son obviamente muy peligrosas si se les provoca."
 POD_spirit_travel.3503.a: "¡Brillantes!"
 POD_spirit_travel.3503.b: "Eso suena como una idea terrible."
  
 POD_spirit_travel.2303.t: "Día de suerte"
 POD_spirit_travel.2303.desc: "Las epifanías encarnan conceptos de abstracción completa y a menudo se materializan como nubes coloridas en el cielo umbrío del [UmbraGlossary('vulgate')].\nUn lugar extraño, muchas cosas terminan perdidas aquí. Pero lo que se pierde puede volver a encontrarse y hoy la dama fortuna está de tu lado. Un objeto raro que irradia magia cae literalmente desde una de las nubes a tus pies."
 POD_spirit_travel.2303.a: "¡Una corona! Parece ser de plumas."
 POD_spirit_travel.2303.b: "¡Una corona! Creo que es de hierro."
 POD_spirit_travel.2303.c: "Eso es una roca malditamente grande."

 POD_spirit_travel.4103.t: "El Colmillo de León"
 POD_spirit_travel.4103.desc: "La Tierra Natal de las Furias Negras se asemeja a los paisajes de la Grecia mítica: montañas rocosas se alzan sobre numerosas islas pequeñas y penínsulas que se extienden hacia un mar turquesa. Frondosos bosques de pinos y olivos, siempre cargados de frutos, se extienden por la isla, junto con edificios construidos con estilos griegos.\nUn poderoso artefacto, que se dice que proviene de una tierra muy lejana a Grecia, fue llevado una vez a este señorío por una extraña hija de Pegaso. Tanto ella como su arma desaparecieron un día y, desde entonces, tanto jóvenes como ancianas Furias Negras la han estado buscando. Podrías probar suerte intentando encontrar esta mítica reliquia."
 POD_spirit_travel.4103.a: "¡Pegaso! ¡Guíame!"

 POD_spirit_travel.4603.t: "El Llamacantos"
 POD_spirit_travel.4603.desc: "La Tierra Natal de los [GetPlayer.Custom( 'glasswalker_custom_name' )] es una metrópolis construida conforme a diseños gaianos. Altas torres tienen docenas de niveles de jardines al aire libre rebosantes de vegetación y de aves y animales que se sienten atraídos naturalmente por estas plantas. Cada jardín atiende a una ecología diferente. Muchos humanos pasan felizmente sus vidas en apenas unas pocas torres.\nUn preciado artefacto del Protector, el Llamacantos, reside allí en la estancia de uno de los guardianes del señorío. Se sabe que han confiado este poderoso artefacto a Protectores que han demostrado su habilidad liderando a la humanidad. Como tal, podrías intentar convencerles de que eres uno de esos dignos."
 POD_spirit_travel.4603.a: "¡La Humanidad me ama!"

 POD_spirit_travel.4303.t: "El Arpa del Encantamiento"
 POD_spirit_travel.4303.desc: "La Tierra Natal de los Hijos de Gaia es una vasta extensión de bosques frondosos, colinas onduladas y arroyos burbujeantes que serpentean por los valles. Los humanos libres del Delirio vagan como nómadas por la Tierra Natal, con metrópolis centrales que reflejan versiones más puras de las ciudades de la antigua Sumeria.\nUno de los artefactos más preciados de la tribu, el Arpa del Encantamiento, reside aquí. Solo puede ser retirada del señorío en tiempos de necesidad por un campeón digno. ¿Quizás podrías intentar convencer a tus iguales de que este es, en efecto, el momento adecuado y que eres digno de ello?"
 POD_spirit_travel.4303.a: "Mi primer punto es..."

 POD_spirit_travel.4903.t: "La Hoja de Hielo"
 POD_spirit_travel.4903.desc: "La Tierra Natal de los Colmillos Plateados es una vasta extensión de territorio que se asemeja a las estepas rusas. En el centro del señorío se encuentra el Castillo de los Héroes, un monumento a las hazañas de los Colmillos Plateados al servicio de la Nación Garou.\nTe presentan ante Hoja de Hielo, la mítica reliquia de la tribu, y te cuentan su historia de antiguos dueños gloriosos y dignos. También se te dice que cualquier Colmillo Plateado puede desafiar a su actual dueño a un «juego de guerra en vivo» para obtener su posesión. Tu anfitrión sonríe con malicia y te pregunta si estás interesado."
 POD_spirit_travel.4903.a: "¡Soy el mejor general de sillón!"
 
 POD_spirit_travel.4203.t: "El Anillo de los Elementos"
 POD_spirit_travel.4203.desc: "La Tierra Natal de los Roehuesos se asemeja a la zona de un suburbio de una ciudad. Las tabernas están abiertas las 24 horas del día y todas sirven cerveza barata por jarra. Hay locales de Joyhouse en cada manzana, pero el astuto Roehueso sabe que los mejores se encuentran en los callejones traseros, llamando a las puertas adecuadas.\nEn uno de esos callejones, te topas con lo que parece ser un juego de azar de altas apuestas. Los jugadores te incitan a unirte a ellos, tentándote con la promesa del premio definitivo de este evento: lo que parece ser un poderoso anillo rebosante de magia."
 POD_spirit_travel.4203.a: "Juguemos entonces."
  
 POD_spirit_travel.4803.t: "La Gran Klaive"
 POD_spirit_travel.4803.desc: "Los Señores de la Sombra viven en una zona dominada por una Gran Montaña, con el cielo perpetuamente cubierto por nubes oscuras y tormentas eléctricas. Los picos y los bosques de abajo yacen en una sombra eterna, donde los Señores de la Sombra se reúnen en castillos para conspirar unos contra otros para encontrar la forma de escalar la montaña.\nRecientemente has sabido que uno de los habitantes del castillo posee una de las raras y poderosas Grandes Klaives. ¿Tal vez podrías organizar una expedición para liberarlo de esta carga?"
 POD_spirit_travel.4803.a: "Rápida y silenciosamente."
   
 POD_spirit_travel.4503.t: "Los Martillos del Jarl"
 POD_spirit_travel.4503.desc: "Fiordos, vastas extensiones de tundra y taiga fría y oscura, todo envuelto en un invierno perpetuo, conforman la Tierra Natal de Fenrir. Manadas de megafauna de la era glacial, como lobos gigantes y mamuts, recorren la tierra y atacan a cualquier hombre lobo solitario. Los Fenrir se congregan en aldeas-logia donde beben, luchan, festejan y transmiten las sagas de sus hazañas.\nLos siete poderosos Martillos del Jarl fueron las armas preciadas de los héroes que dieron su vida para detener al maldito Wotan. Algunos fueron recuperados tras la batalla mientras que otros se perdieron. Pero todos ellos serían un gran premio para el ambicioso Fenrir dispuesto a partir en su búsqueda."
 POD_spirit_travel.4503.a: "¿Rompeforja?"
 POD_spirit_travel.4503.b: "¿Diente de Molienda?"
 POD_spirit_travel.4503.c: "¿Cazador de Lanzas?"
 POD_spirit_travel.4503.d: "¿Comedor de Trolls?"
 POD_spirit_travel.4503.e: "¿Brazo Brillante?"
 POD_spirit_travel.4503.f: "¿Garra de Bruja?"
 POD_spirit_travel.4503.g: "¿Águila del Dolor?"
 
 POD_spirit_travel.4703.t: "Las Piedras Rúnicas"
 POD_spirit_travel.4703.desc: "La Tierra Natal de las Garras Rojas es una vasta naturaleza virgen. Los depredadores cazan sin restricciones y compiten entre sí. Destacan grandes manadas de lobos que han llegado a dominar la Tierra Natal.\nSe dice que, en este Señorío, uno puede encontrar las Piedras Rúnicas dejadas por los antiguos lobos que habitaron aquí hace mucho tiempo. Pero solo los más valientes y sabios de las Garras Rojas pueden aspirar a encontrar una de esas reliquias legendarias."
 POD_spirit_travel.4703.a: "Buscaré la Piedra Rúnica de Gab."
 POD_spirit_travel.4703.b: "La Piedra Rúnica de la Guerra me llama."
 POD_spirit_travel.4703.c: "Necesito la Piedra Rúnica del Control."
 POD_spirit_travel.4703.d: "La Piedra Rúnica de la Astucia está cerca."
 POD_spirit_travel.4703.e: "La Piedra Rúnica de la Sabiduría puede enseñarme mucho."
 
 POD_spirit_travel.5900.t: "Muertos en Guerra"
 POD_spirit_travel.5900.desc: "Antes de la fundación del [UmbraGlossary('dark_kingdom_of_sand')], los muertos egipcios habitaban en Neter-Khertet, el «lugar subterráneo divino». El primer ser en caminar por Neter-Khertet fue Anubis. Fue aquí donde Osiris comenzó a gobernar por primera vez sobre los muertos y reunió a sus subordinados más leales a su alrededor. El [UmbraGlossary('dark_kingdom_of_iron')] inició una invasión para reclamar Neter-Khertet como suyo durante el apogeo del Imperio Romano. La guerra ha continuado desde entonces.\nEste conflicto va mal para los muertos egipcios, ya que el [UmbraGlossary('dark_kingdom_of_iron')] los supera ampliamente en número y continúa creciendo noche tras noche. Aun así, los hijos e hijas de Egipto siguen luchando, utilizando tácticas que se han considerado obsoletas en el mundo mortal desde hace mucho tiempo, como la guerra con carros."
 POD_spirit_travel.5900.a: "Los carros son un espectáculo impresionante de contemplar."
 POD_spirit_travel.5900.b: "Están obsoletos por una razón."
 
 POD_spirit_travel.5901.t: "Señor de la Tierra Sagrada"
 POD_spirit_travel.5901.desc: "Antes de la fundación del [UmbraGlossary('dark_kingdom_of_sand')], los muertos egipcios habitaban en Neter-Khertet, el «lugar subterráneo divino». El primer ser en caminar por Neter-khertet fue Anubis. Fue aquí donde Osiris comenzó a gobernar por primera vez sobre los muertos y reunió a sus subordinados más leales a su alrededor. El [UmbraGlossary('dark_kingdom_of_iron')] inició una invasión para reclamar Neter-Khertet como suyo durante el apogeo del Imperio Romano. La guerra ha continuado desde entonces.\nAnubis gobierna aquí y el dios chacal ha demostrado ser un diplomático astuto. Sus tratos con el recluso Caronte de Estigia han permitido que Neter-Khertet reciba algunos refuerzos muy necesarios sin perder su independencia. Gobernar un señorío sumido en una guerra aparentemente eterna es, ciertamente, un talento que puedes apreciar."
 POD_spirit_travel.5901.a: "Mucho que aprender del hijo de Osiris."
 POD_spirit_travel.5901.b: "La guerra primero, las charlas después."
 
 POD_spirit_travel.5902.t: "Atuendo del Faraón"
 POD_spirit_travel.5902.desc: "Antes de la fundación del [UmbraGlossary('dark_kingdom_of_sand')], los muertos egipcios habitaban en Neter-Khertet, el «lugar subterráneo divino». El primer ser en caminar por Neter-khertet fue Anubis. Fue aquí donde Osiris comenzó a gobernar por primera vez sobre los muertos y reunió a sus subordinados más leales a su alrededor. El [UmbraGlossary('dark_kingdom_of_iron')] inició una invasión para reclamar Neter-Khertet como suyo durante el apogeo del Imperio Romano. La guerra ha continuado desde entonces.\nA pesar de la mortífera guerra que se libra, las almas de los muertos egipcios aún intentan adaptarse lo mejor posible, habiendo forjado este señorío en una versión idealista del antiguo Egipto. Te encuentras con muchos artesanos hábiles, algunos de los cuales te ofrecen su pericia si estás dispuesto a desprenderte de algunas monedas. Algo extrañamente normal en un señorío tan asediado."
 POD_spirit_travel.5902.a: "¡Estas ropas son dignas de la realeza!"
 POD_spirit_travel.5902.b: "Me gusta mi propio estilo, gracias."
 
 POD_spirit_travel.6000.t: "Diluido"
 POD_spirit_travel.6000.desc: "Las [UmbraGlossary('elemental_courts')] son reflejos de los sistemas elementales dentro de la [UmbraGlossaryLocalized('astral_reaches','High Umbra')]. La entrada a las Cortes son las Cinco Puertas, que se pueden encontrar a mitad de camino en una Aguja. Aunque hay numerosos elementales y muchos más se forman con los rápidos cambios traídos por la sociedad humana, solo cinco son lo suficientemente estables como para ser consideradas Cortes.\nAsociados con el estado líquido de la materia, la emoción, el Oeste y la Esencia Primordial, los habitantes del señorío a menudo se preocupan por la situación general de los visitantes, involucrándose con sus sentimientos y puntos de vista. Puede ser una experiencia muy relajante, o un cruel recordatorio de que tal tranquilidad no existe realmente en ningún otro lugar."
 POD_spirit_travel.6000.a: "Qué calma..."
 POD_spirit_travel.6000.b: "Tengo que seguir adelante."
  
 POD_spirit_travel.6001.t: "Refrescado por el Aire"
 POD_spirit_travel.6001.desc: "Las [UmbraGlossary('elemental_courts')] son reflejos de los sistemas elementales dentro de la [UmbraGlossaryLocalized('astral_reaches','High Umbra')]. La entrada a las Cortes son las Cinco Puertas, que se pueden encontrar a mitad de camino en una Aguja. Aunque hay numerosos elementales y muchos más se forman con los rápidos cambios traídos por la sociedad humana, solo cinco son lo suficientemente estables como para ser consideradas Cortes.\nAsociados con el estado gaseoso de la materia, el pensamiento, el Este y la Esencia Dinámica, los señores del Aire están entre los elementales más receptivos y a menudo confrontan el intelecto de un visitante con acertijos y técnicas similares."
 POD_spirit_travel.6001.a: "¡Soy el maestro de los acertijos!"
 POD_spirit_travel.6001.b: "Los acertijos son una estupidez."
   
 POD_spirit_travel.6002.t: "La ira conduce a..."
 POD_spirit_travel.6002.desc: "Las [UmbraGlossary('elemental_courts')] son reflejos de los sistemas elementales dentro de la [UmbraGlossaryLocalized('astral_reaches','High Umbra')]. La entrada a las Cortes son las Cinco Puertas, que se pueden encontrar a mitad de camino en una Aguja. Aunque hay numerosos elementales y muchos más se forman con los rápidos cambios traídos por la sociedad humana, solo cinco son lo suficientemente estables como para ser consideradas Cortes.\nAsociados con el estado plásmico de la materia, la intuición, el Sur y la Esencia Buscadora, los habitantes de este señorío son bruscos y directos, esperando que los visitantes expongan sus asuntos y se pongan manos a la obra. Las peleas son habituales aquí y los habitantes del señorío están encantados de enseñar a cualquier recién llegado una lección o dos sobre la brutalidad temeraria."
 POD_spirit_travel.6002.a: "¡Estoy bastante animado para esto!"
 POD_spirit_travel.6002.b: "La violencia no es la respuesta."
   
  
