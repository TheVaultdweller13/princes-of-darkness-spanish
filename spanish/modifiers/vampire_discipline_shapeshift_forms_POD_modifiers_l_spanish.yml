 demonic_feature_antennae_modifier: "Antenas"
 demonic_feature_antennae_modifier_desc: "Al usuario le crecen un par de antenas similares a las de un insecto que le ayudan a percibir su entorno."
 demonic_feature_claws_modifier: "Garras"
 demonic_feature_claws_modifier_desc: "Al personaje le crecen garras demoníacas."
 demonic_feature_demon_armor_modifier: "Armadura demoníaca"
 demonic_feature_demon_armor_modifier_desc: "La armadura demoníaca puede aparecer como escamas, una ornamentada armadura de samurái o cualquier otra cosa, y ofrece una mayor protección contra los ataques."
 demonic_feature_demon_weapon_modifier: "Arma demoníaca"
 demonic_feature_demon_weapon_modifier_desc: "Un arma mística aparece en la mano del personaje. Tal arma podría resplandecer con Chi, emitir gemidos espantosos, estar cubierta de rostros burlones, etc."
 demonic_feature_enlarged_body_parts_modifier: "Partes del cuerpo agrandadas"
 demonic_feature_enlarged_body_parts_modifier_desc: "Una de las partes del cuerpo del personaje se hincha hasta ser mucho más grande de lo normal, a menudo cubierta de llagas o surcada por venas de aspecto desagradable."
 demonic_feature_eyes_of_horror_modifier: "Ojos de horror"
 demonic_feature_eyes_of_horror_modifier_desc: "Los ojos demoníacos del personaje contienen una sugerencia de terror y locura para cualquiera que los mire."
 demonic_feature_extra_arms_modifier: "Brazos extra"
 demonic_feature_extra_arms_modifier_desc: "Dos brazos extra brotan del torso del personaje, lo que permite una mayor habilidad en el forcejeo o simplemente permite más ataques de lo habitual."
 demonic_feature_form_of_the_yamamatsu_modifier: "Forma del Yamamatsu"
 demonic_feature_form_of_the_yamamatsu_modifier_desc: "El cuerpo demoníaco del [GetTrait('kueijin').GetName( GetNullCharacter )] se vuelve gomoso y fofo, casi fluido en algunos puntos, dándole una apariencia horriblemente distorsionada."
 demonic_feature_foulness_modifier: "Inmundicia"
 demonic_feature_foulness_modifier_desc: "La forma demoníaca del personaje es extremadamente sucia: tal vez incrustada en sangre seca y trozos de carne, tal vez rodeada de una nube mefítica, etc."
 demonic_feature_hive_body_modifier: "Cuerpo colmena"
 demonic_feature_hive_body_modifier_desc: "Pequeños agujeros y madrigueras en la piel del cuerpo demoníaco liberan animales diminutos y horribles. Serpientes, arañas, abejas y murciélagos son manifestaciones comunes de este extraño poder."
 demonic_feature_horns_modifier: "Cuernos"
 demonic_feature_horns_modifier_desc: "Al personaje le brotan cuernos de la cabeza. Pueden ser cortos o largos, lisos o dentados, rectos o torcidos, de varias puntas o de una sola, según desee el personaje."
 demonic_feature_horror_modifier: "Horror"
 demonic_feature_horror_modifier_desc: "El shintai puede afligir a los humanos con efectos similares al Delirio.\n#weak Otorga el [modifier|E] [GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante los [single_combat_duel_plural|E].#!"
 demonic_feature_huge_size_modifier: "Tamaño enorme"
 demonic_feature_huge_size_modifier_desc: "La salud del personaje aumenta a medida que el [GetTrait('kueijin').GetName( GetNullCharacter )] crece repentinamente hasta alcanzar entre nueve y doce pies de altura."
 demonic_feature_mandibles_modifier: "Mandíbulas"
 demonic_feature_mandibles_modifier_desc: "La boca del personaje se distiende y le brotan dientes terribles, colmillos o tal vez incluso mandíbulas de insecto."
 demonic_feature_multiple_heads_modifier: "Múltiples cabezas"
 demonic_feature_multiple_heads_modifier_desc: "Al personaje le crecen una o más cabezas extra, con un límite superior de siete cabezas adicionales, ayudando cada cabeza al [GetTrait('kueijin').GetName( GetNullCharacter )] a percibir su entorno."
 demonic_feature_poisoned_fangs_modifier: "Colmillos envenenados"
 demonic_feature_poisoned_fangs_modifier_desc: "Los colmillos en la boca del personaje se vuelven especialmente grandes, afilados y cáusticos."
 demonic_feature_spikes_modifier: "Púas"
 demonic_feature_spikes_modifier_desc: "El cuerpo del personaje está cubierto de uno de los siguientes elementos: púas, piel abrasiva como la de un tiburón, vello corporal tan rígido y afilado como el alambre de espino, clavos, piel ardiente o gélida, cuchillas, barbas o cristales rotos."
 demonic_feature_spurting_tendrils_modifier: "Zarcillos chorreantes"
 demonic_feature_spurting_tendrils_modifier_desc: "Pequeños zarcillos, dedos o esfínteres emergen de la piel del [GetTrait('kueijin').GetName( GetNullCharacter )]."
 demonic_feature_suckers_modifier: "Ventosas"
 demonic_feature_suckers_modifier_desc: "Los brazos u otras extremidades del personaje están cubiertos de ventosas similares a pequeñas bocas de lamprea."
 demonic_feature_suppurating_pustules_modifier: "Pústulas supurantes"
 demonic_feature_suppurating_pustules_modifier_desc: "El cuerpo demoníaco del personaje está cubierto de llagas y heridas supurantes."
 demonic_feature_tentacles_modifier: "Tentáculos"
 demonic_feature_tentacles_modifier_desc: "Al personaje le crecen tentáculos repugnantes cubiertos de limo."
 demonic_feature_tail_modifier: "Cola"
 demonic_feature_tail_modifier_desc: "Al personaje le crece una cola."
 demonic_feature_the_host_modifier: "La Hueste"
 demonic_feature_the_host_modifier_desc: "Rostros demoníacos con colmillos brotan de la espalda, el torso y las extremidades del personaje."
 demonic_feature_third_eye_modifier: "Tercer ojo"
 demonic_feature_third_eye_modifier_desc: "Al personaje le brota un tercer ojo en medio de la frente."
 demonic_feature_wings_modifier: "Alas"
 demonic_feature_wings_modifier_desc: "Piñones similares a los de un murciélago emergen y se extienden desde la espalda del personaje."
 demonic_feature_wing_spines_modifier: "Espinas alares"
 demonic_feature_wing_spines_modifier_desc: "A las alas del personaje le brotan espuelas espinosas similares a dedos."
 
