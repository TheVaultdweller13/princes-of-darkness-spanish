 roderigo_step1_modifier_desc: "El silencioso mago tiene tantas cosas que enseñarte. Solo tienes que dar un salto de fe..."
 roderigo_step2_modifier: "La Sabiduría de Roderigo"
 roderigo_step2_modifier_desc: "¡Sabes mucho más que antes! Pero aún hay algunas verdades ocultas lo bastante cerca como para sentirlas..."
 roderigo_step3_modifier: "Las Verdades de Roderigo"
 roderigo_step3_modifier_desc: "Conoces la verdad primordial sobre la vida y la muerte. Si al menos pudieras recordarla..."
