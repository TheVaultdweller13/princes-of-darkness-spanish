 flawless_presentation_modifier_desc: "La presentación de tu Chiquillo ha impresionado incluso a los más hastiados de tus Vasallos."
 laying_back_modifier: "Tomándotelo con Calma"
 laying_back_modifier_desc: "Te lo estás tomando con calma durante un tiempo. ¡Ciertamente te lo mereces!"
 byzantine_community_modifier: "Comunidad Bizantina"
