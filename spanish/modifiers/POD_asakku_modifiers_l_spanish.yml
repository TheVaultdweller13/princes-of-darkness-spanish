l_spanish:
 # Phase Completion Rewards
 POD_asakku_phase1_reward: "Los Cimientos"
 POD_asakku_phase1_reward_desc: "Las primeras semillas han echado raíces. Otros portan ahora la infección, y puedes sentir a cada uno de ellos, pulsos tenues al borde de la conciencia. La entidad está complacida de un modo que nada tiene que ver con la satisfacción. Simplemente reconoce el progreso."
 POD_asakku_phase3_reward: "Purga de los Usurpadores Occidentales"
 POD_asakku_phase3_reward_desc: "El extremo occidental de la Cruzada de las Sombras ha terminado. Los kamuts que te cazaban han desaparecido, muertos o transformados. La voz en tus pensamientos no está satisfecha. Eso implicaría un final."
 POD_asakku_phase4_reward: "El Ajuste de Cuentas Oriental"
 POD_asakku_phase4_reward_desc: "Oriente está hecho. Los Elioud han desaparecido. La Mano Verdadera continúa, mermada y perpleja. El Vigilante tiene lo que vino a buscar. ¿Victoria para ti o para ellos? Quizá ya no importe."

 POD_asakku_spread_wider: "Extenderse Más"
 POD_asakku_spread_wider_desc: "La infección llega más lejos, más rápido. La paciencia de la entidad ha dado paso al propósito, y las semillas que plantas echan raíces antes de que el suelo tenga tiempo de objetar."
 POD_asakku_consolidated_network: "Red Consolidada"
 POD_asakku_consolidated_network_desc: "La prole cierra filas. Cada miembro vigila los movimientos de los demás, y las operaciones hostiles encuentran todas las vías de ataque anticipadas por ojos que se suponía que no estaban mirando."
 POD_asakku_press_advantage: "Aprovechar la Ventaja"
 POD_asakku_press_advantage_desc: "Los Elioud tambalean y no pretendes dejar que se recuperen. La entidad impulsa tus conjuras con una urgencia afilada."

 POD_asakku_sinister_mastery_1: "Maestría Siniestra"
 POD_asakku_sinister_mastery_1_desc: "La influencia de la entidad agudiza tus instintos para la Vicisitud. Las artes coléricas te resultan ahora más naturales."
 POD_asakku_sinister_mastery_2: "Maestría Siniestra (Ascendida)"
 POD_asakku_sinister_mastery_2_desc: "El dominio de la carne que posee la entidad es más profundo que cualquier Disciplina. Tu comprensión de la Vicisitud trasciende lo que cualquier maestro podría ofrecer."
 POD_asakku_andeleon_brood: "Prole de Andeleon"
 POD_asakku_andeleon_brood_desc: "Aquellos a quienes has corrompido se mueven por el mundo como extensiones de tu voluntad. Más manos, más ojos, más de ti."
 POD_asakku_occultation: "Ocultación"
 POD_asakku_occultation_desc: "La entidad que llevas dentro te enseña a esconderte de formas que nada tienen que ver con las sombras. Te vuelves difícil de percibir, incluso para quienes saben exactamente dónde mirar."
 POD_asakku_inner_babble: "Parloteo Interior"
 POD_asakku_inner_babble_desc: "El murmullo constante de los pensamientos de la entidad crea un muro de ruido que las conjuras hostiles no pueden penetrar. Quienes se internan en tu mente no encuentran silencio, sino un coro.\nConcede #P Defensas Mentales Fuertes#!."
 POD_asakku_vicissitude_taint: "Mácula de Vicisitud"
 POD_asakku_vicissitude_taint_desc: "La sangre se ha hundido en la propia tierra. El terreno se vuelve extraño, defensivo, hostil a los forasteros, vivo de maneras que nada tienen que ver con la naturaleza."
 POD_asakku_hunted: "Cazado por los Elioud"
 POD_asakku_hunted_desc: "Los Elioud han marcado a este $pod_cainite$ para su eliminación. Sus kamuts comparten información, y las futuras operaciones contra este objetivo tienen un peso adicional."
 POD_asakku_soul_infection_resistant: "Infección del Alma Resistida"
 POD_asakku_soul_infection_resistant_desc: "Este $pod_cainite$ ha evitado por poco una intrusión no deseada de una entidad ajena. Estará más receloso ante tales intentos en un futuro próximo."
