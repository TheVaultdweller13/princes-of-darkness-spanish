l_spanish:
 aye_disconnected_modifier: "Desconectado de Aye"
 aye_disconnected_modifier_desc: "Has perdido el contacto con el mundo de los vivos. Los mortales perciben que hay algo profundamente erróneo en ti."
 orun_disconnected_modifier: "Desconectado de Orun"
 orun_disconnected_modifier_desc: "El mundo espiritual te ha dado la espalda. Tus ancestros callan. Estás solo en la oscuridad."
 guruhi_beauty_1_modifier: "Guruhi Espantoso"
 guruhi_beauty_2_modifier: "Guruhi Poco Agraciado"
 guruhi_beauty_3_modifier: "Guruhi de Aspecto Humano"
 guruhi_beauty_4_modifier: "Guruhi Radiante"
 spirit_blessed_modifier: "Bendecido por los Espíritus"
 spirit_blessed_modifier_desc: "Un gran espíritu te ha reconocido. Su poder perdura en tu sangre."
 spirit_beast_wound_modifier: "Herida de Espíritu-Bestia"
 spirit_beast_wound_modifier_desc: "El rechazo del espíritu-bestia ha dejado una herida que se resiste a sanar."
 beasts_counsel_modifier: "Consejo de la Bestia"
 beasts_counsel_modifier_desc: "Tu Bestia ha compartido contigo su conocimiento de los modos de lo salvaje."
 fury_prowess_modifier: "Furia del Osebo"
 fury_prowess_modifier_desc: "Los espíritus guerreros de tus ancestros prestan fuerza a tu brazo."
 fury_unleashed_modifier: "Furia Desatada"
 fury_unleashed_modifier_desc: "Te entregaste por completo a la furia. El poder es embriagador y peligroso."
 scholars_insight_modifier: "Intuición del Erudito"
 scholars_insight_modifier_desc: "El conocimiento ancestral ha abierto nuevos caminos de comprensión."
 invoke_authority_of_the_living_modifier: "Autoridad de los Vivos"
 invoke_authority_of_the_living_modifier_desc: "Hablas con la voz del mundo de los vivos. Los mortales obedecen porque la propia tierra se lo ordena."
 laibon_vassal_authority_modifier: "Autoridad de Aye del Señor"
 laibon_vassal_authority_modifier_desc: "Tu señor habla con la autoridad del mundo de los vivos. Hasta los muertos escuchan."
 commune_with_ancestors_modifier: "Comunión con los Ancestros"
 commune_with_ancestors_modifier_desc: "Los ancestros han respondido. Su fuerza fluye a través de ti, y su vista revela lo que otros ocultarían."
 mortal_petitioner_success_modifier: "Árbitro Justo"
 mortal_petitioner_success_modifier_desc: "Tu juicio ecuánime te ha ganado el respeto de los mortales de tu dominio."
 mortal_petitioner_failure_modifier: "Árbitro Injusto"
 mortal_petitioner_failure_modifier_desc: "Tu intento de juicio ha dejado a los mortales recelosos de tu autoridad."
 gathering_fire_modifier: "Fuego Creciente"
 gathering_fire_modifier_desc: "El fuego de la Asamblea aún arde en los recuerdos de quienes asistieron."
 harvest_celebration_modifier: "Guardián de la Cosecha"
 harvest_celebration_modifier_desc: "Los mortales recuerdan tu presencia en la celebración. Eres su protector."
 masquerade_breach_modifier: "Violación de la Mascarada"
 masquerade_breach_modifier_desc: "Los rumores se han extendido entre los mortales. Algo va mal con su señor."
 ancestors_grave_development_modifier: "Terreno Ancestral Despejado"
 ancestors_grave_development_modifier_desc: "El terreno despejado se ha dedicado a un uso productivo, aunque los espíritus no lo aprueban."
 guruhi_crown_modifier: "Peso de la Corona"
 guruhi_crown_modifier_desc: "Tu intervención personal ha restablecido el orden entre tus vasallos."
 vice_spreads_failure_modifier: "Vicio sin Freno"
 vice_spreads_failure_modifier_desc: "Tu indulgencia ha dejado huella en la comunidad. Los mortales andan recelosos."
