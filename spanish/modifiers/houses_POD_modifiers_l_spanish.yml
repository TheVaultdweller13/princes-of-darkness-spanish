 ### Objective Reward Modifiers
 covenant_of_life_and_death_modifier: "Pacto de Vida y Muerte"
 covenant_of_life_and_death_modifier_desc: "Mediante antiguos ritos nigrománticos, los Impundulu han renovado su Pacto con la línea Bomkazi. El vínculo entre la bruja viva y el nigromante no-muerto es más fuerte que nunca."

 ishologu_modifier: "El Ishologu"
 ishologu_modifier_desc: "Tras romper el antiguo Pacto mediante el Rito Ishologu, este vampiro ya no está ligado a las brujas Bomkazi. Libre de la restricción de alimentación, pero desligado de la magia vital que antaño lo sostenía."

 ### Opinion Modifiers
 fellow_scholar_of_death_modifier: "Compañero Erudito de la Muerte"

 ### Event Modifiers
 memory_of_bomkazi_modifier: "Memoria de Bomkazi"
 memory_of_bomkazi_modifier_desc: "El recuerdo de Bomkazi, la primera esposa bruja, aún perdura. Su sacrificio resuena a través de los tiempos."

 withering_blood_urgency_modifier: "La Sangre Marchita"
 withering_blood_urgency_modifier_desc: "La línea Bomkazi se debilita con cada Generación. Hay que hacer algo antes de que las brujas mortales desaparezcan por completo."

