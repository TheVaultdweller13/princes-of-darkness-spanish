l_spanish:
 house_hardestadt_modifier: "Casa Hardestadt"
 house_hardestadt_modifier_desc: "Aunque de un linaje algo turbio respecto al progenitor Ventrue, la Casa Hardestadt ya ha demostrado una perspicacia de gobierno no vista desde las noches de la Roma Ventrue."
 house_nabonidus_modifier: "Casa Nabonidus"
 house_nabonidus_modifier_desc: "Este linaje Assamita reclusivo es conocido por inspirar una gran fe en sus seguidores, incluso con las búsquedas más exóticas que parece tener."
 house_shahiri_modifier: "Casa Sha'hiri"
 house_shahiri_modifier_desc: "El linaje del Anciano elegido por el propio Haqim como sucesor es una elección de consenso para el dividido $pod_clan$. Aunque también podría deberse a que Sha'hiri es conocido por ser un poco blando."
 house_anath_modifier: "Casa Anath"
 house_anath_modifier_desc: "La Reina de la Guerra y el Amor es una figura sombría, pero sus Chiquillos han logrado grandes hazañas tanto en la diplomacia como en la guerra. Sin embargo, son conocidos por ser algo temerarios y directos."
 house_jamal_modifier: "Casa Jamal"
 house_jamal_modifier_desc: "El implacable líder de la facción [Glossary('Ashirra','game_concept_ashirra_desc')] en el $pod_clan$ Assamita es un guerrero sin igual. Pero no es conocido por su paciencia con los infieles."
 house_urshulgi_modifier: "Casa Ur'Shulgi"
 house_urshulgi_modifier_desc: "El linaje del Pastor Negro es un misterio. Y por el bien de todos, debería seguir sin resolverse."
 house_thetmes_modifier: "Casa Thetmes"
 house_thetmes_modifier_desc: "La Araña tiene planes dentro de planes. Y no tiene tiempo para ocuparse de asuntos triviales como el gobierno."
 house_anosh_modifier: "Casa Anosh"
 house_anosh_modifier_desc: "Rechazado por todo su $pod_clan$, el linaje Anosh es uno de visiones y experimentación en lo desconocido."
 house_azrael_modifier: "Casa Azrael"
 house_azrael_modifier_desc: "Los mejores guerreros de un $pod_clan$ guerrero lo hacen ellos mismos."
 house_nakurtum_modifier: "Casa Nakurtum"
 house_nakurtum_modifier_desc: "La temeraria y fogosa Nakurtum tomó por asalto el $pod_clan$ Assamita. Espera la debida diligencia de sus súbditos, pero le cuesta ganársela."
 house_abuilaf_modifier: "Casa Abu Ilaf"
 house_abuilaf_modifier_desc: "La casa menor de un descendiente menor de Haqim ha creado principalmente buscadores dedicados, a menudo reclusivos y retraídos."
 house_shango_modifier: "Casa Shango"
 house_shango_modifier_desc: "Astutos gobernantes y consejeros, los Shango siguen siendo objeto de desconfianza entre los Laibon por sus crueles métodos. Por ello, es bastante raro que un Shango lidere un gran dominio sin sufrir represalias."
 house_wahsheen_modifier: "Casa Wah'Sheen"
 house_wahsheen_modifier_desc: "Es difícil ganarse la confianza de un Gangrel [Glossary('Ashirra','game_concept_ashirra_desc')], pero una vez lograda, es un vínculo inquebrantable."
 house_saad_modifier: "Casa Saad"
 house_saad_modifier_desc: "Los beduinos del $pod_clan$ Assamita son vistos con cierto recelo y tienden a mantenerse unidos entre sí o con sus tribus."
 house_zayyat_modifier: "Casa Zayyat"
 house_zayyat_modifier_desc: "La Casa Zayyat arde con la fe del recién convertido. Un espectáculo tan inspirador como aterrador."
 house_hannibal_modifier: "Casa Aníbal"
 house_hannibal_modifier_desc: "Aunque luchan con valentía y una mente estratégica certera, los miembros de la Casa Aníbal siempre parecen destinados a fracasar al final."
 house_losario_modifier: "Casa Losario"
 house_losario_modifier_desc: "Los miembros de la Casa Losario son agitadores e innovadores, siempre empujando los límites. Sin embargo, nadie parece capaz de seguir enfadado con ellos por mucho tiempo."
 house_leeland_modifier: "Casa Leeland"
 house_leeland_modifier_desc: "Los engendrados de Leeland son los apasionados líderes del mundo $pod_cainite$ libre. Los Clanes tradicionales siempre sospecharán que están tramando algo."
 house_menele_modifier: "Casa Menele"
 house_menele_modifier_desc: "Implacables cuando luchan por sus convicciones, los miembros de la Casa Menele a menudo son ciegos ante amenazas más sutiles."
 house_dominic_modifier: "Casa Dominic"
 house_dominic_modifier_desc: "Versados en el arte de la guerra, los miembros de la Casa Dominic son lamentablemente a menudo presa fácil de su [Glossary('Bestia','game_concept_beast_desc')], especialmente voraz."
 house_gersakkun_modifier: "Casa Gersakkun"
 house_gersakkun_modifier_desc: "Este linaje casi olvidado no ha dejado su huella en la historia Brujah, a pesar de haber producido algunos filósofos talentosos."
 house_truebrujah_modifier: "Casa Verdadero Brujah"
 house_truebrujah_modifier_desc: "Nadie sabe si hay algo de verdad en la extraña historia de origen de esta Línea de Sangre. Pero su fría distancia tampoco les granjea amigos."
 house_baytmushakis_modifier: "Casa Bay't Mushakis"
 house_baytmushakis_modifier_desc: "Los Brujah musulmanes fueron implacables en su caza del odiado Ventrue. Son un enemigo tenaz para cualquier amigo de su gran adversario."
 house_guillaume_modifier: "Casa Guillaume"
 house_guillaume_modifier_desc: "Justos e imparciales, los miembros de la Casa Guillaume se preocupan más por el estado de sus almas que por cualquier mezquina intriga política."
 house_azif_modifier: "Casa Azif"
 house_azif_modifier_desc: "La Casa Azif carga con el estigma del avaricioso robo de almas de su progenitor. Un crimen que pocos están dispuestos a olvidar."
 house_osebo_modifier: "Casa Osebo"
 house_osebo_modifier_desc: "Dejados a su suerte, los Osebo son criaturas de fuego e ira apenas contenidas. Sin embargo, ellos mismos lo saben y buscan patrones justos que los mantengan a raya."
 house_lexor_modifier: "Casa Lexor"
 house_lexor_modifier_desc: "Los Brujah Lexor administraron todo un imperio. Lamentablemente, su bizantina burocracia los volvió ciegos ante las amenazas más alejadas de su hogar."
 house_giovanni_modifier: "Casa Giovanni"
 house_giovanni_modifier_desc: "A estos les gusta mantenerlo en familia."
 house_lazarene_modifier: "Casa Lazarene"
 house_lazarene_modifier_desc: "A buen hambre no hay pan duro. Perseguidos por su propio $pod_clan$, los engendrados de Lázaro se aliarán con quien esté dispuesto."
 house_japhet_modifier: "Casa Jafet"
 house_japhet_modifier_desc: "Los líderes tradicionales del $pod_clan$ Capadocio tienen un enfoque muy distante. Puede ser gratificante... y peligroso."
 house_byzar_modifier: "Casa Byzar"
 house_byzar_modifier_desc: "Los miembros de la Casa Byzar son constructores de civilizaciones. Sin embargo, no son los mejores defendiéndolas."
 house_premascine_modifier: "Casa Premascine"
 house_premascine_modifier_desc: "Si la ambición fuera una virtud, aquí están sus ángeles."
 house_harbingersofskulls_modifier: "Casa Heraldos"
 house_harbingersofskulls_modifier_desc: "Este extraño grupo de despiadados Capadocios se siente mucho más cómodo entre las sombras que en el trono."
 house_lamia_modifier: "Casa Lamia"
 house_lamia_modifier_desc_no_collide: "Nadie conoce el verdadero objetivo final de las hijas guerreras de Lilith. Y ellas no lo revelan."
 house_mlawatu_modifier: "Casa Mla Watu"
 house_mlawatu_modifier_desc: "No se puede confiar en un ser que busca poder en las almas y los cuerpos de los muertos. Aunque sepan cosas que deseas."
 house_almawt_modifier: "Casa Al Mawt"
 house_almawt_modifier_desc: "Con cuidado de no atraer la ira del mundo musulmán, los Capadocios de esta casa tienen pocos aliados, pero muchos secretos."
 house_hecata_modifier: "Casa Hecata"
 house_hecata_modifier_desc: "Una noche, la Diosa de la Muerte acogerá a todos sus hijos descarriados en su frío Abrazo."
 house_rusenko_modifier: "Casa Rusenko"
 house_rusenko_modifier_desc: "Si la locura es una escalera, no queda mucho por subir."
 house_lhiannan_modifier: "Casa Lhiannan"
 house_lhiannan_modifier_desc: "Las reliquias de una era pasada luchan hasta su último aliento. Y es un espectáculo peligroso de contemplar."
 house_odin_modifier: "Casa Odín"
 house_odin_modifier_desc: "El Padre de Todos observa la última resistencia de los [Glossary('Einherjar','game_concept_einherjar_desc')]. Y ningún cobarde entrará en el Valhalla."
 house_rufus_modifier: "Casa Rufus"
 house_rufus_modifier_desc: "Rufus ha protegido sus montañas durante miles de años. Tiene intención de seguir haciéndolo mil años más."
 house_matasuntha_modifier: "Casa Matasunta"
 house_matasuntha_modifier_desc: "La huna casi destruyó Roma en el pasado. No tiene intención de ser detenida dos veces."
 house_hukros_modifier: "Casa Hukros"
 house_hukros_modifier_desc: "El linaje de Hukros siempre busca verdades ocultas, un espíritu curioso que no sienta bien a sus correligionarios."
 house_aajav_modifier: "Casa Aajav"
 house_aajav_modifier_desc: "El estandarte de Aajav ondea alto en el cielo, el último grito de desafío de un mundo moribundo. Ya no hay vuelta atrás."
 house_kurru_modifier: "Casa Kurru"
 house_kurru_modifier_desc: "Los miembros de la Casa Kurru se sienten inusualmente cómodos en roles de liderazgo en comparación con el resto del $pod_clan$ Gangrel. Sin embargo, su enfoque directo del gobierno a menudo los deja expuestos a tácticas deshonestas."
 house_vola_modifier: "Casa Vola"
 house_vola_modifier_desc: "Los recios nórdicos de la Casa Vola no tienen paciencia para los necios. ¡Hay incursiones y saqueos por hacer!"
 house_anda_modifier: "Casa [Glossary('Anda','podgloss.anda')]"
 house_anda_modifier_desc: "El Azote de las estepas son guerreros sin parangón, pero pueden tener dificultades para adaptarse a los rigores de gobernar vastas extensiones de tierra."
 house_akunanse_modifier: "Casa Akunanse"
 house_akunanse_modifier_desc: "Las sabias arañas de África muestran poco interés en el Jyhad. Esto los convierte en vecinos serviciales, pero en malos gobernantes."
 house_noiad_modifier: "Casa Noiad"
 house_noiad_modifier_desc: "Los extraños $pod_cainites$ del helado Norte son criaturas salvajes, no aptas para gobernar zonas pobladas."
 house_montano_modifier: "Casa Montano"
 house_montano_modifier_desc: "Los líderes tradicionales del $pod_clan$ Lasombra son místicos reclusivos, a menudo poco aptos para sus funciones."
 house_deruiz_modifier: "Casa De Ruiz"
 house_deruiz_modifier_desc: "Los odiados enemigos del musulmán ibérico están profundamente arraigados en la cultura caballeresca de Iberia, y hacen pleno uso de ella."
 house_narses_modifier: "Casa Narses"
 house_narses_modifier_desc: "Los otrora grandes líderes de la Herejía $pod_cainite$ yacen dispersos y quebrados desde la muerte de su arzobispo. Sus pecados no han sido olvidados."
 house_boukephos_modifier: "Casa Boukephos"
 house_boukephos_modifier_desc: "El erudito Chiquillo diplomático de Lasombra es un $pod_cainite$ amigable, querido por la generación más joven. Sin embargo, a menudo es propenso a alejarse errante de su Señorío."
 house_sybil_modifier: "Casa Sybil"
 house_sybil_modifier_desc: "El resto del $pod_clan$ apenas reconoce el linaje de la hija repudiada. Por ello, han aprendido a depender principalmente de sí mismos."
 house_gratiano_modifier: "Casa Graciano"
 house_gratiano_modifier_desc: "Graciano está destinado a grandes cosas. Y le encanta recordárselo a todo el mundo."
 house_khanommehr_modifier: "Casa Khanom Mehr"
 house_khanommehr_modifier_desc: "Distante de la política, la Casa Khanom Mehr se dedica a la protección del $pod_clan$ y su fundador."
 house_karotos_modifier: "Casa Karotos"
 house_karotos_modifier_desc: "El linaje casi desconocido de un misterioso Lasombra carga con algunos eventos traumáticos del pasado, pero tiene todo por demostrar."
 house_qabilatalkhayal_modifier: "Casa Qabilat al-Khayal"
 house_qabilatalkhayal_modifier_desc: "Los Lasombra [Glossary('Ashirra','game_concept_ashirra_desc')] están a la defensiva; su implacable celo es tanto una bendición como una maldición en estos tiempos difíciles."
 house_allama_modifier: "Casa al-Lam'a"
 house_allama_modifier_desc: "Con su diplomacia flexible, la pequeña Casa al-Lam'a está asegurando su supervivencia, a pesar de su reticencia a usar tácticas deshonestas."
 house_tubalcain_modifier: "Casa Tubalcaín"
 house_tubalcain_modifier_desc: "Maestros de la Dominación, la Casa Tubalcaín no ve con buenos ojos las opiniones religiosas divergentes."
 house_tepelit_modifier: "Casa Tepelit"
 house_tepelit_modifier_desc: "El reclusivo y casi desconocido Tepelit ha tenido visiones de su perdición, y algunos dicen que incluso la ha aceptado."
 house_blueeye_modifier: "Casa Ojo Azul"
 house_blueeye_modifier_desc: "Este mítico linaje de Lasombra es reclusivo, y la mayoría coincidiría en que no está capacitado para gobernar u ocupar posiciones de poder."
 house_ramanga_modifier: "Casa Ramanga"
 house_ramanga_modifier_desc: "Un linaje despiadado que no duda en influir abiertamente sobre el ganado, la Casa de la Reina de Madagascar solo confía en sí misma en materia de gobierno."
 house_lamdiel_modifier: "Casa Lamdiel"
 house_lamdiel_modifier_desc: "Con visiones interminables de perdición y oscuridad, no es fácil ser miembro de la Casa Lamdiel."
 house_eater_modifier: "Casa Devorador"
 house_eater_modifier_desc: "Siempre te está observando, esperando el momento de arrebatarte las palabras si no tienes cuidado."
 house_brahina_modifier: "Casa Brahina"
 house_brahina_modifier_desc: "Criaturas de pasión intensa, a los miembros de la Casa Brahina les cuesta mantenerse centrados en un solo tema durante mucho tiempo."
 house_delaurent_modifier: "Casa De Laurent"
 house_delaurent_modifier_desc: "Un erudito centrado y talentoso, De Laurent está en su mejor momento a solas en su biblioteca, no gobernando una gran corte."
 house_midian_modifier: "Casa Midian"
 house_midian_modifier_desc: "Los tiranos pueden tener suerte. Pero la suerte siempre se acaba, tarde o temprano."
 house_banes_modifier: "Casa Banes"
 house_banes_modifier_desc: "Conocer el futuro puede ser una bendición. Pero también puede quebrar un ya precario aferramiento a la realidad."
 house_plague_modifier: "Casa Plaga"
 house_plague_modifier_desc: "La Casa de las Plagas tiene una Misión única y horrenda que la hace muy peligrosa de frecuentar."
 house_izaha_modifier: "Casa Izaha"
 house_izaha_modifier_desc: "Esta Casa Malkavian es incluso más loca de lo habitual, pero hay un filo inquietante en sus ojos retorcidos."
 house_lerterimas_modifier: "Casa Lerterimas"
 house_lerterimas_modifier_desc: "Rechazada por su propio $pod_clan$ por su alianza con un poder más oscuro, la Casa Lerterimas corre hacia un apocalipsis de su propia creación."
 house_panehesy_modifier: "Casa Panehesy"
 house_panehesy_modifier_desc: "Esta Casa de Malkav egipcios ocupó grandes posiciones en los antiguos Señoríos egipcios. Parecía mantener su cordura a raya, si no apaciguar su búsqueda de un poder superior."
 house_nissiku_modifier: "Casa Nissiku"
 house_nissiku_modifier_desc: "El Astuto Príncipe sabe cuándo engañar y cuándo encantar. Su Presencia aún se siente en su linaje, que siempre se ve impulsado a encontrar nuevas formas de complacer su espíritu en constante expansión."
 house_ananke_modifier: "Casa Ananke"
 house_ananke_modifier_desc: "El agraviado se cobrará su sangrienta venganza sobre los hijos e hijas de los embaucadores." 
 house_vrykolakas_modifier: "Casa Vrykolakas"
 house_vrykolakas_modifier_desc: "El que escapó sigue corriendo, sin mirar nunca atrás."
 house_yagnatia_modifier: "Casa Yagnatia"
 house_yagnatia_modifier_desc: "La Abuela ha dejado de huir. Su prole plantará cara y luchará hasta el final si es necesario."
 house_baytmutasharid_modifier: "Casa Bay't Mutasharid"
 house_baytmutasharid_modifier_desc: "Los Nosferatu del mundo musulmán que se negaron a unirse a los Hajj llevan una vida apartada, amargados y al margen de la sociedad."
 house_trajan_modifier: "Casa Trajano"
 house_trajan_modifier_desc: "Si la Red de Trajano no conoce cierta información, sencillamente no merece la pena conocerla."
 house_absalon_modifier: "Casa Absalón"
 house_absalon_modifier_desc: "Los Obispos no-muertos de Dinamarca ocupan prestigiosas posiciones de poder en su tierra natal. La única tierra que merece la pena, obviamente."
 house_yima_modifier: "Casa Yima"
 house_yima_modifier_desc: "El Santo Grial del $pod_clan$ Nosferatu es algo en torno a lo cual unirse, encontrar consuelo o por lo que morir."
 house_alexius_modifier: "Casa Alexius"
 house_alexius_modifier_desc: "Ardiendo de furia fanática, la Casa Alexius está lista para purgar a cualquier infiel que se interponga en su camino."
 house_malachite_modifier: "Casa Malaquita"
 house_malachite_modifier_desc: "La Roca de Constantinopla es también su última esperanza. Ningún obstáculo podrá bloquear el camino de los Elegidos de Miguel."
 house_guruhi_modifier: "Casa Guruhi"
 house_guruhi_modifier_desc: "Tradicionalmente líderes de los Laibon, los Guruhi valoran su posición, lejos de la miseria de sus primos del Norte."
 house_al_hajj_modifier: "Casa al-Hajj"
 house_al_hajj_modifier_desc: "Protectores de las Ciudades Santas, indomables en su fe."
 house_mnemach_modifier: "Casa Mnemach"
 house_mnemach_modifier_desc: "Mnemach ha estado en Luteria toda su vida. Su conocimiento de las magias antiguas solo se ve rivalizado por su amor por su ciudad."
 house_chandraputra_modifier: "Casa Chandraputra"
 house_chandraputra_modifier_desc: "El indiscutible líder del $pod_clan$ Ravnos durante milenios no se quedará de brazos cruzados mientras sus hermanos sufren un asedio constante. Victoria o muerte es la única opción para el General."
 house_ravana_modifier: "Casa Ravana"
 house_ravana_modifier_desc: "El traidor vendió su alma hace mucho tiempo. Nunca subestimes el atractivo del Mal puro."
 house_hazimel_modifier: "Casa Hazimel"
 house_hazimel_modifier_desc: "...y, mientras miras dentro del Ojo, un conocimiento eterno brota de él."
 house_alexandrite_modifier: "Casa Alejandrita"
 house_alexandrite_modifier_desc: "Arrebatar oro de las fauces de la Serpiente es una jugada peligrosa a la que los Alejandritas están acostumbrados."
 house_rroma_modifier: "Casa Phuri Dae"
 house_rroma_modifier_desc: "Lejos de casa, se mantienen unidos, refugiándose de la tormenta interminable."
 house_kali_modifier: "Casa Kali"
 house_kali_modifier_desc: "Un linaje olvidado, su existencia borrada de los registros Ravnos por sus abominables crímenes... u opiniones divergentes."
 house_baytmujirim_modifier: "Casa Bay't Mujirim"
 house_baytmujirim_modifier_desc: "Desconfiados por el resto del mundo [Glossary('Ashirra','game_concept_ashirra_desc')], los Ravnos musulmanes son una estirpe autosuficiente, resistente aunque cínica."
 house_kinyonyi_modifier: "Casa Kinyonyi"
 house_kinyonyi_modifier_desc: "Los mensajeros del Reino de Ébano son bien recibidos en la mayoría de las cortes, aunque nunca se quedan mucho tiempo."
 house_bashirite_modifier: "Casa Bashirite"
 house_bashirite_modifier_desc: "Hasta que llegue el Apocalipsis, hay dinero que ganar."
 house_phaedymite_modifier: "Casa Phaedymite"
 house_phaedymite_modifier_desc: "Los Caballeros de los Ravnos intentan redimir a su Clan caído, a pesar de sí mismos."
 house_sybarite_modifier: "Casa Sybarite"
 house_sybarite_modifier_desc: "No existe el bien ni el mal. Toma lo que desees."
 house_yoryari_modifier: "Casa Yoryari"
 house_yoryari_modifier_desc: "Buscando la verdad, regresando a sus raíces. Oriente llama."

 indian_ravnos_improved_modifier: "Ravnos Indios Potenciados"
 indian_ravnos_improved_modifier_desc: "El centro del clan Ravnos se mantiene firme y seguirá haciéndolo. La Guerra Eterna se ganará."
 house_alexandrite_improved_modifier: "Casa Alejandrita Enardecida"
 house_alexandrite_improved_modifier_desc: "Las serpientes se acobardan ante los verdaderos herederos del antiguo Egipto."
 house_rroma_improved_modifier: "Casa Phuri Dae Enardecida"
 house_rroma_improved_modifier_desc: "Los nómadas por fin encontrarán un lugar al que llamar hogar y el descanso que realmente merecen."
 house_baytmujirim_improved_modifier: "Casa Bay't Mujirim Enardecida"
 house_baytmujirim_improved_modifier_desc: "De marginados a gobernantes, antaño no tenían un asiento en la mesa. Ahora son dueños de la mesa."
 house_bashirite_improved_modifier: "Casa Bashirite Enardecida"
 house_bashirite_improved_modifier_desc: "Si un lugar en el Cielo se puede comprar, los Bashirite están listos para negociarlo."
 house_phaedymite_improved_modifier: "Casa Phaedymite Enardecida"
 house_phaedymite_improved_modifier_desc: "La caballerosidad y el honor nunca mueren realmente. Ni siquiera entre los no-muertos."
 house_sybarite_improved_modifier: "Casa Sybarite Enardecida"
 house_sybarite_improved_modifier_desc: "Esta fiesta realmente nunca terminará."
 house_yoryari_improved_modifier: "Casa Yoryari Enardecida"
 house_yoryari_improved_modifier_desc: "Una nueva fusión de Oriente y Occidente se alza, más fuerte que ambos combinados."
 house_erk_improved_modifier: "Casa Erk Enardecida"
 house_erk_improved_modifier_desc: "Los Ravnos túrquicos han consolidado su control sobre sus Tierras Natales ancestrales. Esta vez no las abandonarán."

 house_samiel_modifier: "Casa Samiel"
 house_samiel_modifier_desc: "Los Ángeles han terminado de esconderse, retirarse o acobardarse. Es hora de la guerra."
 house_enosh_modifier: "Casa Enosh"
 house_enosh_modifier_desc: "Los sabios consejeros de la Casa Enosh son un grupo estoico, que rara vez considera la violencia como una opción."
 house_rayzeel_modifier: "Casa Rayzeel"
 house_rayzeel_modifier_desc: "Los sanadores del $pod_clan$ Salubri ya han visto demasiada muerte. Su espíritu se debilita con cada herida que sanan."
 house_twilight_modifier: "Casa Crepúsculo"
 house_twilight_modifier_desc: "Defensores de la Humanidad, implacables en su guerra contra el mal."
 house_hrorsh_modifier: "Casa Hrorsh"
 house_hrorsh_modifier_desc: "Desprevenida ante el cruel asalto de los Tremere, la Casa Hrorsh es un fantasmal recordatorio de un $pod_clan$ antaño glorioso."
 house_mokur_modifier: "Casa Mokur"
 house_mokur_modifier_desc: "La última en caer, tal como Saulot pretendió desde el principio."
 house_watcher_modifier: "Casa Vigilante"
 house_watcher_modifier_desc: "Mientras sus primos occidentales caen, ellos permanecen en las sombras orientales, con su vigilia apenas comenzando."
 house_abdallah_modifier: "Casa Abdallah"
 house_abdallah_modifier_desc: "Progenitor de un legado, portador de una profecía, siempre observando."
 
 house_khaibit_modifier: "Casa Khaibit"
 house_khaibit_modifier_desc: "El linaje del primer hijo de Set inspira el debido respeto y temor reverencial entre sus semejantes."
 house_sarrasine_modifier: "Casa Sarrasine"
 house_sarrasine_modifier_desc: "Sarrasine mataría a sus padres por cualquier pizca de poder. De hecho, ya lo ha hecho."
 house_jormungandr_modifier: "Casa Jormungandr"
 house_jormungandr_modifier_desc: "Estos herejes apenas están comprometidos con ninguna causa, salvo su propio beneficio y supervivencia."
 house_isis_modifier: "Casa Isis"
 house_isis_modifier_desc: "Cuidado con la mujer despechada. Especialmente cuando es hija de Isis, y sostiene el secreto de la vida y la muerte en la palma de su mano."
 house_tawaret_modifier: "Casa Taweret"
 house_tawaret_modifier_desc: "Taweret una vez luchó contra Kemintiri hasta el empate y sobrevivió para contarlo. Su Destreza corre por las venas de su linaje."
 house_nefertiti_modifier: "Casa Nefertiti"
 house_nefertiti_modifier_desc: "Si el orgullo precede a la caída, Nefertiti estará cayendo durante muchísimo tiempo."
 house_maatkare_modifier: "Casa Maatkare"
 house_maatkare_modifier_desc: "El dulce encanto de la Serpiente es misericordioso... y tan tentador."
 house_seterpenre_modifier: "Casa Seterpenre"
 house_seterpenre_modifier_desc: "El diplomático Hierofante tiene la mente lo bastante abierta como para trabajar con extraños. Algunos incluso lo llamarían blando."
 house_heru_modifier: "Casa Heru"
 house_heru_modifier_desc: "Cuidado, esta serpiente tiene colmillos de verdad."
 house_scorpio_modifier: "Casa Scorpio"
 house_scorpio_modifier_desc: "Esta Casa muestra una alarmante afición por elaborar largos y prolongados planes apocalípticos. Aún más alarmante es que algún día alguno podría funcionar de verdad..."
 house_porphyrion_modifier: "Casa Porphyrion"
 house_porphyrion_modifier_desc: "Los Demonios de la India están preparando planes indecibles para traer la gloria de Set al subcontinente. Si tienen éxito, no será agradable para nadie."
 house_osiris_modifier: "Casa Osiris"
 house_osiris_modifier_desc: "Perseguidos por la Serpiente, los Hijos del Dios de la muerte están casi todos con su padre ahora."
 house_damballah_modifier: "Casa Damballah"
 house_damballah_modifier_desc: "Algo distanciados del $pod_clan$ principal, los Hijos de Damballah son un grupo pragmático, que adapta su credo a las creencias africanas."
 house_khaytall_modifier: "Casa Khay'Tall"
 house_khaytall_modifier_desc: "Los herejes marginados antaño asociados con la Constantinopla de Miguel son un linaje perseguido. Sus opciones se reducen con cada noche que pasa."
 house_wepwawet_modifier: "Casa Wepwawet"
 house_wepwawet_modifier_desc: "Este culto guerrero defiende Egipto de amenazas externas, amenazas que ellos mismos clasifican como tales."
 house_mucalinda_modifier: "Casa Mucalinda"
 house_mucalinda_modifier_desc: "Los despreciados Naktanchara son una rama budista del $pod_clan$ Setita. Reclusivos y a la defensiva, su posición es precaria."
 house_glycon_modifier: "Casa Glycon"
 house_glycon_modifier_desc: "Los matones son una casta de guerreros ávidos de poder del $pod_clan$ Setita. Ciegos ante las Intrigas, no son más que brutos dirigidos hacia el objetivo más cercano."
 house_echidna_modifier: "Casa Equidna"
 house_echidna_modifier_desc: "Las Gorgonas han previsto su propia desaparición. Su inquietante aceptación de ello hace que la mayoría de los $pod_cainites$ les teman."
 house_nephilim_modifier: "Casa Nephilim"
 house_nephilim_modifier_desc: "La Casa más prestigiosa del $pod_clan$ Toreador ha caído en tiempos difíciles tras la muerte de su fundador. La semilla de la grandeza, sin embargo, sigue ahí."
 house_salianna_modifier: "Casa Salianna"
 house_salianna_modifier_desc: "Salianna ya lo ha perdido todo dos veces. No dejará que ocurra una tercera."
 house_callisti_modifier: "Casa Callisti y Callisto"
 house_callisti_modifier_desc: "Diplomáticos hábiles, los miembros de esta Casa tienden a olvidar los detalles por centrarse en el panorama general, lo cual ya les ha resultado costoso."
 house_nicholas_modifier: "Casa Nicholas"
 house_nicholas_modifier_desc: "Con un linaje inventado y un comportamiento fácil de olvidar, Etienne de Poitiers ha convertido su Casa en un objetivo difícil de localizar."
 house_andrew_modifier: "Casa Andrew"
 house_andrew_modifier_desc: "El «arcángel» de la Herejía $pod_cainite$ ha imbuido a su Casa con su visión pragmática de usar la religión como factor motivador para la guerra."
 house_helena_modifier: "Casa Helena"
 house_helena_modifier_desc: "Si no te has enamorado de un miembro de la Casa de Helena, es porque aún no has conocido a ninguno."
 house_baldr_modifier: "Casa Baldr"
 house_baldr_modifier_desc: "Los escaldos nórdicos intentan mantener vivos sus relatos con el poder de sus canciones y sus voces."
 house_lubbock_modifier: "Casa Lubbock"
 house_lubbock_modifier_desc: "Perdidos en sus pasiones, los miembros de la Casa Lubbock son presa fácil en el implacable mundo $pod_cainite$."
 house_volgirre_modifier: "Casa Volgirre"
 house_volgirre_modifier_desc: "Mezquinos gobernantes de mezquinos dominios esclavistas, la Casa Volgirre son señores sádicos y crueles Sires."
 house_apollo_modifier: "Casa Apolo"
 house_apollo_modifier_desc: "Flores pequeñas y delicadas, que buscan el sol y son fácilmente pisoteadas por la guerra."
 house_rayeenalfen_modifier: "Casa Ray'een al-Fen"
 house_rayeenalfen_modifier_desc: "Los calígrafos del mundo musulmán llevan mucho tiempo envueltos en un cisma generacional, lo suficiente como para que haya quedado marcado en su sangre."
 house_ishtarri_modifier: "Casa Ishtarri"
 house_ishtarri_modifier_desc: "Atormentados por un profundo Ansia de entregarse a sus vicios, los Ishtarri son no obstante hábiles en el sutil arte de manipular la información."
 house_goratrix_modifier: "Casa Goratrix"
 house_goratrix_modifier_desc: "El portador de la luz asegurará una nueva era para el $pod_clan$, o será engullido por la oscuridad."
 house_etrius_modifier: "Casa Etrius"
 house_etrius_modifier_desc: "El regente elegido de Tremere lidera una defensa inquebrantable al timón de un $pod_clan$ maltrecho. Una posición nada envidiable."
 house_leduc_modifier: "Casa LeDuc"
 house_leduc_modifier_desc: "El antiguo regente de Francia fue un $pod_cainite$ respetado allí, mucho más que su sustituto, Goratrix."
 house_meerlinda_modifier: "Casa Meerlinda"
 house_meerlinda_modifier_desc: "La única mujer del Concilio de los Siete es en realidad quien mantiene unida la pirámide. Inglaterra será su premio si logra superar en maniobras a los cautelosos $pod_cainites$ de las Islas."
 house_calderon_modifier: "Casa Calderón"
 house_calderon_modifier_desc: "El fiero español defenderá el honor de Tremere hasta su último aliento, ajeno a las fuerzas más oscuras en juego."
 house_grimgroth_modifier: "Casa Grimgroth"
 house_grimgroth_modifier_desc: "Los fantasmas de Mistridge aún se encolerizan esta noche, un único nombre pronunciado con tono de maldición: Grimgroth."
 house_cincao_modifier: "Casa De Cincao"
 house_cincao_modifier_desc: "Xavier es despiadado en sus métodos, pero nadie puede negar que obtiene resultados asombrosos con ellos."
 house_telyavel_modifier: "Casa Telyavel"
 house_telyavel_modifier_desc: "Perseguidos como herejes, los Magos de la Antigua Fe están encontrando una relativa seguridad junto a $pod_cainites$ de ideas afines."
 house_trimira_modifier: "Casa Trimira"
 house_trimira_modifier_desc: "Extraños en tierra hostil, obligados a hacer concesiones para sobrevivir."

 dynn_rock_lord_modifier: "Casa Gárgola"
 dynn_rock_lord_modifier_desc: "Antiguos esclavos, ahora libres para gobernar las tierras con lazos de parentesco forjados en piedra."

 house_kartarirya_modifier: "Casa Kartarirya"
 house_kartarirya_modifier_desc: "El Tzimisce multibrazo de la India es conocido por cortar varias cabezas antes de hacer preguntas."
 house_yaroslavich_modifier: "Casa Yaroslavich"
 house_yaroslavich_modifier_desc: "Cuanto más poderoso se vuelve, más deleite siente Hedeon al aplastar a sus patéticos enemigos."
 house_ruthven_modifier: "Casa Ruthvenski"
 house_ruthven_modifier_desc: "Los guardianes de la forma corpórea de Tzimisce están cegados por su prestigiosa posición, ajenos a las muchas amenazas que esta conlleva."
 house_vykos_modifier: "Casa Vykos"
 house_vykos_modifier_desc: "Myka se halla en una larga búsqueda de sentido. El final del camino se acerca cada vez más con cada noche que pasa..."
 house_rustovitch_modifier: "Casa Rustovitch"
 house_rustovitch_modifier_desc: "Vladimir intenta domar al $pod_clan$ Tzimisce por la fuerza de las armas. Una jugada audaz, y potencialmente letal."
 house_yorak_modifier: "Casa Yorak"
 house_yorak_modifier_desc: "Imagina tu peor pesadilla con forma humana. Torturándote por toda la eternidad. Mientras sus víctimas anteriores te observan, antes de que te unas a ellas en los muros de la Catedral."
 house_tabak_modifier: "Casa Tabak"
 house_tabak_modifier_desc: "La Casa Tabak está criada para el liderazgo, sabiendo exactamente cuándo exprimir hasta la última gota de sangre de los campesinos, o cuándo huir cuando está en desventaja."
 house_dracon_modifier: "Casa Dracon"
 house_dracon_modifier_desc: "Los piadosos vástagos del Dracon y los Obertus están poco preparados para la guerra y rehúyen las prácticas de Vicisitud de sus hermanos."
 house_byelobog_modifier: "Casa Byelobog"
 house_byelobog_modifier_desc: "El Dios Blanco gobierna sobre el Invierno, pero no le importa gobernar sobre ninguna otra cosa."
 house_triglav_modifier: "Casa Triglav"
 house_triglav_modifier_desc: "La Casa Triglav yace consumida por su enemistad con la Casa Dracon, apenas capaz de ocuparse de otra cosa."
 house_andeleon_modifier: "Casa Andeleon"
 house_andeleon_modifier_desc: "Distante de la mayoría de los asuntos mundanos, Andeleon busca la verdad más allá de las estrellas."
 house_demdemeh_modifier: "Casa Demdemeh"
 house_demdemeh_modifier_desc: "El hombre verdaderamente docto sabe que debe trascender la carne para convertirse en un Dios."
 house_djavakhi_modifier: "Casa Djavakhi"
 house_djavakhi_modifier_desc: "Cuando gobiernas con puño de hierro, nunca bajes la mano."
 house_nagloper_modifier: "Casa Nagloper"
 house_nagloper_modifier_desc: "¿Cómo puede la [Glossary('Bestia','game_concept_beast_desc')] controlarte si tú mismo eres la Bestia?"
 house_hrothgar_modifier: "Casa Hrothgar"
 house_hrothgar_modifier_desc: "Puedes huir de tu propio $pod_clan$, pero ¿puedes huir del Ragnarok?"
 house_jedrik_modifier: "Casa Jedrik"
 house_jedrik_modifier_desc: "A veces, la amenaza más grave para tu gobierno está más cerca de lo que crees."
 house_tinia_modifier: "Casa Tinia"
 house_tinia_modifier_desc: "Consumidos por las ansias de viajar, los miembros de la Casa Tinia anhelan experiencias nuevas y exóticas."
 house_mithras_modifier: "Casa Mithras"
 house_mithras_modifier_desc: "Los vástagos del Dios Sol se alinean con facilidad, condicionados por su progenitor durante siglos."
 house_alexander_modifier: "Casa Alexander"
 house_alexander_modifier_desc: "Alexander demostró su astuta Administración al gobernar el imperio más poderoso de Europa Occidental. Pero sus ataques de ira fueron igualmente legendarios."
 house_antonian_modifier: "Casa Antonian"
 house_antonian_modifier_desc: "El Arquitecto del Sueño construyó una de las utopías más impresionantes del mundo $pod_cainite$. Hasta que perdió la cordura y fue destruido por ello."
 house_camilla_modifier: "Casa Camilla"
 house_camilla_modifier_desc: "Los vástagos de Roma están, con razón, orgullosos de su legado. Sin embargo, el enorme prestigio y consideración que ostentan puede volverlos fácilmente indolentes."
 house_eigermann_modifier: "Casa Eigermann"
 house_eigermann_modifier_desc: "Matones y brutos que apenas encajan en el $pod_clan$ Ventrue, la Casa Eigermann es su propio peor enemigo."
 house_artemis_modifier: "Casa Artemis"
 house_artemis_modifier_desc: "Los Ventrue Orthias se apoderan de tronos y rara vez esperan su momento cuando una hoja puede acelerar el proceso. Creen que la gloria les es debida y la toman sin dudarlo."
 house_bindusara_modifier: "Casa Bindusara"
 house_bindusara_modifier_desc: "El erudito errante es una fuente de conocimiento, a menudo buscado para aprender los misteriosos caminos transmitidos de Generación en Generación."
 house_veddartha_modifier: "Casa Veddartha"
 house_veddartha_modifier_desc: "Casi sinónimo del propio Ventrue, Veddartha es una Casa de liderazgo orgulloso y diligente."
 house_arakur_modifier: "Casa Arakur"
 house_arakur_modifier_desc: "El linaje de Arakur tiene reputación de $pod_diablerie$, comunión con demonios y soberbia. También son cobardes consumados cuando no pueden imponerse por la fuerza."
 house_medon_modifier: "Casa Medon"
 house_medon_modifier_desc: "Medon tiene el dudoso honor de ser el primer vampiro verdaderamente poderoso en ser asesinado por mortales. Una vergüenza que su linaje aún siente hoy en día."
 house_nefermeriisis_modifier: "Casa Nefer-meri-Isis"
 house_nefermeriisis_modifier_desc: "La feroz Chiquillo de Ventrue prefiere ensuciarse las manos en la batalla. Por ello, su linaje desprecia depender de otros."
 house_arpad_modifier: "Casa Arpad"
 house_arpad_modifier_desc: "Tenaz y bien afianzada en la nobleza húngara, la Casa Arpad es un enemigo difícil de desalojar de sus Tierras Natales."
 house_antasia_modifier: "Casa Antasia"
 house_antasia_modifier_desc: "La serena y bien relacionada Julia Antasia cría a su prole para que sea respetuosa y amigable, abordando siempre los problemas con cuidado y compasión."
 house_le_croise_modifier: "Casa le Croise"
 house_le_croise_modifier_desc: "Geoffrey está aquejado de los mismos problemas de ira que su [Glossary('Sire','game_concept_Sire_desc')]. Solo puede contar con su comportamiento caballeresco para salvarlo de la ira de su $pod_clan$."
 house_moloch_modifier: "Casa Molochim"
 house_moloch_modifier_desc: "Guardianes de un mundo ingrato, los Molochim son perseguidos tanto por los demás Clanes como por sus compañeros de Clan. Los primeros no comprenden su propósito, y los segundos lo comprenden demasiado bien."
 house_nergal_modifier: "Casa Nergalita"
 house_nergal_modifier_desc: "Una plaga sobre un mundo que desean ver arder, los hijos de Nergal son las más negras Abominaciones que la maldición de Caín jamás ha producido."
 house_angellisater_modifier: "Casa Angellis Ater"
 house_angellisater_modifier_desc: "Los aborrecibles Angellis Ater son usurpadores dentro del $pod_clan$ Baali, en busca de un demente Camino hacia la condición demoníaca."
 house_ennamaru_modifier: "Hijos de Ennamaru"
 house_ennamaru_modifier_desc: "Los Hijos son crueles y sádicos manipuladores en las desprevenidas Cortes de los Cainitas franceses. No hay final feliz cuando ellos están involucrados."
 house_the_third_modifier: "El Tercero"
 house_the_third_modifier_desc: "Teme lo Desconocido."
 house_erk_modifier: "Casa Erk"
 house_erk_modifier_desc: "Forjados en el duro aislamiento de Ergenekon, los Erk extraen riqueza de sus dominios con una eficiencia despiadada. Pero su naturaleza estoica y aislada los vuelve torpes en situaciones sociales."
 #house_wankuei_modifier: "House Wan Kuei"
 #house_wankuei_modifier_desc: "The [Glossary('Hungry Dead','game_concept_kuei_jin_desc')] of China are masters of a vast Empire, but they suffer from some serious limitations that the Western $pod_cainites$ could take advantage of."
 house_hollow_reeds_modifier: "Casa Cañas Huecas"
 house_hollow_reeds_modifier_desc: "Los Diez Mil Demonios deben vivir Diez Mil vidas antes de regresar como héroes del Cielo."
 house_eight_lotus_modifier: "Casa Ocho Lotos"
 house_eight_lotus_modifier_desc: "Xue mostró el camino; seguirlo al pie de la letra es el único camino hacia la redención."
 house_midnight_jewel_modifier: "Casa Joya de Medianoche"
 house_midnight_jewel_modifier_desc: "Aceptar que están muertos y son estáticos es la única forma en que los $pod_kueijin$ pueden aprender de sus errores pasados."
 house_hell_tigers_modifier: "Casa Tigres Infernales"
 house_hell_tigers_modifier_desc: "Los implacables Demonios acosarán al [Glossary('Emperador Demonio','podgloss.demonemperor')] en cada paso de su inevitable ascensión."
 house_inward_seekers_modifier: "Casa Buscadores Interiores"
 house_inward_seekers_modifier_desc: "Los Buscadores hallan su camino aislándose. Quizás por eso tienen tan pocos amigos."
 house_celestial_nails_modifier: "Casa Clavos Celestiales"
 house_celestial_nails_modifier_desc: "¿Están deliriando los autoproclamados hijos de una diosa agraviada, o simplemente son arrogantes?"
 house_cerulean_watchers_modifier: "Casa Vigilantes Cerúleos"
 house_cerulean_watchers_modifier_desc: "Comulgar con los temperamentales Kami puede reportar grandes beneficios... o grandes tormentos."
 house_emperor_vanguard_modifier: "Casa Vanguardia del Emperador"
 house_emperor_vanguard_modifier_desc: "El [Glossary('Emperador Demonio','podgloss.demonemperor')] necesitará peones para acelerar su ascensión. Si dichos peones son recompensados después es un asunto totalmente distinto."
 house_asuratizayya_modifier: "Casa Asuratizayya"
 house_asuratizayya_modifier_desc: "Tachados de herejes por los demás [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], los [Glossary('Asuratizayya','game_concept_kuei_jin_desc')] indios siguen aferrados a su Tradición y defienden a sus comunidades."
 house_crane_modifier: "Grullas Risueñas"
 house_crane_modifier_desc: "Los Herederos de la Madre aprenden más sobre cómo vivir de verdad tras su muerte de lo que jamás aprendieron antes de ella."
 house_jade_demons_modifier: "Demonios de Jade"
 house_jade_demons_modifier_desc: "Asentados sobre los depósitos más ricos del precioso mineral, los Demonios de Jade han hecho un arte de vender su preciado jade al mejor postor."
 house_wanderers_modifier: "Casa Tortugas de la Estepa"
 house_wanderers_modifier_desc: "Plagados de Akuma, los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] de las estepas viven con el tiempo prestado."
 house_uji_modifier: "Casa Uji"
 house_uji_modifier_desc: "Los tradicionalistas Grandes Clanes y los Grandes Maestros del Templo Nocturno, aliados a regañadientes."
 house_thunder_tiger_modifier: "Casa Tigres del Trueno"
 house_thunder_tiger_modifier_desc: "Centrados en comprender cómo la humanidad cambia el mundo, los Tigres del Trueno se mueven más rápido que otros $pod_kueijin$."
 house_wise_spider_modifier: "Casa Arañas Sabias"
 house_wise_spider_modifier_desc: "Cultivando su propia versión de la humanidad, las Arañas Sabias comprenden que los mortales desempeñarán un papel clave en la futura lucha contra el [Glossary('Emperador Demonio','podgloss.demonemperor')]."
 house_blooming_blossom_modifier: "Casa Flor en Ciernes"
 house_blooming_blossom_modifier_desc: "Una adhesión lenta y constante a la sabiduría del pasado ganará la guerra."
 house_six_springs_modifier: "Casa Seis Manantiales"
 house_six_springs_modifier_desc: "Todos pueden ganarse una oportunidad de redención, aunque no todos la aprovechen."
 house_yellow_moon_modifier: "Casa Luna Amarilla"
 house_yellow_moon_modifier_desc: "Si sigues los pasos de alguien, asegúrate primero de que no se perdió por el camino."
 house_inward_tempest_modifier: "Casa Tempestad Interior"
 house_inward_tempest_modifier_desc: "Si no puedes encontrar el camino de vuelta a Meru, asegúrate de que nadie más lo encuentre."
 house_tigers_meru_modifier: "Casa Tigres de Meru"
 house_tigers_meru_modifier_desc: "En la cima del mundo y tan cerca del origen, pero aun así tan lejos de la Iluminación." 
 house_proud_tigers_modifier: "Casa Tigres Orgullosos"
 house_proud_tigers_modifier_desc: "¿Por qué habría de ser infalible el Augusto Personaje? Nadie está por encima de ser cuestionado."
 house_scorching_devils_modifier: "Casa Demonios Abrasadores"
 house_scorching_devils_modifier_desc: "Todos y cada uno deben luchar para detener al [Glossary('Emperador Demonio','podgloss.demonemperor')]. Dispuestos o no."
 house_penangallan_modifier: "Casa Flores de Sangre"
 house_penangallan_modifier_desc: "La feminidad será exaltada en los restos sangrientos de sus enemigos."
 house_bishamon_modifier: "Casa Bishamon"
 house_bishamon_modifier_desc: "Los gobernantes del Japón nocturno no toleran la disidencia y tienen poca paciencia con las amenazas contra su gobierno."
 house_genji_modifier: "Casa Genji"
 house_genji_modifier_desc: "Los jóvenes y ricos advenedizos del Japón nocturno usarán cualquier medio con tal de llegar a la cima."
 house_iga_modifier: "Casa Iga"
 house_iga_modifier_desc: "Especializados en lidiar con amenazas mortales, los Iga son muy buenos en lo que hacen a pesar de su reducido número."
 house_koga_modifier: "Casa Koga"
 house_koga_modifier_desc: "Especializados en lidiar con amenazas sobrenaturales, los Koga son muy buenos en lo que hacen a pesar de su reducido número."
 house_sotogawa_modifier: "Casa Sotogawa No"
 house_sotogawa_modifier_desc: "Los «forasteros» de la política nocturna de Japón están orgullosos de su apodo. Se han ganado una tensa aceptación por las malas."
 house_nukekubi_modifier: "Casa Nukekubi"
 house_nukekubi_modifier_desc: "Danrin-no-Nukekubi es una de las grandes maestras del Shintai de Carne en Japón. Se crearon mitos enteros sobre ella."
 house_taira_modifier: "Casa Taira"
 house_taira_modifier_desc: "Los principales Uji conservadores son también los protectores del Emperador. Una posición prestigiosa, aunque meramente ceremonial."
 house_echizen_modifier: "Casa Echizen"
 house_echizen_modifier_desc: "Hechiceros de jade, artesanos, intermediarios con Corea, los Echizen tienen las manos metidas en muchos asuntos."
 house_chibo_modifier: "Casa Chibo"
 house_chibo_modifier_desc: "El linaje ocultista y sacerdotal de los Tzimisce de [Glossary('Mikaboshi','podgloss.mikaboshi')], los Chibo son las estrellas sangrientas de la magia."
 house_monomi_modifier: "Casa Monomi"
 house_monomi_modifier_desc: "Los guerreros de los Tzimisce de [Glossary('Mikaboshi','podgloss.mikaboshi')], los Monomi son las estrellas sangrientas de la espada."
 house_kishu_modifier: "Casa Kishu"
 house_kishu_modifier_desc: "Los asesinos de los Tzimisce de [Glossary('Mikaboshi','podgloss.mikaboshi')], los Kishu son las estrellas sangrientas de la daga."
 house_kizoku_modifier: "Casa Kizoku"
 house_kizoku_modifier_desc: "Nacidos de un narrador y atormentados por pesadillas, los Kizoku son los Vástagos de las Grietas."
 house_bushi_modifier: "Casa Bushi"
 house_bushi_modifier_desc: "Afirmando ser los hijos bañados en sangre del Dios de la Tormenta de los Amatsukami, los Bushi son guerreros obstinados sin parangón."

 house_bishamon_improved_modifier: "Casa Bishamon Dominante"
 house_bishamon_improved_modifier_desc: "Los gobernantes del Japón nocturno no toleran la disidencia y tienen poca paciencia con las amenazas contra su gobierno."
 house_genji_improved_modifier: "Casa Genji Dominante"
 house_genji_improved_modifier_desc: "Los jóvenes y ricos advenedizos del Japón nocturno usarán cualquier medio con tal de llegar a la cima."
 house_iga_improved_modifier: "Casa Iga Dominante"
 house_iga_improved_modifier_desc: "Especializados en lidiar con amenazas mortales, los Iga son muy buenos en lo que hacen a pesar de su reducido número."
 house_koga_improved_modifier: "Casa Koga Dominante"
 house_koga_improved_modifier_desc: "Especializados en lidiar con amenazas sobrenaturales, los Koga son muy buenos en lo que hacen a pesar de su reducido número."
 house_sotogawa_improved_modifier: "Casa Sotogawa No Dominante"
 house_sotogawa_improved_modifier_desc: "Los «forasteros» de la política nocturna de Japón están orgullosos de su apodo. Se han ganado una tensa aceptación por las malas."
 house_nukekubi_improved_modifier: "Casa Nukekubi Dominante"
 house_nukekubi_improved_modifier_desc: "Danrin-no-Nukekubi es una de las grandes maestras del Shintai de Carne en Japón. Se crearon mitos enteros sobre ella."
 house_taira_improved_modifier: "Casa Taira Dominante"
 house_taira_improved_modifier_desc: "Los principales Uji conservadores son también los protectores del Emperador. Una posición prestigiosa, aunque meramente ceremonial."
 house_echizen_improved_modifier: "Casa Echizen Dominante"
 house_echizen_improved_modifier_desc: "Hechiceros de jade, artesanos, intermediarios con Corea, los Echizen tienen las manos metidas en muchos asuntos."
 house_chibo_improved_modifier: "Casa Chibo Dominante"
 house_chibo_improved_modifier_desc: "El linaje ocultista y sacerdotal de los Tzimisce de [Glossary('Mikaboshi','podgloss.mikaboshi')], los Chibo son las estrellas sangrientas de la magia."
 house_monomi_improved_modifier: "Casa Monomi Dominante"
 house_monomi_improved_modifier_desc: "Los guerreros de los Tzimisce de [Glossary('Mikaboshi','podgloss.mikaboshi')], los Monomi son las estrellas sangrientas de la espada."
 house_kishu_improved_modifier: "Casa Kishu Dominante"
 house_kishu_improved_modifier_desc: "Los asesinos de los Tzimisce de [Glossary('Mikaboshi','podgloss.mikaboshi')], los Kishu son las estrellas sangrientas de la daga."
 house_kizoku_improved_modifier: "Casa Kizoku Dominante"
 house_kizoku_improved_modifier_desc: "Nacidos de un narrador y atormentados por pesadillas, los Kizoku son los Vástagos de las Grietas."
 house_bushi_improved_modifier: "Casa Bushi Dominante"
 house_bushi_improved_modifier_desc: "Afirmando ser los hijos bañados en sangre del Dios de la Tormenta de los Amatsukami, los Bushi son guerreros obstinados sin parangón."
 japanese_uji_improved_modifier: "Uji Dominante"
 japanese_uji_improved_modifier_desc: "Este Uji ha alcanzado la preeminencia sobre sus competidores en la política nocturna de Japón."

 house_kuntilanak_modifier: "Casa Kuntilanak"
 house_kuntilanak_modifier_desc: "La maldición del aislamiento manifestada como estar atrapados entre los mundos de los vivos y los muertos, los Kuntilanak son necrománticos espectrales."
 house_sangun_modifier: "Casa Sangun"
 house_sangun_modifier_desc: "Los señores de las montañas de Corea, los Sangun son soberanos que adoptan formas bestiales."
 house_anh_modifier: "Casa Anh"
 house_anh_modifier_desc: "Divergentes de los Gangrel pero distintos de los Marineros, los Anh son los acechadores ocultos de los océanos alrededor de Indonesia, Indochina y Malasia."
 house_banpaia_modifier: "Casa Banpaia"
 house_banpaia_modifier_desc: "La progenie de una expedición perdida de Tremere hacia Oriente, los Banpaia se han convertido en una nueva presencia en el mundo nocturno de Asia Oriental."
 house_nyayo_modifier: "Casa Nyayo"
 house_nyayo_modifier_desc: "Caitiff originarios de África, los Nyayo buscan unir a los Laibon contra las interferencias externas."
 dynn_bima_modifier: "Bima"
 dynn_bima_modifier_disc: "El linaje de Aparecidos creado por Zhenga, los Bima tienen una sangre extremadamente maleable y caótica."
                  
 dynn_nagaraja_modifier: "Nagaraja"
 dynn_nagaraja_modifier_desc: "La aborrecible maldición de los Nagaraja los convierte en un grupo repudiado, pero también resiliente."
 dynn_unbound_modifier: "Desvinculados"
 dynn_unbound_modifier_desc: "El mero rumor de la existencia de tales $pod_cainites$ y su linaje es una amenaza para el orden establecido."
 dynn_kiasyd_modifier: "Kiasyd"
 dynn_kiasyd_modifier_desc: "Los reclusivos y misteriosos Kiasyd trabajan afanosamente en sus laboratorios alquímicos, ajenos a las amenazas que crecen a su alrededor."
 dynn_impundulu_modifier: "Impundulu"
 dynn_impundulu_modifier_desc: "Los Impundulu buscan una laguna legal en un contrato firmado hace mucho tiempo que lentamente los está llevando a su perdición."
 house_ahrimane_modifier: "Ahriman"
 house_ahrimane_modifier_desc: "Adisa nunca se doblegó ni se echó atrás en una pelea. Sus hijas tampoco lo harán; al fin y al cabo, Freya está observando."
 house_feroux_modifier: "Feroux"
 house_feroux_modifier_desc: "Los llamados Gangrel Griegos son un linaje orgulloso, habiendo sido una de las principales fuerzas tras el Sueño de Constantinopla. Su pérdida pesa mucho en sus almas."
 house_siren_modifier: "Hijas de la Cacofonía"
 house_siren_modifier_desc: "Cantan para mí, las sirenas de los siete mares..."
 dynn_knightsofacre_modifier: "Caballeros de Acre"
 dynn_knightsofacre_modifier_desc: "Los Caballeros son ciertamente feroces en la batalla, pero desdeñan las formas más sutiles de frustrar los planes del Enemigo."
 dynn_swordofstjames_modifier: "Espada de Santiago"
 dynn_swordofstjames_modifier_desc: "Seamos honestos, los seguidores de Rodrigo son unos idiotas arrogantes. ¡Pero también son unos idiotas arrogantes duros como el acero!"
 dynn_redorder_modifier: "Orden Roja"
 dynn_redorder_modifier_desc: "Conocen terribles secretos sobre los horrores de lo desconocido. Pero tanto tiempo en las bibliotecas también los ha vuelto bastante... vulnerables ante tácticas más pragmáticas."
 dynn_sistersjohn_modifier: "Hermanas de San Juan"
 dynn_sistersjohn_modifier_desc: "Atormentadas por terribles visiones de fatalidad, las Hermanas han desarrollado un sentido administrativo muy robusto para anclar su terrible existencia."
 dynn_oculidei_modifier: "Oculi Dei"
 dynn_oculidei_modifier_desc: "Los paranoicos miembros de los Ojos de Dios a menudo tienen razón en sus temores. Pero eso no hace que caigan mejor a sus compañeros."
 dynn_murnau_modifier: "Von Murnau"
 dynn_murnau_modifier_desc: "La orgullosa Casa alemana está acostumbrada a lidiar con campesinos que evaden impuestos. Al fin y al cabo, el temor de Dios no es solo para la progenie del Infierno."
 dynn_gantenbein_modifier: "Gantenbein"
 dynn_gantenbein_modifier_desc: "Los celosos hermanos bogomilistas tienen enormes dificultades para reconciliar su honesta fe con su necesidad de sangre de vampiro. Ese hecho los aleja de su propio rebaño."
 house_obertus_modifier: "Obertus"
 house_obertus_modifier_desc: "La caída de Constantinopla pesa mucho sobre la diligente Orden Obertus. Pero aun así trabajan incansablemente para desvelar los secretos más profundos de lo divino."
 house_grimaldi_modifier: "Grimaldi"
 house_grimaldi_modifier_desc: "Los más humanos de los [Glossary('Aparecidos','game_concept_revenant_desc')] son el vínculo entre el $pod_clan$ Tzimisce y el mundo mortal. Diplomáticos y comerciantes con talento, no obstante son despreciados por las familias más guerreras."
 house_bratovitch_modifier: "Bratovitch"
 house_bratovitch_modifier_desc: "Monstruos brutales que normalmente sirven a los Tzimisce, los Bratovitch son luchadores y rastreadores, y rara vez participan en eventos sociales refinados."
 house_szantovich_modifier: "Szantovich"
 house_szantovich_modifier_desc: "Los Szantovich son mariposas sociales decadentes, adineradas y hedonistas. Estimulan sus sentidos en busca del placer y juegan con los humanos con temeraria despreocupación. Probablemente sean los [Glossary('Aparecidos','game_concept_revenant_desc')] que menos control tienen sobre sí mismos."
 house_vlaszy_modifier: "Vlaszy"
 house_vlaszy_modifier_desc: "Todo Vlaszy es entrenado en equitación, estadismo, artes de la guerra y otras habilidades cortesanas desde una edad temprana, y muchos Tzimisce Antiguos los prefieren como sus campeones y mensajeros."
 house_basarab_modifier: "Basarab"
 house_basarab_modifier_desc: "Renombrados por su Destreza en la batalla y su liderazgo, son activos valiosos para los Tzimisce. El linaje Basarab crece cada noche, lo que empieza a inquietar a algunos de sus amos respecto a la fuerza de sus «mascotas»..."
 house_premysl_modifier: "Premysl"
 house_premysl_modifier_desc: "Descendientes de un linaje real de Bohemia, los Premysl son señores crueles y mezquinos con sus inferiores, pero fanáticamente devotos a sus amos Tzimisce."
 house_danislav_modifier: "Danislav"
 house_danislav_modifier_desc: "Originalmente una dinastía noble con lazos a los Señores de la Sombra, los Danislav del norte de Transilvania cayeron bajo el dominio del Tzimisce Florescu, que los mantuvo en sus mazmorras durante los primeros diez años de su vida y los condicionó a servirle."
 house_khazi_modifier: "Khazi"
 house_khazi_modifier_desc: "Este extraño y reclusivo linaje solo sirve al Matusalén Byelobog, y es considerado marginado y anómalo incluso según los estándares Tzimisce."
 dynn_ducheski_modifier: "Ducheski"
 dynn_ducheski_modifier_desc: "Una familia antes llamada Krevcheski y propiedad de los Tzimisce. Ahora sirve a los Tremere y es conocida por su habilidad con la magia y la fabricación de dispositivos mecánicos, particularmente instrumentos de tortura. Muchos Tremere hacen que los Ducheski mantengan sus bibliotecas y laboratorios."
 house_oprichniki_modifier: "Oprichniki"
 house_oprichniki_modifier_desc: "La policía secreta de Iván el Terrible apenas sobrevivió al reinado de su amo. Los supervivientes fueron adoptados por los Tzimisce rusos y criados como una familia de [Glossary('Aparecido','game_concept_revenant_desc')], a pesar de no haber puesto nunca un pie en el maldito suelo de Transilvania."
 house_narov_modifier: "Narov"
 house_narov_modifier_desc: "Los arrogantes Narov son despreciados por la mayoría de las demás familias, pero su lujoso Estilo de vida sigue siendo la envidia de muchos."
 house_rustovitchi_modifier: "Rustovitchi"
 house_rustovitchi_modifier_desc: "Arrojados a una guerra que no quieren luchar, los Rustovitchi no tienen más opción que vencer o morir."
 house_ruthvenski_modifier: "Ruthvenski"
 house_ruthvenski_modifier_desc: "Los Ruthvenski son un linaje agotado, aferrado a su antigua fama. Su habilidad para gobernar sigue tan afilada como siempre, pero a nadie le importa ya obedecerlos."
 house_slatikov_modifier: "Slatikov"
 house_slatikov_modifier_desc: "Peones de Razkoljna, el Tzimisce de Cracovia, los Slatikov son una pequeña familia de eruditos y hombres letrados, apenas interesados en el gran juego del Jyhad." 
 dynn_enrathi_modifier: "Enrathi"
 dynn_enrathi_modifier_desc: "Los Enrathi son esclavistas y siempre lo han sido. A pesar de los tiempos cambiantes, siempre hay gente buscando sus servicios... y siempre la habrá."
 dynn_marijava_modifier: "Marijava"
 dynn_marijava_modifier_desc: "Los espías y asesinos del Tal'mahe'Ra son dedicados, incluso obstinados, en su arte elegido."
 dynn_rafastio_modifier: "Rafastio"
 dynn_rafastio_modifier_desc: "Los seductores Rafastio están vagamente asociados con el Tal'mahe'Ra, donde sirven tanto de videntes como de mariposas sociales."
 dynn_dhabi_modifier: "D'habi"
 dynn_dhabi_modifier_desc: "Los D'habi, de voluntad débil, han quedado mentalmente destrozados tras siglos de maltrato a manos de sus amos Baali."
 dynn_keskinen_modifier: "Keskinen"
 dynn_keskinen_modifier_desc: "Los Keskinen son una familia diminuta y muy unida que sirve al Matusalén demente llamado Louhi. Practican magias antiguas, en su mayoría olvidadas, alimentadas en parte por su sangre retorcida y las Tradiciones transmitidas a lo largo de muchos años."
 dynn_rosselini_modifier: "Rosselini"
 dynn_rosselini_modifier_desc: "Los desquiciados Rosselini son una familia de Nigromantes que se cruzó demasiadas veces en el camino de los Giovanni. Ahora sirven a su antiguo enemigo, de buen grado o no."
 dynn_rawan_modifier: "Rawan"
 dynn_rawan_modifier_desc: "Los pescadores que sirven a la excéntrica Anushin-Rawan son criados con un único propósito: ser absolutamente fieles a su Dama."
 dynn_kairouan_modifier: "Hermandad de Kairouan"
 dynn_kairouan_modifier_desc: "Una familia creada mediante experimentos de Hechiceros Assamitas con [Glossary('Aparecidos','game_concept_revenant_desc')] Tzimisce; la Hermandad de Kairouan está dispersa por el mundo, con las tres Castas luchando por decidir cómo aprovechar mejor a los pocos que quedan."
 dynn_dimitriou_modifier: "Dimitriou"
 dynn_dimitriou_modifier_desc: "Prias ya ha matado a hombres, monstruos y dioses para proteger a su Dama. Volverá a hacerlo sin dudarlo un instante."
 dynn_nirriti_modifier: "Nirriti"
 dynn_nirriti_modifier_desc: "Los defensores del Señorío de la Muerte son un grupo inquebrantable, y un enemigo temible para cualquier hereje que se cruce en su camino."
 dynn_crassus_modifier: "Crassus"
 dynn_crassus_modifier_desc: "Un experimento demente nacido en tiempos romanos, la familia Crassus está maldita con los peores excesos de la era imperial."
 dynn_gravenor_modifier: "Gravenor"
 dynn_gravenor_modifier_desc: "Los paranoicos Gravenor permanecen bien ocultos de la vista, sirviendo a sus amos Nosferatu mientras les quede algo de cordura."
 dynn_angustri_modifier: "Angustri"
 dynn_angustri_modifier_desc: "Los infrecuentes Angustri son célebres por su astucia y hacen buen uso de sus habilidades en beneficio de sus patrones Ravnos."
 dynn_kurulas_modifier: "Kurulas"
 dynn_kurulas_modifier_desc: "La tribu de la consorte de Gengis Kan es apreciada entre la Horda [Glossary('Anda','podgloss.anda')]. Se les preserva cuidadosamente como un prestigioso vínculo con su glorioso pasado."
 dynn_qarnaim_modifier: "Qarnaim"
 dynn_qarnaim_modifier_desc: "Cartago fue el pináculo de la relación entre humanos y $pod_cainite$. Los Qarnaim luchan por hacer realidad de nuevo la historia de sus orígenes."
 dynn_bomkazi_modifier: "Bomkazi"
 dynn_bomkazi_modifier_desc: "Fieles a sus compañeros Impundulu, las brujas Bomkazi se muestran cautelosas ante la lenta dilución de su sangre."
 dynn_societyofstgeorge_modifier: "Sociedad de San Jorge"
 dynn_societyofstgeorge_modifier_desc: "Nadie puede lanzar una carga frontal devastadora a campo abierto como los Caballeros de San Jorge, pero su preferencia por esta táctica roza la insensata arrogancia."
 dynn_orderofstjoan_modifier: "Orden de Santa Juana"
 dynn_orderofstjoan_modifier_desc: "Los ferozmente independientes seguidores de Juana luchan contra el mal a su manera, le guste o no a la Iglesia."
 house_faust_modifier: "Faust"
 houst_faust_modifier_desc: "Zethraeus llevó a cabo varios experimentos amorales y pactos con poderes infernales en su búsqueda de un conocimiento mayor."
 dynn_custom_bloodline_war_modifier: "Línea de Sangre de Guerreros"
 dynn_custom_bloodline_war_modifier_desc: "Esta Línea de Sangre vive para la conquista; la mayoría de los Vástagos los ven como belicistas."
 dynn_custom_bloodline_prowess_modifier: "Línea de Sangre de Asesinos"
 dynn_custom_bloodline_prowess_modifier_desc: "Esta Línea de Sangre está formada por asesinos letales. Eso no les da popularidad entre los Vástagos, pero casi todos les tienen miedo."
 dynn_custom_bloodline_intrigue_modifier: "Línea de Sangre de Conspiradores"
 dynn_custom_bloodline_intrigue_modifier_desc: "Los miembros de esta Línea de Sangre se encuentran entre los conspiradores más letales del mundo $pod_cainite$."
 dynn_custom_bloodline_diplomacy_modifier: "Línea de Sangre de Diplomáticos"
 dynn_custom_bloodline_diplomacy_modifier_desc: "Los miembros de esta Línea de Sangre están convencidos de que se pueden lograr grandes cosas siendo educado... cuando pueden beneficiarse de ello."
 dynn_custom_bloodline_learning_modifier: "Línea de Sangre de Buscadores"
 dynn_custom_bloodline_learning_modifier_desc: "Los miembros de esta Línea de Sangre buscan respuestas. Creen que el conocimiento es mucho más importante que las Conjuras políticas y las guerras."
 dynn_custom_bloodline_stewardship_modifier: "Línea de Sangre de Gobernantes"
 dynn_custom_bloodline_stewardship_modifier_desc: "Los miembros de esta Línea de Sangre buscan dominar a los demás. No por orgullo, sino porque saben gobernar."
 dynn_custom_bloodline_secret_modifier: "Sangre Pura"
 dynn_custom_bloodline_secret_modifier_desc: "Los miembros de esta Línea de Sangre creen ser los verdaderos descendientes de Caín. A sus ojos, cualquier otro $pod_cainite$ no es más que una simple sanguijuela sin derecho a la sangre de Caín."
 house_mancheaka_modifier: "Casa Mancheaka"
 house_mancheaka_modifier_desc: "Tal como hizo su fundador hace mucho tiempo, los miembros de este linaje tienden a lanzarse de cabeza al peligro, lo que los convierte en presa fácil de manipuladores hábiles."
 house_caias_modifier: "Casa Koine"
 house_caias_modifier_desc: "Caias Koine luchó para proteger el honor de su [Glossary('Sire','game_concept_Sire_desc')], solo para caer abatido por la más vil de las hechicerías."
 house_nebmaatsutekh_modifier: "Casa Nebmaatsutekh"
 house_nebmaatsutekh_modifier_desc: "La madre de los milagros es la prueba no-viviente de la deuda de Ra con Set."
 house_nephtys_modifier: "Casa Nephtys"
 house_nephtys_modifier_desc: "Nació del engaño, y murió a causa de él."
 house_wadjet_modifier: "Casa Wadjet"
 house_wadjet_modifier_desc: "Una vez seducida por Set, Wadjet se liberó y luchó valientemente para proteger a otros de él."
 house_gilgamesh_modifier: "Casa Gilgamesh"
 house_gilgamesh_modifier_desc: "El poeta compuso muchas canciones sobre él, pero no la de su muerte."
 house_enkidu_modifier: "Casa Enkidu"
 house_enkidu_modifier_desc: "Encomendado con la más importante de las tareas, Enkidu nunca flaqueará."
 house_amarantha_modifier: "Casa Amarantha"
 house_amarantha_modifier_desc: "La primera destruida aún pervive, un legado de dolor y odio."
 house_amphion_modifier: "Casa Amphion"
 house_amphion_modifier_desc: "Amphion encantó a la propia Arikel con su música armoniosa y sosegadora."
 house_tammuz_modifier: "Casa Tammuz"
 house_tammuz_modifier_desc: "El protector y amante del sacrificio de Arikel imbuyó a su linaje con un sentido de deber ominoso."
 house_ereshkigal_modifier: "Casa Ereshkigal"
 house_ereshkigal_modifier_desc: "La misteriosa y reclusiva hechicera tiene sus propios planes finales, lejos de las preocupaciones de los demás Gangrel."
 house_cyscek_modifier: "Casa Cyscek"
 house_cyscek_modifier_desc: "Contra sus monstruosos parientes, Cyscek no dudará en hacer el sacrificio definitivo."
 house_gallod_modifier: "Casa Gallod"
 house_gallod_modifier_desc: "Víctimas de los horrores del Anciano, el linaje de Gallod está escrito con sangre."
 house_ionache_modifier: "Casa Ionache"
 house_ionache_modifier_desc: "El primer Voivoda hace mucho que fue olvidado. Pero su linaje recuerda su gloria perdida."
 house_toomler_modifier: "Casa Toomler"
 house_toomler_modifier_desc: "Maestro de la Vicisitud, Toomler fue incapaz de ver los peligros mucho más mundanos. Aún sirve al $pod_clan$ hasta esta noche, bajo otra forma."
 house_melachoate_modifier: "Casa Melachoate"
 house_melachoate_modifier_desc: "El Nictuku rebelde juega a dos bandas, asegurándose cuidadosamente de que ninguna de las dos lo sospeche."
 house_petrodon_modifier: "Casa Petrodon"
 house_petrodon_modifier_desc: "Un celo fanático impulsa a Petrodon siempre hacia adelante, haciendo que sus enemigos susurren su nombre con Temor."
 house_carna_modifier: "Casa Carna"
 house_carna_modifier_desc: "Un alma perdida en busca de propósito podría ser la mayor amenaza para la Pirámide Tremere."
 house_dracula_modifier: "Casa Drácula"
 house_dracula_modifier_desc: "El legado de Temor y terror de este será algún día el legado de todos los vampiros."
 house_valerius_modifier: "Casa Valerius"
 house_valerius_modifier_desc: "Nadie respeta al leal teniente hasta el mismísimo momento en que deja de ser leal."
 house_giangaleazzo_modifier: "Casa Giangaleazzo"
 house_giangaleazzo_modifier_desc: "El Verdadero Príncipe sabe cuándo revisar su lealtad actual."
 house_cardona_modifier: "Casa Cardona"
 house_cardona_modifier_desc: "Un verdadero Patriarca protege incluso al miembro más humilde de su familia."
 house_rosselini_modifier: "Casa Rosselini"
 house_rosselini_modifier_desc: "Al conocimiento no le importan los límites morales."
 dynn_mamluk_modifier: "Casa Mameluco Caitiff"
 dynn_mamluk_modifier_desc: "Objeto de prejuicios por su linaje Caitiff, los vástagos de Mukhtar Bey han demostrado una y otra vez sus habilidades administrativas de todos modos."
 house_cecilia_modifier: "Casa Cecilia"
 houst_cecilia_modifier_desc: ""         
 house_etheyra_modifier: "Casa Etheyra"
 house_etheyra_modifier_desc: "Al traicionar a todos y todo, prepárate para que muy pocos confíen en ti al final."   
 custom_lay_order_modifier: "Familia Iniciada"
 custom_lay_order_modifier_desc: "Una noble casa de laicos jurados para ayudar a la causa."
 custom_knightly_order_modifier: "Orden de Caballería"
 custom_knightly_order_modifier_desc: "Una sociedad de guerreros vinculados por el Sacramento de las Órdenes Sagradas."
 custom_mendicant_order_modifier: "Orden Mendicante"
 custom_mendicant_order_modifier_desc: "Una sociedad religiosa jurada a vivir entre la gente común y ayudarla."
 custom_contemplative_order_modifier: "Orden Contemplativa"
 custom_contemplative_order_modifier_desc: "Una comunidad de fieles recluidos de los asuntos del mundo para centrarse en la oración."          
 house_dankovsky_modifier: "Casa Dankovsky"
 house_dankovsky_modifier_desc: "Nigromantes excesivamente cautelosos de las estepas, estaban condenados a la desconfianza eterna de la Familia, tras su forzoso Abrazo fuera de ella."
         
 dynn_horus_modifier: "Shemsu-Heru"   
 dynn_horus_modifier_desc: "Los Shemsu-Heru fueron la primera Dinastía, las verdaderas Imperecederas creadas por y para los Dioses para librar una guerra santa contra $glossary_wyrm_apophis$." 
 dynn_ishmaelites_modifier: "Ismaelitas"   
 dynn_ishmaelites_modifier_desc: "Los tránsfugas de los Ismaelitas, la segunda dinastía, creada por un deseo de libertad y autodeterminación."   
 dynn_apepnu_modifier: "Apepnu"   
 dynn_apepnu_modifier_desc: "La tercera dinastía son los malditos Apepnu, siervos de $glossary_wyrm_apophis$ alzados mediante el rito Bane del enemigo Set."  
 dynn_cabiri_modifier: "Cabiri"   
 dynn_cabiri_modifier_desc: "Los bastardos ladrones de la inmortalidad, la cuarta Dinastía de los Cabiri, odiados y envidiados a partes iguales."     
 dynn_wufeng_modifier: "Wu Feng"   
 dynn_wufeng_modifier_desc: "Los Wu Feng tienen aspecto Yang y son siervos de la Reina Escarlata."
 dynn_xianlung_modifier: "Xian Lung"   
 dynn_xianlung_modifier_desc: "Los Xian Lung tienen aspecto Yin y son siervos del Dragón de Ébano."
 
 dynn_asharu_modifier: "Asharu"   
 dynn_asharu_modifier_desc: "Los Asharu son antiguos ángeles guardianes que fueron desterrados al [UmbraGlossary('abyss')]."
 dynn_rabisu_modifier: "Rabisu"
 dynn_rabisu_modifier_desc: "Los Rabisu son Demonios que en su día estuvieron a cargo de proteger y enriquecer la naturaleza mientras la ponían a disposición de la humanidad."
 dynn_halaku_modifier: "Halaku"
 dynn_halaku_modifier_desc: "Los Halaku fueron los Elohim que sirvieron como portadores de la muerte para hacer sitio a más vida."
 dynn_namaru_modifier: "Namaru"
 dynn_namaru_modifier_desc: "Los Namaru son la primera Casa y sirvieron como heraldos de Dios antes de la Caída."
 dynn_lammasu_modifier: "Lammasu"
 dynn_lammasu_modifier_desc: "Los Lammasu son los antiguos ángeles de Dios que inspiraban y buscaban la verdad, la belleza y el poder interior."
 dynn_annunaki_modifier: "Annunaki"
 dynn_annunaki_modifier_desc: "Los Annunaki son los antiguos moldeadores y usuarios de la Tierra, condenados al [UmbraGlossary('abyss')] por Dios."
 dynn_neberu_modifier: "Neberu"
 dynn_neberu_modifier_desc: "Los Neberu son quienes mantuvieron las obras de Dios, trabajando como consejeros y videntes antes de la Caída."
 
 dynn_beaumayn_modifier: "Beaumayn"
 dynn_beaumayn_modifier_desc: "Hoy juro Lealtad al Libro y la Espada, al futuro que es mi destino, al presente que es mi deber y al pasado que es mi tesoro. Juro Lealtad a los miembros y objetivos de la Casa Beaumayn, y que los sueños de los condenados atormenten mi mente si alguna vez rompo esta confianza. Igual que la estrella oscura arde en lo alto, así arde mi corazón a tu servicio."
 dynn_dougal_modifier: "Dougal"
 dynn_dougal_modifier_desc: "Mi corazón es el corazón de Dougal. Mi brazo empuñará su martillo. Mi cuerpo cargará con su fardo. Mi corazón adoptará su voluntad. Trabajaré hasta el final de mis días, haciendo su labor."
 dynn_eiluned_modifier: "Eiluned"
 dynn_eiluned_modifier_desc: "Hoy prometo mi Lealtad al Negro y la Plata, a través de mi Señor. Concederé a mis superiores el respeto que se han ganado y trabajaré para guiar a los más jóvenes que yo hacia el camino de la comprensión y la sabiduría. Cada día me esforzaré por aprender más del mundo y de mi propio corazón, para enriquecer mejor tanto a Eiluned como a mí mismo. Sobre todo, me comprometo con la Casa Eiluned como Vasallo, y espero poder servir con honor y distinción."
 dynn_fiona_modifier: "Fiona"
 dynn_fiona_modifier_desc: "Mi Dama/Señor, a vos entrego todo el afecto y la calidez de mi corazón, para que os alivien a lo largo de las millas y los años venideros. Seré vuestro amigo, vuestro Compañero y vuestra pareja según deseéis. En las horas de desolación os haré compañía, y en el campo de batalla portaré vuestro emblema con orgullo y honor. Jamás estaréis solo; jamás vuestras lágrimas quedarán sin el consuelo de mi mano. Antes de que mi vínculo se rompa, mis lomos no volverán a hallar placer; mi corazón no volverá a hallar gozo en el placer carnal. ¡Que los dientes del león plateado de Fiona me despedacen si traiciono vuestra confianza!"
 dynn_gwydion_modifier: "Gwydion"
 dynn_gwydion_modifier_desc: "Señores y Damas del Halcón, os juro fidelidad a vosotros y a la noble Casa de Gwydion, desde este día hasta que el sol deje de arder. Nunca dejaré de defender a mis protegidos, ni el honor de mis hermanos y hermanas. Seré gracioso en la paz e inquebrantable en la batalla, y traeré honor a la Casa de Gwydion con mis hazañas. En el nombre del Señor Gwydion el Gris y la Dama Keredwyn, lo juro."
 dynn_liam_modifier: "Liam"
 dynn_liam_modifier_desc: "Que la luz del Sol queme mi piel,\nQue la luz de la Luna me traiga temor,\nQue el alimento de la Tierra me traiga Ansia,\nQue las aguas de la Vida resequen mi garganta\nSi abandono la brújula de mi Viaje,\nSi descuido el cuidado del [UmbraGlossary('dreaming')],\nSi soy ciego a las necesidades de mis protegidos,\nSi ignoro la pureza de mi deber."
 dynn_aesin_modifier: "Aesin"
 dynn_aesin_modifier_desc: "Mi alma eterna reposa ahora con la Casa Aesin. Juro por los bosques y las montañas de mi hogar que respetaré las Tradiciones y costumbres de la Casa Aesin. Sabiendo que alcanzo la seguridad, busco refugio bajo las alas del búho. Si mi juramento se rompe, que el [UmbraGlossary('dreaming')] me despoje de todos mis privilegios y nunca me deje olvidar quién fui y en qué me he convertido."
 dynn_ailil_modifier: "Ailil"
 dynn_ailil_modifier_desc: "Por las escamas del dragón plateado, por la luz de las cuatro estrellas, por el manto de la noche más oscura, entrego mi cuerpo, mi corazón y mi voluntad a la custodia de la Casa Ailil. Que sus metas guíen mi visión, sus esperanzas dirijan mis aspiraciones, y su propósito inspire mis acciones. Que todas mis ambiciones se desmoronen en el polvo si traiciono las palabras que he pronunciado esta noche. Dragón a mi lado, estrellas sobre mí, noche a mi espalda, sed testigos de mi juramento."
 dynn_balor_modifier: "Balor"
 dynn_balor_modifier_desc: "Por la serpiente que se enrosca alrededor de la torre dorada, por el rayo carmesí que emana del Ojo de Balor, por la sangre que corre como fuego por mis venas, entrego mi corazón, mi mente y mi cuerpo a la voluntad de la Casa Balor. Que el desafío que marca mi cuerpo como diferente de todos los demás sirva de recordatorio constante de mi nacimiento y mi destino. Que sufra la agonía de mil llamas si traiciono a mi casa. Esto lo juro, por la sangre y el ojo, ante el propio [UmbraGlossary('dreaming')]."
 dynn_daireann_modifier: "Daireann"
 dynn_daireann_modifier_desc: "Hermanos y Hermanas, por el filo de la espada y el lazo de sangre, juro la fuerza de mis brazos y el valor de mi corazón para defenderos a vosotros y nuestra causa del poder de nuestros enemigos. Nunca estaréis solos en el campo de batalla mientras me quede aliento en el cuerpo. Si rompo mi juramento, que una lluvia de dagas de hierro atraviese mi pecho y envíe mi alma para siempre a la oscuridad."
 dynn_leanhaun_modifier: "Leanhaun"
 dynn_leanhaun_modifier_desc: "Por los elementos y la esencia de los Sueños, declaro ante testigos que estoy dispuesto a asumir mis deberes dentro de la Casa Leanhaun. Permaneceré fiel a mi casa, guardando sus secretos, asistiendo a todos mis compañeros y protegiendo sus tesoros. Si fallo en cualquiera de mis deberes, o si traiciono a mi casa, que mi nombre sea borrado de las crónicas y eliminado de las mentes de los Soñadores. Que mi historia quede inconclusa, mi propósito incumplido, y mi esencia dispersada por los vientos. Que ningún Kithain recuerde que alguna vez existió alguien como yo."
 dynn_varich_modifier: "Varich"
 dynn_varich_modifier_desc: "Un patrón comencé, y ahora lo termino para empezar de nuevo en el nombre de Varich, fundador de la casa que hago mía. Que jamás deje los hilos de un patrón sin leer. Que jamás deje un desafío sin respuesta. Que jamás haga un voto de amor verdadero a otro. Doy honor a la Casa Varich y la sirvo con mi mente, mi corazón y mis actos. Si reniego de mi juramento, que todas las manos de mi casa se alcen contra mí y que el latido de mi corazón caiga en el silencio para siempre."
 dynn_danaan_modifier: "Danaan"
 dynn_danaan_modifier_desc: "Por cada estrella en el cielo, hay un camino por recorrer. Por cada sueño en la noche, hay un Viaje esperando. Juro por las estrellas de arriba y los sueños de dentro servir a la Casa Danaan, proteger los senderos del [UmbraGlossary('dreaming')] y abrir nuevas rutas donde no existe ninguna. Protegeré a los viajeros, guiaré a los Soñadores, y seguiré adelante hasta que no queden Caminos que seguir. Esto lo juro, y que el dragón me devore en mis sueños si no cumplo mi promesa."
 dynn_scathach_modifier: "Scathach"
 dynn_scathach_modifier_desc: "Hoy hago un voto de sangre y acero, y entrego mi vida a la Casa Scathach. Escucharé las palabras de los oráculos, y no comprometeré mi hoja con ninguna causa que invite al deshonor. Cuidaré mi propio acero, guardaré mi propio consejo, y recorreré mi propio camino hasta el día en que no proyecte sombra. Así lo juro, por la luna brillante y la hoja ensangrentada. Y así comienza mi largo andar."

 POD_unity_impassive_tax_modifier: "Administración Mejorada"
 POD_unity_impassive_tax_modifier_desc: "Los miembros de esta casa disfrutan de una mayor eficiencia en su administración."

 POD_aspiration_legacy_5_modifier: "Sangre en Evolución"
 
