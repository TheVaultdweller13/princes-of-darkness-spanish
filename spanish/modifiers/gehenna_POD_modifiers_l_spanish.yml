l_spanish:
 POD_izhim_ur_baal_curse_modifier: "Maldición Baali: Plena Fuerza"
 POD_izhim_ur_baal_curse_modifier_desc: "Los Banu Haqim ansían la sangre de otros vampiros y les cuesta resistirse. Una última burla de sus enemigos derrotados en las Guerras Baali."
 POD_county_great_fire_modifier: "Quemado por un Gran Incendio"
 POD_county_great_flood_modifier: "Ahogado por una Gran Inundación"
 POD_county_great_sacking_modifier: "Destruido por un Gran Saqueo"
 POD_county_great_famine_modifier: "Gran Hambruna"
 POD_county_great_earthquake_modifier: "Asolado por un Gran Terremoto"
 POD_baali_curse_normal_modifier: "Maldición Baali: Adaptación"
 POD_baali_curse_normal_modifier_desc: "Los Banu Haqim se han adaptado a la Maldición Baali que les hace ansiar la sangre. Aunque sigue siendo un estorbo, ahora está mayormente bajo control."
 POD_baali_curse_jamal_modifier: "Maldición Baali: Escudo de Fe"
 POD_baali_curse_jamal_modifier_desc: "Jamal enseña a los Banu Haqim a protegerse contra la Maldición Baali depositando su fe en lo divino. No importa en quién creas, la verdadera paz solo puede encontrarse en los poderes superiores."
 POD_baali_curse_thetmes_modifier: "Maldición Baali: Aceptación"
 POD_baali_curse_thetmes_modifier_desc: "¿Por qué luchar contra ella? Thetmes tiene un buen argumento. Si alguien es lo suficientemente débil como para dejarse diabolizar, significa que su alma era probablemente más útil como comida para ti que para él."
