 fetters_and_passions: "Ataduras, Pasiones y [oblivion_pull|E]"
 lesson_fetters_and_passions: "Ataduras, Pasiones y [oblivion_pull|E]"
 lesson_fetters_and_passions_desc: "Lo primero que debes saber es la existencia de la [oblivion_pull|E] que debes monitorear de cerca para no caer ante la [GetTrait('shadow').GetName(GetNullCharacter)]. Para disminuirla necesitas [Fetters|E], cada punto de [Fetter|E] no asignado significa un [stress|E] adicional cada mes."
 
 fetters_and_passions2: "Perder Estrés"
 lesson_fetters_and_passions2: "Perder Estrés"
 lesson_fetters_and_passions2_desc: "Los $POD_splat_wraith_plural$ no pueden perder [stress|E] salvo al desencadenar una pasión. Para desencadenar una pasión debes realizar acciones específicas detalladas en la descripción del modificador de [Fetter|E]. Cada tipo de [Fetter|E] tiene desencadenantes distintos; por ejemplo, 'ODIO' se activa tras cometer un asesinato y 'AMOR' se activa cada año que un personaje elegido sigue con vida.\n\nEl nivel de una [Fetter|E] es una medida importante para las pasiones, pues influye en cuánto estrés podrás perder usándola y en cuánto Pathos ganarás."
 
 fetters_and_passions3: "Crisis Mentales"
 lesson_fetters_and_passions3: "Crisis Mentales"
 lesson_fetters_and_passions3_desc: "Para un [GetTrait('wraith').GetName(GetNullCharacter)], sufrir una crisis mental es muy peligroso, ya que cada crisis fortalece a la [GetTrait('shadow').GetName(GetNullCharacter)] y te da [perk|E] aleatorios del [lifestyle|E] de [thorn_lifestyle|E] que harán el juego más difícil.\nEn el #N nivel de crisis mental 2#!, la [GetTrait('shadow').GetName(GetNullCharacter)] intentará derrocarte como personalidad principal. Si lo consigue, te convertirás en una [GetTrait('shadow').GetName(GetNullCharacter)] con todo lo que eso conlleva.\nEn el #N nivel de crisis mental 3#!, tu [GetTrait('shadow').GetName(GetNullCharacter)] intentará borrarte de la existencia; si lo consigue, te convertirás en un [GetTrait('spectre').GetName(GetNullCharacter)] y tu partida habrá terminado."
 
 fetters_and_passions4: "Arcanoi"
 lesson_fetters_and_passions4: "Arcanoi"
 lesson_fetters_and_passions4_desc: "A pesar de no sentirse cómodos en el mundo de los vivos, un [GetTrait('wraith').GetName(GetNullCharacter)] no está indefenso, ya que tiene acceso a [arcanoi_lifestyle|E], los poderes de los muertos.\n\nPara usarlos necesitarás aprenderlos; hay dos formas de hacerlo: la primera es aprenderlos de un [friend|E] u otra relación positiva. La segunda es, mientras exploras la [umbra|E], encontrar a otro [GetTrait('wraith').GetName(GetNullCharacter)] dispuesto a enseñarte uno de ellos.\n\nCada arcanoi requiere Pathos para usarse, y el pathos se obtiene mediante pasiones, como se explicó antes.\n\nCada arcanoi también desbloquea [domicile_building|E] que otorga más bonificaciones."

