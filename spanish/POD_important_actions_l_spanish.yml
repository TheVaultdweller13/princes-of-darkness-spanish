 reactive_advice_banality: "Banalidad: la plaga de las hadas"
 action_reactive_advice_banality: "Consejo: Banalidad"
 action_reactive_advice_banality_desc: "La [banality|E] es una mecánica fundamental para las hadas. Abre esto para saber más sobre lo que significa para ti."
 action_reactive_advice_banality_click: "$click_to_open_lesson$"
 lesson_about_banality: "$reactive_advice_banality$"
 lesson_about_banality_desc: "La fuerza de la incredulidad humana, la Banalidad, es una amenaza principal para los fae, pues es la antítesis de su existencia, de la propia magia.\n\nPero, para los fae, existir en el mundo del Otoño significa acumular poco a poco la incredulidad de los mortales que los rodean. Algo que puede llevar a la #R muerte#!."
 lesson_gaining_banality: "Ganar Banalidad: el camino a la muerte"
 lesson_gaining_banality_desc: "Cada año, todas las hadas ganan cierta cantidad de [banality|E], que se ve en su [trait|E] #V Banalidad#!. Si alguna vez alcanza #V 100#!, el personaje #R muere#!.\n\nEn total hay 5 formas de ganar [banality|E]: $game_concept_banality_realm_disbelief$, $game_concept_banality_local_disbelief$, $game_concept_banality_reason$, $game_concept_banality_fae_hunting$ y $game_concept_banality_despair$.\n\nAdemás, fallar al lanzar un [cantrip|E] supondrá #N +1#! de [banality|E]."
 lesson_losing_banality: "Perder Banalidad: Búsquedas de Glamour"
 lesson_losing_banality_desc: "Perder [banality|E] exige un esfuerzo #V activo#! por tu parte.\n\nSolo hay una forma real de perder [banality|E]: completar un [journey|E] de #V Búsqueda de Glamour#!.\n\nHay 3 tipos de búsquedas que puedes iniciar. Todas dan los mismos resultados, pero requieren [skills|E] distintas y tienen inconvenientes diferentes."
 lesson_banality_objectives: "Combatir la Banalidad"
 lesson_banality_objectives_desc: "Un aspecto importante de la [banality|E] son los objetivos vinculados a ella.\n\nAlgunas formas de ganar [banality|E] tienen también un objetivo que las desactiva. O, al menos, las hace menos dañinas para ti.\n\nPor ejemplo, $game_concept_banality_reason$ puede desactivarse completando #V $destroy_order_of_reason_objective_decision$#!."
 lesson_banality_ending_notes: "Banalidad: resumen"
 lesson_banality_ending_notes_desc: "En pocas palabras:\n$BULLET_WITH_TAB$Minimiza tu ganancia anual de [banality|E] y no uses [cantrips|E] con poca probabilidad de éxito\n$BULLET_WITH_TAB$Cuando tu [banality|E] llegue a unos #V 30#!, inicia tu [journey|E]. Elige el que mejor se adapte a tus [skills|E] o aquel cuyo inconveniente menos te afecte.\n$BULLET_WITH_TAB$Ciertas [decisions|E] importantes pueden desactivar fuentes de [banality|E].\n$BULLET_WITH_TAB$Y, sobre todo, #bold ¡no dejes que llegue a 100!#!"