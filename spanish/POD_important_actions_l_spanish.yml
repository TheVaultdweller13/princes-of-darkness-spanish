 reactive_advice_fetters_and_passions: "Ataduras, Pasiones y [oblivion_pull|E]"
 action_reactive_advice_fetters_and_passions: "Consejo: Ataduras, Pasiones y [oblivion_pull|E]"
 action_reactive_advice_fetters_and_passions_desc: "Introducción rápida a las principales mecánicas de [GetTrait('wraith').GetName(GetNullCharacter)]"
