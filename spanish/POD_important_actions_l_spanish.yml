 lesson_gain_pathos: "Ganar Pathos"
 lesson_gain_pathos_desc: "El Pathos es el combustible de tu poder de arcanoi, puedes ganarlo mediante: completar la [decision|E] de Pasión, Drenar Energía [character_interaction|E] (Desbloqueado por [GetPerk( 'incubus_perk' ).GetName( GetPlayer )]), Transferir Pathos [character_interaction|E] (Desbloqueado por [GetPerk( 'pathos_conduit_perk' ).GetName( GetPlayer )]) o Renderizar Reliquia [character_interaction|E] (Desbloqueado por [GetPerk( 'render_relic_perk' ).GetName( GetPlayer )])."
 

 reactive_advice_umbra: "Umbra"
 action_reactive_advice_umbra: "Consejo: Umbra"
 action_reactive_advice_umbra_desc: "Abre esto para aprender más sobre la Umbra."
 action_reactive_advice_umbra_click: "$click_to_open_lesson$"
 lesson_umbra_1: "La Umbra"
 lesson_umbra_1_desc: "La Umbra, también llamada el [spirit_world|E], es el reflejo espiritual del mundo material. Está dividida en muchos sub-reinos que contienen cada uno sus propias maravillas y peligros.\nSolo unas pocas entidades selectas pueden atravesar esta dimensión y algunos reinos solo se abren a un tipo específico de individuo (o con el poder adecuado)."
 lesson_umbra_2: "Exploración"
 lesson_umbra_2_desc: "Los reinos de la Umbra que tú y tu corte pueden explorar se muestran en el panel de la Umbra. Al hacer clic en el personaje vacío bajo un reino, podrás asignar un explorador; cuanto mayor sea su aptitud, más rápido explorarán.\nUna exploración completada podría llevar a encontrar un nuevo reino Umbral, el inicio de un descubrimiento o algún otro efecto dependiendo del reino."
 lesson_umbra_3: "Descubrimiento"
 lesson_umbra_3_desc: "Si un explorador encuentra un evento particularmente interesante en la umbra, te alertará con un descubrimiento. Puedes ver todos tus descubrimientos actuales en el segundo panel de la Umbra. Los descubrimientos pueden llevar a expediciones (donde investigas algo interesante tú mismo) u otras oportunidades para aventuras."
 lesson_umbra_4: "Efecto Pasivo y Acciones"
 lesson_umbra_4_desc: "Algunos reinos de la Umbra pueden tener efectos pasivos o acciones asociadas a ellos. Los efectos pasivos se describen bajo el nombre del reino, mientras que las acciones son botones en la parte inferior derecha del reino."

 ### Custom alerts

 pod_alert_can_create_coterie: "#T Puedes crear un [GetPlayer.Custom('PODCoterieNoTooltip')]#!\nSer parte de un [GetPlayer.Custom('PODCoterie')] hará que sea más fácil tener éxito en tus [journeys|E].\n\n#I Haz clic para crear un [GetPlayer.Custom('PODCoterieNoTooltip')] ahora.#!\n$RIGHT_CLICK_DISMISS$"

 pod_alert_can_hunt_in_capital: "#T Puedes ir a una Aventura#!\nComo eres un $POD_splat_vampire$, puedes #bold $hunt_in_capital_name$#! para saciar tu [hunger_with_icon|E] y ganar [lifestyle_experience|E].\n\nCazar #bold Campesinos#! es gratis.\n\n#I Haz clic para abrir la ventana de [journey|E].#!\n$RIGHT_CLICK_DISMISS$"

 pod_alert_can_train_with_pack: "#T Puedes ir a una Aventura#!\nComo eres un $glossary_fera$, puedes #bold $fera_training_name$#! para mejorar tanto tus propias habilidades como las de [GetPlayer.Custom('PODCoterie')], u otras recompensas.\n\n#I Haz clic para abrir la ventana de [journey|E].#!\n$RIGHT_CLICK_DISMISS$"

 pod_alert_can_go_on_umbra_expedition: "#T Puedes ir a una [umbra_expedition|E]#!\nExplorar las profundidades de la [umbra|E] puede ser tanto peligroso como gratificante.\n\n#I Haz clic para abrir la ventana de la [umbra|E].#!\n$RIGHT_CLICK_DISMISS$"

 pod_alert_has_umbra_crisis: "#T Tienes una Crisis en la Umbra sin resolver#!\nDebes resolver la Crisis en la Umbra si no quieres que ocurra algo malo al final.\n\n#I Haz clic para abrir la ventana de la [umbra|E].#!\n$RIGHT_CLICK_DISMISS$"
 
