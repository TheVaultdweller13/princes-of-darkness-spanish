##### APRIL FOOLS 2025

 Wetrius: "Wetrius"
 Wetrius_Prime: "Wetrius Prime"
 Cainetrius: "Cainetrius"

 POD_april_fools.2.t: "Así es como se ve el máximo rendimiento"
 POD_april_fools.2.desc: "Algo le ha pasado al mundo.\n\nNo puedes saber exactamente qué es. Siempre ha sido así. ¿Verdad?\n\nBueno, probablemente no sea nada importante.\n\nProbablemente."
 POD_april_fools.2.a: "¿Mis vecinos siempre tuvieron este aspecto?"
 POD_april_fools.2.tt: "Tienes un nuevo objetivo para llegar al fondo de este asunto."

 POD_april_fools.3.t: "Él Regresa"
 POD_april_fools.3.desc: "Y he aquí, hubo un trueno. Y de la tierra del mundo abandonado de Dios surge el progenitor de toda la estirpe Wetrius, venido para vengar a sus chiquillos.\n\nNo hay más objetivos después de esto. Nada más que hacer.\n\nRíndete ahora, o persiste en el mundo condenado que has creado."
 POD_april_fools.3.a: "Bueno, mierda."

 POD_wetrius_objective: "Wetriuspocalipsis"
 POD_wetrius_objective_desc: "¿Nadie va a poner fin a estos granujas húmedos?\nAlguien tiene que enviarles un mensaje."
 POD_wetrius_objective_tooltip: "O sea, ¿se cubren de aceite de bebé cada puesta de sol, o qué?"
 POD_wetrius_objective_confirm: "Largo de aquí, asquerosos"
 POD_wetrius_objective_is_valid: "Has matado personalmente a [EmptyScope.ScriptValue('POD_wetrius_kill_requirement')|V0] Wetrii #weak (recuento actual: [GetPlayer.MakeScope.ScriptValue('POD_wetrius_killcount')|0])#!"
 POD_wetrius_objective_is_valid_2: "#V [GetScriptedCharacterByHistoryID('505084').GetFirstName]#! ha muerto"
 POD_wetrius_objective_effect: "Seguro que pasará algo bueno"

 wetrius_event_troops: "Caballeros del Grial"


