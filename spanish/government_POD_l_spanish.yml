 legacy_rights: "#BLOODRED La Primera Tradición: El Pacto#!"
 legacy_rights_none: "Sin protección religiosa"
 legacy_rights_none_short: "#BLOODRED Impuesto#!"
 legacy_rights_none_desc: "#flavor «Tu sangre te convierte en mi prole, creada a mi imagen. Mi maldición es la tuya y mi salvación es la tuya. Me presento ante ti y por encima de ti como dios-regente. Yo soy el camino, mis Tradiciones son mi pacto. Renuncia a mí y renuncia a toda esperanza». Así habló Caín.#! \n\nEl [liege|E] puede [demand_conversion|E] del [vassal|E]\nEl [liege|E] puede usar [convert_county|E] en las tierras de los [vassals|E]."
 legacy_rights_protected: "Con protección religiosa"
 legacy_rights_protected_desc: "#flavor «Tu sangre te convierte en mi prole, creada a mi imagen. Mi maldición es la tuya y mi salvación es la tuya. Me presento ante ti y por encima de ti como dios-regente. Yo soy el camino, mis Tradiciones son mi pacto. Renuncia a mí y renuncia a toda esperanza». Así habló Caín.#! \n\n#emphasis #bold Privilegios del [vassal|E]:#!#!\nEl [liege|E] no puede [demand_conversion|E] del [vassal|E]\nEl [liege|E] no puede usar [convert_county|E] en las tierras de los [vassals|E]\n\n#flavor Al [vassal|E] se le concede un estatus especial de protección, con el señorío reconociendo oficialmente su derecho a practicar su propia [faith|E].#!"
 legacy_rights_protected_short: "#BLOODRED No impuesto#!"

 #destruction_rights: "#BLOODRED The Fifth Tradition: The Destruction #!"
 #destruction_rights_none: "No Destruction Rights"
 #destruction_rights_none_desc: "“Forbidden art thou to spill the blood of another of thy kind who is elder. This right belongs only to the closest to me and none other. It is forbidden for those of weaker blood to rise against their elders. This is my final covenant.” Thus spoke Caine.\n\n#flavor The [vassal] is not allowed to destroy kindred in their domain. Only the [liege] may call a Blood Hunt.#!"
 #destruction_rights_none_short: "#BLOODRED None#!"
 #destruction_rights_allowed: "Destruction Allowed"
 #destruction_rights_allowed_desc: "“Forbidden art thou to spill the blood of another of thy kind who is elder. This right belongs only to the closest to me and none other. It is forbidden for those of weaker blood to rise against their elders. This is my final covenant.” Thus spoke Caine.\n\n#emphasis #bold The [liege] allows the [vassal] to enforce the Lextalionis and call a blood hunt in the [vassal]'s domain.#!#!"
 #destruction_rights_allowed_short: "#BLOODRED Allowed#!"
 #destruction_rights_open_war: "Open Warfare"
 #destruction_rights_open_war_desc: "“Forbidden art thou to spill the blood of another of thy kind who is elder. This right belongs only to the closest to me and none other. It is forbidden for those of weaker blood to rise against their elders. This is my final covenant.” Thus spoke Caine.\n\n#emphasis #bold [vassal|E] Privileges:#!#!\nThe [vassal|E] can declare [war|E] regardless of the [lieges|E] [crown_authority|E]\nThe [vassal|E] pays #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#! less for [casus_bellis|E] within the [realm|E]\n\n#flavor The [vassal] does not have to spend a [hook] if their [lieges] [crown_authority] prevents them from waging war. This special treatment also makes it easier for the [vassal] to declare wars inside the [realm|E], reducing the cost by #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#!.#!"
 #destruction_rights_open_war_short: "#BLOODRED Open War#!"
 
 progeny_rights: "#BLOODRED La Tercera Tradición: La Prole #!"
 progeny_rights_none: "Sin derechos de prole"
 progeny_rights_none_short: "#BLOODRED Ninguno#!"
 progeny_rights_none_desc: "#flavor «Solo podrás [Glossary('Sire','game_concept_Sire_desc')] a otro con el permiso y la bendición de tu Antiguo. Crear es la providencia de aquellos más cercanos a mí, pues ellos rendirán cuentas. Rompe esto, y tanto tú como tu prole seréis asesinados». Así habló Caín.#! \n\n#emphasis #bold El [vassal] no tiene derechos para crear prole ante su [liege]. Incluso la creación de Ghouls está prohibida.#!#!"
 progeny_rights_granted: "Plenos derechos de prole"
 progeny_rights_granted_short: "#BLOODRED Cualquiera#!"
 progeny_rights_granted_desc: "#flavor «Solo podrás [Glossary('Sire','game_concept_Sire_desc')] a otro con el permiso y la bendición de tu Antiguo. Crear es la providencia de aquellos más cercanos a mí, pues ellos rendirán cuentas. Rompe esto, y tanto tú como tu progenie seréis asesinados». Así habló Caín.#! \n\n#emphasis #bold El [vassal] tiene plenos derechos para crear progenie por parte de su [liege]. Esto incluye tanto a chiquillos vampíricos como a Ghouls.#!#!"
 progeny_rights_ghouls: "Derechos de creación de Ghouls"
 progeny_rights_ghouls_short: "#BLOODRED Ghouls #!"
 progeny_rights_ghouls_desc: "#flavor «Solo podrás [Glossary('Sire','game_concept_Sire_desc')] a otro con el permiso y la bendición de tu Antiguo. Crear es la providencia de aquellos más cercanos a mí, pues ellos rendirán cuentas. Rompe esto, y tanto tú como tu progenie seréis asesinados». Así habló Caín.#! \n\n#emphasis #bold El [vassal] ha recibido por parte de su [liege] los derechos para crear Ghouls, pero no chiquillos vampíricos.#!#!"
 progeny_rights_childer: "Derechos de progenie de la Estirpe"
 progeny_rights_childer_short: "#BLOODRED La Estirpe #!"
 progeny_rights_childer_desc: "#flavor «Solo podrás [Glossary('Sire','game_concept_Sire_desc')] a otro con el permiso y la bendición de tu Antiguo. Crear es la providencia de aquellos más cercanos a mí, pues ellos rendirán cuentas. Rompe esto, y tanto tú como tu progenie seréis asesinados». Así habló Caín.#! \n\n#emphasis #bold El [vassal] ha recibido por parte de su [liege] los derechos para crear chiquillos vampíricos, pero no Ghouls.#!#!"

 #blood_oaths: "#BLOODRED The Fourth Tradition: The Accounting#!"
 #blood_oaths_none: "No Blood Oaths Required"
 #blood_oaths_none_short: "#BLOODRED Free Will#!"
 #blood_oaths_none_desc: "“Those thou create are thine own blood until release from thy charge. Until that moment, their sins, their blood and their punishments are thine.” Thus spoke Caine.\n\n#emphasis #bold The [vassal] is not required to swear a blood oath to their [liege].#!#!"
 #blood_oaths_required: "Blood Oaths Required"
 #blood_oaths_required_short: "#BLOODRED Blood Oaths#!"
 #blood_oaths_required_desc: "“Those thou create are thine own blood until release from thy charge. Until that moment, their sins, their blood and their punishments are thine.” Thus spoke Caine.\n\n#emphasis #bold The [vassal] must swear a blood oath to their [liege] and consume a draught of their [liege]'s blood. This is a minor blood bond and a weak hook.#!#!"
 
 domain_revocation_rights: "#BLOODRED La Segunda Tradición: El Dominio #!"
 domain_revocation_rights_default: "Revocación del dominio"
 domain_revocation_rights_default_short: "#BLOODRED Voluntad del Señor#!"
 domain_revocation_rights_default_desc: "El [liege] puede revocar un dominio siempre que las leyes de la corona lo permitan." 
 domain_revocation_rights_protected: "Dominio protegido"
 domain_revocation_rights_protected_desc: "#flavor «Como soy el señor de Nod, tu dominio es asunto tuyo. Tú eres su señor, y todos respetarán esto o sufrirán tu ira. Todos se presentarán al entrar, y tú los protegerás a su vez. Por derecho, se te permite cazar dentro de los límites de tu dominio, cuya sangre es tuya. Acepta su responsabilidad, administra tu dominio y muestra a los demás el mismo respeto que esperas». Así habló Caín.#! \n\nPrivilegio de [vassal|E]:#!#!\nEl [liege|E] no puede revocar los [titles|E] del [vassals_possessive|E]\n\n#flavor Al [vassal] se le garantiza la propiedad de sus [titles], lo que impide que el [liege|E] los revoque, tenga o no el [liege|E] un [revoke_title_reason].#!"
 domain_revocation_rights_protected_short: "#BLOODRED Protegido#!"
 
 #masquerade_protocol: "#BLOODRED The Sixth Tradition: The Masquerade #!"
 #masquerade_protocol_none: "No Masquerade"
 #masquerade_protocol_none_desc: "#flavor The [liege] does not enforce the Silence of Blood in the [vassal]'s domain.#!"
 #masquerade_protocol_none_short: "#BLOODRED None#!"
 #masquerade_protocol_lax: "Lax Masquerade"
 #masquerade_protocol_lax_desc: "“Never shalt thou reveal thy true nature to those not of the blood. Doing so shall renounce thy claims to my covenants.” Thus spoke Caine.\n\n#emphasis #bold The [liege] only enforces the extreme violations of Silence of Blood in the [vassal]'s domain.#!#!"
 #masquerade_protocol_lax_short: "#BLOODRED Lax#!"
 #masquerade_protocol_strict: "Strict Masquerade"
 #masquerade_protocol_strict_desc: "“Never shalt thou reveal thy true nature to those not of the blood. Doing so shall renounce thy claims to my covenants.” Thus spoke Caine.\n\n#emphasis #bold The [liege] enforces a strict interpretation of Silence of Blood in the [vassal]'s domain.#!#!"
 #masquerade_protocol_strict_short: "#BLOODRED Strict#!" 
 
 #blood_tithe: "#BLOODRED Blood Tithe#!"
 #blood_tithe_none: "No $blood_tithe$"
 #blood_tithe_none_short: "#BLOODRED None#!"
 #blood_tithe_none_desc: "#emphasis #bold The [vassal] owes no blood tithe to their [liege].#!#!"
 #blood_tithe_required: "Kine Blood Tithe"
 #blood_tithe_required_short: "#BLOODRED Kine#!" 
 #blood_tithe_required_desc: "#emphasis #bold On demand, the [vassal] must supply one of the kine to the court of their [liege]. Typically, this means the death of the mortal.#!#!" 
 #blood_tithe_vampiric: "Vassal Vitae Blood Tithe"
 #blood_tithe_vampiric_short: "#BLOODRED Your Vitae#!"
 #blood_tithe_vampiric_desc: "#emphasis #bold On demand, the [vassal] must provide their own vampiric blood to their [liege]. This will increase the hunger of donor.#!#!"
 #blood_tithe_childer: "Childer Blood Tithe"
 #blood_tithe_childer_short: "#BLOODRED Your Childer#!"
 #blood_tithe_childer_desc: "#emphasis #bold On demand, the [vassal] must provide one of their childer to their [liege]. This often leads to the destruction of the childe.#!#!"

 primogen_rights: "#BLOODRED Círculo Interno #!"
 primogen_rights_none: "Sin asiento en el Círculo Interno"
 primogen_rights_none_desc: "#emphasis El [vassal] no recibe ningún privilegio fuera de lo ordinario en lo que respecta al [council] privado.#!"
 primogen_rights_none_short: "#BLOODRED Ninguno#!"
 primogen_rights_guaranteed: "Asiento en el Círculo Interno"
 primogen_rights_guaranteed_desc: "#emphasis #bold Privilegio de [vassal|E]:#!#!\nLa [interaction|E] de #high $force_onto_council$#! se puede usar a voluntad\n\n#flavor Al [vassal] se le conceden privilegios especiales en el [council] privado y esperará un asiento permanente en el [council]. Conceder este privilegio a demasiados [vassals] acabará por molestar a los [powerful_vassals] del [realm|E].#!"
 primogen_rights_guaranteed_short: "#BLOODRED Garantizado#!"
 
 type_of_courts: "Tipo de corte"
 type_of_courts_political: "Corte política"
 type_of_courts_political_desc: "#flavor Las cortes políticas son, con diferencia, las más comunes. Se reúnen para supervisar los intereses de los [GetTrait('kueijin').GetName( GetNullCharacter )] y de los mortales de una zona geográfica concreta, como pueblos o ciudades. Las grandes ciudades pueden tener varias cortes políticas, cada una con su propio territorio y Tradición, y cada una con un conjunto único de problemas que pondrán a prueba al ancestro de la ciudad.#!"
 type_of_courts_social: "Corte social"
 type_of_courts_social_desc: "#flavor Las cortes sociales son menos comunes que sus contrapartes políticas y se sitúan en los lugares más inusuales. Se forman en torno a objetivos sociales (como proteger y mantener un nido de dragón), áreas de interés académico e incluso preocupaciones regionales.#!"
 type_of_courts_political_short: "Política"
 type_of_courts_social_short: "Social"

 fera_tribe_government: "Tribu Fera"
 fera_tribe_government_with_icon: "@fera_icon! $fera_tribe_government$"
 fera_tribe_government_adjective: "Tribal"
 fera_tribe_government_realm: "Tribu Fera"
 fera_tribe_government_vassals_label: "Las [obligations|E] tribales se basan en la [opinion|E]"
 fera_tribe_government_desc: "Las tribus son la unidad social más grande de los $glossary_fera$. Los miembros de la tribu suelen estar vinculados por Líneas de Sangre, tótems similares o Patrones, y Estilos de vida.\nLas diversas Razas Cambiantes se organizan de forma diferente en esta amplia categorización, pero todas comparten este énfasis en compartir los mismos vínculos sociales y conexiones espirituales."
 fera_tribe_government_filter_option: "$fera_tribe_government$"
 fera_tribe_government_filter_option_desc: "Mostrar solo personajes con el [government|E] [GetGovernment( 'fera_tribe_government' ).GetName]"

 dark_kingdom_government: "Reino Oscuro"
 dark_kingdom_government_with_icon: "@wraith_icon! $dark_kingdom_government$"
 dark_kingdom_government_adjective: "Reino Oscuro"
 dark_kingdom_government_realm: "Reino Oscuro"
 dark_kingdom_government_vassals_label: "Las [obligations|E] del [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] se basan en el [vassal_contract|E] de cada [vassal|E]"
 dark_kingdom_government_desc: "Los Reinos Oscuros son bolsas de realidad estable dentro de la [UmbraGlossary('tempest')] del [UmbraGlossaryLocalized('shadowlands','Inframundo')]. Cada uno de estos reinos reclama dominio sobre los Espectros de una región geográfica particular."
 dark_kingdom_government_filter_option: "$dark_kingdom_government$"
 dark_kingdom_government_filter_option_desc: "Mostrar solo personajes con el [government|E] [GetGovernment( 'dark_kingdom_government' ).GetName]"

 infernal_court_government: "Corte Infernal"
 infernal_court_government_with_icon: "@demon_icon! $infernal_court_government$"
 infernal_court_government_adjective: "Corte Infernal"
 infernal_court_government_realm: "Corte Infernal"
 infernal_court_government_vassals_label: "Las [obligations|E] de la Corte Infernal se basan en el [vassal_contract|E] de cada [vassal|E]"
 infernal_court_government_desc: "Los demonios que han regresado del Abismo suelen organizarse en Cortes, que son restos de la Era de la Ira, cuando los Caídos gobernaban sus propios Bastiones en su guerra contra el Cielo."
 infernal_court_government_filter_option: "$infernal_court_government$"
 infernal_court_government_filter_option_desc: "Mostrar solo personajes con el [government|E] [GetGovernment( 'infernal_court_government' ).GetName]"

 household_government: "Casas"
 household_government_with_icon: "@changeling_icon! $household_government$"
 household_government_adjective: "Casas"
 household_government_realm: "Casas"
 household_government_vassals_label: "Las [obligations|E] de la Casa se basan en el [vassal_contract|E] de cada [vassal|E]."
 household_government_desc: "Una Casa es un grupo de changelings vinculados a un feudo que sirven al gobernante local como vasallos o como séquitos."
 household_government_filter_option: "$household_government$"
 household_government_filter_option_desc: "Mostrar solo personajes con el [government|E] de [GetGovernment( 'household_government' ).GetName]"
 
 legion_religion_modifier: "La [religion|E] de la Legión otorga una bonificación de pérdida de [stress|E]."
 guild_religion_modifier: "La [religion|E] del Gremio otorga una bonificación de [experience|E] de [lifestyle|E] Arcanoi."
 yellow_springs_religion_modifier: "La [religion|E] de Yellow Springs otorga acceso al [lifestyle|E] de [jade_arcanoi_lifestyle|E]."
 
 vampire_antagonistic: "Antagónico (Vampiro)"
 vampire_antagonistic_desc: "Pocas cosas pueden espolear a la gente como las rivalidades o los celos. Más vale que te cuides la espalda en esta casa, o podrías encontrarte a alguien intentando clavarte un cuchillo."
 vampire_competitive: "Competitivo (Vampiro)"
 vampire_competitive_desc: "La competición en la familia puede ser algo saludable. Empuja a los miembros de esta casa a superarse unos a otros, ya sea en el campo de batalla o en el intento de asegurar el trono..."
 vampire_impassive: "Impasible (Vampiro)"
 vampire_impassive_desc: "¿Para qué gastar tiempo y energía en que te importe lo que hacen los demás miembros de la familia? Los miembros de esta casa tienden a preocuparse principalmente por sí mismos."
 vampire_friendly: "Amistoso (Vampiro)"
 vampire_friendly_desc: "Quizá no siempre estén de acuerdo, pero los miembros de esta casa siempre mantienen una relación amistosa."
 vampire_harmonious: "Armonioso (Vampiro)"
 vampire_harmonious_desc: "Una casa en perfecta armonía. Los miembros de esta casa hacen lo que pueden para mantenerse unidos y prestarse ayuda mutua en todo momento." 
 
 vampire_tax_slot: "Influencia del Vasallo"
 
 #blood_tithe_required_tax_collector: "Blood Tithe"
 #blood_tithe_required_tax_collector_desc: "#emphasis #bold On demand, the [vassal] must supply one of the kine to the court of their [liege]. Typically, this means the death of the mortal.#!#!" 
 #blood_tithe_required_tax_collector_flavor_desc: "#flavor The lord of the domain asks for blood, and he shall receive his due.#!" 
 #
 #progeny_rights_tax_collector: "Progeny Rights"
 #progeny_rights_tax_collector_flavor_desc: "#emphasis #bold “Thou shalt only [Glossary('Sire','game_concept_Sire_desc')] another with the permission and blessing of thine elder. To create is the providence of those closest to me, for they shall be accountable. Break this, and both thee and thy progeny shall be slain.” Thus spoke Caine.#!" 
 #progeny_rights_tax_collector_desc: "#flavor \n\n#emphasis #bold The [vassal] has no rights to create progeny by their [liege]. Even the creation of ghouls is forbidden.#!#!" 
 # 
 legacy_rights_protected_tax_collector: "Derechos de Legado"
 legacy_rights_protected_tax_collector_desc: "#emphasis #bold El [liege|E] no puede [demand_conversion|E] del [vassal|E]\nEl [liege|E] no puede usar [convert_county|E] en las tierras de los [vassals|E].#!#!"
 legacy_rights_protected_tax_collector_flavor_desc: "#flavor «Tu sangre te convierte en mi prole, creada a mi imagen. Mi maldición es la tuya y mi salvación es la tuya. Me presento ante ti y por encima de ti como dios-regente. Yo soy el camino, mis Tradiciones son mi pacto. Renúnciame y renuncia a toda esperanza». Así habló Caín.#!"
 
 domain_revocation_rights_protected_tax_collector: "Derechos de Dominio"
 domain_revocation_rights_protected_tax_collector_desc: "#emphasis #bold El [liege|E] no puede revocar los [titles|E] del [vassals_possessive|E]\n\n Se garantiza al [vassal] la propiedad de sus [titles], impidiendo que el [liege|E] los revoque, independientemente de si el [liege|E] tiene un [revoke_title_reason] o no.#!#!"
 domain_revocation_rights_protected_tax_collector_flavor_desc: "#flavor «Como soy el señor de Nod, tu dominio es asunto tuyo. Tú eres su señor, y todos respetarán esto o sufrirán tu ira. Todos se presentarán al entrar, y tú los protegerás a su vez. Por derecho, se te permite cazar dentro de los límites de tu dominio, su sangre es la tuya. Acepta su responsabilidad, administra tu dominio y muestra a otros el mismo respeto que esperas». Así habló Caín.#!"
 
 guaranteed_council_tax_collector: "Puesto en el Consejo"
 guaranteed_council_tax_collector_desc: "#emphasis #bold Este vasallo siempre puede imponerse para entrar en el consejo de su señor. #!#!"
 guaranteed_council_tax_collector_flavor_desc: "#flavor Un asiento en la prestigiosa mesa del consejo de un poderoso señor es un honor que algunos creen que se merecen.#!"
 
 POD_strict_taxation_tax_collector: "Tributación Severa"
 POD_strict_taxation_tax_collector_flavor_desc: "#flavor Quieres oro. Ellos tienen oro. Una unión perfecta.#!"
 
 POD_tributary_tax_collector: "Tributario"
 POD_tributary_tax_collector_desc: "#emphasis #bold El [liege|E] no puede revocar los [titles|E] del [vassals_possessive|E]\n\n Se garantiza al [vassal] la propiedad de sus [titles], impidiendo que el [liege|E] los revoque, independientemente de si el [liege|E] tiene un [revoke_title_reason] o no. El [liege|E] no puede [demand_conversion|E] del [vassal|E]\nEl [liege|E] no puede usar [convert_county|E] en las tierras de los [vassals|E].#!#!"
 POD_tributary_tax_collector_flavor_desc: "#flavor Este vasallo apenas reconoce tu mandato. Tu control sobre sus tierras es, en el mejor de los casos, tenue.#!"
 
 POD_hard_control_tax_collector: "Control Absoluto"
 POD_hard_control_tax_collector_desc: "#emphasis #bold Los vasallos no pueden declarar ninguna guerra sin tener una ventaja sobre su señor.#!#!"
