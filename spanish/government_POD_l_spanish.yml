 rose_treaty_granted_desc: "#emphasis #bold Privilegios del [vassal|E]:#!#!\nEl [liege|E] no puede [demand_conversion|E] del [vassal|E]\nEl [liege|E] no puede usar [convert_county|E] en las tierras de los [vassals|E]\n\n #flavor Firmado en 1215, el tratado de la Rosa otorgó a Mithras un imperio unificado para gobernar, y dio a sus súbditos un marco bajo el cual operar. Es uno de los primeros sistemas de gobierno vampírico que se apoya en el feudalismo para administrar un señorío.#!"
