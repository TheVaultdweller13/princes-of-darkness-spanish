 pod_ventrue_ephorate.30.t: "Un asiento en la mesa"
 pod_ventrue_ephorate.30.desc: "Los rumores bullen en el ilustre mundillo de los Ventrue sobre el reciente fallecimiento de un Éforo, uno de los doce miembros principales del $pod_clan$. La inmortalidad obliga, un asiento en esta mesa se abre muy raramente, lo que ha creado una guerra de influencia en las sombras entre los ambiciosos Ventrue, todos intentando impresionar a los Éforos restantes con la esperanza de ser seleccionados para el puesto vacante.\n¿Te posicionarás tú también como un candidato potencial?"
 pod_ventrue_ephorate.30.a: "Soy, naturalmente, la mejor opción."
 pod_ventrue_ephorate.30.b: "Aún no es mi momento."
 entry_ephorate_tt: "Serás seleccionado como el Éforo más reciente. El coste de esta opción depende de varios factores como tu prestigio, rango de título y tamaño del reino."
 pod_ventrue_ephorate.4.t: "La llamada del Eforado"
 pod_ventrue_ephorate.4.desc: "Con el reciente fallecimiento de un miembro del estimado Eforado, se ha abierto una vacante. Los Éforos han decidido que eres el mejor candidato para reemplazar a su colega perdido. Es ciertamente un honor muy prestigioso, ya que los Éforos tienen mucho peso en los asuntos del clan.\nAunque solo serás una voz entre doce, esto se reflejará bien en ti y podría abrirte nuevas oportunidades en el futuro. Es hora de que ocupes tu lugar entre los Ventrue más poderosos del mundo."
 pod_ventrue_ephorate.4.a: "Mi talento es finalmente recompensado."
 ventrue_ephorate_entry_tt: "Ahora formas parte del Eforado y apoyarás automáticamente a una facción dependiendo de tu religión y rasgos.\nEn el futuro ocurrirán nuevos eventos relacionados con tu nuevo papel para dar forma al clan."
 pod_ventrue_ephorate.4.b: "Apoyaré a los Caballeros de Ceniza."
 pod_ventrue_ephorate.4.c: "Apoyaré a los Príncipes Mercaderes."
 pod_ventrue_ephorate.4.d: "Apoyaré al Senado Eterno."
 pod_ventrue_ephorate.4.e: "Apoyaré a la Roma Pecadora."
 pod_ventrue_ephorate.4.f: "Apoyaré a los Patricios."
 
 pod_ventrue_ephorate.6.t: "El Eforado"
 pod_ventrue_ephorate.6.desc: "El Eforado consiste en los 12 antiguos Ventrue más poderosos e influyentes. Los Éforos establecen precedentes en asuntos de \"política del clan\". Es el rango más alto dentro de la jerarquía interna Ventrue. La función más importante del Eforado no es tan fácil de cuantificar; ellos marcan el tono de todo el $pod_clan$. Sus filosofías, estilos de liderazgo y posturas políticas se discuten y debaten en todos los rangos, influyendo por tanto en la mayoría de los Ventrue en algún grado.\n #X El Eforado es una característica definitoria de los Ventrue. Se otorgan importantes modificadores de dinastía a los Ventrue dependiendo del poder de las facciones del Eforado. Cada Éforo también tiene acceso a puestos en la corte únicos. Los Éforos son seleccionados de por vida, lo que significa que solo la muerte de uno puede abrir un nuevo asiento en la mesa.\nPuedes acceder a él en una pestaña a la derecha de tu pantalla.#!"
 pod_ventrue_ephorate.6.a: "Somos más fuertes unidos."
 ventrue_ephorate_intro_tt: "El Eforado actual está dividido, pero débilmente dominado por los Patricios, otorgando un modificador a todo el clan Ventrue.\nSi la composición del Eforado cambia, los modificadores también podrían cambiar."
 ventrue_ephorate_intro_member_tt: "El Eforado actual está dividido, pero débilmente dominado por los Patricios, otorgando un modificador a todo el clan Ventrue.\nSi la composición del Eforado cambia, los modificadores también podrían cambiar.\nTu personaje comienza como miembro de esta institución, lo que abrirá nuevas posibilidades para influir en el clan en el futuro."

 pod_ventrue_ephorate.100.t: "Fin del Eforado"
 pod_ventrue_ephorate.100.desc: "El Eforado siempre ha estado dividido entre facciones enfrentadas desde la época romana. Esta división era en realidad el sustento de la institución, porque significaba que el clan Ventrue carecía de una autoridad indiscutible que pudiera impulsarlo con fuerza hacia adelante.\nEste estado de cosas ha cambiado y una facción ha logrado alcanzar el dominio completo sobre la institución. Como el clan Ventrue está una vez más unificado bajo una sola visión, el propio Eforado pierde todo el poder, para convertirse pronto en una reliquia de una era pasada y problemática de los Ventrue."
 pod_ventrue_ephorate.100.a: "Un movimiento audaz hacia el futuro."
 ventrue_ephorate_end_tt: "El Eforado se disuelve, la facción ganadora impone una versión más fuerte de su modificador en la dinastía del clan Ventrue."

 ephorate_distributing_funds_modifier: "Redistribución del Eforado"
 ephorate_distributing_funds_modifier_desc: "El Eforado está redistribuyendo algunos de sus fondos para ayudar a los proyectos Ventrue en todo el mundo."

 pod_ventrue_ephorate.7.t: "El tesoro del Eforado"
 pod_ventrue_ephorate.7.desc: "El Eforado se asienta sobre uno de los tesoros más impresionantes de la historia vampírica. El clan Ventrue es conocido por sus astutas inversiones, y esas inversiones pueden durar para siempre. Como tal, el Eforado dirige las empresas globales del clan antes de redistribuir su riqueza a otros proyectos Ventrue en todo el mundo.\nHas sido elegido como el encargado de gestionar la redistribución actual para esta década, lo que significa que ahora estás a cargo de una vasta reserva de oro.\nUn honor, y una tentación..."
 pod_ventrue_ephorate.7.a: "El dinero desaparece a veces..."
 pod_ventrue_ephorate.7.b: "Hora de invertir de nuevo."

 ephorate_decorum_modifier: "Decoro del Eforado"
 ephorate_decorum_modifier_desc: "El Eforado mantiene bien el decoro, proyectando la imagen de un clan Ventrue poderoso y disciplinado."
 
 pod_ventrue_ephorate.8.t: "Decoro de la élite"
 pod_ventrue_ephorate.8.desc: "El Eforado es una institución prestigiosa y se espera que represente a la élite del clan Ventrue. El problema es que con tantos antiguos poderosos en la misma organización, los ánimos pueden caldearse bastante rápido y las sesiones acaloradas pueden llevar a enemistades que continúan mucho más allá de los pasillos del Eforado. Uno de esos debates difíciles ha empezado a intensificarse con uno de tus colegas y ninguno de los dos cede todavía.\nSi esto continúa, es probable que el asunto se oiga fuera de la institución y rompa la fachada de unidad disciplinada que el clan Ventrue quiere presentar. Ceder ahora sigue siendo una opción si quieres evitar esa funesta posibilidad."
 pod_ventrue_ephorate.8.a: "Podemos calmar lentamente este debate."
 pod_ventrue_ephorate.8.b: "Lleguemos a un compromiso."
 pod_ventrue_ephorate.8.c: "¡Yo tengo razón aquí!" 
 
 ephorate_decorum_broken_modifier: "Decoro del Eforado roto"
 ephorate_decorum_broken_modifier_desc: "La fachada de unidad del Eforado muestra grietas, debilitando al clan Ventrue en su conjunto."
  
 pod_ventrue_ephorate.9.t: "Amenazas por todas partes"
 pod_ventrue_ephorate.9.desc: "El Eforado emplea una policía secreta que hace las veces de fuerza de respuesta rápida, los Lictores. Estos poderosos agentes se aseguran de que los intereses del clan Ventrue sean siempre defendidos con la fuerza cuando es necesario y han sido un activo importante para muchos Príncipes débiles a lo largo de los años.\nLamentablemente, parece que las amenazas a los Ventrue nunca dejan de aparecer y los Lictores informan de que están abrumados por la gran cantidad de incendios que tienen que apagar. Por ello, solicitan que se les envíen más recursos, ya sea oro o favores políticos con Príncipes neutrales.\nComo Éforo actual responsable de la seguridad interna, te corresponde a ti responder a esta llamada de ayuda."
 pod_ventrue_ephorate.9.a: "Los Lictores solo tendrán que trabajar más duro."
 pod_ventrue_ephorate.9.b: "Una causa digna."
 
 ephorate_overwhelmed_lictor_modifier: "Lictores del Eforado abrumados"
 ephorate_overwhelmed_lictor_modifier_desc: "La fuerza de respuesta rápida del Eforado, los Lictores, están abrumados por las peticiones, dejando muchos huecos en la defensa del clan."
  
 pod_ventrue_ephorate.10.t: "Ojos y oídos de los Ventrue"
 pod_ventrue_ephorate.10.desc: "Los miembros de menor rango del Eforado son los Tribunos, mensajeros y espías para la organización y el clan Ventrue en su conjunto. Aunque no es un rango prestigioso, su importancia no puede subestimarse, ya que a menudo son la fuente de información más fiable disponible para los Príncipes Ventrue.\nLos Tribunos son numerosos pero están mal coordinados y la mayoría informa al Ventrue más antiguo de su zona en lugar de al Eforado directamente. Como eres el Éforo a cargo de ellos durante esta década, estás considerando una reforma profunda para acercarlos al propio Eforado, con la esperanza de mejorar su rendimiento al mismo tiempo."
 pod_ventrue_ephorate.10.a: "Redactaré una reforma."
 pod_ventrue_ephorate.10.b: "El cambio no es necesario."
 
 ephorate_empowered_tribunes_modifier: "Tribunos del Eforado potenciados"
 ephorate_empowered_tribunes_modifier_desc: "Los mensajeros y espías del Eforado han sido reorganizados, ofreciendo aún más apoyo a los intereses sombríos del clan."
      
 pod_ventrue_ephorate.11.t: "Subordinados ambiciosos"
 pod_ventrue_ephorate.11.desc: "Los agentes directos del Eforado son los Strategoi, individuos poderosos investidos con el poder de los Éforos y los únicos que conocen realmente sus nombres. Los Strategoi son tremendamente útiles como medio para ejercer el poder del Eforado sin ponerte en peligro, pero también suelen ser problemáticos, ya que observan la posición de los Éforos con codicia y son la principal causa de traición en la organización.\nEs casi habitual que los Éforos realicen una revisión exhaustiva de los Strategoi de vez en cuando (lo que a menudo lleva a una purga) y tú eres el encargado de este dudoso honor para esta década."
 pod_ventrue_ephorate.11.a: "Los Strategoi son leales."
 pod_ventrue_ephorate.11.b: "No se puede confiar en ellos."
 
 ephorate_empowered_strategoi_modifier: "Strategoi del Eforado potenciados"
 ephorate_empowered_strategoi_modifier_desc: "Los agentes directos del Eforado están trabajando más duro que nunca, pero a menudo para sus propios intereses en lugar de los del clan."
      
 pod_ventrue_ephorate.667.t: "Puntos de discordia"
 pod_ventrue_ephorate.667.desc: "Los Ventrue son un clan dividido en muchos sentidos, entre diferentes tierras, tradiciones, líneas de sangre y formas de existencia. Casi lo único en lo que sus diversas facciones están de acuerdo es en su herencia noble y en que deberían tener unidad, pero ¿con qué facción al mando y hacia qué fin? Estos siguen siendo los mayores puntos de discordia entre los Ventrue.\n¿Sobre qué facción deseas aprender más?"
 pod_ventrue_ephorate.667.a: "Los Patricios"
 pod_ventrue_ephorate.667.b: "El Senado Eterno."
 pod_ventrue_ephorate.667.c: "La Roma Pecadora."
 pod_ventrue_ephorate.667.d: "Los Príncipes Mercaderes."
 pod_ventrue_ephorate.667.e: "Los Caballeros de Ceniza."
 pod_ventrue_ephorate.667.f: "Ninguna por ahora."
 
 pod_ventrue_ephorate.668.t: "Los únicos reyes verdaderos"
 pod_ventrue_ephorate.668.desc: "Los Patricios (también conocidos como los Patriarcas) claman por su derecho heredado de Enoch a gobernar sobre todos los cainitas. Están compuestos principalmente por Príncipes que reflejan la nobleza mortal. Aunque respetan los logros de Camilla y Roma, ven el hedonismo y la decadencia como la razón de su caída y son mucho más severos y disciplinados que sus homólogos de tendencia romana.\nLos Patriarcas son Ventrue conservadores forjados en el molde clásico. Se consideran la nobleza elegida de la noche, favorecida por el propio Caín y destinada a gobernar. Se adhieren firmemente a los principios de la Vía de los Reyes, en su mayor parte, y se aferran a las viejas formas de hacer las cosas (es decir, las tradiciones feudales de Europa, que es lo que la mayoría de los Patriarcas conocieron en sus vidas mortales). Promueven el poder Ventrue y no confían en el cambio. ¿Por qué deberían cambiar las cosas, después de todo, cuando son como Dios y Caín las ordenaron desde el principio de los tiempos?\nDestino futuro en el Canon\nFusionándose con los Príncipes Mercaderes, los Patricios se convertirán en lo que todo el mundo piensa que es un verdadero Ventrue en las noches modernas."
  
 pod_ventrue_ephorate.669.t: "Sueño romano"
 pod_ventrue_ephorate.669.desc: "También llamados Antasianos, el Senado Eterno se guía por las ideas de Julia Antasia, una Ventrue romana que fue miembro del Senado Eterno en esa ciudad antes de su declive. Un dechado de la Vía de la Humanidad, Antasia enseña a sus seguidores la importancia de la igualdad y la cooperación mutua para el bien común de todos. Se aferra a las verdaderas formas \"antiguas\" de los cainitas romanos y a los días de gloria del Imperio y espera recrear los logros del Senado Eterno. No hace falta decir que los Patriarcas consideran a los Antasianos, en el mejor de los casos, ilusos, y en el peor, una rebelión peligrosa en ciernes. El Senado ve a los Ventrue Patriarcas como elitistas arrogantes y egoístas preocupados por su propio poder y posiciones y nada más.\nDestino futuro en el Canon\nCon la desaparición de su mentora y líder, el Senado Eterno perderá la mayor parte de su influencia ante los Patricios, quedando solo unas pocas ciudades (como Frankfurt) siguiendo sus ideales durante los siglos venideros."
  
 pod_ventrue_ephorate.670.t: "Dulce Roma decadente"
 pod_ventrue_ephorate.670.desc: "Tito Venturo Camille (más conocido como Camilla) es una figura divisiva en la historia Ventrue. Celebran su gobierno de siglos sobre Roma y la unidad nunca vista antes ni después que trajo al mundo cainita y se sienten orgullosos de su papel en la purga de la Cartago infernal. Pero son menos entusiastas sobre su ferviente adhesión a la Vía del Pecado y la pura decadencia que trajo a Roma. Como tal, la mayoría de los Ventrue se contentan con hablar de Camilla como un prototipo de lo que debería ser un verdadero Ventrue medieval: un gobernante fuerte y astuto que unifica a los clanes tras él. Pero otros aún conocen la verdad: Camilla estaba tan definido por la Vía del Pecado como por ser un Ventrue y honran ambos lados.\nTal vez el clan Ventrue tomó un giro equivocado tras la caída de Roma y un regreso a las buenas noches antiguas podría ser preferible al curso de acción actual...\nDestino futuro en el Canon\nCamilla seguirá siendo una parte extraña y cuestionada de la historia Ventrue pero, para bien o para mal, el clan Ventrue nunca volverá a experimentar la unidad y la decadencia que logró en la antigua Roma."
  
 pod_ventrue_ephorate.671.t: "El dinero es poder"
 pod_ventrue_ephorate.671.desc: "Un poder emergente dentro de los Ventrue son los miembros del clan que hacen su fortuna como mercaderes y comerciantes en lugar de buscar tierras y dominios propios. La mayoría de estos llamados Príncipes Mercaderes son seguidores de la Senda del Mercader y encuentran su fuerza en la riqueza más que en la tierra y los vasallos. No vinculados a ningún lugar en particular, y beneficiándose (en su mayor parte) de la Guerra de los Príncipes, los Príncipes Mercaderes se han organizado en varios gremios y redes de contactos por toda Europa.\nMientras que muchos Ventrue desprecian a los Príncipes Mercaderes con su \"afán de lucro\" y su \"usura\", los mercaderes han ido acumulando lentamente poder e influencia a lo largo de los años, además de riqueza. Al igual que el Senado Eterno, los Mercaderes buscan reunificar a los Ventrue como en los días de Roma, pero bajo un gremio mercantil en lugar de un senado o emperador. Han comenzado a apoyar a ciertos señores cainitas para crear el entorno adecuado en Europa donde puedan florecer y convertirse en el poder tras los tronos.\nDestino futuro en el Canon\nLa historia dará la razón a los Príncipes Mercaderes, ya que el dinero se convertirá verdaderamente en poder en los siglos venideros. Aliándose con los Patricios, los Príncipes Mercaderes se convertirán en una parte integrante de la identidad central de los Ventrue."
  
 pod_ventrue_ephorate.672.t: "Obligados por el honor"
 pod_ventrue_ephorate.672.desc: "Los Caballeros de Ceniza son los Ventrue menos interesados en acumular poder. En su lugar, se adhieren estrictamente a su propio código de caballería y esperan que el clan Ventrue dé un ejemplo de valentía, moderación y disciplina a otros clanes en lugar de intentar gobernarlos directamente. La mayoría de los Caballeros de Ceniza trabajan bien con las otras facciones siempre que consideren su conducta \"honorable\", que es un calificativo algo misterioso que puede variar de un caballero a otro.\nSubestimados por otros Ventrue, los Caballeros de Ceniza son apreciados por los otros clanes como los Ventrue aparentemente menos arrogantes que no intentan enseñorearse de ellos usando algún pretexto discutible. Esto los convierte en una fuerza política con un número sorprendente de aliados a los que recurrir cuando es necesario.\nDestino futuro en el Canon\nLos Caballeros de Ceniza no aceptarán la transformación del clan Ventrue encabezada por la alianza de los Patricios y los Príncipes Mercaderes. Uniéndose al naciente Sabbat en respuesta, formarán la columna vertebral de los Ventrue antitribu, luchando por restaurar el honor perdido hace mucho tiempo de su clan."
