 #game_concept_eternal_senate: "Senado Eterno" 
 #game_concept_eternal_senate_desc: "El Senado Eterno, también conocido como los Antasianos, es una recreación idealizada de la organización del mismo nombre que existió durante la época romana. Se esfuerzan por la igualdad y una visión democrática para el futuro cainita, donde todos los vampiros tengan representación en el órgano de gobierno.\nBajo el liderazgo de Julia Antasia, su movimiento se ha extendido desde Frankfurt a las regiones cercanas y está creciendo en tamaño a medida que muchos vampiros idealistas jóvenes encuentran sus ideales más atractivos que la despiadada imposición del gobierno feudal de Hardestadt." 
 ephorate_support_gui_loc: "#bold Los efectos de los diversos niveles de apoyo son: \n- 0/4: Sin efecto\n- 5/8: Un pequeño modificador de dinastía\n- 8/11: Un modificador de dinastía influyente \n- 12: La facción toma el control del Eforado, disolviéndolo y aplicando un poderoso modificador de dinastía.#!"
 Learn_Ephorate: "#V Aprender más sobre las facciones#!"
 window_learn_ephorate_tooltip: "Abre un evento donde puedes aprender más sobre cada facción y lo que defienden."

