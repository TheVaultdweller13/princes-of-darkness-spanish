 custom_lungin_artifact_name: "Lungin"
 custom_lungin_artifact_desc: "Una pipa de madera y varias hierbas. Estas hierbas se pueden fumar para calmar la mente."
 custom_arrows_of_the_sun_artifact_name: "Flechas del Sol"
 custom_arrows_of_the_sun_artifact_desc: "Son flechas que contienen la esencia del Sol, decoradas con oro e imbuidas de fragmentos de un espíritu solar. Las flechas se inmolan tras golpear a su objetivo, causando un Daño inmenso."
 custom_thunder_dart_artifact_name: "Dardo del Trueno"
 custom_thunder_dart_artifact_desc: "Esta poderosa arma tiene el tamaño de cualquier dardo normal, pero es mucho más letal. Al ser lanzada contra un enemigo, golpea con la fuerza de un rayo, infligiendo Daño eléctrico al enemigo y a la zona circundante. Estos dardos se fabrican con hueso de monstruo y se empluman con plumas coloridas; después, se persuade a un espíritu del Trueno o de la Lluvia para que entre en el dardo."
 custom_edge_of_the_sun_artifact_name: "[fetish_artifact_icon]Filo del Sol"
 custom_edge_of_the_sun_artifact_desc: "Es un arma mortífera que portan los Mokolé para duelos rituales y ejecuciones. «Morir bajo el oro» es una expresión que designa el mal final de un infractor de la ley. El machete está forjado en oro macizo y decorado con joyas. Para crear una hoja así, el oro debe fundirse al amanecer y moldearse en la hoja, encantado para tener la dureza del acero; después deben engastarse joyas en el mango de madera de teca, y todo ello imbuirse con un espíritu de Guerra."
 custom_blade_of_the_kings_artifact_name: "[fetish_artifact_icon]Hoja de los Reyes"
 custom_blade_of_the_kings_artifact_desc: "#bold Convierte todo el Daño en [POD_aggravated_damage|E] contra personajes con [prowess|E] inferior al [artifact_power_with_icon|E] de esta hoja.#!\n\nUna espada ancestral empuñada por los Mokolé de antaño. Los Antiguos Reyes Lagarto dormían el Sueño del Dragón con un arma así a su lado. La hoja cambia de forma para adaptarse a quien la empuña; cuando el Mokolé cambia a Archid, la Hoja de los Reyes cambia para adaptarse a la nueva forma corpulenta de su portador. Estas armas se fabrican vinculando un espíritu cambiaformas, como Mariposa o Pulpo, al arma mientras se elabora. Con cada golpe que da forma al metal o la piedra de la hoja, el creador debe pronunciar el nombre del espíritu."


 custom_fetish_artifact_name: "[fetish_artifact_icon][artifact.GetOwner.GetTitledFirstNamePossessive] [artifact.GetType]"
 custom_fetish_artifact_desc: "Un [fetish|E] creado por [artifact.MakeScope.GetVariable('crafter').GetCharacter.GetTitledFirstName] tras vincular un [GetTrait('spirit').GetName(GetPlayer)] en su interior."
 custom_artifact_name: "[artifact.GetOwner.GetTitledFirstNamePossessive] [artifact.GetType]"
 custom_artifact_desc: "Un [artifact|E] creado por [artifact.MakeScope.GetVariable('crafter').GetCharacter.GetTitledFirstName] tras muchos días y noches de trabajo"



