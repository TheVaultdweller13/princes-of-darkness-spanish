 ##############################################################################
 ###### POD COMBAT  - PER-MOVE LOCALIZATION
 ##############################################################################
 # Three keys per move:
 #   (name)     - bare display name. AP cost is appended at render
 #               time by the static POD_combat_move_title loc key,
 #               so designer rebalances of AP cost stay in sync
 #               with the displayed text.
 #   _desc      - PODCombatMoveDesc call. Decision auto-loc resolves
 #               <id>_desc, so DecisionType.GetShortDescForPlayer
 #               lands here and renders the full stat card.
 #   _tooltip   - short flavor sentence.
 #               doubles as a stub for the engine's auto
 #               <id>_tooltip lookup on decision load.
 ##############################################################################

 ######### Base Physical
 POD_combat_move_strike: "@skill_prowess_icon!Golpe"
 POD_combat_move_strike_desc: "[PODCombatMoveDesc('POD_combat_move_strike')]"
 POD_combat_move_strike_tooltip: "#weak;italic Un ataque directo, según el manual.#!"
 POD_combat_move_heavy_blow: "@skill_prowess_icon!Golpe Pesado"
 POD_combat_move_heavy_blow_desc: "[PODCombatMoveDesc('POD_combat_move_heavy_blow')]"
 POD_combat_move_heavy_blow_tooltip: "#weak;italic Una paliza que tu enemigo no olvidará pronto.#!"
 POD_combat_move_quick_jab: "@skill_prowess_icon!Pinchazo Rápido"
 POD_combat_move_quick_jab_desc: "[PODCombatMoveDesc('POD_combat_move_quick_jab')]"
 POD_combat_move_quick_jab_tooltip: "#weak;italic Un golpe veloz que no te deja demasiado expuesto.#!"
