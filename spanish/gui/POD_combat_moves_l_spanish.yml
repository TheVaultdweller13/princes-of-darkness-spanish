 POD_combat_move_fae_aquis_tempus_fugit_tooltip: "#weak;italic Vacía tu mente. Hazte informe, sin forma, como el agua. Sé agua, amigo mío.#!" # Bruce Lee
 POD_combat_move_fae_aquis_healing_waters: "@fae_icon!Aguas Curativas"
 POD_combat_move_fae_aquis_healing_waters_desc: "[PODCombatMoveDesc('POD_combat_move_fae_aquis_healing_waters')]"
 POD_combat_move_fae_aquis_healing_waters_tooltip: "#weak;italic Deja que las aguas nutran y renueven a otro emisario de la paz.#!"

 ######### Inanimae Sliver Petros
 POD_combat_move_fae_petros_stoneskin: "@fae_icon!Piel de Piedra"
 POD_combat_move_fae_petros_stoneskin_desc: "[PODCombatMoveDesc('POD_combat_move_fae_petros_stoneskin')]"
 POD_combat_move_fae_petros_stoneskin_tooltip: "#weak;italic Tu piel adquiere la resistencia y el aspecto de la roca más cercana.#!"
 POD_combat_move_fae_petros_ironarm: "@fae_icon!Brazo de Hierro"
 POD_combat_move_fae_petros_ironarm_desc: "[PODCombatMoveDesc('POD_combat_move_fae_petros_ironarm')]"
 POD_combat_move_fae_petros_ironarm_tooltip: "#weak;italic Recurre al poder místico de la tierra para realizar grandes proezas de fuerza.#!"
 POD_combat_move_fae_petros_quake: "@fae_icon!Terremoto"
 POD_combat_move_fae_petros_quake_desc: "[PODCombatMoveDesc('POD_combat_move_fae_petros_quake')]"
 POD_combat_move_fae_petros_quake_tooltip: "#weak;italic Y cuando el Señor de la Montaña pateó el suelo, la tierra se abrió en grandes simas. Cuidado con la ira de quien tarda en enfadarse.#!"

 ######### Inanimae Sliver Pyros
 POD_combat_move_fae_pyros_flame: "@fae_icon!Llama"
 POD_combat_move_fae_pyros_flame_desc: "[PODCombatMoveDesc('POD_combat_move_fae_pyros_flame')]"
 POD_combat_move_fae_pyros_flame_tooltip: "#weak;italic La pasión debe compartirse. No te preocupes, tengo de sobra para los dos. Cuidado, no te quemes.#!"
 POD_combat_move_fae_pyros_tortured_heart: "@fae_icon!Corazón Torturado"
 POD_combat_move_fae_pyros_tortured_heart_desc: "[PODCombatMoveDesc('POD_combat_move_fae_pyros_tortured_heart')]"
 POD_combat_move_fae_pyros_tortured_heart_tooltip: "#weak;italic ¿Estás encendido? ¿Aguantas el calor? No es bueno reprimir los sentimientos, ¿sabes?#!"
 POD_combat_move_fae_pyros_inferno: "@fae_icon!Infierno"
 POD_combat_move_fae_pyros_inferno_desc: "[PODCombatMoveDesc('POD_combat_move_fae_pyros_inferno')]"
 POD_combat_move_fae_pyros_inferno_tooltip: "#weak;italic Arde, nena, arde.#!"

 ######### Inanimae Sliver Stratus
 POD_combat_move_fae_stratus_flight: "@fae_icon!Vuelo"
 POD_combat_move_fae_stratus_flight_desc: "[PODCombatMoveDesc('POD_combat_move_fae_stratus_flight')]"
 POD_combat_move_fae_stratus_flight_tooltip: "#weak;italic Adivina, adivinanza: ¿cómo se combate contra el aire? No es una pregunta con trampa, de verdad me gustaría saberlo. Avísame cuando lo averigües. ¿Hablo demasiado?#!"
 POD_combat_move_fae_stratus_conceal_confuse: "@fae_icon!Ocultar/Confundir"
 POD_combat_move_fae_stratus_conceal_confuse_desc: "[PODCombatMoveDesc('POD_combat_move_fae_stratus_conceal_confuse')]"
 POD_combat_move_fae_stratus_conceal_confuse_tooltip: "#weak;italic Oh, ¿qué es eso de allí?#!"

 ######### Inanimae Sliver Verdage
 POD_combat_move_fae_verdage_solarium: "@fae_icon!Solárium"
 POD_combat_move_fae_verdage_solarium_desc: "[PODCombatMoveDesc('POD_combat_move_fae_verdage_solarium')]"
 POD_combat_move_fae_verdage_solarium_tooltip: "#weak;italic Sueñas un sueño de vida, y la flora local estalla en un crecimiento que estorba a tu oponente.#!"
 POD_combat_move_fae_verdage_coalesce: "@fae_icon!Fusionar"
 POD_combat_move_fae_verdage_coalesce_desc: "[PODCombatMoveDesc('POD_combat_move_fae_verdage_coalesce')]"
 POD_combat_move_fae_verdage_coalesce_tooltip: "#weak;italic Con el susurro adecuado, un árbol se moldeará en armadura y la madera se volverá tan dura como el acero.#!"

 ######### Hekau Alchemy
 POD_combat_move_mummy_alchemy_cloud_of_smoke: "@mummy_icon!Nube de Humo"
 POD_combat_move_mummy_alchemy_cloud_of_smoke_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_cloud_of_smoke')]"
 POD_combat_move_mummy_alchemy_cloud_of_smoke_tooltip: "#weak;italic Un truco sencillo para el maestro alquimista, pero un enemigo sin vista es un enemigo mucho más débil.#!" 
 POD_combat_move_mummy_alchemy_dangerous_poison: "@mummy_icon!Veneno Peligroso"
 POD_combat_move_mummy_alchemy_dangerous_poison_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_dangerous_poison')]"
 POD_combat_move_mummy_alchemy_dangerous_poison_tooltip: "#weak;italic La picadura del escorpión en un simple brebaje.#!" 
 POD_combat_move_mummy_alchemy_potion_of_valor: "@mummy_icon!Poción de Valor"
 POD_combat_move_mummy_alchemy_potion_of_valor_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_potion_of_valor')]"
 POD_combat_move_mummy_alchemy_potion_of_valor_tooltip: "#weak;italic Los verdaderos héroes no necesitan suplementos. Pero también son difíciles de encontrar hoy en día.#!" 
 POD_combat_move_mummy_alchemy_potent_tonic: "@mummy_icon!Tónico Potente"
 POD_combat_move_mummy_alchemy_potent_tonic_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_potent_tonic')]"
 POD_combat_move_mummy_alchemy_potent_tonic_tooltip: "#weak;italic Un ungüento de curación alquímica, heredado de las mentes más grandes que hicieron posible la resurrección.#!" 
 POD_combat_move_mummy_alchemy_vile_body: "@mummy_icon!Poción del Cuerpo Vil"
 POD_combat_move_mummy_alchemy_vile_body_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_vile_body')]"
 POD_combat_move_mummy_alchemy_vile_body_tooltip: "#weak;italic Con esta poción, la verdad de la Momia queda al descubierto. La inmundicia de esta criatura que se burla del orden natural de las cosas abate a quienes se atreven a acercarse.#!" 

 ######### Hekau Amulets
 POD_combat_move_mummy_amulets_simple_ward: "@mummy_icon!Resguardo Simple"
 POD_combat_move_mummy_amulets_simple_ward_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_simple_ward')]"
 POD_combat_move_mummy_amulets_simple_ward_tooltip: "#weak;italic Una simple palabra de poder, suficiente para resguardarte del daño que pretenden causarte.#!" 
 POD_combat_move_mummy_amulets_veil_of_amaunet: "@mummy_icon!Velo de Amaunet"
 POD_combat_move_mummy_amulets_veil_of_amaunet_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_veil_of_amaunet')]"
 POD_combat_move_mummy_amulets_veil_of_amaunet_tooltip: "#weak;italic El ojo de la Diosa primordial te protege de la mirada de los incrédulos.#!" 
 POD_combat_move_mummy_amulets_wrappings_imhotep: "@mummy_icon!Vendajes de Imhotep"
 POD_combat_move_mummy_amulets_wrappings_imhotep_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_wrappings_imhotep')]"
 POD_combat_move_mummy_amulets_wrappings_imhotep_tooltip: "#weak;italic La momificación requirió muchos intentos de algunos de los individuos más sabios que el mundo ha visto jamás. Hasta una fracción de su poder es grandiosa por sí sola.#!" 
 POD_combat_move_mummy_amulets_eye_of_sekhmet: "@mummy_icon!Ojo de Sekhmet"
 POD_combat_move_mummy_amulets_eye_of_sekhmet_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_eye_of_sekhmet')]"
 POD_combat_move_mummy_amulets_eye_of_sekhmet_tooltip: "#weak;italic La Diosa guerrera los mira y los considera indignos. Temen su propia debilidad.#!" 
 POD_combat_move_mummy_amulets_buckle_of_isis: "@mummy_icon!Hebilla de Isis"
 POD_combat_move_mummy_amulets_buckle_of_isis_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_buckle_of_isis')]"
 POD_combat_move_mummy_amulets_buckle_of_isis_tooltip: "#weak;italic La madre de la magia no tuvo igual. El mero hecho de invocar su nombre doblegará a los patéticos sobrenaturales de la era moderna.#!" 

 ######### Hekau Celestial
 POD_combat_move_mummy_celestial_book_of_thoth: "@mummy_icon!Libro de Tot"
 POD_combat_move_mummy_celestial_book_of_thoth_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_book_of_thoth')]"
 POD_combat_move_mummy_celestial_book_of_thoth_tooltip: "#weak;italic Tot, el más sabio, lo sabía todo. Incluso comprender una fracción de su conocimiento es una tremenda ventaja en la batalla.#!" 
 POD_combat_move_mummy_celestial_sahu_ra: "@mummy_icon!Sahu-Ra"
 POD_combat_move_mummy_celestial_sahu_ra_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_sahu_ra')]"
 POD_combat_move_mummy_celestial_sahu_ra_tooltip: "#weak;italic El todopoderoso Ra ni siquiera necesita mirarlos desde arriba. Su mero resplandor abrasa a quienes acechan en las sombras.#!" 
 POD_combat_move_mummy_celestial_ras_awakening: "@mummy_icon!Despertar de Ra"
 POD_combat_move_mummy_celestial_ras_awakening_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_ras_awakening')]"
 POD_combat_move_mummy_celestial_ras_awakening_tooltip: "#weak;italic El dios de los dioses mira con buenos ojos a sus guerreros, incluso eones después de que los mortales desagradecidos lo olvidaran.#!" 
 POD_combat_move_mummy_celestial_call_the_stars: "@mummy_icon!Llamar a las Estrellas"
 POD_combat_move_mummy_celestial_call_the_stars_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_call_the_stars')]"
 POD_combat_move_mummy_celestial_call_the_stars_tooltip: "#weak;italic Nuestros sabios contemplaron las estrellas y se maravillaron en eras pasadas. Recordemos a los incrédulos de hoy la razón de ello.#!" 
 POD_combat_move_mummy_celestial_sandstorm: "@mummy_icon!Tormenta de Arena"
 POD_combat_move_mummy_celestial_sandstorm_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_sandstorm')]"
 POD_combat_move_mummy_celestial_sandstorm_tooltip: "#weak;italic ¿Qué pueden hacer cuando la sangre dorada de nuestro propio desierto los ataca? Nada, salvo quejarse de que se te mete por todas partes.#!" 

 ######### Hekau Effigy
 POD_combat_move_mummy_effigy_false_door: "@mummy_icon!Puerta Falsa"
 POD_combat_move_mummy_effigy_false_door_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_effigy_false_door')]"
 POD_combat_move_mummy_effigy_false_door_tooltip: "#weak;italic Los magos de hoy usan portales para moverse por el campo de batalla, una pálida imitación de la gloria de una puerta dorada y reluciente que de pronto espera tu orden para abrirse.#!" 
 POD_combat_move_mummy_effigy_command_complex_implement: "@mummy_icon!Ordenar Artefacto Complejo"
 POD_combat_move_mummy_effigy_command_complex_implement_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_effigy_command_complex_implement')]"
 POD_combat_move_mummy_effigy_command_complex_implement_tooltip: "#weak;italic Los guardianes de las tumbas de tu pueblo eran mucho más complejos que los mezquinos dispositivos de hoy. No necesitas tutorial.#!" 
 POD_combat_move_mummy_effigy_reflected_strike: "@mummy_icon!Golpe Reflejado"
 POD_combat_move_mummy_effigy_reflected_strike_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_effigy_reflected_strike')]"
 POD_combat_move_mummy_effigy_reflected_strike_tooltip: "#weak;italic Una Momia es un ser atado a dos mundos, ni muerto ni vivo. El verdaderamente sabio entiende cómo golpear a ambos a la vez cuando hace falta.#!" 
 POD_combat_move_mummy_effigy_living_bond: "@mummy_icon!Vínculo Vivo del Destino"
 POD_combat_move_mummy_effigy_living_bond_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_effigy_living_bond')]"
 POD_combat_move_mummy_effigy_living_bond_tooltip: "#weak;italic El destino de cada cual queda escrito en el momento en que nace. No eran más libres antes de que los ataras a su propio destino.#!" 

 ######### Hekau Necromancy
 POD_combat_move_mummy_necromancy_deaths_shroud: "@mummy_icon!Sudario de la Muerte"
 POD_combat_move_mummy_necromancy_deaths_shroud_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_deaths_shroud')]"
 POD_combat_move_mummy_necromancy_deaths_shroud_tooltip: "#weak;italic Tal es el poder de la muerte. La quietud lenta y agónica que no es más que el preludio de un final silencioso.#!" 
 POD_combat_move_mummy_necromancy_banish_dead: "@mummy_icon!Desterrar a los Muertos"
 POD_combat_move_mummy_necromancy_banish_dead_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_banish_dead')]"
 POD_combat_move_mummy_necromancy_banish_dead_tooltip: "#weak;italic Los muertos no tienen poder aquí. Salvo tú, claro.#!" 
 POD_combat_move_mummy_necromancy_deaths_hand: "@mummy_icon!Mano de la Muerte"
 POD_combat_move_mummy_necromancy_deaths_hand_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_deaths_hand')]"
 POD_combat_move_mummy_necromancy_deaths_hand_tooltip: "#weak;italic La Momia deja caer por un instante la burla de vida que le concedió el Hechizo de la Vida. El grotesco horror de su condición queda al descubierto cuando sus frías manos esqueléticas entran en contacto con el enemigo.#!" 
 POD_combat_move_mummy_necromancy_khaibits_embrace: "@mummy_icon!Abrazo de Khaibit"
 POD_combat_move_mummy_necromancy_khaibits_embrace_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_khaibits_embrace')]"
 POD_combat_move_mummy_necromancy_khaibits_embrace_tooltip: "#weak;italic La sola presencia del alma de la Momia ralentiza el campo de batalla, como si la propia realidad estuviera desconcertada ante esta criatura anacrónica.#!" 
 POD_combat_move_mummy_necromancy_scouring_oblivion: "@mummy_icon!Olvido Purificador"
 POD_combat_move_mummy_necromancy_scouring_oblivion_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_scouring_oblivion')]"
 POD_combat_move_mummy_necromancy_scouring_oblivion_tooltip: "#weak;italic Esta criatura es la portadora de la muerte. Nunca comerá, nunca dormirá y nunca se detendrá.#!" 

 ######### Hekau Nomenclature
 POD_combat_move_mummy_nomenclature_asking_trees: "@mummy_icon!Interrogar a los Árboles"
 POD_combat_move_mummy_nomenclature_asking_trees_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_asking_trees')]"
 POD_combat_move_mummy_nomenclature_asking_trees_tooltip: "#weak;italic La fauna y la flora tienen Nombres Verdaderos sencillos. Aunque solo pueden ser ordenados hasta cierto punto, producen un efecto bastante sorprendente en el campo de batalla.#!" 
 POD_combat_move_mummy_nomenclature_mend_flesh: "@mummy_icon!Reparar la Carne"
 POD_combat_move_mummy_nomenclature_mend_flesh_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_mend_flesh')]"
 POD_combat_move_mummy_nomenclature_mend_flesh_tooltip: "#weak;italic Las heridas son simplemente un patrón primordial roto. El verdadero maestro de los Nombres simplemente desea que recupere su forma original.#!" 
 POD_combat_move_mummy_nomenclature_command_thought: "@mummy_icon!Ordenar el Pensamiento"
 POD_combat_move_mummy_nomenclature_command_thought_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_command_thought')]"
 POD_combat_move_mummy_nomenclature_command_thought_tooltip: "#weak;italic A algunos aprendices les gusta agitar las manos ante sus objetivos para lograr este efecto. El verdadero maestro solo necesita susurrar la orden.#!" 
 POD_combat_move_mummy_nomenclature_bodys_destruction: "@mummy_icon!Nombrar la Destrucción del Cuerpo"
 POD_combat_move_mummy_nomenclature_bodys_destruction_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_bodys_destruction')]"
 POD_combat_move_mummy_nomenclature_bodys_destruction_tooltip: "#weak;italic A menudo el poder más temido de una Momia: con solo pronunciar el nombre de una parte del cuerpo, puede devolverla a su forma primordial. Al fin y al cabo, las cenizas serán cenizas.#!" 
 POD_combat_move_mummy_nomenclature_whispers_body: "@mummy_icon!Susurros al Cuerpo"
 POD_combat_move_mummy_nomenclature_whispers_body_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_whispers_body')]"
 POD_combat_move_mummy_nomenclature_whispers_body_tooltip: "#weak;italic La carne es maleable. Entonando Nombres Verdaderos en un torbellino de lenguas confusas para el no iniciado, la Momia transforma su cuerpo en armas y armaduras vivientes según haga falta.#!" 

 ######### Hunter Generic
 POD_combat_move_hunter_silvered_bolt: "@supehunter_icon!Virote de Plata"
 POD_combat_move_hunter_silvered_bolt_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_silvered_bolt')]"
 POD_combat_move_hunter_silvered_bolt_tooltip: "#weak;italic Dale a un hombre lobo algo por lo que recordarte antes de que te despedace.#!"
 POD_combat_move_hunter_stake_attack: "@supehunter_icon!Ataque con Estaca"
 POD_combat_move_hunter_stake_attack_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_stake_attack')]"
 POD_combat_move_hunter_stake_attack_tooltip: "#weak;italic Conozco tu debilidad, engendro.#!"

 ######### Hunter Red
 POD_combat_move_hunter_red_sunstone: "@supehunter_icon!Piedra del Sol"
 POD_combat_move_hunter_red_sunstone_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_red_sunstone')]"
 POD_combat_move_hunter_red_sunstone_tooltip: "#weak;italic Otra vez Jesús les habló, diciendo: Yo soy la luz del mundo; el que me sigue, no andará en tinieblas, sino que tendrá la luz de la vida.#!" # John 8:12 KJV

 ######### Hunter Acre
 POD_combat_move_hunter_acre_transfiguration: "@supehunter_icon!Transfiguración de la Carne"
 POD_combat_move_hunter_acre_transfiguration_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_acre_transfiguration')]"
 POD_combat_move_hunter_acre_transfiguration_tooltip: "#weak;italic Y sus ojos eran como llama de fuego, y sus pies semejantes al bronce bruñido, refulgente como en un horno.#!" # Revelation 1:14-15 KJV
 POD_combat_move_hunter_acre_flight_of_angels: "@supehunter_icon!Vuelo de Ángeles"
 POD_combat_move_hunter_acre_flight_of_angels_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_acre_flight_of_angels')]"
 POD_combat_move_hunter_acre_flight_of_angels_tooltip: "#weak;italic Pero los que esperan a Jehová renovarán sus fuerzas; levantarán alas como las águilas; correrán, y no se cansarán.#!" # Isaiah 40:31 KJV
 POD_combat_move_hunter_acre_auto_da_fe: "@supehunter_icon!Auto de Fe"
 POD_combat_move_hunter_acre_auto_da_fe_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_acre_auto_da_fe')]"
 POD_combat_move_hunter_acre_auto_da_fe_tooltip: "#weak;italic Por eso te hiero con un golpe doloroso, dejándote desolado por causa de tus pecados.#!" # Micah 6:13 ESV

 ######### Hunter Sisters
 POD_combat_move_hunter_sisters_fiat_lux: "@supehunter_icon!Fiat Lux"
 POD_combat_move_hunter_sisters_fiat_lux_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_sisters_fiat_lux')]"
 POD_combat_move_hunter_sisters_fiat_lux_tooltip: "#weak;italic Y dijo Dios: ¡Sea la luz! Y fue la luz.#!" # Genesis 1:3 KJV
 POD_combat_move_hunter_sisters_chorale: "@supehunter_icon!Coral"
 POD_combat_move_hunter_sisters_chorale_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_sisters_chorale')]"
 POD_combat_move_hunter_sisters_chorale_tooltip: "#weak;italic Venid, cantemos alegremente a Jehová; aclamemos con júbilo a la roca de nuestra salvación.#!" # Psalm 95:1 KJV
 POD_combat_move_hunter_sisters_oratorio: "@supehunter_icon!Oratorio"
 POD_combat_move_hunter_sisters_oratorio_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_sisters_oratorio')]"
 POD_combat_move_hunter_sisters_oratorio_tooltip: "#weak;italic Pero yo cantaré de tu poder, y alabaré de mañana tu misericordia; porque has sido mi amparo y refugio en el día de mi angustia.#!" # Psalm 59:16 KJV

 ######### Hunter Murnau
 POD_combat_move_hunter_murnau_mirror_of_evil: "@supehunter_icon!Espejo del Mal"
 POD_combat_move_hunter_murnau_mirror_of_evil_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_murnau_mirror_of_evil')]"
 POD_combat_move_hunter_murnau_mirror_of_evil_tooltip: "#weak;italic Pero si os mordéis y os coméis unos a otros, mirad que no os consumáis unos a otros.#!" # Galatians 5:15 KJV
 POD_combat_move_hunter_murnau_arcana: "@supehunter_icon!Arcana"
 POD_combat_move_hunter_murnau_arcana_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_murnau_arcana')]"
