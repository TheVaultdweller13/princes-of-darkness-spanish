 umbra_discovery_grand_hall_expedition: "Explorador Umbrío"
 umbra_discovery.grand_hall_expedition.desc: "Mientras exploraba el laberíntico $umbra_discovery_region$, un espíritu amigable se ha acercado a $umbra_discovery_finder$ ofreciendo sus servicios para una exploración más profunda. Esta oferta podría ser digna de una [umbra_expedition|E]"
 umbra_discovery_heaven_expedition: "Escalera al Cielo"
 umbra_discovery.heaven_expedition.desc: "Mientras explorabas las zonas más remotas de la Umbra Profunda, $umbra_discovery_finder$ encontró una brillante puerta de perla fundida. Un resplandor blanco emanaba de la barrera, bañándote en un consuelo indescriptible. No se te permitió entrar, pero ¿quizás tu fe inquebrantable podría llevarte a donde ellos fallaron? Si es así, una [umbra_expedition|E] al propio $umbra_discovery_region$ es necesaria."
 umbra_discovery_epiphamies_expedition: "La Fortaleza de la Insensatez de la Humanidad"
 umbra_discovery.epiphamies_expedition.desc: "Mientras exploraba el $umbra_discovery_region$, el señorío de los conceptos abstractos dotados de forma, $umbra_discovery_finder$ encontró un castillo monumental que resonaba con poder. Aunque hay un aura de inquietud a su alrededor, aún podría ser digno de una [umbra_expedition|E]."
