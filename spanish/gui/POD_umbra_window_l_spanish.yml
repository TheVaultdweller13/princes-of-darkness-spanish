 # Umbra Location
 
 umbra_realm_earth: "Tierra"
 umbra_realm_earth_desc: "El mundo material. Entre los mundos de realidad «sólida» dentro del Teluria, la Tierra se denomina a menudo «el Señorío», lo que implica su primacía. La celestina del planeta es, por supuesto, Gaia, y la sombra de la Tierra se llama [UmbraGlossary('penumbra')].\n\n$POD_splat_werewolf_plural$ y otros cambiaformas se refieren a ella como el «[Glossary('Reino de Gaia','game_concept_gaia_realm_desc')]», en honor a Gaia, el espíritu de la Tierra.\n\n$POD_splat_wraith_plural$ llaman a este reino [Glossary('Tierras de Piel','game_concept_skinlands_desc')], en contraste con las [UmbraGlossary('shadowlands')] (la Penumbra Oscura) que conectan con el [UmbraGlossaryLocalized('shadowlands','Inframundo')] (la Umbra Oscura).\n\nEn el lenguaje común de los #TOOLTIP:GAME_TRAIT,hadas,[GetNullCharacter] #L Kithain#!#!, el Mundo Despierto es la Tierra... la parte de la Tierra que no está en las Umbras ni en el [UmbraGlossary('dreaming')]. También llamado Mundo de Otoño, la Tierra de los Sueños Incumplidos y el Mundo de la Carne."
 earth_effect_desc: ""

 umbra_realm_penumbra: "Penumbra"
 umbra_realm_penumbra_desc: "La Penumbra, también conocida como la Sombra de la Tierra, es el [spirit_world|E] que rodea directamente al mundo físico. Muchas características del terreno, aunque no todas, tienen sus reflejos allí."
 
 umbra_realm_astral_reaches: "Confines Astrales"
 game_concept_high_umbra: "Umbra Alta"
 game_concept_astral_umbra: "Umbra Astral"
 umbra_realm_astral_reaches_desc: "Los Límites Astrales, también llamados Umbra Astral, Umbra Alta o Umbra Superior, son los señoríos del pensamiento, de la idea y del concepto."
 
 umbra_realm_dreaming: "Ensueño"
 umbra_realm_dreaming_desc: "Como una postal de vacaciones, cuando la humanidad empezó a depositar más fe en los hechos fríos y duros (y en el hierro frío y duro) por encima del capricho y la fantasía, las partes míticas del mundo se ramificaron hacia un nivel superpuesto de la realidad llamado El Ensueño."

 umbra_realm_underworld: "Inframundo"
 game_concept_yin_world: "Mundo Yin"
 game_concept_dark_umbra: "Umbra Oscura"
 umbra_realm_underworld_desc: "El Inframundo, también conocido como Umbra Oscura o Contrarium, es el dominio de los muertos y los recuerdos."
 
 umbra_realm_paradox_realms: "Reino de la Paradoja"
 umbra_realm_paradox_realms_desc: "Los Reinos de la Paradoja son señoríos privados creados por la paradoja acumulada en un mago particularmente vulgar. Los reinos de la paradoja suelen adoptar formas relacionadas con la ofensa que los desencadenó; un mago exiliado por lanzar una bola de fuego podría encontrarse en la orilla de un lago de fuego eterno, o en una ciudad de cerillas."
 paradox_realms_effect_desc: ""
 
 umbra_realm_heaven: "Paraíso"
 umbra_realm_heaven_desc: "El Paraíso es la morada etérea y de otro mundo de Dios y los Elohim. Era el hogar de los Caídos antes de la Rebelión.\nDesde el fin de la Guerra de la Ira, no se ha establecido contacto con el Paraíso y la mano del Creador se ha distanciado mayormente de la creación caída.\n\nUn reflejo del Paraíso aún existe en la [umbra|E], llamado Paraíso por sus habitantes. Está modelado más según la percepción humana del Paraíso que comparado realmente con el original."
 heaven_effect_desc: ""
 
 umbra_realm_dreamtime: "Tiempo del Sueño"
 umbra_realm_dreamtime_desc: "El Tiempo del Sueño es un Señorío de Adelgazamiento, un Señorío poco común en la superficie misma de la [umbra|E], justo entre la Celosía y el comienzo de la [umbra|E], que se encuentra solo en Australia."
 dreamtime_effect_desc: ""
 
 umbra_realm_chimare: "Chimare"
 umbra_realm_chimare_desc: "Algunos Garou creen que cada sueño tiene una representación en el Chimare. Esto no es cierto; la [UmbraGlossary('penumbra')] no es lo suficientemente grande. Tampoco representan todos los sueños, pero ocurren cada vez que un sueño alcanza un grado de prominencia en el subconsciente cultural. Las variaciones populares también reciben sus propios Chimares. Todo un grupo de Chimares representa variaciones de sueños sobre «actuar desnudo» y «caer»."
 chimare_effect_desc: ""
 
 umbra_realm_demesne: "Demesne"
 umbra_realm_demesne_desc: "Un Demesne es el espacio personal de un mago dentro del [UmbraGlossary('dreaming')].\n\nPara alcanzarlo, es necesaria una conexión especial con los propios sueños que rara vez puede enseñarse, aunque un Adelgazamiento puede ser útil. Los magos poderosos suelen tener el control total sobre su tierra de ensueño, mientras que los magos menores ocasionalmente tienen visitantes de su subconsciente."
 demesne_effect_desc: ""
 
 umbra_realm_near_dreaming: "Ensueño Próximo"
 umbra_realm_near_dreaming_desc: "El Ensueño Próximo es la parte del [UmbraGlossary('dreaming')] más cercana al Mundo Mundano."
 near_dreaming_effect_desc: ""
 
 umbra_realm_far_dreaming: "Ensueño Lejano"
 umbra_realm_far_dreaming_desc: "El Ensueño Lejano es la parte del [UmbraGlossary('dreaming')] que corresponde a los sueños colectivos de la humanidad."
 far_dreaming_effect_desc: ""
 
 umbra_realm_deep_dreaming: "Ensueño Profundo"
 umbra_realm_deep_dreaming_desc: "El Ensueño Profundo es la parte del [UmbraGlossary('dreaming')] más alejada del Mundo de la Vigilia."
 deep_dreaming_effect_desc: ""
 
 umbra_realm_arcadia: "Arcadia"
 umbra_realm_arcadia_desc: "Arcadia es el hogar original de las hadas."
 arcadia_effect_desc: ""
 
 umbra_realm_kingdom_of_dan: "Reino de Dán"
 umbra_realm_kingdom_of_dan_desc: "El Reino de [Glossary('Dán','game_concept_dan_desc')] es uno de los [Glossary('Oneiric Realm','game_concept_oneiric_realm_desc')] del [UmbraGlossary('deep_dreaming')].\n\nEn un mundo sin fronteras constantes, existen dos líneas hipotéticas mediante las cuales algunos cartógrafos de sueños miden la extensión del conocido [UmbraGlossary('dreaming')]: El Eje y el Ecuatorial. El primero mide el [UmbraGlossary('dreaming')] de arriba abajo. El segundo atraviesa la mediana horizontal del [UmbraGlossary('dreaming')], actuando como un ecuador aproximado. Como ocurre con cualquier medición en el [UmbraGlossary('dreaming')], esto es en gran medida un artificio intelectual diseñado para dar algo de orden a un universo que, de otro modo, sería caótico. En la cima de este Eje ficticio se encuentra el Reino de [Glossary('Dán','game_concept_dan_desc')]."
 kingdom_of_dan_effect_desc: ""
 
 umbra_realm_kureksarra: "Kureksarra"
 umbra_realm_kureksarra_desc: "Kureksarra, conocida como las Llanuras Rojas, es un [Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')] en el [UmbraGlossary('dreaming')].\n\nDominio de una guerra sin fin, Kureksarra es la tierra natal de los sueños de contienda, competición, victoria y venganza. Una vasta llanura salpicada de ruinas de instalaciones fortificadas, Kureksarra fue una vez un reino verde de paisajes suaves y plácidas mansiones señoriales. Ahora, lo único que perdura es una tierra tan sembrada de huesos y armas rotas que el suelo se niega a dar a luz a nada vivo. Solo quedan los marchitos robles viejos, goteando sangre como savia roja cuando llueve. Los senderos que entran y salen de Kureksarra son caminos de cuchillas y ríos de navajas. Las antaño elegantes Ciudades Gemelas del reino son ruinas rotas llenas de huesos y del olor a sangre en el polvo."
 kureksarra_effect_desc: ""
 
 umbra_realm_rubezhal: "Rubezhal"
 umbra_realm_rubezhal_desc: "Rubezhal es un [Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')] en el [UmbraGlossary('dreaming')].\n\nHiddo justo bajo la superficie del [UmbraGlossary('dreaming')], en túneles, cavernas y huecos encantados bajo las colinas, el dominio de Rubezhal es casi un mundo en sí mismo. Las hadas construyeron aquí muchos de sus señoríos más ornamentados entre las raíces del Sueño y las montañas, señoríos tejidos con gemas y metales preciosos e iluminados por soles y lunas interiores hábilmente forjados."
 rubezhal_effect_desc: ""
 
 umbra_realm_capecia: "Capecia"
 umbra_realm_capecia_desc: "Capecia, la Ciudad de los Relojes, es un [Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')] en el [UmbraGlossary('dreaming')].\n\nEl Glamour de Capecia trata sobre la victoria del artificio sobre la naturaleza. Aquí, en la Ciudad de los Relojes, changelings esclavizados y sus aliados humanos han creado un reino gobernado por juguetes de hojalata y autómatas, marionetas y muñecas de papel. Las habilidades de los artesanos han conquistado el tiempo construyendo no en carne, sino en materiales más duraderos: bronce y plástico, alambre y cuero, madera de corazón y goma. Todo en esta bulliciosa ciudad no solo es artificial, sino automatizado. Es un mundo donde los changelings de carne flotan como fantasmas desconcertados. Los maniquíes llenan las aceras móviles y se apresuran con sus piernas de articulaciones rígidas mientras bailan su danza que nunca termina. Arriba, la gente-marioneta observa con sus ojos de cristal a través de las ventanas de las oficinas, mientras otros charlan sobre cualquier cosa que entre en sus cabezas rellenas de periódicos. El perro de hojalata persigue al gato de hojalata, que persigue al ratón de hojalata sin cesar."
 capecia_effect_desc: ""
 
 umbra_realm_irrgarten: "Irrgarten"
 umbra_realm_irrgarten_desc: "Irrgarten es un [Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')] en el [UmbraGlossary('dreaming')] asociado con el vagabundeo.\n\nDonde los senderos sinuosos se cruzan y se unen, allí encontrarás Irrgarten. Este señorío es la fuente y el centro de los sueños de vagar por caminos enredados y ramificados. Ya sean esos caminos los pasillos de un laberinto de piedra, los hilos de un juego de hilos o los senderos cubiertos de maleza del matorral del bosque, todos son facetas de Irrgarten. Todos los que vienen aquí intencionadamente para buscar el arte de los senderos u otra sabiduría deben enfrentarse a la posibilidad de no volver a encontrar nunca el camino de salida. Los individuos con la mala suerte de llegar aquí accidentalmente están condenados, a menos que tengan tanto suerte como ingenio de su lado."
 irrgarten_effect_desc: ""
 
 umbra_realm_arike: "Ariké"
 umbra_realm_arike_desc: "Ariké, el Imperio del Arrepentimiento, es un [Glossary(Localize('game_concept_hearts_realm'),'game_concept_hearts_realm_desc')] en el [UmbraGlossary('dreaming')].\n\nTodo lo que has perdido está aquí. Los amigos y amantes que no volverás a ver, los caminos por los que nunca caminarás, los momentos por los que pagarías mucho por vivir de nuevo... todo está aquí. Esto es Ariké, donde nacen los sueños de lo que fue y lo que pudo haber sido."
 arike_effect_desc: ""
 
 umbra_realm_myrmitown: "Myrmitown"
 umbra_realm_myrmitown_desc: "Myrmitown es un [Glossary('Home Realm','game_concept_home_realm_desc')] de los Boggans.\n\nLo más sorprendente de Myrmitown es la arquitectura y las hormigas quiméricas gigantes que los boggans utilizan como bestias de carga. Estas hormigas se utilizan para todo, desde comida hasta transporte. Los boggans de aquí son tan expertos en la cría de tales quimeras que tienen un tipo diferente de hormiga para cada tipo de trabajo."
 myrmitown_effect_desc: ""
 
 umbra_realm_the_tunnels: "Los Túneles"
 umbra_realm_the_tunnels_desc: "Los Túneles son un [Glossary('Home Realm','game_concept_home_realm_desc')] para los Sluagh.\n\nLos Túneles son una red subterránea laberíntica. Es muy fácil perderse aquí; apenas hay luz y se han abierto grandes abismos en el suelo recientemente. Incluso los Sluagh familiarizados con la zona a veces se pierden, ya que pasajes antes transitables se vuelven intransitables debido a desprendimientos o derrumbes de rocas. También hay muchos habitantes quiméricos peligrosos. La mayoría son amigables con los Sluagh, pero ocasionalmente no se desconocen ataques contra ellos por parte de chimera locas."
 the_tunnels_effect_desc: ""
 
 umbra_realm_balloon: "Globo"
 umbra_realm_balloon_desc: "Globo es un [Glossary('Home Realm','game_concept_home_realm_desc')] de los Pooka.\n\nHay varias entradas en Globo, cada una con trampas de prueba a lo largo del camino y un frecuente tráfico de visitantes que van y vienen. Casi todo el mundo es bienvenido, excepto las personas de tendencia más violenta (un redcap Oscuro que entre en Globo buscando cena probablemente sea humillado, magullado y finalmente expulsado a botes, con el cuerpo golpeado en mil lugares, si es que sobrevive al rebote). Incluso los sidhe son bienvenidos y a veces aceptados si no intentan dominar a todos los que ven y mantienen un aire de «diversión». Por supuesto, ninguna de las trampas de la entrada ni las bromas sociales habituales pueden hacer que un sidhe parezca ridículo, pero eso no impide que la mayoría de los habitantes de Globo lo intenten."
 balloon_effect_desc: ""
 
 umbra_realm_vale_of_mists: "Valle de las Nieblas"
 umbra_realm_vale_of_mists_desc: "El Valle de las Nieblas es la barrera mística que separa el [UmbraGlossary('near_dreaming')] del [UmbraGlossary('far_dreaming')] y del [UmbraGlossary('deep_dreaming')], donde las Nieblas del Olvido son más fuertes."
 vale_of_mists_effect_desc: ""
 
 umbra_realm_fields_behind: "Campos de Atrás"
 umbra_realm_fields_behind_desc: "Los Campos Posteriores son un señorío de transición entre el Cercano y [UmbraGlossary('far_dreaming')], dentro del [UmbraGlossary('vale_of_mists')] y parte de los Campos mayores."
 fields_behind_effect_desc: ""
 
 umbra_realm_bullydale_wastes: "Páramos de Bullydale"
 umbra_realm_bullydale_wastes_desc: "Los Páramos de Bullydale son un [Glossary('Reino de Pesadilla','game_concept_nightmare_realm_desc')] en el [UmbraGlossary('dreaming')].\n\nPasado el [UmbraGlossary('fields_behind')], los pasos se vuelven traicioneros, pareciéndose menos a caminos y más a sendas de cabras o rastros de caza. Las aldeas de hadas se vuelven más pequeñas y menos comunes, escaseando hasta que el viajero se encuentra solo, salvo por alguna cabaña tosca de vez en cuando. Los propios habitantes de las cabañas se vuelven cada vez más extraños, y esta es una región de caníbales, invertidos, bandidos y brujas."
 bullydale_wastes_effect_desc: ""
 
 umbra_realm_low_dukedoms: "Bajos Ducados"
 umbra_realm_low_dukedoms_desc: "Los Bajos Ducados de Quox y Mux son [Glossary('Reinos de Sueño','game_concept_dream_realm_desc')] cerca del [UmbraGlossary('vale_of_mists')].\n\nHacia los límites de los [UmbraGlossary('bullydale_wastes')], el egoísmo mezquino y la violencia se vuelven más irracionales; los conjuros, cada vez más escandalosos. Las reglas habituales se deforman y finalmente colapsan en el absurdo. Una vez que el comportamiento totalmente absurdo es la norma, entonces el viajero ha llegado a los Bajos Ducados, el corazón del engaño y la comedia física en el [UmbraGlossary('dreaming')]."
 low_dukedoms_effect_desc: ""
 
 umbra_realm_blotkeldur: "Blotkeldur"
 umbra_realm_blotkeldur_desc: "Blotkeldur es un [Glossary('Reino de Pesadilla','game_concept_nightmare_realm_desc')] en el [UmbraGlossary('near_dreaming')].\n\nLos acheri nómadas nunca han tenido un [Glossary('Home Realm','game_concept_home_realm_desc')], pero si lo tuvieran, algunos dicen que Blotkeldur les vendría bien. Frío, húmedo y lúgubre, Blotkeldur es una ciénaga interminable de pantanos envenenados, ríos poco profundos y serpenteantes y matorrales enfermizos. En las regiones más oscuras del reino se encuentran vastas ciudades ciclópeas construidas con los huesos de marfil desnudados de behemots extintos hace mucho tiempo en todo excepto en el [UmbraGlossary('dreaming')] más profundo."
 blotkeldur_effect_desc: ""
 
 umbra_realm_wastelands: "Tierras Baldías"
 umbra_realm_wastelands_desc: "Las Tierras Baldías son un [Glossary('Reino de Pesadilla','game_concept_nightmare_realm_desc')] en el [UmbraGlossary('deep_dreaming')] y el hogar del Pozo de las Penas Contadas.\n\nLas Tierras Baldías son un lugar oscuro y miserable donde las pesadillas ejercen un dominio eterno. En este [Glossary('Reino de Pesadilla','game_concept_nightmare_realm_desc')] interminable, las pasiones y miedos más retorcidos de los mortales se pudren y crecen. Bosques de hongos y valles llenos de líquenes húmedos y venenosos cubren tierras que alguna vez albergaron palacios capaces de rivalizar con [UmbraGlossary('arcadia')]. En este lugar, la oscuridad es total y los Thallain ejercen un reinado innegable sobre la tierra. Ningún changeling cuerdo se atrevería a visitar este lugar, salvo por un simple hecho: el Pozo de las Penas Contadas descansa en el centro de las Tierras Baldías. Se dice que el Pozo revela todo el pasado a cualquiera que pueda soportar contemplar sus profundidades. Muchos changelings en los Reinos Profundos afirman haber tenido visiones del Pozo. Puede que no sea más que una mentira creada por los gobernantes de los [Glossary('Reinos de Pesadilla','game_concept_nightmare_realm_desc')], o puede que sea algo más. Algunos afirman que es una posible vía para todos los Kithain."
 wastelands_effect_desc: ""
 
 umbra_realm_hieronymus_continuum: "Continuo de Hieronymus"
 umbra_realm_hieronymus_continuum_desc: "El Continuo de Hieronymus es un [Glossary('Reino de Sueño','game_concept_dream_realm_desc')] en el Lejano o, según algunos, en el [UmbraGlossary('deep_dreaming')], el lugar de nacimiento de los Nockers.\n\nLa apariencia y dimensiones reales del reino son objeto de gran debate entre los físicos nocker. Algunas leyendas sostienen que los primeros nockers vinieron de este Reino de Sueño y viajaron a la Tierra en un huevo mecánico gigante. Pocos nockers apoyan este relato, reconociendo en privado a [UmbraGlossary('arcadia')] como su verdadero hogar, pero casi todos ellos sacarán el cuento como una navaja automática en una discusión como «prueba» de su superioridad sobre los demás hadas. Algunos afirman que el continuo es más que otro reino de sueño, sino que es parte de una dimensión totalmente diferente que existe fuera del [UmbraGlossary('dreaming')] en un pliegue del continuo espacio-tiempo. Los nockers que han llegado a este reino y han regresado siempre lo hacen con profundos conocimientos sobre la invención. La única forma conocida de llegar es a través de anomalías de grietas en el [UmbraGlossary('far_dreaming')] y con un Casco de Onda Delta."
 hieronymus_continuum_effect_desc: ""
 
 umbra_realm_wyldweir: "Wyldweir"
 umbra_realm_wyldweir_desc: "El Wyldweir es un [Glossary('Reino de Sueño','game_concept_dream_realm_desc')] del [UmbraGlossary('near_dreaming')].\n\nAntiguamente un protectorado arcadiano, esta región montañosa boscosa cayó ante varios grupos de Moradores durante el Miririm."
 wyldweir_effect_desc: ""
 
 umbra_realm_brobdingnag: "Brobdingnag"
 umbra_realm_brobdingnag_desc: "El [Glossary('Reino de Sueño','game_concept_dream_realm_desc')] de Brobdingnag está poblado por gigantes normales que son tan grandes que ningún viajero al Reino ha captado aún su atención: los visitantes son ignorados o aplastados inadvertidamente."
 brobdingnag_effect_desc: "Permite reclutar a [GetMaA('giants').GetName] como [men_at_arms|E] (como una [umbra_expedition|E])"
 
 umbra_realm_arawns_forge: "La Forja de Arawn"
 umbra_realm_arawns_forge_desc: "La Forja de Arawn es un [Glossary('Punto Estable','game_concept_stable_point_desc')] del [UmbraGlossary('far_dreaming')].\n\nHay una montaña solitaria, negra como el corazón de un fomoriano, donde antaño Arawn mantenía su corte. Los flancos de la montaña son tan resbaladizos como el cristal mojado y los vientos que aúllan alrededor de las cimas impiden incluso que los dragones vuelen lo suficientemente cerca para aterrizar. El aire es gélido y una espesa capa de escarcha cubre las tierras circundantes. Pero en la oscuridad de la noche, surge un resplandor desde el centro de la montaña que brota de un foso profundo en el mismísimo pináculo, a incontables leguas del suelo. El resplandor es lo suficientemente brillante como para teñir de un rojo sangriento la base de las nubes que siempre rodean aquel lugar aborrecible."
 arawns_forge_effect_desc: ""
 
 umbra_realm_great_dream_forest: "Gran Bosque de Sueño"
 umbra_realm_great_dream_forest_desc: "El Gran Bosque de Sueño, también llamado el Bosque de [Glossary('Dán','game_concept_dan_desc')] o el Milderwood, es el bosque que es todos los bosques en el [UmbraGlossary('far_dreaming')].\n\nSolo hay un Bosque en el [UmbraGlossary('far_dreaming')]. Antiguo, majestuoso y a menudo lleno de peligros, el Gran Bosque abarca áreas más grandes que cualquier continente del mundo despierto. Cada tipo imaginable de árbol, tanto «real» como de otro tipo, existe aquí. El Gran Bosque incluso se extiende bajo los [UmbraGlossary('slumbering_oceans')] y hacia otras tierras mucho más allá de la vista de la mayoría de los Kithain."
 great_dream_forest_effect_desc: ""
 
 umbra_realm_discordant_woods: "Bosques Discordantes"
 umbra_realm_discordant_woods_desc: "El Bosque Discordante forma parte del [UmbraGlossary('great_dream_forest')] y es uno de los relativamente [Glossary('Puntos Estables','game_concept_stable_point_desc')] del [UmbraGlossary('far_dreaming')].\n\nAunque el fruto de los árboles es dulce y nutritivo, Aunque la tierra del bosque forma un lecho cómodo, Aunque la caza en el bosque es abundante, El Bosque Discordante trae un temor silencioso. El Bosque Discordante es hermoso."
 discordant_woods_effect_desc: ""
 
 umbra_realm_sea_of_sorrow: "Mar de la Aflicción"
 umbra_realm_sea_of_sorrow_desc: "El Mar de la Aflicción es un [Glossary('Puntos Estables','game_concept_stable_point_desc')] del [UmbraGlossary('far_dreaming')].\n\nLejos del Gran Bosque se encuentra un lugar donde arena fina como el polvo sopla a través de una tierra yerma y engulle a todos los que se atreven a intentar cruzar su extensión. Hay un paso que serpentea a través de este océano de polvo, extendiendo su Camino de Plata a través de la turbulencia constante que a menudo engulle el paso por completo, antes de permitirle brillar de nuevo. Se dice que las grandes olas de arena desgarran la carne con facilidad, dejando tan poco atrás que incluso los buitres no pueden encontrar bocado que valga la pena. El Mar de la Aflicción guarda bien sus secretos. Nadie ha seguido jamás el Camino de Plata a través de este páramo y ha regresado para contar qué descansa al otro lado."
 sea_of_sorrow_effect_desc: ""
 
 umbra_realm_great_chasm: "Gran Abismo"
 umbra_realm_great_chasm_desc: "El Gran Abismo es un [Glossary('Stable Point','game_concept_stable_point_desc')] del [UmbraGlossary('near_dreaming')].\n\nOcupando la misma ubicación que el Gran Cañón en el mundo mundano, el Gran Abismo es una grieta sin fondo que atraviesa la faz del [UmbraGlossary('near_dreaming')]. Pocos Kithain son lo bastante audaces o necios como para viajar a sus profundidades, pues aquí residen misterios."
 great_chasm_effect_desc: ""
 
 umbra_realm_great_engine: "Gran Motor"
 umbra_realm_great_engine_desc: "El Gran Motor es un [Glossary('Stable Point','game_concept_stable_point_desc')] del [UmbraGlossary('deep_dreaming')].\n\nMás allá de los yermos campos de hielo de la Noche Eterna, donde habitan los gigantes de hielo y usan a los trolls como sus esclavos personales, se encuentra una máquina de un tamaño extraordinario. El Gran Motor siempre ha estado donde ahora descansa. El Firchlis no cambia la forma de la imponente ruina, y el paso de los eones no le ha causado daño alguno a la enorme estructura. El Gran Motor descansa como un ángulo, inmóvil y silencioso. Ningún viento sopla donde la máquina aguarda. Ninguna criatura viva habita en su sombra."
 great_engine_effect_desc: ""
 
 umbra_realm_lake_of_sorrows: "Lago de las Penas"
 umbra_realm_lake_of_sorrows_desc: "El Lago de las Penas es un [Glossary('Stable Point','game_concept_stable_point_desc')] del [UmbraGlossary('near_dreaming')].\n\nDonde el Gran Lago Salado descansa en el Reino del Ardiente Sol, el Lago de las Penas se refleja en el [UmbraGlossary('near_dreaming')]. El lago alberga en sus profundidades una ciudad de una belleza increíble y una majestad inefable. Las torres se alzan bajo las aguas y llegan a estar a escasos centímetros del aire; ocasionalmente, alguien ve a los habitantes de esta ciudad mirando hacia arriba, incluso mientras uno observa hacia las profundidades. Tesoros que escapan a la imaginación mortal brillan intensamente en el fondo, a veces sostenidos por manos y otras veces descansando sobre los adoquines de color nácar en las profundidades del lago. Esta ciudad prospera, llena de Kithain tanto familiares como desconocidos para los changelings. Sin embargo, a pesar de sus poderes y fabulosas habilidades, no pueden alcanzar la ciudad bajo la superficie."
 lake_of_sorrows_effect_desc: ""
 
 umbra_realm_rivers_of_phantasia: "Ríos de Phantasia"
 umbra_realm_rivers_of_phantasia_desc: "Los Ríos de Phantasia son [Glossary('Stable Points','game_concept_stable_point_desc')] en el [UmbraGlossary('near_dreaming')].\n\nLos Ríos de Phantasia cubren el continente norteamericano en el [UmbraGlossary('near_dreaming')], tal como el Colorado, el Misisipi y el Río Grande cubren Norteamérica. Aunque solo unos pocos Reinos están bendecidos por estas aguas, su influencia siempre se siente cuando los changelings logran encontrarlos. Las aguas de estos ríos son tan puras y dulces como los sueños más finos. Beber de ellos es suficiente para calmar cualquier Ansia e incluso puede curar heridas, tanto reales como quiméricas. En ciertos puntos, se dice que los Ríos de Phantasia son capaces de borrar los años de un changeling. Los Grumps que beben de sus aguas pueden rejuvenecer, incluso hasta el punto de volver a ser meros niños. Aunque no se pierden recuerdos como resultado de estos cambios de edad, las perspectivas se invierten: no es solo el cuerpo lo que rejuvenece, sino también el alma."
 rivers_of_phantasia_effect_desc: ""
 
 umbra_realm_seas_of_dream: "Mares de Sueño"
 umbra_realm_seas_of_dream_desc: "Los Mares de Sueño son [Glossary('Stable Points','game_concept_stable_point_desc')] en el [UmbraGlossary('near_dreaming')] correspondientes a los océanos de la Tierra.\n\nEl [UmbraGlossary('near_dreaming')] tiene océanos, al igual que el mundo despierto tiene océanos. Aunque reflejan la ubicación de los mares mundanos, los Mares de Sueño son maravillas colectivas por derecho propio. En algún lugar de las profundidades de los océanos, la Atlántida aún descansa y los hombres pez hacen sus hogares. Grandes leviatanes duermen aquí, esperando el momento oportuno para dar a conocer su Presencia y soñando sueños que superan incluso la comprensión Kithain. Las ciudades flotan bajo las olas, algunas aún prosperando, otras abandonadas hace mucho tiempo, todas esperando revelar sus secretos a cualquiera que sea lo suficientemente curioso y valiente como para explorarlas."
 seas_of_dream_effect_desc: ""
 
 umbra_realm_slumbering_oceans: "Océanos Durmientes"
 umbra_realm_slumbering_oceans_desc: "Los Océanos Durmientes son [Glossary('Stable Points','game_concept_stable_point_desc')] del [UmbraGlossary('far_dreaming')].\n\nLos grandes océanos del [UmbraGlossary('far_dreaming')] conectan tanto con los Reinos Próximos como con el [UmbraGlossary('deep_dreaming')]. Las aguas aquí son turbias, demasiado profundas y oscuras para revelar sus secretos. Estos grandes océanos se extienden hacia otras tierras en el [UmbraGlossary('dreaming')], reinos misteriosos a los que ningún Kithain ha ido jamás. Algunos afirman que la Tuatha de Danaan tomó sus barcos y navegó por los Océanos Durmientes para regresar al lugar de donde vinieron, antes de que el [UmbraGlossary('dreaming')] se formara verdaderamente."
 slumbering_oceans_effect_desc: ""
 
 umbra_realm_splintered_mountains: "Montañas Astilladas"
 umbra_realm_splintered_mountains_desc: "Las Montañas Astilladas son uno de los relativamente pocos [Glossary('Stable Points','game_concept_stable_point_desc')] del [UmbraGlossary('far_dreaming')].\n\nLas Montañas Astilladas se extienden a lo largo de mil leguas y trazan un camino audaz a través de las Tierras Oscuras del [UmbraGlossary('far_dreaming')]. Aquí, los gigantes de leyenda y los monstruos de antaño hacen sus hogares y buscan sustento a cualquiera que sea lo bastante necio como para entrar en su dominio. Las arpías cabalgan sobre los vientos gélidos de los cañones de piedra, ansiosas por torturar changelings, y los Basiliscos acechan en las sombras de las torres rotas. Muchos Kithain han encontrado la muerte en las Montañas Astilladas, donde antaño gobernó la Tuatha de Danaan en la época anterior al Quebranto. Hay tesoros escondidos en las cuevas de las montañas, y algunos creen que el camino a [UmbraGlossary('arcadia')] solo puede encontrarse buscando esos tesoros que la Tuatha de Danaan abandonó cuando dejaron sus ahora en ruinas palacios. Esto puede ser una mentira o puede ser la verdad, pero todos los sidhe recuerdan haber pasado por esa cordillera de torres de piedra traicioneras y punzantes en su camino de regreso al Mundo Despierto."
 splintered_mountains_effect_desc: ""
 
 umbra_realm_middlemarch: "Middlemarch"
 umbra_realm_middlemarch_desc: "Middlemarch es un Señorío de los [UmbraGlossary('near_dreaming')].\n\nLas estribaciones de las grandes [UmbraGlossary('splintered_mountains')], las áridas tierras pedregosas de Middlemarch constituyen algunos de los reinos más duros del [UmbraGlossary('near_dreaming')]."
 middlemarch_effect_desc: ""
 
 umbra_realm_chakravada: "Chakravada"
 umbra_realm_chakravada_desc: "Chakravada es la mayor de todas las montañas en el [UmbraGlossary('dreaming')].\n\nSituado en las [UmbraGlossary('splintered_mountains')], el monte Chakravada, la mayor de todas las montañas, es también el centro de todos los mundos y, al menos dentro de los sueños, está vivo."
 chakravada_effect_desc: ""
 
 umbra_realm_goblin_market: "Mercado Goblin"
 umbra_realm_goblin_market_desc: "El Mercado Goblin es un mercado de hadas en el [UmbraGlossary('deep_dreaming')].\n\nA lo largo del [UmbraGlossary('mistweir')] en el [UmbraGlossary('deep_dreaming')], y a cien leguas de la aldea de [UmbraGlossary('fin_bheara')], se alza una colección de tiendas y pabellones llamada Mercado Goblin. Tesoros de increíble poder y rareza están a la venta en el Mercado, así como delicias y secretos que escapan al entendimiento mortal. El Mercado Goblin está gobernado por una docena de goblins y sus Ejecutores redcap. Todos son bienvenidos a entrar en el Mercado, siempre que tengan dinero o mercancías para intercambiar."
 goblin_market_effect_desc: ""
 
 umbra_realm_distant_cities: "Ciudades Distantes"
 umbra_realm_distant_cities_desc: "Las Ciudades Distantes son un fenómeno de los [UmbraGlossary('near_dreaming')].\n\nUn fenómeno común en los [UmbraGlossary('near_dreaming')] se denomina Ciudades Distantes. Estos lugares extraños son inevitablemente hermosos y casi siempre inalcanzables. Son lugares que se ven en el horizonte, lugares de maravilla y gloria que brillan tanto como el sol en el primer día verdadero de la primavera. A veces parecen estar a solo unas pocas millas de distancia, y otras veces parecen estar a cien leguas. Pero siempre son fascinantes, llenas de torres cristalinas y puentes de oro, estandartes coloridos y música que habita en la región de los susurros. Incluso a kilómetros de distancia, la gente ve a los habitantes de las Ciudades Distantes y anhela conocerlos, pues seguramente cualquiera que sea así de hermoso debe conocer el camino a [UmbraGlossary('arcadia')]."
 distant_cities_effect_desc: ""
 
 umbra_realm_fin_bheara: "Fin Bheara"
 umbra_realm_fin_bheara_desc: "Fin Bheara es un verdadero boggan de hadas y la aldea de hadas lleva su nombre en el [UmbraGlossary('deep_dreaming')].\n\nA lo largo de la gran barrera, han surgido asentamientos y pueblos de todos los tamaños a lo largo de los siglos, poblados por hadas plebeyas que afirman haber dejado [UmbraGlossary('arcadia')] para irse a lugares alejados de los sidhe. El más grande de estos pueblos se llama Fin Bheara, en honor al boggan que pobló la tierra. Fin Bheara comprende todo tipo de Kithain, incluso muchos sidhe que afirman que se les prohibió la entrada a [UmbraGlossary('arcadia')] en el momento del Quebranto."
 fin_bheara_effect_desc: ""
 
 umbra_realm_mistweir: "Mistweir"
 umbra_realm_mistweir_desc: "El Mistweir es la barrera final entre el [UmbraGlossary('far_dreaming')] y el [UmbraGlossary('deep_dreaming')]. El Mistweir rodea completamente el [UmbraGlossary('deep_dreaming')] y es una barrera entre lo mundano y lo fantástico."
 mistweir_effect_desc: ""
 
 umbra_realm_dream_burrow: "Madriguera de Sueños"
 umbra_realm_dream_burrow_desc: "Una Madriguera de Sueños es un reino en el [UmbraGlossary('near_dreaming')] excavado por un changeling Pooka para esconderse de la Banatidad.\n\nMuchas madrigueras de sueños albergan a diversos pookas en distintos números. Al estar aisladas unas de otras, cada una ha evolucionado a su manera especial. Las madrigueras varían en tamaño, desde pequeños refugios para familias individuales de pookas conejo, hasta bosques fantásticos de diversas especies. Cada una tiene su propio sabor y paisaje únicos, dependiendo del changeling o changelings que la soñaron. Muchas todavía existen, ocultas y prosperando, incluso después de todo este tiempo."
 dream_burrow_effect_desc: ""
 
 umbra_realm_madness_realm: "Reino de la Locura"
 umbra_realm_madness_realm_desc: "Un Reino de Locura es un lugar en el [UmbraGlossary('near_dreaming')] donde la locura de los Soñadores humanos puede causar a veces serios dilemas para los Kithain.\n\nLos Reinos de Locura son, quizás, las zonas más peligrosas del [UmbraGlossary('near_dreaming')]. En estos lugares, los sueños de los mortales que han renunciado a su cordura suelen hacerse realidad. Los sueños locos son extremadamente poderosos y pueden atrapar a un viajero desprevenido en sus realidades retorcidas durante periodos prolongados."
 madness_realm_effect_desc: ""
 
 umbra_realm_meridianus: "Meridianus"
 umbra_realm_meridianus_desc: "Meridianus es un reino similar al vacío, de vientos violentos y chimera de sombras, dejado por los Tuatha de Danaan para proteger contra los Habitantes.\n\nLos Habitantes que realizan el viaje hacia el Mundo de Otoño descubren rápidamente que llegar a la Tierra es mucho más fácil que regresar. La Tierra ejerce una oscura y pesada succión psíquica de la que a los efímeros parientes oscuros les resulta difícil escapar. Esta «succión» se manifiesta de varias formas. La más importante de ellas es una región del [UmbraGlossary('near_dreaming')] que existe justo más allá de las Nieblas. Llamada Meridianus, esta región es una antigua defensa dejada por los Tuatha para ayudar a imponer la Prohibición de Plata. Un reino de tormentas aullantes y poca sustancia, es casi imposible de navegar y está acechado por peligrosas chimera. Llamadas Sombras de Sueño, estas masas negras y sombrías atacan a cualquier pariente oscuro que las visite, disolviendo su sustancia quimérica. Los Habitantes solo encuentran este extraño aspecto de la región al salir del mundo despierto, no al entrar en él."
 meridianus_effect_desc: ""
 
 umbra_realm_sea_of_silver: "Mar de Plata"
 umbra_realm_sea_of_silver_desc: "El Mar de Plata es el gran océano del [UmbraGlossary('deep_dreaming')].\n\nEl océano ilimitado de luz, crepúsculo y sombras que se convierte en el [UmbraGlossary('deep_dreaming')] y la Corte Negra de los Fomorianos; el Mar que tiene mil nombres, uno por cada corazón que sueña; estos confines infinitos dividen el [UmbraGlossary('far_dreaming')] del [UmbraGlossary('deep_dreaming')]. Llámalo el Mar Sin Fondo, o el Mar del Atardecer, o el Mar del Crepúsculo, o el Océano del Sueño, o incluso la Tempestad. Todos los Viajes que esperen dejar atrás el Sueño Lejano deben dejar también los límites claramente marcados del Camino de Plata y todos los demás puntos de referencia cómodos y marcas de prueba."
 sea_of_silver_effect_desc: ""
 
 umbra_realm_snail_graveyards: "Cementerios de Caracoles"
 umbra_realm_snail_graveyards_desc: "Los Cementerios de Caracoles son seis lugares conocidos en el [UmbraGlossary('dreaming')] hacia los que viajan los caracoles cuando se dan cuenta de que están muriendo.\n\nDebido a que el camino es difícil y los caracoles moribundos viajan lentamente, la mayoría nunca llega a los cementerios y muere en algún lugar del trayecto. De hecho, una de las formas más fáciles para que un changeling encuentre el camino al Cementerio de Caracoles más cercano es seguir el rastro fragmentado de conchas de caracol bajo sus pies. A medida que avanzas, las conchas se vuelven gradualmente más gruesas en el suelo y, finalmente, te encuentras en un Cementerio de Caracoles. Los caracoles más viejos y fuertes van a [UmbraGlossary('arike')] para morir."
 snail_graveyards_effect_desc: ""
 
 umbra_realm_spawning_fields: "Campos de Procreación"
 umbra_realm_spawning_fields_desc: "Los Campos de Procreación son lugares donde los sueños de los mortales fluyen directamente hacia el [UmbraGlossary('dreaming')].\n\nLos Campos de Procreación son peligrosos incluso en las mejores circunstancias. Son océanos caóticos de Glamour puro y conexiones directas de una sola vía entre el [UmbraGlossary('dreaming')] y el Mundo de Otoño. Las chimera nacen constantemente dentro de estas fuentes de poder y a menudo mueren rápidamente. Los Campos de Procreación aparecen aparentemente al azar con el [UmbraGlossary('near_dreaming')] y desaparecen con la misma caprichosidad."
 spawning_fields_effect_desc: ""
 
 umbra_realm_tenebrous_realm: "Reino Tenebroso"
 umbra_realm_tenebrous_realm_desc: "Un Reino Tenebroso es uno de esos reinos fuera del Camino de Plata, poco conocidos por los changelings pero habitados por los Habitantes.\n\nNo definido por ningún mapa o frontera, el Reino Tenebroso es un término genérico utilizado por los changelings para definir los reinos mal comprendidos que se encuentran fuera del Camino de Plata. Para todos, excepto para los changelings más aventureros, estos lugares se consideran oscuros, alienígenas y peligrosos. Para los adhene que viven allí, son simplemente... su hogar."
 tenebrous_realm_effect_desc: ""
 
 umbra_realm_winterweir: "Winterweir"
 umbra_realm_winterweir_desc: "El Winterweir es un Reino del [UmbraGlossary('far_dreaming')].\n\nSituado en la parte invernal del [UmbraGlossary('forest_of_lies')] a lo largo de un tributario de la zona cercana al [UmbraGlossary('sea_of_silver')], el Winterweir es un lugar fresco y brumoso envuelto en misterio. Hogar de los fuaths, pocas partes del Bosque son tan densas y salvajes como el Winterweir... o tan peligrosas. Los fuaths que viven en este reino desconfían de los extraños y generalmente los ahuyentan a menos que se les propicie adecuadamente. Algunos lo hacen simplemente para asegurar su soledad, mientras que otros son activamente malévolos. Los primeros tienen buenas razones para la sospecha, especialmente dadas las recientes incursiones de los fir-bholg y las actividades de la segunda categoría."
 winterweir_effect_desc: ""
 
 umbra_realm_forest_of_lies: "Bosque de Mentiras"
 umbra_realm_forest_of_lies_desc: "El Bosque de Mentiras es parte del [UmbraGlossary('great_dream_forest')] y uno de los relativamente pocos [Glossary('Stable Points','game_concept_stable_point_desc')] del [UmbraGlossary('far_dreaming')].\n\nEl Bosque de Mentiras sigue patrones demasiado complejos para que la mayoría los comprenda. Siempre limita con la división entre el [UmbraGlossary('far_dreaming')] y el [UmbraGlossary('deep_dreaming')]. Fue en el Bosque de Mentiras donde Asterlan y su séquito lucharon contra las arañas del Abismo Susurrante. No hay nada bueno dentro del Bosque de Mentiras. Todo aquí es oscuro y sombrío, probablemente nacido de los miedos humanos al bosque primigenio. Los frutos que dan los antiguos y nudosos árboles del bosque son amargos y a menudo venenosos para los Kithain. Los animales de aquí son todos depredadores, y la mayoría alcanza tamaños que harían dudar incluso a un ejército de trolls."
 forest_of_lies_effect_desc: ""
 
 umbra_realm_maharaurava: "Mahâraurava"
 umbra_realm_maharaurava_desc: "Mahâraurava es el [Glossary('Home Realm','game_concept_home_realm_desc')] de los Naraka en el [UmbraGlossary('near_dreaming')].\n\nGran víctima de la muerte de Ravana, la antigua belleza del [Glossary('Home Realm','game_concept_home_realm_desc')] de los naraka ha desaparecido para siempre. Situado en el reino del [UmbraGlossary('near_dreaming')] que corresponde al noroeste de la India, Mahâraurava fue el epicentro cuando los Ocultos desplegaron su bomba espiritual. Pocas otras criaturas han visitado este reino, con la posible excepción de los acheri. Las leyendas de los changelings afirman que la región fue una vez el reino más hermoso y cruel, compuesto por grandes montañas enjoyadas donde incluso la piedra más pequeña valía el rescate de un duque. Los naraka, parte de una raza faerie llamada Asuras, vivían en un esplendor civilizado, aunque cruel, residiendo en vastos palacios tallados en las relucientes montañas, relajándose en sus jardines frutales y perfeccionando las artes de la música, el amor y el dolor. Su trabajo, según dicen las leyendas, era castigar a las almas humanas malvadas, hirviéndolas en los ríos de cobre fundido de la región."
 maharaurava_effect_desc: ""
 
 umbra_realm_astral_plane: "Plano Astral"
 umbra_realm_astral_plane_desc: "El plano astral puede considerarse, a grandes rasgos, como un reflejo de la conciencia de la totalidad de la humanidad, estando subdividido en varios reinos para cada categoría de ideas."
 astral_plane_effect_desc: "Mayor recompensa/requisito para desbloquear el entrenamiento del Estilo de vida de Administración."

 umbra_realm_vulgate: "Vulgado"
 umbra_realm_vulgate_desc: "Un Vulgado, también conocido como Mundus Imaginalis, es la parte más baja de los [UmbraGlossary('astral_reaches')]. Incorpora los conceptos más comunes en los que han pensado la filosofía colectiva y las mentalidades de la humanidad (y, posiblemente, de otras especies)."
 vulgate_effect_desc: "Mayor recompensa/requisito para desbloquear el entrenamiento del Estilo de vida de Diplomacia."

 umbra_realm_grand_hall: "Gran Salón"
 umbra_realm_grand_hall_desc: "Se alza desde las brumas astrales como un espectro: el Gran Salón de las Puertas Infinitas. Nunca permanece en el mismo lugar por mucho tiempo, pero siempre mantiene una forma similar: un pasillo escaso pero acogedor entre los mundos, diseñado con estilo mediterráneo clásico y amueblado con madera antigua y teselas de mosaico."
 grand_hall_effect_desc: ""

 umbra_realm_city_of_brass: "Ciudad de Latón"
 umbra_realm_city_of_brass_desc: "La Ciudad de Latón tiene la forma de una ciudad gigantesca con ocho grandes calles hechas de varios tonos de latón y cobre. Actúa como un centro económico entre los pachás Djinn del Mundo Invisible y los hechiceros que desean obtener la ayuda de los Djinn sin enfurecerlos innecesariamente mediante el uso del Código Salomónico para obligarlos a servir."
 city_of_brass_effect_desc: "$UMBRA_DISCOVERY_FETISH$"

 umbra_realm_spires: "Agujas"
 umbra_realm_spires_desc: "Los cosmólogos creen que las Agujas son el resultado de muchas mentes concentrándose en la misma idea, provocando que esta sea elevada desde el [UmbraGlossary('vulgate')] hacia un reino superior."
 spires_effect_desc: "Mayor recompensa/requisito para desbloquear el entrenamiento del Estilo de vida de Intriga."

 umbra_realm_inventium: "Inventium"
 umbra_realm_inventium_desc: "El Inventium es un Reino de los [UmbraGlossary('astral_reaches')] lleno de cada invento con el que la humanidad haya soñado jamás. Estos inventos se manifiestan con un audible sonido de chasquido y caen suavemente en enormes montones que llenan el Reino en todas las direcciones."
 inventium_effect_desc: "La acción Buscar Invención ya no dará estrés al fallar (como una [umbra_expedition|E])\nLa acción Buscar Invención dará oro al fallar (como una [umbra_expedition|E])\nLa acción Buscar Innovación ya no dará estrés al fallar (como una [umbra_expedition|E])"

 umbra_realm_epiphamy: "Epifamia"
 umbra_realm_epiphamy_desc: "Las Epifamias encarnan conceptos de abstracción completa, como «Las leyes de la naturaleza» o «El amor verdadero». Se manifiestan como nubes coloridas en el cielo umbrío del [UmbraGlossary('vulgate')] que pueden dar al visitante pistas sobre el concepto que encarnan."
 epiphamy_effect_desc: "Mayor recompensa/requisito para desbloquear el entrenamiento del Estilo de vida de Administración."

 umbra_realm_elemental_courts: "Cortes Elementales"
 umbra_realm_elemental_courts_desc: "Las Cortes de los Elementos se encuentran a mitad de una Aguja, antes de que un viajero alcance realmente las Cinco Puertas, con cada Elemento representado por un reino que expresa su naturaleza intrínseca."
 elemental_courts_effect_desc: ""

 umbra_realm_the_court_of_the_muses: "La Corte de las Musas"
 umbra_realm_the_court_of_the_muses_desc: "La Corte de las Musas ha sufrido mucho debido a la casi completa extinción de la creencia helénica clásica. Aun así, mientras su señorío se reduce cada día, las nueve hijas de Zeus siguen practicando su arte, con la esperanza de que su pasión logre retrasar el Olvido un poco más."
 the_court_of_the_muses_effect_desc: "$UMBRA_DISCOVERY_FETISH$"
 
 umbra_realm_shadowlands: "Tierras de las Sombras"
 umbra_realm_shadowlands_desc: "Las Tierras de las Sombras son un «espejo» de la realidad; cada ubicación en el reino viviente tiene una correspondiente en las Tierras de las Sombras que, en su mayor parte, obedece a las reglas convencionales de la distancia. Es donde habitan los wraiths, esperando la salvación o, lo más probable, el [UmbraGlossary('oblivion')]."

 shadowlands_effect_desc: "Desbloquea una interacción que te permite enviar un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado a las Tierras de las Sombras para que no cause más estrés mantenerlo."
 
 umbra_realm_river_of_death: "Río de la Muerte"
 umbra_realm_river_of_death_desc: "El Río de la Muerte es una vía fluvial en la [UmbraGlossary('tempest')] que sirve como el principal Derrotero desde Estigia hasta las [UmbraGlossary('shadowlands')] y otros [Glossary('Reinos Oscuros','game_concept_dark_kingdom_desc')]."
 river_of_death_effect_desc: ""
 
 umbra_realm_sunless_sea: "Mar sin Sol"
 umbra_realm_sunless_sea_desc: "Se llama así porque el cielo sobre él siempre está oscuro; la luz en el Mar sin Sol proveniente de fuentes como barcos y faros puede verse a kilómetros de distancia debido a que se dispersa en la superficie del agua."
 sunless_sea_effect_desc: ""
 
 umbra_realm_far_shore: "Costa Lejana"
 umbra_realm_far_shore_desc: "Las Orillas Lejanas son un territorio misterioso en el [UmbraGlossaryLocalized('shadowlands','Underworld')] controlado por entidades pitónicas llamadas Resplandecientes. Para los estigios modernos, las Orillas Lejanas son territorios controlados por Herejes y no son de fiar."
 far_shore_effect_desc: ""
 
 umbra_realm_weeping_bay: "Bahía Llorosa"
 umbra_realm_weeping_bay_desc: "La Bahía Llorosa se encuentra a medio camino entre el Mar de las Ánimas y el [UmbraGlossary('sunless_sea')] y sirve como el principal puerto de Estigia y conexión con otras Necropolis. La bahía tiene una forma característica de media luna y está constantemente llena de los sollozos y gemidos de los diversos wraiths forjados que la componen."
 weeping_bay_effect_desc: ""
 
 umbra_realm_sea_of_souls: "Mar de las Ánimas"
 umbra_realm_sea_of_souls_desc: "El muro marino protector construido alrededor de Estigia y el [UmbraGlossary('isle_of_sorrows')]. Su nombre proviene de los desafortunados wraiths que han sido forjados o encadenados en la estructura del muro."
 sea_of_souls_effect_desc: ""
 
 umbra_realm_isle_of_sorrows: "Isla de las Penas"
 umbra_realm_isle_of_sorrows_desc: "La Isla de las Penas es una isla rocosa situada en el delta del [UmbraGlossary('river_of_death')], en lo profundo de la [UmbraGlossary('tempest')]."
 isle_of_sorrows_effect_desc: ""
 
 umbra_realm_dark_kingdom_of_iron: "Reino Oscuro de Hierro"
 umbra_realm_dark_kingdom_of_iron_desc: "Estigia es la capital de los muertos occidentales, una ciudad increíblemente enorme situada en la [UmbraGlossary('isle_of_sorrows')] en lo profundo de la [UmbraGlossary('tempest')]. Es la ubicación de las principales sedes de las diversas organizaciones de wraiths occidentales."
 dark_kingdom_of_iron_effect_desc: "Desbloquea una interacción que te permite enviar un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado a este [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] para que tenga la oportunidad de aprender nuevos [arcanoi_lifestyle|E]."
 
 umbra_realm_dark_kingdom_of_clay: "Reino Oscuro de Arcilla"
 umbra_realm_dark_kingdom_of_clay_desc: "Karta, conocida por los forasteros como el [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] de Arcilla, es el señorío en la [UmbraGlossary('tempest')] que pertenece a los pueblos aborígenes de Australia."
 dark_kingdom_of_clay_effect_desc: "Desbloquea una interacción que te permite enviar un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado a este [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] para que tenga la oportunidad de aprender nuevos [arcanoi_lifestyle|E]."
 
 umbra_realm_dark_kingdom_of_ivory: "Reino Oscuro de Marfil"
 umbra_realm_dark_kingdom_of_ivory_desc: "El Monte de los Fantasmas, que también se conoce como el [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] de Marfil, es el [UmbraGlossary('shadowlands')] para los abambo, o los wraiths de África."
 dark_kingdom_of_ivory_effect_desc: "Desbloquea una interacción que te permite enviar un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado a este [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] para que tenga la oportunidad de aprender nuevos [arcanoi_lifestyle|E].\nSi eres un wraith, gana acceso al árbol de Behest de [misc_arcanoi_lifestyle|E]. (como una [umbra_expedition|E])"
 
 umbra_realm_dark_kingdom_of_jade: "Reino Oscuro de Jade"
 umbra_realm_dark_kingdom_of_jade_desc: "Los Manantiales Amarillos, también llamados el [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] de Jade, es una parte del [UmbraGlossaryLocalized('shadowlands','Inframundo')] dedicada a y controlada por los muertos de Asia."
 dark_kingdom_of_jade_effect_desc: "Desbloquea una interacción que te permite enviar un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado a este [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] para que tenga la oportunidad de aprender nuevos [arcanoi_lifestyle|E]."
 
 umbra_realm_dark_kingdom_of_obsidian: "Reino Oscuro de Obsidiana"
 umbra_realm_dark_kingdom_of_obsidian_desc: "Las Tierras Desolladas es el nombre del reino de los muertos que dominaba América Central, parte del poderoso [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] de Obsidiana."
 dark_kingdom_of_obsidian_effect_desc: "Desbloquea una interacción que te permite enviar un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado a este [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] para que tenga la oportunidad de aprender nuevos [arcanoi_lifestyle|E]."
 
 umbra_realm_dark_kingdom_of_wire: "Reino Oscuro de Alambre"
 umbra_realm_dark_kingdom_of_wire_desc: "El [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] de Alambre es la región de las [UmbraGlossaryLocalized('shadowlands','Inframundo')] de Europa que es el hogar de los dybbuk, wraiths asesinados en el Holocausto. Aunque no es un verdadero [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')], es independiente del [UmbraGlossary('dark_kingdom_of_iron')] que gobierna a la mayoría de los muertos de Europa."
 dark_kingdom_of_wire_effect_desc: "Desbloquea una interacción que te permite enviar un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado a este [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] para que tenga la oportunidad de aprender nuevos [arcanoi_lifestyle|E]."
 
 umbra_realm_dark_kingdom_of_sand: "Reino Oscuro de Arena"
 umbra_realm_dark_kingdom_of_sand_desc: "Amenti, el [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] de Arena, es el [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] de los Inmortales en el [UmbraGlossaryLocalized('shadowlands','Inframundo')]. No está poblado por wraiths, sino por Inmortales que murieron y se encontraron de nuevo en las [UmbraGlossary('shadowlands')]."
 dark_kingdom_of_sand_effect_desc: "Desbloquea una interacción que te permite enviar un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado a este [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] para que tenga la oportunidad de aprender nuevos [arcanoi_lifestyle|E]."
 
 umbra_realm_swar: "Swar"
 umbra_realm_swar_desc: "Swar (o Svarga), la Ciudad de los Deleites, es la ciudad de los muertos de la India; Swar sirve como la ciudad principal de Bhuvar, las [UmbraGlossary('shadowlands')] indias."
 swar_effect_desc: "Desbloquea una interacción que te permite enviar un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado a este [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] para que tenga la oportunidad de aprender nuevos [arcanoi_lifestyle|E]."
 
 umbra_realm_night_markets: "Mercados Nocturnos"
 umbra_realm_night_markets_desc: "Los Mercados Nocturnos, nominalmente parte de [UmbraGlossary('swar')], donde habitan los muertos del sudeste asiático."
 night_markets_effect_desc: "Desbloquea una interacción que te permite enviar un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado a este [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] para que tenga la oportunidad de aprender nuevos [arcanoi_lifestyle|E]."
 
 umbra_realm_mantaqat_khayal: "Mantaqat Khayal"
 umbra_realm_mantaqat_khayal_desc: "Mantaqat Khayal, las [UmbraGlossary('shadowlands')] de Oriente Medio. Se sabe poco de esta tierra, excepto que el lamento la ha envuelto en una tormenta de arena perpetua desde al menos el amanecer del Islam. Solo las Necropolis ofrecen refugio contra esta tormenta de arena, y solo es atravesada por mercaderes, peregrinos y nómadas."
 mantaqat_khayal_effect_desc: "Desbloquea una interacción que te permite enviar un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado a este [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] para que tenga la oportunidad de aprender nuevos [arcanoi_lifestyle|E]."

 umbra_realm_islands_of_flint: "Islas de Pedernal"
 umbra_realm_islands_of_flint_desc: "Las Islas de Pedernal, conocidas por los cartógrafos estigios como el [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] de Pedernal, son el dominio de los wraiths nativos de América del Norte."
 islands_of_flint_effect_desc: ""

 umbra_realm_feng_tu: "Feng-tu"
 umbra_realm_feng_tu_desc: "Feng-tu es un señorío en las Fuentes Amarillas creado específicamente por las fuerzas de Yu Huang para reflejar imágenes del Infierno."
 feng_tu_effect_desc: ""

 umbra_realm_fields_of_aaru: "Campos de A'aru"
 umbra_realm_fields_of_aaru_desc: "Los Campos de A'aru son la residencia de los Jueces de Ma'at y se encuentran dentro de las [UmbraGlossaryLocalized('shadowlands','Inframundo')] entre las ruinas del [UmbraGlossary('dark_kingdom_of_sand')]. A'aru solo puede encontrarse cuando el espíritu incorpóreo de una momia es acompañado por Anubis o uno de sus sirvientes, los Aken. Es un lugar para los wraiths que han demostrado ser dignos de encontrar el Cielo."
 fields_of_aaru_effect_desc: ""

 umbra_realm_isle_of_eurydice: "Isla de Eurídice"
 umbra_realm_isle_of_eurydice_desc: "La Isla de Eurídice sirve como el Trono del Destino, la sede de la Legión del Destino, así como de sus líderes, las Damas del Destino, y la eminente Dama del Destino. La isla es única entre los Tronos de las Legiones, ya que es el único que no se encuentra en la propia Estigia."
 isle_of_eurydice_effect_desc: ""
 
 umbra_realm_shadow_realm: "Señorío de las Sombras"
 umbra_realm_shadow_realm_desc: "Los Reinos de las Sombras son lugares en el [UmbraGlossaryLocalized('shadowlands','Inframundo')] que las Momias visitan para regenerarse hasta que estén listas para habitar sus cuerpos de nuevo y que les otorgan protección contra las depredaciones de Espectros o Maelstroms."
 shadow_realm_effect_desc: ""
  
 umbra_realm_hades: "Hades"
 umbra_realm_hades_desc: "El [UmbraGlossary('shadow_realm')] central de las Momias Cabiri se llama Hades, en honor al mítico [UmbraGlossaryLocalized('shadowlands','Inframundo')] griego."
 hades_effect_desc: ""

 umbra_realm_gates_of_heaven: "Puertas del Cielo"
 umbra_realm_gates_of_heaven_desc: "La responsabilidad pesa sobre todos los Renacidos. Los Ocho Inmortales otorgan las misiones de Wu T’ian. Reciben instrucción y deben llevar a cabo la voluntad del cielo. Cuando fallan, pasan tiempo en contemplación en las Puertas del Cielo, preparándose para no volver a fallar."
 gates_of_heaven_effect_desc: ""
 
 umbra_realm_yomi_wan: "Infierno Yomi"
 umbra_realm_yomi: "Infierno Yomi"
 umbra_realm_yomi_wan_desc: "Los Infiernos Yomi, también conocidos como Yomi Wan o, literalmente, los Mil Infiernos, son dimensiones espirituales artificiales creadas por los [Glossary('Yama Kings','podgloss.yamaking')] a partir de una combinación de los mundos espirituales del [Glossary('Yang World','game_concept_yang_world_desc')] y el [UmbraGlossaryLocalized('shadowlands','Yin World')], para que sirvan como su base de operaciones.\nEstán divididos en prisiones para almas muertas, cada una con la temática de su [Glossary('Yama King','podgloss.yamaking')] reinante, y se encuentran en constante conflicto por el dominio sobre los demás."

 yomi_wan_effect_desc: "Desbloquea una interacción que te permite enviar a un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado al [UmbraGlossary('yomi_wan')] para que regrese como un [GetTrait('kueijin').GetName( GetPlayer )]."
 
 umbra_realm_sea_of_shadow: "Mar de las Sombras"
 umbra_realm_sea_of_shadow_desc: "El Mar de Sombras es un término utilizado por los wraiths para describir la capa «inferior» de la [UmbraGlossary('tempest')], que fluye alrededor y hacia el [UmbraGlossary('pod_realm_labyrinth')] y el [UmbraGlossary('oblivion')]."
 sea_of_shadow_effect_desc: "Permite encontrar un whistimmu aleatorio como una [umbra_expedition|E].\nGana $POD_plasmic_maa$ como una [umbra_expedition|E], lo que permite reclutar $POD_plasmic_maa$ como [men_at_arms|E]."
 
 umbra_realm_tempest: "Tempestad"
 umbra_realm_tempest_desc: "La Tempestad es un torbellino perpetuo de energía, recuerdos y #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Espectros#!#! que emana del [UmbraGlossary('pod_realm_labyrinth')] y llueve continuamente plasma y materiales tanto en el [UmbraGlossary('shadowlands')] como en los [Glossary('Reinos Oscuros','game_concept_dark_kingdom_desc')]."
 tempest_effect_desc: "Permite encontrar un whistimmu aleatorio como una [umbra_expedition|E].\nGana $POD_plasmic_maa$ como una [umbra_expedition|E], lo que permite reclutar $POD_plasmic_maa$ como [men_at_arms|E]."
 
 umbra_realm_stormwall: "Muralla de Tormentas"
 umbra_realm_stormwall_desc: "La Muralla de Tormentas es una barrera metafísica entre los mundos de los vivos y los muertos."
 stormwall_effect_desc: "Permite encontrar un whistimmu aleatorio como una [umbra_expedition|E].\nGana $POD_plasmic_maa$ como una [umbra_expedition|E], lo que permite reclutar $POD_plasmic_maa$ como [men_at_arms|E]."
 
 umbra_realm_island_below_the_sea: "Isla Bajo el Mar"
 umbra_realm_island_below_the_sea_desc: "En medio del [UmbraGlossary('abyss')], entre los [UmbraGlossary('mirrorlands')] y el [UmbraGlossary('oblivion')], se encuentra la Isla Bajo el Mar, que sirve como hogar de Les Mystéres y base de operaciones para los Loa."
 island_below_the_sea_effect_desc: "Si eres un wraith, gana acceso al árbol de Connaissance de [misc_arcanoi_lifestyle|E]. (como una [umbra_expedition|E])"
 
 umbra_realm_mirrorlands: "Tierras Espejo"
 umbra_realm_mirrorlands_desc: "Las Tierras Espejo es el nombre que los wraiths conocidos como Les Invisibles dieron a los reflejos en el [UmbraGlossary('shadowlands')] de las islas del Caribe."
 mirrorlands_effect_desc: ""
 
 umbra_realm_pod_realm_labyrinth: "Laberinto"
 umbra_realm_pod_realm_labyrinth_desc: "El Laberinto tiene relativamente poca estructura y ningún mapa podría darle sentido; los pocos puntos de referencia que existen son propensos al movimiento."

 pod_realm_labyrinth_effect_desc: "Desbloquea una interacción que te permite enviar a un [GetTrait('wraith').GetName( GetNullCharacter )] vinculado al Laberinto para que pueda regresar como un [GetModifier('doomslayer_modifier').GetNameWithTooltip].\nSi eres un wraith, gana el modificador [GetModifier('doomslayer_modifier').GetNameWithTooltip]. (como una [umbra_expedition|E])"
 
 umbra_realm_well_of_the_void: "Pozo del Vacío"
 umbra_realm_well_of_the_void_desc: "El Pozo del Vacío es la manifestación física del [UmbraGlossary('oblivion')], situado en el centro y en el fondo del [UmbraGlossary('pod_realm_labyrinth')]."
 well_of_the_void_effect_desc: ""
 
 umbra_realm_oblivion: "Olvido"
 umbra_realm_oblivion_desc: "El Olvido es la entropía misma, una fuerza de destrucción y locura en constante agitación de la que no hay retorno."
 oblivion_effect_desc: "#X Cualquier ser que entre aquí verá su existencia borrada.#!"
 
 umbra_realm_abyss: "Abismo"
 umbra_realm_abyss_desc: "El Abismo, también conocido como el Infierno o el Foso, es la turbia dimensión de oscuridad creada por Dios como una prisión eterna para los Caídos."

 abyss_effect_desc: ""
 
 umbra_realm_dis: "Dis"
 umbra_realm_dis_desc: "La poca organización que tienen los Barqueros se centra en Dis, un Mar de Sargazo de fortalezas, cavernas y barcos en la [UmbraGlossary('tempest')]. Aquí se encuentran sus principales lugares de reunión, las sedes de sus divisiones de archivo y fabricación, y su pequeño comité de dirección."
 dis_effect_desc: ""

 umbra_realm_spirit_wilds: "Tierras Salvajes Espirituales"
 umbra_realm_spirit_wilds_desc: "Las Tierras Salvajes Espirituales son otro nombre para el Umbra Medio, particularmente el espacio entre los Reinos Cercanos. Esta parte del [umbra|E] refleja el entorno natural, tanto en su estado prístino como en el herido por la civilización."

 spirit_wilds_effect_desc: "$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_black_furies: "La Tierra Natal de las Furias Negras"
 umbra_realm_the_homeland_of_the_black_furies_desc: "La tierra natal de las Furias Negras se asemeja a los paisajes de la Grecia mítica: montañas rocosas se alzan sobre numerosas islas pequeñas y penínsulas que se extienden hacia un mar turquesa. Frondosos bosques de pinos y olivos, siempre cargados de frutos, cubren la isla, junto con edificios construidos al estilo griego, aunque recientemente han aparecido edificios de todas partes del mundo. Numerosas emanaciones de depredadores, presas y humanos habitan en la tierra natal. Todas las criaturas viven como parte del ciclo de depredador y presa de la naturaleza, sin que ningún bando sea sobrecazado o muera de inanición."
 the_homeland_of_the_black_furies_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_bone_gnawers: "La Tierra Natal de los Roehuesos"
 umbra_realm_the_homeland_of_the_bone_gnawers_desc: "La tierra natal de los Roehuesos se asemeja a un barrio bajo de una ciudad. Las tabernas están abiertas las 24 horas del día y todas sirven cerveza barata por jarra. Hay locales de Joyhouse en cada manzana, pero el astuto Roehueso sabe que los mejores se encuentran en los callejones traseros, llamando a las puertas adecuadas. Fuera de la ciudad, hay una extensión montañosa con bosques ligeros y ganado robusto."
 the_homeland_of_the_bone_gnawers_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_children_of_gaia: "La Tierra Natal de los Hijos de Gaia"
 umbra_realm_the_homeland_of_the_children_of_gaia_desc: "La tierra natal de los Hijos de Gaia es una vasta extensión de bosques frondosos, colinas onduladas y arroyos burbujeantes que serpentean por los valles. Los humanos libres del Delirio vagan como nómadas por la tierra natal, con metrópolis centrales que reflejan versiones más limpias de las ciudades de la antigua Sumeria. Manadas de espíritus unicornio pastan en las colinas y cada visitante gana un anamae de unicornio que lo guía a través del señorío."
 the_homeland_of_the_children_of_gaia_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_fianna: "La Tierra Natal de los Fianna"
 umbra_realm_the_homeland_of_the_fianna_desc: "La tierra natal de los Fianna es un paisaje verde de colinas, valles y cañadas que parecen sacados de las tradiciones de las novelas de fantasía histórica. Las hadas juegan en los bosques y espíritus ciervo recorren la tierra bajo la guía del Ciervo como la «Cacería Salvaje», protegiendo la tierra natal de los intrusos. Las celebraciones espontáneas son comunes en la tierra natal y suelen atraer a cualquiera que esté cerca."
 the_homeland_of_the_fianna_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_get_of_fenris: "La Tierra Natal de la Camada de Fenris"
 umbra_realm_the_homeland_of_the_get_of_fenris_desc: "Fiordos, vastas extensiones de tundra y una taiga fría y oscura, todo envuelto en un invierno perpetuo, conforman la tierra natal de Fenrir. Manadas de megafauna de la era glacial, como lobos gigantes y mamuts, recorren la tierra y atacan a cualquier hombre lobo solitario. Los Fenrir se congregan en aldeas-logia donde beben, luchan, festejan y transmiten las sagas de sus hazañas."
 the_homeland_of_the_get_of_fenris_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_glass_walkers: "La Tierra Natal de los [SelectLocalization( And(GetVariableSystem.Exists( 'spirit_travel_open' ), IsDefaultGUIMode), 'glasswalker_CUSTOM', 'glasswalker_modern_name')]"
 umbra_realm_the_homeland_of_the_glass_walkers_desc: "La tierra natal de los [SelectLocalization( And(GetVariableSystem.Exists( 'spirit_travel_open' ), IsDefaultGUIMode), 'glasswalker_CUSTOM', 'glasswalker_modern_name')] es una metrópolis construida de acuerdo con los diseños gaianos. Altas torres tienen docenas de niveles de jardines al aire libre rebosantes de vegetación y de las aves y animales que se sienten atraídos naturalmente por estas plantas. Cada jardín atiende a una ecología diferente. Muchos humanos pasan felizmente sus vidas en apenas unas pocas torres."
 glasswalker_CUSTOM: "[GetPlayer.Custom( 'glasswalker_custom_name' )]"
 the_homeland_of_the_glass_walkers_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_the_homeland_of_the_red_talons: "La Tierra Natal de las Garras Rojas"
 umbra_realm_the_homeland_of_the_red_talons_desc: "La tierra natal de las Garras Rojas es una gran naturaleza salvaje intacta. Los depredadores cazan sin restricciones y compiten entre sí. Destacan sobre todo grandes manadas de lobos que han llegado a imponer su dominación sobre la tierra natal."
 the_homeland_of_the_red_talons_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_shadow_lords: "La Tierra Natal de los Señores de la Sombra"
 umbra_realm_the_homeland_of_the_shadow_lords_desc: "Los Señores de la Sombra viven en una zona dominada por una Gran Montaña, con el cielo perpetuamente cubierto por nubes oscuras y tormentas de rayos. Los picos y los bosques que se extienden bajo ellos yacen en sombra eterna, donde los Señores de la Sombra se reúnen en castillos para conspirar unos contra otros y hallar la forma de escalar la montaña."
 the_homeland_of_the_shadow_lords_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_stargazers: "La Tierra Natal de los Contempladores de Estrellas"
 umbra_realm_the_homeland_of_the_stargazers_desc: "El dominio de los Contempladores de Estrellas es un señorío diseñado para poner a prueba las cinco formas del Garou. Montañas más altas que el Himalaya ocupan el centro del Señorío. Un anillo de estribaciones rodea la base de estos picos, cubiertas de exuberantes praderas, desiertos o majestuosos bosques. Los santuarios se adaptan a las necesidades de cualquier ejercicio espiritual interno del Garou."
 the_homeland_of_the_stargazers_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_silver_fangs: "La Tierra Natal de los Colmillos Plateados"
 umbra_realm_the_homeland_of_the_silver_fangs_desc: "La tierra natal de los Colmillos Plateados es una vasta extensión de territorio que se asemeja a las estepas rusas. Espíritus halcón surcan el cielo, vigilando a cualquier visitante y alertando a Halcón de su presencia. En el centro del señorío se alza el Castillo de los Héroes, un monumento a las hazañas de los Colmillos Plateados al servicio de la Nación Garou."
 the_homeland_of_the_silver_fangs_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_corax: "La Tierra Natal de los Corax"
 umbra_realm_the_homeland_of_the_corax_desc: "La tierra natal de los Corax es un árbol gigantesco con innumerables ramas extendidas llenas de recovecos ideales para anidar. Helios brilla perpetuamente sobre el árbol, que está conectado con casi todos los señoríos umbrales, lo que permite a los hombres cuervo un paso rápido."
 the_homeland_of_the_corax_effect_desc: "$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_nuwisha: "La Tierra Natal de los Nuwisha"
 umbra_realm_the_homeland_of_the_nuwisha_desc: "La tierra natal de los Nuwisha se conoce como el Túnel del Coyote. Todo el Señorío es una sala ovalada con una enorme mesa central rebosante de comida que nunca se vacía. Las puertas bordean las paredes, conduciendo a cualquier lugar que un Nuwisha haya visitado. Algunas de estas puertas están cerradas, pero se abren en momentos aparentemente aleatorios."
 the_homeland_of_the_nuwisha_effect_desc: "$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_silent_striders: "La Tierra Natal de los Caminantes Silenciosos"
 umbra_realm_the_homeland_of_the_silent_striders_desc: "La tierra natal de los Caminantes Silenciosos está dominada por un río gigantesco llamado el Río de la Vida. Cubierta por una noche eterna, se compone por lo demás de grandes desiertos plateados y está dominada por obeliscos y edificios monumentales similares inscritos con jeroglíficos, cuidadosamente alineados para resaltar constelaciones que conmemoran a los héroes Caminantes Silenciosos de antaño."
 the_homeland_of_the_silent_striders_effect_desc: "$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_uktena: "La Tierra Natal de los Uktena"
 umbra_realm_the_homeland_of_the_uktena_desc: "La tierra natal de los Uktena se asemeja a las Tierras Puras. Ahora los últimos espíritus ancestrales de estas tribus moran solo en la tierra natal. Criaturas míticas únicas y héroes del folclore nativoamericano también tienen sus hogares en el Señorío e intercambian secretos con los Uktena a cambio de protección continua. El señorío tiene una conexión con el [UmbraGlossary('abyss')], así como con [UmbraGlossary('galunlati')], donde mora el propio Uktena."
 the_homeland_of_the_uktena_effect_desc: "$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_galunlati: "Galunlati"
 umbra_realm_galunlati_desc: "Galunlati es el hogar umbral del Gran Uktena, el tótem de la tribu Uktena. Es la morada de bestias míticas y el hogar de los rasgos más peligrosos y majestuosos de la naturaleza. La naturaleza es más pronunciada dentro de Galulati: los picos son más altos, los bosques más densos, los ríos más rápidos y las tormentas más feroces. Muchos Uktena que quieren reclamar el rango de Antiguo deben primero visitar Galunlati y sobrevivir a él antes de ser aceptados en los círculos superiores de su tribu."
 galunlati_effect_desc: "$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_wendigo: "La Tierra Natal de los Wendigo"
 umbra_realm_the_homeland_of_the_wendigo_desc: "La tierra natal de los Wendigo es una tundra glacial de invierno eterno con una gigantesca aurora boreal que cruza el cielo nocturno. Las ventiscas aúllan sin tregua por el paisaje, agotando rápidamente a cualquiera que no encuentre uno de los asentamientos ocultos de los Wendigo. Está conectada con varios otros Reinos Próximos, incluidos los Límites Etéreos, el [UmbraGlossary('legendary_realm')], [UmbraGlossary('pangaea')] y las tierras natales de los Uktena y los Croatanos."
 the_homeland_of_the_wendigo_effect_desc: "$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_croatan: "La Tierra Natal de los Croatanos"
 umbra_realm_the_homeland_of_the_croatan_desc: "Las tierras de los Croatanos se asemejan a los bosques de taiga de Norteamérica. El clima es permanentemente frío y brumoso, con lluvias ocasionales. No se encuentra ninguna emanación y toda la tierra natal es inquietantemente silenciosa. Tortuga duerme en el centro del señorío, removiéndose de vez en cuando en su hibernación."
 the_homeland_of_the_croatan_effect_desc: "$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_homeland_of_the_bunyip: "La Tierra Natal de los Bunyip"
 umbra_realm_the_homeland_of_the_bunyip_desc: "El Señorío tiene una diversa gama de climas que incluye bosques de manglares tropicales, desfiladeros profundos, matorrales templados y selvas frescas. Cada tierra donde los Bunyip hicieron sus hogares y cantaron sus canciones está representada aquí. Lo habitan criaturas del [UmbraGlossary('dreamtime')], así como representaciones espirituales de la fauna extinta de Australia."
 the_homeland_of_the_bunyip_effect_desc: "$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_the_former_homeland_of_the_white_howlers: "La Antigua Tierra Natal de los Aulladores Blancos"
 umbra_realm_the_former_homeland_of_the_white_howlers_desc: "La antigua tierra natal de los Aulladores Blancos ha sido deformada hasta lo irreconocible por el $glossary_wyrm$. El aire es denso con humo y ondula con el calor. Un sol de un verde enfermizo golpea la superficie, sin que lo bloquee ningún tipo de capa de ozono. La noche no trae alivio, pues los contaminantes se enfrían y se posan sobre la superficie, haciendo que la luna parezca de un amarillo fluorescente a través de los vapores."
 the_former_homeland_of_the_white_howlers_effect_desc: "$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_calumn: "Calumn"
 umbra_realm_calumn_desc: "Un Calumn es un dominio del $glossary_wyrm$ dentro de la Umbra Próxima. Se desarrollan cuando una emoción negativa particularmente intensa se expresa en un lugar del mundo físico de tal modo que deja una huella en la [umbra|E]. Es un imán para los Azotes, y los Espíritus que viven cerca de un Calumn muestran signos de su emoción respectiva, e incluso los objetos inanimados quedan contaminados por la proximidad."

 calumn_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_heavenly_flower_garden: "Jardín Celestial de las Flores"
 umbra_realm_heavenly_flower_garden_desc: "El Jardín Celestial de las Flores se describe como el hogar de los dioses. Dentro de él, las almas de los muertos se cultivaban como flores y finalmente florecían en un nuevo cuerpo, mientras que las almas de los vivos se representaban como flores en plena floración. Aquí, los antiguos chamanes las cortejaban con canciones y poesía hasta que eran aceptadas como sus servidoras en la tierra. Este viaje se conocía como el Chan Fa, en el que los Wu-Keng no solo adivinaban nuevos nacimientos, sino que también se comunicaban con los espíritus de sus seres queridos fallecidos."
 heavenly_flower_garden_effect_desc: "$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_xi_wang_chin: "Xi Wang Chi"
 umbra_realm_xi_wang_chin_desc: "Es un lugar de tormenta interminable y agua rugiente, lleno de furia elemental primigenia y desagradable para todo ser que no forme parte del señorío. Solo los Mokolé y los Nagah conocen su existencia, pero en su mayor parte estos evitan el señorío, pues sus habitantes son extremadamente peligrosos y no deben ser molestados a la ligera. En algunas ocasiones, sin embargo, los Nagah pueden aventurarse a Xi Wang Chi en busca de un don que necesiten de forma particular."
 xi_wang_chin_effect_desc: "$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_atrocity_realm: "Señorío de las Atrocidades"
 umbra_realm_atrocity_realm_desc: "El Señorío de las Atrocidades, conocido por los magos como el Yermo, es uno de los Reinos Próximos. Milenios de sufrimiento de todas las víctimas del mundo han creado este Señorío, un lugar donde las peores crueldades y torturas han quedado inmortalizadas."
 atrocity_realm_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_battleground: "Campo de Batalla"
 umbra_realm_battleground_desc: "El Campo de Batalla, conocido en Oriente como el Señorío de los Espíritus Combatientes, es un Reino Próximo dentro de la [umbra|E] que contiene todas las batallas jamás libradas, desde los primeros conflictos entre tribus neolíticas contra osos y lobos, el Impergium y las Guerras de la Furia, hasta los actuales conflictos religiosos en Iberia y Oriente Medio."
 battleground_effect_desc: "Desbloqueada mayor recompensa/requisito para el entrenamiento del estilo de vida marcial."

 umbra_realm_cyberrealm: "Ciberseñorío"
 umbra_realm_cyberrealm_desc: "El Ciberseñorío es uno de los trece Reinos Próximos de la [umbra|E]. Este señorío representa quizá el pináculo de la influencia de la $glossary_weaver$ en la [umbra|E]. Los magos lo llaman Distopía."
 cyberrealm_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_digital_web: "Red Digital"
 umbra_realm_digital_web_desc: "La Red Digital es una Zona basada enteramente en la realidad virtual, y el hogar no oficial de los Adeptos Virtuales. Ha de ser el fundamento de la iniciativa «Realidad 2.0» de los Adeptos, que traslada a la humanidad a un mundo mejor, libre de los problemas de la realidad material en la Tierra. Del mismo modo que Internet es una especie de «espacio» virtual que no guarda relación con una ubicación real, la Red Digital es en teoría un importante Punto de Correspondencia. También puede tener algún tipo de conexión con el Monte Qaf de los Ahl-i-Batin."
 digital_web_effect_desc: ""

 umbra_realm_hollow_worlds: "Mundos Huecos"
 umbra_realm_hollow_worlds_desc: "No una, sino una serie de versiones de la teoría de la existencia de una Tierra Hueca. Superficialmente similares a los tipos de señoríos que se ven en la Umbra Media, los Mundos Huecos destacan porque los humanos corrientes pueden alcanzarlos mediante ciertos pasajes subterráneos, pozos de mina y ascensores anodinos. Además, algunos sostienen que los Mundos Huecos constituyen un tipo de [umbra|E] completamente distinto, y lo llaman la «Umbra Interna», afirmando que si la Tierra es un teatro y el mundo más allá del vestíbulo es la [umbra|E], la zona entre bastidores es donde pueden hallarse los Mundos Huecos. En cualquier caso, los intentos de cruzar la Celosía hacia los Mundos Huecos fracasan invariablemente, lo que desconcierta a la mayoría de los teóricos de la topografía umbral."
 hollow_worlds_effect_desc: ""

 umbra_realm_erebus: "Erebus"
 umbra_realm_erebus_desc: "A menudo comparado con el «infierno» de los Garou, Érebo es en realidad un lugar de purificación espiritual. Está lleno de ríos de plata fundida que a la vez queman y curan, prolongando el tormento de sus reclusos durante meses, años, posiblemente incluso siglos."
 erebus_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_flux_realm: "Señorío del Flujo"
 umbra_realm_flux_realm_desc: "El Flujo, el Señorío del Flujo o el Resplandor es un Señorío dentro de la Umbra Próxima. Es un poderoso depósito de energía del Salvaje pura y sin diluir, incontaminada por la cartografía de la Tejedora."
 flux_realm_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_hy_brasil: "Hy-Brasil"
 umbra_realm_hy_brasil_desc: "Hy-Brasil aparece como una tierra de infinitas historias fantásticas. Aquí, las estaciones nunca cambian y el día permanece encerrado eternamente en el crepúsculo. En la mitad occidental de la tierra, el sol se pone en un cielo de pleno verano. Al este, la luna se alza, fría y siniestra, sobre una noche de pleno invierno."
 hy_brasil_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_legendary_realm: "Señorío Legendario"
 umbra_realm_legendary_realm_desc: "El Señorío Legendario es uno de los Reinos Próximos situados en la Umbra Próxima. Los Garou que viajan por este señorío pueden experimentar las vidas de sus ancestros legendarios. Sin embargo, los acontecimientos dentro del señorío no son recreaciones históricas estrictas; pueden reflejar relatos alterados con el tiempo para ajustarse a los ideales del mundo actual."
 legendary_realm_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_mountains_of_heaven: "Montañas del Cielo"
 umbra_realm_mountains_of_heaven_desc: "Las Montañas del Cielo son un Señorío Umbral dentro del [Glossary('Mundo Yang','game_concept_yang_world_desc')]. El Señorío se manifiesta como una gran cadena montañosa que empequeñece incluso al poderoso Himalaya, con cumbres por encima de un mar de nubes."
 mountains_of_heaven_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_pangaea: "Pangea"
 umbra_realm_pangaea_desc: "Pangea es un reflejo de la Tierra primigenia, que muestra el mundo tal como era antes de la civilización, de la historia humana e incluso del Impergium."
 pangaea_effect_desc: "Obtienes el modificador [GetModifier('paleontologist_modifier').GetNameWithTooltip] (como una [umbra_expedition|E])\n$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_scar: "Cicatriz"
 umbra_realm_scar_desc: "Cicatriz es uno de los Reinos Próximos de la [umbra|E]. Es una manifestación de la revolución industrial corrompida hasta convertirse en una opresión que tritura el alma bajo un ideal de prosperidad oxidada."
 scar_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_summer_country: "País del Verano"
 umbra_realm_summer_country_desc: "El País del Verano es uno de los Reinos Próximos situados en la Umbra Próxima de la Tierra. Ahora no es más que un mito, pues lleva décadas desvaneciéndose. Las leyendas dicen que el señorío es un reflejo del amor puro e ilimitado de Gaia por Sus hijos."
 summer_country_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_tiger_lands: "Tierras del Tigre"
 umbra_realm_tiger_lands_desc: "Las Tierras del Tigre son un Señorío Yang dentro de la [umbra|E] Oriental que sirve de refugio para los espíritus de animales amenazados y de espíritus que han perdido sus hogares a causa de las talas masivas humanas."
 tiger_lands_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_umi: "Umi"
 umbra_realm_umi_desc: "Uno de los señoríos umbrales más poderosos del Reino Medio, el dominio de Umi reclama todo el Pacífico como su jurisdicción, aunque ciertos señoríos espirituales polinesios e indonesios opinan lo contrario."
 umi_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_wolfhome: "Lobera"
 umbra_realm_wolfhome_desc: "La Lobera es uno de los Reinos Próximos, situada en la Umbra Próxima de la Tierra. Los Garou la frecuentan. Este señorío es una vasta extensión de naturaleza salvaje virgen. Aquí se esconden las respuestas a los misterios primigenios."
 wolfhome_effect_desc: "$UMBRA_DISCOVERY_FETISH$\n$UMBRA_RECRUIT_BYGONE$"
 
 umbra_realm_aetherial_realm: "Señorío Etéreo"
 umbra_realm_aetherial_realm_desc: "El Señorío Etéreo, también conocido como Eteria, es la extensión más lejana del Reino Próximo dentro de la Umbra, que se extiende sobre las [UmbraGlossary('spirit_wilds')] hasta la Membrana. Se refleja en el mundo físico como los cielos que se ciernen sobre él y que alternan constantemente entre la noche y el día."
 aetherial_realm_effect_desc: "$UMBRA_RECRUIT_BYGONE$"

 umbra_realm_court_of_eshtarra: "Corte de Eshtarra"
 umbra_realm_court_of_eshtarra_desc: "$umbra_realm_eshtarra_desc$"
 umbra_realm_eshtarra: "Eshtarra"
 umbra_realm_eshtarra_desc: "Eshtarra, la Narradora de Canciones, es la Encarnación Planetaria de la Tierra según la Astrología Garou."
 court_of_eshtarra_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_sokhta: "Corte de Sokhta"
 umbra_realm_court_of_sokhta_desc: "$umbra_realm_sokhta_desc$"
 umbra_realm_sokhta: "Sokhta"
 umbra_realm_sokhta_desc: "Sokhta es un aspecto de Luna, la Celeste que es patrona de los Garou y de muchas otras Razas Cambiantes, y su corte alberga a muchas Lúnulas y otros espíritus simpatizantes de la Nación Garou."
 court_of_sokhta_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_katanka_sonnak: "Corte de Katanka-Sonnak"
 umbra_realm_court_of_katanka_sonnak_desc: "$umbra_realm_katanka_sonnak_desc$"
 umbra_realm_katanka_sonnak: "Katanka-Sonnak"
 umbra_realm_katanka_sonnak_desc: "Katanka-Sonnak, el Jinete del Viento, es la Encarnación Planetaria del Sol en la Astrología Garou."
 court_of_katanka_sonnak_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_mitanu: "Corte de Mitanu"
 umbra_realm_court_of_mitanu_desc: "$umbra_realm_mitanu_desc$"
 umbra_realm_mitanu: "Mitanu"
 umbra_realm_mitanu_desc: "Mitanu, el Pícaro Astuto, es conocido en la astrología Garou como la Encarnación Planetaria de Mercurio. Es a la vez un embaucador y un amante de la comedia."
 court_of_mitanu_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_hakahe: "Corte de Hakahe"
 umbra_realm_court_of_hakahe_desc: "$umbra_realm_hakahe_desc$"
 umbra_realm_hakahe: "Hakahe"
 umbra_realm_hakahe_desc: "Hakahe es la Encarnación de Vulcano, el planeta más cercano al sol que Mercurio, y se le atribuye haber forjado las almas de los Garou recién nacidos."
 court_of_hakahe_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_tambiyah: "Corte de Tambiyah"
 umbra_realm_court_of_tambiyah_desc: "$umbra_realm_tambiyah_desc$"
 umbra_realm_tambiyah: "Tambiyah"
 umbra_realm_tambiyah_desc: "Tambiyah, la Madre Velada, es la Encarnación Planetaria de Venus en la Astrología Garou."
 court_of_tambiyah_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_nerigal: "Corte de Nerigal"
 umbra_realm_court_of_nerigal_desc: "$umbra_realm_nerigal_desc$"
 umbra_realm_nerigal: "Nerigal"
 umbra_realm_nerigal_desc: "Nerigal, el Guerrero de Hielo, es la Encarnación Planetaria de Marte según la Astrología Garou."
 court_of_nerigal_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_rorg: "Corte de Rorg"
 umbra_realm_court_of_rorg_desc: "$umbra_realm_rorg_desc$"
 umbra_realm_rorg: "Rorg"
 umbra_realm_rorg_desc: "Rorg, el Cazador de Muchas Garras, es el Incarna de Turog, un planeta destruido que forma el Cinturón de Asteroides, según la astrología Garou."
 court_of_rorg_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_zarok: "Corte de Zarok"
 umbra_realm_court_of_zarok_desc: "$umbra_realm_zarok_desc$"
 umbra_realm_zarok: "Zarok"
 umbra_realm_zarok_desc: "Zarok, el Gobernante Coronado, es el Incarna Planetario de Júpiter en la astrología Garou."
 court_of_zarok_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_lu_bat: "Corte de Lu-Bat"
 umbra_realm_court_of_lu_bat_desc: "$umbra_realm_lu_bat_desc$"
 umbra_realm_lu_bat: "Lu-Bat"
 umbra_realm_lu_bat_desc: "Lu-Bat, el Consejero Pacífico, es el Incarna Planetario de Saturno en la astrología Garou."
 court_of_lu_bat_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_ruatma: "Corte de Ruatma"
 umbra_realm_court_of_ruatma_desc: "$umbra_realm_ruatma_desc$"
 umbra_realm_ruatma: "Ruatma"
 umbra_realm_ruatma_desc: "Ruatma, el Ensombrecido, es el Incarna de Urano."
 court_of_ruatma_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_shantar: "Corte de Shantar"
 umbra_realm_court_of_shantar_desc: "$umbra_realm_shantar_desc$"
 umbra_realm_shantar: "Shantar"
 umbra_realm_shantar_desc: "Shantar, el Creador del Telar, es el Incarna de Neptuno."
 court_of_shantar_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_court_of_meros: "Corte de Meros"
 umbra_realm_court_of_meros_desc: "$umbra_realm_meros_desc$"
 umbra_realm_meros: "Meros"
 umbra_realm_meros_desc: "Meros, el Vagabundo, es el Incarna de Plutón."
 court_of_meros_effect_desc: "Puede obtener los beneficios de don planetario correspondientes como una [umbra_expedition|E] [GetPlayer.Custom('PlanetarygiftsAddicionalChance')]"

 umbra_realm_weaver_reaches: "Límites de la Tejedora"
 umbra_realm_weaver_reaches_desc: "Los Límites de la Tejedora son hebras de realidad calcificada, similares al mapa computarizado de un astrónomo. Los nodos donde se cruza la red anclan estrellas frías y planetas congelados en una simetría antinatural. No existen signos de vida. Colosales espíritus de la $glossary_weaver$ como las «arañas estelares» patrullan y mantienen la red, asegurando que todo permanezca en su lugar ordenado."
 weaver_reaches_effect_desc: ""

 umbra_realm_wyld_reaches: "Límites Kaóticos"
 umbra_realm_wyld_reaches_desc: "Los Límites Kaóticos son un lugar de caos. Planetas y cometas danzan unos alrededor de otros, colisionando según leyes en constante cambio. Soles de frío ardiente que congelan todo a su alrededor y otros que lo repelen todo con ondas de antigravedad orbitan entre ellos."
 wyld_reaches_effect_desc: "$UMBRA_DISCOVERY_FETISH$"

 umbra_realm_wyrm_reaches: "Límites Wyrmianos"
 umbra_realm_wyrm_reaches_desc: "Las estrellas dentro de los Límites Wyrmianos se han consumido hasta quedar como cáscaras sin vida o han colapsado en agujeros negros que generalmente conducen a [UmbraGlossary('malfeas')]. Nebulosas de polución y Fuego Infernal se arremolinan a su alrededor, ocultando sus constelaciones a quien las mire, convirtiéndolas en manchas oscuras dentro del cielo Umbral."
 wyrm_reaches_effect_desc: ""
 
 umbra_realm_mercury: "Mercurio"
 umbra_realm_mercury_desc: "Mercurio, según el consenso, es un mundo estéril y sin aire, plagado de miles de cráteres.\n\nEl equivalente Umbral es igualmente difícil de habitar debido a su proximidad al Sol. En un tiempo, los Ahl-i-Batin tuvieron una Capilla en este mundo. Los Magos habían ralentizado la rotación del mundo para que el asentamiento, construido en un cráter, estuviera siempre al borde del crepúsculo."
 mercury_effect_desc: ""
 
 umbra_realm_venus: "Venus"
 umbra_realm_venus_desc: "En el mundo físico, Venus es un mundo cálido, sofocante y estéril, con una atmósfera aplastante contaminada por ácido sulfúrico. Sin embargo, a diferencia de la mayoría de los planetas, posee una Penumbra que puede reflejar una fase anterior de su historia. La Venus penumbral está cubierta de exuberantes selvas tropicales y océanos pantanosos y poco profundos. Su conexión con la Esfera de la Vida hace que el entorno sea rico en todo tipo de seres vivos: los exploradores corren el riesgo de ser colonizados por musgo o hongos si permanecen quietos demasiado tiempo, y pueden necesitar limpiar y esterilizar regularmente su equipo para evitar la contaminación por moho."
 venus_effect_desc: ""
 
 umbra_realm_mars: "Marte"
 umbra_realm_mars_desc: "Marte estuvo habitado una vez y, por lo tanto, tiene una Penumbra, donde se pueden ver fácilmente las ruinas de canales que discurren a lo largo de antiguas líneas ley. No obstante, incluso en la Penumbra, el aire es tenue y las severas tormentas de polvo representan un peligro."
 mars_effect_desc: ""
 
 umbra_realm_jupiter: "Júpiter"
 umbra_realm_jupiter_desc: "Aunque Júpiter en sí es una bola de gas sin superficie, sus numerosas lunas son más propicias para albergar visitantes. Aquí, más allá del Horizonte, los magos pueden realizar proezas extraordinarias de magia sin temor a la Paradoja. Cada una de las llamadas lunas galileanas está, en la actualidad, controlada por una facción diferente de magos, aunque el control cambia rápida y frecuentemente. Los portales entre cualquier pareja de lunas de Júpiter o Saturno son fáciles de abrir, por lo que es necesaria una fortificación pesada para mantener fuera a los invasores."
 jupiter_effect_desc: ""

 umbra_realm_saturn: "Saturno"
 umbra_realm_saturn_desc: "Saturno es un gran planeta gigante gaseoso en el sistema solar exterior. Al igual que Júpiter, las visitas a la «superficie» de Saturno no son realmente posibles. Sus lunas, sin embargo, albergan una serie de bases utilizadas por los magos."
 saturn_effect_desc: ""
 
 umbra_realm_uranus: "Urano"
 umbra_realm_uranus_desc: "A diferencia de las lunas jovianas y saturninas, las lunas de Urano no son fácilmente accesibles a través de portales, y la distancia desde el Horizonte hace que otras formas de viaje sean tediosas. La Hermandad Akáshica mantiene una Capilla en una de las lunas, y los Merodeadores ocupan un par más, pero la mayoría de los visitantes vienen a Urano por el aislamiento y, por lo tanto, el sistema está en gran medida inexplorado y deshabitado. Su [Glossary('Reino Sombra','game_concept_shade_realm_desc')], por otro lado, recibe un gran flujo de tráfico."
 uranus_effect_desc: ""
 
 umbra_realm_neptune: "Neptuno"
 umbra_realm_neptune_desc: "Al igual que Urano, hay muy poca actividad de magos tan lejos del Horizonte. Existen varias capillas en las diversas lunas de Neptuno, pero no está claro cuáles; algunas de ellas podrían estar en lunas que los Durmientes aún no han nombrado."
 neptune_effect_desc: ""
 
 umbra_realm_pluto: "Plutón"
 umbra_realm_pluto_desc: "Plutón es un mundo pequeño y helado con una luna proporcionalmente grande llamada Caronte. Hay una gran luna oculta llamada Cerbero donde los Eutánatos mantienen una capilla para estudiar el [Glossary('Reino Sombra','game_concept_shade_realm_desc')]. No permiten el acceso a forasteros; no dudan en usar la fuerza para repeler a los magos que intentan entrar sin permiso, y ninguna de las Tradiciones quiere tentar a la suerte."
 pluto_effect_desc: ""
 
 umbra_realm_moon: "Luna"
 umbra_realm_moon_desc: "Los magos consideran que la Luna tiene al menos tres formas distintas, dependiendo de en qué lado de la Celosía se encuentre uno y de cómo se aproxime a ella.\n\nLa superficie física de la luna es un páramo rocoso y estéril que ha sido visitado raras veces.\n\nLa Luna tiene una Penumbra, pero la Luna penumbral sigue careciendo de vida, aunque aquí son visibles ruinas que muestran que esto no siempre fue así.\n\nLa tercera forma de la Luna es la conocida por los Garou, y es la corte de Phoebe, o Sokhta, el Incarna planetario de la Luna."
 moon_effect_desc: ""
 
 umbra_realm_sun: "Sol"
 umbra_realm_sun_desc: "El área de la [UmbraGlossary('deep_umbra')] que alberga a Helios no es más que calor y una brillante luz blanca. Puentes hechos de luz rojiza, similares a las llamaradas solares, cruzan profundos abismos llenos de elementos atomizados y sobrecalentados. Aquí habitan Incarnae elementales del fuego, brillantes y alegres, pero encargados de defender el Señorío contra los intrusos. Atacarán a cualquier hombre lobo que entre en el Señorío, aunque dan la bienvenida a los Corax y a otros que adoran a Helios. Cualquier superficie dentro del Señorío de Helios es demasiado caliente para estar de pie o permanecer cerca durante mucho tiempo. Solo los espíritus voladores entran en esta área de la Umbra Profunda, y los viajeros sin la capacidad de volar se consumen en el fuego antes de tener la oportunidad de darse cuenta de su error."
 sun_effect_desc: ""

 umbra_realm_shard_realm_of_prime: "Reino Astilla de Prime"
 umbra_realm_shard_realm_of_prime_desc: "[Glossary('Reino Astilla','game_concept_shard_realm_desc')] conectado a la Tierra y a Luna."
 shard_realm_of_prime_effect_desc: ""

 umbra_realm_darkside_moon_base: "Base Lunar del Lado Oscuro"
 umbra_realm_darkside_moon_base_desc: "La Base Lunar del Lado Oscuro es una Construcción de los Ingenieros del Vacío situada en el cráter Daedalus, en el «lado oscuro» de la Luna. Se describe como un lugar oscuro y depresivo para vivir y trabajar."
 darkside_moon_base_effect_desc: ""

 umbra_realm_victoria_station: "Estación Victoria"
 umbra_realm_victoria_station_desc: "La estación Victoria era una estación espacial de Eterita situada en la Penumbra de la Luna. Originalmente una estación de tren del Londres victoriano, servía como base avanzada para muchos Ethernautas que exploraban el [UmbraGlossary('deep_umbra')]."
 victoria_station_effect_desc: ""

 umbra_realm_shard_realm_of_infinity: "Reino Astilla de la Infinito"
 umbra_realm_shard_realm_of_infinity_desc: "[Glossary('Reino Astilla','game_concept_shard_realm_desc')] conectado con el Sol."
 shard_realm_of_infinity_effect_desc: ""

 umbra_realm_shard_realm_of_correspondence: "Reino Astilla de la Correspondencia"
 umbra_realm_shard_realm_of_correspondence_desc: "[Glossary('Reino Astilla','game_concept_shard_realm_desc')] conectado con Mercurio."
 shard_realm_of_correspondence_effect_desc: ""

 umbra_realm_mus: "Mus"
 umbra_realm_mus_desc: "Mus era la única luna de Mercurio, una pequeña roca gris que la poderosa Magia hacía invisible para los observadores de la Tierra."
 mus_effect_desc: ""

 umbra_realm_fors_collegis_mercuris: "Fors Collegis Mercuris"
 umbra_realm_fors_collegis_mercuris_desc: "Fors Collegis Mercuris, «La Escuela Accidental de Mercurio», era una escuela mágica secreta para magos neófitos de la Orden de Hermes. Fue construida originalmente a las afueras de Génova, Italia, en 1190 por magos de la Casa Bonisagus. En 1450, bajo la creciente presión de los asaltos de la Orden de la Razón, la escuela fue transportada al Reino del Horizonte de Mus, la luna invisible de Mercurio."
 fors_collegis_mercuris_effect_desc: ""

 umbra_realm_shard_realm_of_life: "Reino Astilla de la Vida"
 umbra_realm_shard_realm_of_life_desc: "[Glossary('Reino Astilla','game_concept_shard_realm_desc')] conectado con Venus."
 shard_realm_of_life_effect_desc: ""

 umbra_realm_seasonal_realms: "Reinos Estacionales"
 umbra_realm_seasonal_realms_desc: "Los Reinos Estacionales o los Reinos Estacionales de la Verbena son cuatro Señoríos distintos dentro del [UmbraGlossary('shard_realm_of_life')], también conocido como el reflejo Umbral del planeta Venus."
 seasonal_realms_effect_desc: ""

 umbra_realm_shard_realm_of_forces: "Reino Astilla de las Fuerzas"
 umbra_realm_shard_realm_of_forces_desc: "[Glossary('Reino Astilla','game_concept_shard_realm_desc')] conectado con Marte."
 shard_realm_of_forces_effect_desc: ""

 umbra_realm_shard_realm_of_matter: "Reino Astilla de la Materia"
 umbra_realm_shard_realm_of_matter_desc: "[Glossary('Reino Astilla','game_concept_shard_realm_desc')] conectado con Júpiter."
 shard_realm_of_matter_effect_desc: ""

 umbra_realm_shard_realm_of_time: "Reino Astilla del Tiempo"
 umbra_realm_shard_realm_of_time_desc: "[Glossary('Reino Astilla','game_concept_shard_realm_desc')] conectado con Saturno."
 shard_realm_of_time_effect_desc: ""

 umbra_realm_shard_realm_of_spirit: "Reino Astilla del Espíritu"
 umbra_realm_shard_realm_of_spirit_desc: "[Glossary('Reino Astilla','game_concept_shard_realm_desc')] conectado con Urano."
 shard_realm_of_spirit_effect_desc: ""

 umbra_realm_shard_realm_of_mind: "Reino Astilla de la Mente"
 umbra_realm_shard_realm_of_mind_desc: "[Glossary('Reino Astilla','game_concept_shard_realm_desc')] conectado con Neptuno."
 shard_realm_of_mind_effect_desc: ""

 umbra_realm_shard_realm_of_entropy: "Reino Astilla de la Entropía"
 umbra_realm_shard_realm_of_entropy_desc: "[Glossary('Reino Astilla','game_concept_shard_realm_desc')] conectado con Plutón."
 shard_realm_of_entropy_effect_desc: ""

 umbra_realm_cerberus: "Cerbero"
 umbra_realm_cerberus_desc: "Cerbero es el nombre de una luna plutoniana en el sistema solar. No es visible desde la Tierra y, por tanto, nunca ha sido identificada por los Durmientes."
 cerberus_effect_desc: ""

 umbra_realm_shade_realm_of_correspondence: "Reino Sombra de la Correspondencia"
 umbra_realm_shade_realm_of_correspondence_desc: "[Glossary('Reino Sombra','game_concept_shade_realm_desc')] conectado con Mercurio. Este [Glossary('Reino Sombra','game_concept_shade_realm_desc')] no puede alcanzarse directamente desde la Tierra, y quienes logran llegar se encuentran moviéndose a través de un espacio omnidimensional según geometrías insondables."
 shade_realm_of_correspondence_effect_desc: ""

 umbra_realm_shade_realm_of_life: "Reino Sombra de la Vida"
 umbra_realm_shade_realm_of_life_desc: "[Glossary('Reino Sombra','game_concept_shade_realm_desc')] conectado con Venus. Este Señorío es una selva exuberante y siempre cambiante. Su accesibilidad relativa desde la Tierra lo ha convertido en un frecuente campo de batalla en la Guerra de la Ascensión."
 shade_realm_of_life_effect_desc: ""

 umbra_realm_shade_realm_of_forces: "Reino Sombra de las Fuerzas"
 umbra_realm_shade_realm_of_forces_desc: "[Glossary('Reino Sombra','game_concept_shade_realm_desc')] conectado con Marte. El Reino Sombra de las Fuerzas es una tempestad interminable con solo raros y aislados puntos de calma relativa. [doissetep|E] ocupó uno de esos puntos de calma, al menos hasta su destrucción. Al igual que el Reino Sombra de la Vida, es un frecuente (aunque peligroso) escenario para batallas de magos."
 shade_realm_of_forces_effect_desc: ""

 umbra_realm_shade_realm_of_matter: "Reino Sombra de la Materia"
 umbra_realm_shade_realm_of_matter_desc: "[Glossary('Reino Sombra','game_concept_shade_realm_desc')] conectado con Júpiter. Este Señorío puede estar conectado con la Tierra Hueca, o puede ser similar pero a una escala mucho mayor: un imperio de dinosaurios, civilizaciones perdidas y otras cosas que ya no existen."
 shade_realm_of_matter_effect_desc: ""

 umbra_realm_shade_realm_of_time: "Reino Sombra del Tiempo"
 umbra_realm_shade_realm_of_time_desc: "[Glossary('Reino Sombra','game_concept_shade_realm_desc')] conectado con Saturno. Cualquier visitante al Reino Sombra del Tiempo se arriesga seriamente, ya que incluso el más mínimo movimiento provoca distorsiones temporales y viajes en el tiempo incontrolados."
 shade_realm_of_time_effect_desc: ""

 umbra_realm_shade_realm_of_spirit: "Reino Sombra del Espíritu"
 umbra_realm_shade_realm_of_spirit_desc: "[Glossary('Reino Sombra','game_concept_shade_realm_desc')] conectado con Urano. No hay Celosía en el Reino Sombra del Espíritu: los espíritus y los mortales pueden interactuar directamente. También es posible que el Avatar de un mago se manifieste corpóreamente aquí y converse con ellos."
 shade_realm_of_spirit_effect_desc: ""

 umbra_realm_shade_realm_of_mind: "Reino Sombra de la Mente"
 umbra_realm_shade_realm_of_mind_desc: "[Glossary('Reino Sombra','game_concept_shade_realm_desc')] conectado con Neptuno. La naturaleza del Reino Sombra de la Mente es, como cabría esperar, definida por lo que uno espera encontrar allí. Refleja los propios pensamientos y sentimientos del visitante, de forma muy similar a un espejo."
 shade_realm_of_mind_effect_desc: ""

 umbra_realm_shade_realm_of_entropy: "Reino Sombra de la Entropía"
 umbra_realm_shade_realm_of_entropy_desc: "[Glossary('Reino Sombra','game_concept_shade_realm_desc')] conectado con Plutón. Supuestamente aquí la Gran Rueda Kármica del Universo queda al descubierto, e incluso puede tener una conexión directa con el [UmbraGlossary('shadowlands')]."
 shade_realm_of_entropy_effect_desc: ""

 umbra_realm_first_horizon: "Primer Horizonte"
 umbra_realm_first_horizon_desc: "El Primer Horizonte se encuentra en el límite de la atmósfera terrestre y está salpicado de Reinos del Horizonte, incluyendo el [Glossary('Reino Sombra','game_concept_shade_realm_desc')]."
 first_horizon_effect_desc: ""

 umbra_realm_true_horizon: "Horizonte Verdadero"
 umbra_realm_true_horizon_desc: "El Horizonte Verdadero es una vasta extensión de la [umbra|E] situada entre la Umbra Cercana y la Umbra Lejana. Para los Durmientes, se manifiesta como el espacio entre el Sol y el cinturón de asteroides."
 true_horizon_effect_desc: ""

 umbra_realm_autochthonia: "Autochthonia"
 umbra_realm_autochthonia_desc: "Autochthonia, conocida como el Reino de la Vinculación por los Herméticos, es un Shenti de la Estasis controlado por la Tecnocracia, una manifestación gigantesca de la Tejedora. Autochthonia existe en las profundidades del [UmbraGlossary('true_horizon')], orbitando el Sol en oposición directa a la Tierra."
 autochthonia_effect_desc: ""

 umbra_realm_balador: "Balador"
 umbra_realm_balador_desc: "Balador era una capilla del Reino del Horizonte controlada por el Culto del Éxtasis, donde los miembros de la Tradición y sus invitados de honor podían entregarse a una variedad de placeres que alteraban la mente.\n\nLa historia de Balador es algo difusa, pero existió en la época de la Gran Convocación, cuando conmocionó a los visitantes de otras Tradiciones que solo veían la libertinaje sin la disciplina. La única ley importante en Balador es «Si no daña a nadie, haz lo que quieras»; se redactó un código de conducta más detallado después de que demasiados visitantes violaran la primera cláusula de este principio básico."
 balador_effect_desc: ""

 umbra_realm_gernsback_continuum: "Continuo Gernsback"
 umbra_realm_gernsback_continuum_desc: "El Continuo Gernsback es un Reino del Horizonte construido por los Eteritas como una expresión idealizada de su paradigma.\n\nEl Reino aparece como una reluciente ciudad Art Déco llena de las maravillas de la ciencia y la tecnología. Pasillos móviles, propulsores de reacción y edificios de cristal angulares son características del Reino. Por la noche, se pueden ver los cuerpos celestes magnificados en el cielo."
 gernsback_continuum_effect_desc: ""

 umbra_realm_midrealm: "Entrerreino"
 umbra_realm_midrealm_desc: "El Entrerreino es un Reino Umbral en el centro de la [umbra|E]. Contiene el Alder Bole, un Árbol del Mundo primordial que formó la Teluria, y tiene una logia donde los Umbroles de todo tipo pueden reunirse en paz.\n\nEl Entrerreino no es solo el centro mismo de la [umbra|E], sino que también puede ser el centro de la Realidad. Algunos estudiosos creen que incluso podría ser el Monte Qaf y/o el Punto de Correspondencia."
 midrealm_effect_desc: ""

 umbra_realm_moreauvia: "Moreauvia"
 umbra_realm_moreauvia_desc: "Moreauvia, también conocida como Plantación de Investigación n.º 4: Constructo Moreauvia, es un Reino del Horizonte de los Progenitores donde la Convención realiza ingeniería genética de esclavos."
 moreauvia_effect_desc: ""

 umbra_realm_red_donjon: "Red Donjon"
 umbra_realm_red_donjon_desc: "La Antigua Alianza de magos ha existido durante casi 600 años. Aunque esta cábala mantiene un considerable Reino del Horizonte, llamado Red Donjon, los magos pasan la mayor parte de su tiempo en Edimburgo y sus alrededores."
 red_donjon_effect_desc: ""
 
 umbra_realm_yenosia: "Yenosia"
 umbra_realm_yenosia_desc: "Yenosia es un Reino del Horizonte. Originalmente llamada la Tierra de los Sueños, albergaba una capilla de magos llamada Arcosia, compuesta principalmente por pacifistas del Chœur Céleste."
 yenosia_effect_desc: ""
 
 umbra_realm_null_b: "Null-B"
 umbra_realm_null_b_desc: "Null-B era un Constructo de la Unión Tecnocrática. Se encontraba en el centro de [UmbraGlossary('yenosia')], un Reino del Horizonte."
 null_b_effect_desc: ""
 
 umbra_realm_horizon: "Horizonte"
 umbra_realm_horizon_desc: "Horizonte era la fortaleza más grande del Concilio de las Nueve Tradiciones Místicas, un Reino del Horizonte donde la cultura y el paradigma de cada Tradición existían en relativa armonía con los demás."
 horizon_effect_desc: ""
 
 umbra_realm_concordia: "Concordia"
 umbra_realm_concordia_desc: "Concordia es la ciudad principal de [UmbraGlossary('horizon')], y la ubicación de la Cámara del Concilio para el Concilio de las Nueve Tradiciones Místicas."
 concordia_effect_desc: ""
 
 umbra_realm_far_horizon: "Horizonte Lejano"
 umbra_realm_far_horizon_desc: "El Horizonte Lejano corresponde aproximadamente a la ubicación del cinturón de asteroides."
 far_horizon_effect_desc: ""

 umbra_realm_deep_umbra: "Umbra profunda"
 umbra_realm_deep_umbra_desc: "La Umbra Profunda, también llamada el Universo Profundo, es un vasto reino fuera del espacio Umbral de la Tierra. Es, en gran medida, un vacío inmenso. Desde la perspectiva humana, la Umbra Profunda es el espacio profundo, el espacio exterior o la totalidad del universo."
 deep_umbra_effect_desc: ""

 umbra_realm_malfeas: "Malfeas"
 umbra_realm_malfeas_desc: "Malfeas es el loco reino Shenti del Wyrm situado en la [UmbraGlossary('deep_umbra')]. Este es un mundo de pesadilla infernal lleno de todas las cosas horribles imaginables, y algunas tan horribles que el simple hecho de intentar imaginarlas volvería loca a la gente."

 umbra_realm_central_duchy: "Ducado Central"
 umbra_realm_central_duchy_desc: "Una piedra circular elevada inscrita con una espiral se encuentra en el centro de esta zona grande e irregularmente formada. Edificios enormemente elaborados y amenazantes rodean el patio, cada uno de más de un kilómetro de altura. Una de estas grandes estructuras es la enorme Gran Catedral, con un inmenso vitral que representa monstruosidades tentaculares surgiendo de debajo de la tierra. Esta catedral está dedicada a todas las cabezas de la Hydra y es el único lugar en todo [UmbraGlossary('malfeas')] que da la bienvenida abiertamente a aquellos leales a cualquiera de estas cabezas."
 central_duchy_effect_desc: "@wyrm_icon![umbra_expedition|E]: Explora secuencialmente las nueve salas del Templo Obscura"
 
 umbra_realm_maeljin_duchies: "Ducados de Maeljin"
 umbra_realm_maeljin_duchies_desc: "Un muro masivo hecho de piedra y hueso fosilizado custodia el [UmbraGlossary('central_duchy')], y los dominios de cada uno de los Incarna Maeljin colindan con este muro, rodeándolo por todos lados. El muro que rodea el Ducado Central tiene traicioneras puntas de hierro afiladas como cuchillas en la parte superior, decoradas regularmente con los cuerpos de cualquiera que haya desagradado particularmente al Incarna Maeljin cuyo dominio colinda esa sección del muro."
 maeljin_duchies_effect_desc: "@wyrm_icon![umbra_expedition|E]: Obtén [urgetaints_lifestyle|E] [lifestyle_experience|E] si tienes el [lifestyle|E]"

 umbra_realm_border_duchies: "Ducados Fronterizos"
 umbra_realm_border_duchies_desc: "Algunas porciones de [UmbraGlossary('malfeas')] que se encuentran entre los [UmbraGlossary('maeljin_duchies')] parecen ser páramos yermos, pero las apariencias pueden engañar. Estos páramos son en realidad otros dos Ducados pertenecientes a Incarna Maeljin que evitan interactuar con otros de su especie."
 border_duchies_effect_desc: "@wyrm_icon![umbra_expedition|E]: Descubrir un [men_at_arms|E] de la Maldición"
 
 umbra_realm_earth_pit: "Foso de la Tierra"
 umbra_realm_earth_pit_desc: "Para los hombres lobo, uno de los lugares más peligrosos de todo [UmbraGlossary('malfeas')] es el Foso de la Tierra. Situado en un cañón entre uno de los pantanos de Knight Entropía y el desierto del Ángel Sin Nombre de la Desesperación, el Foso de la Tierra es una región vasta que duplica las características generales de muchos de los paisajes más prístinos y prósperos de la Tierra, pero como una parodia envenenada y tóxica de los originales."
 earth_pit_effect_desc: "@wyrm_icon![umbra_expedition|E]: Encontrar un $glossary_wyrm$ [fetish|E]"
 
 umbra_realm_elemental_duchies: "Ducados Elementales"
 umbra_realm_elemental_duchies_desc: "Los confines más remotos de [UmbraGlossary('malfeas')] contienen los cuatro Ducados Elementales de la niebla, el Fuego Infernal, el lodo y la toxina.\n\nLos palacios de los cuatro Maeljin elementales se encuentran cerca del centro de cada Ducado. Destruir uno de estos castillos de corrupción podría debilitar al elemento, especialmente si los Garou también destruyen permanentemente al Maeljin elemental."
 elemental_duchies_effect_desc: "@wyrm_icon![umbra_expedition|E]: Encontrar un Espíritu de la Maldición Elemental"
 
 umbra_realm_black_spiral_labyrinth: "Laberinto de la Espiral Negra"
 umbra_realm_ebon_maze: "Laberinto de Ébano"
 umbra_realm_black_spiral_labyrinth_desc: "El Laberinto de la Espiral Negra, también llamado el Laberinto de Ébano en el Reino Medio, es un laberinto en espiral dentro del señorío de [UmbraGlossary('malfeas')] que contiene horrores inimaginables del Wyrm."
 black_spiral_labyrinth_effect_desc: "@wyrm_icon![umbra_expedition|E]: Encontrar un $glossary_wyrm$ [fetish|E]"
 
 umbra_realm_copernicus_research_center: "Centro de Investigación Copérnico"
 umbra_realm_copernicus_research_center_desc: "El Centro de Investigación Copérnico («The Cop») es una enorme esfera de Dyson translúcida controlada por los Ingenieros del Vacío. Rodea a una de las estrellas de Alfa Centauri y se extiende hasta una UA de radio."
 copernicus_research_center_effect_desc: ""
 
 umbra_realm_first_city: "Primera Ciudad"
 umbra_realm_first_city_desc: "La Primera Ciudad, también conocida como la Ciudad de Enoc entre otros nombres, es reconocida por los eruditos nodistas como la primera ciudad de la mitología Cainita, tal como se documenta en el Libro de Nod."
 first_city_effect_desc: "El personaje estacionado gana un poco de [prestige|E] cada #V 3#! meses."
 
 umbra_realm_mirror_zone: "Zona Espejo"
 umbra_realm_mirror_zone_desc: "La misteriosa Zona Espejo disfruta mostrando a sus «huéspedes» lo que podría haber sido."
 mirror_zone_effect_desc: "[umbra_aptitude|E]: [grace_i]#P +25%#!"
 
 umbra_realm_null_zone: "Caminos de Wyck"
 umbra_realm_null_zone_desc: "Los Caminos de Wyck son un laberinto de pequeños senderos que conducen a la mayoría de los señoríos de la [umbra|E]. Orientarse aquí es difícil, ya que los caminos siempre están cambiando y todos parecen iguales."
 null_zone_effect_desc: "[umbra_aptitude|E]: [grace_i]#P +25%#!"

 umbra_realm_neter_khertet: "Neter-khertet"
 umbra_realm_neter_khertet_desc: "Antes de la fundación del [UmbraGlossary('dark_kingdom_of_sand')], los muertos egipcios habitaban en Neter-Khertet, el «lugar subterráneo divino»."
 neter_khertet_effect_desc: ""

 umbra_realm_kakuri: "Kakuri"
 umbra_realm_kakuri_desc: "También conocido como el Reino de la Noche, Kakuri es un [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] controlado por el [Glossary('Rey Yama','podgloss.yamaking')] [Glossary('Emma-O','podgloss.emmao')].\nKakuri es un dominio de aspecto Yin, un vacío de hielo y nieve sin luz, sin alegría y sin honor.\nComo dominio ancestral de la muerte de los Ainu, Kakuri tiene una salida secreta para los adoradores originales de [Glossary('Emma-O','podgloss.emmao')]."

 kakuri_effect_desc: "Puede reclutar a [GetMaA('shikome_assassin').GetName] como [men_at_arms|E]\nPuede reclutar a [GetMaA('kumo_huntress').GetName] como [men_at_arms|E]\n$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_wicked_city: "Ciudad Perversa"
 umbra_realm_wicked_city_desc: "La Ciudad Perversa es una pesadilla de cyberpunk, Feng Shui demencial y teorías de gestión que te destrozan el alma.\nEs un lugar donde todos los peores elementos de la codicia y el capitalismo se encuentran en la atmósfera de corrupción de Yomi. Es también uno de los Infiernos de más rápido crecimiento dentro de Yomi Wan."
 wicked_city_effect_desc: "Puede reclutar a [GetMaA('shinjuku_undercity_scavengers').GetName] como [men_at_arms|E]\nPuede reclutar a [GetMaA('mikaboshis_demons_of_iron_and_violence').GetName] como [men_at_arms|E]\n$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_hell_of_burrowing_maggots: "Infierno de las Larvas Cavadoras"
 umbra_realm_hell_of_burrowing_maggots_desc: "El Infierno de las Larvas Cavadoras. Controlado por Rangda, señora de la pestilencia. El Infierno de las Larvas Cavadoras es básicamente lo que parece. Es un infierno. Tiene larvas. Muchísimas. De todas las formas y tamaños. Tú eres el almuerzo."
 hell_of_burrowing_maggots_effect_desc: "Puede reclutar a [GetMaA('raksha_of_ravana').GetName] como [men_at_arms|E]\n$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_hell_of_being_skinned_alive: "Infierno de ser Desollado Vivo"
 umbra_realm_hell_of_being_skinned_alive_desc: "El Infierno de ser Desollado Vivo. El dominio de [Glossary('Tou Mu','podgloss.toumu')]. El Infierno de ser Desollado Vivo es un desierto que soporta vientos constantes de arena fina, rápida y lacerante. Los seres desprotegidos son desollados en cuestión de minutos. La propia [Glossary('Tou Mu','podgloss.toumu')] gobierna desde un palacio en órbita baja decorado con los cuerpos empalados (y vivos) de aquellos que la han molestado."
 hell_of_being_skinned_alive_effect_desc: "Puede reclutar a [GetMaA('the_children_of_tou_mou').GetName] como [men_at_arms|E]\n$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_hell_of_boiling_oil: "Infierno del Aceite Hirviendo"
 umbra_realm_hell_of_boiling_oil_desc: "El Infierno del Aceite Hirviendo. En realidad es grasa. Grasa humana deliciosamente clarificada."
 hell_of_boiling_oil_effect_desc: "Puede reclutar a [GetMaA('fat_striders_of_the_hell_of_boiling_oil').GetName] como [men_at_arms|E]\n$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_hell_of_bitter_truth: "Infierno de la Verdad Amarga"
 umbra_realm_hell_of_bitter_truth_desc: "El Infierno de la Verdad Amarga es el destino para los fanáticos religiosos. Aunque el Infierno de la Verdad Amarga no ofrece tormentos físicos, para estas personas religiosas, la idea de que no fueron dignas del Cielo o —peor aún— que su religión era errónea, sirve como una fuente constante de miseria. Los sirvientes demoníacos de Hen Tian recuerdan regularmente a los internos que no fueron dignos de presenciar a los dioses, y a veces ofrecen a las almas formas de «redimirse» para alcanzar el dominio de sus deidades. Naturalmente, todas estas misiones son trampas que a menudo implican servir al [Glossary('Yama King','podgloss.yamaking')], hundiendo a las víctimas aún más profundamente en la desesperación una vez que conocen la verdad."
 hell_of_bitter_truth_effect_desc: "$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_hell_of_spiked_chains: "Infierno de las Cadenas con Púas"
 umbra_realm_hell_of_spiked_chains_desc: "El Infierno de las Cadenas con Púas era una vasta llanura habitada por las almas de los mortales que habían muerto en las estepas. Cada una de estas almas era asignada a una tribu al azar por el [Glossary('Yama King','podgloss.yamaking')], quien periódicamente elegía a una de estas tribus como su favorita. Todas las demás tribus eran privadas de uno de sus sentidos (o extremidades) y debían obedecer a la tribu favorecida en todo. Si desobedecían, o si a uno de los Favorecidos le apetecía, eran sometidos a las torturas de la Cadena con Púas. Las víctimas eran atadas con cadenas de hierro con espinas forjadas en el [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] y colgadas de las estalactitas de una gran cueva durante un periodo de tiempo indeterminado. Cada vez que las víctimas forcejeaban, las espinas se clavaban más profundamente en su esencia, alimentando al [Glossary('Yama King','podgloss.yamaking')]."
 hell_of_spiked_chains_effect_desc: "$UMBRA_INVESTMENTS_OF_SOUL$"

 umbra_realm_qlippoth: "Qlifot"
 umbra_realm_qlippoth_desc: "Los Qlifot son mundos rechazados que contienen un universo a medio hacer habitado por criaturas de antes de la creación del Tapiz.\n\nLa Esencia de un Qlippah no es necesariamente malvada, pero sí peligrosa para la humanidad y el universo al que se han acostumbrado. Algunos Qlifot contienen aspectos absolutos de Dios, lo que haría imposible el libre albedrío y no permitiría la evolución de la vida, mientras que otros contienen conceptos aún más esotéricos que resultan demasiado ajenos para que la mente humana pueda comprenderlos."
 qlippoth_effect_desc: ""

 umbra_realm_doissetep: "Doissetep"
 umbra_realm_doissetep_desc: "Doissetep es un castillo masivo de hasta una milla de diámetro y treinta pisos de altura. A lo largo de sus muchos siglos de existencia se han añadido nuevas alas, niveles y ampliaciones, dándole un aspecto ecléctico. Innumerables cámaras y pasillos conforman la parte superior de la Capilla, mientras que debajo, un retorcido nido de túneles conduce a varias catacumbas en la montaña. Pasadizos secretos conectan muchas de las habitaciones, permitiendo que los residentes conocedores se desplacen sin ser vistos. La parte central es una estructura ciclópea con rasgos orientales."
 doissetep_effect_desc: ""

 umbra_realm_hive_realm: "Señorío Colmena"
 umbra_realm_hive_realm_desc: "Los Señoríos Colmena son el resultado de la Tormenta de Avatares. La Tormenta desgarró algunos Señoríos junto con la membrana y los fusionó con nuevos y perturbadores Señoríos que salpican la [umbra|E]. Cada mago que intenta acceder a un Señorío tiene buenas probabilidades de contactar con un Señorío Colmena en su lugar. La mayoría está compuesta por piedra carmesí y desmoronada, y tiene una atmósfera muy tenue que dificulta la respiración."
 hive_realm_effect_desc: ""