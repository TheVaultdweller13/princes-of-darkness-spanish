 umbra_discovery.elemental_court_armor_expedition.desc: "$umbra_discovery_finder$ ha descubierto el legendario $umbra_discovery_region$. Al encontrar un artefacto interesante en la Corte Elemental de la Tierra, $umbra_discovery_finder$ solicita ahora que se lance una [umbra_expedition|E] adecuada para investigar."
 umbra_discovery_elemental_court_armor_expedition2: "La Armadura Elemental"
 umbra_discovery.elemental_court_armor_expedition2.desc: "$umbra_discovery_finder$ ha descubierto el legendario $umbra_discovery_region$, más precisamente la Corte Elemental del Fuego. Una [umbra_expedition|E] para mejorar tu Armadura Elemental podría ser ahora una perspectiva válida."
