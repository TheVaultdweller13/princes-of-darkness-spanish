 umbra_discovery.elemental_court_armor_expedition3.desc: "$umbra_discovery_finder$ ha descubierto el legendario $umbra_discovery_region$, más precisamente la Corte Elemental del Agua. Una [umbra_expedition|E] para mejorar tu Armadura Elemental podría ser ahora una perspectiva válida."
