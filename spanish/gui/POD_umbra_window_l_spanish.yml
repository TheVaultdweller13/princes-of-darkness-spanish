 umbra_place_earth_tooltip: "Los [GetTrait('wraith').GetName( GetNullCharacter )] sin ataduras que no sean [GetTrait('risen').GetName( GetPlayer )] ganan #N 40#! de [stress|E] cada año para mantenerse en las [Glossary('Tierras de Piel','game_concept_skinlands_desc')]."
 umbra_place_shadowlands_tooltip: "Un [GetTrait('wraith').GetName( GetNullCharacter )] sin [Fetters|E] gana una cantidad media de [stress|E] cada año para mantenerse en las [UmbraGlossary('shadowlands')]. (10 % de probabilidad por cada [Fetter|E] no asignada o perdida)"
 umbra_place_dark_kingdom_tooltip: "Quedarse en el [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] para no ganar [stress|E] debido a la falta de [Fetters|E]"
 
 broken_mirror_valid_tooltip: "Tu ubicación ([GetPlayer.GetCurrentLocation.GetName]) #bold no#! tiene [GetBuilding('wyrm_taint_01').GetName] ni una [faith|E] que acepte el infernalismo."
 labyrinth_progress_effect_tooltip: "Ganas #V 100#! de progreso de exploración en el [UmbraGlossary('pod_realm_labyrinth')] (si estás estacionado)."
 
 glen_desc: "Un Glen es un área de la [UmbraGlossary('penumbra')] saturada con las energías del $glossary_wyld$. Los Glens suelen estar vinculados a zonas de naturaleza virgen en el mundo material (lo que los hace cada vez más raros e inaccesibles)."
 hellhole_desc: "Una Cloaca es un área de la [UmbraGlossary('penumbra')] saturada con energías de la Wyrm, generalmente debido a algo particularmente destructivo o tóxico que existe en el lado material de la Celosía. Las Cloacas son profundamente destructivas para todo lo que las rodea y son criaderos de Banes poderosos."
 veinous_stair_desc: "La Escalera Venosa es un pasaje desde Estigia directamente hacia el [UmbraGlossary('pod_realm_labyrinth')]. Siendo el lugar más estable de las [UmbraGlossary('shadowlands')], la Escalera está compuesta por una piedra negra de tipo desconocido."
 onyx_tower_desc: "La Torre de Ónice es la morada de Caronte, el pasado y futuro Emperador de Estigia. El edificio más alto de Estigia, representa el poder de Caronte y su capacidad para supervisar el [UmbraGlossary('dark_kingdom_of_iron')]."
 periphery_desc: "La Periferia, a veces llamada también la «Penumbra Suave», es un lugar —o un estado mental, como señalarían muchos $glossary_fera$— entre la [UmbraGlossary('penumbra')] y el Mundo Material."
 broken_mirror_desc: "Los Espejos Rotos son lugares donde los límites entre el Mundo Material y el [UmbraGlossary('yomi_wan')] se han debilitado debido a cantidades masivas de sufrimiento mortal, Chi Corrupto y espíritus desolados."
 blight_desc: "Una Plaga es un área de la [UmbraGlossary('penumbra')] dañada por la contienda entre la $glossary_weaver$ y la $glossary_wyrm$. Estas zonas urbanas están densas de Banes y asfixiadas por las redes de la Tejedora; en cierto modo, representan todos los aspectos negativos de una ciudad, reificados y comprimidos en un área pequeña."
 broken_lands_desc: "Una Tierra Rota es algo sacado de un cuento de hadas. Se oye hablar de gente que encuentra una bifurcación en un sendero donde antes no la había, o una cueva abriéndose en un acantilado que hace dos días era sólido. Los caballos no quieren seguir ese camino y se ponen muy nerviosos cuanto más se acercan. A veces el sendero conduce a una extraña zona de naturaleza salvaje donde los animales no se comportan correctamente: liebres que cazan coyotes, arañas que tejen redes de plata o buitres que devoran los huesos de los cadáveres sin dañar la carne. Puede que el sol no salga durante días, o que la luna brille de color verde o rojo."
 vista_desc: "Las Vistas son áreas dentro de la [umbra|E] que abren una especie de representación que refleja uno de cuatro temas: Muerte, Estasis, Caos u Origen.\n\nNo se puede interactuar con las Vistas; simplemente muestran a la entidad que las encuentra una visión de algún estado alternativo cuando o donde sea informado por uno de sus temas. Las escenas representadas muestran un mundo donde ha ocurrido algo trascendental, como la creación del universo o niveles estupefacientes de orden. Estos paisajes escénicos umbríos se extienden por todo tu campo de visión, como si lo que estuviera ocurriendo estuviera justo delante de ti. Parecen más eventos que teatros y afectan a todos los sentidos del viajero."
 
