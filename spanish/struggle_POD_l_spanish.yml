 pod_assamite_struggle.108.t: "La Red de Cuchillos"
 pod_assamite_struggle.108.desc: "Una facción no oficial dentro de los Banu Haqim, la Red de Cuchillos es un culto secreto de asesinos dedicados al culto de un misterioso Matusalén llamado Ur-Shulgi. Son fanáticos que desearían destruir a cualquier vampiro que se niegue a servir a su maestro. También se les conoce como asesinos sedientos de sangre y son responsables de la mala reputación del $pod_clan$ en su conjunto ante los forasteros.\nCon gran esfuerzo y recursos, podrías embarcarte en una campaña para ayudar o desacreditar a esta facción en el panorama político general de los Banu Haqim."
 pod_assamite_struggle.108.a: "Ayudar a esta facción"
 pod_assamite_struggle.108.b: "Confrontar a esta facción"
 pod_assamite_struggle.108.c: "Nada por el momento"
 faction_gain_influence_tt: "La influencia de esta facción aumentará"
 faction_lose_influence_tt: "La influencia de esta facción disminuirá"
 
 pod_assamite_struggle.109.t: "La Ashirra"
 pod_assamite_struggle.109.desc: "Esta poderosa facción de los Banu Haqim aboga por una colaboración más estrecha con el movimiento [Glossary('Ashirra','game_concept_ashirra_desc')]. Está compuesta principalmente por vampiros jóvenes que fueron seguidores del Islam en vida, pero algunos Antiguos poderosos también se han convertido a esta causa. Con el Islam volviéndose cada vez más dominante en la región, la facción de la Ashirra tiene un impulso serio a su favor. Tienden a aliarse con el Consejo de Pergaminos con la esperanza de convertirse en una opción de compromiso aceptable para todos los demás.\nCon gran esfuerzo y recursos, podrías embarcarte en una campaña para ayudar o desacreditar a esta facción en el panorama político general de los Banu Haqim."
 
 pod_assamite_struggle.110.t: "El Consejo de los Pergaminos"
 pod_assamite_struggle.110.desc: "Creado inicialmente para la búsqueda y salvaguarda del conocimiento en Alamut, el Consejo de los Pergaminos ha evolucionado hasta convertirse en una facción política para los Hechiceros y Vizires que favorecen una solución de compromiso para la crisis actual. A pesar de esta postura, se oponen ferozmente a la Red de Cuchillos, principalmente debido a la influencia de su fundador Al-Ashrad. El Consejo trabaja actualmente con la facción [Glossary('Ashirra','game_concept_ashirra_desc')], viéndolos como una buena opción para mantener estables a los Banu Haqim en el futuro.\nCon gran esfuerzo y recursos, podrías embarcarte en una campaña para ayudar o desacreditar a esta facción en la escena política general de los Banu Haqim."
 
 pod_assamite_struggle.111.t: "La Silsila"
 pod_assamite_struggle.111.desc: "El sacerdocio guerrero de élite de los Banu Haqim fueron los verdaderos líderes de Alamut durante los tiempos del dominio zoroástrico. Como tales, se han vinculado estrechamente con esta religión y han ido decayendo junto a su fe. El regreso de Nakurtum como la Anciana en 1214 ayudó a salvaguardar la poca influencia que les quedaba, pero esto podría ser demasiado poco y demasiado tarde, especialmente considerando que la gran mayoría de los nuevos Banu Haqim provienen de linaje mortal musulmán.\nCon gran esfuerzo y recursos, podrías embarcarte en una campaña para ayudar o desacreditar a esta facción en la escena política general de los Banu Haqim."
  
 pod_assamite_struggle.112.t: "La Tribu Perdida"
 pod_assamite_struggle.112.desc: "La Tribu Perdida es un culto herético de (principalmente) Banu Haqim que adora a la fallecida Zilah e intenta vengarla destruyendo a sus asesinos, la Tercera Generación, y a quienes los siguen. Esto les coloca en conflicto directo con el resto del $pod_clan$ que venera a Haqim y, como tal, han sido purgados de la política de Alamut una y otra vez. Aun así, su influencia es insidiosa y tienden a reaparecer cuando menos se les espera.\nCon gran esfuerzo y recursos, podrías embarcarte en una campaña para ayudar o desacreditar a esta facción en la escena política general de los Banu Haqim."
  
 clashing_heretics_modifier: "Heréticos en conflicto"
 clashing_heretics_modifier_desc: "Este condado es el centro de una guerra en las sombras entre dos sectas enfrentadas."
 
 pod_assamite_struggle.1000.t: "Heréticos en conflicto"
 pod_assamite_struggle.1000.desc: "Aunque ambas son cultos heréticos dentro de los Banu Haqim, la Tribu Perdida y la Red de Cuchillos no se tienen afecto. Ven a su contraparte como la amenaza más apremiante para el $pod_clan$ y su guerra en las sombras es probablemente la más mortífera de todas las facciones.\nUno de tus condados ha experimentado recientemente un aumento de este tipo de actividad radical, y ambos cultos están perturbando a la población mortal y volviéndose cada vez más complicados de gestionar. Es poco probable que puedas razonar con ellos, pero aliarse con una facción podría asegurar que, al menos, el disturbio no dure demasiado tiempo."
 pod_assamite_struggle.1000.a: "Enviar ayuda a la Red de Cuchillos."
 pod_assamite_struggle.1000.b: "Enviar ayuda a la Tribu Perdida."
 pod_assamite_struggle.1000.c: "Manipular a cada facción para resolver el asunto."
 pod_assamite_struggle.1000.a.success: "Resuelto."
 pod_assamite_struggle.1000.a.failure: "Empeorando..."
 pod_assamite_struggle.1000.d: "¡Yo gobierno aquí, no ellos!"
 wok_gain_influence_tt: "La Red de Cuchillos gana influencia."
 wok_lose_influence_tt: "La Red de Cuchillos pierde influencia."
 losttribe_gain_influence_tt: "La Tribu Perdida gana influencia."
 losttribe_lose_influence_tt: "La Tribu Perdida pierde influencia."
 
 pod_assamite_struggle.1001.t: "Deberes de los Fieles"
 pod_assamite_struggle.1001.desc: "La comunidad [Glossary('Ashirra','game_concept_ashirra_desc')] es muy fuerte en Persia. Uno de los principios de este movimiento es dejar que los mortales vivan como deseen, con la menor interferencia posible por parte de los vampiros. Obviamente, esto no siempre es muy práctico para un gobernante de la noche.\nUn representante de la Ashirra ha llegado recientemente a tu dominio, quejándose de que tus agentes están adoptando un enfoque demasiado contundente respecto a los asuntos mortales en la zona."
 pod_assamite_struggle.1001.a: "Negociar un compromiso."
 pod_assamite_struggle.1001.a.success: "Un buen trato."
 pod_assamite_struggle.1001.a.failure: "Gritos y discusiones."
 pod_assamite_struggle.1001.b: "Está bien, no interferiremos."
 ashirra_gain_influence_tt: "La Ashirra gana influencia."
 ashirra_lose_influence_tt: "La Ashirra pierde influencia."
 pod_assamite_struggle.1001.c: "¡Yo gobierno como me parezca conveniente!"
 
 pod_assamite_struggle.1002.t: "La verdad sobre Haqim"
 pod_assamite_struggle.1002.desc: "Una figura venerada entre sus hijos, aunque Haqim sigue siendo un misterio para la mayoría de ellos. Un hombre de pocas palabras mientras estuvo activo, su desaparición solo profundizó los rumores que lo rodeaban. Dada la naturaleza fracturada actual del Clan, es natural que el tema de la verdadera naturaleza de Haqim salga a la luz con frecuencia.\nComo influyente gobernante de la noche, tu opinión importa más que la mayoría."
 pod_assamite_struggle.1002.a: "Haqim, aunque grande, no era más que un siervo del Más Grande."
 silsila_gain_influence_tt: "La Silsila gana influencia."
 pod_assamite_struggle.1002.b: "Haqim es el juez final del valor de la humanidad."
 council_gain_influence_tt: "El Consejo de los Pergaminos gana influencia."
 pod_assamite_struggle.1002.c: "Un gran hombre, aunque a veces imperfecto."
 pod_assamite_struggle.1002.d: "No creo que Haqim sea tan importante..."
 
 pod_assamite_struggle.1003.t: "El Pergamino Perdido"
 pod_assamite_struggle.1003.desc: "Tus agentes han capturado recientemente a un ladrón que Alamut llevaba investigando un tiempo. Tras una inspección más detallada, parece que este hombre no es realmente un ladrón, sino un erudito con, al parecer, un escrito importante realizado en los tiempos de Zoroastro.\nEl liderazgo de la Silsila, guardianes de la historia y mayoritariamente zoroástricos, te pide que les entregues los escritos, tras una compensación por tu ayuda, obviamente. Pero tienes otras opciones disponibles..."
 pod_assamite_struggle.1003.a: "Es un placer servir."
 silsila_lose_influence_tt: "La Silsila pierde influencia."
 pod_assamite_struggle.1003.b: "Quema el pergamino. Y al «ladrón»."
 pod_assamite_struggle.1003.c: "Tengo otros amigos que podrían estar interesados..."
 pod_assamite_struggle.1003.d: "Simplemente me lo quedaré."
 
 pod_assamite_struggle.1004.t: "Salida de cuchillos"
 pod_assamite_struggle.1004.desc: "Uno de los pueblos periféricos de tu dominio ha sido «visitado» recientemente por los fanáticos de la Red de Cuchillos quienes, si lo que dicen los supervivientes es cierto, buscaban a un espía infiel. Como siempre, los métodos de la Red de Cuchillos fueron brutales y especialmente traumáticos para tus súbditos mortales.\nLimpiar el desastre no debería ser muy difícil, pero quizá quieras reaccionar ante este ataque encubierto contra tu autoridad."
 pod_assamite_struggle.1004.a: "¿Un espía? ¡Arrasa el pueblo!"
 pod_assamite_struggle.1004.b: "Denuncia públicamente a la Red de Cuchillos."
 wok_lose_lot_influence_tt: "La Red de Cuchillos pierde mucha influencia."
 pod_assamite_struggle.1004.c: "Rastrear y ocuparse de los agresores."
 pod_assamite_struggle.1004.d: "No hay necesidad de enfurecer a la Red por tan poco."
 involved_knives_out_tt: "Los gobernantes implicados en la Contienda que sigan el Camino de la Rectitud perderán 50 de opinión contigo."
 involved_knives_out_lots_tt: "Los gobernantes implicados en la Contienda que sigan el Camino de la Rectitud perderán 100 de opinión contigo."
 
 pod_assamite_struggle.1005.t: "Tierra de espías"
 pod_assamite_struggle.1005.desc: "Persia es un lugar enorme, y eso hace que la necesidad de un sistema de mensajería fiable hacia y desde Alamut sea muy importante. Aunque los Ghouls mensajeros son buenos y demás, estás bastante seguro de que la mayoría de sus viajes están vigilados por las facciones menos escrupulosas de la Contienda actual. Sospechas que es muy probable que tus informes y otra correspondencia estén siendo interceptados rutinariamente por tus enemigos.\nEl Consejo de los Pergaminos ha propuesto recientemente un nuevo sistema creado por el famoso Al-Ashrad: un orbe mágico imbuido de poderes de Djinni que permite la comunicación a larga distancia. Sin embargo, se oyen algunas voces que se oponen, argumentando que esto simplemente significaría cambiar quién espía a quién..."
 pod_assamite_struggle.1005.a: "Una iniciativa brillante, necesito uno."
 pod_assamite_struggle.1005.b: "Inventaré mi propio sistema." 
 council_lose_influence_tt: "El Consejo de los Pergaminos pierde influencia."
 pod_assamite_struggle.1005.c: "¡El Consejo nos está manipulando!" 
 
 pod_assamite_struggle.1006.t: "Hijas de Haqim"
 pod_assamite_struggle.1006.desc: "Abrazar mujeres nunca fue un problema especial en la cultura Banu Haqim, especialmente desde que el propio Haqim lo hizo, pero el auge del movimiento [Glossary('Ashirra','game_concept_ashirra_desc')] ha cambiado esta situación. Entre la casta guerrera, la práctica de abrazar mujeres perdió su favor en el siglo VIII, al empezar a verse como algo inmoral maldecir a las mujeres con la vida eterna.\nEste cisma persiste hasta hoy, aunque los guerreros han empezado a relajar esta política hace varias décadas. Por ello, aunque no es un problema tan apremiante como antes, sigue siendo un tema de debate entre los hijos e hijas de Haqim."
 pod_assamite_struggle.1006.a: "A mí me sigue pareciendo mal."
 pod_assamite_struggle.1006.b: "Haqim sabía lo que hacía."
 pod_assamite_struggle.1006.c: "Sinceramente, debería ser al revés."
 
 pod_assamite_struggle.1007.t: "Las tres castas"
 pod_assamite_struggle.1007.desc: "Nadie sabe realmente cuándo el sistema de Castas se consolidó en la sociedad Banu Haqim, pero ahora es una parte integral de la vida eterna en Persia. Tradicionalmente, los Vizires eran los líderes y los más activos políticamente de los tres, pero el poder se ha desplazado lentamente hacia las manos de los Guerreros en tiempos más recientes. Los Hechiceros, por su parte, han sido durante mucho tiempo un grupo recluso y su reducido número los convierte en la casta más débil.\nEl sistema de Castas funciona junto a las facciones políticas en la sociedad Banu Haqim y, aunque puedes encontrar cualquier casta en cualquier facción, algunas son más favorecidas que otras dependiendo de tu agenda política."
 pod_assamite_struggle.1007.a: "Los Guerreros nos guían hacia adelante."
 pod_assamite_struggle.1007.b: "Los Hechiceros conocen la verdad."
 pod_assamite_struggle.1007.c: "Los Vizires son nuestros líderes naturales."
 pod_assamite_struggle.1007.d: "Todos debemos trabajar como uno solo."
 
 council_gain_lot_influence_tt: "El Consejo de los Pergaminos gana mucha influencia."
  
 pod_assamite_struggle.1008.t: "Los misterios de Al-Ashrad"
 pod_assamite_struggle.1008.desc: "El jefe de la casta de los Hechiceros, el Amr, siempre ha sido el misterioso Al-Ashrad, un antiguo y ampliamente respetado (y temido) Chiquillo del aún más misterioso Ur-Shulgi. Conocido por ser reservado, el Amr es responsable de algunas de las creaciones más maravillosas de los Hijos de Haqim y de su magistral uso de la Magia de Sangre.\nSu comportamiento pausado y cuidadoso delata la mente de un verdadero antiguo que planea con siglos de antelación. Aun así, recientemente Al-Ashrad ha estado inusualmente activo en Alamut, impulsando sutilmente la agenda del Consejo de los Pergaminos, la facción que él y otras voces moderadas de los Banu Haqim han creado."
 pod_assamite_struggle.1008.a: "Ayudar de todo corazón a sus esfuerzos."
 pod_assamite_struggle.1008.b: "Obstaculizarlo en cada paso."
 pod_assamite_struggle.1008.c: "¿Qué está planeando?"

 targetted_web_modifier: "Objetivo de la Red"
 targetted_web_modifier_desc: "La Red de Cuchillos se ha interesado en ti. Una de las formas más peligrosas."
  
 wok_gain_lot_influence_tt: "La Red de Cuchillos gana mucha influencia." 
  
 pod_assamite_struggle.1009.t: "La Red de Thetmes"
 pod_assamite_struggle.1009.desc: "Una figura divisiva entre los Hijos de Haqim, el poderoso Thetmes es conocido como un maestro manipulador de las sombras y uno de los asesinos más letales de Alamut. Su lealtad a la Red de Cuchillos se susurra discretamente en los salones de Alamut, pero los verdaderos objetivos finales de Thetmes solo él los conoce.\nBajo sus órdenes, la Red ha comenzado recientemente una campaña de intimidación cuidadosa por toda Persia, asegurándose de que los Príncipes y Sultanes estén más... «atentos» a las demandas del culto. Tu posición durante este evento será, sin duda, vigilada de cerca por el despiadado egipcio."
 pod_assamite_struggle.1009.a: "Ayudar de todo corazón a sus esfuerzos."
 pod_assamite_struggle.1009.b: "Obstaculizarlo en cada paso."
 pod_assamite_struggle.1009.c: "¿Qué está planeando?"
 
 silsila_gain_lot_influence_tt: "La Silsila gana mucha influencia." 
  
 pod_assamite_struggle.1010.t: "Las órdenes de Nakurtum"
 pod_assamite_struggle.1010.desc: "Nakurtum, uno de los Chiquillos más antiguos del propio Haqim, asumió el control de Alamut en 1214 mediante una temeraria demostración de fuerza. Su devoción por una religión en declive y su altiva actitud hacia las demás facciones la han dejado con pocos amigos, y apenas controla la propia Alamut.\nAun así, es la Anciana, y ese título merece mucho respeto en la sociedad de los Banu Haqim. Como tal, espera ser obedecida cuando dicta sus órdenes. Ir en contra de su voluntad es fácil, ya que no tiene los medios para imponer su autoridad, pero sigue siendo una falta de etiqueta en cierto modo. Así que, cuando recibas una de esas órdenes, tendrás que decidir qué hacer."
 pod_assamite_struggle.1010.a: "Obedecer el deseo de la Anciana."
 pod_assamite_struggle.1010.b: "Ignorar sus desvaríos."
 pod_assamite_struggle.1010.c: "Hacer lo mínimo indispensable."
  
 jamal_levies_modifier: "La pericia de Jamal"
 jamal_levies_modifier_desc: "Jamal ha entrenado personalmente a tus campeones. Aquellos que aún pueden caminar han mejorado mucho."
 
 ashirra_gain_lot_influence_tt: "La Ashirra gana mucha influencia." 
  
 pod_assamite_struggle.1011.t: "La Destreza de Jamal"
 pod_assamite_struggle.1011.desc: "Se reconoce ampliamente a Jamal, uno de los Chiquillos de Haqim, como el guerrero más letal de los Banu Haqim. Este aterrador guerrero también es conocido por ser un ferviente creyente de la causa de la [Glossary('Ashirra','game_concept_ashirra_desc')] y ha sido su líder informal durante varios siglos.\nAun así, se cree que Jamal es también una voz moderada, y a menudo se le ve ayudando a otros Banu Haqim, incluso a aquellos que no comparten su causa. Este comportamiento amistoso le ha ganado a él, y a la facción de la Ashirra, mucho respeto a lo largo de los años.\nEsta noche eres el objeto de atención del gran guerrero. Al notar algunas deficiencias en las habilidades de combate de tus campeones, se ofrece a ayudarles en una pequeña sesión de entrenamiento."
 pod_assamite_struggle.1011.a: "Es un honor, gracias."
 pod_assamite_struggle.1011.b: "No creo que sea necesario."
 pod_assamite_struggle.1011.c: "Sé suave con ellos, por favor."
   
 losttribe_gain_lot_influence_tt: "La Tribu Perdida gana mucha influencia." 
  
 pod_assamite_struggle.1012.t: "La verdad de Anosh"
 pod_assamite_struggle.1012.desc: "El misterioso (y altamente herético) Culto de Zilah del Dastur Anosh se ha ocultado desde la muerte de su maestro como las manos de los asesinos de Alamut. Aun así, su influencia en la política persa no ha desaparecido por completo. Esta noche, has recibido una nota que dice que un antiguo pergamino que contiene información... interesante sobre la 3.ª Generación está circulando por tu zona. Una conjura tan pequeña pero potencialmente impactante es el sello distintivo de Anosh, y tienes que decidir qué hacer al respecto."
 pod_assamite_struggle.1012.a: "Necesito leerlo yo mismo."
 pod_assamite_struggle.1012.b: "¡Encuéntralo y destrúyelo!"
 pod_assamite_struggle.1012.c: "Deja que pase."
   
