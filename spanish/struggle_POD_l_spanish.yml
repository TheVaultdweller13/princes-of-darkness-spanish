 french_struggle: "Una Francia fracturada"
 french_struggle_desc: "La Francia vampírica fue gobernada una vez por uno de los Ventrue más influyentes, Alexander. Contaba con el respaldo de las Cortes del Amor de los Toreador, un grupo de poderosas Reinas que gobernaban desde las principales ciudades francesas y le brindaban consejo y apoyo. Pero la indolencia y el aislamiento del viejo Ventrue fueron finalmente su perdición en 1222, cuando fue expulsado por un golpe de Estado fomentado por la más poderosa Reina del Amor, Salianna, y su propio chiquillo, Geoffrey.\nSalianna asumió entonces el poder, pero un cambio tan brutal tras más de 600 años de statu quo ha sumido a Francia en el caos. Un caos agravado por la actual Cruzada Albigense, la división entre occitanos y franceses, y la incursión de Inglaterra y Alemania en el señorío. ¿Sobrevivirá la Francia vampírica a los turbulentos tiempos que se avecinan?"
 struggle_french_phase_chaos: "La tormenta"
 struggle_french_phase_chaos_desc: "Con la Inquisición actuando sin control, los señoríos vampíricos entran en guerra en las sombras de Francia, con la esperanza de reclamar por la fuerza de las armas lo que no pudieron obtener con palabras dulces."
 struggle_french_phase_reprieve: "La calma"
 struggle_french_phase_reprieve_desc: "Incluso los vampiros necesitan recuperarse de vez en cuando. La consolidación del poder está ocurriendo ahora mismo, mientras reyes y reinas se aseguran de que su influencia y sus fuerzas estén listas para la siguiente fase."
 
 pod_french_struggle.0501.t: "Una Francia fracturada"
 pod_french_struggle.0501.desc: "La Francia vampírica fue gobernada una vez por uno de los Ventrue más influyentes, Alexander. Contaba con el respaldo de las Cortes del Amor de los Toreador, un grupo de poderosas Reinas que gobernaban desde las principales ciudades francesas y le brindaban consejo y apoyo. Pero la indolencia y el aislamiento del viejo Ventrue fueron finalmente su perdición en 1222, cuando fue expulsado por un golpe de Estado fomentado por la más poderosa Reina del Amor, Salianna, y su propio chiquillo, Geoffrey.\nSalianna asumió entonces el poder, pero un cambio tan brutal tras más de 600 años de statu quo ha sumido a Francia en el caos. Un caos agravado por la actual Cruzada Albigense, la división entre occitanos y franceses, y la incursión de Inglaterra y Alemania en el señorío. ¿Sobrevivirá la Francia vampírica a los turbulentos tiempos que se avecinan?"
 pod_french_struggle.0501.a: "El caos engendra oportunidades."
 
 struggle_parameter_struggle_parameter_less_factions_by_involved: "Los personajes implicados son menos propensos a unirse a facciones durante esta fase de la Contienda."
 struggle_parameter_struggle_parameter_no_revoke_by_involved: "Los personajes implicados no pueden revocar títulos durante esta fase de la Contienda."

 blois_french_struggle_tt: "[TARGET_TITLE.GetNameNoTier] debe ser poseído por ti o por alguien que te apoye (75 o más de opinión)."

 french_struggle_german_less_control_tt: "El [GetTitleByKey('e_fiefs_of_the_black_cross').GetNameNoTier] debe controlar menos del 20 % de Francia."
 french_struggle_english_less_control_tt: "El [GetTitleByKey('e_avalon').GetNameNoTier] debe controlar menos del 20 % de Francia."
 french_struggle_english_more_control_tt: "El [GetTitleByKey('e_avalon').GetNameNoTier] debe controlar más del 30 % de Francia."
 french_struggle_german_more_control_tt: "El [GetTitleByKey('e_fiefs_of_the_black_cross').GetNameNoTier] debe controlar más del 30 % de Francia."
 
 french_victory_objective_decision: "Francia restaurada"
 french_victory_objective_decision_tooltip: "Si Francia ha de sobrevivir a los invasores que acechan, debe volver a estar unida."
 french_victory_objective_decision_desc: "El debilitamiento de Francia ha hecho que los alemanes e ingleses miren con codicia tierras que son nuestras por derecho. Es hora de dejar de lado nuestras diferencias y emerger una vez más como una de las potencias más fuertes de la noche."
 french_victory_objective_decision_confirm: "Francia eterna"
 french_victory_objective_decision_effect_tooltip: "La Contienda terminará. Las ciudades de [GetTitleByKey('b_rethel').GetNameNoTier], [GetTitleByKey('b_lyon').GetNameNoTier], [GetTitleByKey('b_bordeaux').GetNameNoTier], [GetTitleByKey('b_blois').GetNameNoTier] y [GetTitleByKey('b_poitiers').GetNameNoTier] obtendrán un nuevo edificio especial. Usurparás el Imperio de [GetTitleByKey('e_love').GetNameNoTier] si aún no lo posees." 
  
 pod_french_struggle.102.t: "Francia restaurada"
 pod_french_struggle.102.desc: "Tras el exilio forzado de Alexander, la unidad de Francia ha sido cuestionada por los invasores Cainitas alemanes e ingleses, pero también por sus facciosos y pendencieros Príncipes que luchan por el dominio en el vacío dejado por el golpe. Esta agitación también permitió que la Inquisición se propagara y creciera, amenazando con destruir lo poco que quedaba de las estructuras políticas vampíricas.\nSin embargo, eso se acabó, ya que los Cainitas franceses han encontrado un nuevo sentido de propósito y unidad. Libres de sus invasores una vez más, y lo suficientemente organizados como para repeler a la Inquisición, las Cortes han regresado con fuerza a la escena política vampírica de Europa Occidental."
 pod_french_struggle.102.a: "La historia de Francia no ha hecho más que empezar."
 
 e_love_brujah: "Cortes de la Filosofía"
 e_love_lasombra: "Cortes de las Sombras"
 e_love_gangrel: "Cortes de la Galia"
 
 english_victory_objective_decision: "El yugo inglés"
 english_victory_objective_decision_tooltip: "Francia está lo suficientemente debilitada como para abrir el camino a nuevos amos."
 english_victory_objective_decision_desc: "Los mortales ingleses tienen razón. Francia e Inglaterra deben estar unidas, bajo el adecuado dominio inglés, por supuesto."
 english_victory_objective_decision_confirm: "¡Nace una unión eterna!"
 english_victory_objective_decision_effect_tooltip: "La Contienda terminará. Las ciudades de [GetTitleByKey('b_rethel').GetNameNoTier], [GetTitleByKey('b_lyon').GetNameNoTier], [GetTitleByKey('b_bordeaux').GetNameNoTier], [GetTitleByKey('b_blois').GetNameNoTier] y [GetTitleByKey('b_poitiers').GetNameNoTier] obtendrán un nuevo edificio especial. Usurparás el Imperio de [GetTitleByKey('e_love').GetNameNoTier] si aún no lo posees. Muchos personajes en Francia se convertirán a tu religión." 
   
 pod_french_struggle.105.t: "El yugo inglés"
 pod_french_struggle.105.desc: "Los destinos de Francia e Inglaterra han estado entrelazados desde 1066. Para los vampiros, fue la época en que una coterie de tres Cainitas normandos arrebató el poder al Culto de Mithras en Inglaterra. Pero su victoria fue efímera, ya que Mithras, una vez regresado de su Letargo, recuperó rápidamente el control sobre su dominio.\nDesde entonces, Inglaterra ha extendido su influencia sobre Francia, utilizando el caos creado por el exilio de Alexander para ganar primero algunos territorios y, lo que es más importante, algo de influencia sobre los locales. Lenta pero firmemente, los Cainitas de las islas han ido asegurando cada vez más poder en la región y, siguiendo el ejemplo de sus mortales, ahora reclaman el dominio sobre un Imperio verdaderamente «angevino»."
 pod_french_struggle.105.a: "De York a Marsella."
 pod_french_struggle.105.custom: "Los gobernantes implicados que no sean celosos se convertirán a tu fe."  
 e_love_mithras: "Cortes de Avalon"
 e_love_english: "Imperio Angevino"
 
 german_victory_objective_decision: "El yugo alemán"
 german_victory_objective_decision_desc: "Alemania y Francia tienen una larga historia común que se remonta a Carlomagno para los mortales, y a Eirik Eigermann para los vampiros. Debemos usar este pasado para unir la región."
 german_victory_objective_decision_confirm: "¡Una victoria carolingia!"
     
 pod_french_struggle.106.t: "El yugo alemán"
 pod_french_struggle.106.desc: "En el mundo mortal, Alemania y Francia fueron una sola bajo el dominio de Carlomagno. Muchos Cainitas han intentado recrear esta hazaña, desde el sajón Eirik Eigermann hasta el patrón no-muerto del propio Carlomagno, Alexander. Ninguno lo ha logrado plenamente, a pesar de los estrechos vínculos que comparten ambos países.\nSin embargo, el exilio forzado de Alexander abrió nuevas oportunidades para los Cainitas alemanes, que en aquel entonces ya eran una fuerza fuerte y unida bajo el mando de tan prestigiosos Ventrue como Hardestadt o Julia Antasia. Desde entonces, la influencia de Alemania en la política vampírica francesa no ha hecho más que crecer hasta un punto en el que muchos predicen que el futuro ya está decidido para estas dos naciones. Los herederos de los francos y de los sajones volverán a trabajar juntos hacia un objetivo común."
 pod_french_struggle.106.a: "De Magdeburgo a Brest."
 e_love_eternal: "Gallia"
 e_love_fiefs: "Feudos de la Rosa"

 pod_french_struggle.1000.t: "Luchando contra la Inquisición"
 pod_french_struggle.1000.desc: "La temida Inquisición nació básicamente en Francia, a la sombra de la cruzada albigense. Sus agentes merodean las calles por la noche, utilizando sus talentos sagrados para hacer que la vida eterna de los vampiros sea mucho más difícil. Lamentablemente, están especialmente presentes en una de las regiones bajo tu control últimamente, dejándote sin otra opción que capear el temporal o lidiar con ellos de algún modo."
 pod_french_struggle.1000.a: "Simplemente esperemos."
 pod_french_struggle.1000.b: "Contrata a algunos agentes para despistarlos."
 pod_french_struggle.1000.c: "¡Redirígelos hacia tus rivales!"
 pod_french_struggle.1000.d: "Estoy cansado de ellos, ¡mátalos a todos!"

 pod_french_struggle.1001.t: "De Constantinopla a Lyon"
 pod_french_struggle.1001.desc: "El otrora poderoso Príncipe de Lyon, Francois d'Alencourt, ha visto cómo su fortuna menguaba con la llegada de la Inquisición. Sin embargo, sigue siendo un actor político muy respetado en Francia y su comportamiento honorable no tiene parangón.\nEsta noche, ha acudido a tu corte con una propuesta. Una caravana de refugiados del desmoronado Imperio Bizantino ha llegado a su dominio buscando un nuevo lugar donde establecerse. Aunque d'Alencourt ayudó a quienes pudo, Lyon se ha vuelto demasiado peligrosa debido al avance desenfrenado de la Inquisición en la zona. Por ello, acude a ti con una petición formal para encontrar un lugar donde alojar a estos refugiados en tu dominio, protegiéndolos y acogiéndolos lo mejor que puedas. Después de todo, el honor dicta que no se debe hacer menos que ayudar al necesitado."
 pod_french_struggle.1001.a: "Una causa justa. Y un favor interesante."
 pod_french_struggle.1001.b: "¡No caeré en estos trucos políticos!"

 pod_french_struggle.1002.t: "Juegos mortales"
 pod_french_struggle.1002.desc: "Isouda de Blaise es una de las Reinas del Amor más influyentes y, sin duda, la más temida. Bajo su fina apariencia de Gracia y belleza se esconde una mente completamente desequilibrada, que diseña los juegos sociales más retorcidos para ser jugados en su corte.\nRecientemente has recibido una invitación para uno de esos encuentros. Isouda se lo tomaría muy personalmente si te negaras, pero ¿estás dispuesto a soportar lo peor que la «Rosa de Lobo» pueda lanzarte?"
 pod_french_struggle.1002.a: "¿Qué es lo peor que podría pasar?"
 pod_french_struggle.1002.b: "¡Tengo una cita importante en esa fecha!"
 pod_french_struggle.1002.c: "¿Nuevos métodos de tortura? ¡Genial!"

 pod_french_struggle.1003.t: "Distracción costosa"
 pod_french_struggle.1003.desc: "La más joven de las Reinas del Amor, Helene, gobierna la próspera región de Champaña. Una adolescente algo vacua y excitable por fuera, Helene ha demostrado con frecuencia que su sociabilidad es mayormente una fachada.\nChampaña albergará pronto las grandes ferias francesas, quizás el evento mercantil más importante de Europa Occidental. Muchos vampiros intentan ahora llevarse una parte del pastel y, probablemente no por coincidencia, Helene ha invitado a muchos de ellos (incluyéndote a ti) a una lujosa fiesta durante el mismo periodo, posiblemente para asegurarse de que no interfieras en sus planes para el evento."
 pod_french_struggle.1003.a: "El respeto vale más que el oro."
 pod_french_struggle.1003.b: "Pensándolo mejor..."
 pod_french_struggle.1003.c: "¿Una fiesta? ¡Tengo tantas ideas que probar!"

 pod_french_struggle.1004.t: "El Rey del Amor"
 pod_french_struggle.1004.desc: "El único Rey del Amor reconocido entre las Cortes es Etienne, el príncipe de la región de Poitou. Un hombre reservado, fue subestimado como un gobernante débil hasta hace poco, cuando su audaz movimiento contra Esclarmonde y su acercamiento a Mithras e Inglaterra mostraron de repente una mente política mucho más letal de lo previsto.\nHas recibido una petición para reunirte con él con un propósito no revelado. Es probable que se trate de un movimiento muy político si aceptas, ya que Etienne ciertamente tiene algún plan bajo la manga contra otro competidor."
 pod_french_struggle.1004.a: "¿Quién es el objetivo?"
 pod_french_struggle.1004.b: "Es demasiado peligroso para confiar en él."
 pod_french_struggle.1004.c: "Puedo mejorar sus planes..."

 pod_french_struggle.1005.t: "El rey mal preparado"
 pod_french_struggle.1005.desc: "Geoffrey du Temple fue uno de los principales artífices del exilio de Alexander (su propio [Glossary('Sire','game_concept_Sire_desc')]). Lamentablemente para él, desde entonces ha sido cada vez más desplazado por jugadores mucho más expertos en el juego político que él, como la propia Salianna.\nAl notar su debilidad, Geoffrey busca cualquier aliado que esté dispuesto a ayudar a su causa. Aliarte con él resultaría costoso, pero sigue siendo el Príncipe de París, una posición que impone respeto y que será fundamental para unir Francia en algún momento."
 pod_french_struggle.1005.a: "Ayúdale un poco."
 pod_french_struggle.1005.b: "Dale una ayuda insignificante e inútil."
 pod_french_struggle.1005.c: "Dale una ayuda exhaustiva y bien preparada."

 pod_french_struggle.1006.t: "Las riquezas de Aquitania"
 pod_french_struggle.1006.desc: "Burdeos es una de las ciudades más prósperas de Francia. Irónicamente, esto se debe en gran parte a que ha sido la ciudad francesa más importante en manos de mortales ingleses (y a menudo también de vampiros) durante mucho tiempo. Esto la ha convertido en el centro comercial para cualquier mercader inglés que se precie.\nEl Príncipe de Burdeos es Gerard, un vasallo leal de Mithras y un administrador capaz. Sin embargo, se encuentra totalmente desbordado por los intereses contrapuestos en la ciudad y la creciente presencia de la Inquisición en la zona, todo ello mientras recibe poca o ninguna ayuda de Inglaterra. Tal desorden podría ser una ocasión para «liberar» algunas de las riquezas de Burdeos para tu propio uso..."
 pod_french_struggle.1006.a: "Respetaré el Principado de Gerard"
 pod_french_struggle.1006.b: "Oro gratis por todas partes, la verdad."
 pod_french_struggle.1006.c: "¡Más oro!"

 pod_french_struggle.1007.t: "La Reina de Occitania"
 pod_french_struggle.1007.desc: "La poderosa Esclarmonde se ha convertido en el punto de reunión de los Cainitas occitanos desde que comenzó la Cruzada Albigense. Su obstinada resistencia tanto contra la Inquisición como contra los franceses del norte ha hecho que su Corte sea de facto independiente del control de París.\nLa «reina negra» es una figura misteriosa, y se dice que muchos han jurado lealtad eterna a ella con tan solo una mirada. Por eso te preocupa esta inesperada invitación a Toulouse que ha aparecido de repente en tu puerta..."
 pod_french_struggle.1007.a: "¡Seguro que puedo resistir su hechizo!"
 pod_french_struggle.1007.b: "Mejor no arriesgarse."
 pod_french_struggle.1007.c: "Yo también sé un par de cosas sobre el embelesamiento..."
 french_struggle_taunt_tooltip: "No, no puedes."
 
 pod_french_struggle.1008.t: "El Dios del Sol trae regalos"
 pod_french_struggle.1008.desc: "Mithras, el poderoso gobernante de las Baronías de Avalon, ha mostrado poco interés en Francia durante el reinado de Alexander. Pero ahora que el país está desestabilizado por su exilio, y que los mortales ingleses también están ganando terreno, parece que el Dios del Sol tiene nuevos planes.\nIniciando un lujoso gran viaje por Francia, Mithras ha estado pasando por muchas ciudades, impresionando a sus habitantes Cainitas con su puro poder e influencia. Podrías hacer que Mithras pase por tu ciudad durante su viaje si lo deseas. Sin duda te dejaría en buena posición y él es un invitado generoso. Pero el riesgo de caer bajo su hechizo es algo a tener en cuenta..."
 pod_french_struggle.1008.a: "¡Me siento honrad[ROOT.Char.Custom('ES_OA')] por vuestra Presencia!"
 pod_french_struggle.1008.b: "Mejor no arriesgarse."
 pod_french_struggle.1008.c: "¡Mithras ya es mi Dios! ¿Seguro que me ayudará?"
 
 pod_french_struggle.1009.t: "La oferta del tirano"
 pod_french_struggle.1009.desc: "El poderoso Hardestadt de Alemania es una anomalía en el mundo Cainita. Proveniente de un linaje oculto, ha logrado convertirse en el Ventrue más importante de Europa a pesar de su corta edad. Conocido por ser un político astuto y despiadado, tampoco se le conoce por andarse con rodeos.\nSu repentina visita a vuestra corte es una sorpresa, pero su oferta es aún más asombrosa. Con una honestidad brutal, Hardestadt os dice que tiene planes para Francia y que podríais ser un activo en este empeño. Os ofrece oro, un ejército personal y el reconocimiento de vuestro valor en su corte si aceptáis uniros a los Feudos de la Cruz Negra."
 pod_french_struggle.1009.a: "Una oferta tentadora..."
 pod_french_struggle.1009.b: "No confío en él."

 pod_french_struggle.1010.t: "Una conversación clásica"
 pod_french_struggle.1010.desc: "Una de las Ventrue más influyentes de Europa Occidental, Julia Antasia, ha venido a visitar algunas de las cortes de Francia. Tiene muchos seguidores devotos en la región, todos ellos alabando su sensatez y su visión utópica de una sociedad democrática para los Cainitas.\nHa pasado por vuestra corte desde hace un par de noches y debéis admitir que su reputación no es exagerada. Es calmada, serena y todo lo que dice dibuja una visión vívida de un futuro potencialmente grandioso para vuestra estirpe. Podéis sentiros cada vez más influenciad[ROOT.Char.Custom('ES_OA')] por esta conversación, aparentemente benigna, entre iguales."
 pod_french_struggle.1010.a: "Una charla interesante, nada más."
 pod_french_struggle.1010.b: "Tiene algunos puntos muy válidos..."
 pod_french_struggle.1010.c: "Mi señora, no digáis más, ¡permitidme serviros!"

 pod_french_struggle.1011.t: "Regalo envenenado"
 pod_french_struggle.1011.desc: "Como Matriarca de las Cortes del Amor, Salianna es, al menos nominalmente, la Cainita más importante de Francia desde el exilio de Alexander. Sin embargo, su mandato está siendo cuestionado y ella intenta asegurarlo lo mejor posible desde entonces.\nComo uno de los influyentes gobernantes de la noche en Francia, estáis sujeto[ROOT.Char.Custom('ES_OA')] a algunos de sus estratagemas para obtener reconocimiento. Durante la última sesión de la corte, intenta ofreceros un mortal para que lo uséis como mejor os convenga. Políticamente, aceptar el regalo significa darle crédito como un Señor que recompensa a un Vasallo, fortaleciendo su posición a expensas vuestras. Por otro lado, este mortal parece, en efecto, uno interesante..."
 pod_french_struggle.1011.a: "Es un honor, Matriarca."
 pod_french_struggle.1011.b: "Podéis quedaros con vuestros regalos."

 pod_french_struggle.1012.t: "Visitantes del sur"
 pod_french_struggle.1012.desc: "Los Lasombra ibéricos estuvieron entre los muchos forasteros que intentaban arrebatar la influencia que pudieran en Francia tras el exilio de Alexander. Sus propios problemas en la península con su guerra civil en curso pusieron pronto fin a sus esfuerzos. Aun así, algunos jóvenes Lasombra ven oportunidades en la situación de Francia, quizás para hacer fortuna antes de un regreso triunfal a casa.\nUno de esos grupos de mercenarios ha venido recientemente a ofreceros sus servicios. Podríais rechazar su propuesta, obviamente, pero no cabe duda de que entonces encontrarían a otro empleador, tal vez incluso uno de vuestros competidores."
 pod_french_struggle.1012.a: "Estáis contratados."
 pod_french_struggle.1012.b: "No lo estáis."

 french_struggle_house_modifier: "Maestros de Francia"
 french_struggle_house_modifier_desc: "Los miembros de esta Casa han asegurado la Francia vampírica, garantizándoles una gran influencia sobre esta importante parte de Europa Occidental."
 
