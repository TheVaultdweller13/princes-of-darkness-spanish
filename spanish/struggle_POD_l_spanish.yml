l_spanish:
 
 reconquista_struggle: "La Reconquista en la Sombra"
 reconquista_struggle_desc: "Desde la caída del Imperio Romano, los Lasombra han reinado supremos en Iberia. Pero esta era está llegando a un sangriento final, ya que los conflictos religiosos mortales en la península finalmente se han trasladado al mundo nocturno.\nLa guerra civil de los Lasombra estalló oficialmente en 1172 con la caída de Murcia y, desde entonces, agitadores de ambos bandos como Ambrosio Luis Moncada y Badr han avivado las llamas de la guerra por sus propios intereses.\nIberia se encuentra ahora en el caos y, mientras mercenarios, forasteros y oportunistas se agrupan en un bando u otro, queda por ver quién (si es que alguien) saldrá victorioso de este crisol."
 struggle_reconquista_phase_shadows: "Guerra de Sombras"
 struggle_reconquista_phase_shadows_desc: "La Reconquista en la Sombra nunca ha hecho honor a su nombre como ahora. Príncipes y sultanes traman su próximo movimiento y, aunque existe la guerra abierta, tiene menos moda que los puñales en la oscuridad."
 struggle_reconquista_phase_hostility: "Caos"
 struggle_reconquista_phase_hostility_desc: "Las tensiones y los resentimientos finalmente han dado lugar a ataques abiertos contra vecinos y hermanos. La Mascarada es más delgada que nunca mientras Iberia arde durante la noche."
 struggle_reconquista_phase_reprieve: "Tregua"
 struggle_reconquista_phase_reprieve_desc: "Incluso los vampiros necesitan recuperarse de vez en cuando. La consolidación del poder está ocurriendo ahora mismo, mientras Príncipes y sultanes se aseguran de que su influencia y sus fuerzas estén listas para la siguiente fase."
 
##### Intro #####
 pod_reconquista_struggle.0501.t: "La Reconquista en la Sombra"
 pod_reconquista_struggle.0501.desc: "Desde la caída del Imperio Romano, los Lasombra han reinado supremos en Iberia. Pero esta era está llegando a un sangriento final, ya que los conflictos religiosos mortales en la península finalmente se han trasladado al mundo nocturno.\nLa guerra civil de los Lasombra estalló oficialmente en 1172 con la caída de Murcia y, desde entonces, agitadores de ambos bandos como Ambrosio Luis Moncada y Badr han avivado las llamas de la guerra por sus propios intereses.\nIberia se encuentra ahora en el caos y, mientras mercenarios, forasteros y oportunistas se agrupan en un bando u otro, queda por ver quién (si es que alguien) saldrá victorioso de este crisol.\n\n"
 pod_reconquista_struggle.0501.desc.involved: "Iberia fue gobernada una vez por los Gangrel, luego por los Brujah cartagineses y los Ventrue romanos, ahora... ¡ahora es mi momento de reclamar mi derecho sobre esta tierra!\n\n"
 pod_reconquista_struggle.0501.desc.interloper: "Iberia fue gobernada una vez por los Gangrel, luego por los Brujah cartagineses y los Ventrue romanos, ahora... ¡ahora es mi momento de reclamar mi derecho sobre esta tierra!\n\n"
 pod_reconquista_struggle.0501.a: "¡Toma las riendas del destino!"
 
 secure_reconquista_foothold_decision_title: "Enclave Ibérico"
 secure_reconquista_foothold_decision_desc: "La guerra civil de los Lasombra en Iberia es un tiempo de oportunidades. No estarán preparados para una amenaza externa."
 secure_reconquista_foothold_decision_tooltip: "Integrar parte de Iberia"
 secure_reconquista_foothold_decision_confirm: "Para el más fuerte"
 
 reconquista_struggle_phase_hostility_or_opportunity_tt: "La Contienda de la Reconquista debe estar en la fase de Guerra de Sombras o Caos."
 struggle_secure_reconquista_foothold_ends_the_struggle_tt: "La Contienda termina."
 
 pod_reconquista_struggle.100.t: "Amanecer sobre Iberia"
 pod_reconquista_struggle.100.desc: "El dividido clan Lasombra ha brindado una gran oportunidad a los forasteros de la península. Con sus hojas vueltas unas contra otras, no se percataron de la amenaza externa hasta que fue demasiado tarde.\nCon su nuevo liderazgo, Iberia está olvidando lentamente la Reconquista en la Sombra, el Creciente de Medianoche y todas sus disputas. Esta es una nueva era y, tras los Gangrel ibéricos, los Brujah cartagineses, los Ventrue romanos y los Lasombra, Iberia tendrá que acoger a nuevos señores una vez más."
 pod_reconquista_struggle.100.a: "Se necesitaba sangre nueva en Iberia."

 pod_reconquista_struggle.101.desc: "El dividido clan Lasombra ha brindado una gran oportunidad a los forasteros de la península. Con sus hojas vueltas unas contra otras, no se percataron de la amenaza externa hasta que fue demasiado tarde.\nCon su nuevo liderazgo, Iberia está olvidando lentamente la Reconquista en la Sombra, el Creciente de Medianoche y todas sus disputas. Esta es una nueva era y, tras los Gangrel ibéricos, los Brujah cartagineses, los Ventrue romanos y los Lasombra, Iberia tendrá que acoger a nuevos señores una vez más."
 pod_reconquista_struggle.101.a: "Malditos intrusos."
 
 shadow_reconquista_tt: "Este final solo está disponible para los Lasombra que no sean [Glossary('Ashirra','game_concept_ashirra_desc')]"
 ashirra_reconquista_tt: "Este final solo está disponible para personajes de la [Glossary('Ashirra','game_concept_ashirra_desc')] y Tariq el Haqim"
 
 noconquista_objective_decision: "La Tercera Vía"
 noconquista_objective_decision_tooltip: "Es hora de disipar las sombras sobre Iberia."
 noconquista_objective_decision_desc: "Los Lasombra cristianos y los [Glossary('Ashirra','game_concept_ashirra_desc')] que se disputan cuestiones de fe han dejado a Iberia incapaz de alcanzar su verdadero potencial. No se puede permitir que esto continúe."
 noconquista_objective_decision_confirm: "¡Iberia despierta!"
 noconquista_objective_decision_effect_tooltip: "Los señoríos de los Lasombra quedarán lisiados. Obtendrás un poderoso modificador. Tendrás acceso al [casus_belli|E] de Invasión si aún no lo tenías, y también obtendrás un descuento en su coste." 
 thirdway_reconquista_tt: "Este final solo está disponible para personajes que no sean Lasombra ni de la [Glossary('Ashirra','game_concept_ashirra_desc')]."
 thirdway_effect_tt: "Los señoríos de los Lasombra quedarán lisiados por el modificador Autoridad Quebrantada. Tendrás acceso al [casus_belli|E] de Invasión si aún no lo tenías, y también obtendrás un descuento en su coste."
 
 heir_yzebel_modifier: "Heredera de Yzebel"
 heir_yzebel_modifier_desc: "La primera vampiro en unificar Iberia, la cartaginesa Yzebel, ha encontrado a su heredera en este personaje."
 
 pod1230objectives.113.t: "La Tercera Vía"
 pod1230objectives.113.desc: "Iberia tiene una larga historia. Poblada primero por manadas errantes de señores de la guerra Gangrel, fue luego unificada por la Brujah cartaginesa Yzebel hasta su derrota ante los Ventrue romanos. Entonces, aprovechando la debilidad de ambas partes tras su guerra, los Lasombra se abrieron paso en la península y consolidaron rápidamente su control sobre la región.\nSin embargo, su guerra civil debilitó tanto su posición que un nuevo poder ha surgido en Iberia. Muchos pensaron que los Lasombra se quedarían para siempre, pero ahora se ha demostrado que estaban equivocados. Esta tierra tiene un nuevo señor, y el clan de las Sombras solo puede sentir vergüenza por una derrota tan absoluta en su propio terreno."
 pod1230objectives.113.a: "¡Duraré más que todos ellos!"
 pod1230objectives.114.a: "Otra página de la historia que pasa."
 
 struggle_parameter_unlocks_secure_reconquista_foothold_decision: "Desbloquea la decisión Asegurar Enclave Ibérico para personajes no implicados en Iberia o cerca de ella."
 
 pod_reconquista_struggle.1000.t: "Tensiones y oportunidades"
 pod_reconquista_struggle.1000.desc: "Iberia está en vilo. Cada vampiro intenta aprovechar la poca influencia que tiene sobre la población mortal para obtener una ventaja. Este constante tira y afloja ha vuelto casi frenéticos a los mortales de la zona, que se amotinan y protestan contra todo y contra todos.\nEsta tensión antinatural ofrece algunas oportunidades para los señores y las damas de la noche, y tu consejero te insta a avivar las llamas, asegurándose de que no se detengan pronto. Después de todo, los mortales tensos son mortales fáciles de manipular."
 pod_reconquista_struggle.1000.a: "Avancemos la situación con discreción."
 pod_reconquista_struggle.1000.b: "Tú propusiste esta solución, hazla tú mismo."
 pod_reconquista_struggle.1000.c: "No, los mortales son demasiado valiosos como para desperdiciarlos."
 pod_reconquista_struggle.1000.d: "¿Por qué debería importarme siquiera lo que pase con los mortales?"
 
 pod_reconquista_struggle.1001.t: "Baño de medianoche"
 pod_reconquista_struggle.1001.desc: "Los baños lujosos, reliquias de la era romana, se encuentran por toda Iberia y son un pasatiempo predilecto de mortales influyentes. Este negocio ha sido dirigido durante mucho tiempo por Cainitas nativos que se enorgullecen de su secreto y solo tratan con los Príncipes y Sultanes de la Noche de forma muy irregular.\nSin embargo, recientemente, un erudito musulmán ha demostrado que los baños son buenos para la salud de los mortales, lo que ha hecho que estos reservados «maestros de los baños» salgan de su escondite y pidan fondos para ampliar sus operaciones. Argumentan que los mortales sanos son mortales útiles y que ambos podríais beneficiaros de esta expansión."
 pod_reconquista_struggle.1001.a: "Tendréis mi apoyo."
 pod_reconquista_struggle.1001.b: "¡Derridad sus baños y traedme cualquier cosa que tenga valor!"
 pod_reconquista_struggle.1001.c: "Por ahora no invertiré."
   
 pod_reconquista_struggle.1020.t: "Leones y cuchillos"
 pod_reconquista_struggle.1020.desc: "En el conflicto que envuelve a Iberia, hay fanáticos en ambos bandos. Los Leones de Rodrigo luchan por los Lasombra cristianos, e incluso ellos se ven perturbados a veces por su salvajismo en la batalla. Para la [Glossary('Ashirra','game_concept_ashirra_desc')], la reputación de la Red de Cuchillos ya no hace falta demostrarla, con asesinatos espantosos acumulándose noche tras noche.\nUno de esos grupos ha aparecido recientemente en tu capital, afirmando perseguir a un «espía infiel» antes de dejar un rastro de cadáveres y destrucción a su paso.\nComo suele ocurrir, te dejan a ti el encargo de lidiar con las consecuencias."
 pod_reconquista_struggle.1020.a: "Restaura el orden lo antes posible."
 pod_reconquista_struggle.1020.b: "¡¿Un espía infiel?! ¡Saquead y quemad lo que quede para estar seguros!"
 pod_reconquista_struggle.1020.c: "Culpa a alguien más y sigue adelante."
   
 pod_reconquista_struggle.3011.t: "La Vigilia"
 pod_reconquista_struggle.3011.desc: "El Cid tuvo un profundo impacto en los Lasombra cristianos. Su tumba se ha convertido en un lugar de culto para futuros caballeros con extensos rituales conocidos como «la Vigilia». Como El Cid también era respetado por la [Glossary('Ashirra','game_concept_ashirra_desc')], se acuerda una tregua informal cuando los peregrinos piadosos se desplazan por Iberia para cumplir con sus deberes.\nPero a veces, y más a menudo de lo que ambos bandos admitirían, esta tregua no se respeta y los viajeros se convierten en otra víctima de la Reconquista en la Sombra. Un grupo de Lasombra cristianos se desplaza por tus tierras, solicitando la paz de El Cid para moverse libremente. ¿Qué harás?"
 pod_reconquista_struggle.3011.a: "Una costumbre digna de ser respetada."
 pod_reconquista_struggle.3011.b: "Un impuesto modesto por pasar por mis tierras parece razonable."
 pod_reconquista_struggle.3011.c: "Hermanos piadosos, tenéis escolta y mi bendición."
 pod_reconquista_struggle.3011.d: "¡Necios ingenuos esperando ser rescatados!"
    
 assamite_struggle: "Una casa dividida"
 assamite_struggle_desc: "Los Banu Haqim han gobernado Persia desde que su legendario fundador, Haqim, fundó Alamut. A ojos ajenos, no ha habido más que una unidad perfecta entre ellos desde entonces, pero la realidad es muy distinta.\nEl faccionalismo amenaza con romper la alabada disciplina de los Hijos de Haqim desde dentro. La llegada de un nuevo Anciano, el controvertido Nakurtum, podría ser el punto de ebullición. Aunque una guerra civil no parece —aún— posible, cada grupo está afilando sus dagas para asegurarse de que ellos, y solo ellos, darán forma al futuro de los Banu Haqim."
  
 pod_assamite_struggle.0501.t: "Una casa dividida"
 pod_assamite_struggle.0501.desc: "Los Banu Haqim han gobernado Persia desde que su legendario fundador, Haqim, fundó Alamut. A ojos ajenos, no ha habido más que una unidad perfecta entre ellos desde entonces, pero la realidad es muy distinta.\nEl faccionalismo amenaza con romper la alabada disciplina de los Hijos de Haqim desde dentro. La llegada de un nuevo Anciano, el controvertido Nakurtum, podría ser el punto de ebullición. Aunque una guerra civil no parece —aún— posible, cada grupo está afilando sus dagas para asegurarse de que ellos, y solo ellos, darán forma al futuro de los Banu Haqim.\nLos principales contendientes por esta victoria son la Red de Cuchillos, un culto secreto de fanáticos letales; la [Glossary('Ashirra','game_concept_ashirra_desc')], que favorece acercar al clan al Islam; el Consejo de Pergaminos, que representa a los moderados y conciliadores; la Silsila, un grupo elitista de la vieja guardia zoroastriana; y finalmente la Tribu Perdida, un misterioso culto de adoración herética.\n #italic La Contienda de la Casa Dividida se gana mediante la influencia. Puedes comprobar el progreso de cada facción con una decisión menor especial.#!"
 pod_assamite_struggle.0501.a: "Haqim está observando."
  
 struggle_parameter_unlocks_no_wars: "No es posible declarar guerras directas contra otros personajes implicados."
 NO_WARS_STRUGGLE_PARAMETER_CD: "Estás en una Fase de Contienda en la que no puedes atacar a este personaje."
 
 secure_assamite_foothold_decision_title: "Cabeza de playa persa"
 secure_assamite_foothold_decision_desc: "Las divisiones de los Banu Haqim en Persia están abriendo oportunidades. No estarán preparados para una amenaza externa."
 secure_assamite_foothold_decision_tooltip: "Integrar parte de Persia"
 secure_assamite_foothold_decision_confirm: "Para el más fuerte"
  
 pod_assamite_struggle.100.t: "El amanecer sobre Persia"
 pod_assamite_struggle.100.desc: "El dividido clan Banu Haqim ha brindado una gran oportunidad a los forasteros de Persia. Con sus espadas vueltas unas contra otras, no se dieron cuenta de la amenaza externa hasta que fue demasiado tarde.\nCon su nuevo liderazgo, Persia está olvidando lentamente la Red de Cuchillos, Alamut y todas sus disputas. Esta es una nueva era y el tiempo dirá si este nuevo conquistador será capaz de doblegar a Persia a sus caprichos o si será destrozado por sus obstinados habitantes, como ya les ha ocurrido a muchos."
 pod_assamite_struggle.100.a: "Hacía falta sangre nueva en Persia."

 pod_assamite_struggle.101.desc: "El dividido clan Banu Haqim ha brindado una gran oportunidad a los forasteros de Persia. Con sus espadas vueltas unas contra otras, no se dieron cuenta de la amenaza externa hasta que fue demasiado tarde.\nCon su nuevo liderazgo, Persia está olvidando lentamente la Red de Cuchillos, Alamut y todas sus disputas. Esta es una nueva era y el tiempo dirá si este nuevo conquistador será capaz de doblegar a Persia a sus caprichos o si será destrozado por sus obstinados habitantes, como ya les ha ocurrido a muchos."
 pod_assamite_struggle.101.a: "Malditos intrusos."
  
 struggle_assamite_phase_shadows: "Familia disfuncional"
 struggle_assamite_phase_shadows_desc: "Los Banu Haqim apenas mantienen su fachada de unidad. Hay resentimiento en el aire y cuchillos envainados por todas partes."
 struggle_assamite_phase_hostility: "Familia rota"
 struggle_assamite_phase_hostility_desc: "Haqim debe llorar al ver a sus Hijos luchando entre sí. Alamut se desmorona desde dentro."
 struggle_assamite_phase_reprieve: "Familia en proceso de sanación"
 struggle_assamite_phase_reprieve_desc: "Mostrando más sensatez que la mayoría de los vampiros, los Banu Haqim ahora hablan abiertamente de sus diferencias, esperando una resolución sensata para los problemas actuales."
   
 urshulgi_victory_objective_decision_tt: "La influencia de la Red de Cuchillos debe ser absoluta."
 urshulgi_victory_objective_decision_tt2: "La influencia del Consejo de los Pergaminos debe ser inexistente."
 assamite_struggle_victory_effect_tooltip: "Obtendrás el [title|E] de Alamut si aún no lo tienes. Además, todos los personajes Assamitas en rango diplomático aceptarán ahora la vasallización sin cuestionamientos."
 assamite_struggle_needed_tt: "Debes formar parte de la Contienda de la Casa Dividida, lo que requiere que tu capital esté en la región de la Contienda de la Casa Dividida (reinos de jure de Persia, Transoxiana, Makran, Kabulistán, Daylam, Khorasan/Red de Cuchillos)."
 assamite_victory_objective_decision_tt: "La influencia de la Red de Cuchillos debe ser inexistente."
 assamite_victory_objective_decision_tt2: "La influencia del Consejo de los Pergaminos, o la influencia de la Ashirra, debe ser absoluta."
 losttribe_victory_objective_decision_tt: "La influencia de la Tribu Perdida debe ser absoluta."
 losttribe_victory_objective_decision_tt2: "La influencia de la Silsila debe ser inexistente."
 losttribe_victory_objective_decision_tt3: "La influencia de la Ashirra debe ser inexistente."
 losttribe_victory_objective_decision_effect_tooltip: "Muchos Banu Haqim se convertirán al Culto de Zilah y la propia Zilah te bendecirá, mejorando a tu personaje."
 
 losttribe_victory_objective_decision: "Hijos de Zilah"
 losttribe_victory_objective_decision_desc: "El Culto de Zilah ha sido desterrado durante mucho tiempo de la política de Alamut. Pero los fieles servidores de la Segunda Generación son, ante todo, resilientes. Aún es tiempo de que los Banu Haqim vean los pecados de su padre."
 losttribe_victory_objective_decision_tooltip: "¡Haqim es un mentiroso que debe ser expuesto!"
 losttribe_victory_objective_decision_confirm: "La gloria de Zilah está asegurada"
  
 pod_assamite_struggle.102.t: "Hijos de Zilah"
 pod_assamite_struggle.102.desc: "El lento y bien preparado regreso de la Tribu Perdida en la política de Alamut ha tenido un profundo impacto en los Assamitas. Una vez devotos de su fundador Haqim, ahora maldicen a la Tercera Generación por sus crímenes contra la Segunda, y especialmente contra Zilah.\nLa Piedra Llorosa, aparentemente el lugar de descanso de la propia Zilah, se ha convertido en un lugar de peregrinación y muchos son los que viajan allí para beber de las lágrimas de sangre que fluyen de la piedra, experimentando el tormento sentido por Zilah hace mucho tiempo.\nIrónicamente, desde fuera, los Assamitas siguen siendo un culto extraño dedicado a un propósito extraño. Pero desde dentro, las cosas nunca volverán a ser las mismas."
 pod_assamite_struggle.102.a: "Vengaremos el crimen más antiguo de nuestra especie."
 pod_assamite_struggle.103.a: "Es hora de seguir la verdad."
 pod_assamite_struggle.103.b: "¡Jamás! ¡Alabado sea Haqim!"
 pod_assamite_struggle.104.a: "Sucesos extraños para un clan extraño."
 pod_assamite_struggle.102.custom: "Muchos Banu Haqim se convertirán al Culto de Zilah."

 silsila_victory_objective_decision_tt: "La influencia de la Silsila debe ser absoluta."
 silsila_victory_objective_decision_tt2: "La influencia de la Tribu Perdida debe ser inexistente."
 silsila_victory_objective_decision_effect_tooltip: "Tendrás la posibilidad de comprar reivindicaciones de artefactos a un precio reducido."
 
 silsila_victory_objective_decision: "El Centro se Mantiene"
 silsila_victory_objective_decision_desc: "La Silsila es la élite espiritual de los Banu Haqim y está profundamente influenciada por las enseñanzas zoroastrianas. Su posición se ha debilitado desde el surgimiento del Islam, pero aún conservan suficiente influencia como para tener esperanzas en el futuro."
 silsila_victory_objective_decision_tooltip: "Somos la verdadera élite de Haqim."
 silsila_victory_objective_decision_confirm: "Como debe ser"
   
 pod_assamite_struggle.105.t: "El Centro se Mantiene"
 pod_assamite_struggle.105.desc: "El sacerdocio guerrero de la élite de los Banu Haqim, la Silsila, ha estado perdiendo influencia de forma constante en la política de Alamut desde hace tiempo, debido a sus vínculos con la decadente religión zoroastriana. El brutal regreso de Nakurtum como la Anciana en 1214 no ayudó, ya que sus despiadados métodos para liderar el clan unieron aún más a las otras facciones contra la vieja guardia.\nSin embargo, esto ha cambiado a medida que la Silsila logró lentamente dar un giro a las cosas, utilizando las divisiones de sus rivales y demostrando su compromiso con la erradicación de la herejía para reafirmar su posición. No todo es favorable para esta pequeña casta pero, por el momento, el resto de los Banu Haqim reconocen su derecho a gobernar y se están agrupando en torno a los herederos de Haqim y de Zoroastro."
 pod_assamite_struggle.105.a: "Somos los únicos aptos para gobernar."
 pod_assamite_struggle.106.a: "La Tradición gana de nuevo."
 
 assamite_factions_decision: "Estado de la Contienda Persa"
 assamite_factions_decision_desc: "Averigua el poder relativo actual de cada facción en la contienda y cómo influir en ellas rápidamente."
 assamite_factions_decision_tooltip: "Ver el estado actual de la contienda persa."
 assamite_factions_decision_confirm: "¿Dónde nos encontramos?"
 assamite_factions_tt: "Obtendrás información sobre el estado actual de la contienda y varios métodos para influir en ella en un momento crítico."

