l_spanish: 
 
 ############################
 # Artefactos no procedimentales #
 ############################
 
 artifact_book_of_nod_name: "Libro de Nod"
 artifact_book_of_nod_description: "Una colección de textos antiguos, considerados sagrados para los $pod_cainites$ nodistas. Consiste en múltiples versiones y fragmentos que han sido reensamblados por varios estudiosos. Tradicionalmente, la transmisión principal de la historia de Caín es oral, mientras que los textos con los eventos más importantes de la historia cainita están fuertemente custodiados para proteger la Mascarada.\n\nExisten numerosas preguntas abiertas sobre la historia del Libro de Nod. Su autor es desconocido, aunque a menudo se cita a Malkav, Saulot e incluso a Caín como autores de partes del mismo, si no de su totalidad. Aunque la veracidad de su contenido se pone a menudo en duda, sigue siendo el relato de la historia temprana de los $pod_cainites$ más aceptado."
 artifact_chronicle_of_caine_name: "Crónica de Caín"
 artifact_chronicle_of_caine_description: "Una Crónica del 'Libro de Nod'. Este tomo comprende los siguientes fragmentos: El Primero de los Tiempos, La Llegada de Lilith, La Magia de Lilith, La Tentación de Caín, El Relato de Zillah, El Relato de la Megera y El Relato de la Primera Ciudad. Aunque Caín se identifica con el 'Caín' mencionado en el Libro del Génesis, estos Relatos no deben compararse con el canon bíblico estándar.\n\nEn sus propias palabras, Caín relata cuáles fueron los motivos que le llevaron a su maldición, dando sus puntos de vista personales sobre los acontecimientos que rodearon los días posteriores a la Caída del Hombre, y su historia como Padre Oscuro."
 artifact_chronicle_of_shadows_name: "Crónica de las Sombras"
 artifact_chronicle_of_shadows_description: "Una Crónica del 'Libro de Nod'. Una colección de piezas y fragmentos que se debate si forman parte siquiera del Libro de Nod. Hay analistas que afirman que esta sección fue diluida por los estudiosos y escritores de Cartago, que se tomaron licencias poéticas para escribir las 'Leyes de Caín'. Incluso se ha dicho que la Crónica de las Sombras es solo una colección de propaganda creada por la Camarilla para apoyar su reinado tiránico. Mientras que algunos creen que se trata de una elaborada broma malkavian, otros creen que estos textos proceden directamente del mismísimo Padre Oscuro, especialmente los trece mandamientos que se entregaron en tablillas auténticamente envejecidas."
 artifact_chronicle_of_secrets_name: "Crónica de los Secretos"
 artifact_chronicle_of_secrets_description: "Una Crónica del 'Libro de Nod'. Contiene profecías y visiones de un evento llamado Gehena. A algunos les parece que las preocupaciones por este evento han pasado de Generación en Generación y han causado una oleada de paranoia y miedo que continúa resonando entre los Cainitas y la Canalla." 
 artifact_first_of_times_name: "El Primero de los Tiempos"
 artifact_first_of_times_description: "Caín explica que sacrificó a su hermano, Abel, por amor. Su 'Padre' expulsó a Caín, para que vagara en la oscuridad en la Tierra de Nod. Parte de la 'Crónica de Caín' en el 'Libro de Nod'."
 artifact_coming_of_lilith_name: "La Llegada de Lilith"
 artifact_coming_of_lilith_description: "Caín explica que sacrificó a su hermano, Abel, por amor. Su 'Padre' expulsó a Caín, para que vagara en la oscuridad en la Tierra de Nod. Parte de la 'Crónica de Caín' en el 'Libro de Nod'."
 artifact_liliths_magick_name: "La Magia de Lilith"
 artifact_liliths_magick_description: "Caín desea tener los dones de poder que posee Lilith. Tras cierta insistencia, la vacilante Lilith comienza la ceremonia del Despertar cortándose con un cuchillo y sangrando en un cuenco para que él beba. Caín participa. Parte de la 'Crónica de Caín' en el 'Libro de Nod'."
 artifact_temptation_of_caine_name: "La Tentación de Caín"
 artifact_temptation_of_caine_description: "Caín es visitado por tres ángeles que son agentes de Dios. Cada ángel ofrece a Caín una oportunidad de arrepentirse por el asesinato de Abel. Al rechazar al Arcángel Miguel, Caín y sus hijos son maldecidos con la debilidad al fuego. Al rechazar a Rafael, Caín y sus hijos son maldecidos con la vulnerabilidad a la luz solar. Al rechazar a Uriel, Caín y sus hijos son maldecidos con la Bestia interior y la sed de sangre. Aparece entonces un cuarto ángel, Gabriel. Este ángel ofrece la [golconda|E], el único camino hacia la 'luz' por la misericordia de Dios. Caín es 'Despertado' y se desarrolla con las [Glossary('Disciplines','game_concept_discipline_desc')]. Con todos estos poderes, abandona a Lilith. Parte de la 'Crónica de Caín' en el 'Libro de Nod'."
 artifact_zillahs_tale_name: "El Relato de Zillah"
 artifact_zillahs_tale_description: "Caín se enamora de Zillah y busca casarse con ella. Hace todo lo que se le ocurre para que ella le desee, pero ella no quiere saber nada de él. Caín se frustra tanto que se tira de los pelos. Finalmente busca la magia de la Megera, quien acaba engañándole para que acepte un vínculo de sangre. Este descubrimiento del Vínculo de sangre es lo que finalmente une a Zillah con Caín para que él pudiera conseguir que se casara con él. Parte de la 'Crónica de Caín' en el 'Libro de Nod'."
 artifact_tale_of_the_crone_name: "El Relato de la Megera"
 artifact_tale_of_the_crone_description: "El vínculo de sangre que tiene a Caín unido a la Megera, le tiene a su servicio. Tras un año de cumplimiento y de evitar su sangre, le preguntó a la Megera cómo ser más poderoso que sus chiquillos, por miedo a que estos tomaran el control. Esta indagación era en realidad parte de un plan para usar esa información contra ella. Ella le entrega un arma de madera de gofer viva y le explica cómo usarla. Tras aceptar el arma, Caín se la clava en el corazón, rompiendo el vínculo de sangre. Parte de la 'Crónica de Caín' en el 'Libro de Nod'."
 artifact_tale_of_the_first_city_name: "El Relato de la Primera Ciudad"
 artifact_tale_of_the_first_city_description: "Caín expresa haber estado en soledad durante un eón. Busca estar de nuevo con los mortales, y encuentra una ciudad habitada por los 'Hijos de Seth'. Le aceptan como rey y gobierna durante algún tiempo, sintiéndose de nuevo solo en su poder. Un joven llamado Enoch le ruega ser hijo de Caín. A pesar de la advertencia de Uriel sobre tener chiquillos, Caín Abraza a Enoch, su primer chiquillo. Caín proclama entonces que esta Primera Ciudad sea conocida como la Ciudad de Enoch. Su nuevo chiquillo Enoch le ruega entonces hermanos Vástagos. Caín accede, y hace que Irad y Zillah sean abrazados. Ellos, a su vez, crean más progenie. Por miedo a propagar su maldición, Caín ordena que no se creen más chiquillos. Ellos obedecen y la ciudad prospera durante eras, convirtiéndose en un gran Imperio. Entonces llegó el Diluvio y destruyó la Ciudad de Enoch y a todos los 'Hijos de Seth'.\nParte de la 'Crónica de Caín' en el 'Libro de Nod'."