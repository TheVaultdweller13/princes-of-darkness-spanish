 artifact_ananata_name: "Ananata"
 artifact_ananata_description: "#bold Coste de entrar en la [umbra|E]: [gold_i]#P -25%/[rarity|E]#!\nUn Ananata es un señorío de bolsillo dentro de la [umbra|E] que los Nagah usan como refugio seguro, de un modo similar a los dominios-guarida de los Bastet. Cada Ananata es único y parte del Nagah que lo creó, pero un Nido también puede compartir un Ananata mediante ciertos ritos. A diferencia de un dominio-guarida, un Ananata es portátil; sin embargo, solo se puede llevar un Ananata a la vez. Generalmente se accede a él a través de una fuente de agua dulce."
     
 artifact_dragon_jade_name: "Jade del Dragón"
 artifact_dragon_jade_description: "#bold Permite que, cuando necesites gastar Chi, se gaste primero el Chi almacenado en este Recipiente de Chi.#!\nEstos colores de jade representan el Elemento Madera. A menudo se talla con formas florales o con las de animales del bosque."
 artifact_feng_jade_name: "Jade Feng"
 artifact_feng_jade_description: "#bold Permite que, cuando necesites gastar Chi, se gaste primero el Chi almacenado en este Recipiente de Chi.#!\nEste es el Jade de Fuego y ejemplifica el Yang. A menudo se talla con formas de fuego o imágenes de Fénix. Es igual de probable que se deje en bruto, con poco tallado."
 artifact_tiger_jade_name: "Jade del Tigre"
 artifact_tiger_jade_description: "#bold Permite que, cuando necesites gastar Chi, se gaste primero el Chi almacenado en este Recipiente de Chi.#!\nEjemplifica el Elemento Metal. A menudo se talla con formas marciales y es un adorno popular para los pomos de las armas."
 artifact_tortoise_jade_name: "Jade de la Tortuga"
 artifact_tortoise_jade_description: "#bold Permite que, cuando necesites gastar Chi, se gaste primero el Chi almacenado en este Recipiente de Chi.#!\nEste jade está en sintonía con el Yin. Los artesanos suelen tallarlo con formas de lágrima o de criaturas del Agua."
 artifact_mandarin_jade_name: "Jade del Mandarín"
 artifact_mandarin_jade_description: "#bold Permite que, cuando necesites gastar Chi, se gaste primero el Chi almacenado en este Recipiente de Chi.#!\nEste jade, que representa la Tierra, es equilibrado y el más valioso. A menudo se talla para representar bestias nobles o los atributos de la realeza, como abanicos o cetros."
 
 artifact_glamour_vessel_name: "Batería de Glamour"
 artifact_glamour_vessel_description: "#bold Permite que, cuando necesites gastar Glamour, se gaste primero el Glamour almacenado en este Recipiente de Glamour.#!\nEn la jerga común de los nocker, FUBAR es un acrónimo de «Jodido Más Allá de Todo Reconocimiento»; un error garrafal. También es un fuego fatuo (una quimera de electricidad o fuego) usado para alimentar los inventos quiméricos de los nocker."
 artifact_pathos_vessel_name: "Recipiente de Pathos"
 artifact_pathos_vessel_description: "#bold Permite que, cuando necesites gastar Pathos, se gaste primero el Pathos almacenado en este Recipiente de Pathos.#!\nUna reliquia que puede almacenar Pathos para su uso posterior."
 artifact_angst_vessel_name: "Recipiente de Angustia"
 artifact_angst_vessel_description: "#bold Permite que, cuando necesites gastar Angustia, se gaste primero la Angustia almacenada en este Recipiente de Angustia.#!\nUna reliquia que puede almacenar Angustia para su uso posterior."
 artifact_blood_vessel_name: "El Cáliz Odioso"
 artifact_blood_vessel_description: "#bold Permite que, cuando necesites gastar Sangre, se gaste primero la Sangre almacenada en este Recipiente de Sangre.#!\nPerversa creación de un modelador de carne Tzimisce, esta abominación está condenada a vivir una eternidad torturada al servicio de los malditos. A medida que mates enemigos, el Cáliz se llenará de sangre. Usa el Cáliz para alimentarte de él y obtener su $pod_vitae$ almacenada."
 
 artifact_thornstick_name: "Bastón de espinas"
 artifact_thornstick_description: "Miles de estas reliquias yacen esparcidas por el [UmbraGlossaryLocalized('shadowlands','Inframundo')]. Derivadas de cualquier tipo de porra o bastón que su dueño apreciara especialmente y usara con malas intenciones, en su forma de reliquia estas porras antidisturbios y bastones policiales echan en su extremo activo una gruesa capa de espinas afiladas como cuchillas."  
 artifact_old_glory_name: "Vieja Gloria"
 artifact_old_glory_description: "Los andrajosos restos de una bandera de batalla, Vieja Gloria no muestra los colores de un solo país o movimiento. En cambio, cambia sin cesar, saltando de una bandera regimental de la Guerra Civil a la Tricolor en un instante y luego a la Jolly Roger. Supuestamente nunca ha mostrado la misma bandera dos veces, aunque quien la mire cuando está desplegada no está entendiendo nada."  
 artifact_sweeneys_pride_name: "Orgullo de Sweeney"
 artifact_sweeneys_pride_description: "Esta navaja de afeitar sin pretensiones, con una hoja finamente afilada y una incrustación de nácar en el mango de roble, parece bastante inofensiva. Sin embargo, ha cobrado muchos más wraiths de los que le corresponden en los tres siglos que lleva existiendo. Transmitida de mano en mano y de dueño en dueño, la navaja, llamada sarcásticamente Orgullo de Sweeney, otorga a quien la empuña Fuerza adicional mientras la blande."  
 artifact_emperors_nightingale_name: "Ruiseñor del Emperador"
 artifact_emperors_nightingale_description: "Un pájaro de relojería ingeniosamente fabricado que se remonta a los días de gloria de Atenas; el ruiseñor ha sido reelaborado a fondo y en repetidas ocasiones. Ahora luce un manto de gemas preciosas y interminables mejoras en su articulación, y también ha adquirido un poder de lo más peculiar. En concreto, el dueño del ruiseñor puede infundir Pathos al pájaro y susurrar el nombre de algo, de algún lugar o de alguien a quien desea encontrar. El pájaro alzará el vuelo de inmediato y se dirigirá al objetivo solicitado. Vuela a un ritmo lento, pero constante e ininterrumpido, para que su dueño pueda seguirlo, aunque quien use el ruiseñor debe estar preparado para un viaje duro. El pájaro irá literalmente hasta los confines del [UmbraGlossaryLocalized('shadowlands','Inframundo')] si es necesario para hallar su objetivo, ya sean las [UmbraGlossaryLocalized('far_shore','Costas Lejanas')] o el corazón del [UmbraGlossary('pod_realm_labyrinth')]."  
 artifact_bell_of_summoning_name: "Campana de Convocatoria"
 artifact_bell_of_summoning_description: "Importado del Imperio de Jade, este objeto parece una pequeña campana de jade con su badajo. Los wraiths pueden invertir en la campana tanto Pathos como quieran. A partir de entonces, cada vez que se toque la campana, cualquier wraith que aún tenga Pathos invertido en ella podrá oír la llamada y responder a ella, consciente al instante de dónde se encuentra la campana."  
 artifact_masks_name: "Máscaras"
 artifact_masks_description: "La mayoría de las máscaras simbolizan los cargos que ostenta quien las lleva. El pordiosero de aspecto más andrajoso que porte la máscara de un Anacreonte recibirá automáticamente el respeto debido a ese cargo. Por ello, existe un floreciente mercado negro tanto de máscaras robadas como falsificadas. Una buena falsificación puede permitir a un wraith entrar en una Ciudadela sin que nadie le pregunte, aunque puede que no le permita salir de nuevo."  
 artifact_instant_nihil_name: "Nihil instantáneo"
 artifact_instant_nihil_description: "Favoritos entre criminales, Renegados y Legionarios en puestos aislados, los Nihil instantáneos parecen botellas de cristal llenas de tinta. Son frágiles y deben manejarse con cuidado para que no se rompan, pero cuando se activan (es decir, se rompen), en un turno producen un [GetModifier('nihil_modifier').GetNameWithTooltip] de seis pies de ancho. Un wraith que persiga de cerca a quien use el Nihil instantáneo puede caer en él y acabar en la [UmbraGlossary('tempest')]. A la inversa, quien no sea un Heraldo y se vea acorralado puede usar uno para facilitar su huida de una situación apurada."  
 artifact_redeyes_name: "Ojos Rojos"
 artifact_redeyes_description: "Un par de antorchas de fuego de alma en esferas de cristal reliquia, los Ojos Rojos arden con una luz que puede verse hasta a una milla de distancia a través de la espuma y el vaivén de la Tempestad. Cada juego de Ojos Rojos está calculado para durar un año entero, y cada Legionario que patrulla en la propia tormenta lleva al menos un juego. Cuando se sueltan en la [UmbraGlossary('tempest')], un juego de Ojos Rojos se mantiene flotando en su posición hasta que los cristales de fuego de alma que alimentan las linternas se consumen. Son útiles para marcar las rutas de patrulla de los wraiths destinados a la Tempestad, los equipos de búsqueda y rescate y las cuadrillas de trabajo atrapadas lejos de una Vía."
 artifact_scribblers_pen_name: "Pluma del Escribiente"
 artifact_scribblers_pen_description: "Regalos de Nhudri a los guardianes de la Gran Biblioteca, las Plumas del Escribiente permiten a un wraith transcribir las palabras que de otro modo habrían quedado sin pronunciar. Adiestrado en su uso, un wraith puede emplear la pluma para escribir tanto Pathos como Angustia, transformándolos en palabras de plata reluciente o de negro tintado que nunca parecen secarse."
 artifact_soulfire_mask_name: "Máscara de fuego de alma"
 artifact_soulfire_mask_description: "No toda máscara es solo un símbolo. Ciertos Jerarcas han combinado la simbología con una letal practicidad. Diseñadas para usarse como armas, estas máscaras, que pertenecen en su mayoría a Jerarcas de alto rango, lucen una disposición de cristales de fuego de alma. Al activarse, la máscara puede escupir una lengua de fuego. Alternativamente, puede rodear a quien la lleva con un aura abrasadora que absorbe el daño."
 artifact_soulfire_lantern_name: "Linterna de fuego de alma"
 artifact_soulfire_lantern_description: "En lugar de iluminar, esta linterna envuelve a quien la sostiene en sombras, ocultándola a la vista. La luz de la linterna es una esquirla de fuego de alma de 10 Pathos. Cuando el usuario activa el cristal, el Pathos almacenado se consume y la linterna y quien la porta desaparecen de la vista. Lo único visible es una tenue luz oscilante que, curiosamente, también se ve a través del Sudario."
 artifact_star_of_the_east_name: "Estrella de Oriente"
 artifact_star_of_the_east_description: "Con el aspecto de nada más que un adorno de árbol de Navidad hecho de azúcar hilado, la Estrella de Oriente es considerada por unos una afectación excéntrica y por otros una herramienta que salva vidas. Cuando está inactiva, mantiene una órbita irregular alrededor de la cabeza de su dueño. Sin embargo, una vez activada, la estrella sale volando de inmediato en dirección al peligro más acuciante al que se enfrenta el wraith. Si la amenaza está a menos de 10 yardas, la estrella se cernirá sobre ella. Si no, se mantendrá en posición en dirección a la amenaza durante una hora entera antes de necesitar recargarse o volver a su órbita normal."
 artifact_candelabra_of_souls_name: "Candelabro de Almas"
 artifact_candelabra_of_souls_description: "Tan malvado como codiciado, el candelabro parece una obra grácilmente elaborada en latón pulido. Cada uno tiene nueve ramas, con un número variable de brazos que salen de cada rama, y cada brazo termina en un candelero para una vela gruesa, en el que se supone que se coloca y se prende un wraith Moliado en forma de vela."
 artifact_stygian_steel_armor_name: "Armadura de acero estigio"
 artifact_stygian_steel_armor_description: "No muchos pueden presumir de poseer semejante premio. Muy ornamentada y a menudo decorada con blasones y otros elementos aparentemente sin función, la armadura es en realidad bastante útil. Cada una es distinta, desde ampliaciones de la armadura de hoplita hasta completas armaduras de placas medievales. Lo que importa es que en todos los casos se protege el torso de quien la lleva."
 artifact_stygian_wall_flies_name: "Moscas de Pared Estigias"
 artifact_stygian_wall_flies_description: "Mensajeras y espías, estas ingeniosas réplicas de insectos de las [Glossary('Tierras de Piel','game_concept_skinlands_desc')] pueden ir a cualquier parte del nivel de realidad (Estigia o las [UmbraGlossary('shadowlands')]) para observar e informar, y solo los wraiths de vista más aguda pueden detectarlas. Gastando Pathos, el dueño de una mosca puede mirar a través de los ojos de su Artefacto, por lejos que esté. Si gasta más, también puede oír; si gasta aún más, puede hablar a través de ella."
 artifact_living_chains_name: "Cadenas Vivas"
 artifact_living_chains_description: "Hechas de acero estigio, no de acero de alma, estas cadenas no se usan para encarcelar. Más bien, potencian a quien las lleva. Una vez activadas, las cadenas se anclan en la espalda de su usuario, causando daño agravado (que no puede curarse hasta que se retiren las cadenas). El resto de los eslabones negro azabache se enroscan alrededor de quien las lleva, otorgándole en la práctica el equivalente a una armadura de acero de alma además de un arma ofensiva. A una orden de su portador, las cadenas pueden golpear objetivos independientes a hasta 20 pies de distancia."
 artifact_fetterguard_name: "Guardagrilletes"
 artifact_fetterguard_description: "Pocos Artefactos son más preciados —o más precarios— que el Guardagrilletes. Con el aspecto de nada más que una pequeña caja de acero de alma, guarda en su interior versiones en miniatura de los [Fetters|E] de su dueño. Cada uno de ellos debe ser fabricado por el propio wraith, y da igual que lo haga en la forja, mediante Moliate o juntando cachivaches que recuperó en el [UmbraGlossaryLocalized('shadowlands','Inframundo')]. Mientras estos iconos permanezcan a salvo dentro de la caja, no les sobrevendrá ningún daño en el mundo real, e incluso los intentos sobrenaturales de dañarlos saldrán mal de algún modo."
 artifact_beasthide_name: "Piel de bestia"
 artifact_beasthide_description: "Piel de bestia es exactamente lo que suena: un cuadrado de piel curtida tomada de un plásmico u otra bestia semejante. La piel es áspera y escamosa, y de un nocivo color verde, pero tiene una cualidad admirable. Cuando se usa para pulir una reliquia o una hoja de acero estigio, de algún modo la afila más allá de lo que era capaz de conservar antes. El efecto dura lo que dure la batalla. Una pieza típica de Piel de bestia da para una docena de usos antes de deshacerse en jirones."
 artifact_bloodwebs_name: "Redes de sangre"
 artifact_bloodwebs_description: "#bold Permite que, cuando necesites gastar Pathos, se gaste primero el Pathos almacenado en este Recipiente de Pathos.#!\nNhudri se tomó en serio el mandato de Caronte de que nada se desperdicie, como demuestra su creación de las Redes de sangre. Mallas azul negruzco formadas con las venas y arterias de la gran bestia, las Redes de sangre pueden lanzarse sobre un objetivo a un alcance de hasta 10 yardas. Una vez que impactan, enredan a su víctima y comienzan a succionarle el Pathos."
 artifact_shroudripper_gloves_name: "Guantes de Rasgasudarios"
 artifact_shroudripper_gloves_description: "Fabricados con el mejor cuero de piel plásmica y coronados con las garras cuidadosamente recolectadas de los Rasgasudarios, estos guantes son una letal adición al arsenal de un wraith. Filtran ácido de Rasgasudario en cualquier herida que causan, haciendo imposible curarla durante 24 horas."
 artifact_wail_tongue_name: "Lengua de Lamento"
 artifact_wail_tongue_description: "Se dice que la Lengua de Lamento fue lo que hizo que Nhudri decidiera de una vez por todas que había terminado de trabajar con Artefactos de Piel. Es una astilla de la lengua de un plásmico, incrustada con una red de fino alambre de acero estigio. Este repugnante artilugio debe colocárselo luego un wraith en su propia boca, donde devorará de inmediato y dolorosamente la lengua del propio wraith. Además, los patrones de habla del wraith cambian de forma permanente, volviéndose más ásperos, más metálicos y, a menudo, lisa y llanamente escalofriantes."
 artifact_guardian_orb_name: "Orbe Guardián"
 artifact_guardian_orb_description: "Voluminoso pero increíblemente potente, este Artefacto consiste en un globo ocular blanco lechoso, del tamaño de una pelota de playa, con su nervio óptico incluido, engarzado en un fino soporte circular de acero estigio. Quien usa el Orbe lleva un anillo más pequeño, y el Orbe flota y se balancea tras él. El Orbe no solo permite a su dueña ver a su espalda, sino que además se interpone entre ella y cualquier ataque de proyectiles que se aproxime. Cada Orbe se mueve para interceptar cualquier cosa, desde un avión de papel hasta un carro reliquia desbocado."
 artifact_forgebait_name: "Cebo de forja"
 artifact_forgebait_description: "El Cebo de forja parece un óbolo. Un examen minucioso revelará que es una ingeniosa falsificación, pero la mayoría de los wraiths no tendrían motivo para sospecharlo. El Cebo de forja seguirá comportándose como un óbolo (gimiendo, etc.) hasta que el wraith intente usarlo para pagar algo. En ese momento se desintegrará en una baba maloliente. El hedor acompañará al presunto comprador durante una semana, avisando a todo el que pase de que este es un wraith cuya moneda no es de fiar."
 artifact_memory_net_name: "Red de memoria"
 artifact_memory_net_description: "#bold Mayor probabilidad de obtener un [artifact|E] en la acción de [umbra|E] Aventurarse en las Tormentas de Maelstrom.#!\nLos Espectros hábiles suelen poder sacar restos útiles de la [UmbraGlossary('tempest')], pero incluso los más talentosos tienen una suerte desigual. Sin embargo, pueden mejorar sus probabilidades si usan una Red de memoria. Supuestamente hecha con el cabello y los huesos de un angélico capturado, una Red de memoria es una red dorada de hebras relucientes unida a una estructura de aro y vara de hueso. Toda la estructura, examinada de cerca, guarda un sospechoso parecido con un brazo humano. El diámetro de la abertura del aro es de tres pies, que es el tamaño máximo de lo que se puede arrancar de las olas."
 artifact_bean_nighe_caul_name: "Membrana de Bean Nighe"
 artifact_bean_nighe_caul_description: "#bold Como opción de ejecución, te permite alimentar la Membrana con el alma del objetivo para aumentar tu educación o un atributo.#!\nUno de los Artefactos Espectrales más repugnantes que se conocen es el horrendo traje ceñido llamado Membrana de Bean Nighe. Confeccionada con los restos hechos jirones de los rostros de diversos wraiths, los componentes de la Membrana han quedado atrapados para siempre en momentos de angustia atormentada. Todo [GetTrait('spectre').GetName( GetNullCharacter )] que posea la Membrana debe gastar un [Corpus|E] a la semana para alimentarla, o la Membrana empezará a alimentarse de sí misma hasta que no quede nada de ella."


 artifact_bottle_of_fire_name: "Botella de fuego"
 artifact_bottle_of_fire_description: "Una botella achaparrada de cristal rojo, de cuatro pulgadas de alto; la botella de fuego parece corriente hasta que se retira el tapón de latón y se le da la vuelta. En ese momento, un líquido abrasador brota de la botella y se aleja de quien la usa. A medida que avanza, el fuego hace que todos los objetos inflamables a su paso estallen en llamas. Cuando el mago ha causado suficiente destrucción, solo tiene que volver a colocar el tapón."
 artifact_cauldron_of_spies_name: "Caldero de Espías"
 artifact_cauldron_of_spies_description: "El caldero de espías es un Artefacto Verbena por excelencia. El mago solo tiene que llenar el caldero de agua, ponerla a hervir con energía y pronunciar las palabras adecuadas, y del agua saldrá disparado un número de murciélagos (si es de noche) o de grajos (si es de día). Estos animales están conectados telepáticamente con el mago, y todo lo que ven, lo ve ella. Estas criaturas tienen un alcance de varias millas desde el mago y duran 12 horas, momento en que se lanzan a la sombra más cercana y profunda y se desvanecen (para que no se pueda rastrearlas hasta la bruja que las creó)."
 artifact_divine_staff_of_fortuitous_intervention_name: "El Báculo Divino de la Intervención Fortuita"
 artifact_divine_staff_of_fortuitous_intervention_description: "Este Artefacto defensivo no parece más que un bastón de cuatro pies tallado en una madera blanca de grano fino.\nSin embargo, en combate, el báculo divino de la intervención fortuita es una maravilla que contemplar mientras gira en manos del mago que lo empuña, bloqueando, parando y desviando todo tipo de golpes y disparos." 
 artifact_dream_spirit_bag_name: "Bolsa del Espíritu del Sueño"
 artifact_dream_spirit_bag_description: "Esta bolsa ornamental está cubierta de hermosas cuentas y está llena de sueño. Cuando el mago quiere que un objetivo se duerma, simplemente sopla un puñado de sueño hacia él."
 artifact_great_sigil_pendant_name: "Colgante del Gran Sigilo"
 artifact_great_sigil_pendant_description: "Al tratar con los Umbrood con tanta frecuencia, los magos de las Casas de Hermes han desarrollado por necesidad algunos potentes Artefactos que les den ventaja en su trato con los espíritus. El colgante del gran sigilo es un disco de acero de unas tres pulgadas de diámetro grabado con un complejo glifo mágico."
 artifact_serpent_pen_name: "Pluma serpiente"
 artifact_serpent_pen_description: "Las plumas serpiente son herramientas de asesinato relativamente sofisticadas para usar contra individuos que de otro modo están demasiado bien protegidos. Estos Artefactos parecen plumas verdes o doradas, pero aparte de eso varían mucho. Algunas tienen un ornamentado patrón de escamas a lo largo del cuerpo, mientras que otras son relativamente sencillas.\nLa pluma se cuela de algún modo en el bolsillo o el bolso del objetivo. Cuando el objetivo se ha olvidado de la pluma, esta se transforma en una pequeña serpiente altamente venenosa y muerde al objetivo mientras duerme."
 artifact_spiritual_armor_name: "Armadura espiritual"
 artifact_spiritual_armor_description: "#bold Hiere a los [knights|E] y [commanders|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu adversario durante los [single_combat_duel_plural|E], si son vampiros (u otros sobrenaturales que temen al sol).#!\nEl combate realmente no es la especialidad de un Corista Celestial (aunque los Templarios tienen tantas probabilidades como los Coristas de usar este Artefacto), pero hay ocasiones en que se hace necesario. El mago se pone esta fina armadura de malla antes de entrar en batalla y recibe con ello una serie de beneficios."
 artifact_trance_drum_name: "Tambor de trance"
 artifact_trance_drum_description: "Usado principalmente por los Extáticos, el tambor de trance permite a cualquiera familiarizado con los estados de trance entrar en uno tras unos pocos golpes de tambor. Los tambores de trance tienen un tono hueco, resonante y profundamente agradable al golpearlos y facilitan sacudirse el pensamiento consciente mientras alguien los esté tocando."
 artifact_clay_man_amulet_no_suffix_name: "Amuleto del Hombre de Arcilla"
 artifact_clay_man_amulet_name: "Amuleto del Hombre de Arcilla #Weak ([clay_man.MakeScope.GetVariable('clay_man_protection').GetValue|0]/5)#!"
 artifact_clay_man_amulet_description: "#bold Protege de recibir heridas.#!\nEntre los Encantos más codiciados creados por los Hablasueños están los amuletos del hombre de arcilla. El hombre de arcilla es una pequeña figurilla de arcilla con forma humana, vivamente decorada, que se lleva colgada de un cordón al cuello. Quien quiera obtener los beneficios protectores de un amuleto del hombre de arcilla debe sintonizarlo consigo mismo ungiéndolo con su propia sangre o semen. Una vez ungido, el hombre de arcilla se convierte en un poderoso encanto protector. Las cinco siguientes veces que el personaje reciba daño (mientras lleve el amuleto), el hombre de arcilla absorbe la herida por completo. Esto incluye heridas causadas por combate físico, veneno y magia. Cada herida hace que uno de los miembros del hombre de arcilla se desmorone en polvo. Con la quinta y última herida, la cabeza del hombre de arcilla se desmorona y el Encanto queda destruido."
 clay_man_amulet_soaked_damage: "Daño transferido"
 clay_man_amulet_soaked_damage_ct: "Tu Amuleto del Hombre de Arcilla te ha protegido de sufrir heridas."
 artifact_ebon_candles_of_manifest_nigrescence_name: "Velas de Ébano de la Nigrescencia Manifiesta"
 artifact_ebon_candles_of_manifest_nigrescence_description: "Estos oscuros encantos fueron creados originalmente por una cábala de Hollow Ones que querían proteger su santuario de espías furtivos. Las velas de ébano de la nigrescencia manifiesta tienen dos Efectos principales cuando se encienden: atenúan todas las fuentes de luz convencionales de la zona objetivo hasta una cuarta parte de su luminosidad normal y, al mismo tiempo, producen una áspera luz gris que profundiza y espesa todas las sombras de la zona, dándoles cierto grado de tangibilidad. Las sombras hambrientas apagan las llamas pequeñas, incluidas cerillas, cigarrillos y otras velas dentro de la zona objetivo."
 artifact_ginger_dragons_name: "Dragones de jengibre"
 artifact_ginger_dragons_description: "Estos masticables caramelos de jengibre con forma de dragón son raros en todas partes, aunque parecen un poco más fáciles de conseguir en China. Normalmente se encuentran en bolsas de celofán de cinco, aunque son más comunes los dragones de jengibre sueltos y las bolsas incompletas que las bolsas llenas. Una bolsa llena de dragones de jengibre es un raro tesoro.\nPara usar un dragón de jengibre, el personaje se mete el caramelo en la boca y empieza a masticar. A continuación, el personaje es capaz de respirar fuego."
 artifact_salvation_bell_name: "Campana de la Salvación"
 artifact_salvation_bell_description: "Estos Encantos, con forma de pequeñas campanas de latón, protegen a su usuaria de quienes quieran hacerle daño por la noche. Cuando se hace sonar una campana de la salvación, irradia una cálida luz dorada. Una vez que la campana empieza a brillar, quien la toca comienza a rezar, cantar o entonar en armonía con el tañido de la campana. Mientras dure esta oración, el tañido de la campana no se apaga y los enemigos de quien canta no pueden acercarse a menos de 10 pies de ella. Además, por cada voz que cante en armonía con la campana, el radio de protección aumenta en 10 pies. Si quien canta intenta hacer cualquier otra cosa además de cantar (por ejemplo, caminar, leer), el hechizo se rompe y la campana se resquebraja."
 artifact_seeds_of_decay_name: "Semillas de Descomposición"
 artifact_seeds_of_decay_description: "#bold Hiere a los [knights|E] y [commanders|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu adversario durante los [single_combat_duel_plural|E], si son [GetTrait('vampire').GetName( GetPlayer )].#!\nInmensamente poderosas y difíciles de encontrar, las semillas de descomposición devuelven las cosas antinaturales al ciclo natural de la vida. «Cosas antinaturales» abarca en este caso desde máquinas hasta uranio gastado o vampiros. Un puñado de semillas basta para devolver 12 pies cúbicos de sustancia a la tierra de la que procede, por remotamente que sea."
 artifact_astral_tiki_name: "Tiki Astral"
 artifact_astral_tiki_description: "#bold Nivel local del Guantelete: [grace_i]#P -2#!#!\nLos tikis astrales (a veces llamados tikis fantasma o tikis espíritu) se tallan en madera dura negra y usan cristal verde o gemas para los ojos. La variedad más común es una figura achaparrada exenta de aproximadamente un pie de altura."
 artifact_beast_cloak_name: "Capa de bestia"
 artifact_beast_cloak_description: "#bold Permite cambiar de forma a un animal aleatorio.#!\nUno de los fetiches más antiguos que conoce la raza humana, las capas de bestia se hacen con la piel entera (cabeza incluida) de un animal grande. Al ponerse la capa y deslizar la cabeza del animal sobre la suya, quien la lleva adopta la forma de ese animal en particular. Osos, toros, grandes felinos, lobos y bisontes son las capas más comunes, pero existen algunas muy extrañas que permiten a los humanos adoptar la forma de tiburones, dragones de Komodo o elefantes."
 artifact_sebastiannas_ghost_devouring_jack_o_lantern_name: "Calabaza devoradora de fantasmas de Sebastianna"
 artifact_sebastiannas_ghost_devouring_jack_o_lantern_description: "#bold Número máximo de wraiths vinculados: #P +1#!.#!\nEste Fetiche de los Hollow Ones es, en efecto, una mezcla de Fetiche y Encanto. La calabaza devoradora de fantasmas absorbe fantasmas (u otros espíritus, si el mago la crea así) en un radio de 30 pies y los retiene hasta que se los libera o la calabaza se pudre."
 artifact_lens_of_zadkiel_name: "La Lente de Zadkiel"
 artifact_lens_of_zadkiel_description: "Zadkiel es un ángel del conocimiento y la comprensión. El Fetiche que lleva su nombre es una lente de cristal de seis pulgadas de diámetro. Alrededor de la circunferencia de la lente hay una fórmula de vinculación escrita en enoquiano.\nCuando un mago mira a través de la lente de Zadkiel, todo lo que ve le es traducido por el ángel vinculado al cristal. Los idiomas extranjeros, el cifrado de alto nivel e incluso los glifos de los hombres lobo y los extraños signos de los cazadores imbuidos se vuelven claros como el día.\nLa lente también ve a través de las ilusiones mágicas y del Quimerismo vampírico, y revela lo que son incluso los hologramas más convincentes."
 
 need_dream_religion_tt: "Debes ser de la fe [GetFaithByKey('viaarchangeli').GetName] o [GetFaithByKey('codexoflegacies').GetName]."
 need_ashirra_haqim_religion_tt: "Debes ser de una fe de la religión [GetReligionByKey('ashirra_religion').GetName] o [GetFaithByKey('tariqelhaqim').GetName]"
 need_bastet_mage_tt: "Debes ser [GetTrait('mage').GetName( GetPlayer )] o [GetTrait('bastet').GetName( GetPlayer )]."
 need_middle_kingdom_splat_tt: "Debes ser [GetTrait('shih').GetName( GetPlayer )], [GetTrait('wutian').GetName( GetPlayer )], [GetTrait('wukuei').GetName( GetPlayer )], [GetTrait('kueijin').GetName( GetPlayer )], [GetTrait('dhampyr').GetName( GetPlayer )], [GetTrait('hsien').GetName( GetPlayer )] o [GetTrait('hun_and_po').GetName( GetPlayer )]."
 
 chimerical_item_tt: "Debes ser [GetTrait('fae').GetName( GetPlayer )], [GetTrait('changeling').GetName( GetPlayer )], [GetTrait('kinain').GetName( GetPlayer )], [GetTrait('kiasyd').GetName( GetPlayer )], [GetTrait('maeghar').GetName( GetPlayer )] o [GetTrait('bastet').GetName( GetPlayer )] de la fe [GetFaithByKey('ceilican').GetName]."
 
 artifact_isis_fragments_name: "Fragmentos de Isis"
 artifact_isis_fragments_description: "Una historia exhaustiva de los orígenes de las Momias egipcias. Aunque puede que la escribiera la propia Isis, la mayoría cree que se trata más bien de una reconstrucción realizada por los fieles de su culto."
 artifact_book_enoch_name: "Libro de Enoc"
 artifact_book_enoch_description: "Este libro, uno de los legados más antiguos y oscuros de la Estirpe, quizá más antiguo que el Libro de Nod —aunque ¿quién podría saber tales cosas con certeza?—, es un ecléctico surtido de profecías, sagas y saberes que gira en torno al gran ajuste de cuentas por venir: el Fin de los Tiempos."
 artifact_rasail_safa_name: "Rasa’il Ikhwan al-Safa"
 artifact_rasail_safa_description: "Un gigantesco compendio de 52 epístolas escritas por un grupo de místicos filosóficos de Basora, Irak, durante el siglo X; una sociedad conocida como los Hermanos de la Sinceridad. Sus enseñanzas esotéricas y su filosofía han sido de gran utilidad para los cazadores de monstruos desde entonces."
 artifact_the_jawbone_name: "La Mandíbula"
 artifact_the_jawbone_description: "Al parecer, la mandíbula que Caín usó para asesinar a Abel. Se rumorea que puede matar al instante a cualquier Cainita, encontrar al propio Caín o levantar la maldición del vampirismo. Pero, sinceramente, parece una mandíbula corriente.\nEsta en concreto se labró tal reputación que su rumoreado descubrimiento en Constantinopla empujó a la Familia Giovanni a respaldar la 4.ª Cruzada para recuperarla."
 
 artifact_flying_dutchman_name: "Holandés Errante"
 artifact_flying_dutchman_description: "El legendario Holandés Errante, un barco fantasma que se cree que aparece ante las naves condenadas."
 artifact_siklos_name: "Siklos"
 artifact_siklos_description: "Siklos era la hoja de Caronte. Formada a partir de una combinación de los óbolos adquiridos por Caronte y las almas de los peores traidores de Estigia, Siklos era una gran guadaña que poseía cierto grado de sensibilidad, capaz incluso de soñar."
 artifacts_personal_mount: "Montura"
 
 artifact_fetish_name: "Fetiche [newly_created_artifact.GetNameNoTooltip]"
 artifact_fetish_description: "Al tener vinculado a [killed.GetTitledFirstNamePossessive], este fetiche ha adquirido algunas propiedades del [GetTrait('spirit').GetName( GetNullCharacter )]."
 artifact_new_fetish_name: "Fetiche [this_artifact.GetNameNoTooltip]"
 artifact_new_fetish_desc: "[this_artifact.GetDesc]\n\n$artifact_fetish_description$"
 artifact_old_fetish_desc: "[this_artifact.GetDesc]\n\n#X [killed.GetTitledFirstName] ha abandonado este fetiche.#!"
 fetish_destroyed_notification: "Fetiche destruido"

 artifact_necklace_of_tou_mu_name: "Collar de [Glossary('Tou Mu','podgloss.toumu')]"
 artifact_necklace_of_tou_mu_description: "Collar de [Glossary('Tou Mu','podgloss.toumu')]"

 artifact_catgut_name: "Cuerda de tripa [newly_created_artifact.GetNameNoTooltip]"
 
 artifact_rhinegold_name: "Oro del Rin"
 artifact_rhinegold_description: "Descubierto cuando la luz del sol lo iluminó en el fondo de un río en el que moraban tres Sílfides conocidas como las Doncellas del Rin, el Oro del Rin es un anillo #N seductor#! forjado con el #N oro#! más puro. Quienes se colocan el anillo pueden renunciar al amor a cambio del tremendo #N poder#! que el anillo les ofrece para cambiar de forma a todo tipo de animales y monstruos, y para #N gobernar#! el mundo. Robado a las Sílfides por el Nocker Alberich y perdido después con el paso de las eras, el Oro del Rin ha pasado de mano en mano, siempre acechado por las maldiciones de las doncellas que lo perdieron y por la #N codicia#! que todo lo consume de quienes lo #N ansían#!."
 

 artifact_incunabulum_fragment_name: "Tratado sobre Kupala"
 artifact_incunabulum_fragment_description: "#bold Si se reúnen suficientes de estos tratados, se podría compilar un libro definitivo(?) sobre Kupala.#!\nFragmentos de conocimiento sobre Kupala cifrados en metáforas, claves, diagramas, cuartetos, revelaciones enoquianas y, por supuesto, profecías."
 artifact_incunabulum_kupalam_name: "Incunabulum Kupalam"
 artifact_incunabulum_kupalam_description: "#bold Todas las [krainas|E] quedan potenciadas independientemente de su ubicación si tienes la [perk|E] [GetPerk('genius_loci_5_perk').GetName(GetPlayer)]#!.\n\nUn voluminoso manuscrito escrito a mano que compila fuentes fragmentarias anteriores. Aunque la mayor parte está en latín académico, algunas partes están cifradas en metáforas, claves, diagramas, cuartetos, revelaciones enoquianas y, por supuesto, profecías. Un equipo de eruditos podría pasar un siglo desentrañando las capas de significado de su texto, y cada uno llegaría a una versión distinta de la verdad tras el mito de Kupala.\nAlgunos ocultistas afirman que los rituales de sus páginas estaban destinados a vincular a Kupala. Otros insisten en que el tomo puede usarse, en cambio, para invocarlo y controlarlo."
 artifact_broken_blade_michael_name: "Hoja Rota de Miguel"
 artifact_broken_blade_michael_description: "#bold Los vampiros pueden repararla con una decisión menor.#!\nEsta antigua hoja fue propiedad del propio Miguel mucho antes de que se convirtiera en Miguel. Fue usada por una muchacha de Ebla para quitarse la vida cuando su amor eterno nunca vino a salvarla. Siglos después fue recuperada por esa misma muchacha, ya inmortal, e imbuida de su odio demoníaco hacia quien la abandonó.\nFinalmente, en 1204, la hoja volvió a su dueño original y su destrucción fue el penúltimo acto de venganza de quien una vez fue una niña de Ebla."
 artifact_bow_sun_name: "Arco del Sol"
 artifact_bow_sun_description: "Un poderoso arco mágico creado por el mismísimo Al Ashrad. Se dice que brilla con el poder del Sol cuando una amenaza ofuscada se acerca a su dueño."
 artifact_fang_kali_name: "Colmillo de Kali"
 artifact_fang_kali_description: "Una poderosa daga mágica propiedad de Al Ashrad, aparentemente un vestigio de sus días mortales como mago. Aunque el hechicero no hace comentarios al respecto, el origen de esta daga podría ser una pista sobre la fe y el trasfondo cultural mortal del misterioso vampiro."
 artifact_cup_laezar_name: "Copa de Laezar el Durmiente"
 artifact_cup_laezar_description: "Una copa de plata bellamente elaborada que se dice que pertenece a la cripta perdida de Laezar el Durmiente, una criatura legendaria venerada por algunos Baali como uno de los Hijos de la Oscuridad Exterior."
 artifact_ubar_chronicles_name: "Las Crónicas de Ubar"
 artifact_ubar_chronicles_description: "Un texto antiguo apreciado por algunos eruditos vampíricos; este tomo intenta combinar los mitos de Enoc y Ubar en un todo cohesionado."
 artifact_gospels_irad_name: "Evangelios de Irad y Adah"
 artifact_gospels_irad_description: "Un texto antiguo que resume varias batallas libradas por el belicoso vampiro de 2.ª Generación Irad. También una de las pocas fuentes que afirman la existencia de una misteriosa Chiquilla «perdida» de Caín llamada Adah."
 artifact_codex_damned_name: "Códice de los Malditos"
 artifact_codex_damned_description: "Un texto antiguo que trata del gobierno y las jerarquías de la Primera y la Segunda Ciudad. Es una escritura oscura, pero no por ello menos apreciada por la mayoría de los eruditos nodistas."
 artifact_wounds_sword_name: "Heridas de la Espada de la Noche"
 artifact_wounds_sword_description: "Un poema védico popular entre los vampiros indios. Ensalza la valentía y el liderar con el ejemplo."
 artifact_canticle_japhet_name: "Cántico de Jafet"
 artifact_canticle_japhet_description: "Un texto ampliamente considerado herético (y que, al parecer, no fue escrito por el respetado Capadocio Jafet); este volumen afirma que Caín está muerto, ofreciendo así una visión radicalmente distinta de la historia más temprana de los Cainitas."
 artifact_gospel_consoler_name: "Evangelio del Consolador"
 artifact_gospel_consoler_description: "El texto de demonología más infame, también llamado Evangelio de Menahem. Este documento presenta a Lucifer y a los demonios del Infierno como ángeles iluminados que se han sacrificado para educar y elevar a la humanidad. Contiene varios de los nombres demoníacos más antiguos y poderosos, así como rituales generales de invocación."
 artifact_book_thoth_name: "Libro de Thoth"
 artifact_book_thoth_description: "El mito del antiguo Egipto describe los hechizos de este libro como fuente de un control absoluto sobre la vida y la muerte. Algunos creen que este libro describe ciclos de existencia, una letanía de eones que surgieron y cayeron antes de la historia registrada. Los Setitas añaden que estos mundos muertos aún existen, al igual que sus gobernantes, pero solo un necio o un loco invocaría poderes tan malignos y primordiales.\nLas Momias tienen una opinión más matizada: piensan que Thoth instruyó a la propia Isis en cuestiones de hechicería, lo que lo convierte en mentor de quien les ofreció la verdadera inmortalidad."
 artifact_dreams_angra_name: "Sueños de Angra Mainyu"
 artifact_dreams_angra_description: "Este diario procede del primer Sumo Sacerdote de Ba’al y, como tal, es muy venerado por los Baali. Este códice detalla sus rituales más salvajes y termina con una profecía oscura y reveladora del alzamiento infernal que devorará el mundo."
 artifact_book_tobit_name: "Libro de Tobit"
 artifact_book_tobit_description: "Una versión herética del deuterocanónico Libro de Tobit que se remonta a la antigua Cartago. Esta versión, atesorada por los diabolistas, es una copia del texto bíblico original, ampliamente comentada por escrito tanto por Troile como por su amante, Moloch. Esta versión contiene antiguos saberes infernales sobre los Clanes y muchos secretos celosamente guardados sobre la vida en su antigua ciudad."
                                        
 artifact_shard_copy_name: "[target.GetNameNoTooltip]"                             
 artifact_shard_copy_desc: "[target.GetDesc]"           

 artifact_lilith_shard_name: "Fragmento del Códice de la Madre Oscura"                  
 artifact_lilith_shard_description: "Un fragmento que ahonda en los orígenes y motivos de la Madre Oscura que instruyó al Padre Oscuro en las artes de la Sangre; el fragmento rezuma el veneno de su furia apenas contenida. La agonía y el pesar sangran por cada carácter, y el propio fragmento parece temblar, aunque se ignora si de dolor o de rabia."                  
 artifact_enoch_shard_name: "Fragmento del Códice Enoquiano"                  
 artifact_enoch_shard_description: "Un fragmento que se asemeja a la piedra angular de un palacio; parece contener los dictados de la lengua de la Primera Ciudad, el idioma de la utopía del Padre Oscuro. Tan arraigada está esa antigua civilización en este fragmento que puedes sentir cómo te impone la vida nocturna de la ciudad con solo su ambiente."                  
 artifact_sphere_shard_name: "Fragmento del Códice de la Gota"                  
 artifact_sphere_shard_description: "Un fragmento cubierto de manchas de color óxido de sangre y $pod_vitae$; el interior del fragmento, si se lo agita, parece chapotear como si contuviera un líquido. El fragmento susurra sobre las artes de la sangre y lo arcano. Casi te susurra a ti, pues tu sangre se agita cada vez que extiendes la mano para tocarlo."                  
 artifact_diplomacy_shard_name: "Fragmento del Códice Diplomático"                  
 artifact_diplomacy_shard_description: "Un fragmento que huele a augustos perfumes y finos vinos; la escritura de este fragmento es mucho más elegante que la de los otros. Es refinado incluso en su decadencia, pues envejece con gracia a pesar de los milenios de abandono que sufre. Con solo contemplarlo, sientes cómo tu ánimo se aviva ante su serena dignidad. "                  
 artifact_martial_shard_name: "Fragmento del Códice Militante"                  
 artifact_martial_shard_description: "Un fragmento con un análisis exhaustivo de la guerra y el adiestramiento; tiene un aire de disciplina y ferocidad, con la sabiduría de mil batallas grabada en su interior. Aunque el fragmento trata de la guerra de carros y del refinado del bronce, gran parte de la información que contiene sigue siendo relevante hoy en su eterna sabiduría."                  
 artifact_stewardship_shard_name: "Fragmento del Códice del Guardián"                  
 artifact_stewardship_shard_description: "Un fragmento que parece haber sido un exhaustivo informe de senescal sobre los registros de «ganado» y los proyectos de desarrollo de la Segunda Ciudad; en esta antigua arcilla se detalla todo, desde la construcción hasta el flujo del comercio."                  
 artifact_intrigue_shard_name: "Fragmento del Códice Enigmático"                  
 artifact_intrigue_shard_description: "Un fragmento que da la sensación de esconderse activamente de ti; recoge los detalles de un romance prohibido entre dos Cainitas de la Segunda Ciudad y las diversas maneras en que mantuvieron su unión oculta al resto de la ciudad incluso bajo la mirada de los Antediluvianos. Es impresionante, incluso cuando las últimas piezas del fragmento detallan lo que sus Sires les hicieron una vez descubiertos."                  
 artifact_learning_shard_name: "Fragmento del Códice Sapiencial"                  
 artifact_learning_shard_description: "Un fragmento que contiene una tesis notablemente exhaustiva sobre los Caminos de la Moralidad más antiguos, los matices de la Humanidad, la Realeza y otras cuestiones teológicas cainitas. Más que los otros fragmentos, este parece escrito con mucha más pasión y cariño. Parece que Capadocio tuvo sus inclinaciones desde el principio."                  
 artifact_genesis_shard_name: "Fragmento del Códice Primordial"                  
 artifact_genesis_shard_description: "Un fragmento que parece imposiblemente antiguo y tiene atrapados los restos de una raíz de melocotonero; los acontecimientos que detalla son contradictorios y antiguos, pues se mueve entre un marasmo de atemporalidad y la creación del universo. Y lo más extraño de todo es que el fragmento parece palpitar de vida y, más extraño aún, de una sabiduría maravillosa y profana."                  
 artifact_caine_shard_name: "Fragmento del Códice del Padre Oscuro"                  
 artifact_caine_shard_description: "Un fragmento que detalla las observaciones del Señor de la Primera Ciudad y Padre Oscuro; fluctúa entre intentar comprender la mente interior del Primer Asesino y sus manías e inclinaciones al gobernar a sus hijos. Las Tradiciones están extrañamente ausentes y, sin embargo, mientras lees el fragmento, sientes que en algún lugar un par de ojos antiguos te observan."                  
 artifact_soul_shard_name: "Fragmento del Códice Animado"                  
 artifact_soul_shard_description: "Un fragmento que de algún modo tiene un aura propia; parece albergar destellos tanto del mundo de los muertos como de los lugares salvajes entre los valles. Da la sensación de que reflexiona sobre las cosas, pues los caracteres del fragmento parecen casi introspectivos."                  
 artifact_body_shard_name: "Fragmento del Códice Visceral"                  
 artifact_body_shard_description: "Un fragmento hecho de la más extraña de las arcillas; se siente poroso y blando, con una consistencia no muy distinta de la carne. En él se detallan complejos tratados de anatomía y fisiología cainita, así como horrorosas observaciones sobre las artes del Más Antiguo. Incluso para un vampiro Antiguo, el fragmento y lo que detalla resultan especialmente… repugnantes."                  
 artifact_seth_shard_name: "Fragmento del Códice de la Primera Presa"                  
 artifact_seth_shard_description: "Un fragmento que se lee como se leería la carta de un banquete; detalla los diversos linajes más tempranos del hermano menor del Primer Asesino y todas las sutilezas y matices de sus sabores. Pero advierte de los peligros de cada uno, mostrando cómo incluso en aquellas noches remotas de los Dioses de la Sangre, el Cazador también estaba allí."
 POD_need_demonic_tt: "Debes ser un Demonio, un Baali o un Cultista demoníaco (abierta o secretamente)."
 
 #fleshcrafter
  
 POD_fleshcraft_tome_bloodmagic_paths_display: "#medium Este libro contiene las siguientes [bs_traditions|E]:[AddTextIf(GetScriptedGui('contains_thaumaturgy_bloodmagic_sgui').IsShown(GuiScope.SetRoot(newly_created_artifact.MakeScope).End),'\n$TAB|q$@tremere_icon! Thaumaturgy')][AddTextIf(GetScriptedGui('contains_dur_an_ki_bloodmagic_sgui').IsShown(GuiScope.SetRoot(newly_created_artifact.MakeScope).End),'\n$TAB|q$@assamite_icon! Dur-An-Ki')][AddTextIf(GetScriptedGui('contains_akhu_bloodmagic_sgui').IsShown(GuiScope.SetRoot(newly_created_artifact.MakeScope).End),'\n$TAB|q$@setite_icon! Akhu')][AddTextIf(GetScriptedGui('contains_sadhana_bloodmagic_sgui').IsShown(GuiScope.SetRoot(newly_created_artifact.MakeScope).End),'\n$TAB|q$@ravnos_icon! Sadhana')][AddTextIf(GetScriptedGui('contains_koldunic_bloodmagic_sgui').IsShown(GuiScope.SetRoot(newly_created_artifact.MakeScope).End),'\n$TAB|q$@tzimisce_icon! Koldunic')][AddTextIf(GetScriptedGui('has_sihr_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@assamiteold_icon! Sihr')]#!\n\n[newly_created_artifact.GetDesc]"
 
 artifact_day_armor_name: "Armadura del Día"
 artifact_day_armor_description: "#bold Otorga resistencia a la luz del sol.#!\nUna serie de placas y escamas de acero entrelazadas y superpuestas de modo que no quede expuesto ningún trozo de piel, y una visera de ámbar para bloquear por completo los rayos funestos del sol.  El yelmo está estilizado como un gato, con colmillos felinos sobre la visera y un penacho rojo en la parte trasera del yelmo. Un gran espíritu mora en la armadura (supuestamente el gato Trjegul, uno de los gatos que tiraban del carro de Freyja), que concede a quienes poseen los dones de Adísa bendiciones similares a las de la Bestia Espíritu."
 iskender_saber_artifact_name: "Sable de Iskender"
 iskender_saber_artifact_description: "Aunque no tiene nada de mágico, esta arma finamente elaborada le recuerda a Zoe los terribles errores que cometió y el precio que tuvo que pagar para expiarlos."
 artifact_bygone_desc: "Los restos de una criatura fantástica destruida por la banalidad de este mundo."
 
 
 artifact_ki_chuan_name: "Ki Chuan"
 artifact_ki_chuan_description: "La escritura más venerada de los Vástagos de Oriente fue escrita por Ki, aprendiz del mismísimo gran Xue. Se ha considerado durante mucho tiempo el libro central sobre los orígenes del [Glossary('Dharma','podgloss.dharma')] ortodoxo y el viaje de Xue hacia la iluminación."
 
 artifact_red_book_of_the_iron_bridge_name: "Libro Rojo del Puente de Hierro"
 artifact_red_book_of_the_iron_bridge_description: "Escrito por el poeta loco conocido solo como O poco antes de su muerte, el Libro Rojo del Puente de Hierro es a la vez una de las obras más hermosas de la literatura kaja y un catálogo de los tormentos de Yomi. Captura con elocuencia la experiencia del Segundo Aliento.\nAunque no es directamente útil para el infernalismo, el Libro Rojo contiene la lista «canónica» de los [Glossary('Reyes Yama','podgloss.yamaking')], así como descripciones de literalmente miles de [UmbraGlossaryLocalized('yomi_wan','Infiernos de Yomi')]. Como obra literaria que casi todos los Wan Kuei versados en kaja leen y poseen, ha moldeado sus percepciones sociales de Yomi desde que fue escrita y es, por tanto, crucial en la formación de las actitudes que la mayoría de los Kuei-jin tienen hacia los Mil Infiernos."
 
 artifact_the_blood_sutras_name: "Los Sutras de Sangre"
 artifact_the_blood_sutras_description: "El primer libro de la filosofía de los Tigres Diablo, escrito por Campana de Plata con la aprobación tanto de Ki como de Xue. Se considera ampliamente la carta fundacional de cómo debe comportarse un Tigre Diablo para alcanzar la iluminación."
 
 artifact_the_midnight_jewel_name: "La Joya de Medianoche"
 artifact_the_midnight_jewel_description: "La Joya de Medianoche es un importante sutra dármico del que proviene el nombre de «Flor de Hueso». Compara el reino espiritual con una tela de araña reluciente y el mundo de los vivos con el rocío de sus hebras. Los seguidores del Canto de la Sombra deben saborear el rocío, arrancar las hebras y, de vez en cuando, alimentarse de moscas desprevenidas."
 
 artifact_the_hollow_reed_name: "El Junco Hueco"
 artifact_the_hollow_reed_description: "El texto central del Camino de los Mil Susurros fue escrito hace mucho por Hai Feng, un estudiante de Xue. La mayor parte del texto está escrita en forma de preguntas y acertijos. Famoso por su oscuridad, este texto ha frustrado a estudiantes durante milenios e incluso maestros respetados aún reflexionan sobre la sabiduría oculta tras algunas de sus páginas."
 
 artifact_book_of_the_ninth_immortal_name: "Libro del Noveno Inmortal"
 artifact_book_of_the_ninth_immortal_description: "El Libro del Noveno Inmortal es un libro fundacional para los $pod_kueijin$ taoístas. Afirma que los Inmortales taoístas se basan en el mito cathayano de los Ocho Wan Xian Más Augustos. Algunos de los Inmortales tienen paralelismos directos con los Wan Xian Augustos.\nPor ejemplo, Chung-li Ch'uan, el líder de los Inmortales taoístas, tiene muchas de las mismas características que Zu Xiong, el más poderoso y virtuoso de los Wan Xian Augustos."
 
 artifact_the_songs_of_hell_name: "Las Canciones del Infierno"
 artifact_the_songs_of_hell_description: "Esta es una colección anónima de versos inspiradores y devocionales que data de principios del periodo de los Cinco Emperadores y que forma parte del núcleo de la filosofía de los Tigres Diablo. Aunque abunda en la particular demonología práctica de los Tigres Diablo, Las Canciones del Infierno evita cuidadosamente mencionar cualquiera de los detalles técnicos del Comercio de Almas, el Pacto del Ébano y el Jade Escarlata u otros ritos que someten a los Kuei-jin a la voluntad de los [Glossary('Reyes Yama','podgloss.yamaking')]."
 
 artifact_manual_of_yi_name: "Manual de Yi"
 artifact_manual_of_yi_description: "Un texto de adiestramiento esencial de los cazadores de demonios shih que cayó en posesión de los $pod_kueijin$ durante el periodo de soberbia y declive de la Orden; se cree que el Manual de Yi existe ahora solo en las bibliotecas de los Wan Kuei. "
 
 artifact_the_three_books_name: "Los Tres Libros"
 artifact_the_three_books_description: "Este libro, que se remonta a la dinastía Shang, detalla la filosofía, los rituales y las cuestiones prácticas del uso del combate honorable entre $pod_kueijin$ para favorecer el propio ascenso. Aunque fue inmensamente popular en su publicación, se dice que solo han sobrevivido unas escasas copias del texto original."
 
 artifact_the_celestial_nail_name: "El Clavo Celestial"
 artifact_the_celestial_nail_description: "Aunque el prolífico autor O escribió unos cuantos libros polémicos, el Clavo Celestial fue el de legado más duradero. Como O afirma que la memoria de la divinidad misma reside en todo $pod_kueijin$, este libro ha propiciado el auge del [Glossary('Dharma','podgloss.dharma')] del Rostro de los Dioses en los círculos chinos, cuando antes se limitaba a la India."

 artifact_seven_scriptures_of_immortal_iniquity_name: "Siete Escrituras de la Iniquidad Inmortal"
 artifact_seven_scriptures_of_immortal_iniquity_description: "Casi con toda seguridad compuestas por un [Glossary('Rey Yama','podgloss.yamaking')], un [akuma|E] mayor o un poderoso Bane, las Siete Escrituras de la Iniquidad Inmortal son, en sus propias palabras: «...un intento de mostrar que la injusticia, al igual que la justicia, es su propia recompensa».\nEscritas obviamente como respuesta directa a los Siete Inmortales taoístas, las Siete Escrituras de la Iniquidad Inmortal retratan las vidas de siete de los más gloriosos servidores de los [Glossary('Reyes Yama','podgloss.yamaking')], conmemorando su infamia."

 artifact_the_righteous_fire_name: "El Fuego Justo"
 artifact_the_righteous_fire_description: "Quizá la obra dármica más antigua que aún se conserva completa, más antigua incluso que el Ki Chuan, el Fuego Justo es una meditación en 10 capítulos sobre el Discurso sobre la Iniquidad, hoy en su mayor parte perdido.\nMucho mejor conservado que su libro hermano, es una visión inestimable de las prácticas filosóficas previas al nacimiento del [Glossary('Dharma','podgloss.dharma')] Ortodoxo."
 
 artifact_delectations_of_the_flowers_of_blood_name: "Delicias de las Flores de Sangre"
 artifact_delectations_of_the_flowers_of_blood_description: "Escrito por la Tigre Diablo Princesa de las Siete Mañanas, este libro es, a primera vista, una pieza erótica muy bien escrita sobre un encuentro carnal entre dos $pod_kueijin$ (o entre el Hun y el P'o de un $pod_kueijin$).\nAl examinarlo más de cerca, el poema revela sus cualidades alegóricas, aparentemente la clave de un ritual mágico. Muchos han intentado descifrarlo con la esperanza de emular el ascenso sin precedentes de la Princesa de las Siete Mañanas en el [Glossary('Dharma','podgloss.dharma')]."

 artifact_lady_yukio_name: "Dama Yukio"
 artifact_lady_yukio_description: "Durante el turbulento periodo feudal de Japón, el gran herrero Misawa, de luto por la pérdida de su amada Yukio (violada y asesinada por un rōnin errante), volcó su empuje y su rabia en la forja de una katana maestra. Día y noche trabajó Misawa en el arma y, cuando por fin alzó la hoja terminada a la luz, supo que había creado la obra de su vida. Y así, halló un atisbo de sosiego al usar la hoja para decapitar al asesino de su amada y luego hundirse el arma ensangrentada en sus propias entrañas.\n\nMás tarde, un espíritu Yang, atraído por el poderoso yugen de la hoja, se vinculó a la espada. Percibiendo las poderosas impresiones psíquicas dejadas por la sangre de los muertos, el espíritu tomó el nombre y la forma de la Dama Yukio. Desde ese día, la Dama Yukio habita en la katana y presta ayuda a guerreros de noble porte y brazo hábil."
 
 artifact_star_shower_blade_name: "Hoja de la Lluvia de Estrellas"
 artifact_star_shower_blade_description: "Esta maravillosa arma aparece en muchos relatos de los [GetTrait('kueijin').GetName( GetNullCharacter )] de Japón. Sin embargo, solo se sabe de unos pocos héroes entre los Bishamon que posean una. La Hoja de la Lluvia de Estrellas tiene el aspecto de un arma de tres hojas; quien la usa la agarra por el centro y la hace girar contra sus víctimas.\nGastando un punto de Chi, el arma puede cargarse. Una vez cargada, puede lanzarse a un alcance de 25 yardas. Al ser lanzada, el arma se dirige automáticamente hacia su objetivo.\nComo alternativa, mientras el arma está en vuelo, quien la porta puede pronunciar una palabra de mando para dividirla en tres esquirlas afiladas. Cada una de ellas puede golpear por separado al mismo objetivo o a objetivos distintos. Lo mejor de todo es que, una vez lanzada (acierte o falle), el arma (o sus piezas) regresa como un bumerán a la mano de su portador y se recompone al instante en la Hoja de la Lluvia de Estrellas."
 
 artifact_golden_talons_name: "Garras Doradas"
 artifact_golden_talons_description: "Estas 10 púas de oro llevan caracteres kaja y encajan en la mayoría de los dedos. Al activarse, las púas se endurecen y se convierten en garras semejantes al diamante. Las garras son un arma formidable y reducen las dificultades de la escalada."
 
 artifact_emma_o_blade_name: "Hoja de Yin Puro de [Glossary('Emma-O','podgloss.emmao')]"
 artifact_emma_o_blade_description: "#bold Convierte el daño en [POD_aggravated_damage|E].#!\n\nEl arma principal de [Glossary('Emma-O','podgloss.emmao')] rara vez se ve, pues el principal [Glossary('Rey Yama','podgloss.yamaking')] apenas tiene necesidad de exhibiciones abiertas de poder. Una notable excepción fue durante su ataque contra su rival [Glossary('Rey Yama','podgloss.yamaking')] Yen-Lo, donde la hoja demostró su horrible potencia poniendo fin a la vida de Yen-Lo.\nComo el propio [Glossary('Kakuri','podgloss.kakuri')], esta hoja resuena con energías Yin, alimentándose del invierno sin fin del señorío de su amo."
 
 artifact_unirighteous_prayer_strips_name: "Tiras de Oración Impía"
 artifact_unirighteous_prayer_strips_description: "Tiras de papel cubiertas con una caligrafía de oraciones negras; estos papeles se lanzan en fajo contra los enemigos. Buscando a su objetivo y siguiéndolo, lo golpean como una cascada de carámbanos que caen."
 
 artifact_knives_of_subline_hunger_name: "Cuchillos del Ansia Sublime"
 artifact_knives_of_subline_hunger_description: "Creadas al vincular un espíritu de hambre brutal al recipiente de un cuchillo, estas armas son las favoritas de los Tigres Diablo Garras Negras. Están perversamente curvadas y el espíritu de su interior también azota con cada golpe, causando horribles heridas."

 artifact_fire_watch_charm_name: "Amuleto de Guardia contra el Fuego"
 artifact_fire_watch_charm_description: "#bold Te vuelve inmune a los métodos de asesinato relacionados con el sol.#!\nEste amuleto, colocado sobre un objeto o dentro de una sala (de no más de unos 25 por 25 pies), protege contra las llamas. Mientras el amuleto de guardia contra el fuego está en uso, los fuegos normales se niegan a prender aquí y los fuegos mágicos son menos eficaces. Este talismán solo funciona con objetos inanimados."
 
 artifact_harmony_charm_name: "Amuleto de Armonía"
 artifact_harmony_charm_description: "Mientras el vampiro permanezca en calma y no haga declaraciones ni acciones amenazadoras u ofensivas, todos los presentes deberán realizar un difícil esfuerzo de voluntad para actuar con agresividad hacia el vampiro."
 
 artifact_joss_charm_name: "Amuleto Joss"
 artifact_joss_charm_description: "El amuleto joss es un pequeño talismán de la suerte imbuido de magia, lo que le otorga capacidades reales (aunque pequeñas) para alterar el destino."
 
 artifact_wu_shi_name: "Wu Shi"
 artifact_wu_shi_description: "Un milagroso amuleto tallado a semejanza de una hermosa mujer (algunos dicen que representan a la doncella de la Reina Escarlata). Aunque se cree que llegaron a existir 33, solo quedan 9.\nSus poderes no se comprenden del todo, pero al parecer permiten un mejor control del chi interior de un $pod_kueijin$. Su sola importancia histórica los convierte en un tesoro muy codiciado."
 
 artifact_incense_of_inauspicious_attention_name: "Incienso de la Atención Aciaga"
 artifact_incense_of_inauspicious_attention_description: "Este incienso espiritualmente impuro contamina la atmósfera de un lugar durante un breve tiempo. Los Tigres Diablo lo usan para iniciar sus rituales de demonología en las mejores condiciones."
 
 artifact_demon_jade_talisman_name: "Talismán de Jade Demoníaco"
 artifact_demon_jade_talisman_description: "Un oscuro talismán de jade usado para almacenar Chi Demoníaco. Como requiere un material que solo se encuentra en los [UmbraGlossaryLocalized('yomi_wan','Infiernos de Yomi')], este tesoro es bastante raro y difícil de producir en masa."

 artifact_wayang_sash_name: "Fajín Wayang"
 artifact_wayang_sash_description: "Este fajín está tejido al estilo de las prendas indonesias. Al investir el fajín con dos puntos de Chi Yin, el vampiro puede hacer que la prenda cobre vida, asemejándose a una criatura sombría y dracónica del teatro de marionetas wayang.\nEsta criatura es sensible, puede comunicarse con su dueño (con un susurro sibilante) y resulta una espía excelente. Es absolutamente silenciosa y puede confundirse, como un camaleón, con cualquier sombra."
 
 artifact_iron_anoply_of_tou_mu_name: "Panoplia de Hierro de [Glossary('Tou Mu','podgloss.toumu')]"
 artifact_iron_anoply_of_tou_mu_description: "La infame panoplia de hierro de [Glossary('Tou Mu','podgloss.toumu')] hace mucho, muchísimo más que proteger a la Emperatriz de Hierro de los vientos abrasivos de su dominio. Con frecuencia muestra signos de sensibilidad y, en ocasiones, se mueve por voluntad propia para proteger a la Reina Yama de amenazas que ella no había percibido.\nProduce un formidable surtido de armamento a partir de su propia sustancia oscura, incluidas hojas giratorias, cadenas de hierro que terminan en garfios, shuriken, brocas y tentáculos metálicos. Algunos creen que es una entidad demoníaca independiente vinculada de algún modo a [Glossary('Tou Mu','podgloss.toumu')], mientras que otros han sugerido lo contrario. Fue un regalo, dicen algunos, de los Seres del Exterior.\n\nSea cual sea su naturaleza, la armadura cambia constantemente según los deseos de [Glossary('Tou Mu','podgloss.toumu')]. Cuando se reúne con Aquellos del Exterior, tiene un aspecto fibroso y orgánico; en cambio, si está en plena batalla, parece más tosca, como la obra más burda de un herrero primitivo."
 
 artifact_mandarin_mask_name: "Máscara de Mandarín"
 artifact_mandarin_mask_description: "Los mandarines [GetTrait('kueijin').GetName( GetPlayer )] usan esta máscara de jade sin rasgos para vigilar a sus rebaños. Al activarla, el [GetTrait('kueijin').GetName( GetNullCharacter )] puede designar un grupo concreto de mortales bajo cuyo aspecto desea disfrazarse.\nSi tiene éxito, quien la lleva parece un mortal bastante anodino del grupo deseado (empresario, mendigo, soldado, etc.). Durante su uso, el aura del vampiro parece la de un mortal; para detectar la verdadera naturaleza del [GetTrait('kueijin').GetName( GetNullCharacter )], un observador debe usar un poder adecuado (Vista de Chi, Percepción de Auras, etc.). La máscara no permite duplicar a un individuo concreto."

 artifact_taming_sari_name: "Taming Sari"
 artifact_taming_sari_description: "#bold Convierte el daño en [POD_aggravated_damage|E].#!\n\nSe dice que este kris malayo está tan hábilmente elaborado que quien lo empuñara era invencible. Según algunos rumores, el arma fue imbuida con un encantamiento que volvía físicamente invulnerable a su usuario. Se dice que varios guerreros legendarios usaron esta hoja en el pasado y que está hecha de 21 tipos distintos de metal."
 
 artifact_flowers_scarlet_ebon_name: "Flores de Escarlata y Ébano"
 artifact_flowers_scarlet_ebon_description: "Encontradas a su lado cuando regresó, amnésica, de los [UmbraGlossaryLocalized('yomi_wan','Infiernos de Yomi')], estas flores encierran un significado más profundo que Soo-kyung Ahn aún está descifrando."
 
 artifact_broken_winged_crane_name: "La Grulla de Ala Rota"
 artifact_broken_winged_crane_description: "La Grulla de Ala Rota es un libro tan oscuro que durante muchos siglos existió solo como rumor y profecía, como susurros pasados de la boca de un esbirro de [UmbraGlossaryLocalized('yomi_wan','Yomi')] a los oídos de otro, como una mancha en el tapiz de los sueños.\nPara un [akuma|E] aspirante con la fortaleza espiritual necesaria para dominar los versos que contiene, poseer una copia de La Grulla de Ala Rota es la llave de una iluminación impía tan grande que abre las vistas de la apoteosis negra y lo exalta entre los servidores de Yomi como fueron exaltados quienes leyeron sus palabras antes que él." 
 artifact_commentaries_ki_name: "Comentarios de Ki"
 artifact_commentaries_ki_description: "Guardado en la biblioteca de la Corte de Huesos, algunos dicen que este libro contiene las claves para desentrañar la verdadera comprensión del Ki Chuan. Sin embargo, para la mayoría es una lectura frustrante e increíblemente complicada de descifrar."  
 artifact_discourse_iniquity_name: "Discurso sobre la Iniquidad"
 artifact_discourse_iniquity_description: "El texto religioso formativo de los $pod_kueijin$ que sienta las bases de los Cinco [Glossary('Dharmas','podgloss.dharma')] Ortodoxos expuestos por el Gran [Glossary('Arhat','podgloss.arhat')] Xue.\nLamentablemente, la mayor parte del texto original se perdió y solo quedan unos escasos, aunque valiosos, consejos legados por los discípulos de Xue."
 artifact_book_ghosts_name: "El Libro de los Fantasmas"
 artifact_book_ghosts_description: "#bold Puede reclutar [GetMaA('wraiths').GetName] como [men_at_arms|E].#!\nUn índice usado por las Flores de Hueso para mantener a mano información sobre los wraiths con los que han tratado. Se espera que cada nigromante añada algo cuando se encuentra con un nuevo fantasma."
 artifact_heaven_scream_book_name: "El Libro del Grito del Cielo"
 artifact_heaven_scream_book_description: "El libro más peligroso y mejor custodiado de la biblioteca de las Flores de Hueso está escrito en una escritura profundamente inquietante e imprime imágenes perturbadoras en la mente de quien lo lee.\nAunque ha reducido a respetados Antiguos a poco más que bestias frenéticas, también se dice que en sus páginas reside el secreto para derrotar al [Glossary('Emperador Demonio','podgloss.demonemperor')]."
 artifact_phoenix_monkey_rat_name: "Fénix, Mono, Rata"
 artifact_phoenix_monkey_rat_description: "Un tratado filosófico escrito, al parecer, por el propio Gran [Glossary('Arhat','podgloss.arhat')] Xue. Habla de las relaciones entre los [Glossary('Dharmas','podgloss.dharma')].\nSi se autenticara por completo, sería el primer texto escrito por el propio Xue, ya que en vida fueron sus discípulos quienes plasmaron por escrito sus pensamientos y lecciones."
 artifact_laughing_buddha_mask_name: "Máscara del Buda Risueño"
 artifact_laughing_buddha_mask_description: "Este extraño artefacto de las Flores de Hueso parece desaparecer por completo al ponérselo en la cara. Mientras lo lleva puesto, quien lo porta se vuelve extraordinariamente agradable de tener cerca."
 artifact_black_metal_egg_name: "Huevo de Metal Negro"
 artifact_black_metal_egg_description: "Este huevo muy pulido permite a una Flor de Hueso gestionar su Chi con más eficacia. Es un artefacto de gran valor y algunos dicen que es el secreto del magistral autocontrol de los Ancestros de las Flores de Hueso."
 artifact_soul_ashes_name: "Cenizas de Alma"
 artifact_soul_ashes_description: "Un polvo negro y sedoso que las Flores de Hueso esparcen sobre sus enemigos. La víctima perderá la motivación para hacer nada, volviéndose más susceptible a las conjuras de la Flor de Hueso."
 artifact_ghost_shackles_name: "Grilletes de Fantasmas"
 artifact_ghost_shackles_description: "#bold Puede reclutar [GetMaA('spectres').GetName] como [men_at_arms|E].#!\nDos tobilleras de jade blanco sin conexión entre sí, con una pequeña llave de clavija de jade negro profusamente inscrita. Una vez incapacitado con ellas, un espectro será forzado al servicio de la Flor de Hueso para expiar su maldad."
 artifact_journey_thousand_steps_name: "El Viaje de los Mil Pasos"
 artifact_journey_thousand_steps_description: "Una serie de cartas escritas por Song Zhen, una [Glossary('Bodhisattva','podgloss.bodhisattva')] de los Mil Susurros, durante su búsqueda de la iluminación. Su forma de despojarse de su vida y reinventarse se ha vuelto sinónimo de los Mil Susurros a lo largo de las eras."
 artifact_wisdom_centipede_name: "Sabiduría del Ciempiés"
 artifact_wisdom_centipede_description: "El tercer texto clave de los Mil Susurros, la Sabiduría del Ciempiés fue escrita por un alumno del propio Gran [Glossary('Arhat','podgloss.arhat')] Xue. Enseña las experiencias de Xue como Mil Susurros y, aunque resulta muy confusa para los ajenos, los miembros del [Glossary('Dharma','podgloss.dharma')] la consideran un texto muy esclarecedor."
 artifact_pale_jade_mask_name: "La Máscara de Jade Pálido"
 artifact_pale_jade_mask_description: "#bold Desbloquea la interacción de personaje Máscara de las Mil Caras. #! \nUna exquisita máscara de jade verde pálido con los delicados rasgos de un hermoso rostro dormido. Quien la lleva puede adoptar la apariencia de un objetivo, aunque el disfraz puede ser descubierto por medios sobrenaturales."
 artifact_black_mirror_name: "El Espejo Negro"
 artifact_black_mirror_description: "#bold Puede reclutar [GetMaA('jagglings').GetName] como [men_at_arms|E].#!\nUn espejo de obsidiana finamente pulida con un marco de plata en forma de dragones enroscados. Sirve de puerta a los Mundos Espirituales y permite que las entidades espirituales entren con más facilidad en el mundo físico."
 artifact_wine_plenty_name: "Botella de Vino de la Abundancia"
 artifact_wine_plenty_description: "Creado al vincular un espíritu de vicio menor a una botella de vino, este recipiente nunca se queda sin alcohol, lo que lo convierte en el favorito de muchos Dragones Azotadores."
 artifact_prostitute_ointment_name: "Ungüento Limpiaprostitutas"
 artifact_prostitute_ointment_description: "Creado al vincular un espíritu de salud menor a un ungüento corriente, este ungüento impide que se propague cualquier enfermedad, por virulenta que sea o por íntimo que sea el contacto, incluido beber la sangre del objetivo."
 artifact_baton_mastery_name: "Bastón de Maestría"
 artifact_baton_mastery_description: "Creadas al vincular un espíritu tigre a un bastón, estas armas sumen en el pánico y la sumisión a quienes golpean, lo que dificulta aún más escapar de su dueño."
 artifact_great_jade_club_name: "Gran Maza de Jade"
 artifact_great_jade_club_description: "El arma del Chico de la Tierra Negra no tiene nada de especial. Pero golpear a alguien muy fuerte con ella suele bastar para hacer el trabajo."
 artifact_contemplations_demonic_name: "Contemplación de las Danzas Demoníacas"
 artifact_contemplations_demonic_description: "Escrito por el Poeta del Amanecer, este tomo trata de los efectos de las decisiones de los $pod_kueijin$ en las sucesivas dinastías chinas y coreanas."
 artifact_empty_throne_name: "Sobre el Trono Vacío"
 artifact_empty_throne_description: "El texto seminal de Gao Hueli sobre el liderazgo mediante medios indirectos; este libro es una lectura respetada para las Grullas Resplandecientes en su conjunto, pero sirve sobre todo como base de la iluminación para los seguidores de la sociedad de Gao Hueli."
 artifact_harp_songs_name: "Arpa de las Canciones Verdaderas"
 artifact_harp_songs_description: "Este instrumento es producto de un monasterio de las Grullas en la península de Shandong. Está pensado para apoyar los debates filosóficos con un toque de energía mística que ayude a que los argumentos de su dueño calen mejor."
 artifact_crown_rising_authority_name: "Corona de la Autoridad Ascendente"
 artifact_crown_rising_authority_description: "Creada por una Sociedad (de vida brevísima) que trató de emular a los [Glossary('Reyes Yama','podgloss.yamakings')], esta corona confiere a quien la porta una tez oscura y amenazadora, y las sombras del entorno de quien la lleva parecen moverse justo en el rabillo del ojo de un observador."
 artifact_emperor_sword_name: "La Espada del Emperador"
 artifact_emperor_sword_description: "El emperador Antoku murió cuando las fuerzas Minamoto hundieron su barco en fuga tras el asedio de Kioto. Su espada, aunque no tiene nada de mágica, es un poderoso estandarte de reunión y goza de prestigio por derecho propio.\nSe rumorea que sigue en el fondo del océano, arrojada a un señorío Yin o quizá recuperada por algún habitante de las profundidades."
 artifact_scrolls_zaolat_name: "Pergamino de Zao-Lat"
 artifact_scrolls_zaolat_description: "Una mezcla de chino antiguo y una escritura peculiar que habla de una conversación entre el Gran [Glossary('Arhat','podgloss.arhat')] Xue y su discípulo Zao-Lat, también conocido como Saulot, sobre la dificultad de este último para dominar la Lágrima del Dragón."
 artifact_dragon_night_name: "Tatsuko Sayo"
 artifact_dragon_night_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\n#bold Desbloquea una cadena de eventos única.#!\n#bold Otorga inmunidad a la mayoría de los poderes mentales.#!\nUna katana creada por el mayor forjador de espadas que Japón haya conocido. Hecha para matar dioses, «Dragón de la Noche» hizo precisamente eso hasta que su dueño fue derrotado y obligado a sellar su alma en el arma.\nAhora Tatsuko Sayo pasa de una alma desdichada a otra, concediéndoles un inmenso poder antes de doblegarlas a su voluntad y desecharlas cuando ya no sirven."
 artifact_general_opinion_penalty_1_modifier: "Opinión general"   
 artifact_brokk_17c_name: "Brokk 17c"
 artifact_brokk_17c_description: "Una pistola estándar de 9 mm con empuñadura y varilla guía de polímero (en lugar de metal) que la hace más ligera que otras pistolas. Se puede ver en uso en la mayoría de los cuerpos policiales."        
 artifact_katana_name: "Katana"          
 artifact_katana_description: "Una espada tradicional japonesa, ligera y ligeramente curvada, diseñada para ataques rápidos de tajo. Para los Vástagos, un espadachín competente es mucho más peligroso que un tirador certero."                       
 artifact_bush_hook_name: "Podadera"
 artifact_bush_hook_description: "Usada principalmente por los jardineros, cuando se emplea con fines distintos de su propósito original, los resultados suelen ser sangrientos."
 artifact_sledgehammer_name: "Mazo"
 artifact_sledgehammer_description: "Un martillo pesado usado supuestamente para la construcción. Genial para sacarle a alguien esa canción de la cabeza, y cualquier otra cosa que haya dentro."
 artifact_knife_name: "Cuchillo"
 artifact_knife_description: "Algunos cuchillos no se usan, en toda su existencia, con ningún propósito malicioso. Este no es uno de ellos."
 artifact_flamethrower_name: "Lanzallamas"
 artifact_flamethrower_description: "Los lanzallamas, de una forma u otra, se usan desde la antigüedad. Este propulsa combustible ardiendo en un arco de varios pies, chamuscando todo a su paso."
 artifact_revolver_38_name: "Revólver .38"
 artifact_revolver_38_description: "Es un arma corta barata y de pequeño calibre usada por aspirantes a matón en callejones de todo el país. También conocida como pistola de bolso."
 artifact_mclusky_calibre050_name: "McLusky Calibre 0,50"
 artifact_mclusky_calibre050_description: "Esta pesada arma fue diseñada originalmente como pistola deportiva para competiciones de tiro al blanco. Por el aspecto intimidante de este enorme calibre .50, se ha adoptado como favorita en el cine y la televisión como la Gran Pistola para todo. La Desert Eagle es una de las pocas armas cortas accionadas por gas jamás producidas y una de las pistolas más potentes y pesadas del mercado."
 artifact_jaegerspas_xv_name: "Jaegerspas XV"
 artifact_jaegerspas_xv_description: "La escopeta semiautomática SPAS-15 parece y dispara más como un fusil de asalto que como una escopeta tradicional. Lanza ráfagas de perdigones letales a un ritmo devastador. La SPAS-15 tiene tanto funcionamiento semiautomático como de acción de bombeo."
 artifact_utica_m37_name: "Utica M37"
 artifact_utica_m37_description: "La M37 del calibre 12 está diseñada para su uso en espacios cerrados como arma de defensa del hogar. Servicio probado y fiable para militares y fuerzas del orden, la M37 tiene todas las piezas de metal y un cargador y eyector inferiores para diestros y zurdos. Tiene un retroceso moderado y es bastante ligera para facilitar su manejo."
 artifact_steyr_aug_name: "Steyr Aug"
 artifact_steyr_aug_description: "Aunque el Steyr AUG AI fuera mediocre como arma, seguiría teniendo mucho a su favor estéticamente, pero este ligero fusil de asalto austriaco ha demostrado ser fiable y eficaz, lo que lo convierte en un arma popular en los ejércitos de todo el mundo. Lleva acoplada una mira de 4 aumentos para mejorar la precisión."
 artifact_braddock_9mm_name: "Braddock 9 mm"
 artifact_braddock_9mm_description: "Una pequeña y ligera pistola ametralladora que dispara un cartucho de pistola de 9 mm, no hecha tanto para la precisión como para lanzar la mayor cantidad de munición en el menor tiempo posible."
 artifact_lassiter_killmatic_name: "Lassiter Killmatic"
 artifact_lassiter_killmatic_description: "El Uzi fue desarrollado para ser un arma fiable y compacta, lo bastante robusta para soportar mucho castigo y lo bastante precisa para repartirlo con rapidez. El diseño ergonómico del Uzi fue uno de los primeros en incorporar un cerrojo envolvente y acción por retroceso y en alojar el cargador dentro de la empuñadura para recargas rápidas y sencillas."
 
 artifact_crown_lanka_name: "Corona de Lanka"
 artifact_crown_lanka_description: "Ravana estuvo una vez muy cerca del trono del [Glossary('Emperador Demonio','podgloss.demonemperor')]. Arrogante como siempre, hizo crear esta corona usando las mismas energías de la entonces bulliciosa Lanka.\nTras ser humillado por Hanuman, Ravana dejó a un lado esta corona, prometiendo volver a ponérsela solo el día de su triunfo final."
 artifact_rangda_loincloth_name: "Taparrabos de Rangda"
 artifact_rangda_loincloth_description: "La única prenda que Rangda ha llevado jamás. Esta vestidura andrajosa e inmunda ha sido investida a lo largo de los milenios con la esencia misma de la [Glossary('Reina Yama','podgloss.yamaking')]."
 artifact_dokhor_seal_name: "Sello Imperial de Dokhor-khan"
 artifact_dokhor_seal_description: "Anticipando su aparentemente inevitable ascenso al trono del [Glossary('Emperador Demonio','podgloss.demonemperor')] tras la Horda Mongola, [Glossary('Dokhor-khan','podgloss.dokhorkhan')] mandó fabricar este sello a la espera de sus primeros decretos como nuevo amo de la Creación."
 
 artifact_robe_golden_mandarin_name: "Túnicas del Mandarín Dorado"
 artifact_robe_golden_mandarin_description: "#bold Desbloquea una decisión para eliminar la maldición de este artefacto.#!\nEstas túnicas fueron creadas por Gan Lau Kien, uno de los magos más poderosos que jamás hayan vivido en China. Se dice que dominaba cien hechizos y mil espíritus; Gan hizo estas túnicas enteramente de pan de oro para que brillaran como el mismísimo sol. Son mágicamente tan flexibles como la seda y, sin embargo, mucho más resistentes que la mejor armadura.\n\nSin embargo, Gan colocó un hechizo protector sobre estas túnicas que las vuelve funcionalmente inútiles y de hecho estorba a cualquiera que las lleve salvo a él."
 robe_golden_mandarin_modifier: "Túnicas del Mandarín Dorado"
 
 artifact_talons_of_the_plague_crow_name: "Garras del Cuervo de la Plaga" 
 artifact_talons_of_the_plague_crow_description: "Un Infernalista puede, a voluntad, alargar sus manos hasta convertirlas en garras de ave, lo que dificulta mucho cualquier acción no combativa, pero constituye un arma infernal de destrucción masiva." 
 
 artifact_black_gloves_name: "Guantes Negros"
 artifact_black_gloves_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\nEste par de guantes de mujer está hecho de terciopelo negro. Los guantes permiten a quien los lleva extender garras de metal negro desde las yemas de los dedos. Las garras son capaces de causar daño agravado y se cree que estuvieron unidas en su día a un Gangrel."
 artifact_concoction_vitality_name: "Brebaje de Vitalidad"
 artifact_concoction_vitality_description: "Esta poción mágica permite a un vampiro volver a ser humano, pero solo durante 24 horas. Así, el vampiro puede salir a la luz del día, comer, respirar y hacer todas las demás cosas que puede hacer un humano. Sin embargo, el vampiro también es tan vulnerable al daño como cualquier otro humano, y todas las Disciplinas se pierden temporalmente. La poción tarda de cuatro a seis horas en hacer pleno efecto. Mientras es mortal, el personaje envejecerá como si nunca hubiera muerto."
 artifact_giants_blood_name: "Sangre de Gigante"
 artifact_giants_blood_description: "Es exactamente lo que dice: sangre de gigante. En los días antiguos, cuando los gigantes caminaban por la tierra, solo los vampiros temerarios cazaban a estas repugnantes criaturas. Algunos vampiros, sin embargo, lo hicieron, y se aseguraron de embotellar el resto de la preciada sangre que no podían consumir de inmediato.\nLa sangre aumenta drásticamente la puntuación de Potencia de un vampiro, al menos temporalmente y posiblemente de forma permanente."
 artifact_hand_conrad_name: "Mano de Conrad"
 artifact_hand_conrad_description: "Esta reliquia sobrenatural es la mano cortada de un poderoso Brujah. La mano parece momificada, pero si se acerca a la muñeca de un vampiro, se adherirá a ella y cobrará vida. Por supuesto, la vampira que desee usar la mano debe antes cortarse la suya para ofrecer un muñón a la mano de Conrad.\nSe supone que la mano concede a quien la posee una Potencia aumentada.\nTambién se rumorea que la mano tiene el poder de resucitar a los muertos, pero muchos creen que se trata de pura especulación."
 artifact_ivory_bow_name: "Arco de Marfil"
 artifact_ivory_bow_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E] contra $POD_splat_vampire_plural$ y $POD_splat_werewolf_plural$.#!\n\nEste es un arco mágico hecho de fresno y marfil. Toda flecha disparada con el arco causa heridas agravadas a los Lupinos y a los vampiros."
 artifact_martinelli_ring_name: "Anillo del Pensamiento Claro de Martinelli"
 artifact_martinelli_ring_description: "Este anillo de oro fue regalado a una Malkavian por su Ghoul. Llevar el anillo elimina todos los miedos, fobias, desequilibrios y defectos mentales que pueda tener quien lo lleva.\nAl quitárselo, regresan el doble de fuertes, y quien lo llevaba se obsesiona con recuperarlo."
 artifact_phylactery_memory_name: "Filacteria de la Memoria Registrada"
 artifact_phylactery_memory_description: "Un antiguo Druida celta creó este amuleto. Parece una pieza lisa de granito sujeta con dos bandas de oro y permite a quien lo lleva evocar los recuerdos de cualquier dueño anterior del amuleto. El amuleto puede ayudar en habilidades, idiomas y muchos otros ámbitos. El amuleto también ralentiza el envejecimiento de cualquier mortal que lo lleve."
 artifact_pumping_heart_name: "Corazón Palpitante de Nizchetus"
 artifact_pumping_heart_description: "Se dice que este corazón está sellado en un tarro de cristal verde. El corazón perteneció a un poderoso Toreador y algunos dicen que aún late, ya sea por su propia magia o por la magia contenida en el tarro y sus fluidos. Se cree que el corazón trae buena suerte si se guarda sobre la repisa de la chimenea del refugio de su dueño."
 artifact_golden_throne_neferu_name: "Trono Dorado de Neferu"
 artifact_golden_throne_neferu_description: "Unas escaleras conducen desde esta tarima hasta una cobra de piedra enroscada que extiende su capucha sobre un trono dorado. Aunque no es mágico en sí, el asiento de poder de Neferu en la Corte del Fuego sigue considerándose uno de los más impresionantes del mundo cainita."
 artifact_sevenfold_gathering_name: "Reunión Séptuple"
 artifact_sevenfold_gathering_description: "El libro que impulsó a los Semidioses en su rumbo mesiánico; la Reunión Séptuple tiene un carácter muy milenarista. La Tribu Celestial se asegurará un lugar en el Cielo y obligará a los Dioses a reconocer el sufrimiento de su Madre y a enderezar el mundo.\nEsta actitud de «escalar hacia el Cielo» se convirtió en un principio fundacional del Dharma."
 artifact_practice_divinity_name: "La Práctica de la Divinidad"
 artifact_practice_divinity_description: "Escrita por Shiva-Ohm, la Práctica cuenta la historia de un joven renacido ignorante que trata de alcanzar la divinidad. Un libro muy pragmático sobre cómo lograr convertirse en un dios, ha sido superado por la Reunión Séptuple en la búsqueda de las verdaderas razones para convertirse en un dios."
 artifact_seal_veddartha_name: "Sello de Veddartha"
 artifact_seal_veddartha_description: "#bold Mientras se lleva equipado el Sello como vampiro, los Ghouls recién creados empezarán con más poderes de Disciplina y aprenderán sumerio.\nMientras lo lleva equipado un Ghoul, la probabilidad de perder Vitae de forma pasiva se reduce en un 20 %.#! \n\nFirmado por el antediluviano Ventrue y tocado por su propia Vitae, este sello convierte la sangre humana en Vitae y se la pasa a su portador, que se convierte en Ghoul. El portador también lee y habla sumerio y obtiene Disciplinas mejoradas cada año, hasta un límite."
 seal_veddartha_tt: "Mientras se lleva equipado el Sello de Veddartha como vampiro, los Ghouls recién creados empezarán con más poderes de Disciplina y aprenderán sumerio.\nMientras lo lleva equipado un Ghoul, la probabilidad de perder Vitae de forma pasiva se reduce en un 20 %."
 artifact_analects_saulot_name: "Analectas de Saulot"
 artifact_analects_saulot_description: " «Todas las direcciones conducen al valle de las sombras, pero solo un camino lleva a la Golconda. Maestro, por favor, muéstrame dónde comienza ese camino».\nEl maestro trazó una línea en el suelo con su bastón. «Aquí». "
 artifact_journal_rothriel_name: "Diario de Rothriel"
 artifact_journal_rothriel_description: "El diario de viaje del respetado Salubri Guerrero convertido en Buscador de la Golconda. El relato de Rothriel es sorprendentemente detallado, a pesar de centrarse en enseñanzas filosóficas."
 artifact_gift_fallen_name: "Don de los Caídos"
 artifact_gift_fallen_description: "Hallado en las ruinas de lo que fue una capilla-biblioteca, este cráneo perteneció al parecer a un maestro mago que murió durante el ataque. Permanece inexplicablemente intacto y ofrece crípticas advertencias sobre la perdición por venir."
 artifact_bell_warning_name: "Campanas de Advertencia"
 artifact_bell_warning_description: "El fetiche se activa cuando cualquier criatura más grande que un zorro, y que no estuviera presente durante la activación, cruza el área triangular definida por las tres campanas más pequeñas.\nSe envía una imagen mental de la criatura al personaje que activó el fetiche y la campana dorada suena con la fuerza suficiente para despertar a cualquiera a menos de 15 pies."
  
  
 
