 POD_artifact_source_title: "#N;bold;glow_color:{0,0,0,1} El artefacto aún no existe#!"
 POD_artifact_source_book_of_nod: "$POD_artifact_source_title$\nPuede ensamblarse a partir de sus #TOOLTIP:POD_artifact_source_book_of_nod_tt #L Capítulos#!#! con una [decision|E]"
 POD_artifact_source_book_of_nod_tt: "#T Capítulos del Libro de Nod#!\nSi tienes al menos un capítulo, la [GetDecision('POD_book_of_nod_decision').GetName] [decision|E] se vuelve visible.\nUna vez que tengas una copia de cada capítulo, podrás ensamblar el [GetPODArtifactName('book_of_nod_link')] completo.\n\n[GetScriptedGui('POD_list_all_book_of_nod_fragments').BuildTooltip(GuiScope.End)]"
 POD_artifact_source_baizetu: "$POD_artifact_source_title$\nPuede ensamblarse a partir de sus #TOOLTIP:POD_artifact_source_baizetu #L Fragmentos#!#! con una [decision|E]"
 POD_artifact_source_baizetu_tt: "#T Fragmentos del Bai Ze Tu#!\nSi tienes al menos un fragmento, la [GetDecision('baizetu_decision').GetName] [decision|E] se vuelve visible.\nUna vez que tengas #V 5#! fragmentos, podrás ensamblar el [GetPODArtifactName('baizetu_link')] completo.\n\n[GetScriptedGui('POD_list_all_baizetu_fragments').BuildTooltip(GuiScope.End)]"
 POD_artifact_source_incunabulum_kupalam: "$POD_artifact_source_title$\nPuede ensamblarse a partir de los #TOOLTIP:POD_artifact_source_incunabulum_kupalam #L Tratados sobre Kupala#!#! con una [decision|E]"
 POD_artifact_source_incunabulum_kupalam_tt: "#T Tratados sobre Kupala#!\nSi tienes al menos un tratado, la [GetDecision('incunabulum_kupalam_decision').GetName] [decision|E] se vuelve visible.\nUna vez que tengas #V 5#! tratados, podrás ensamblar el [GetPODArtifactName('incunabulum_kupalam_link')] completo.\n\n[GetScriptedGui('POD_list_all_incunabulum_kupalam_fragments').BuildTooltip(GuiScope.End)]"
 POD_artifact_source_caliburn: "$POD_artifact_source_title$\nLos personajes virtuosos pueden encontrarlo en algún lugar profundo del [UmbraGlossary('dreaming')] en el [umbra|E]"
 POD_artifact_source_incarna: "$POD_artifact_source_title$\nLos $glossary_fera$ de una fe gaiana pueden obtener este artefacto al comulgar con un Espíritu Incarna en algún lugar profundo de [UmbraGlossary('spirit_wilds')], en el [umbra|E]"
 POD_artifact_source_sargon_codex_shard: "$POD_artifact_source_title$\n#TOOLTIP:GAME_TRAIT,cappadocian,[GetNullCharacter] #L Los Capadocios#!#! pueden buscar los fragmentos mediante un [journey|E]"

 ############################
 # Non-procedural artifacts #
 ############################

 artifact_sword_of_nul_name: "Espada de Nul"
 artifact_sword_of_nul_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\n#bold Desbloquea una cadena de eventos única.#!\nParece bastante inocente. Una espada corta y recta hecha de bronce. Toda el arma tiene un ligero tono verdoso por la antigüedad. Sigue estando afilada, extremadamente afilada; más que el mejor acero.\nSu historia es de sangre y de dueños que encuentran su inesperado fin. La Espada de Nul se reunirá con su verdadero dueño, pase lo que pase."
 artifact_tablet_of_destiny_name: "Tabla del Destino"
 artifact_tablet_of_destiny_description: "#bold Desbloquea una [decision|E] única.#!\nSegún el Enûma Elish, la Tabla del Destino eran las leyes para la humanidad, establecidas por el propio Enoc. Lo que contenían realmente aquellas tablillas de arcilla es objeto de mucha especulación. La teoría más aceptada es que era una crónica de poderes de sangre, que explicaba toda la magia de Enoc. En cualquier caso, se dice que Ishtar intentó arrebatarle este objeto a Ennoia, lo que provocó una amarga disputa entre los dos [Glossary('Antediluvianos','game_concept_antediluvian_desc')], casi provocando la destrucción de los Toreador en dos ocasiones."
 artifact_eye_of_hazimel_name: "Ojo de Hazimel"
 artifact_eye_of_hazimel_description: "#bold Desbloquea una [decision|E] única.#!\nLos relatos que rodean a esta reliquia hablan de locura, sangre y desesperación. Por lo visto, la última pieza activa de un poderoso Matusalén Ravnos, el Ojo de Hazimel puede otorgar poderes increíbles a su portador a un coste enorme. Reemplazar tu ojo con él es solo la primera, y más fácil, cosa que tendrás que hacer para aprender sus secretos..."
 artifact_ankaran_sarcophagus_name: "Sarcófago de Ankaran"
 artifact_ankaran_sarcophagus_description: "#bold Desbloquea una [decision|E] única.#!\nNo lo abras."
 artifact_kristrbani_name: "Kristrbani"
 artifact_kristrbani_description: "Christslayer es el arma predilecta de la reina Valborg. Un martillo masivo, demasiado pesado para manos mortales, ha sido empapado en sangre una y otra vez. Algo que su despiadado [Glossary('Einherjar','game_concept_einherjar_desc')] dueño está ansioso por continuar."
 artifact_euagetaematikon_name: "Euagetaematikon"
 artifact_euagetaematikon_description: "El libro de la Sangre Brillante es la Biblia de la Iglesia de Caín. Escrito por un monje loco en Constantinopla, este texto apenas coherente proclama el destino de la raza Cainita de caminar junto al último Mesías y gobernar el mundo en una orgía de sangre interminable."
 artifact_ainkurn_name: "Ainkurn"
 artifact_ainkurn_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\nTales atribuyen a la espada Ainkurn la destrucción de Matusalenes, victorias en solitario sobre Lupinos voraces e incluso viajes a los reinos de los muertos. Ya sea por fantasía o realidad, esta poderosa espada fue creada por Durga Syn como el modelo para un arma aún más poderosa que será necesaria en los turbulentos tiempos venideros. Fue utilizada famosamente por Christof Romuald durante su matanza de vampiros en Praga, demostrando claramente su eficacia."
 artifact_lamp_of_constantine_name: "Lámpara de Constantino"
 artifact_lamp_of_constantine_description: "#bold Permite el uso de Penitencia incluso sin [Glossary('Fe Verdadera','game_concept_true_faith_desc')].#!\nSupuestamente, Jesús concedió a Constantino el Grande un fragmento del propio sol como recompensa por su conversión. Constantino colocó esta reliquia sagrada en una lámpara que lleva las letras griegas entrelazadas «Chi» y «Rho» en memoria de su visión y en honor a Cristo. Se dice que la Lámpara posee el poder de destruir demonios y otras criaturas de la noche con su luz sagrada."
 artifact_magic_lantern_name: "Linterna Mágica"
 artifact_magic_lantern_description: "Una urna de arcilla grande pero sencilla; esta linterna perteneció una vez a Lázaro antes de perderse por la intriga de la Corte del Fuego. Una vez expuesta a la luz, revela patrones extraños y acertijos intrigantes."
 artifact_japhet_cloak_name: "Capa de Jafet"
 artifact_japhet_cloak_description: "Una capa extraña y translúcida que protege contra los wraiths. El propio Jafet apenas la necesita, pero responde discretamente que el tiempo de esta reliquia llegará muy pronto."
 artifact_scarlet_rose_name: "La Rosa Escarlata de Alejandro"
 artifact_scarlet_rose_description: "Cuando Lorraine, su amada, le traicionó, Alejandro la secuestró y drenó lentamente su sangre en esta flor. Cuando ella finalmente sucumbió, Lorraine le perdonó, y el Matusalén cayó en la locura. Esta rosa sangrienta ahora ansía aún más sangre de vampiro y es un recordatorio constante del fracaso de Alejandro."
 artifact_infernal_tome_name: "Tomo Infernal"
 artifact_infernal_tome_description: "Uno de los seis tomos infernales utilizados por los demonios para atraer a mortales débiles y Cainitas a adorarlos. Contiene poca información útil y ningún «[Glossary('Nombre Verdadero','podgloss.truename')]», ya que es principalmente una herramienta de los propios demonios."
 artifact_flagrum_passion_name: "Flagelo de la Pasión"
 artifact_flagrum_passion_description: "#bold Convierte el daño en [POD_aggravated_damage|E] al golpear vampiros o demonios.#!\n\n#bold Desbloquea la capacidad de [POD_banish|E] Demonios y resolver cada [Fetter|E] de un Wraith.#!\nEl arma que atravesó la carne de Cristo una y otra vez durante la Pasión. La reliquia ha sido algo corrompida por el uso de Eleazar, mezclando su sangre con la de Cristo, pero sigue siendo un poderoso faro de fe."
 artifact_night_lantern_name: "Linterna del Padre de la Noche"
 artifact_night_lantern_description: "#bold Otorga Ofuscación.#! Creada por un Matusalén Nosferatu, esta linterna permite el uso de poderes similares a la disciplina de Ofuscación $pod_discipline$. También se rumorea que contiene secretos más siniestros, pero hasta ahora nadie ha podido confirmarlo."
 artifact_corona_ferrata_name: "Corona Ferrata"
 artifact_corona_ferrata_description: "#bold Otorga inmunidad a los Conjuras de Asesinato si tienes [Glossary('Fe Verdadera','game_concept_true_faith_desc')].#!\nUna reliquia de San Ferreol y San Ferjeux; esta poderosa corona tiene un efecto calmante en los verdaderos creyentes y un efecto mucho más letal en los incrédulos. Su dueño es herido por ella una vez al día, haciendo que la sangre sagrada brote desde su frente hasta su barbilla en una inquietante exhibición de autoflagelación."
 artifact_caecus_rose_name: "Rosa de Caecus"
 artifact_caecus_rose_description: "Creada por el hábil jardinero Caecus para la hermosa Helena, esta rosa puede escuchar cualquier conversación cercana, imitando un sutil poder de la disciplina Auspex $pod_discipline$."
 artifact_makeda_crown_name: "Corona de Makeda"
 artifact_makeda_crown_description: "La corona de oro de la gran reina de Saba tiene el poder de repeler a los vampiros que han caído en la adoración de los demonios. Regalada a Helena por el príncipe de Reims, Nicodemo, ella ha optado por llevarla solo en privado, por respeto a la difunta reina."
 artifact_goratrix_mirror_name: "Espejo de Goratrix"
 artifact_goratrix_mirror_description: "Un espejo encantado por Goratrix para ir de un lugar a otro con facilidad. Permite a su usuario reducir seriamente los tiempos de viaje si el espejo se prepara de antemano."
 artifact_shemaziel_sarcophagus_name: "Sarcófago de Shemiazel"
 artifact_shemaziel_sarcophagus_description: "#bold Desbloquea una [decision|E] única.#!\nUn pesado sarcófago hecho de una roca negra desconocida; este espantoso objeto está protegido por fuertes cadenas. Tienes la impresión de que, realmente, no deberías abrirlo."
 artifact_codex_mortis_name: "Codex Mortis"
 artifact_codex_mortis_description: "#bold Desbloquea una decisión que podría otorgarte Necromancia de los Giovanni.#!\nEste Códice contiene muchos rituales necrománticos... y el alma maldita de Titia Sabina, una wraith. Su marido, Aurelius Flavius Iovanus, se convirtió voluntariamente en vampiro para proteger el libro, y su alma, de cualquiera que pudiera hacerles daño."
 artifact_slay_death_name: "Matar a la Muerte"
 artifact_slay_death_description: "Esta hacha gigantesca es el arma predilecta de Petrus, el verdugo del Príncipe Colombe. También es su único y verdadero amor."
 artifact_michaelis_rosary_name: "Rosario de Michaelis"
 artifact_michaelis_rosary_description: "106 perlas de marfil que contienen los recuerdos de Michaelis, un poderoso Matusalén del clan Toreador. El único recuerdo que aún no se ha empañado es el de su Abrazo a Esclarmonde, su querida Chiquilla."
 artifact_abraxas_sarcophagus_name: "Sarcófago de Abraxas"
 artifact_abraxas_sarcophagus_description: "Hecho de oro y gemas preciosas, este sarcófago es el lugar de descanso de Basilide, un olvidado hombre santo de los inicios del cristianismo. Su teoría y examen de la Liturgia son muy interesantes para cualquier aspirante a teólogo."
 artifact_ermentrude_cross_name: "Cruz de Santa Ermentrude"
 artifact_ermentrude_cross_description: "Esta mártir bretona dejó una cruz, ahora montada como collar, que puede repeler a cualquier lobo. También resuena con la [Glossary('Fe Verdadera','game_concept_true_faith_desc')]."
 artifact_odin_stone_name: "Piedra rúnica de Odín"
 artifact_odin_stone_description: "La piedra donde un Odín agonizante talló las primeras runas. También contiene el espíritu de tres volvas, que custodiaban la reliquia antes de ser masacradas por un señor de la guerra vikingo."
 artifact_holy_flask_name: "Flacón sagrado"
 artifact_holy_flask_description: "San Remigio usó este flacón para ungir con aceite a Clodoveo I, primer rey de los francos, durante su coronación. Desde entonces, su contenido sagrado parece regenerarse siempre."
 artifact_uraeus_osiris_name: "Uraeus de Osiris"
 artifact_uraeus_osiris_description: "Esta estatuilla de una serpiente dorada estaba en el nemes (la corona) del propio Osiris. Tiene el poder de abrir una puerta al Amenti, uno de los reinos egipcios de los muertos. Fue robada por Goratrix después de que Horus asaltara el templo Setita de Marsella donde se encontraba."
 artifact_ayr_sword_name: "Espada de Ayr"
 artifact_ayr_sword_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\nUna de las espadas creadas por el legendario herrero Ayr l'Enclume. Hecha a medida para su dueño, casi indestructible y encantada con poderosas magias."
 artifact_ayr_sword_convoquee_name: "Espada de Ayr: Convoquée"
 artifact_ayr_sword_convoquee_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\nUna de las siete espadas con nombre creadas por el legendario herrero Ayr l'Enclume. Hecha a medida para su dueño, casi indestructible y encantada con poderosas magias.\nConvoquée tiene la propiedad especial de teletransportarse a la mano de su dueño cuando este la reclama."
 artifact_ayr_sword_chanceuse_name: "Espada de Ayr: Chanceuse"
 artifact_ayr_sword_chanceuse_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\nUna de las siete espadas con nombre creadas por el legendario herrero Ayr l'Enclume. Hecha a medida para su dueño, casi indestructible y encantada con poderosas magias.\nLa propiedad especial de Chanceuse es la extraña suerte que proporciona a su dueño."
 artifact_ayr_sword_immaterielle_name: "Espada de Ayr: Immatérielle"
 artifact_ayr_sword_immaterielle_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\nUna de las siete espadas con nombre creadas por el legendario herrero Ayr l'Enclume. Hecha a medida para su dueño, casi indestructible y encantada con poderosas magias.\nImmatérielle tiene la propiedad única de ser capaz de herir incluso a seres incorpóreos."
 artifact_ayr_sword_mordante_name: "Espada de Ayr: Mordante"
 artifact_ayr_sword_mordante_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\nUna de las siete espadas con nombre creadas por el legendario herrero Ayr l'Enclume. Hecha a medida para su dueño, casi indestructible y encantada con poderosas magias.\nMordante ha sido encantada para robar sangre de cualquier Cainita que golpee, convirtiéndola en un arma especialmente temida entre los soberanos de la noche."
 artifact_ayr_sword_vivace_name: "Espada de Ayr: Vivace"
 artifact_ayr_sword_vivace_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\nUna de las siete espadas con nombre creadas por el legendario herrero Ayr l'Enclume. Hecha a medida para su dueño, casi indestructible y encantada con poderosas magias.\nVivace es especialmente ligera y fácil de usar, incluso para ser un arma creada por Ayr. Es como si el arma misma estuviera usando los poderes de la Celeridad."
 artifact_ayr_sword_faucheuse_name: "Espada de Ayr: Faucheuse"
 artifact_ayr_sword_faucheuse_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\nUna de las siete espadas con nombre creadas por el legendario herrero Ayr l'Enclume. Hecha a medida para su dueño, casi indestructible y encantada con poderosas magias.\nEsta arma, por algún medio que solo Ayr conocía, puede ignorar armaduras no mágicas al golpear."
 artifact_ayr_sword_clepsydre_name: "Espada de Ayr: Clepsydre"
 artifact_ayr_sword_clepsydre_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\nUna de las siete espadas con nombre creadas por el legendario herrero Ayr l'Enclume. Hecha a medida para su dueño, casi indestructible y encantada con poderosas magias.\nClepsydre está imbuida con una chispa de Temporis, permitiendo que su dueño tenga una percepción perfecta del tiempo."

 artifact_ayr_armor_name: "Armadura de Ayr"
 artifact_ayr_armor_description: "Una de las cinco armaduras creadas por el legendario herrero Ayr l'Enclume. Hecha a medida para su dueño, casi indestructible y encantada con poderosas magias."
 artifact_sofia_finger_name: "Hueso del dedo de Sofia"
 artifact_sofia_finger_description: "En el fondo, Sofia siempre supo la verdad sobre los males de la noche. Siendo el objetivo de un vampiro en conflicto, estaba preparada cuando él llegó y se sacrificó para detenerlo. Su reliquia te otorga conocimiento sobre las debilidades de los malvados que te rodean."
 artifact_water_meriba_name: "Agua de Meriba"
 artifact_water_meriba_description: "#bold Es menos probable que aumente tu Ansia.#!\nEl agua de Meriba proporcionó la salvación a los hebreos sedientos que salían de Egipto, pero la condenación para el propio Moisés. La soberbia de Moisés corrompió el milagro de Meriba a ojos de la iglesia mortal, pero aún existe un próspero comercio por ella entre los Cainitas. Después de todo, Moisés es similar a Caín, maldito por Dios para no encontrar nunca el camino a casa."
 artifact_hand_nikolas_name: "Mano de Nikolas"
 artifact_hand_nikolas_description: "#bold Nunca volverás a entrar en Frenesí.#!\nUn Nosferatu santo y pacífico, Nikolas tenía un pequeño culto a su nombre antes de ser asesinado por un fanático excesivo. Sin embargo, su mano aún no se ha desintegrado en cenizas y posee la extraña capacidad de calmar incluso a la más furiosa Bestia."
 artifact_caul_jos_name: "Cáliz de Jos"
 artifact_caul_jos_description: "Jos nació con una membrana amniótica, señal de que tendría suerte en la vida. Su madre secó con cuidado la piel y la cosió en una bolsita para que Jos la llevara consigo. Y, en efecto, Jos tuvo una fortuna poco común. Pese a ser torpe y perezoso, tenía un buen oficio, amantes y amigos a montones, y las penurias pasaban de largo ante él. Hasta un vampiro que lo atacó falló milagrosamente el golpe. Jos empuñó entonces las armas y, en lugar de huir, devolvió el golpe al enemigo, confiado en su suerte. Pero todo tiene un límite..."
 artifact_labrys_name: "Labrys baali"
 artifact_labrys_description: "El símbolo del Laberinto. El símbolo de la cabeza astada de Ba'al. El símbolo del verdugo sobre la víctima, del lobo sobre la oveja. El símbolo del mal."
 artifact_guarded_rubrics_name: "Rúbricas custodiadas"
 artifact_guarded_rubrics_description: "El liche Inauhaten entregó este libro a los primeros miembros de los Tal'mahe'Ra. Contiene fragmentos del Libro de Nod y la esencia destilada de milenios de praxis nigromántica. También moldeó las creencias de la naciente secta como custodios del Apocalipsis."
 artifact_jurgen_broadsword_name: "Espada ancha de Jürgen"
 artifact_jurgen_broadsword_description: "Una reluciente espada ancha con incrustaciones de gemas preciosas y cubierta de blasones ornamentales. Se la ofrecieron a Jürgen las Cortes del Amor en prenda de amistad."
 artifact_true_cross_name: "Fragmento de la Vera Cruz"
 artifact_true_cross_description: "#bold Si eres un cazador de monstruos, puedes reclutar a [GetMaA('minion_of_the_divine').GetName] (salvo que también seas infernalista)#!\n#bold Tu [journey|E] de búsqueda de guaridas (versión de destreza) mejora.#!\nUn trozo de madera oscura de tres pies de largo, marcado por una mancha oscura de la propia sangre del Salvador. Esta reliquia protegió Acre durante siglos, hasta que Gauthier de Dampierre se la llevó como piedra fundacional de la orden inquisidora de los Caballeros de Acre."
 artifact_rowan_ring_name: "Anillo de serbal"
 artifact_rowan_ring_description: "Los anillos de serbal son temidas herramientas de asesinato que emplean los miembros antiguos de los Banu Haqim o sus neonatos de confianza. El anillo puede afilarse y alargarse místicamente hasta convertirse en una estaca de madera que sirve como arma."
 artifact_tapestry_blood_name: "Tapiz de sangre"
 artifact_tapestry_blood_description: "Un enorme tapiz encantado con el poder de la profecía para quien lo contemple el tiempo suficiente. La visión puede adoptar casi cualquier forma, desde atisbos de civilizaciones antiguas hasta atisbos del futuro. Lo único cierto es que el objeto de cada visión guardará relación directa con el destino de quien lo mire."
 artifact_michaelis_crown_name: "Corona de Michaelis"
 artifact_michaelis_crown_description: "La corona del primer verdadero soberano de la Occitania vampírica. Un poderoso símbolo en torno al que pueden unirse sus herederos en su lucha contra los franceses."
 artifact_ignace_notes_name: "Notas de Ignacio de Antioquía"
 artifact_ignace_notes_description: "#bold Otorga Auspex.#!\nEl fundador del pensamiento que dio origen a la herejía cátara dejó tras de sí este texto. Bien interpretado, forma un mapa del Pleroma, el mundo espiritual. Basta con poseer este mapa para despertar los poderes latentes de la sangre de un Cainita."
 artifact_consolation_philosophy_name: "La consolación de la filosofía"
 artifact_consolation_philosophy_description: "#bold Contiene saber sobre la [golconda|E].#!\nUn ejemplar de la obra filosófica de Boecio, anotado por un Cainita desconocido que comparte su visión de la condición vampírica y de la maldición de Dios. Es una lectura muy esclarecedora en muchos sentidos."
 artifact_sword_arthur_name: "Espada de Arturo"
 artifact_sword_arthur_description: "#bold Convierte el daño en [POD_aggravated_damage|E] contra vampiros.#!\n\nEl legendario caudillo Artorius llevó el cristianismo a las islas pese a la tenaz resistencia del culto de Mitra. Su espada sigue siendo un poderoso artefacto que los cazadores de vampiros empuñan aún esta noche."
 artifact_skull_saulot_name: "Cráneo de Saulot"
 artifact_skull_saulot_description: "El cráneo conservado del [Glossary('Antediluviano','game_concept_antediluvian_desc')] al que asesinaron los Tremere. Perdido tras el crimen, lo recuperaron los Capadocios para estudiarlo. Sería un poderoso símbolo en manos de un caudillo Salubri resurgido."
 artifact_scrolls_carthage_name: "Pergaminos de Cartago"
 artifact_scrolls_carthage_description: "En estos escritos la verdad queda al desnudo. La verdad de una utopía, y de una pesadilla."
 artifact_great_book_name: "El Gran Libro"
 artifact_great_book_description: "Aquí está escrito todo lo que el Matusalén Sarmis aprendió en sus viajes. Una fuente de conocimiento útil, aunque mal ordenada."
 artifact_vassago_earring_name: "Pendiente de Vassago"
 artifact_vassago_earring_description: "#bold Desbloquea Hechicería de Sangre avanzada.#!\nInvocado hace 2000 años por un culto demente de la India, Vassago, el «Profeta del Rencor», usa esta pequeña joya como hurón para su alma. Confiere a su dueño una versión corrupta de la Taumaturgia."
 artifact_marguerite_ring_name: "Anillo de Marguerite"
 artifact_marguerite_ring_description: "#bold Desbloquea Dominación y Auspex.#!\nUn anillo merovingio de fina factura, encantado por las Voces Mesiánicas. La Príncipe Marguerite depositó en él un fragmento de su alma para asegurarse de sobrevivir a través de su chiquillo si algo le ocurría."
 artifact_raquel_band_name: "Alianza de Raquel"
 artifact_raquel_band_description: "Una sencilla alianza de madera. Cuando un vampiro pidió a santa Raquel que renunciara a sus votos y se casara con él, ella redujo a cenizas a toda la población vampírica de Bretaña, antes de morir a su vez en la hoguera como bruja."
 artifact_pacifist_ji_name: "El ji del pacifista"
 artifact_pacifist_ji_description: "Una lanza que antaño portó un piadoso budista que protegía a peregrinos y mercaderes en la Ruta de la Seda. Se dice que esta arma siempre perdonará a los puros de corazón y de alma."
 artifact_lost_yoni_name: "El yoni perdido"
 artifact_lost_yoni_description: "Una estatua mágica de una diosa de la fertilidad, traída de las conquistas de Alejandro. Ofrece atisbos de culturas y religiones desaparecidas hace mucho."
 artifact_phrygian_codex_name: "El códice frigio"
 artifact_phrygian_codex_description: "#bold Puede usarse para aprender #V Hechicería Koldúnica#!#!.\n\nUn libro escrito a lo largo de milenios por sucesivas generaciones de kolduns. Tan cuaderno de laboratorio como escritura sagrada, sus primeros capítulos se redactaron antes de la época romana, pero los más recientes son la vanguardia de las teorías del moldeado de la carne."
 artifact_severed_head_name: "La cabeza cercenada"
 artifact_severed_head_description: "La cabeza cercenada de Juan el Bautista, Akenatón, Jesús o Poncio Pilato (nadie lo sabe con certeza) habla (de forma críptica) cuando se la alimenta con algo de sangre. Puede que encierre algo de sabiduría."
 artifact_holy_grail_name: "Santo Grial"
 artifact_holy_grail_description: "#bold Desbloquea una [decision|E] única para vampiros.#!\nHallada por la orden de los Recolectores en el siglo VIII, esta copa irradia un poder sagrado sin igual. Aunque no lograron rastrear su historia exacta, los Recolectores están seguros de que es el mítico Grial, en buena parte por sus milagrosos efectos sobre la maldición vampírica cuando se usa como receptáculo de sangre."
 artifact_orb_shadows_name: "Orbe del dominio sobre las sombras"
 artifact_orb_shadows_description: "#bold Desbloquea Obtenebración.#!\nUn pequeño foco que usan los practicantes de la Obtenebración para dominar esta antinatural $pod_discipline$. Apenas sirve de nada a los maestros de este arte, pero a menudo lo conservan igualmente como recuerdo."
 artifact_bone_osiris_name: "Hueso de Osiris"
 artifact_bone_osiris_description: "#bold Podría ser de gran ayuda en una búsqueda contra Set.#!\nUna de las últimas reliquias de Osiris, el hermano rival de Set. Aún se siente a través de ella el poder del dios de los muertos, y podría ser clave para desbaratar las defensas de Set."
 artifact_bloodroot_name: "Raíz de sangre"
 artifact_bloodroot_description: "Una planta rara que solo se encuentra en el norte de África y una de las pocas hierbas que se sabe que son venenosas incluso para los Cainitas. Se usa sobre todo con armas cuerpo a cuerpo y convierte rápidamente la sangre de la víctima en un fino polvo negro, parecido a la ceniza volcánica."
 artifact_gauthier_sword_name: "Espada damasquina de Gauthier"
 artifact_gauthier_sword_description: "El primer vampiro que mató Gauthier lo recompensó con esta hoja de fina factura, un arma que aún usa hoy en día. Los Caballeros de Acre susurran en voz baja que, alimentada por la fe inquebrantable de Gauthier, poco a poco se está convirtiendo en una reliquia."
 artifact_alashrad_eye_name: "Ojo de Al-Ashrad"
 artifact_alashrad_eye_description: "#bold Desbloquea Auspex avanzado.#!\nUn diamante que el Amr de los Assamitas usa como ojo izquierdo. Se rumorea que le otorga una visión más allá de la visión, pero el propio Al-Ashrad no lo desvela."
 artifact_book_patriarch_name: "Libro del Patriarca"
 artifact_book_patriarch_description: "Las hondas revelaciones, o los desvaríos dementes, de Miguel, el Patriarca del Sueño. Este libro es escritura sagrada para sus seguidores supervivientes, aunque ninguno de ellos lo entiende de verdad."
 artifact_librum_terrum_name: "Librum Terrum"
 artifact_librum_terrum_description: "#bold Podría ser de gran ayuda en una búsqueda contra Tzimisce.#!\n\nEste «Libro de la Tierra» señala una vieja iglesia de los Cárpatos, cerca de una fortaleza hoy abandonada y en ruinas. Un pasaje críptico alude a la «gran bestia que yace dormida bajo el altar impío, rodeada de su tierra natal»."
 artifact_gaffari_scrolls_name: "Pergaminos de Gaffari"
 artifact_gaffari_scrolls_description: "#bold Desbloquea una [decision|E] única.#!\nEstos pergaminos sacan a la luz la conspiración oculta en el seno del clan Assamita. Se asesinó a Antiguos para silenciar esta verdad, y se derramará mucha más sangre antes del final."
 artifact_ashes_allhigh_name: "Cenizas del Altísimo"
 artifact_ashes_allhigh_description: "Supuestamente, las cenizas del mismísimo Odín, abatido por el Ventrue Sundafyllir. Como tiene fama de mentiroso y fanfarrón, pocos dan crédito a esta afirmación."
 artifact_karalavanisha_vrana_name: "Karalavanisha Vrana"
 artifact_karalavanisha_vrana_description: "Este poema recoge con gran detalle el mito de la creación de los Ravnos. Explica el lugar que la divinidad les asignó como guardianes contra los odiados [Glossary('Asuratizayya','game_concept_kuei_jin_desc')]."
 artifact_corpus_hermeticum_name: "Corpus Hermeticum"
 artifact_corpus_hermeticum_description: "Escrita por el mítico Hermes Trismegisto, antepasado de la Orden Hermética, esta obra se compone de 42 libros que contienen la suma de todo el saber antiguo. Su versión más completa la posee el propio Consejo de los Siete, en las profundidades de Ceoris."
 artifact_bernardo_ashes_name: "Cenizas de fra Bernardo"
 artifact_bernardo_ashes_description: "Las cenizas del fundador pacifista de los Lupetti di Gubbio, asesinado por sus convicciones. Aún se percibe un aura apaciguadora que emana de esta urna."
 artifact_hunger_satisfaction_name: "Del Ansia y su satisfacción"
 artifact_hunger_satisfaction_description: "Escrito por primera vez por Tanitbaal-Sahar, fundador de la Via Peccati, este libro ha servido durante siglos como texto (im)pío de los Pecadores. Camilla lo amplió tras la desaparición de su mentor, y muchos Pecadores menores tienen su propia interpretación de él."
 artifact_mithras_goblet_name: "Copa mitraica de cerámica"
 artifact_mithras_goblet_description: "Una copa antigua adornada con símbolos de los Misterios, que se ha usado en incontables rituales a lo largo de los años. El propio Mitra derramó su $pod_vitae$ en esta copa y se la pasó a sus leales seguidores para que bebieran de ella."
 artifact_mithras_cap_name: "Gorro frigio de Mitra"
 artifact_mithras_cap_description: "Este tocado, confeccionado con tela roja finamente cosida a finales de la época romana, se lo regaló a Mitra el erudito Ventrue Bindusara en su primer encuentro en Alejandría. Mitra solo lo lleva en ocasiones especiales en su templo, lo que explica que se conserve en buen estado."
 artifact_mithras_ring_name: "Anillo de rubí"
 artifact_mithras_ring_description: "La Setita Kemintiri le regaló este anillo a Mitra cuando eran amantes, antes de que el Ventrue se asentara en Britania. En la cara interior del anillo hay una fina inscripción en escritura hierática egipcia que, a grandes rasgos, dice: «De diosa a dios, malditos y benditos para siempre»."
 artifact_mithras_dagger_name: "Daga egipcia"
 artifact_mithras_dagger_description: "Un regalo del poderoso guerrero Horus el Vengador tras su batalla en el siglo 13. Mitra lleva varios siglos usando la daga en las ceremonias del culto, como el sacrificio ritual de toros."
 artifact_mithras_seal_name: "Sello de Mitra"
 artifact_mithras_seal_description: "El primero de varios sellos fabricados para que Mitra marcase los documentos oficiales relativos al Dominio de Avalon y a la Corte de Londres. Este sello es el símbolo de su autoridad y, si es preciso, puede confiarse a agentes leales."
 artifact_ring_chrysostom_name: "Anillo de Crisóstomo"
 artifact_ring_chrysostom_description: "#bold Puedes usar Bendecir aunque no tengas desbloqueada la ventaja.#!\nSe rumorea que este anillo, un aro de plata con una tosca cruz grabada, lo llevó san Juan Crisóstomo."
 artifact_franciscan_aspergill_name: "Hisopo franciscano"
 artifact_franciscan_aspergill_description: "Este hisopo, que contiene una astilla de hueso de san Francisco, puede crear un aura de sosiego en toda una estancia."
 artifact_martyr_fire_name: "El fuego del mártir"
 artifact_martyr_fire_description: "Este farol se forjó con las cenizas de los huesos de un mártir. Quienes tienen Fe y se hallan dentro del alcance de su luz pueden ignorar cualquier herida salvo las más incapacitantes."
 artifact_eunuch_scapular_name: "El escapulario del eunuco"
 artifact_eunuch_scapular_description: "#bold Puedes usar Intercesión aunque no tengas la ventaja.#!\nSe dice que lo llevó en vida un devoto santo chipriota que se castró para evitar las tentaciones de la carne, y este escapulario conserva la impresionante fortaleza mental de su creador."
 artifact_dagger_thorns_name: "Daga de espinas"
 artifact_dagger_thorns_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n#bold Desbloquea la [Glossary('Fe Verdadera','game_concept_true_faith_desc')] si profesas una [christian_derived_faith|E] o puedes convertirte a una (lo harás al confirmar la decisión).#! #weak (Ser [GetTrait('witch').GetName(GetNullCharacter)] bloquea por completo la decisión)#!\nForjada con una espina de la corona que llevó Cristo durante la crucifixión, esta daga irradia fe y es especialmente letal contra los seres sobrenaturales."
 artifact_spear_destiny_name: "Lanza del Destino"
 artifact_spear_destiny_description: "#bold Desbloquea la [Glossary('Fe Verdadera','game_concept_true_faith_desc')] si profesas una [christian_derived_faith|E] o puedes convertirte a una (lo harás al confirmar la decisión).#! #weak (Ser [GetTrait('witch').GetName(GetNullCharacter)] bloquea por completo la decisión)#!!\nLa lanza de Longinos, que atravesó el costado de Jesús cuando pendía de la cruz durante su crucifixión. Un poderoso símbolo de fe del que se sabe que concede visiones a quien la empuña."
 artifact_code_samiel_name: "Código de Samiel"
 artifact_code_samiel_description: "Se cree que Samiel, el más grande de la estirpe guerrera de Saulot y fundador martirizado, escribió este texto de su puño y letra. Según la leyenda, Samiel recibió la visita de Miguel, comandante de las Huestes Celestiales, mientras Saulot estaba ausente. El arcángel ordenó al rey guerrero que pusiera por escrito el Código e incluyera en él los rituales necesarios para fortalecer y dar el bautismo de sangre a los nuevos guerreros."
 artifact_valencia_chalice_name: "Cáliz de Valencia"
 artifact_valencia_chalice_description: "Los eruditos de la Iglesia no se ponen de acuerdo sobre la procedencia del Cáliz ni sobre su uso. Unos afirman que fue la copa con la que se sirvió a los apóstoles en la Última Cena. Otros dicen que se usó para recoger la sangre de Cristo en la crucifixión. Ambos bandos coinciden, sin embargo, en que el Cáliz contuvo la sangre de Cristo, lo que lo hace casi inestimable, tanto como reliquia religiosa como artefacto histórico."
 artifact_erciyes_fragments_name: "Fragmentos de Erciyes"
 artifact_erciyes_fragments_description: "Una conocida colección de apócrifos del Libro de Nod que detalla el mito cainita de la creación, anotada por algunos de los eruditos cainitas más prestigiosos."
 artifact_erciyes_broken_fragments_name: "Fragmentos rotos de Erciyes"
 artifact_erciyes_broken_fragments_description: "Una copia incompleta de los prestigiosos Fragmentos de Erciyes, una colección de apócrifos del Libro de Nod que detalla el mito cainita de la creación."
 artifact_correspondence_rodrigo_name: "Correspondencia de Rodrigo"
 artifact_correspondence_rodrigo_description: "Rodrigo, uno de los eruditos más destacados del Camino de la Bestia, lleva tiempo recopilando todos sus hallazgos y debates sobre él en un gran manuscrito, para disgusto de los miembros más tradicionales del Camino."
 artifact_grey_book_name: "El Libro Gris"
 artifact_grey_book_description: "Desde nociones básicas hasta intrigas cortesanas, pasando por instrucciones explícitas sobre cómo acechar y matar a una presa. Lo escribió la mismísima Charisse de Grey, el prestigioso paradigma de la Venator Umbra."
 artifact_gabriel_trumpet_name: "La trompeta de Gabriel"
 artifact_gabriel_trumpet_description: "El fin de los tiempos lo anunciará el toque de un cuerno grande y atronador, el del arcángel Gabriel. Si hemos de creer las historias, se dejó atrás a propósito tras la aparición de Gabriel a Mahoma, y serán los propios mortales quienes den la señal del Apocalipsis."
 artifact_the_stone_name: "La piedra"
 artifact_the_stone_description: "Al parecer, la piedra con la que Caín asesinó a Abel. Se rumorea que puede matar al instante a cualquier Cainita, encontrar al propio Caín o levantar la maldición del vampirismo. Aunque, sinceramente, parece una piedra de lo más corriente."
 artifact_warding_iron_name: "Hierro protector"
 artifact_warding_iron_description: "Un aro de hierro de tosca factura. Este objeto es un talismán menor que usan los Fieles para impedir que se acerquen las entidades malignas, vampiros incluidos."
 artifact_gospel_laodice_name: "Evangelio de Laodicea"
 artifact_gospel_laodice_description: "Una farragosa colección teosófica de visiones, revelaciones y profecías sobre la relación de los Cainitas con Dios y, por extensión, un registro esencial de la historia de la Via Caeli."
 artifact_the_bone_name: "El hueso"
 artifact_the_bone_description: "Al parecer, la quijada con la que Caín asesinó a Abel. Se rumorea que puede matar al instante a cualquier Cainita, encontrar al propio Caín o levantar la maldición del vampirismo. Aunque, sinceramente, parece una quijada de lo más corriente."
 artifact_horns_hunter_name: "Cuernos del Cazador"
 artifact_horns_hunter_description: "Hechos con los cuernos de una bestia abatida por Ennoia, los poderes de este artefacto son un misterio. Parecen realzar las dotes de mando naturales de cualquier caudillo digno."
 artifact_flesh_hunted_name: "Carne del cazado"
 artifact_flesh_hunted_description: "Comer una porción de esta carne mágica permite a cualquier Cainita cambiar de forma y convertirse en el animal con cuya carne se preparó."
 artifact_book_sun_name: "Libro del Sol"
 artifact_book_sun_description: "Se tiene por el texto central de las creencias de la Humanitatis y por un relato más o menos fiel de la búsqueda de la [golconda|E] por parte de un antiguo Cainita. Repleto de alegorías y extraños simbolismos, el Libro del Sol es a partes iguales enigma y mitología."
 artifact_dialogues_troile_arikel_name: "Los diálogos de Troile y Arikel"
 artifact_dialogues_troile_arikel_description: "Escrito al parecer en tiempos de Platón, es el relato de las supuestas conversaciones entre los dos [Glossary('Antediluvianos','game_concept_antediluvian_desc')]. Pese a lo discutido de su veracidad, sus reflexiones sobre el mundo y el ganado son la versión elaborada de los preceptos que adoptó la Via Prometheus."
 artifact_blade_of_enoch_name: "Hoja de Enoc"
 artifact_blade_of_enoch_description: "#bold Ya no puedes entrar en Frenesí.#!\nEsta hoja de bronce de aspecto tosco fue un regalo de Brujah a Enoc. Se cree que conserva algún fragmento de la memoria de su creador, en concreto su fría lógica y su dominio absoluto de las emociones."
 artifact_well_ashes_name: "Pozo de cenizas"
 artifact_well_ashes_description: "Un caldero muy profundo, creado al parecer por Saulot o por un poderoso Baali (o quizá por ambos), del que se rumorea que es capaz de devolver a un vampiro la plena mortalidad. Según los relatos, el precio puede llegar a ser quemar en él a cien mortales."
 artifact_martyr_icon_name: "Icono del mártir"
 artifact_martyr_icon_description: "Una pequeña pintura de Abel, imbuida de poder por la sangre de quien la creó. Un pequeño vestigio de una humanidad perdida hace mucho."
 artifact_veddartha_chalice_name: "Cáliz de Veddartha"
 artifact_veddartha_chalice_description: "Se supone que el fundador del clan Ventrue bebió la sangre de su Sire en esta copa, en lugar de saciarse directamente de sus venas durante el Abrazo. El clan Ventrue considera este objeto un símbolo de la determinación y el valor de su fundador, que tuvo la fuerza de voluntad de alzar una copa y beber aun mientras lo desangraban."
 artifact_tyrant_lash_name: "Látigo del tirano"
 artifact_tyrant_lash_description: "Una simple fusta con una pequeña púa en la punta. El Látigo del tirano lo creó un koldun Tzimisce poco después del ascenso de los Tremere. Magnifica el dolor de sus azotes y provoca una sensación de debilidad e impotencia cada vez que alcanza a un objetivo."
 artifact_wax_seal_name: "Sello de lacre"
 artifact_wax_seal_description: "Con unas gotas de sangre, un vampiro del Camino de los Reyes puede encantar un sello de lacre común para que resista especialmente a las manos, y a los ojos, indiscretos."
 artifact_empowerment_justicars_name: "La potestad de los justicares"
 artifact_empowerment_justicars_description: "Un misterioso documento, firmado por algunos de los Príncipes más poderosos de Europa, que habla del derecho de los gobernantes a ser juzgados por sus iguales. Crea la función de los «justicares», que ejercen de jueces y verdugos como única autoridad por encima de los propios Príncipes."
 artifact_letters_acindynus_name: "Las cartas de Acindino"
 artifact_letters_acindynus_description: "Acindino lleva recopilando información sobre los príncipes cainitas y los derechos de los reyes desde tiempos de Roma. A medida que se consolidaba la Via Regalis, estas cartas se centraron más en la historia y la filosofía del Camino, y aún esta noche sirven de introducción al Camino de los Reyes."
 artifact_lyrics_aconia_name: "Poemas de Aconia Messalina"
 artifact_lyrics_aconia_description: "De carácter francamente erótico, los poemas tienen unas imágenes exuberantes y sensuales y son, alternativamente, provocadores e insolentes, nostálgicos y llenos de anhelo, y descaradamente voluptuosos. Los seguidores del Camino del Placer consideran un arte sagrado recrear con exactitud la imagen de un poema."
 artifact_satires_name: "Las sátiras"
 artifact_satires_description: "Una colección de mordaces piezas de crítica social y religiosa en diversas formas, desde poesía cruelmente sarcástica hasta canciones de trovador."
 artifact_pilgrim_badge_name: "Insignia de peregrino"
 artifact_pilgrim_badge_description: "Imitando, y parodiando, la moda de las peregrinaciones mortales, los Pecadores han cogido la costumbre de reunir bonitas baratijas de su último viaje, desde diminutas réplicas de estelas púnicas hasta joyas de estilo bizantino."
 artifact_sigil_misrule_name: "Emblema del Señor del Desgobierno"
 artifact_sigil_misrule_description: "Cada coterie de Pecadores que celebra el solsticio oscuro confecciona todos los años nuevos el tradicional símbolo saturnal del Señor del Desgobierno."
 artifact_water_venus_name: "Agua de Venus"
 artifact_water_venus_description: "Una potente mezcla que agudiza hasta el extremo los sentidos de un mortal y hace que su sangre sea aún más dulce al beberla."
 artifact_enchanted_scimitar_name: "Cimitarra encantada"
 artifact_enchanted_scimitar_description: "El maestro hechicero Al-Ashrad no suele necesitar esta arma. Pero cuando un enemigo resulta especialmente resistente a la Magia de Sangre, está preparado de todos modos."
 artifact_code_chivalry_name: "Código de caballería"
 artifact_code_chivalry_description: "Transcripción de algo mucho más antiguo y bastante misterioso, el Código de caballería es una guía, a menudo discutida pero aún respetada, para cualquier aspirante a caballero cainita."
 artifact_chronicles_heartblood_name: "Crónica de la Sangre del Corazón"
 artifact_chronicles_heartblood_description: "Una historia completa de los Banu Haqim desde que el propio Haqim los fundó. Por desgracia, los primeros capítulos están escritos en forma de leyenda, lo que los deja abiertos a mucho debate e interpretación."
 artifact_laws_haqim_name: "Leyes de Haqim"
 artifact_laws_haqim_description: "La pieza central de la Biblioteca de Alamut. Están grabadas en enoquiano en una serie de tablillas de arcilla que se conservan en un estado casi perfecto. Como el enoquiano es una lengua perdida, existen bastantes traducciones distintas."
 artifact_book_going_night_name: "Libro de la Salida por la Noche"
 artifact_book_going_night_description: "#bold Puedes desbloquear la Hechicería de Sangre akhu mediante una decisión.#!\nUn tomo legado por Set que contiene todos los rituales necesarios para que un Setita pueda hacer el tránsito al más allá."
 artifact_apostate_auguries_name: "Augurios apóstatas"
 artifact_apostate_auguries_description: "Una colección de profecías de Trifosa. Los Augurios describen el ascenso de una gran Sombra desde el Abismo y la huida de una gran bestia allí encerrada. Esa bestia atacará después algo que, según creen los investigadores, significa o bien «Hijo» o bien «Sol». Parte de ello apunta a la Gehena y al ascenso del [Glossary('Antediluviano','game_concept_antediluvian_desc')] Lasombra."
 artifact_louhi_staff_name: "Bastón de Louhi"
 artifact_louhi_staff_description: "#bold Otorga un +10% de probabilidad de éxito de los hechizos y de velocidad de los rituales de Hechicería de Sangre.#!\nUn bastón negro con diversas runas inscritas que usaba la poderosa bruja Louhi, cuyos poderes, según se dice, rivalizan incluso con los del Hechicero de Sangre más consumado."
 artifact_shroud_kaymakli_name: "Sudario de Kaymakli"
 artifact_shroud_kaymakli_description: "Un disco empapado en sangre con inscripciones en enoquiano. Apenas legible y con poco sentido una vez traducido, sigue siendo una reliquia impresionante que parece tener una historia más profunda que contar."
 artifact_spear_bathel_name: "Lanza de Bathel"
 artifact_spear_bathel_description: "Se dice que esta lanza protege del daño a quien la empuña y mata a cualquier enemigo al que llegue siquiera a arañar. Aunque probablemente sean cuentos fantasiosos, se ha ganado una gran reputación al lado de Siegfried, el Ventrue renegado."
 artifact_biblia_negra_name: "Biblia Negra"
 artifact_biblia_negra_description: "#bold;N Artefacto maldito. Aplica [GetModifier('biblia_negra_curse_modifier').GetNameWithTooltip] la primera vez que se equipa.#!\nLa Biblia habla de 67 entidades antiguas atrapadas en prisiones de tierra que sueñan con el día en que serán libres y se adueñarán del mundo. De esas 67, 13 reciben el nombre de [Glossary('Antediluvianos','game_concept_antediluvian_desc')]. De cada página de este libro emana una sensación de temor que hace cada vez más difícil leerlo."
 artifact_wooden_coffin_name: "Ataúd de madera"
 artifact_wooden_coffin_description: "Una caja alargada de madera de pino en la que se da reposo a un cadáver. Mejor que acabar arrojado a una fosa común, pero por muy poco."  
 artifact_lupine_hide_name: "Piel de lupino"
 artifact_lupine_hide_description: "La piel conservada de uno de los cambiantes: un lupino. O puede que sea solo la piel de un lobo muy grande.\n\n«De las Bestias de la Luna\nLas Bestias de la Luna, los-que-cambian,\nson los más Antiguos de todos,\nantes que mi Padre\nrecorrían las tierras.\n\nNo te demores en su camino,\nevítalos, pues se abalanzan sobre nosotros\ncomo lobos en el redil.\nPues nosotros somos de una especie\ny ellos de otra.\nGuárdate de su suelo sagrado,\ncamina con sigilo por sus tierras salvajes.\nSu mordisco es como nuestro mordisco,\nsus garras son como nuestras garras.\n\nNo te demores en su camino,\nellos son de una especie\ny nosotros de otra»." 
 artifact_lupine_skull_name: "Cráneo de lupino"
 artifact_lupine_skull_description: "El cráneo conservado de uno de los cambiantes: un lupino. O puede que sea solo el cráneo de un lobo muy grande.\n\n«De las Bestias de la Luna\nLas Bestias de la Luna, los-que-cambian,\nson los más Antiguos de todos,\nantes que mi Padre\nrecorrían las tierras.\n\nNo te demores en su camino,\nevítalos, pues se abalanzan sobre nosotros\ncomo lobos en el redil.\nPues nosotros somos de una especie\ny ellos de otra.\nGuárdate de su suelo sagrado,\ncamina con sigilo por sus tierras salvajes.\nSu mordisco es como nuestro mordisco,\nsus garras son como nuestras garras.\n\nNo te demores en su camino,\nellos son de una especie\ny nosotros de otra»." 
 artifact_skull_vampire_name: "Cráneo de vampiro"
 artifact_skull_vampire_description: "El cráneo conservado de un vampiro. Sin una preparación especial, los vampiros muy viejos suelen reducirse a polvo cuando son destruidos.\n\n«Te está prohibido destruir a otro de tu especie. El derecho de destrucción pertenece solo a tu Antiguo. Solo el más Antiguo de entre vosotros convocará la Caza de Sangre»." 
 artifact_banner_carthage_name: "Estandarte de Cartago"
 artifact_banner_carthage_description: "Se dice que esta bandera hecha jirones es el estandarte de los Brujah cartagineses que capturaron los Ventrue de Roma durante la tercera guerra púnica.\n\nLos Brujah aún se inspiran en las leyendas de los grandes eruditos y filósofos que florecieron en Cartago, una cultura en la que Vástagos y ganado estuvieron más cerca que nunca antes o después. Para otros, sin embargo, fue una ciudad de horror y locura, donde se sacrificaban niños a los infernalistas Baali mientras los Brujah miraban hacia otro lado.\nLa caída de Cartago a manos de la mayor coalición de vampiros jamás vista aún se considera esta noche un acontecimiento decisivo de la historia cainita." 
 artifact_blood_horn_name: "Cuerno de Sangre"
 artifact_blood_horn_description: "#bold Puedes reponer tu sangre a voluntad mediante una [decision|E].#!\nEl famoso Cuerno de Sangre de Odín, un artefacto capaz de crear sangre a partir de cualquier líquido. Cuando el Altísimo desapareció, también lo hizo el Cuerno de Sangre, hasta tu reciente victoria sobre los invasores. Una clara señal del favor de los dioses." 
 artifact_sword_of_troile_name: "Espada de Troile"
 artifact_sword_of_troile_description: "#bold Convierte el daño en [POD_aggravated_damage|E].#!\n\nUna de las armas más poderosas de la historia cainita. Esta espada de cristal la empuñó la mismísima Troile en sus numerosas batallas en defensa de Cartago." 
 artifact_sword_of_dracula_name: "Espada de Drácula"
 artifact_sword_of_dracula_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\nLa espada de Drácula es una espada ancha de la mejor calidad, con una hoja reluciente engastada en una empuñadura ornamentada. A lo largo de la hoja hay grabados numerosos símbolos orientales y koldúnicos, y la guarda y la empuñadura tienen incrustadas joyas multicolores. La forjó Vlad Dracul, padre de Drácula, con la ayuda de la Ravnos Durga Syn y de su conocimiento del demonio Kupala. Vlad Dracul hizo la espada expresamente para matar a Kupala y a los malévolos siervos del gran demonio." 
 artifact_tapestry_jawbone_name: "Tapiz del hueso"
 artifact_tapestry_jawbone_description: "Tapiz de un toreador anónimo que después se copió en un salterio iluminado en 1190, en algún lugar de Francia."
 artifact_tapestry_noir_name: "Tapiz de Nod"
 artifact_tapestry_noir_description: "Se supone que lo creó el vidente Malkavian Jacob en pleno estado de fuga. Este tapiz representa la Crónica de Caín del Libro de Nod. En el primer panel, Caín mata a Abel. En el segundo, Dios maldice a Caín. En el tercero, Caín conoce a Lilith. En el último, Caín rechaza a Lilith. Esaú, el rival de Jacob, ha gastado muchos favores y mucho oro en contratar a diversos maleantes para destruir los tapices. Hasta ahora todos los intentos han fracasado, a menudo con la Muerte Definitiva del aspirante a iconoclasta. Las Cortes del Amor lo codician mucho y han dado en llamarlo la «Tapisserie de Noir» por las muchas muertes de ladrones y vándalos que lo han buscado."
 artifact_sculpture_of_ishtar_name: "Escultura de Ishtar"
 artifact_sculpture_of_ishtar_description: "Una magnífica escultura que, según se cree, hizo la propia Arikel como autorretrato. Un reflejo perfecto del talento, el orgullo y, a menudo, la arrogancia de la Rosa de Enoc." 
 artifact_iulus_sword_name: "Espada de Iulus"
 artifact_iulus_sword_description: "Un gladius forjado por el inmortal espadero Iulus Rufus Naso. Un recuerdo perfectamente forjado de la gloria de Roma, tal como pretendía el propio Iulus." 
 artifact_iulus_armor_name: "Armadura de Iulus"
 artifact_iulus_armor_description: "Una armadura romana clásica forjada por el inmortal espadero Iulus Rufus Naso. Un recuerdo perfectamente forjado de la gloria de Roma, tal como pretendía el propio Iulus." 
 artifact_esoara_ax_name: "Hacha de Esoara"
 artifact_esoara_ax_description: "Una enorme hacha que porta Esoara, el maestro de guerra de los Tremere. Esta arma de tamaño imposible es demasiado pesada para un hombre corriente, e incluso a la mayoría de los vampiros les resulta difícil de manejar." 
 artifact_house_tremere_name: "La Casa Tremere"
 artifact_house_tremere_description: "Tras su muerte durante las espantosas primeras noches de los Tremere, Ponticulus permaneció como wraith y se sirvió de Biturges para escribir la historia completa y terrible de su Casa, antaño noble y ahora corrompida por la oscuridad." 
 artifact_tremere_chronicles_name: "Crónicas tremere"
 artifact_tremere_chronicles_description: "Una historia grandilocuente y tremendamente sesgada de los primeros días de la Casa Tremere. Por tradición, el castellano de Ceoris la lee antes de cada reunión del consejo." 
 artifact_robe_nessus_name: "Túnica de Neso"
 artifact_robe_nessus_description: "Al parecer, la túnica envenenada que mató a Heracles en el famoso mito. Un símbolo de temor y desgracia para todos salvo para los Malkavian, que parecen encontrar reconfortante la sensación de mal presagio que impregna este artefacto." 
 artifact_fingerbone_hannah_name: "Falange de santa Hannah"
 artifact_fingerbone_hannah_description: "#bold Puedes usar Bendecir aunque no tengas desbloqueada la ventaja.#!\nUna pequeña reliquia impregnada de [Glossary('Fe Verdadera','game_concept_true_faith_desc')]. Al parecer, la encontró, y después la perdió, la coterie de neonatos que afirmaba haber hallado el alma de Malkav bajo Jerusalén en 1197." 
 artifact_plait_lucrezia_name: "Trenza de santa Lucrezia"
 artifact_plait_lucrezia_description: "Lucrezia, una noble dama pagana que se cortó el pelo en señal de sumisión a Dios tras su conversión, fue enviada a morir por su vengativo padre a un pozo habitado por un monstruo.\nA la mañana siguiente, Lucrezia había trenzado su cabello en forma de cuerda y sometido al monstruo. Su cabello parece tan fuerte y lustroso como siempre, y puede usarse para atar a cualquier criatura maligna." 
 artifact_rayzeel_song_name: "Canción de Rayzeel"
 artifact_rayzeel_song_description: "«No hay más luz que la tuya», un fragmento de la canción más famosa de Rayzeel. Tan bella que, según se dice, los pájaros se detenían a escuchar cuando la callada Chiquilla de Saulot empezaba a cantar. El propio Saulot solo logró sobreponerse al dolor por la pérdida de Samiel tras oír la voz de Rayzeel, que sanaba el alma." 
 artifact_portrait_saulot_name: "Retrato de Saulot"
 artifact_portrait_saulot_description: "El único retrato conocido que se conserva del [Glossary('Antediluviano','game_concept_antediluvian_desc')] Salubri. Este cuadro, de calidad corriente, representa a un hombre bajo y fornido, de cabello negro y ojos azules. La mayoría de los Matusalenes Salubri que lo han visto coinciden en que se parece «vagamente» a Saulot." 
 artifact_vitus_heel_name: "Talón de san Vito"
 artifact_vitus_heel_description: "Una reliquia del santo patrón de los trastornos nerviosos. Aunque no puede curar por completo la maldición de los Malkavian, tiene sobre ellos un efecto calmante de todos modos." 
 artifact_dweomered_scimitar_name: "Cimitarra damasquina hechizada"
 artifact_dweomered_scimitar_description: "Una poderosa cimitarra damasquina encantada con magia de los djinn. Estas hojas no pueden volver a su vaina sin antes haber probado la sangre." 
 artifact_weyland_wyrcan_name: "Wyrcan de Weyland"
 artifact_weyland_wyrcan_description: "#bold Debes tener más de 35 de destreza para equipar esta arma.#!\nNadie sabe quién o qué es Weyland, pero sus hojas son más que famosas. Casi vivas, se niegan a que las empuñe alguien de poca habilidad e incluso intentan matar al indigno. En manos de un espadachín digno, en cambio, cantan en la batalla y siembran el miedo en las filas enemigas." 
 artifact_black_stake_name: "La estaca negra"
 artifact_black_stake_description: "El trozo de palo de hierro que, supuestamente, usó Troile para incapacitar a su Sire Brujah antes de cometer diablerie con él. Sufrió mucho mientras Brujah se revolvía para liberarse, pero aún conserva un aura palpable de intensidad mítica." 
 artifact_roll_damned_name: "Registro de los condenados"
 artifact_roll_damned_description: "Inspirado en el Libro de Domesday, este proyecto contiene una lista de todas las obligaciones feudales cainitas, los vínculos y las coteries de los vampiros de Inglaterra. Aunque no es exhaustivo, ya es una herramienta muy impresionante para el chantaje... y una clara violación de la Mascarada." 
 artifact_toomler_femur_name: "Fémur de Toomler"
 artifact_toomler_femur_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E] contra $POD_splat_vampire_plural$.#!\n\nToomler era un Matusalén Tzimisce famoso por su capacidad de desmontar partes de su cuerpo y volver a unirlas. Por algún motivo, su fémur sigue intacto tras su muerte y constituye un arma sorprendentemente eficaz, aunque tosca." 
 artifact_cycle_lilith_name: "Ciclo de Lilith"
 artifact_cycle_lilith_description: "El Ciclo de Lilith es una supuesta escritura vampírica narrada desde la perspectiva de Lilith. Es, sobre todo, una colección de canciones bahari (recogidas en su mayoría de la tradición oral) dispuestas en forma de ciclo. Su tono es más simbólico que el de un verdadero relato de la historia de Lilith." 
 artifact_veil_night_name: "Velo de la noche"
 artifact_veil_night_description: "Una historia exhaustiva del mundo musulmán y sus Cainitas, escrita en forma de relato de viaje de Abu Fahim Kateb, un visir de los Banu Haqim." 
 artifact_tawiz_name: "Ta'wiz"
 artifact_tawiz_description: "Un pequeño amuleto de plata que se lleva al cuello y contiene citas del Corán. Se usa para ahuyentar a los espíritus malignos o como talismán de buena suerte." 
 artifact_albuduh_name: "Al-Buduh"
 artifact_albuduh_description: "Un cuadrado místico con una selección de números que suman un valor propicio y cuyo significado confiere una amplia gama de poderes protectores." 
 artifact_khoumsa_name: "Khoumsa"
 artifact_khoumsa_description: "Un estandarte con la mano de Fátima, la mano de cinco dedos que representa a Mahoma, a su hija Fátima, al esposo de esta, Alí, y a sus hijos. Se usa en muchas circunstancias, desde talismán de buena suerte hasta estandarte de guerra." 
 artifact_inscrutable_eye_name: "Ojo inescrutable"
 artifact_inscrutable_eye_description: "Un anillo con un escarabajo de motivo egipcio que lleva engastada una gema en forma de ojo en mitad del caparazón. La factura del anillo es increíblemente antigua, y se nota frío incluso sobre la carne de un vampiro.\nAl concentrarse en un vampiro concreto, existe la posibilidad de averiguar dónde se encuentra y qué hace." 
 artifact_waxen_poetica_name: "Poetica de cera"
 artifact_waxen_poetica_description: "Una pequeña tablilla de cera que, cuando cae en ella una gota de sangre, puede arrojarse contra un adversario. Si acierta, la cera se adhiere a la víctima y empieza a extenderse. Extremadamente caliente, incluso para los Cainitas, puede volverse letal en muy poco tiempo." 
 artifact_writings_cabirus_name: "Escritos secretos de Cabirus"
 artifact_writings_cabirus_description: "Una versión completa, aunque mal traducida, del libro de Cabirus, en el que la joven momia describe el funcionamiento interno del hechizo de la vida de Osiris. Las momias de Horus se afanan en localizarlo y destruirlo, temerosas de que se use para el mal si alguien que no sean ellas llega a comprenderlo del todo." 
 artifact_shattered_spear_name: "Lanza rota de Orthia"
 artifact_shattered_spear_description: "#bold Los vampiros pueden repararla mediante una decisión menor.#!\nLos restos dañados de la lanza de Artemis Orthia, la más valiente de los Ventrue. Esta arma tenía un poder legendario, pero se rompió cuando la propia Artemis cayó en las últimas horas de Cartago. Aun así, sigue siendo una reliquia poderosa y se niega sin más a que la empuñe nadie menos valiente que la propia diosa espartana." 
                     
 artifact_bow_of_yi_name: "Arco de Yi"
 artifact_bow_of_yi_description: "#bold Convierte todo el daño en [POD_aggravated_damage|E].#!\n\n#bold Hiere a los [knights|E] y [commanders|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu enemigo en los [single_combat_duel_plural|E], si son vampiros (u otros seres sobrenaturales que temen al sol).#!\nA simple vista, el Arco del Arquero Excelente parece bastante corriente. Es de diseño elegante y ha resistido los siglos notablemente bien, pero no tiene nada que llame la atención. Hace siglos que nadie lo ve, pero entre los [GetTrait('shih').GetName( GetPlayer )] circulan relatos de sus apariciones periódicas. Según esos relatos, el antiguo arco es robusto y requiere mucha fuerza para tensarlo y apuntar, pero, una vez que una flecha sale de él, siempre vuela certera, casi como si el propio Yi guiara el proyectil. Algunos relatos afirman que las flechas disparadas con este arco llenan literalmente el cielo con el fulgor del sol, pero solo cuando se enfrentan a un vampiro verdaderamente malvado y poderoso."
 artifact_staff_of_shing_tse_lee_name: "Bastón de Shing Tse Lee"
 artifact_staff_of_shing_tse_lee_description: "#bold Hiere a los [knights|E] y [commanders|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu enemigo en los [single_combat_duel_plural|E], si son [GetTrait('kueijin').GetName( GetPlayer )].#!\nShing Tse Lee fue uno de los primeros [GetTrait('shih').GetName( GetPlayer )] verdaderos en abandonar el Ejército Celestial. Solo se llevó una hogaza de pan, un manuscrito kaja especialmente esclarecedor y el bastón que había tallado de un árbol cerca de la fortaleza de Kun Lun.\nEl bastón de Shing Tse Lee es un arma sólida, pero contra los fantasmas hambrientos resulta devastador. Literalmente, les roba la esencia con cada golpe, arrancándoles para siempre una parte de sí mismos y dejando al wraith en una agonía eterna."
 artifact_sword_of_shu_mo_pan_name: "Espada de Shu Mo Pan"
 artifact_sword_of_shu_mo_pan_description: "#bold Convierte el daño en [POD_aggravated_damage|E] contra los cambiaformas.#!\n\n#bold Hiere a los [knights|E] y [commanders|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu enemigo en los [single_combat_duel_plural|E], si son [GetTraitGroup('fera').GetName()].#!\nShu Mo Pan era bisnieta de Yi y una de las mejores guerreras de los [GetTrait('shih').GetName( GetPlayer )]. Según la mayoría de los relatos, vivió hasta la insólita edad de 97 años antes de morir a manos de un hombre tigre. Usó con frecuencia la espada que portaba en sus combates contra los hengeyokai.\nLa espada de Shu Mo Pan defiende de verdad a su portador de los ataques de los hengeyokai, moviéndose a una velocidad asombrosa para bloquearlos. Además, corta hondo la carne de las Razas Cambiantes y causa heridas agravadas."
 artifact_fans_of_ma_yi_yuan_name: "Abanicos de Ma Yi Yuan"
 artifact_fans_of_ma_yi_yuan_description: "#bold Obtienes acceso a [UmbraGlossary('dreaming')].\nInmune a los ensalmos.\nHiere a los [knights|E] y [commanders|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu enemigo en los [single_combat_duel_plural|E], si son [GetTrait('fae').GetName( GetPlayer )] o [GetTrait('changeling').GetName( GetPlayer )].#!\nLos abanicos son armas engañosamente letales. Estos finos abanicos plegables de metal tienen un filo de navaja y son tan resistentes como la mejor hoja de espada. Bajo su elaborada decoración se esconde un gran poder místico, así como un hambre de sangre de los hirayanu. Quien los usa puede desviar cualquier hechizo lanzado por las hadas y es capaz de adentrarse en su reino."
 
 artifact_soulforged_artifact_name: "[killed.GetFirstNameNoTooltip]"
 artifact_soulforged_artifact_description: "Un artefacto forjado con almas que antaño fue [killed.GetTitledFirstNameNoTooltip], a quien mató [owner.GetTitledFirstNameNoTooltip]. Murmura y gime, pero todos esperan que eso solo signifique que puede emitir sonidos y nada más."
 artifact_forced_fetish_artifact_name: "[killed.GetFirstNameNoTooltip]"
 artifact_forced_fetish_artifact_description: "Un fetiche en el que [killed.GetTitledFirstNameNoTooltip] está vinculado por la fuerza, creado por [owner.GetTitledFirstNameNoTooltip]."
 artifact_artifact_pieces_name: "Fragmento de artefacto"
 artifact_artifact_pieces_description: "Un fragmento de reliquias o artefactos procedente de la Vorágine. Quizá algún [GetTrait('wraith').GetName( GetNullCharacter )] pueda volver a tejerlo hasta formar un único artefacto."
 artifact_restored_artifact_pieces_name: "Fragmento de artefacto +[newly_created_artifact.MakeScope.GetVariable('restored_artifact_piece_level').GetValue|0]"             


 artifact_djangalbi_name: "Djangalbi"
 artifact_djangalbi_description: "\nEste artefacto no canónico lo encargó un mecenas.\n El Djangalbi es un enorme códice que recoge los gastos de las fuerzas cainitas de la Guerra Eterna. El texto es enrevesado y denso, y leerlo puede mejorar a una escala tremenda la comprensión de las finanzas y de la administración de un señorío. Ha cambiado de manos numerosas veces y, lo lea quien lo lea, las enseñanzas que contiene tienen una aplicación potencialmente universal."
 artifact_sets_emasculation_name: "La castración de Set"
 artifact_sets_emasculation_description: "#bold Desbloquea la castración permanente.#!\nEsta espada corta de hierro meteórico y bronce parece un arma humilde, pero el tinte rojizo de la hoja delata su increíble legado. Es la misma hoja con la que Horus castró a Set en tiempos inmemoriales y, entre la energía radiante de su primer portador y la $pod_vitae$ residual de su primera víctima, irradia poder la empuñe quien la empuñe. La convicción y el propio sentido de la justicia alimentan esta arma legendaria."                                                                           

 artifact_pomegranate_name: "La granada"
 artifact_pomegranate_description: "#bold Permite convertir a un [GetTrait('wraith').GetName( GetNullCharacter )] en un [GetTrait('risen').GetName( GetPlayer )].#!\nUna poderosa reliquia creada por la maga Deméter, madre de Perséfone, para abrir un portal entre la tierra de los vivos y la tierra de los muertos."


 eternal_love_artifact_name: "Amor eterno"
 eternal_love_artifact_description: "#bold Convierte el daño en [POD_aggravated_damage|E] contra vampiros.#!\n\nAunque no es exactamente mágica, no puede negarse que esta espada tiene cierto hechizo místico. Hecha de plata, causa heridas que los vampiros no pueden curar. Solo pueden sanarlas mezclando la sangre de otro Vampiro con la suya y aplicándola sobre la herida. Los artesanos cainitas de Cartago forjaron esta arma para Prias, que la usaba en sus expediciones de caza de vampiros."
 sword_samiel_artifact_name: "Espada de Samiel"
 sword_samiel_artifact_description: "#bold Convierte el daño en [POD_aggravated_damage|E].#!\n\nEl legendario primer Guerrero salubri era un luchador sin par, dispuesto a ir más allá de su deber contra las fuerzas de la oscuridad. Su arma fue lo bastante poderosa para matar a un [Glossary('Antediluviano','game_concept_antediluvian_desc')] y aún esta noche irradia esa aura de justicia vengativa."
  
 artifact_vassagos_reliquary_name: "Relicario de Vassago"
 artifact_vassagos_reliquary_description: "Un diamante enorme de valor incomparable. Una prisión resplandeciente desde la que Vassago planea la expansión de su culto."
 artifact_bezariel_dagger_name: "Daga ritual"
 artifact_bezariel_dagger_description: "Una daga ritual sin importancia hasta que se le infundió una pequeña parte del poder de Baba Yagá. Bezariel usó esta arma para anclarse a la Tierra al escapar de la Prisión Abisal."
 artifact_orobas_statue_name: "Estatua de Orobas"
 artifact_orobas_statue_description: "Una estatua de arenisca húmeda y viscosa que se usó para atar a Orobas hace milenios. Desde entonces ha cambiado hasta parecerse más a su grotesco huésped."
 artifact_heart_lamashtu_name: "Corazón de Lamashtu"
 artifact_heart_lamashtu_description: "Esta caja, nunca terminada y muy parecida al Arca de la Alianza judía, alberga el vínculo de Lamashtu con el plano mortal. Para frustración del demonio, nunca logró encontrar a un artesano con talento suficiente para terminarla tras la muerte de su creador original."
    
 artifact_caliburn_name: "Caliburn"  
 artifact_caliburn_description: "#bold Otorga [GetModifier('caliburn_light_modifier').GetNameWithTooltip] a los [knights|E] aliados cuando actúas como [commander|E] durante la [combat_phase|E], o a ti en los [single_combat_duel_plural|E].\nLa «espada de luz», Caliburn, es un tesoro extremadamente poderoso. Su nombre se traduce, más o menos, como «rayo». Hay quien sostiene que Caliburn no es en realidad un tesoro, sino un objeto único que desafía toda expectativa y explicación, ya que las reglas habituales de los tesoros no parecen cumplirse en su caso." 
 artifact_caliburns_sheath_name: "Vaina de Caliburn"  
 artifact_caliburns_sheath_description: "#bold Otorga [GetModifier('caliburn_shield_modifier').GetNameWithTooltip] a los [knights|E] aliados cuando actúas como [commander|E] durante la [combat_phase|E], o a ti en los [single_combat_duel_plural|E].\nComo [character_interaction|E], te permite curar las heridas del objetivo.#!\nLa vaina de Caliburn es de simple cuero negro, aunque algunas hadas afirman distinguir la palabra «Caliburn» labrada en el cuero." 
 artifact_caladbolg_name: "Caladbolg"  
 artifact_caladbolg_description: "#bold Como [character_interaction|E], te permite hacer caer rayos del cielo para herir a todos los caballeros del objetivo.#!\nA esta espada se le han atribuido toda clase de poderes y habilidades. Se dice que su portador es invencible en la batalla, que la espada le otorga poderes de regeneración y que golpea por sí sola. Por si fuera poco, los relatos también cuentan que la espada da a su portador la capacidad de detectar mentiras y falsedades, de inspirar a los hombres más que los relatos del mejor de los bardos y de hacer caer rayos del cielo." 
 artifact_red_apple_of_avalon_name: "Manzana Roja de Avalon"  
 artifact_red_apple_of_avalon_description: "#bold Como [character_interaction|E], te permite hacer que el objetivo obtenga un rasgo mental negativo o asesine a un amigo o amante.#!\nLas manzanas de piel roja, crecidas de las aguas del Manantial Rojo, son venenosas. Sin duda son bellas a la vista, de un rojo vivo y reluciente, pero un solo mordisco provoca un dolor intenso y alucinaciones. Aunque las manzanas no son mortales de por sí, muchos de los que han mordido las manzanas rojas han perecido, despeñándose por acantilados o confundiendo al amigo con el enemigo y obligando a sus seres queridos a luchar contra ellos o morir." 
 artifact_white_apple_of_avalon_name: "Manzana Blanca de Avalon"  
 artifact_white_apple_of_avalon_description: "#bold Como [character_interaction|E], te permite curar todos los rasgos mentales negativos del objetivo.#!\nLas manzanas blancas, en cambio, tienen el poder de sanar la mente. Pueden eliminar los terrores nocturnos, curar la locura o devolver el habla a los mudos. Eso sí, no pueden remediar los males físicos, solo las enfermedades que arraigan en la mente." 
 artifact_chalice_of_rain_name: "Cáliz de la lluvia"  
 artifact_chalice_of_rain_description: "La Cábala del Cáliz, un grupo de magos de la Antigua Fe que reside en Cornualles, sellaron un antiguo pacto con las hadas para ayudar a guardar las legendarias islas de Lyonesse de quienes pretendían saquear su legendaria riqueza. A cambio de su ayuda, las hadas confiaron el Cáliz a los magos. Se dice que es una maravilla contemplarlo, fundido en una plata azulada y con runas antiguas rodeando el borde de la copa. Si se llena la copa y se derrama el agua en el suelo como ofrenda a la buena gente, el cáliz traerá la lluvia antes de que salga la próxima luna. Esto ayuda a los magos y a los suyos a ganarse a duras penas la vida en esa tierra agreste y asegura su prosperidad." 
 artifact_broach_of_scrying_name: "Broche adivinatorio"
 artifact_broach_of_scrying_description: "El broche está pensado para ayudar a su portador a tomar decisiones sencillas. El portador hace una pregunta sencilla, de sí o no, sobre un problema al que se enfrenta o una tarea que desea emprender. Después, rompe el broche golpeándolo contra una piedra o aplastándolo con el pie. La piedra que cae de él seguirá blanca o se volverá negra como la noche. La piedra blanca indica que la respuesta a la pregunta es afirmativa, mientras que la negra indica que es negativa." 
 artifact_singing_sword_of_madog_cynydd_name: "Espada Cantora de Madog Cynydd"
 artifact_singing_sword_of_madog_cynydd_description: "#bold Como [character_interaction|E], te permite iniciar un [single_combat_duel|E] para otorgar a la espada el modificador [GetModifier('artifact_life_expectancy_40_modifier').GetNameWithTooltip].#!\nLa espada cantora de Madog Cynydd es, a decir de todos, un arma de factura exquisita y poder letal. Al blandirla en la batalla, la espada entona un canto fúnebre por los enemigos de su portador. Cada enemigo abatido por la espada de Madog Cynydd entrega a quien lo mata lo que le quedara de su vida natural. Así, matar a un joven con la espada de Madog Cynydd podría alargar la vida de su portador unos buenos cuarenta años. El portador de la espada cosecha también la buena fortuna que el caído pudiera haber tenido en el futuro, y la mala suerte de la víctima muere con ella."
 artifact_black_torc_of_carniog_name: "Torques negro de Carniog"
 artifact_black_torc_of_carniog_description: "#bold $POD_can_summon_on_death_trigger_loca$\n$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n$POD_can_covert_to_wraith_trigger_loca$\nNúmero máximo de wraiths vinculados: #P +2#!.#!\nSe rumorea que el torques negro de Carniog puede robar almas y hacer que ejércitos enteros de mortales caigan en un sueño casi permanente (aunque apacible). Hay quien sugiere que otorga la capacidad de dar órdenes a las propias hadas, pero sobre ese asunto las hadas guardan silencio."
 artifact_blazing_silver_torc_of_myfanwy_du_name: "Torques de plata ardiente de Myfanwy Du"
 artifact_blazing_silver_torc_of_myfanwy_du_description: "El torques de plata ardiente de Myfanwy Du llena de un hondo respeto y afecto a quienes miran a su portador. Harán todo lo que esté en su mano por ayudarlo, aunque fueran sus más enconados enemigos antes de que se pusiera el torques. Si el portador da las señales adecuadas, ese afecto se convierte en amor apasionado en el corazón de quien las reciba (sea cual sea el sexo del portador)."
 artifact_cauldron_of_gruffydd_name: "Caldero de Gruffydd"
 artifact_cauldron_of_gruffydd_description: "#bold Puedes reclutar [GetMaA('animated_tree').GetName], [GetMaA('golems').GetName], [GetMaA('guardians').GetName] y [GetMaA('homunculus').GetName] como [men_at_arms|E].#!\nEl caldero de Gruffydd crea guerreros retorcidos con cualquier cosa que su amo eche en él. Si un mago llena el caldero de rocas, surgirá un elemental de piedra que luchará por él. Del mismo modo, si se llena de dagas y arcilla, saldrá de él un servidor horrible (y letal), algo así como un gólem erizado de púas. Obviamente, unas combinaciones son más eficaces que otras, pero incluso un ejército de soldados de ramas de sauce es mejor que no tener ejército."
 artifact_cauldron_of_annwn_name: "Caldero de Annwn"
 artifact_cauldron_of_annwn_description: "#bold Como [character_interaction|E], te permite curar las heridas del objetivo.#!\nUno de los tesoros feéricos más codiciados es el caldero de Annwn. Antaño se hallaba en el [UmbraGlossaryLocalized('shadowlands','Inframundo')] bajo el Tor de Glastonbury, pero el rey hada Avallach lo ocultó a la vista de los mortales después de que Morgana le Fay contraviniera sus deseos e intentara usar el caldero con el rey Arturo. Según se rumorea entre los magos, el caldero tiene el poder de curar la enfermedad de cualquier mortal al que se sumerja en el agua que contiene."
 artifact_faerie_dust_name: "Polvo de hada"
 artifact_faerie_dust_description: "El polvo de hada suele llevarse en saquitos y debe entrar en contacto directo con su objetivo para surtir efecto. Otros métodos consisten en espolvorearlo sobre el objetivo desde arriba, llenar con él sus guantes o su ropa, espolvorearlo sobre la comida, mezclarlo con líquidos para preparar pociones y pócimas o incluso arrojar saquitos enteros, que estallan al impactar, para alcanzar más distancia."
 artifact_cabinet_stick_name: "Bastón del armario"
 artifact_cabinet_stick_description: "Con el aspecto de un bastón o cayado corriente, este bastón concede acceso mágico a un armario o alacena oculto en algún lejano reino feérico. Al golpear con él cualquier armario, puerta, baúl o incluso la corteza suelta de un árbol, su dueño activa el vínculo con un almacén mágico."
 artifact_cap_of_neglect_name: "Gorro del desdén"
 artifact_cap_of_neglect_description: "Aunque estos gorros no otorgan una verdadera invisibilidad, rara vez hace falta una magia así. Quienes no buscan activamente a la portadora del gorro sencillamente pasan por alto que está en la estancia. Mientras no llame la atención, por ejemplo hablando o haciendo movimientos bruscos, la portadora de este gorro puede moverse sin que nadie la note."
 artifact_ring_of_linked_sight_name: "Anillo de la vista enlazada"
 artifact_ring_of_linked_sight_description: "Estos anillos se forjan con encantamientos especiales que crean un vínculo mágico entre ellos. Si la poseedora de uno de los anillos se lo acerca al ojo derecho, ve al poseedor del segundo como si estuviera a solo unos pasos. La niebla y las sombras ocultan el entorno del poseedor del segundo anillo, pero su figura y sus actos son visibles. Si se lo acerca al ojo izquierdo, ve lo que ve el poseedor del segundo, como si mirara a través de su ojo izquierdo."
 artifact_sealing_needle_name: "Aguja selladora"
 artifact_sealing_needle_description: "#bold Como [character_interaction|E], te permite curar las heridas del objetivo.#!\nSencillos tesoros concebidos como regalo para criadas y costureras a cambio de juramentos. Estas agujas encantadas, una vez enhebradas, cosen por arte de magia cualquier desgarrón o abertura a la que se apliquen. Según el tipo de hilo, la aguja remendará ropa rota, cerrará la boca de los sacos de grano o incluso cerrará heridas abiertas. El hechizo con que se crean estos tesoros es sencillo, y las agujas funcionan igual de bien en cuero, seda o piel. Aunque la mayoría de sus usos son bastante inocentes, se sabe que los de la Corte de Invierno los han usado para coser la boca, la nariz y los ojos de sus víctimas, o para abrirlas en canal y volver a coserlas con cáñamo basto."
 artifact_active_arrow_of_midnight_sun_name: "Flecha del sol de medianoche #Weak (activada)#!"
 artifact_arrow_of_midnight_sun_name: "Flecha del sol de medianoche #Weak (desactivada)#!"
 artifact_arrow_of_midnight_sun_description: "#bold Si está activada, hiere a los [knights|E] y [commanders|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu enemigo en los [single_combat_duel_plural|E], si son vampiros (u otros seres sobrenaturales que temen al sol).#!\nEstas flechas encantadas son las favoritas de la Corte de Verano. Al dispararlas al cielo nocturno, estallan en una luz radiante que ilumina el campo de batalla con la luz del sol de mediodía. Esa luz puede usarse para hacer retroceder a las criaturas de la oscuridad, o simplemente para crear luz donde no la había."
 artifact_arrow_of_inky_noon_name: "Flecha del mediodía de tinta"
 artifact_arrow_of_inky_noon_description: "Contrapartida de las flechas del sol de medianoche, estas flechas son las favoritas de la Corte de Invierno. Al dispararlas al aire durante el día, oscurecen el cielo hasta la negrura de tinta de una noche sin luna."
 artifact_vulcans_hammer_name: "Martillo de Vulcano"
 artifact_vulcans_hammer_description: "Llamado a veces martillo de enano en las culturas del norte, este martillo está encantado para forjar armas y armaduras. La herramienta aumenta mágicamente la resistencia del metal con que se crean esos objetos, lo que les permite infligir y soportar más daño. Las armas forjadas con este martillo nunca necesitan afilarse e infligen un nivel adicional de daño en combate."
 artifact_pegasus_bridle_name: "Brida de Pegaso"
 artifact_pegasus_bridle_description: "Si fueron las historias mortales de caballos alados las que inspiraron este tesoro, o al revés, es motivo de debate entre los eruditos humanistas. Colocada sobre cualquier animal, normalmente un caballo, la brida le otorga la capacidad de volar hasta que se le quita."
 artifact_rooting_amulet_name: "Amuleto enraizador"
 artifact_rooting_amulet_description: "Este tesoro lo creó originalmente un inanimae de la madera para castigar a una reina que había quebrantado un juramento y entrado en su arboleda. El hada labró un bello amuleto y se lo entregó a uno de los cortesanos de la reina como regalo para su señora. A la reina le encantó el collar de plata de intrincado tejido y se lo abrochó al cuello. La siguiente vez que puso un pie en el suelo fuera de su casa, sus piernas echaron raíces en la tierra y su cuerpo y sus brazos se convirtieron en el tronco y las ramas de un árbol. Revelándose como un hada del bosque, el inanimae recuperó el amuleto y advirtió a la corte de la reina que no se aventurara demasiado en el bosque cercano."
 artifact_twin_glass_name: "Espejo gemelo"
 artifact_twin_glass_description: "Un espejo partido en dos por arte de magia. El espejo gemelo permite comunicarse a grandes distancias. Los dos espejos funcionan de forma muy parecida a una ventana: sus dueños pueden mirar o hablar a través de uno y ser vistos u oídos a través del otro."
 artifact_gale_flute_name: "Flauta del vendaval"
 artifact_gale_flute_description: "Este pequeño instrumento está imbuido de los poderes del Alba y es capaz de invocar desde una ligera brisa hasta violentas tormentas. Una sola nota suave de la flauta atrae un viento apacible hacia el flautista. Tocar durante más tiempo aumenta la fuerza del viento, hasta desatar un vendaval tras solo unos minutos. Si se sigue tocando, se desata toda la furia del viento y la lluvia, creando una tempestad de un poder increíble, suficiente para arrasar aldeas."
 artifact_excaliburs_scabbard_name: "Vaina de Excalibur"
 artifact_excaliburs_scabbard_description: "#bold Como [character_interaction|E], te permite curar las heridas del objetivo.#!\nAunque no es realmente la vaina de la legendaria Caliburn, o Excalibur, este raro tesoro es tan antiguo y tiene unas propiedades tan místicas que ha acabado asociándose con esa poderosa arma. Se dice que cualquier espada que se desenvaine de ella es irrompible en combate, pero el verdadero poder de este tesoro reside en sus poderes curativos."
 artifact_shatterhammer_name: "Martillo quebrador"
 artifact_shatterhammer_description: "Estas formidables armas se forjaron en pleno apogeo de la Guerra de las Estaciones, y hoy se conocen poquísimas. En estos tesoros suelen quedar ligados por juramento duendes nacidos de terremotos o desprendimientos, o incluso inanimae malditos de roca o de tierra. La esencia de estos seres terrosos confiere poder a armas corrientes y hace que, al golpear, una onda de fuerza contundente atraviese al objetivo. Se sabe que estos martillos han destrozado armaduras y huesos, reventado órganos internos, astillado grandes puertas de roble e incluso derribado torres de piedra."
 artifact_sword_of_drowning_name: "Espada del ahogamiento"
 artifact_sword_of_drowning_description: "Forjadas durante la Guerra de las Estaciones, estas armas contienen duendes del agua o inanimae que renunciaron a su libertad por la causa o fueron atados por la fuerza contra su voluntad. La naturaleza acuática de sus esencias vinculadas se manifiesta al usarlas en combate: al golpear, hacen que el agua inunde los pulmones del objetivo. Estos ataques causan pánico y paranoia mientras el objetivo se atraganta y escupe agua de mar."
 artifact_cauldron_of_nightmares_name: "Caldero de pesadillas"
 artifact_cauldron_of_nightmares_description: "Creados para sembrar el pánico y la desesperación entre los enemigos de la Corte de Invierno, estos calderos podían hacer que los peores miedos de sus objetivos se manifestaran durante un breve tiempo en el mundo real. Para que la magia funcione, hay que combinar dentro del caldero algún fragmento del objetivo (un mechón de pelo, un diente caído o incluso un dedo cercenado) con una mezcla de pociones. Después se celebran complejos rituales que dan carne a las imágenes de sus peores pesadillas."
 artifact_castors_star_name: "Estrella de Cástor"
 artifact_castors_star_description: "Caída de los cielos durante una tormenta eléctrica, dejando tras de sí una chisporroteante estela de luz y fuego, la estrella de Cástor zumba con una energía caótica que busca desesperadamente liberarse. Cuando se recuperó, la enorme roca metálica estaba tan cargada con la energía del rayo que brillaba azul en la noche, y quienes se le acercaban soltaban sus armas de metal tras una fuerte sacudida que les dolía en los brazos."
 artifact_friars_cross_name: "Cruz del fraile"
 artifact_friars_cross_description: "Datada en el oscuro periodo medieval, la cruz del fraile es una gran cruz de oro ornamentada que cuelga de un cordón trenzado. Aunque antaño se usaba como símbolo de fe y de protección, la cruz del fraile tiene una historia empapada en la destrucción de changelings y la disolución de la magia feérica. Imbuida de la Banalidad de repetidos Deshacimientos, se ha convertido en un objeto corruptor que devora el Glamour de quienquiera que tenga la desgracia de llevarla."
 artifact_gray_sword_name: "Espada gris"
 artifact_gray_sword_description: "La espada gris, aunque a todas luces quimérica, carece de personalidad y de adornos, y parece una espada ancha corriente con una empuñadura sencilla y una hoja plana y sin marcas. Su historia es, como poco, turbia. Se sospecha que la creó un señor unseelie que pretendía Deshacer a un rival seelie, pero no hay ningún nombre que pueda vincularse con certeza a su creación."
 artifact_achen_name: "Achen"
 artifact_achen_description: "#bold Aplica [GetModifier('achen_modifier').GetNameWithTooltip] a todos los gobernantes del bando contrario al unirte a una [war|E].#!\nAchen es el martillo de dos cabezas de Dougal, cuya forma adorna el emblema de la Casa Dougal. En combate, Achen encanta automáticamente cualquier arma o armadura que golpea para que no pueda usarse contra un miembro de la Casa Dougal. Se cuentan historias de ejércitos enteros detenidos por el poder del martillo, con cotas de malla y espadas inmovilizadas. Sus dueños y portadores tuvieron que abandonarlas en el campo de batalla y retirarse desnudos por el poder de Achen."
 artifact_anweyth_name: "Anweyth"
 artifact_anweyth_description: "Anweyth, Madre del Acero, la Hoja de la Invención, es una hermosa espada corta con incrustaciones de nudos de plata y empuñadura de azabache. Ocupa un lugar místico en el saber de la Casa Dougal: fue la última obra de Dougal, su obra sin par. Anweyth tiene dos poderes conocidos: revela a cualquier herrero el secreto de fabricar acero y, además, nadie puede codiciarla."
 artifact_caliper_of_aife_name: "Compás de Aife"
 artifact_caliper_of_aife_description: "Aife, la esposa de Dougal, fabricó un fino compás de medir con los colmillos de alguna bestia olvidada... cada brazo del compás es casi tan largo como el brazo de un trol. El compás puede «medir» cualquier cosa que pueda colocarse entre sus puntas: distancia, peso, longitud, pureza, honradez, amor, odio, etc."
 artifact_mooncrystal_name: "Cristal lunar"
 artifact_mooncrystal_description: "#bold Más probabilidades de éxito en la [bunk|E] de adivinación.#!\nCon tamaños que van desde una canica hasta una gran bola, los cristales lunares parecen las típicas «bolas de cristal» que uno esperaría ver en manos de los adivinos: esféricos, de un color blanco lechoso que parece cambiar y refractar los colores cuando se mira en su interior. Un cristal lunar permite a su usuario obtener conocimiento de lo que ocurre en el presente o en el pasado reciente entre una y tres veces por semana, según su potencia y su tamaño."
 artifact_elenas_mirror_name: "Espejo de Elena"
 artifact_elenas_mirror_description: "Uno de los pocos tesoros que quedan de la [Glossary('Era Mítica','game_concept_mythic_age_desc')]. Nadie sabe con certeza quién posee este tesoro extremadamente poderoso. Se dice que el espejo de Elena permite a su portador ver con claridad cualquier otro lugar del mundo durante un máximo de una hora, una vez al día. Además, le permite lanzar ensalmos sobre quienes aparecen en el espejo. Se cree que el espejo ayuda especialmente a usar la Soberanía, pues hay relatos de eras remotas sobre hechiceros que usaban el espejo para influir en las decisiones de reyes y príncipes al otro lado del mundo."
 artifact_balors_crystal_eye_name: "Ojo de cristal de Balor"
 artifact_balors_crystal_eye_description: "Cuando el gran Balor del Mal de Ojo cayó por fin en la batalla, uno de los sacerdotes guerreros de los fomorianos le arrancó el ojo destrozado y lo encerró en un cristal donde también se guardaban las aguas curativas de un pozo. Esperaba conservarlo y restaurarlo para que pudiera volver a usarse como arma contra los Tuatha Dé Danann y su progenie. Sin embargo, el ojo ha permanecido latente durante siglos, pero con la llegada de la Estrella Roja, visible en [UmbraGlossary('dreaming')] y a la que las hadas llaman el Ojo de Balor, los Guardianes Reales han bañado el ojo en su luz en un lugar protegido. Desde entonces, el ojo de cristal ha empezado a brillar con un rojo apagado, y el cristal que lo envuelve contiene un calor enorme."
 artifact_blood_dross_name: "Escoria de sangre"
 artifact_blood_dross_description: "#bold Permite, cuando necesites gastar Glamour, gastar primero el Glamour almacenado en este recipiente de Glamour.#!\nLos Maestros de la Danza han descubierto una forma de que los Hijos de Lilith con los que se relacionan les proporcionen un tipo insólito de Glamour Oscuro. Tomando unas gotas de sangre de los vampiros conocidos como locos cuando muestran toda su locura, o de los toreador mientras se entregan a alguna actividad artística, los Maestros crean lo que se llama escoria de sangre. La sangre se guarda en diminutos viales redondeados de azúcar cristalizado, que después se recubren con una capa ligeramente más dura para contener el líquido resultante. Pueden guardarse varias cuentas juntas en una caja protectora hasta un mes sin que pierdan su potencia."
 artifact_steaming_spear_of_vengeance_name: "Lanza humeante de la venganza"
 artifact_steaming_spear_of_vengeance_description: "Hace mucho tiempo, Lugh el del Brazo Largo usó una lanza mágica para reventar el ojo de Balor. En respuesta, los artesanos de la Casa Balor llevan tiempo construyendo un golpe de revancha para quienquiera que gobierne a los seelie cuando llegue la guerra. Conocida como la lanza humeante de la venganza, tiene una punta parecida a la perdición de Balor. Cargada de poderosos encantamientos, la lanza está llena de una ira que la hace buscar sangre. «Venganza» es tan poderosa que su punta debe estar sumergida constantemente en agua, porque funde todo lo que toca, y su asta debe mantenerse encadenada a un grillete hundido en la piedra para impedir que salga volando en busca de presas."
 artifact_cauldron_of_fear_name: "Caldero del miedo"
 artifact_cauldron_of_fear_description: "#bold Aplica el [modifier|E] [GetModifier('cauldron_of_fear_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu enemigo en los [single_combat_duel_plural|E].#!\nEs un gran caldero negro de aspecto vagamente oxidado, pero, cuando se llena de agua estancada y se pone al fuego, produce una bruma fina, casi invisible, que el viento extiende por un gran salón o un campo de batalla. Quienes quedan atrapados en la bruma sienten el terror en el corazón, e incluso los caballeros más valientes y los adversarios más honorables huyen presas del pánico, soltando a menudo sus armas o cualquier otra cosa que lleven con las prisas por escapar. El inconveniente es que, si el viento cambia, quienes usan el caldero pueden acabar sufriendo el efecto."
 artifact_rose_of_leanhaun_name: "Rosa de Leanhaun"
 artifact_rose_of_leanhaun_description: "#bold Puedes reponer tu Glamour a voluntad mediante una [decision|E].#!\nEste tesoro es una rosa blanca que se depositó sobre el pecho de Leanhaun a su muerte. Es la única flor que no se volvió negra al tocarla después de que se lanzara la maldición de Finellia, y desde entonces ha permanecido incorrupta. Los miembros de la Casa la consideran un signo de esperanza, pues ha seguido pura y vibrante mientras sustenta a su poseedor sin necesidad de recurrir a la Rapsodia. El hada que posee la rosa obtiene Glamour directamente de ella."
 artifact_edanns_harp_name: "Arpa de Edann"
 artifact_edanns_harp_description: "#bold Recuperas automáticamente un punto adicional de Glamour cada mes.#!\nEsta antigua arpa de madera tiene una gran grieta que la recorre, unas cuerdas que parecen poco más que hilos deshilachados y está tan deteriorada que apenas valdría unas monedas para alguien interesado en la historia celta. Sin embargo, a ojos encantados, el arpa, aunque antigua y agrietada, tiene incrustaciones de oro y cuerdas plateadas que parecen tan finas y frágiles como un cabello reluciente. Nadie en la Casa sabe si es de verdad el arpa de Edann, el bardo que robó el corazón de Leanhaun, o una copia hecha con amor, pero los poderosos encantamientos que tiene la convierten en un tesoro de la Casa."
 artifact_crown_of_dreams_name: "Corona de los sueños"
 artifact_crown_of_dreams_description: "#bold Ya no necesitas que el objetivo tenga el nivel máximo de estrés para usar la [character_interaction|E] Rapsodia.#!\nEste tesoro no es en realidad una corona, sino un alfiler de roble cubierto de joyas con forma de corona estilizada. Quien lo lleva, el líder de los Buscadores al que llaman la Corona, percibe a todos los Soñadores de los alrededores inmediatos (más o menos una milla cuadrada) y las formas de liberar su potencial. Discernir ese potencial permite al portador saber quién podría beneficiarse más de las creaciones de ese Soñador."
 artifact_masquers_eyes_name: "Ojos del enmascarado"
 artifact_masquers_eyes_description: "Este tesoro es en realidad un par de antifaces normales, aunque exquisitamente decorados. Al activarse, crean una conexión entre quienes los llevan que les permite compartir sentidos e incluso emociones a distancia. La usuaria se pone la máscara y el otro kithain puede ver y oír todo lo que hace su pareja mientras lleve puesta la máscara. Incluso puede tomar prestada la voz de su compañero, siempre que este consienta el mensaje."
 artifact_passion_braceler_name: "Brazalete de la pasión"
 artifact_passion_braceler_description: "#bold Permite, cuando necesites gastar Glamour, gastar primero el Glamour almacenado en este recipiente de Glamour.#!\nParecen simples brazaletes de tela o de plata, pero en realidad actúan como «baterías» de Glamour o de Fuerza de Voluntad que almacenan magia o determinación para sus dueños hasta que la necesitan. Con las grandes tensiones a las que nos enfrentamos, estos brazaletes son una bendición. Los de tela siempre se tejen con los colores favoritos de un changeling y contienen Glamour, mientras que los de plata llevan inscrito el nombre de su portador y contienen Fuerza de Voluntad."
 artifact_eilaf_name: "Eilaf"
 artifact_eilaf_description: "Este arco largo perteneció a Ivalde, un gran guerrero que murió en la novena y última batalla contra los jotuns. Las völvas custodian este arco hasta el día en que acuda a ellas un nuevo guerrero cuya destreza iguale la de Ivalde. Una flecha disparada con este arco nunca falla y causa daño agravado."
 artifact_tapestry_of_fate_name: "Tapiz del Destino"
 artifact_tapestry_of_fate_description: "#bold Desbloquea una [decision|E] única.#!\nLas hadas no saben si existe de verdad. Según los relatos, el tapiz contiene cada [Glossary('Nombre Verdadero','podgloss.truename')] que existe, así como el destino de [UmbraGlossary('dreaming')]. El poder y el conocimiento que encierra no tienen precio. Perdido hace mucho, se rumorea que está en cualquier parte, desde un freehold sluagh hasta el fondo del Mar Plateado. Muchos han partido en su busca, pero ninguno ha vuelto. Una cosa es segura: quien lo encuentre probablemente atraerá sobre sí la ira de las Nornas."
 artifact_berserker_armor_name: "Armadura berserker"
 artifact_berserker_armor_description: "Esta ornamentada armadura protege a quien la lleva de todo ataque con armas y le permite luchar más allá de su capacidad habitual. El mayor secreto de la Casa es que la armadura es vulnerable a los ataques mágicos o a los que se hacen a mano desnuda. Aunque es poderosa, la armadura se cobra un precio: una vez desatados, es imposible detener a quienes llevan la armadura berserker hasta que mueren o su bando gana la batalla."
 artifact_cudgel_of_conchobhair_name: "Garrote de Conchobhair"
 artifact_cudgel_of_conchobhair_description: "El garrote de Conchobhair es un modesto bastón de roble de unos 8 pies de alto. Otorga a su portador (y solo funciona con un miembro de la Casa Daireann) varios poderes maravillosos. El pie del bastón está herrado con hierro frío como advertencia y, en las circunstancias más extremas, como posible arma."
 artifact_cauldron_of_sceanbh_name: "Caldero de Sceanbh"
 artifact_cauldron_of_sceanbh_description: "El caldero tiene dos funciones, según lo que desee quien prepare el brebaje. Su primer poder es preparar una poción que inspira a los guerreros a realizar grandes hazañas. El segundo es más insidioso: prepara una potente pócima para dormir."
 artifact_amber_wyrm_name: "Wyrm de ámbar"
 artifact_amber_wyrm_description: "En el interior de un huevo de ámbar rojo oscuro yace un dragón en miniatura enroscado y dormido. Suspendido de una cadena de oro y rodeado por una red de oro labrada, el huevo es translúcido y deja ver todos los detalles del dragón. De vez en cuando, el dragón se da la vuelta en su sueño, como si el ámbar fuera solo agua."
 artifact_eyes_of_the_snow_maiden_name: "Ojos de la Doncella de las Nieves"
 artifact_eyes_of_the_snow_maiden_description: "En tiempos antiguos, la hechicera Charodei usó trozos de ámbar dorado, claros como la luz del sol, para hacer los ojos de la Doncella de las Nieves que le ofreció a Varich. Cuando el ardor de la pasión de él la destruyó, los ojos de ámbar aparecieron sumergidos en un charco de agua extrañamente salada. Varich no quiso volver a verlos jamás, pero otros miembros de la Casa los han conservado, pues se rumorea que pueden ver de verdad las formas de los enemigos de las hadas: los fomorianos."
 artifact_firebird_name: "Pájaro de fuego"
 artifact_firebird_description: "Este tesoro construido por nockers es un intrincado pájaro de fuego mecánico hecho de rubí y oro. Cuando se expone tanto a la luz del sol como a los rayos de la luna, el pájaro de fuego alza el vuelo y canta en el cielo cuando se le ordena. Al alcanzar una altura de 100 pies, estalla en gloriosas llamas, iluminando la zona durante millas con una luz dorada y titilante y señalando el camino hasta el trod más cercano o hasta un lugar concreto que indique su amo."
 artifact_havens_compass_name: "Brújula del refugio"
 artifact_havens_compass_description: "Este tesoro suele tener la forma de una brújula antigua. En lugar de señalar el norte, apunta al freehold o claro activo más cercano. Útil para exploradores y vagabundos que necesitan «cualquier puerto en la tormenta», la brújula no distingue entre el freehold de una pandilla seelie y el de un señor unseelie que odia a los plebeyos. Como algunos señores de freeholds mantienen sus hogares ocultos, puede que no vean con buenos ojos al dueño de este tesoro."
 artifact_bakers_stone_name: "Piedra de panadero"
 artifact_bakers_stone_description: "Las piedras de panadero pueden tener cualquier forma, color o tamaño, aunque la mayoría son redondas y de arcilla parda. Cuando se coloca sobre la piedra cualquier tipo de materia orgánica (sí, cualquier tipo de materia), se transforma por arte de magia en pasteles sencillos pero comestibles. En [UmbraGlossary('dreaming')] o cerca de lugares ricos en Glamour, los pasteles se vuelven más sabrosos y elaborados, con glaseado, pasas y coberturas de fruta."
 artifact_bane_dagger_name: "Daga de perdición"
 artifact_bane_dagger_description: "Esta arma infame está pensada para el asesinato y, por ello, se ha prohibido oficialmente. La daga tiene un pequeño compartimento en la empuñadura. Cuando se coloca en él una parte de la víctima elegida (un cabello, una pestaña o una gota de sangre), la hoja queda sintonizada con esa persona y nunca puede volver a sintonizarse. Una vez muerto el objetivo, la hoja empieza a corroerse y desaparece en menos de una hora."
 artifact_dreamstone_of_madoc_name: "Piedra onírica de Madoc"
 artifact_dreamstone_of_madoc_description: "#bold Como [character_interaction|E], te permite teletransportarte a la ubicación del objetivo.\nObtienes acceso a [UmbraGlossary('dreaming')].#!\nExisten muchas piedras oníricas, pero ninguna de esas pequeñas baterías de Glamour puede compararse con la piedra onírica de Madoc. El Glamour que concentra puede «filtrarse» y hacer que quien esté más cerca de ella tenga sueños vívidos que siempre recuerda al despertar. Su mayor capacidad, sin embargo, es el poder de moldear la materia de los sueños. Un hábil artesano de sueños puede crear criaturas quiméricas de inmenso poder, plegar el Ensueño sobre sí mismo para crear reinos de bolsillo o construir un trod o un portal donde antes no lo había. Según un rumor nunca comprobado, podría incluso encontrar y abrir el camino a [UmbraGlossary('arcadia')]."
 artifact_durable_sandals_name: "Sandalias resistentes"
 artifact_durable_sandals_description: "Te burlarás, pero son un tesoro muy apreciado entre los elegbara. Nunca se desgastan ni necesitan reparación. Son cómodas, mantienen los pies calientes y secos sea cual sea el clima y dan un pequeño impulso de energía al caminar o correr."
 artifact_trail_dust_name: "Polvo del sendero"
 artifact_trail_dust_description: "Un tesoro útil. El polvo del sendero siempre se guarda en una pequeña bolsa de cuero de aspecto gastado, adornada con un símbolo antiguo que significa «sendero». Dentro hay una pequeña cantidad de tierra o arena propia de la zona por la que viaja el elegbara. Al activarlo con un punto de Glamour y espolvorearlo sobre los pies descalzos de su dueño, este obtiene al instante un mapa geográfico detallado y un sentido de la orientación en los alrededores más o menos equivalentes a los que tendría un nativo del doble de su edad."
 artifact_blessed_opa_name: "Opa bendecido"
 artifact_blessed_opa_description: "El opa es el arma tradicional de los elegbara. Parecido a un bastón de combate, suele estar tallado con detalle y adornado con amuletos de la suerte y recuerdos que sus dueños han recogido en sus viajes. La mayoría se endurecen al fuego o mediante ensalmos y son tan resistentes como el metal, de modo que pueden usarse en combate contra armas de filo sin miedo a que se rompan. Se valoran tanto por su belleza como por su utilidad."
 artifact_basilisk_stone_name: "Piedra de basilisco"
 artifact_basilisk_stone_description: "Por desgracia, la mayoría de la gente no aprecia la forma de hablar de los nockers y, aunque estos protesten contra juicios tan duros, hasta ellos comprenden que hay momentos en que deben callarse, y eso puede costarles. Por eso, una piedra de basilisco no tiene precio en la corte o cuando se intenta conservar un empleo en el mundo mundano. Aunque Jill Lengua de Ampollas hizo añicos el primero y más grande de estos tesoros, los fragmentos del original aún conservan parte de la antigua magia de Byzamedas."
 artifact_goblin_lantern_name: "Linterna de trasgo"
 artifact_goblin_lantern_description: "Este tipo de linterna es habitual en las minas de los nockers. Proyecta dos tipos de luz. La primera es visible para todos los kithain, pero, girando una ruedecilla, un nocker puede hacer que solo la vean otros nockers."
 artifact_goblin_parchment_name: "Pergamino de trasgo"
 artifact_goblin_parchment_description: "El pergamino de trasgo es el medio preferido de nobles y nockers para enviar mensajes secretos, sobre todo amenazas. Lo que se escribe en él solo es visible para el destinatario, y el papel arde en cuanto se lee. Además, resiste todo intento de copiar la información que contiene, incluso por parte de otros nockers o de las arañas de palabras sluagh."
 artifact_goblin_shoes_name: "Zapatos de trasgo"
 artifact_goblin_shoes_description: "Los nockers fabrican estos zapatos con la piel de una quimera de gusano blanco subterráneo. Se ajustan a casi cualquier tamaño de pie y hacen que los pasos de quien los lleva sean casi totalmente inaudibles."
 artifact_razor_claws_name: "Garras afiladas"
 artifact_razor_claws_description: "Las garras de navaja son uno de los productos más vendidos entre los redcaps. Estos guantes especiales ocultan pequeñas hojas de talla cruel que sobresalen por encima de los nudillos y que se extienden al pulsar un botón oculto en la palma del guante."
 artifact_goblin_bow_name: "Arco de trasgo"
 artifact_goblin_bow_description: "Es una ballesta de repetición que lleva seis virotes en un cargador metálico. El arma hace avanzar el cargador con cada disparo, lo que permite al usuario disparar varias veces sin tener que detenerse a recargar."
 artifact_goblin_cloak_name: "Capa de trasgo"
 artifact_goblin_cloak_description: "Las capas de trasgo llevan tejidos cristales negros que curvan la luz alrededor de quien las lleva."
 artifact_pendulum_name: "Péndulo"
 artifact_pendulum_description: "Este tesoro es una pequeña bola de metal hueca unida a una cadena de plata. Al introducir cualquier tipo de metal en la bola, el péndulo guiará a quien lo use hasta el yacimiento más cercano de ese material. Si no hay ninguno en la zona, el usuario puede hacer de zahorí sobre un mapa y el péndulo girará sobre el área general del yacimiento más próximo."
 artifact_universal_solvent_name: "Disolvente universal"
 artifact_universal_solvent_description: "El Disolvente universal es fruto de las investigaciones de los nocker sobre la alquimia quimérica y es el mayor (y uno de los más raros) producto de esta ciencia. El disolvente es un compuesto binario; el alquimista debe guardar sus partes en dos frascos separados (normalmente uno Negro y otro Blanco). Cuando el nocker mezcla los dos componentes, una densa nube de Banalidad pura brota y disuelve todo objeto quimérico a su paso, incluidos los changelings en su aspecto fae."
 artifact_magical_crumbs_name: "Migas mágicas"
 artifact_magical_crumbs_description: "Tesoro común entre los pooka, las Migas mágicas proceden, según se dice, de la Selva Negra de Alemania. Recogidas del suelo a lo largo de un sendero especial, tienen la capacidad de guiar a un pooka de vuelta a casa si se extravía. La mayoría de los pooka poseen dos: una para dejarla en el punto de partida y otra que lleva consigo el pooka para que sirva de rastro. Mientras el pooka recuerde dejar una en casa y no pierda la que porta, acabará encontrando el camino de vuelta olfateando. Obviamente, también podrían compartirse entre amigos para que el pooka pudiera encontrar a la otra persona en caso de separarse."
 artifact_cat_boots_name: "Botas de gato"
 artifact_cat_boots_description: "Hace muchas vidas, o eso cuenta la historia, un zapatero de Londres salvó la vida de un gato que había tenido un altercado con un perro grande. El zapatero cuidó al gato hasta que se recuperó y, a cambio, el gato, que era un pooka, ayudó al zapatero. Durante un año y un día, todos los pares de botas que fabricó el zapatero tuvieron la cualidad especial de hacer que los demás ignoraran la presencia de quien las llevaba. Changelings de todo el mundo acudieron a comprar las botas y el zapatero prosperó, se retiró rico y feliz, y al final el pooka siguió su camino."
 artifact_balthazars_bracelets_name: "Brazaletes de Baltasar"
 artifact_balthazars_bracelets_description: "Aunque no fuera por otra cosa, estos brazaletes a juego tienen una belleza delicada que los convierte en una adición especial al botín de cualquier pooka al que le gusten las cosas bonitas y brillantes. Sin embargo, también tienen un beneficio único cuando se llevan puestos. Al colocarlos en las muñecas, se ajustan por sí solos para adaptarse con suavidad a los antebrazos del changeling, enroscándose desde la muñeca hasta el codo. Si el hada llama una vez a los brazaletes, se funden con la piel y se convierten en tatuajes de ébano que cambian de forma junto con el pooka cuando adopta su aspecto animal. En esa forma, los tatuajes parecen simples marcas en la piel del animal."
 artifact_cleopatras_wings_name: "Alas de Cleopatra"
 artifact_cleopatras_wings_description: "Este hermoso collar ceñido, único en su especie, tiene un colgante de mariposa que pende de una ancha banda de oro que rodea el cuello. Hecha de ámbar, las alas de la mariposa se ruborizan de escarlata cerca del cuerpo dorado y se aclaran hasta un cálido naranja hacia las puntas. El changeling que lleva el collar obtiene la capacidad de volar de un modo similar al del cantrip Corredor del Viento. Un par de alas tornasoladas e intangibles aparecen a la espalda del hada. Las alas carecen de sustancia y no pueden ser dañadas. Desaparecen en cuanto el changeling se quita el collar."
 artifact_osiris_flail_name: "Mayal de Osiris"
 artifact_osiris_flail_description: "El primer faraón del antiguo Egipto, Osiris, conservaba dos símbolos de poder. Uno de ellos, su mayal, aparece representado en los sarcófagos de muchos de los faraones que siguieron sus pasos. Suele mostrarse cruzado con un cayado sobre el pecho del rey muerto. El mayal es una vara de mango corto de la que cuelgan tres tiras de cuero decoradas con cuentas de madera y hueso. Según se cuenta, registraba toda la historia en los grabados quiméricos de sus cuentas de hueso y madera. Para aprovechar su vasta sabiduría, bastaba con formular una pregunta y tocarse la frente con el mayal. La respuesta llegaba de inmediato."
 artifact_gauntlets_name: "Guanteletes"
 artifact_gauntlets_description: "Los guanteletes son, en el nivel más simple, un par de guantes. Sin embargo, si fuera solo eso, los redcap no les tendrían tanto cariño. Cada redcap que se fabrica unos guanteletes se asegura de tachonarlos con anzuelos, hojas de afeitar, cristales rotos, clavos oxidados y astillas. No hay dos pares de guanteletes iguales, y la mayoría de los redcap juran que no podrían llevar otros que no fueran los suyos."
 artifact_dry_dust_name: "Polvo seco"
 artifact_dry_dust_description: "Lo que hace el polvo seco es sencillo. Quien lo ingiere (aunque siempre debe tomarse junto con comida o bebida, nunca solo) siente un hambre voraz y una sed insaciable durante una hora. En ese tiempo, la víctima intentará comerse cualquier cosa —y en algunos casos a cualquiera— que caiga en sus manos. El polvo seco tiene diversos usos, desde ayudar en envenenamientos hasta bromas pesadas. Solo los redcap parecen conocer el secreto de su fabricación, y los pocos a los que se ha interrogado al respecto insinúan con malicia que han molido hueso humano para hacerlo. Puede que digan la verdad, o puede que solo quieran incomodar a sus interlocutores. En cualquier caso, dice mucho."
 artifact_blooded_gauntlets_name: "Guanteletes ensangrentados"
 artifact_blooded_gauntlets_description: "Mientras que los pinchos, protuberancias, hojas y garfios de un par de guanteletes corrientes son meramente afilados y peligrosos, los de unos Guanteletes ensangrentados están activamente hambrientos. Cuando desgarran a un oponente, quieren quedarse ahí, y causarán todo el daño que puedan. Los testigos (y algún que otro superviviente) juran que las hojas y demás realmente se mueven para destrozar la carne del objetivo una vez que el puñetazo impacta. Los garfios sujetan el guantelete en su sitio mientras el resto del equipo se pone a trabajar, desgarrando hasta el hueso y más allá. El pobre necio que reciba un puñetazo en el estómago de un redcap que los lleve está condenado a unos momentos muy breves de agonía, y nada más."
 artifact_grinder_name: "La Trituradora"
 artifact_grinder_description: "Nunca se insistirá lo bastante en que la Trituradora puede tragarse casi cualquier cosa. ¿Metal? Ningún problema. ¿Cadáveres? Pan comido. ¿Un elefante? Puede que lleve un rato, pero entra. Y sea lo que sea lo que entre, siempre sale la misma pasta, que llena pero no sabe muy bien. Por supuesto, el tamaño del objeto y los materiales de que está hecho influyen en el tiempo que la Trituradora tarda en masticarlo de una vez por todas, pero al final, si el redcap de la manivela está dispuesto a esforzarse, el artefacto puede deshacerse de prácticamente cualquier cosa imaginable."
 artifact_logis_ashes_name: "Cenizas de Logi"
 artifact_logis_ashes_description: "#bold Como [character_interaction|E], te permite desatar [GetModifier('POD_county_great_famine_modifier').GetNameWithTooltip] en el señorío del objetivo.\nOtorga a los [commanders|E] enemigos el modificador [GetModifier('logis_ashes_modifier').GetNameWithTooltip] en una guerra como [commander|E].#!\nIncluso un minúsculo puñado de Cenizas de Logi tiene un efecto atroz. Una vez esparcidas algunas de las Cenizas, toda la comida y la bebida de los alrededores se vuelve polvo en la boca de quienes intenten probarlas. El efecto se propaga como un incendio y por lo general se extiende a lo largo de leguas. Ducados enteros han quedado asolados de este modo, pues toda la comida que se traiga durante un año y un día se marchita de la misma manera."
 artifact_winterblade_name: "Hoja del Invierno"
 artifact_winterblade_description: "Algunos dicen que la Hoja del Invierno es la guadaña que segará el Verano del mundo y lo sumirá todo en el Invierno. Enfría la tierra allí donde toca y vuelve permanentemente estéril el suelo sobre el que reposa. Un solo corte de su filo basta para marchitar un árbol de siglos de crecimiento, y el más leve arañazo drena la vida de una víctima. Incluso aquellos a quienes la Hoja del Invierno falla sienten el frío de su paso en los mismos huesos, y con suerte encontrarán fuerzas para alejarse arrastrándose antes de que la hoja regrese."
 artifact_grapes_of_wrath_name: "Uvas de la ira"
 artifact_grapes_of_wrath_description: "Las Uvas son perfectas, de un púrpura intenso y profundo. Brillan de forma tentadora y centellean con Glamour para quien las mire con la atención suficiente. Quienes comen una Uva se sienten ligeramente ebrios y empiezan a perder sus inhibiciones. Cuanto más comen, más desinhibidos se vuelven. Las Uvas no contienen alcohol de verdad, así que las habilidades motoras no se ven afectadas."
 artifact_horn_of_hermes_name: "Cuerno de Hermes"
 artifact_horn_of_hermes_description: "Hecho de latón, este empañado tesoro parece un helicón, o una tuba grande. Su superficie tiene marcas de picaduras y el emblema de unas botas aladas, el sello de Hermes. Hermes fue mensajero de las hadas Unseelie del Olimpo y era conocido entre los mortales como el patrón de los viajeros. Él y Dioniso trabaron amistad y, tras el segundo intento de Hera contra la vida de Dioniso, Hermes le regaló el cuerno."
 artifact_halcyon_halter_name: "Ronzal del Alción"
 artifact_halcyon_halter_description: "El alción era un ave, identificada con el martín pescador, capaz de calmar los vientos y las olas cuando anidaba sobre el mar durante el solsticio de invierno. La leyenda del ave se originó en Grecia, donde los marineros arrojaban bizcochos dulces al mar Mediterráneo para atraerla y, luego, en los mares más calmos, cerca de sus puertos. Decorado con las plumas del ave, este ronzal forma una X sobre el pecho de quien lo lleva, cruzándose justo sobre el corazón, donde destacan las plumas más brillantes."
 artifact_minoan_mosaic_name: "Mosaico minoico"
 artifact_minoan_mosaic_description: "El antiguo arte del mosaico se desarrolló en la antigua Grecia. Consiste en colocar piezas de teselas de colores sobre argamasa para formar una imagen o un diseño decorativo. El Mosaico minoico se originó en Creta durante el reinado del rey Minos. Según la leyenda, este tesoro muestra la imagen de una persona sin rostro hasta que un changeling lo contempla durante un largo rato. Gastando un punto de Glamour, el hada empieza a ver aparecer entre las teselas el rostro de su único y verdadero amor. Narciso se asomó al Mosaico minoico y se decepcionó cuando la única imagen que halló allí fue la suya. Proclamó que el Mosaico era falso. Al parecer, se demostró que se equivocaba."
 artifact_sands_of_time_name: "Arenas del Tiempo"
 artifact_sands_of_time_description: "#bold Como [character_interaction|E], te permite curar las heridas del objetivo.#!\nRecogida grano a grano de las costas de las Cícladas, un grupo de 200 islas griegas en el mar Egeo, esta arena posee poderes curativos especiales. Algunos eruditos sátiros postulan que en realidad son diminutos fragmentos de la Atlántida arrastrados hasta la orilla. Con el paso de los siglos, las Arenas son cada vez más escasas."
 artifact_syrinx_name: "Siringa"
 artifact_syrinx_description: "La única e inigualable Siringa fue la primera flauta jamás fabricada. Muchos Kithain han oído hablar de este tesoro y temen su aparición, pues tiene la capacidad de inspirar una pasión increíble en quienes oyen su canto. Sin embargo, como nació de un amor verdadero, no desata pasiones genéricas como hace el Don de Pan. En cambio, hace que quienes lloran un amor perdido sientan con más agudeza el agridulce dolor, e impulsa a quienes aman a actuar según sus emociones ante el objeto de su afecto. La música intensifica todos estos sentimientos y los consolida para siempre. Quien ama, al oír la música de la Siringa, amará a esa persona eternamente y quizá más allá."
 artifact_inner_spinners_name: "Hilanderos internos"
 artifact_inner_spinners_description: "Espeluznantes, reptantes, oscuros y húmedos, los Hilanderos internos son instrumentos de venganza y tortura. En esencia, son diminutos arácnidos quiméricos revestidos de laca negra y mecanismos de relojería. Cuando se colocan en la casa o los aposentos de su víctima designada, se ponen manos a la obra. Una vez que el objetivo duerme a salvo, los Hilanderos corretean sobre él y se arrastran hasta sus oídos, nariz y fosas nasales. Allí tejen telarañas quiméricas tan espesas y pegajosas que el objetivo puede asfixiarse, ahogarse o quedarse sordo temporalmente."
 artifact_gray_vines_name: "Vides grises"
 artifact_gray_vines_description: "#bold Más probabilidades de [imprison|E] a [characters|E] tras un [siege|E] o [raid|E] exitoso.#!\nCon el aspecto de un chaleco del color de la niebla, las Vides grises parecen tejidas con un ingenioso patrón que imita el crecimiento de las plantas silvestres. Al examinarlas de cerca, se advierte que el chaleco está hecho en realidad de vides espinosas entrelazadas que, por fortuna, permanecen inmóviles."
 artifact_gloves_of_night_name: "Guantes de la Noche"
 artifact_gloves_of_night_description: "Aunque los underfolk pueden retorcer sus cuerpos para caber por casi cualquier grieta o abertura, hay ocasiones en que hasta el más flexible se topa con una puerta cerrada con llave. Para esos momentos, los Guantes de la Noche vienen de perlas. Gastando un punto de Glamour, la carne dentro de los Guantes puede licuarse o solidificarse a voluntad de quien los lleva. Esto permite al crawler que los porta remodelar sus dedos en garras, ventosas o incluso ganzúas. El usuario también puede elegir la consistencia de los dedos mutados, con la rigidez suficiente para que una ganzúa de carne haga girar los bombillos sin desgarros."
 artifact_wordspider_name: "Arañapalabras"
 artifact_wordspider_description: "Una quimérica y mecánica descifradora metódica de códigos y descubridora de secretos. Lo bastante pequeña para caber en la palma de la mano de un crawler corriente, una Arañapalabras parece hilada con cristal verde y dorado. Sus mandíbulas son inusualmente largas y, mirando con atención, se descubren delgadas protuberancias en cada «pie»."
 artifact_cold_light_name: "Luz fría"
 artifact_cold_light_description: "#bold Otorga el modificador [GetModifier('cold_light_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúan como [commander|E] durante la [combat_phase|E], o a tu adversario durante los [single_combat_duel_plural|E].#!\nCon el aspecto de una daga tallada en un único carámbano titánico, la Luz fría brilla siempre con un azul sobrenatural. Irradia un frío intenso que hace caer un escalofrío atroz sobre todos los presentes, salvo su portador y sus aliados (que sienten en el aire una agradable frescura). A una orden, la Luz fría también puede aumentar la intensidad de su resplandor y cegar a todo el que se encuentre ante ella."
 artifact_brooch_of_the_true_suitor_name: "Broche del Pretendiente Sincero"
 artifact_brooch_of_the_true_suitor_description: "Son sencillos broches de metal que no llaman la atención salvo por la sencillez y la calidad de su factura. Sin embargo, para quienes conocen sus poderes, son una ayuda inestimable en la búsqueda del amor verdadero. Si un pretendiente sincero lleva uno al enfrentarse al objeto de su afecto, parecerá más relajado y tranquilo de lo que estaría en otro caso."
 artifact_highland_blade_name: "Hoja de las Tierras Altas"
 artifact_highland_blade_description: "Estas hojas encantadas son cada vez más escasas, pues o bien se ha perdido el modo de fabricarlas, o bien los nocker no hablan. Las más comunes son las claymore, aunque existen otras variantes de filo. Mientras quien la empuñe posea aunque solo sea un punto de Glamour, no sufrirá ningún efecto adverso por causa del terreno."
 artifact_rorys_bag_name: "Bolsa de Rory"
 artifact_rorys_bag_description: "Llamadas así por Rory el Rojo, todas son bolsas grandes de construcción robusta, aunque cada modelo puede variar en color y factura. Aun así, cada una es lo bastante grande para contener comida y bebida suficientes para sustentar a un troll adulto durante un día. Si un changeling gasta un punto de Glamour, aparecerá una comida completa de raciones de viaje. Ten en cuenta que son raciones reales y no quiméricas, por lo que ofrecen sustento real."
 artifact_shield_of_virtue_name: "Escudo de la Virtud"
 artifact_shield_of_virtue_description: "Estos grandes escudos redondos son tesoros legendarios y se sabe de no más de dos que existan. Se dice que fueron los escudos de los hermanos gemelos Torvald y Bohr, y cada uno tiene el poder de fortalecer la voluntad de un troll honorable y ofrecerle una protección extraordinaria en batalla. Mientras el troll sea fiel a sus juramentos y a su palabra, el escudo será liviano como una pluma en combate y le brindará defensa adicional."
 artifact_maul_of_thunder_name: "Maza del Trueno"
 artifact_maul_of_thunder_description: "#bold Puede reclutar [GetMaA('electricity_elemental').GetName] como [men_at_arms|E].#!\nSe dice que esta poderosa maza fue forjada por trolls bajo las instrucciones directas de Thor, para usarla en caso de que perdiera Mjolnir. Se dice que es la más poderosa de todas las armas de los trolls, y quizá incluso igual a Caliburn, la espada del Alto Rey David. Entre sus poderes rumoreados figuran saltar cualquier masa de agua de un solo brinco, derribar cualquier muro de un solo golpe y dominar los elementos, y se dice que emite un estruendo eléctrico de trueno cada vez que golpea."
 artifact_eye_of_opening_name: "Piedra Angular"
 artifact_eye_of_opening_description: "#bold Permite que, cuando necesites gastar Glamour, se gaste primero el Glamour almacenado en este Recipiente de Glamour.\nSe rellena automáticamente cada mes.#!\nLa Piedra Angular, también conocida como el Ojo de la Apertura, es una esmeralda. Entregada a la custodia de los nocker, abre todo aquello que toca, ya esté simplemente cerrado o bien asegurado con llaves y protecciones. Es lo bastante poderosa para abrir portales que conducen a otros señoríos, siempre que tampoco estén atrancados desde el otro lado. Sin embargo, su verdadero poder reside en su capacidad de abrir los corazones de las personas y en servir como medio para desvelar información que ha sido encerrada u olvidada. Es un estimulador de recuerdos."
 artifact_waystone_name: "Piedra del Camino"
 artifact_waystone_description: "#bold Permite que, cuando necesites gastar Glamour, se gaste primero el Glamour almacenado en este Recipiente de Glamour.\nSe rellena automáticamente cada mes.#!\nLa Piedra del Camino, un zafiro azul profundo, fue entregada a los clurichaun. Es a la vez un guía y un localizador, y conduce a su portador al lugar donde necesita estar o al objeto o persona que necesita encontrar. También tiene un uso más profundo, pues a menudo guía a las personas hacia su destino."
 artifact_changestone_name: "Piedra del Cambio"
 artifact_changestone_description: "#bold Permite que, cuando necesites gastar Glamour, se gaste primero el Glamour almacenado en este Recipiente de Glamour.\nSe rellena automáticamente cada mes.#!\nLa Piedra del Cambio, un rubí ardiente, fue entregada a los sátiros para que la custodiaran. Confiere el poder de cambiar la apariencia de su portador en el mundo mortal y tiende a alterar las circunstancias a su favor, a veces en detrimento de quienes lo rodean. Su verdadera magia, sin embargo, reside en su capacidad de transformar a alguien en su verdadero ser, devolviéndolo a su naturaleza feérica. Algunos creen que la gema incluso puede revertir el proceso de envejecimiento mortal."
 artifact_shadowstone_name: "Piedra de la Sombra"
 artifact_shadowstone_description: "#bold Permite que, cuando necesites gastar Glamour, se gaste primero el Glamour almacenado en este Recipiente de Glamour.\nSe rellena automáticamente cada mes.#!\nLa Piedra de la Sombra, un ópalo negro, fue confiada a los menehune de Hawái. Tiene el poder de absorber y transformar la Banalidad y aumenta la capacidad de su portador para actuar «en las sombras», por ejemplo mediante el sigilo o en la oscuridad. Cuando la usan quienes comprenden la verdadera interacción entre la Banalidad y el Glamour, la gema puede purificar a un changeling, limpiándolo de toda Banalidad sin el desafortunado efecto secundario de provocar el Bedlam. En cierto modo es la más poderosa y peligrosa de las cuatro piedras, pues corrompe inevitablemente a todos salvo a las personalidades más fuertes al insensibilizarlas frente a la dureza de la Banalidad. También envía sueños oscuros."
 artifact_ship_of_the_four_quarters_name: "Nave de los Cuatro Cuartos"
 artifact_ship_of_the_four_quarters_description: "Uno de los grandes tesoros de las hadas de antaño, la Nave de los Cuatro Cuartos tenía una forma muy parecida a la de un drakkar vikingo y los Inanimae la investieron con el poder de controlar los cinco elementos. Fue Conar, de la Casa Dougal, quien supervisó la construcción de la nave, pero fue Kyria Vowseeker, de la Casa Gwydion, quien viajó hasta los señores de los Grandes Imperios Lentos y selló con cada uno de ellos pactos de asistencia. La nave se movía libremente sobre las aguas; durante un breve lapso también podía viajar por tierra, a través de roca y árbol, por el aire o incluso sobre el fuego. Solo hacía falta una persona para gobernar la nave, siempre que el capitán fuera de sangre noble."
 
 artifact_warhorse_name: "[owner.Custom('WarhorseStoryName')]"
 artifact_warhorse_description: "Un caballo de guerra bien adiestrado que obedece todas las órdenes."
 artifact_warhorse_nostory_name: "Caballo"
 artifact_wolf_name: "Lobo"
 artifact_wolf_description: "Pocos sonidos de la naturaleza son más escalofriantes que el aullido de un lobo. De algún modo abarca todo lo que la humanidad teme de lo salvaje, y también todo lo que anhela."
 artifact_bear_name: "Oso"
 artifact_bear_description: "Erguida como un hombre sobre sus robustas patas, la osa habita en lugares fríos y solitarios: reinos densamente boscosos con agua (y peces) cerca."
 artifact_lion_name: "León"
 artifact_lion_description: "Con su pelaje dorado y las largas y pobladas melenas de los machos, los leones son criaturas magníficas."
 artifact_tiger_name: "Tigre"
 artifact_tiger_description: "Enormes, esbeltos y ágiles, estos hermosos animales se mueven veloces entre las sombras de la jungla, camuflados por su pelaje rayado."
 artifact_dragon_name: "[owner.Custom('DragonStoryName')]"
 artifact_dragon_description: "El dragón es el ejecutor irracional del orden natural. Es, literalmente, el azote de la Tierra: el látigo de Su desagrado ante una humanidad presuntuosa. Un gran wyrm encarna la relación del hombre con la naturaleza. En sus relucientes anillos no hallamos un orden natural que conquistar, catalogar y cultivar, sino la furia salvaje de la naturaleza que debe ser aplacada para asegurar la supervivencia.\nAfortunadamente, incluso esas aterradoras criaturas tienen que crecer hasta su tremendo tamaño. Encontrar un dragón pequeño es una hazaña poco común, pero sin duda preferible a encontrar uno adulto."
 artifact_animal_hide_name_dragon: "Piel [owner.Custom('DragonStoryNamePossessive')]"
 artifact_unicorn_name: "[owner.Custom('UnicornStoryName')]"
 artifact_unicorn_description: "El saber moderno describe al unicornio como un caballo magnífico, de un blanco nieve, de larga crin y facciones delicadas, con un cuerno color marfil que se alza de su frente. En realidad, los unicornios tienen poco en común con los caballos salvo el tamaño. La constitución y los rasgos de estas bestias astadas, en particular sus grandes ojos oscuros, se parecen a los de un ciervo. Sus colas miden varios pies de largo y, como la de un león, terminan en un mechón peludo. Cubierto de un suave pelo blanquecino, el cuerpo estilizado de un unicornio está hecho para la velocidad. Los cascos de un unicornio, afilados como garras, se parecen a los de una cabra y son armas formidables."
 artifact_animal_hide_name_unicorn: "Piel [owner.Custom('UnicornStoryNamePossessive')]"
 artifact_pegasus_name: "[owner.Custom('PegasusStoryName')]"
 artifact_pegasus_description: "Tan salvaje y natural como las gemas de las que sus alas toman su coloración —zafiro, rubí, esmeralda y amatista—, un pegaso es una criatura rara y valiosa. Planea por el aire como el azogue, reluciendo al sol y ejecutando maniobras complejas con suma facilidad. Un considerable par de alas se despliega desde sus hombros en vuelo y se pliega suavemente contra su cuerpo en reposo. Sus cascos negros como la obsidiana retumban sobre el suelo con la fuerza del legendario corcel que hendió los riscos en lo alto del Helicón y liberó las aguas sagradas de las Musas."
 artifact_animal_hide_name_pegasus: "Piel [owner.Custom('PegasusStoryNamePossessive')]"
 artifact_dog_name: "[owner.Custom('DogStoryName')]"
 artifact_dog_description: "Un perro leal."
 artifact_cat_name: "[owner.Custom('CatStoryName')]"
 artifact_cat_description: "Un compañero felino."
 
 artifact_blood_blade_name: "Hoja de sangre"
 artifact_blood_blade_description: "Un arma hecha de sangre que causa daño agravado."
 artifact_goblin_sword_name: "Espada goblin"
 artifact_goblin_sword_description: "#bold Puede encarcelar, torturar, ejecutar o herir físicamente a espíritus durante los [single_combat_duel_plural|E].#!\nUna espada ardiente que puede dañar tanto objetos físicos como espirituales."
 artifact_blade_of_stone_name: "Hoja de piedra"
 artifact_blade_of_stone_description: "Un arma de piedra."
 
 artifact_kohl_of_the_hawk_lord_name: "Kohl del Señor Halcón"
 artifact_kohl_of_the_hawk_lord_description: "Este tarro de kohl, un sensual maquillaje de ojos, que nunca se agota, se nutre del poder de una tela de cabeza reliquia largo tiempo muerta. Quien lo lleva no puede quedar deslumbrado ni acalorado por el sol o el fuego, y obtiene una ventaja Social adicional."
 artifact_screens_of_the_harem_name: "Biombos del Harén"
 artifact_screens_of_the_harem_description: "Estos tapices estampados se inspiran en las cortinas reliquia que cubrían a las hermosas almas de A’aru que componían los harenes de los faraones muertos. Se cuelgan donde sean visibles: junto a un campamento, en un tendedero o sobre una ventana. Quien los vea apartará de inmediato la vista hacia otra cosa y olvidará que acudió al lugar o a qué había ido. Las Momias usan estos poderosos filacterios para ocultarse."
 artifact_khopesh_of_balance_name: "Khopesh del Equilibrio"
 artifact_khopesh_of_balance_description: "#bold Como [character_interaction|E], te permite curar las heridas del objetivo.#!\nEste filacterio es un poderoso arma de curación. Una momia lo creó cuando realizó el Nefesh sobre una espada y una antigua caja de ungüento curativo que yacían en el [UmbraGlossaryLocalized('shadowlands','Inframundo')]. Cuando se blande contra alguien mientras la momia gasta Fuerza vital, la espada cura cualquier herida que sufra."
 
 artifact_ideograph_charm_description: "Estos amuletos, que llevan los pictogramas de la antigua escritura kaja, pueden ser de seda, de jade o incluso de papel; el jade, sin embargo, tiende a conservarse mejor."
 
 artifact_soultaker_name: "Tomaalmas"
 artifact_soultaker_description: "#bold Desbloquea las [executions|E] $EXECUTION_SOULTAKER$.\nPermite que, cuando necesites gastar Resolución, se gaste primero la Resolución almacenada en este Recipiente de Resolución.#!\nForjada en el sangriento apogeo de la guerra, Tomaalmas es un arma obscena y terrible. El alma voluntaria de un demonio —cuyo nombre se olvidó hace tiempo— fue vinculada al metal negro, desde donde podía emplear este poder sobre cualquiera a quien tocara la hoja. El roce de la espada drenaba la energía y la vida de todo aquel a quien hería, y si mataba a una víctima, su alma era arrancada de su cadáver y aprisionada en la hoja, donde el demonio original la torturaba y devoraba. Mortales y ángeles por igual cayeron ante Tomaalmas, con su Fe desgarrada para su sustento.\nEntonces el portador de la espada la usó para matar a otro demonio, y la espada cambió. Las dos almas demoníacas lucharon por el dominio dentro de la hoja, sin que ninguna lograra ventaja. Con el tiempo, sus almas empezaron a fundirse la una en la otra, creando una única personalidad fracturada. A medida que las luchas intestinas entre demonios se agravaban en la guerra, más demonios cayeron ante Tomaalmas y sus almas fueron absorbidas por una única entidad demente: un ser que se hacía llamar Legión. Tomaalmas se perdió durante los últimos días de la guerra, oculta en lo profundo de un olvidado depósito de armas, y sin nuevas víctimas que devorar para obtener Fe, Legión se debilitó y adelgazó. Ahora no puede pensar en otra cosa que en comida —Fe— y hará lo que sea por devorar de nuevo almas frescas."
 artifact_the_black_throne_of_genhinnom_name: "El Trono Negro de Genhinnom"
 artifact_the_black_throne_of_genhinnom_description: "Creado por Lucifer, este trono de obsidiana negra y siyr se alzaba en el centro de la Catedral Negra, la ciudad rebelde de Genhinnom, en tiempos de la guerra. Desde este trono, Lucifer comandaba a sus legiones, consultaba con sus generales y lloraba por el destino de la humanidad y la caída de los Elohim. Genhinnom fue destruida por los ángeles tras el envío de los rebeldes al Infierno, pero una ciudad de tal poder y belleza jamás puede ser destruida por completo. Partes de la Catedral Negra aún existen en distintos niveles de la realidad, y todavía puede hallarse el trono negro, la silla de mando de 20 pies de altura.\nEl trono es una silla masiva de piedra y metal. Resulta increíblemente incómodo sentarse en él, pero ese es el precio que hay que pagar por el poder, y el trono es poderoso. Permite al demonio que ocupa la silla comandar legiones de seguidores: cientos o miles de mortales leales que harán casi cualquier cosa a tu servicio."
 artifact_soulforge_name: "La Forja de Almas"
 artifact_soulforge_description: "#bold Como [character_interaction|E], te permite sacrificar a un demonio para matar a todos en el señorío del objetivo.#!\nLa Forja de Almas es una gran jaula ornamentada y angulosa de cobre y otros metales, grabada en cada superficie con runas y sigilos que ya no pueden traducirse. Ganchos y pinchos recubren el interior de la jaula, mientras que cuatro anchas bridas enroscadas irradian desde la parte superior.\nEste terrible artefacto fue fabricado por Schatenkoji el Forjador de Espectros, maestro de la muerte y la invención, uno de los grandes fabricantes de reliquias de la Legión de Ébano durante la Era de la Ira. Permite la matanza de cientos de mortales al capricho de quien lo usa. Las almas de esos muertos pueden luego recogerse y esclavizarse en reliquias demoníacas."
 artifact_somber_axe_name: "Hacha Sombría"
 artifact_somber_axe_description: "De todas las muchas armas empleadas en la Guerra contra el Cielo, las Hachas Sombrías eran especialmente temidas. Dos han sido destruidas y otras cuatro se han perdido o dañado hasta resultar aterradoras solo a escala humana. Pero esta es una de las dos que quedan. Es tan potente como el día en que mató a su primer ángel."
 
 artifact_yin_artifact_name: "[newly_created_artifact.GetNameNoTooltip] yin"
 artifact_ice_artifact_name: "[newly_created_artifact.GetNameNoTooltip] de hielo"
 
 artifact_javaniel_key_name: "Llave de Javaniel"
 artifact_javaniel_key_description: "#bold Es una llave, probablemente abre algo...#!\nParece un pequeño disco de traducción antiguo. Qué se supone que traduce no está claro, ya que lo único legible en él es el nombre «Javaniel»."
 artifact_javaniel_journal_name: "Diario de Javaniel"
 artifact_javaniel_journal_description: "#bold Si se desbloquea, abre un evento único.#!\nUn tomo redondeado cuya cubierta parece hecha de dos finas láminas de ámbar con múltiples inclusiones, lo que le da un aspecto moteado. Encierran páginas de oro batido. La única parte fácilmente legible está en la primera página :#X «Yo soy la llave. En el corazón de mi gemelo revelaré la verdad. Nunca más nos atraparán las mentiras de nuestro padre. Todos conocerán ahora la podredumbre negra que se esconde tras su hermoso rostro. Lee su traición y llora por todos nosotros». #!" 
 artifact_ivory_tablets_name: "Tablillas de marfil"
 artifact_ivory_tablets_description: "#bold Por sí solas no sirven de nada pero, combinadas con su contraparte, podrían ser la clave de algo...#!\nUn conjunto de viejas Tablillas de marfil que parecen casi impermeables al daño. Tienen grabada una historia escrita en un dialecto protochino, pero por sí sola no tiene mucho sentido, como si le faltara una clave para comprenderla de verdad."  
 artifact_dawn_amulet_name: "Amuleto del Alba"
 artifact_dawn_amulet_description: "Un pequeño amuleto de jade usado por un linaje de [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] dedicado a llevar a Zao-Lat ante la justicia. Puede proteger a un no-muerto del sol durante un par de minutos."
 artifact_accursed_dust_name: "Polvo maldito"
 artifact_accursed_dust_description: "Un veneno alquímico fabricado por los Banu Haqim. Al ingerirlo, la víctima queda paralizada rápidamente."
 artifact_ancestor_talisman_name: "Talismán del Ancestro"
 artifact_ancestor_talisman_description: "#bold Otorga inmunidad a la mayoría de los poderes mentales.#!\nUn colgante de oro fundido con la forma del nombre de Haqim en árabe. Solo existen cuatro y se dice que infunden a su portador el ánimo para estar a la altura del nombre de Haqim, a la vez que lo protegen contra la magia inmunda que podría desviarlo de su camino."
 artifact_arrows_vengeance_name: "Flechas de la Venganza"
 artifact_arrows_vengeance_description: "Hechas de madera de espino con las puntas endurecidas al fuego, estas cinco flechas están encantadas para buscar siempre el corazón de su enemigo."
 artifact_amala_doll_name: "Muñeca de Amala"
 artifact_amala_doll_description: "#bold Esta muñeca tiene un valor sentimental y no sirve a nadie más que a Fatima al-Faqadi.#!\nSu primera amiga, su primer amor, su primer asesinato. Fatima se perdonó, pero no olvidó."
 artifact_book_grave_war_name: "Libro de la Guerra de las Tumbas"
 artifact_book_grave_war_description: "Un extraño libro que alterna entre alemán, griego antiguo y minoico; físicamente no tiene nada de especial y parece un manuscrito iluminado de mala calidad.\nEl libro se divide en siete cantos. Cada canto varía enormemente en extensión y estructura, y algunos están enteramente en verso. Otros cantos son en parte poema y en parte prosa, mientras que otros son íntegramente prosa. Cada canto abarca una era de la historia del mundo y describe el jyhad durante ese periodo."
 artifact_khazar_diary_name: "Diario de Khazar"
 artifact_khazar_diary_description: "Aparentemente escrito por un judío hacia el comienzo de la era actual, se rumorea que el Diario de Khazar contiene un ritual que permitiría borrar los límites entre el mundo físico y el [UmbraGlossaryLocalized('shadowlands','Inframundo')]."
 artifact_camilla_crown_name: "Corona de laurel de Camila"
 artifact_camilla_crown_description: "La corona de la vampira políticamente más poderosa desde Caín, la corona de laurel de Camila se ha marchitado con el tiempo, pero sigue siendo un poderoso recordatorio de una era de auténtico liderazgo Ventrue."
 artifact_final_day_name: "Crónica del Último Día"
 artifact_final_day_description: "Una crónica del faraón Akenatón y su intento de abolir la noche. Ayudado por una cábala de poderosos hechiceros, estuvo a punto de lograrlo hasta que una improbable alianza entre los Seguidores de Set y los Hijos de Osiris lo detuvo."
 artifact_testament_seterpenre_name: "Testamento de Seterpenre"
 artifact_testament_seterpenre_description: "Una crónica que describe la versión setita de la historia de Alejandro Magno. Al proclamarlo el mítico Hijo de Set, sus conquistas inauguraron una era de gloria para los Seguidores de Set como no han vuelto a ver otra igual."
 artifact_travels_fedoso_name: "Viajes de Fedoso"
 artifact_travels_fedoso_description: "Escrito por un magus de la Orden de Hermes, este libro narra el largo y arduo, pero en última instancia gratificante, ascenso a la cima de una montaña mística. Tomado como alegoría por muchos Tremere, ven este libro como un reflejo de su propio lugar dentro de la jerarquía piramidal de su clan."  
 artifact_coin_muhammad_name: "Moneda de oro de Mahoma"
 artifact_coin_muhammad_description: "Regalada por Saladino al único digno, un mendigo que llegaría a ser Ibn Ja'far, esta moneda brilla con un lustre sobrenatural. Se sabe que refuerza la [Glossary('Fe Verdadera','game_concept_true_faith_desc')] de quien la posee, pero no puede concederla por sí misma, quizá como una prueba para que la empuñe siempre solo alguien digno."  
 artifact_baizetu_fragment_name: "Fragmento del Bai Ze Tu"
 artifact_baizetu_fragment_description: "#bold Se necesitan cinco fragmentos para reconstruir el libro.#!\nUn legendario grimorio escrito nada menos que por el divino Emperador Amarillo, del que se dice que contiene los secretos de los 11 520 tipos de criaturas sobrenaturales.\nCon el tomo completo en sus manos, uno conocería todas las fortalezas y debilidades de sus enemigos y, con esa sabiduría, sería imparable."  
 artifact_set_phallus_name: "Falo de Set"
 artifact_set_phallus_description: "Los restos momificados de algo que Set dejó atrás durante su batalla culminante contra Horus e Isis en la hacienda de Mestha. Aunque al final resultó victorioso, el dios egipcio perdió aquí una parte de sí mismo que Mestha aún usa para proteger y bendecir a su casa hasta el día de hoy."  
 artifact_fragment_code_samiel_name: "Código fragmentado de Samiel"
 artifact_fragment_code_samiel_description: "#bold El Código puede reconstituirse si se encuentran los dos fragmentos.#!\nEl más grande del linaje guerrero de Saulot, el mártir fundador Samiel, se cree que escribió este texto de su puño y letra. Según la leyenda, Samiel recibió la visita de Miguel, comandante de las Huestes Celestiales, mientras Saulot estaba ausente. El arcángel ordenó al rey guerrero que escribiera el Código y que incluyera en él los rituales adecuados para la fortaleza y el bautismo de sangre de los nuevos guerreros.\nUna de las copias del texto quedó hecha añicos durante los días oscuros posteriores a la muerte de Saulot. Este es uno de los fragmentos de ese texto."  
 artifact_scroll_enlightenment_name: "Pergamino de la Iluminación"
 artifact_scroll_enlightenment_description: "Un triunvirato de Antiguos se reunió una vez con diversos seres iluminados, desde monjes tibetanos y sabias aborígenes hasta poderosos magos e incluso Lupinos ancianos. Estas conversaciones y sus hipótesis quedaron registradas en una serie de 13 pergaminos que aún son la base de una secta de Gehenna llamada el Culto de la Iluminación hasta esta noche."  
 artifact_book_hidden_stars_name: "Libro de las Estrellas Ocultas"
 artifact_book_hidden_stars_description: "En el apogeo del poder de Babilonia, una cábala de hechiceros astrólogos descubrió un modo de ver las estrellas ocultas y, con ello, aumentar enormemente su poder y su esperanza de vida. Dividieron su obra en siete tablillas que más tarde fueron saqueadas por el rey Ciro de Persia. Un erudito de su corte logró transcribir las tablillas en un libro antes de destruirlas y huir de Persia. El rastro continúa luego hasta Constantinopla y finalmente Túnez, donde algunos sospechan que el libro aún reside."  
 artifact_nightmare_horse_name: "Pesadilla"
 artifact_nightmare_horse_description: "El corpulento caballo de Vladimir Rustovitch, un horror espectral que ha acompañado a su amo en muchas campañas."  
 artifact_sorn_name: "Sorn"
 artifact_sorn_description: "Un palafrén negro con algunos destellos de blanco dorado, Sorn es un caballo tranquilo y afable. Sin embargo, cuando se le espolea, se dice que es el caballo más veloz de Europa occidental."  
 artifact_sorel_name: "Sorel"
 artifact_sorel_description: "Un regalo de la propia Isouda a su amado Chiquillo Josselin, Sorel lo acompaña desde que era potro. Tan regio como galante es su amo, Sorel tiene un paso absurdamente seguro y se dice que ningún peligro lo inquieta."  
 artifact_vozhd_palanquin_name: "Palanquín Vozhd"
 artifact_vozhd_palanquin_description: "Koban cabalga a la guerra sentado sobre un palanquín de hueso tallado con incrustaciones de elaborados patrones de filigrana de oro. Las cabezas de finos caballos árabes sirven de reposabrazos. Solo cuando relinchan en voz baja y el palanquín se pone en pie por sí solo se advierte que en realidad es un Ghoul de guerra Vozhd compuesto enteramente por bestias de carga.\nNo sorprenderá a nadie que Koban no crea demasiado en el concepto de «pasar desapercibido» ni en el Silencio de la Sangre."  
 artifact_the_alexiad_name: "La Alexiada"
 artifact_the_alexiad_description: "Un texto histórico y biográfico escrito hacia el año 1148 por la princesa bizantina Ana Comnena, hija del emperador Alejo I Comneno. Fue redactado en una forma de griego ático artificial. Ana describió la historia política y militar del Imperio bizantino durante el reinado de su padre.\nEntre otros temas, la Alexíada documenta la interacción del Imperio bizantino con las Cruzadas y pone de relieve las percepciones enfrentadas de Oriente y Occidente a comienzos del siglo XII."  
 
