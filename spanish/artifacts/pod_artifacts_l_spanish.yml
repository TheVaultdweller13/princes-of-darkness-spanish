 artifact_fleshcrafted_artifact_name: "[scope:recipient.GetTitledFirstNameNoTooltip]"
 artifact_fleshcrafted_artifact_description: "Un artefacto modelado en carne que en su día fue [scope:recipient.GetTitledFirstNameNoTooltip], muerto por [owner.GetTitledFirstNameNoTooltip]."