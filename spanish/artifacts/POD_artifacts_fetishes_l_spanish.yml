l_spanish: 


 fetish_no_gnosis: "Los [fetishes|E] requieren al menos 5% de regeneración de $POD_energy_gnosis$ para permanecer activos."
 fetish_no_companion: "Los [fetishes|E] requieren un [spirit_companion|E] por cada [fetish|E] equipado para permanecer activos."




#Spirit Quests
 artifact_lepers_rags_name: "[fetish_artifact_icon]Trapos del Leproso"
 artifact_lepers_rags_description: "Esta capa mugrienta y llena de piojos, cuando se usa, permite al portador asumir la forma de un mendigo modesto, sin importar lo que fuera antes, permitiendo una enorme variedad de opciones para la Intriga."
 artifact_trail_branch_name: "[fetish_artifact_icon]Rama de Sendero"
 artifact_trail_branch_description: "Una pequeña rama tomada de la maleza, vinculada con un espíritu de los salvajes, esta ramita cubre las huellas de uno y hace que atravesar la naturaleza sea mucho más fácil, ya que el espíritu en su interior guía a su portador."
 artifact_feather_of_the_waters_name: "[fetish_artifact_icon]Pluma de las Aguas"
 artifact_feather_of_the_waters_description: "Una capa de plumas hecha de aves no voladoras inusuales del lejano sur; esta capa abrigada permite que cualquier ser con Gnosis nade con la misma facilidad que un pez, permitiéndoles extender los lugares a los que pueden ir con una capacidad tremenda."
 artifact_heart_of_fire_name: "[fetish_artifact_icon]Corazón de Fuego"
 artifact_heart_of_fire_description: "Un fetiche sorprendentemente peligroso; este diminuto cristal rojo permite a su dueño prender fuego a los objetos, algo pequeño pero asombrosamente letal para tener a mano."
 artifact_stone_of_wealth_name: "[fetish_artifact_icon]Piedra de la riqueza"
 artifact_stone_of_wealth_description: "Este fetiche parece no ser más que una antiquísima piedra de la "preocupación". Al frotarla, trae riqueza a su usuario. La riqueza no siempre significa dinero, ni la riqueza invocada llega necesariamente al instante. En su lugar, la piedra proporciona los recursos que el usuario necesita para cumplir sus tareas."
 artifact_dragon_crystal_name: "[fetish_artifact_icon]Cristal de dragón"
 artifact_dragon_crystal_description: "Se trata de una piedra semipreciosa o un trozo de ámbar pulido en forma de lente, planchette o disco y engastado en un collar, etc. Al activarse, revela la presencia de un auténtico Mokolé; si el usuario mira a través de él al sujeto, este aparece en su forma Archid, y si se toca el cuerpo de un Mokolé, la piedra brilla con la luz del Sol. Por este motivo, las gemas se usan a veces como joyería en una Gather."
 artifact_hatchlings_tail_name: "[fetish_artifact_icon]Cola de cría"
 artifact_hatchlings_tail_description: "Este fetiche parece no ser más que la cola seca de un lagarto, pero, cuando un Mokolé lo lleva sujeto al cinturón, le ayuda a transformarse en su forma Archid. Este objeto lo usan sobre todo las crías que aún no han ganado experiencia en combate; la mayoría "superan" el fetiche al madurar y se lo pasan a los Mokolé más jóvenes."
 artifact_egg_basket_name: "[fetish_artifact_icon]Cesta de huevos"
 artifact_egg_basket_description: "Se trata de una cesta que sirve para guardar una nidada de huevos de Mokolé. La cesta en sí tiene el tamaño de un solo huevo, pero puede contener una nidada entera con facilidad. Los huevos que se colocan en su interior conservan muy bien la temperatura. Por supuesto, la desventaja es que la cesta es tan vulnerable a la destrucción como cualquier otro recipiente, y dentro hay una nidada completa. Durante la Guerra de la Furia, más de una nidada se perdió por completo cuando guerreros Garou destruyeron descuidadamente tales cestas."





 artifact_fish_swatter_name: "[fetish_artifact_icon]Espantapeces"
 artifact_fish_swatter_description: "Al golpear el agua con este palo, los peces saltarán hacia la orilla, tal como si un oso los sacara del agua de un golpe."
 artifact_leaf_armor_name: "[fetish_artifact_icon]Armadura de hojas"
 artifact_leaf_armor_description: "Esta camisa de hojas no pesa casi nada y, sin embargo, ofrece una gran protección contra el daño físico."
 artifact_bent_vine_name: "[fetish_artifact_icon]Enredadera doblada"
 artifact_bent_vine_description: "La Enredadera doblada no es más que un trozo de enredadera marchito y seco con un glifo grabado meticulosamente. Con no más de siete centímetros de largo, es totalmente insignificante a la vista. Sin embargo, cuando se deja sobre cualquier tipo de suelo, la Enredadera doblada cobra vida como una horda positiva de verdor. La ola resultante de enredaderas es agresiva, peligrosa e inclinada a agarrar cualquier cosa cercana con el fin de tirar de ella en múltiples direcciones. Como resultado, las Enredaderas dobladas constituyen una excelente cobertura para una retirada apresurada ante una persecución agresiva."
 artifact_gnostic_bag_name: "[fetish_artifact_icon]Bolsa gnóstica"
 artifact_gnostic_bag_description: "La Bolsa gnóstica es una pequeña bolsa de cuero con flecos, pinturas extrañas y pictogramas. La bolsa contiene literalmente Gnosis. Para activarla, el usuario mete la mano en la bolsa, "agarra" una Gnosis y se la come."
 artifact_spirit_jar_name: "[fetish_artifact_icon]Tarro de espíritus"
 artifact_spirit_jar_description: "Similar a cierta parafernalia de vodun, este fetiche es un tarro de cerámica hecho a mano con la tapa sellada con alquitrán o cera. Contiene un espíritu aprisionado. El propietario puede negociar con el espíritu, prometiéndole favores a cambio del uso de sus poderes. Los favores que el propietario podría prometer incluyen dar Gnosis al espíritu, permitirle poseer a un médium o liberarlo. Si el tarro se rompe, el espíritu queda libre."
 artifact_seeing_boomerang_name: "[fetish_artifact_icon]Búmeran de visión"
 artifact_seeing_boomerang_description: "El Búmeran de visión ayuda a inspeccionar grandes áreas, especialmente cuando estás rodeado. Vinculado a un espíritu búho, el Búmeran de visión está diseñado deliberadamente para ser ligero y tener un vuelo estable. Está diseñado para regresar fácilmente, en lugar de ser un instrumento de caza, y está pintado con dos ojos grandes en su parte inferior. Al activarse y lanzarse, el búmeran envía una imagen del suelo debajo de él directamente al centro visual del usuario, permitiéndole obtener una vista de pájaro de la zona circundante."
 artifact_kurdaitcha_name: "[fetish_artifact_icon]Kurdaitcha"
 artifact_kurdaitcha_description: "Son zapatos hechos de plumas de emú anudadas con pelo humano y pegadas con el equivalente a un nivel de salud de la sangre del usuario. El fabricante debe vincular a un espíritu sirviente de Tokampini, el pájaro demonio, en los zapatos. Al activarse, los zapatos impiden que nadie oiga las pisadas de quien los lleva."
 artifact_warshell_name: "[fetish_artifact_icon]Concha de guerra"
 artifact_warshell_description: "Se trata de una concha con forma triangular y afilada. Puede cortar a un enemigo a distancia; el usuario simplemente hace un tajo hacia el enemigo con la concha. La propia concha es bastante resistente y también puede servir como escudo."
 artifact_beggars_mantle_name: "[fetish_artifact_icon]Manto del mendigo"
 artifact_beggars_mantle_description: "Este fetiche, tejido con harapos y piel de serpiente mudada, protege la verdadera gloria de una persona de los ojos de los seres malignos. Al activarse, el manto los hace completamente invisibles para los Vampiros, los Banes, los $glossary_fera$ caídos y otras criaturas del $glossary_wyrm$: simplemente pasan por alto al usuario."
 artifact_horn_of_distress_name: "[fetish_artifact_icon]Cuerno de auxilio"
 artifact_horn_of_distress_description: "Estos cuernos están destinados a sonar solo en momentos de extrema necesidad. Su apariencia varía según la cultura y a menudo llevan las marcas de la tribu del fabricante. Cuando se activa con éxito, un cuerno de auxilio alerta a todos los hombres lobo, independientemente de su tribu, en un radio de 16 kilómetros. Pueden elegir responder al llamado o no, pero saben que el cuerno significa «Pariente en peligro». Estos cuernos suelen contener espíritus de pavo real, ganso o del aire."



 artifact_tokoyanga_name: "[fetish_artifact_icon]Tokoyanga"
 artifact_tokoyanga_description: "#bold Puede usarse para eliminar un [trait|E] de [stress|E] negativo#!\n\nSe trata de una bola de plumón de ganso que se lleva alrededor del cuello y está imbuida con un espíritu pájaro. Disipa la tristeza, y cualquiera que la muerda no podrá llorar. Además, nada de lo que diga el portador es audible para ningún reptil grande."
 artifact_mirror_amaterasu_omikami_name: "[fetish_artifact_icon]Espejo de Amaterasu Omikami"
 artifact_mirror_amaterasu_omikami_description: "Este espejo es de bronce, con un diseño solar moldeado en la parte posterior. Solo existen unos pocos espejos así, que se dice fueron fundidos a partir de los fragmentos del espejo utilizado por los cuervos para persuadir al Sol para que saliera de su escondite hace mucho tiempo. Aunque la cara parece normal y refleja como cualquier otro espejo, el reflejo del espejo contiene la imagen moldeada en la parte posterior. Además, el espejo puede usarse para almacenar la luz del Sol. Para ello, el usuario debe exponer el espejo a la luz solar durante varias horas y gastar un número de Gnosis igual al número de horas. Cuando más tarde pronuncien el nombre del Sol y activen el fetiche, la luz del Sol brillará desde el espejo como en un día sin nubes."



 artifact_echo_of_ages_name: "[fetish_artifact_icon]Eco de las eras"
 artifact_echo_of_ages_description: "#bold Puede usarse para aprender una nueva [innovation|E] aleatoria; este efecto solo puede usarse una vez.#!\n\nLos Mokolé recuerdan mucho; es su labor. Pero simplemente no hay suficientes para haber estado en todas partes en todas las épocas. Inevitablemente, hay grandes lagunas en la memoria de Gaia en muchos lugares distintos. Sin embargo, el Eco de las Eras puede ayudar a llenar esas lagunas. El Eco de las Eras es una campana dorada con pequeñas runas grabadas alrededor del borde. En esta campana está ligado el espíritu de una tortuga. Cuando se activa y suena, la campana resuena en el pasado de la zona y recrea imágenes y sonidos fantasmales de los sucesos que allí ocurrieron. Cuanto más fuerte suena la campana, más atrás en el pasado llega el Eco."
 artifact_bowl_of_mnesis_name: "[fetish_artifact_icon]Cuenco de Mnesis"
 artifact_bowl_of_mnesis_description: "#bold Puede sacrificar un [ancestor_spirit|E] para ganar experiencia de estilo de vida de Mnesis [lifestyle_experience|E] o, raramente, un punto de [skill|E].\n\nEste sencillo cuenco de barro es sagrado para los Mokolé. Incluso poseer conocimiento de este artefacto es una sentencia de muerte para cualquiera que no sea Mokolé. Este cuenco puede usarse para preservar los recuerdos de un Espíritu Ancestral Mokolé. El Rango del espíritu refleja la cantidad de memoria que se puede recuperar; en casos extremadamente raros, el usuario puede incluso retener la fuerza del Espíritu. Los Mokolé honran verdaderamente a aquellos elegidos para que sus recuerdos sean preservados de este modo; este fetiche nunca se usa a la ligera."




#Umbra
 artifact_klaive_name: "[fetish_artifact_icon]Klaive"
 artifact_klaive_description: "Las armas más famosas de todos los Garou: esta hoja es un arma malvada con filo de plata, un arma sagrada empuñada por los Garou, más fuerte que cualquier espada y con un espíritu ligado en su interior. Todo aquel que no sea Garou y la empuñe es perseguido sin descanso por su blasfema transgresión."
 artifact_eternal_waterskin_name: "[fetish_artifact_icon]Odre de agua eterno"
 artifact_eternal_waterskin_description: "Benigno pero útil, este odre de piel de vaca, cuando se llena con agua, nunca se agota por mucho que se beba de él. Lamentablemente para muchas tribus, esto solo funciona con agua dulce, ya sea recogida de la lluvia o hervida, y no funciona con cosas como el hidromiel o el vino."
 artifact_beff_of_ice_name: "[fetish_artifact_icon]Beff de hielo"
 artifact_beff_of_ice_description: "Una pequeña aguja hecha de hielo azul que encierra plata; este fetiche de valor único permite erradicar la enfermedad, ya que el usuario es capaz de literalmente sacudir la infección mediante escalofríos, a medida que el espíritu del hielo purga el sistema del usuario de enfermedades o, lo que es más valioso, venenos."
 artifact_spirit_astrolabe_name: "[fetish_artifact_icon]Astrolabio espiritual"
 artifact_spirit_astrolabe_description: "Este astrolabio maravillosamente fabricado, vinculado con espíritus de las olas, es una fuente de guía increíble para cualquier Antiguo que utilice esta reliquia, permitiéndole atravesar los velos de la distancia con total facilidad."
 artifact_truth_earring_name: "[fetish_artifact_icon]Pendiente de la verdad"
 artifact_truth_earring_description: "La perdición de todos los cónyuges infieles; estos fetiches, vinculados con espíritus del honor, permiten a quienes los portan atravesar con mayor precisión los velos de la mentira y extraer mejor las pepitas de verdad de los océanos de engaños."
 artifact_blanket_of_peaceful_past_name: "[fetish_artifact_icon]Manta de un pasado pacífico"
 artifact_blanket_of_peaceful_past_description: "Un fetiche de paz que, al ser usado, permite que el espíritu materno en su interior Abrace al usuario, dejándole, aunque sea por un breve momento, volver a ser un pequeño niño o cachorro, cuando el mundo tenía sentido y nada más importaba; un bendito escape de los horrores del Mundo de Tinieblas, para ser sostenido de nuevo por una madre amorosa o dormir a su lado."
 artifact_dark_mask_name: "[fetish_artifact_icon]Máscara oscura"
 artifact_dark_mask_description: "Sujeto a mucho debate, se desconoce el origen de este extraño fetiche, pero su poder es evidente. Las sombras se doblan y se contorsionan para ayudar al portador, distorsionando la luz y desdibujando al usuario, inspirando un terrible Temor en todos los que lo ven."
 artifact_eyes_of_the_night_name: "[fetish_artifact_icon]Ojos de la noche"
 artifact_eyes_of_the_night_description: "Un fetiche absolutamente extraño; este cuenco de hierro, cuando se hace girar en el aire, permite que las zonas locales de día y noche se inviertan en términos de luz, una herramienta de escape increíblemente útil para causar un choque de brillo o de oscuridad a cualquier atacante mientras sus ojos se ajustan, permitiendo que la víctima potencial escape ilesa o, mejor dicho, que ejerza su venganza sobre otra pobre víctima..."
 artifact_kinship_doll_name: "[fetish_artifact_icon]Muñeca de parentesco"
 artifact_kinship_doll_description: "Tomando la forma de la muñeca de un niño pequeño, este fetiche está destinado a actuar como enlace para que la Parentela hable con un $glossary_fera$, permitiéndoles comunicarse y mantener el contacto a largas distancias, para que nunca estén lejos de su pareja."
 artifact_law_skull_name: "[fetish_artifact_icon]Cráneo de la ley"
 artifact_law_skull_description: "Uno de los fetiches más macabros: este cráneo de un garou traidor, al activarse, puede recitar $glossary_werewolf_litany$ y exigir juramentos a los presentes. Que alguien llegue siquiera a usar este fetiche ya es bastante aterrador..."
 artifact_moongleam_name: "[fetish_artifact_icon]Destello lunar"
 artifact_moongleam_description: "Esta pequeña piedra puede activarse en cualquier momento de la noche y, al hacerlo, brilla como una vela sin riesgo de incendio, otorgando el don de luz variable en la noche sin exponerse al abrasador abrazo de las llamas."
 artifact_air_foot_greaves_name: "[fetish_artifact_icon]Grebas de pie de aire"
 artifact_air_foot_greaves_description: "Un par de sencillas espinilleras con alas grabadas; este fetiche, vinculado con espíritus del viento, cuando el portador las golpea entre sí, le permite moverse con una velocidad cegadora, capaz de llevarle a casi cualquier campo que el usuario desee."
 artifact_sun_axe_name: "[fetish_artifact_icon]Hacha solar"
 artifact_sun_axe_description: "Un hacha adornada con cuentas doradas; esta cruel arma, además de poder despedazar a los hijos de $glossary_helios$, al activarse puede arder con luz solar y da al portador $glossary_fera$ un arma preciosa contra las temidas sanguijuelas, para poner fin a su tiranía de la noche."
 artifact_whistle_caff_name: "[fetish_artifact_icon]Silbato Caff"
 artifact_whistle_caff_description: "Un pequeño silbato de madera y hueso tallado con glifos, vinculado con el espíritu de un mamífero recién nacido; al soplarlo, emite un grito silencioso de ayuda, alertando a la familia y amigos del usuario para que acudan en su auxilio."
 artifact_book_of_the_spirits_secrets_name: "[fetish_artifact_icon]Libro de los secretos de los espíritus"
 artifact_book_of_the_spirits_secrets_description: "Este tomo de vitela, vinculado con espíritus de la sabiduría, al leerse por completo, revela muchos secretos sobre la [umbra|E] y el mundo de los espíritus. Un libro de texto para cualquier Teúrgo, este valioso texto es esencial para cualquier legendario invocador de espíritus."
 artifact_feathered_cloak_name: "[fetish_artifact_icon]Capa de plumas"
 artifact_feathered_cloak_description: "Uno de los fetiches más buscados por una razón sencilla. Los poseedores de este precioso fetiche, vinculado con espíritus del viento, obtienen la capacidad de volar con la misma destreza que un murciélago; la capacidad de surcar los cielos es un sueño que el portador podría alcanzar finalmente."
 artifact_tangling_lance_name: "[fetish_artifact_icon]Lanza enredadera"
 artifact_tangling_lance_description: "Esta lanza desgastada de zarzas se asemeja a la cola de un gran lagarto; parece una lanza de justa de mala factura, pero al ser activada, la lanza se divide y se convierte en algo similar a la cola de un lagarto gigante, azotando y atrapando a los ahora aterrorizados enemigos del portador."
 artifact_time_piece_name: "[fetish_artifact_icon]Reloj de arena"
 artifact_time_piece_description: "Este curioso fetiche toma la forma de un medio para contar el tiempo, generalmente un reloj de arena o un reloj de sol, que al ser activado, tuerce sutilmente el flujo del tiempo para entorpecer a todos aquellos que no estén cerca del objeto en el momento de la activación."
 artifact_wind_hammer_name: "[fetish_artifact_icon]Martillo de viento"
 artifact_wind_hammer_description: "Este gran y pesado martillo de guerra, al ser activado, hace que el fetiche se disuelva en una tormenta de vientos, permitiendo al usuario golpear como un torbellino furioso, un inigualable faro de carnicería."
 artifact_bindrune_amulet_name: "[fetish_artifact_icon]Amuleto de runas vinculadas"
 artifact_bindrune_amulet_description: "Este amuleto de plata tiene glifos grabados en su superficie y escritos en la lengua de los Garou; este precioso fetiche permite canalizar el poder del lenguaje y aprovechar las palabras, ofreciendo una visión de la mística del lenguaje mismo."
 artifact_cloud_string_name: "[fetish_artifact_icon]Cuerda de nubes"
 artifact_cloud_string_description: "Esta cuerda de cordel y cuentas, al desplegarse, se eleva por los aires y guía entonces a los cielos, permitiendo controlar la lluvia y el clima. Esta poderosa habilidad permite traer riqueza y prosperidad a una región, un rasgo increíblemente útil para tribus como los Guardianes de los Hombres, pero menos para otras tribus."
 artifact_horn_of_the_white_stag_name: "[fetish_artifact_icon]Cuerno del ciervo blanco"
 artifact_horn_of_the_white_stag_description: "Una de las tres reliquias sagradas perdidas de la Colina de Tara; este enorme cuerno de caza, al ser tocado con fuerza, hace que los soldados acudan al lado del que lo toca mientras el ejército marcha con una velocidad cegadora."
 artifact_golden_torc_name: "[fetish_artifact_icon]Torc de oro"
 artifact_golden_torc_description: "Una de las tres reliquias sagradas perdidas de la Colina de Tara; esta corona inmaculada fue antaño el emblema del cargo de los Altos Reyes Fianna de Eiru, una reliquia preciada que es un símbolo potente de una nobleza muy antigua."
 artifact_crones_tongue_name: "[fetish_artifact_icon]Lengua de la Anciana"
 artifact_crones_tongue_description: "Una de las tres reliquias sagradas perdidas de la Colina de Tara, la Lengua de la Anciana es una espada larga sorprendentemente sencilla, pero en presencia de siervos del Wyrm brilla con una luz ardiente y su hoja muerde mucho peor que incluso las garras de un Garou."
 artifact_beast_mask_name: "[fetish_artifact_icon]Máscara de la Bestia"
 artifact_beast_mask_description: "Una máscara de Cambio de Forma que, al ser usada, provoca que el usuario se transforme en el animal que representa, otorgándole la movilidad adicional de dicho animal y su naturaleza inocua, para cualquier deseo del portador."
 artifact_belt_of_the_giants_name: "[fetish_artifact_icon]Cinturón de los Gigantes"
 artifact_belt_of_the_giants_description: "Este fetiche rarísimo, cuando su portador lo activa, hace que este duplique su tamaño, aumente enormemente su fuerza y siembre el caos. La desventaja, sin embargo, es que el corazón no crece de tamaño, lo que supone una tensión horrible para el cuerpo del usuario."
 artifact_cloak_of_woven_mists_name: "[fetish_artifact_icon]Capa de Nieblas Tejidas"
 artifact_cloak_of_woven_mists_description: "La Capa de Nieblas Tejidas parece un collar de cadena trenzada con un intrincado broche. Cuando su portador la activa, sombras y vapores se elevan en el aire y lo vuelven borroso e indistinto, lo que lo hace increíblemente sigiloso, tan silencioso como el susurro de una corriente de aire."
 artifact_staff_of_life_name: "[fetish_artifact_icon]Bastón de la Vida"
 artifact_staff_of_life_description: "Un gran bastón de caminar que puede servir también como maza; este útil fetiche puede fortalecer la salud del portador y protegerlo del daño mediante el refuerzo de su vitalidad."
 artifact_bone_flute_name: "[fetish_artifact_icon]Flauta de Hueso"
 artifact_bone_flute_description: "Una reliquia ingeniosa que inspira dolor contra los no-muertos, calma a los vivos, y aquellos que la escuchan no pueden evitar respetar aún más a su señor."
 artifact_forest_crown_name: "[fetish_artifact_icon]Corona del Bosque"
 artifact_forest_crown_description: "Un fetiche con forma de corona de zarzas que se ajusta a la cabeza del portador, convirtiéndose en un icono de soberanía; el espíritu de la naturaleza salvaje los inspira para ser señores soberanos de la selva."
 artifact_iron_crown_name: "[fetish_artifact_icon]Corona de Hierro"
 artifact_iron_crown_description: "Un fetiche con forma de corona de hierro que se ajusta a la cabeza del portador, convirtiéndose en un icono de soberanía; el espíritu de nobleza en su interior los inspira hacia épicas alturas de liderazgo y, como tal, fue favorecido en eras antiguas por los Guardianes de los Hombres."
 artifact_keystone_name: "[fetish_artifact_icon]Piedra Angular"
 artifact_keystone_description: "Esta piedra rúnica, siempre que se presiona contra un material pétreo, permite que este se abra como una puerta, dejando pasar al usuario a través de casi cualquier obstáculo de piedra."
 artifact_dreamcaller_name: "[fetish_artifact_icon]Llamador de Sueños"
 artifact_dreamcaller_description: "Esta flauta increíblemente valiosa permite abrir grietas hacia los sueños, permitiendo bailar y aprender dentro de ellos, y explorar las profundidades de la mente pensante para obtener cualquier tipo de revelación."
 artifact_harp_of_enchantment_name: "[fetish_artifact_icon]Arpa de Encantamiento"
 artifact_harp_of_enchantment_description: "Esta arpa, al ser pulsada, libera una hermosa melodía concordante, una sonata verdaderamente sobrecogedora que puede hacer llorar incluso al Garou más curtido en la guerra que esté en harano."
 artifact_iceblade_name: "[fetish_artifact_icon]Hoja de Hielo"
 artifact_iceblade_description: "Una preciosa hoja hecha de hielo azul imperturbable del norte ártico; esta arma pálida golpea con el mismo frío del norte mordaz, permitiendo al mismo tiempo atravesar los elementos como si fuera verano."
 artifact_lionfang_name: "[fetish_artifact_icon]Colmillo de León"
 artifact_lionfang_description: "Este potente fetiche está tallado con los colmillos de una bestia terrible, con rumores de haber sido incluso robado a los Bastet, haciendo que esta arma increíblemente peligrosa golpee con la misma fuerza que uno de los rivales más antiguos de la nación Garou."
 artifact_ring_of_the_elements_name: "[fetish_artifact_icon]Anillo de los Elementos"
 artifact_ring_of_the_elements_description: "Uno de los fetiches más potentes; un Anillo de los Elementos otorga a un Garou poder sobre los cuatro elementos: tierra, aire, fuego y agua. Al activarse, un Garou no puede ser dañado por ataques que involucren estas fuerzas. Por ejemplo, las antorchas se negarían a quemar a un Garou, las piedras o incluso una espada de metal rebotarían inofensivamente en su piel, y no se ahogaría bajo el agua."
 artifact_grand_klaive_name: "[fetish_artifact_icon]Gran Klaive"
 artifact_grand_klaive_description: "Las klaives de los héroes más poderosos; estas armas legendarias superan a las klaives en todos los aspectos, y el espíritu de guerra ligado en su interior aúlla de furia por la muerte de los enemigos del portador."
 artifact_forge_crusher_name: "[fetish_artifact_icon]Rompe-Forja"
 artifact_forge_crusher_description: "Uno de los Martillos Jarl; estos poderosos martillos de dos manos son la cumbre de la artesanía. Al igual que las klaives menores, estos martillos están forjados con plata y templados en la sangre de los enemigos de Gaia. El Rompe-Forja, cuando se usa, arde con una llama rugiente, capaz de infligir un dolor horrible."
 artifact_grinding_tooth_name: "[fetish_artifact_icon]Diente de Molienda"
 artifact_grinding_tooth_description: "Uno de los Martillos Jarl; estos poderosos martillos de dos manos son la cumbre de la artesanía. Al igual que las klaives menores, estos martillos están forjados con plata y templados en la sangre de los enemigos de Gaia. El Diente de Molienda puede moler cualquier piedra hasta convertirla en polvo, reduciendo a nada toda la tierra ante él."
 artifact_spear_chaser_name: "[fetish_artifact_icon]Perseguidor de Lanzas"
 artifact_spear_chaser_description: "Uno de los Martillos Jarl; estos poderosos martillos de dos manos son la cumbre de la artesanía. Al igual que las klaives menores, estos martillos están forjados con plata y templados en la sangre de los enemigos de Gaia. Este impresionante martillo vuela cuando se lanza, proyectándose a distancias increíbles, siendo imposible de romper durante un lanzamiento."
 artifact_troll_eater_name: "[fetish_artifact_icon]Devorador de Trolls"
 artifact_troll_eater_description: "Uno de los Martillos Jarl; estos poderosos martillos de dos manos son la cumbre de la artesanía. Al igual que las klaives menores, estos martillos están forjados con plata y templados en la sangre de los enemigos de Gaia. El Devorador de Trolls, más que cualquier otro Martillo Jarl, oblitera la armadura, desgarrándola como corteza de abedul."
 artifact_bright_arm_name: "[fetish_artifact_icon]Brazo-Brillante"
 artifact_bright_arm_description: "Uno de los Martillos Jarl; estos poderosos martillos de dos manos son la cumbre de la artesanía. Al igual que las klaives menores, estos martillos están forjados con plata y templados en la sangre de los enemigos de Gaia. Brazo-Brillante, cuando se empuña, brilla como el sol, zumbando con luz y cegando a los oponentes."
 artifact_hag_talon_name: "[fetish_artifact_icon]Garra de Bruja"
 artifact_hag_talon_description: "Uno de los Martillos Jarl; estos poderosos martillos de dos manos son la cumbre de la artesanía. Al igual que las klaives menores, estos martillos están forjados con plata y templados en la sangre de los enemigos de Gaia. Garra de Bruja protege la mente de quien la porta, otorgándole defensas mentales sin parangón."
 artifact_pain_eagle_name: "[fetish_artifact_icon]Águila del Dolor"
 artifact_pain_eagle_description: "Uno de los Martillos Jarl; estos poderosos martillos de dos manos son la cumbre de la artesanía. Al igual que las klaives menores, estos martillos están forjados con plata y templados en la sangre de los enemigos de Gaia. Águila del Dolor es el más ruinoso de los Martillos Jarl, dejando heridas palpitantes y agónicas."
 artifact_runestone_of_gab_name: "[fetish_artifact_icon]Piedra rúnica de Gab"
 artifact_runestone_of_gab_description: "Una colección de preciosas piedras proféticas; estas piedras de lectura, fuertemente encantadas, ofrecen al usuario valiosas visiones del futuro. Estas piedras rúnicas ofrecen claves fundamentales sobre el arte de la conversación, permitiendo al usuario convertirse en un maestro de la oratoria."
 artifact_runestone_of_war_name: "[fetish_artifact_icon]Piedra rúnica de la Guerra"
 artifact_runestone_of_war_description: "Una colección de preciosas piedras proféticas; estas piedras de lectura, fuertemente encantadas, ofrecen al usuario valiosas visiones del futuro. Estas piedras rúnicas en particular están habitadas por un espíritu de guerra, otorgando al usuario un conocimiento absoluto del campo de batalla incluso antes de que las tropas pisen los campos de guerra."
 artifact_runestone_of_control_name: "[fetish_artifact_icon]Piedra rúnica del Control"
 artifact_runestone_of_control_description: "Una colección de preciosas piedras proféticas; estas piedras de lectura, fuertemente encantadas, ofrecen al usuario valiosas visiones del futuro. Estas piedras pueden predecir el flujo del comercio y la población, otorgando al usuario una visión sin igual en asuntos de Administración."
 artifact_runestone_of_cunning_name: "[fetish_artifact_icon]Piedra rúnica de la Astucia"
 artifact_runestone_of_cunning_description: "Una colección de preciosas piedras proféticas; estas piedras de lectura, intensamente encantadas, ofrecen al usuario valiosas visiones del futuro. Permiten mantener y controlar Conjuras de una complejidad bizantina y vertiginosa, y convierten al usuario en un maestro espía sin igual."
 artifact_runestone_of_wisdom_name: "[fetish_artifact_icon]Piedra rúnica de la Sabiduría"
 artifact_runestone_of_wisdom_description: "Una colección de preciosas piedras proféticas; estas piedras de lectura, fuertemente encantadas, ofrecen al usuario valiosas visiones del futuro. Estas piedras revelan poderosas visiones de teología y medicina, otorgando al usuario profundos conocimientos sobre las Tradiciones místicas."
 artifact_klaive_hammer_name: "[fetish_artifact_icon]Martillo Klaive"
 artifact_klaive_hammer_description: "Aunque solo un Garou puede realizar los ritos necesarios para crear una klaive, algunos hábiles herreros de la Parentela están entrenados para forjar el arma real destinada a ser el recipiente del espíritu. Un martillo klaive es un fetiche diseñado para ayudar a la Parentela a crear un arma tan perfecta en su forma que complazca al espíritu o espíritus a los que se les pide que la imbuyan de poder. El herrero debe gastar Gnosis al usar el martillo para fabricar una klaive. Este gasto es parte del proceso que endurece la plata de una klaive para que sea tan fuerte como el acero, permitiendo que la klaive se use en batalla de forma más fiable de lo que cualquier arma de plata ordinaria podría lograr."

 artifact_amulet_of_kinship_name: "[fetish_artifact_icon]Amuleto de Parentesco"
 artifact_amulet_of_kinship_description: "A diferencia de otros fetiches de la Parentela, este no es activado por la Parentela en cuestión, sino por el hombre lobo que le entrega el amuleto.\nCualquier hombre lobo que encuentre a la Parentela que porte este amuleto sabrá instantáneamente que no es solo Parentela, sino una de gran importancia. El amuleto no impone ninguna obligación inmediata de ayudar a quien lo porta, pero la mayoría de los Garou saben que el portador se ha ganado, al menos, un trato digno. Lamentablemente, los Danzantes de la Espiral Negra también reconocen al portador como Parentela, con resultados potencialmente nefastos."


 #Other
 artifact_dragon_skin_name: "[fetish_artifact_icon]Piel de Dragón"
 artifact_dragon_skin_description: "Esta es la piel mudada de un Zhong Lung, que brilla suavemente con una luz de cinco colores. Poseer una piel mudada de gran calidad es un objeto de gran prestigio entre los clanes. Por supuesto, los magos orientales y otros Hengeyokai también desean poseerla."




##Unique
 artifact_shining_klaive_of_sokhta_name: "[fetish_artifact_icon]Klaive Brillante de Sohkta"
 artifact_shining_klaive_of_sokhta_description: "Una klaive hecha de oro y azogue; a diferencia de otras klaives, esta arma es perfectamente segura para que la usen todas las $glossary_fera$, e incluso, de hecho, las fortalece aún más. Esta arma deformante y aterradora infunde temor en todos los que oyen hablar de ella, una Fera que puede actuar sin dejarse amedrentar por su legendaria debilidad."
 artifact_radiant_blade_of_katanka_sonnak_name: "[fetish_artifact_icon]Hoja Radiante de Katanka-Sonnak"
 artifact_radiant_blade_of_katanka_sonnak_description: "Esta aterradora hoja, hecha de una mezcla de plata y oro, arde con la luz del Avatar Incarna de $glossary_helios$, Katanka-Sonnak, patrón de los Corax y los Mokolé. Esta arma llameante inspira la misma presteza con que Helios recorre el cielo, y se mueve con su misma gracia y destreza."
 artifact_mercurial_mask_of_mitanu_name: "[fetish_artifact_icon]Máscara Mercurial de Mitanu"
 artifact_mercurial_mask_of_mitanu_description: "La máscara del embaucador, un regalo del Incarna de Mercurio, Mitanu; esta maravillosa máscara de disfraz permite ocultar totalmente la presencia de uno, convirtiéndose en alguien igual a su creador: un señor de la Intriga."
 artifact_burning_mask_of_hakahe_name: "[fetish_artifact_icon]Máscara Ardiente de Hakahe"
 artifact_burning_mask_of_hakahe_description: "Antaño máscara de forja del Incarna de Vulcano, Hakahe, Señor del Planeta Sombrío, esta máscara de hierro negro imparte una parte de la maestría del forjador al portador, protegiéndolo y otorgándole su propia sabiduría, tanto en las artes del oro como de la sabiduría."
 artifact_radiant_dress_of_tambiyah_name: "[fetish_artifact_icon]Vestido Radiante de Tambiyah"
 artifact_radiant_dress_of_tambiyah_description: "Un hermoso tapiz hecho del hierro más resistente; este vestido, la obra maestra de Tambiyah, el Incarna de Venus, hace honor a cualquiera que lo vista. Este vestido inmaculado se moldea con el portador y se convierte en muchas piezas de joyería fina y adornos en otras formas, pero incluso así, el vestido protege al portador contra todo agravio."
 artifact_eternal_grace_of_eshtarras_might_name: "[fetish_artifact_icon]Gracia Eterna del Poder de Eshtarra"
 artifact_eternal_grace_of_eshtarras_might_description: "Dentro de este amuleto reside la bendición de Eshtarra, la Incarna de la Tierra, el Avatar de Gaia. Esta increíble reliquia otorga a quien la lleva la vitalidad de 8 hombres mortales, una fertilidad sin límites y la sabiduría de liderazgo de la propia Eshtarra, madre de todos. Esta preciosa reliquia está hecha de los mejores materiales de la generosidad de Gaia, y su toque, incluso sobre cualquiera, es señal de su bendición y calidez infalibles; fue forjada a partir de un trozo de su radiante trono."
 artifact_burning_horns_of_nerigal_name: "[fetish_artifact_icon]Cuernos Ardientes de Nerigal"
 artifact_burning_horns_of_nerigal_description: "Estos cuernos de caza de arcilla roja fueron fabricados con el Polvo del Planeta Rojo por el Incarna de Marte, Nerigal. Al sostenerlos y tocarlos, estos cuernos hacen temblar a la propia Gaia, llamando a todos los leales al portador a la guerra, mientras el poder y la astucia del Incarna de la Guerra fluyen en ellos, llamando a todos a vencer en su nombre."
 artifact_ruinous_talons_of_rorg_name: "[fetish_artifact_icon]Garras Ruinosas de Rorg"
 artifact_ruinous_talons_of_rorg_description: "Estos guanteletes de metal meteórico, hechos de los restos rotos de Turog, el consorte de Gaia, son un regalo de Rorg, la Incarna de los Asteroides entre Marte y Júpiter, de la venganza y de la furia. Con ellos se manifiesta su voluntad, pues quienes los esgrimen se convierten en su furia viviente y desatan la carnicería contra todo lo que tengan delante."
 artifact_imperious_crown_of_zarok_name: "[fetish_artifact_icon]Corona Imperiosa de Zarok"
 artifact_imperious_crown_of_zarok_description: "La corona del Rey de Reyes: esta inmaculada corona incrustada de gemas fue labrada a mano por Zarok, la Incarna de los Reyes y de Júpiter, antaño pretendiente de Gaia, la más grande de las Incarna después de $glossary_luna$ y $glossary_helios$. Quien la lleva se convierte en el semblante viviente del más grande de los reyes, mientras la riqueza de la magnificencia fluye hacia su interior."
 artifact_eternal_wings_of_lu_bat_name: "[fetish_artifact_icon]Alas eternas de Lu-Bat"
 artifact_eternal_wings_of_lu_bat_description: "Esta capa de plumas es un regalo de la Incarna de Saturno, la Incarna de Júpiter, el Gran Búho. Con ella, quien la porte podrá surcar los cielos y volar tanto por la [umbra|E] como por las [Glossary('Tierras de Piel','game_concept_skinlands_desc')], llevando consigo su propia naturaleza y sabiduría."
 artifact_shadowed_stave_of_ruatma_name: "[fetish_artifact_icon]Bastón sombrío de Ruatma"
 artifact_shadowed_stave_of_ruatma_description: "Se dice que este pequeño bastón de mano contiene una pequeña astilla de la voz de Ruatma, la Incarna de Urano. A través de él, la Incarna habla a su portador y le susurra muchos secretos y saberes cruciales. Sin embargo, quizá algunos de ellos no estaban hechos para ser conocidos..."
 artifact_dancing_loom_of_shantar_name: "[fetish_artifact_icon]Telar danzante de Shantar"
 artifact_dancing_loom_of_shantar_description: "Esta luminosa arpa es de creación inmaculada, tejida por las manos de Shantar, la Incarna de Neptuno. A diferencia de todos sus otros Telares, este fue hecho con su foco habitual, un regalo para su campeón; en él, las olas de sus hermosas canciones fluyen a través de quien lo toca y calman los nervios como ninguna otra cosa."
 artifact_whispering_ankh_of_meros_name: "[fetish_artifact_icon]Ankh susurrante de Meros"
 artifact_whispering_ankh_of_meros_description: "Este ankh de plata desgastado parece llevar las marcas del paso del tiempo y es el regalo más precioso de la Incarna Meros, la Incarna de Plutón. Este precioso símbolo manual permite al usuario moverse con velocidades místicas y, al hablar, el portador posee un fragmento de la voz del Eterno Vagabundo."



##Wyrm
 artifact_brush_of_ancients_name: "[fetish_artifact_wyrm_icon]Pincel de los Antiguos"
 artifact_brush_of_ancients_description: "#bold $countermeasures_unlocks_t1_all_seeing_eye$#!\n\nLlamado también el Pincel del Presagio, este pequeño pincel permite al usuario pintar escenas intrincadas y exactas, guiado por las manos de un ancestro. Estas pinturas suelen reflejar señales de cosas que han pasado y de cosas que aún han de venir."
 artifact_wyrm_gut_bonds_name: "[fetish_artifact_wyrm_icon]Vínculos de tripas del Wyrm"
 artifact_wyrm_gut_bonds_description: "#bold Los prisioneros tienen menos probabilidades de escapar.#!\n\nEste extraño fetiche toma la forma de hebras de tripa especialmente resistentes que no pueden cortarse ni quemarse. Luchar contra los vínculos solo provoca náuseas en la víctima."
 artifact_devilwhip_name: "[fetish_artifact_wyrm_icon]Látigo del diablo"
 artifact_devilwhip_description: "Este fetiche negro y espinoso de quince pies es, en realidad, el tentáculo cercenado de un Maligno, tratado especialmente para permanecer permanentemente en el mundo material. El Maligno menor que dota de poder al Látigo del Diablo puede animar el látigo a voluntad, azotando y dirigiéndolo como si fuera empuñado por otro. El Látigo del Diablo emite un sonido similar a la risa de un lunático cada vez que derrama sangre. Al chasquearlo justo frente al rostro de un oponente y activarlo, el látigo obliga al enemigo a postrarse en el suelo."
 artifact_umbrascope_name: "[fetish_artifact_wyrm_icon]Umbrascopio"
 artifact_umbrascope_description: "Catalejos empañados, binoculares o incluso visillos de ópera dentro de los cuales hay un Maligno de Escudriñamiento vinculado. Este fetiche permite a su usuario asomarse a la Umbra desde el mundo material sin tener que dar un paso hacia el otro lado."
 artifact_bane_lantern_name: "[fetish_artifact_wyrm_icon]Linterna de Maligno"
 artifact_bane_lantern_description: "Una linterna de acero pintada con glifos obscenos y runas siniestras. Cuando se le ordena encenderse en picto, en la Lengua Primordial o en el lenguaje secreto del Wyrm, emite una luz púrpura antinatural. Ilumina a todos los espíritus dentro del haz, incluso en el mundo físico. La linterna tiene un efecto hipnótico en los espíritus, atrayéndolos como polillas a la llama."
 artifact_tambertails_heart_name: "[fetish_artifact_wyrm_icon]Corazón de Tambertail"
 artifact_tambertails_heart_description: "La versión original de este fetiche era el corazón momificado de un Teúrgo Fianna. Ahora existen varios de estos fetiches del Wyrm, cada uno es el corazón preservado de un Garou de Gaia, pero conservando el nombre del original. El corazón comienza a latir de forma arrítmica cada vez que el peligro amenaza a su dueño vinculado."
 artifact_deathrattler_name: "[fetish_artifact_wyrm_icon]Sonajero de la muerte"
 artifact_deathrattler_description: "Este fetiche está hecho de un sonajero seco extraído de alguna criatura desconocida similar a una serpiente de cascabel. El sonajero tiene el poder de ahuyentar a todos los animales o humanos dentro del alcance del oído, incluyendo $glossary_fera$."
 artifact_spirit_net_name: "[fetish_artifact_wyrm_icon]Red de espíritus"
 artifact_spirit_net_description: "La Red de Espíritus es similar a una red de pescador. Puede extenderse sobre un área de varios cientos de yardas. Es invisible en la Umbra y puede usarse para capturar espíritus cercanos."
 SPIRIT_NET_REASON: "$artifact_spirit_net_name$: $VALUE|+=0$"
 artifact_wyrm_fang_dagger_name: "[fetish_artifact_wyrm_icon]Daga de colmillo del Wyrm"
 artifact_wyrm_fang_dagger_description: "Se dice que estos cuchillos son los dientes podridos del Wyrm, caídos o arrancados de él y convertidos en armas de combate. Si realmente fueran dientes auténticos, serían muy raros, pero estos fetiches son bastante comunes. Sin embargo, lo extraño de estos cuchillos es que algunos poseen poder real. Estos cuchillos infligen daño Agravado a cualquiera herido por ellos, causando heridas purulentas."
 artifact_wyrmflesh_name: "[fetish_artifact_wyrm_icon]Carne del Wyrm"
 artifact_wyrmflesh_description: "#bold Elimina cualquier debilidad al daño de Plata o de Oro.#!\n\nPara crear este espantoso fetiche hay que desollar a un humano a lo largo de un mes lunar, manteniéndolo cuidadosamente con vida hasta el último instante. El creador tatúa la piel con glifos que deforman la vista, la curte y después la convierte en una túnica. La Carne del Wyrm aumenta la defensa de quien la viste contra todo daño. Cambia de forma junto con el portador y le brinda protección en todas sus formas. Si algún daño logra atravesar la protección de la Carne del Wyrm, esta lanza un chillido ensordecedor y la sangre fluye espesa y roja incluso del corte más pequeño."
 artifact_wyrmwood_name: "[fetish_artifact_wyrm_icon]Madera del Wyrm"
 artifact_wyrmwood_description: "La Madera del Wyrm es una enredadera ennegrecida y antinatural que crece en las profundidades de la tierra, absorbiendo la luz de los Fuegos Infernales que hay debajo. Cuando se recolecta y quema suficiente de esta madera, tiene el poder de proteger a todos dentro del alcance de su horrible olor de los ataques de espíritus de todo tipo, sin importar lo poderosos que sean."
 artifact_magic_spewer_name: "[fetish_artifact_wyrm_icon]Escupidor de magia"
 artifact_magic_spewer_description: "#bold Inflige 1 de Daño de [fire_damage_short_with_icon|E] a los [knights|E] y [commanders|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu oponente durante los [single_combat_duel_plural|E].#!\n\nEste fetiche está fabricado con un cráneo humano. A voluntad, el cráneo expulsa, como si vomitara, un chorro de desechos tóxicos viscosos y malolientes. Quien reciba la baba del Escupidor sufrirá daño como si fuera fuego. Los ojos del Escupidor Mágico brillan en rojo cuando está activo y la mandíbula inferior se mueve por sí sola."
 artifact_goblin_ale_name: "[fetish_artifact_wyrm_icon]Ale de duende"
 artifact_goblin_ale_description: "#bold Puede usarse para reducir el [stress|E]#!\n\nEste elixir alcohólico suele ser intercambiado por los destiladores duendes de la Corte de las Sombras. Un trago de este licor provoca que el bebedor sufra alucinaciones violentamente intensas e incluso puede transportarlo accidentalmente a la Umbra. La Ale de duende es completamente embriagadora y emborracha incluso al más robusto $glossary_fera$ más rápido que cualquier brebaje humano. Es un favorito perenne en las reuniones del Espiral Negro, y suele hacer que la noche sea más sangrienta de lo habitual."
 artifact_voidstone_name: "[fetish_artifact_wyrm_icon]Piedra del vacío"
 artifact_voidstone_description: "#bold Puede usarse para atrapar permanentemente a un personaje en [UmbraGlossary('malfeas')]#!\n\nEste poderoso objeto es una piedra negra, pequeña y pulida suavemente. Si se lanza contra un objetivo, dicho objetivo es desterrado para siempre del mundo material, aunque aún pueda existir en la Umbra. Las Piedras del vacío solo pueden usarse una vez cada una y son sumamente raras."
 artifact_storm_bottle_name: "[fetish_artifact_wyrm_icon]Tormenta en una botella"
 artifact_storm_bottle_description: "#bold Puede usarse para desatar una #V Tormenta#! sobre un Reino e infligir #V [EmptyScope.ScriptValue('POD_base_lightning_damage')|0]#! de Daño de [lightning_damage_short_with_icon|E] a todos los enemigos del $glossary_wyrm$#!.\n\nEsta botella opaca contiene en su interior una tormenta entera contaminada por el Wyrm. Una vez desatada, la tormenta arrasa tanto el mundo físico como la Penumbra. Cualquier enemigo del Wyrm sorprendido sin refugio será alcanzado por un rayo. El rayo, sin embargo, solo golpeará a cada individuo una vez."
 artifact_dragons_ichor_name: "[fetish_artifact_wyrm_icon]Icor de dragón"
 artifact_dragons_ichor_description: "#bold Puede usarse para ganar temporalmente [GetModifier('dragons_ichor_temp_modifier').GetNameWithTooltip].#!\n\nSuele encontrarse en pequeños frascos o viales, el Icor de Dragón es sangre negra extraída de una poderosa criatura del Wyrm. Si la sustancia casi coagulada se frota por todo el cuerpo, hará que el individuo sea temporalmente inmune a todos los ataques."
 dragons_ichor_temp_modifier: "Sangre Negra"
 dragons_ichor_temp_modifier_desc: "Puede [soak_damage|E] [POD_aggravated_damage_with_box|E]" 
 artifact_baneklaive_name: "[fetish_artifact_wyrm_icon]Baneklaive"
 artifact_baneklaive_description: "#bold Puede usarse para infligir hasta #V [EmptyScope.ScriptValue('POD_double_balefire_damage')|0]#! de Daño de [balefire_damage_short_with_icon|E] a un personaje. Su $POD_energy_gnosis$ también se drenará si es un $glossary_fera$ o [GetTrait('spirit').GetName(GetNullCharacter)].#!\n\nLa Baneklaive es una hoja de plata del largo de una espada, grabada con runas retorcidas y reluciente de Fuego Infernal. La hoja puede robar Gnosis a los Fera y a los Espíritus mientras los Fuegos Infernales los consumen."
 artifact_churjurocs_tusk_name: "[fetish_artifact_wyrm_icon]Colmillo de Churjuroc"
 artifact_churjurocs_tusk_description: "#bold Puede ignorar la inmunidad al delirio.#!\n\nEste colmillo de color púrpura negruzco perteneció una vez a una criatura masiva y vermiforme del Wyrm. Los Danzantes de la Espiral Negra lucharon alegremente a su lado hasta que este empezó a volverse contra ellos por estupidez y hambre, momento en el que lo destruyeron en una larga y dura batalla. El colmillo mide unos sesenta centímetros; tiene una esfera de platino en un extremo y está cubierto de intrincados y perversos grabados a lo largo de su extensión."
 artifact_soul_ruby_name: "[fetish_artifact_wyrm_icon]Rubí del Alma"
 artifact_soul_ruby_description: "#bold Puede usarse para comulgar con el Espíritu cautivo en su interior.#!\n\nEl Rubí del Alma es un rubí del tamaño del puño de una mujer, extraído de las vetas de roca en el corazón de los Pozos subterráneos de los Danzantes de la Espiral Negra. Inestimable por el valor de la piedra por sí sola, cada Rubí del Alma contiene también el espíritu de un Danzante de la Espiral Negra caído. Al activarse, el rubí ofrece consejos telepáticos a su portador, permitiéndole acceder a cualquier conocimiento que el Danzante poseyera en vida. El espíritu del Danzante caído también puede visitar al poseedor del fetiche en sus sueños, posiblemente ofreciendo vislumbres del futuro."
 artifact_shadowflame_name: "[fetish_artifact_wyrm_icon]Llama Sombría"
 artifact_shadowflame_description: "#bold Puede usarse para teletransportarse al instante a tu destino mientras estás [traveling|E].\nInflige #V [EmptyScope.ScriptValue('POD_base_balefire_damage')|0]#! de Daño de [balefire_damage_short_with_icon|E] a los [knights|E] y [commanders|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu oponente durante los [single_combat_duel_plural|E].#!\n\nUn caballo aterrador creado con lo más oscuro y mortífero de los [balefires|E]. Esta montura llevará a su jinete por todos los infiernos y de vuelta, ileso. La lealtad de la Llama Sombría es para el $glossary_wyrm$ y para su siervo más poderoso."


##Werewolf
 artifact_yuri_klaive_name: "[fetish_artifact_icon]Klaive de Yuri"
 artifact_yuri_klaive_description: "Una klaive bien forjada, aunque algo anodina. Quienes estén dispuestos a mirar más allá pueden percibir el presentimiento de un gran destino ligado a esta arma." 
 artifact_head_hardrule_name: "[fetish_artifact_icon]Cabeza de Hardrule"
 artifact_head_hardrule_description: "Tarjei Hardrule fue uno de los guerreros más grandes que la Camada de Fenris haya visto jamás. Pero también uno de los gobernantes más tiránicos, lo que al final le costó la vida cuando toda la tribu se volvió contra él. Su cabeza es un recordatorio para alabar siempre al gran guerrero, pero también para desconfiar del precio de la soberbia." 
 artifact_antler_crown_name: "[fetish_artifact_icon]La Corona de Astas"
 artifact_antler_crown_description: "El símbolo de los Reyes Fianna desde las primeras noches de la tribu. Esta poderosa corona solo se entrega a los dignos, y todos los hijos del Ciervo tienen el deber de seguirla."
 artifact_bronze_labrys_name: "[fetish_artifact_icon]Labrys de Bronce de Leukippes"
 artifact_bronze_labrys_description: "Un Labrys de bronce perfectamente conservado de la Edad de Oro, quizá perteneciente en su día a la propia Leukippes. Esta enorme hacha de dos manos es, con mucho, el arma más aterradora y la reliquia más venerada de las Furias Negras." 
 artifact_gaia_big_thumb_name: "[fetish_artifact_icon]El Pulgar de Gaia"
 artifact_gaia_big_thumb_description: "Este pulgar humano, momificado y de tamaño desproporcionado, tiene la extraña propiedad de asegurar que siempre haya un transporte adecuado cerca... pero no garantiza hacia dónde va realmente ese transporte. Aunque resulta desconcertante para cualquier Teúrgo respetable, es un fetiche muy querido por los Roehuesos y el origen de muchas bromas." 
 artifact_chalice_renewal_name: "[fetish_artifact_icon]Cáliz de la Renovación"
 artifact_chalice_renewal_description: "Un místico cáliz de oro que se llena solo con agua de mar. Quien beba de él experimentará un recuerdo de la propia Gaia y luego será curado de cualquier dolencia o herida. Este preciado artefacto ha aparecido en varios momentos clave de la historia de los Hijos de Gaia."
 artifact_watcher_shield_name: "[fetish_artifact_icon]Escudo del Vigilante"
 artifact_watcher_shield_description: "Una pequeña ficha de madera con forma de escudo que se lleva al cuello. Este fetiche protege al portador contra cualquier tipo de ataque cobarde, asegurando que la Camada de Fenris siempre luche bajo sus propios términos." 
 artifact_crescent_moon_waterskin_name: "[fetish_artifact_icon]Odre de Luna Creciente"
 artifact_crescent_moon_waterskin_description: "Un artefacto muy versátil, apreciado por el Guardián de los Hombres. Puede usarse para camuflarse, desarrollar garras poderosas o incluso entrar en Frenesí inmediato si se bebe de él."
 artifact_threefold_axe_name: "[fetish_artifact_icon]El Hacha Trina"
 artifact_threefold_axe_description: "Culminación de la destreza herrera de los Fianna, el Hacha Triple es un arma fabricada para resultar óptima contra cualquier enemigo. Los espíritus de su interior cambian la composición del metal durante la batalla según haga falta, de modo que los fae se enfrenten al oro, los hombres lobo a la plata, etc. Un arma así es rarísima, pues lograr que tantos espíritus cohabiten en un solo huésped es una hazaña verdaderamente épica."
 artifact_hammer_king_brennus_name: "[fetish_artifact_icon]Martillo del rey Brennus"
 artifact_hammer_king_brennus_description: "Se dice que este colosal martillo antiguo perteneció a Brennus, el último rey de los Aulladores Blancos. Cuentan las leyendas que luchó hasta su último aliento contra sus propios parientes caídos mientras estos descendían a la locura de la Espiral Negra. Se ignora si el arma es de verdad la suya, pero aun hoy infunde pavor a los siervos del Wyrm."
 artifact_bramble_branch_name: "[fetish_artifact_icon]Rama de Zarza"
 artifact_bramble_branch_description: "Un poderoso espíritu está ligado a esta rama seca. Una vez activada, todo tipo de plantas venenosas brotan del suelo y bloquean el área para cualquier intruso."
 artifact_assassin_klaive_name: "[fetish_artifact_icon]Klaive del Asesino"
 artifact_assassin_klaive_description: "Elegante y mortífera como un auténtico Señor de la Sombra, esta klaive imbuida con el espíritu de una serpiente se oculta con facilidad y es capaz de enmascarar la presencia de su dueño incluso en los lugares más públicos."
 artifact_firebird_feather_name: "[fetish_artifact_icon]Pluma de Fénix"
 artifact_firebird_feather_description: "No se conocen las propiedades exactas de la Pluma de Fénix. Simplemente parece una pluma hermosa y luminosa, pero cuando fue llevada a los aposentos del rey Colmillo Plateado, la habitación se iluminó como si hubiera mil velas. También parece sorprendentemente resistente, siendo tan afilada como la klaive más pulida." 
 artifact_owl_talon_name: "[fetish_artifact_icon]Garra de Búho"
 artifact_owl_talon_description: "Esta hoja curva, que recuerda a las garras de un búho, es la klaive más poderosa en manos de los Caminantes Silenciosos. Con dos espíritus ligados en su interior, se dice que tiene especial hambre de la sangre de los vampiros egipcios, anticipando el día en que la tribu finalmente obtenga su venganza."
 artifact_yellow_veil_name: "[fetish_artifact_icon]Velo Amarillo de Karapatri"
 artifact_yellow_veil_description: "La Dama de la Oscuridad Eterna usaba este velo cuando dictaba sentencia sobre los Contempladores de Estrellas indignos. Este artefacto obliga al portador a luchar siempre por la justicia, y a cualquiera que esté cerca de él a decir la verdad y confesar cualquier secreto vergonzoso que pueda tener."
 artifact_seven_blades_inoue_name: "[fetish_artifact_icon]Siete Espadas de Inoue"
 artifact_seven_blades_inoue_description: "Una de las siete espadas del Clan [GetDynastyByID('POD_werewolf_dynasty_inoue').GetBaseName].\n[GetScriptedCharacterByHistoryID('795223').GetFirstName] forjó la primera hoja para su esposa, y luego otra para cada uno de sus seis hijos. Cada hoja ha sido forjada magistralmente tanto con acero como con el amor de Masamune por su familia. Espíritus de guerra han sido ligados a las hojas para mantenerlas eternamente afiladas; lo único que necesitan es un maestro digno."
 artifact_thunder_inoue_name: "[fetish_artifact_icon]Trueno de Inoue"
 artifact_thunder_inoue_description: "#bold [GetPerk('storm_winds_slash_perk').GetName(GetPlayer)] ahora inflige 1 de Daño de [lightning_damage_short_with_icon|E] además de su [POD_superficial_damage|E].#!\nUn ōdachi perfectamente forjado por [GetScriptedCharacterByHistoryID('795223').GetFirstName] con gran cuidado y precisión. Fue la primera hoja que Masamune forjó con maestría y por eso la reclamó para sí. Aparte de su tamaño y su factura, era una hoja como cualquier otra. Eso fue hasta que la llevó en peregrinación al monte Fuji, donde el orgulloso Hakken desafió al propio Naru-kami. El Dios del Trueno se divirtió y envió a uno de sus siervos a luchar contra el joven Garou. Masamune se alzó con la victoria y el siervo del Trueno quedó ligado a su hoja.\nAhora, los estruendosos sonidos del Trueno anuncian la llegada de su portador."

 artifact_wolven_oath_name: "[fetish_artifact_icon]Juramento de lobo"
 artifact_wolven_oath_description: "La hoja del Clan [GetDynastyByID('POD_werewolf_dynasty_chika').GetBaseName].\nLos Chika hacen un juramento antes de desenvainar la uchigatana, y solo la envainarán cuando ese juramento se haya cumplido."
 artifact_chiming_serpent_name: "[fetish_artifact_icon]Serpiente tintineante"
 artifact_chiming_serpent_description: "La hoja del Clan [GetDynastyByID('POD_werewolf_dynasty_kasutoshi').GetBaseName].\nEste ōdachi está adornado con pequeñas campanas atadas a distintas longitudes; el tintineo constante de las campanas confunde los sentidos mientras la hoja encuentra su objetivo."
 artifact_serrated_tempest_name: "[fetish_artifact_icon]Tempestad dentada"
 artifact_serrated_tempest_description: "La hoja del Clan [GetDynastyByID('POD_werewolf_dynasty_chikara').GetBaseName].\nEl ōdachi es dentado a lo largo de su extensión, lo que le permite desgarrar la carne con facilidad. Un arma poco elegante y bruta que abruma a sus enemigos."
 artifact_lunar_dragon_tide_name: "[fetish_artifact_icon]Marea del Dragón Lunar"
 artifact_lunar_dragon_tide_description: "La hoja del Clan [GetDynastyByID('POD_werewolf_dynasty_ozatu').GetBaseName].\nEsta hermosa uchigatana reluce junto a su portador en su elegante danza de la muerte. Este estilo único prioriza la defensa perfecta hasta el momento en que la hoja cae como una marea rugiente."
 artifact_stalking_moon_name: "[fetish_artifact_icon]Luna acechante"
 artifact_stalking_moon_description: "La hoja del Clan [GetDynastyByID('POD_werewolf_dynasty_kintaro').GetBaseName].\nUna afilada wakizashi fabricada para llevarse en la boca de un lobo y no en las manos de un humano. Esta arma poco convencional ha pillado desprevenidos a muchos."


##Bastet
 artifact_devil_deck_name: "[fetish_artifact_icon]Baraja del diablo"
 artifact_devil_deck_description: "Una colección de cartas de juego «normales» usadas por los Bastet; este fetiche siempre reparte a su dueño la carta más útil. Los Bastet llevan tiempo preguntándose por el origen de estos extraños artefactos, pero hasta ahora no se ha hallado ninguna pista."
 artifact_lotus_petals_name: "[fetish_artifact_icon]Pétalos de loto"
 artifact_lotus_petals_description: "#bold Los hijos de la Parentela de un Bastet que posea este artefacto siempre se convertirán en Bastet al alcanzar la mayoría de edad.#!\nEn la Corte de $glossary_luna_seline$ crece un jardín de flores de loto de mil años. Cada Bastet que viaja a la Luna puede traerse una de ellas. Sus propiedades místicas incluyen la semilla que asegura el nacimiento de la siguiente generación de Bastet."
 artifact_grandmothers_stones_name: "[fetish_artifact_icon]Piedras de la abuela"
 artifact_grandmothers_stones_description: "Tras el Gran Diluvio quedaron unas piedras relucientes que llamaron a las mujeres que las recogieron y las convirtieron en joyas. Bendecidos por la luz de la luna, estos artefactos resuenan con la sangre de $glossary_luna_seline$ en las Bastet que dan con ellos, y aumentan su conexión con ella."
 artifact_truthspeaker_stick_name: "[fetish_artifact_icon]Bastón del que dice la verdad"
 artifact_truthspeaker_stick_description: "Este fetiche temperamental parece una porra tallada y decorada, pero en realidad vuela hacia cualquier mentiroso de su entorno para sacarle la verdad a golpes. Si lo rodean falsedades, brilla en cambio como una brasa e intenta aplastar a todo mentiroso de las inmediaciones hasta someterlo con la cabeza ensangrentada."
 artifact_silver_hakarr_name: "[fetish_artifact_icon]Hakarr de plata"
 artifact_silver_hakarr_description: "Al igual que las klaives de los Garou, estas hunga-mungas de plata son peligrosas de fabricar y mortales de usar. Armas rituales utilizadas en las batallas de rencores más letales, estas monstruosidades de múltiples hojas han sido forjadas con plata pura e investidas con espíritus de la Guerra."
 artifact_frog_skin_name: "[fetish_artifact_icon]Piel de rana"
 artifact_frog_skin_description: "Esta piel, que suele envolverse alrededor de la mano como un guante, permite al usuario neutralizar toda forma de veneno con tan solo un toque."
 artifact_ice_knife_name: "[fetish_artifact_icon]Cuchillo de hielo"
 artifact_ice_knife_description: "Esta poderosa arma-fetiche conlleva una prohibición debido a sus vínculos con los espíritus del hielo: se derrite si se expone a temperaturas positivas. Por tanto, los dueños deben tener cuidado de usarlo solo en condiciones climáticas adecuadamente frías."

 artifact_foe_heart_name: "[fetish_artifact_icon]Corazón del enemigo"
 artifact_foe_heart_description: "Si un Bastet logra matar a un enemigo poderoso sin abandonar su forma de raza, el corazón del enemigo es extraído e investido con un espíritu del $glossary_wyld$. El Bastet puede entonces usar Gnosis para activar este fetiche y restaurar su Fuerza de Voluntad."
 artifact_jade_arrows_name: "[fetish_artifact_icon]Flechas de jade"
 artifact_jade_arrows_description: "Usadas sobre todo por los Khan, estas flechas se crean infundiéndoles un espíritu de muerte. Infligen daño agravado a las criaturas sobrenaturales y explotan al impactar. Mientras quede un fragmento clavado en la víctima, las heridas causadas por estas flechas no pueden curarse."
 artifact_quicksilver_name: "[fetish_artifact_icon]Mercurio"
 artifact_quicksilver_description: "Un pequeño vial de mercurio vinculado a un espíritu del agua; este artefacto permite a su usuario traer a una persona adicional con él en la [umbra|E]."
 artifact_false_protection_name: "[fetish_artifact_icon]Falsa protección"
 artifact_false_protection_description: "Las mayores debilidades de los Bastet son sus Yava, o secretos tribales, y este fetiche es una forma (algo blasfema) de asegurarlos. Una vez activado, este artefacto intercambia el Yava de su dueño por el de otra tribu, asegurando que su secreto más importante nunca pueda ser conocido... al posible coste del de otra tribu."
 artifact_judgment_hammer_name: "[fetish_artifact_icon]Martillo del juicio"
 artifact_judgment_hammer_description: "Quizá el arma más poderosa de la nación Bastet, esta apreciada reliquia de los Khan duplica la fuerza de su portador y produce un poderoso trueno con cada golpe. Sin embargo, es absurdamente pesada, y solo los más poderosos de entre los Khan han sabido manejarla como es debido."


##Mokole
 artifact_mask_of_mnante_name: "[fetish_artifact_icon]Máscara de Mnante"
 artifact_mask_of_mnante_description: "Se trata de una máscara tallada que puede usarse como collar, sobre el rostro, como parte de un tocado, etc. Es una herramienta ideada durante las Guerras de Furia para permitir la supervivencia de los Mokolé. Cuando se invoca, cualquier persona que intente determinar la Raza del Mokolé, por ejemplo mediante el Rastro de la Forma Verdadera, verá aumentada su dificultad según la Gnosis actual del Mokolé. Si el observador falla, considerará al Mokolé como miembro de su propia especie."
 artifact_mace_of_winds_name: "[fetish_artifact_icon]Maza de los vientos"
 artifact_mace_of_winds_description: "#bold La forma Archid gana: [GetModifier('archid_gale_cloak_modifier').GetNameWithTooltip]#!\n\nEsta arma, única de los Makara, es una ornamentada maza redondeada hecha de hierro con incrustaciones de latón. El verdadero poder de la maza se hace evidente cuando su portador cambia a su forma Archid, pues esta flota, se desplaza y ataca sin ayuda según dirija su portador, regresando siempre para flotar junto a la cabeza de este. Además, rodea al usuario con vientos feroces que disuaden a los atacantes y arrastran a cualquiera que sea lo suficientemente desafortunado como para quedar atrapado en la ráfaga."
 artifact_sun_spear_thrower_name: "[fetish_artifact_icon]Lanzador de lanzas solares"
 artifact_sun_spear_thrower_description: "#bold Puede usarse para infligir daño solar a un personaje, en función de su [artifact_power_with_icon|E]. A diferencia de las Flechas del Sol, este artefacto no se consume al usarlo.#!\n\nUn lanzador de lanzas, también llamado átlatl, es un ingenio bastante simple pero ingenioso. Una pieza curva de madera se apoya a lo largo del antebrazo y, con el movimiento adecuado, puede arrojar una lanza a distancias increíbles con rapidez y puntería. El Lanzador de Lanzas Solares lleva consigo sus lanzas. O, mejor dicho, le pide a $glossary_helios$ que se las proporcione. Una vez activado, el Lanzador de Lanzas Solares produce una lanza de pura luz solar. Cuando la lanza impacta, desaparece poco después en una explosión de luz."
 artifact_sword_of_fever_name: "[fetish_artifact_icon]Espada de la Fiebre"
 artifact_sword_of_fever_description: "#bold Puede usarse para dar a un personaje [GetTrait('entoban_plague').GetName(GetNullCharacter)].\nDesbloquea una decisión para iniciar un brote apocalíptico en tu ubicación.#!\n\nEsta espada de acero de Entoban encarna las defensas contra la fiebre levantadas por el propio Mokolé-Mbembe en torno a Entoban. Cuando se desenvaina, aunque sea el ancho de un dedo, libera a los espíritus de la Enfermedad y la peste golpea. Quien la desenvaina puede pronunciar el nombre del enemigo, y este enfermará. Puede nombrarse a una nación entera. Sin embargo, los espíritus de la Enfermedad no pueden contenerse. La enfermedad se extenderá tan rápido como pueda, y muchas veces se ha impedido a los Mokolé desenvainar esta espada, no fuera que la peste matara a su propia Parentela."
 artifact_blowpipe_anamnesis_name: "[fetish_artifact_icon]Soplo de Anamnesis"
 artifact_blowpipe_anamnesis_description: "#bold Puede usarse para otorgar a otro [GetTrait('mokole').GetName(GetNullCharacter)] puntos de [mnesis_lifestyle|E] [perk|E].#!\n\nEsta pipa está hecha de madera de ceiba tropical, recolectada sin matar al árbol, y tallada con los signos de los Reyes. Se utiliza para administrar las plantas maestras introduciendo en la pipa un polvo hecho de ellas, para luego soplarlo en la nariz del receptor, una fosa nasal a la vez."
 artifact_pearls_flood_ebb_name: "[fetish_artifact_icon]Perlas de la Marea Alta y Baja"
 artifact_pearls_flood_ebb_description: "#bold Desbloquea opciones de Magia Climática: #V Gran Inundación#! y #V Marea Nutritiva#!#!\n\nEstas son perlas guardadas en los palacios de los Reyes Dragón en el fondo del mar que controlan el flujo y reflujo de la marea. Están imbuidas de esencia de Luna y tienen Lunes vinculados a ellas. Pueden hacer que las mareas suban y bajen para traer tanto la calamidad como la prosperidad."
 artifact_spear_mokole_mbembe_name: "[fetish_artifact_icon]Lanza de Mokolé-Mbembe"
 artifact_spear_mokole_mbembe_description: "#bold La forma Archid gana: [GetModifier('archid_ancient_strength_modifier').GetNameWithTooltip]#!\n\nEsta arma es, en apariencia, una lanza de guerra Entoban, pero el examen de la punta de la lanza revelará que el metal es electrum. Además, la singular pureza de esta arma significa que afecta a $glossary_fera$ como si fuera tanto plata como oro. A las Bête rara vez les es posible discernir las propiedades argénteas de esta aleación."
 artifact_cauldron_dagda_name: "[fetish_artifact_icon]Caldero de Dagda"
 artifact_cauldron_dagda_description: "Cuando llegaron por primera vez a Irlanda, los Tuatha de Danaan trajeron consigo muchos grandes tesoros. Dos de ellos residen en la fortaleza Fianna de Tara Plateada. Uno es el Caldero de Dagda, que siempre está lleno para que «ninguna compañía se marche de él insatisfecha»."
 artifact_harp_dagda_name: "[fetish_artifact_icon]Arpa de Dagda"
 artifact_harp_dagda_description: "Cuando llegaron por primera vez a Irlanda, los Tuatha de Danaan trajeron consigo muchos grandes tesoros. Dos de ellos residen en la fortaleza fianna de Tara Plateada. Uno es el Arpa de Dagda, que puede dar vida a los campos, debilidad al enemigo y alegría hasta al guerrero más sombrío; se sabe incluso que ha curado el Harano."
 artifact_silver_spear_name: "[fetish_artifact_icon]Lanza de Plata"
 artifact_silver_spear_description: "Aunque la lanza es un arma poco común para los guerreros de Gaia, la famosa destreza de Kazimier con ella ha demostrado que puede ser tan letal como cualquier Klaive tradicional."
 artifact_anklet_false_trails_name: "[fetish_artifact_icon]Tobillera de Senderos Falsos"
 artifact_anklet_false_trails_description: "Hecha con el pelaje trenzado de un animal, este fetiche disfraza el rastro de quien lo lleva como si fuera el de otro animal."
 artifact_eye_leech_name: "[fetish_artifact_icon]Ojo de la Sanguijuela"
 artifact_eye_leech_description: "Este ojo de vampiro seco y conservado, guardado en una pequeña bolsa, «llora» sangre por su superficie si un vampiro vigila a su dueño."
 artifact_owl_feather_name: "[fetish_artifact_icon]Pluma de Búho"
 artifact_owl_feather_description: "Trenzada en el cabello o el pelaje de su dueño, esta pluma de búho aumenta el sigilo mientras está activa."
 artifact_owner_bridle_name: "[fetish_artifact_icon]Brida del Dueño"
 artifact_owner_bridle_description: "Esta sencilla brida de cuero permite a una Fera enmascarar su naturaleza depredadora, logrando que un posible montura no sienta tanto miedo como lo haría de otro modo."
 artifact_dyonisian_horn_name: "[fetish_artifact_icon]Cuerno Dionisíaco"
 artifact_dyonisian_horn_description: "Decorado con grabados de sátiros y festejos bailando y banqueteando, este cuerno para beber transforma cualquier líquido vertido en un vino potente."
 artifact_shield_arrows_name: "[fetish_artifact_icon]Escudo de Flechas"
 artifact_shield_arrows_description: "Este pequeño escudo es casi impenetrable a los proyectiles. El espíritu tortuga que alberga hace que caigan inofensivos al suelo antes de alcanzar su objetivo."
 artifact_amulet_tongues_name: "[fetish_artifact_icon]Amuleto de las Lenguas"
 artifact_amulet_tongues_description: "Este pequeño talismán de madera que se cuelga del cuello permite a su usuario entender cualquier idioma, incluido el habla de los espíritus, mientras esté activado."
 artifact_unicorn_ire_name: "[fetish_artifact_icon]Ira del Unicornio"
 artifact_unicorn_ire_description: "Este poderoso fetiche parece hecho de suave marfil, con un mango que recuerda al cuerno de un unicornio. Al activarse, causa un daño atroz a los enemigos contaminados por el Wyrm, pero pierde casi todo su poder contra otros objetivos."
 artifact_stag_klaive_name: "[fetish_artifact_icon]Klaive del Ciervo"
 artifact_stag_klaive_description: "Esta apreciada posesión de los Fianna de la familia Rhys contiene un espíritu de ciervo además del habitual espíritu de guerra de las Grandes Klaives. Esto otorga al usuario una movilidad sin igual en combate."
 artifact_bog_render_name: "[fetish_artifact_icon]Desgarrador de Ciénagas"
 artifact_bog_render_description: "Uno de los Labrys de las Furias Negras más famosos y antiguos; según algunos, este poderoso fetiche está destinado a usarse en una batalla que cambiará el mundo dentro de muchos siglos."
 artifact_fertility_charm_name: "[fetish_artifact_icon]Amuleto de Fertilidad"
 artifact_fertility_charm_description: "Las Furias Negras ligan espíritus de animales fértiles, como conejos o ranas, a estos pequeños amuletos. Aunque aumentan la probabilidad de que una mujer quede embarazada, no son lo bastante potentes para alterar la probabilidad de que el hijo sea Garou."
 artifact_quiver_silvered_arrows_name: "[fetish_artifact_icon]Carcaj de Flechas Plateadas"
 artifact_quiver_silvered_arrows_description: "Creadas por las Furias Negras en épocas de guerra abierta contra otras tribus (en especial la Camada de Fenris), estas flechas son irrompibles, más afiladas que las corrientes y, obviamente, usan la plata para infligir un daño atroz."
 artifact_cavern_torc_name: "[fetish_artifact_icon]Torque de las Cavernas"
 artifact_cavern_torc_description: "Cuando se lleva este fetiche imbuido de murciélago, el Garou ve en la más negra oscuridad bajo tierra. También se le alerta de las amenazas que pudieran acechar cerca."
 artifact_bow_artemis_name: "[fetish_artifact_icon]Arco de Artemisa"
 artifact_bow_artemis_description: "Solo pueden usarlo las Furias Negras Doncellas; este arco está fabricado con una de las crías del propio Pegaso. Es el arco de caza perfecto, pero también un potente arma de guerra, sobre todo combinado con flechas de Perdición o plateadas."
 artifact_pandora_box_name: "[fetish_artifact_icon]Caja de Pandora"
 artifact_pandora_box_description: "Llamada así por el (in)famoso mito griego, esta caja sirve tanto para atrapar como para liberar Espíritus de Perdición. Pronunciando una orden en griego antiguo, la Furia Negra puede entablar un duelo de voluntades que, con suerte, termina con la captura de la Perdición elegida. Un fracaso implica la posibilidad de liberar a algunas de las capturadas."
 artifact_labrys_isthmene_name: "[fetish_artifact_icon]Labrys de Isthmene"
 artifact_labrys_isthmene_description: "Dedicado a la Gorgona de la batalla, este Labrys solo pueden usarlo las mujeres. En sus manos inflige daño agravado y permite canalizar a través de él el don Espíritu de la Refriega."
 artifact_lash_furies_name: "[fetish_artifact_icon]Látigo de las Furias"
 artifact_lash_furies_description: "Se dice que estos látigos fueron cortados de los intestinos de una gran bestia del Wyrm (o del león de Nemea, según algunas fuentes) y se usan más para torturar que para combatir. Un golpe del Látigo extrae uno de los secretos culpables del objetivo en un destello de dolor lacerante."
 artifact_cloak_artemis_name: "[fetish_artifact_icon]Capa de Artemisa"
 artifact_cloak_artemis_description: " «A mis hijas más jóvenes, para que confundan el ojo del Hombre.» "
 artifact_salve_artemis_name: "[fetish_artifact_icon]Bálsamo de Artemisa"
 artifact_salve_artemis_description: " «A la más sabia de mis hijas, para que unja las heridas de sus hermanas.» "
 artifact_bridle_artemis_name: "[fetish_artifact_icon]Brida de Artemisa"
 artifact_bridle_artemis_description: " «A mis hijas que se hacen madres, para que refrenen el Salvaje que hay en nosotras.» "
 artifact_loom_artemis_name: "[fetish_artifact_icon]Telar de Artemisa"
 artifact_loom_artemis_description: " «A mis hijas artesanas, para que tejan tapices de sabiduría.» " #sic for wisdomS with a s
 artifact_golden_bow_artemis_name: "[fetish_artifact_icon]Arco Dorado de Artemisa"
 artifact_golden_bow_artemis_description: "#bold Convierte el daño en [POD_aggravated_damage|E].#!\n\n «A mis hijas guerreras, para que abatan a los enemigos de la Naturaleza.» " 
    
     
 

 
 
 
 