l_spanish:
 POD_inquihunt_interaction: "Encontrar Guarida"
 POD_inquihunt_interaction_desc: "Intentarás averiguar la ubicación exacta de este engendro. Entonces comenzará la caza. Obviamente, esto conlleva riesgos graves..."
 I_CAN_ONLY_PLOT_ONE_INQUIHUNT_AT_A_TIME_TRIGGER: "Solo se puede planear una caza a la vez"
 scheme_interaction_tt_inquihunt_approved: "Intentarás averiguar la ubicación exacta de este engendro. Entonces comenzará la caza. Obviamente, esto conlleva riesgos graves..." 
 inquihunt: "Buscar conjura del escondite"
 inquihunt_action: "Encontrar Guarida"
 inquihunt_interaction: "Buscar escondite #weak (Conjura)#!"
 inquihunt_desc: "Destruiré a [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] y purgaré su impureza de esta tierra"
 inquihunt_desc_general: "Intentar localizar al engendro antes de lanzar un asalto"
 INQUIHUNT_SUCCESS_DESC: "Comenzarás el ataque final contra [TARGET_CHARACTER.GetShortUIName]"
 INQUIHUNT_DISCOVERY_DESC: "@warning_icon! Estás expuesto por el [crime|E] de caza de brujas"
 inquihunt_my_intrigue: "Tu Intriga: $VALUE|=+0$"
 inquihunt_my_rival: "Tu Víctima: $VALUE|=+0$"
 POD_inquihunt_effect_message: "Si tienes el Estilo de vida de Fe Verdadera, obtendrás algo de experiencia de Fe Verdadera dependiendo de la edad del vampiro asesinado."
 POD_inquihunt.667.t: "Rastro perdido"
 POD_inquihunt.667.desc: "Tu presa ha logrado escapar de tus persistentes intentos de rastrearla. Probablemente ayudada por otros agentes del Diablo, han regresado de arrastrarse desde el agujero de donde salieron, ocultándose de ti. Dios es paciente, sin embargo, y tú también lo eres. No evitarán la estaca para siempre."
 POD_inquihunt.667.option.a: "Parece que me estaban esperando"
 POD_inquihunt.1.t: "En la Cacería"
 POD_inquihunt.1.desc: "Finalmente has rastreado al engendro hasta su escondite. No puede haber errores, ya que la pobre gente de los alrededores claramente ha perdido el amor de [ROOT.Char.GetFaith.HighGodName]. Son cáscaras paranoicas y sin alma que temen salir por la noche, e incluso la Iglesia yace estéril.\nTú y tu pequeño séquito sois claramente la única esperanza de este lugar. Mientras instalas tu campamento, es hora de reflexionar sobre tu próximo movimiento. El Señor ciertamente te ha guiado a este escondite del mal, pero cómo destruirlo queda a tu criterio..."
 POD_inquihunt.1.desc.fera: "Finalmente has rastreado al engendro hasta su escondite. No puede haber errores, ya que los simios de los alrededores son cáscaras paranoicas y contaminadas por la $glossary_wyrm$, que temen salir por la noche.\nMientras exploras la zona, es hora de reflexionar sobre tu próximo movimiento. Has encontrado el escondite de la corrupción, pero cómo destruirlo queda a tu criterio..." 
 POD_inquihunt.1.option.a: "La gente común aún no se ha perdido en la oscuridad. Prediquemos."
 POD_inquihunt.1.option.a.fera: "Con algo de persuasión, los simios pueden ser incitados a una furia contra la sanguijuela."
 POD_inquihunt.1.option.a.generic: "¡Debo convencerlos!"
 POD_inquihunt.1.option.aa.effect.success.desc: "Un éxito crítico asegurará una victoria rápida para tu causa"  
 POD_inquihunt.1.option.ab.effect.success.desc: "Un empate... el engendro seguirá causando problemas"      
 POD_inquihunt.1.option.ac.effect.success.desc: "No cometas errores, o el enemigo seguramente acabará contigo rápidamente"      
 POD_inquihunt.1.option.f: "Tengo un mal presentimiento sobre esto"       
 POD_inquihunt.1.option.f.custom: "Este no es el lugar ni el momento, volverás en otra ocasión"       
 POD_inquihunt.1.option.b: "¡Soldados de [ROOT.Char.GetFaith.HighGodName]! ¡Asaltaremos este castillo hoy mismo!"
 POD_inquihunt.1.option.b.fera: "¡Elegidos de Gaia! ¡Asaltaremos este castillo hoy mismo!"
 POD_inquihunt.1.option.c: "Destruyamos sus Activos e aislemos al engendro primero"
 POD_inquihunt.1.option.d: "Temen la luz de [ROOT.Char.GetFaith.HighGodName]. Actuemos durante el día"
 POD_inquihunt.1.option.d.fera: "Helios nos ayudará. Actuemos durante el día"
 POD_inquihunt.1.option.e: "Puede que tenga algo sobre este demonio en particular en mis libros..."
 POD_inquihunt.1.option.g: "¡Yo mismo te mataré, engendro!"
 POD_inquihunt.2.t: "Una hoguera satisfactoria"
 POD_inquihunt.2.desc: "Fue más fácil de lo que pensabas traer a estas pobres almas a la luz de [ROOT.Char.GetFaith.HighGodNamePossessive]. Estaban ansiosas por escuchar y aprender tras tantos años perdidas en la oscuridad.\nUna vez hecho esto, fue aún más fácil aliarse con ellas y usar todo lo que sabían sobre el engendro que acecha por la noche. Así, con todo el pueblo a cuestas, asaltaste su guarida, conteniéndolo fácilmente gracias a la superioridad numérica y la ayuda de la luz otorgada por [ROOT.Char.GetFaith.HighGodNamePossessive].\nY con todo esto dicho y hecho, ahora disfrutas viendo al demonio arder en la hoguera mientras todo el pueblo aclama a [ROOT.Char.GetFaith.HighGodNamePossessive] y a ti, por tu nombre."
 POD_inquihunt.2.desc.fera: "Fue más fácil de lo que pensabas reunir a una turba de humanos. Estaban ansiosos por derrocar a la engendro del $glossary_wyrm$ que se daba un festín con sus parientes.\nUna vez hecho esto, fue aún más fácil aliarse con ellos y usar todo lo que sabían sobre el engendro que acecha por la noche. Así, con todo el pueblo a cuestas, asaltaste su guarida, conteniéndolo fácilmente gracias a la superioridad numérica.\nY con todo esto dicho y hecho, ahora disfrutas viendo al demonio arder en la hoguera mientras todo el pueblo aclama ¡con júbilo!"
 POD_inquihunt.2.option.a: "Tal espectáculo me reconforta el corazón"
 POD_inquihunt.3.t: "Hijos contra Padres"
 POD_inquihunt.3.t.fera: "La turba indisciplinada"
 POD_inquihunt.3.desc: "El engendro parece tener sus garras hundidas en esta aldea. Tu predicación ha reunido a un gran número de seguidores, pero también a un pequeño grupo de rebeldes que ahora se oponen a tu procesión sagrada a la entrada de la guarida del demonio.\nClaramente, han sido corrompidos por el Diablo, pero no tienes tiempo para salvar sus almas, ya que el vampiro sin duda escapará cuando oiga la conmoción exterior. Sin embargo, hay otra opción, más rápida, pero también moralmente dudosa..."
 POD_inquihunt.3.desc.fera: "El engendro parece tener sus garras hundidas en esta aldea. Tu agitación de masas ha reunido a un gran número de seguidores, pero también a un pequeño grupo de leales a la Sanguijuela que ahora se oponen a tu turba a la entrada de la guarida del cadáver.\nClaramente, han sido corrompidos por el $glossary_wyrm$, pero no debes demorarte, ya que el vampiro sin duda escapará cuando oiga la conmoción exterior. Sin embargo, hay otra opción, más rápida, pero también moralmente dudosa..." 
 POD_inquihunt.3.option.a: "Mátalos a todos y deja que Dios decida su destino"  ##historical quote, leaving God here is fine
 POD_inquihunt.3.option.b: "Ningún Inocente saldrá herido, ni siquiera los Inocentes extraviados"
 POD_inquihunt.4.t: "Ironía ardiente"
 POD_inquihunt.4.desc: "Subestimaste gravemente la influencia que este engendro tenía sobre esta aldea. Tu sermón fue recibido con Escepticismo, o incluso con pura ira. Fue demasiado tarde cuando descubriste la verdad: todos estaban bajo el dominio del vampiro todo este tiempo.\nTu séquito fue asesinado mientras dormían y fuiste llevado sin ceremonias a la hoguera que tenías destinada al engendro. Mientras las llamas comienzan a envolverte, recuerdas que Dios es misericordia. Así que, que Él tenga piedad de tu fracaso y de las almas de estos Inocentes extraviados."
 POD_inquihunt.4.desc.generic: "Subestimaste gravemente la influencia que este engendro tenía sobre esta aldea. Tu retórica fue recibida con Escepticismo, o incluso con pura ira. Fue demasiado tarde cuando descubriste la verdad: todos estaban bajo el dominio del vampiro todo este tiempo.\nTu séquito fue asesinado mientras dormían y fuiste llevado sin ceremonias a la hoguera que tenías destinada al engendro. Mientras las llamas comienzan a envolverte, recuerdas que, en verdad, siempre estuvo destinado a terminar así. Hiciste lo que pudiste."
 POD_inquihunt.4.desc.fera: "Subestimaste gravemente la influencia que este engendro tenía sobre esta aldea. Tu agitación de masas fue recibida con Escepticismo, o incluso con pura ira. Fue demasiado tarde cuando descubriste la verdad: todos estaban bajo el dominio del vampiro todo este tiempo.\nTus seguidores fueron asesinados mientras dormían y fuiste llevado sin ceremonias a la hoguera que tenías destinada al engendro. Mientras las llamas comienzan a envolverte, esperas ser un mejor guerrero de Gaia en la próxima vida."
 POD_inquihunt.4.option.a: "termina como empezó, en fuego."
 POD_inquihunt.5.t: "El plan perfecto"
 POD_inquihunt.5.desc: "El orgullo es un pecado, pero debes admitirlo: fue un asalto impecable y ejecutado con maestría por los valientes Caballeros de Dios bajo tu mando. A pesar de los numerosos Esclavos que defendían la zona, e incluso más trampas, lograste asaltar el lugar con pocas bajas al final.\nObviamente, atacaste a plena luz del día, y debes atribuir el mérito a la luz de Dios por haber mantenido al engendro dormido durante la batalla. Tras tomar el castillo, fue un momento anticlimático, pero satisfactorio, cuando decapitaste al vampiro dormido. La victoria es tuya una vez más."
 POD_inquihunt.5.desc.generic: "El exceso de confianza es un asesino lento e insidioso, pero debes admitirlo: fue un asalto impecable y ejecutado con maestría por los valientes cazadores bajo tu mando. A pesar de los numerosos Esclavos que defendían la zona, e incluso más trampas, lograste asaltar el lugar con pocas bajas al final.\nObviamente, atacaste a plena luz del día, y debes atribuir el mérito a esa estratagema por haber mantenido al engendro dormido durante la batalla. Tras tomar el castillo, fue un momento anticlimático, pero satisfactorio, cuando decapitaste al vampiro dormido. La victoria es tuya una vez más."
 POD_inquihunt.5.desc.fera: "Fue un asalto impecable y ejecutado con maestría por las fuerzas bajo tu mando. A pesar de los numerosos Esclavos que defendían la zona, e incluso más trampas, lograste asaltar el lugar con pocas bajas al final.\nObviamente, atacaste a plena luz del día, y debes atribuir el mérito a la luz de Helios por haber mantenido al engendro dormido durante la batalla. Tras tomar el castillo, fue un momento anticlimático, pero satisfactorio, cuando decapitaste al vampiro dormido. La victoria es tuya una vez más." 
 POD_inquihunt.5.option.a: "Me encanta cuando un plan sale bien."
 POD_inquihunt.6.t: "¿Victoria pírrica?"
 POD_inquihunt.6.desc: "Mientras la batalla aún ruge dentro del castillo, sabes que la victoria está al alcance de tu mano. Pero, ¿vale la pena el coste? Sus defensores estaban preparados y numerosas trampas ya se han cobrado la vida de buenos soldados de Dios. ¿Es el castigo de un engendro muerto suficiente para estas pobres almas?\nNo es demasiado tarde, y aún podrías cancelar el ataque por hoy, pero el vampiro obviamente usará el manto de la noche para escapar. O bien sigues adelante, cargando siempre con el peso de los hombres buenos perdidos por una causa digna."
 POD_inquihunt.6.desc.generic: "Mientras la batalla aún ruge dentro del castillo, sabes que la victoria está al alcance de tu mano. Pero, ¿vale la pena el coste? Sus defensores estaban preparados y numerosas trampas ya se han cobrado la vida de hombres y mujeres de bien bajo tu mando. ¿Es el castigo de un engendro muerto suficiente para estas pobres almas?\nNo es demasiado tarde, y aún podrías cancelar el ataque por hoy, pero el vampiro obviamente usará el manto de la noche para escapar. O bien sigues adelante, cargando siempre con el peso de los Compañeros perdidos por una causa digna."
 POD_inquihunt.6.desc.fera: "Mientras la batalla aún ruge dentro del castillo, sabes que la victoria está al alcance de tu mano. Pero, ¿vale la pena el coste? Sus defensores estaban preparados y numerosas trampas ya se han cobrado la vida de guerreros de Gaia. ¿Es el castigo de un engendro muerto suficiente para estos parientes?\nNo es demasiado tarde, y aún podrías cancelar el ataque por hoy, pero el vampiro obviamente usará el manto de la noche para escapar. O bien sigues adelante, cargando siempre con el peso de los buenos seguidores perdidos por una causa digna."
 POD_inquihunt.6.option.a: "¡La victoria merece el sacrificio!"
 POD_inquihunt.6.option.b: "Ese camino fácil conduce a la condenación."
 POD_inquihunt.7.t: "La última batalla"
 POD_inquihunt.7.desc: "Todo ha salido terriblemente mal. El castillo estaba preparado y ni siquiera pudiste romper las murallas. Peor aún, llegaron refuerzos de una ciudad cercana, que aparentemente también está bajo el dominio del Señor Oscuro del castillo. El propio engendro está tan cerca, pero a la vez tan lejos.\nNo te queda escapatoria a ti ni a tus valientes caballeros, y parece que Dios te reclamará a Su reino hoy mismo. Esperas ser digno de Su misericordia, pero antes de eso... acabarás con tantos de estos demonios como puedas."
 POD_inquihunt.7.desc.generic: "Todo ha salido terriblemente mal. El castillo estaba preparado y ni siquiera pudiste romper las murallas. Peor aún, llegaron refuerzos de una ciudad cercana, que aparentemente también está bajo el dominio del Señor Oscuro del castillo. El propio engendro está tan cerca, pero a la vez tan lejos.\nNo te queda escapatoria a ti ni a tus valientes cazadores y tu fin es ahora inevitable. Pero antes de eso... acabarás con tantos de estos demonios como puedas."
 POD_inquihunt.7.desc.fera: "Todo ha salido terriblemente mal. El castillo estaba preparado y ni siquiera pudiste romper las murallas. Peor aún, llegaron refuerzos de una ciudad cercana, que aparentemente también está bajo el dominio del Señor Oscuro del castillo. El propio engendro está tan cerca, pero a la vez tan lejos.\nNo te queda escapatoria y tus valientes guerreros perecerán. Acabarás con tantos engendros del $glossary_wyrm$ como puedas."
 POD_inquihunt.7.option.a: "Es un buen día para morir"
 POD_inquihunt.8.t: "Activos en llamas"
 POD_inquihunt.8.desc: "Tu ataque fue metódico. Te dirigiste a cada gremio, milicia o grupo de cultistas en el que el engendro tenía sus garras. Usaste dos armas poderosas: el señuelo del oro para los codiciosos y el miedo a la Iglesia para los corruptos.\nY así ha llegado a esto: tu campaña ha aislado al vampiro, ha distanciado a sus aliados y ha dispersado a sus esclavos. Ahora contemplas cómo el último refugio del engendro arde ante tus ojos, mientras los gritos de la criatura en su interior son como música para tus oídos."
 POD_inquihunt.8.desc.generic: "Tu ataque fue metódico. Te dirigiste a cada gremio, milicia o grupo de Cultistas en el que el engendro tenía sus garras. Usaste dos armas poderosas: el señuelo del oro para los codiciosos y el miedo a tu ira para los corruptos.\nY así ha llegado a esto: tu campaña ha aislado al Vampiro, ha distanciado a sus aliados y ha dispersado a sus Esclavos. Ahora contemplas el último refugio del engendro ardiendo ante tus ojos, mientras los gritos de la criatura en su interior son como música para tus oídos."
 POD_inquihunt.8.desc.fera: "Tu ataque fue metódico. Te dirigiste a cada gremio, milicia o grupo de Cultistas en el que el engendro tenía sus garras. Usaste dos armas poderosas: el señuelo del oro para los codiciosos y el miedo al castigo para los corruptos.\nY así ha llegado a esto: tu campaña ha aislado al Vampiro, ha distanciado a sus aliados y ha dispersado a sus Esclavos. Ahora contemplas el último refugio del engendro ardiendo ante tus ojos, mientras los gritos de la criatura en su interior son como música para tus oídos." 
 POD_inquihunt.8.option.a: "Estás despedido"
 POD_inquihunt.9.t: "Una vida de mercenario para mí"
 POD_inquihunt.9.desc: "Esta criatura perversa tenía más influencia en la región de lo que pensaste al principio. Sin embargo, te has mantenido estoico y ahora estás bastante seguro de que la mayoría de sus activos han sido destruidos por tus acciones.\nPero parece que el vampiro no caerá fácilmente, ya que una poderosa banda de mercenarios marcha ahora hacia tu posición, aparentemente contratada por tu enemigo para eliminarte. Tienes una opción: los mercenarios aman el oro y podrías ponerlos en contra de su empleador antes de que puedan huir. O puedes minimizar tus pérdidas y aceptar un empate por esta vez."
 POD_inquihunt.9.option.a: "Ofrezco oro y salvación a hombres piadosos como tú."
 POD_inquihunt.9.option.a.fera: "Algunos hombres lucharán contra monstruos, siempre que el precio sea el adecuado."
 POD_inquihunt.9.option.b: "Atraparé a este demonio la próxima vez"
 POD_inquihunt.10.t: "Cambio de gestión"
 POD_inquihunt.10.desc: "Te equivocaste de cálculo. Tus acciones fueron contrarrestadas en cada paso. Este vampiro simplemente tenía más oro, más agentes y más influencia sobre esta comunidad de lo que jamás pudiste haber anticipado.\nY ahora, todo se derrumba, literalmente, después de que tu último error revelara tu posición al engendro. Un grupo de curtidos «mercenarios» no tardó en aparecer y, con solo tus fieles caballeros de Dios para protegerte, no pasó mucho tiempo antes de que fueras sitiado en tu propia base. Mientras los últimos sonidos de la batalla mueren afuera, ahora oyes el sonido de antorchas siendo lanzadas por la ventana. Afortunadamente, tienes tiempo para un último Pater Noster."
 POD_inquihunt.10.desc.generic: "Te equivocaste de cálculo. Tus acciones fueron contrarrestadas en cada paso. Este vampiro simplemente tenía más oro, más agentes y más influencia sobre esta comunidad de lo que jamás pudiste haber anticipado.\nY ahora, todo se derrumba, literalmente, después de que tu último error revelara tu posición al engendro. Un grupo de curtidos «mercenarios» no tardó en aparecer y, con solo tus fieles cazadores para protegerte, no pasó mucho tiempo antes de que fueras sitiado en tu propia base. Mientras los últimos sonidos de la batalla mueren afuera, ahora oyes el sonido de antorchas siendo lanzadas por la ventana. El fin está cerca."
 POD_inquihunt.10.desc.fera: "Te equivocaste de cálculo. Tus acciones fueron contrarrestadas en cada paso. Este vampiro simplemente tenía más oro, más agentes y más influencia sobre esta comunidad de lo que jamás pudiste haber anticipado.\nY ahora, todo se derrumba, literalmente, después de que tu último error revelara tu posición al engendro. Un grupo de curtidos «mercenarios» no tardó en aparecer y, con solo tus fieles parientes para protegerte, no pasó mucho tiempo antes de que fueras sitiado en tu propio campamento. Mientras los últimos sonidos de la batalla mueren afuera, ahora oyes el sonido de antorchas siendo lanzadas al campamento. Parece que este es el fin." 
 POD_inquihunt.10.option.a: "Pater noster qui es in caelis..."
 POD_inquihunt.10.option.a.fera: "Vorus se ríe de mi derrota."
 POD_inquihunt.10.option.a.generic: "El fin del camino."
 POD_inquihunt.11.t: "El enemigo de mi enemigo..."
 POD_inquihunt.11.desc: "Una cosa que sabes sobre los vampiros es que la mayoría son hostiles entre sí. Y tú te has convertido en un experto en usar este hecho a tu favor.\nAl dejar algunas pistas sobre este guarida en particular a un conocido nido de demonios vecino, simplemente te sentaste a observar cómo tu objetivo era asaltado durante la noche por unos matones contratados por su rival. Ganaron, pero quedaron lo suficientemente debilitados como para que tus caballeros pudieran someterlo fácilmente. Rápidamente le encontraste un nuevo hogar en tu cámara de tortura personal. Luego pasaste unos días muy reveladores con él hasta que dejaste que se desangrara hasta la muerte definitiva. La voluntad de Dios se ha cumplido."
 POD_inquihunt.11.desc.fera: "Una cosa que sabes sobre los vampiros es que la mayoría son hostiles entre sí. Y tú te has convertido en experto en usar este hecho a tu favor.\nAl dejar algunas pistas sobre esta guarida en particular a un conocido nido de demonios vecino, simplemente te sentaste a observar cómo tu objetivo era asaltado durante la noche por unos matones contratados por su rival. Ganaron, pero quedaron lo suficientemente debilitados como para que tus guerreros pudieran someterlo fácilmente. Solo tuviste que lanzarte para dar el golpe final." 
 POD_inquihunt.11.option.a: "Los gritos que emiten en presencia de una Reliquia Sagrada fueron bastante interesantes..."
 POD_inquihunt.11.option.a.generic: "Casi demasiado fácil."
 POD_inquihunt.11.option.a.fera: "Hay mucha gloria en destruir a las sanguijuelas."
 POD_inquihunt.12.t: "Cruz y daga"
 POD_inquihunt.12.t.fera: "Depredador y presa"
 POD_inquihunt.12.desc: "Estás impresionado por la astucia de este engendro. La mayoría de tus objetivos anteriores cayeron con bastante facilidad una vez que tejiste tu red de Intriga a su alrededor, pero este... este contraatacó. Con fuerza.\nTu propia red es atacada, con viciosos rumores dirigidos hacia ti en particular. Sabes que puedes con esta guerra en las sombras, pero te costará mucho reparar el daño causado por tu enemigo. Sin embargo, presionar solo un poco más te permitiría la alegría de llevar a este vampiro a tu mejor cámara de tortura... Decisiones, decisiones."
 POD_inquihunt.12.desc.fera: "Estás impresionado por la astucia de este engendro. La mayoría de tus objetivos anteriores cayeron con bastante facilidad una vez que tejiste tu red de Intriga a su alrededor, pero este... este contraatacó. Con fuerza.\nTu propia red es atacada, con viciosos rumores dirigidos hacia ti en particular. Sabes que puedes con esta guerra en las sombras, pero te costará mucho reparar el daño causado por tu enemigo. Presionar solo un poco más te permitiría vencer a este vampiro. Decisiones, decisiones." 
 POD_inquihunt.12.option.a: "La reputación no lo es todo"
 POD_inquihunt.12.option.b: "Este demonio no merece el esfuerzo"
 POD_inquihunt.13.t: "Encontrando a tu superior"
 POD_inquihunt.13.desc: "No tuviste ninguna oportunidad. Cada una de tus acciones fue anticipada, cada movimiento que hiciste fue fácilmente contrarrestado. No eras más que un niño jugando a las ajedrez sin conocer las reglas. Este vampiro probablemente inventó el juego.\nIncluso cuando comprendiste el peligro en el que te encontrabas, era demasiado tarde. Y así, ahora estás siendo torturado noche tras noche por aquel al que estúpidamente querías destruir. E incluso en este campo particular, ellos saben mucho más que tú..."
 POD_inquihunt.13.option.a: "La noche es oscura y está llena de terrores"
 POD_inquihunt.14.t: "Conoce a tu enemigo"
 POD_inquihunt.14.desc: "Te alegró bastante ver que tenías algunas menciones antiguas sobre el engendro en particular que rastreaste en tus libros. Te alegró aún más saber de su peculiar apego a una familia mortal todavía viva. ¡Como si estas criaturas pudieran sentir emociones mortales!\nBueno, no importa, esta era una información bastante fácil de explotar. Al usar a estos mortales como cebo, lograste atraer al vampiro a una trampa cuidadosamente planeada en suelo sagrado. Este engendro específico se convirtió instantáneamente en cenizas al entrar en el área, una observación que no tardaste en consignar en tu diario."
 POD_inquihunt.14.option.a: "Esto podría ser útil para el próximo"
 POD_inquihunt.15.t: "Un libro demasiado lejos"
 POD_inquihunt.15.desc: "Este engendro es esquivo. Ya ha evitado dos de tus trampas cuidadosamente planeadas y estás empezando a perder terreno, ya que varios de tus agentes han desaparecido.\nAún queda una posibilidad, una que has elegido no usar hasta ahora dada su naturaleza... «mística». La Santa Iglesia ciertamente no aprobaría tal elección, ¿pero quizás la muerte de este vampiro específico valga más que tu reputación?"
 POD_inquihunt.15.desc.generic: "Este engendro es esquivo. Ya ha evitado dos de tus trampas cuidadosamente planeadas y estás empezando a perder terreno, ya que varios de tus agentes han desaparecido.\nAún queda una posibilidad, una que has elegido no usar hasta ahora dada su naturaleza... «mística». Un dudoso contacto tuyo en la zona se ha ofrecido a ayudar, pero confiar en esta fuente probablemente contaminada podría dañar tu reputación."
 POD_inquihunt.15.desc.fera: "Este engendro es esquivo. Ya ha evitado dos de tus trampas cuidadosamente planeadas y estás empezando a perder terreno, ya que varios de tus agentes han desaparecido.\nAún queda una posibilidad, una que has elegido no usar hasta ahora dada su naturaleza... «mística». Un peligroso espíritu se ha puesto en contacto conmigo ofreciendo su «ayuda»."
 POD_inquihunt.15.option.a: "[ROOT.Char.GetFaith.HighGodName] es misericordioso después de todo..."
 POD_inquihunt.15.option.a.desc: "Cueste lo que cueste, lo pagaré."
 POD_inquihunt.15.option.b: "Es una línea que no cruzaré"
 POD_inquihunt.16.t: "Si miras al Abismo..."
 POD_inquihunt.16.desc: "No sabes realmente cuándo empezó. Encontraste una referencia del vampiro en un libro antiguo, luego otra... y empezaste a leer. Y mucho más cuando algunos agentes que no recuerdas haber contratado te trajeron nuevos libros.\nHas estado perdido durante bastante tiempo en tu trabajo y has cavado profundo, probablemente demasiado profundo. Al menos, eso es lo que piensa la Iglesia, ya que uno de tus caballeros te denunció por tus lecturas «heréticas». Y así, aquí estás, ante una hoguera una vez más, pero esta vez no ante el público..."
 POD_inquihunt.16.desc.generic: "No sabes realmente cuándo empezó. Encontraste una referencia del vampiro en un libro antiguo, luego otra... y empezaste a leer. Y mucho más cuando algunos agentes que no recuerdas haber contratado te trajeron nuevos libros.\nHas estado perdido durante bastante tiempo en tu trabajo y has cavado profundo, probablemente demasiado profundo. Al menos, eso es lo que piensa el clero local, ya que uno de tus Compañeros te denunció por tus lecturas «heréticas». Y así, aquí estás, ante una hoguera una vez más, pero esta vez no ante el público..."
 POD_inquihunt.16.desc.fera: "No sabes realmente cuándo empezó. Encontraste una referencia del vampiro en un libro antiguo, luego otra... y empezaste a leer. Y mucho más cuando algunos agentes que no recuerdas haber contratado te trajeron nuevos libros.\nHas estado perdido durante bastante tiempo en tu trabajo y has cavado profundo, probablemente demasiado profundo. Entonces el espíritu se te acercó con una oferta peligrosa. Demasiado peligrosa, que te condujo a una trampa y, finalmente, a tu muerte." 
 POD_inquihunt.16.option.a: "¡Estaba tan cerca de la verdad! ¡Tan cerca!"
 POD_inquihunt.17.t: "Furia Santa"
 POD_inquihunt.17.t.fera: "La Furia de Gaia"
 POD_inquihunt.17.desc: "No esperaban un asalto frontal. Eso es lo que concluyes tras abrirte paso entre un número significativo de Esclavos desprevenidos del vampiro antes de encontrar su lugar de descanso. Aunque has atacado de día, el estruendo de la batalla ha despertado al engendro que te estaba esperando.\nDebes admitir que se han lucido, por muy lentos que sean durante el día, pero en definitiva, has logrado cortarles la cabeza con bastante facilidad antes de que pudieran orientarse realmente en esta batalla. Un chupasangre menos en la justa Tierra de Dios."
 POD_inquihunt.17.desc.generic: "No esperaban un asalto frontal. Eso es lo que concluyes tras abrirte paso entre un número significativo de Esclavos desprevenidos del vampiro antes de encontrar su lugar de descanso. Aunque has atacado de día, el estruendo de la batalla ha despertado al engendro que te estaba esperando.\nDebes admitir que se han lucido, por muy lentos que sean durante el día, pero en definitiva, has logrado cortarles la cabeza con bastante facilidad antes de que pudieran orientarse realmente en esta batalla. Una baja más para tu ballesta."
 POD_inquihunt.17.desc.fera: "No esperaban un asalto frontal. Eso es lo que concluyes tras abrirte paso entre un número significativo de Esclavos desprevenidos del vampiro antes de encontrar su lugar de descanso. Aunque has atacado de día, el estruendo de la batalla ha despertado al engendro que te estaba esperando.\nDebes admitir que se han lucido, por muy lentos que sean durante el día, pero en definitiva, has logrado cortarles la cabeza con bastante facilidad antes de que pudieran orientarse realmente en esta batalla. Un sirviente menos del $glossary_wyrm$ que succióna la Esencia de Gaia." 
 POD_inquihunt.17.option.a: "Entonces, ¿dónde está el siguiente?"
 POD_inquihunt.18.t: "Un oponente digno"
 POD_inquihunt.18.desc: "Este es duro. A pesar de haber despachado fácilmente a la mayoría de sus guardias y de haber atacado durante el día, este engendro sigue siendo un enemigo formidable. Confías en que ganarás gracias a la luz del día, pero es un proceso lento y arduo.\nLo que es peor, esta larga batalla ha dado tiempo para que otros Esclavos del vampiro intervengan. Probablemente podrías vencerlos a ellos también, pero no saldrás ileso de una lucha así..."
 POD_inquihunt.18.option.a: "Ganaré, sin importar el coste"
 POD_inquihunt.18.option.b: "Debo preservarme para futuras batallas"
 POD_inquihunt.19.t: "Superado"
 POD_inquihunt.19.desc: "Así es como termina. El engendro, a pesar de ser atacado durante el día, es mucho más fuerte, rápido y resistente que tú. Llegaste a esta conclusión muy pronto en tu enfrentamiento y has hecho las paces con ello.\nAhora, solo es cuestión de retenerlo el tiempo suficiente para que tus tropas se retiren y vivan un día más, algo que estás bastante seguro de que finalmente ha terminado. Con un último golpe, el vampiro se prepara para acabar contigo. Pero tú tienes más paz de la que ellos tendrán jamás, ya que Dios te espera al otro lado."
 POD_inquihunt.19.desc.generic: "Así es como termina. El engendro, a pesar de ser atacado durante el día, es mucho más fuerte, rápido y resistente que tú. Llegaste a esta conclusión muy pronto en tu enfrentamiento y has hecho las paces con ello.\nAhora, solo es cuestión de retenerlo el tiempo suficiente para que tus tropas se retiren y vivan un día más, algo que estás bastante seguro de que finalmente ha terminado. Con un último golpe, el vampiro se prepara para acabar contigo. Estás en paz, pues siempre supiste que así terminaría tu vida."
 POD_inquihunt.19.desc.fera: "Así es como termina. El engendro, a pesar de ser atacado durante el día, es mucho más fuerte, rápido y resistente que tú. Llegaste a esta conclusión muy pronto en tu enfrentamiento y has hecho las paces con ello.\nAhora, solo es cuestión de retenerlo el tiempo suficiente para que tus tropas se retiren y vivan un día más, algo que estás bastante seguro de que finalmente ha terminado. Con un último golpe, el vampiro se prepara para acabar contigo. Buena suerte en la próxima vida." 
 POD_inquihunt.19.option.a: "La luz nunca se apagará del todo"

 POD_inquihunt.50.t: "Caza de lobos"
 POD_inquihunt.50.desc: "Cazar hombres lobo es un asunto terriblemente arriesgado incluso para el más experimentado de los cazadores. Estas criaturas son masas enormes de músculos, trabajan en manadas y rara vez abandonan sus Túmulos bien fortificados, donde cualquier intruso es asesinado al verlo. Sus familias muy unidas, la «Parentela», también los protegen de la necesidad de interactuar con el mundo exterior.\nCazar vampiros casi parece fácil en comparación.\nEl enfoque más obvio sería un asalto frontal usando números abrumadores y armas de plata, ya que estas criaturas son débiles ante este material. Sin embargo, a pesar de todas las ventajas que puedas reunir, es probable que no caigan fácilmente. ¿Estás seguro de que quieres intentarlo?"
 POD_inquihunt.50.option.a: "Ya no hay vuelta atrás."
 POD_inquihunt.50.option.b: "¡Equipad a todos con plata!"
 POD_inquihunt.50.option.c: "Lancemos un ataque cauteloso."
 POD_inquihunt.50.option.z: "No me gustan mis probabilidades."
 hunt_give_up_tt: "Retrocedes, renunciando a esta caza."

 POD_inquihunt.51.t: "Un gran desastre sangriento"
 POD_inquihunt.51.desc: "Fue una batalla tan caótica como pensabas que sería. Esos monstruos dieron tanto (o incluso más) de lo que costó derribarlos. Por suerte, tu superioridad en número, equipo y liderazgo fue suficiente para alzarte con la victoria.\nMientras tus Compañeros entierran respetuosamente a tus caídos y queman sin ceremonias esta mugrienta morada de cambiaformas, te tomas un momento para lavar la sangre y las vísceras de la batalla en un río cercano.\nLos incendios empiezan a extenderse y, hoy, la victoria olerá a cenizas en el viento y a árboles quemados."
 POD_inquihunt.51.option.a: "¿He oído llorar al bosque?"

 POD_inquihunt.52.t: "Un desastre sangriento"
 POD_inquihunt.52.desc: "¿Es que estos monstruos pueden morir?\nA pesar de todo tu conocimiento sobre ellos que demuestra que pueden, esta batalla parece decidida a demostrar que te equivocas. Magullados, cortados, llenos de flechas por sus cuerpos gigantes... siguen abriéndose paso entre tus fuerzas con un terrorífico ease. Su Frenesí inducido por la Furia solo parece hacerlos más fuertes y, aunque eres demasiado experimentado para tener miedo, puedes ver lo que se avecina.\nOrdenando una retirada completa, defiendes tu retaguardia el tiempo suficiente para huir de sus tierras tribales y te alivia ver que han decidido no perseguirte. Esto no es una victoria, pero vives para luchar otro día. Considerando la oposición, es algo por lo menos."
 POD_inquihunt.52.option.a: "Regresaré."

 POD_inquihunt.53.t: "Tu desastre sangriento"
 POD_inquihunt.53.desc: "Parece que el equipo superior, los números y la preparación no fueron rivales para la fuerza salvaje pura.\nDondequiera que mires, ves a uno de tus Compañeros siendo brutalmente despedazado por las garras gigantes de estos monstruos. Tus propios ataques apenas parecen perforar su piel sobrenaturalmente resistente e incluso las heridas más profundas solo los enfurecen y, por tanto, los fortalecen.\nTodo termina demasiado rápido como para que puedas siquiera ordenar una retirada, con algunos de tus hombres habiendo huido ya por su cuenta. Aunque los cambiaformas no siempre persiguen a sus presas, pronto notas que algunos de ellos, incluido tu antiguo objetivo, te han rodeado, comprendiendo claramente que tú eres el líder aquí.\nParece que es hora de la batalla final. Como cazador, siempre supiste que terminaría así."
 POD_inquihunt.53.option.a: "Hice lo que pude."

 POD_inquihunt.80.t: "De vuelta al Infierno"
 POD_inquihunt.80.desc: "Cazar demonios plantea un dilema difícil debido al hecho de que son verdaderamente inmortales. Todo lo que sabes sobre ellos apunta a que matar su forma corpórea es simplemente un contratiempo para ellos, ya que parecen ser criaturas de esencia espiritual ante todo.\nAun así, no se pierde la esperanza, ya que hay formas de asegurar que sean arrojados de vuelta al Infierno al que pertenecen. Estás bastante seguro de que es difícil para un demonio escapar de los Infiernos, necesitando probablemente la ayuda de Infernalistas para lograrlo.\nAsí que, para cazar a un demonio necesitas un buen conocimiento de su debilidad específica, los medios para aislarlos de sus probablemente numerosos Esclavos listos para invocarlos de nuevo y una gran dosis de valor. Tienes lo segundo; queda tiempo para trabajar en los dos primeros."
 POD_inquihunt.80.option.a: "Estoy más que listo."
 POD_inquihunt.80.option.b: "Quiero saber todo lo que se sabe sobre este demonio."
 hunt_demon_abyss_tt: "Este demonio perderá sus títulos y será enviado de vuelta a la Prisión Abismal."

 POD_inquihunt.81.t: "Exorcismo 101"
 POD_inquihunt.81.desc: "Todo transcurrió según lo previsto. Has reunido Inteligencia importante sobre este demonio, incluyendo parte de su [Glossary('True Name','podgloss.truename')], antes de trabajar con su culto. Por suerte, los Cultistas no suelen ser muy listos (de lo contrario, no serían Cultistas, en lo que a ti respecta), así que lograste ser más astuto que ellos y enviarlos a una misión inútil y condenada.\nLo mejor es que nunca tuviste que enfrentarte al demonio en sí. Solo hubo que encontrar su Ancla espiritual en este mundo, usar el fragmento de su [Glossary('True Name','podgloss.truename')] y realizar un exorcismo (posiblemente complejo) para forzar su espíritu a salir de su huésped. Una vez «liberado», la atracción de la Prisión Abismal hizo el resto del trabajo por ti.\nUna caza perfectamente ejecutada."
 POD_inquihunt.81.option.a: "Viaje de ida sin retorno a tu celda."

 POD_inquihunt.82.t: "Cazador contra Demonio"
 POD_inquihunt.82.desc: "Lidiar con los Cultistas del demonio fue bastante fácil; un poco de distracción usando su celo impío bastó para lograrlo. El demonio en sí es un asunto totalmente distinto. Han ocultado todo lo relacionado con su [Glossary('True Name','podgloss.truename')] o su Ancla espiritual en este mundo bajo tantas capas de engaño que tú mismo te has sentido desorientado muchas veces en el camino.\n«Crees» que tienes una pista, pero ahora eres cauteloso; seguirla podría ser una de las muchas trampas que tu objetivo ha dejado para lidiar con amenazas como tú. Si cayeras en ella y te revelaras ante el demonio, las cosas se volverían bastante... desagradables. Has elegido sabiamente abandonar la persecución por ahora. Siempre puedes retomarla más tarde, cuando esperas que el rastro que potencialmente conduce a ti se haya enfriado."

 POD_inquihunt.83.t: "Al Infierno con vos"
 POD_inquihunt.83.desc: "Estabas tan seguro de que esta vez tenías la pista correcta. Tras innumerables informaciones erróneas y datos engañosos, finalmente habías reunido lo que creías que era una parte del [Glossary('True Name','podgloss.truename')] del demonio y la ubicación de su Ancla espiritual. Al tener finalmente algo concreto que mostrar por tus esfuerzos, te lanzaste a usar esa pista para comenzar tu exorcismo... y caíste directamente en una trampa.\nMientras los Cultistas cantan en círculo alrededor del altar al que estás encadenado y el propio demonio te promete una dulce tortura, te preguntas extrañamente si el Infierno realmente existe. Tienes la desagradable sensación de que lo descubrirás muy pronto."
 POD_inquihunt.83.option.a: "El último viaje de ida."

 POD_inquihunt.110.t: "Cazador de Sueños"
 POD_inquihunt.110.desc: "Existen muchos relatos sobre el misterioso pueblo de las Hadas... lo cual en realidad no ayuda nada a cazarlas, ya que la mayoría son contradictorios. Atravesar la capa de engaño intencionado que rodea a estos seres no es fácil, pero lograste averiguar un dato importante: el hierro frío puede matarlas.\nAhora, simplemente entrar en una de sus «cortes» sería como una sentencia de muerte. Las Hadas son conocidas por ser maestras embaucadoras que se esconden tras capa tras capa de ilusiones. Pero tienen una debilidad: su interés por la humanidad. Si logras parecer lo suficientemente interesante, tal vez podrías ser invitado y acercarte lo suficiente a tu objetivo para atacar..."
 POD_inquihunt.110.option.a: "Tengo que soñar en grande."
 POD_inquihunt.110.option.b: "Quiero la mejor daga de hierro frío que el oro pueda comprar."

 POD_inquihunt.111.t: "El fin de un sueño"
 POD_inquihunt.111.desc: "Requirió algo de preparación, pero lograste parecer lo suficientemente interesante como para atraer la atención de las hadas locales. Interpretando tu papel de mortal despistado, embelesado por aquellas criaturas caprichosas, las seguiste a su extraño mundo de maravillas. Logrando mantener el juicio a pesar del caos ambiental, captaste la atención de tu objetivo, que murmuró algo sobre extraer el «glamour» de ti.\nUna vez aislados, y antes de que pudieran hacer lo que planeaban, tu daga de hierro frío les cortó la garganta. Te fuiste de la corte de las hadas minutos después sin que nadie se diera cuenta."
 POD_inquihunt.111.option.a: "De vuelta a la realidad."

 POD_inquihunt.112.t: "Noches sin sueños"
 POD_inquihunt.112.desc: "A pesar de tus mejores esfuerzos por parecer atractivo para las extrañas Hadas, te has topado con un callejón sin salida. Quizás no comprendiste del todo qué es lo que buscan en un mortal o quizás simplemente comprendieron tu verdadera intención.\nSea como sea, la corte de las Hadas, y tu objetivo, permanecen obstinadamente cerrados para ti. Con ellos probablemente conscientes de tu intención ahora, irrumpir sería una idea muy errónea. Tendrás que esperar a otra oportunidad."

 POD_inquihunt.113.t: "Del sueño a la Pesadilla"
 POD_inquihunt.113.desc: "Primero notaste que algo iba mal en la propia corte de las Hadas. Antes de eso, pensabas que tu actuación para parecer lo suficientemente interesante como para atraer la atención de tu objetivo estaba funcionando perfectamente. Fue cuando todos empezaron a amontonarse a tu alrededor y el entorno adquirió un tono mucho más sombrío cuando comprendiste el gran error que habías cometido.\nNo sabes cómo ni cuándo, pero es muy probable que se dieran cuenta de que trajiste hierro frío, un grave Anatema, a su hogar. También es muy probable que tu última Pesadilla sea solo el comienzo."
 POD_inquihunt.113.option.a: "...y nunca terminará."

 POD_inquihunt.7010.t: "Listo para atacar"
 POD_inquihunt.7010.desc: "Las criaturas nocturnas se esfuerzan mucho por ocultar sus actividades, sabiendo que el secreto es lo único que preserva su existencia.\n\nEn ocasiones, uno de ellos comete un error.\n\nEsta es una de esas ocasiones."
 POD_inquihunt.7010.a: "La caza ha comenzado."
 POD_inquihunt.7010.b: "Quizás más tarde."
         
