 POD_oath_of_guardianship_interaction: "Juramento de Custodia"
 POD_oath_of_guardianship_interaction_desc: "Juramento para proteger a una persona, lugar o cosa."
 POD_oath_of_guardianship_interaction_tooltip: "[recipient.GetFirstName] se convertirá en [GetTrait('oathbreaker').GetName( GetPlayer )] si [secondary_recipient.GetFirstName] muere."
 recipient_secondary_POD_oath_of_guardianship_interaction: "Persona del juramento"
 oath_of_guardianship_opinion: "Juramento de Custodia"
 oath_of_guardianship_modifier: "Juramento de Custodia"
 oath_of_guardianship_modifier_desc: "Como el sol protege la Tierra de día y las estrellas por la noche, así te serviré. Este es mi deber. No te abandonaré hasta el momento prometido; de lo contrario, que las estrellas cierren sus ojos y duerman.\n#weak El personaje intentará salvar del asesinato al objetivo del juramento.\nEl personaje se convertirá en [GetTrait('oathbreaker').GetName( GetPlayer )] si el objetivo del juramento muere.#!"
 
 POD_oath_of_truehearts_interaction: "Juramento de corazones verdaderos"
 POD_oath_of_truehearts_interaction_desc: "Juramento prestado entre amantes de los Kithain."
 POD_oath_of_truehearts_interaction_tooltip: "[recipient.GetFirstName] se convertirá en [GetTrait('oathbreaker').GetName( GetPlayer )] si [recipient.GetSheHe] tiene relaciones con otro/a."
 oath_of_truehearts_opinion: "Juramento de corazones verdaderos"
 oath_of_truehearts_modifier: "Juramento de corazones verdaderos"
 oath_of_truehearts_modifier_desc: "Te entrego un regalo de mí mismo/a. Acéptalo libremente; es ofrecido libremente, y para siempre me tendrás bajo tu cuidado. Te juro amor y te prometo mi lealtad. Que quienes vigilan el amor vigilen este juramento y a quienes lo cumplen, y que nunca encontremos falta en sus ojos.\n#weak El personaje intentará no tener relaciones con otras personas.\nEl personaje se convertirá en [GetTrait('oathbreaker').GetName( GetPlayer )] si ha tenido relaciones con otro/a.#!"
 
 POD_fae_interactions.300.t: "$murder_save_header$ Guardián del juramento"
 POD_fae_interactions.300.desc.assassin: "¡Mi asesino no logró matar a [target.GetTitledFirstName]! Al parecer, el [target.GetFirstNamePossessiveNoTooltip] Guardián del juramento [oath_guardian.GetTitledFirstName] intervino, apareciendo segundos antes de que se llevara a cabo el asesinato y acabando con mi sicario."
 POD_fae_interactions.300.desc.thugs: "¡Los matones que contraté para matar a [target.GetTitledFirstName] han fallado en su misión! A pesar de su ferocidad, el Guardián del Juramento de [target.GetFirstNamePossessiveNoTooltip] pudo evitar que [target.GetHerHim] sufriera daño el tiempo suficiente para que sus guardias pudieran reagruparse y acabar con los bandidos restantes."
 POD_fae_interactions.300.desc.mob: "Mientras la turba que incité a matar a [target.GetTitledFirstName] lograba arrastrar a [target.GetHerHim] de [target.GetHerHis] caballo, no pudieron terminar el trabajo antes de que interviniera el Guardián del Juramento de [target.GetFirstNamePossessiveNoTooltip]. [oath_guardian.GetSheHe|U] despachó sin piedad a los campesinos que estaban al alcance de la mano de [target.GetFirstNameNoTooltip] y asustó a los demás para que huyeran."
 POD_fae_interactions.300.desc.lured_into_forest: "Creía que mi plan para que [target.GetTitledFirstName] se perdiera en el bosque había salido a la perfección cuando cayó la noche sin rastro [target.Custom('ES_DelDela')] [target.Custom('GirlBoy')] extraviad[target.Custom('ES_OA')].\n\nPor desgracia, justo cuando iba a acostarme me llegó la noticia de que el Guardián del Juramento de [target.GetFirstNamePossessiveNoTooltip] había salido del bosque con [target.Custom('ES_ElLa')] [target.Custom('GirlBoy')] a cuestas. Al parecer, [oath_guardian.GetSheHe] se encargó de seguir el rastro de [target.GetFirstNamePossessiveNoTooltip] por el bosque y lo encontró justo antes que los animales hambrientos."
 POD_fae_interactions.300.desc.child_pushed: "¡El tonto[target.Custom('GirlBoy')] que sería [target.GetTitleAsNameNoTooltip] fue lo bastante estúpido como para caer en mi trampa! [target.GetFirstName] trepó hasta el borde del balcón tal como estaba previsto, y mi agente lo empujó al vacío...\n\n...Pero lo que debería haber sido una caída mortal no lo fue, cuando [target.GetSheHe] fue atrapad[ROOT.Char.Custom('ES_OA')] por su Guardián del Juramento justo antes de tocar el suelo. [target.GetSheHe|U] vive para ver otro día y es poco probable que vuelva a caer en ese engaño."
 POD_fae_interactions.300.oath_guardian_dies: "\n\nAl menos, [oath_guardian.GetFirstNameNoTooltip] no volverá a molestarme, ya que [oath_guardian.GetSheHe] ha muerto por sus heridas."
 POD_fae_interactions.300.a: "Se acabó..."
 POD_fae_interactions.300.b: "... ¡No se acaba hasta que yo lo diga!"
 POD_fae_interactions.301.t: "$murder_save_header$ Guardián del juramento"
 POD_fae_interactions.301.desc.assassin: "¡Casi #EMP muero#! hoy. Si [oath_guardian.GetFirstName] no hubiera notado algo extraño y me hubiera seguido hasta mis aposentos, ahora sería un cadáver.\n\nLo primero que supe del asesino fue que [oath_guardian.GetFirstNameNoTooltip] placó físicamente a alguien contra el suelo inmediatamente detrás de mí, y después todo fue un borrón de cuchillos y puñetazos hasta que el agresor quedó muerto en el suelo."
 POD_fae_interactions.301.desc.assassin.oath_guardian_dies: "\n\nLamentablemente, [oath_guardian.GetFirstNameNoTooltip] pagó el precio más alto. Aunque el asesino ha muerto, sus heridas resultaron fatales."
 POD_fae_interactions.301.desc.thugs: "Estoy viajando con mi séquito cuando un grito surge de un bosquecillo de árboles. «¡Atacad! ¡A por el [ROOT.Char.GetTitleTierName]!». ¡Una emboscada!\n\n¡No son simples bandidos tras mi oro, sino matones tras mi vida! Mi Guardián del Juramento, [oath_guardian.GetFirstNameNoTooltip], corre en mi defensa, interponiendo su cuerpo entre los sanguinarios bandidos y yo.\n\n[oath_guardian.GetFirstNameNoTooltip|U] realiza una retirada combativa mientras mis enemigos convergen en nuestra posición con las espadas en alto, pero pronto mis otros guardias logran reagruparse para defendernos y acabar con los atacantes restantes."
 POD_fae_interactions.301.desc.thugs.oath_guardian_dies: "Solo cuando la lucha ha amainado, [oath_guardian.GetSheHe] se desploma en el suelo y descubro sus profundas heridas. Realmente me protegió hasta el último momento..."
 POD_fae_interactions.301.desc.mob: "Estoy cabalgando por las calles de [home_province.GetName] cuando una turba de campesinos gritando y clamando desciende sobre mi séquito. Antes de que me dé cuenta de lo que ocurre, los plebeyos me arrancan de mi caballo. ¡Y empiezan a golpearme!\n\nMi Guardián del Juramento, [oath_guardian.GetFirstName], corre en mi defensa con su [oath_guardian.Custom('signature_weapon')] en la mano, [oath_guardian.Custom('SignatureWeaponWoundVerb1PresentParticiple')] sin piedad a los campesinos que me golpeaban y, quizás de forma poco glamurosa, protegiéndome de más daño mientras quedo sepultad[ROOT.Char.Custom('ES_OA')] bajo sus cadáveres."
 POD_fae_interactions.301.desc.mob.oath_guardian_lives: "\n\nCuando los sonidos de la lucha cesan, [oath_guardian.GetFirstNameNoTooltip] aparta los cuerpos de encima de mí y me ayuda a levantarme. Aparte de nosotros, la calle está ahora desierta; todos los conspiradores han muerto o han huido."
 POD_fae_interactions.301.desc.mob.oath_guardian_dies: "\n\nPara cuando logro salir del montón de cadáveres, la calle está desierta excepto por los cuerpos de los caídos, entre ellos [oath_guardian.GetFirstNameNoTooltip]."
 POD_fae_interactions.301.desc.lured_into_forest: "Estaba jugando al escondite con algunos cortesanos en el bosque cuando me doy cuenta de que ha pasado mucho tiempo desde la última vez que escuché a alguien buscándome. Demasiado tiempo.\n\nGrito, pero no oigo nada. Me han abandonado... Intento encontrar el camino a casa, pero no sé cuál es cuál y oscurece rápido.\n\nPronto puedo oír a las bestias moviéndose entre los árboles, pero antes de que puedan alcanzarme, mi Guardián del Juramento, [oath_guardian.GetFirstName], aparece allí, sin aliento y blandiendo una antorcha encendida. El fuego parece disuadir a las bestias, que mantienen la distancia mientras [oath_guardian.GetSheHe] jadea: «Vamos... a casa... mi señor...»."
 POD_fae_interactions.301.desc.child_pushed: "\n\n#EMP PUM#!\n\nHe caído en los brazos de mi Guardián del Juramento, [oath_guardian.GetFirstNameNoTooltip]. «¡Niño tonto! Si no hubiera llegado a tiempo... no importa. Vamos a llevarte a un lugar seguro»."
 POD_fae_interactions.301.owner_discovered: "\n\nSolo una persona podría ser la responsable de este ataque: ¡[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 POD_fae_interactions.301.a: "¿Quién querría #EMP matarme#!?"
 POD_fae_interactions.301.b: "¡[owner.GetSheHe|U] sufrirá por esto!"
 
