 POD_fae_interactions.601.t: "Un sucesor digno"
 POD_fae_interactions.601.desc: "Tu siervo te trae a quien mejor se ajusta a todos tus criterios; ahora es el momento de hacer que este espíritu se convierta en tu sucesor."
 POD_fae_interactions.601.a: "Proceder con la crianza."
 
 POD_fae_interactions.610.t: "Forjar personalidad"
 POD_fae_interactions.610.desc: "Al haberte convertido recientemente en hada, tu nuevo sucesor ha perdido mucha experiencia en el mundo despierto. Como progenitor, deberías enseñar a tu sucesor cómo mirar verdaderamente al mundo, y hace poco has encontrado la oportunidad de hacerlo."
 POD_fae_interactions.610.skip: "Quizá la próxima vez"
 POD_fae_interactions.611.a: "Sé audaz, incluso en apuros."
 POD_fae_interactions.611.b: "Ten cuidado si surgen problemas."
 POD_fae_interactions.612.a: "Tienes tiempo."
 POD_fae_interactions.612.b: "Muestra tu ira."
 POD_fae_interactions.613.a: "Leal a tu consorte."
 POD_fae_interactions.613.b: "El amor es para todos."
 POD_fae_interactions.614.a: "Estás bien."
 POD_fae_interactions.614.b: "Ve a por más."
 POD_fae_interactions.615.a: "Tienes una causa."
 POD_fae_interactions.615.b: "El tiempo está de nuestra parte."
 POD_fae_interactions.616.a: "Siempre hay otro camino."
 POD_fae_interactions.616.b: "Quédate como eres."
 POD_fae_interactions.617.a: "La venganza es eterna."
 POD_fae_interactions.617.b: "El odio no es el objetivo."
 POD_fae_interactions.618.a: "El oro no es lo importante."
 POD_fae_interactions.618.b: "Nada es posible sin dinero."
 POD_fae_interactions.619.a: "Puedes confiar en la gente."
 POD_fae_interactions.619.b: "No puedes confiar en nadie."
 POD_fae_interactions.620.a: "Sé honesto."
 POD_fae_interactions.620.b: "Una pequeña mentira no hace daño."
 POD_fae_interactions.621.a: "Solo eres uno entre muchos."
 POD_fae_interactions.621.b: "Eres excelente."
 POD_fae_interactions.622.a: "La ley por encima de todo."
 POD_fae_interactions.622.b: "Tú por encima de todo."
 POD_fae_interactions.623.a: "Dale tiempo."
 POD_fae_interactions.623.b: "El tiempo no espera."
 POD_fae_interactions.624.a: "Los placeres son una distracción."
 POD_fae_interactions.624.b: "Disfruta de tu vida."
 POD_fae_interactions.625.a: "La confianza es la clave."
 POD_fae_interactions.625.b: "Traiciona al mundo antes de que este te traicione a ti."
 POD_fae_interactions.626.a: "Leal a tu Camino."
 POD_fae_interactions.626.b: "Tu Camino no es tan importante."
 POD_fae_interactions.627.a: "Sé amable."
 POD_fae_interactions.627.b: "Piensa primero en ti mismo."
 POD_fae_interactions.627.c: "Comparte tu dolor con el mundo."
 
 POD_fae_interactions.701.t: "Perspectivas de [GetPlayer.MakeScope.Var('current_journey').Var('target_trait').Trait.GetName(GetPlayer)]"
