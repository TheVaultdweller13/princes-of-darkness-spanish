 trait_dharma10: "Dharma 10"
 trait_dharma10_desc: "Alguien que trascendió su [Glossary('Dharma','podgloss.dharma')] y alcanzó la puerta de las [Glossary('Cien Nubes','podgloss.hundredclouds')]."
 trait_dharma10_stayed_desc: "También llamado [Glossary('Arhat','podgloss.arhat')], alguien que alcanzó el último peldaño del Camino de Vuelta y obtuvo la Iluminación. Muchos no dudan en entrar en las [Glossary('Cien Nubes','podgloss.hundredclouds')] en cuanto pueden, pero unos pocos permanecen en el mundo mortal."
 TRAIT_FLAG_DESC_warning_dharma10_flag: "\n#X Descenderá a [GetTrait('dharma9').GetName(GetNullCharacter)] ante cualquier [mental_break|E]#!"

 trait_dharma9: "Dharma 9"
 trait_dharma9_player_desc: "$trait_dharma_player_desc$\n\n\n$trait_dharma9_desc$"
 trait_dharma9_desc: "También llamados [Glossary('Bodhisattvas','podgloss.bodhisattva')], quienes alcanzaron las etapas finales de su [Glossary('Dharma','podgloss.dharma')] elegido, normalmente necesitando 1000 años para lograr este estado. Pueden alimentarse del chi ambiental."
 trait_track_dharma9: "Perspicacia"
 trait_track_dharma9_desc: "$trait_track_dharma_desc$"
 
 trait_dharma8: "Dharma 8"
 trait_dharma8_player_desc: "$trait_dharma_player_desc$\n\n\n$trait_dharma8_desc$"
 trait_dharma8_desc: "Suelen desempeñar el papel de Ancestro, normalmente necesitando 500 años para lograr este estado. Pueden alimentarse del chi ambiental."
 trait_track_dharma8: "Perspicacia"
 trait_track_dharma8_desc: "$trait_track_dharma_desc$"
 
 trait_dharma7: "Dharma 7"
 trait_dharma7_player_desc: "$trait_dharma_player_desc$\n\n\n$trait_dharma7_desc$"
 trait_dharma7_desc: "Suelen desempeñar el papel de Mandarín (o Brahmán para los [GetTrait('kueijin').GetName( GetNullCharacter )] hindúes), también el requisito mínimo para ser Ancestro, para lo que normalmente necesitan 250 años. Pueden alimentarse del chi ambiental."
 trait_track_dharma7: "Perspicacia"
 trait_track_dharma7_desc: "$trait_track_dharma_desc$"
 
 trait_dharma6: "Dharma 6"
 trait_dharma6_player_desc: "$trait_dharma_player_desc$\n\n\n$trait_dharma6_desc$"
 trait_dharma6_desc: "Suelen desempeñar el papel de Jina (o Ksatriya para los [GetTrait('kueijin').GetName( GetNullCharacter )] hindúes) o Mandarín (o Brahmán para los [GetTrait('kueijin').GetName( GetNullCharacter )] hindúes), para lo que normalmente necesitan 100 años. Pueden alimentarse del chi ambiental."
 trait_track_dharma6: "Perspicacia"
 trait_track_dharma6_desc: "$trait_track_dharma_desc$"
 
 trait_dharma5: "Dharma 5"
 trait_dharma5_player_desc: "$trait_dharma_player_desc$\n\n\n$trait_dharma5_desc$"
 trait_dharma5_desc: "Suelen desempeñar el papel de Jina (o Ksatriya para los [GetTrait('kueijin').GetName( GetNullCharacter )] hindúes), normalmente necesitando 25 años para lograr este estado. Pueden alimentarse de chi mediante la respiración."
 trait_track_dharma5: "Perspicacia"
 trait_track_dharma5_desc: "$trait_track_dharma_desc$"
 
 trait_dharma4: "Dharma 4"
 trait_dharma4_player_desc: "$trait_dharma_player_desc$\n\n\n$trait_dharma4_desc$"
 trait_dharma4_desc: "Suelen desempeñar el papel de Jina (o Ksatriya para los [GetTrait('kueijin').GetName( GetNullCharacter )] hindúes), normalmente necesitando 5 años para lograr este estado. Se alimentan de chi mediante la sangre."
 trait_track_dharma4: "Perspicacia"
 trait_track_dharma4_desc: "$trait_track_dharma_desc$"
 
 trait_dharma3: "Dharma 3"
 trait_dharma3_player_desc: "$trait_dharma_player_desc$\n\n\n$trait_dharma3_desc$"
 trait_dharma3_desc: "Discípulo (o Vaisya para los [GetTrait('kueijin').GetName( GetNullCharacter )] hindúes) con dharma bajo, normalmente necesitando 3 años para lograr este estado. Se alimentan de chi mediante la sangre."
 trait_track_dharma3: "Perspicacia"
 trait_track_dharma3_desc: "$trait_track_dharma_desc$"
 
 trait_dharma2: "Dharma 2"
 trait_dharma2_player_desc: "$trait_dharma_player_desc$\n\n\n$trait_dharma2_desc$"
 trait_dharma2_desc: "Discípulo (o Vaisya para los [GetTrait('kueijin').GetName( GetNullCharacter )] hindúes) con dharma bajo, normalmente necesitando 1 año para lograr este estado. Se alimentan de chi mediante la sangre."
 trait_track_dharma2: "Perspicacia"
 trait_track_dharma2_desc: "$trait_track_dharma_desc$"
 
 trait_dharma1: "Dharma 1"
 trait_dharma1_player_desc: "$trait_dharma_player_desc$\n\n\n$trait_dharma1_desc$"
 trait_dharma1_desc: "Discípulo (o Vaisya para los [GetTrait('kueijin').GetName( GetNullCharacter )] hindúes) con dharma bajo. Se alimentan de chi mediante la sangre."
 trait_track_dharma1: "Perspicacia"
 trait_track_dharma1_desc: "$trait_track_dharma_desc$"
 
 trait_dharma0: "Dharma 0"
 trait_dharma0_desc: "Hin (o Sudra para los [GetTrait('kueijin').GetName( GetNullCharacter )] hindúes), que han sido rescatados del estado de chih-mei, pero que aún no forman parte de la sociedad."
 
 trait_chihmei: "Chih-mei"
 trait_chihmei_desc: "Una criatura apenas consciente, dominada por su ansia de chi y obligada a alimentarse de carne. Un personaje que ha caído en el chih-mei no puede jugarse."
 trait_chihmei_dharma_desc: "Mediante un ritual, un Chih-mei puede ser devuelto al Equilibrio Dhármico y civilizado, reavivando su consciencia superior (Hun) y convirtiéndolo en un no-muerto productivo bajo un verdadero Dharma."
 
 trait_chi_art_feng_shui: "Feng Shui"
 trait_chi_art_feng_shui_desc: "Las Artes del Chi son distintas de otras artes, desarrolladas recientemente como un uso avanzado del chi puro. También son las más alejadas de la existencia de los Muertos Hambrientos; cultivarlas requiere un mentor.\n\nFeng Shui es un antiguo arte geomántico especializado en la alineación adecuada y propicia de edificios, tumbas e interiores, de acuerdo con las emanaciones celestiales y las configuraciones terrenales, de modo que el chi fluya libremente y armonice a los individuos con su entorno."
 trait_chi_art_obligation: "Obligación"
 trait_chi_art_obligation_desc: "Las Artes del Chi son distintas de otras artes, desarrolladas recientemente como un uso avanzado del chi puro. También son las más alejadas de la existencia de los Muertos Hambrientos; cultivarlas requiere un mentor.\n\nLa Obligación es un arte que permite a un $pod_kueijin$ ejercer control sobre otros. Es una evocación de la gloria de los antiguos Wan Xian y de su autoridad, que emanaba de un mandato del propio [Glossary('Augusto Personaje de Jade','podgloss.augustpersonageofjade')]. Aunque han perdido ese favor, algunos todavía logran inspirar a los espíritus de quienes los rodean, o incluso someterlos."
 trait_chi_art_tapestry: "Tapiz"
 trait_chi_art_tapestry_desc: "Las Artes del Chi son distintas de otras artes, desarrolladas recientemente como un uso avanzado del chi puro. También son las más alejadas de la existencia de los Muertos Hambrientos; cultivarlas requiere un mentor.\n\nTapiz es el arte del chi que consiste en aprovechar al máximo las líneas de dragón. Mediante la práctica de Tapiz, el vampiro se sintoniza con las fuerzas del Yin y el Yang en el viento, el agua y la tierra, y después manipula esas fuerzas para diversos fines."
 trait_chi_art_prana: "Prana"
 trait_chi_art_prana_desc: "Las Artes del Chi son distintas de otras artes, desarrolladas recientemente como un uso avanzado del chi puro. También son las más alejadas de la existencia de los Muertos Hambrientos; cultivarlas requiere un mentor.\n\nPrana es el arte del chi que consiste en usar ambas caras del Chi, el Yin y el Yang. Quien lo practica puede sintonizarse con las energías de la muerte y la vida respectivamente, o usar su confluencia para curar heridas."
 trait_chi_art_kiai: "Kiai"
 trait_chi_art_kiai_desc: "Las Artes del Chi son distintas de otras artes, desarrolladas recientemente como un uso avanzado del chi puro. También son las más alejadas de la existencia de los Muertos Hambrientos; cultivarlas requiere un mentor.\n\nKiai es el arte del chi que canaliza la ira del Demonio a través de la voz, una técnica imponente con diversas aplicaciones en el campo de batalla."
 trait_chi_art_tzu_wei: "Tzu Wei"
 trait_chi_art_tzu_wei_desc: "Las Artes del Chi son distintas de otras artes, desarrolladas recientemente como un uso avanzado del chi puro. También son las más alejadas de la existencia de los Muertos Hambrientos; cultivarlas requiere un mentor.\n\nTzu Wei es el arte del chi que consiste en leer y manipular horóscopos. Cuando los $pod_kueijin$ practican Tzu Wei, pueden moldear el destino mismo y doblegar las fuerzas de la suerte a su voluntad."

 trait_shih: "Shih"
 trait_shih_desc: "Las Leyendas afirman que los orígenes de los Shih se hallan en Yi, durante la Dinastía Shang. Caminan solos en la oscuridad, combatiendo a las fuerzas de los Mil Infiernos con nada más que el poder de sus manos y su voluntad. Hace más de 3000 años, los Shih dieron el primer paso para luchar contra los shen. Aunque las orgullosas casas de los Shih ya no existen, sus Tradiciones perviven, y el relato de sus orígenes es una de sus historias más veneradas."
 
 trait_ha_holy_bulwark: "Baluarte Sagrado"
 trait_ha_holy_bulwark_desc: "Este personaje no puede ser vinculado por la sangre."
 
 trait_ha_patris_mastery: "Maestría de las Artes: Sophia Patris"
 trait_ha_patris_mastery_desc: "«Humillaos ante el Señor, y Él os exaltará»"
 
 trait_ha_filius_mastery: "Maestría de las Artes: Sedulitas Filius"
 trait_ha_filius_mastery_desc: "«¿Quién es el que vence al mundo? Solo el que cree que Jesús es el Hijo de Dios»"
 
 trait_ha_spiritus_mastery: "Maestría de las Artes: Boni Spiritus"
 trait_ha_spiritus_mastery_desc: "«Y pondré mi Espíritu en vosotros, y haré que sigáis mis decretos y guardéis fielmente mis leyes»"
 
 trait_demonic_plague: "Plaga demoníaca"
 trait_demonic_plague_desc: "Resultado de una maldición verdaderamente diabólica, la plaga demoníaca es una enfermedad altamente infecciosa y mortal que afecta tanto a los Vástagos como a los mortales. Peor aún, la enfermedad impide que los vampiros se curen de ningún modo, y provoca heridas progresivamente peores a medida que la carne se desgarra a sí misma."
 
 trait_demonic_plague_non_infectious: "Plaga demoníaca"
 trait_demonic_plague_non_infectious_desc: "Resultado de una maldición verdaderamente diabólica, la plaga demoníaca es una enfermedad mortal que afecta tanto a los Vástagos como a los mortales. Peor aún, la enfermedad impide que los vampiros se curen de ningún modo, y provoca heridas progresivamente peores a medida que la carne se desgarra a sí misma."
 
 trait_demonic_plague_non_lethal: "Plaga demoníaca"
 trait_demonic_plague_non_lethal_desc: "Resultado de una maldición verdaderamente diabólica, la plaga demoníaca es una enfermedad altamente infecciosa que afecta tanto a los Vástagos como a los mortales. Peor aún, la enfermedad impide que los vampiros se curen de ningún modo"
 
 trait_demonic_plague_non_lethal_and_infectious: "Plaga demoníaca"
 trait_demonic_plague_non_lethal_and_infectious_desc: "Resultado de una maldición verdaderamente diabólica, la plaga demoníaca es una enfermedad que afecta tanto a los Vástagos como a los mortales. Peor aún, la enfermedad impide que los vampiros se curen de ningún modo"
  
