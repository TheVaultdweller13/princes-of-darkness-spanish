 trait_wanxian: "Wan Xian"
 trait_wankuei: "Wan Kuei"
 trait_kueijin: "Kuei-jin"
 trait_kueijin_desc: "También llamados los Wan Kuei, Gui Ren, asuratizayya (en la India), los «Muertos Hambrientos» o simplemente los «Vampiros Orientales».\n\nSe dice que los Kuei-jin son los descendientes corrompidos de los Wan Xian, los «Diez Mil Héroes» elegidos por el [Glossary('Augusto Personaje de Jade','podgloss.augustpersonageofjade')] para guiar y proteger el universo en la antigüedad. Los Wan Xian fueron elegidos originalmente mediante pruebas de habilidad y valor, y se alimentaban del chi ambiental del universo. Sin embargo, cayeron en desgracia, aprendiendo a alimentarse del chi de los seres vivos y corrompiendo las pruebas de mérito.\n\nUn Kuei-jin «nace» cuando su alma escapa de un [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] tras su muerte. Se organizan en torno a Cortes políticas y siguen un [Glossary('Dharma','podgloss.dharma')] para hallar el camino de vuelta a los Cielos." 
  
 trait_animalism: "Animalismo"
 trait_animalism_desc: "Una $pod_discipline$ que acerca al vampiro a su naturaleza animal. Esto no solo le permite comunicarse con las criaturas de la naturaleza y dominarlas, sino que también le otorga influencia sobre [Glossary('La Bestia','game_concept_beast_desc')] misma.\n\nEl Animalismo es particularmente común entre los clanes más alejados de la humanidad, aunque muchos de sus poderes se dirigen específicamente a las Bestias de mortales y $pod_cainites$."
 
 trait_animalismadvanced: "Animalismo Avanzado"
 trait_animalismadvanced_desc: "Una $pod_discipline$ que acerca al vampiro a su naturaleza animal. Esto no solo le permite comunicarse con las criaturas de la naturaleza y dominarlas, sino que también le otorga influencia sobre [Glossary('La Bestia','game_concept_beast_desc')] misma.\n\nEl Animalismo es particularmente común entre los clanes más alejados de la humanidad, aunque muchos de sus poderes se dirigen específicamente a las Bestias de mortales y $pod_cainites$."
 
 trait_auspex: "Auspex"
 trait_auspex_desc: "Auspex es una $pod_discipline$ que otorga a los vampiros sentidos sobrenaturales.\nEs una de las [Glossary('Disciplinas','game_concept_discipline_desc')] más comunes y apreciadas entre los $pod_cainites$ debido a su versatilidad y utilidad general en prácticamente todas las facetas de la existencia vampírica. Además, se sabe que otorga cierto grado de capacidad oracular, en particular al alertar a un $pod_cainite$ de un peligro, incluso si se encuentra en $pod_torpor$."
 
 trait_auspexadvanced: "Auspex Avanzado"
 trait_auspexadvanced_desc: "Auspex es una $pod_discipline$ que otorga a los vampiros sentidos sobrenaturales.\nEs una de las [Glossary('Disciplinas','game_concept_discipline_desc')] más comunes y apreciadas entre los $pod_cainites$ debido a su versatilidad y utilidad general en prácticamente todas las facetas de la existencia vampírica. Además, se sabe que otorga cierto grado de capacidad oracular, en particular al alertar a un $pod_cainite$ de un peligro, incluso si se encuentra en $pod_torpor$."
 
 trait_celerity: "Celeridad"
 trait_celerity_desc: "Celeridad es una $pod_discipline$ que otorga a los vampiros rapidez y reflejos sobrenaturales.\n\nPara algunos $pod_cainites$, el mundo mortal se mueve a cámara lenta. En momentos de tensión, los vampiros con Celeridad pueden moverse con una velocidad asombrosa, convirtiéndose en manchas borrosas de movimiento para cualquiera, mortal o inmortal, que no posea la $pod_discipline$."
 
 trait_celerityadvanced: "Celeridad Avanzada"
 trait_celerityadvanced_desc: "Celeridad es una $pod_discipline$ que otorga a los vampiros rapidez y reflejos sobrenaturales.\n\nPara algunos $pod_cainites$, el mundo mortal se mueve a cámara lenta. En momentos de tensión, los vampiros con Celeridad pueden moverse con una velocidad asombrosa, convirtiéndose en manchas borrosas de movimiento para cualquiera, mortal o inmortal, que no posea la $pod_discipline$." 
 
 trait_chimerstry: "Quimerismo"
 trait_chimerstry_desc: "El Quimerismo es la $pod_discipline$ distintiva de los Ravnos, que conjura ilusiones para darles existencia. Estas imágenes fantasma son tan reales como permite la habilidad del $pod_cainite$."
 
 trait_chimerstryadvanced: "Quimerismo Avanzado"
 trait_chimerstryadvanced_desc: "El Quimerismo es la $pod_discipline$ distintiva de los Ravnos, que conjura ilusiones para darles existencia. Estas imágenes fantasma son tan reales como permite la habilidad del $pod_cainite$."
 
 trait_daimonion: "Daimonion"
 trait_daimonion_desc: "Daimonion es una $pod_discipline$ diabólica practicada únicamente por los Baali y los peores vampiros infernalistas. Su poder es el del mismísimo Diablo, y mediante el uso de Daimonion los Baali invocan las fuerzas del Infierno y sus demonios para desmoralizar y lisiar a sus enemigos."

 trait_daimonionadvanced: "Daimonion Avanzado" 
 trait_daimonionadvanced_desc: "Daimonion es una $pod_discipline$ diabólica practicada únicamente por los Baali y los peores vampiros infernalistas. Su poder es el del mismísimo Diablo, y mediante el uso de Daimonion los Baali invocan las fuerzas del Infierno y sus demonios para desmoralizar y lisiar a sus enemigos."  

 trait_dementation: "Dementación"
 trait_dementation_desc: "La Dementación es una $pod_discipline$ ampliamente reconocida como la seña de identidad de los Malkavian.\n\n La Dementación se nutre de la propia locura del vampiro y la utiliza para lograr percepciones profundas o infligir locura a otros. Estos poderes son una de las principales razones por las que el $pod_clan$ Malkavian suele considerarse tanto perspicaz como muy peligroso."
 
 trait_dementationadvanced: "Dementación Avanzada"
 trait_dementationadvanced_desc: "La Dementación es una $pod_discipline$ ampliamente reconocida como la seña de identidad de los Malkavian.\n\n La Dementación se nutre de la propia locura del vampiro y la utiliza para lograr percepciones profundas o infligir locura a otros. Estos poderes son una de las principales razones por las que el $pod_clan$ Malkavian suele considerarse tanto perspicaz como muy peligroso."
 
 trait_dominate: "Dominación"
 trait_dominate_desc: "La Dominación es una $pod_discipline$ que somete la mente de otra persona a la voluntad del vampiro, forzando a las víctimas a pensar o actuar según el dictado del vampiro."
 
 trait_dominateadvanced: "Dominación Avanzada"
 trait_dominateadvanced_desc: "La Dominación es una $pod_discipline$ que somete la mente de otra persona a la voluntad del vampiro, forzando a las víctimas a pensar o actuar según el dictado del vampiro.\n\nEl aspecto de la Dominación dentro de la maldición del vampirismo es que devalúa los fundamentos de la verdadera amistad o intimidad. La Dominación también embota la empatía de quien la usa, y hay que tener cuidado de no acostumbrarse a estar siempre rodeado de aduladores."
 
 trait_fortitude: "Fortaleza"
 trait_fortitude_desc: "La Fortaleza es una $pod_discipline$ que otorga a los Vástagos una resistencia sobrenatural, hasta el punto de resistir el fuego y la luz solar.\n\nLa Fortaleza también puede proteger frente a la manipulación y el control, como los de las [Glossary('Disciplinas','game_concept_discipline_desc')] de Dominación y Presencia."
 
 trait_flight: "Vuelo"
 trait_flight_desc: "Alas, ya sean innatas, evolucionadas, injertadas o adquiridas de otro modo, junto con una amplia experiencia en su uso. Otorga el poder del vuelo."
 
 trait_flightadvanced: "Vuelo Avanzado"
 trait_flightadvanced_desc: "El Vuelo es una $pod_discipline$ sobrenatural, exclusiva de la Línea de Sangre Gárgola, que permite a estos vampiros volar.\n\nDemasiado pesadas para volar por medios naturales, las pétreas Gárgolas deben recurrir a esta $pod_discipline$; otros $pod_cainites$ capaces de volar (transformándose en murciélago o niebla mediante Protean, por ejemplo) no la necesitan y no pueden aprenderla."
 
 trait_melpominee: "Melpómene"
 trait_melpominee_desc: "La $pod_discipline$ Melpominee apareció simultáneamente con las Hijas de la Cacofonía y está intrínsecamente ligada a esa Línea de Sangre. Permite a quienes la poseen usar el habla y el canto para lograr una variedad de efectos sobrenaturales."
 
 trait_melpomineeadvanced: "Melpominee Avanzado"
 trait_melpomineeadvanced_desc: "La $pod_discipline$ Melpominee apareció simultáneamente con las Hijas de la Cacofonía y está intrínsecamente ligada a esa Línea de Sangre. Permite a quienes la poseen usar el habla y el canto para lograr una variedad de efectos sobrenaturales.\n\nNombrada en honor a la Musa griega de la Tragedia, Melpominee es una $pod_discipline$ exclusiva de las Hijas de la Cacofonía. Explora el poder de la voz, sacudiendo el alma misma de quienes se hallan cerca y permitiendo al vampiro realizar hazañas sonoras de otro modo imposibles."
 
 trait_mytherceria: "Mythercería"
 trait_mytherceria_desc: "Mythercería es una $pod_discipline$ que se manifiesta en vampiros de sangre feérica como los Kiasyd y los Maeghar. Otorga al vampiro sentidos místicos, la capacidad de robar conocimiento y otros poderes atribuidos a las hadas."
 
 trait_mytherceriaadvanced: "Mythercería Avanzada"
 trait_mytherceriaadvanced_desc: "Mythercería es una $pod_discipline$ que se manifiesta en vampiros de sangre feérica como los Kiasyd y los Maeghar. Otorga al vampiro sentidos místicos, la capacidad de robar conocimiento y otros poderes atribuidos a las hadas.\n\nMythercería, un conjunto de poderes atribuidos a las hadas e inclinados hacia la revelación de conocimientos nuevos, ha llevado a muchas de sus víctimas a una locura balbuceante, o al menos a la frustración."
 
 trait_necromancy: "Necromancia"
 trait_necromancy_desc: "La [necromancy|E] es una forma de [bloodsorcery|E] que trata exclusivamente con el mundo de los muertos: los wraiths y el [UmbraGlossary('shadowlands')]. Del mismo modo que existen diferentes estilos de [bloodsorcery|E] convencional, hay una variedad de prácticas de [necromancy|E]. La practican principalmente los Giovanni."
 trait_necromancy_character_desc: "$necromancy_paths_display$\n\n$trait_necromancy_desc$"
 
 trait_necromancyadvanced: "Necromancia Avanzada"

 necromancy_paths_display: "#medium [ROOT.Char.GetFirstNameNoTooltip] tiene conocimiento de estos Caminos de Necromancia:[AddTextIf(GetScriptedGui('has_cappadocian_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@cappadocian_icon! Cappadocian')][AddTextIf(GetScriptedGui('has_giovanni_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@giovanni_icon! Giovanni')][AddTextIf(GetScriptedGui('has_harbinger_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@harbinger_icon! Harbinger')][AddTextIf(GetScriptedGui('has_impundulu_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@impundulu_icon! Impundulu')][AddTextIf(GetScriptedGui('has_lamia_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@lamia_icon! Lamia')][AddTextIf(GetScriptedGui('has_nagaraja_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@nagaraja_icon! Nagaraja')][AddTextIf(GetScriptedGui('has_rosselini_necromancy_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@giovanni_icon! Rosselini')]#!"
 
 trait_obeah: "Obeah"
 trait_obeah_desc: "Obeah es la $pod_discipline$ exclusiva de los Salubri, también conocida como el Camino del Sanador de Valeren.\n\nObeah se originó con Saulot durante sus viajes por Oriente, donde aprendió de los [GetTrait('kueijin').GetName( GetNullCharacter )] el uso de la Perla del Dragón. Aprender Obeah provoca que se desarrolle un tercer ojo en mitad de la frente."
 
 trait_obeahadvanced: "Obeah Avanzado"
 trait_obeahadvanced_desc: "Obeah es la $pod_discipline$ exclusiva de los Salubri, también conocida como el Camino del Sanador de Valeren.\n\nObeah se originó con Saulot durante sus viajes por Oriente, donde aprendió de los [GetTrait('kueijin').GetName( GetNullCharacter )] el uso de la Perla del Dragón. Aprender Obeah provoca que se desarrolle un tercer ojo en mitad de la frente."
 
 trait_obfuscate: "Ofuscación"
 trait_obfuscate_desc: "La Ofuscación es una $pod_discipline$ que permite a los vampiros ocultarse, engañar la mente de otros o hacer que ignoren aquello que el usuario no quiere que se vea.\n\nLa Ofuscación forma parte de la maldición de Caín sobre los [Glossary('Antediluvianos','game_concept_antediluvian_desc')], al borrarlos de la creación."
 
 trait_obfuscateadvanced: "Ofuscación Avanzada"
 trait_obfuscateadvanced_desc: "La Ofuscación es una $pod_discipline$ que permite a los vampiros ocultarse, engañar la mente de otros o hacer que ignoren aquello que el usuario no quiere que se vea.\n\nLa Ofuscación forma parte de la maldición de Caín sobre los [Glossary('Antediluvianos','game_concept_antediluvian_desc')], al borrarlos de la creación. Quienes usan esta $pod_discipline$ con frecuencia acaban apartados de la sociedad, sin participar nunca en interacciones sociales, limitándose a observar."
 
 trait_obtenebration: "Obtenebración"
 trait_obtenebration_desc: "Se dice que la [Glossary('Obtenebración','game_concept_obtenebration_desc')] condena aún más al vampiro que la usa, alejándolo todavía más de la Gracia de Dios y acercándolo a la oscura atracción del Abismo. Por esta razón, quien la usa es rechazado tanto por animales como por humanos. La oscuridad antinatural invocada por la Obtenebración resulta extremadamente aterradora para mortales, animales e incluso otros $pod_cainites$ no acostumbrados a su uso."
 
 trait_obtenebrationadvanced: "Obtenebración Avanzada"
 trait_obtenebrationadvanced_desc: "Se dice que la Obtenebración condena aún más al vampiro que la usa, alejándolo todavía más de la Gracia de Dios y acercándolo a la oscura atracción del Abismo. Por esta razón, quien la usa es rechazado tanto por animales como por humanos. La oscuridad antinatural invocada por la Obtenebración resulta extremadamente aterradora para mortales, animales e incluso otros $pod_cainites$ no acostumbrados a su uso."
 
 trait_potence: "Potencia"
 trait_potence_desc: "La Potencia es la $pod_discipline$ que dota a los vampiros de vigor físico y fuerza sobrenatural. Los vampiros con la $pod_discipline$ de Potencia poseen una Destreza física que supera los límites mortales."

 trait_potenceadvanced: "Potencia Avanzada"
 trait_potenceadvanced_desc: "La Potencia es la $pod_discipline$ que dota a los vampiros de vigor físico y fuerza sobrenatural. Los vampiros con la $pod_discipline$ de Potencia poseen una Destreza física que supera los límites mortales." 
 
 trait_presence: "Presencia"
 trait_presence_desc: "La Presencia es la $pod_discipline$ del atractivo sobrenatural y la manipulación emocional que permite a los Vástagos atraer, influir y controlar a las multitudes.\n\nLa Presencia suaviza la maldición de Dios sobre los $pod_cainites$ al convertir al vampiro en el centro de atención, ya sea fascinando, seduciendo o intimidando a quienes se encuentran cerca."

 trait_presenceadvanced: "Presencia Avanzada" 
 trait_presenceadvanced_desc: "La Presencia es la $pod_discipline$ del atractivo sobrenatural y la manipulación emocional que permite a los Vástagos atraer, influir y controlar a las multitudes.\n\nLa Presencia suaviza la maldición de Dios sobre los $pod_cainites$ al convertir al vampiro en el centro de atención, ya sea fascinando, seduciendo o intimidando a quienes se encuentran cerca."

 trait_kai: "Kai"
 trait_kai_desc: "Kai es una $pod_discipline$ de poder interior basada en el honor cultivado dentro de quienes la usan.\n\nQuien usa Kai concentra su poder interior y su determinación en un arma tanto marcial como coercitiva."

 trait_kaiadvanced: "Kai Avanzado" 
 trait_kaiadvanced_desc: "Kai es una $pod_discipline$ de poder interior basada en el honor cultivado dentro de quienes la usan.\n\nQuien usa Kai concentra su poder interior y su determinación en un arma tanto marcial como coercitiva."

 TRAIT_FLAG_DESC_can_intensify_herd_resonance: "Puede cambiar la intensidad de la [resonance|E] de los miembros de su [POD_herd|E]"

 trait_protean: "Protean"
 trait_protean_desc: "Protean es una $pod_discipline$ que otorga a los vampiros la capacidad de cambiar de forma, desde hacer crecer garras feroces hasta evaporarse en una nube de niebla.\n\nProtean forma parte de la maldición de Dios sobre Caín, en cuanto arranca la fachada de humanidad que todo vampiro debe mantener, revelando a [Glossary('La Bestia','game_concept_beast_desc')] en el interior de su alma."
 
 trait_proteanadvanced: "Protean Avanzado"
 trait_proteanadvanced_desc: "Protean es una $pod_discipline$ que otorga a los vampiros la capacidad de cambiar de forma, desde hacer crecer garras feroces hasta evaporarse en una nube de niebla.\n\nProtean forma parte de la maldición de Dios sobre Caín, en cuanto arranca la fachada de humanidad que todo vampiro debe mantener, revelando a [Glossary('La Bestia','game_concept_beast_desc')] en el interior de su alma. Los usuarios avanzados a veces descubren que sus cuerpos cambian sin su consentimiento, reaccionando directamente a sus emociones, lo que los lleva a situaciones embarazosas."
 
 trait_quietus: "Extinción"
 trait_quietus_desc: "Extinción es la $pod_discipline$ distintiva de los Assamitas, que les otorga influencia sobre la sangre de otros.\n\nAunque cada una de las castas Assamitas posee Extinción como una $pod_discipline$ interna del $pod_clan$, es conocida principalmente por ser una herramienta de asesinato en manos de la casta Guerrera, y los poderes de nivel más bajo están mayormente orientados a ese fin."

 trait_quietusadvanced: "Extinción Avanzada"
 trait_quietusadvanced_desc: "Extinción es la $pod_discipline$ distintiva de los Assamitas, que les otorga influencia sobre la sangre de otros.\n\nAunque cada una de las castas Assamitas posee Extinción como una $pod_discipline$ interna del $pod_clan$, es conocida principalmente por ser una herramienta de asesinato en manos de la casta Guerrera, y los poderes de nivel más bajo están mayormente orientados a ese fin."
 
 trait_rift: "Grieta"
 trait_rift_desc: "Grieta es una $pod_discipline$ practicada principalmente por los [GetTrait('kizoku').GetName( GetNullCharacter )], que les permite usar sus pesadillas para manipular la realidad de formas que benefician enormemente su movilidad y sus artimañas."

 trait_riftadvanced: "Grieta Avanzada" 
 trait_riftadvanced_desc: "Grieta es una $pod_discipline$ practicada principalmente por los [GetTrait('kizoku').GetName( GetNullCharacter )], que les permite usar sus pesadillas para manipular la realidad de formas que benefician enormemente su movilidad y sus artimañas."

 trait_serpentis: "Serpentis"
 trait_serpentis_desc: "Serpentis es la $pod_discipline$ distintiva del $pod_clan$ Seguidores de Set. Principalmente proporciona habilidades de cambio de forma, aunque también engloba la corrupción y otras características asociadas a las serpientes.\n\nSerpentis tiene un significado casi religioso para el $pod_clan$, aunque los científicos Vástagos presuponen una relación con los poderes de cambio de forma de Protean."
 
 trait_serpentisadvanced: "Serpentis Avanzado"
 trait_serpentisadvanced_desc: "Serpentis es la $pod_discipline$ distintiva del $pod_clan$ Seguidores de Set. Principalmente proporciona habilidades de cambio de forma, aunque también engloba la corrupción y otras características asociadas a las serpientes.\n\nSerpentis tiene un significado casi religioso para el $pod_clan$, aunque los científicos Vástagos presuponen una relación con los poderes de cambio de forma de Protean."
 
 trait_spiritus: "Spiritus"
 trait_spiritus_desc: "Spiritus es una $pod_discipline$ exclusiva de la Línea de Sangre Ahrimane, que les permite interactuar con espíritus animalescos. En sus niveles más básicos permite al vampiro hablar con espíritus y convocarlos, pero en niveles superiores es posible canalizar su poder para fortalecer al Ahrimane."

 trait_spiritusadvanced: "Spiritus Avanzado"
 trait_spiritusadvanced_desc: "Spiritus es una $pod_discipline$ exclusiva de la Línea de Sangre Ahrimane, que les permite interactuar con espíritus animalescos. En sus niveles más básicos permite al vampiro hablar con espíritus y convocarlos, pero en niveles superiores es posible canalizar su poder para fortalecer al Ahrimane."
 
 trait_temporis: "Temporis"
 trait_temporis_desc: "Temporis es una $pod_discipline$ exclusiva de los Verdadero Brujah. Supuestamente un refinamiento de la Celeridad, Temporis otorga al $pod_cainite$ la capacidad de manipular el propio flujo del tiempo."

 trait_temporisadvanced: "Temporis Avanzado"
 trait_temporisadvanced_desc: "Temporis es una $pod_discipline$ exclusiva de los Verdadero Brujah. Supuestamente un refinamiento de la Celeridad, Temporis otorga al $pod_cainite$ la capacidad de manipular el propio flujo del tiempo.\n\nAunque poderosa, esta $pod_discipline$ también puede resultar agotadora de usar."
 
 trait_thinbloodalchemy: "Alquimia de Sangre Diluida"
 trait_thinbloodalchemy_desc: "$pod_discipline$ exclusiva de los Sangre Diluida, les permite imitar los poderes de las [Glossary('Disciplinas','game_concept_discipline_desc')] de los vampiros de sangre pura.\n\nLa Alquimia de Sangre Diluida es una práctica de dos pasos: la destilación de un brebaje de sangre usando la fórmula adecuada, y después la activación de dicho brebaje bebiéndolo y canalizando su poder."

 trait_thinbloodalchemyadvanced: "Alquimia de Sangre Diluida Avanzada"
 trait_thinbloodalchemyadvanced_desc: "$pod_discipline$ exclusiva de los Sangre Diluida, les permite imitar los poderes de las [Glossary('Disciplinas','game_concept_discipline_desc')] de los vampiros de sangre pura.\n\nLa Alquimia de Sangre Diluida es una práctica de dos pasos: la destilación de un brebaje de sangre usando la fórmula adecuada, y después la activación de dicho brebaje bebiéndolo y canalizando su poder."

 trait_valeren: "Valeren"
 trait_valeren_desc: "Valeren es la $pod_discipline$ mística de los Salubri. En su forma más básica, Valeren proporciona control sobre el dolor y una mayor habilidad marcial, lo que aparentemente permite a los guerreros recurrir al poder del cielo para vencer a sus enemigos."

 trait_valerenadvanced: "Valeren Avanzado" 
 trait_valerenadvanced_desc: "Valeren es la $pod_discipline$ mística de los Salubri. En su forma más básica, Valeren proporciona control sobre el dolor y una mayor habilidad marcial, lo que aparentemente permite a los guerreros recurrir al poder del cielo para vencer a sus enemigos." 

 trait_vicissitude: "Vicisitud"
 trait_vicissitude_desc: "Uno de los poderes más horripilantes disponibles para los $pod_cainites$, la Vicisitud es el poder distintivo de los Tzimisce y es casi desconocido fuera del $pod_clan$. Con ella, un artesano experimentado puede esculpir la carne y los huesos de un sujeto, convirtiéndolo en una criatura de belleza extraña o retorciéndolo en una monstruosidad deforme."
 
 trait_vicissitudeadvanced: "Vicisitud Avanzada" 
 trait_vicissitudeadvanced_desc: "Uno de los poderes más horripilantes disponibles para los $pod_cainites$, la Vicisitud es el poder distintivo de los Tzimisce y es casi desconocido fuera del $pod_clan$. Con ella, un artesano experimentado puede esculpir la carne y los huesos de un sujeto, convirtiéndolo en una criatura de belleza extraña o retorciéndolo en una monstruosidad deforme." 
 TRAIT_FLAG_DESC_chiropteran_marauder: "Desbloquea la opción de Cambio de Forma [GetModifier('POD_shapeshift_form_chiropteran_modifier').GetNameWithTooltip]"
 TRAIT_FLAG_DESC_study_anatomy: "Desbloquea la [character_interaction|E] Estudiar Anatomía"
 
 trait_visceratika: "Viscerátika"
 trait_visceratika_desc: "La $pod_discipline$ de Visceratika es posesión de la Línea de Sangre Gárgola y es una extensión de su afinidad natural con la piedra, la tierra y las cosas hechas con ellas.\n\nVisceratika presenta habilidades de cambio de forma similares a las de Protean, aunque con mayor énfasis en la defensa."

 trait_visceratikaadvanced: "Visceratika Avanzada"
 trait_visceratikaadvanced_desc: "La $pod_discipline$ de Visceratika es posesión exclusiva de la Línea de Sangre Gárgola y es una extensión de su afinidad natural con la piedra, la tierra y las cosas hechas con ellas.\n\nVisceratika presenta habilidades de cambio de forma similares a las de Protean, aunque con mayor énfasis en la defensa."

 trait_bloodsorcery: "Hechicería de Sangre"
 trait_bloodsorceryadvanced: "Hechicería de Sangre Avanzada"
 trait_bloodsorcery_desc: "La [bloodsorcery|E] se refiere a la magia practicada por los vampiros, alimentada por prácticas religiosas u ocultas y el poder de la $pod_vitae$ $pod_cainite$.\n\nA través de la práctica de la [bloodsorcery|E], un $pod_cainite$ puede invocar fuego, controlar el clima y hacer muchas otras cosas que resultan antinaturales incluso para los estándares vampíricos."
 trait_bloodsorcery_character_desc: "$bloodmagic_paths_display$\n\n$trait_bloodsorcery_desc$"

 bloodmagic_paths_display: "#medium [ROOT.Char.GetFirstNameNoTooltip] tiene conocimiento de estos [bs_traditions|E]:[AddTextIf(GetScriptedGui('has_thaumaturgy_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@tremere_icon! Thaumaturgy')][AddTextIf(GetScriptedGui('has_sielanic_thaumaturgy_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@tremere_icon! Sielanic Thaumaturgy')][AddTextIf(GetScriptedGui('has_dur_an_ki_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@assamite_icon! Dur-An-Ki')][AddTextIf(GetScriptedGui('has_akhu_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@setite_icon! Akhu')][AddTextIf(GetScriptedGui('has_sadhana_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@ravnos_icon! Sadhana')][AddTextIf(GetScriptedGui('has_koldunic_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@tzimisce_icon! Koldunic')][AddTextIf(GetScriptedGui('has_sihr_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@sihr_icon! Sihr')][AddTextIf(GetScriptedGui('has_abyssal_mysticism_bloodmagic_sgui').IsShown(GuiScope.SetRoot(ROOT.Char.MakeScope).End),'\n$TAB|q$@lasombra_icon! Abyssal Mysticism')]#!"

 TRAIT_FLAG_DESC_unlock_incorporeal_form: "Puede cambiar de forma a [GetModifier( 'POD_shapeshift_form_incorporeal_modifier' ).GetNameWithTooltip|L]"

 trait_darkthaumaturgy: "Taumaturgia Oscura"
 trait_darkthaumaturgyadvanced: "Taumaturgia Oscura Avanzada"
 trait_darkthaumaturgy_desc: "$bloodmagic_paths_display$\n\nLa Taumaturgia Oscura es el nombre que recibe la [thaumaturgy|E] aprendida de los demonios.\n\nLos vampiros pueden hacer Pactos con demonios para aprender los secretos de la [bloodsorcery|E], como hacen los magos mortales para aprender otras magias infernales; lo hacen a costa de la poca alma que les queda, en un trato que es un atajo rápido hacia el poder mágico."
 
 trait_sielanic_thaumaturgy: "Taumaturgia Sielánica"
 trait_sielanic_thaumaturgyadvanced: "Taumaturgia Sielánica Avanzada"
 trait_sielanic_thaumaturgy_desc: "$bloodmagic_paths_display$\n\nLa Taumaturgia Sielánica es una forma de Taumaturgia inspirada en el dios pagano Telyavel y practicada por los Tremere Telyavélicos, una Línea de Sangre de los Tremere originaria de Lituania.\n\nLos Telvays aprendieron a utilizar el poder de la siela, el espíritu animista latente en la tierra, la piedra, las plantas y los animales de su Tierra Natal adoptiva."
 
 trait_ogham: "Ogham"
 trait_oghamadvanced: "Ogham Avanzado"
 trait_ogham_desc: "$bloodmagic_paths_display$\n\nOgham es una forma muy limitada de [bloodsorcery|E] basada en runas celtas, practicada por los Lhiannan, que aprovecha la esquirla espiritual de la Línea de Sangre y concede poder dentro de su territorio."
 
 trait_sihr: "Sihr"
 trait_sihradvanced: "Sihr Avanzado"
 trait_sihr_desc: "$bloodmagic_paths_display$\n\nSe cree que Sihr es la única tradición de [bloodsorcery|E] acorde con la voluntad de Alá. Se diferencia de otras formas de [bloodsorcery|E] en que su poder se deriva de la fe de quien la lanza. Sihr solo se enseña a los [Glossary('Ashirra','game_concept_ashirra_desc')] y a los [GetTrait('assamite').GetName( GetNullCharacter )] musulmanes."
 
 trait_abyssmysticism: "Misticismo del Abismo"
 trait_abyssmysticismadvanced: "Misticismo del Abismo Avanzado"
 trait_abyssmysticism_desc: "$bloodmagic_paths_display$\n\nEl Misticismo del Abismo es una forma de [bloodsorcery|E], derivada de la $pod_discipline$ Obtenebración. Como cabe suponer, este arte arcano lo practican casi exclusivamente los miembros del $pod_clan$ Lasombra. Quienes practican estas artes místicas son llamados los Ensombrecidos."
 
 trait_sadhana: "Sadhana"
 trait_sadhanaadvanced: "Sadhana Avanzada"
 trait_sadhana_desc: "$bloodmagic_paths_display$\n\nSadhana es una forma de [bloodsorcery|E] hindú que precede en miles de años a la destacada Taumaturgia Hermética del $pod_clan$ Tremere. La practican los $pod_cainites$ brahmanes hindúes de la India, conocidos como rakta-sadhus o incluso Brahmanes de Sangre."
 
 trait_akhu: "Akhu"
 trait_akhuadvanced: "Akhu Avanzado"
 trait_akhu_desc: "$bloodmagic_paths_display$\n\nAkhu, a menudo llamada Hechicería Setita por los profanos, es la antigua tradición de [bloodsorcery|E] de los Seguidores de Set.\n\nEn el apogeo de Egipto, antes de su conversión al cristianismo a manos del Imperio Romano, la magia era algo habitual, practicada tanto por mortales como por vampiros."
 
 trait_koldunicsorcery: "Hechicería Koldúnica"
 trait_koldunicsorceryadvanced: "Hechicería Koldúnica Avanzada"
 trait_koldunicsorcery_desc: "$bloodmagic_paths_display$\n\nLa Hechicería Koldúnica, o Koldunismo, es una forma de [bloodsorcery|E] $pod_cainite$ practicada principalmente por los [GetTrait('tzimisce').GetName(GetNullCharacter)].\n\nDe forma única, utiliza [krainas|E] que extraen poder de la tierra y sus espíritus."
 
 trait_duranki: "Dur-An-Ki"
 trait_durankiadvanced: "Dur-An-Ki Avanzado"
 trait_duranki_desc: "$bloodmagic_paths_display$\n\nDur-An-Ki (Amo del Cielo y la Tierra) es una forma de [bloodsorcery|E] practicada por los Vástagos de Oriente Medio y África. Es una forma de magia muy antigua, que bebe de una enorme variedad de tradiciones religiosas mortales, y precede a la Taumaturgia, a la que se asemeja en muchos aspectos."
 
 trait_thaumaturgy: "Taumaturgia"
 trait_thaumaturgyadvanced: "Taumaturgia Avanzada"
 trait_thaumaturgy_desc: "$bloodmagic_paths_display$\n\nLa Taumaturgia es la forma celosamente guardada de [bloodsorcery|E] practicada por el $pod_clan$ vampírico Tremere.\n\nCreada mediante una exhaustiva investigación y una amplia experimentación, la Taumaturgia utiliza los principios de la magia hermética empleados por la Casa Tremere cuando aún era un cónclave de magos, adaptados para alimentarse del poder mágico inherente a la $pod_vitae$ en lugar de la Quintaesencia."

 trait_fortitudeadvanced: "Fortaleza Avanzada"
 trait_fortitudeadvanced_desc: "La Fortaleza es una $pod_discipline$ que otorga a los Vástagos una resistencia sobrenatural, hasta el punto de resistir el fuego y la luz solar.\n\nLa Fortaleza otorga al $pod_cainite$ la capacidad de resistir todo tipo de Daño; sin embargo, cumple con su parte de la maldición de Dios al engendrar arrogancia y exceso de confianza."

 trait_oblivion: "Olvido" 
 trait_oblivion_desc: "El Olvido es una $pod_discipline$ que permite a quienes la usan recurrir a algo completamente antinatural: invocar la oscuridad sobrenatural del Abismo y esclavizar espectros mediante el Olvido, de forma similar a la [necromancy|E]."

 trait_oblivionadvanced: "Olvido Avanzado" 
 trait_oblivionadvanced_desc: "El Olvido es una $pod_discipline$ que permite a quienes la usan recurrir a algo completamente antinatural: invocar la oscuridad sobrenatural del Abismo y esclavizar espectros mediante el Olvido, de forma similar a la [necromancy|E]." 

 trait_mortis: "Mortis"
 trait_mortis_desc: "La $pod_discipline$ Mortis se basa en el control y la manipulación de la muerte. Más concretamente, Mortis es una forma de [bloodsorcery|E] que trata con los cadáveres y su estado tras la muerte. Los Vástagos del $pod_clan$ Capadocio son los únicos con afinidad natural por esta $pod_discipline$."
 
 trait_mortisadvanced: "Mortis Avanzado" 
 trait_mortisadvanced_desc: "La $pod_discipline$ Mortis se basa en el control y la manipulación de la muerte. Más concretamente, Mortis es una forma de [bloodsorcery|E] que trata con los cadáveres y su estado tras la muerte. Los Vástagos del $pod_clan$ Capadocio son los únicos con afinidad natural por esta $pod_discipline$."

 trait_nihilistics: "Nihilistics"
 trait_nihilistics_desc: "Nihilistics es una $pod_discipline$ exclusiva de los Nagaraja que les permite penetrar el Velo y canalizar el [UmbraGlossary('oblivion')]. Aunque algunos de sus usos están relacionados con los habitantes del [UmbraGlossaryLocalized('shadowlands','Inframundo')], muchos de sus poderes permiten al vampiro atraer el [UmbraGlossary('oblivion')] al mundo físico."
 
 trait_nihilisticsadvanced: "Nihilistics Avanzado" 
 trait_nihilisticsadvanced_desc: "Nihilistics es una $pod_discipline$ exclusiva de los Nagaraja que les permite penetrar el Velo y canalizar el [UmbraGlossary('oblivion')]. Aunque algunos de sus usos están relacionados con los habitantes del [UmbraGlossaryLocalized('shadowlands','Inframundo')], muchos de sus poderes permiten al vampiro atraer el [UmbraGlossary('oblivion')] al mundo físico."

 trait_thanatosis: "Thanatosis"
 trait_thanatosis_desc: "Thanatosis es la $pod_discipline$ exclusiva de la Línea de Sangre Samedi, que consiste en manipular los efectos de la muerte y la descomposición. En algunos aspectos es similar a la [necromancy|E]. Esta $pod_discipline$ trata con la apariencia de la muerte en todas sus formas. Sus practicantes viven obsesionados con ella y son rechazados por todos, salvo por los Vástagos más retorcidos."
 
 trait_thanatosisadvanced: "Thanatosis Avanzado" 
 trait_thanatosisadvanced_desc: "Thanatosis es la $pod_discipline$ exclusiva de la Línea de Sangre Samedi, que consiste en manipular los efectos de la muerte y la descomposición. En algunos aspectos es similar a la [necromancy|E]. Esta $pod_discipline$ trata con la apariencia de la muerte en todas sus formas. Sus practicantes viven obsesionados con ella y son rechazados por todos, salvo por los Vástagos más retorcidos."

 trait_deimos: "Deimos"
 trait_deimos_desc: "Deimos es una $pod_discipline$ creada por los Lamia en su investigación de los muertos y de Lilith. Proporciona a los vampiros cierto control sobre sus propias formas sin vida, así como sobre espíritus oscuros y los auspicios de la Madre Oscura. También se conoce como el Camino de los Cuatro Humores."
 
 trait_deimosadvanced: "Deimos Avanzado" 
 trait_deimosadvanced_desc: "Deimos es una $pod_discipline$ creada por los Lamia en su investigación de los muertos y de Lilith. Proporciona a los vampiros cierto control sobre sus propias formas sin vida, así como sobre espíritus oscuros y los auspicios de la Madre Oscura. También se conoce como el Camino de los Cuatro Humores."

 trait_abombo: "Abombo"
 trait_abombo_desc: "Un Camino practicado por los Laibon de África, centrado en la conexión entre los muertos y los vivos; similar al Camino del Cenotafio de la [necromancy|E], pero distinto de él. Permite al nigromante controlar e incluso reasignar la [Fetter|E] de un wraith."
 
 trait_abomboadvanced: "Abombo Avanzado" 
 trait_abomboadvanced_desc: "Un Camino practicado por los Laibon de África, centrado en la conexión entre los muertos y los vivos; similar al Camino del Cenotafio de la [necromancy|E], pero distinto de él. Permite al nigromante controlar e incluso reasignar la [Fetter|E] de un wraith."

 trait_abombwe: "Abombwe"
 trait_abombwe_desc: "Abombwe es una $pod_discipline$ practicada por el Legado Akunanse de los Laibon y la misteriosa Línea de Sangre Bonsam de la Edad Oscura."
 
 trait_abombweadvanced: "Abombwe Avanzado"
 trait_abombweadvanced_desc: "Abombwe es una $pod_discipline$ practicada por el Legado Akunanse de los Laibon y la misteriosa Línea de Sangre Bonsam de la Edad Oscura. Abombwe utiliza la estrecha conexión del vampiro con sus propias [Glossary('Bestias','game_concept_beast_desc')] (y las de otros) y el control sobre ellas, además de canalizar el poder de la Bestia para diversos fines." 
 
 trait_bardo: "Bardo"
 trait_bardo_desc: "Bardo es la $pod_discipline$ distintiva practicada por los Hijos de Osiris, transmitida a ellos por la deidad egipcia Osiris."
 
 trait_bardoadvanced: "Bardo Avanzado"
 trait_bardoadvanced_desc: "Bardo es la $pod_discipline$ distintiva practicada por los Hijos de Osiris, transmitida a ellos por la deidad egipcia Osiris."
 
