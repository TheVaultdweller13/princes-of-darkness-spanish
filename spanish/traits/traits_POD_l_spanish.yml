 trait_supehunter: "Cazador"
 trait_supehunter_desc: "Un Cazador de monstruos."
 
 trait_turnedhunter: "Cazador Convertido"
 trait_turnedhunter_desc: "Este Cazador de monstruos ha sido desviado de su Misión por poderes sobrenaturales."
 
 trait_torpor: "Letargo"
 trait_torpor_desc: "El $pod_torpor$ no es más que un estado de estasis más profundo que el sueño que los vampiros experimentan normalmente durante las horas de luz. La duración del $pod_torpor$ depende de la Humanidad o el nivel de Camino del vampiro, y puede durar desde un día hasta más de un milenio. Se dice que los vampiros ancianos a menudo sienten la necesidad de entrar voluntariamente en $pod_torpor$, también conocido como el sueño de las eras."
 trait_little_death: "Pequeña Muerte"
 trait_little_death_desc: "Durante la Pequeña Muerte, el cuerpo del personaje «muere», pero el alma dual permanece dentro del cadáver. Los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] temen la Pequeña Muerte, pues es un periodo angustioso de visiones y pesadillas, en el que el espíritu es muy vulnerable a las magias hostiles."
 trait_caul: "Manto"
 trait_caul_desc: "Cuando un Vivo muere, entra en el [UmbraGlossaryLocalized('shadowlands','Inframundo')] cubierto por un capullo plásmico llamado Caul. Mientras el caul está presente, el Enfant se encuentra en un estado plácido y onírico, generalmente ajeno a su entorno."
 trait_slumber: "Sopor"
 trait_slumber_desc: "Un estado de inactividad y aislamiento del mundo."
 trait_deactivated: "Desactivado"
 trait_deactivated_desc: "Desactivado, ha dejado de consumir la energía de su Momia creadora."
 trait_coccon: "Capullo"
 trait_coccon_desc: "El personaje se envuelve en una cáscara endurecida mientras su metabolismo se ralentiza hasta un estado de animación suspendida."
 trait_long_sleep: "Sueño Prolongado"
 trait_long_sleep_desc: "Un estado de animación suspendida no muy distinto de la capacidad natural de hibernación del oso."
 trait_dragon_sleep: "Sueño del Dragón"
 trait_dragon_sleep_desc: "El Mokolé se encuentra en un sopor profundo. Sueña con el pasado a través del poder de Mnesis. No se puede saber si se trata de meros sueños o de pesadillas."
 
 trait_canon: "Canónico"
 trait_canon_desc: ""
 
 trait_demon: "Demonio"
 trait_demon_desc: "Los Demonios son ángeles caídos que eligieron ponerse del lado de Lucifer y de la humanidad en lugar de Dios en los primeros días de la Creación. Como castigo por su rebelión y deslealtad, el Arcángel Miguel expulsó a estos ángeles del Cielo hacia el [UmbraGlossary('abyss')]."

 trait_elohim: "Elohim"
 trait_elohim_desc: "Los Elohim, también llamados Ángeles, son seres celestiales alados que sirvieron como mensajeros y sirvientes de Dios en el Cielo."
 
 trait_vampgeneration: "Generación"
 
 trait_vampgeneration1: "1ª Generación"
 trait_vampgeneration1_desc: "Caín, el primer vampiro. Maldecido por Dios para ser el progenitor de los malditos, lo que lo convierte de facto en el único vampiro de esta Generación."
 
 trait_vampgeneration2: "2ª Generación"
 trait_vampgeneration2_desc: "Los tres míticos Chiquillos de Caín. Asesinados por la Tercera Generación."
 
 trait_vampgeneration3: "3ª Generación"
 trait_vampgeneration3_desc: "A menudo conocida como Antediluvianos, esta Generación fundó los clanes de los vampiros. Se dice que la mayoría posee poderes más propios de dioses que de simples Cainitas."

 trait_vampgeneration4: "4ª Generación"
 trait_vampgeneration4_desc: "A menudo conocida como Matusalén, esta Generación alberga a los vampiros activos más poderosos de la Edad Oscura y más allá."

 trait_vampgeneration5: "5ª Generación"
 trait_vampgeneration5_desc: "Solo algo menos poderosa que la 4ª, esta Generación alberga a la mayoría de los verdaderos actores de peso en la política vampírica."

 trait_vampgeneration6: "6ª Generación"
 trait_vampgeneration6_desc: "Las «Generaciones medias» son los vampiros más numerosos. A menudo son actores políticos importantes por derecho propio, pero la mayoría de las veces bajo el liderazgo (a veces invisible) de un vampiro de Generación inferior."

 trait_vampgeneration7: "7ª Generación"
 trait_vampgeneration7_desc: "Las «Generaciones medias» son los vampiros más numerosos. A menudo son actores políticos importantes por derecho propio, pero la mayoría de las veces bajo el liderazgo (a veces invisible) de un vampiro de Generación inferior."

 trait_vampgeneration8: "8ª Generación"
 trait_vampgeneration8_desc: "Las «Generaciones medias» son los vampiros más numerosos. A menudo son actores políticos importantes por derecho propio, pero la mayoría de las veces bajo el liderazgo (a veces invisible) de un vampiro de Generación inferior."

 trait_vampgeneration9: "9ª Generación"
 trait_vampgeneration9_desc: "Las «Generaciones medias» son los vampiros más numerosos. A menudo son actores políticos importantes por derecho propio, pero la mayoría de las veces bajo el liderazgo (a veces invisible) de un vampiro de Generación inferior."

 trait_vampgeneration10: "10ª Generación"
 trait_vampgeneration10_desc: "Las «Generaciones más altas» son la chusma del mundo cainita. Difamados, o a menudo abiertamente maltratados por sus homólogos de Generación inferior, apenas tienen poder en la política de la noche."

 trait_vampgeneration11: "11ª Generación"
 trait_vampgeneration11_desc: "Las «Generaciones más altas» son la chusma del mundo cainita. Difamados, o a menudo abiertamente maltratados por sus homólogos de Generación inferior, apenas tienen poder en la política de la noche."

 trait_vampgeneration12: "12ª Generación"
 trait_vampgeneration12_desc: "Las «Generaciones más altas» son la chusma del mundo cainita. Difamados, o a menudo abiertamente maltratados por sus homólogos de Generación inferior, apenas tienen poder en la política de la noche."

 trait_vampgeneration13: "13ª Generación"
 trait_vampgeneration13_desc: "Las «Generaciones más altas» son la chusma del mundo cainita. Difamados, o a menudo abiertamente maltratados por sus homólogos de Generación inferior, apenas tienen poder en la política de la noche."

 trait_vampgeneration14: "14ª Generación"
 trait_vampgeneration14_desc: "Los «Sangre Diluida» apenas son vampiros en algunos aspectos. La maldición de Caín está tan diluida en ellos que solo exhiben parte de las fortalezas y debilidades tradicionales de sus homólogos de Generación inferior."

 trait_vampgeneration15: "15ª Generación"
 trait_vampgeneration15_desc: "Los «Sangre Diluida» apenas son vampiros en algunos aspectos. La maldición de Caín está tan diluida en ellos que solo exhiben parte de las fortalezas y debilidades tradicionales de sus homólogos de Generación inferior."
 
 trait_vampgeneration16: "16ª Generación"
 trait_vampgeneration16_desc_no_collide: "Los «Sangre Diluida» apenas son vampiros en algunos aspectos. La maldición de Caín está tan diluida en ellos que solo exhiben parte de las fortalezas y debilidades tradicionales de sus homólogos de Generación inferior."
 
 trait_something_unusual: "Algo Inusual"
 trait_something_unusual_desc: "Hay algo extraño en esto."
 
 trait_revenant: "Aparecido"
 trait_revenant_desc: "Un [ghoul|E] independiente nacido con sangre de vampiro en las venas. A menudo considerados híbridos impíos entre vampiros y mortales, los [Glossary('Aparecidos','game_concept_revenant_desc')] están atrapados entre ambos mundos."

 trait_zadruga: "Zadruga"
 trait_zadruga_desc: "Un término tzimisce para los Ghouls hereditarios. De todos los clanes, los Tzimisce han criado el mayor número de familias de [ghoul|E]."

 trait_oathbreaker: "Perjuro"
 trait_oathbreaker_desc: "Este personaje rompió un juramento."
 
 trait_regnant: "Regente"
 trait_regnant_desc: "Este personaje ha creado un [ghoul|E]."
 
 trait_massregnant: "Regente Masivo"
 trait_massregnant_desc: "Este personaje ha creado Ghouls en masa. Esto suele ser una violación de la [the_masquerade|E]."
 
 trait_unbondable: "Invulnerable al Vínculo"
 trait_unbondable_desc: "Este personaje no puede ser vinculado por la sangre."
 
 trait_exposed: "Expuesto"
 trait_exposed_desc: "La naturaleza sobrenatural de esta criatura ha sido revelada a los mortales. Los Cazadores planearán ataques contra ella."
 
 trait_nagaraja: "Nagaraja"
 trait_nagaraja_desc: "Los Nagaraja son una extraña Línea de Sangre de vampiros devoradores de carne, temidos por los Vástagos de todos los bandos del Jyhad."
 
 trait_hecata: "Hecata"
 trait_hecata_desc: "No son un $pod_clan$ completamente orgánico que derive de un único [Glossary('Antediluviano','game_concept_antediluvian_desc')] y una Línea de Sangre ininterrumpida, sino que están formados por los Giovanni y los restos del antiguo $pod_clan$ Capadocio y sus Líneas de Sangre relacionadas; así como por los Nagaraja, a pesar de su falta de conexión con un [Glossary('Antediluviano','game_concept_antediluvian_desc')]." 

 trait_impundulu: "Impundulu"
 trait_impundulu_desc: "Una Línea de Sangre de vampiros vinculada a un aquelarre de brujas mortales y considerada uno de los Legados de los Laibon. Impundulu fue un poderoso nigromante en vida, casado con una bruja de la vida igualmente poderosa llamada Bomkazi."  
 
 trait_sire: "[Glossary('Sire','game_concept_Sire_desc')]"
 trait_sire_desc: "Este vampiro ha creado a otro de su especie."
 
 trait_masssire: "[Glossary('Sire','game_concept_Sire_desc')]"
 trait_masssire_desc: "Este vampiro ha creado un gran número de vampiros. La mayoría de los Caminos consideran esto una violación de la [the_masquerade|E]."
 
 trait_lamia: "Lamia"
 trait_lamia_desc: "Los Lamia fueron una Línea de Sangre de $pod_cainites$ dedicada a defender al $pod_clan$ Capadocio, aunque originalmente fueron un grupo de Cultistas que afirmaban descender de Lilith, la primera esposa de Adán."
 
 trait_gangrel_greek: "Gangrel Griego"
 trait_gangrel_greek_desc: "Los Gangrel Griegos fueron una rama que surgió en la Edad Oscura.\n\nLos Gangrel se han ocultado en las ciudades de los hombres incluso desde antes de Babilonia. Con el paso de los siglos, estos Gangrel se han centrado en sobrevivir en un entorno diferente, plagado de sus propios peligros únicos."

 trait_anda: "Anda"
 trait_anda_desc: "Los Anda son una Línea de Sangre $pod_cainite$ de los Gangrel que existe entre los mongoles. Ellos mismos creen ser vástagos de Itugen, la diosa de la tierra de la religión mongola.\nSu proximidad regional con los $pod_kueijin$ a menudo ha provocado escaramuzas, aunque las conquistas mongolas mortales amenazan con empeorar mucho la situación."
  
 trait_ahrimane: "Ahrimane"
 trait_ahrimane_desc: "Los Ahrimane son una Línea de Sangre de Vástagos rara y exclusivamente femenina que existió originalmente durante la Edad Oscura, encabezada por una mujer llamada Adisa.\n\nLa historia de los Ahrimane, tal como ellas la contarían, comienza con Adisa, una Valkyrje e hija de Freyja, la diosa nórdica."

 trait_patron: "Patrón"
 trait_patron_desc: "Una persona notable con intereses en el Mundo de Tinieblas."
 
 trait_harbringersofskulls: "Heraldos de las Calaveras"
 trait_harbringersofskulls_desc: ""
 

 
 trait_true_faith: "Fe Verdadera"
 trait_truefaith: "Fe Verdadera"
 trait_truefaith_desc: "Este personaje cree verdaderamente en la presencia de lo Divino. La [Glossary('Fe Verdadera','game_concept_true_faith_desc')] es una parte esencial de su alma, y le da acceso a habilidades que algunos podrían llamar antinaturales. Pero cuidado, los individuos pecaminosos pueden acabar perdiendo sus dones divinos.\nEste rasgo desbloquea un nuevo árbol de Estilo de vida."
 trait_truefaith_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] cree verdaderamente en la presencia de lo Divino. La [Glossary('Fe Verdadera','game_concept_true_faith_desc')] es una parte esencial de su alma, y le da acceso a habilidades que algunos podrían llamar antinaturales. Pero cuidado, los individuos pecaminosos pueden acabar perdiendo sus dones divinos.\nEste rasgo desbloquea un nuevo árbol de Estilo de vida."

 trait_beatific: "Beatífico"
 trait_beatific_desc: "Encarnación viviente de su Dios elegido, este personaje es un obrador de milagros, un paradigma de [Glossary('Fe Verdadera','game_concept_true_faith_desc')] en un mundo de tinieblas. Le da acceso a habilidades que algunos podrían llamar antinaturales. Pero cuidado, los individuos pecaminosos pueden acabar perdiendo sus dones divinos."
 trait_beatific_character_desc: "Encarnación viviente de su Dios elegido, [ROOT.Char.GetFirstNameNoTooltip] es un obrador de milagros, un paradigma de [Glossary('Fe Verdadera','game_concept_true_faith_desc')] en un mundo de tinieblas. Le da acceso a habilidades que algunos podrían llamar antinaturales. Pero cuidado, los individuos pecaminosos pueden acabar perdiendo sus dones divinos."
 #trait_beatific_player_desc: "#medium See the [GetDecision('advance_beatific_decision').GetName] [decision|E] for details on gaining [trait_level_track_xp|E].#!\n\n$trait_beatific_character_desc$"
 #trait_track_beatific: "Miracles"
 #trait_track_beatific_desc: "#bold Level 1:#! Make $POD_demon_unearthbound_decision$ [decision|E] free. As a [character_interaction|E], allows you to [POD_banish|E] a wraith/demon character to the [Glossary('Dark Kingdom','game_concept_dark_kingdom_desc')]/[UmbraGlossary('abyss')]. Unlocks a special [GetBuilding('sanctified_area_01').GetName] building. \n#bold Level 2:#! Unlocks a [crafting_node|E] that adds [GetModifier('bless_modifier').GetNameWithTooltip] as well as a [modifier|E] based on the [artifact|E]'s type. Gain immunity to murder. Gain immunity to delirium. You can no longer be possessed by $POD_splat_wraith_plural$.\n#bold Level 3:#! Targets will always accept faith conversion demands.\n#bold Level 4:#! As a [character_interaction|E], allows you to resolve every [Fetter|E] of a wraith. As a [character_interaction|E], allows you to kill a supernatural with low piety. You no longer need a hook to [POD_banish|E] a spirit.\n#bold Level 5:#! As a [character_interaction|E], allows you to make a vampire mortal again or achieve Golconda. Can recruit [GetMaA('minion_of_the_divine').GetName] as [men_at_arms|E]. Allows you to spend willpower instead of taking wounds. Allows you to not die by wounds.\n#italic The strongest tool in the hands of the Faithful is the power of true Miracles. Entire religions are born from such displays of True Faith.#!"

 trait_holy_seal: "Sello Sagrado"
 trait_holy_seal_desc: "Reliquias y artefactos de poder divino, incrustados de forma brutal pero experta en las heridas de este desdichado individuo, le impiden curarse."
 
 trait_custom_bloodline: "Línea de Sangre Personalizada"
 trait_custom_bloodline_character: "[ROOT.Char.GetDynasty.GetBaseNameNoTooltip]"
 trait_custom_bloodline_desc: "Joven Línea de Sangre de $pod_cainites$. Aunque la mayoría de los Vástagos no los reconocen como iguales, esta Línea de Sangre está dispuesta a demostrar a los demás que son los verdaderos gobernantes de la noche."
 trait_custom_bloodline_character_desc: "Joven Línea de Sangre de $pod_cainites$. Aunque la mayoría de los Vástagos no los reconocen como iguales, los [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] están dispuestos a demostrar a los demás que son los verdaderos gobernantes de la noche."
 
 trait_leading_front: "Lidera desde el Frente"
 trait_leading_front_desc: "Artemis Orthia dio ejemplo a todos los Ventrue: a veces, arremeter directamente contra tu enemigo puede resolver los problemas mejor que las Conjuras y la diplomacia"
 
 trait_hun_tactics: "Tácticas Salvajes"
 trait_hun_tactics_desc: "Matasunta dio ejemplo a todos los Gangrel: usar tu naturaleza feroz te ayudará a vencer"
 
 trait_swift_movement: "Movimiento Veloz"
 trait_swift_movement_desc: "Aníbal dio ejemplo a todos los Brujah: tienes que actuar rápido si quieres vencer"
 
 trait_samiel_follower: "Seguidor de Samiel"
 trait_samiel_follower_desc: "Samiel dio ejemplo a todos los Salubri: el mal debe ser aniquilado, incluso cuando las probabilidades no estén de tu lado, pues el mal prospera en el corazón que no le hace frente"
 
 trait_shadow_warrior: "Respetado y Temido"
 trait_shadow_warrior_desc: "Jamal dio ejemplo a todos los Banu Haqim: si temen tus hazañas antes de conocerte, la batalla ya está ganada"

 trait_faithful_warrior: "Guerrero Fiel"
 trait_faithful_warrior_desc: "Tarique dio ejemplo a todos los Nosferatu: luchar por una fe es una causa digna"
 
 trait_shadow_reconquista_warrior: "Guerra de Sombras"
 trait_shadow_reconquista_warrior_desc: "Silvester de Ruiz dio ejemplo a todos los Lasombra: a veces la guerra requiere astucia y engaño"
 
 trait_caitiff_warrior: "Guerrero Caitiff"
 trait_caitiff_warrior_desc: "Los Caitiff están solos en este mundo oscuro, por eso aprendieron a protegerse en las batallas"
 
 trait_salubri_caste: "Casta Salubri"
 
 trait_salubri_healer: "Sanador Salubri"
 trait_salubri_healer_desc: "Casta de sanadores, forma el grueso de la Línea de Sangre «normal»; su propósito es sanar y enseñar el [golconda|E]"
 
 trait_salubri_warrior: "Guerrero Salubri"
 trait_salubri_warrior_desc: "Casta de guerreros, fundada tras las Guerras Baali por Samiel. Los guerreros son errantes, siempre buscando el mal para destruirlo allá donde pueda crecer. Cada miembro de la casta guerrera recibe un nombre angélico tras un ritual de iniciación"
 
 trait_salubri_watcher: "Vigilante Salubri"
 trait_salubri_watcher_desc: "Casta de vigilantes, fundada durante los viajes de Saulot a Oriente. Eruditos y ladrones, los vigilantes actúan como protectores de los demás Salubri, defendiéndolos de quienes les negarían el derecho a existir y a ganarse la redención"
 
 trait_teachings: "Enseñanzas de Chandraputra"
 trait_teachings_desc: "Chandraputra dio ejemplo a todos los Ravnos: ser un buen general es mucho más útil que ser un buen guerrero"
 
 trait_orison_compass: "Brújula Moral"
 trait_orison_compass_desc: "Este personaje no puede pasar por alto el pecado, ni siquiera el suyo propio. Posee un sentido casi infalible de cuánto han transgredido contra Dios quienes lo rodean."
 
 trait_orison_innocent: "El Verdadero Inocente"
 trait_orison_innocent_desc: "Este personaje está inmaculado, un faro de la luz más pura en la oscuridad de nuestros tiempos."
 
 trait_orison_noah: "El Favor de Noé"
 trait_orison_noah_desc: "Este individuo posee una cualidad única que calma los corazones y el temperamento de todos los Animales de la naturaleza."
 
 trait_orison_vigilance: "Ojo de la Vigilancia"
 trait_orison_vigilance_desc: "Este personaje necesita dormir mucho menos que una persona corriente y despierta con más facilidad que los demás."
 
 trait_orison_penitent: "El Penitente"
 trait_orison_penitent_desc: "Con solo conocer su lugar en el plan de Dios, un hombre sencillo a menudo puede comprender más sobre el vasto mundo que el más poderoso de los reyes o el más erudito de los sabios."
 
 trait_orison_years: "Bendición de los Años"
 trait_orison_years_desc: "La mente de este personaje está dotada de una sabiduría que supera su edad y de una capacidad para comprender nuevos conceptos con bastante facilidad."
 
 trait_orison_hierophant: "El Hierofante"
 trait_orison_hierophant_desc: "Este personaje es un modelo de aplomo y Gracia bajo presión, incluso cuando camina bajo la sombra de la muerte."
 
 trait_orison_sanguine: "Himno Sanguíneo"
 trait_orison_sanguine_desc: "La fe de este personaje corre por su sangre, convirtiéndola en un veneno virulento para todo lo impío."
 
 trait_orison_talespinner: "Narrador de Historias"
 trait_orison_talespinner_desc: "Este individuo posee un celo natural y un entusiasmo contagioso por difundir la palabra de Dios."
 
 #trait_oculi_shepherd: "Heavenly Shepherd"
 #trait_oculi_shepherd_desc: "Allows the Eye of God to hide in plain sight as he does Heaven's work and to cloud the minds of those who would hamper his holy mission."
 
 #trait_oculi_sight: "Second Sight"
 #trait_oculi_sight_desc: "The Sight allows the Inquisitor to seek out supernatural creatures regardless of their efforts to foil being observed."
 
 #trait_oculi_liturgy: "Divine Liturgy"
 #trait_oculi_liturgy_desc: "By recitation of scripture the Eye of God may impose his dedication to the cause on another individual."
 
 #trait_oculi_trust: "I Trust in Thee"
 #trait_oculi_trust_desc: "By praising God, the agent may infuse others with love for Him and His laws."
 
 trait_oculi_wine: "Agua en Vino"
 trait_oculi_wine_desc: "El inquisidor puede tomar un objeto corriente y transformarlo en otra cosa, o devolver a su estado saludable un tejido muerto o moribundo."
 
 #trait_acre_catechumen: "Catechumen"
 #trait_acre_catechumen_desc: "Allows the inquisitor to exemplify his early lessons in valour, humility and constancy."
 
 #trait_acre_flesh: "Transfiguration of the Flesh"
 #trait_acre_flesh_desc: "The knight has been invested with the power to alter his physical capabilities by calling upon his unshakeable virtue."
 
 #trait_acre_flight: "Flight of Angels"
 #trait_acre_flight_desc: "Allows the inquisitor to reap the divine whirlwind when in combat with the minions of Adversary."
 
 #trait_acre_resurrection: "Spirit of the Resurrection"
 #trait_acre_resurrection_desc: "Some knights are divinely invested with the power to control the ebb and flow of life force within themselves and others."
 
 trait_acre_auto: "Auto de Fe"
 trait_acre_auto_desc: "Una de las razones principales por las que los esbirros del Adversario temen a los Caballeros de Dios, esta bendición permite al Inquisidor concentrar su virtud y su fuerza en lo que sin duda será el golpe decisivo de cualquier duelo."
 
 trait_murnau_knowledge: "Conocimiento Prohibido"
 trait_murnau_knowledge_desc: "La familia Von Murnau ha sido plagada (o bendecida) con una familiaridad innata y una capacidad para percibir todo tipo de corrupción, transmitida de Generación en Generación."
 
 #trait_murnau_oblige: "Noblesse Oblige"
 #trait_murnau_oblige_desc: "Nobility that inspires others."
 
 #trait_murnau_wreathed: "Wreathed in Shadows"
 #trait_murnau_wreathed_desc: "Mastery of the dark side of the Murnau's own nature that lets them affect it in others."
 
 #trait_murnau_mirror: "Mirror of Evil"
 #trait_murnau_mirror_desc: "Ability to meet the supernatural opposition on even ground, armed with strength and knowledge."
 
 trait_murnau_arcana: "Arcanos"
 trait_murnau_arcana_desc: "La capacidad de obstaculizar, desviar o evitar las acciones de la progenie infernal. Esta capacidad a menudo tiene un precio para el alma del Inquisidor, pero le permite reflejar los poderes sobrenaturales de vuelta contra quien los usa."
 
 #trait_sisters_gospel: "Gospel"
 #trait_sisters_gospel_desc: "Grants the Sisters great skill at debate, oration and, if necessary, interrogation."
 
 #trait_sisters_lux: "Fiat Lux"
 #trait_sisters_lux_desc: "Echoing the words of the Father, the inquisitor declaims 'Let there be light!' and a soft nimbus of white light appears around her, illuminating supernatural creatures for what they are."
 
 #trait_sisters_chorale: "Chorale"
 #trait_sisters_chorale_desc: "Drawing strength, knowledge or protection from a communal chant."
 
 #trait_sisters_hosanna: "Hosanna"
 #trait_sisters_hosanna_desc: "Inquisitors use this power to capture the spiritual "wavelength" of the Song of Heaven, using its power to further the Glory of God."
 
 trait_sisters_oratorio: "Oratorio"
 trait_sisters_oratorio_desc: "Permite a la Hermana alzar su voz en un canto y llenar a los oyentes con el brillante resplandor de su fe, una experiencia devastadora para los esclavos del pecado."
 
 #trait_red_vigil: "Blessed Vigilance"
 #trait_red_vigil_desc: "This rite provides the subject with energy relieving them of need for sleep or rest."
 
 #trait_red_sunstone: "Sunstone"
 #trait_red_sunstone_desc: "Infuse an ordinary rock with the blessing of the Lord's first creation, the Sun. The brightness of the stone is then commanded by the virtue of its bearer."
 
 #trait_red_march: "Forced March"
 #trait_red_march_desc: "This rite allows for swift travel regardless of fatigue and difficult conditions after sufficient supplication before God."
 
 #trait_red_fortunes: "Fortunes of War"
 #trait_red_fortunes_desc: "Through this hallowed rite, a practitioner can bless a group of armed combatants on their way to fight the foe."
 
 trait_red_forge: "Forja de Dios"
 trait_red_forge_desc: "Santifica el proceso de forjar un arma para producir armamento bendito."
 
 trait_yinyang: "Yin Yang"
 
 trait_yin_imbalanced: "Yin"
 trait_yin_imbalanced_desc: "Eres una criatura de sombras y muerte."
 
 trait_yinyang_balanced: "Equilibrado"
 trait_yinyang_balanced_desc: "Armonizas los elementos divididos de tu Chi."
 
 trait_yang_imbalanced: "Yang"
 trait_yang_imbalanced_desc: "Te vuelves hacia la luz y la vida."
 
 trait_dharma: "Dharma"
 trait_dharma_player_desc: "#medium #V [ROOT.Char.GetFirstNamePossessiveNoTooltip]#! [Glossary('Dharma','podgloss.dharma')] es [ROOT.Char.GetFaith.GetName].#!\n\n#medium;italic #V Ganas#! [Glossary('Dharma','podgloss.dharma')] [trait_level_track_xp|E] de estas fuentes:#!\n[GetPlayer.MakeScope.GetScriptValueDesc('POD_kueijin_dharma_xp_active_loca')]\n\n#medium;italic #V También ganas#! [Glossary('Dharma','podgloss.dharma')] [trait_level_track_xp|E] #V pasiva#! cada #V 2#! años:#!\nExperiencia pasiva: #TOOLTIP:trait_track_dharma_desc_in_game_tt #L;P +[GetPlayer.MakeScope.ScriptValue('POD_kueijin_dharma_xp_passive')|2]#! #L (ver información)#!#!\n#TOOLTIP:trait_track_dharma_desc_insight_passive #L Todas las posibles fuentes de experiencia pasiva (ver información)#!#!"
 trait_track_dharma_desc: "La Perspicacia es una medida de cuán cerca estás de avanzar en tu [Glossary('Dharma','podgloss.dharma')]. Cuando la [trait_level_track_xp|E] alcanza el primer nivel, tu nivel de dharma aumenta, con la excepción del dharma 10."
