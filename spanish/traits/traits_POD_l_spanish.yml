 trait_vampire_leper: "Leproso Vampírico"
 trait_vampire_ill: "Enfermo Vampírico"
 
 trait_akuma: "Akuma"
 trait_akuma_desc: "Los Akuma, o Devorados por el Diablo, son individuos que han abandonado la virtud y han unido su destino al de los [Glossary('Reyes Yama','podgloss.yamaking')]. Véase también [akuma|E]"
 
 trait_mummy: "Momia"
 trait_mummy_desc: "Las Momias, también llamadas las Imperecederas o Renacidas, son inmortales cuyos cuerpos han sido preservados ritualmente."
 trait_track_mummy: "Recuerdos"
 trait_track_mummy_desc: "Para ganar recuerdos, debes estar en tu [POD_homeland|E] o construir [domicile_buildings|E] específicos"
 
 trait_shemsuheru: "Shemsu-Heru"
 trait_shemsuheru_desc: "Tiene que haber una primera, y entre los Inmortales ese honor se otorga a los Shemsu-Heru, los amigos o Compañeros de Horus. Creados por Isis y su hermana, originalmente para seguir y servir a su hijo Horus, son las Imperecederas más antiguas del mundo."
 trait_banemummy: "Momia de Perdición"
 trait_banemummy_desc: "Las Momias Bane, también llamadas Apepnu, son burlas impías de las Momias, alzadas con el Hechizo de Vida de Set, pero su comprensión era incompleta y el hechizo quedó corrompido."
 trait_cabiri: "Cabiri"
 trait_cabiri_desc: "Los Cabiri son una Dinastía de Inmortales que no se originan en Egipto, sino en Grecia, y que tienen poca o ninguna conexión con la Contienda entre $glossary_wyrm_apophis$ y el Ma'at."

 trait_wutian: "Wu T'ian"
 trait_wutian_desc: "Los Wu T'ian, la Familia del Cielo, fueron discípulos de grandes sabios, y recibieron el elixir de la vida eterna de los Ocho Inmortales a cambio de su servicio eterno al Tao."
 trait_wukuei: "Wu Kuei"
 trait_wukuei_desc: "Los Wu Kuei, la Familia de los Demonios, son los inmortales del [UmbraGlossaryLocalized('yomi_wan','Infierno de Yomi')], Wu T'ian renegados que vendieron sus almas al infierno para asegurarse la supervivencia ante el amanecer de la [Glossary('Sexta Era','game_concept_sixth_age_desc')]."
 
 trait_asekh_sen: "Asekh-Sen"
 trait_asekh_sen_desc: "No son inmortales plenos; estos seres suelen parecer cadáveres tambaleantes poseídos por un Bane que llena al ser reanimado de un odio hirviente hacia toda forma de vida."
 
 trait_integrity: "Integridad"
 trait_integrity_desc: "La Integridad es una medida general de cuán bien se alinea una Momia con los deseos de sus jueces. Las Momias con baja Integridad pueden ser juzgadas con gran severidad (o algo peor) cuando entran en el [UmbraGlossary('shadowlands')] para prepararse para su siguiente vida."
 trait_track_integrity: "Integridad"
 trait_track_integrity_desc: "#medium La Integridad es un sistema de tipo virtud.\n\n#bold Ganas Integridad por:#!\n$BULLET_WITH_TAB$Matar con un motivo válido: #P +1#!\n$BULLET_WITH_TAB$Hacer regalos: #P +2#!\n$BULLET_WITH_TAB$Sanar: #P +3#!\n\n#bold Pierdes Integridad por:#!\n$BULLET_WITH_TAB$Matar sin un motivo válido: #N -3#!\n$BULLET_WITH_TAB$Cometer un acto atroz (p. ej. tortura): #N -2#!\n$BULLET_WITH_TAB$Cometer un robo: #N -1#!#!"
 

 trait_automaton: "Autómata"
 trait_automaton_desc: "Un cuerpo humanoide artificial."
 trait_effigy: "Efigie"
 trait_effigy_desc: "Pequeñas figurillas a las que se pueden encomendar Misiones sencillas."
 trait_animantis: "Animantis"
 trait_animantis_desc: "Un gólem, un sirviente mecánico que servirá al Nocker y le ayudará en su trabajo."
 trait_servitor: "Servidor"
 trait_servitor_desc: "Un Earthbound puede crear un recipiente móvil para sí mismo, llenando un objeto especialmente preparado con su propia corrupción y transformándolo en un anfitrión poderoso y longevo."
 trait_manifestation: "Manifestación"
 trait_manifestation_desc: "Horrendas parodias de la forma humana. Algunos ejemplos son rostros que se coagulan a partir de un charco de sangre, brazos hechos de langostas o una lengua formada por gusanos. La forma es físicamente independiente del Haunter, y no posee control motor fino. Por otro lado, las manifestaciones creadas son tan fuertes como el Haunter que las creó, y responden a órdenes simples como agitarse, morder, convulsionar, etc."
 trait_golem: "Gólem"
 trait_golem_desc: "Los Gólems son grandes autómatas humanoides creados mediante hechicería, conocidos por su inestabilidad y su tendencia a enloquecer."

 trait_mindless_clone: "Réplica"
 trait_mindless_clone_desc: "Un facsímil de otro ser, animado mediante alguna forma de magia. No puede actuar de forma independiente."
 trait_shadow_twin: "Gemelo de sombra"
 trait_mirror_duplicate: "Duplicado de espejo"
 trait_shadowy_duplicate: "Duplicado Sombrío"
 trait_phantom_shadow: "Sombra Fantasma"
 trait_separated_khaibit: "Khaibit separado"
 trait_separated_shadow: "Sombra Separada"
 trait_shadow_self: "Sombra del yo"
 
 trait_risen: "Resucitado"
 trait_risen_desc: "Resucitado es un término usado para describir a un wraith que ha logrado regresar a su cuerpo para caminar entre los vivos en las [Glossary('Tierras de Piel','game_concept_skinlands_desc')]."
 TRAIT_FLAG_DESC_cannot_resolve_fetters: "No puede resolver [Fetters|E]"

 trait_spectre: "Espectro"
 trait_spectre_desc: "Los Espectros son wraiths que han sucumbido a sus Sombras. Cuando un espíritu acumula demasiada emoción oscura, su Sombra toma el control de forma permanente y se convierte en un Espectro."
 trait_track_spectre: "Casta"
 trait_track_spectre_desc: "Los Espectros wraith tienen un orden jerárquico bien definido. Los Mortwight y los Haint son las más bajas de las castas funcionales de Espectros, ya que entraron al servicio del [UmbraGlossary('oblivion')] directamente desde las [Glossary('Tierras de Piel','game_concept_skinlands_desc')], y han sido los menos tocados por su resplandor. Los Doppelganger vienen después en la jerarquía, habiendo superado las pruebas de su Psique y triunfado gracias a su devoción al [UmbraGlossary('oblivion')]; sin embargo, en este punto aún no muestran sus marcas en el cuerpo. Los Shade y las Apparition ocupan un rango superior, pues en ellos las marcas del [UmbraGlossary('oblivion')] ya han comenzado a manifestarse. Los Nephwrack vienen a continuación, porque su constante exposición al [UmbraGlossary('oblivion')] los ha transformado hasta el punto de que el Moliate ya no puede ocultar su naturaleza. Los Onceborn y los Hekatonkhire son las castas más altas que puede alcanzar cualquier Espectro que una vez fue humano; aunque devotos a la causa del [UmbraGlossary('oblivion')], en su día vivieron. En la cúspide misma del sistema se encuentran los Neverborn, que se arrastraron desde el propio [UmbraGlossary('oblivion')] en tiempos remotos. Los Stripling son únicos, pues existen fuera del sistema de castas y sirven en casi todos los niveles del [UmbraGlossary('oblivion')]."
 trait_stripling: "Stripling"
 trait_stripling_desc: "Los Stripling, también llamados los Nunca Vividos, son un tipo de Espectro formado por quienes pasaron a las [UmbraGlossary('shadowlands')] siendo niños y acabaron dominados por su Sombra. Como otros Espectros, los Stripling pertenecen a una de las castas Espectrales, determinada por su proximidad al [UmbraGlossary('oblivion')], pero como no les atrae la sociedad Espectral establecida, forman sus propios grupos independientes de ella."
 trait_neverborn: "Neverborn"
 trait_neverborn_desc: "Neverborn es el nombre que reciben los antiguos Malfean que dormían en las profundidades del [UmbraGlossary('pod_realm_labyrinth')]. También se les llama «Primordiales», «Nunca Muertos» y «Grotescos»."
 trait_hekatonkhire: "Hekatonkhire"
 trait_hekatonkhire_desc: "Los Hekatonkhire son una antigua estirpe de Espectros, usados principalmente por los Malfean como tanques y arietes en batallas contra Espectros enemigos. Se cree que son aspirantes a Onceborn que perdieron la razón ante el poder del [UmbraGlossary('oblivion')] y se convirtieron en poco más que brutos masivos y deformes, capaces de atacar a varios adversarios a la vez."
 trait_onceborn: "Onceborn"
 trait_onceborn_desc: "Onceborn es el nombre que reciben los Malfean que una vez fueron humanos. También se les llama Oncelived, Conspiradores y Cabalistas."
 trait_nephwrack: "Nephwrack"
 trait_nephwrack_desc: "Los Nephwrack han existido durante eras, y su constante exposición al [UmbraGlossary('oblivion')] los ha hecho abandonar sus formas humanas y volverse retorcidos y deformes. Muchos sirven a los intereses de un amo Malfean como su presencia visible."
 trait_shade: "Shade"
 trait_shade_desc: "Entre los más poderosos de los Espectros, los Shade son antiguos wraiths que fueron arrojados a la [UmbraGlossary('tempest')], quedaron atrapados en un Maelstrom o Gran Maelstrom, o se perdieron a sí mismos durante un Harrowing. El [UmbraGlossary('oblivion')] destruye por completo sus frágiles Psiques y solo quedan sus Sombras, llenas de odio y Pasiones Oscuras, con el control permanente. Su método de creación da origen a su apodo, los Hijos del [UmbraGlossary('oblivion')]."
 trait_apparition: "Aparición"
 trait_apparition_desc: "Las Apparition son, a falta de un término mejor, los mandos intermedios de los Espectros: Doppelganger y Mortwight que han comenzado a evolucionar hacia Nephwrack. Como resultado, resulta difícil vislumbrar a la persona que una vez fueron tras la mutación inducida por el [UmbraGlossary('oblivion')]. Dado que esa persona desapareció hace mucho, el [Corpus|E] refleja el ser actual."
 trait_doppelganger: "Doppelganger"
 trait_doppelganger_desc: "Los Doppelganger, también conocidos como los Devorados por la Sombra, se parecen mucho a los wraiths normales, salvo por ser más pálidos y delgados. Las Marcas de la Muerte a menudo desfiguran sus cuerpos, aunque el uso de Moliate puede ocultarlo. El único indicio infalible es que su Sombra siempre es visible en sus ojos de alguna manera."
 trait_mortwight: "Mortwight"
 trait_mortwight_desc: "Los Mortwight son los espíritus de quienes murieron de forma extremadamente violenta. Su Furia y su ira hacia su propia muerte hacen que despierten en las [UmbraGlossary('shadowlands')] directamente como Espectros, sin existir nunca como fantasmas. Muchos Mortwight tenían naturalezas oscuras desde el principio, y algunos creen que estaban destinados a convertirse en Espectros desde el nacimiento."
 trait_haint: "Haint"
 trait_haint_desc: "Los Haint entran en las [UmbraGlossary('shadowlands')] con sus Sombras al mando, de forma similar a los Mortwight. A diferencia de los Mortwight, los Haint se definen no por su muerte, sino por su vida. Antes de morir, se habían visto reducidos a un Estilo de vida casi inhumano mientras aún estaban entre los Vivos."
 
 trait_dhampyr: "Dhampyr"
 trait_dhampyr_desc: "Los Dhampyr, también llamados Caminantes del Crepúsculo o Hijos del Ocaso, son los (poco frecuentes) hijos de los [GetTrait('kueijin').GetName( GetNullCharacter )]. Bendecidos con largas vidas y una suerte asombrosa, se ven sin embargo lastrados por su constante estado de semimuerte y por las expectativas de servicio que sus progenitores $pod_kueijin$ depositan en ellos."
 trait_golden_children: "Hijo Dorado"
 trait_golden_children_desc: "Los Hijos Dorados (o Jin Hai) fueron en su día los hijos espiritualmente bendecidos de los Diez Mil Guerreros de la leyenda. Mortales, fueron héroes del pueblo hasta que sus corruptos progenitores $pod_kueijin$ los masacraron y los redujeron al estado de dhampyr."
    
 trait_arcanos_argos: "Argos"
 trait_arcanos_argos_desc: "Quienes usan Argos pueden manipular, navegar y viajar a través de la [UmbraGlossary('tempest')]." 
 
 trait_arcanos_castigate: "Castigate"
 trait_arcanos_castigate_desc: "Los usuarios de Castigate pueden manipular y controlar la Sombra de un espectro." 
 
 trait_arcanos_embody: "Embody"
 trait_arcanos_embody_desc: "Aquellos que usan Embody pueden manifestarse en el mundo físico y, bajo las circunstancias adecuadas, aparecer como una persona viva."
 
 trait_arcanos_fatalism: "Fatalism"
 trait_arcanos_fatalism_desc: "Aquellos con el don del Fatalismo pueden ver el pasado o el futuro de otro y leer el Destino último de un espectro."

 trait_arcanos_flux: "Flux"
 trait_arcanos_flux_desc: "Flux afecta a la estructura y la reacción de la materia en las [Glossary('Tierras de Piel','game_concept_skinlands_desc')], y también afecta al funcionamiento de las reliquias de los wraiths."

 trait_arcanos_inhabit: "Inhabit"
 trait_arcanos_inhabit_desc: "Los espectros dotados con Inhabit pueden manipular y controlar objetos inanimados."

 trait_arcanos_intimation: "Intimation"
 trait_arcanos_intimation_desc: "Los usuarios de Intimation pueden modificar los deseos y anhelos de otros espectros."

 trait_arcanos_keening: "El Lamento"
 trait_arcanos_keening_desc: "Aquellos que pueden usar las artes de Keening pueden manipular emociones a través del sonido."

 trait_arcanos_lifeweb: "Lifeweb"
 trait_arcanos_lifeweb_desc: "Los wraiths que conocen Lifeweb pueden usarlo para fortalecer, debilitar o vigilar las [Fetters|E]."

 trait_arcanos_mnemosynis: "Mnemosynis"
 trait_arcanos_mnemosynis_desc: "Los usuarios de Mnemosynis pueden rastrear y leer los recuerdos de otros."

 trait_arcanos_moliate: "Moliate"
 trait_arcanos_moliate_desc: "Quienes usan Moliate son capaces de remodelar su propio [Corpus|E], y el [Corpus|E] de otros, en formas fascinantes y a veces aterradoras."

 trait_arcanos_outrage: "Outrage"
 trait_arcanos_outrage_desc: "Outrage afecta a las [Glossary('Tierras de Piel','game_concept_skinlands_desc')] manifestando la voluntad de un wraith en forma de una fuerza poderosa."

 trait_arcanos_pandemonium: "Pandemonium"
 trait_arcanos_pandemonium_desc: "Los espectros que usan este Arcanoi pueden utilizar los poderes del caos para crear estragos en el mundo de los vivos."

 trait_arcanos_phantasm: "Fantasma"
 trait_arcanos_phantasm_desc: "Aquellos que usan las habilidades de Phantasm pueden manipular sueños y crear ilusiones."

 trait_arcanos_puppetry: "Puppetry"
 trait_arcanos_puppetry_desc: "Aquellos que dominan Puppetry pueden controlar los cuerpos de los Rápidos."

 trait_arcanos_usury: "Usury"
 trait_arcanos_usury_desc: "Aquellos que dominan Usury pueden comerciar con las mismas fuerzas de las que se alimentan los espectros."

 trait_arcanos_kinesis: "Kinesis"
 trait_arcanos_kinesis_desc: "Los wraiths dotados de Kinesis pueden manipular y controlar objetos inanimados."

 trait_barghest: "Barghest"
 trait_barghest_desc: "Los Barghest, también llamados sabuesos de sangre, son wraiths que han sido transformados en formas monstruosas y «lobotomizados» mediante el injerto de un bozal especialmente preparado de hierro estigio en su [Corpus|E]."
 trait_ferryman: "Barquero"
 trait_ferryman_desc: "Mediante el Ritual de Separación, la Sombra y la Psique de este personaje quedan separadas permanentemente, creando un Pasiphae."
 TRAIT_FLAG_DESC_lose_shadow: "Ya no posee una sombra"
 TRAIT_FLAG_DESC_restore_possibility_to_reduce_stress_normal_way: "Puede reducir el estrés de forma normal, ya no está atado por las pasiones"
 TRAIT_FLAG_DESC_cannot_access_skinlands: "Pierde toda capacidad de acceder a las [Glossary('Tierras de Piel','game_concept_skinlands_desc')]"
 trait_shadow: "Sombra"
 trait_shadow_desc: "Sombra es un término usado para describir el aspecto de la personalidad de un wraith que desea verlo fracasar, dejar de luchar y sucumbir al [UmbraGlossary('oblivion')]."
 TRAIT_FLAG_DESC_deteriorating_fetters: "Cada año, el nivel de una [Fetter|E] aleatoria disminuye en #N 1#!"
 trait_pasiphae: "Pasífae"
 trait_pasiphae_desc: "Los Pasiphae, los llamados Barqueros del [UmbraGlossary('oblivion')] o Caminantes del [UmbraGlossary('pod_realm_labyrinth')], a menudo son confundidos con los generales de los Devorados por la Sombra por Helldiver ignorantes y los pocos wraiths temerarios que se aventuran en el [UmbraGlossary('pod_realm_labyrinth')]."
 trait_khaibit: "Khaibit"
 trait_khaibit_desc: "Un Khaibit separado de una momia para usarlo como sirviente similar a un espectro."
 trait_po: "P'o"
 trait_po_desc: "La parte del alma relacionada con los aspectos físicos de la existencia; a menudo denominada el lado «animal» del alma."
 trait_kuei: "Kuei"
 trait_kuei_desc: "Un Kuei es un wraith del [UmbraGlossary('dark_kingdom_of_jade')] que no ha sido enterrado con los ritos y Tradiciones adecuados de la zona. Se convierten, a falta de un término mejor, en Sombras andantes. Estos wraiths son sumamente peligrosos y vagan sin rumbo por las [UmbraGlossary('shadowlands')], cazando Pathos como un animal hambriento caza comida."
 

 
 trait_psychic: "Psíquico"
 trait_psychic_desc: "Este personaje posee uno o más poderes psíquicos (también denominados fenómenos psíquicos o simplemente habilidades psíquicas)."
 trait_track_psychic: "Competencia Psíquica"
 trait_track_psychic_desc: "#bold Cada nivel aumenta la probabilidad de éxito de los poderes psíquicos en #P 10#!#!\nUsar poderes psíquicos es difícil, especialmente contra seres sobrenaturales. Pero como todo en la vida, la competencia en poderes psíquicos también se puede alcanzar dominando lo básico y con la experiencia."
 trait_sorcerer: "Hechicero"
 trait_sorceress: "Hechicera"
 trait_rune_wise: "Mago Rúnico"
 trait_sorcerer_desc: "Este personaje usa los Caminos lineales de la magia rústica.\nLos hechiceros trabajan dentro de los límites de las reglas de la realidad para lograr grandes cosas, pero aún están muy lejos de los Magos, esos obradores de voluntad capaces de moldear la realidad misma."
 trait_theurgist: "Teúrgo"
 trait_theurgist_desc: "Este personaje practica una rama específica de la hechicería basada en el misticismo judío o en las enseñanzas del cristianismo esotérico."
 
 trait_fallen: "Caído"
 trait_fallen_desc: "Son ángeles caídos que eligieron ponerse del lado de Lucifer y de la humanidad en lugar de Dios en los primeros días de la Creación. Como castigo por su rebelión y deslealtad, el Arcángel Miguel expulsó a estos ángeles del Cielo hacia el Abismo. Los muros del Abismo se agrietaron, y los Caídos comenzaron a escapar de vuelta al mundo material."
 trait_earthbound: "Earthbound"
 trait_earthbound_desc: "Los Demonios son la caída Hueste de los Cielos, los Ángeles rebeldes que siguieron a Lucifer en su condenada rebelión. Al no poder ya sostener su verdadera forma, los Demonios Earthbound se encuentran en su mayoría contenidos en relicarios, mientras que unos pocos logran poseer un lugar."
 TRAIT_FLAG_DESC_host_for_travel: "No puede viajar ni liderar ejércitos a menos que también esté poseyendo a un anfitrión humano con el [GetPerk('abandon_vessel_perk').GetName(GetNullCharacter)]"
 trait_laham: "Laham"
 trait_laham_desc: "Descendencia de un demonio. De una longevidad asombrosa, insensibles al dolor, y a menudo dotados de poderes inhumanos. Se dice que un engendro de demonio (o laham) es un siervo especial del Infierno."
 trait_nephilim: "Nephilim"
 trait_nephilim_desc: "Descendencia de un demonio y un humano. Poseen los dones del hombre y los Saberes de los demonios, y resultan terribles de contemplar; si no por su horrendo semblante, entonces por su potencial."

 trait_truepossessed: "Poseído"
 trait_fomori: "Fomor"
 trait_bakemono: "Bakemono"
 trait_fomori_desc: "Este personaje ha sido poseído por un espíritu Bane."
 trait_drone: "Drone"
 trait_drone_desc: "Este personaje ha sido poseído por un espíritu de la $glossary_weaver$."
 trait_gorgon: "Gorgona"
 trait_gorgon_desc: "Este personaje ha sido poseído por un espíritu del $glossary_wyld$."
 trait_kami: "Kami"
 trait_kami_desc: "Este personaje ha sido tocado por la mismísima Gaia."
 
 trait_methuselahs_thirst: "La Sed del Matusalén"
 trait_methuselahs_thirst_desc: "El personaje ya no es capaz de beber sangre mortal para sustentarse, independientemente de su Potencia de Sangre. Debe alimentarse del $pod_vitae$ de otros Vástagos."
 trait_methuselahs_thirst_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ya no es capaz de beber sangre mortal para sustentarse, independientemente de su Potencia de Sangre. Debe alimentarse del $pod_vitae$ de otros Vástagos."

 trait_hun_and_po: "Hun y P'o"
 trait_hun_and_po_desc: "Se rumorea que uno o más Salubri en realidad despertaron su Hun y su Po para convertirse en [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] de pleno derecho... aunque esto es cuestionado y ampliamente ridiculizado por los propios $pod_kueijin$.\nSi resultara ser cierto, sin embargo, podría existir una forma de que los $pod_cainites$ aprendan los poderes de sus primos orientales."

 TRAIT_FLAG_DESC_immortality: "#P @goodhealth_icon!Inmortal#!"
 TRAIT_FLAG_DESC_cannot_heal_naturally: "#N @neardeath_icon!No puede curarse de forma natural#!"
 TRAIT_FLAG_DESC_torpor_heal: "Cada 2 años, convierte [POD_aggravated_damage|E] en [POD_superficial_damage|E] o cura [POD_superficial_damage|E]"
 

 
 TRAIT_FLAG_DESC_yin_imbalanced: "Te permite devorar más Chi Yin del límite de la Virtud Yin sin efectos negativos"
 TRAIT_FLAG_DESC_yang_imbalanced: "Te permite devorar más Chi Yang del límite de la Virtud Yang sin efectos negativos"
 
 trait_permanent_maimed: "Mutilado Permanente"
 trait_permanent_one_eyed: "Tuerto Permanente"
 trait_permanent_one_legged: "Cojo Permanente"
 trait_permanent_disfigured: "Desfigurado Permanente"
 trait_permanent_scarred: "Marcado Permanente"
 trait_permanent_eunuch: "Eunuco Permanente"
 trait_permanent_blind: "Ciego Permanente"

 trait_dhampir: "Dhampir"
 trait_dhampir_desc: "Dhampir es un término usado para describir a un «semivampiro», producto de la unión de un humano y un vampiro."
 
 trait_anathema: "Anatema"
 trait_anathema_desc: "Los Anatema son vampiros u otros seres sujetos a una Caza de Sangre. El término a veces se usa específicamente para referirse a los trece Anatema «más buscados» que forman la Lista Roja."
 trait_anathema_character_desc: "Los Anatema son vampiros u otros seres sujetos a una [blood_hunt|E]. El término a veces se usa específicamente para referirse a los trece Anatema «más buscados» que forman la Lista Roja."
 
 TRAIT_FLAG_DESC_anathema_trait_flag: "Puede ser objetivo de una [blood_hunt|E]"
 
 trait_forever_infamous: "#N;bold Infame para Siempre#!"
 trait_forever_infamous_desc: "Este personaje nunca podrá volver a descansar tranquilo, sabiendo que todo el mundo sobrenatural lo quiere muerto."
 trait_forever_infamous_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] nunca podrá volver a descansar tranquilo, sabiendo que todo el mundo sobrenatural lo quiere muerto."
 
 TRAIT_FLAG_DESC_permanent_masquerade5: "Permanentemente atrapado en [GetModifier('masquerade5_modifier').GetNameWithTooltip]"
 
 trait_forever_indomitable: "#P;bold Indomable para Siempre#!"
 trait_forever_indomitable_desc: "Este personaje se ha redimido a ojos del mundo sobrenatural al destruir la Inquisición... después de haberla provocado."
 trait_forever_indomitable_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] se ha redimido a ojos del mundo sobrenatural al destruir la Inquisición... después de haberla provocado."

 trait_golconda: "Golconda"
 trait_golconda_desc: "Este personaje ha alcanzado la paz interior tras [Concept('golconda','iluminarse')] sobre la verdadera naturaleza de [Glossary('La Bestia','game_concept_beast_desc')]."
 trait_golconda_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ha alcanzado la paz interior tras [Concept('golconda','iluminarse')] sobre la verdadera naturaleza de [Glossary('La Bestia','game_concept_beast_desc')]."

 trait_golconda_seeker: "Buscador de Golconda"
 trait_golconda_seeker_desc: "Este personaje se encuentra en el largo camino hacia la [enlightenment|E]."
 trait_golconda_seeker_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] se encuentra en el largo camino hacia la [enlightenment|E]."
 trait_track_golconda_seeker: "Perspicacia"
 trait_track_golconda_seeker_desc: "\nTu [trait_level_track_xp|E] representa el porcentaje de éxito durante las etapas finales del [journey|E] de [GetTrait('golconda').GetName(GetNullCharacter)].\n\n#X Todo el progreso se pierde al entrar en Frenesí, o al cometer un asesinato o un robo.#!"

 TRAIT_FLAG_DESC_elder_perk_flag: "@vampire_icon!Puede aprender [elder_perks|E] independientemente de su [Glossary('Generación','game_concept_vampgeneration_desc')]"
 TRAIT_FLAG_DESC_hungerless_flag: "[Concept('hungerless','No longer affected by hunger for blood')|E]"
 TRAIT_FLAG_DESC_immune_to_frenzy_flag: "Nunca entrará en [Glossary('Frenesí','game_concept_beast_desc')]"
 TRAIT_FLAG_DESC_perks_for_piety_flag: "Puede intercambiar [piety|E] por [perks|E] de [resonance|E]"
 TRAIT_FLAG_DESC_humanity_feast_flag: "Puede organizar #TOOLTIP:ACTIVITY_TYPE,activity_feast #L Banquetes#!#! y ganar [piety|E] por ello"
 TRAIT_FLAG_DESC_golconda_mentoring_flag: "Puede guiar a otros en el camino hacia el [golconda|E]"
 TRAIT_FLAG_DESC_warning_golconda_flag: "\n#X Este rasgo se pierde al cometer un asesinato o un robo#!"
 TRAIT_FLAG_DESC_warning_golconda_seeker_flag: "\n#X Se pierde toda la [trait_level_track_xp|E] al entrar en Frenesí, o al cometer un asesinato o un robo#!"
 
 trait_alien: "Alienígena"
 trait_alien_desc: "Vida extraterrestre."
 trait_chulorviah: "Chulorviah"
 trait_chulorviah_desc: "Los Chulorviah, también conocidos como la Cepa Abisal o los Nacidos del Kraken, son extrañas criaturas umbrales que actúan de forma similar a una enfermedad."

 trait_crimson_fever: "Fiebre carmesí"
 trait_crimson_fever_desc: "Una enfermedad sobrenatural que se manifiesta en los Catayanos cuyos aspectos Yang se han desequilibrado. Aunque es una enfermedad bastante rara, se rumorea que es extremadamente contagiosa. Su rareza también implica que nunca se han explorado realmente posibles curas, lo que la convierte en una perspectiva temible de afrontar."
 trait_chulorviosis: "Chulorviosis"
 trait_chulorviosis_desc: "Una extraña enfermedad que afecta tanto a cefalópodos como a humanos. La enfermedad es puramente espiritual; las autopsias de cadáveres de Chulorviah que han llegado a la costa no han arrojado ninguna información sobre ellos. El virus transforma a humanos y cefalópodos para que se parezcan más los unos a los otros: un humano podría desarrollar un pico, piel moteada y ventosas, mientras que un pulpo podría desarrollar uñas vestigiales o cambiar el color de sus ojos.\n\nEl intelecto humano cede paso al instinto, mientras que los cefalópodos se vuelven más conscientes y malévolos. La transformación puede tardar meses en consolidarse, pero resulta casi ineludible una vez que ha comenzado. Tras aproximadamente seis meses, los humanos huyen de la superficie para unirse a los de su nueva especie bajo el mar. Antes de alcanzar ese estado, la mayoría de los Chulorviah buscan infectar al mayor número posible de personas."
 trait_gift_of_melancholia: "Don de la melancolía"
 trait_gift_of_melancholia_desc: "Una terrible enfermedad consuntiva que afecta tanto a mortales como a Cainitas, y que provoca mareos, debilidad, malestar y náuseas."
 trait_flaying_plague: "Plaga desolladora"
 trait_flaying_plague_desc: "Una terrible plaga que afecta tanto a la Parentela como a los Garou. Al principio parece una extraña variante de la tisis, después aparecen las llagas, y por último la piel se desprende de los huesos entre agonías."
 trait_scourge: "Azote"
 trait_scourge_desc: "El Azote es una plaga específica de los vampiros que infecta la Sangre. Esta enfermedad es una cepa mutada de lepra cruzada con la peste bubónica que ataca directamente el $pod_vitae$ del vampiro. Una vez infectada, la víctima debe gastar más sangre cada vez que consume $pod_vitae$. Esto empeora con cada noche que la víctima sufre el Azote. En algunos casos, la víctima también padece una dolencia desfigurante que afecta a su apariencia, pero que no pone en peligro su vida."
 trait_track_scourge: "Gravedad"
 trait_track_scourge_desc: "Gravedad del Azote"
 trait_entoban_plague: "Plaga entobánica"
 trait_entoban_plague_desc: "Una antigua y mortal enfermedad ha traspasado las salvaguardas que la contenían en África."

