l_spanish:
 trait_use_ingame_chargen: "Usar el creador de personajes del juego"
 trait_use_ingame_chargen_desc: "Recomendado para jugadores nuevos.\n\nAl entrar en la partida, pasarás por una serie de eventos en los que podrás elegir un [splat|E], y todos los rasgos y modificadores sobrenaturales necesarios se configurarán automáticamente."

 trait_unusual: "Inusual"
 trait_unusual_desc: "Hay algo extraño en esta persona."

 trait_vampire: "Vampiro"
 trait_vampire_desc: "Este personaje es uno de los no-muertos."
 
 trait_diablerist: "Diablerista"
 trait_diablerist_desc: "Este personaje ha cometido $pod_diablerie$ al consumir la sangre del corazón de otro vampiro, devorando su alma."
 
 #trait_cultist: "Demonic Cultist"
 #trait_cultist_desc: "This character has made a pact with a demonic power for infernal investments."
 
 trait_infernalist: "Infernalista"
#trait_infernalist_desc: "This character has thrown their lot in with dark gods, demons, creatures from the outer void and God only knows what else."
 trait_infernalist_desc: "Este personaje ha contactado con $POD_splat_demon_plural$ para obtener sus poderes de [investiture_lifestyle|E]. Una práctica vil que mancha el alma, considerada malvada incluso según los estándares del $pod_wod$."
 trait_infernalist_diabolism_desc: "[ROOT.Char.GetFirstNameNoTooltip] sigue el camino del [diabolism|E]."
 trait_infernalist_thralldom_desc: "[ROOT.Char.GetFirstNameNoTooltip] sigue el camino del [thralldom|E]."
 
 trait_ghoul: "Ghoul"
 trait_ghoul_desc: "Un mortal que ha consumido sangre de vampiro, lo que provoca una necesidad de más, convirtiéndose (la mayoría de las veces) en un Esclavo voluntario de su amo."
 trait_ghoul_vitae_dependency_desc: "#medium [ghoul_vitae_dependency|E]: #underline;V;TOOLTIP:trait_ghoul_vitae_dependency_chance [ROOT.Char.MakeScope.ScriptValue('POD_chance_to_lose_vitae_passively')|V0]%#! de probabilidad de ganar #N 1 [hunger_with_icon|E]#! cada #underline;TOOLTIP:trait_ghoul_vitae_dependency_years [ROOT.Char.MakeScope.ScriptValue('POD_years_to_lose_vitae_passively')|V0]#! años.#!\n\n"
 trait_ghoul_vitae_dependency_years: "[GetPlayer.MakeScope.GetScriptValueDesc('POD_years_to_lose_vitae_passively')]"
 POD_years_to_lose_vitae_passively_age_above_80: "Tienes más de #V 80#! años"
 POD_years_to_lose_vitae_passively_age_above_200: "Tienes más de #V 200#! años"
 trait_ghoul_vitae_dependency_chance: "[GetPlayer.MakeScope.GetScriptValueDesc('POD_chance_to_lose_vitae_passively')]"
 trait_ghoul_highest_vitae_ingested_desc: "#medium El [ghoul_greatest_vitae_ingested|E] de [ROOT.Char.GetFirstNamePossessiveNoTooltip] es de [GetTrait(Concatenate('vampgeneration',IntToString(FixedPointToInt(ROOT.Char.MakeScope.ScriptValue('POD_highest_generation_ingested_value'))))).GetName(GetNullCharacter)], lo que permite [perks|E] de [Glossary('Disciplina','game_concept_discipline_desc')] hasta el nivel [ROOT.Char.MakeScope.ScriptValue('POD_allowed_discipline_level_for_ghouls_or_revenants')|V0].#!\n\n"
 trait_bound_ghoul_desc: "#medium [ROOT.Char.GetFirstNameNoTooltip] es el [bound_ghoul|E] de #V [GetScriptedGui('POD_show_ghoul_domitor').BuildTooltip(GuiScope.AddScope('ghoul',ROOT.Char.MakeScope).End)]#!.#!\n\n"
 trait_bound_masterless_ghoul_desc: "#medium [ROOT.Char.GetFirstNameNoTooltip] es un [masterless_ghoul|E].#!\n\n"
 
 trait_szlachta: "Szlachta"
 trait_szlachta_desc: "Un mortal que ha consumido sangre de vampiro y luego ha sido transformado por la $pod_discipline$ de Vicisitud."
 
 trait_mortal: "Mortal"
 trait_mortal_desc: "Un ser humano corriente. Vidas tan breves..."
 
 
 trait_mage: "Mago"
 trait_mage_desc: "Humanos con avatares despiertos que les permiten manejar la verdadera magia y alterar el tejido de la realidad."
 
 trait_wraith: "wraith"
 trait_wraith_desc: "Un alma muerta arrastrada de vuelta al mundo mortal por magias oscuras o un apego a algo que dejaron atrás."
 trait_gaunt: "Gaunt"
 trait_gaunt_desc: "Un Gaunt es un wraith de mayor edad que ha resuelto una o más de sus [Fetters|E] y aún las conserva."
 trait_domem: "Domem"
 trait_domem_desc: "Un Domem es un wraith cuyas [Fetters|E] han sido todas destruidas, lo que le impide permanecer en el [UmbraGlossary('shadowlands')] durante ningún periodo de tiempo. Aunque la condición de Domem suele implicar edad, un wraith puede convertirse en Domem siendo aún muy joven; lo único que se requiere es que sus [Fetters|E] sean destruidas."
 trait_enfant: "Enfants"
 trait_enfant_desc: "Los wraiths con consciencia de sí mismos comienzan como Enfants; cuando una persona muere, su alma renace en el [UmbraGlossaryLocalized('shadowlands','Inframundo')] cubierta por una capa de plasma llamada caul."
 trait_track_fetter: "Atadura"
 trait_track_fetter_desc: "$game_concept_Fetter_desc$"
 trait_track_fetter_resolved: "Atadura Resuelta"
 trait_track_fetter_resolved_desc: "Las [Fetters|E] también pueden resolverse, lo que significa que un wraith gana la fuerza necesaria para despedirse de las cosas y personas que amó en vida. Un wraith que logra Resolver todas sus [Fetters|E] puede permanecer en el [UmbraGlossary('shadowlands')] indefinidamente, pero semejante logro, de conceder este beneficio, es tan raro que roza el mito."
 
 
 trait_wight: "Wight"
 trait_wight_desc: "Un wight es un vampiro que ha perdido por completo su moral. Son, a todos los efectos, [Glossary('La Bestia','game_concept_beast_desc')] encarnada. Un personaje que ha caído en el Wassail nunca puede ser salvado ni volver a jugarse."
 
 trait_vampclan: "$pod_clan$"
 
 trait_assamite: "Banu Haqim"
 trait_assamite_desc: "Con base en su fortaleza oculta en Oriente Medio, los Vástagos occidentales los consideran tradicionalmente peligrosos asesinos y Diableristas."
 
 trait_assamite_laibon: "Shango"
 trait_assamite_laibon_desc: "Uno de los Legados de los Laibon. Adoradores de Shango, el dios yoruba de las tormentas, los Shango son quizás el legado más civilizado de los Laibon, junto a los aristocráticos Guruhi."
 
 trait_baali: "Baali"
 trait_baali_desc: "Línea de Sangre de vampiros asociada a la adoración de demonios."
 
 trait_brujah: "Brujah"
 trait_brujah_desc: "Rápidos para la ira y siempre apasionados, han ido recuperando su posición como $pod_clan$ de elevados filósofos y activistas."
 
 trait_brujah_laibon: "Osebo"
 trait_brujah_laibon_desc: "Uno de los legados de los Laibon. Los guerreros de los Laibon, los Osebo toman su nombre del famoso leopardo de la leyenda ashanti occidental."
 
 trait_brujah_ashirra: "Bay't Mushakis"
 trait_brujah_ashirra_desc: "Los Brujah de fe islámica son conocidos como Bay't Mushakis, y muchos son los Chiquillos de los Vástagos de Cartago. Se extendieron especialmente por el norte de África, y los más jóvenes declararon la yihad para castigar a los Vástagos romanos que habían destruido el gran experimento."
 
 trait_cacophony: "Hija de la Cacofonía"
 trait_cacophony_desc: "Compuestas actualmente en su mayoría por mujeres (debido a la dificultad asociada de educar a alguien con el registro vocal de la mayoría de los hombres), las Hijas practican Melpominee, una $pod_discipline$ que les permite invocar extraños efectos a través del canto. Son las choralistes por excelencia de los no-muertos, y organizar una reunión de ellas otorga un alto prestigio."
 
 trait_caitiff: "Caitiff"
 trait_caitiff_desc: "Conocidos como los sin clan, son $pod_cainites$ que no pertenecen a ningún $pod_clan$."

 trait_caitiff_laibon: "Nyayo"
 trait_caitiff_laibon_desc: "Más una Clasificación que un Linaje, los Nyayo trazan sus orígenes hasta Mombasa como guerreros sin par no ligados a ningún linaje, a menudo dedicados a seguir el mismo camino que el Anciano."
 
 trait_cappadocian: "Capadocio"
 trait_cappadocian_desc: "Eruditos distantes obsesionados con los misterios de la muerte y el alma."
 
 trait_cappadocian_laibon: "Mla Watu"
 trait_cappadocian_laibon_desc: "Quizás ningún grupo de Laibon sea tan rechazado como los Mla Watu. Aunque los Laibon en su conjunto ya están alejados de su humanidad, aún mantienen un sano respeto por los muertos, como exigen muchas costumbres africanas. Los Mla Watu, sin embargo, no se conforman con comunicarse con los ancestros muertos; buscan controlarlos, en cuerpo y alma."
 
 trait_cappadocian_ashirra: "Qabilat al-Mawt"
 trait_cappadocian_ashirra_desc: "La rama islámica del $pod_clan$ Capadocio es conocida en Oriente Medio como Qabilat al-Mawt, y se encuentra entre los Vástagos más eruditos de esas tierras. Los Qabilat al-Mawt deben tener cuidado en sus estudios de los muertos, ya que el Islam tiene en gran estima a los difuntos; la profanación de cadáveres podría atraer la atención tanto de los mortales como de los [Glossary('Ashirra','game_concept_ashirra_desc')], los Vástagos islámicos organizados."
 
 trait_gangrel: "Gangrel"
 trait_gangrel_desc: "Salvajes. Primitivos, resistentes y animalescos."
 
 trait_gangrel_laibon: "Akunanse"
 trait_gangrel_laibon_desc: "Uno de los legados de los Laibon. Toman su nombre y naturaleza de los mitos de la «araña sabia» de muchos cuentos populares africanos. Son conocidos por su gran conocimiento, sus sabios consejos y su naturaleza apolítica."
 
 trait_gangrel_ashirra: "Wah'Sheen"
 trait_gangrel_ashirra_desc: "Aunque los [Glossary('Ashirra','game_concept_ashirra_desc')] llaman a todos los Gangrel «Wah'Sheen», existe una línea distintiva entre ambas partes, similar a la división entre los Gangrel de Ciudad y los de Campo, aunque con una relación mucho más hostil."

 trait_gargoyle: "Gárgola"
 trait_gargoyle_desc: "Vampiros que parecen esculturas de piedra animadas.\nCreadas por los Tremere como tropas de choque contra los Tzimisce, la mayoría de las Gárgolas se conforman con servir a sus amos dotados de poderes mágicos, pero algunas muestran pensamiento independiente."
 
 trait_giovanni: "Giovanni"
 trait_giovanni_desc: "Tras su ascenso a la sangre, Augustus Giovanni comenzó de inmediato a Abrazar a su propia familia. En el proceso, los Giovanni se convirtieron en algo entre una Línea de Sangre y una secta dentro del $pod_clan$ Capadocio. Reconocidos como los expertos en [necromancy|E], los Giovanni se mantuvieron ligeramente separados del $pod_clan$ madre."
 
 trait_harbingersofskulls: "Heraldos de las Calaveras"
 trait_harbingersofskulls_desc: "Una Línea de Sangre de vampiros con una palidez cadavérica. Además, la piel de los Heraldos se contrae, haciendo que estos $pod_cainites$ parezcan esqueléticos, con extremidades óseas y rostros congelados en una inmortal mueca de calavera."

 trait_kiasyd: "Kiasyd"
 trait_kiasyd_desc: "Una Línea de Sangre de vampiros con sangre de hadas, descendientes del Lasombra Marconius de Estrasburgo."
  
 trait_lasombra: "Lasombra"
 trait_lasombra_desc: "El $pod_clan$ Lasombra son darwinistas sociales, depredadores, elegantes e inhumanos."
 
 trait_lasombra_laibon: "Xi Dundu"
 trait_lasombra_laibon_desc: "Los Xi Dundu, que toman su nombre de la palabra bavili para «sombra», eran originarios del Congo hasta que un rito salido mal los expulsó de sus Tierras Natales. Ahora residen entre los pueblos masái del este de África."
 
 trait_lasombra_ashirra: "Qabilat al-Khayal"
 trait_lasombra_ashirra_desc: "Los Lasombra arábigos destacan entre sus homólogos Vástagos islámicos por ser uno de los pocos bay't de mayoría cristiana. El Islam se afianzó en algunos lugares del $pod_clan$, especialmente en Iberia, y provocó grandes fracturas en el bay't."  
 
 trait_maeghar: "Maeghar"
 trait_maeghar_desc: "Una serie de accidentes aislados que surgieron cuando un $pod_cainite$ intentó infligir su maldición a un ser con sangre de hadas. Todos los Maeghar poseen algún rasgo físico que delata su naturaleza feérica, que puede ir de lo sutil (piel blanca como la nieve y cabello de ébano) a lo evidente (seis brazos)."
 
 trait_malkavian: "Malkavian"
 trait_malkavian_desc: "$pod_clan$ de Vástagos malditos con la locura."
 
 trait_malkavian_ashirra: "Bay't Majnoon"
 trait_malkavian_ashirra_desc: "Los Malkavian de los [Glossary('Ashirra','game_concept_ashirra_desc')], los Bay't Majnoon, son más respetados que los de Occidente. Muchos fueron considerados consejeros, guardaespaldas e incluso profetas islámicos."
 
 trait_nosferatu: "Nosferatu"
 trait_nosferatu_desc: "Espectros. Sigilosos, fuertes y aterradores."
 
 trait_nosferatu_ashirra: "Hajj"
 trait_nosferatu_ashirra_desc: "Los Nosferatu que se convirtieron al Islam se volvieron rápidamente figuras respetadas. Al ver en el Islam una promesa de redención incluso para criaturas tan miserables como ellos, pronto se convirtieron en un pilar de la secta [Glossary('Ashirra','game_concept_ashirra_desc')].\nUna figura clave de su éxito fue Tarique al-Hajj, un Hechicero de Sangre Nosferatu que ayudó a contener los efectos más desastrosos del Lamento. Por ello, él y su prole fueron rebautizados como los Hajj, los guardianes de los lugares más sagrados del Islam."
 
 trait_nosferatu_laibon: "Guruhi"
 trait_nosferatu_laibon_desc: "Tomando su nombre del dios gambiano del que afirman descender, los Guruhi se consideran a sí mismos los amos de África, los legítimos gobernantes de sus tierras y sus gentes."
  
 trait_nosferatu_mnemachien: "Mnemachien"
 trait_nosferatu_mnemachien_desc: "#medium $glossary_clan_curse$: Siempre [GetTrait('predatortype_consensualist').GetName(GetNullCharacter)]#!\n\nOriginarios de la druidesa Mnemach, los Mnemachien usan sus fuerzas para mantener un principio de equilibrio con la humanidad."
 
 trait_baali_ennamaru: "Hijos de Ennamaru"
 trait_baali_ennamaru_desc: "Descendientes del misterioso Matusalén Nekys, los Hijos de Ennamaru son hábiles manipuladores que se deleitan torturando psicológicamente a sus objetivos."
  
 trait_toreador_volgirre: "Volgirre"
 trait_toreador_volgirre_desc: "Los siniestramente hermosos Volgirre son expertos en las más oscuras búsquedas artísticas, empleando [GetTrait('vicissitude').GetName(GetNullCharacter)] para producir obras retorcidas y horripilantes de repugnante belleza."
  
 trait_oldclantzimisce: "Viejo $pod_clan$ Tzimisce"
 trait_oldclantzimisce_desc: "Miembros del $pod_clan$ Tzimisce que no se unieron al Sabbat"
 
 trait_ravnos: "Ravnos"
 trait_ravnos_desc: "Conocidos por ser vagabundos errantes y buhoneros, los Ravnos son charlatanes que practican con deleite sus artes del engaño y el robo."
 
 trait_ravnos_ashirra: "Bay't Mujrim"
 trait_ravnos_ashirra_desc: "Bay't Mujrim es el término arábigo para el $pod_clan$ de los Engañadores (Mujrim significa literalmente «Criminal»). No eran mejor recibidos en el mundo islámico, ya que sus vicios los llevaban a numerosos enfrentamientos indeseados con los [Glossary('Ashirra','game_concept_ashirra_desc')]."
 
 trait_ravnos_laibon: "Kinyonyi"
 trait_ravnos_laibon_desc: "Uno de los Legados de los Laibon. Toman su nombre de la palabra luganda para «pájaro», lo que refleja su tendencia a viajar constantemente, incluso más que los Akunanse, buscadores de conocimiento."
 
 trait_ravnos_erk: "Erk"
 trait_ravnos_erk_desc: "Una Línea de Sangre muy territorial y disciplinada asentada en las estepas de Asia Central. A diferencia de su clan progenitor nómada, los Erk son estáticos y están profundamente arraigados en sus dominios. Originarios del oculto valle de Ergenekon, rico en hierro, son supervivientes pragmáticos que destacan en la administración y la logística."
 
 trait_salubri: "Salubri"
 trait_salubri_desc: "El otrora poderoso $pod_clan$ Salubri ha quedado reducido a poco más que una Línea de Sangre tras la destrucción de su progenitor, Saulot."

 trait_salubri_ashirra: "Al-Amin"
 trait_salubri_ashirra_desc: "Los Salubri islámicos, conocidos como al-Amin (literalmente «Los Virtuosos»), no tuvieron mejor suerte que sus homólogos europeos. Durante siglos, vigilaron a los Baali desde el norte de África hasta Asia, disfrazándose normalmente como miembros de otros clanes."

 trait_salubri_laibon: "Nkulu Zao"
 trait_salubri_laibon_desc: "Uno de los Legados menores de los Laibon. Chiquillos de la casi extinta línea de Zao-lat, los Nkulu Zao son escasos en número tras siglos de persecución de su Legado."

 trait_samedi: "Samedi"
 trait_samedi_desc: "Originarios probablemente del Caribe, todos los miembros de esta Línea de Sangre parecen zombis o cadáveres. Los Samedi parecen hallarse en un estado constante de descomposición. Trozos putrefactos de carne se desprenden de sus cuerpos con frecuencia creciente a medida que envejecen, y el olor a muerte los acompaña allá donde vayan."
 
 trait_setite: "Setita"
 trait_setite_desc: "El $pod_clan$ de vampiros que creen que su fundador fue el dios egipcio Set. La creencia setita ortodoxa dicta que Set regresará algún día para gobernar o consumir el mundo, y los Setitas devotos preparan el camino para su resurrección."
 
 trait_setite_raktasadhus: "Daitya"
 trait_setite_raktasadhus_desc: "Los Daitya son una variante hereje, cuyo fundador viajó de Egipto a la India en busca de antiguo conocimiento místico y persiguiendo a los Hijos de Osiris, de quienes se rumoreaba que habían huido a los Himalayas."

 trait_setite_naktanchara: "Naktanchara"
 trait_setite_naktanchara_desc: "El linaje Naktanchara de la Línea de Sangre es rechazado desde que se convirtieron al budismo y comenzaron a desafiar el sistema de castas de los Vástagos indios."

 trait_toreador: "Toreador"
 trait_toreador_desc: "$pod_clan$ de vampiros conocidos por ser algunos de los Vástagos más hermosos, sensuales, seductores, emotivos y glamurosos."
 
 trait_toreador_ashirra: "Ray'een al-Fen"
 trait_toreador_ashirra_desc: "Los Toreador islámicos son los Ray'een al-Fen, apodados comúnmente Escribas, ya que la mayoría favorecen a calígrafos, escritores y arquitectos."
 
 trait_toreador_laibon: "Ishtarri"
 trait_toreador_laibon_desc: "Uno de los Legados de los Laibon. Los Ishtarri afirman descender de la diosa babilónica Ishtar, pero actualmente carecen de la conexión personal con África que sí tienen los similares Guruhi."
  
 trait_tremere: "Tremere"
 trait_tremere_india: "Trimira"
 trait_tremere_desc: "$pod_clan$ de eruditos, centrado en la [bloodsorcery|E]. Son despreciados por su supuesto ataque al [Glossary('Antediluviano','game_concept_antediluvian_desc')] Saulot, y temidos por la férrea disciplina y cohesión de $pod_clan$, algo inaudito en el resto de la sociedad $pod_cainite$"
 
 trait_truebrujah: "Verdadero Brujah"
 trait_truebrujah_desc: "Una Línea de Sangre del $pod_clan$ Brujah que afirma descender del [Glossary('Antediluviano','game_concept_antediluvian_desc')] original fundador del linaje, y no de su [Glossary('Diablerista','game_concept_diablerie_desc')]/Chiquillo Troile. Los Verdadero Brujah destacan por su comportamiento calmado y distante."
 
 trait_tzimisce: "Tzimisce"
 trait_tzimisce_desc: "$pod_clan$ de etiqueta feudal y moldeado sádico de la carne."
 
 trait_tzimisce_laibon: "Nagloper"
 trait_tzimisce_laibon_desc: "El nombre de los Nagloper procede de la palabra khoikhoi para «hechicero maligno», y hacen honor a su reputación como los más horripilantes de los Laibon. Permiten que [Glossary('La Bestia','game_concept_beast_desc')] los domine, lo que los lleva a cometer toda clase de depravaciones imaginables, algunas de las cuales solo se creían posibles en pesadillas."
  
 trait_ventrue: "Ventrue"
 trait_ventrue_desc: "Señores. Regios, autoritarios y aristocráticos."
 
 trait_ventrue_ashirra: "El Hijazi"
 trait_ventrue_ashirra_desc: "Los El Hijazi son un linaje distintivo de los Ventrue. A diferencia del grueso del $pod_clan$ —tradicionalmente asociado a los romanos o a los europeos cristianos—, la Línea de Sangre El Hijazi afirma descender de linajes arábigos nativos. Han adoptado el Islam y son aceptados como parte de los [Glossary('Ashirra','game_concept_ashirra_desc')], aunque también son relativamente escasos en número."
 
 trait_ventrue_raktasadhus: "Danava"
 trait_ventrue_raktasadhus_desc: "Los Danava son una Línea de Sangre del $pod_clan$ Ventrue centrada en el subcontinente indio. Regios sabios, ascetas y sacerdotes, los Danava se encuentran entre los vampiros más respetados dentro del sistema de castas de los Malditos indios."

 trait_chibo: "Chibo"
 trait_chibo_desc: "El linaje ocultista y sacerdotal de los [GetTrait('tzimisce').GetName(GetNullCharacter)] de [Glossary('Mikaboshi','podgloss.mikaboshi')], los Chibo son las estrellas sangrientas de la magia."

 trait_monomi: "Monomi"
 trait_monomi_desc: "Los guerreros de los [GetTrait('tzimisce').GetName(GetNullCharacter)] de [Glossary('Mikaboshi','podgloss.mikaboshi')], los Monomi son las estrellas sangrientas de la espada."

 trait_kishu: "Kishu"
 trait_kishu_desc: "Los asesinos de los [GetTrait('tzimisce').GetName(GetNullCharacter)] de [Glossary('Mikaboshi','podgloss.mikaboshi')], los Kishu son las estrellas sangrientas de la daga."

 trait_kizoku: "Kizoku"
 trait_kizoku_desc: "Nacidos de un narrador y atormentados por pesadillas, los Kizoku son los Vástagos de las Grietas."

 trait_bushi: "Bushi"
 trait_bushi_desc: "Afirmando ser los hijos bañados en sangre del Dios de la Tormenta de los Amatsukami, los Bushi son guerreros obstinados sin parangón."

 trait_kuntilanak: "Kuntilanak"
 trait_kuntilanak_desc: "La maldición del aislamiento manifestada como estar atrapados entre los mundos de los vivos y los muertos, los Kuntilanak son necrománticos espectrales."

 trait_sangun: "Sangun"
 trait_sangun_desc: "Los señores de las montañas de Corea, los Sangun son soberanos que adoptan formas bestiales."

 trait_anh: "Anh"
 trait_anh_desc: "Divergentes de los [GetTrait('gangrel').GetName(GetNullCharacter)] pero distintos de los Marineros, los Anh son los acechadores ocultos de los océanos alrededor de Indonesia, Indochina y Malasia."

 trait_banpaia: "Banpaia"
 trait_banpaia_desc: "La progenie de una expedición perdida de [GetTrait('tremere').GetName(GetNullCharacter)] hacia Oriente, los Banpaia se han convertido en una nueva presencia en el mundo nocturno de Asia Oriental."

 TRAIT_FLAG_DESC_can_create_gargoyles: "Puede crear #TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L Gárgolas#!#!"

 # Clan curse flags
 TRAIT_FLAG_DESC_clan_curse_anh: "$glossary_clan_curse$: los [counties|E] del [domain|E] sin una casilla vecina de río o mar obtienen [GetModifier('POD_anh_clan_curse_modifier').GetNameWithTooltip]"
 TRAIT_FLAG_DESC_clan_curse_brujah: "$glossary_clan_curse$: el [Glossary('Frenesí','game_concept_beast_desc')] es más difícil de resistir"
 TRAIT_FLAG_DESC_clan_curse_bushi: "$glossary_clan_curse$: las heridas por fuego y luz solar se duplican"
 TRAIT_FLAG_DESC_clan_curse_gangrel: "$glossary_clan_curse$: obtiene una apariencia bestial al entrar en [Glossary('Frenesí','game_concept_beast_desc')]"
