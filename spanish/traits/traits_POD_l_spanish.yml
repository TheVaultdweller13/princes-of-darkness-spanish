 trait_mod_guardian_desc: "[ROOT.Char.GetFirstNameNoTooltip] necesita existir para que algunos scripts de este mod funcionen. Si lo ves en tu corte, simplemente sonríe y saluda. Desaparecerá en breve."
  
 
 

 
 trait_midnight_warrior: "Guerrero de Medianoche"
 trait_midnight_warrior_desc: "Un término usado para distinguir a un practicante de las ancestrales Guerras de Medianoche $pod_kueijin$, guerras ritualizadas que siguen protocolos y estrategias estrictos. Con el respaldo de milenios de Tradiciones bélicas, estos individuos son temidos generales que dominan una amplia variedad de tácticas."
 trait_midnight_warrior_1: "Guerrero de Medianoche"
 trait_midnight_warrior_2: "General de Medianoche"
 trait_midnight_warrior_3: "Maestro de la Medianoche"
 trait_track_midnight_warrior: "Guerrero de Medianoche"
 trait_track_midnight_warrior_desc: "#help Ganas experiencia en esta línea estando sin tierras y usando tu experiencia de [ashen_grandmaster|E] en ella.#!"

 trait_twilight_warrior: "Guerrero del Crepúsculo"
 trait_twilight_warrior_desc: "Las Guerras del Crepúsculo son conflictos pequeños y no letales, estrictamente regulados en la sociedad $pod_kueijin$ y usados para arbitrar hostilidades en escalada. Suelen enseñar en profundidad, aunque no siempre de forma práctica, las tácticas y estrategias usadas más adelante en la guerra «real»."
 trait_twilight_warrior_1: "Guerrero del Crepúsculo"
 trait_twilight_warrior_2: "General del Crepúsculo"
 trait_twilight_warrior_3: "Maestro del Crepúsculo"
 trait_track_twilight_warrior: "Guerrero del Crepúsculo"
 trait_track_twilight_warrior_desc: "#help Ganas experiencia en esta línea estando sin tierras y usando tu experiencia de [ashen_grandmaster|E] en ella.#!"

 trait_wayang_kulit: "Wayang Kulit"
 trait_wayang_kulit_desc: "Un estilo de guerra creado por los [Glossary('Penangallan','podgloss.penangallan')] del sudeste asiático. Nombrado en honor a las obras de sombras javanesas, hace un uso extensivo del Shintai de Carne para confundir al enemigo."
 trait_wayang_kulit_1: "Discípulo de Wayang Kulit"
 trait_wayang_kulit_2: "Maestra de Wayang Kulit"
 trait_wayang_kulit_3: "Penangallan de Wayang Kulit"
 trait_track_wayang_kulit: "Discípulo de Wayang Kulit"
 trait_track_wayang_kulit_desc: "#help Ganas experiencia en esta línea estando sin tierras y usando tu experiencia de [ashen_grandmaster|E] en ella.#!"

 trait_angered_malkav: "Red de la Locura Enfurecida"
 trait_angered_malkav_desc: "Has enfurecido a la Red de la Locura y a todos los conectados a ella. Algunos dicen que incluso has enfurecido a algo o alguien dentro de la propia Red. Ya puedes sentir sus muchas, muchas garras hundiéndose en tu mente."
 
  
 trait_demonology: "Demonología"
 trait_demonology_desc: "Este personaje conoce los fundamentos del comportamiento Demoníaco y algunos de sus poderes más inusuales. Probablemente podría llevar a cabo una invocación, y puede que haya presenciado o incluso ayudado en una, pero las vinculaciones reales son otra historia..."
 trait_demonology_xp: "#medium;italic Ganas pasivamente [ROOT.Char.MakeScope.ScriptValue('POD_yearly_demonology_xp_gain')|V] [trait_level_track_xp|E] cada año:#!\n[ROOT.Char.MakeScope.GetScriptValueDesc('POD_yearly_demonology_xp_gain')]\n"
 trait_demonology_1: "Estudiante de Demonología"
 trait_demonology_1_desc: "$trait_demonology_xp$\n$trait_demonology_desc$"
 trait_demonology_2: "Erudito en Demonología"
 trait_demonology_2_desc: "$trait_demonology_xp$\nEste personaje comprende los misterios del Infierno y fragmentos de la extraña y blasfema prehistoria relatada por los condenados. Sin duda podría realizar ritos de invocación y vinculación, y puede que conozca un puñado de Nombres Celestiales que usar... si quisiera."
 trait_demonology_3: "Maestro en Demonología"
 trait_demonology_3_desc: "$trait_demonology_xp$\n¿Se le apareció al propio Lucifer ante este personaje para que fuera su escriba? Los demonios temen con razón el poder y el saber de este personaje."
 
 trait_track_demonology: "Demonólogo"
 trait_track_demonology_desc: "#italic Alguien que estudia a los demonios. Un demonólogo está interesado en la ciencia teórica, espiritual o intelectual de los demonios, y no tiene necesariamente intención alguna de invocar jamás a un demonio o interactuar con uno directamente. Sin embargo, cuando la curiosidad o la sed de poder se vuelven abrumadoras, la demonología puede actuar como trampolín hacia el #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Infernalismo#!#!.#!"

 TRAIT_FLAG_DESC_demonology_unlocks_pacts: "Puede firmar [demonic_pacts|E] con $POD_splat_demon_plural$: #P Sí#!"
 TRAIT_FLAG_DESC_demonology_xp_gain_decision: "Puede [GetModifier('POD_focus_on_demonology_modifier').GetNameWithTooltip] mediante una [decision|E]: #P Sí#!"
 
 trait_POD_grail_knight: "Caballero del Grial"
 TRAIT_FLAG_DESC_stronger_ghouls_flag: "Los [ghouls|E] son [GetTrait('physique_good_1').GetName(GetNullCharacter)] y ganan más [prowess|E]"
 TRAIT_FLAG_DESC_order_bitter_ashes_maa_flag: "Puede reclutar [GetMaA('order_bitter_ashes_maa').GetName] como [men_at_arms|E]"
 trait_POD_grail_knight_desc: "Este $POD_splat_vampire$ ha bebido del Grial de las Cenizas Amargas y ha sobrevivido. Cada Caballero del Grial experimenta visiones y poderes distintos al lograrlo, pero, en cualquier caso, ahora forma parte de un grupo muy reducido de individuos verdaderamente bendecidos."
 
 trait_fleshcrafted: "Carne Esculpida"
 trait_fleshcrafted_character_desc: "#color:{0.0,0.0,0.0,0.0} [GetScriptedGui('POD_fleshcrafting_trait_tooltip').BuildTooltip( GuiScope.AddScope('character',ROOT.Char.MakeScope).End )]#!\n\n[ROOT.Char.GetFirstNameNoTooltip] fue remodelado físicamente (y, según algunos, también espiritualmente) mediante el uso de la [Glossary('Disciplina','game_concept_discipline_desc')] [GetTrait('vicissitude').GetName(GetNullCharacter)]."
 trait_fleshcrafted_desc: "Este personaje fue remodelado físicamente (y, según algunos, también espiritualmente) mediante el uso de la [Glossary('Disciplina','game_concept_discipline_desc')] [GetTrait('vicissitude').GetName(GetNullCharacter)]."
 trait_track_fleshcrafted: "Complejidad"
 trait_track_fleshcrafted_desc: "El grado en que esta criatura ha sido modificada. Los efectos de [GetTrait('vicissitude').GetName(GetNullCharacter)] pueden ser apenas perceptibles si se aplican con un toque sutil, pero un Szlachta con un conjunto completo de mejoras de combate resultará perturbador incluso para otros $pod_cainites$."
 trait_pilgrim_of_enoch: "Peregrino de Enoc"
 trait_pilgrim_of_enoch_desc: "Un [GetTrait('nagaraja').GetName(GetNullCharacter)] que ha realizado el peligroso Viaje hasta la ciudad fantasma de Enoc en el [UmbraGlossaryLocalized('shadowlands','Inframundo')] y ha regresado con conocimiento prohibido de los muertos."
 trait_pilgrim_of_enoch_character_desc: "La peregrinación de [ROOT.Char.GetFirstNameNoTooltip] a la ciudad fantasma de Enoc le ha concedido comprensión de los misterios más profundos de la Necromancia."

 trait_itarajana_sorcerer: "Hechicero de Itarajana"
 trait_itarajana_sorcerer_desc: "Un practicante de Itarajana, una forma de Hechicería de Sangre originaria del subcontinente indio que se nutre de las Tradiciones místicas hindúes."
