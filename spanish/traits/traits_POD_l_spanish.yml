 trait_azhi_dahaka_scholar: "Erudito de Azhi Dahaka"
 trait_azhi_dahaka_scholar_desc: "Este personaje busca comprender Azhi Dahaka, un estado de ser iluminado y definitivo, posiblemente provocado por el uso extensivo de la Disciplina Vicisitud."
 trait_azhi_dahaka_scholar_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] busca comprender Azhi Dahaka, un estado de ser iluminado y definitivo, posiblemente provocado por el uso extensivo de la Disciplina Vicisitud."
 trait_track_azhi_dahaka_scholar: "Metamorfosis"
 trait_track_azhi_dahaka_scholar_desc: "Te acercas cada vez más a la ascensión."
#brought on by extensive use of the discipline Vicissitude."
 trait_azhi_dahaka: "Azhi Dahaka"
 trait_azhi_dahaka_desc: "Azhi Dahaka es un término usado por los vampiros del $pod_clan$ [GetTrait('tzimisce').GetName(GetNullCharacter)] para describir un estado de ser iluminado y definitivo. Una forma física y espiritual en constante cambio, incomprensible para la mayoría."
 trait_azhi_dahaka_character_desc: "$trait_azhi_dahaka_desc$\n\nTras despojarse de los últimos vestigios de su humanidad, [ROOT.Char.GetFirstNameNoTooltip] se ha convertido en algo verdaderamente terrorífico de contemplar: un Dragón entre Dragones."
 TRAIT_FLAG_DESC_can_ghoul_supernaturals_flag: "@ghoul_icon!Puede convertir en [ghoul|E] a la mayoría de los sobrenaturales"
 TRAIT_FLAG_DESC_free_vampire_shapeshifts_flag: "@vampire_icon!El [shapeshift|E] vampírico ya no cuesta [Concept('hunger','@blood_icon!Sangre')|E]"
 TRAIT_FLAG_DESC_azhi_dahaka_stat_randomization_flag: "@vampire_icon!Las [skills|E] base cambian constantemente"

 TRAIT_FLAG_DESC_infinite_blood_flag: "Reservas infinitas de [Concept('hunger','@blood_icon!Sangre')|E]"
 
 trait_zombu: "Zombu"
 trait_zombu_desc: "Un cadáver reanimado mediante magia nigromántica. Estas criaturas no conocen el miedo, no se fatigan y son completamente obedientes. A menudo se usan como trabajadores o soldados. Algunas están tan descompuestas que parecen esqueletos tambaleantes."

 trait_pod_crafter_1: "Artesano"
 trait_pod_crafter_2: "Artesano Experto"
 trait_pod_crafter_3: "Maestro Artesano"
 trait_pod_crafter_1_desc: "Este personaje tiene algo de experiencia en las artes de la artesanía."
 trait_pod_crafter_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] tiene algo de experiencia en las artes de la artesanía."
 trait_pod_crafter_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] es un experto en las artes de la artesanía."
 trait_pod_crafter_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] es un maestro de las artes de la artesanía."
 trait_track_forging: "Forja"
 trait_track_forging_desc: "Experiencia en Forja; cuanto más alta, mejores son los [artifacts|E] creados"
 trait_track_brewing: "Elaboración"
 trait_track_brewing_desc: "Experiencia en Destilación; cuanto más alta, mejores son los [artifacts|E] creados"
 trait_track_enhancing: "Mejora"
 trait_track_enhancing_desc: "Experiencia en Mejora; cuanto más alta, mejores son los [artifacts|E] creados"
 
 trait_ashen_adventurer: "Aventurero Ceniciento"
 trait_ashen_adventurer_desc: "Un aventurero errante impulsado por la búsqueda de riquezas, fama y sangre."
 trait_track_ashen_ambassador: "[ashen_ambassador|E]"
 trait_track_ashen_ambassador_desc: "#bold Puedes ganar experiencia en esta línea de rasgos usando la interacción de personaje Visita de Embajador.#! \n Jurado a un gobernante extranjero, este diplomático recorre la tierra en busca de oportunidades para beneficiar a su patrón."
 
 trait_track_ashen_grandmaster: "[ashen_grandmaster|E]"
 trait_track_ashen_grandmaster_desc: "#bold Esta experiencia puede usarse para mejorar tu orden militar como vampiro sin tierras o tus estrategias como $pod_kueijin$ sin tierras. Se puede obtener completando contratos sin tierras de tipo marcial o bélico.#! \nLos Cainitas tienen una Tradición de bandas de soldados que se formalizan en una organización con suficiente estructura y propósito común como para ser considerada una orden militar.\nEn Oriente, los $pod_kueijin$ están más dedicados a mejorar su maestría marcial en un sentido estratégico."
 trait_track_ashen_caravan: "[ashen_caravan|E]"
 trait_track_ashen_caravan_desc: "#bold Esta experiencia se puede obtener completando contratos de transporte.#! \nLos Maestros de Caravanas Cenicientos son esos pocos personajes que realmente saben cómo recorrer los mortíferos caminos del Mundo de Tinieblas, y venden su experiencia a quienes la necesitan."
 
 trait_track_ashen_cult: "[ashen_cult|E]"
 trait_track_ashen_cult_desc: "#bold Puedes mejorar esta línea de rasgos usando la decisión del mismo nombre. Te permite interactuar de diversas formas mediante un evento con el condado en el que se encuentra tu Domicilio.#! \n Profetas, heresiarcas, obradores de milagros... el Mundo de Tinieblas está lleno de gente, mortal o no, que busca la verdad y está dispuesta a creer en un individuo carismático que se la entregue (según su propia versión)."
 

