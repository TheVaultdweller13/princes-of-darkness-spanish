 #building_type_flaming_mountain_dragon_nest_01_desc: "#F One of the two major dragon nests of Takla Makan, located among the Flaming Mountains outside of Dunhuang.#!"
 #building_flaming_mountain_dragon_nest_01: "Flaming Mountain Dragon Nest"
 #building_flaming_mountain_dragon_nest_01_desc: "The site itself is said to have once been a gateway to [Glossary('Tou Mu','podgloss.toumu')]'s [UmbraGlossary('hell_of_being_skinned_alive')], cleared and sanctified by the [Glossary('Wan Xian','game_concept_kuei_jin_desc')] near the end of [Glossary('Third Age','game_concept_third_age_desc')]."

 building_type_unique_dragon_nest_01: "Nido del Dragón Central"
 building_type_unique_dragon_nest_01_desc: "#F Aunque los Nidos del Dragón pueden aparecer en muchos lugares, solo unos pocos selectos se encuentran en la encrucijada de las grandes Líneas del Dragón. Estos actúan como un nexo de energías y son muy disputados.#!"
 building_unique_dragon_nest_01: "Nido del Dragón Central"
 building_unique_dragon_nest_01_desc: "Aunque los Nidos del Dragón pueden aparecer en muchos lugares, solo unos pocos selectos se encuentran en la encrucijada de las grandes Líneas del Dragón. Estos actúan como un nexo de energías y son muy disputados."
 
 building_type_crescent_moon_dragon_nest_01: "Nido del Dragón de la Luna Creciente"
 building_type_crescent_moon_dragon_nest_01_desc: "#F Uno de los dos grandes nidos de dragón de Takla Makan, situado junto al Lago de la Luna Creciente, a las afueras de Dunhuang.#!"
 building_crescent_moon_dragon_nest_01: "Nido del Dragón de la Luna Creciente"
 building_crescent_moon_dragon_nest_01_desc: "Este lugar infunde una gran confianza a los videntes del Pueblo Feroz, pues realmente está tallado con la forma de una luna creciente casi matemáticamente precisa. Es sin duda una señal de la diosa de la luna, pero el significado de esa señal es tema de cierto debate."

 building_type_tianchi_dragon_nest_01: "Nido del Dragón de Tianchi"
 building_type_tianchi_dragon_nest_01_desc: "#F El segundo gran nido de dragón controlado por la Corte del Tigre Blanco en el oeste.#!"
 building_tianchi_dragon_nest_01: "Nido del Dragón de Tianchi"
 building_tianchi_dragon_nest_01_desc: "Situado en las orillas del Lago de los Cielos, un cuerpo de agua alimentado por glaciares, increíblemente frío y de una belleza sobrecogedora."

 building_type_feng_dragon_nest_01: "Nido del Dragón de Feng"
 building_type_feng_dragon_nest_01_desc: "#F El Nido del Dragón de Feng es uno de los muchos Nidos del Dragón dentro de las Tierras del Cielo.#!"
 building_feng_dragon_nest_01: "Nido del Dragón de Feng"
 building_feng_dragon_nest_01_desc: "En lo alto de las montañas, rodeada de fuertes vendavales, la energía de este lugar es aterradoramente hermosa."

 
 #Mummies
 building_type_web_of_faith_01: "Conectando con la Red de Fe"
 building_type_web_of_faith_01_desc: "#F Una red de lugares sagrados y Sekhem (energía mística) que se encuentra por todo Oriente Medio.#!"
 building_web_of_faith_01: "Conexión Simple con la Red de Fe"
 building_web_of_faith_01_desc: "Puedes captar un patético goteo de Sekhem, pero poco más."
 building_web_of_faith_02: "Conexión Menor con la Red de Fe"
 building_web_of_faith_02_desc: "Puedes captar un débil chorrito de Sekhem, pero poco más."
 building_web_of_faith_03: "Conexión Mayor con la Red de Fe"
 building_web_of_faith_03_desc: "Puedes captar un hilo débil de Sekhem, pero poco más."
 building_web_of_faith_04: "Conexión Superior con la Red de Fe"
 building_web_of_faith_04_desc: "Puedes captar un pequeño chorro de Sekhem en esta zona."
 building_web_of_faith_05: "Conexión Excelsa con la Red de Fe"
 building_web_of_faith_05_desc: "Puedes captar un flujo moderado de Sekhem en esta zona."
 building_web_of_faith_06: "Conexión Principesca con la Red de Fe"
 building_web_of_faith_06_desc: "Puedes captar una fuerte corriente de Sekhem en esta zona."
 building_web_of_faith_07: "Conexión Regia con la Red de Fe"
 building_web_of_faith_07_desc: "Todo un lugar sagrado está bajo tu control."
 building_web_of_faith_08: "Conexión Divina con la Red de Fe"
 building_web_of_faith_08_desc: "Una gloria de épocas remotas, este lugar sagrado no tiene igual, y el Sekhem brota de este hermoso lugar."
 
 building_type_occult_affiliation_01: "Afiliación Oculta"
 building_type_occult_affiliation_01_desc: "#F Muchos grupos ocultistas, como el Círculo Órfico, los Benandanti o el Arcanum, cuentan con Cabiri entre sus filas, que se ocultan de sus hermanos y amplían su conocimiento oculto para promover sus propios fines.#!"
 building_occult_affiliation_01: "Afiliación Oculta Simple"
 building_occult_affiliation_01_desc: "No eres más que un nuevo Neonato de un grupo ocultista de poca monta."
 building_occult_affiliation_02: "Afiliación Oculta Menor"
 building_occult_affiliation_02_desc: "No eres más que un nuevo acólito de un pequeño grupo ocultista."
 building_occult_affiliation_03: "Afiliación Oculta Mayor"
 building_occult_affiliation_03_desc: "No eres más que un nuevo aprendiz de un grupo ocultista local."
 building_occult_affiliation_04: "Afiliación Oculta Superior"
 building_occult_affiliation_04_desc: "Eres un miembro respetable de un grupo ocultista decente."
 building_occult_affiliation_05: "Afiliación Oculta Excelsa"
 building_occult_affiliation_05_desc: "Eres un miembro conocido de un grupo ocultista moderado."
 building_occult_affiliation_06: "Afiliación Oculta Principesca"
 building_occult_affiliation_06_desc: "Eres un miembro importante de un grupo ocultista más grande."
 building_occult_affiliation_07: "Afiliación Oculta Regia"
 building_occult_affiliation_07_desc: "Ahora eres la mano derecha de un líder ocultista regional."
 building_occult_affiliation_08: "Afiliación Oculta Divina"
 building_occult_affiliation_08_desc: "Eres el cabecilla de una red ocultista regional, todos a tu entera disposición en secreto."
 
 building_type_maats_haven_01: "Refugio de Maat"
 building_type_maats_haven_01_desc: "#F El mundo fuera de las Tierras de la Fe está fuertemente influido por el poder de $glossary_wyrm_apophis$, lo que hace que el Sekhem esté menos disponible. Quedan pocos refugios aislados donde Maat sigue siendo fuerte, aunque a menudo están bajo el poder de otras fuerzas sobrenaturales.#!"
 building_maats_haven_01: "Refugio Simple de Maat"
