l_spanish:
 building_type_blood_tax_01: "Impuesto de Sangre"
 building_type_blood_tax_01_desc: "#F Te aseguras de que tus mortales trabajen, literalmente, hasta su último aliento.#!"
 building_blood_tax_01: "Impuesto de Sangre Bajo"
 building_blood_tax_01_desc: "Gravas abiertamente a los mortales aquí. Aunque no es el plan más sensato económicamente para la prosperidad del condado."
 building_blood_tax_02: "Impuesto de Sangre Severo"
 building_blood_tax_02_desc: "Los mortales están siendo desangrados de su dinero bajo tu gobierno. Eso, cuando tienen suerte."
 building_blood_tax_03: "Impuesto de Sangre Opresivo"
 building_blood_tax_03_desc: "Tus arcas se reponen rápidamente. ¿A quién le importa si gobiernas sobre un páramo yermo, de todos modos?"
 
 building_type_open_rule_01: "Gobierno Abierto"
 building_type_open_rule_01_desc: "#F Los mortales indefensos no sirven de nada sin tu firme liderazgo. Curiosamente, no todos parecen estar de acuerdo con esta verdad evidente.#!"
 building_open_rule_01: "Gobierno Firme"
 building_open_rule_01_desc: "Eres el señor de toda esta tierra, Vampiro o no. Te temen, pero los rumores de rebelión van en aumento."
 building_open_rule_02: "Gobierno Opresivo"
 building_open_rule_02_desc: "Una ejecución cada noche mantiene a los mortales a raya. Al menos, cuando creen que puedes oírlos..."
 building_open_rule_03: "Gobierno Tiránico"
 building_open_rule_03_desc: "Los mortales son ganado y son tratados como tal en tu Señorío de miedo y desesperación. Aun así, intentarán liberarse en cuanto se les presente la oportunidad."
 
 building_type_forced_conscription_01: "Reclutamiento Forzoso"
 building_type_forced_conscription_01_desc: "#F Concedes a todos en tu Señorío el honor de servir en tus ejércitos. Por desgracia, esto tiende a sobrecargar la capacidad de tus esbirros para gobernar el condado de verdad.#!"
 building_forced_conscription_01: "Pequeño Esfuerzo de Reclutamiento"
 building_forced_conscription_01_desc: "Un par de tus agentes están ahí fuera, convenciendo a la gente de que morir por ti es en realidad algo bueno."
 building_forced_conscription_02: "Notable Esfuerzo de Reclutamiento"
 building_forced_conscription_02_desc: "Los centros de reclutamiento brotan por todas partes de tu Señorío, y no presentarse no es una opción."
 building_forced_conscription_03: "Enorme Esfuerzo de Reclutamiento"
 building_forced_conscription_03_desc: "Sirven y mueren después, o no lo hacen y mueren ahora."
 
 building_type_night_terror_01: "Cazador Nocturno"
 building_type_night_terror_01_desc: "#F Merodear por la noche con tu manada es tu verdadera naturaleza; no puedes contener el impulso de salir a cazar alguna presa indefensa.#!"
 building_night_terror_01: "Miedo Nocturno"
 building_night_terror_01_desc: "La gente desaparece cuando cedes a tus impulsos. Tu control sobre el condado disminuye, pero tu manada se fortalece."
 building_night_terror_02: "Terror Nocturno"
 building_night_terror_02_desc: "Apenas eres capaz de recobrar el sentido y gobernar tu Señorío entre las vigorizantes cacerías que lideras."
 building_night_terror_03: "Horror Nocturno"
 building_night_terror_03_desc: "Tu manada es la única verdad. Todos los demás son presas que cazar."
 
 building_type_influence_noble_01: "Influir en los Nobles"
 building_type_influence_noble_01_desc: "#F Mediante una mezcla de influencia, chantaje y seducción, puedes controlar a la clase gobernante mortal de este condado. Hacerlo mantendrá a raya a los demás mortales y mantendrá el oro fluyendo.#!"
 building_influence_noble_01: "Influencia Sutil sobre los Nobles"
 building_influence_noble_01_desc: "En este nivel de influencia, has empezado a alterar la cohesión de la clase gobernante, reduciendo su conciencia marcial.\n$POD_requirements_control_25$"
 building_influence_noble_02: "Influencia Significativa sobre los Nobles"
 building_influence_noble_02_desc: "Tu control sobre ellos crece, y las cosas empiezan a volver a la normalidad desde la perspectiva de un observador externo.\n$POD_requirements_control_50$"
 building_influence_noble_03: "Fuerte Influencia sobre los Nobles"
 building_influence_noble_03_desc: "La clase gobernante puede que no lo sepa, pero ahora es tuya. Y nadie sospecha nada.\n$POD_requirements_control_75$"
 building_influence_noble_04: "Influencia Absoluta sobre los Nobles"
 building_influence_noble_04_desc: "Todo el mundo sabe quién dicta realmente las reglas aquí.\n$POD_requirements_control_75$"
 
 building_type_influence_nightwatch_01: "Influir en la Guardia Nocturna"
 building_type_influence_nightwatch_01_desc: "#F La guarnición local podría ser un activo bienvenido para el entrenamiento, y también la alimentación, de tu séquito personal. Tendrás que mover algunos hilos para lograrlo, eso sí.#!"
 building_influence_nightwatch_01: "Influencia Sutil sobre la Guardia Nocturna"
 building_influence_nightwatch_01_desc: "Bajo las narices de la mayoría de los oficiales, y sobornando al resto, tu guardia personal ha empezado a trabajar con la milicia local.\n$POD_requirements_control_25$"
 building_influence_nightwatch_02: "Influencia Significativa sobre la Guardia Nocturna"
 building_influence_nightwatch_02_desc: "Tus hombres son ahora una valiosa "compañía mercenaria" que protege la ciudad con la ayuda de los lugareños. Una situación en la que todos ganan. Al menos, tú.\n$POD_requirements_control_50$"
 building_influence_nightwatch_03: "Fuerte Influencia sobre la Guardia Nocturna"
 building_influence_nightwatch_03_desc: "Apenas puedes distinguir a los hombres locales de los tuyos propios. Todos te sirven de una forma u otra.\n$POD_requirements_control_75$"
 building_influence_nightwatch_04: "Influencia Absoluta sobre la Guardia Nocturna"
 building_influence_nightwatch_04_desc: "¿La guardia nocturna? Responden directamente ante tu gente.\n$POD_requirements_control_75$"
 
 building_type_influence_outriders_01: "Influir en los Batidores"
 building_type_influence_outriders_01_desc: "#F Los guardabosques, exploradores, vigilantes y mensajeros que recorren las afueras del condado pueden ser activos valiosos por un precio.#!"
 building_influence_outriders_01: "Influencia Sutil sobre los Batidores"
 building_influence_outriders_01_desc: "Con algo de dinero en los bolsillos adecuados, la Lealtad de un puñado de batidores te mantendrá, con suerte, informado de los eventos en las fronteras de tu dominio."
 building_influence_outriders_02: "Influencia Significativa sobre los Batidores"
 building_influence_outriders_02_desc:  "Docenas de batidores han caído bajo tu influjo, informándote a ti primero y a su Señor después de los eventos de la región."
 building_influence_outriders_03: "Fuerte Influencia sobre los Batidores"
 building_influence_outriders_03_desc: "La mayoría, si no todos, los vigilantes y guardabosques del dominio responden ante ti antes que ante nadie, y por muy poca paga."
 building_influence_outriders_04: "Influencia Absoluta sobre los Batidores"
 building_influence_outriders_04_desc: "Incluso los temidos Lupinos envidiarían tu conocimiento de las tierras salvajes a estas alturas."
 
 building_type_influence_underworld_01: "Influir en el Inframundo"
 building_type_influence_underworld_01_desc: "#F Podrías sacar mucho de los proscritos de esta zona, ya sea dinero o reclutas experimentados para tu guardia de élite. Aunque agitar a la turba criminal tiene sus inconvenientes.#!"
 building_influence_underworld_01: "Influencia Sutil sobre el Inframundo"
 building_influence_underworld_01_desc: "Ayudar a los criminales ha empezado a resultarte rentable. Pero también ha enfurecido a la población local.\n$POD_requirements_control_25$"
 building_influence_underworld_02: "Influencia Significativa sobre el Inframundo"
 building_influence_underworld_02_desc: "Con tu mano guía, tu banda de rufianes hace menos ruido y más beneficios.\n$POD_requirements_control_50$"
 building_influence_underworld_03: "Fuerte Influencia sobre el Inframundo"
 building_influence_underworld_03_desc: "Has refrenado los peores instintos de tus secuaces tanto como ha sido posible. Ya son casi tan disciplinados como una fuerza de combate regular.\n$POD_requirements_control_75$"
 building_influence_underworld_04: "Influencia Absoluta sobre el Inframundo"
 building_influence_underworld_04_desc: "Los señores del crimen acuden en masa a besar tu anillo metafórico.\n$POD_requirements_control_75$"
 
 building_type_influence_merchant_01: "Influir en los Mercaderes"
 building_type_influence_merchant_01_desc: "#F Los mercaderes son ricos, y tú necesitas oro. La ecuación es sencilla, pero no se rendirán fácilmente.#!"
 building_influence_merchant_01: "Influencia Sutil sobre los Mercaderes"
 building_influence_merchant_01_desc: "Se resisten, refunfuñan y causan problemas. Pero algunos han empezado a pagar tu impuesto completamente legítimo.\n$POD_requirements_control_25$"
 building_influence_merchant_02: "Influencia Significativa sobre los Mercaderes"
 building_influence_merchant_02_desc: "La mayoría de los mercaderes han sido amedrentados, y la disidencia se ha reducido a susurros en callejones traseros.\n$POD_requirements_control_50$"
 building_influence_merchant_03: "Fuerte Influencia sobre los Mercaderes"
 building_influence_merchant_03_desc: "Ahora puedes reunir a los gremios y presentar tu plan de aumento de impuestos, y aun así recibir aplausos atronadores.\n$POD_requirements_control_75$"
 building_influence_merchant_04: "Influencia Absoluta sobre los Mercaderes"
 building_influence_merchant_04_desc: "¡El dinero debe fluir! Hacia tus bolsillos.\n$POD_requirements_control_75$"
 
 building_type_influence_animals_01: "Domesticar a los Animales"
 building_type_influence_animals_01_desc: "#F Donde hay humanos, hay Animales que los visten, alimentan y transportan, les hacen compañía o viven de sus desperdicios. Tu ambición y habilidades abarcan a todos los seres vivos de esta localidad.#!"
 building_influence_animals_01: "Compinches de las Alcantarillas"
 building_influence_animals_01_desc: "Has logrado convertirte en una figura de autoridad entre las alimañas locales, no sin la valiosa ayuda de gatos experimentados en mantenerlas a raya."
 building_influence_animals_02: "Socios del Pastizal"
 building_influence_animals_02_desc: "Tus visitas a los pastos del pueblo dieron sus frutos en forma de confianza y Lealtad del ganado y los perros que lo custodian."
 building_influence_animals_03: "Compañeros de la Perrera"
 building_influence_animals_03_desc: "Asegurar el acceso a las perreras te permitió convertirte en el verdadero amo de los perros de caza. Cazan con la nobleza por deporte, pero trabajan el turno de noche para ti."
 building_influence_animals_04: "Familia del Bosque"
 building_influence_animals_04_desc: "Tu autoridad sobre los Animales de este condado es tan completa que incluso manadas de lobos a leguas de distancia oyeron tu nombre aullado en la noche en tu honor."

 building_type_prince_city_01: "Principado"
 building_type_prince_city_01_desc: "#F Los vampiros son habitantes de la ciudad. Cuanto más grande es la ciudad, más temido y prestigioso es un Vampiro.#!"
 building_prince_city_01: "Príncipe de un Pueblo"
 building_prince_city_01_desc: "Controlas la capital regional de un lugar remoto y "encantador". No es mucho, pero es mejor que nada."
 building_prince_city_02: "Príncipe de un Pueblo Grande"
 building_prince_city_02_desc: "Controlas la capital regional de una aldea apestosa. Los lugareños saben que eres importante por tu llamativa falta de mugre.\n$POD_requirements_development_10$" 
 building_prince_city_03: "Príncipe de una Pequeña Ciudad"
 building_prince_city_03_desc: "Controlas la totalidad de una pequeña ciudad, o una parte menor de una más grande. Es un comienzo.\n$POD_requirements_development_20$"
 building_prince_city_04: "Príncipe de una Ciudad"
 building_prince_city_04_desc: "Tu corte es respetada y admirada, pues gobiernas a tantos mortales.\n$POD_requirements_development_30$"
 building_prince_city_05: "Príncipe de una Ciudad Regional"
 building_prince_city_05_desc: "Una importante ciudad está bajo tu control. Muchos mortales se someten aquí gustosos a tu esclavitud.\n$POD_requirements_development_40$" 
 building_prince_city_06: "Príncipe de una Gran Ciudad Regional"
 building_prince_city_06_desc: "Mortales, reyes y señores de la guerra habitan esta impresionante ciudad. Tú eres su contraparte nocturna.\n$POD_requirements_development_50$"
 building_prince_city_07: "Príncipe de una Ciudad Capital"
 building_prince_city_07_desc: "Aquí se toman decisiones que afectan a un área mucho mayor que esta ciudad. Con razón se te respeta por este potencial de influencia.\n$POD_requirements_development_60$"
 building_prince_city_08: "Príncipe de una Ciudad Nacional"
 building_prince_city_08_desc: "Las palabras de los mortales de aquí llegan lejos y ancho. Las tuyas también.\n$POD_requirements_development_70$"
 building_prince_city_09: "Príncipe de una Metrópolis"
 building_prince_city_09_desc: "Una de las mayores ciudades del mundo vive bajo tu sombra. Tu influencia apenas conoce límites teniéndola en tu dominio.\n$POD_requirements_development_80$"

 building_type_temple_set_01: "Templo de Set"
 building_type_temple_set_01_desc: "#F Aquí te esperan placeres más allá de tus sueños más salvajes. Si estás dispuesto a pagar el precio.#!"
 building_temple_set_01: "Templo Respetable de Set"
 building_temple_set_01_desc: "Has establecido un pequeño y respetable templo al Dios de la Corrupción, y varias almas ya han caído ante su oscuro Abrazo."
 building_temple_set_02: "Templo Grande de Set"
 building_temple_set_02_desc: "La adoración de Set ha regresado en cierta medida a esta tierra, y la corrupción fluye desde su interior."
 building_temple_set_03: "Gran Templo de Set"
 building_temple_set_03_desc: "¡Alabado sea Set! Este templo trae gloria a su oscuro nombre, ¡y tus Esclavos mortales y $pod_cainite$ le rinden honor sin fin!"
 
 building_type_devasthana_01: "Controlar el Devasthana"
 building_type_devasthana_01_desc: "#F La India está atrapada en una guerra santa milenaria para detener a los [Glossary('Asuratizayya','game_concept_kuei_jin_desc')]. Para ganarla, necesitarás fe y una convicción inquebrantable.#!"
 building_devasthana_01: "Devasthana Respetable"
 building_devasthana_01_desc: "Aquí encuentras la fuerza para seguir adelante, bajo la protección de los Devas."
 building_devasthana_02: "Devasthana Grande"
 building_devasthana_02_desc: "Dentro de estos salones, encuentras una fuerza mayor para proteger las tierras de los Devas de los [Glossary('Asuratizayya','game_concept_kuei_jin_desc')]."
 building_devasthana_03: "Gran Devasthana"
 building_devasthana_03_desc: "Los salones de los Devas están a la altura de muchas de las mayores construcciones mortales, un monumento a tu dedicación y al triunfo sobre los [Glossary('Asuratizayya','game_concept_kuei_jin_desc')]."
 
 building_type_brahmavihara_01: "Mentores del Brahmavihara"
 building_type_brahmavihara_01_desc: "#F Tu condición, aunque es solo parte de un Viaje más largo, hace más difícil seguir las enseñanzas de Buda. Podrías necesitar algo de ayuda.#!"
 building_brahmavihara_01: "Upekkha Respetable"
 building_brahmavihara_01_desc: "Mantenerse neutral en toda circunstancia es una prueba adecuada. Es el camino hacia la paz mental, y el Nirvana."
 building_brahmavihara_02: "Gran Upekkha"
 building_brahmavihara_02_desc: "Aquí, la contemplación y la concentración abundan, haciéndote sentir más cerca de la paz. Es maravilloso."
 building_brahmavihara_03: "Gran Upekkha"
 building_brahmavihara_03_desc: "Dentro de este lugar sagrado, encuentras la paz de nuevo. Eso puede ser suficiente. Esto puede ser suficiente."
 
 building_type_chantry_01: "Cofradía"
 building_type_chantry_01_desc: "#F Una congregación de magos no-muertos; los Tremere practican aquí sus artes secretas de Magia de Sangre.#!"
 building_chantry_01: "Cofradía Respetable"
 building_chantry_01_desc: "Aquí yace una pequeña cofradía, con un solo $pod_cainite$ y unos pocos hechiceros bajo tu sección de la pirámide. Es un comienzo."
 building_chantry_02: "Casa Grande"
 building_chantry_02_desc: "Numerosos $pod_cainites$ y un pequeño culto hechiceril yacen aquí, todos Vinculados por Sangre a tu voluntad. Es perfecto."
 building_chantry_03: "Gran Cofradía"
 building_chantry_03_desc: "Aquí, los Antiguos de los Tremere conocen y elogian tu cofradía, mientras te sientas a la cabeza de tu propia Pirámide, más pequeña, una gloria para el Clan y la Casa."

 POD_requirements_rookery: "El [holder|E] debe ser [GetTrait('gargoyle').GetName( GetPlayer )] o [GetScriptedCharacterByHistoryID('790870').GetFirstName]"
 building_type_rookery_01: "Roquedal"
 building_type_rookery_01_desc: "#F Un refugio seguro y punto de reunión de otras #TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L Gárgolas#!#!.#!"
 building_rookery_01: "Roquedal Básico"
 building_rookery_01_desc: "Un pequeño roquedal yace aquí; los recién llegados que se reúnen aquí provienen sobre todo de #TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L Gárgolas#!#! fugitivas que buscan independencia y seguridad.\n\nMuy pocas #TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L Gárgolas#!#! se reúnen o son creadas aquí."
 building_rookery_02: "Roquedal Decente"
 building_rookery_02_desc: "Ahora de un tamaño respetable, el roquedal atrae a llegadas de [GetTrait('gargoyle').GetName(GetNullCharacter)] desde distancias mayores.\n\nAlgunas #TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L Gárgolas#!#! se reúnen o son creadas aquí."
 building_rookery_03: "Roquedal Elaborado"
 building_rookery_03_desc: "Un gran roquedal que muestra verdaderamente la grandeza de las #TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L Gárgolas#!#!.\n\nMuchas #TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L Gárgolas#!#! nuevas se reúnen o son creadas aquí."
 
 building_type_ashirra_mosque_01: "Mezquita Ashirra"
 building_type_ashirra_mosque_01_desc: "#F Una mezquita es el centro de una comunidad Ashirra.#!"
 building_ashirra_mosque_01: "Mezquita"
 building_ashirra_mosque_01_desc: "Aquí el Imán local guía a los fieles en la oración para que sus almas puedan redimirse."
 building_ashirra_mosque_02: "Gran Mezquita"
 building_ashirra_mosque_02_desc: "Muchos musulmanes se reúnen aquí para orar y expresar sus quejas."
 building_ashirra_mosque_03: "Mezquita Magnífica"
 building_ashirra_mosque_03_desc: "La mezquita sirve como lugar de santuario para todos los cainitas sin importar su fe, un lugar de serenidad y devoción."
 
 building_type_underworld_portal_01: "Portal al Inframundo"
 building_type_underworld_portal_01_desc: "#F Al ser uno de los pocos Vampiros con conocimiento del Inframundo, puedes usar su presencia abrumadora en tu beneficio.#!"
 building_underworld_portal_01: "Brecha al Inframundo"
 building_underworld_portal_01_desc: "Los fantasmas son criaturas hambrientas. A tu alrededor, suelen tener hambre específicamente de los Espíritus de tus enemigos."
 
 building_type_pairidaeza_01: "Pairidaeza"
 building_type_pairidaeza_01_desc: "#F Restos de la mayor era de la Persia zoroástrica, estos jardines son un oasis para los Vampiros aferrados a una fe hace tiempo desaparecida.#!"
 building_pairidaeza_01: "Pairidaeza Humilde"
 building_pairidaeza_01_desc: "Un pozo de alimento espiritual en un desierto moral. Un débil eco del pasado."
 building_pairidaeza_02: "Pairidaeza Respetable"
 building_pairidaeza_02_desc: "Un lugar para descansar y recordar la larga edad dorada perdida. El ojo de una tormenta interior."
 building_pairidaeza_03: "Pairidaeza Magnífica"
 building_pairidaeza_03_desc: "Un Señorío oculto de maravillas recuperadas. Un bastión desafiante de una fe olvidada."
 
 building_type_unending_party_01: "Fiesta Sin Fin"
 building_type_unending_party_01_desc: "#F La única forma de sentirse vivo es llevarlo todo al extremo. Todo el tiempo.#!"
 building_unending_party_01: "La Fiesta del Año"
 building_unending_party_01_desc: "Algunos invitados nunca quieren abandonar tu festín. La mayoría, de todos modos, no pueden."
 building_unending_party_02: "Fiesta de la Década"
 building_unending_party_02_desc: "Exceso y gula, lujuria y orgullo fluyen como sangre en estos salones. Es hermoso."
 building_unending_party_03: "Fiesta del Siglo"
 building_unending_party_03_desc: "Un lugar tan encantador, un rostro tan encantador. Tus invitados pueden marcharse cuando quieran, pero nunca pueden irse."
 
 building_type_den_of_screams_01: "Guarida de Gritos"
 building_type_den_of_screams_01_desc: "#F Gritos de dolor y horror se mezclan con aullidos de éxtasis sádico en una sola cacofonía impía en este lugar miserable.#!"
 building_den_of_screams_01: "Guarida de Gritos"
 building_den_of_screams_01_desc: "Aquí se practican la tortura y el asesinato con una diligencia rayana en la piedad."
 building_den_of_screams_02: "Guarida de Horrores"
 building_den_of_screams_02_desc: "La crueldad y la creatividad de los espantosos rituales realizados aquí redefinen la noción del sufrimiento."
 building_den_of_screams_03: "Guarida de la Locura"
 building_den_of_screams_03_desc: "Un mero intento de describir el tipo de maldad que tiene lugar aquí dañaría irreparablemente el espíritu de ambas partes en semejante intercambio de información."
 
 building_type_summoning_chamber_01: "Cámara de Invocación"
 building_type_summoning_chamber_01_desc: "#F Los favores de los caídos no llegan fácil ni baratos. Se requiere una preparación adecuada para solicitarlos con cierta apariencia de seguridad.#!"
 building_summoning_chamber_01: "Cámara de Invocación"
 building_summoning_chamber_01_desc: "Un lugar adecuado para intentar contactar con los Espíritus caídos en privado."
 building_summoning_chamber_02: "Salón de Invocación"
 building_summoning_chamber_02_desc: "Aquí se celebran ceremonias impías para asegurar pactos con los oscuros habitantes de los reinos espirituales."
 building_summoning_chamber_03: "Terrenos de Invocación"
 building_summoning_chamber_03_desc: "Una embajada clandestina para los reinos más oscuros de los mundos exteriores."
 
 building_type_fallen_church_01: "Iglesia de los Caídos"
 building_type_fallen_church_01_desc: "#F Tu alma se perdió hace mucho. Así que, aquí, te aseguras de salvar el alma de los demás. Les guste o no.#!"
 building_fallen_church_01: "Santuario de los Caídos"
 building_fallen_church_01_desc: "Tantos gritos se han oído aquí, tantas súplicas de piedad. Y, al final, tan poca redención."
 building_fallen_church_02: "Templo de los Caídos"
 building_fallen_church_02_desc: "Los clamores contra el terror de la creación se oyen aquí en abundancia. Empieza a importar."
 building_fallen_church_03: "Catedral de los Caídos"
 building_fallen_church_03_desc: "Dentro de esta gran catedral, los susurros y esperanzas de salvación ya han impregnado estos muros, pues ahora son el más sagrado de los lugares santos."
 
 building_type_land_nexus_01: "Nexo de la Tierra"
 building_type_land_nexus_01_desc: "#F Un punto focal para que un Koldun extraiga las energías de los Espíritus de la tierra para amplificar su hechicería.#!"
 building_land_nexus_01: "Nexo Menor de la Tierra"
 building_land_nexus_01_desc: "Un punto focal adecuado, aunque sencillo, para los Espíritus de la tierra."
 building_land_nexus_02: "Nexo Mayor de la Tierra"
 building_land_nexus_02_desc: "Un punto focal más grande donde la energía fluye constantemente hacia y desde el Koldun."
 building_land_nexus_03: "Gran Nexo de la Tierra"
 building_land_nexus_03_desc: "Un gran punto focal para la Hechicería Koldúnica. Este nexo se ha convertido en un pozo de gran poder para su maestro Koldun."
 
 building_type_mother_garden_01: "Jardín de Lilith"
 building_type_mother_garden_01_desc: "#F El verdadero Edén solo se encuentra en la adoración de la primera mujer, la traicionada por Adán, Caín y el propio Dios.#!"
 building_mother_garden_01: "Jardín de la Doncella"
 building_mother_garden_01_desc: "Como la Doncella, Lilith incita a otros a encontrar la verdad oculta tras los velos de la realidad."
 building_mother_garden_02: "Jardín de la Madre"
 building_mother_garden_02_desc: "Como la Madre, Lilith nos incita a traer nuevas verdades, mediante la ruptura de las cadenas de la complacencia."
 building_mother_garden_03: "Jardín de la Anciana"
 building_mother_garden_03_desc: "Como la Anciana, Lilith nos incita a aceptar la inevitabilidad de la muerte, y aquí, somos esa inevitabilidad."
 
 building_type_legacies_gathering_01: "Asamblea de los Legados"
 building_type_legacies_gathering_01_desc: "#F La mayoría de las veces, los Laibon prefieren hablar las cosas antes de actuar precipitadamente. Organizar tal asamblea es una tarea prestigiosa.#!"
 building_legacies_gathering_01: "Gran Asamblea"
 building_legacies_gathering_01_desc: "Un número respetable de representantes dinásticos se reúnen aquí, debatiendo sobre el futuro de la región y más allá."
 
 building_type_lordly_manor_01: "Mansión Señorial"
 building_type_lordly_manor_01_desc: "#F Una impresionante mansión digna de un señor de la tierra.#!"
 building_lordly_manor_01: "Mansión Respetable"
 building_lordly_manor_01_desc: "Donde se toman decisiones, se traman Intrigas y se dictan sentencias. Con suerte, por ti."
 building_type_lordly_manor_02_desc: "#F Una impresionante mansión digna de un señor de la tierra.#!"
 building_lordly_manor_02: "Solar Grande"
 building_lordly_manor_02_desc: "Un hogar respetable, donde se forjan tus maquinaciones y planes, lejos de ojos y oídos indiscretos."
 building_lordly_manor_03: "Gran Mansión"
 building_lordly_manor_03_desc: "El palacio de cuchillos y palabras envenenadas; aquí te sientas como la araña en el centro de una enorme telaraña."
 
 building_type_influence_people_01: "Influir en el Pueblo"
 building_type_influence_people_01_desc: "#F De lo mejor a lo peor, la humanidad lo es todo. Por ello, puedes entrelazarte con cada capa de la sociedad y aprender de ella.#!"
 building_influence_people_01: "Influencia Popular Sutil"
 building_influence_people_01_desc: "Cada noche aprendes algo más al compartir tu vida con los humanos. Te recuerda cómo no convertirte en un monstruo."
 building_influence_people_02: "Influencia Popular Fuerte"
 building_influence_people_02_desc: "Cada noche aprendes algo más al compartir tu vida con los humanos. Te recuerda cómo no convertirte en una Bestia."
 building_influence_people_03: "Influencia Popular Absoluta"
 building_influence_people_03_desc: "Cada noche aprendes algo más al compartir tu vida con los humanos. Te recuerda cómo volver a ser humano."
 
 building_type_influence_clergy_01: "Influir en el Clero"
 building_type_influence_clergy_01_desc: "#F El clero son los pastores de la humanidad, y controlar a los pastores significa controlar a las ovejas.#!"
 building_influence_clergy_01: "Influencia Sutil sobre el Clero"
 building_influence_clergy_01_desc: "Tener a los predicadores locales en tu bolsillo puede ser muy útil."
 building_influence_clergy_02: "Influencia Significativa sobre el Clero"
 building_influence_clergy_02_desc: "Sustanciosas "donaciones" a las autoridades religiosas locales aseguran que disfrutes de buena reputación en la comunidad."
 building_influence_clergy_03: "Fuerte Influencia sobre el Clero"
 building_influence_clergy_03_desc: "Aprendes mucho de los Hombres Santos, y mucho más de los hombres perversos. Solo debes asegurarte de entender la diferencia a veces."
 building_influence_clergy_04: "Influencia Absoluta sobre el Clero"
 building_influence_clergy_04_desc: "¿Son los hombres de Dios que te obedecen a ti antes que a su Dios realmente algo más que otra manada de lacayos? Si es así, no es el peor problema que se puede tener."
 
 building_type_eternal_parish_01: "Parroquia Eterna"
 building_type_eternal_parish_01_desc: "#F Donde se validan las creencias de los Vástagos que se consideran Hijos de Dios.#!"
 building_eternal_parish_01: "Parroquia Eterna"
 building_eternal_parish_01_desc: "Donde se predican sermones para todos los hijos de Dios."
 building_eternal_parish_02: "Diócesis Eterna"
 building_eternal_parish_02_desc: "Donde todos los hijos de Dios son iguales ante la ley eclesiástica."
 building_eternal_parish_03: "Sínodo Eterno"
 building_eternal_parish_03_desc: "Donde la doctrina de la fe se escribe teniendo en cuenta a todos los hijos de Dios."
 
 building_type_crypt_01: "Cripta"
 building_type_crypt_01_desc: "#F Tu trabajo requiere una ubicación y unos suministros adecuados. Y, preferiblemente, también un lugar muy tranquilo y apartado donde los vecinos no se quejen.#!"
 building_crypt_01: "Cripta Respetable"
 building_crypt_01_desc: "Solo en la oscuridad, rodeado de algunos de los muertos más recientes y los huesos más antiguos. Necesita trabajo, pero servirá por ahora."
 building_crypt_02: "Gran Cripta"
 building_crypt_02_desc: "Solo en la oscuridad, rodeado de una cantidad respetable de cuerpos y esqueletos. Ahora vas llegando a algo."
 building_crypt_03: "Cripta Magnífica"
 building_crypt_03_desc: "Solo en la oscuridad, rodeado de cadáveres y Abominaciones en descomposición. La definición del paraíso."
 
 building_type_assassins_cell_01: "Célula de Asesinos"
 building_type_assassins_cell_01_desc: "#F Los Hijos de Haqim tienen una vasta red de agentes, informantes y otras herramientas útiles en todos los rincones del mundo.#!"
 building_assassins_cell_01: "Célula Pequeña"
 building_assassins_cell_01_desc: "La pequeña presencia haqimita en esta zona te permite contar con un respaldo muy útil para tus objetivos más... turbios."
 building_assassins_cell_02: "Célula Grande"
 building_assassins_cell_02_desc: "La gran presencia haqimita en esta zona te permite contar con un respaldo muy útil para tus objetivos más... turbios."
 building_assassins_cell_03: "Célula Magna"
 building_assassins_cell_03_desc: "La enorme presencia haqimita en esta zona te garantiza un respaldo extremadamente útil para tus objetivos más... turbios. Con lo que tienes aquí, sabes que triunfarás."
 
 building_type_alamut_01: "Alamut"
 building_type_alamut_01_desc: "#F La temida fortaleza oculta del $pod_clan$ [GetTrait('assamite').GetName(GetNullCharacter)] es un baluarte de fe, fuerza y mentiras.#!"
 building_alamut_01: "Alamut Dividido"
 building_alamut_01_desc: "Como el propio $pod_clan$ [GetTrait('assamite').GetName(GetNullCharacter)], Alamut se encuentra dividido entre las castas. Se necesitará una inversión considerable para sanar este cisma."
 building_alamut_02: "Alamut Sanado"
 building_alamut_02_desc: "Aunque todavía se oyen y ven palabras duras y puñales por la espalda, los peores estallidos de violencia han sido desterrados de estos muros sagrados."
 building_alamut_03: "Alamut, Nido del Águila"
 building_alamut_03_desc: "Al menos aquí, el $pod_clan$ [GetTrait('assamite').GetName(GetNullCharacter)] muestra su perfecta cohesión y devoción a un propósito único, convirtiéndolo en una fuerza aterradora con la que lidiar."
 
 building_type_rome_01: "Roma"
 building_type_rome_01_desc: "#F Roma fue tanto el centro del mundo $pod_cainite$ como del humano. Restaurarla a la grandeza no-muerta sería un logro tremendo.#!"
 building_rome_01: "Roma Mortal"
 building_rome_01_desc: "Los Hombres Santos merodean por las calles, disputando cualquier intento de control directo sobre el centro del mundo europeo. En esta etapa, Roma es un título prestigioso para su dueño, nada más."
 building_rome_02: "Roma Dividida"
 building_rome_02_desc: "Lentamente, la fe de Roma es erosionada, y los Vampiros pueden usar nuevamente su sutil influencia para beneficio del príncipe."
 building_rome_03: "Roma Eterna"
 building_rome_03_desc: "Finalmente, Roma está de vuelta en manos vampíricas. Los Hombres Santos se acobardan en la oscuridad mientras los hijos de Caín cantan alabanzas al gran gobernante que ha conquistado la ciudad santa."
 
 building_type_ceoris_01: "Ceoris"
 building_type_ceoris_01_desc: "#F La poderosa fortaleza de los [GetTrait('tremere').GetName(GetNullCharacter)] es a la vez un bastión y un centro de aprendizaje. Es el mejor activo del asediado $pod_clan$ de Magos.#!"
 building_ceoris_01: "Ceoris Dividida"
 building_ceoris_01_desc: "Algunos [GetTrait('tremere').GetName(GetNullCharacter)] siguen siendo mortales en la cofradía. Sospechan de juego sucio por parte de los Vampiros conspiradores y son un obstáculo constante para los planes del Consejo."
 building_ceoris_02: "Ceoris Controlada"
 building_ceoris_02_desc: "A medida que sus homólogos mortales desaparecen o son convertidos, los miembros de la Casa [GetTrait('tremere').GetName(GetNullCharacter)] pueden por fin aprovechar todo el potencial de Ceoris."
 building_ceoris_03: "Ceoris Inexpugnable"
 building_ceoris_03_desc: "Mientras esta poderosa fortaleza siga en pie, el $pod_clan$ [GetTrait('tremere').GetName(GetNullCharacter)] no puede caer. Es decir, al menos desde fuera..."
 
 building_type_carthage_01: "Cartago"
 building_type_carthage_01_desc: "#F El Sueño del $pod_clan$ [GetTrait('brujah').GetName(GetNullCharacter)] lleva mucho tiempo muerto, enterrado por los vengativos [GetTrait('ventrue').GetName(GetNullCharacter)]. Pero ¿pueden los sueños morir de verdad?#!"
 building_carthage_01: "Reconstruyendo Cartago"
 building_carthage_01_desc: "Una firme declaración al mundo: reconstruir la ciudad de Troile será un asunto costoso. Pero las recompensas, y los peligros, podrían ser igual de grandes."
 building_carthage_02: "Nueva Cartago"
 building_carthage_02_desc: "La peor pesadilla de los $pod_cainites$ romanos vuelve a la vida bajo tu firme liderazgo. No volverá a caer."
 building_carthage_03: "Cartago, Sueño de los Brujah"
 building_carthage_03_desc: "Un faro de Iluminación y una visión de cooperación entre mortales y $pod_cainites$ vuelve a ser visible aquí."
 
 building_type_ombos_temple_01: "Templo Fundacional de Ombos"
 building_type_ombos_temple_01_desc: "#F El extravagante corazón del $pod_clan$ [GetTrait('setite').GetName(GetNullCharacter)], Ombos es también, según se dice, el último lugar de descanso de Set.#!"
 building_ombos_temple_01: "Ombos Eclipsado"
 building_ombos_temple_01_desc: "En tiempos recientes, los #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Setitas#!#! más jóvenes ven a Ombos como una reliquia de una era pasada, cuestionando su legitimidad."
 building_ombos_temple_02: "Ombos en Recuperación"
 building_ombos_temple_02_desc: "Reformas y reconstrucciones han devuelto al templo a la vanguardia de la era actual."
 building_ombos_temple_03: "Ombos Imponente"
 building_ombos_temple_03_desc: "Centro indiscutido de toda una religión, Ombos es una cuna de pensamiento, culto y Conjuras. Como siempre lo ha sido."

 building_type_erciyes_01: "Erciyes"
 building_type_erciyes_01_desc: "#F La fortaleza montañosa del $pod_clan$ [GetTrait('cappadocian').GetName(GetNullCharacter)] fue arrebatada a los #TOOLTIP:GAME_TRAIT,malkavian,[GetNullCharacter] #L Malkavian#!#! durante la Edad Clásica. Desde entonces, ha sido un centro de aprendizaje y meditación.#!"
 building_erciyes_01: "Erciyes Aislada"
 building_erciyes_01_desc: "Lejos de... todo, en realidad, Erciyes es un lugar perfecto para la contemplación. Por desgracia, suele hacer que sus huéspedes pasen por alto las amenazas del exterior."
 building_erciyes_02: "Erciyes Abierta"
 building_erciyes_02_desc: "A medida que las mentalidades cambian y el mundo exterior logra abrirse paso en la fortaleza, Erciyes se convierte en un centro de aprendizaje mundano."
 building_erciyes_03: "Erciyes, Monasterio de las Sombras"
 building_erciyes_03_desc: "Ahora tanto un respiro como el centro de todo un $pod_clan$, la fortaleza montañosa experimenta una actividad continua, pero controlada, dentro de sus muros."
 
 building_type_cathedral_of_flesh_01: "Catedral de Carne"
 building_type_cathedral_of_flesh_01_desc: "#F Esta absoluta Abominación fue esculpida a lo largo de un milenio con la carne de campesinos, esclavos, rivales, Bestias y cualquier número de otras víctimas incorporadas a los muros palpitantes y supurantes.#!"
 building_cathedral_of_flesh_01: "Catedral Hostil"
 building_cathedral_of_flesh_01_desc: "Corrompida por la propia tierra, la Catedral es tan enemiga de cualquier intruso como de su propio dueño. Y perder la batalla significa convertirse en parte de ella."
 building_cathedral_of_flesh_02: "Catedral Hirviente"
 building_cathedral_of_flesh_02_desc: "La influencia de Kupala retrocede un poco, mientras la monstruosa creación empieza a obedecer a su dueño."
 building_cathedral_of_flesh_03: "Catedral Sometida"
 building_cathedral_of_flesh_03_desc: "Kupala parece haber desaparecido, por ahora. La Catedral se ha convertido en el instrumento de puro Temor que cualquier Koldunista loco soñaría con empuñar."
 
 building_type_castel_del_ombro_01: "Castel d'Ombro"
 building_type_castel_del_ombro_01_desc: "#F Es imposible distinguir a distancia de qué están hechos los muros, porque sombras animadas se arrastran por cada superficie en un flujo apenas visible. Mareas de sombra emergen de las profundidades tras la puesta de sol cada noche y envuelven el castillo en un patrón generalmente en espiral, invirtiéndose después de medianoche para drenarse gradualmente.#!"
 building_castel_del_ombro_01: "Tumba de las Sombras"
 building_castel_del_ombro_01_desc: "Lugar de descanso del propio [Glossary('Antediluviano','game_concept_antediluvian_desc')], el castillo es un lugar espantoso, un recordatorio del aire de lo antinatural que rodea a cada [GetTrait('lasombra').GetName(GetNullCharacter)]."
 building_castel_del_ombro_02: "Castillo de las Sombras"
 building_castel_del_ombro_02_desc: "Centro de la corte de sangre, el castillo sirve como instrumento judicial para los Antiguos del $pod_clan$."
 building_castel_del_ombro_03: "Castillo Abierto"
 building_castel_del_ombro_03_desc: "La apertura de las puertas significa que el propio Lasombra ha abandonado el castillo. Durante este tiempo, el aire de locura a su alrededor se desvanece un poco, dejando que el lugar sirva como centro político del $pod_clan$."
 
 building_type_rabble_thugs_01: "Influir en la Chusma y los Matones"
 building_type_rabble_thugs_01_desc: "#F A veces debes olvidar tu orgullo y tratar con mortales de mala reputación para conseguir con rapidez el respaldo tan necesario.#!"
 building_rabble_thugs_01: "Influencia Sutil sobre la Chusma"
 building_rabble_thugs_01_desc: "A muchas personas nadie las echará de menos. Son el tipo de gente que puedes usar para crear apresuradamente una fuerza de combate."
 building_rabble_thugs_02: "Influencia Significativa sobre la Chusma"
 building_rabble_thugs_02_desc: "La chusma callejera es de poca utilidad en los campos de batalla de la noche. Pero a veces no puedes ser exigente.\n$POD_requirements_development_5$"
 building_rabble_thugs_03: "Fuerte Influencia sobre la Chusma"
 building_rabble_thugs_03_desc: "Numerosos y con al menos un mínimo de experiencia en combate, los proscritos sirven como buena carne de cañón.\n$POD_requirements_development_15$"
 building_rabble_thugs_04: "Influencia Absoluta sobre la Chusma"
 building_rabble_thugs_04_desc: "Nadie los echará de menos, ni siquiera tú.\n$POD_requirements_development_20$"
 
 building_type_forest_people_01: "Gente del Bosque"
 building_type_forest_people_01_desc: "#F Tus cazaderos se encuentran fuera de los límites del pueblo, y la gente que habita esas afueras es en quien deberás apoyarte, ya sea como peones o como presas.#!"
 building_forest_people_01: "Acechando a los Pastores"
 building_forest_people_01_desc: "Las historias de una figura bestial acechando en lo salvaje no impresionan mucho a la gente de la ciudad, pero quienes pasan muchas noches donde pasta su ganado han aprendido a temerte y obedecerte."
 building_forest_people_02: "Presionando a los Cazadores Furtivos"
 building_forest_people_02_desc: "Esta tierra salvaje solo tiene un depredador supremo, y no es ningún noble mortal. A diferencia de él, tú estás dispuesto a compartir con quienes te juren Lealtad."
 building_forest_people_03: "Convenciendo a los Bandidos"
 building_forest_people_03_desc: "Hay suficiente gente viajando hacia y desde este pueblo como para convertir el cazarlos en un trabajo de equipo, siempre que quienes deseen participar entiendan quién manda."
 
 building_type_forest_treasures_01: "Tesoros del Bosque"
 building_type_forest_treasures_01_desc: "#F La naturaleza salvaje fue una vez el hogar de todos nosotros, y aún quedan quienes no han cambiado el conocimiento necesario para prosperar en ella por las comodidades de la civilización. Pondrás sus habilidades a tu servicio.#!"  
 building_forest_treasures_01: "Botín de la Maleza"
 building_forest_treasures_01_desc: "Hace falta un ojo agudo y un conocimiento íntimo del bosque para ganarse la vida recolectando sus riquezas. Te has asegurado de que quienes las poseen estén dispuestos a compartirlas."
 building_forest_treasures_02: "Todo lo que Corretea"
 building_forest_treasures_02_desc: "La naturaleza salvaje habla con incontables voces, todas ellas testimonio de su capacidad para sostener la vida. Has trabado una estrecha amistad con quienes saben escucharlas."
 building_forest_treasures_03: "Caza Mayor"
 building_forest_treasures_03_desc: "Solo los verdaderos maestros del bosque pueden entrar en la eterna carrera armamentística entre depredador y presa que allí tiene lugar y salir con un premio. De quienes cazan aquí, ninguno se atrevería a negarte tu parte."
 
 building_type_forest_paths_01: "Sendas del Bosque"
 building_type_forest_paths_01_desc: "#F Lo salvaje puede parecer un laberinto sembrado de obstáculos impenetrables para los forasteros, pero para ti se convertirá en una fortaleza ricamente dotada de pasadizos ocultos y atajos secretos.#!"
 building_forest_paths_01: "Cañones y Barrancos"
 building_forest_paths_01_desc: "El curso del agua, pasado y presente, crea la red de caminos naturales del bosque. Quienes la conocen de memoria no tienen problema en burlar a los intrusos."
 building_forest_paths_02: "Cuevas y Túneles"
 building_forest_paths_02_desc: "Muchas criaturas del bosque reclaman su dominio bajo tierra, cavando guaridas y madrigueras que a menudo se conectan en intrincadas redes de túneles. Quienes aprendieron a imitarlas y sacar provecho de su trabajo nunca tienen que librar una batalla que no eligieron."
 building_forest_paths_03: "Autopista de las Copas"
 building_forest_paths_03_desc: "Donde el bosque es más denso y el cielo queda oculto tras ramas enzarzadas en una antigua contienda por la luz del sol, los depredadores más ágiles pueden acechar a sus presas desde arriba, moviéndose inadvertidos en lo alto de las copas."
 
 building_type_sherwood_01: "Bosque de Sherwood"
 building_type_sherwood_01_desc: "#F Fue aquí donde nació el movimiento Furores y donde prosperaría durante siglos. Un respiro duramente ganado frente a los tiranos de la noche.#!"
 building_sherwood_01: "Sherwood Controlado"
 building_sherwood_01_desc: "Robin Leeland arrebató Sherwood de las mismas narices de Mithras y lo mantuvo durante siglos. Esta hazaña atrevida contra un tirano tan antiguo inspira a los Furores a reunirse y luchar con más fuerza por la causa."
 building_sherwood_02: "Sherwood en Expansión"
 building_sherwood_02_desc: "Los hombres y mujeres libres de Sherwood ahora llevan la lucha más allá del bosque, haciendo que Robin se sienta orgulloso de sus discípulos."
 building_sherwood_03: "Sherwood Triunfante"
 building_sherwood_03_desc: "Por doquier, los tiranos tiemblan con solo mencionar a los valientes defensores de Sherwood, verdugos de déspotas y guerreros de la libertad."
 
 building_type_salianna_court_01: "Corte del Amor"
 building_type_salianna_court_01_desc: "#F Una Corte del Amor es un lugar dedicado al amor mismo, y a su estudio desapasionado por el corazón muerto del vampiro.#!"
 building_salianna_court_01: "Pequeña Corte del Amor"
 building_salianna_court_01_desc: "Instaladas en zonas prestigiosas o emblemáticas de Francia, las Cortes del Amor son famosas por su enfoque en las mortales Intrigas amorosas."
 building_salianna_court_02: "Gran Corte del Amor"
 building_salianna_court_02_desc: "Muchos jóvenes Caballeros acuden en masa a la prestigiosa Corte, con la esperanza de gloria y fama. La mayoría solo se marchan cuando las mortíferas criaturas del interior los han esclavizado por completo."
 building_salianna_court_03: "Corte del Amor Dominante"
 building_salianna_court_03_desc: "El corazón político de la Francia $pod_cainite$ no es para los pusilánimes, e incluso vampiros experimentados han caído presa de sus mortales juegos."
 
 building_type_shrine_of_telyavel_01: "Santuario de Telyavel"
 building_type_shrine_of_telyavel_01_desc: "#F El dios herrero no está interesado en los asuntos mortales, ni inmortales. A menos que se pague el precio adecuado...#!"
 building_shrine_of_telyavel_01: "Santuario Simbólico de Telyavel"
 building_shrine_of_telyavel_01_desc: "Sin la bendición del Dios, este santuario sigue siendo un poderoso grito de guerra para un mundo Pagano moribundo."
 building_shrine_of_telyavel_02: "Santuario Despierto de Telyavel"
 building_shrine_of_telyavel_02_desc: "El dios herrero observa a sus fieles, intrigado por su renovado compromiso con su causa."
 building_shrine_of_telyavel_03: "Arboleda de las Sombras"
 building_shrine_of_telyavel_03_desc: "Ahora un vínculo directo con el propio Señorío del Dios, muchos campeones vienen aquí a ganar su bendición divina."
 
 building_type_giovanni_mausoleum_01: "Mausoleo Giovanni"
 building_type_giovanni_mausoleum_01_desc: "#F Muchas personas entran aquí. Muy pocas salen.#!"
 building_giovanni_mausoleum_01: "Pequeño Mausoleo Giovanni"
 building_giovanni_mausoleum_01_desc: "La familia [GetTrait('giovanni').GetName(GetNullCharacter)] todavía es joven en la noche, y sigue muy centrada en sus estudios sobre la muerte y el alma."
 building_giovanni_mausoleum_02: "Mausoleo Giovanni Respetable"
 building_giovanni_mausoleum_02_desc: "Lentamente, los Nigromantes empiezan a mirar hacia el exterior, interesados en las oportunidades que ofrece su nueva condición."
 building_giovanni_mausoleum_03: "Mausoleo Giovanni Inmenso"
 building_giovanni_mausoleum_03_desc: "Los italianos son ahora una fuerza a tener en cuenta. Siguen siendo poderosos nigromantes, pero también son capaces de jugar el juego político."
 
 building_type_pit_of_malkav_01: "Fosa de Malkav"
 building_type_pit_of_malkav_01_desc: "#F Una grieta abierta yace bajo Jerusalén. Incluso acercarse resulta doloroso. Sientes como si tu cabeza fuera a estallar.#!"
 building_pit_of_malkav_01: "Fosa Abierta de Malkav"
 building_pit_of_malkav_01_desc: "Tantas voces diciendo tantas cosas contradictorias... aunque todavía puedes vislumbrar un tenue destello de sabiduría en algunas de ellas."
 building_pit_of_malkav_02: "Fosa Oculta de Malkav"
 building_pit_of_malkav_02_desc: "Has arrojado piedras a la fosa y las voces son ahora menos frenéticas. Ahora puedes entenderlas mejor."
 building_pit_of_malkav_03: "Fosa Cerrada de Malkav"
 building_pit_of_malkav_03_desc: "Las voces ahora están calladas, a menos que estés muy cerca de la propia fosa. Estar cerca de ella te permite ahora separar la locura de la perspicacia con facilidad."
 
 building_type_well_of_sacrifice_01: "Pozo del Sacrificio"
 building_type_well_of_sacrifice_01_desc: "#F Si el Infierno está en la Tierra, es justo aquí.#!"
 building_well_of_sacrifice_01: "Pequeño Pozo del Sacrificio"
 building_well_of_sacrifice_01_desc: "Una vez arrojados al pozo, dejan de llorar. Eso te entristece."
 building_well_of_sacrifice_02: "Gran Pozo del Sacrificio"
 building_well_of_sacrifice_02_desc: "Se necesitan muchos más para alimentar el vacío eterno y su Ansia sin fin."
 building_well_of_sacrifice_03: "Pozo Infernal del Sacrificio"
 building_well_of_sacrifice_03_desc: "Pronto Ellos despertarán. Pronto Ellos vendrán. Y entonces, todos comprenderán."
 
 building_type_london_mithraeum_01: "Mitreo de Londres"
 building_type_london_mithraeum_01_desc: "#F Uno de los templos más antiguos de la fe mitraica, mantenido relevante todavía por los seguidores del Dios Sol.#!"
 building_london_mithraeum_01: "Mitreo Oculto"
 building_london_mithraeum_01_desc: "Temerosos de la Cruz, los fieles se congregan a la sombra de su antigua gloria."
 building_london_mithraeum_02: "Mitreo Resurgente"
 building_london_mithraeum_02_desc: "Ahora es un secreto a voces que los fieles de Mitra rezan aquí, buscando la salvación prometida por el Dios de la Luz."
 building_london_mithraeum_03: "Mitreo Triunfante"
 building_london_mithraeum_03_desc: "¡Ha llegado la hora de que la Cruz se oculte, pues la Fe Verdadera de estas tierras ha regresado!"
 
 building_type_northern_throne_01: "El Trono del Norte"
 building_type_northern_throne_01_desc: "#F Un símbolo de la autoridad [GetTrait('tzimisce').GetName(GetNullCharacter)] que se extiende más allá de Carpatia.#!"
 building_northern_throne_01: "El Trono del Norte"
 building_northern_throne_01_desc: "Esta metrópolis regional está bajo el control total y exclusivo de su hegemón [GetTrait('tzimisce').GetName(GetNullCharacter)]. El gobierno de hierro representa un nuevo estándar en la búsqueda de dominio de los Malditos, exigiendo así el respeto del $pod_clan$."
 
 building_type_influence_law_01: "Influir en los Legisladores"
 building_type_influence_law_01_desc: "#F Obviamente, estás por encima de la ley mortal. Pero tener agentes entre las fuerzas que mantienen el orden público en este condado podría ser beneficioso.#!"
 building_influence_law_01: "Influencia Sutil sobre los Legisladores"
 building_influence_law_01_desc: "Una sugerencia aquí y allá en el oído adecuado puede servir de mucho para mantener contenta a la gente común."
 building_influence_law_02: "Influencia Significativa sobre los Legisladores"
 building_influence_law_02_desc: "Tienes una fuerte influencia sobre el sistema judicial aquí. Lo bastante fuerte como para usarla de muchas formas."
 building_influence_law_03: "Fuerte Influencia sobre los Legisladores"
 building_influence_law_03_desc: "Lo has adivinado: a estas alturas, tú eres la ley."
 building_influence_law_04: "Influencia Absoluta sobre los Legisladores"
 building_influence_law_04_desc: "Ser la ley es aburrido. ¿Por qué no crear la tuya propia?"
 
 #building_type_haven_defenses_01: "Haven Defenses"
 #building_type_haven_defenses_01_desc: "#F It's not mere paranoia, your enemies will come for you one night. And you better have a contingency plan when that happens.#!"
 #building_haven_defenses_01: "Subtle Haven Defenses"
 #building_haven_defenses_01_desc: "Some traps and reliable agents dispersed across the county are a good start to any strong defense."
 #building_haven_defenses_02: "Strong Haven Defenses"
 #building_haven_defenses_02_desc: "You are prepared for the worst to come, your contingency plan has a contingency plan of its own."
 #building_haven_defenses_03: "Overwhelming Haven Defenses"
 #building_haven_defenses_03_desc: "They will have to bring an entire raiding party to bring you down!"
 #building_haven_defenses_04: "Perfect Haven Defenses"
 #building_haven_defenses_04_desc: "These pesky adventurers will never survive your dungeon!"
 #
 #building_type_remote_haven_01: "Remote Haven"
 #building_type_remote_haven_01_desc: "#F Sometimes, you have just to take a step back to plan your next move, far away from prying eyes.#!"
 #building_remote_haven_01: "Sparse Remote Haven"
 #building_remote_haven_01_desc: "This haven is far away from every hint of civilization. That's probably its only perk."
 #building_remote_haven_02: "Comfy Remote Haven"
 #building_remote_haven_02_desc: "This isn't your court, but still good enough for a short vacation."
 #building_remote_haven_03: "Luxurious Remote Haven"
 #building_remote_haven_03_desc: "Your home away from home, perfectly safe and suitably prepared for your exquisite tastes."
 #building_remote_haven_04: "Opulent Remote Haven"
 #building_remote_haven_04_desc: "Ancient Roman senators would blush at what happen behind these walls."
 
 building_type_influence_mercenaries_01: "Influir en los Mercenarios"
 building_type_influence_mercenaries_01_desc: "#F Los mortales han desarrollado la idea de los "Mercenarios", soldados experimentados de alquiler. Sin duda algo que puedes usar en tu propio beneficio.#!"
 building_influence_mercenaries_01: "Influencia Sutil sobre los Mercenarios"
 building_influence_mercenaries_01_desc: "Tienes algunos contactos en un grupo local. Suficientes para darte algunas opciones."
 building_influence_mercenaries_02: "Influencia Significativa sobre los Mercenarios"
 building_influence_mercenaries_02_desc: "Puedes contar con un grupo experimentado de soldados mortales para defender tus intereses en esta zona."
 building_influence_mercenaries_03: "Fuerte Influencia sobre los Mercenarios"
 building_influence_mercenaries_03_desc: "Los mercenarios de aquí son ahora tu ejército de defensa privado."
 building_influence_mercenaries_04: "Influencia Absoluta sobre los Mercenarios"
 building_influence_mercenaries_04_desc: "¿Se les puede seguir llamando mercenarios a estas alturas? Es difícil saberlo."
 
 building_type_influence_barracks_01: "Influir en los Cuarteles"
 building_type_influence_barracks_01_desc: "#F Los ejércitos profesionales están resurgiendo en la sociedad mortal. Una rara oportunidad para que los $pod_cainites$ atraigan a su causa a algunos guerreros experimentados.#!"
 building_influence_barracks_01: "Influencia Sutil sobre los Cuarteles"
 building_influence_barracks_01_desc: "Algunos de los soldados de la zona están a tu servicio. Son aliados útiles en tiempos difíciles."
 building_influence_barracks_02: "Influencia Significativa sobre los Cuarteles"
 building_influence_barracks_02_desc: "La mayor parte del ejército regional conoce tu nombre, o trabaja para alguien que lo conoce."
 building_influence_barracks_03: "Fuerte Influencia sobre los Cuarteles"
 building_influence_barracks_03_desc: "El ejército local sabe quién es su verdadero amo. Y desde luego no es algún noble local pomposo."
 building_influence_barracks_04: "Influencia Absoluta sobre los Cuarteles"
 building_influence_barracks_04_desc: "¡Ahora puedes jugar a la guerra con gente viva!"
 
 building_type_influence_burghers_01: "Influir en los Burgueses"
 building_type_influence_burghers_01_desc: "#F Una nueva clase social está surgiendo en el mundo mortal. Estos "burgueses" tienen mucho dinero pero poco poder militar real. Un objetivo perfecto para tus tratos en la sombra.#!"
 building_influence_burghers_01: "Influencia Sutil sobre los Burgueses"
 building_influence_burghers_01_desc: "Has hecho algunas incursiones iniciales en la clase mercantil de esta zona.\n$POD_requirements_development_10$"
 building_influence_burghers_02: "Influencia Significativa sobre los Burgueses"
 building_influence_burghers_02_desc: "Como patrón en la sombra de algunos de los mercaderes más ricos de esta zona, obtienes beneficios considerables.\n$POD_requirements_development_15$"
 building_influence_burghers_03: "Fuerte Influencia sobre los Burgueses"
 building_influence_burghers_03_desc: "El dinero fluye aquí en una sola dirección: hacia tus bolsillos.\n$POD_requirements_development_20$"
 building_influence_burghers_04: "Influencia Absoluta sobre los Burgueses"
 building_influence_burghers_04_desc: "Te gustan ellos y su dinero, pero todavía no estás del todo convencido con sus gustos a la hora de vestir.\n$POD_requirements_development_25$"
 
 building_type_elysium_01: "Elíseo de la Camarilla"
 building_type_elysium_01_desc: "#F El punto focal de la vida social de los Vástagos, donde el Príncipe celebra su corte. Un lugar libre de violencia, pero no de despiadadas Contiendas por la prominencia.#!"
 building_elysium_01: "Elíseo Improvisado"
 building_elysium_01_desc: "Un lugar elegido por su seguridad y conveniencia, no por su esplendor. No impresionará a nadie de renombre, pero los asistentes lo aprecian de todos modos."
 building_elysium_02: "Elíseo Respetable"
 building_elysium_02_desc: "Un establecimiento apropiado para que florezca la cultura de los Vástagos. Los propios muros del lugar fomentan la adhesión a la etiqueta."
 building_elysium_03: "Elíseo Prominente"
 building_elysium_03_desc: "Un nexo vital en la red de conexiones sociales de la Camarilla. El Príncipe que preside tan refinado establecimiento goza de reconocimiento mundial."
 
 building_type_haven_01: "Refugio del Sabbat"
 building_type_haven_01_desc: "#F Para las manadas siempre militantes del Sabbat, este lugar es tanto un hogar familiar como un puesto avanzado armado.#!"
 building_haven_01: "Refugio de la Manada"
 building_haven_01_desc: "Aunque lo bastante seguro para celebrar ritos comunales y lanzar operaciones armadas, este lugar podría necesitar más dignidad e infraestructura."
 building_haven_02: "Refugio Comunal"
 building_haven_02_desc: "Este solemne híbrido de templo, cuartel militar y sala de estar constituye un pilar en la arquitectura de la Jyhad."
 building_haven_03: "Columna de la Mano Negra"
 building_haven_03_desc: "Un raro refugio permanente de los guerreros más temidos del Sabbat. Solo los lugares vitales para los intereses de la secta merecen su temible presencia."
 
 building_type_founding_temple_01: "Templo Fundacional"
 building_type_founding_temple_01_desc: "Cada culto de Set tiene su origen en un Templo Fundacional. Los más influyentes y respetados están bajo la Administración de los Hierofantes."
 building_founding_temple_01: "Templo Fundacional" 
 building_founding_temple_01_desc: "Cada culto de Set tiene su origen en un Templo Fundacional. Los más influyentes y respetados están bajo la Administración de los Hierofantes." 
 
 building_type_sanctuary_of_flesh_01: "Santuario de la Carne"
 building_type_sanctuary_of_flesh_01_desc: "Un monstruoso ejemplo de los poderes de escultura de carne que el $pod_clan$ [GetTrait('tzimisce').GetName(GetNullCharacter)] ha dominado a través de los tiempos."
 building_sanctuary_of_flesh_01: "Santuario de la Carne"
 building_sanctuary_of_flesh_01_desc: "Un monstruoso ejemplo de los poderes de escultura de carne que el $pod_clan$ [GetTrait('tzimisce').GetName(GetNullCharacter)] ha dominado a través de los tiempos."
 
 building_type_ashen_court_01: "Sirvientes de la Noble Familia"
 building_type_ashen_court_01_desc: "#F Tu influencia se adentra profundamente en los castillos de los nobles locales.#!"
 building_ashen_court_01: "Individuos Controlados"
 building_ashen_court_01_desc: "Gracias a tu influencia sobre los nobles locales, ahora controlas a algunos individuos encantados de servirte."
 building_ashen_court_02: "Familias Controladas"
 building_ashen_court_02_desc: "Tu influencia llega aún más profundo; ahora controlas a algunas familias nobles de esta zona."
 building_ashen_court_03: "Dinastías Controladas"
 building_ashen_court_03_desc: "Tu control sobre los nobles locales es tan firme que ahora dominas a varias dinastías de esta zona."
 
 building_type_ashen_commandery_01: "Casa del Capítulo de los Caballeros de Cenizas"
 building_type_ashen_commandery_01_desc: "#F El capítulo de una orden militante de $pod_cainites$ y sus sirvientes mortales.#!"
 building_ashen_commandery_01: "Pequeña Encomienda"
 building_ashen_commandery_01_desc: "Una pequeña Encomienda que alberga a varios $pod_cainites$ y tenientes mortales."
 building_ashen_commandery_02: "Gran Encomienda"
 building_ashen_commandery_02_desc: "La Encomienda se amplía para albergar a un mayor número de sirvientes mortales, junto con amplios establos y una armería bien abastecida."
 building_ashen_commandery_03: "Encomienda Fortificada"
 building_ashen_commandery_03_desc: "La Encomienda es ahora una imponente fortificación por derecho propio, con muros gruesos y pesadas puertas, que alberga a un gran número tanto de caballeros $pod_cainite$ como de sus sirvientes de confianza."
 
 building_type_ashen_office_01: "Oficina Controlada de Senescales"
 building_type_ashen_office_01_desc: "#F La oficina de administradores y mercaderes $pod_cainite$, y sus sirvientes mortales que te sirven a ti.#!"
 building_ashen_office_01: "Oficina Pequeña"
 building_ashen_office_01_desc: "Una pequeña oficina de administradores y mercaderes locales que te ayudan a gobernar las tierras locales."
 building_ashen_office_02: "Oficina Mediana"
 building_ashen_office_02_desc: "Una oficina mediana en la que tus esbirros controlan el flujo de dinero en esta zona, llenando tus bolsillos."
 building_ashen_office_03: "Oficina Grande"
 building_ashen_office_03_desc: "Una gran oficina con solo lo mejor de lo mejor en senescales, administradores y mercaderes, redistribuyendo el dinero de vuelta hacia ti."
 
 building_type_ashen_ring_01: "Red Criminal"
 building_type_ashen_ring_01_desc: "#F Influencia sobre los criminales $pod_cainite$ locales y sus sirvientes mortales.#!"
 building_ashen_ring_01: "Red Pequeña"
 building_ashen_ring_01_desc: "Los criminales de esta zona empiezan a llegar a un entendimiento contigo."
 building_ashen_ring_02: "Red Mediana"
 building_ashen_ring_02_desc: "A medida que tu influencia sobre el mundo del hampa en esta zona se fortalece, algunos proscritos empiezan a servirte."
 building_ashen_ring_03: "Red Grande"
 building_ashen_ring_03_desc: "Tu influencia sobre el mundo del hampa en esta zona es tan fuerte que todo $pod_cainite$ que vive al margen de la ley en esta zona te sirve."
 
 building_type_ashen_cult_site_01: "Lugar de Culto"
 building_type_ashen_cult_site_01_desc: "#F Un lugar donde poderosos $pod_cainites$ reúnen a sus sirvientes Cultistas mortales.#!"
 building_ashen_cult_site_01: "Arboleda de Sangre"
 building_ashen_cult_site_01_desc: "Algunos Cultistas se reúnen en este lugar para rendirte culto y servirte."
 building_ashen_cult_site_02: "Capilla de Sangre"
 building_ashen_cult_site_02_desc: "Un popular lugar de reunión donde tus siervos Cultistas te rinden culto y te sirven."
 building_ashen_cult_site_03: "Templo de Sangre"
 building_ashen_cult_site_03_desc: "Un lugar que muestra tu superioridad tanto sobre el Ganado como sobre los $pod_cainite$, donde enormes cantidades de Cultistas se reúnen para rendirte culto y servirte."
 
 building_type_aphrodisium_01: "Afrodisium de Ancona"
 building_type_aphrodisium_01_desc: "#F Un templo oculto dedicado a los deseos naturales tanto de mortales como de $pod_cainites$, donde los únicos sacramentos verdaderos son el amor y los actos que producen placer.#!"
 building_aphrodisium_01: "Afrodisium Oculto"
 building_aphrodisium_01_desc: "Las últimas sacerdotisas de Afrodita se ocultan en las profundidades de Ancona, temiendo el castigo de la Cruz."
 building_aphrodisium_02: "Afrodisium Emergente"
 building_aphrodisium_02_desc: "Educando a todos los que buscan conocimiento en los caminos del deseo, el Afrodisium se convierte de nuevo en un centro de placentera devoción."
 building_aphrodisium_03: "Afrodisium Triunfante"
 building_aphrodisium_03_desc: "Un símbolo de supervivencia frente a la adversidad, un recordatorio de las mejores noches de la Vía Peccati antes de que llegara el cristianismo."
 
 building_type_castle_lake_01: "Castillo en el Lago"
 building_type_castle_lake_01_desc: "#F El cuartel general de la moribunda Orden de las Cenizas Amargas se encuentra en un valle purificado por una inundación divina.#!"
 building_castle_lake_01: "Castillo Hundido"
 building_castle_lake_01_desc: "Apenas habitable, el Castillo es, no obstante, un importante lugar de reunión para las órdenes de caballería $pod_cainite$."
 building_castle_lake_02: "Castillo Inundado"
 building_castle_lake_02_desc: "La restauración y expansión continúan noche tras noche, devolviendo algo de gloria a la vieja ruina."
 building_castle_lake_03: "Castillo Restaurado"
 building_castle_lake_03_desc: "Una victoria para los honorables $pod_cainites$ frente a sus demonios, tanto espirituales como de otro tipo."
 
 building_type_fire_court_01: "Corte de Fuego"
 building_type_fire_court_01_desc: "#F Un lugar de placeres exóticos y prohibidos donde el conocimiento de dinastías pasadas se conserva bajo la atenta mirada de los #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Setitas#!#!.#!"
 building_fire_court_01: "Corte de Fuego Emergente"
 building_fire_court_01_desc: "Establecida tras el Rito del Rey-Sol que desterró a los #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Setitas#!#! de Menfis y Guiza, la Corte de Fuego ha crecido desde entonces hasta ser más que una solución temporal."
 building_fire_court_02: "Corte de Fuego Establecida"
 building_fire_court_02_desc: "Una visita a la Corte de Fuego puede resultar muy provechosa si se busca un conocimiento que nadie más puede ofrecer. Pero, por supuesto, hay que estar dispuesto a pagar un precio."
 building_fire_court_03: "Corte de Fuego Dominante"
 building_fire_court_03_desc: "Ahora el principal templo [GetTrait('setite').GetName(GetNullCharacter)] de Egipto, la gloria y los peligros de la Corte de Fuego son conocidos por doquier."

 building_type_black_college_01: "Colegio Negro"
 building_type_black_college_01_desc: "#F También conocido como la Escuela Negra, este infame colegio dedicado a las Artes Oscuras fue destruido por los propios [GetTrait('baali').GetName(GetNullCharacter)] en una de sus numerosas guerras civiles.#!"
 building_black_college_01: "Colegio Negro en Ruinas"
 building_black_college_01_desc: "Quedan algunos libros, que guardan secretos mejor olvidados por la eternidad."
 building_black_college_02: "Colegio Negro en Recuperación"
 building_black_college_02_desc: "Algunas partes del Colegio han sido restauradas, revelando sus horrores a su descuidado amo."
 building_black_college_03: "Colegio Negro Dominante"
 building_black_college_03_desc: "Una vez más, las salas se llenan de estudiantes del saber infernal que aprenden sus artes. Una vez más, el mundo tiembla mientras entidades de otro mundo lo observan con hambre."
  
 building_type_knossos_labyrinth_01: "Laberinto de Cnosos"
 building_type_knossos_labyrinth_01_desc: "#F Nergal casi destruyó el mundo desde aquí en una ocasión, siendo detenido únicamente por una coalición de todos los Clanes $pod_cainite$, algo nunca visto antes ni después.#!"
 building_knossos_labyrinth_01: "Laberinto de Cnosos en Ruinas"
 building_knossos_labyrinth_01_desc: "La isla tiembla, los mortales están atemorizados y los rumores se extienden."
 building_knossos_labyrinth_02: "Laberinto de Cnosos Restaurado"
 building_knossos_labyrinth_02_desc: "El centro de la locura crece una vez más. ¿Se le detendrá a tiempo?"
 building_knossos_labyrinth_03: "Laberinto de Cnosos Infernal"
 building_knossos_labyrinth_03_desc: "Esta vez, el mundo no sobrevivirá. La espantosa sonrisa de Nergal se cierne una vez más sobre este mundo condenado."
 
 building_type_sernog_monastery_01: "Monasterio de Sernog"
 building_type_sernog_monastery_01_desc: "#F Una fortaleza abandonada se alza amenazante, sus muros ennegrecidos formando un esqueleto oscuro contra el cielo, la cáscara de un edificio abierto a las estrellas. Junto a la fortaleza hay una antigua catedral, aparentemente en mejor estado pero no menos siniestra que el edificio que la acompaña.#!"
 building_sernog_monastery_01: "Monasterio de Sernog en Ruinas"
 building_sernog_monastery_01_desc: "El interior de la catedral refleja una atmósfera de oscuro presagio. La arquitectura parece tallada de la imaginación febril de algún diseñador demente. Grotescas tallas de seres que podrían ser ángeles pero se parecen a demonios observan con fiereza a quienes cruzan el arco de la entrada al antiguo santuario."
 building_sernog_monastery_02: "Monasterio de Sernog Restaurado"
 building_sernog_monastery_02_desc: "El aire dentro de la catedral tiene un olor mohoso y empalagoso, como si algo eternamente agonizante se hubiera incrustado en las piedras y ahora rezumara su esencia en un miasma de podredumbre perpetua."
 building_sernog_monastery_03: "Monasterio de Sernog Imponente"
 building_sernog_monastery_03_desc: "Extraños gemidos llenan la cavernosa cámara central, resonando en las altas vigas abovedadas y reverberando en una cacofonía de gritos agudos que imitan los lamentos de víctimas sometidas a las agonías de una tortura prolongada y exquisita."
 
 building_type_iglesia_01: "Iglesia de San Nicolás de las Servitas"
 building_type_iglesia_01_desc: "#F Esta majestuosa Iglesia, construida sobre las ruinas de una Mezquita, oculta algo oscuro en sus entrañas. Algo que llama al alma sombría de los [GetTrait('lasombra').GetName(GetNullCharacter)].#!"
 building_iglesia_01: "Sótano de la Iglesia"
 building_iglesia_01_desc: "Un sótano de iglesia de aspecto mundano, si se ignoran las sombras que se arremolinan en torno a cualquier intruso."
 building_iglesia_02: "Ruinas de la Iglesia"
 building_iglesia_02_desc: "Las ruinas de la Mezquita todavía son visibles en lo profundo de los cimientos. Su santidad desapareció hace tiempo, dejando solo recuerdos y visiones inquietantes a cualquier visitante."
 building_iglesia_03: "Catacumbas de la Iglesia"
 building_iglesia_03_desc: "Túneles retorcidos, sombras en movimiento, destellos de locura... las Catacumbas de la Iglesia son una mirada inquietante a la verdadera naturaleza del Abismo. Una puerta a un mundo donde la luz nunca brilla."
 
 building_type_castle_avalon_01: "Castillo de Avalón"
 building_type_castle_avalon_01_desc: "#F Perpetuando la leyenda de Mithras, el Sol Invicto, los valientes Caballeros de Avalón zarpan desde esta impresionante estructura.#!"
 building_castle_avalon_01: "Capilla de Santa Austreberta"
 building_castle_avalon_01_desc: "La monja que domó a un lobo es la Santa patrona de la Orden, y se puede ver a muchos Caballeros orándole en tiempos difíciles."
 building_castle_avalon_02: "Fuerte de Avalón"
 building_castle_avalon_02_desc: "Una fortaleza poderosa, aunque austera. La esperanza de salvación para los jóvenes Caballeros que buscan una causa digna."
 building_castle_avalon_03: "Camelot Nocturno"
 building_castle_avalon_03_desc: "Puede que no sea la verdadera, pero esta poderosa fortaleza sigue siendo el faro de la leyenda artúrica, y mitraica, para los Caballeros de Avalón."
 
 building_type_kerak_in_dan_01: "Kerak-in-Dan"
 building_type_kerak_in_dan_01_desc: "#F El castillo de la Orden de la Rosa Sable, olvidado entre arena y sangre. Una reliquia de una era que se desvanece.#!"
 building_kerak_in_dan_01: "Kerak en Ruinas"
 building_kerak_in_dan_01_desc: "La Rosa Sable, como la propia Herejía Cainita, ha conocido mejores noches. Las ruinas están llenas de recuerdos y telarañas, pero poco más."
 building_kerak_in_dan_02: "Kerak Restaurado"
 building_kerak_in_dan_02_desc: "Entre los escombros pueden encontrarse antiguos tesoros. Muchos pergaminos e iconos de los diversos cultos de Levante están aquí."
 building_kerak_in_dan_03: "Kerak-in-Dan Triunfante"
 building_kerak_in_dan_03_desc: "Una fortaleza, un símbolo, el regreso de la Herejía Cainita a la vanguardia, para no abandonarla nunca más."
 
 building_type_barcelona_library_01: "Biblioteca de Barcelona"
 building_type_barcelona_library_01_desc: "#F Iniciada por la inquisitiva Princesa Mireia Subirà, la biblioteca de Barcelona es conocida en toda España como un extenso pozo de conocimiento.#!"
 building_barcelona_library_01: "Obras Mundanas"
 building_barcelona_library_01_desc: "Desde leyes vulgares hasta filosofías esotéricas, todo lo que de valor produjeron los mortales está aquí."
 building_barcelona_library_02: "Obras Ocultas"
 building_barcelona_library_02_desc: "Las herejías, los nombres de otros Príncipes, las bibliotecas secretas y su saber prohibido pueden encontrarse aquí."
 building_barcelona_library_03: "Obras Únicas"
 building_barcelona_library_03_desc: "Los fragmentos nodistas, la traición de Brujah y la caída de Cartago... Barcelona es ahora una tierra sagrada para ocultistas de todas partes."
 
 
 building_type_tower_flies_01: "La Torre de las Moscas"
 building_type_tower_flies_01_desc: "#F Sobresaliendo del Mediterráneo como un brazo extendido hay un largo espigón de tierra, al final del cual se alza una alta e inquietante estructura de piedra blanca.#!"
 building_tower_flies_01: "Torre de las Moscas en Ruinas"
 building_tower_flies_01_desc: "Antaño fortaleza de los temidos [GetTrait('baali').GetName(GetNullCharacter)], se vieron obligados a evacuarla tras la llegada de San Pablo. Después se instalaron en una pequeña caverna bajo la línea de agua."
 building_tower_flies_02: "Torre de las Moscas Restaurada"
 building_tower_flies_02_desc: "A medida que los [GetTrait('baali').GetName(GetNullCharacter)] regresan a su fortaleza, el propio aire se espesa con oscuridad y visiones espantosas, un vestigio de una era terrible."
 building_tower_flies_03: "Terrible Torre de las Moscas"
 building_tower_flies_03_desc: "La oscuridad ha vuelto, extendiéndose desde la torre como una ola interminable de horrores. Y esta vez, ningún Santo salvará al mundo mortal."
 
 building_type_library_malta_01: "Biblioteca de Malta"
 building_type_library_malta_01_desc: "#F La mayor biblioteca secreta del mundo $pod_cainite$, una colección alojada en numerosas cavernas semejantes a bolsillos conectadas por un único túnel.#!"
 building_library_malta_01: "Primeras Cámaras"
 building_library_malta_01_desc: "Obras griegas y latinas, escritos árabes, runas druídicas, los restos de viejas pinturas, un rostro humano burlón que recibe a cualquier visitante..."
 building_library_malta_02: "Cámaras Ocultas"
 building_library_malta_02_desc: "Un sello de Salomón sobre el suelo guarda los tesoros más oscuros, saber oculto, demonología, erotismo y manuales de guerra y tortura."
 building_library_malta_03: "Cámara Sellada"
 building_library_malta_03_desc: "Bloqueada por una enorme piedra grabada con el símbolo de un cedro, aquí puede sentirse una presencia, pero esta cámara nunca se ha abierto. Y probablemente no debería."
 
 building_type_hamilcar_palaestra_01: "Palestra de Amílcar"
 building_type_hamilcar_palaestra_01_desc: "#F El salón de entrenamiento es el santuario de un [GetTrait('brujah').GetName(GetNullCharacter)], su refugio del mundo exterior. Allí pueden estudiar libros, practicar con la espada, o perfeccionar el control de sus [Glossary('Disciplinas','game_concept_discipline_desc')] físicas.#!"
 building_hamilcar_palaestra_01: "Pequeña Palestra de Amílcar"
 building_hamilcar_palaestra_01_desc: "El mayor salón de entrenamiento que queda, adornado con colmillos de marfil de los famosos elefantes de Aníbal."
 building_hamilcar_palaestra_02: "Gran Palestra de Amílcar"
 building_hamilcar_palaestra_02_desc: "Tras años de reconstrucción y ampliación, el salón de entrenamiento vuelve a ser digno de sus gloriosos predecesores de la Era Clásica."
 building_hamilcar_palaestra_03: "Impresionante Palestra de Amílcar"
 building_hamilcar_palaestra_03_desc: "Un centro de aprendizaje, Destreza física e historia orgullosa. La definición del $pod_clan$ [GetTrait('brujah').GetName(GetNullCharacter)]."
 
 building_type_castle_hardestadt_01: "Castillo Hardestadt"
 building_type_castle_hardestadt_01_desc: "#F A medida que la influencia de Hardestadt sobre el mundo vampírico crece, también lo hace su castillo favorito. Una reliquia familiar, si hay que creerle.#!"
 building_castle_hardestadt_01: "Pequeño Castillo Hardestadt"
 building_castle_hardestadt_01_desc: "Un típico castillo alemán, donde se toman grandes decisiones para el futuro de los $pod_cainites$ de todas partes."
 building_castle_hardestadt_02: "Gran Castillo Hardestadt"
 building_castle_hardestadt_02_desc: "Un gran castillo alemán, muy bien defendido. Pocos se atreverían a entrar sin una invitación de su amo."
 building_castle_hardestadt_03: "Imponente Castillo Hardestadt"
 building_castle_hardestadt_03_desc: "Como su dueño, el Castillo Hardestadt es una fuerza aterradora en la historia $pod_cainite$. Un lugar donde a muchos les gustaría entrar, si no temieran no poder salir después."
 
 building_type_castle_bran_01: "Castillo Bran"
 building_type_castle_bran_01_desc: "#F Un castillo muy menor, construido por la Orden Teutónica cuando tomaron el control del Paso de Borgo. Un lugar tan irrelevante e insignificante...#!"
 building_castle_bran_01: "Pequeño Castillo Bran"
 building_castle_bran_01_desc: "Olvidado y vacío, solo uno más entre los muchos castillos menores de Transilvania. Pero hay algo diferente en este..."
 building_castle_bran_02: "Castillo Bran Imponente"
 building_castle_bran_02_desc: "Desde aquí nacerá una leyenda. El amo se convertirá en su castillo, y el castillo se convertirá en su amo."
 building_castle_bran_03: "Castillo Bran Legendario"
 building_castle_bran_03_desc: "Escúchalos, los hijos de la noche. ¡Qué música hacen!"
 
 building_type_vienna_chantry_01: "Cofradía de Viena"
 building_type_vienna_chantry_01_desc: "#F Construida por Etrius como un posible punto de repliegue en caso de que Ceoris cayera, la Cofradía de Viena es el bastión de la facción Conservadora de los [GetTrait('tremere').GetName(GetNullCharacter)].#!"
 building_vienna_chantry_01: "Pequeña Cofradía de Viena"
 building_vienna_chantry_01_desc: "Encaramada en un promontorio escarpado a varias millas al norte de la ciudad, la Cofradía de Viena parece un gran e imponente pabellón de caza."
 building_vienna_chantry_02: "Gran Cofradía de Viena"
 building_vienna_chantry_02_desc: "Sus muros están compuestos de enormes bloques de piedra gris, arrancados de la tierra por la magia de Etrius."
 building_vienna_chantry_03: "Imponente Cofradía de Viena"
 building_vienna_chantry_03_desc: "Sobredimensionada y sobrefortificada por medios mundanos y mágicos, nada menos que un apocalipsis podría destruir esta cofradía convertida en fortaleza."
 
 building_type_lion_green_01: "El Verde del León"
 building_type_lion_green_01_desc: "#F El bastión de Meerlinda en Inglaterra. Un lugar engañosamente abierto donde la astuta Consejera trama sus próximos movimientos diplomáticos.#!"
 building_lion_green_01: "Pequeño Verde del León"
 building_lion_green_01_desc: "El Verde del León es una alta torre de piedra. La mayoría de los lugareños asumen que es la mansión secundaria de algún noble con gusto por la vida urbana."
 building_lion_green_02: "Gran Verde del León"
 building_lion_green_02_desc: "La antaño magnífica biblioteca se ha deteriorado desde la partida de Celestyn. Se están planeando renovaciones para cambiar esta situación."
 building_lion_green_03: "Imponente Verde del León"
 building_lion_green_03_desc: "Sorprendentemente, el Verde del León carece de cámaras de tortura o celdas. Los prisioneros son llevados directamente a los aposentos de Meerlinda. Quienes salen de la sala siempre quedan mucho mejor dispuestos hacia la señora después."
 
 building_type_spring_yzebel_01: "Manantial de Yzebel"
 building_type_spring_yzebel_01_desc: "#F Yzebel fue la primera [GetTrait('brujah').GetName(GetNullCharacter)] cartaginesa en llegar a Iberia. Cayó en batalla contra los [GetTrait('ventrue').GetName(GetNullCharacter)] romanos, pero fue respetada en ambos bandos del conflicto.#!"
 building_spring_yzebel_01: "Manantial Olvidado de Yzebel"
 building_spring_yzebel_01_desc: "Una pequeña fuente, al norte de Braga. Yzebel era famosa por su aguda percepción del futuro, y beber de estas aguas parece otorgar la misma capacidad."
 building_spring_yzebel_02: "Manantial Fluyente de Yzebel"
 building_spring_yzebel_02_desc: "Un general de considerable talento; las percepciones de Yzebel sobre la guerra fluyen libremente por estas aguas."
 building_spring_yzebel_03: "Manantial Preciado de Yzebel"
 building_spring_yzebel_03_desc: "Un raro lugar de culto y concordia entre los Clanes, donde todos pueden recordar a una guerrera honorable y respetada."
 
 building_type_castle_hunedoara_01: "Castillo de Hunedoara"
 building_type_castle_hunedoara_01_desc: "#F Donde la historia y la ficción se encontrarán, y las Leyendas nacerán y se consumirán.#!"
 building_castle_hunedoara_01: "Pequeño Castillo de Hunedoara"
 building_castle_hunedoara_01_desc: "Construido sobre los cimientos de una fortaleza más antigua, Hunedoara no tiene nada especial a la vista, pero se percibe una sensación de presagio en este lugar."
 building_castle_hunedoara_02: "Imponente Castillo de Hunedoara"
 building_castle_hunedoara_02_desc: "Aquí se escribirá la historia, cuando el Hijo del Dragón conozca la noche por primera vez."
 building_castle_hunedoara_03: "Castillo Oculto de Hunedoara"
 building_castle_hunedoara_03_desc: "Nada que ver aquí. El castillo es desconocido.\nInconnu."
 
 building_type_castle_vysehrad_01: "Castillo de Vyšehrad"
 building_type_castle_vysehrad_01_desc: "#F La segunda fortaleza de Praga es hogar, y prisión, de algunas de las entidades más poderosas de la región.#!"
 building_castle_vysehrad_01: "Acrópolis de Vyšehrad"
 building_castle_vysehrad_01_desc: "Antaño residencia del Príncipe Rudolf Brandl de Praga, Vyšehrad ocultaba en secreto entidades mucho más poderosas."
 building_castle_vysehrad_02: "Fortaleza de Vyšehrad"
 building_castle_vysehrad_02_desc: "Hogar tanto de Shaagra como de Vukodlak, dos poderosos Matusalenes Tzimisce, Vyšehrad tiene una larga historia para los vampiros."
 building_castle_vysehrad_03: "Sala del Trono de Vyšehrad"
 building_castle_vysehrad_03_desc: "Donde Christof Romuald luchó contra el poderoso Vukodlak. Un eco de su batalla todavía puede oírse débilmente si se sabe escuchar."
 
 building_type_uppsala_01: "Templo de Uppsala"
 building_type_uppsala_01_desc: "#F El lugar más sagrado para los paganos del norte ha sido olvidado hace tiempo por los mortales, pero no aún por los vampiros.#!"
 building_uppsala_01: "Uppsala Quemada"
 building_uppsala_01_desc: "El templo yace en ruinas, quemado por los seguidores de la Cruz, un amargo recordatorio de la derrota de los [Glossary('Einherjar','game_concept_einherjar_desc')]."
 building_uppsala_02: "Uppsala en Recuperación"
 building_uppsala_02_desc: "A la sombra de la Cruz, los fieles regresan lentamente, todavía atemorizados, pero aún no vencidos."
 building_uppsala_03: "Templo de Uppsala"
 building_uppsala_03_desc: "Los [Glossary('Einherjar','game_concept_einherjar_desc')] regresan a su templo ancestral. Y esta vez, el Dios de la Cruz no los detendrá."
 
 building_type_paris_01: "París"
 building_type_paris_01_desc: "#F La ciudad de las maravillas es el centro del mundo occidental, pero también es un lugar difícil de controlar de verdad.#!"
 building_paris_01: "París Libre"
 building_paris_01_desc: "París es indomable, y nadie puede controlar de verdad su espíritu, al menos por ahora."
 building_paris_02: "París Restringido"
 building_paris_02_desc: "Poco a poco, París se va fusionando con su dueño, quizá el centro de un imperio en constante crecimiento."
 building_paris_03: "París Controlado"
 building_paris_03_desc: "París mira hacia el exterior, viéndose a sí misma como el faro de una nueva era."
 
 building_type_gavrinis_01: "Gavrinis"
 building_type_gavrinis_01_desc: "#F Cerca de Vannes hay una pequeña isla con un caern prehistórico... y una infame reputación.#!"
 building_gavrinis_01: "Iglesia en Ruinas de Gavrinis"
 building_gavrinis_01_desc: "La Orden de los Hospitalarios intentó establecerse aquí, pero ni siquiera su fe fue suficiente para protegerlos del horror que yacía debajo."
 building_gavrinis_02: "Caern de Gavrinis"
 building_gavrinis_02_desc: "Aquí se hacían sacrificios hace mucho tiempo. Y alguien, o algo, todavía espera a los próximos."
 building_gavrinis_03: "Profundidades de Gavrinis"
 building_gavrinis_03_desc: "La propia isla parece alimentarse de desesperación y muerte. Y siempre llega más, al final."
  
 building_type_toulouse_university_01: "Universidad de Tolosa"
 building_type_toulouse_university_01_desc: "#F Fundada por el papa Gregorio IX en 1229, la universidad de Tolosa pronto empieza a forjar su propia identidad.#!"
 building_toulouse_university_01: "Pequeña Universidad de Tolosa"
 building_toulouse_university_01_desc: "Creada en un principio para enseñar el cristianismo correcto a las gentes de Aquitania, a menudo descarriadas, la Universidad pronto se ganó una reputación de pensamiento libre."
 building_toulouse_university_02: "Universidad de Tolosa en Crecimiento"
 building_toulouse_university_02_desc: "Desde el idioma hasta la teología, la universidad enseña la mayoría de las materias habituales, ganando prestigio día a día."
 building_toulouse_university_03: "Influyente Universidad de Tolosa"
 building_toulouse_university_03_desc: "Los patrocinadores en la sombra de la universidad han invertido mucho esfuerzo en ayudar a que Tolosa rivalice con París. Los resultados son buena muestra de su éxito."
 
 # Ghoul
 building_type_family_estates_01: "Propiedades Familiares"
 building_type_family_estates_01_desc: "#F Ya sea que la ganaste con tu ingenio y tesón o que la heredaste, tener un verdadero hogar y tierras cultivables a tu nombre es un privilegio que hasta tus creadores rara vez llegan a disfrutar.#!"
 building_family_estates_01: "Hacienda Familiar"
 building_family_estates_01_desc: "La comodidad de vida está baja en la lista de posibles mejoras para esta humilde hacienda, pero la tierra es fértil y debería recompensarte con creces."
 building_family_estates_02: "Propiedad Familiar"
 building_family_estates_02_desc: "Una propiedad de este tamaño y productividad justifica considerarse una persona de cierta posición, si no entre tus pares nobles, al menos entre todos los siervos que puedes mandar.\n$POD_requirements_development_10$"
 building_family_estates_03: "Latifundio Familiar"
 building_family_estates_03_desc: "Esta vasta parcela de tierra no solo produce suficientes cosechas para alimentar a un ejército, sino que también alberga una residencia digna de un aristócrata.\n$POD_requirements_development_15$"
 
 building_type_family_worship_01: "Devoción Familiar"
 building_type_family_worship_01_desc: "#F Cada familia tiene sus Tradiciones, y pocas son más importantes que la forma en que rinden culto.#!"
 building_family_worship_01: "Santuario Familiar"
 building_family_worship_01_desc: "Un lugar modesto pero digno, dedicado al culto del Dios de los hombres, o de los poderes a los que fuiste presentado junto con la vida eterna."
 building_family_worship_02: "Capilla Familiar"
 building_family_worship_02_desc: "Una amplia cámara o un edificio separado, este lugar de culto puede acoger las oraciones conjuntas incluso de los Clanes más numerosos."
 building_family_worship_03: "Templo Privado"
 building_family_worship_03_desc: "Ya sea disfrazado de una curiosamente inaccesible iglesia o de un complejo de bodegas de vino a escala industrial, esta instalación es un testimonio de la devoción de tu familia."
 
 building_type_family_muscle_01: "Músculo de la Familia"
 building_type_family_muscle_01_desc: "#F Existir en el umbral entre el mundo de los mortales y los dominios de los señores de la noche es peligroso y difícil. Unos cómplices de naturaleza violenta pueden ayudar.#!"
 building_family_muscle_01: "Matones Locales"
 building_family_muscle_01_desc: "Tener a los matones y alborotadores del vecindario en tu bolsillo no allana el camino hacia grandes conquistas, pero es tremendamente útil en disputas menores."
 building_family_muscle_02: "Guardia de la Casa"
 building_family_muscle_02_desc: "Confiables y bien equipados, estos hombres sirven para proteger aquello que tu casa aprecia."
 building_family_muscle_03: "Estandarte Familiar"
 building_family_muscle_03_desc: "Provistos de todo el entrenamiento y equipo que un guerrero pudiera desear, estos hombres son capaces de formar la más devastadora formación de la era, un estandarte de caballería pesada."
 
 building_type_family_enterprise_01: "Empresa Familiar"
 building_type_family_enterprise_01_desc: "#F Un empresario exitoso atiende los caprichos de sus clientes según la última moda. A los Vástagos eso no les importa lo más mínimo, así que delegan la tarea a los de tu especie.#!"
 building_family_enterprise_01: "Tienda Familiar"
 building_family_enterprise_01_desc: "Tus conexiones únicas te proporcionan un suministro de mercancías que pueden alcanzar un buen precio entre los mortales. Siempre que estén debidamente limpias de sangre."
 building_family_enterprise_02: "Emporio Familiar"
 building_family_enterprise_02_desc: "Lo quieren, tú lo vendes. Ya sea una magnífica espada de un noble fallecido o un saco de nabos, tus márgenes varían, pero el dinero sigue fluyendo.\n$POD_requirements_development_10$"
 building_family_enterprise_03: "Compañía de Importación Familiar"
 building_family_enterprise_03_desc: "Desde alimentos desconocidos en la región hasta muebles y armas de diseño exótico y reliquias antiguas, todas estas mercancías llegan aquí gracias a tu red comercial, que se extiende tan lejos como las conexiones entre los inmortales.\n$POD_requirements_development_15$"
 
 building_type_family_connections_01: "Contactos Familiares"
 building_type_family_connections_01_desc: "#F Codearse con la nobleza implica participar en una carrera armamentística de despilfarro. Pero si de algo estás seguro, es de que conocer a la gente adecuada importa.#!"
 building_family_connections_01: "Recibir a Bajos Nobles"
 building_family_connections_01_desc: "La gente que come y bebe a tu costa rara vez es más importante que un primo segundo de un barón, pero tienes que empezar a darte a conocer y hacerte respetar en algún sitio."
 building_family_connections_02: "Recibir a la Nobleza"
 building_family_connections_02_desc: "Las noticias de tu hospitalidad se han difundido, y ahora te visita gente realmente capaz de corresponderte. Tarde o temprano, entablarás amistad con la élite gobernante.\n$POD_requirements_development_10$"
 building_family_connections_03: "Recibir a los Aristócratas"
 building_family_connections_03_desc: "Has logrado hacerte reconocer como una persona de riqueza e influencia. Los más poderosos del Señorío te buscan para negociar lo uno o lo otro.\n$POD_requirements_development_15$"
 
 building_type_family_rights_01: "Derechos Familiares"
 building_type_family_rights_01_desc: "#F Te presentas como heredero de una casa espléndida, aunque en gran parte olvidada. Que sea cierto o no es irrelevante; lo que importa es quién lo reconoce como tal.#!"
 building_family_rights_01: "Derechos de Propiedad de Tierras"
 building_family_rights_01_desc: "Asegurar el derecho a poseer tierras por sí solo no te hará influyente, pero llevar tus negocios es más fácil cuando no tienes que enterrar tras el cobertizo a todo el que llama a tu puerta."
 building_family_rights_02: "Título Ecuestre"
 building_family_rights_02_desc: "El gobernante local te designó guerrero en su estandarte de caballería y te concedió los privilegios correspondientes. Todavía no ha descubierto que no sirves a ningún amo mortal.\n$POD_requirements_development_5$"
 building_family_rights_03: "Título de Castellano"
 building_family_rights_03_desc: "El gobernante del Señorío considera ahora tus posesiones una parte esencial de su infraestructura defensiva. Este reconocimiento conlleva beneficios.\n$POD_requirements_development_10$"
 building_family_rights_04: "Estatus de Magnate"
 building_family_rights_04_desc: "Los detalles exactos de tu herencia noble y cómo se traducen en tu rango entre la nobleza son enteramente secundarios frente a tu aparente riqueza y poder. Aristócrata o no, eres alguien con quien hay que contar.\n$POD_requirements_development_15$"
 
