 building_type_fortress_cross_01: "Fortaleza de la Cruz"
 building_type_fortress_cross_01_desc: "#F La fuertemente fortificada casa madre de los Caballeros de Acre es quizá el bastión más impresionante de la Inquisición.#!"
 building_fortress_cross_01: "Fortaleza Aislada de la Cruz"
 building_fortress_cross_01_desc: "Imponente, el cuartel general de los Caballeros de Acre todavía carece del poder político de otros lugares santos de la Inquisición."
 building_fortress_cross_02: "Fortaleza Bulliciosa de la Cruz"
 building_fortress_cross_02_desc: "Reconocida como un importante lugar de peregrinaje para todos los aspirantes a Inquisidor, la Fortaleza es ahora el centro de entrenamiento de la élite."
 building_fortress_cross_03: "Fortaleza de la Vera Cruz"
 building_fortress_cross_03_desc: "Con el fragmento de la Vera Cruz bendiciendo sus muros, la Fortaleza es ahora un faro de luz indomable."
 
 building_type_st_scholastica_01: "Santa Escolástica"
 building_type_st_scholastica_01_desc: "#F La segunda Santa patrona más importante de la Orden Roja fue la hermana gemela de San Benito, una mujer decidida pero piadosa.#!"
 building_st_scholastica_01: "Convento de Santa Escolástica"
 building_st_scholastica_01_desc: "El convento más importante de las Hermanas Rojas es un lugar extraño donde a las hermanas se les permite mucha más libertad que a la mayoría de sus hermanos clérigos."
 building_st_scholastica_02: "Biblioteca de Santa Escolástica"
 building_st_scholastica_02_desc: "Una de las mayores bibliotecas disponibles para la Inquisición, también alberga una colección de saber prohibido. Solo las Hermanas más piadosas pueden acceder a ella."
 building_st_scholastica_03: "Artefactos de Santa Escolástica"
 building_st_scholastica_03_desc: "Para combatir al Enemigo, la Orden Roja no rehúye métodos poco habituales. Es aquí donde encuentran sus armas más formidables."
 
 building_type_castle_von_murnau_01: "Castillo von Murnau"
 building_type_castle_von_murnau_01_desc: "#F El hogar ancestral de la famosa familia de Inquisidores. Un lugar de culto y de guerra.#!"
 building_castle_von_murnau_01: "Mansión von Murnau"
 building_castle_von_murnau_01_desc: "Lujosa y bien conectada, la mansión está bien integrada en el complejo panorama de la nobleza alemana."
 building_castle_von_murnau_02: "Castillo von Murnau"
 building_castle_von_murnau_02_desc: "Con un ala reservada para los asuntos de la Inquisición, el Castillo von Murnau se ha convertido en un importante lugar de descanso para los Cazadores itinerantes."
 building_castle_von_murnau_03: "Fortaleza von Murnau"
 building_castle_von_murnau_03_desc: "Lista para defenderse de cualquier amenaza, la fortaleza permanece desafiante frente a los esbirros de la oscuridad. Testimonio tanto de la maldición como de la bendición de una familia."
 
# building_type_oculi_cell_01: "Oculi Dei Cell"
