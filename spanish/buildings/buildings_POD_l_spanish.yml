 building_maats_haven_08_desc: "Una gloria de épocas remotas, este lugar sagrado no tiene igual, y el Sekhem brota de este hermoso lugar."
 
 building_type_cult_of_amkhat_01: "Culto de Amkhat"
 building_type_cult_of_amkhat_01_desc: "#F Como base de la pirámide dedicada a $glossary_wyrm_apophis$, el culto de Amkhat infesta ciudades desde Constantinopla hasta Karachi. Sus miembros son parias mortales o buscadores de poder que han dado la espalda a la razón para entregarse a espantosos ritos de canibalismo y asesinato.#!"
 building_cult_of_amkhat_01: "Culto de Amkhat Simple"
 building_cult_of_amkhat_01_desc: "Pocos Cultistas se reúnen en este lugar para adorar y servir a $glossary_wyrm_apophis$."
 building_cult_of_amkhat_02: "Culto de Amkhat Menor"
 building_cult_of_amkhat_02_desc: "Algunos Cultistas se reúnen en este lugar para adorar y servir a $glossary_wyrm_apophis$."
 building_cult_of_amkhat_03: "Culto de Amkhat Mayor"
 building_cult_of_amkhat_03_desc: "Muchos Cultistas se reúnen en este lugar para adorar y servir a $glossary_wyrm_apophis$."
 building_cult_of_amkhat_04: "Culto de Amkhat Superior"
 building_cult_of_amkhat_04_desc: "Un gran número de Cultistas se reúnen en este lugar para adorar y servir a $glossary_wyrm_apophis$."
 building_cult_of_amkhat_05: "Culto de Amkhat Excelso"
 building_cult_of_amkhat_05_desc: "Un lugar de reunión popular para que los Cultistas adoren y sirvan a $glossary_wyrm_apophis$."
 building_cult_of_amkhat_06: "Culto de Amkhat Principesco"
 building_cult_of_amkhat_06_desc: "Un lugar de reunión muy popular para que los Cultistas adoren y sirvan a $glossary_wyrm_apophis$."
 building_cult_of_amkhat_07: "Culto de Amkhat Regio"
 building_cult_of_amkhat_07_desc: "Un lugar de reunión conocido en toda la región para que los Cultistas adoren y sirvan a $glossary_wyrm_apophis$."
 building_cult_of_amkhat_08: "Culto de Amkhat Divino"
 building_cult_of_amkhat_08_desc: "Un lugar de reunión conocido en toda la nación para que los Cultistas adoren y sirvan a $glossary_wyrm_apophis$."
 
 building_type_mortal_army_01: "Ejército Mortal"
 building_type_mortal_army_01_desc: "#F Los mortales han oído la llamada de su rey-dios, y buscan ayudar a crear el ejército que pueda derrotar el cataclismo venidero.#!"
 building_mortal_army_01: "Ejército Mortal Simple"
 building_mortal_army_01_desc: "Un pequeño número de mortales ha oído tu llamada, jurando sus vidas para servir en tu ejército."
 building_mortal_army_02: "Ejército Mortal Menor"
 building_mortal_army_02_desc: "Más mortales han respondido a la llamada. No es mucho, pero es un comienzo considerable."
 building_mortal_army_03: "Ejército Mortal Mayor"
 building_mortal_army_03_desc: "Tu ejército mortal ha alcanzado ahora un tamaño decente. Los ajenos podrían pensar que son una pequeña banda de mercenarios."
 building_mortal_army_04: "Ejército Mortal Superior"
 building_mortal_army_04_desc: "Tu ejército ha alcanzado ahora estándares profesionales. Puede rivalizar con fuerzas tanto mortales como sobrenaturales."
 building_mortal_army_05: "Ejército Mortal Excelso"
 building_mortal_army_05_desc: "Ahora tienes un ejército con un tamaño y una habilidad que harán dudar a tus enemigos por miedo."
 building_mortal_army_06: "Ejército Mortal Principesco"
 building_mortal_army_06_desc: "Aunque este ejército tuyo es mortal, marcharán hacia las fauces de la muerte por ti, Inmortal."
 building_mortal_army_07: "Ejército Mortal Regio"
 building_mortal_army_07_desc: "Si Cleopatra hubiera tenido estos ejércitos, Egipto no se habría convertido en romano."
 building_mortal_army_08: "Ejército Mortal Divino"
 building_mortal_army_08_desc: "Si Cleopatra hubiera tenido estos ejércitos, Roma se habría convertido en egipcia."
 
 building_type_sets_of_worshipers_01: "Conjuntos de Adoradores"
 building_type_sets_of_worshipers_01_desc: "#F Los más fieles de estos adherentes mantuvieron viva la fe en el Renacido durante miles de años.#!"
 building_sets_of_worshipers_01: "Conjunto Simple de Adoradores"
 building_sets_of_worshipers_01_desc: "Un puñado de adoradores mantiene aquí en secreto la vieja fe."
 building_sets_of_worshipers_02: "Conjunto Menor de Adoradores"
 building_sets_of_worshipers_02_desc: "El número de fieles ha crecido en esta zona. Se está formando un pequeño culto."
 building_sets_of_worshipers_03: "Conjunto Mayor de Adoradores"
 building_sets_of_worshipers_03_desc: "Se ha formado un pequeño culto en torno a ti y a la vieja fe en esta tierra. Tu influencia política ha empezado a crecer."
 building_sets_of_worshipers_04: "Conjunto Superior de Adoradores"
 building_sets_of_worshipers_04_desc: "Tu influencia en esta tierra se ha afianzado. Los miembros de tu culto se encuentran ya en la mayoría de las instituciones importantes."
 building_sets_of_worshipers_05: "Conjunto Excelso de Adoradores"
 building_sets_of_worshipers_05_desc: "Susurros de tus muchos epítetos pueden oírse por toda esta tierra. Es un secreto a voces que un Inmortal vela por esta tierra."
 building_sets_of_worshipers_06: "Conjunto Principesco de Adoradores"
 building_sets_of_worshipers_06_desc: "Tu culto ha crecido mucho. La mayoría de los habitantes de esta tierra están bajo su influjo o son miembros activos."
 building_sets_of_worshipers_07: "Conjunto Regio de Adoradores"
 building_sets_of_worshipers_07_desc: "Los habitantes de este lugar simpatizan abiertamente con las viejas costumbres y seguirán tus órdenes."
 building_sets_of_worshipers_08: "Conjunto Divino de Adoradores"
 building_sets_of_worshipers_08_desc: "Tu palabra es divina en esta tierra. Las viejas costumbres se practican con frecuencia, y han empezado a erigirse templos ocultos."
 
 building_type_comprador_residence_01: "Residencia de Comprador"
 building_type_comprador_residence_01_desc: "#F Un Comprador es un vampiro que trabaja para algún ser sobrenatural.#!"
 building_comprador_residence_01: "Residencia Simple de Comprador"
 building_comprador_residence_01_desc: "Aquí tienes las bases para reunir a otros seres sobrenaturales para tu causa."
 building_comprador_residence_02: "Residencia Menor de Comprador"
 building_comprador_residence_02_desc: "Tu red ha empezado a dar frutos, en forma de algunos nuevos contactos sobrenaturales."
 building_comprador_residence_03: "Residencia Mayor de Comprador"
 building_comprador_residence_03_desc: "Tu pequeña red se ha establecido por fin, y aunque son los más débiles de su especie, tienes varios Compradores a los que puedes contactar."
 building_comprador_residence_04: "Residencia Superior de Comprador"
 building_comprador_residence_04_desc: "Como tu red ha crecido, se han construido algunos refugios para tus nuevos Compradores. Es un comienzo impresionante."
 building_comprador_residence_05: "Residencia Excelsa de Comprador"
 building_comprador_residence_05_desc: "Tu influencia se expande aún más, y los refugios y Compradores a los que tienes acceso empiezan a reflejarlo."
 building_comprador_residence_06: "Residencia Principesca de Comprador"
 building_comprador_residence_06_desc: "Ahora podrías comandar a toda una coterie o una manada entera. Traerlos hasta ti fue un logro extraordinario, y un testimonio de tu voluntad."
 building_comprador_residence_07: "Residencia Regia de Comprador"
 building_comprador_residence_07_desc: "Seres sobrenaturales de tus dominios y más allá han oído hablar de las oportunidades que solo tú ofreces, y algunos han atendido tu llamada."
 building_comprador_residence_08: "Residencia Divina de Comprador"
 building_comprador_residence_08_desc: "Incluso la $glossary_osirian_league$ es una sombra de lo que tienes aquí."
 
 building_type_tomb_01: "Tumba"
 building_type_tomb_01_desc: "#F Tu khat reside en un lugar de descanso seguro entre vidas mientras tu Espíritu se recupera en el [UmbraGlossaryLocalized('shadowlands','Inframundo')]. Podría ser un sótano oculto, una cueva aislada en las montañas, un área de almacenamiento segura de un museo o incluso una tumba sin descubrir en el Valle de los Reyes.#!"
 building_tomb_01: "Tumba Simple"
 building_tomb_01_desc: "Llamar tumba a esto puede ser algo generoso. Es más bien un simple sarcófago en un sótano oculto o en un nicho."
 building_tomb_02: "Tumba Menor"
 building_tomb_02_desc: "Aunque no sea más que una tumba de pozo o una simple tumba en una cueva, es una tumba."
 building_tomb_03: "Tumba Mayor"
 building_tomb_03_desc: "Tu tumba se ha ampliado un poco. Ahora alberga algunas reliquias y pinturas murales."
 building_tomb_04: "Tumba Superior"
 building_tomb_04_desc: "Ahora tienes una tumba adecuada y recientemente has conseguido un guardián que vele por tu khat mientras tu Espíritu está en [UmbraGlossary('shadowlands')]."
 building_tomb_05: "Tumba Excelsa"
 building_tomb_05_desc: "Tu tumba ahora se ha ampliado a un complejo mayor de cámaras. Más de tus seguidores elegidos vigilan tu lugar de descanso."
 building_tomb_06: "Tumba Principesca"
 building_tomb_06_desc: "Tu tumba ahora cuenta con una serie de trampas, maldiciones y armamento para tus guardias mortales. Ay de aquel que perturbe tu khat."
 building_tomb_07: "Tumba Regia"
 building_tomb_07_desc: "Tu tumba rivaliza con la de los antiguos Faraones. Está oculta a los mortales no iniciados, pero cualquiera que tropiece con ella queda maravillado."
 building_tomb_08: "Tumba Divina"
 building_tomb_08_desc: "Tu tumba, aunque oculta a miradas indiscretas, supera a la de los grandes reyes de antaño. Haría falta un asedio para que un intruso perturbara tu descanso."
 
 building_type_legacy_01: "Legado"
 building_type_legacy_01_desc: "#F Dejaste una huella significativa en el mundo durante tu Primera o Segunda Vida, de la que aún extraes fuerza.#!"
 building_legacy_01: "Legado Simple"
 building_legacy_01_desc: "Desde que has regresado al mundo, eres totalmente desconocido. Esperas remediar esta injusticia."
 building_legacy_02: "Legado Menor"
 building_legacy_02_desc: "Ahora eres un cuento de viejas local para la gente del campo, una historia. Pero este es solo el primer capítulo de tu legado."
 building_legacy_03: "Legado Mayor"
 building_legacy_03_desc: "Ahora se te recuerda entre algunas personas, que apenas empiezan a comprender lo importante que fuiste, y sigues siendo."
 building_legacy_04: "Legado Superior"
 building_legacy_04_desc: "Ahora eres un mito en toda la zona, tus antiguas historias y hazañas son un cuento que inspira a los niños."
 building_legacy_05: "Legado Excelso"
 building_legacy_05_desc: "Tu nombre se pronuncia con respeto y reverencia, como una leyenda local y una fuente de influencia, y ahora también una fuente de prestigio para los políticos locales que te citan."
 building_legacy_06: "Legado Principesco"
 building_legacy_06_desc: "Tan grande se ha vuelto tu legado y tu mito que los nobles locales obtienen legitimidad a través de tu linaje."
 building_legacy_07: "Legado Regio"
 building_legacy_07_desc: "Los reyes ahora obtienen legitimidad de tu linaje, un vestigio de los Reyes y Reinas Dioses de antaño."
 building_legacy_08: "Legado Divino"
 building_legacy_08_desc: "Incluso el legado de Alejandro Magno es una sombra patética y lastimera frente al tuyo."
 
 building_type_shemsu_heru_central_port_01: "Puerto Central de los Shemsu-Heru"
 building_type_shemsu_heru_central_port_01_desc: "#F Un puerto central para los Shemsu-Heru en Alejandría tras la partida de Horus con un grupo de sus discípulos más leales.#!"
 building_shemsu_heru_central_port_01: "Puerto Central de los Shemsu-Heru"
 building_shemsu_heru_central_port_01_desc: "Un puerto central para los Shemsu-Heru en Alejandría tras la partida de Horus con un grupo de sus discípulos más leales."
 
 building_type_horus_hidden_tomb_01: "Tumba Oculta de Horus"
 building_type_horus_hidden_tomb_01_desc: "#F Una tumba oculta en los Alpes construida por Horus, cerca de la ciudad mortal de Ginebra.#!"
 building_horus_hidden_tomb_01: "Tumba Oculta de Horus"
 building_horus_hidden_tomb_01_desc: "Una tumba oculta en los Alpes construida por Horus, cerca de la ciudad mortal de Ginebra."
 
 building_type_temple_of_horus_01: "Templo de Horus"
 building_type_temple_of_horus_01_desc: "#F El mayor templo del Vengador en Edfu, entre Isna y Asuán, en Egipto. Aunque la mayor parte de la ciudad original de Djeba ha quedado en ruinas, el Templo de Horus sigue en pie.#!"
 building_temple_of_horus_01: "Templo de Horus"
 building_temple_of_horus_01_desc: "El mayor templo del Vengador en Edfu, entre Isna y Asuán, en Egipto. Aunque la mayor parte de la ciudad original de Djeba ha quedado en ruinas, el Templo de Horus sigue en pie, tan obstinado como su Dios."

 building_type_patroned_temple_01: "Templo Patrocinado"
 building_type_patroned_temple_01_desc: "#F Los lugares de culto, ya sean Mezquitas, Iglesias u otros, son uno de los últimos lugares donde el arte puede florecer de verdad en la Edad Oscura.#!"
 building_patroned_temple_01: "Templo Patrocinado"
 building_patroned_temple_01_desc: "Los lugares de culto, ya sean Mezquitas, Iglesias u otros, son uno de los últimos lugares donde el arte puede florecer de verdad en la Edad Oscura."
 
 building_type_patroned_musicians_01: "Músicos Patrocinados"
 building_type_patroned_musicians_01_desc: "#F Trovadores, bardos o incluso la armonía polifónica clerical... la Edad Oscura es una época apasionante para los amantes de las artes musicales.#!"
 building_patroned_musicians_01: "Músicos Patrocinados"
 building_patroned_musicians_01_desc: "Trovadores, bardos o incluso la armonía polifónica clerical... la Edad Oscura es una época apasionante para los amantes de las artes musicales."
 
 building_type_patroned_theaters_01: "Teatros Patrocinados"
 building_type_patroned_theaters_01_desc: "#F Aunque el apogeo del teatro clásico quedó atrás hace mucho, todavía se representan muchas obras clericales, a menudo patrocinadas por ricos mercaderes en busca de notoriedad.#!"
 building_patroned_theaters_01: "Teatros Patrocinados"
 building_patroned_theaters_01_desc: "Aunque el apogeo del teatro clásico quedó atrás hace mucho, todavía se representan muchas obras clericales, a menudo patrocinadas por ricos mercaderes en busca de notoriedad."
 
 building_type_patroned_manuscripts_01: "Manuscritos Patrocinados"
 building_type_patroned_manuscripts_01_desc: "#F En un mundo de tinieblas, la palabra escrita es el último bastión del verdadero conocimiento.#!"
 building_patroned_manuscripts_01: "Manuscritos Patrocinados"
 building_patroned_manuscripts_01_desc: "En un mundo de tinieblas, la palabra escrita es el último bastión del verdadero conocimiento."
 
 building_type_patroned_painters_01: "Pintores Patrocinados"
 building_type_patroned_painters_01_desc: "#F La pintura todavía está en pañales, pero ya es un negocio lucrativo para quienes desean inmortalizar sus historias y cuentan con los medios para hacerlo.#!"
 building_patroned_painters_01: "Pintores Patrocinados"
 building_patroned_painters_01_desc: "La pintura todavía está en pañales, pero ya es un negocio lucrativo para quienes desean inmortalizar sus historias y cuentan con los medios para hacerlo."
      
 building_type_perugia_chantry_01: "Cofradía de Perugia"
 building_type_perugia_chantry_01_desc: "#F Enclavada en las escarpadas colinas de una pequeña ciudad rural, esta cofradía está lejos de las maquinaciones de Ceoris y de la agresión de los [GetTrait('tzimisce').GetName(GetNullCharacter)]. Combinada con el agradable clima, es un lugar de descanso favorito para los asediados [GetTrait('tremere').GetName(GetNullCharacter)].#!"
 building_perugia_chantry_01: "Cofradía de Perugia: Terreno Neutral"
 building_perugia_chantry_01_desc: "Dirigida oficialmente por Retoños de poca importancia, Perugia está muy alejada de las luchas de poder del Consejo."
 building_perugia_chantry_02: "Cofradía de Perugia: Lejos de la Tormenta"
 building_perugia_chantry_02_desc: "No hay una fuerte presencia [GetTrait('tzimisce').GetName(GetNullCharacter)] en Italia. Los magos cansados de la guerra suelen viajar a Perugia para descansar lejos de la sombría y sangrienta Transilvania."
 building_perugia_chantry_03: "Perugia: la Cofradía de Descanso"
 building_perugia_chantry_03_desc: "Un extenso complejo de villas de una sola planta espera a los agotados [GetTrait('tremere').GetName(GetNullCharacter)], con poesía, juegos y pequeñas carreras de figuritas que les despejan la mente durante su estancia aquí."
 
 building_type_abbey_crown_01: "Abadía de la Corona Sagrada"
 building_type_abbey_crown_01_desc: "#F La Abadía de la Corona Sagrada descansa sobre una pequeña colina (45 metros) en un claro rodeado de una mezcla de bosque y matorrales espinosos (algunos tan altos como árboles pequeños). Construida a principios del siglo XII, la abadía consiste en un complejo de edificios cercado por un sólido muro de piedra.#!"
 building_abbey_crown_01: "Pequeña Abadía de la Corona Sagrada"
 building_abbey_crown_01_desc: "El rasgo más agradable de la Abadía de la Corona Sagrada consiste en una serie de celdas subterráneas ubicadas bajo el monasterio. Estas pequeñas salas, destinadas a usarse como zonas de meditación o cámaras de penitencia, ofrecen un alojamiento adecuado para los visitantes."
 building_abbey_crown_02: "Gran Abadía de la Corona Sagrada"
 building_abbey_crown_02_desc: "La Abadía de la Corona Sagrada debe su nombre a una leyenda que atribuye el origen de los matorrales espinosos a la llegada de José de Arimatea a Inglaterra en el siglo I d.C."
 building_abbey_crown_03: "Influyente Abadía de la Corona Sagrada"
 building_abbey_crown_03_desc: "Desde su fundación, la Abadía se ha usado como terreno neutral para resolver disputas entre nobles enfrentados o incluso entre señores vampiros rivales."
 
 building_type_mestha_farmstead_01: "Granja de Mestha"
 building_type_mestha_farmstead_01_desc: "#F Una pequeña y modesta granja olvidada por la historia hace mucho tiempo. Sin embargo, para el ojo atento, este lugar parece extrañamente significativo.#!"
 building_mestha_farmstead_01: "Granja de Mestha: Fragmentos de Historia"
 building_mestha_farmstead_01_desc: "Isis y Anubis, huyendo de las fuerzas de Set, se refugiaron una vez en esta casa, protegidos por una familia fiel."
 building_mestha_farmstead_02: "Granja de Mestha: Recuerdos de Mitos"
 building_mestha_farmstead_02_desc: "Esta pequeña casa vio ascender a la primera Momia a la no-vida, un apresurado experimento que Isis realizó con la esperanza de salvar a Horus y Osiris."
 building_mestha_farmstead_03: "Granja de Mestha: Campo de Batalla de los Dioses"
 building_mestha_farmstead_03_desc: "Set alcanzó a Isis y Anubis, y aquí tuvo lugar una gran batalla, una en la que los Dioses lucharon contra los Dioses."
   

 POD_has_special_building_slot_tt: "Este edificio solo puede construirse en posesiones con una ranura de Edificio Especial."
 
 building_type_hanging_gardens_01: "Jardines Colgantes"
 building_type_hanging_gardens_01_desc: "#F Los Jardines Colgantes de Babilonia fueron una de las Siete Maravillas del Mundo Antiguo enumeradas por la cultura helénica.#!"
 building_hanging_gardens_01: "Jardines Colgantes"
 building_hanging_gardens_01_desc: "Los Jardines Colgantes de Babilonia fueron una de las Siete Maravillas del Mundo Antiguo enumeradas por la cultura helénica. Se describían como una notable hazaña de ingeniería, con una serie ascendente de jardines escalonados que contenían una amplia variedad de árboles, arbustos y enredaderas, semejando una gran montaña verde construida con ladrillos de barro."
 
 building_type_ramessu_court_01: "La Corte de Ramessu"
 building_type_ramessu_court_01_desc: "#F Al estilo de las costumbres del antiguo Egipto, la corte de Ramessu se preocupa poco por la Mascarada y mucho por el protocolo anticuado, la pompa y la gloria.#!"
 building_ramessu_court_01: "La Corte de Ramessu"
 building_ramessu_court_01_desc: "Al estilo de las costumbres del antiguo Egipto, la corte de Ramessu se preocupa poco por la Mascarada y mucho por el protocolo anticuado, la pompa y la gloria."
 
 building_type_sundervere_cult_01: "El Culto de Sundervere"
 building_type_sundervere_cult_01_desc: "#F Maestro de la manipulación y de instigar el celo fanático, los seguidores de Sundervere son mucho más numerosos de lo que muchos pensarían.#!"
 building_sundervere_cult_01: "Culto Pequeño"
 building_sundervere_cult_01_desc: "Incluso en esta etapa temprana, la influencia de Sundervere ha producido muchos fanáticos entusiastas dispuestos a morir por su causa."
 building_sundervere_cult_02: "Culto Mediano"
 building_sundervere_cult_02_desc: "La perniciosa influencia de Sundervere impregna esta región, dándole la fuerza para golpear a los incrédulos."
 building_sundervere_cult_03: "Culto Mayor"
 building_sundervere_cult_03_desc: "Vayas donde vayas aquí, uno de los muchos fanáticos de Sundervere te observará. Esta tierra es suya, lo sepan los demás o no."
    
 building_type_necromantic_sekhem_01: "Fuente de Sekhem Necromántico"
 building_type_necromantic_sekhem_01_desc: "#F Lejos de Egipto y rodeado por el poder del [UmbraGlossaryLocalized('shadowlands','Inframundo')], Inauhaten tuvo que adaptarse para encontrar algunas fuentes... poco habituales de Sekhem.#!"
 building_necromantic_sekhem_01: "Fuente Menor de Sekhem Necromántico"
 building_necromantic_sekhem_01_desc: "Algo de energía del [UmbraGlossary('shadowlands')] está siendo canalizada aquí por Inauhaten para sus misteriosos propósitos."
 building_necromantic_sekhem_02: "Fuente Mediana de Sekhem Necromántico"
 building_necromantic_sekhem_02_desc: "La energía de los muertos se fusiona aquí con el Sekhem de formas misteriosas, impulsada por los propios Rituales de Inauhaten."
 building_necromantic_sekhem_03: "Fuente Mayor de Sekhem Necromántico"
 building_necromantic_sekhem_03_desc: "El [UmbraGlossary('shadowlands')] en esta zona tiene un aura inquietante, siendo absorbido por completo por Inauhaten para alimentar sus extraños y numerosos Rituales."
 
 #Level 1 is a vanilla wonder   
 building_iron_pillar_of_delhi_02: "Pilar de Hierro de Delhi Desequilibrado"
 building_iron_pillar_of_delhi_02_desc: "El pilar emana el poder crudo del Yang. No obstante, para el ojo perspicaz, también puede sentirse el Yin bajo su superficie. El verdadero equilibrio está cerca, pero aún no se ha alcanzado."
 building_iron_pillar_of_delhi_03: "Pilar de Hierro de Delhi Equilibrado"
 building_iron_pillar_of_delhi_03_desc: "Forjado con el hierro más puro, el pilar existe con una composición y forma tan perfectamente equilibradas entre Yin y Yang que ni el viento, ni la lluvia, ni el sol, ni el propio tiempo han estropeado su superficie."
  
 building_type_kashi_bazaar_01: "Bazar de Kashi"
 building_type_kashi_bazaar_01_desc: "#F Una ciudad precariamente equilibrada entre muchas culturas, Kashi es una tierra de oportunidades y peligro.#!"
 building_kashi_bazaar_01: "Pequeño Bazar de Kashi"
 building_kashi_bazaar_01_desc: "Kashi es el punto de entrada más probable para cualquier sobrenatural al Reino Medio, lo que la convierte en un lugar donde se cierran muchos tratos sin conocimiento de las Cortes Chinas."
 building_kashi_bazaar_02: "Bazar de Kashi en Crecimiento"
 building_kashi_bazaar_02_desc: "Los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] rebeldes de China a menudo son exiliados al este, y por ello pasan por Kashi, convirtiendo a toda la ciudad en una especie de pueblo fronterizo."
 building_kashi_bazaar_03: "Bazar de Kashi Bullicioso"
 building_kashi_bazaar_03_desc: "Aquí se puede encontrar de todo, desde oro hasta el debate filosófico más específico. Kashi es un pequeño mundo en sí mismo."
  
 building_type_flaming_mountain_01: "Montañas Llameantes"
 building_type_flaming_mountain_01_desc: "#F Uno de los dos grandes nidos de dragón de Takla Makan. Se dice que fue una puerta hacia [UmbraGlossary('hell_of_being_skinned_alive')]; fue santificado y despejado por los [Glossary('Wan Xian','game_concept_kuei_jin_desc')] al final de la [Glossary('Tercera Era','game_concept_third_age_desc')].#!"
 building_flaming_mountain_01: "Montañas Llameantes Peligrosas"
 building_flaming_mountain_01_desc: "Restos de las legiones infernales de [Glossary('Tou Mu','podgloss.toumu')] todavía aparecen de vez en cuando, haciendo peligroso el Viaje hasta el nido."
 building_flaming_mountain_02: "Montañas Llameantes Estabilizadas"
 building_flaming_mountain_02_desc: "Reforzar los antiguos Rituales de protección de los [Glossary('Wan Xian','game_concept_kuei_jin_desc')] asegura que la puerta permanezca cerrada, con suerte para siempre."
 building_flaming_mountain_03: "Montañas Llameantes Aseguradas"
 building_flaming_mountain_03_desc: "Purificadas de la presencia infernal de [Glossary('Tou Mu','podgloss.toumu')], las Montañas Llameantes actúan ahora como un poderoso nido de dragón por derecho propio."
  
 building_type_black_dragon_nest_01: "Nido del Dragón Negro"
 building_type_black_dragon_nest_01_desc: "#F Un lugar de Chi corrompido que brota de la propia tierra, a menudo enconándose o desvaneciéndose por sí solo.#!"
 building_black_dragon_nest_01: "Nido del Dragón Negro Desatado"
 building_black_dragon_nest_01_desc: "La Corte de la Tortuga Negra fue en su día responsable de destruir estos nidos, pero su caída en la corrupción ha hecho que este deber se abandonara."
 building_black_dragon_nest_02: "Nido del Dragón Negro Estabilizado"
 building_black_dragon_nest_02_desc: "El Pueblo Feroz, $glossary_fera$ de las estepas, caza esos nidos corrompidos, pero aparecen más de los que pueden controlar."
 building_black_dragon_nest_03: "Nido del Dragón Negro Domado"
 building_black_dragon_nest_03_desc: "Una fuente de Chi tan poderosa, aunque corrompida, puede seguir siendo un gran activo para los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] no demasiado preocupados por la decadencia espiritual."
    
 building_type_pataliputra_01: "Pataliputra"
 building_type_pataliputra_01_desc: "#F Pataliputra, capital de grandes potencias de la antigua India, como el Imperio Shishunaga, el Imperio Nanda, el Imperio Maurya, el Imperio Gupta y el Imperio Pala. Durante el periodo Maurya, fue una de las ciudades más grandes del mundo.#!"
 building_pataliputra_01: "Pataliputra Desierta"
 building_pataliputra_01_desc: "Pataliputra entró en un declive gradual a partir del siglo IV, con estructuras cada vez menos numerosas y elaboradas entre este periodo y el año 600 aproximadamente. Después de eso, no hay rastro de actividad humana durante mil años, y el sitio parece haber sido abandonado."
 building_pataliputra_02: "Pataliputra en Ruinas"
 building_pataliputra_02_desc: "Existen muchas teorías sobre la súbita desaparición de esta que fue una gran ciudad, desde una inundación cataclísmica hasta una invasión extranjera. Sea cual sea el caso, quienes tienen la vista adecuada pueden ver restos de la gloria pasada."
 building_pataliputra_03: "Pataliputra Misteriosa"
 building_pataliputra_03_desc: "Registros desenterrados muestran que Pataliputra estuvo entre las primeras ciudades del mundo en tener una forma de autogobierno local altamente eficiente. Un ejemplo del que aún hoy se puede aprender."
    
 building_type_hunter_merchants_01: "Reunir a los Mercaderes"
 building_type_hunter_merchants_01_desc: "#F Ellos tienen el dinero. Tú tienes la necesidad.#!"
 building_hunter_merchants_01: "Acercarse a los Mercaderes"
 building_hunter_merchants_01_desc: "La caza es una empresa costosa. Seguramente podrían ofrecer una ayuda muy necesaria, ¿no?"
 building_hunter_merchants_02: "Convencer a los Mercaderes"
 building_hunter_merchants_02_desc: "¿De qué sirve su dinero si no se usa para combatir a los monstruos en la oscuridad?"
 building_hunter_merchants_03: "Aliarse con los Mercaderes"
 building_hunter_merchants_03_desc: "Poderosos patrocinadores, por fin convencidos de la importancia de tu causa."
      
 building_type_hunter_nobles_01: "Reunir a los Nobles"
 building_type_hunter_nobles_01_desc: "#F Los altos y poderosos están gangrenados por lo sobrenatural. Necesitan tu ayuda, les guste o no.#!"
 building_hunter_nobles_01: "Acercarse a los Nobles"
 building_hunter_nobles_01_desc: "Eliminar a los agentes de los seres sobrenaturales que acosan sus cortes asegurará que los nobles sean receptivos a tus advertencias."
 building_hunter_nobles_02: "Convencer a los Nobles"
 building_hunter_nobles_02_desc: "Sus mezquinos juegos de poder no te conciernen, pero la influencia que ejercen sobre la población sí, desde luego."
 building_hunter_nobles_03: "Aliarse con los Nobles"
 building_hunter_nobles_03_desc: "Por fin ven la amenaza que ha estado bajo sus narices todo este tiempo. Más vale tarde que nunca."
 
 building_type_hunter_militia_01: "Reunir a la Milicia"
 building_type_hunter_militia_01_desc: "#F Con razón temen a la oscuridad. Pero quizá te teman más a ti.#!"
 building_hunter_militia_01: "Acercarse a la Milicia"
 building_hunter_militia_01_desc: "Un grupo de jóvenes de mirada asustada listos para ser asesinados por monstruos de sus peores pesadillas. Tienes trabajo que hacer."
 building_hunter_militia_02: "Convencer a la Milicia"
 building_hunter_militia_02_desc: "Apenas duermen tras lo que les has mostrado. Eso significa que están aprendiendo."
 building_hunter_militia_03: "Aliarse con la Milicia"
 building_hunter_militia_03_desc: "Algunos de ellos podrían sobrevivir para luchar otra noche. Quizá incluso dos."
  
 building_type_hunter_soldiers_01: "Reunir a los Soldados"
 building_type_hunter_soldiers_01_desc: "#F Sus mezquinas guerras no son nada comparadas con la gran Contienda. Tú les enseñarás.#!"
 building_hunter_soldiers_01: "Acercarse a los Soldados"
 building_hunter_soldiers_01_desc: "Asústalos hasta la médula durante su entrenamiento para que no huyan cuando llegue el día de la verdadera batalla."
 building_hunter_soldiers_02: "Convencer a los Soldados"
 building_hunter_soldiers_02_desc: "Las mezquinas preocupaciones y lealtades mundanas se desvanecen cuando los convences de los horrores que les esperan si no luchan ahora mismo."
 building_hunter_soldiers_03: "Aliarse con los Soldados"
 building_hunter_soldiers_03_desc: "Veteranos curtidos, con suerte lo bastante desengañados como para cubrirte las espaldas en las contiendas venideras."
  
 building_type_hunter_clergy_01: "Reunir al Clero"
 building_type_hunter_clergy_01_desc: "#F La fe puede ser un arma poderosa contra el adversario. Siempre que no se dirija mal.#!"
 building_hunter_clergy_01: "Acercarse al Clero"
 building_hunter_clergy_01_desc: "Sus mezquinas preocupaciones dogmáticas no tienen importancia en el destino de la gran Contienda. ¿Por qué no lo entienden?"
 building_hunter_clergy_02: "Convencer al Clero"
 building_hunter_clergy_02_desc: "No te importa a qué Dios adoren, mientras odien al Diablo tanto como tú."
 building_hunter_clergy_03: "Aliarse con el Clero"
 building_hunter_clergy_03_desc: "Salvarán a quienes todavía puedan ser salvados. Tú te encargarás del resto."
   
 building_type_hunter_ducal_01: "Asegurar la Región"
 building_type_hunter_ducal_01_desc: "#F Mientras estés aquí, la gente del pueblo de esta zona podrá dormir en paz. Tú te asegurarás de ello.#!"
 building_hunter_ducal_01: "Asegurar un Vecindario"
 building_hunter_ducal_01_desc: "Empiezas tu Viaje en esta zona, un monstruo muerto a la vez."
 building_hunter_ducal_02: "Asegurar una Aldea"
 building_hunter_ducal_02_desc: "Todavía no es mucho, pero la gratitud de las pocas personas que salvaste sigue valiendo la pena."
 building_hunter_ducal_03: "Asegurar un Pueblo"
 building_hunter_ducal_03_desc: "Tu nombre empieza a conocerse aquí. Se tienden trampas y se afilan dagas para detenerte."
 building_hunter_ducal_04: "Asegurar una Ciudad"
 building_hunter_ducal_04_desc: "Lo sepan o no, has salvado a esta ciudad de la oscuridad. Al menos por ahora."
 building_hunter_ducal_05: "Asegurar la Región"
 building_hunter_ducal_05_desc: "Todos y cada uno de ellos están muertos. Tu llamado debe continuar en otro lugar."
                
 building_type_hunter_akritai_01: "Escuela Monástica Akritai"
 building_type_hunter_akritai_01_desc: "#F Los Akritai están compuestos en su mayoría por monjes y monjas ortodoxos, que rezan y se entrenan por igual para su lucha contra la oscuridad.#!"
 building_hunter_akritai_01: "Pequeña Escuela Monástica Akritai"
 building_hunter_akritai_01_desc: "Una casa capitular de los Cazadores ortodoxos, lo bastante pequeña para acoger a unos pocos monjes y monjas."
 building_hunter_akritai_02: "Escuela Monástica Akritai Respetable"
 building_hunter_akritai_02_desc: "Aquí, hombres y mujeres piadosos aprenden a preparar sus mentes y cuerpos para los terribles rigores de la sagrada tarea que les espera."
 building_hunter_akritai_03: "Gran escuela monástica akritai"
 building_hunter_akritai_03_desc: "Los cánticos de oración y el choque de las espadas pueden oírse día y noche desde este imponente cuartel general de los Akritai."
                 
 building_type_hunter_judge_01: "Refugio de los Jueces"
 building_type_hunter_judge_01_desc: "#F Los Jueces no son numerosos y carecen de una organización central. Aun así, su alcance es mayor de lo que la mayoría cree y pueden encontrar ayuda en los lugares más improbables.#!"
 building_hunter_judge_01: "Pequeño refugio de los Jueces"
 building_hunter_judge_01_desc: "Algo de comida, algunas armas oxidadas y un techo sobre la cabeza. Mucho más de lo que la mayoría de los cazadores de monstruos puede esperar."
 building_hunter_judge_02: "Refugio de los Jueces respetable"
 building_hunter_judge_02_desc: "Una dirección bien conocida para los miembros errantes de los Jueces, que ofrece un refugio muy necesario."
 building_hunter_judge_03: "Gran refugio de los Jueces"
 building_hunter_judge_03_desc: "Aquí se puede encontrar todo lo necesario para comenzar una caza adecuada, un lujo con el que la mayoría de las órdenes de cazadores de monstruos solo podría soñar."
                  
 building_type_hunter_ikhwan_01: "Tierras tribales de los Ikhwan Al-Safa"
 building_type_hunter_ikhwan_01_desc: "#F Los Ikhwan están unidos, ante todo, por lazos familiares. La caza de monstruos es enseñada por los padres a sus hijos tan pronto como tienen edad suficiente para cabalgar por sí mismos.#!"
 building_hunter_ikhwan_01: "Pequeñas tierras tribales"
 building_hunter_ikhwan_01_desc: "Una pequeña familia de cazadores que lucha unida contra los monstruos de la noche."
 building_hunter_ikhwan_02: "Tierras tribales respetables"
 building_hunter_ikhwan_02_desc: "Comparten sus vidas en estas tierras, así como su compromiso con la causa."
 building_hunter_ikhwan_03: "Grandes tierras tribales"
 building_hunter_ikhwan_03_desc: "De padre a hijo, de madre a hija, cada miembro de la tribu aprende sobre la santa tarea y sus deberes para luchar contra la oscuridad."
 
 building_type_hunter_independent_01: "Armería de caza"
 building_type_hunter_independent_01_desc: "#F Todo lo que necesitas para llevar la delantera contra cualquiera.#!"
 building_hunter_independent_01: "Pequeña armería de caza"
 building_hunter_independent_01_desc: "Algunas armas bien escondidas para cuando las necesites. No es mucho, pero podría marcar la diferencia entre la vida y la muerte."
 building_hunter_independent_02: "Armería de caza respetable"
 building_hunter_independent_02_desc: "Tienes suficiente aquí para resistir un asedio. O, lo que es más probable, para organizar uno."
 building_hunter_independent_03: "Gran armería de caza"
 building_hunter_independent_03_desc: "Armas, medicinas, trampas, viejos libros de conocimiento prohibido... tu tesoro personal haría que los monstruos que cazas ardan de envidia."
 
 building_type_hunter_qorjin_01: "Kheshig de Qorjin"
 building_type_hunter_qorjin_01_desc: "#F Los cazadores de Qorjin ocupan la posición única de estar apoyados por el mayor señorío mortal del mundo: el Imperio mongol. La guardia personal de Qorjin es representativa de este fácil acceso a guerreros de élite.#!"
 building_hunter_qorjin_01: "Pequeño Kheshig de Qorjin"
 building_hunter_qorjin_01_desc: "La guardia personal de Qorjin, elegida a mano por el Kan, es una fuerza de combate pequeña pero eficaz."
 building_hunter_qorjin_02: "Kheshig de Qorjin respetable"
 building_hunter_qorjin_02_desc: "Ahora entrenados para comprender y resistir lo sobrenatural, los Kheshig de Qorjin son rivales dignos para cualquier monstruo que merodee las estepas."
 building_hunter_qorjin_03: "Gran Kheshig de Qorjin"
 building_hunter_qorjin_03_desc: "Héroes para su pueblo, todos ellos, los Kheshig de Qorjin son cazadores de una habilidad y experiencia sin parangón."
 
 building_type_hunter_dazbog_01: "Logia de guerreros de Dazbog"
 building_type_hunter_dazbog_01_desc: "#F Tal como hicieron sus grandes fundadores antes que ellos, los guerreros modernos de Dazbog entrenan día y noche para estar plenamente preparados para la reconquista de su Tierra Natal.#!"
 building_hunter_dazbog_01: "Pequeña logia de Dazbog"
 building_hunter_dazbog_01_desc: "Solo unos pocos guerreros entrenan aquí, un lamentable remanente de los tiempos del gran Dazbog."
 building_hunter_dazbog_02: "Logia de Dazbog respetable"
 building_hunter_dazbog_02_desc: "Los nuevos conversos portan el hacha y el deber de Dazbog en esta logia, bajo la mirada vigilante de veteranos curtidos."
 building_hunter_dazbog_03: "Gran refugio de Dazbog"
 building_hunter_dazbog_03_desc: "El propio Dazbog se sentiría orgulloso al ver a los numerosos guerreros, tanto jóvenes como viejos, preparándose para la batalla aquí. ¡Por fin una visión temible para los odiados engendros!"
 
 building_type_sanctified_area_01: "Área santificada"
 building_type_sanctified_area_01_desc: "#F Los más piadosos maestros de la Fe Verdadera pueden santificar permanentemente un área, haciendo que cualquier sobrenatural no deseado que camine por ella experimente resultados muy desagradables.#!"
 building_sanctified_area_01: "Área santificada"
 building_sanctified_area_01_desc: "Un pequeño área bendecida por un individuo piadoso. Los peones del Adversario experimentan una gran incomodidad al caminar por ella."
 building_sanctified_area_02: "Área consagrada"
 building_sanctified_area_02_desc: "Bendecida por uno de los creyentes más impresionantes de su época, esta tierra es un anatema para el Enemigo."
 
 building_type_hagia_sophia_02: "Santa Sofía"
 building_type_hagia_sophia_02_desc: "La Santa Sofía es una verdadera maravilla de la ingeniería, con una cúpula masiva que destaca como su característica más impresionante. Completada en el año 537 d. C. por el emperador Justiniano I, alberga ahora al Patriarca Ecuménico y se erige como un monumento al cristianismo.\n\nY así permanecerá por toda la eternidad, pues seguramente nada podrá derribar el poder de Roma."

 building_type_st_andrew_01: "El monasterio de San Andrés"
 building_type_st_andrew_01_desc: "#F Un monasterio construido sobre el infame foso de Damburrow.#!"
 building_st_andrew_01: "Ruinas de un claustro cisterciense"
 building_st_andrew_01_desc: "Las ruinas de un claustro abandonado debido a la locura que emanaba del Foso. Este evento encabezó la investigación de la Inquisición en el lugar."
 building_st_andrew_02: "Puesto de avanzada de la Orden Roja"
 building_st_andrew_02_desc: "Una célula de Hermanos Rojos está preparando un centro de investigación en el claustro abandonado para investigar el Foso."
 building_st_andrew_03: "Centro de investigación de la Orden Roja"
 building_st_andrew_03_desc: "La Orden Roja ha renovado completamente el monasterio y la investigación del Foso y del demonio que reside en su interior está en marcha. Algunos temen que ellos mismos puedan ser la causa de la locura que se propaga."

 building_type_holy_mother_01: "El convento de la Madre Santa"
 building_type_holy_mother_01_desc: "#F El convento más importante de la Hermandad de San Juan. Más escuela que hospital, es un jardín de tranquilidad y un lugar de respiro frente a la lucha.#!"
 building_holy_mother_01: "Hospital del convento"
 building_holy_mother_01_desc: "Inquisidores de todas las órdenes vienen a este convento para meditar, reflexionar y recuperarse."
 building_holy_mother_02: "Administración de la Hermandad de San Juan"
 building_holy_mother_02_desc: "Las operaciones de cada hermana de San Juan se planifican, organizan y apoyan desde aquí."
 building_holy_mother_03: "Oficina de la Madre Santa de la Hermandad de San Juan"
 building_holy_mother_03_desc: "La oficina propia de la Madre Santa de la Hermandad está aquí. Existe una comunicación directa entre este convento, Roma y el liderazgo de las otras órdenes."

 building_type_st_john_01: "El convento de San Juan Divino"
 building_type_st_john_01_desc: "#F La casa madre de la Hermandad y el lugar de descanso de la bendita hermana Teresa, su fundadora.#!"
 building_st_john_01: "Casa madre de la Hermandad"
 building_st_john_01_desc: "La mayor instalación educativa de las hermanas ha sido eclipsada políticamente últimamente, pero sigue siendo el corazón de la Hermandad."
 building_st_john_02: "Tumba de Teresa"
 building_st_john_02_desc: "El último lugar de descanso de la primera hermana es un área bendecida."
 building_st_john_03: "Lugar de peregrinación de San Juan"
 building_st_john_03_desc: "La tumba y las reliquias de Teresa pueden obrar milagros, y gente de todas partes viene al convento para verlas."

 building_type_st_james_01: "El hospicio de Santiago el Mayor"
 building_type_st_james_01_desc: "#F El hospicio es el edificio no militar más grande operado por los Caballeros de Acre#!"
 building_st_james_01: "Hospital de Santiago el Mayor"
 building_st_james_01_desc: "Un hospital para miembros de la orden y viajeros en su peregrinación a Compostela."
 building_st_james_02: "Orfanato de Santiago el Mayor"
 building_st_james_02_desc: "El orfanato para los pupilos y potenciales futuros caballeros de Acre. Muchos futuros campeones de la orden pasaron su infancia aquí."
 building_st_james_03: "Comandancia de Santiago el Mayor"
 building_st_james_03_desc: "La comandancia tiene todo lo que un hermano necesita para una caza de demonios exitosa: armaduras, caballos y reliquias siempre están disponibles."

 building_type_bookshop_01: "Librería de Aignen"
 building_type_bookshop_01_desc: "#F Una librería poco llamativa en Toulouse.#!"
 building_bookshop_01: "Pequeña librería"
 building_bookshop_01_desc: "Una pequeña librería cuyo dueño parece tener muchos contactos y acceso a una gran cantidad de libros."
 building_bookshop_02: "Librería bulliciosa"
 building_bookshop_02_desc: "Una librería con clientes de toda Europa. Aquí se puede encontrar cualquier libro, lo que ha causado un gran revuelo entre las autoridades eclesiásticas preocupadas."
 building_bookshop_03: "Santuario Oculi Dei para Aignen"
 building_bookshop_03_desc: "El lugar de descanso del antiguo líder de los Oculi Dei, Aignen, se encuentra aquí. Aunque la Iglesia nunca reconocerá la increíble labor que realizó por el bien común, los Oculi Dei no lo olvidarán."

 building_type_dragon_nested_alchemy_laboratory_01: "Laboratorio alquímico sobre un nido de dragón"
 building_type_dragon_nested_alchemy_laboratory_01_desc: "#F Un complejo conjunto de edificios interconectados para fluir con el nido de dragón situado debajo de ellos.#!"
 building_dragon_nested_alchemy_laboratory_01: "Laboratorio alquímico primitivo sobre un nido de dragón"
 building_dragon_nested_alchemy_laboratory_01_desc: "Un complejo conjunto de edificios interconectados para fluir con el nido de dragón situado debajo de ellos.\n\nActualmente es muy primitivo y no sirve de mucho."
 building_dragon_nested_alchemy_laboratory_02: "Laboratorio alquímico simple sobre un nido de dragón"
 building_dragon_nested_alchemy_laboratory_02_desc: "Un complejo conjunto de edificios interconectados para fluir con el nido de dragón que los rodea.\n\nActualmente es un conjunto de edificios bastante complejo en sintonía con el nido de dragón, ofreciendo algunos beneficios."
 building_dragon_nested_alchemy_laboratory_03: "Laboratorio alquímico sobre un nido de dragón"
 building_dragon_nested_alchemy_laboratory_03_desc: "Un complejo conjunto de edificios interconectados para fluir con el nido de dragón que los rodea.\n\nActualmente es un conjunto de edificios complejo que se entrelaza con el nido de dragón."
 building_dragon_nested_alchemy_laboratory_04: "Laboratorio alquímico complejo sobre un nido de dragón"
 building_dragon_nested_alchemy_laboratory_04_desc: "Un complejo conjunto de edificios interconectados para fluir con el nido de dragón que los rodea.\n\nActualmente es un conjunto de edificios muy complejo que se entrelaza con el nido de dragón para obtener grandes beneficios."
 building_dragon_nested_alchemy_laboratory_05: "Laboratorio alquímico extendido sobre un nido de dragón"
 building_dragon_nested_alchemy_laboratory_05_desc: "Un complejo conjunto de edificios interconectados para fluir con el nido de dragón que los rodea.\n\nActualmente es un conjunto de edificios muy complejo que se entrelaza con el nido de dragón y lo amplifica para tu propio beneficio."
 building_dragon_nested_alchemy_laboratory_06: "Laboratorio alquímico sobre un nido de dragón similar a la naturaleza"
 building_dragon_nested_alchemy_laboratory_06_desc: "Un complejo conjunto de edificios interconectados para fluir con el nido de dragón que los rodea.\n\nActualmente está conectado al nido de dragón a tal nivel que, a primera vista, no hay separación entre ambos."
 building_dragon_nested_alchemy_laboratory_07: "Laboratorio alquímico profundo sobre un nido de dragón"
 building_dragon_nested_alchemy_laboratory_07_desc: "Un complejo conjunto de edificios interconectados para fluir con el nido de dragón que los rodea.\n\nActualmente está conectado al nido de dragón a un nivel muy alto, expandiendo enormemente el potencial alquímico de la zona."
 building_dragon_nested_alchemy_laboratory_08: "Laboratorio alquímico sobre un nido de dragón de vena"
 building_dragon_nested_alchemy_laboratory_08_desc: "Un complejo conjunto de edificios interconectados para fluir con el nido de dragón que los rodea.\n\nActualmente está conectado al nido de dragón para asegurar que puedas usar directamente sus energías en tus creaciones alquímicas."
 
 building_type_bloodflowers_fleshpits_01: "Pozos de carne de las Flores de Sangre"
 building_type_bloodflowers_fleshpits_01_desc: "#F Un salón de alimentación, una orgía interminable, un altar de sacrificios; un lugar donde los mortales vienen a venerar a sus Diosas [Glossary('Penangallan','podgloss.penangallan')]. Algunos incluso podrían sobrevivir al éxtasis.#!"
 building_bloodflowers_fleshpits_01: "Pozos de carne de las Flores de Sangre"
 building_bloodflowers_fleshpits_01_desc: "Un salón de alimentación, una orgía interminable, un altar de sacrificios; un lugar donde los mortales vienen a venerar a sus Diosas [Glossary('Penangallan','podgloss.penangallan')]. Algunos incluso podrían sobrevivir al éxtasis."

 building_type_longmen_caves_01: "Cuevas de Longmen"
 building_type_longmen_caves_01_desc: "#F Durante la era de la Quema de los Libros, los Cazadores Shih devastaron gran parte de la sociedad de $pod_kueijin$. Los textos preciosos se ocultaron apresuradamente en las cuevas de Longmen, una maniobra que los salvaguardó. Hasta el día de hoy, sigue siendo un respetado lugar de aprendizaje.#!"
 building_longmen_caves_01: "Cuevas de Longmen toscas"
 building_longmen_caves_01_desc: "Durante la era de la Quema de los Libros, los Cazadores Shih devastaron gran parte de la sociedad de $pod_kueijin$. Los textos preciosos se ocultaron apresuradamente en las cuevas de Longmen, una maniobra que los salvaguardó. Hasta el día de hoy, sigue siendo un respetado lugar de aprendizaje."
 building_longmen_caves_02: "Cuevas de Longmen reformadas"
 building_longmen_caves_02_desc: "Con más suministros y preparativos para recibir visitantes extranjeros, las cuevas de Longmen se asemejan ahora a una biblioteca natural."

 building_type_zero_kilometer_01: "Kilómetro Cero"
 building_type_zero_kilometer_01_desc: "#F Este punto específico en Japón es el núcleo de las fuerzas de Chi de la isla. Para los $pod_kueijin$, el Kilómetro Cero es como un vasto reactor de poder y energía espiritual. Cada templo en Japón habitado por $pod_kueijin$ se alimenta de esta fuente central.#!"
 building_zero_kilometer_01: "Kilómetro Cero"
 building_zero_kilometer_01_desc: "Este punto específico en Japón es el núcleo de las fuerzas de Chi de la isla. Para los $pod_kueijin$, el Kilómetro Cero es como un vasto reactor de poder y energía espiritual. Cada templo en Japón habitado por $pod_kueijin$ se alimenta de esta fuente central."

 building_type_mt_meru_01: "Monte Meru"
 building_type_mt_meru_01_desc: "#F El Monte Meru es el paraíso mítico de los $pod_kueijin$, el lugar de donde proceden antes de la destrucción que ellos mismos provocaron. Para algunos, ya no existe y es solo una alegoría, pero se han realizado muchas expediciones en el Tíbet y se han encontrado pruebas concluyentes... aunque ningún $pod_kueijin$ ha sido capaz jamás de escalarlo y traer pruebas.#!"
 building_mt_meru_01: "Monte Meru"
 building_mt_meru_01_desc: "El monte Meru es el paraíso mítico de los $pod_kueijin$, el lugar de donde proceden antes de la destrucción que ellos mismos se provocaron. Para algunos ya no existe y es solo una alegoría, pero se han realizado muchas expediciones en el Tíbet y se han encontrado pruebas concluyentes... aunque ningún $pod_kueijin$ ha sido capaz de escalarlo y traer pruebas."

 building_type_library_of_the_jade_court_01: "Biblioteca de la Corte de Jade"
 building_type_library_of_the_jade_court_01_desc: "#F Aunque queda eclipsada por la Biblioteca de Hueso, la Biblioteca de Jade es famosa por su política más... «abierta» respecto a textos ampliamente considerados como heréticos.#!"
 building_library_of_the_jade_court_01: "Biblioteca de la Corte de Jade"
 building_library_of_the_jade_court_01_desc: "Aunque queda eclipsada por la Biblioteca de Hueso, la Biblioteca de Jade es famosa por su política más... «abierta» respecto a textos ampliamente considerados como heréticos."

 building_type_black_lotus_temple_01: "Templo del Loto Negro"
 building_type_black_lotus_temple_01_desc: "#F Construido por la propia Serena Maestra de la Perla Negra, este es el templo más antiguo de la Canción de la Sombra. Como santuario supremo del Yin y la nada, su silencio y sus pasillos encantados son una prueba incluso para el visitante más frío de corazón.#!"
 building_black_lotus_temple_01: "Templo del Loto Negro"
 building_black_lotus_temple_01_desc: "Construido por la propia Serena Maestra de la Perla Negra, este es el templo más antiguo de la Canción de la Sombra. Como santuario supremo del Yin y la nada, su silencio y sus pasillos encantados son una prueba incluso para el visitante más frío de corazón."

 building_type_garden_of_samchok_01: "Jardín de Samchok"
 building_type_garden_of_samchok_01_desc: "#F El propio establecimiento de Soo-kyung Ahn es un lugar de aprendizaje y transacciones. El famoso jade de la Corte del Dragón Azul suele ser comprado por los visitantes mientras la anfitriona deleita a la audiencia con sus muchos cuentos fantásticos.#!"
 building_garden_of_samchok_01: "Jardín de Samchok"
 building_garden_of_samchok_01_desc: "El propio establecimiento de Soo-kyung Ahn es un lugar de aprendizaje y transacciones. El famoso jade de la Corte del Dragón Azul suele ser comprado por los visitantes mientras la anfitriona deleita a la audiencia con sus muchos cuentos fantásticos."

 building_type_the_bone_library_01: "La Biblioteca de Hueso"
 building_type_the_bone_library_01_desc: "#F En pocas palabras, la mayor biblioteca de los $pod_kueijin$, operada por las Flores de Hueso que controlan a cualquier visitante. Es con mucho la posesión política más poderosa que tiene este [Glossary('Dharma','podgloss.dharma')] aislacionista, ya que todo Mandarín que se precie ha tenido que pedir un favor y venir aquí en algún momento de su camino hacia la Iluminación.#!"
 building_the_bone_library_01: "La Biblioteca de Hueso"
 building_the_bone_library_01_desc: "En pocas palabras, la mayor biblioteca de los $pod_kueijin$, operada por las Flores de Hueso que controlan a cualquier visitante. Es con mucho la posesión política más poderosa que tiene este [Glossary('Dharma','podgloss.dharma')] aislacionista, ya que todo Mandarín que se precie ha tenido que pedir un favor y venir aquí en algún momento de su camino hacia la Iluminación."

 building_type_thousand_crane_monastery_01: "Monasterio de las Mil Grullas"
 building_type_thousand_crane_monastery_01_desc: "#F El lugar donde la Madre de las Mil Grullas alcanzó la Iluminación. Aunque el lugar ha cambiado mucho desde aquellos tiempos auspiciosos, todos los Dragones Azotadores consideran este lugar como el santuario más sagrado de su [Glossary('Dharma','podgloss.dharma')].#!"
 building_thousand_crane_monastery_01: "Monasterio de las Mil Grullas"
 building_thousand_crane_monastery_01_desc: "El lugar donde la Madre de las Mil Grullas alcanzó la Iluminación. Aunque el lugar ha cambiado mucho desde aquellos tiempos auspiciosos, todos los Dragones Azotadores consideran este lugar como el santuario más sagrado de su [Glossary('Dharma','podgloss.dharma')]."

 building_type_temple_of_the_lotus_pond_in_winter_01: "Templo del Estanque de Loto en Invierno"
 building_type_temple_of_the_lotus_pond_in_winter_01_desc: "#F La base de operaciones de los Ocho Lotos Florecientes [Glossary('Dharma','podgloss.dharma')]. Alberga seminarios, reuniones y debates. Los estudiantes vienen de muy lejos simplemente para escuchar a algunos de los maestros más exaltados que suelen estar presentes aquí.#!"
 building_temple_of_the_lotus_pond_in_winter_01: "Templo del Estanque de Loto en Invierno"
 building_temple_of_the_lotus_pond_in_winter_01_desc: "La base de operaciones de los Ocho Lotos Florecientes [Glossary('Dharma','podgloss.dharma')]. Alberga seminarios, reuniones y debates. Los estudiantes vienen de muy lejos simplemente para escuchar a algunos de los maestros más exaltados que suelen estar presentes aquí."

 building_type_beijing_temples_01: "Templos de la Grulla"
 building_type_beijing_temples_01_desc: "#F Una congregación de templos menores y mayores de las Grullas Resplandecientes [Glossary('Dharma','podgloss.dharma')]. Se prestan muchos servicios aquí, desde la enseñanza hasta los archivos, lo que lo convierte en un punto de reunión para los caminantes de este [Glossary('Dharma','podgloss.dharma')].#!"
 building_beijing_temples_01: "Templos de la Grulla"
 building_beijing_temples_01_desc: "Una congregación de templos menores y mayores de las Grullas Resplandecientes [Glossary('Dharma','podgloss.dharma')]. Se prestan muchos servicios aquí, desde la enseñanza hasta los archivos, lo que lo convierte en un punto de reunión para los caminantes de este [Glossary('Dharma','podgloss.dharma')]."

 building_type_temple_three_mountains_01: "Templo de las Tres Montañas"
 building_type_temple_three_mountains_01_desc: "#F Un experimento sociológico llevado a cabo por un grupo de Grullas Resplandecientes; este templo supervisa una aldea donde los mortales no son conscientes de que están siendo observados. Los maestros del templo supervisan el crecimiento de la aldea y, a veces, ponen en marcha algunas «pruebas» para obtener información sobre sus últimos caprichos.#!"
 building_temple_three_mountains_01: "Templo de las Tres Montañas"
 building_temple_three_mountains_01_desc: "Un experimento sociológico llevado a cabo por un grupo de Grullas Resplandecientes; este templo supervisa una aldea donde los mortales no son conscientes de que están siendo observados. Los maestros del templo supervisan el crecimiento de la aldea y, a veces, ponen en marcha algunas «pruebas» para obtener información sobre sus últimos caprichos."

 building_type_hall_of_the_black_tortoise_01: "Salón de la Tortuga Negra"
 building_type_hall_of_the_black_tortoise_01_desc: "#F Un gran salón llamado Qaragha; la Corte de la Tortuga Negra del Norte gobernó aquí antes de que llegara el [Glossary('Anda','podgloss.anda')]. Quemado hasta los cimientos, con la mayoría de sus habitantes aún en su interior, ahora permanece como un recordatorio de la fuerza de los hijos de Dobrul.#!"
 building_hall_of_the_black_tortoise_01: "Salón de la Tortuga Negra"
 building_hall_of_the_black_tortoise_01_desc: "Un gran salón llamado Qaragha; la Corte de la Tortuga Negra del Norte gobernó aquí antes de que llegara el [Glossary('Anda','podgloss.anda')]. Quemado hasta los cimientos, con la mayoría de sus habitantes aún en su interior, ahora permanece como un recordatorio de la fuerza de los hijos de Dobrul."

 building_type_daisen_mountain_01: "Monte Daisen"
 building_type_daisen_mountain_01_desc: "#F Un pico hermoso y traicionero que se dice es el hogar de Kagutsuchi-no-Mikoto; esta montaña ha sido durante mucho tiempo el campo de entrenamiento de los asesinos $pod_kueijin$. Kuro-sama es el mentor más famoso presente aquí, pero difícilmente el único.#!"
 building_daisen_mountain_01: "Monte Daisen"
 building_daisen_mountain_01_desc: "Un pico hermoso y traicionero que se dice es el hogar de Kagutsuchi-no-Mikoto; esta montaña ha sido durante mucho tiempo el campo de entrenamiento de los asesinos $pod_kueijin$. Kuro-sama es el mentor más famoso presente aquí, pero difícilmente el único."

 building_type_ruins_of_bhuvar_01: "Ruinas de Bhuvar"
 building_type_ruins_of_bhuvar_01_desc: "#F En la ciudad-templo de Tirumala, la Tribu Celestial está íntimamente familiarizada con la megafauna que vaga por el mundo de los fantasmas de Bhuvar (conocido en el mundo occidental como las Tierras de las Sombras).\nDurante siglos, se ha convertido en una especie de ritual de iniciación que suele tener lugar durante el festival de Diwali, de varias noches: los jóvenes Muertos Hambrientos recién llegados a la Tribu Celestial (a menudo dos o tres semidioses, pero a veces solo uno) son puestos a prueba en este entorno desolador.#!"
 building_ruins_of_bhuvar_01: "Ruinas de Bhuvar"
 building_ruins_of_bhuvar_01_desc: "En la ciudad-templo de Tirumala, la Tribu Celestial está íntimamente familiarizada con la megafauna que vaga por el mundo de los fantasmas de Bhuvar (conocido en el mundo occidental como las Tierras de las Sombras).\nDurante siglos, se ha convertido en una especie de ritual de iniciación que suele tener lugar durante el festival de Diwali, de varias noches: los jóvenes Muertos Hambrientos recién llegados a la Tribu Celestial (a menudo dos o tres semidioses, pero a veces solo uno) son puestos a prueba en este entorno desolador."

 building_type_secret_library_of_shigatse_01: "Biblioteca Secreta de Shigatse"
 building_type_secret_library_of_shigatse_01_desc: "#F Los monjes de la Flor de Hueso de Shigatse se dedican a conocer cosas muy peligrosas. Como tal, su biblioteca no está abierta al público ni siquiera se sabe que existe.#!"
 building_secret_library_of_shigatse_01: "Biblioteca Secreta de Shigatse"
 building_secret_library_of_shigatse_01_desc: "Los monjes de la Flor de Hueso de Shigatse se dedican a conocer cosas muy peligrosas. Como tal, su biblioteca no está abierta al público ni siquiera se sabe que existe."
 
 POD_eastern_religion_trigger_tt: "Tu fe debe tener raíces en Asia (Kuei-Jin, Contemplador de Estrellas, Khan, Shih, Raktasadhus, Wu Tian, etc.)"
 
 building_type_silbury_hill_01: "Colina de Silbury"
 building_type_silbury_hill_01_desc: "#F La colina de Silbury es un enigma. El montículo de tiza, que mide más de 130 pies de altura y cubre casi 6 acres, fue construido mucho antes de la llegada de los romanos. Las leyendas de los Fianna dicen que un rey hada o tribus adoradoras construyeron el montículo, pero nadie lo sabe con certeza, ya que siglos de contemplación por parte de magos y Garou han formado un caern de Enigmas.\nDurante la agitación del reinado de Esteban, los Garou perdieron el caern; un poderoso grupo de magos eruditos expulsó al sept local mediante grandes magias.#!"
 building_silbury_hill_01: "Colina de Silbury"
 building_silbury_hill_01_desc: "$building_type_silbury_hill_01_desc$"
  
 building_type_draycott_castle_01: "Ruinas del Castillo de Draycott"
 building_type_draycott_castle_01_desc: "#F El barón Draycott, un hombre cruel, castigaba duramente al campesinado ante la más mínima sugerencia de una infracción. Un anciano que se acercó demasiado al castillo fue azotado y luego colgado de las almenas como ejemplo para los demás.\nEsa noche, todos los Garou de kilómetros a la redonda se reunieron para vengar a su Parentela. Asaltando el castillo, mataron al barón —lentamente— y procedieron a desmantelar el castillo, piedra a piedra y madera a madera. Los cimientos y muchas de las piedras siguen allí hoy en día, un testimonio de la voluntad de los Garou.#!"
 building_draycott_castle_01: "Ruinas del Castillo de Draycott"
 building_draycott_castle_01_desc: "$building_type_draycott_castle_01_desc$"
  
 building_type_fir_chreig_01: "Fir Chreig"
 building_type_fir_chreig_01_desc: "#F Un túmulo con cámara y un montículo bajo yacen dentro de un círculo de piedra. Antiguos sacerdotes realizaban ceremonias aquí, y los Garou continúan la práctica. En tiempos de la necesidad más extrema, los Teúrgos realizan un Ritual que transforma una piedra de la avenida norte en un gigante de roca. El gigante luchará, cargará o cumplirá otras peticiones sencillas hasta el siguiente amanecer o atardecer; en ese momento, la piedra se hace añicos.#!"
 building_fir_chreig_01: "Fir Chreig"
 building_fir_chreig_01_desc: "$building_type_fir_chreig_01_desc$"
 
 building_type_loch_ness_01: "Lago Ness"
 building_type_loch_ness_01_desc: "#F En Glen Mor se encuentra Loch Ness: veinticuatro millas de largo, una milla de ancho, sin fondo (según muchos) y amargamente fría.\nLos Fianna de las Tierras Altas se reúnen en el Loch cada verano para banquetear, festejar y celebrar concursos de todo tipo. Además de las típicas actividades de los Fianna como la música y las competiciones de narración de historias, los visitantes encontrarán concursos de escalada, carreras a pie, lanzamiento de lanzas y lucha libre. El concurso más famoso es el nado a través del Loch, una casi imposibilidad para los humanos normales y solo ligeramente más fácil para los Garou.#!"
 building_loch_ness_01: "Lago Ness"
 building_loch_ness_01_desc: "$building_type_loch_ness_01_desc$"
 
 building_type_yr_wyddfa_fawr_01: "Yr Wyddfa Fawr"
 building_type_yr_wyddfa_fawr_01_desc: "#F El segundo pico más alto de las Islas Británicas, Yr Wyddfa Fawr, se alza sobre sus vecinos en la cordillera, dominando valles verdes y llanuras pedregosas y azotadas del norte de Gwynedd. Su nombre galés significa «la gran tumba», y existen varias leyendas tras el nombre. Algunos dicen que un gigante duerme bajo la montaña; otros sugieren que algunos de los caballeros del Rey Arturo —o incluso el propio Rey Arturo— descansan allí. Todo el mundo sabe que es un lugar de poder.#!"
 building_yr_wyddfa_fawr_01: "Yr Wyddfa Fawr"
 building_yr_wyddfa_fawr_01_desc: "$building_type_yr_wyddfa_fawr_01_desc$"
 
 building_type_shrine_st_olwen_01: "El Santuario de Santa Olwen"
 building_type_shrine_st_olwen_01_desc: "#F Gales está bendecido con una abundancia excesiva de santos que pueden o no ser reconocidos por Roma. Santa Olwen es uno de ellos. Una joven amable y cariñosa, ayudó a los pobres e incluso cuidó de animales indefensos o heridos hasta su muerte a manos de bandidos.\nUn pequeño santuario de piedra se alza ahora junto al arroyo donde murió, donde los enfermos y leprosos vienen a beber y bañarse en las aguas curativas. El lugar es mantenido por una abadía cercana, que conserva los huesos de la santa en un relicario.#!"
 building_shrine_st_olwen_01: "El Santuario de Santa Olwen"
 building_shrine_st_olwen_01_desc: "$building_type_shrine_st_olwen_01_desc$"
     
 building_type_silver_tara_01: "Silver Tara"
 building_type_silver_tara_01_desc: "#F Silver Tara, llamada correctamente Air-geteamhair, es el palacio del Ard Righ de los Fianna. Ningún lugar, ni siquiera Bru na Boinne, es más sagrado para la tribu.\nUn poderoso caern de Honor, Tara es el lugar donde se resuelven las disputas y se otorgan honores. Se cree que la Tara original fue construida varios cientos de años antes del nacimiento de Cristo; algunos afirman que fue construida con la ayuda de los Tuatha de Danaan.\nEl complejo se asienta sobre una colina que se eleva 200 pies sobre la llanura circundante, rodeado por siete grandes murallas de tierra y piedra. Cada una de las siete puertas está revestida de plata y adornada con las cabezas de enemigos vencidos.#!"
 building_silver_tara_01: "Silver Tara"
 building_silver_tara_01_desc: "$building_type_silver_tara_01_desc$"
     
 building_type_wounded_unicorn_01: "Caern del Unicornio Herido"
 building_type_wounded_unicorn_01_desc: "#F Quizás el Caern de Curación más renombrado de la tierra, los cuidadores de los Hijos de Gaia del Unicornio Herido dan la bienvenida a todos para ser reconfortados tanto mental como físicamente.\nSin embargo, esto no los convierte en necios débiles, como aprendió un grupo temerario de Señores de la Sombra al intentar conquistar la zona.#!"
 building_wounded_unicorn_01: "Unicornio Herido"
 building_wounded_unicorn_01_desc: "$building_type_wounded_unicorn_01_desc$"
     
 building_type_caern_vigilance_01: "Caern de la Vigilancia"
 building_type_caern_vigilance_01_desc: "#F Fundado por los Caminantes Silenciosos tras la masacre de Beziers durante la Cruzada Albigense, este Caern pronto aumentó su poder con la ayuda de los amargos wraiths asesinados durante el asedio, que culpan tanto a los vampiros como a los mortales por el suceso.#!"
 building_caern_vigilance_01: "Caern de la Vigilancia"
 building_caern_vigilance_01_desc: "$building_type_caern_vigilance_01_desc$"
  
 building_type_blood_fist_01: "Caern del Puño de Sangre"
 building_type_blood_fist_01_desc: "#F Fundado por los Fenrir tras su victoria contra los romanos hace mucho tiempo, este caern es el centro de su poder en el Bosque Negro.\nTodos aquellos que entren para contemplar los nombres grabados de los héroes de los antiguos Fenrir deben primero ganar un desafío mediante el combate.#!"
 building_blood_fist_01: "Caern del Puño de Sangre"
 building_blood_fist_01_desc: "$building_type_blood_fist_01_desc$"
  
 building_type_caern_sybil_01: "Caern de la Sibila"
 building_type_caern_sybil_01_desc: "#F Lo que antaño fue un respetado caern de las Furias Negras, del que se decía que tenía influencia sobre los reyes de Roma, fue arrebatado por los Señores de la Sombra.\nSus nuevos dueños continúan con la tradición de tener a una Sibila Teúrga que responde a las preguntas de los visitantes, a costa de un favor debido a los Señores de la Sombra, por supuesto.#!"
 building_caern_sybil_01: "Caern de la Sibila"
 building_caern_sybil_01_desc: "$building_type_caern_sybil_01_desc$"
 
 building_type_iron_wood_01: "Caern del Bosque de Hierro"
 building_type_iron_wood_01_desc: "#F Este caern se alza donde un grupo de caballeros cristianos intentó interrumpir una ceremonia pagana y fueron masacrados por los espíritus que montaban guardia.\nLos Fenrir lo utilizan ahora como base para planear contraataques contra la incursión de la Iglesia en el Báltico.#!"
 building_iron_wood_01: "Caern del Bosque de Hierro"
 building_iron_wood_01_desc: "$building_type_iron_wood_01_desc$"

 building_type_white_nights_01: "Caern de las Noches Blancas"
 building_type_white_nights_01_desc: "#F Muy lejos de la mayoría de los asentamientos humanos, este caern de las Garras Rojas ha ganado prominencia por ser el lugar donde se revelaron las profecías de las sombras.\nTambién es conocido por ser un lugar preciado para el espíritu de Helios, y los visitantes suelen pasar largas horas bañándose en su luz rejuvenecedora.#!"
 building_white_nights_01: "Caern de las Noches Blancas"
 building_white_nights_01_desc: "$building_type_white_nights_01_desc$"
  
 building_type_bygone_visions_01: "Caern de las Visiones del Pasado"
 building_type_bygone_visions_01_desc: "#F El caern más poderoso (y bien defendido) de las Furias Negras es uno de los pocos lugares donde el Salvaje corre libre.\nAbrir nuevos valles de este tipo siempre ha sido un sueño de las guerreras de la isla, con la esperanza de devolver el mundo a su estado primigenio.#!"
 building_bygone_visions_01: "Caern de las Visiones del Pasado"
 building_bygone_visions_01_desc: "$building_type_bygone_visions_01_desc$"
 
 building_type_unshriven_zealot_01: "Caern del Fanático Impío"
 building_type_unshriven_zealot_01_desc: "#F Lo que hoy se conoce como la Abadía de Fearn fue el primer caern conquistado por los Danzantes de la Espiral Negra poco después de su regreso del Abrazo del Wyrm. Ha seguido siendo un lugar que las personas con juicio evitan a toda costa, mientras que los hombres lobo corruptos lo utilizan como su colmena más poderosa en Escocia.\nNinguna cantidad de purificación, exorcismo u otros rituales puede salvar esta tierra temida.#!"
 building_unshriven_zealot_01: "Caern del Fanático Impío"
