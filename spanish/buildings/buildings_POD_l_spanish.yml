# building_knights_patrol_03: "Powerful Knights of Acre Cell"
# building_knights_patrol_03_desc: "Ready to strike at a moment notice, the Knights' presence in this province is without weakness."
 
 building_type_the_nest_01: "El Nido"
 building_type_the_nest_01_desc: "#F La paranoia de Rodrigue ha construido este laberinto de túneles bajo Pamplona, con la esperanza de usarlo como un arma sorpresa contra los malditos chupasangre.#!"
 building_the_nest_01: "Pequeño Nido"
 building_the_nest_01_desc: "Bien construido, pero todavía pequeño, el Nido sirve principalmente como un medio seguro para compartir información para los Caballeros de Santiago."
 building_the_nest_02: "Gran Nido"
 building_the_nest_02_desc: "Abarcando la mayor parte de Pamplona, la red de túneles y espías de Rodrigue es ahora un activo formidable para la Inquisición ibérica."
 building_the_nest_03: "Nido Formidable"
 building_the_nest_03_desc: "Cualquier enemigo de Santiago que entre en Pamplona tiene muy pocas probabilidades de salir con vida. La red de Rodrigue está ahora preparada para hacer frente a cualquier cosa."
 
 building_type_st_cecila_01: "Convento de Santa Cecilia"
 building_type_st_cecila_01_desc: "#F El cuartel de entrenamiento de las Hermanas de San Juan es un lugar de silencio y contemplación en un océano de visiones enloquecedoras.#!"
 building_st_cecila_01: "Hospital de Santa Cecilia"
 building_st_cecila_01_desc: "Todo Inquisidor herido en las Islas Británicas conoce y agradece los cuidados de las sabias Hermanas presentes aquí."
 building_st_cecila_02: "Exorcistas de Santa Cecilia"
 building_st_cecila_02_desc: "Los exorcistas más hábiles de la Inquisición se forman en Santa Cecilia. Ningún espíritu de otro mundo puede resistirse a su llamado, sea de paz o de guerra."
 building_st_cecila_03: "Inquisidores de Santa Cecilia"
 building_st_cecila_03_desc: "Las Hermanas son mujeres de paz, pero saben que el Enemigo no lo es. Las pocas que eligen dedicar su vida a la guerra poseen una mente y una piedad formidables."
 
 building_type_everard_players_01: "Los Cómicos de Everard"
 building_type_everard_players_01_desc: "#F La famosa compañía de artistas de Everard d'Arras es en realidad uno de los activos más importantes de los Oculi Dei, los espías de la Inquisición.#!"
 building_everard_players_01: "Le Courtois d'Arras"
 building_everard_players_01_desc: "Una de las obras de Jean Bodel es una variación del relato bíblico del Hijo Pródigo."
 building_everard_players_02: "Obra de San Nicolás"
 building_everard_players_02_desc: "Donde un piadoso Santo recibe la custodia del oro de reyes Paganos."
 building_everard_players_03: "Los Fieles de Gerner"
 building_everard_players_03_desc: "La compañía está en realidad protegida en secreto por los caballeros de la Espada de Santiago. Un favor tan poderoso a menudo ha ayudado a los actores a escapar de sus críticos más fervientes."
 
 building_type_ipeasants_01: "Controlar las Tierras de Labranza"
 building_type_ipeasants_01_desc: "#F Las gentes honradas y temerosas de Dios que trabajan en los campos son la columna vertebral de este Señorío y de nuestra Contienda.#!"
 building_ipeasants_01: "Predicar a los Campesinos"
 building_ipeasants_01_desc: "Los siervos se dejan impresionar con facilidad por quienes son de clases superiores. Enviar a nuestros agentes entre ellos sin duda nos ganará su apoyo."
 building_ipeasants_02: "Radicalizar a los Campesinos"
 building_ipeasants_02_desc: "Las gentes del campo son temerosas, pero fortalecidas por nuestro celo, pueden convertirse en aliados leales de nuestra causa.\n$POD_requirements_development_5_splendor_1$"
 building_ipeasants_03: "Formar Milicias Campesinas"
 building_ipeasants_03_desc: "Debidamente agitadas contra las fuerzas de la oscuridad, las gentes de las tierras de labranza pueden convertirse en una fuerza organizada sujeta a nuestra autoridad.\n$POD_requirements_development_10_splendor_3$"
 building_ipeasants_04: "Verano. Cosecha. Guerra."
 building_ipeasants_04_desc: "Los corazones del campesinado arden con justa furia. Son el rebaño airado de Dios, y nosotros somos sus pastores.\n$POD_requirements_development_15_splendor_6$"
 
 building_type_ieducation_01: "Controlar la Educación Religiosa"
 building_type_ieducation_01_desc: "#F Ayudando en el esfuerzo por enseñar a los lugareños la palabra de Dios, podemos ayudarlos a ser más piadosos, letrados y receptivos a nuestros esfuerzos.#!"
 building_ieducation_01: "Financiar Escuelas Dominicales"
 building_ieducation_01_desc: "Los hijos de la gente común deben ser conscientes de la importancia de nuestra Misión, si no de su naturaleza exacta."
 building_ieducation_02: "Financiar el Seminario"
 building_ieducation_02_desc: "Bajo nuestra sutil guía, las futuras generaciones de sacerdotes educados aquí estarán maduras para el reclutamiento a nuestra causa.\n$POD_requirements_development_5_splendor_1$"
 building_ieducation_03: "Financiar la Universidad Teológica"
 building_ieducation_03_desc: "Aquí es donde los eruditos de la Iglesia forjan su futuro. Nuestra influencia asegurará nuestro papel clave en ello.\n$POD_requirements_development_10_splendor_3$"
 building_ieducation_04: "Teología Convertida en Arma"
 building_ieducation_04_desc: "Gracias al control total sobre todo lo relacionado con la enseñanza religiosa, las mismísimas definiciones del bien y del mal se adaptan a nuestras necesidades.\n$POD_requirements_development_15_splendor_6$" 
 
 building_type_ioutskirts_01: "Controlar las Afueras"
 building_type_ioutskirts_01_desc: "#F Una vez domesticada, la naturaleza salvaje local puede ocultar nuestros movimientos, no los de nuestros enemigos.#!"
 building_ioutskirts_01: "Acceder a los Bosques del Gobernante"
 building_ioutskirts_01_desc: "Los cazaderos son propiedad exclusiva de la familia gobernante. Solicitar acceso nos permitirá patrullarlos y encontrarnos con los intrusos."
 building_ioutskirts_02: "Conseguir Perdones para los Cazadores Furtivos"
 building_ioutskirts_02_desc: "Los bosques albergan a cazadores furtivos, proscritos no por elección sino por necesidad. Su pericia con el terreno hace que valga la pena ganarse su Lealtad.\n$POD_requirements_development_5_splendor_1$"
 building_ioutskirts_03: "Asegurar Derechos de Caza"
 building_ioutskirts_03_desc: "Con sobornos, amenazas y apelaciones a autoridades superiores, podemos arrebatarle al gobernante local el control oficial de los bosques.\n$POD_requirements_development_10_splendor_3$"
 building_ioutskirts_04: "Bosques del Señor"
 building_ioutskirts_04_desc: "No hay un solo cazador, herbolario, recolector de bayas o ermitaño que viva en la naturaleza salvaje local que no sea también uno de nuestros agentes.\n$POD_requirements_development_15_splendor_6$"
 
 building_type_itownsfolk_01: "Controlar a la Gente del Pueblo"
 building_type_itownsfolk_01_desc: "#F Aquí se congrega la gente y cambia de manos el dinero. Nuestra causa necesita ambas cosas.#!"
 building_itownsfolk_01: "Predicadores Callejeros"
 building_itownsfolk_01_desc: "Donde la gente al menos finge ser decente, predicar contra el pecado y el libertinaje seguramente caerá en oídos más o menos comprensivos."
 building_itownsfolk_02: "Indulgencias para Mercaderes"
 building_itownsfolk_02_desc: "El perdón de la Iglesia no sale barato. Tenemos los medios para abaratarlo, y los mercaderes aprecian un buen trato.\n$POD_requirements_development_5_splendor_1$"
 building_itownsfolk_03: "Reclutar el Liderazgo de los Gremios"
 building_itownsfolk_03_desc: "Si no es apelando a la fe, entonces con promesas de contactos, se puede convertir a los líderes de los artesanos en valiosos agentes.\n$POD_requirements_development_10_splendor_3$"
 building_itownsfolk_04: "Empresa Sagrada"
 building_itownsfolk_04_desc: "Los mercaderes y artesanos de este pueblo se han vuelto mucho más piadosos desde el día en que llegamos. Casi parece que aquí ya no hay lugar para que hagan negocios los no tan devotos.\n$POD_requirements_development_15_splendor_6$"
 
 building_type_iunderworld_01: "Controlar el Inframundo"
 building_type_iunderworld_01_desc: "#F El reino de las sombras es donde habitan nuestros enemigos. Cooperar con sus habitantes mortales es indecoroso, pero necesario.#!"
 building_iunderworld_01: "Ayudar a los Mendigos y Golfillos"
 building_iunderworld_01_desc: "La gente decente aparta la mirada de los desdichados. Eso es parte de lo que los convierte en activos inestimables."
 building_iunderworld_02: "Convertir a Delincuentes Comunes"
 building_iunderworld_02_desc: "La sociedad les ha cerrado sus puertas a estos matones, ladrones y estafadores, pero aún les encontramos utilidad.\n$POD_requirements_development_5_splendor_1$"
 building_iunderworld_03: "Infiltrarse en el Crimen Organizado"
 building_iunderworld_03_desc: "Los tratos con la cúpula de la sociedad criminal seguramente nos comprometan, pero sus frutos bien podrían merecer la pena.\n$POD_requirements_development_10_splendor_3$"
 building_iunderworld_04: "Vicio Sancionado"
 building_iunderworld_04_desc: "Los hombres son pecadores, y no es nuestra prioridad dejar sin trabajo a quienes se ganan la vida gracias a ello. Mientras contribuyan a la causa.\n$POD_requirements_development_15_splendor_6$" 

 building_type_igarrison_01: "Controlar la Guarnición"
 building_type_igarrison_01_desc: "Los hombres armados de este asentamiento vigilan a los enemigos de su señor. Podemos desviar su atención hacia otros más siniestros.#!"
 building_igarrison_01: "Ayudar a la Guardia Nocturna"
 building_igarrison_01_desc: "El trabajo de un vigilante nunca termina. La ayuda de nuestros agentes será muy apreciada."
 building_igarrison_02: "Reclutar Oficiales de la Guarnición"
 building_igarrison_02_desc: "Los buenos soldados no hacen preguntas cuando reciben órdenes de sus oficiales. Eso hace que estos últimos sean esenciales para nuestra causa.\n$POD_requirements_development_5_splendor_1$"
 building_igarrison_03: "Control Encubierto de la Guarnición"
 building_igarrison_03_desc: "Por cualquier medio disponible, aseguraremos la obediencia de los comandantes de más alto rango de esta guarnición.\n$POD_requirements_development_10_splendor_3$"
 building_igarrison_04: "Bastión de los Fieles"
 building_igarrison_04_desc: "Soldados de todos los rangos apostados en esta ciudad se inclinan ante nuestros representantes, llenos de orgullo por su sagrada tarea de protegerlos.\n$POD_requirements_development_15_splendor_6$"

 building_type_inquisition_church_01: "Iglesia de la Inquisición"
 building_type_inquisition_church_01_desc: "#F Los fieles necesitan un lugar de reunión libre de la influencia de las sanguijuelas. Nuestros hermanos y hermanas necesitan un lugar para la contemplación.#!"
 building_inquisition_church_01: "Capilla de la Inquisición"
 building_inquisition_church_01_desc: "Un lugar pequeño y tranquilo, protegido por los Caballeros de Dios. Un oasis en el desierto."
 building_inquisition_church_02: "Iglesia de la Inquisición"
 building_inquisition_church_02_desc: "Aquí, la influencia corruptora de los vampiros se mantiene a raya.\n$POD_requirements_development_10$"
 building_inquisition_church_03: "Catedral de la Inquisición"
 building_inquisition_church_03_desc: "Un faro de luz en un mundo de tinieblas. El primero de muchos, con suerte.\n$POD_requirements_development_15_splendor_3$"
 building_inquisition_church_04: "Arcocatedral de la Inquisición"
 building_inquisition_church_04_desc: "Un monumento a nuestra devoción, que se alza sobre la tierra como un desafío a las fuerzas del mal.\n$POD_requirements_development_20_splendor_6$"

 building_type_inquisition_office_01: "Oficina de la Inquisición"
 building_type_inquisition_office_01_desc: "#F Un lugar donde llevar nuestra administración lejos de miradas indiscretas.#!"
 building_inquisition_office_01: "Sótano de la Oficina"
 building_inquisition_office_01_desc: "Un espacio bien oculto para almacenar y procesar nuestros documentos."
 building_inquisition_office_02: "Oficina Remota"
 building_inquisition_office_02_desc: "Una modesta casa urbana donde podemos coordinar nuestros esfuerzos sin llamar demasiado la atención.\n$POD_requirements_development_10$"
 building_inquisition_office_03: "Edificio de Oficinas"
 building_inquisition_office_03_desc: "Un impresionante edificio de oficinas en el distrito más concurrido del pueblo, donde sus habitantes más ricos e influyentes vienen a hacer negocios.\n$POD_requirements_development_15_splendor_3$"
 building_inquisition_office_04: "Barrio de Oficinas"
 building_inquisition_office_04_desc: "Una sección de la ciudad exclusiva para nuestros hermanos y hermanas. No deja lugar a dudas sobre nuestro control de los asuntos locales y regionales.\n$POD_requirements_development_20_splendor_6$"

 building_type_inquisition_palace_01: "Palacio de la Inquisición"
 building_type_inquisition_palace_01_desc: "#F Un lugar donde nuestros caballeros se reúnen, se entrenan y celebran banquetes.#!"
 building_inquisition_palace_01: "Pabellón de Caza"
 building_inquisition_palace_01_desc: "Una finca remota adecuada para el pasatiempo terrenal favorito de todo caballero."
 building_inquisition_palace_02: "Mansión Inquisitorial"
 building_inquisition_palace_02_desc: "Una elegante residencia donde la hospitalidad cumple con los más altos estándares.\n$POD_requirements_development_10$"
 building_inquisition_palace_03: "Palacio de la Inquisición"
 building_inquisition_palace_03_desc: "Un espléndido palacio, testimonio de la nobleza de nuestra causa. Pocos nobles de esta tierra se atreverían siquiera a considerar rechazar una invitación.\n$POD_requirements_development_15_splendor_3$"
 building_inquisition_palace_04: "Gran Palacio de la Inquisición"
 building_inquisition_palace_04_desc: "Nuestra venerable casa, opulenta e imperial. Apta para recibir a reyes, emperadores y al propio Santo Padre.\n$POD_requirements_development_20_splendor_6$"
 
 building_type_inquisition_armory_01: "Armería de la Inquisición"
 building_type_inquisition_armory_01_desc: "#F Mantener una presencia militar propia significativa en esta región requiere una infraestructura adecuada.#!"
 building_inquisition_armory_01: "Alijos de Armas"
 building_inquisition_armory_01_desc: "Pocos de nuestros agentes van desarmados en algún momento, pero algunas tareas requieren equipo más pesado. Entonces, estos alijos resultan útiles."
 building_inquisition_armory_02: "Armería de la Inquisición"
 building_inquisition_armory_02_desc: "Estos salones llenos de armas y armaduras aseguran nuestra preparación, en caso de que la oscuridad asome la cabeza.\n$POD_requirements_development_10$"
 building_inquisition_armory_03: "Taller de Armas Inquisitorial"
 building_inquisition_armory_03_desc: "Producir nuestro propio equipo es la mejor forma de asegurar que cumpla con los requisitos inusuales que exige nuestra Misión.\n$POD_requirements_development_15_splendor_3$"
 building_inquisition_armory_04: "Academia Militar Inquisitorial"
 building_inquisition_armory_04_desc: "En este extenso complejo de instalaciones militares, nuestros caballeros son capaces de forjar a la gente común en armas formidables contra el mal.\n$POD_requirements_development_20_splendor_6$"
 
 building_type_inquisition_keep_01: "Castillo de la Inquisición"
 building_type_inquisition_keep_01_desc: "#F Un lugar donde mantener a salvo todo tipo de cosas, ya sea a nosotros mismos, a nuestros prisioneros o a nuestros secretos.#!"
 building_inquisition_keep_01: "Torre de la Inquisición"
 building_inquisition_keep_01_desc: "La primera manifestación física de la protección que otorgamos a estas tierras."
 building_inquisition_keep_02: "Fortaleza Menor de la Inquisición"
 building_inquisition_keep_02_desc: "Solo nuestros agentes entran en esta fortificación sin ser vistos; solo gritos salen de ella de la misma forma.\n$POD_requirements_development_10$"
 building_inquisition_keep_03: "Castillo de la Inquisición"
 building_inquisition_keep_03_desc: "Un formidable bastión contra nuestros viles enemigos. Nuestras Conjuras y maquinaciones brotan de aquí como sangre de una arteria.\n$POD_requirements_development_15_splendor_3$"
 building_inquisition_keep_04: "Fortaleza de la Inquisición"
 building_inquisition_keep_04_desc: "Una montaña de piedra y acero afilado tan inexpugnable como nuestra fe. Ninguna criatura sensible de la noche está lo bastante loca como para atacarla directamente.\n$POD_requirements_development_20_splendor_6$"

 building_type_heretic_hall_01: "Salón del Pueblo"
 building_type_heretic_hall_01_desc: "#F Todos los hijos fieles de Dios son bienvenidos en nuestra morada para nutrir sus cuerpos y sus Espíritus.#!"
 building_heretic_hall_01: "Lugar de Reunión del Pueblo"
 building_heretic_hall_01_desc: "Dios es omnipresente, y lo único necesario para reunirse en su templo es designar un lugar. Aunque unas sillas no vendrían mal."
 building_heretic_hall_02: "Casa del Pueblo"
 building_heretic_hall_02_desc: "Los fieles tienen suficiente hambre de sustento espiritual y nuestros sermones son lo bastante inspiradores para ayudarlos a resistir bajo la lluvia, pero tener un techo no hace daño.\n$POD_requirements_development_5$"
 building_heretic_hall_03: "Salón del Pueblo"
 building_heretic_hall_03_desc: "Un edificio lo bastante amplio para celebrar misas, comidas comunales, reuniones y juicios de los enemigos de nuestra sagrada causa.\n$POD_requirements_development_10$"
 building_heretic_hall_04: "Palacio del Pueblo"
 building_heretic_hall_04_desc: "Un testimonio de la unidad de nuestro rebaño. Un hogar para cada alma fiel, hecho espléndido con trabajo compartido.\n$POD_requirements_development_15$"
 
 building_type_inquisition_contact_01: "Contactar con Órdenes Hermanas"
 building_type_inquisition_contact_01_desc: "#F Aunque somos pocos y nuestra Misión debe permanecer en secreto, no estamos solos en nuestra Contienda.#!"
 building_inquisition_contact_01: "Buzón Muerto"
 building_inquisition_contact_01_desc: "Un lugar designado para intercambiar mensajes cifrados y compartir conocimientos con nuestros hermanos y hermanas con el máximo secreto."
 building_inquisition_contact_02: "Lugar de Encuentro"
 building_inquisition_contact_02_desc: "Un lugar lo bastante discreto para que los agentes de nuestra orden se reúnan cara a cara con sus homólogos.\n$POD_requirements_development_10_splendor_1$"
 building_inquisition_contact_03: "Conferencia Semanal"
 building_inquisition_contact_03_desc: "Una reunión regular de expertos en el campo de la lucha contra las fuerzas del infierno tiene lugar en la privacidad de nuestras posesiones.\n$POD_requirements_development_15_splendor_3$"
 
 building_type_inquisition_acre_01: "Terreno de Entrenamiento de los Caballeros de Acre"
 building_type_inquisition_acre_01_desc: "#F Aquí nuestros hermanos perfeccionan su sagrado arte de vencer a los siervos del diablo.#!"
 building_inquisition_acre_01: "Terreno de Prácticas"
 building_inquisition_acre_01_desc: "Un prado apartado con suficiente espacio para el entrenamiento de combate."
 building_inquisition_acre_02: "Campamento de Entrenamiento"
 building_inquisition_acre_02_desc: "Un campamento de entrenamiento en el bosque con suficiente infraestructura y experiencia para beneficiar incluso a los guerreros más veteranos.\n$POD_requirements_development_5$"
 building_inquisition_acre_03: "Torneo de Justas"
 building_inquisition_acre_03_desc: "Un torneo de justas bajo nuestro patrocinio atrae a los mejores caballeros de la tierra. El terreno ofrece unas valiosas instalaciones de entrenamiento fuera de temporada.\n$POD_requirements_development_10$"
 
 building_type_inquisition_james_01: "Hospicio de los Caballeros de Santiago"
 building_type_inquisition_james_01_desc: "#F Ofrecer seguridad y hospitalidad a los peregrinos fue nuestro propósito principal y sigue siendo nuestra especialidad.#!"
 building_inquisition_james_01: "Casa de Huéspedes para Peregrinos"
 building_inquisition_james_01_desc: "Un establecimiento modesto, pero aun así una vista bienvenida para un peregrino cansado. O para un soldado de Dios cansado en tiempos más difíciles."
 building_inquisition_james_02: "Posada de Peregrinos"
 building_inquisition_james_02_desc: "Un lugar animado, espacioso y acogedor con suficiente infraestructura para atender las necesidades de los viajeros, sea cual sea su propósito.\n$POD_requirements_development_5$"
 building_inquisition_james_03: "Hospicio de Peregrinos"
 building_inquisition_james_03_desc: "Un bullicioso complejo de edificios que sirve como versátil nexo logístico para quienes se guían por la fe.\n$POD_requirements_development_10$"
 
 building_type_inquisition_john_01: "Caridad de las Hermanas de San Juan"
 building_type_inquisition_john_01_desc: "#F Servimos a los pobres, los enfermos y los que sufren sin esperar recompensas terrenales, aunque los frutos de nuestro esfuerzo nos recompensan de todos modos.#!"
 building_inquisition_john_01: "Comedor Social"
 building_inquisition_john_01_desc: "Una iniciativa humilde, pero muy apreciada, para proporcionar comida a los necesitados."
 building_inquisition_john_02: "Hospital Móvil"
 building_inquisition_john_02_desc: "Una caravana de carros y carretas con todo lo necesario para brindar atención en lugares remotos.\n$POD_requirements_development_5$"
 building_inquisition_john_03: "Asilo"
 building_inquisition_john_03_desc: "Un lugar seguro y generoso para los desafortunados del Señorío. Un pequeño destello de la Gracia celestial de Dios aquí en la tierra.\n$POD_requirements_development_10$"
 
 building_type_inquisition_red_01: "Biblioteca de la Orden Roja"
 building_type_inquisition_red_01_desc: "#F Un lugar donde las palabras de Dios, las palabras de los hombres y las palabras en las lenguas más impías se ponen al servicio de nuestra sagrada causa.#!"
 building_inquisition_red_01: "Biblioteca de las Catacumbas"
 building_inquisition_red_01_desc: "Una cripta subterránea que alberga no solo los restos mortales de los frailes, sino también nuestros tomos más preciados."
 building_inquisition_red_02: "Biblioteca Monástica"
 building_inquisition_red_02_desc: "Una sección de un monasterio local dedicada a nuestra investigación más delicada. Inaccesible para los no iniciados.\n$POD_requirements_development_5$"
 building_inquisition_red_03: "Biblioteca Prohibida"
 building_inquisition_red_03_desc: "Una manzana entera de la ciudad repleta de manuscritos y grimorios demasiado peligrosos para permanecer fuera de nuestra custodia exclusiva.\n$POD_requirements_development_10$"
 
 building_type_inquisition_murnau_01: "Mansión de la Casa von Murnau"
 building_type_inquisition_murnau_01_desc: "#F Aquellos von Murnau que se dedican a su sagrada causa se preocupan poco por las comodidades terrenales, aunque cultivar su aparente nobleza desempeña un papel crucial en la Contienda.#!"
 building_inquisition_murnau_01: "Casa Urbana von Murnau"
 building_inquisition_murnau_01_desc: "Una residencia urbana poco propia del nombre von Murnau, pero aun así un útil puesto avanzado de nuestra influencia."
 building_inquisition_murnau_02: "Mansión von Murnau"
 building_inquisition_murnau_02_desc: "Una lujosa morada para los miembros de la familia, igualmente apta para recibir a hombres locales de importancia.\n$POD_requirements_development_5$"
 building_inquisition_murnau_03: "Palacio Urbano von Murnau"
 building_inquisition_murnau_03_desc: "Una majestuosa maravilla arquitectónica que ejemplifica el esplendor de la dinastía.\n$POD_requirements_development_10$"
 
 building_type_inquisition_oculi_01: "Célula de los Oculi Dei"
 building_type_inquisition_oculi_01_desc: "#F Los Ojos hablan, pero rara vez se les oye. Llevar nuestros asuntos en el aislamiento lo garantiza.#!"
 building_inquisition_oculi_01: "Casa Segura"
 building_inquisition_oculi_01_desc: "Una cámara entre una hilera de cámaras idénticas, aparentemente sin nada especial."
 building_inquisition_oculi_02: "Complejo de Sótanos"
 building_inquisition_oculi_02_desc: "Un amplio núcleo subterráneo de sótanos conectados, cada entrada bajo nuestro control seguro.\n$POD_requirements_development_5$"
 building_inquisition_oculi_03: "Red de Túneles"
 building_inquisition_oculi_03_desc: "Una intrincada red de sótanos, mazmorras, alcantarillas y cuevas interconectados. Permite cruzar grandes distancias sin ser visto.\n$POD_requirements_development_10$"

 building_type_inquisition_knightly_01: "Priorato de Caballería"
 building_type_inquisition_knightly_01_desc: "#F La propiedad territorial de una orden militar. Aquí viven y se entrenan los guerreros que han hecho sus votos.#!"
 building_inquisition_knightly_01: "Encomienda de Caballería"
 building_inquisition_knightly_01_desc: "La Encomienda es la división más pequeña de tierra que posee una orden de caballería. La mantienen caballeros bajo el mando de un único comendador."
 building_inquisition_knightly_02: "Bailiazgo de Caballería"
 building_inquisition_knightly_02_desc: "Un bailiazgo representa la esfera de autoridad de una orden militar. Las instalaciones que contiene constituyen la columna vertebral infraestructural de su sociedad religiosa.\n$POD_requirements_development_5$"
 building_inquisition_knightly_03: "Priorato de Caballería"
 building_inquisition_knightly_03_desc: "El priorato de una orden militar es un formidable centro de poder. Desde aquí, los miembros de alto rango de la orden administran sus numerosas propiedades y planean campañas militares.\n$POD_requirements_development_10$"

 building_type_inquisition_lay_01: "Casa Comunitaria"
 building_type_inquisition_lay_01_desc: "#F La fuerza de tu familia y de la congregación de fieles bajo su patrocinio proviene de su piedad, no de posesiones materiales. Aun así, incluso el empeño más sagrado se lleva a cabo con más fluidez teniendo un techo sobre la cabeza.#!"
 building_inquisition_lay_01: "Casa de Reunión"
 building_inquisition_lay_01_desc: "Apenas más digna que invitar a la comunidad de fieles directamente a tu alcoba. No obstante, esta pequeña y humilde sala alberga ideas grandes y nobles."
 building_inquisition_lay_02: "Casa Comunitaria"
 building_inquisition_lay_02_desc: "Igual que una iglesia nutre el alma, este salón dedicado sirve para nutrir la voluntad colectiva de quienes buscan librar al mundo del mal.\n$POD_requirements_development_5$"
 building_inquisition_lay_03: "Propiedad Comunitaria"
 building_inquisition_lay_03_desc: "Gracias al generoso patrocinio de tu familia, esta propiedad tiene todo el espacio, las comodidades y la seguridad necesarios para ser un bastión y una embajada de la rectitud.\n$POD_requirements_development_10$"
 
 building_type_inquisition_contemplative_01: "Monasterio Contemplativo"
 building_type_inquisition_contemplative_01_desc: "#F Estos solemnes salones se construyeron para mantener alejado el ruido de los asuntos mundanos que ahoga la voz de Dios.#!"
 building_inquisition_contemplative_01: "Granja de la Orden Contemplativa"
 building_inquisition_contemplative_01_desc: "Las espartanas condiciones de vida de este monasterio son una característica deseable, pero cierta expansión en términos de espacio e instalaciones disponibles podría ayudar a los cenobitas a concentrarse en sus oraciones."
 building_inquisition_contemplative_02: "Priorato Contemplativo"
 building_inquisition_contemplative_02_desc: "Cada aspecto material de este recinto recuerda a sus habitantes el tipo de vida que se espera de ellos. Aquí, las necesidades de la carne no son más que una lamentable distracción de la contemplación del Creador.\n$POD_requirements_development_5$"
 building_inquisition_contemplative_03: "Abadía Contemplativa"
 building_inquisition_contemplative_03_desc: "El mero hecho de poner un pie en este austero palacio dedicado a la sabiduría de Dios puede hacer que un incrédulo empedernido redescubra la fe, pues Su voz retumba en el silencio omnipresente.\n$POD_requirements_development_10$"
 
 building_type_inquisition_mendicant_01: "Monasterio Mendicante"
 building_type_inquisition_mendicant_01_desc: "#F Sufrir es andar el Camino de Cristo, pero aliviar el sufrimiento de otros es igualmente cristiano. Estas instalaciones lo permiten.#!"
 building_inquisition_mendicant_01: "Granja de la Orden Mendicante"
 building_inquisition_mendicant_01_desc: "Lejos de reflejar la infinita compasión de tus hermanos y hermanas, esta modesta instalación les permite, no obstante, recuperarse tras un largo día atendiendo al rebaño."
 building_inquisition_mendicant_02: "Convento Mendicante"
 building_inquisition_mendicant_02_desc: "Aunque el propósito principal de este edificio es ser un lugar de oración, también sirve como centro logístico para una considerable iniciativa caritativa.\n$POD_requirements_development_5$"
 building_inquisition_mendicant_03: "Abadía Mendicante"
 building_inquisition_mendicant_03_desc: "Una fortaleza de compasión en la frontera de la indiferencia. El rebaño de la tierra mira hacia esta imponente estructura para recordarse a sí mismo que hay bondad en el mundo.\n$POD_requirements_development_10$" 
 
 building_type_inquisition_cell_01: "Célula de la Inquisición"
 building_type_inquisition_cell_01_desc: "#F Aquí se reúnen los vencedores del mal inhumano del Señorío para coordinar operaciones, instruirse mutuamente, depositar donaciones y vigilar la tierra.#!"
 building_inquisition_cell_01: "Célula Naciente de la Inquisición"
 building_inquisition_cell_01_desc: "No esperes más que puertas fortificadas, un cofre con recursos necesarios y las comodidades más básicas de una célula de Cazadores recién establecida. Aun así, sigue siendo una semilla de la que brotará la esperanza."
 building_inquisition_cell_02: "Célula Establecida de la Inquisición"
 building_inquisition_cell_02_desc: "Un refugio seguro y una base de operaciones funcional para quienes combaten la oscuridad. Un lugar para descansar, sanar y perfeccionar el propio arte.\n$POD_requirements_development_5$"
 building_inquisition_cell_03: "Núcleo de la Inquisición"
 building_inquisition_cell_03_desc: "Más que un simple puesto de vigilancia, este bullicioso salón es donde se preparan y coordinan las mayores operaciones contra los siervos del Infierno.\n$POD_requirements_development_10$"
 
 building_type_inquisition_george_01: "Pastos de Caballos de Guerra de la Sociedad de San Jorge"
 building_type_inquisition_george_01_desc: "#F Algunas órdenes clericales son conocidas por elaborar cerveza, otras por sus medicamentos herbales; los hermanos de San Jorge crían caballos dignos de su patrón.#!"
 building_inquisition_george_01: "Pastos de Caballos de Guerra"
 building_inquisition_george_01_desc: "El terreno herboso más adecuado de la zona para que pasten los mejores caballos ingleses."
 building_inquisition_george_02: "Establos de Caballos de Guerra"
 building_inquisition_george_02_desc: "Una considerable granja con suficientes instalaciones y personal para mantener a los caballos en forma y bien cuidados.\n$POD_requirements_development_5$"
 building_inquisition_george_03: "Casa de Subastas de Caballos de Guerra"
 building_inquisition_george_03_desc: "Viajeros de todas partes vienen aquí para presenciar a tus famosos corceles en todo su esplendor, y pujar por ellos.\n$POD_requirements_development_10$"
 
 # Shih
 
 building_type_hermitage_01: "Ermita"
 building_type_hermitage_01_desc: "#F Un lugar apartado para practicar el arte y la meditación.#!"
 building_hermitage_01: "Ermita Menor"
 building_hermitage_01_desc: "Un joven ermitaño vive apartado en las tierras salvajes."
 building_hermitage_02: "Ermita Mediana"
 building_hermitage_02_desc: "Un ermitaño bien conocido vive apartado en este pueblo.\n$POD_requirements_development_5$"
 building_hermitage_03: "Ermita Mayor"
 building_hermitage_03_desc: "Un respetado ermitaño vive apartado en esta corte.\n$POD_requirements_development_10$"
 
 building_type_genealogie_01: "Genealogía"
 building_type_genealogie_01_desc: "#F Algunas familias siguen siendo unidades de Cazadores [GetTrait('shih').GetName( GetNullCharacter )], pero son muy raras. La mayoría rastrea sus raíces hasta el propio Yi, aunque si sus genealogías son exactas o no es fuente de un gran debate potencial.#!" 
 building_genealogie_01: "Genealogía Menor"
 building_genealogie_01_desc: "Nadie cree que tu familia descienda de Yi."
 building_genealogie_02: "Genealogía Mediana"
 building_genealogie_02_desc: "Algunos creen que tu familia desciende de Yi."
 building_genealogie_03: "Genealogía Mayor"
 building_genealogie_03_desc: "La mayoría cree que tu familia desciende de Yi."
 building_genealogie_04: "Genealogía Superior"
 building_genealogie_04_desc: "Todos creen que tu familia desciende de Yi."

 building_type_kunlun_school_01: "Escuela de Kun Lun"
 building_type_kunlun_school_01_desc: "#F La mayor escuela del Ejército Celestial, construida en las Montañas Kun Lun. El edificio era una majestuosa fortaleza con muros dorados y opulentos adornos.#!"
 building_kunlun_school_01: "Escuela de Kun Lun en Ruinas"
 building_kunlun_school_01_desc: "Antaño la mayor escuela de los [GetTrait('shih').GetName( GetNullCharacter )], destruida durante un vengativo terremoto."
 building_kunlun_school_02: "Escuela Restaurada de Kun Lun"
 building_kunlun_school_02_desc: "Las Tradiciones [GetTrait('shih').GetName( GetNullCharacter )] ahora se enseñan aquí, mientras los [GetTrait('shih').GetName( GetNullCharacter )] regresan por fin a su cuartel general."
 building_kunlun_school_03: "Escuela Triunfante de Kun Lun"
 building_kunlun_school_03_desc: "La orgullosa escuela de los [GetTrait('shih').GetName( GetNullCharacter )] ha regresado, y esta vez ningún Shen los detendrá."
 
 # Forsaken
 building_type_gpeasants_01: "Sublevar a los Campesinos"
 building_type_gpeasants_01_desc: "Durante demasiado tiempo, quienes ponen comida en las mesas de la nobleza han sido explotados y maltratados. Es hora de empoderar a sus vastas masas."
 building_gpeasants_01: "Sublevar a los Desafortunados"
 building_gpeasants_01_desc: "Al no ser dueños de la tierra que trabajan, esos campesinos que tuvieron una cosecha particularmente mala no tienen nada más que perder. Dales esperanza y nos seguirán."
 building_gpeasants_02: "Sublevar a los Agobiados"
 building_gpeasants_02_desc: "Tras entregar la mayor parte de la cosecha a su señor, pocos campesinos pueden asegurar más que una existencia miserable con la tierra que trabajan. Es hora de convencerlos de que Dios no pretendía que vivieran así.\n$POD_requirements_development_5$"
 building_gpeasants_03: "Sublevar a los Fieles"
 building_gpeasants_03_desc: "Todo campesino entiende instintivamente que quienes trabajan más duro deberían ser los primeros en disfrutar de los frutos de ese trabajo. La fe puede darles el valor para hacer que el mundo funcione así.\n$POD_requirements_development_10$"

 building_type_gcraftsmen_01: "Sublevar a los Artesanos"
 building_type_gcraftsmen_01_desc: "Aunque disfrutan de un estatus más alto que sus homólogos rurales, la gente trabajadora de los pueblos sigue sufriendo explotación, facilitada por una fe corrupta. Es hora de presentarles una alternativa." 
 building_gcraftsmen_01: "Sublevar a los Aprendices"
 building_gcraftsmen_01_desc: "Los aprendices soportan penurias mucho más severas de lo que su formación debería exigir. Podemos canalizar su frustración y convertirla en justa ira."
 building_gcraftsmen_02: "Sublevar a los Oficiales"
 building_gcraftsmen_02_desc: "Los oficiales pasan la parte más productiva de sus vidas trabajando duro para enriquecer a sus maestros. No es voluntad de Dios que sea así, y los artesanos estarán ansiosos por oírlo.\n$POD_requirements_development_5$"
 building_gcraftsmen_03: "Sublevar a los Maestros"
 building_gcraftsmen_03_desc: "Los maestros artesanos ocupan la cima de la jerarquía del gremio, pero incluso ellos están sujetos a los caprichos de sus señores nobles. La nobleza de un hombre reside en su utilidad para sus semejantes, y hasta los maestros pueden simpatizar con este mensaje.\n$POD_requirements_development_10$"

 building_type_gfootmen_01: "Sublevar a los Infantes"
 building_type_gfootmen_01_desc: "¿Qué es un soldado al que no se le paga lo que se le debe? Un rebelde esperando una causa. Nosotros tenemos justo esa causa."
 building_gfootmen_01: "Sublevar a los No Pagados"
 building_gfootmen_01_desc: "¿Qué es un soldado al que no se le paga lo que se le debe? Un rebelde esperando una causa. Nosotros tenemos justo esa causa."
 building_gfootmen_02: "Sublevar a los Maltratados"
 building_gfootmen_02_desc: "¿Alguien soportaría el agotamiento, el hambre y el frío, exponiéndose a la enfermedad y a una muerte violenta para enriquecer a su señor en tierras y títulos, si la vida ofreciera un camino mejor? Podemos ofrecer a estos hombres armados un camino hacia Dios.\n$POD_requirements_development_5$"
 building_gfootmen_03: "Sublevar a los Aspirantes"
 building_gfootmen_03_desc: "¿De qué sirve la valentía, la competencia, la lealtad y la iniciativa de un soldado si los altos puestos de mando están reservados para los de sangre azul? Nuestra sagrada causa ofrece a quienes buscan más una oportunidad de demostrar su valía.\n$POD_requirements_development_10$"
 
 building_type_inquisition_forsaken_01: "Guerrilleros Desamparados"
 building_type_inquisition_forsaken_01_desc: "#F Los poderes establecidos, tanto mortales como $pod_cainite$, son hostiles a nuestra sagrada causa. Sus instrumentos deben actuar sin ser vistos.#!"
 building_inquisition_forsaken_01: "Campamento de Refugiados"
 building_inquisition_forsaken_01_desc: "El bosque, por inhóspito que sea, brinda un refugio seguro a quienes se liberan del yugo de sus amos."
 building_inquisition_forsaken_02: "Complejo Guerrillero"
 building_inquisition_forsaken_02_desc: "Una considerable instalación militar oculta en lo profundo de la naturaleza salvaje. Aquellos de nuestros hermanos que desean llevar la lucha al enemigo vienen aquí a entrenarse.\n$POD_requirements_development_5$"
 building_inquisition_forsaken_03: "Bastión Invisible"
 building_inquisition_forsaken_03_desc: "Un laberinto de estrechos senderos forestales, plataformas en las copas de los árboles, puentes y túneles salpicados de trampas y puestos de observación. Tan formidable como encubierto.\n$POD_requirements_development_10$"
  
 # Patron Content
 building_type_cecilia_palace_01: "El Palacio de Cecilia"
 building_type_cecilia_palace_01_desc: "#F Algunos dicen que fue en su día un templo dedicado a la práctica sagrada de la prostitución. En la calle, simplemente lo llaman un burdel, aunque de los caros. Mucho dinero fluye por sus puertas.#!"
 building_cecilia_palace_01: "El Palacio de Cecilia"
 building_cecilia_palace_01_desc: "Algunos dicen que fue en su día un templo dedicado a la práctica sagrada de la prostitución. En la calle, simplemente lo llaman un burdel, aunque de los caros. Mucho dinero fluye por sus puertas."
 
 # Kuei-Jin
 
 building_type_low_war_01: "Guerra Baja"
 building_type_low_war_01_desc: "#F Cada instante es un campo de batalla, ya sea político o físico. Los Diez Mil Guerreros están listos en cualquier momento.#!"
 building_low_war_01: "Guerra Baja Interminable"
 building_low_war_01_desc: "El triunfo solo llegará si superas cualquier desafío, ya sea político, social o militar.\nSiempre estás luchando, y el respiro es un recuerdo lejano. Pero tus enemigos suelen estarlo también."   
 
 POD_dragon_nest_requirements_development_20: "#help Este nivel requiere más de #bold;L [SelectLocalization( IsInGame, 'POD_dragon_nest_requirements_development_20_value', '20' )]#! de [development|E] para construirse.#!"
 POD_dragon_nest_requirements_development_20_value: "[GetPlayer.MakeScope.ScriptValue('dragon_nest_4_requirement')]"
 POD_dragon_nest_requirements_development_30: "#help Este nivel requiere más de #bold;L [SelectLocalization( IsInGame, 'POD_dragon_nest_requirements_development_30_value', '30' )]#! de [development|E] para construirse.#!"
 POD_dragon_nest_requirements_development_30_value: "[GetPlayer.MakeScope.ScriptValue('dragon_nest_5_requirement')]"
 POD_dragon_nest_requirements_development_40: "#help Este nivel requiere más de #bold;L [SelectLocalization( IsInGame, 'POD_dragon_nest_requirements_development_40_value', '40' )]#! de [development|E] para construirse.#!"
 POD_dragon_nest_requirements_development_40_value: "[GetPlayer.MakeScope.ScriptValue('dragon_nest_6_requirement')]"
 POD_dragon_nest_requirements_development_60: "#help Este nivel requiere más de #bold;L [SelectLocalization( IsInGame, 'POD_dragon_nest_requirements_development_60_value', '60' )]#! de [development|E] para construirse.#!"
 POD_dragon_nest_requirements_development_60_value: "[GetPlayer.MakeScope.ScriptValue('dragon_nest_7_requirement')]"
 building_type_dragon_nest_01: "Controlar el Nido del Dragón"
 building_type_dragon_nest_01_desc: "#F Algunos lugares son especialmente ricos en Chi y, por tanto, especialmente valiosos. Estos lugares tienden a atraer shen, así como a mortales sensibles a lo sobrenatural. Los habitantes shen de estas zonas los llaman con varios nombres: caerns, nodos, guaridas y otras cosas; los Catayanos los llaman nidos de dragón.#!"
 building_dragon_nest_01: "Controlar el Flujo del Dragón"
 building_dragon_nest_01_desc: "Una zona donde el Chi parece lo bastante fuerte como para justificar una investigación más profunda."
 building_dragon_nest_02: "Controlar la Línea del Dragón"
 building_dragon_nest_02_desc: "Las líneas de dragón son líneas de Chi fuerte que conectan dos o más nidos de dragón. Los shen con suficiente poder pueden usar las líneas de dragón para diversas hazañas, como transportarse a través de vastas distancias."
 building_dragon_nest_03: "Controlar la Fuente del Dragón"
 building_dragon_nest_03_desc: "Una fuente de Chi que, aunque aún pequeña y sin explotar adecuadamente, parece bastante potente."
 building_dragon_nest_04: "Controlar el Pozo del Dragón"
 building_dragon_nest_04_desc: "Ahora mantenida adecuadamente por sus habitantes sobrenaturales, esta fuente de Chi es fácilmente accesible cuando se necesita.\n$POD_dragon_nest_requirements_development_20$"
 building_dragon_nest_05: "Controlar el Río del Dragón"
 building_dragon_nest_05_desc: "Una vez que alcanzan un tamaño suficiente, las líneas de dragón empiezan a brillar y parecen fluir como un río. Sutiles variaciones de color indican tanto el tipo de Chi como las diversas ramificaciones que llevan a distintos destinos.\n$POD_dragon_nest_requirements_development_30$"
 building_dragon_nest_06: "Controlar los Ríos del Dragón"
 building_dragon_nest_06_desc: "Al cruzarse con otra fuente de Chi, un Nido del Dragón puede crecer significativamente en potencia y ramificarse en múltiples ríos.\n$POD_dragon_nest_requirements_development_40$"
 building_dragon_nest_07: "Controlar la Puerta del Dragón"
 building_dragon_nest_07_desc: "Una vez controlada la puerta fluvial, las líneas de dragón actúan como una fuente infinita de poder para el sobrenatural residente. Mientras la puerta permanezca a la vista de todos, algo que vecinos sobrenaturales codiciosos podrían no tolerar por mucho tiempo.\n$POD_dragon_nest_requirements_development_60$"
    
 building_type_corrupted_dragon_nest_01_general: "Este Nido del Dragón en concreto está corrompido más allá de toda salvación por magias oscuras; solo aquellos de corazón impío pueden usarlo."
 building_type_corrupted_dragon_nest_01: "Controlar el Nido del Dragón Corrompido"
 building_type_corrupted_dragon_nest_01_desc: "#F Algunos lugares son especialmente ricos en Chi y, por tanto, especialmente valiosos. Estos lugares tienden a atraer shen, así como a mortales sensibles a lo sobrenatural. Los habitantes shen de estas zonas los llaman con varios nombres: caerns, nodos, guaridas y otras cosas; los Catayanos los llaman nidos de dragón.\n\n$building_type_corrupted_dragon_nest_01_general$#!"
 building_corrupted_dragon_nest_01: "Controlar el Flujo Corrompido del Dragón"
 building_corrupted_dragon_nest_01_desc: "Una zona donde el Chi parece lo bastante fuerte como para justificar una investigación más profunda.\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_corrupted_dragon_nest_02: "Controlar la Línea Corrompida del Dragón"
 building_corrupted_dragon_nest_02_desc: "Las líneas de dragón son líneas de Chi fuerte que conectan dos o más nidos de dragón. Los shen con suficiente poder pueden usar las líneas de dragón para diversas hazañas, como transportarse a través de vastas distancias.\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_corrupted_dragon_nest_03: "Controlar la Fuente Corrompida del Dragón"
 building_corrupted_dragon_nest_03_desc: "Una fuente de Chi que, aunque aún pequeña y sin explotar adecuadamente, parece bastante potente.\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_corrupted_dragon_nest_04: "Controlar el Pozo Corrompido del Dragón"
 building_corrupted_dragon_nest_04_desc: "Ahora mantenida adecuadamente por sus habitantes sobrenaturales, esta fuente de Chi es fácilmente accesible cuando se necesita.\n$POD_dragon_nest_requirements_development_20$\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_corrupted_dragon_nest_05: "Controlar el Río Corrompido del Dragón"
 building_corrupted_dragon_nest_05_desc: "Una vez que alcanzan un tamaño suficiente, las líneas de dragón empiezan a brillar y parecen fluir como un río. Sutiles variaciones de color indican tanto el tipo de Chi como las diversas ramificaciones que llevan a distintos destinos.\n$POD_dragon_nest_requirements_development_30$\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_corrupted_dragon_nest_06: "Controlar los Ríos Corrompidos del Dragón"
 building_corrupted_dragon_nest_06_desc: "Al cruzarse con otra fuente de Chi, un Nido del Dragón puede crecer significativamente en potencia y ramificarse en múltiples ríos.\n$POD_dragon_nest_requirements_development_40$\n\n$building_type_corrupted_dragon_nest_01_general$"
 building_corrupted_dragon_nest_07: "Controlar la Puerta Corrompida del Dragón"
 building_corrupted_dragon_nest_07_desc: "Una vez controlada la puerta fluvial, las líneas de dragón actúan como una fuente infinita de poder para el sobrenatural residente. Mientras la puerta permanezca a la vista de todos, algo que vecinos sobrenaturales codiciosos podrían no tolerar por mucho tiempo.\n$POD_dragon_nest_requirements_development_60$\n\n$building_type_corrupted_dragon_nest_01_general$"
    
 building_type_scarlet_screen_family_01: "Pantalla Escarlata Familiar"
 building_type_scarlet_screen_family_01_desc: "#F La Pantalla Escarlata más importante. [Glossary('Dharma','podgloss.dharma')] como la Canción de la Sombra tienen incluso el imperativo de proteger a la familia. Además, la familia mortal de un [GetTrait('kueijin').GetName( GetNullCharacter )] suele estar entre sus seguidores más leales.#!"
 building_scarlet_screen_family_01: "Pantalla Familiar Menor"
 building_scarlet_screen_family_01_desc: "Has sentado las bases de una Pantalla Escarlata Familiar. Es un comienzo, pero necesita trabajo."
 building_scarlet_screen_family_02: "Pantalla Familiar Mediana"
 building_scarlet_screen_family_02_desc: "Ahora tienes varias familias y una Generación aproximadamente para tu Pantalla Escarlata Familiar. Es un buen progreso."
 building_scarlet_screen_family_03: "Pantalla Familiar Mayor"
 building_scarlet_screen_family_03_desc: "Ahora tienes varias familias y una Generación aproximadamente para tu Pantalla Escarlata Familiar. Es un buen progreso."
 building_scarlet_screen_family_04: "Pantalla Familiar Superior"
 building_scarlet_screen_family_04_desc: "Ahora tienes varias familias y una Generación aproximadamente para tu Pantalla Escarlata Familiar. Es un buen progreso."
 building_scarlet_screen_family_05: "Pantalla Familiar Celestial"
 building_scarlet_screen_family_05_desc: "Las familias han sido criadas durante generaciones bajo la esclavitud de un [GetTrait('kueijin').GetName( GetNullCharacter )] especialmente antiguo y no conocen nada más."

 building_type_scarlet_screen_usagigumi_01: "Pantalla Escarlata Usagigumi"
 building_type_scarlet_screen_usagigumi_01_desc: "#F Las "Liebres Triunfantes" (usagigumi), valoradas solo por su número.#!"
 building_scarlet_screen_usagigumi_01: "Pantalla Usagigumi Menor"
 building_scarlet_screen_usagigumi_01_desc: "Has empezado a reunir una pequeña fuerza para tu Usagigumi. Por ahora servirán."
 building_scarlet_screen_usagigumi_02: "Pantalla Usagigumi Mediana"
 building_scarlet_screen_usagigumi_02_desc: "Tus Usagigumi son ahora una fuerza real y respetable. A veces podrías sentirte orgulloso de ellos."
 building_scarlet_screen_usagigumi_03: "Pantalla Usagigumi Mayor"
 building_scarlet_screen_usagigumi_03_desc: "Tus Usagigumi son ahora una fuerza real y respetable. A veces podrías sentirte orgulloso de ellos."
 building_scarlet_screen_usagigumi_04: "Pantalla Usagigumi Superior"
 building_scarlet_screen_usagigumi_04_desc: "Tus Usagigumi son ahora una fuerza real y respetable. A veces podrías sentirte orgulloso de ellos."
 building_scarlet_screen_usagigumi_05: "Pantalla Usagigumi Celestial"
 building_scarlet_screen_usagigumi_05_desc: "Tus Usagigumi ahora podrían destrozar incluso los ejércitos de los [Glossary('Yama Kings','podgloss.yamaking')]."
 
 building_type_scarlet_screen_inugumi_01: "Pantalla Escarlata Inugumi"
 building_type_scarlet_screen_inugumi_01_desc: "#F Las "Bandas de Perros" (inugumi), más leales y a veces incluso con contacto con lo sobrenatural.#!"
 building_scarlet_screen_inugumi_01: "Pantalla Inugumi Menor"
 building_scarlet_screen_inugumi_01_desc: "Tus Inugumi acaban de establecerse. Cumplen con su trabajo por ahora, pero podrían mejorar."
 building_scarlet_screen_inugumi_02: "Pantalla Inugumi Mediana"
 building_scarlet_screen_inugumi_02_desc: "Tus Inugumi son ahora una agencia realmente respetable, y algunos han empezado a extender tu alcance a los dominios ocultos de los Hengeyokai y los Wu T'ian. Ya era hora."
 building_scarlet_screen_inugumi_03: "Pantalla Inugumi Mayor"
 building_scarlet_screen_inugumi_03_desc: "Tus Inugumi son ahora una agencia realmente respetable, y algunos han empezado a extender tu alcance a los dominios ocultos de los Hengeyokai y los Wu T'ian. Ya era hora."
 building_scarlet_screen_inugumi_04: "Pantalla Inugumi Superior"
 building_scarlet_screen_inugumi_04_desc: "Tus Inugumi son ahora una agencia realmente respetable, y algunos han empezado a extender tu alcance a los dominios ocultos de los Hengeyokai y los Wu T'ian. Ya era hora."
 building_scarlet_screen_inugumi_05: "Pantalla Inugumi Celestial"
 building_scarlet_screen_inugumi_05_desc: "Tus Inugumi se han convertido en tus ojos y oídos por toda la región, mientras tu mano se extiende cada vez más lejos."
 
 building_type_scarlet_screen_ryugumi_01: "Pantalla Escarlata Ryugumi"
 building_type_scarlet_screen_ryugumi_01_desc: "#F Las "Tropas Dragón" (ryugumi), entrenadas específicamente para combatir grandes amenazas contra su amo [GetTrait('kueijin').GetName( GetNullCharacter )].#!"
 building_scarlet_screen_ryugumi_01: "Pantalla Ryugumi Menor"
 building_scarlet_screen_ryugumi_01_desc: "Tus Ryugumi son ahora una potente guardia de honor. Solo son un puñado por ahora, pero ya puedes dormir tranquilo durante el día."
 building_scarlet_screen_ryugumi_02: "Pantalla Ryugumi Mediana"
 building_scarlet_screen_ryugumi_02_desc: "Tus Ryugumi ahora se extienden por toda tu guarida, y tienes suficientes de sobra como para que te acompañen en batalla. Es agradable no luchar solo."
 building_scarlet_screen_ryugumi_03: "Pantalla Ryugumi Mayor"
 building_scarlet_screen_ryugumi_03_desc: "Tus Ryugumi ahora se extienden por toda tu guarida, y tienes suficientes de sobra como para que te acompañen en batalla. Es agradable no luchar solo."
 building_scarlet_screen_ryugumi_04: "Pantalla Ryugumi Superior"
 building_scarlet_screen_ryugumi_04_desc: "Tus Ryugumi ahora se extienden por toda tu guarida, y tienes suficientes de sobra como para que te acompañen en batalla. Es agradable no luchar solo."
 building_scarlet_screen_ryugumi_05: "Pantalla Ryugumi Celestial"
 building_scarlet_screen_ryugumi_05_desc: "Tus Ryugumi harían temblar a la Guardia Imperial de todos los imperios, pues tus Mejores no se estremecen ante nada, sea demonio, shen o mortal."
 
 building_type_scarlet_screen_spies_01: "Pantalla Escarlata de Espías"
 building_type_scarlet_screen_spies_01_desc: "#F Las pantallas de espías regulares se usan para la recopilación de inteligencia.#!"
 building_scarlet_screen_spies_01: "Pantalla de Espías Menor"
 building_scarlet_screen_spies_01_desc: "Ahora tienes una red de espías en esta zona, que te alimenta con chismes locales. Trivial, pero bueno para entrenar."
 building_scarlet_screen_spies_02: "Pantalla de Espías Mediana"
 building_scarlet_screen_spies_02_desc: "Los asuntos regionales son ahora un factor conocido para ti, pues has empezado a tener ojos y oídos en todas partes."
 building_scarlet_screen_spies_03: "Pantalla de Espías Mayor"
 building_scarlet_screen_spies_03_desc: "Los asuntos regionales son ahora un factor conocido para ti, pues has empezado a tener ojos y oídos en todas partes."
 building_scarlet_screen_spies_04: "Pantalla de Espías Superior"
 building_scarlet_screen_spies_04_desc: "Los asuntos regionales son ahora un factor conocido para ti, pues has empezado a tener ojos y oídos en todas partes."
 building_scarlet_screen_spies_05: "Pantalla de Espías Celestial"
 building_scarlet_screen_spies_05_desc: "Tu alcance ahora domina este lugar, y nada escapa a tu mirada implacable."
 
 building_type_scarlet_screen_merchants_01: "Pantalla Escarlata de Mercaderes"
 building_type_scarlet_screen_merchants_01_desc: "#F Las pantallas de mercaderes se ocupan de las necesidades financieras del [GetTrait('kueijin').GetName( GetNullCharacter )].#!"
 building_scarlet_screen_merchants_01: "Pantalla de Mercaderes Menor"
 building_scarlet_screen_merchants_01_desc: "Has empezado a desviar una pequeña cantidad de dinero de esta zona, reforzando tus empresas."
 building_scarlet_screen_merchants_02: "Pantalla de Mercaderes Mediana"
 building_scarlet_screen_merchants_02_desc: "Tus finanzas locales ahora están aseguradas, al igual que tus "impuestos" invisibles sobre la zona."
 building_scarlet_screen_merchants_03: "Pantalla de Mercaderes Mayor"
 building_scarlet_screen_merchants_03_desc: "Tus finanzas locales ahora están aseguradas, al igual que tus "impuestos" invisibles sobre la zona."
 building_scarlet_screen_merchants_04: "Pantalla de Mercaderes Superior"
 building_scarlet_screen_merchants_04_desc: "Tus finanzas locales ahora están aseguradas, al igual que tus "impuestos" invisibles sobre la zona."
 building_scarlet_screen_merchants_05: "Pantalla de Mercaderes Celestial"
 building_scarlet_screen_merchants_05_desc: "Bajo tu "cuidado", el oro ahora fluye hacia tus arcas como miel de una colmena rota."
 
 building_type_scarlet_screen_artisans_01: "Pantalla Escarlata de Artesanos"
 building_type_scarlet_screen_artisans_01_desc: "#F Los artesanos trabajan para aumentar la influencia de su amo en la ciudad por medios civiles.#!"
 building_scarlet_screen_artisans_01: "Pantalla de Artesanos Menor"
 building_scarlet_screen_artisans_01_desc: "Has posado para algunos artistas, y has hablado con escultores. Ha sido una experiencia esclarecedora."
 building_scarlet_screen_artisans_02: "Pantalla de Artesanos Mediana"
 building_scarlet_screen_artisans_02_desc: "Tu impacto artístico y cultural ahora se siente en una pequeña zona, pues te has convertido en el centro de una pequeña mística local."
 building_scarlet_screen_artisans_03: "Pantalla de Artesanos Mayor"
 building_scarlet_screen_artisans_03_desc: "Tu impacto artístico y cultural ahora se siente en una pequeña zona, pues te has convertido en el centro de una pequeña mística local."
 building_scarlet_screen_artisans_04: "Pantalla de Artesanos Superior"
 building_scarlet_screen_artisans_04_desc: "Tu impacto artístico y cultural ahora se siente en una pequeña zona, pues te has convertido en el centro de una pequeña mística local."
 building_scarlet_screen_artisans_05: "Pantalla de Artesanos Celestial"
 building_scarlet_screen_artisans_05_desc: "Hasta la vanidosa Rut de las Geishas Pretenciosas envidiaría el impacto artístico que has tenido en esta zona."
 
 building_type_scarlet_screen_peasants_01: "Pantalla Escarlata de Campesinos"
 building_type_scarlet_screen_peasants_01_desc: "#F Los campesinos son responsables de mantener a salvo al [GetTrait('kueijin').GetName( GetNullCharacter )]. En la [Glossary('Quinta Era','game_concept_fifth_age_desc')], los grupos políticos locales también han pasado a clasificarse como "campesinos".#!"
 building_scarlet_screen_peasants_01: "Pantalla de Campesinos Menor"
 building_scarlet_screen_peasants_01_desc: "Tu refugio ahora está "vigilado" por un pequeño grupo de mortales, ya que cualquier atacante tendría que abrirse paso entre ellos primero para llegar a ti."
 building_scarlet_screen_peasants_02: "Pantalla de Campesinos Mediana"
 building_scarlet_screen_peasants_02_desc: "Ahora custodiado por un pueblo entero, tu refugio está bien protegido por el campesinado común, y algunos de ellos hasta saben lo que hacen."
 building_scarlet_screen_peasants_03: "Pantalla de Campesinos Mayor"
 building_scarlet_screen_peasants_03_desc: "Ahora custodiado por un pueblo entero, tu refugio está bien protegido por el campesinado común, y algunos de ellos hasta saben lo que hacen."
 building_scarlet_screen_peasants_04: "Pantalla de Campesinos Superior"
 building_scarlet_screen_peasants_04_desc: "Ahora custodiado por un pueblo entero, tu refugio está bien protegido por el campesinado común, y algunos de ellos hasta saben lo que hacen."
 building_scarlet_screen_peasants_05: "Pantalla de Campesinos Celestial"
 building_scarlet_screen_peasants_05_desc: "Atacarte a ti es atacar a la ciudad misma."
 
 building_type_feng_shui_harmonized_area_01: "Zona Armonizada por el Feng Shui"
 building_type_feng_shui_harmonized_area_01_desc: "#F "Viento y agua" en chino, el feng shui es la práctica de la geomancia china, el arte de coordinar edificios y entornos en armonía con los Espíritus de la tierra y las líneas naturales de fuerza y poder.#!"
 building_feng_shui_harmonized_area_01: "Zona Armonizada por el Feng Shui Menor"
 building_feng_shui_harmonized_area_01_desc: "Antes de levantar cualquier edificio, se lleva a un practicante de feng shui al lugar propuesto para la construcción, con el fin de determinar las fuerzas naturales y las líneas ley de la zona y ver si el diseño del arquitecto se ajusta a las corrientes inherentes de la tierra. "
 building_feng_shui_harmonized_area_02: "Zona Armonizada por el Feng Shui Mediana"
 building_feng_shui_harmonized_area_02_desc: "En efecto, los practicantes del feng shui conocen rituales y fórmulas para elevar o reducir el Velo de una zona con los Mundos Espirituales. Al construir un edificio conforme a los principios del feng shui, el lugar puede llenarse de energía armoniosa, reduciendo eficazmente el Velo local en uno o dos niveles."
 building_feng_shui_harmonized_area_03: "Zona Armonizada por el Feng Shui Mayor"
 building_feng_shui_harmonized_area_03_desc: "El feng shui se toma extremadamente en serio en la sociedad $pod_kueijin$. Los fang shih (practicantes del feng shui) se consideran tan importantes como los arquitectos y agrimensores, y se les paga generosamente por sus servicios. La palabra de un fang shih es ley en la construcción de un edificio."
 building_feng_shui_harmonized_area_04: "Zona Armonizada por el Feng Shui Superior"
 building_feng_shui_harmonized_area_04_desc: "Ciertos $pod_kueijin$ han estudiado su propia versión del feng shui, y se ofrecen como practicantes por las noches. Llamado Tso Tao (el "camino negro"), este arte se usa para alinear correctamente las tumbas $pod_kueijin$ con las fuerzas del Chi, para determinar la mejor forma de construir guaridas, e incluso como herramienta para buscar cuevas ocultas en las vastas zonas rurales de China."
 
