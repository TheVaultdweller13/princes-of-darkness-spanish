 building_type_house_perfumed_waters_01: "Casa de las Aguas Perfumadas"
 building_type_house_perfumed_waters_01_desc: "#F Creada por una emprendedora y joven coterie que aprovechó una ciudad de peregrinación, este baño para peregrinos cansados funciona también como burdel. Los empleados servían como fuente de sangre mientras los clientes lo hacían como fuente de oro.\nEl éxito de la coterie creó envidia y el baño se ha convertido en un premio codiciado por vampiros rivales e incluso por otros seres sobrenaturales.#!"
