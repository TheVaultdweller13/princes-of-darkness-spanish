 building_type_oasis_of_lingering_dreams_01: "Oasis de los Sueños Persistentes"
 building_type_oasis_of_lingering_dreams_01_desc: "#F Los linajes de Arabia Saudí combinan la elegancia del desierto con los relatos románticos de las tribus beduinas. El gobernante actual habita en su feudo, el Oasis de los Sueños Persistentes, situado en el desierto a las afueras de la capital, Riad.#!"
