 building_type_market_01: "Mercado"
 building_type_market_01_desc: "#flavor Muchos freeholds se marchitan bajo el sofocante peso de la Banalidad en entornos urbanos, pero los mercados prosperan donde otros fracasan. Casi todos los mercados se encuentran en grandes pueblos o ciudades y sus raths están ocultos en callejones traseros o tras puertas de «Solo Empleados» de negocios humanos. Bulliciosos día y noche, los mercados son adonde acuden los changelings a comprar, vender e intercambiar objetos quiméricos y oportunidades de empleo.#!"
