 building_type_homestead_01: "Heredad"
 building_type_homestead_01_desc: "#flavor Las heredades son freeholds dedicados al cultivo y la producción de diversos cultivos y animales quiméricos. Por su naturaleza, las heredades apenas tienen presencia en el mundo mundano y se sitúan, en cambio, casi por completo en el Ensueño Cercano. Las heredades suelen ser dirigidas por plebeyos, pero casi siempre dependen de otro freehold para el comercio y la defensa. Las heredades pueden ser específicas, centradas en un solo recurso, o generales, y producir una variedad mayor de bienes.#!"
 building_homestead_01: "$building_type_homestead_01$ pequeña"
 building_homestead_01_desc: "$building_type_homestead_01_desc$"
