 building_type_grand_bazaar_01: "El Gran Bazar"
 building_type_grand_bazaar_01_desc: "#F Aquellos perdidos en interminables dunas de arena o escondidos en los páramos estériles del desierto pueden ver este oasis y ciudad de tiendas como un espejismo borroso en el horizonte.\n\nLas oportunidades son infinitas, pero el Bazar es como un glorioso tapiz que descansa ligeramente sobre un nido de víboras.#!" 
 building_grand_bazaar_01: "El Gran Bazar"
 building_grand_bazaar_01_desc: "Aquellos perdidos en interminables dunas de arena o escondidos en los páramos estériles del desierto pueden ver este oasis y ciudad de tiendas como un espejismo borroso en el horizonte.\n\nLas oportunidades son infinitas, pero el Bazar es como un glorioso tapiz que descansa ligeramente sobre un nido de víboras." 
