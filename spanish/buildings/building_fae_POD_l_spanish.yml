 building_homestead_05: "$building_type_homestead_01$ gigantesca"
 building_homestead_05_desc: "$building_type_homestead_01_desc$"
 building_type_workshop_01: "Taller"
 building_type_workshop_01_desc: "#flavor Los talleres son freeholds con una presencia casi completamente física y solo una huella en el Ensueño. Pueden pertenecer a nobles, pero casi todos están atendidos y dirigidos por plebeyos (normalmente nockers o boggans). En los talleres se forja el acero quimérico, se cose la gasa y se elabora la cerveza. El Glamour rara vez se cosecha para uso personal, sino que se emplea en la creación de Tesoros y otros bienes feéricos.#!"
