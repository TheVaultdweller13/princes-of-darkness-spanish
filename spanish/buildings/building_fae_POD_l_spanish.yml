l_spanish:
 building_type_trods_01: "Trods"
 building_type_trods_01_desc: "#flavor Una red de senderos mágicos cruza tanto el mundo mundano como todos los puntos del Ensueño. Estos caminos existen desde hace siglos y, aunque se han degradado y algunas ramas se han perdido con el tiempo, el sistema de trods que se ramifica por el espacio conocido (y desconocido) es un importante sistema de transporte para los changelings de todas partes.#!"
 building_trods_01: "Trods Muy Pequeños"
 building_trods_01_desc: "Los Trods de esta zona son bastante pequeños y de difícil acceso"
 building_trods_02: "Trods Pequeños"
 building_trods_02_desc: "Los Trods de esta zona son pequeños y algo difíciles de acceder"
 building_trods_03: "Trods Normales"
 building_trods_03_desc: "Los Trods de esta zona están en condiciones de uso"
 building_trods_04: "Trods Grandes"
 building_trods_04_desc: "Los Trods de esta zona son de bastante buena calidad, con fácil acceso y un tamaño no pequeño"
 building_trods_05: "Trods Enormes"
 building_trods_05_desc: "Los Trods de esta zona son de buena calidad, con acceso muy fácil y gran tamaño"
 building_trods_06: "Trods Gigantescos"
 building_trods_06_desc: "Los Trods de esta zona son de muy buena calidad, se puede entrar en ellos sin mucho esfuerzo y su tamaño es gigantesco"
 building_type_hearth_01: "Hogar"
 building_type_hearth_01_desc: "#flavor Un freehold de hogar suele adoptar la forma de una posada o taberna apartada de las miradas indiscretas de los mortales. Por poderosos que sean, todos los hogares se consideran sacrosantos, más que cualquier otro freehold, y la mayoría de los fae los defenderán hasta la muerte.#!"
