 building_type_manor_01: "Mansión"
 building_type_manor_01_desc: "#flavor De alcance algo más amplio que las fortalezas, pero no tan abarcador como los thorpes, los freeholds de mansión son diminutas comunidades que rodean un edificio central que alberga el fuego maligno. Junto a los hogares, los freeholds de mansión son los más comunes y casi siempre están en manos de sidhe y de kiths ennoblecidos.#!"
