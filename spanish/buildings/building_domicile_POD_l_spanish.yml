 sisters_john_healing_ritual_domicile_building: "Oraciones Sanadoras"
 sisters_john_healing_ritual_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('sisters_john_01').GetName])#!\nPara los maltrechos caballeros de la Inquisición que regresan a casa, ver a las Hermanas rezar es como entrar en el Cielo."
 sisters_john_torturers_tools_domicile_building: "Cámara de Tortura"
 sisters_john_torturers_tools_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('sisters_john_01').GetName])#!\nLas Hermanas conocen las artes curativas, pero también saben cómo hacer hablar al más obstinado engendro del Infierno. Pocos se atreven a acercarse a la cámara subterránea donde operan."
 sisters_john_thoughts_prayers_domicile_building: "Pensamientos y Oraciones"
 sisters_john_thoughts_prayers_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('sisters_john_01').GetName])#!\nLa voz reconfortante de las Hermanas cantando puede calmar la mente incluso del Inquisidor más agotado."
 domicile_building_parameter_unlock_sisters_john_prospect: "Tu decisión de Invitar Candidato ahora te permitirá convocar a una Hermana de San Juan en lugar de a un aspirante a pupilo." 
