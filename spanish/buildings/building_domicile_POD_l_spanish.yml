 abbadon_throne_01_domicile_building: "Trono de Abbadon"
 abbadon_throne_01_domicile_building_desc: "La «Gracia de Alas», Serafín de la Legión de Ébano, fue uno de los primeros en unirse a Lucifer y uno de los primeros en traicionarlo. Su Legión luchó, sangró y masacró más que ninguna otra."
