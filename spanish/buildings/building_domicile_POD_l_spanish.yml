 red_order_01_domicile_building: "Cuarteles de la Orden Roja"
 red_order_01_domicile_building_desc: "La a menudo difamada Orden Roja sigue siendo una parte esencial de la Inquisición de las Sombras. Para derrotar a tu enemigo, primero debes conocerlo, aunque sea a costa de la tentación de aprender un poco más de la cuenta..."
 red_order_02_domicile_building: "$red_order_01_domicile_building$"
 red_order_02_domicile_building_desc: "$red_order_01_domicile_building_desc$"
 red_order_03_domicile_building: "$red_order_01_domicile_building$"
