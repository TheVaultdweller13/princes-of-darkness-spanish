 oculi_dei_05_domicile_building: "$oculi_dei_01_domicile_building$"
 oculi_dei_05_domicile_building_desc: "$oculi_dei_01_domicile_building_desc$"
 oculi_dei_06_domicile_building: "$oculi_dei_01_domicile_building$"
 oculi_dei_06_domicile_building_desc: "$oculi_dei_01_domicile_building_desc$"
 oculi_dei_spying_bards_domicile_building: "Bardos Espías"
 oculi_dei_spying_bards_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('oculi_dei_01').GetName])#!\nPresentes en la corte de cada poderoso señor y en la más humilde taberna, los bardos son los ojos y oídos de los Oculi Dei."
 oculi_dei_wandering_poets_domicile_building: "Relatos de Valentía"
 oculi_dei_wandering_poets_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('oculi_dei_01').GetName])#!\nEnsalzando la nobleza y virtud de los caballeros de la Inquisición por doquier, dándoles el valor para seguir adelante."
 oculi_dei_capering_fools_domicile_building: "Bufones Queridos"
 oculi_dei_capering_fools_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('oculi_dei_01').GetName])#!\nLibres de las leyes del clero, los Oculi Dei pueden aligerar el ambiente en cualquier campamento con historias... algo más subidas de tono."
 domicile_building_parameter_unlock_oculi_dei_prospect: "Tu decisión de Invitar Candidato ahora te permitirá convocar a un Oculi Dei en lugar de a un aspirante a pupilo." 
 oculi_dei_traps_domicile_building: "Trucos y Trampas"
 oculi_dei_traps_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('oculi_dei_01').GetName])#!\nUsando todos los trucos (sucios) posibles, los Oculi Dei aseguran la defensa del perímetro mientras sus hermanos del clero miran hacia otro lado."
 oculi_dei_local_hangers_on_domicile_building: "Contactos Locales"
 oculi_dei_local_hangers_on_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('oculi_dei_01').GetName])#!\nLa población local se alegra de compartir sus preocupaciones con un plebeyo como ellos en lugar de con un temible inquisidor."
 oculi_dei_local_recruits_domicile_building: "Reclutas Locales"
 oculi_dei_local_recruits_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('oculi_dei_01').GetName])#!\nComo la única orden inquisitorial verdaderamente plebeya, los Oculi Dei terminan siendo el lugar de referencia para los reclutas entusiastas que no proceden del clero ni de la nobleza."
 oculi_dei_nightly_debates_domicile_building: "Planes Nocturnos"
 oculi_dei_nightly_debates_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('oculi_dei_01').GetName])#!\nEn la oscuridad de la noche, mientras sus compañeros inquisidores esperan la bendición del nuevo día, los Oculi Dei planean el trabajo que tienen por delante."

 von_murnau_01_domicile_building: "Cuarteles de Von Murnau"
 von_murnau_01_domicile_building_desc: "La noble familia bávara tiene los medios, la voluntad y el deber moral de apoyar a la Inquisición de cualquier forma que puedan. Su maldición es un recordatorio diario de ese hecho."
