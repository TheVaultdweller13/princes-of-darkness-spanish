 dagon_throne_lord_of_genhinnom_domicile_building: "Señor de Genhinnom"
 dagon_throne_lord_of_genhinnom_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('dagon_throne_01').GetName])#!\nDagón y su legión construyeron grandes Bastiones, incluyendo el propio Genhinnom. La Catedral Negra fue la mayor fortaleza de los rebeldes y el hogar del propio Lucifer."
 dagon_throne_lord_of_shanmukha_domicile_building: "Señor de los Shanmukha"
 dagon_throne_lord_of_shanmukha_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('dagon_throne_01').GetName])#!\nLos seguidores de Dagón en Mohenjo-Daro eran conocidos como los Shanmukha. Los bendijo con conocimiento, convirtiéndolos en un culto de arquitectos dementes."
 dagon_throne_that_withstands_lightning_domicile_building: "Aquel que Resiste el Rayo"
 dagon_throne_that_withstands_lightning_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('dagon_throne_01').GetName])#!\nEl relicario de Dagón es una enorme y extraña maquinaria de piedra blasfema, con engranajes de roca chirriantes y palancas ígneas talladas con oraciones blasfemas. La maquinaria es su dominio, y el futuro que prepara para la humanidad."
