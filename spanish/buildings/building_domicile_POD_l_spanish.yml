 vampire_stable_kennel_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_stable_01').GetName])#!\nSuelta a los perros de guerra (potenciados por sangre divinamente maldita)."
 vampire_stable_stable_domicile_building: "Establo Nocturno"
 vampire_stable_stable_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_stable_01').GetName])#!\nUn lugar adecuado para alojar a tus temibles monturas de guerra sedientas de sangre."
 vampire_stable_trackers_domicile_building: "Cazadores de Sangre"
 vampire_stable_trackers_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_stable_01').GetName])#!\nLas bestias bien adiestradas (y potenciadas por la sangre) son capaces de rastrear cualquier cosa, incluso de noche."
 vampire_stable_beast_burden_domicile_building: "Bestias de Carga"
 vampire_stable_beast_burden_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_stable_01').GetName])#!\nPotenciar a tus bestias de carga comunes con los poderes de la sangre puede hacerlas mucho más útiles y resistentes incluso en condiciones difíciles."

 vampire_military_order_01_domicile_building: "Aposentos Militares"
 vampire_military_order_01_domicile_building_desc: "Ya sea un poderoso príncipe o un señor de la guerra errante, todo vampiro que se precie necesita un séquito bien armado que lo proteja de las espadas, dagas y garras de sus enemigos."
