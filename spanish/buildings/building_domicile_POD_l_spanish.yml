 red_order_06_domicile_building: "$red_order_01_domicile_building$"
 red_order_06_domicile_building_desc: "$red_order_01_domicile_building_desc$"
 red_order_herbalists_domicile_building: "Compendio de Plantas"
 red_order_herbalists_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('red_order_01').GetName])#!\nAunque las Hermanas de San Juan son hábiles en el uso de hierbas medicinales, es la Orden Roja quien realmente domina todo lo que las plantas pueden ofrecer, de la vida a la muerte."
 red_order_siege_engineers_domicile_building: "La Caída del Enemigo"
 red_order_siege_engineers_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('red_order_01').GetName])#!\nLa Orden Roja sabe dónde golpear al Enemigo para que realmente duela. Bajo su guía, los golpes de la Inquisición son quirúrgicos y dolorosos."
 red_order_shrine_domicile_building: "Orden Piadosa"
 red_order_shrine_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('red_order_01').GetName])#!\nPara contrarrestar su reputación como organización peligrosa, la Orden Roja se esfuerza por presentar la fachada de una piedad perfecta."
 domicile_building_parameter_unlock_red_order_prospect: "Tu decisión de Invitar Candidato ahora te permitirá convocar a un miembro de la Orden Roja en lugar de a un aspirante a pupilo." 
 red_order_library_domicile_building: "Biblioteca Roja"
 red_order_library_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('red_order_01').GetName])#!\nLa Orden Roja es, con diferencia, la más erudita entre los miembros de la Inquisición. Su extensa biblioteca contiene bastantes tomos que muchos preferirían ver quemados."
 red_order_ransom_cages_domicile_building: "Jaulas Rojas"
 red_order_ransom_cages_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('red_order_01').GetName])#!\nEl Enemigo es escurridizo. Solo la Orden Roja sabe lo suficiente para contrarrestar sus trucos y asegurarse de que permanezca donde está."
 red_order_shared_quarters_domicile_building: "Monasterio Compartido"
 red_order_shared_quarters_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('red_order_01').GetName])#!\nLas Hermanas Rojas sostienen que deberían compartir alojamiento (y acceso a información) con los Hermanos Rojos. Algo que la Iglesia ve con muy malos ojos."

 haven_defenses_01_domicile_building: "Defensas del Refugio"
 haven_defenses_01_domicile_building_desc: "No es simple paranoia; tus enemigos vendrán a por ti una noche. Y más te vale tener un plan de contingencia para cuando eso ocurra."
