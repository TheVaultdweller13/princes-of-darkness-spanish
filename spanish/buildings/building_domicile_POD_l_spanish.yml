 haven_defenses_live_entertainment_domicile_building: "Entretenimiento en Vivo"
 haven_defenses_live_entertainment_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('haven_defenses_01').GetName])#!\nA veces quieres privacidad y a veces quieres compañía. Están encantados de complacerte si estás en el segundo humor."
 haven_defenses_rumormonger_domicile_building: "Rumoreros Errantes"
 haven_defenses_rumormonger_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('haven_defenses_01').GetName])#!\nAunque a menudo insufribles, quienes se ganan la vida viajando por la tierra y aprendiendo sobre ella son indispensables para comprender lo que ocurre más allá de tus fronteras."
 haven_defenses_capering_fools_domicile_building: "Bufones Retozones"
 haven_defenses_capering_fools_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('haven_defenses_01').GetName])#!\nUna tradición robada a los mortales de esta era: muchos señores y damas de la noche tienen un bufón a su disposición, un puesto a menudo usado para más que un simple entretenimiento."
 haven_defenses_traps_domicile_building: "Trampas Ocultas"
 haven_defenses_traps_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('haven_defenses_01').GetName])#!\nCualquier aspirante a aventurero se llevará una sorpresa mortal cuando intente asaltar tu castillo. El número de veces que has puesto una palanca al otro lado de la puerta que intentarán forzar es sencillamente diabólico."
 haven_defenses_brutish_guards_domicile_building: "Guardias Brutos"
 haven_defenses_brutish_guards_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('haven_defenses_01').GetName])#!\nQuizá no sean tan temibles como parecen, pero no importa: a veces la imagen de la fuerza es más importante que la fuerza misma."
 haven_defenses_workforce_domicile_building: "Mano de Obra Controlada"
 haven_defenses_workforce_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('haven_defenses_01').GetName])#!\nTu refugio siempre necesitará reparaciones y mantenimiento. Mejor tener a la gente adecuada a (sangrienta) disposición."
 haven_defenses_majordomo_domicile_building: "Castellano del Refugio"
 haven_defenses_majordomo_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('haven_defenses_01').GetName])#!\nEl amo de tu casa (cuando estás fuera) se asegura de que todo funcione como un reloj. Cualquier irregularidad encontrada es debidamente informada."

