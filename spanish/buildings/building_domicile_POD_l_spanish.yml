 vampire_ambassador_poets_domicile_building: "Poetas Contratados"
 vampire_ambassador_poets_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_ambassador_01').GetName])#!\nUna tradición en muchas cortes; los poetas pueden variar desde el estilo romántico francés Toreador hasta el belicoso y macabro estilo transilvano Tzimisce."
 vampire_ambassador_team_domicile_building: "Personal Diplomático"
 vampire_ambassador_team_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_ambassador_01').GetName])#!\nLos embajadores de los gobernantes más poderosos a menudo viajan con un séquito considerable que se encarga de tareas mucho más mundanas."
 vampire_ambassador_foreign_contacts_domicile_building: "Contactos Extranjeros"
 vampire_ambassador_foreign_contacts_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_ambassador_01').GetName])#!\nComo un maestro de caravana, los embajadores exitosos suelen tener muchos contactos con los que contar para ayudarles en sus tareas, o para esconderse si la diplomacia fracasa."
 vampire_ambassador_musicians_domicile_building: "Entrada Prestigiosa"
 vampire_ambassador_musicians_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_ambassador_01').GetName])#!\nLa primera entrada de un embajador en una corte suele ser un gran evento con música y regalos en abundancia. Cuanto más impresionante (o decadente) sea, más prestigio otorga al embajador y a su patrón."
 #pod_ambassador_building_tt: "You need to be a Landless Ambassador to unlock this building."
 
 vampire_cult_01_domicile_building: "Congregaciones de las Fes de Cenizas"
 vampire_cult_01_domicile_building_desc: "En la oscura Edad Media, los cultos vampíricos están en todas partes. Desde los benignos hasta los apocalípticos, todo Príncipe debe lidiar con ellos tarde o temprano. Muchos tienen protocolos específicos para ayudarlos, obstaculizarlos o incluso destruirlos cuando llegue el momento."
