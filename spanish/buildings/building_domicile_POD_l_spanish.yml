 servant_quarters_stocked_supplies_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('servant_quarters_01').GetName])#!\nTu gente no se queda de brazos cruzados mientras te ocupas de asuntos más importantes. Aquí se preparan para el momento en que vuelvas a estar en marcha."
