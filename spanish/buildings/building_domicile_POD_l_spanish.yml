 abbadon_throne_fifth_domicile_building: "Señor de la Inmundicia"
 abbadon_throne_fifth_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('abbadon_throne_01').GetName])#!\nAbaddon es un señor de la carne, y de su corrupción y degradación. A menudo agracia a sus Esclavos tanto con inmunidad a las enfermedades como con la capacidad de propagarlas a otros."
 abbadon_throne_lord_wrath_domicile_building: "Señor de la Ira"
 abbadon_throne_lord_wrath_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('abbadon_throne_01').GetName])#!\nAbbadon es un demonio de la ira, aunque atempera su furia constante con una inteligencia inhumana, de modo que su verdadero objetivo siempre es el primero en caer ante sus imparables arremetidas."
 abbadon_throne_black_blood_tribe_domicile_building: "La Tribu de Sangre Negra"
 abbadon_throne_black_blood_tribe_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('abbadon_throne_01').GetName])#!\nLa tribu de Sangre Negra era un grupo de guerreros salvajes que adoraban a Abbadon bajo la apariencia de Loki. Estos invasores vikingos atacaron incontables pueblos, desde Escandinavia hasta Inglaterra, saqueando asentamiento tras asentamiento. Las bandas de guerra estaban lideradas por algunos de los Esclavos más preciados del archiduque, hombres versados en las artes de la violencia y el terror."
 abbadon_throne_thrall_strength_domicile_building: "Señor de las Atrocidades"
 abbadon_throne_thrall_strength_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('abbadon_throne_01').GetName])#!\nAbbadon puede remodelar la carne de sus Esclavos, o de Inocentes indefensos, a su antojo, haciéndolos estallar con tumores o despedazándolos con espasmos musculares. A menudo agracia a sus Esclavos con fuerza o resistencia inhumanas."
 abbadon_throne_vampire_thrall_domicile_building: "Experimentos con Vampiros"
 abbadon_throne_vampire_thrall_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('abbadon_throne_01').GetName])#!\nAbaddon desarrolló interés por los Cainitas, realizando experimentos con la sangre de sus Esclavos, con la esperanza de hacerla tanto infecciosa como adictiva para el paladar de los Cainitas y así ganar su veneración."
 domicile_building_parameter_abbadon_wrath_parameter: "Cuando ordenas a un [thrall|E] ir a la guerra, ahora obtendrá [GetModifier('warfare_wrathful_strategy_modifier').GetNameWithTooltip] durante #V 5#! años"
 domicile_building_parameter_black_blood_tribe_parameter: "Desbloquea a los [men_at_arms|E] [GetMaA('black_blood_tribe_maa').GetName]"
 domicile_building_parameter_thrall_strength_parameter: "Todos tus [thralls|E] ganan #V 5#! de [prowess|E]"
 domicile_building_parameter_vampire_thrall_parameter: "$POD_splat_vampire_plural$ ahora será más fácil de [Concept('thrall','Esclavizar')|E]"
 
 black_blood_tribe_maa: "Tribu de Sangre Negra"
 black_blood_tribe_maa_desc: "Un grupo de guerreros salvajes que adoraban a Abbadon bajo su apariencia de Loki. Las bandas de guerra estaban lideradas por algunos de los Esclavos más preciados del archiduque, hombres versados en las artes de la violencia y el terror. La Sangre Negra entró en conflicto con los Garou locales."
 
 dagon_throne_01_domicile_building: "Trono de Dagón"
 dagon_throne_01_domicile_building_desc: "El Archiduque de la Legión de Hierro se hizo pasar por una docena de dioses y diosas a lo largo de las eras. La ingente cantidad de fe que reunió potenció sus Conjuras y cultos como pocos otros."
