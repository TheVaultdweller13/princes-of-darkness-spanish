 knights_acre_calatrava_domicile_building: "Caballeros de Calatrava"
 knights_acre_calatrava_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('knights_acre_01').GetName])#!\nLos Caballeros Ibéricos se han unido a tu causa, ofreciendo su considerable pericia en la guerra de golpear y huir."
 knights_acre_helena_domicile_building: "Caballeros de Santa Elena"
 knights_acre_helena_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('knights_acre_01').GetName])#!\nGuerreras inspiradas en la madre de Constantino, la Orden de Santa Elena es vista con sospecha por la Iglesia, pero está más que dispuesta a ayudar si un alma justa las busca."
 knights_acre_templars_domicile_building: "Caballeros Templarios"
 knights_acre_templars_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('knights_acre_01').GetName])#!\nAunque su lealtad a la causa de la Inquisición es cuando menos dudosa, pocos pueden negar el poderío combativo de los misteriosos Templarios."
 knights_acre_catherine_domicile_building: "Caballeros de Santa Catalina"
 knights_acre_catherine_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('knights_acre_01').GetName])#!\nCasi destruida por los Cainitas de Levante, los supervivientes de la Orden de Santa Catalina luchan con todas sus fuerzas para vengar a sus hermanos."
 knights_acre_thomas_domicile_building: "Caballeros de Santo Tomás"
 knights_acre_thomas_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('knights_acre_01').GetName])#!\nAl haber sido abandonada por la Iglesia en general, la Orden de Santo Tomás carece de fondos para operar como unidades pesadas. Esto los ha hecho expertos en tácticas más poco convencionales."
 knights_acre_teutonic_domicile_building: "Caballeros Teutónicos"
 knights_acre_teutonic_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('knights_acre_01').GetName])#!\nA pesar de los rumores de haber sido infiltrados por una orden espejo de vampiros, los Caballeros Teutónicos siguen dedicados a la buena causa."
 knights_acre_livonia_domicile_building: "Caballeros de Livonia"
 knights_acre_livonia_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('knights_acre_01').GetName])#!\nEndurecida por las luchas contra los paganos bálticos, la Orden de Livonia ofrece su ayuda a la Inquisición cuando se la solicita."
 knights_acre_hospitalers_domicile_building: "Caballeros Hospitalarios"
 knights_acre_hospitalers_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('knights_acre_01').GetName])#!\nSolo superados en renombre por los Templarios, los Hospitalarios están además mucho más dispuestos a trabajar junto a otras órdenes, e incluso junto a mujeres consagradas, lo que los convierte en un valioso activo para una Inquisición unida."
 domicile_building_parameter_unlock_knights_acre_prospect: "Tu decisión de Invitar Candidato ahora te permite convocar a un Caballero de Acre en lugar de a un aspirante a pupilo."

 sisters_john_01_domicile_building: "Cuarteles de las Hermanas de San Juan"
 sisters_john_01_domicile_building_desc: "Para algunos, las Hermanas son las sanadoras y cuidadoras de la Inquisición. Para otros, son las videntes, las más tocadas por Dios. Para todos, son esenciales."
