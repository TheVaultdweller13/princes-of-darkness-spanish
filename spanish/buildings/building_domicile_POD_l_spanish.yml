 vampire_caravan_local_contacts_domicile_building: "Contactos Locales"
 vampire_caravan_local_contacts_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_caravan_01').GetName])#!\nLos hábiles maestros de caravana tienen un amigo en cada pueblo, que los informa de lo que conviene saber mientras pasan por allí."
 vampire_caravan_bartering_grounds_domicile_building: "Terreno de Trueque"
 vampire_caravan_bartering_grounds_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_caravan_01').GetName])#!\nLos bienes (o personas) exóticos son una rara mercancía por la que merece la pena negociar para el gobernante de la noche verdaderamente exigente."
 vampire_caravan_blood_dolls_domicile_building: "Séquito Digno"
 vampire_caravan_blood_dolls_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_caravan_01').GetName])#!\nUna caravana es una gran operación, a veces incluso una pequeña aldea en sí misma. Hay mucho que aprender de quienes recorren el mundo."
 vampire_caravan_defenses_domicile_building: "Círculo Defensivo"
 vampire_caravan_defenses_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_caravan_01').GetName])#!\nEl peligro puede aparecer en cualquier momento en el camino. Las caravanas exitosas son capaces de defenderse en un abrir y cerrar de ojos."
 
 vampire_ambassador_01_domicile_building: "Aposentos de Embajador"
 vampire_ambassador_01_domicile_building_desc: "Los embajadores son la savia de la política nocturna. Representan a sus señores y damas en el extranjero y a menudo se los emplea como intermediarios de confianza, sutiles conspiradores o, los más desdichados, rehenes."
