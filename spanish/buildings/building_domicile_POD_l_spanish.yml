 von_murnau_brewers_domicile_building: "Cerveceros Von Murnau"
 von_murnau_brewers_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('von_murnau_01').GetName])#!\nComo haría cualquier familia noble (alemana) que se precie, los Von Murnau tienen a su servicio a expertos cerveceros que comparten gustosos con las tropas comunes."
 von_murnau_contacts_domicile_building: "Lazos con la Nobleza"
 von_murnau_contacts_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('von_murnau_01').GetName])#!\nLos Von Murnau tienen lazos con muchas familias poderosas de Europa. Usar estos lazos les permite equipar a los caballeros de la Inquisición con equipo barato pero de calidad."
 von_murnau_cooks_domicile_building: "Cocineros del Ejército"
 von_murnau_cooks_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('von_murnau_01').GetName])#!\nComo sus hermanos del clero no tienen ni idea de las complejidades de alimentar a un ejército de verdad, son los Von Murnau quienes se encargan de la planificación necesaria para que los soldados de Dios no pasen hambre."
 domicile_building_parameter_unlock_von_murnau_prospect: "Tu decisión de Invitar Candidato ahora te permitirá convocar a un Von Murnau en lugar de a un aspirante a pupilo." 
