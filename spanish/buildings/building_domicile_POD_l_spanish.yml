 oculi_dei_01_domicile_building: "Cuarteles de los Oculi Dei"
 oculi_dei_01_domicile_building_desc: "Los Oculi Dei son los laicos de la Inquisición de las Sombras. Menos imponentes (y temidos) que sus homólogos del clero, pueden mantener el oído atento al suelo y el dedo en el pulso de la gente común."
 oculi_dei_02_domicile_building: "$oculi_dei_01_domicile_building$"
 oculi_dei_02_domicile_building_desc: "$oculi_dei_01_domicile_building_desc$"
