 asmodeus_throne_01_domicile_building: "Trono de Asmodeo"
 asmodeus_throne_01_domicile_building_desc: "El Archiduque de la Legión de Plata fue quien estuvo detrás de los actos desesperados y horripilantes que llevaron a la creación de los Nefilim. Su caída en desgracia fue brutal y absoluta."
