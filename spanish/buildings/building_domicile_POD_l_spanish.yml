 vampire_military_ghoul_quarters_domicile_building: "Aposentos Militares de Ghouls"
 vampire_military_ghoul_quarters_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_military_order_01').GetName])#!\nAunque no son tan fuertes como sus amos vampiros, los Ghouls son más numerosos y siguen siendo más resistentes que un mortal promedio, lo que los hace útiles en tiempos de guerra."
 vampire_military_training_grounds_domicile_building: "Campo de Entrenamiento"
 vampire_military_training_grounds_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_military_order_01').GetName])#!\nLa guerra abierta es un suceso lo bastante raro para las criaturas de la noche. Por ello, mantener sus habilidades afiladas es primordial."
 vampire_military_war_planning_domicile_building: "Sala de Guerra"
 vampire_military_war_planning_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_military_order_01').GetName])#!\nLos seres inmortales han visto muchas estrategias aplicadas por generales mortales. Allí pueden usar este importante conocimiento para diseñar el mejor plan para su situación particular."
 vampire_military_mercenary_contracts_domicile_building: "Contratos de Mercenario"
 vampire_military_mercenary_contracts_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_military_order_01').GetName])#!\nMuchas pequeñas bandas de mercenarios son contratadas en secreto por criaturas de la noche. Aunque no suelen aparecer en el propio campo de batalla, son muy hábiles rematando a un ejército herido y en retirada."
 
 vampire_caravan_01_domicile_building: "Caravana Nocturna"
 vampire_caravan_01_domicile_building_desc: "Solo unos pocos individuos, muy solicitados, son capaces de soportar los peligros del camino y asegurarse de que las personas y bienes lleguen a salvo hasta el exigente señor o señora de la noche."
