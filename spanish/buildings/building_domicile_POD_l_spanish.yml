 tower_of_pride_01_domicile_building: "Torre de Babel"
 tower_of_pride_01_domicile_building_desc: "#italic Por eso se llamó Babel, porque allí el Señor confundió (balal) la lengua de toda la tierra, y desde allí el Señor los dispersó por toda la faz de la tierra.#!"
 treasury_of_avarice_01_domicile_building: "Becerro de Oro"
 treasury_of_avarice_01_domicile_building_desc: "#italic Solo piensan en Mamón, cuyo dios es la bolsa.#!"
 pit_of_wrath_01_domicile_building: "Fosa de la Ira"
 pit_of_wrath_01_domicile_building_desc: "#italic Airaos, pero no pequéis: no se ponga el sol sobre vuestro enojo. Ni deis lugar al diablo.#!"
 hall_of_gluttony_01_domicile_building: "Salón de la Gula"
 hall_of_gluttony_01_domicile_building_desc: "#italic Porque muchos de los que os he hablado a menudo, y ahora os lo digo incluso con lágrimas, andan como enemigos de la cruz de Cristo. Su fin es la perdición, su dios es el vientre, y su gloria está en su vergüenza, poniendo su mente en las cosas terrenales.#!"
 inn_of_lust_01_domicile_building: "Jardín de los Placeres"
 inn_of_lust_01_domicile_building_desc: "#italic Huid de la inmoralidad sexual. Todo otro pecado que el hombre comete está fuera del cuerpo, pero el que comete inmoralidad sexual peca contra su propio cuerpo.#!"
 house_of_sloth_01_domicile_building: "Casa de la Pereza"
 house_of_sloth_01_domicile_building_desc: "#italic Por la pereza se hunde el techo, y por la indolencia la casa gotea.#!"
 department_of_envy_01_domicile_building: "Palacio de la Envidia"
 department_of_envy_01_domicile_building_desc: "#italic Porque donde hay envidia y ambición egoísta, allí hay desorden y toda obra perversa.#!"
  
 mummy_thanatology_library_01_domicile_building: "Biblioteca de Tanatología"
 mummy_thanatology_library_01_domicile_building_desc: "Gracias a tus extensos viajes, posees una colección sin igual de valiosos tomos sobre la muerte y el alma pertenecientes a diversas culturas."
 
  