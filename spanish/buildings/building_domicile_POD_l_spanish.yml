 asmodeus_throne_lord_of_anthropomancy_domicile_building: "Señor de la Antropomancia"
 asmodeus_throne_lord_of_anthropomancy_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('asmodeus_throne_01').GetName])#!\nInvocado por primera vez por una cábala de magos reales sumerios, Asmodeo promete visiones del futuro a los artistas y eruditos que se le entregan."
 asmodeus_throne_fear_humanity_domicile_building: "Temor a la Humanidad"
 asmodeus_throne_fear_humanity_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('asmodeus_throne_01').GetName])#!\nFue el temor de Asmodeo a que la humanidad superara a las huestes del Cielo lo que lo llevó a intentar controlarla con los experimentos de los Nefilim. Pronto se dio cuenta del grave error que había cometido."
 domicile_building_parameter_improved_nephilim_parameters: "Tus [GetTrait('nephilim').GetName(GetNullCharacter)] ahora obtendrán un rasgo físico positivo al nacer si aún no tienen uno"
 asmodeus_throne_rome_china_domicile_building: "De Roma a China"
 asmodeus_throne_rome_china_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('asmodeus_throne_01').GetName])#!\nCon su influencia sobre el Imperio Romano, Asmodeo se convirtió durante un tiempo en el Archiduque preeminente. Su culto no tuvo rival entre sus "hermanos"."
 domicile_building_parameter_unlock_nephilim_parameter: "Tus hijos [GetTrait('laham').GetName(GetNullCharacter)] ahora serán [GetTrait('nephilim').GetName(GetNullCharacter)] en su lugar, que son inmortales, más fuertes y pueden usar [Concept('lore_lifestyle','Saberes')|E] demoníacos #weak (si eres un $POD_splat_demon$)#!"
 domicile_building_parameter_increased_thrall_cap_parameter: "Tu número máximo de [thralls|E] aumenta en #V 1#!"

 azrael_throne_01_domicile_building: "Trono de Azrael"
 azrael_throne_01_domicile_building_desc: "El culto del Señor de la Legión de Alabastro prosperó en torno a la rica región de Aksum, siendo venerado como un dios de la muerte y el Inframundo."
