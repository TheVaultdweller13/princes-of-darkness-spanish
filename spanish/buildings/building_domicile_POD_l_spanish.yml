 belial_throne_shang_cultists_domicile_building: "Virtud de la Profundidad Sin Límite"
 belial_throne_shang_cultists_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('belial_throne_01').GetName])#!\nInvocado por primera vez por magos de la dinastía Shang, Belial se acostumbró a que le sirvieran Esclavos muy hábiles y prestigiosos."
 belial_throne_elite_cults_domicile_building: "Cultos de Élite"
 belial_throne_elite_cults_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('belial_throne_01').GetName])#!\nBelial siempre prefirió la calidad a la cantidad. Sus cultos, aunque pequeños, eran muy capaces y estaban muy dedicados."
 belial_throne_unlimited_hatred_domicile_building: "Odio Eterno"
 belial_throne_unlimited_hatred_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('belial_throne_01').GetName])#!\nEl odio de Belial hacia Lucifer es legendario. A sus ojos, toda la Creación podría arder si eso significara la destrucción del Lucero del Alba."
