 knights_acre_01_domicile_building: "Cuarteles de los Caballeros de Acre"
 knights_acre_01_domicile_building_desc: "La Orden de los Pobres Caballeros de la Pasión de la Cruz de Acre son los estrategas militares de la Inquisición de las Sombras. Te ofrecen su apoyo en tu justa lucha contra el Enemigo."
