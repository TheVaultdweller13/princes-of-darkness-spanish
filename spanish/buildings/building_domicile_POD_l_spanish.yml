 azrael_throne_angel_shadows_domicile_building: "Ángel de las Sombras"
 azrael_throne_angel_shadows_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('azrael_throne_01').GetName])#!\nAl crear un segundo mundo sin la supervisión de Dios ni de Lucifer, Azrael fue fundamental en el nacimiento de lo que se conocería como el Inframundo."
 azrael_throne_heitsi_eibib_domicile_building: "Heitsi-Eibib"
 azrael_throne_heitsi_eibib_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('azrael_throne_01').GetName])#!\nEl culto de Azrael era conocido por su inclinación erudita, adentrándose en la Necromancia y otras prácticas prohibidas para complacer a su patrón."
 azrael_throne_scarecrow_domicile_building: "El Espantapájaros"
 azrael_throne_scarecrow_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('azrael_throne_01').GetName])#!\nEl Relicario de Azrael es una efigie de espantapájaros construida con miles de huesos, la forma esquelética cubierta con tela gris, los ojos incrustados con esmeraldas torcidas."
