 vampire_cult_acolytes_domicile_building: "Acólitos y Seguidores"
 vampire_cult_acolytes_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_cult_01').GetName])#!\nCada culto tiene su cuota de fanáticos, dispuestos a difundir su fe allá donde vayan."
 vampire_cult_sheperd_domicile_building: "Pastor del Rebaño"
 vampire_cult_sheperd_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_cult_01').GetName])#!\nUn buen Sacerdote de Cenizas atiende las necesidades espirituales de su gente, pero a menudo delega las más temporales."
 vampire_cult_last_rites_domicile_building: "Últimos Ritos"
 vampire_cult_last_rites_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_cult_01').GetName])#!\nLos cultos de Cenizas prosperan en zonas peligrosas. Allá donde la desesperación, la enfermedad o la guerra quiebran la voluntad de los hombres, ofrecen una tentadora salvación."
 vampire_cult_cells_domicile_building: "Enemigos de la Fe"
 vampire_cult_cells_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_cult_01').GetName])#!\nSon raras las Fes de Cenizas completamente pacifistas, e incluso esas a veces deben protegerse del daño, a veces de forma proactiva."
 monthly_animal_lifestyle_xp_gain_add: "Ganancia mensual de experiencia de Estilo de vida Animal"

 vampire_military_our_cause_1_domicile_building: "Comprender Nuestra Causa"
 vampire_military_our_cause_1_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_military_order_01').GetName])#!\nNuestros valores deben enseñarse a nuestros nuevos reclutas. Solo así estarán verdaderamente comprometidos con nuestra orden."
 require_military_order_specific_1_tt: "Debes ser el [ashen_grandmaster|E] de una orden militar con un precepto de Motivo Específico."
 vampire_military_our_cause_2_domicile_building: "Defender Nuestra Causa"
 vampire_military_our_cause_2_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_military_order_01').GetName])#!\nLos ajenos podrían pensar que entienden lo que representamos. Están equivocados. Solo los de la orden lo saben de verdad."
 require_military_order_specific_2_tt: "Debes ser el [ashen_grandmaster|E] de una orden militar con un precepto de Motivo Específico mejorado."
 vampire_military_our_cause_3_domicile_building: "Proteger Nuestra Causa"
 vampire_military_our_cause_3_domicile_building_desc: "#weak (Requiere [GetDomicileBuilding('vampire_military_order_01').GetName])#!\nCon nuestro código de conducta ya consolidado, ahora debemos dirigirnos al mundo exterior para llevar a cabo nuestra Misión."
 require_military_order_specific_3_tt: "Debes ser el [ashen_grandmaster|E] de una orden militar con un precepto de Motivo Específico completado."


