 servant_quarters_01_domicile_building_desc: "Ya sea de viaje o no, un vampiro siempre necesita sangre a mano. ¿Qué mejor manera de tenerla que cultivar un séquito de mortales dispuestos a dar su preciada fuerza vital roja en cualquier momento?"
