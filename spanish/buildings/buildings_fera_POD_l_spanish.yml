 building_type_altar_seline_01: "Altar de Seline"
 building_type_altar_seline_01_desc: "#F La Luna, hermana empática de Gaia, obviamente favorece a los werecats y los considera sus mejores creaciones. Dio origen a las Razas Cambiantes como un regalo para la Tierra, y se dice que su cuerpo es el santuario final para todo Bastet.#!"
 building_altar_seline_01: "Pequeño Altar de Seline"
 building_altar_seline_01_desc: "La madre de la estirpe felina cuida con afecto de sus orgullosos hijos, incluso en los refugios más pequeños."
 building_altar_seline_02: "Altar respetable de Seline"
 building_altar_seline_02_desc: "Pocos comprenden realmente a la caprichosa Diosa de la Luna, pero los Bastet aún sienten su calidez al estar en este lugar sagrado."
 building_altar_seline_03: "Gran Altar de Seline"
 building_altar_seline_03_desc: "Todo el alabanza a la Dama de la Luna, la verdadera patrona de los felinos de todas partes. Muchos de sus hijos se reúnen aquí para rendirle homenaje."
 POD_needs_seline_oracle: "#X Necesitas emplear a un [GetCourtPositionType('seline_oracle_court_position').GetName()].#!"
 POD_needs_seline_oracle_2: "#X Necesitas emplear a un [GetCourtPositionType('seline_oracle_court_position').GetName()] con Buena Aptitud o superior.#!"
 POD_needs_seline_oracle_3: "#X Necesitas emplear a un [GetCourtPositionType('seline_oracle_court_position').GetName()] con Excelente Aptitud o superior.#!"

 building_type_taghairm_gathering_01: "Reunión Taghairm"
 building_type_taghairm_gathering_01_desc: "#F El Taghairm es una reunión de felinos que suele convocarse para intercambiar información o cortesías. Normalmente se realiza en el apogeo de la luna llena.#!"
 building_taghairm_gathering_01: "Pequeña reunión Taghairm"
 building_taghairm_gathering_01_desc: "Una zona pequeña donde los Bastet se reúnen para hablar y jugar de forma informal."
 building_taghairm_gathering_02: "Reunión respetable Taghairm"
 building_taghairm_gathering_02_desc: "Reservados específicamente para el Taghairm, estos terrenos albergan muchas reuniones de la estirpe felina."
 building_taghairm_gathering_03: "Gran reunión Taghairm"
 building_taghairm_gathering_03_desc: "Una zona grandiosa y bien amueblada donde los Bastet de regiones distantes vienen a intercambiar información y conocimientos con sus hermanos locales."
 POD_needs_master_taghairm: "#X Necesitas emplear a un [GetCourtPositionType('master_taghairm_court_position').GetName()].#!"
 POD_needs_master_taghairm_2: "#X Necesitas emplear a un [GetCourtPositionType('master_taghairm_court_position').GetName()] con Buena Aptitud o superior.#!"
 POD_needs_master_taghairm_3: "#X Necesitas emplear a [GetCourtPositionType('master_taghairm_court_position').GetName()] con Excelente Aptitud o superior.#!"

 building_type_taklah_training_01: "Campos de entrenamiento Taklah"
 building_type_taklah_training_01_desc: "#F Un Taklah es una escolta de élite de werecats reunidos para un propósito común.#!"
 building_taklah_training_01: "Pequeños campos de entrenamiento Taklah"
 building_taklah_training_01_desc: "Los guerreros de los Bastet son menos renombrados que sus primos Garou, pero aun así, solo un necio los subestimaría."
 building_taklah_training_02: "Campos de entrenamiento respetables Taklah"
 building_taklah_training_02_desc: "Los Bastet son criaturas solitarias pero, cuando un propósito común los une, trabajan sorprendentemente bien juntos."
 building_taklah_training_03: "Grandes campos de entrenamiento Taklah"
 building_taklah_training_03_desc: "Los grandes felinos inspiran asombro y respeto en la mente de los mortales. Este Taklah Bastet hará lo mismo con sus enemigos."
 POD_needs_warleader_taklah: "#X Necesitas emplear a un [GetCourtPositionType('warleader_taklah_court_position').GetName()].#!"
 POD_needs_warleader_taklah_2: "#X Necesitas emplear a un [GetCourtPositionType('warleader_taklah_court_position').GetName()] con Buena Aptitud o superior.#!"
 POD_needs_warleader_taklah_3: "#X Necesitas emplear a un [GetCourtPositionType('warleader_taklah_court_position').GetName()] con Aptitud Excelente o superior.#!"

 building_type_yava_court_01: "Corte Yava"
 building_type_yava_court_01_desc: "#F Un Yava es un secreto tribal, oculto de todos los extraños, que supuestamente otorga poder sobre ti a otro ser si se aprende. Siendo lo más celosamente guardado del saber Bastet, estos solo se revelan en las circunstancias más extremas, si es que llegan a revelarse.#!"
 building_yava_court_01: "Pequeña corte Yava"
 building_yava_court_01_desc: "Una zona pequeña donde los Bastet eruditos meditan sobre el Yava y donde los de mentalidad más práctica meditan cómo castigar a aquellos extraños que robaron estos secretos tribales."
 building_yava_court_02: "Corte respetable Yava"
 building_yava_court_02_desc: "El juicio para aquellos necios que revelen los mayores secretos de la tribu es rápido y despiadado."
 building_yava_court_03: "Gran Corte Yava"
 building_yava_court_03_desc: "Los miembros de la tribu de todo el mundo vienen a este lugar para discutir los últimos acontecimientos relacionados con la sagrada Yava."
 POD_needs_guardian_yava: "#X Necesitas emplear a un [GetCourtPositionType('guardian_yava_court_position').GetName()].#!"
 POD_needs_guardian_yava_2: "#X Necesitas emplear a un [GetCourtPositionType('guardian_yava_court_position').GetName()] con Buena Aptitud o superior.#!"
 POD_needs_guardian_yava_3: "#X Necesitas emplear a un [GetCourtPositionType('guardian_yava_court_position').GetName()] con Excelente Aptitud o superior.#!"

 building_type_den_realm_01: "Señorío-Guarida"
 building_type_den_realm_01_desc: "#F Un Señorío-Guarida es un parche de la [umbra|E] que está vinculado a un $glossary_fera$ y sirve como su retiro personal. La mayoría de los Señoríos-Guaridas están vinculados a áreas de la realidad física y proporcionan un túnel hacia la Umbra Cercana, de modo que dar un paso lateral o usar métodos similares para entrar en la [umbra|E] es más fácil. Los Señoríos-Guaridas están bien protegidos y es difícil romper sus defensas.#!"
 den_realm_effect_desc: "#help Si esta es tu capital:#!\nReduce el coste de $POD_energy_gnosis$ para entrar en la [umbra|E] en:\n#P -25%#!/Nivel del edificio"
 building_den_realm_01: "Menor Señorío-Guarida"
 building_den_realm_01_desc: "Un pequeño pero funcional portal a una diminuta parcela de la [umbra|E]."
 building_den_realm_02: "Señorío-Guarida Floreciente"
 building_den_realm_02_desc: "Un portal a una pequeña parcela de la [umbra|E], protegido por defensas sólidas."
 building_den_realm_03: "Imponente Señorío-Guarida"
 building_den_realm_03_desc: "Un túnel hacia un gran reino de la [umbra|E], protegido por fuertes defensas, ideal como retiro pacífico para su dueño."


 building_type_bush_retreat_01: "Retiro de la Maleza"
 building_type_bush_retreat_01_desc: "#F Los Swara son criaturas muy solitarias. Combinados con su perfecto conocimiento de su entorno y su gran velocidad, son casi imposibles de atrapar para sus enemigos.#!"
 building_bush_retreat_01: "Menor Retiro de la Maleza"
 building_bush_retreat_01_desc: "Swara son criaturas muy solitarias. Combinados con su perfecto conocimiento de su entorno y su gran velocidad, son casi imposibles de atrapar para sus enemigos."
 building_bush_retreat_02: "Retiro de la Maleza"
 building_bush_retreat_02_desc: "$building_bush_retreat_01_desc$"
 building_bush_retreat_03: "Retiro de la Maleza Desconocido"
 building_bush_retreat_03_desc: "$building_bush_retreat_01_desc$"



 building_type_feline_law_01: "Corte de la Ley Felina"
 building_type_feline_law_01_desc: "#F Los Bagheera fueron creados como los jueces de la estirpe felina. Aunque la mayoría de las otras tribus no reconocen este hecho, ellos siguen valorando el honor y la justicia como sus valores primordiales.#!"
 building_feline_law_01: "Pequeña Corte de la Ley Felina"
 building_feline_law_01_desc: "Los Bagheera fueron creados para ser los jueces de la estirpe felina. Aunque la mayoría de las otras tribus no reconocen este hecho, ellos siguen valorando el honor y la justicia como sus valores primordiales."
 building_feline_law_02: "Corte de la Ley Felina"
 building_feline_law_02_desc: "$building_feline_law_01_desc$"
 building_feline_law_03: "Gran Corte de la Ley Felina"
 building_feline_law_03_desc: "$building_feline_law_01_desc$"


 building_type_temple_bast_01: "Templo de Bast"
 building_type_temple_bast_01_desc: "#F Hace mucho tiempo que los hijos de Bast dejaron de ser adorados como dioses por los antiguos egipcios. Sin embargo, los Bubasti no lo olvidaron y un día pondrán a la humanidad de rodillas, donde pertenece.#!"
 building_temple_bast_01: "Pequeño Templo de Bast"
 building_temple_bast_01_desc: "Hace mucho tiempo que los hijos de Bast dejaron de ser adorados como dioses por los antiguos egipcios. Sin embargo, los Bubasti no lo olvidaron y un día pondrán a la humanidad de rodillas, donde pertenece."
 building_temple_bast_02: "Templo de Bast"
 building_temple_bast_02_desc: "$building_temple_bast_01$"
 building_temple_bast_03: "Gran Templo de Bast"
 building_temple_bast_03_desc: "$building_temple_bast_01$"


 building_type_samhain_grounds_01: "Terrenos de Samhain"
 building_type_samhain_grounds_01_desc: "#F A pesar de su precaria posición, los Ceilican todavía se deleitan en sus pasiones extremas, utilizando su festival tradicional de Samhain para atraer a los mortales (y a otros) al mismo frenesí de emociones.#!"
 building_samhain_grounds_01: "Pequeños Terrenos de Samhain"
 building_samhain_grounds_01_desc: "A pesar de su precaria posición, los Ceilican todavía se deleitan en sus pasiones extremas, utilizando su festival tradicional de Samhain para atraer a los mortales (y a otros) al mismo Frenesí de emociones."
 building_samhain_grounds_02: "Terrenos de Samhain"
