 building_white_sea_03_desc: "Un Túmulo de Resistencia donde se reúnen los Hijos de Gaia finlandeses. Tiene defensas sólidas que también le han ganado el respeto de las tribus cercanas."

 building_type_wild_sea_01: "Túmulo del Mar Salvaje"
 building_type_wild_sea_01_desc: "#F El túmulo se centra en un antiguo cementerio pagano, acechado por los fantasmas de la gente que habitó esta costa antes de la llegada de los celtas.#!"
 building_wild_sea_01: "Túmulo floreciente del Mar Salvaje"
 building_wild_sea_01_desc: "El túmulo es un lugar de tranquilo respiro, pero albergar a refugiados de los estragos de la Plaga de Desollamiento agotó sus recursos al máximo."
 building_wild_sea_02: "Túmulo en crecimiento del Mar Salvaje"
 building_wild_sea_02_desc: "El dolor mudo de los fantasmas del cementerio pagano penetra el velo entre los mundos y permite a los Teúrgos Fianna extraer Gnosis de la [umbra|E]."
 building_wild_sea_03: "Imponente Túmulo del Mar Salvaje"
 building_wild_sea_03_desc: "La última fortaleza que le queda a los Fianna tras la Plaga de Desollamiento. ¿Un lugar lo suficientemente fuerte como para reconstruir a toda su tribu?"

 building_type_fimbul_winter_01: "Túmulo de la Noche del Invierno Fimbul"
 building_type_fimbul_winter_01_desc: "#F El más formidable Túmulo de la Camada de Fenris en Escandinavia, donde los héroes se reunieron tras la terrible batalla contra Wotan.#!"
