 building_samhain_grounds_03: "Grandes Terrenos de Samhain"
 building_samhain_grounds_03_desc: "$building_samhain_grounds_01_desc$"


 building_type_warrior_scholar_lodge_01: "Logia de Guerrero Erudito"
 building_type_warrior_scholar_lodge_01_desc: "#F Los Khans buscan la perfección en sí mismos, tanto en mente como en cuerpo, para poder liderar a la Nación Bastet con el ejemplo.#!"
 building_warrior_scholar_lodge_01: "Menor Logia de Guerrero Erudito"
 building_warrior_scholar_lodge_01_desc: "Los Khans buscan la perfección en sí mismos, tanto en mente como en cuerpo, para poder liderar a la Nación Bastet con el ejemplo."
 building_warrior_scholar_lodge_02: "Logia de Guerrero Erudito"
 building_warrior_scholar_lodge_02_desc: "$building_warrior_scholar_lodge_01_desc$"
 building_warrior_scholar_lodge_03: "Gran Logia de Guerrero Erudito"
