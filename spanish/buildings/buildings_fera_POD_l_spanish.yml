 building_type_sun_glory_01: "Túmulo de la Gloria del Sol"
 building_type_sun_glory_01_desc: "#F Centrado en un lago perpetuamente congelado, este Túmulo es quizás el lugar de encuentro multitri-tribal más importante de Europa.#!"
 building_sun_glory_01: "Túmulo de la Gloria del Sol floreciente"
 building_sun_glory_01_desc: "Fundado como el Túmulo de las Grandes Montañas, desde entonces fue renombrado en reconocimiento a las hazañas de la Gloria del Sol de Guillaume en la región."
 building_sun_glory_02: "Túmulo de la Gloria del Sol en crecimiento"
 building_sun_glory_02_desc: "Siguiendo el ejemplo de Guillaume, el Túmulo de la Gloria del Sol está dedicado a la destrucción de vampiros, lo que le ha valido una reputación temible."
 building_sun_glory_03: "Imponente Túmulo de la Gloria del Sol"
 building_sun_glory_03_desc: "Helios protege el Túmulo; sus rayos mortales aseguran que ningún vampiro pueda entrar sin llevarse una desagradable sorpresa."

 building_type_white_sea_01: "Túmulo del Mar Blanco"
 building_type_white_sea_01_desc: "#F Un Túmulo de Resistencia donde se reúnen los Hijos de Gaia finlandeses. Tiene defensas sólidas que también le han ganado el respeto de las tribus cercanas.#!"
 building_white_sea_01: "Túmulo del Mar Blanco floreciente"
 building_white_sea_01_desc: "Un Túmulo de Resistencia donde se reúnen los Hijos de Gaia finlandeses. Tiene defensas sólidas que también le han ganado el respeto de las tribus cercanas."
 building_white_sea_02: "Túmulo en crecimiento del Mar Blanco"
 building_white_sea_02_desc: "Un Túmulo de Resistencia donde se reúnen los Hijos de Gaia finlandeses. Tiene defensas sólidas que también le han ganado el respeto de las tribus cercanas."
