 building_type_night_sky_01: "Túmulo del Cielo Nocturno"
 building_type_night_sky_01_desc: "#F Un testimonio de la resiliencia de los Señores de la Sombra, este túmulo nunca cayó a pesar de la Plaga de Desollamiento y los ataques del maldito Tzimisce.#!"
