 building_type_crescent_moon_01: "Túmulo de la Luna Creciente"
 building_type_crescent_moon_01_desc: "#F El centro de poder de los Colmillos Plateados en Rusia, y quizás su mayor Túmulo en todo el mundo.#!"
 building_crescent_moon_01: "Túmulo floreciente de la Luna Creciente"
 building_crescent_moon_01_desc: "Descubierto durante los tiempos del Impergium, el Túmulo de la Luna Creciente se encuentra en un valle oculto en las profundidades de los Urales."
 building_crescent_moon_02: "Túmulo en crecimiento de la Luna Creciente"
 building_crescent_moon_02_desc: "Antiguo hogar de un monstruoso Zmei, muchos héroes legendarios de los Colmillos Plateados murieron para arrebatar el control de la zona a la Tribu."
 building_crescent_moon_03: "Imponente Túmulo de la Luna Creciente"
 building_crescent_moon_03_desc: "Tras expulsar al Zmei, poderosos Teúrgos purificaron la tierra, asegurándose de que la Luna Creciente permanezca como un recordatorio de la Destreza de los Colmillos Plateados durante los siglos venideros."

 building_type_snow_leopard_01: "Túmulo del Leopardo de las Nieves"
 building_type_snow_leopard_01_desc: "#F El Túmulo de los Contempladores de Estrellas más famoso del mundo, un centro de aprendizaje y cooperación sin igual.#!"
 building_snow_leopard_01: "Túmulo floreciente del Leopardo de las Nieves"
 building_snow_leopard_01_desc: "Fundado por el bizantino Contemplador de Estrellas Justiniano, este Túmulo ha sido fruto del esfuerzo conjunto con el misterioso vampiro llamado Milarepa."
 building_snow_leopard_02: "Túmulo en crecimiento del Leopardo de las Nieves"
 building_snow_leopard_02_desc: "Es aquí donde Justiniano libró su última resistencia contra un poderoso Vagabundo de los Nexos. Aunque perdió la vida durante la batalla, se aseguró la seguridad del Túmulo."
 building_snow_leopard_03: "Imponente Túmulo del Leopardo de las Nieves"
 building_snow_leopard_03_desc: "Tras la victoria de Justiniano contra el Vagabundo de los Nexos, la fama del Túmulo creció rápidamente y pronto se convirtió en un importante centro de la cultura de los Contempladores de Estrellas."

 building_type_field_stars_01: "Túmulo del Campo de Estrellas"
 building_type_field_stars_01_desc: "#F Un poderoso Túmulo de Liderazgo cerca del nacimiento de un río. Muy expuesto, este Túmulo ha visto más batallas y pérdidas de las que le corresponden, forjando una raza de supervivientes entre sus defensores.#!"
 building_field_stars_01: "Túmulo floreciente del Campo de Estrellas"
 building_field_stars_01_desc: "Un poderoso Túmulo de Liderazgo cerca del nacimiento de un río. Muy expuesto, este Túmulo ha visto más batallas y pérdidas de las que le corresponden, forjando una raza de supervivientes entre sus defensores."
 building_field_stars_02: "Túmulo en crecimiento del Campo de Estrellas"
 building_field_stars_02_desc: "Un poderoso Túmulo de Liderazgo cerca del nacimiento de un río. Muy expuesto, este Túmulo ha visto más batallas y pérdidas de las que le corresponden, forjando una raza de supervivientes entre sus defensores."
 building_field_stars_03: "Imponente Túmulo del Campo de Estrellas"
 building_field_stars_03_desc: "Un poderoso Túmulo de Liderazgo cerca del nacimiento de un río. Bastante expuesto, este Túmulo ha visto más batallas y pérdidas de las que le corresponden, forjando una raza de supervivientes entre sus defensores."

 building_type_thunder_blade_01: "Túmulo de la Hoja de Trueno"
 building_type_thunder_blade_01_desc: "#F El Túmulo del Clan Inoue se mantiene orgulloso de su legado.#!"
 building_thunder_blade_01: "Túmulo floreciente de la Hoja de Trueno"
 building_thunder_blade_01_desc: "Muchos Hakken pasan su tiempo en el Túmulo perfeccionando sus habilidades con la hoja. El Túmulo está lleno del sonido del choque de espadas mientras los Hakken respiren."
