 building_thunder_blade_03_desc: "$building_thunder_blade_01_desc$"

 building_type_emerald_palace_01: "Palacio Esmeralda"
 building_type_emerald_palace_01desc: "#F $building_emerald_palace_01_desc$ #!"
 building_emerald_palace_01: "Palacio Esmeralda"
 building_emerald_palace_01_desc: "La sede del poder de los Hengeyokai en Nippon. El código de honor de los Hakken significa que todos los aliados de las Cortes de la Bestia son bienvenidos en estos salones, para cualquier propósito."


 ####Bastet
 building_type_hanshii_arena_01: "Arena Hanshii"
 building_type_hanshii_arena_01_desc: "#F Un elemento esencial de la cultura Bastet, los Hanshii son combates rituales utilizados para el entretenimiento o para decidir derechos territoriales. Estos concursos pueden ser juegos de acertijos, duelos formales o una guerra de colmillos y garras.#!"
 building_hanshii_arena_01: "Pequeña arena Hanshii"
 building_hanshii_arena_01_desc: "Un pequeño lugar reservado para los desafíos Hanshii."
 building_hanshii_arena_02: "Arena Hanshii respetable"
 building_hanshii_arena_02_desc: "Desafíos de todo tipo tienen lugar aquí en esta zona bien protegida."
 building_hanshii_arena_03: "Gran arena Hanshii"
 building_hanshii_arena_03_desc: "Los Bastet se congregan aquí para observar con entusiasmo cómo los concursantes de todo el mundo reclaman su derecho en los desafíos ofrecidos."
 POD_needs_hanshii_arbiter: "#X Necesitas emplear a un [GetCourtPositionType('hanshii_arbiter_court_position').GetName()].#!"
