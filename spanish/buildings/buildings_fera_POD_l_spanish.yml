 building_type_feline_throne_01: "Trono de los Reyes de los Gatos"
 building_type_feline_throne_01_desc: "#F Los Simba se consideran los legítimos gobernantes de la estirpe felina. Su arrogancia roza la crueldad cuando alguien cuestiona esa afirmación.#!"
 building_feline_throne_01: "Insignificante trono de los reyes de los gatos"
 building_feline_throne_01_desc: "Los Simba se consideran los legítimos gobernantes de la estirpe felina. Su arrogancia roza la crueldad cuando alguien cuestiona esa afirmación."
 building_feline_throne_02: "Trono de los Reyes de los Gatos"
 building_feline_throne_02_desc: "$building_feline_throne_01_desc$"
 building_feline_throne_03: "Majestuoso trono de los reyes de los gatos"
 building_feline_throne_03_desc: "$building_feline_throne_01_desc$"



 building_type_chui_mal_01: "Chui Mal"
 building_type_chui_mal_01_desc: "#F Los Bagheera son la tribu Bastet más cercana a la humanidad. En toda la India, sociedades como los Ambari Macho, los Chui Mal, los Beral Meye y los Hombres Leopardo de Chupa los veneran como dones de los cielos.#!"
 building_chui_mal_01: "Chui Mal"
 building_chui_mal_01_desc: "Los Bagheera son la tribu Bastet más cercana a la humanidad. En toda la India, sociedades como los Ambari Macho, los Chui Mal, los Beral Meye y los Hombres Leopardo de Chupa los veneran como dones de los cielos. Están más que dispuestos a dar sus vidas por sus deidades."

 building_type_temple_bastet_01: "Complejo de templos de Bastet"
 building_type_temple_bastet_01_desc: "#F El Templo de Bastet en Saqqara fue construido sobre una extensa zona al sureste de la Pirámide de Teti. La zona incluía el Santuario de la Diosa, su complejo de culto y sus catacumbas. Su destrucción por parte de los Setitas presagió el fin del dominio Bubasti de la política egipcia.#!"
 building_temple_bastet_01: "Complejo de templos de Bastet"
 building_temple_bastet_01_desc: "El Templo de Bastet en Saqqara fue construido sobre una extensa zona al sureste de la Pirámide de Teti. La zona incluía el Santuario de la Diosa, su complejo de culto y sus catacumbas. Su destrucción por parte de los Setitas presagió el fin del dominio Bubasti de la política egipcia."

 building_type_ransacked_court_samhach_01: "Corte saqueada de Samhach"
 building_type_ransacked_court_samhach_01_desc: "#F Con su némesis Samhach derrotado y sus parientes capturados finalmente liberados, los Ceilican por fin pueden disfrutar de los muchos placeres de la vida como tanto desearon durante tanto tiempo. ¿Y qué mejor forma de empezar que con una fiesta interminable en las ruinas de la corte de su caído enemigo?#!"
 building_ransacked_court_samhach_01: "Corte saqueada de Samhach"
 building_ransacked_court_samhach_01_desc: "Con su némesis Samhach derrotado y sus parientes capturados finalmente liberados, los Ceilican por fin pueden disfrutar de los muchos placeres de la vida como tanto desearon durante tanto tiempo. ¿Y qué mejor forma de empezar que con una fiesta en las ruinas de la corte de su caído enemigo?"

 building_type_court_bright_kings_01: "Corte de los Reyes Brillantes"
 building_type_court_bright_kings_01_desc: "#F Sea lo que sea que haga un Khan, lo hace con desenfreno, ya sea luchando, cazando o incluso contemplando. La Corte de los Reyes Brillantes refleja esta pasión temeraria, rebosante de vitalidad y vigor.#!"
 building_court_bright_kings_01: "Corte de los Reyes Brillantes"
 building_court_bright_kings_01_desc: "Sea lo que sea que haga un Khan, lo hace con desenfreno, ya que sea luchando, cazando o incluso contemplando. La Corte de los Reyes Brillantes refleja esta pasión temeraria, rebosante de vitalidad y vigor."

 building_type_throne_sunlight_01: "El Trono de la Luz Solar"
 building_type_throne_sunlight_01_desc: "#F Al igual que la melena resplandeciente alrededor de las cabezas de sus reyes, los Simba se comparan con el sol. Para las otras tribus, sin embargo, son los «Reyes Oscuros», tiranos que imponen el orden mediante la intimidación y el miedo.#!"
 building_throne_sunlight_01: "El Trono de la Luz Solar"
 building_throne_sunlight_01_desc: "Al igual que la melena resplandeciente alrededor de las cabezas de sus reyes, los Simba se comparan con el sol. Para las otras tribus, sin embargo, son los «Reyes Oscuros», tiranos que imponen el orden mediante la intimidación y el miedo."

 building_type_silver_refuge_01: "El Refugio de Plata"
 building_type_silver_refuge_01_desc: "#F Los Swara, o Pueblo de Plata como se llaman a sí mismos, son incansables sanadores de las zonas con carga espiritual. Su velocidad y dedicación a su propósito brillan en este refugio pacífico y reconfortante.#!"
 building_silver_refuge_01: "El Refugio de Plata"
 building_silver_refuge_01_desc: "Los Swara, o Pueblo de Plata como se llaman a sí mismos, son incansables sanadores de las zonas con carga espiritual. Su velocidad y dedicación a este propósito brillan en este refugio pacífico y reconfortante."




 ####Mokole

 building_type_scaled_encampment_01: "Campamento de Escamas"
 building_type_scaled_encampment_01_desc: "Los guerreros Mokolé pasan su tiempo intercambiando golpes contra las gruesas pieles de los demás."
 building_scaled_encampment_01: "Pequeño campamento de escamas"
 building_scaled_encampment_01_desc: "Se puede oír el tintineo ocasional del metal mientras los Mokolé entrenan para la batalla."
 building_scaled_encampment_02: "Campamento de Escamas"
 building_scaled_encampment_02_desc: "Los temibles gritos de guerra de los saurios llenan el aire mientras los corpulentos guerreros luchan entre sí.$POD_fera_requirements_development_below_t2$"
 building_scaled_encampment_03: "Gran campamento de escamas"
 building_scaled_encampment_03_desc: "Los sonidos de armas, garras y todo tipo de armamento Archid resuenan como un coro repetitivo a lo largo de los días.$POD_fera_requirements_development_below_t3$"

 building_type_saurian_armory_01: "Armería saurio"
 building_type_saurian_armory_01_desc: "A veces, una espada fiable en el pecho es tan eficaz como las garras de un Archid."
 building_saurian_armory_01: "Pequeña armería saurio"
 building_saurian_armory_01_desc: "Unas pocas hojas forjadas por expertos adornan las paredes de esta armería."
 building_saurian_armory_02: "Armería saurio"
 building_saurian_armory_02_desc: "Una espada más afilada, un escudo más fuerte. Cualquier cosa para prolongar la vida de un guerrero.$POD_fera_requirements_development_below_t2$"
 building_saurian_armory_03: "Gran armería saurio"
 building_saurian_armory_03_desc: "Espadas, lanzas, mazos y hachas antiguos de los Mokolé decoran este salón. Solo esperan un brazo fuerte que los empuñe.$POD_fera_requirements_development_below_t3$"

 building_type_hall_elders_01: "Salón de los Antiguos"
 building_type_hall_elders_01_desc: "Como Memoria de Gaia, los Mokolé recuerdan y transmiten este conocimiento a la siguiente Generación con diligencia."
 building_hall_elders_01: "Pequeño salón de los Antiguos"
 building_hall_elders_01_desc: "Incluso un solo Antiguo respetado es una bendición para una comunidad Mokolé."
 building_hall_elders_02: "Salón de los Antiguos"
 building_hall_elders_02_desc: "Hay mucho que aprender para aquellos que están más cerca de los Reyes Lagarto de lo que nosotros estamos.$POD_fera_requirements_development_below_t2$"
 building_hall_elders_03: "Gran Salón de los Antiguos"
 building_hall_elders_03_desc: "Aquí, se pueden oír recuerdos tan antiguos como la Era del Hombre siendo relatados en descripciones vívidas.$POD_fera_requirements_development_below_t3$"

 building_type_crafters_district_01: "Distrito de artesanos"
 building_type_crafters_district_01_desc: "Los Mokolé son artesanos respetados en el mundo de los cambiantes. Algunas de sus creaciones han sobrevivido a muchas Eras."
 building_crafters_district_01: "Pequeño distrito de artesanos"
 building_crafters_district_01_desc: "Lo mínimo para una floreciente comunidad Mokolé, pero sigue siendo un pilar respetado de la vida social en esta zona."
 building_crafters_district_02: "Distrito de artesanos"
 building_crafters_district_02_desc: "Algunos de los precios expuestos pueden parecer altos, pero muestran el talento de los artesanos Mokolé en acción.$POD_fera_requirements_development_below_t2$"
 building_crafters_district_03: "Gran distrito de artesanos"
 building_crafters_district_03_desc: "Los gobernantes extranjeros visten con orgullo creaciones de este distrito, sin conocer el origen de su escamoso creador.$POD_fera_requirements_development_below_t3$"

 building_type_nest_defences_01: "Defensas del nido"
 building_type_nest_defences_01_desc: "¿Quién sería tan necio como para atacar la guarida de un Mokolé? Los muy valientes... o los muy desesperados."
 building_nest_defences_01: "Defensas del nido débiles"
 building_nest_defences_01_desc: "Algunas patrullas, algunas barricadas de madera... este nido depende principalmente de la fuerza de sus defensores."
 building_nest_defences_02: "Defensas del nido"
 building_nest_defences_02_desc: "Aunque no es un castillo verdaderamente poderoso, este nido tiene disciplina y suministros de sobra para defenderse si fuera necesario.$POD_fera_requirements_development_below_t2$"
 building_nest_defences_03: "Defensas del nido fuertes"
 building_nest_defences_03_desc: "Una verdadera fortaleza de los antiguos Reyes Lagarto, que solo un meteoro podría vulnerar.$POD_fera_requirements_development_below_t3$"

 building_type_fields_strife_01: "Campos de contienda"
 building_type_fields_strife_01_desc: "Los guerreros de Entoban sufrieron reveses, pero infligieron muchos más daños de los que recibieron. Este espíritu indomable perdura."
 building_fields_strife_01: "Pequeños campos de contienda"
 building_fields_strife_01_desc: "Las victorias del mañana se construyen en el régimen de entrenamiento de hoy."
 building_fields_strife_02: "Campos de contienda"
 building_fields_strife_02_desc: "Un Mokolé-mbembe disciplinado mirándote fijamente es, quizás, una visión más temible que una criatura brutal cargando contra ti.$POD_fera_requirements_development_below_t2$"
 building_fields_strife_03: "Grandes campos de contienda"
 building_fields_strife_03_desc: "Recreando algunas de las gloriosas batallas de su pasado, los Mokolé-mbembe perfeccionan sus tácticas para las batallas del mañana.$POD_fera_requirements_development_below_t3$"

 building_type_dry_den_01: "Guarida seca"
 building_type_dry_den_01_desc: "Los Hijos de la Serpiente del Arco Iris viven aislados y en condiciones duras. Le sacan el máximo partido."
 building_dry_den_01: "Pequeña guarida seca"
 building_dry_den_01_desc: "Para la sangre fría de los hombres lagarto, el desierto no es más que un amigo obstinado."
 building_dry_den_02: "Guarida seca"
 building_dry_den_02_desc: "Los visitantes de este lugar son escasos, y esto es algo que los Gumagan están encantados de mantener tal cual.$POD_fera_requirements_development_below_t2$"
 building_dry_den_03: "Gran guarida seca"
 building_dry_den_03_desc: "Si el Sol es el patrón de los Mokolé en su conjunto, entonces los Gumagan son quienes mejor lo comprenden.$POD_fera_requirements_development_below_t3$"

 building_type_motley_haunt_01: "Morada de la cuadrilla"
 building_type_motley_haunt_01_desc: "La corriente de aire son los Mokolé más cercanos a la humanidad; escuchan y comprenden más del mundo actual que muchos de sus homólogos."
 building_motley_haunt_01: "Pequeña morada de la cuadrilla"
 building_motley_haunt_01_desc: "El sol es luz, pero el sol también es Iluminación. El sabio Makara conoce la diferencia."
 building_motley_haunt_02: "Morada de la cuadrilla"
 building_motley_haunt_02_desc: "Donde se escuchan discursos sobre Agni, y el sonido relajante del fuego calma la mente de sus habitantes.$POD_fera_requirements_development_below_t2$"
 building_motley_haunt_03: "Gran morada de la cuadrilla"
 building_motley_haunt_03_desc: "Algunos de los más grandes diplomáticos de los Mokolé han sido formados aquí, aprendiendo bajo la sabia guía cósmica de Jya.$POD_fera_requirements_development_below_t3$"

 building_type_dragon_temple_01: "Templo del dragón"
 building_type_dragon_temple_01_desc: "La corriente de agua observa el mundo exterior y reflexiona. Sus pensamientos podrían ser la clave para salvar el equilibrio cósmico."
 building_dragon_temple_01: "Pequeño Templo Dragón"
 building_dragon_temple_01_desc: "Los progenitores de los Reyes Dragón observan desde lejos los esfuerzos de sus sucesores."
 building_dragon_temple_02: "Templo del dragón"
 building_dragon_temple_02_desc: "Aunque sus moradores valoran su privacidad, aquí nacieron leyendas mortales de dragones sabios y poderosos.$POD_fera_requirements_development_below_t2$"
 building_dragon_temple_03: "Gran Templo Dragón"
 building_dragon_temple_03_desc: "El hombre valiente busca un dragón por promesas de tesoros. El hombre sabio, en cambio, busca promesas de Iluminación.$POD_fera_requirements_development_below_t3$"


 building_type_crocodilopolis_01: "Crocodilópolis"
 building_type_crocodilopolis_01_desc: "Siendo antaño el centro de culto mortal para el poderoso Sobek, Crocodilópolis era un vestigio del asombro que los Reyes Lagarto fomentaron en la humanidad."
 building_crocodilopolis_01: "Crocodilópolis en ruinas"
 building_crocodilopolis_01_desc: "La ciudad adoraba antaño a un cocodrilo sagrado domesticado llamado Petsuchos, «el Hijo de Soukhos», que estaba adornado con colgantes de oro y gemas. Hace mucho tiempo que ha quedado relegada a un recuerdo evanescente."
 building_crocodilopolis_02: "Crocodilópolis restaurada"
 building_crocodilopolis_02_desc: "Amenemhat III creó la parte de la ciudad que estaba reservada a los cocodrilos sagrados. ¿Estuvo influenciado por los Mokolé? Ni siquiera ellos están seguros hoy en día."
 crocodilopolis_02_effect_desc: "Rastrear las tumbas revelará dos antiguos [GetTrait('mokole').GetName(GetNullCharacter)]."
 building_crocodilopolis_03: "Maravillosa Crocodilópolis"
 building_crocodilopolis_03_desc: "Se dice que el Laberinto de Crocodilópolis es más grande y confuso que incluso los de las pirámides. ¿Quién sabe qué, o quién, se esconde en su interior?"
 crocodilopolis_03_effect_desc: "La tumba final del [GetTrait('mokole').GetName(GetNullCharacter)] es revelada."

 building_type_oogleforp_01: "Oogleforp"
 building_type_oogleforp_01_desc: "Es a orillas del Nilo donde los Mokolé lucharon por la $glossary_osirian_league$. Aunque fueron derrotados entonces, su paciencia es lo bastante larga como para esperar el momento adecuado para vengarse."
 building_oogleforp_01: "Oogleforp reconstruida"
 building_oogleforp_01_desc: "Un lugar de desafío contra la corrupción de los Hijos de la Serpiente. Quizás el comienzo de una nueva historia."
 building_oogleforp_02: "Oogleforp"
 building_oogleforp_02_desc: "Los recuerdos de un pasado glorioso chocan con un presente sombrío, pero quizás sean la clave para un futuro más brillante."
 building_oogleforp_03: "Gran Oogleforp"
 building_oogleforp_03_desc: "Se vuelve a ver a los Mokolé listos para la batalla en Oogleforp. Sin su maldito progenitor, los Setitas aprenderán a temer a los Reyes Lagarto una vez más."
 oogleforp_03_effect_desc: "Archid Form gana: [GetModifier('archid_glittering_scales_modifier').GetNameWithTooltip]"


 building_type_umbral_lake_tele_01: "Lago Umbrío Tele"
 building_type_umbral_lake_tele_01_desc: "El lugar de nacimiento del Mokolé-mbembe se ha desvanecido hace mucho de la vista mortal; su guardián optó por trasladarlo a la Umbra en su lugar, lejos de miradas indiscretas."
 building_umbral_lake_tele_01: "Lago Tele velado"
 building_umbral_lake_tele_01_desc: "Las duras condiciones de la Umbra azotan el lago Tele, obligando a sus ocupantes Mokolé a expandir recursos preciosos para mantenerlo en funcionamiento."
 building_umbral_lake_tele_02: "Lago Tele oculto"
 building_umbral_lake_tele_02_desc: "Ahora estabilizado, el lago Tele es un lugar tranquilo para quienes deseen deleitarse con la sabiduría del progenitor, Mokolé-Mbembe."
 building_umbral_lake_tele_03: "Lago Umbrío Tele"
 building_umbral_lake_tele_03_desc: "Una próspera y nueva capital para los Mokolé, el lago Tele se ha convertido en un faro de inspiración para quienes deseen ver a los Reyes Lagarto alzarse una vez más."


 building_type_oannes_01: "Oannes"
 building_type_oannes_01_desc: "En algún momento, algunos Mokolé vieron potencial en la floreciente humanidad. Aquí es donde eligieron enseñarles cómo crecer espiritualmente desde sus estados bestiales."
 building_oannes_01: "Oannes reconstruida"
 building_oannes_01_desc: "Los mortales aún recuerdan que Oannes venía del mar para enseñar artes y filosofía a la población humana. Los Mokolé solo sonríen ante este pensamiento."
 building_oannes_02: "Oannes"
 building_oannes_02_desc: "Oannes se convirtió en sinónimo de «sabio» para los asombrados humanos instruidos por los Mokolé. Quizás este recuerdo pueda aprovecharse de nuevo."
 building_oannes_03: "Gran Oannes"
 building_oannes_03_desc: "Una ciudad, un hombre o un dios... Oannes sigue teniendo un lugar afectuoso en la mnesis de los Mokolé. Aunque terminó amargamente, el experimento demostró la posibilidad de la cooperación de la humanidad con los Reyes Lagarto."


 building_type_rainbow_stone_01: "Piedra del Arcoíris"
 building_type_rainbow_stone_01_desc: "#F La Piedra del Arcoíris, signo de la Serpiente del Arcoíris y fuente de poder para los Gumagan.#!"
 building_rainbow_stone_01: "Piedra del Arcoíris"
 building_rainbow_stone_01_desc: "La Piedra del Arcoíris, signo de la Serpiente del Arcoíris y fuente de poder para los Gumagan. Aunque tradicionalmente permanece en Bandaiyan, puede trasladarse cuando el flujo necesite un símbolo de unión hacia un objetivo común."


 building_type_sacred_sky_temple_01: "building_type_sacred_sky_temple_01: Templo del cielo sagrado"
 building_type_sacred_sky_temple_01_desc: "building_type_sacred_sky_temple_01_desc: Si se ha de alabar al sol, primero hay que tener un lugar adecuado para contemplarlo."
 building_sacred_sky_temple_01: "building_sacred_sky_temple_01: Templo del cielo"
 building_sacred_sky_temple_01_desc: "building_sacred_sky_temple_01_desc: La apertura más pequeña hacia el más grande de los patronos."
 building_sacred_sky_temple_02: "building_sacred_sky_temple_02: Gran templo del cielo"
 building_sacred_sky_temple_02_desc: "building_sacred_sky_temple_02_desc: Si construyen hacia el cielo, quizá algún día logren alcanzarlo. ¿Lo ven en la Mnesis?"
 building_sacred_sky_temple_03: "building_type_sacred_sky_temple_01: Templo del cielo sagrado"
 building_sacred_sky_temple_03_desc: "building_sacred_sky_temple_03_desc: Una construcción adecuada para los muchos Mokolé que desean deleitarse con la gloria de su benefactor."

 building_type_sacred_crocodile_temple_01: "building_type_sacred_crocodile_temple_01: Templo del cocodrilo sagrado"
 building_type_sacred_crocodile_temple_01_desc: "building_type_sacred_crocodile_temple_01_desc: Los amigos parentela de los Mokolé fueron adorados antaño como dioses propios. En este lugar, se les vuelve a mostrar este honor."
 building_sacred_crocodile_temple_01: "Templo del Cocodrilo"
 building_sacred_crocodile_temple_01_desc: "building_sacred_crocodile_temple_01_desc: Al encontrar el lugar de su agrado, algunos cocodrilos parecen poblar el espacio que algún día será un templo para su gloria."
 building_sacred_crocodile_temple_02: "building_sacred_crocodile_temple_02: Gran templo del cocodrilo"
 building_sacred_crocodile_temple_02_desc: "building_sacred_crocodile_temple_02_desc: Los mortales se reúnen para rendir respeto a los dioses escamosos, ya sean los de cuatro patas o los de dos."
 building_sacred_crocodile_temple_03: "building_type_sacred_crocodile_temple_01: Templo del cocodrilo sagrado"
 building_sacred_crocodile_temple_03_desc: "building_sacred_crocodile_temple_03_desc: Al parecer, comprendiendo el respeto y la adoración que reciben aquí, cada vez más cocodrilos se reúnen en los alrededores del templo bajo la mirada vigilante de los guardianes Mokolé."

 building_type_sacred_eighth_sun_temple_01: "building_type_sacred_eighth_sun_temple_01: Templo del octavo sol sagrado"
 building_type_sacred_eighth_sun_temple_01_desc: "building_type_sacred_eighth_sun_temple_01_desc: Los poderosos Mokolé solo reciben el respeto debido en unos pocos lugares remotos hoy en día. Este es uno de ellos."
 building_sacred_eighth_sun_temple_01: "building_sacred_eighth_sun_temple_01: Templo del octavo sol"
 building_sacred_eighth_sun_temple_01_desc: "building_sacred_eighth_sun_temple_01_desc: ¿Buscan favores o sienten el miedo primordial de la humanidad hacia los Reyes Lagarto?"
 building_sacred_eighth_sun_temple_02: "building_sacred_eighth_sun_temple_02: Gran templo del octavo sol"
 building_sacred_eighth_sun_temple_02_desc: "building_sacred_eighth_sun_temple_02_desc: Con tantos adoradores mortales alrededor, no es de extrañar que una casta de parentela comenzara a surgir también en esta zona."
 building_sacred_eighth_sun_temple_03: "building_type_sacred_eighth_sun_temple_01: Templo del octavo sol sagrado"
 building_sacred_eighth_sun_temple_03_desc: "building_sacred_eighth_sun_temple_03_desc: Con su parentela actuando como sacerdotes y guardianes, los Mokolé son venerados como dioses en este prestigioso templo."

 building_type_sacred_scorched_temple_01: "building_type_sacred_scorched_temple_01: Templo chamuscado sagrado"
 building_type_sacred_scorched_temple_01_desc: "building_type_sacred_scorched_temple_01_desc: Los Mokolé no son dados a las construcciones ostentosas. Pero a veces, una zona específica, a menudo rica en energía o aparentemente bendecida por el sol, capta su atención. Entonces comienza la obra."
 building_sacred_scorched_temple_01: "building_sacred_scorched_temple_01: Templo chamuscado"
 building_sacred_scorched_temple_01_desc: "building_sacred_scorched_temple_01_desc: Un templo en ascenso, aún pequeño de estatura, que domina tanto el desierto infinito como el mar infinito en la distancia."
 building_sacred_scorched_temple_02: "building_sacred_scorched_temple_02: Gran templo chamuscado"
 building_sacred_scorched_temple_02_desc: "building_sacred_scorched_temple_02_desc: Quizá aquí, entre la arena y el mar, pueda encontrarse el verdadero equilibrio. Los Mokolé, al menos, encuentran que la zona es muy agradable para su constitución."
 building_sacred_scorched_temple_03: "building_type_sacred_scorched_temple_01: Templo chamuscado sagrado"
 building_sacred_scorched_temple_03_desc: "building_sacred_scorched_temple_03_desc: Convertido en uno de los templos más poderosos de los Reyes Lagarto, este impresionante edificio se erige como testimonio de la paciencia y diligencia de los Hijos del Sol."
