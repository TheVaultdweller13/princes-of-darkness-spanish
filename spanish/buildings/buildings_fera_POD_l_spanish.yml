l_spanish:


 ####Kinfolk
 building_type_kinfolk_meeting_grounds_01: "Terreno de reunión de la Parentela"
 building_type_kinfolk_meeting_grounds_01_desc: "#F Donde la siempre importante [GetTrait('kinfolk').GetName(GetNullCharacter)] de las tribus cercanas se reúne, se mezcla con la población local y, con suerte, planea las próximas generaciones de guerreros.#!"
 building_kinfolk_meeting_grounds_01: "Pequeño terreno de reunión de la Parentela"
 building_kinfolk_meeting_grounds_01_desc: "Una pequeña zona dedicada a la [GetTrait('kinfolk').GetName(GetNullCharacter)] cercana. No tiene mucho de especial, pero es su hogar de todos modos."
 building_kinfolk_meeting_grounds_02: "Terreno de reunión de la Parentela mediano"
 building_kinfolk_meeting_grounds_02_desc: "Donde la [GetTrait('kinfolk').GetName(GetNullCharacter)] interactúa entre sí y con su entorno, viviendo sus vidas cuando no responden al llamado de la tribu."
 building_kinfolk_meeting_grounds_03: "Gran terreno de reunión de la Parentela"
 building_kinfolk_meeting_grounds_03_desc: "La [GetTrait('kinfolk').GetName(GetNullCharacter)] es abundante aquí y está bien alojada. Incluso hay espacio para la próxima generación."

 building_type_kinfolk_healers_01: "Sanadores de la Parentela"
 building_type_kinfolk_healers_01_desc: "#F Medicina herbal y antiguas habilidades secretas, transmitidas de una generación de [GetTrait('kinfolk').GetName(GetNullCharacter)] a otra.#!"
 building_kinfolk_healers_01: "Aprendices de sanadores de la Parentela"
 building_kinfolk_healers_01_desc: "Al haber comenzado apenas su Viaje, estos sanadores aún son valorados por la tribu."
 building_kinfolk_healers_02: "Sanadores de la Parentela"
 building_kinfolk_healers_02_desc: "La tribu sabe a dónde mirar cuando se debe encontrar un remedio para las enfermedades más improbables."
 building_kinfolk_healers_03: "Sanadores de la Parentela expertos"
 building_kinfolk_healers_03_desc: "Los guerreros de la tribu se lanzan a la refriega sin temor, sabiendo muy bien que serán salvados de la muerte por estos benditos individuos."

 building_type_kinfolk_militia_01: "Milicia de parientes"
 building_type_kinfolk_militia_01_desc: "#F En tiempos de necesidad, cada hombre, mujer y niño debe estar listo para proteger sus hogares.#!"
 building_kinfolk_militia_01: "Pequeña milicia de la Parentela"
 building_kinfolk_militia_01_desc: "No hay realmente suficientes miembros como para asustar a un oponente decidido, pero es mejor que nada."
 building_kinfolk_militia_02: "Milicia de la Parentela mediana"
 building_kinfolk_militia_02_desc: "Un número de guerreros lo suficientemente bueno, listos para marchar y defender su hogar."
 building_kinfolk_militia_03: "Gran milicia de la Parentela"
 building_kinfolk_militia_03_desc: "La tribu no podría pedir un grupo de guerreros decididos más fuerte que les cubra las espaldas en tiempos de necesidad."

 building_type_kinfolk_markets_01: "Mercados de la Parentela"
 building_type_kinfolk_markets_01_desc: "#F Donde los miembros de tu tribu extendida se reúnen para permutar y regatear lo que la tribu necesita.#!"
 building_kinfolk_markets_01: "Pequeños mercados de la Parentela"
 building_kinfolk_markets_01_desc: "Un lugar informal donde [GetTrait('kinfolk').GetName(GetNullCharacter)] se reúne para permutar entre ellos."
 building_kinfolk_markets_02: "Mercados de la Parentela medianos"
 building_kinfolk_markets_02_desc: "Se ha permitido que parte de la población local venga aquí, para comerciar con la [GetTrait('kinfolk').GetName(GetNullCharacter)] de la tribu."
 building_kinfolk_markets_03: "Grandes mercados de la Parentela"
 building_kinfolk_markets_03_desc: "Para molestia de algunos de los miembros más Tradicionalistas de la tribu, tu [GetTrait('kinfolk').GetName(GetNullCharacter)] es ahora una parte integral del comercio local."

 building_type_kinfolk_bonfire_01: "Hoguera de la Parentela"
 building_type_kinfolk_bonfire_01_desc: "#F Donde las historias de las grandes hazañas de tus antepasados se comparten con la siguiente Generación.#!"
 building_kinfolk_bonfire_01: "Pequeña hoguera de la Parentela"
 building_kinfolk_bonfire_01_desc: "El arte de contar historias es un arte, y los artistas dotados son raros en tu tribu hasta ahora."
 building_kinfolk_bonfire_02: "Hoguera de la Parentela mediana"
 building_kinfolk_bonfire_02_desc: "Aquí se cuentan Leyendas de antaño, con la esperanza de inspirar las Leyendas del mañana."
 building_kinfolk_bonfire_03: "Gran hoguera de la Parentela"
 building_kinfolk_bonfire_03_desc: "Los jóvenes se reúnen para escuchar, los viejos se reúnen para recordar. La tribu se une."



 #####General Fera

 building_type_spiritual_sanctuary_01: "Santuario espiritual"
 building_type_spiritual_sanctuary_01_desc: "#F El Equilibrio está abandonando lentamente este mundo debido al Frenesí de la $glossary_triat$. Aun así, algunas zonas perduran, a menudo protegidas por aquellos con dones espirituales. #!"
 building_spiritual_sanctuary_01: "Pequeño santuario espiritual"
 building_spiritual_sanctuary_01_desc: "Una pequeña pero simbólica declaración de desafío del moribundo Equilibrio de este mundo."
 building_spiritual_sanctuary_02: "Santuario espiritual"
 building_spiritual_sanctuary_02_desc: "Crecimiento y decadencia, vida y muerte, el ciclo sigue su curso natural aquí."
 building_spiritual_sanctuary_03: "Gran santuario espiritual"
 building_spiritual_sanctuary_03_desc: "Perfectamente equilibrado, como deben ser todas las cosas."


 building_type_wyld_overgrowth_01: "Sobrecrecimiento de $glossary_wyld$"
 building_type_wyld_overgrowth_01_desc: "#F Atormentada por la $glossary_weaver$ y atacada por el $glossary_wyrm$, la Madre Naturaleza se venga en este lugar.#!"
 building_wyld_overgrowth_01: "Pequeño sobrecrecimiento de $glossary_wyld$"
 building_wyld_overgrowth_01_desc: "Un pequeño afloramiento de naturaleza indómita, palpitante y ansiosa por prosperar.$POD_fera_requirements_development_below_t1$"
 building_wyld_overgrowth_02: "Sobrecrecimiento de $glossary_wyld$"
 building_wyld_overgrowth_02_desc: "Un faro de vida desenfrenada y salvaje, que prospera y crece a un ritmo constante.$POD_fera_requirements_development_below_t2$"
 building_wyld_overgrowth_03: "Gran sobrecrecimiento del $glossary_wyld$"
 building_wyld_overgrowth_03_desc: "En este duelo entre el hombre y el Salvaje, el Salvaje siempre gana aquí.$POD_fera_requirements_development_below_t3$"


 building_type_weaver_domain_01: "Dominio de la $glossary_weaver$"
 building_type_weaver_domain_01_desc: "#F Las torres se alzan, la humanidad se multiplica, las ciudades crecen... la marcha del tiempo será la marcha triunfal de la Tejedora. #!"
 building_weaver_domain_01: "Pequeño dominio de la $glossary_weaver$"
 building_weaver_domain_01_desc: "Una idea, un destello de inspiración o una fuerza de voluntad; esas pequeñas cosas pueden iniciar el triunfo de la Tejedora.\n\n$POD_requirements_development_10$"
 building_weaver_domain_02: "Dominio de la $glossary_weaver$"
 building_weaver_domain_02_desc: "Inventores, herramientas y comercio; el sonido del futuro se puede escuchar aquí.\n\n$POD_requirements_development_25$"
 building_weaver_domain_03: "Gran dominio de la $glossary_weaver$"
 building_weaver_domain_03_desc: "Aquí es donde la naturaleza se domestica y se progresa sin que ninguna preocupación mezquina lo impida.\n\n$POD_requirements_development_50$"


 building_type_wyrm_taint_01: "Mancha del $glossary_wyrm$"
 building_type_wyrm_taint_01_desc: "#F La Entropía y la decadencia son parte natural del ciclo. Pero, al final, aspiran a devorarlo todo.#!"
 building_wyrm_taint_01: "Mancha menor"
 building_wyrm_taint_01_desc: "Tierra dañada, maldita o estéril; el inicio de la victoria del $glossary_wyrm$ y la derrota de la Creación."
 building_wyrm_taint_02: "Contaminación grave"
 building_wyrm_taint_02_desc: "La muerte acecha en las sombras de la vida. Aquí, se esconde por completo."
 building_wyrm_taint_03: "Plaga del $glossary_wyrm$"
 building_wyrm_taint_03_desc: "Aquí es donde la esperanza va a morir, devorada por el hambre interminable de la entropía primordial."


 #####Duchy Buildings
 building_type_caern_rage_01: "Túmulo de Furia"
 building_type_caern_rage_01_desc: "#F Un Túmulo dedicado a la búsqueda de la guerra, donde hombres lobo y parentela están constantemente atentos a nuevas y dignas batallas que librar.#!"
 building_caern_rage_01: "Túmulo de Furia en auge"
 building_caern_rage_01_desc: "Un Túmulo en crecimiento con combatientes hábiles, aunque pocos."
 building_caern_rage_02: "Pequeño Túmulo de Furia"
 building_caern_rage_02_desc: "Un pequeño Túmulo de Furia, donde el sonido del entrenamiento se escucha día tras día.$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_rage_03: "Túmulo de Furia medio"
 building_caern_rage_03_desc: "Espíritus de guerra y dolor han anidado en este Túmulo, prestando su considerable pericia a los hombres lobo de aquí.$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_rage_04: "Gran Túmulo de Furia"
 building_caern_rage_04_desc: "Bajo la guía de sus Antiguos, una nueva Generación de guerreros nacerá aquí.$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_rage_05: "Túmulo de Furia masivo"
 building_caern_rage_05_desc: "Uno de los Túmulos más impresionantes de la zona, donde la guerra es un arte y la batalla una mercancía que se busca.$POD_fera_requirements_development_below_t5_ducal$"

 building_type_caern_leadership_01: "Túmulo de Liderazgo"
 building_type_caern_leadership_01_desc: "#F Un Túmulo dedicado a la unidad de la tribu, atrayendo hacia sí a muchas jaurías de diversos orígenes.#!"
 building_caern_leadership_01: "Túmulo de Liderazgo en auge"
 building_caern_leadership_01_desc: "Un líder fuerte podría nacer aquí, pero el lugar es aún demasiado pequeño para tales ambiciones."
 building_caern_leadership_02: "Pequeño Túmulo de Liderazgo"
 building_caern_leadership_02_desc: "Recordar a tus inferiores sus deberes es una tarea que nunca debe dejarse de lado.$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_leadership_03: "Túmulo de Liderazgo medio"
 building_caern_leadership_03_desc: "Una jauría es tan fuerte como su Alfa. Un Túmulo es tan fuerte como su Rey.$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_leadership_04: "Gran Túmulo de Liderazgo"
 building_caern_leadership_04_desc: "Si se pueden adquirir talentos de liderazgo, este es el lugar para buscarlos.$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_leadership_05: "Túmulo de Liderazgo masivo"
 building_caern_leadership_05_desc: "Cuando todos conocen su deber, la tribu prospera bajo un liderazgo sabio y fuerte.$POD_fera_requirements_development_below_t5_ducal$"

 building_type_caern_will_01: "Túmulo de Voluntad"
 building_type_caern_will_01_desc: "#F Un Túmulo dedicado a la mejora de la tribu, mediante medios mundanos o de otro tipo.#!"
 building_caern_will_01: "Túmulo de Voluntad en auge"
 building_caern_will_01_desc: "Un lugar donde los hombres lobo intentan comprender su papel en el mundo actual."
 building_caern_will_02: "Pequeño Túmulo de Voluntad"
 building_caern_will_02_desc: "El comercio tentativo con las comunidades vecinas está aliviando el precario aislamiento del Túmulo.$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_will_03: "Túmulo de Voluntad medio"
 building_caern_will_03_desc: "Un Espíritu Ancestral ha bendecido este Túmulo, aportando valiosas lecciones sobre el pasado y el futuro.$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_will_04: "Gran Túmulo de Voluntad"
 building_caern_will_04_desc: "Un elemental de la tierra protege este Túmulo, complacido con la resolución estoica de sus habitantes.$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_will_05: "Túmulo de Voluntad masivo"
 building_caern_will_05_desc: "Sutilmente integrado en su entorno, este Túmulo impone el respeto, y el tributo, de toda la región.$POD_fera_requirements_development_below_t5_ducal$"

 building_type_caern_enigmas_01: "Túmulo de Enigmas"
 building_type_caern_enigmas_01_desc: "#F Un Túmulo dedicado a las artes más sutiles de los Garou, a menudo favorecido por los astutos Señores de la Sombra.#!"
 building_caern_enigmas_01: "Túmulo de Enigmas en auge"
 building_caern_enigmas_01_desc: "Aquí abundan los trucos y las ilusiones, haciendo que los cachorros aprendan con el ejemplo el valor de un enfoque más sutil."
 building_caern_enigmas_02: "Pequeño Túmulo de Enigmas"
 building_caern_enigmas_02_desc: "Los Antiguos de este Túmulo conocen algunos enigmas que pueden dejarte reflexionando sobre la respuesta durante semanas. Si es que existe alguna respuesta.$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_enigmas_03: "Túmulo de Enigmas medio"
 building_caern_enigmas_03_desc: "Un espíritu Quimerlino ha bendecido este Túmulo, complacido de ver la astucia en acción aquí.$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_enigmas_04: "Gran Túmulo de Enigmas"
 building_caern_enigmas_04_desc: "Las sombras ofuscan este Túmulo, resultado de espíritus amistosos que se congregan para defender y observar a sus astutos habitantes.$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_enigmas_05: "Túmulo de Enigmas masivo"
 building_caern_enigmas_05_desc: "Aquí se urden intrigas que podrían dejar incluso aturdido a un vampiro, desafiando la reputación de los hombres lobo como brutos sin mente.$POD_fera_requirements_development_below_t5_ducal$"

 building_type_caern_wisdom_01: "Túmulo de Sabiduría"
 building_type_caern_wisdom_01_desc: "#F Un Túmulo pacífico en un mundo asolado por la guerra, un oasis muy útil para los hombres lobo espiritualmente debilitados.#!"
 building_caern_wisdom_01: "Túmulo de Sabiduría en auge"
 building_caern_wisdom_01_desc: "Aquí se ofrece descanso para el alma y el cuerpo. Un raro acto de compasión en un mundo implacable."
 building_caern_wisdom_02: "Pequeño Túmulo de Sabiduría"
 building_caern_wisdom_02_desc: "Las enseñanzas de este Túmulo son reconocidas como sabias y dignas de consideración en toda la región.$POD_fera_requirements_development_below_t2_ducal$"
 building_caern_wisdom_03: "Túmulo de Sabiduría medio"
 building_caern_wisdom_03_desc: "Un sagaz espíritu Búho ha hecho de este Túmulo su hogar, observando enigmáticamente a sus habitantes desde lo alto.$POD_fera_requirements_development_below_t3_ducal$"
 building_caern_wisdom_04: "Gran Túmulo de Sabiduría"
 building_caern_wisdom_04_desc: "Enseñanzas, debates, curación... aquí se pueden encontrar toda clase de ayuda espiritual.$POD_fera_requirements_development_below_t4_ducal$"
 building_caern_wisdom_05: "Túmulo de Sabiduría masivo"
 building_caern_wisdom_05_desc: "Con un Túmulo de Sabiduría tan próspero, es de esperar que errores como la Guerra de la Rabia puedan evitarse en el futuro.$POD_fera_requirements_development_below_t5_ducal$"



 building_type_mokole_wallow_01: "Cenagal"
 building_type_mokole_wallow_01_desc: "Cenagal es un término utilizado por los Mokolé para describir un hogar para ellos mismos y otros crocodilianos o reptiles."
 building_mokole_wallow_01: "Cenagal en auge"
 building_mokole_wallow_01_desc: "Los Mokolé viven vidas mucho más humildes de lo que lo hacían hace milenios. Pero el hogar sigue siendo el hogar."
 building_mokole_wallow_02: "Cenagal pequeño"
 building_mokole_wallow_02_desc: "Un lugar donde los lagartos y la Parentela viven en armonía, lejos de las miradas indiscretas del resto del mundo.$POD_fera_requirements_development_below_t2_ducal$"
 building_mokole_wallow_03: "Cenagal mediano"
 building_mokole_wallow_03_desc: "Templos en ruinas dedicados a dioses olvidados en la India y a lo largo del Nilo, comunidades pesqueras de la Ribera en China, pantanos y marismas aislados; cualquiera de ellos tiene el potencial de convertirse en un poderoso Cenagal para una comunidad Mokolé.$POD_fera_requirements_development_below_t3_ducal$"
 building_mokole_wallow_04: "Cenagal grande"
 building_mokole_wallow_04_desc: "Un verdadero templo para los Reyes Lagarto, oculto de la vista de las llamadas civilizaciones de mortales.$POD_fera_requirements_development_below_t4_ducal$"
 building_mokole_wallow_05: "Cenagal masivo"
 building_mokole_wallow_05_desc: "Los sueños de los Mokolé les hablan de eras pasadas de supremacía saurios donde sus ancestros vivían en un lujo herpetológico. Este Cenagal es, por tanto, un sueño hecho realidad.$POD_fera_requirements_development_below_t5_ducal$"


 ####Werewolves
 building_type_werewolf_hunting_party_01: "Grupo de caza de hombres lobo"
 building_type_werewolf_hunting_party_01_desc: "#F Siempre hay algunos humanos intentando invadir vuestras tierras. Y siempre hay cachorros ansiosos listos para reclamar una gloria fácil.#!"
 building_werewolf_hunting_party_01: "Grupo de caza de hombres lobo pequeño"
 building_werewolf_hunting_party_01_desc: "Una patrulla sencilla que elimina las incursiones más flagrantes de los humanos en vuestras tierras."
 building_werewolf_hunting_party_02: "Grupo de caza de hombres lobo mediano"
 building_werewolf_hunting_party_02_desc: "Los ansiosos cachorros de la tribu perfeccionan sus habilidades con los imprudentes humanos que merodean cerca de vuestro clan.$POD_fera_requirements_development_below_t2$"
 building_werewolf_hunting_party_03: "Grupo de caza de hombres lobo grande"
 building_werewolf_hunting_party_03_desc: "Los humanos temen a los lobos por una buena razón. No permitiréis que su llamada «civilización» se extienda sin control por aquí.$POD_fera_requirements_development_below_t3$"

 building_type_werewolf_scouting_party_01: "Grupo de exploración de hombres lobo"
 building_type_werewolf_scouting_party_01_desc: "#F Los cachorros pasan por su Primer Cambio constantemente y es necesario encontrarlos. Esa es la tarea de estos experimentados registros.#!"
 building_werewolf_scouting_party_01: "Grupo de exploración de hombres lobo pequeño"
 building_werewolf_scouting_party_01_desc: "Uno o dos registros experimentados, apenas lo suficiente para cubrir las aldeas circundantes."
 building_werewolf_scouting_party_02: "Grupo de exploración de hombres lobo mediano"
 building_werewolf_scouting_party_02_desc: "Esta manada de experimentados registros cubre un área amplia, buscando cachorros a los que ayudar durante su Primer Cambio.$POD_fera_requirements_development_below_t2$"
 building_werewolf_scouting_party_03: "Grupo de exploración de hombres lobo grande"
 building_werewolf_scouting_party_03_desc: "Gracias a vuestros numerosos grupos de exploración, muy pocos cachorros escapan a vuestra mirada en esta zona. Su rescate hace que la tribu crezca constantemente.$POD_fera_requirements_development_below_t3$"

 building_type_werewolf_training_grounds_01: "Campos de entrenamiento de hombres lobo"
 building_type_werewolf_training_grounds_01_desc: "#F La Parentela debe ser entrenada si va a ser útil para el clan.#!"
 building_werewolf_training_grounds_01: "Campos de entrenamiento de hombres lobo pequeños"
 building_werewolf_training_grounds_01_desc: "Aquí la Parentela aprende los conceptos básicos del combate. Lo suficiente para saber dónde está la punta afilada."
 building_werewolf_training_grounds_02: "Campos de entrenamiento de hombres lobo medianos"
 building_werewolf_training_grounds_02_desc: "Nunca serán tan temibles como un hombre lobo. Pero se esfuerzan al máximo.$POD_fera_requirements_development_below_t2$"
 building_werewolf_training_grounds_03: "Campos de entrenamiento de hombres lobo grandes"
 building_werewolf_training_grounds_03_desc: "No muchos comprenden verdaderamente la guerra. Pero gracias a vuestros incomparables instructores, vuestra [GetTrait('kinfolk').GetName(GetNullCharacter)] pronto lo hará.$POD_fera_requirements_development_below_t3$"

 building_type_werewolf_warden_01: "Guardián de hombres lobo"
 building_type_werewolf_warden_01_desc: "#F La [GetTrait('kinfolk').GetName(GetNullCharacter)] es crucial para el futuro de la tribu. Su seguridad es más importante que sus libertades.#!"
 building_werewolf_warden_01: "Guardián de hombres lobo permisivo"
 building_werewolf_warden_01_desc: "Un guardián amable y gregario no es el mejor protector, pero es un comienzo."
 building_werewolf_warden_02: "Guardián de hombres lobo severo"
 building_werewolf_warden_02_desc: "Un Antiguo rudo y a veces tosco que se asegura de mantener a raya a la insensata [GetTrait('kinfolk').GetName(GetNullCharacter)].$POD_fera_requirements_development_below_t2$"
 building_werewolf_warden_03: "Guardián de hombres lobo implacable"
 building_werewolf_warden_03_desc: "No pueden mover un dedo sin que él se entere.$POD_fera_requirements_development_below_t3$"

 building_type_werewolf_raiding_party_01: "Grupo de incursión de hombres lobo"
 building_type_werewolf_raiding_party_01_desc: "#F Los hombres lobo son temidos por una razón. Esa razón son sus ataques impredecibles y mortales contra cualquier enemigo percibido.#!"
 building_werewolf_raiding_party_01: "Pequeño grupo de incursión de hombres lobo"
 building_werewolf_raiding_party_01_desc: "Un pequeño grupo de combatientes experimentados, lo suficiente como para que los alrededores teman a los lobos acechantes."
 building_werewolf_raiding_party_02: "Grupo de incursión de hombres lobo mediano"
 building_werewolf_raiding_party_02_desc: "Varias manadas merodean por el campo, atacando a cualquier grupo amenazante antes de que pueda organizarse.$POD_fera_requirements_development_below_t2$"
 building_werewolf_raiding_party_03: "Gran grupo de incursión de hombres lobo"
 building_werewolf_raiding_party_03_desc: "Teme a los lobos que aúllan en la noche. Reza para que no vengan a por ti, y entonces date cuenta de lo fútil que fue ese acto.$POD_fera_requirements_development_below_t3$"

 building_type_amazon_camp_01: "Campamento amazónico"
 building_type_amazon_camp_01_desc: "#F Las hijas más jóvenes de la tribu quieren demostrar su valía con sangre y furia.#!"
 building_amazon_camp_01: "Pequeño campamento amazónico"
 building_amazon_camp_01_desc: "Las mujeres guerreras de Gaia son un espectáculo terrible de contemplar, claramente la ira de la propia Madre."
 building_amazon_camp_02: "Campamento amazónico"
 building_amazon_camp_02_desc: "$building_amazon_camp_01_desc$$POD_fera_requirements_development_below_t2$"
 building_amazon_camp_03: "Gran campamento amazónico"
 building_amazon_camp_03_desc: "$building_amazon_camp_01_desc$$POD_fera_requirements_development_below_t3$"

 building_type_scavengers_01: "Carroñeros"
