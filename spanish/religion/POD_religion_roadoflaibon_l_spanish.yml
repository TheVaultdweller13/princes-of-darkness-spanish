 # Fe de grupo Laibon
 laibon: "Way of Heaven and Earth"
 laibon_adj: "Heaven-and-Earth"
 laibon_adherent: "Walker of Heaven and Earth"
 laibon_adherent_plural: "Walkers of Heaven and Earth"
 laibon_desc: "El Camino del Cielo y la Tierra es la práctica espiritual central de los Laibon, que equilibra las fuerzas gemelas de Orun y Aye: el cielo divino y el mundo material. Sus adeptos buscan la armonía entre el ansia espiritual de la Bestia y las obligaciones del mundo de los vivos, y recorren una estrecha senda entre la trascendencia y la condenación. Perder ese equilibrio es caer en las garras de uno u otro polo: la disolución en una divinidad distante o el descenso a una monstruosidad voraz."
 laibon_nyayo: "Nyayo"
 laibon_nyayo_adj: "Nyayo"
 laibon_nyayo_adherent: "Nyayo"
 laibon_nyayo_adherent_plural: "Nyayo"
 laibon_nyayo_desc: "Los Nyayo, quienes siguen las huellas de los ancestros, son Laibon que insisten en que los dominios del Reino de Ébano deben gobernarse según sus propios términos. La cooperación es posible. La sumisión, no."
 laibon_luo: "Luo"
 laibon_luo_adj: "Luo"
 laibon_luo_adherent: "Luo"
 laibon_luo_adherent_plural: "Luo"
 laibon_luo_desc: "Donde los Nyayo aconsejan vigilancia, los Luo exigen guerra. Cada punto de apoyo de los Cainitas en África es un acto de colonización. La suya es una fe de reconquista mediante la violencia."
 laibon_daughters_of_arawelo: "Hijas de Arawelo"
 laibon_daughters_of_arawelo_adj: "Arawelano"
 laibon_daughters_of_arawelo_adherent: "Hija de Arawelo"
 laibon_daughters_of_arawelo_adherent_plural: "Hijas de Arawelo"
 laibon_daughters_of_arawelo_desc: "Arawelo fue una reina que aplastó a todo hombre que se le opuso. Las Hijas la veneran como prueba de que la identidad se forja, no se recibe: la fuerza, la astucia y la ambición despiadada son los únicos derechos de nacimiento que importan."
 laibon_birds_of_huur: "Aves de Huur"
 laibon_birds_of_huur_adj: "Huuriano"
 laibon_birds_of_huur_adherent: "Kinyonyi"
 laibon_birds_of_huur_adherent_plural: "Kinyonyi"
 laibon_birds_of_huur_desc: "Huur es el mensajero de la Muerte, y sus hombres pájaro siguen una filosofía de la paradoja filtrada por la cosmología africana. Para los Kinyonyi, vagar es adorar, y el propio viaje es el único destino honesto."
 laibon_appeasers_of_eebo: "Aplacadores de Eebo"
 laibon_appeasers_of_eebo_adj: "Eeboíta"
 laibon_appeasers_of_eebo_adherent: "Aplacador de Eebo"
 laibon_appeasers_of_eebo_adherent_plural: "Aplacadores de Eebo"
 laibon_appeasers_of_eebo_desc: "Eebo es el dios del cielo, que empuña el sol como su ojo ardiente. Muy en sintonía con Orun, los Aplacadores se esfuerzan por trascender por completo su naturaleza monstruosa."
 laibon_nidars_punishers: "Castigadores de Nidar"
 laibon_nidars_punishers_adj: "Nidariano"
 laibon_nidars_punishers_adherent: "Castigador de Nidar"
 laibon_nidars_punishers_adherent_plural: "Castigadores de Nidar"
 laibon_nidars_punishers_desc: "Esta orden de sepultureros y asesinos se ha consagrado a destruir a los Magaji que abusan de su poder. Profundamente en sintonía con Aye, creen que la justicia pertenece al mundo material."
 laibon_children_of_sarapion: "Hijos de Sarapion"
 laibon_children_of_sarapion_adj: "Sarapiónico"
 laibon_children_of_sarapion_adherent: "Hijo de Sarapion"
 laibon_children_of_sarapion_adherent_plural: "Hijos de Sarapion"
 laibon_children_of_sarapion_desc: "Sarapion es antiguo más allá de toda medida. Los Hijos no reconocen falsos dioses y derriban a toda criatura que se vuelve demasiado poderosa, pues nadie puede rivalizar en gloria con Sarapion."
 laibon_asiman: "Asiman"
 laibon_asiman_adj: "Asiman"
 laibon_asiman_adherent: "Asiman"
 laibon_asiman_adherent_plural: "Asiman"
 laibon_asiman_desc: "Los Asiman son los Rectos. Laibon que rechazan la autoridad tanto de los ancianos como de los Magaji, y sostienen que ningún vampiro tiene derecho a gobernar a otro solo por su edad o su sangre."
 laibon_tariq_alsama_walard: "Tariq alsama' Wal'ard"
 laibon_tariq_alsama_walard_adj: "Tariq alsama'"
 laibon_tariq_alsama_walard_adherent: "Seguidor del Tariq"
 laibon_tariq_alsama_walard_adherent_plural: "Seguidores del Tariq"
 laibon_tariq_alsama_walard_desc: "Tariq alsama' Wal'ard representa un sincretismo entre el islam Ashirra y la tradición espiritual Laibon. La identidad africana y la devoción islámica no son lealtades rivales, sino una única verdad unificada."
 laibon_path_of_terror: "Camino del Terror"
 laibon_path_of_terror_adj: "Nacido del Terror"
 laibon_path_of_terror_adherent: "Mercader del Terror"
 laibon_path_of_terror_adherent_plural: "Mercaderes del Terror"
 laibon_path_of_terror_desc: "El Camino del Terror hunde sus raíces en el miedo primordial. Para llegar a ser algo más grande, primero hay que convertirse en algo terrible."
 laibon_flowers_of_indulgence: "Flores de la Indulgencia"
 laibon_flowers_of_indulgence_adj: "Indulgente"
 laibon_flowers_of_indulgence_adherent: "Flor de la Indulgencia"
 laibon_flowers_of_indulgence_adherent_plural: "Flores de la Indulgencia"
 laibon_flowers_of_indulgence_desc: "El hedonismo es la máscara, no el rostro. Bajo la indulgencia se oculta una red de intrigas maquiavélicas. El vino siempre es dulce. El precio siempre se paga después."
