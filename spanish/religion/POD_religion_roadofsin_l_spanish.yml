  holy_order_cult_of_augurs: "Culto de los Augures"
  holy_order_order_of_vaticinators: "Orden de los Vaticinadores"
  holy_order_ancient_order_of_druids: "Antigua Orden de los Druidas"
  holy_order_order_of_morrigan: "Orden de la Morrigan"
  holy_order_order_of_tartaros: "Orden del Tártaro"
 
  deimosianism: "Deimosianismo"
  deimosianism_adj: "Deimosianismo"
  deimosianism_adherent: "Deimosiano"
  deimosianism_adherent_plural: "Deimosianos"
  deimosianism_desc: "Los vampiros son la encarnación de los miedos primordiales de la humanidad. Por ello, deben deleitarse en su condición. Quizá la humanidad sea algún día lo bastante fuerte para vencer sus miedos. Hasta entonces, los deimosianos corren libres."
  
  servitorsofirad: "Servidores de Irad"
  servitorsofirad_adj: "Servidor"
  servitorsofirad_adherent: "Servidor"
  servitorsofirad_adherent_plural: "Servidores"
  servitorsofirad_desc: "Autoproclamados esbirros de los Antediluvianos, los Servidores de Irad no buscan más que guerra y derramamiento de sangre sin fin. El planeta quedará empapado en sangre, y ellos estarán siempre en primera línea."
  
  baobhansith: "Baobhan Sith"
  baobhansith_adj: "Baobhan Sith"
  baobhansith_adherent: "Baobhan Sith"
  baobhansith_adherent_plural: "Baobhan Sith"
  baobhansith_desc: "Esta religión no canónica ha sido encargada por un mecenas.\n\nLas Baobhan Sith abrazan el legado de su fundadora, Aisling Leanhaun, cuyas primeras alimentaciones inspiraron la leyenda de las Baobhan Sith en las Tierras Altas de Escocia. Fascinados por el mito de los vampiros hada seductores y asesinos, los seguidores encajan en ese molde para mantener viva la leyenda." 
  holy_order_host_of_the_broken_heart: "Hueste del Corazón Roto"
  holy_order_host_of_the_unseelie: "Hueste de los Unseelie"
  
  pathoftevoro: "Senda de Tevoro"
  pathoftevoro_adj: "Tevoro"
  pathoftevoro_adherent: "Timoniano"
  pathoftevoro_adherent_plural: "Timonianos"
  pathoftevoro_desc: "Esta religión no canónica ha sido encargada por un Mecenas.\n\nLa Senda de Tevoro es un camino hacia muchas habilidades y conocimientos que algunos consideran antinaturales. Tevoro es la culminación definitiva de la experiencia de Adrahasis. Los timonianos predican la búsqueda del conocimiento: de todo conocimiento." 
  
  bloodtribe: "Tribu de Sangre"
  bloodtribe_adj: "Tribu de Sangre"
  bloodtribe_adherent: "Anarquista"
  bloodtribe_adherent_plural: "Anarquistas"
  bloodtribe_desc: "Defendida primero por Miyako, la Fundadora de la Línea de Sangre Bushi, la Tribu de Sangre es una hermandad ferozmente devota unida contra las estructuras opresivas del Mundo de la Noche. Eligiendo a menudo la muerte antes que la captura y siguiendo un estricto código interno de conducta al trabajar entre sí, las Tribus de Sangre se parecen en muchos aspectos a los Furores del Oeste, aunque mucho más organizadas que sus compatriotas sin Tradiciones." 
