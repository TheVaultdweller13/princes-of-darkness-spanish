 special_doctrine_fae_militants_hostility_name: "Facción Militante"
 special_doctrine_fae_militants_hostility_desc: "Los militantes desean descartar la Tregua Jurada y renovar la Guerra de las Estaciones"
 special_doctrine_fae_trucebearers_hostility_name: "Facción Portadora de la Tregua"
 special_doctrine_fae_trucebearers_hostility_desc: "Los Portadores de la Tregua esperan mantener la Tregua Jurada y que las Cortes Estacionales gobiernen por turnos."
 special_doctrine_fae_humanists_hostility_name: "Facción Humanista"
 special_doctrine_fae_humanists_hostility_desc: "Los Humanistas están obsesionados con la humanidad, ya sea para amarla o para controlarla."
 special_doctrine_fae_constantinians_hostility_name: "Facción Constantiniana"
 special_doctrine_fae_constantinians_hostility_desc: "Sobrecogidos por el creciente poder de la Iglesia, los Constantinianos intentan hacerse un lugar dentro de ella."
