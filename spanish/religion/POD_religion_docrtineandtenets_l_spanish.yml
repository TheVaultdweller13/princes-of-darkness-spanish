 doctrine_fae_morality_name: "Moralidad de las Hadas"
 doctrine_fae_morality_seelie_name: "Seelie"
 doctrine_fae_morality_unseelie_name: "Unseelie"
 doctrine_fae_morality_seelie_desc: "Aunque a menudo caracterizada por foráneos e incluso por kithain inexpertos como la corte "buena", la Corte Seelie en realidad se define por las virtudes del honor y el amor. Aunque esto pueda parecer encajar con nociones de "bondad", la caballerosidad puede entrar en conflicto con la moral del mundo moderno, y la idea feérica del amor cortés a veces se aleja mucho de la realidad que enfrentan los mortales. En muchos sentidos, el Código Seelie está enraizado en tradiciones marciales.\n\nAntes de la [Glossary('Fractura','game_concept_shattering_desc')], las Cortes Seelie gobernaban desde Beltane hasta Samhain, a través de la Primavera y el Verano. El Código Seelie es: muerte antes que deshonra, el amor todo lo vence, la belleza es vida y nunca olvides una deuda"
 doctrine_fae_morality_unseelie_desc: "Muchas hadas Seelie ven a la Corte Unseelie como de algún modo malvada, pero esta descripción es demasiado simplista. Los Unseelie abrazan el cambio y desdeñan la tradición, sin ver ningún vínculo especial con su pasado ni, de hecho, con el [UmbraGlossary('dreaming')], que parece hacerse cada vez más distante. La forma de ser Unseelie es apasionada y pragmática, satisfaciendo tanto el deseo como la necesidad; los Unseelie no se niegan nada a sí mismos.\n\nAntes de la [Glossary('Fractura','game_concept_shattering_desc')], las Cortes Unseelie gobernaban desde Samhain hasta Beltane, a través del Otoño y el Invierno. El Código Unseelie es: el cambio es bueno, el glamour es libre, el honor es una mentira y la pasión antes que el deber."
