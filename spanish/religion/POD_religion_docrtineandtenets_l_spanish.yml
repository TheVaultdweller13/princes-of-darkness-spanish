 doctrine_lycanthropy_name: "Licantropía"
 doctrine_lycanthropy_crime_name: "Criminal"
 doctrine_lycanthropy_crime_desc: "Los Lupinos deben ser destruidos.\n\nDe las Bestias de la Luna\n\nLas Bestias de la Luna, los que cambian, son las más antiguas de todas; antes que mi padre ya vagaban por las tierras. No te demores en su camino, evítalos, se lanzan sobre nosotros como lobos en el redil. Pues somos de una clase, y ellos de otra. Cuídate de su tierra sagrada, camina con cautela por su territorio salvaje. Su mordisco es como nuestro mordisco, sus garras son como nuestras garras; no te demores en su camino, ellos son de una clase, y nosotros de otra."
 doctrine_lycanthropy_shunned_name: "Rechazado"
 doctrine_lycanthropy_shunned_desc: "Aunque sobrenaturales como nosotros, los hombres lobo no son como nosotros. En absoluto.\n\nDe las Bestias de la Luna\n\nLas Bestias de la Luna, los que cambian, son las más antiguas de todas; antes que mi padre ya vagaban por las tierras. No te demores en su camino, evítalos, se lanzan sobre nosotros como lobos en el redil. Pues somos de una clase, y ellos de otra. Cuídate de su tierra sagrada, camina con cautela por su territorio salvaje. Su mordisco es como nuestro mordisco, sus garras son como nuestras garras; no te demores en su camino, ellos son de una clase, y nosotros de otra."
