 seasons_time_name: "Tiempo de Estación"
 doctrine_winter_time_name: "Tiempo de Invierno"
 doctrine_winter_time_desc: "El invierno proporciona ventaja a la Corte de Invierno."
 doctrine_spring_time_name: "Tiempo de Primavera"
 doctrine_spring_time_desc: "La primavera proporciona ventaja a la Corte de Primavera."
 doctrine_summer_time_name: "Tiempo de Verano"
 doctrine_summer_time_desc: "El verano proporciona ventaja a la Corte de Verano."
 doctrine_autumn_time_name: "Tiempo de Otoño"
