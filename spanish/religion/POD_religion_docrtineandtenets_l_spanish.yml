l_spanish: 

# Vampire Doctrines

 
 tenet_vengeance_of_lilith_name: "Venganza de Lilith"
 tenet_vengeance_of_lilith_desc: "Los Chiquillos de Caín destruyeron el jardín de Lilith y asesinaron a sus hijos. Solo los Toreador y los Nosferatu se abstuvieron de la destrucción, y cubrieron los rostros de los hijos muertos con velos como muestra de respeto. Por ello, están exentos de la venganza de los seguidores de Lilith."
 
 #A passage in Revelations of the Dark Mother, which describes how (represented allegorically as the thirteen $pod_clan$ Founders) 
 
 doctrine_vampirethemasquerade_name: "Mascarada"
 doctrine_werewolf_veil_name: "El Velo"
 doctrine_vampirethemasquerade_strict_name: "Mascarada Estricta"
 doctrine_werewolf_veil_shall_not_lifted_name: "No Se Alzará"
 doctrine_vampirethemasquerade_strict_desc: "El Silencio de la Sangre se aplica estrictamente. Muchos Vástagos se rebelan contra tan draconiana imposición.\n\nNo hagas amigos entre los Poetas, cantarán demasiado sobre ti.\n\nNo seas conocido. Busca las sombras.\n\nNo dejes que el sacerdote, el poeta o el campesino te vean alimentarte. Ninguno de ellos lo dejará pasar.\n\nCuando la Cruz señale, busca tu seguridad."
 doctrine_vampirethemasquerade_lax_name: "Mascarada Laxa"
 doctrine_werewolf_veil_should_not_lifted_name: "No Debe Levantarse"
 doctrine_vampirethemasquerade_lax_desc: "El cumplimiento del Silencio de la Sangre es laxo. Aunque los Vástagos se esfuerzan por ocultar su existencia, a veces también cometen errores terribles que sus Antiguos no castigan."
 doctrine_werewolf_veil_should_not_lifted_desc: "El Velo es un término poético para la falsa creencia de que lo sobrenatural no existe, que el Delirio refuerza. El Velo se instituyó formalmente mediante el Concordato de hace nueve mil años, que puso fin al Impergium. La Letanía afirma con claridad que «El Velo No Debe Levantarse». El Delirio ayuda a mantener el Velo en pie. Dañar o rasgar el Velo supone una gran pérdida de honor entre los Garou, mientras que repararlo supone lo contrario. En la práctica, el Delirio hace la mayor parte del trabajo y los Garou apenas necesitan preocuparse por ello. Algunas tribus lo ven más como una directriz que como una norma estricta que hacer cumplir." 
 doctrine_vampirethemasquerade_none_name: "Sin Mascarada"
 doctrine_werewolf_veil_should_does_not_matter_name: "No Importa"
 doctrine_vampirethemasquerade_none_desc: "Los vampiros actúan sin preocuparse por el secreto ante el ganado.\nCon este precepto es más difícil reducir tu exposición, pero un mayor Temor reducirá los riesgos de una revuelta provincial de una Célula de Inquisidores."
 doctrine_parameter_harder_masquerade_reduction: "[masquerade_exposure|E] es más difícil de reducir"
 doctrine_parameter_no_masquerade_penalty: "Muchas acciones que tienen posibilidades de #N aumentar#! [masquerade_exposure|E] ahora siempre tendrán éxito"
 
 doctrine_werewolf_veil_should_does_not_matter_desc: "El Velo es un término poético para la falsa creencia de que lo sobrenatural no existe, que el Delirio refuerza. El Velo se instituyó formalmente mediante el Concordato de hace nueve mil años, que puso fin al Impergium. La Letanía afirma con claridad que «El Velo No Debe Levantarse». El Delirio ayuda a mantener el Velo en pie. Dañar o rasgar el Velo supone una gran pérdida de honor entre los Garou, mientras que repararlo supone lo contrario. Algunos hombres lobo consideran que el Velo es una idea obsoleta que ya no importa. Algunos incluso trabajan activamente para derribar el Velo, de modo que los hombres lobo puedan restablecer el Impergium y volver a aterrorizar abiertamente a toda la humanidad."
 doctrine_vampirethemasquerade_consent_name: "Alimentarse Solo de los Dispuestos"
 doctrine_vampirethemasquerade_consent_desc: "Los vampiros, aunque se ocultan de la sociedad en general, deben buscar el consentimiento de sus «donantes»." 
 doctrine_vampirethemasquerade_cult_name: "Culto de Sangre"
 doctrine_vampirethemasquerade_cult_desc: "Los vampiros tienen una sociedad secreta o culto de sangre que los venera en secreto como a un dios de sangre."  
 doctrine_vampirethemasquerade_family_name: "Secreto Familiar"
 doctrine_vampirethemasquerade_family_desc: "Los vampiros se alimentan de familias mortales concretas que pueden ser en cierta medida conscientes de la condición vampírica. Desean mantener su sangre pura y desprecian a los «impuros»."   
 doctrine_parameter_vampirethemasquerade_strict: "Los personajes con los [traits|E] [GetTrait('predatortype_consensualist').GetName( GetPlayer )], [GetTrait('predatortype_cultist').GetName( GetPlayer )] o [GetTrait('predatortype_familias').GetName( GetPlayer )] son [criminals|E]"
 doctrine_parameter_vampirethemasquerade_lax: "Los personajes con los [traits|E] [GetTrait('predatortype_consensualist').GetName( GetPlayer )], [GetTrait('predatortype_cultist').GetName( GetPlayer )] o [GetTrait('predatortype_familias').GetName( GetPlayer )] son [shunned|E]"

 doctrine_parameter_vampirethemasquerade_family: "Los personajes con los [traits|E] [GetTrait('predatortype_alleycat').GetName( GetPlayer )], [GetTrait('predatortype_bedlamite').GetName( GetPlayer )], [GetTrait('predatortype_farmer').GetName( GetPlayer )], [GetTrait('predatortype_footpad').GetName( GetPlayer )] o [GetTrait('predatortype_graverobber').GetName( GetPlayer )] son [shunned|E]. Los personajes con el [trait|E] [GetTrait('predatortype_familias').GetName( GetPlayer )] son plenamente aceptados"
 doctrine_parameter_vampirethemasquerade_cult: "Los personajes con los [traits|E] [GetTrait('predatortype_consensualist').GetName( GetPlayer )] o [GetTrait('predatortype_familias').GetName( GetPlayer )] son [shunned|E]. Los personajes con el [trait|E] [GetTrait('predatortype_cultist').GetName( GetPlayer )] son aceptados." 
 doctrine_parameter_vampirethemasquerade_consent: "Los personajes con el [trait|E] [GetTrait('predatortype_alleycat').GetName( GetPlayer )] son [criminals|E]. Los personajes con los [traits|E] [GetTrait('predatortype_cauchemar').GetName( GetPlayer )] o [GetTrait('predatortype_extortionist').GetName( GetPlayer )] son [shunned|E]. Los personajes con el [trait|E] [GetTrait('predatortype_consensualist').GetName( GetPlayer )] son elogiados. Todos los demás tipos de depredador son aceptados."  
 
# Oaths and Oathbreaking

 doctrine_oathbreaking_name: "Ruptura de Juramentos"
 doctrine_oathbreaking_crime_name: "Criminal"
 doctrine_oathbreaking_crime_desc: "Los juramentos son la base de la ley. Quienes los rompen carecen de honor y sus vidas quedan sentenciadas."
 doctrine_oathbreaking_shunned_name: "Rechazado"
 doctrine_oathbreaking_shunned_desc: "No hay que confiar en quienes rompen juramentos. Cuidado con ellos."
 doctrine_oathbreaking_accepted_name: "Aceptado"
 doctrine_oathbreaking_accepted_desc: "La ruptura de juramentos es aceptada. ¿Quién cree en la palabra de los no-muertos?"
 doctrine_parameter_oathbreaking_illegal: "Los personajes con el [trait|E] [GetTrait('oathbreaker').GetName( GetPlayer )] son [criminals|E]"
 doctrine_parameter_oathbreaking_shunned: "Los personajes con el [trait|E] [GetTrait('oathbreaker').GetName( GetPlayer )] son [shunned|E]"
 doctrine_parameter_oathbreaking_accepted: "Los personajes con el [trait|E] [GetTrait('oathbreaker').GetName( GetPlayer )] son plenamente aceptados"
 
 doctrine_vampirebloodoath_name: "Juramentos de Sangre"
 doctrine_vampirebloodoath_crime_name: "Criminal"
 doctrine_vampirebloodoath_crime_desc: "Estar Vinculado por Sangre es peor que estar esclavizado, porque encadena el corazón y la mente además del cuerpo."
 doctrine_vampirebloodoath_shunned_name: "Rechazado"
 doctrine_vampirebloodoath_shunned_desc: "Los Juramentos de Sangre pueden ser tanta carga para el regente como para el esclavo; elígelos con cuidado, si es que los usas. Recuerda los proverbios. Un sorbo de Sangre, lo tomo. Dos sorbos, lo acepto. Tres sorbos, lo rechazo."
 doctrine_vampirebloodoath_accepted_name: "Aceptado"
 doctrine_vampirebloodoath_accepted_desc: "El Juramento de Sangre es la base de nuestra sociedad. Los juramentos de fidelidad deben reforzarse con algún grado de vasallaje de sangre."
 doctrine_parameter_vampirebloodoath_illegal: "Los personajes con el [trait|E] [GetTrait('unbondable').GetName( GetPlayer )] son plenamente aceptados. Pierden piedad por [Glossary('Vínculo de Sangre','game_concept_bloodbond_desc')]."
 doctrine_parameter_vampirebloodoath_shunned: "Los personajes con el [trait|E] [GetTrait('unbondable').GetName( GetPlayer )] son plenamente aceptados. Pierden piedad por [Glossary('Vínculo de Sangre','game_concept_bloodbond_desc')]."
 doctrine_parameter_vampirebloodoath_accepted: "Los personajes con el [trait|E] [GetTrait('unbondable').GetName( GetPlayer )] son [criminals|E]."

 doctrine_vampireghouling_name: "Vasallaje de [ghoul|E]"
 doctrine_vampireghouling_evil_name: "Mal"
 doctrine_vampireghouling_evil_desc: "No puede haber paz ni negociaciones con los esbirros. Los destruiremos a todos, o moriremos en el intento."
 doctrine_vampireghouling_crime_name: "Criminal"
 doctrine_vampireghouling_crime_desc: "Los Ghouls amenazan el Silencio de la Sangre; no compartas la Sangre con los indignos.\n\nNo te convertirás en un Dios para los Hijos de Set, pues el que está Arriba, celoso en su cielo, aniquilará para siempre el linaje de Caín. Recuerda a la de rostro amable, Ashtareth; recuerda al dorado y rico Baal; recuerda al fuerte Tammuz; sabe que los Hijos de Set se alzarán con armas del que está Arriba y nos conquistarán si nos convertimos en dioses para ellos. Guiarás a los Hijos de Set como un pastor guía a su rebaño, y los seleccionarás cuando sea necesario. Purificarás su sangre y los mantendrás libres de enfermedad."
 doctrine_vampireghouling_shunned_name: "Rechazado"
 doctrine_vampireghouling_shunned_desc: "Somos depredadores, no presas. Compartir tu sangre con el ganado revela tu propia debilidad.\n\nNo te convertirás en un Dios para los Hijos de Set, pues el que está Arriba, celoso en su cielo, aniquilará para siempre el linaje de Caín. Recuerda a la de rostro amable, Ashtareth; recuerda al dorado y rico Baal; recuerda al fuerte Tammuz; sabe que los Hijos de Set se alzarán con armas del que está Arriba y nos conquistarán si nos convertimos en dioses para ellos. Guiarás a los Hijos de Set como un pastor guía a su rebaño, y los seleccionarás cuando sea necesario. Purificarás su sangre y los mantendrás libres de enfermedad."
 doctrine_vampireghouling_accepted_name: "Aceptado"
 doctrine_vampireghouling_accepted_desc: "El lugar del ganado es servirnos, y son mejores vasallos cuando están atados por un Juramento de Sangre.\n\nDe Aquellos que Sirven\n\nA quienes elijas bendecir con la Potencia de Caín, permíteles vivir en tu casa, para protegerte; que nadie $pod_Embrace$ a estos guardianes, que se les dé sangre en el momento oportuno: que su Fuerza sea tu Fuerza, Fuerza que no mengua con el sol. Que sus Ojos sean tus Ojos, Ojos que pueden ver de día. Que sus Oídos sean tus Oídos, Oídos que pueden oír mientras duermes."
 doctrine_vampireghouling_mass_name: "Conversión Masiva en Ghouls Aceptada"
 doctrine_vampireghouling_mass_desc: "La sangre de los Vástagos puede formar legiones.\n\nDe Aquellos que Sirven\n\nA quienes elijas bendecir con la Potencia de Caín, permíteles vivir en tu casa, para protegerte; que nadie $pod_Embrace$ a estos guardianes, que se les dé sangre en el momento oportuno: que su Fuerza sea tu Fuerza, Fuerza que no mengua con el sol. Que sus Ojos sean tus Ojos, Ojos que pueden ver de día. Que sus Oídos sean tus Oídos, Oídos que pueden oír mientras duermes." 
 doctrine_parameter_vampireghouling_illegal: "Los personajes con los [traits|E] [GetTrait('ghoul').GetName( GetPlayer )], [GetTrait('regnant').GetName( GetPlayer )] o [GetTrait('massregnant').GetName( GetPlayer )] son [criminals|E]."
 doctrine_parameter_vampireghouling_shunned: "Los personajes con los [traits|E] [GetTrait('ghoul').GetName( GetPlayer )] o [GetTrait('regnant').GetName( GetPlayer )] son [shunned|E]. Los personajes con [GetTrait('massregnant').GetName( GetPlayer )] son [criminals|E]."
 doctrine_parameter_vampireghouling_accepted: "Los personajes con los [traits|E] [GetTrait('ghoul').GetName( GetPlayer )] o [GetTrait('regnant').GetName( GetPlayer )] son plenamente aceptados. Los personajes con [GetTrait('massregnant').GetName( GetPlayer )] son [criminals|E]."
 doctrine_parameter_vampireghouling_mass: "Puede reclutar [GetMaA('massghouls_maa').GetName] como [men_at_arms|E].\nLos personajes con los [traits|E] [GetTrait('ghoul').GetName( GetPlayer )], [GetTrait('regnant').GetName( GetPlayer )] o [GetTrait('massregnant').GetName( GetPlayer )] son plenamente aceptados." 
 doctrine_parameter_majordomo_court_position_unlock: "Puede emplear a un [GetCourtPositionType('majordomo_court_position').GetName()]"
 majordomo_court_position_unlock_name: ""Puede emplear a un Mayordomo"" #intentional double quotes

 doctrine_bloodsorcery_name: "Hechicería de Sangre"
 doctrine_bloodsorcery_crime_name: "Criminal"
 doctrine_bloodsorcery_crime_desc: "La Hechicería de Sangre es una amenaza para todos los Vástagos y por ello debe prohibirse. \n\nDe los Iluminados\n\nLa Madre del Poder, la oscura Lilith, es la más grande de ellos, pero hay otros, y aún vendrán más. No bebas de su sangre, pues te atraparán; ten cuidado con ellos, son astutos. Conocen el saber de Adán y la sabiduría de Eva; son los portadores del fuego, los labradores de la tierra, los pastores de animales, los portadores de la escritura, son los Hijos del Sol, las Estrellas Nacientes. Buscarán involucrarte en su Viaje, ¡Resiste! ¡Resiste! Su Camino desprecia el hambre, la sangre y el cuerpo. No confíes en quienes tienen los ojos brillantes hacia el alba. Recuerda siempre: es el Amanecer lo que trae tu muerte"
 doctrine_bloodsorcery_shunned_name: "Rechazado"
 doctrine_bloodsorcery_shunned_desc: "Los Hechiceros de Sangre son gente sospechosa, en el mejor de los casos un mal a veces necesario.\n\nDe los Iluminados\n\nLa Madre del Poder, la oscura Lilith, es la más grande de ellos, pero hay otros, y aún vendrán más. No bebas de su sangre, pues te atraparán; ten cuidado con ellos, son astutos. Conocen el saber de Adán y la sabiduría de Eva; son los portadores del fuego, los labradores de la tierra, los pastores de animales, los portadores de la escritura, son los Hijos del Sol, las Estrellas Nacientes. Buscarán involucrarte en su Viaje, ¡Resiste! ¡Resiste! Su Camino desprecia el hambre, la sangre y el cuerpo. No confíes en quienes tienen los ojos brillantes hacia el alba. Recuerda siempre: es el Amanecer lo que trae tu muerte"
 doctrine_bloodsorcery_accepted_name: "Aceptado"
 doctrine_bloodsorcery_accepted_desc: "La magia llena el mundo que nos rodea, y es nuestro derecho y privilegio relacionarnos con ella como lo hicieron nuestros antepasados."
 doctrine_bloodsorcery_kufr_name: "Kufr"
 doctrine_bloodsorcery_kufr_desc: "Los Ashirra reconocen abiertamente la existencia de la magia, pero advierten a sus fieles contra buscar la ayuda de hechiceros. Hacerlo demuestra una falta de fe en Alá, que es el único poder absoluto en el universo. Del mismo modo, quienes practican la magia, en particular la adivinación del futuro, buscan usurpar parte de Su poder y así cometen blasfemia, lo que les impide entrar en el Cielo\n\nSin embargo, hay algunos Ashirra que practican una forma de magia que consideran acorde con la voluntad de Alá. Esta magia, el Sihr, obtiene su poder de la fe y evita las prácticas generales de otras tradiciones."
 doctrine_parameter_bloodsorcery_illegal: "Los personajes con el [trait|E] [GetTrait('bloodsorcery').GetName( GetPlayer )] son [criminals|E]"
 doctrine_parameter_bloodsorcery_shunned: "Los personajes con el [trait|E] [GetTrait('bloodsorcery').GetName( GetPlayer )] son [shunned|E]"
 doctrine_parameter_bloodsorcery_accepted: "Los personajes con el [trait|E] [GetTrait('bloodsorcery').GetName( GetPlayer )] son plenamente aceptados"
 doctrine_parameter_bloodsorcery_kufr: "Los personajes con el [trait|E] [GetTrait('bloodsorcery').GetName( GetPlayer )] son plenamente aceptados"
 doctrine_parameter_non_sihr_bloodsorcery_learning_penalty: "Aprender cualquier [bloodmagic_path|E] que no sea Sihr costará piedad y conllevará penalizaciones adicionales."
 
 doctrine_demonology_name: "Demonología"
 doctrine_demonology_crime_name: "Criminal"
 doctrine_demonology_crime_desc: "Estudiar a $POD_splat_demon_plural$ es convertirse en su esclavo."
 doctrine_demonology_shunned_name: "Rechazado"
 doctrine_demonology_shunned_desc: "Solo la perdición espera a quienes estudian los pozos más oscuros del infierno."
 doctrine_demonology_accepted_name: "Aceptado"
 doctrine_demonology_accepted_desc: "El estudio de $POD_splat_demon_plural$ es una causa digna."
 doctrine_parameter_demonology_illegal: "Los personajes con el [trait|E] [GetTrait('demonology').GetName( GetNullCharacter )] son [criminals|E]"
 doctrine_parameter_demonology_shunned: "Los personajes con el [trait|E] [GetTrait('demonology').GetName( GetNullCharacter )] son [shunned|E]"
 doctrine_parameter_demonology_accepted: "Los personajes con el [trait|E] [GetTrait('demonology').GetName( GetNullCharacter )] son plenamente aceptados"
 
 doctrine_demonic_name: "Demoníacos"
 doctrine_demonic_evil_name: "Mal"
 doctrine_demonic_evil_desc: "No puede haber paz ni negociaciones con la progenie infernal. Los destruiremos a todos, o moriremos en el intento."
 doctrine_demonic_crime_name: "Criminal"
 doctrine_demonic_crime_desc: "Los infernales pretenden traer el infierno a la tierra. No negocies con la Oscuridad: con el tiempo nos llevará a todos. Ten cuidado con los Hijos del Que Está Abajo, la Progenie de la Serpiente, pues su contacto también te quemará y sus lenguas te engañarán y confundirán. Caza y destruye a los infernalistas allá donde los encuentres."
 doctrine_demonic_shunned_name: "Rechazado"
 doctrine_demonic_shunned_desc: "Quienes hacen pactos con demonios siembran su propia ruina. No negocies con la Oscuridad: con el tiempo nos llevará a todos. Ten cuidado con los Hijos del Que Está Abajo, la Progenie de la Serpiente, pues su contacto también te quemará y sus lenguas te engañarán y confundirán. Caza y destruye a los infernalistas allá donde los encuentres."
 doctrine_demonic_accepted_name: "Aceptado"
 doctrine_demonic_accepted_desc: "¡Las inversiones infernales son el camino hacia el verdadero poder!"
 doctrine_parameter_demonic_illegal: "Los personajes con los [traits|E] [GetTrait('demon').GetName( GetPlayer )], [GetTrait('baali').GetName( GetPlayer )], [GetTrait('witch').GetName( GetPlayer )], [GetTrait('spectre').GetName( GetPlayer )] o [GetTrait('fomori').GetName( GetPlayer )] son [criminals|E]"
 doctrine_parameter_demonic_shunned: "Los personajes con los [traits|E] [GetTrait('demon').GetName( GetPlayer )], [GetTrait('baali').GetName( GetPlayer )], [GetTrait('witch').GetName( GetPlayer )], [GetTrait('spectre').GetName( GetPlayer )] o [GetTrait('fomori').GetName( GetPlayer )] son [shunned|E]"
 doctrine_parameter_demonic_accepted: "Los personajes con los [traits|E] [GetTrait('demon').GetName( GetPlayer )], [GetTrait('baali').GetName( GetPlayer )], [GetTrait('witch').GetName( GetPlayer )], [GetTrait('spectre').GetName( GetPlayer )] o [GetTrait('fomori').GetName( GetPlayer )] son plenamente aceptados"

 doctrine_vampirediablerie_name: "$pod_diablerie$"
 doctrine_vampirediablerie_crime_name: "Criminal"
 doctrine_vampirediablerie_crime_desc: "Consumir el alma de otro Vástago es el peor crimen entre los nuestros.\n\nUna Despedida, que Prohíbe $pod_diablerie$\n\nNo busques la sangre de tu propio Antiguo, no busques la sangre del [Glossary('Sire','game_concept_Sire_desc')] de tu [Glossary('Sire','game_concept_Sire_desc')], no busques la de quien te hizo Vástago, pues sentirás la pira funeraria cuando pagues por tu pecado inmortal."
 doctrine_vampirediablerie_shunned_name: "Rechazado"
 doctrine_vampirediablerie_shunned_desc: "Una vez que los vampiros han cogido el gusto por la sangre de otros vampiros, ¿dónde se detendrán?"
 doctrine_vampirediablerie_accepted_name: "Aceptado"
 doctrine_vampirediablerie_accepted_desc: "La sangre pertenece a quienes son lo bastante fuertes para retenerla."
 doctrine_parameter_vampirediablerie_illegal: "Los personajes con los [traits|E] [GetTrait('diablerist').GetName( GetPlayer )] o [GetTrait('predatortype_bloodleech').GetName( GetPlayer )] son [criminals|E]"
 doctrine_parameter_vampirediablerie_shunned: "Los personajes con los [traits|E] [GetTrait('diablerist').GetName( GetPlayer )] o [GetTrait('predatortype_bloodleech').GetName( GetPlayer )] son [shunned|E]"
 doctrine_parameter_vampirediablerie_accepted: "Los personajes con los [traits|E] [GetTrait('diablerist').GetName( GetPlayer )] o [GetTrait('predatortype_bloodleech').GetName( GetPlayer )] son plenamente aceptados"
 
 doctrine_vampirefrenzy_name: "Frenesí"
 doctrine_vampirefrenzy_crime_name: "Criminal"
 doctrine_vampirefrenzy_crime_desc: "Dejar que la Bestia tome el control es convertirse en la Bestia. Recuerda los proverbios. Cabalga la Bestia, no dejes que ella te cabalgue a ti."
 doctrine_vampirefrenzy_shunned_name: "Rechazado"
 doctrine_vampirefrenzy_shunned_desc: "Todos los Vástagos luchan contra las exigencias de la Bestia; no cedas a ella fácilmente. Recuerda los proverbios. Cabalga la Bestia, no dejes que ella te cabalgue a ti."
 doctrine_vampirefrenzy_accepted_name: "Aceptado"
 doctrine_vampirefrenzy_accepted_desc: "¡Cabalga la ola! ¡La Bestia es poder cuando más lo necesitamos!"
 doctrine_parameter_vampirefrenzy_illegal: "Los personajes con el [trait|E] [GetTrait('wight').GetName( GetPlayer )] son [criminals|E]"
 doctrine_parameter_vampirefrenzy_shunned: "Los personajes con el [trait|E] [GetTrait('wight').GetName( GetPlayer )] son [shunned|E]"
 doctrine_parameter_vampirefrenzy_accepted: "Los personajes con el [trait|E] [GetTrait('wight').GetName( GetPlayer )] son plenamente aceptados"

 doctrine_vampirethinblood_name: "Sangre Diluida"
 doctrine_vampirethinblood_crime_name: "Criminal"
 doctrine_vampirethinblood_crime_desc: "¡Los de Sangre Diluida traerán la Gehenna! ¡Destrúyelos allá donde se encuentren!"
 doctrine_vampirethinblood_shunned_name: "Rechazado"
 doctrine_vampirethinblood_shunned_desc: "Los de Sangre Diluida son un presagio de la Gehenna. Se les evita y rechaza."
 doctrine_vampirethinblood_accepted_name: "Aceptado"
 doctrine_vampirethinblood_accepted_desc: "Los Duskborn son como cualquier otro vampiro, aunque más débiles."
 doctrine_vampirethinblood_justicar_name: "$custom_camarilla_clan_status_justicar$"
 doctrine_vampirethinblood_justicar_desc: "[GetTrait('caitiff').GetName( GetPlayer )] puede nombrar [Glossary('Justicar','game_concept_justicar_desc')]." 
