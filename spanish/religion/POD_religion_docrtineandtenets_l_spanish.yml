 special_doctrine_blood_divinity_name: "Divinidad de la Sangre"
 special_doctrine_blood_divinity_desc: "Los Herejes Cainitas y los Divinistas coinciden en la naturaleza fundamental de los Vampiros como Dioses entre los hombres."
