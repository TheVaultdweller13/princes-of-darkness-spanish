 changeling_rebirth_name: "Renacimiento Changeling"
 changeling_rebirth_doctrine_name: "Renacimiento Changeling"
 changeling_rebirth_doctrine_desc: "Cuando la parte humana de un changeling muere (Muerte Banal), el yo feérico puede seguir viviendo, pero ese changeling nunca volverá a existir. Los Plebeyos renacen en otro huésped humano con una apariencia y una crianza distintas a las del anterior aspecto mortal."
 
