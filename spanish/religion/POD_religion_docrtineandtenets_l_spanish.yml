 doctrine_magicraft_name: "Magia"
 doctrine_magicraft_evil_name: "Mal"
 doctrine_magicraft_evil_desc: "No puede haber paz ni negociaciones con las brujas. Las destruiremos a todas, o moriremos en el intento."
 doctrine_magicraft_crime_name: "Criminal"
 doctrine_magicraft_crime_desc: "Los Magos deben ser destruidos.\n\nDe los Iluminados\n\nLa Madre del Poder, la oscura Lilith, es la más grande de ellos, pero hay otros, y aún vendrán más. No bebas de su sangre, pues te atraparán; ten cuidado con ellos, son astutos. Conocen el saber de Adán y la sabiduría de Eva; son los portadores del fuego, los labradores de la tierra, los pastores de animales, los portadores de la escritura, son los Hijos del Sol, las Estrellas Nacientes. Buscarán involucrarte en su Viaje, ¡Resiste! ¡Resiste! Su Camino desprecia el hambre, la sangre y el cuerpo. No confíes en quienes tienen los ojos brillantes hacia el alba. Recuerda siempre: es el Amanecer lo que trae tu muerte."
 doctrine_magicraft_shunned_name: "Rechazado"
 doctrine_magicraft_shunned_desc: "Aunque sobrenaturales como nosotros, los magos no son como nosotros. En absoluto.\n\nDe los Iluminados\n\nLa Madre del Poder, la oscura Lilith, es la más grande de ellos, pero hay otros, y aún vendrán más. No bebas de su sangre, pues te atraparán; ten cuidado con ellos, son astutos. Conocen el saber de Adán y la sabiduría de Eva; son los portadores del fuego, los labradores de la tierra, los pastores de animales, los portadores de la escritura, son los Hijos del Sol, las Estrellas Nacientes. Buscarán involucrarte en su Viaje, ¡Resiste! ¡Resiste! Su Camino desprecia el hambre, la sangre y el cuerpo. No confíes en quienes tienen los ojos brillantes hacia el alba. Recuerda siempre: es el Amanecer lo que trae tu muerte."
 doctrine_magicraft_accepted_name: "Aceptado"
 doctrine_magicraft_accepted_desc: "Los Magos son aceptados."
 doctrine_parameter_magicraft_illegal: "Los personajes con el [trait|E] [GetTrait('mage').GetName( GetPlayer )] o [GetTrait('sorcerer').GetName( GetPlayer )] son [criminals|E]"
 doctrine_parameter_magicraft_shunned: "Los personajes con el [trait|E] [GetTrait('mage').GetName( GetPlayer )] o [GetTrait('sorcerer').GetName( GetPlayer )] son [shunned|E]"
 doctrine_parameter_magicraft_accepted: "Los personajes con el [trait|E] [GetTrait('mage').GetName( GetPlayer )] o [GetTrait('sorcerer').GetName( GetPlayer )] son plenamente aceptados" 
 
 doctrine_haunting_name: "Acecho"
 doctrine_haunting_evil_name: "Mal"
 doctrine_haunting_evil_desc: "No puede haber paz ni negociaciones con los muertos. Los destruiremos a todos, o moriremos en el intento."
 doctrine_haunting_crime_name: "Criminal"
 doctrine_haunting_crime_desc: "Los fantasmas deben permanecer al otro lado del velo.\n\nDe Aquellos Espíritus de los Muertos\n\nMarca bien esto: hay un lugar más allá del espíritu, más allá de la vida, que es Oscuridad, Sombra, y allí habitan las Sombras. Una isla, una fortaleza, una tierra de los Muertos; he viajado allí por un sendero de perdición y he presenciado al temido rey de la Ciudad Estigia sentado en su corte. He visto a los encapuchados sin rostro cruzar el río Estigia. Se agolpan en torno a nosotros como moscas sobre un cadáver en putrefacción y, como nosotros, se alimentan de miedo, éxtasis e ira. Muertos están, pero no-muertos, y están más cerca de nosotros de lo que jamás sabremos."
 doctrine_haunting_shunned_name: "Rechazado"
 doctrine_haunting_shunned_desc: "Los fantasmas son almas separadas de sus cuerpos. Pueden intentar poseer nuestros cuerpos.\n\nDe Aquellos Espíritus de los Muertos\n\nMarca bien esto: hay un lugar más allá del espíritu, más allá de la vida, que es Oscuridad, Sombra, y allí habitan las Sombras. Una isla, una fortaleza, una tierra de los Muertos; he viajado allí por un sendero de perdición y he presenciado al temido rey de la Ciudad Estigia sentado en su corte. He visto a los encapuchados sin rostro cruzar el río Estigia. Se agolpan en torno a nosotros como moscas sobre un cadáver en putrefacción y, como nosotros, se alimentan de miedo, éxtasis e ira. Muertos están, pero no-muertos, y están más cerca de nosotros de lo que jamás sabremos."
 doctrine_haunting_accepted_name: "Aceptado"
 doctrine_haunting_accepted_desc: "Los wraiths pueden ser útiles. Quienes conocen las artes de invocar y atar wraiths pueden usarlos para todo tipo de fines.\n\nDe Aquellos Espíritus de los Muertos\n\nMarca bien esto: hay un lugar más allá del espíritu, más allá de la vida, que es Oscuridad, Sombra, y allí habitan las Sombras. Una isla, una fortaleza, una tierra de los Muertos; he viajado allí por un sendero de perdición y he presenciado al temido rey de la Ciudad Estigia sentado en su corte. He visto a los encapuchados sin rostro cruzar el río Estigia. Se agolpan en torno a nosotros como moscas sobre un cadáver en putrefacción y, como nosotros, se alimentan de miedo, éxtasis e ira. Muertos están, pero no-muertos, y están más cerca de nosotros de lo que jamás sabremos."
 doctrine_parameter_haunting_illegal: "Los personajes con el [trait|E] [GetTrait('wraith').GetName( GetNullCharacter )] son [criminals|E]. Los personajes con los [traits|E] [GetTrait('necromancy').GetName( GetPlayer )] o [GetTrait('oblivion').GetName( GetPlayer )] son [shunned|E]"
 doctrine_parameter_haunting_shunned: "Los personajes con los [traits|E] [GetTrait('wraith').GetName( GetNullCharacter )], [GetTrait('necromancy').GetName( GetPlayer )] o [GetTrait('oblivion').GetName( GetPlayer )] son [shunned|E]"
 doctrine_parameter_haunting_accepted: "Los personajes con los [traits|E] [GetTrait('wraith').GetName( GetNullCharacter )], [GetTrait('necromancy').GetName( GetPlayer )] o [GetTrait('oblivion').GetName( GetPlayer )] son plenamente aceptados"  
 
 doctrine_glamour_name: "Glamour"
 doctrine_glamour_evil_name: "Mal"
 doctrine_glamour_evil_desc: "No puede haber paz ni negociaciones con los viejos supersticiosos. Los destruiremos a todos, o moriremos en el intento."
 doctrine_glamour_crime_name: "Criminal"
 doctrine_glamour_crime_desc: "Las hadas deben ser destruidas."
 doctrine_glamour_shunned_name: "Rechazado"
 doctrine_glamour_shunned_desc: "Aunque sobrenaturales como nosotros, las hadas no son como nosotros. En absoluto.\n\nDe los Salvajes\n\nDe los locos, los salvajes, digo primero: ¡no bebas de su sangre! Pero obsérvalos, pues son hermosos en su naturaleza salvaje, encantadores en su misterio, letales en sus artes de guerra. Solos entre las criaturas de la noche, me hicieron compañía bajo la tierra y me trajeron agua cuando tenía sed y aún podía respirar. Como Yo, fueron expulsados; como Mis Hijos, no tienen hogar; como los Hijos de Mis Hijos, vagan errantes; como mi Madre y mi Padre, saben demasiado, pero guardan su propio consejo, y de ellos digo, marcad bien esto: ¡guardad silencio! No digáis nada. Observad y aprended."
 doctrine_glamour_accepted_name: "Aceptado"
 doctrine_glamour_accepted_desc: "Las hadas son aceptadas.\n\nDe los Salvajes\n\nDe los locos, los salvajes, digo primero: ¡no bebas de su sangre! Pero obsérvalos, pues son hermosos en su naturaleza salvaje, encantadores en su misterio, letales en sus artes de guerra. Solos entre las criaturas de la noche, me hicieron compañía bajo la tierra y me trajeron agua cuando tenía sed y aún podía respirar. Como Yo, fueron expulsados; como Mis Hijos, no tienen hogar; como los Hijos de Mis Hijos, vagan errantes; como mi Madre y mi Padre, saben demasiado, pero guardan su propio consejo, y de ellos digo, marcad bien esto: ¡guardad silencio! No digáis nada. Observad y aprended."
 doctrine_parameter_glamour_illegal: "Los personajes con el [trait|E] [GetTrait('fae').GetName( GetPlayer )] o [GetTrait('changeling').GetName( GetPlayer )] son [criminals|E]"
 doctrine_parameter_glamour_shunned: "Los personajes con el [trait|E] [GetTrait('fae').GetName( GetPlayer )] o [GetTrait('changeling').GetName( GetPlayer )] son [shunned|E]"
 doctrine_parameter_glamour_accepted: "Los personajes con el [trait|E] [GetTrait('fae').GetName( GetPlayer )] o [GetTrait('changeling').GetName( GetPlayer )] son plenamente aceptados" 
  
