 #Vampiric Tenets
 tenet_vampiremasquerade_name: "Mascarada"
 tenet_vampiremasquerade_desc: "El Silencio de la Sangre. No revelarás tu verdadera naturaleza a quienes no sean de la Sangre. Hacerlo supondrá renunciar a tus derechos de Sangre."
 
 tenet_vampireprogeny_name: "Progenie"
 tenet_vampireprogeny_desc: "Solo [Glossary('engendrarás','game_concept_Sire_desc')] a otro con el permiso de tu Antiguo. Si creas a otro sin el permiso de tu Antiguo, tanto tú como tu Progenie seréis ejecutados."
 
 tenet_vampiredestruction_name: "Destrucción"
 tenet_vampiredestruction_desc: "Te está prohibido destruir a otro de tu especie. El derecho de destrucción pertenece solo a tu Antiguo. Solo el más Antiguo entre vosotros podrá convocar la Caza de Sangre."

 tenet_vampiretouchstone_name: "Piedra de Toque"
 tenet_vampiretouchstone_desc: "Un Vástago puede elegir a un mortal como piedra de toque para ayudar a mantener su conexión con la humanidad. El Vástago gana entonces piedad. Existen más eventos relacionados con la piedra de toque."
 
 tenet_vampireremorse_name: "Remordimiento"
 tenet_vampireremorse_desc: "Los Vástagos reflexionan sobre sus actos y sienten arrepentimiento por su comportamiento monstruoso, ganando piedad." 
 
 tenet_vampireblushoflife_name: "Rubor de Vida"
 tenet_vampireblushoflife_desc: "Los Vástagos pueden emular estar vivos. Esto ayuda a su mascarada, además de recordarles lo que es ser humano, y así ganan piedad."  
 
 tenet_vampirenecromanticexperimention_name: "Experimentación Necromántica"
 tenet_vampirenecromanticexperimention_desc: "Marca bien esto: hay un lugar más allá del espíritu, más allá de la vida, que es Oscuridad, Sombra, y allí habitan las Sombras. Una isla, una fortaleza, una tierra de los Muertos; he viajado allí por un sendero de perdición y he presenciado al temido rey de la Ciudad Estigia sentado en su corte. He visto a los encapuchados sin rostro cruzar el río Estigia. Se agolpan en torno a nosotros como moscas sobre un cadáver en putrefacción y, como nosotros, se alimentan de miedo, éxtasis e ira. Muertos están, pero no-muertos, y están más cerca de nosotros de lo que jamás sabremos. La Sangre de mi Hermano me clama mientras duermo y el Sol cruza el cielo; oigo a mi hermano, el segundo nacido, Abel, gritar. Marca bien los espíritus de los que han muerto, sabe que su fuerza no es la tuya, escucha sus palabras: portan sabiduría. No escuches sus cantos: ese camino lleva al Olvido.\nLas ejecuciones generan tanto Resonancia Melancólica como piedad."  
 
 tenet_vampirenemetamorphopsisexperimention_name: "Experimentación Necromántica"
 tenet_vampirenemetamorphopsisexperimention_desc: "Las ejecuciones generan tanto experiencia colérica como piedad."  
 
 tenet_vampireauctoritasritae_name: "Auctoritas Ritae"
 tenet_vampireauctoritasritae_desc: "Una colección de trece rituales practicados por todos los miembros del Sabbat."
 
 tenet_vampireamaranth_name: "Amaranto"
 tenet_vampireamaranth_desc: "Práctica de $pod_diablerie$"
 
 tenet_vampiremonomacy_name: "Monomaquia"
 tenet_vampiremonomacy_desc: "Un duelo honorable que termina en $pod_diablerie$. El ritus de la Monomaquia se usa para resolver disputas entre todos los miembros del Sabbat."
 
 tenet_infernalism_name: "Infernalismo"
 tenet_infernalism_desc: "Investidura Demoníaca a través de pactos con diablos."
 
 tenet_vampireinquisition_name: "Inquisición"
 tenet_vampireinquisition_desc: "Marca bien a los Hijos del Que Está Arriba, los Querubines, los Serafines, los Arcángeles, pues su contacto te quemará como la Llama de Miguel. Marca bien a los Hijos del Que Está Abajo, la Progenie de la Serpiente, pues su contacto también te quemará y sus lenguas te engañarán y confundirán. Caza y destruye a los infernalistas allá donde los encuentres."
 
 tenet_pleasure_name: "Placer"
 tenet_pleasure_desc: "La búsqueda hedonista del éxtasis"
 doctrine_parameter_reveler_from_elysium: "Obtienes experiencia de [GetTrait('lifestyle_reveler').GetName(GetNullCharacter)] y [GetTrait('lifestyle_reveler').GetName(GetNullCharacter)] del elíseo."
 
 tenet_cruelty_name: "Crueldad"
 tenet_cruelty_desc: "El placer obtenido al infligir dolor"
 
 tenet_quiritare_name: "Quiritare"
 tenet_quiritare_desc: "Resistir a la Bestia o intentar aplacarla es imposible, así que entrégate a ella por completo, cumpliendo su voluntad." 
  
 tenet_legacyoftrinity_name: "Legado de la Trinidad"
 tenet_legacyoftrinity_desc: "El Códice dicta la superioridad de los tres clanes principales: Toreador, Tzimisce y Ventrue. Los miembros de otros clanes deben pedir permiso a los Quaesitori para [Glossary('engendrar','game_concept_Sire_desc')] Chiquillos; los miembros de los tres clanes principales pueden [Glossary('engendrar','game_concept_Sire_desc')] a quien deseen. Solo los miembros de los tres clanes principales pueden legar un dominio a otro vampiro, y cada vampiro dentro de ese dominio tiene el deber de hacer cumplir el Códice."
 
 tenet_legacyofashes_name: "Legado de las Cenizas"
 tenet_legacyofashes_desc: "El Códice dicta que quien mate a un miembro de los tres clanes principales sufrirá una Caza de Sangre."

 tenet_legacyofshadow_name: "Legado de la Sombra"
 tenet_legacyofshadow_desc: "El Códice dicta que los Cainitas no revelen su verdadera naturaleza a quienes no sean de la Sangre. Hacerlo supondrá renunciar a sus derechos de Sangre." 
 
 tenet_oaths_name: "Ligados por Juramento"
 tenet_oaths_desc: "Nuestras leyes son los mandatos de nuestros Antiguos, y los mandatos de Caín sobre todos ellos. Los juramentos son la base del orden feudal." 
 #A sworn oath is the most sacred bond a lord can make. An oathbreaker lord threatens all society as they degenerate to the Beast." 
 #The oathsworn have casus belli to make war upon the forsworn and strip them of their titles."
 tenet_werewolf_oaths_desc: "Un juramento hecho es el vínculo más sagrado que se puede contraer. Un líder que rompe juramentos no tiene honor y amenaza con arrastrar a todos a su corrupción."
 
 
 tenet_vampirehighclans_name: "Altos Clanes"
 tenet_vampirehighclans_desc: "Los Altos Clanes son superiores a los Bajos Clanes. Los Bajos Clanes son degenerados que acabarán sucumbiendo a la Bestia. No están bien dotados para gobernar ni para la buena sociedad."
 
 tenet_vampireselectivefeeding_name: "Alimentación Selectiva"
 tenet_vampireselectivefeeding_desc: "No te alimentarás de las Bestias de la Luna, los Salvajes, los enfermos, los locos ni los ebrios."
 #\n\nThe Moon-Beasts, the one-who-change, they are the Oldest of all, before my father they roamed the lands. Tarry not in the path of them, avoid them, they are set upon us like wolves in the sheepfold. For we are of one kind, and they another. Beware of their sacred ground, walk softly through their wilderness. Their bite is as our bite, their claws are as our claws, tarry not in the path of them, they are of one kind, and we are another.\n\nOf the mad ones, the wild ones, I say, first, drink not of their blood! But watch them, for they are beautiful in their wilderness, they are enchanting in their mystery, they are deadly in their war skills. Alone among the creatures of the night, they kept me company in the earth and brought me water when I was thirsty and could still breathe. Like Me, they were cast out, Like My Children, they are homeless, Like My Children's Children, they wander, Like my Mother and Father, they know too much, but they keep their own counsel, and, of them, I say mark me well, keep silent! Say nothing. Watch, and learn."
 #doctrine_parameter_vampireselectivefeeding: ""
 doctrine_parameter_vampireselectivefeeding: ""
 
 tenet_enkrateia_reie_sophrosyne_name: "Enkrateia Reie Sophrosyne"
 tenet_enkrateia_reie_sophrosyne_desc: "Un enfoque intelectual de la no-vida, el Camino se centra en tres conceptos fundamentales que se consideraban características esenciales buscadas en la posible progenie Brujah en las noches de Cartago: enkrateia, reie y sophrosyne. Enkrateia se refiere a la fortaleza interior. Reie se refiere al valor moral. Sophrosyne significa el control de uno mismo y representa la meta idealizada de todos los Filósofos: el dominio de la Furia Brujah."
 #It is not enough for the Philosopher to passively accept the frustrations that come her way, as the Path of Humanity requires. Instead, she must hone her reason into a sword and her will into a shield against the forces that would cause her to degenerate.\n\nSophrosyne means control of the self and represents the idealized goal of all Philosophers: mastery over the Brujah rage. It also means that the Brujah has committed to an eternity of mental, spiritual, and physical development. Philosophers develop sophrosyne by working to improve Physical and Mental Attributes and Abilities, rather than focusing on [Glossary('Disciplines','game_concept_discipline_desc')] or Social traits."
 
 #\n\nIn practical terms, this means that Philosophers usually have high Willpower and Self-Control ratings or else aggressively pursue those traits.\n\nReie refers to moral courage. The Philosopher must not shirk her responsibility to pursue either enlightenment or moral character out of fear of frenzy or other degradations. Instead, she must confront difficult situations with reason and self-$pod_discipline$, eschewing the impetuosity that defines the modern Brujah."
 
 tenet_cold_mind_name: "Mente Fría"
 tenet_cold_mind_desc: "La Mente Fría es un estado mental esencial para la Canción de la Sombra. En esencia, describe un enfoque del mundo que la rodea desprovisto de emociones, completamente calmado y controlado, pero la mayor parte de su significado está envuelto en acertijos y Koans, por lo que el sentido pleno de la Mente Fría se comprende mejor en contexto."
 
 tenet_intellectual_detachement_name: "Desapego Intelectual"
 tenet_intellectual_detachement_desc: "Los Eruditos no temen a la muerte; de hecho, les fascina. La ven como una fuerza poderosa que estudiar, diseccionar y racionalizar para comprender mejor su propia existencia."
 
 tenet_pact_of_athens_name: "Pacto de Atenas"
 tenet_pact_of_athens_desc: "Hacia el 1270 a.C., un cónclave de los primeros Pródigos, formado en su mayoría por Brujah, Ventrue, Toreador y Salubri, se reunió en la ciudad de Atenas, pues muchos de los vampiros presentes la consideraban el lugar de nacimiento oficial del propio Camino. El Pacto de Atenas sirvió como directriz formal para las corrientes dispares de la sociedad vampírica que buscaban contener a la Bestia y conservar su Humanidad."
 
 tenet_judgement_name: "Juicio"
 tenet_judgement_desc: "Para los Centinelas, uno de los preceptos principales del Camino es que sus seguidores purguen a todos los indignos de la sangre de Caín y purifiquen las Líneas de Sangre; quien muestre una naturaleza oscura y deshonrosa ante un seguidor de Haqim puede llevarse un duro despertar. Los conceptos de honor, disciplina y autocontrol son igualmente importantes para los Centinelas. Actuar precipitadamente es motivo de vergüenza; dejar que la propia Bestia tome el control es, sencillamente, condenatorio."
 
 tenet_conviction_and_instinct_name: "Convicción e Instinto"
 tenet_conviction_and_instinct_desc: "No pierdes piedad por herir gravemente o matar a víctimas mortales. Los vampiros no pierden piedad por entrar en Frenesí."
 tenet_conviction_and_selfcontrol_name: "Convicción y Autocontrol"
 tenet_conviction_and_selfcontrol_desc: "No pierdes piedad por herir gravemente o matar a víctimas mortales. Los vampiros pierden piedad por entrar en Frenesí."
 tenet_conscience_and_selfcontrol_name: "Conciencia y Autocontrol"
 tenet_conscience_and_selfcontrol_desc: "Pierdes piedad por herir gravemente o matar a víctimas mortales. Pierdes piedad por entrar en Frenesí."
 tenet_conscience_and_instinct_name: "Conciencia e Instinto"
 tenet_conscience_and_instinct_desc: "Pierdes piedad por herir gravemente o matar a víctimas mortales. No pierdes piedad por entrar en Frenesí."
