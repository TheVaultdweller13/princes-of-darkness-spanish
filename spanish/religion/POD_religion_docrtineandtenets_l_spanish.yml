 tenet_oath_truce_name: "Tregua Jurada"
 tenet_oath_truce_desc: "«Portador de la Tregua» es un término aplicado a las hadas que buscan poner fin a la Guerra de las Estaciones, ya sea extendiendo la Tregua Jurada indefinidamente, o forjando un nuevo tratado duradero que cese las hostilidades entre las cortes."
 
 tenet_summer_traditions_name: "Tradiciones de Verano"
 tenet_summer_traditions_desc: "Las hadas de la corte de Verano se toman la responsabilidad de los Señores hacia sus Vasallos muy en serio. Administrar el sistema de vasallaje con justicia debería dar como resultado Vasallos felices. Vasallos felices significan un Señor de éxito."
