 doctrine_parameter_hurt_mortal_lose_piety: "Pierdes [piety_i][piety|E] al herir gravemente o matar a víctimas mortales."
 doctrine_parameter_east_building_parameter: "Los [Glossary('Dharma','podgloss.dharma')] del Este obtienen bonificación relacionada con el desarrollo y la resistencia a epidemias en los edificios ducales del Nido del Dragón."
 doctrine_parameter_south_building_parameter: "Los [Glossary('Dharma','podgloss.dharma')] del Sur obtienen bonificación relacionada con la guerra en los edificios ducales del Nido del Dragón."
 doctrine_parameter_west_building_parameter: "Los [Glossary('Dharma','podgloss.dharma')] del Oeste obtienen bonificación relacionada con las intrigas en los edificios ducales del Nido del Dragón."
 doctrine_parameter_north_building_parameter: "Los [Glossary('Dharma','podgloss.dharma')] del Norte obtienen bonificación relacionada con la legitimidad en los edificios ducales del Nido del Dragón."
 doctrine_parameter_center_building_parameter: "Los [Glossary('Dharma','podgloss.dharma')] del Centro obtienen bonificación relacionada con la experiencia de estilo de vida en los edificios ducales del Nido del Dragón."

 doctrine_parameter_frenzy_lose_piety: "Pierdes [piety_i][piety|E] al entrar en Frenesí."
 doctrine_parameter_can_hire_touchstones: "Puede contratar a [GetCourtPositionType('touchstones_court_position').GetName()]."
 doctrine_enlightenment_virtues_orun_and_aye_name: "Orun y Aye"
 doctrine_enlightenment_virtues_orun_and_aye_desc: "Los Laibon forjan sus vidas en torno a dos Caminos separados de Moralidad: Aye, que es su moralidad hacia la humanidad, y Orun, que es su moralidad hacia lo sobrenatural." 
 tenet_orun_and_aye_name: "Orun y Aye"
 tenet_orun_and_aye_desc: "Los Laibon forjan sus vidas en torno a dos Caminos separados de Moralidad: Aye, que es su moralidad hacia la humanidad, y Orun, que es su moralidad hacia lo sobrenatural." 
 #Depending on where they stand on these two scales, their appearance and supernatural power fluctuates. This fundamental difference forever separates the Laibon from the 'typical' $pod_cainite$."
 #Contrary to the Kindred, no Laibon follows the Path of Humanity, nor any other Path of Enlightenment for that matter. Instead, 
 doctrine_enlightenment_virtues_direction_north_name: "Norte"
 doctrine_enlightenment_virtues_direction_north_desc: "Estereotipados como fríos, justos y lógicos, los [GetTrait('kueijin').GetName( GetNullCharacter )] de aspecto norte sirven como jueces y magistrados de los suyos y suelen resolver disputas y cazar criminales y [akuma|E]." 
 doctrine_enlightenment_virtues_direction_east_name: "Este"
 doctrine_enlightenment_virtues_direction_east_desc: "Considerados comúnmente los más cómodos entre los humanos, los [GetTrait('kueijin').GetName( GetNullCharacter )] de aspecto este son vistos como granjeros, cultivando pantallas escarlata y cuidando de su rebaño mortal." 
 doctrine_enlightenment_virtues_direction_south_name: "Sur"
 doctrine_enlightenment_virtues_direction_south_desc: "Conocidos por sus temperamentos violentos, los [GetTrait('kueijin').GetName( GetNullCharacter )] de aspecto sur son los motores de la sociedad, desafiando viejas creencias y manteniendo el Quincunce al día. Aunque sus semejantes a menudo los consideran insufribles, sus Antiguos los toleran por su formidable intelecto y destreza en el combate." 
 doctrine_enlightenment_virtues_direction_west_name: "Oeste"
 doctrine_enlightenment_virtues_direction_west_desc: "Actuando como emisarios ante los [spirit_worlds|E] del Reino Medio y ocasionalmente como asesinos para los Mandarines, los [GetTrait('kueijin').GetName( GetNullCharacter )] de aspecto oeste suelen ser mal vistos por sus semejantes. Son conocidos por no mostrar piedad y cumplir cualquier tarea que se les encomiende —ya sea de un espíritu, un wraith o un mandarín— con absoluta precisión."
 doctrine_enlightenment_virtues_direction_center_name: "Centro"
 doctrine_enlightenment_virtues_direction_center_desc: "Los [GetTrait('kueijin').GetName( GetNullCharacter )] de aspecto centro suelen encargarse de guiar a los Cathayanos más jóvenes en las sutilezas de su sociedad, pero muchos prefieren explorar su propia alma, dedicándose a la iluminación dhármica."  

 tenet_vanilla_pursuit_of_knowledge_name: "Búsqueda del conocimiento"
 tenet_vanilla_pursuit_of_knowledge_desc: "Obsesión con la búsqueda del conocimiento. Los pecados incluyen: no estudiar cuando se tiene la oportunidad de hacerlo, negarse a realizar experimentos, negarse a compartir ideas con otros en el Camino."
  
 tenet_greed_is_good_name: "La Avaricia es Buena"
 tenet_greed_is_good_desc: "El oro es poder, así que usan la acumulación de riqueza para ganar influencia y así saciar a su Bestia."
 
 tenet_scorched_heart_name: "Corazón Vacío"
 tenet_scorched_heart_desc: "Desarrollado por Rathmonicus, se controla a la Bestia erradicando sistemáticamente toda emoción del corazón del vampiro."
 
 tenet_isolation_name: "Aislamiento"
 tenet_isolation_desc: "Todo lo que queremos es que nos dejen en paz. Nuestras prácticas son solo nuestras, y no incumben a nadie más de lo que las suyas nos incumben a nosotros."

 tenet_continued_life_name: "Vida Continuada"
 tenet_continued_life_desc: "Algunos no-muertos intentan continuar su vida mortal en la mayor medida posible. Aunque esto les ayuda a mantener el contacto con su antigua vida mortal, aumenta la exposición de [the_masquerade|E]. Usar poderes místicos de forma continua para parecer vivos también aumenta el Ansia." 
 
 tenet_vengeance_of_samiel_name: "Venganza de Samiel"
 tenet_vengeance_of_samiel_desc: "Samiel recibió una visita de Miguel, comandante de las Huestes Celestiales, mientras Saulot estaba ausente. El arcángel ordenó al rey guerrero que escribiera el Código y que incluyera en él los rituales adecuados necesarios para la fuerza y el linaje de sangre de los nuevos guerreros."
 
# The greatest of Saulot's warrior line, the martyred founder Samiel is believed to have penned this text with his own hand. Samiel was killed at the end of the Second Baali War, as were more than half of his followers."
 
 tenet_devoted_to_michael_name: "Devoto de Miguel"
 tenet_devoted_to_michael_desc: "El Camino del Arcángel fue una vertiente del Camino del Cielo popular en Bizancio durante el siglo XIII. Venera la memoria del caído Patriarca de Constantinopla, Miguel. Los seguidores del Camino se llaman Micaelitas."  
 
 special_doctrine_three_pillars_kindred_name: "Tres Pilares"
 special_doctrine_three_pillars_kindred_desc: "La base de la sociedad feudal es el castillo, la iglesia y el pueblo. La sociedad de los Vástagos refleja esto con el Camino de los Reyes, el Camino del Cielo y el Camino de la Humanidad conviviendo en tolerancia mutua."
 doctrine_parameter_hostility_override_special_doctrine_three_pillars_kindred: "Otras [faiths|E] de Vástagos que tengan el [doctrine|E] [GetFaithDoctrine('special_doctrine_three_pillars_kindred').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_hostile_tooltippable$" 

 special_doctrine_sin_pillars_kindred_name: "Pilares del Deseo"
 special_doctrine_sin_pillars_kindred_desc: "Los estudiantes de Sahar siguieron cada uno su propio camino tras su desaparición, pero siguen siendo hermanos y hermanas en la fe."
 doctrine_parameter_hostility_override_special_doctrine_sin_pillars_kindred: "Otras [faiths|E] de Vástagos que tengan el [doctrine|E] [GetFaithDoctrine('special_doctrine_sin_pillars_kindred').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_hostile_tooltippable$" 

 special_doctrine_set_pillars_kindred_name: "Pilares de Set"
 special_doctrine_set_pillars_kindred_desc: "Set tiene muchas formas, muchos nombres y muchas historias de origen. Pero, al final, sigue siendo el Gran Liberador."
 doctrine_parameter_hostility_override_special_doctrine_set_pillars_kindred: "Otras [faiths|E] de Vástagos que tengan el [doctrine|E] [GetFaithDoctrine('special_doctrine_set_pillars_kindred').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_hostile_tooltippable$" 

 special_doctrine_ashirra_pillars_kindred_name: "Pilares Ashirra"
 special_doctrine_ashirra_pillars_kindred_desc: "Aunque quienes siguieron los primeros pasos del Islam venían de clanes y trasfondos muy distintos, todos creían en algo más grande que ellos mismos."
 doctrine_parameter_hostility_override_special_doctrine_ashirra_pillars_kindred: "Otras [faiths|E] de Vástagos que tengan el [doctrine|E] [GetFaithDoctrine('special_doctrine_ashirra_pillars_kindred').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_evil_tooltippable$"
 doctrine_parameter_ashirra_khitta_building_province_bonuses: "Los $glossary_khittas$ alineados con los Ashirra en [holy_cairo|E] proporcionan impuestos adicionales si El Cairo sigue esta fe"
 doctrine_parameter_ashirra_khitta_building_character_bonuses: "Los $glossary_khittas$ alineados con los Ashirra en [holy_cairo|E] proporcionan piedad si el titular sigue esta fe"

 special_doctrine_lilith_pillars_kindred_name: "Pilares Lilim"
 special_doctrine_lilith_pillars_kindred_desc: "Lilith busca venganza contra los hijos de Caín. Pero aceptará conversos entusiastas, o peones útiles, cuando sea necesario."
 doctrine_parameter_hostility_override_special_doctrine_lilith_pillars_kindred: "Otras [faiths|E] de Vástagos que tengan el [doctrine|E] [GetFaithDoctrine('special_doctrine_lilith_pillars_kindred').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_evil_tooltippable$" 

 special_doctrine_heretical_paradox_name: "Ciclo Roto"
 special_doctrine_heretical_paradox_desc: "Los Ravnos orientales (y muchos otros Vástagos) consideran esta rama como herética y una mera excusa para el robo, la Diablerie y otros crímenes contra la sociedad. Se han intentado muchas veces purgar este Camino, aunque ninguna ha tenido éxito hasta ahora."
 doctrine_parameter_hostility_override_tenet_svadharma: "Otras [faiths|E] de Vástagos que tengan el [doctrine|E] [GetFaithDoctrine('tenet_svadharma').GetBaseName] consideran esta fe [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]." 

 special_doctrine_main_paradox_name: "Entender el Ciclo"
 special_doctrine_main_paradox_desc: "El Camino de la Paradoja debe mucho a ciertos preceptos del hinduismo y es ampliamente aceptado como un precepto respetable entre los vampiros indios. Su versión occidental bastardizada, en cambio, no lo es."
 doctrine_parameter_hostility_override_special_doctrine_heretical_paradox: "Otras [faiths|E] de Vástagos que tengan el [doctrine|E] [GetFaithDoctrine('special_doctrine_heretical_paradox').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]." 
    

   
 
 special_doctrine_ecumenical_hunters_name: "Cazadores Ecuménicos"
 special_doctrine_ecumenical_hunters_desc: "Aunque los Cazadores provienen de trasfondos y fes muy variados, reconocen un vínculo común en la lucha contra los horrores sobrenaturales del Mundo de Tinieblas."
 doctrine_parameter_hostility_override_special_doctrine_ecumenical_hunters: "Otras [faiths|E] de Cazadores que tengan el [doctrine|E] [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_hostile_tooltippable$" 

 special_doctrine_heretical_hunters_name: "Cazadores Heréticos"
 special_doctrine_heretical_hunters_desc: "Estos Cazadores, en opinión de los demás, se han aliado con el enemigo y deben ser cazados con el mismo prejuicio."
  
 special_doctrine_ignorance_name: "No Llamar la Atención"
 special_doctrine_ignorance_desc: "Los mortales no tienen conocimiento de lo sobrenatural en el Mundo de Tinieblas. Debemos mantenerlo así."
 doctrine_parameter_hostility_override_special_doctrine_ignorance: "Las [faiths|E] de la Ignorancia, como la Inocencia de los mortales, hacen que no supongan una amenaza para los seres sobrenaturales del Mundo de Tinieblas. Las fes que desean mantener a los mortales en la ignorancia los consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_hostile_tooltippable$ o $hostility_evil_tooltippable$."  
 doctrine_parameter_hostility_override_ignorance_hostility_doctrine: "Las [faiths|E] de la Ignorancia, como la Inocencia de los mortales, hacen que no supongan una amenaza para los seres sobrenaturales del Mundo de Tinieblas. Las fes que desean mantener a los mortales en la ignorancia los consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_hostile_tooltippable$ o $hostility_evil_tooltippable$."
 
 special_doctrine_fivefold_path_kindred_name: "Camino Quíntuple"
 special_doctrine_fivefold_path_kindred_desc: "Los cinco [Glossary('Dharma','podgloss.dharma')] tradicionales creados por el primer [Glossary('Arhat','podgloss.arhat')], [GetScriptedCharacterByHistoryID('791111').GetFirstName]. Forman el núcleo tradicional de la sociedad $pod_kueijin$.\nLos seguidores del Camino Quíntuple ven a los [Glossary('Dharma','podgloss.dharma')] heréticos como dolorosamente engañados o como traidores peligrosos que deben ser eliminados para siempre."
