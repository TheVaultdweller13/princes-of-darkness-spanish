 special_doctrine_conspiracy_of_rebels_kindred_name: "Conspiración de Rebeldes"
 special_doctrine_conspiracy_of_rebels_kindred_desc: "Unidos en solidaridad contra el orden establecido de la sociedad de los Vástagos, estos rebeldes conspiran para derrocar a los Antiguos."
 doctrine_parameter_hostility_override_special_doctrine_conspiracy_of_rebels_kindred: "Otras [faiths|E] de Vástagos que tengan el [doctrine|E] [GetFaithDoctrine('special_doctrine_conspiracy_of_rebels_kindred').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_hostile_tooltippable$" 
 
 tenet_philosophical_combat_name: "Combate Filosófico"
 tenet_philosophical_combat_desc: "Perder un debate en el foro puede ser tan mortal como perder una batalla."
 
 tenet_constantinian_name: "Teología Constantiniana"
 tenet_constantinian_desc: "Las hadas que buscaban entender los detalles de la fe humana siempre fueron vistas como quienes seguían un camino de estudio bastante inútil, hasta ahora. Los Constantinianos han disfrutado de un gran aumento de miembros durante los años de la Tregua Jurada. Llamados así por el emperador Constantino I, estas hadas buscan conocer más sobre las religiones humanas, especialmente la Iglesia Cristiana.\n\nQuienes siguen este camino de investigación y deducción suelen hacerlo por una de dos razones principales: comprender el fenómeno de la fe y encontrar una forma de equilibrarlo con el lugar de las hadas en el mundo; o buscar cualquier debilidad en el nuevo poder de la humanidad, y encontrar una forma de explotarla."
 
