 doctrine_fae_agenda_name: "Agenda"
 
 doctrine_fae_agenda_militant_name: "Militante"
 doctrine_fae_agenda_militant_desc: "Muchas hadas están deseando que termine la Tregua Jurada para poder volver a los compromisos de la Guerra de las Estaciones. Las emociones y la lealtad que inspira ser Ordenado en una Corte son feroces y difíciles de dejar de lado por cualquier motivo. Casi todos los miembros de las Cuatro Cortes creen sinceramente que su forma de vida es la verdadera, ya sea en forma de un mundo mejor para todos, o simplemente porque el más fuerte merece gobernar. La reanudación de la guerra de las hadas no infunde Temor en el corazón de muchas de las hadas facciosas: es una señal de que la batalla para decidir el destino del mundo puede por fin comenzar."
 doctrine_fae_agenda_trucebearer_name: "Portador de la Tregua"
 doctrine_fae_agenda_trucebearer_desc: "«Portador de la Tregua» es un término aplicado a las hadas que buscan poner fin a la Guerra de las Estaciones, ya sea extendiendo la Tregua Jurada indefinidamente, o forjando un nuevo tratado duradero que cese las hostilidades entre las cortes. Los Portadores de la Tregua de todas las Cortes suelen ser individuos aislados o pequeños grupos de hadas que trabajan con fervor en el terreno social para inclinar a las cortes locales hacia la paz. Como era de esperar, rara vez tienen éxito, pero esto solo aviva el fuego en sus corazones. La paz, sin importar el precio, es su vocación."
 doctrine_fae_agenda_humanist_name: "Humanista"
 doctrine_fae_agenda_humanist_desc: "La facción Humanista no necesariamente aboga por la amabilidad y la tolerancia al tratar con el Señorío humano, sino que abraza una ética centrada sobre todo en comprender a la humanidad. Los humanos poseen ahora un número y un poder que superan a los de las propias hadas. Los Humanistas creen que ha llegado el momento de reunir información sobre los humanos, tratar con ellos, forjar nuevos juramentos y, en todo caso, buscar un equilibrio entre las dos razas antes de que sea demasiado tarde. Desean alcanzar un nivel de codependencia con los humanos, en el que se reconozca de nuevo a las hadas y se las valore y respete... o simplemente se las valore y tema."
 doctrine_fae_agenda_constantinian_name: "Constantiniano"
 doctrine_fae_agenda_constantinian_desc: "Los Constantinianos también pueden usar el [hostile_scheme|E] [GetScheme('inquihunt').GetTypeName] de [GetTrait('supehunter').GetName( GetPlayer )] contra un [GetTrait('vampire').GetName( GetPlayer )].\n\n$tenet_constantinian_desc$"
 doctrine_fae_agenda_none_name: "Indeciso"
 doctrine_fae_agenda_none_desc: "Ninguna agenda en particular parece atractiva. Los Militantes, los Portadores de la Tregua, los Humanistas y los Constantinianos tienen todos argumentos válidos, y muchas hadas aún no han decidido cuál es el camino a seguir." 
