 doctrine_nomarriage_name: "Sin Matrimonio"
 doctrine_nomarriage_desc: "Esta fe no tiene matrimonios."
 
 doctrine_onlyconcubines_name: "Solo Concubinas"
 doctrine_onlyconcubines_desc: "Esta fe solo permite concubinas, no cónyuges."
 
 tenet_apotheosis_name: "Apoteosis"
 tenet_apotheosis_desc: ""
 
 tenet_bloodcommunion_name: "Comunión de Sangre"
 tenet_bloodcommunion_desc: "La Comunión de Sangre de los Adherentes de la Apoteosis es una versión impía de los rituales de comunión mortales. Dentro de la fe, cumple muchas de las mismas funciones. La sangre, por supuesto, no es simbólica: proviene de un sacrificio humano."

 tenet_exaltedideals_name: "Ideales Exaltados"
 tenet_exaltedideals_desc: "La perfección en el intelecto, el cuerpo y la belleza es el ideal, mientras que lo contrario es un crimen. La perfección no es solo un estado mental, sino una razón para hacer la guerra a los inferiores." 
 
 tenet_willing_embrace_name: "Abrazo Voluntario"
 tenet_willing_embrace_desc: "Sumir a otra alma en la condenación eterna no es un asunto trivial. El candidato potencial al $pod_Embrace$ debe saber perfectamente a qué se compromete." 
 doctrine_parameter_willing_embrace: "Antes de cualquier $pod_Embrace$, tendrás que convencer a la víctima de convertirse en vampiro."
 doctrine_parameter_ashirra_second_embrace: "Desbloquea un evento especial de educación de Chiquillos"
 doctrine_parameter_cannot_embrace_prisoners: "No puede $pod_Embrace$ a [prisoners|E]"
 doctrine_parameter_willing_embrace_restrictions: "No puede $pod_Embrace$ a #TOOLTIP:GAME_TRAIT,supehunter,[GetNullCharacter] #L Cazadores#!, #TOOLTIP:GAME_TRAIT,ghoul,[GetNullCharacter] #L Ghouls#!, ni a #TOOLTIP:GAME_TRAIT,changeling,[GetNullCharacter] #L changelings#!"

 tenet_mercy_for_vanquished_name: "Piedad para los Vencidos"
 tenet_mercy_for_vanquished_desc: "Una vez que un enemigo se rinde, debe ser tratado con la dignidad y el respeto propios de su condición. Si el cautivo o su familia no pueden pagar el rescate, deben ser liberados por piedad.\n\nUn enemigo en batalla debe ser matado, pero un enemigo derrotado debe ser tratado con toda cortesía, con la esperanza de que algún día encuentre su camino hacia las filas de los fieles.\n\nNo sirve de nada detenerse en lo que pudo haber sido ni atormentarse por hechos pasados. El guerrero solo mira hacia la próxima batalla, y espera desenvolverse bien en ella."
 doctrine_parameter_frequent_kingdom_holy_wars: "Los [holy_wars|E] contra Reinos pueden declararse cada 25 años en lugar de cada 50"
 doctrine_parameter_house_arrest_only: "Los [prisoners|E] solo pueden ponerse bajo [house_arrest|E]"
 house_arrest_only_tooltip: "Esta fe solo permite el [house_arrest|E]"
 doctrine_parameter_piety_from_releasing: "Ganas [piety|El] al liberar sin exigencias a personajes $hostility_hostile_tooltippable$ o $hostility_evil_tooltippable$"
 doctrine_parameter_prisoner_conversion_higher_chance: "Los prisioneros tienen más probabilidades de aceptar la conversión a cambio de su libertad"
 prisoner_conversion_higher_chance_tooltip: "Los preceptos de tu fe: $VALUE|=+0$" 
 doctrine_parameter_executing_hostile_evil_vampires_costs_piety: "Ejecutar a personajes [GetTrait('vampire').GetName(GetPlayer)] de fes $hostility_hostile_tooltippable$ o $hostility_evil_tooltippable$ cuesta [piety|El]"

 tenet_struggles_of_desert_name: "Contiendas del Desierto"
 tenet_struggles_of_desert_desc: "Al pueblo de las arenas se le enseña a afrontar cada desafío directamente, sin depender de nada más que las cualidades que Alá les dio para salir adelante. Solo hay una respuesta ante la adversidad: superarla con valor y astucia puros.\n\nEstos vampiros se ven constantemente impulsados a poner a prueba su valentía y sus habilidades, aceptando de buen grado cualquier desafío y prevaleciendo con puro talento y destreza. Prefieren las pruebas noche tras noche de un errante, donde no hay garantía de refugio ni sustento."

 tenet_ashen_faith_name: "Fe de Cenizas"
 tenet_ashen_faith_desc: "La mayoría de los Caminos vampíricos son sobre todo filosofías, ligadas solo al individuo. Pero tu fe no lo es: traes la salvación a todos los $pod_cainites$ y la palabra debe difundirse." 
 doctrine_parameter_ashen_faith: "La [character_interaction|E] de Exigir Conversión tiene más probabilidades de tener éxito. Desbloquea la obligación de vasallo de Influencia del Culto."
 ASHEN_FAITH: "Precepto de la Fe de Cenizas $VALUE|=+0$"

 tenet_the_pyramid_name: "La Pirámide"
 tenet_the_pyramid_desc: "Asediados por todos lados por enemigos poderosos, la principal defensa de los Tremere es su total obediencia a un orden jerárquico muy estricto." 
 doctrine_parameter_the_pyramid: "Los Vasallos no pueden declarar guerras contra otros Vasallos sin un Anzuelo sobre su Señor."
  
 tenet_feral_vampires_name: "Vampiros Salvajes"
 tenet_feral_vampires_desc: "Las tierras salvajes son nuestros cazaderos, y nuestros guardianes del saber se aseguran de que nuestro legado sea escuchado." 
 doctrine_parameter_feral_lorekeepers: "Puede usar la decisión de Encargar Obra Épica sin ninguna ventaja, pero siempre resultará en una canción."
 doctrine_parameter_can_hunt: "Puede usar la decisión de Cazar, incluso siendo vampiro."
 can_hunt_name: "Puede cazar"
 doctrine_parameter_city_aversion: "Pierde el acceso a los edificios que representan influencia en los asuntos de la ciudad, recibiendo en su lugar variantes rurales."
 
 tenet_old_ways_name: "Viejas Costumbres"
 tenet_old_ways_desc: "Han pasado siglos desde que el Norte mortal veneraba y seguía a los saqueadores más audaces por encima de los ricos mercaderes y los nobles taimados. Muchos vampiros lo ven como un desarrollo de lo más lamentable." 
    
 tenet_sanctioned_diableries_name: "Diablerie Sancionada"
 tenet_sanctioned_diableries_desc: "Los Hijos de Haqim deben reclamar la sangre de los indignos, pero cuidado con el juez precipitado." 
 doctrine_parameter_sanctioned_diableries: "Durante una $pod_diablerie$, si tu víctima es cobarde, arbitraria o de una religión Malvada, el coste de piedad se reducirá. Si la víctima es valiente, justa o de una religión Justa, el coste aumentará."
 
 COURT_CHAPLAIN_CONVERSION_SECRET_CULT_PENALTY: "Penalización por tener el precepto de Culto Secreto."

 tenet_secret_cult_name: "Culto Secreto"
 tenet_secret_cult_desc: "Esta fe se organiza como una especie de conspiración en las sombras. Pocos conocen realmente su existencia, y así les gusta." 
 doctrine_parameter_secret_cult: "Puede reclutar a [GetMaA('cultists').GetName] como [men_at_arms|E]"
 tenet_noblesse_oblige_name: "Noblesse Oblige"
 tenet_noblesse_oblige_desc: "Los gobernantes se toman la responsabilidad de los señores hacia sus vasallos muy en serio. Administrar el sistema de vasallaje con justicia debería dar como resultado vasallos felices. Vasallos felices significan un señor de éxito."

 tenet_knowledge_above_all_name: "El Conocimiento Ante Todo"
 tenet_knowledge_above_all_desc: "El gran misterio es demasiado importante para dejarse limitar por mezquinas preocupaciones morales." 
 doctrine_parameter_experiments_on_prisoners: "Da acceso a un método especial de ejecución."
 EXECUTION_EXPERIMENTS: "Experimenta con Ellos"
 
 tenet_moments_of_truth_name: "Momentos de Verdad"
 tenet_moments_of_truth_desc: "¿Un destello de inspiración? ¿Un mensaje de los poderes superiores? En cualquier caso, un acontecimiento tan trascendental puede cambiar a cualquier persona hasta la médula." 
 doctrine_parameter_moments_of_truth: "Da acceso a una forma especial de aliviar el estrés que te permite cambiar tus rasgos."
 
 stress_threshold.7001.t: "Crisis Mental: Momento de Verdad"
 stress_threshold.7001.desc: "Has recibido una revelación. Tus problemas actuales han sido una prueba del Todopoderoso para evaluar tu valía. Un momento tan raro de claridad podría ser la ocasión para que hagas un voto.\nSin duda, hay defectos en tu personalidad en los que podrías trabajar, con la esperanza de acercarte más a lo Divino en el proceso."
 stress_threshold.7001.a: "¡La justicia es cosa de débiles!"
 stress_threshold.7001.b: "¿He perdido mi Humanidad?"
 stress_threshold.7001.c: "Debo mantenerme concentrado."
 stress_threshold.7001.d: "¡Necesito más!"
 stress_threshold.7001.e: "¡Todos están aquí para atraparme!"
 stress_threshold.7001.f: "¿Y si no todos están aquí para atraparme?"

 tenet_honor_and_bravery_name: "Honor y Valentía"
 tenet_honor_and_bravery_desc: "¡Un verdadero gobernante de la noche lidera desde el frente, abriéndose paso sin temor a través de cualquier enemigo lo bastante necio como para interponerse en su noble propósito!" 
 doctrine_parameter_battle_winning_prestige: "Ganas más prestigio al ganar batallas."
 
 tenet_community_name: "Comunidad"
 tenet_community_desc: "El buen pastor cuida de su rebaño. Que se multiplique y crezca, y que ningún depredador se le acerque." 
 doctrine_parameter_access_to_develop_capital: "Tienes acceso a la decisión de Desarrollar la Capital, y cuesta menos estrés."
 
 tenet_svadharma_name: "Svadharma"
 tenet_svadharma_desc: "Los adherentes de este Camino creen que han caído fuera del ciclo de reencarnaciones. La única forma de enmendarlo es seguir un nuevo conjunto de deberes, ayudando a otros a encontrar su propio camino, les guste o no." 
 doctrine_parameter_access_to_improve_scheme: "Tienes acceso a la decisión de Mejorar Conjuras."
 
 tenet_lilithmaid_name: "Lilith, la Doncella"
 tenet_lilithmaid_desc: "La Doncella se enfurece y maldice contra el destino trazado ante ella. No será propiedad de ningún hombre, nación, ni siquiera de Dios." 
 
 tenet_lilithmother_name: "Lilith, la Madre"
 tenet_lilithmother_desc: "La Doncella se convierte en la Madre a través del dolor y finalmente comprende que es lo único constante en este mundo." 
  
 tenet_lilithcrone_name: "Lilith, la Anciana"
 tenet_lilithcrone_desc: "La Anciana ha poblado el mundo y ahora usa su conocimiento para guiarlos por él." 
   
 tenet_aphrodisiac_saturnalia_name: "Afrodisíaco y Saturnales"
 tenet_aphrodisiac_saturnalia_desc: "Los rituales de Primavera e Invierno son pilares de la vida de esta fe. Ser elegido organizador de esos eventos es un gran honor." 
 doctrine_parameter_aphrodisiac_saturnalia: "Tienes acceso a dos nuevos puestos en la corte: el Señor del Desgobierno y el Celebrante Afrodisíaco."
  
 tenet_fire_fury_name: "Fuego y Furia"
 tenet_fire_fury_desc: "Todo el sistema político vampírico está corrupto y debe ser derribado. Y las negociaciones pacíficas ya no son una opción." 
 
 tenet_helios_truth_name: "La Verdad de Helios"
 tenet_helios_truth_desc: "Helios enseña a los Garou a templar su instinto y su Furia con pensamiento y lógica. Así, quienes lo siguen a menudo se convierten en hábiles diplomáticos y negociadores. A menudo, el mayor problema para lograr una tregua, un tratado o una alianza es conseguir que la otra parte escuche el argumento que plantea el personaje. Helios valora la verdad y la justicia. Helios aporta razón y tacto a los hombres lobo que lo honran."
 
 tenet_summer_festivals_name: "Festivales de Verano"
 tenet_summer_festivals_desc: "La Corte de Verano se enorgullece de su adhesión a la tradición y la estructura, y de su estricta observancia de la disciplina. Parte de estas Tradiciones son los populares festivales durante la parte más calurosa del verano, que encarnan la risa, la alegría y la libertad. Ofrecen una excusa para reunir tanto Glamour como sea posible de los sueños de calor de los humanos, y mientras dura el festival, las hadas tienen permitido jugar con cualquier mortal que encuentren. Las festividades del Pleno Verano de los Seelie les permiten, durante un breve día, usar a los mortales sin vergüenza como juguetes, y entregarse a bromas y travesuras."
 
 tenet_ivory_priesthood_name: "Sacerdocio de Marfil"
 tenet_ivory_priesthood_desc: "Cuando el Primer Lobo murió para salvar a Gaia, aprendió el «Secreto de la Muerte». El Sacerdocio de Marfil es una sociedad secreta de Teúrgos Colmillo de Plata que, tras someterse a una serie de pruebas y desafíos espirituales, comienzan a aprender estos mismos secretos sobre lo que se halla más allá del velo de la Muerte."
 
 tenet_hexcraft_name: "Arte de las Maldiciones"
 tenet_hexcraft_desc: "Maestría del mal de ojo, la maldición, el mal mojo, el Amria. Ten cuidado de no contrariarlos o te encontrarás en el extremo receptor de una maldición. Tus entrañas se retorcerán en nudos y te dejarán vomitando y débil como un cachorro durante una semana. Sus maldiciones les ayudan en toda clase de conjuras siniestras."
 
 tenet_vengeance_of_nut_name: "Venganza de Nut"
 tenet_vengeance_of_nut_desc: "Aquellos que buscan venganza por Nut se dedican a la destrucción de vampiros. Vengan una Tierra Natal perdida y a los suyos perdidos. Los Dagas actúan como asesinos allá donde vagan, seleccionando en silencio a una Sanguijuela o tres para su extinción. Son expertos en 'Encontrar la Guarida' de los no-muertos."
 doctrine_parameter_find_the_lair_active: "Desbloquea el [journey|E] de Encontrar la Guarida."
 
 tenet_way_of_zhong_kuei_name: "Camino de Zhong Kuei"
 tenet_way_of_zhong_kuei_desc: "La metodología para sofocar demonios no-muertos desarrollada por Zhong Kuei. Quienes siguen este Camino son expertos en 'Encontrar la Guarida' de los vampiros."



 tenet_banepossession_name: "Posesión de Bane"
 tenet_banepossession_desc: "Los Banes son espíritus malignos al servicio del Wyrm. Los Banes abarcan toda la gama, desde débiles y relativamente inofensivos hasta criaturas horriblemente poderosas capaces de desgarrar la realidad a su alrededor. Los Banes débiles se usan con frecuencia para infectar a humanos y Animales, convirtiéndolos en fomori. Los cultos del Wyrm consideran una tarea sagrada encontrar anfitriones para los Banes."
 
 past_lives_name: "Vidas Pasadas"
 past_lives_doctrine_name: "Vidas Pasadas"
 past_lives_doctrine_desc: "Para los mayores héroes, la muerte no es el final. Los Garou más sabios y fuertes perduran, permaneciendo como espíritus para guiar a sus descendientes en la gran Contienda. Los Contempladores de Estrellas y los Hijos de Gaia lo ven como una reencarnación literal de héroes Garou en sus descendientes. Algunos sienten que es más bien un registro colectivo de la raza, como el Registro Akáshico. Otros Garou lo consideran más una guía de espíritus ancestrales. Las visiones que llegan pueden compartir sabiduría importante e incluso habilidades prácticas. A veces, parece como si el Garou estuviera incluso poseído por el espíritu de su antepasado. Más raramente aún, ese antepasado estaba y, al parecer, sigue estando loco."
 
 wyrm_tainted_name: "Mácula del $glossary_wyrm$"
 wyrm_tainted_doctrine_name: "Mácula del $glossary_wyrm$"
 wyrm_tainted_doctrine_desc: "Muchos $glossary_fera$ que veneran a Gaia tienen un don que les permite sentir la mácula del $glossary_wyrm$ en otros. Esta mácula puede tomar muchas formas. Una mácula común son los Caminos vampíricos y los Caminos de Iluminación, considerados tan corruptos que sus seguidores son intrínsecamente vistos como manchados por el Wyrm."
 doctrine_parameter_hostility_override_wyrm_tainted_doctrine: "Las [faiths|E] con [GetFaithDoctrine('wyrm_tainted_doctrine').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 tenet_bacchanal_name: "Bacanal"
 tenet_bacchanal_desc: "Dedicado a las juergas de borrachera, este precepto hace que la reducción de estrés de la decisión de beber sea el doble de efectiva. Algunos considerarían el consumo de tales tóxicos una peligrosa adicción."  
 
 tenet_neter_sentra_name: "Neter Sentra"
 tenet_neter_sentra_desc: "El aliento de lo divino: las plegarias son llevadas a los cielos por el humo. El culto del humo divino ha adoptado la novedosa innovación de no solo comer pasteles de hachís, sino fumarlos. Experimentan con una variedad de exóticos inciensos y humos potencialmente peligrosos. Este precepto hace que la reducción de estrés de la decisión hashishiyah sea el doble de efectiva."  
 
 tenet_paranoia_name: "Paranoia"
 tenet_paranoia_desc: "¡Que seas paranoico no significa que no vayan a por ti!" 
 
 tenet_advocatus_diaboli_name: "Advocatus Diaboli"
 tenet_advocatus_diaboli_desc: "Satán y sus esbirros poseen formidables poderes de persuasión, una asombrosa capacidad para engañar a otros y hacer que actúen en favor de sus fines demoníacos." 
 
 tenet_collectivism_name: "Colectivismo"
 tenet_collectivism_desc: "Originado en el antiguo uniformitarismo chino, se dedica a construir un colectivo similar a un Leviatán, creando un concepto colectivo del cuerpo erudito mediante un adoctrinamiento flexible y leyes estrictas, hasta crear finalmente una voluntad colectiva unificada."
 

 
