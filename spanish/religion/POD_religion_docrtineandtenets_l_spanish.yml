 doctrine_parameter_can_perform_vaulderie: "Puede realizar la Vaulderie con miembros de [coterie|E] mediante [decision|E]"
 doctrine_parameter_overwork_capital_unlocked: "Desbloquea la [decision|E] #V $overwork_capital_decision$#!, aumentando el [development|E] a cambio de [prestige|E] y [masquerade_exposure_with_icon|E]"

 stygia_hostility_name: "Hostilidad de Stygia"
 special_doctrine_is_legion_faith_name: "Legionario"
 special_doctrine_is_legion_faith_desc: "Para los wraiths estigios, la Jerarquía es la sociedad y las ocho Legiones son la Jerarquía."
 doctrine_parameter_hostility_override_special_doctrine_is_legion_faith: "Las [faiths|E] de Legión se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 special_doctrine_is_great_guild_faith_name: "Grandes Gremios"
 special_doctrine_is_great_guild_faith_desc: "Estos gremios son necesarios para que Stygia y la sociedad de los wraiths funcionen. Como resultado, operan más o menos abiertamente como organizaciones basadas en Arcanos."
 doctrine_parameter_hostility_override_special_doctrine_is_great_guild_faith: "Las [faiths|E] de los Grandes Gremios se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 special_doctrine_is_working_guild_faith_name: "Gremios de Trabajo"
 special_doctrine_is_working_guild_faith_desc: "Los gremios de esta categoría se consideran "de clase trabajadora"; es decir, están formados por wraiths que se ganan la vida día a día mediante sus Arcanos."
 doctrine_parameter_hostility_override_special_doctrine_is_working_guild_faith: "Las [faiths|E] de los Gremios de Trabajo se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 special_doctrine_is_criminal_guild_faith_name: "Gremios Criminales"
 special_doctrine_is_criminal_guild_faith_desc: "Estos gremios no solo son ilegales, sino que violan el Dictum Mortuum o son conocidos por violar flagrantemente la ley estigia."
 doctrine_parameter_hostility_override_special_doctrine_is_criminal_guild_faith: "Las [faiths|E] de los Gremios Criminales se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 special_doctrine_is_forbidden_guild_faith_name: "Gremios Prohibidos"
 special_doctrine_is_forbidden_guild_faith_desc: "También llamados los Gremios Menores por no haber sido invitados a firmar el Pacto de los Gremios, estos grupos son perseguidos por la Jerarquía y temidos por la sociedad de los wraiths."
 doctrine_parameter_hostility_override_special_doctrine_is_forbidden_guild_faith: "Las [faiths|E] de los Gremios Prohibidos se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 
 tenet_eyes_of_gaia_name: "Ojos de Gaia"
 tenet_eyes_of_gaia_desc: "En lugar de recibir un propósito específico, cada tribu Bastet intenta llenar un vacío donde otros no supieron actuar. Los Garou (y algunos otros) los llaman los Ojos de Gaia por su amor al conocimiento secreto."
 doctrine_parameter_access_rush_schemes: "Obtienes acceso a la decisión menor de Acelerar Conjuras."
 tenet_kind_warriors_name: "Guerreros Amables"
 tenet_kind_warriors_desc: "Los Gurahl son defensores y sanadores entre las Razas Cambiantes y los protectores originales de Gaia. Aunque conocidos por ser gentiles y lentos para enfadarse, ni siquiera la muerte puede impedirles cumplir con su deber."
 doctrine_parameter_raiding_forbidden: "No puede [raid|E]"
 
 tenet_amakusa_rite_name: "Rito de Amakusa"
 tenet_amakusa_rite_desc: "Mediante la mezcla de $pod_vitae$ en un cuenco compartido y fortalecida con los ritos y respetos adecuados, las Pócimas que rompen la opresión e igualan a todos bajo la noche pueden liberar a la Tribu de Sangre, para que su revolución eterna pueda seguir librándose sin temor al Vínculo de Sangre ni carecer de medios para hacerlo."
 
 tenet_cruelty_of_stars_name: "Crueldad de las Estrellas"
 tenet_cruelty_of_stars_desc: "Detrás de cada gran fortuna hay un crimen aún mayor. Los mortales son carne, y el demonio de sangre es el consumidor. La Iluminación es un juego de pobres. Empújalos, quiébralos, róbales, y oblígalos a ganárselo de vuelta mientras los convences de que fue un buen trato. Deja que te llamen Infernalista. Tienes dinero que ganar."
 
 tenet_physical_ascension_name: "Ascensión de la Carne"
 tenet_physical_ascension_desc: "El objetivo de todos los Buscadores es hacer ascender su carne mortal a un estado conocido como [GetTrait('azhi_dahaka').GetName(GetPlayer)]. Un estado en el que se separan por completo de la Creación, para ser una voluntad autosuficiente en un universo que ya no tiene poder sobre el ego."
 doctrine_parameter_azhi_dahaka_journey_bonus: "Aumenta la [planning_speed|E] del [journey|E] #bold Búsqueda de Azhi Dahaka#! en #P +25%#!"

 tenet_burn_the_inferno_name: "Quema el Infierno"
 tenet_burn_the_inferno_desc: "Las armas de los [akuma|E] se volverán contra ellos. Ningún sacrificio es demasiado grande, ninguna traición demasiado pequeña."
 doctrine_parameter_recruit_deviltiger_banes: "Puede reclutar a [GetMaA('rat_headed_dragonfly_demon').GetName], [GetMaA('sleeper_seducing_bane').GetName] y [GetMaA('face_robe_demon').GetName] como [men_at_arms|E]"


 land_of_faith_controlled_name: "La Tierra de la Fe"
 special_doctrine_land_of_faith_controlled_name: "La Tierra de la Fe"
 special_doctrine_land_of_faith_controlled_desc: "La Tierra de la Fe está bajo nuestro control, y nos beneficiamos enormemente del Sekhem que otorga."

 unproven_dharma_name: "[Glossary('Dharma','podgloss.dharma')] No Demostrado"
 special_doctrine_unproven_dharma_name: "[Glossary('Dharma','podgloss.dharma')] No Demostrado"
 special_doctrine_unproven_dharma_desc: "No todos los [Glossary('Dharma','podgloss.dharma')] han demostrado ser un camino hacia las [Glossary('Cien Nubes','podgloss.hundredclouds')]. Para aquellos que nunca tuvieron una ascensión registrada, el temor de estar en un callejón sin salida siempre es una preocupación."
 doctrine_parameter_unproven_dharma_parameter: ""
 
 tenet_obeisance_to_devils_name: "Homenaje a los Diablos"
 tenet_obeisance_to_devils_desc: "Existimos por debajo de los Dioses Menores. Debemos permanecer inadvertidos, fuera del escrutinio, no sea que provoquemos nuestra aniquilación."
 doctrine_parameter_hostility_override_tenet_obeisance_to_devils: "Las [faiths|E] que tengan el [doctrine|E] [GetFaithDoctrine('tenet_obeisance_to_devils').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de #V Hostiles#!" 


 tenet_fera_innovative_name: "Innovador"
 tenet_fera_innovative_desc: "El progreso tecnológico es la ventaja más importante que se puede tener. Aunque la mayoría de los Garou son escépticos ante la innovación, en el mejor de los casos, algunos seguidores del $glossary_weaver$ impulsan abiertamente la innovación, no solo para su propia adopción, sino para la humanidad en general."

 tenet_one_blade_name: "Uno con la Hoja"
 tenet_one_blade_desc: "Los Hakken son los principales guerreros y protectores de los Hengeyokai. Con este fin, muchos de ellos dedican su vida a dominar la hoja."
 doctrine_parameter_katana_crafting: "Las espadas [crafting_forged|E] serán siempre Katanas"
 doctrine_parameter_no_sword_fetish_upkeep: "Los [fetishes|E] de Espada y Katana no requieren mantenimiento de $POD_energy_gnosis$"
 doctrine_parameter_pack_training_blademaster: "Entrenar [prowess|E] con tu [GetPlayer.Custom('PODCoterie')] otorga [trait_level_track_xp|E] de [GetTrait('lifestyle_blademaster').GetName(GetPlayer)]"

 tenet_wolves_of_sable_name: "Lobos de Sable"
 tenet_wolves_of_sable_desc: "Sable es la cazadora invisible en las ventiscas; cavilando en silencio, esperando con paciencia, atacando sin previo aviso y desapareciendo de nuevo en el hielo, la nieve y el viento, dejando solo una o dos gotas de sangre como prueba de que alguna vez estuvo allí. Es la pequeña superviviente, fortalecida por su entorno y templada por su soledad. Representa a la cazadora inesperada y la supervivencia del más apto contra las peores adversidades. Los Hijos de Sable son considerados aliados por los espíritus del viento y pueden invocarlos y hablarles libremente. Sable confía en sus hijos para proteger sus tierras siberianas. Halcón considera a todos los Hijos de Sable salvajes deshonrados y mestizos, y bajo ninguna circunstancia tolerará Halcón la pertenencia de un Siberakh a una manada que él haya elegido como propia." 

 tenet_soldiers_of_the_wyrm_name: "Soldados del Wyrm"
 tenet_soldiers_of_the_wyrm_desc: "Somos los soldados del $glossary_wyrm$, no de sus siervos inferiores. Nuestra gloria será vista, nuestra fe recompensada."
 doctrine_parameter_reduced_urgetaints_xp: "Reduce la [lifestyle_experience|E] de [urgetaints_lifestyle|E] obtenida en #N -25%#!"

 tenet_secrets_of_flesh_name: "Secretos de la Carne"
 tenet_secrets_of_flesh_desc: "Mucha sabiduría yace latente en la carne. La Letanía ya no nos lo negará."
 doctrine_parameter_wyrm_education_lifestyle_xp_from_cannibalism: "Ganas [lifestyle_experience|E] equivalente a tu [education|E] al devorar a otros personajes, escalando con la edad de la víctima"
 doctrine_parameter_infamy_renown_from_cannibalism: "Ganas $POD_fera_renown_infamy$ de Renombre $glossary_fera$ al devorar a personajes mayores de 200 años"

 tenet_centipede_embrace_name: "Abrazo de la Ciempiés"
 tenet_centipede_embrace_desc: "La [Glossary('Ciempiés', 'glossary_wyrm_tt')] crecerá sin fin, alimentándose de la propia tierra."
 doctrine_parameter_ignore_dragon_nest_requirements: "Ignora todos los requisitos de [development|E] en los [duchy_buildings|E] del Nido del Dragón"

 tenet_wyrm_seekers_name: "Buscadores del Wyrm"
 tenet_wyrm_seekers_desc: "El $glossary_wyrm$ posee mucho conocimiento y poder; solo hay que buscarlo."
 doctrine_parameter_increased_urgetaints_xp: "Aumenta la [lifestyle_experience|E] de [urgetaints_lifestyle|E] obtenida en #P +25%#!"

 tenet_channel_darkness_name: "Canaliza la Oscuridad"
 tenet_channel_darkness_desc: "Somos uno con la oscuridad, meros fantasmas en la noche. Nos movemos sin ser vistos hasta que nuestras sombras descienden sobre los necios que se interponen en nuestro camino."
 doctrine_parameter_unlock_shadow_shapeshift: "Desbloquea la opción de Cambio de Forma [GetModifier('POD_shapeshift_form_shadow_modifier').GetNameWithTooltip]"

 tenet_hypnotic_serpent_name: "Encanto de la Serpiente Hipnótica"
 tenet_hypnotic_serpent_desc: "[Glossary('Cahlash', 'glossary_wyrm_tt')] nos llama y responderemos. Pronto, los demás también aprenderán a hacerlo."
 doctrine_parameter_learn_secrets_from_seduction: "Las [schemes|E] de [GetScheme('seduce').GetTypeName] exitosas revelan todos los [secrets|E] que conoce el objetivo, incluidos los suyos propios."


 tenet_vengence_sobek_name: "Venganza por Sobek"
 tenet_vengence_sobek_desc: "Las tierras serán purificadas. Los ríos fluirán. Los vientos soplarán. Los templos serán consagrados. El sol arderá. Las serpientes se quemarán."

 tenet_flames_agni_name: "Llamas de Agni"
 tenet_flames_agni_desc: "Aunque todos los Mokolé veneran al Dragón, los seguidores del Orden Cósmico se refieren a él como Agni, el Dios del Fuego, el Portador de Ofrendas y el Portavoz del Wani. Agni es fuerte y sabio a la vez; sus llamas protegen a sus seguidores y queman a sus enemigos.\nUna llama eterna arde dentro de cada uno de sus hijos elegidos; solo necesitan encenderla."
 doctrine_parameter_unlock_agni_totem: "Puede elegir [GetModifier('agni_totem_modifier').GetNameWithTooltip] en lugar de [GetModifier('dragon_totem_modifier').GetNameWithTooltip] como Tótem de [GetPlayer.Custom('PODCoterie')]."
 doctrine_parameter_gain_fire_immunity: "Ganas inmunidad al Daño de fuego."

 tenet_lords_rivers_name: "Señores de los Ríos"
 tenet_lords_rivers_desc: "Muchos Zhong Lung eligen vivir junto a los grandes ríos de Zhong Guo. La Corriente de Agua ejerce un dominio aterrador sobre los ríos; un Mokolé joven normalmente tendría dificultades para controlar un pequeño arroyo, mientras que un Dragón movería un río entero.\nLos Dragones se contienen en gran medida al ejercer estos poderes, pues de lo contrario tendría consecuencias catastróficas para la tierra."
 doctrine_parameter_gnosis_from_river_provinces: "Los [counties|E] Ribereños poseídos de esta fe otorgan Regeneración de $POD_energy_gnosis$: #P 2.5%#!."
 doctrine_parameter_reduces_flood_weather_cost: "Reduce el coste de la Magia del Clima #V Inundación#!."

 tenet_dragon_princes_name: "Príncipes Dragón"
 tenet_dragon_princes_desc: "Los Wani son los Príncipes Dragón de Zhong Guo, gobernando las nubes y el ascenso y descenso del agua, y presidiendo las casas reales de la humanidad. Los Zhong Lung, con su forma dracónica Archid, son los hijos de los Wani. Las otras razas a veces lo discuten, hasta que un rayo les hace reconsiderarlo."
 doctrine_parameter_can_learn_galliard_gifts: "Puede aprender Dones de [GetTrait('galliard').GetName( GetPlayer )] del [lifestyle|E] [lunar_auspicegifts_lifestyle|E]."

 tenet_outlast_world_name: "Sobrevivir al Mundo"
 tenet_outlast_world_desc: "No necesitamos a nadie más que a nosotros mismos. Nuestras pieles son gruesas, y nuestros Espíritus fuertes. El mundo puede quebrarse, pero nosotros seguiremos en pie."

 tenet_pilgrims_waves_name: "Peregrinos de las Olas"
 tenet_pilgrims_waves_desc: "Los mares guardan mucho peligro y sabiduría; solo navegándolos podemos fortalecer nuestros Espíritus. La adversidad puede fomentar la esperanza y la resiliencia."
 doctrine_parameter_dreaming_sands_pilgrimage: "Completar [pilgrimages|E] otorga [lifestyle_experience|E] de Errante y Renombre $glossary_fera$ de $POD_fera_renown_wisdom$"
 doctrine_parameter_faith_can_raid_oversea: "Permite [raiding|E] a través de los mares"


 tenet_gaia_memory_name: "Memoria de Gaia"
 tenet_gaia_memory_desc: "Nuestro cometido siempre ha sido ser la Memoria de Gaia. Es nuestro deber guiar a las demás Razas Cambiantes y enseñarles la larga historia de los $glossary_fera$ y las tareas que Gaia nos encomendó."
 doctrine_parameter_pack_training_coterie_xp: "Entrenar con tu [GetPlayer.Custom('PODCoterie')] otorga Renombre $glossary_fera$ de $POD_fera_renown_wisdom$ a todos los miembros"


 tenet_sun_blessed_name: "Bendecidos por el Sol"
 tenet_sun_blessed_desc: "El Celestino Helios ha otorgado su favor solo a dos de los $glossary_fera$, los [GetTrait('mokole').GetName(GetNullCharacter)] y los [GetTrait('corax').GetName(GetNullCharacter)].\nEl calor del sol vigoriza el cuerpo y calma el alma. El sol es un cuerpo maravilloso, como un padre magnífico."

 tenet_eastern_mokole_name: "Mokolé de Oriente"
 tenet_eastern_mokole_desc: "Los Mokolé de Asia han aprendido a adaptarse a las numerosas creencias mortales y sobrenaturales que impregnan las tierras. Aunque siguen creyendo que su propia fe es muy superior, están dispuestos a considerar las creencias de las razas más jóvenes."

 tenet_twisted_memories_name: "Recuerdos Retorcidos"
 tenet_twisted_memories_desc: "Los recuerdos son cosas maleables, fáciles de cambiar, fáciles de retorcer."
 doctrine_parameter_remove_relation_torture: "Elimina una [relation|E] aleatoria de tu víctima durante la [torture|E]"
 doctrine_parameter_mokole_wyrm_taint_torture: "Aumenta enormemente el [wyrm_taint|E] infligido a los [GetTrait('mokole').GetName(GetNullCharacter)] durante la [torture|E]"


 doctrine_fera_wyrm_taint_visible_name: ""
 fera_wyrm_taint_visible_doctrine_name: ""
 fera_wyrm_taint_visible_doctrine_desc: ""
 doctrine_parameter_can_see_wyrm_taint: ""

 doctrine_parameter_wyrm_possession_power_faith_bonus_t1: "Puntos de [perk|E] adicionales de [possessedpower_lifestyle|E] al ser [possessed|E]: #P +2#!"
 doctrine_parameter_wyrm_possession_power_faith_bonus_t2: "Puntos de [perk|E] adicionales de [possessedpower_lifestyle|E] al ser [possessed|E]: #P +4#!"

 doctrine_fera_triat_alignment_group_name: "Alineamiento Triat"
 
 doctrine_fera_triat_alignment_balanced_name: "Equilibrado"
 doctrine_fera_triat_alignment_balanced_desc: "Aunque el $glossary_triat$ ya no está en equilibrio, muchos $glossary_fera$ siguen creyendo en el viejo orden."
 doctrine_parameter_hostility_override_doctrine_fera_triat_alignment_balanced: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_triat_alignment_balanced').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 doctrine_fera_triat_alignment_wyld_name: "Salvaje"
 doctrine_fera_triat_alignment_wyld_desc: "Como resultado de la amenaza tanto de la $glossary_weaver$ como del $glossary_wyrm$, la mayoría de los $glossary_fera$ veneran al $glossary_wyld$ por encima de los demás miembros del $glossary_triat$, viéndolo a él y a Gaia como necesitados de protección."

 doctrine_fera_triat_alignment_weaver_name: "Tejedora"
 doctrine_fera_triat_alignment_weaver_desc: "El crecimiento de la $glossary_weaver$ nunca se detendrá mientras exista la humanidad."
 doctrine_parameter_ignore_fera_dev_requirements: "Se ignoran los bajos requisitos de [development|E] de los edificios $glossary_fera$"
 doctrine_parameter_no_fera_dev_reduction: "Los edificios $glossary_fera$ en provincias que sigan esta [faith|E] no reducen el [development|E]"

 doctrine_fera_triat_alignment_wyrm_name: "Wyrm"
 doctrine_fera_triat_alignment_wyrm_desc: "Como su amo caído, los sirvientes del $glossary_wyrm$ solo buscan caos y destrucción." 
 doctrine_parameter_hostility_override_doctrine_fera_triat_alignment_wyrm: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_triat_alignment_wyrm').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_can_recruit_wyrm_maa: "Puede reclutar a [GetMaA('scrags').GetName] y [GetMaA('skull_pigs').GetName] como [men_at_arms|E]"

 doctrine_fera_triat_alignment_triatic_wyrm_name: "Wyrm Triádico"
 doctrine_fera_triat_alignment_triatic_wyrm_desc: "El $glossary_wyrm_triatic$ es una burla del $glossary_triat$ original. Las tres cabezas del Wyrm dotan a sus siervos más cercanos de un gran poder impío."
 doctrine_parameter_hostility_override_doctrine_fera_triat_alignment_triatic_wyrm: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_triat_alignment_triatic_wyrm').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"


 doctrine_fera_triat_alignment_gaia_name: "Gaia"
 doctrine_fera_triat_alignment_gaia_desc: "Gaia es uno de los Espíritus más poderosos que se conocen, posiblemente el primero y el más poderoso. Se le atribuye la creación de los Garou y de la mayoría de los Fera para servir como sus guerreros y agentes tanto en el mundo material como en los Mundos Espirituales. Es la Madre Naturaleza, nutricia y llena de vida, pero también salvaje e implacable cuando se la contraría."
 doctrine_parameter_hostility_override_doctrine_fera_triat_alignment_gaia: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_triat_alignment_gaia').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"


 doctrine_fera_litany_group_name: "Leyes Fera"

 doctrine_fera_werewolf_litany_name: "Letanía"
 doctrine_fera_werewolf_litany_desc: "Las leyes del Pueblo son antiguas. Sus tradiciones varían de tribu a tribu, pero todos los Garou deben recordar y respetar el código legal central llamado la Letanía. En su forma completa, es tanto un poema épico como un código legal. Aunque hacen falta los mayores eruditos para dominar la Letanía por entero, la mayoría de los hombres lobo la aprenden en forma de sus preceptos básicos. Cada precepto tiene una base práctica, pero no todos se consideran universalmente morales sin cuestionamiento."
 doctrine_parameter_hostility_override_doctrine_fera_werewolf_litany: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_werewolf_litany').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 doctrine_fera_werewolf_dark_litany_name: "Letanía Oscura"
 doctrine_fera_werewolf_dark_litany_desc: "La Letanía Oscura es la Letanía del $glossary_wyrm$, seguida por los Danzantes de la Espiral Negra. Sirve a la Voluntad del Wyrm. Respeta la Fuerza del Poderoso. Todo lo que no está Prohibido está Permitido. Entrégate a tus Deseos. A pesar de la percepción de las Espirales Negras como una tribu de caos sin ley, su Letanía a menudo se cumple con más rigor que la de las Naciones Garou."
 doctrine_parameter_hostility_override_doctrine_fera_werewolf_dark_litany: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_werewolf_dark_litany').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]" 

 doctrine_fera_bastet_karoush_name: "Karoush"
 doctrine_fera_bastet_karoush_desc: "El Karoush es el código de leyes de los hombres gato, similar a la Letanía de los Garou. Transmitidas por sus antepasados, estas leyes son más grandes que cualquier Bastet y superiores a cualquier rango o título. Son sus códigos de honor, y los Bastet creen que los separan de la humanidad, protegiéndolos de los errores humanos. El Karoush es el código creado por sus antepasados, la Ley de la Luna y el Sol, la Ley de la Forja de los Secretos y la Ley del Cambio: Hónrate a Ti Mismo, Honra tu Palabra, Honra a los Tuyos y a tu Especie, Honra tu Tierra y Honra tu Silencio."
 doctrine_parameter_hostility_override_doctrine_fera_bastet_karoush: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_bastet_karoush').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 doctrine_fera_mokole_duties_name: "Los Deberes"
 doctrine_fera_mokole_duties_desc: "Helios ha dado a sus Hijos una serie de imperativos morales y personales por los que regir sus vidas. Llamados los Deberes, son el precursor Mokolé de la Letanía Garou. Cada Deber está vinculado a un auspicio solar, aunque todos los Mokolé están sujetos a ellos. Las violaciones de los Deberes merecen reprimendas, pérdida de estatus y otros castigos. Los infractores graves son devorados. Los Soles de Mediodía hacen cumplir las leyes, aunque incluso los Soles de Medianoche reprenderán a un Mokolé negligente. "
 doctrine_parameter_hostility_override_doctrine_fera_mokole_duties: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_mokole_duties').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"


 doctrine_fera_fallen_tribe_name: "Tribu Caída"
 doctrine_fera_fallen_tribe_desc: "Algunas tribus Fera se apartan de sus propósitos originales. Puede deberse a diversas razones, desde disputas ideológicas hasta máculas espirituales, pero los resultados son los mismos. Aisladas (en el mejor de los casos) o perseguidas (en el peor), estas caídas acechan en las sombras, temerosas de quienes antes llamaban sus semejantes."
 doctrine_parameter_hostility_override_doctrine_fera_fallen_tribe: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_fallen_tribe').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"




 doctrine_fera_pact_group_name: "Pactos Fera"

 doctrine_fera_werewolf_pact_name: "Pactos Garou"
 doctrine_fera_werewolf_pact_desc: "Por una razón u otra, los adherentes de esta fe han formado vínculos estrechos con los #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Garou#!. Entablar amistad con las tribus salvajes y brutales no es fácil, pero, cuando lo consiguen, se toman sus juramentos muy en serio."
 doctrine_parameter_hostility_override_doctrine_fera_werewolf_pact: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_werewolf_pact').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 doctrine_fera_bastet_pact_name: "Pactos Bastet"
 doctrine_fera_bastet_pact_desc: "Por una razón u otra, los adherentes de esta fe han formado vínculos estrechos con los [GetTrait('bastet').GetName( GetPlayer )]. La naturaleza inquisitiva de los hombres gato les ha granjeado muchos amigos inesperados... aunque algunos resultaron no ser nada fiables."
 doctrine_parameter_hostility_override_doctrine_fera_bastet_pact: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_bastet_pact').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"


 doctrine_fera_mokole_pact_name: "Pactos Mokolé"
 doctrine_fera_mokole_pact_desc: "Por una razón u otra, los adherentes de esta fe han formado vínculos estrechos con los [GetTrait('mokole').GetName( GetNullCharacter )]. Los hombres saurio son un grupo tenaz; con su Mnesis recuerdan bien a sus amigos, y aún mejor a sus enemigos."
 doctrine_parameter_hostility_override_doctrine_fera_mokole_pact: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_mokole_pact').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"


 doctrine_fera_wyrm_pact_name: "Pactos del Wyrm"
 doctrine_fera_wyrm_pact_desc: "Por alguna razón, los adherentes de esta fe toleran hasta cierto punto a los seguidores del $glossary_wyrm$. Si lo contrario también es cierto depende del capricho de otros. Al fin y al cabo, hay poco espacio para bailar en la espiral."
 doctrine_parameter_hostility_override_doctrine_fera_wyrm_pact: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_wyrm_pact').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"


 doctrine_fera_alliance_group_name: "Alianza Fera"

 doctrine_fera_beast_courts_name: "Cortes de la Bestia"
 doctrine_fera_beast_courts_desc: "Entre los $glossary_fera$, las alianzas entre especies son poco comunes. La excepción más notable son las Cortes de la Bestia, juramentadas para defender a la Madre Esmeralda (Gaia). Dentro de las Cortes existe una sociedad similar a las culturas imperiales de la Asia mítica, con regentes, cortesanos y gente común. Cualquier hengeyokai ($glossary_fera$) es libre de unirse a las Cortes de la Bestia, siempre que jure seguir un sistema comunal de honor y Renombre conocido como el Camino de la Virtud Esmeralda."
 doctrine_parameter_hostility_override_doctrine_fera_beast_courts: "Las [faiths|E] con [GetFaithDoctrine('doctrine_fera_beast_courts').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 bastet_nation_tolerance_name: ""
 special_doctrine_bastet_nation_name: "Nación Bastet"
 special_doctrine_bastet_nation_desc: "La Madre Seline observa con orgullo cómo sus amados hijos felinos por fin se unen como uno solo."
 doctrine_parameter_hostility_override_special_doctrine_bastet_nation: "Otras [faiths|E] que tengan el [doctrine|E] [GetFaithDoctrine('special_doctrine_bastet_nation').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de [faith_astray|V]"  

 zhong_guo_reward_doctrine_name: ""
 special_zhong_guo_reward_doctrine_name: "Guiados por Dragones"
 special_zhong_guo_reward_doctrine_desc: "Los Zhong Lung han llevado a las [GetFaithDoctrine('doctrine_fera_beast_courts').GetBaseName] hacia una nueva prosperidad." 

 masterless_ghoul_dispossessed_doctrine_name: ""
 special_masterless_ghoul_dispossessed_doctrine_name: "Aliados con los Desposeídos"
 special_masterless_ghoul_dispossessed_doctrine_desc: "Gracias a nuestro respaldo, la red de apoyo para los Ghouls se extiende ahora mucho más allá de Tierra Santa."
 doctrine_parameter_masterless_ghoul_dispossessed_parametr: "Aceptación para Invitar a la [court|e] y convertirse en agentes en [schemes|E]: #P +50#! para los [ghouls|E]"

 masterless_ghoul_folch_cutthroats_doctrine_name: ""
 special_masterless_ghoul_folch_cutthroats_doctrine_name: "Aliados con los Degolladores de Folch"
 special_masterless_ghoul_folch_cutthroats_doctrine_desc: "Su ira, dirigida contra nuestros enemigos, los convierte en un activo inestimable."
 doctrine_parameter_masterless_ghoul_folch_cutthroats_parametr: "Coste de [casus_belli|E]: #P -20%#!"

 masterless_ghoul_order_of_st_panteleimon_doctrine_name: ""
 special_masterless_ghoul_order_of_st_panteleimon_doctrine_name: "Aliados con la Orden de San Panteleimón"
 special_masterless_ghoul_order_of_st_panteleimon_doctrine_desc: "El que fuera brazo burocrático de la Iglesia de Caín sigue siendo, en cierto modo, hereje, pero ahora son nuestros herejes."
 doctrine_parameter_masterless_ghoul_order_of_st_panteleimon_parametr: "Tu [court_chaplain|E] es #P 100%#! más rápido en la [councillor_task|E] de [convert_county|E]."

 masterless_ghoul_haqims_assassins_doctrine_name: ""
 special_masterless_ghoul_haqims_assassins_doctrine_name: "Aliados con los "Falsos" Asesinos de Haqim"
 special_masterless_ghoul_haqims_assassins_doctrine_desc: "Sea por suerte o por habilidad, está claro que queremos tener de nuestro lado a alguien que logró frustrar a los Assamitas durante tanto tiempo."
 
