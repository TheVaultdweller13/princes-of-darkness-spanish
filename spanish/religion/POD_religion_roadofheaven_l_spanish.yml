  #Noddist-Group Faiths
  
  viacaeli: "Vía Caeli"
  viacaeli_adj: "Nodista"
  viacaeli_adherent: "Nodista"
  viacaeli_adherent_plural: "Nodistas"
  viacaeli_desc: "Según el Evangelio de Laodice, un texto sagrado Cainita, los principios de algunas Vías Via Caeli proceden del propio Caín. Aunque Dios maldijo a Caín, este estuvo también más cerca de Dios que cualquier otro Vástago que haya existido jamás. Los seguidores del Camino del Cielo intentan dominar a su Bestia mediante la devoción religiosa."
 
  viadivinitatis: "Via Divinitatis"
  viadivinitatis_adj: "Divinista"
  viadivinitatis_adherent: "Divinista"
  viadivinitatis_adherent_plural: "Divinistas"
  viadivinitatis_desc: "Los fanáticos de los nodistas y predecesores del Sabbat. Los seguidores de esta Vía se consideran favorecidos por Dios en lugar de malditos por Él; buscan controlar a los mortales y atraer a tantos Cainitas como puedan a la Via Caeli. Muchos consideran este Camino el más desviado de los cuatro."
 
  viapenaculum: "Via Penaculum"
  viapenaculum_adj: "Penaculum"
  viapenaculum_adherent: "Penitente"
  viapenaculum_adherent_plural: "Penitentes"
  viapenaculum_desc: "Los Fieles que siguen el Camino de la Penitencia se consideran indignos de Dios, las más ínfimas de las criaturas a sus ojos. Ningún camino se toma tan en serio los actos de contrición, pues es la única forma que estos Cainitas ven de alcanzar la iluminación y el favor de Dios."
 
  viavindicta: "Via Vindicta"
  viavindicta_adj: "Vindicta"
  viavindicta_adherent: "Cruzado"
  viavindicta_adherent_plural: "Cruzados"
  viavindicta_desc: "Estos Vástagos se consideran la Mano iracunda de Dios, que destruye a quienes lo han ofendido. Todo aquel que se tenga por malvado o infiel a Dios debe ser destruido. Tienden a cazar a los Cainitas que consideran corruptos."
 
  viadolorosa: "Via Dolorosa"
  viadolorosa_adj: "Dolorosa"
  viadolorosa_adherent: "Mártir"
  viadolorosa_adherent_plural: "Mártires"
  viadolorosa_desc: "Los mártires del Camino de las Lágrimas: estos nodistas se ofrecen como sacrificios no-muertos para que otros no tengan que sufrir. Se sacrificarán de buen grado para detener cualquier corrupción causada por algo que se juzgue impío, especialmente los demonios u otros Cainitas."
 
  viachristi: "Via Christi"
  viachristi_adj: "Christi"
  viachristi_adherent: "Cristiano"
  viachristi_adherent_plural: "Cristianos"
  viachristi_desc: "Los Cainitas que fueron cristianos en vida pueden elegir adherirse al Camino de Cristo, bajo la suposición de que el plan de Dios para el mundo incluye a los vampiros y de que obedecer Su voluntad les ayudará a controlar a la Bestia."
  
  derechchaim: "Derech Chaim"
  derechchaim_adj: "Derech Chaim"
  derechchaim_adherent: "Estries"
  derechchaim_adherent_plural: "Estrie"
  derechchaim_desc: "Los Cainitas que fueron judíos en vida pueden elegir seguir el Camino de la Vida. Creen que HaShem creó a los vampiros junto con el resto del mundo y que, por tanto, las leyes de la Torá siguen vigentes para ellos y les proporcionan medios para controlar a la Bestia."
  
  codeofsamiel: "Código de Samiel"
  codeofsamiel_adj: "Samielita"
  codeofsamiel_adherent: "Samielitas"
  codeofsamiel_adherent_plural: "Samielitas"
  codeofsamiel_desc: "El más grande de la línea guerrera de Saulot, se cree que el fundador mártir Samiel escribió esta vía de su propia mano. Según la leyenda, Samiel recibió los principios fundamentales de honor e ira de la vía durante una visita de Miguel, comandante de las Huestes Celestiales, mientras Saulot estaba fuera."
 
  viaarchangeli: "Via Archangeli"
  viaarchangeli_adj: "Nephilim"
  viaarchangeli_adherent: "Nephilim"
  viaarchangeli_adherent_plural: "Nephilim"
  viaarchangeli_desc: "Seguir los pasos de Miguel significa actuar como musa y pastor para todos, y como mártir cuando sea necesario. Como seguidores del Camino del Cielo, los Fieles del Arcángel ven a Miguel como el Cristo resucitado de los Condenados y creen que los vampiros deben actuar como ángeles para su ganado mortal."
  
  holy_order_order_of_bitter_ashes: "Orden de las Cenizas Amargas"
  holy_order_leper_knights: "Los Caballeros Leprosos"
  holy_order_order_of_chanticleer: "Orden de Chanticleer"
  holy_order_the_unblooded: "Los No Sangrados"
  holy_order_order_of_laodicea: "Orden de Laodicea"
  holy_order_order_of_nod: "Orden de Nod"
  holy_order_the_faithful: "Los Fieles"
  holy_order_order_of_divinity: "Orden de la Divinidad"
  holy_order_holy_order_of_vengeance: "La Santísima Orden de la Venganza"
  holy_order_order_of_penitence: "Orden de la Penitencia"
  holy_order_martyrs_of_tears: "Los Mártires de las Lágrimas"
  holy_order_order_of_terafim: "Orden de Terafim"
  holy_order_order_of_estries: "Orden de Estries"
 holy_order_sons_daughters_of_helena: "Hijos e Hijas de Helena"
 
  consumptionism: "Consumismo"
  consumptionism_adj: "Consumismo"
  consumptionism_adherent: "Consumista"
  consumptionism_adherent_plural: "Consumistas"
  consumptionism_desc: "Dios ha muerto, diablerizado por Caín. Luego Caín engendró otra generación y la chispa de Dios que llevaba dentro se dividió. Por ello, los consumistas creen que no debe segarse la vida de ningún Vástago... a menos que se recupere la chispa de Dios que lleva dentro mediante la Diablerie."
   
  divisionism: "Divisionismo"
  divisionism_adj: "Divisionismo"
  divisionism_adherent: "Divisionista"
  divisionism_adherent_plural: "Divisionistas"
  divisionism_desc: "Dios ha compartido Su esencia con todos los Vástagos, pero solo los fieles son lo bastante santos para merecerla. Por ello, los divisionistas buscan convertir o diablerizar a otros vampiros."
     
  viaaesigard: "Via Aesigard"
  viaaesigard_adj: "Aesigard"
  viaaesigard_adherent: "Aesigard"
  viaaesigard_adherent_plural: "Aesigards"
  viaaesigard_desc: "Las viejas costumbres y tradiciones nórdicas deben mantenerse, y los vampiros no son dioses ni siquiera elegidos por los dioses. Están sujetos al destino, como todo nórdico.\nEl sabio Aesigard busca difundir las Sagas para que se conozca la verdad, incluso si el final ya está escrito."
 
  vianoctis: "Via Noctis"
  vianoctis_adj: "Noctis"
  vianoctis_adherent: "Redentor"
  vianoctis_adherent_plural: "Redentores"
  vianoctis_desc: "Los Redentores sienten el peso de la maldición de Caín y su propia condenación, incluso más que aquellos que siguen la Via Caeli. Al igual que los nodistas, los Redentores buscan la redención y el perdón, y para ganarlos se requiere sufrimiento y purificación. Sin embargo, en lugar de las formas bastante benignas de los nodistas, los Redentores recorren activamente el mundo del hombre, castigando y matando a los pecadores mortales."
 
  pathoftheheavenlyabode: "Senda de la Morada Celestial"
  pathoftheheavenlyabode_adj: "Celestial"
  pathoftheheavenlyabode_adherent: "Vengador"
  pathoftheheavenlyabode_adherent_plural: "Vengadores"
  pathoftheheavenlyabode_desc: "Los seguidores de esta senda creen que, para salvar verdaderamente un alma, el cuerpo mortal debe ser destruido tan pronto como el alma haya encontrado la redención, para evitar una mayor corrupción."
 
  viaredemptio: "Via Redemptio"
  viaredemptio_adj: "Redimido"
  viaredemptio_adherent: "Redimido"
  viaredemptio_adherent_plural: "Redimidos"
  viaredemptio_desc: "La Via Redemptio es una desviación agresiva de la Via Penaculum. Aceptan que han sido malditos por Dios por sus pecados y deben expiarlos, pero no dudarán en tomar acciones agresivas contra demonios y pecadores para redimir sus almas."
 helenacult: "Hijos e Hijas de Helena"
 helenacult_adj: "Helenino"
 helenacult_adherent: "Helenita"
 helenacult_adherent_plural: "Helenitas"
 helenacult_desc: "La verdadera divinidad camina sobre la tierra e irradia una perfección lacerante. Fundado, según se dice, por la propia Diosa inmortal de Troya, este culto de misterio trabaja únicamente para complacerla y hacer avanzar sus fines. Servir a Helena es el máximo honor, y morir por ella, un gran privilegio."
