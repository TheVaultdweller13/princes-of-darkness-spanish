 # Fe Naktanchara
 naktanchara: "Naktanchara"
 naktanchara_adj: "Naktanchara"
 naktanchara_adherent: "Naktanchara"
 naktanchara_adherent_plural: "Naktanchara"
 naktanchara_desc: "La fe Naktanchara combina elementos del budismo tántrico, la adoración de espíritus, la adoración tradicional de los Nāga y el hinduismo. Los adoradores de Naktanchara se consideran budistas, aunque sus prácticas se perciben como algo poco ortodoxas."
  
