  #Mummy-Group Faiths
 
  code_of_horus: "Código de Horus"
  code_of_horus_adj: "Wat Hor"
  code_of_horus_adherent: "Shemsu-Heru"
  code_of_horus_adherent_plural: "Shemsu-Heru"
  code_of_horus_desc: "El Código de Horus, también llamado el Wat Hor, es una colección de mandamientos de Horus a sus seguidores. Resume las enseñanzas y experiencias de su vida y contiene todas las instrucciones que se daba a un Imperecedero recién creado en los días del antiguo Egipto."
   
  ishmaelite: "Ismaelita"
  ishmaelite_adj: "Ismaelita"
  ishmaelite_adherent: "Ismaelita"
  ishmaelite_adherent_plural: "Ismaelitas"
  ishmaelite_desc: "Los Ismaelitas son Shemsu-Heru renegados que abandonaron la Cruzada de Horus por diversos motivos. Reciben su nombre de Ismael, el primer Shemsu-Heru que habló contra el liderazgo de Horus y que fue desterrado a caminar solo por la eternidad."
  
  faces_of_apophis: "Rostros de Apofis"
  faces_of_apophis_adj: "Rostros"
  faces_of_apophis_adherent: "Momia de Perdición"
  faces_of_apophis_adherent_plural: "Momias de Perdición"
  faces_of_apophis_desc: "Apofis es el núcleo de todas las desdichas del mundo, la encarnación suprema de Isfret. Desde que comenzó el tiempo, Apofis ha estado ahí, mancillando y destruyendo los principios de Ma'at. Es el embaucador supremo, la oscuridad abrumadora y la perversión incesante que asola el mundo."
  
  cabiri: "Cabiri"
  cabiri_adj: "Cabiri"
  cabiri_adherent: "Cabirus"
  cabiri_adherent_plural: "Cabiri"
  cabiri_desc: "Mucho después de que se creara el Hechizo de Vida y Horus y sus seguidores libraran su guerra contra Sutekh y sus esbirros, uno de los ismaelitas enseñó a un talentoso mago llamado Cabirus los principios del Hechizo de Vida. Cabirus usó esto para crear su propio Hechizo de Vida y creó sus propios inmortales que no saben nada de Osiris y Ma'at, para horror de los Shemsu-Heru."
 custom_mummy_dynasty: "Dinastía Joven"
 custom_mummy_dynasty_adj: "Dinastía Joven"
 custom_mummy_dynasty_adherent: "Joven"
 custom_mummy_dynasty_adherent_plural: "Jóvenes"
 custom_mummy_dynasty_desc: "Mucho después de que se creara el Hechizo de la Vida y de que Horus y sus seguidores libraran su guerra contra Sutekh y sus esbirros, alguien nuevo ha aprendido el Hechizo de la Vida y ha creado a sus propios inmortales. Qué les depara el futuro, pocos pueden decirlo..."
  
  ten_mandates_of_heaven: "Diez Mandatos del Cielo"
  ten_mandates_of_heaven_adj: "Mandatos"
  ten_mandates_of_heaven_adherent: "Wu T'ian"
  ten_mandates_of_heaven_adherent_plural: "Wu T'ian"
  ten_mandates_of_heaven_desc: "Los Diez Mandatos del Cielo son reglas y directrices para los Wu T'ian, establecidas por los Ocho Inmortales bajo la tutela del Augusto Personaje de Jade. Cada Mandato es igual de importante y cada inmortal tiene su propia lista de prioridades para seguirlos, según su carácter y sus fortalezas personales."
 hellwalkers: "Mandato de los Caminantes del Infierno"
 hellwalkers_adj: "Caminar por el Infierno"
 hellwalkers_adherent: "Caminante del Infierno"
 hellwalkers_adherent_plural: "Caminantes del Infierno"
 hellwalkers_desc: "Procedentes tanto de los Xian Lung como de los Wu Feng, estos Wu T'ian trabajan en secreto en el Inframundo y sus mil infiernos. Rehuyendo la resurrección y aceptando el peligro inherente a su profesión, a menudo son los únicos faros de honor en reinos muy sombríos."
 
  ten_mandates_of_hell: "Esclavos de los Reyes Yama"
  ten_mandates_of_hell_adj: "Esclavos"
  ten_mandates_of_hell_adherent: "Wu Kuei"
  ten_mandates_of_hell_adherent_plural: "Wu Kuei"
  ten_mandates_of_hell_desc: "Los rumores dicen que los Reyes Yama han creado a sus propios esclavos Imperecederos para oponerse a la Familia del Cielo."
 
