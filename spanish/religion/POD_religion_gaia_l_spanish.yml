 saurian_high_god_name_alternate: "Helios"
 saurian_high_god_name_alternate_possessive: "de Helios"
 saurian_creator_god_name: "$saurian_high_god_name_alternate$"
 saurian_creator_god_name_possessive: "$saurian_high_god_name_alternate_possessive$"
 saurian_fertility_god_name: "El [Glossary('Devisor', 'glossary_wyld_tt')]"
 saurian_fertility_god_name_possessive: "El [Glossary('Devisor', 'glossary_wyld_tt')]"
 saurian_wealth_god_name: "El [Glossary('Designer', 'glossary_weaver_tt')]"
 saurian_wealth_god_name_possessive: "El [Glossary('Designer', 'glossary_weaver_tt')]'s"
 saurian_war_god_name: "Dragón"
 saurian_war_god_name_possessive: "Del Dragón"
 saurian_devil_name: "El [Glossary('Dissolver', 'glossary_wyrm_tt')]"
 saurian_devil_name_possessive: "Del [Glossary('Dissolver', 'glossary_wyrm_tt')]"
 saurian_house_of_worship: "revolcadero"
 saurian_house_of_worship_plural: "cenagales"
