 ursine_religion: "@gurahl_icon! Ursino"
 ursine_religion_adj: "Úrsido"
 ursine_religion_adherent: "Úrsido"
 ursine_religion_adherent_plural: "Ursinos"
 ursine_religion_desc: "Según sus propias crónicas, los Gurahl eran los protectores originales de Gaia, creados para repeler el poder destructivo del «Destructor de Patrones». Cuando este se volvió demasiado poderoso para ellos, pidieron ayuda a Gaia, y así ella creó a los Garou."
 
 riverkeepers: "Guardianes del Río"
 riverkeepers_adj: "Guardianes del Río"
 riverkeepers_adherent: "Guardián del Río"
 riverkeepers_adherent_plural: "Guardianes del Río"
 riverkeepers_desc: "Defensores y administradores de ríos grandes y pequeños, los Guardianes del Río no solo protegen las vías fluviales de Gaia, sino que también sirven como chamanes y manipuladores del clima para la gente que habita a su lado."
 
 icestalkers: "Acechadores del Hielo"
 icestalkers_adj: "Acechadores del Hielo"
 icestalkers_adherent: "Acechador del Hielo"
 icestalkers_adherent_plural: "Acechadores del Hielo"
 icestalkers_desc: "Portadores de la Era de Hielo y parientes de los temibles osos polares del Ártico, los Acechadores del Hielo son la tribu más septentrional, no solo entre los Gurahl, sino entre todas las Razas Cambiantes."
 
