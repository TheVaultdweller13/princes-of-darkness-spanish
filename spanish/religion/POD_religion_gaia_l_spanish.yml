 #################
 #### Spirits ####
 #################

 gaia_religion: "@spirit_icon! gaiano"
 gaia_religion_adj: "gaiano"
 gaia_religion_adherent: "gaiano"
 gaia_religion_adherent_plural: "gaianos"
 gaia_religion_desc: "Gaia es superior a un Celeste, y uno de los espíritus más poderosos conocidos; posiblemente el primero y el más poderoso. Se le atribuye la creación de los Garou y de la mayoría de los $glossary_fera$ para que sirvan como sus guerreros y agentes tanto en el plano material como en los [spirit_worlds|E]."

 
 velvet_brood: "Prole de Terciopelo"
 velvet_brood_adj: "Terciopelo"
 velvet_brood_adherent: "Espíritus"
 velvet_brood_adherent_plural: "Espíritus"
 velvet_brood_desc: "Los espíritus, al menos los sapientes, son criaturas sociales. Interactúan, se organizan y planean. Tienen amigos, o al menos tienen sus favoritos. Mantienen rivalidades y rencores. Cada espíritu es un individuo único, incluso si están vinculados a ciertos aspectos de su naturaleza. En la Umbra, nadie vive en el vacío."


 ####################
 #### Werewolves ####
 ####################

 blackfury_religion: "@werewolf_icon! Furias Negras"
 blackfury_religion_adj: "Furias Negras"
 blackfury_religion_adherent: "Furia"
 blackfury_religion_adherent_plural: "Furias"
 blackfury_religion_desc: "Las matriarcas de los Garou están más cerca del $glossary_wyld$ que la mayoría de las otras tribus, y son conocidas por su honor, sabiduría, orgullo y feroces habilidades en batalla.\nLas Furias veneran al Salvaje como una fuerza de feminidad, de instinto en lugar de las abstracciones intelectuales de la $glossary_weaver$ (y considerado masculino por la Tribu). El Salvaje es la fuerza que mantiene en movimiento los ciclos de Gaia y Luna y los complementa."

 blackfury: "Furias Negras"
 blackfury_adj: "Furias Negras"
 blackfury_adherent: "Furia"
 blackfury_adherent_plural: "Furias"
 blackfury_desc: "Las matriarcas de los Garou están más cerca del $glossary_wyld$ que la mayoría de las otras tribus, y son conocidas por su honor, sabiduría, orgullo y feroces habilidades en batalla.\nLas Furias veneran al Salvaje como una fuerza de feminidad, de instinto en lugar de las abstracciones intelectuales de la $glossary_weaver$ (y considerado masculino por la Tribu). El Salvaje es la fuerza que mantiene en movimiento los ciclos de Gaia y Luna y los complementa."

 amazonsofdiana: "Amazonas de Diana"
 amazonsofdiana_adj: "Amazonas de Diana"
 amazonsofdiana_adherent: "Amazonas"
 amazonsofdiana_adherent_plural: "Amazonas"
 amazonsofdiana_desc: "Un grupo de Furias Negras que están más preocupadas por ser mujeres guerreras impetuosas e imparables que por ser vengadoras sagradas. Este bando rara vez se ve como un grupo formal, y es más bien un término genérico para aquellas más dedicadas a demostrar que son iguales a cualquier hombre en combate contra el $glossary_wyrm$. Algunas dentro del bando ven necesario llevar a las Furias hacia el futuro y alejarlas de su práctica inútil y arcaica de perseguir criminales, pero los Garou que simplemente odian a todos los machos también tienden a gravitar hacia las Amazonas."

 avengingmother: "Madre Vengadora"
 avengingmother_adj: "Madre Vengadora"
 avengingmother_adherent: "Vengador"
 avengingmother_adherent_plural: "Vengadores"
 avengingmother_desc: "Una subsección muy pequeña de las Furias Negras que trabaja para derribar las estructuras patriarcales de la Nación Garou y de tribus como los Colmillos Plateados mediante la explotación de su confianza."

 bacchantes: "Bacantes"
 bacchantes_adj: "Bacantes"
 bacchantes_adherent: "Bacante"
 bacchantes_adherent_plural: "Bacantes"
 bacchantes_desc: "Una facción conservadora que persigue el propósito sagrado original de las Furias Negras: vengar los agravios contra mujeres y niños con celo fanático y violencia despiadada. Creen que, al hacerlo, combaten el dominio del $glossary_wyrm$ sobre la humanidad y vengan a la propia Gaia."

 freebooters: "Filibusteras"
 freebooters_adj: "Filibusteras"
 freebooters_adherent: "Filibustera"
 freebooters_adherent_plural: "Filibusteras"
 freebooters_desc: "La misión de las Filibusteras es encontrar nuevos lugares del $glossary_wyld$ que puedan ser consagrados a Gaia y abiertos como Túmulos. El kuklos se está reduciendo porque quedan muy pocos lugares del Salvaje en el mundo. Una fracción de las Filibusteras cree que necesitan encontrar un nuevo cuerpo para Gaia en otra parte de la [umbra|E], en algún lugar donde el $glossary_wyrm$ aún no haya llegado." 

 moondaughter: "Hija de la Luna"
 moondaughters_adj: "Hija de la Luna"
 moondaughter_adherent: "Hija de la Luna"
 moondaughter_adherent_plural: "Hijas de la Luna"
 moondaughter_desc: "Un culto que busca difundir el culto a Gaia a través del paganismo. A pesar de aferrarse a las Tradiciones, también se esfuerzan por mantener vivo el espíritu de Gaia mediante el cambio, encarnando la fuerza del $glossary_wyld$ lo mejor que pueden. Sus métodos rituales consisten principalmente en magia antigua, transmitida y modificada de una generación a otra."

 orderofourmercifulmother: "Orden de la Madre Misericordiosa"
 orderofourmercifulmother_adj: "Orden de la Madre Misericordiosa"
 orderofourmercifulmother_adherent: "Monja"
 orderofourmercifulmother_adherent_plural: "Monjas"
 orderofourmercifulmother_desc: "Entre los kuklos más ridiculizados dentro de las Furias Negras. Actuando sutilmente para acercar el dogma de otros a una versión que respete a Gaia y a las mujeres, la Orden trabaja para reformar la sociedad humana y el cristianismo utilizando sus propias herramientas contra ellos. Se atribuyen el aumento de la popularidad de la Virgen María."

 sisterhood: "Hermandad"
 sisterhood_adj: "Hermandad"
 sisterhood_adherent: "Hermana"
 sisterhood_adherent_plural: "Hermana"
 sisterhood_desc: "Una red para proteger a la Parentela, a las mujeres y a los Garou de la Inquisición y llevarlos a un lugar seguro. También gestionan las diversas redes de Parentela de las Furias Negras, ofreciéndoles socorro e informando a otros miembros de la Tribu cuando un hombre ha hecho daño a un miembro de la Parentela. Además, son expertos en recaudar recursos para que la Tribu los utilice."

 templeofartemis: "Templo de Artemisa"
 templeofartemis_adj: "Templo de Artemisa"
 templeofartemis_adherent: "Sacerdotisa de Artemisa"
 templeofartemis_adherent_plural: "Sacerdotisas de Artemisa"
 templeofartemis_desc: "Entre los más antiguos kukloi y uno de los más conservadores. Aconsejan el retiro de la Nación Garou y la rededicación de las Furias Negras a su propósito original como vengadoras de las mujeres. También actúan como jueces para las Furias que han quebrantado las costumbres tribales."

 bonegnawer_religion: "@werewolf_icon! Roehuesos"
 bonegnawer_religion_adj: "Roehuesos"
 bonegnawer_religion_adherent: "Roedor de Huesos"
 bonegnawer_religion_adherent_plural: "Roehuesos"
 bonegnawer_religion_desc: "Los carroñeros y supervivientes de los Garou, los Roehuesos son vistos por otras tribus como poco más que mestizos que rebuscan entre los desechos de la humanidad. Los Roehuesos se ven a sí mismos como desfavorecidos que esperan triunfar contra enemigos excesivamente confiados."

 bonegnawer: "Roehuesos"
 bonegnawer_adj: "Roehuesos"
 bonegnawer_adherent: "Roedor de Huesos"
 bonegnawer_adherent_plural: "Roehuesos"
 bonegnawer_desc: "Los carroñeros y supervivientes de los Garou, los Roehuesos son vistos por otras tribus como poco más que mestizos que rebuscan entre los desechos de la humanidad. Los Roehuesos se ven a sí mismos como desfavorecidos que esperan triunfar contra enemigos excesivamente confiados."

 thehood: "La Capucha"
 thehood_adj: "Capucha"
 thehood_adherent: "Capucha"
 thehood_adherent_plural: "Capuchas"
 thehood_desc: "Este bando se dedica a distribuir la riqueza de los ricos entre los pobres, siempre que el dinero que proporcionan se utilice para fines útiles. La Capucha está empezando a cobrar forma en estos tiempos (y existe más allá de los límites del bosque de Sherwood). Muchos jóvenes idealistas de los Roehuesos se están uniendo a las filas de la Capucha, intrigados por el concepto de la redistribución organizada de la riqueza. Como bandoleros y reyes ladrones, han encontrado una nueva forma de quitar comida a quienes lo tienen todo para ponerla en la boca de los hambrientos."
 
 ratfinks: "Ratas Soplonas"
 ratfinks_adj: "Ratas Soplonas"
 ratfinks_adherent: "Rata Soplona"
 ratfinks_adherent_plural: "Ratas Soplonas"
 ratfinks_desc: "Los Garou de este bando son espías y recolectores de información, una red de Parentela y Garou que desempeñan trabajos humildes que, casualmente, les dan acceso a información de alto nivel. Otras criaturas sobrenaturales también interactúan a veces con el bando: vampiros Nosferatu, espías Ratkin e incluso mensajeros Corax."
 


 childrenoffamine: "Hijos de la Hambruna"
 childrenoffamine_adj: "Hijos de la Hambruna"
 childrenoffamine_adherent: "Hijo de la Hambruna"
 childrenoffamine_adherent_plural: "Hijos de la Hambruna"
 childrenoffamine_desc: "La hambruna bien podría ser una forma de vida entre los pobres medievales, pero los Hijos de la Hambruna hacen todo lo posible por aliviar el problema. Se sabe que cazan ilegalmente en tierras reales o roban grano de los graneros monásticos durante los tiempos de escasez. Gaia nunca quiso que sus hijos pasaran hambre, y donde hay hambruna, debe ser por culpa del $glossary_wyrm$. Si una sequía o una plaga asola la tierra, los Hijos suelen buscar a quién culpar."

 childofgaia_religion: "@werewolf_icon! Hijos de Gaia"
 childofgaia_religion_adj: "Hijos de Gaia"
 childofgaia_religion_adherent: "Hijo"
 childofgaia_religion_adherent_plural: "Hijos"
 childofgaia_religion_desc: "Los pacificadores de los Garou, los Hijos trabajan por el entendimiento entre las tribus y esperan formar eventualmente a todas las tribus en un frente unido contra el $glossary_wyrm$."

 childofgaia: "Hijos de Gaia"
 childofgaia_adj: "Hijos de Gaia"
 childofgaia_adherent: "Hijo"
 childofgaia_adherent_plural: "Hijos"
 childofgaia_desc: "Los pacificadores de los Garou, los Hijos trabajan por el entendimiento entre las tribus y esperan formar eventualmente a todas las tribus en un frente unido contra el $glossary_wyrm$."

 servantsoftheunicorn: "Siervos del Unicornio"
 servantsoftheunicorn_adj: "Unicornio"
 servantsoftheunicorn_adherent: "Siervo del Unicornio"
 servantsoftheunicorn_adherent_plural: "Siervos del Unicornio"
 servantsoftheunicorn_desc: "El más grande y poderoso de los bandos de los Hijos de Gaia no es realmente un bando. Los Siervos del Unicornio representan los ideales tribales, y la mayoría de los Hijos se consideran a sí mismos como Siervos. Los más dedicados de los Siervos buscan activamente disputas para mediar. Además, los Siervos difunden el mensaje de la unidad tribal, promoviendo el concepto de que todos los Garou son Hijos de Gaia."
 
 crestofthehorn: "Cúspide del Cuerno, la"
 crestofthehorn_adj: "Cuerno"
 crestofthehorn_adherent: "Cúspide"
 crestofthehorn_adherent_plural: "Cúspides"
 crestofthehorn_desc: "Una pequeña escisión de los Siervos del Unicornio, la Cúspide del Cuerno se ocupa principalmente de las disputas de la Iglesia Cristiana, y sus miembros más radicales suelen ser quienes luchan contra la influencia de la Iglesia."

 anointedones: "Ungidos"
 anointedones_adj: "Ungido"
 anointedones_adherent: "Ungido"
 anointedones_adherent_plural: "Ungido"
 anointedones_desc: "Los pacificadores de los Garou, los Hijos trabajan por el entendimiento entre las tribus y esperan formar eventualmente a todas las tribus en un frente unido contra el $glossary_wyrm$. Este bando ha renunciado a la violencia en todas sus formas. No levantarán una mano para golpear a otra criatura, y encuentran constantemente nuevas formas de liberarse de la Furia para mantener ese control. Los Ungidos luchan por existir en estos tiempos, pero existen."

 onetree: "El Árbol Único"
 onetree_adj: "Árbol Único"
 onetree_adherent: "Hijo del Árbol"
 onetree_adherent_plural: "Hijos del Árbol"
 onetree_desc: "Son asesinos, tanto guerreros de primera línea como asesinos sigilosos. Dicho esto, no matan por Furia, pasión, odio, malicia o orgullo, y no aceptan miembros que busquen unirse al bando con esas motivaciones. Matan porque es lo que Gaia les ha hecho hacer; son un canal a través del cual Gaia puede atacar a sus enemigos."

 angelsofgaia: "Ángeles de Gaia"
 angelsofgaia_adj: "Ángeles"
 angelsofgaia_adherent: "Ángel"
 angelsofgaia_adherent_plural: "Ángel"
 angelsofgaia_desc: "Este bando de los Hijos de Gaia protege, defiende y rescata a niños humanos de la $glossary_wyrm_corruption$. Se ocupan especialmente de aquellos niños cuyas familias han muerto por la guerra o las enfermedades y de aquellos que han sido abandonados por sus padres."

 aetherainamorata: "Aethera Inamorata"
 aetherainamorata_adj: "Amor"
 aetherainamorata_adherent: "Amante"
 aetherainamorata_adherent_plural: "Amantes"
 aetherainamorata_desc: "Un bando polémico dedicado a la sanación a través del sexo y el amor físico; creen que las uniones entre Garou no suponen un quebrantamiento de la Letanía (y son, de hecho, una valiosa herramienta para la unidad) siempre que no produzcan descendencia. Supervisan los embarazos de la Parentela para ayudar a las familias a prepararse ante la posibilidad de un niño Garou, y facilitan el matrimonio entre Parentela de diferentes tribus con el fin de fomentar la unidad y la confianza intertribal." 

 fianna_religion: "@werewolf_icon! Fianna"
 fianna_religion_adj: "Fianna"
 fianna_religion_adherent: "Fianna"
 fianna_religion_adherent_plural: "Fianna"
 fianna_religion_desc: "Fuertemente basados en las tradiciones celtas y europeas, los Fianna son conocidos entre los Garou por su pasión por el placer de la vida, sus habilidades y ferocidad en la batalla, y como guardianes de la música, las historias y el saber de los Garou."

 fianna: "Fianna"
 fianna_adj: "Fianna"
 fianna_adherent: "Fianna"
 fianna_adherent_plural: "Fianna"
 fianna_desc: "Fuertemente basados en las tradiciones celtas y europeas, los Fianna son conocidos entre los Garou por su pasión por el placer de la vida, sus habilidades y ferocidad en la batalla, y como guardianes de la música, las historias y el saber de los Garou."

 brotherhoodofherne: "Hermandad de Herne"
 brotherhoodofherne_adj: "Herne"
 brotherhoodofherne_adherent: "Hermano de Herne"
 brotherhoodofherne_adherent_plural: "Hermandad"
 brotherhoodofherne_desc: "Este bando está compuesto predominantemente por Ahrouns con algunos otros Auspicios mezclados. Comenzaron como un medio para compartir recursos cuando la batalla contra los recién formados Danzantes de la Espiral Negra estaba en su peor momento. Unos pocos Ahrouns de cada Sept se trasladaban mediante un Puente Lunar a un Caern en apuros para acudir al rescate, por así decirlo. La Hermandad de Herne se está adaptando bien a los conceptos humanos de caballería, heráldica y orden de caballería. Sin embargo, sus compañeros de tribu Fianna los miran con desdén."
 
 childrenofdire: "Hijos de Lobo Terrible"
 childrenofdire_adj: "Lobo Terrible"
 childrenofdire_adherent: "Lobo Terrible"
 childrenofdire_adherent_plural: "Lobos Terribles"
 childrenofdire_desc: "Compuesto predominantemente por Garou lupus, este bando vigila las emanaciones de las fuerzas del $glossary_wyrm$ mediante su efecto en el $glossary_wyld$. Al notar los cambios en el flujo de depredadores y presas y el crecimiento o declive de la flora en los lugares del Salvaje, pueden detectar la influencia del Wyrm antes de que se fortalezca. El bando en sí suele ser visto con sospecha por los extraños porque rara vez permanecen vinculados a un caern durante mucho tiempo."
 
 grancdhildrenoffionn: "Nietos de Fionn"
 grancdhildrenoffionn_adj: "Fionn"
 grancdhildrenoffionn_adherent: "Nieto"
 grancdhildrenoffionn_adherent_plural: "Nietos"
 grancdhildrenoffionn_desc: "Muchos jóvenes Fianna ven a los Nietos de Fionn —dedicados a los ideales de combate de su ancestro, Fionn mac Cumhail— como la oportunidad perfecta para demostrar su valía al resto de la tribu y a la Nación. Se consideran los héroes elegidos del Ciervo, y son famosos por su valentía, viajando a cualquier lugar donde se encuentren las mejores batallas." 

 mothersfundamentalists: "Fundamentalistas de la Madre"
 mothersfundamentalists_adj: "Fundamentalista"
 mothersfundamentalists_adherent: "Fundamentalista"
 mothersfundamentalists_adherent_plural: "Fundamentalistas"
 mothersfundamentalists_desc: "Este bando de Fianna desea recuperar el Impergium: la purga de la población humana practicada por los Garou en la prehistoria. Culpan a la expansión descontrolada de la humanidad de la locura del $glossary_weaver$ y del $glossary_wyrm$, así como de la lenta muerte de Gaia." 

 songkeepers: "Guardianes de la Canción"
 songkeepers_adj: "Guardián de la Canción"
 songkeepers_adherent: "Guardián de la Canción"
 songkeepers_adherent_plural: "Guardianes de la Canción"
 songkeepers_desc: "Los Guardianes de la Canción tienen el derecho de reclamar el legado como los más antiguos, con solo los Nietos de Fionn capaces de disputar esa afirmación. Son lo primero que se viene a la mente cuando alguien habla de los Fianna; son los maestros del saber, los narradores y quienes se dedican a mantener viva la historia oral. Este bando no está formado solo por Galliards. Los Teúrgos buscan y aprenden Ritos, asegurándose de que ninguno se pierda a medida que el Apocalipsis se acerca, y los Philodox preservan la antigua sabiduría de los Juicios pasados. Lo importante es la capacidad de aprender y compartir ese conocimiento con todos los Garou, no solo con los Fianna, razón por la cual el bando es muy conocido por las otras Tribus." 

 tuathadefionn: "Tuatha De Fionn"
 tuathadefionn_adj: "Tuatha De Fionn"
 tuathadefionn_adherent: "Tuatha"
 tuathadefionn_adherent_plural: "Tuatha"
 tuathadefionn_desc: "Aunque los extraños puedan vincular a todos los Fianna con las hadas, el Tuatha de Fionn es el bando con más probabilidades de tratar con ellas. Los nuevos Tuatha son reclutados por miembros actuales que encuentran algo en ellos —sangre feérica o locura— que creen que permitirá al nuevo recluta tratar con la Buena Gente en términos casi de igualdad. Tras un largo periodo de tutela, se les lleva a conocer a las hadas y, con suerte, a unirse al Tuatha de Fionn como miembros de pleno derecho. Los Hijos de Fionn no solo parlamentan con las hadas en nombre de la Nación Garou, sino que aprenden de ellas sobre muchos de sus enemigos mutuos que —aunque no sean necesariamente engendrados por el Wyrm— es probable que interfieran con la Nación." 

 whisperingrovers: "Vagabundos Susurrantes"
 whisperingrovers_adj: "Vagabundo"
 whisperingrovers_adherent: "Vagabundo"
 whisperingrovers_adherent_plural: "Vagabundos"
 whisperingrovers_desc: "No reclaman ninguna tierra como propia y viajan por el mundo con su parentela en bandas, dependiendo mucho los unos de los otros para sobrevivir: siempre en movimiento, nunca permaneciendo mucho tiempo en un mismo lugar. Actúan como los ojos y oídos del clan, con el Righ de cada banda informando al Ard Righ de la tribu sobre cualquier cosa que noten en sus viajes y que pueda acarrear problemas para los Fianna. Se busca a los Vagabundos cuando otros Fianna, o incluso otras tribus, necesitan conocimiento sobre un lugar determinado." 

 dyn_a_drowyd_yn_flaidd: "Dyn a drowyd yn flaidd"
 dyn_a_drowyd_yn_flaidd_adj: "flaidd"
 dyn_a_drowyd_yn_flaidd_adherent: "Dyn"
 dyn_a_drowyd_yn_flaidd_adherent_plural: "Dyn"
 dyn_a_drowyd_yn_flaidd_desc: "Estos Fianna galeses son muy insulares; se aíslan en las colinas y valles de sus territorios y prestan poca atención a lo que transcurre fuera de sus fronteras. Otros Fianna dicen que los Dyn a drowyd yn flaidd mezclan su sangre con la de las hadas, otorgándoles poderes inquietantes incluso entre los Garou, pero dejándolos también marcados por la locura.\n\nAl igual que su feroz Parentela, los Fianna del norte montañoso son guerreros más duros que los de las tierras bajas, habiendo demostrado su valía tanto contra la Camada de Fenris como contra los normandos." 

 getoffenris_religion: "@werewolf_icon! Get of Fenris"
 getoffenris_religion_adj: "Fenris"
 getoffenris_religion_adherent: "Fenris"
 getoffenris_religion_adherent_plural: "Fenris"
 getoffenris_religion_desc: "Guerreros feroces con poca compasión ni misericordia, los Fenrir se ven a sí mismos como grandes héroes, pero se sabe que sorprenden a otros Garou con sus métodos violentos."

 getoffenris: "Geto de Fenris"
 getoffenris_adj: "Fenris"
 getoffenris_adherent: "Fenris"
 getoffenris_adherent_plural: "Fenris"
 getoffenris_desc: "Guerreros feroces con poca compasión ni misericordia, los Fenrir se ven a sí mismos como grandes héroes, pero se sabe que sorprenden a otros Garou con sus métodos violentos."
 
 valkyriaoffreya: "Valkiria de Freya"
 valkyriaoffreya_adj: "Valkiria"
 valkyriaoffreya_adherent: "Valkiria"
 valkyriaoffreya_adherent_plural: "Valkiria"
 valkyriaoffreya_desc: "Las Valkyria luchan por la igualdad de las mujeres dentro de la Tribu. Mientras que la mayoría de los Fenrir desprecian este Campamento, creyendo que solo sirve para convertir a sus hembras en perras débiles que no harán más que quejarse sin cesar en lugar de tomar lo que les pertenece por derecho, las propias Valkyria sostienen que son fundamentales para romper muchos de los prejuicios humanos sobre el papel de la mujer en la sociedad. Chocan a menudo (a veces violentamente) con las Furias Negras."

 handoftyr: "Mano de Tyr"
 handoftyr_adj: "Tyr"
 handoftyr_adherent: "Mano"
 handoftyr_adherent_plural: "Manos"
 handoftyr_desc: "La Mano de Tyr está compuesta por Get que han centrado su atención en combatir la influencia del $glossary_wyrm$ en la humanidad, persiguiendo a violadores, abusadores de menores, terroristas y criminales violentos."

 fangsofgarm: "Colmillos de Garm"
 fangsofgarm_adj: "Garm"
 fangsofgarm_adherent: "Colmillo"
 fangsofgarm_adherent_plural: "Colmillos"
 fangsofgarm_desc: "Los Colmillos de Garm buscan integrar mejor a la Camada de Fenris en la Nación Garou y pretenden tender puentes con las otras Tribus para que, en el momento del Apocalipsis, puedan luchar juntos."

 mjlolnirsthunder: "El Trueno de Mjolnir"
 mjlolnirsthunder_adj: "Trueno"
 mjlolnirsthunder_adherent: "Dedicado"
 mjlolnirsthunder_adherent_plural: "Dedicado"
 mjlolnirsthunder_desc: "Este antiguo campamento está formado por aquellos que han perdido (o cortado) todos los vínculos con el mundo que les rodea y se han dedicado únicamente a destruir al $glossary_wyrm$. No les importa nada más: ni los humanos ni los lobos, ni los espíritus, ni el Velo, ni siquiera la sociedad Garou en su conjunto. Son los monstruos que otras tribus imaginan a veces que son todos los Fenrir, habiendo canjeado cualquier rastro de compasión, empatía y sentido común por su dedicación sociopática y unidireccional a la desaparición del Wyrm."

 gloriousfistofwotan: "Glorioso Puño de Wotan"
 gloriousfistofwotan_adj: "Wotan"
 gloriousfistofwotan_adherent: "Puño"
 gloriousfistofwotan_adherent_plural: "Puños"
 gloriousfistofwotan_desc: "El Glorioso Puño de Wotan cree que solo la erradicación de la humanidad puede salvar a Gaia. Los humanos se han convertido en el mayor vector a través del cual se propaga el $glossary_wyrm$, por lo que, para frenarlo, deben ser eliminados."

 lokissmile: "La Sonrisa de Loki"
 lokissmile_adj: "Loki"
 lokissmile_adherent: "Sonriente"
 lokissmile_adherent_plural: "Sonrientes"
 lokissmile_desc: "Se dice que la Sonrisa de Loki controla la Tribu desde las sombras; sus miembros se comunican a través de espíritus de tormenta y se esconden del resto de la Tribu." 
 
 warderofmen_religion: "@werewolf_icon! Protectores del Hombre"
 warderofmen_religion_adj: "Guardianes de los Hombres"
 warderofmen_religion_adherent: "Protector"
 warderofmen_religion_adherent_plural: "Protectores"
 warderofmen_religion_desc: "Inmersos en la religión humana y en el flujo y reflujo de la ciudad, los Protectores del Hombre viven y mueren por un credo de progreso. Aunque temen al Apocalipsis como cualquier hombre lobo, creen que cada día que pasa los hace más fuertes, que cada nueva invención puede ser apropiada para su causa y que cada nueva filosofía podría fortalecer su determinación. De este modo, son el Urrah por excelencia y no tienen la fuerte aversión hacia las poblaciones humanas que la mayoría de los Garou poseen."

 warderofmen: "Guardianes de los Hombres"
 warderofmen_adj: "Guardianes de los Hombres"
 warderofmen_adherent: "Protector"
 warderofmen_adherent_plural: "Protectores"
 warderofmen_desc: "Inmersos en la religión humana y en el flujo y reflujo de la ciudad, los Protectores del Hombre viven y mueren por un credo de progreso. Aunque temen al Apocalipsis como cualquier hombre lobo, creen que cada día que pasa los hace más fuertes, que cada nueva invención puede ser apropiada para su causa y que cada nueva filosofía podría fortalecer su determinación. De este modo, son el Urrah por excelencia y no tienen la fuerte aversión hacia las poblaciones humanas que la mayoría de los Garou poseen."
 
 bellowsandcrucible: "Fuelles y Crisol"
 bellowsandcrucible_adj: "Fueguista"
 bellowsandcrucible_adherent: "Fueguista"
 bellowsandcrucible_adherent_plural: "Fueguista"
 bellowsandcrucible_desc: "Los «Fueguistas» son principalmente Teúrgos y Filodox, todos versados en el saber elemental. Hacen todo lo posible por guiar a los alquimistas humanos hacia la Iluminación, con la esperanza de abrir los ojos de sus protegidos a la gloria del mundo espiritual que hay más allá."
 
 brethrenofthebook: "Hermanos del Libro"
 brethrenofthebook_adj: "Libro"
 brethrenofthebook_adherent: "Hermano"
 brethrenofthebook_adherent_plural: "Hermanos"
 brethrenofthebook_desc: "Estos Protectores defienden lo que creen que es el mayor logro de la humanidad: la palabra escrita. Los miembros de este campamento acumulan pergaminos e iluminaciones raras, y se sabe que se infiltran en monasterios y fortalezas para sustraer libros antes de que la guerra o los desastres puedan devastarlos. Los Hermanos se reproducen entre eruditos, sacerdotes y otros hombres de letras, y a menudo se esfuerzan por lograr la alfabetización en tantos idiomas como sea posible."
 

 
 goldenwheel: "Rueda Dorada"
 goldenwheel_adj: "Rueda Dorada"
 goldenwheel_adherent: "Mercader"
 goldenwheel_adherent_plural: "Mercaderes"
 goldenwheel_desc: "El comercio y el intercambio impulsan el logro humano; o al menos eso es lo que sostienen las Ruedas. Este campamento hace todo lo posible por fomentar las relaciones comerciales entre ciudades y países, razonando que donde se intercambian bienes, también se intercambiarán ideas. Algunos Garou acusan a las Ruedas de actuar más por avaricia que por generosidad, pero no se ha encontrado evidencia suficiente de gran corrupción dentro del campamento."

 redtalon_religion: "@werewolf_icon! Garras Rojas"
 redtalon_religion_adj: "Garras Rojas"
 redtalon_religion_adherent: "Garra Roja"
 redtalon_religion_adherent_plural: "Garras Rojas"
 redtalon_religion_desc: "Las Garras Rojas son la única tribu entre los Garou que es exclusivamente lupina por naturaleza, rechazando la humanidad por completo como una plaga para la Tierra. Los Garras Rojas cuentan que su Tribu se formó directamente de Gaia y que permanecieron como los Garou más puros que mantuvieron el contacto con su forma original, sin corromperse por la contaminada humanidad."

 redtalon: "Garras Rojas"
 redtalon_adj: "Garras Rojas"
 redtalon_adherent: "Garra Roja"
 redtalon_adherent_plural: "Garras Rojas"
 redtalon_desc: "Las Garras Rojas son la única tribu entre los Garou que es exclusivamente lupina por naturaleza, rechazando la humanidad por completo como una plaga para la Tierra. Los Garras Rojas cuentan que su Tribu se formó directamente de Gaia y que permanecieron como los Garou más puros que mantuvieron el contacto con su forma original, sin corromperse por la contaminada humanidad."

 predatorkings: "Logia de los Reyes Depredadores"
 predatorkings_adj: "Rey Depredador"
 predatorkings_adherent: "Depredador"
 predatorkings_adherent_plural: "Depredadores"
 predatorkings_desc: "Los Reyes Depredadores creen que el tiempo de los compromisos ha terminado y que los humanos deben ser masacrados hasta que no quede nadie."
 
 wardersoftheland: "Protectores de la Tierra"
 wardersoftheland_adj: "de la Tierra"
 wardersoftheland_adherent: "Protector"
 wardersoftheland_adherent_plural: "Protectores"
 wardersoftheland_desc: "Los Protectores matarán a cualquier humano que profane su territorio, pero no les seguirán más allá de este. Los Protectores no dudarán en matar a un humano si es necesario, pero no creen en la masacre generalizada. Algunos sienten que si no hubiera tantos humanos, serían una molestia tolerable en lugar de la amenaza manifiesta que representan ahora. Otros desearían ver a la humanidad desaparecida, pero no creen que los Garou tengan las herramientas para lograrlo, por lo que buscan otras opciones."

 nightfear: "Miedo Nocturno"
 nightfear_adj: "Miedo Nocturno"
 nightfear_adherent: "Terror"
 nightfear_adherent_plural: "Terrores"
 nightfear_desc: "Este bando, compuesto en gran parte por Ragabash y Galliards, está muy interesado en los relatos que los humanos comparten entre sí. Su esperanza es que los humanos aprendan a respetar a la Madre a través del miedo, y que mediante el miedo se enseñen unos a otros precaución. Se sabe que los Miedo Nocturno atacan a los humanos que consideran que están profanando claramente su territorio, pero nunca los matan; solo hieren y aterrorizan, con la esperanza de que los humanos difundan la noticia de que ciertos lugares y actos son tabú." 
  
 settingmoon: "Luna Poniente"
 settingmoon_adj: "Luna Poniente"
 settingmoon_adherent: "Garra Roja"
 settingmoon_adherent_plural: "Garras Rojas"
 settingmoon_desc: "Los videntes y sabios de los Garras Rojas a veces surgen de este pequeño bando. Son buscadores de visiones y guardianes de profecías, y son sus funestas predicciones las que refuerzan las creencias de la tribu de que los humanos serán algún día la perdición de Gaia. La Luna Poniente a veces envía emisarios a otros septs y, con frecuencia, aporta miembros a manadas multitribales, con la esperanza de advertir a las otras tribas antes de que sea demasiado tarde."
 
 kucha_ekundu: "Kucha Ekundu"
 kucha_ekundu_adj: "Kucha Ekundu"
 kucha_ekundu_adherent: "Kucha Ekundu"
 kucha_ekundu_adherent_plural: "Kucha Ekundu"
 kucha_ekundu_desc: "Los Kucha Ekundu son una Línea de Sangre de las Garras Rojas que habitan en África y se reproducen con los licaones africanos (también conocidos como «lobos pintados») en lugar de con lobos auténticos. Algunos rumores afirman que aprendieron esto de los Mokolé. Muchos Kucha Ekundu comparten las mismas opiniones sobre los humanos que sus primos. Los Kucha Ekundu siguen venerando a Griffon como su Tótem."
 
 shadowlord_religion: "@werewolf_icon! Señores de la Sombra"
 shadowlord_religion_adj: "Señores de la Sombra"
 shadowlord_religion_adherent: "Señor de la Sombra"
 shadowlord_religion_adherent_plural: "Señores de la Sombra"
 shadowlord_religion_desc: "Los políticos y manipuladores de los Garou, los Señores de la Sombra, trabajan a través de sus estrictas jerarquías y métodos secretos para arrebatar todo el poder que pueden."
 
 shadowlord: "Señores de la Sombra"
 shadowlord_adj: "Señores de la Sombra"
 shadowlord_adherent: "Señor de la Sombra"
 shadowlord_adherent_plural: "Señores de la Sombra"
 shadowlord_desc: "Los políticos y manipuladores de los Garou, los Señores de la Sombra, trabajan a través de sus estrictas jerarquías y métodos secretos para arrebatar todo el poder que pueden."
 
 lordsofthesummit: "Señores de la Cúspide"
 lordsofthesummit_adj: "de la Cúspide"
 lordsofthesummit_adherent: "Señor"
 lordsofthesummit_adherent_plural: "Señores"
 lordsofthesummit_desc: "Un Señor de la Cúspide hará cualquier cosa por alcanzar el poder y, una vez que lo consiga, no lo sacrificará por ningún motivo. Invocando la Letanía, los Señores con autoridad declaran que, dado que el Apocalipsis está cerca, ya no existe ninguna ilusión de paz bajo la cual su mandato pueda ser desafiado honorablemente. Estos Señores ocupan muchos puestos de liderazgo dentro de la tribu (y de la Nación), donde sus continuos estados de «ley marcial» promueven y preservan su tiranía." 

 bringersoflight: "Portadores de la Luz"
 bringersoflight_adj: "Portador de Luz"
 bringersoflight_adherent: "Portador"
 bringersoflight_adherent_plural: "Portadores"
 bringersoflight_desc: "Los Portadores de Luz buscan la fuerza interior poniéndose a prueba continuamente contra la impureza que les rodea. Una y otra vez, buscan la tentación del $glossary_wyrm$, interactuando con vampiros, Danzantes de la Espiral Negra, fomori y otros miembros del Wyrm. Aunque muchos han caído al intentar abrazar los preceptos de este bando, los Portadores creen que los más fuertes (y verdaderamente dignos) no sucumben a la oscuridad; la superan. Muchos caen, por supuesto; el camino que eligen es bastante peligroso y corren el riesgo de morir a manos de quienes les rodean, así como de corromperse por el contacto con el Wyrm." 

 childrenofcrow: "Hijos de Cuervo"
 childrenofcrow_adj: "de Cuervo"
 childrenofcrow_adherent: "Hijo"
 childrenofcrow_adherent_plural: "Hijos"
 childrenofcrow_desc: "Tomando al Cuervo como su tótem, estos Garou actúan como consejeros y «solucionadores» de los líderes dentro de la Nación Garou, apoyando a los fuertes y a los sabios mientras traman la caída de los indignos. Se mantienen en las sombras, sin interés en el poder personal o el liderazgo. En su lugar, trabajan entre bastidores, aprendiendo secretos y prestando atención a los detalles que otros pasarían por alto, los cuales utilizan para derribar a los enemigos de los Garou y liberar a Gaia, poco a poco. Son betas dedicados y leales."  

 judgesofdoom: "Jueces del Destino"
 judgesofdoom_adj: "del Destino"
 judgesofdoom_adherent: "Juez"
 judgesofdoom_adherent_plural: "Jueces"
 judgesofdoom_desc: "Los Jueces del Destino infunden un profundo temor en el corazón de la Nación Garou al buscar y destruir a los Garou que violan flagrantemente los preceptos de la Letanía. Persiguen su agenda con un celo implacable. Sin piedad ni remordimiento, no muestran clemencia mientras persiguen y destruyen a los Garou —incluso septs enteros— que han permitido que se profane un caern o que hayan cometido cualquier otra violación masiva de las leyes de la Nación. Ningún quebrantador de la Letanía es inmune a su escrutinio y justicia."  

 hakken: "Hakken"
 hakken_adj: "Hakken"
 hakken_adherent: "Hakken"
 hakken_adherent_plural: "Hakken"
 hakken_desc: "Una tribu de Hengeyokai que se originó de los Señores de la Sombra, pero a diferencia de sus primos occidentales, los Hakken y su visión del mundo van más allá de los estereotipos de los Señores de la Sombra. Los Hakken siguen el concepto de Bushidō, el camino del guerrero. Todos los Hakken leales siguen este camino y se consideran samuráis en el sentido más tradicional. Los Hakken son una de las pocas tribus de Garou que poseen una influencia significativa en las Cortes de la Bestia de Asia."

 hakken_war_god_name: "Susanowo"
 hakken_war_god_name_possessive: "de Susanowo"
 hakken_night_god_name: "Tsuki-yomi"
 hakken_night_god_name_possessive: "de Tsuki-yomi"

 
 silentstrider_religion: "@werewolf_icon! Caminantes Silenciosos"
 silentstrider_religion_adj: "Caminantes Silenciosos"
 silentstrider_religion_adherent: "Caminante Silencioso"
 silentstrider_religion_adherent_plural: "Caminantes Silenciosos"
 silentstrider_religion_desc: "Originarios de Egipto, los Caminantes Silenciosos han sido maldecidos al exilio por el poderoso vampiro Set, y han estado huyendo desde entonces. Nómadas, introspectivos y altamente espirituales, los Caminantes Silenciosos han sondeado las profundidades de la [umbra|E], quizás más profundamente que cualquier otra tribu de Garou." 
 
 silentstrider: "Caminantes Silenciosos"
 silentstrider_adj: "Caminantes Silenciosos"
 silentstrider_adherent: "Caminante Silencioso"
 silentstrider_adherent_plural: "Caminantes Silenciosos"
 silentstrider_desc: "Originarios de Egipto, los Caminantes Silenciosos han sido maldecidos al exilio por el poderoso vampiro Set, y han estado huyendo desde entonces. Nómadas, introspectivos y altamente espirituales, los Caminantes Silenciosos han sondeado las profundidades de la [umbra|E], quizás más profundamente que cualquier otra tribu de Garou."

 harbingers_adj: "Heraldos"
 harbingers_adherent: "Heraldo"
 harbingers_adherent_plural: "Heraldos"
 harbingers_desc: "Estos fueron los primeros Garou en tomarse en serio la Profecía del Fénix, o eso dicen algunos. Se separaron y vagaron por el mundo buscando señales del $glossary_wyrm$ y trajeron las noticias de vuelta. Todavía no han terminado de contar a los Garou todas las señales del Wyrm que encontraron. Lo más importante es que traen esperanza. Están entre los más sabios de los Garou, así que será mejor que saltes cuando te lo digan."

 seekers_adj: "Buscadores"
 seekers_adherent: "Buscadores"
 seekers_adherent_plural: "Buscadores"
 seekers_desc: "Los Buscadores vagan de un lugar a otro buscando información que aún no han aprendido. Los Buscadores suelen ser astutos, ingeniosos, inquisitivos y tercos como el demonio. Si quieres saber algo, pregunta a un Buscador. Si no conocen la respuesta, te indicarán la dirección correcta. Los Buscadores saben qué ha sucedido y qué está sucediendo ahora. Los Buscadores conocen más ritos místicos que cualquier otro campamento de Caminantes Silenciosos. También es muy probable que tengan un saco lleno de fetiches y talanes encontrados en rincones oscuros y lugares remotos. A menudo sirven de mentores para los jóvenes Caminantes, y muchos mantienen el contacto con sus propios mentores de su juventud."

 dispossessed: "Desposeídos"
 dispossessed_adj: "Desposeídos"
 dispossessed_adherent: "Desposeídos"
 dispossessed_adherent_plural: "Desposeídos"
 dispossessed_desc: "No se puede evitar preocuparse por los Desposeídos. No intentan nada con más ahínco que establecerse en algún lugar, pero algo siempre les impide lograrlo. No es de extrañar que sean tan amargados.\nEstudian sobre el Apocalipsis y son los más morbososos entre los Caminantes. Vigilan los presagios del inminente Apocalipsis y transmiten sus advertencias a quienes quieran escuchar. Incluso hay rumores de que intentan ayudar a provocar el Apocalipsis, creyendo que tendrán un hogar una vez que el fin haya llegado y pasado."

 wayfarers: "Viajeros"
 wayfarers_adj: "Viajeros"
 wayfarers_adherent: "Viajeros"
 wayfarers_adherent_plural: "Caminante"
 wayfarers_desc: "Estos Caminantes venden sus servicios al mejor postor. Si uno dice que entregará tu mensaje, lo hará. Los pocos miembros de esta laxa confederación de oportunistas generalmente operan mediante el trueque y los favores. A menudo razonan que ni siquiera serían bienvenidos en la mayoría de los septs si no hicieran favores a los que están al mando; así que, ¿por qué no obtener una buena comida y algo de información a cambio para endulzar el trato?"

 daggersofnut: "Dagas de Nut"
 daggersofnut_adj: "Dagas de Nut"
 daggersofnut_adherent: "Daga"
 daggersofnut_adherent_plural: "Dagas"
 daggersofnut_desc: "Tomando su nombre de la Incarna pagana egipcia de la noche, estos Caminantes están verdaderamente enfurecidos por el auge de los vampiros. Su odio hacia los no-muertos supera incluso al de los más salvajes Fianna o los más puros Colmillos Plateados, pues venganan una Tierra Natal perdida y a sus parientes perdidos. Las Dagas actúan como asesinos dondequiera que vagan, seleccionando silenciosamente a un Sanguinario o tres para su extinción, aunque esto deba alterar cualquier tregua existente entre los nativos. Por donde pasan las Dagas de Nut, la guerra entre hombre lobo y vampiro se reaviva con nueva furia." 
 

 
 bitterhex: "Maleficio Amargo"
 bitterhex_adj: "Maléfico"
 bitterhex_adherent: "Bruja"
 bitterhex_adherent_plural: "Brujas"
 bitterhex_desc: "Los miembros del Maleficio Amargo empuñan una de las herramientas más controvertidas y peligrosas conocidas por la tribu: la maldición. Mientras que sus miembros mantienen su asociación con el campamento en secreto, el campamento en su conjunto no oculta su existencia. Quieren que el resto del mundo sepa que su tribu ha sufrido lo suficiente, y que el Maleficio tiene de sobra para vengar cualquier agravio, por pequeño que sea, contra los Caminantes y su estirpe."  

 silverfang_religion: "@werewolf_icon! Colmillos Plateados"
 silverfang_religion_adj: "Colmillos Plateados"
 silverfang_religion_adherent: "Colmillo de Plata"
 silverfang_religion_adherent_plural: "Colmillos Plateados"
 silverfang_religion_desc: "La «Tribu Alfa» de la Nación Garou, los Colmillos Plateados son gobernantes tradicionales y líderes de guerra. Estos nobles Garou son conocidos por su belleza física, valor y honor. Lamentablemente, muchos miembros jóvenes de la tribu sufren extrañas peculiaridades —distracción, alucinaciones leves, sonambulismo— nada abiertamente psicótico, pero sí perceptible."
 
 silverfang: "Colmillos Plateados"
 silverfang_adj: "Colmillos Plateados"
 silverfang_adherent: "Colmillo de Plata"
 silverfang_adherent_plural: "Colmillos Plateados"
 silverfang_desc: "La «Tribu Alfa» de la Nación Garou, los Colmillos Plateados son gobernantes tradicionales y líderes de guerra. Estos nobles Garou son conocidos por su belleza física, valor y honor. Lamentablemente, muchos miembros jóvenes de la tribu sufren extrañas peculiaridades —distracción, alucinaciones leves, sonambulismo— nada abiertamente psicótico, pero sí perceptible."

 sunlodge: "Logia del Sol"
 sunlodge_adj: "Sol"
 sunlodge_adherent: "Besado por el sol"
 sunlodge_adherent_plural: "Besado por el sol"
 sunlodge_desc: "Helios aporta razón y tacto a los hombres lobo que le honran. Enseña a los Garou a templar su instinto y su Furia con el pensamiento y la lógica. Así, quienes le siguen suelen convertirse en hábiles diplomáticos y negociadores. A menudo, el mayor problema para lograr una tregua, tratado o alianza es conseguir que la otra parte escuche el argumento que el personaje está exponiendo. Helios valora la verdad y la justicia."
 
 moonlodge: "Logia de la Luna"
 moonlodge_adj: "Luna"
 moonlodge_adherent: "Lunar"
 moonlodge_adherent_plural: "Lunares"
 moonlodge_desc: "La Logia de la Luna se especializa en ayudar a la moral del sept y las manadas, al tiempo que mantiene una buena relación con los espíritus y renueva el favor de Luna."
 
 ivorypriesthood: "Sacerdocio de Marfil"
 ivorypriesthood_adj: "Marfil"
 ivorypriesthood_adherent: "Sacerdote"
 ivorypriesthood_adherent_plural: "Sacerdotes"
 ivorypriesthood_desc: "Más que una facción, los Sacerdotes de Marfil son los investigadores arcanos autoproclamados de la tribu, que investigan los secretos de la vida y la muerte. Cuando el Primer Lobo murió para salvar a Gaia, aprendió el «Secreto de la Muerte». El Sacerdocio de Marfil es una sociedad secreta de Teúrgos de Colmillo que, tras someterse a una serie de pruebas y ensayos espirituales, comienzan a aprender estos mismos secretos sobre lo que yace más allá del velo de la Muerte."
 
 greyraptors: "Rapaces Grises"
 greyraptors_adj: "Raptor"
 greyraptors_adherent: "Raptor"
 greyraptors_adherent_plural: "Aves Rapaces"
 greyraptors_desc: "Una sociedad de Colmillos Plateados que se esfuerza por castigar a quienes insultan o ignoran el antiguo derecho de su tribu a gobernar; los Rapaces Grises mantienen su identidad en secreto, pero sus acciones son manifiestas. El terror y la tortura son su pan de cada día en su intento de imponer antiguos juramentos de lealtad que pocos Garou fuera de los Colmillos recuerdan o reconocen."
 
 mastersoftheseal: "Maestros del Sello"
 mastersoftheseal_adj: "Sello"
 mastersoftheseal_adherent: "Maestro"
 mastersoftheseal_adherent_plural: "Maestros"
 mastersoftheseal_desc: "Ningún Hijo de Halcón admitiría jamás ser miembro de este campamento, y acusar a alguien de ello resultaría en un desafío honorable. La razón es sencilla: los Maestros del Sello son todos unos ladrones que roban secretos a los espíritus y a otras tribus. Aunque mantienen su identidad en secreto, divulgan lo aprendido a otros miembros de la tribu que pueden usar la información para promover mejor el interés común de los Colmillos."

 stargazer_religion: "@werewolf_icon! Contemplaestrellas"
 stargazer_religion_adj: "Contempladores de Estrellas"
 stargazer_religion_adherent: "Contemplador de Estrellas"
 stargazer_religion_adherent_plural: "Contempladores de Estrellas"
 stargazer_religion_desc: "Solitarios por naturaleza, los Contemplaestrellas son los más calmados e introvertidos de los Garou, así como la tribu más pequeña de las restantes. Siempre siendo forasteros entre la Nación Garou, afirman ser descendientes de los seguidores de Klaital Atrapastrellas, un sabio del Este que predicaba la moderación y la armonía."

 stargazer: "Contempladores de Estrellas"
 stargazer_adj: "Contempladores de Estrellas"
 stargazer_adherent: "Contemplador de Estrellas"
 stargazer_adherent_plural: "Contempladores de Estrellas"
 stargazer_desc: "Solitarios por naturaleza, los Contemplaestrellas son los más calmados e introvertidos de los Garou, así como la tribu más pequeña de las restantes. Siempre siendo forasteros entre la Nación Garou, afirman ser descendientes de los seguidores de Klaital Atrapastrellas, un sabio del Este que predicaba la moderación y la armonía."

 heavenlysuccessors: "Sucesores Celestiales del Devorador de Demonios"
 heavenlysuccessors_adj: "Sucesores"
 heavenlysuccessors_adherent: "Sucesor"
 heavenlysuccessors_adherent_plural: "Sucesores"
 heavenlysuccessors_desc: "Calificados como un culto del Apocalipsis por muchos, los Sucesores se dedican a derrotar y destruir a los demonios que beben el alma de Gaia como tumores hambrientos —es decir, vampiros y otros no-muertos. Cuando no están en batalla con sus demonios, los miembros de este campamento suelen ser indistinguibles de otros Contemplaestrellas. Pero cuando se enfrentan a su enemigo, visten túnicas verdes en homenaje a Zhong Kuei, el primero de los suyos, y atacan con un fanatismo absoluto."

 innerpath: "Camino Interior"
 innerpath_adj: "Camino Interior"
 innerpath_adherent: "Explorador"
 innerpath_adherent_plural: "Exploradores"
 innerpath_desc: "Una facción encubierta de Contemplaestrellas dedicada a tomar el control de los Colmillos Plateados mediante la manipulación y el moldeado de políticas desde dentro. Creen que alguien debe controlar a los insanos líderes Garou por el bien de Gaia y de la Nación en su conjunto. Son muy reservados y operan sin el conocimiento de sus maestros tribales. En lugar de desafiar abiertamente a los Colmillos Plateados, el Camino Interior trabaja con otros descontentos dentro de la Nación para lograr su objetivo."

 klaitalpuk: "Klaital Puk"
 klaitalpuk_adj: "Puk"
 klaitalpuk_adherent: "Puk"
 klaitalpuk_adherent_plural: "Puk"
 klaitalpuk_desc: "El campamento más tradicional de los Contempladores de Estrellas y quizás el que tiene el mayor número de seguidores es el Klaital Puk. Liderados por una reencarnación de Klaital Atrapador de Estrellas, el primer Contemplador de Estrellas, los Puk siguen las directrices de su mentor para el cultivo de la Iluminación. Sienten que la comprensión de la sabiduría original tiene más valor que la sabiduría de una mente contaminada por el mundo moderno."

 sacredthread: "Hilo Sagrado"
 sacredthread_adj: "Hilo Sagrado"
 sacredthread_adherent: "Hilo"
 sacredthread_adherent_plural: "Hilos"
 sacredthread_desc: "Los miembros de este campamento sienten que el enfoque centrado en los hombres lobo de la Nación Garou será su perdición, y que solo luchando contra el $glossary_wyrm$ donde habita —en los corazones y mentes de la humanidad— se podrá ganar verdaderamente la Guerra. El Hilo Sagrado viaja hasta lo más profundo del corazón de las poblaciones humanas y actúa como instructor, consejero y mentor para la gente que encuentra allí, ofreciendo educación de todo tipo para ayudar a fortalecer el espíritu humano."

 trancerunners: "Corredores del Trance"
 trancerunners_adj: "Corredores"
 trancerunners_adherent: "Corredores"
 trancerunners_adherent_plural: "Corredores"
 trancerunners_desc: "A veces confundidos con miembros de la tribu de los Caminantes Silenciosos, este campamento pertenece a una tradición antigua. El Lung-gompa —meditación del viento— les otorga la destreza física para cumplir sus deberes: transmitir mensajes, objetos y secretos de un caern a otro o de una corte a otra. A través de la meditación y otras prácticas místicas, son capaces de lograr una casi ingravidez, lo que les permite correr sobre el agua, escalar obstáculos prohibidos y realizar otras hazañas de destreza, velocidad y resistencia."

 worldtree: "Árbol del Mundo"
 worldtree_adj: "Árbol del Mundo"
 worldtree_adherent: "Arborista"
 worldtree_adherent_plural: "Arboristas"
 worldtree_desc: "El Árbol del Mundo busca difundir la Iluminación no solo entre los Garou, sino también entre los humanos, magos y las Razas Cambiantes. También viajan más lejos en los reinos espirituales que la mayoría, habiendo aprendido a enviar sus mentes al [UmbraGlossaryLocalized('astral_reaches','Umbra Astral')] en busca de conocimiento mientras sus cuerpos permanecen arraigados a la tierra."

 zephyr: "Céfiro"
 zephyr_adj: "Céfiro"
 zephyr_adherent: "Céfiro"
 zephyr_adherent_plural: "Céfiro"
 zephyr_desc: "Los miembros del Céfiro viajan entre otros Garou, uniéndose a manadas y difundiendo su sabiduría mediante el ejemplo. La experiencia es su objetivo, pues en sus giros de destino esperan obtener visiones que de otro modo serían inalcanzables. Algunos dicen que el Céfiro se formó originalmente alrededor de un dojo para el entrenamiento del arte marcial Kailindo, pero al igual que los espíritus del viento con los que comulgan, no pueden quedarse quietos en un lugar por mucho tiempo y vagan con las tormentas."

 anagamin: "Ana-gamin"
 anagamin_adj: "Ana-gamin"
 anagamin_adherent: "Ana-gamin"
 anagamin_adherent_plural: "Ana-gamin"
 anagamin_desc: "Conocidos como los «No Retornados», algunos creen que los Ana-gamin no son más que una leyenda. Dependiendo de la historia que se cuente, aceptan o secuestran a miembros de la tribu que consideran dignos de acompañarlos en sus viajes a través del [umbra|E]. Buscan liberarse de las ataduras de la realidad y creen que pronto todos los Contempladores de Estrellas irán al [umbra|E], libres de sus cadenas mortales, y nunca regresarán a la tierra."



 fera_outcasts_religion: "@werewolf_icon! Parias"
 fera_outcasts_religion_adj: "Paria"
 fera_outcasts_religion_adherent: "Paria"
 fera_outcasts_religion_adherent_plural: "Parias"
 fera_outcasts_religion_desc: "Los Ronin son hombres lobo que son, por una razón u otra, parias de la Nación Garou.\nLa mayoría de los Ronin quebrantaron un precepto de la Letanía con demasiada frecuencia, antagonizaron a un Antiguo o a su manada, y algunos incluso eligieron esta vida para escapar de la dura sociedad jerárquica de los Garou o porque se vieron abrumados por el Harano. Los Garou no son criaturas solitarias. Cada instinto humano, de lobo y de Garou exige la compañía de otros miembros de su especie. Como tal, el destierro de otros de su estirpe es uno de los juicios más terribles a los que un Garou puede enfrentarse."

 ronin: "Ronin"
 ronin_adj: "Ronin"
 ronin_adherent: "Ronin"
 ronin_adherent_plural: "Ronin"
 ronin_desc: "Los Ronin son hombres lobo que son, por una razón u otra, parias de la Nación Garou.\nLa mayoría de los Ronin quebrantaron un precepto de la Letanía con demasiada frecuencia, antagonizaron a un Antiguo o a su manada, y algunos incluso eligieron esta vida para escapar de la dura sociedad jerárquica de los Garou o porque se vieron abrumados por el Harano. Los Garou no son criaturas solitarias. Cada instinto humano, de lobo y de Garou exige la compañía de otros miembros de su especie. Como tal, el destierro de otros de su estirpe es uno de los juicios más terribles a los que un Garou puede enfrentarse."
 
 siberakh: "Siberakh"
 siberakh_adj: "Siberakh"
 siberakh_adherent: "Siberakh"
 siberakh_adherent_plural: "Siberakh"
 siberakh_desc: "Los Siberakh, o «Excluidos», como se llaman a sí mismos, son una subtribu rusa de Garou que tiene muy poco contacto con la Nación Garou. Su Tótem es el Sable. Los Siberakh descienden de Colmillos Plateados que vieron la locura de la endogamia para mantener la pureza de su sangre y, en su lugar, eligieron parejas de la estirpe Wendigo. Hoy en día viven segregados en las tierras salvajes de Siberia, desconocidos para la mayoría de los Garou; solo los Wendigo y los Colmillos Plateados saben de ellos. Mientras que los Colmillos Plateados los rechazan como Ronin para preservar sus pretensiones sobre su linaje inmaculado, los Wendigo aceptan la reticencia de los Siberakh a involucrarse en la política de la Nación Garou."



 ################
 #### Bastet ####
 ################


 #Common Bastet Localization
 karoush_high_god_name_alternate: "Nala"
 karoush_high_god_name_alternate_possessive: "de Nala"
 karoush_devil_name: "[Glossary('Cahlash', 'glossary_wyrm_tt')]"
 karoush_devil_name_possessive: "[Glossary('Cahlash', 'glossary_wyrm_tt')]'s"
 karoush_death_deity_name: "[Glossary('Cahlash', 'glossary_wyrm_tt')]"
 karoush_death_deity_name_possessive: "[Glossary('Cahlash', 'glossary_wyrm_tt')]'s"
 

 feline_religion: "@bastet_icon! Felino"
 feline_religion_adj: "Felino"
 feline_religion_adherent: "Felino"
 feline_religion_adherent_plural: "Felinos"
 feline_religion_desc: "Los Bastet son werecats obsesionados con el conocimiento secreto, que siempre lo persiguen y lo acumulan. Muchos son grandes magos, otros son grandes guerreros, pero rara vez son animales de manada y generalmente trabajan solos. Los Bastet fueron creados por Luna (a quien llaman Seline). En lugar de recibir un propósito específico, cada tribu intenta llenar el vacío que otros no lograron cubrir."


 bagheera: "Bagheera"
 bagheera_adj: "Bagheera"
 bagheera_adherent: "Bagheera"
 bagheera_adherent_plural: "Bagheera"
 bagheera_desc: "Hijos de Saraam y temidos como los Ejecutores de Kali, los Bagheera son Bastet que pueden asumir la forma de panteras negras. Los Bagheera afirman que cuando Gaia estaba creando a los Bastet, esperaba que los Bagheera fueran los legisladores de la estirpe felina. Este papel nunca llegó a materializarse por completo, pero los rastros de la intención de Gaia perduran, llenándolos de un agudo sentido de la justicia y un espíritu de ira justa que es terrible de presenciar."  
 
 bubasti: "Bubasti"
 bubasti_adj: "Bubasti"
 bubasti_adherent: "Bubasti"
 bubasti_adherent_plural: "Bubasti"
 bubasti_desc: "También conocidos como Gatos de Sombra, son los werecats de Egipto. Los místicos de la estirpe felina, son una raza tímida y reservada. Los Bubasti fueron maldecidos hace mucho tiempo por la antigua deidad vampírica Set y, como resultado, sus vidas están ligadas para siempre a los suelos de Khem, su hogar ancestral. Se dice que si todos los Bubasti de una generación determinada abandonan Egipto, esa será la última generación. Nadie conoce la verdad de este rumor, pero nadie se atreve a ponerlo a prueba.\nDebido a su guerra con Set, están estrechamente alineados con la $glossary_osirian_league$ de Horus y sus seis líderes, los Kheper, han alcanzado la inmortalidad." 
 
 ceilican: "Ceilican"
 ceilican_adj: "Ceilican"
 ceilican_adherent: "Ceilican"
 ceilican_adherent_plural: "Ceilicans"
 ceilican_desc: "También llamados Danzantes del Anillo, se originaron en el norte de Europa y tienen fuertes vínculos con las hadas, pero no son hadas en sí mismos. Los Ceilican pueden rastrear su ascendencia hasta los leones sin melena del norte de Europa y son considerados primos de los Simba (aunque cualquier Simba se sentiría indignado de ser comparado con uno de los Danzantes del Anillo). Durante los terrores de la Guerra de Furia que destruyó a sus parientes, los Ceilican supervivientes se entregaron a un señor de las Hadas, quien pronto los esclavizó y los infectó con su naturaleza mercurial e incluso con su debilidad ante el hierro frío."
 
 khan_adj: "Khan"
 khan_adherent: "Khan"
 khan_adherent_plural: "Khans"
 khan_desc: "El Khan, también conocido como los Reyes Brillantes, son weretigers y una de las nueve tribus restantes de los Bastet. Se ven a sí mismos como baluartes contra la oscuridad, como las creaciones más perfectas de Gaia y, como tales, obligados a proteger a todos los que sean inferiores. Aunque suelen ser independientes y poco sociables como cualquier werecat, muchos Khan están aliados con las Cortes de la Bestia.\nUn pueblo honorable, el Khan evoca el respeto que exigen los leones."
 
 simba: "Simba"
 simba_adj: "Simba"
 simba_adherent: "Simba"
 simba_adherent_plural: "Simbas"
 simba_desc: "Los Simba son werelions. También se les conoce como Señores de la Luz Solar o Reyes Oscuros. Los Simba representan lo mejor que Gaia tiene para ofrecer, en el sentido de que son regios, orgullosos y poderosos sin comparación. Sin embargo, también son arrogantes, dominantes y maliciosos, incluso en las mejores circunstancias.\nCreen que las cosas simplemente están fuera de orden. Cuando se restaure el equilibrio, cuando los humanos conozcan su lugar y cuando las ciudades se conviertan en cementerios, se demostrará que los leones tienen razón. En la mente de los Simba, los demonios de la Edad Oscura se remontan al fin del Impergium y a la laxitud de las Razas Cambiantes. Y tienen la intención de poner las cosas en el orden correcto: si eso requiere derramamiento de sangre, que así sea. La guerra es el deporte de los reyes." 

 swara: "Swara"
 swara_adj: "Swara"
 swara_adherent: "Swara"
 swara_adherent_plural: "Swara"
 swara_desc: "Los werecheetahs de las tribus Bastet también son llamados el Pueblo de Plata. Al igual que sus parientes, son extremadamente rápidos y viajan mucho. También tienen un vínculo único con el [umbra|E]. De todas las tribus de los Bastet, los Swara son los menos comprendidos. Esto es resultado de su cultura muy aislada. Los Swara son la única raza de Bastet capaz de caminar de lado, lo que les permite viajar a reinos dentro del [umbra|E] que sus hermanos no pueden alcanzar. Algunos especulan que esto es resultado de su fuerte relación con Luna, a quien la mayoría de los Swara veneran. Algunas leyendas afirman que fue un Swara quien visitó la luna por primera vez durante el tiempo del Impergium, y fue esto lo que les enseñó el significado e importancia de la guerra contra el $glossary_wyrm$ y cuán terrible es la situación." 






