 saurian_death_deity_name_possessive: "$saurian_devil_name_possessive$"







 holy_order_dragons_chosen: "Elegidos del Dragón"
 holy_order_blades_helios: "Espadas de Helios"
 holy_order_avengers_lost: "Vengadores de lo Perdido"
 holy_order_army_scales: "El Ejército de las Escamas"


 saurian_religion: "@mokole_icon! Saurio"
 saurian_religion_adj: "Saurio"
 saurian_religion_adherent: "Saurio"
 saurian_religion_adherent_plural: "Saurios"
 saurian_religion_desc: "Los Mokolé son licolizardos, licrocodrilos, licosaurios y licodragones. Son los descendientes de los prehistóricos Reyes Lagarto, los primogénitos de la $glossary_fera$ y los hijos elegidos de Helios. Su papel es ser los recuerdos de Gaia, una tarea que cumplen mediante el poder de su Mnesis. Con la Mnesis, un Mokolé puede recordar miles o millones de años de pasado y profundizar en las memoridades de sus ancestros."



 children_sobek: "Hijos de Sobek"
 children_sobek_adj: "Sobek"
 children_sobek_adherent: "Redentor"
 children_sobek_adherent_plural: "Redentores"
 children_sobek_desc: "En los días en que los dioses caminaban por el antiguo Egipto vivía Sobek, caudillo de los Mokolé del Nilo. El gran Sobek y su nidada se enfrentaron a los osirianos contra Set y sus viles serpientes. A pesar de su poder combinado, los osirianos sufrieron la derrota. Set corrompió a Sobek con sus impuros rituales de sangre y lo convirtió en la primera y única Abominación Mokolé.\nEl corrupto Sobek ha estado durmiendo desde entonces en su templo oculto bajo la antigua Crocodilopolis, con su ira divina contenida. Sus seguidores no lo han olvidado y buscan liberarlo a él y a Khem de la corrupción de los Setitas. Si el Dios Cocodrilo puede ser salvado y devuelto a Ma'at, entonces ¡ay de sus enemigos! Si no, ¡ay de la creación misma!"


 warriors_entoban: "Guerreros de Entoban"
 warriors_entoban_adj: "Entoban"
 warriors_entoban_adherent: "Guerrero"
 warriors_entoban_adherent_plural: "Guerreros"
 warriors_entoban_desc: "Entoban, el continente-arca africano, hogar de la humanidad, es también el hogar de la rama más antigua de los Mokolé. Llamados los guerreros de la Raza Dragón, han sido atacados sin cesar en las Guerras de Furia; su odio extremo hacia los Garou es un mero reflejo del propio maltrato que los Garou les infligen. Ahora han asumido la tarea de salvaguardar Entoban y proteger a las otras razas $glossary_fera$ que permanecen allí. Los crímenes de los Garou serán vengados, y los Mokolé nunca olvidan."


 cosmic_order: "Orden Cósmica"
 cosmic_order_adj: "Cósmico"
 cosmic_order_adherent: "Buscador"
 cosmic_order_adherent_plural: "Buscadores"
 cosmic_order_desc: "Los Mokolé de la India consideran al Sol como su fuente de Iluminación y a Agni como su fuerza. Creen en Rta (la Orden Cósmica) y que esta existió antes que Jya (Gaia) y permanecerá después de ella. Bajo Jya, sitúan a la Trimurti compuesta por el Creador, el Preservador y el Destructor. Estas creencias únicas fueron influenciadas por las fes mortales de la India, con las que los Mokolé han hecho sincretismo.\nTodo tiene un propósito; ellos están aquí para buscar el suyo."

 cosmic_order_high_god_name: "Jya"
 cosmic_order_high_god_name_possessive: "De Jya"
 cosmic_order_household_god_name: "$cosmic_order_high_god_name$"
 cosmic_order_household_god_name_possessive: "$cosmic_order_high_god_name_possessive$"
 cosmic_order_fate_god_name: "$cosmic_order_high_god_name$"
 cosmic_order_fate_god_name_possessive: "$cosmic_order_high_god_name_possessive$"
 cosmic_order_knowledge_god_name: "$cosmic_order_high_god_name$"
 cosmic_order_knowledge_god_name_possessive: "$cosmic_order_high_god_name_possessive$"
 cosmic_order_war_god_name: "Agni"
 cosmic_order_war_god_name_possesive: "De Agni"
 cosmic_order_night_god_name: "Chandra"
 cosmic_order_night_god_name_possessive: "De Chandra"
 cosmic_order_water_god_name: "$cosmic_order_high_god_name$"
 cosmic_order_water_god_name_possessive: "$cosmic_order_high_god_name_possessive$"



 dreaming_sands: "Arenas de los Sueños"
 dreaming_sands_adj: "Ensueño"
 dreaming_sands_adherent: "Soñador"
 dreaming_sands_adherent_plural: "Soñadores"
 dreaming_sands_desc: "Los mares gemelos de agua y arena son polos opuestos, pero iguales como fuentes de sabiduría. Cada grano de arena, cada gota de agua contiene los recuerdos de quienes estuvieron antes. Es en el Tiempo del Sueño donde estos recuerdos se aclaran.\n\nLa mayoría de los Soñadores pasan la mayor parte de sus vidas en los desiertos profundos, pero realizan peregrinaciones regulares a los océanos y mares del mundo. Un Viaje facilitado al seguir las Líneas de Canción; senderos de Mnesis en el Tiempo del Sueño creados por el Gumagan."


 dragons_zhong_guo: "Dragones de Zhong Guo"
 dragons_zhong_guo_adj: "Zhong Guo"
 dragons_zhong_guo_adherent: "Dragón"
 dragons_zhong_guo_adherent_plural: "Dragones"
 dragons_zhong_guo_desc: "Los Zhong Lung, Dragones del Este y Primogénitos de los Hengeyokai, son los sabios, eruditos y guerreros de las Cortes de la Bestia. Junto a la Madre Esmeralda (Gaia) y el Sol, reverencian a los Wani, sus ancestros dragones.\n\nAl igual que el Makara, creen en el Equilibrio, un principio supremo que gobierna todo el universo. El Equilibrio del yin y el yang, de la luz y la oscuridad, del [Glossary('Devisor', 'glossary_wyld_tt')], el [Glossary('Designer', 'glossary_weaver_tt')] y el [Glossary('Dissolver', 'glossary_wyrm_tt')], es más importante que la bondad o maldad inherente de los [Glossary('Three', 'glossary_triat_tt')]."


 emerald_memory: "Memoria Esmeralda"
 emerald_memory_adj: "Esmeralda"
 emerald_memory_adherent: "Guardián"
 emerald_memory_adherent_plural: "Guardianes"
 emerald_memory_desc: "Las Cortes de la Bestia albergan a muchos Mokolé además de los Zhong Lung. Los Dragones tienen un papel muy establecido dentro de las Cortes; el Makara y el Gumagan, en cambio, sirven al propósito destinado de su raza, siendo la memoria de Gaia. La Memoria Esmeralda preserva y documenta la historia de las Cortes de la Bestia y de la $glossary_fera$ mientras la Rueda de las Eras sigue girando. También actúan como consejeros dentro de las Cortes para que los errores del pasado no se repitan, al menos eso esperan."


 eternal_breath: "Aliento Eterno"
 eternal_breath_adj: "Eterno"
 eternal_breath_adherent: "Eterno"
 eternal_breath_adherent_plural: "Eternos"
 eternal_breath_desc: "Los adeptos del Aliento Eterno creen que solo los Mokolé sobrevivirán hasta que el mundo deje de existir. Ni los #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L;bold demonios de sangre#!#!, ni las otras $glossary_fera$, y especialmente no los #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L;bold orgullosos monos#!#!. Las Cortes de la Bestia fracasarán; las otras Razas Cambiantes han demostrado que nunca aprenderán del pasado. Solo mediante el dominio de sus propios cuerpos y espíritus los Mokolé sobrevivirán a todos. Ya han sobrevivido a un Apocalipsis, sobrevivirán a otro."







