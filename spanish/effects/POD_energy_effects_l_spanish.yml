# varios
 hunger_increase_effect.hungerless: "Debido a tu suministro ilimitado de sangre, tu [hunger_with_icon|E] no cambiará."
 hunger_decrease_effect.tt.full: "Como ya estás saciado, el [hunger_with_icon|E] no disminuirá."
 hunger_decrease_effect.tt.nourishment: "@warning_icon!#N Dado que tienes [GetPlayer.Custom('PODBloodPotency')], tomar una cantidad tan pequeña de sangre no es suficiente para saciar tu [hunger_with_icon|E].#!"
