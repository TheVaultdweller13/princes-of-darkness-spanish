l_spanish:
# Tipos de energía
 POD_energy_angst: "@wraith_icon!Angst"
 POD_energy_pathos: "@wraith_icon!Pathos"
 POD_energy_blood: "[hunger_i]Sangre"
 POD_energy_resolve: "@demon_icon!Fe"
 POD_energy_gnosis: "@gnosis_icon!Gnosis"
 POD_energy_glamour: "@changeling_icon!Glamour"
 POD_energy_dread: "[Concept('dread','@dread_icon!Pavor')|E]"
 POD_energy: "[Concept('static_stress','@stress_loss_icon!Fuerza de Voluntad')|E]"

 POD_energy_angst_icon: "@wraith_icon!"
 POD_energy_pathos_icon: "@wraith_icon!"
 POD_energy_blood_icon: "[hunger_i]"
 POD_energy_resolve_icon: "@demon_icon!"
 POD_energy_gnosis_icon: "@gnosis_icon!"
 POD_energy_glamour_icon: "@changeling_icon!"
 POD_energy_dread_icon: "[Concept('dread','@dread_icon!')]"
 # usando el icono de ganancia de estrés en lugar del de pérdida, ya que tiene más sentido para los costes de energía
 POD_energy_icon: "[Concept('static_stress','@stress_gain_icon!')]"

 POD_splat_energy_cost: "$VALUE|0$ [CHARACTER.Custom('PODEnergySplatIcon')]"

# Mantenimiento de recipientes de energía
 POD_extract_energy_desc: "Se usarán #bold [Multiply_CFixedPoint( SCOPE.GetValue('spent_energy_amount'), this_character.MakeScope.ScriptValue('splat_energy_multiplier') )|V0]#! [this_character.Custom('PODEnergySplat')] almacenados del [this_artifact.Custom('ColorizedArtifactName')]"
 POD_store_energy_desc: "Se almacenarán #bold [Multiply_CFixedPoint( SCOPE.GetValue('stored_energy_amount'), this_character.MakeScope.ScriptValue('splat_energy_multiplier') )|V0]#! [this_character.Custom('PODEnergySplat')] en el [this_artifact.Custom('ColorizedArtifactName')]"
 POD_energy_vessel_add_max_effect: "Añadir el máximo posible de [GetPlayer.Custom('PODEnergySplat')] almacenados: [Multiply_CFixedPoint( '(CFixedPoint)$VALUE|q$', GetPlayer.MakeScope.ScriptValue('splat_energy_multiplier') )|V0]"

# loc de custom_description
