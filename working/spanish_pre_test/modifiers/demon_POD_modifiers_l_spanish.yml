  namaru_dynasty_modifier: "Restos celestiales de los Namaru"
  namaru_dynasty_modifier_desc: "Antaño la gran Casa Celestial del Lucero del Alba, reducida a meros restos de lo que fue.\n#help Otorga acceso al Saber del Heraldo.#!"
  asharu_dynasty_modifier: "Restos celestiales de los Asharu"
  asharu_dynasty_modifier_desc: "Antaño la gran Casa Celestial del Firmamento, reducida a meros restos de lo que fue.\n#help Otorga acceso al Saber del Portador de Vida.#!"
  annunaki_dynasty_modifier: "Restos celestiales de los Annunaki"
  annunaki_dynasty_modifier_desc: "Antaño la gran Casa Celestial del Fuego y la Piedra, reducida a meros restos de lo que fue.\n#help Otorga acceso al Saber de la Creación.#!"
  neberu_dynasty_modifier: "Restos celestiales de los Neberu"
  neberu_dynasty_modifier_desc: "Antaño la gran Casa Celestial de las Esferas, reducida a meros restos de lo que fue.\n#help Otorga acceso al Saber del Vidente.#!"
  lammasu_dynasty_modifier: "Restos celestiales de los Lammasu"
  lammasu_dynasty_modifier_desc: "Antaño la gran Casa Celestial de las Profundidades, reducida a meros restos de lo que fue.\n#help Otorga acceso al Saber de la Belleza.#!"
  rabisu_dynasty_modifier: "Restos celestiales de los Rabisu"
  rabisu_dynasty_modifier_desc: "Antaño la gran Casa Celestial de lo Salvaje, reducida a meros restos de lo que fue.\n#help Otorga acceso al Saber de los Vivos.#!"
  halaku_dynasty_modifier: "Restos celestiales de los Halaku"
  halaku_dynasty_modifier_desc: "Antaño la gran casa celestial de la Noche Cayente, reducida a meros restos de lo que fue.\n#help Otorga acceso al Saber de lo Etéreo.#!"
 
  ritual_of_sundered_soul_tt: "#I Este [modifier|E] puede mejorarse mediante una decisión.#!"
  ritual_of_sundered_soul_tt2: "#I Al morir, resucitarás degradando este modificador. #X;bold Si mueres con el [GetModifier('ritual_of_sundered_soul_unstable_modifier').GetNameWithTooltip], quedarás atrapado en el Abismo para siempre.#!#!"
  ritual_of_sundered_soul_unstable_modifier: "Ritual inestable del alma fragmentada"
  ritual_of_sundered_soul_unstable_modifier_desc: "El Ritual del Alma Fragmentada es una nueva innovación dada por Lucifer a su hueste caída para permitirles interactuar con el mundo mortal. Sin embargo, su inestabilidad actual lo convierte en un asunto muy desagradable.\n\n$ritual_of_sundered_soul_tt$\n\n$ritual_of_sundered_soul_tt2$\n\n"
  ritual_of_sundered_soul_semi_stable_modifier: "Ritual vacilante del alma fragmentada"
  ritual_of_sundered_soul_semi_stable_modifier_desc: "Has mejorado el diseño de Lucifer para el ritual lo suficiente como para poder permanecer activo en cualquier anfitrión dado durante más tiempo.\n\n$ritual_of_sundered_soul_tt$\n\n$ritual_of_sundered_soul_tt2$\n\n"
  ritual_of_sundered_soul_modifier: "Ritual del alma fragmentada"
  ritual_of_sundered_soul_modifier_desc: "Lo suficientemente sólido como para permitirte manifestar más de tu poder en la Tierra, el ritual demuestra ser un activo más poderoso cada día.\n\n$ritual_of_sundered_soul_tt$\n\n$ritual_of_sundered_soul_tt2$\n\n"
  ritual_of_sundered_soul_stabilized_modifier: "Ritual estabilizado del alma fragmentada"
  ritual_of_sundered_soul_stabilized_modifier_desc: "Has perfeccionado la idea de trabajo que Lucifer dio una vez a la hueste caída. Tu verdadera majestad puede ahora revelarse al mundo.\n\n$ritual_of_sundered_soul_tt2$\n\n"
  ritual_of_sundered_soul_exalted_modifier: "Ritual exaltado del alma fragmentada"
  ritual_of_sundered_soul_exalted_modifier_desc: "Ya no dependes de anfitriones mortales, sino que has vinculado tu alma a un receptáculo eterno de tu propia creación. El mundo tiembla mientras dejas tu marca en él.\n\n$ritual_of_sundered_soul_tt2$\n\n"
 
  POD_shapeshift_form_apocalyptic_angelic_modifier: "Forma apocalíptica angélica"
  POD_shapeshift_form_apocalyptic_damned_modifier: "Forma apocalíptica condenada"
  
  arsenal_of_the_beast_claws_modifier: "Garras"
  arsenal_of_the_beast_claws_modifier_desc: "Las uñas del personaje se extienden como los talones curvos de una rapaz o las garras retráctiles de un gato."
  arsenal_of_the_beast_fangs_modifier: "Colmillos"
  arsenal_of_the_beast_fangs_modifier_desc: "Los dientes del personaje se vuelven afilados como los de un lobo u otro gran depredador, o quizás luce un pico de rapaz."
  arsenal_of_the_beast_gaping_maw_modifier: "Fauces abiertas"
  arsenal_of_the_beast_gaping_maw_modifier_desc: "La mandíbula del personaje se desencaja o simplemente se distiende de forma imposible, presentando hilera tras hilera de colmillos relucientes."
  arsenal_of_the_beast_horns_modifier: "Cuernos"
  arsenal_of_the_beast_horns_modifier_desc: "Al personaje le brotan cuernos de cabra arquetípicos, astas como las de un ciervo, espolones óseos antinaturales que sobresalen del cráneo o algún otro crecimiento que permite ataques de cornada."
  arsenal_of_the_beast_lashing_tail_modifier: "Cola azotadora"
  arsenal_of_the_beast_lashing_tail_modifier_desc: "El personaje luce una poderosa cola musculosa."
  arsenal_of_the_beast_poison_modifier: "Veneno"
  arsenal_of_the_beast_poison_modifier_desc: "El cuerpo del personaje produce un veneno mortal."
  arsenal_of_the_beast_venom_spit_modifier: "Escupitajo de veneno"
  arsenal_of_the_beast_venom_spit_modifier_desc: "El personaje tiene una glándula de veneno en la garganta que le permite rociar veneno."
  arsenal_of_the_beast_spines_modifier: "Espinas"
  arsenal_of_the_beast_spines_modifier_desc: "Púas de hueso o cerdas sobresalen de la piel del personaje."
  arsenal_of_the_beast_tentacles_modifier: "Tentáculos"
  arsenal_of_the_beast_tentacles_modifier_desc: "El personaje tiene un largo tentáculo o una cola prensil."
  arsenal_of_the_beast_wings_modifier: "Alas"
  arsenal_of_the_beast_wings_modifier_desc: "Al personaje le crecen grandes alas en la espalda, que extendidas miden un tercio más que su altura."
  
  implacable_vengeance_perk_modifier: "Venganza implacable"
  
  unknown_eminence_modifier: "Eminencia desconocida"
  unknown_eminence_modifier_desc: "Has sido olvidado por mortales, Dios y demonios por igual. Tu Nombre Celestial ya no inspira miedo ni respeto." 
  known_eminence_modifier: "Eminencia conocida"
  known_eminence_modifier_desc: "Tu Nombre Celestial suena familiar para muchos demonios, aunque no recuerdan tu propósito original ni tus logros."
  respected_eminence_modifier: "Eminencia respetada"
  respected_eminence_modifier_desc: "La mayoría de los demonios probablemente han oído hablar de ti por tu nombre y muchos tienen una idea aproximada de lo que hiciste antes de la rebelión, aunque solo sea por afiliación general."
  honored_eminence_modifier: "Eminencia honrada"
  honored_eminence_modifier_desc: "Tuviste una posición de autoridad sobre un grupo de otros ángeles antes y durante la rebelión. Alguna faceta particular de la Creación era tuya para diseñar o mantener, abarcando una serie de conceptos, seres u objetos integrados."
  powerful_eminence_modifier: "Eminencia poderosa"
  powerful_eminence_modifier_desc: "Una vez, dirigiste a tus hermanos en la creación de algún componente integral del cosmos. Quizás los mismos diseños de esta obra fueron tuyos, y fuiste famoso en toda la hueste por tu ingenio y visión."   
  exalted_eminence_modifier: "Eminencia exaltada"
  exalted_eminence_modifier_desc: "En el principio, existía el Verbo, y tú estuviste entre las siguientes sílabas pronunciadas por Él. Dirigiste una división entera de la creación y estuviste al lado de Lucifer como uno de sus oficiales elegidos en la rebelión. Todos los demonios saben de ti y conocen tu Nombre Celestial, recuerden o no por qué."  
  
  longevity_modifier: "Esperanza de vida extra"
  
  extinguish_life_modifier: "Extinguir vida"
 
  the_mark_of_the_celestials_perk_modifier: "La Marca de los Celestiales"
  
