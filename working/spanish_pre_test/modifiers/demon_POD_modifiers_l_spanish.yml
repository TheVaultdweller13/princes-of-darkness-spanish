  POD_reapers_hunger_modifier: "Hambre del Segador"
  POD_beyond_now_modifier: "Conciencia del futuro"
  POD_failed_tempting_modifier: "Tentación fallida"
  POD_failed_tempting_modifier_desc: "Este personaje ha resistido con éxito las viles tentaciones de un $POD_splat_demon$, lo que le hace desconfiar de otros intentos similares en el futuro cercano."
 
