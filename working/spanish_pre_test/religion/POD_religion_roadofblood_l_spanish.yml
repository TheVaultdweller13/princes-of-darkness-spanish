 # Fe de grupo Centinela
 tariqelhaqim: "Tariq el-Haqim"
 tariqelhaqim_adj: "Banu Haqim"
 tariqelhaqim_adherent: "Centinela"
 tariqelhaqim_adherent_plural: "Centinelas"
 tariqelhaqim_desc: "Aquellos que siguen la Via Sanguinus se encuentran entre los más letales para sus compañeros $pod_cainites$, ya que el acto de la $pod_diablerie$ es casi un rito de purificación entre los Centinelas. De hecho, uno de los preceptos principales de la vía es que sus seguidores purguen a todos los que no sean dignos de la sangre de Caín y purifiquen los linajes."
 
 pathofrighteousness: "Senda de la Rectitud"
 pathofrighteousness_adj: "Rectitud"
 pathofrighteousness_adherent: "Vigía"
 pathofrighteousness_adherent_plural: "Vigías"
 pathofrighteousness_desc: "Vigías sobre Vigías, los seguidores de esta senda se ocupan de erradicar la corrupción y la falta de resolución entre los seguidores de la Vía de la Sangre."
 
 holy_order_sentinnels_of_haqim: "Los Centinelas de Haqim"
 holy_order_knives: "Los Cuchillos en la Oscuridad"
 holy_order_judges: "Los Jueces"
 holy_order_alamut: "Los Guerreros de Alamut"
 
 sisterhoodoferinyes: "Hermandad de las Erinias"
 sisterhoodoferinyes_adj: "Hermanal"
 sisterhoodoferinyes_adherent: "Hermana"
 sisterhoodoferinyes_adherent_plural: "Hermanas"
 sisterhoodoferinyes_desc: "La Hermandad ha existido de una forma u otra desde las noches de la antigua Grecia, cuando un visir dio la sangre a un trío de hermanas de las que se rumoreaba que tenían poderes proféticos.\nDedicadas a defender la visión de la justicia de Haqim, las Hermanas han sido a menudo condenadas al ostracismo por el Alamut dominado por hombres, pero siempre se han comportado públicamente y con orgullo en los salones de los Banu Haqim."
