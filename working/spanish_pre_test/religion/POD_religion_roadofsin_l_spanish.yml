  #Sinner-Group Faiths
  viapeccati: "Via Peccati"
  viapeccati_adj: "Peccati"
  viapeccati_adherent: "Pecador"
  viapeccati_adherent_plural: "Pecadores"
  viapeccati_desc: "Los seguidores de la Via Peccati controlan a su Bestia entregándose a sus caprichos y deseos, sin importar a quién dañen. No hacer lo que les place empeora su condición, lo que significa que la moral, la ética y las leyes suelen quedar en el camino mientras avanzan por esta Vía. Los seguidores de la Via Peccati no son malvados per se; simplemente son completamente autoindulgentes."
 
  viavoluptuous: "Via Voluptarius"
  viavoluptuous_adj: "Voluptarius"
  viavoluptuous_adherent: "Voluptuario"
  viavoluptuous_adherent_plural: "Voluptuarios"
  viavoluptuous_desc: "Los Pecadores de la Senda del Placer son los más hedonistas de los que siguen la Vía del Pecado. Para ellos, el placer lo es todo en lo que respecta a su existencia, y absolutamente nada es tabú."
 
  viacrudelitas: "Via Crudelitas"
  viacrudelitas_adj: "Crudelitas"
  viacrudelitas_adherent: "Desalmado"
  viacrudelitas_adherent_plural: "Desalmados"
  viacrudelitas_desc: "Los seguidores de la Senda de la Crueldad son los más cínicos y odiosos de los Pecadores. Partiendo en gran medida de una filosofía de 'herirlos antes de que te hieran', los Pecadores aquí no creen en la misericordia, la compasión o la piedad. Más bien, su único placer deriva del dolor de los demás."
 
  viaadversarius: "Via Adversarius"
  viaadversarius_adj: "Adversarius"
  viaadversarius_adherent: "Adversario"
  viaadversarius_adherent_plural: "Adversarios"
  viaadversarius_desc: "La 'Senda del Diablo' no debe confundirse con la llamada Via Diabolis; estos Pecadores trabajan para evitar ser manipulados. Los definitivos obsesos del control, llegarán a extremos para proteger su libre albedrío y, inusualmente, el libre albedrío de los demás. Muchos los consideran los más 'agradables' de los Pecadores."
 
  viadiabolis: "Via Diabolis"
  viadiabolis_adj: "Diabolis"
  viadiabolis_adherent: "Diablo"
  viadiabolis_adherent_plural: "Diablos"
  viadiabolis_desc: "Siendo una Vía inherentemente destructiva, la Via Diabolis no se considera un camino a tomar a la ligera; aquellos que se atreven a seguirla se entregan a todo tipo de libertinaje y destrucción. Muchos no son realmente malvados per se, sino que creen que una no-vida virtuosa es una búsqueda infructuosa. Algunos, sin embargo, se tomaron en serio el papel de diablo, incluso llamándose a sí mismos diablos encarnados y servidores de Satán. Los Baali en particular están asociados con la Via Diabolis."
 
  viaprometheus: "Via Prometheus"
  viaprometheus_adj: "Prometeo"
  viaprometheus_adherent: "Prometeo"
  viaprometheus_adherent_plural: "Prometeos"
  viaprometheus_desc: "También llamados Portadores del Fuego, son una secta de $pod_cainites$ que sueñan con recrear Cartago y la armonía de Vástagos y Ganado asociada a ella. Como era de esperar, muchos miembros son Brujah. Dado que muchos miembros de los Clanes Altos consideran estas visiones como traición, los Prometeos se ven obligados a actuar de forma encubierta."
  
  viafurores: "Via Furores"
  viafurores_adj: "Furores"
  viafurores_adherent: "Furores"
  viafurores_adherent_plural: "Furores"
  viafurores_desc: "Los miembros de esta secta tienen reputación de ser los proscritos de los $pod_cainites$. Condenados por la mayoría de los príncipes como ladrones y alborotadores, existen en los márgenes de la sociedad vampírica, ganándose una existencia precaria como sus homólogos mortales. Los Furores son considerados caóticos, pero pueden reunir un nivel de pasión por su causa no visto en ningún otro lugar de la sociedad $pod_cainite$."
 
  viaquiritare: "Via Quiritare"
  viaquiritare_adj: "Quiritare"
  viaquiritare_adherent: "Gritón"
  viaquiritare_adherent_plural: "Gritones"
  viaquiritare_desc: "Los más locos de los Pecadores y los opuestos a la Via Adversarius, los seguidores de la Senda de los Gritos creen que, como ya están condenados, también son ya presa de la Bestia y, por lo tanto, se dejan manipular por ella para cumplir sus órdenes. Son esencialmente ejemplos vivientes del Infierno en la Tierra; incluso otros Pecadores son reacios a asociarse con estos locos."
  
  pathoftheeightfoldwheel: "La Rueda Óctuple"
  pathoftheeightfoldwheel_adj: "Druida"
  pathoftheeightfoldwheel_adherent: "Druida"
  pathoftheeightfoldwheel_adherent_plural: "Druidas"
  pathoftheeightfoldwheel_desc: "La Senda de la Rueda Óctuple se nutre del paganismo celta, con un enfoque especial en el druidismo. Dan gran importancia a honrar a los dioses y espíritus de la naturaleza, sirviendo al equilibrio en todas las cosas, y a un calendario rotativo de festivales de base astronómica."
  
  pathofwatchfulgods: "Via Deorum Vigilans"
  pathofwatchfulgods_adj: "Vaticinador"
  pathofwatchfulgods_adherent: "Vaticinador"
  pathofwatchfulgods_adherent_plural: "Vaticinadores"
  pathofwatchfulgods_desc: "La Senda de los Dioses Vigilantes venera el panteón pagano de los antiguos griegos y romanos, aunque panteones de diferentes tradiciones paganas también se orientan en la Senda. Los vampiros en esta senda se dedican a servir a los dioses mediante la realización de sacrificios regulares, honrando y protegiendo aquello que los dioses consideran sagrado, y adhiriéndose a estrictos códigos de honor."
 
  viahyron: "Via Hyron"
  viahyron_adj: "Abeleno"
  viahyron_adherent: "Abeleno"
  viahyron_adherent_plural: "Abelenos"
  viahyron_desc: "La Vía de la Colmena es seguida casi exclusivamente por los Baali de la Orden de Moloch. La Vía predica una lealtad total a la línea de sangre en su conjunto y a su [Glossary('Sire','game_concept_Sire_desc')] en particular. La razón principal de esto es que las Grandes Obras que los Baali quieren lograr no pueden ser reclamadas en solitario o cuando interfieren con el trabajo de otros. El vampiro tuvo que dejar entrar las voces del Enjambre en su alma para comprender los sueños de los seres de la Oscuridad Exterior y mantenerlos dormidos. Aparte de eso, la mayoría de los demás vampiros destruirían activamente a un Baali si fuera lo suficientemente necio como para revelarse como seguidor."
  
  viatartaros: "Via Tártaros"
  viatartaros_adj: "Via Tártaros"
  viatartaros_adherent: "Tártaro"
  viatartaros_adherent_plural: "Tártaros"
  viatartaros_desc: "Esta religión no canónica ha sido encargada por un mecenas.\nCuidado, aquí hay demonios. Las llaves de nuestras prisiones de carne y hueso no pueden encontrarse solo mediante el estudio y el experimento; en su lugar debemos buscar, es más, tomar, ese conocimiento poseído por aquellos que están más allá del umbral del mundo. Algunos podrían llamarnos internalistas, si conocieran nuestra verdadera intención, de ascender más allá de la prisión en la que hemos nacido dos veces. Este camino es oscuro y está plagado de peligros, y la única luz que podemos encontrar es un terrible resplandor penetrante, que amenaza con quemar nuestra carne y desangrar nuestro propio espíritu."
 
  holy_order_the_sinful: "Los Pecadores"
  holy_order_order_of_pustula: "Orden de Pústula"
  holy_order_brothers_of_the_black_mountain: "Hermanos de la Montaña Negra"
  holy_order_legio_peccati: "Legio Peccati"
