l_spanish:
  POD_custom_nickname.10.t: "Apodo Personalizado"
  POD_custom_nickname.10.desc: "Muchos de los habitantes del Mundo de Tinieblas son conocidos por algo más que su nombre; ¿eres tú uno de ellos o aún tienes que ganarte tal honor?"
  POD_custom_nickname.10.a: "Sí, permíteme elegir cómo seré llamado"
  POD_custom_nickname.10.b: "No, todavía no tengo un apodo"

  POD_custom_nickname.100.t: "Apodo Personalizado"
  POD_custom_nickname.100.desc: "Se debe tomar una decisión importante, ¿cómo deseas ser llamado? \n\nSi tomas una mala decisión, tendrás que vivir con ella durante mucho tiempo."
  POD_custom_nickname.100.a: "De ahora en adelante seré conocido como..."

   #Ambos son necesarios para que el apodo personalizado funcione correctamente.
  nick_POD_custom_nickname1: "[ROOT.Char.GetLocalizedText('POD_custom_nickname_text')]"
  nick_POD_custom_nickname2: "[CHARACTER.Custom('PODCustomNickname')]"

  nick_POD_custom_nickname_default: "el Difunto"
