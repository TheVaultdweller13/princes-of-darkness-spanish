l_spanish:

 pod_knights.1.t: "El campeón arrogante"
 pod_knights.1.desc: "Se te ha informado de que uno de tus campeones ha sido descuidado recientemente. Involucrado en una pelea con mortales, [knight.GetSheHe] usó los poderes de la sangre para aplastarlos fácilmente, una clara violación de [the_masquerade|E]. Peor aún, ¡luego alardeó de ello en la ciudad!\nEste comportamiento seguramente atraerá la mirada no deseada de la Inquisición, pero aún podrías salvar la situación si cortas tu asociación con este molesto fanfarrón."
 pod_knights.1.a: "¡Fuera de mi vista, idiota!"
 pod_knights.1.b: "Estás perdonado, esta vez"
 pod_knights.2.t: "El campeón engañoso"
 pod_knights.2.desc: "Uno de tus campeones ha sido un verdadero dolor de cabeza durante bastante tiempo. Difundiendo rumor tras rumor, pensaste por un momento que [knight.GetSheHe] estaba preparando algún complot contra ti. Pero tras una cuidadosa investigación, estás bastante seguro de que lo hace más por diversión que por algún motivo oculto.\nAun así, esto es una clara amenaza para tu credibilidad y podrías querer tomar medidas más pronto que tarde."
 pod_knights.2.a: "¡Vete, molesto chismoso!"
 pod_knights.2.b: "...Demasiado importante para simplemente despedirlo, lamentablemente"
 pod_knights.3.t: "El campeón iracundo" 
 pod_knights.3.desc: "No sabes cómo empezó realmente. Pero uno de tus campeones, conocido por ser bastante fogoso, ha entrado en frenesí en medio de tu corte por un insulto insignificante o algo parecido. Tienes dos opciones: podrías llamar a los guardias y a tus otros guerreros para someter a este berserker. Sin embargo, tal humillación social probablemente significaría que [knight.GetSheHe] nunca volvería a estar a tu servicio.\nO simplemente podrías dejar que el frenesí siga su curso, sin preocuparte por las posibles víctimas..."
 pod_knights.3.a: "Echa a esta bestia de mi vista"
 pod_knights.3.b: "Hora de hacer una purga de vasallos, supongo"
 pod_knights.4.t: "El campeón cobarde" 
 pod_knights.4.desc: "Uno de tus campeones es un conocido cobarde. Siempre buscando una forma de evitar las peleas, [knight.GetSheHe] se ha convertido en el hazmerreír de tu corte, aunque nadie se atreve a decirlo en voz alta... todavía. Anticipas claramente que esto cambiará pronto, y será una gran mancha en tu prestigio albergar a tal individuo.\nPodrías simplemente aguantarlo, o retirar al cobarde de tu servicio antes de que se convierta en un problema."
 pod_knights.4.a: "Asusta a este idiota para que se vaya de mi corte"
 pod_knights.4.b: "Que hablen, no me importa"
 pod_knights.5.t: "El campeón codicioso" 
 pod_knights.5.desc: "Es la cuarta vez este mes que uno de tus campeones pide más dinero. Ya ni siquiera sabes si se trata de armadura, armas o caballo. O tal vez [knight.GetSheHe] ni siquiera se molestó en ocultar su pura codicia esta vez.\nObviamente, tienes derecho a ponerle fin aquí y ahora, pero ¿quizás valoras más la proeza marcial que el oro?"
 pod_knights.5.a: "Echa a este bastardo codicioso de mi corte"
 pod_knights.5.b: "Tendrás tu maldito caballo, o armadura, lo que sea"
 pod_knights.6.t: "El campeón paranoico" 
 pod_knights.6.desc: "Uno de tus campeones está acusando... bueno, a casi todo el mundo de conspirar contra tu legítimo gobierno. Ya sean mortales, cortesanos, vasallos o transeúntes al azar. Estás bastante seguro de que esto es una ligera simplificación de la situación, pero... tal vez [knight.GetSheHe] tenga razón.\n¡Tus consejeros te dicen que eches a esta mala influencia de tu corte pero... tal vez ellos también estén en esta conspiración global!"
 pod_knights.6.a: "Aunque tienen un punto..."
 pod_knights.6.b: "¡Traidores! ¡En todas partes!"
 pod_knights.7.t: "El campeón cínico" 
 pod_knights.7.desc: "Siempre haciendo de abogado del diablo, uno de tus campeones está constantemente molestando a la corte, y a ti mismo, sobre la hipocresía de las Vías y la inevitable victoria de la Bestia sobre todos los $pod_cainites$ al final. Algunos de tus cortesanos te han pedido que retires a este personaje cínico de tu séquito antes de que sus discursos empiecen a erosionar la fuerza de voluntad de todos tus seguidores."
 pod_knights.7.a: "La salvación del alma no tiene precio"
 pod_knights.7.b: "...pero puede esperar un poco más"
 pod_knights.8.t: "El campeón vengativo" 
 pod_knights.8.desc: "Un campeón ha acudido a ti pidiendo venganza por un desaire percibido que [knight.GetSheHe] sufrió en un pueblo cercano. Sabes que este personaje es muy apasionado en estos asuntos y esto podría llegar lejos, muy lejos. Pero también sabes que [knight.GetSheHe] no se tomará bien que digas que no a esta petición..."
 pod_knights.8.a: "Encárgate de esto tú mismo"
 pod_knights.8.b: "¡Ayudaré, pero no quemaremos todo el lugar!... No del todo al menos"
 
 pod_knights.100.t: "$knight_culture_player_plural_no_tooltip$ desleales"
 pod_knights.100.desc: "Los $knight_culture_player_plural$ solo están dispuestos a luchar por un líder en el que realmente crean. Al fin y al cabo, están arriesgando sus vidas.\n\nÚltimamente, ha habido susurros en la corte de que algunos de tus campeones consideran marcharse y buscar fortuna en otra parte."
 pod_knights.100.tt: "Estos $knight_culture_player_plural$ abandonarán tu corte por falta de [loyalty_with_icon|E] si su opinión sigue siendo inferior a [GetPlayer.MakeScope.ScriptValue('POD_loyalty_opinion')|0V] el año que viene:"
 pod_knights.100.tt2: "Alternativamente, puedes #P;bold darles tierras#!, o asegurar su [loyalty_with_icon|E] de otras formas."
 pod_knights.100.a: "Preocupante."
 pod_knights.100.b: "Te relevaré de tus deberes de combate."
 pod_knights.100.message: "El $knight_culture_player$ se marcha por falta de [loyalty_with_icon|E]"