l_spanish:
 pod1230objectives_mummy.1.t: "Acabando con la Serpiente"
 pod1230objectives_mummy.1.desc: "La guerra eterna entre Horus y Set es solo una continuación de la que hubo entre Osiris y Set, y en sí misma es solo una manifestación del Equilibrio contra la Entropía. Es una batalla fundamental por la realidad misma y nosotros estuvimos, lamentablemente, en el bando perdedor durante muchísimo tiempo.\nAunque Set y $glossary_wyrm_apophis$ están, al menos por ahora, fuera de nuestro alcance, sus sirvientes no lo están. Nuestros renovados esfuerzos para lograr la victoria comenzaron esta vez no por la cabeza de la serpiente, sino por su cuerpo.\n\nY está mostrando resultados prometedores."
 pod1230objectives_mummy.1.a: "Una victoria decisiva."

 pod1230objectives_mummy.2.t: "Tierra de Fe"
 pod1230objectives_mummy.2.desc: "Egipto es nuestro hogar y la tierra donde somos más fuertes gracias a la gran energía, el Sekhem, que podemos extraer de la tierra misma. Sin embargo, a lo largo de las eras, el propio Egipto cambió y su influencia se extendió por una vasta zona, y el Sekhem se extendió con ella. Esto nos da la oportunidad de aprovechar este poder lejos de nuestro hogar tradicional.\nLograr el control sobre toda la tierra bendecida por el poder sobrenatural de Egipto nos permitirá manifestar poderes no vistos desde los días de los Dioses y, con suerte, nos dará una ventaja crítica en las batallas venideras."
 pod1230objectives_mummy.2.a: "¿Logrando lo imposible?"

 pod1230objectives_mummy.3.t: "El Antagonista Principal: $glossary_wyrm_apophis$"
 pod1230objectives_mummy.3.desc: "$glossary_wyrm_apophis$, la Serpiente, siempre ha sido nuestro enemigo más fundamental. Él es la esencia misma de la entropía y el factor del desequilibrio. Set, en muchos sentidos, fue siempre solo su esbirro voluntario o involuntario. Luchar contra un ser tan primordial siempre ha estado fuera de nuestro alcance y Apofis usó esta invulnerabilidad para corromper lentamente el equilibrio, lo que llamamos Ma'at, y empujar al mundo hacia el olvido.\nSin embargo, como recientemente ganamos batalla tras batalla contra sus esbirros, vimos cómo el control de Apofis se reducía cada vez más hasta que todos recibimos el primer mensaje de Osiris desde su partida a Amenti: \"Acabad con esto\".\n\nY así lo hicimos.\n\nArmados con nuestro suministro casi infinito de Sekhem, seguimos a Anubis hasta el rincón más oscuro del Olvido y golpeamos a la Serpiente. Muchos de nosotros morimos, pero los poderes de Osiris aseguraron que regresaran una y otra vez. Algunos incluso dicen que la propia Isis apareció en el último momento para encadenar a Apofis para siempre.\n\nSea cual sea la verdad del asunto, Apofis ya no es una amenaza y el mundo ahora se moverá lentamente hacia la rectitud y el equilibrio como siempre debería haber sido.\nY nosotros velaremos por él, como siempre hacemos."
 pod1230objectives_mummy.3.a: "Nuestro triunfo final."

 pod1230objectives_mummy.4.t: "Manteniendo a salvo las raíces"
 pod1230objectives_mummy.4.desc: "Somos originarios del Antiguo Egipto, la tierra de los Dioses y el Faraón; nuestra propia existencia está ligada a esta tierra y nuestros recuerdos de ella alimentan nuestros poderes. Pero el mundo no esperó y hace tiempo que siguió adelante, dejando solo ruinas y reliquias saqueadas de nuestro hogar.\nAunque Horus pueda estar centrado en su guerra contra Set, perder la pista de dónde venimos podría destruirnos más seguramente que cualquier esbirro del traidor. Por eso seguiremos esforzándonos siempre por preservar el legado de Egipto, ya sea salvaguardando sus tesoros o enseñando su historia y cultura a las nuevas generaciones."
 pod1230objectives_mummy.4.a: "Egipto es lo que somos"

 pod1230objectives_mummy.5.t: "Cercenando la cabeza del Águila"
 pod1230objectives_mummy.5.desc: "Nuestro creador, Set, ha estado encerrado en una guerra con Horus durante generaciones. Aunque su incapacidad para destruir a su oponente es preocupante, tuviste que admitir que Horus era un enemigo digno. Tu verdadero maestro, $glossary_wyrm_apophis$, te lo dijo después de todo.\nEl Dios con cabeza de águila era el campeón de Ma'at (el \"equilibrio\" tal como él lo veía) y el principal obstáculo en el camino del triunfo de Apofis y su regalo del Olvido a este mundo. Con el \"Vengador\" uniéndose finalmente a sus padres en la muerte verdadera, la rueda gira más rápido que nunca..."
 pod1230objectives_mummy.5.a: "El último grito del águila."

 pod1230objectives_mummy.6.t: "Última comida antes de la medianoche"
 pod1230objectives_mummy.6.desc: "La muerte de Horus, aunque fue un golpe crítico para los \"defensores del equilibrio\", tuvo el efecto imprevisto de templar su resolución. Incluso aquellos que una vez combatieron a Horus por considerarlo demasiado celoso y testarudo ahora se unieron bajo su nombre (y su causa) para intentar detenerte.\n\nLo cual, obviamente, no lograron hacer.\n\nAun así, dieron una buena batalla y frenaron la victoria final del olvido y de $glossary_wyrm_apophis$ por un tiempo. Pero a medida que cae el último de ellos, el mundo mismo acelera su descenso hacia su fin. Apofis ha ganado y es hora de que esta realidad miserable sea desecha."
 pod1230objectives_mummy.6.a: "Hora del festín"

 pod1230objectives_mummy.7.t: "Apaciguando al Vengador"
 pod1230objectives_mummy.7.desc: "[GetScriptedCharacterByHistoryID('792593').GetFirstName] siempre ha dejado claro que cree que es el único que merece usar el Hechizo de Vida. Como tal, cualquier Momia que no acatara sus leyes tenía la desagradable experiencia de ser añadida a su lista de enemigos.\nAun así, Horus es testarudo pero no tonto. Sabe que hay amenazas mucho mayores que tú para el mundo en general. Convencer a su círculo íntimo y mostrar suficiente fuerza como para hacerle comprender que cazarte sería un asunto costoso han ayudado a aliviar un poco la tensión. Probablemente nunca serás amigo del hijo de Osiris, pero al menos ha aceptado a regañadientes dejarte en paz por ahora."
 pod1230objectives_mummy.7.a: "Un alto el fuego al menos."

 pod1230objectives_mummy.8.t: "Acabando con el Vengador"
 pod1230objectives_mummy.8.desc: "[GetScriptedCharacterByHistoryID('792593').GetFirstName] siempre ha dejado claro que cree que es el único que merece usar el Hechizo de Vida. Como tal, cualquier Momia que no acatara sus leyes tenía la desagradable experiencia de ser añadida a su lista de enemigos.\nRazonar con un ser todavía empeñado en la venganza después de que hayan pasado tantas eras es inútil. Las momias son difíciles de matar pero no verdaderamente inmortales, y te diste el gran placer de demostrar ese hecho a quien te causó tanto pesar a lo largo de las eras. Con el hijo de Osiris e Isis uniéndose finalmente a sus divinos padres en el más allá, puedes descansar tranquilo y trazar tu propio rumbo para el futuro."
 pod1230objectives_mummy.8.a: "Set debe estar riéndose ahora mismo."

 pod1230objectives_mummy.9.t: "Expandiendo las Artes de la Teúrgia"
 pod1230objectives_mummy.9.desc: "Las momias fueron creadas a partir del Hechizo de Vida del Antiguo Egipto y, por lo tanto, se sienten atraídas naturalmente por el Hekau, la forma de hechicería del Antiguo Egipto. Incluso aquellos que no pertenecían a esta cultura en su primera vida aprenden rápidamente el Hekau. Aun así, esto ha resultado ser un punto de frustración para otras momias, como los Cabiros de la Antigua Grecia, que una vez usaron otras formas de hechicería con grandes resultados.\nAunque los esfuerzos por redescubrir cómo usarlas han sido infructuosos durante mucho tiempo, tu reciente método de reunir a hechiceros mortales y su conocimiento (antiguo o reciente) ha mostrado algunos resultados prometedores. Aunque la hechicería que no sea Hekau probablemente nunca será tan fácil de usar para las momias como te gustaría, al menos debería ser posible."
 pod1230objectives_mummy.9.a: "Aprendices una vez más."

 pod1230objectives_mummy.10.t: "Asegurando el Hades"
 pod1230objectives_mummy.10.desc: "Cuando [GetScriptedCharacterByHistoryID('792600').GetFirstName] creó por primera vez su versión del Hechizo de Vida, se enfrentó al problema de no poder entrar en Amenti, el reino de los muertos del Antiguo Egipto donde las momias se toman el tiempo para reconstituirse entre cada muerte. Por ello, aseguró una porción muy pequeña de las Tierras de las Sombras a la que llamó \"Hades\" para el mismo uso y logró convencer a Caronte, el líder del Inframundo, para que aceptara este enclave, algunos dicen que debido a su trasfondo micénico compartido.\nSea cual sea el caso, el Hades seguía siendo una copia lamentable de Amenti y apenas era capaz de ayudar a las momias a alcanzar su verdadera inmortalidad. Gracias a tus esfuerzos, sin embargo, la situación ha mejorado y las momias Cabiras ahora pueden disfrutar de una estancia más segura en el Inframundo cuando llegue el momento."
 pod1230objectives_mummy.10.a: "Nuestros propios campos Elíseos."

 pod1230objectives_mummy.11.t: "De la Hélade a Egipto"
 pod1230objectives_mummy.11.desc: "Las momias fueron creadas en el Antiguo Egipto y extraen su energía, que llaman Sekhem, de esta tierra todavía. Las momias Cabiras, al ser de una rama creada siguiendo a su fundador micénico, no tienen ese lujo. Esto siempre las ha situado en desventaja, ya que el Sekhem puede ser utilizado para fines muy poderosos por momias experimentadas.\nComo son pocas en número y fueron cazadas por otros seres sobrenaturales, los Cabiros nunca tuvieron tiempo de estudiar adecuadamente este problema y encontrar una forma de eludirlo. Esto ha cambiado con tu reciente trabajo sobre la interacción y la toma de Sekhem de su fuente y su adaptación para tu propia base micénica. Con este éxito, finalmente has cerrado la brecha entre tú y los antiguos seguidores de Horus."
 pod1230objectives_mummy.11.a: "Fusionando lo griego y lo egipcio una vez más."

 pod1230objectives_mummy.12.t: "Protegiendo el Conocimiento"
 pod1230objectives_mummy.12.desc: "Los Wu'tian son aislacionistas y egocéntricos, pero incluso ellos saben que su inmortalidad les otorga una gran responsabilidad ante la llegada de la Sexta Edad. Aunque la victoria del [Glossary('Demon Emperor','podgloss.demonemperor')] no puede detenerse para siempre, seguirá siendo simplemente una edad entre muchas. Como tal, sienten que es su deber salvaguardar las bondades de las edades anteriores antes de que sea demasiado tarde.\nEl conocimiento en todas sus formas es una parte importante de ese esfuerzo. El [Glossary('Demon Emperor','podgloss.demonemperor')] marcará el comienzo de una era de ignorancia y podría empujar a la humanidad de vuelta hacia sus comienzos salvajes. Solo asegurándose de que la sabiduría de las eras pasadas no se pierda se podrá evitar esto."
 pod1230objectives_mummy.12.a: "Aprendemos, por lo tanto somos."

 pod1230objectives_mummy.13.t: "Protegiendo a la Gente"
 pod1230objectives_mummy.13.desc: "Los Wu'tian son aislacionistas y egocéntricos, pero incluso ellos saben que su inmortalidad les otorga una gran responsabilidad ante la llegada de la Sexta Edad. Aunque la victoria del [Glossary('Demon Emperor','podgloss.demonemperor')] no puede detenerse para siempre, seguirá siendo simplemente una edad entre muchas. Como tal, sienten que es su deber salvaguardar las bondades de las edades anteriores antes de que sea demasiado tarde.\nEl [Glossary('Demon Emperor','podgloss.demonemperor')] corromperá a la humanidad cuando ascienda al trono. Si logran ennegrecer los corazones de la humanidad en su conjunto, se perderá toda esperanza para las próximas edades. Como maestros inmortales e iluminados, los Wu'tian deben preparar refugios seguros para que la humanidad no pierda completamente su rumbo en la era oscura que se avecina."
 pod1230objectives_mummy.13.a: "Como comunidad, estamos a salvo."

 pod1230objectives_mummy.14.t: "Protegiendo a los Shen"
 pod1230objectives_mummy.14.desc: "Los Wu'tian son aislacionistas y egocéntricos, pero incluso ellos saben que su inmortalidad les otorga una gran responsabilidad ante la llegada de la Sexta Edad. Aunque la victoria del [Glossary('Demon Emperor','podgloss.demonemperor')] no puede detenerse para siempre, seguirá siendo simplemente una edad entre muchas. Como tal, sienten que es su deber salvaguardar las bondades de las edades anteriores antes de que sea demasiado tarde.\nOtras criaturas sobrenaturales lucharán valientemente para obstaculizar o frenar al [Glossary('Demon Emperor','podgloss.demonemperor')]. Aunque no lo lograrán, es fundamental para los Wu'tian asegurarse de que los virtuosos entre ellos no caigan. Distraer al [Glossary('Demon Emperor','podgloss.demonemperor')] asegurará que no puedan evitar que la Rueda alcance la siguiente edad después de su ascensión."
 pod1230objectives_mummy.14.a: "Héroes para una era condenada."

 pod1230objectives_mummy.15.t: "Protegiendo el Reino Medio"
 pod1230objectives_mummy.15.desc: "Has hecho lo que has podido. Quizás incluso más de lo que la mayoría habría pensado posible. Tus esfuerzos asegurarán que el [Glossary('Demon Emperor','podgloss.demonemperor')] no alcance su trono pronto y que su reinado no se encuentre sin resistencia.\nAun así, dudas de que sea suficiente y, en ese momento de duda, te das cuenta de que tu lugar entre los Ocho Inmortales puede alcanzarse, no como una recompensa como pensaste una vez, sino como un deber de hacer aún más.\nSi lo deseas, tu próximo campo de batalla contra las fuerzas del mal será el de las realidades cósmicas."
 pod1230objectives_mummy.15.a: "Todavía se me necesita aquí."
 pod1230objectives_mummy.15.b: "La guerra continúa en otra parte."

 pod1230objectives_mummy.16.t: "Alcanzando el Ra Hekau"
 pod1230objectives_mummy.16.desc: "Los antiguos Shemsu-Heru llamaban Ra-Hekau al arte supremo del Hekau, el dominio del mundo mediante el uso de los [Glossary('True Names','podgloss.truename')] de todo para doblegarlo a la voluntad de uno. Según la leyenda egipcia, el Ra-Hekau se reveló por primera vez cuando el Dios-Sol Ra le dio a Isis su [Glossary('True Name','podgloss.truename')] para que ella pudiera curarlo de un envenenamiento mortal. Le permitió convertirse en la Diosa de la Magia y construir el Hechizo de Vida.\nLamentablemente, pronto se dieron cuenta de que el Hechizo de Vida era defectuoso y que perdieron la chispa de humanidad que permite esta forma de verdadera magia después de su primera muerte. Ha sido un objetivo claro de algunos de ellos intentar redescubrir ese saber perdido o una forma de perfeccionar el Hechizo de Vida y permitir el regreso a esta Edad de Oro de los poderes de las momias.\nAunque lograr el control sobre el propio Ra-Hekau probablemente seguirá estando fuera de su alcance, experimentar y mejorar lo que saben todavía rinde beneficios incrementales a sus formas actuales."
 pod1230objectives_mummy.16.a: "Más cerca de nuestra gloria pasada."
