l_spanish:

 auspex_reveal_scheme: "¡Intriga expuesta!"
 auspex_reveal_scheme_tt: "¡Tu objetivo ha usado Auspex avanzado para exponer tu intriga!"
 
 POD_ai_disciplines.500.t: "Bichos frenéticos"
 POD_ai_disciplines.500.desc: "Sin ningún tipo de advertencia, la fauna local alrededor de tu capital se ha vuelto repentinamente muy hostil. Tus agentes informan de numerosos ataques contra los lugareños, y la cantidad de daños empieza a acumularse. Los mortales están asustados, y el comercio y la vida habitual en la región se han detenido a todos los efectos.\nAl estudiar uno de los animales muertos, finalmente comprendes que se trata de un ataque concertado de uno de tus vecinos usando sus considerables poderes en Animalismo. Podrías hacer un esfuerzo para detener este asalto, o simplemente intentar capear el temporal."
 POD_ai_disciplines.500.a: "¡Reunid a las tropas!"
 POD_ai_disciplines.500.success: "¡Has hecho retroceder a los animales!"
 POD_ai_disciplines.500.failure: "Eran demasiado fuertes..."
 POD_ai_disciplines.500.b: "¡Organizad a los mortales para que resistan!"
 POD_ai_disciplines.500.c: "Se quedarán sin sangre tarde o temprano..."

 POD_ai_disciplines.900.t: "Seducción de la Serpiente"
 POD_ai_disciplines.900.desc: "Recientemente te has sentido extrañamente bien dispuesto hacia tu señor. Parece más fuerte, más sabio, más... atractivo de lo habitual. Sospechando, has estado buscando las señales y ahora estás seguro de ello: los poderes seductores de Serpentis se están usando contra ti.\nSaberlo no facilita, sin embargo, el frenar esta atracción antinatural; aún tendrás que fortalecer tu mente contra ella."
 POD_ai_disciplines.900.a: "¿Por qué luchar contra ello?"
 POD_ai_disciplines.900.b: "¡Mi mente es mía!"

 POD_ai_disciplines.2000.t: "Los pastores vigilantes"
 POD_ai_disciplines.2000.desc: "Sin importar su casta o sus orígenes, los Salubri se consideran los guardianes de la humanidad. Su $pod_discipline$ distintiva, Valeren, refleja este hecho. Tu señor tiene algún conocimiento de este poder y se ha ofrecido a ayudarte a vigilar a los mortales de tu zona y a fomentar su crecimiento.\nSin embargo, nada es gratis en el mundo de los vampiros, y tal propuesta ciertamente justificaría un favor de vuelta por tu parte en algún momento."
 POD_ai_disciplines.2000.a: "Una ayuda agradecida."
 POD_ai_disciplines.2000.b: "Yo me encargaré de mis propios mortales."

 POD_ai_disciplines.2400.t: "Silencio de muerte"
 POD_ai_disciplines.2400.desc: "Recientemente has encontrado tu reino difícil de administrar. Tus órdenes parecen ser ignoradas, tus mensajeros desaparecen sin previo aviso y parece que la gente simplemente no registra tus órdenes adecuadamente. Sospechando, finalmente has descubierto que la causa es uno de tus vecinos usando su poderosa maestría en Ofuscación para interferir en tus asuntos.\nArmado con este conocimiento, ahora puedes intentar contrarrestarlo de varias maneras."
 POD_ai_disciplines.2400.a: "Solo necesito unas pocas palabras para ser obedecido."
 POD_ai_disciplines.2400.success: "Tu reino vuelve a la normalidad."
 POD_ai_disciplines.2400.failure: "¡Nadie está escuchando!"
 POD_ai_disciplines.2400.b: "Entrenar a mensajeros más hábiles."
 POD_ai_disciplines.2400.c: "No necesito tanto alcance ahora mismo."

 obfuscate_end_scheme: "¡Intriga finalizada!"
 obfuscate_end_scheme_tt: "¡Tu objetivo ha usado Ofuscación avanzada para poner fin a tu intriga!"
 
 POD_ai_disciplines.2700.t: "Drenar la vida"
 POD_ai_disciplines.2700.desc: "Hay algo que no va bien en tu reino. Te costó un momento notarlo, pero la población mortal de tu zona parece enferma. Tras una pequeña investigación, comprendes que hay algunas travesuras sobrenaturales en marcha. El sol se oscurece a menudo durante el día, mientras las sombras parecen tener voluntad propia, comprometiendo la vida de los residentes locales.\nAlguien está claramente usando un poderoso ritual para debilitarte y tendrás que encontrar una solución, o aceptar este preocupante giro de los acontecimientos."
 POD_ai_disciplines.2700.a: "Hora de consultar los libros para una solución."
 POD_ai_disciplines.2700.success: "Tu reino vuelve a la normalidad."
 POD_ai_disciplines.2700.failure: "Bueno, eso no funcionó..."
 POD_ai_disciplines.2700.b: "Yo mismo conozco algo de hechicería."
 POD_ai_disciplines.2700.c: "Un poco de oscuridad nunca hizo daño a nadie."

 POD_ai_disciplines.2800.t: "Soñando con muertos"
 POD_ai_disciplines.2800.desc: "Tu sueño se ha visto atormentado por una cantidad malsana de pesadillas recientemente, hasta el punto de que sospechas de una interferencia externa. Tras investigar un poco, estás seguro de que has sido maldecido por un nigromante que usa a sus peones wraith para debilitarte.\nConocer la fuente al menos te ayuda a buscar una forma de detener estas travesuras antes de que te afecten demasiado. Sin embargo, dependiendo de los poderes del nigromante, puede que no sea tan fácil como parece."
 POD_ai_disciplines.2800.success: "Noches tranquilas."
 POD_ai_disciplines.2800.failure: "Bueno, eso no funcionó..."
 POD_ai_disciplines.2800.b: "Yo mismo conozco algo de nigromancia."
 POD_ai_disciplines.2800.c: "¿Quién necesita dormir? ¡Tengo trabajo que hacer!"

 dominate_end_faction: "¡Facción finalizada!"
 dominate_end_faction_tt: "¡Tu señor ha usado Dominación para poner fin a una facción que le tenía como objetivo!"
 
 advanced_dominate_end_faction: "¡Facciones finalizadas!"
 advanced_dominate_end_faction_tt: "¡Tu señor ha usado Dominación avanzada para poner fin a todas las facciones que le tenían como objetivo!"
 
 POD_ai_disciplines.3400.t: "Danza de locos"
 POD_ai_disciplines.3400.desc: "Hay una extraña niebla cubriendo tu mente y enturbiando tus pensamientos recientemente. A veces aparecen imágenes aleatorias en el borde de tu visión, lo que dificulta distinguir la realidad de la ficción. Esto ha alcanzado un nivel tan preocupante que has iniciado una sutil investigación al respecto. Resulta que un maestro vecino de Dementación te ha marcado como objetivo con esta aterradora $pod_discipline$ por alguna razón insondable. Ahora que comprendes la raíz del problema, podrías intentar evitar que se descontrole."
 POD_ai_disciplines.3400.success: "¡Mi mente es mía!"
 POD_ai_disciplines.3400.failure: "Me siento... raro."
 POD_ai_disciplines.3400.a: "¡Fuera de mi mente!" 
 POD_ai_disciplines.3400.b: "No veo ningún problema con este giro de los acontecimientos."
 POD_ai_disciplines.3400.c: "Sería incluso peor luchar contra ello..."

 ai_presence_majesty_modifier: "Presencia majestuosa"
 ai_presence_majesty_modifier_desc: "Usando los poderosos poderes de Presencia, este personaje aparece como un gobernante perfecto ante sus súbditos."
 
 POD_ai_disciplines.3900.t: "Presencia majestuosa"
 POD_ai_disciplines.3900.desc: "Tu señor ha estado pareciendo más regio y, bueno, atractivo estas últimas semanas. No has sido el único en notarlo y, tras prestar mucha atención a algunas pistas sutiles, puedes confirmar que está usando la $pod_discipline$ de Presencia para crear esta aura de grandeza. Es difícil de resistir, y se vuelve aún más difícil cada vez que te presentas en la corte.\nUna solución podría ser evitar dicha corte en el futuro próximo, pero esto sería visto como un acto bastante cobarde. También podrías intentar atrapar diplomáticamente a tu señor, asegurándote de que abandone esta artimaña antes de que la uses contra él."
 POD_ai_disciplines.3900.success: "Política exitosa."
 POD_ai_disciplines.3900.failure: "Un paso en falso."
 POD_ai_disciplines.3900.a: "Mi señor, si me permite..." 
 POD_ai_disciplines.3900.b: "Encontrar una excusa para evitar la corte."
 
 baals_caress_amplified_perk_modifier: "Caricia de Baal"
 baals_caress_amplified_perk_modifier_desc: "Una enfermedad debilitante de la sangre, que debilita a su víctima."
 
 POD_ai_disciplines.4000.t: "Templado de sangre"
 POD_ai_disciplines.4000.desc: "Tus leales (o no tan leales, para el caso) campeones se han sentido mal recientemente. Al principio lo atribuiste a las quejas habituales de tus subordinados, pero parece ser un problema mayor. Tras un poco de investigación, tus agentes informan de un esfuerzo concertado de uno de tus vecinos para maldecir el suministro de recursos en tu zona usando su maestría en la $pod_discipline$ de Quietus.\nSi no tienes los medios mágicos para oponerte a esto, tendrás que capturar a los intermediarios que están usando para propagar la maldición antes de que se descontrole."
 POD_ai_disciplines.4000.success: "Crisis evitada."
 POD_ai_disciplines.4000.failure: "Se escaparon..."
 POD_ai_disciplines.4000.a: "¡Atrapadlos!" 
 POD_ai_disciplines.4000.b: "Realizar un ritual mágico para detener esta maldición."
 POD_ai_disciplines.4000.c: "Mejor pasar desapercibido por ahora." 
 ai_quietus_tooltip2: "Uno de tus campeones recibirá el modificador Caricia de Baal, reduciendo su proeza."
 ai_quietus_tooltip1: "Todos tus campeones recibirán el modificador Caricia de Baal, reduciendo su proeza."