l_spanish:
 
 POD_worldgen.1.t: "Un Mundo de Tinieblas"
 POD_worldgen.1.desc: "¿Qué tipo de mundo es este?"
 POD_worldgen.1.option.a: "Sobrenatural"
 POD_worldgen.1.option.a.tt: "Se representa el mundo sobrenatural, siendo todos los personajes con títulos de tierras sobrenaturales o cazadores."
 POD_worldgen.1.option.b: "Mayoría mortal"
 POD_worldgen.1.option.b.tt: "La mayoría de los personajes con títulos de tierras son mortales, solo una minoría del 10% son secretamente sobrenaturales."
 POD_worldgen.1.option.c: "¡Soy un simple mortal!"
 POD_worldgen.1.option.c.tt: "Tu personaje comienza como mortal, solo el 5% de los personajes con títulos de tierras son sobrenaturales."
 
 POD_worldgen.2.t: "El mundo sobrenatural"
 POD_worldgen.2.desc: "¿Tiene dominio algún tipo particular de ser sobrenatural?"
 POD_worldgen.2.option.a: "Vampiros"
 POD_worldgen.2.option.b: "Hombres lobo"
 POD_worldgen.2.option.c: "Magos"
 POD_worldgen.2.option.d: "Fae"
 POD_worldgen.2.option.e: "Demonios"
 POD_worldgen.2.option.f: "Cazadores"
 POD_worldgen.2.option.g: "Vampiros y hombres lobo luchan por el dominio"
 POD_worldgen.2.option.h: "Es un Mundo de Tinieblas variado"
 
 guest_description.learning_physician_trait.desc: "Aprendiendo el rasgo de Médico"
 guest_description.learning_mystic_trait.desc: "Aprendiendo el rasgo de Místico"
 
 POD_maintenance.18.t: "Ambición imperial"
 POD_maintenance.18.desc: "Administrar un imperio oculto a la mirada de los gobernantes mortales no es tarea fácil. Aunque tu palabra por sí sola tiene ciertamente un gran peso, no puedes estar en todas partes a la vez y, a medida que te expandes, debes confiar cada vez más en tus subordinados, lo que puede empezar a atraer la atención preocupada de tus poderosos colegas gobernantes. Por el contrario, un reino más pequeño tiende a ser menos poderoso pero más eficiente, extrayendo más de cada uno de sus miembros.\nTu nivel actual de sobreextensión ha cambiado, lo que significa que algunas partes de tu burocracia interna tendrán que ser reorganizadas."
 POD_maintenance.18.a: "Revisemos nuestra situación."
 POD_move_imperial_gov_tt: "El tamaño de tu reino ha crecido o disminuido hasta un tamaño que requiere un cambio en tu nivel de sobreextensión. Puedes consultar los detalles en el panel del Reino."
 
 #imperial_overextension_modifier_desc: "Tu reino se está acostumbrando (dolorosamente) a una nueva forma de gobierno."
 #imperial_overextension_modifier: "Administración imperial creciente"
  
 #POD_maintenance.19.t: "Decadencia imperial"
 #POD_maintenance.19.desc: "Tu reino, administrado durante un tiempo siguiendo los principios de una casta imperial de subordinados, se ha reducido significativamente últimamente. Ya no es necesario un aparato tan grande y tus tratos con tus vasallos han vuelto naturalmente a un enfoque más personal."
 #POD_maintenance.19.a: "Prefería el toque personal de todos modos."
   
 POD_maintenance.21.t: "Una nueva era"
 POD_maintenance.21.desc: "Mientras el Mundo de Tinieblas sigue su curso en las sombras, los mortales no esperan. Entrar en una nueva era es un momento tanto de asombro como de pavor. Los mortales han demostrado una y otra vez su capacidad para sorprender a las criaturas sobrenaturales del mundo, a menudo hastiadas y ancladas en sus costumbres. A medida que alcanzan su potencial, influir en ellos se vuelve más difícil y costoso, y criaturas que antes eran una realidad pasan al reino de los mitos.\n\n#X Cada era aumenta el coste de los edificios y mercenarios, y reduce la eficiencia de las criaturas de antaño. Estos efectos pueden revisarse en la pantalla de innovaciones culturales si pasas el ratón sobre las eras.#!"
 POD_maintenance.21.a: "Revisemos nuestra situación."
 
 POD_maintenance.24.desc: "Una vez, Constantinopla soñó que era el Cielo. Luego cayó, e imaginó que era el Infierno. Esta noche, se despierta y ocupa su lugar junto a sus hermanos terrenales. Los cainitas que pasaron siglos transportados en las alas del sueño de Miguel el Patriarca se recuperan ahora de su aterrizaje forzoso y buscan un futuro entre los escombros.\nPara los chiquillos de Caín, dos Constantinoplas se alzan tras muros casi inexpugnables. El legendario país de las maravillas que otorga riquezas, influencia y poder místico a los dignos es la Megalópolis del Sueño, una llama cuyas brasas se niegan a morir del todo. Pero la cruda realidad es la de una utopía caída y decadente donde la sangre y los tiburones se mezclan en el agua y la fe lucha por expresarse.\nLa ciudad — #italic la ciudad #! para tantos — se esfuerza por recuperarse día a día, pero maravillas y terrores se escapan por las grietas entre los dedos de sus gobernantes.\nEs hora de que la ciudad, una vez gloriosa, se reinvente o sea borrada por las arenas de la historia."
 POD_maintenance.24.a: "Parece que los sueños realmente mueren."
 
 POD_maintenance.25.t: "Soñando de nuevo"
 POD_maintenance.25.desc: "Bizancio ha cambiado de manos muchas veces desde sus humildes comienzos como aldea comercial. Cada cultura mortal que ocupó este lugar dejó su propia huella en la historia de la ciudad y hoy no es diferente. Con tu reciente cambio de perspectiva, podrías fomentar otro giro de la rueda para Constantinopla, promoviendo tus nuevos objetivos entre sus habitantes. Por supuesto, también podrías simplemente dejar que la historia continúe su curso inalterada.\n #N ¡Elegir cambiar restablecerá Constantinopla a un nuevo tipo de Gran Ciudad, eliminando tus edificios actuales en el proceso!#!"
 POD_maintenance.25.a: "No interferiré."
 POD_maintenance.25.b: "Hora de cambiar."
 
 POD_maintenance.28.t: "Nosferatu artesanales"
 POD_maintenance.28.desc: "Tras el $pod_Embrace$, cada [GetTrait('nosferatu').GetName(GetNullCharacter)] queda horriblemente deformado gracias a la maldición de su $pod_clan$.\n\n[ROOT.Char.GetTitledFirstName] proviene del Diseñador de Personajes, por lo que se ha librado de este destino... por ahora. Pero no puede escapar de él.\n\nAhora puedes dejar que el juego añada algunos aspectos Nosferatu #bold aleatorios#! automáticamente. O, si estás satisfecho con el aspecto de este personaje, puedes saltarte este paso."
 POD_maintenance.28.a: "Hacer a [ROOT.Char.GetFirstNameNoTooltip] más horrible."
 POD_maintenance.28.b: "[ROOT.Char.GetFirstNameNoTooltip] es perfect[ROOT.Char.GetCustom('ES_O')] tal como es."