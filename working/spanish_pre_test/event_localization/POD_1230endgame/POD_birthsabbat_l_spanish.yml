  POD_sabbat.1100.a: "El Sabbat es el futuro."
  POD_sabbat.1100.b: "No es asunto mío."
  POD_sabbat.1100.c: "¡Debemos contraatacar!"
  POD_sabbat.1101.t: "El Sabbat triunfa en Grecia"
  POD_sabbat.1101.desc: "La presencia del Sabbat en Grecia se ha vuelto dominante. [new_cardinal.GetFirstName] ha reclamado el puesto de Cardenal para esta región. Esto consolida el triunfo del Sabbat en esta zona y probablemente resultará en la destrucción de los últimos reductos que no pertenecen al Sabbat.\nLa Espada de Caín reclama esta victoria como un importante peldaño hacia su triunfo final sobre los Antediluvianos y sus esbirros."
