l_spanish:
 
  PODbirthsabbat.0002.t: "Nacimiento de una nueva secta"
  PODbirthsabbat.0002.desc: "La hipocresía y la desvergonzada arrogancia de la Convención de Espinas han quedado atrás, y la recién creada 'Camarilla' cree que ha ganado y asegurado el fin de la Revuelta Anarquista.\nTú sabes que no es así. Lo único que el movimiento necesita para ganar es un liderazgo centralizado fuerte. Tu liderazgo. Has estado pensando en ello desde Espinas, ¿y si pudieras crear una secta para oponerte a la Camarilla?\nYa la mayoría de los anarquistas se han unido a esta nueva y tentadora causa. El Sabbat está surgiendo, ¿serás tú su heraldo?"
  PODbirthsabbat.0002.a: "Caín necesita un regente. Me necesita a mí."
  PODbirthsabbat.0002.b: "...esta es una idea terrible." 
  sabbat_founder_modifier: "Fundador del Sabbat"
  sabbat_founder_modifier_desc: "Este personaje es uno de los fundadores del temido Sabbat. Siempre protegidos por la despiadada Mano Negra, ostentan una autoridad trascendental en estos tiempos de conflicto sectario."
  sabbat_begins_effect_message: "La mayoría de los anarquistas ya se han unido al naciente Sabbat."
  PODbirthsabbat.0004.t: "Nacimiento del Sabbat"
  PODbirthsabbat.0004.desc: "La Revuelta Anarquista ha recibido un golpe demoledor con la Convención de Espinas y el nacimiento de la Camarilla. Sin embargo, el movimiento no ha muerto, sino que ha renacido en algo más... siniestro.\nEsta nueva secta, que se hace llamar el Sabbat, ha cobrado un gran impulso entre los anarquistas descontentos. Sus principios fundamentales son todavía bastante nebulosos, pero es evidente una clara oposición a la Camarilla, ya que la [the_masquerade|E] es más laxa y se permite la adoración del propio Caín. Queda por ver si estos anarquistas reformados serán solo una molestia para el nuevo orden $pod_cainite$, o si serán capaces de transformar el panorama nocturno una vez más."
  PODbirthsabbat.0004.a: "¿Quizás tengan razón?"
  PODbirthsabbat.0004.b: "No tienen ninguna posibilidad." 
  PODbirthsabbat.100.t: "Sendas de Iluminación"
  PODbirthsabbat.100.desc: "Tomando las lecciones de las Vías de la Edad Oscura, el Sabbat experimenta con nuevas Sendas de Iluminación. Las Sendas buscan reconciliar las creencias y la moral de un vampiro con su condición de no muerto; dar a sus no-vidas una forma de pensar que sea compatible con las necesidades del cuerpo vampírico y las exigencias de la Bestia. Las Sendas son modos activos de moralidad, comparados con la pasividad de la Humanidad. Mientras que a un vampiro con Humanidad se le erosiona lentamente su brújula moral y pierde terreno frente a la Bestia, un seguidor de una Senda lucha contra ella o la acepta como parte de sí mismo. ¿Cómo decidiré?"
  PODbirthsabbat.100.a: "Seguir mi instinto."
  PODbirthsabbat.100.b: "Estudiar cuidadosamente las alternativas."
 
  PODbirthsabbat.200.t: "Sendas de Iluminación"
  PODbirthsabbat.200.desc: "Habiendo estudiado y reflexionado profundamente sobre mi moralidad, he elegido seguir la Senda del..."
  PODbirthsabbat.200.a: "Acuerdo Honorable"
  PODbirthsabbat.200.b: "Poder y la Voz Interior" 
  PODbirthsabbat.200.c: "la Bestia"
  PODbirthsabbat.200.d: "la Armonía"
  PODbirthsabbat.200.e: "los Cátaros"
  PODbirthsabbat.200.f: "Caín"
  PODbirthsabbat.200.g: "la Muerte y el Alma"
  PODbirthsabbat.200.h: "Vasantasenadharma"
  PODbirthsabbat.200.i: "la Metamorfosis"
  PODbirthsabbat.200.j: "la Noche"
  
  POD_sabbat.110.title: "Cacería Salvaje"
  POD_sabbat.110.desc: "La institución legal tradicional tras la Cacería Salvaje es la Lextalionis (o Lex Talionis), un principio legal que puede resumirse como \"ojo por ojo\". Tal orden suele darse siempre que un vampiro ha cometido una ofensa grave, como el asesinato de parientes, la diablerie, la invasión de un dominio que haya resultado en cualquiera de las ofensas anteriores o el desafío repetido a la autoridad. Se espera que cualquier vampiro que oiga la orden de una Cacería Salvaje participe, aunque no está obligado a menos que el vampiro en cuestión haya cometido ofensas verdaderamente graves.\n¿Llamarás a tus vecinos del Sabbat para que se unan a esta guerra?"
  POD_sabbat.110.a: "Llamarlos."
  POD_sabbat.110.b: "Cazo solo."
 
  POD_sabbat.300.opening: "[recipient.Custom2('AppropriateGreeting', actor )]"
  POD_sabbat.300.desc: "Mi reino es mío y seguirá siéndolo hasta que yo decida lo contrario. Tu autoridad es reconocida pero tu abuso de poder también es notado. Tu \"demanda\" es rechazada."
  POD_sabbat.300.a: "Tendré que explorar otras opciones..."
  
  POD_sabbat.1001.t: "El Sabbat triunfa en Grecia"
  POD_sabbat.1001.desc: "La presencia del Sabbat en Grecia se ha vuelto dominante.\nBajo tu guía, la secta prospera aquí y ya nadie puede negar tu poder. Declararte Cardenal, uno de los honores más altos de la secta, es lo único que tiene sentido en este punto.\nEl poder da la razón en el Sabbat y has demostrado con creces tu derecho a gobernar esta región. Para la insignificante Camarilla o los independientes que quedan aquí solo queda una opción. Pueden arrodillarse ante ti.\nO pueden morir."
  POD_sabbat.1001.a: "Un honor debido."
