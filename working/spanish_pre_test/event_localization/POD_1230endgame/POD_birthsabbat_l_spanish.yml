  POD_sabbat.1117.t: "El Sabbat triunfa en las Estepas"
  POD_sabbat.1117.desc: "La presencia del Sabbat en las Estepas se ha vuelto dominante. [new_cardinal.GetFirstName] ha reclamado el puesto de Cardenal para esta región. Esto consolida el triunfo del Sabbat en esta zona y probablemente resultará en la destrucción de los últimos reductos que no pertenecen al Sabbat.\nLa Espada de Caín reclama esta victoria como un importante peldaño hacia su triunfo final sobre los Antediluvianos y sus esbirros."
 
  POD_sabbat.2001.t: "El Cónclave de Cardenales"
  POD_sabbat.2001.desc: "Todos los Cardenales del Sabbat están ahora presentes, lo que demuestra que se trata de un acontecimiento tremendo. El Sabbat solo reconoce a Caín como su líder, pero hasta su glorioso regreso, debe elegirse un Regente para liderar la secta contra sus numerosos enemigos.\nEs probable que todos los Cardenales ya hayan tomado su decisión incluso antes de entrar en la sala, muy probablemente a partir de una combinación de ambición, autopreservación y planes a largo plazo. Al final, sin embargo, solo uno de ellos será elegido para blandir la Espada de Caín."
  POD_sabbat.2001.a: "Excelencias, procedan con la votación."
  
  POD_sabbat.2101.t: "Candidato: [candidate.GetFirstNameNoTooltip]"
  POD_sabbat.2101.desc: "[candidate.GetFirstName|U] ha pronunciado su discurso, ¿deberías votar a [candidate.GetHerHim] para Regente?\nEs raro que los Cardenales cambien su voto planeado de su curso de acción elegido basándose solo en un discurso pero, a veces, estos pueden contener las suficientes amenazas veladas o promesas directas como para convencer a un elector indeciso. Obviamente, el uso de disciplinas se considera un error craso y probablemente resulte en la descalificación del Cardenal... como mínimo."
  POD_sabbat.2101.a: "Te elijo a ti."
  POD_sabbat.2101.b: "No lo hago."
  
  POD_sabbat.2201.t: "Heredero de Caín"
  POD_sabbat.2201.desc: "El recuento de votos ha terminado y has sido elegido como próximo Regente. Los Cardenales te alaban cortésmente, algunos con más entusiasmo que otros, pero al menos tu victoria es aceptada por ahora. El asistente te recuerda, como es tradición, que no tienes autoridad absoluta y que simplemente estás supervisando a los hijos e hijas de Caín hasta que el Padre Oscuro regrese para liderar a sus hijos él mismo.\nAun así, este es el punto más alto al que se puede llegar en la jerarquía del Sabbat y eso te convierte en uno de los cainitas políticamente más poderosos del mundo. Hay trabajo por hacer, pero puedes aceptar un pequeño momento de orgullo por este tremendo acontecimiento."
  POD_sabbat.2201.a: "Blando la Espada de Caín."
  
  POD_sabbat.2202.t: "Heredero de Caín"
  POD_sabbat.2202.desc: "El recuento de votos ha terminado y [new_regent.GetFirstName] ha sido elegido. Los Cardenales le alaban cortésmente, algunos con más entusiasmo que otros, pero al menos su victoria es aceptada por ahora. El asistente les recuerda, como es tradición, que no tienen autoridad absoluta y que simplemente están supervisando a los hijos e hijas de Caín hasta que el Padre Oscuro regrese para liderar a sus hijos él mismo.\nAun así, cada uno de los Arzobispos o consejos de Obispos es en última instancia responsable ante esta autoridad y es probable que este nombramiento tenga un impacto tremendo en el Sabbat en los años venideros."
  POD_sabbat.2202.a: "Felicidades, supongo."
  
  POD_sabbat.2300.t: "Triunfo del Sabbat"
  POD_sabbat.2300.desc: "En contraste con la Camarilla, más vigilada, el Sabbat siempre se ha considerado ante todo un ejército. En su doctrina teológica, este ejército está destinado a ser blandido por el propio Caín cuando finalmente regrese del exilio para luchar contra los malvados Antediluvianos. Para los de mentalidad más pragmática, sin embargo, es principalmente un ejército destinado a adquirir y consolidar el poder lejos de sus rivales.\nEste hecho, combinado con la voluntad de usar tácticas brutales y el fervor fanático que a menudo inspira, ha permitido al Sabbat triunfar finalmente sobre sus rivales. Mientras los últimos focos de resistencia son puestos de rodillas (o al sol), la noche da la bienvenida a su nuevo señor supremo en una juerga sangrienta y maravillosa que pronto recordará a los mortales su miedo primitivo a los monstruos que acechan tras cada sombra."
  POD_sabbat.2300.a: "La victoria sabe dulce y sangrienta."
