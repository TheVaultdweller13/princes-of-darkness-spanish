l_spanish:
 
  pod_masquerade.1.t: "La curiosidad mató al cazador"
  pod_masquerade.1.desc: "Uno de esos malditos bienhechores de ese grupo llamado los Cazadores está husmeando en tu dominio. Ha estado haciendo preguntas sobre tu horario, tu influencia en la población y otros temas delicados. Si no haces nada, informará a sus superiores de que algo en ti no encaja, nada en absoluto. No tienes ninguna duda de que esto despertará sospechas en torno a tu corte. Afortunadamente, conoces a un tipo que podría ocuparse de esta molestia rápida y discretamente, pero sus servicios no son precisamente baratos..."
  pod_masquerade.1.a: "¿Dinero a cambio de tranquilidad? Elección fácil"
  pod_masquerade.1.b: "No me asustan unos mortales engreídos"
  pod_masquerade.2.t: "¡Necios por todas partes!"
  pod_masquerade.2.desc: "Estás rodeado de idiotas y bufones. Ciertamente ya lo sabías, pero ¿qué es un ejemplo más en tu lista aparentemente interminable? Un Cazador ha acechado en tu dominio, sin que tu gente se diera cuenta durante meses, reuniendo pruebas de tu existencia impía. Debes ocuparte de él ahora antes de que se escabulla para informar a sus superiores. Y, obviamente, la maquinaria de rumores fabricará historias sobre tu incompetencia y la de tu consejo si lograra escapar..."
  pod_masquerade.2.a: "Si quieres que un trabajo se haga bien..."
  pod_masquerade.2.b: "Deja que huya, simplemente ya no te importa"
  pod_masquerade.3.t: "Problemas familiares"
  pod_masquerade.3.desc: "Informes problemáticos de uno de tus agentes: una familia bien conectada en la ciudad parece tener sospechas sobre tu verdadera naturaleza. No estás muy seguro de qué salió mal, pero después de todo ninguna Mascarada es perfecta. Te queda una opción: o te encargas de la familia para siempre y apagas esta molestia, o simplemente los ignoras, arriesgándote a que sigan entrometiéndose."
  pod_masquerade.3.a: "Un desafortunado accidente seguro que soluciona este problema"
  pod_masquerade.3.b: "No son una amenaza"
  pod_masquerade.4.t: "La familia es la familia" 
  pod_masquerade.4.desc: "Una reunión familiar es un acontecimiento bastante raro en los círculos $pod_cainite$, debido principalmente al hecho de que podría degenerar en una carnicería en cualquier momento. Desafortunadamente, has sido elegido como anfitrión para el próximo encuentro, lo que significa muchos vampiros y mucha sospecha atraída hacia ti. Podrías cancelar el evento, seguramente todos lo entenderían, pero seguir adelante con él sería una muestra palpable de confianza por tu parte."
  pod_masquerade.4.a: "No me apetece..."
  pod_masquerade.4.b: "¡Bienvenidos! Por favor, dejad vuestras armas, especialmente las secretas."
  pod_masquerade.5.t: "Una elección rápida" 
  pod_masquerade.5.desc: "Mientras retraes tus colmillos y te limpias algo de sangre de la boca, miras los cadáveres de los Cazadores que intentaron atacarte y te preguntas... ¿Estaban mal informados sobre tu poder? ¿O simplemente pecaban de exceso de confianza? Sea como sea, ahora están muertos. Excepto uno, que está huyendo bastante rápido, la verdad. Estás demasiado aburrido como para que te apetezca perseguirlo, parece ágil y tú estás por encima de correr por las calles de la ciudad como un loco. Pero si no lo atrapas, seguramente llevará noticias de esta pequeña refriega a sus superiores..."
  pod_masquerade.5.a: "¿Quizás una buena persecución me recuerde los viejos tiempos?"
  pod_masquerade.5.b: "Bueno, de vuelta a mi sala del trono. Supongo."
  pod_masquerade.6.t: "Demasiado bueno para ser verdad" 
  pod_masquerade.6.desc: "El patriarca de una familia influyente en tu zona acaba de fallecer. Su legado perdura a través de sus dos hijos y, da la casualidad de que tienes un fuerte control sobre uno de ellos... Si ayudaras a este joven a hacerse cargo del negocio familiar, podrías cosechar los beneficios, pero tu extraño patrocinio ciertamente levantaría algunas cejas."
  pod_masquerade.6.a: "Nada más que ratas peleando por migajas"
  pod_masquerade.6.b: "Seguiremos la carrera de este joven con gran interés"
  pod_masquerade.7.t: "Mal romance" 
  pod_masquerade.7.desc: "No pensabas que todavía lo tuvieras en ti y no estás seguro de cómo ni por qué, pero... este simple campesino te ha cautivado durante bastante tiempo. ¿Podrían ser los restos de la lujuria mortal, o algo más? No estás seguro, pero esta noche debes tomar una decisión. ¿Presentarás a tu nueva mascota a tu corte a riesgo de romper [the_masquerade|E]? ¿O harás lo... correcto?"
  pod_masquerade.7.a: "Lo siento amor, no eres tú. Soy yo"
  pod_masquerade.7.b: "Bienvenido a mi salón, luz de mi noche"
  pod_masquerade.8.t: "Estirando los músculos" 
  pod_masquerade.8.desc: "Los mortales de tu zona están teniendo una de esas guerras tontas que tanto les gustan. ¿Era por una reclamación? ¿Religión? Bueno, no importa, ¡esta es una ocasión para que vayas al campo de batalla! ¿Aplastar algunos cráneos y quizás aprender una cosa o dos por el camino? Obviamente, los supervivientes probablemente sospechen algo de tu destreza eterna..."
  pod_masquerade.8.a: "Ya he estado allí, ya he hecho eso"
  pod_masquerade.8.b: "Espera, ¿a quién se supone que tengo que matar esta vez? En fin."
  pod_masquerade.9.t: "Expuesto: Adquisición hostil" 
  pod_masquerade.9.desc: "Tus tratos en la región han llamado finalmente la atención de la Inquisición en las Sombras. Por suerte, parece que, hasta ahora, solo intentan socavar tu autoridad atacando tus principales activos. Varios de tus agentes han desaparecido, algunos de tus ghouls han sido reemplazados por miembros íntegros del clero... y está empezando a hacer mella en tu gobierno.\nPodrías intentar contraatacar, pero la Inquisición también subirá sin duda el nivel si lo haces."
  pod_masquerade.9.a: "¿Quieren jugar? Jugaremos entonces..."
  pod_masquerade.9.b: "Simplemente limitaré mis pérdidas y mantendré un perfil bajo por un tiempo"
  pod_masquerade.9.a.effect.success.desc: "Superar a la Inquisición detendrá su operación contra ti, por ahora" 
  pod_masquerade.9.a.success: "¡De vuelta al negocio!"
  pod_masquerade.9.a.failure.effect.desc: "Si tienen éxito, la Inquisición pondrá en peligro tu influencia"
  pod_masquerade.9.a.failure: "Han ganado esta batalla, pero no la guerra" 
  pod_masquerade.9.a.critical.failure.effect.desc: "Si cometes algún error, la Inquisición aplastará tu autoridad sobre la región durante mucho tiempo"
  pod_masquerade.9.a.critical.failure: "Han ganado por completo..." 
  pod_masquerade.10.t: "Expuesto: Hombres de fe" 
  pod_masquerade.10.desc: "Siempre vigilas a los mortales más fieles de tu zona, ya que pueden ser fácilmente los más peligrosos. Últimamente han aparecido nuevos miembros del clero y parecen... bastante dedicados a su labor sagrada. Estás bastante seguro de que son una fuerza de avanzada de la odiada Inquisición, reuniendo apoyo entre tu población para derrocar tu gobierno perfectamente justo.\nPodrías atacar ahora para eliminarlos, pero existe un serio riesgo de que esto sea contraproducente. Estos hombres ya tienen un fuerte control espiritual sobre la población..."
  pod_masquerade.10.a: "Silenciemos a estos falsos profetas"
  pod_masquerade.10.b: "Puedo retirarme de los asuntos mortales por un tiempo"
  pod_masquerade.10.a.effect.success.desc: "Superar a la Inquisición detendrá su operación contra ti, por ahora" 
  pod_masquerade.10.a.success: "¡Alabadme!"
  pod_masquerade.10.a.failure.effect.desc: "Si tienen éxito, la Inquisición pondrá en peligro tu influencia"
  pod_masquerade.10.a.failure: "Han ganado esta batalla, pero no la guerra" 
  pod_masquerade.10.a.critical.failure.effect.desc: "Si cometes algún error, la Inquisición aplastará tu autoridad sobre la región durante mucho tiempo"
  pod_masquerade.10.a.critical.failure: "Han ganado por completo..." 
  pod_masquerade.11.t: "Expuesto: La batalla" 
  pod_masquerade.11.desc: "Un ejército mortal hostil se acerca a tu reino. No es algo inusual de por sí, a los mortales les encantan sus guerras insignificantes después de todo, pero este parece diferente. Tus agentes informan haber visto hombres dedicados, y un número inusual de miembros del clero entre sus filas. ¿Podrías ser tú su verdadero objetivo?\nAún es tiempo de reunir a tus tropas y defender tu tierra... o simplemente podrías desaparecer por un tiempo y capear el temporal."
  pod_masquerade.11.a: "No temo a ningún campo de batalla"
  pod_masquerade.11.b: "Hora de unas vacaciones rápidas"
  pod_masquerade.11.a.effect.success.desc: "Superar a la Inquisición detendrá su operación contra ti, por ahora" 
  pod_masquerade.11.a.success: "Los aplastaste, obviamente"
  pod_masquerade.11.a.failure.effect.desc: "Si tienen éxito, la Inquisición pondrá en peligro tu influencia"
  pod_masquerade.11.a.failure: "Han ganado esta batalla, pero no la guerra" 
  pod_masquerade.11.a.critical.failure.effect.desc: "Si cometes algún error, la Inquisición aplastará tu autoridad sobre la región durante mucho tiempo"
  pod_masquerade.11.a.critical.failure: "Han ganado por completo..." 
  pod_masquerade.12.t: "Expuesto: Jugando en las cortes" 
  pod_masquerade.12.desc: "Gobernar se ha vuelto sorprendentemente más difícil últimamente. A los mortales se les han ocurrido nuevas leyes y varios cambios que han sido una espina en tu costado. No pensaste mucho en ello durante mucho tiempo, pero un agente tuyo informó que el gobernante mortal local tiene un nuevo asesor, y este parece saber mucho sobre ti.\nEliminar a este hombre violentamente sería imprudente, ya que es una figura bien conocida de la política mortal pero... podrías desacreditarlo, o superarlo en su propio juego de influencia. O simplemente podrías mantener un perfil bajo por un tiempo, los mortales serán mortales después de todo."
  pod_masquerade.12.a: "Me encanta un buen desafío"
  pod_masquerade.12.b: "No puede hacer mucho si me quedo escondido por un tiempo"
  pod_masquerade.12.a.effect.success.desc: "Superar a la Inquisición detendrá su operación contra ti, por ahora" 
  pod_masquerade.12.a.success: "¡Victoria total!"
  pod_masquerade.12.a.failure.effect.desc: "Si tienen éxito, la Inquisición pondrá en peligro tu influencia"
  pod_masquerade.12.a.failure: "Han ganado esta batalla, pero no la guerra" 
  pod_masquerade.12.a.critical.failure.effect.desc: "Si cometes algún error, la Inquisición aplastará tu autoridad sobre la región durante mucho tiempo"
  pod_masquerade.12.a.critical.failure: "Han ganado por completo..." 
  pod_masquerade.13.t: "Expuesto: Susurros sagrados" 
  pod_masquerade.13.desc: "Cuando oíste que la Inquisición planeaba un movimiento contra ti, esperabas trueno y furia. En su lugar, recibiste capa y espada. Tus agentes están desapareciendo, contactos de confianza se vuelven traidores y abundan los rumores sobre tu reputación, falsos o no, para el caso.\nPodrías contraatacar, para mostrar a estos mortales a un verdadero maestro de la intriga. O simplemente podrías dejarlo pasar, se cansarán de este juego lo suficientemente pronto, o mejor aún, se marchitarán y morirán por sí mismos como hacen los mortales."
  pod_masquerade.13.a: "Es un desafío intrigante que superar"
  pod_masquerade.13.b: "Bueno, nada de conspirar por un tiempo"
  pod_masquerade.13.a.effect.success.desc: "Superar a la Inquisición detendrá su operación contra ti, por ahora" 
  pod_masquerade.13.a.success: "¡Victoria total!"
  pod_masquerade.13.a.failure.effect.desc: "Si tienen éxito, la Inquisición pondrá en peligro tu influencia"
  pod_masquerade.13.a.failure: "Han ganado esta batalla, pero no la guerra" 
  pod_masquerade.13.a.critical.failure.effect.desc: "Si cometes algún error, la Inquisición aplastará tu autoridad sobre la región durante mucho tiempo"
  pod_masquerade.13.a.critical.failure: "Han ganado por completo..." 
  pod_masquerade.14.t: "Expuesto: Furia sagrada" 
  pod_masquerade.14.desc: "A juzgar por los gritos que vienen de detrás de la puerta sellada de tu sala del trono, tu última línea de defensa se está desmoronando. No más conspiraciones, escondites o juegos sutiles, la Inquisición ha venido a por ti con toda su furia justa.\nMientras todo el edificio empieza a arder en llamas, te tranquilizas a ti mismo: solo son mortales engreídos. Puedes enfrentarte a ellos tú solo, seguramente... O podrías usar el pasaje oculto detrás de tu trono para escapar y luchar otro día. No más gritos, y el sonido de las armas golpeando la puerta. Es ahora o nunca."
  pod_masquerade.14.a: "¡Finalmente! ¡Oponentes dignos!"
  pod_masquerade.14.b: "Así que... abramos este pasaje secreto justo aquí..."
  pod_masquerade.14.a.effect.success.desc: "Masacrar a la Inquisición detendrá su operación contra ti, por ahora" 
  pod_masquerade.14.a.success: "No tan poderosos ahora"
  pod_masquerade.14.a.failure.effect.desc: "Lograr abrirte paso luchando te salvará a un gran coste"
  pod_masquerade.14.a.failure: "Han ganado esta batalla, pero no la guerra" 
  pod_masquerade.14.a.critical.failure.effect.desc: "Si cometes algún error, la Inquisición te convertirá en cenizas"
  pod_masquerade.14.a.critical.failure: "...bien luchado" 
 
  high_masquerade_exposed_tt: "#R ¡Este evento ha ocurrido debido a tu alta Exposición de la Mascarada! #!"
