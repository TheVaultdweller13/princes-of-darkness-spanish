l_spanish:

 POD_inquisition_face_sins.001.t: "Enfréntate a tus pecados"
 POD_inquisition_face_sins.001.desc: "Empiezas a sentir que no mereces la gracia que Dios te ha concedido, por la forma en que vives tu vida. Tu fe fue una vez inquebrantable, pero sientes que aparecen grietas por toda tu resolución mental.\n¿Está el mundo realmente condenado? ¿O no estás haciendo lo suficiente? La duda te asola y esta crisis afecta cada vez más a tu eficiencia. Tienes que hacer algo al respecto, tal vez empezando por convertirte en una mejor persona."
 POD_inquisition_face_sins.001.option.a: "Debería intentar comprender mejor Sus caminos"
 POD_inquisition_face_sins.001.option.a.tt: "Intentarás hacer algo al respecto; esto podría resolver la crisis o terminar haciéndola aún más costosa."
 POD_inquisition_face_sins.001.generic.tt: "#R Esta crisis de fe ha ocurrido porque tu personaje tiene al menos uno de los siete pecados cristianos medievales (gula, envidia/venganza, soberbia, lujuria, ira, avaricia, pereza).#!"
 POD_inquisition_face_sins.001.option.b: "No podría importarme menos..."
 POD_inquisition_face_sins.001.option.b.tt: "No harás nada al respecto, lo cual tiene un coste"
 
 POD_inquisition_face_sins.002.t: "Enfréntate a tus pecados II"
 POD_inquisition_face_sins.002.desc: "Tras pensar en cómo puedes obtener una comprensión más profunda de la gracia de Dios, se te han ocurrido dos opciones: aprender sobre hombres verdaderamente piadosos del pasado o buscar ayuda entre los servidores de Dios."
 POD_inquisition_face_sins.002.option.a: "Debería buscar la sabiduría eterna de los Santos del pasado"
 POD_inquisition_face_sins.002.option.a.tt: "Intentarás aprender más sobre personas piadosas del pasado"
 POD_inquisition_face_sins.002.option.a.desc: "Aprendizaje y determinación"
 POD_inquisition_face_sins.002.option.a.success: "Logras comprender mejor Sus caminos"
 POD_inquisition_face_sins.002.option.a.success.tt: "Le comprendo mejor"
 POD_inquisition_face_sins.002.option.a.failure: "No logras comprender mejor Sus caminos"
 POD_inquisition_face_sins.002.option.a.failure.tt: "¿Quizás no soy Su servidor después de todo?"
 POD_inquisition_face_sins.002.option.b: "Debería buscar ayuda en las iglesias cercanas"
 POD_inquisition_face_sins.002.option.b.tt: "Pedirás ayuda a los sacerdotes y monjes locales"
 POD_inquisition_face_sins.002.option.b.desc: "Diplomacia y determinación"
 POD_inquisition_face_sins.002.option.b.success: "Logras comprender mejor Sus caminos"
 POD_inquisition_face_sins.002.option.b.success.tt: "Le comprendo mejor"
 POD_inquisition_face_sins.002.option.b.failure: "No logras comprender mejor Sus caminos"
 POD_inquisition_face_sins.002.option.b.failure.tt: "¿Quizás no soy Su servidor después de todo?"
 
 POD_inquisition_face_sins.102.t: "Restauración de la fe"
 POD_inquisition_face_sins.102.desc.learning: "Tras pasar mucho tiempo con viejos libros sobre personas piadosas del pasado, llegas a la conclusión de que los caminos de Dios son diferentes a los de los hombres. Si Él te concede su bendición a ti, un simple pecador, debes hacer que se sienta orgulloso."
 POD_inquisition_face_sins.102.desc.diplomacy: "Has hablado con muchos servidores de Dios en los últimos días y ahora finalmente empiezas a comprender que no importa cómo te veas a ti mismo, lo único que importa es cómo te ve Dios. Si Él cree que eres digno de su bendición, te asegurarás de que no se desperdicie."
 POD_inquisition_face_sins.102.option.a: "Dios actúa de formas misteriosas"
 POD_inquisition_face_sins.102.option.a.tt: "Mantienes tus poderes divinos"
 
 POD_inquisition_face_sins.003.t: "Crisis de fe"
 POD_inquisition_face_sins.003.desc.learning: "Incluso después de pasar mucho tiempo intentando comprender a las personas piadosas del pasado leyendo libros antiguos, simplemente no tiene sentido. Tal vez no seas Su servidor, después de todo. O uno defectuoso, al menos. Solo rezas para que sea suficiente."
 POD_inquisition_face_sins.003.desc.diplomacy: "Ni siquiera los sacerdotes y monjes locales te ayudaron a comprender a Dios y sus caminos. Tal vez no seas Su servidor, después de todo. O uno muy defectuoso, al menos. Solo tienes que rezar para que sea suficiente."
 POD_inquisition_face_sins.003.option.a: "He perdido mi camino"
 POD_inquisition_face_sins.003.option.a.tt: "Pierdes tus poderes divinos... por algún tiempo"
 
 POD_inquisition_face_sins.004.t: "Crisis de fe II"
 POD_inquisition_face_sins.004.desc: "Ha pasado un tiempo desde que pudiste usar los poderes divinos otorgados por Dios. Tal vez hayas perdido tu fe, tal vez Él haya perdido la fe en ti. Pero puedes intentar recuperar tus poderes, si estás dispuesto.\nAl fin y al cabo, nunca es demasiado tarde para los hombres de Fe Verdadera. Solo hay pecado en no intentar seguir el camino, no en fracasar al seguirlo."
 POD_inquisition_face_sins.004.option.a: "Daré todo lo que pueda para restaurar mi Fe"
 POD_inquisition_face_sins.004.option.a.tt: "Intentarás restaurar tu Fe, cueste lo que cueste"
 POD_inquisition_face_sins.004.option.b: "No puedo rendirme"
 POD_inquisition_face_sins.004.option.b.tt: "Intentarás comprenderte mejor a ti mismo y a Dios"
 POD_inquisition_face_sins.004.option.b.desc: "Desafío de aprendizaje"
 POD_inquisition_face_sins.004.option.b.success: "Logras comprenderte mejor a ti mismo y a Él"
 POD_inquisition_face_sins.004.option.b.failure: "Fracasas en tu búsqueda por comprenderte mejor a ti mismo y a Él"
 POD_inquisition_face_sins.004.option.b.failure.tt: "No recuperarás tus poderes... todavía"
 POD_inquisition_face_sins.004.option.c: "No tengo tiempo para tales cosas ahora mismo"
 POD_inquisition_face_sins.004.option.c.tt: "No intentarás restaurar tu fe por ahora"
 POD_inquisition_face_sins.004.option.d: "¿Sinceramente? No podría importarme menos"
 POD_inquisition_face_sins.004.option.d.tt: "Nunca podrás restaurar tu Fe"