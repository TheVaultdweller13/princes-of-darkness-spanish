 podintroductions.2003.t: "Vampiros 101"
 podintroductions.2003.t_ghouls: "Ghouls 101" 
 podintroductions.2003.t_revenants: "Revenants 101" 
 podintroductions.2003.desc: "Lo primero que hay que notar es que, como $POD_splat_vampire$, eres inmortal... más o menos. No morirás de vejez o enfermedad, pero ser quemado o decapitado aún terminará con tu no-muerte. Como tal, la sucesión es una preocupación menor, pero aún presente, para ti. De la misma manera, los Matrimonios no pueden producir hijos, por lo que son principalmente una herramienta política disponible para unas pocas religiones selectas. \nLas religiones son una parte central del juego, incluso más que en CK3. Aquí, representan los principios filosóficos centrales de tu personaje, que lo ayudan a no caer ante la Bestia. De hecho, la Bestia —una manifestación literal de tu monstruosidad interior— es uno de tus peores enemigos, y manejar tu estrés es fundamental para no caer presa de ella, ya que significaría que tu personaje se ha convertido en un wight salvaje, resultando en su abdicación.\nPresta atención a tu hambre, un modificador central que representa tu necesidad de sangre. El Hambre se usa para muchos planes y poderes, y se repone lentamente o con caza activa."
 podintroductions.2003.desc_ghoul_revenants: "Eres tanto un $POD_splat_ghoul$ como un $POD_splat_revenant$, para ver la Introducción de Revenant, #underline;TOOLTIP:podintroductions.2003.desc_revenants pasa el cursor aquí#!.\n\n$podintroductions.2003.desc_ghouls$"
 podintroductions.2003.desc_ghouls: "En primer lugar, se recomienda jugar solo a $POD_splat_ghoul_plural$ y $POD_splat_revenant_plural$ después de tener un buen conocimiento de las mecánicas de $POD_splat_vampire$, ya que ambos usan mecánicas similares, pero con menos posibilidades y más dificultades para los 'sirvientes de la oscuridad'. Esta introducción solo hablará sobre cambios específicos de las mecánicas principales de los vampiros.\n\nComencemos con las similitudes, tanto los $POD_splat_vampire_plural$ como los [ghouls|E] son $TRAIT_FLAG_DESC_immortality$. Ambos tienen [hunger|E], y ambos tienen acceso a [Glossary('Disciplines','game_concept_discipline_desc')].\n\nAhora las diferencias. Los [ghouls|E] se dividen en [bound_ghouls|E] y [masterless_ghouls|E], y esa división cambia el resto de las mecánicas del [ghoul|E].\n\nLa más importante de ellas es [ghoul_vitae_dependency|E], que aumenta tu [hunger|E] cada [GetPlayer.MakeScope.ScriptValue('POD_years_to_lose_vitae_passively')] años en #N 1#!. Si un [masterless_ghoul|E] alguna vez alcanza [GetModifier('bloodhunger5_modifier').GetNameWithTooltip], instantáneamente pierde el [trait|E] [GetTrait('ghoul').GetName(GetPlayer)] y se vuelve mortal. Los [bound_ghouls|E] se salvan de ese destino gracias a su Domitor. Para prevenir ese problema, los [masterless_ghouls|E] necesitan cazar $POD_splat_vampire_plural$ ya sea [imprisoning|E]ándolos y siguiendo el camino [masterless_ghoul_imprisoned_drinking|E], o usando el [journey|E] #V $hunt_target_name$#! para cazar y beber $pod_vitae$ de $POD_splat_vampire$.\n\nOtra mecánica importante es el [ghoul_discipline_limit|E], que limita hasta qué punto puedes desarrollar tus [Glossary('Disciplines','game_concept_discipline_desc')] según tu [ghoul_greatest_vitae_ingested|E]. Para aumentarlo, un [ghoul|E] debe obtener acceso a $pod_vitae$ de generación inferior, lo que se puede hacer convirtiéndose en un [bound_ghoul|E] o consumiendo $pod_vitae$ como un [masterless_ghoul|E].\n\nLa última mecánica importante, esta vez exclusiva de los [bound_ghouls|e], es el concepto de [bound_ghoul_missions_with_icon|E], que es la única forma para un ghoul vinculado de reducir su [hunger|E] para el uso de [Glossary('Disciplines','game_concept_discipline_desc')]. Pueden variar desde completar un [journey|E], matar a un [character] específico o incluso entregar a un miembro de la [family|E]."
 podintroductions.2003.desc_revenants: "En primer lugar, se recomienda jugar solo a $POD_splat_ghoul_plural$ y $POD_splat_revenant_plural$ después de tener un buen conocimiento de las mecánicas de $POD_splat_vampire$, ya que ambos usan mecánicas similares, pero con menos posibilidades y más dificultades para los 'sirvientes de la oscuridad'. Esta introducción solo hablará sobre cambios específicos de las mecánicas principales de los vampiros.\n\nEn segundo lugar, no se recomienda jugar a $POD_splat_revenant_plural$ en la etapa actual del mod. Tanto $POD_splat_vampire_plural$ como $POD_splat_ghoul_plural$ recibieron mucha atención que $POD_splat_revenant_plural$ no.\n\nLos Revenants juegan de manera diferente a los $POD_splat_vampire_plural$, debido a su naturaleza mortal, ya que los Revenants no son Inmortales y morirán de vejez si no se hace nada.\n\nLa mecánica principal de los Revenants es la cría, ya que sus hijos también pueden convertirse en Revenants y pueden heredar [Glossary('Disciplines','game_concept_discipline_desc')] de sus padres, o por casualidad.\n\nSimilarmente a los [ghouls|E], los Revenants también sufren de [ghoul_discipline_limit|E], pero de una manera diferente, ya que los Revenants no pueden obtener rasgos de [Glossary('Discipline','game_concept_discipline_desc')] Avanzada naturalmente."
#  podintroductions.2003.desc_revenants: "En primer lugar, se recomienda jugar solo a $POD_splat_ghoul_plural$ y $POD_splat_revenant_plural$ después de tener un buen conocimiento de las mecánicas de $POD_splat_vampire$, ya que ambos usan mecánicas similares, pero con menos posibilidades y más dificultades para los 'sirvientes de la oscuridad'. Esta introducción solo hablará sobre cambios específicos de las mecánicas principales de los vampiros.\nLos Ghouls son inmortales, pero los [Glossary('Revenants','game_concept_revenant_desc')] no lo son; su esperanza de vida está muy mejorada con respecto a los humanos mortales, sin embargo. Ambos pueden tener hijos, que probablemente se convertirán en [Glossary('Revenants','game_concept_revenant_desc')] (más aún si son de una pareja [Glossary('Revenant','game_concept_revenant_desc')]).\nTienen acceso a edificios especiales que son bastante poderosos, pero carecen de acceso a algunos de los más específicos de los vampiros.\nPueden usar [Glossary('Disciplines','game_concept_discipline_desc')] de la misma manera que los vampiros con estilos de vida. No tienen a su disposición $pod_Embrace$, planes de $pod_diablerie$, etc.\nTen en cuenta que, aunque son antinaturalmente saludables, no eres inmune a las enfermedades como lo son los vampiros.\nFinalmente, recuerda que este es un estilo de juego sustancialmente más difícil, ya que básicamente eres un vampiro más débil con pocas ventajas, menos mecánicas y muchas nuevas desventajas."
 podintroductions.2003.a: "Algunos conceptos más avanzados"  
 
 
 
 podintroductions.2004.t: "Cómo no terminar como una antorcha viviente"
 podintroductions.2004.desc: "Los Vampiros son lentos para aprender cosas nuevas. Como tal, aún tienes acceso a los estilos de vida base, pero con una tasa de progresión más baja. En su lugar, puedes optar por invertir tu tiempo en las [Glossary('Disciplines','game_concept_discipline_desc')], abriendo los poderes de los condenados para tu uso.\nLos edificios representan tu influencia sobre la población mortal. La mayoría están limitados por una estadística como el control y tendrás que elegir cómo equilibrarlos. Ten en cuenta que los grandes centros de población, representados por capitales de ducado con alto desarrollo, son el activo más grande que cualquier Príncipe pueda soñar.\nLa guerra está sensiblemente alterada, con un mayor énfasis en los caballeros. La destreza de tus caballeros puede fácilmente vencer a un enemigo mucho más numeroso, especialmente si está compuesto principalmente por levas. Como tal, ten mucho cuidado con los Vampiros hostiles de alta destreza.\nEn un mundo lleno de engaños y trucos, la intriga juega un papel más importante. Hay nuevos planes por descubrir, algunos vinculados a tus poderes, y la mayoría de los personajes tienen secretos que es mejor no contar... o usar para chantaje si su religión lo permite."
 podintroductions.2004.a: "Volver a lo básico" 
 podintroductions.2005.t: "La Historia Hasta Ahora..."
 podintroductions.2005.desc: "El $pod_wod$ es un universo que lleva más de 30 años en funcionamiento, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales interactúan bajo la superficie, creando un inframundo lleno de intrigas e historias.\nLos Vampiros del WOD son principalmente el resultado de la maldición bíblica contra Caín, el primer asesino, y la mayoría rastrean su linaje hasta él en un sistema que llaman 'generaciones'. Este árbol genealógico de la no-muerte se ha ramificado en varias facciones, los clanes, cada uno con su fuerza, debilidad y base de poder geográfica.\nEn Edad Oscura: Vampiros, que estás jugando ahora, seguimos el mundo no-muerto en la encrucijada de varias crisis importantes. El saqueo de Constantinopla ha ocurrido y ha roto el principal imperio $pod_cainite$ de la época, teniendo un efecto dominó hasta Francia y Persia. Mientras tanto, la Inquisición de la Iglesia está reuniendo apoyo e información, casi lista para inaugurar la era de la retribución contra los malditos chupasangres..."
 podintroductions.2006.t: "La Historia Hasta Ahora..."
 podintroductions.2006.desc: "El $pod_wod$ es un universo que lleva más de 30 años en funcionamiento, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales interactúan bajo la superficie, creando un inframundo lleno de intrigas e historias.\nLos Vampiros del WOD son principalmente el resultado de la maldición bíblica contra Caín, el primer asesino, y la mayoría rastrean su linaje hasta él en un sistema que llaman 'generaciones'. Este árbol genealógico de la no-muerte se ha ramificado en varias facciones, los clanes, cada uno con su fuerza, debilidad y base de poder geográfica.\nEn la fecha de inicio que estás jugando, tanto la Inquisición como la Revuelta Anarquista han ido y venido en su mayor parte, dejando al mundo no-muerto sacudido como nunca antes. Para hacer frente a estas nuevas amenazas, la Camarilla ha sido formada por la mayoría de los [Glossary('Clanes','game_concept_Clan_desc')], una secta cuyo objetivo es esconder a los vampiros de los ojos mortales. La oposición a esto se ha unido en la formación del Sabbat, vampiros que se revelan en su naturaleza monstruosa. Sin embargo, muchos $pod_cainites$ no han elegido bando, y el futuro de estas dos frágiles sectas sigue siendo bastante incierto en este punto."

 ### Hunter ###

 # Inquisitor
 podintroductions.2102.t: "Bienvenido a Inquisidores de la Oscuridad"
 podintroductions.2102.desc: "$POD_generic_introduction$"
 podintroductions.2102.a: "Hablemos de las principales mecánicas de los Inquisidores..." 
 podintroductions.2102.b: "...o las especialidades de la orden" 
 podintroductions.2102.c: "Lore de la Inquisición" 
 podintroductions.2102.d: "Estoy bien, ¡vamos!" 
 podintroductions.2103.t: "Luces encendidas"
 podintroductions.2103.desc: "En 1230, la Inquisición apenas está comenzando. Eres superado en número y armamento por tus enemigos, los vampiros. Tienen poderosas capacidades de intriga y usan caballeros que pueden fácilmente destrozar a la mayoría de tus ejércitos, especialmente a tus levas.\nSin embargo, tienes algunas ventajas, una de ellas es tu poderoso conjunto de edificios y árbol de estilo de vida. También tienes un plan único, encontrar la guarida del monstruo, donde puedes ir a la acción uno contra uno contra los vampiros. Obviamente, ellos se defenderán, sin embargo.\nPrepárate para un juego difícil donde debes esperar tu momento y construir tu base de poder, mientras cazas a tus vecinos más amenazantes, hasta que seas lo suficientemente fuerte para reclamar la noche."
 podintroductions.2103.a: "El conjunto de herramientas de las Órdenes"
 podintroductions.2103.c: "Lore de la Inquisición" 
 podintroductions.2104.t: "Arcoíris de Luz"
 podintroductions.2104.desc: "Cada orden tiene su propia forma de asegurar herederos. St. James, Acre y la Orden Roja pueden ordenar a mortales más jóvenes con un [character_interaction|E], convirtiéndolos en su escudero o 'hijo' en términos de juego. Las Hermanas de San Juan y la Orden de Santa Juana pueden hacer lo mismo, pero solo con mujeres más jóvenes.\nLa Casa Von Murnau funciona como una familia vanilla, pero cada von Murnau tiene la posibilidad de convertirse en Inquisidor durante su vida. Finalmente, los Oculi Dei pueden tanto ordenar nuevos miembros como tener una familia, pero su familia nunca será naturalmente Inquisidora a menos que sea ordenada."
 podintroductions.2104.a: "Volver a lo básico"  
 podintroductions.2104.c: "Lore de la Inquisición" 
 podintroductions.2105.t: "La Historia Hasta Ahora..."
 podintroductions.2105.desc: "El $pod_wod$ es un universo que lleva más de 30 años en funcionamiento, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales interactúan bajo la superficie, creando un inframundo lleno de intrigas e historias.\nEstás jugando a Edad Oscura: Inquisidor, que cuenta la historia de cómo un pequeño grupo de mortales impulsados literalmente cambió el mundo. Fueron los primeros en ver realmente detrás de [the_masquerade|E] de los vampiros y aseguraron el apoyo de la Iglesia para iniciar una Inquisición Sombría.\nLa tarea que tienen por delante es inmensa, y en 1230, apenas han arañado la superficie del mundo en el que han tropezado. Con una fe inquebrantable en su corazón, están dando audazmente sus primeros movimientos contra las proles del Infierno...\nNinguno de estos primeros Inquisidores podía saberlo, pero su coraje y empuje inaugurarán una era de fuego y dolor para los vampiros que durará siglos."
 
 # Indep
 podintroductions.2152.t: "Bienvenido a Cazadores de la Oscuridad"
 podintroductions.2152.a: "Hablemos de las principales mecánicas de los Cazadores..." 
 podintroductions.2152.b: "...o las especialidades de las facciones" 
 podintroductions.2152.c: "Lore de los Cazadores" 
 podintroductions.2152.d: "Estoy bien, ¡vamos!" 
 podintroductions.2153.t: "Solos en la Oscuridad"
 podintroductions.2153.desc: "Los Cazadores ofrecen la experiencia más 'vanilla' en [princes_of_darkness|E]. Pueden tener hijos (excepto si son miembros de una orden), tienen muy pocos estilos de vida únicos y no son inmortales (excepto los Gantenbein).\nSin el respaldo de la Iglesia Católica (los Inquisidores), prepárate para un juego difícil. Los monstruos que están ahí fuera son mucho más poderosos que tú y también pueden usar poderes con los que solo puedes soñar. Tu principal activo es el [character_interaction|E] Encontrar Guarida que te permite aislar a un enemigo y, con suerte, matarlo, pero incluso eso tiene riesgos, ya que los enemigos a menudo son lo suficientemente fuertes como para ganar incluso en ese caso.\nOtra interacción única que tienes es la capacidad de iniciar/ordenar a cualquier mortal más joven que tu personaje. Después de un período de entrenamiento, se convertirán en tu pupilo (representado como técnicamente un hijo tuyo para permitir la sucesión) y obtendrán el rasgo de cazador y tu religión."
 podintroductions.2153.a: "Las especialidades de las facciones"
 podintroductions.2154.t: "Los Pocos Desafortunados"
 podintroductions.2154.desc: "Los Akritai son monjes y monjas guerreros ortodoxos. Pueden intentar reparar el cisma con los Inquisidores para fortalecerse.\nLos Ikhwan al-Safa son una familia de cazadores musulmanes. Tienen un enfoque de mente abierta hacia la magia y las momias que les ofrece oportunidades únicas.\nLos Cazadores Judíos, los Jueces, son maestros de la Teurgia y la Hechicería.\nLos Guerreros Eslavos de Dazbog son los más militarmente sabios de los cazadores.\nLos cazadores mongoles, los Baghatur de Qorjin, disfrutan de una amistad con hombres lobo de Gaia que pueden ayudarlos.\nLos cazadores independientes pueden elegir su propia especialización con un objetivo único.\nLos ghouls Gantenbein bogomilistas son inmortales y pueden aprovechar un ejército de levas muy grande (si muy débil).\nLos Shih, cazadores del lejano oriente, tienen su propio conjunto de poderes (los Qiao) y son más indulgentes con lo sobrenatural en su conjunto, a veces trabajando con los 'buenos'."
 podintroductions.2154.a: "Volver a lo básico"  
 podintroductions.2155.desc: "El $pod_wod$ es un universo que lleva más de 30 años en funcionamiento, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales interactúan bajo la superficie, creando un inframundo lleno de intrigas e historias.\nEstás jugando a Cazadores y Cazados. En 1230, solo existen un puñado de facciones de cazadores no afiliadas a los Inquisidores de la Iglesia Católica. Son pocas, están dispersas y son en gran parte intrascendentes para el gran esquema de las cosas. Sin embargo, los cazadores completamente independientes también existen, pero tienden a no durar mucho, salvo algunas excepciones importantes.\nLa mayoría de estas organizaciones aún están en su infancia y perdurarán y se fortalecerán en los siglos venideros. Se convertirán en el principal contrapeso a lo sobrenatural en sus respectivas regiones, a veces trabajando junto a la poderosa Inquisición, a veces en su contra.\n¿Puedes perdurar como ellos o incluso convertirte en una fuerza poderosa en el Mundo de Tinieblas por derecho propio?"

 ### Mummy ###
 podintroductions.2202.t: "Bienvenido a los Inmortales de la Oscuridad"
 podintroductions.2202.desc: "$POD_generic_introduction$\n\nEstás jugando a las Momias, que tienen un ciclo de juego y conceptos muy diferentes a los vampiros o inquisidores. Si bien la introducción presentará los conceptos clave centrales, no dudes en ir a la wiki si quieres explicaciones más profundas sobre algo."
 podintroductions.2202.a: "Hablemos de las principales mecánicas de las Momias..." 
 podintroductions.2202.b: "Lore de las Momias"
 podintroductions.2202.c: "La Historia Hasta Ahora..."
 podintroductions.2203.t: "La Momia Regresa"
 podintroductions.2203.desc: "Las Momias, también llamadas los Inmortales o Amenti, son inmortales cuyos cuerpos han sido preservados ritualísticamente y dotados del poder de la auto-resurrección.\nCreadas por Isis usando el poderoso Hechizo de la Vida, originalmente para seguir y servir a su hijo Horus, fueron sus compañeras durante su guerra eterna contra Set, el asesino de su padre Osiris. Son los Inmortales originales de Egipto, la tierra de arena negra y pirámides. Unidos por su cultura compartida, continúan trabajando hacia los objetivos gemelos de Horus: la venganza contra Set y la derrota de la serpiente $glossary_wyrm_apophis$.\nSin embargo, no todas las Momias están comprometidas con esta lucha. Algunas, en cambio, han elegido seguir su propio camino a pesar de la desaprobación de Horus, y se han dado a conocer como Ismaelitas.\nUna de esas momias 'neutrales' entonces enseñó el Hechizo de la Vida a Cabirus, un Mago griego, quien fundó su propia 'dinastía' aún cazada hoy por Horus, que no está nada contento con que el sagrado Hechizo de la Vida se haya dado a los incrédulos.\nFinalmente, el propio Set nunca adquirió el verdadero Hechizo de la Vida, pero se acercó lo suficiente como para crear su propia versión retorcida del mismo. Esto resultó en el nacimiento de las Momias Plaga, burlas dementes de las verdaderas Momias de Egipto y dedicadas a la voluntad de su dios oscuro."
 podintroductions.2203.a: "Volver al principio."
 podintroductions.2204.t: "Momia 101"
 podintroductions.2204.desc: "Para recordar quiénes son después de cada nueva vida, las Momias necesitan Recuerdos, que representan recuerdos de su pasado más profundo, a menudo de su primera vida y su cultura.\nEn el juego, los Recuerdos están profundamente ligados a tu Domicilio (tu Tumba), que te ofrecerá varias formas de adquirir más Recuerdos para alimentar y mejorar tus poderes o priorizar otros beneficios. Ten en cuenta que las tumbas pueden ser saqueadas, sin embargo, costándote recursos preciosos si no se defienden adecuadamente.\n\nLas Momias no pueden crear fácilmente más de su especie, por lo que usan a sus cultistas, los Neteru, para realizar la mayoría de las tareas mundanas. Encontrar más Neteru, incluso entre otros sobrenaturales, será útil si planeas expandirte.\n\nSi mueren, las Momias serán juzgadas según varios criterios dependiendo de su afiliación. Así que, aunque son verdaderamente inmortales, morir aún puede ser costoso si se las considera deficientes."
 podintroductions.2205.t: "La Historia Hasta Ahora..."
 podintroductions.2205.desc: "El $pod_wod$ es un universo que lleva más de 30 años en funcionamiento, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales interactúan bajo la superficie, creando un inframundo lleno de intrigas e historias.\nEstás jugando a Momia, que cuenta la historia del conflicto eterno entre Horus y Set, ambos usando sus propias versiones de los ritos del Antiguo Egipto para obtener ventaja en su lucha por el alma del mundo."

 ### Wraith ###
 podintroductions.2302.t: "Bienvenido a los Anacreontes de la Oscuridad"
 podintroductions.2302.desc: "$POD_generic_introduction$\nEstás jugando a los Wraiths, que tienen un ciclo de juego y conceptos muy diferentes a los vampiros o inquisidores. Si bien la introducción presentará los conceptos clave centrales, no dudes en ir a la wiki si quieres explicaciones más profundas sobre algo."
 podintroductions.2302.a: "Hablemos de las principales mecánicas de los Wraiths..." 
 podintroductions.2302.b: "Lore de los Wraiths" 
 podintroductions.2302.c: "La Historia Hasta Ahora..." 
 podintroductions.2303.t: "Wraith 101"
 podintroductions.2303.desc: "Usas Pathos como tu tipo de maná. Necesitas terminar la decisión de pasión para alimentar tus poderes.\nTienes [Fetters|E] que deciden si puedes quedarte en los [Glossary('Skinlands','game_concept_skinlands_desc')] (el mundo mortal). No puedes resultar herido, en su lugar pierdes tu [Corpus|E]. Cuando mueres, te conviertes en un [GetTrait('spectre').GetName( GetNullCharacter )].\nLos Risen tienen acceso a algunas disciplinas de vampiros y cuando mueren se convierten en wraiths.\nTambién tienes una sombra, la parte nihilista en cada wraith, que ganará una ventaja negativa en el estilo de vida de espinas cuando te rompes por el estrés."
 podintroductions.2304.t: "Lore de los Muertos"
 podintroductions.2304.desc: "Los Wraiths son almas inquietas que viven en el [UmbraGlossaryLocalized('shadowlands','Inframundo')]. Algunos tienen [Fetter|E] que les permiten vivir fuera de los [Glossary('Dark Kingdoms','game_concept_dark_kingdom_desc')], unos pocos tienen el poder de influir en los [Glossary('Skinlands','game_concept_skinlands_desc')] y los Rápidos (los mortales). Resolver los [Fetters|E] permite a un wraith trascender, si no son superados por su sombra (la parte nihilista en cada wraith) primero. Si lo son, se convierten en un [GetTrait('spectre').GetName( GetNullCharacter )]."
 podintroductions.2305.t: "Dictum Mortuum"
 podintroductions.2305.desc: "Un wraith es un fantasma, el alma de una persona que ha muerto insatisfecha y ahora acecha en el [UmbraGlossary('shadowlands')]. Por alguna razón, conocida o no por el wraith, todavía están atados al mundo de los vivos (las Tierras de Piel) y no pueden pasar al inefable más allá.\nLos Wraiths están confinados al Inframundo, una realidad paralela que está tangencialmente conectada al mundo de los vivos, pero distinta con sus propias leyes y física.\nLa mente del wraith está dividida en dos partes, la Psique y la Sombra. Después de la muerte, las partes negativas, autodespreciativas y autodestructivas de la personalidad de un wraith forman una personalidad arquetípica distinta por sí misma. Esta personalidad, la Sombra, está en comunión con las fuerzas más oscuras del Laberinto y sirve como una constante contraposición y antagonista de la Psique."

 ### Demon ###
 podintroductions.2402.t: "Bienvenido a los Ángeles de la Oscuridad"
 podintroductions.2402.desc: "$POD_generic_introduction$\n\nEstás jugando a los Demonios, que tienen un ciclo de juego y conceptos muy diferentes a los vampiros o inquisidores. Si bien la introducción presentará los conceptos clave centrales, no dudes en ir a la wiki si quieres explicaciones más profundas sobre algo."
 podintroductions.2402.a: "Hablemos de las principales mecánicas de los Demonios..." 
 podintroductions.2402.b: "Lore de los Demonios" 
 podintroductions.2402.c: "La Historia Hasta Ahora..." 
 podintroductions.2403.t: "Los Ángeles Caídos"
 podintroductions.2403.desc: "Los Demonios son ángeles caídos que eligieron ponerse del lado de Lucifer y la humanidad en lugar de Dios en los primeros días de la Creación. Como castigo por su rebelión y deslealtad, el Arcángel Miguel arrojó a estos ángeles del Cielo al Abismo. Han estado encarcelados desde entonces, pero un pequeño número de ellos ha sido invocado por infernalistas y ahora están de vuelta en la Tierra, muy corrompidos por el Tormento sufrido en la prisión eterna. Abandonando todo lo que una vez defendieron, los Ángeles Caídos —ahora llamados Demonios— ahora quieren verlo todo arder solo para despecho del Dios indiferente que los dejó sufrir."
 podintroductions.2403.a: "Volver al principio." 
 podintroductions.2404.t: "Amos de la Creación"
 podintroductions.2404.desc: "Los Demonios están muy centrados en el tema de la corrupción. Son odiados por la mayoría de los personajes, pero pueden tentar a cualquiera a pecar mediante [journey|E]. Los personajes de su fe pueden entonces convertirse en [thralls|E], creando títeres útiles.\nArcana son tus poderes únicos, representados por un estilo de vida. La única forma de ganar experiencia es reclutando [cultists|E].\nEres verdaderamente inmortal y solo puedes ser, en el peor de los casos, empujado de vuelta a la Prisión Abisal, pero nunca completamente destruido. Sin embargo, necesitas un anfitrión, que está representado por un modificador como [GetModifier('ritual_of_sundered_soul_unstable_modifier').GetNameWithTooltip]. Tienes una decisión que te permite gastar ventajas de Arcana para mejorar este modificador.\nTu recurso principal, Resolve, es escaso pero se puede recuperar revelando tu verdadera forma a través de la [interaction|E] Revelaciones. Más tarde hay métodos más eficientes disponibles en el árbol de estilo de vida de Arcana."
 podintroductions.2405.t: "La Historia Hasta Ahora..."
 podintroductions.2405.desc: "El $pod_wod$ es un universo que lleva más de 30 años en funcionamiento, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales interactúan bajo la superficie, creando un inframundo lleno de intrigas e historias.\nEstás jugando a Demonio: El Precio del Diablo. Eres uno de los pocos ángeles rebeldes que logró escapar de la Prisión Abisal, tu castigo divino después de la caída de Lucifer. Retorcido y deformado por la eternidad de tortura, ahora eres la encarnación de uno de los pecados primordiales, listo para corromper a la humanidad para despecho de tu cruel Creador."
  
 ### Fae ###
 podintroductions.2502.t: "Bienvenido a los Señores del Sueño"
 podintroductions.2502.desc: "$POD_generic_introduction$\n\nEstás jugando a las Hadas, que tienen un ciclo de juego y conceptos muy diferentes a los vampiros o inquisidores. Si bien la introducción presentará los conceptos clave centrales, no dudes en ir a la wiki si quieres explicaciones más profundas sobre algo."
 podintroductions.2502.a: "Hablemos de las principales mecánicas de los Kithain..."
 podintroductions.2502.b: "Lore de los Kithain"
 podintroductions.2502.c: "La Historia Hasta Ahora..."
 podintroductions.2503.t: "Juegos de Hadas"
 podintroductions.2503.desc: "Las [interactions|E] y los poderes de las Hadas se llaman [cantrips|E]. Su estilo de vida de arte proporciona efectos y su estilo de vida de reinos define el alcance y la condición de los efectos.\nPara ganar experiencia de estilo de vida, puedes usar mortales (llamados Soñadores) para alimentarte de su imaginación.\nUn evento importante se acerca en 1347 y resultará en un cambio de juego (negativo). Una decisión objetivo está disponible con varias posibilidades para que lo detengas."
 podintroductions.2503.widget: "Usas Glamour para alimentar tus [cantrips|E].\nHaz clic en la barra de Glamour para ver las formas en que puedes regenerarlo."
 podintroductions.2504.t: "Nacidos del Mito"
 podintroductions.2504.desc: "¿Cómo surgieron las hadas? ¿Quieres retroceder tanto? No soy teólogo, soy historiador. ¿De verdad quieres eso? Bien. No. Lo. Sé. ¿Qué tal eso como respuesta? ¿Qué preferirías que dijera? Obtendrás una respuesta diferente de cada filósofo de salón que hay por ahí. Las hadas están hechas de los sueños de los mortales. Somos los hijos de los Tuatha de Danaan. La propia Dana nos creó. Probablemente todos tengan razón a su manera. La [Glossary('Era Mítica','game_concept_mythic_age_desc')] era justo eso… mítica. Una historia cambia con cada narración y también lo hace nuestro pasado. El pasado se refleja en el Ahora, y el tiempo es fluido. Las pinturas rupestres eran mágicas. Fijaban un evento en el tiempo. Antes de eso, la historia no tenía nada que la atara. Se basaba en lo que el narrador creía, o más bien, en lo que elegía decir. Eso también es magia."
 podintroductions.2505.t: "La Fragmentación Comienza"
 podintroductions.2505.desc: "Desde el inicio de la Ruptura, la conexión del mundo con el [UmbraGlossary('dreaming')] se debilitaba lentamente. Luego, el mundo cambió para peor. A medida que la Banalidad se hacía más fuerte, las hadas se debilitaban. Los ciclos de nuestras vidas se estaban girando gradual pero inexorablemente hacia nuevos rumbos, y algunos en la Corte Unseelie estaban decididos a hacer algo para atraer el Sueño de vuelta a ellos. Creían que sumergir al mundo en el caos disminuiría la Banalidad y haría a los mortales más manejables. Después de todo, es más probable que crean en dragones si ven uno aplanar su casa. Estas hadas oscuras rechazaron el ascenso de los Seelie durante la mitad luminosa del año, y así comenzó la lucha loca. Sorprendidos por esta ruptura sin precedentes en la tradición, muchas hadas cayeron en sus propias naturalezas Unseelie. Vientos amargos y lluvias frías trajeron las oscuras contra un mundo acobardado; dragones y drakes y grandes gusanos fueron despertados de un sueño de siglos para hacer que la tierra se marchitara de nuevo bajo la sombra de sus alas.\nEn los primeros años del siglo XIII, los inviernos se alargaron y se volvieron fríos, y las lluvias cayeron con duración monzónica. Las cosechas se ahogaron. Los caminos se redujeron a ciénagas fangosas. El hambre y el frío hicieron su parte para llenar los cementerios. La destrucción de la guerra se atribuyó a los mongoles o a las disputas entre reyes locales en lugar de a la Hueste Brillante y las pesadillas hechas realidad. Matar a los Soñadores era una locura; los campesinos hambrientos y desesperados no pueden soñar, y un artista en una tierra hambrienta no puede encontrar mecenazgo. Peor aún, en tal caos, la gente miraba a la Iglesia, cuyo odio hacia las hadas estaba creciendo. Y aún así las batallas rugían."
  
 ### KJ ###
 podintroductions.5102.t: "Bienvenido a los Ancestros de la Oscuridad" 
 podintroductions.5102.desc: "$POD_generic_introduction$\n\nEstás jugando a los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], que tienen un ciclo de juego y conceptos muy diferentes a los vampiros o inquisidores. Si bien la introducción presentará los conceptos clave centrales, no dudes en ir a la wiki si quieres explicaciones más profundas sobre algo." 
 podintroductions.5102.a: "Hablemos de las principales mecánicas de los Wan Kuei" 
 podintroductions.5103.t: "[Glossary('Wan Kuei','game_concept_kuei_jin_desc')] 101"
 podintroductions.5103.desc: "El juego de $pod_kueijin$ tiene dos grandes focos. El primero es tu [Glossary('Dharma','podgloss.dharma')], que representa lo cerca que está tu personaje de alcanzar la iluminación. Progresar en tu [Glossary('Dharma','podgloss.dharma')] se hace de manera diferente según tu religión (el rasgo de [Glossary('Dharma','podgloss.dharma')] te dará una explicación sobre las formas específicas de tu personaje).\nEl segundo es la [Glossary('Rueda de las Eras','podgloss.wheelofages')], que representa al mundo moviéndose hacia su fin (y posible renacimiento). Los $pod_kueijin$ aventureros pueden tratar de prepararse para el próximo giro de la Rueda. Varios objetivos te permiten debilitar los efectos de la próxima Era, que ocurrirá en 1350.\nTen en cuenta que no eres un vampiro occidental, por ejemplo, no puedes tener ghouls, rebaños o crear nuevos vampiros. Puedes adoptar un heredero a través de una decisión en su lugar."
 podintroductions.5104.t: "Lore de los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')]"
 podintroductions.5104.desc: "El $pod_wod$ es un universo que lleva más de 30 años en funcionamiento, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales interactúan bajo la superficie, creando un inframundo lleno de intrigas e historias.\nEstás jugando a un [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], un 'Kindred del Este' que son antiguos guardianes corrompidos y maldecidos por la [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] por sus crímenes. Aunque técnicamente no son vampiros, a menudo interactúan, principalmente a través de guerras territoriales, con los vampiros occidentales, especialmente en la India. El subcontinente ha sido el principal teatro de guerra entre los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] provenientes del este de Asia y los vampiros nativos de la India durante milenios. Los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] mismos difícilmente son un frente unido, divididos entre varios '[Glossary('Dharma','podgloss.dharma')]', sus principales creencias, y 'cortes', sus principales organizaciones políticas."
 podintroductions.5105.t: "El Fin de la Cuarta Era"
 podintroductions.5105.desc: "Los guerreros caídos de la [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')], los Kindred del Este (conocidos más propiamente como los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] en China) son criaturas de costumbres que han imitado la administración burocrática de China durante milenios. Si bien sus regiones fronterizas del este de la India y el Tíbet siempre han sido más dinámicas, las cortes centrales de los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], conocidas como las Cinco Cortes Augustas, han estado estancadas en sus costumbres durante mucho tiempo. La invasión mongola destrozó esta relativa paz, anunciando el giro de la rueda y el fin de la [Glossary('Cuarta Era','game_concept_fourth_age_desc')].\n\nLa Corte del Fénix Escarlata del Sudeste Asiático se ha reducido a su núcleo en Angkor, ya que las regiones periféricas han sido invadidas por infernalistas.\nLa Corte del Tigre Blanco del Tíbet ha caído en una guerra civil después de la partida de su anterior Ancestro.\nLa Corte del Dragón Azul de Corea y Japón está lista para dividirse, quizás violentamente, mientras Japón afirma su creciente poder.\nLa Corte de la Tortuga Negra de las estepas es una sombra de lo que fue, golpeada por los [Glossary('Anda','podgloss.anda')].\nSolo la Corte del Emperador Amarillo de China parece mantenerse fuerte y sin ser molestada por los tiempos difíciles, pero las apariencias pueden engañar..."

