 podintroductions.2001.e: "Limpiar mis rasgos sobrenaturales e ir al Generador de Personajes" 
 POD_generic_introduction: "Primero, ¡gracias por jugar al mod!\n[princes_of_darkness|E] es una revisión total del juego base, destinada a dar vida al $pod_wod$ en Crusader Kings 3. Como tal, tiene muchos conceptos de juego alterados, y utiliza el extenso lore de su mundo para proponer una experiencia diferente en todos los aspectos."

 ### Vampire and Ghoul ###
