 podintroductions.2001.f: "Estoy bien con esta parte, pero quiero más detalles"
 continue_intro_tooltip: "Recibirás información adicional y más detallada sobre las mecánicas del mod en los próximos días."

 ### Vampire ###
 podintroductions.3000.t: "Secretos de la Noche" 
 podintroductions.3000.desc: "¿Qué tema te gustaría explorar?" 
 podintroductions.3000.a: "[Glossary('Disciplinas','game_concept_discipline_desc')]" 
 podintroductions.3000.b: "$pod_Embrace$ y Vástagos" 
 podintroductions.3000.c: "La Mascarada" 
 podintroductions.3000.d: "El Hambre" 
 podintroductions.3000.e: "Estoy bien, vamos." 
 podintroductions.3001.a: "Volvamos." 
 podintroductions.3001.t: "[Glossary('Disciplinas','game_concept_discipline_desc')]" 
 podintroductions.3001.desc: "Las [Glossary('Disciplinas','game_concept_discipline_desc')], que son los poderes vampíricos, están representadas por estilos de vida únicos en el mod. Solo puedes gastar puntos en un árbol si tienes el rasgo correspondiente (ej: el árbol de Celeridad se desbloquea con el rasgo de Celeridad).\nObtienes experiencia de estilo de vida para estos árboles principalmente cazando mortales o rebañándolos (pastar significa mantener a un mortal cerca como fuente de sangre por más tiempo), ambas son un [character_interaction|E] disponible con mortales en tu ubicación.\nAlgunos mortales dan más experiencia que otros dependiendo de sus rasgos." 
 podintroductions.3002.t: "Abrazo y Vástagos" 
 podintroductions.3002.desc: "Como vampiro, no puedes tener hijos. La pestaña 'hijos' en tu hoja de personaje representa a tus vástagos, los mortales que tú mismo has convertido en vampiros. Para hacerlo, puedes usar un [character_interaction|E] en cualquier mortal en tu ubicación.\nUna vez que la interacción y el plan consecuente terminan, el mortal se convierte en un vampiro, tu vástago. Ten en cuenta que tendrás que educarlos después, lo que puede ser costoso o peligroso de varias maneras." 
 podintroductions.3003.t: "La Mascarada" 
 podintroductions.3003.desc: "[the_masquerade|E] representa cuánto estás expuesto a las autoridades mortales como la Iglesia. En el juego, es un modificador de personaje que va de 0 a 5. La exposición puede aumentar al usar poderes vampíricos, cazar mortales y varios eventos. Si sube demasiado, las células de Inquisidores (una facción) se levantarán contra ti. También podrías ser atacado individualmente por Inquisidores que intenten cazarte.\nPara disminuir tu exposición, la mayoría de las religiones pueden usar la interacción 'Cubrir la Mascarada' haciendo clic en la barra de Mascarada, o haciendo clic derecho en tu personaje. Las religiones a las que no les importa [the_masquerade|E] no tienen este lujo, sin embargo." 
 podintroductions.3003.widget: "Puedes hacer clic en la barra de Mascarada para intentar un encubrimiento." 
 podintroductions.3004.t: "El Hambre" 
 podintroductions.3004.desc: "[hunger_with_icon|E] representa cuánta sangre necesita tu personaje. Está representado por un modificador de personaje que va de 0 a 5. El Hambre aumenta principalmente al usar poder vampírico. Si sube demasiado durante demasiado tiempo, no podrás usar poderes vampíricos y podrían ocurrir algunos eventos desagradables." 
 podintroductions.3004.widget: "Haz clic en la barra de Hambre para ver las formas de saciarlo."

 ### Hunter ###
 podintroductions.4000.t: "Secretos de la Fe" 
 podintroductions.4000.desc: "¿Qué tema te gustaría explorar?" 
 podintroductions.4000.a: "Fe Verdadera" 
 podintroductions.4000.b: "Poderes de los Inquisidores" 
 podintroductions.4000.c: "Sucesión" 
 podintroductions.4000.d: "Encontrar Guarida" 
 podintroductions.4000.e: "Estoy bien, vamos." 
 podintroductions.4001.a: "Volvamos." 
 podintroductions.4001.t: "Fe Verdadera" 
 podintroductions.4001.desc: "Una de las herramientas más importantes a disposición del Cazador, la Fe Verdadera (y su versión mejorada, Beatífico) es un rasgo que desbloquea un poderoso estilo de vida. La mayoría de los Cazadores iniciales lo tienen al principio, pero asegurarse de que tus herederos también lo tengan es una tarea importante.\nPara hacerlo, puedes usar el poder de Fe Verdadera Intercesión en cualquier otro personaje para tener la posibilidad de darle el rasgo. Si eso falla y estás jugando con un personaje sin él y aún quieres tenerlo, puedes pedirle a un amigo con Fe Verdadera que te ayude a adquirirlo. Sin embargo, es un proceso costoso y difícil.\nLa experiencia del estilo de vida de Fe Verdadera se obtiene principalmente mediante el [journey|E] Encontrar Guarida, que se discute en su propio capítulo." 
 podintroductions.4002.t: "Poderes de los Inquisidores" 
 podintroductions.4002.desc: "Además de la Fe Verdadera, discutida en su propio capítulo, los estilos de vida de los Inquisidores dependen de a qué Orden Inquisidora pertenezca tu personaje, que está representada por la dinastía de tu personaje en el juego. No puedes acceder a los poderes específicos de las otras órdenes." 
 podintroductions.4003.t: "Sucesión" 
 podintroductions.4003.desc: "Cada orden tiene su propio método de sucesión. La familia Von Murnau juega como CK3 vanilla, con matrimonio e hijos. Las otras órdenes sagradas usan un [character_interaction|E] especial para ordenar personajes que luego se convierten en sus 'hijos'.\nLa ordenación sigue algunas reglas, como que el aprendiz sea más joven que el maestro o, en el caso de las Hermanas de San Juan, ser mujer.\nLas órdenes distintas de los Von Murnau y los Oculi Dei son célibes y, por lo tanto, deben usar esta mecánica para asegurarse de tener herederos adecuados." 
 podintroductions.4004.t: "Encontrar Guarida" 
 podintroductions.4004.desc: "Un [journey|E] especial disponible para Cazadores contra personajes vampiros. Encontrar Guarida es una parte central del juego del Cazador, ya que es una forma de eliminar a vampiros poderosos sin una guerra, y también es la principal forma de ganar experiencia de estilo de vida de Fe Verdadera.\nObviamente, tal viaje es peligroso, pero la dificultad se puede mitigar si eliges bien a tu objetivo. Lo principal a buscar son las estadísticas: cuanto mayor sea la ventaja que tengas sobre el objetivo en una categoría, más fácil será.\nEncontrar Guarida también es una buena preparación para una guerra difícil, ya que puedes cazar a los mejores caballeros de tu futuro enemigo incluso antes de que comience la guerra." 
 podintroductions.2001.h: "Volver al principio"

 ### KJ ###
 #podintroductions.5000.t: "Secretos de los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')]" 
 #podintroductions.5000.desc: "¿Qué tema te gustaría explorar?" 
 #podintroductions.5000.a: "Dharmas" 
 #podintroductions.5000.b: "Chi" 
 #podintroductions.5000.c: "Sucesión" 
 #podintroductions.5000.d: "Equilibrio" 
 #podintroductions.5000.e: "Estoy bien, vamos." 
 #podintroductions.5001.a: "Volvamos." 
 #podintroductions.5001.t: "Dharmas" 
 #podintroductions.5001.desc: "Tu nivel de [Glossary('Dharma','podgloss.dharma')] representa tus logros en tu camino, se puede aumentar mediante una decisión y disminuir en algunas situaciones de Frenesí. Cuando se reduce a 0, te conviertes en chih-mei y no puedes gobernar de nuevo (abdicación).\nCuando alcanzas el nivel 5+ de [Glossary('Dharma','podgloss.dharma')], puedes absorber Chi (el recurso del [GetTrait('kueijin').GetName( GetNullCharacter )] que reemplaza a la sangre) respirando en lugar de bebiendo sangre (lo que disminuye el nivel de salud del prisionero, a su vez arriesgando $pod_torpor$ o la muerte cuando alcanzan un estado crítico), y devoras Chi del área ambiente cuando alcanzas el nivel 6+ (sin necesidad de objetivo).\nAlcanzar un [Glossary('Dharma','podgloss.dharma')] alto también te permite tener niveles adicionales de virtud de chi. A partir del nivel 5 de [Glossary('Dharma','podgloss.dharma')], ganas dos niveles adicionales por nivel de [Glossary('Dharma','podgloss.dharma')]." 
 #podintroductions.5002.t: "Chi" 
 #podintroductions.5002.desc: "Tienes dos aspectos del Chi, Yin y Yang, divididos en puntos de Chi de tu reserva de Chi y un límite de reserva llamado virtud de chi.\nObtienes una penalización de desequilibrio temporal cuando gastas todo el Chi de un aspecto o tienes más Chi que la virtud del mismo aspecto. El rasgo de desequilibrio permanente permite ingerir más Chi de ese tipo sin efectos adversos.\nCuando el chi total es de cinco puntos de chi o menos (de cualquier tipo), recibirás una penalización de hambre; menos de dos te volverá voraz, mientras que 0 te hará perder el control para adquirir Chi. (El rasgo de desequilibrio yang permanente te hace tener hambre más rápido, por lo que en lugar de hambre recibes voracidad, y en lugar de voracidad perderás el control).\nGastar más Chi del que tienes puede darte una penalización de salud, que finalmente hará que entres en 'pequeña muerte' (lo que resulta en abdicación)."
 #podintroductions.5003.t: "Sucesión" 
 #podintroductions.5003.desc: "Los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] no pueden $pod_Embrace$ como lo hacen los vampiros, pero el desequilibrio yang permanente les permite tener Dhampyr con mortales, o pueden capturar chih-mei y educarlos como discípulos. Los chih-mei son almas muertas regresadas recientemente de [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] o un [GetTrait('shih').GetName( GetPlayer )] que perdió toda Humanidad (representado como un evento de estrés). La captura se representa en el juego mediante una decisión, y la educación mediante una cadena de eventos." 
 #podintroductions.5004.t: "Equilibrio" 
 #podintroductions.5004.desc: "Cuando la diferencia de virtud de Yin y Yang es superior a 3, obtienes un rasgo de desequilibrio permanente. Esto puede no ser malo, ya que el desequilibrio permanente otorga algunas mecánicas especiales explicadas en los otros temas.\nPero volverse permanentemente desequilibrado durante mucho tiempo (5 años o más) puede tener consecuencias; el desequilibrio permanente de Yin te convertirá en un posible objetivo de los [GetTrait('shih').GetName( GetPlayer )] (cazadores orientales de monstruos). También te volverás más cadavérico e inhumano con el tiempo y finalmente Chi'gh Shih al final; el desequilibrio permanente de Yang te dará enfermedades vampíricas mortales y extremadamente contagiosas." 

 ### Mummy ###
 podintroductions.2210.t: "Secretos de los Renacidos" 
 podintroductions.2210.desc: "¿Qué tema te gustaría explorar?" 
 podintroductions.2210.a: "Resurrección" 
 podintroductions.2210.b: "Hekau y Sekhem" 
 podintroductions.2210.b_wutian: "Tan y Chi" 
 podintroductions.2210.c: "Neteru" 
 podintroductions.2210.e: "Estoy bien, vamos." 
 podintroductions.2211.a: "Volvamos." 
 podintroductions.2211.t: "Resurrección" 
 podintroductions.2211.desc: "Eres inmortal, ¡aún más, puedes resucitar cuando te matan!\n\nEsto tiene un costo de [piety_i][ROOT.ScriptValue('mummy_ressurection_piety_value')|V0] de [piety|E] para ti.\n\nPuedes terminar en [UmbraGlossary('oblivion')] cuando no puedas pagar el costo, o decidas suicidarte por tu propia voluntad o por estrés, o si tu alma es devorada." 
 podintroductions.2212.t: "Hekau y Sekhem" 
 podintroductions.2212.desc: "Como Momia tienes acceso al arte del Hekau (Palabra de Poder), representado como estilos de vida.\n\nUsas Sekhem para alimentar tus técnicas de Hekau, y cada tipo de Momia lo recupera de manera diferente.\n\nGastar más Sekhem del que tienes puede darte una penalización de salud, que te enviará al [UmbraGlossary('shadow_realm')] cuando supere -9."
 podintroductions.2212.widget.sekhem: "Haz clic en la barra de Sekhem para ver las formas en que puedes regenerarlo."
 podintroductions.2212.t_wutian: "Tan y Chi" 
 podintroductions.2212.desc_wutian: "Como Wu T'ian no puedes adquirir nomenclatura como las Momias de Egipto, pero puedes acceder al estilo de vida Tan.\n\nNo usas Sekhem, en su lugar tienes Yang Chi, el Chi de la Vida, que se recupera con el paso del tiempo.\n\nGastar más Chi del que tienes puede darte una penalización de salud, que te enviará al [UmbraGlossary('shadow_realm')] cuando supere -9."
 podintroductions.2212.widget.chi: "Haz clic en la barra de Chi para ver las formas en que puedes regenerarlo."
 podintroductions.2213.t: "Neteru" 
 podintroductions.2213.desc: "Eres único, no puedes crear más momias que te ayuden (a menos que estés jugando como Horus o Cabirus).\n\nEn su lugar, puedes usar [neteru|E] (cultistas mortales) para que ocupen tus títulos o edificios.\n\nCualquier hijo mortal se convertirá en tu [neteru|E] al nacer, pero también puedes usar una [interaction|E] que cuesta prestigio para convertir a un cortesano en un [neteru|E].\n\nSolo una cosa, no pueden sucederte, el juego terminará cuando ya no puedas resucitar." 
 
 ### Wraith ###
 podintroductions.2310.t: "Secretos de los Muertos" 
 podintroductions.2310.desc: "¿Qué tema te gustaría explorar?" 
 podintroductions.2310.a: "Tierras de Piel y [UmbraGlossary('shadowlands')]" 
 podintroductions.2310.b: "Pathos y Corpus" 
 podintroductions.2310.c: "Fetter" 
 podintroductions.2310.e: "Estoy bien, vamos." 
 podintroductions.2311.a: "Volvamos." 
 podintroductions.2311.t: "Tierras de Piel y [UmbraGlossary('shadowlands')]" 
 podintroductions.2311.desc: "Tienes algunos métodos para interactuar con las Tierras de Piel, algunos te permiten usar interacciones en los gobernantes. Si no tienes estas opciones a tu disposición, necesitas arriesgarte a cruzar el Sudario para llegar a los [Glossary('Skinlands','game_concept_skinlands_desc')].\n\nPuedes explorar el [UmbraGlossaryLocalized('shadowlands','Inframundo')] al principio del juego y hay contenido exclusivo de wraith que te permite cambiar de gobierno, ganar arcanos o convertirte en un [GetTrait('ferryman').GetName( GetNullCharacter )]." 
 podintroductions.2312.t: "Pathos y Corpus"
 podintroductions.2312.widget: "Haz clic en la barra de Pathos para ver cómo puedes regenerarlo."
 podintroductions.2312.desc: "Tienes acceso a arcanos, representados como estilos de vida, alimentados por tu Pathos que se regenera usando la decisión de pasión. Los Risen tienen acceso a algunas disciplinas de vampiros y se convierten en un wraith al morir.\n\nNo puedes resultar herido y en su lugar pierdes tu [Corpus|E]. Cuando mueres, te conviertes en un [GetTrait('spectre').GetName( GetNullCharacter )]."
 podintroductions.2313.t: "Fetter" 
 podintroductions.2313.desc: "Tienes [Fetters|E] que deciden si puedes quedarte en los [Glossary('Skinlands','game_concept_skinlands_desc')]. Tienes 10 puntos para asignar libremente y 1-5 puntos para asignar en tus títulos, artefactos o parientes. Puedes resolver tus [Fetters|E], y finalmente lograr la Trascendencia, pudiendo quedarte en los [Glossary('Skinlands','game_concept_skinlands_desc')] sin restricciones.\n\nTambién tienes una sombra que agregará una ventaja negativa en el estilo de vida de espinas cada vez que te rompas por el estrés. Cuando la sombra toma el control temporalmente, durante la catarsis, puedes ver la ventaja de espinas elegida. La sombra gasta estrés en lugar de ganar estrés para usar interacciones." 

 ### Demon ###
 podintroductions.2410.t: "Secretos de los Condenados"
 podintroductions.2410.desc: "¿Qué tema te gustaría explorar?"
 podintroductions.2410.a: "Ritual del Alma Fragmentada"
 podintroductions.2410.b: "Arcana y Resolve"
 podintroductions.2410.c: "Cultistas y Esclavos"
 podintroductions.2410.e: "Estoy bien, vamos."
 podintroductions.2411.a: "Volvamos."
 podintroductions.2411.t: "Ritual del Alma Fragmentada"
 podintroductions.2411.desc: "Para permanecer en la Creación, has destrozado tu alma y has atado sus restos a un recipiente humano. Este proceso te ha traumatizado y debilitado, pero con el tiempo, puedes crecer mucho más allá de tus limitaciones.\nEn términos de mecánicas del juego, cada Demonio comienza con un modificador muy negativo que se puede mejorar mediante una decisión. También comienzas con suficientes ventajas de [arcana_lifestyle|E] para mejorar este modificador una vez, pero quizás prefieras gastar tus ventajas en otras cosas. Decisiones, decisiones..."
 podintroductions.2412.t: "Arcana y Resolve"
 podintroductions.2412.desc: "Los Demonios tienen acceso a Arcana, representado como un estilo de vida. Este estilo de vida no permite la experiencia pasiva; en su lugar, ganas experiencia anual basada en la cantidad de [cultists|E] que tienes.\n\nUsas Resolve para alimentar tus poderes de Arcana. La forma más básica de recuperarlo es mediante Revelaciones, una interacción de personaje que usas en ti mismo. Más ventajas de Arcana desbloquearán otras formas de ganar Resolve."
 podintroductions.2412.widget: "Haz clic en la barra para regenerar Resolve a través de Revelaciones."
 podintroductions.2413.t: "Cultistas y Esclavos"
 podintroductions.2413.desc: "Los [cultists|E] y [thralls|E] son los sirvientes de los demonios. Los Cultistas proporcionan experiencia de [arcana_lifestyle|E] mientras que los Esclavos proporcionan influencias. Después de tentar y corromper a un personaje hacia tu fe, puedes convertirlo en tu [thrall|E]. Esto hará que caigan en el infernalismo. Los Demonios y los infernalistas son el único tipo de vasallos que puedes tener, de lo contrario se rebelarán. Como su amo, puedes ofrecer puntos de ventaja de Arcana para comandarlos, solicitando oro, artefactos, títulos o comenzando una guerra contra gobernantes vecinos." 
 
 ### Fae ###
 podintroductions.2510.t: "Secretos del Sueño" 
 podintroductions.2510.desc: "¿Qué tema te gustaría explorar?" 
 podintroductions.2510.a: "Cantrip y Soñadores" 
 podintroductions.2510.b: "Glamour" 
 podintroductions.2510.b_hsien: "Chi" 
 podintroductions.2510.c: "Fragmentación" 
 podintroductions.2510.e: "Estoy bien, vamos." 
 podintroductions.2511.a: "Volvamos." 
 podintroductions.2511.t: "Cantrip y Soñadores" 
 podintroductions.2511.desc: "Como Kithain tienes acceso a Arte y Reinos, representados como estilos de vida.\n\nJuntos hacen [interaction|E] conocido como Cantrip, donde el arte proporciona el efecto y los reinos definen el alcance y la condición.\n\nPuedes usar mortales (conocidos como Soñadores) para proporcionar experiencia de estilo de vida para esos poderes." 
 podintroductions.2512.t: "Glamour" 
 podintroductions.2512.desc: "Usas Glamour para alimentar tus Cantrip, y lo recuperas por el edificio de la Mansión Claro en tu capital, o usando la [decision|E] Rapto, o completando un plan de diplomacia, o usando la [character_interaction|E] Asolar/Rapsodiar/Reaviar.\n\nHay otras formas de recuperarlo, como artefactos únicos o haciendo un artefacto de hez."
 podintroductions.2512.t_hsien: "Chi" 
 podintroductions.2512.desc_hsien: "Como Hsien no usas Glamour, en su lugar tienes dos aspectos del Chi, Yin y Yang, divididos en puntos de Chi de tu reserva de Chi con un total de 10, que se recuperan con el paso del tiempo."
 podintroductions.2513.t: "Fragmentación" 
 podintroductions.2513.desc: "Un cambio de juego importante (negativo) ocurrirá en 1347 cuando llegue la Peste Negra a medida que la banalidad aumenta, llamado la [Glossary('Fragmentación','game_concept_shattering_desc')].\n\nTienes acceso a una decisión objetivo que puede evitar que suceda."

