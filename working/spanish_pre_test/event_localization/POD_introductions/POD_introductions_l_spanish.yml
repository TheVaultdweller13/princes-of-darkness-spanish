l_spanish:
 podintroductions.1.t: "Rosas Negras"
 podintroductions.1.desc: "$TAB$Mientras la Francia mortal se tambalea bajo el caos interno de la cruzada albigense, la Francia vampírica no se encuentra mejor.\n$TAB$[GetScriptedCharacterByHistoryID('505082').GetFirstName], un [GetTrait('ventrue').GetName(GetNullCharacter)] de 4ª generación, fue [Glossary('Prince','game_concept_prince_desc')] de París y Francia hasta hace menos de dos años. Fue expulsado por un golpe palaciego liderado por la Toreador [GetScriptedCharacterByHistoryID('505072').GetFirstName], y su propio vástago, [GetScriptedCharacterByHistoryID('790138').GetFirstName].\n$TAB$La Reina [GetTrait('toreador').GetName(GetNullCharacter)] ha asumido el control del país e intenta consolidar su posición, enfrentándose a la oposición de sus propios compañeros de clan, las otras reinas de Francia. Por otro lado, Geoffrey ha tomado la propia París como su botín, pero, dado el tiempo, podría intentar obtener la corona que le corresponde por derecho de sangre.\n$TAB$En el sur, [GetScriptedCharacterByHistoryID('505073').GetFirstName] de Toulouse está utilizando el levantamiento cátaro para sus propios fines, pero podría enfrentar la furia del norte de Francia muy pronto.\n$TAB¿Encontrará el país un nuevo y mejor gobernante que Alejandro tras esta prueba? ¿O será arrasado por el caos y la destrucción?"
 podintroductions.1.a: "Francia estaría mejor bajo mi gobierno…"
 podintroductions.2.t: "El Aburrido Rey-Dios de Inglaterra"
 podintroductions.2.desc: "$TAB$La historia vampírica de Britania está estrechamente ligada al Ventrue [GetScriptedCharacterByHistoryID('505071').GetFirstName]. Un dios persa y luego romano, este [GetTrait('vampgeneration4').GetName(GetNullCharacter)] casi logró que toda Europa siguiera su culto antes de que el cristianismo lo expulsara.\n$TAB$Retirándose con sus fanáticos a la tierra de los britanos, rápidamente acumuló poder… y se aburrió de la mezquindad del lugar. Cayendo regularmente en $pod_torpor$, la invasión normanda destruyó su sede de poder y lo obligó a despertar para restaurar el orden.\n$TAB$150 años después, a Mitras ya no le importa Inglaterra, y muchos de sus súbditos, como [GetScriptedCharacterByHistoryID('790222').GetFirstName] o [GetScriptedCharacterByHistoryID('790103').GetFirstName], han obtenido independencia de facto y conspiran su caída. Peor aún, Gales y Escocia aún mantienen antiguas células de Kindred drúidicos y nórdicos.\n$TAB$Nadie puede decir realmente si Mitras aplastará una vez más esta nueva oposición o la dejará pudrirse bajo sus narices hasta que sea demasiado tarde."
 podintroductions.2.a: "¡Todos alabemos al Rey-Dios… por ahora!"
 podintroductions.3.t: "Tierra de Reyes y Brujos"
 podintroductions.3.desc: "$TAB$El corazón indiscutible del $pod_clan$ Ventrue, Alemania está firmemente en manos de [GetScriptedCharacterByHistoryID('505050').GetFirstName].\n$TAB$Aún así, incluso su gobierno no está exento de desafíos, por pretendientes como [GetScriptedCharacterByHistoryID('505096').GetFirstName] de Alemania Occidental o el escurridizo [GetScriptedCharacterByHistoryID('505110').GetFirstName] de Brandeburgo.\n$TAB$En el sur, los usurpadores del $pod_clan$ [GetTrait('tremere').GetName(GetNullCharacter)] tienen una posición precaria, con los viciosos [GetTrait('tzimisce').GetName(GetNullCharacter)] de Europa del Este acercándose rápidamente a sus fortalezas. Su acuerdo defensivo con los poderosos Ventrue es quizás su único salvavidas.\n$TAB$Cerca se encuentra [GetScriptedCharacterByHistoryID('505082').GetFirstName] de París, el príncipe exiliado de Francia, un Vampiro poderoso por derecho propio, pero políticamente solo.\n$TAB$Hardestadt debe actuar rápidamente, sofocando las ambiciones de su vástago [GetScriptedCharacterByHistoryID('505086').GetFirstName], destruyendo las bases de poder de Julia e Ilse y asegurando su frente oriental con o sin la ayuda de los Tremere.\n$TAB$Alemania será la joya de la corona del $pod_clan$ [GetTrait('ventrue').GetName(GetNullCharacter)], o arderá en el intento."
 podintroductions.3.a: "Roma es un recuerdo lejano, el futuro está aquí."
 podintroductions.4.t: "Reconquista en la Sombra"
 podintroductions.4.desc: "$TAB$Iberia es el centro de poder tradicional del $pod_clan$ Lasombra, pero la Reconquista mortal ha sumido a los Magísteres en una amarga guerra civil.\n$TAB$En el norte, [GetScriptedCharacterByHistoryID('505126').GetFirstName] lidera a los Lasombra cristianos oficiales y tiene la clara ambición de gobernar toda Iberia. Debe tener en cuenta a sus ambiciosos vasallos, como [GetScriptedCharacterByHistoryID('505154').GetFirstName] o [GetScriptedCharacterByHistoryID('790178').GetFirstName].\n$TAB$En el sur, después de décadas de luchas internas, los Lasombra musulmanes – que se llaman a sí mismos [Glossary('Ashirra','game_concept_ashirra_desc')] – han encontrado en [GetScriptedCharacterByHistoryID('505125').GetFirstName] de Andalucía a un sultán digno y probado.\n$TAB$En otras partes, [Glossary('Príncipes','game_concept_prince_desc')] nuevos y viejos, desde los regios [GetTrait('ventrue').GetName(GetNullCharacter)] hasta los feroces [GetTrait('gangrel').GetName(GetNullCharacter)], notan la debilidad de los Magísteres y esperan el momento adecuado para atacar.\n$TAB$Esta Reconquista podría ser el último aliento del dominio [GetTrait('lasombra').GetName(GetNullCharacter)] de Iberia."
 podintroductions.4.a: "Iberia volverá a ser una sola, solo denme tiempo."
 podintroductions.5.t: "Ragnarök"
 podintroductions.5.desc: "$TAB$Hace tiempo olvidada por las mentes mortales, la fe nórdica aún existe para los Vampiros de Escandinavia. Sus defensores, los feroces [Glossary('Einherjar','game_concept_einherjar_desc')), se aferran a sus creencias… pero la esperanza se desvanece rápidamente.\n$TAB$El Altísimo [GetScriptedCharacterByHistoryID('505088').GetFirstName] y la líder de las Valquirias, [GetScriptedCharacterByHistoryID('790119').GetFirstName], se han retirado a la depresión y cerca del $pod_torpor$. Algunos continúan la lucha, sin embargo, como [GetScriptedCharacterByHistoryID('790270').GetFirstName] y [GetScriptedCharacterByHistoryID('790265').GetFirstNameNicknamed], tratando de destruir a los Vampiros cristianos invasores, liderados por la prole de [GetScriptedCharacterByHistoryID('505050').GetFirstNamePossessive].\n$TAB$Un rayo de optimismo para los [Glossary('Einherjar','game_concept_einherjar_desc')] es que los recién llegados difícilmente son un grupo unido, peleándose entre ellos, sobre todo en Dinamarca, que está dividida entre tres pretendientes.\n$TAB$En los páramos del norte, una banda de insensibles [GetFaithByKey('viafurores').GetAdherentNamePlural] que se hacen llamar los [GetTitleByKey('d_bar_sinister').GetBaseName] han reclamado de manera dudosa la tierra estéril.\n$TAB$Sean nuevos aliados o enemigos, la última batalla de los nórdicos se acerca, y la Cruz parece ser la favorita clara una vez más..."
 podintroductions.5.a: "Escandinavia nunca volverá a ser la misma."
 podintroductions.6.t: "Réquiem por un Imperio"
 podintroductions.6.desc: "$TAB$Si la Italia mortal medieval es un estado dividido, entonces la Italia nocturna es un barril de pólvora. Poderosos Vampiros ancianos se disputan las ciudades más pobladas de Europa.\n$TAB$En el norte, el 'cardenal' [GetTrait('ventrue').GetName(GetNullCharacter)] [GetScriptedCharacterByHistoryID('790203').GetFirstName] reside en Milán, con un fuerte control sobre la Iglesia italiana a su disposición.\n$TAB$En Venecia, los vástagos [GetTrait('giovanni').GetName(GetNullCharacter)] del $pod_clan$ [GetTrait('cappadocian').GetName(GetNullCharacter)] son amos de un imperio comercial que abarca el mar, el tiempo dirá si su enfoque está en la propia Italia o en el Este, como su $pod_clan$ progenitor.\n$TAB$En Sicilia, la capital del $pod_clan$ [GetTrait('lasombra').GetName(GetNullCharacter)] está custodiada por el fiel [GetScriptedCharacterByHistoryID('505070').GetFirstName], pero la sobreextensión y la guerra civil en España han dejado vulnerable el Mar de Sombras.\n$TAB$Finalmente, todas las miradas están puestas en Roma, donde #ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('790101').GetID] #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('790101').GetID] #L Titus Venturus Camille#!#!#! ha despertado recientemente. El Cónsul Eterno fue el cerebro detrás del imperio de Roma y la destrucción de Cartago, y podría inaugurar una nueva era para el liderazgo [GetTrait('ventrue').GetName(GetNullCharacter)].\n$TAB$Mientras otros líderes mezquinos y reyes inmortales surgen en otras partes de Italia, la Guerra de los Príncipes nunca ha sido más peligrosa que aquí."
 podintroductions.6.a: "Todos los caminos conducen a Roma."
 podintroductions.7.t: "Contra la Pared"
 podintroductions.7.desc: "$TAB$Los Estados Cruzados se mantienen precariamente en el Levante, y un Estado Vampírico aún más precario ha surgido en medio de ellos.\n$TAB$La Dieta de los Olivos es un pacto entre los [Glossary('Príncipes','game_concept_prince_desc')] de varias ciudades de la zona, encabezado por una superviviente, [GetScriptedCharacterByHistoryID('790236').GetFirstName]. La 'Leona' es una [GetTrait('salubri').GetName(GetNullCharacter)], un $pod_clan$ casi extinto en Europa Occidental desde la muerte de su fundador, [GetScriptedCharacterByHistoryID('505008').GetFirstName], a manos del recién surgido $pod_clan$ [GetTrait('tremere').GetName(GetNullCharacter)]. La mayoría de los miembros del debilitado $pod_clan$ se han escondido, pero Qawiyya tiene la intención de plantar cara.\n$TAB$Sin embargo, su precaria alianza ya está en peligro, ya que la poderosa Damasco está cayendo en un pozo literal de locura. [GetScriptedCharacterByHistoryID('790125').GetFirstName], el viejo sultán [GetTrait('toreador').GetName(GetNullCharacter)], ha vendido su alma a fuerzas incalculables, con solo su vástago y una solitaria guerrera #TOOLTIP:GAME_TRAIT,assamite,[GetNullCharacter] #L Assamita#!#! en el camino de una catástrofe.\n$TAB¿Será la Dieta el último hurra de un $pod_clan$ moribundo o la esperanza de un futuro más brillante?"
 podintroductions.7.a: "Jerusalén es la ciudad de los milagros, después de todo…"
 podintroductions.8.t: "Detrás del Velo"
 podintroductions.8.desc: "$TAB$Arabia es la sede del movimiento [Glossary('Ashirra','game_concept_ashirra_desc')], vampiros musulmanes unidos más allá de los clanes por su fe común. Su posición en la península es fuerte, pero la pérdida de Jerusalén ante los cruzados y de Egipto ante las #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Serpientes#!#! los ha separado de sus hermanos magrebíes y andaluces.\n$TAB$Aún peor, Mesopotamia ha caído nuevamente en manos de los infernalistas [GetTrait('baali').GetName(GetNullCharacter)], liderados por [GetScriptedCharacterByHistoryID('790146').GetFirstName] de la rama Nergalita. Su objetivo es tomar las grandes ciudades de la región, Damasco, Bagdad y Tiro, para tener la población que necesita para sacrificar por el regreso de su impío amo.\n$TAB$Irónicamente, su oponente más fuerte es [GetScriptedCharacterByHistoryID('505095').GetFirstName] de Tiro, otro [GetTrait('baali').GetName(GetNullCharacter)], este de la rama Molochim. Esta rivalidad ha sumido a los resurgentes Baali en una guerra civil y da esperanza a los fieles musulmanes de que puedan ser detenidos.\n$TAB$Si no… entonces, el mundo entero podría estar en juego."
 podintroductions.8.a: "La cuna de la civilización también podría ser su lecho de muerte."
 podintroductions.9.t: "Capa y Cimitarra"
 podintroductions.9.desc: "$TAB$Persia es la sede del #TOOLTIP:GAME_TRAIT,assamite,[GetNullCharacter] #L $pod_clan$ Assamita#!#!, un grupo misterioso para los forasteros.\n$TAB$Gobernado por la recién coronada y muy disputada Anciana, [GetScriptedCharacterByHistoryID('790530').GetFirstName], su fachada de unidad muestra grietas a medida que varias facciones hacen sus jugadas de poder.\n$TAB$[GetScriptedCharacterByHistoryID('790164').GetFirstName] de la Red de Cuchillos quiere que el $pod_clan$ se convierta en un culto fanático de asesinos preparados para servir como un ejército para el regreso de su amo oscuro.\n$TAB$[GetScriptedCharacterByHistoryID('790166').GetFirstName] de los Hechiceros camina por un camino de moderación, viendo a los Assamitas como jueces y diplomáticos.\n$TAB$Finalmente, [GetScriptedCharacterByHistoryID('605110').GetFirstName] de los Guerreros es un musulmán devoto, y acogería con agrado un acercamiento con los [Glossary('Ashirra','game_concept_ashirra_desc')] de Arabia.\n$TAB$Esta agitación política ha ayudado al crecimiento de otro grupo en la región, la Tribu Perdida de [GetScriptedCharacterByHistoryID('790219').GetFirstName], una herejía que venera a la Segunda Generación de vampiros.\n$TAB$Paralizado por las divisiones y la ineficiencia, ¿encontrará el $pod_clan$ Assamita un nuevo propósito común o implosionará en una guerra civil?"
 podintroductions.9.a: "Uniré Persia, por la diplomacia o de otro modo."
 podintroductions.11.t: "La Guerra Eterna"
 podintroductions.11.desc: "$TAB$Desde el principio de los tiempos, la India ha sido el teatro de una guerra entre el $pod_clan$ [GetTrait('ravnos').GetName(GetNullCharacter)] y los [Glossary('Asuratizayya','game_concept_kuei_jin_desc')], o [GetTrait('kueijin').GetName(GetScriptedCharacterByHistoryID('791112').Self)], un misterioso grupo de 'Vampiros' asiáticos.\n$TAB$No ha habido vencedores y ambos combatientes están al borde de la ruptura, con varias facciones conspirando para derrocar al liderazgo actual.\n$TAB$En Occidente, [GetScriptedCharacterByHistoryID('790190').GetFirstName] está reuniendo a los Ravnos para una batalla más. Mientras que en el Este, [GetScriptedCharacterByHistoryID('791126').GetFirstName] lidera al Trueno Infinito hacia otra carga.\n$TAB$Otros poderes, desde la #ONCLICK:FAITH,[GetFaithByKey('pathofdaena').GetID] #TOOLTIP:FAITH,pathofdaena #L Daena#!#!#! hasta [GetScriptedCharacterByHistoryID('605123').GetFirstName] de los [GetTrait('tzimisce').GetName(GetNullCharacter)], buscan con avidez oportunidades en la tormenta constante.\n$TAB¿Surgirá finalmente un vencedor?"
 podintroductions.11.a: "Yo soy, obviamente, la única esperanza para la paz en la India."
 podintroductions.12.t: "Todavía Cayendo"
 podintroductions.12.desc: "$TAB$Aunque fue quemada hace siglos, la pérdida de Cartago aún se siente en el Magreb.\n$TAB$El área ha sido dividida desde entonces entre varios sultanes [Glossary('Ashirra','game_concept_ashirra_desc')], pero ninguno de ellos ha logrado realmente consolidar la región.\n$TAB$Los dos mejor posicionados para hacerlo son [GetScriptedCharacterByHistoryID('605132').GetFirstName], la muy vieja líder de Túnez que aún recuerda la pérdida de su ciudad junto con Cartago, y [GetScriptedCharacterByHistoryID('605131').GetFirstName] de Argel, un joven y ambicioso [GetTrait('lasombra').GetName(GetNullCharacter)].\n$TAB$Los #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Setitas#!#! también tienen un punto de apoyo aquí, al igual que el $pod_clan$ [GetTrait('tremere').GetName(GetNullCharacter)].\n$TAB$Con este patchwork dividido de poderes y una rica historia, el Magreb es un premio tentador para cualquier [Glossary('Príncipe','game_concept_prince_desc')] o sultán aventurero."
 podintroductions.12.a: "Necesitamos seguir adelante desde Cartago."
 podintroductions.13.t: "A la Sombra de la Pirámide"
 podintroductions.13.desc: "$TAB$Egipto ha soportado muchos conquistadores extranjeros, y sus no-muertos nativos no son sino pacientes y resistentes.\n$TAB$El verdadero poder aquí reside en Gizeh, con el corazón del $pod_clan$ [GetTrait('setite').GetName(GetNullCharacter)]. El $pod_clan$ de la libertad —o corrupción, dependiendo de a quién se pregunte— está preparando sus fuerzas para beneficiarse del vacío de poder creado por las cruzadas.\n$TAB$Su primer objetivo será sin duda El Cairo. Liderada por el poderoso Ventrue [GetTrait('vampgeneration5').GetName(GetNullCharacter)] [GetScriptedCharacterByHistoryID('710202').GetFirstName], la ciudad no caerá fácilmente, sin embargo, y podría frustrar a las Serpientes si se declarara una guerra abierta.\n$TAB$Todos están seguros de que los Seguidores de Set harán su primer movimiento pronto, pero nadie puede decir cuándo, y si, serán detenidos cuando lo hagan…"
 podintroductions.13.a: "Egipto es tan inmortal como nosotros."
 podintroductions.14.t: "Tierra de Dualidad"
 podintroductions.14.desc: "$TAB$Los Vampiros nativos de África son los [GetFaithByKey('laibon').GetAdjective], una asociación laxa de múltiples líneas de sangre y chupasangres auto-creados. Poseen la mayor parte del verdadero poder en el continente, pero deben lidiar con los muchos aventureros o señores de la guerra mezquinos que buscan fama y fortuna en sus tierras.\n$TAB$Peor aún, África también alberga algunas criaturas verdaderamente antiguas, todavía allí desde la época en que era la cuna de la humanidad.\n$TAB$Con varios caminos nuevos que se abren con el mundo musulmán y [Glossary('Ashirra','game_concept_ashirra_desc')], está por verse si los Laibon podrán adaptarse y prosperar en los tiempos cambiantes."
 podintroductions.14.a: "Oportunidades y peligros en abundancia."
 podintroductions.15.t: "El Tigre Herido"
 podintroductions.15.desc: "$TAB$El Tíbet es tradicionalmente el hogar de la Corte del Tigre Blanco de los $pod_kueijin$, los Muertos Hambrientos de Asia. Aún más que eso, es donde se supone que se encuentra su mítico punto de origen, el Monte Meru.\n$TAB$Una vez una región estable bajo el laxo liderazgo de la Emperatriz Fan, su repentino autoexilio básicamente desgarró la Corte cuando su sucesor, Da, intentó consolidar su poder.\n$TAB$Con la corte ahora dividida entre los leales a Da, los partidarios de Fan y los monjes aislacionistas del Himalaya, muchos otros poderes menores han surgido para reclamar su parte en esta región ahora disputada.\n$TAB¿Se levantará el Tigre Blanco una vez más de esta crisis o está el Tíbet destinado a un nuevo amo?"
 podintroductions.15.a: "¿El fin de una era?"
 podintroductions.16.t: "Trueno del Este"
 podintroductions.16.desc: "$TAB$Las estepas no son una tierra para Vampiros. Pocas ciudades donde esconderse, pocas naciones que manipular y doblegar a su voluntad.\n$TAB$Pero, del este viene una nueva raza de vampiros, una que se siente como en casa en las llanuras interminables y con el pueblo nómada mongol. Estos [GetDynastyHouseByID('house_anda').GetName], una rama [GetTrait('gangrel').GetName(GetNullCharacter)], son orgullosos guerreros y siguen al Imperio Mongol en su expansión masiva con sus conquistas.\n$TAB$El conflicto con los ya presentes [GetTrait('gangrel').GetName(GetNullCharacter)] del oeste parece inevitable y, aún más allá, se esperan tensiones con los [Glossary('Cainitas','game_concept_cainite_desc')] europeos cuando estos recién llegados lleguen. El consuelo se puede encontrar en el hecho de que estos conquistadores tienen poderosos enemigos propios en el extremo oriente con los que lidiar.\n$TAB$El cambio es algo raro entre los Vampiros, pero cuando llega con una horda atronadora de arqueros a caballo, el cambio podría ser lo último que muchos de ellos experimenten…"
 podintroductions.16.a: "El cambio no siempre es bienvenido…"
 podintroductions.17.t: "Los que aquí entráis…"
 podintroductions.17.desc: "$TAB$Europa del Este es la tierra tradicional del $pod_clan$ [GetTrait('tzimisce').GetName(GetNullCharacter)], pero su hegemonía ha sido recientemente cuestionada por el ascenso de los [GetTrait('tremere').GetName(GetNullCharacter)], respaldados por los [GetTrait('ventrue').GetName(GetNullCharacter)] alemanes y húngaros.\n$TAB$Una guerra reciente terminó con un amargo tratado de paz entre [GetScriptedCharacterByHistoryID('505053').GetFirstName], voivoda de voivodas, y [GetScriptedCharacterByHistoryID('505086').GetFirstName], cruzado Ventrue. Se ha establecido un estado tapón, la Orden Obertus, encabezado por el artífice de la paz [GetScriptedCharacterByHistoryID('790114').GetFirstName].\n$TAB$Ahora, todo el mundo se lame las heridas, Rustovitch tratando de asegurar su control del $pod_clan$ y los Ventrue húngaros resolviendo una crisis de sucesión con el $pod_torpor$ de su líder, [GetScriptedCharacterByHistoryID('505052').GetFirstName].\n$TAB$Finalmente, [GetScriptedCharacterByHistoryID('505084').GetFirstName] está liderando a los Usurpadores en lugar de [GetScriptedCharacterByHistoryID('505022').GetFirstNamePossessive], mostrando la fachada de una pirámide unificada contra los demonios.\n$TAB$Todos saben que la guerra es inevitable en esta región hasta que un Vampiro sea lo suficientemente poderoso para aplastar a sus rivales de una vez por todas. ¿Quién será?"
 podintroductions.17.a: "Una tierra por domar."
 podintroductions.18.t: "Sueño que se Desvanece"
 podintroductions.18.desc: "$TAB$Las cenizas de Constantinopla aún están calientes y, sin embargo, los buitres ya están dando vueltas alrededor de su cadáver. El Sueño de [GetScriptedCharacterByHistoryID('505051').GetFirstNamePossessive], una utopía vampírica nunca vista desde Cartago, ha caído con su creador, y varios señores de la guerra y restos del Imperio roto están tratando de sobrevivir.\n$TAB$El más importante de ellos es [GetScriptedCharacterByHistoryID('505098').GetFirstName], uno de los instigadores de la 4ª Cruzada, que ahora posee Constantinopla. El ambicioso [GetTrait('lasombra').GetName(GetNullCharacter)] aún se inclina ante los líderes del $pod_clan$ en Sicilia, pero ¿por cuánto tiempo?\n$TAB$Más al oeste, [GetScriptedCharacterByHistoryID('790104').GetFirstName] de los [GetTrait('brujah').GetName(GetNullCharacter)] es uno de los últimos verdaderos creyentes del Sueño aún activos, con la esperanza de reclamar para sí el manto del 'Arcángel' [GetScriptedCharacterByHistoryID('505051').GetFirstName].\n$TAB$[GetScriptedCharacterByHistoryID('790004').GetFirstName] no tiene ambiciones tan elevadas, usando Nicea para finalmente conseguir el Imperio que debería haber sido suyo incluso durante sus días mortales.\n$TAB$Mientras muchos otros [Glossary('Príncipes','game_concept_prince_desc')] aspirantes construyen dominios en las cenizas del antiguo, Constantinopla podría renacer de nuevo… o estar muerta para siempre."
 podintroductions.18.a: "¿Había previsto Miguel este caos?"
 podintroductions.19.t: "Abuela, abuela..."
 podintroductions.19.desc: "$TAB$Hasta donde alguien puede recordar, Rusia es el hogar de uno de los kindred más poderosos que existen, [GetScriptedCharacterByHistoryID('505075').GetFirstName]. Este [GetTrait('nosferatu').GetName(GetNullCharacter)] de 4ª generación, del que se rumorea que es el verdadero progenitor del $pod_clan$, es parte inseparable de la tierra y la utiliza para defenderse de su vengativo [Glossary('Sire','game_concept_Sire_desc')].\n$TAB$Por suerte para todos en la zona, la bruja está en $pod_torpor$. Pero la influencia de su Cortina de Sombras aún se siente, alimentada por su leal segundo al mando, [GetScriptedCharacterByHistoryID('790483').GetFirstName].\n$TAB$Con tales condiciones, solo hay tres tipos de Vampiros en Rusia: los vasallos de la Abuela, los valientes y los que estarán muertos pronto. Las dos últimas categorías a menudo se superponen entre sí..."
 podintroductions.19.a: "Cuidado con las niñas pequeñas..."
 podintroductions.20.t: "Nuevo Destino para la Vieja Tierra"
 podintroductions.20.desc: "$TAB$Tradicionalmente una frontera del Voivodato [GetTrait('tzimisce').GetName(GetNullCharacter)], hogar de los demonios más... excéntricos, Polonia se está convirtiendo en una entidad separada por derecho propio. La autoridad desmoronada de los Voivodas, y su completo anacronismo, ha permitido que una nueva generación de Vampiros se afiance y prospere.\n$TAB$El primero entre ellos es [GetScriptedCharacterByHistoryID('790246').GetFirstName], un devoto [GetTrait('brujah').GetName(GetNullCharacter)], reuniendo seguidores alrededor de Cracovia para expulsar al antiguo [Glossary('Príncipe','game_concept_prince_desc')], [GetScriptedCharacterByHistoryID('790937').GetFirstName]. Este podría ser el primer paso hacia una Polonia libre de la influencia Tzimisce.\n$TAB$Pero mayores desafíos esperan, sobre todo expulsar a la completa abominación que es [GetScriptedCharacterByHistoryID('605111').GetFirstName], un Tzimisce considerado incluso extremo por sus propios pares..."
 podintroductions.20.a: "Debo prestar atención a este viento de cambio o ser aplastado por él." 
 podintroductions.21.t: "Tierra de los Libres"
 podintroductions.21.desc: "$TAB$Lejos del aplastante control de los tiranos en Europa Occidental, el área báltica alberga dos construcciones políticas de un nuevo tipo para los Vampiros.\n$TAB$En Lituania, [GetScriptedCharacterByHistoryID('790105').GetFirstName] de los [GetTrait('gangrel').GetName(GetNullCharacter)] ha unificado una amplia banda de paganos de espíritu libre en lo que él pretende que sea el punto de detención de la expansión cristiana y Ventrue hacia el este.\n$TAB$Más al norte, [GetScriptedCharacterByHistoryID('790120').GetFirstNameNicknamed] está liderando un Estado Libre [Glossary('Einherjar','game_concept_einherjar_desc'), quizás el último de su tipo, ya que Escandinavia está cayendo ante los secuaces de [GetScriptedCharacterByHistoryID('505050').GetFirstNamePossessive].\n$TAB$Ambos experimentos están en gran peligro, interno y externo, y dependen principalmente del puro carisma de sus líderes. Incluso su valentía y convicción podrían resultar inútiles contra la inminente embestida [GetTrait('ventrue').GetName(GetNullCharacter)]..."
 podintroductions.21.a: "Los últimos vestigios de una era moribunda no caerán fácilmente." 
 podintroductions.22.t: "Bajo la Cruz Blanca"
 podintroductions.22.desc: "Aquí es donde todo comenzó para los Caballeros de Acre. Hace 26 años, Gauthier de Dampierre luchó contra los monstruos conocidos como vampiros mientras Constantinopla ardía a su alrededor. Sintió el llamado de Dios para tomar la espada contra este verdadero enemigo.\nDesde entonces, Gauthier ha sido fundamental para liderar los esfuerzos marciales de la Inquisición Sombría desde su fortaleza en Chipre, pero el tiempo no espera a nadie. El viejo Gran Maestre sabe que probablemente no verá cumplido su sueño de reconquistar Constantinopla para el Señor antes de su muerte.\nComo tal, Gauthier está preparando su sucesión, y se están haciendo planes para que la próxima generación de Caballeros de Acre lleve a la Cristiandad a su victoria definitiva contra los chupasangres. Porque ellos son la Espada de Dios, y los últimos defensores de la humanidad contra los horrores en la oscuridad."
 podintroductions.22.a: "Salvaremos a la humanidad, o moriremos en el intento" 
 podintroductions.23.t: "La Sombra de los Cátaros"
 podintroductions.23.desc: "La Santa Iglesia comprendió por primera vez la amenaza de los vampiros durante la Cruzada Albigense contra los Cátaros. Durante ese tiempo, se descubrió que las pobres almas del sur de Francia, la mayoría de las veces, eran engañadas por estas malditas criaturas.\nNo es de extrañar, entonces, que Su Santidad se interesara especialmente en Francia, aparentemente un punto álgido de infestación vampírica. Los esfuerzos de la Inquisición están liderados por Aignen de Toulouse, un hombre reservado, antiguo amigo del famoso Rodrigue de Navarre. Maestro de una creciente red de espías, los Oculi Dei, Aignen juega el juego a largo plazo, sabiendo bien que la situación en Francia es mucho peor de lo que incluso Roma piensa. Cualquier paso en falso podría ser el último..."
 podintroductions.23.a: "Sed celosos, pero también pacientes y sutiles" 
 podintroductions.24.t: "Sol versus Cruz"
 podintroductions.24.desc: "Inglaterra siempre ha sido una tierra desconcertante para la Santa Iglesia. Aferrándose durante mucho tiempo a prácticas antiguas, con rumores de brujería o algo peor que surgen de vez en cuando, la isla nunca ha sido verdaderamente domada.\nLa Madre María, líder de las Hermanas de San Juan, es solo la última de una larga lista de inquisidores que intentan comprender la raíz de la corrupción que carcome esta tierra. Las visiones de sus hermanas hablan de una entidad conocida como 'Mitras' que se proclama Dios en cuanto se pone el sol.\nCon este objetivo claro a la vista, y su celo implacable como su arma, las hermanas se preparan para liderar a la Inquisición en una lucha cuya proporción apenas comienzan a entender..."
 podintroductions.24.a: "Solo hay un Dios" 
 podintroductions.25.t: "Celoso Noble"
 podintroductions.25.desc: "Los Von Murnau, una casa noble alemana, han sido maldecidos -o bendecidos- por Dios para poder literalmente oler el mal. Esta característica, junto con su fortaleza en Baviera, los convierte en socios invaluables de la Inquisición Sombría.\nSu participación está coordinada por un tal Leopold von Murnau, un hombre enfermizo de enorme intelecto y empuje. En realidad, es la mente detrás de la fundación de la Inquisición, y su líder informal.\nCon su fuerte liderazgo, Baviera se ha convertido en un faro de esperanza para los Inquisidores de todas partes, una promesa de lo que podría ser la Tierra una vez purgada de los viles vampiros. Sin embargo, Leopold está lejos de haber terminado, y ya está planeando su próximo paso, con una posible fusión de las órdenes de la Inquisición en una nueva Sociedad..."
 podintroductions.25.a: "Una familia se enfrenta a la oscuridad" 
 podintroductions.26.t: "El Primero de su Especie"
 podintroductions.26.desc: "A pesar de lo que la Inquisición Sombría querría hacer creer, Rodrigue de Navarre fue en realidad el primer hombre en hacer frente a la oscuridad. Este noble menor participó en la Cruzada Albigense, y se encontró con la prueba de que 'algo' estaba ahí fuera.\nEsta revelación, y los numerosos intentos vampíricos de silenciarlo desde entonces, han afectado la cordura de Rodrigue y el fundador de los Caballeros de Santiago ahora ve enemigos en todas partes, incluso entre sus compañeros inquisidores. Como tal, no se ha unido oficialmente a la Inquisición Sombría, pero acepta a regañadientes su apoyo en la reconquista de Iberia.\nLa Santa Sede está preocupada de que la obstinación de Rodrigue pueda ser un problema grave, ya que los vampiros son muy conscientes de su presencia, y la Iglesia no puede hacer sentir todo su poder en la península."
 podintroductions.26.a: "Un hombre paranoico solo contra la oscuridad" 
 podintroductions.27.t: "Las Fauces de la Bestia"
 podintroductions.27.desc: "La Santa Sede quisiera pensar que Italia está libre de corrupción vampírica. Pero la revelación de que un cardenal, Fabrizio Ulfila, era en realidad una prole del infierno sacudió a Su Santidad hasta los cimientos.\nSin querer sembrar el pánico entre el rebaño, ha encargado a la líder informal de la Orden Roja, Vittoria Santini di Parma, evaluar esta amenaza demasiado cerca para sentirse cómodo.\nCon las bien surtidas bibliotecas de la Orden a su disposición, Vittoria ya ha hecho algunos descubrimientos muy alarmantes. Los chupasangres están por todas partes en Italia, e incluso desfilan en la propia Ciudad Santa cuando aparece la noche.\nSin embargo, fuerzas poderosas rodean su pequeña célula, y su investigación podría terminar antes de empezar si no tiene cuidado..."
 podintroductions.27.a: "El mismísimo corazón del cristianismo está amenazado" 
 podintroductions.101.t: "Tu Historia Hasta Ahora"
 podintroductions.101.desc: "Los poderosos han caído bastante bajo, bella Helena, aquí estás, la mujer más hermosa del mundo, reducida a luchar con tu amargo rival en las costas de una isla remota. Hace mucho tiempo, eras adorada, y los hombres libraban guerras sangrientas por una sola mirada. Ménele te robó todo.\nEl obstinado Rey de Esparta no pudo aceptar que tomaras partido por Roma durante las Guerras Púnicas, y te ha estado cazando desde entonces. Destruyó tu amada Pompeya y un sinnúmero de tus adoradores y vástagos. Ahora, solo tienes a tu precioso Prias a tu lado... pero estás cansada de huir.\nEs hora de que termine esta disputa milenaria, hija de Micenas. ¡Destruye a Ménele y sus necios sueños de utopía!\nEntonces, y solo entonces, el futuro volverá a parecer brillante."
 podintroductions.101.a: "Esto termina ahora" 
 podintroductions.helena: "Una vez que Ménele esté muerto, tendrás acceso a una decisión especial"
 podintroductions.102.t: "Tu Historia Hasta Ahora"
 podintroductions.102.desc: "Lord Absalon, padre de Dinamarca, tu partida para luchar contra los malditos Tremere bálticos ha dejado tu tierra abierta a pretendientes y aventureros. Hay que lidiar con ellos, ya que eres el único gobernante que Dinamarca necesita.\nMientras aplastas a estos necios, quizás quieras aprender más sobre este extraño ritual que descubriste en Ruga durante tu viaje. Todavía te preguntas qué intentaban hacer esos cultistas, ¿resucitar a su Dios? Obviamente un último esfuerzo patético para detenerte, pero...\nSi pudieras tener éxito, aprovechando el poder de esta deidad 'Svantevit' en ti mismo... ¡serías imparable!\nEs hora de que reconquistes Dinamarca y comiences tu ascensión a la divinidad, lord Absalon. Es, obviamente, tu verdadero destino."
 podintroductions.102.a: "Primero Dinamarca, luego..." 
 podintroductions.absalon: "Puedes invertir en una decisión especial para descifrar progresivamente el ritual de Svantevit"
 podintroductions.103.t: "Tu Historia Hasta Ahora"
 podintroductions.103.desc: "Poderoso Mitras, tu regreso a la prominencia en Inglaterra ha sido un éxito rotundo hasta ahora, con los vampiros normandos invasores finalmente eliminados. Sin embargo, todavía hay algunas preocupaciones que atender, con varios forajidos y Príncipes independientes desafiando tu gobierno.\nSin embargo, el verdadero problema está en otra parte, ya que ya puedes sentir el sueño de los siglos arrastrándose en tu alma. Y conoces lo suficiente a tus regentes como para saber que lo estropearán si vuelves a dormirte.\nSin embargo, recientemente has sentido en tu sangre que tu viejo amor, Kemintiri de los Setitas, ha despertado de nuevo. Tal vez podrías enviar a buscarla y reavivar tu relación? Siempre fue una figura divisiva en tu corte y es probable que tus vasallos no aprecien su regreso... pero ¿a quién le importa su opinión de todos modos?"
 podintroductions.103.a: "Vuelve a mí, amada de Isis" 
 podintroductions.mithras: "Envías a buscar a Kemintiri, lo cual es costoso y probablemente enfadará a tus vasallos"
 podintroductions.103.b: "Volver con tu ex nunca es una buena idea" 
 podintroductions.mithrasb: "Olvidas toda esta historia"
 podintroductions.104.t: "Tu Historia Hasta Ahora"
 podintroductions.104.desc: "Voivoda Rustovitch, tu gobierno está en peligro. A pesar de tu aplastante victoria contra Jürgen y sus Ventrue, te viste obligado a firmar una paz blanca por la puñalada repentina de la Horda de Sangre. Esto no sentó bien a tus vasallos.\n'¡Demasiado joven! ¡Demasiado occidental! ¡Incapaz de aplastar a los Tremere!' dicen. Estos necios, apenas capaces de mantener sus patéticos castillos, no saben nada de guerra y gobierno. Aún así, los necesitas.\nDebes regresar a tu táctica probada y verdadera del 'Juicio por la Guerra', librando escaramuzas con tus propios vasallos para frenar sus ambiciones. Aprenderán a respetarte una vez más."
 podintroductions.104.a: "Que comience la Fiesta de los Demonios" 
 podintroductions.vlad: "Como Rustovitch, tienes un [character_interaction|E] especial disponible con tus vasallos directos"
 podintroductions.105.t: "Tu Historia Hasta Ahora"
 podintroductions.105.desc: "Lord Etrius, el exilio de tu rival Goratrix a Francia ha asegurado tu posición como favorito de Tremere y líder de la Casa. Aún así, tienes que lidiar con amenazas tanto dentro como fuera del $pod_clan$. El Voivodato Tzimisce al este es una preocupación constante, pero también debes asegurarte de que ningún otro Mago intente usurpar tu legítimo lugar.\nComo la mano derecha del propio fundador, tienes muchas herramientas a tu disposición para asegurarte de que eso no suceda. ¡Asegúrate de usarlas sabiamente y traer gloria a la Casa Tremere!... y a ti también, por supuesto."
 podintroductions.105.a: "La Pirámide es mía para mandar" 
 podintroductions.etrius: "Como Etrius, tienes un [character_interaction|E] especial disponible con tus vasallos Tremere directos"
 podintroductions.106.t: "Tu Historia Hasta Ahora"
 podintroductions.106.desc: "Matasuntha la Temible, recientemente despertaste a este extraño mundo nuevo, tan alejado de los gloriosos días de los hunos que tanto amabas. Aún así, hay algunos nuevos jinetes de la estepa a los que ayudar, y algunas nuevas 'civilizaciones' que derribar.\nSin embargo, no puedes hacerlo sola, y el $pod_clan$ Gangrel te ha olvidado. Como tal, debes confiar en tu propia progenie. Scendrak ya está ahí, pero Zayyat se ha convertido a una extraña nueva religión, y como tal está fuera de tu alcance... pero Vorocius, quizás el más poderoso de los tres, es una fuerte posibilidad.\nPodrías llamarlo de vuelta, aunque esto te costaría una gran cantidad de energía considerando las distancias involucradas. O simplemente podrías olvidarte de él."
 podintroductions.106.a: "¡Cabalgaremos juntos una vez más, mi vástago!" 
 podintroductions.106.b: "Me las arreglaré bien sola" 
 podintroductions.107.t: "Tu Historia Hasta Ahora"
 podintroductions.107.desc: "Tabitha la Intrépida, la propia Anciana te ha enviado a Iberia con una misión clara: detener la Reconquista.\nEs un gran honor y una gran responsabilidad, ya que los miembros más respetados de tu $pod_clan$ creen que eres capaz de repeler la marea de los Lasombra cristianos.\nTomaste Badajoz como tu centro de poder, para estar lo más cerca posible de la primera línea, pero ahora te ves obligada a jugar un juego que no te es tan familiar, el de la política.\nAndalucía está dividida, y en la división caerás. Como tal, hasta ahora has aceptado el insensible liderazgo de Badr sobre los esfuerzos combinados de los $pod_cainites$ musulmanes, pero te preocupa que su enfoque pueda llevar a más desunión a largo plazo.\nNo eres de las que decepcionan a sus mayores, pero la tarea que te espera sigue siendo aterradora, y las verdaderas amenazas podrían estar más cerca de lo que pensaste inicialmente..."
 podintroductions.107.a: "Seré el escudo de Andalucía" 
 podintroductions.tabitha: "Como Tabitha, tienes una decisión especial limitada en el tiempo"
 podintroductions.108.t: "Tu Historia Hasta Ahora"
 podintroductions.108.desc: "Lord Roque, Iberia está en conflicto. La guerra civil de los Lasombra amenaza con envolver a todos a su paso, incluido tú. Debes estar listo y prepararte si quieres sobrevivir.\nTu astucia y habilidades diplomáticas te han asegurado el respeto de tus vecinos, a pesar de ser uno de los Clanes Bajos. Obviamente, todavía te desprecian, sin embargo, y no dudarán en aplastarte si muestras debilidad. Recuerda que solo te aceptarán como su igual si no tienen otra opción.\nTambién eres conocido como un conspirador talentoso, aunque algo compulsivo, y esta podría ser tu mayor activo en los tiempos terribles que se avecinan. Aprovéchalo bien, y podrías incluso erigirte como uno de los líderes más prominentes de una nueva Iberia."
 podintroductions.108.a: "Debo planificar con mucha antelación" 
 podintroductions.roque: "Como Roque, tu plan de investigación te da una bonificación especial cuando se completa"
 podintroductions.109.t: "Tu Historia Hasta Ahora"
 podintroductions.109.desc: "Lord Montano, el Mar de Sombras yace en ruinas. La guerra civil ibérica, el desastre de la 4ª Cruzada y el despertar de Camila en Roma han reducido a casi nada el vasto imperio que custodiabas para tu [Glossary('Sire','game_concept_Sire_desc')].\nEsto no puede continuar o invitaría al caos en el $pod_clan$, ya que jóvenes pretendientes comienzan a difundir rumores sobre tu fracaso como líder.\nPara restaurar tu autoridad, el curso de acción es simple. Asegura Sicilia e Italia, muestra al $pod_clan$ Lasombra que sigues siendo una fuerza a tener en cuenta. Entonces, y solo entonces, volverás a ser respetado."
 podintroductions.109.a: "Hay mucho por hacer" 
 podintroductions.montano: "Como Montano, tienes una decisión especial para restaurar tu autoridad que se desmorona"
 podintroductions.110.t: "Tu Historia Hasta Ahora"
 podintroductions.110.desc: "Lady Natalya, Constantinopla arde y tu sueño de una nueva utopía con ella. Con tu fuerte posición en Grecia, podrías ser la única esperanza para la Ciudad del Deseo del Mundo... pero los Latinos ya están bien atrincherados. Necesitas un plan.\nOtra superviviente, Ana Comneno, sería una aliada perfecta para rodear la Ciudad, pero conoces a Ana... es despiadada y ambiciosa, y solo le importa el poder.\nOtra solución sería mantenerte fiel a tus ideales y pedir ayuda a los michaelitas restantes. El poderoso Malachite, el propio campeón de Miguel, sería una ayuda tremenda. Pero nunca aceptaría una alianza con Ana, así que será uno u otro.\nPragmatismo o idealismo es la elección que tienes por delante. ¿Qué será, Autokrator?"
 podintroductions.110.a: "Pragmatismo. Necesito los ejércitos de Ana" 
 podintroductions.110.b: "Idealismo. Malachite me guiará." 
 podintroductions.natalya: "Entrarás en una alianza con Ana Comneno de Nicea"
 podintroductions.111.t: "Tu Historia Hasta Ahora"
 podintroductions.111.desc: "Sabia Durga Syn, Rusia te necesita más que nunca. Tu enemiga eterna, la temible Baba Yaga, yace dormida por ahora, pero sus agentes de la Cortina de Sombras aún oprimen tu patria bajo su culto tiránico a la maldita Bruja.\nNecesitarás toda la ayuda que puedas reunir en la desalentadora tarea que tienes por delante. Por suerte, eres conocida como quizás la mejor mentora del mundo $pod_cainite$, un hecho que puedes aprovechar para tu uso.\nReúne a los mejores a tu alrededor, reverenciada maestra, y llévalos a la victoria."
 podintroductions.111.a: "La nueva generación nos salvará" 
 podintroductions.durgasyn: "Como Durga Syn tienes una opción especial, siempre beneficiosa, cuando educas a una nueva progenie.\nTambién puedes levantar la Maldición de Baba Yaga sobre ti para recuperar tu juventud logrando el objetivo de Este y Oeste."
 podintroductions.112.t: "Tu Historia Hasta Ahora"
 podintroductions.112.desc: "Alabado sea Set, y alabada seas tú Maatkare, su consorte más amada, por la salvación que traes a la malograda raza '$pod_cainite$'. Tu corazón llora al ver a tantos hijos de tu amado sin seguir sus enseñanzas. Sin embargo, hay esperanza, ya que el caos de la guerra civil de los Lasombra en Iberia deja a muchos de ellos extraviados y en busca de guía.\nComo una de las Hierofantes, las líderes legítimas del $pod_clan$ Setita, estás feliz de proporcionar tal guía. Solo te detendrás cuando todo el mundo cante sus alabanzas. Entonces, y solo entonces, él regresará triunfante a tu lado..."
 podintroductions.112.a: "Tantas almas pobres por liberar" 
 podintroductions.maatkare: "Como Maatkare, tienes un [character_interaction|E] especial donde puedes intentar convertir a cualquier incrédulo no ferviente. Solo está disponible si permaneces en la religión de la Vía Set."
 podintroductions.113.t: "Tu Historia Hasta Ahora"
 podintroductions.113.desc: "Lady Qawiyya, acabas de consolidar la Dieta de los Olivos cuando ya una nueva crisis reclama tu atención. La poderosa ciudad de Damasco ha caído bajo influencia infernalista y amenaza con engullir toda la región en su locura.\nManaal, un vástago del Príncipe, y Bistakh, un enviado Haqimita, son los últimos dos vampiros cuerdos de esta ciudad y ahora piden tu ayuda para purgarla. Ambos han jurado ayudarte en todo lo que puedan si te comprometes con su causa.\nSalvar Damasco enviaría un poderoso mensaje al mundo de que el $pod_clan$ Salubri sigue muy vivo, pero también sabes que te convertiría en el objetivo principal de la influencia Baali hasta que la ciudad esté a salvo..."
 podintroductions.113.a: "Debemos marchar antes de que sea demasiado tarde" 
 podintroductions.113.b: "Lamentablemente, la Dieta es demasiado débil por ahora" 
 podintroductions.qawiyya: "Para deshacerte del modificador negativo, tendrás que tomar Damasco y Palmira en 70 años"
 podintroductions.114.t: "Tu Historia Hasta Ahora"
 podintroductions.114.desc: "Felipe te traicionó. Casandro te traicionó. Incluso Alejandro te traicionó al morir tan pronto cuando su destino estaba tan cerca. Estás completamente sola, Petaniqua.\nEn esto, encontraste fuerza y un propósito renovado. Al rechazar a la humanidad de una vez por todas, nuevos aliados acudieron a ti en masa, los Lupinos conocidos como los 'Danzantes de la Espiral Negra'. Adoran a una entidad oscura llamada el '$glossary_wyrm$'.\nQuizás esta sea la clave de tu salvación, Petaniqua. Caminar por esta Espiral Negra podría salvarte... o condenarte aún más.\nPero ¿cuánto más abajo puedes seguir cayendo de todos modos?"
 podintroductions.114.a: "La verdad está ahí abajo" 
 podintroductions.petaniqua: "Como Petaniqua, tienes una decisión especial para caminar por la Espiral Negra. Ten en cuenta que está lejos de ser una empresa segura..."
 podintroductions.115.t: "Tu Historia Hasta Ahora"
 podintroductions.115.desc: "Lord Dionisio, la agitación de la 4ª Cruzada se está extendiendo a tu amada Atenas. Llegan refugiados a la ciudad, sintiéndose perdidos tanto física como espiritualmente. Como uno de los principales defensores del Sendero de la Humanidad, es tu deber albergar a estas pobres almas.\nPero también podrías buscar restablecer el orden en esta Grecia arruinada, para evitar que un evento tan traumático vuelva a ocurrir jamás. Como un querido maestro y mentor, asegúrate de encontrar y nutrir a los mejores prospectos que puedas para el futuro. La raza $pod_cainite$ los necesitará más que nunca ahora."
 podintroductions.115.a: "De las cenizas, el renacimiento" 
 podintroductions.dionysius: "Como Dionisio, tienes una opción especial, siempre beneficiosa, cuando educas a una nueva progenie"
 podintroductions.224.t: "Tu Historia Hasta Ahora"
 podintroductions.224.desc.intro: "Fuiste creado como sirviente del brujo Tremere, [destroyed_tremere_master.GetFullName]. Debido a una serie peculiar de circunstancias, [destroyed_tremere_master.GetSheHe] fue destruido por los Tzimisce. Siendo el único vampiro sobreviviente en su dominio, has heredado de facto este reino y posesiones. Sin embargo, estás rodeado de enemigos potenciales y aliados que desearían someterte. ¿Seguirás solo o aceptarás un nuevo yugo y jurarás lealtad a un nuevo señor?" 
 podintroductions.224.a: "¿A quién el Trueno ha engrandecido? Aquí al menos, Seremos libres"
 podintroductions.224.a.tt: "Permaneciendo independiente, consolidas tu control sobre la propiedad de [destroyed_tremere_master.GetFullNamePossessive], incluida una bandada sustancial de murciélagos navaja."
 podintroductions.224.b: "Jurar vasallaje a Razkoljna, por un precio"
 podintroductions.224.b.tt: "Razkoljna ve las cosas de manera diferente a otros demonios. Aunque autocrática, cumplirá cualquier juramento hecho. Acércate a su forma de pensar y se puede llegar a un acuerdo. Acepta a Ventrue, Gangrel y Zadruga en su reino. Puede ofrecer la mejor esperanza de liberarse de la Guerra del Presagio entre los Tzimisce y los Tremere."
 podintroductions.224.c: "Buscar refugio en la Catedral de Carne"
 podintroductions.224.c.tt: "Yorak es sin duda el más poderoso de los Tzimisce en la región, aunque su mentalidad es alienígena. Puede bañarte en sangre y ayudarte a desbloquear el poder de tu linaje Tzimisce. Seguramente exigirá un juramento de sangre."
 podintroductions.224.d: "Ayudar a las ambiciones del Desollador"
 podintroductions.224.d.tt: "El más débil de los Voivodas cercanos, a Velya no le falta ambición. También es un consumado Hechicero Koldúnico. Pragmático, intercambiará magia y su protección a cambio de un juramento de vasallaje. Ser el vasallo fuerte de un señor débil, puede ser mejor que ser el señor más débil." 
 podintroductions.224.e: "Regresar a los Amos"
 podintroductions.224.e.tt: "Reclamar inocencia en la destrucción de mi amo, y apelar directamente al Regente de los Tremere, Etrius, en busca de ayuda. Si bien seguramente exigirá un juramento y el regreso al servicio, puede permitir cierta autonomía limitada como 'experimento'."
 podintroductions.224.f: "¡Madre! ¡Madre nos ayudará!"
 podintroductions.224.f.tt: "La Gran Madre de todas las Gárgolas, Virstania, ama a todas las creaciones de su magia. Ve hacia ella y muestra tu lealtad, ayúdala en sus maquinaciones políticas en Ungvar, y ella recompensará a su 'hijo de espíritu libre' con un séquito de Exploradores Gárgolas."
 podintroductions.224.g: "Tomar lo que puedas y huir de la posible ira de los Tremere"
 podintroductions.224.g.tt: "Libre de las ataduras del gobierno y temiendo la ira de tus antiguos amos, quizás encuentres paz en la solidaridad en otro lugar o incluso regreses un día para traer libertad a tus compañeros gárgolas."
 podintroductions.rocklord: "Como Rocklord, puedes tener un papel fundamental en el destino de las Gárgolas."
 end_intro_tooltip: "No recibirás información adicional"
 POD_rocklord_razorbat_flock: "Bandada de Murciélagos Navaja de Rocklord"
 POD_rocklord_retinue: "Séquito de Rocklord"

 ###############
 # Splat Intro #
 ###############

 podintroductions.2001.b: "...u otros conceptos alterados" 
 podintroductions.2001.c: "El mundo y su lore" 
