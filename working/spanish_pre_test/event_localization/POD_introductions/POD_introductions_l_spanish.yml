 podintroductions.6001.t: "Cazador Sobrenatural" 
 podintroductions.6001.desc: "Has elegido rasgos tanto sobrenaturales como de cazador en el diseñador de gobernantes, esto es incompatible a menos que seas un Sanbenito." 
 podintroductions.6001.a: "Quiero ser un Sanbenito" 
 podintroductions.6001.b: "Quiero ser un sobrenatural" 
 podintroductions.6001.c: "Quiero ser un cazador" 

 podintroductions.6002.t: "Trasfondo y Primer Plano" 
 podintroductions.6002.desc: "¿Quieres elegir un vampiro en el mapa para tener un [Glossary('Sire','game_concept_Sire_desc')] conocido como parte de tu trasfondo de personaje, o prefieres comenzar sin un linaje claro?" 
 podintroductions.6002.a: "Quiero elegir con quién estoy relacionado."
 podintroductions.6002.option.a.t: "Usando un [character_interaction|E] en cualquier otro personaje vivo, podrás seleccionar un personaje con el que estar relacionado."
 podintroductions.6002.option.a.unavailable: "Ya usaste el Generador de Personajes para elegir a tu padre."
 podintroductions.6002.b: "Quiero convertirme en otro tipo de sobrenatural."
 podintroductions.6002.option.b.t: "¿Quieres convertirte en un demonio? No, el demonio se convierte en ti." 
 podintroductions.6002.c: "El linaje desconocido está bien."

 podintroductions.6003.t: "Trasfondo y Primer Plano" 
 podintroductions.6003.desc: "¿Quieres elegir a un [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] en el mapa para tener un Sifu inicial (una figura de mentor, representada como padre en términos de juego) como parte de tu trasfondo de personaje o prefieres unirte a uno más tarde durante el juego?" 
 podintroductions.6003.a: "Quiero elegir a mi Sifu inicial."
 podintroductions.6003.b: "Me uniré a un [Glossary('Wu','podgloss.wu')] durante el juego."
 podintroductions.6003.c: "Quiero comenzar como un Heimin."

 podintroductions.6004.t: "Trasfondo y Primer Plano" 
 podintroductions.6004.desc: "¿Quieres elegir a un [ghoul|E]/[Glossary('Revenant','game_concept_revenant_desc')] en el mapa para tener como padres como parte de tu trasfondo de personaje? ¿Quieres ser parte de una organización ahora, más tarde durante el juego o nunca?" 
 podintroductions.6004.a: "Quiero elegir a mis padres."
 podintroductions.6004.b: "Quiero unirme a los Abandonados."
 podintroductions.6004.option.b.t: "Puedes unirte a los Abandonados, una facción de ghouls sin amo, centrada principalmente en cazar vampiros." 
 podintroductions.6004.c: "Quiero convertirme en otro tipo de sobrenatural."
 podintroductions.6004.option.c.t: "Puedes convertirte en un ghoul sin amo o en el vástago de un vampiro." 
 podintroductions.6004.d: "No necesito eso."

 podintroductions.6005.t: "Trasfondo y Primer Plano" 
 podintroductions.6005.desc: "¿Quieres elegir a un Cazador en el mapa para tener padres como parte de tu trasfondo de personaje? ¿Quieres ser parte de una organización ahora, más tarde durante el juego o nunca?" 
 podintroductions.6005.a: "Quiero elegir a mis padres."
 podintroductions.6005.b: "Quiero unirme a una Célula."
 podintroductions.6005.option.b.t: "Puedes unirte a la inquisición, o convertirte en [GetTrait('shih').GetName( GetPlayer )] si estás en la parte oriental del mapa."
 podintroductions.6005.c: "Quiero convertirme en un sobrenatural."
 podintroductions.6005.option.c.t: "Puedes convertirte en un [GetTrait('cabiri').GetName( GetPlayer )], un cambiaformas, un ghoul sin amo o caer en la oscuridad (convertirte en un [GetTrait('vampire').GetName( GetPlayer )])." 
 podintroductions.6005.d: "No necesito eso."

 podintroductions.6006.t: "Trasfondo y Primer Plano" 
 podintroductions.6006.desc: "¿Quieres elegir a un personaje en el mapa para que sea parte de tu trasfondo de personaje? ¿Quieres ser parte de una organización ahora, más tarde durante el juego o nunca?" 
 podintroductions.6006.a: "Quiero elegir a mis padres."
 podintroductions.6006.b: "Quiero convertirme en otro tipo de sobrenatural."
 podintroductions.6006.option.b.t: "Puedes convertirte en un ghoul sin amo o convertirte en el vástago de un vampiro."
 podintroductions.6006.c: "No necesito eso."

 podintroductions.6007.t: "Trasfondo" 
 podintroductions.6007.desc: "¿Quieres comenzar con un linaje mortal como parte de tu trasfondo de personaje, o prefieres comenzar sin un linaje claro?" 
 podintroductions.6007.a: "Tengo una familia en las [Glossary('Tierras de Piel','game_concept_skinlands_desc')]."
 podintroductions.6007.c: "No necesito eso."

 podintroductions.6010.t: "Tu Edad Real" 
 podintroductions.6010.desc: "Puedes establecer tu edad real aquí. Esto no cambiará tu apariencia inmortal."
 podintroductions.6010.a: "He terminado de establecer mi edad."
 podintroductions.6010.widget: "Edad Real: [Character.GetAge]"
 podintroductions.6010.reset: "Restablecer a [EventWindowWidget.GetScope.GetValue('original_age')]"

 podintroductions.7000.t: "Modo Roguelike"
 podintroductions.7000.desc: "Dado que has seleccionado [roguelike_mode|E], estás a punto de ser cambiado a un gobernante aleatorio de una provincia.\n\n¿Quieres restringir esta selección aleatoria a personajes inmortales, o abrirla a cualquiera?\n\nTen en cuenta que el juego terminará si tu gobernante muere."
 podintroductions.7000.desc.randomizer: "Dado que has seleccionado [roguelike_mode|E], estás a punto de ser cambiado a un gobernante generado aleatoriamente."
 podintroductions.7000.a: "Solo gobernantes inmortales (predeterminado)"
 podintroductions.7000.b: "Cualquier gobernante"
 podintroductions.7000.c: "Seguir jugando como [GetPlayer.GetFirstNameNoTooltip]"
 podintroductions.7000.d: "Hora de tirar los dados..."

 podintroductions.7001.t: "Maldito" 
 podintroductions.7001.desc: "Ahora estás jugando como [GetPlayer.GetName].\n\n[GetPlayer.GetSheHe|U] está a punto de pasar un mal momento. ¿Qué maldición debería recibir [GetPlayer.GetSheHe]?" 
 podintroductions.7001.a: "Una maldición aleatoria"
 podintroductions.7001.b: "Todas ellas"
 podintroductions.7001.c: "[GetModifier('POD_roguelike_no_wealth').GetNameWithTooltip]"
 podintroductions.7001.d: "[GetModifier('POD_roguelike_no_love').GetNameWithTooltip]"
 podintroductions.7001.e: "[GetModifier('POD_roguelike_no_rest').GetNameWithTooltip]"
 podintroductions.7001.f: "[GetModifier('POD_roguelike_no_belongings').GetNameWithTooltip]"
 podintroductions.7001.g: "[GetModifier('POD_roguelike_no_curiosity').GetNameWithTooltip]"
 podintroductions.7001.h: "[GetModifier('POD_roguelike_no_guile').GetNameWithTooltip]"
 podintroductions.7001.i: "[GetModifier('POD_roguelike_no_demands').GetNameWithTooltip]"
 podintroductions.7001.tt: "Completar cualquier objetivo importante eliminará todas las maldiciones."
 podintroductions.7001.nocurses: "Cambié de opinión. Sin maldiciones, por favor"
 podintroductions.7001.nocurses.tt: "Continuarás jugando como [GetPlayer.GetName], pero sin maldiciones ni otras mecánicas de [roguelike_mode|E]."

 podintroductions.317.desc: "Un culto disperso en el mejor de los casos, los Lazaritas creen en la sabiduría y divinidad del Cappadocio Lázaro y estudian los secretos de la vida y la muerte como un medio para emularlo y servirlo. Constancia, la suma sacerdotisa Cappadocia en Erciyes, los considera herejes por no haber Lázaro atendido la voluntad de su sire, Cappadocius, y por su creencia en la resurrección.\nCuando Cappadocius reunió a sus vástagos para lo que se conoció como la Fiesta de la Locura, Lázaro no respondió a la llamada. Cuando lo encontró, su hermano de sangre Caias descubrió que su antiguo hermano desafiaba la voluntad de Cappadocius y lo atacó por su insolencia. Aunque victorioso, Lázaro decidió retirarse aún más del mundo.\nRecientemente, se difunden rumores de que ha sido atacado una vez más por los Cappadocios (específicamente Constancia) y cayó en $pod_torpor$. En su ausencia, es su mano derecha Angelique quien maneja el culto."
 podintroductions.317.a: "Perseguidos por conocer la verdad."
 podintroductions.318.desc: "Octavio nació en las tierras ahora llamadas Hungría cuando las legiones de Roma construyeron Aquincum. De mortal, era un chamán que de alguna manera tocó el corazón oscuro de Kupala y se llenó de locura. Tomó el nombre de Octavio porque cree firmemente que ocho presagios anunciarán el despertar de Kupala y el ascenso del demonio sobre el mundo. Vuelto aún más loco por los siglos pasados dentro de la tierra contaminada de su tierra natal, captura mortales (y cualquier Cainita que puede) y juega elaborados juegos con ellos. Luego los sacrifica a Kupala (ya sea para ayudar al demonio o para atarlo, ni siquiera Octavio lo sabe).\nEstá tramando un plan para obtener la apoteosis. De esta manera, espera obtener suficiente poder para oponerse directamente a Kupala. Busca la adulación mortal, creando un culto a su alrededor. Los que adoran a Octavio lo llaman Havnor, creyendo que es un antiguo dios magiar. Le importan poco los títulos de respeto que le dan, siempre que compartan su sangre y le rindan homenaje. Planea moverse contra el Príncipe Vencel, o quizás a su favor. Rara vez puede recordar exactamente cuáles son sus planes estas noches, cuando su cabeza arde de profecías.\nOctavio escucha la voz del demonio dentro de su cabeza. Sabe que algún día se levantará para reclamar el dominio sobre la Tierra. Ocho grandes señales presagian el despertar de Kupala y Octavio les dice a otros cuáles son esas señales. Mientras tanto, ha decidido convertirse en un dios para poder luchar contra Kupala, e intenta convencer a otros, a través de milagros sagrados, de que él es verdaderamente divino."
 podintroductions.318.a: "¡Adórame! ¡Os protegeré a todos!"
 podintroductions.319.desc: "Los Apóstoles del Tercer Caín son una rama de la Herejía Cainita que se separó de la Sede de Nod alrededor del año 1000. Sus líderes creían que Narsés de Venecia, entonces Arzobispo de Nod, estaba demasiado preocupado por los asuntos temporales y no lo suficiente por las necesidades espirituales de su rebaño. Como varias de las órdenes monásticas católicas mortales, los Apóstoles son un movimiento reformador dentro de su fe. Esperan que sus formas austeras y sencillas puedan inspirar a otros Herejes a abandonar la indolente Sede de Nod y unirse a ellos para preparar el camino para la venida del Mesías vampírico.\nLa rama portuguesa de este grupo, liderada por la Cainita asturiana Balesquida, creía que el Rey Sancho de Portugal era el Tercer Caín. Su muerte en 1211 fue un duro golpe para ellos, aunque algunos de los seguidores de Balesquida se preguntan abiertamente si la muerte del rey es solo una artimaña para allanar el camino para su eventual regreso en gloria. El hecho de que no conozcan a ningún Cainita que haya Abrazado a Sancho solo fortalece su creencia.\nEste celo, combinado con el actual colapso de la iglesia principal de Caín, ha convertido a los Apóstoles en una facción sorprendentemente poderosa en la política nocturna portuguesa últimamente."
 podintroductions.319.a: "Su noche llegará."

 podintroductions.500.desc: "Los muchos judíos dispersos a los cuatro vientos esperan el día en que venga el Mesías ben Dawid. Liderando un gran ejército, reclamará la Tierra Prometida para que podamos regresar a casa de nuestro largo exilio. Asumiendo el manto de Dawid, será nuestro rey, y nosotros Jueces sus protectores contra la noche.\nMientras otros miran al futuro, muchos de los nuestros miran al pasado. Primero Salomón y luego su hijo, Menahem, buscaron liberar a nuestro pueblo aquí en Amadiya. Para nuestra gran tristeza, Salomón cayó en batalla mientras que Menahem fue abatido por la traición, dejándonos a nosotros tomar su legado. Sin embargo, hay debate entre nosotros sobre la naturaleza de ese legado. Algunos dicen que Salomón reclamó el título de Mesías mientras que otros señalan a Menahem. Otros aún dicen que el Mesías está entre nosotros hoy o está por venir.\nAquellos dentro de la noche usan este debate teológico para dividirnos, para volvernos unos contra otros, como lo han hecho a lo largo de la historia. Si queremos rechazar la noche, debemos estar unificados detrás de un solo legado, una sola visión del futuro.\nCon la muerte de tu mentor, Zeviel, durante una cacería reciente y tu ascenso a nuestra líder, es el momento adecuado para resolver este asunto. Reza a Adonai para que tomes la decisión correcta respecto a Su ungido."
 podintroductions.500.a: "Salomón fue el Mesías ben Dawid"
 podintroductions.500.b: "Menahem fue el Mesías ben Dawid"
 podintroductions.500.c: "¡Yo soy el verdadero Mesías ben Dawid!"
 podintroductions.500.d: "El Mesías ben Dawid está por venir"
 house_menahemites_shlomo_modifier: "El Legado de Salomón"
 house_menahemites_shlomo_modifier_desc: "A pesar de cómo algunos puedan leer las profecías, Salomón fue verdaderamente el Hijo de Dawid. Aunque no haya asumido completamente el manto de Dawid en su tiempo, cumplirá su destino a través de nosotros. Nos unió y ahora lograremos su objetivo. Estamos unidos, listos para reclamar nuestro hogar cuando llegue el momento."
 house_menahemites_menahem_modifier: "El Legado de Menahem"
 house_menahemites_menahem_modifier_desc: "A pesar de cómo algunos puedan leer las profecías, Menahem fue verdaderamente el Hijo de Dawid. Aunque no haya asumido completamente el manto de Dawid en su tiempo, cumplirá su destino a través de nosotros. Nos enseñó a reconocer y luchar contra nuestros verdaderos enemigos. Estamos empoderados, listos para rechazar la noche."
 house_menahemites_elior_modifier: "El Legado de Elior"
 house_menahemites_elior_modifier_desc: "Los detractores tenían razón en que Salomón y Menahem no eran el Mesías ben Dawid prometido. Aunque no hayan sido Mesías, unificaron a nuestro pueblo y permitieron que el verdadero Mesías, Elior, surgiera. Nació el día de la muerte de Gid'on; es el portador del manto de Dawid; su legado nos guiará hacia adelante. Estamos fuertes, listos para luchar."
 house_menahemites_future_modifier: "Anticipación Profética"
 house_menahemites_future_modifier_desc: "El Mesías ben Dawid vendrá un día. Asumirá el manto de Dawid para expulsar a nuestros enemigos, llamar a casa a nuestro pueblo disperso y guiarnos hacia una nueva Era. Apresuraremos su camino y nos opondremos a todas las amenazas que la noche pueda lanzarnos. Estamos firmes, con las espadas en alto para el que está por venir."

 podintroductions.357.t: "El Caballero Perfecto"
 podintroductions.357.desc: "Godewin el Engañoso, eres la imagen misma de la caballería para los Kindred de Francia. Te conduces con la gracia de los antiguos reyes merovingios de quienes afirmas descender, mientras planeas la Gran Tragedia en secreto. Tu engaño ha sido hasta ahora muy exitoso, con la propia Salianna afirmando que eres el 'único verdadero caballero vampiro en Francia'.\n\nMientras que los ojos de otros pueden ver la podredumbre debajo de tu brillante armadura, has hecho bien en cegar a los poderes más grandes de la región, Salianna y Geoffrey du'Temple. Creen que eres un paradigma de la virtud. Será divertido destrozarlos."
 podintroductions.357.a: "La Gran Tragedia necesita un gran protagonista."
 
 podintroductions.358.t: "La Carga de un Artista"
 podintroductions.358.desc: "Barón Volgirre, estás rodeado de necios. Los sicofantes y los corazones sangrantes que rodean tu dominio miran tus exquisitas obras, las hermosas pinturas sobre carne y la melodía que emana de las gargantas cortadas de tus musas, y las llaman 'monstruosas'. Su falta de arte amenaza tu control sobre tus tierras.\n\nPor molesto que sea, no se les puede ignorar. Como uno que gobierna más abiertamente sobre los mortales locales, tus arcas son más ricas que la mayoría, pero eso por sí solo no puede mantenerte protegido.\n\nTu señora, Isouda de Blaise, es una mujer de crueldad encomiable. Aunque todavía es demasiado blanda de corazón para tus elevados gustos, muestra una promesa innegable. Un regalo generoso de tus bóvedas podría comprarte su protección y amistad, o podrías aferrarte a él y mantenerte a salvo confiando solo en tu ingenio."
 podintroductions.358.a: "Isouda apreciará mi patrocinio."
 podintroductions.358.b: "¡Solo necesito mi propia brillantez!"
 volgirre_intro_tooltip: "Formarás una alianza con tu señora."
 
 podintroductions.359.t: "El Hombre Roto"
 podintroductions.359.desc: "Ishbara el Diligente, has mantenido el Erk a salvo durante muchos siglos vacíos. Elegido sabiamente por la Loba Dorada, construiste una base sólida para tu pueblo. Sin embargo, ninguna cantidad de trabajo duro borrará tu mayor error.\n\nCada vez que sientes la suave brisa en tu piel, sientes el frío escalofrío de esas espadas que convocaste esa noche. Ves a Ay-Toldı, tu amado Vástago, convertido en cenizas por tus propias manos.\n\nLa corte se siente tan fría ahora. La única razón por la que sigues cumpliendo con tus deberes es simple. Rezas para que cuando tu Sire despierte de su largo sueño, te declare culpable y te conceda la muerte que anhelas. No mereces esa paz, pero la anhelas de todos modos."
 podintroductions.359.a: "Un gobierno justo no puede borrar mi pecado."
 
 podintroductions.360.t: "El Cuervo Negro"
 podintroductions.360.desc: "Yidu el Ambicioso, durante cincuenta y dos años mortales interpretaste al perro perfecto y servil para tus amos orientales. Viste a tu pueblo sangrar como tropas prescindibles para la dinastía Tang, soportaste el desprecio de los hombres que te veían como nada más que un bárbaro. Aprendiste que los catayos nunca entenderán la misericordia o la paz. Solo el poder los hará inclinarse ante ti.\n\nIshbara esperaba templar el fuego dentro de ti en un servicio obediente, el necio. Te niegas a permitir que tu pueblo, los Erk, continúe como perros falderos de los Anda. No mientras Oriente esté listo para ser conquistado. Junto con tu leal vástago, Chixin, has reunido a los restos de tu pueblo oprimido en una fuerza formidable: los Cuervos Negros. Forjados en la misma llama del resentimiento, están ansiosos por contraatacar. ¿Quién eres tú para negarles la venganza?"
 podintroductions.360.a: "Solo entienden una bota en el cuello."
 yidu_intro_tooltip: "Tienes acceso a los soldados especiales Cuervos Negros."