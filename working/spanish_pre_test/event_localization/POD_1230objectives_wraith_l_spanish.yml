l_spanish:
 pod1230objectives_wraith.1.t: "Trascendencia"
 pod1230objectives_wraith.1.desc: "La Trascendencia consiste fundamentalmente en aceptar la propia muerte. Históricamente, los Barqueros, las Tierras Lejanas y la Jerarquía fueron concebidos como mecanismos para lograr la Trascendencia. El mandato de Caronte de parte de la Dama del Destino era ayudar a las almas que terminaban en el Inframundo a alcanzar la Trascendencia y seguir adelante.\nLa Trascendencia consiste fundamentalmente en aceptar la propia muerte. Las cosas que mantienen a un wraith ligado al inframundo, las Pasiones y los Grilletes, deben ser Resueltas. Una vez que todo esté resuelto, el wraith debe buscar alguna forma de armonía con su Sombra."
 pod1230objectives_wraith.1.a: "Libertad"
 death_transcendence: "Este personaje trascendió más allá de la muerte para ser finalmente libre"

 pod1230objectives_wraith.2.t: "De vuelta de entre los muertos"
 pod1230objectives_wraith.2.desc: "Risen es un término utilizado para describir a un wraith que ha logrado regresar a su cuerpo para caminar entre los vivos en las Tierras de la Piel. A falta de un término mejor, los Risen son casi zombis, aunque sin el andar lento, la carne en descomposición o la necesidad de comer cerebros. Convertirse en un Risen es uno de los secretos mejor guardados de las Tierras de las Sombras; sin embargo, con ayuda, se puede lograr.\nPara cualquier wraith que quiera volver a las tierras de los vivos, esta es probablemente la posibilidad más sensata, aunque no exenta de inconvenientes y desafíos."
 pod1230objectives_wraith.2.a: "Vivo de nuevo."
 pod1230objectives_wraith.2.a.tt: "Volverás a la vida, como si nada de lo ocurrido desde tu muerte hubiera pasado."
 pod1230objectives_wraith.2.b: "Estado de Risen"
 
 pod1230objectives_wraith.3.t: "Manto salvaguardado"
 pod1230objectives_wraith.3.desc: "Los Giovanni han sido eliminados, su plan para destruir el Manto ya no existe. Sus cenizas sirven de advertencia a cualquier ser vivo o muerto que intente violar la santidad de Estigia. Sin embargo, tu trabajo como ejecutor de la Jerarquía nunca se detiene. Siempre habrá necios que violen el Dictum Mortuum y tú siempre estarás allí para hacer que se arrepientan."
 pod1230objectives_wraith.3.a: "El Manto está bajo mi protección."
 the_enforcer_of_dictum_mortuum: "El Ejecutor del Dictum Mortuum"
 the_enforcer_of_dictum_mortuum_desc: "Podrás usar edificios de wraith"
 
 pod1230objectives_wraith.4.t: "El fin del Dictum Mortuum"
 pod1230objectives_wraith.4.desc: "Caronte se ha rendido y el Dictum Mortuum ya no existe; ahora puedes interactuar con cualquier Vivo a tu antojo."
 pod1230objectives_wraith.4.a: "Arreglemos este desastre"
 pod1230objectives_wraith.4.b: "Quémenlo todo"
 pod1230objectives_wraith.4.c: "¡Yo soy el nuevo Emperador!"
 the_gravedigger_of_dictum_mortuum: "El Sepulturero del Dictum Mortuum"