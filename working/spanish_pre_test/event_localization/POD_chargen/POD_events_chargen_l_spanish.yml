 POD_chargen.2300.t: "Costa Lejana"
 POD_chargen.2300.desc: "Hay muchas [UmbraGlossaryLocalized('far_shore','Costas Lejanas')] dirigidas por Seres Brillantes caídos, o por locos que vieron a los caídos y pensaron que tenían algo bueno. La más notoria de estas, el Paraíso de los Pescadores, es una visión cristiana primitiva del Cielo que todos los demás ven como una puerta de entrada al Infierno."
