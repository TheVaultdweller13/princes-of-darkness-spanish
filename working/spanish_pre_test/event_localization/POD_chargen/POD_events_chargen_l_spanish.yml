 POD_chargen.1010.t: "¿Presa?"
 POD_chargen.1010.desc: "¿Cuál es tu presa?\nLos tipos de depredador representan la preferencia habitual de cada vampiro sobre cómo y cuándo se alimentan, aunque no los ata exclusivamente a estas formas. La gran mayoría caza mortales, pero unos pocos prefieren la sangre animal y aún menos (en su mayoría muy viejos) cazan a otros vampiros en su lugar."
 POD_chargen.1010.option.a: "Animales"
 POD_chargen.1010.option.a.tt: "Intento cazar solo animales, no personas."
 POD_chargen.1010.option.b: "Humanos"
 POD_chargen.1010.option.b.tt: "Yo, los mortales."
 POD_chargen.1010.option.c: "Vampiros"
 POD_chargen.1010.option.c.tt: "Cazo a los cazadores."

 POD_chargen.1020.t: "Inclinación Depredadora"
 POD_chargen.1020.desc: "¿Qué atributos utilizas para la caza?\nEsta elección representa los hábitos de caza de cada vampiro. Dos vampiros idénticos con diferentes hábitos de caza tienden a ser sutilmente diferentes, principalmente en sus afinidades de poder o alguna otra pequeña variación."
 POD_chargen.1020.option.a: "Violencia"
 POD_chargen.1020.option.b: "Encanto"
 POD_chargen.1020.option.c: "Engaño"
 POD_chargen.1020.option.d: "Conocimiento"
 POD_chargen.1020.option.e: "Quizás evito cazar humanos..."

 POD_chargen.1030.t: "Labios Dulces y Lenguas de Plata"
 POD_chargen.1030.desc: "[GetTrait('predatortype_siren').GetName(GetNullCharacter)] - Un vampiro que seduce a sus amantes para drenar su sangre a través del beso.\n\n[GetTrait('predatortype_gentry').GetName(GetNullCharacter)] - Un vampiro que tiene una posición de estatus en la sociedad mortal. Usa ese estatus para cazar a los ricos y poderosos.\n\n[GetTrait('predatortype_cultist').GetName(GetNullCharacter)] - Un vampiro que lidera un culto de sangre, como en la antigüedad. Los mortales adoran y se ofrecen voluntariamente a este dios de la sangre.\n\n[GetTrait('predatortype_consensualist').GetName(GetNullCharacter)] - Un vampiro que se alimenta de los que están dispuestos."
 POD_chargen.1030.option.a: "Sirena"
 POD_chargen.1030.option.b: "Nobleza"
 #POD_chargen.1030.option.b.herd: "Un noble menor se une a tu corte como rebaño."
 POD_chargen.1030.option.c: "Cultista"
 POD_chargen.1030.option.c.herd: "Un miembro de tu culto se unirá a ti como [POD_herd|E]."
 POD_chargen.1030.option.c.tt: "Los Cultistas nunca pueden reducir su Exposición de la Mascarada por debajo de sospechoso."   
 POD_chargen.1030.option.d: "Consensualista"
 POD_chargen.1030.option.d.tt: "Los Consensualistas nunca pueden reducir su Exposición de la Mascarada por debajo de sospechoso."   
 POD_chargen.1030.option.e: "Creo que tengo un enfoque diferente..."

 POD_chargen.1040.t: "Dime Mentiras"
 POD_chargen.1040.desc: "[GetTrait('predatortype_cauchemar').GetName(GetNullCharacter)] - Un vampiro que se alimenta principalmente de presas dormidas.\n\n[GetTrait('predatortype_familias').GetName(GetNullCharacter)] - Un vampiro que se alimenta casi exclusivamente de una dinastía familiar en particular. Puede incluso estar relacionado con la familia, al menos eso es lo que la familia piensa.\n\n[GetTrait('predatortype_footpad').GetName(GetNullCharacter)] - Un vampiro que se junta con los bajos fondos de la sociedad, tomando la sangre de los empobrecidos. Si desaparecen, las autoridades no muestran interés."
 POD_chargen.1040.option.a: "Pesadilla"
 POD_chargen.1040.option.b: "Familias" 
 POD_chargen.1040.option.b.herd: "La familia se une a tu [POD_herd|E]."
 POD_chargen.1040.option.b.tt: "Familias nunca puede reducir su Exposición de la Mascarada por debajo de sospechoso."  
 POD_chargen.1040.option.c: "Salteador"
 POD_chargen.1040.option.d: "Creo que tengo un enfoque diferente..."

 POD_chargen.1050.t: "Lo que necesitas entender es..."
 POD_chargen.1050.desc: "[GetTrait('predatortype_cenobite').GetName(GetNullCharacter)] - Un vampiro que tiene un [POD_herd|E] en una institución religiosa como un monasterio.\n\n[GetTrait('predatortype_phlebotomist').GetName(GetNullCharacter)] - Un vampiro que adquiere $pod_vitae$ bajo la apariencia de un médico realizando sangrías.\n\n[GetTrait('predatortype_graverobber').GetName(GetNullCharacter)] - Un vampiro que puede ser encontrado merodeando por cementerios y criptas en busca de cadáveres frescos o dolientes.\n\n[GetTrait('predatortype_bedlamite').GetName(GetNullCharacter)] - Un vampiro que se alimenta de los locos. Puede que también esté loco o no."
 POD_chargen.1050.option.a: "Cenobita"
 POD_chargen.1050.option.a.herd: "Un hombre de fe local se une a tu corte para que te alimentes."
 POD_chargen.1050.option.b: "Flebotomista"
 POD_chargen.1050.option.c: "Ladrón de Tumbas"
 POD_chargen.1050.option.d: "Bedlamita"
 POD_chargen.1050.option.d.herd: "Un loco se une a tu corte."
 POD_chargen.1050.option.e: "Creo que tengo un enfoque diferente..."

 POD_chargen.1060.t: "Inherente al Sistema"
 POD_chargen.1060.desc: "[GetTrait('predatortype_alleycat').GetName(GetNullCharacter)] - Un vampiro que acecha y ataca violentamente a los mortales para obtener la sangre. Es un enfoque vulgar.\n\n[GetTrait('predatortype_extortionist').GetName(GetNullCharacter)] - Un vampiro que obliga a sus víctimas a sangrar para él. Aparentemente, el extorsionista adquiere sangre a cambio de servicios como seguridad o vigilancia, pero tantas veces como la necesidad de protección es real, otras tantas es una ficción diseñada para hacer que el acuerdo parezca aceptable." 
 POD_chargen.1060.option.a: "Gato Callejero"
 POD_chargen.1060.option.b: "Extorsionista"
 POD_chargen.1060.option.c: "Creo que tengo un enfoque diferente..."

 POD_chargen.1100.t: "Exclusión de Presa"
 POD_chargen.1100.desc: "Debido a la [ventrue_clan_curse|E], tienes gustos exigentes y refinados, incluso cuando se trata de sangre. ¿Qué tipo de sangre buscas?\n#X ¡Esta elección afectará de qué tipo de personaje puedes alimentarte de manera segura sin incurrir en penalizaciones. Elige cuidadosamente!#!"
 POD_chargen.1100.option.flavor.easy: "#P Recomendado para nuevos jugadores.#!"
 POD_chargen.1100.option.flavor.hard: "@warning_icon! #N Esta es una restricción de alimentación difícil.#!"
 POD_chargen.1100.option.a: "Edad/Sexo/Ubicación"
 POD_chargen.1100.option.a.tt: "Eliges presa de cierta edad y género."
 POD_chargen.1100.option.b: "Entonces, ¿a qué te dedicas?" 
 POD_chargen.1100.option.b.tt: "Eliges presa de cierta profesión o educación."
 POD_chargen.1100.option.c: "¿Qué te gusta?" #Pecado
 POD_chargen.1100.option.c.tt: "Eliges presa con un cierto rasgo de personalidad que es considerado un pecado por la mayoría de los mortales."
 POD_chargen.1100.option.d: "¿Eres una buena persona?" #Virtud
 POD_chargen.1100.option.d.tt: "Eliges presa con una cierta personalidad que es considerada una virtud por la mayoría de los mortales."
 POD_chargen.1100.option.e: "¿Cómo te sientes hoy?" #Salud mental
 POD_chargen.1100.option.e.tt: "Eliges presa que está mentalmente perturbada."
 POD_chargen.1100.option.f: "Cuéntame más sobre ti y tu familia?" #Rasgos físicos
 POD_chargen.1100.option.f.tt: "Eliges presa con rasgos congénitos específicos."
 POD_chargen.1110.t: "Edad/Sexo/Ubicación"
 POD_chargen.1110.desc: "Solo la sangre de un género y una edad añeja en particular servirá."
