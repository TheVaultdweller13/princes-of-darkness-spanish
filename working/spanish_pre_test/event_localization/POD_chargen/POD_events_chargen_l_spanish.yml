 POD_chargen.610.t: "[Glossary('Disciplinas','game_concept_discipline_desc')]"
 POD_chargen.610.desc: "Los poderes de los vampiros se llaman [Glossary('Disciplinas','game_concept_discipline_desc')]. Diferentes clanes y linajes tienen diferentes $pod_discipline$ inherentes. Las [Glossary('Disciplinas','game_concept_discipline_desc')] proporcionan bonificaciones pasivas a los atributos, pero algunas también tienen poderes activos invocados a través de decisiones o planes. Invocar disciplinas probablemente aumentará el hambre de sangre. Ahora confirmarás tu conjunto de $pod_clan$ y $pod_discipline$."
