 POD_chargen.2100.t: "Legiones"
 POD_chargen.2100.desc: "Para los wraiths de Stygia, la Jerarquía es la sociedad y las ocho Legiones son la Jerarquía. Al morir, cada Wraith es incorporado a una de siete Legiones según las circunstancias de su muerte. Cada Legión tiene una sede (su Asiento) y está supervisada por un Señor de la Muerte."
