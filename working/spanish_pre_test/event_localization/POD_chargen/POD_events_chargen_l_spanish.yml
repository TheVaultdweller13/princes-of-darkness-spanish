 POD_chargen.1200.t: "Ghouls"
 POD_chargen.1200.desc: "Los [ghouls|EU] son mortales que han bebido $pod_vitae$ vampírica. La sangre actúa como una droga sobrenatural para los vivos, otorgando fuerza y vida eterna, pero también haciéndolos emocionalmente dependientes de su 'donante'. Los Vampiros a menudo maltratan a sus Ghouls, sabiendo que tienen una baza irresistible en esta dinámica.\n\nEs posible alimentarse de Vampiros sin quedar vinculado a ellos, aunque no hace falta decir que ningún $pod_cainite$ va a desprenderse de su sangre voluntariamente."
 POD_chargen.1200.a: "Quiero vincularme a un nuevo amo."
 POD_chargen.1200.a.tt: "Durante la próxima semana, podrás usar la [character_interaction|E] #V $POD_beg_for_vitae_interaction$#! gratis. Apunta a cualquier $POD_splat_vampire$ para convertirte en su [bound_ghoul|E]."
 POD_chargen.1200.a.tt2: "Los [bound_ghouls|E] tienen que completar [bound_ghoul_missions_with_icon|E] para su [Glossary('Domitor','game_concept_domitor_desc')] regularmente. Los sirvientes leales pueden eventualmente ganar el $pod_Embrace$ para convertirse ellos mismos en $POD_splat_vampire$. También es posible, aunque difícil, liberarse de tu amo para convertirte más tarde en un [masterless_ghoul|E]."
 POD_chargen.1200.b: "Seré mi propio amo."
 POD_chargen.1200.b.tt: "Te conviertes en un [masterless_ghoul|E]."
 POD_chargen.1200.b.tt2: "Los [masterless_ghouls|EU] no están sujetos a un [Glossary('Domitor','game_concept_domitor_desc')], pero luchan constantemente por alimentar su [ghoul_vitae_dependency|E]. No alimentarse resultará en la pérdida de sus poderes. Por supuesto, si estás realmente desesperado, siempre puedes rogarle a alguien para convertirte en un [bound_ghoul|E] después del hecho."
 POD_chargen.1200.c: "Me dedicaré a cazar a los chupasangres."
 POD_chargen.1200.c.tt: "Te unes a los [GetFaithByKey('calomenasforsaken').GetName] y te conviertes en un $POD_splat_hunter$ de $POD_splat_vampire_plural$."
 POD_chargen.1200.d: "Quizás no soy un ghoul..."
 
 POD_chargen.1300.t: "Revenants"
 POD_chargen.1300.desc: "Los esclavos de sangre consumieron la sangre de sus domitores vampiros, estos ghouls asumieron una parte del poder del kindred. Raramente, algunos de sus hijos nacieron con sangre de vampiro en sus venas. Con un mayor dominio de la sangre, son más poderosos que sus padres. Comúnmente llamados '[Glossary('Revenants','game_concept_revenant_desc')]', los vástagos [ghoul|E] del $pod_clan$ Tzimisce se llaman 'Zadruga'. ¿De qué línea de [Glossary('Revenants','game_concept_revenant_desc')] desciendes?"
 POD_chargen.1300.option.a: "Zadruga, los Vástagos de los Tzimisce"
 POD_chargen.1300.option.b: "Sirvientes de la Tal'mahe'Ra, la Mano Negra"
 POD_chargen.1300.option.c: "Siervos de sangre en Europa"
 POD_chargen.1300.option.d: "Algo más raro..."
 POD_chargen.1300.option.e: "Una dinastía independiente"
 POD_chargen.1300.option.f: "Quizás no soy un [Glossary('Revenant','game_concept_revenant_desc')]"
 
 POD_chargen.1310.t: "Zadruga"
 POD_chargen.1310.desc: "El Anciano difundió su sangre entre sus sirvientes mortales. Estos esclavos criaron a los primeros Zadruga. ¿Perteneces a uno de los linajes Zadruga más notables o a algo más oscuro?"
 POD_chargen.1310.option.a: "Obertus, antiguos eruditos reverenciados"
 POD_chargen.1310.option.b: "Grimaldi, agentes que manipulan la sociedad mortal"
 POD_chargen.1310.option.c: "Szantovich, reliquias decadentes y depravadas"
 POD_chargen.1310.option.d: "Bratovitch, maestros de perrerasreclusos y horripilantes"
 POD_chargen.1310.option.e: "Premsyl, nobles de Praga"
 POD_chargen.1310.option.f: "Una de las casas más pequeñas"
 POD_chargen.1310.option.g: "Lidero una nueva casa cadete"
 POD_chargen.1310.option.h: "Quizás no soy de los Zadruga en absoluto..."
 
 POD_chargen.1320.t: "Otros Zadruga"
 POD_chargen.1320.desc: "Algunas de las casas Zadruga menos conocidas:"
 POD_chargen.1320.option.a: "Vlaszy de la caballería de pesadilla"
 POD_chargen.1320.option.b: "Basarab, señores de Valaquia"
 POD_chargen.1320.option.c: "Danislav, los lobos 'domesticados'"
 POD_chargen.1320.option.d: "Khazi, sirvientes del Dios Blanco"
 POD_chargen.1320.option.e: "Narov, protectores de los caminos antiguos"
 POD_chargen.1320.option.f: "Rustovitchi, vástagos de Vladimir"
 POD_chargen.1320.option.g: "Ruthvenski, cuidadores del árbol del Anciano"
 POD_chargen.1320.option.h: "Slatikov, portadores de los elementos"
 POD_chargen.1320.option.i: "Lidero una nueva casa cadete"
 POD_chargen.1320.option.j: "Quizás soy de una casa Zadruga importante..."
 
 POD_chargen.1330.t: "Sirvientes de la Tal'maHe'Ra"
 POD_chargen.1330.desc: "La Manus Nigrum tiene familias de [Glossary('Revenant','game_concept_revenant_desc')] comprometidas con su servicio desde tiempos antiguos. ¿Qué dinastía sirve a la Mano Negra?"
 POD_chargen.1330.option.a: "Rafastio, Brujas del Valle del Po"
 POD_chargen.1330.option.b: "Enrathi, Esclavizadores etruscos de Chatterlings"
 POD_chargen.1330.option.c: "Marijava, el Verdadero Culto de la Muerte Thugee"
 POD_chargen.1330.option.d: "Lidero una casa cadete de los Rafastio"
 POD_chargen.1330.option.e: "Lidero una casa cadete de los Enrathi"
 POD_chargen.1330.option.f: "Lidero una casa cadete de los Marijava"
 POD_chargen.1330.option.g: "Lidero una dinastía independiente al servicio de la Mano Negra"
 POD_chargen.1330.option.h: "Quizás no sirvo a la Tal'maHe'Ra"
 
 POD_chargen.1340.t: "Revenant Europeo"
 POD_chargen.1340.desc: "Hay algunas familias de [Glossary('Revenant','game_concept_revenant_desc')] en Europa que no están bajo el control de los Demonios o la Manus Nigrum."
 POD_chargen.1340.option.a: "Dimitriou, comprometidos con Helena de Troya"
 POD_chargen.1340.option.b: "Rossellini, perseguidos por la visión de la muerte"
 POD_chargen.1340.option.c: "Keskinen, los sirvientes locos de Louhi"
 POD_chargen.1340.option.d: "Ducheski, traidores de los Zadruga"
 POD_chargen.1340.option.e: "Crassus, patricios latinos de los Lasombra"
 POD_chargen.1340.option.f: "Angustri, Elegidos por el Caos"
 POD_chargen.1340.option.g: "Gravenor, Horripilantes Jardineros"
 POD_chargen.1340.option.h: "Quizás soy de una dinastía [Glossary('Revenant','game_concept_revenant_desc')] diferente..."
 
 POD_chargen.1350.t: "Dinastías Revenant Oscuras"
 POD_chargen.1350.desc: "Los [Glossary('Revenants','game_concept_revenant_desc')] se encuentran en todo el mundo, potencialmente dondequiera que los vampiros hayan compartido su sangre con mortales para crear ghouls."
 POD_chargen.1350.option.a: "Bomkazi, los socios de los Impundulu"
 POD_chargen.1350.option.b: "Hermandad Kairouan creada por los Banu Haqim"
 POD_chargen.1350.option.c: "Sirvientes de Anushin-Rawan"
 POD_chargen.1350.option.d: "D'habi, esclavos malditos de los Baali"
 POD_chargen.1350.option.e: "Kurulas, jinetes de sangre del Khan"
 POD_chargen.1350.option.f: "Qarnaim, vástagos de Cartago"
 POD_chargen.1350.option.g: "Quizás soy de una dinastía [Glossary('Revenant','game_concept_revenant_desc')] diferente..."
 
 POD_chargen.1360.t: "Un Heredero de la Casa"
 POD_chargen.1360.desc: "¿Cuál es tu relación con el cabeza de familia actual?"
 POD_chargen.1360.option.a: "Soy un hijo del cabeza de familia"
 POD_chargen.1360.option.b: "Soy de la casa, pero soy un primo lejano"
 POD_chargen.1360.option.c: "Lidero una casa cadete"
 #POD_chargen.1360.option.d: "Lidero una dinastía independiente"
 
 POD_chargen.1370.t: "La Mascarada"
 POD_chargen.1370.desc: "El Silencio de la Sangre es mantener tu naturaleza sobrenatural en secreto para los mortales. Si los mortales saben que eres un monstruo, pueden intentar destruirte. Peor aún, otros sobrenaturales también pueden buscar tu destrucción para asegurar su propia supervivencia. Algunos sobrenaturales evitan el secreto y en su lugar se deleitan en el temor causado por revelar la naturaleza monstruosa. Usar poderes sobrenaturales abiertamente en público o dejar un rastro de cadáveres; todo esto corre el riesgo de aumentar la exposición de la mascarada de un [Glossary('Revenant','game_concept_revenant_desc')]."
 POD_chargen.1370.option.a: "Mi naturaleza sobrenatural está oculta." 
 
 POD_chargen.1380.t: "El Hambre"
 POD_chargen.1380.desc: "La Bestia tiene hambre. Los $POD_splat_vampire_plural$ sostienen su existencia inmortal a través de la sangre. La sangre también alimenta sus poderes sobrenaturales. Esa sangre aún fluye en las venas de los [Glossary('Revenants','game_concept_revenant_desc')]. Usar tus habilidades sobrenaturales como [Glossary('Disciplinas','game_concept_discipline_desc')] o la curación fantástica tiene la posibilidad de aumentar tu hambre de sangre. Cuanto más anhelo tiene un [Glossary('Revenant','game_concept_revenant_desc')] por la sangre de vampiro, más irracional, desesperado, violento y estresado se vuelve. Con el tiempo, los [Glossary('Revenants','game_concept_revenant_desc')] transforman parte de su sangre mortal en sangre vampírica... efectivamente canibalizándose a sí mismos. Los [Glossary('Revenants','game_concept_revenant_desc')] también pueden reducir su hambre bebiendo la sangre de vampiros."
 POD_chargen.1380.option.a: "¿Me atrevo a usar los poderes de mi don oscuro?"

 POD_chargen.1400.t: "Las Órdenes de la Inquisición"
 POD_chargen.1400.desc: "La Inquisición está dividida en órdenes, y cada una de ellas tiene varias características.\nLos Caballeros de Acre y Santiago son órdenes militares, que encuentran herederos mediante la ordenación de candidatos dignos. Están sujetos al celibato.\nLas Hermanas de San Juan son administradoras habilidosas, pero solo ordenan a mujeres. Como monjas, tampoco tienen una familia clásica.\nLos Oculi Dei, maestros espías de la Inquisición, también ordenan miembros, pero no están excluidos de tener una familia.\nLa Orden Roja, investigadores ocultistas, ordenan tanto a hombres como a mujeres.\nFinalmente, la casa noble von Murnau funciona como una familia medieval normal, pero cada miembro tiene la posibilidad de convertirse en cazador durante su edad adulta."
 POD_chargen.1400.option.a: "Los Caballeros de Acre"
 POD_chargen.1400.option.b: "La Espada de Santiago"
 POD_chargen.1400.option.c: "Las Hermanas de San Juan"
 POD_chargen.1400.option.d: "Los Oculi Dei"
 POD_chargen.1400.option.e: "La Orden Roja"
 POD_chargen.1400.option.f: "Los von Murnau"
 POD_chargen.1400.option.g: "Un aliado menos conocido de la Inquisición Sombría"
 POD_chargen.1400.option.h: "¿Qué tal un cazador que no sea de la Inquisición Sombría?"
 POD_chargen.1400.option.i: "Quizás no soy un cazador"
 
 POD_chargen.1410.t: "Nuevos aliados de la causa"
 POD_chargen.1410.desc: "La Inquisición Sombría es un esfuerzo conjunto de varios grupos y algunos aún tienen que demostrar su devoción. ¿Qué tipo de grupo lideras?"
 POD_chargen.1410.option.a: "Una familia iniciada"
 POD_chargen.1410.option.b: "Una orden mendicante"
 POD_chargen.1410.option.c: "Una orden de caballería"
 POD_chargen.1410.option.d: "Una orden contemplativa"
 POD_chargen.1410.option.e: "Quizás no soy un cazador"   
 
 POD_chargen.1500.t: "Cazadores Cazados"
 POD_chargen.1500.desc: "No todos los cazadores son parte de la Inquisición Sombría. Muchos mortales se enteran de los monstruos del mundo de tinieblas, y con coraje y determinación eligen luchar. Algunos cazadores fueron una vez miembros de la Inquisición Sombría, pero encontraron los requisitos de la Iglesia demasiado engorrosos y abandonaron las órdenes; pero continúan cazando a los no-muertos. No todos los cazadores que persiguen a los no vivientes lo hacen por razones nobles.\nEn 1230, ser un cazador que no pertenece a la Inquisición Sombría es una situación más difícil."
 POD_chargen.1500.option.a: "Un cazador independiente con verdadera fe"
 POD_chargen.1500.option.b: "Un cazador independiente sin verdadera fe"
 POD_chargen.1500.option.c: "Un [Glossary('Shih','game_concept_shih_desc')], los cazadores orientales"
 POD_chargen.1500.option.d: "Regresar a la Inquisición Sombría"
 POD_chargen.1500.option.e: "Quizás no soy un cazador"
