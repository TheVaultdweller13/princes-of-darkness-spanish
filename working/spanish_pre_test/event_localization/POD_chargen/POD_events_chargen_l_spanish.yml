 POD_chargen.2600.t: "Fera"
 POD_chargen.2600.desc: "Los $glossary_fera$, también llamados Cambiaformas o las Razas Cambiantes, son las razas de cambiaformas en el Mundo de Tinieblas. Entre las Razas Cambiantes, la mayoría tiene al menos una fuerte desconfianza hacia los Garou o Hombres Lobo, debido a sus acciones durante la Guerra de Rabia, donde libraron una guerra de exterminio contra las otras razas.\n¿A qué Raza Cambiante perteneces?"
 POD_chargen.2600.option.n: "Quizás no soy de los fera"

 POD_chargen.2610.t: "Raza"
 POD_chargen.2610.desc: "Los Hombres Lobo tienen dos razas, que representan lo que eran antes del Primer Cambio: homid (nacido humano) y lupus (nacido lobo). La mayoría de los otros $glossary_fera$ comparten al menos algunas de estas formas con los garou, aunque sus formas nacidas de bestia se conocen con otros nombres apropiados para la especie animal en la que nacieron."
 POD_chargen.2610.option.d: "Quizás no soy un hombre lobo"
 
 POD_chargen.2611.t: "Auspicio Lunar"
 POD_chargen.2611.desc: "Auspicio es el término para la fase de la Luna bajo la cual nació un Garou. Cada uno de ellos desempeña un papel específico en la sociedad de los hombres lobo. Los Ragabash son los tricksters y abogados del diablo, los Galliard son los narradores, los Ahroun son los guerreros, los Theurge son los místicos y finalmente los Philodox son los jueces."

 POD_chargen.2612.t: "Tribu"
 POD_chargen.2612.desc: "Las tribus son la unidad social más grande de los Garou. Los miembros de la tribu a menudo están unidos por linajes, tótems similares y estilos de vida."
 POD_chargen.2612.option.a: "Furia Negra"
 POD_chargen.2612.option.b: "Roedor de Huesos"
 POD_chargen.2612.option.c: "Hijo de Gaia"
 POD_chargen.2612.option.d: "Fianna"
 POD_chargen.2612.option.e: "Geto de Fenris"
 POD_chargen.2612.option.f: "Garrafa Roja"
 POD_chargen.2612.option.g: "Señor de la Sombra"
 POD_chargen.2612.option.h: "Caminante Silencioso"
 POD_chargen.2612.option.i: "Colmillo de Plata"
 POD_chargen.2612.option.j: "Mira Estrellas"
 POD_chargen.2612.option.k: "Guardián de Hombres"
 POD_chargen.2612.option.l: "Danzante de la Espiral Negra"


 POD_chargen.2620.t: "Raza"
 POD_chargen.2620.desc: "Los Bastet tienen dos Razas, que representan lo que eran antes del Primer Cambio: Homid (nacido humano) y Felino (nacido gato)."
 POD_chargen.2620.option.d: "Quizás no soy un Bastet"
 
 POD_chargen.2621.t: "Pryio"
 POD_chargen.2621.desc: "Los hombres gato no tienen Auspicios, en su lugar dependen de un Pryio (también conocido como 'Favor de la Luna') para determinar su lugar y cómo el gato aborda la vida y maneja los desafíos que se le presentan. Aunque a menudo se determina por la hora del día en que el Bastet logró su Primer Cambio, el Pryio puede cambiar si el Bastet experimenta un cambio de vida severo."




 POD_chargen.2630.t: "Corriente"
 POD_chargen.2630.desc: "Los Mokolé no tienen tribus, como muchos de sus hermanos menores entre los $glossary_fera$. Su Mnesis ha preservado un grado de unidad entre las nidadas aisladas.\n\nLas cuatro corrientes no son enemigas, pero tienen diferentes intereses; no son aliadas, pero tienen mucho en común. Cada una es una colección de linajes de Mnesis organizados en un área geográfica con sus Dones y ritos locales; cada una tiene un enfoque diferente para los problemas que enfrentan los Mokolé."
 POD_chargen.2630.option.e: "Quizás no soy un Mokolé"

 POD_chargen.2631.t: "Raza"
 POD_chargen.2631.desc: "Los Mokolé tienen dos Razas, que representan lo que eran antes del Primer Cambio: Homid (nacido humano) y Suchid (nacido lagarto)."

 POD_chargen.2632.t: "Auspicio Solar"
 POD_chargen.2632.desc: "Los Mokolé usan Auspicios Solares, sin embargo, estos auspicios difieren según la Corriente. Los Mokolé-mbembe y Gumagan usan los siete auspicios solares tradicionales que siguen la posición o condición del sol en el momento del nacimiento.\nLos Makara usan cuatro Auspicios Estacionales que también sirven como una especie de sistema de castas interno. Este sistema de castas es completamente incomprensible para los forasteros.\nLos Zhong Lung también usan cuatro Auspicios de Viento Estacionales. Cada uno de estos corresponde a una estación, un color y una dirección del viento.\nA pesar de sus diferentes nombres y métodos, todos los Mokolé coinciden en que, en esencia, todos son Auspicios Solares y su poder se deriva del sol."

 POD_chargen.2633.t: "Varna"
 POD_chargen.2633.desc: "La forma Suchid es la forma reptiliana de los Mokolé. Cada Corriente contiene formas específicas llamadas Varna que se asocian más comúnmente con esa corriente. Típicamente es la de un cocodrilo, caimán, monstruo de Gila o reptil grande similar. Debido a los tamaños, formas corporales y características muy diferentes de estos animales, cada uno tiene un uso diferente."
 POD_chargen.2633.option.a: "Champsa"
 POD_chargen.2633.option.b: "Karna"
 POD_chargen.2633.option.c: "Ora"
 POD_chargen.2633.option.d: "Gavial"
 POD_chargen.2633.option.e: "Makara"
 POD_chargen.2633.option.f: "Naja"
 POD_chargen.2633.option.g: "Lung"
 POD_chargen.2633.option.h: "Suchus"










 
 POD_chargen.2900.t: "Siete Pecados"
 POD_chargen.2900.desc: "Cada demonio tiene una obsesión difícilmente controlable con un pecado particular, y transmiten esta obsesión a sus seguidores."
 POD_chargen.2900.option.h: "Quizás no soy un Demonio."
 
 POD_chargen.3000.t: "Siete Casas"
 POD_chargen.3000.desc: "Las siete edades de la Creación engendraron las siete Casas Celestiales de ángeles, cada una creada para gobernar su propia faceta del cosmos. El fuego y el viento, la Tierra y las estrellas, los mares, las tierras salvajes, e incluso la vida misma era gobernada por una hueste de ángeles mandados por Dios.\n\nLa Casa dicta qué tipo de trabajo tenías en el Cielo antes de unirte a la Rebelión de Lucifer y qué tipo de [lore_lifestyle|E] tienes afinidad."
 POD_chargen.3000.option.a: "Asharu"
 POD_chargen.3000.option.a.tt: "Los Asharu tienen el [lore_lifestyle|E] del Portador de Vida."
 POD_chargen.3000.option.b: "Rabisu"
 POD_chargen.3000.option.b.tt: "Los Rabisu tienen el [lore_lifestyle|E] de los Vivos."
 POD_chargen.3000.option.c: "Halaku"
 POD_chargen.3000.option.c.tt: "Los Halaku tienen el [lore_lifestyle|E] de lo Etéreo."
 POD_chargen.3000.option.d: "Namaru"
 POD_chargen.3000.option.d.tt: "Los Namaru tienen el [lore_lifestyle|E] del Heraldo."
 POD_chargen.3000.option.e: "Lammasu"
 POD_chargen.3000.option.e.tt: "Los Lammasu tienen el [lore_lifestyle|E] de la Belleza."
 POD_chargen.3000.option.f: "Annunaki"
 POD_chargen.3000.option.f.tt: "Los Annunaki tienen el [lore_lifestyle|E] de la Creación."
 POD_chargen.3000.option.g: "Neberu"
 POD_chargen.3000.option.g.tt: "Los Neberu tienen el [lore_lifestyle|E] del Vidente."
 
 POD_chargen.3001.t: "Casa del Diseñador de Gobernantes"
 POD_chargen.3001.desc: "¿Quieres tener la Casa Fundadora como tu casa o mantener tu casa del Diseñador de Gobernantes como una rama cadete de ella?"
 POD_chargen.3001.option.a: "Mantener la Casa Fundadora."
 POD_chargen.3001.option.b: "Me gusta mi escudo diseñado."
 
 POD_chargen.3100.t: "Kith"
 POD_chargen.3100.desc: "Un kith es uno de varios tipos diferentes de kithain, análogo a los clanes y tribus de otras culturas sobrenaturales."
 POD_chargen.3100.option.f: "Quizás no soy un Fae."
 POD_chargen.3100.option.g: "Quizás no soy un Changeling."
 
 POD_chargen.3200.t: "Kithain"
 POD_chargen.3200.desc: "Los kiths kithain, los changelings de Europa y su esfera de influencia cultural, son los más numerosos y conocidos en todo el mundo."
 POD_chargen.3200.option.f: "Quizás no soy un Kithain."
 
 POD_chargen.3300.t: "Jinn"
 POD_chargen.3300.desc: "Los changelings de Oriente Medio usan Jinn principalmente como un término para sí mismos, aunque también se usa para los seres sobrenaturales que los Kithain llaman Pródigos."
 POD_chargen.3300.option.f: "Quizás no soy un Jinn."
 
 POD_chargen.3400.t: "Kith Africanos"
 POD_chargen.3400.desc: "Kiths indígenas de África."
 POD_chargen.3400.option.f: "Quizás no soy un Kith Africano."
 
 POD_chargen.3500.t: "Kwannon-jin"
 POD_chargen.3500.desc: "Kwannon-jin es el término preferido por los shinma orientales."
 POD_chargen.3500.option.f: "Quizás no soy un Kwannon-jin."
 
 POD_chargen.3600.t: "Phyla"
 POD_chargen.3600.desc: "Phyla es el término para los tipos de Inanimae."
 POD_chargen.3600.option.f: "Quizás no soy un Inanimae."
 
 POD_chargen.3700.t: "Cortes"
 POD_chargen.3700.desc: "Las Cortes son divisiones más grandes de las Hadas. Diferentes hadas en diferentes partes del mundo se dividen de manera diferente mientras usan el mismo término o uno análogo."
 
 POD_chargen.3800.t: "El Animal en Todos Nosotros"
 POD_chargen.3800.desc: "Lo que algunos llaman caos, otros llaman variedad o diversidad. Los Pooka vienen en todas las formas y tamaños. Mitad humanos y mitad animales, viven en cuerpos mortales como los otros kith, pero también pueden transformarse en las formas de sus animales particulares.\n\nLos Pooka tienen una habilidad que ningún otro kith tiene: pueden cambiar de forma incluso en su apariencia mortal. Cuando un pooka se transforma en su forma animal, lo hacen tan completamente que se convierte en ese animal tanto a los ojos mortales como a los ojos de las hadas. El poder implicado en esta habilidad desconcierta a muchos changelings que prefieren pensar en los pooka como inútiles, impotentes alborotadores. Los Pooka lo toman con calma."
  
 POD_charjoin.100.t: "¿Convertirte en vampiro?"
 POD_charjoin.100.desc: "¿Estás seguro de que quieres estar relacionado con [vampiresire.GetFirstName]?\n\nNo hay vuelta atrás desde las dos primeras opciones."
 POD_charjoin.100.option.a: "Quiero ser tu vástago."
 POD_charjoin.100.option.b: "Quizás solo quiero ser tu sirviente oscuro."
 POD_charjoin.100.option.c: "Cambié de opinión."
 POD_charjoin.100.option.c.t: "Te rindes, reconsiderando tu decisión."

 POD_charjoin.200.t: "Tu [Glossary('Sire','game_concept_Sire_desc')]"
 POD_charjoin.200.desc: "¿Estás seguro de que quieres estar relacionado con [vampiresire.GetFirstName]?\n\nNo hay vuelta atrás desde las tres primeras opciones."
 POD_charjoin.200.option.a: "Sí, ¡y [vampiresire.GetSheHe] es mi [Glossary('Sire','game_concept_Sire_desc')]!"
 POD_charjoin.200.option.b: "Sí, ¡y [vampiresire.GetSheHe] es mi [Glossary('Sire','game_concept_Sire_desc')]! Pero creé mi propio linaje."
 POD_charjoin.200.option.b.t: "Crearás una rama cadete en la dinastía [vampiresire.GetDynasty.GetBaseName] con la casa de tu diseñador de gobernantes."
 POD_charjoin.200.option.c: "Sí, pero [vampiresire.GetSheHe] no es mi [Glossary('Sire','game_concept_Sire_desc')]."
 POD_charjoin.200.option.c.t: "Podrás seleccionar cualquier generación al menos dos generaciones por debajo de [vampiresire.GetFirstName]."
 POD_charjoin.200.option.d: "Quiero volver atrás."
 POD_charjoin.200.option.d.t: "Podrás elegir otro personaje."
 POD_charjoin.200.option.e: "Sí, pero [vampiresire.GetSheHe] es mi Hermano/[vampiresire.Custom('SisterBrother')|U] de Sangre."
 POD_charjoin.200.option.e.t: "Crearás una rama cadete en la dinastía [vampiresire.GetDynasty.GetBaseName] con la casa de tu diseñador de gobernantes."

