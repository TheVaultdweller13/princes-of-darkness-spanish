 POD_chargen.830.t: "[Glossary('Dharma','podgloss.dharma')] de los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')]"
 POD_chargen.830.desc: "¿Qué [Glossary('Dharma','podgloss.dharma')] de los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] sigues? Un [Glossary('Dharma','podgloss.dharma')] es un camino hacia la iluminación que les permite trascender sus naturalezas bestiales y ofrece esperanza de iluminación y reincorporación al ciclo kármico. Como criaturas demoníacas, la iluminación es mucho más difícil y el camino hacia la sabiduría puede llevar milenios."
