 POD_chargen.1620.t: "Asuntos de la Corte"
 POD_chargen.1620.desc: "Una Corte es el organismo rector de los [GetTrait('kueijin').GetName( GetNullCharacter )] en una región. Muchas cortes utilizan sociedades secretas, bandas y subordinados burocráticos como peones y cortinas de humo, conocidos colectivamente como Pantallas Escarlata.\n\nTradicionalmente, las cortes principales se conocen como las Cinco Cortes Augustas. El Tigre Blanco abarca el Tíbet, Tarim y el Himalaya, el Fénix Escarlata reclama dominio sobre el Sudeste Asiático, el Emperador Amarillo sobre China, la Tortuga Negra cabalga en las estepas mientras el Dragón Azul administra Corea y Japón.\nExisten muchas más cortes menores que imitan a sus pares más prestigiosas. Incluso aquellos que rechazan la primacía de las Cinco tienden a estar organizados de manera similar, tan grande es la influencia cultural que han tenido sobre los $pod_kueijin$ a lo largo de los siglos."
 POD_chargen.1620.option.a: "Interesante"
 #POD_chargen.1620.option.b: "Quizás no sirvo a las cortes augustas"

 POD_chargen.1700.t: "Las Dinastías Amenti"
 POD_chargen.1700.desc: "Los Shemsu-Heru fueron la primera Dinastía, los verdaderos Inmortales creados por y para los Dioses para librar una guerra santa contra $glossary_wyrm_apophis$. Luego llegaron los renegados de los Ismaelitas, la segunda dinastía, creada por un deseo de libertad y autodeterminación. La tercera dinastía fueron los malditos Apepnu, sirvientes de $glossary_wyrm_apophis$ levantados por el rito Plaga del enemigo Set y finalmente llegaron los ladrones bastardos de la inmortalidad, la cuarta Dinastía de los Cabiri."
 POD_chargen.1700.option.a: "Los Shemsu-Heru"
 POD_chargen.1700.option.b: "Los Ismaelitas"
 POD_chargen.1700.option.c: "Las Momias Plaga"
 POD_chargen.1700.option.d: "Los Cabiri"
 POD_chargen.1700.option.e: "¿Qué hay de una momia que no sea de las Dinastías Amenti?"
 POD_chargen.1700.option.f: "Quizás no soy una momia"
 
 POD_chargen.1800.t: "Otros Inmortales de Otras Tierras"
 POD_chargen.1800.desc: "Los Capacocha tienen su propio método de inmortalidad, el Hechizo de Ir hacia el Oeste, y los Wu T'ian usan el Elixir de la Vida Eterna."
 POD_chargen.1800.option.a: "Los Capacocha"
 POD_chargen.1800.option.b: "Los Wu T'ian"
 POD_chargen.1800.option.c: "Los Wu Kuei"
 POD_chargen.1800.option.d: "Regresar a las Dinastías Amenti"
 POD_chargen.1800.option.e: "Quizás no soy una momia"

 POD_chargen.1900.t: "¿Qué sucede después de la Muerte?"
 POD_chargen.1900.desc: "Moriste, pero algo no te permitió irte en paz. Estuviste en estasis hasta que algo sucedió y ya no lo estabas, los detalles no son importantes. Lo importante es dónde estás ahora."
