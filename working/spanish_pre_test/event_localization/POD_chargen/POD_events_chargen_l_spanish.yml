 POD_chargen.2500.t: "Wraith de Otra Parte"
 POD_chargen.2500.desc: "La [UmbraGlossary('tempest')] es un 'mar' en el [UmbraGlossaryLocalized('shadowlands','Inframundo')], y los [Glossary('Reinos Oscuros','game_concept_dark_kingdom_desc')] son islas en ese mar. Cada [Glossary('Reino Oscuro','game_concept_dark_kingdom_desc')] es una hipóstasis para los muertos de una cultura particular."
 POD_chargen.2500.option.a: "Manantial Amarillo"
 POD_chargen.2500.option.b: "Karta"
