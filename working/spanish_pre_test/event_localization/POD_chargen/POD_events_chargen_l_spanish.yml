l_spanish:

 POD_chargen.1.t: "Bienvenido al Generador de Personajes"
 POD_chargen.1.desc: "Con esta serie de eventos, puedes personalizar tu personaje para el $pod_wod$. El proceso eliminará todos tus rasgos sobrenaturales existentes. Podrás elegir tu tipo de criatura sobrenatural, tu $pod_clan$, tu casa, tu generación, potencialmente tu [Glossary('Sire','game_concept_Sire_desc')], tus [Glossary('Disciplines','game_concept_discipline_desc')], tu sendero y camino y tu tipo de depredador.\n\nDependiendo de tu personaje base, es posible que necesites eliminar algunos parientes de legado."
 POD_chargen.1.option.a: "Realmente quiero usar el Generador de Personajes"
 POD_chargen.1.option.a.tt: "#R ¡ASEGÚRATE DE QUE QUIERES HACER ESTO! ¡NO HAY VUELTA ATRÁS! ¡ESTO ELIMINARÁ TODOS TUS RASGOS SOBRENATURALES EXISTENTES, MODIFICADORES Y SECRETOS!!!#!"
 POD_chargen.1.option.b: "No hacer cambios y salir del Generador de Personajes"

 POD_chargen.2.t: "¿Qué acecha en la noche?"
 POD_chargen.2.desc: "¿Qué tipo de sobrenatural eres?"
 POD_chargen.2.desc.landless: "#X Como eres un [adventurer|E], aquí solo se muestran los [splats|E] con [POD_landless_mechanics|E].#!"
 POD_chargen.2.option.b: "$glossary_fera$"

 POD_chargen_which_lineage: "¿A qué casa reclamas linaje?"
 POD_chargen_clan_tt: "Podrás elegir entre los siguientes [Glossary('Clans','game_concept_Clan_desc')]:"

 POD_chargen.3.t: "La Primera Generación" 
 POD_chargen.3.desc: "¿Quién es el progenitor de los vampiros?"
 POD_chargen.3.option.a: "Como está escrito en el Libro de Nod: Caín fue maldecido por Dios"
 POD_chargen.3.option.i: "Los [Glossary('Ashirra','game_concept_ashirra_desc')] dicen que Kayyun fue maldecido por Alá" 
 POD_chargen.3.option.c: "Las historias dicen que los vampiros descienden de Cagn"
 POD_chargen.3.option.b: "La Madre Oscura dice que los vampiros tienen muchos orígenes"  
 POD_chargen.3.option.h: "Set, quien tomó su venganza sobre Osiris" 
 POD_chargen.3.option.g: "Odín marcó con runas al guerrero moribundo Canarl" 
 POD_chargen.3.option.f: "Creado por los Pitris, Zapathasura caza a sus sirvientes caídos"
 POD_chargen.3.option.l: "Estamos perdidos, pero sobrevivimos"
 POD_chargen.3.option.e: "Sorpréndeme"
 POD_chargen.3.option.e.tt: "No eres tú quien elige al [Glossary('Sire','game_concept_Sire_desc')], sino el [Glossary('Sire','game_concept_Sire_desc')] quien te elige a ti."
 POD_chargen.3.option.d: "No lo sé."
 POD_chargen.3.option.j: "Quizás no soy un vampiro..."
 POD_chargen.3.option.j.tt: "Reconsideras qué tipo de sobrenatural jugar."
 POD_chargen.3.option.k: "Preferiría elegir mi linaje por mi cuenta."
 POD_chargen.3.option.k.t: "Usando un [character_interaction|E] en cualquier otro vampiro vivo, podrás seleccionar un personaje con el que estar relacionado."
 POD_chargen.3.option.k.tt: "#R Esta opción está destinada a jugadores experimentados, y no hay vuelta atrás desde ella.#!"

 POD_chargen.4.t: "La Segunda Generación" 
 POD_chargen.4.desc: "¿De qué vástago de Caín desciende tu $pod_clan$?"
 POD_chargen.4.option.a: "Enoc el Sabio"
 POD_chargen.4.option.b: "Irad el Fuerte"
 POD_chargen.4.option.c: "Zillah la Bella"
 POD_chargen.4.option.d: "Quizás Caín no fue el progenitor…"
 POD_chargen.4.option.d.tt: "Reconsideras el origen de los vampiros."

