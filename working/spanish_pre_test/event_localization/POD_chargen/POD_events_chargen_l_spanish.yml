 POD_chargen.1110.option.d: "Mujeres de Mediana Edad"
 POD_chargen.1110.option.e: "Hombres Mayores"
 old_ventrue_base_tt: "Mayor en este caso significa más de 50 años."
 POD_chargen.1110.option.f: "Mujeres Mayores"
 POD_chargen.1110.option.g: "Tengo otro tipo de presa..."

