 POD_charjoin.510.t: "Presente"
 POD_charjoin.510.desc: "Por tradición, deberías enviar un regalo apropiado a tu nuevo Sifu que corresponda a su estatus, o simplemente puedes no enviar nada, dejando que otros se rían de ti." 
 POD_charjoin.510.option.a: "Prepararé un regalo apropiado."
 POD_charjoin.510.option.b: "No me importa mi reputación."
 
