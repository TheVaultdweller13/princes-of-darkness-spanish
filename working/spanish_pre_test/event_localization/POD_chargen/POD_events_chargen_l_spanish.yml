 POD_chargen.620.t: "Potencia de Sangre"
 POD_chargen.620.desc: "La Potencia de Sangre determina la fuerza de tus poderes vampíricos, así como cuánta sangre necesitas para satisfacer tu hambre. La potencia de sangre está definida inicialmente por la generación y limitada por la generación. La potencia de sangre crece muy lentamente con el tiempo, pero también puede aumentar a través de la $pod_diablerie$. Entrar en $pod_torpor$ reducirá lentamente tu potencia de sangre."
 POD_chargen.620.option.a: "Mi potencia de sangre está establecida"
 
 POD_chargen.650.t: "La Mascarada"
 POD_chargen.650.desc: "El Silencio de la Sangre es mantener tu naturaleza sobrenatural en secreto para los mortales. Si los mortales saben que eres un monstruo, pueden intentar destruirte. Peor aún, otros sobrenaturales también pueden buscar tu destrucción para asegurar su propia supervivencia. Algunos sobrenaturales evitan el secreto y en su lugar se deleitan en el temor causado por revelar la naturaleza monstruosa. Usar poderes sobrenaturales abiertamente en público, crear vástagos vampíricos y ghouls, ser descuidado al ocultar la alimentación y dejar un rastro de cadáveres; todo esto corre el riesgo de aumentar la exposición de la mascarada de un vampiro."
 POD_chargen.650.option.a: "Mi naturaleza sobrenatural está oculta." 
 
 POD_chargen.670.t: "El Hambre"
 POD_chargen.670.desc: "La Bestia tiene hambre. Los Vampiros sostienen su existencia inmortal a través de la sangre. La sangre también alimenta sus poderes sobrenaturales. Usar tus habilidades sobrenaturales como [Glossary('Disciplinas','game_concept_discipline_desc')] o la curación fantástica tiene la posibilidad de aumentar tu hambre. Cuanto más hambriento está un vampiro, más irracional, desesperado, violento y estresado se vuelve. Los Vampiros solo se sacian por completo drenando a un humano hasta la muerte. Matar humanos, sin embargo, erosiona la humanidad de un vampiro, haciéndolo más susceptible a las tentaciones de la Bestia. Sucumbir completamente a la Bestia es convertirse en un wight, una criatura impulsada únicamente por su sed insaciable de sangre. Seguir un Sendero o Camino ayudará a un vampiro a mantener a raya a la Bestia."
 POD_chargen.670.option.a: "Tengo hambre."
 
