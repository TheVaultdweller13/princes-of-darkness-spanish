l_spanish:
 POD_infernalism_events.1.t: "Diabolus Advocatorum"
 POD_infernalism_events.1.desc: "Los $POD_splat_demon_plural$ se toman sus [demonic_pacts|E] muy en serio. Aunque están obligados a respetar su parte del trato, aprovecharán cualquier laguna o cláusula poco clara que pueda beneficiarles. Muchos insensatos #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Infernalistas#!#! aprendieron demasiado tarde a leer la letra pequeña con más dedicación que las letras grandes escritas en sangre."

 POD_infernalism_events.1.pact: "• Pacto firmado con [EventWindowWidget.GetScope.sC('recipient').GetFirstNameNoTooltip] •"

 POD_infernalism_events.1.confirm: "Mi alma por el poder."
 POD_infernalism_events.1.a: "Esto no me beneficia."
