l_spanish:
 podshih.100.t: "Petición de paz"
 podshih.100.desc: "[shih.GetFirstName] quiere hacer una tregua contigo. Una práctica común entre los [GetTrait('shih').GetName( GetPlayer )] errantes, ya que a menudo necesitan tiempo para reenfocar su P'o interior lejos de la constante hostilidad y agresión necesarias en su sangriento trabajo."
 podshih.100.a: "Acepto."
 podshih.100.b: "No aceptaré esto."
 
 podshih.1010.t: "El Ejército Celestial y la Inquisición"
 podshih.1010.desc: "Tras la reforma del Ejército Celestial, cien años en proceso, ha aparecido la oportunidad de una guerra total contra los Shen.\nEn el Oeste, la Inquisición de las Sombras de la Iglesia Católica ha comenzado a purgar sus propias tierras, dándote la posibilidad de intensificar también tus asaltos. Es hora de poner fin a esto."
 podshih.1010.a: "Participaré."
 
 POD_shih_events.0001.t: "Conoce a tu enemigo"
 POD_shih_events.0001.desc: "El fundador de los Shih, el maestro Wan Kung Yi, encontró muchas criaturas extrañas durante sus viajes. Algunas eran amistosas, otras no y algunas están simplemente extintas en esta era. Aun así, sabía que cualquiera de estas criaturas podía ser seducida por el mal y, por tanto, necesitar su intervención.\nSiguiendo este ejemplo, los Shih aprenden a perfeccionarse en muchas habilidades diferentes, listos para abordar cualquier amenaza inesperada que puedan encontrar." 
 POD_shih_events.0001.a: "Entrenamiento centrado en [diplomacy|E]."
 POD_shih_events.0001.b: "Entrenamiento centrado en [martial|E]."
 POD_shih_events.0001.c: "Entrenamiento centrado en [stewardship|E]."
 POD_shih_events.0001.d: "Entrenamiento centrado en [intrigue|E]."
 POD_shih_events.0001.e: "Entrenamiento centrado en [learning|E]."
 POD_shih_events.0001.f: "He cambiado de opinión."
 
 POD_shih_events.0002.t: "Mente sobre cuerpo"
 POD_shih_events.0002.desc: "Los Shih no están seguros de si los Qiao fueron inventados por su fundador, el maestro Wan Kung Yi, o si es algo que le enseñaron seres sobrenaturales amistosos. En cualquier caso, ha demostrado una y otra vez ser su mejor activo, rivalizando y a veces superando los temidos poderes de los sobrenaturales. El Qiao es, en su esencia, la canalización del Chi a través de un enfoque intenso. Por lo tanto, no es de extrañar que una gran parte del entrenamiento de los Shih se dedique a dominar estas artes." 
 POD_shih_events.0002.a: "Entrenamiento centrado en [qiao_lifestyle|E]."
 POD_shih_events.0002.b: "Entrenamiento mental general."
 
 POD_shih_events.0003.t: "La proeza humana"
 POD_shih_events.0003.desc: "El fundador de los Shih, el maestro Wan Kung Yi, se centró principalmente primero en el entrenamiento físico de sus estudiantes. Aunque algunos sostienen que fue una causa de su caída y del ascenso del Ejército Celestial, pocos se atreven a negar que es una práctica necesaria para cualquier aspirante a cazador de demonios.\nAunque los Shih no atacan a los sobrenaturales nada más verlos, no son tan necios como para pensar que recibirán la misma cortesía de los miembros más malvados de estas facciones." 
 POD_shih_events.0003.a: "Entrenamiento centrado en [prowess|E]."
 POD_shih_events.0003.b: "He cambiado de opinión."
 
 POD_shih_events.0004.t: "Meditación compartida"
 POD_shih_events.0004.desc: "Aunque pueden mostrar poderes impresionantes, los Shih siguen siendo en gran medida mortales en su esencia. El relato de su fundador, el maestro Wan Kung Yi, y sus enseñanzas son sus directrices principales, pero también se han visto influenciados por las culturas en las que viven. Al comprender muchos que la caída de Yi se debió a su falta de control sobre sus propias emociones, la práctica de la meditación se ha convertido en un elemento básico del régimen de entrenamiento de los Shih."
 POD_shih_events.0004.a: "Reflexionando sobre nuestra causa"
 POD_shih_events.0004.b: "Sanando nuestra mente"
 
 POD_shih_events.0005.t: "El deber del Shih"
 POD_shih_events.0005.desc: "Aunque se consideran cazadores de monstruos y demonios, los Shih siguen los preceptos de su fundador de comprender que incluso los sobrenaturales son parte de este mundo. Con esto en mente, solo los verdaderamente malvados deben ser castigados. Esto es lo que separa a los Shih del fallido Ejército Celestial, este enfoque les ayuda a mantener sus recursos dirigidos contra los verdaderos enemigos que plagan a la humanidad." 
 POD_shih_events.0005.a: "Portadores de prosperidad"
 POD_shih_events.0005.b: "Protegiendo a los inocentes"