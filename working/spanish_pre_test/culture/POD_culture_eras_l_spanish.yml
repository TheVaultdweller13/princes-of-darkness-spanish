l_spanish:
 culture_era_dark_fantastic: "Oscuridad Fantástica"
 culture_era_dark_fantastic_desc: "Al amanecer de la Edad Moderna, se están cartografiando nuevos continentes mientras la sociedad feudal cede lentamente el paso a los estados centralizados."
 culture_era_gothic_victorian: "Gótico Victoriano"
 culture_era_gothic_victorian_desc: "El nombre 'Gótico Victoriano' hace referencia a las dos sensibilidades que informan el escenario: el romanticismo melancólico y condenado de la ficción gótica clásica y el reinado de la reina Victoria I del Reino Unido, que gobernó el Imperio Británico desde el 20 de junio de 1837 hasta su muerte el 22 de enero de 1901. Estas dos sensibilidades infieren una preocupación por el cambio social radical a medida que coexiste y choca alternativamente con el peso represivo de la tradición. La era del Gótico Victoriano, tal como aparece en Edad Victoriana: Vampiro, abarca desde los años 1890 a 1897 y termina no con la muerte de Victoria, sino con la novela Drácula de Bram Stoker. Este evento sacudió el mundo de los Vástagos hasta sus cimientos. El periodo Gótico Victoriano se solapa parcialmente con el Salvaje Oeste (o \"Wyld West\"), el escenario de Hombre Lobo: El Oeste Salvaje. Sin embargo, el tema y el tono de los dos escenarios difieren significativamente. El próximo Mago Victoriano para Mago: La Ascensión también tratará sobre la Era Victoriana."
 culture_era_final_nights: "Últimas Noches"
 culture_era_final_nights_desc: "En la escatología $pod_cainite$, las Últimas Noches son las noches previas a la llegada de la Gehenna y el fin de los vampiros. Gran parte de la base de la creencia en las Últimas Noches se origina en el saber Nodista. Específicamente, el Libro de Nod. Se supone que las Últimas Noches están precedidas por varios signos que indican grandes cambios en la sociedad $pod_cainite$ y el inminente despertar de los [Glossary('Antediluvians','game_concept_antediluvian_desc')], como un aumento en el número de vampiros de sangre débil, principados gobernados por Caitiff y [GetTrait('kueijin').GetName( GetNullCharacter )] invadiendo el Oeste. Se dice que la mayoría de los vampiros tienen una sensación de perdición inminente durante las Últimas Noches."
 
 ##############
 # Era de la Oscuridad Fantástica #
 ##############
 
  #Militar
  innovation_tenaille: "Tenaza"
  innovation_tenaille_desc: "Era difícil disparar alrededor de muros curvos, por lo que una vez que los atacantes se acercaban lo suficiente a la fortificación, la capacidad de otras partes de las defensas para proporcionar fuego de flanqueo quedaba anulada. El desarrollo de bastiones en forma de estrella permitió que cada parte del muro fuera apoyada desde otras partes."
 
  innovation_trunnions: "Muñones"
  innovation_trunnions_desc: "La nueva artillería, más móvil, tenía un problema: no podía elevarse ni bajarse fácilmente para ajustar su alcance de tiro. Los muñones eran protuberancias cilíndricas que actuaban como soportes para el cañón en su cureña, lo que permitía inclinarlo y, por tanto, apuntar mejor."
 
  innovation_professional_officers: "Oficiales Profesionales"
  innovation_professional_officers_desc: "El valor del entrenamiento y la experiencia siempre ha sido grande en el campo de batalla. Con la llegada de la pólvora y los cambios tácticos asociados a ella y a otras armas de infantería, surgió una gran demanda de unidades versadas en estas nuevas innovaciones."
 
  innovation_early_modern_military: "Milicia de la Edad Moderna"
  innovation_early_modern_military_desc: "Al final de la Edad Media, los ejércitos de tierra se habían vuelto más profesionales y bien organizados. Existen mejores sistemas para apoyar la mezcla de levas y soldados profesionales que ahora dominan los campos de batalla, y el poder de la infantería está ganando terreno lenta pero firmemente al brazo de la caballería."
 
  innovation_standardized_pikes: "Picas Estandarizadas"
  innovation_standardized_pikes_desc: "Una pica es un arma notablemente sencilla de fabricar, pero para obtener todo el beneficio del uso de las picas, se requiere que toda la formación empuñe armas de longitud y hoja similares."
 
  innovation_musketmen: "Mosqueteros"
  innovation_musketmen_desc: "El arcabuz, ligero y fiable, pudo desplazar al arco debido a tres factores principales. Tenía una mejor penetración de armadura, era más fácil entrenar a los hombres para usarlo y no dependía de la fuerza del usuario."
 
  #Civil
  innovation_early_modern_administration: "Administración de la Edad Moderna"
  innovation_early_modern_administration_desc: "Con el tiempo se hizo evidente que una burocracia más centralizada con organismos administrativos dirigidos por funcionarios educados empleados directamente por el estado era una necesidad para los ambiciosos proyectos de los gobernantes de la Edad Moderna."
 
  innovation_land_clearance: "Desmonte de Tierras"
  innovation_land_clearance_desc: "Los bosques a gran escala son, por supuesto, útiles como fuente de leña y lugar de caza, pero si se eliminaran los árboles, esas tierras podrían utilizarse para la agricultura en su lugar."
 
  innovation_constitution: "La Constitución"
  innovation_constitution_desc: "Se ha desarrollado un nuevo concepto filosófico llamado constitucionalismo, en el que el gobierno acepta límites legales a su poder. Es una idea intrigante, pero no veo que llegue a cuajar."
 
  innovation_absolute_rulership: "Gobierno Absoluto"
  innovation_absolute_rulership_desc: "Hay mucha gente que exige que se le dé un papel en el gobierno, pero en realidad lo que más quieren son recompensas sin esfuerzo. Se está extendiendo una nueva e interesante idea de absolutismo, que es un sistema en el que nos deshacemos de esos parásitos y gobernamos solos."
 
  innovation_textile_manufactory: "Manufactura Textil"
  innovation_textile_manufactory_desc: "Los textiles se fabricaban desde tiempos inmemoriales. La invención del telar de medias en 1589 fue el primer paso hacia la revolución industrial y el comienzo de la mecanización. Este invento conduciría a un aumento de la producción textil."
 
  innovation_renaissance_thought: "Pensamiento Renacentista"
  innovation_renaissance_thought_desc: "La noción de una oligarquía noble que gobierna la sociedad ha existido, bueno, al menos desde la época romana, y siguió siendo popular en algunas partes del mundo. Ahora esta idea está ganando popularidad una vez más entre aquellos que importan."
 
  innovation_separation_of_powers: "Separación de Poderes"
  innovation_separation_of_powers_desc: "Ha surgido un tratado anónimo sobre teoría política y, a pesar de los esfuerzos por suprimirlo, se está extendiendo rápidamente por todo el mundo. Trata sobre la naturaleza de las formas de gobierno, ya sean monarquías, despotismos o democracias, y aboga por una estricta separación de los poderes ejecutivo, legislativo y judicial."
 
  #Regional
  innovation_spanish_square: "Tercio Español"
  innovation_spanish_square_desc: "El Tercio español se desarrolló de forma natural a partir de las formaciones de pica y disparo. En su núcleo había un cuadro de picas tradicional. En cada una de las esquinas tenía un grupo de arcabuceros. Mantenía la capacidad de resistencia del cuadro de picas tradicional y la mejoraba con la potencia de fuego del arcabuz."
 
  innovation_new_world: "El Nuevo Mundo"
  innovation_new_world_desc: "¿Quién sabe qué hay más allá?... Aparte de riquezas indecibles y gloria, por supuesto."
 
  innovation_the_mughals: "Los Mogoles"
  innovation_the_mughals_desc: "El Imperio Mogol fue un poderoso estado musulmán turco-mongol, fundado a principios del siglo XVI por Babur, un príncipe timúrida y descendiente de Tamerlán. En su apogeo, a principios del siglo XVIII, el imperio controlaba casi todo el subcontinente indio."
 
  unlock_absolute_control_contract: "Esta innovación permite el contrato de vasallaje de Control Absoluto."
  unlock_harsh_taxation_contract: "Esta innovación permite el contrato de vasallaje de Impuestos Severos."
 
  culture_this_equal: "¡Esta acción no está permitida para esta cultura!"
