l_spanish:
  trait_fae: "Hada Verdadera"
  trait_fae_desc: "Hada Verdadera es un término dado a cualquier espíritu nativo del [UmbraGlossary('dreaming')], que no sea una quimera y que no se haya sometido al Camino del Changeling. Aunque no existe una lista exhaustiva de estas entidades, incluiría a los Primogénitos, los Oscuros y, posiblemente, a los Inanimae."
  trait_firstbornfae: "Hada Primogénita"
  trait_firstbornfae_desc: "Los primogénitos surgieron de las Nieblas de la Creación en el pasado distante. Los nuevos primogénitos son hijos de otros primogénitos o espíritus transformados en hadas mediante poderosos cantrips. Los primogénitos afirman que gobernaron e incluso crearon el mundo entero y que solo ellos tenían el derecho de dictar las leyes y decretos de los reinos mágicos. Aunque escépticos, muchos Fae aceptaron esto y se refirieron a ellos como las 'Hadas Verdaderas'. El ascenso de la humanidad ha disminuido enormemente el poder de los Primogénitos y muchos temen por su destino si no se hace algo."
  trait_denizen: "Adhene"
  trait_denizen_desc: "Los Kithain llaman arbitrariamente a estas criaturas \"Oscuros\" debido a su vil reputación como servidores de los Fomorianos. A pesar de su abrupta partida de las tierras humanas, los Adhene mantuvieron una conexión directa, aunque sutil, con la psique humana. Personificando diversos aspectos de los sueños o temores humanos, el número de especies de adhene es vasto y variado."
  trait_inanimae: "Inanimae"
  trait_inanimae_desc: "Los Inanimae son primos de las Hadas Verdaderas. Aunque no son verdaderos espíritus elementales, tienen un estrecho parentesco con ellos. Cada Inanimae se modela a sí mismo según un elemento específico."
  trait_changeling: "Changeling"
  trait_changeling_desc: "Un híbrido hada/humano. Las antiguas Cortes creían que la Primera Mujer que vino a yacer con el Primer Hombre había sido una de los Primogénitos. De la unión entre ambos nació el primer changeling, aunque la pareja tuvo más hijos y la Primera Mujer tuvo otros compañeros. Otras explicaciones, especialmente de las hadas más antihumanistas, eran que los Changelings eran los restos de hadas deformes y no deseadas que fueron intercambiadas por niños mortales y criadas entre ellos."
  trait_kinain: "Kinain"
  trait_kinain_desc: "Un Kinain es un mortal que posee sangre de hada, pero no es un Changeling completo."
  trait_hsien: "Hsien"
  trait_hsien_desc: "En tiempos antiguos, las hadas de China servían como mensajeros y servidores del [spirit_world|E]. En aquellos días, viajaban libremente entre los reinos del espíritu y la carne. Eran los emisarios de la naturaleza, los guardianes y protectores de los lugares sagrados. Los hsien son los descendientes de seres que quedaron atrapados en el reino de la carne. Divididos tanto por su forma como por su corte, los hsien luchan por sobrevivir en un mundo de mortales que han dado la espalda al reino espiritual, un mundo lleno de otros seres sobrenaturales que los destruirían."

  trait_kithain: "Kithain"
  trait_jinn: "Jinn"
  trait_african_kiths: "Kiths Africanos"
  trait_phyla: "Phyla"
  
  trait_sidhe: "Sidhe"
  trait_sidhe_desc: "Los nobles y hermosos gobernantes de la estirpe de las hadas, los sidhe son los líderes de una belleza de otro mundo de los clásicos señores de las hadas."
  trait_boggan: "Boggan"
  trait_boggan_desc: "Prácticos y trabajadores, los boggans son los guardianes de los hogares y amas de casa industriosas."
  trait_clurichaun: "Clurichaun"
  trait_clurichaun_desc: "Divertidos y carismáticos, estos Kithain son el origen de las historias de los leprechauns."
  trait_eshu: "Eshu"
  trait_eshu_desc: "Los trotamundos definitivos, los eshu son consumados narradores y exploradores."
  trait_ghilledhu: "Ghille dhu"
  trait_ghilledhu_desc: "Espíritus de lo verde y la naturaleza, los ghille dhu fueron antaño criaturas prósperas que cambiaban su naturaleza según la estación."
  trait_oba: "Oba"
  trait_oba_desc: "Los Nobles de los Elegbara, primos terrestres de los Eshu."
  trait_nocker: "Nocker"
  trait_nocker_desc: "Estos cascarrabias malhablados pueden ser pequeños y extraños a la vista, pero su necesidad de fabricar y construir los convierte en los ingeniosos inventores de la sociedad Kithain."
  trait_piskey: "Piskey"
  trait_piskey_desc: "Los piskies son un kith inocente y de ojos grandes, compuesto por vagabundos naturales que buscan la belleza asombrosa del mundo."
  trait_pooka: "Pooka"
  trait_pooka_desc: "Bromistas en el mejor de los casos y terrores en el peor, cada uno de estos Kithain comparte una afinidad con un animal particular y adora las bromas pesadas."
  trait_troll: "Troll"
  trait_troll_desc: "Estos poderosos gigantes encarnan la lealtad, el honor y la fuerza de las hadas."
  trait_redcap: "Redcap"
  trait_redcap_desc: "Estos horribles Kithain son monstruosas máquinas de comer, aterradores de contemplar y llenos de mala actitud y violencia."
  trait_riverhag: "Mora del Río"
  trait_riverhag_desc: "Estas hadas empapadas viven en masas de agua de movimiento rápido y arrastran a presas desprevenidas para ahogarlas."
  trait_satyr: "Sátiro"
  trait_satyr_desc: "Los sátiros son el espíritu del placer y la pasión hechos forma."
  trait_sluagh: "Sluagh"
  trait_sluagh_desc: "Estas hadas oscuras y reservadas son las mejores recolectando información y guardando secretos."
  trait_swanmaiden: "Doncella Cisne"
  trait_swanmaiden_desc: "Las Doncellas Cisne son un kith de reciente aparición nacido de los sueños de romance y amor verdadero."
  trait_wichtel: "Wichtel"
  trait_wichtel_desc: "Los mineros y otros trabajadores son la base de una comunidad porque realizan tareas que deben completarse sin importar lo desagradables que sean, se aventuran en la oscuridad y el peligro en busca de los recursos de los que depende la sociedad, y realizan un trabajo peligroso y agotador sin esperar fama ni fortuna. El trabajo se hace porque debe hacerse. Los Wichtel encarnan este espíritu."
  trait_ifrit: "Ifrit"
  trait_ifrit_desc: "Forjado en las llamas y endurecido en la batalla, un Ifrit tiene poca paciencia con la debilidad."
  trait_lilin: "Lilin"
  trait_lilin_desc: "Obstinada y seductora, una Lilin sabe lo que quiere y cómo conseguirlo."
  trait_qareen: "Qareen"
  trait_qareen_desc: "Los Qurana’ tienen el don y la maldición de la memoria eidética, y otros Jinn se refieren a ellos como “bibliotecas andantes”."
  trait_shaytan: "Shaytan"
  trait_shaytan_desc: "Negociador, embaucador, tentadora, charlatán: estas son las etiquetas fijadas a un Shaytan."
  trait_biloko: "Biloko"
  trait_biloko_desc: "Este kith enfatiza el valor de la tradición y la herencia, estando estrechamente ligado a su cultura y comunidad y recelando de los extraños."
  trait_djedi: "Djedi"
  trait_djedi_desc: "Amantes de la sociedad, la fiesta y la alegría, los Djedi son celebridades instantáneas que están tan dotados para la hechicería como malditos por su notoriedad."
  trait_kuino: "Kuino"
  trait_kuino_desc: "Esperanzados, ambiciosos e industriosos: este kith está formado por el impulso de lograr el éxito y una vida mejor, aunque deben cuidarse de la codicia y de la pérdida de sus objetos sagrados en esa búsqueda."
  trait_obambo: "Obambo"
  trait_obambo_desc: "Este kith está formado por exploradores y aventureros dotados que conocen todos los trucos para explorar la Tierra de los Antiguos Sueños y salir airosos con el botín; son tan afables como parecen, aunque son peligrosos cuando sus seres queridos se ven amenazados." 
  trait_okubili: "Okubili"
  trait_okubili_desc: "Equilibrados y en sintonía con sus vidas pasadas y centrados en mantener el equilibrio en todas sus vidas actuales, a este kith le encanta enseñar, pero a veces se enreda en las preocupaciones de vidas pasadas." 
  trait_chuihyu: "Chu-ih-yu"
  trait_chuihyu_desc: "Un Kwannon-jin de los Hsien Orientales, los Chu-ih-yu son nobles elementales; Kamuii Shinma del elemento Metal." 
  trait_chujung: "Chu Jung"
  trait_chujung_desc: "Un Kwannon-jin de los Hsien Orientales, los Chu Jung son nobles elementales; Kamuii Shinma del elemento Fuego." 
  trait_fuhsi: "Fu Hsi"
  trait_fuhsi_desc: "Un Kwannon-jin de los Hsien Orientales, los Fu Hsi son plebeyos; Hirayanu Shinma sintonizados con el elemento Madera con la capacidad de convertirse en serpientes." 
  trait_hanumen: "Hanumen"
  trait_hanumen_desc: "Un Kwannon-jin de los Hsien Orientales, los Hanumen son plebeyos; Hirayanu Shinma sintonizados con el elemento Tierra con la capacidad de convertirse en monos." 
  trait_hengpo: "Heng Po"
  trait_hengpo_desc: "Un Kwannon-jin de los Hsien Orientales, los Heng Po son plebeyos; Hirayanu Shinma sintonizados con el elemento Agua con la capacidad de convertirse en peces." 
  trait_houchi: "Hou-chi"
  trait_houchi_desc: "Un Kwannon-jin de los Hsien Orientales, los Hou-chi son nobles elementales; Kamuii Shinma del elemento Madera." 
  trait_komuko: "Komuko"
  trait_komuko_desc: "Un Kwannon-jin de los Hsien Orientales, los Komuko son nobles elementales; Kamuii Shinma del elemento Tierra." 
  trait_nyan: "Nyan"
  trait_nyan_desc: "Un Kwannon-jin de los Hsien Orientales, los Nyan son plebeyos; Hirayanu Shinma sintonizados con el elemento Fuego con la capacidad de convertirse en gatos." 
  trait_suijen: "Suijen"
  trait_suijen_desc: "Un Kwannon-jin de los Hsien Orientales, los Suijen son nobles elementales; Kamuii Shinma del elemento Agua." 
  trait_tanuki: "Tanuki"
  trait_tanuki_desc: "Un Kwannon-jin de los Hsien Orientales, los Tanuki son plebeyos; Hirayanu Shinma sintonizados con el elemento Metal con la capacidad de convertirse en tanuki o perros mapache (a menudo mal traducidos como \"tejones\")." 
  trait_glome: "Glome"
  trait_glome_desc: "Inanimae de Tierra y miembros del Imperio de las Piedras." 
  trait_kubera: "Kubera"
  trait_kubera_desc: "Inanimae de Madera y miembros del Imperio de las Semillas." 
  trait_ondine: "Ondina"
  trait_ondine_desc: "Inanimae de Agua y miembros del Imperio de las Lágrimas." 
  trait_paroseme: "Paroseme"
  trait_paroseme_desc: "Inanimae de Aire y miembros del Imperio de los Cielos." 
  trait_solimond: "Solimond"
  trait_solimond_desc: "Inanimae de Fuego y antiguos miembros del Imperio de las Llamas." 
  trait_mannikin: "Maniquí"
  trait_mannikin_desc: "Inanimae de elementos con forma humana y miembros del Imperio de las Muñecas." 
  
  trait_realm_actor: "Maestría del Reino Actor"
  trait_realm_actor_desc: "Actor es el reino conectado a todos los seres mundanos, con una correlación directa con lo bien que los conoces. Cuanto menos familiarizado estés con un ser en particular, ya sea un hombre lobo, mortal, wraith, vampiro, etc., mayor maestría de Actor se requiere. Afectar a alguien a quien te opones, independientemente del conocimiento, requiere una maestría completa." 
  trait_realm_fae: "Maestría del Reino Fae"
  trait_realm_fae_desc: "Fae trata con otros seres del [UmbraGlossary('dreaming')]. Afectar a otros Changelings, a los Nobles Sidhe, Adhene, Quimeras, o incluso controlar la propia magia Changeling, todo cae bajo el reino de Fae." 
  trait_realm_nature: "Maestría del Reino Naturaleza"
  trait_realm_nature_desc: "Naturaleza es el control de las plantas, la tierra y las bestias. Cualquier cosa no tocada por la creación se presta a ser controlada por el reino de la Naturaleza." 
  trait_realm_prop: "Maestría del Reino Objeto"
  trait_realm_prop_desc: "Objeto es el control y manipulación de todos los objetos creados. Ropa, armas, edificios y cualquier otra cosa \"creada\" cae bajo Objeto. Cuanto más complicado sea el dispositivo, más maestría del reino Objeto se requiere." 
  trait_realm_scene: "Maestría del Reino Escena"
  trait_realm_scene_desc: "Escena es el control del espacio. Cuanto más domines el reino de Escena, mayor será el área o más objetivos (en conjunción con otros reinos) podrás afectar." 
  trait_realm_time: "Maestría del Reino Tiempo"
  trait_realm_time_desc: "Tiempo es el control de cuándo ocurrirán tus cantrips o cuánto durarán. La maestría del Tiempo dicta la duración que pueden tener tus hechizos o cuánto tiempo puedes establecer un \"activador\" sobre ellos."  
  trait_realm_air: "Maestría del Reino Aire"
  trait_realm_air_desc: "Aire es el elemento que rodea el globo. Afecta al entorno no vivo y a un cantrip que afecte al clima, el aire, la temperatura o cualquier otra cosa dentro del área del lanzador o del objetivo."
  trait_realm_earth: "Maestría del Reino Tierra"
  trait_realm_earth_desc: "Tierra afecta a objetos no vivos y no sobrenaturales, tanto naturales como fabricados."
  trait_realm_fire: "Maestría del Reino Fuego"
  trait_realm_fire_desc: "Fuego se usa para afectar a criaturas vivas no sobrenaturales. Afecta solo al aspecto físico de tales criaturas. Este reino también se usaría para afectar físicamente a los humanos mortales."
  trait_realm_water: "Maestría del Reino Agua"
  trait_realm_water_desc: "Agua solo afecta al entorno mental de las criaturas vivas no sobrenaturales. Confundir a otros requiere este reino."
  trait_realm_spirit: "Maestría del Reino Espíritu"
  trait_realm_spirit_desc: "Espíritu se usa para afectar cualquier aspecto de un ser o cosa sobrenatural, incluyendo a otros Fae. Afecta al entorno así como a los reinos físico y mental. También afecta a los mortales encantados."
  
  trait_chicanery: "Chicanería"
  trait_legerdemain: "Prestidigitación"
  trait_primal: "Primitiva"
