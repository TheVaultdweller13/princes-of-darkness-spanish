  trait_nei_tan: "Nei Tan"
  
  trait_art_chicanery: "Arte de Chicanería"
  trait_art_chicanery_desc: "La Chicanería es el poder mágico engañoso de la ilusión y la manipulación emocional. Aquellos que la practican extensamente suelen ser considerados algo indignos de confianza por los nobles." 
  trait_art_legerdemain: "Arte de Prestidigitación"
  trait_art_legerdemain_desc: "La Prestidigitación permite a un changeling controlar su entorno mediante medios telequinéticos, desde robar bolsillos a distancia hasta agarrar y lanzar grandes objetos. Este Arte también permite la creación de objetos y criaturas ilusorios sólidos." 
  trait_art_primal: "Arte de Primitiva"
  trait_art_primal_desc: "Primitiva permite a un changeling manipular las fuerzas de la naturaleza, desde invocar los elementos hasta comulgar con objetos inanimados. También otorga poder sobre el cuerpo, permitiendo a un fae endurecer su piel como la corteza de un árbol, curar heridas, desgarrar la carne e incluso cambiar de forma." 
  trait_art_soothsay: "Arte de Adivinación"
  trait_art_soothsay_desc: "La Adivinación representa la capacidad del changeling para ver el futuro. Dependiendo de los reinos utilizados en conjunción, el changeling puede ser capaz de obtener información sobre una persona, lugar u objeto." 
  trait_art_wayfare: "Arte de Viaje"
  trait_art_wayfare_desc: "El Arte de Viaje trata sobre la capacidad de un changeling para moverse a través del espacio. Esto implica rebotar y cubrir grandes distancias, avanzar a una velocidad imposible e incluso teletransportarse de un lugar a otro." 
  trait_art_chronos: "Arte de Chronos"
  trait_art_chronos_desc: "Chronos es el Arte de la manipulación temporal. A diferencia de los métodos para alterar el tiempo conocidos por otros seres sobrenaturales, Chronos es bastante indirecto y casi nunca sigue un orden lineal; en su lugar, es un Arte de estar disjunto del orden adecuado del tiempo, lo que hace que sus practicantes sean difíciles de afectar con magia de Tiempo y pierdan de vista cómo debería funcionar el tiempo." 
  trait_art_dream_craft: "Arte de Ensueño"
  trait_art_dream_craft_desc: "Ensueño es el Arte de manipular la materia prima de la que está hecho el [UmbraGlossary('dreaming')]. Este arte permite a los Sidhe cambiar las formas físicas dentro del [UmbraGlossary('dreaming')], lo que puede afectar la apariencia de los feudos y otros santuarios del [UmbraGlossary('dreaming')]. También puede afectar al voile, la vestimenta quimérica que los changelings visten mientras están en el [UmbraGlossary('dreaming')]." 
  trait_art_naming: "Arte de Nombramiento"
  trait_art_naming_desc: "Nombramiento es el Arte de los [Glossary('True Names','podgloss.truename')] y el poder de las palabras. Es uno de los Artes más insidiosos conocidos por los Kithain, ya que aunque sus niveles bajos son engañosamente inofensivos, un maestro del Nombramiento puede causar fácilmente daños irreparables. Los usos excesivamente frívolos del Nombramiento no son tomados a la ligera por la nobleza, que imparte justicia rápidamente a quienes subvierten sus efectos." 
  trait_art_sovereign: "Arte de Soberanía"
  trait_art_sovereign_desc: "Soberanía es el Arte de controlar a los plebeyos y la majestad noble. Es uno de los Artes más políticos practicados comúnmente por los Kithain, y existe en gran medida para asegurar el mantenimiento de sus estructuras políticas." 
  trait_art_infusion: "Arte de Infusión"
  trait_art_infusion_desc: "Infusión es el Arte que ayuda a los Nockers a crear todos sus maravillosos objetos de relojería y quiméricos. Implica la conexión de \"FUBARS\" y otras entidades quiméricas en formas físicas o quiméricas." 
  trait_art_tale_craft: "Arte de Narración"
  trait_art_tale_craft_desc: "Narración es el Arte Eshu de contar historias maravillosas, mediante la provisión de efectos especiales, la lectura de la audiencia y la manipulación de sus emociones. El [bunk|E] para un cantrip de Narración es, con pocas excepciones, una historia, ya sea hablada o cantada." 
  trait_art_aphrodesia: "Arte de Afrodisia"
  trait_art_aphrodesia_desc: "Afrodisia es el Arte de la seducción. La versión fae de la \"Poción de Amor Número 9\", que va desde una atracción decente hasta que el sujeto esté dispuesto a matarse por el objeto de su afecto."
  trait_art_kryos: "Arte de Kryos"
  trait_art_kryos_desc: "Kryos es el Arte del frío y el hielo. A diferencia de otros artes elementales conocidos por los changelings, los poderes de Kryos son bastante literales, causando frío real en lugar de escalofríos metafóricos. Algunos temen que este Arte esté estrechamente conectado con la Banalidad, dada su naturaleza inmovilizadora y paralizante."
  trait_art_metamorphosis: "Arte de Metamorfosis"
  trait_art_metamorphosis_desc: "Metamorfosis es el Arte de cambiar la forma de los seres vivos. Difiere notablemente de Primitiva en que, mientras que Primitiva se relaciona con dar forma a lo no vivo, Metamorfosis da forma a lo vivo. A través de ella, una fae puede convertirse fácilmente en lo que quiera, aunque solo sea por un corto tiempo."
  trait_art_pyretics: "Arte de Pirética"
  trait_art_pyretics_desc: "Pirética es el arte de manipular el fuego real y quimérico. Además de prender fuego a las cosas, la Pirética también puede aprovechar los aspectos menos destructivos del fuego, iluminando el camino y revelando lo invisible."
  trait_art_petros: "Petros"
  trait_art_petros_desc: "Petros, una de las dos Astillas de Tierra, gobierna el dar forma a la piedra e imbuir al lanzador con las propiedades físicas de la roca sólida. Todos los Inanimae que conocen Petros pueden trepar por una superficie rocosa con poca dificultad."
  trait_art_aquis: "Aquis"
  trait_art_aquis_desc: "Aquis es la Astilla de Agua, que controla el movimiento del agua a través de la atmósfera, además de reflejar la asociación del agua con la empatía y la medicina. Todos los Inanimae que conocen Aquis son capaces de respirar bajo el agua y saben nadar automáticamente."
  trait_art_pyros: "Pyros"
  trait_art_pyros_desc: "Pyros es la Astilla de Fuego, que produce calor y combustión espontánea, además de afectar simbólicamente a la pasión de sangre caliente. Todos los Inanimae que conocen Pyros pueden encender una pequeña llama sin necesidad de cerillas ni equipo."
  trait_art_stratus: "Stratus"
  trait_art_stratus_desc: "Stratus es la Astilla de Aire, que despista tanto mediante movimientos cegadoramente rápidos como produciendo ilusiones brumosas. Todos los Inanimae que conocen Stratus pueden sentir los patrones climáticos que se aproximan desde kilómetros de distancia."
  trait_art_verdage: "Verdage"
  trait_art_verdage_desc: "Verdage, una de las dos Astillas de Tierra, gobierna la vida y la materia orgánica, especialmente la que compone las plantas. Todos los Inanimae que conocen Verdage son capaces de identificar inmediatamente la vida vegetal que ven."
  trait_art_tieh_tan: "Tieh Tan"
  trait_art_tieh_tan_desc: "El elemento Metal incluye todos los metales preciosos y de trabajo: oro, plata, hierro, latón y acero. Aunque su alcance es bastante limitado comparado con el Agua o la Tierra, su uso abrumador es para fabricar herramientas, especialmente para la guerra."
  trait_art_lin_tan: "Lin Tan"
  trait_art_lin_tan_desc: "La Madera representa el poder del mundo natural y, como tal, tiene poder sobre gran parte del mundo. Los fenómenos naturales con los que se asocia son cualquier tipo de planta, la juventud, la salud y el crecimiento."
  trait_art_shui_tan: "Shui Tan"
  trait_art_shui_tan_desc: "El Agua es uno de los elementos más poderosos. Abarca todas las cosas líquidas y gaseosas: nubes, metano, agua, sangre, etc. El Agua es inherentemente vital pero peligrosa y engañosa. También controla los vientos y las tormentas, pero no los rayos."
  trait_art_hou_tan: "Hou Tan"
  trait_art_hou_tan_desc: "El Fuego se asocia con los rayos, la luz, la llama y todas las demás energías visibles. Se encuentra en tormentas, llamas abiertas, pantallas de ordenador y magma ardiente."
  trait_art_di_tan: "Di Tan"
  trait_art_di_tan_desc: "La Tierra representa toda la roca, el suelo, la piedra, las gemas y los minerales. La Tierra es el centro de todos los elementos y el fulcro de las percepciones chinas del mundo. Representa al propio Reino Medio."
  trait_art_nei_tan: "Nei Tan"
  trait_art_nei_tan_desc: "En el lenguaje común de los Hsien, Nei Tan es la \"Alquimia Interna\", magia taoísta Wu Tan practicada por los shinma que persiguen el [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')]."
  
  trait_art_chicanery_advanced: "Maestría del Arte de Chicanería"
  trait_art_chicanery_advanced_desc: "La Chicanería es el poder mágico engañoso de la ilusión y la manipulación emocional. Aquellos que la practican extensamente suelen ser considerados algo indignos de confianza por los nobles." 
  trait_art_legerdemain_advanced: "Maestría del Arte de Prestidigitación"
  trait_art_legerdemain_advanced_desc: "La Prestidigitación permite a un changeling controlar su entorno mediante medios telequinéticos, desde robar bolsillos a distancia hasta agarrar y lanzar grandes objetos. Este Arte también permite la creación de objetos y criaturas ilusorios sólidos." 
  trait_art_primal_advanced: "Maestría del Arte de Primitiva"
  trait_art_primal_advanced_desc: "Primitiva permite a un changeling manipular las fuerzas de la naturaleza, desde invocar los elementos hasta comulgar con objetos inanimados. También otorga poder sobre el cuerpo, permitiendo a un fae endurecer su piel como la corteza de un árbol, curar heridas, desgarrar la carne e incluso cambiar de forma." 
  trait_art_soothsay_advanced: "Maestría del Arte de Adivinación"
  trait_art_soothsay_advanced_desc: "La Adivinación representa la capacidad del changeling para ver el futuro. Dependiendo de los reinos utilizados en conjunción, el changeling puede ser capaz de obtener información sobre una persona, lugar u objeto." 
  trait_art_wayfare_advanced: "Maestría del Arte de Viaje"
  trait_art_wayfare_advanced_desc: "El Arte de Viaje trata sobre la capacidad de un changeling para moverse a través del espacio. Esto implica rebotar y cubrir grandes distancias, avanzar a una velocidad imposible e incluso teletransportarse de un lugar a otro." 
  trait_art_chronos_advanced: "Maestría del Arte de Chronos"
  trait_art_chronos_advanced_desc: "Chronos es el Arte de la manipulación temporal. A diferencia de los métodos para alterar el tiempo conocidos por otros seres sobrenaturales, Chronos es bastante indirecto y casi nunca sigue un orden lineal; en su lugar, es un Arte de estar disjunto del orden adecuado del tiempo, lo que hace que sus practicantes sean difíciles de afectar con magia de Tiempo y pierdan de vista cómo debería funcionar el tiempo." 
  trait_art_dream_craft_advanced: "Maestría del Arte de Ensueño"
  trait_art_dream_craft_advanced_desc: "Ensueño es el Arte de manipular la materia prima de la que está hecho el [UmbraGlossary('dreaming')]. Este arte permite a los Sidhe cambiar las formas físicas dentro del [UmbraGlossary('dreaming')], lo que puede afectar la apariencia de los feudos y otros santuarios del [UmbraGlossary('dreaming')]. También puede afectar al voile, la vestimenta quimérica que los changelings visten mientras están en el [UmbraGlossary('dreaming')]." 
  trait_art_naming_advanced: "Maestría del Arte de Nombramiento"
  trait_art_naming_advanced_desc: "Nombramiento es el Arte de los [Glossary('True Names','podgloss.truename')] y el poder de las palabras. Es uno de los Artes más insidiosos conocidos por los Kithain, ya que aunque sus niveles bajos son engañosamente inofensivos, un maestro del Nombramiento puede causar fácilmente daños irreparables. Los usos excesivamente frívolos del Nombramiento no son tomados a la ligera por la nobleza, que imparte justicia rápidamente a quienes subvierten sus efectos." 
  trait_art_sovereign_advanced: "Maestría del Arte de Soberanía"
  trait_art_sovereign_advanced_desc: "Soberanía es el Arte de controlar a los plebeyos y la majestad noble. Es uno de los Artes más políticos practicados comúnmente por los Kithain, y existe en gran medida para asegurar el mantenimiento de sus estructuras políticas." 
  trait_art_infusion_advanced: "Maestría del Arte de Infusión"
  trait_art_infusion_advanced_desc: "Infusión es el Arte que ayuda a los Nockers a crear todos sus maravillosos objetos de relojería y quiméricos. Implica la conexión de \"FUBARS\" y otras entidades quiméricas en formas físicas o quiméricas." 
  trait_art_tale_craft_advanced: "Maestría del Arte de Narración"
  trait_art_tale_craft_advanced_desc: "Narración es el Arte Eshu de contar historias maravillosas, mediante la provisión de efectos especiales, la lectura de la audiencia y la manipulación de sus emociones. El [bunk|E] para un cantrip de Narración es, con pocas excepciones, una historia, ya sea hablada o cantada." 
  trait_art_aphrodesia_advanced: "Maestría del Arte de Afrodisia"
  trait_art_aphrodesia_advanced_desc: "Afrodisia es el Arte de la seducción. La versión fae de la \"Poción de Amor Número 9\", que va desde una atracción decente hasta que el sujeto esté dispuesto a matarse por el objeto de su afecto."
  trait_art_kryos_advanced: "Maestría del Arte de Kryos"
  trait_art_kryos_advanced_desc: "Kryos es el Arte del frío y el hielo. A diferencia de otros artes elementales conocidos por los changelings, los poderes de Kryos son bastante literales, causando frío real en lugar de escalofríos metafóricos. Algunos temen que este Arte esté estrechamente conectado con la Banalidad, dada su naturaleza inmovilizadora y paralizante."
  trait_art_metamorphosis_advanced: "Maestría del Arte de Metamorfosis"
  trait_art_metamorphosis_advanced_desc: "Metamorfosis es el Arte de cambiar la forma de los seres vivos. Difiere notablemente de Primitiva en que, mientras que Primitiva se relaciona con dar forma a lo no vivo, Metamorfosis da forma a lo vivo. A través de ella, una fae puede convertirse fácilmente en lo que quiera, aunque solo sea por un corto tiempo."
  trait_art_pyretics_advanced: "Maestría del Arte de Pirética"
  trait_art_pyretics_advanced_desc: "Pirética es el arte de manipular el fuego real y quimérico. Además de prender fuego a las cosas, la Pirética también puede aprovechar los aspectos menos destructivos del fuego, iluminando el camino y revelando lo invisible."
  trait_art_petros_advanced: "Maestría de Petros"
  trait_art_petros_advanced_desc: "Petros, una de las dos Astillas de Tierra, gobierna el dar forma a la piedra e imbuir al lanzador con las propiedades físicas de la roca sólida. Todos los Inanimae que conocen Petros pueden trepar por una superficie rocosa con poca dificultad."
  trait_art_aquis_advanced: "Maestría de Aquis"
  trait_art_aquis_advanced_desc: "Aquis es la Astilla de Agua, que controla el movimiento del agua a través de la atmósfera, además de reflejar la asociación del agua con la empatía y la medicina. Todos los Inanimae que conocen Aquis son capaces de respirar bajo el agua y saben nadar automáticamente."
  trait_art_pyros_advanced: "Maestría de Pyros"
  trait_art_pyros_advanced_desc: "Pyros es la Astilla de Fuego, que produce calor y combustión espontánea, además de afectar simbólicamente a la pasión de sangre caliente. Todos los Inanimae que conocen Pyros pueden encender una pequeña llama sin necesidad de cerillas ni equipo."
  trait_art_stratus_advanced: "Maestría de Stratus"
  trait_art_stratus_advanced_desc: "Stratus es la Astilla de Aire, que despista tanto mediante movimientos cegadoramente rápidos como produciendo ilusiones brumosas. Todos los Inanimae que conocen Stratus pueden sentir los patrones climáticos que se aproximan desde kilómetros de distancia."
  trait_art_verdage_advanced: "Maestría de Verdage"
  trait_art_verdage_advanced_desc: "Verdage, una de las dos Astillas de Tierra, gobierna la vida y la materia orgánica, especialmente la que compone las plantas. Todos los Inanimae que conocen Verdage son capaces de identificar inmediatamente la vida vegetal que ven."
  trait_art_tieh_tan_advanced: "Maestría de Tieh Tan"
  trait_art_tieh_tan_advanced_desc: "El elemento Metal incluye todos los metales preciosos y de trabajo: oro, plata, hierro, latón y acero. Aunque su alcance es bastante limitado comparado con el Agua o la Tierra, su uso abrumador es para fabricar herramientas, especialmente para la guerra. Los Maestros del Metal pueden ser artesanos increíbles o guerreros inexpugnables."
  trait_art_lin_tan_advanced: "Maestría de Lin Tan"
  trait_art_lin_tan_advanced_desc: "La Madera representa el poder del mundo natural y, como tal, tiene poder sobre gran parte del mundo. Los fenómenos naturales con los que se asocia son cualquier tipo de planta, la juventud, la salud y el crecimiento."
  trait_art_shui_tan_advanced: "Maestría de Shui Tan"
  trait_art_shui_tan_advanced_desc: "El Shui Fu, o Ministerio del Agua, es la fuerza más poderosa, sutil pero ineficiente del Reino Medio. Los Maestros del Agua son temidos y venerados, pero la mayoría sirve por miedo.\nEl Agua es uno de los elementos más poderosos. Abarca todas las cosas líquidas y gaseosas: nubes, metano, agua, sangre, etc. El Agua es inherentemente vital pero peligrosa y engañosa. También controla los vientos y las tormentas, pero no los rayos."
  trait_art_hou_tan_advanced: "Maestría de Hou Tan"
  trait_art_hou_tan_advanced_desc: "Los Maestros del Fuego son oponentes astutos y gobernantes activos. Tienden a ser incapaces de descansar y buscan constantemente la actividad y la participación. El Fuego se asocia con los rayos, la luz, la llama y todas las demás energías visibles. Se encuentra en tormentas, llamas abiertas, pantallas de ordenador y magma ardiente."
  trait_art_di_tan_advanced: "Maestría de Di Tan"
  trait_art_di_tan_advanced_desc: "Los Maestros de Di Tan suelen ser consejeros sabios o, a veces, mandarines temibles. Los Yü consideran particularmente que los Maestros de la Tierra son gobernantes perspicaces y equilibrados. Muchos hsien acudirán al estandarte amarillo de uno de ellos.\nLa Tierra representa toda la roca, el suelo, la piedra, las gemas y los minerales. La Tierra es el centro de todos los elementos y el fulcro de las percepciones chinas del mundo. Representa al propio Reino Medio."
  trait_art_nei_tan_advanced: "Maestría de Nei Tan"
  trait_art_nei_tan_advanced_desc: "En el lenguaje común de los Hsien, Nei Tan es la \"Alquimia Interna\", magia taoísta Wu Tan practicada por los shinma que persiguen el [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')]."
  
  trait_faerie_eternity: "Eternidad de las Hadas"
  trait_faerie_eternity_desc: "Después de pasar por tu Crisálida, tuviste un cumpleaños, y luego otro, y luego otro. Sin embargo, algo era extraño: no parecías estar creciendo ni envejeciendo. Estás tocado por un vestigio de la inmortalidad que solía ser el derecho de nacimiento de todas las hadas."
  
  trait_prodigal: "Pródigo"
  trait_enchanted_dreamers: "Soñadores Encantados"
  trait_dark_chimera: "Quimera Oscura"
  trait_prodigal_vampire_desc: "El primer vampiro fue un Redcap Unseelie de hace mucho tiempo que juró un juramento de sangre de amistad con su rival Sidhe Seelie después de que ninguno pudiera vencer al otro en combate. Se convirtieron en hermanos y realizaron hazañas poderosas; pero, cuando mataron a un dragón, el Sidhe se llevó todo el mérito. Indignado, el Redcap le arrancó la cabeza a su antiguo rival frente al Rey del reino, rompiendo su juramento. \"La sangre fue su crimen, la sangre fue su legado, y así la sangre sería la raíz de su poder\", según cuenta la historia, y fue maldecido con el vampirismo, para nunca volver a conocer el [UmbraGlossary('dreaming')]."
  trait_prodigal_mage_desc: "Los Magos son mortales, pero que han Despertado a una conciencia del [UmbraGlossary('dreaming')], y cuyos talentos y magias del [UmbraGlossary('dreaming')] son mucho más poderosos que los de los Kithain. El mito changeling dice que son los descendientes de cuatro niños que cayeron del cielo y destruyeron los poderosos ejércitos de los nobles fae que los descubrieron. Esos niños eran Té la Loca (madre del cambio), Li la Sombra (madre del equilibrio), Ihenn el Hacedor de Hierro (padre de la estasis) y Chla el Desatado (padre de la decadencia)."
  trait_prodigal_fera_desc: "Los hombres lobo y los demás $glossary_fera$ son descendientes de hadas que, no deseando renunciar por completo a la libertad de forma que poseían las hadas en los días de antaño, eligieron adoptar formas animales además de las humanoides. Estas hadas eran las más cercanas a la Tierra, y cuando una gran y terrible Oscuridad surgió para engullir la tierra, abandonaron impacientemente los ineficaces consejos de planificación de las hadas para lanzarse de cabeza a la batalla contra el enemigo. Aunque lograron evitar la victoria de la Oscuridad, pagaron un gran precio: la pérdida de todos sus sueños, excepto el sueño de la batalla."
  trait_prodigal_demon_desc: "La Casa Balor afirma su experiencia en el tema de los demonios y las entidades demoníacas, atribuyéndose la responsabilidad de la histórica invocación y atadura de múltiples criaturas de este tipo en sus guerras contra las Cortes Fomorianas. La Casa Balor afirma que los demonios eran hadas antiguas en una época en la que el Invierno estaba sobre el mundo, pero su tiempo pasó y fueron exiliados a un laberinto en el [UmbraGlossary('deep_dreaming')]. Su escape solo se permitiría cuando la necesidad fuera desesperada."
  trait_prodigal_wraith_desc: "Los fantasmas son quimeras oscuras, pero quimeras que se crean a sí mismas a partir de los recuerdos de quienes mueren. Solo las almas más creativas, imaginativas y apasionadas se reforman en la oscura realidad quimérica llamada las [UmbraGlossary('shadowlands')]. (Aparte de esta perspectiva ligeramente diferente, los Changelings —gracias a los Sluagh— tienen una comprensión bastante precisa de los wraiths)."
  trait_prodigal_mummy_desc: "Los registros Eshu afirman que las momias fueron antaño mortales encantados que se hicieron uno con la realidad quimérica del [UmbraGlossary('dreaming')]. Estos encantados juraron votos a grandes y nobles arcadianos, y a través de pactos sellados en cuerpo y espíritu se comprometieron eternamente con las causas de sus dioses fae. Sus cuerpos nunca se pudrirían y sus espíritus nunca seguirían adelante, mientras sirvieran a sus maestros y mantuvieran el equilibrio entre los reinos de lo mundano y lo sublime."

  trait_agemo: "Agemo"
  trait_agemo_desc: "En el lenguaje común de los Eshu, Agemo significa literalmente camaleón. La palabra es utilizada por los Elegbara para sus kinain, ya que se mezclan tanto con la sociedad de las hadas como con la mortal."
  trait_itiyere: "Itiyere"
  trait_itiyere_desc: "Entre los Eshu, Itiyere es un término de argot poco común para los Sidhe y proviene de personajes ceremoniales tradicionales con orejas largas extremadamente exageradas."
  trait_orisha_oko: "Orisha-Oko"
  trait_orisha_oko_desc: "Orisha-Oko es el orisha de la agricultura y el hogar. Los Eshu se refieren al kith Boggan por este nombre o por la versión abreviada Oko."
  trait_taiyewo: "Taiyewo"
  trait_taiyewo_desc: "En el lenguaje común de los Eshu, Taiyewo significa \"el mayor de los gemelos\". Es el nombre Elegbara para el kith Clurichaun. Ver también Ibeji y Kehinde."
  trait_iroko: "Iroko"
  trait_iroko_desc: "En el lenguaje común de los Eshu, Iroko es una variedad de roble y un Orisha menor. También es el nombre Elegbara para el kith Ghille Dhu."
  trait_olokuta: "Olokuta"
  trait_olokuta_desc: "Olokuta es el Orisha de la piedra. Este es también el nombre Eshu para el kith Nocker."
  trait_kehinde: "Kehinde"
  trait_kehinde_desc: "En el lenguaje común de los Eshu, Kehinde se traduce como el último nacido de los gemelos. También es el nombre Elegbara para el kith Piskey. Ver también Ibeji y Taiyewo."
  trait_ijapa: "Ijapa"
  trait_ijapa_desc: "En el lenguaje común de los Eshu, Ijapa significa literalmente tortuga y era el animal embaucador de la leyenda Yoruba. Es el nombre Elegbara para el kith Pooka."
  trait_jakuta: "Jakuta"
  trait_jakuta_desc: "En el lenguaje común de los Eshu, Jakuta es un nombre de alabanza para el orisha del rayo Shango, que significa \"Lanzador de Piedras\". Es el nombre Elegbara para el kith Troll."
  trait_oshosi: "Oshosi"
  trait_oshosi_desc: "Oshosi, u Oxóssi, es el orisha de la caza, el bosque, los animales salvajes y la riqueza. También se asocia con las comidas. Sus colores son el azul y el verde. Los Eshu usan este nombre para el kith Redcap."
  trait_olu_igbo: "Olu-Igbo"
  trait_olu_igbo_desc: "Olu-Igbo es el Orisha de la maleza y las tierras vírgenes. En el lenguaje común de los Eshu también es el término para el kith Sátiro."
  trait_sonponno: "Sonponno"
  trait_sonponno_desc: "Sonponno o Sopona, es el Orisha de la viruela y, por extensión, de otras enfermedades, especialmente las que producen llagas o lesiones. Otros nombres incluyen Babalú-Ayé y el nombre de alabanza Ile-Titu. Los Eshu usan este nombre para el kith Sluagh, derivado de su apariencia y no generalmente despectivo."
  
  trait_domovoi: "Domovoi"
  trait_domovoi_desc: "Un poderoso fae de las viviendas, un domovoi a menudo toma la apariencia de una persona respetada de la familia para hablar con aquellos cuyo hogar protege. Conocen la mayoría de los secretos de su feudo. A menos que se les dé un respeto adecuado y constante, los domovoi pueden divulgar estos secretos a los enemigos."
  trait_leshii: "Leshii"
  trait_leshii_desc: "Espíritus cornudos del bosque, los leshii parecen una combinación de un viejo árbol cubierto de musgo y un humano con astas. Se refieren a su líder como el \"Señor del Bosque\"."
  trait_kikimora: "Kikimora"
  trait_kikimora_desc: "La fae más servicial del hogar, la kikimora realiza tareas como tejer y otras labores domésticas. Cualquiera que las vea trabajar debe asegurarse de admirar sus talentos o puede encontrar pan quemado, ropa anudada o frascos llenos de vinagre en represalia."
  trait_polevik: "Polevik"
  trait_polevik_desc: "Exuberantes y voluptuosas, estas ninfas de los campos, tanto masculinas como femeninas, encuentran fascinación en los diversos ritos de fertilidad practicados por quienes comprenden la conexión entre el sexo y el arado de la tierra fértil."
  trait_vodyanoi: "Vodyanoi"
  trait_vodyanoi_desc: "Estos mercuriales Inanimae de lagos y estanques son amigables con quienes usan las Anclas que protegen, siempre que reciban regalos y respeto. Los problemas siguen a quienes ignoran la necesidad de un agradecimiento adecuado y un chorrito ocasional de vodka en el agua. Los vodyanoi vuelcan los botes de quienes no los tratan adecuadamente. Cualquiera que los desprecie deliberadamente debe recordar mantenerse alejado del agua si desea sobrevivir, pues los vodyanoi pueden invocar rayos sobre quienes les desagradan."
  trait_berenginy: "Berenginy"
  trait_berenginy_desc: "Hermosas ninfas de larga cabellera oscura, estas encantadoras fae cantan para atraer a los amantes, pero a veces no desean dejarlos ir. Habitan a lo largo de las riberas de los ríos y arrastrarán a sus admiradores para que se queden con ellas para siempre en las aguas turbias de la orilla. Muchas russalki se han creado de esta manera. Si no fuera por su sabiduría y su capacidad para saber casi todo lo que sucede a lo largo del río al que sirven, los peligros de consultarlas superarían cualquier beneficio."
  trait_bannik: "Bannik"
  trait_bannik_desc: "El espíritu de la casa de baños, el bannik suele ser malicioso si no se le trata con deferencia y se le da el último baño de la noche. Los banniks ayudan a quienes favorecen dándoles visiones en las aguas que controlan."
  trait_dvorovoi: "Dvorovoi"
  trait_dvorovoi_desc: "Un hada animal del patio, el dvorovoi puede ser muy travieso con quienes no lo alimentan o tratan bien. A menudo toman la forma de gatos para vagar y explorar su territorio."
  
  trait_enchanted: "Encantado"
  trait_enchanted_desc: "Infundido con Glamour."
  TRAIT_FLAG_DESC_warning_enchanted_flag: "\n#X Para los que no tienen sangre de hada, ganan glamour temporal que disminuye en #V 1#! cada #V 3#! meses. Perderás este rasgo cuando tu glamour temporal llegue a #V 0#!.#!"
  
  trait_patron_council: "Patrón"
  trait_patron_council_seeker: "Buscador"
  trait_patron_council_seeker_desc: "La facción central se conoce como los Buscadores. Son el corazón de los Patrones, aquellas hadas que se aferran más a las antiguas leyendas del sistema de consejo de 'gobierno compartido'. Con una visión liberal de cada Origen, y una membresía extraída casi por igual de los tres, estas hadas creen verdaderamente en las ramificaciones ideológicas que el gobierno compartido podría traer. Los Buscadores están compuestos principalmente por hadas eruditas y tradicionalistas y, como tales, tienen una presencia relativamente discreta ante el público. Esta es la facción del Consejo de Patrones que profundiza en los tomos de las antiguas leyendas y envía buscadores tras el rastro de incluso el rumor más vago de la historia de las hadas. Artefactos perdidos, manuscritos frágiles que hablan de la era pasada, incluso armas y objetos de artesanía antigua: todos estos son pistas de los caminos del pasado, y son inestimables para la causa de los Buscadores."
  trait_patron_council_vanguard: "Vanguardia"
  trait_patron_council_vanguard_desc: "La Vanguardia son los Patrones. Al menos, son lo que la inmensa mayoría de las hadas piensan cuando se menciona a los Patrones. La Vanguardia ocupa un papel único en el Consejo de Patrones, ya que sus miembros son la cara pública de la organización. Más que un grupo formal y unido, la Vanguardia es generalmente solo aquellas hadas que ensalzan vocal y visiblemente las virtudes de los Patrones y apoyan su causa. La mayoría de los políticos, diplomáticos, asesores y otras estrellas sociales del Consejo de Patrones se agrupan bajo el término Vanguardia, utilizado sin afecto por todos los que están fuera de esta \"facción dentro de una facción\". No hace falta decir que los miembros de esta facción son una raza diversa con tantas ideologías y agendas diferentes como hadas mismas. Más que una colección cohesiva de hadas que están de acuerdo sobre el verdadero pasado de la raza, una abrumadora mayoría de la Vanguardia está simplemente en el juego de la política por una sola cosa."
  trait_patron_council_austere_conclave: "Miembro del Cónclave Austero"
  trait_patron_council_austere_conclave_desc: "El Cónclave Austero no existe. A diferencia de los Buscadores, que están ocultos por la delicadeza de su tarea, el Cónclave Austero está protegido del ojo público porque sus miembros lo desean activamente así.\nPara los Patrones en su conjunto, el Cónclave Austero es peligroso, impredecible, poco fiable, desestabilizador... y extremadamente útil. Es la fuente de muchos de los feos rumores sobre los Patrones: historias de asesinatos, emboscadas, mensajeros interceptados, comunicaciones filtradas entre cortes aliadas... todo esto y más. Cuando una fae susurra a sus amigos que los Patrones mataron a Lady Davina por la razón que sea, normalmente se refiere sin saberlo a las acciones no autorizadas del Cónclave Austero."

  trait_siochain: "Síocháin"
  trait_siochain_desc: "La leyenda habla de hadas que han logrado lo imposible y han encontrado el delicado equilibrio entre su ser mortal y el alma de hada que llevan dentro. Se cree que los Síocháin, como se les llama, han descubierto el equilibrio entre el Glamour y la Banalidad y, por lo tanto, han encontrado la verdadera inmortalidad."
  TRAIT_FLAG_DESC_banality_immunity: "Inmune a la Banalidad en cualquier forma"
