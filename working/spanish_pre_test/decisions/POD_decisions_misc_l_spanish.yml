 #Challenge House Head
 challenge_house_head_decision: "Desafiar el liderazgo de la casa"
 challenge_house_head_decision_desc: "Verdaderamente, nadie más que vos puede llevar vuestro estimado linaje a la gloria. Es solo cuestión de hacer que los demás lo entiendan (o al menos lo acepten)."
 challenge_house_head_decision_tooltip: "Mi linaje me necesita."
 challenge_house_head_decision_confirm: "¡Ahora mando yo!"
 challenge_house_head_decision_effect_tooltip: "Dependiendo del paradero actual del cabeza de vuestra casa, se os presentarán varias opciones para usurpar su posición." 
 
 POD_diarchy_events.0005.desc: "Algunos clanes vampíricos están más interesados en su linaje que otros, siendo los Ventrue un ejemplo de ello, pero todos conceden al menos cierto respeto a este concepto. Al fin y al cabo, esto se convierte fácilmente en un hecho cuando los ancianos de vuestra \"familia\" suelen tener siglos (o más) de antigüedad y son mucho más poderosos que los jóvenes neonatos que se revuelven en la base.\nAun así, no es inaudito que miembros más jóvenes tomen las riendas de los asuntos de su linaje. Quizás sus ancianos se han aburrido o actúan en una esfera de influencia completamente diferente a las maquinaciones políticas nocturnas de los condenados. Sin embargo, es raro que uno ceda voluntariamente la elevada posición de cabeza de casa sin al menos algún tipo de prueba o compensación.\nLas cenizas de los advenedizos que han subestimado a sus mayores podrían cubrir una zona bastante extensa."
 POD_diarchy_events.0005.a: "¡Soy más capaz que alguna bella durmiente!"
 challenge_house_head_torpor: "El cabeza de vuestra casa está en letargo. El único obstáculo para reclamar el liderazgo de la casa será el desprecio y la envidia de vuestros compañeros de casa."
 POD_diarchy_events.0005.b: "Pensándolo mejor..."
 POD_diarchy_events.0005.c: "¿Queréis un favor? Bueno..."
 POD_diarchy_events.0005.d: "¡En garde!"
 POD_diarchy_events.0005.duelwin: "¡Ahora mando yo!"
 POD_diarchy_events.0005.duelloss: "Eso salió mal..."
 POD_diarchy_events.0005.e: "¡Debo convencer a mi casa!"
 POD_diarchy_events.0005.f: "¿Simplemente me lo entregáis?"
 challenge_house_head_content: "El satisfecho cabeza de vuestra casa está feliz de dejaros tomar las riendas. Sin embargo, vuestra casa está menos que satisfecha con esta flagrante toma de poder."
 
 challenged_house_head_modifier: "Advenedizo cabeza de casa"
 challenged_house_head_modifier_desc: "Mentes mezquinas que no comprenden vuestra grandeza inherente."
 
 #Torture All Prisoners
 POD_torture_all_prisoners_decision: "Torturar a todos los prisioneros"
 POD_torture_all_prisoners_decision_desc: "$POD_torture_all_prisoners_decision_tooltip$.\n#weak Esta decisión tiene los mismos resultados que la [character_interaction|E] de torturar. Debido a limitaciones técnicas, no se muestran todos los efectos.#!"
 POD_torture_all_prisoners_decision_tooltip: "Torturaréis a todos los que estén en vuestra [prison|E]"
 POD_torture_all_prisoners_decision_confirm: "Tenía que hacerse"
 POD_torture_all_prisoners_decision_effect: "[GetPlayer.MakeScope.ScriptValue('mass_torture_num_of_prisoners')|V0] [prisoners|E] serán torturados. No descubriréis ningún [secrets|E] de esta manera."
 POD_torture_all_prisoners_decision_effect_stress_sadistic: "Como sois [GetTrait('sadistic').GetName(GetPlayer)], perderéis [stress|E]."
 POD_torture_all_prisoners_decision_effect_stress_zealous: "Como sois [GetTrait('zealous').GetName(GetPlayer)], perderéis [stress|E] por cada infiel que torturéis."
 POD_torture_all_prisoners_decision_effect_stress_gain: "Podríais ganar una cantidad masiva de [stress|E] ya que tenéis una personalidad benévola #weak (rasgos [GetTrait('compassionate').GetName(GetNullCharacter)], [GetTrait('craven').GetName(GetNullCharacter)], [GetTrait('just').GetName(GetNullCharacter)], [GetTrait('forgiving').GetName(GetNullCharacter)], [GetTrait('generous').GetName(GetNullCharacter)], [GetTrait('trusting').GetName(GetNullCharacter)], o [GetTrait('content').GetName(GetNullCharacter)])#!"
