 POD_change_predatortype.1.t: "Cambiar tipo de depredador"
 POD_change_predatortype.1.desc: "¿Estáis seguro de que deseáis cambiar vuestro tipo de depredador?\n\nEsta opción no volverá a estar disponible hasta que hayan pasado 50 años.\n\nBajo ciertas condiciones podríais veros obligado a cambiar de tipo de depredador, como por ejemplo si vuestro tipo de depredador ya no es válido.\n\n #warning ¡Si elegís la tercera opción, eliminaréis esta decisión para siempre para vuestro personaje actual!#!"
