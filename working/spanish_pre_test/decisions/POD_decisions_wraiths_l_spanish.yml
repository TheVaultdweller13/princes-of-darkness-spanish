l_spanish:
 POD_wraith_passion_gaining_passions_decision: "Obtener Pasiones"
 POD_wraith_passion_gaining_passions_decision_desc: "Vuestras Pasiones son el núcleo de vuestro ser, y parte de lo que os ha mantenido aferrado a la existencia. Nunca dejáis de buscar debido a vuestro amor arrollador, o el fuego de la venganza sigue ardiendo y no se detendrá hasta que hagáis justicia. Independientemente de los detalles, os obligan a persistir."
 POD_wraith_passion_gaining_passions_decision_tooltip: "Elegiréis nuevas Pasiones."
 POD_wraith_passion_gaining_passions_decision_confirm: "Permitidme empezar con..."

 POD_wraith_passion_find_killer_decision: "Pasión: Encontrar a mi asesino"
 POD_wraith_passion_find_killer_decision_desc: "Nada como el fuego de la venganza para mantener la pasión ardiendo al rojo vivo."
 POD_wraith_passion_find_killer_decision_tooltip: "Terminaréis esta Pasión."
 POD_wraith_passion_find_killer_decision_confirm: "¿No esperabais que volviera, eh?"
 POD_wraith_passion_find_killer_decision_condition: "Vuestro asesino, [TARGET_CHARACTER.GetFirstName], debe estar muerto."
 
 POD_wraith_passion_amass_wealth_decision: "Pasión: Acumular riqueza"
 POD_wraith_passion_amass_wealth_decision_desc: "La codicia es buena y el propio inframundo funciona bajo este principio fundamental. La muerte no os impedirá haceros rico."
 POD_wraith_passion_amass_wealth_decision_tooltip: "Terminaréis esta Pasión."
 POD_wraith_passion_amass_wealth_decision_confirm: "¿Quizás una necrópolis de oro?"
 
 POD_wraith_passion_become_exalted_decision: "Pasión: Ser exaltado entre los muertos"
 POD_wraith_passion_become_exalted_decision_desc: "La gloria y la adoración os impulsan. Con vuestra muerte la multitud ha cambiado, pero el objetivo en sí no."
 POD_wraith_passion_become_exalted_decision_tooltip: "Terminaréis esta Pasión."
 POD_wraith_passion_become_exalted_decision_confirm: "La gloria es eterna, después de todo."
 
 POD_wraith_passion_become_paragon_decision: "Pasión: Convertirse en parangón de la Trascendencia"
 POD_wraith_passion_become_paragon_decision_desc: "Si vuestro celo no os ofreció el Paraíso como esperabais, aún podría ser la clave para vuestra existencia continuada."
 POD_wraith_passion_become_paragon_decision_tooltip: "Terminaréis esta Pasión."
 POD_wraith_passion_become_paragon_decision_confirm: "¿Una prueba de fe superada?"
 
 POD_wraith_passion_create_a_treasury_decision: "Pasión: Crear un tesoro"
 POD_wraith_passion_create_a_treasury_decision_desc: "Los artefactos y las reliquias son una mercancía rara en el inframundo. Aquellos que los acaparan pueden ascender rápidamente en influencia y poder."
 POD_wraith_passion_create_a_treasury_decision_tooltip: "Terminaréis esta Pasión."
 POD_wraith_passion_create_a_treasury_decision_confirm: "¡Mi tesoro!"
 POD_wraith_passion_create_a_treasury_decision_conditiona: "Debéis tener #V 3#! artefactos de rareza común o superior en vuestra posesión"
 POD_wraith_passion_create_a_treasury_decision_conditionb: "Debéis tener #V 3#! artefactos de rareza magistral o superior en vuestra posesión"
 POD_wraith_passion_create_a_treasury_decision_conditionc: "Debéis tener #V 3#! artefactos de rareza ilustre o superior en vuestra posesión"
 POD_wraith_passion_create_a_treasury_decision_conditiond: "Debéis tener #V 3#! artefactos de rareza excepcional en vuestra posesión"
 
 POD_wraith_passion_build_a_great_work_decision: "Pasión: Construir una Maravilla"
 POD_wraith_passion_build_a_great_work_decision_desc: "Algunas maravillas arquitectónicas sobreviven a su arquitecto. Vos intentaréis lo contrario."
 POD_wraith_passion_build_a_great_work_decision_tooltip: "Terminaréis esta Pasión."
 POD_wraith_passion_build_a_great_work_decision_confirm: "¡Grandioso!"
 POD_wraith_passion_build_a_great_work_decision_condition: "El edificio especial, en [TARGET_TITLE.GetNameNoTier], debe estar construido."
 
 POD_wraith_passion_make_a_friend_decision: "Pasión: Hacer un mejor amigo"
 POD_wraith_passion_make_a_friend_decision_desc: "La miseria ama la compañía, después de todo."
 POD_wraith_passion_make_a_friend_decision_tooltip: "Terminaréis esta Pasión."
 POD_wraith_passion_make_a_friend_decision_confirm: "¿Una amistad para toda la eternidad?"
 
 POD_wraith_passion_protect_family_decision: "Pasión: Proteger a mi familia"
 POD_wraith_passion_protect_family_decision_desc: "Llevan una parte de vos mismo y pueden seguir haciéndolo para siempre... si sobreviven."
 POD_wraith_passion_protect_family_decision_tooltip: "Terminaréis esta Pasión."
 POD_wraith_passion_protect_family_decision_confirm: "Velando por ellos..."
 POD_wraith_passion_protect_family_decision_condition: "Nadie en vuestra familia ha muerto en #V 1#! año."
 passion_fail_notification: "Pasión destruida"
 passion_fail_protect_family_tooltip: "Un miembro de vuestra familia ha muerto."
 
 POD_wraith_passion_kill_rival_decision: "Pasión: Matar a mi rival"
 POD_wraith_passion_kill_rival_decision_desc: "Nada como el fuego de la venganza para mantener la pasión ardiendo al rojo vivo."
 POD_wraith_passion_kill_rival_decision_tooltip: "Terminaréis esta Pasión."
 POD_wraith_passion_kill_rival_decision_confirm: "¿No esperabais que volviera, eh?"
 POD_wraith_passion_kill_rival_decision_condition: "Vuestro rival, [TARGET_CHARACTER.GetFirstName], debe estar muerto."
 
 POD_wraith_fetter_adquire_fetters_decision: "Adquirir [Fetters|E]"
 POD_wraith_fetter_adquire_fetters_decision_desc: "Es raro que un wraith desarrolle un nivel de apego lo suficientemente profundo hacia alguna persona o cosa nueva en las [Glossary('Skinlands','game_concept_skinlands_desc')] como para crear un verdadero [Fetter|E], pero no es imposible."
 POD_wraith_fetter_adquire_fetters_decision_tooltip: "Comprar un nuevo [Fetter|E]."
 POD_wraith_fetter_adquire_fetters_decision_confirm: "¿Algo por lo que valga la pena existir?"

 POD_wraith_dark_passion_start_a_hostile_scheme_decision: "Pasión Oscura: Iniciar una intriga hostil"
 POD_wraith_dark_passion_start_a_hostile_scheme_decision_desc: "Tienen todo lo que queréis y ni siquiera lo disfrutan. Hacedles pagar."
 POD_wraith_dark_passion_start_a_hostile_scheme_decision_tooltip: "Terminaréis esta Pasión Oscura."
 POD_wraith_dark_passion_start_a_hostile_scheme_decision_confirm: "Ahora lo entienden."

 POD_wraith_dark_passion_start_a_seduction_decision: "Pasión Oscura: Iniciar una intriga de seducción"
 POD_wraith_dark_passion_start_a_seduction_decision_desc: "¿Qué mejor manera de hundir a alguien que rompiéndole el corazón?"
 POD_wraith_dark_passion_start_a_seduction_decision_tooltip: "Terminaréis esta Pasión Oscura."
 POD_wraith_dark_passion_start_a_seduction_decision_confirm: "Una trágica historia de amor."

 POD_wraith_dark_passion_start_a_war_decision: "Pasión Oscura: Iniciar una guerra"
 POD_wraith_dark_passion_start_a_war_decision_desc: "Tantas muertes inútiles por una causa que ni siquiera entenderán."
 POD_wraith_dark_passion_start_a_war_decision_tooltip: "Terminaréis esta Pasión Oscura."
 POD_wraith_dark_passion_start_a_war_decision_confirm: "Tantos nuevos wraiths..."

 POD_wraith_dark_passion_raise_tyranny_decision: "Pasión Oscura: Aumentar la tiranía"
 POD_wraith_dark_passion_raise_tyranny_decision_desc: "En la muerte no hay reglas. Excepto las vuestras."
 POD_wraith_dark_passion_raise_tyranny_decision_tooltip: "Terminaréis esta Pasión Oscura."
 POD_wraith_dark_passion_raise_tyranny_decision_confirm: "Aprenderán a obedecer."

 POD_wraith_dark_passion_exceeding_the_domain_limit_decision: "Pasión Oscura: Superar el límite de dominio"
 POD_wraith_dark_passion_exceeding_the_domain_limit_decision_desc: "Aún no estáis en todas partes. Cambiad eso de inmediato."
 POD_wraith_dark_passion_exceeding_the_domain_limit_decision_tooltip: "Terminaréis esta Pasión Oscura."
 POD_wraith_dark_passion_exceeding_the_domain_limit_decision_confirm: "Mucho mejor."

 POD_wraith_dark_passion_exceeding_the_vassal_limit_decision: "Pasión Oscura: Superar el límite de vasallos"
 POD_wraith_dark_passion_exceeding_the_vassal_limit_decision_desc: "Es hora de empezar a construir la escalera del caos."
 POD_wraith_dark_passion_exceeding_the_vassal_limit_decision_tooltip: "Terminaréis esta Pasión Oscura."
 POD_wraith_dark_passion_exceeding_the_vassal_limit_decision_confirm: "Estarán bien... o no. Como si me importara."

 POD_wraith_dark_passion_blackmail_decision: "Pasión Oscura: Chantaje"
 POD_wraith_dark_passion_blackmail_decision_desc: "¿Creen que sus secretos valen algo? Es hora de demostrarles lo contrario."
 POD_wraith_dark_passion_blackmail_decision_tooltip: "Terminaréis esta Pasión Oscura."
 POD_wraith_dark_passion_blackmail_decision_confirm: "¡Aquí no hay secretos entre \"amigos\"!"
 POD_wraith_dark_passion_blackmail_decision_condition: "Habéis usado la [character_interaction|E] de chantaje."

 POD_wraith_dark_passion_revoke_title_decision: "Pasión Oscura: Revocar título"
 POD_wraith_dark_passion_revoke_title_decision_desc: "¡Mío mío mío mío!"
 POD_wraith_dark_passion_revoke_title_decision_tooltip: "Terminaréis esta Pasión Oscura."
 POD_wraith_dark_passion_revoke_title_decision_confirm: "Mío."
 POD_wraith_dark_passion_revoke_title_decision_condition: "Habéis usado la [character_interaction|E] de revocar título."

 POD_wraith_dark_passion_execute_prisoner_decision: "Pasión Oscura: Ejecutar prisionero"
 POD_wraith_dark_passion_execute_prisoner_decision_desc: "Tú ahí. Muere."
 POD_wraith_dark_passion_execute_prisoner_decision_tooltip: "Terminaréis esta Pasión Oscura."
 POD_wraith_dark_passion_execute_prisoner_decision_confirm: "¿Qué es lo siguiente?"
 POD_wraith_dark_passion_execute_prisoner_decision_condition: "Habéis usado la [character_interaction|E] de ejecutar prisionero."

 POD_wraith_dark_passion_banish_prisoner_decision: "Pasión Oscura: Desterrar prisionero"
 POD_wraith_dark_passion_banish_prisoner_decision_desc: "Fuera de mi vista."
 POD_wraith_dark_passion_banish_prisoner_decision_tooltip: "Terminaréis esta Pasión Oscura."
 POD_wraith_dark_passion_banish_prisoner_decision_confirm: "Y no vuelvas."
 POD_wraith_dark_passion_banish_prisoner_decision_condition: "Habéis usado la [character_interaction|E] de desterrar prisionero."

 POD_wraith_devils_dare_spend_gold_decision: "Desafío del Diablo: Malgastar óbolos"
 POD_wraith_devils_dare_spend_gold_decision_desc: "Vuestra Sombra os desafía a malgastar vuestros óbolos; si no aceptáis este desafío, ganaréis #N 150#! de [stress|E]."
 POD_wraith_devils_dare_spend_gold_decision_tooltip: "Aceptaréis este Desafío del Diablo."
 POD_wraith_devils_dare_spend_gold_decision_confirm: "¡Me atrevo!"

 POD_wraith_devils_dare_spend_piety_decision: "Desafío del Diablo: Detener vuestra Trascendencia"
 POD_wraith_devils_dare_spend_piety_decision_desc: "Vuestra Sombra os desafía a detener vuestro progreso de trascendencia; si no aceptáis este desafío, ganaréis #N 150#! de [stress|E]."
 POD_wraith_devils_dare_spend_piety_decision_tooltip: "Aceptaréis este Desafío del Diablo."
 POD_wraith_devils_dare_spend_piety_decision_confirm: "¡Me atrevo!"

 POD_wraith_devils_dare_spend_prestige_decision: "Desafío del Diablo: Arruinar vuestra reputación"
 POD_wraith_devils_dare_spend_prestige_decision_desc: "Vuestra Sombra os desafía a arruinar vuestra reputación; si no aceptáis este desafío, ganaréis #N 150#! de [stress|E]."
 POD_wraith_devils_dare_spend_prestige_decision_tooltip: "Aceptaréis este Desafío del Diablo."
 POD_wraith_devils_dare_spend_prestige_decision_confirm: "¡Me atrevo!"
 
 POD_wraith_request_obolus_decision: "Solicitar óbolos"
 POD_wraith_request_obolus_decision_desc: "Como legionario, vuestra misión en las [Glossary('Skinlands','game_concept_skinlands_desc')] es cazar a los Rápidos (vivos) y a los muertos que violan las leyes de Estigia, el dictum mortuum. Podéis solicitar algunos óbolos a vuestros superiores para ayudar en vuestra misión."
 POD_wraith_request_obolus_decision_tooltip: "Gastaréis prestigio para ganar oro."
 POD_wraith_request_obolus_decision_confirm: "Permitidme explicarlo..."
 
 decision_group_type_wraith_dark_passions: "Pasiones Oscuras"
 POD_dark_passion_decision: "Una Pasión Oscura se ejecutará automáticamente tras cumplir los requisitos"
 POD_wraith_dark_passion_decision_tooltip: "Activador: "

 POD_wraith_dark_passion_war_decision: "Pasión Oscura: Guerra"
 POD_wraith_dark_passion_war_decision_desc: "Al igual que un wraith puede ganar Pathos actuando según sus Pasiones, su Sombra tiene Pasiones Oscuras que generan Angst."
 POD_wraith_dark_passion_war_decision_tooltip: "$POD_wraith_dark_passion_decision_tooltip$Iniciar una guerra."
 POD_wraith_dark_passion_war_decision_confirm: "..."

 POD_wraith_dark_passion_kill_decision: "Pasión Oscura: Asesinato"
 POD_wraith_dark_passion_kill_decision_desc: "Al igual que un wraith puede ganar Pathos actuando según sus Pasiones, su Sombra tiene Pasiones Oscuras que generan Angst."
 POD_wraith_dark_passion_kill_decision_tooltip: "$POD_wraith_dark_passion_decision_tooltip$Matar a alguien."
 POD_wraith_dark_passion_kill_decision_confirm: "..."

 POD_wraith_dark_passion_steal_decision: "Pasión Oscura: Robo"
 POD_wraith_dark_passion_steal_decision_desc: "Al igual que un wraith puede ganar Pathos actuando según sus Pasiones, su Sombra tiene Pasiones Oscuras que generan Angst."
 POD_wraith_dark_passion_steal_decision_tooltip: "$POD_wraith_dark_passion_decision_tooltip$Robar algo."
 POD_wraith_dark_passion_steal_decision_confirm: "..."

 POD_wraith_dark_passion_cruelity_decision: "Pasión Oscura: Crueldad"
 POD_wraith_dark_passion_cruelity_decision_desc: "Al igual que un wraith puede ganar Pathos actuando según sus Pasiones, su Sombra tiene Pasiones Oscuras que generan Angst."
 POD_wraith_dark_passion_cruelity_decision_tooltip: "$POD_wraith_dark_passion_decision_tooltip$Torturar a alguien o tener más de 25 de [tyranny|E]."
 POD_wraith_dark_passion_cruelity_decision_confirm: "..."

 transcendence_objective_decision: "Trascendencia"
 transcendence_objective_decision_desc: "La Trascendencia es un estado en el que el wraith acepta su muerte y pasa del Inframundo a cualquier existencia inefable que aguarde más allá. La Trascendencia consiste fundamentalmente en aceptar la propia muerte. Las cosas que mantienen a un wraith atado al inframundo, las Pasiones y los Grilletes, deben ser Resueltas. Una vez que todo esté resuelto, el wraith debe buscar alguna forma de armonía con su Sombra."
 transcendence_objective_decision_tooltip: "Más allá de la muerte."
 transcendence_objective_decision_confirm: "Finalmente libre"
 transcendence_objective_tooltip: "Seréis finalmente libre"


 descendence_objective_decision: "Regreso de entre los muertos"
 descendence_objective_decision_desc: "¡Mi muerte fue injusta! ¡Por qué debería estar contento con ella cuando fue INJUSTA! ¡Viviré, y moriré por mi cuenta!"
 descendence_objective_decision_tooltip: "Más allá de la vida."
 descendence_objective_decision_confirm: "Cambiando vuestro destino"

 war_with_the_tyrant_objective_decision: "Guerra con el Tirano"
 war_with_the_tyrant_objective_decision_tooltip: "Os enfrentaréis a la Jerarquía y pondréis fin al código de los muertos."
 war_with_the_tyrant_objective_decision_custom: "Iniciará una guerra contra vos. Si ganáis, obtendréis [GetModifier('the_gravedigger_of_dictum_mortuum').GetNameWithTooltip]. Pero si perdéis, toda vuestra casa será forjada en almas."
 war_with_the_tyrant_objective_decision_desc: "Caronte es un tirano, eso es un hecho probado. Y no os agrada. ¿Cuántas razones más necesitáis?"
 war_with_the_tyrant_objective_decision_confirm: "Estoy listo"
 war_with_the_tyrant_objective_decision_skills: "Debéis tener [skills|E] combinadas por encima de 60"

 charon_wraith_maa_modifier: "Ira de Caronte"
 charon_troops: "Ejército de Caronte"
 enforce_the_dictum_mortuum_objective_decision: "Hacer cumplir el Dictum Mortuum"
 enforce_the_dictum_mortuum_objective_decision_desc: "En nombre de Caronte, habéis venido a las tierras de la piel con una misión: perseguir a los wraiths que intentan contactar con las tierras de la piel y a los Rápidos que intentan contactar con las tierras de las sombras, siendo los Giovanni los más activos de ellos."
 enforce_the_dictum_mortuum_objective_decision_tooltip: "Evitaréis que los nigromantes pongan en peligro el Manto."
 enforce_the_dictum_mortuum_objective_decision_confirm: "¡Seguridad!"
 enforce_the_dictum_mortuum_objective_decision_custom: "No debe haber ningún [independent_ruler|E] [GetTrait('giovanni').GetName( GetPlayer )] o [GetTrait('wraith').GetName(GetPlayer)] en el mapa."
 enforce_the_dictum_mortuum_objective_decision_custom_ex: "$enforce_the_dictum_mortuum_objective_decision_custom$ #weak ([example.GetFirstName])#!"
