 pod_seasons_struggle.100.t: "¿Qué Estación gobernará a los Fae?"
 pod_seasons_struggle.100.desc: "Contra todo pronóstico, la Corte del Solsticio ha ganado la Guerra de las Estaciones. Los Fae escucharán vuestra elección sobre qué Estación debe gobernar el mundo de las hadas.\n\n#EMP 'No tenemos ninguna gran canción.\nNingún poema.\nNinguna palabra.\nY sin embargo, no somos deudores de nadie;\nesclavos ni del giro de las estaciones\nni de la rueda del destino.'#!"
 pod_seasons_struggle.100.a: "¡El Invierno debe gobernar!"
 pod_seasons_struggle.100.b: "¡La Primavera debe gobernar!"
 pod_seasons_struggle.100.c: "¡El Verano debe gobernar!"
 pod_seasons_struggle.100.d: "¡El Otoño debe gobernar!"
 pod_seasons_struggle.101.t: "Invierno sin Fin"
 pod_seasons_struggle.101.desc: "El caos que sufrieron las estaciones en los siglos precedentes ha dejado una mancha en los corazones de todos los Fae. Hoy comienza el siguiente capítulo de este mundo... El Invierno ha llegado, y nunca terminará.\n\n#EMP 'El Sol se oculta bajo en su cielo; temeroso de la sombra que crea,\nMientras la Noche se sienta en su húmedo hueco y espera,\nA que ella se hunda profundamente bajo las tierras yermas y heladas,\nPermitiendo que las escarchas devoren el calor de los ensangrentados,\nY liberen a las criaturas cazadoras del bosque una vez más.'#!"
 pod_seasons_struggle.101.a: "Invierno Eterno"
 pod_seasons_struggle.102.t: "La Primavera Crece"
 pod_seasons_struggle.102.desc: "El caos que sufrieron las estaciones en los siglos precedentes ha dejado una mancha en los corazones de todos los Fae. Hoy comienza el siguiente capítulo de este mundo... La Primavera ha renacido.\n\n#EMP 'El alba rompe la cáscara prístina del día, la nueva vida comienza,\nY el cierre de la mano lisiada del invierno se desmorona,\nEl deshielo de la nieve corre por la forma creciente de la Naturaleza,\nPero con la belleza de una flor que florece,\nNo viene la fuerza para protegerla de Su tormenta.'#!"
 pod_seasons_struggle.102.a: "La primavera ha llegado de nuevo."
 pod_seasons_struggle.103.t: "Verano Eterno"
 pod_seasons_struggle.103.desc: "El caos que sufrieron las estaciones en los siglos precedentes ha dejado una mancha en los corazones de todos los Fae. Hoy comienza el siguiente capítulo de este mundo... este Verano durará para siempre.\n\n#EMP 'El pináculo de los frutos de la Naturaleza se hincha con el calor del mediodía,\nEl tiempo más pleno del año que gira y la oscuridad más lejana,\nUna calma sedante se apodera de la bestia y del hombre,\nMientras la pereza del verano teje su terrible vaina,\nEnvolviendo a los débiles en una falta de voluntad, permitiendo a los astutos mostrar sus dientes.'#!"
 pod_seasons_struggle.103.a: "El verano perduró."
 pod_seasons_struggle.104.t: "El Mundo de Otoño"
 pod_seasons_struggle.104.desc: "El caos que sufrieron las estaciones en los siglos precedentes ha dejado una mancha en los corazones de todos los Fae. Hoy comienza el siguiente capítulo de este mundo... El Otoño era inevitable.\n\n#EMP 'Los colores cayentes del crepúsculo descienden con las hojas menguantes,\nAl igual que las alas de una mariposa son una advertencia; su belleza engaña,\nPues mientras su color se derrama como tinta; están muriendo\nTan seguro como las nieblas de la estación lo susurran,\nLa vitalidad es una fachada, mientras el Otoño persiste en mentir.'#!"
 pod_seasons_struggle.104.a: "El otoño es inevitable."
 
 pod_seasons_struggle.110.t: "Distribución"
 pod_seasons_struggle.110.desc: "Ahora está claro que no habrá fin a este ciclo de derramamiento de sangre si las cosas continúan; las cortes Fae no soportarán la unificación. Como negociador, elegiréis qué tierra pertenece a cada corte."
 pod_seasons_struggle.110.a: "Humm..."
