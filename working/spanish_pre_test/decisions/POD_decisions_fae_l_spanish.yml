 foster_sprite_decision: "Buscar un Sucesor"
 foster_sprite_decision_tooltip: "Vuestros sirvientes sugerirán una serie de candidatos adecuados"
 foster_sprite_decision_desc: "Las hadas verdaderas no son fértiles, pero pueden criar a un sprite para crear un hada verdadera. Por ello, si no queréis que vuestro duro trabajo se desperdicie en caso de un desafortunado accidente, debéis estar preparado. Pediréis a vuestros sirvientes que traigan una serie de candidatos adecuados."
