 albion_pools_decision: "Estanques de Albión"
 albion_pools_decision_desc: "Los tres místicos Estanques de Albión, ocultos en Cymru, Alba y Breizh respectivamente, se encuentran entre los tesoros más deseados por los magos porque se dice que quien tenga poder sobre los tres estanques gobernará toda Inglaterra. Se decía que uno otorgaba la juventud eterna, otro curaba todas las heridas y el tercero supuestamente concedía el control sobre los corazones de los mortales."
