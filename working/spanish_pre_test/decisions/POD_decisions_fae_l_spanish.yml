 seasons_struggle: "Guerra de las Estaciones"
 seasons_struggle_desc: "$bm_1230_fae_desc$"
 struggle_seasons_phase_opportunity: "Oportunidad"
 struggle_seasons_phase_opportunity_desc: "Tras un largo periodo de coexistencia relativamente pacífica durante la $struggle_seasons_phase_conciliation$, la complacencia empieza a instalarse. Tanto el campesinado como la nobleza se sienten cómodos con que las cosas simplemente #EMP funcionen#!, permitiendo que los [characters|E] más astutos se aprovechen de su ingenuidad.\n\nCon el tiempo, nuevos abusos provocarán una escalada hacia la $struggle_seasons_phase_hostility$, o bien una política hábil alcanzará un equilibrio inquieto a través de la $struggle_seasons_phase_conciliation$."
 struggle_seasons_phase_hostility: "Hostilidad"
 struggle_seasons_phase_hostility_desc: "Las tensiones estallan y los ánimos se caldean en esta $game_concept_struggle_phase_phase$. Los repetidos actos de malicia y los malentendidos agravados durante la $struggle_seasons_phase_opportunity$ han provocado un odio creciente hacia los [characters|E] con diferentes [cultures|E], [faiths|E], o #EMP peor#!: ambas.\n\nTal derramamiento de sangre no puede persistir para siempre, sin embargo. Al final, ya sea por mentes más frías o por simple agotamiento, la isla llegará a la $struggle_seasons_phase_compromise$."
 struggle_seasons_phase_compromise: "Compromiso"
 struggle_seasons_phase_compromise_desc: "Ya sea por el hartazgo de la contienda de la $struggle_seasons_phase_hostility$ o por una hábil escalada durante la $struggle_seasons_phase_conciliation$, el $game_concept_struggle_phase_iberia_compromise$ representa un creciente acomodo entre los pueblos de la Estación. Las diferencias quedan a un lado y la historia y el patrimonio compartidos unen a los antiguos enemigos.\n\nLa isla se encuentra en una encrucijada: si reaparecen los conflictos, entonces aguarda la $struggle_seasons_phase_opportunity$."
 struggle_seasons_phase_conciliation: "Conciliación"
 struggle_seasons_phase_conciliation_desc: "Producto de un notable $struggle_seasons_phase_compromise$, durante esta $game_concept_struggle_phase_phase$, las relaciones entre los pueblos de la Estación se vuelven tan cordiales que a los forasteros les resulta difícil entender su permisividad. Los [marriages|E] entre diferentes [faith|E] son especialmente comunes.\n\nEsto no puede durar para siempre, sin embargo, y los abusos de confianza acabarán por devolver la $seasons_struggle$ a la $struggle_seasons_phase_compromise$."
 
