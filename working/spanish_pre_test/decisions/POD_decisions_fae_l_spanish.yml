 a_way_back_to_heaven_objective_decision: "Un Camino de Regreso al Cielo"
 a_way_back_to_heaven_objective_decision_desc: "Originalmente, los hsien carecían de mucha protección frente a los enemigos que succionaban el chi, hasta que el Rey Mono logró encontrar un camino de regreso al Cielo y compartió su conocimiento del equilibrio entre los pequeños dioses. Estudiando el Nei Tan y obteniendo el nido de dragón más poderoso, podréis convertiros en Tao Te Hsien y regresar vos mismo al Cielo."
 a_way_back_to_heaven_objective_decision_tooltip: "Os convertiréis en Tao Te Hsien"
 a_way_back_to_heaven_objective_decision_confirm: "Cielo a la vista"
 
