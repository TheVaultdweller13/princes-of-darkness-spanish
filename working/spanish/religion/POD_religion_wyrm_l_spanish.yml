 ebon_centipede_high_god_name_alternate_possessive: "$ebon_centipede_high_god_name_possessive$"
 ebon_centipede_creator_god_name: "$ebon_centipede_high_god_name$"
 ebon_centipede_creator_god_name_possessive: "$ebon_centipede_high_god_name_possessive$"

 holy_order_blackened_blades: "Filos Ennegrecidos"

 #Caminantes Silenciosos
 eatersofthedead: "Devoradores de los Muertos"
 eatersofthedead_adj: "Devoradores"
 eatersofthedead_adherent: "Devorador"
 eatersofthedead_adherent_plural: "Devoradores"
 eatersofthedead_desc: "Un campamento entre los Caminantes Silenciosos empujado a la clandestinidad por los otros Caminantes, donde se rumorea que practican su rito profano entre las sombras. Consumir el cerebro de tu enemigo y aprender todos sus secretos: un ritual vil pero útil. Todos los que consumen la carne de otros, sin embargo, enloquecen lentamente y apestan al hedor del $glossary_wyrm$. Algunos incluso desarrollan una adicción a los cerebros frescos, y matarán a inocentes y culpables por igual para poder darse un festín."

 holy_order_children_ammit: "Hijos de Ammit"

 #Contempladores de Estrellas
 metasticbirth: "Nacimiento Metástico"
 metasticbirth_adj: "Metástico"
 metasticbirth_adherent: "Partera"
 metasticbirth_adherent_plural: "Parteras"
 metasticbirth_desc: "Estos Contempladores de Estrellas creen que el $glossary_wyrm$ no está enjaulado, sino que está en un capullo experimentando una metamorfosis, preparándose para una nueva realidad que está siendo alumbrada por la $glossary_weaver$. Una vez que haya terminado su metamorfosis, surgirá de su crisálida e inaugurará el nuevo mundo. Los Contempladores de Estrellas que siguen este campamento creen que esto es algo bueno, y que la tribu debería ayudar a otros a prepararse para ello, no luchar contra ello."

 #Contempladores de Estrellas
 ouroboroans: "Ourobóreos"
 ouroboroans_adj: "Ourobóreos"
 ouroboroans_adherent: "Ourobóreo"
 ouroboroans_adherent_plural: "Ourobóreos"
 ouroboroans_desc: "Buscan liberar al $glossary_wyrm$ del Equilibrio de la Red. En lugar de esforzarse contra la $glossary_weaver$, usan sus energías para buscar al Wyrm en todas sus formas con la esperanza de descubrir el secreto para liberarlo. Solo siguiendo al Wyrm hasta su cueva, en lugar de luchar contra sus esbirros, sienten que pueden influir verdaderamente en el resultado de la Guerra Final. Por lo tanto, algunos de estos monjes creen que se deben usar los caminos del Wyrm, no rehuirlos."

 holy_order_unshacklers_corruption: "Desencadenadores de la Corrupción"


 #Guardianes de los Hombres
 boli_zouhisze: "Boli Zouhisze"
 boli_zouhisze_adj: "Zouhisze"
 boli_zouhisze_adherent: "Fiel"
 boli_zouhisze_adherent_plural: "Fieles"
 boli_zouhisze_desc: "Una ramificación china de los Guardianes de los Hombres que se separó en algún momento antes del 2000 a. C., aunque conservaron ciertos aspectos de la cultura de su tribu madre, como el aprecio por la cultura humana y la veneración del espíritu Cucaracha. Esto último provocó que los $glossary_fera$ nativos de China rehuyeran a los Boli Zouhisze y los excluyeran de las Cortes Bestiales, porque la imaginería de insectos está fuertemente asociada con el Wyrm entre los Hengeyokai."

 holy_order_chaos_spinners: "Tejedores del Caos"

