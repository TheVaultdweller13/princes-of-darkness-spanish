 blackspiraldancer_religion: "@werewolf_icon! Danzantes de la Espiral Negra"
 blackspiraldancer_religion_adj: "Danzantes de la Espiral Negra"
 blackspiraldancer_religion_adherent: "Danzante de la Espiral Negra"
 blackspiraldancer_religion_adherent_plural: "Danzantes de la Espiral Negra"
 blackspiraldancer_religion_desc: "También conocidos como la Tribu Perdida, los temidos Danzantes de la Espiral Negra son los Garou que se entregaron al $glossary_wyrm$. Antaño conocidos como los Aulladores Blancos, fueron corrompidos hasta el último después de que la tribu intentara acabar con el Wyrm por sí misma."

 holy_order_death_spiral: "Espiral de la Muerte"
 holy_order_heralds_hydra: "Heraldos de la Hidra"
 holy_order_bringers_apocalypse: "Portadores del Apocalipsis"
 holy_order_balefire_warriors: "Guerreros del Fuego Fatuo"


 blackspiraldancer: "Danzantes de la Espiral Negra"
 blackspiraldancer_adj: "Danzantes de la Espiral Negra"
 blackspiraldancer_adherent: "Danzante de la Espiral Negra"
 blackspiraldancer_adherent_plural: "Danzantes de la Espiral Negra"
 blackspiraldancer_desc: "También conocidos como la Tribu Perdida, los temidos Danzantes de la Espiral Negra son los Garou que se entregaron al $glossary_wyrm$. Antaño conocidos como los Aulladores Blancos, fueron corrompidos hasta el último después de que la tribu intentara acabar con el Wyrm por sí misma."

 cluithi: "Cluithi"
 cluithi_adj: "Cluithi"
 cluithi_adherent: "Cluith"
 cluithi_adherent_plural: "Cluithi"
 cluithi_desc: "Dentro de la tribu de la Espiral Negra, sin embargo, un Campamento ha hecho todo lo posible por preservar la herencia de los Aulladores Blancos. Los Cluithi todavía merodean por los páramos y bosques más desolados de Escocia, imitando la apariencia que sus ancestros tenían hace siglos. Desgarran sus ropas, se embadurnan con orgullo de pintura corporal azul y exhiben tatuajes pictos. Los gobernantes de este campamento también tienen una tendencia elitista, considerándose la nobleza de la tribu. El nombre del Campamento es una referencia a los gobernantes originales de los reinos pictos. Muchos Cluithi se ven a sí mismos como los hijos más auténticos de Cluid, el héroe que primero condujo a los pictos a Caledonia."

 princesofruin: "Príncipes de la Ruina"
 princesofruin_adj: "Ruina"
 princesofruin_adherent: "Príncipe de la Ruina"
 princesofruin_adherent_plural: "Príncipes de la Ruina"
 princesofruin_desc: "Los Príncipes de la Ruina sostienen que la guerra por el Apocalipsis ha terminado y está decidida. Predican la autocomplacencia, afirmando que el cadáver moribundo del mundo es ahora suyo para gobernarlo y tratarlo como deseen. Los campeones triunfantes del Corruptor afirman que entregarse a sus propios instintos más bajos es una adoración categórica al $glossary_wyrm$."

 seekersoftheancient: "Buscadores de lo Antiguo"
 seekersoftheancient_adj: "Buscadores"
 seekersoftheancient_adherent: "Buscador"
 seekersoftheancient_adherent_plural: "Buscadores"
 seekersoftheancient_desc: "Druidas oscuros de la tierra que buscan conferenciar con la atmósfera y la geomancia que rodea a los Antiguos. No ensalzan al espíritu en sí, sino que invocan las virtudes de sus elementos, invocándolo indirectamente para que actúe a través de la naturaleza. Esto les otorga conocimiento y poder de forma indirecta, permitiéndoles desarrollar y dirigir un Foso que ha sido vinculado al paisaje circundante. Sirven como chamanes, arriesgándose a la esclavitud y la locura para comunarse con espíritus impensables y obtener conocimiento directamente."


 ##############
 #### Wyrm ####
 ##############


 wyrmbound: "Vinculado al Wyrm"
 wyrmbound_adj: "Vinculado al Wyrm"
 wyrmbound_adherent: "Corrompido"
 wyrmbound_adherent_plural: "Corrompidos"
 wyrmbound_desc: "El $glossary_wyrm$ cuenta con muchos entre sus sirvientes. Algunos sirven a sabiendas, otros sin saberlo. Pero todas sus acciones sirven al propósito superior del Wyrm de provocar el Apocalipsis; el fin de Gaia. Como tal, todas las criaturas que causan miseria, se entregan a la depravación y/o participan en la destrucción, ya sea voluntaria o involuntariamente, a sabiendas o sin saberlo, son sirvientes del Wyrm."
 
 
 #Roedores de Huesos
 maneaters: "Devoradores de Hombres"
 maneaters_adj: "Devorador de Hombres"
 maneaters_adherent: "Devorador de Hombres"
 maneaters_adherent_plural: "Devoradores de Hombres"
 maneaters_desc: "Este campamento de los Roedores de Huesos obtiene poder quebrantando el precepto de la Letanía que prohíbe el canibalismo de carne humana. La mayoría de los 'conversos' de este campamento eran Garou que habían sucumbido al frenesí con demasiada frecuencia. Hoy en día son pocos y muchos de los que quedan se han aliado con el campamento similar de los Devoradores de los Muertos entre los Caminantes Silenciosos.\nLas ocasionales historias macabras de hombres lobo voraces también dan crédito a la existencia de los Devoradores de Hombres — después de todo, en tiempos de hambruna, es demasiado tentador para un Roedor alimentarse y eliminar una o tres bocas hambrientas sobrantes al mismo tiempo."

 holy_order_butchers_men: "Carniceros de Hombres"

 #Señores de las Sombras
 masks: "Máscaras"
 masks_adj: "Máscaras"
 masks_adherent: "Máscara"
 masks_adherent_plural: "Máscaras"
 masks_desc: "Una sociedad secreta de los Señores de las Sombras dedicada a infundir miedo en sus enemigos, la dedicación de las Máscaras a sus artes oscuras es tan fanática que supuestamente practican la mutilación ritualizada sobre sí mismos para inspirar mayor horror en sus víctimas. Dado que lo desconocido es el patio de recreo del miedo, ninguna Máscara verdadera revela jamás su pertenencia al campamento a los forasteros, salvo a aquellos que son el objetivo de adoctrinamiento en sus filas." 

 #Señores de las Sombras
 societyofnidhogg: "Sociedad de Nidhogg"
 societyofnidhogg_adj: "Nidhogg"
 societyofnidhogg_adherent: "Nidhoggista"
 societyofnidhogg_adherent_plural: "Nidhoggistas"
 societyofnidhogg_desc: "Todos los Señores de las Sombras comprenden el poder de la oscuridad, pero ninguno tan profundamente como los miembros de este campamento secreto y místico. Tan fuerte es su fanatismo que afirman que la luz del sol en sí misma es una amenaza para las fuerzas del Trueno, y buscan sumir al mundo en la oscuridad eterna." 

 holy_order_writhing_shadows: "Las Sombras Serpenteantes"

 #Hakken
 ebon_centipede: "Ciempiés de Ébano"
 ebon_centipede_adj: "Ébano"
 ebon_centipede_adherent: "Buscador del Laberinto"
 ebon_centipede_adherent_plural: "Buscadores del Laberinto"
 ebon_centipede_desc: "Cuando las sombras se vuelven demasiado profundas y la desesperación o la crueldad abruman a uno de los Hakken, pueden someterse al Laberinto de Ébano y jurarse a [Glossary('Ciempiés', 'glossary_wyrm_tt')]. Criaturas solitarias, miserables y violentas, son una plaga para todo lo espiritualmente bueno, muy semejantes a los degenerados $Hombres Lobo Destructores|L$ #ONCLICK:FAITH,blackspiraldancer #TOOLTIP:FAITH,blackspiraldancer ¡#!#! en Occidente." 

 ebon_centipede_high_god_name: "[Glossary('Ciempiés', 'glossary_wyrm_tt')]"
 ebon_centipede_high_god_name_possessive: "De [Glossary('Ciempiés', 'glossary_wyrm_tt')]"
