 hellcats: "Gatos Infernales"
 hellcats_adj: "Gatos Infernales"
 hellcats_adherent: "Gato Infernal"
 hellcats_adherent_plural: "Gatos Infernales"
 hellcats_desc: "Cuando los Danzantes de la Espiral Negra atacaron el cónclave anual de los Ceilican Bastet en Escocia, obligaron a algunos de ellos a entrar en el [UmbraGlossary('black_spiral_labyrinth')] para entregarlos al $glossary_wyrm$. Aquellos que sobrevivieron se convirtieron en los Gatos Infernales, su habitual locura genuina transformada en agresión autodestructiva e irreflexiva. Aguardando el Apocalipsis para honrar a su Padre Oscuro, estas criaturas corrompidas traen consigo sus potentes vínculos con los dones ilusorios de las Hadas y varios fetiches del Wyrm que construyeron con curiosidad Bastet."

 holy_order_eyes_cahlash: "Ojos de Cahlash"

 
 mnetics: "Mnéticos"
 mnetics_adj: "Mnético"
 mnetics_adherent: "Mnético"
 mnetics_adherent_plural: "Mnéticos"
 mnetics_desc: "Los Mnéticos son los Devoradores de Secretos. Sus ojos se han abierto a la verdad de que los recuerdos son efímeros y maleables. Mientras que los otros Mokolé pasan años reviviendo el pasado a través de la Mnesis, los Mnéticos saben que todo es una mentira. Si todos los Mokolé recuerdan el pasado, entonces ¿por qué es tan diferente para cada uno? Los Devoradores de Secretos se deleitan retorciendo la Mnesis con sus mentiras y engaños. Muchos Mokolé han caído ante el [Glossary('Disolvedor', 'glossary_wyrm_tt')] creyendo sus mentiras, y los Mnéticos se fortalecen cada vez más como resultado."

 holy_order_forgotten_nightmares: "Las Pesadillas Olvidadas"