 swarmofsamael_desc: "Controlado por los Baali, el Enjambre sostiene que Ialdabaoth son las dos cabezas de la misma Bestia. El Enjambre enfatiza las tradiciones escatológicas del Euagetaematikon en lugar de la Comunión de Sangre o los elementos cristológicos, pero rápidamente revela los misterios más oscuros del infernalismo a los desprevenidos. La Curia Carmesí no tiene reparos en denunciar los cultos heréticos Baali."
