 redtemptation: "Tentación Roja"
 redtemptation_adj: "Cainita Rojo"
 redtemptation_adherent: "Cainita Rojo"
 redtemptation_adherent_plural: "Cainitas Rojos"
 redtemptation_desc: "La fe predica que la aparición de Cristo como el Segundo Caín había señalado el comienzo de un gran levantamiento contra Ialdabaoth, el creador diabólico del mundo físico. Todas las reglas anteriores deben ser abolidas, y los seguidores deben abrazar a tantos como sea posible e indulgenciarse todo lo que puedan."
 
 thirdcaine: "Patriarcado Ecuménico del Tercer Caín"
 thirdcaine_adj: "Tercer Cainita"
 thirdcaine_adherent: "Tercer Cainita"
 thirdcaine_adherent_plural: "Terceros Cainitas"
 thirdcaine_desc: "Esta religión no canónica ha sido encargada por un Mecenas\nFundada por el Patriarca Aleksandr del Sínodo Vere-Imeja, esta facción de gnósticos sanguíneos posee muchos atributos de la cristiandad mortal de la Ortodoxia Oriental"
 thirdcaine_religious_head_title: "Patriarca"
 thirdcaine_religious_head_title_name: "Patriarca"
 holy_order_of_aleksandr: "Orden de Aleksandr"
  
 apostlesthirdcaine: "Apóstoles del Tercer Caín"
 apostlesthirdcaine_adj: "Apostólico"
 apostlesthirdcaine_adherent: "Apóstoles"
 apostlesthirdcaine_adherent_plural: "Apóstoles"
 apostlesthirdcaine_desc: "Los Apóstoles son una rama de la Herejía Cainita que se separó de la Sede de Nod alrededor del año 1000 d.C.\nSon un movimiento reformista dentro de su fe, creyendo que sus formas simples y austeras revelarán al Tercer Caín, quien creen que es un mortal esperando ser Abrazado."
  
 sanctamater: "Sancta Mater"
 sanctamater_adj: "Sancta"
 sanctamater_adherent: "Sancta Mater"
 sanctamater_adherent_plural: "Sancta Mater"
 sanctamater_desc: "Partiendo de las mismas raíces que el Gnosticismo, Sancta Mater pone el énfasis en la divinidad de María, creyendo que ella es la poseedora de Sofía (la sabiduría).\nMediante la adoración de Sancta Mater, uno puede esperar ascender de este mundo falso y de su carcelero corrupto, la Iglesia Romana."