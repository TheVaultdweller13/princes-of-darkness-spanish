 #Blood Gnostics-Group Faiths

 viacain: "Herejía Cainita"
 viacain_adj: "Cainita"
 viacain_adherent: "Cainita"
 viacain_adherent_plural: "Cainitas"
 viacain_desc: "La Herejía Cainita es una creencia herética practicada principalmente por Cainitas cristianos, mayoritariamente pero no exclusivamente por vampiros Lasombra. Está fuertemente impregnada de Gnosticismo y emplea un rebaño de sacerdotes y clérigos humanos. Históricamente, la Herejía surgió de varios cultos de sangre en los que los vampiros eran adorados como dioses. Los vampiros, debido a sus cuerpos incorruptibles, su independencia del mundo material y el poder que otorgan sus [Glossary('Disciplinas','game_concept_discipline_desc')], eran considerados por algunos Gnósticos como criaturas de espiritualidad superior y eran buscados para recibir enseñanzas a cambio de $pod_vitae$."
 
