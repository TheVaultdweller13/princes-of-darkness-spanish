 blackmagdalene: "Iglesia de la Magdalena Negra"
 blackmagdalene_adj: "Magdalena Negra"
 blackmagdalene_adherent: "Magdalena Negra"
 blackmagdalene_adherent_plural: "Magdalenas Negras"
 blackmagdalene_desc: "Se desplazan por Europa desde su base en Marsella para seducir y corromper a los fieles. Utilizan la misma doctrina que la Herejía Cainita, incluyendo la Comunión de Sangre. Identifican a Santa María Magdalena con Isis y la Sofía gnóstica. Los conventos de Magdalenitas a menudo sirven como casas de 'prostitución sagrada' que recuerdan a los antiguos cultos de fertilidad del Levante — y esconden amargos rituales empapados en sangre de castración y canibalismo de los misterios más oscuros. Cualquier sacerdote lujurioso sabe dónde pueden saciarse sus pensamientos más morbosos, y la gente común ha comenzado a identificar a Santa María Magdalena con la innombrable 'mujer sorprendida en adulterio' gracias a los excesos del culto. Las casi pornográficas 'obras de pasión' que los Magdalenitas representan el 22 de julio, Fiesta de la Magdalena, han sido objeto de diatribas por parte de sacerdotes de toda Francia. Los Seguidores de Set envían deliberadamente a sus miembros más descarados y menos sutiles para iniciar sectas magdalenitas."
