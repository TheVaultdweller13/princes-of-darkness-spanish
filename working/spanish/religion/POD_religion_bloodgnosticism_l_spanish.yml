 viapura: "Vía Pura"
 viapura_adj: "Katharoi"
 viapura_adherent: "Kathar"
 viapura_adherent_plural: "Katharoi"
 viapura_desc: "En una era de creciente resistencia a la autoridad clerical, han elegido el dualismo gnóstico como la espada mejor forjada para sus fines. Los Zelotes construyen religiones con un cálculo casi cínico, basándose en el neoplatonismo, las Escrituras apócrifas y otras fuentes oscuras. Se han autodenominado Katharoi, y apoyan a los cátaros mortales (la misma palabra, pronunciada en francés y latín) no como mecenas, sino como guías espirituales."
 
 holy_order_the_pure: "Los Puros"
 holy_order_order_of_shining_blood: "La Orden de la Sangre Reluciente"

 calomenaschosen: "Los Elegidos de Calomena"
 calomenaschosen_adj: "Elegido"
 calomenaschosen_adherent: "Elegido"
 calomenaschosen_adherent_plural: "Elegidos"
 calomenaschosen_desc: "Los Elegidos fueron fundados por el Caitiff Stanislav. Fundado en los Balcanes occidentales, este culto parece derivado libremente de la herejía bogomila. Los Elegidos creen que Caín era un hijo del diablo y que sus hijos son las manifestaciones más viles sobre la tierra. Calomena, la Hermana Gemela de Caín, se cree que se prepara para regresar y destruir a los viles Cainitas, purificando el mundo para el glorioso Espíritu de Dios. Los Sin Clan son sus instrumentos elegidos. Organizan círculos liderados por vampiros con ghouls y miembros mortales. Stanislav fue martirizado en 1204 durante el fin del Sueño de Miguel y la Cruzada Amarga, pero su culto avanza hacia Gehena."
