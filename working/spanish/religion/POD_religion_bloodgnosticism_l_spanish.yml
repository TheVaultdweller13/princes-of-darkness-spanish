 eschatologists: "Escatólogos de Cappadocius"
 eschatologists_adj: "Escatólogo"
 eschatologists_adherent: "Escatólogo"
 eschatologists_adherent_plural: "Escatólogos"
 eschatologists_desc: "Una facción del $pod_clan$ Profanador de Tumbas cree devotamente en la Herejía Cainita, aunque con un énfasis más cristológico que la secta principal. Los Escatólogos creen que son la Prole tanto de Caín como de Cristo, y que ofrecer su $pod_vitae$ a los mortales es un sacramento en sí mismo. Los Escatólogos viajan por los caminos secundarios de Europa y celebran 'revivals' masivos que presentan asombrosos milagros de sangre y $pod_discipline$. La mayor de estas asambleas ocurre el 17 de diciembre, la Fiesta de San Lázaro."
