l_spanish: 
 
 # Localización común de Cazadores
 hunters_religion: "@supehunter_icon! Cazadores de Brujas"
 hunters_religion_adj: "Caza de Brujas"
 hunters_religion_adherent: "Cazador de Brujas"
 hunters_religion_adherent_plural: "Cazadores de Brujas"
 hunters_religion_desc: "La humanidad aún no se ha rendido con su mundo. Estas almas valientes luchan contra las abominaciones que pretenden esclavizarlas."
 
 demon_hunters_religion: "@supehunter_icon! Cazadores de Demonios"
 demon_hunters_religion_adj: "Caza de Demonios"
 demon_hunters_religion_adherent: "Cazador de Demonios"
 demon_hunters_religion_adherent_plural: "Cazadores de Demonios"
 demon_hunters_religion_desc: "Poco parece restringir a la Gente de la Noche de Oriente. No sufren Mascaradas ni respetan Velos. Sus excesos se excusan en gran medida como venganza divina o simple joss. Unas pocas almas, sin embargo, ven la contención de los seres sobrenaturales rebeldes como su karma divinamente ordenado."
 
 # Fe de grupo de Cazadores
 
 independenthunters: "Cazadores independientes"
 independenthunters_adj: "Independiente"
 independenthunters_adherent: "Cazador"
 independenthunters_adherent_plural: "Cazadores"
 independenthunters_desc: "Independientes de cualquier cuerpo eclesiástico gobernante, estos cazadores libran sus propias guerras idiosincrásicas contra los horrores sobrenaturales del Mundo de Tinieblas. Aunque carecen de los recursos de una gran institución, tampoco están atados por ninguna ética engorrosa o reglas burocráticas. La mayoría de estos cazadores descubrieron la amenaza de las criaturas sobrenaturales por su cuenta, aunque unos pocos, irritados bajo las reglas de la Inquisición de las Sombras, dejaron de responder a las órdenes de arriba y ahora recorren su propio camino."
 
 shadowinquisition: "Inquisición de las Sombras"
 shadowinquisition_adj: "Inquisición"
 shadowinquisition_adherent: "Inquisidor"
 shadowinquisition_adherent_plural: "Inquisidores"
 shadowinquisition_desc: "La Inquisición de las Sombras es una campaña secreta orquestada por la Iglesia Católica durante el periodo del Medievo Oscuro. A diferencia de la Inquisición Papal, que se dirige a los herejes, la Inquisición de las Sombras tiene como objetivo a vampiros, hombres lobo, magos y otros \"servidores de Satán\" para su destrucción o salvación. Su existencia será efímera, pero sus éxitos cambiarán el mundo $pod_cainite$ para siempre."
 shadowinquisition_religious_head_title: "Gran Inquisidor"
 shadowinquisition_religious_head_title_name: "Oficina del Gran Inquisidor"
 
 ikhwan_al_safa: "Ikhwan al-Safa"
 ikhwan_al_safa_adj: "Ikhwan"
 ikhwan_al_safa_adherent: "Sayyad al-Ghulan"
 ikhwan_al_safa_adherent_plural: "Sayyad al-Ghulan"
 ikhwan_al_safa_desc: "Creada durante el siglo XII, la Ikhwan al-Safa mantiene su vigilia sobre los fieles y lucha contra los horrores no-muertos de la noche. A diferencia de la Inquisición, los Sayyadin eran muy cuidadosos en evitar al público e intentaban minimizar el daño de su caza sobre los inocentes."
 
 akritai_adj: "Akritai"
 akritai_adherent: "Cazador"
 akritai_adherent_plural: "Cazadores"
 akritai_desc: "Los Akritai son una colección de grupos, compuestos principalmente por cazadores de brujas ortodoxos orientales. Se considera tanto un aliado serio como un competidor de la Inquisición."
 
 judge: "Juez"
 judge_adj: "Juez"
 judge_adherent: "Cazador"
 judge_adherent_plural: "Cazadores"
 judge_desc: "Tomando su nombre y sus tradiciones de los Jueces bíblicos, luchan contra lo que perciben como la prole de Lilith. Utilizan la Torá y una versión especial del Talmud como recursos para su lucha contra lo antinatural. Debido al bajo porcentaje de judíos en la mayoría de los países, los Jueces operan en pequeños grupos sin coordinación central."
 
 shih_faith: "Creencia de los Shih"
 shih_faith_adj: "Creencia"
 shih_faith_adherent: "Shih"
 shih_faith_adherent_plural: "Shih"
 shih_faith_desc: "Los [GetTrait('shih').GetName( GetPlayer )] se han diversificado y extendido por todo el Reino Medio a lo largo de los siglos, y han adaptado las filosofías que se les enseñaron para que tengan sentido en las zonas donde habitan.\nPero ninguna de estas creencias es su fuente principal de fe. Todos los [GetTrait('shih').GetName( GetPlayer )] entienden que lo que practican a nivel personal tiene poco que ver con la verdad que siguen como cazadores de demonios."
 shih_faith_religious_head_title: "Maestro Celestial"
 shih_faith_religious_head_title_name: "Reino del Maestro Celestial"
 
 strike_force_zero: "Fuerza de Ataque Cero"
 strike_force_zero_adj: "SF0"
 strike_force_zero_adherent: "Agente"
 strike_force_zero_adherent_plural: "Agentes"
 strike_force_zero_desc: "La Fuerza de Ataque Cero (también conocida como SF0) es una agencia de caza de demonios de élite y de alto secreto del gobierno japonés. A diferencia de los Shih, la Fuerza de Ataque Cero no cree que los shen tengan lugar alguno en el orden natural: son una amenaza y deben ser destruidos antes de que tengan la oportunidad de destruir a la humanidad."
 
 sanbenito: "Sanbenito"
 sanbenito_adj: "Sanbenito"
 sanbenito_adherent: "Cazador"
 sanbenito_adherent_plural: "Cazadores"
 sanbenito_desc: "Los Sanbenito son ex-inquisidores que se han convertido en seguidores de las creencias de Raffaele Renzi, el fundador de la \"Herejía Florentina\", que decidió que la Sociedad de Leopoldo yerra en su celo, y que su misión debería ser la de la misericordia, no la del odio. Por lo tanto, en lugar de intentar destruir a los seres sobrenaturales, los herejes florentinos intentan ayudarlos a conservar su humanidad."
 
 qorjin_baghatur: "Baghatur de Qorjin"
 qorjin_baghatur_adj: "de Qorjin"
 qorjin_baghatur_adherent: "Baghatur"
 qorjin_baghatur_adherent_plural: "Baghatur"
 qorjin_baghatur_desc: "Durante la desastrosa batalla de la Curva de Samara, Qorjin fue el único general mongol que no huyó ante los horrores cambiapieles que atacaron a la Horda.\nAl regresar a casa, a Karakorum, fue convocado ante el mismísimo Gengis Kan, quien le impuso un nuevo deber sagrado. En los años transcurridos ha estudiado el mundo invisible, ha aprendido a usar los miedos y supersticiones de sus enemigos para su mayor ventaja, y ha puesto en jaque a las criaturas del mito ante el Imperio Mongol."
 
 warriors_dazbog: "Guerreros de Dazbog"
 warriors_dazbog_adj: "Guerrero"
 warriors_dazbog_adherent: "Campeón"
 warriors_dazbog_adherent_plural: "Campeones"
 warriors_dazbog_desc: "En tiempos antiguos, cuando Caín aún vagaba solo por las tierras de Nod, una gran serpiente de oscuridad agitada cayó de los cielos. La odiosa criatura se enterró bajo la tierra mientras el sol acuchillaba y quemaba su carne, pero el escape no fue tan fácil. El sol otorgó un único rayo de luz divina a Svarog, dios de la forja y del fuego celestial. Svarog creó entonces a Dazbog: dios guerrero del sol y enemigo de todo lo que es impío.\nEl legado de su guerra contra el Mal continúa hasta el día de hoy, alentando a los jóvenes guerreros eslavos a proteger su patria contra las criaturas de la noche."
  
 corrupted_hunters_faith: "Cazadores Corruptos"
 corrupted_hunters_faith_adj: "Cazadores Corruptos"
 corrupted_hunters_faith_adherent: "Shih"
 corrupted_hunters_faith_adherent_plural: "Shih"
 corrupted_hunters_faith_desc: "Esta religión no canónica ha sido encargada por un Patrón.\nAunque los [GetTrait('shih').GetName( GetPlayer )] se adaptaron para tener sentido en las zonas donde habitan, algunos de ellos fueron demasiado lejos.\nAunque esos [GetTrait('shih').GetName( GetPlayer )] todavía cazan de algún modo, persiguen un disfrute más mundano, incluso un disfrute físico pervertido de varias personas.\n[GetTrait('mortal').GetName( GetPlayer )], [GetTrait('ghoul').GetName( GetPlayer )], [GetTrait('werewolf').GetName( GetPlayer )], incluso [GetTrait('vampire').GetName( GetPlayer )] o [GetTrait('kueijin').GetName( GetPlayer )], a sus ojos, son solo objetos de deseo. Debido a la falta de conocimiento y a los rigores de la supervivencia, la ética de la nueva generación se ha distorsionado, y la etiqueta y la justicia de los [GetTrait('shih').GetName( GetPlayer )] se han corrompido."
 corrupted_hunters_faith_religious_head_title: "Gran Maestro"
 corrupted_hunters_faith_religious_head_title_name: "Gran Santuario"