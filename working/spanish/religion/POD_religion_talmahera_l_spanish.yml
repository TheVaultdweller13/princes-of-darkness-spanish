  #Black-Hand-Group Faiths
  talmahera: "Tal'Mahe'Ra"
  talmahera_adj: "Tal'Mahe'Ra"
  talmahera_adherent: "Cruzado de las Sombras"
  talmahera_adherent_plural: "Cruzados de las Sombras"
  talmahera_desc: "La Tal'Mahe'Ra es una antigua organización formada por una improbable alianza entre magos Chakravanti y varios clanes de vampiros (especialmente Assamitas), aunque sus miembros también incluyen otras criaturas sobrenaturales además de vampiros y magos."
  
  manusnigrum: "Manus Nigrum"
  manusnigrum_adj: "Manus Nigrum" 
  manusnigrum_adherent: "Mano Negra"
  manusnigrum_adherent_plural: "Manos Negras"
  manusnigrum_desc: "La rama occidental de un antiguo culto a la muerte dedicado a la adoración de una cábala de seres conocidos como los Aralu, a quienes creían [Glossary('Antediluvians','game_concept_antediluvian_desc')] que dormían en la ciudad fantasma de Enoch, en las profundidades de las tierras de los muertos. El culto se involucraba principalmente en la política vampírica planeando la aniquilación de los Baali."
 
  pathofselffocus: "Senda del Enfoque Interno"
  pathofselffocus_adj: "Internalista"
  pathofselffocus_adherent: "Internalista"
  pathofselffocus_adherent_plural: "Internalistas"
  pathofselffocus_desc: "Los Internalistas creen que al aceptar el curso del universo y seguirlo sin interferir, podrían cesar el conflicto interno y así acallar a la Bestia. Afirman que, dado que cambiar el mundo es imposible, uno solo puede cambiarse a sí mismo para adaptarse al mundo."
  
  pathofthescorchedheart: "Senda del Corazón Abrasado"
  pathofthescorchedheart_adj: "Rathmonicusi"
  pathofthescorchedheart_adherent: "Implacable"
  pathofthescorchedheart_adherent_plural: "Implacables"
  pathofthescorchedheart_desc: "Basada en el Libro del Corazón Vacío de Rathmonicus, que se difundió por primera vez entre unos pocos Vástagos de la Iglesia Católica; sus escrituras fueron posteriormente reunidas y compiladas por la Verdadera Mano Negra. La Senda del Corazón Abrasado controla a la Bestia erradicando sistemáticamente cada emoción del corazón del vampiro."
  
  holy_order_enoch_peacekeepers: "Pacificadores de Enoch"
  holy_order_spenta_aurvat_column: "Columna Spenta Aurvat"
