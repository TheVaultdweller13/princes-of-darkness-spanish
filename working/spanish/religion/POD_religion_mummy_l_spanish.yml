  #Mummy-Group Faiths
 
  code_of_horus: "Código de Horus"
  code_of_horus_adj: "Wat Hor"
  code_of_horus_adherent: "Shemsu-Heru"
  code_of_horus_adherent_plural: "Shemsu-Heru"
  code_of_horus_desc: "El Código de Horus, también llamado Wat Hor, es una colección de mandamientos de Horus a sus seguidores. Resume las enseñanzas y experiencias de su vida y contiene todas las instrucciones que se daban a un Eterno recién creado en los días del antiguo Egipto."
   
  ishmaelite: "Ismaelita"
  ishmaelite_adj: "Ismaelita"
  ishmaelite_adherent: "Ismaelita"
  ishmaelite_adherent_plural: "Ismaelitas"
  ishmaelite_desc: "Los ismaelitas son Shemsu-Heru renegados que abandonaron la cruzada de Horus por diversas razones. Llevan el nombre de Ismael, el primer Shemsu-Heru que habló contra el liderazgo de Horus y que fue desterrado a caminar solo por la eternidad."
  
  faces_of_apophis: "Rostros de Apofis"
  faces_of_apophis_adj: "Rostros"
  faces_of_apophis_adherent: "Momia de Perdición"
  faces_of_apophis_adherent_plural: "Momias de Perdición"
  faces_of_apophis_desc: "$glossary_wyrm_apophis$ es el núcleo de todas las desgracias del mundo, la encarnación definitiva de Isfet. Desde que comenzó el tiempo, Apofis ha estado presente, profanando y destruyendo los principios de Ma'at. Es el embaucador definitivo, la oscuridad abrumadora y la perversión incesante que plaga el mundo."
  
  cabiri: "Cabiri"
  cabiri_adj: "Cabiri"
  cabiri_adherent: "Cabirus"
  cabiri_adherent_plural: "Cabiri"
  cabiri_desc: "Mucho después de que se creara el Hechizo de Vida y Horus y sus seguidores libraran su guerra contra Sutekh y sus esbirros, uno de los ismaelitas enseñó a un talentoso mago llamado Cabirus los principios del Hechizo de Vida. Cabirus usó esto para crear su propio Hechizo de Vida y creó sus propios inmortales que no saben nada de Osiris y Ma'at, para horror de los Shemsu-Heru."
  
  ten_mandates_of_heaven: "Diez Mandatos del Cielo"
  ten_mandates_of_heaven_adj: "Mandatos"
  ten_mandates_of_heaven_adherent: "Wu T'ian"
  ten_mandates_of_heaven_adherent_plural: "Wu T'ian"
  ten_mandates_of_heaven_desc: "Los Diez Mandatos del Cielo son reglas y directrices para los Wu T'ian, establecidas por los Ocho Inmortales bajo la administración del [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')]. Cada Mandato es igualmente importante y cada inmortal tiene su propia lista de prioridades para seguirlos, dependiendo de su carácter y fortalezas personales."
 
  ten_mandates_of_hell: "Esclavos de los Reyes Yama"
  ten_mandates_of_hell_adj: "Esclavos"
  ten_mandates_of_hell_adherent: "Wu Kuei"
  ten_mandates_of_hell_adherent_plural: "Wu Kuei"
  ten_mandates_of_hell_desc: "Los rumores dicen que los [Glossary('Yama Kings','podgloss.yamaking')] han creado sus propios esclavos Eternos para oponerse a la Familia del Cielo."
 
