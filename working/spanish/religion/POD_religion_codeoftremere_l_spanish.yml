 viaservilis_adherent: "Sirviente"
 viaservilis_adherent_plural: "Sirvientes"
 viaservilis_desc: "Comúnmente llamada la Vía del Servicio. La Via Servilis proclama que solo las acciones que complacen y veneran a los creadores de la raza de las Gárgolas son dignas de admiración."
 
