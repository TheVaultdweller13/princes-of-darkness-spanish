 # Fe de grupo Brujo
 tremerecode: "Código de Tremere"
 tremerecode_adj: "Código de Tremere"
 tremerecode_adherent: "Brujo"
 tremerecode_adherent_plural: "Brujos"
 tremerecode_desc: "El Código de Tremere marca al $pod_clan$ como único entre los $pod_cainites$; ningún otro grupo se adhiere a un conjunto unificado de reglas que delinean el comportamiento aceptable. Ninguna magia apremiante vincula a ningún Tremere al juramento, a menos que algún Regente severo decida activamente imponerlo; en su lugar, el código es una lista de facto de lo que constituye un comportamiento aceptable para un miembro de la augusta Casa de Tremere. El código detalla lo que se espera de los Tremere y qué actividades ganarían el desfavor."
 
 viaservilis: "Via Servilis"
