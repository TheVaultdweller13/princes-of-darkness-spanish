 temporary_doctrine_tt: "Esta doctrina será eliminada después de #V 10#! años."
 
 ashirra_idealism_doctrine_name: "Idealismo Ashirra"
 ashirra_edict_adopt_mysticism: "Adoptar el Reformismo"
 ashirra_mysticism_doctrine_name: "Reformismo Ashirra" 
 ashirra_mysticism_doctrine_desc: "Encabezado por Haroun el-La'il, este enfoque desafía a los tradicionalistas en muchos temas (como argumentar que los Ashirra ya cumplen con sus deberes hacia el Sawn por su existencia nocturna). En términos más generales, es una llamada al debate y al cambio que los Ancianos consideran una pendiente peligrosa." 
 ashirra_edict_adopt_legalism: "Imponer el Tradicionalismo"
 ashirra_legalism_doctrine_name: "Tradicionalismo Ashirra"
 ashirra_legalism_doctrine_desc: "El punto de vista tradicional de la mayoría de los Ashirra es una adherencia estricta a las enseñanzas, interpretadas para su propio estado de no-muertos por los primeros Ashirra. Para sus detractores, este enfoque no deja lugar al debate e impone el gobierno de los Ancianos."
 
 ashirra_edict_army: "Influir en la Zawiya"
 ashirra_army_doctrine_name: "Zawiya Influenciada" 
 ashirra_army_doctrine_desc: "Aunque lejos de ser tan numerosas como las cristianas, el Islam sigue siendo el hogar de algunas órdenes militares. Los Ashirra tienen una sólida influencia en ellas y no dudan en usarla en tiempos de necesidad." 
 ashirra_edict_tax: "Asegurar la Madina"
 ashirra_tax_doctrine_name: "Madina Asegurada"
 ashirra_tax_doctrine_desc: "El centro social de un pueblo o ciudad musulmana, la Madina es donde los Ashirra más influyen en los asuntos mortales."
 ashirra_edict_opinion: "Imponer la Adherencia Fiel"
 ashirra_opinion_doctrine_name: "Reunir al Magreb"
 ashirra_opinion_doctrine_desc: "Un grupo de Ashirra sombríos y devotos, los Magreb se dedican a erradicar cualquier amenaza a la fe, ya sea interna o externa."
 doctrine_parameter_ashirra_opinion_active: "" # Make loca empty to hidden this like vanilla
 doctrine_parameter_opinion_of_ashirra_opinion_active: "$VALUE|+=0$ de bonificación de [opinion|E] con los [Glossary('Ashirra','game_concept_ashirra_desc')]"
 ashirra_opinion_active_opinion_name: "Compañero Ashirra"
 
 ashirra_edict_gain_fervor: "Reunir a los Fieles"
 fervor_gain_ashirra_edict: "Edictos Ashirra"
