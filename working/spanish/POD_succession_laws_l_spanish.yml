l_spanish:
 vampire_elective_succession_law: "El Más Poderoso"
 vampire_elective_succession_law_effects: "Cuando ocurre un cambio de liderazgo en la sociedad de los Vástagos, a menudo es el candidato más poderoso, o mejor conectado, quien gana el premio. El [ruler|E] y todos los [vassals|E] directos [de_jure|E] de uno o dos [ranks|E] por debajo del [title|E] pueden nominar a un [heir|E] de entre ellos mismos y la [close_family|E] del gobernante."
 vampire_elective_candidates: "Familia Cercana, Pretendientes y Electores"
 vampire_elective_candidates_tooltip: "Para ser un Candidato suficientemente poderoso, un personaje debe cumplir una de las siguientes condiciones:\n$EFFECT_LIST_BULLET$Ser un miembro legítimo de la [close_family|E] del gobernante actual.\n$EFFECT_LIST_BULLET$Ser un [claimant|E] al título.\n$EFFECT_LIST_BULLET$Ser un [elector|E] feudal válido para el título"
 vampire_elective_electors: "Gobernante y Vasallos"
 vampire_elective_electors_tooltip: "Para ser un [elector|E] válido en la sociedad de los Vástagos, un vasallo debe cumplir todas las condiciones siguientes:\n$EFFECT_LIST_BULLET$Ser un vasallo [de_jure|E] del título\n$EFFECT_LIST_BULLET$Ser un vasallo directo del título\n$EFFECT_LIST_BULLET$Estar solo uno o dos [ranks|E] por debajo del título"
 vampire_elective_electors_vote_decrepit: "Este tipo es viejo. Muy viejo. Mejor ponte de su lado bueno."
 tooltip_vampire_vote_strength_diplomacy: "Diplomacia Alta"
 tooltip_vampire_vote_strength_intrigue: "Intriga Alta"
 tooltip_vampire_elector_vote_decrepit: "Este tipo es viejo. Muy viejo. Mejor ponte de su lado bueno."

 overextension_law: "Sobreextensión"
 overextension_0: "Sin Sobreextensión"
 overextension_0_effects_not_in_prev: "#R Este es el estado predeterminado de las cosas y permanecerá así mientras el tamaño de tu reino no exceda de 50.#!"
 overextension_1: "Sobreextensión Creciente"
 overextension_1_effects: "#R Este nivel ocurrirá si tu reino tiene un tamaño superior a 50 pero inferior a 100.#!\n$EFFECT_LIST_BULLET$Desbloqueas el puesto en la corte de [GetCourtPositionType('imperial_envoy_court_position').GetName()] que puede ayudarte a aliviar la tensión."
 overextension_2: "Sobreextensión Seria"
 overextension_2_effects: "#R Este nivel ocurrirá si tu reino tiene un tamaño superior a 100 pero inferior a 150.#!\n$EFFECT_LIST_BULLET$Desbloqueas el puesto en la corte de [GetCourtPositionType('imperial_chancellor_court_position').GetName()] que puede ayudarte a aliviar la tensión."
 overextension_3: "Sobreextensión Paralizante"
 overextension_3_effects: "#R Este nivel ocurrirá si tu reino tiene un tamaño superior a 150.#!\n$EFFECT_LIST_BULLET$Desbloqueas el puesto en la corte de [GetCourtPositionType('imperial_minister_court_position').GetName()] que puede ayudarte a aliviar la tensión."
 always_no_tt: "Esto no se puede cambiar manualmente."
