 rule_black_death: "$POD_gamerule$ La Peste Negra"
 setting_black_death_default: "Peste Negra Predeterminada"
 setting_black_death_default_desc: "La Peste Negra ocurrirá durante el siglo XIV, devastando y retrasando el desarrollo del mundo."
 setting_black_death_disabled: "#high Peste Negra Desactivada#!"
 setting_black_death_disabled_desc: "La Peste Negra no ocurrirá."

 rule_pod_flaying_plague: "$POD_gamerule$ Plaga Desolladora"
 setting_pod_flaying_plague_enabled: "Activado"
 setting_pod_flaying_plague_enabled_desc: "En los marcadores donde los $POD_splat_werewolf_plural$ están presentes, una plaga mortal asolará el mundo, poniendo en peligro las vidas de los $glossary_fera$ y sus [GetTrait('kinfolk').GetName(GetNullCharacter)]."
 setting_pod_flaying_plague_disabled: "#high Desactivado#!"
 setting_pod_flaying_plague_disabled_desc: "La Plaga Desolladora no ocurrirá."

 rule_pod_epidemic_frequency: "$POD_gamerule$ Frecuencia de Plagas Sobrenaturales"
 setting_pod_epidemic_frequency_normal: "#high Normal#!"
 setting_pod_epidemic_frequency_normal_desc: "Las plagas sobrenaturales aparecerán y se propagarán a un ritmo normal."
 setting_pod_epidemic_frequency_often: "#high Frecuente#!"
 setting_pod_epidemic_frequency_often_desc: "Las plagas sobrenaturales aparecerán y se propagarán con más frecuencia."
 setting_pod_epidemic_frequency_very_often: "#high Muy Frecuente#!"
 setting_pod_epidemic_frequency_very_often_desc: "Las plagas sobrenaturales aparecerán y se propagarán con mucha más frecuencia."
 setting_pod_epidemic_frequency_doomsday: "[game_rule_extreme_i|e] #high Juicio Final#!"
 setting_pod_epidemic_frequency_doomsday_desc: "El aire está cargado de miasmas y los ríos rebosan corrupción. La pestilencia es el aire mismo que respiras y el agua que bebes. No hay respiro de la plaga eterna."
 setting_pod_epidemic_frequency_rare: "Rara"
 setting_pod_epidemic_frequency_rare_desc: "Las plagas sobrenaturales aparecerán raramente y se propagarán con menos frecuencia."
 setting_pod_epidemic_frequency_very_rare: "#high Muy Rara#!"
 setting_pod_epidemic_frequency_very_rare_desc: "Las plagas sobrenaturales aparecerán muy raramente y se propagarán con mucha menos frecuencia."
 setting_pod_epidemic_frequency_disabled: "#high Desactivado#!"
 setting_pod_epidemic_frequency_disabled_desc: "Las plagas sobrenaturales no aparecerán."

 rule_baybars_purge_difficulty: "$POD_gamerule$ Crisis de la Purga de Baybars"
 setting_baybars_purge_difficulty_none: "#high Sin Purga#!"
 setting_baybars_purge_difficulty_none_desc: "La purga de Baybars de la crisis sobrenatural egipcia no ocurrirá."
 setting_baybars_purge_difficulty_default: "Purga de Baybars Predeterminada"
 setting_baybars_purge_difficulty_default_desc: "La purga de Baybars de la crisis sobrenatural egipcia ocurrirá."

 rule_pod_patreon_characters: "$POD_gamerule$ Personajes de Patreon"
 setting_pod_patreon_characters_enabled: "Activado"
 setting_pod_patreon_characters_enabled_desc: "Los personajes [GetTrait('patron').GetName(GetNullCharacter)] aparecerán en el juego."
 setting_pod_patreon_characters_disabled: "#high Desactivado#!"
 setting_pod_patreon_characters_disabled_desc: "Los personajes [GetTrait('patron').GetName(GetNullCharacter)] serán eliminados del juego."

 rule_pod_easter_egg_characters: "$POD_gamerule$ Personajes Huevo de Pascua"
 setting_pod_easter_egg_characters_immersive: "Inmersivo"
 setting_pod_easter_egg_characters_immersive_desc: "Algunos personajes de otros medios aparecerán en el juego, siempre que encajen con la atmósfera y estética general del $pod_wod$ (ej. Astarion)."
 setting_pod_easter_egg_characters_silly: "#high Disparatado#!"
 setting_pod_easter_egg_characters_silly_desc: "Algunos personajes de otros medios aparecerán en el juego, incluso si no encajan realmente (ej. Flandre Scarlet)."
 setting_pod_easter_egg_characters_disabled: "#high Desactivado#!"
 setting_pod_easter_egg_characters_disabled_desc: "Los personajes huevo de pascua serán eliminados del juego."

