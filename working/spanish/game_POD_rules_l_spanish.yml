l_spanish:
 game_rule_category_pod: "Príncipes de las Tinieblas"
 game_rule_category_pod_graphics: "Gráficos"

 #POD_gamerule: "#color:{0.7,0,0};glow_color:{1,0,0,0.5} [Concept('princes_of_darkness','PoD:')]#!"
 POD_gamerule: "[Concept('princes_of_darkness','@pod_icon!')]"

 rule_NPC_vampire_ruler_lifestyle_learning: "$POD_gamerule$ Aprendizaje Ancestral"
 setting_NPC_vampire_rulers_do_not_learn_lifestyle_perks: "Los Antiguos no aprenden trucos nuevos."
 setting_NPC_vampire_rulers_do_not_learn_lifestyle_perks_desc: "Los gobernantes vampiros PNJ NO aprenden ventajas de estilo de vida."
 setting_NPC_vampire_rulers_learn_lifestyle_perks: "Los Antiguos aprenden trucos nuevos."
 setting_NPC_vampire_rulers_learn_lifestyle_perks_desc: "Los gobernantes vampiros PNJ sí aprenden ventajas de estilo de vida tras el inicio de la partida."

 rule_pod_lore_restrictions: "$POD_gamerule$ Modos de Juego"
 setting_pod_lore_restrictions_default: "Predeterminado"
 setting_pod_lore_restrictions_default_desc: "Una experiencia equilibrada, adecuada para la mayoría de los jugadores."
 setting_pod_lore_restrictions_more: "#high @wod_icon! $game_concept_storyteller_mode$#!"
 setting_pod_lore_restrictions_more_desc: "El [storyteller_mode_with_icon|E] está activo. Una configuración #N más difícil#! para jugadores experimentados."
 setting_pod_lore_restrictions_less: "#high @haight_icon! $game_concept_samuel_haight_mode$#!"
 setting_pod_lore_restrictions_less_desc: "El [samuel_haight_mode_with_icon|E] está activo. Una configuración #N disparatada#! para jugadores que disfrutan de personajes superpoderosos."
 setting_pod_lore_restrictions_custom: "#high @mage_icon! Personalizado#!"
 setting_pod_lore_restrictions_custom_desc: "Obtén opciones adicionales que te permiten ajustar con precisión tu modo de juego."

 rule_pod_loyalty: "$POD_gamerule$ Lealtad"
 setting_pod_loyalty_default: "Predeterminado"
 setting_pod_loyalty_default_desc: "La [loyalty_with_icon|E] tiene un requisito de opinión de #V 0#!."
 setting_pod_loyalty_harsher: "#high @wod_icon! Más difícil#!"
 setting_pod_loyalty_harsher_desc: "La [loyalty_with_icon|E] tiene un requisito de opinión de #V 50#!."
 setting_pod_loyalty_disabled: "#high @mage_icon! Desactivado#!"
 setting_pod_loyalty_disabled_desc: "La [loyalty_with_icon|E] está desactivada."

 rule_pod_resonance_diminishing_returns: "$POD_gamerule$ Curva de Experiencia de Resonancia"
 setting_pod_resonance_diminishing_returns_disabled: "Desactivado"
 setting_pod_resonance_diminishing_returns_disabled_desc: "Las ganancias de experiencia de [resonance|E] no se ven afectadas por tus ventajas de $pod_discipline$."
 setting_pod_resonance_diminishing_returns_enabled: "#high @wod_icon! Activado#!"
 setting_pod_resonance_diminishing_returns_enabled_desc: "Las ganancias de experiencia de [resonance|E] disminuirán a medida que obtengas más ventajas de $pod_discipline$."

 rule_pod_losing_golconda: "$POD_gamerule$ Perder la Golconda"
 setting_pod_losing_golconda_default: "Reglas Predeterminadas"
 setting_pod_losing_golconda_default_desc: "Perderás la [golconda|E] mediante el asesinato, el robo, el frenesí y actos atroces. Los colapsos mentales de 'Crisis de [Glossary('Dharma','podgloss.dharma')]' para los $POD_splat_kueijin$ solo se activarán en el [stress_level|E] 4."
 setting_pod_losing_golconda_harsher: "#high @wod_icon! Reglas más Estrictas#!"
 setting_pod_losing_golconda_harsher_desc: "Además de las reglas predeterminadas, también perderás la [golconda|E] al declarar guerras ofensivas, o cuando des el $pod_Embrace$ a un chiquillo. Los colapsos mentales de 'Crisis de [Glossary('Dharma','podgloss.dharma')]' para los $POD_splat_kueijin$ también se activarán en el [stress_level|E] 3."

 rule_pod_seek_knowledge_cost_increase: "$POD_gamerule$ Coste de aprender nuevas habilidades"
 setting_pod_seek_knowledge_cost_increase_enabled: "Aumentando"
 setting_pod_seek_knowledge_cost_increase_enabled_desc: "Cada vez que comiences un [journey|E] para aprender una nueva habilidad, los futuros Viajes aumentarán su coste."
 setting_pod_seek_knowledge_cost_increase_disabled: "#high @haight_icon! Sin aumento#!"
 setting_pod_seek_knowledge_cost_increase_disabled_desc: "Los [journeys|E] para aprender nuevas habilidades no aumentarán su coste."

 rule_pod_seek_knowledge_limits: "$POD_gamerule$ Requisitos para aprender $pod_disciplines$ raras"
 setting_pod_seek_knowledge_limits_enabled: "Activado"
 setting_pod_seek_knowledge_limits_enabled_desc: "Las $pod_disciplines$ vampíricas raras requerirán que cumplas algunos de sus requisitos previos antes de poder aprenderlas."
 setting_pod_seek_knowledge_limits_disabled: "Desactivado"
 setting_pod_seek_knowledge_limits_disabled_desc: "Las $pod_disciplines$ vampíricas raras no requerirán que cumplas sus requisitos previos antes de poder aprenderlas."

 rule_pod_splat_hostility: "$POD_gamerule$ Hostilidad entre Tipos de Criatura"
 setting_pod_splat_hostility_default: "Predeterminado"
 setting_pod_splat_hostility_default_desc: "Ciertos [splats|E] son hostiles entre sí, lo que impide la mayoría de las [interactions|E] entre ellos."
 setting_pod_splat_hostility_disabled: "#high @haight_icon! Desactivado#!"
 setting_pod_splat_hostility_disabled_desc: "No se impide que los [splats|E] interactúen entre sí (aunque siguen sujetos a penalizaciones de opinión y doctrinas criminales)."

 rule_pod_charjoin_decisions: "$POD_gamerule$ Decisiones de Creación de Personaje"
 setting_pod_charjoin_decisions_disabled: "Desactivado"
 setting_pod_charjoin_decisions_disabled_desc: "Las decisiones e interacciones para cambiar tu [splat|E] (ej. pedir el $pod_Embrace$, o convertirte en un $POD_splat_ghoul$ drenando a un prisionero $POD_splat_vampire$) están desactivadas a menos que uses el Creador de Personajes del juego."
 setting_pod_charjoin_decisions_enabled: "#high @haight_icon! Activado#!"
 setting_pod_charjoin_decisions_enabled_desc: "Las decisiones e interacciones para cambiar tu [splat|E] (ej. pedir el $pod_Embrace$, o convertirte en un $POD_splat_ghoul$ drenando a un prisionero $POD_splat_vampire$) están activadas."

 rule_pod_numina_on_birth: "$POD_gamerule$ Numina al Nacer"
 setting_pod_numina_on_birth_default: "Restringido"
 setting_pod_numina_on_birth_default_desc: "Solo los mortales pueden obtener los rasgos [GetTrait('psychic').GetName(GetNullCharacter)] al nacer."
 setting_pod_numina_on_birth_unrestricted: "#high @haight_icon! Sin restricciones#!"
 setting_pod_numina_on_birth_unrestricted_desc: "Cualquier personaje podría obtener los rasgos [GetTrait('psychic').GetName(GetNullCharacter)] al nacer."

 rule_pod_sorcery_availability: "$POD_gamerule$ Disponibilidad de #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#!"
 setting_pod_sorcery_availability_restricted: "Restringido"
 setting_pod_sorcery_availability_restricted_desc: "Solo los $POD_splat_bastet$ y los [splats|E] de tipo humano como los $POD_splat_hunter_plural$, $POD_splat_ghoul_plural$ o los [GetTrait('kinfolk').GetName(GetNullCharacter)] pueden aprender #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#!.\nTras el $pod_Embrace$, se convierte en [GetTrait('bloodsorcery').GetName(GetNullCharacter)]."
 setting_pod_sorcery_availability_unrestricted: "#high @haight_icon! Sin restricciones#!"
 setting_pod_sorcery_availability_unrestricted_desc: "Cualquier [splat|E] puede aprender #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#!.\nEl rasgo se mantiene tras el $pod_Embrace$."

 rule_pod_splat_mixing: "$POD_gamerule$ Mezcla de Tipos de Criatura"
 setting_pod_splat_mixing_default: "Predeterminado"
 setting_pod_splat_mixing_default_desc: "Restricciones predeterminadas al mezclar [splats|E]."
 setting_pod_splat_mixing_haight_mode: "#high @haight_icon! Modo Samuel Haight#!"
 setting_pod_splat_mixing_haight_mode_desc: "Muchas restricciones al mezclar [splats|E] se relajan (ver [samuel_haight_mode_with_icon|E] para más detalles)."

 rule_pod_fog_of_war: "$POD_gamerule$ Niebla de Guerra"
 setting_pod_fog_of_war_disabled: "Desactivado"
 setting_pod_fog_of_war_disabled_desc: "Tienes un conocimiento perfecto sobre los resultados aleatorios y otros personajes, como en el CK3 original."
 setting_pod_fog_of_war_enabled: "#high Activado#!"
 setting_pod_fog_of_war_enabled_desc: "Muchas instancias de metaconocimiento están ahora ocultas por el juego. #clickable Esta característica está en desarrollo, y se añadirá más contenido en el futuro. Por el momento, se recomienda elegir la configuración \"Personalizada\" en su lugar.#!"
 #setting_pod_fog_of_war_enabled_desc: "Muchas instancias de metaconocimiento están ahora ocultas por el juego, y no sabrás nada sobre otros personajes hasta que reúnas más información primero."
 setting_pod_fog_of_war_custom: "#high Personalizado#!"
 setting_pod_fog_of_war_custom_desc: "Puedes personalizar qué tipo de metaconocimiento se oculta."

 rule_pod_random_outcomes: "$POD_gamerule$ Niebla de Guerra: Resultados Aleatorios"
 setting_pod_random_outcomes_percentages: "Porcentajes"
 setting_pod_random_outcomes_percentages_desc: "Los resultados aleatorios se muestran como porcentajes, como en el CK3 original."
 setting_pod_random_outcomes_immersive: "#high Inmersivo#!"
 setting_pod_random_outcomes_immersive_desc: "Los resultados aleatorios se muestran como una estimación aproximada, ej. \"Poco probable que ocurra\" o \"Probable que ocurra\"."
 setting_pod_random_outcomes_uncertain: "#high Incierto#!"
 setting_pod_random_outcomes_uncertain_desc: "No obtienes ninguna información sobre la probabilidad de los resultados aleatorios."

 rule_pod_endgame_delay: "$POD_gamerule$ Retraso de la Etapa Final"
 setting_pod_endgame_delay_canon: "Canónico"
 setting_pod_endgame_delay_canon_desc: "Los eventos de la etapa final ocurrirán en sus fechas canónicas, comenzando con la Era de la Inquisición en 1431."
 setting_pod_endgame_delay_100: "#high 100 años#!"
 setting_pod_endgame_delay_100_desc: "Los eventos de la etapa final comenzarán #V 100#! años después del inicio de la partida."
 setting_pod_endgame_delay_50: "#high 50 años#!"
 setting_pod_endgame_delay_50_desc: "Los eventos de la etapa final comenzarán #V 50#! años después del inicio de la partida."
 setting_pod_endgame_delay_20: "#high 20 años#!"
 setting_pod_endgame_delay_20_desc: "Los eventos de la etapa final comenzarán #V 20#! años después del inicio de la partida."
 setting_pod_endgame_delay_2: "#high 2 años#!"
 setting_pod_endgame_delay_2_desc: "Los eventos de la etapa final comenzarán #V 2#! años después del inicio de la partida."
 setting_pod_endgame_delay_random: "#high Aleatorio#!"
 setting_pod_endgame_delay_random_desc: "Los eventos de la etapa final comenzarán en una fecha aleatoria entre #V 2#! y #V 500#! años después del inicio de la partida."

 rule_age_of_inquisition_difficulty: "$POD_gamerule$ Dificultad de la Inquisición"
 setting_age_of_inquisition_difficulty_easy: "#high Inquisición Fácil#!"
 setting_age_of_inquisition_difficulty_easy_desc: "Los inquisidores de la etapa final apenas harán mella en los reinos vampíricos."
 setting_age_of_inquisition_difficulty_default: "Inquisición Predeterminada"
 setting_age_of_inquisition_difficulty_default_desc: "Los inquisidores de la etapa final sacudirán el mundo vampírico, pero serán rechazados lentamente después."
 setting_age_of_inquisition_difficulty_hard: "#high Inquisición Apocalíptica#!"
 setting_age_of_inquisition_difficulty_hard_desc: "Es probable que los inquisidores de la etapa final aniquilen la 'civilización' vampírica."

 #rule_web_of_knives_difficulty: "$POD_gamerule$ Letalidad de la Red de Cuchillos"
 #setting_web_of_knives_difficulty_default: "Red de Cuchillos Predeterminada"
 #setting_web_of_knives_difficulty_default_desc: "Los asesinos Banu Haqim de la Red de Cuchillos serán letales en sus bastiones regionales, pero su alcance no se extenderá tanto en otras áreas."
 #setting_web_of_knives_difficulty_hard: "#high Red de Cuchillos Letal#!"
 #setting_web_of_knives_difficulty_hard_desc: "Los asesinos Banu Haqim de la Red de Cuchillos pueden ahora alcanzar a su objetivo en cualquier parte del mundo, lo que significa que es solo cuestión de tiempo antes de que cumplan su sangrienta misión."


 #rule_eyes_of_abyss: "$POD_gamerule$ Ojos del Abismo"
 #setting_lasombra_have_normal_eyes: "Ojos normales"
 #setting_lasombra_have_normal_eyes_desc: "Los Lasombra tienen ojos normales, incluso si tienen 'Vista del Olvido'"
 #setting_lasombra_have_black_eyes: "#high Ojos del Abismo#!"
 #setting_lasombra_have_black_eyes_desc: "Los Lasombra con 'Vista del Olvido' tienen ojos negros."

 rule_banu_haqim_darken: "$POD_gamerule$ Maldición de los Banu Haqim"
 setting_banu_haqim_default_darken: "#high Oscurecer con la Edad#!"
 setting_banu_haqim_default_darken_desc: "La piel de los Banu Haqim, los Assamitas, se oscurece hasta volverse obsidiana a medida que envejecen."
 setting_banu_haqim_never_darken: "Nunca Oscurecer"
 setting_banu_haqim_never_darken_desc: "Los Banu Haqim no tendrán un efecto visual de oscurecimiento obsidiana al envejecer."

 rule_world_of_darkness: "$POD_gamerule$ Mundo de Tinieblas"
 setting_world_of_monsters: "Mundo de Tinieblas"
 setting_world_of_monsters_desc: "La mayoría de los personajes con tierras son criaturas sobrenaturales o aquellos que las cazan."
 setting_world_of_minions_and_monsters: "#high Mundo de Sombras#!"
 setting_world_of_minions_and_monsters_desc: "La mayoría de los personajes con tierras son criaturas sobrenaturales o aquellos que les sirven o las cazan."
 setting_world_of_minions: "#high Mundo de Corrupción#!"
 setting_world_of_minions_desc: "La mayoría de los personajes con tierras son los servidores de criaturas sobrenaturales o aquellos que las cazan."
 setting_world_of_mortals_player_knows: "#high Mundo de Secretos#!"
 setting_world_of_mortals_player_knows_desc: "El mundo ignora los horrores que acechan en la noche, pero el personaje del jugador los conoce demasiado bien..."
 setting_world_of_mortals: "#high Mundo de Ignorancia#!"
 setting_world_of_mortals_desc: "La mayoría de los personajes con tierras ignoran lo sobrenatural, incluso el personaje del jugador."
 
 rule_splats: "$POD_gamerule$ Dominio Sobrenatural"
 setting_vampires: "#high Vampiro: la Mascarada#!"
 setting_vampires_desc: "Los Vástagos poseen la mayoría de los títulos con tierras."
 setting_hunters: "#high Inquisidor: Edad Oscura#!"
 setting_hunters_desc: "La mayoría de los personajes con título y tierras son cazadores o monstruos sobrenaturales."
 setting_werewolves: "#high Hombre Lobo: el Apocalipsis#!"
 setting_werewolves_desc: "Los Garou poseen la mayoría de los títulos con tierras."
 setting_mages: "#high Mago: la Ascensión#!"
 setting_mages_desc: "La mayoría de los poseedores de títulos con tierras son magos despertados."
 setting_fae: "#high Changeling: el Ensueño#!"
 setting_fae_desc: "La mayoría de los poseedores de títulos con tierras son Fae."
 setting_wraiths: "#high Wraith: el Olvido#!"
 setting_wraiths_desc: "La partida tendrá lugar en las [UmbraGlossary('shadowlands')] donde la mayoría de los poseedores de títulos con tierras son Wraiths."
 setting_demons: "#high Demonio: la Caída#!"
 setting_demons_desc: "La mayoría de los poseedores de títulos con tierras son demonios."
 setting_vampires_vs_werewolves: "#high Colmillo y Garra#!"
 setting_vampires_vs_werewolves_desc: "La mayoría de los personajes con tierras son Vástagos o Garou."
 setting_vampires_vs_mages: "#high Guerra Massasa#!"
 setting_vampires_vs_mages_desc: "La mayoría de los personajes con tierras son Vástagos o Magos."
 setting_mortals: "#high Mortal: el Inocente#!"
 setting_mortals_desc: "La mayoría de los títulos con tierras pertenecen a mortales que ignoran el Mundo de Tinieblas."
 setting_all_splats: "Mundo de Tinieblas"
 setting_all_splats_desc: "Todas las criaturas sobrenaturales disponibles se incluirán en el mundo."
 
 #rule_wod_rule_set: "$POD_gamerule$ Conjunto de Reglas de MdT"
