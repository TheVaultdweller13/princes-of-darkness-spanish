 rule_resonance_xp: "$POD_gamerule$ Experiencia de Resonancia"
 setting_resonance_xp_default: "Experiencia de Resonancia Predeterminada"
 setting_resonance_xp_default_desc: "La experiencia de Resonancia ofrecida al beber de mortales es normal, resultando en la velocidad predeterminada de mejora de los poderes vampíricos."
 setting_resonance_xp_fast: "#high Experiencia de Resonancia Rápida#!"
 setting_resonance_xp_fast_desc: "La experiencia de Resonancia ofrecida al beber de mortales es mayor de lo habitual, resultando en una velocidad más rápida de mejora de los poderes vampíricos."
 setting_resonance_xp_half: "#high Experiencia de Resonancia a la Mitad#!"
 setting_resonance_xp_half_desc: "La experiencia de Resonancia ofrecida al beber de mortales se reduce a la mitad, resultando en una velocidad más lenta de mejora de los poderes vampíricos."
  
 rule_pod_overextension: "$POD_gamerule$ Sobreextensión"
 setting_pod_overextension_default: "Sobreextensión Predeterminada"
 setting_pod_overextension_default_desc: "Una nueva ley está activa que otorga modificadores negativos dependiendo del tamaño de tu reino. También abre nuevos puestos en la corte para mitigar estos modificadores."
 setting_pod_overextension_off: "#high Sin Sobreextensión#!"
