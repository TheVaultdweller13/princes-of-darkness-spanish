 building_type_constantinople_plundered_harbor_of_sophia_01: "Puerto de Sofía"
 building_type_constantinople_plundered_harbor_of_sophia_01_desc: "Una dársena flanqueada por un arsenal rodeado de muros, este puerto ha sido conocido por muchos nombres a lo largo de la historia. Fue la base de la armada bizantina antes de la Cuarta Cruzada.\nAhora sirve como el lugar principal desde donde los bienes robados de la ciudad caída se envían a sus nuevos dueños occidentales."
