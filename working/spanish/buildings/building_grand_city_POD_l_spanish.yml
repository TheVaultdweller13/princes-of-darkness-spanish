 building_type_constantinople_plundered_monastery_of_st_myrelaion_01: "Monasterio de San Myrelaion"
 building_type_constantinople_plundered_monastery_of_st_myrelaion_01_desc: "El palacio de Myrelaion fue construido sobre una gigantesca rotonda del siglo V antes de ser convertido en un convento. Este edificio es el primer ejemplo de una iglesia funeraria privada de un emperador bizantino, pero fue devastado por el fuego durante la Cuarta Cruzada y abandonado desde entonces.\nComo tumba de ricos emperadores, se ha convertido en un lugar de saqueo favorito para los conquistadores más codiciosos de Constantinopla."
