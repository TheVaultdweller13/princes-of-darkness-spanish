 building_type_paris_free_01: "París Libre"
 building_type_paris_free_01_desc: "#F Liberada de la oscuridad, París está lista para brillar una vez más.#!"
 building_paris_free_01: "París en Recuperación"
 building_paris_free_01_desc: "La influencia de la noche aún tiene su marca en la que fue una gran ciudad."
 building_paris_free_02: "Gran París"
 building_paris_free_02_desc: "Ante los ojos mortales, París es tan grandiosa como siempre."
 building_paris_free_03: "París Libre"
 building_paris_free_03_desc: "París se erige como un faro brillante contra la oscuridad."
 
 building_type_paris_st_dennis_01: "Abadía de Saint-Denis"
 building_type_paris_st_dennis_01_desc: "#F La posesión más importante de la Orden Roja en el dominio real de Francia. Un bastión de tradición y erudición  liderado por el respetado (y temido) Gervese le Fevre.#!"
 building_paris_st_dennis_01: "Biblioteca de Saint-Denis"
 building_paris_st_dennis_01_desc: "Muchos miembros varones de la Orden Roja utilizan esta impresionante biblioteca para estudiar."
 building_paris_st_dennis_02: "Eruditos de Saint-Denis"
 building_paris_st_dennis_02_desc: "Los miembros varones de la Orden Roja tienen acceso a través de la Abadía para asistir a la Universidad de París."
 building_paris_st_dennis_03: "Guardianes del Saber de Saint-Denis"
 building_paris_st_dennis_03_desc: "Con la gran cantidad de tomos y manuscritos a su disposición, la Orden Roja proporciona el conocimiento necesario para  destruir a las criaturas de la noche."
 building_paris_st_dennis_04: "Inquisidores de Saint-Denis"
 building_paris_st_dennis_04_desc: "El Abad Gervese le Fevre lidera la célula más agresiva y limpia las calles de París de las bestias que se oponen a  nuestra santa causa."
 
 POD_paris_st_dennis_bonus: "Obtén acceso al árbol de Ritae del [endowments_lifestyle|E]"
 
 building_type_paris_knights_templar_01: "Enclos du Temple"
 building_type_paris_knights_templar_01_desc: "#F Los Caballeros Templarios son una orden militar francesa de la fe católica, y una de las órdenes  militares más ricas y populares de la cristiandad occidental.#!"
 building_paris_knights_templar_01: "Caballeros Templarios"
 building_paris_knights_templar_01_desc: "Los Caballeros Templarios son una orden militar francesa de la fe católica, y una de las órdenes militares más  ricas y populares de la cristiandad occidental."
 building_paris_knights_templar_02: "Reclutar Rangos Inferiores"
 building_paris_knights_templar_02_desc: "Los Caballeros Templarios desconocen en gran medida la Inquisición Sombría. Conseguir que algunos de sus miembros  de menor rango ayuden con el funcionamiento diario de nuestra Orden debería ser un buen comienzo."
 building_paris_knights_templar_03: "Incorporar Miembros"
 building_paris_knights_templar_03_desc: "Los hombres fuertes y devotos siempre son bienvenidos a unirse a nuestra causa. Pero primero deben saber contra  qué luchan."
 building_paris_knights_templar_04: "Espadas de Dios"
 building_paris_knights_templar_04_desc: "Los Caballeros Templarios están listos para enfrentarse a los secuaces del infierno junto a nosotros."
 
 POD_paris_knights_templar_bonus: "Duplica la [planning_speed|E] en el [journey|E] Encontrar Guarida"
 
 building_type_paris_knights_hospitaller_01: "Casa de los Caballeros Hospitalarios"
 building_type_paris_knights_hospitaller_01_desc: "#F Los Caballeros Hospitalarios son una orden religiosa católica dedicada al cuidado de peregrinos  cristianos enfermos, pobres o heridos.#!"
 building_paris_knights_hospitaller_01: "Caballeros Hospitalarios"
 building_paris_knights_hospitaller_01_desc: "Los Caballeros Hospitalarios son una orden religiosa católica dedicada al cuidado de peregrinos cristianos  enfermos, pobres o heridos."
 building_paris_knights_hospitaller_02: "Apoyar a los Hospitalarios"
 building_paris_knights_hospitaller_02_desc: "Las simples donaciones no son suficientes para preparar a los Hospitalarios para las guerras venideras.  Debemos tomar un papel activo en apoyarlos."
 building_paris_knights_hospitaller_03: "Enseñar las Artes"
 building_paris_knights_hospitaller_03_desc: "La medicina normal puede funcionar para las dolencias comunes, pero contra lo sobrenatural son en gran medida  ineficaces. Necesitarán las artes sagradas."
 building_paris_knights_hospitaller_04: "Guardianes del Mal"
 building_paris_knights_hospitaller_04_desc: "Los Caballeros Hospitalarios serán nuestro escudo contra lo pútrido y lo vil."

