 building_type_constantinople_rebuild_the_hippodrome_01: "El Hipódromo"
 building_type_constantinople_rebuild_the_hippodrome_01_desc: "El Hipódromo de Constantinopla era un circo que era el centro deportivo y social de  Constantinopla, famoso por albergar carreras de caballos y carros.\nRestaurar el lugar y reiniciar los juegos complacería a la población (a pesar del  probable regreso de los disturbios de los aficionados también)."
