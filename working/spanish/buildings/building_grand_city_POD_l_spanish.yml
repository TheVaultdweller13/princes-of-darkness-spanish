 building_type_constantinople_reform_harbor_of_sophia_01: "Puerto de Sophia"
 building_type_constantinople_reform_harbor_of_sophia_01_desc: "Una cuenca flanqueada por un arsenal rodeado de murallas, este puerto ha sido conocido por muchos nombres a lo largo de la historia. Fue la base de la armada bizantina antes de la Cuarta Cruzada.\nTodavía tiene importancia estratégica para los  nuevos gobernantes de Constantinopla, lo que significa que fortificarlo sería una sólida medida defensiva."
