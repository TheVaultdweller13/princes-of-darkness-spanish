 building_type_constantinople_rebuild_hagia_sophia_01: "Santa Sofía"
 building_type_constantinople_rebuild_hagia_sophia_01_desc: "El centro religioso y espiritual de la Iglesia Ortodoxa Oriental durante casi mil años, la  iglesia estaba dedicada a la Santa Sabiduría. Es el espacio interior más grande del mundo y uno de los primeros en emplear una cúpula completa sobre  pechinas. Es considerada la epítome de la arquitectura bizantina.\nUna vez más en manos de gobernantes fieles, Santa Sofía está siendo rediseñada para  eclipsar incluso su gloria anterior a la Cuarta Cruzada."
