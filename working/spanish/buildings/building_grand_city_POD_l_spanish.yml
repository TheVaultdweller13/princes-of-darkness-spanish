 building_type_constantinople_plundered_seraglio_lighthouse_01: "Faro de Seraglio"
 building_type_constantinople_plundered_seraglio_lighthouse_01_desc: "El Mar de Mármara se convierte en el Cuerno de Oro alrededor del faro de Seraglio, una luz en la oscuridad para los barcos que intentan entrar o salir de la ciudad.\nRápidamente invadido por los latinos durante su invasión, ahora señala a sus barcos cargados con las riquezas de la ciudad que abandonan el puerto."
