 building_requirement_cairo_children_no_vamps: "#TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L Vampiros#! no son considerados [criminals|El] en tu  [faith|El]"
 
 building_type_cairo_canton_disciples_01: "Cantón de los Vengativos"
 building_type_cairo_canton_disciples_01_desc: "#F Un cantón construido para los Discípulos de Anubis.\nSon una antigua secta de Cainitas dentro de Egipto.  Liderados por el metusalah Gangrel Anpu, se unen a la $glossary_osirian_league$ contra los Setitas.#!"
 building_cairo_canton_disciples_01: "Pequeño Cantón de los Vengativos"
 building_cairo_canton_disciples_01_desc: "Un cantón construido para los Discípulos de Anubis.\nSon una antigua secta de Cainitas dentro de Egipto.  Liderados por el metusalah Gangrel Anpu, se unen a la $glossary_osirian_league$ contra los Setitas."
 building_cairo_canton_disciples_02: "Cantón de los Vengativos"
 building_cairo_canton_disciples_02_desc: "$building_cairo_canton_disciples_01_desc$"
