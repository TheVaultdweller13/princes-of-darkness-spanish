 building_type_constantinople_plundered_the_great_bazar_01: "El Gran Bazar"
 building_type_constantinople_plundered_the_great_bazar_01_desc: "A pesar de toda la ruina y la destrucción que se pudre tras los muros de Constantinopla, nada ha podido sofocar la chispa del Gran Bazar, el centro comercial donde latinos y helenos, oriente y occidente, mortales y Cainitas, se entremezclan en una gloriosa cacofonía urbana. Gracias a siglos de influencia vampírica, el Bazar nunca duerme.\nCon los latinos ahora en control de la ciudad, el comercio continúa, pero a veces se asemeja más a la extorsión."
