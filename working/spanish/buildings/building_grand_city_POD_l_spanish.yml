 building_type_constantinople_reform_constantinople_01: "Reformando Constantinopla"
 building_type_constantinople_reform_constantinople_01_desc: "Constantinopla nunca volverá a ser la misma. Es hora de seguir adelante y construir sobre las  ruinas de lo antiguo hacia un futuro mejor."
 building_constantinople_reform_constantinople_01: "Sanando Constantinopla"
 building_constantinople_reform_constantinople_01_desc: "Una ciudad dividida entre su pasado y su presente, Constantinopla aún se está recuperando."
 building_constantinople_reform_constantinople_02: "Constantinopla Reformada"
 building_constantinople_reform_constantinople_02_desc: "Las cicatrices de 1204 se están desvaneciendo, al igual que su legado griego. Constantinopla está  entrando en su siguiente etapa de evolución."
 building_constantinople_reform_constantinople_03: "Nueva Constantinopla"
 building_constantinople_reform_constantinople_03_desc: "Aunque nunca olvidará completamente su pasado, Constantinopla es ahora una nueva ciudad que se  esfuerza por lograr tanto como lo hizo antes."
 
 building_type_constantinople_reform_great_palace_01: "Gran Palacio"
 building_type_constantinople_reform_great_palace_01_desc: "El Gran Palacio de Constantinopla, también conocido como el Palacio Sagrado, fue el complejo  palaciego imperial bizantino más grande ubicado en el extremo sureste de la península. Sirvió como la residencia imperial principal de los emperadores  romanos orientales hasta 1081 y fue el centro de la administración imperial desde entonces.\nLa época de los emperadores se desvanece rápidamente y usar  las ruinas para albergar a las personas necesitadas mostraría la compasión de los nuevos gobernantes."
