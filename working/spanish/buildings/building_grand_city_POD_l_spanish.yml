 building_type_constantinople_plundered_the_hippodrome_01: "El Hipódromo"
 building_type_constantinople_plundered_the_hippodrome_01_desc: "El Hipódromo de Constantinopla era un circo que constituía el centro social y deportivo de Constantinopla, famoso por albergar carreras de caballos y carreras de carros.\nSe ha vuelto inquietantemente silencioso desde que los latinos tomaron el control, y los propios venecianos ahora usan el monumento robado de los Cuatro Caballos como símbolo de su ciudad."
