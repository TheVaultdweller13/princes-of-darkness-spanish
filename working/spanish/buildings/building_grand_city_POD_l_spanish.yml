 building_type_cairo_ancient_01: "El Cairo Antiguo"
 building_type_cairo_ancient_01_desc: "#F La vieja ciudad espera a un maestro digno.#!"
 building_cairo_ancient_01: "El Cairo Reclamado"
 building_cairo_ancient_01_desc: "El Cairo se convertirá en la capital de los Osirianos como estaba destinado a ser."
 building_cairo_ancient_02: "El Cairo Purificado"
 building_cairo_ancient_02_desc: "Los seres impíos que infestaban esta tierra han sido erradicados. La luz regresa a las tierras de Khem."
 building_cairo_ancient_03: "El Cairo Divino"
 building_cairo_ancient_03_desc: "Ahora bendecida por los dioses, aquí yace el corazón de la fe. Aquí se alza El Cairo."
 
 building_type_cairo_temple_ra_01: "Templo de Ra"
 building_type_cairo_temple_ra_01_desc: "#F Ra, el gran Dios del Sol. Padre de los dioses y Aquel que hizo el mundo. Adorado desde tiempos inmemoriales.#!"
 building_cairo_temple_ra_01: "Santuario de Ra"
 building_cairo_temple_ra_01_desc: "Ra fue el padre de muchos. Sin embargo, ninguno se acerca a la importancia de sus dos nietos, los hermanos Osiris y  Set. Quienes junto con Isis, su nieta, darían forma a las tierras de Khem."
 building_cairo_temple_ra_02: "Altar de Ra"
 building_cairo_temple_ra_02_desc: "Ra envejeció y nombró a Osiris como su sucesor. Pero eso no sentó bien a Set, porque él era el guerrero más poderoso  entre los dioses que custodiaban la barca solar de Ra cada noche y luchaban contra $glossary_wyrm_apophis$, la Gran Serpiente de la Oscuridad."
 building_cairo_temple_ra_03: "Templo de Ra"
 building_cairo_temple_ra_03_desc: "Ra ya había sucumbido a la vejez cuando comenzó el conflicto de los dos hermanos. Mientras algunos pueden culpar a Ra  por los resultados de sus acciones, todavía es adorado como el poderoso Dios Sol."
 building_cairo_temple_ra_04: "Gran Templo de Ra"
 building_cairo_temple_ra_04_desc: "Ra vigila Khem desde el Inframundo. Su luz envuelve las tierras en calidez y confort. Muchos vienen a adorar al Dios  Sol mientras las fuerzas de $glossary_wyrm_apophis$ tiemblan ante su poder. Para un vampiro, el milagro de desafiar la maldición de Dios y caminar bajo la  luz del sol, aunque sea por un solo día, es una verdadera prueba de la grandeza de Ra."
 POD_cairo_temple_ra_bonus: "Gana un [artifact_claim|E] por cada [artifact|El] de origen egipcio"
 
 building_type_cairo_temple_osiris_01: "Templo de Osiris"
 building_type_cairo_temple_osiris_01_desc: "#F Osiris, el Rey Resucitado. Inicialmente abrazado por Tifón, Osiris trascendió su maldición y se convirtió  en el primer Inmortal.#!"
 building_cairo_temple_osiris_01: "Santuario de Osiris"
 building_cairo_temple_osiris_01_desc: "Osiris desterró a su hermano Set al desierto, 'para que nunca más vea el sol de nuestra patria'. Sus palabras  resultaron proféticas, pues pronto la oscuridad descendió sobre la Tierra Negra."
 building_cairo_temple_osiris_02: "Altar de Osiris"
 building_cairo_temple_osiris_02_desc: "Un extraño llamado Tifón llegó a la corte de Osiris. Las palabras melosas y las terribles predicciones de Tifón  intrigaron a Osiris. Después de la cuarta visita de Tifón, Osiris despertó para siempre cambiado. Aceptó la maldición, aunque solo fuera para prepararse  para las amenazas que Tifón predijo."
 building_cairo_temple_osiris_03: "Templo de Osiris"
 building_cairo_temple_osiris_03_desc: "Set regresó pero, a diferencia de Osiris, había aceptado plenamente la maldición vampírica y se convirtió en una  Serpiente voluntaria de $glossary_wyrm_apophis$. Mediante el engaño, Set logró atrapar a Osiris y desmembrarlo en 14 pedazos. La sangre oscura de Osiris  cayó sobre las arenas y en el Nilo, uniendo para siempre la Tierra Negra con las Tierras de los Muertos."
 building_cairo_temple_osiris_04: "Gran Templo de Osiris"
 building_cairo_temple_osiris_04_desc: "Los leales seguidores de Osiris reunieron sus restos, vertieron su sangre y, con los poderes de la magia,  resucitaron a Osiris. Osiris había trascendido su maldición y se había convertido en el primer Inmortal. Set se enteró de esto y decidió atacar al  debilitado Osiris, envolviéndolo en un sudario de llamas y reduciéndolo a cenizas que se esparcieron con el viento mientras su alma regresaba a Duat.  Ahora Osiris habita en el Inframundo vigilando Amenti, el Reino Oscuro de Arena."
 POD_cairo_temple_osiris_bonus: "#help Si ya tienes acceso a [hekau_necromancy_lifestyle|E]:#!\nLos $POD_splat_wraith_plural$ vinculados no costarán  [stress|E] para mantener\n\n#help Si no:#!\nObtén acceso a [hekau_necromancy_lifestyle|E]"
 
 building_type_cairo_temple_isis_01: "Templo de Isis"
 building_type_cairo_temple_isis_01_desc: "#F Isis, Weret-Hekau, la Grande de la Magia y Mut-Netjer, la madre de los dioses. Es la creadora del Hechizo de  la Vida.#!"
 building_cairo_temple_isis_01: "Santuario de Isis"
 building_cairo_temple_isis_01_desc: "Después de la traición de Set, Isis junto con su hermana Neftis tomaron a su hijo Horus y huyeron a la Isla de  Khemnis. Allí intentó usar su magia para descubrir la ubicación del cuerpo de Osiris."
 building_cairo_temple_isis_02: "Altar de Isis"
 building_cairo_temple_isis_02_desc: "Set los encontró y encarceló a Isis y Horus. Los torturó cada noche, eventualmente arrancando el ojo de Horus y su Ba  junto con él. Solo su poderosa magia sostuvo la vida de Horus a partir de ese momento."
 building_cairo_temple_isis_03: "Templo de Isis"
 building_cairo_temple_isis_03_desc: "Isis fue liberada por sus aliados y logró recuperar los pedazos del cuerpo de Osiris. Después de que resucitó, Osiris  enseñó a Isis y Neftis todos los secretos que aprendió del Inframundo. Así fue como Isis creó el Hechizo de la Vida y lo usó para salvar a su hijo Horus."
 building_cairo_temple_isis_04: "Gran Templo de Isis"
 building_cairo_temple_isis_04_desc: "Cuando Set atacó, Horus, habiendo sido fortalecido por el Hechizo de la Vida, emasculó a Set con su espada y luego  golpeó su propio ojo robado por Set. Liberado su Ba, el alma de Horus volvió a estar completa. Isis entonces reunió a aquellos leales y hábiles en Hekau y  les enseñó el Hechizo de la Vida, para que pudieran ayudar a su hijo cuando su propia vida mortal terminara."
 POD_cairo_temple_isis_bonus: "#help Si puedes aprender #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!:#!#!\nAumenta la velocidad de  cualquier [journey|E] de Arcomaestría\n\n#help Si no puedes:#!\nDesbloquea un [crafting_node|E] de mejora que añade un modificador basado en el tipo de  artefacto con la fuerza de [GetPerk('numina_enchantment_5_perk').GetName(GetPlayer)]"
 
 building_type_cairo_temple_thoth_01: "Templo de Thoth"
 building_type_cairo_temple_thoth_01_desc: "#F Thoth, Dios de la Magia y Portador del Conocimiento. Sus enseñanzas cambiaron el destino de las Tierras  Oscuras.#!"
 building_cairo_temple_thoth_01: "Santuario de Thoth"
 building_cairo_temple_thoth_01_desc: "Otro extraño llegó a la corte de Osiris. A diferencia de Tifón, llegó durante el día. Este hombre de conocimiento,  no buscó audiencia con Osiris sino con Isis y su hermana Neftis."
 building_cairo_temple_thoth_02: "Altar de Thoth"
 building_cairo_temple_thoth_02_desc: "Tanto Isis como Neftis eran versadas en Hekau, pero Thoth les enseñó los secretos más profundos de la magia y cómo  entender el [Glossary('True Name','podgloss.truename')] de todas las cosas. Sus enseñanzas las convirtieron en las más grandes magas que Khem haya  conocido."
 building_cairo_temple_thoth_03: "Templo de Thoth"
 building_cairo_temple_thoth_03_desc: "Después de pasar muchos meses enseñando a las hermanas, Thoth partió y dejó su legado de conocimiento. Pero nunca se  fue realmente."
 building_cairo_temple_thoth_04: "Gran Templo de Thoth"
 building_cairo_temple_thoth_04_desc: "Después de que Isis huyera con su hijo, Thoth se le apareció en un sueño. Allí le enseñó cómo resucitar al  desmembrado Osiris. Las enseñanzas de Thoth, junto con las magias de Isis, formaron la base de muchos de los caminos de Hekau estudiados tanto por el  Culto de Isis como por Amenti."
 POD_cairo_temple_thoth_bonus: "#help Si eres un [GetTrait('mummy').GetName(GetNullCharacter)] o [GetTrait('bastet').GetName(GetNullCharacter)]:#!\nReduce  los costos de [gold|E] de fabricación en un 25%\n\n#help Si no lo eres:#!\nDesbloquea un [crafting_node|E] de mejora que añade un [modifier|E] que aumenta  una [skill|E] aleatoria ([GetModifier('enchantment_attribute_diplomacy_modifier').GetNameWithTooltip])"
 
 building_type_cairo_temple_bast_01: "Templo de Bast"
 building_type_cairo_temple_bast_01_desc: "#F Bast, Diosa de los hombres gato Bubasti. Madre gentil y protectora furiosa de Egipto.#!"
 building_cairo_temple_bast_01: "Santuario de Bast"
 building_cairo_temple_bast_01_desc: "Cuando Isis y su grupo huyeron de Set, los Bubasti fueron uno de los grupos con los que se refugiaron."
 building_cairo_temple_bast_02: "Altar de Bast"
 building_cairo_temple_bast_02_desc: "Después de la victoria de Set, maldijo a los Bubasti. Si todos los Bubasti alguna vez abandonan la Tierra Negra, su  extinción seguirá poco después."
 building_cairo_temple_bast_03: "Templo de Bast"
 building_cairo_temple_bast_03_desc: "Junto con la maldición, los viles Setitas capturaron a los parientes felinos de los Bubasti, los gatos Kyphur, y los  mataron o les dieron sangre para convertirlos en monstruos aberrantes."
 building_cairo_temple_bast_04: "Gran Templo de Bast"
 building_cairo_temple_bast_04_desc: "Con El Cairo reclamado y los Setitas repelidos, los gatos Kyphur son libres una vez más. Ahora los Bubasti luchan  contra los Setitas con renovada furia."
 POD_cairo_temple_bast_bonus: "#help Si eres un $glossary_fera$:#!\nComienza con [EmptyScope.ScriptValue('infiltration_small_perk_suspicion_offset')|V0] de  [suspicion_with_icon|E] durante [infiltration_missions|E]\n\n#help Si no lo eres:#!\nDesbloquea una decisión para criar [GetTrait('beast_born').GetName (GetNullCharacter)] [GetTrait('bastet').GetName(GetNullCharacter)]"
 
 building_type_cairo_temple_sobek_01: "Templo de Sobek"
 building_type_cairo_temple_sobek_01_desc: "#F Sobek, Dios de los Cocodrilos. Jefe de los Mokolé del Nilo y guardián de los dioses.#!"
 building_cairo_temple_sobek_01: "Santuario de Sobek"
 building_cairo_temple_sobek_01_desc: "Junto con los Bubasti, hubo otro grupo que dio refugio a Isis y sus aliados. Los hombres cocodrilo del Nilo y su  Jefe Sobek se mantuvieron desafiantes contra Set."
 building_cairo_temple_sobek_02: "Altar de Sobek"
 building_cairo_temple_sobek_02_desc: "Eran poderosos, pero también superados en número. Los hombres cocodrilo finalmente cayeron ante las fuerzas de Set."
 building_cairo_temple_sobek_03: "Templo de Sobek"
 building_cairo_temple_sobek_03_desc: "El gran Sobek fue corrompido por los rituales de sangre de Set, convirtiéndose en el primer y único Mokolé  Abominación."
 building_cairo_temple_sobek_04: "Gran Templo de Sobek"
 building_cairo_temple_sobek_04_desc: "Ahora Sobek yace dormido rodeado de cocodrilos ghoulizados, una burla de su antiguo estatus divino. Sin embargo, el  Dios Cocodrilo no está más allá de la esperanza y puede regresar a Ma'at una vez más."
 POD_cairo_temple_sobek_bonus: "#help Si ya tienes acceso o puedes aprender Magia del Clima:#!\nReemplaza ([GetModifier('weather_magic_flood_modifier'). GetNameWithTooltip]) con ([GetModifier('weather_magic_greater_flood_modifier').GetNameWithTooltip])\n\n#help Si no:#!\nObtén acceso a ([GetModifier ('weather_magic_flood_modifier').GetNameWithTooltip]) a nivel de [duchy|E]"
 
 building_type_cairo_caern_wind_01: "Caern del Viento Etesio"
 building_type_cairo_caern_wind_01_desc: "#F Los Pasos Silenciosos han existido desde los días del propio Osiris. Este antiguo Caern contiene los Puentes  de Luna más numerosos de todo Egipto.#!"
 building_cairo_caern_wind_01: "Caern Decrépito del Viento Etesio"
 building_cairo_caern_wind_01_desc: "Después de que Horus renaciera por primera vez y emasculó a Set, él y su madre Isis se refugiaron con los Pasos  Silenciosos en el Sinaí."
 building_cairo_caern_wind_02: "Caern Floreciente del Viento Etesio"
 building_cairo_caern_wind_02_desc: "Los Pasos Silenciosos se unieron a la Cruzada de Horus, convirtiéndose en una de las primeras tribus en unirse a la  $glossary_osirian_league$."
 building_cairo_caern_wind_03: "Caern Creciente del Viento Etesio"
 building_cairo_caern_wind_03_desc: "Durante la derrota de Set, los maldijo, separando a la tribu de sus espíritus ancestrales y desterrándolos de las  tierras de Khem."
 building_cairo_caern_wind_04: "Caern Imponente del Viento Etesio"
 building_cairo_caern_wind_04_desc: "Aunque nunca podrán regresar verdaderamente a Khem, los Pasos de cabeza de chacal siguen siendo poderosos campeones de  Ma'at."
 POD_cairo_caern_wind_bonus: "#help Si eres un [GetTrait('werewolf').GetName(GetNullCharacter)]:#!\nReduce el costo de los [artifacts|E] Planetarios del  [umbra|E] en 500[grace_i]\n\n#help Si no lo eres:#!\nObtén acceso al [character_interaction|E] Puente de Luna"
 
 building_type_cairo_canton_children_01: "Cantón de los Fieles"
 building_type_cairo_canton_children_01_desc: "#F Un cantón construido para los Hijos de Osiris.\nEste linaje de vampiros fue iniciado por el propio  Osiris. Son los creadores del Bardo y sirvientes de Ma'at.#!"
 building_cairo_canton_children_01: "Pequeño Cantón de los Fieles"
 building_cairo_canton_children_01_desc: "Un cantón construido para los Hijos de Osiris.\nEste linaje de vampiros fue iniciado por el propio Osiris. Son  los creadores del Bardo y sirvientes de Ma'at."
 building_cairo_canton_children_02: "Cantón de los Fieles"
 building_cairo_canton_children_02_desc: "$building_cairo_canton_children_01_desc$"
