 building_cairo_dust_bones_04_desc: "$building_cairo_dust_bones_01_desc$"
 
 building_type_cairo_crocodile_temple_01: "Templo del Cocodrilo"
 building_type_cairo_crocodile_temple_01_desc: "#F Ubicado en Fayum, este templo está dedicado a Sobek. La Abominación Mokolé duerme aquí rodeada de sus  cocodrilos ghoulizados.#!"
 building_cairo_crocodile_temple_01: "Templo del Cocodrilo Reclamado"
 building_cairo_crocodile_temple_01_desc: "Ubicado en Fayum, este templo está dedicado a Sobek. La Abominación Mokolé duerme aquí rodeada de sus cocodrilos  ghoulizados."
 building_cairo_crocodile_temple_02: "Templo del Cocodrilo Restaurado"
