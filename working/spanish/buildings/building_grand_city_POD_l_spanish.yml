 building_type_constantinople_rebuild_constantinople_01: "Reconstruyendo Constantinopla"
 building_type_constantinople_rebuild_constantinople_01_desc: "Constantinopla es una sombra de lo que fue, después de haber sido saqueada por los  codiciosos latinos. Reconstruirla será un esfuerzo masivo, pero hay que hacerlo."
 building_constantinople_rebuild_constantinople_01: "Reconstruyendo Constantinopla"
 building_constantinople_rebuild_constantinople_01_desc: "Las primeras señales de vida después de la pesadilla latina, todavía puede haber esperanza."
 building_constantinople_rebuild_constantinople_02: "Restaurando Constantinopla"
 building_constantinople_rebuild_constantinople_02_desc: "Aunque no tan gloriosa como una vez fue, Constantinopla es ahora al menos una ciudad próspera que  despierta de su turbulento letargo."
 building_constantinople_rebuild_constantinople_03: "Constantinopla Eterna"
 building_constantinople_rebuild_constantinople_03_desc: "La pesadilla de 1204 finalmente ha quedado atrás. Constantinopla recupera su legítimo lugar como  la Ciudad del Deseo del Mundo, ahora y para siempre."
 
 building_type_constantinople_rebuild_great_palace_01: "Gran Palacio"
 building_type_constantinople_rebuild_great_palace_01_desc: "El Gran Palacio de Constantinopla, también conocido como el Palacio Sagrado, fue el complejo  palaciego imperial bizantino más grande ubicado en el extremo sureste de la península. Sirvió como la residencia imperial principal de los emperadores  romanos orientales hasta 1081 y fue el centro de la administración imperial desde entonces.\nArruinado por los cruzados latinos, su reconstrucción  devolvería la legitimidad imperial tan necesaria en estos tiempos oscuros."
 building_constantinople_rebuild_great_palace_01: "Ruinas del Gran Palacio"
 building_constantinople_rebuild_great_palace_01_desc: "El Gran Palacio de Constantinopla, también conocido como el Palacio Sagrado, fue el complejo  palaciego imperial bizantino más grande ubicado en el extremo sureste de la península. Sirvió como la residencia imperial principal de los emperadores  romanos orientales hasta 1081 y fue el centro de la administración imperial desde entonces.\nArruinado por los cruzados latinos, su reconstrucción  devolvería la legitimidad imperial tan necesaria en estos tiempos oscuros."
