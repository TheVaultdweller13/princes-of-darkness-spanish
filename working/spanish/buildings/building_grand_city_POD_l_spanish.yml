 building_type_constantinople_plundered_hagia_sophia_01: "Hagia Sophia"
 building_type_constantinople_plundered_hagia_sophia_01_desc: "El centro religioso y espiritual de la Iglesia Ortodoxa Oriental durante casi mil años, la iglesia fue dedicada a la Sagrada Sabiduría. Es el espacio interior más grande del mundo y uno de los primeros en emplear una cúpula completamente colgante. Se considera el epítome de la arquitectura bizantina.\nConvertida en iglesia católica después de la Cuarta Cruzada, la Hagia Sophia ha sido despojada de la mayor parte de su decoro por la primera oleada de invasores cruzados."
