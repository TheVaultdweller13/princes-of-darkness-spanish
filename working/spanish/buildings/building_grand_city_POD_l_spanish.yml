 #############################
 
 building_type_cairo_vampiric_01: "El Cairo Vampírico"
 building_type_cairo_vampiric_01_desc: "#F Una gran ciudad llena de vampiros es solo un desastre esperando ocurrir.#!"
 building_cairo_vampiric_01: "El Cairo Disputado"
 building_cairo_vampiric_01_desc: "Muchos vampiros acechan aquí, pero ninguno ha dominado la ciudad todavía."
 building_cairo_vampiric_02: "El Cairo Unificado"
 building_cairo_vampiric_02_desc: "Los vampiros aceptan a regañadientes a su nuevo amo."
 building_cairo_vampiric_03: "El Cairo Destinado"
 building_cairo_vampiric_03_desc: "El destino de El Cairo es convertirse en el centro del mundo Cainita."
 
 building_type_cairo_dream_court_01: "Corte del Sueño"
 building_type_cairo_dream_court_01_desc: "#F La Corte del Sueño es el Templo Fundador Setita de El Cairo. Muchos Setitas junto con sus maquinaciones se  reúnen aquí.#!"
 building_cairo_dream_court_01: "Corte del Sueño Reclamada"
 building_cairo_dream_court_01_desc: "La Corte del Sueño es el Templo Fundador Setita de El Cairo. Muchos Setitas junto con sus maquinaciones se reúnen  aquí."
 building_cairo_dream_court_02: "Corte del Sueño Restaurada"
 building_cairo_dream_court_02_desc: "$building_cairo_dream_court_01_desc$"
 building_cairo_dream_court_03: "Corte del Sueño Activa"
 building_cairo_dream_court_03_desc: "$building_cairo_dream_court_01_desc$"
 building_cairo_dream_court_04: "Corte del Sueño Exaltada"
 building_cairo_dream_court_04_desc: "$building_cairo_dream_court_01_desc$"
 
 building_type_cairo_dust_bones_01: "Corte de Polvo y Huesos"
 building_type_cairo_dust_bones_01_desc: "#F Este Templo Fundador está ubicado fuera de El Cairo. Un centro de saber y hechicería Setita.#!"
 building_cairo_dust_bones_01: "Corte de Polvo y Huesos Reclamada"
 building_cairo_dust_bones_01_desc: "Este Templo Fundador está ubicado fuera de El Cairo. Un centro de saber y hechicería Setita."
 building_cairo_dust_bones_02: "Corte de Polvo y Huesos Restaurada"
