 building_type_constantinople_rebuild_harbor_of_sophia_01: "Puerto de Sophia"
 building_type_constantinople_rebuild_harbor_of_sophia_01_desc: "Una cuenca flanqueada por un arsenal rodeado de murallas, este puerto ha sido conocido por  muchos nombres a lo largo de la historia. Fue la base de la armada bizantina antes de la Cuarta Cruzada.\nReconstruirlo es algo dado, ya que  Constantinopla necesitará una armada fuerte para evitar que el desastre de 1204 vuelva a ocurrir en el futuro."
