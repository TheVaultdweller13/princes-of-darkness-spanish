 building_type_constantinople_reform_the_hippodrome_01: "El Hipódromo"
 building_type_constantinople_reform_the_hippodrome_01_desc: "El Hipódromo de Constantinopla era un circo que era el centro deportivo y social de  Constantinopla, famoso por albergar carreras de caballos y carros.\nLas carreras de carros son una moda pasada hace tiempo en este punto, pero las piedras  que utiliza todavía son buenas y podrían ayudar a reconstruir la ciudad más rápido de lo esperado."
