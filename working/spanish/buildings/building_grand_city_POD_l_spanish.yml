 building_type_constantinople_plundered_constantinople_01: "Constantinopla Saqueada"
 building_type_constantinople_plundered_constantinople_01_desc: "La Ciudad del Deseo del Mundo, aplastada bajo los deseos más viles de los hombres."
 building_constantinople_plundered_constantinople_01: "Constantinopla Robada"
 building_constantinople_plundered_constantinople_01_desc: "La que antaño fuera la orgullosa capital de los romanos ahora se alza profanada por aquellos que afirman seguir un mandato de Roma."
 building_constantinople_plundered_constantinople_02: "Constantinopla Asaltada"
 building_constantinople_plundered_constantinople_02_desc: "En Venecia, hombres acaudalados brindan por su buena fortuna. En Constantinopla, el decrépito cadáver de una ciudad antaño grandiosa hace posible esa fortuna."
 building_constantinople_plundered_constantinople_03: "Constantinopla Despojada"
 building_constantinople_plundered_constantinople_03_desc: "1204 fue el fin de un Sueño, pero al menos ciertamente enriqueció a algunas personas."

 building_type_constantinople_plundered_great_palace_01: "Gran Palacio"
 building_type_constantinople_plundered_great_palace_01_desc: "El Gran Palacio de Constantinopla, también conocido como el Palacio Sagrado, era el complejo palaciego bizantino imperial más grande, ubicado en el extremo sureste de la península. Sirvió como residencia imperial principal de los emperadores romanos de Oriente hasta 1081 y fue el centro de la administración imperial desde entonces.\nAhora es un desastre en ruinas donde los latinos saqueadores se atiborran de las riquezas restantes."
