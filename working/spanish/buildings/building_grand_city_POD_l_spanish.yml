 building_type_constantinople_rebuild_the_great_bazar_01: "El Gran Bazar"
 building_type_constantinople_rebuild_the_great_bazar_01_desc: "A pesar de toda la destrucción y ruina que se pudre tras las murallas de Constantinopla,  nada ha podido apagar la chispa del Gran Bazar, el centro comercial donde latinos y helenos, este y oeste, mortales y cainitas, se mezclan en una gloriosa  cacofonía urbana. Gracias a siglos de influencia vampírica, el Bazar nunca duerme.\nLos negocios nunca se detienen realmente y los mercaderes se han  adaptado rápidamente al regreso de los legítimos amos de Constantinopla."
