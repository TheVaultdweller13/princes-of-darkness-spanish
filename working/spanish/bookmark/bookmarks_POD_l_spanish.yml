 bm_1230_battle_royale: "Facciones"
 bm_1230_battle_royale_desc: "Las otras facciones del Mundo de Tinieblas son jugables desde este marcador. Para una visión más detallada de cada una, por  favor selecciona tu elección en la izquierda de la pantalla.\n\nLos Inquisidores son agentes de la Iglesia Católica que cazan lo sobrenatural.\nLos  Cazadores son aquellos no afiliados a la Inquisición pero que aún luchan contra lo sobrenatural.\nLos Demonios son Ángeles Caídos empeñados en corromper el  alma de la humanidad.\nLas Momias son inmortales egipcias que libran una larga guerra contra Set.\nLos Hombres Lobo son agentes de Gaia, protegiéndola del  avance de la civilización.\nLos Bastet son los hombres gato, campeones de Gaia en África e India.\nLos Mokolé son hombres cocodrilo y hombres dragón, los  longevos guardianes de las memorias de Gaia."
 
 bastet_sub_bookmark: "Edad Oscura: Bastet"
 bm_1230_inquisitor_sub_bastet: "Edad Oscura: Bastet"
 bm_1230_inquisitor_sub_bastet_desc: "Los hombres gato son los ojos de Gaia, creados para ser los más versátiles de los Fera. Aunque dedicados a la causa,  su naturaleza caprichosa y aislacionista significó que fueron superados por los hombres lobo durante la Guerra de Rabia y obligados a retirarse a sus  tierras natales de África e India. Todavía son fuertes allí y algunos de ellos sueñan con reunir algún día las divididas tribus de los felinos una vez más. \n\n#bold La madre de todos los gatos, Seline, creó a tu especie para vigilar este mundo. No dejes que viejos enemigos como los vampiros o falsos amigos  como los bárbaros hombres lobo te distraigan de tu sagrado deber.#!"
 bookmark_bastet_tola: "Tola"
 bookmark_bastet_tola_desc: "Los Bagheera, o hombres pantera, fueron creados para ser los jueces de los felinos. Aunque este papel nunca se materializó  realmente debido a la división de la Nación Bastet, los Bagheera aún son respetados por todas las otras tribus como mediadores justos y mentores sabios. \nSon una tribu inquisitiva y curiosa, especialmente cercana y fascinada por la humanidad, y siempre se esfuerzan por sanar las heridas que dañan a la  Nación Bastet y su relación con los otros $glossary_fera$. A pesar de todo esto, los hombres pantera también son conocidos por sus temperamentos feroces,  especialmente cuando se trata de alguna injusticia. Muchos tontos han confundido su comportamiento gentil con debilidad una vez. Pocos tuvieron el lujo de  hacerlo dos veces.\n\n#bold India fue una vez tu patio de recreo favorito para coexistir con la humanidad. Sin embargo, el ascenso desenfrenado de la  civilización ha dejado el subcontinente vulnerable a vampiros y otros monstruos. Es más que hora de corregir este error.#!"
 bookmark_bastet_ananka: "Ananka"
 bookmark_bastet_ananka_desc: "Los místicos de los felinos, los gatos sombra Bubasti son una tribu reservada y tímida. Una vez fueron reverenciados como  deidades por el pueblo del Antiguo Egipto y disfrutaron de una vida de lujo hasta que llegó Set. Una larga guerra terminó en desastre para los Bubasti, con  sus números disminuyendo hasta casi la extinción y su pueblo felino reducido a la esclavitud por los Seguidores de Set.\nRefugiados por Horus, que también  estaba en guerra con su tío Set, los Bubasti han logrado sobrevivir bajo su protección desde entonces. Los gatos sombra han aprendido muchos secretos y  hechicería de esta alianza y están planeando lentamente su venganza largamente esperada contra quien tomó su trono divino.\n\n#bold Tu alianza con Horus ha  servido bien a tu especie, pero vivir como refugiado no es digno de los que fueron gatos divinos de Khem. Pronto, las serpientes se arrastrarán con miedo  ante la divina hechicería de los Hijos de Bast.#!"
 bookmark_bastet_olwen: "Olwen"
 bookmark_bastet_olwen_desc: "Los Ceilican o 'gatos mercuriales' fueron una vez parientes del ahora extinto león de las cavernas europeo. Para las otras  tribus de los Bastet, están tan muertos como su especie felina. La verdad es un poco más complicada.\nLos caprichosos Ceilican disfrutaban de una estrecha  relación con los seres de las Hadas, viviendo una vida de bromas (a menudo insensibles) a la humanidad y otras criaturas. Sin embargo, un señor de las  Hadas se interesó especialmente en ellos y pronto comenzó a cazarlos. Ya no muy numerosos debido a la muerte de los leones de las cavernas (y su tendencia  a hacer muchos enemigos), los Ceilican fueron casi asesinados o esclavizados. Aún así, algunos de ellos sobreviven, escondiéndose de las Hadas y sus otros  enemigos, habiendo finalmente aprendido el valor de la sutileza.\n\n#bold Con tantos que te quieren muerto (o peor) y los otros Bastet pensando que  desapareciste hace tiempo, la propia supervivencia de tu tribu está en juego.#!"
 bookmark_bastet_soft_walker: "Paso-Suave"
 bookmark_bastet_soft_walker_desc: "Los hombres tigre Khan son guerreros nobles y honorables, que representan un ejemplo brillante de lo que debe ser un  campeón de Gaia. Aunque algunos sufren de mal genio y agresividad, han tomado muchas enseñanzas asiáticas en serio sobre cómo mejorarse tanto en mente como  en cuerpo.\nLos Khan son criaturas sociales y son los Bastet más propensos a trabajar junto a otro $glossary_fera$. Sus debilidades, tales como son,  provienen de ser demasiado confiados o demasiado seguros de sí mismos. Los Khan son directos y orientados a la acción, no son conspiradores astutos. Sea lo  que sea que uno de estos Bastet haga, lo hace con vigor a toda máquina, ya sea luchando, seduciendo, cazando, estudiando o incluso contemplando. Se  entregan a todas las tareas con una poderosa pasión, y sus cuerpos, en cualquier forma, vibran con vitalidad.\n\n#bold Mientras que los arrogantes Simba  gobiernan como tiranos mezquinos, los Khan siempre se superan. El tiempo del león ha terminado. ¡Los tigres liderarán la carga!#!"
 bookmark_bastet_taa_mlimba: "Taa Mlimba"
 bookmark_bastet_taa_mlimba_desc: "Los hombres león Simba son los autoproclamados gobernantes de los felinos. Representan lo mejor que Gaia tiene para  ofrecer, en cuanto a que son regios, orgullosos y poderosos sin comparación. Sin embargo, también son arrogantes, dominantes y maliciosos, incluso en las  mejores circunstancias.\nLos Simba creen firmemente que fueron creados para gobernar a sus hermanos, algo que los Bastet, normalmente antisociales, casi  universalmente detestan. Creados como puntos de reunión y líderes de su especie, los Simba toleran mal las insurrecciones y los desafíos a su dominio. Para  muchos, son matones en el mejor de los casos y tiranos en el peor. Para sí mismos, son magníficos señores y asesinos de demonios. Cuando se restablezca el  equilibrio, cuando los humanos sepan su lugar y cuando las ciudades se conviertan en cementerios, los leones habrán demostrado tener razón.\n\n#bold Es  hora de poner las cosas en el orden correcto: si eso requiere derramamiento de sangre, que así sea.\nLa guerra es el deporte de los reyes, después de todo. #!"
 bookmark_bastet_nyolo: "Nyolo"
 bookmark_bastet_nyolo_desc: "Los Swara, también llamados el Pueblo Plateado, son los hombres guepardos de las tribus Bastet. Como sus parientes, son  extremadamente rápidos y viajan mucho. De todas las tribus de los Bastet, los Swara son los menos comprendidos. Esto es el resultado de su cultura muy  aislada. Los Swara son la única raza de Bastet capaces de saltar de lado de forma natural, lo que les permite viajar a reinos dentro de la [umbra|E] que  sus hermanos no pueden alcanzar.\nMuchos Swara saben que el Apocalipsis se acerca y se preparan para él. Muchos otros Bastet, especialmente los Simba, ven  a los Swara como cobardes que preferirían huir de un enemigo que enfrentarlo.\nDebido a su mentalidad espiritual, los hombres guepardos son los verdaderos  protectores de los lugares místicamente cargados de África, salvándolos de la depredación. Alguien que llama cobarde a un Swara no ha presenciado a uno  defendiendo tal área.\n\n#bold Deja que los Simba y otros te critiquen a tus espaldas. Tú conoces tu deber y no flaquearás en él.#!"
 
 mokole_sub_bookmark: "Edad Oscura: Mokolé"
 bm_1230_inquisitor_sub_mokole: "Edad Oscura: Mokolé"
 bm_1230_inquisitor_sub_mokole_desc: "Los impresionantes y regios Reyes Lagarto fueron una vez la especie cambiaformas dominante en la Tierra. Sin embargo,  este tiempo ya pasó y casi fueron aniquilados por los hombres lobo, hasta el punto de retirarse al aislamiento y asumir el manto de convertirse en la  longeva Memoria de Gaia.\n\nVarias corrientes surgieron desde entonces, adaptándose a sus condiciones regionales y a las nuevas razas de cocodrilos y  caimanes que aparecían con el tiempo. Así, una generación más joven está emergiendo con más ambición y determinación para escribir su propia parte en la  historia del mundo.\n\n#bold Armado con el conocimiento transmitido desde los albores del mundo y los poderosos poderes de tu especie, es hora de dar paso  a una nueva era de liderazgo Mokolé.#!"
 bookmark_mokole_mokole_mbembe: "Mokolé-Mbembe"
 bookmark_mokole_mokole_mbembe_desc: "Quizás el ser activo más antiguo, Mokolé-Mbembe fue el primer Mokolé en nacer después de la era de los Reyes  Dinosaurio.\n\nProtegió el hogar selvático de los Mokolé con mortales espíritus de Fiebre para salvar a su pueblo. Vio la Primera Ciudad, luego Egipto,  Sumer, Roma surgir y caer, y ha engendrado innumerables crías con sus compañeras Parientes. Enseñó a su linaje a ser sabio, pero también a ser guerreros,  porque los enemigos de la Madre solo pueden ser superados en astucia un número limitado de veces.\n\nComo ocurre con seres tan antiguos como él,  Mokolé-Mbembe no piensa en la misma línea de tiempo que los demás y se anima a actuar solo ante sucesos selectos. Cuando lo hace, sin embargo, el mundo  vislumbra un destello de la antigua gloria de los Reyes Dinosaurio de antaño.\n\n#bold Ha llegado un momento para la acción, lo has visto. Deja que el  mundo recuerde una vez más a sus gobernantes primordiales.#!"
 bookmark_mokole_swims_mbembe: "Nada-en-la-Estela-de-Mbembe"
 bookmark_mokole_swims_mbembe_desc: "Un espíritu decidido y una naturaleza curiosa han hecho de Nada-en-la-Estela-de-Mbembe un ejemplar único entre los  muchos hijos de Mokolé-Mbembe. Actuando una vez como intermediario entre las otras Feras de África y la Nidada de su padre, desde entonces ha comenzado la  suya propia.\n\nMientras que las Nidadas de otros Mokolé son aislacionistas y mueren lentamente, la de Nada-en-la-Estela-de-Mbembe ha mostrado gran  promesa, en gran parte gracias a sus habilidades únicas entre los de su especie.\n\n#bold Aunque respetas profundamente a tu padre, los Mokolé deben  adaptarse a los tiempos cambiantes y cultivar sus alianzas. Eres muy adecuado para esa importante tarea.#!"
 bookmark_mokole_sands: "El-Último-Rey-de-la-Arena"
 bookmark_mokole_sands_desc: "Mientras que la mayoría de los Mokolé son criaturas placenteras y contemplativas, el Último-Rey-de-la-Arena es un guerrero  audaz de principio a fin. Francamente, no tuvo más remedio que serlo.\n\nComo su nombre elegido indica, el Último-Rey-de-la-Arena lidera su Nidada de la  Orilla del Río Negro en el sombrío presente donde los Hijos de Set han triunfado sobre la $glossary_osirian_league$. Un general sombrío a menudo propenso a  ataques de ira, el Último-Rey-de-la-Arena se ha distanciado de lo que podrían haber sido aliados potenciales, llevando a lo que parece ser una guerra  difícil de ganar por sí solo.\n\n#bold Eres el único que puede vengar milenios de humillación de los Hijos de Sobek a manos de los viles seguidores de Set.  No te echarás atrás ahora, ni nunca.#!"
 bookmark_mokole_hides: "Se-Esconde-a-Plena-Vista"
 bookmark_mokole_hides_desc: "La última Nidada de la India fue destruida hace años. Como el único superviviente, Se-Esconde-a-Plena-Vista carga con los  horrores del pasado. El joven Mokolé nunca se adhirió a las enseñanzas de su antigua Nidada sobre la gloria y el honor; era diferente.\n\nSus métodos son  muy letales y muy deshonrosos para los estándares Mokolé. Las criaturas de la noche aprenderán a temer su propia sombra mientras la oculta ira de Gaia  desciende sobre ellas.\n\n#bold Eres el último Mokolé en la India. ¿Caerás como los demás o caminarás a través de las sombras para vengarlos? T'kash debe  ser limpiado, de una forma u otra.#!"
 bookmark_mokole_red_sky: "Cielo-Rojo-Esperando"
 bookmark_mokole_red_sky_desc: "Una Mokolé joven (según sus estándares), Cielo-Rojo-Esperando está dividida entre su terquedad natural y las realidades del  mundo que se hunden en su ser.\n\nDotada para acceder a la memoria colectiva de su especie, vio la gloriosa era pasada como un signo de lo que está por  venir y hacia lo que debe esforzarse. Su primer contacto con la realidad fue amargo, al descubrir que los sobrenaturales de la India no estaban muy  entusiasmados con sus ideas e incluso sus parientes preferían una vida de contemplación.\n\nAcurtida por la experiencia, Cielo-Rojo-Esperando ha pasado las  últimas décadas dedicándose a actividades más eruditas. Aún así, el fuego de su juventud no se ha extinguido todavía y solo se necesitaría una pequeña  oportunidad para que persiguiera sus ambiciosos sueños una vez más.\n\n#bold El momento adecuado podría estar pronto sobre ti. El Cielo Rojo podría  finalmente terminar su espera.#!"
 bookmark_mokole_hao_zhi: "Hao Zhi"
 bookmark_mokole_hao_zhi_desc: "Nacido en una familia adinerada, Hao Zhi recibió una excelente educación en todo tipo de cosas. Sin embargo, el mayor regalo  que pudo haber recibido fue el Primer Cambio. Como Mokolé, ha pasado la mayoría de sus años sumergido en la Mnesis. Lo que ha llevado a los otros Mokolé a  llamarlo burlonamente 'el Dragón Durmiente'.\n\nNunca lo vio como una burla. El más grande de sus maestros fue el estratega Zhuge Liang de la antigua  China, que también fue apodado 'el Dragón Durmiente'. Este apodo lo honra, mientras recrea estrategias antiguas para aplastar a sus enemigos.\n\n#bold  Armado con el conocimiento infinito del pasado y una gran estrategia militar, la conquista de Occidente comienza contigo.#!"
 
 bm_1230_inquisitor_sub_hengeyokai: "Hengeyokai"
 bm_1230_inquisitor_sub_hengeyokai_desc: "Los 'Fantasmas Cambiantes' de Asia son las Feras nativas de estas regiones. En contraste con el mundo dominado por  hombres lobo de Occidente, los Hengeyokai se organizan en Cortes de Bestias donde todos trabajan juntos en (relativa) armonía. Su relación con los otros  sobrenaturales nativos también es menos hostil de lo que uno podría esperar y, aunque existen conflictos, no es inusual que un cambiaformas oriental debata  sobre historia y filosofía con un Kindred del Este o un Shih.\n\nSin embargo, esta cosmovisión no siempre les ha beneficiado y algunas Cortes de Bestias  que una vez fueron poderosas ahora se están debilitando por rivales o amenazadas por infernalistas.\n\n#bold Mientras el mundo sobrenatural asiático se  sumerge en una nueva era incierta, tendrás que asegurarte de que tu Corte sobreviva a los tiempos difíciles que se avecinan.#!"
 bookmark_hengeyokai_tong_long: "Tong Long Hua"
 bookmark_hengeyokai_tong_long_desc: "El 'Sabio Dragón del Norte' es uno de los eruditos sobrenaturales más renombrados de China. Una vez amigo de la Corte  del Emperador Amarillo $pod_kueijin$, Tong Long Hua se ha mantenido distante últimamente, aparentemente siendo testigo de la decadencia moral de los  Muertos Hambrientos gobernantes.\n\nQué, si algo, pretende hacer al respecto es una incógnita.\n\n#bold Has visto las señales. La era Amarilla está  llegando a su fin. Esperas que las mentes sabias guíen el camino hacia la próxima era. Si no, puede que tengas que intervenir.#!"
 bookmark_hengeyokai_nongkhai: "Nongkhai"
 bookmark_hengeyokai_nongkhai_desc: "Un Mokolé recluso del Sudeste Asiático, Nongkhai entendió el valor del mundo exterior cuando fue salvado de [akuma|E]  por el $pod_kueijin$ del Fénix Escarlata.\n\nAún orgulloso pero ahora decidido a no ser sorprendido dos veces, Nongkhai ve las señales de una creciente  marea de oscuridad que se cierne sobre las selvas. Si tiene que reunir él mismo a los sobrenaturales no corrompidos restantes para detener esta catástrofe  inminente, que así sea.\n\n#bold Tu entrada en el mundo político sobrenatural más amplio ha sido brutal, pero ahora entiendes el valor de las alianzas. Es  hora de mostrar a las selvas por qué los Mokolé fueron reyes de todo hace mucho tiempo.#!"
 bookmark_hengeyokai_hunger: "Hambre-de-Qyrl"
 bookmark_hengeyokai_hunger_desc: "Mientras que la Era de los Reyes es solo una cosa que persigue los sueños de la mayoría de los que poseen la memoria de  Gaia, para uno no es la Mnesis lo que le permite recordar, sino la memoria personal. En tiempos antiguos, cuando la Maravilla misma era Trabajada y los  mamíferos eran molestias que se escabullían y tenían que subsistir robando Huevos, un Mosasaurio con ambición cometió un vil pecado contra los [Glossary('Yama Kings','podgloss.yamaking')] de esa Era, masacrando a incontables Rokea y consumiendo su inmortalidad. Pero el Ojo Rojo de Anthelios quemó ese  mundo, la Rueda giró y la Era de los Mamíferos superó a la Era de los Reyes. Pero ese infernalista aún permanecía durmiendo en las fosas más profundas,  hasta que un relicario similar de esa era pasada los despertó y les dio dirección.\n\nAhora conocida solo por la Mnesis como el Hambre-de-Qyrl, el Hambre  ha regresado al mundo otra vez, acechando los océanos tanto en el Reino de Gaia como en los [UmbraGlossaryLocalized('yomi_wan','Miles de Infiernos')] por  igual. Los descendientes de aquellos que la condenaron ahora juegan a ser reyezuelos, habiendo olvidado la nobleza que una vez poseyeron, mientras estas  despreciables ratas sin cola que caminan sobre sus patas traseras llevan la corona. Han olvidado su miedo, y todos han pecado contra los verdaderos reyes  del mundo. Deben arrodillarse de nuevo, deben temer de nuevo y deben reconocer que no están en la cima de la cadena alimenticia. Los océanos los reclamarán  a todos, y esos malditos pecadores aprenderán de primera mano qué fuerzas ctónicas gobiernan adecuadamente el mundo.\n\n#bold Espantajo para tus compañeros  Dragones y la temida bestia de las Profundidades infernales, el Hambre reanuda su caza con aspiraciones de recordar al hombre las edades en que sus  ancestros eran carne para los señores adecuados de la Tierra. Recuérdales quién está adecuadamente en la cima de la cadena alimenticia y conviértelos en  comida para peces.#!"
 bookmark_hengeyokai_little: "Pequeña"
 bookmark_hengeyokai_little_desc: "Tras la aniquilación de las últimas fuerzas de los Khan malayos, los Khans del Sudeste Asiático están divididos y en  pánico. El último Anciano de los Khan fracasó en su intento de detener a las fuerzas Akuma, y ahora los Khans Harimau han acudido a la Viuda del difunto  Anciano como nueva líder. Pequeña, cuya vida hasta ahora ha estado definida por la lucha, la pérdida de la familia y la tribulación, está en una  encrucijada. Aunque la pérdida de su difunto esposo Colmillo-Noble aún duele, los encuentros con una fuerza creciente en el norte abren una nueva  posibilidad. Los Akuma continúan bailando en ríos de sangre, mientras la Madre Esmeralda llora ante la violación de su cuerpo. El momento de actuar se  acerca rápidamente.\n\nPequeña tiene dos cursos ante ella. La inacción, replegarse y convertir sus terrenos de caza en una fortaleza contra los demonios, o  la acción, salir y llevar la lucha a los Akuma. Sin embargo, los Khans han fracasado antes y sus números aún se están recuperando. Las propias hijas de  Pequeña estarían luchando en esta guerra, y ella ha jurado no perder a más de su familia. Sin embargo, los Wan Kuei en el norte están saliendo de su propio  aislamiento, y si Pequeña comienza su marcha, puede que no necesite hacerlo sola.\n\n#bold ¿Qué destino les espera a los Khans Harimau de Malasia?  ¿Sobrevivirán a la tormenta y se mantendrán firmes donde siempre lo han hecho? ¿O los liderará en una nueva guerra para destruir a las bestias profanadas  que saquean a su Diosa Madre? Y si lo hacen, ¿fracasará como lo hizo su esposo? ¿O creará un nuevo estado de Khans para igualar a sus primos indios?#!"
 bookmark_hengeyokai_towers: "Torres-Sobre-los-Reyes"
 bookmark_hengeyokai_towers_desc: "El joven y ambicioso Mokolé de la isla de Komodo es un dragón como ningún otro. Evitando el pensamiento contemplativo y  el sueño profundo en la memoria colectiva de su raza, Torres-Sobre-los-Reyes está más preocupada por demostrar que es una sucesora digna de los antiguos  dragones.\n\nTanto para mejorar la situación de sus parientes como para halagar su propia vanidad, pero aún así, la intención es lo que cuenta.\n\n#bold  Las lecciones del pasado es mejor dejarlas atrás y esta obsesión con ellas es la causa de la decadencia de tus parientes. Solo tu vigor juvenil y tus  Grandes ambiciones pueden allanar el camino hacia el futuro para la isla de Komodo.#!"
 bookmark_hengeyokai_wolaru: "Wolaru"
 bookmark_hengeyokai_wolaru_desc: "La Reina de la Tierra del Fuego rara vez se aleja de su dominio de Bandaiyan. Da la bienvenida a los que protegen a la  Madre y mata a los que no. Una existencia simple pero efectiva.\n\nSeñales y presagios preocupantes la han llevado al borde de su dominio en Papúa para  observar el mundo exterior y reflexionar sobre si esta postura defensiva seguirá siendo la más efectiva en el futuro.\n\n#bold Bajo tu vigilancia,  Bandaiyan es inexpugnable. Aún así, el gobernante sabio no subestima las amenazas futuras y ves a muchas de ellas prosperando mucho más allá de las aguas... #!"
 bookmark_hengeyokai_munekane: "Munekane"
 bookmark_hengeyokai_munekane_desc: "Mientras el resto de los Hengeyokai hacen sus amistades y alianzas, el solitario Munekane se recluye en su templo.  Creyendo que asociarse con otros es una completa pérdida de tiempo, el Mokolé ha dedicado su vida a dominar su propio cuerpo.\n\nSu hogar infestado tanto  de no-muertos como de Hakken, el monje guerrero tiene mucho que preparar.\n\n#bold El Apocalipsis llegará eventualmente, ¿lo romperás o te romperá a ti?#!"
 bookmark_hengeyokai_masamune: "Masamune"
 bookmark_hengeyokai_masamune_desc: "Un legendario Hakken y uno de los primeros Hombres Lobo en migrar a Nippon. Masamune pasó la mayor parte de sus  primeros años tanto fabricando como usando varias espadas. Su viaje culminó en la creación de una ōdachi de considerable poder, que ha manejado con una  efectividad aterradora.\n\nRodeado de su esposa y seis hijos, Masamune se mantiene firme contra cualquier amenaza a su familia. Sin embargo, la edad  finalmente lo está alcanzando, y ahora recae en sus hijos salvaguardar al Clan.\n\n#bold El tiempo se acaba, ¿te desvanecerás en tu hogar? ¿O serás el  Trueno en una tormenta final y grandiosa?#!"
