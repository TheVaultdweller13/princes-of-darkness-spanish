 bm_1510_birthofsects: "Camarilla y Sabbat"
 bm_1510_birthofsects_desc: "La Era de la Inquisición y la Revuelta Anarquista han terminado con la Convención de Thorn de 1493. Este acontecimiento  trascendental creó la Camarilla, el esfuerzo más ambicioso que los Cainitas hayan intentado para organizarse mediante un conjunto de reglas destinadas a  preservar la Mascarada.\nSin embargo, no todos los clanes están de acuerdo y se ha creado otra secta, una que asume su naturaleza monstruosa, en respuesta:  el Sabbat.\nSin embargo, no todos los vampiros han elegido seguir estas dos nuevas direcciones, y su futuro es todavía bastante incierto.\n\n#bold La  disciplinada Camarilla, el salvaje Sabbat, los Anarquistas supervivientes o los independientes restantes... ¿quién triunfará?#!"
 bookmark_birthofsects_tyler: "Tyler"
 bookmark_birthofsects_tyler_desc: "Entre los campesinos que se levantaron en apoyo del rebelde inglés Wat Tyler, Patricia fue quien se convirtió en su  amante. Capturada poco después, fue arrojada a la prisión y esperaba una muerte segura cuando un Brujah llamado Robin Leeland confesó su admiración por su  celo revolucionario. Al final de su visita a su celda, Robin la Abrazó.\nInspirada por su [Glossary('Sire','game_concept_Sire_desc')], finalmente se  convirtió en una de las líderes principales de la causa Anarquista. En 1394, se encontraba entre un grupo que atacó un pequeño castillo en España. Durante  la batalla, aprovechó la oportunidad para diablerizar a Hardestadt el Viejo. Este evento consolidó su fama eterna y todos los Anarquistas ahora la miran  como la heroína que finalmente los llevará a la gloria.\n\n#bold Algunos dicen que la Revuelta Anarquista ha terminado y que los Ancianos han ganado. Pero  si Robin te enseñó algo, es que la lucha nunca terminará realmente. La Revolución es eterna.#!"
 bookmark_birthofsects_genevra: "Genevra"
 bookmark_birthofsects_genevra_desc: "En vida, Genevra era una noble italiana, pero por la noche servía a los Giovanni como una sirvienta menor y un  recipiente de tormento. Usando sus considerables habilidades de intriga, logró engañar a su amo y lo obligó a $pod_Embrace$erla.\nGenevra repitió este  éxito, esta vez llevando a los Inquisidores hacia sus compañeros de clan más débiles. Su ayuda para desarraigar a tantos vampiros le valió a Genevra la  gratitud de la Inquisición, que pudo convertir en un nivel de influencia Giovanni dentro de la propia Iglesia. El fortalecido $pod_clan$ Giovanni pudo así  dirigir la mirada de estos Inquisidores hacia vampiros rivales de otros clanes. Genevra explotó esta influencia única como palanca para obtener tutoría en  el bien guardado arte de la Nigromancia.\n\n#bold Tu rápido y traicionero ascenso al poder te ha ganado muchos enemigos, y debes seguir siendo más astuta  que todos ellos en tu camino hacia la cima.#!"
 bookmark_birthofsects_giangaleazzo: "Giangaleazzo"
 bookmark_birthofsects_giangaleazzo_desc: "Giangaleazzo fue [Glossary('Embraced','game_concept_Embrace_desc')] por un monje Lasombra, que admiraba su  ingenio y fuerza de voluntad. Poco después de su Abrazo, Giangaleazzo prosperó entre los no-muertos, deleitándose en su nuevo estado como uno de los  señores oscuros de la noche. Su [Glossary('Sire','game_concept_Sire_desc')] lo llevó a la Convención de Thorn, donde fue uno de los pocos Lasombra que  apoyaron a la Camarilla, gracias a un desagradable encuentro con un cazador de brujas. Tras la formación del Sabbat, Giangaleazzo enfrentó a ambos bandos  con cautela, tratando de mantener su neutralidad. Después de traicionar a su sire ante el Sabbat, fue aceptado en la secta y coronado Arzobispo de Milán. \n\n#bold Has ascendido en las filas del Sabbat más rápido de lo que la mayoría hubiera pensado posible. Aunque realmente no te importan sus dogmas, son  útiles por ahora. Después de todo, un verdadero Príncipe moderno aprovecha todas las oportunidades que se le presentan...#!"
 bookmark_birthofsects_villon: "François Villon"
 bookmark_birthofsects_villon_desc: "Nacido como Guillaume de Lorris, aquel que llevaría muchos nombres fue aplastado por su insensible $pod_Embrace$ en los  colmillos de la temible Helena. Hundiéndose en la desesperación, pasaron muchos años y el constante apoyo de la bella Violetta para que Guillaume renaciera  como François Villon.\nEste nuevo hombre horrorizaría a su yo pasado, siendo casi un duplicado de su [Glossary('Sire','game_concept_Sire_desc')], un  hedonista insensible, ávido de poder y con pocos o ningún escrúpulo moral. François ya no quiere preocuparse, sin embargo, y su ascenso al poder ha  comenzado. Helena tenía razón al ver en él un prodigio potencial, ya que en menos de dos siglos, el que fuera un deprimido neonato es ahora el segundo  vampiro más influyente de Francia.\n\n#bold Has abandonado tu propia vida y sus mezquinos límites morales. Ahora eres un despiadado y ambicioso ambicioso  del poder y te encanta. Francia está a solo unas cuantas traiciones y corazones rotos de ser tuya...#!"
 bookmark_birthofsects_tepes: "Vlad Drácula"
 bookmark_birthofsects_tepes_desc: "Un príncipe ingenioso y cruel de Valaquia en vida, Vlad Tepes había estado bebiendo la sangre de un vampiro que capturó  y encerró en el Castillo Drácula y aprendiendo sus secretos antes de su 'muerte'.\nIntrigado por la sociedad de la noche, Vlad buscó un patrocinador, o  víctima, que pudiera concederle el $pod_Embrace$. Preparó pacientemente un plan, orquestando una batalla entre la Camarilla y el Sabbat cerca de su  castillo. Una vez que ambas fuerzas se debilitaron, Vlad intervino y acabó con ambas, capturando a los vampiros más poderosos restantes para su propio uso. \nVlad Tepes es ahora un vampiro muy joven con muchos enemigos, pero la mayoría de ellos apenas están comenzando a comprender de lo que es capaz.\n\n#bold  Una noche, serás tan famoso como Caín. Pero hasta entonces, debes construir tu leyenda y conquistar como lo hiciste de mortal. Transilvania siempre será  tuya y solo tuya.#!"
 bookmark_birthofsects_tegyrius: "Tegyrius"
 bookmark_birthofsects_tegyrius_desc: "De mortal, Tegyrius sirvió en el ejército de Alejandro Magno. [Glossary('Embraced','game_concept_Embrace_desc')] en  el $pod_clan$ como miembro de la Casta de los Visires, Tegyrius ha creído durante mucho tiempo las historias de que los Hijos de Haqim estaban destinados a  ser jueces.\nLa mayor parte de su existencia la ha pasado en este papel: como árbitro anónimo en disputas entre $pod_cainites$, en las Cortes Bizantinas  mientras se compilaba el Codex Justinianus, o merodeando como un lobo cazador y dando muerte a sus enemigos.\nCon el tratado de Tiro que obliga a los Hijos  de Haqim a una paz incómoda con la Camarilla, las habilidades de Tegyrius como diplomático son necesarias en Anatolia, donde su pueblo y la Camarilla  comparten esta frágil tregua.\n\n#bold Debes proteger los intereses de tu clan, quizás incluso contra sí mismo. Ya sea que la Camarilla perdure o flaquee,  Anatolia debe seguir siendo segura para los Hijos de Haqim.#!"
 bookmark_birthofsects_karsh: "Karsh"
 bookmark_birthofsects_karsh_desc: "Se cree que Karsh es el selyúcida Hassan al-Samhir, conquistador de Manzikert, el más grande de los generales, que  sirvió a dos sultanes del incipiente Imperio Otomano, aquel a quien los turcos exaltaron en el verso 'Samhir, gran Samhir, inexorable Samhir, el más  poderoso de los guerreros bajo el antiguo cielo azul'.\nLos historiadores Cainitas cuentan historias de un encuentro auspicioso entre la mano no-muerta y  la voluntad inquebrantable. Fue allí donde Hassan al-Samhir prometió lealtad eterna a un inmortal que se hacía llamar Hardestadt de Ventrue, líder de  hombres y monstruos, un ser cuyas palabras influían en naciones, y portador de una inteligencia asombrosa, que sabía que las palabras no siempre serían  suficientes. Hassan al-Samhir dio su juramento y se convirtió en Karsh, el Señor de la Guerra de la Camarilla.\n\n#bold Eres estoicamente silencioso en la  paz, pero te conviertes en una máquina de matar cuando entras en el campo de batalla. Cualquiera que amenace a la Camarilla debe pasar por ti primero.#!"
 bookmark_birthofsects_erianthe: "Erianthe"
 bookmark_birthofsects_erianthe_desc: "Cuando era bebé, Erianthe fue abandonada a su suerte en las escaleras del Palacio de Knossos, y sus padres nunca  supieron que fue acogida por una anciana que vivía en las ruinas. Theophania, una profetisa Malkavian, crió a Erianthe y le enseñó los caminos del Oráculo.  Cuando Theophania sintió el llamado de abandonar Creta, [Glossary('Embraced','game_concept_Embrace_desc')] a Erianthe y la dejó para que sirviera como el  próximo Oráculo.\nErianthe siempre actúa con gran dignidad, pero sufre de depresión severa. Después de cada profecía exitosa, cae en una profunda  melancolía y, a veces, se niega a refugiarse con la llegada del amanecer. Hay ocasiones en que mira las centelleantes aguas del Egeo y anhela lanzarse a  las olas. Si no fuera por sus fieles y devotos seguidores, esto probablemente habría sucedido hace mucho tiempo.\n\n#bold Eres el último recipiente de la  voluntad de los Olímpicos en la Tierra, una gran carga que debes aprender a sobrellevar.#!"
 bookmark_birthofsects_petrodon: "Petrodon"
 bookmark_birthofsects_petrodon_desc: "Nacido como el Conde Alonso Cristo Petrodon de Sevilla, Petrodon fue alcanzado por la peste en 1348; el Nosferatu  Cristo lo [Glossary('Embraced','game_concept_Embrace_desc')] para salvarle la vida.\nPetrodon rápidamente se ganó una reputación por reprimir brutalmente a  los Anarquistas. Quizás uno de los partisanos más fanáticos de la Camarilla, Petrodon asusta incluso a sus seguidores más leales, temiendo que puedan ser  hallados deficientes ante sus elevadas expectativas en cualquier momento.\n\n#bold La Camarilla es el único camino a seguir. Anarquistas, Sabbat,  independientes, incluso aquellos que no muestran una devoción absoluta a la causa... todos serán barridos por tu justa furia.#!"
 bookmark_birthofsects_seinia: "Seinia"
 bookmark_birthofsects_seinia_desc: "Una pequeña terrateniente $pod_cainite$ en los alrededores de Nóvgorod, Seinia era una ama estricta pero cariñosa con  su rebaño. Por lo tanto, cuando su hacienda fue atacada y todos fueron masacrados, se sorprendió al descubrir que realmente los extrañaba.\nEncontrándose  por casualidad con un séquito de Caballeros de las Cenizas Amargas, Seinia hizo causa común con ellos para vengar a su pueblo. Luego se unió a su orden y  se convirtió en una de las pocas mujeres en recibir el $pod_Embrace$ del Grial.\nSin embargo, la Inquisición destruyó la mayor parte de la orden, y Seinia  se encontró cayendo cada vez más en sus viejos hábitos de moral dudosa. Perdiendo su fe y convicción, se juntó con el incipiente Sabbat y sirve como su  Arzobispa rusa de mayor éxito hasta ahora.\n\n#bold Tus sueños infantiles de redención han quedado atrás. La única verdad en este mundo es el poder, y tu  alma puede condenarse en el camino por el poco bien que alguna vez te hizo.#!"
 bookmark_birthofsects_nefertiti: "Nefertiti"
 bookmark_birthofsects_nefertiti_desc: "Nefertiti fue una vez una princesa egipcia y, según sus palabras, reina antes de caer en desgracia. Algunos dicen  que fue la consorte del faraón Akenatón del mismo nombre, aunque otras venerables Setitas como Neferu podrían cuestionar tal afirmación.\nEn sus días de  vida, cayó ante los encantos del Ravnos Ankla Hotep hasta que supo que lo único que el canalla Ravnos quería era su cuerpo y su riqueza, dejándola con el  corazón roto. Después de que Set la salvara de la muerte mediante el $pod_Embrace$, Nefertiti llegó a aceptar plenamente su nuevo papel dentro del  $pod_clan$ y se convirtió en una de las más grandes defensoras de los objetivos de Set.\nTras varios intentos fallidos, recientemente ha emprendido una  misión para infiltrarse en la incipiente Camarilla, comenzando desde uno de sus puntos más débiles en Alemania.\n\n#bold Tus compañeros Setitas dudan de  tus afirmaciones y logros. Es hora de demostrarles que están equivocados corrompiendo a la propia Camarilla.#!"
 bookmark_birthofsects_karl: "Karl Schrekt"
 bookmark_birthofsects_karl_desc: "En vida, Karl Schrekt fue un temido cazador de demonios de Viena. Un hombre decidido, se le atribuye haber puesto al  poderoso Eirik Eigermann en $pod_torpor$.\nFue [Glossary('Embraced','game_concept_Embrace_desc')] por su [Glossary('Sire','game_concept_Sire_desc')]  después de ser derrotado en una difícil lucha. Sobreviviendo a las hogueras de la Inquisición (una amarga y dolorosa ironía para un hombre que una vez cazó  demonios), llegó a la conclusión de que la Camarilla era el evento más importante en la historia de los Kindred y se comprometió con ella.\nLa reputación  de Karl entre los Tremere y la Camarilla crece cada noche y ya se han encendido muchas hogueras para los Sabbat o Anarquistas que lo subestimaron.\n\n#bold  Tu trabajo no es muy diferente del que hiciste en tu vida mortal. Cazas monstruos para proteger a otros. El hecho de que tú mismo seas un monstruo nunca te  detuvo antes, y tampoco lo hará ahora.#!"
 bookmark_birthofsects_mukhtar: "Mukhtar Bey"
 bookmark_birthofsects_mukhtar_desc: "Mukhtar Bey fue un mameluco en vida y un guardaespaldas en la no-muerte del poderoso Príncipe de El Cairo, Antonius.  Todo cambió cuando los Lupinos atacaron y el Príncipe fue asesinado, dejando al bien considerado Mukhtar para ser aclamado como el nuevo líder.\nMukhtar  Bey gobierna El Cairo como una ciudad libre, sin jurar lealtad a una de las grandes sectas de los no-muertos, permitiendo a los Kindred de cada $pod_clan$  y herencia dentro de sus fronteras.\nA pesar de varios agoreros que piden su destrucción, es capaz de controlar a las dispares facciones en El Cairo, y se  gana el respeto, ya que su gobierno es firme a pesar de los muchos cambios en los vientos políticos.\n\n#bold Todavía te avergüenzas de haber fallado a tu  Príncipe y amigo en su momento de necesidad y resientes tu legado Caitiff como el probable culpable. Aun así, no fallarás a El Cairo, cueste lo que cueste. #!"
 bookmark_birthofsects_phaedyme: "Phaedyme"
 bookmark_birthofsects_phaedyme_desc: "Phaedyme fue originalmente un soldado en el ejército de Alejandro Magno, haciéndose pasar por hombre para escapar del  destino esperado para su sexo. En la India, Phaedyme fue [Glossary('Embraced','game_concept_Embrace_desc')] por Kali, y viajaron por el mundo durante mucho  tiempo antes de establecerse en la Galia. Se dedicó a dominar la guerra y el honor.\nFascinada por los ideales de la caballería, fue sin embargo obligada a  entrar en $pod_torpor$ durante la mayor parte de las Edades Oscuras. Ahora recién despertada, está furiosa al ver que los ideales que amaba se han  desvanecido y está reuniendo a sus seguidores más cerca de la India y lejos de las sectas corruptas, con la esperanza de preservar algo del legado  caballeresco en este nuevo hogar.\n\n#bold Mientras Europa olvida el código de honor marcial que tanto amabas, tienes que mirar a otro lado y empezar de  nuevo. Todavía es tiempo de que los Caballeros Ravnos perduren y prosperen.#!"
 
 bm_1230_werewolves: "Edad Oscura: Hombre Lobo"
 bm_1230_werewolves_desc: "Los Garou (hombres lobo) fueron hechos para defender la tierra, a la que llaman Gaia, de las numerosas fuerzas que amenazan con  destrozarla. Es una lucha contra probabilidades casi insuperables, especialmente considerando la rivalidad entre muchas tribus. Considerándose los  depredadores supremos, están imbuidos de tradiciones milenarias de valentía y renombre.\nLas Edades Oscuras son una época difícil para la Nación Garou. El  crecimiento desenfrenado de las ciudades (y sus titiriteros vampiros) los ha puesto a la defensiva. Peor aún, una misteriosa enfermedad conocida como la  Plaga Desolladora ha matado recientemente a un número catastrófico de ellos, obligando a los supervivientes a retirarse a los bosques y luchar por su  propia supervivencia contra sus enemigos envalentonados.\n\n#bold Gaia te necesita y ninguna dificultad puede distraerte de tu deber sagrado.#!"
 bookmark_werewolves_helen: "Helen de Génova"
 bookmark_werewolves_helen_desc: "La Tribu de las Furias Negras son las matriarcas de los Garou, aceptando solo a mujeres como miembros. Son conocidas por  su honor, sabiduría, orgullo y feroces habilidades en la batalla.\nHelen de Génova es una respetada Furia Negra que recientemente se ha abierto paso hasta  la cima del Caern más renombrado de Europa, la Gloria del Sol. Rodeada de poderosos reinos vampíricos y con su legitimidad aún disputada, Helen necesitará  todo su ingenio y destreza en la batalla para asegurar que esta importante cabeza de puente permanezca a salvo en manos de las Furias Negras.\n\n#bold  Debes demostrar tu valía a los miembros aún dudosos de la Gloria del Sol. ¿Qué mejor manera de hacerlo que aplastando algunas calaveras de vampiros? Hay  muchos objetivos cerca.#!"
 bookmark_werewolves_lucille: "Lucille"
 bookmark_werewolves_lucille_desc: "Los carroñeros y supervivientes de los Garou, la Tribu de los Roedores de Huesos son vistos por las otras tribus como  poco más que mestizos que hurgan en los desechos de la humanidad. Los Roedores de Huesos se ven a sí mismos como desvalidos, esperando triunfar sobre  enemigos confiados.\nLucille es una joven y audaz Roedora de Huesos, que tiene muchas bromas mortales contra los vampiros en su haber. Recientemente ha  ascendido a una posición de poder en el Caern del Campo de las Estrellas, debido principalmente a la casi destrucción de este Caern a manos de la  Inquisición.\n\n#bold Como una de las muy raras líderes de Caern Roedor de Huesos, estás en una posición única para finalmente ganar el reconocimiento de  las otras tribus. Esto no será fácil, sin embargo, ya que el Campo de las Estrellas está desesperadamente rodeado de vampiros e inquisidores.#!"
 bookmark_werewolves_timno: "Timno"
 bookmark_werewolves_timno_desc: "Los pacificadores de los Garou, la Tribu de los Hijos de Gaia trabajan por el entendimiento entre las tribus y esperan  eventualmente formar a todas ellas en un frente unificado contra sus enemigos.\nTimno y su mejor amigo Ilya son dos de los Hijos de Gaia más respetados.  Lideran el Caern del Mar Blanco con honor y deber, pero aún son conocidos por ser implacables con sus enemigos, ganándose el respeto a regañadientes de las  otras tribus.\n\n#bold Finlandia sigue siendo una tierra indómita, pero incluso allí, los vampiros están invadeiendo. Si pudieras asegurar tu hogar para  siempre, las otras tribus podrían aprender a respetar a los Hijos de Gaia por su acción decisiva, acercándote un paso más a la unidad.#!"
 bookmark_werewolves_bladdud: "Bladdud"
 bookmark_werewolves_bladdud_desc: "Basada en gran medida en las tradiciones celtas, la tribu Fianna es conocida entre los Garou por sus pasiones por el  placer de la vida, sus habilidades y ferocidad en la batalla, y como guardianes de la música, las historias y el saber de los Garou.\nEl poderoso y  ampliamente respetado Bladdud es su rey, y quizás su última esperanza tras la catastrófica Plaga Desolladora que diezmó sus números. Con su poder  destrozado y los vampiros más fuertes que nunca en las Islas, Bladdud necesitará toda su astucia y destreza en la batalla para salvar a su tribu.\n\n#bold  La tarea ante ti es inmensa, pero estás listo para ella. Los bardos cantarán historias de tu victoria o de tu obstinada resistencia. De cualquier manera,  harás que sea una buena historia.#!"
 bookmark_werewolves_yvonne: "Yvonne"
 bookmark_werewolves_yvonne_desc: "La tribu de los Getos de Fenris son guerreros severos que encarnan los ideales nórdicos. Valoran la destreza en la  batalla por encima de todo, pero también conceden gran importancia al honor personal y la astucia.\nLa tribu ha logrado recientemente una victoria contra  el vampiro conocido como Wotan (u Odín), pero a un gran costo. Con la mayoría de sus líderes y guerreros muertos durante esta legendaria batalla, los Getos  de Fenris son ahora liderados por la joven Yvonne, que tiene que asegurar rápidamente Escandinavia antes de que los chupasangres puedan recuperarse de este  golpe.\n\n#bold A pesar de la victoria contra Wotan, estás en una posición más débil de lo que pareces. Tendrás que consolidar tus ganancias antes de  lanzarte de cabeza a masacrar a los seguidores restantes de Odín.#!"
 bookmark_werewolves_isabeau: "Isabeau du Laurent"
 bookmark_werewolves_isabeau_desc: "Empapados en la racionalidad, la religión humana y el flujo y reflujo de la ciudad, los Guardianes de los Hombres viven  y mueren según un credo de progreso.\nSu mayor centro de poder está en Acre, donde la bulliciosa ciudad cruzada proporciona la riqueza de experiencias que  tanto anhelan los Guardianes. Allí, son liderados por la joven y ambiciosa Isabeau du Laurent, que tomó el control del Caern después de un brutal golpe,  aunque finalmente incruento. Ahora tiene que mirar a las otras grandes ciudades del Levante, cada una un premio por el que vale la pena luchar.\n\n#bold  Este centro de religiones, progreso y movimiento es un paraíso para los Guardianes de hombres de pensamiento rápido. Acre no es suficiente, sin embargo,  pero tendrás que abrirte paso a través de algunos vampiros si quieres expandir tu dominio en el Levante.#!"
 bookmark_werewolves_stains: "Manchas-Vidrio"
 bookmark_werewolves_stains_desc: "La Tribu de las Garras Rojas cree que la única forma de curar a Gaia es matar a todos los humanos del planeta y luego  dejar que ella equilibre las cosas. Desprecian a los humanos con pasión y se sabe que los atacan a la vista, incluso llegando a devorar su carne.\nLa Plaga  Desolladora ha afectado especialmente a las Garras Rojas y a sus parientes lobos. Acercándose a la extinción, se han retirado a las estepas, lejos del  alcance de los hombres. Allí, luchan contra cualquier invasión vampírica o humana bajo el liderazgo de Manchas-Vidrio, una astuta Garra Roja especialmente  aficionada a usar las religiones de los humanos contra ellos.\n\n#bold Tu posición aquí debe ser asegurada si las Garras Rojas quieren sobrevivir. Busca la  ayuda de las tribus cercanas y ataca rápidamente contra cualquier amenaza.#!"
 bookmark_werewolves_elizaveta: "Elizaveta de Blovice"
 bookmark_werewolves_elizaveta_desc: "Los políticos y manipuladores de los Garou, la Tribu de los Señores de las Sombras trabajan a través de sus estrictas  jerarquías y formas secretas para arrebatar todo el poder que pueden. Su tierra natal está en Europa del Este y su lucha contra el clan de vampiros  Tzimisce es legendaria e interminable.\nLa Plaga Desolladora ha golpeado duramente a los Señores de las Sombras, obligándolos a abandonar varias fortalezas  y retirarse más cerca de las Estepas. Su estructura de poder también se ha visto afectada, dejándolos con la poco preparada, aunque talentosa, Elizaveta  como líder. Por suerte, los Tzimisce han estado demasiado ocupados con los Tremere para aprovechar la ocasión, dando a los Señores la oportunidad de  reagruparse y recuperarse.\n\n#bold Los Señores de las Sombras son pacientes. Espera tu momento, recupera tu fuerza y luego usa el conflicto Tzimisce/ Tremere para destruirlos a ambos.#!"
 bookmark_werewolves_wepauwet: "Wepauwet"
 bookmark_werewolves_wepauwet_desc: "Nómadas y vagabundos, la tribu de los Pasos Silenciosos era originaria de Egipto y Oriente Medio. Fueron expulsados de  su tierra natal ancestral por el vampiro Set y han estado buscando una nueva patria desde entonces.\nWepauwet fue, es y siempre será su líder, ya que el  propio Horus le ha concedido la inmortalidad. Este paciente erudito ha estado llevando a sus hermanos a Marruecos, siguiendo los presagios dejados por los  espíritus aliados. Allí, encontraron el poderoso Caern de la Rueda de Ptah y se apoderaron de él, arrebatándoselo a los vampiros cercanos. Por primera vez  en eones, los Pasos quizás han encontrado su nuevo hogar.\n\n#bold Tu tribu te admira y la Rueda de Ptah debe ser asegurada y fortalecida para las batallas  venideras. El tiempo del exilio podría estar llegando a su fin.#!"
 bookmark_werewolves_yuri: "Yuri Tvarivich"
 bookmark_werewolves_yuri_desc: "La 'Tribu Alfa' de la Nación Garou, los Colmillos de Plata son gobernantes tradicionales y líderes de guerra. Estos nobles  Garou son conocidos por su belleza física, coraje y honor.\nYuri y su hermana Sofía lideran la parte de la Luna Creciente de la tribu en Rusia y son  considerados paradigmas de los Colmillos de Plata. Se sabe que lideran personalmente la carga contra los monstruosos secuaces de la temida Baba Yaga. Sus  numerosas victorias y gestos diplomáticos hacia las otras tribus han dejado a los Colmillos de Plata en una cómoda posición de poder en Rusia.\n\n#bold El  futuro parece brillante para los Colmillos de Plata bajo gobernantes tan hábiles, pero no hay lugar para la complacencia. Los secuaces de la Bruja siguen  siendo poderosos, y las otras tribus te admiran para que las guíes a través de estas Edades Oscuras.#!"
 bookmark_werewolves_chakal: "Chakal"
 bookmark_werewolves_chakal_desc: "La más pequeña de las tribus, muchos de los Mirando a las Estrellas son en realidad conversos de otras tribus. Se  preocupan por el equilibrio en todas sus formas, buscando la armonía perfecta tanto interna como externamente. Sin embargo, a menudo se pierden en el  pensamiento filosófico y la mayoría de los Garou piensan que pasan demasiado tiempo contemplando sus ombligos y no suficiente actuando.\nChakal lidera el  Caern del Leopardo de las Nieves, el centro de aprendizaje más renombrado de su tribu. En lo profundo del Himalaya, todos son bienvenidos a unirse y  aprender, e incluso extrañas amistades con vampiros cercanos han sido notadas por algunos sorprendidos forasteros.\n\n#bold La paz requiere vigilancia  constante. Asegúrate de no caer en la complacencia y de contener a cualquier vecino amenazante antes de que puedan abrumar tu oasis de tranquilidad y  meditación.#!"
 bookmark_werewolves_sister_worm: "Hermana Gusano"
 bookmark_werewolves_sister_worm_desc: "La tribu de los Danzantes de la Espiral Negra es la vergüenza de la Nación Garou. Hombres lobo caídos malditos por  su propia arrogancia, ahora son todos monstruos y locos que se alían con los seres más terribles para provocar el Apocalipsis.\nLa completamente insana  Hermana Gusano se cree la '$glossary_wyrm$'s Prophet'. Después de un intento fallido de revivir un poderoso espíritu maligno de las estepas, ahora ha  seguido su 'llamado' a Rusia, donde un gran aliado de su maestro requiere su ayuda.\n\n#bold El Gusano habla de una sabia Bruja que necesita tu ayuda. Y  una recompensa aún mayor si tienes éxito. No te atreverías a decepcionar al Gusano.#!"
 
 mummies_sub_bookmark: "Edad Oscura: Momia"
 bm_1230_inquisitor_sub_mummies: "Edad Oscura: Momia"
 bm_1230_inquisitor_sub_mummies_desc: "Hace mucho tiempo, los Dioses caminaban entre los hombres en la tierra de Egipto. Todo iba bien hasta que el Maligno,  Set, traicionó y mató a sus hermanos. Isis y Horus fueron los únicos supervivientes, pero se negaron a rendirse. Creando el poderoso Hechizo de la Vida,  aseguraron que sus Elegidos renacerían para siempre hasta que la Serpiente fuera finalmente expulsada de Egipto.\nHa pasado mucho tiempo desde esa era de  Leyendas y la influencia de Set solo ha aumentado; algunas Momias incluso han abandonado esta batalla perdida. Sin embargo, el propio Horus no lo ha hecho  y el equilibrio de Ma'at aún podría restaurarse antes de que sea demasiado tarde.\n\n#bold Los leales a Horus, los independientes o los secuaces de la  Serpiente... ¿quién triunfará?#!"
 bookmark_inquisitor_horus: "Horus"
 bookmark_inquisitor_horus_desc: "El Rey Regresado. El Faraón Viviente. Her-nedi-tef-ef. Horus es muchas cosas, pero ante todo, es el Hijo Vengador de  Osiris e Isis.\nHorus ha vivido toda su vida en guerra contra su tío, Set. Ha habido muchos reveses, pero muchos más triunfos. Perdió su ojo, pero hizo que  Set lo pagara caro.\nLa muerte no tiene significado para un ser como él, y utilizó el Hechizo de la Vida para renacer, eternamente, hasta que un día la  victoria definitiva contra Set sea finalmente suya. Desde entonces, Horus ha organizado sus legiones de momias leales y libra la guerra eterna para  restaurar el equilibrio en este mundo.\n\n#bold La guerra continúa. Y ensangrentarás las arenas de Egipto hasta que cada último seguidor de Set sea puesto  ante la severa mirada de Anubis.#!"
 bookmark_inquisitor_neferukhayt: "Neferukhayt"
 bookmark_inquisitor_neferukhayt_desc: "Reina y erudita antes de su Primera Muerte, Neferukhayt fue seleccionada por el Culto de Isis por su estatus  político y su considerable erudición. Pronto demostró que le importaba poco la Cruzada de Horus, encontrando su sed de conocimiento una perspectiva mucho  más interesante para pasar su vida eterna.\nHorus lo tomó como era de esperar, y desde entonces ha partido lo más lejos de Egipto que pudo con otras momias  de ideas afines para encontrar su verdadera vocación. En esto, una vez más se ha convertido en una especie de Reina, gobernando con la gracia y elegancia  que la caracterizaban hace mucho tiempo.\n\n#bold Aunque odias a Set tanto como cualquier otra momia, tienes asuntos más apremiantes que librar una guerra  eterna. Estas extrañas tierras lejos de Egipto tienen tanto que ofrecer...#!"
 bookmark_inquisitor_cabirus: "Cabirus"
 bookmark_inquisitor_cabirus_desc: "Mucho después de que se creara el Hechizo de la Vida y de que Horus y sus seguidores libraran su guerra contra Set y sus  secuaces, algunas momias se cansaron de su guerra aparentemente inútil y se convirtieron en Ismaelitas, que querían ser independientes de Horus y su  guerra. Durante los años siguientes, uno de ellos enseñó a un mago dotado llamado Cabirus los principios del Hechizo de la Vida.\nCabirus usó esto para  crear su propio Hechizo de la Vida y creó sus propios inmortales que no saben nada de Osiris y Ma'at, para horror de los leales a Horus. Destruyeron los  escritos de Cabirus y, como resultado, solo un puñado de momias europeas aún existen, incluido el propio Cabirus... por ahora al menos.\n\n#bold Estás solo  y aislado, aferrándote al Hechizo de la Vida, un secreto deseado por muchos. El peligro puede estar en cualquier lugar.#!"
 bookmark_inquisitor_hemhemti: "Hemhemti"
 bookmark_inquisitor_hemhemti_desc: "Aunque Set nunca logró arrebatar el control del Hechizo de la Vida a Isis y Horus, se acercó lo suficiente como para  poder crear su propia versión del mismo. Esta burla de la verdadera magia crea momias, pero profundamente defectuosas, malditas con tormento eterno y  locura enloquecedora.\nAntes de su renacimiento al servicio de Set, Hemhemti era un traficante de esclavos degenerado y glotón, que llegó a comerse los  sagrados Cocodrilos de Sobek. Esta transgresión absoluta le valió el respeto de Set y su lugar como líder actual de las llamadas Momias Plaga.\n\n#bold Set  quiere que te comas el mundo por él hasta su regreso. Y te divertirás tanto haciéndolo...#!"
 bookmark_inquisitor_inauhaten: "Inauhaten"
 bookmark_inquisitor_inauhaten_desc: "La momia conocida como Inauhaten fue una vez arquitecto, pero después de su renacimiento comenzó el estudio de la  muerte para aprender más sobre sí mismo y la otra vida.\nSe dice que fue él quien les contó a los magos de la Tal'Mahe'Ra sobre la naturaleza de Enoc  cuando se encontraron con él por primera vez en Egipto. A cambio de la protección de su cuerpo mientras Inauhaten esperaba la resurrección, les informó  sobre las cosas que vio en el [UmbraGlossaryLocalized('shadowlands','Inframundo')], incluido el conocimiento de los espectros y su sociedad arcana. Lo más  importante, habló de un reino llamado Enoc y fue aceptado en la secta después de que los guiara a la ciudad y los ayudara a capturarla. Desde entonces ha  sido un miembro de alto rango y respetado, aunque distante, de la secta.\n\n#bold Tus objetivos son tuyos, pero por ahora están alineados con la  Tal'mahe'Ra.#!"
 bookmark_inquisitor_astrokhen: "Astrokhen"
 bookmark_inquisitor_astrokhen_desc: "#R ¡Este personaje no tiene tierras y, por lo tanto, necesita el DLC Roads to Power para ser jugable!#!\n\n Un mago  ambicioso en el Antiguo Egipto, Astrokhen buscó la vida eterna y, después de huir de un desagradable encuentro con Horus, la encontró gracias a la momia  descarriada Cabirus.\nHorus no estaba exactamente contento, sin embargo, y alcanzó a Astrokhen muy pronto. Impresionado por su terquedad y voluntad de  sobrevivir, el Vengador decidió no destruir a Astrokhen y, en cambio, lo maldijo con una importante tarea. Así, a la momia reacia se le entregó una gran  cantidad de poderosos artefactos que Horus quería salvaguardar, con la orden de no dejar que nadie se acercara a ellos. Y así fue durante milenios hasta  que el vampiro llamado Kli Kodesh manipuló los eventos para que la caché de Astroken fuera saqueada, sus amados artefactos esparcidos al viento.\n\n#bold  Debes reunir tantos artefactos como puedas antes de que la maldición de Horus te alcance.#!"
 
 demons_sub_bookmark: "Edad Oscura: Demonio"
 bm_1230_inquisitor_sub_demons: "Edad Oscura: Demonio"
 bm_1230_inquisitor_sub_demons_desc: "Antes de que Adán y Eva siquiera existieran, Dios hizo a los ángeles para que lo ayudaran a dominar la Creación. Pero  pronto se sintió decepcionado de ellos y ordenó a sus Ángeles que se escondieran y dejaran que la humanidad decayera. Lucifer se negó y la Guerra del Cielo  nació ese día.\nLas legiones de Dios triunfaron, arrojando a los rebeldes a una horrible Prisión Abisal, retorciéndolos hasta convertirlos en una burla de  su antiguo yo. A lo largo de las eras, solo un puñado de ellos escapó, convocados por infernalistas imprudentes. Y así, nacieron los demonios.\n\n#bold  Arranca las estrellas del cielo, derriba toda la Creación y arroja las cenizas a la cara de este Dios indiferente. Quizás entonces tu tormento termine  finalmente.#!"
 bookmark_inquisitor_vassago: "Vassago"
 bookmark_inquisitor_vassago_desc: "Vassago es un demonio de la envidia, que se regocija mórbidamente al ver los sueños y esperanzas de los mortales  convertirse en cenizas y amargura. Sus poderes son más sutiles que los de muchos otros demonios, pero no menos efectivos a pesar de la falta de espectáculo  sangriento y llameante. Puede percibir los hados y destinos de los mortales (y cómo evitar que esos destinos se cumplan). Tiene poder sobre los sueños y  pesadillas, las visiones y los presagios; puede leer los pensamientos y recuerdos de los mortales, y plagarlos con maldiciones de desgracia y locura. \nConvocado en la India por un culto jainista corrupto, el poder de Vassago ha sido efectivamente limitado hasta ahora por otras poderosas entidades que  reclaman el subcontinente.\n\n#bold Tus seguidores son débiles y tu base de poder pequeña. Pero eres paciente, después de todo la eternidad está de tu lado. #!"
 bookmark_inquisitor_orobas: "Orobas"
 bookmark_inquisitor_orobas_desc: "Convocado hace milenios y atado a una estatua de arenisca húmeda y viscosa, el culto de Orobas fue destruido y su  relicario perdido. Fue alrededor de la década de 1210 cuando un erudito valdense demasiado inquisitivo, después de leer antiguos documentos eclesiásticos  sobre una secta aborrecible, descubrió el relicario del demonio enterrado en una ciénaga alemana. Su posterior descenso a la locura fue el goteo de fe  deformada que el demonio necesitaba para regresar a la vida antinatural una vez más.\nClasificado como demonio de la gula, Orobas se centra en los placeres  físicos, pero su ámbito también incluye animales pequeños, veneno, desechos corporales y hambres. Desde su regreso, se ha interesado mucho en la Iglesia,  viendo a esta poderosa organización como la herramienta perfecta para su ascensión.\n\n#bold Será tu deber, y placer, liberar a esta triste humanidad de su  prisión de 'restricción' y 'moralidad'...#!"
 bookmark_inquisitor_bezariel: "Bezariel"
 bookmark_inquisitor_bezariel_desc: "Bezariel fue una vez un Ángel de la Muerte. Pronto se amargó con su tarea de cosechar almas mortales e intentó hacerse  parecer lo más atractivo posible para sus indefensos cargos, pero por más inocente que fuera la cara que construyera, no pudo aliviar su miedo y dolor ante  la muerte.\nY sin embargo, a pesar de su temible destreza en la batalla, fue arrojado al Abismo como los demás. Milenios después, fue convocado por un  infernalista descuidado, pero este peón servía a una amante mucho más grande.\nBezariel se encontró obligado a servir a una criatura de maldad tan  sobrecogedora que el demonio casi palidecía en comparación. Esta bruja, llamada Baba Yaga en la leyenda humana, le murmuró sus planes. Al hacerlo, se  encontró atado, dependiendo de ella para no volver gritando al Abismo.\n\n#bold Estás interpretando el papel de general leal. Como Ángel de la Muerte,  sabes que el destino alcanzará a la Bruja de Hierro una noche. Y tienes la intención de estar listo para esa noche.#!"
 bookmark_inquisitor_ares: "Ares"
 bookmark_inquisitor_ares_desc: "Ares es una encarnación de la violencia, la sed de sangre y el sadismo. Su adoración era más a menudo un acto de  apaciguamiento para evitar la ira de la deidad que cualquier forma de devoción.\nAunque fue convocado por primera vez por los griegos, Ares realmente se  convirtió en uno de los demonios más poderosos durante su mandato como Marte, el dios romano de la guerra. Cabalgando sobre la violenta sed de conquista de  las legiones, el culto y el poder de Ares se convirtieron en un rival para los más poderosos archiduques del Infierno.\nEntonces llegó el cristianismo.\nA  pesar de los mejores esfuerzos de Ares (y de otros demonios), no pudieron corromper la fe de los primeros creyentes de la Cruz y Marte pronto fue un  recuerdo lejano. Hoy en día, el que fuera un poderoso demonio se ha reducido a luchar por la adoración en las partes más aisladas de Grecia, tan débil como  el día en que fue convocado.\n\n#bold El mundo te ha olvidado, pero no ha olvidado la guerra. Eso será suficiente para comenzar tu ascensión de nuevo.#!"
 bookmark_inquisitor_lamashtu: "Lamashtu"
 bookmark_inquisitor_lamashtu_desc: "Convocada por los asirios y luego adorada como 'Ella-Quien-Borra', Lamashtu fue atada a un demonio mayor llamado Tiamat  y conspiró para deshacerse de ella. Su lucha costó la vida de muchos de los adoradores de Lamashtu, lo que resultó en que ella quedara muy debilitada  después de su victoria.\nAtrapada bajo el mar y casi arrastrada de regreso al Abismo, Lamashtu usó el último de su poder para salvar a Onesilos, un griego  jonio. En él, encontró un sirviente agradecido y logró aferrarse a este mundo. Luego intentó usarlo para reubicarse en Acre, donde sintió un gran potencial  de poder, pero sin éxito.\nDesde entonces, Lamashtu ha estado jugando a la larga. Su culto es pequeño, pero lo suficientemente dedicado como para que  finalmente pueda ejercer algo de su poder en este mundo.\n\n#bold Con la actual agitación en el Levante, finalmente podrías tomar el control de Acre, con  la esperanza de que el misterioso poder bajo la ciudad sea suficiente para hacerte ascender a las filas de los demonios mayores de una vez por todas.#!"
 bookmark_inquisitor_mammon: "Mammon"
 bookmark_inquisitor_mammon_desc: "Rex Mundi, Marduk, Demiurgo, Jaldaboth... Mammon tiene muchos disfraces, pero en verdad es solo una cosa: la encarnación  del poder mundano y el materialismo. En verdad, Mammon no tiene que buscar nuevos adoradores, estos acuden a él de forma natural, dispuestos a hacer  cualquier cosa en la búsqueda de dinero, poder y fama. Acuden a él en masa, empuñando un nivel significativo de influencia social y lo suficientemente  despiadados para aplastar a cualquiera (o cualquier cosa) que se interponga en su camino.\nEl ascenso de Mammon solo se vio frenado por el cristianismo  primitivo y su énfasis en las vidas virtuosas (y a menudo pobres). Llevado a dormitar, el 'Rey del Mundo' ha despertado recientemente, gratamente  sorprendido de ver a su que fuera su mayor enemigo, la Iglesia, caído en el vicio de la Avaricia incluso sin su intervención.\n\n#bold Los negocios están  en auge y hay tantos clientes esperando lo que tienes para ofrecer...#!"
 bookmark_inquisitor_nikannuranu: "Nikannuranu"
 bookmark_inquisitor_nikannuranu_desc: "Un antiguo ángel de la luz estelar y del firmamento, Nikannuranu era, a todos los efectos, una herramienta confiable  pero bastante menor en el gran esquema de Dios. Contento con observar las estrellas y seguir el gran diseño, Nikannuranu se unió a la rebelión de Lucifer  por pura curiosidad ante este extraño cambio de patrones. Y como los otros rebeldes, cayó en desgracia.\nArrojado a la Prisión Abisal casi como una  ocurrencia tardía, Nikannuranu escapó solo muy recientemente, encontrándose atado a un castillo modesto en Transilvania, Hunedoara. Sin nadie que lo adore  y le proporcione la fe que tanto necesita, sabe que la Prisión Abisal pronto lo reabsorberá, y estará nuevamente tan lejos de sus amadas estrellas. \n\n#bold Necesitas encontrar una fuente de fe pronto si quieres evitar el Abismo. Tienes unos pocos candidatos ingenuos en mente...#!"
 bookmark_inquisitor_belphegor: "Belphegor"
 bookmark_inquisitor_belphegor_desc: " #R ¡Este personaje no tiene tierras y, por lo tanto, necesita el DLC Roads to Power para ser jugable!#!\n\n Encargada  por el propio Lucifer de comprender los límites de la humanidad durante la Caída, Belphegor disfrutó de su trabajo al máximo. Le llevó muchos ensayos y  errores, y muchos sujetos de prueba rotos, pero logró sentar las bases para la creación de los semidemonios conocidos más tarde como Nefilim. Su recompensa  fue un palacio de placer y horrores, y gobernó perezosamente aquí hasta que la Hueste Celestial la derribó.\nConvocada por descuidados infernalistas  hebreos hace siglos, rápidamente se dispuso a reiniciar su amado trabajo.\n\n#bold Esos divertidos mortales han aprendido algunos trucos desde la Caída.  Tendrás que tener más cuidado al probar a fondo los nuevos límites de sus frágiles cuerpos.#!"
 
 bm_1230_warofprinces_group: "Edad Oscura: Vampiros"
 bm_1230_werewolves_group: "Edad Oscura: Hombres Lobo"
 bm_1230_fae_group: "Edad Oscura: Hadas"
 bm_1375_patronwar_group: "La Guerra del Mecenas"
 bm_1510_birthofsects_group: "Nacimiento de las Sectas"
 
 bm_1230_fae: "Edad Oscura: Hadas"
 bm_1230_fae_desc: "Ha pasado un siglo desde la firma de la Tregua del Juramento que detuvo las hostilidades abiertas entre las Cortes de los nobles Sidhe.  La rueda de las edades sigue girando, y ahora los militantes presionan por un regreso a la Guerra de las Estaciones, mientras que los Portadores de la  Tregua se aferran al pacto de paz. Los adivinos advierten de una oscuridad venidera mientras la humanidad pasa de los sueños a la banalidad de la mera  supervivencia. Los humanistas abogan por que las hadas se vinculen más estrechamente con la humanidad, mientras que los constantinianos están fascinados  por la más poderosa de las instituciones mortales: la Iglesia.\n\n#bold ¿Volverá la Primavera? ¿Durará el Verano? ¿Es inevitable el Otoño? ¿Será eterno el  próximo Invierno?#!"
 
 bookmark_fae_the_white_lady: "Pressyne"
 bookmark_fae_the_white_lady_desc: "Varias aldeas remotas de Europa Occidental tienen un juramento fuerte y vinculante con la Dama Blanca. Ella y sus  súbditos curan o reposan suavemente a todos los infantes humanos enfermos en las aldeas siempre que se realicen ciertos rituales y se mantengan ciertas  prohibiciones. Pressyne es una anciana respetada de la Corte de Primavera desde su asiento en la Promesa del Pozo de las Hadas y la lidera con benevolencia  y una perspectiva humanista."
 bm_1230_fae_sub_sidhe: "Casas Sidhe"
 bm_1230_fae_sub_sidhe_desc: "Las Casas de las hadas nobles proyectan largas sombras sobre los Kithain comunes."
 bm_1230_fae_sub_kithain: "Nobles Kithain"
 bm_1230_fae_sub_kithain_desc: "Algunos Kith plebeyos se elevan a la nobleza y son hipotéticamente los 'iguales' de los nobles Sidhe."
 bm_1230_fae_sub_jinn: "Jinn"
 bm_1230_fae_sub_jinn_desc: "Las Hadas de Oriente Medio usan Jinn principalmente como un término para sí mismas, pero también se usa ampliamente para  cualquier ser sobrenatural."
 bm_1230_fae_sub_inanimae: "Inanimae"
 bm_1230_fae_sub_inanimae_desc: "Los Inanimae son primos de las Hadas Verdaderas. Aunque no son verdaderos espíritus elementales, tienen un parentesco  cercano con ellos.\n\nLos diversos filos de los Inanimae se unieron en el primero de los Imperios Lentos. Las relaciones entre estos reinos eran tediosas y  complejas, su política abarcaba décadas. Durante este tiempo, los Inanimae y los mortales interactuaban regularmente. Algunos los ignoraban, mientras que  otros disfrutaban de su adoración, permitiéndoles dar forma a sus Anclas y convertirse en los primeros krofted. Durante este tiempo, el Imperio de las  Llamas eligió ayudar a la humanidad regalándoles el conocimiento de hacer fuego. Esto fue visto como una gran traición por la mayoría de los otros  Inanimae, ya que permitió a la humanidad dar forma y esclavizar el mundo que la rodeaba, lo que resultó en la creación de los primeros Mannikin. Esto  condujo a la Guerra de la Creación, donde el Imperio de las Piedras busca subyugar o destruir el Imperio de las Llamas."
 bm_1230_fae_sub_african: "Kith Africanos"
 bm_1230_fae_sub_african_desc: "Los lugares de Glamour en la Tierra de los Sueños Antiguos son algunos de los más brillantes y poderosos del mundo entero,  apoyados por milenios de sueños empapados en el suelo, así como por las vibrantes esperanzas y miedos de aquellos que aún sueñan. Los mitos antiguos no  solo tienen influencia aquí, sino que ejercen su poder.\n\nNaturalmente, los #bold Eshu#! son numerosos, deambulando desde las costas orientales del Cuerno  de África hasta la cuna occidental de los Imperios, pero en la medida en que se puede decir que tienen un hogar, es el Reino de Ifẹ̀, donde yacen sus más  poderosos #bold Obas#!. Los hechiceros de tono azul claro #bold Djedi#! hacen su deslumbrante aparición a lo largo de los humedales nilóticos. Los  emprendedores #bold Kuino#! de cuatro ojos compiten por organizarse, estableciendo su presencia donde puedan cosechar las mayores recompensas. Los  resentidos y ritualistas #bold Obambo#! acechan entre pocos lugares de poder oculto, siempre buscando tesoros prohibidos.\n\nAunque muchos Kithain formaron  tribus en la Tierra de los Sueños Antiguos, por el contrario, otros kiths nativos aún no se han dado a conocer al mundo exterior."
 #bm_1230_fae_sub_african_desc: "Los lugares de Glamour en la Tierra de los Sueños Antiguos son algunos de los más brillantes y poderosos del mundo entero,  apoyados por los milenios de sueños empapados en el suelo, así como por las vibrantes esperanzas y miedos de aquellos que aún sueñan. Desde las tribus más  aisladas hasta los residentes de las ciudades más concurridas, los mortales celebran estas innumerables formas de vida incluso mientras se reinventan  constantemente a sí mismos y a sus tradiciones en el largo crepúsculo de la Evanescencia. En la medida en que se puede decir que los Eshu tienen un hogar,  es el Reino de Ife. Los Djedi fueron fundados por un atractivo hechicero del Antiguo Egipto. Los ambiciosos Kuino de cuatro ojos son originarios de Guinea."
 bookmark_fae_wayland: "Wayland"
 bookmark_fae_wayland_desc: "Gran Herrero de la Corte de Verano, Wayland es el poderoso e indiscutible líder de las hadas del Verano, y un renombrado  guerrero que ganó temor y respeto en la Guerra de las Estaciones. Hacia los mortales, Wayland rara vez actúa con buenas intenciones.\nSe deleita en  aparecerse a los humanos y ofrecerles ricas recompensas a cambio de juramentos. Así, mientras un caballero pueda tener un arma bellamente forjada en su  cadera, en el momento en que se rompe el juramento, la hoja también se rompe. Encuentra una gran satisfacción en cumplir juramentos difíciles y luego  castigar al humano que no cumple con su parte del acuerdo.\nAunque su corte es una mezcla ecléctica de hadas principalmente Militantes, el Gran Herrero  acepta a cualquier visitante en su dominio. Se rumorea que incluso él y Nicnivin, la Reina Filósofa, fueron amantes. Wayland fue uno de los pocos que firmó  la Tregua del Juramento, fue con un amargo temblor en sus dedos que la tinta se puso sobre el pergamino ese día.\nWayland persigue agresivamente los  intereses de la Corte de Verano en cada trato.\n#bold Ahora es el momento de la guerra. ¡El sol brilla para la gloria de la Corte de Verano!#!"
 
 bookmark_fae_nicnivin: "Nicnivin"
 bookmark_fae_nicnivin_desc: "Lord Krode, el líder de los Enanos Negros, ha muerto. Varios de sus lugartenientes compiten por su trono vacío, cada uno  asombrando a sus propias facciones de poder en toda Europa. La primera entre ellos es Lady Nicnivin. Es un pilar del Consejo de Patronos, pero su lealtad  es, en última instancia, totalmente a la Corte de Invierno. Abundan los rumores de que el reciente intento de asesinato contra la bella Reina Filósofa casi  tuvo éxito, y Lady Nicnivin está ahora recluida por su propia seguridad.\nConocida por muchos nombres (Madre Hueso, Gyre-Carling, Hécate de los Escoceses,  la Gran Bruja, Madre Bruja de los Campesinos), su influencia se extiende a lo largo del Camino Negro. Si es cierto el rumor de que una vez fue amante del  Gran Herrero Wayland, ahora parece no sentir más que animosidad hacia él. Entre su larga lista de enemigos se encuentra el misterioso Drail. ¿Considera  Nicnivin a Drail responsable de la Guerra de las Estaciones, la muerte de la Ciega Nyx o el asesinato de Lord Krode?\n#bold Consolida tu poder en la Corte  de Invierno y venga la muerte de Krode sin reiniciar la Guerra de las Estaciones.#!"
 
 bookmark_fae_ana: "Ana"
 bookmark_fae_ana_desc: "La Reina Ana, uno de los miembros más renombrados del Consejo del Crepúsculo, comparte los sentimientos de sus compañeros  concejales con respecto a la Guerra de las Estaciones, y la actitud es popular entre los miembros de las Reuniones Keshalyi. Revela suficiente poder a los  humanos para que respeten y valoren a las hadas, luego explota su confianza como un arma en la guerra venidera. Una de las firmantes de la Tregua del  Juramento, comprensiblemente se muestra reacia a que el tratado caiga.\nIrónicamente, el mayor obstáculo de Ana para mantener a la Corte de Otoño fuera de  la Guerra de las Estaciones es su propio y odioso exmarido Locolici y su abominable y monstruosa descendencia con Locolici. El Señor de la Violación ansía  más destrucción, sufrimiento y despojo. Sus propios hijos se alinean contra ella, y su propia y monstruosa descendencia pronto los seguirá. Ana tendrá que  tomar decisiones terribles para lograr un equilibrio entre cumplir la Tregua del Juramento y tomar su merecida venganza contra su vil exmarido.\n#bold  ¿Sucumbirá Ana a las maquinaciones de su exmarido y sus viles hijos, o podrá liderar a los nobles Keshalyi hacia un amanecer más brillante?#!"
 
 bookmark_fae_drail: "Drail"
 bookmark_fae_drail_desc: "Uno de los Hadas más infames, su origen está envuelto en misterio. Drail era el hijo de las hadas primogénitas del Verano que se  rebelaron contra la estructura opresiva de su corte. Se volvió ambicioso de poder e irrespetuoso con aquellos que se lo negaban. Marcado como Solsticio y  exiliado, desarrolló relaciones con otros parientes del Solsticio. Concibió un plan para una Corte Unida del Solsticio que gobernaría sobre las Estaciones.  Drail obtuvo el apoyo de hadas asesinas y mercenarias, extrajo juramentos de los escalones más bajos de las sociedades, como mendigos, ladrones, mensajeros  y cortesanas. Supuestamente, sus intrigas y acciones encubiertas llevaron a la Guerra de las Estaciones. Uno de sus saboteadores fue capturado y torturado  por la Corte de Verano, lo que reveló a Drail como el cerebro del conflicto. Cazado por todas las cortes, desapareció. Circulan rumores de que tal o cual  levantamiento del solsticio tiene a Drail como su amo oculto. Mientras muchos buscan la cabeza de Drail, Nicnivin del Camino Negro parece particularmente  interesada en su muerte.\n\n#bold Maquina, conspira y lleva la guerra a las Cortes para promover tu ambición.#!"
 
 bookmark_fae_taulandryn: "Taulandryn"
 bookmark_fae_taulandryn_desc: "Cada puente del mundo crea un portal al retorcido [Glossary('Nightmare Realm','game_concept_nightmare_realm_desc')] de Bajo  el Puente, una tierra sin estrellas de noche eterna iluminada solo por antorchas parpadeantes y misteriosos fuegos fatuos. Los miembros más horripilantes  de la Corte de Invierno llaman hogar a Bajo el Puente. La expansión de la civilización humana ha causado un rápido crecimiento en este reino de pesadillas,  a medida que nuevas rutas comerciales y ciudades generan más y más puentes. Durante la Guerra de las Estaciones, los ejércitos de Invierno se movieron  rápidamente a través de Bajo el Puente para atacar puntos en toda Europa.\nLos rumores afirman que, más allá de un Sidhe, Taulandryn es un inanimae nacido  de la propia oscuridad o alguna monstruosa criatura del abismo, como un T'arrkel u otra aberración bestial de Bajo el Puente. Este primogénito pariente del  Invierno vive en el corazón de Bajo el Puente, en lo profundo del vacío.\n\n#bold Ataca desde el reino de Bajo el Puente y expandete a lo largo de los ríos  hasta que hayas forjado un imperio, luego atrae a través de un Gran Camino el Reino de Pesadillas para que los mortales nunca olviden a las Hadas. Que  odien, siempre que teman.#!"
 
 bookmark_fae_tandoor: "Tandoor"
 bookmark_fae_tandoor_desc: "Un cambiaformas que rápidamente ascendió a la prominencia después de la Batalla del Hielo, el pequeño gusto por el estatus  alimentó su ambición. Durante la batalla, Davidian, que ocupaba la Fortaleza de Cristal, había desobedecido órdenes y se negó a luchar contra las hadas de  Primavera debido a su amante de primavera, Kapherah. Tandoor reunió silenciosamente a un gran grupo de cambiaformas de la Corte de Verano y llevó a cabo un  golpe que logró deponer a Davidian y tomar el control de la Fortaleza. Después de su golpe, Tandoor aprovechó su victoria para exigir el reconocimiento de  la Corte de Verano de la contribución de los cambiaformas a la batalla. A Tandoor se le entregó la primera Medalla del Sol, marcándolo como un héroe de la  Corte de Verano. Volviéndose cada vez más militante durante los Tiempos Oscuros, está ansioso por que termine la Tregua del Juramento. Todavía posee la  preciada Fortaleza de Cristal como su dominio.\n\n#bold ¡Estas hadas primogénitas aprenderán a respetarte o si no!#!"
 
 bookmark_fae_garain: "Garain"
 bookmark_fae_garain_desc: "El Portador de Lágrimas trajo cambio a las Hadas al firmar la Tregua del Juramento para poner fin, aunque temporalmente, a la  Guerra de las Estaciones. El tiempo avanza y la Corte de Primavera vuelve a clamar por cambios. La Dama Blanca desea mantener la Tregua del Juramento pero  cambiar a las Hadas mejorando las relaciones con la humanidad. Otras hadas están acudiendo en masa al Capitán Siegfried Hein de la Hoja Verde, que moviliza  su legión perdida para renovar la guerra esta vez con una victoria de la Primavera.\n\n#bold El Status Quo está fallando. El cambio debe llegar. ¿Pero qué  cambio? Tus decisiones podrían determinar el destino de las Hadas. Sea lo que sea que elijas, seguramente habrá mucho llanto.#!"
 
 bookmark_fae_siegfreid_hein: "Siegfried Hein"
 bookmark_fae_siegfreid_hein_desc: "El Capitán de la Hoja Verde es el polo opuesto de su señor, la Dama Blanca Portadora de la Tregua. Está centrando su  atención (mayoritariamente militar) en la sociedad de las hadas. Su Legión Perdida se prepara para una serie de ataques en cuanto la Tregua del Juramento  finalmente caiga. En años pasados, Hein luchó al lado de Kapherah, el último verdadero General de la Hoja Verde, y Hein sigue desesperado por restaurar la  compañía a su antigua fuerza. Por ahora, ha reunido a sus tropas al este de la Selva Negra y cree que puede construir su ejército con la ayuda de su  derecho ancestral sobre el legendario tesoro del Rin del Nibelungo, y restaurar su derecho de nacimiento con la conquista de toda Renania. Su astuto primo  otoñal, Gunther, puede resultar un obstáculo que necesita ser eliminado.\n\n#bold Es el momento del cambio, ¡es el momento de la guerra!#!"
 
 bookmark_fae_halostian: "Halostian"
 bookmark_fae_halostian_desc: "\n\n#bold La política es la guerra por otros medios#!"
 
 bookmark_fae_jalendrel: "Jalendrel"
 bookmark_fae_jalendrel_desc: "Un gran guerrero y profeta, Jalendrel está preocupado por sus terribles visiones del futuro. Llora por esas terribles cosas  que puede prever, pero no puede cambiar. Una vez predijo que un monstruo terrible destruiría una aldea de su parentela. Salió a matar a la bestia, y no  solo fracasó, sino que perdió su mano a causa de una oscuridad marchitante. Más tarde, siguió su visión para matar al monstruo y salvar a Lord Gwydion,  pero el precio de esa victoria fue ver destruida la aldea de su parentela. Para cambiar las cosas que pudo, Jalendrel fundó una casa noble entre los  profetas de los Sidhe en Occitania, en la pequeña ciudad de Marvejols.\n\n#bold El Código de Jalendrel exige a sus miembros: honrar el futuro y recordar  sus secretos, no cargar a otros con el futuro para no romperlos, y aceptar tu destino mientras dejas a otros el suyo.#!"
 
 bookmark_fae_gwydion: "Gwydion"
 bookmark_fae_gwydion_desc: "Gwydion es un guerrero magistral y también un hechicero consumado. Cuando Gwydion era joven, necio y lleno de orgullo, él y una  banda robaron la casa de su tío Math Mathonwy, Caer Dathal. Mathonwy desafió a Gwydion a luchar contra la hija de Mathonwy, Keredwyn. Ella lo derrotó, ya  que luchaba por su padre y Gwydion solo por sí mismo. Mathonwy transformó a Gwydion en un ciervo, un jabalí y un lobo sucesivamente, cada uno cazado por  cazadores. Sobrevivió a la prueba como un hada transformada: Gwydion se convirtió en un defensor justo y poderoso del pueblo de Cymru contra los señores  malvados y los ogros brutales. Eligió construir una casa de guerreros afines. Lanzó un desafío abierto a otros para que intentaran vencerlo en combate, y a  través de tales desafíos reclutó a 300 guerreros leales entre los que derrotó. Finalmente, la hija de Math, Keredwyn, también vino a desafiarlo. Por poco,  esta vez, la derrotó. Se enamoraron y han estado juntos desde entonces.\n\n#bold Aquellos de la Casa Gwydion tienen un poder místico para detectar  mentiras, pero también son propensos a furias berserker.#!"
 
 bookmark_fae_donovan: "Donovan"
 bookmark_fae_donovan_desc: "Un ingeniero de oficio, arquetípico de su casa, es conocido por sus largos silencios. Tiene la tendencia a hacer pocas  preguntas y luego dejar que aquellos que divagan lo hagan, lo que a menudo exaspera a sus cortesanos. Junto con Aife y Morann, fue uno de los primeros  señores de la Casa Dougal que juraron el Juramento de Dougal: 'Mi corazón es el corazón de Dougal. Mi brazo empuñará su martillo. Mi cuerpo llevará su  carga. Mi corazón asumirá su voluntad. Trabajaré hasta el final de mis días haciendo su trabajo'. La pasión de Donovan reside en la construcción de enormes  máquinas. Aunque es conocido por sus máquinas de asedio, también disfruta construyendo equipos de construcción maravillosamente arcanos. Utiliza su  impresionante habilidad para forjar armas y armaduras mágicas para apoyar la causa de la Corte de Verano en la Guerra de las Estaciones. En secreto,  Donovan está preocupado por sueños de magos humanos violando la soberanía de [UmbraGlossary('arcadia')].\n\n#bold Como ha dicho Donovan, 'Para luchar  contra algo, debes entender algo'.#!"
 
 bookmark_fae_fiona: "Fiona"
 bookmark_fae_fiona_desc: "Los sabios dicen que encarna la pasión de ambos jóvenes amantes; la furia de batalla invencible de la victoria del niño y una  tristeza seductora por la doncellez rota de la niña. Estos atributos se han convertido en el sello distintivo de su propio pueblo; una casa que también  prospera en la lujuria, la voluntad y el deleite. Fiona también construyó amistades con los muertos vivientes, hablando con espíritus inquietos y bailando  alrededor de las hogueras del solsticio de los magos paganos. Especialmente amados por ella son los Pródigos llamados Garou y de todos estos, los más  queridos para su corazón son los Fianna; sus fuegos internos y su amor por los juramentos y las canciones igualan fácilmente a los suyos. Más de una pizca  de sus pasiones se mezcla con esos Fianna e incluso con otros que se llaman a sí mismos Hijos de Gaia.\n\n#bold Muchos se han enamorado de Lady Fiona, y  aunque fue amorosa con todos, nunca ha compartido su corazón por completo. Cuando finalmente se enamoró de un mortal, traicionó la confianza de los Garou  para compartir con los humanos el secreto de la plata. Por su crimen, fue exiliada de [UmbraGlossary('arcadia')]. Su amante humano está escondido en un  sueño encantado, y Fiona no puede soportar mirarlo.#!"
 
 bookmark_fae_eiluned: "Eiluned"
 bookmark_fae_eiluned_desc: "Hija taciturna de Alynyad, fue la primera de las hadas en prever la llegada de la Ruptura: un futuro en el que los mortales han  descartado los sueños y viven en la desesperación; un mundo sin lugar para las Hadas, ni para nadie que se atreva a soñar. Aunque su habilidad con la  profecía y la magia de adivinación es inigualable, pocos han escuchado sus advertencias. Incluso su querido hermano Ailil ha descartado su visión, y sus  disputas se volvieron tan grandes que Eiluned se retiró de la corte de Ailil. Con sus compañeros, hadas y otros, fundó un reino propio a varias leguas de  distancia, y aunque no siempre han creído en lo que esta extraña dama ha dicho, no pasó mucho tiempo antes de que los otros reyes y reinas llegaran a  reconocerla como una de los suyos.\n\n#bold Otros deben prestar atención a tus advertencias, ¡la ruptura debe ser prevenida! Ignoran tus advertencias bajo  su propio riesgo.#!"
 
 bookmark_fae_ailil: "Ailil"
 bookmark_fae_ailil_desc: "Oscuro y taciturno, poderosamente atractivo, con una inteligencia aguda, Ailil tiene una feroz pasión tanto por el amor como por  la guerra. Su gran defecto es la incapacidad de mantenerse alejado del mundo de los mortales. Algunos creen que Ailil buscó la gloria y el poder mortal  para distraerse de las ominosas advertencias de su amada hermana, Eiluned. Una y otra vez se ha puesto carne mortal y ha entrado en la corriente de la  historia humana, tomando amantes y liderando ejércitos con su irresistible encanto y astucia.\n\n#bold Aunque su propio temperamento favorecía la Corte  Seelie, Ailil ha reunido a su alrededor a un gran número de hadas Unseelie que le han jurado lealtad como Rey de Invierno y han tratado de mantener vivo el  equilibrio de las estaciones.#!"
 
 bookmark_fae_liam: "Liam"
 bookmark_fae_liam_desc: "Liam se ha obsesionado con la Iglesia Cristiana: la belleza de su arte, arquitectura y particularmente su música. Tan cautivado,  ha arriesgado una posible persecución como 'demonio' solo para escuchar unas pocas notas de sus coros. Quedó extasiado con el canto de la Hermana Melisande  en una abadía local. El Duque Haleson ap Gwydion se enteró de la fascinación de Liam y temió que tal obsesión atrajera la ira de la Iglesia sobre las  Hadas. Haleson y su facción conspiraron, disfrazados de clérigos, para secuestrar a Melisande de su convento. Cuando Liam regresó al convento y encontró a  Melisande desaparecida, cayó en una furia psicótica volviendo locas a muchas del convento con su glamour. Después de extraer por la fuerza los recuerdos de  la Madre Superiora, pronto se abalanzó sobre el Duque Haleson. Liam, en su ciega furia, fue fácilmente derrotado por Haleson. El Duque entonces hizo que  Liam fuera juzgado por las Hadas Arcaicas.\n\n#bold Por violar el Derecho de Demesne y por atraer la ira del Vaticano, Liam y toda su casa han sido  exiliados para siempre de [UmbraGlossary('arcadia')]#!"
 
 bookmark_fae_daireann: "Daireann"
 bookmark_fae_daireann_desc: "Una de las dos hermosas hijas de Bobh Dearg, Daireann es una renombrada herborista. Se dice que envenenó al héroe hombre lobo  Fionn MacCumhail en venganza porque el lupino eligió favorecer a la hermana de Daireann, Sadbh. Daireann obtuvo un título nobiliario y fundó una casa al  curar el pie gotoso de Adwyr ap Gwydion. La propia Daireann no es una gran guerrera y sabía que sería difícil demostrar el valor de la casa de la manera  más visible: en el campo de batalla. Algunos dicen que es hábil con el arco y la honda, pero eso es exagerar un poco.\n\n#bold El verdadero crecimiento de  la casa, con la bendición de la fundadora, llegó con el nacimiento de su hijo, Conchobhair. Aquellos que habían sido la Casa Daireann solo de nombre ahora  tienen un propósito y una causa: la emoción de la guerra. No ha habido un rey o reina Gwydion que tuviera seguidores más devotos que el más grande ard-righ  de Daireann. La casa nunca ha rechazado ningún desafío que Conchobhair haya dado y se ha unido a cualquier tarea que les haya pedido.#!"
 
 bookmark_fae_leanhaun: "Leanhaun"
 bookmark_fae_leanhaun_desc: "Se la llama 'Canción de la Alondra', por su voz pura y clara, su cabello como luz solar plateada y su rostro tan bello como el  amanecer mismo. Traicionó a su amante Finellia al recitar hasta la muerte al amante mortal de Finellia, Edann, el bardo del rey. Imprudente y despreocupada  de todo excepto de sus propios deseos, Leanhaun recibió una maldición de muerte por el suicidio ritual de Finellia. La inmortalidad de Leanhaun se  desvanece a menos que recite regularmente a un soñador. Toda su casa comparte su maldición. La casa ha ocultado esta verdad y, en cambio, afirma que  Finella mató a Edann en un ataque de celos. Su casa también comparte su sobrenatural belleza y carisma.\n\n #bold Leanhaun y su casa siguen un credo simple  para aquellos a los que acechan: Elige Solo a Aquellos Que Quieren Tu Atención, Da Tu Amor e Inspiración Incondicionalmente y Nunca Te Arrepientas.#!"
 
 bookmark_fae_varich: "Varich"
 bookmark_fae_varich_desc: "Es el brillante y apuesto hijo de los dioses eslavos Miesiac la Luna y Dazbóg el Sol. Ordenaron a los espíritus que encontraran  a su amor perfecto. Dazbóg se dirigió a los sluagh y les impuso un geas, ordenándoles que debían buscar hasta que la más perfecta de todas las doncellas  pudiera ser traída a su hijo. Charodei, la hechicera sluagh, fabricó una Doncella de Nieve con hielo para seducir a Varich. Varich la amó instantáneamente  al verla, pero en su abrazo ella se derritió. Tan angustiado por la pérdida, ahora es incapaz de dar su amor a otra persona. Varich ha gobernado su casa  durante muchos siglos con mano firme y temperamento justo, aunque nunca ha perdido la oscuridad y el dolor que sintió. Sabe bien quién lo traicionó y no  deja que su odio se enfríe con los siglos: ningún sluagh puede entrar en los feudos de Varich sin prestar los juramentos más poderosos.\n\n#bold Su mayor  deseo es comprender y conquistar el patrón del Invierno Eterno para poder ahuyentar a los Fomorianos cuando lleguen. Aun así, teme lo que ve en el patrón  del futuro.#!"
 
 bookmark_fae_dice: "Dice"
 bookmark_fae_dice_desc: "Un vagabundo legendario, notoriamente difícil de localizar incluso entre los Elegbara, y tiene la costumbre de desaparecer durante  una docena de años más o menos y luego reaparecer con una nueva cara sobre su vieja alma. Algunos de los Eshu más jóvenes piensan que esto es el resultado  de morir y renacer constantemente en rápida sucesión y lo convierten en una figura cómica de la desgracia. De hecho, es uno de los Síocháin; uno de esos  raros cambiaformas que han equilibrado perfectamente las dos mitades de su naturaleza y, por lo tanto, se han vuelto efectivamente inmortales. Su asombrosa  longevidad le ha permitido dominar cientos de idiomas, dominar más de una docena de Artes, caminar por cada sendero y camino en la Tierra y en el  [UmbraGlossary('dreaming')].\nSolo entre las Casas nobles, Danaan tiene un no sidhe como Alto Señor, el eshu Dice, y quizás no sea sorprendente que no  tengan problemas para aceptar a otros plebeyos, aunque los sidhe arcaicos todavía ocupan muchas posiciones prominentes. Cualquier cambiaformas con pasión  por la exploración e interés en el Soñar es bienvenido en la Casa.\n\n#bold ¡Explora!#!"
 
 bookmark_fae_lugh: "Lugh"
 bookmark_fae_lugh_desc: ""
 
 bookmark_fae_cathal: "Cathal"
 bookmark_fae_cathal_desc: "La Casa Balor comenzó con Cathal, el hijo de Lugh del Brazo Largo, nieto de Balor del Mal de Ojo. Ha hecho ciertas promesas al  [UmbraGlossary('dreaming')] a cambio de poder y la protección de su línea. Una de esas promesas fue que la casa y todos sus miembros permanecerían  firmemente Unseelie. Así, su papel en el espectáculo siempre se cumpliría. Para la casa, el papel es el del héroe consumado: guerreros valientes por los  derechos individuales y la reparación de los agravios contra su pueblo, mientras que para los Seelie, son los villanos de la historia. Cathal ha buscado y  encontrado muchos tesoros poderosos que guardó en depósito hasta el día en que los Balor sean lo suficientemente fuertes para derrocar a las otras nobles  casas Sidhe. Los sidhe nacidos de fomorianos tienen poderes asociados con su 'deformidad', como cierta tolerancia al hierro frío.\n\n#bold La mayoría de  los Seelie creen que los miembros de la Casa Balor son como niños malos, que como están insatisfechos con su lugar en la sociedad de las hadas, dicen y  hacen cosas simplemente para sorprender a sus primos Seelie. Pocos entienden el verdadero peligro que representa la Casa Balor.#!"
 
 bookmark_fae_ragnelf: "Ragnelf"
 bookmark_fae_ragnelf_desc: "Dos cortes de nobles Sidhe surgieron de los sueños de los nórdicos: los místicos Vanes y los marciales Aesir. Después de una  sangrienta guerra, se fusionaron para formar los Aesin. Los Aesin han dado parte de su poder mágico a adoradores mortales y los han animado a hacer  incursiones vikingas contra la Iglesia Cristiana. Los Aesin han estado perdiendo su guerra en la sombra contra la Iglesia, a medida que los reinos nórdicos  se cristianizan. Algunas voces piden una retirada de Midgard a Asgard (Arcadia).\nRagnelf es una mujer tranquila y gentil que ha visto su parte de  tragedias. Después de que su hermana Ingirun muriera, el trono de Aesin pasó a ella. Desde entonces, ha creado una casa fuerte a partir de las cenizas de  una familia devastada por la guerra. Su amabilidad es ampliamente conocida entre los miembros de la Casa Aesin, y aunque domina la mayoría de las Artes, se  dio cuenta hace mucho tiempo de que su mente es su arma más poderosa.\n\n#bold Mantén las viejas costumbres y trata de mantener a los Kithain centrados en  la amenaza real de la banalidad de la Iglesia Cristiana, y no en las disputas entre ellos.#!"
 
 bookmark_fae_scathach: "Scathach"
 bookmark_fae_scathach_desc: ""
 
 bookmark_fae_uathach: "Uathach"
 bookmark_fae_uathach_desc: "El nombre de Uathach (literalmente 'la terrible') provino de una profecía del antiguo mago Tuathan Mathgen, que sirvió como  mentor y visir de Scathach. Uathach exhibió habilidades hechiceras que superaban a las de los magos más antiguos del clan.\nCuando Mathgen finalmente  sucumbió al llamado de los otros Tuatha de Danaan partidos y se fue al [UmbraGlossary('deep_dreaming')], Uathach ocupó su lugar como Malik y jefe de los  Oráculos Morfeos. Creció en ese papel y, si a veces perseguía estudios malsanos sobre la naturaleza de los más antiguos de los Ancianos Oscuros, también  sirvió a la casa con lealtad y eficacia durante siglos como mano derecha de su madre.\nScathach decidió que ella y el resto de su casa se someterían al  Camino Cambiante. Uathach se negó. Se dice que madre e hija hablaron con dureza y que incluso llegaron a la violencia por el asunto. Unos pocos años antes  de la Guerra de los Árboles, Uathach y varios seguidores afines partieron hacia el [UmbraGlossary('sea_of_silver')] en busca de su destino. Lo que ha  encontrado allí se lo ha revelado a pocos, si es que a alguno. Desde su regreso, Uathach ahora lidera la casa."
 
 bookmark_fae_morann: "Morann"
 bookmark_fae_morann_desc: "Los Nockers son los artesanos de los Kithain, capaces de convertir la materia de los sueños en lo que deseen. Sus creaciones  siempre tienen defectos, sin embargo, y su conocimiento de esta maldición los hace irritables y propensos a enfadarse rápidamente.\nLord Morann el Nocker  es un maestro de la forja. Cuando Dougal llegó con Hierro Frío para forjar la legendaria hoja Anweyth, Morann fue una de las tres hadas que se quedaron con  él. Cuando Dougal murió haciendo su obra inigualable, Morann fue nombrado uno de los primeros tres Señores de la Casa Dougal. Algunos Sidhe de la Casa  Dougal resienten la prominencia de este Señor 'Plebeyo'.\nMorann es trabajador y tenaz hasta casi el defecto. Puede ser un maestro de tareas difícil tanto  para los trabajadores de su forja como para sus vasallos. No comparte el entusiasmo por renovar la Guerra de las Estaciones, considerando el conflicto una  distracción de empresas más productivas y rentables.\n\n#bold ¡Pongámonos a trabajar!#!"
 
 bookmark_fae_ottmar: "Ottmar"
 bookmark_fae_ottmar_desc: "El fuerte roble, el rompedor de juramentos y, en última instancia, el corazón del océano. Un trol legendario, Ottmar fue el  compañero de juramento de la bella Sidhe Breanna ab Corwyn Fiona. Juntos, con la espada del Trol y la magia de la Sidhe, derrotaron a la vil Bestia de  Exmoor. Ottmar se sintió loca y apasionadamente cautivado por Breanna, pero nunca le reveló su infatuación. Otro Sidhe, Sean el Plateado de la Casa  Gwydion, conquistó con éxito a Breanna, para gran pesar del Trol. Enfurecido, Ottmar rompió su juramento de proteger a Breanna y la abandonó a ella y a su  amante para que fueran capturados por una banda de Unseelie. Los Tuatha de Danaan maldijeron a Ottmar y a todos los tros de que el quebrantamiento de sus  juramentos les restaría su poder de Titán y también los llenaría de ira. Ottmar se sintió muy avergonzado por esta maldición sobre todo su Kith y restauró  su juramento rescatando a Breanna y Sean. Ottmar los protege hasta el día de hoy.\n\n#bold Mantén siempre tus juramentos, ¡son tu fuerza!#!"
 
 bookmark_fae_charodei: "Charodei"
 bookmark_fae_charodei_desc: "La hechicera sluagh creía que podía fabricar una compañera perfecta para Lord Varich, mucho mejor que cualquier otra que  pudieran encontrar en realidad. La fabricó con nieve, hielo y glamour. Varich se sintió rápidamente infatuado con la Doncella de Nieve, pero al copular, la  quimera se derritió, dejando a Varich angustiado, y sus padres Miesiac la Luna y Dazbóg el Sol se enfurecieron. Los Dioses buscaron castigar a Charodei,  pero ella sabía cómo deslizarse en los lugares más ocultos y viscosos. Finalmente, lanzaron una triple maldición sobre ella y toda su especie: nunca podría  hacer ni tener perfección; nunca vería la luz del sol o la luna sin miedo; y todos los demás la conocerían como la criatura traicionera que es.\n\n#bold  Permanece oculta y evita la ira de la Casa Varich.#!"
 
 bookmark_fae_malgirich: "Malgirich"
 bookmark_fae_malgirich_desc: "La Tregua del Juramento aburre al Come Manos. Es un guerrero competente, aunque sádico, que, como es de esperar por su apodo,  es aficionado a comerse las manos de la espada de los enemigos. Para un Unseelie, es directo e incluso grosero, un hecho que hace que su discurso sea  propenso a ofender incluso mientras atrae el interés. Durante el siglo pasado, ha perfeccionado sus habilidades para contar historias para ocupar su corte  y recibir visitantes. Sin embargo, es un pobre sustituto de la guerra, y está ansioso por volver a los viejos tiempos de sangre y escarcha asesina. \n\n#bold La paz es aburrida y nunca hay suficientes manos para comer. ¡A la guerra!#!"
 
 bookmark_fae_lailoken: "Lailoken"
 bookmark_fae_lailoken_desc: "Uno de los escurridizos Ghille Dhu, Lailoken está obsesionado con los presagios y profecías de la llegada de la fatalidad de  la banalidad que se acerca a las Hadas. Está desesperado por proteger su naturaleza mágica y la santidad de su hogar, el Robledal, un Claro en los  Trossachs de Caledonia.\n\n#bold La Fragmentación debe ser prevenida a toda costa, incluso si significa la guerra contra las otras cortes.#!"
 
 bookmark_fae_salih: "Salih"
 bookmark_fae_salih_desc: "Ha pasado con el Bazar desde que la memoria alcanza, y algunos especulan que fue él quien forjó los juramentos que gobiernan la  ciudad de tiendas. Salih vende información. Se supone que los Inanimae de Arena conocen los secretos de la vida, la muerte, la magia, los orígenes de las  hadas, las alianzas y las conspiraciones. Su conocimiento tiene un alto precio. Algunos que han tratado con Salih han muerto en la búsqueda de algún  conocimiento que él pidió a cambio. Los riesgos de tratar con Salih son grandes, y muy pocos salen del encuentro con más de lo que trajeron, pero siempre  hay quienes están lo suficientemente desesperados por respuestas.\n\n #bold Tu conocimiento ha tenido un gran precio, asegúrate de venderlo siempre por más. #!"
 
 bookmark_fae_callicantzaroi: "Callicantzaroi"
 bookmark_fae_callicantzaroi_desc: "Callicantzaroi es un renombrado general que comandó varios miles de soldados en la Batalla de Piedra; cuando sonó la  retirada, organizó una hábil retirada de combate que salvó la vida de muchos de sus soldados. La corte del Señor Ciego en el sur de Italia es famosa por  ser un hervidero de críticas políticas y violencia. Parece que los embajadores de todas las Cortes son bienvenidos aquí, y el Señor Ciego escucha  pacientemente cada petición, oferta de alianza y solicitud general. En verdad, Callicantzaroi detesta a las otras Cortes y está reuniendo los restos de una  de las famosas Legiones Perdidas, albergándolas como una ventaja táctica para desplegar cuando la Tregua del Juramento falle. El príncipe ciego, con todo  su barniz urbano y su paciente encanto, no es un gobernante benévolo. La mayoría de las hadas de Invierno de la corte son muy conscientes de que tiene  intenciones asesinas para los muchos visitantes de su dominio.\n\n#bold Haz de diplomático por ahora, pero pronto tus maquinaciones darán fruto y la sangre  fluirá.#!"
 
 bookmark_fae_grale: "Grale"
 bookmark_fae_grale_desc: "El Cidrerie de Bacchus es un señor Sátiro de una corte grande y jovial. La juerga allí es proporcionada por grandes cantidades de  manzanas 'rechinantes'. Grale es un anciano amable que da la bienvenida a todos en su comunidad. Un firme humanista, el Sátiro defiende con vacilación un  regreso a la Guerra de las Estaciones simplemente porque cree optimistamente que las otras Cortes verán la razón cuando la evidencia de sus buenas  relaciones con los humanos sea evidente para todos, pero quizás solo sea el hidromiel el que habla. Su corte es bastante renombrada debido a sus numerosos  embajadores y diplomáticos que viajan a otras cortes para alabar sus virtudes (y probar sus intoxicantes).\n\n#bold Gana más aliados para la guerra  venidera organizando fiestas fabulosas. Un evento suficientemente grandioso puede incluso evitar la banalidad durante muchas estaciones.#!"
 
 bookmark_fae_scherezade: "Scherezade"
 bookmark_fae_scherezade_desc: "La Dama de las Leyendas, la Maestra de los Velos, es un paradigma entre los Eshu. Es una de las primeras y más grandes de  los Kith en alcanzar el estatus de Orisha. Cuenta la historia que el monarca Shahriar, al descubrir que su primera esposa le había sido infiel, decidió  casarse con una nueva virgen cada día y decapitarla a la mañana siguiente antes de que pudiera deshonrarlo. Finalmente, el visir no pudo encontrar más  vírgenes de sangre noble y, en contra de los deseos de su padre, Sherezade se ofreció como voluntaria para casarse con el rey. Cada noche, le contaba una  historia al rey pero se detenía en medio. Así, cada noche, el rey le perdonaba la vida para escuchar el final de la historia la noche siguiente. Después de  1001 noches, Sherezade finalmente le dijo al rey que no tenía más cuentos que contarle y pidió poder despedirse de los tres hijos que le había dado durante  esos años. Sin embargo, durante las 1001 noches anteriores, el rey se había enamorado de Sherezade. Le perdonó la vida y la hizo su reina.\n\n#bold ¡Que  puedas vivir para contar mil historias!#!"
 
 bookmark_fae_rubezahl: "Rübezahl"
 bookmark_fae_rubezahl_desc: "El Señor de las Montañas. Un noble Trol considerado un gobernante humilde y digno. Sigue hábilmente las reglas de etiqueta y  cortesía, pareciendo muy competente, aunque algo inaccesible. Sin embargo, el 'Guardián del Tesoro' tiene un lado Unseelie que parece obtener cierta  fantasía al derrumbar pasajes de cuevas sobre mineros o ataques de animales a viajeros en lo profundo de las Montañas de los Gigantes.\n\n#bold El Señor de  las Montañas de los Gigantes debería ser visto como el Rey de los Trols.#!"
 
 bookmark_fae_verdoren: "Verdoren"
 bookmark_fae_verdoren_desc: "Su corte fue una vez una de las más importantes de todos los reinos, y protegía los asentamientos humanos cerca de la frontera  de sus bosques. Muchos humanos lo adoraban como una deidad de la naturaleza. Firme defensor de la Corte de Primavera, probado en combate contra bestias  fantásticas y en escaramuzas con las otras Cortes, se cansó de la muerte. Se retiró a la sombra y protección de su bosque y ha esperado la resolución  definitiva de la Guerra de las Estaciones.\n\n#bold Resiste la tormenta para que la Primavera pueda volver.#!"
 
