 bookmark_patronwar_xenoamess: "Xeno Amess"
 bookmark_patronwar_xenoamess_desc: "No sabes quién es tu padre ni por qué naciste en esta forma. Pero decidiste vivir un poco más feliz como los otros  bastardos que te rodean.\n\n#bold Ten cuidado en este mundo, porque puede que nadie te ame.#!"
 bookmark_patronwar_ilya: "Ilya"
 bookmark_patronwar_ilya_desc: "Vivo, muerto, sobrenatural. Inocente. A diferencia de muchos tiranos ególatras, Ilya es consciente de que un gobierno  verdaderamente absoluto consolidado alrededor de una sola figura se mantiene unido por el apoyo y la adoración de una legión de aduladores talentosos con  deseos y ambiciones tan mutables como los suyos propios. El afecto de ese tipo solo puede formarse con un toque personal, una conexión personal, el saber  que Ilya participó en tu vida y te dio la fuerza que te faltaba para salvarte, mejorar y volverte mejor. Ella realmente se preocupa. Y por eso, harías  cualquier cosa por ella.\n\n#bold La apatía es la muerte de los débiles, como le gusta decir.#!"
