 bookmark_fae_al_ahmar_desc: "El Rojo"
 
 bookmark_fae_maimn: "Maimn"
 bookmark_fae_maimn_desc: "El Próspero"
 
 bookmark_fae_barqan: "Barqan"
 bookmark_fae_barqan_desc: "Dos Truenos"
 
 bookmark_fae_mudhib: "Mudhib"
 bookmark_fae_mudhib_desc: "El Dorado"
 
 bookmark_fae_jurata: "Jurata"
 bookmark_fae_jurata_desc: "Una Ondina adorada como diosa pagana por varias aldeas costeras a lo largo del Mar Báltico, la creciente fe en el Dios Único la  preocupa. Los mortales hacen flotar ofrendas a través de las aguas, y a cambio, el mar arrastra ámbar precioso a las costas. Algunos afirman que el ámbar  son fragmentos de su palacio, mientras que otros dicen que proviene de sus lágrimas. Se dice que una vez se enamoró de un pescador mortal a quien el dios  del trueno, Perkūnas, luego mató. Su corte en el Palacio de Ámbar tiene ventanas que conducen a cada costa del Mar Báltico. Los mercaderes cambiaformas  parientes del Otoño encuentran el palacio especialmente útil, al igual que muchos eruditos humanistas que residen dentro. El palacio tiene muchos  visitantes hada que buscan usarlo como un medio de viaje rápido, aunque Jurata exige que todos los que visitan participen en su hospitalidad durante una  noche antes de partir. Se asegura de recibir a sus visitantes al anochecer cuando entran, y vigila de cerca los movimientos a través de su reino. Recuerda  cada rostro que pasa por su palacio, y bastantes encuentran esa información sumamente valiosa."
 
 bookmark_fae_brenk: "Brenk"
 bookmark_fae_brenk_desc: "Señor de la Piedra"
 
 bookmark_fae_driyanna: "Driyanna"
