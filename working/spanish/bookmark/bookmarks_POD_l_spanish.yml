 bookmark_patronwar_alexarchus: "Alexarchus"
 bookmark_patronwar_alexarchus_desc: "Alexarchus era un místico conocido que viajó por el mundo cuando era mucho más joven y mucho menos sangriento que  ahora. Viendo cómo el mundo antiguo caía lentamente en peligro y en mezquinas luchas de poder, se centró en sus obras como místico para ofrecer a la  población, a menudo fugitiva, de un pueblo algún consuelo en su miseria. Cuando llegó su abrazo, no perdió su naturaleza bondadosa de inmediato, pero se  volvió inmensamente recluso. En estos tiempos, pasa la mayoría de sus noches en sus aposentos, tratando de lograr lo que a menudo es inalcanzable."
 bookmark_patronwar_amducious: "Amducious"
 bookmark_patronwar_amducious_desc: "Nacido en Francia en el año 787, Amducious era un noble francés en la corte de Carlomagno en el apogeo de su reinado.  Fue uno de los consejeros más cercanos de Carlomagno y un hombre extremadamente inteligente. Era conocido por su mente astuta y retorcida, pero también  estaba plagado de la paranoia común en la corte francesa. Abrazado por Azaneal la noche de la muerte de Carlomagno, rápidamente se adaptó a su nueva  no-muerte y se deshizo de la anterior, su nombre original perdido para la historia. La Orden ahora solo conoce a Amducious. Rápido en sus estudios de  Daimonion, se hizo conocido como el Señor Engendrado por el Infierno dentro de la Orden y muy respetado dentro del linaje por sus experimentos y estudios."
 bookmark_patronwar_patrick_ramos: "Patrick"
 bookmark_patronwar_patrick_ramos_desc: "Abrazado y dejado a su suerte, la única manera de ganarse el respeto es a través de la fuerza y el poder. Sin  ningún clan que lo detenga, Patrick anhela el día en que pueda controlar a Cainitas y Mortales y hará lo que sea necesario para ganar poder y construir el  mundo a su imagen."
 bookmark_patronwar_irge_hectsaehtf: "Irge"
 bookmark_patronwar_irge_hectsaehtf_desc: ""
 bookmark_patronwar_aedan_cathasach: "Aedan Cathasach"
 bookmark_patronwar_aedan_cathasach_desc: "Aedan fue abrazado por un anciano Brujah Verdadero preocupado por la desaparición y corrupción de los Aulladores  Blancos. Como descendiente de los druidas que trabajaron con los Aulladores Blancos, su sire esperaba que Aedan pudiera proporcionar información sobre el  misterio."
 bookmark_patronwar_illitharn_sagaard: "Illitharn Sagaard"
 bookmark_patronwar_illitharn_sagaard_desc: ""
 bookmark_patronwar_abe_no_seimei_onmyoji: "Abe No Seimei Onmyōji"
 bookmark_patronwar_abe_no_seimei_onmyoji_desc: "Un onmyōji, un destacado especialista en onmyōdō durante la mitad del período Heian en Japón. El onmyōdō es  un sistema de ciencias naturales, astronomía, almanaque, adivinación y magia que se desarrolló independientemente en Japón basado en las filosofías chinas  del yin y yang y wuxing (cinco elementos). Además de su prominencia en la historia, es una figura legendaria en el folclore japonés y ha sido retratado en  varias historias. Seimei trabajó como onmyōji para los emperadores y el gobierno Heian, asesorando sobre la forma espiritualmente correcta de manejar los  problemas. Rezaba por el bienestar de los emperadores y el gobierno, además de asesorar sobre varios temas. También era astrólogo y predecía eventos  astrológicos. Disfrutó de una vida extremadamente larga, libre de cualquier enfermedad grave, lo que contribuyó a la creencia popular de que tenía poderes  místicos. Hacia el final de su vida, fue abrazado por uno de los Salburi orientales."
 bookmark_patronwar_cody_dio: "Cody Dio"
 bookmark_patronwar_cody_dio_desc: ""
 bookmark_patronwar_arturia_pendragon: "Arturia"
 bookmark_patronwar_arturia_pendragon_desc: "Afirma liderar la defensa de Gran Bretaña contra los sajones invasores mientras se disfraza de hombre entre los  mortales."
 bookmark_patronwar_aethelflaed: "Æthelflæd"
 bookmark_patronwar_aethelflaed_desc: "Engendrado por Melusine d'Anjou como una obra de arte viva y un juguete, ha acumulado una pizca de poder simplemente  por ser favorecido por ella y por encantar a los que lo rodean, más que por cualquier competencia real de la que carece gravemente. Tanto su nombre como su  casa menor, Doe, le fueron otorgados por ella tanto como un entretenimiento como para ajustarse a un cierto tema.\n\n#bold Demuestra que eres más de lo que  se supone, o no lo hagas.#!"
 bookmark_patronwar_memnon: "Memnon"
 bookmark_patronwar_memnon_desc: "Memnon era un rey semidiós etíope que luchó contra el héroe Aquiles. Aunque Memnon cayó en la batalla, Zeus quedó  impresionado por su habilidad y valor y le concedió la inmortalidad. Al regresar a su tierra natal, vagó durante un tiempo desesperado por su derrota hasta  que cayó en letargo. Cuando despertó en el siglo XII, regresó a Grecia para enfrentarse y derrotar a Aquiles. Aquiles llevaba mucho tiempo muerto.  Atormentado por sentimientos de duda, ha tratado de saciar sus sentimientos de insuficiencia. Se enfrentó a los Kindred de Grecia para probar su temple  antes de regresar a Etiopía. Ahora desea mostrar su valía forjando un imperio kindred desde Etiopía. O quizás esta leyenda es una fabricación, creada por  un guerrero Gangrel que deseaba inflar su ficción para inspirar devoción en sus seguidores y miedo en sus enemigos.\n\n#bold El mundo verá el temple de  Memnon con la restauración de Etiopía.#!"
 bookmark_patronwar_phillip: "Phillip"
 bookmark_patronwar_phillip_desc: "Phillip era un arquitecto italiano en ascenso que fue contratado por Marcelo de Alejandría para restaurar la ciudad de  Alejandría y su biblioteca. Al examinar la ciudad, Phillip comentó en ruinas y suburbio en que se había convertido la ciudad, cuánto había caído de su  antigua gloria y cómo tomaría décadas de restauración hacer que la biblioteca y la ciudad fueran grandiosas nuevamente. Marcelo le ofreció abrazarlo como  una forma de trabajar en la ciudad sin envejecer y Phillip aceptó, pensando que la no-muerte sería una fiesta interminable puntuada por la inspiración  arquitectónica. Después de ser abrazado, llegó a despreciar la Yihad y ser maldecido eternamente por Dios. Huyó de regreso a través del Mediterráneo. Ha  comenzado proyectos de construcción para mortales para distraer a la Bestia, pero está empezando a verlos cada vez más como muñecos en una casa de muñecas. \n\n#bold Esta existencia es miserable y el único consuelo es construir de nuevo.#!"
 bookmark_patronwar_senen: "Senen"
 bookmark_patronwar_senen_desc: "El Vigilante Blanco es una figura antigua y enigmática entre los magísteres. Su progenie, los Perjurados, es una línea  derivada de los Lasombra a menudo referida como la 'sombra blanca' que actúan como guardianes del Silencio de la Sangre, la Mascarada. Valoran el deber por  encima de todo y sirven como vigilantes como un medio para salvaguardar el futuro de su casa y dinastía.\n\n#bold Es nuestro deber hacer cumplir la  Mascarada, ¡cueste lo que cueste!#!"
 bookmark_patronwar_golub: "Golub"
 bookmark_patronwar_golub_desc: "Con antecedentes de noble bosnio menor, devoto seguidor del bogomilismo y médico talentoso, Golub atrajo la atención y el  abrazo de Nikita de Sredetz. Esto, sin embargo, no produjo un peón dispuesto que combinara influencia temporal, devoción religiosa y aprendizaje para  Nikita.\n\nGolub estaba muy horrorizado por la Herejía Cainita y su corrupción de la iglesia. Se siente responsable de contraatacar a los monstruos que  tienen la fe como rehén. Con este fin, ha atacado a varios ancianos y sirvientes de la Herejía que encontró. Sin saberlo, a pesar de verse a sí mismo como  un salvador, llegó a considerar a las instituciones religiosas como el enemigo. Ve la influencia de la Herejía y su sire detrás de todo.\n\n#bold ¡Destruye  la Herejía Cainita y libera al pueblo de sus manipulaciones!#!"
 bookmark_patronwar_niobe: "Niobe"
 bookmark_patronwar_niobe_desc: "Niobe nació alrededor del siglo XIV a.C. en la ciudad-estado micénica de Tebas, ubicada en Beocia. Los testimonios sobre su  encuentro con su sire Amphion el 'Músico' se perdieron en los meandros del tiempo. En el siglo X d.C., fundó un culto dedicado a la Vía Adversarius en el  condado de Toulouse para difundir las creencias del Sendero de los Pecados en el Sur. En los albores de la herejía cátara, Niobe los influenció y organizó  con el objetivo de desestabilizar a la Iglesia de Roma en Occitania. Durante la cruzada albigense, primero se unió a la Corte de Esclarmonde la Negra, la  ayudó a repeler la invasión del norte y luego, con el apoyo de los príncipes occitanos de la oposición, destituyó a Esclarmonde en su beneficio. Niobe pudo  fortalecer su influencia en Occitania y convertir esta región al Sendero de los Pecados.\n\n#bold Haz realidad el sueño de una tierra de asilo para los  acólitos oprimidos.#!"
 bookmark_patronwar_hagbard: "Hagbard"
 bookmark_patronwar_hagbard_desc: "Nacido en una familia tradicional en la Rus de Kiev, la reverencia adecuada a los dioses antiguos fue inculcada a Hagbard  a una edad temprana. No es tonto; cuando su señor decretó que el reino ahora era cristiano, permitió que los vientos del cambio lo llevaran lejos de allí.  Después de numerosas aventuras famosas entre los mortales de esa época, el viajero experimentado aparentemente encontró un hogar sirviendo al Emperador  Bizantino como miembro de la Guardia Varega. En Constantinopla, el obstinado paganismo de Hagbard era visto con condescendencia o paternalismo en lugar de  con hostilidad abierta como en otros lugares, sin embargo, su fe en los dioses antiguos atrajo un tipo de atención completamente diferente. Conoció a un  hombre que le mostró que los dioses de su tierra natal no tenían poder aquí... y al mismo tiempo, le presentó a otros que sí lo tenían. Su mente destrozada  por el abrazo, se aferró a unos pocos fragmentos de lo que era, convirtiéndose en un firme defensor de los dioses antiguos de su hogar adoptivo.\n\n#bold  ¡Honra a los dioses antiguos! ¡Obedece a los Oráculos!#!"
 bookmark_patronwar_conradoadelchi: "Conrado Adelchi"
 bookmark_patronwar_conradoadelchi_desc: "En sus seiscientos años de no-muerte, Conrado Adelchi ha adquirido y regalado numerosas fortunas, a menudo  adquiridas por medios legítimos como el comercio de arte, la fabricación de perfumes y similares, pero ocasionalmente adquiridas mediante el saqueo de  tumbas, el contrabando y otras empresas criminales.\n\nUna vez, en los primeros días de su no-muerte, Conrado regaló el 'don de Caín' a los verdaderamente  desesperados y a aquellos dispuestos a pagar. Sus errores fueron 'rectificados' por Calida antes de que se violara la Mascarada. Alguien debe financiar las  lujosas veladas de los Toreador, y para Calida, el talento de Conrado para la adquisición de riquezas alcanzó el nivel del arte, al menos lo suficiente  para pasar por alto sus indiscreciones juveniles.\n\n#bold Oro, el oro resolverá todos los problemas.#!"
 bookmark_patronwar_viktor: "Viktor"
 bookmark_patronwar_viktor_desc: "Un temido general ruso; como gobernante, sin embargo, gobernó con puño de hierro. Durante su vida mortal, pasó de ser un  noble y general íntegro a Señor de un vasto dominio y una riqueza considerable. Un hombre orgulloso con una firme creencia en las tradiciones, cultivó una  compañía de elite de sirvientes; pero ni siquiera ellos tenían las respuestas a su mayor miedo, su vejez y su muerte inminente. Una figura sombría se  acercó a Viktor cuando su fuerza mortal comenzó a fallarle. Como criatura de la noche, su autoridad y sed de poder solo crecieron, ya que se había  desvelado un nuevo mundo lleno de oportunidades.\n\nViktor pronto se dio cuenta, sin embargo, de que ahora tendría que cambiar su estrategia y, en lugar de  gobernar desde el centro de atención, tendría que hacerlo desde las sombras. Abrazó a sus sirvientes más cercanos y se dispuso a empezar de nuevo y  reclamar un dominio en una nueva región.\n\n#bold Viktor lidera con el ejemplo, tal como lo había hecho antes.#!"
 bookmark_patronwar_aisling: "Aisling"
 bookmark_patronwar_aisling_desc: "El mundo Cainita no es tan diferente del de las Hadas, se dice Aisling a sí misma. Gobernarlo no debería ser demasiado  difícil."
