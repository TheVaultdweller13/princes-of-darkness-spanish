 #bm_867_thelongnight: "Mundo de los Mortales"
 #bm_867_thelongnight_desc: "#R Este marcador está diseñado para jugar en un mundo donde la mayoría de los personajes con títulos territoriales son mortales, y solo el 1% son vampiros. Por favor, elige las reglas del juego 'Mundo de Tinieblas — Mundo de Ignorancia' y 'Dominio Sobrenatural — Mortales — los Inocentes'.\n\nSi dejas las reglas del juego en 'Mundo de Tinieblas' y 'Vampiro — la Mascarada', obtendrás un mundo de vampiros no canónicos que son la mayoría de los personajes con títulos territoriales. Recomendamos encarecidamente el marcador de 1230 DC Guerra de Príncipes y no este. Sin embargo, a menudo se solicita jugar en un mundo mayoritariamente mundano con muy pocos vampiros, así que aquí está. Otros pueden disfrutar de un entorno sandbox de vampiros más aleatorio jugando V:tM en el 867.\n\nEl creador de personajes de $pod_wod$ estará disponible en las decisiones. ¡Disfruta!#!"
 #bookmark_thelongnight_neklan_premsyl: "Neklan Premsyl"
 #bookmark_thelongnight_neklan_premsyl_desc: "Diseñado para una partida de [Glossary('Revenant','game_concept_revenant_desc')].\nFundador de la Familia Premsyl [Glossary('Revenant','game_concept_revenant_desc')], un experimento Tzimisce en el linaje real de Bohemia. Se sabe que son sirvientes del Metusalah Vukodlak y su agente Azhra la No Muerta.\n\nQuizás los recuerdes del videojuego Vampiro: la Mascarada — Redención."
 #bookmark_thelongnight_michael: "Miguel"
 #bookmark_thelongnight_michael_desc: "Diseñado para una partida de Vampiro Secreto.\nEl Metusalah Vampiro Toreador Miguel se hace pasar por el Emperador bizantino Miguel III. Arcángel del Sueño Vampírico, intenta expandir su influencia en el mundo mortal con este subterfugio."
 #bookmark_thelongnight_rurik_rurikid: "Rurik"
 #bookmark_thelongnight_rurik_rurikid_desc: "Diseñado para una partida de Hombre Lobo, por ahora un mortal.\nSe rumorea que Rurik era Pariente de los Getos de Fenris, una tribu de hombres lobo.\n\nLos hombres lobo aún no se han implementado para el Mod Príncipes de la Oscuridad."
 #bookmark_thelongnight_theodosius: "Teodosio"
 #bookmark_thelongnight_theodosius_desc: "Diseñado para una partida de Inquisidor.\nTeólogo griego, ex hereje gnóstico convertido en católico ferviente, intelectual ocultista, cazavampiros y fundador de la Orden Roja."
 #bm_868_constantinoplebynight: "Constantinopla de Noche"
 #bm_868_constantinoplebynight_desc: "Miguel, el Patriarca del Sueño en Constantinopla, ha estado actuando como el mortal Miguel III. Dracon ha caído en una depresión tras la destrucción de Antonius. Cayo lidera a los Antonianos Ventrue. Narsés, el Arzobispo de Nod en Venecia, busca expandir la Herejía $pod_cainite$ tanto hacia el este bizantino como hacia las posesiones tradicionales de los Lasombra al sur, en Italia y Sicilia. Odín el Altísimo, líder de los [Glossary('Einherjar','game_concept_einherjar_desc')], está a punto de enfrentar una amenaza más temible que los Getos de Fenrir — debe oponerse a la amenaza inminente de los mortales que se convierten al dios clavado. Mientras tanto, en toda Europa occidental, los Ventrue son un clan dividido de estados feudales rivales, siendo el más poderoso de ellos, Alejandro de París. El viejo Prometeico Dominic ve una oportunidad para vengar la caída de Cartago desde su base entre los conquistadores magiares. Sin embargo, una casa de magos está a punto de poner patas arriba la sociedad Kindred al usurpar el poder de la sangre de Caín por sí mismos."
 #bookmark_constantinoplebynight_michael: "Miguel"
 #bookmark_constantinoplebynight_michael_desc: "Patriarca del Sueño"
 #bookmark_constantinoplebynight_odin: "Odín el Altísimo"
 #bookmark_constantinoplebynight_odin_desc: "¡Gloria a los [Glossary('Einherjar','game_concept_einherjar_desc')]! ¡Valhalla llama!"
 #bookmark_constantinoplebynight_montano: "Montano"
 #bookmark_constantinoplebynight_montano_desc: "Vemos en las Sombras"
 #bookmark_constantinoplebynight_narses: "Narsés"
 #bookmark_constantinoplebynight_narses_desc: "Martillo de los Godos" 
 #bookmark_constantinoplebynight_shahiri: "Sha'hiri, el Viejo Hombre de la Montaña"
 #bookmark_constantinoplebynight_shahiri_desc: "La Muerte No Llama" 
 pod_bookmark_warning_auh: "#X ¡Este marcador ha sido deshabilitado debido a la última expansión del mapa y está pendiente de futuras actualizaciones!#!"
 bm_1230_warofprinces: "Edad Oscura: Vampiro"
 bm_1230_warofprinces_desc: "La Guerra de los Príncipes es el período de conflicto en la historia Cainita que comenzó poco después de la caída de Constantinopla ante la Cuarta Cruzada en 1204. El término se refiere a los conflictos territoriales que los diversos príncipes de Europa libraron después del fin de la Larga Noche.\n\nLa Guerra de los Príncipes comenzó poco antes de que se formara la Inquisición. Aunque los Inquisidores fueron utilizados inicialmente como herramientas por los ancianos, pronto se convirtieron en una amenaza mayor para los Cainitas que los propios Cainitas. Aunque no está claro exactamente cuándo terminó la Guerra de los Príncipes, probablemente se habría visto obligada a concluir con el advenimiento de la Revuelta Anarquista, si no antes.\n\n#bold ¿Serás tú solo quien se alce como vencedor al final de esta Guerra? ¿O la marea de la humanidad arrasará tu clan mientras se vuelven contra sus legítimos amos?#!"
 bookmark_warofprinces_montano: "Montano"
 bookmark_warofprinces_montano_desc: "El fiel hijo del mismísimo Lasombra es el maestro de su $pod_clan$, abarcando todo el Mediterráneo. Aunque está en una posición segura y es un individuo poderoso, se avecinan problemas en el horizonte de Montano. La guerra civil en Iberia, el surgimiento de viejos enemigos en Italia y la indisciplina de los miembros más jóvenes del $pod_clan$ son todas amenazas para la estabilidad del $pod_clan$. Constantinopla se ha sometido recientemente a él, pero su príncipe, Alfonzo, ciertamente no es de fiar. El curso de acción más sabio podría ser centrarse en Italia por el momento. Cuidado con vasallos ambiciosos como Claudio Eugenio y el príncipe de Roma, Tito Venturus Camille.\n\n#bold ¿Podrás asegurar la legítima posición del $pod_clan$ Lasombra como el $pod_clan$ más influyente de Europa una vez más?#!"
 bookmark_warofprinces_qawiya: "Qawiyya el-Ghaduba"
 bookmark_warofprinces_qawiya_desc: "El $pod_clan$ Salubri yace destrozado, casi llevado a la extinción por los usurpadores de la Casa Tremere. La Leona de Jerusalén, hija del mismísimo Samiel, es su última esperanza, su última oportunidad de sobrevivir frente al asalto de los Magíster. Su alianza de Príncipes en la zona, la 'Dieta de los Olivos', es algo inestable y ya está amenazada por los cercanos [Glossary('Ashirra','game_concept_ashirra_desc')] y Baali. Asegurar su propia base de poder sería un primer movimiento sabio para la campeona Salubri.\n\n#bold ¿Transformarás una última resistencia fútil en un glorioso resurgimiento del $pod_clan$ Salubri?#!"
 bookmark_warofprinces_werter: "Werter"
 bookmark_warofprinces_werter_desc: "Las viejas costumbres de los nórdicos están muriendo, y con ellas, los Hijos de Odín. Cuando los Ventrue alemanes lanzan su asalto final a Escandinavia, la mayoría de los [Glossary('Einherjar','game_concept_einherjar_desc')] se resignan a su destino, la llegada del Ragnarök.\n\n#bold Como el último Altísimo de tu pueblo, ¿aceptarás tu destino pacíficamente o harás una última resistencia digna del Valhalla?#!"
 bookmark_warofprinces_etrius: "Etrius"
 bookmark_warofprinces_etrius_desc: "El $pod_clan$ más joven de Vampiros, los magos Tremere, están en una situación difícil. El propio Tremere está en $pod_torpor$, recuperándose de la $pod_diablerie$ de Saulot, y recae sobre el siempre leal Etrius enfrentar el implacable asalto de los Tzimisce. Sin embargo, tienes algunas ventajas: la famosa disciplina del $pod_clan$ asegura la unidad y los Ventrue de Alemania y Hungría están algo de tu lado. Tus enemigos no son conocidos por su paciencia, y debes buscar oportunidades para beneficiarte de su crisis interna.\n\n#bold ¿Asegurarás el $pod_clan$ Tremere como una fuerza poderosa en la política vampírica como decretó Tremere?#!"
 bookmark_warofprinces_rustovitch: "Rustovitch"
 bookmark_warofprinces_rustovitch_desc: "El manto de Voivoda de Voivodas no ha ido a parar al más viejo o más poderoso de los Koldun, sino al más ambicioso de los Tzimisce. Vladimir Rustovitch ha tenido un reinado agridulce hasta ahora, con una paz blanca contra el cruzado Jürgen von Verden y la humillante resistencia de los odiados Tremere. Como es siempre el caso en la política Tzimisce, a muchos les gustaría nada más que su caída, el primero entre ellos su predecesor, Noriz. Sin embargo, Rustovitch es, si no otra cosa, un político astuto; si es capaz de asegurar algunas victorias clave, sus rivales podrían pronto 'desaparecer'... \n\n#bold ¿Puede el 'Azote de Lobos' liderar a los señores Tzimisce en disputa contra la amenaza de los Ventrue y los usurpadores Tremere?#!" 
 bookmark_warofprinces_mithras: "Mitras"
 bookmark_warofprinces_mithras_desc: "Mitras es considerado por algunos como un auténtico Dios Persa y Romano. Aunque es poco probable, esto le ha permitido crear un cuadro fanático de vástagos y cultistas fervorosos que hacen su voluntad. Habiendo huido a Inglaterra tras el fracaso de algunas maquinaciones en la Antigua Roma, Mitras se aburrió rápidamente de las mezquinas disputas entre los señores de Inglaterra. Decidiendo que su tiempo era mejor empleado en dormitar, dejó el reino en manos de unos pocos Regentes de confianza... quienes rápidamente dejaron que todo se desmoronara. Al despertar de su $pod_torpor$, Mitras consolidó rápidamente el poder, arreglando la mayoría del desastre que habían causado sus regentes. Inglaterra está segura, pero no completamente sometida. Tendrás que lidiar con salvajes Gangrel en Gales, rebeldes forajidos en Nottingham y los restos de los [Glossary('Einherjar','game_concept_einherjar_desc')] en Escocia. Después de eso, el vacío de poder en Francia podría ser explotado con tu punto de apoyo en Burdeos.\n\n#bold No hay límites para lo lejos que puedes llegar. ¡Contempla la gloria del sol inmortal!#!"
 bookmark_warofprinces_pustula: "Servio Mario Pústula"
 bookmark_warofprinces_pustula_desc: "Esclavo en la antigua Roma, después de una pelea entre vampiros fue abrazado por un Nosferatu. Bajo la tutela de Tanitbaal, canalizó su ira escribiendo poemas satíricos. Cuando su mentor desapareció, Pústula y su compañera Camila conspiraron contra los enemigos de Tanitbaal, confiándole Camila el Sendero a Pústula antes de que cayera en $pod_torpor$. Pústula dejó Roma y comenzó a predicar su Sendero en el extranjero, ganando muchos nuevos adeptos.\n\nAhora que Camila ha despertado, Servio debe decidir si ayuda al plan de su viejo aliado de restaurar Roma bajo el Sendero del Pecado."
 bookmark_warofprinces_roque: "Roque"
 bookmark_warofprinces_roque_desc: "Quizás uno de los Príncipes Malkavian más influyentes, Roque es un hábil, aunque compulsivo, conspirador y planificador. Su habilidad para mantener su feudo le ha valido el respeto a regañadientes del $pod_clan$ Lasombra, y desempeña su papel en la Reconquista en la Sombra. Su fascinación por las tramas y maquinaciones le obliga a esperar y ver si puede aprovechar a sus enemigos para algo útil antes de destruirlos.\n\nRoque es también un seguidor prominente de la Ordo Aenigmatis y cree que el caos que la Reconquista en la Sombra traerá a Iberia presagia otra gran era de destrucción para todos los $pod_cainites$.\n\n#bold Tu futuro es incierto, pero si puedes mantener a raya a tus demonios, podrías seguir siendo la principal fuerza motriz de Navarra durante siglos... y quizás desempeñar un papel aún mayor en la península.#!"
 bookmark_warofprinces_natalya: "Natalia Sviatoslav"
 bookmark_warofprinces_natalya_desc: "Hija de un príncipe ruso, Natalia se educó en Constantinopla y se enamoró de la ciudad para siempre. Sus habilidades como administradora llamaron la atención de los Brujah, quienes le ofrecieron el $pod_Embrace$, que ella aceptó con gusto.\n\nNatalia se sumergió entonces en la construcción de una nueva Cartago, la encarnación de los ideales de su $pod_clan$ y del Sueño de Miguel. Después de que los cruzados conquistaran Constantinopla, huyó al déspota de Epiro, donde logró convertirse en Príncipe de Tesalónica. Ve su ciudad como una útil posición de retaguardia, pero sueña con recuperar Constantinopla de Alfonzo y los salvajes latinos.\n\n#bold Quizás eres la última esperanza de crear una utopía que rivalice con Cartago y Constantinopla. Respeta los logros del pasado y aprovéchalos para construir el futuro mejor con el que sueñas.#!"
 bookmark_warofprinces_jasmin: "Jasmin de Palma"
 bookmark_warofprinces_jasmin_desc: "Hechicera de los Banu Haqim de origen almohade. Logró revitalizar la fe de los [Glossary('Ashirra','game_concept_ashirra_desc')] de las islas Baleares, pero ha tenido menos éxito en lograr que aprecien la amenaza cristiana. Los vampiros de las Baleares disfrutan de su aislamiento de la corriente principal de la sociedad $pod_cainite$, formando una variopinta colección de ermitaños, excéntricos y marginados."
 bookmark_warofprinces_durga_syn: "Durga Syn"
 bookmark_warofprinces_durga_syn_desc: "La amable mentora del $pod_clan$ Ravnos es quizás la única fuerza del bien en la Rusia $pod_cainite$. Esta tierra, eternamente maldita por Baba Yaga y su Cortina de Sombras, solo trae miseria y desesperación a quienes se oponen a la tiránica Bruja. A pesar de estas terribles probabilidades, Durga Syn nunca flaqueó y su corte se ha convertido en un faro de esperanza para cualquiera que intente recuperar la vieja tierra de las garras de los secuaces de Baba Yaga. Si Durga fallara en su deber, la Cortina de Sombras ciertamente envolvería a toda Europa en su abrazo.\n\n#bold Reúne a los Ravnos bajo tu sabio liderazgo, ¡derrota a los dementes sirvientes de Baba Yaga y devuelve la esperanza a Rusia!#!"
 bookmark_warofprinces_maatkare: "Maatkare"
 bookmark_warofprinces_maatkare_desc: "Concubina de Set y bendecida con una belleza (casi) sin igual, Maatkare es una de los Hierofantes del $pod_clan$ Setita, su estructura de liderazgo. Ejerciendo una tremenda influencia, gobierna el templo de la Guarida Descendente en el Magreb, donde extiende cuidadosamente la influencia de Set entre los $pod_cainites$ locales extraviados. \nEl continuo colapso de la Iberia musulmana está teniendo un efecto desestabilizador en toda la región, hecho del que Maatkare se está aprovechando ahora, con el sueño de un $pod_clan$ Setita unificado desde Iberia hasta Egipto en el fondo de su mente...\n\n#bold Eres la encarnación del amor eterno de Set por todos sus hijos, estén o no extraviados. Se lo mostrarás, y aprenderán. Porque no tienen otra opción.#!"
 bookmark_warofprinces_matasuntha: "Matasuntha"
 bookmark_warofprinces_matasuntha_desc: "Matasuntha es una leyenda entre los viejos Gangrel. Líder de los hunos nómadas, casi puso a Roma de rodillas ante ella, siendo detenida apenas en el 403 por un duelo climático en los Alpes. Desde entonces ha sido olvidada y, habiendo despertado recientemente de su $pod_torpor$, encuentra este nuevo mundo extraño y espantoso. Su antes orgulloso $pod_clan$ está dividido, siendo rechazado por los sirvientes de la Cruz, y la generación más joven no conoce su nombre ni sus hazañas pasadas. Sin embargo, hay esperanza, mientras la horda mongola arrasa las estepas, Matasuntha ve en ellos un sucesor digno de su propio pueblo.\n\n#bold Muestra a los otros Gangrel de las Estepas por qué Roma suplicó tu misericordia hace siglos. Luego, asegúrate de que los débiles $pod_cainites$ occidentales nunca olviden tu nombre otra vez.#!"
 bookmark_warofprinces_dionysius: "Dionisio"
 bookmark_warofprinces_dionysius_desc: "Un hombre pacífico y sencillo en sus días mortales, Dionisio se unió al culto de Perséfone en un intento fútil por alcanzar a sus familiares caídos. Esta fascinación por la muerte lo convirtió en un candidato obvio para el $pod_Embrace$ por parte de los Cappadocios. La no-muerte no cambió mucho a Dionisio, sin embargo, y se negó a seguir los mórbidos caminos de su $pod_clan$, prefiriendo cuidar tanto de los mortales como de los muertos. Atrayendo a un gran número de seguidores, fue fundamental en la codificación del Sendero de la Humanidad. \nEl gran respeto que cosechó le valió el Principado de Atenas, una responsabilidad que aún ocupa esta noche. Su ciudad alberga ahora a un gran número de refugiados de la caída Constantinopla que claman venganza.\n\n#bold Tendrás que equilibrar tus convicciones y tu fe en la Humanidad con el caos actual en Grecia. Quizás tu liderazgo benevolente sea la única cura para detener la locura interminable traída por la 4ª Cruzada.#!"
 bookmark_warofprinces_petaniqua: "Petaniqua"
 bookmark_warofprinces_petaniqua_desc: "Antiguamente llamada Olimpia, Petaniqua fue la esposa de Filipo II de Macedonia y madre de Alejandro Magno. Desconocido para la mayoría, también era miembro del culto a Cibeles, una metusalah Baali loca. Alimentada por su 'Diosa', Petaniqua llegó a odiar a todos los hombres excepto a su hijo, para quien deseaba el mundo. Y el mundo lo consiguió, pero la eternidad le fue negada, ya que Cibeles prohibió a Petaniqua convertir a Alejandro en vampiro. \nEste fue el comienzo de una larga y constante decadencia hacia la locura, que continúa hasta esta noche. Desde entonces, Petaniqua ha descendido a infiernos aún más profundos, haciendo pactos con entidades que es mejor no conocer. Y ni siquiera sabe por qué.\n\n#bold Debe haber una manera de encontrarle. O una entidad lo suficientemente poderosa para revivirle. Entonces, será el Rey del mundo, y todo será perfecto una vez más.#!"
 bookmark_warofprinces_absalon: "Absalón"
 bookmark_warofprinces_absalon_desc: "Antiguo Arzobispo de Lund y uno de los hombres más poderosos de Dinamarca, Absalón tenía oídos de reyes y $pod_cainites$ por igual. Cuando la muerte llegó por él, fue tarea fácil ingeniar su transformación en el maestro vampiro de su país. Sus primeros años de gobierno fueron exitosos, equilibrando cuidadosamente a los Ventrue del sur y a los salvajes Gangrel del norte. Hasta que una campaña contra los Tremere wendos distrajo a Absalón durante varias décadas mientras descubría un poderoso secreto que podría cambiar su destino.\nSin su cuidadosa guía, Dinamarca ha caído presa de señores de la guerra mezquinos y aventureros rebeldes. Pero no durará, ya que Absalón está ahora listo para regresar a su tierra.\n\n#bold Recupera tu derecho de nacimiento y juega cuidadosamente tus cartas, ya que tanto el sur como el norte quieren que te vayas.#!"
 bookmark_warofprinces_helena: "Helena de Troya"
 bookmark_warofprinces_helena_desc: "Muchos ejércitos han luchado por una mera mirada de la mujer más bella del mundo. Pero Helena nunca fue una doncella en apuros, como demostró bastante temprano al [Glossary('Diablerizing','game_concept_diablerie_desc')] a su propio [Glossary('Sire','game_concept_Sire_desc')] y captor, Minos. La política vampírica le sentaba bien y encontró refugio y amor en Cartago. \nEl amor no está destinado a durar, sin embargo, y, una vez que se dio cuenta de que defender Cartago contra los romanos era inútil, traicionó su hogar adoptivo ante los latinos. Uno de los únicos supervivientes de la caída de Cartago, Menelao de Esparta, ha estado conspirando su destrucción desde entonces. Su conflicto ha abarcado milenios y se ha vuelto legendario sin que ninguno de los dos pueda obtener ventaja. Innumerables ciudades ya han caído a raíz de sus batallas.\n\n#bold Mata a Menelao. Borra cada rastro de su existencia. Entonces, todos te amarán y se desesperarán.#!" 
 bookmark_warofprinces_tabitha: "Tabitha al-Masri"
 bookmark_warofprinces_tabitha_desc: "Mientras los reinos musulmanes se desmoronan ante la Reconquista, el $pod_clan$ Assamita ha enviado a un grupo de sus mejores guerreros para intentar detener la invasión. Lideradas por Tabitha al-Masri, han establecido su hogar en Badajoz y pretenden mantener la ciudad el mayor tiempo posible. Tabitha no es una fanática, sin embargo, y acepta a aquellos que desean huir en lugar de luchar. Hasta ahora, ha aceptado el llamamiento a la unidad del sultán Badr, pero alberga serias dudas sobre el gobernante de Granada. Sabe que cualquier desunión sería la perdición de los fieles, sin embargo, y guarda sus observaciones para sí misma.\n\n#bold Tu misión es simple: contener la Reconquista cristiana, hacerles pagar caro cada palmo de tierra. Entonces, quizás sea el momento de poner a prueba los verdaderos motivos del Sultán Badr...#!" 
 
 bm_1375_patronwar: "La Guerra del Mecenas"
 bm_1375_patronwar_desc: "Este marcador está modelado según los deseos de nuestro Mecenas y no representa el canon del WOD. Después de la Peste Negra, el caos se apoderó de la sociedad Kindred. Con el agotamiento del suministro de sangre, muchos vampiros cayeron en letargo, otros fueron destruidos. Mientras la humanidad se abre paso fuera de la devastación, los kindred que soportaron la peste negra forjan nuevos imperios y reinos en las secuelas."
 bookmark_patronwar_cecil: "Cecil"
 bookmark_patronwar_cecil_desc: ""
 bookmark_patronwar_lvcivs: "Lvcivs"
 bookmark_patronwar_lvcivs_desc: "" 
 bookmark_patronwar_seitheach: "Sèitheach"
 bookmark_patronwar_seitheach_desc: ""
 bookmark_patronwar_chrysantha: "Crisanta"
 bookmark_patronwar_chrysantha_desc: ""
 bookmark_patronwar_zethraeus: "Zethraeus"
 bookmark_patronwar_zethraeus_desc: ""
 bookmark_patronwar_jose: "José"
 bookmark_patronwar_jose_desc: "La vida mortal de José nació de un pescadero y su esposa en algún lugar del norte de la Península Ibérica, pero pasó la mayor parte de sus primeros años en las calles causando problemas. Era más grande que la mayoría de los chicos de su edad y usaba ese tamaño para intimidar a otros niños. Aprendió en su adolescencia temprana que la gente pagaba por información, así que comenzó a recopilar toda la información que podía para chantajear o intercambiar mediante escuchas, siguiendo discretamente o simplemente intimidando. Terminó siendo un joven adulto dirigiendo una pequeña red de información en la ciudad de Sarria, donde un vampiro visitante se fijó en él. Notó los talentos de José y decidió que sería un candidato perfecto para engendrar. José y su sire tuvieron una relación tumultuosa, que terminó con José [Glossary('Diablerizing','game_concept_diablerie_desc')] al anciano.\n\nEn la década de 1300, José toma el control del ducado de A Coruña y se promete a sí mismo que gobernaría la Península Ibérica en nombre de la Bestia."
 bookmark_patronwar_eden: "Edén"
 bookmark_patronwar_eden_desc: "Secuestrar mortales (particularmente especímenes físicos finos, fuertes, hermosos, etc.) atrae la atención; particularmente cuando la mayoría de los capturados son encontrados... como restos. Los fallecidos parecen haber sido cruelmente experimentados; con algunas de sus extremidades u órganos deformados casi hasta ser irreconocibles. Por desgracia, la buena ayuda es difícil de encontrar y aquellos 'de confianza' a los que Edén encargó (mercenarios) deshacerse de los fracasos, decidieron simplemente tirar los cuerpos en algún lugar conveniente, asumiendo que se contarían como más asesinatos (de una clase mundana) en la región. Sin embargo, cualquiera que esté mínimamente familiarizado con los efectos de la Vicisitud habría sospechado." 
 bookmark_patronwar_loukios: "Loukios"
 bookmark_patronwar_loukios_desc: "Antiguo centurión romano de cierto renombre y seguidor secreto del culto a la diosa Isis. En los años previos al colapso de Roma ante las hordas godas, Loukios desertó cuando las guerras comenzaron a volverse desesperanzadoras y se sintió cada vez más enamorado de la mitología egipcia hasta el punto de que hizo una peregrinación a la tierra de las arenas movedizas para comprender mejor a su diosa. Desafortunadamente, no encontró el conocimiento que tanto había buscado, solo a los Seguidores de la Serpiente. Set lo recibió en los viejos templos. Se habían interesado en él o quizás en su conocimiento del ejército romano." 
 bookmark_patronwar_ciaran: "Ciarán"
 bookmark_patronwar_ciaran_desc: "Ciarán era un viajero irlandés, o más exactamente, un Mincéirí o un lucht siúil (literalmente, 'la gente que camina'). Era un joven de 23 años que simplemente hacía lo necesario para sobrevivir y mantener a su familia. A menudo eso significaba mentir y hacer trampa porque no tenía muchas otras habilidades. A pesar de su naturaleza deshonesta, la familia siempre fue lo más importante para él, y veía a todo un lucht siúil como su familia. Cualquier nómada lo respetaba casi tanto. Por eso le ofreció un hogar a un extraño viajero indostánico llamado Viswanathan.\n\nViswanathan era un vampiro metusalah del $pod_clan$ Ravnos. Afortunadamente, porque su campamento pronto sería asaltado por lugareños y el irlandés resultaría herido de muerte. Viswanathan traicionó sus propios principios para $pod_Embrace$ a Ciarán, salvándole la vida. Enseñándole el Sendero de la Paradoja y advirtiéndole que nunca hiciera lo que él acababa de hacer. Luego desapareció."
 bookmark_patronwar_hannibal: "Aníbal"
 bookmark_patronwar_hannibal_desc: "Los padres romanos asustaban a sus hijos diciéndoles 'Aníbal ante portas' — 'Aníbal está a las puertas' — durante la Segunda Guerra Púnica. Persisten rumores de que fue Abrazado por la metusalah Brujah Troile en Cartago, pero sigue siendo desconocido si sobrevivió a la destrucción de la ciudad o pereció con ella. Algunos incluso cuestionan si existió un Aníbal. Así fue. Despertado del Torpor en las ruinas de Hattusa, Aníbal regresa a su hogar ancestral y desde allí tiene un pensamiento, y solo un pensamiento. Destruir. Roma. O algo así." 
 bookmark_patronwar_antariksha: "Antariksha-Chandra"
 bookmark_patronwar_antariksha_desc: "Suficientemente viejo como para probablemente ser realmente parte del Rig-Veda, Chandra es el dios de la Luna en el Rig-Veda. Antariksha es el dios del Espacio. Nacido alrededor del 1500 a. C., Abrazado probablemente alrededor de la misma época." 
 bookmark_patronwar_rostislav: "Rostislav"
 bookmark_patronwar_rostislav_desc: ""
 bookmark_patronwar_nieve_tingi: "Nieve Tingi"
 bookmark_patronwar_nieve_tingi_desc: ""
 
 bm_1230_inquisitor_group: "Cazadores y Cazados"
 bm_1230_inquisidor: "Edad Oscura: Inquisidor"
 bm_1230_inquisidor_desc: "Año del Señor 1230. Liderada por un grupo incondicional de cazadores de monstruos, la Santa Iglesia finalmente se ha dado cuenta de la amenaza que suponen los vampiros. Formando una nueva organización secreta llamada la Inquisición Sombría, estos héroes son los primeros humanos en intentar reconquistar la noche y rechazar sus horrores. La tarea ante ellos es inmensa, y los malditos chupasangres han tenido siglos para atrincherarse y preparar su contraataque. Los llamados 'Inquisidores' están dispuestos a morir como mártires, si su sacrificio puede allanar el camino para un futuro mejor para la humanidad. Luchan por una causa, y eso es más de lo que cualquier vampirous pueda reclamar.\n\n#bold ¡Eres la única esperanza para un mundo que desconoce la guerra que se libra por su propia alma!#!"
 bookmark_inquisitor_gauthier: "Gauthier de Dampierre"
 bookmark_inquisitor_gauthier_desc: "El tercer hijo de un conde menor francés, Gauthier escuchó el llamado de Dios temprano en su vida y lo respondió de la única manera que conocía: la batalla. Su primer encuentro con un vampiro durante la Tercera Cruzada abrió sus ojos y Gauthier ha reunido un fuerte séquito de caballeros devotos empeñados en luchar contra el mal. Esta fue razón suficiente para que se convirtiera en fundador de la Inquisición Sombría, donde es el líder en todos los asuntos militares. Gauthier es un combatiente temible y un líder carismático, pero la vejez le está alcanzando, haciéndole temer lo que le espera a la Inquisición después de su muerte.\n\n#bold Tus hazañas quedan atrás, pero aún tienes tiempo para asegurarte de que los Caballeros de Acre te sobrevivan. Ese es tu último deber en una larga vida dedicada a servir a Dios.#!"
 bookmark_inquisitor_leopold: "Leopold von Murnau"
 bookmark_inquisitor_leopold_desc: "Vástago menor de la casa von Murnau, Leopold era un niño enfermizo maldecido con una extraña habilidad: el poder de literalmente 'oler' el mal. En lugar de temerlo, el agudo Leopold usó su don para descubrir varias maquinaciones vampíricas en su casa. Sin embargo, no se detuvo ahí, y pronto estuvo en Roma para ofrecer sus servicios a los recién creados Caballeros de Acre. Desde entonces, ha sido la principal fuerza impulsora detrás de la creación de la Inquisición Sombría, reuniendo a todos aquellos que intentan luchar contra el mal en sus múltiples formas. Su casa firmemente detrás de él, Leopold es quizás el pilar más fuerte de la Inquisición, liderando los esfuerzos para recuperar la noche.\n\n#bold La Casa Murnau se mantiene firme, y Baviera está asegurada, pero esto es solo el comienzo de la lucha. No debes detenerte hasta que el último chupasangre sea arrastrado ante la luz de Dios.#!"
 bookmark_inquisitor_maria: "María-Inmaculada"
 bookmark_inquisitor_maria_desc: "La actual líder de las Hermanas de San Juan no es la fundadora de la orden, pero su voluntad es tan fuerte como la de la Madre Teresa, su bendita predecesora. Llamarla personalmente formidable es sugerir que el Papa es solo un poco santo. Después de varios intentos fallidos por parte de inquisidores menos hábiles, María-Inmaculada ha optado por ir personalmente a las Islas Británicas, con la esperanza de encontrar al infame 'Rey-Dios' vampírico que presume de gobernar estas islas. Con su fe inquebrantable y el respaldo de las otras órdenes de la Inquisición, María está lista para enseñar a este enemigo que solo hay un Dios.\n\n#bold Estás segura de que Inglaterra es un centro de actividad vampírica. Descubrirlo y destruirlo sería un tremendo impulso para la Inquisición. Verás caer al Rey-Dios.#!"
 bookmark_inquisitor_vittoria: "Vittoria Santini di Parma"
 bookmark_inquisitor_vittoria_desc: "Mujer de enorme intelecto e intenso amor a Dios, Vittoria es la líder informal de la Orden Roja, los investigadores de la Inquisición Sombría. Posee un sentido increíble de cuándo doblar las reglas y cuándo jugar precisamente según la letra ortodoxa. Por lo tanto, fue la elección obvia para la misión más importante y peligrosa: Purgar a la propia Italia de la influencia de los vampiros y proteger la Santa Sede. Mientras Vittoria descubre más y más corrupción sobrenatural en la Iglesia, encuentra que la tarea será incluso más compleja de lo anticipado...\n\n#bold Estás decidida a salvar a la Iglesia de sí misma, y la mejor manera de hacerlo es exponer y destruir a los vampiros de Italia. Has identificado dos objetivos principales, un supuesto Cardenal en Milán y una abominación que se burla del Papa en la propia Roma...#!"
 bookmark_inquisitor_aignen: "Aignen le Libraire"
 bookmark_inquisitor_aignen_desc: "El maestro de espías occitano es el líder de los Oculi Dei, los ojos y oídos de la Inquisición. Antiguo lugarteniente de Rodrigue de Navarre, Aignen rompió con su amigo cuando este se negó a unirse a la Inquisición Sombría. Aignen llora por su amistad perdida, pero sabe que la Santa Sede necesitará una fuerza potente de espías ingeniosos. Despreciado por sus antiguos aliados, y aún desconfiado por los nuevos, Aignen recorre el solitario camino entre ser útil y ser marcado como hereje.\n\n#bold Francia es tu hogar, y conoces la influencia vampírica cultivada aquí. La herejía cátara lo demostró demasiado bien. Con los pocos amigos que puedes reunir, tienes que actuar para controlar la situación y, con suerte, demostrar tu utilidad a la Inquisición Sombría.#!"
 bookmark_inquisitor_rodrigue: "Rodrigo de Navarra"
 bookmark_inquisitor_rodrigue_desc: "Rodrigue fue el primer cristiano en entrar en contacto con los no-muertos, sobrevivir y luego decidir tomar las armas contra ellos. Un noble menor de Navarra, fue durante la Herejía Cátara que presenció el verdadero mal del mundo. Desde entonces, Rodrigue ha estado tratando frenéticamente de destruir cualquier influencia vampírica percibida... que es casi todo el mundo, en su mente paranoica. Como tal, se negó a unirse a la Inquisición Sombría y actúa por su cuenta, con la Espada de Santiago a su disposición.\n\n#bold Están en todas partes. La Inquisición Sombría es probablemente una aliada, pero no te arriesgas. Si quieren ayudar, bien, pero salvarás Iberia en tus propios términos y con tus propios métodos.#!"
 bookmark_inquisitor_jeanne: "Jeanne Roullet"
 bookmark_inquisitor_jeanne_desc: " #R ¡Este personaje no tiene tierras y, por lo tanto, necesita el DLC Roads to Power para ser jugable!#!\n\n Inspirada por el fervor apocalíptico y el espíritu cruzado de Leopold von Murnau, Jeanne Roullet, una visionaria francesa, comenzó a reclutar mujeres para la misma causa que Leopold. La fe de Jeanne es fuerte, ella y sus pocos seguidores luchan contra los ejércitos del Enemigo con tanta dedicación y poder como los seguidores de Leopold. Desafortunadamente, su causa es frecuentemente pasada por alto, lo que resulta en que el grupo de Jeanne sea simplemente reconocido por la Iglesia y la Inquisición en lugar de ser plenamente respaldado y, por lo tanto, hasta ahora, careciendo de una base de poder propia.\n\n#bold No importa si Roma te ayuda o no. Tu visión fue clara y tu causa justa. Debes triunfar sin importar las pruebas que tengas por delante.#!"
  
 bm_1230_hunter: "Edad Oscura: Cazador"
 bm_1230_hunter_desc: "No importa cuándo ni dónde, los hombres y mujeres valientes siempre han tomado las armas contra lo sobrenatural. Lejos de estar tan organizados e influyentes como la Inquisición Católica, estas pequeñas facciones, familias o incluso individuos se enfrentan a probabilidades imposibles. Eso nunca les ha impedido intentarlo y dejar un rastro para que la humanidad lo siga.\n\n#bold La victoria es una posibilidad apenas visible. Sin embargo, la lucha misma merece la pena.#!"
 bookmark_inquisitor_nachmanides: "Najmánides"
 bookmark_inquisitor_nachmanides_desc: "Tomando su nombre y tradiciones de los Jueces bíblicos, los Jueces son protectores de los de fe judía de los monstruos que acechan la noche. Luchan contra lo que perciben como la progenie de Lilith. Usan la Torá y una versión especial del Talmud como recursos para su lucha contra lo antinatural.\nDebido al bajo porcentaje judío en la mayoría de los países, los Jueces operan en pequeños grupos sin coordinación central. La mayoría de los Jueces son lobos solitarios contra las criaturas de la oscuridad, enfocándose en proteger una comunidad específica. Tienden a ignorar a los magos; los infernalistas, los cambiaformas y los vampiros son sus verdaderos objetivos.\n\n#bold La monstruosa descendencia de Lilith está en todas partes. Debes interponerte en su camino.#!"
 bookmark_inquisitor_karl: "Karl Schrekt"
 bookmark_inquisitor_karl_desc: "Un hombre solitario con una misión, Karl Schrekt es quizás el cazador independiente más infame de su tiempo. El severo alemán no tiene paciencia para la diplomacia ni amor por las células de cazadores organizadas. Lucha solo y, a medida que aumenta el número de vampiros derrotados a su paso, los hijos de Caín comienzan a darse cuenta.\nY por primera vez en mucho, mucho tiempo, un mero mortal comienza a hacerles sentir una emoción que creían por debajo de ellos: el miedo.\n\n#bold Una noche, puedes encontrar a tu igual. Sin embargo, hasta entonces, continuarás matándolos uno por uno.#!"
 bookmark_inquisitor_emerik: "Emerik"
 bookmark_inquisitor_emerik_desc: "El dios guerrero eslavo del sol dejó tras de sí un legado heroico de luchar contra lo impío con abandono temerario. Desde entonces, muchos jóvenes guerreros siguieron sus pasos, tratando de recuperar su patria de los viles Tzimisce y su aliado demoníaco, Kupala.\nLa lucha no ha ido bien para los fieles de Dazhbog, y la lenta muerte de la religión eslava ha reducido sus números casi hasta la extinción. Aun así, ellos luchan, muriendo gloriosamente contra su enemigo inmortal en nombre de su amado dios patrón.\n\n#bold A pesar de todo, los Guerreros aún sobreviven. Y como demostró Dazhbog, mientras vivas, aún puedes luchar. Esto no ha terminado.#!"
 bookmark_inquisitor_demetrios: "Demetrios"
 bookmark_inquisitor_demetrios_desc: "Sacerdotes y monjas ortodoxos que se sienten llamados a luchar contra $POD_splat_vampire_plural$, $glossary_fera$ y otros monstruos, los Akritai llevan una existencia ascética, y aunque no son hostiles hacia otras organizaciones de cazadores, tampoco colaboran ni confabulan con ellos. La reciente 4ª Cruzada fue un duro golpe para la organización y una seria tensión en su relación con la Inquisición Católica.\nMientras el que fuera poderoso Imperio Bizantino se desmorona, está por ver si sus antiguos defensores sombríos pueden sobrevivir a esta difícil era.\n\n#bold Los Akritai están en una encrucijada. ¿Perdonarán a la Iglesia de Roma por su terrible ataque a Constantinopla? Podría ser la única esperanza para un frente cristiano unido contra lo sobrenatural.#!"
 bookmark_inquisitor_ishaq: "Ishaq ibn Jamil"
 bookmark_inquisitor_ishaq_desc: "La primera familia de Ishaq fue asesinada por vampiros mientras él huía aterrorizado. Buscando la redención desde entonces, ha estado alimentando una nueva generación de cazadores musulmanes, los Sayyadin, con la esperanza de que estén mejor preparados para enfrentarse a lo sobrenatural de lo que él lo estuvo. El propio Ishaq sabe que su momento llegará pronto, pero, si se maneja adecuadamente, su legado podría sobrevivirle durante los siglos venideros.\n\n#bold Una pequeña familia de cazadores beduinos no es una amenaza para los poderosos monstruos de la noche. Sin embargo, con el tiempo y cuidado, incluso la chispa más pequeña puede iniciar un gran fuego purificador.#!"
 bookmark_inquisitor_qorjin: "Qorjin"
 bookmark_inquisitor_qorjin_desc: "Mientras la historia recuerda nombres como Subotai y Jebe, las hazañas de Qorjin permanecen en el silencio. Su carrera actual se lanzó en la Batalla de Samara Bend, donde él solo se negó a rendirse ante los hombres-que-se-convertían-en-lobos, creando una distracción que permitió al resto de su arban retirarse a un lugar seguro. Al regresar a casa en Karakorum, fue convocado ante el propio Gengis Kan, quien le encomendó un nuevo deber sagrado: proteger al Imperio Mongol de lo sobrenatural. En los años intermedios ha estudiado el mundo invisible, aprendido a usar los miedos y supersticiones de sus enemigos para su mayor ventaja, y llevado a las criaturas del mito a la sumisión ante el Imperio Mongol.\n\n#bold Los primeros logros de Qorjin son grandes, pero ha comenzado a darse cuenta de la inmensidad de la tarea que tiene por delante. Aun así, el Kan ordenó y Qorjin planea cumplir.#!"
 bookmark_inquisitor_mayiyuan: "Ma Yi Yuan"
 bookmark_inquisitor_mayiyuan_desc: "Los Shih son los cazadores de demonios del Reino Medio, que usan su propio Chi en aplicaciones conocidas como Qiao para lograr poderes sobrehumanos. Una vez unificados en un poderoso Ejército Celestial, los Shih se volvieron arrogantes y el Ejército fue destruido durante un terremoto masivo que solo perdonó a aquellos que se negaron a unirse. Ahora trabajan solos o en grupos muy pequeños, cada cazador es su propio individuo con sus propias prácticas y formas de abordar la lucha.\nSe sabe que los Shih tienen una mente más abierta que la mayoría de los otros cazadores y a veces se les puede convencer para que trabajen con lo sobrenatural 'bueno' contra un enemigo común.\n\n#bold Con el colapso del Ejército Celestial, los Shih ahora son vagabundos, pero siguen siendo una amenaza creíble para lo sobrenatural. Su organización puede haber cambiado, pero su llamado no.#!"    
 bookmark_inquisitor_bayezid: "Bayezid"
 bookmark_inquisitor_bayezid_desc: "Antiguamente un [ghoul|E] esclavo del $pod_cainite$ Caitiff Stanislav de los Elegidos de Calomena, Bayezid y su hermano Basilio vieron su fe bogomila corrompida por los intereses de los no-muertos. Cuando Stanislav fue destruido durante la caída del Sueño de Miguel en 1204, los hermanos Gantenbein fueron liberados de sus vínculos de sangre. Desde entonces, han tomado el nombre de 'Los Abandonados de Calomena' y han liderado a los fieles bogomilos en ataques contra vampiros en toda Bosnia.\nPara ganar poder, Bayezid cree que debería crear más cazadores [ghoul|E] como él.\n\n#bold Calomena, la hermana de Caín, desea la destrucción de sus vástagos no-muertos y tú eres su instrumento.#!"
 
 bm_1230_warofprinces_sub_ventrue: "Clan Ventrue" 
 bm_1230_warofprinces_sub_ventrue_desc: "Los autoproclamados gobernantes del mundo Cainita, los Ventrue son los señores y damas regios de la noche. Han sido durante mucho tiempo uno de los linajes de vampiros más orgullosos, trabajando duro para mantener una reputación de honor, comportamiento gentil y liderazgo. Un sentido de noblesse oblige ha impregnado durante mucho tiempo al Clan, acompañado de la creencia genuina de que los Ventrue saben lo que es mejor para todos.\nUna reciente serie de reveses ha plagado a la Sangre Azul con la caída de Roma y la pérdida de Francia como uno de sus bastiones. Aún así, el Clan Ventrue gobierna la noche medieval. Como debe ser.\n\n#bold El dominio del Clan Ventrue no es negociable. Haz que aprendan.#!" 
 bookmark_warofprinces_alexander: "Alejandro"
 bookmark_warofprinces_alexander_desc: "Después de más de un milenio como el gobernante absoluto de Francia, Alejandro lo perdió todo ante una conspiración liderada por su propio vástago, Geoffrey du Temple. Ahora exiliado como un huésped rechazado de la Cruz Negra, el poderoso Metusalah está planeando su regreso. Casi no tiene nada a su nombre, excepto su impresionante poder personal y legitimidad... que cuenta poco en el gran esquema de las cosas. Es casi un nuevo comienzo para el que fuera todopoderoso vástago de Ventrue.\n\n#bold ¿Podrás hacer que Geoffrey y Salianna paguen por su traición y recuperar tu legítimo trono... o crear un nuevo legado en estas tierras orientales?#!"
 bookmark_warofprinces_camilla: "Camila"
 bookmark_warofprinces_camilla_desc: "Tito Venturus Camille mantuvo Roma durante la mayor parte de su gloriosa historia, siendo, posiblemente, el $pod_cainite$ políticamente más importante de la Antigüedad. Camila es una figura divisiva en la historia de los Ventrue, famosa por su perspicacia política y su glorioso liderazgo de su imperio más poderoso, pero también rechazada por haber fundado el Sendero del Pecado, un código de moralidad demasiado... decadente para la mayoría de los gustos Ventrue.\nA pesar de sus críticos, Camila famosamente reunió a su $pod_clan$ para hacer la guerra y destruir Cartago y aún es alabado por este logro hasta esta noche. Su caída en $pod_torpor$ terminó los días de gloria de Roma y presagió la Larga Noche donde el poder del $pod_clan$ Ventrue disminuyó considerablemente.\n\n#bold Habiendo despertado recientemente a un mundo extraño, ¿te levantarás para gobernar una vez más todo el mundo $pod_cainite$ para la gloria de una Roma vibrante y decadente?#!"
 bookmark_warofprinces_hardestadt: "Hardestadt"
 bookmark_warofprinces_hardestadt_desc: "Hardestadt es el primero de una nueva generación de líderes Ventrue mejor acostumbrados al mundo medieval que sus ancianos romanos. Proveniente de un linaje oscuro con pocos activos, el señor de la guerra bávaro utilizó expertamente el ascenso del Sacro Imperio Romano Germánico mortal para desplazar el centro de gravedad de los Ventrue de Roma a Alemania, cementando su influencia sobre sus hermanos en el proceso.\nHardestadt ha conocido muy pocos reveses desde su ascenso al poder, pero aún hay asuntos por resolver, como los tercos romanos bajo Julia Antasia...\n\n#bold Tienes un reino poderoso e influyentes vástagos y aliados a tu disposición. Deshazte de los vestigios de Roma y definirás lo que significa ser un Ventrue durante siglos.#!"
 bookmark_warofprinces_antasia: "Julia Antasia"
 bookmark_warofprinces_antasia_desc: "La hija de la República Romana es una Ventrue de otra época, una en la que su $pod_clan$ era el guardián del Senado Eterno, una utopía en el despiadado mundo de los $pod_cainites$. Era el mundo perfecto de Julia, cada Ventrue tenía derecho a hablar y el poder de voto era independiente de la edad o el sexo. Las leyes del senado se convertirían en las tradiciones del $pod_clan$ para el próximo milenio... Entonces, llegaron Camila y su locura decadente, seguidos de Hardestadt y su despiadada ambición.\nDesde su principado en Frankfurt, Julia no ha perdido la esperanza de devolver a su $pod_clan$ a sus raíces. El idealismo aún podría ser un camino para el futuro del $pod_clan$ Ventrue.\n\n#bold No puedes dejar que Hardestadt, o peor, Camila, dicten el futuro del $pod_clan$ Ventrue. ¡Debes luchar por el Senado y la República!#!"
 bookmark_warofprinces_jurgen: "Jürgen von Verden"
 bookmark_warofprinces_jurgen_desc: "El renombrado caballero alemán es la mano derecha de Hardestadt y, a pesar de su juventud, ya ha hecho conocido su nombre en todas partes. Un gobernante estricto, pero justo, de Magdeburgo, Jürgen es el perfecto caballero Ventrue, valiente y despiadadamente ambicioso al mismo tiempo.\nJürgen recientemente hizo la guerra contra el Voivodato Tzimisce y forzó la creación de un estado tapón. Pero esto no es suficiente y ya está planeando su próxima ofensiva... tan pronto como pueda deshacerse de Alejandro, el engorroso príncipe exiliado de Francia.\n\n#bold Tu honor es tu palabra, y ese es el único límite que sufrirás para tu ambición. A fuego y espada, mediante conquistas y diplomacia, el $pod_clan$ Ventrue se postrará ante ti algún día.#!"
 bookmark_warofprinces_anna: "Ana Comneno"
 bookmark_warofprinces_anna_desc: "Princesa bizantina, a Ana Comneno se le negó su derecho de nacimiento durante su vida... y por segunda vez durante su no-muerte. Mientras ascendía en la estructura de poder de la Constantinopla no-muerta, ocurrió la 4ª Cruzada, rompiendo cualquier atisbo de cordura en la Ciudad del Deseo del Mundo. Pero Ana es una conspiradora paciente y cuidadosa y logró asegurar el reino sucesor bizantino más poderoso, Nicea, como su dominio. No le importan los sueños y la utopía pasados de Constantinopla, lo que la ha distanciado de muchos otros supervivientes griegos, pero no dejará que eso la detenga en su objetivo. No otra vez.\n\n#bold Constantinopla finalmente está a la vista. Que nadie se interponga en tu destino y finalmente será tuyo.#!"
 bookmark_warofprinces_anadja: "Anadja"
 bookmark_warofprinces_anadja_desc: "Hija de un mercader persa, Anadja estaba destinada a una vida sin importancia hasta que el renombrado Belisario y Shabah sintieron cariño por ella, criándola como su propio vástago. Con mentores tan impresionantes, Anadja se adaptó rápidamente al mundo $pod_cainite$ y pronto fue notada por un culto secreto que la veía como su salvadora prometida.\nDesde entonces, Anadja se ha convertido en el vampiro más influyente de Armenia y aún recibe la mentoría de sus dos 'padres' y del culto. Ahora es lo suficientemente mayor para gobernar por sí misma y solo el tiempo dirá si estará a la altura de las elevadas expectativas puestas en ella.\n\n#bold Has sido preparada expertamente para este momento. Es hora de escribir tu propia historia y el final solo tú puedes contarlo.#!"
 bookmark_warofprinces_vencel: "Vencel Rikard"
 bookmark_warofprinces_vencel_desc: "Producto de una educación caballeresca cristiana, Vencel llegó a Budapest cuando el rey Géza invitó a un contingente de caballeros bávaros para que fueran su guardia personal. [Glossary('Embraced','game_concept_Embrace_desc')] por Bulscu como recompensa por su excelente servicio, la principal preocupación de Vencel es mantener su posición, maximizar sus intereses mercantiles y mantener la paz en una ciudad que rápidamente podría convertirse en un campo de batalla.\nTemiendo el descenso de Bulscu a la depravación y luego al $pod_torpor$, Vencel sigue siendo un hombre de honor incluso en la no-muerte y respeta a su [Glossary('Sire','game_concept_Sire_desc')] por el hombre que una vez fue. Ahora intenta mantener un equilibrio entre protegerlo de sus muchos enemigos y gobernar su ciudad con justicia.\n\n#bold Tienes dos deberes, Budapest y Bulscu, y tienes la intención de cumplir ambos.#!"
 bookmark_warofprinces_fabrizio: "Fabrizio Ulfila"
 bookmark_warofprinces_fabrizio_desc: "Fabrizio Ulfila ha estado presente desde las primeras noches del cristianismo en la Antigua Roma. En vida, fue discípulo del obispo Eusebio de Nicomedia y, como su maestro, Ulfila había sido defensor de la herejía arriana. En la muerte, se convirtió en uno de los miembros más influyentes de los Eclesiásticos, la facción de Ventrue que creía que el poder residía en la Iglesia.\nAunque la Iglesia ha sido un campo de batalla para las conspiraciones $pod_cainite$ durante siglos, Fabrizio ha sobrevivido a todas ellas y ha salido victorioso. Su objetivo a largo plazo es expandir su influencia en la Iglesia e Italia tanto como sea posible, una perspectiva que de repente se ha vuelto difícil con el despertar de Camila.\n\n#bold ¡Reafirma tu control sobre Roma y utiliza el poder del cristianismo para tu propio beneficio, 'Cardenal' Ulfila!#!"
      
 vampire_main_sub_bookmark: "Principal"
 ventrue_sub_bookmark: "Ventrue"
 lasombra_sub_bookmark: "Lasombra" 

 exit_char_window: "Volver"
 
 bm_1230_warofprinces_sub_lasombra: "Clan Lasombra" 
 bm_1230_warofprinces_sub_lasombra_desc: "Depredadores sombríos y escaladores sociales despiadados, los Lasombra existen para su propio éxito, luchando por victorias personales en lugar de únicamente por una corona que llevar o un trono en el que sentarse. Creen que la fuerza es el derecho, y están dispuestos a sacrificar cualquier cosa para lograr sus objetivos.\nUn Clan que usa la espiritualidad como herramienta en lugar de buscar la iluminación honesta, sus lealtades volubles están actualmente resaltadas por la guerra civil masiva que azota el Mar de Sombras, su antiguo imperio que se extendía por el Mediterráneo. Los musulmanes luchan contra los cristianos en Iberia, los cristianos luchan contra herejes en Italia y los jóvenes luchan contra sus mayores en todas partes a la vez. Los otros clanes suspiran de alivio mientras los Lasombra se desgarran, sabiendo lo que podrían lograr si se unificaran.\n\n#bold El Clan Lasombra será forjado de nuevo en su propia sangre. Derramarla y conquistar.#!" 
 bookmark_warofprinces_lucita: "Lucita de Aragón"
 bookmark_warofprinces_lucita_desc: "Hija del rey Alfonso II de Aragón, Lucita siempre anheló autonomía y libertad desde muy joven. Su feroz independencia y voluntad indomable fueron irresistibles para el poderoso Cardenal Lasombra Ambrosio Luis Moncada y él la abrazó. Desde entonces, Lucita ha sido la estrella ascendente del $pod_clan$ Lasombra y el orgullo de su [Glossary('Sire','game_concept_Sire_desc')]. A pesar de los elogios que recibe y los muchos logros que ya ha realizado, la feroz princesa ya está anhelando, una vez más, más libertad... algo que va en contra de los deseos tanto de su [Glossary('Sire','game_concept_Sire_desc')] como de su $pod_clan$.\n\n#bold Nadie puede enjaularte por mucho tiempo, Lucita. Gana tu independencia, aunque tengas que quemar a todo tu $pod_clan$ por ello.#!"
 bookmark_warofprinces_moncada: "Ambrosio Luis Moncada"
 bookmark_warofprinces_moncada_desc: "Hombre de ambición, talento y fe, Ambrosio Luis Moncada fue Arzobispo de Madrid en vida. Para asombro de nadie, Moncada aprovechó al máximo su posición. Para sorpresa de muchos, sin embargo, lo hizo manteniéndose en un estricto monasticismo. Era absoluto en su fe, inquebrantable en su convicción y resuelto en el uso del poder para lo que consideraba las causas del Cielo. El $pod_Embrace$ cambió a Moncada menos de lo que uno podría suponer. Rápidamente se convirtió en la principal fuerza impulsora detrás de la Reconquista en la Sombra y su influencia dentro del $pod_clan$ Lasombra está aumentando constantemente, pero sus razones para buscar el poder no han cambiado. No es para la gloria de Moncada (esa pobre cáscara carnal), sino más bien para la gloria de Dios.\n\n#bold Estás destinado a gobernar Iberia y al propio $pod_clan$ Lasombra. Dios te eligió para su santa tarea y cumplirás con Su voluntad, como siempre haces.#!"
 bookmark_warofprinces_badr: "Badr"
 bookmark_warofprinces_badr_desc: "Mientras la guerra civil de los Lasombra ibéricos se intensifica, los $pod_cainites$ andaluces, conocidos como [Glossary('Ashirra','game_concept_ashirra_desc')], han encontrado un nuevo líder: Badr de Granada. Este misterioso Sultán ha adoptado una postura firme y está reuniendo a las dispares Taifas bajo su causa. Su esfuerzo ha dividido a la comunidad [Glossary('Ashirra','game_concept_ashirra_desc')], ya que muchos la ven como poco mejor que los cristianos, pero aún así ha logrado ralentizar la temida Reconquista. A medida que su fama crece, algunos comienzan a interesarse por los misterios que la rodean... y unos pocos de esas almas curiosas ya han encontrado un doloroso final. Badr gobierna con un sombrío puño de hierro, pero un puño de hierro al fin y al cabo.\n\n#bold Debes triunfar contra la Reconquista. Esto es un trampolín para tu ambición, y ay de aquellos que se interpongan en tu camino.#!"
 bookmark_warofprinces_lucius: "Lucio Elio Sejano"
 bookmark_warofprinces_lucius_desc: "Antiguo pretoriano de Roma, Lucio Elio Sejano casi llegó a ser Emperador, pero fue frustrado antes de poder lograr su ambición. Muriendo en las orillas del Tíber, el lugar donde una loba supuestamente descubrió a Rómulo y Remo, un Lasombra sacó el cuerpo de Sejano de las corrientes. Descubriendo que las últimas brasas de la vida aún brillaban dentro de su pecho, el anciano lo Abrazó. Ella lo dejó con estas palabras: 'Gobernarás de nuevo, como siempre estabas destinado a hacer. Destruye a los señores que intentaron combatirte. Tienes el potencial de volverte más grande que tu maestro. Úsalo sabiamente'. Desde entonces, el que fuera Emperador ahora busca convertirse en Emperador de la Noche, y sus primeros movimientos en este gran juego se acercan...\n\n#bold Una noche, empuñarás el poder para amenazar al más poderoso de tu especie. Asegúrate de que tu verdadero destino no sea truncado esta vez.#!"
 bookmark_warofprinces_gratiano: "Gratiano de Veronese"
 bookmark_warofprinces_gratiano_desc: "El último, y aún muy joven, vástago del mismísimo Lasombra, Gratiano de Veronese fue un noble italiano sin importancia en vida, lo que lleva a muchos a preguntarse por qué el [Glossary('Antediluvian','game_concept_antediluvian_desc')] lo favoreció tanto. Gratiano sabe la respuesta, sin embargo: su propia grandeza inherente. Convenciéndose de su importancia, el Veronés ahora está visiblemente irritado contra su 'hermano mayor' Montano, el actual regente del $pod_clan$ Lasombra. Desde su corte en Verona, Gratiano es muy consciente de que es despreciado y objeto de burlas por todos excepto por los más jóvenes de su propio $pod_clan$. Pero incluso una base de poder tan pequeña y débil puede crecer con el tiempo y una noche, Gratiano podría ser el que se ría de todos ellos...\n\n#bold Debes ganarte el respeto y el poder rápidamente si quieres desafiar a tu 'hermano' por su título. Entonces, podría ser el momento de hablar con tu propio 'padre'...#!"
 bookmark_warofprinces_alfonzo: "Alfonzo de Venecia"
 bookmark_warofprinces_alfonzo_desc: "Uno de los vástagos más dotados del influyente Narsés, Alfonzo de Venecia ha sido el $pod_cainite$ latino más prominente en Constantinopla durante más de dos siglos. Conocido por haber instigado los Disturbios Latinos de 1185, Alfonzo también utilizó la 4ª Cruzada para proclamarse Príncipe de la arruinada Ciudad del Deseo del Mundo, ganándole un gran poder... y la eterna enemistad de los muchos $pod_cainites$ griegos exiliados. Nominalmente seguidor de la Herejía $pod_cainite$ como lo fue su [Glossary('Sire','game_concept_Sire_desc')], Alfonzo es ante todo un pragmático insensible, y ya ha jurado lealtad al Mar de Sombras para asegurar su poder, a pesar de sus puntos de vista opuestos sobre su fe. Puede que se necesiten muchos más pactos con el diablo en el futuro, sin embargo...\n\n#bold Has trabajado incansablemente para asegurar el mayor premio. Nadie te quitará Constantinopla.#!"
 bookmark_warofprinces_suleiman: "Suleiman ibn Abdullah"
 bookmark_warofprinces_suleiman_desc: "Suleiman se acercó por primera vez a Mahoma en Medina para convertirlo en un peón que usara contra los poderosos $pod_cainites$ de La Meca. Él mismo contó que en ese momento vio la posibilidad de salvación en él y se sometió a la nueva religión que el Profeta difundía. Más tarde, estuvo a su lado durante sus conquistas y fue uno de los principales fundadores de la secta [Glossary('Ashirra','game_concept_ashirra_desc')], dando la bienvenida a cualquier musulmán abrazado y dispuesto a seguir la palabra. Su trabajo ha sido mayoritariamente exitoso hasta ahora, con los [Glossary('Ashirra','game_concept_ashirra_desc')] extendiéndose desde Iberia hasta Persia, pero comienzan a formarse grietas en su aparente unidad. Suleiman debe actuar rápidamente antes de que esta temprana desunión debilite su obra de vida a un nivel peligroso.\n\n#bold Mantén fuertes y unidos a los [Glossary('Ashirra','game_concept_ashirra_desc')], y quizás el propio $pod_clan$ Lasombra pueda aprender la verdad una noche.#!"
 bookmark_warofprinces_guilelmo: "Guilelmo Aliprando"
 bookmark_warofprinces_guilelmo_desc: "Narsés, Príncipe de Venecia y Arzobispo de Nod, abrazó a Guilelmo por sus obvias habilidades como diplomático y negociador. En consecuencia, fue la 'cara pública' del príncipe de Venecia.\nTras la Cuarta Cruzada, comenzó a sospechar que la dedicación de Narsés a la Iglesia de Caín no era sincera. Aliándose con Nikita de Sredetz, convocó una Corte de Sangre y se le concedió el derecho de [Glossary('Diablerize','game_concept_diablerie_desc')] a su [Glossary('Sire','game_concept_Sire_desc')]. Desde entonces, ha tomado suavemente las riendas del poder dejadas por Narsés, y tiene como principal preocupación explotar el nuevo territorio veneciano en el desmoronado Imperio Bizantino. Desafortunadamente, eso lo está volviendo ciego a amenazas más cercanas, ya que la creciente Inquisición y la familia Giovanni observan con avidez la debilitada estructura de poder de la Venecia Vampírica.\n\n#bold Puede que seas el último verdadero creyente de la Iglesia de Caín. ¿Será suficiente tu fe en los difíciles tiempos que se avecinan?#!"
 bookmark_warofprinces_fatimaallama: "Fatimah al-Lam'a"
 bookmark_warofprinces_fatimaallama_desc: "Fatimah conoció a su futuro [Glossary('Sire','game_concept_Sire_desc')] en Túnez, donde la observó desde las sombras mientras se convertía en mujer y se enamoró de ella. Cuando Sharif se mudó al sur, llevó a Fatimah con él. Desde entonces, la dotada vástago ha aprendido mucho sobre su nueva condición y la política vampírica. Notada por el liderazgo del $pod_clan$ Lasombra, a Fatimah se le ha asignado recientemente su primera misión: asegurar Mogadiscio para su $pod_clan$. Una tarea difícil, ya que muchos de sus compañeros de clan han fracasado en reclamar la ciudad de las perlas.\n\n#bold Esta es tu primera misión real y es prestigiosa. Demuestra que el potencial visto en ti era realmente real.#!"
             
 toreador_sub_bookmark: "Toreador"         
       
 bm_1230_warofprinces_sub_toreador: "Clan Toreador" 
 bm_1230_warofprinces_sub_toreador_desc: "Los Toreador son un clan de vampiros conocidos por ser algunos de los más bellos, sensuales, seductores, emocionales y glamorosos de los Kindred. Los Estetas son responsables de las leyendas de vampiros que seducen y atraen a sus presas con belleza, amor y sensualidad.\nNo rehúyen el arte de gobernar tampoco y fueron, hasta muy recientemente, titulares del poder en el posiblemente más grande imperio vampírico, el Sueño de Constantinopla. Su caída ha sacudido al Clan, pero una oportuna toma de poder en Francia significa que los Toreador tienen un nuevo, aunque aún frágil, bastión. Además de Francia, los Toreador ocupan posiciones de poder menores en toda Europa y Oriente Medio, y siguen siendo una de las principales fuerzas impulsoras en el mundo Cainita.\n\n#bold La noche necesita un nuevo gobernante, grácil pero mortal. Muestra al mundo que las Rosas tienen espinas.#!" 
 bookmark_warofprinces_salianna: "Salianna"
 bookmark_warofprinces_salianna_desc: "Nacida en Grecia alrededor del 170 a. C., Salianna era vestal de los antiguos Dioses y nunca perdonó a su [Glossary('Sire','game_concept_Sire_desc')], el poderoso Miguel, por su profanación espiritual de su pureza. Negándose a ayudarlo en sus locos sueños de inmortalidad, se aventuró por su cuenta, pero solo conoció la traición y el engaño durante varios siglos antes de establecerse en París. Finalmente encontró el éxito aquí y trabajó para hacer prosperar a Francia junto a Alejandro, su señor vampírico.\nY luego fue traicionada de nuevo, ya que Alejandro mató a su propio amado vástago en un ataque de furia. Fue la gota que colmó el vaso. Orquestó un golpe de estado con la ayuda del propio vástago de Alejandro y expulsó a los Ventrue de Francia. Ahora Salianna es el verdadero poder en la región, pero su control aún es débil... y Alejandro no está muerto.\n\n#bold Consolida tu nuevo poder rápidamente. Nadie podrá traicionarte nunca más.#!"
 bookmark_warofprinces_isouda: "Isouda de Blaise"
 bookmark_warofprinces_isouda_desc: "A Isouda nunca le gustó el destino que le habían preparado como hija de la nobleza menor. Lo odiaba tanto que mordió ferozmente a un posible pretendiente para asegurarse de que entendiera su punto. Isouda no cambió mucho al convertirse en $pod_cainite$, su gracia y belleza apenas ocultaban una agresividad y crueldad casi feroces... que le permitieron asegurar el poder como Reina del Amor mucho antes de lo que su corta edad debería permitir. Pero es una ambición demasiado pequeña para Isouda, y pretende usar el precario control de Salianna sobre Francia para promover sus propios fines. La Reina de Anjou no es una Rosa con espinas, es una Rosa con dientes afilados.\n\n#bold Por fuera eres hermosa, grácil, incluso agradable. Por dentro... sabes que todos son peones para ser usados y desechados a tu antojo. Tu sangriento ascenso apenas comienza.#!"
 bookmark_warofprinces_esclarmonde: "Esclarmonde"
 bookmark_warofprinces_esclarmonde_desc: "Una vez, la corte de Esclarmonde fue un centro de poesía, amor y artes. Bajo su paciente guía, Occitania se había desarrollado como un bastión de tolerancia y cultura.\nEntonces llegaron los brutales franceses. Esperaban que Esclarmonde se doblegara rápidamente ante el embate de la Cruzada Albigense, pero se sorprendieron al descubrir en ella una defensora firme y una política capaz. La región ha sufrido mucho, y Esclarmonde ha tenido que hacer muchas concesiones con los 'Cruzados' para sobrevivir. Pero ella sigue aquí, y mientras ella esté, Occitania perdurará.\n\n#bold Has tenido tiempo de reagruparte y forjar nuevas alianzas, pero los arrogantes franceses no te subestimarán de nuevo. Debes mantenerte firme y salvar a tu amado país, porque nadie más puede hacerlo.#!"
 bookmark_warofprinces_melinda: "Melinda Galbraith"
 bookmark_warofprinces_melinda_desc: "El pasado de Melinda está envuelto en misterio, siendo lo único que se sabe con certeza que nació en España antes de ser secuestrada por Helena. Incluso para los métodos usualmente insensibles del $pod_Embrace$ de la Metusalah, el de Melinda fue un asunto sórdido y cruel antes de que Helena se aburriera y la dejara sola para valerse por sí misma. La Melinda que surgió del crisol del 'cuidado' de Helena fue una superviviente despiadada, sin consideración por nada más que sus propias ambiciones. Un verdadero depredador está ahora suelto en Iberia, y si tiene que dejar un montón de cadáveres a su paso para ascender, que así sea.\n\n#bold Has aprendido mucho de Helena y sabes la verdad: este mundo es un campo de batalla sangriento donde solo unos pocos pueden prosperar. Tú serás uno de esos.#!"
 bookmark_warofprinces_rafael: "Rafael de Corazon"
 bookmark_warofprinces_rafael_desc: "Tomado por la Iglesia a una edad temprana, Rafael rápidamente encontró su talento para las pequeñas intrigas. No muy hábil ni ferviente, sin embargo, utilizó sus maquinaciones para ganar algo de influencia sobre los monjes locales y vivir una vida cómoda. Entonces, una noche, llegó Callisti y Castillo. Esta bruja pagana se enamoró de una de las esculturas de los monjes... una que Rafael había acreditado como propia. Así que lo Abrazó y le pidió que hiciera más de ese arte, algo que el estafador era obviamente incapaz de hacer. Enfadada, casi lo mata en el acto hasta que Rafael suplicó por su no-muerte diciendo que su engaño era una forma de arte después de todo. Divertida, Callisti cedió y lo dejó para que se valiera por sí mismo en el mundo $pod_cainite$.\n\n#bold No tienes idea de cómo demonios sobreviviste, pero lo hiciste. Ahora necesitas entender este extraño mundo nuevo. ¿Quizás hay otros tontos a los que engañar para que te enseñen más?#!"
 bookmark_warofprinces_karl: "Karl el Azul"
 bookmark_warofprinces_karl_desc: "Como cuentista nórdico, Karl viajó al sur con Björn Ragnarsson en busca de riquezas y aventuras, y fue Abrazado en Alejandría por un Toreador incrédulo. Después de un tiempo con su [Glossary('Sire','game_concept_Sire_desc')] aprendiendo las historias de los árabes, Karl regresó a casa, usando su existencia interminable para catalogar todas las historias de la tradición nórdica. Cuando llegaron los cristianos, Karl luchó duro, pero pronto vio la escritura en la pared. Como tal, se mudó a Finlandia para crear el 'Estado Libre', un último bastión donde sus queridas historias se mantienen vivas... pero incluso en esta tierra remota, la sombra de la Cruz está creciendo.\n\n#bold Luchas por una causa más grande que tú mismo, y defenderás el legado de tu pueblo mientras puedas. Pero sabes cómo terminan la mayoría de las historias nórdicas...#!"
 bookmark_warofprinces_rosamund: "Rosamund de Islington"
 bookmark_warofprinces_rosamund_desc: "Rosamund ha sido preparada para la grandeza desde su nacimiento como hija de un noble normando menor. Elegida a una edad temprana para unirse a la corte de Isouda de Blaise, Rosamund prosperó en ella. Aprendió a parecer modesta y coqueta, a combatir con su ingenio y a encantar con su sonrisa. En su decimoséptimo cumpleaños, fue llamada a la presencia de Isouda y felicitada. Entonces su señora le contó su destino: ser iniciada en las filas de los $pod_cainites$. Desde entonces, Rosamund ha cautivado al propio Alejandro, el poderoso gobernante Ventrue de la Gran Corte, y él la llevó consigo a su exilio en Magdeburgo. El opresivo Metusalah se está volviendo cada vez más desquiciado cada noche, y Rosamund busca cualquier escape que pueda encontrar...\n\n#bold Debes liberarte de Alejandro antes de que sea demasiado tarde. Quizás el apuesto señor de Magdeburgo, Jürgen von Verden, pueda ayudar.#!"
 bookmark_warofprinces_darshuf: "Darshuf"
 bookmark_warofprinces_darshuf_desc: "La historia de Darshuf está escrita en traición. Traicionó a su [Glossary('Sire','game_concept_Sire_desc')] y le quitó Damasco durante el auge del Islam, luego cayó ante las insidiosas susurros del infernalista Annazir. Darshuf sabe que su alma está perdida hace tiempo y que Damasco está perdida con ella, ya que no tiene el poder ni la voluntad para oponerse a los Baali.\nHay una última cosa que Darshuf quiere hacer antes de caer en el olvido y es salvar a su querido vástago Mannal. La ha estado protegiendo hasta ahora de los horrores de Damasco y está decidido a asegurarse de que este último rayo de luz no se apague.\n\n#bold Tú, tu alma y tu ciudad están perdidas. Pero Mannal no. Pase lo que pase, debes salvarla de los horrores en los que has caído.#!"
 bookmark_warofprinces_shamit: "Shamit ibn Yasir"
 bookmark_warofprinces_shamit_desc: "Recientemente empoderado por la desaparición de su [Glossary('Sire','game_concept_Sire_desc')], Abd al-Haqq, Shamit está saboreando la dulce libertad después de siglos de vínculo de sangre. Y sabe bien. Tanto que no tiene intención de renunciar a su Principado una vez que su [Glossary('Sire','game_concept_Sire_desc')] regrese.\nUn administrador extraordinariamente capaz, está capitalizando los recursos de la ciudad y su bullicioso puerto para hacerse un lugar.\nCada noche sin su [Glossary('Sire','game_concept_Sire_desc')] es una noche más en la que Shamit consolida su posición y afirma su recién encontrada independencia con bravuconería.\n\n#bold Adén es tuya. El Yemen pronto será tuyo. Nunca más serás restringido.#!"
                      
 brujah_sub_bookmark: "Brujah"         
       
 bm_1230_warofprinces_sub_brujah: "Clan Brujah" 
 bm_1230_warofprinces_sub_brujah_desc: "Un clan de eruditos guerreros conocidos por su feroz devoción a filosofías radicales. Los Brujah a menudo entrenan a sus neonatos en combate y en los clásicos con igual disciplina. Durante la era Clásica, eran iguales a los Ventrue, ostentando grandes posiciones de poder en todo el Mediterráneo. Entonces, su utopía de Cartago fue destruida por los odiados romanos. Ahora el Clan es uno caído, aún llorando la muerte de su paraíso y decayendo desde su era de gobernantes benévolos a los rebeldes mezquinos que se están volviendo más comunes esta noche.\nAbrumados por su ira y tristeza, los Brujah están arremetiendo contra causas perdidas hasta que finalmente puedan encontrar su nuevo destino. Algunos ancianos temen que nunca suceda.\n\n#bold El Clan Brujah está en transición entre su glorioso pasado y un futuro desconocido. Grandes líderes como tú podrían ser la chispa que definirá quiénes serán durante siglos.#!" 
 bookmark_warofprinces_bjorn: "Björn Garinson"
 bookmark_warofprinces_bjorn_desc: "Este temible gigante es uno de los últimos [Glossary('Einherjar','game_concept_einherjar_desc')] - vampiros vikingos - de las Islas Británicas. Varado en Escocia mientras huía de la batalla perdida que su pueblo libra en Noruega, Björn mira cada vez más al oeste, hacia el Vinland de las leyendas. Pero su carisma y su fuerza tranquila lo han convertido en el punto de reunión de facto de la resistencia contra Mitras en el país. A pesar de su falta de voluntad para luchar en otra batalla perdida, Björn nunca abandona a sus amigos y tomará su hacha con gusto por ellos una vez más.\n\n#bold Estás acostumbrado a batallas desesperadas. Pero quizás haya esperanza para esta...#!"
 bookmark_warofprinces_leeland: "Robin Leeland"
 bookmark_warofprinces_leeland_desc: "El hombre detrás de la capucha ha luchado contra tiranos toda su vida y no-muerte. Sus rasgos duros y sucios estuvieron presentes en varios levantamientos plebeyos a lo largo de la Edad Media, teniendo una participación directa en varias rebeliones campesinas contra la nobleza inglesa, siendo un firme defensor de las tendencias anarquistas, y luchando a menudo en la vanguardia durante las escaramuzas militares.\nPero por más que lo intentó, nunca pudo vencer a Mitras, el 'Rey-Dios' de Inglaterra. Claramente derrotado en la batalla de la Abadía de Kirklees, el aura y la influencia de Robin se han debilitado considerablemente y Mitras se acerca para matar. La luz de la libertad podría pronto apagarse para siempre en las Islas Británicas.\n\n#bold Tu causa es justa, tu puntería es certera. Puede que no sea suficiente para la victoria, pero lo será para crear una leyenda.#!"
 bookmark_warofprinces_veronique: "Veronique d'Orleans"
 bookmark_warofprinces_veronique_desc: "Veronique d'Orleans es una mujer de muchas habilidades. Es una política capaz entre los $pod_cainites$ de Francia (e incluso más allá), una firme defensora de sus amigos y aliados mortales, una guerrera fuerte, una hábil sanadora y una jugadora, a pesar de su corta edad, en la Guerra de los Príncipes.\nEngendrada por su ecuanimidad y mente innovadora, Veronique siempre está luchando contra lo que la sociedad, sea mortal o vampírica, piensa de ella. Recientemente ha participado en el derrocamiento de Alejandro, el Príncipe de Francia, pero desconfía de la política cortante de París. Como tal, ha regresado a su ciudad natal mientras los $pod_cainites$ franceses se preguntan cuál será su próximo movimiento inesperado.\n\n#bold Mantente fiel a tus ideales y deja que los demás te subestimen. Pronto entenderán que la compasión no es debilidad.#!"
 bookmark_warofprinces_menele: "Menelao"
 bookmark_warofprinces_menele_desc: "Un rey en la antigua Grecia durante el siglo XIII a. C. durante su vida, Menelao estaba asombrado por lo que los $pod_cainites$ de Cartago habían logrado y pronto asumió el papel de diplomático viajero debido a su reputación como poderoso guerrero y orador. Por lo tanto, no estaba en la ciudad cuando llegó la gran traición, a manos de una hermosa Toreador llamada Helena.\nSu legendaria rivalidad comenzó ese día. Han luchado en innumerables campos de batalla y destruido ciudades a su paso, pero aún así, ninguno de los dos ha podido obtener ventaja. Menelao se está cansando de este 'juego', especialmente cuando ve que el $pod_clan$ Brujah se desmorona a su alrededor. Se debe llegar a una conclusión, sea la que sea.\n\n#bold Tu ira finalmente se está apagando, pero Helena aún debe ser llevada ante la justicia. Entonces, podría ser el momento de curar al $pod_clan$ Brujah.#!"
 bookmark_warofprinces_ecaterina: "Ecaterina"
 bookmark_warofprinces_ecaterina_desc: "Una mujer de carácter fuerte en un mundo de hombres, Ecaterina apenas sobrevivió a una experiencia de casi violación, rescatada por su futuro [Glossary('Sire','game_concept_Sire_desc')] en el último momento. Cautivada por sus historias sobre Cartago y la utopía de una coexistencia pacífica entre todos, se convirtió en una ferviente Prometeica. Demasiado joven para ser realmente influyente, pronto creó una identidad falsa para sí misma como superviviente de la destrucción de Cartago, ganándose un gran respeto y fama.\nSu movimiento más reciente ha sido el $pod_Embrace$ de una perspectiva muy prometedora, Christof Romuald, quien ya ha ido más allá de lo esperado para obtener su aprobación. Su reciente desaparición después de una lucha apocalíptica contra un poderoso Tzimisce ha puesto una mella en sus planes.\n\n#bold Encuentra a Christof y asegura su apoyo continuo, entonces tu causa estará mucho más cerca de completarse.#!"
 bookmark_warofprinces_yitzhak: "Yitzhak ben Avraham"
 bookmark_warofprinces_yitzhak_desc: "Nacido en Praga como hijo único de un rabino judío, la primera respuesta de Yitzhak a la mayoría de los eventos es de simpatía y cariño, un hecho que fue el catalizador de su $pod_Embrace$, su [Glossary('Sire','game_concept_Sire_desc')] pensó que tal amabilidad debía ser preservada. A pesar del shock que justifica su ahora maldito estado, la muerte de Yitzhak cambió poco su comportamiento y después de algunos años de vagabundeo por Europa, finalmente se estableció en Polonia.\nDurante sus viajes, vio cómo eran tratados los judíos en toda Europa y cuántos vampiros vagaban solos por las noches, marginados de otros por la simple lealtad a su $pod_clan$ o generación. Su deber espiritual es crear un lugar donde todos los seres pudieran existir uno al lado del otro, como Dios había querido.\n\n#bold Polonia podría ser el refugio seguro que siempre soñaste, pero muchos obstáculos aún están en tu camino.#!"
 bookmark_warofprinces_hektor: "Hektor"
 bookmark_warofprinces_hektor_desc: "Engendrado durante la caída de Roma Occidental y el ascenso del estado bizantino, Hektor pasó sus noches como neonato escuchando historias de la gloria griega y cartaginesa. Frustrado por la falta de voluntad de su [Glossary('Sire','game_concept_Sire_desc')] y sus pares para hacer algo realmente sobre el declive del $pod_clan$, Hektor buscó enojado algo que pudiera tomar para dar sentido a su existencia.\nReuniendo a un grupo de jóvenes $pod_cainites$ descontentos, Hektor organizó con éxito una rebelión en el imperio, apoderándose de muchas de las islas del Egeo para crear su nueva Cartago. Ahora sirve como Dictador de este nuevo estado, una extraña construcción de ideales democráticos griegos mixtos y la política y religión cartaginesas.\n\n#bold Tu utopía es aún muy joven, y las decisiones que pronto deberás tomar forjarán su verdadera identidad.#!"
 bookmark_warofprinces_thrax: "Thrax"
 bookmark_warofprinces_thrax_desc: "Thrax era una Brujah residente en Roma durante las Guerras Púnicas. Ella y todos sus hermanos fueron sometidos a varias indignidades y ella optó por irse. Durante sus viajes, encontró el pensamiento gnóstico y halló su teología un consuelo para su alma cansada.\nAhora ha regresado a Roma, para probar su convicción contra el poder de los Ventrue y contra el propio Camila, la ruina de Cartago. El Cónsul Eterno parece más divertido que preocupado por ella hasta ahora, pero esto podría cambiar.\n\n#bold Harás que Camila te respete o te tema. Una vez que Roma sea tuya, guiarás al $pod_clan$ Brujah hacia un nuevo comienzo puro.#!"
 bookmark_warofprinces_caelestius: "Caelestius"
 bookmark_warofprinces_caelestius_desc: "Nadie describiría a Caelestius como un hombre tranquilo o tímido. Un monje discutidor en su juventud, pronto cayó bajo la influencia del hereje Pelagio y lo siguió como su discípulo.\nSu herejía arraigó en Cartago, pero pronto fue atacada por las autoridades clericales locales y Caelestius se negó a retractarse. Fue durante este juicio que atrajo la atención de un Brujah local y fue [Glossary('Embraced','game_concept_Embrace_desc')].\nCaelestius se adaptó rápidamente a su nueva condición y fusionó su inclinación pelagiana con el saber nodista de los Cainitas. Luego declaró audazmente que viajaría al Papa, presentaría sus teorías y recibiría la bendición papal. Este plan loco que resultaría en la última violación de la Mascarada ha sido frustrado una y otra vez por los otros Cainitas, pero el iluso hereje aún no ha sido atrapado.\n\n#bold ¡Ignora las mentes mezquinas que quieren impedirte, solo el Papa puede vindicar tu genio!#!"
                             
 cappadocian_sub_bookmark: "Cappadocio"                            
                          
 bm_1230_warofprinces_sub_cappadocian: "Clan Cappadocio" 
 bm_1230_warofprinces_sub_cappadocian_desc: "Eruditos de la muerte y el alma, los Cappadocios a menudo se centran en ellos mientras ignoran los asuntos más amplios del mundo. Bendecidos con una naturaleza generalmente plácida, están mucho menos preocupados por el gobierno, las puñaladas políticas y otras cuestiones de la vida de los no-muertos.\nHasta hace poco, el Clan Cappadocio solo estaba en una posición de poder en su región homónima, fuera de algunas excepciones. Este hecho ha cambiado con la introducción de la ambiciosa familia veneciana Giovanni en la sangre. Los nigromantes italianos han utilizado en muy poco tiempo su considerable influencia mercantil para convertirse en importantes actores de poder en todo el Mediterráneo.\n\n#bold Con la llegada de los Giovanni, el Clan Cappadocio parece destinado a sufrir, o beneficiarse, de importantes cambios estructurales. Asegúrate de ser el que se beneficia...#!" 
 bookmark_warofprinces_japhet: "Japhet"
 bookmark_warofprinces_japhet_desc: "El líder informal del $pod_clan$ Cappadocio, Japhet es incondicionalmente leal a su [Glossary('Sire','game_concept_Sire_desc')], el propio Cappadocio. Desde su dominio en el Erciyes, la autoridad de Japhet es fuerte, pero las tendencias reclusivas de la mayoría de sus hermanos limitan su poder práctico sobre el $pod_clan$. Peor aún, tiene que colaborar con su excéntrico y a menudo iluso [Glossary('Sire','game_concept_Sire_desc')] y sus visiones de grandeza que a menudo chocan con la perspectiva mucho más pragmática de Japhet.\nTodavía no ha perdonado la introducción de la familia Giovanni en la sangre, a pesar de todas las claras señales de que sería una mala idea. Cada vez más, el hijo fiel piensa que su propio 'padre' podría ser el mayor obstáculo para la prosperidad del $pod_clan$ Cappadocio.\n\n#bold Debes liderar a tu $pod_clan$ en estos tiempos difíciles e intentar mitigar los arranques de delirio de tu [Glossary('Sire','game_concept_Sire_desc')]. Una tarea ingrata, pero que solo tú puedes lograr.#!"
 bookmark_warofprinces_bela: "Bela Rusenko"
 bookmark_warofprinces_bela_desc: "Bien educado en teología durante su vida mortal, Bela nunca se preocupó realmente por asuntos de fe. Su $pod_Embrace$ por un vampiro fervientemente penitente hizo poco para cambiar ese hecho y Bela instantáneamente se deleitó en la gloria de su inmortalidad. Encontró su verdadera vocación cuando el profeta loco, Octavio, le habló de la grandeza de la entidad llamada Kupala.\nRepentinamente consumido por su nuevo objetivo de convertirse en el avatar de esta oscura criatura, Bela logró reclamar Sofía como suya, su primer paso hacia su propia apoteosis. A los ojos externos, Rusenko es un Príncipe excéntrico pero agradable. Para los entendidos, es una de las mayores amenazas para la estabilidad de Europa del Este.\n\n#bold Tú eliges a Kupala, y Kupala te elegirá a ti. Incluso si tienes que sacrificar ciudades enteras para que escuche.#!"
 bookmark_warofprinces_apacia: "Apacia"
 bookmark_warofprinces_apacia_desc: "Escita en vida, Apacia fue entrenada como guerrera y se convirtió en la guardiana de las tumbas de los antiguos reyes, una posición de gran honor. Una de las tumbas era el refugio de un Cappadocio, sin embargo, y pronto fue Abrazada para continuar su deber por la eternidad.\nFinalmente, su talento llegó a ser notado por el propio Cappadocio, quien la hizo su general en el ataque contra la fortaleza de montaña que más tarde se convertiría en Erciyes. Sin embargo, antes de mucho tiempo, los habitantes llegaron a resentir la falta de interés de Apacia en sus estudios y filosofías. De hecho, muchos la consideraban una vergüenza para la sangre del $pod_clan$, ya que se mantuvo obstinadamente analfabeta. Finalmente, se le pidió que se fuera.\n\n#bold Llegaste a Rusia y eres venerada como una Reina en el gélido Kanato de Sibir. Estas personas, tan cercanas a tu amada Escitia en espíritu, han ganado tu corazón y harás todo lo posible por protegerlas.#!"
 bookmark_warofprinces_augustus: "Augusto Giovanni"
 bookmark_warofprinces_augustus_desc: "El líder de la recién Abrazada familia veneciana Giovanni es un despiadado nigromante descendiente de una larga línea de hechiceros romanos. Aunque es un nigromante muy competente, Augusto es más conocido como el Patriarca de la familia, un papel que le ha valido el honor de ser Abrazado por el propio Cappadocio.\nEste hecho le ha granjeado muy pocos amigos entre su nuevo $pod_clan$, la mayoría lo considera un advenedizo listo para traicionarlos en cualquier momento. Ahora inmortal, Augusto ha fortalecido su control sobre su linaje, convirtiéndolos en un ejército bien disciplinado listo para hacer su voluntad. Cuál es exactamente su voluntad es una incógnita...\n\n#bold El alcance de tu familia está creciendo rápidamente, ayudado por el crecimiento de Venecia. Pronto, la utilidad de tu $pod_clan$ benefactor habrá llegado a su fin...#!"
 bookmark_warofprinces_ambrogino: "Ambrogino Giovanni"
 bookmark_warofprinces_ambrogino_desc: "Nacido bastardo de la familia Giovanni, Ambrogino llamó la atención de los ancianos de la familia a través de su maestría necromántica combinada con su ferocidad y pura ambición. Cuando el $pod_clan$ Cappadocio comenzó a Abrazar miembros de la familia, fue uno de los pocos elegidos para el Beso. Como tal, es uno de los muy pocos $pod_cainites$ Giovanni cuya sangre desciende de Cappadocio y no de Augusto Giovanni.\nAunque a menudo se le considera la mano derecha de Augusto, la verdadera pasión de Ambrogino reside en el ocultismo. Su interés por la divinidad le ha llevado a localizar y descifrar innumerables textos y profecías antiguas, pero hasta ahora la verdad se le ha escapado.\n\n#bold La clave de la divinidad debe estar aquí en alguna parte, y no puedes parar hasta encontrarla.#!"
 bookmark_warofprinces_claudius: "Claudio Giovanni"
 bookmark_warofprinces_claudius_desc: "Tanto hijo como vástago de Augusto Giovanni, Claudio fue Abrazado poco después de que su padre fuera aceptado en el $pod_clan$ de la Muerte. Nigromante competente, también es un político capaz y a menudo se le considera la mano derecha de Augusto... cuando este título no se le da a Ambrogino Giovanni, un hecho que ha creado cierta tensión entre los dos.\nClaudio es uno de los pocos que conocen los verdaderos planes de Augusto y ha mostrado una devoción inquebrantable a su padre hasta ahora. Su tarea actual es la supervisión de las crecientes posesiones venecianas en el caído Imperio Bizantino, asegurándose de que la familia emerja victoriosa de este vacío de poder.\n\n#bold Sé diligente en tus nuevos deberes, y quizás puedas finalmente deshacerte de ese molesto Ambrogino de una vez por todas.#!"
 bookmark_warofprinces_markus: "Markus Musa Giovanni"
 bookmark_warofprinces_markus_desc: "Markus Musa Giovanni, el bisnieto más joven de Claudio, fue iniciado en el $pod_clan$ por su agudo sentido de la curiosidad y su agudo intelecto. Una vez [Glossary('Embraced','game_concept_Embrace_desc')], demostró ser un erudito excepcional, y sobre todo un excelente historiador. Se enorgullecía de su linaje como Cappadocio y buscaba demostrar el valor de su familia a los escépticos del $pod_clan$.\nDespués de su primera misión en Constantinopla, Markus se encontró con el poderoso exiliado Lázaro y logró escapar de él mientras reunía información crítica. Estos primeros éxitos lo han convertido en la estrella ascendente de la familia y su nueva misión podría elevarlo aún más.\n\n#bold Eres a la vez un Giovanni y un Cappadocio, y tus dos familias están orgullosas de contarte como uno de sus miembros. ¿Qué podría salir mal?#!"
 bookmark_warofprinces_constancia: "Constancia"
 bookmark_warofprinces_constancia_desc: "Constancia es la Sacerdotisa de los Huesos y la Matrona del Templo de Erciyes, el centro espiritual del $pod_clan$ Cappadocio y hogar del [Glossary('Antediluvian','game_concept_antediluvian_desc')] Cappadocio.\nViajera experimentada, Constancia conoce de primera mano muchas de las amenazas internas que plagan a su clan, desde los ambiciosos Giovanni hasta los engañosos Lazarenos. Con las manos atadas de Japhet por Cappadocio, ella se encarga de salvar a su familia no-muerta de algunas de las pesadillas que vislumbró en sus profecías.\n\n#bold Solo tú ves el terrible futuro que aguarda a los Cappadocios, y solo tú puedes cambiarlo.#!"
 bookmark_warofprinces_lucretia: "Lucrecia Giovanni"
 bookmark_warofprinces_lucretia_desc: "Nacida como una niña problemática, Lucrecia fue confinada a un manicomio temprano en su juventud debido a las voces que escuchaba. Sin embargo, mostró un talento para el ocultismo que la convirtió en un premio codiciado para la recién vampírica familia Giovanni. Claudio casi aseguró su $pod_Embrace$ antes de que Ambrogino ganara la discusión y se le concediera a Lucrecia como su propio vástago.\nFinalmente libre, la joven vampiro rápidamente demostró ser un activo tremendo para las búsquedas ocultas de Ambrogino, pero su celo y determinación esconden una mente torturada que a veces desea la muerte.\n\n#bold Las búsquedas de Ambrogino son las tuyas propias, y son quizás la única forma de calmar las voces por un poco más de tiempo.#!"
                                       
 tzimisce_sub_bookmark: "Tzimisce" 
                                    
 bm_1230_warofprinces_sub_tzimisce: "Clan Tzimisce" 
 bm_1230_warofprinces_sub_tzimisce_desc: "Si alguien llamara a un Tzimisce inhumano y sádico, el Tzimisce probablemente lo felicitaría por su perspicacia, y luego demostraría que su definición mortal de sadismo era ridículamente inadecuada. Un Clan de tradición e historia, han sido los amos de Europa del Este desde que nadie recuerda.\nDesde su hogar en Transilvania, gobiernan sus pequeños feudos abiertamente, sin importarles la opinión o el bienestar del ganado miserable. Los reveses recientes contra los odiados Ventrue y Tremere los han forzado a unificarse bajo un Voivodato mayor. Pero esta nueva cohesión es inestable, ya que no hay honor entre monstruos.\n\n#bold La dominación total es el derecho de nacimiento del Clan Tzimisce, y todos los demás deben entender su lugar: arrastrándose a tus pies y suplicando misericordia. No es que te quede alguna...#!" 
 bookmark_warofprinces_myka: "Myka Vykos"
 bookmark_warofprinces_myka_desc: "Erudito, hedonista, conspirador despiadado... Myka Vykos es todo eso y más. Una vez preparado por los magos Tremere, Myka se convirtió en un valioso erudito Obertus durante la era del Sueño de Constantinopla. Cuando la Cuarta Cruzada destruyó la ciudad, encontró una nueva fe, una de pasiones implacables, y una nueva habilidad para la política en su hogar adoptivo de los Balcanes.\nSu primer gran logro fue actuar como pacificador entre los Ventrue y su propio $pod_clan$... y asegurar un reino para sus exiliados hermanos griegos como estado tapón en el proceso.\n\n#bold Te has hecho de muchos enemigos con tu truco durante el acuerdo de paz y no te subestimarán otra vez. Prepárate para el ajuste de cuentas que se avecina.#!"
 bookmark_warofprinces_hedeon: "Hedeon Yaroslavich"
 bookmark_warofprinces_hedeon_desc: "Completamente malvado y retorcido, a Hedeon le importa poco más que su propio poder. Considera toda vida humana (y la no-muerte $pod_cainite$) como útil solo en su servicio a él. Los aldeanos cerca de su castillo son tomados para servir como conejillos de indias en varios experimentos viles. Algunos ahora funcionan como trampas sensibles en sus mazmorras o como tabiques vivos en las habitaciones de su fortaleza.\nLa verdadera influencia de Hedeon en Polonia siempre ha sido frenada por sus vecinos (justificadamente aterrorizados), pero el reciente $pod_torpor$ del Príncipe Razkoljna de Cracovia ha abierto nuevas oportunidades...\n\n#bold Eres claramente el mejor ejemplo de lo que debe ser un verdadero Tzimisce. Deja que teman y griten todo lo que quieran mientras asciendes a tu legítimo trono...#!"
 bookmark_warofprinces_razkoljna: "Razkoljna"
 bookmark_warofprinces_razkoljna_desc: "Nacida como hija de un jefe eslavo, el esposo de Razkoljna compartió el beso con ella después de su propio $pod_Embrace$. Pronto se establecieron como los verdaderos líderes de la tribu y se alimentaron de los guerreros más fuertes y mataron a cualquiera que se atreviera a oponérseles.\nCuando llegaron los misioneros cristianos a Polonia, marcó el comienzo de su fin. Su [Glossary('Sire','game_concept_Sire_desc')] cayó bajo las espadas de los invasores, pero Razkoljna logró matar al resto de los atacantes.\nPronto reclamó Cracovia como su dominio y comenzó a fomentar su crecimiento, mientras lograba defenderse de los Ventrue húngaros y de sus propios compañeros de clan.\n\n#bold Has despertado recientemente después de un pequeño período de $pod_torpor$. Este imprevisto contratiempo ha permitido que nuevos poderes ganen influencia en Polonia, algo que debes rectificar tan pronto como sea posible.#!"
 bookmark_warofprinces_shaagra: "Shaagra"
 bookmark_warofprinces_shaagra_desc: "Diosa de la fertilidad, caudillo y chamán de la tribu eslava conocida como los Vroi, Shaagra fue Abrazada por un Tzimisce que apreciaba su inteligencia y determinación. Conquistó en su nombre hasta que cayó en $pod_torpor$ en el siglo VI.\nRecientemente despertada en lo que ahora es Praga, su puro poder y edad le han permitido convertirse rápidamente en la $pod_cainite$ líder en el área una vez más. Aún así, hay nuevos enemigos que luchar y una nueva generación de Tzimisce que aún no conoce su nombre. Las nuevas conquistas de Shaagra apenas comienzan.\n\n#bold Este es un mundo nuevo y extraño para ti, pero algunas cosas nunca cambian. Tu sed de guerra y dominación, por ejemplo...#!"
 bookmark_warofprinces_yorak: "Yorak"
 bookmark_warofprinces_yorak_desc: "Uno de los primeros vástagos del Anciano, Yorak es un devoto koldun y metamorfosista, que busca avanzar en la comprensión de la manipulación de la carne por parte del $pod_clan$. Su obra maestra es la Catedral de Carne, una iglesia-fortaleza desgarradora esculpida a partir de la carne de campesinos, esclavos, rivales, bestias y cualquier otro número de víctimas que fueron incorporadas a los muros pulsantes y supurantes de la estructura.\nAbsorto en su papel como líder espiritual del $pod_clan$ Tzimisce, Yorak no ha estado activo en la escena política por un tiempo, pero el estado actual de los Tzimisce, apenas unidos y bajo asalto, podría obligarlo a revisar su postura pronto.\n\n#bold Todo cambia y mientras las paredes de la Catedral gritan a tu gusto, quizás el propio $pod_clan$ Tzimisce necesite tu 'suave' toque una vez más...#!"
 bookmark_warofprinces_darvag: "Darvag Grozny"
 bookmark_warofprinces_darvag_desc: "En su vida, Darvag era un noble de una tribu eslava en la actual Ucrania. Era un pagano acérrimo y se negó violentamente a convertirse, jurando que arrasaría personalmente la catedral y la ciudad, lo que divirtió a un Anciano Tzimisce que lo Abrazó. Desde entonces, Grozny protege la ciudad de los estragos de todos los demás $pod_cainites$, no por lealtad a Kiev, sino porque quiere destruir la ciudad él mismo.\nDarvag es también un firme aliado de la misteriosa 'Baba Yaga' de fama rusa y cumple diligentemente con los sacrificios (principalmente vivos) con la esperanza de complacer a esta diosa oscura.\n\n#bold Kiev es tuya para quemar y de nadie más. Bajo la atenta mirada de la Abuela, verás cumplida tu venganza.#!"
 bookmark_warofprinces_noriz: "Noriz"
 bookmark_warofprinces_noriz_desc: "Noriz fue una vez considerado Voivoda entre Voivodas (líder político del $pod_clan$ Tzimisce), pero cayó en la decadencia y la disipación, contentándose con subsistir del honor que se le debía como anciano príncipe de la sangre y de historias de sus glorias pasadas. Descubrió de la manera más dura que las glorias pasadas le servían de poco frente a un nuevo enemigo decidido, Vladimir Rustovitch.\nSu objetivo es ascender como la criatura más poderosa de los Cárpatos. Sus rivales lo consideran demente y peligroso, pero no pueden negar la brillantez de las estrategias de guerra de Noriz y la complejidad de sus intrigas y alianzas. Con el reciente revés de Rustovitch contra los Ventrue, algunos temen que el regreso de Noriz a la prominencia sea inevitable...\n\n#bold Rustovitch tropezó. Este es el momento que esperabas para levantarte de tu letargo decadente y darles una lección a todos.#!"
 bookmark_warofprinces_nikita: "Nikita de Sredetz"
 bookmark_warofprinces_nikita_desc: "Exteriormente, Nikita de Sredetz es el celoso Arzobispo de la Iglesia de Caín. Sin embargo, en verdad Nikita lleva mucho tiempo muerto.\nAsesinado y luego suplantado por Dracon, un poderoso Metusalah empeñado en vengarse de la Iglesia por su participación en la caída de Constantinopla, 'Nikita' está ahora socavando la organización desde dentro. Una vez que termine, Dracon podría deshacerse de este disfraz y caminar nuevamente por los Cárpatos. Nadie, quizás ni siquiera él mismo, sabe cuál será su próximo objetivo en este punto.\n\n#bold Todo cambia y decae. Es hora de que la odiada Iglesia de Caín sienta esa verdad.#!"
 bookmark_warofprinces_kartarirya: "Kartarirya"
 bookmark_warofprinces_kartarirya_desc: "En vida, Kartarirya era un guerrero sediento de sangre, renombrado por su inhumanidad y agresividad, por lo que finalmente fue [Glossary('Embraced','game_concept_Embrace_desc')].\nSu [Glossary('Sire','game_concept_Sire_desc')] permitió al guerrero Kartarirya actuar según sus caprichos. Como era de esperar de un metusalah de múltiples brazos que considera toda la India como sus cotos de caza personales, Kartarirya libra guerras constantes desde su escondite en Sri Lanka, usando horribles ghouls moldeados por la carne como sus máquinas de guerra y el terror como su principal arma psicológica.\n\n#bold La guerra y la conquista sangrienta son tus únicos propósitos y la India se ahogará en sangre cuando termines con ella.#!"
 
 assamite_sub_bookmark: "Banu Haqim" 
                                               
 bm_1230_warofprinces_sub_assamite: "Clan Banu Haqim" 
 bm_1230_warofprinces_sub_assamite_desc: "Basados en su fortaleza oculta Alamut en Oriente Medio, los Banu Haqim son tradicionalmente vistos por los Cainitas occidentales como asesinos peligrosos y diableristas, pero en verdad son guardianes, guerreros y eruditos que buscan distanciarse de la Guerra de los Príncipes.\nPresentando la fachada de un Clan unido, los Hijos de Haqim están en realidad profundamente divididos por el faccionalismo. La reciente llegada de un nuevo y divisivo Anciano ha puesto a todos nerviosos. Estos problemas han permitido que nuevos enemigos se introduzcan, principalmente a través de las Cruzadas, en Oriente Medio, que una vez estuvo completamente bajo su control.\n\n#bold Los Banu Haqim podrían ser una fuerza imparable si solo estuvieran unificados. Necesitan a alguien digno del Trono Negro de Haqim. Quizás ese alguien seas tú?#!" 
 bookmark_warofprinces_jamal: "Jamal"
 bookmark_warofprinces_jamal_desc: "A lo largo de las Guerras Santas libradas por Tierra Santa, el nombre de los hashashiyyin es un nombre de temor. De todos los hashashiyyin, ningún nombre es más grande o más terrible que el de Jamal. Musulmán devoto, Jamal es el actual Anciano de los Banu Haqim, el líder de su Casta Guerrero.\nUn general astuto y eficaz, Jamal es conocido principalmente por su formidable destreza en la batalla con su apodo de 'el Invencible'. Hasta ahora, nadie ha podido demostrar lo contrario.\n\n#bold Eres el líder de los Guerreros Banu Haqim y la facción pro-musulmana del $pod_clan$. Ambas son posiciones importantes y responsabilidades difíciles, pero eres un hombre comprometido. Liderarás a los fieles hacia la victoria, dentro y fuera de Alamut.#!"
 bookmark_warofprinces_dastur: "Dastur Anosh"
 bookmark_warofprinces_dastur_desc: "Dastur nació con visiones y fue uno de los magos que se reunieron alrededor de Zoroastro. Se hizo amigo de su futuro [Glossary('Sire','game_concept_Sire_desc')], un erudito, y ambos encontraron una misteriosa reliquia llamada la Piedra del Llanto. Este descubrimiento milagroso no fue del agrado del liderazgo de los Banu Haqim, que los marcó a ambos como herejes y los obligó al exilio.\nSin desanimarse, reunieron a eruditos y luminarias afines que escucharon sus historias sobre Zilah, la que fue convertida en piedra por Caín. Llamándose a sí mismos la 'Tribu Perdida de Alamut', se han visto obligados a guardar secreto después de un ataque directo de los agentes de Banu Haqim que costó la vida al [Glossary('Sire','game_concept_Sire_desc')] de Dastur. Con el actual faccionalismo del $pod_clan$, sin embargo, la Tribu Perdida podría obtener la venganza que tanto anhela.\n\n#bold Debes honrar a tu [Glossary('Sire','game_concept_Sire_desc')] liderando a tu Tribu hacia la supervivencia, si no hacia la victoria total, contra los odiados vástagos de Alamut.#!"
 bookmark_warofprinces_fatima: "Fátima al-Faqadi"
 bookmark_warofprinces_fatima_desc: "Fátima nació en una familia de guerreros moros almohades, que lucharon junto a los Defensores de Alá durante las Cruzadas. Su pasión y habilidad atrajeron la atención de los Banu Haqim. Fue llevada a Alamut, engendrada por el Anciano egipcio Thetmes, y entrenada para convertirse en la asesina definitiva.\nSu primera misión fue asegurarse de que la 4ª Cruzada nunca llegara a las costas de Oriente Medio y fue un éxito rotundo. Alamut ahora espera cosas aún mayores de ella y Fátima tiene la intención de cumplir.\n\n#bold La 4ª Cruzada yace rota, perdida en luchas internas y codicia, pero tu trabajo aún no está completamente terminado. Acaba con sus restos y crea un poderoso estado tapón en Anatolia para proteger a tu $pod_clan$ de futuras invasiones.#!"
 bookmark_warofprinces_alashrad: "Al-Ashrad"
 bookmark_warofprinces_alashrad_desc: "Una vez mago mortal y cazador de demonios, Al-Ashrad estuvo estrechamente aliado con el propio Haqim hasta un incidente que llevó a su $pod_Embrace$. Desde entonces, ha servido como el Amr -jefe hechicero- de los Banu Haqim, luchando en ambas Guerras Baali y en innumerables otras batallas, convirtiéndose en una figura de temor y reverencia en el $pod_clan$.\nEn la compleja red política Haqimita, Al-Ashrad es una figura moderada y lidera su pequeña facción en estos tiempos turbulentos. Su hostilidad solo parece reservada para Thetmes y su Red de Cuchillos, por razones que el maestro hechicero se niega a revelar excepto a sus amigos más cercanos.\n\n#bold Conoces al verdadero demonio en el corazón de todos los problemas de los Banu Haqim. Sus agentes están cerca y debes lidiar con ellos o enfrentarás un destino peor que la destrucción.#!"
 bookmark_warofprinces_nakurtum: "Nakurtum"
 bookmark_warofprinces_nakurtum_desc: "Una de las vástagos más antiguas de Haqim, Nakurtum es la fundadora de la silsila, los historiadores encargados de registrar la historia del $pod_clan$ y mantener su dirección espiritual. Se la consideraba perdida para la historia hasta su inesperado regreso a Alamut en 1214, donde asumió el papel de Anciana, la posición de liderazgo para el $pod_clan$ en su conjunto.\nSu descarada toma de poder, el desprecio por la mayoría de las otras facciones y sus reformas radicales le han granjeado muy pocos amigos y han empeorado el ya inestable estado del $pod_clan$. Muchos ya están conspirando para la llegada de un nuevo Anciano...\n\n#bold Eres la Anciana, estas facciones mezquinas aprenderán a inclinarse ante tu autoridad o serán apartadas. Solo tú eres digno de sentarte en el Trono Negro.#!"
 bookmark_warofprinces_ahmed: "Ahmed ibn Zayyat"
 bookmark_warofprinces_ahmed_desc: "En vida, Ahmed, hijo de Zayyat, había sido un comerciante musulmán y vendedor de aceite. Musulmán por crianza más que por elección, la fe de Ahmed residía más en la moneda todopoderosa. Un Banu Haqim de inclinación religiosa similar lo Abrazó en el 793 y Ahmed sorprendió a todos, incluso a sí mismo, al tomar su aprendizaje con honor y vigilancia.\nComo prueba final, tuvo que infiltrarse en un campamento de cruzados, robar un cierto objeto y asesinar a los guardias. Lo que encontró allí lo cambió por completo, convirtiendo al hombre en un devoto cristiano. Desde entonces ha trabajado incansablemente para encontrar a otros que hayan experimentado la misma revelación y traer la paz a Tierra Santa.\n\n#bold Eres un puente entre cristianos y musulmanes, quizás el único que puede mantener en esta tierra profundamente dividida. Tu tarea es inmensa, pero tu fe es absoluta.#!"
 bookmark_warofprinces_thetmes: "Thetmes"
 bookmark_warofprinces_thetmes_desc: "De mortal, Thetmes era un soldado en el ejército de Ptolomeo luchando contra Cleopatra y sus aliados romanos. Tras su derrota, se probó como un temible gladiador y atrajo la atención de los Banu Haqim, quienes lo Abrazaron. Un orgulloso no creyente, su ascenso en los años posteriores provocó grietas religiosas en el $pod_clan$.\nThetmes lidera la Red de Cuchillos, la facción fanática de asesinos y diableristas a sueldo que conforma la imagen que la mayoría de los forasteros tienen de los Banu Haqim en su conjunto. Sin embargo, en realidad, no es solo un hombre codicioso con hambre de sangre, Thetmes tiene un amo oscuro y poderoso y se asegurará de que todo esté listo para su regreso...\n\n#bold El Pastor Negro aún duerme, así que te corresponde a ti preparar a los Banu Haqim para su glorioso regreso.#!"
 bookmark_warofprinces_enkara: "Enkara"
 bookmark_warofprinces_enkara_desc: "Nacida como esclava en Seleucia del Tigris, Enkara fue elegida por Izhim Tres Veces Bendecido, un renombrado Assamita de la Casta Guerrero. La llamó 'Enkara', que significaba 'arma' en una ahora olvidada lengua sumeria, y pasó ocho siglos forjándola como tal.\nPara el final de la Segunda Guerra Baali ya era una respetada anciana por derecho propio, y después de que su sire desapareciera mientras lideraba una operación militar en Corazín, ella personalmente lideró un destacamento de quince guerreros Assamitas y treinta ghouls a la fortaleza.\nPudo evitar el despertar del demonio, pero tuvo que ver a su amado Izhim ser absorbido por él antes. Desde entonces, busca desesperadamente una manera de salvarlo.\n\n#bold Izhim te lo dio todo. Es hora de devolver el favor.#!"
 bookmark_warofprinces_farnaza: "Farnaza"
 bookmark_warofprinces_farnaza_desc: "La Reina de la Perla Blanca es una gobernante distanciada dejada a su suerte. La devota zoroástrica, habiendo tomado el control de Mogadiscio por una combinación de suerte y errores de sus rivales, observa con cautela la continua ola de inmigrantes musulmanes hacia la ciudad.\nAlamut y el liderazgo de los Banu Haqim no la están vigilando, tanto como una señal de confianza en sus habilidades como como una elección pragmática debido a las distancias involucradas. Como tal, toda la culpa recaerá sobre ella si fracasa. Pero hasta ahora, Farnaza ha caminado por esta cuerda floja con gran habilidad, usando a los musulmanes contra los africanos nativos y a sus rivales entre sí.\n\n#bold Todo va bien en Mogadiscio. Te preguntas si no has bajado la guardia demasiado recientemente. El tiempo lo dirá.#!"
 
 gangrel_sub_bookmark: "Gangrel" 
                                                       
 bm_1230_warofprinces_sub_gangrel: "Clan Gangrel" 
 bm_1230_warofprinces_sub_gangrel_desc: "Nómadas que mantienen lazos más cercanos con los lugares salvajes que la mayoría de sus primos urbanos, los Gangrel también están más cerca del aspecto animal de la Bestia, y a menudo se les describe como primitivos, salvajes o incluso monstruos brutales.\nEl Clan Gangrel tiene un lugar importante en la historia Cainita, como una de las principales fuerzas impulsoras detrás del llamado pueblo 'Bárbaro' de la era clásica. Desde entonces, sin embargo, su fortuna ha disminuido. El crecimiento de las ciudades y la aparentemente imparable marea del cristianismo ha debilitado a su pueblo, que es mayoritariamente de origen pagano. Sin embargo, las estepas aún no están domesticadas, y los Gangrel no son el tipo de vampiros que se rinden sin una última batalla.\n\n#bold Podría ser el último hurra para los no cristianos en Europa, pero harás que sea un hurra digno de ser cantado por generaciones venideras.#!" 
 bookmark_warofprinces_morrow: "Morrow"
 bookmark_warofprinces_morrow_desc: "Siendo una niña huérfana, Morrow fue cultivada como la vástago Gangrel ideal: una vampira solitaria, autosuficiente y con habilidades superiores. Cuando finalmente logró localizar y herir a su posible [Glossary('Sire','game_concept_Sire_desc')] en un mortal juego del gato y el ratón, él la Abrazó.\nDesde entonces, ha ganado una reputación como una feroz guerrera. Esta reputación la ayudó en la búsqueda de reunir a sus compañeros Gangrel. Cree que la única forma de que su $pod_clan$ sobreviva al avance de la civilización es cooperar, así que anima a los Gangrel a formar manadas. Su reciente victoria contra los Ventrue y los Tzimisce ha consolidado su fama como una de las principales caudillas de la guerra del $pod_clan$.\n\n#bold Ves un futuro brillante para los Gangrel unidos. Es hora de hacer realidad este sueño.#!"
 bookmark_warofprinces_viktor: "Viktor"
 bookmark_warofprinces_viktor_desc: "Un Gangrel poderoso e intimidante, Viktor ha sido la mano derecha de la terrorífica Baba Yaga de la leyenda rusa durante siglos. Como el único lo suficientemente confiable para conocer los planes de la 'Abuelita', se le ha confiado ser su regente después de su caída en $pod_torpor$.\nViktor es un fanático sin tolerancia a la falta de respeto hacia su amante, pero también es conocido como un enemigo honorable, alguien que disfruta de una pelea justa y no oculta sus verdaderas intenciones. Ahora tiene que defender su reino contra la reciente llegada del cristianismo a Rusia y los rumores de una horda de jinetes orientales reuniéndose en las estepas...\n\n#bold Baba Yaga es la salvación de la raza $pod_cainite$. No puedes y no la fallarás.#!"
 bookmark_warofprinces_brunhilde: "Brunhilda"
 bookmark_warofprinces_brunhilde_desc: "Nacida entre los pueblos de Escandinavia, Brunhilda sintió en su $pod_Embrace$ un renacimiento y rápidamente formó las Valquirias que sirvieron a su abuelo Odín con fervor, creyéndose extensiones reales de los mitos nórdicos. Luchó valientemente contra la influencia invasora del cristianismo, tratando de evitar cualquier cambio de las antiguas costumbres de su pueblo.\nSin embargo, esta lucha se ha perdido cuando el pueblo de Suecia se convirtió al cristianismo. Aún así, mientras muchos de sus hermanos cayeron en la desesperación o en acciones imprudentes, Brunhilda no ha perdido la esperanza aún. Incluso si su pueblo se está volviendo contra ella, sueña con repeler a los $pod_cainites$ cristianos invasores y preservar su fe.\n\n#bold El Ragnarök ha llegado y conoces el final, pero aún es demasiado pronto para rendirse. Los Æsir están mirando.#!"
 bookmark_warofprinces_dunlop: "Dunlop"
 bookmark_warofprinces_dunlop_desc: "Un salteador de caminos que robó su nombre y título del noble clan escocés, el 'Conde Dunlop' es un hombre insensible que disfruta la violencia casual. Reinando como un monstruo terrorífico incluso antes de su $pod_Embrace$, Dunlop crió a sus hijos para que fueran tan asesinos como él, siendo el único rayo de luz en su vida su hija inocente.\nSu caída llegó cuando su codicia lo llevó a atacar las posesiones del poderoso Lord Mitras. La respuesta del Ventrue fue rápida y despiadada, humillando a Dunlop y matando a su amada hija como castigo. Dunlop se vio obligado a capitular y desapareció de la mirada y atención de Mitras. Pero el agraviado 'conde' no ha olvidado ni perdonado y está tramando la caída de su rival cada noche.\n\n#bold Mitras apagó la luz que había en ti. Es hora de hacerle entender por qué Escocia aún teme tu nombre hasta esta noche...#!"
 bookmark_warofprinces_qarakh: "Qarakh"
 bookmark_warofprinces_qarakh_desc: "Qarakh y su [Glossary('Sire','game_concept_Sire_desc')], Aajav, vivían entre los mongoles, pero Qarakh fue Abrazado sin permiso, lo que provocó su precipitada partida de los $pod_cainites$ mongoles. Aajav resultó herido durante la batalla, lo que obligó a Qarakh a cargar con él hasta Livonia, donde se unió a una banda de vampiros paganos acosados que intentaban resistir la llegada del cristianismo.\nDebido a su carisma natural y destreza en la batalla, Qarakh fue pronto nombrado líder de estos 'Ferales de Livonia' y atrajo la atención de muchos otros paganos que buscaban una última resistencia triunfal. Aunque todavía joven, Qarakh se está acostumbrando cada vez más a su nuevo rol conforme pasan las noches y está listo para defender su patria adoptiva hasta su muerte final.\n\n#bold Esta podría ser la última resistencia de los paganos bálticos, pero te asegurarás de que los cristianos sangren por cada palmo de tierra.#!"
 bookmark_warofprinces_valborg: "Valborg"
 bookmark_warofprinces_valborg_desc: "Vikinga de corazón, Valborg es una formidable Ulfhedinn que lucha sin pensar en su propia seguridad. Ha aceptado que los días de los nórdicos han pasado y ahora pretende luchar por la única causa digna que queda: ella misma.\nCon su temible tripulación y su creciente reputación como una mercenaria despiadada, Valborg tiene muchas oportunidades para asesinar y saquear. A su manera, está manteniendo una versión retorcida de la antigua fe nórdica viva y está atrayendo a más y más personas a su 'causa'. A Valborg realmente no le importa. Más seguidores significan más cristianos a los que matar y más riquezas que saquear. Y si los viejos Dioses están enojados con ella, ciertamente no lo están demostrando.\n\n#bold Algunos piensan que liderarás a los nórdicos hacia una nueva era. No lo sabes, pero seguro que te divertirás abriéndote camino hacia una respuesta.#!"
 bookmark_warofprinces_thomas: "Thomas Feroux"
 bookmark_warofprinces_thomas_desc: "El hijo único de un noble menor, Thomas era un hombre agrio y cruel hasta que hizo una peregrinación a Tierra Santa. Su $pod_Embrace$ y su afortunada entrada en los $pod_cainites$ de Constantinopla lo cambiaron.\nInstruido y cuidado por algunas de las mentes más grandes de la ciudad, Thomas floreció como un devoto vástago de Constantinopla, jurando proteger su hogar adoptivo para siempre. Una tarea que no logró cumplir cuando la 4ª Cruzada devastó la ciudad y mató a sus mentores.\nThomas nunca se exilió como tantos $pod_cainites$ griegos, todavía deambula por su ciudad con la esperanza de salvarla. E, incluso si sus mentores lo desaprobaran, llevar a cabo una venganza bien merecida sobre los latinos.\n\n#bold Tu posición es débil, y los malditos latinos bien atrincherados. Pero no puedes fallar a la memoria del Sueño y a tus maestros. Este es tu momento para la redención.#!"
 bookmark_warofprinces_ikkenai: "Ikkenai"
 bookmark_warofprinces_ikkenai_desc: "Ikkenai nació en una tribu sajona y se ganó el $pod_Embrace$ por su feroz devoción a su protector Gangrel. Se convirtió en una temible guardiana de su pueblo y logró salvarlos de los romanos, pero, siglos después, Carlomagno y sus aliados sobrenaturales resultaron demasiado fuertes.\nEnfurecida por la pérdida de su pueblo, tomó represalias atacando ciegamente monasterios hasta que se dio cuenta de que era demasiado poco y demasiado tarde. Ikkenai ahora está tratando de enfocar sus esfuerzos, apuntando a su antiguo hogar que ahora se ha convertido en la bulliciosa ciudad de Aquisgrán. Para la mayoría de los vampiros alemanes, es una reliquia de una era pasada con poco poder, pero algunos habitantes de los bosques que odian la civilización están observando su progreso con interés...\n\n#bold Recuperarás tu hogar, sola si es necesario. Tu tribu clama venganza.#!"
 bookmark_warofprinces_arnulfgangrel: "Arnulf"
 bookmark_warofprinces_arnulfgangrel_desc: "Arnulf es una leyenda entre los Gangrel. Es el enemigo definitivo de la civilización, el azote que nunca termina y que un día devolverá el mundo a sus raíces primigenias. Arnulf cabalgó con los hunos para destruir Roma, con los magiares para saquear Hungría y con los mongoles para quemar las estepas.\nAbrazó a muchos de los más grandes Gangrel y fue mentor de muchos más, y siempre está seguido por jóvenes Ferales ansiosos por hacerse un nombre.\nRegresando recientemente de una campaña en Transilvania contra los Tremere, Arnulf ha respondido al llamado de unidad pagana del joven Qarakh, aunque hasta ahora no está impresionado por el hombre mismo.\n\n#bold Esta alianza 'Ferales de Livonia' te complace, pero dudas de que Qarakh tenga lo necesario para liderar. Sabes que todo el $pod_clan$ respondería si llamaras. Quizás es el momento.#!"
                                                               
 malkavian_sub_bookmark: "Malkavian" 
                                                       
 bm_1230_warofprinces_sub_malkavian: "Clan Malkavian" 
 bm_1230_warofprinces_sub_malkavian_desc: "Los Malkavian son un grupo enigmático y profundamente perturbado de Cainitas. Los miembros del Clan han asumido los roles de videntes y oráculos entre los Cainitas y los mortales, figuras inquietantes vinculadas por compulsiones extrañas y la capacidad de percibir lo que otros no pueden. También son bromistas notorios cuyas 'bromas' van desde lo tonto hasta lo sádico.\nEn la Era Clásica, eran un Clan importante profundamente respetado por sus dones proféticos. Sin embargo, los tiempos han cambiado y el cristianismo ha sido un duro golpe para los Malkavian, ahora considerados meros lunáticos por la mayoría. Relegados a la posición de un Clan Bajo, los Tocados por la Luna han perdido la mayor parte de su poder y prestigio.\n\n#bold Más que cualquier otro Clan, cada Malkavian es su propia criatura, tanto la locura como la claridad compiten por su mente. ¿Cuál ganará?#!" 
 bookmark_warofprinces_tryphosa: "Tryphosa"
 bookmark_warofprinces_tryphosa_desc: "Quizás la Malkavian más influyente de la Era Clásica, Tryphosa fue asesora de Camila de Roma y una firme defensora de la destrucción de Cartago. Fue gracias a su presencia constante e influencia sobre el poderoso Ventrue que finalmente se movió contra lo que ella veía como un infierno infestado de demonios.\nTryphosa cree que su lugar como no-muerta le permite afectar las visiones del futuro que presencia, algo que se pierde en su mayoría en las nuevas generaciones de Malkavian. Tras la caída de Roma, Tryphosa nunca abandonó Italia, esperando el regreso de Camila para volver a impulsarlo hacia adelante. Ese momento ha llegado.\n\n#bold Camila ha vuelto y tu guía seguramente será aún más necesaria que antes, considerando que este extraño mundo nuevo es tan diferente de tu amada Roma.#!"
 bookmark_warofprinces_vasantasena: "Vasantasena"
 bookmark_warofprinces_vasantasena_desc: "Vasantasena era la hija del emperador tamil Rajaraja el Grande, maldecida por un chambelán vampiro para que se consumiera lentamente. Un Malkavian errante le ofreció una solución que ella aceptó valientemente, revelando la traición del chambelán a su padre casi a costa de su vida. Llevada a la no-muerte por su salvador, comenzó a viajar por el mundo.\nPredica contra el Vínculo de Sangre, rechaza el señorío sobre los mortales, la jerarquía vampírica tradicional y toda pérdida de libre albedrío. Maneja su celo y encanto como un cuchillo, y su reputación crece rápidamente.\n\n#bold Eres la voz de los oprimidos. Romperás las cadenas que atan la sociedad $pod_cainite$ una por una.#!"
 bookmark_warofprinces_louhi: "Louhi"
 bookmark_warofprinces_louhi_desc: "Una vampira reservada, con pocas menciones registradas en la historia $pod_cainite$, Louhi ha sido la presencia $pod_cainite$ principal en el norte de Finlandia desde que nadie recuerda.\nUna de las taumaturgas más talentosas que jamás haya existido, ha creado su propia progenie de [Glossary('Revenants','game_concept_revenant_desc')], los retorcidos Keskinen. Los rumores dicen que sirve al [Glossary('Antediluvian','game_concept_antediluvian_desc')] Lasombra por razones desconocidas. Muchos están preocupados de que sus planes puedan significar la perdición para la región, o incluso más, pero los pocos que se atrevieron a viajar al norte helado para enfrentarla nunca regresaron.\n\n#bold Estás trabajando duro para complacer al maestro abisal. Estás progresando, pero siempre se necesitan más 'voluntarios' para probar tus últimas pociones...#!"
 bookmark_warofprinces_anatole: "Anatole"
 bookmark_warofprinces_anatole_desc: "Nacido hijo mayor de un comandante de la guardia de la ciudad, y se esperaba que siguiera los pasos de su padre, Anatole en cambio encontró una vocación superior al servir a Dios. Su porte y sus creencias atrajeron la atención de un vampiro particularmente religioso que pensó que Anatole podría impulsar la causa del cristianismo.\nEn los años posteriores, ya se ha hecho un nombre como un ferviente oponente de la herejía en todas sus formas, habiendo derrotado tanto a los Elegidos de Calomena de Constantinopla como a la Herejía $pod_cainite$ en París. Sus visiones todavía lo impulsan a hacer aún más.\n\n#bold La Herejía Cátara en el sur de Francia es un frente para que algunos peligrosos $pod_cainites$ herejes se escondan detrás. Debes encontrarlos y destruirlos.#!"
 bookmark_warofprinces_elimelech: "Elimelec"
 bookmark_warofprinces_elimelech_desc: "Elimelec era el esposo de Noemí, como se cuenta en la Biblia en el Libro de Rut. Fue atacado y Abrazado por un agresor desconocido. Noemí encontró a su esposo deambulando por los campos: una cáscara fría, no-muerta y vacía. Lo colocó en una tumba poco profunda sin marcar. Tres noches después, se levantó loco y sufriendo una sed que ninguna fuente podía saciar.\nElimelec nunca se recuperó de sus primeras noches, a menudo perdiéndose ante su Bestia y deambulando sin rumbo o atacando a otros en un frenesí loco. Los viajes de Elimelec finalmente lo llevaron a la Tal'mahe'Ra, un culto de muerte apocalíptico que adora a los [Glossary('Antediluvians','game_concept_antediluvian_desc')].\n\n#bold Te temen y te escuchan. Quizás tu propósito y salvación residen en este ensordecedor coro de emociones.#!"
 bookmark_warofprinces_adolana: "Adolana de Las Huelgas"
 bookmark_warofprinces_adolana_desc: "La mayor parte de la vida de Adolana la pasó en un convento después de que su hermano sádico la enviara allí para ocultar sus crímenes. Negándose a recibir más palizas, pronto usó su facilidad de palabra para convertir el convento en una sociedad fracturada donde la violencia era común, pero con ella en la cima de la cadena alimenticia ahora.\nImpresionado con sus habilidades, un Malkavian de la Herejía $pod_cainite$ la Abrazó y expandió sus ambiciones. Ayudada por el casi colapso de la Iglesia de Caín, Adolana ha ascendido rápidamente en la jerarquía y ahora es miembro de la asediada Sede de Nod, el último bastión de su fe.\n\n#bold Encontraste una nueva familia en la Iglesia de Caín, pero... incluso en una familia sabes que debes estar en la cima si quieres evitar que te vuelvan a hacer daño.#!"
 bookmark_warofprinces_harold: "Harold Zettler"
 bookmark_warofprinces_harold_desc: "Miembro del Círculo de las Tres Revelaciones, un colectivo suelto de videntes, filósofos y místicos Malkavian, Harold Zettler fue un firme defensor de los Salubri cuando los Tremere comenzaron a destruirlos. Usando la poca influencia que tenía para protegerlos y darles refugio no fue suficiente y se volvió más desesperado a medida que la purga Tremere ganaba fuerza.\nHarold suplicó a cualquier entidad espiritual o incluso a los Dioses que lo ayudaran y uno de ellos respondió.\nEsa noche, Harold Zettler renació como una burla de todo lo que alguna vez apreció.\n\n#bold Entiendes mucho más ahora. No hay salvación sin dolor y te convertirás en el artista más consumado de ello con el tiempo, gracias a tu generoso nuevo patrón.#!"
 bookmark_warofprinces_inanna: "Inanna"
 bookmark_warofprinces_inanna_desc: "Inanna nació en Nínive y fue tomada como amante y vástago del vampiro que se hacía pasar por el dios de la ciudad. Cuando Angiwar llegó a la ciudad, quedó disgustado por los ritos de sangre de los Malkavian y el [Glossary('Sire','game_concept_Sire_desc')] de Inanna se volvió contra él. En el conflicto, el templo fue destruido y solo Inanna sobrevivió. Enfurecida y entristecida por la pérdida de su amante, juró venganza contra el extraño que había llegado a su ciudad y no les había traído más que miseria.\nMás tarde reapareció como una de las partidarias del príncipe romano Camila contra Cartago. Luchando ferozmente, obtuvo varios privilegios del Senado Eterno, incluido el derecho a [Glossary('Diablerize','game_concept_diablerie_desc')] a sus enemigos. Con su nuevo poder, se enfrentó a Angiwar varias veces más, pero nunca logró la victoria.\n\n#bold Tu obsesión singular por matar a tu némesis será tu fuerza.#!"
 bookmark_warofprinces_midian: "Midián"
 bookmark_warofprinces_midian_desc: "Midián llegó a Hamburgo con los sajones alrededor del siglo IX. Pronto comenzó a cultivar su relación con la Iglesia y entró en rivalidad con la naciente clase mercantil y su patrocinador no-muerto. Tomando ventaja en esta batalla en las sombras, Midián pudo declararse Príncipe en 1054. Entonces el poder de la Iglesia disminuyó, dejando a Midián en un estado de amarga y sombría desesperación.\nLa mente de Midián finalmente se rompió cuando se dio cuenta de que ya no le quedaba poder. Y así, comenzaron sus atrocidades. Comenzó a [Glossary('Diablerizing','game_concept_diablerie_desc')] a cualquier $pod_cainite$ que entrara en 'su' ciudad, incorporando sus almas a la colmena de su mente fracturada, creando así la corte que nunca tuvo.\n\n#bold Te sientas solo en el vasto salón de recepción de tu torre, reflexionando y sosteniendo elaboradas conversaciones con un séquito de cortesanos que solo existen en tu imaginación... o quizás todavía palpitan en tu sangre.#!"
                                                                         
 nosferatu_sub_bookmark: "Nosferatu" 
                                                       
 bm_1230_warofprinces_sub_nosferatu: "Clan Nosferatu" 
 bm_1230_warofprinces_sub_nosferatu_desc: "El más visiblemente maldito de todos los Cainitas, el Abrazo deforma a cada Nosferatu en una criatura horriblemente deformada. Son los maestros espías de los muertos, recopilando información y vendiéndola a un alto precio. Como maestros del subsuelo, los Nosferatu tienden a poner un mayor énfasis en la unidad del Clan y la supervivencia mutua, y en consecuencia son bastante cordiales entre sí incluso cuando técnicamente son enemigos.\nLos Nosferatu nunca fueron terratenientes importantes en el mundo de la noche, pero sin embargo siempre ejercieron una gran influencia, aunque invisible, gracias a sus talentos sin igual para la recopilación de información.\n\n#bold Tu Clan es la única familia que puede entenderte. Si pudieran unirse todos, hay pocas amenazas que no pudieran superarse.#!" 
 bookmark_warofprinces_josef: "Josef Zvi"
 bookmark_warofprinces_josef_desc: "Josef nació y creció en el Barrio Judío de Praga como hijo de un rabino. La violencia contra los judíos no era infrecuente, y Josef sufrió de manera más brutal una noche cuando una banda de muchachos cristianos le aplastó media cabeza. Habría muerto si no hubiera sido por su $pod_Embrace$ por parte del Nosferatu Yehuda. Le preguntó si Josef defendería a otros de tal brutalidad, a lo que Josef solo pudo apretar la mano del Nosferatu en respuesta.\nAscendiendo para convertirse en el jefe de la comunidad Nosferatu en Praga, Josef fue fundamental para destronar a su anterior príncipe tiránico. En el subsiguiente vacío de poder, pudo asegurar la ciudad para él y su pueblo.\n\n#bold A pesar de que Praga está a salvo, una nueva amenaza ha surgido en el Este que podría poner en peligro todos tus esfuerzos hasta ahora. No debes flaquear.#!"
 bookmark_warofprinces_tarique: "Tarique"
 bookmark_warofprinces_tarique_desc: "Antes de su ascenso, Tarique era un Kindred español convertido al Islam durante su Edad de Oro. Enamorado de la ciudad 'intocable' de La Meca, Tarique se aventuró en la Península Arábiga para contemplar el más sagrado de los sitios musulmanes.\nSe involucró en su defensa contra una conspiración Malkavian y pronto entabló amistad con el liderazgo de los [Glossary('Ashirra','game_concept_ashirra_desc')] ($pod_cainites$ musulmanes). Reuniendo un séquito impresionado por su fe inquebrantable, Tarique entonces reclamó que de ahí en adelante él y su progenie se convertirían en Hajj, guardianes religiosos del Islam y mayordomos de La Meca.\n\n#bold Los [Glossary('Ashirra','game_concept_ashirra_desc')] se mantienen firmes, pero aún hay amenazas a tu alrededor. Eres su roca y no debes flaquear en tu sagrado deber.#!"
 bookmark_warofprinces_malachite: "Malachite"
 bookmark_warofprinces_malachite_desc: "Nacido en el siglo IX como nativo de Constantinopla, Maleki creció siendo un sacerdote ortodoxo oriental. Desafortunadamente, tuvo un desacuerdo público con un poderoso $pod_cainite$. Por herir su orgullo, hizo que Maleki fuera [Glossary('Embraced','game_concept_Embrace_desc')] por un Nosferatu.\nRenacido como $pod_cainite$, Maleki vivió en la desesperación hasta que fue puesto bajo la tutela del Toreador Miguel, Patriarca de Constantinopla, y se convirtió en el sirviente más fiel del Sueño.\nLa 4ª Cruzada fue un golpe aplastante para el espíritu de Malachite, pero sabe que incluso sin Miguel, el Sueño debe perdurar.\n\n#bold Debes liberar Constantinopla del control franco y devolver la ciudad a su antigua gloria. Como heredero de Miguel, es tu deber.#!"
 bookmark_warofprinces_mnemach: "Mnemach"
 bookmark_warofprinces_mnemach_desc: "Nacida durante los últimos días de la Galia independiente, Mnemach fue [Glossary('Embraced','game_concept_Embrace_desc')] por un Nosferatu que quería preservar su cultura y tradiciones. Bajo su tutela, pronto se convirtió en una hechicera consumada y se estableció en Lutetia, que pronto se convertiría en París.\nUna de las $pod_cainites$ más antiguas de Francia, la influencia y el poder de Mnemach son bien conocidos, y su apoyo fue fundamental para expulsar a Alejandro de París del poder. Aún así, sus verdaderos objetivos no están claros, lo que hace que el aura de misterio que la rodea sea aún más preocupante para otros $pod_cainites$.\n\n#bold Expulsaste a Alejandro por una razón, y esa razón está ahora en tus manos. Un fragmento de tu pasado, y quizás de tu futuro, se reúne contigo una vez más.#!"
 bookmark_warofprinces_lukas: "Lukas"
 bookmark_warofprinces_lukas_desc: "Para la mayoría, Lukas podría ser confundido con un monaguillo de una orden sagrada. Su apariencia inocente oculta al monstruo astuto que habita debajo, el monstruo que corrompió sistemáticamente una casa de Dios en nombre del Infierno.\nOrgulloso de su perfecta belleza como niño mortal, Lukas se horrorizó cuando un vagabundo Nosferatu lo [Glossary('Embraced','game_concept_Embrace_desc')] para enseñarle un poco de humildad. Desesperado, Lukas dijo que haría cualquier cosa para restaurar su belleza.\nMuy abajo, algo escuchó su súplica y presentó sus términos...\n\n#bold Tu patrón infernal pide más y más para mantener su parte del trato. No tienes más remedio que cumplir, porque tu belleza vale cualquier sacrificio.#!"
 bookmark_warofprinces_gregor: "Gregor"
 bookmark_warofprinces_gregor_desc: "Caballero teutón en vida, Gregor era conocido por su crueldad y descuido. [Glossary('Embraced','game_concept_Embrace_desc')] por un Nosferatu con la esperanza de castigarlo, Gregor se adaptó con bastante facilidad a su nueva existencia.\nAdentrándose en la Selva Negra, pronto se hizo famoso por matar hombres lobo y destruir a un poderoso y antiguo Niktuku. Ambas hazañas deberían ser casi imposibles para alguien tan joven como Gregor, lo que lleva a muchos a creer que algo no está del todo bien en las profundidades del bosque...\n\n#bold Has encontrado tu verdadero propósito como caballero de la Dama de las Espinas. Ella te da fuerza y no te reprende por tu deseo de violencia. Sois perfectos el uno para el otro.#!"
 bookmark_warofprinces_zelios: "Zelios"
 bookmark_warofprinces_zelios_desc: "Nacido en una familia de ricos mercaderes, Zelios abandonó la idea de perseguir una vida de privilegios cómodos en favor de desarrollar un oficio útil. Viajó por Europa y más allá, aprendiendo el arte y la ciencia de la arquitectura.\nUn Nosferatu se dio cuenta del potencial del joven y decidió traerlo al $pod_clan$, para que pudiera mejorar las madrigueras que poblaba su $pod_clan$. Con la eternidad por delante, Zelios se sumerge en su oficio, especializándose en la construcción de castillos para señores $pod_cainite$.\n\n#bold Eres famoso entre la nobleza y los artesanos por igual, pero sabes que tu verdadera obra maestra está por llegar. Transilvania te llama, y podría ser donde encuentres tu destino.#!"
 bookmark_warofprinces_angiwar: "Angiwar"
 bookmark_warofprinces_angiwar_desc: "Uno de los habitantes originales del valle del río Meno, un joven Angiwar encontró a una doncella llorando lágrimas de sangre junto al agua. Escuchó su historia y no la rechazó. Conmovida por su sinceridad y honestidad, la doncella lo [Glossary('Embraced','game_concept_Embrace_desc')].\nLuego se convirtió en mentor y figura de hermano para muchos jóvenes Nosferatu, incluidos los que buscaban [golconda|E], algo que él mismo anhelaba.\nAngiwar entonces dirigió su atención a los Niktuku, el espantoso coco que caza a los Nosferatu. A pesar de obtener algunas victorias, se vio obligado a retirarse a Frankfurt. Allí conoció a Julia Antasia y pronto quedó cautivado por su visión utópica para la sociedad $pod_cainite$, comprometiéndose inmediatamente con su causa.\n\n#bold Eres el faro brillante de esperanza de tu acosado $pod_clan$ y no tienes la intención de defraudarlos.#!"
 bookmark_warofprinces_kodesh: "Kli Kodesh"
 bookmark_warofprinces_kodesh_desc: "Nacido y [Glossary('Embraced','game_concept_Embrace_desc')] durante los eventos climáticos del cristianismo primitivo, los verdaderos orígenes de Kli Kodesh son misteriosos. Parece que fue el primer vampiro en beber (y sobrevivir) del legendario Santo Grial, lo que explica su falta de deformidades para un Nosferatu. Armado con este poderoso artefacto, Kli Kodesh contempló la eternidad que se extendía frente a él... y solo encontró aburrimiento en la perspectiva.\nTirando el Grial al basurero más cercano, Kodesh decidió dedicar su eternidad al objetivo de encontrar siempre nuevo entretenimiento, desde la broma más pequeña hasta el plan más grande.\n\n#bold La eternidad es demasiado larga para estar inactivo. Es hora de encontrar nuevas formas de aliviar tu mente hastiada de esta farsa prolongada.#!"
                                                                                    
 ravnos_sub_bookmark: "Ravnos" 
                                                       
 bm_1230_warofprinces_sub_ravnos: "Clan Ravnos" 
 bm_1230_warofprinces_sub_ravnos_desc: "Un Clan profundamente dividido, los Ravnos se originaron en la India, pero se sabe que han vagado por todas partes. Gobernantes poderosos en su tierra natal, están menos arraigados en Occidente, donde son meramente conocidos como tricksters errantes, místicos y vagabundos.\nLos Ravnos orientales tienen su propio sistema de castas, desarrollado a partir de los linajes que descendieron de Zapathasura, su supuesto fundador. Por su parte, cada éxodo de los Ravnos tiene diferentes puntos de vista, valores y motivaciones, lo que resulta en una multitud de ramas (o castas) del Clan principal indio dentro de Europa.\n\n#bold Despreciados en el mundo occidental y atrapados en una guerra eterna contra un enemigo mortal en la India, el futuro del Clan Ravnos será difícilmente ganado. Hay mucho por hacer.#!" 
 bookmark_warofprinces_chandraputra: "Chandraputra"
 bookmark_warofprinces_chandraputra_desc: "Un salvador y un monstruo, un sirviente y un conquistador, Chandraputra es ante todo una cosa: leal. El único vástago de Zapathasura que no ha traicionado a su [Glossary('Sire','game_concept_Sire_desc')] de una forma u otra, ha asumido naturalmente el manto de liderazgo de sus compañeros de clan indios.\nEntre los primeros conquistadores indoeuropeos que invadieron el subcontinente durante sus días mortales, Chandraputra es quizás el general más consumado de la noche, en gran parte debido a la guerra eterna que libra contra los malditos asurazitayya que amenazan a su $pod_clan$.\n\n#bold La guerra nunca cambia y tú tampoco. Tus enemigos entenderán que nunca flaquearás.#!"
 bookmark_warofprinces_karmenita: "Karmenita Yoryari"
 bookmark_warofprinces_karmenita_desc: "Originaria de Italia, Karmenita se desilusionó rápidamente con el comportamiento decadente de los Ravnos romanos. Se mudó a Portugal para explorar el lado espiritual de la versión bastardizada del Sendero de la Paradoja que le había enseñado su [Glossary('Sire','game_concept_Sire_desc')]. Sin conocimiento de las doctrinas originales, Karmenita desarrolló la noción de que solo podía haber un número limitado de cosas, conceptos, etc., que pueden prosperar en el mundo contemporáneo.\nTambién es una ferviente enemiga de la delincuencia sin sentido y otros arrebatos de autogratificación tan comunes entre su $pod_clan$, lo que despierta el descontento con ella entre sus antiguos hermanos.\n\n#bold Estás creando lentamente tu propia casta a partir del desastre decadente que tu [Glossary('Sire','game_concept_Sire_desc')] dejó atrás, pero tienes tus propios problemas familiares que resolver...#!"
 bookmark_warofprinces_iago: "Iago Castille"
 bookmark_warofprinces_iago_desc: "El 'Príncipe Pirata' del Mediterráneo es un astuto capitán que fue Abrazado en el $pod_clan$ Ravnos por Karmenita Yoryari. Sin embargo, sus puntos de vista pronto chocaron, ya que la paciente [Glossary('Sire','game_concept_Sire_desc')] desaprobaba el temperamento fogoso de su vástago. Como tal, Iago escapó rápidamente de sus garras hacia Córcega.\nDemostrando ser un líder carismático, Iago ha adoptado plenamente su nueva vida como un pirata codicioso y engañoso. Subestimarlo sería un error, sin embargo, ya que sus habilidades para la intriga y la manipulación han dejado a muchos perseguidores muertos en su camino.\n\n#bold Hay dinero que hacer y Príncipes arrogantes a los que bajar uno o dos peldaños. ¡El Mediterráneo es tuyo para tomar!#!"
 bookmark_warofprinces_mritunjay: "Mritunjay"
 bookmark_warofprinces_mritunjay_desc: "El nuevo Príncipe de Bagdad ha ascendido a este título tras un plan bien ejecutado contra el último Príncipe, tomando venganza contra ella en el proceso. Como alguien que disfruta de las cosas buenas de la vida y la no-muerte, Mritunjay ciertamente aprecia su nuevo cargo, pero tomarlo por un bufón pomposo sería un error.\nCon su mente rápida, Mritunjay se ha convertido en un experto en enfrentar a las facciones entre sí, asegurando su seguridad en el proceso. Con Bagdad finalmente en sus manos, podrá usar esta habilidad a mayor escala.\n\n#bold Bagdad es el mayor de los premios, pero hay amenazas, tanto mortales como no-muertas, que tratar para asegurarla verdaderamente.#!"
 bookmark_warofprinces_marcia: "Marcia Felicia Licinia"
 bookmark_warofprinces_marcia_desc: "Como la Phaedymita activa más antigua, Marcia está orgullosa del legado de su casta, una de guerreros y caballeros, de honor y deber. Sin embargo, su amor por la batalla palidece en comparación con su deseo de conocimiento. Asumiendo la tarea de escribir una Obra Magna sobre su $pod_clan$, Marcia ha estado trabajando duro recopilando información sobre sus dispares hermanos.\nSu obsesión le está costando cada vez más, sin embargo, mientras observa con temor cómo los Ravnos caen en la decadencia. Ahora está contemplando tomar un papel más activo políticamente.\n\n#bold No puedes quedarte inactiva mientras tu $pod_clan$ se entrega a un comportamiento pecaminoso. Podrías hacer Historia, en lugar de solo escribirla.#!"
 bookmark_warofprinces_zoe: "Zoe"
 bookmark_warofprinces_zoe_desc: "Una vez una mera aprendiz en Constantinopla, Zoe fue mortalmente herida durante el saqueo de la ciudad en 1204 y Abrazada para salvarle la vida. Viajando con la población griega exiliada, pronto perdió también a su [Glossary('Sire','game_concept_Sire_desc')] a manos de un grupo de Inquisidores.\nAbrumada por la ira y la desesperación, Zoe se habría derrumbado si no hubiera sido por la paciente tutoría de Anatole, un compañero de viaje. Los dos aprendieron el uno del otro, y Zoe se vengó de los odiados Inquisidores. Finalmente en paz, se convirtió en la pupila y vástago honorario de su amigo y lo ha seguido al sur de Francia en su propia búsqueda personal.\n\n#bold Le debes mucho a Anatole, y aún puedes aprender mucho más de él, quizás encontrando finalmente tu lugar en este mundo en el proceso.#!"
 bookmark_warofprinces_etienne: "Etienne de Fauberge"
 bookmark_warofprinces_etienne_desc: "Etienne creció sabiendo que había nacido del pecado y que el mundo que lo rodeaba era indigno ante los ojos de Dios. Cuando se hizo el llamamiento de las Cruzadas, se unió para obtener el perdón. Cuando intentó proteger a un mercader judío cerca de Antioquía, sus compañeros se volvieron contra él, golpeándolo y obligándolo a ver cómo degollaban a la familia del mercader, dejando a Etienne llorando entre los cadáveres. Fue entonces cuando conoció a su [Glossary('Sire','game_concept_Sire_desc')], que se conmovió por su piedad.\nDesde entonces, Etienne se ha encargado de proteger Acre y actuar como protector de la ciudad santa. En estos tiempos turbulentos, su trabajo está hecho para él.\n\n#bold Has logrado salvar Acre hasta ahora, pero la agitación en Tierra Santa nunca termina. Aún no te has arrepentido lo suficiente de tus pecados.#!"
 bookmark_warofprinces_varsik: "Varsik"
 bookmark_warofprinces_varsik_desc: "Mercader ambulante, las habilidades de Varsik con las palabras, el juego de manos y su inherente ansia de viajar atrajeron la atención del metusalah Bashir, quien lo [Glossary('Embraced','game_concept_Embrace_desc')] como uno de sus siete discípulos.\nSiguió a su [Glossary('Sire','game_concept_Sire_desc')] por el mundo medieval, fusionando las enseñanzas del Sendero de la Paradoja con las del Libro Cristiano de las Revelaciones.\nEn el año 1101 d. C., llegó a Jerusalén tras la Muerte Final de otro discípulo. Esperaba usar el caos dentro de la ciudad para difundir el credo bashirita a otros de su $pod_clan$ e incluso a otros $pod_cainites$, mientras él acumulaba una fortuna masiva por sí mismo, convirtiéndose en una de las figuras más poderosas de la ciudad.\n\n#bold La reciente llegada de la Leona ha reducido enormemente tu influencia. Debes dar un paso atrás y planificar tu regreso a Jerusalén desde lejos.#!"
 bookmark_warofprinces_ramessu: "Ramessu"
 bookmark_warofprinces_ramessu_desc: "Uno de los vástagos de Zapathasura, Ramessu se cansó rápidamente de la guerra eterna entre su $pod_clan$ y los invasores orientales en la India. Como tal, optó por establecerse en Egipto, ayudado por la entonces guerra en curso entre los Setitas y la $glossary_osirian_league$.\nConquistando gran parte del territorio en manos de los distraídos hijos de Set, Ramessu estableció su propio Jati (casta) llamado los Alejadrinos. Desde entonces, los Setitas se han reagrupado y contraatacado, pero el poderoso Metusalah y sus vástagos siguen siendo una gran amenaza en su frontera.\n\n#bold Has llegado a amar Egipto. Defenderás su antigua gloria mientras te deshaces de las plagas serpentinas que lo infestan.#!"
                                                                                             
 setite_sub_bookmark: "Setita" 
                                                       
 bm_1230_warofprinces_sub_setite: "Clan Setita" 
 bm_1230_warofprinces_sub_setite_desc: "La creencia setita dicta que Set regresará un día para gobernar o consumir el mundo, y los setitas devotos preparan el camino para su resurrección. Con este fin, el Clan permanece independiente de las sectas de otros Cainitas, y practica con gran habilidad las artes de la corrupción, el engaño y la hechicería ancestral.\nActuando más como un culto religioso que como un Clan verdadero la mayor parte del tiempo, los Setitas siguen siendo fuertes en su tierra natal de Egipto, pero el ascenso del Islam ha debilitado severamente su poder fuera de ella. Para encontrar nuevos aliados y difundir la gloria de su Dios por todas partes, los setitas, antes insulares, han comenzado a viajar por todo el mundo.\n\n#bold El férreo control de Ra sobre el mundo aún es asfixiante. Solo cuando la alabanza de Set sea cantada por todos los Cainitas extraviados, el mundo será verdaderamente libre.#!" 
 bookmark_warofprinces_nakhthorheb: "Nakhthorheb"
 bookmark_warofprinces_nakhthorheb_desc: "Antes de la desaparición de Set, los Seguidores no tenían organización. Cuando su dios desapareció, los Hierofantes se unieron y se declararon mayordomos del $pod_clan$.\nNakhthorheb es el más grande de los Hierofantes; es él quien los mantiene en un puño de hierro. Los rumores dicen que nació en la misma tribu nómada que el propio Set. Si bien todas las leyes y mandatos dados deben ser acordados por los siete ancianos, es Nakhthorheb quien es la fuente de estos mandatos.\n\n#bold Con la desaparición de Set, los fieles necesitan tu liderazgo más que nunca. No los falles, ni a él.#!"
 bookmark_warofprinces_kemintiri: "Kemintiri"
 bookmark_warofprinces_kemintiri_desc: "Una vez sacerdotisa de Isis que atrajo la atención no deseada de Set, Kemintiri fue torturada violentamente antes de su Abrazo cuando se negó a revelar el secreto que Set buscaba de su Diosa. Incluso este cruel trato no la quebrantó, y soportó su abuso durante muchas noches antes de lograr escapar.\nDesde ese momento, Kemintiri se ha convertido en la peor enemiga del $pod_clan$ Setita, destruyendo el legado de su odiado Sire siempre que puede. Su leyenda crece cada noche y se cuentan historias de la última sacerdotisa de Isis, un ángel de la venganza que cae sobre un $pod_clan$ corrupto.\n\n#bold Tu trabajo nunca terminará hasta que todo lo que Set aprecia esté esparcido a los vientos.#!"
 #To be reused for landless bookmark
 bookmark_warofprinces_andreas: "Andreas Aegyptus"
 bookmark_warofprinces_andreas_desc: "Una vez un sacerdote palestino de la secta hereje monofisita en la cristiandad primitiva, Andreas encontró a Set durante su exilio en Egipto. Demostrando ser un converso inteligente y estudioso, Andreas ha asumido el papel de un príncipe mercader para su $pod_clan$, obteniendo contactos y aliados en toda Europa.\nSu impecable reputación y trato justo le han ayudado a crear un imperio comercial, pero su verdadera vocación sigue siendo ayudar a otros a encontrar la verdad de Set, sin importar de dónde vengan.\n\n#bold Cada persona acepta a Set a su manera. Tú eres meramente la guía paciente y comprensiva que necesitarán en el camino.#!"
 bookmark_warofprinces_shahara: "Shahara al-Rashwa"
 bookmark_warofprinces_shahara_desc: "Salvada por los seguidores de Set de una vida de miseria, Shahara aceptó con gusto todo lo que el culto tenía para ofrecerle. Se convirtió en la seductora arquetípica del $pod_clan$ serpiente, misteriosa, engañosa y comprometida a atrapar los corazones de los hombres para la gloria de su Dios.\nAunque todavía joven para la sangre, su primera misión en Jerusalén mostró un gran éxito temprano y Shahara está aún más ansiosa por continuar su sagrado trabajo.\n\n#bold Disfrutas enormemente seduciendo hombres hasta que bailan al son de tu música. Tal placer también fomenta la causa del Gran Libertador y así lo haces con celo. Set pronto te contará entre sus hijas favoritas.#!"
 bookmark_warofprinces_neferu: "Neferu"
 bookmark_warofprinces_neferu_desc: "Dama de compañía de Nefertiti, Neferu fue la agente de Set durante los tiempos turbulentos del faraón Akenatón, siendo fundamental para derribar su gobierno herético. Su recompensa fue el Abrazo y la creación de su propio templo, la Corte de Fuego.\nSe ha especializado en corromper a vampiros extranjeros que intentan conquistar Egipto, una tarea que le ha valido muchos enemigos. Pero, de alguna manera, la Corte de Fuego parece sobrevivir y salir victoriosa más a menudo que no.\n\n#bold Tu corte erosiona lentamente los mismos pilares de la civilización de manera metódica. Muchos ya han caído ante ella, muchos más lo harán en el futuro.#!"
 bookmark_warofprinces_sarrasine: "Sarrasine"
 bookmark_warofprinces_sarrasine_desc: "De mortal, Sarrasine era un niño en la corte de Justiniano el Grande, que vio que los señores temporales a menudo no vivían según la ortodoxia de las escrituras, sino según amos ocultos. Khay'tall lo Abrazó porque vio algo de sí mismo en el niño. Sin embargo, Sarrasine no correspondió a estos sentimientos. Durante el saqueo de Constantinopla por la Cuarta Cruzada en 1204, Sarrasine intentó la $pod_diablerie$ de su [Glossary('Sire','game_concept_Sire_desc')], pero fracasó por poco.\nAunque Khay'Tall no tenía muchos amigos entre los setitas ortodoxos, todavía tenía seguidores fervientes de su causa y Sarrasine ahora está huyendo.\n\n#bold Todo este asunto fue meramente un revés. Es hora de empezar de nuevo, algo en lo que eres bastante hábil.#!"
 bookmark_warofprinces_arnulf: "Arnulf Jormungandrsson"
 bookmark_warofprinces_arnulf_desc: "Arnulf Seamundsson era un mercader nórdico que viajó a Alejandría durante el siglo IX. Allí, fue introducido en un culto de sangre dedicado al antiguo dios Set y finalmente se le concedió el abrazo por un miembro de los Seguidores de Set.\nCuando Arnulf regresó a Escandinavia, ahora conocido bajo el epíteto Jormungandrsson, fundó el Salón de Jormungandr como un culto apocalíptico que adora a la Serpiente Mundial. Hasta ahora ha ganado un punto de apoyo en el comercio de la joyería y ha fomentado una pequeña colonia setita lejos de Egipto.\n\n#bold Mientras el mundo vikingo se desintegra, hay nuevas riquezas y conversos que obtener. Tiempos emocionantes, si peligrosos.#!"
 bookmark_warofprinces_jean: "Jean-Baptiste de Montrond"
 bookmark_warofprinces_jean_desc: "Jean-Baptiste estaba borracho cuando tomó la cruz, es la única explicación para su momentáneo arrebato de fervor religioso.\nMientras se demoraba en Mesina, Sicilia, se encontró entregándose a todo tipo de depravaciones y herejías con la justificación de que el Papa había prometido que todos los pecados serían perdonados a los Cruzados. Después de solo unas pocas semanas, abandonó su deber con la Cruz y se rindió al Culto de Set. Desafortunadamente, el templo napolitano fue destruido y tuvo que huir de regreso a Francia.\nDesde entonces, Jean-Baptiste se ha convertido en el maestro de la vida nocturna de París, satisfaciendo cada uno de sus retorcidos deseos en el proceso.\n\n#bold La no-muerte es buena. ¿A quién le importa ese tipo Set mientras puedas rodearte de placer y riquezas en abundancia?#!"
 bookmark_warofprinces_sundervere: "Sundervere"
 bookmark_warofprinces_sundervere_desc: "A primera vista, Sundervere es solo un hombre pequeño y delgado de mediana edad, con la cabeza rapada, una marca en V en la frente y una túnica blanca. Entonces ves sus ojos: negros, magnéticos, ardiendo con voluntad fanática. El vacío te devuelve la mirada.\nUn genio indio, Sundervere prefiere trabajar solo con otros Daitya, o con sus indios mortales y varios cultos extraños y secretos dispersos por el mundo. No solo comanda la lealtad de varios cultos apocalípticos, puede crear otros nuevos bajo pedido. Una cosa es segura, el hombre es ambicioso, arrogante y tiene la intención de convertirse en un actor de poder tarde o temprano.\n\n#bold India es un terreno fértil para comenzar tu ascenso a la grandeza.#!"
 bookmark_warofprinces_zhenga: "Zhenga"
 bookmark_warofprinces_zhenga_desc: "Esclavos, drogas, $pod_vitae$ y secretos son el comercio de Zhenga y para cualquiera que compre – por el precio correcto. En buena posición con los Laibon nativos, Zhenga se prepara para reclamar las tierras al sur de Egipto como su dominio oficial para servir como cabeza de puente para las operaciones setitas en el África subsahariana.\nTambién está tratando de crear una nueva línea de [Glossary('Revenant','game_concept_revenant_desc')] llamada bima (la palabra nilota para [ghoul|E]), obediente solo a los Setitas en la naturaleza africana.\n\n#bold ¡Con tu dominio de los secretos, el vicio y la cría de reanimados, finalmente reclamarás África para la gloria de Set!#!"
                                                                                                           
 tremere_sub_bookmark: "Tremere" 
                                                       
 bm_1230_warofprinces_sub_tremere: "Clan Tremere" 
 bm_1230_warofprinces_sub_tremere_desc: "El clan más joven de vampiros, los Tremere fueron una vez magos de la Orden de Hermes antes de que su fundador comenzara su búsqueda para preservar su desvanecida inmortalidad. Esta búsqueda lo condenó a él, y a la mayoría de su casa, a convertirse en vampiros.\nDesde su nacimiento, los Tremere han hecho muchos enemigos, desde los Tzimisce en cuyas tierras se entrometen hasta los Salubri por el asesinato de Saulot. Aún así, su disciplina férrea y sus poderosas magias les han permitido perdurar... hasta ahora.\n\n#bold La posición del Clan Tremere es inestable, acosada por enemigos en todos los frentes. Necesitarán el talento y el intelecto de sus miembros más brillantes para sobrevivir.#!" 
 bookmark_warofprinces_goratrix: "Goratrix"
 bookmark_warofprinces_goratrix_desc: "Uno de los amigos más cercanos y estudiantes más prometedores del propio Tremere, Goratrix fue quien ideó el ritual que transformó a la élite de la Casa Tremere en vampiros.\nA pesar de este gran éxito, fue Etrius, el otro estudiante de Tremere, quien fue elegido para actuar como regente de la Casa, enfureciendo a Goratrix. Enviado a Francia como una especie de exilio, el ambicioso y talentoso mago ya ha aprovechado al máximo su tiempo aquí, ganando una fuerte influencia en la política francesa.\n\n#bold Hay algo podrido en la Casa Tremere y tú lo sabes. Ese tonto de Etrius ni siquiera comienza a entenderlo. Debes terminar este exilio y salvar al $pod_clan$ Tremere antes de que sea demasiado tarde.#!"
 bookmark_warofprinces_meerlinda: "Meerlinda"
 bookmark_warofprinces_meerlinda_desc: "Meerlinda es la parte sobria y racional del Consejo Interno de los Siete del $pod_clan$ Tremere. Dentro de la vieja Casa Tremere, era la única mujer considerada digna por Tremere para acompañarlo a las más altas cotas de la magia.\nTiene el respeto tanto de Etrius como de Goratrix, pudiendo desempeñar el papel de pacificadora dentro del consejo. Enviada a Inglaterra, el papel de Meerlinda es doble. Preparar un nuevo hogar para el $pod_clan$ si los Cárpatos caen, e investigar los rumores sobre el Santo Grial y su efecto en los vampiros.\n\n#bold Deja que Etrius y Goratrix se vayan a la yugular. Cuando ambos fallen, el $pod_clan$ Tremere se renovará aquí... bajo tu cuidadosa supervisión.#!"
 bookmark_warofprinces_jervais: "Jervais"
 bookmark_warofprinces_jervais_desc: "El hijo de un escriba francés, Jervais tenía una pequeña chispa de talento mágico, suficiente para atraer la atención de la Casa Tremere, pero no lo suficiente para convertirse en un poderoso mago por sí mismo.\nAún así, con una fuerte dedicación combinada con una ambición despiadada, logró convertirse en uno de los principales embajadores de los Tremere, fomentando alianzas cruciales para la supervivencia de su $pod_clan$.\nComo recompensa por su continuo buen servicio, a Jervais se le ha encomendado quizás su misión más peligrosa hasta ahora: deshacerse de los cismáticos Tremere en Livonia.\n\n#bold Estás ascendiendo en la Pirámide paso a paso. Tu determinación te sacará adelante.#!"
 bookmark_warofprinces_rutor: "Rutor"
 bookmark_warofprinces_rutor_desc: "Rutor nació y se crió en tierras Tzimisce. Fue criado para la guerra, la guerra contra los Tremere que habían invadido la patria ancestral, y a la guerra fue, aunque no por elección propia. Su amo creía que Rutor estaba sometido por el vínculo de sangre, pero Rutor era inmune a esto y terminó traicionándola ante sus enemigos, ganándose el $pod_Embrace$ del $pod_clan$ Tremere como una recompensa a su manera.\nRutor, sin embargo, estaba tan descontento y rebelde como siempre y cuando creyó que su período de aprendizaje había terminado, se fue para establecer su propia base de poder. Después de años de viajar y evitar el contacto con su $pod_clan$, ha terminado en Escandinavia, donde intenta convertirse en Príncipe de Copenhague.\n\n#bold Eres tu propio amo y forjarás tu propio destino.#!"
 bookmark_warofprinces_xavier: "Xavier de Cincao"
 bookmark_warofprinces_xavier_desc: "Uno de los magos más poderosos de la Casa Tremere, Xavier de Cincao no es un miembro del Consejo muy activo políticamente, prefiriendo centrar su atención en aprender los secretos de lo sobrenatural, incluso más allá de los vampiros y los magos.\nComo tal, no fue una gran sorpresa cuando Xavier comenzó a hacer incursiones en el norte de África, viéndolo como una buena base de operaciones para aprender más sobre este continente, bastante misterioso para los Tremere. Aún así, Xavier no rehúye sus deberes tampoco, y la influencia de Tremere tanto en España como en el Magreb se ha expandido enormemente desde su llegada.\n\n#bold Hay secretos que aprender, pactos que hacer... todo para la gloria del $pod_clan$, por supuesto.#!"
 bookmark_warofprinces_therimna: "Therimna"
 bookmark_warofprinces_therimna_desc: "Therimna fue una vez la aprendiz de Goratrix, quien vio en ella tanto una chispa mágica inherente como talento y dedicación. Pronto notó el fallo de la inmortalidad y suplicó a su maestro que la $pod_Embrace$, lo cual él hizo, antes de nombrarla la verdugo oficial del $pod_clan$ Tremere, papel en el que se deleitó.\nSin embargo, ante los muchos peligros con los que el joven $pod_clan$ Tremere se vio obligado a contender, perdió la esperanza. Ahora está haciendo tratos con cualquier Príncipe dispuesto a escucharla y albergarla, sabiendo que es solo cuestión de tiempo antes de que los Tremere descubran su traición.\n\n#bold Sobrevivirás. No importa el costo, o las traiciones o las dificultades que tengas que soportar, todo esto vale la pena al final.#!"
 bookmark_warofprinces_virstania: "Virstania"
 bookmark_warofprinces_virstania_desc: "Virstania era la aprendiz más joven en la orden Tremere en alcanzar el rango de mago, pero debido a que era tan joven, no pudo entablar amistades con los otros magos.\nGoratrix creía que Virstania estaba madura para ayudarlo en su próximo proyecto. Fue Abrazada y, después de un año de tutoría junto a Goratrix, se puso a trabajar incubando a los primeros Gárgolas. Los bañó con un amor inquebrantable y ellos respondieron a ella como polluelos a su madre. A medida que pasan los años, Virstania ha llegado a preocuparse más por sus creaciones que por sus compañeros Tremere.\n\n#bold Lucharás en las guerras de los Tremere, pero anhelas la noche en que tus hermosos bebés finalmente puedan ser libres.#!"
 bookmark_warofprinces_abetorius: "Abetorius"
 bookmark_warofprinces_abetorius_desc: "Abetorius fue enviado por primera vez a Grecia en el siglo XII por nada menos que el propio Tremere. Al llegar a la región, inicialmente estaba basado en Constantinopla bajo el patronazgo tentativo de los Toreador michaelitas. Su misión oficial era establecer lazos diplomáticos, mientras que su verdadera tarea era cazar a una fugitiva Tremere, Theresa Kymena, e investigar los rumores de un Salubri escondido en la ciudad. Con la 4ª Cruzada destrozando Grecia, Abetorius se ha unido a Ana Comneno, con la esperanza de ganar un poderoso aliado una vez que la ayude a recuperar la Ciudad del Deseo del Mundo.\n\n#bold Aunque la situación ha cambiado, la misión no. La fugitiva debe ser llevada ante la justicia y la posición de los Tremere en la región asegurada.#!"
 bookmark_warofprinces_amichai: "Amichai"
 bookmark_warofprinces_amichai_desc: "Un hábil mago y cabalista, el talento de Amichai para la magia desapareció por completo tras su $pod_Embrace$, pero su facilidad con Dominación y Auspex resultó prodigiosa. Incapaz de progresar a través de la Casa y la creciente pirámide, su [Glossary('Sire','game_concept_Sire_desc')] convirtió lo que podría ser una vergüenza para ella en una bendición, enviando a su vástago a la India.\nInstalándose entre la población judía de Cochin, Amichai ha cautivado con éxito a varios mortales importantes dentro de Mangaluru, actuando como mecenas de caravanas de mercaderes. Su falta de destreza mágica hace que los Danava lo descarten, incluso mientras mantiene una relación casual y cordial con los Ravnos de la India.\n\n#bold Siempre te subestimaron. ¡Es hora de demostrarles que están equivocados asegurando la posición del $pod_clan$ Tremere en la India!#!"
                                                                                                                 
 bloodlines_sub_bookmark: "Linajes" 
                                                       
 bm_1230_warofprinces_sub_bloodlines: "Linajes" 
 bm_1230_warofprinces_sub_bloodlines_desc: "Los 13 clanes principales no son los únicos que acechan la noche. Desde la druídica Lhiannan hasta los asiáticos Wan Kuei, la sangre tiene muchas variaciones. Estos linajes tienen alguna distinción inherente de los clanes tradicionales de Caín, ya sea en sus debilidades, Disciplinas o ambas. Muchos de estos linajes son, en efecto, un clan dentro de un clan.\nAlgunos son muy influyentes, como los Wan Kuei en Asia o los Anda en las Estepas, mientras que otros están tambaleándose al borde del olvido, haciendo de cada linaje un asunto diferente y complicado.\n\n#bold Se sabe que los 13 clanes principales fluctúan dependiendo de su fortuna política, como con la reciente ascensión de los Tremere entre ellos. Quizás sea el momento de otro cambio.#!" 
 bookmark_warofprinces_deverra: "Deverra"
 bookmark_warofprinces_deverra_desc: "Nacida como una niña dotada mágicamente en Livonia en una familia devota al Dios Telyavel, Deverra nunca olvidó su verdadera lealtad, incluso cuando el $pod_clan$ Tremere la acogió como aprendiz. Pidió ser trasladada a su tierra natal, Livonia, para estudiar la Hechicería Koldúnica de los Tzimisce.\nPronto censurada por el resto del Clan por sus costumbres paganas, Deverra y su aquelarre tuvieron que buscar nuevos aliados, que encontró en el señor de la guerra mongol Qarakh. Pronto se convirtieron en algo más que aliados y ahora protege obedientemente tanto a él como a su pueblo de la inminente ofensiva cristiana.\n\n#bold Tu fe está muriendo, pero todavía hay esperanza de renovación. Mantente firme y fiel a Telyavel y aún podrías prevalecer.#!"
 bookmark_warofprinces_magda: "Magda"
 bookmark_warofprinces_magda_desc: "Magda nació en los años antes de la invasión final de los Fir Bolg a Irlanda, iniciada a una edad temprana en el sacerdocio druídico. Durante la invasión, los Fir Bolg brutalizaron el cuerpo de Magda y la dejaron por muerta, apenas aferrada a la vida hasta el anochecer. Su sire eligió $pod_Embrace$ a la joven en lugar de ver sus talentos perdidos en la muerte.\nMagda descendió sobre los intrusos con una furia que bordeaba la locura, arrojándolos de vuelta al mar de donde vinieron. En los milenios que siguieron, la Bruja de Connacht ha buscado tomar suficiente sangre para compensar lo que ella ve como el asesinato insidioso de las costumbres de su pueblo.\n\n#bold Los normandos pagarán, los nórdicos pagarán, los romanos pagarán... Irlanda se teñirá de rojo sangre muy pronto.#!"
 bookmark_warofprinces_marconius: "Marconius"
 bookmark_warofprinces_marconius_desc: "Mago mortal antes del $pod_Embrace$, Marconius se especializó en alquimia y trabajó para crear un ser perfecto. Durante el reinado del emperador Juliano el Apóstata, bebió una pócima hecha con sangre de Fae Unseelie, cambiando rápidamente en el proceso.\nNo hace falta decir que otros Lasombra se dieron cuenta. Con sus crecientes contactos en el mundo de las Fae y su rápida fortaleza asegurada de Estrasburgo, no han podido actuar contra él hasta ahora. Sin embargo, los rumores de que experimenta con sus 'aliados' fae pronto podrían crear una brecha en las defensas de Marconius.\n\n#bold Caminas por una línea peligrosa entre aprender más sobre tu condición y mantener seguro tu Principado. Asegúrate de no caer.#!"
 bookmark_warofprinces_godewin: "Godewin"
 bookmark_warofprinces_godewin_desc: "Imagina al caballero perfecto, un modelo de galantería, ingenio y gracia que se ha ganado los elogios de la propia Matriarca Salianna. Godewin, exteriormente, es ese hombre. Se dice que desciende de los reyes merovingios, ha gobernado Noyon desde principios del siglo XII con inteligencia y habilidad.\n\nLa verdad es un poco más complicada.\n\nGodewin es miembro de los misteriosos Hijos de Ennamaru, un linaje de infernalistas controlados por su demonio homónimo. Completamente devotos a su impío maestro, los Hijos juegan el juego largo, tratando de aumentar su número e influencia hasta que llegue el día del juicio final. Ese día será el glorioso momento en que Ennamaru se levante para precipitar la Gehena sobre los vampiros y deje a sus fieles hijos como herederos del mundo.\n\n#bold No saben a quién perteneces. Cuando lo sepan, ya será demasiado tarde.#!"
 bookmark_warofprinces_volgirre: "Philippe Volgirre"
 bookmark_warofprinces_volgirre_desc: "Un viejo y rencoroso barón feudal de Francia, que gobierna a sus súbditos haciéndose pasar por un noble mortal, Volgirre es un hombre mezquino y sádico de poca importancia para los asuntos de los verdaderos poderes en la región. La mayoría lo ve como poco mejor que un Tzimisce y una mancha en el porte regio de los Toreador franceses. En privado, sin embargo, algunos están fascinados por la forma de arte más cruda y desenfrenada que el Barón está cultivando.\nSin embargo, incluso ellos no podrían predecir el impacto que este hombre rencoroso tendrá en el Clan Toreador durante siglos.\n\n#bold Odias a esos altivos señores y damas con sus delirios de caballería y honor. Odias a aquellos que siguen un código de moralidad y no se entregan a sus impulsos más básicos. Los odias a todos.\nUna noche, se demostrará que tienes razón, y ellos te odiarán contigo.#!"
 bookmark_warofprinces_chinkhai: "Chinkhai"
 bookmark_warofprinces_chinkhai_desc: "En poder y edad, Chinkhai es casi inigualable en las Estepas. Nieto de Dobrul el hombre y vástago de Dobrul el vampiro, ha vigilado la tumba de su [Glossary('Sire','game_concept_Sire_desc')] durante siglos. Es responsable de la defensa de su pueblo, los [Glossary('Anda','podgloss.anda')], contra los asiáticos [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] y otros monstruos de la noche.\nNómada de corazón, Chinkhai está asolando las tierras [Glossary('Anda','podgloss.anda')], impartiendo justicia donde quiera que va, ya sea contra intrusos que traspasan o contra sus rebeldes hermanos. Como la estepa en la que pasa tanto tiempo, no es ni amable ni indulgente y su estilo de justicia es a menudo despiadado.\n\n#bold Se te ha confiado la defensa de los [Glossary('Anda','podgloss.anda')] y lo harás. Lástima para los que se interpongan en tu camino.#!"
 bookmark_warofprinces_catubodua: "Catubodua"
 bookmark_warofprinces_catubodua_desc: "Nacida como princesa del desaparecido reino de Ur, Catubodua era considerada la mujer más bella que vivía en la legendaria Segunda Ciudad. Cercana tanto a Brujah como a Troile, se horrorizó cuando ambos entraron en un conflicto sangriento.\nHuyendo de la ciudad, desde entonces se la conoce como una Diosa Gala (cuyo nombre aún usa hasta esta noche) y una fuerza importante detrás de la renovación carolingia. Finalmente encontrando lo que buscaba en Francia, ha partido a tierras lejanas, buscando conocimiento perdido para ayudar a su decadente $pod_clan$.\n\n#bold Hiciste una promesa a Brujah y tienes la intención de cumplirla, no importa el tiempo que lleve.#!"
 #bookmark_warofprinces_dyanang: "Dyanang"
 #bookmark_warofprinces_dyanang_desc: "La Emperatriz de la Corte del Fénix Escarlata, Dyanang, es conocida como una gobernante relativamente benigna, que deja que todos encuentren su propio camino... la mayoría de las veces. A pesar de esto, o quizás por eso, su Corte es conocida como una experiencia violenta y frenética para vivir.\nSu extraña, pero aparentemente fuerte, alianza con el Pueblo Feroz de las selvas de Angkor y Dai Viet le ha permitido mucha libertad en cómo lidiar con aquellos que van demasiado lejos en la búsqueda de emociones.\n\n#bold Tu Corte se mantiene firme y podría ser el momento de dejar de mirar hacia adentro. Los herejes indios son siempre una amenaza, una que crece más preocupante con cada noche que pasa.#!"
 bookmark_warofprinces_rocklord: "Señor de la Roca"
 bookmark_warofprinces_rocklord_desc: "Chaundice fue el primer Gárgola considerado un éxito total por Goratrix y Virstania. Sirvió fielmente durante años hasta que su amo Tremere murió durante un ataque. Probando la libertad por primera vez, Chaundice se enfrenta ahora a algo nuevo: una elección.\n¿Prestará vasallaje a los demonios, regresará a sus amos hechiceros o forjará su propio camino a través de la sangre?\n\n#bold Los que esperan en el Señor renovarán sus fuerzas. Volarán con alas como las águilas.#!"
 bookmark_warofprinces_adisa: "Adisa"
 bookmark_warofprinces_adisa_desc: "Si las leyendas son ciertas, Adisa es hija de Freyja, una valquiria que no se inclina ante ningún hombre. Durante sus viajes, atrajo la ira de un rey persa que lanzó a todo su ejército contra ella por negarse a servirle. Después de una larga batalla, Adisa quedó vencida pero no doblegada.\nPidiendo a Freyja su derecho a la venganza, Adisa regresó como un espíritu implacable y destrozó el castillo del rey persa. Cumplido su deber, Adisa eligió quedarse en Midgard para ayudar a las otras mujeres que también han sido agraviadas, reuniéndolas bajo el nombre de su enemigo caído que era suyo por derecho de conquista: Ahriman.\n\n#bold Como campeona elegida de Freyja, debes luchar para proteger y elevar a sus hijas.#!"
 bookmark_warofprinces_lamia: "Lamia"
 bookmark_warofprinces_lamia_desc: "A través de los siglos, el Culto de Lamia permaneció como un secreto guardado de tiranos, senadores y reyes que pisoteaban los destinos de los hombres bajo sus talones. Fue Lázaro de los Cappadocios quien una noche sin luna la encontró.\nLa erudición y el fervor de Lamia, y quizás otras cualidades, tocaron algo largo tiempo escondido en el corazón del Saqueatumbas; y así, se acercó a Lamia y la dominó bajo las miradas de desaprobación de la estatua de ébano de la Madre Oscura.\nPronto se vengó, ya que los misterios que ella conocía eran demasiado para que Lázaro los manejara. Aún así, la Sacerdotisa aceptó un pacto con su nuevo $pod_clan$.\n\n#bold Toleras a los Cappadocios, pero tu lealtad es solo a Lilith. ¡Alabada sea la Madre Oscura!#!"

 bm_1230_warofprinces_sub_adventurers: "Aventureros"
 bm_1230_warofprinces_sub_adventurers_desc: "Aunque viajar en la era de la Oscura Edad Media es una empresa peligrosa, muchos vampiros aún lo hacen. Algunos  incluso sobreviven y prosperan. Ya sean maestros de culto, líderes de una caravana, embajadores de gobernantes con tierras o grandes maestres de una orden  de caballería, estos personajes moldean el Mundo de Tinieblas tanto como sus contrapartes principescas.\n\n#bold Elige tu propio camino hacia la fortuna  como un Aventurero de las Cenizas, esos vampiros lo suficientemente audaces para desafiar los peligros del camino y aún así salir victoriosos.#!"
 bookmark_warofprinces_unnamed: "El Innombrable"
 bookmark_warofprinces_unnamed_desc: "Un ser misterioso de temor y horror, la historia del Innombrable es una red contradictoria de rumores y  desinformación. Algunos dicen que es 'el Tercer' progenitor de los Baali infernalistas, mientras que otros cuentan que es el propio vástago de Saulot,  empeñado en vengarse de su insensible sire. La Orden de la Noche Terrible ha hecho de localizarla y servirle su objetivo... cualesquiera sean sus  verdaderas metas.\n\n#bold Te has despertado recientemente. Más allá de los recuerdos de sangre, gritos y dolor, no tienes recuerdo de tu pasado. Incluso  tu nombre te elude. Es hora de buscar la verdad.#!"
 bookmark_warofprinces_aimeric: "Aimeric de Cabaret"
 bookmark_warofprinces_aimeric_desc: "Poeta, caballero honorable, amante de la belleza... Aimeric es muchas cosas, pero es ante todo uno de los embajadores  Cainitas más consumados a pesar de su juventud. Navegando por el caótico paisaje de la Francia vampírica para su dama Esclarmonde, logró ayudar a asegurar  su posición con unas pocas palabras escogidas, la cantidad justa de intriga y una pizca de seducción. Ahora está considerando renovar sus votos hacia ella  o explorar la posibilidad de una relación (profesional o de otro tipo) con la intrigante Veronique d'Orleans.\n\n#bold Tu dominio de las palabras y la  intriga política comienza a ser conocido en Francia. ¿Qué gobernante afortunado tendrá la oportunidad de usar tus talentos a continuación?#!"
 bookmark_warofprinces_dona_lupa_manrique: "Doña Lupa Manrique"
 bookmark_warofprinces_dona_lupa_manrique_desc: "La líder de la orden de caballeros de la Compañía Blanca es el tema de muchas baladas ibéricas. Una dama  caballero hermosa, mortal y honorable, Doña Manrique lleva un aire de tristeza que inflama la curiosidad de sus muchos admiradores. Su orden de caballeros  es muy similar, solo aceptando contratos cuando la justicia está claramente de su lado y comportándose con una conducta estricta que avergüenza la  naturaleza caótica de la política vampírica en la península.\n\n#bold Convertiste tu pasado en una fortaleza. Liderarás la Compañía Blanca como un faro de  honor y justicia en estas Edades Oscuras.#!"
 bookmark_warofprinces_sun_li: "Sun Li"
 bookmark_warofprinces_sun_li_desc: "Antiguo objetivo de la infame demostración de liderazgo de Sun Tzu, Sun Li ha superado desde hace mucho tiempo a su  asesino. Considerada la mejor mente militar de los $pod_kueijin$, y quizás incluso la mejor en general, ha dominado el arte de la guerra inmortal hasta un  grado sin precedentes.\nAunque muchos quisieran tener a la famosa 'Espada Auspiciosa' como su general, Sun Li no trabaja para nadie más que para sí misma,  viajando por el mundo, aprendiendo y enseñando sobre su pasión a medida que avanza.\n\n#bold A medida que los mortales e inmortales evolucionan, la guerra  cambia con ellos. Siempre hay un campo de batalla en algún lugar del mundo del que podrías aprender.#!"
 bookmark_warofprinces_folch: "Folch"
 bookmark_warofprinces_folch_desc: "Un mercenario holandés con la mala suerte de ser arrastrado a las intrigas de los vampiros franceses, pero lo  suficientemente astuto para sobrevivir a ellas, Folch fue usado y descartado muchas veces por sus 'superiores'.\nSin embargo, salió de la experiencia con  dos cosas: la inmortalidad como [ghoul|E] y un profundo resentimiento hacia los vampiros en general.\nAños de experiencia lo han curtido, y Folch ahora  lidera su banda rindiendo pleitesía a los 'amos de la noche' y sacándoles todo lo que puede sin ser castigado.\n\n#bold No tienes delirios de grandeza.  Estás aquí para sobrevivir, con suerte incluso superando a esos monstruos inmortales y demostrándoles que su perro de ataque realmente tiene dientes  afilados.#!"
 
 bm_1230_warofprinces_sub_kueijin: "Kindred del Este"
 bm_1230_warofprinces_sub_kueijin_desc: "Los Kindred del Este, conocidos por varios otros nombres en Asia, no son verdaderamente 'vampiros'. Si bien  interactúan con los Cainitas occidentales, se organizan por Dharmas y Cortes en lugar de por Clanes y tienen un conjunto completamente diferente de poderes  y habilidades.\nEl ascenso de los mongoles y sus benefactores vampíricos han sumido en el caos a las estables pero estancadas Cinco Cortes Augustas. Se  acerca un tiempo de cambio y oportunidad.\n\n#bold Sigue tu camino Dármico, resiste la caída de las Cortes y asciende a las Cien Nubes.#!"
 bookmark_warofprinces_piyau: "Piyau Payung"
 bookmark_warofprinces_piyau_desc: "Mientras el Sudeste Asiático se desmorona y es invadido por infernalistas, una mujer tiene una visión. Una visión de  feminidad extrema, arrasando todo a su paso en un mar de sangre y horror.\nAntigua ermitaña de la jungla, Piyau ha reunido una fuerza de mujeres agraviadas  renacidas para quemar el mundo que les falló. Con su carisma, sólido conocimiento marcial y temible destreza personal, el nombre de Piyau será temido o  alabado desde Papúa hasta China. Ya sea la hija del diablo o la liberadora prometida, el Asia nocturna nunca volverá a ser la misma después de su Purga. \n\n#bold Tus pasiones son ilimitadas, tu fuerza de voluntad abrumadora. El mundo está listo para aceptar tu verdad o ser reducido a polvo en tu camino.#!"
 bookmark_warofprinces_wang_kyu: "Wang Kyu"
 bookmark_warofprinces_wang_kyu_desc: "Jefe de una importante familia regional en vida, Wang Kyu conspiró varias veces para tomar el poder, pero fue  frustrado en cada intento antes de terminar decapitado. Aún siendo un hombre voluntarioso, su regreso como Kindred del Este no lo disuadió.\nUsando la  reciente quema de P'yong'yang tras una fallida rebelión religiosa, Wang Kyu terminó siendo el más rápido en aprovechar la oportunidad y se proclamó  Ancestro de la poderosa ciudad. Una posición elevada aún no reconocida por la Corte del Dragón Azul de Corea.\n\n#bold Sabes cómo aprovechar las crisis y,  con la Corte del Dragón Azul mostrando signos de debilidad, este podría ser el momento de apoderarte de lo que se te negó hace varios siglos.#!"
 bookmark_warofprinces_soo_kyung_ahn: "Soo-kyung Ahn"
 bookmark_warofprinces_soo_kyung_ahn_desc: "La hija bastarda de la Gran Sabia Xue, una diosa atrapada en forma mortal, un dragón dormido, Soo-kyung Ahn  puede contarte tantas historias sobre sus orígenes como quieras oír. La verdad es que ella misma no lo sabe. El hecho de que escapara de los  [UmbraGlossaryLocalized('yomi_wan','Infiernos Yomi')] con poderosos artefactos que aún estudia hoy da credibilidad a algunas de estas historias.\nSoo-kyung  es una hábil diplomática y una respetada intermediaria para los Ancestros coreanos. Como tal, mientras la Corte del Dragón Azul entra en un período de  crisis, muchos recurren a ella para ver si añadirá 'Ancestro de Corea' a su currículum.\n\n#bold ¿Reclamarás Corea usando tus contactos? ¿O te centrarás en  descubrir tu pasado? El próximo capítulo de tu historia es tuyo.#!"
 bookmark_warofprinces_wu_zetian: "Wu Zetian"
 bookmark_warofprinces_wu_zetian_desc: "La única emperatriz reinante reconocida de China era una mujer voluntariosa y, por lo tanto, no fue una sorpresa que  escapara de los [UmbraGlossaryLocalized('yomi_wan','Infiernos Yomi')] para convertirse en Kindred del Este. Como una recién llegada tan conocida, su  educación en los caminos de la noche ha sido confiada a los mejores maestros del Monasterio Shaolin de Luoyang.\nHasta ahora, Wu Zetian ha sido una  estudiante diligente y aplicada. Su progreso es observado de cerca, e incluso el Ancestro más hastiado se pregunta si el 'Emperador Santo' tendrá una  carrera tan notable entre las Cortes Augustas como la que tuvo en vida.\n\n#bold Esta nueva sociedad que estás aprendiendo te observa de cerca. Puede que  tengas que esperar un momento de crisis antes de mover ficha. Después de todo, sabes muy bien lo que dicen sobre los tiempos de caos...#!"
 bookmark_warofprinces_shou: "Shou"
 bookmark_warofprinces_shou_desc: "La infame 'Comefuegos' del sur de China es quizás el [akuma|E] (infernalista) activo más poderoso. Con su base de poder  lejos de las Cortes Augustas más poderosas, Shou ha sido una plaga durante siglos en la región, aunque afortunadamente actuando más como una retorcida  mentora para otros [akuma|E] que tratando realmente de expandir su influencia.\nAlgunos temen que, con el actual colapso de las Cortes, esta pequeña  bendición pueda dejar de ser cierta...\n\n#bold Asaltar las costas y ser adorada como una deidad oscura por pequeñas aldeas ha sido divertido hasta ahora,  pero esto no traerá los [UmbraGlossaryLocalized('yomi_wan','Infiernos Yomi')] a la Tierra. Si quieres ser quien abra el camino para el [Glossary('Demon  Emperor','podgloss.demonemperor')], se necesitará una acción más directa...#!"
 bookmark_warofprinces_tashimoto: "Tashimoto Hanko"
 bookmark_warofprinces_tashimoto_desc: "El más célebre general de los Gaki japoneses ('vampiros') es un hombre misterioso. Aunque exteriormente es leal y  dedicado a la causa de asegurar la independencia de Japón de las Cortes continentales, abundan los rumores sobre de dónde provienen realmente sus  habilidades tácticas y su formidable destreza.\nHanko, hasta ahora, no se ha visto obligado a proporcionar más detalles sobre su nebuloso pasado. Si  llegara a fallar, sin embargo, preguntas difíciles podrían apartar al principal defensor de Japón de su puesto.\n\n#bold Lo que no saben no les hará daño.  Lo que tú sí sabes es que tienes los mejores intereses de Japón en el corazón.\nIncluso cuando esos intereses no se alinean con las familias gobernantes.#!"
 bookmark_warofprinces_yukio: "Yukio"
 bookmark_warofprinces_yukio_desc: "Yukio es una de las pocas mujeres que logró escapar del temible [Glossary('Emma-O','podgloss.emmao')]  [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')]. Habiendo desarrollado un profundo odio por el más poderoso [Glossary('Yama King','podgloss. yamaking')], Yukio comenzó el extenuante régimen de entrenamiento de Kuro-sama, el maestro de los asesinos japoneses.\nAunque aún muy joven en su segunda  vida, Yukio está decidida a sobresalir en su entrenamiento y convertirse en un arma que incluso su torturador demoníaco aprenderá a temer.\n\n#bold La  penalización de Kuro-sama por fallar su entrenamiento es la muerte, pero no aceptarías menos. Triunfarás, te convertirás en el mejor ninja que Japón haya  visto y luego acabarás con el propio [Glossary('Emma-O','podgloss.emmao')].#!"
 bookmark_warofprinces_ma_hai_lan: "Ma Hai-Lan"
 bookmark_warofprinces_ma_hai_lan_desc: "La General Ma es una rareza entre los vampiros chinos de inclinación más erudita. Mientras muchos son ajenos a la  amenaza que representan los [Glossary('Anda','podgloss.anda')] y los infernalistas, Ma Hai-Lan cree que solo una acción decisiva y, si es necesario, brutal  puede salvar la Corte Augusto China.\nPensando que el sistema actual necesita una llamada de atención antes de que sea demasiado tarde, ha reunido a otros  jóvenes Kindred del Este de ideas afines a su lado para preparar el futuro.\n\n#bold Las Cortes Augustas se están desmoronando. Solo tu fuerza de voluntad  y tu brazo armado pueden salvar a China de una marea de caos.#!"
 bookmark_warofprinces_li_jue: "Li Jue"
 bookmark_warofprinces_li_jue_desc: "En otra vida, Li Jue fue un señor de la guerra influyente. Hoy en día, es la última línea de defensa de la caída Corte  de la Tortuga Negra contra la horda de infernalistas que vienen a terminar el trabajo.\nVisto como una figura heroica por una generación de jóvenes Kindred  del Este, Li Jue sabe que la tarea que tiene por delante es inmensa.\nLástima que siempre fue demasiado terco para saber cuándo rendirse.\n\n#bold Parece  que siempre estás en el centro de los cambios de era. Esta vez, sin embargo, parece que luchas por una buena causa.\nNo es que creas que eso vaya a cambiar  mucho.#!"
 
 
 bm_1230_inquisitor_sub_zadruga: "Zadruga"
 bm_1230_inquisitor_sub_zadruga_desc: "Criados durante muchas generaciones para servir a los Tzimisce, los Zadruga caminan en la línea entre los vivos y los  muertos, y entre el siervo y el vasallo. No son del todo humanos; en algún punto entre humanos y vampiros, existen fuera de las normas sociales. Algunos  adoran a los vampiros como dioses, mientras que otros aspiran a alcanzar ese estado ellos mismos. Los Zadruga sirven como peones mortales y posibles  candidatos para el Abrazo. Siglos de contacto vampírico, infusiones de sangre vampírica y endogamia han transformado a los reanimados en un tipo distintivo  de criatura sobrenatural."
 bookmark_inquisitor_oberto_grimaldi: "Oberto Grimaldi"
 bookmark_inquisitor_oberto_grimaldi_desc: "Los Grimaldi son el principal enlace de los Tzimisce con la sociedad humana y las ciudades-estado italianas.  Estos intermediarios pasan su tiempo en la sociedad y los ambientes sociales, manteniendo una fachada de normalidad. Son las familias de [Glossary('Revenant','game_concept_revenant_desc')] más 'humanas' y generalmente están a cargo de mantener las propiedades Tzimisce y servir como intermediarios  para el Sabbat en empresas mortales como las finanzas y la política. Otras familias [Glossary('Revenant','game_concept_revenant_desc')] ven a los Grimaldi  como débiles y los desprecian. Los Grimaldi devuelven el favor, viendo a las otras familias como esclavos sin mente y fenómenos. Aún así, la recién formada  alianza con los influyentes Přemyslidas proporciona una ayuda potencialmente importante. Quizás sea el momento de expandirse.\n\n#bold El vasallaje de los  Grimaldi a Roberto d'Agostino de Génova es nominal en el mejor de los casos. Los Grimaldi tienen casi tanta influencia en la ciudad como ese Magíster. Los  Tzimisce seguramente respaldarán un movimiento de los Grimaldi por el control. Mónaco es un buen lugar para unas vacaciones.#!"
 bookmark_inquisitor_adrian_szantovich: "Adrián Szantovich"
 bookmark_inquisitor_adrian_szantovich_desc: "Una familia rica de diletantes degenerados, los Szantovich sienten que su estrella está ascendiendo entre los  Tzimisce. Hace un siglo, uno de los suyos, Radu, se ha elevado para convertirse en el Voivoda Cainita de Bistriz.\n\nEl patriarca de la familia viva,  Adrián, casi un siglo más joven que Radu, ha visto cómo el ahora anciano kindred ha involucrado a la familia en sus planes relacionados con el Consejo de  Cenizas formado por los Ventrue.\n\n#bold En verdad, Adrián y sus parientes se han vuelto decadentes y depravados, pero eso no los hace menos peligrosos.#!"
 bookmark_inquisitor_nepos_obertus: "Nepos Obertus"
 bookmark_inquisitor_nepos_obertus_desc: "Los Obertus son la más antigua de las familias Zadruga. Hace mucho tiempo, sirvieron al enigmático anciano Dracon,  el Espíritu del Triunvirato del Sueño. Con el saqueo de Constantinopla en 1204, su amada Biblioteca de los Olvidados ardió. Desde entonces, esta familia de  eruditos ha estado tratando de restablecerse en bibliotecas ocultas y monasterios de toda Europa del Este. Aún sirven a los vástagos y nietos del Dracon,  concretamente a Symeon y Myka Vykos. Aunque ahora están lejos de su hogar ancestral en Bizancio, se encuentran en una tierra fronteriza entre el Voivodato  y los Ventrue de la Cruz Negra.\n\n#bold Es una posición política difícil para los eruditos, pero con suficiente estudio, aún pueden encontrar una manera  de perdurar e incluso prosperar.#!"
 bookmark_inquisitor_sambor_bratovitch: "Sambor Bratovitch"
 bookmark_inquisitor_sambor_bratovitch_desc: "Históricamente cuidadores de perros y señores visibles para los Tzimisce, los Bratovitch son conocidos por su  violencia salvaje, animalista y su ira apenas controlada. Monstruos brutales que generalmente sirven a los Tzimisce, son luchadores y rastreadores, y rara  vez participan en eventos sociales refinados. También son los maestros de perreras de sus señores, criando perros, lobos y otros animales salvajes para que  sus amos los transformen en criaturas temibles que puedan lanzar contra sus enemigos.\n\n#bold Sambor lidera su familia a través de su fuerza bruta y su  notoriedad por haber matado a varios lupinos. Se dice que tiene apetitos inusuales.#!"
 bookmark_inquisitor_vlastimir_vlaszy: "Vlastimir Vlaszy"
 bookmark_inquisitor_vlastimir_vlaszy_desc: "Estos señores de los caballos Vlaszy tienen herencia tanto magiar como eslava. En tiempos antiguos, el Clan  Tzimisce salvó a los Vlaszy. Desde esa noche, los caballeros han jurado lealtad reforzada por juramentos de sangre a los Dragones.\n\nVlastimir es, como  muchos, un feroz guerrero de su familia. Su crueldad en la guerra le valió la atención de Ioan Brancoveanu. Vlastimir ahora sirve como su fiel mano  izquierda.\n\n#bold Si Vlastimir alguna vez tuvo alguna duda sobre su lealtad a Brancoveanu, quedó completamente aniquilada por la fuerza de su juramento  de sangre.#!"
 bookmark_inquisitor_premysl_otakar: "Otakar Přemysl"
 bookmark_inquisitor_premysl_otakar_desc: "La Casa de Přemyslid está entre las dinastías reales más importantes de Europa, con el mando de un gran Reino de  Bohemia que se extiende desde el Mar Báltico hasta Hungría. El enigma de su éxito son sus lazos de sangre con el clan Tzimisce.\n\nWenceslao I ha tomado  recientemente el control de sus asuntos mortales, mientras que su padre, Otakar, centra el verdadero propósito de la familia como sirvientes de Shaagra,  Diosa de los Vroi. ¿Puede Otakar seguir contento con ser un mero lacayo? Si los Zadruga pudieran unificarse de alguna manera... la red de alianzas que  Otakar ha creado ciertamente abre una serie de posibilidades.\n\n#bold El repulsivo Nosferatu Josef Zvi con sus advenedizos aliados Prometeicos han  expulsado a la familia de su hogar ancestral en Praga. Es hora de recuperar la sede ancestral.#!"
 bookmark_inquisitor_vilhelm_danislav: "Vilhelm Danislav"
 bookmark_inquisitor_vilhelm_danislav_desc: "Originalmente una dinastía noble con vínculos con los Señores de la Sombra, los Danislav del norte de  Transilvania cayeron bajo el influjo del cruel Tzimisce Florescu, quien los mantiene en sus mazmorras durante los primeros diez años de sus vidas para  condicionarlos a que le sirvan. El Conde Florescu estaba ansioso por mostrar su triunfo y envió a sus [Glossary('Revenants','game_concept_revenant_desc')]  como embajadores y diplomáticos a los dominios de otros Tzimisce. Ganó gran prestigio ya que su familia culta ganó reputación por sus servicios.\n\nAunque  parecen perros leales, algunos de los Danislav han logrado mantener una pizca de sus viejas costumbres. Durante el día, mientras su maestro duerme,  realizan ritos para contactar espíritus que los liberen de su eterna esclavitud y les devuelvan una vez más la bendición del lobo.\n\n#bold ¿Es ese trueno  junto con los aullidos de lobos que se oyen a lo lejos?#!"
 bookmark_inquisitor_gedivilas_khazi: "Gedivilas Khazi"
 bookmark_inquisitor_gedivilas_khazi_desc: "Bizarros y extraños incluso para los estándares de otras casas Zadruga, los Khazi son los sirvientes fanáticos  de Byelobog, 'el Dios Blanco'. Escondidos en las pútridas Marismas de Pripet, pocos humanos han tenido la oportunidad de ver las pieles albinas de estos  cultistas. A los cultistas no les importa el mundo exterior: no forman alianzas ni construyen relaciones externas. Todo lo que tienen y todo lo que son es  gracias a Byelobog.\n\nEl patriarca de los Khazi, Gedivilas, es también el celoso sumo sacerdote de Byelobog. Cada vez más, ha comenzado a tener visiones  perturbadoras de una seria amenaza no solo para su familia sino para su propio Dios. Gedivilas teme a los enemigos en todas partes: desde misioneros  cristianos, otros Tzimisce e incluso miembros de su propia familia que sospecha que están flaqueando en su fe.\n\n#bold ¡Byelobog debe ser defendido a toda  costa!#!"
 bookmark_inquisitor_ladislau_rustovitchi: "Ladislau Rustovitchi"
 bookmark_inquisitor_ladislau_rustovitchi_desc: "La casa Zadruga favorita del Voivoda de Voivodas, Vladimir Rustovitch, ha criado y educado cuidadosamente a  sus propios parientes mortales para que sean sus fieles guerreros y sirvientes. La familia es conocida por tener una naturaleza colérica, una tendencia que  Vladimir sin duda ha fomentado. Aunque esto los hace formidables, la guerra constante por el Voivodato ha diezmado severamente sus números.\n\n#bold Parece  que su destino está inevitablemente ligado a Vladimir. ¿O no?#!"
 bookmark_inquisitor_alexandru_basarab: "Alexandru Basarab"
 bookmark_inquisitor_alexandru_basarab_desc: "Poderosos en la batalla, los Tzimisce dan a estos señores de la guerra Zadruga cierta libertad en su política  y cría con la nobleza mortal rumana local. En las noches futuras, la casa llegará a gobernar el reino mortal de Valaquia.\n\nPor ahora, el patriarca de la  familia Alexandru jura lealtad a Radu de Bistri, pero los rumores sugieren que puede tener otro patrón. Ciertamente tiene lazos familiares con el ambicioso  neonato Tzimisce Dragomir de Zarand.\n\nCon el tiempo, la familia se dividirá en dos ramas: los Danesti y los Drăculești.\n\n#bold Drăculești... ese nombre  suena siniestro.#!"
 bookmark_inquisitor_rodislav_narov: "Rodislav Narov"
 bookmark_inquisitor_rodislav_narov_desc: "Una familia noble eslava que ha mantenido sus costumbres paganas, Razkoljna ha utilizado a estos pálidos  acechadores como sus agentes en toda Polonia. A través del matrimonio mixto con los Szantovich y los Obertus, es una cuestión de si la familia continuará  sobreviviendo o simplemente será absorbida por casas Zadruga más grandes y poderosas.\n\nAunque Rodislav fue entrenado como médico, una habilidad que ha  mejorado con la vicisitud, tampoco es el bisturí más afilado del cajón.\n\n#bold Cualquier ambición que haya podido tener ha sido agotada por su vínculo de  sangre y la dominación del Príncipe de Cracovia.#!"
 bookmark_inquisitor_bezprym_slatikov: "Bezprym Slatikov"
 bookmark_inquisitor_bezprym_slatikov_desc: "Una subfamilia de la menguante Casa Narov, la familia recientemente ganó cierto favor del príncipe de Cracovia.  Hace menos de una docena de años, un joven vástago diplomático de la casa, Zara, fue abrazado por Razkoljna.\n\n#bold ¿Recordará Zara sus raíces y  protegerá a su familia, o seguirán las fortunas de los Slatikov a los decadentes Narov?#!"
 bm_1230_inquisitor_sub_revenants: "Reanimados"
 bm_1230_inquisitor_sub_revenants_desc: "Es posible que los atributos de los ghouls se vuelvan innatos. Las características de los ghouls pueden, con  esfuerzo, ser heredadas a través de varias generaciones de ghouls mediante los esfuerzos de cría de sus amos vampiros, dando como resultado una familia de  reanimados; ghouls cuyos cuerpos producen vitae de forma natural. Las familias de ghouls hereditarios creadas por los Tzimisce no son las únicas dinastías  de este tipo que existen en el mundo. Fuera de las tierras eslavas, se pueden encontrar varias familias 'reanimadas', creadas a partir de la sangre de  otros clanes por diseño o casualidad."
 bookmark_inquisitor_esona_bomkazi: "Esona Bomkazi"
 bookmark_inquisitor_esona_bomkazi_desc: "La bruja de la vida Bomkazi realizó un gran ritual que le permitió a ella y al nigromante vampírico Impundulu  concebir una hermosa niña, pero el ritual tuvo un precio. Inmediatamente después de la concepción, tanto Impundulu como Bomkazi sintieron que algo era  diferente en su hijo. Como producto de la vida y la muerte, la niña, a la que llamaron Esona, era una [Glossary('Revenant','game_concept_revenant_desc')].  La esencia de Impundulu y Bomkazi se había mezclado hasta tal punto que Esona y sus descendientes serían para siempre inmunes al vínculo de sangre,  mientras que el linaje de Impundulu ya no podría alimentarse de nadie más que de ellos. Cuando Esona fue lo suficientemente mayor, se ofreció  voluntariamente para sustentar al vástago Laibon de su padre, a quien consideraba su propio hermano. De esta unión inicial, crecieron fuertes lazos entre  la línea mortal de Esona, que llamó Bomkazi en honor a su madre, y el linaje de Impundulu.\n\n#bold ¿Será eterno el pacto entre la vida y la muerte?#!"
 bookmark_inquisitor_berthold_ducheski: "Berthold"
 bookmark_inquisitor_berthold_ducheski_desc: "Los Krevcheski eran una oscura familia de eruditos con gran interés en las máquinas de asedio, los mecanismos  de relojería y el ocultismo. Los entrometidos se abrieron camino en las cortes de los Zadruga y finalmente encontraron en los Tzimisce a sus entusiastas,  aunque extravagantes, patrocinadores.\n\nLa relación con los demonios no sería eterna. Un nuevo poder surgió en la tierra, o más bien un viejo poder  transformado. Los magos hermeticos de la Casa Tremere no solo robaron la sangre de los Tzimisce para convertirse en Cainitas, sino que también convencieron  a los Krevcheski de traicionar a sus amos. Ahora llamados Ducheski, los relojeros están sujetos a los dictados de los magos Usurpadores. Berthold Ducheski  lidera la familia por la fuerza de su intelecto y una acumulación de conocimiento prohibido.\n\n#bold A pesar de toda su astucia, es incapaz de alterar la  situación que crearon sus antepasados.#!"
 bookmark_inquisitor_tajaddin_kairouan: "Tajaddin"
 bookmark_inquisitor_tajaddin_kairouan_desc: "Los Kairouan son una familia [ghoul|E] creada a través de experimentos de hechiceros Assamitas en [Glossary('Revenants','game_concept_revenant_desc')] Tzimisce. Originarios de la provincia homónima en el norte de África, son entrenados desde el nacimiento para  ser candidatos al abrazo, aunque cada casta busca reclutas de este linaje.\n\nTajaddin se ha entrenado como guerrero con especialidades en subterfugio e  infiltración. Aunque aún no ha sido elegido para el abrazo, confía en que con un servicio diligente será recompensado algún día. Sospecha que el clan lo  mantiene como 'ganado reproductor' y lo juzga en función de hacer crecer la familia transmitiendo con éxito la sangre entre generaciones. No está por  encima de hacer una inversión muy personal en su parentela para ayudar a garantizar el resultado.\n\n#bold ¿Será abrazado? El tiempo lo dirá.#!"
 bookmark_inquisitor_pavel_angustri: "Pavel"
 bookmark_inquisitor_pavel_angustri_desc: "En su guerra contra las fuerzas de Baba Yaga, Durga Syn y sus vástagos Ravnos a veces han creado ghouls entre los  pueblos nómadas de Rusia. A lo largo de los siglos, algunos de ellos se han reproducido fielmente. Dotados con poderes de ocultación, agilidad  preternatural y la segunda vista, han sido excelentes agentes para la lucha del caos contra la Cortina de Sombras de Baba Yaga.\n\nPara los mortales, la  familia Angustri es vista con desconfianza como charlatanes y brujas. Tienen reputación de ser tanto seductores como engañosos. Pavel lidera a su familia  con su personalidad amigable y una red de mentiras.\n\n#bold Las frías noches rusas están llenas de terrores, tu mejor esperanza está con una mentora  amable.#!"
 bookmark_inquisitor_dhangadeva_nirriti: "Dhangadeva"
 bookmark_inquisitor_dhangadeva_nirriti_desc: "Los Nirriti son una familia de la casta Brahamin, el karma les ha dado una gran carga. Los dioses Shiva,  Rudra y Vritra decretaron que deben servir a un grupo de demonios sagrados: los Daitya.\n\nActuando como patriarca de la familia y sumo sacerdote del culto  a Nirriti, Dhangadeva es un administrador eficiente de los asuntos del culto, aunque no es el más iluminado espiritualmente. Aún así, la sangre mística de  sus antepasados le ha servido bien en los conceptos básicos del verdadero Raktamaya: el Yoga de la Ilusión. La sangre es preciosa y debe asegurarse de que  la familia mantenga este gran tesoro. Con él, pueden servir a sus amos demoníacos lo mejor que puedan, como Shiva ha decretado.\n\n#bold Cambia el mundo  con asesinatos, engaños y profanación de los ritos sagrados para que Shiva abra su tercer ojo y traiga un mundo nuevo.#!"
 bookmark_inquisitor_khachigun_kurulas: "Khachigun"
 bookmark_inquisitor_khachigun_kurulas_desc: "Uno de los yasun, una extensa familia mortal de los [Glossary('Anda','podgloss.anda')], los Kurulas han sido  bendecidos por Itügen con una fracción del poder de los [Glossary('Anda','podgloss.anda')]. Existen en el punto medio entre el día y la noche.\n\nKhachigun  lidera a su familia mientras cabalgan por la estepa como parte de la horda de Gengis Kan. Un guerrero de vida dura y mal genio, como patriarca de la  familia se apega a un código de honor. La guerra es larga y, a veces, cuando ha bebido demasiado, busca una distracción demasiado cerca de casa.\n\n#bold  Cabalga con los hermanos de sangre y demuestra que eres digno del abrazo.#!"
 bookmark_inquisitor_valenti_crassus: "Valenti"
 bookmark_inquisitor_valenti_crassus_desc: "Antaño una familia de patricios romanos, estos amorfales [Glossary('Revenants','game_concept_revenant_desc')]  ofrecen con entusiasmo sus servicios a los Cainitas a cambio de poder. Como sus posesiones están en el sur de Italia, suelen ser los Lasombra quienes  llenan sus cofres.\n\nComo pater familias de los Craso, Valenti es un negociador augusto, pero con apetitos decadentes.\n\n#bold Aunque actualmente se alía  con el Clan de las Sombras, un pequeño empujón podría llevarlo a servir a la pecaminosa corte de Camila.#!"
 bookmark_inquisitor_habil_qarnaim: "Habil"
 bookmark_inquisitor_habil_qarnaim_desc: "En las largas y oscuras noches cerca de Túnez, algunos todavía cuentan las historias y cantan las canciones de la  Cartago vencida. Roma, bajo el liderazgo de sus amos secretos, trató de destruir Cartago. Mataron a los héroes, derribaron las murallas, dispersaron o  esclavizaron al pueblo y sembraron los campos con sal.\n\nEl pueblo se había preparado. La sangre de Troile y Aníbal corre por sus venas. Nombrado por su  padre como el gran general, Habil ha asumido la responsabilidad de liderar a su tribu para proteger los lugares sagrados secretos de 'los Sabios' como  Jebel Boukornine. Esperan, observan y se preparan para la guerra. Alguien vendrá a reconstruir la ciudad y despertar a los durmientes. Se necesitarán actos  oscuros y promesas cumplidas.\n\n#bold ¡El señor es misericordioso! ¡Veremos Cartago restaurada!#!"
 bookmark_inquisitor_mohkku_keskinen: "Mohkku"
 bookmark_inquisitor_mohkku_keskinen_desc: "Los Keskinen sirven a la anciana loca llamada Louhi. Se desconoce cómo o cuándo la mística adquirió esta  familia, o si ella misma creó el linaje con rituales robados. Los Keskinen son una familia muy pequeña y unida, que son aún más insondables que su maestro  Metusalah. Viajan por toda Europa adquiriendo materiales alquímicos y ocasionalmente comercian con conocimiento con los kolduns Tzimisce o místicos  mortales. Practican magias antiguas, en su mayoría olvidadas, alimentadas en parte por su sangre retorcida y tradiciones transmitidas a través de muchos  años.\n\nMohkku es casi tan loco como Louhi, pero alberga un secreto que teme que Louhi no toleraría. Tiene compasión por los demás y, a veces, toma  acciones en secreto que van en contra de la insensibilidad del abismo.\n\n#bold ¿Quizás hay otra forma de acceder al conocimiento que no sea a través del  desprecio por los demás?#!"
 bookmark_inquisitor_johann_gravenor: "Johann"
 bookmark_inquisitor_johann_gravenor_desc: "Familia bárbara y reclusa que vive en las afueras de la ciudad, han tenido la desafortunada consecuencia de  haber sido elegidos por los Nosferatu como sirvientes. Los Nosferatu suelen convertir en [ghoul|E] a animales o al raro mendigo, pero los Gravenor son algo  más. A medio camino entre el hombre y el monstruo, entre el día y la noche, permanecen en un crepúsculo horrible. Cada sorbo de sangre Nosferatu que toman  los atrae más hacia la maldición y la red de intrigas.\n\nAnders es el mayor de la familia y ha abrazado a la Bestia que ha estado creciendo en él. Como se  está convirtiendo en un monstruo, ha decidido deleitarse en ello.\n\n#bold Aquellos que se acerquen demasiado a las propiedades de los Gravenor podrían  encontrarse convertidos en salchichas.#!"
 bookmark_inquisitor_salinguerra_rafastio: "Salinguerra"
 bookmark_inquisitor_salinguerra_rafastio_desc: "Originalmente magos y brujas rurales del Valle del Po, algunos tienen vínculos con la Verbena. Ningún  Rafastio puede convertirse en vampiro por ningún medio; el Abrazo nunca funciona y lo que queda del [Glossary('Revenant','game_concept_revenant_desc')] se  disuelve en la nada en cuestión de momentos, impidiendo cualquier investigación adicional.\n\nSalinguerra lidera aquelarre de adoradores de Lilith. Aunque  es hombre, es bien considerado por su conocimiento, así como por el excelente equilibrio que mantiene entre el dolor y el placer durante los ritos. Fue a  través de su astuta negociación que pudo contactar a la Manus Nigrum para concertar una alianza con la familia Enrathi para que ambos linajes pudieran  prosperar en el norte de Italia.\n\n#bold Si la alianza con la Mano Negra se mantiene, los Rafastio pueden intentar expandirse fuera del Valle del Po. Si  no, el aquelarre necesitará encontrar un nuevo aliado.#!"
 bookmark_inquisitor_kakhopala_marijava: "Kakhopala"
 bookmark_inquisitor_kakhopala_marijava_desc: "La familia Marijava rastrea su ascendencia hasta el líder de una secta Thuggee de ladrones y asesinos. Sirvió  a algunos de los primeros Eutánatos de la Tal'Mahe'Ra y, como recompensa, se convirtió en [ghoul|E]. Sus hijos y nietos fueron elegidos para convertirse en  ghouls y, a partir de ese momento, se convirtieron en una familia de [ghoul|E].\n\nKakhopala es líder de un culto Thuggee. Los amos ocultos lo instruyeron  en los caminos del Corazón Quemado, pero su profunda ira es un obstáculo para la perspectiva desapegada del sendero. Ha sido astuto para ocultar sus  excesos, contempla que la Tal'Mahe'Ra le oculta los grandes misterios porque no lo considera digno. El hambre de poder de Khakhopala, ha imitado a los  Nagaraja consumiendo carne de personas.\n\n#bold Los secretos de la muerte pueden descubrirse estudiando los ritos y apetitos de los antepasados.#!"
 bookmark_inquisitor_cephus_dhabi: "Cephus"
 bookmark_inquisitor_cephus_dhabi_desc: "Originalmente sirvientes de Nergal en Mashkan-Shapir, los D'habi sufrieron divisiones cuando algunos perdieron la  fe en Nergal y lo traicionaron ante Moloch. Sin embargo, a algunos de los D'habi, Nergal los usó para espiar a su linaje y actuar como sus manos contra  rivales, asesinándolos durante su sueño diurno y luego manteniendo a raya a sus enemigos cuando se reveló nuevamente bajo la máscara de Shaitán. Desató  plagas contra aquellos que no lo seguían y atrajo a la mayoría de los Baali a su lado. Tras la derrota de Shaitán en Knossos en la Segunda Guerra Baali,  los antepasados de Cephus continuaron con su lealtad a Nergal.\n\nEn el siglo XI, Azaneal descubrió la puerta olvidada de Corazín. Con la ayuda de lasombra  infernalistas, se abrió la puerta a la ciudad subterránea y su tumba de Namtaru. Después de emerger empoderado de la tumba, Azaneal ha llamado a los Baali,  infernalistas y a los D'habi para que se unan a él.\n\n#bold Cephus y su descendencia han respondido al llamado del nuevo Shaitán de Corazín.#!"
 bookmark_inquisitor_ebrahim_dhabi: "Ebrahim"
 bookmark_inquisitor_ebrahim_dhabi_desc: "Originalmente sirvientes de Nergal en Mashkan-Shapir, los D'habi sufrieron divisiones cuando algunos perdieron la  fe en Nergal y lo traicionaron ante Moloch. Los malévolos designios del 'Esparcidor de Plagas' fueron simplemente demasiado para que los D'habi los  apoyaran. Desde que los Molochim arrasaron la ciudad, los D'habi fueron reclamados por otros Baali, manteniendo sus linajes aislados entre sí.\n\nLa Orden  de Moloch fue fundada en el siglo XIII durante el sangriento conflicto entre el aspirante a shaitán Azaneal, sus seguidores y los ancianos Baali no  impresionados. Ebrahim y su familia siguen la línea de los D'habi que traicionaron a Nergal en Mashkan-Shapir. A diferencia de algunos, no han acudido en  masa a la bandera de Azaneal, han jurado su ayuda a Molochim.\n\n#bold ¡Azaneal debe ser detenido antes de que desate las plagas de Namtaru sobre el  mundo!#!"
 bookmark_inquisitor_pancrazio_rosselini: "Pancrazio"
 bookmark_inquisitor_pancrazio_rosselini_desc: "Al igual que los Giovanni, los Rossellini tenían fuertes lazos con Venecia, donde ambas familias practicaban  la nigromancia. Por otros magos de la Edad Media, los Rossellini eran considerados los nigromantes más talentosos. Además de los caminos de la nigromancia,  muchos Rossellini eran Hechiceros. Incluso entonces, los Rossellini a menudo eran considerados histéricos o de otro modo desequilibrados. Después de la  conversión de sus rivales Giovanni en un Linaje Cappadocio, los Rossellini, al principio, no se vieron afectados, excepto que comenzaron a esforzarse más  en sus artes para competir con sus rivales. Los Rossellini han sido criados cuidadosamente por Augustus Giovanni para convertirse en [Glossary('Revenants', 'game_concept_revenant_desc')], después de que se acercaran a él buscando una cura para una terrible enfermedad que los había afligido.\n\n#bold Incluso  para los estándares Giovanni, Pancrazio, el patriarca de los Rossellini, es considerado cruel.#!"
 bookmark_inquisitor_sadiq_rawan: "Sadiq"
 bookmark_inquisitor_sadiq_rawan_desc: "Una vez un humilde pueblo pesquero, la familia ha sido dominada y criada para servir al excéntrico Ventrue,  Anushin-Rawan. Los Sirvientes han sido criados para ser dóciles a Anushin-Rawan y esto se transmite a sus descendientes. Estas criaturas sirven como  esclavos del placer, recipientes y sirvientes.\n\nSadiq es un sirviente casi perfecto para Anushin-Rawan: diligente, paciente, tranquilo. Incluso es guapo.  Parece saber siempre lo que decir e incluso puede conversar con los Cainitas sobre una variedad de temas intelectuales. Su único defecto es su afición por  los dulces y pasteles, y su tendencia a probar las hermosas delicias con las que resulta que está emparentado.\n\n#bold Anushin-Rawan exige un palacio y  sirvientes a la altura. Es un paraíso para quienes lo visitan, tanto vivos como muertos. Los gritos ni siquiera son comunes.#!"
 bookmark_inquisitor_matteo_enrathi: "Matteo"
 bookmark_inquisitor_matteo_enrathi_desc: "La familia Enrathi rastrea su ascendencia hasta los agricultores etruscos, mucho antes de que Roma se convirtiera  en un poder político significativo. Alrededor de la época en que la república romana se convirtió en imperio, los Enrathi se convirtieron en experimentados  traficantes de esclavos. En tiempos y lugares donde la esclavitud era ilegal, los Enrathi desarrollaron redes de contactos y un repertorio en expansión, y  cuando la Manus Nigrum se acercó a ellos, se unieron con gusto.\n\nEl patriarca de la familia, Matteo, es tan codicioso, cruel y depravado como sus  predecesores.\n\nLas alianzas con las brujas del Valle del Po son útiles por ahora, pero Matteo está bastante dispuesto a traicionar a los Rafastio si  surge la necesidad.\n\n#bold Toma lo que puedas, ¡no devuelvas nada!#!"
 
 bm_1230_warofprinces_sub_ghouls: "Ghouls"
 bm_1230_warofprinces_sub_ghouls_desc: "Alimenta a casi cualquier criatura viviente con un poco de sangre de vampiro y se convierte en un Ghoul, al menos  temporalmente. Los Ghouls son sirvientes omnipresentes, fáciles de crear y muy maltratados.\nSin embargo, algunos ghouls forjan sus propios caminos. Ya sea  por haberse alimentado de vitae antigua durante miles de años, por la destrucción de sus sies o por alguna otra coincidencia, estos antiguos esclavos de  los vampiros tienen la oportunidad de encontrar su propio destino.\n\n#bold ¿De sirvientes a amos?#!"
 bookmark_warofprinces_prias: "Prias"
 bookmark_warofprinces_prias_desc: "Prias fue una vez gobernante de una ciudad en Asia Menor, conocido por su belleza. En cierta ocasión, se encontró con  una hermosa mujer escondida en una cueva con su doncella. Era Helena, en ese momento aún una mujer mortal, que había huido del rey Minos, quien pretendía  convertirla en su esposa. La hermosa pareja sabía que estaban hechos el uno para el otro, pero su incipiente amor se truncó cuando Minos [Glossary('Embraced','game_concept_Embrace_desc')] a la doncella.\nAyudándola a matarlo, Prias ha estado a su lado desde entonces como [ghoul|E], ya que él mismo se  negó a convertirse en vampiro. Sin embargo, a Helena no le faltan rivales, y la lealtad, el valor y el amor eterno de Prias son primordiales para Helena  hasta esta noche.\n\n#bold Has encontrado la forma más pura y verdadera del amor, y debes luchar para que florezca a pesar de las dificultades que se  avecinan.#!"
 bookmark_warofprinces_haqim: "Haqim"
 bookmark_warofprinces_haqim_desc: "Este [ghoul|E], cuyo nombre de nacimiento se ha perdido, fue el protegido de un Guerrero Assamita durante la guerra del  clan contra los Baali. Cuando el amo del [ghoul|E] fue destruido, el Juramento de Sangre se reflejó en él y destrozó su psique, lo que lo llevó a huir al  desierto. Otros asumieron que el [ghoul|E] había perecido junto con su amo.\nSin embargo, sobrevivió y no regresó al $pod_clan$, sino que usó sus dones y  la experiencia para tender emboscadas a varios $pod_cainites$, calmando su ansia de $pod_vitae$.\nCuando se enteró de un lugar llamado Aluh Amut y de una  secta de asesinos mortales, fue allí y asumió el manto de liderazgo de ellos. Con el tiempo, el [ghoul|E] adoptó el nombre de Haqim, el mismísimo [Glossary('Antediluvian','game_concept_antediluvian_desc')] de los Assamitas, en una oscura parodia de sus antiguos amos.\n\n#bold Te has ganado el respeto de los  Assamitas, ahora te ganarás el miedo.#!"
 bookmark_warofprinces_layla: "Layla"
 bookmark_warofprinces_layla_desc: "Una criatura de misterios y leyendas, se rumorea que Layla es una hija de la propia Lilith. Como tal, su inmortalidad es  bastante diferente a la de los vampiros y alberga un profundo odio por los $pod_cainites$ que traicionaron a su Madre Oscura.\nOtras pistas apuntan a que  ha bebido de la sangre de Lilith, quizás directamente, o quizás a través del intermediario de un patrón antiguo y poderoso. Esta teoría se ve reforzada por  su vaga asociación con la misteriosa Tal'mahe'Ra, una secta de ancianos poderosos, algunos de los cuales adoran a la propia Lilith.\nSea cual sea la  verdad, Layla es una criatura muy poderosa y peligrosa, quizás incluso algo más que un [ghoul|E], y muchos se preguntan en silencio cuáles podrían ser  realmente sus objetivos finales.\n\n#bold La Madre Oscura, tu Madre Oscura, te habla. No la decepcionarás.#!"
 bookmark_warofprinces_ferox: "Ferox"
 bookmark_warofprinces_ferox_desc: "El hijo de Boudica defendió a su madre con el suficiente fervor como para ganarse el respeto de los vampiros romanos que  aplastaron su rebelión. Reducido a sirviente como [ghoul|E], Ferox aún mantuvo su conducta honorable y se convirtió en un activo preciado para los  conquistadores.\nEl nacimiento del cristianismo fue un momento crucial en la vida de Ferox. Abrazando esta fe con los brazos abiertos, su nuevo celo fue  utilizado por sus amos para infiltrarse en la Iglesia con sus propios fines.\nAunque aún leal, Ferox ahora ve a sus amos cada vez más como los monstruos  que son.\n\n#bold Tu espíritu de rebelión no ha muerto aún. Respaldado por tu intensa fe, puedes convertirte en el instrumento de castigo de Dios sobre los  decadentes hijos de Caín.#!"
 bookmark_warofprinces_delizbieta: "Delizbieta"
 bookmark_warofprinces_delizbieta_desc: "Una joven [ghoul|E] de la familia romaní Torenu, los agudos sentidos y el talento mágico de Delizbieta ya la han  convertido en un activo considerable para su pueblo.\nTrabajando estrechamente con Izydor Torenu, el protector vampírico de la familia, lo ha estado  siguiendo en su plan para encontrar un nuevo hogar seguro. Sin embargo, le preocupa que esté ocultando motivos menos altruistas y su reciente breve  encuentro con la poderosa Durga Syn la ha hecho cuestionarse si la lealtad de Izydor es realmente para su pueblo o para sí mismo.\n\n#bold Reflexiona sobre  tu situación cuidadosamente. El camino hacia la seguridad de tu pueblo es estrecho y empinado.#!"
 
 
 bm_1375_patronwar_sub_brujah: "Clan Brujah"
 bm_1375_patronwar_sub_brujah_desc: "Los Brujah se han reunido en África occidental alrededor de un líder Prometeico que se hace llamar Aníbal para formar  una Nueva Cartago."
 bookmark_patronwar_brand_de_draeck: "Brand deDraeck"
 bookmark_patronwar_brand_de_draeck_desc: "Era un Potestad Guerrero conocido como 'De Draeck'. Luchó contra los daneses que exigían tributo en los  alrededores. Se negó a pagar a los daneses. Siguió una batalla en la que los holandeses salieron victoriosos, con 500 de cada 800 daneses muertos, incluido  su líder. Sin embargo, los holandeses también perdieron a su líder.\n\nO eso se pensaba, en realidad fue abrazado durante la batalla, quedó poseído, cambió  su identidad y desde entonces ha viajado por Europa para encontrar su lugar. Finalmente regresó a Holanda para gobernar desde las sombras mientras luchaba  por recuperar su cordura, o sucumbía a la locura."
 bm_1375_patronwar_sub_cappadocian: "Clan Cappadocio"
 bm_1375_patronwar_sub_cappadocian_desc: "La Peste Negra ha matado a millones en todo el mundo conocido. ¿Ha sido todo esto un complot del Clan de la  Muerte? Estudian la enfermedad con intensidad."
 bookmark_patronwar_marcus: "Marcus"
 bookmark_patronwar_marcus_desc: "Los Mortificadores realizan todo tipo de experimentos con las colinas de cadáveres que la Peste Negra ha puesto a su  disposición. ¿Buscan el poder de la plaga o acabarla para siempre?"
 bookmark_patronwar_richard_uagemred: "Richard Uagemred"
 bookmark_patronwar_richard_uagemred_desc: ""
 bookmark_patronwar_luna_morningstar: "Luna Morningstar"
 bookmark_patronwar_luna_morningstar_desc: "Como humana, Luna siempre fue diferente a sus compañeros. Contemplativa de la vida y la muerte, interesada en lo  extraño y enamorada de la noche. Algo en ella la calmaba. La brisa lenta pero implacable que pasaba entre las rocas de la casa de sus padres y que asustaba  a otros niños la hacía sentir cómoda y segura. El crujido de la madera bajo sus pies y el silencio de una habitación oscura inspiraban su imaginación. Su  belleza parecía atemporal, pero casi se extinguió cuando rechazó los avances de un vecino y fue proclamada bruja. Mientras los inquisidores la preparaban  para la hoguera, sus gritos de ira y angustia llegaron a un señor vampiro local que vio su incesante odio hacia la raza humana. Él la salvó y poco después  la abrazó. Quería ver qué caos y sufrimiento podía causar un individuo tan bello y loco antes de condenarse a sí mismo o si podía ascender en las filas de  la corte nocturna y convertirse en una verdadera Dama de la noche."
 bookmark_patronwar_lucia_canale: "Lucia Canale"
 bookmark_patronwar_lucia_canale_desc: "Lucia parecía haber aparecido de la nada y, por suerte, muchos de sus oponentes en su ascenso al poder tuvieron  'accidentes desafortunados' o cambios de opinión excepcionalmente repentinos. Su sire fue identificado como un hombre sombrío llamado Guiseppe, a quien se  vio por última vez camino a una reunión con ella; se desconoce si su destino fue la Diablerie, ser estacado o simplemente la Muerte Final para atar el  último cabo suelto. Quizás no sea conveniente enfadarse si tu maestro de espías no es muy competente."
 bookmark_patronwar_branco: "Branco"
 bookmark_patronwar_branco_desc: ""
 bm_1375_patronwar_sub_setite: "Clan Setita"
 bm_1375_patronwar_sub_setite_desc: "El Clan de la Fe continúa manteniendo su bastión en Egipto, ahora bajo el liderazgo de un centurión romano."
 bm_1375_patronwar_sub_gangrel: "Clan Gangrel"
 bm_1375_patronwar_sub_gangrel_desc: "Con tanta gente muriendo y la civilización pareciendo colapsar, ahora es el momento del lobo. En todas partes, lo  salvaje invade el dominio de los tejedores. Los supervivientes recurren al misticismo pagano en busca de una cura para esta terrible plaga. ¿Pueden las  bestias hacer un mundo nuevo? Un mundo donde el hombre vive en armonía con la naturaleza; el terreno de caza perfecto en el que los Gangrel pueden acechar  al ganado."
 bookmark_patronwar_caelia_tertia: "Caelia Tertia"
 bookmark_patronwar_caelia_tertia_desc: "Nacida en el año 390 d.C. en la ciudad de Roma, Caelia era en vida la tercera hija de un centurión romano. No se  sabe mucho de su vida humana, simplemente porque no hay mucho que saber, sin mencionar que la mayoría de los registros de su época fueron destruidos; vivió  una vida sin incidentes en Roma hasta que los galos la saquearon en el año 410 d.C. Su padre y sus hermanos mayores murieron en la lucha, y mientras  intentaba huir, se encontró atacada por un Kindred. Luchó lo mejor que pudo, pero fue una batalla sin esperanza desde el principio y fue derrotada con  facilidad desdeñosa. Huyó al este después de eso, pasando los siguientes siglos expandiendo y dominando sus poderes y acumulando fondos y poder. Ahora, su  momento puede haber llegado finalmente..."
 bookmark_patronwar_bimbee: "Bimbee"
 bookmark_patronwar_bimbee_desc: ""
 bookmark_patronwar_gorm: "Gorm"
 bookmark_patronwar_gorm_desc: "El hombre era un feroz guerrero. Su voluntad en el campo de batalla y su cuidadosa gestión de las tropas y el  posicionamiento le llevaron a obtener muchas batallas exitosas. Fue descubierto durante una de ellas por Brunhilda. Mientras moría después de matar a  cuatro atacantes, ella lo abrazó y lo dejó solo en la naturaleza para sobrevivir. Durante esos tiempos, aprendió cuánto las habilidades sociales y los  planes sirven solo a los débiles y usó su astucia y fuerza para cazar con una efectividad implacable. Después de aprender en lo que se había convertido,  comenzó a devastar activamente a aquellos que escupirían a los dioses. Actuando como comandante y verdugo, fue enviado a matar las raíces podridas del  árbol de la vida. Cualquier [Glossary('Einherjar','game_concept_einherjar_desc')] que se desviara del camino debía responder por sus crímenes contra los  dioses y pocos de ellos vivieron lo suficiente para unirse a los cristianos. Por desgracia, con cada batalla que ganaba, otras se perdían y los cristianos  nunca parecían retroceder. Envenenaron los corazones de su rebaño y las muchas disputas entre los [Glossary('Einherjar','game_concept_einherjar_desc')]  llevaron a Midgard a derrumbarse."
 bookmark_patronwar_dharun: "Dharun"
 bookmark_patronwar_dharun_desc: ""
 
 bm_1375_patronwar_sub_lasombra: "Clan Lasombra"
 bm_1375_patronwar_sub_lasombra_desc: "El Clan de las Sombras ha caído en tiempos difíciles mientras su rebaño religioso muere en masa y los monasterios se  convierten en tumbas. El ganado clama por la salvación de Dios... y él no responde. Con su influencia sobre los mortales disminuyendo, algunos Magísteres  miran profundamente en la oscuridad en busca de respuestas. ¿Escucharon un susurro de respuesta?"
 bookmark_patronwar_michel_tenoctis: "Michel Tenoctis"
 bookmark_patronwar_michel_tenoctis_desc: "No se sabe mucho de él, ya que normalmente se mantiene apartado para estudiar el Abismo. Todo lo que se sabe es  que ya había descubierto la existencia del Abismo y había comenzado a estudiarlo antes de ser engendrado. Eso fue lo que atrajo la atención del clan  Lasombra y finalmente condujo a su estado actual de no-muerte, cortesía del clan antes mencionado."
 bookmark_patronwar_gabriel_felipe: "Gabriel Felipe"
 bookmark_patronwar_gabriel_felipe_desc: "Vástago de una familia una vez noble, Gabriel ha sido preparado para el gobierno desde su nacimiento. Después de  su Abrazo, ha optado por no salir del centro de atención y gobernar desde las sombras, como corresponde a un miembro del clan Lasombra."
 bookmark_patronwar_elder_diego: "Anciano Diego"
 bookmark_patronwar_elder_diego_desc: "Diego es un ex monje de una orden sagrada cristiana. Solía ser un cazador, pero fue abrazado después de una cacería  exitosa por un sire que pensó que sería divertido, y no le importaron mucho los dos neonatos que Diego eliminó."
 bookmark_patronwar_hakon_fystond: "Hakon Fystond"
 bookmark_patronwar_hakon_fystond_desc: "Siempre llamaba la atención de todos de niño debido a que su piel era pálida como un cadáver, pasó la mayor parte  de su infancia en el bosque recolectando y luego comenzó a cazar. Era astuto y taimado, y más tarde se unió a una banda de ladrones conocidos por atacar a  soldados y mercaderes que viajaban por Nordmark. Terminó en una banda de ladrones, hasta que una noche tuvo la 'suerte' de ser abrazado.\nSu sire era un  paria del Mar de Sombras, pero nunca mencionó por qué."
 bookmark_patronwar_eridanus: "Eridanus Erebus"
 bookmark_patronwar_eridanus_desc: "Percibiendo los tratos antinaturales de los monstruos que lo hicieron, Damian busca descubrir su papel en sus  maquinaciones y un método para desmantelar los vínculos fantasmales que fuerzan su silenciosa observación de las tediosas y mezquinas políticas entre los  pérfidos tontos. Incluso ahora en la muerte, busca una resolución al camino que ha seguido desde su nacimiento.\n\n#bold El camino de la menor resistencia,  tal como fluye el río, solo terminará cuando encuentre el mar.#!"
 bookmark_patronwar_jimeno_fitzroy: "Jimeno FitzRoy"
 bookmark_patronwar_jimeno_fitzroy_desc: "Antes de su abrazo, Jimeno FitzRoy era un noble menor en Valencia, distantemente relacionado con algún rey español  (o eso afirma). Acumuló cierta mala reputación debido al hecho de que se relacionaba libremente con mercaderes sin escrúpulos, ladrones y canallas. Su  desviación y disposición a doblar las leyes para su beneficio llamarían la atención de un poderoso Lasombra, que buscaba un mortal para abrazar.\n\nTras el  abrazo, Jimeno se sintió atraído por las turbias olas, como algunos Lasombra. Reclutó a los criminales que conocía en su vida anterior para tripular sus  barcos y partió en un gran viaje lleno de aventuras, batallas y mucho botín saqueado. Asaltar y divertirse es suficiente para algunos corsarios, pero  Jimeno finalmente encontró su vida en el mar... restrictiva. Usando el caos en el Levante causado por las cruzadas, tomó el control de algunos puertos  clave y decidió 'establecerse'. La Corte de los Cuervos había nacido."
 bookmark_patronwar_narcandana_markov: "Narcandana Markov"
 bookmark_patronwar_narcandana_markov_desc: ""
 
 bookmark_patronwar_atticus: "Atticus"
 bookmark_patronwar_atticus_desc: ""
 
 bookmark_patronwar_suleyman_ibn_arua: "Suleyman ibn Aura"
 bookmark_patronwar_suleyman_ibn_arua_desc: ""
 
 bm_1375_patronwar_sub_malkavian: "Clan Malkavian"
 bm_1375_patronwar_sub_malkavian_desc: "En esta calamidad, la gente lucha por entender lo que está sucediendo. ¿Dios los ha abandonado? ¿Es el Apocalipsis?  ¿Ha llegado la Gehena? Los oráculos anuncian la llegada de nuevos profetas que prometen la salvación o misterios aún mayores."
 bookmark_patronwar_aleksandr: "Aleksandr"
 bookmark_patronwar_aleksandr_desc: "Patriarca Ecuménico de la Iglesia del Tercer Caín."
 bookmark_patronwar_petronia: "Petronia"
 bookmark_patronwar_petronia_desc: ""
 bookmark_patronwar_bronach_o_cennfhaelaid: "Bronach O'Cennfhaelaid"
 bookmark_patronwar_bronach_o_cennfhaelaid_desc: ""
 bookmark_patronwar_izalda_kishlovsky: "Izalda Kishlovsky"
 bookmark_patronwar_izalda_kishlovsky_desc: "Izalda dejó a su [Glossary('Sire','game_concept_Sire_desc')], Mellandis, y se exilió, todavía llena de dolor  por la muerte de sus hermanas. Durante este tiempo, se sumergió profundamente en la historia de su propio $pod_clan$, encontrando textos e información  sobre la Ordo Aenigmatis.\nAhora, inspirada por el camino de la Ordo, ha regresado a Leczyca, su ciudad natal, ocupando fácilmente su lugar como condesa.  Eso, sin embargo, es solo el primer paso de un plan mucho más elaborado para elevar tanto a los Malkavian como a la Ordo Aenigmatis. Mientras tanto, se  mantendrá justo en el medio, lista para desatar el verdadero conocimiento sobre el mundo y cosechar su poder."
 bm_1375_patronwar_sub_nosferatu: "Clan Nosferatu"
 bm_1375_patronwar_sub_nosferatu_desc: "Los priores acechan en las sombras. Muchos han desaparecido por completo en el letargo; aunque unos pocos acechan a  los enfermos y moribundos detrás de las máscaras de los médicos de la peste."
 bookmark_patronwar_nicolas_davry: "Nicolas d'Avry"
 bookmark_patronwar_nicolas_davry_desc: "¿Qué es más ridículo que un caballero Nosferatu? Un caballero Nosferatu que sería príncipe del oeste de Francia."
 bm_1375_patronwar_sub_ravnos: "Clan Ravnos"
 bm_1375_patronwar_sub_ravnos_desc: "Ni siquiera el Clan de los Errantes puede escapar de esta enfermedad. Incluso si huyen hasta los confines de la  tierra... ni siquiera Irlanda se libra de los estragos de la Peste Negra."
 bm_1375_patronwar_sub_toreador: "Clan Toreador"
 bm_1375_patronwar_sub_toreador_desc: "El jardín ha muerto. Muchos artistas han muerto. Ya no hay fiestas. El olor de los pétalos de rosa apenas puede  cubrir el hedor de los cadáveres podridos por todas partes. Y sin embargo, si miras de cerca, se forman nuevos brotes y la esperanza de la primavera.  Abraza a esos artistas que aún pueden ser salvados y obtén sangre como puedas."
 bookmark_patronwar_anatolios_tenebris: "Anatolios Tenebris"
 bookmark_patronwar_anatolios_tenebris_desc: "Anatolios pudo establecerse como un miembro leal, ejecutivo e inteligente del clan. En un período tan corto,  pudo destituir al antiguo gobernante local y jurar lealtad al gobernante del Voivodato. Ni Vladimir Rustovich ni la Matriarca dudan de su lealtad. Pero  ¿qué pasa si la lealtad y los votos no son más que pretexto y la nueva 'familia' es el objetivo principal de venganza por la vieja y verdadera familia? El  tiempo lo dirá."
 bookmark_patronwar_narcissus_cephissus: "Narcissus Cephissus"
 bookmark_patronwar_narcissus_cephissus_desc: ""
 bookmark_patronwar_tykado: "Tykado"
 bookmark_patronwar_tykado_desc: ""
 bookmark_patronwar_daniel_hawk: "Daniel Hawk"
 bookmark_patronwar_daniel_hawk_desc: ""
 bookmark_patronwar_ghazia_khatun: "Ghazia Khatun"
 bookmark_patronwar_ghazia_khatun_desc: ""
 bookmark_patronwar_cecilia: "Cecilia"
 bookmark_patronwar_cecilia_desc: "Algunos deseos están prohibidos por una buena razón."
 bookmark_patronwar_osore: "Osore"
 bookmark_patronwar_osore_desc: ""
 bookmark_patronwar_sonja_harald: "Sonja"
 bookmark_patronwar_sonja_harald_desc: ""
 
 bm_1375_patronwar_sub_tremere: "Clan Tremere"
 bm_1375_patronwar_sub_tremere_desc: "En el caos de la Peste Negra y con muchos del Consejo de los Siete cayendo al menos temporalmente en letargo, tres  grandes casas luchan por liderar a los Tremere."
 bookmark_patronwar_cyrus: "Cyrus"
 bookmark_patronwar_cyrus_desc: "El aquelarre de brujos del Zorro Verde ha llegado a dominar el este de Francia. Circula el rumor de que este aquelarre se  ha alejado de la estricta adhesión al Código de Tremere y, en cambio, se apega al Sendero de la Humanidad y la Mascarada."
 bookmark_patronwar_ruadh_sutherland: "Ruadh Sutherland"
 bookmark_patronwar_ruadh_sutherland_desc: "Fue Arzobispo del cristianismo. Cree que los Vampiros son parte de la voluntad de Dios, pero el abrazo lo  desequilibró. Cree que los vampiros son pastores de humanos, que son como ganado para ser guiados por las voluntades de los vampiros hacia lo que ellos  creen que es correcto. Aunque cree que los humanos no deberían mentir ni asesinar (a menos que sus señores vampiros les digan que lo hagan), cree que los  vampiros pueden usar estas herramientas 'Por un Bien Mayor'. Cree que las personas son buenas o malas, una de dos, y ve el mundo en blanco y negro. Fue  abrazado por Goratrix como un sacerdote con un inmenso conocimiento de la religión y el ocultismo. Cuando fue abrazado, Sutherland se desequilibró. Hasta  tal punto que incluso Goratrix tuvo que enviarlo por un tiempo a Malta para que pudiera calmarse y aclarar su mente. Su mecanismo de afrontamiento hizo que  siguiera creyendo que es un agente de Dios, pero luego comenzó a ver el mundo en blanco y negro, el Bien y el Mal."
 bookmark_patronwar_morgano_murchadh: "Morgano Murchadh"
 bookmark_patronwar_morgano_murchadh_desc: "Morgano se hizo conocido por su locura en noches más recientes. Después de haber emergido de su investigación  aislada, el Brujo vio que muchos de los kindred menores, como los Caitiff, habían ascendido a posiciones prominentes. Habiendo estudiado mucho las  profecías de la Gehena, tomó esto como un presagio y comenzó su propia cruzada para limpiar Europa de los sin clan, reuniendo a muchos vampiros  tradicionalistas a su lado mientras lo hacía. Aunque solía experimentar con sus cautivos, el Señor Loco de la Casa Murchadha ahora eligió quemar a sus  enemigos en la hoguera o en sus hogares, a veces aldeas y pueblos enteros fueron quemados hasta los cimientos si había rumores de que albergaban a los sin  clan. Sin embargo, debido a su aislamiento y a la indiferencia de los clanes altos, nadie ha detenido la loca purga de Morgano en Hungría."
 bm_1375_patronwar_sub_tzimisce: "Clan Tzimisce"
 bm_1375_patronwar_sub_tzimisce_desc: "Mientras que la mayoría de los clanes han luchado por sobrevivir a esta plaga apocalíptica, los Tzimisce han  prosperado. Transfórmate o perece, y oh, cómo se han transformado los Tzimisce: ya sea en una noción idealizada de la perfección humana, en nuevos extremos  de decadencia hedonista o en alguna mutación desconocida de la carne más allá de la oscuridad exterior."
 bookmark_patronwar_matthaios: "Matthaios"
 bookmark_patronwar_matthaios_desc: "Los seguidores de Asakku han establecido un reino en el norte helado de Siberia que han llamado Hiperbórea."
 bookmark_patronwar_gavrili: "Gavrili"
 bookmark_patronwar_gavrili_desc: "Gavrili era un noble menor. Un soldado en la vida mortal, como su padre y su abuelo antes que él. Fue criado para ser un  protector de su pueblo.\n\nComo vampiro, obtiene un placer perverso al cazar y alimentarse de los mortales de sus antiguas tierras.\n\nA pesar de ser leal  a su clan, Gavrili lucha por entender la alta filosofía de los Tzimisce. Compensa recluyéndose en su dominio y centrándose en criar linajes de [ghoul|E]."
 bookmark_patronwar_descardion: "Descardion"
 bookmark_patronwar_descardion_desc: "Fue sacado de las canteras de Egipto cuando su aprendizaje y perspicacia atrajeron la atención de su sire. Su sire le  inculcó la sed de conocimiento para ayudar a combatir el estancamiento del tiempo. Como seguidor de Tariq el-Sama, Descardion cree que la lucha entre uno  mismo y la bestia es una prueba definitiva de Alá. Trabaja diligentemente para difundir el aprendizaje y la fe entre quienes lo rodean. Sus experimentos a  menudo son internalizados, pero en el pasado ha tomado medidas extremas, como convertir en ghoul a una aldea entera o imponer personalmente ayunos de un  mes para purgar la mente y el cuerpo (y a los individuos débiles) de las tribus locales. Como una de las pocas personas alfabetizadas, Descardion ha  mantenido un volumen de diarios y valora la palabra escrita de tal manera que su corte valora la educación y las tácticas por encima de cualquier otro  rasgo. Descardion se ha preocupado por proteger su trabajo y se ha vuelto proactivo en el norte de África, buscando evitar que los Reyes y la Pirámide  controlen al pueblo de Egipto."
 bookmark_patronwar_dunnlang_cathail: "Dunnlang"
 bookmark_patronwar_dunnlang_cathail_desc: ""
 bookmark_patronwar_liliana_szantovich: "Liliana Szantovich"
 bookmark_patronwar_liliana_szantovich_desc: "Preparada para el abrazo por su sire, Stoffer Ravensburg, que remonta su ascendencia a Dracon. Al principio de  su abrazo, se descubrió que Stoffer era un Infernalista y, con la ayuda de su otro vástago, Miguel Barbaneagra, cazaron a Stoffer y lo llevaron a la muerte  final. Ahora trabaja para asegurar su posición dentro de la corte del Voivoda Brancoveanu, a pesar de sus animosidades hacia el sendero del otro. Todavía  mantiene un nivel de lealtad a su antigua educación como [Glossary('Revenant','game_concept_revenant_desc')], y busca proteger y asegurar el lugar de su  antigua familia en el mundo con poco éxito."
 bookmark_patronwar_faustus_desdeuxvalleesvertes: "Faustus des Deux Vallées Vertes"
 bookmark_patronwar_faustus_desdeuxvalleesvertes_desc: ""
 bookmark_patronwar_severus_maximus_dominatus: "Severus Maximus Dominatus"
 bookmark_patronwar_severus_maximus_dominatus_desc: ""
 bookmark_patronwar_alexandru: "Alexandru"
 bookmark_patronwar_alexandru_desc: ""
 bookmark_patronwar_simon: "Simon"
 bookmark_patronwar_simon_desc: ""
 bookmark_patronwar_sebatian: "Sebatian"
 bookmark_patronwar_sebatian_desc: ""
 bookmark_patronwar_chough: "Chough"
 bookmark_patronwar_chough_desc: ""
 
 bm_1375_patronwar_sub_ventrue: "Clan Ventrue"
 bm_1375_patronwar_sub_ventrue_desc: "En el caos de esta enfermedad, el mundo clama por orden, ¡y el Clan de los Reyes responderá! Honraremos nuestras  deudas con el ganado, pero para sobrevivir a esto debemos tener obediencia y lealtad absolutas. No toleraremos desafíos a nuestra autoridad. El cetro  supremo dentro de un puño blindado."
 bookmark_patronwar_nicholas_masterson: "Nicholas Masterson"
 bookmark_patronwar_nicholas_masterson_desc: "Un Ventrue que se ha declarado guardián de Set, este noble Kindred ha buscado proteger al ganado de los peores  monstruos que acechan las noches de la Peste Negra."
 bookmark_patronwar_kylar_shadovie: "Kylar"
 bookmark_patronwar_kylar_shadovie_desc: "Nacido como hijo bastardo de un noble, aprendió la intriga de la corte para sobrevivir, a pesar de que era un niño  enfermizo. A la edad de 26 años, mientras fabricaba una influencia sobre su señor, un vampiro irrumpió en su castillo y lo abrazó."
 bookmark_patronwar_aryan_de_gray: "Aryan de Gray"
 bookmark_patronwar_aryan_de_gray_desc: "Nacido de un caballero sin tierras juramentado al Conde de Chester, Aryan de Gray pasó su infancia siendo tutorado  en la corte de su señor. Se mostró capaz en combate, ganándose un lugar como el miembro más joven de la guardia de su señor, pronto seguido de un puesto de  mando en sus ejércitos. El joven tendría la oportunidad de demostrar su valía durante una rebelión en Normandía. En el transcurso de cinco años, logró ser  capturado tres veces. Dos veces fue rescatado y una vez escapó. A pesar de estas situaciones desafortunadas, fue elogiado por su valentía y habilidad,  ganándose la confianza del propio rey. El punto culminante de su carrera puso fin a la guerra; en la Batalla de Brémule en 1119, logró romper la caballería  enemiga y lideró una carga contra su flanco derecho. La maniobra no tenía nada que ver con las órdenes que recibió y fue descrita tanto como 'un golpe de  genio' como 'un acto de pura locura'. En cualquier caso, condujo a una victoria decisiva, una que pareció costarle la vida a Aryan. Un vampiro tuvo otra  idea."
