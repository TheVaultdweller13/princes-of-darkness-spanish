 bm_1375_patronwar_sub_bloodlines: "Linajes"
 bm_1375_patronwar_sub_bloodlines_desc: "Tras la Peste Negra, ciertos linajes pudieron reafirmarse temporalmente. Notablemente, los Baali forjaron un  imperio en Mesopotamia, donde se les opusieron los Salubri que aún se aferraban a la Dieta de los Olivos. En Gran Bretaña, surgió una nueva Ávalon bajo un  Salubri que reclamaba el manto del Rey Arturo, mientras que un linaje de reanimados tocados por las hadas se gestaba en Escocia. Otro reino Salubri se  estableció en Lhasa bajo un místico chino. ¡Incluso los Caitiff encontraron un campeón en Venecia!"
 
 
 bm_1375_patronwar_sub_others: "Otros"
 bm_1375_patronwar_sub_others_desc: "Hay más en el Mundo de Tinieblas que vampiros. Los Hombres Lobo acechan en la naturaleza, las Momias se aferran a su  inmortalidad y los cazadores cazan."
 
