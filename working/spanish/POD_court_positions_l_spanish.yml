 #lack_ventrue_primogen_tt: "Los Ventrue se sienten marginados."
 #lack_assamite_primogen_tt: "Los Banu Haqim se sienten marginados."
 #lack_malkavian_primogen_tt: "Los Malkavian se sienten marginados."
 #lack_nosferatu_primogen_tt: "Los Nosferatu se sienten marginados."
 #lack_ravnos_primogen_tt: "Los Ravnos se sienten marginados."
 #lack_setite_primogen_tt: "Los Setitas se sienten marginados."
 #lack_salubri_primogen_tt: "Los Salubri se sienten marginados."
