 brujah_primogen_court_position: "Primogénito Brujah"
 brujah_primogen_court_position_desc: "El $brujah_primogen_court_position$ tiene la responsabilidad tradicional de la guerra estratégica en un dominio, aunque en ocasiones también puede incursionar en el saber académico, manteniéndose fiel a su apelativo de Eruditos-Guerreros.\n\n#help Para los requisitos de [aptitude|E], consulta [brujah_primogen|E].#!"
 cappadocian_primogen_court_position: "Primogénito Capadocio"
 cappadocian_primogen_court_position_desc: "Pocos saben tanto como los Capadocios sobre la condición de No Muerto. Se puede aprender mucho de ellos, si están dispuestos a hablar.\n\n#help Para los requisitos de [aptitude|E], consulta [cappadocian_primogen|E].#!"
 lasombra_primogen_court_position: "Primogénito Lasombra"
 lasombra_primogen_court_position_desc: "Los Maestros de las Sombras son un aliado útil para tener de tu lado, pero un enemigo mucho más letal si se les contraría.\n\n#help Para los requisitos de [aptitude|E], consulta [lasombra_primogen|E].#!"
 toreador_primogen_court_position: "Primogénito Toreador"
 toreador_primogen_court_position_desc: "Toda corte que se precie tiene un Toreador talentoso para manejar sus reuniones. La definición de 'talentoso' puede ser controvertida a veces, no obstante.\n\n#help Para los requisitos de [aptitude|E], consulta [toreador_primogen|E].#!"
 tzimisce_primogen_court_position: "Primogénito Tzimisce"
 tzimisce_primogen_court_position_desc: "Cuando un invitado ya no es bienvenido pero aún necesitas que responda algunas preguntas... sabes a quién llamar.\n\n#help Para los requisitos de [aptitude|E], consulta [tzimisce_primogen|E].#!"
 ventrue_primogen_court_position: "Primogénito Ventrue"
 ventrue_primogen_court_position_desc: "Los así llamados gobernantes de la noche esperan que se les confiera una gran cantidad de poder y responsabilidades, incluso cuando no lo merecen.\n\n#help Para los requisitos de [aptitude|E], consulta [ventrue_primogen|E].#!"
 assamite_primogen_court_position: "Primogénito Banu Haqim"
 assamite_primogen_court_position_desc: "Los Hijos de Haqim son cumplidores, y un ejemplo de disciplina hacia una causa común. La mayoría de las veces.\n\n#help Para los requisitos de [aptitude|E], consulta [assamite_primogen|E].#!"
 gangrel_primogen_court_position: "Primogénito Gangrel"
 gangrel_primogen_court_position_desc: "Un Gangrel nunca está lejos de su manada, listo para ayudar o perjudicar en su nombre.\n\n#help Para los requisitos de [aptitude|E], consulta [gangrel_primogen|E].#!"
 malkavian_primogen_court_position: "Primogénito Malkavian"
 malkavian_primogen_court_position_desc: "Los videntes no controlan los presagios, pero quizás sea mejor tenerlos de tu lado de todos modos.\n\n#help Para los requisitos de [aptitude|E], consulta [malkavian_primogen|E].#!"
 nosferatu_primogen_court_position: "Primogénito Nosferatu"
 nosferatu_primogen_court_position_desc: "Tener el favor de los Nosferatu es siempre una buena idea. La dificultad radica en asegurarse verdaderamente de que están de tu lado...\n\n#help Para los requisitos de [aptitude|E], consulta [nosferatu_primogen|E].#!"
 ravnos_primogen_court_position: "Primogénito Ravnos"
 ravnos_primogen_court_position_desc: "Una familia dividida y enemistada sigue siendo una familia al fin y al cabo.\n\n#help Para los requisitos de [aptitude|E], consulta [ravnos_primogen|E].#!"
 setite_primogen_court_position: "Primogénito Setita"
 setite_primogen_court_position_desc: "El Clan de la Fe puede guiarte espiritualmente, pero quizás no hacia el final que deseabas.\n\n#help Para los requisitos de [aptitude|E], consulta [setite_primogen|E].#!"
 tremere_primogen_court_position: "Primogénito Tremere"
 tremere_primogen_court_position_desc: "Los Usurpadores traen abundantes regalos, y aún más maldiciones.\n\n#help Para los requisitos de [aptitude|E], consulta [tremere_primogen|E].#!"
 salubri_primogen_court_position: "Primogénito Salubri"
 salubri_primogen_court_position_desc: "Los Pastores de la humanidad están muriendo, pero su deber permanece.\n\n#help Para los requisitos de [aptitude|E], consulta [salubri_primogen|E].#!"
 gargoyle_primogen_court_position: "Primogénito Gárgola"
 gargoyle_primogen_court_position_desc: "Cuando necesitas que se lleve a cabo un asalto violento y repentino, los Gárgolas son lo que necesitas.\n\n#help Para los requisitos de [aptitude|E], consulta [gargoyle_primogen|E].#!"
 
 #POD_primogens.0001.t: "Mecánicas de Primogénito"
 #POD_primogens.0001.desc: "Como gobernante de nivel Reino (o superior), ahora tienes acceso a las posiciones menores de la corte de [primogen|E].\nEstas posiciones representan la expectativa de cada $pod_clan$ en tu área de tener un representante cercano a ti. Cada $pod_clan$ valora un [Concept('primogen_aptitude','conjunto de habilidades')|E] diferente como puedes ver en sus puntuaciones de aptitud, pero todos esperan ser representados.\nSi decides no nombrar a alguien (porque no puedes permitirte su salario, o porque son necesarios en otra parte, o simplemente porque aún no tienes a nadie adecuado), puedes esperar que este $pod_clan$ específico proteste en los años venideros, dándote una penalización de opinión notable con cada miembro de ese $pod_clan$ en tu reino."
 #POD_primogens.0001.a: "Comprendido"
 #primogen_explanation_tt: "Tienes un período de gracia de tres años hasta que tu reino espere que esas posiciones estén cubiertas."
 #
 #lack_primogen_opinion: "Se Siente Marginado"
 #
 #POD_primogens.0003.t: "Humor de los Clanes"
 #POD_primogens.0003.desc: "Como poderoso gobernante de la noche, eres juzgado constantemente por los diversos [Glossary('Clanes','game_concept_Clan_desc')] de la sociedad no muerta. Aquellos a los que no has favorecido con un asiento de [primogen|E] son considerados marginados en tu corte, quizás debido a su insignificancia política en tu reino, o simplemente por tu capricho actual.\nEn cualquier caso, ahora puedes sentir el humor de los Clanes hacia tu gobierno cambiando de nuevo."
 #POD_primogens.0003.a: "¿Qué piensan realmente?"
 #lack_brujah_primogen_tt: "Los Brujah se sienten marginados."
 #lack_cappadocian_primogen_tt: "Los Capadocios se sienten marginados."
