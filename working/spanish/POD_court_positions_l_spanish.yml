 aphrodisiac_celebrant_court_position: "Celebrante de las Afrodisias"
 aphrodisiac_celebrant_court_position_desc: "Una posición ardientemente disputada con politiqueo social, el Celebrante de las Afrodisias tiene el honor de presidir las Afrodisias, donde los Pecadores celebran la llegada de la Primavera con un festival muy vibrante y decadente."

 lord_of_misrule_court_position: "Señor del Desgobierno"
 lord_of_misrule_court_position_desc: "Elegido durante las Saturnales, el Señor del Desgobierno tiene inmunidad completa y la usa para burlarse y menospreciar a todas las autoridades Cainitas establecidas en el área."

 hidden_minister_of_jade_court_position: "Ministro Oculto del Jade"
 hidden_minister_of_jade_court_position_desc: "El Ministro Oculto del Jade recauda y distribuye fondos para la corte, ya sea como moneda mortal tradicional o como jade."
 hidden_minister_of_rites_court_position: "Ministro Oculto de los Ritos"
 hidden_minister_of_rites_court_position_desc: "El Ministro Oculto de los Ritos supervisa un amplio abanico de actividades, incluyendo asegurar la ejecución justa y equitativa de las guerras en la sombra locales. La posición también salvaguarda el feng shui de la región y la vitalidad general de los Nidos de Dragón y sus líneas."
 hidden_minister_of_shen_court_position: "Ministro Oculto de los Shen"
 hidden_minister_of_shen_court_position_desc: "El Ministro Oculto de los Shen es un puesto diplomático con un doble propósito. El mandato público de esta posición es mantener relaciones con los shen regionales. Su mandato privado, sin embargo, es asesorar al Augusto Ancestro sobre las debilidades explotables de los shen rivales."
 hidden_minister_of_war_court_position: "Ministro Oculto de la Guerra"
 hidden_minister_of_war_court_position_desc: "Cuando todo lo demás falla y el conflicto abierto es inevitable, el Ministro Oculto de la Guerra es a menudo el general que dirige las fuerzas Wan-Kuei regionales contra el enemigo."
 hidden_minister_of_the_garden_court_position: "Ministro Oculto del Jardín"
 hidden_minister_of_the_garden_court_position_desc: "El Ministro Oculto del Jardín atiende los asuntos mortales regionales, salvaguardando «el bienestar adecuado y virtuoso de la población»."
 hidden_minister_of_hushed_lanterns_court_position: "Ministro Oculto de los Faroles Silenciados"
 hidden_minister_of_hushed_lanterns_court_position_desc: "El Ministro Oculto de los Faroles Silenciados es una especie de solucionador de problemas, encargándose de «problemas desagradables» y situaciones embarazosas que el Augusto Ancestro o los Ministros no quieren manejar directamente."
 minister_of_jade_court_position: "Ministro del Jade"
 minister_of_jade_court_position_desc: "El Ministro del Jade se ocupa del tesoro local, y es responsable de recaudar impuestos regionales y tributos para el Ministro Oculto por encima de él."
 minister_of_rites_court_position: "Ministro de los Ritos"
 minister_of_rites_court_position_desc: "El Ministro de los Ritos supervisa las guerras en la sombra locales y ayuda a determinar el vencedor del conflicto si no hay un ancestro de la ciudad para manejar las tareas."
 minister_of_shen_court_position: "Ministro de los Shen"
 minister_of_shen_court_position_desc: "El Ministro de los Shen es tan embajador como el Ministro Oculto cuando trata con los shen, aunque la Corte Augusta lo trata oficialmente como un ayudante del Ministro Oculto de la región."
 minister_of_war_court_position: "Ministro de la Guerra"
 minister_of_war_court_position_desc: "Si el Ministro Oculto de la Guerra es un general, entonces el Ministro de la Guerra sirve como su adjunto. Este Ministro tiene poco que ver con la lucha real, y es en cambio los ojos, oídos y portavoz a través del cual se emiten las órdenes del Ministro Oculto, y a través del cual el Ministro Oculto recibe su información."
 minister_of_the_garden_court_position: "Ministro del Jardín"
 minister_of_the_garden_court_position_desc: "El Ministro del Jardín supervisa los asuntos mortales regionales en nombre del Ministro Oculto local, hasta que el Ministro Oculto considere que la situación es lo bastante grave como para requerir su atención personal."
 yin_ambassador_court_position: "Embajador Yin"
 yin_ambassador_court_position_desc: "El Embajador Yin sirve al ancestro local como su puente con el [UmbraGlossaryLocalized('shadowlands','Mundo Yin')] local y sus espantosos reinos."
 yang_ambassador_court_position: "Embajador Yang"
 yang_ambassador_court_position_desc: "El Embajador Yang es el análogo al emisario Yin, proporcionando un puente al dinámico y vibrante [Glossary('Mundo Yang','game_concept_yang_world_desc')]."
 first_oni_court_position: "Primer Oni"
 first_oni_court_position_desc: "El Primer Oni es similar a un señor de la guerra, supervisando la seguridad regional, protegiéndola contra [akuma|E] e influencias del [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] y generalmente encabezando campañas sancionadas contra enemigos."
 infant_devil_civilizer_court_position: "Civilizador de Diablillos"
 infant_devil_civilizer_court_position_desc: "Hay un momento y lugar para la persuasión gentil de un padre, pero durante la doma de los salvajes $pod_kueijin$ recién regresados del [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] no es tal momento. En este papel entra el Civilizador de Diablillos, el supervisor de los esfuerzos de varias Sociedades Civilizadoras de Diablillos locales para reclamar, someter y escoltar a estas almas retornadas a la Corte más cercana."

 master_rite_court_position: "Maestro del Rito"
 master_rite_court_position_desc: "El $master_rite_court_position$ es responsable del bienestar espiritual del Caern. Todos los rituales que tienen lugar deben obtener primero su aprobación."
 gatekeeper_court_position: "Guardián del Umbral"
 gatekeeper_court_position_desc: "El $gatekeeper_court_position$ es probablemente la primera persona que encuentran los recién llegados. Recaudando tributo e información de los visitantes, el Guardián del Umbral está a menudo bastante ocupado, ya que el mantenimiento de los espirituales Puentes Lunares también está bajo su responsabilidad."
 wyrm_foe_court_position: "Adversario del $glossary_wyrm$"
 wyrm_foe_court_position_desc: "El $wyrm_foe_court_position$ es el guerrero más fiero del sept, no necesariamente el más hábil pero ciertamente el más ansioso. Sirven como segundo al mando del líder del sept durante las acciones ofensivas contra los esbirros del Wyrm."
 talesinger_court_position: "Cantacuentos"
 talesinger_court_position_desc: "El $talesinger_court_position$ está encargado de mantener la reputación del Caern creando e interpretando cuentos o canciones de las grandes hazañas realizadas por los héroes del sept. También transmiten la historia de los Garou a los jóvenes."
 master_challenges_court_position: "Maestro de Desafíos"
 master_challenges_court_position_desc: "El $master_challenges_court_position$ sirve como juez para los desafíos que tienen lugar en el Caern. Una figura intimidante, también se espera que mantenga a raya a los guerreros en tiempos de paz."

 court_seer_court_position: "[SelectLocalization(GetPlayer.IsValid, 'court_seer_court_position_from_player', 'custom_court_seer')]"
 court_seer_court_position_from_player: "[GetPlayer.Custom('CourtSeer')]"
 custom_court_seer: "Vidente de la Corte"
 custom_court_seer_oracle: "Oráculo de la Corte"
 custom_court_seer_augur: "Augur de la Corte"
 court_seer_court_position_desc: "El $court_seer_court_position$ predice el futuro y determina los días propicios o nefastos para celebrar ceremonias oficiales."

 minister_eagles_court_position: "Ministro de las Águilas"
 minister_eagles_court_position_desc: "El Ministro de las Águilas se especializa en información de cualquier tipo, ya sea información mundana sobre la infraestructura y el panorama político mortal, saberes perdidos de las eras anteriores a su aprisionamiento o actividad sobrenatural que pudiera amenazar a la Corte."
 minister_aurochs_court_position: "Ministro de los Uros"
 minister_aurochs_court_position_desc: "El Ministro de los Uros, también llamado el Guardián, tiene la tarea de defender la Corte y hacer cumplir sus leyes. También defienden a los Caídos de alto rango contra intentos de asesinato de demonios rivales."
 minister_dragons_court_position: "Ministro de los Dragones"
 minister_dragons_court_position_desc: "El Ministro de los Dragones tiene la tarea de cuestionar y desafiar la autoridad. Deben vigilar siempre los signos de corrupción y traición. Se anima a los demonios a ser circunspectos en sus tratos y el Censor se asegura de que la chispa rebelde en cada demonio que los impulsó contra Dios sea canalizada hacia medios constructivos."
 minister_dust_court_position: "Ministro del Polvo"
 minister_dust_court_position_desc: "El Ministro del Polvo está encargado de la custodia del rebaño mortal así como del avance de la Corte. Gestiona las instituciones mortales, manteniéndolas alejadas de la infraestructura de la Corte así como incrementando la cantidad general de Fe dentro de la población, ya sea apoyando instituciones religiosas o degradando la ciudad para que la gente se aferre aún más fuertemente a sus creencias." 
 minister_swords_court_position: "Ministro de los Leones"
 minister_swords_court_position_desc: "Encargado de luchar contra las amenazas a la Corte, el Ministro de los Leones gestiona los soldados de élite de la Corte. Dado que el uso abierto de la violencia y las demostraciones de fuerza está restringido en comparación con la Era de la Ira, las llamadas 'Espadas' deben operar con cuidado para cumplir con sus deberes." 
    
 brujah_warmaster_court_position: "Maestro de Guerra Brujah"
 brujah_warmaster_court_position_desc: "El $brujah_warmaster_court_position$ era tradicionalmente el instructor en batalla para los Brujah recién creados en tiempos antiguos. El clan ha caído muy bajo y esta tradición ha sido en su mayoría olvidada, pero algunos aún se aferran a ella, forzando a los neonatos a un riguroso, casi espartano, régimen de entrenamiento tras su presentación en la corte."
 
 underworld_ambassador_court_position: "Embajador del Inframundo"
 underworld_ambassador_court_position_desc: "El Embajador del [UmbraGlossaryLocalized('shadowlands','Inframundo')] sirve al gobernante local como su puente con los reinos del [UmbraGlossaryLocalized('shadowlands','Inframundo')] local."
 umbra_ambassador_court_position: "Embajador de la [umbra|E]"
 umbra_ambassador_court_position_desc: "El Embajador de la [umbra|E] sirve al gobernante local como su puente con los reinos de la [umbra|E] local."
 trod_wayfarer_court_position: "Caminante de Trods"
 trod_wayfarer_court_position_desc: "Los Trods son la conexión más cercana de los feéricos al [UmbraGlossary('dreaming')] y la [UmbraGlossary('arcadia')] más allá. También son poder. Aquellos que controlan los trods ejercen un gran control sobre la sociedad feérica."
 
 touchstones_court_position: "Piedras de Toque"
 touchstones_court_position_desc: "Las Piedras de Toque son la conexión de un vampiro con el mundo mortal, representando una mentalidad en la que se valoran a sí mismos. Una Piedra de Toque debe ser un único ser humano vivo. La piedra de toque podría ser un compañero o familiar superviviente, alguien relacionado con una persona a quien el vampiro mató en su temprana no-vida o incluso simplemente alguien con quien se cruzan regularmente.\nAlgunos Vástagos, debido a su desconexión del mundo mortal, pueden incluso elegir una Piedra de Toque que no sabe que existen, optando en cambio por acechar y vigilar al humano para conservar sus conexiones con la humanidad."

 alastor_court_position: "Alastor"
 alastor_court_position_desc: "Un Alastor es un agente Vástago de la Camarilla que ha sido encargado de cazar a los Anatema: vampiros peligrosos que han sido añadidos a la Lista Roja de la Camarilla y señalados para su destrucción por toda la secta."
 alastor_court_employer_custom_effect_description: "Permite enviar a un Alastor a cazar Anatema a cambio de una recompensa."
 praetor_court_position: "Pretor"
 praetor_court_position_desc: "Pretor, o líder de proyecto, son términos usados para describir a arcontes notables a los que se ha dado autoridad sobre sus pares. La posición normalmente solo dura lo que una misión determinada, pero algunos continúan usando el título con orgullo."
 dogcatcher_court_position: "Perrero"
 dogcatcher_court_position_desc: "Perrero es un título informal para arcontes que han adquirido el hábito de enfrentarse a hombres lobo y que poseen un conocimiento mucho mayor de las habilidades, hábitos y sociedades de los hombres lobo que otros vampiros."
 doppelganger_court_position: "Doppelganger"
 doppelganger_court_position_desc: "Doppelganger es una designación informal para arcontes que adoptan una identidad de incógnito profunda para hacer un trabajo específico."
 josian_court_position: "Josiano"
 josian_court_position_desc: "Los Josianos son Arcontes cazadores de infernalistas. También están dedicados a desenmascarar cultos de Gehena mientras investigan secretamente el saber Nodista descubierto en busca de cualquier evidencia de que la Gehena pueda ser un peligro real."
 quaesitor_court_position: "Quaesitor"
 quaesitor_court_position_desc: "Los Quaesitores son una rama de arcontes que son casi en su totalidad vampiros Tremere. Atienden todas las necesidades de hechicería de la Camarilla, ya sea combatiendo a los koldun del Sabbat, magos, o cazando Tremere renegados."
 
 oathsworn_mount_court_position: "Montura Juramentada"
 oathsworn_mount_court_position_desc: "Un cortesano [GetTrait('pooka').GetName( GetPlayer )] (con afinidad como animal grande) o un [GetTraitGroup('fera').GetName()] que ha jurado un juramento a un señor Feérico puede servir como montura inteligente para ese señor."
 oathsworn_mount_employer_custom_effect_description: "Velocidad de viaje y movimiento de ejército aumentada dependiendo de la [aptitude|e]."
 
 strategoi_court_position: "Strategoi"
 strategoi_court_position_desc: "Los strategoi dirigen efectivamente las operaciones de los asuntos cotidianos del Eforato. Cada uno es responsable de una parte diferente del dominio del Eforato. De noche a noche, el strategos supervisa los negocios y asuntos políticos Ventrue en su región además de atender sus propias necesidades y dignitas."
 lictor_court_position: "Lictor"
 lictor_court_position_desc: "Los Lictores son los solucionadores de problemas del Eforato, estos Ventrue enviados para tratar con problemas que amenazan al clan. Esta amplia asignación también les lleva a necesitar un amplio abanico de habilidades pero la mayoría de los Lictores terminan siendo combatientes de primera línea. Están justo en el rango adecuado de ser hábiles pero no lo bastante importantes como para que importe si perecen en su cumplimiento del deber."
 tribunes_court_position: "Tribunos"
 tribunes_court_position_desc: "El Eforato mantiene una red informal de contactos y «agentes sobre el terreno» alrededor del mundo. Estos Vástagos son referidos tanto como tribunos como agentes en general, y sirven como los ojos y oídos de los éforos por todo el mundo."
 
 POD_spread_legitimacy: "Difundir Legitimidad"
 POD_spread_legitimacy_desc: "Este personaje tiene la tarea de representar a su señor para un área específica, abordando una preocupación concreta o siendo el portavoz de una parte del reino."
 POD_tribute_collecting: "Recaudando Tributo"
 POD_tribute_collecting_desc: "Este personaje tiene la tarea de asegurarse de que todos en el reino paguen el debido respeto y tributo al gobernante, ya sea por encanto, fuerza o simplemente buen sentido administrativo."
 POD_war_preparations: "Preparativos de Guerra"
 POD_war_preparations_desc: "Este personaje tiene la tarea de asegurarse de que todos en el reino estén listos para la guerra en cualquier momento, ya sea por encanto, fuerza o simplemente buen sentido administrativo."
 POD_vassal_handler: "Delegando Poder"
 POD_vassal_handler_desc: "Este personaje tiene la tarea de representar a su señor en dominios lejanos, asegurándose de que incluso las regiones fronterizas se sientan aún conectadas al centro."
 POD_home_seneschal: "Consolidar Dominio"
 POD_home_seneschal_desc: "Este personaje tiene la tarea de asegurarse de que todo funcione sin problemas en el centro del reino mientras su señor pueda estar centrado en asuntos más globales."
 POD_home_builder: "Mejorar Dominio"
 POD_home_builder_desc: "Este personaje tiene la tarea de asegurarse de que la influencia de su señor se sienta apropiadamente incluso mientras está ausente."
 POD_home_defender: "Defender Dominio"
 POD_home_defender_desc: "Este personaje tiene la tarea de defender el dominio de su señor sin importar el coste."
 POD_stress_relief: "Maestro del Entretenimiento"
 POD_stress_relief_desc: "Este personaje tiene la tarea de asegurarse de que las actividades proporcionadas a la corte y a su gobernante estén siempre bien preparadas."
 POD_spread_prestige: "Difundir Historias Épicas"
 POD_spread_prestige_desc: "Este personaje tiene la tarea de difundir historias impresionantes sobre su señor. Algunas son incluso ciertas."
 POD_spread_piety: "Difundir Historias Pías"
 POD_spread_piety_desc: "Este personaje tiene la tarea de difundir impresionantes hazañas pías realizadas por su señor. Algunas son incluso ciertas."
 POD_help_schemes: "Ayudar en Asuntos Turbios"
 POD_help_schemes_desc: "Este personaje ofrece ayuda no oficial a tus tratos más desagradables."
 POD_organize_champions: "Organizar Campeones"
 POD_organize_champions_desc: "Este personaje ayuda a reclutar y gestionar la guardia de honor de su señor."
 POD_organize_retinue: "Organizar Séquito"
 POD_organize_retinue_desc: "Este personaje ayuda a reclutar y gestionar las tropas de élite de su señor."
 POD_organize_plasmic: "Organizar Plásmicos"
 POD_organize_plasmic_desc: "Este personaje ayuda a organizar y entrenar a los plásmicos de su señor."
 POD_organize_wraith: "Organizar Espectros"
 POD_organize_wraith_desc: "Este personaje ayuda a organizar y entrenar a los espectros de su señor."
 POD_organize_demonic: "Organizar Demonios"
 POD_organize_demonic_desc: "Este personaje ayuda a organizar y entrenar a los demonios de su señor."
 POD_organize_spirit: "Organizar Espíritus"
 POD_organize_spirit_desc: "Este personaje ayuda a organizar y entrenar a los espíritus de su señor."
 POD_organize_bygone: "Organizar Vestigios"
 POD_organize_bygone_desc: "Este personaje ayuda a organizar y entrenar a los vestigios de su señor."
 POD_organize_chimera: "Organizar Quimeras"
 POD_organize_chimera_desc: "Este personaje ayuda a organizar y entrenar a las quimeras de su señor."
 POD_organize_faerie: "Organizar Hadas"
 POD_organize_faerie_desc: "Este personaje ayuda a organizar y entrenar a las hadas de su señor."
 POD_manage_estate: "Gestionar Propiedades"
 POD_manage_estate_desc: "Este personaje se centra en gestionar el [domicile|E] personal de su señor."
 

 imperial_envoy_court_position: "Enviado Imperial"
 imperial_envoy_court_position_desc: "El $imperial_envoy_court_position$ está representando a su señor en las lejanas fronteras de su reino recordándoles que deben pagar tributo aunque estén lejos."
 imperial_chancellor_court_position: "Canciller Imperial"
 imperial_chancellor_court_position_desc: "El $imperial_chancellor_court_position$ se asegura de que la voz de su señor sea correctamente escuchada. Incluso las reprimendas furiosas pueden recibir un barniz de legitimidad si es necesario."
 imperial_minister_court_position: "Ministro Imperial"
 imperial_minister_court_position_desc: "El $imperial_minister_court_position$ ayuda a dirigir los asuntos del día a día (o noche a noche) en el reino. A medida que la influencia de su señor crece, su tarea se vuelve cada vez más crítica."

 hanshii_arbiter_court_position: "Árbitro Hanshii"
 hanshii_arbiter_court_position_desc: "Un pilar de la cultura Bastet, los Hanshii son combates rituales usados para entretenimiento o para decidir derechos territoriales. Estas contiendas pueden ser juegos de adivinanzas, duelos formales o guerra de colmillos y garras."
 seline_oracle_court_position: "Oráculo de Seline"
 seline_oracle_court_position_desc: "La hermana compasiva de Gaia, la Luna, obviamente favorece a los hombres gato y los considera sus creaciones más finas. Ella alumbró a las Razas Cambiantes como un regalo a la Tierra y se dice que su cuerpo es el santuario final para todos los Bastet."
 master_taghairm_court_position: "Maestro del Taghairm"
 master_taghairm_court_position_desc: "El Taghairm es una reunión de gatos a menudo convocada para intercambiar información o cortesías. Usualmente se realiza durante el apogeo de la luna llena."
 warleader_taklah_court_position: "Líder de Guerra Taklah"
 warleader_taklah_court_position_desc: "Un Taklah es un séquito de élite compuesto totalmente por hombres gato reunidos para un propósito común."
 guardian_yava_court_position: "Guardián del Yava"
 guardian_yava_court_position_desc: "Un Yava es un secreto tribal, oculto a todos los forasteros, que supuestamente otorga a otro ser poder sobre ti si es aprendido. El saber más estrechamente guardado de todos los Bastet, estos son expuestos solo bajo las más extremas circunstancias, si acaso."


 ratcatcher_court_position: "Cazador de Ratas"
 ratcatcher_court_position_desc: "El deber de un $ratcatcher_court_position$ es pastorear ratas, asegurarse de que sean comestibles y acorralarlas como fuente de $pod_vitae$ para los vampiros menos afortunados de la corte."
 #ratcatcher_employer_custom_effect_description: "$BULLET$Mejora la interacción de Drenar Animal"

 scarlet_screen_family_court_position: "Pantalla Escarlata Familiar"
 scarlet_screen_family_court_position_desc: "La Pantalla Escarlata más importante. El [Glossary('Dharma','podgloss.dharma')] como las Flores de Hueso tienen incluso el imperativo de salvaguardar la familia. Además, la familia mortal de un $POD_splat_kueijin$ está a menudo entre sus seguidores más leales.\n\n#help La [aptitude|E] de esta [court_position|E] se basa en los lazos familiares."

 scarlet_screen_inugumi_court_position: "Pantalla Escarlata Inugumi"
 scarlet_screen_inugumi_court_position_desc: "Los soldados son la Pantalla Escarlata más visible, a menudo empleados en forma de bandas criminales o personas que suministran al $POD_splat_kueijin$ armas y bienes similares.\nSe clasifican según tres tipos, siendo las «bandas de perros» (inugumi) más leales y a veces incluso teniendo contacto con lo sobrenatural.\n\n#help La [aptitude|E] de esta [court_position|E] se basa en el nivel de [education|E] [martial|E]."

 scarlet_screen_ryugumi_court_position: "Pantalla Escarlata Ryugumi"
 scarlet_screen_ryugumi_court_position_desc: "Los soldados son la Pantalla Escarlata más visible, a menudo empleados en forma de bandas criminales o personas que suministran al $POD_splat_kueijin$ armas y bienes similares.\nSe clasifican según tres tipos, siendo las «tropas de dragón» (ryugumi), entrenadas exactamente con el propósito de combatir grandes amenazas para su amo $POD_splat_kueijin$.\n\n#help La [aptitude|E] de esta [court_position|E] se basa en el nivel de [education|E] en [prowess|E]."

 scarlet_screen_artisans_court_position: "Pantalla Escarlata de Artesanos"
 scarlet_screen_artisans_court_position_desc: "Los artesanos trabajan para aumentar la influencia de su amo en la ciudad a través de medios civiles (en contraste con las acciones de los soldados), así como inspirando a otras pantallas con su conocimiento.\n\n#help La [aptitude|E] de esta [court_position|E] se basa en el nivel de [education|E] en [learning|E]."

 scarlet_screen_peasants_court_position: "Pantalla Escarlata de Campesinos"
 scarlet_screen_peasants_court_position_desc: "Campesinos responsables de mantener a salvo al $POD_splat_kueijin$. En la [Glossary('Quinta Edad','game_concept_fifth_age_desc')], los grupos políticos locales han pasado a ser clasificados como «campesinos» también.\n\n#help La [aptitude|E] de esta [court_position|E] se basa en el nivel de [education|E] en [diplomacy|E]."

 scarlet_screen_spies_court_position: "Pantalla Escarlata de Espías"
 scarlet_screen_spies_court_position_desc: "Los espías se dividen en dos grupos.\nLos espías regulares se usan para la recolección de inteligencia.\n\n#help La [aptitude|E] de esta [court_position|E] se basa en el nivel de [education|E] en [intrigue|E]."

 scarlet_screen_merchants_court_position: "Pantalla Escarlata de Mercaderes"
 scarlet_screen_merchants_court_position_desc: "Los espías se dividen en dos grupos.\nLos mercaderes se encargan de las necesidades financieras del $POD_splat_kueijin$.\n\n#help La [aptitude|E] de esta [court_position|E] se basa en el nivel de [education|E] en [stewardship|E]."

 cult_leader_court_position: "Líder del Culto"
 cult_leader_court_position_desc: "Líder y gurú del culto personal de un $POD_splat_demon$ que recolecta fe. Estos cultistas tienen una posición especial en el culto de su amo y manejan las tareas del día a día, dejando al Demonio centrarse en asuntos más importantes.\n#help La [aptitude|E] de esta [court_position|E] se basa en [stewardship|E], [intrigue|E] y [learning|E] así como los [traits|E] [GetTrait('schemer').GetName(GetNullCharacter)] y [GetTrait('diligent').GetName(GetNullCharacter)]."
 
 fell_knight_court_position: "Caballero Caído"
 fell_knight_court_position_desc: "Dotados para liderar por ritos que se remontan a la Creación, los Caballeros Caídos son los puños acorazados de su amo Ángel Caído."
 
 
 majordomo_court_position: "Mayordomo"
 majordomo_court_position_desc: "Un Mayordomo es un rol especial diseñado para un [GetTrait('ghoul').GetName(GetNullCharacter)] que típicamente sirve a su [Glossary('Domitor','game_concept_domitor_desc')] como el jefe de mayordomos de sus propiedades y asuntos. El Mayordomo cumplirá las órdenes de su amo repartiendo asignaciones y órdenes que van desde contratar servicios externos hasta mantener a raya a otros ghouls."