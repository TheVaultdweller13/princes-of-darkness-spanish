l_spanish:
 POD_create_coterie_interaction: "Crear una [GetPlayer.Custom('PODCoterieNoTooltip')]"
 POD_create_coterie_interaction_desc: "[GetPlayer.GetShortUINameNoTooltip|U] se convertirá en el fundador de una nueva [GetPlayer.Custom('PODCoterie')]."
 POD_create_coterie_interaction_effect: "#V [actor.GetFirstNameNoTooltip]#! se convertirá en el fundador de una nueva [GetPlayer.Custom('PODCoterie')]."
 POD_create_coterie_interaction_effect2: "Podrás elegir su nombre."
 
 POD_invite_to_coterie_interaction: "Invitar a [GetPlayer.Custom('PODGetCoterieName')]"
 POD_invite_to_coterie_multiplayer_interaction: "$POD_invite_to_coterie_interaction$"
 POD_invite_to_coterie_interaction_desc: "[recipient.GetShortUINameNoTooltip] se convertirá en miembro de tu [GetPlayer.Custom('PODCoterie')]."
 POD_invite_to_coterie_interaction_effect: "[recipient.GetShortUIName] se convertirá en miembro de tu [GetPlayer.Custom('PODCoterie')]."
 POD_at_coterie_size_cap: "Tu [GetPlayer.Custom('PODCoterie')] ya tiene [EmptyScope.ScriptValue('coterie_max_size')] miembros"
 POD_coterie_requirement_same_realm: "[recipient.GetShortUIName] debe formar parte del mismo [realm|E] que tú, o estar casado contigo"
 POD_recipient_already_has_coterie: "[recipient.GetShortUIName] ya es miembro de #bold [recipient.Custom('PODGetCoterieName')]#!"
 POD_invite_to_coterie_interaction_mortal: "No puedes invitar a $POD_splat_mortal_plural$ a tu [GetPlayer.Custom('PODCoterie')]"
 POD_invite_to_coterie_interaction_mortal_cultist: "No puedes invitar a $POD_splat_mortal_plural$ a tu [GetPlayer.Custom('PODCoterie')] a menos que sean tus cultistas"
 POD_invite_to_coterie_interaction_mortal_neteru: "No puedes invitar a $POD_splat_mortal_plural$ a tu [GetPlayer.Custom('PODCoterie')] a menos que sean tus [neteru|E]"
 POD_invite_to_coterie_interaction_packbond: "Ten en cuenta que los $glossary_fera$ se vinculan con su [GetPlayer.Custom('PODCoterie')] de por vida, por lo que no podrás expulsar a [recipient.GetHerHim] más tarde."
 POD_invite_to_coterie_interaction_rivalry: "#help La pertenencia a una [GetPlayer.Custom('PODCoterie')] se considera un compromiso. Podrás expulsar a [recipient.GetShortUIName] más tarde, pero [recipient.GetSheHe] se convertirá en tu [rival|E] si lo haces.#!"
 
 POD_kick_from_coterie_interaction: "Expulsar de [GetPlayer.Custom('PODGetCoterieName')]"
 POD_kick_from_coterie_interaction_desc: "[recipient.GetShortUINameNoTooltip] dejará de ser miembro de tu [GetPlayer.Custom('PODCoterie')]."
 POD_kick_from_coterie_interaction_packbond: "Los $glossary_fera$ no pueden expulsar a otros miembros porque se vinculan con su [GetPlayer.Custom('PODCoterie')] de por vida"
 
 POD_disband_coterie_interaction: "Disolver [GetPlayer.Custom('PODGetCoterieName')]"
 POD_disband_coterie_interaction_desc: "Disuelve tu [GetPlayer.Custom('PODCoterie')]."
 POD_disband_coterie_interaction_effect: "Tu [GetPlayer.Custom('PODCoterie')], $POD_player_coterie$, será disuelta."
 POD_disband_coterie_interaction_packbond: "Los $glossary_fera$ no pueden disolver su [GetPlayer.Custom('PODCoterie')] a menos que no queden otros miembros"
