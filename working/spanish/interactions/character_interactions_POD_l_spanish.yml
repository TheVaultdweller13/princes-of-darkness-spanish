 ### Evento 1: El Acercamiento
 POD_impundulu.2001.t: "El Intercambio de los Muertos"
 POD_impundulu.2001.desc: "Nos sentamos uno frente al otro — dos estudiosos de la tumba, divididos por la sangre pero unidos por la curiosidad. La oferta ha sido hecha. Ahora debemos determinar el precio.\n\n¿Qué ofrecemos a cambio de su conocimiento de la muerte?"
 POD_impundulu.2001.a: "Oro. El disolvente universal."
 POD_impundulu.2001.b: "Un favor. Les debo una."
 POD_impundulu.2001.c: "Nuestros propios secretos. Las sendas del Cenotafio y del Acecho."
 POD_impundulu_exchange_offer_gold_tt: "Pagarás 200 de oro por el conocimiento nigromántico."
 POD_impundulu_exchange_offer_favor_tt: "Les deberás un favor a cambio del conocimiento."
 POD_impundulu_exchange_offer_secrets_tt: "Compartirás secretos de nigromancia Impundulu a cambio. Ellos obtienen acceso a las sendas Cenotafio/Acecho."

 ### Evento 2: El Resultado
 POD_impundulu.2002.t: "Conocimiento Intercambiado"
 POD_impundulu.2002.desc: "El intercambio está completo. Noches de cuidadosas discusiones, rituales compartidos y demostraciones cautelosas han dado fruto. Hemos vislumbrado su enfoque de las artes nigrománticas — una perspectiva diferente a la nuestra, aunque innegablemente poderosa.\n\nUna nueva senda de la muerte se abre ante nosotros."
 POD_impundulu.2002.a: "Los muertos hablan en muchas lenguas. Ahora comprendo una más."

 ### Alternativa si todos los objetivos válidos murieron en el período de espera de 1 año
 POD_impundulu.2003.t: "Búsqueda Infructuosa"
 POD_impundulu.2003.desc: "Aunque nuestros exploradores viajaron a lo largo y ancho en busca de estudiosos de la tumba, finalmente regresaron con las manos vacías.\n\nAquellos expertos que inicialmente mostraron interés en nuestra correspondencia o bien murieron, perdieron su base de operaciones, o encontraron alguna otra razón para dejar de comunicarse con nosotros."
 POD_impundulu.2003.a: "Lamentable, pero podemos intentarlo en otra ocasión."