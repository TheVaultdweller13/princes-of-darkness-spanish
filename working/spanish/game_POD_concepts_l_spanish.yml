l_spanish: 
 game_concept_princes_of_darkness: "Príncipes de la Oscuridad"
 game_concept_princes_of_darkness_desc: "Un mod para Crusader Kings 3 centrado en las criaturas sobrenaturales del '$pod_wod$' de White Wolf. ¡Lo estás jugando ahora mismo! Un [Glossary('Prince','game_concept_prince_desc')] es el título territorial principal para un [GetTrait('vampire').GetName( GetNullCharacter )] que gobierna un dominio, equivalente a un [duchy|E] de CK3. ¿Qué es la oscuridad? Mírate a ti mismo."
 
 game_concept_world_of_darkness: "Mundo de Tinieblas"
 game_concept_WoD: "MdT" 
 game_concept_world_of_darkness_desc: "El Mundo de Tinieblas es un universo que lleva más de 30 años en funcionamiento, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales interactúan bajo la superficie, creando un inframundo lleno de intrigas e historias."
 
 game_concept_prince: "Príncipe"
 game_concept_princes: "Príncipes" 
 game_concept_prince_desc: "Un príncipe es el título territorial principal para un [GetTrait('vampire').GetName( GetNullCharacter )] que gobierna un dominio, equivalente a un [duchy|E] de CK3."
 
 game_concept_blood_potency: "Potencia de Sangre"
 #game_concept_blood_potency_desc: "La Potencia de Sangre es el poder inherente de la sangre de un [GetTrait('vampire').GetName( GetNullCharacter )] que crece lentamente con el tiempo y está limitado por la [Glossary('Generation','game_concept_vampgeneration_desc')] del [GetTrait('vampire').GetName( GetNullCharacter )]. La Potencia de Sangre disminuye lentamente en $pod_torpor$. Puede aumentar más rápidamente mediante la diablerización de $POD_splat_vampire_plural$ con mayor potencia de sangre. La Potencia de Sangre afecta la rapidez con que el uso de $pod_discipline$ aumenta el hambre y el impacto de tus poderes de [GetTrait('vampire').GetName( GetNullCharacter )] como [Glossary('Disciplines','game_concept_discipline_desc')]."
 game_concept_blood_potency_desc: "#bold Potencia de Sangre#! es el poder inherente de la sangre de un [GetTrait('vampire').GetName( GetNullCharacter )].\n\nUna mayor Potencia de Sangre aumenta las [skills|E] de uno y confiere varias bonificaciones, pero también hace más difícil saciar la [hunger_with_icon|E] en los mortales. Eventualmente, se hace necesario subsistir de la sangre de otros Vampiros.\n\nLa Potencia de Sangre aumenta muy lentamente a lo largo de los siglos, hasta un límite basado en la [Glossary('Generation','game_concept_vampgeneration_desc')] del Vampiro. La $pod_diablerie$ la aumentará aún más. Disminuye lentamente mientras está en $pod_torpor$."
 
 game_concept_vampgeneration: "Generación"
 game_concept_vampgeneration_desc: "Según los $pod_cainites$, es la distancia de la sangre de un $POD_splat_vampire$ del padre de todos los $POD_splat_vampire_plural$ — Caín. Caín es de la [GetTrait('vampgeneration1').GetName( GetNullCharacter )]. Los Vampiros de la [GetTrait('vampgeneration14').GetName( GetNullCharacter )] o superior son de 'sangre débil' y son casi humanos y apenas vampiros en absoluto. Los Vampiros que no creen que Caín sea el progenitor a menudo rastrean su [Glossary('Generation','game_concept_vampgeneration_desc')] hasta algún otro fundador mítico. Los Vampiros pueden disminuir su [Glossary('Generation','game_concept_vampgeneration_desc')], y así aumentar su poder potencial, cometiendo $pod_diablerie$ en un vampiro de [Glossary('Generation','game_concept_vampgeneration_desc')] inferior a la suya."
 
 game_concept_bloodbond: "Vínculo de Sangre"
 game_concept_bloodbond_desc: "Beber sangre de [GetTrait('vampire').GetName( GetNullCharacter )] generalmente crea sentimientos de intensa lealtad y obediencia hacia el [GetTrait('vampire').GetName( GetNullCharacter )]. También llamado 'Juramento de Sangre', esto actúa como una influencia de intensidad creciente, cuanto más sangre se consume. Algunos vampiros no pueden crear vínculos con su sangre. Otros vampiros son completamente invulnerables al vínculo."
 
 game_concept_beast: "Bestia" 
 game_concept_the_beast: "La Bestia"
 game_concept_beasts: "Bestias"
 game_concept_beast_desc: "#bold La Bestia#! es un término usado por los $POD_splat_vampire_plural$ para describir al depredador interno que lucha por el control de su mente. Se opone directamente a su Humanidad y es responsable de muchos de los impulsos degradantes que los $pod_cainites$ sienten noche tras noche.\n\nEn momentos de extrema angustia, la Bestia puede abrumar a un [GetTrait('vampire').GetName( GetNullCharacter )] al forzarlo a un Frenesí, un estado de lucha o huida puramente animal.\n\nEn [princes_of_darkness|E], la Bestia a veces te hablará #beast así#!. Si un [GetTrait('vampire').GetName( GetNullCharacter )] tiene [piety|E] negativa, corre el riesgo de caer en un frenesí permanente y convertirse en un [GetTrait('wight').GetName( GetNullCharacter )]. Esto es una abdicación de facto a su [heir|E]."
 
 game_concept_the_masquerade: "La Mascarada"
 game_concept_masquerade_exposure: "Exposición de la Mascarada"
 game_concept_masquerade_exposure_with_icon: "@masquerade_icon! Exposición de la Mascarada"
 game_concept_the_masquerade_desc: "La Mascarada es un término usado por los $POD_splat_vampire_plural$ para describir el mantenimiento de su existencia en secreto de los mortales. Violar la Mascarada puede llevar a complicaciones como ser atacado por cazadores. En algunos dominios, puede ser considerado un [crime|E] entre vampiros.\nLa mayoría de las religiones pueden encubrir las violaciones de la Mascarada usando un [character_interaction|E] personal. Tener una Exposición de la Mascarada demasiado alta provocará revueltas faccionales y eventos donde tu personaje será atacado."  

 game_concept_cainites: "Cainitas"
 game_concept_cainite: "Cainita"
 game_concept_cainite_desc: "La mayoría de los $POD_splat_vampire_plural$ están de acuerdo con la 'historia del origen de Caín' para su especie. El primer asesino bíblico, después de haber matado a su propio hermano Abel, fue maldecido por Dios y sus ángeles de diversas maneras, resultando finalmente en la condición vampírica conocida hoy.\nComo tal, Cainita se ha convertido en un término muy comúnmente utilizado por los vampiros para describirse a sí mismos.\nEl término también se usa cuando se refiere a los vampiros 'occidentales' específicamente, en contraste con los $pod_kueijin$ orientales."  

 game_concept_diablerist: "Diablerista"
 game_concept_diablerizing: "Diablerizando"
 game_concept_diablerized: "Diablerizado"
 game_concept_diablerize: "Diablerizar"
 game_concept_diablerie: "Diablerie"
 game_concept_diablerie_desc: "El crimen más atroz que un vampiro puede cometer, una diablerie ocurre cuando toda la sangre de un vampiro es consumida por otro, lo que resulta en que el alma de la víctima también sea consumida. Este proceso, aunque mal visto por la mayoría, resulta en una mayor fuerza para el perpetrador, ya que puede aprender algunos de los poderes de la víctima o disminuir su generación, acercándolos a Caín.\nEn el juego, la diablerie es un complot disponible contra otros $POD_splat_vampire_plural$. Si logras llevarlo a cabo, puedes obtener nuevos poderes, mayor potencia de sangre, generación disminuida, pero a costa de una gran cantidad de piedad (dependiendo de tu religión) y un secreto difícil de llevar de ahora en adelante."
 
 game_concept_resonance: "Resonancia"
 game_concept_resonance_desc: "La sangre tiene cierta calidad basada en la personalidad y emociones de su recipiente. El consumo de sangre otorga poder a los $POD_splat_vampire_plural$ según el carácter de la Resonancia. Obtienes más experiencia en $pod_discipline$ bebiendo sangre de una resonancia particular, ya sea a través del [journey|E] #V $POD_hunt_target_interaction$#!, o pasivamente bebiendo de tu [POD_herd|E]. Las resonancias son:\n$BULLET_WITH_TAB$[choleric_lifestyle|E]\n$BULLET_WITH_TAB$[melancholy_lifestyle|E]\n$BULLET_WITH_TAB$[phlegmatic_lifestyle|E]\n$BULLET_WITH_TAB$[sanguine_lifestyle|E]\n$BULLET_WITH_TAB$[animal_lifestyle|E]"
 
 game_concept_torpor: "Torpor"
 game_concept_torpor_desc: "El Torpor es un estado de animación suspendida para un [GetTrait('vampire').GetName( GetNullCharacter )]. Aunque no pueden moverse, pueden ser conscientes de los eventos que ocurren a su alrededor. Puede ser causado por una estaca en el corazón, suficiente daño corporal, gran hambre o hastío.\nUn personaje con el [trait|E] [GetTrait('torpor').GetName( GetNullCharacter )] está severamente debilitado, no se puede interactuar con la mayoría de las acciones y no puede gobernar. Pueden ser despertados por el [character_interaction|E] especial #V $POD_wake_from_torpor_interaction$#!."
 game_concept_torpid: "torpido"
 
 game_concept_hunger: "Hambre"
 game_concept_hunger_desc: "#bold El Hambre#! es el deseo de un [GetTrait('vampire').GetName( GetNullCharacter )] de consumir sangre. Es causada por [Glossary('The Beast','game_concept_beast_desc')]. Cuanto mayor es la [blood_potency|E] de un Vampiro, más sangre necesita para reducir su Hambre. Aumentar el Hambre tiene efectos tanto positivos como mayormente negativos.\n\nLa única forma en que el Hambre de un [GetTrait('vampire').GetName( GetNullCharacter )] se sacia por completo es matando y drenando toda la sangre de una víctima. Incluso esa saciedad del Hambre es temporal.\n\nLos [ghouls|E] también tienen Hambre, con la complicación añadida de [ghoul_vitae_dependency|E]."
 game_concept_hunger_i: "@blood_icon!"
 game_concept_hunger_with_icon: "@blood_icon!Hambre"
 
 game_concept_discipline: "Disciplina" 
 game_concept_disciplines: "Disciplinas"
 game_concept_discipline_desc: "#bold Las Disciplinas#! son los poderes sobrenaturales de los $POD_splat_vampire_plural$. Muchas de ellas corresponden a habilidades vampíricas del folclore, como la fuerza sobrenatural ([GetTrait('potence').GetName(GetNullCharacter)]), la velocidad ([GetTrait('celerity').GetName(GetNullCharacter)]), la resiliencia ([GetTrait('fortitude').GetName(GetNullCharacter)]) o la invisibilidad ([GetTrait('obfuscate').GetName(GetNullCharacter)]).\n\nEl origen de las Disciplinas es desconocido, pero muchos creen que son dones de Caín o Lilith, y se cree que algunos [Glossary('Antediluvians','game_concept_antediluvian_desc')] inventaron Disciplinas únicas que se han transmitido a través de su linaje.\n\nEn [princes_of_darkness|E], las Disciplinas son árboles de [perk|E] que se desbloquean mediante el [trait|E] de Disciplina correspondiente. Cada $pod_clan$ tiene tres Disciplinas asociadas con las que comienzan sus miembros, y se pueden aprender más Disciplinas a través de [journeys|E], o mediante medios menos agradables como la $pod_diablerie$. La experiencia para los [lifestyles|E] de Disciplina se obtiene bebiendo sangre con la [resonance|E] correcta."

 game_concept_choleric_lifestyle: "Resonancia Colérica"
 game_concept_choleric_lifestyle_desc: "La Resonancia Colérica es adecuada para $POD_splat_vampire_plural$ que desean mejorar [Glossary('Disciplines','game_concept_discipline_desc')] que implican alimentarse de sangre con emociones como la ira y la envidia. Busca presas con [traits|E] de personalidad como [GetTrait('wrathful').GetName( GetNullCharacter )] y [GetTrait('sadistic').GetName( GetNullCharacter )].\n\nSus [Glossary('Disciplines','game_concept_discipline_desc')] comunes incluyen:\n$BULLET_WITH_TAB$[GetTrait('celerity').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('potence').GetName( GetNullCharacter )]\n\nSus [Glossary('Disciplines','game_concept_discipline_desc')] raras incluyen:\n$BULLET_WITH_TAB$[GetTrait('valeren').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('vicissitude').GetName( GetNullCharacter )]"

 game_concept_sanguine_lifestyle: "Resonancia Sanguínea"
 game_concept_sanguine_lifestyle_desc: "La Resonancia Sanguínea es adecuada para $POD_splat_vampire_plural$ que desean mejorar [Glossary('Disciplines','game_concept_discipline_desc')] que implican alimentarse de sangre con emociones como la felicidad y el entusiasmo. Busca presas con [traits|E] de personalidad como [GetTrait('gregarious').GetName( GetNullCharacter )] y [GetTrait('lustful').GetName( GetNullCharacter )].\n\nSus [Glossary('Disciplines','game_concept_discipline_desc')] comunes incluyen:\n$BULLET_WITH_TAB$[GetTrait('presence').GetName( GetNullCharacter )]\n\nSus [Glossary('Disciplines','game_concept_discipline_desc')] raras incluyen:\n$BULLET_WITH_TAB$[GetTrait('bloodsorcery').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('daimonion').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('kai').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('quietus').GetName( GetNullCharacter )]"

 game_concept_blood_magic_lifestyle: "Magia de Sangre"
 game_concept_blood_magic_lifestyle_desc: "A través de la práctica de la magia de sangre, un Cainita puede invocar fuego, controlar el clima y hacer muchas otras cosas que no son naturales incluso para los estándares vampíricos. Practicar la Hechicería de Sangre es someter la propia Sangre. Cualquier forma de este poder recuerda a un vampiro que está lejos de ser humano, ya que ningún mortal podría manejar la magia de esta manera."

 game_concept_faith_lifestyle: "Fe Verdadera"
 # game_concept_faith: "$game_concept_faith_lifestyle$" Sobrescribe el concepto original
 game_concept_faith_lifestyle_desc: "Un don raro para personajes muy fervientes, el rasgo de Fe Verdadera abre el estilo de vida del mismo nombre, donde se pueden adquirir varios poderes con la EXPERIENCIA de estilo de vida correspondiente"

 game_concept_phlegmatic_lifestyle: "Resonancia Flemática"
 game_concept_phlegmatic_lifestyle_desc: "La Resonancia Flemática es adecuada para $POD_splat_vampire_plural$ que desean mejorar [Glossary('Disciplines','game_concept_discipline_desc')] que implican alimentarse de sangre con emociones como la sentimentalidad y el control. Busca presas con [traits|E] de personalidad como [GetTrait('lazy').GetName( GetNullCharacter )] y [GetTrait('content').GetName( GetNullCharacter )].\n\nSus [Glossary('Disciplines','game_concept_discipline_desc')] comunes incluyen:\n$BULLET_WITH_TAB$[GetTrait('auspex').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('dominate').GetName( GetNullCharacter )]\n\nSus [Glossary('Disciplines','game_concept_discipline_desc')] raras incluyen:\n$BULLET_WITH_TAB$[GetTrait('dementation').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('melpominee').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('mytherceria').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('temporis').GetName( GetNullCharacter )]"

 game_concept_melancholy_lifestyle: "Resonancia Melancólica"
 game_concept_melancholy_lifestyle_desc: "La Resonancia Melancólica es adecuada para $POD_splat_vampire_plural$ que desean mejorar [Glossary('Disciplines','game_concept_discipline_desc')] que implican alimentarse de sangre con emociones como la tristeza y la intelectualización. Busca presas con [traits|E] de personalidad como [GetTrait('shy').GetName( GetNullCharacter )] y [GetTrait('craven').GetName( GetNullCharacter )].\n\nSus [Glossary('Disciplines','game_concept_discipline_desc')] comunes incluyen:\n$BULLET_WITH_TAB$[GetTrait('fortitude').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('obfuscate').GetName( GetNullCharacter )]\n\nSus [Glossary('Disciplines','game_concept_discipline_desc')] raras incluyen:\n$BULLET_WITH_TAB$[GetTrait('bardo').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('chimerstry').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('necromancy').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('obtenebration').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('rift').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('visceratika').GetName( GetNullCharacter )]"

 game_concept_animal_lifestyle: "Resonancia Animal"
 game_concept_animal_lifestyle_desc: "La Resonancia Animal es adecuada para $POD_splat_vampire_plural$ que desean mejorar [Glossary('Disciplines','game_concept_discipline_desc')] que implican alimentarse de animales. Busca animales como presa.\n\nSus [Glossary('Disciplines','game_concept_discipline_desc')] comunes incluyen:\n$BULLET_WITH_TAB$[GetTrait('animalism').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('protean').GetName( GetNullCharacter )]\n\nSus [Glossary('Disciplines','game_concept_discipline_desc')] raras incluyen:\n$BULLET_WITH_TAB$[GetTrait('abombwe').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('serpentis').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('spiritus').GetName( GetNullCharacter )]\n\nLa $pod_discipline$ [GetTrait('flight').GetName( GetNullCharacter )] es exclusiva de ciertos #TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L Gárgolas#!#!."

 game_concept_blood_draught: "Pócima"
 game_concept_blood_draught_desc: "La Sangre del vampiro se satura con el poder de su $pod_discipline$, transmitiendo una parte de ese poder a cualquiera que la beba. La Pócima se administra mediante un [character_interaction|E]."

 game_concept_shapeshift: "Cambio de Forma"
 game_concept_shapeshift_desc: "Un [character_interaction|E] que permite al usuario transformar su forma de alguna manera, generalmente nacido de [GetTrait('protean').GetName( GetNullCharacter )] o [GetTrait('vicissitude').GetName( GetNullCharacter )]."

 game_concept_bloodsorcery: "Hechicería de Sangre"
 game_concept_bloodsorcerer: "Hechicero de Sangre"
 game_concept_thaumaturgy: "Taumaturgia"
 game_concept_durnaki: "Dur-An-Ki"
 game_concept_bloodsorcery_desc: "La hechicería de sangre, también llamada Taumaturgia, Akhu, Dur-An-Ki y Valeran, es el arte de usar $pod_vitae$ Vampírica para evocar poderosos efectos mágicos. Poseída por unos pocos clanes raros y guardada celosamente, la hechicería de sangre es una herramienta poderosa pero peligrosa y costosa. Cada facción tiene su propia forma de invocar el poder de la sangre - los Tremere usan magia hermética y simbolismo, los hechiceros de los Banu Haqim hacen pactos con espíritus y dioses. Al mismo tiempo, los Lasombra se sumergen en el abismo en busca de evocaciones arcanas. Se dice que la magia de sangre tiene el poder de hacer casi cualquier cosa - y aunque estas afirmaciones generalmente provienen de practicantes que desean crear una imagen aterradora o de víctimas de maldiciones y bolas de fuego, es cierto que la hechicería de sangre concede acceso a innumerables hechizos y habilidades que uno podría considerar... Antinaturales."
 
 game_concept_necromancy: "Nigromancia"
 game_concept_necromancy_desc: "La Nigromancia es una forma de [bloodsorcery|E] que trata con la muerte, el [UmbraGlossaryLocalized('shadowlands','Inframundo')] y los $POD_splat_wraith_plural$, las almas de los muertos. \n Al utilizar los poderes del olvido y el abismo, los nigromantes pueden vincular wraiths a su voluntad y ordenarles que realicen una variedad de tareas, desde el espionaje hasta la posesión."
 
 game_concept_primogen: "Primogénito"
 game_concept_primogen_desc: "Primogénito es un título oficial para los $POD_splat_vampire_plural$ que sirven como representantes de sus [Glossary('Clans','game_concept_Clan_desc')]. Generalmente son el miembro más antiguo de su clan en la ciudad. En general, los [Glossary('Princes','game_concept_prince_desc')] gobernantes valoran a los Primogénitos y sus opiniones. Son llamados para consultar sobre decisiones, y sus recomendaciones tienen gran peso.\n\nEn el juego, los Primogénitos son [court_positions|E] disponibles para vampiros de [rank|E] de [kingdom|E] y superiores. Un $pod_clan$ que no está representado por un Primogénito se sentirá marginado, lo que resultará en penalizaciones de [opinion|E] con sus miembros.\n\nPara obtener pistas sobre lo que hace a un Primogénito hábil, consulta [primogen_aptitude|E]."
 
 game_concept_primogen_aptitude: "Aptitud de Primogénito"
 game_concept_primogen_aptitude_desc: "Se requieren diferentes conjuntos de habilidades para cada [court_position|E] de [primogen|E].\n\n$EFFECT_LIST_BULLET$[assamite_primogen|E]\n$EFFECT_LIST_BULLET$[brujah_primogen|E]\n$EFFECT_LIST_BULLET$[cappadocian_primogen|E]\n$EFFECT_LIST_BULLET$[gangrel_primogen|E]\n$EFFECT_LIST_BULLET$[gargoyle_primogen|E]\n$EFFECT_LIST_BULLET$[lasombra_primogen|E]\n$EFFECT_LIST_BULLET$[malkavian_primogen|E]\n$EFFECT_LIST_BULLET$[nosferatu_primogen|E]\n$EFFECT_LIST_BULLET$[ravnos_primogen|E]\n$EFFECT_LIST_BULLET$[salubri_primogen|E]\n$EFFECT_LIST_BULLET$[setite_primogen|E]\n$EFFECT_LIST_BULLET$[toreador_primogen|E]\n$EFFECT_LIST_BULLET$[tremere_primogen|E]\n$EFFECT_LIST_BULLET$[tzimisce_primogen|E]\n$EFFECT_LIST_BULLET$[ventrue_primogen|E]"
 
 game_concept_brujah_primogen: "$brujah_primogen_court_position$"
 game_concept_brujah_primogen_desc: "Un [primogen|E] [GetTrait('brujah').GetName(GetNullCharacter)] necesita buen [martial|E], [learning|E] y [prowess|E].\n\nSer un [GetTrait('scholar').GetName(GetNullCharacter)] y/o [GetTrait('strategist').GetName(GetNullCharacter)] ayuda.\n\nSer [GetTrait('wrathful').GetName(GetNullCharacter)] empeora el rendimiento."
 
 game_concept_cappadocian_primogen: "$cappadocian_primogen_court_position$"
 game_concept_cappadocian_primogen_desc: "Un [primogen|E] [GetTrait('cappadocian').GetName(GetNullCharacter)] necesita buen [learning|E] y [stewardship|E].\n\nSer [GetTrait('patient').GetName(GetNullCharacter)], un [GetTrait('scholar').GetName(GetNullCharacter)], un #TOOLTIP:GAME_TRAIT,lifestyle_physician,[GetNullCharacter] #L Médico#!#!, y/o un [GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)] ayuda.\n\nSer un #TOOLTIP:GAME_TRAIT,lifestyle_mystic,[GetNullCharacter] #L Místico#!#! ayuda un poco."
 
 game_concept_lasombra_primogen: "$lasombra_primogen_court_position$"
 game_concept_lasombra_primogen_desc: "Un [primogen|E] [GetTrait('lasombra').GetName(GetNullCharacter)] necesita buen [intrigue|E], [stewardship|E] y [diplomacy|E].\n\nSer [GetTrait('arrogant').GetName(GetNullCharacter)], [GetTrait('ambitious').GetName(GetNullCharacter)], [GetTrait('zealous').GetName(GetNullCharacter)], y/o un [GetTrait('schemer').GetName(GetNullCharacter)] ayuda."
 
 game_concept_toreador_primogen: "$toreador_primogen_court_position$"
 game_concept_toreador_primogen_desc: "Un [primogen|E] [GetTrait('toreador').GetName(GetNullCharacter)] necesita buen [diplomacy|E] y [intrigue|E].\n\nSer [GetTrait('gregarious').GetName(GetNullCharacter)] y/o un [GetTrait('lifestyle_poet').GetName(GetNullCharacter)] ayuda.\n\nTambién ayuda si la [culture|E] del personaje tiene una [tradition|E] que mejora el [trait|E] [GetTrait('lifestyle_poet').GetName(GetNullCharacter)] (como [GetCultureTradition('tradition_chanson_de_geste').GetName]) y/o mejora a los #TOOLTIP:COURT_POSITION_TYPE,court_poet_court_position #L Poetas de la Corte#!#! (como [GetCultureTradition('tradition_poetry').GetName])."
 
 game_concept_tzimisce_primogen: "$tzimisce_primogen_court_position$"
 game_concept_tzimisce_primogen_desc: "Un [primogen|E] [GetTrait('tzimisce').GetName(GetNullCharacter)] necesita buen [learning|E], [stewardship|E] y [intrigue|E].\n\nSer [GetTrait('sadistic').GetName(GetNullCharacter)], [GetTrait('diligent').GetName(GetNullCharacter)] y/o un [GetTrait('torturer').GetName(GetNullCharacter)] ayuda.\n\n#help No puedes emplear esta posición de corte si eres [GetTrait('tremere').GetName(GetNullCharacter)].#!"
 
 game_concept_ventrue_primogen: "$ventrue_primogen_court_position$"
 game_concept_ventrue_primogen_desc: "Un [primogen|E] [GetTrait('ventrue').GetName(GetNullCharacter)] necesita buen [stewardship|E], [diplomacy|E] y [martial|E].\n\nSer [GetTrait('ambitious').GetName(GetNullCharacter)] ayuda.\n\nUn Primogénito Ventrue que gobierna un [kingdom|E] obtiene un gran impulso a su [aptitude|E]."
 
 game_concept_assamite_primogen: "$assamite_primogen_court_position$"
 game_concept_assamite_primogen_desc: "Un [primogen|E] [GetTrait('assamite').GetName(GetNullCharacter)] necesita buen [diplomacy|E], [martial|E], [learning|E] y [prowess|E].\n\nSer [GetTrait('diligent').GetName(GetNullCharacter)] ayuda.\n\n#help Solo puedes emplear esta posición de corte si eres [GetTrait('assamite').GetName(GetNullCharacter)], sigues una fe Ashirra, o tienes tu capital en [GetGeographicalRegion('world_middle_east').GetName].#!"
 
 game_concept_gangrel_primogen: "$gangrel_primogen_court_position$"
 game_concept_gangrel_primogen_desc: "Un [primogen|E] [GetTrait('gangrel').GetName(GetNullCharacter)] necesita buen [prowess|E].\n\nSer [GetTrait('brave').GetName(GetNullCharacter)], [GetTrait('wrathful').GetName(GetNullCharacter)], y/o una [GetTrait('shieldmaiden').GetName(GetNullCharacter)] ayuda.\n\nSer un #TOOLTIP:GAME_TRAIT,lifestyle_blademaster,[GetNullCharacter] #L Maestro de la Espada#!#! ayuda un poco."
 
 game_concept_malkavian_primogen: "$malkavian_primogen_court_position$"
 game_concept_malkavian_primogen_desc: "Un [primogen|E] [GetTrait('malkavian').GetName(GetNullCharacter)] necesita buen [diplomacy|E] y [learning|E].\n\nTener [GetTrait('auspexadvanced').GetName(GetNullCharacter)], ser [GetTrait('gregarious').GetName(GetNullCharacter)], [GetTrait('honest').GetName(GetNullCharacter)], y/o un [GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)] ayuda.\n\nSer un #TOOLTIP:GAME_TRAIT,lifestyle_mystic,[GetNullCharacter] #L Místico#!#! también ayuda (escalando con el nivel del rasgo)."
 
 game_concept_nosferatu_primogen: "$nosferatu_primogen_court_position$"
 game_concept_nosferatu_primogen_desc: "Un [primogen|E] [GetTrait('nosferatu').GetName(GetNullCharacter)] necesita buen [intrigue|E], [diplomacy|E] y [stewardship|E].\n\nTener [GetTrait('obfuscateadvanced').GetName(GetNullCharacter)], ser un [GetTrait('schemer').GetName(GetNullCharacter)], [GetTrait('deceitful').GetName(GetNullCharacter)] y/o [GetTrait('patient').GetName(GetNullCharacter)] ayuda.\n\nSer [GetTrait('honest').GetName(GetNullCharacter)] empeora el rendimiento."
 
 game_concept_ravnos_primogen: "$ravnos_primogen_court_position$"
 game_concept_ravnos_primogen_desc: "Un [primogen|E] [GetTrait('ravnos').GetName(GetNullCharacter)] necesita buen [intrigue|E], [martial|E], [stewardship|E] y [learning|E].\n\nSer [GetTrait('gregarious').GetName(GetNullCharacter)] y/o [GetTrait('zealous').GetName(GetNullCharacter)] ayuda.\n\n#help Solo puedes emplear esta posición de corte si eres [GetTrait('ravnos').GetName(GetNullCharacter)], o tienes tu capital en [GetGeographicalRegion('world_india').GetName].#!"
 
 game_concept_setite_primogen: "$setite_primogen_court_position$"
 game_concept_setite_primogen_desc: "Un [primogen|E] [GetTrait('setite').GetName(GetNullCharacter)] necesita buen [intrigue|E], [diplomacy|E] y [learning|E].\n\nSer [GetTrait('deceitful').GetName(GetNullCharacter)], [GetTrait('gregarious').GetName(GetNullCharacter)] y/o [GetTrait('zealous').GetName(GetNullCharacter)] ayuda.\n\n#help Solo puedes emplear esta posición de corte si eres un [GetTrait('setite').GetName(GetNullCharacter)], o tienes una [faith|E] con la [doctrine|E] [GetFaithDoctrine('special_doctrine_set_pillars_kindred').GetBaseName] o [GetFaithDoctrine('special_doctrine_set_corrupted_kindred').GetBaseName].#!"
 
 game_concept_tremere_primogen: "$tremere_primogen_court_position$"
 game_concept_tremere_primogen_desc: "Un [primogen|E] [GetTrait('tremere').GetName(GetNullCharacter)] necesita buen [intrigue|E] y [learning|E].\n\nSer [GetTrait('patient').GetName(GetNullCharacter)], un [GetTrait('scholar').GetName(GetNullCharacter)] y/o un [GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)] ayuda.\n\nSer un #TOOLTIP:GAME_TRAIT,lifestyle_mystic,[GetNullCharacter] #L Místico#!#! ayuda un poco.\n\n#help No puedes emplear esta posición de corte si eres [GetTrait('tzimisce').GetName(GetNullCharacter)], [GetTrait('salubri').GetName(GetNullCharacter)], [GetTrait('assamite').GetName(GetNullCharacter)], sigues una fe Ashirra, o tienes tu capital en [GetGeographicalRegion('world_middle_east').GetName].#!"
 
 game_concept_salubri_primogen: "$salubri_primogen_court_position$"
 game_concept_salubri_primogen_desc: "Un [primogen|E] [GetTrait('salubri').GetName(GetNullCharacter)] necesita buen [prowess|E] y [learning|E].\n\nSer [GetTrait('vengeful').GetName(GetNullCharacter)] y/o un [GetTrait('scholar').GetName(GetNullCharacter)] ayuda.\n\nSer un #TOOLTIP:GAME_TRAIT,lifestyle_blademaster,[GetNullCharacter] #L Maestro de la Espada#!#! ayuda un poco.\n\n#help Solo puedes emplear esta posición de corte si eres [GetTrait('salubri').GetName(GetNullCharacter)].#!"

 game_concept_gargoyle_primogen: "$gargoyle_primogen_court_position$"
 game_concept_gargoyle_primogen_desc: "Un [primogen|E] [GetTrait('gargoyle').GetName(GetNullCharacter)] necesita buen [prowess|E].\n\nSer [GetTrait('wrathful').GetName(GetNullCharacter)], [GetTrait('callous').GetName(GetNullCharacter)] y/o [GetTrait('brave').GetName(GetNullCharacter)] ayuda.\n\nSer un #TOOLTIP:GAME_TRAIT,lifestyle_hunter,[GetNullCharacter] #L Cazador#!#! ayuda un poco.\n\n#help Solo puedes emplear esta posición de corte si eres un [GetTrait('gargoyle').GetName(GetNullCharacter)], o si eres un [emperor|E] después de que se haya descubierto [GetTrait('visceratika').GetName( GetNullCharacter )].#!"
 
 game_concept_splat: "Splat"
 game_concept_splats: "Splats"
 game_concept_subsplat: "Subsplat"
 game_concept_splat_desc: "El término 'Splat' se refiere al tipo de criatura sobrenatural que eres. En [princes_of_darkness|E], tu splat está indicado por un [trait|E].\n\nEn el marcador #bold Edad Oscura: Vampiro#!, los siguientes splats son jugables:\n$EFFECT_LIST_BULLET$$POD_splat_vampire$\n$EFFECT_LIST_BULLET$$POD_splat_ghoul$\n$EFFECT_LIST_BULLET$$POD_splat_kueijin$\n\nEn el marcador #bold Cazadores y Cazados#!, los siguientes splats son jugables:\n$EFFECT_LIST_BULLET$#italic Todos los anteriores, más:#!\n$EFFECT_LIST_BULLET$$POD_splat_hunter$\n$EFFECT_LIST_BULLET$$POD_splat_revenant$\n$EFFECT_LIST_BULLET$$POD_splat_mummy$\n$EFFECT_LIST_BULLET$$POD_splat_werewolf$\n$EFFECT_LIST_BULLET$$POD_splat_bastet$\n$EFFECT_LIST_BULLET$$POD_splat_mokole$\n$EFFECT_LIST_BULLET$$POD_splat_demon$\n\nEn el marcador #bold Edad Oscura: Hadas#!, los siguientes splats son jugables:\n$EFFECT_LIST_BULLET$#italic Todos los anteriores, más:#!\n$EFFECT_LIST_BULLET$$POD_splat_fae$\n$EFFECT_LIST_BULLET$$POD_splat_changeling$"
 
 game_concept_battle_modifier: "Modificador de Batalla"
 game_concept_battle_modifier_desc: "Los modificadores de batalla se eliminan cuando la batalla contra su lanzador termina."

 
 game_concept_endowments_lifestyle: "Estilo de Vida de Convicción"
 game_concept_endowments_lifestyle_desc: "La Convicción representa el progreso de un Inquisidor en el camino hacia el dominio de los métodos de su orden para vencer a los sirvientes del Infierno."
 
 game_concept_obtenebration: "Obtenebración"
 game_concept_obtenebration_desc: "La Obtenebración, el poder para controlar y manipular las sombras, es la $pod_discipline$ de la cual el $pod_clan$ de las Sombras toma su nombre. Los iniciados de la disciplina pueden usarla para mover y manipular las sombras a su favor, mientras que los maestros pueden dar a las sombras forma, sustancia y una apariencia de vida. La naturaleza de la fuente de este poder causa interminables desacuerdos entre los Lasombra. Los ancianos más antiguos del $pod_clan$ afirman que la oscuridad es en sí misma una entidad primordial, igual y opuesta a la fuerza de creación que da vida al mundo. Influenciados por el zoroastrismo, los mayores generalmente llaman a esta fuerza oscura Ahriman. Otros Lasombra creen que la Obtenebración obtiene su poder de un reino de sombras en lugar de una entidad. Los Lasombra que miran a una de las religiones abrahámicas podrían llamarlo Infierno, mientras que un adherente de los antiguos dioses griegos o romanos podría llamarlo Tártaro. Cualquiera sea su origen, la Obtenebración es completamente inquietante para aquellos que la ven en uso. Evoca terror en los animales o mortales que ven la $pod_discipline$ en uso. Incluso los $pod_cainites$, cuya misma existencia desafía toda explicación, tienden a ver la Obtenebración como una afrenta contra las leyes de la naturaleza."
 
 game_concept_elder_perk: "Ventaja de Anciano"
 game_concept_elder_perks: "Ventajas de Anciano"
 game_concept_elder_perk_desc: "Las Ventajas de Anciano son [perks|E] a los que solo los $POD_splat_vampire_plural$ con [Glossary('Generation','game_concept_vampgeneration_desc')] suficientemente baja para despertar el verdadero potencial de su sangre pueden acceder."
 
 game_concept_daimonion: "Daimonion"
 game_concept_daimonion_desc: "Arrancado de los susurros de aquellos atados a la tierra, una voz desgarrada de la garganta de los primeros hechiceros que llamaron al Abismo canta a través de la sangre Baali. Daimonion es un grito a través de la Creación, que se extiende desde este mundo a un lugar abandonado, y el poder viene a lo largo del eco que regresa. Algún día, el linaje Baali gritará, y ese grito destrozará el mundo. Por ahora, usan Daimonion para arrullar suavemente a otros para dormir y pedirles que sueñen con fuego y oscuridad."

 game_concept_Sire: "Sire"
 game_concept_Sires: "Sires"
 game_concept_Sire_desc: "Un vampiro que [Glossary('Embraces','game_concept_Embrace_desc')] exitosamente a un mortal es entonces conocido como su 'Sire'. Esta relación se acerca a una relación padre/hijo en el mundo mortal. Como esas también, puede tomar muchas formas, desde una relación de trabajo hasta el odio absoluto entre los dos.\nEn el mod, esto reemplaza la relación 'padre/hijos' para los $POD_splat_vampire_plural$, ya que no pueden tener hijos naturales."  
 
 game_concept_Embrace: "Abrazo"
 game_concept_Embrace_desc: "Un vampiro que drena toda la sangre de un mortal antes de darle un sorbo de su propia sangre lo transformará en un vampiro. Este proceso se conoce como el Abrazo y creará un fuerte vínculo entre el nuevo [Glossary('Sire','game_concept_Sire_desc')] y su nuevo vástago.\nEn el mod, puedes hacer clic derecho en cualquier mortal en tu ubicación para iniciar un complot de Abrazo. Una vez hecho, transformarás a este mortal en tu propio vástago vampírico, creando una relación padre/hijo en términos de juego."  
 game_concept_Embraced: "Abrazado"
 
 game_concept_Clan: "Clan"
 game_concept_Clan_desc: "Clan es un término utilizado para describir los grupos principales de $POD_splat_vampire_plural$ que comparten características comunes transmitidas por la sangre. El Clan de un vampiro es su linaje, la 'familia' vampírica en la que fue Abrazado. La sociedad vampírica generalmente reconoce 13 clanes hoy en día, aunque algunos pueden haberse perdido en la historia, algunos pueden existir en secreto, y algunos pueden nunca haber sido conocidos.\nComo todos los linajes, cada Clan tiene una mayor familiaridad con un conjunto de tres [Glossary('Disciplines','game_concept_discipline_desc')], una $glossary_clan_curse$ en gran parte única para sus miembros, y varios estereotipos atribuidos a él como resultado de una tendencia a $pod_Embrace$ individuos con ciertas características."  
 game_concept_Clans: "Clanes"
 
 game_concept_ashirra: "Ashirra"
 game_concept_ashirra_desc: "Los Ashirra (de ashira, árabe para 'clan') es la secta bajo la cual los $POD_splat_vampire_plural$ islámicos declaran su fe en Alá, con una fuerte presencia en tierras musulmanas mortales. Los miembros de los Ashirra creen que la redención de los vampiros estaba entre las promesas que Mahoma hizo si elegían seguir a Alá. Mientras que algunos vampiros son verdaderos seguidores del Islam, la gran mayoría de los involucrados en los Ashirra siguen el Islam porque les conviene o para facilitar la operación en el Medio Oriente.\nEn algunos casos, Ashirra puede usarse para referirse a cualquier vampiro que sigue el Islam."  
 
 game_concept_antediluvian: "Antediluviano"
 game_concept_antediluvian_desc: "Significando 'antes del diluvio', el término Antediluviano puede aplicarse a cualquier $pod_cainite$ que es anterior al Gran Diluvio, como Caín o la Segunda Generación, pero casi siempre se usa para referirse específicamente a la Tercera Generación, de la cual descienden los trece [Glossary('Clans','game_concept_Clan_desc')]. Son seres de poder incalculable.\nPresumiblemente los Antediluvianos son de tal edad y potencia de sangre que poseen un poder casi divino, y de hecho algunos de ellos pueden ser deidades. Existen muy pocos registros de tal poder siendo utilizado, pero las leyendas típicamente los retratan como invencibles. Algunos incluso teorizan que la única forma en que tales criaturas pueden ser asesinadas es si lo desean o si es a manos de otro Antediluviano."  
 game_concept_antediluvians: "Antediluvianos"
 
 game_concept_einherjar: "Einherjar"
 game_concept_einherjar_desc: "Einherjar es un término que representa a los $POD_splat_vampire_plural$ nórdicos durante el gobierno del vampiro Odín, el Altísimo (la mayoría de los Einherjar creen que era una especie de sumo sacerdote, no el propio Odín sino un hijo o discípulo ferviente de Odín), que se aferraba a las viejas costumbres que estaban siendo reemplazadas por el cristianismo y el feudalismo.\nCombine esto con el fatalismo del guerrero vikingo promedio, y resulta una mentalidad de asedio. Los Einherjar se ven a sí mismos como los últimos de los guerreros de Odín en Midgard, preparándose para luchar en el inminente Ragnarök. Todo lo que pueden hacer es prepararse para la batalla siguiente y morir como héroes.\nLos vampiros del norte no son simplemente vikingos con clanes. Los detalles de su herencia nórdica dan a los Einherjar una visión del mundo que es muy diferente de la de muchos de sus primos del sur. Las diferencias en religión, sociedad y estilo de vida no solo se muestran en la población mortal, sino que sus hábitos y rasgos se transmiten a la eternidad."
 
 game_concept_ghoul: "Ghoul"
 game_concept_ghoul_desc: "Después de que un $POD_splat_vampire$ alimenta a otra criatura con su $pod_vitae$, se convierten en un $POD_splat_ghoul$, otorgándoles algunos beneficios: El proceso de envejecimiento se detiene, a veces incluso revierte ligeramente; acceso limitado a [Glossary('Disciplines','game_concept_discipline_desc')] y curación más rápida. Sin embargo, los Ghouls dependen de la Sangre, ya que volverán a su edad real cuando se les niegue el acceso, a veces de forma fatal.\n\nCuando juegas como un $POD_splat_vampire$ en [princes_of_darkness|E], puedes convertir $POD_splat_mortal_plural$ [unlanded|E] en $POD_splat_ghoul_plural$ a través de un [scheme|E]. Los [prisoners|EU] pueden ser convertidos al instante. Solo puedes tener una cantidad limitada de Ghouls a la vez, y puedes aumentar ese límite con edificios en tu [Concept('domicile','Escondite')|E].\n\nAlgunos [splats|E] similares a mortales como los $POD_splat_hunter_plural$ pueden convertirse en $POD_splat_ghoul_plural$ durante el juego, ya sea a través de un [character_interaction|E] en $POD_splat_vampire_plural$ para solicitar convertirse en su [bound_ghoul|E], o bebiendo la sangre de un Vampiro [imprisoned|E] para convertirse en un [masterless_ghoul|E]."
 game_concept_ghouls: "Ghouls"

 game_concept_vitae: "Vitae"
 game_concept_vitae_desc: "#bold Vitae#! es la sangre que corre por las venas de un Vampiro. Sus propiedades aparentemente mágicas permiten a los Vampiros usar [Glossary('Disciplines','game_concept_discipline_desc')] y curar cualquier herida, sin importar cuán grave sea.\n\nCuando se bebe directamente de las venas de otro Vampiro, la Vitae es increíblemente adictiva, creando un [Glossary('Blood Bond','game_concept_bloodbond_desc')]. Los mortales que beben Vitae se convierten en [ghouls|E]."

 game_concept_POD_herd: "Rebaño"
 game_concept_POD_herd_desc: "#X Puedes aumentar tu tamaño máximo de Rebaño por encima de su base de 3 con edificios en tu [Concept('domicile','Escondite')|E]. #!.\n Un rebaño es un grupo de mortales cuyos miembros permiten que un vampiro se alimente de ellos, proporcionando fácil acceso a la comida y liberando sus noches para asuntos más apremiantes."  
 
 game_concept_revenant: "Revenant"
 game_concept_revenant_desc: "Un $POD_splat_revenant$ es un tipo de criatura híbrida que es tanto similar como diferente a los $POD_splat_mortal_plural$, [ghouls|E] y $POD_splat_vampire_plural$. Algunos dirían que un revenant está a medio camino entre un mortal y un vampiro; otros lo llamarían una corrupción de las criaturas de Dios con la maldición de Caín, mezclando los dos hasta que se vuelven inseparables. No obstante, un revenant tiene muchas cualidades tanto de vampiros como de mortales, y tiene muchas características de los ghouls normales. Los revenants pueden beber la sangre de un vampiro, pero a diferencia de un ghoul no necesitan hacerlo, ya que pueden producir su propia $pod_vitae$, que también retarda su envejecimiento.\nA diferencia de sus amos, y a pesar de su nombre, los revenants son criaturas vivas. Como un mortal, necesitan comer, dormir y respirar. Son capaces de reproducción sexual. A diferencia de un mortal, son más resistentes y tienen acceso a poderes sobrenaturales de la Marca de Caín."
 game_concept_revenants: "revenants"
 
 game_concept_serpentis: "Serpentis"
 game_concept_serpentis_desc: "Se cree que Serpentis es el legado del propio Set, un regalo para sus hijos. Los Seguidores de Set son muy cuidadosos para guardar los secretos de esta $pod_discipline$, solo enseñando el arte a aquellos que consideran dignos. La mayoría de los vampiros temen a los Setitas por los poderes de Serpentis y su conexión con las serpientes y reptiles."
 
 game_concept_domitor: "Domitor"
 game_concept_domitor_desc: "Un domitor es un vampiro que alimenta a otro ser con su propia $pod_vitae$ y tiene un [Glossary('Blood Bond','game_concept_bloodbond_desc')] sobre ellos, quienes a su vez se convierten en sus Siervos o [ghouls|E]."
 
 game_concept_shintai_lifestyle: "Shintai"
 game_concept_shintai_lifestyle_desc: "El Shintai se desarrolla en la [Glossary('Fifth Age','game_concept_fifth_age_desc')] (después de 1250), es adecuado para $POD_splat_kueijin_plural$. La mayoría de los vampiros ven el dominio de un shintai como una demostración de una comprensión correspondiente de los principios del Chi, y por lo tanto un Paso significativo hacia el dominio de uno mismo."
 
 game_concept_chi_arts_lifestyle: "Artes del Chi"
 game_concept_chi_arts_lifestyle_desc: "Las Artes del Chi son adecuadas para $POD_splat_kueijin_plural$. Estas [Glossary('Disciplines','game_concept_discipline_desc')] permiten a un [GetTrait('kueijin').GetName( GetNullCharacter )] evocar efectos místicos a través de la redirección de su Chi (o, en algunos casos, del Chi de otros o del Chi ambiental en el entorno)."
 
 game_concept_soul_arts_lifestyle: "Artes del Alma"
 game_concept_soul_arts_lifestyle_desc: "Las Artes del Alma son adecuadas para $POD_splat_kueijin_plural$. Quienes dominan las [Glossary('Disciplines','game_concept_discipline_desc')] del Alma son criaturas verdaderamente formidables, capaces de realizar hazañas extremadamente difíciles de voluntad o de dominar las almas de otras criaturas por completo."
 
 game_concept_demon_arts_lifestyle: "Artes del Demonio"
 game_concept_demon_arts_lifestyle_desc: "Las Artes del Demonio son adecuadas para $POD_splat_kueijin_plural$. Estas [Glossary('Disciplines','game_concept_discipline_desc')] se originan en el P'o y son alimentadas por él."
 
 game_concept_qiao_lifestyle: "Qiao"
 game_concept_qiao_lifestyle_desc: "El Qiao es adecuado para [GetTrait('shih').GetName( GetNullCharacter )]. Qiao, o Puentes: artes antiguas a través de las cuales los cazadores de demonios enfocan su Chi para realizar hazañas sobrehumanas."
 
 game_concept_hekau_alchemy_lifestyle: "Alquimia Hekau"
 game_concept_hekau_alchemy_lifestyle_desc: "La Alquimia Hekau es adecuada para $POD_splat_mummy_plural$. La alquimia requiere preparaciones y dedicación. Un alquimista no puede simplemente sacar un hechizo de sus mangas, sino que tiene que crear un producto que encarne el efecto que busca o que induzca el resultado deseado."
 
 game_concept_hekau_amulets_lifestyle: "Amuletos Hekau"
 game_concept_hekau_amulets_lifestyle_desc: "Los Amuletos Hekau son adecuados para $POD_splat_mummy_plural$. Los amuletos, también conocidos como Meket en egipcio, son talismanes que enfocan el poder mágico, más a menudo para la protección contra el mal, la enfermedad o la hechicería."
 
 game_concept_hekau_celestial_lifestyle: "Celestial Hekau"
 game_concept_hekau_celestial_lifestyle_desc: "El Celestial Hekau es adecuado para $POD_splat_mummy_plural$. El Celestial Hekau son las artes mágicas del antiguo Egipto centradas en el destino, el clima y la astrología."
 
 game_concept_hekau_effigy_lifestyle: "Efigie Hekau"
 game_concept_hekau_effigy_lifestyle_desc: "La Efigie Hekau es adecuada para $POD_splat_mummy_plural$. La Efigie es el arte Hekau de las conexiones simbólicas, generalmente expresadas en pequeñas figuras conocidas como Ushabti."
 
 game_concept_hekau_necromancy_lifestyle: "Nigromancia Hekau"
 game_concept_hekau_necromancy_lifestyle_desc: "La Nigromancia Hekau es adecuada para $POD_splat_mummy_plural$. La Nigromancia es el arte Hekau de dar forma al [UmbraGlossaryLocalized('shadowlands','Inframundo')] y comandar las almas que lo habitan."
 
 game_concept_hekau_nomenclature_lifestyle: "Nomenclatura Hekau"
 game_concept_hekau_nomenclature_lifestyle_desc: "La Nomenclatura Hekau es adecuada para $POD_splat_mummy_plural$. La Nomenclatura es el arte Hekau de utilizar [Glossary('True Names','podgloss.truename')], llamado ren en Egipto, para fines arcanos."
 
 game_concept_tan_lifestyle: "Tan"
 game_concept_tan_lifestyle_desc: "El Tan es adecuado para [GetTrait('wutian').GetName( GetNullCharacter )]. Poderes que provienen de la Alquimia del Fénix y el Dragón."
 
 game_concept_neteru: "Neteru"
 game_concept_neteru_desc: "#bold Neteru#! son cultistas que se han reunido alrededor de un Renacido para adorarlo. Los miembros de tu casa de tus vidas recientes se convertirán en Neteru gratis, de lo contrario necesitas usar un [character_interaction|E] para obtenerlos. Los Neteru pueden mantener tus títulos incluso como mortales, y pueden mantener edificios de momias o construirlos cuando eres su señor."
 
 game_concept_thrall: "Esclavo"
 game_concept_thralls: "Esclavos"
 game_concept_thrall_desc: "#bold Los Esclavos#! son los sirvientes de los $POD_splat_demon_plural$. Los demonios eligen esclavos entre los ambiciosos, vengativos, lisiados y desposeídos; hombres y mujeres que se sienten engañados por el mundo, privados de las vidas que merecen.\n\nPuedes esclavizar personajes si siguen tu religión. Para convertirlos, puedes usar el [journey|E] Tentar al Pecado en personajes que tienen el [trait|E] asociado con tu pecado.\n\nLos Esclavos tienen interacciones especiales que puedes usar y que cuestan puntos de ventaja de Arcana. También puedes pedir a sus vasallos que se unan a tu culto."

 game_concept_cultist: "Cultista"
 game_concept_cultists: "Cultistas"
 game_concept_cultist_desc: "#bold Los Cultistas#! son los adoradores de un $POD_splat_demon$. A través de su adoración proporcionan al demonio [experience|E] pasiva de [arcana_lifestyle|E] cada año.\n\nLos vasallos, cortesanos y los vasallos de tus [thralls|E] son elegibles para convertirse en cultistas con el [character_interaction|E] $POD_set_cultist_interaction$. Los $POD_splat_demon_plural$ también pueden contratar a un #V Líder de Culto#! [court_position|E] que automáticamente convierte a personajes elegibles en Cultistas con el tiempo."

 game_concept_abombwe: "Abombwe"
 game_concept_abombwe_desc: "Abombwe es una Disciplina practicada por el Legado Akunanse de los Laibon y el misterioso linaje Bonsam de las Edades Oscuras. Abombwe utiliza la estrecha conexión del vampiro con su propia Bestia (y la de otros) y su control sobre ella, así como canalizar el poder de la Bestia para varios propósitos."
 
 game_concept_dark_kingdom: "Reino Oscuro"
 game_concept_dark_kingdoms: "Reinos Oscuros"
 game_concept_dark_kingdom_desc: "Los Reinos Oscuros son bolsas de realidad estable dentro de la [UmbraGlossary('tempest')] del [UmbraGlossaryLocalized('shadowlands','Inframundo')]. Cada uno de estos reinos reclama dominio sobre los Espectros de una región geográfica particular."
 
 game_concept_shard_realm: "Reino Astilla"
 game_concept_shard_realm_desc: "En la cosmología mágica de la Tradición, los planetas dentro de nuestro sistema solar están asociados con dioses, energías, fenómenos terrestres y Esferas mágicas. La ciencia, por supuesto, busca despojar esas asociaciones y reemplazarlas con mediciones de espacio frío y muerto. Incluso entonces, sin embargo, el impresionante espectáculo del poder planetario no puede ser purgado por completo de la maravilla.\nUn Reino Astilla está conectado a uno de los planetas dentro del sistema solar y forma su propio Umbra específico. Cada Reino Astilla está conectado a una Esfera específica que es dominante dentro de sus límites. Cada Reino Astilla también está conectado a un [Glossary('Shade Realm','game_concept_shade_realm_desc')], que se rumorea que conduce a un universo paralelo dominado por una de las Esferas. Cada Reino Astilla está habitado y gobernado por un poderoso Celestino."
 
 game_concept_shade_realm: "Reino Sombra"
 game_concept_shade_realm_desc: "Un Reino Sombra, también conocido como Vada, es un reino Umbral dominado por una sola Esfera de magia. Cada Reino Sombra está vinculado al [Glossary('Shard Realm','game_concept_shard_realm_desc')] de uno de los planetas dentro del sistema solar, pero se manifiesta dentro del Horizonte de la Tierra, como una sombra proyectada en el suelo por una nube que pasa."
 
 game_concept_oneiric_realm: "Reino Onírico"
 game_concept_oneiric_realms: "Reinos Oníricos"
 game_concept_oneiric_realm_desc: "Dentro del torrente de ecos que es el [UmbraGlossary('deep_dreaming')], los once reinos cristalinos de los Oneiroi giran y resuenan, agitando la materia de los Sueños a su paso. Uno de estos reinos fue conocido una vez como [UmbraGlossary('arcadia')]; ahora está sellado desde dentro, y cualquiera que se aleje de él nunca podrá regresar. En cuanto a los otros Reinos Oníricos, los de Moros y Hemera, Aether y Ker, Hypnates y [UmbraGlossaryLocalized('kingdom_of_dan','Dán')], Charis y Momus, Diké y Protea, poco se sabe. Pocos han entrado alguna vez en ellos, y ninguno ha partido de la misma manera que llegó.\n\nMás allá de estos llamados reinos oníricos 'menores' (y si son realmente menos espléndidos que Arcadia, nadie puede decirlo), solo están la Noche y el Silencio, elevando el total a 13. Los viajeros informan de un extraño fenómeno: Más allá del Silencio, en el reino más profundo posible del [UmbraGlossary('dreaming')], el mundo se abre sobre sí mismo y la oscuridad se transforma en maravilla."
 
 game_concept_hearts_realm: "Reino del Corazón"
 game_concept_hearts_realms: "Reinos del Corazón"
 game_concept_hearts_realm_desc: "En lo profundo del [UmbraGlossary('dreaming')], situado entre el [UmbraGlossary('far_dreaming')] y los Países Más Profundos más allá, hay dominios que cuentan historias moldeadas a semejanza de los corazones humanos. Más fuertes e íntimos que los reinos más universales del [UmbraGlossary('dreaming')], estos 'Reinos del Corazón' han reunido muchas de las piezas fugitivas del Sueño Arcaico para sí mismos y ahora a menudo se confunden con la propia Arcadia por los viajeros esperanzados. Amargamente, esta es una conclusión demasiado alegre para ser verdad."
 
 game_concept_home_realm: "Reino Hogar"
 game_concept_home_realms: "Reinos Hogar"
 game_concept_home_realm_desc: "El reino en general, algo más pequeño de lo que es ahora, era un engranaje de la idea de cada uno de un mundo perfecto. Las tierras que bordeaban las regiones se asemejaban al pobre primer intento de un gigante en la fabricación de rompecabezas. Los accidentes geográficos se entrelazaban alternativamente y sobresalían en bloques y secciones irregulares. Los animales y edificios quiméricos eran todos débiles y temblorosos, la materia prima del Sueño crepitaba eléctricamente en el aire. Incluso mientras miraban, algunas de las quimeras se desvanecieron en la nada. Se tuvo que tomar una decisión: ¿debían quedarse y construir el reino un poco más, ver si podían llegar a [UmbraGlossary('arcadia')] desde donde estaban, o regresar al mundo mundano y posiblemente intentarlo de nuevo? Todos estuvieron de acuerdo en que estaban demasiado lejos de Arcadia incluso para intentar alcanzarla. Algunos pensaron que el nuevo reino era una pérdida de tiempo, mientras que la mayoría de los demás se quedaron allí e intentaron hacerlo más estable. Unos pocos se adentraron en el [UmbraGlossary('dreaming')] y nunca se volvió a saber de ellos."
 
 game_concept_nightmare_realm: "Reino de Pesadilla"
 game_concept_nightmare_realms: "Reinos de Pesadilla"
 game_concept_nightmare_realm_desc: "Un Reino de Pesadilla es un lugar donde las pesadillas residen en el [UmbraGlossary('dreaming')]. Estos lugares, empujados por el Firchlis, pueden invadir los [Glossary('Dream Realms','game_concept_dream_realm_desc')]. Aquí, las amenazas son más serias que en muchas otras partes del [UmbraGlossary('dreaming')]."
 
 game_concept_dream_realm: "Reino de Sueño"
 game_concept_dream_realms: "Reinos de Sueño"
 game_concept_dream_realm_desc: "Un Reino de Sueño es una parte del [UmbraGlossary('dreaming')] que es algo benigna, donde los peligros se equilibran con las maravillas que se pueden encontrar. A diferencia de un [Glossary('Nightmare Realm','game_concept_nightmare_realm_desc')]."
 
 game_concept_stable_point: "Punto Estable"
 game_concept_stable_points: "Puntos Estables"
 game_concept_stable_point_desc: "Los Puntos Estables son lugares en el [UmbraGlossary('dreaming')] que permanecen en gran parte no afectados por el Firchlis."
 
 game_concept_yang_world: "Mundo Yang"
 game_concept_yang_world_desc: "El Mundo Yang parece abarcar el [UmbraGlossary('spirit_wilds')], el [UmbraGlossary('dreaming')] y los [UmbraGlossary('astral_reaches')]. Es un reino de chi positivo (si no benigno) y flota 'sobre' el plano físico. Albergando un número casi infinito de reinos e habitantes espirituales, el Mundo Yang rebosa de energía."


 game_concept_breedgifts_lifestyle: "Dones de Raza"
 game_concept_breedgifts_lifestyle_desc: "Los $glossary_fera$ tienen dos razas, [GetTrait('homid_born').GetName(GetNullCharacter)] y [GetTrait('beast_born').GetName(GetNullCharacter)]. Cada una tiene su propio conjunto de dones que contemplan su crianza."

 game_concept_lunar_auspicegifts_lifestyle: "Dones de Auspicio Lunar"
 game_concept_lunar_auspicegifts_lifestyle_desc: "Los Auspicios #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Garou#! siguen el ciclo lunar. La fase de la luna durante su Primer Cambio determina su Auspicio y qué Dones están disponibles para ellos."

 game_concept_solar_auspicegifts_lifestyle: "Dones de Auspicio Solar"
 game_concept_solar_auspicegifts_lifestyle_desc: "Los Auspicios [GetTrait('mokole').GetName(GetNullCharacter)] siguen el Sol. Tanto la Corriente Mokolé-mbembe como la Gumagan siguen los siete Auspicios Solares, mientras que los Makara y Zhong Lung siguen sus propios Auspicios Estacionales. Sin embargo, estos Auspicios Estacionales todavía están intrínsecamente ligados al sol y por lo tanto comparten Dones con sus primos."

 game_concept_commongifts_lifestyle: "Dones Comunes"
 game_concept_commongifts_lifestyle_desc: "Cada uno de los $glossary_fera$ tiene un conjunto de Dones que están naturalmente disponibles para ellos."

 game_concept_tribalgifts_lifestyle: "Dones de Tribu"
 game_concept_tribalgifts_lifestyle_desc: "Los Dones de Tribu son dones enseñados por el espíritu protector de una tribu de [GetTrait('werewolf').GetName(GetNullCharacter)] o [GetTrait('bastet').GetName(GetNullCharacter)]."

 game_concept_streamgifts_lifestyle: "Dones de Corriente"
 game_concept_streamgifts_lifestyle_desc: "Las cuatro Corrientes de los Mokolé divergieron hace mucho tiempo. Cada una de ellas ha desarrollado su propia identidad y ha obtenido acceso a Dones que complementan sus vidas y propósito."
 
 game_concept_mnesis_lifestyle: "Mnesis"
 game_concept_mnesis_lifestyle_desc: "Los poderes del antiguo [GetTrait('mokole').GetName(GetNullCharacter)] se han perdido en los tiempos. Con el poder de la Mnesis, un Mokolé puede nadar en el río del tiempo a través de los recuerdos de sus antepasados en busca de estos poderes olvidados."

 game_concept_hengeyokaigifts_lifestyle: "Dones Hengeyokai"
 game_concept_hengeyokaigifts_lifestyle_desc: "Los Dones Hengeyokai son dones enseñados dentro de las Cortes de Bestias de Asia. Promueven la cooperación y el entendimiento entre los diferentes $glossary_fera$."

 game_concept_urgetaints_lifestyle: "Manchas de Urge"
 game_concept_urgetaints_lifestyle_desc: "Los sirvientes más importantes del $glossary_wyrm$, los Urge Wyrms, otorgan estos oscuros dones a sus secuaces, con la esperanza de ganar la batalla eterna entre ellos."

 
 game_concept_Fetter: "Atadura"
 game_concept_Fetters: "Ataduras"
 game_concept_Fetter_desc: "Una Atadura es una persona, lugar u objeto que ata a un wraith al [UmbraGlossary('shadowlands')] y evita que siga adelante. Además de permitir que un wraith se aferre a su existencia y evitar que caiga en el [UmbraGlossary('oblivion')], las Ataduras también son lugares donde un wraith puede Dormir y recuperar [Corpus|E].\nSi una Atadura es destruida, el wraith pierde un vínculo importante con el [UmbraGlossary('shadowlands')] y, por lo tanto, su existencia se vuelve más inestable. Los espectros sin Ataduras no duran mucho en el [UmbraGlossary('shadowlands')], ya que no tienen lugar para recargarse ni nada que los ate a su no-muerte."
 
 game_concept_Corpus: "Corpus"
 game_concept_Corpus_desc: "El cuerpo de un wraith en el [UmbraGlossaryLocalized('shadowlands','Inframundo')] se llama Corpus. En lugar de tener sistemas biológicos complejos, está hecho de un material llamado plasma que es, en general, la materia prima del más allá."

 game_concept_oblivion_pull: "Atracción del Olvido"
 game_concept_oblivion_pull_desc: "#bold Atracción del Olvido#! es una medida de cuán fuertemente el [UmbraGlossary('oblivion')] atrae a un $POD_splat_wraith$, y cuán inestable es su existencia.\n\nCada mes, los $POD_splat_wraith$ #italic del jugador#! obtendrán [stress|E] de #N +10#! a #P -10#! según su Atracción del [UmbraGlossary('oblivion')].\n\nAsuntos que afectan la [oblivion_pull|E]:\n$TAB$$POD_splat_wraith$: #N +10#!\n$TAB$Cada punto de [Fetter|E] asignado: #P -1#!\n$TAB$Cada punto de [Fetter|E] resuelto: #P -2#!\n\nLa cantidad de [oblivion_pull|E] se muestra en $POD_splat_wraith$"

 game_concept_POD_animals_maa: "Animales"
 game_concept_POD_animals_maa_desc: "Los Animales son [men_at_arms|E] que pueden ser reclutados por varios medios, como Animalismo.\n\nSon Contrarrestados por [archers|E]."

 game_concept_POD_construct_maa: "Constructos"
 game_concept_POD_construct_maa_desc: "Los Constructos son [men_at_arms|E] que representan una variedad de criaturas mágicas o tecnológicas que pueden variar mucho en forma, forma y poder dependiendo de cómo y por qué fueron creados."

 game_concept_POD_bygones_maa: "Reliquias"
 game_concept_POD_bygones_maa_desc: "Una Reliquia es una criatura del mito y la leyenda que ya no puede existir abiertamente en la Tierra por mucho tiempo debido a su incompatibilidad con el Consenso. Aunque son poderosas, esta inestabilidad hace que su uso en la batalla sea una perspectiva difícil."

 game_concept_POD_legendary_maa: "Leyendas"
 game_concept_POD_legendary_maa_desc: "Los [men_at_arms|E] Legendarios desafían la definición, cada uno es una cosa única en sí misma.\n\nSu naturaleza única significa que nada puede contrarrestarlos de manera confiable y sus estadísticas son generalmente lo suficientemente fuertes como para que contrarrestar a otros [men_at_arms|E] sea innecesario.\n\nDebido a su naturaleza única, no hay un solo terreno donde sean universalmente más fuertes o más débiles."

 game_concept_POD_illusionary_maa: "Ilusorios"
 game_concept_POD_illusionary_maa_desc: "Los [men_at_arms|E] Ilusorios representan ilusiones y delirios que engañan a los enemigos para que los ataquen, perdiendo su tiempo y distrayéndolos."

 game_concept_POD_demonic_maa: "Demoníacos"
 game_concept_POD_demonic_maa_desc: "Los [men_at_arms|E] Demoníacos representan las fuerzas del infierno.\n\nComo tales, son demasiado variados para contrarrestar universalmente cualquier cosa, pero ellos mismos son contrarrestados por aquellos que se especializan en luchar contra el infierno.\n\nEs igualmente imposible afirmar que cualquier tipo de terreno es universalmente beneficioso para estos regimientos."

 game_concept_POD_spirit_maa: "Espíritus"
 game_concept_POD_spirit_maa_desc: "Los [men_at_arms|E] Espíritu son entidades incorpóreas que se originan, y generalmente residen, en la Umbra - por esa razón, algunos magos los llaman 'la Umbrada'.\n\nSu naturaleza incorpórea significa que es imposible contrarrestarlos sin medios especiales.\n\nSu estado incorpóreo también significa que los espíritus generalmente no se ven afectados negativamente por el terreno, sintiéndose igual de cómodos en un páramo helado como en un desierto abrasador."

 game_concept_POD_fera_maa: "Fera"
 game_concept_POD_fera_maa_desc: "Aunque los Garou fueron creados por Gaia como sus colmillos y garras, para mantenerla a salvo, no fueron sus únicos hijos. Ella creó muchas otras razas de $glossary_fera$ o Cambiaformas y les asignó una tarea a cada una. Algunas han perdido su camino con el tiempo; otras fueron forzadas a abandonar sus roles por los Garou. Algunas se han dedicado a servir solo a un aspecto de la $glossary_triat$, en lugar de a Gaia en su totalidad.\n\nLos Fera son tan variados como las cosas en las que se convierten, por lo que la única forma segura de contrarrestarlos es el conocimiento de la vulnerabilidad sobrenatural del tipo que enfrentas.\n\nDe la misma manera que su capacidad para contrarrestar y ser contrarrestados, las habilidades de terreno de los Fera varían ampliamente."

 game_concept_POD_gargoyle_maa: "Gárgola"
 game_concept_POD_gargoyle_maa_desc: "Las Gárgolas son un linaje vampírico creado por los Tremere como sus servidores. Aunque técnicamente no son un linaje Tremere, el linaje está en gran parte bajo su control.\n\nLa capacidad de las Gárgolas para volar presenta problemas únicos para las tropas convencionales para contrarrestarlas, ya que entrenar para luchar contra enemigos voladores no es parte de la mayoría de los ejercicios de armas.\n\nLas Gárgolas pueden volar, lo que significa que pueden evitar muchos de los problemas que presenta el terreno mientras aún pueden aprovecharlo."

 game_concept_POD_ghoul_maa: "Ghoul"
 game_concept_POD_ghoul_maa_desc: "Ghoul es un término utilizado para describir a un sirviente creado cuando un $POD_splat_vampire$ da un poco de $pod_vitae$ vampírico a un mortal sin drenarlo de sangre primero, lo que resultaría en el Abrazo.\n\nLos Ghouls incluyen no solo humanos normales a los que se les da $pod_vitae$ vampírica, sino también los llamados 'Ghouls de Guerra' usados por los Tzimisce y, por lo tanto, contrarrestar a algunos ghouls es tan fácil como contrarrestar a un humano normal, mientras que otros, como los monstruosos Szlachta, son más difíciles.\n\nEl terreno afecta a los ghouls como uno esperaría normalmente según sus cuerpos."
 
 game_concept_POD_plasmic_maa: "Plásmico"
 game_concept_POD_plasmic_maa_desc: "Un Plásmico o Entidad Plásmica es una 'forma de vida' del [UmbraGlossaryLocalized('shadowlands','Inframundo')]; específicamente, cualquier criatura independiente que está compuesta de Plasma pero que no es específicamente un wraith o wraith maligno."
 
 game_concept_POD_wraith_maa: "Wraith"
 game_concept_POD_wraith_maa_desc: "Un wraith es un fantasma, el alma de una persona que ha muerto insatisfecha y ahora acecha en el [UmbraGlossary('shadowlands')]."

 game_concept_POD_vampire_maa: "Vampiro"
 game_concept_POD_vampire_maa_desc: "La maldita progenie de Caín son combatientes temibles cuando la noche cae sobre un campo de batalla. Son naturalmente más fuertes y rápidos que los mortales y la mayoría de ellos también usan poderosos poderes mentales y físicos que pueden cambiar el curso de cualquier batalla."
 
 game_concept_POD_faerie_maa: "Hada"
 game_concept_POD_faerie_maa_desc: "Los términos hada, fae, y la Gente Amable a menudo son usados indistintamente por los no cambiaformas para referirse tanto a los cambiaformas como a las Hadas Verdaderas."
 
 game_concept_POD_chimera_maa: "Quimera Animada"
 game_concept_POD_chimera_maa_desc: "Las quimeras animadas son simplemente quimeras que tienen vida o apariencia de vida."
 
 game_concept_abomination: "Abominación"
 game_concept_abomination_desc: "Abominación es un término utilizado para describir a un cambiaformas transformado en vampiro. No hace falta decir que estas criaturas son excepcionalmente raras, debido al hecho de que casi todos los $glossary_fera$ son violentamente alérgicos a la $pod_vitae$ vampírica. El resultado es rechazado por ambas sociedades, y también es siempre muy inestable mentalmente.\nEn el juego, #TOOLTIP:GAME_TRAIT,abomination,[GetNullCharacter] #L Las Abominaciones#!#! son tratadas como $POD_splat_vampire_plural$ que no pueden $pod_Embrace$ pero conservan el uso de dones de raza y auspicio, así como la capacidad de cambiar de forma."
 
 game_concept_grace: "Gracia"
 game_concept_grace_i: "@grace_icon!"
 game_concept_grace_desc: "Una representación de cuánto te favorece esta entidad umbral."
 
 game_concept_bind_wraith_interaction: "Interacción Vincular Wraith"
 game_concept_bind_wraith_interaction_desc: "Una Interacción que permite a un personaje vincular a un [GetTrait('wraith').GetName( GetNullCharacter )], luego permitir más órdenes para ellos."
 
 game_concept_command_wraith_interaction: "Interacción Ordenar Wraith"
 game_concept_command_wraith_interaction_desc: "Una Interacción que permite a un personaje ordenar a un [GetTrait('wraith').GetName(GetNullCharacter)] vinculado actuar contra otros personajes."
 
 game_concept_summon_wraith_on_death_interaction: "Interacción Invocar Wraith en Muerte"
 game_concept_summon_wraith_on_death_interaction_desc: "Una Interacción que permite a un personaje hacer que otro personaje se convierta en un [GetTrait('wraith').GetName( GetNullCharacter )] cuando muera."

 game_concept_dreamer: "Soñador"
 game_concept_dreamer_desc: "Entre los Kithain, Soñador puede ser un término genérico para cualquier mortal, pero se atribuye más propiamente a aquellos mortales que muestran la chispa de la creatividad o no han sido embotados por la Banalidad hasta el punto de estar emocionalmente atrofiados. Los Soñadores son la principal fuente de Glamour para los Kithain y, como tal, son un recurso protegido."
 
 game_concept_dan: "Dán"
 game_concept_dan_desc: "En la antigua forma de los Kithain, Dán es el Destino; el karma y el destino de una persona. El Dán no se toma a la ligera que la gente meta sus manos en sus hilos y aquellos que a menudo los manipulan en exceso a través de Artes como la Adivinación a menudo se encuentran atados cada vez más inextricablemente en sus redes."
 
 game_concept_mythic_age: "Era Mítica"
 game_concept_mythic_age_desc: "La Era Mítica duró desde la prehistoria hasta aproximadamente el 1000 a. C., cuando comenzó la Edad del Hierro y la humanidad se dio cuenta de que podía dar forma al mundo a través del esfuerzo y el cambio duro y frío."
 game_concept_sundering: "La Ruptura"
 game_concept_sundering_desc: "La Ruptura duró desde aproximadamente el 1000 a. C. hasta el 1200-1400 d. C., cuando la gente comenzó a dejar de creer en las Hadas, y la presión de la Banalidad comenzó a acumularse."
 game_concept_shattering: "La Fragmentación"
 game_concept_shattering_desc: "Alrededor de la época de la Inquisición Española y la Peste Negra (y la práctica de los apellidos que se pusieron de moda), la presión acumulada por la Ruptura finalmente se rompió, causando la Fragmentación (provocando que un gran número de [GetTrait('fae').GetName( GetNullCharacter )] optaran por regresar a [UmbraGlossary('arcadia')] o adoptar el Camino de los [GetTrait('changeling').GetName( GetNullCharacter )], o esconderse)."
 game_concept_interregnum: "Interregno"
 game_concept_interregnum_desc: "El período sin sidhe ni Hadas Verdaderas en la Tierra, con los 'diluidos' cambiaformas restantes teniendo que valerse por sí mismos después de las convulsiones finales de la [Glossary('Shattering','game_concept_shattering_desc')] alrededor del 1400 d. C. es el Interregno, ya que los cambiaformas tuvieron que tratar de descubrir cómo sobrevivir por sí mismos."
 game_concept_resurgence: "Resurgimiento"
 game_concept_resurgence_desc: "Después de más de 400 años de una Edad Oscura para las Hadas, el Alunizaje de 1969 trajo consigo el Resurgimiento, o fue el producto de la reapertura de los caminos entre el mundo mundano y lo mítico."
 
 game_concept_first_age: "Primera Era"
 game_concept_first_age_desc: "Las diversas culturas sobrenaturales del Reino Medio tienen diferentes nombres para esta era. Para los [GetTrait('kueijin').GetName( GetNullCharacter )], era la Primera Era del Gran Ciclo o la Era del Cielo. Para los Hengeyokai, era la Era del Amanecer. Los #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L Chi'n Ta#!#! la ven como el estado anterior al tiempo, explicado a través de mitos humanos como Pangu o el Brahman. Los Hsien hablan de la Era de la Perfección. Generalmente se considera que la Primera Era es el período anterior a la creación del mundo. Marca la época en que el Yin y el Yang no se habían separado, cuando todas las cosas eran Uno con el [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] (o Gaia). Se considera un período de armonía suprema, el primer punto de interconexión entre todas las cosas."
 game_concept_second_age: "Segunda Era"
 game_concept_second_age_desc: "Los [GetTrait('kueijin').GetName( GetNullCharacter )] y los Hsien se refieren a ella como la Segunda Era del Gran Ciclo o la Era de la Belleza, cuando el Reino Medio y las Cortes Espirituales todavía estaban cerca. Los Hengeyokai hablan de la Era de las Diez Mil Cosas, donde el [Glossary('San Yuan', 'glossary_triat_tt')], fue traído a la existencia y se formó la vida tal como se conoce hoy. Los #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L Chi'n Ta#!#! hablan de manera similar de la creación de la Trinidad Metafísica en la forma de los Tres Ministros, que supervisaron la formación de los Cinco Elementos que darían paso a las Diez Mil Cosas."
 game_concept_third_age: "Tercera Era"
 ##X Effects of Age:\n$BULLET_WITH_TAB$Every [akuma|E] gains: [GetModifier('akuma_debuff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Every [Glossary('Yama King','podgloss.yamaking')] gains: [GetModifier('yama_debuff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Every $POD_splat_kueijin$ gains: [GetModifier('godbodies_modifier').GetNameWithTooltip] #! \n
 game_concept_third_age_desc: "Los [GetTrait('kueijin').GetName( GetNullCharacter )], los Hsien y los Hengeyokai hablan de la Tercera Era como la Tercera Era del Gran Ciclo, la Era de las Leyendas. Era la prehistoria mítica del Reino Medio, cuando los [Glossary('Wan Xian','game_concept_kuei_jin_desc')] caminaban entre la humanidad y la gobernaban como amos benévolos. También fue la era donde aquellos shen leales a la Augusta Persona lucharon contra las criaturas de [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')] bajo treguas inestables. Para los #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L Chi'n Ta#!#!, esta fue la era donde la humanidad despertó a los diseños del Cielo y aprendió por primera vez a manejar la magia.\nLa Tercera Era terminó por las maquinaciones de los [Glossary('Yama Kings','podgloss.yamaking')], que corrompieron a los [Glossary('Wan Xian','game_concept_kuei_jin_desc')] para que se alimentaran de chi. También marcó el fin de la tradición mítica y el comienzo de la historia tal como la entienden los humanos hoy."
 game_concept_fourth_age: "Cuarta Era"
 ##X Effects of Age:\n$BULLET_WITH_TAB$Every $POD_splat_kueijin$ gains: [GetModifier('godbodies_modifier').GetNameWithTooltip] #! \n
 game_concept_fourth_age_desc: "Los [GetTrait('kueijin').GetName( GetNullCharacter )] y los Hsien recuerdan esta era como la Cuarta Era del Gran Ciclo o la Era de la Hermosa Tristeza. Marca el comienzo de la maldición de [GetTrait('kueijin').GetName( GetNullCharacter )] y la transformación de guerreros del Cielo en criaturas demoníacas originadas en [UmbraGlossaryLocalized('yomi_wan','Yomi Hell')]. Para los Pequeños Dioses, fue el comienzo de su exilio del Cielo después de que la Augusta Persona los prohibiera por su participación en la insurrección de los [Glossary('Wan Xian','game_concept_kuei_jin_desc')]. Los Hengeyokai hablan de la Era de la Prueba, donde los traicioneros [Glossary('Wan Xian','game_concept_kuei_jin_desc')] enfrentaron a los Fera entre sí en un evento recordado como la Guerra de la Vergüenza. Los #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L Chi'n Ta#!#! recuerdan que varias facciones diferentes de artesanos de la voluntad surgieron de este período de tiempo, y que a menudo chocaban, como se ve en conflictos como la Guerra del Himalaya o la Guerra del Río Dragón. Durante este conflicto, Yi, el Excelente Arquero y sus seguidores aparecieron, quienes fundaron una orden que más tarde existiría como los [GetTrait('shih').GetName( GetNullCharacter )], dedicados a cazar a los shen rebeldes."
 game_concept_fifth_age: "Quinta Era"
 ##X Effects of Age:\n$BULLET_WITH_TAB$Every [akuma|E] gains: [GetModifier('akuma_buff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Every [Glossary('Yama King','podgloss.yamaking')] gains: [GetModifier('yama_buff_modifier').GetNameWithTooltip] #!
 game_concept_fifth_age_desc: "Para los [GetTrait('kueijin').GetName( GetNullCharacter )], la Quinta Era del Gran Ciclo es conocida como la Era de la Oscuridad. Los #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L Chi'n Ta#!#! hablan del mundo actual como dominado por los 'Pueblos de Piedra', que han venido de lejos para poner el Reino Medio bajo su control. Los Hengeyokai la llaman la Era de las Sombras. Los Hsien hablan de la Era de la Tribulación, donde los shen tienen que demostrar que son dignos del Cielo o ser destruidos una vez que el [Glossary('Demon Emperor','podgloss.demonemperor')] gobierne. Casi todos los shen coinciden en que el desencadenante de la Quinta Era fue la intrusión de los occidentales en el Reino Medio."
 game_concept_sixth_age: "Sexta Era"
 ##X Effects of Age:\n$BULLET_WITH_TAB$Every [akuma|E] gains: [GetModifier('akuma_huge_buff_modifier').GetNameWithTooltip]\n$BULLET_WITH_TAB$Every [Glossary('Yama King','podgloss.yamaking')] gains: [GetModifier('yama_huge_buff_modifier').GetNameWithTooltip] #! \n
 game_concept_sixth_age_desc: "Los [GetTrait('kueijin').GetName( GetNullCharacter )] llaman a la próxima era la Sexta Era del Gran Ciclo, también conocida como la Era de la Aflicción. Es el nadir de la Rueda, donde la [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] se aparta de Su trono y uno de los [Glossary('Yama Kings','podgloss.yamaking')] ascenderá para convertirse en el [Glossary('Demon Emperor','podgloss.demonemperor')]. Sin embargo, la mayoría de los [GetTrait('kueijin').GetName( GetNullCharacter )] ven la Era de la Aflicción como una parte necesaria de la existencia. Del mismo modo, los Hengeyokai creen que la próxima Era de la Aflicción planteará su mayor desafío. Sus enemigos, los [Glossary('Yama Kings','podgloss.yamaking')], buscan entronizarse sobre la Rueda y mantenerla atrapada en la Sexta Era para siempre, mientras que el Gran Ciempiés busca deshacer la rueda misma. Por lo tanto, el deber de los hijos de la Madre Esmeralda será proteger la Rueda de todos los que buscan corromperla. Los #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L Chi'n Ta#!#! también creen que la Rueda pronto girará de nuevo, pero están divididos sobre cómo les afectará. Los Hsien, en cambio, hablan de la Era de la Alegría, donde se romperá la Barrera entre los mundos y se les permitirá regresar a casa. Otros han retomado las historias de otros shen y se preocupan en secreto de si esto es tan bueno como parece."
 
 game_concept_grand_city: "Gran Ciudad"
 game_concept_grand_cities: "Grandes Ciudades"
 game_concept_grand_city_desc: "Una Gran Ciudad es un gran centro de población con gran importancia tanto para el mundo mortal como para el sobrenatural.\n\nCada Gran Ciudad tiene un conjunto de mecánicas únicas asociadas. Es posible que debas cumplir requisitos especiales antes de poder mejorar sus [buildings|E].\n\nHay 5 Grandes Ciudades:\n$BULLET_WITH_TAB$[eternal_rome|E]\n$BULLET_WITH_TAB$[grand_city_of_constantinople|E]\n$BULLET_WITH_TAB$[grand_paris|E]\n$BULLET_WITH_TAB$[holy_cairo|E]\n$BULLET_WITH_TAB$[holy_jerusalem|E]\n\n#X Solo puedes tener #V;bold 1#! posesión de Gran Ciudad, a menos que hayas cambiado ese límite mediante la regla del juego.#!"
 
 grand_city_incompatible_tooltip: "\n\n#help Los [governments|El] $fera_tribe_government$ no pueden usar esta ciudad. Al conquistar la ciudad, se convertirá automáticamente en una tribu.#!"
 grand_city_semi_incompatible_tooltip: "\n\n#help Los [governments|El] $fera_tribe_government$ no mencionados específicamente arriba no pueden usar esta ciudad. Al conquistar la ciudad, se convertirá automáticamente en una tribu.#!"

 game_concept_eternal_rome: "Roma Eterna"
 game_concept_st_peters_city: "Ciudad de San Pedro"
 game_concept_roma_aeterna: "Roma Aeterna"
 game_concept_eternal_rome_desc: "La [grand_city|E] de Roma tiene una larga e histórica historia. Hay tres versiones de la ciudad:\n\nCuando está controlada por un [GetTrait('vampire').GetName(GetNullCharacter)], la ciudad se llama #bold Roma Aeterna#!. Sus 13 distritos históricos están divididos entre los [Glossary('Clans','game_concept_Clan_desc')]. Para mejorarlos, necesitarás emplear [primogen|E] hábiles. En el nivel 3, cada distrito desbloqueará #P nuevas habilidades#! para tu personaje.\n\nCuando está controlada por un [GetTrait('supehunter').GetName(GetNullCharacter)] de la Inquisición Sombría, la ciudad se llama #bold Ciudad de San Pedro#!. Un Cazador puede establecerse en el monasterio de San Michele, convirtiéndolo en la sede de la Inquisición. Ayudar a las otras Órdenes de la Inquisición desbloqueará poderosas rutas de mejora para sus edificios.\n\nCuando está controlada por cualquier otro, la ciudad se llama #bold Roma Eterna#!. Sus monumentos históricos pueden ser restaurados por personajes que tienen [traits|E] específicos o personas hábiles en [court_positions|E].$grand_city_incompatible_tooltip$"
 
 game_concept_journey: "Viaje"
 game_concept_journeys: "Viajes"
 game_concept_journey_desc: "Un #bold Viaje#! es una misión a largo plazo que un personaje puede emprender, ya sea solo o con una [coterie|E].\n\nLa mayoría de los Viajes tienen una [planning_phase|E] y una [travel_phase|E].\n\nSolo puede haber un Viaje activo a la vez. A diferencia de los [schemes|E], los Viajes pueden ser pausados y reanudados en una fecha posterior.\n\n#help Para comenzar un nuevo Viaje, haz clic en el botón #bold $POD_journeys_hud$#! en el lado derecho de tu pantalla, o haz clic derecho en otro personaje e inicia un Viaje mediante [character_interaction|E].#!"
 
 game_concept_planning_phase: "Fase de Planificación"
 game_concept_planning_phase_desc: "La #bold Fase de Planificación#! de un [journey|E] representa a tu personaje reuniendo información, enviando exploradores y, en general, preparándose para el viaje que le espera.\n\nLa duración de la Fase de Planificación depende de la [planning_speed|E]. Dependiendo del [journey|E], puede haber formas de hacerlo más rápido. Algunos Viajes tienen [planning_speed|E] #V Instantánea#!, en cuyo caso se omite la Fase de Planificación.\n\nDespués de que la Fase de Planificación termine, el [journey|E] progresa a la [travel_phase|E]."
 
 game_concept_planning_speed: "Velocidad de Planificación"
 game_concept_planning_speed_desc: "A diferencia de los [schemes|E], la [planning_phase|E] de un [journey|E] progresa a un ritmo constante cada mes, sin aleatoriedad.\n\n#help La información sobre herramientas del número de Velocidad de Planificación dará pistas sobre cómo aumentarla aún más.#!"
 
 game_concept_travel_phase: "Fase de Viaje"
 game_concept_travel_phase_desc: "Después de que la [planning_phase|E] de un [journey|E] termine, tu personaje se entera de una [location|E] en el mundo donde puede completar su misión. Puedes [travel|E] allí de inmediato, o pausar el [journey|E] y viajar más tarde.\n\nPuedes invitar a los miembros de tu [coterie|E] a que te acompañen en este viaje.\n\n#help No puedes comenzar nuevos [journeys|E] ni invitar nuevos miembros a tu [coterie|E] durante la Fase de Viaje.#!"
 
 game_concept_coterie: "Coterie"
 game_concept_coterie_desc: "Una #bold Coterie#! es un grupo de individuos que realizan [journeys|E] juntos. 'Coterie' es un término utilizado por los $POD_splat_vampire_plural$ — otros [splats|E] pueden tener diferentes nombres para ello.\n\nMientras estás en un [journey|E], las [skills|E] se comparten entre los miembros de la Coterie. Por ejemplo, si una situación durante un [journey|E] exige [diplomacy|E], solo considera la [diplomacy_skill|E] de tu miembro más diplomático de la Coterie.\n\n#help Para revisar tu Coterie, haz clic en el botón #bold $POD_journeys_hud$#! en el lado derecho de tu pantalla y selecciona la segunda pestaña.#!"
 
 game_concept_inner_circle: "Círculo Interno"
 game_concept_inner_circle_desc: "El Círculo Interno es el consejo organizador de la Camarilla. Prácticamente no se sabe nada sobre el Círculo Interno, que se esfuerza por mantener oculta la identidad de sus miembros. La cara pública del Círculo Interno son los Justicars y sus asistentes Archones. Los miembros del Círculo Interno eligen a los Justicars y, por lo demás, establecen los principios de la ley de la Camarilla."
 game_concept_justicar: "Justicar"
 game_concept_justicar_desc: "Los Justicars son el componente visible más poderoso del gobierno de la Camarilla, encargados de resolver asuntos de las Tradiciones a gran escala y actuar como los ojos, oídos y manos del Círculo Interno. Hay un justicar por cada clan de la Camarilla, y cada uno es asistido por varios archones seleccionados personalmente que actúan como sus espías, agentes y representantes en todo el mundo."
 game_concept_archon: "Archón"
 game_concept_archon_desc: "Un Archón es un agente reconocido de uno de los Justicars de la Camarilla. Si los Justicars son las manos del Círculo Interno, los Archones son sus dedos."
 
 game_concept_ventrue_clan_curse: "Maldición de Clan Ventrue"
 game_concept_feeding_restrictions: "Restricciones de Alimentación"
 game_concept_ventrue_clan_curse_desc: "Cada descendiente del $pod_clan$ [GetTrait('ventrue').GetName(GetNullCharacter)] sufre una restricción de alimentación que los hace incapaces de alimentarse de #bold cualquier persona#! que no sean mortales muy particulares.\n\nEn [princes_of_darkness|E], un [GetTrait('ventrue').GetName(GetNullCharacter)] puede elegir su presa preferida al comienzo del juego. Alimentarse de cualquier otro tipo de mortal no saciará tu [hunger|E], ni te dará [lifestyle_experience|E] de su [resonance|E].\n\nAlimentarse de otros $POD_splat_vampire_plural$ no está sujeto a estas restricciones."
 
 game_concept_blood_hunt: "Cacería de Sangre"
 game_concept_anathema: "Anatema"
 game_concept_blood_hunt_desc: "Cuando un [GetTrait('vampire').GetName(GetNullCharacter)] ha cometido una ofensa grave contra la seguridad de [the_masquerade|E], la Camarilla puede declararlo [GetTrait('anathema').GetName(GetNullCharacter)] y convocar una Cacería de Sangre contra él.\n\nEn [princes_of_darkness|E], ser [GetTrait('anathema').GetName(GetNullCharacter)] está representado por un [trait|E]. Los miembros de la Camarilla pueden apuntar a [GetTrait('anathema').GetName(GetNullCharacter)] con el [casus_belli|E] de Cacería de Sangre, que encarcela a todos los [rulers|E] en el reino del objetivo."
 
 game_concept_patron_council: "Consejo de Patronos"
 game_concept_patron_council_desc: "El Consejo de Patronos (más comúnmente conocido como 'los Patronos') es una alianza flexible de hadas tradicionalistas. 'Tradicionalista' en este sentido se refiere a un punto de la historia anterior a la Guerra de las Estaciones, cuando cada Corte gobernaba el mundo durante un tiempo asignado. La Corte gobernante entregaba las riendas del poder a la siguiente Corte cuando terminaba su mandato acordado."
 
 game_concept_golconda: "Golconda"
 game_concept_enlightenment: "Iluminación"
 game_concept_golconda_desc: "#bold Golconda#! es un estado místico de iluminación donde un $POD_splat_vampire$ ya no está sujeto a [Glossary('The Beast','game_concept_beast_desc')].\n\nEn [princes_of_darkness|E], [GetTrait('golconda').GetName(GetNullCharacter)] es un [trait|E]. Unos pocos individuos raros comienzan con él, pero todos los demás solo pueden alcanzarlo después de un largo [journey|E].\n\n#X Dado que Golconda está estrechamente vinculada a tu Humanidad, perderás todo el progreso en este Viaje si cometes asesinato o robo, o sucumbes al frenesí.#!"
 
 game_concept_golconda_planning_speed: "Velocidad de Planificación de Golconda"
 game_concept_golconda_planning_speed_desc: "La mejor manera de aumentar la [planning_speed|E] del [journey|E] de [golconda|E] es teniendo [GetCourtPositionType('touchstones_court_position').GetName()] mortales. Son una [court_position|E] desbloqueada por [faiths|E] con #TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_enlightenment_virtues_conscience_and_selfcontrol #L Conciencia#!#!, y puedes aumentar su [aptitude|E] teniendo una buena [Concept('relation','Relación')|E] con ellos (como [friend|E] o [lover|E]).\n\nOtras formas de aumentar la velocidad:\n$EFFECT_LIST_BULLET$Tener otros personajes con los [traits|E] [GetTrait('golconda').GetName(GetNullCharacter)] o [GetTrait('golconda_seeker').GetName(GetNullCharacter)] en tu [coterie|E]\n$EFFECT_LIST_BULLET$Ser [GetTrait('confider').GetName(GetNullCharacter)], [GetTrait('journaller').GetName(GetNullCharacter)] o [GetTrait('reclusive').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$Poseer un [artifact|E] con Saber de Golconda"
 
 game_concept_hungerless: "Sin Hambre"
 game_concept_hungerless_desc: "Un $POD_splat_vampire$ sin hambre ha trascendido completamente la necesidad de sangre. Pueden usar libremente [Glossary('Disciplines','game_concept_discipline_desc')] y otras habilidades que de otro modo costarían sangre para usar.\n\nSin embargo, esto también significa que ya no pueden obtener experiencia de [resonance|E] de la caza."
 
 game_concept_umbra: "Umbra"
 game_concept_spirit_world: "Mundo Espiritual"
 game_concept_spirit_worlds: "Mundos Espirituales"
 game_concept_umbra_desc: "La Umbra, también llamada el Mundo Espiritual, es el reflejo espiritual del mundo material. Está dividida en muchos subreinos que contienen sus propias maravillas y peligros.\nSolo unas pocas entidades selectas pueden atravesar esta dimensión y algunos reinos solo se abren a un tipo específico de individuo (o con el poder adecuado).\nEn términos del juego, la Umbra está disponible como un panel lateral derecho para explorar para aquellos que tienen la capacidad de hacerlo."

 game_concept_skinlands: "Tierras de Piel"
 game_concept_skinlands_desc: "Los wraiths se refieren al mundo de los vivos como las Tierras de Piel; esto contrasta con el [UmbraGlossary('shadowlands')], las tierras de los muertos y el hogar de los wraiths. Las Tierras de Piel y el [UmbraGlossary('shadowlands')] están separadas por el Sudario, que oscurece el mundo de los vivos a los wraiths. Los wraiths pueden obtener una mejor vista de lo que sucede entre los Rápidos con la habilidad innata Visión de la Vida. Los espectros no pueden ver a través del Sudario y, por lo tanto, dentro de las Tierras de Piel a menos que tengan el Arcano Oscuro Desgarra-Sudario."

 game_concept_gaia_realm: "Reino de Gaia"
 game_concept_gaia_realm_desc: "El Reino de Gaia, a menudo referido por los Garou simplemente como El Reino, es el mundo natural que abarca el dominio físico, espiritual y Umbral de Gaia: es decir, la Tierra y todos los reinos espirituales contenidos dentro de ella. El término se usa a veces de manera tan amplia que abarca la [UmbraGlossary('penumbra')] donde se superpone o toca el Reino de Gaia."

 game_concept_tao_te_hsien: "Tao Te Hsien"
 game_concept_tao_te_hsien_desc: "No es el Taoísmo de Lao Tsé, aunque fue inspirado por él. Su objetivo es que el shinma comprenda su lugar en el cosmos desde la llegada del Muro. A diferencia de la filosofía humana, tiene una meta... dar a los hsien el poder de romper el Muro y viajar a los [spirit_worlds|E].\nComparte muchas de las características del Tao. Los seguidores tienden a retirarse de los adornos del mundo y ven una vida de fácil contemplación en la naturaleza. Aman el aprendizaje por sí mismo, pero se preocupan poco por la política. Algunos son científicos, otros sacerdotes, otros mendigos, otros guerreros. Los hsien de Japón lo han modificado a una filosofía más parecida al Zen llamada Hsien-do y, a diferencia de algunas religiones mortales, el Tao Te Hsien acepta el cambio y el individualismo, siempre que no se convierta en autoglorificación. Es tranquilo, misterioso y profundo.\nTiene cinco pasos que corresponden aproximadamente a la historia de la creación taoísta, pero en reversa. Para los taoístas, primero estaba Wu-Wo: No Nada. De Wu-Wo vino Wu Chi: Sin Límite. Esto engendró Hu T'un: Caos. En el centro de este Caos había un punto quieto, primero una mota que se convirtió en T'ai Chi: el Gran Polo y de esto creció el Gran Cambio: T'ai I que se divide en dos etapas: T'ai Chu: el Gran Primero o forma, y T'ai Shih: el Gran Comienzo o el Primer Aliento (Chi). Todo esto eventualmente llevó a la creación de la [Glossary('First Age','game_concept_first_age_desc')]: T'ai Su: el Gran Primordial.\n¿Por qué los pasos están al revés? Los pasos representan la lucha por regresar al Sin Límite; para romper los lazos que limitan el viaje del shinma a los [spirit_worlds|E]. Hay muchos caminos de regreso a Sin Límite, pero el más seguro es el Tao Te Hsien. Se rumorea que los Dioses Profanos tienen su propia versión de Nei Tan llamada Hac Tao o el Camino Negro; un camino dictado por un [Glossary('Yama King','podgloss.yamaking')] durante la [Glossary('Third Age','game_concept_third_age_desc')]."

 game_concept_cantrip: "Cantrip"
 game_concept_cantrips: "Cantrips"
 game_concept_fae_realm: "Reino"
 game_concept_cantrip_desc: "Los Cantrips son los hechizos mágicos de los $POD_splat_fae$. Tienen dos componentes: el #bold Arte#! y el #bold Reino#!.\n\nEl Arte determina el efecto del Cantrip. Un personaje puede aprender nuevas Artes yendo a un [journey|E] para #italic Aprender Nuevas Habilidades#!, luego desbloqueando [perks|E] en uno de los [lifestyles|E] de Arte.\n\nEl Reino determina quién puede ser objetivo del Cantrip. Un $POD_splat_fae$ sin habilidad solo puede afectar a personajes muy específicos con su magia, mientras que uno que ha dominado los Reinos puede encantar a cualquiera en el mundo.\n\nHay seis Reinos:\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L;bold Actor#!#! permite lanzar Cantrips en objetivos menos familiares.\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_fae,[GetNullCharacter] #L;bold Hada#!#! permite lanzar Cantrips en [splats|E] más poderosos.\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L;bold Atrezzo#!#! permite lanzar Cantrips en [artifacts|E] más raros.\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_nature,[GetNullCharacter] #L;bold Naturaleza#!#! permite afectar fenómenos naturales.\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_scene,[GetNullCharacter] #L;bold Escena#!#! determina el rango y área de los Cantrips.\n$EFFECT_LIST_BULLET$#TOOLTIP:GAME_TRAIT,realm_time,[GetNullCharacter] #L;bold Tiempo#!#! determina la duración y el tiempo de reutilización de los Cantrips.\n\nTodo personaje de sangre feérica puede desbloquear [perks|E] en el [lifestyle|E] [realm_lifestyle|E], pero dominar completamente un Reino requiere un [journey|E]."

 game_concept_bunk: "Bunk"
 game_concept_bunk_desc: "Hubo un tiempo en que el Glamour podía ser arrancado del aire; cuando las hadas estaban imbuidas de él y no tenían necesidad de tal suave persuasión. Esa era la [Glossary('Mythic Age','game_concept_mythic_age_desc')], pero ese tiempo ya pasó. Ahora, para convocar el Glamour necesario para tejer un cantrip, los cambiaformas deben realizar rituales y acciones extrañas que se han llegado a conocer como Bunks."

 game_concept_unconquered_soul: "Alma Inconquistada"
 game_concept_unconquered_soul_desc: "Alma Inconquistada es un evento donde tu retrato, rasgos y religión pueden ser sobrescritos por la víctima de tu $pod_diablerie$."
 
 game_concept_umbra_expedition: "Expedición a la Umbra"
 game_concept_umbra_expeditions: "Expediciones a la Umbra"
 game_concept_umbra_expedition_desc: "Explora una ubicación de la Umbra donde uno de tus exploradores ha hecho un descubrimiento, requiere superar una serie de desafíos, puede involucrar duelos contra espíritus, pruebas de habilidad o una oportunidad de obtener tesoros."
 
 game_concept_umbra_aptitude: "Aptitud de Umbra"
 game_concept_umbra_aptitude_desc: "Medida de la rapidez con que este personaje puede explorar la Umbra."
 
 game_concept_umbra_sense: "Sentido de la Umbra"
 game_concept_umbra_sense_desc: "Medida de la probabilidad de que este personaje evite quedar atrapado en la [umbra|E], o complete con éxito una [umbra_expedition|E] asignada.\nPara [GetTrait('mokole').GetName(GetNullCharacter)] también reduce la posibilidad de ser atacado por [innocents|E]."
 
 game_concept_roguelike_mode: "Modo Roguelike"
 game_concept_roguelike_mode_desc: "Un #N modo difícil#! para [princes_of_darkness|E].\n\nAl inicio del juego, cambiarás a un gobernante aleatorio de una provincia. Ese gobernante también estará maldito. Puedes seleccionar una de las siguientes maldiciones:\n$EFFECT_LIST_BULLET$[GetModifier ('POD_roguelike_no_wealth').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_love').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$ [GetModifier('POD_roguelike_no_rest').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_belongings').GetNameWithTooltip] \n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_curiosity').GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_guile'). GetNameWithTooltip]\n$EFFECT_LIST_BULLET$[GetModifier('POD_roguelike_no_demands').GetNameWithTooltip]\n\nAlternativamente, puedes dejar que el juego seleccione una maldición aleatoria para ti, o obtener todas las maldiciones a la vez.\n\nSolo tienes una vida. Si tu gobernante inicial muere mientras todavía está maldito, es fin del juego.\n\nCompletar uno de los objetivos principales eliminará tus maldiciones.\n\nBuena suerte."
 
 game_concept_true_faith: "Fe Verdadera"
 game_concept_true_faith_desc: "Algunos individuos tienen una creencia tan inquebrantable en lo divino que su propia convicción los protege. Esto se conoce como #bold Fe Verdadera#!, y otorga al creyente poderes sobrenaturales.\n\nLos $POD_splat_vampire_plural$ son repelidos por ella. Los $POD_splat_werewolf_plural$ son despojados de su ira en su presencia. Los $POD_splat_demon_plural$ y los $POD_splat_wraith_plural$ son especialmente vulnerables a ella. Sin embargo, la Fe Verdadera se puede encontrar entre muchos [splats|E], e incluso algunos Vampiros la tienen.\n\nEn [princes_of_darkness|E], [GetTrait('truefaith').GetName(GetNullCharacter)] es un [trait|E] que desbloquea un nuevo [lifestyle|E]. Un personaje con una fe especialmente fuerte es [GetTrait('beatific').GetName(GetNullCharacter)].\n\nEl culto Demoníaco de un [GetTrait('witch').GetName(GetNullCharacter)] es mutuamente excluyente con la Fe Verdadera. Los $POD_splat_hunter_plural$ también pueden perder la Fe Verdadera si tienen una personalidad pecaminosa."
 
 game_concept_infiltration: "Infiltración"
 game_concept_infiltration_mission: "Misión de Infiltración"
 game_concept_infiltration_missions: "Misiones de Infiltración"
 game_concept_infiltrating: "Infiltración"
 game_concept_infiltration_desc: "Una #bold Infiltración#! es un tipo de [journey|E] que te permite moverte sigilosamente en la [court|E] de otro para cumplir algún objetivo secreto, como robar un [artifact|E].\n\nLas Infiltraciones tienen lugar en un mapa donde puedes caminar libremente. Haz clic en los nodos para viajar entre ellos. Ten en cuenta que hacerlo puede aumentar tu [suspicion_with_icon|E].\n\nPara completar una Infiltración, debes regresar a un nodo de salida sin dejar que tu [suspicion_with_icon|E] alcance [EmptyScope.ScriptValue('suspicion_max')|V0].\n\nCompletar #V 3#! misiones de Infiltración con éxito otorgará [GetModifier('infiltration_experience_modifier').GetNameWithTooltip]."
 
 game_concept_suspicion: "Sospecha"
 game_concept_suspicion_with_icon: "@masquerade_icon:color_goldy_yellow! Sospecha"
 game_concept_suspicion_desc: "#bold Sospecha#! describe cuánta atención has atraído durante una [infiltration|E].\n\nLa Sospecha va de [EmptyScope. ScriptValue('suspicion_min')|V0] a [EmptyScope.ScriptValue('suspicion_max')|V0]. Si alguna vez alcanza [EmptyScope.ScriptValue('suspicion_max')|V0], te atrapan y la [infiltration|E] falla.\n\nEn [EmptyScope.ScriptValue('suspicion_threshold_1')|V0], [EmptyScope.ScriptValue('suspicion_threshold_2')|V0] y [EmptyScope.ScriptValue('suspicion_threshold_3')|V0] de Sospecha, surgirán complicaciones que harán más difíciles las futuras pruebas de [skill|E]."
 
 game_concept_mesmerize_defenses: "Defensas Contra la Hipnosis"
 game_concept_mesmerize_defenses_desc: "Los personajes con personalidades dominantes son más difíciles de hipnotizar. Si el defensor tiene estos rasgos o ventajas, tus posibilidades de éxito se reducen: \nVampiro \n$BULLET_WITH_TAB$[GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$ [GetPerk('fortify_the_inner_facade_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$Hechizo de Hechicería de Sangre 'Canción de Júpiter' lanzado \n$BULLET_WITH_TAB$[GetTrait('dominateadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetTrait('presenceadvanced').GetName(GetNullCharacter)] \n$BULLET_WITH_TAB$[GetTrait('auspexadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetTrait('fortitudeadvanced').GetName(GetNullCharacter)] \nMomia \n$BULLET_WITH_TAB$[GetPerk('wisdom_of_isis_perk').GetName(GetNullCharacter)] \nShih \n$BULLET_WITH_TAB$[GetPerk('mountain_meditation_perk').GetName (GetNullCharacter)]\nFe Verdadera \n$BULLET_WITH_TAB$[GetPerk('holy_bulwark_perk').GetName(GetNullCharacter)]\nPsíquico \n$BULLET_WITH_TAB$[GetPerk ('anti_psi_1_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_2_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk ('anti_psi_3_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk('anti_psi_4_perk').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$[GetPerk ('anti_psi_5_perk').GetName(GetNullCharacter)]\nHombre Lobo \n$BULLET_WITH_TAB$[GetPerk('release_from_bondage_perk').GetName(GetNullCharacter)] \nHada \n$BULLET_WITH_TAB$[GetPerk('fair_is_foul_foul_is_fair_perk').GetName(GetNullCharacter)] \n$BULLET_WITH_TAB$[GetPerk('captive_heart_perk').GetName (GetNullCharacter)] \n$BULLET_WITH_TAB$[GetPerk('geas_ban_perk').GetName(GetNullCharacter)]\nArtefactos \n$BULLET_WITH_TAB$Talismán de Ancestro"
 
 game_concept_samuel_haight: "Samuel Haight"
 game_concept_samuel_haight_desc: "Un infame villano del $pod_wod$ que apareció en aventuras cruzadas para varios [splats|E]. También conocido como el 'Ultimate Badass'.\n\nSamuel era un [GetTrait('kinfolk').GetName(GetNullCharacter)] que resentía su falta de poderes de cambio de forma. Luego acumuló poder de diferentes maneras: bebiendo sangre de $POD_splat_vampire$, aprendiendo [bloodsorcery|E], usando un rito prohibido para convertirse en $POD_splat_werewolf$, usando un artefacto para robar Dones de otros Hombres Lobo, usando el mismo artefacto para robar conocimiento de Esferas de un $POD_splat_mage$, y usando otro artefacto más para ganar Arete.\n\nSu escandalosa carrera llegó a su fin cuando un antiguo [GetTrait('baali').GetName (GetNullCharacter)] lo mató en la cima de una pirámide azteca. Al entrar en el [UmbraGlossary('shadowlands')] como [GetTrait('wraith').GetName (GetNullCharacter)], Haight fue forjado en un cenicero.\n\nAunque pudo haber comenzado como un villano serio, Samuel Haight se convirtió gradualmente en una meta-broma por parte de los escritores para burlarse de los personajes cruzados demasiado poderosos."
 
 game_concept_samuel_haight_mode: "Modo Samuel Haight"
 game_concept_samuel_haight_mode_with_icon: "@haight_icon! Modo Samuel Haight"
 game_concept_samuel_haight_mode_desc: "En este modo, se eliminan varias restricciones sobre la mezcla de [splats|E]:\n\n$EFFECT_LIST_BULLET$Ciertas decisiones e interacciones del creador de personajes están desbloqueadas por defecto, por ejemplo, pedir el $pod_Embrace$, o convertirse en un $POD_splat_ghoul$ drenando a un prisionero $POD_splat_vampire$\n$EFFECT_LIST_BULLET$Cualquier [splat|E] puede aprender todas las [Glossary('Numina', 'game_concept_numina_desc')]\n$EFFECT_LIST_BULLET$[GetTrait('truefaith').GetName(GetNullCharacter)] y #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Infernalismo#!#! ya no son mutuamente excluyentes\n$EFFECT_LIST_BULLET$Los $POD_splat_hunter_plural$ no pierden sus habilidades al convertirse en #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Infernalistas#!#!\n$EFFECT_LIST_BULLET$La Plaga Desolladora puede ser utilizada como arma por cualquier personaje, y cualquier Fera puede convertirse en un [GetTrait('abomination').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$Los personajes de sangre feérica conservan la capacidad de usar [cantrips|E] después del $pod_Embrace$\n$EFFECT_LIST_BULLET$Los personajes sobrenaturales pueden obtener los rasgos [GetTrait('psychic').GetName(GetNullCharacter)] al nacer\n$EFFECT_LIST_BULLET$El rasgo [GetTrait('dhampyr').GetName(GetNullCharacter)] ya no es mutuamente excluyente con otros rasgos [splat|E] al nacer\n$EFFECT_LIST_BULLET$Los semi-splats (como [GetTrait('ghoul').GetName(GetNullCharacter)]) ya no se eliminan al despertar de la Crisálida o el Primer Cambio\n$EFFECT_LIST_BULLET$Los Fera pueden ser ghoulizados\n$EFFECT_LIST_BULLET$Los $POD_splat_ghoul_plural$ no pierden los rasgos [GetTrait('kinfolk').GetName(GetNullCharacter)] o [GetTrait('kinain').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$Cualquier $POD_splat_vampire$ puede despertar su [GetTrait('hun_and_po').GetName(GetNullCharacter)] si se hacen amigos de un [GetTrait('salubri_watcher').GetName (GetNullCharacter)]\n\nCambios adicionales:\n\n$EFFECT_LIST_BULLET$Todos los [splats|E] pueden interactuar libremente entre sí\n$EFFECT_LIST_BULLET$Los [journeys|E] para aprender nuevas habilidades no aumentan de costo\n\nNombrado así por [samuel_haight|E]."
 
 game_concept_storyteller_mode: "Modo Narrador"
 game_concept_storyteller_mode_with_icon: "@wod_icon! Modo Narrador"
 game_concept_storyteller_mode_desc: "Este modo de juego tiene varias restricciones que dificultan acumular poder rápidamente:\n\n$EFFECT_LIST_BULLET$La [loyalty_with_icon|E] tiene un requisito de [opinion|E] de #V 50#!\n$EFFECT_LIST_BULLET$La experiencia de [resonance|E] por beber sangre se reduce, según la cantidad de ventajas de $pod_discipline$ que tenga un personaje\n$EFFECT_LIST_BULLET$Los jugadores que declaran una guerra ofensiva (mediante interacción de personaje) o abrazan a un vástago caerán de la [golconda|E]"
 
 game_concept_loyalty: "Lealtad"
 game_concept_loyalty_with_icon: "@knight_icon!Lealtad"
 game_concept_loyalty_desc: "Los [knights|E] sin tierras querrán abandonar la corte de un jugador si su [opinion|E] cae por debajo de #V 0#!. Tienes un período de gracia de 1 año para volver a aumentar su opinión.\n\nLos personajes no están sujetos a la Lealtad si:\n$EFFECT_LIST_BULLET$Tienes un [strong_hook|E] sobre ellos\n$EFFECT_LIST_BULLET$Están en tu [council|E]\n$EFFECT_LIST_BULLET$Tienen una relación de subordinación contigo (Rebaño, Soñador, Esclavo, Anfitrión, Wraith Vinculado o Demonio Vinculado)\n$EFFECT_LIST_BULLET$Son tu [spouse|E], [friend|E], [soulmate|E] o miembro de tu [coterie|E]\n$EFFECT_LIST_BULLET$Son tu [hostage|E]\n$EFFECT_LIST_BULLET$Están bajo un Geas de Protección\n\nLa Lealtad tiene requisitos más estrictos en [storyteller_mode_with_icon|E]."
 
 game_concept_static_stress: "Tensión Mental"
 game_concept_static_stress_desc: "La tensión mental es un tipo especial de [stress|E] que no se ve afectado por ningún modificador que afecte a un personaje."
 
 game_concept_kuei_jin: "Kuei-jin"
 game_concept_kuei_jin_desc: "Más comúnmente conocidos como los Kuei-jin, los 'Vampiros Orientales' también son llamados los Wan Kuei, Gui Ren, asuratizayya (en India), o simplemente los 'Muertos Hambrientos'.\n\nSe dice que los Kuei-jin son los descendientes corrompidos de los Wan Xian, los 'Diez Mil Héroes' elegidos por la [Glossary('August Personage of Jade','podgloss.augustpersonageofjade')] para guiar y proteger el universo en la historia antigua. Los Wan Xian fueron originalmente elegidos mediante pruebas de habilidad y coraje, y se alimentaban del chi ambiental del universo. Sin embargo, cayeron en desgracia, aprendiendo a alimentarse del chi de los seres vivos y corrompiendo las pruebas de valía.\n\nUn Kuei-jin 'nace' cuando su alma escapa de un [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] después de su muerte. Se organizan alrededor de Cortes políticas y siguen un [Glossary('Dharma', 'podgloss.dharma')] para encontrar un camino de regreso a los Cielos."
 game_concept_wan_xian: "Wan Xian"
 game_concept_wan_kuei: "Wan Kuei"
 game_concept_hungry_dead: "Muertos Hambrientos"
 game_concept_asuratizayya: "Asuratizayya"
 
 game_concept_grand_city_of_constantinople: "Constantinopla, el Sueño que se Desvanece"
 game_concept_grand_city_of_constantinople_desc: "La Gran Ciudad de Constantinopla tiene tres rutas diferentes según la cultura de su poseedor.\n\nLa ruta del saqueo (para latinos, ibéricos, franceses, ingleses y alemanes) tiene edificios con un largo tiempo de creación pero una gran recompensa inicial al final, representando el largo proceso de saquear la ciudad por toda su riqueza.\nLa ruta de la reconstrucción (para bizantinos, romanos, rusos y griegos antiguos) ofrece edificios costosos que tardan mucho en ser rentables, pero es la más poderosa al final para una Constantinopla completamente construida. \nLa ruta de la reforma (para todos los demás) es un punto intermedio, que ofrece una multitud de edificios con buena rentabilidad y costos asequibles. $grand_city_incompatible_tooltip$"
 
 game_concept_plunder_route: "Ruta del Saqueo"
 game_concept_rebuild_route: "Ruta de la Reconstrucción"
 game_concept_reform_route: "Ruta de la Reforma"
 
 game_concept_bloodmagic_spell: "Hechizo de Magia de Sangre"
 game_concept_bs_spell: "Hechizo"
 game_concept_bs_spells: "Hechizos"
 game_concept_bloodmagic_spell_desc: "#bold Los Hechizos#! permiten a un [bloodsorcerer|E] hacer cosas que no son naturales incluso para los estándares vampíricos. Cada Hechizo está asociado con un [bs_path|E].\n\nLos Hechizos pueden tener costos adicionales más allá del [hunger_with_icon|E], como [static_stress|E] o [piety|E].\n\nEn [princes_of_darkness|E], los Hechizos se lanzan a través del [character_interaction|E] #V $blood_sorcery_interaction$#!. Su probabilidad de éxito se basa en la diferencia de [learning|E], y, si ambos son $POD_splat_vampire_plural$, en su diferencia de [Glossary('Generation','game_concept_vampgeneration_desc')]."
 
 game_concept_bloodmagic_tradition: "Tradición de Magia de Sangre"
 game_concept_bs_tradition: "Tradición"
 game_concept_bs_traditions: "Tradiciones"
 game_concept_bloodmagic_tradition_desc: "Cada $pod_clan$ que practica [bloodsorcery|E] ha creado su propio sistema de creencias y saber alrededor de su práctica.\n\nEn [princes_of_darkness|E], las siguientes Tradiciones se pueden aprender mediante [journey|E]:\n$EFFECT_LIST_BULLET$#bold Taumaturgia#!, de los [GetTrait('tremere').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold Dur-An-Ki#!, de los [GetTrait('assamite').GetName(GetNullCharacter)] \n$EFFECT_LIST_BULLET$#bold Akhu#!, de los #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Setitas#!#!\n$EFFECT_LIST_BULLET$#bold Sadhana#!, de los [GetTrait('ravnos').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$#bold Hechicería Koldúnica#!, de los [GetTrait('tzimisce').GetName(GetNullCharacter)] \n$EFFECT_LIST_BULLET$#bold Misticismo Abisal#!, de los [GetTrait('lasombra').GetName(GetNullCharacter)]\n\nAprender una Tradición dará acceso a sus [bs_paths|E] asociados. Algunos Caminos también son compartidos entre Tradiciones."
 
 game_concept_bloodmagic_path: "Camino de Magia de Sangre"
 game_concept_bs_path: "Camino"
 game_concept_bs_paths: "Caminos"
 game_concept_bloodmagic_path_desc: "Un #bold Camino#! es una colección de procedimientos para lograr un tipo de efecto con la [bloodsorcery|E], como controlar el clima, manipular enfermedades o invocar Demonios.\n\nEn [princes_of_darkness|E], los Caminos son líneas de [perks|E] en el [lifestyle|E] de Magia de Sangre. Estas ventajas pueden desbloquear nuevos [bs_spells|E] o mejorar los existentes.\n\nAprender una [bs_tradition|E] dará acceso a sus Caminos asociados. Algunos Caminos también son compartidos entre Tradiciones."
 
 game_concept_bloodmagic_ritual: "Ritual de Magia de Sangre"
 game_concept_bs_ritual: "Ritual"
 game_concept_bs_rituals: "Rituales"
 game_concept_bloodmagic_ritual_desc: "#bold Los Rituales#! son [bs_spells|E] poderosos. A menudo tienen una menor probabilidad de fallo, pero toman más tiempo y recursos adicionales, como [gold|E] o [piety|E].\n\nLos Rituales están vinculados a [bs_traditions|E]. Los Rituales más poderosos se desbloquean al obtener [perks|E] en cualquier [bs_path|E] de esa Tradición.\n\nEn [princes_of_darkness|E], los Rituales son [journeys|E]. No puedes [travel|E] ni participar en [activities|E] mientras planeas un Ritual."
 
 game_concept_curia_support: "Apoyo de la Curia"
 game_concept_curia_support_desc: "Como inquisidor sin tierras, tienes un valor (que puedes consultar en la decisión del mismo nombre) llamado Apoyo de la Curia que muestra cuánto valora la Iglesia tus acciones.\n\nPuedes mejorar tu Apoyo de la Curia logrando contratos específicos o ganando guerras contra sobrenaturales. Puedes gastar el Apoyo de la Curia para pedir varios favores (mediante una decisión) que pueden acelerar el logro de tu objetivo final: Europa y Tierra Santa libres de los secuaces del Infierno.\n\nTen en cuenta que cada vez que los cardenales eligen a un nuevo Papa, un Legado Papal será enviado a tu campamento para evaluar tu celo. Estará disgustado si se entera de que usas conocimiento no autorizado como #TOOLTIP:GAME_TRAIT,sorcerer, [GetNullCharacter] #L Hechicería#!#! o #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Demonología#!#!. Si das un paso más allá, como convertirte en un [GetTrait('witch').GetName(GetNullCharacter)] o inmortal por cualquier medio, serás excomulgado."
 
 game_concept_crafting: "Artesanía"
 game_concept_crafting_desc: "La Artesanía es una mecánica que se utiliza para crear [artifacts|E].\nHay tres métodos diferentes de artesanía:\n$BULLET_WITH_TAB$[crafting_forging|E]\n$BULLET_WITH_TAB$[crafting_brewing|E]\n$BULLET_WITH_TAB$[crafting_enhancing|E]\n\nLos [crafting_nodes|E] se colocan en el minijuego de artesanía donde puedes hacer clic en ellos y conectarlos entre sí para producir el resultado deseado. El tamaño del mapa del minijuego está dictado por tu [crafting_potential|E], y el mapa se puede regenerar usando [crafting_rerolls|E].\n\nEl número de nodos que puedes utilizar en una sola sesión está limitado por tu [crafting_complexity|E]."
 
 game_concept_crafting_forging: "Forja"
 game_concept_crafting_forged: "Forjado"
 game_concept_crafting_forging_desc: "Mediante la forja creas [artifacts|E] completamente nuevos. Estos artefactos suelen estar equipados en tu personaje, aunque algunos pueden tener otros usos. La forja puede requerir a veces recursos adicionales como fragmentos de artefactos o prisioneros específicos.\n\nLa [rarity|E] del artefacto creado depende de su durabilidad máxima al final del proceso de forja."
 
 game_concept_crafting_forging_template: "Plantilla de Forja"
 game_concept_crafting_forging_template_desc: "Una Plantilla de Forja determina qué tipo de artefacto estás creando y se elige a través de un menú desplegable en la interfaz de [crafting_forging|E]. Estas pueden variar desde armaduras y armas regulares hasta objetos sobrenaturales. Todos los personajes tienen acceso a plantillas que corresponden a sus espacios de inventario. Se pueden desbloquear Plantillas adicionales mediante [perks|E] u otras fuentes similares."
 
 game_concept_crafting_brewing: "Elaboración"
 game_concept_crafting_brewing_desc: "La Elaboración es cómo creas brebajes consumibles y otras sustancias a través de varios métodos como la alquimia. Estos consumibles se pueden usar en ti mismo o en otros personajes utilizando un [character_interaction|E]."
 
 game_concept_crafting_enhancing: "Mejora"
 game_concept_crafting_enhancing_desc: "La Mejora o Encantamiento es el proceso de mejorar [artifacts|E] existentes. Cada artefacto se puede mejorar hasta su [crafting_enhance_limit|E] y ciertos artefactos pueden no ser mejorados en absoluto."
 
 game_concept_crafting_node: "Nodo de Artesanía"
 game_concept_crafting_nodes: "Nodos de Artesanía"
 game_concept_crafting_node_desc: "Los Nodos de Artesanía son la forma principal de crear o mejorar un artefacto. Todos los personajes comienzan con algunos nodos #bold base#! que no se pueden desactivar.\n\nSe pueden desbloquear nodos especiales adicionales a través de ventajas, edificios especiales u otros métodos especiales. Cada nodo tiene algunos requisitos que deben cumplirse para usarlo. Los nodos para [crafting_brewing|E] también pueden ejecutar efectos por sí mismos.\n\nLos nodos #bold especiales#! desbloqueados se pueden activar y desactivar libremente antes de comenzar una sesión de artesanía haciendo clic en ellos en la interfaz gráfica de artesanía."
 
 game_concept_crafting_complexity: "Complejidad de Artesanía"
 game_concept_crafting_complexity_desc: "La Complejidad representa el número de acciones que tienes a tu disposición al crear o mejorar un artefacto antes de que te veas obligado a detenerte.\n\nEste número se mejora principalmente con el [trait|El] [GetTrait('pod_crafter').GetName(GetNullCharacter)] que mejora a medida que usas la mecánica de [crafting|E]."
 
 game_concept_crafting_potential: "Potencial de Artesanía"
 game_concept_crafting_potential_desc: "El Potencial de Artesanía representa el tamaño del mapa del minijuego de artesanía utilizado al crear. Un valor más alto ofrece más oportunidades. El potencial de artesanía se basa principalmente en la [trait_level_track_xp|E] de [GetTrait('pod_crafter').GetName (GetNullCharacter)]."
 
 game_concept_crafting_rerolls: "Reintentos de Artesanía"
 game_concept_crafting_rerolls_desc: "Los Reintentos de Artesanía, como su nombre indica, te permiten regenerar el mapa del minijuego para obtener potencialmente mejores [crafting_nodes|E] o diseño. Se basa en tu [learning|E] y es la única estadística de artesanía que está directamente vinculada a una [skill|E]."
 
 game_concept_crafting_enhance_limit: "Potencial de Mejora"
 game_concept_crafting_enhance_limit_desc: "Cada [artifact|E] tiene un límite en cuántas veces puede ser mejorado, y ese límite es su potencial.\n\nEl potencial se basa principalmente en la [rarity|E]:\n$BULLET_WITH_TAB$#COMMONBROWN Común#! — #N 0#!\n$BULLET_WITH_TAB$#color_dark_green Maestro#! — 1\n$BULLET_WITH_TAB$#FAMEDBLUE Famoso#! — 2\n$BULLET_WITH_TAB$#ILLUSTRIOUSPURPLE Ilustre#! — 3"
 
 game_concept_artifact_power: "Poder del Artefacto"
 game_concept_artifact_power_with_icon: "@artifact_power_icon!Poder del Artefacto"
 game_concept_artifact_power_desc: "Algunos [artifacts|E] [crafting_forged|E] poseen un valor que representa su fuerza cuando se utilizan en sus propios efectos. Esto solo se muestra cuando la [crafting_forging_template|E] lo usa. Este valor aumenta con cada [crafting_node|E] utilizado durante el proceso de Forja dependiendo del nivel del nodo."
 
 game_concept_POD_landless_mechanics: "Mecánicas sin Tierras"
 game_concept_POD_landless_mechanics_desc: "Los siguientes [splats|E] tienen mecánicas únicas como [adventurers|E]:\n\n$BULLET_WITH_TAB$ #bold $POD_splat_vampire_plural$, $POD_splat_ghoul_plural$ y $POD_splat_revenant_plural$#! pueden subir de rango como #TOOLTIP:GAME_TRAIT,ashen_adventurer, [GetNullCharacter] #L Aventureros Cenicientos#!#!, desbloqueando nuevas interacciones y nuevas líneas de construcción para su [domicile|E]. \n$BULLET_WITH_TAB$ #bold $POD_splat_kueijin_plural$#! también pueden ser #TOOLTIP:GAME_TRAIT,ashen_adventurer,[GetNullCharacter] #L Aventureros Cenicientos#!#!, con ligeras modificaciones.\n$BULLET_WITH_TAB$ #bold $POD_splat_hunter_plural$ de la Inquisición Sombría#! ganan [curia_support|E] al cazar exitosamente criaturas de la noche.\n$BULLET_WITH_TAB$ #bold $POD_splat_hunter_plural$ independientes#! tienen una serie de decisiones para ganar apoyo de las otras órdenes de $POD_splat_hunter$.\n$BULLET_WITH_TAB$ #bold $POD_splat_mummy_plural$#! tienen una Tumba que recibirá [POD_tomb_raids|E] por parte de aventureros codiciosos.\n$BULLET_WITH_TAB$ #bold $POD_splat_demon_plural$#! pueden redescubrir conocimiento demoníaco haciendo crecer su [Concept ('cultist','Culto')|E].\n\nTodos los [splats|E] mencionados anteriormente tienen [domiciles|E] únicos que conservan sus mejoras en la transición sin tierras <-> con tierras.\n\nLos siguientes [splats|E] también tienen [domiciles|E] sin tierras, pero no tienen mecánicas adicionales como [adventurers|E] :\n\n$BULLET_WITH_TAB$ #bold $POD_splat_mokole_plural$#!\n\nOtros [splats|E] son #N no jugables#! como [adventurers|E] (todavía)."
 
 game_concept_ashen_ambassador: "Embajador Ceniciento"
 game_concept_ashen_ambassador_desc: "Los Embajadores son personajes sin tierras que trabajan (principalmente) para beneficio de otro personaje con tierras, el Patrón del Embajador.\nSu herramienta principal es una interacción de personaje llamada Visita del Embajador donde pueden usar diferentes acciones para influir en el gobernante local y ganar experiencia. También pueden usar la interacción Solicitar Apoyo del Patrón en su benefactor para solicitar varios recursos.\nUn Embajador solo puede tener un Patrón a la vez y perderá acceso a sus características si adquiere tierras. Sin embargo, conserva la experiencia y los edificios desbloqueados hasta ese momento."
 
 game_concept_ashen_grandmaster: "Gran Maestre Ceniciento"
 game_concept_ashen_grandmaster_desc: "Los Grandes Maestres son personajes sin tierras que lideran una orden militar (formal o no).\nPueden personalizar y mejorar su organización (mediante una decisión) gastando experiencia del rasgo de Gran Maestre Ceniciento, dicha experiencia se adquiere participando en guerras en el bando ganador, o completando contratos sin tierras marciales y de guerra.\nLos $pod_kueijin$ sin tierras usan esta experiencia para aprender y mejorar estrategias relacionadas con la guerra."
 
 game_concept_ashen_caravan: "Maestro de Caravanas Ceniciento"
 game_concept_ashen_caravan_desc: "Los Maestros de Caravanas Cenicientos son esos pocos personajes que realmente saben navegar por los mortales caminos del Mundo de Tinieblas, y venden su experiencia a los necesitados.\nGanas experiencia para esta línea de rasgos completando contratos de transporte. Desbloquea nuevas posiciones de corte sin tierras y reduce el costo de usar opciones de viaje."
 
 game_concept_ashen_cult: "Maestro de Culto Ceniciento"
 game_concept_ashen_cult_desc: "Profetas, herejes, hacedores de milagros... el Mundo de Tinieblas está lleno de personas, sean mortales o no, que buscan la verdad y están dispuestas a creer en un individuo carismático que la entregue (su versión de ella).\nPuedes mejorar esta línea de rasgos usando la decisión del mismo nombre. Te permite interactuar con el condado donde está estacionado tu domicilio de varias maneras a través de un evento."
 
 game_concept_akuma: "Akuma"
 game_concept_akuma_desc: "Los Akuma, o Devorados por el Diablo, son individuos que han abandonado la virtud y han unido su suerte a la de los [Glossary('Yama Kings','podgloss.yamaking')]. Algunos son simples peones ingenuos mientras que otros son criaturas terroríficas con poderes infernales.\n\nA los efectos de los objetivos en [princes_of_darkness|E], los Akuma son:\n$BULLET_WITH_TAB$Personajes con el [trait|E] [GetTrait('witch').GetName(GetPlayer)] \n$BULLET_WITH_TAB$Personajes con el [trait|E] [GetTrait('wukuei').GetName(GetPlayer)]\n$BULLET_WITH_TAB$Personajes con una [faith|E] que tiene la [doctrine|E] [GetFaithDoctrine('special_doctrine_allied_to_yomi_wan_hostility').GetBaseName]\n$BULLET_WITH_TAB$Personajes con el [modifier|E] [GetModifier ('yama_king_modifier').GetNameWithTooltip]"
 
 game_concept_grand_paris: "Gran París"
 game_concept_grand_paris_desc: "La [grand_city|E] de París es deseada por muchos. Hay tres versiones de la ciudad:\n\n$BULLET_WITH_TAB$París Caballeresca: Disponible para [GetTrait('toreador').GetName(GetNullCharacter)], [GetTrait('ventrue').GetName(GetNullCharacter)], o un $POD_splat_vampire$ que sigue la Vía Equitum. Modelada según la tumultuosa alianza entre la Gran Corte de Alejandro y las $glossary_courts_of_love$ y todo el potencial que tenía.\nEsta versión contiene un edificio único para Toreador (y Vía Equitum) y otro para Ventrue (con el propio Alejandro obteniendo una versión diferente). \n\n$BULLET_WITH_TAB$París Umbría: Disponible para otros $POD_splat_vampire_plural$, $POD_splat_kueijin_plural$, $POD_splat_demon_plural$, $POD_splat_wraith_plural$, #TOOLTIP:GAME_TRAIT,banemummy,[GetNullCharacter] #L Momias Plaga#!#!, o religiones con la doctrina Unseelie. Representa una París bajo el control de seres sobrenaturales oscuros.\n\n$BULLET_WITH_TAB$París Libre: Disponible para todos los demás. Una París liberada de la influencia parasitaria de poderes oscuros. La Inquisición Sombría obtiene algunos edificios únicos en la ciudad.$grand_city_incompatible_tooltip$"
 
 game_concept_holy_cairo: "El Cairo la Victoriosa"
 game_concept_holy_cairo_desc: "A veces llamada Umm al-Dunya ('Madre del Mundo'). Originalmente la ciudad de Fustat, la región fue construida por persas, romanos, bizantinos y finalmente los árabes, que la bautizaron como Al Qahirah ('La Victoriosa'). Hay tres versiones de la ciudad:\n\n$BULLET_WITH_TAB$El Cairo Antiguo: Disponible para todos los miembros de la $glossary_osirian_league$ y las #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Momias#!#! Ismaelitas. Obtén poderes únicos a medida que reúnes a los Osirianos en la sagrada El Cairo. Necesitarás a todos los miembros como [councillors|E] hábiles para desbloquear todo el potencial de la ciudad.\n#warning Se recomienda encarecidamente jugar en el tercer marcador. ¡Esta versión también está completamente deshabilitada en el primer marcador!#!\n\n$BULLET_WITH_TAB$El Cairo Vampírico: Disponible para #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L vampiros#!. Construye y expande las $glossary_khittas$ para hacer crecer El Cairo y mejorar la efectividad de tus [councillors|E] y [court_positions|E]. Las religiones con la [doctrine|el] de los Pilares [Glossary('Ashirra','game_concept_ashirra_desc')] obtienen bonificaciones adicionales por construir las Khittas alineadas con los Ashirra. Los Setitas pueden reconstruir sus templos fundacionales para crear su propio Camino de Set [faith|El]. \n\n$BULLET_WITH_TAB$El Cairo Islámico: Disponible para todos los demás. Pero solo los cazadores Ikhwan al-Safa pueden desbloquear el verdadero potencial de esta ciudad.$grand_city_semi_incompatible_tooltip$"
 
 game_concept_holy_jerusalem: "Jerusalén Santa"
 game_concept_holy_jerusalem_desc: "La [grand_city|E] de Jerusalén es un lugar de gran importancia para las 3 religiones abrahámicas. Jerusalén es el centro histórico de adoración para el judaísmo desde la época de la atadura de Isaac y es el único lugar permitido para ciertos festivales, si uno ignora las enseñanzas rabínicas. El cristianismo ve a Jerusalén como el lugar donde Jesús el Mesías fue ejecutado y resucitado, muy cerca del Monte de los Olivos. El islam considera a Jerusalén como el destino de Mahoma durante su Viaje Nocturno y como la primera Qibla.\n\nLas variantes de la ciudad se basan en el equilibrio de influencia política entre las 3 religiones, un equilibrio que se mantiene cuando la ciudad es conquistada. Ten en cuenta que, como gobernante cristiano, puede resultarte costoso aumentar la influencia cristiana después de conquistar la ciudad de un gobernante musulmán. Hay 4 versiones de la ciudad:\n$BULLET_WITH_TAB$Jerusalén Cristiana: Disponible para seguidores de [christian_derived_faiths|E]. Expande el poder de 5 órdenes de cruzados que mejoran o son mejoradas por tus caballeros.\n$BULLET_WITH_TAB$Jerusalén Musulmana: Disponible para seguidores de [muslim_derived_faiths|E]. Renueva y consagra sitios importantes para aumentar tus ingresos y tu capacidad para eliminar a los cruzados invasores.\n$BULLET_WITH_TAB$Jerusalén Judía: Disponible para seguidores de [jewish_derived_faiths|E]. Reconstruye los monumentos antiguos de Jerusalén para obtener un conjunto equilibrado de edificios. \n$BULLET_WITH_TAB$Jerusalén Dividida: Disponible para todos los demás. Construye cada uno de los Cuarteles para desbloquear algunos de los beneficios que una Jerusalén más especializada podría ver mientras mantienes el equilibrio de poder, usando el gráfico en la [decision|E] Cambiar Equilibrio para monitorearlo.\n\nAdemás de los diferentes edificios, Jerusalén ofrece algunas [Concept('jerusalem_unique_decisions','Decisiones Únicas')|E] relacionadas con el Pozo cercano."
 
 game_concept_christian_derived_faiths: "Religiones Derivadas del Cristianismo"
 game_concept_christian_derived_faith: "Religión Derivada del Cristianismo"
 game_concept_christian_derived_faiths_desc: "[SelectLocalization( IsInGame, 'game_concept_christian_derived_faiths_desc_ingame', 'game_concept_christian_derived_faiths_desc_outofgame' )]"
 game_concept_christian_derived_faiths_desc_ingame: "Muy pocos [characters|E] dentro del $pod_wod$ practican una forma reconocible de cristianismo y en su lugar practican [faiths|E] derivadas de versiones más familiares. En [princes_of_darkness|E], estas [faiths|E] son:\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viachristi').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viavindicta').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viapenaculum').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viaredemptio').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('pathoftheheavenlyabode').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('vianoctis').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viadolorosa').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viacain').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey ('viapura').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('redtemptation').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey ('apostlesthirdcaine').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('blackmagdalene').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey ('eschatologists').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('sanctamater').GetName]\n$BULLET_WITH_TAB$@supehunter_icon! [GetFaithByKey ('shadowinquisition').GetName]\n$BULLET_WITH_TAB$@supehunter_icon! [GetFaithByKey('akritai').GetName]\n$BULLET_WITH_TAB$Las [faiths|E] [GetReligionByKey ('calomenasforsaken_religion').GetName]\n$BULLET_WITH_TAB$@werewolf_icon! [GetFaithByKey('crestofthehorn').GetName]\n$BULLET_WITH_TAB$@werewolf_icon! [GetFaithByKey('orderofourmercifulmother').GetName]\n$BULLET_WITH_TAB$Las [faiths|E] [GetReligionByKey('fishers_religion').GetName] \n$BULLET_WITH_TAB$Cualquier [faith|E] con @changeling_icon! [GetFaithDoctrine('special_doctrine_fae_constantinians_hostility').GetBaseName]"
 game_concept_christian_derived_faiths_desc_outofgame: "Muy pocos [characters|E] dentro del $pod_wod$ practican una forma reconocible de cristianismo y en su lugar practican [faiths|E] derivadas de versiones más familiares. En [princes_of_darkness|E], estas [faiths|E] son:\n$BULLET_WITH_TAB$@vampire_icon! $viachristi$\n$BULLET_WITH_TAB$@vampire_icon! $viavindicta$\n$BULLET_WITH_TAB$@vampire_icon! $viapenaculum$\n$BULLET_WITH_TAB$@vampire_icon! $viaredemptio$\n$BULLET_WITH_TAB$@vampire_icon! $pathoftheheavenlyabode$\n$BULLET_WITH_TAB$@vampire_icon! $vianoctis$\n$BULLET_WITH_TAB$@vampire_icon! $viadolorosa$\n$BULLET_WITH_TAB$@vampire_icon! $viacain$\n$BULLET_WITH_TAB$@vampire_icon! $viapura$\n$BULLET_WITH_TAB$@vampire_icon! $redtemptation$\n$BULLET_WITH_TAB$@vampire_icon! $apostlesthirdcaine$\n$BULLET_WITH_TAB$@vampire_icon! $blackmagdalene$\n$BULLET_WITH_TAB$@vampire_icon! $eschatologists$\n$BULLET_WITH_TAB$@vampire_icon! $sanctamater$\n$BULLET_WITH_TAB$@supehunter_icon! $shadowinquisition$\n$BULLET_WITH_TAB$@supehunter_icon! $akritai$\n$BULLET_WITH_TAB$Las [faiths|E] $calomenasforsaken_religion$\n$BULLET_WITH_TAB$@werewolf_icon! $crestofthehorn$\n$BULLET_WITH_TAB$@werewolf_icon! $orderofourmercifulmother$\n$BULLET_WITH_TAB$Las [faiths|E] $fishers_religion$\n$BULLET_WITH_TAB$Cualquier [faith|E] con @changeling_icon! $special_doctrine_fae_constantinians_hostility_name$"
 
 game_concept_muslim_derived_faiths: "Religiones Derivadas del Islam"
 game_concept_muslim_derived_faiths_desc: "[SelectLocalization( IsInGame, 'game_concept_muslim_derived_faiths_desc_ingame', 'game_concept_muslim_derived_faiths_desc_outofgame' )]"
 game_concept_muslim_derived_faiths_desc_ingame: "Muy pocos [characters|E] dentro del $pod_wod$ practican una forma reconocible de islam y en su lugar practican [faiths|E] derivadas de versiones más familiares. En [princes_of_darkness|E], estas [faiths|E] son:\n$BULLET_WITH_TAB$Los @vampire_icon! [Glossary('Ashirra','game_concept_ashirra_desc')]\n$BULLET_WITH_TAB$Cualquier [faith|E] con @vampire_icon! [GetFaithDoctrine ('special_doctrine_ashirra_pillars_kindred').GetBaseName]\n$BULLET_WITH_TAB$Las [faiths|E] [GetReligionByKey('roadofblood_religion').GetName] \n$BULLET_WITH_TAB$@supehunter_icon! [GetFaithByKey('ikhwan_al_safa').GetName]"
 game_concept_muslim_derived_faiths_desc_outofgame: "Muy pocos [characters|E] dentro del $pod_wod$ practican una forma reconocible de islam y en su lugar practican [faiths|E] derivadas de versiones más familiares. En [princes_of_darkness|E], estas [faiths|E] son:\n$BULLET_WITH_TAB$Los @vampire_icon! [Glossary('Ashirra','game_concept_ashirra_desc')]\n$BULLET_WITH_TAB$Cualquier [faith|E] con @vampire_icon! $special_doctrine_ashirra_pillars_kindred_name$\n$BULLET_WITH_TAB$Las [faiths|E] $roadofblood_religion$\n$BULLET_WITH_TAB$@supehunter_icon! $ikhwan_al_safa$"
 
 game_concept_jewish_derived_faiths: "Religiones Derivadas del Judaísmo"
 game_concept_jewish_derived_faiths_desc: "[SelectLocalization( IsInGame, 'game_concept_jewish_derived_faiths_desc_ingame', 'game_concept_jewish_derived_faiths_desc_outofgame' )]"
 game_concept_jewish_derived_faiths_desc_ingame: "Muy pocos [characters|E] dentro del $pod_wod$ practican una forma reconocible de judaísmo y en su lugar practican [faiths|E] derivadas de versiones más familiares. En [princes_of_darkness|E], estas [faiths|E] son:\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('derechchaim').GetName]\n$BULLET_WITH_TAB$@supehunter_icon! [GetFaithByKey('judge').GetName]"
 game_concept_jewish_derived_faiths_desc_outofgame: "Muy pocos [characters|E] dentro del $pod_wod$ practican una forma reconocible de judaísmo y en su lugar practican [faiths|E] derivadas de versiones más familiares. En [princes_of_darkness|E], estas [faiths|E] son:\n$BULLET_WITH_TAB$@vampire_icon! $derechchaim$\n$BULLET_WITH_TAB$@supehunter_icon! $judge$"
 
 game_concept_jerusalem_unique_decisions: "Decisiones de Jerusalén"
 game_concept_jerusalem_unique_decisions_desc: "[SelectLocalization( IsInGame, 'game_concept_jerusalem_unique_decisions_desc_ingame', 'game_concept_jerusalem_unique_decisions_desc_outofgame' )]"
 game_concept_jerusalem_unique_decisions_desc_ingame: "Una criatura de gran poder yace dentro de un pozo cuya boca se puede encontrar en Ketef Hinnom. Muchas voces contradictorias emanan del Pozo, quizás otorgando alguna visión. Estas voces tocan tanto a mortales como a sobrenaturales, llevando a muchos en el área a la manía religiosa y la histeria. Aquí hay un resumen de las decisiones disponibles:\n$BULLET_WITH_TAB$#V $supehunter_purify_jerusalem_pit_decision$#!: Disponible para un [GetTrait('supehunter').GetName(GetNullCharacter)] de la [religion|E] [GetReligionByKey ('hunters_religion').GetAdjective]\n$BULLET_WITH_TAB$#V $malkavian_search_for_sister_decision$#!: Disponible para un [GetTrait('malkavian').GetName (GetNullCharacter)] para buscar a alguien importante para...\n$BULLET_WITH_TAB$#V $malakaite_mistress_boon_decision$#!: Disponible para un [GetTrait ('vampire').GetName(GetNullCharacter)], [GetTrait('revenant').GetName(GetNullCharacter)] o [GetTrait('ghoul').GetName(GetNullCharacter)] de la [faith|E] [GetFaithByKey('eyesofmalakai').GetName] para solicitar ayuda a tu Amo en completar tu misión\n$BULLET_WITH_TAB$#V $molochite_maintain_the_sleep_decision$#!: Disponible para un [GetTrait('vampire').GetName(GetNullCharacter)] de la [house|E] [GetDynastyHouseByID ('house_moloch').GetName] para descremar conocimiento mientras profundizas el sueño del Durmiente\n$BULLET_WITH_TAB$#V $nergalite_wake_the_sleeper_decision$#!: Disponible para un [GetTrait('witch').GetName(GetNullCharacter)] o un [GetTrait('witch').GetName (GetNullCharacter)] [GetTrait('vampire').GetName(GetNullCharacter)] o para un [GetTrait('vampire').GetName(GetNullCharacter)] de la [house|E] [GetDynastyHouseByID('house_nergal').GetName] o [GetDynastyHouseByID('house_angellisater').GetName]. Hay recompensas por ayudar a tales criaturas. \n$BULLET_WITH_TAB$#V $vamp_lower_gen_jerusalem_decision$#!: Disponible para un [GetTrait('vampire').GetName(GetNullCharacter)] sin una decisión única para reducir tu [Glossary('Generation','game_concept_vampgeneration_desc')], pero cuidado con el precio\n$BULLET_WITH_TAB$#V $mummies_tap_web_faith_decision$#!: Disponible para un [GetTrait('shemsuheru').GetName(GetNullCharacter)], [GetTrait('cabiri').GetName(GetNullCharacter)] o [GetTrait('banemummy').GetName (GetNullCharacter)] [GetTrait('mummy').GetName(GetNullCharacter)] mientras aprovechan la Red de Fe para obtener experiencia adicional en Hekau\n$BULLET_WITH_TAB$#V $constantinian_channel_religious_fervor_decision$#!: Disponible para personajes de sangre feérica de [GetFaithDoctrine ('special_doctrine_fae_constantinians_hostility').GetBaseName] después de completar la [decision|E] Catecismo Constantiniano mientras usan la manía local en su búsqueda de poder"
 game_concept_jerusalem_unique_decisions_desc_outofgame: "Una criatura de gran poder yace dentro de un pozo cuya boca se puede encontrar en Ketef Hinnom. Muchas voces contradictorias emanan del Pozo, quizás otorgando alguna visión. Estas voces tocan tanto a mortales como a sobrenaturales, llevando a muchos en el área a la manía religiosa y la histeria. Aquí hay un resumen de las decisiones disponibles:\n$BULLET_WITH_TAB$#V $supehunter_purify_jerusalem_pit_decision$#!: Disponible para un [GetTrait('supehunter').GetName(GetNullCharacter)] de la [religion|E] $hunters_religion_adj$\n$BULLET_WITH_TAB$#V $malkavian_search_for_sister_decision$#!: Disponible para un [GetTrait('malkavian').GetName(GetNullCharacter)] para buscar a alguien importante para...\n$BULLET_WITH_TAB$#V $malakaite_mistress_boon_decision$#!: Disponible para un [GetTrait('vampire').GetName (GetNullCharacter)], [GetTrait('revenant').GetName(GetNullCharacter)] o [GetTrait('ghoul').GetName(GetNullCharacter)] de la [faith|E] $eyesofmalakai$ para solicitar ayuda a tu Amo en completar tu misión\n$BULLET_WITH_TAB$#V $molochite_maintain_the_sleep_decision$#!: Disponible para un [GetTrait('vampire'). GetName(GetNullCharacter)] de la [house|E] $dynn_moloch$ para descremar conocimiento mientras profundizas el sueño del Durmiente\n$BULLET_WITH_TAB$#V $nergalite_wake_the_sleeper_decision$#!: Disponible para un [GetTrait('witch').GetName(GetNullCharacter)] o un [GetTrait('witch').GetName (GetNullCharacter)] [GetTrait('vampire').GetName(GetNullCharacter)] o para un [GetTrait('vampire').GetName(GetNullCharacter)] de la [house|E] $dynn_nergal$ o $dynn_angellisater$. Hay recompensas por ayudar a tales criaturas.\n$BULLET_WITH_TAB$#V $vamp_lower_gen_jerusalem_decision$#!: Disponible para un [GetTrait('vampire').GetName(GetNullCharacter)] sin una decisión única para reducir tu [Glossary('Generation','game_concept_vampgeneration_desc')], pero cuidado con el precio\n$BULLET_WITH_TAB$#V $mummies_tap_web_faith_decision$#!: Disponible para un [GetTrait('shemsuheru').GetName(GetNullCharacter)], [GetTrait('cabiri').GetName(GetNullCharacter)] o [GetTrait('banemummy').GetName(GetNullCharacter)] [GetTrait('mummy').GetName(GetNullCharacter)] mientras aprovechan la Red de Fe para obtener experiencia adicional en Hekau\n$BULLET_WITH_TAB$#V $constantinian_channel_religious_fervor_decision$#!: Disponible para personajes de sangre feérica de $special_doctrine_fae_constantinians_hostility_name$ después de completar la [decision|E] Catecismo Constantiniano mientras usan la manía local en su búsqueda de poder"
 
 game_concept_POD_homeland: "Tierra Natal"
 game_concept_POD_homeland_desc: "Una #bold Tierra Natal#! es una [region|E] de la que se originan ciertos $POD_splat_mummy_plural$, recordándoles tiempos pasados.\n\nCada año, los $POD_splat_mummy_plural$ ganan #P +1#! de [trait_level_track_xp|E] de Memoria si están en su tierra natal.\n\nTierras Natales:\n$BULLET_WITH_TAB$[GetTrait('shemsuheru').GetName(GetPlayer)] - [GetGeographicalRegion('pod_lands_of_faith').GetName]\n$BULLET_WITH_TAB$[GetTrait ('cabiri').GetName(GetPlayer)] - [GetGeographicalRegion('POD_region_greece').GetName]\n$BULLET_WITH_TAB$[GetTrait('wutian').GetName(GetPlayer)] - Reino Medio ([GetGeographicalRegion('world_asia').GetName])\n\nOtras Momias no tienen tierra natal y no obtienen ningún beneficio de ella."
 
 game_concept_POD_tomb_raid: "Saqueo de Tumba"
 game_concept_POD_tomb_raids: "Saqueos de Tumbas"
 game_concept_POD_tomb_raid_desc: "#bold Los Saqueos de Tumbas#! son eventos ocasionales en los que tu [domicile|E] es atacado por aventureros codiciosos. \n\nPuedes intentar salvar tu tumba mediante una prueba de [skill|E] o gastando [gold|E], [prestige|E] y [piety|E]. Si fallas, un edificio aleatorio de tu tumba será degradado y perderás [trait_level_track_xp|E] de Memoria además de ganar [stress|E]."
 
 game_concept_POD_health_track: "Segundo de Salud"
 game_concept_POD_damage: "Daño"
 game_concept_POD_health_track_desc: "El #bold Seguimiento de Salud#! es un concepto tomado directamente del juego de mesa, donde tu [health|E] se mostraba como un cierto número de casillas. Cada vez que resultas herido, marcas una de las casillas.\n\nLas casillas del seguimiento de salud se muestran en la información sobre herramientas de [traits|E] de lesión como [GetTrait('wounded_1').GetName(GetNullCharacter)], y se marcan así:\n\n$TAB$$POD_damage_box$ [POD_superficial_damage|E]\n$TAB$$POD_aggravated_damage_box$ [POD_aggravated_damage|E]\n$TAB$$POD_undamaged_box$ Sin daño\n\nLa longitud total de tu seguimiento de salud se basa en tu [splat|E].\n\nA medida que recibes más daño, te vuelves #bold Deteriorado#!, lo que resulta en penalizaciones cada vez peores para tus [skills|E]. El nivel de deterioro se basa en cuántas casillas están llenas (independientemente del tipo de daño).\n\nSi todas las casillas de salud están llenas, con la mitad o más siendo [POD_aggravated_damage|E], #N mueres#!. Los personajes inmortales entran en $pod_torpor$ en su lugar."
 
 game_concept_POD_superficial_damage: "Daño Superficial"
 game_concept_POD_superficial_damage_with_box: " @health_track_damage_icon! Daño Superficial"
 game_concept_POD_superficial_damage_desc: "#bold El Daño Superficial#! es uno de los tipos de daño que se marcan en tu [POD_health_track|E]. Aparece como el icono @health_track_damage_icon!.\n\nLa mayoría de los [splats|E] curarán naturalmente #V 1#! daño superficial cada #V 2 años#!. Ciertos rasgos y ventajas pueden aumentar la cantidad curada o reducir ese tiempo de reutilización. Los $POD_splat_vampire_plural$ tienen que usar el [character_interaction| E] #V Curar con Sangre#!.\n\nSi tu [POD_health_track|E] ya está lleno y recibes más daño superficial, se convierte en [POD_aggravated_damage|E] en su lugar. \n\nEl daño superficial también puede ser [soaked|E] con ciertas habilidades, dándote un porcentaje de probabilidad de evitar todas las heridas entrantes."
 
 game_concept_POD_aggravated_damage: "Daño Agravado"
 game_concept_POD_aggravated_damage_with_box: " @health_track_aggravated_damage_icon! Daño Agravado"
 game_concept_POD_aggravated_damage_desc: "#bold El Daño Agravado#! es uno de los tipos de daño que se marcan en tu [POD_health_track|E]. Aparece como el icono @health_track_aggravated_damage_icon!.\n\nEl Daño Agravado es mucho más difícil de curar que el [POD_superficial_damage|E]. La mayoría de los splats 'reducen' naturalmente una casilla de daño agravado a [POD_superficial_damage|E] cada #V 4 años#!.\n\nSi todas las casillas de salud están llenas, con la mitad o más siendo [POD_aggravated_damage|E], #N mueres#!. Los personajes inmortales entran en $pod_torpor$ en su lugar."
 
 game_concept_soak_damage: "Absorber"
 game_concept_soaked: "Absorbido"
 game_concept_soaking: "Absorbiendo"
 game_concept_soak_chance: "Probabilidad de Absorber"
 game_concept_soak_damage_desc: "Algunos poderes y [perks|E] pueden darte una probabilidad de absorber el [POD_superficial_damage|E] entrante, lo que significa que el daño no se aplicará.\n\nUsar un [artifact|E] de armadura es la forma más fácil de obtener una probabilidad de absorber, ya que cada nivel de [rarity|E] de la armadura añade #V 10%#!."
 
 game_concept_fetish: "Fetish"
 game_concept_fetishes: "Fetishes"
 game_concept_fetish_artifact_icon: "@gnosis_icon!"
 game_concept_fetish_artifact_wyrm_icon: "@wyrm_icon!"
 game_concept_fetish_desc: "Un Fetish es un [artifact|E] que ha sido imbuido con un espíritu vinculado. Todos los $glossary_fera$ pueden usarlos naturalmente, otros [splats|E] requerirán ventajas o modificadores especiales.\n\nA diferencia de los artefactos normales, los Fetishes requieren mantenimiento para permanecer activos:\n$BULLET_WITH_TAB$$glossary_fera$: 5% de $POD_terrain_gnosis_regen_supply_limit_mult$ cada uno. \n$BULLET_WITH_TAB$Otros: Un [spirit_companion|E] cada uno.\nSi no puedes mantenerlos, todos los artefactos fetish se desactivarán.\n\nPoder equipar fetishes desbloquea automáticamente el nodo de [crafting_forging|E] [fetish_smithing|E]."
 
 game_concept_fetish_smithing: "Forja de Fetishes"
 game_concept_fetish_smithing_desc: "El acto de vincular un [GetTrait('spirit').GetName(GetNullCharacter)] a un [artifact|E]. Este nodo vinculará un [spirit_companion|E] o un Espíritu encarcelado a un artefacto y lo convertirá en un [fetish|E].\n\nLos efectos de este nodo dependen de:\n$BULLET_WITH_TAB$ [spirit_language|E] del Espíritu vinculado\n$BULLET_WITH_TAB$[education_trait|E]\n$BULLET_WITH_TAB$[physical_traits|E]\n$BULLET_WITH_TAB$ [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Ventajas o modificadores relevantes del Artesano"
 
 game_concept_spirit_companion: "Compañero Espíritu"
 game_concept_spirit_companions: "Compañeros Espíritu"
 game_concept_companion: "Compañero"
 game_concept_spirit_pact: "Pacto Espiritual"
 game_concept_spirit_pacts: "Pactos Espirituales"
 game_concept_spirit_companion_desc: "Un Compañero Espíritu es una relación especial que se puede establecer con un [GetTrait('spirit').GetName (GetNullCharacter)] dispuesto mediante [character_interaction|E]. El Espíritu se unirá a tu corte y proporcionará una variedad de beneficios:\n$BULLET_WITH_TAB$Otorga un modificador de Pacto único dependiendo de su tipo\n$BULLET_WITH_TAB$Aumenta $POD_terrain_gnosis_regen_supply_limit_mult$\n$BULLET_WITH_TAB$Aumenta la velocidad del [journey|E] de Búsqueda Espiritual\n$BULLET_WITH_TAB$Se utiliza en [fetish_smithing|E]\n\nLos Compañeros Espíritu ganan [trait_level_track_xp|E] solo a través de [Concept('character_interaction','Interacciones de Personaje')|E] dirigidas a ellos."
 
 game_concept_spirit_language: "Lenguaje Espiritual"
 game_concept_ancestral_tongue: "Lengua Ancestral"
 game_concept_spirit_language_desc: "Antes de que puedas interactuar con un [GetTrait('spirit').GetName(GetNullCharacter)], primero debes aprender su idioma, lo que se puede hacer mediante [character_interaction|E].\n\nLos idiomas de los [ancestor_spirits|E] (como la Lengua Primigenia) son inherentes a los $glossary_fera$ y no pueden ser aprendidos por otros a través de medios normales."
 
 game_concept_ancestor_spirit: "Espíritu Ancestral"
 game_concept_ancestor_spirits: "Espíritus Ancestrales"
 game_concept_ancestor_spirit_desc: "Los $glossary_fera$ tienen la posibilidad de convertirse en un [GetTrait('spirit').GetName(GetNullCharacter)] Ancestral al morir. Estos Espíritus solo pueden comunicarse en la [ancestral_tongue|E] de su raza Fera y normalmente no pueden aumentar su Rango Espiritual.\n\nLa probabilidad de convertirse en Espíritu está dictada principalmente por el Rango ([trait_level_track_xp|E]) y el [piety_level|E] del $glossary_fera$. Los personajes [lowborn|E] no pueden convertirse en Espíritus."
 
 game_concept_innocent: "Inocente"
 game_concept_innocents: "Inocentes"
 game_concept_tormentor: "Atormentador"
 game_concept_tormentors: "Atormentadores"
 game_concept_innocent_desc: "Muchos [GetTrait('mokole').GetName(GetNullCharacter)] no logran reprimir sus emociones cuando encuentran recuerdos oscuros durante su Mnesis, los Inocentes son el resultado. Estas emociones negativas se fusionan en un [GetTrait('spirit').GetName(GetNullCharacter)] maligno que busca destruir tanto a su creador como a todos los demás Mokolé.\n\nSe puede encontrar a los Inocentes en los mismos lugares donde aparecen otros espíritus y también se les puede invocar normalmente.\nSin embargo, los Mokolé deben tener especial cuidado. Mientras un Mokolé está estacionado en la [umbra|E], existe la posibilidad de que sea atacado por estos Inocentes. El [umbra_sense|E] puede reducir la probabilidad de ataques, sin embargo, estos ataques son más frecuentes en el [UmbraGlossary('spirit_wilds')]. Algunos ataques son especialmente mortales y el Inocente puede obsesionarse con ese Mokolé en particular. Si esto sucede, el Inocente se aferrará a su objetivo y se convertirá en su Atormentador.\n\nLos Atormentadores Inocentes son una relación especial que atormentará constantemente a su víctima de diversas maneras. La única forma de liberarse es desterrarlos con un [character_interaction|E]."
 
 game_concept_diabolism: "Diabolismo"
 game_concept_diabolist: "Diabolista"
 game_concept_diabolism_bind: "Vincular"
 game_concept_diabolism_binding: "Vinculación"
 game_concept_diabolism_desc: "#bold El Diabolismo#! es una de las dos formas de ganar [investiture_lifestyle|E] (la otra es [thralldom|E]). No contento con ser un esclavo de los $POD_splat_demon_plural$, el Infernalista usa un ritual de vinculación para invertir esta dinámica y esclavizar a los Demonios en su lugar, tomando su poder por la fuerza.\n\nVincular Demonios requiere conocimiento de [GetTrait('demonology').GetName(GetNullCharacter)], que se puede aprender mediante [journey|E]. La [trait_level_track_xp|E] en Demonología se gana pasivamente cada año. Antes de que puedas intentar la vinculación, también debes aprender el [Glossary('True Name','podgloss.truename')] del Demonio. Todo esto hace que el Diabolismo sea un proceso lento. Además, los Demonios resienten mucho estar vinculados y tomarán represalias con actos de [demonic_sabotage|E].\n\nUna vez que tienes éxito en la vinculación, ganas puntos de [perk|E] de [investiture_lifestyle|E] basados en la suma de las [skills|E] del Demonio."
 
 game_concept_demonic_sabotage: "Sabotaje"
 game_concept_demonic_sabotage_desc: "Los $POD_splat_demon_plural$ que están vinculados a un [diabolist|E] no están muy contentos con ese resultado, y aunque no pueden matar directamente a su nuevo amo, eso no significa que no puedan hacer su vida un poco más miserable.\n\nEn [princes_of_darkness|E], cada año los demonios vinculados pueden intentar un sabotaje. Si tienen éxito, pueden infligir un [modifier|E] negativo, causar algo de [POD_superficial_damage| E], quitar algo de [prestige|E] o [gold|E], o incluso matar a un [courtier|E] aleatorio."
 
 game_concept_thralldom: "Esclavitud"
 game_concept_thralldom_desc: "#bold La Esclavitud#! es una de las dos formas de ganar [investiture_lifestyle|E] (la otra es [diabolism|E]). El Infernalista redacta un [demonic_pact|E] con un $POD_splat_demon$, vendiendo su alma a cambio de poder. Esto solo requiere conocimiento básico de [GetTrait ('demonology').GetName(GetNullCharacter)], que se puede aprender mediante [journey|E]. Los personajes que ya son #TOOLTIP:GAME_TRAIT,witch, [GetNullCharacter] #L Infernalistas#!#! o siguen una [faith|E] de adoración demoníaca pueden hacerlo de inmediato.\n\nNo hay límite en la cantidad de [demonic_pacts|E] que puedes firmar, lo que hace que esta sea una forma fácil de ganar mucho poder en poco tiempo. Excepto, por supuesto, por la parte en la que debes cumplir con los términos del contrato.\n\nFirmar un Pacto también le da al Demonio un [strong_hook|E] sobre ti y te convierte a su [faith|E]. \n\nEn los marcadores donde los Demonios no existen en el mapa como [splat|E] jugable, puedes usar [GetTrait('demonology').GetName(GetNullCharacter)] para realizar un [demonic_summoning|E]."
 
 game_concept_demonic_pact: "Pacto"
 game_concept_demonic_pact_obligation: "Obligación"
 game_concept_demonic_pact_frequency: "Frecuencia"
 game_concept_demonic_pact_the_fine_print: "La Letra Pequeña"
 game_concept_demonic_pacts: "Pactos"
 game_concept_demonic_pact_desc: "#bold Los Pactos#! son los términos y condiciones de la [thralldom|E]. Firmas Pactos con un [character_interaction|E] en $POD_splat_demon_plural$.\n\nCada Pacto tiene tres estipulaciones:\n$BULLET_WITH_TAB$#bold Obligación#! - Una acción específica que un esclavo #italic debe#! hacer, o #italic no puede#! hacer.\n$BULLET_WITH_TAB$#bold Frecuencia#! - Una fecha límite recurrente que se le da al esclavo para cumplir con la #bold Obligación#!, que va desde cada #V 20#! años hasta cada #V 4#! años.\n$BULLET_WITH_TAB$#bold La Letra Pequeña#! - Una penalización o castigo si no puedes o no cumpliste con tu #bold Obligación#! en la #bold Frecuencia#! dada.\n\nCada estipulación tiene un valor. Al firmar el pacto, ganas puntos de [perk|E] de [investiture_lifestyle|E] iguales al valor total del pacto. Este pago ocurre solo #bold una vez#! por Pacto.\n\nUna vez firmado, un Pacto está #X inscrito en tu alma, para siempre#!. Incluso si el $POD_splat_demon$ es posteriormente vinculado, desterrado o asesinado, sus Pactos permanecerán."
 
 game_concept_demonic_summoning: "Invocación Demoníaca"
 game_concept_demonic_summoning_desc: "Un [character_interaction|E] desbloqueado en #V 5#! [trait_level_track_xp|E] de [GetTrait('demonology').GetName (GetNullCharacter)].\n\nEl invocador sacrifica a varios [prisoners|E] para tener la oportunidad de invocar a un $POD_splat_demon$ del [UmbraGlossary('abyss')]. El Demonio se une a tu corte y puede o no ser amistoso. Entonces puedes convertirte en su [Concept('thralldom','Esclavo')|E] firmando un [demonic_pact|E] con él, o intentar [diabolism_bind|E]lo.\n\nPuedes apuntarte a ti mismo para invocar a un Demonio aleatorio, o apuntar a un personaje $POD_splat_demon$ que esté [GetModifier('trapped_in_abyss_modifier').GetNameWithTooltip] para invocarlo específicamente."
 
 game_concept_POD_banish: "Desterrar"
 game_concept_POD_banish_desc: "Un [character_interaction|E] desbloqueado a través de varios medios, como [GetTrait('demonology').GetName(GetNullCharacter)] o #TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Teurgia#!#!. Permite al usuario desterrar ciertos [splats|E] de otro mundo a sus reinos de origen en la [umbra|E], lo que los despoja de todos sus [titles|E] y los neutraliza efectivamente. Por lo general, esto requiere aprender su [Glossary('True Name', 'podgloss.truename')] primero, pero algunas habilidades omiten ese requisito.\n\nEstos splats pueden ser potencialmente desterrados:\n$BULLET_WITH_TAB$#bold $POD_splat_demon_plural$#! pueden ser desterrados al [UmbraGlossary('abyss')]\n$BULLET_WITH_TAB$#bold $POD_splat_fae_plural$#! pueden ser desterrados a [UmbraGlossary('arcadia')]\n$BULLET_WITH_TAB$#bold $POD_splat_wraith_plural$#! pueden ser desterrados a su [Glossary('Dark Kingdom','game_concept_dark_kingdom_desc')] nativo"
 
 game_concept_weaken_demon: "Debilitar Demonio"
 game_concept_weaken_demon_desc: "Un [character_interaction|E] desbloqueado en #V 50#! [trait_level_track_xp|E] de [GetTrait('demonology').GetName (GetNullCharacter)].\n\nEl demonólogo recuerda los castigos que Dios impuso a la hueste caída y evoca sus recuerdos traumáticos en un $POD_splat_demon$ desprevenido. Esto reduce las [skills|E] del Demonio durante cinco años. Dado que el [journey|E] del [Glossary('True Name','podgloss.truename')] es más rápido en objetivos con habilidades bajas, esto puede facilitar el [diabolism_bind|E] del Demonio.\n\nEn #V 50#! [trait_level_track_xp|E], la interacción inflige [GetModifier('POD_weaken_demon_modifier').GetNameWithTooltip]. En #V 75#! [trait_level_track_xp|E], se mejora a [GetModifier ('POD_massively_weaken_demon_modifier').GetNameWithTooltip]."
 
 game_concept_ghoul_vitae_dependency: "Dependencia de Vitae"
 game_concept_ghoul_vitae_dependency_desc: "Cada [EmptyScope.ScriptValue('POD_years_to_lose_vitae_passively_base')|V0] años, los [ghouls|E] jugadores #N ganan#! #bold;V 1#! [hunger_with_icon|E]. Los Ghouls muy viejos ganan hambre más lentamente.\n\nLos [masterless_ghouls|E] que alcanzan #TOOLTIP:STATIC_MODIFIER,bloodhunger5_modifier #N;L Hambre de Sangre 5#!#! #N dejarán de ser Ghouls por completo, volviendo a ser [GetTrait('mortal'). GetName(GetNullCharacter)] y perdiendo todas sus [Glossary('Disciplines','game_concept_discipline_desc')].#!\n\nLos [bound_ghouls|E] pueden permanecer con hambre máxima indefinidamente, ya que su [Glossary('Domitor','game_concept_domitor_desc')] los mantiene vivos.#!"
 
 game_concept_ghoul_discipline_limit: "Limitaciones de Disciplina"
 game_concept_ghoul_greatest_vitae_ingested: "Mayor Vitae Ingerida"
 game_concept_ghoul_discipline_limit_desc: "Tanto los [ghouls|E] como los [Glossary('Revenants','game_concept_revenant_desc')] tienen ciertas limitaciones para las [Glossary('Disciplines','game_concept_discipline_desc')] además de la total incapacidad para obtener [elder_perks|E].\n\nLas [Glossary('Disciplines','game_concept_discipline_desc')] para los [ghouls|E] están limitadas a cierto nivel según la $pod_vitae$ que ingirieron en su vida. Cuanto menor sea la generación que ingirieron, mayor será el nivel de [perks|E] que pueden obtener:$game_concept_ghoul_discipline_limit_levels_generation$\nLo que importa es la [Glossary('Generation','game_concept_vampgeneration_desc')] #V más baja#! que ingirieron, no la más reciente.\n\nLos [Glossary('Revenants', 'game_concept_revenant_desc')] son menos complejos, no pueden obtener [traits|E] de [Glossary('Discipline','game_concept_discipline_desc')] Avanzada sin convertirse en un [ghoul|E] y seguir sus reglas para obtenerla. En términos más simples, siempre podrán obtener [perks|E] de nivel 1-[EmptyScope.ScriptValue ('POD_discipline_limit_for_revenant')] independientemente de cualquier otra cosa.\n\nDebido a la naturaleza de [GetTrait('bloodsorcery').GetName (GetNullCharacter)] y [GetTrait('necromancy').GetName(GetNullCharacter)], ambas están exentas de las Limitaciones de Disciplina."
 game_concept_ghoul_discipline_limit_levels_generation: "\n$BULLET_WITH_TAB$9+ [Glossary('Generation','game_concept_vampgeneration_desc')]: 1er nivel\n$BULLET_WITH_TAB$8° [Glossary('Generation','game_concept_vampgeneration_desc')]: 2° nivel\n$BULLET_WITH_TAB$7° [Glossary('Generation', 'game_concept_vampgeneration_desc')]: 3° nivel\n$BULLET_WITH_TAB$6° [Glossary('Generation','game_concept_vampgeneration_desc')]: 4° nivel\n$BULLET_WITH_TAB$5° [Glossary('Generation','game_concept_vampgeneration_desc')]: 5° nivel\n$BULLET_WITH_TAB$4° [Glossary('Generation', 'game_concept_vampgeneration_desc')]: [trait|E] Avanzado"
 
 game_concept_bound_ghoul: "Ghoul Vinculado"
 game_concept_bound_ghouls: "Ghouls Vinculados"
 game_concept_bound_ghoul_desc: "#help La gran mayoría de los ghouls están vinculados a un vampiro, su domitor. Este vampiro les proporciona sangre, convirtiéndolo rápidamente en una adicción severa que hará que el ghoul haga cualquier cosa para complacer a su amo y recibir más.#!\n\nEn [princes_of_darkness|E], cualquier [ghoul|E] que tenga un [Glossary('Domitor','game_concept_domitor_desc')] se considera un #bold Ghoul Vinculado#!.\n\nLos Ghouls Vinculados deben completar [bound_ghoul_missions_with_icon|E] para su [Glossary('Domitor','game_concept_domitor_desc')] regularmente, quien calma su [hunger_with_icon|E] como recompensa. A diferencia de los [masterless_ghouls|E], los Ghouls Vinculados no enfrentan consecuencias por alcanzar el máximo de hambre. Sin embargo, si la opinión de su Domitor cae por debajo de #N -25#!, serán asesinados en la próxima misión fallida.\n\nLos Ghouls Vinculados pueden convertirse en [masterless_ghouls|E] mediante [bound_ghoul_breaking_blood_bond|E]."
 
 game_concept_bound_ghoul_mission: "Misión"
 game_concept_bound_ghoul_missions: "Misiones"
 game_concept_bound_ghoul_mission_with_icon: "@ghoul_icon!Misión"
 game_concept_bound_ghoul_missions_with_icon: "@ghoul_icon!Misiones"
 game_concept_bound_ghoul_mission_desc: "Las Misiones son la única forma para que un [bound_ghoul|E] obtenga $pod_vitae$ para las [Glossary('Disciplines', 'game_concept_discipline_desc')]. El [Glossary('Domitor','game_concept_domitor_desc')] de un [bound_ghoul|E] emitirá una nueva misión cada [EmptyScope. ScriptValue('POD_years_to_gain_new_mission')|V0] años. También puedes solicitar una nueva Misión con un [character_interaction|E].\n\nLas Misiones pueden variar desde completar un [journey|E], secuestrar a un [character|E] específico o simplemente entregar algunos recursos como [gold|E].\n\nDespués de que una misión es #P completada#!, un [bound_ghoul|E] ganará [EmptyScope.ScriptValue('POD_vitae_gained_from_completed_mission')|V0] de $pod_vitae$ para su propio uso.\n\n#N Fallar#! una misión reduce la opinión de tu Domitor hacia ti. Si alguna vez cae por debajo de #N -25#!, puedes esperar ser desechado #weak (asesinado)#!."
 
 game_concept_bound_ghoul_breaking_blood_bond: "Rompiendo el Vínculo de Sangre"
 game_concept_bound_ghoul_breaking_blood_bond_desc: "Si logras completar el [journey|E] #V $breaking_the_blond_bond_name$#! sin sufrir ningún [mental_breaks| E] en el camino, el [strong_hook|E] de tu [Glossary('Domitor','game_concept_domitor_desc')] será reemplazado por uno débil. Esto te permite huir de tu amo con un [character_interaction|E] o [GetScheme('murder').GetTypeName]lo si te sientes inclinado."
 
 game_concept_masterless_ghoul: "Ghoul Sin Amo"
 game_concept_masterless_ghouls: "Ghouls Sin Amo"
 game_concept_masterless_ghoul_desc: "#help Raros y valientes (o necios) son los ghouls sin amo. La adicción fatal a la sangre no se preocupa por la libertad y debe ser saciada, forzando a estas pobres almas a trabajar para varios vampiros para obtener su dosis o, aún más peligroso, intentar cazar a sus antiguos amos directamente.#!\n\nEn [princes_of_darkness|E], cualquier [ghoul|E] que #bold no#! tenga un [Glossary('Domitor','game_concept_domitor_desc')] se considera #bold Sin Amo#!.\n\nLos Ghouls Sin Amo necesitan buscar sangre constantemente para contrarrestar su [ghoul_vitae_dependency|E]. Si alguna vez alcanzan #TOOLTIP:STATIC_MODIFIER,bloodhunger5_modifier #N;L Hambre de Sangre 5#!#!, #N dejarán de ser Ghouls por completo, volviendo a ser [GetTrait ('mortal').GetName(GetNullCharacter)] y perdiendo todas sus [Glossary('Disciplines','game_concept_discipline_desc')].#!\n\nHay dos formas de obtener $pod_vitae$. La primera es apuntar a cualquier $POD_splat_vampire$ sin tierras con el [journey|E] #V $hunt_target_name$#!. La segunda es [masterless_ghoul_imprisoned_drinking|E]. Ambas conllevan riesgos, ya que las víctimas harán todo lo posible por defenderse."
 
 game_concept_masterless_ghoul_imprisoned_drinking: "Beber de Vampiros Encarcelados"
 game_concept_masterless_ghoul_imprisoned_drinking_desc: "Los [masterless_ghouls|E] pueden consumir $pod_vitae$ de $POD_splat_vampire_plural$ [imprisoned| E], y aunque esto pueda sonar mucho mejor que cazarlos, también conlleva sus propios riesgos.\n\nBeber de $POD_splat_vampire_plural$ siempre crea un [Glossary('Blood Bond','game_concept_bloodbond_desc')] para los [ghouls|E], lo que significa que si uno bebe continuamente del mismo objetivo, sucumbirá tarde o temprano.\n\nAl beber de un $POD_splat_vampire$ [imprisoned|E], se creará el [Glossary('Blood Bond','game_concept_bloodbond_desc')] más débil durante [EmptyScope.ScriptValue('POD_duration_for_soft_cooldown_drinking')|V0] años durante los cuales no podrás matarlo. #bold Si bebes de él nuevamente durante este período#! correrás el riesgo de que escape de la [prison|E] o peor, que te maten o te conviertas en un [bound_ghoul|E].\n\nCada $POD_splat_vampire$ tiene un límite de cuánto puedes beber antes de que muera, representado por no tener [GetModifier('bloodhunger5_modifier'). GetNameWithTooltip]."
 
 game_concept_pack_totem: "Tótem de Manada"
 game_concept_pack_totem_desc: "Un tótem es un espíritu potente que presta su poder a un grupo de $glossary_fera$ a cambio de algún servicio o tributo simbólico. Se puede elegir un tótem en el [journey|E] #bold Entrenar con tu [coterie|E]#! mientras tienes una [coterie|E] completa.\nEsta elección es permanente y afecta a todos los miembros de la [coterie|E]."
 
 #TODO Poseído: Explicar las otras cosas si es necesario. idk necesita rework primero.
 game_concept_possession: "Posesión"
 game_concept_possess: "Poseer"
 game_concept_possessed: "Poseído"
 game_concept_possession_desc: "Los Poseídos son mortales o sobrenaturales que han sido poseídos permanentemente por un poderoso [GetTrait('spirit').GetName (GetNullCharacter)] de Gaia o la $glossary_triat$.\n\nConvertirse en un [GetTrait('fomori').GetName(GetNullCharacter)] se logra solicitando a un [spirit_companion|E] Bane que te posea."
 
 game_concept_wyrm_taint: "Marca del Wyrm"
 game_concept_wyrm_tainted: "Marcado por el Wyrm"
 game_concept_wyrm_taint_desc: "La Marca del Wyrm representa lo cerca que está un $glossary_fera$ de Gaia de caer ante el $glossary_wyrm$.\n\nEste valor cambia anualmente dependiendo de los [traits|E], [perks|E] y otras mecánicas relevantes de un personaje. Muchas acciones también pueden aumentar directamente este valor, como ser torturado, ejecutar inocentes, asociarse con sirvientes del Wyrm, etc.\n\nLa cantidad de Marca del Wyrm que tiene un personaje se muestra en su barra lateral."
 
 game_concept_balefire: "Fuego Infernal"
 game_concept_balefires: "Fuegos Infernales"
 game_concept_balefire_desc: "El Fuego Infernal es una forma contaminada de fuego, una llama verde impía alimentada por la corrupción del $glossary_wyrm$. Estas llamas son extremadamente mortales, su [POD_aggravated_damage|E] tarda más en curarse naturalmente y es más difícil de curar con la 'Curación de Sangre' de un [GetTrait('vampire').GetName(GetNullCharacter)]."
 
 game_concept_fleshcraft: "Esculpir Carne"
 game_concept_fleshcrafting: "Esculpir Carne"
 game_concept_fleshcrafted: "Carne Esculpida"
 game_concept_fleshcraft_desc: "Esculpir Carne es un poder invasivo que modifica y, en algunos casos, reforma completamente la apariencia física y las habilidades de una persona. Es el principio básico y el poder de la $pod_discipline$ [GetTrait('vicissitude').GetName(GetNullCharacter)].\n\nA través de Esculpir Carne, lo siguiente está disponible dependiendo de tus ventajas y habilidades:\n$BULLET_WITH_TAB$Cambiar la apariencia.\n$BULLET_WITH_TAB$Cambiar la edad visual de un inmortal.\n$BULLET_WITH_TAB$Modificar [physical_traits|E]\n$BULLET_WITH_TAB$Modificar partes del cuerpo individuales para añadir características como [GetPerk('fc_head_third_eye_perk').GetName(GetNullCharacter)] o [GetPerk('fc_head_extending_fangs_perk').GetName(GetNullCharacter)]"
 
 game_concept_kraina: "Kraina"
 game_concept_krainas: "Krainas"
 game_concept_kraina_desc: "Las Krainas son un subconjunto de [bs_spells|E] y [bs_rituals|E] únicos de la #V Hechicería Koldúnica#!.\n\nA medida que el Koldun gana más [perks|E] en el árbol #V Genius Loci#!, sus Krainas ganan funcionalidad adicional.\nLa probabilidad de éxito siempre está activa, otros efectos, sin embargo, requieren que el Koldun los lance #bold desde#! sus ubicaciones potenciadas. La ubicación del objetivo es irrelevante.\n\nCada Kraina tiene sus propios requisitos enumerados a continuación:\n$BULLET_WITH_TAB$Transilvana: [GetGeographicalRegion('PoD_region_transylvania_kraina').GetName] [region|E]\n$BULLET_WITH_TAB$Mar Negro: [GetGeographicalRegion('PoD_region_black_sea_kraina').GetName] [region|E]\n$BULLET_WITH_TAB$Białowieża: [GetGeographicalRegion('PoD_region_bialowieza_kraina').GetName] [region|E]\n$BULLET_WITH_TAB$Pozo: Cualquiera de los siguientes edificios o sus mejoras:\n$TAB$$BULLET_WITH_TAB$[GetBuilding('land_nexus_01').GetName]\n$TAB$$BULLET_WITH_TAB$[GetBuilding('sanctuary_of_flesh_01').GetName] \n$TAB$$BULLET_WITH_TAB$[GetBuilding('cathedral_of_flesh_01').GetName]\n$TAB$$BULLET_WITH_TAB$[GetBuilding('well_of_sacrifice_01').GetName] \n$BULLET_WITH_TAB$Enoch: #V 40#! o más [development|E]"
 PoD_region_transylvania_kraina: "Kraina de Transilvania"
 PoD_region_black_sea_kraina: "Kraina del Mar Negro"
 PoD_region_bialowieza_kraina: "Kraina de Białowieża"