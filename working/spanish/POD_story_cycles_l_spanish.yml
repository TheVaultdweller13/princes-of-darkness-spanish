l_spanish:
 POD_story_pact: "#glow_color:{0.5,0,0,1} Pacto Demoníaco#!"
 POD_story_pact_desc: "Negociaste por poder.\n¿Valió la pena?"

 #POD_story_pact_demon: "@demon_icon! Demonio"
 POD_story_pact_custom_string: "#font:TitleFont;size:19;glow_color:{0.5,0,0,1} Pacto firmado con [Story.MakeScope.Var('demon').Char.GetFirstName]#!\n#glow_color:{0.25,0,0,75} [demonic_pact_obligation|E]: [Localize(Concatenate('POD_obligation_', Story.MakeScope.GetVariable('obligation').GetFlagKey))|U]\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODPactFrequencyAndStatus')]\nSi #X rompes#! el pacto:\n[GetScriptedGui('POD_sidebar_show_demonic_pacts').BuildTooltip(GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('obligation', MakeScopeFlag(Story.MakeScope.GetVariable('obligation').GetFlagKey)).AddScope('consequence', MakeScopeFlag(Story.MakeScope.GetVariable('consequence').GetFlagKey)).End)]\nEste [demonic_pact|E] vale [Story.MakeScope.GetVariable('perk_points_gained').GetValue|0V] [investiture_lifestyle|E] [perk|E] [Select_CString( EqualTo_CFixedPoint( Story.MakeScope.GetVariable('perk_points_gained').GetValue, '(CFixedPoint)1' ), 'punto', 'puntos' )]#!"

 POD_story_pact_prohibitory: "Estado: #X Prohibitorio#!"
 POD_story_pact_frequency_completed: "[demonic_pact_frequency|E]: Cada [story.MakeScope.GetVariable('frequency').GetValue|0V] años#!\nEstado: #P Completado#!"
 POD_story_pact_frequency_notcompleted: "[demonic_pact_frequency|E]: Cada [story.MakeScope.GetVariable('frequency').GetValue|0V] años#!\nEstado: #N Pendiente#!"
