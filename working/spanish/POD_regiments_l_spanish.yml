 NEED_MASSSIRE_TO_UNLOCK_MAA_TEXT: "#Weak Necesitas usar la [character_interaction|E] Desbloquear [men_at_arms|E] para desbloquear primero los [men_at_arms|E] de tipo vampiro.#!"

 ghouls: "Ghouls Seleccionados"
 ghouls_flavor: "#F Esclavos juramentados de los vampiros, los ghouls son bendecidos con una fuerza y resistencia superiores. Combinados con su inmortalidad (aunque dependiente de la sangre vampírica), son guerreros hábiles.#!"
 
 szlachta: "Szlachta"
 szlachta_flavor: "#F Ghouls moldeados por Vicisitud para aumentar su destreza en combate. Aunque este proceso los hace más poderosos, también están horriblemente deformados.#!"
 
 vozhd: "Vozhd"
 vozhd_flavor: "#F Alrededor de una docena de ghouls lobotomizados se fusionan mediante hechicería koldúnica y Vicisitud, dando como resultado un arma biológica ambulante de 15 pies de altura. Una mezcolanza de seres vivos fusionados en un monstruo del tamaño de un elefante con múltiples extremidades.#!"

 zmei: "Zmei"
 zmei_flavor: "#F Temibles criaturas de inmenso poder, una vez sirvientes del $glossary_wyrm$, ahora están atados a Baba Yaga, la Abuelita.#!"
 
 massvampires: "Vampiros Abrazados en Masa"
 massvampires_flavor: "#R Tamaño Máximo = 3 #! \n #F Una manada de vampiros novatos producidos por un $pod_Embrace$ masivo. La sangre los ha hecho más fuertes que los mortales, pero son nuevos en sus poderes.#!"
 

 
 witchhunters: "Cazadores de Brujas"
 witchhunters_flavor: "#F Mortales que se especializan en cazar monstruos.#!"
 
 wolves_flavor: "#F Pocos sonidos en la naturaleza son más escalofriantes que el aullido de un lobo. De alguna manera, engloba todo lo que la humanidad teme de la naturaleza, así como todo lo que anhelamos.#!"
 
 bats: "Murciélagos"
 bats_flavor: "#F Sobrenaturales y prohibitivos, los murciélagos pasan el día durmiendo boca abajo en árboles y cuevas, y las noches volando en busca de insectos, frutas y, a veces, sangre humana.#!"

 gargoyle_warriors: "Guerreros Gargola"
 gargoyle_warriors_flavor: "#F #!"
 
 gargoyle_sentinels: "Centinelas Gargola"
 gargoyle_sentinels_flavor: "#F #!"

 gargoyle_scouts: "Exploradores Gargola"
 gargoyle_scouts_flavor: "#F #!"

 gargoyle_razorbats: "Murciélagos de Cuchilla"
 gargoyle_razorbats_flavor: "#F #!" 
 
 rats: "Ratas"
 rats_flavor: "#F Las ratas simbolizan la expansión urbana: acumulaciones negligentes de suciedad, enfermedades y secretos, pero también astucia y resistencia. Algunos Garou sienten camaradería con ellas, especialmente algunos hombres lobo urbanos, pero estos roedores también se asocian ocasionalmente con vampiros o hechiceros acechantes y sus familiares. Es indiscutible que las ratas están en todas partes.#!"
 
 scorpions: "Escorpiones"
 scorpions_flavor: "#F Estos arácnidos pueden variar en tamaño desde el pulgar de uno hasta el tamaño de una mano, y administran un poderoso veneno con un rápido movimiento de sus colas enroscadas.#!"
 
 snakes: "Serpientes"
 snakes_flavor: "#F Tentadora, engañadora, abridora de puertas y envenenadora de almas desprevenidas, la serpiente se enrosca, se desliza y muerde en la imaginación humana.#!"
 
 insects: "Insectos"
 insects_flavor: "#F #!"

 maniacs: "Maníacos"
 maniacs_flavor: "#F #!"
 
 demonic_thralls: "Esclavos Demoníacos"
 demonic_thralls_flavor: "#F Esclavos demoníacos, sirviendo a sus horribles amos Baali #!"
 
 #elite_swordsmen: "Espadachines de Élite"
 #elite_swordsmen_flavor: "#F Los espadachines más hábiles, tomados de nobles locales y entrenados para luchar junto a $pod_cainites$ #!"
 
 ghouled_cavalry: "Caballería Ghouleada"
 ghouled_cavalry_flavor: "#F Caballeros ghouls que están listos para luchar contra todos aquellos que sus amos quieran muertos. A menudo también usan monturas ghouleadas en batalla. #!"
 
 guards_guards: "Guardias Ghouleados"
 guards_guards_flavor: "#F Una vez guardias de importantes nobles locales, estos mortales han recibido la sangre para servir a un patrón más grande (y más sombrío). #!"
 
 brigands: "Forajidos Ghouleados"
 brigands_flavor: "#F Una vez en el lado equivocado de la ley, estos mortales tuvieron un encuentro que les cambió la vida con el señor Cainita de su dominio. Sin embargo, esto no los ha convertido realmente en mejores personas, solo más hábiles en lo que hacen.#!"
 
 cultists: "Cultistas"
 cultists_flavor: "#F Mortales devotos de monstruos sobrenaturales y dioses profanos, controlados por $pod_cainites$.#!"
 
 serpentis_monsters: "Bestias Tifónicas"
 serpentis_monsters_flavor: "#F Bestias terribles creadas con la $pod_discipline$ Serpentis, listas para desgarrar y morder.#!"
 
 crowds: "Multitud Controlada"
 crowds_flavor: "#F Una multitud de mortales, que creen que tu causa es justa y están listos para ayudarte.#!"

 musketmen: "Mosqueteros"
 musketmen_flavor: "#F El temible poder de la pólvora está empezando a tener un uso generalizado, poniendo a los mortales en cada vez menos desventaja contra lo sobrenatural.#!"
 
 thinbloods: "Sangre Débil"
 thinbloods_flavor: "#F Vampiros Abrazados en Masa de la 14ª generación, o superior.#!"





 the_lost_ancients: "Los Antiguos Perdidos"
 the_lost_ancients_flavor: "#F Sombras sin forma olvidadas por el universo, llamadas para ayudar a la momia.#!"

 POD_controlled_animals: "Animales Controlados"
 POD_controlled_animals_flavor: "#F Oh Dios, tantas ardillas...#!"

 POD_ronin_hatamoto: "Hatamoto Ronin del Daimyo"
 POD_ronin_hatamoto_flavor: "#F Caballería mortal de élite, mejorada por tu poder y totalmente dedicada a tu causa.#!"
 POD_ronin: "Ronin del Daimyo"
 POD_ronin_flavor: "#F Infantería pesada mortal excepcionalmente hábil, mejorada por tu poder y totalmente dedicada a tu causa.#!"
 POD_yumihiki: "Yumihiki del Daimyo"
 POD_yumihiki_flavor: "#F Arqueros mortales excepcionalmente hábiles, mejorados por tu poder y totalmente dedicados a tu causa.#!"
 POD_yumihiki_riders: "Jinetes Yumihiki del Daimyo"
 POD_yumihiki_riders_flavor: "#F Arqueros a caballo mortales excepcionalmente hábiles, mejorados por tu poder y totalmente dedicados a tu causa.#!"
 POD_sojutsuka: "Samurái Sōjutsuka del Daimyo"
 POD_sojutsuka_flavor: "#F Lanceros mortales excepcionalmente hábiles, mejorados por tu poder y totalmente dedicados a tu causa.#!"
 POD_sojutsuka_riders: "Jinetes Sōjutsuka del Daimyo"
 POD_sojutsuka_riders_flavor: "#F Jinetes mortales excepcionalmente hábiles con lanza, mejorados por tu poder y totalmente dedicados a tu causa.#!"
 POD_teppo_gunners: "Artilleros Teppō del Daimyo"
 POD_teppo_gunners_flavor: "#F Mortales excepcionalmente hábiles que usan armas de fuego, mejorados por tu poder y totalmente dedicados a tu causa.#!"

 war_avatar_of_great_fenris: "Avatar de Guerra del Gran Fenris"
 war_avatar_of_great_fenris_flavor: "#F Pocos espíritus — aparte de las propias Incarnae — son tan aterradores y peligrosos como el avatar de guerra del Gran Fenris. El avatar de Fenris Wolf aparece como un lobo enorme, de 10 pies de alto hasta el hombro. Sus ojos arden de furia y sus fauces gotean con la sangre de innumerables enemigos. Su pelaje es de un gris profundo que parece cambiar de negro a rojo e incluso a blanco a medida que la luz se desplaza sobre él. El avatar de guerra de Fenris no es tan poderoso como la propia Incarna, pero aún desafía las limitaciones habituales de los espíritus y tiene Características incluso más poderosas que los Nexus Crawlers.#!"
 


 
 enochian_guards: "Guardias del Templo Enoquiano"
 enochian_guards_flavor: "#F Los guerreros de antaño se reunieron una vez más para proteger a sus amos inmortales.#!"
 
 maryannu: "Maryannu"
 maryannu_flavor: "#F La nobleza montada en carro de guerra puede haber sido olvidada por los mortales, pero esta orgullosa tradición aún sobrevive en aquellos que la conocieron durante sus vidas anteriores.#!"
  
 romani_scouts: "Exploradores Romaníes"
 romani_scouts_flavor: "#F Jinetes veloces y resistentes, expertos en encontrar la mejor manera de acercarse a una batalla.#!"
  

 
 cockatrices: "Cocatrices"
 cockatrices_flavor: "#F En medio de las arenas cambiantes del desierto, vivía una serpiente muy vil, cuyo aliento y mirada mataban a muchos guerreros.#!"
 drake: "Draco"
 drake_flavor: "#F El draco tiene un cuerpo serpentino fuertemente blindado que es casi impenetrable a los esfuerzos del arco y la espada.#!"
 orm: "Orm"
 orm_flavor: "#F El wyrm (u orm) habita en climas fríos y se parece mucho a una serpiente o anguila gigante.#!"
 wyverns_flavor: "#F La wyvern es una serpiente alada y enroscada cuyos terrenos de caza se extienden desde los confines más septentrionales de Europa hasta Grecia y Etiopía.#!"
 lindworm: "Lindworm"
 lindworm_flavor: "#F El escurridizo lindworm, acechador de los yermos baldíos.#!"
 amphiptere: "Anfíptero"
 amphiptere_flavor: "#F El anfíptero es una serpiente alada, pero sin patas, que viaja exclusivamente volando.#!"
 sphinx: "Esfinge"
 sphinx_flavor: "#F Una esfinge o dragón-gato se parece a un tigre o pantera con alas membranosas, enormes colmillos, ojos de serpiente y aliento humeante.#!"
 fu_guardian: "Guardián Fu"
 fu_guardian_flavor: "#F Un perro guardián del orden y la civilización, este pequeño dragón se parece a un cruce entre un león, un dragón y un perro.#!"
 feng_huang: "Feng Huang"
 feng_huang_flavor: "#F Un fuego apaga la quema de otro, un dolor se alivia con la angustia de otro.#!"
 ghul: "Ghul"
 ghul_flavor: "#F Estos hijos de Iblis, Príncipe de las Tinieblas, salieron entre los hombres para tentar y alimentarse.#!"
 gryphon: "Grifo"
 gryphon_flavor: "#F Artefactos que datan de antes de las glorias de Egipto representan al grifo, el medio león, medio ave rapaz que surca las alas del amanecer. Es el espíritu tótem tradicional de la tribu de las Garras Rojas.#!"
 harpy: "Arpía"
 harpy_flavor: "#F Documentadas originalmente en la mitología griega, las arpías eran las heraldo de la muerte y los castigadores del orgullo.#!"
 hippocampi: "Hipocampos"
 hippocampi_flavor: "#F Caballos, corriendo a lo largo de lagos y océanos, se unían a los espíritus proteicos de las olas y el agua. En ocasiones, sus juegos culminaban en juegos amorosos.#!"
 hippogryph: "Hipogrifo"
 hippogryph_flavor: "#F Como las oscuras leyendas de su origen, los águila-caballos conocidos como hipogrifos poseen un aire melancólico y un temperamento vicioso.#!"
 manticore: "Mantícora"
 manticore_flavor: "#F Como cada animal tiene su lugar en la cadena alimenticia y el ciclo de la vida, la mantícora es una parodia viviente de ese orden.#!"
 pegasus: "Pegaso"
 pegasus_flavor: "#F Tan salvaje y natural como las gemas de las que sus alas obtienen su coloración — zafiro, rubí, esmeralda y amatista — un pegaso es una criatura rara y valiosa.#!"
 peryton: "Peryton"
 peryton_flavor: "#F El peryton es extrañamente atractivo para un animal tan letal. Su cabeza de ciervo tiene un suave pelaje negro, marrón o gris.#!"
 phoboros: "Phoboros"
 phoboros_flavor: "#F Un phoboros se parece a un pequeño toro blanco. Muchos aspectos de esta criatura la vinculan simbólicamente con la luna, y por tanto con las aguas del mundo.#!"
 roc: "Roc"
 roc_flavor: "#F Los rocs son aves gigantescas que se asemejan a halcones blancos brillantes o dorados moteados.#!"
 seabishop: "Obispo Marino"
 seabishop_flavor: "#F El escurridizo 'obispo marino' es un enigma. Descubierto cuando uno fue arrastrado a la orilla, estas entidades se esconden de la humanidad bajo las olas, rechazando el contacto con el mundo de la superficie.#!"
 sea_serpent: "Serpiente Marina"
 sea_serpent_flavor: "#F Acechando las partes más profundas del océano y grandes mares y bahías, las serpientes marinas son la perdición de los barcos que viajan lejos.#!"
 shadhavar: "Shadhavar"
 shadhavar_flavor: "#F Una criatura parecida a un antílope, el shadhavar deambula por las llanuras donde sopla el viento libremente.#!"
 simurgh: "Simurgh"
 simurgh_flavor: "#F El oráculo de Delfos, el viejo de la montaña y las tres Parcas en una cueva ejemplifican al ermitaño omnisciente que se aísla a sí mismo de la humanidad.#!"
 umkovu: "Umkovu"
 umkovu_flavor: "#F El miserable desierto toma su forma, el chacal orgulloso y apretado. En busca de ti, me abro paso a través de la noche más lenta y agitada.#!"
 unicorn: "Unicornio"
 unicorn_flavor: "#F Uno por uno a la luz de la luna allí, relinchando lejos en el aire embrujado. Los unicornios bajan al mar.#!"
 vodayany: "Vodayany"
 vodayany_flavor: "#F Criaturas a lo largo de los siglos han salido de la lúgubre superficie de los lagos tranquilos y han dejado sus marcas en la orilla para que los mortales las contemplen.#!"
 wilde_beast: "Bestia Salvaje"
 wilde_beast_flavor: "#F Una bestia salvaje combina las mejores habilidades depredadoras del león con los rasgos de personalidad dóciles y leales de un spaniel.#!"
 
 demonhound: "Sabueso Demoníaco"
 demonhound_flavor: "#F Poseídos por espíritus del Pozo, estos sabuesos son delgados y siniestros, con ojos malévolos vidriosos en cabezas esqueléticas y saliva hirviente burbujeando en fauces llameantes.#!"
 imps: "Dia Bollos"
 imps_flavor: "#F Demonios menores del Pozo, los dia bollos son embaucadores ingeniosos. Aunque no les gusta el combate directo, pueden ser sorprendentemente duros cuando están acorralados.#!"
 lucifergia: "Lucifergia"
 lucifergia_flavor: "#F Los sabuesos del alma son los verdugos del Diablo. Cuando un pacto no se cumple, estos demonios perseguirán al infractor hasta los Cielos si es necesario.#!"
 malebranche: "Malebranche"
 malebranche_flavor: "#F Los atormentadores del Infierno han tenido una eternidad para perfeccionar su arte. No hay debilidad en el cuerpo y alma humanos que no conozcan.#!"
 war_servitors: "Servidores de Guerra"
 war_servitors_flavor: "#F La casta de batalla del Abismo, estas temibles entidades solo se inclinan (a menudo a regañadientes) ante los Demonios Mayores. La fuerza encarnada, son un torbellino furioso de garras, fuego infernal y armas infernales.#!"
      
 the_unnamable: "El Innombrable"
 the_unnamable_flavor: "#F Los Terrenales pueden abrir un pequeño portal entre la Creación y los reinos del caos y traer algo— una criatura demasiado extraña y peligrosa para existir en esta realidad. Las criaturas convocadas por esta evocación son siempre monstruos peligrosos con terribles poderes de matar y un deseo de destrucción.#!"
 
 nervosa: "Nerviosa"
 nervosa_flavor: "#F Nacidas de la locura, pueden parecer humanos normales, animales o criaturas alienígenas, o incluso no tener cuerpo en absoluto.#!"
 monster_under_the_bed: "El Monstruo Debajo de la Cama"
 monster_under_the_bed_flavor: "#F Hay cosas como serpientes moradas gigantes que esperan que tus manos o pies sobresalgan del borde del colchón para atraparte, y hay pequeñas cosas que simplemente se sientan y te devuelven la mirada (con ojos grandes, saltones y amarillos) justo fuera del haz de la linterna.#!"
 nocnitsa: "Nocnitsa"
 nocnitsa_flavor: "#F Estos monstruos nacidos de las pesadillas de los cambiaformas son algunas de las quimeras más temidas y generalmente toman sus formas directa o simbólicamente de los mayores y más debilitantes miedos de su creador.#!"
 sprites: "Espíritus"
 sprites_flavor: "#F Los espíritus nacen de la fantasía y el deleite. Suelen ser juguetones y, en el peor de los casos, traviesos.#!"
 monsters: "Monstruos"
 monsters_flavor: "#F Monstruo es el nombre dado a las Quimeras Animadas que no encajan en una de las otras categorías de criaturas quiméricas conocidas por los Fae.#!"
 feral_chimera: "Quimera Salvaje"
 feral_chimera_flavor: "#F La mayoría de las quimeras salvajes son las contrapartes en el [UmbraGlossary('dreaming')] de los animales salvajes mundanos: conejos, gatos, lobos, caballos, etc.#!"
 urban_legends: "Leyendas Urbanas"
 urban_legends_flavor: "#F Las leyendas urbanas son casi tan diversas como las nocnitsa, y pueden ser tan impredecibles como la nerviosa. Pueden manifestarse como caimanes en las alcantarillas, poltergeists atormentando casas familiares, o cualquier cosa intermedia.#!"
 
 sidhe_wild_hunt: "Cacería Salvaje Sidhe"
 sidhe_wild_hunt_flavor: "#F Los elegidos de un Señor del Bastión Libre, la Cacería Salvaje son los mejores jinetes entre los Cambiaformas, ilustres caballeros de la Gran Cacería. Son de los mejores guerreros que un Fae puede desatar sobre sus ahora condenados enemigos, e incluso los dioses antiguos temen el paso de sus caballos.#!"
 troll_berserkers: "Berserkers Troll"
 troll_berserkers_flavor: "#F Los trolls miden dos cabezas más que el hombre más alto, diferenciándose solo en estatura a primera vista. Sus rostros son a menudo agradables, a la manera tosca y angular de los pueblos menos civilizados. Llevan el cabello largo, trenzado sobre cada oreja. La longitud en la parte posterior nunca se corta, creciendo hasta llegar a la mitad de la espalda.#!"
 nuckelavee: "Nuckelavee"
 nuckelavee_flavor: "#F El Nuckelavee es una criatura marina que es humana de la cintura para arriba, pero parecida a un caballo de la cintura para abajo. Aunque la idea de un centauro marino puede parecer ridícula a algunos, esta criatura es todo menos eso. Los Nuckelavee tienen la capacidad de asustar a todos excepto a los más valientes por una simple razón: las criaturas no tienen piel. En cambio, son una masa de órganos pulsantes y sangre palpitante, y la vista de tal criatura emergiendo del oleaje comprensiblemente aterroriza a cualquiera que tenga la desgracia de presenciarlo.#!"
 duergar: "Duergar"
 duergar_flavor: "#F Los Duergar son habitantes de las colinas. Miden aproximadamente uno o dos pies de altura, pero por lo demás se parecen a hombres humanos con largas barbas y ojos penetrantes. A pesar de su pequeña estatura, los Duergar tienen la fuerza del hombre más fuerte y un temperamento ardiente a la altura. Son ferozmente territoriales y atacarán a cualquiera que traspase sus tierras. La única defensa contra su ira es suplicar su hospitalidad y ofrecer un regalo a cambio.#!"
 skoggra: "Skoggra"
 skoggra_flavor: "#F Los Skoggra, o Esposas del Bosque, pueden ser bastante amigables con los humanos. Todas son femeninas y bastante bonitas, aunque parecen salvajes. Su torso inferior está cubierto de corteza, así como de hojas y flores en primavera. Pero sus rostros son hermosos, con ojos verdes como el musgo y cabello castaño que se enrosca salvajemente sobre sus hombros.#!"
 ovinniks: "Ovinniks"
 ovinniks_flavor: "#F Los Ovinniks, a primera vista, parecen muy similares a los Brownies. Viven en graneros o establos y son particularmente aficionados a los animales. De hecho, se cree que tienen la capacidad de conversar con ellos en su propio idioma. Sin embargo, el parecido termina ahí. Mientras que los Brownies son generalmente serviciales y se enfadan solo cuando sienten que no se les aprecia, los Ovinniks son criaturas maliciosas de principio a fin. Si bien nunca harán nada para lastimar a un animal, los humanos son presa legítima.#!"
 brownies: "Brownies"
 brownies_flavor: "#F Estas criaturas serviciales viven en y alrededor de casas de toda Europa. Solo salen por la noche, realizando las tareas necesarias en el hogar, desde limpiar y fregar hasta pulir y zurcir. Justo en el momento antes de ser vistos, desaparecen sin dejar rastro, dejando a la mayoría preguntándose cómo se reparó esa bota o quién llenó la caja de leña.#!"
 night_elves: "Elfos Nocturnos"
 night_elves_flavor: "#F Los elfos oscuros de Baviera han aterrorizado durante mucho tiempo a las aldeas locales. Sus hábitos y hábitats son en gran parte desconocidos. Solo los relatos delirantes de aquellos que han descubierto sus aldeas en las copas de los árboles hablan de ellos. Pocos hombres sobreviven a esta experiencia con la mente intacta, lo que daña la credibilidad de estos relatos.#!"
 goblins: "Duendes"
 goblins_flavor: "#F Estas bestias diabólicas viven en los bosques más oscuros de la mayor parte de Europa. Se parecen a muñecos infantiles deformes que han crecido, dejados en la turba durante meses y luego traídos a la vida, completos con un gusto por la carne humana.#!"
 malicious_faerie: "Hada Maliciosa"
 malicious_faerie_flavor: "#F Estas criaturas renCOROSAS son la perdición de los vivos. No pueden pensar en nada mejor que hacer que causar travesuras, desde bromas inofensivas hasta la destrucción de aldeas, y están más que felices de enviar a un viajero perdido por el camino equivocado, conjurar un veneno para 'curar' el agua del pozo o incluso llevar a una banda de duendes al campamento de un comerciante.#!"
 
 chitterers: "Graznadores"
 chitterers_flavor: "#F Compuesto por las ancas de dos lobos con una superficie sin pelo y un cuerpo rosado cubierto de docenas de picos de aves graznadoras; los Graznadores son unas de las creaciones más perturbadoras de los Tremere jamás terminadas.#!"
 reapers: "Segadores"
 reapers_flavor: "#F El Segador, llamado así por dos grandes extremidades delanteras en forma de guadaña perfectamente diseñadas para la decapitación, es un escarabajo del tamaño de un hombre con una concatenación de cabezas de rata rencillosas y siseantes donde debería estar su cara.#!"
 skin_eaters: "Comepieles"
 skin_eaters_flavor: "#F Diminutos insectos parecidos a pulgas con un apetito voraz, los Comepieles fueron diseñados para seguir órdenes simples y tener hambre de piel en lugar de sangre.#!"
    
 crocodiles_flavor: "#F Con sus largos cuerpos y su piel rugosa como la corteza, los caimanes, caimanes y cocodrilos se confunden fácilmente con troncos podridos — un error fatal.#!"
 bears_flavor: "#F Erguida como un hombre sobre sus robustas patas, la osa habita en lugares fríos y solitarios — reinos boscosos con agua (y peces) cerca.#!"
 lions_flavor: "#F Con sus pelajes dorados y las largas y abundantes melenas de los machos, los leones son criaturas magníficas.#!"
 tigers: "Tigres"
 tigers_flavor: "#F Enormes, elegantes y ágiles, estos hermosos animales se mueven rápidamente entre las sombras de la jungla, camuflados por sus abrigos rayados.#!"
 bulls_flavor: "#F El ganado ha jugado un papel crucial en la historia de la civilización humana y, en consecuencia, en su mitología.#!"
 horses: "Caballos"
 horses_flavor: "#F Altos y musculosos, con cuellos largos y arqueados, ojos inteligentes y crines y colas fluidas, estas bestias realmente parecen los elementos en forma viva.#!"
 camels_flavor: "#F La bestia de carga de Arabia, el camello es un animal de mal genio y generalmente ignora cualquier voz de autoridad que no sea la más fuerte.#!"
 stags_flavor: "#F Con sus delgadas extremidades, pezuñas increíblemente pequeñas y grandes ojos líquidos, es fácil ver cómo los ciervos obtuvieron su reputación feérica.#!"
 goats: "Cabras"
 goats_flavor: "#F Más delgadas y más desgreñadas que las ovejas salvajes, las cabras son increíblemente ágiles.#!"
 rams: "Carneros"
 rams_flavor: "#F Criaturas de cara apagada y pelaje rizado, las ovejas viven donde pueden pastar.#!"
 boars_flavor: "#F Más grande (tres a cuatro pies hasta el hombro), más tosco y mucho, mucho más malo que los cerdos domésticos, el jabalí es el mal humor hecho carne.#!"
 monkeys: "Monos"
 monkeys_flavor: "#F Desde las selvas de África y América del Sur hasta las montañas asiáticas, los simios proyectan una sombra desconcertantemente similar a la humana.#!"
 cats_flavor: "#F El felino es un enigma andante, un poco de lo salvaje que ha aceptado un lugar junto al hogar humano.#!"
 foxes_flavor: "#F Los zorros son criaturas astutas. Logran su objetivo no mediante la amenaza o la violencia física, sino mediante la astucia y el pensamiento rápido.#!"
 raptors: "Aves Rapaces"
 raptors_flavor: "#F Las aves rapaces — halcones, azores, águilas — son para las aves lo que los leones y tigres son para las bestias.#!"
 gooses: "Gansos"
 gooses_flavor: "#F En el aire o deslizándose sobre el agua, el cisne es el epítome de la belleza y la gracia.#!"
 owls: "Búhos"
 owls_flavor: "#F Con sus plumas suaves, que les permiten volar silenciosamente, y sus enormes ojos sensibles, que les permiten ver en una oscuridad casi perfecta, los búhos son amos del cielo nocturno.#!"
 ravens_flavor: "#F El ave más grande, el cuervo, extiende sus alas como una capa grácil pero siniestra.#!"
 toads: "Sapos"
 toads_flavor: "#F Se creía que las ranas y los sapos crecían espontáneamente a partir del barro.#!"
 
 golems: "Golems"
 golems_flavor: "#F Las leyendas locales de toda Europa están llenas de historias de monstruos hechos de palos, piedra, arcilla, tierra e incluso trigo.#!"
 guardians_flavor: "#F Se sabe que sacerdotes de órdenes poderosas, magos secretos de gran fuerza e incluso la ocasional bruja de seto colocan poder sobre objetos normalmente inanimados para proteger sus santuarios.#!"
 homunculus: "Homúnculo"
 homunculus_flavor: "#F Cada homúnculo es una obra característica de su creador, posee una conciencia real de los objetivos y deseos de su creador, y de las teorías mágicas que lo han producido.#!"
 
 sebau: "Sebau"
 sebau_flavor: "#F Sebau, sirvientes de barro listos para morir por su creador#!"

 hidden: "Oculto"
 hidden_flavor: "#F Un oculto es un cadáver andante altamente independiente y automotivado que generalmente puede pasar por humano, a diferencia de otros muertos vivientes.#!"
 walker: "Caminantes"
 walker_flavor: "#F El punto medio entre el sutil oculto y los verdaderamente viles tambaleantes, los caminantes se descomponen lentamente, aunque la mayoría tienen suficiente sentido para cubrir sus deformidades con perfume, ropa y similares.#!"
 shambler: "Tambaleantes"
 shambler_flavor: "#F Son cadáveres putrefactos que se tambalean, expulsan fluidos, que no deberían vivir pero lo hacen. Se llaman así porque se tambalean y se contraen al moverse, ya que sus tendones podridos y ligamentos en descomposición no pueden mover sus cuerpos correctamente.#!"
 skeletons: "Esqueletos"
 skeletons_flavor: "#F Aquellos sin materiales frescos para trabajar aún pueden unir algunos huesos y animarlos de nuevo. Los guerreros esqueléticos animados son una vista escalofriante.#!"
 dragons_teeth: "Dientes de Dragón"
 dragons_teeth_flavor: "#F Incapaces de depender completamente de sus lacayos humanos, muchos hechiceros han podido llevar sus protectores consigo, dejándolos escondidos en una bolsa hasta que sea necesario. Una simple bolsa con un puñado de dientes puede contener un ejército de estos guerreros impíos — cada diente, una vez arrojado a la tierra, brota un guerrero esquelético completo, listo para destrozar, mutilar y matar por orden de su amo.#!"
 
 yulan_jin: "Yulan-jin"
 yulan_jin_flavor: "#F Los Yulan-jin son aquellos [GetTrait('kueijin').GetName( GetNullCharacter )] cuyas almas han sido destrozadas por los tormentos de [UmbraGlossary('yomi_wan')] y, como resultado, son incapaces de habitar su propio cuerpo.#!"
 ban_ren_guei: "Ban Ren Guei"
 ban_ren_guei_flavor: "#F Los Ban Ren Guei, o Semidemonios, son la descendencia de una Perdición Seductora y un mortal. Los Tigres Diablo los comandan y atan rutinariamente para que les sirvan.#!"



 unwholesome_nightmare_inducing_ghost: "Fantasmas Inductores de Pesadillas Malsanos"
 unwholesome_nightmare_inducing_ghost_flavor: "#F Estos seres son una forma de Espectro, el poderoso kuei que permanece cuando un fantasma cae ante su Po. Controlados por un Tigre Diablo, inspiran horror en los sueños de sus enemigos.#!"
 unrighteous_cult_leading_ghost: "Fantasma Líder de Culto Impío"
 unrighteous_cult_leading_ghost_flavor: "#F Una forma de fantasma conocida como Aparición en occidente, estos espíritus de Yin se deleitan en levantar cultos entre los vivos. Los Tigres Diablo a menudo encuentran usos creativos para los mortales engañados por este espíritu.#!"
 twice_crimson_tigers_maa: "Tigres dos Veces Carmesíes"
 twice_crimson_tigers_maa_flavor: "#F Los Tigres Diablo nacidos bajo la Dirección Sur son especialmente agresivos y belicosos. Son la punta de lanza de los $pod_kueijin$.#!"
 polong_maa: "Polong"
 polong_maa_flavor: "#F Aunque puede tener cualquier forma que el vampiro desee, un Polong creado es siempre una criatura de carne y cartílago con inteligencia limitada. Las amas de Shintai de Carne pueden controlar a los Polong de forma remota y ver lo que ellos ven.#!"
 hungry_red_dragons_maa: "Dragones Rojos Hambrientos"
 hungry_red_dragons_maa_flavor: "#F Los guerreros de los Dragones Azotadores son maestros del trance de batalla de la Danza del Dragón. Piyau Payung es considerada la Dragón Roja más grande que el mundo haya visto y muchos intentan emularla.#!"
 wayang_kulit_maa: "Wayang Kulit"
 wayang_kulit_maa_flavor: "#F Una táctica de guerra de un [Glossary('Penangallan','podgloss.penangallan')] que usa Shintai de Carne para confundir al enemigo. Nombrado así por el teatro de sombras javanés. #!"
 lianfang_maa: "Lianfang"
 lianfang_maa_flavor: "#F En tiempos de guerra, las Grullas Resplandecientes pueden convocar una coalición de Wu y $pod_kueijin$ no afiliados para unirse en un ejército improvisado.#!"
 heaven_hell_legion_maa: "Legión del Cielo y el Infierno"
 heaven_hell_legion_maa_flavor: "#F La disciplinada Legión del General Ma es, a pesar de su relativa juventud, una de las fuerzas más efectivas de los $pod_kueijin$ chinos.#!"
 triumphant_hares_maa: "Lisbres Triunfantes"
 triumphant_hares_maa_flavor: "#F Un nombre irónico para guerreros $pod_kueijin$ sin habilidad real. Las Grullas Resplandecientes a menudo envían a los indisciplinados y sin habilidad en misiones suicidas cuando la necesidad es grande.#!"
 majestic_warriors_maa: "Guerreros Majestuosos"
 majestic_warriors_maa_flavor: "#F Nombrados en honor a su esquivo pero respetado [Glossary('Bodhisattva','podgloss.bodhisattva')], la élite de las Grullas Resplandecientes es una fuerza bien equilibrada y disciplinada en el campo de batalla.#!"
 dark_jade_lovers_maa: "Amantes del Jade Oscuro"
 dark_jade_lovers_maa_flavor: "#F La personificación de la muerte para los Mil Susurros, asesinos hábiles que usan muchas máscaras.#!"
 still_earth_flowers_maa: "Flores de Tierra Inmóvil"
 still_earth_flowers_maa_flavor: "#F Sólidas y firmes pero también siempre cambiantes, estas guerreras de los Mil Susurros buscan encarnar la tierra misma.#!"
 jade_mask_ghost_killers_maa: "Asesinos de Fantasmas de Máscara de Jade"
 jade_mask_ghost_killers_maa_flavor: "#F Algunos Mil Susurros encuentran un deber en ayudar a los fantasmas y otros espectros a seguir adelante. Se han convertido en expertos en tratar con esbirros del inframundo. #!"
 xiang_qi_masters_maa: "Maestros del Xiang-qi"
 xiang_qi_masters_maa_flavor: "#F Las Flores de Hueso ven la guerra con el mismo desapego que si estuvieran jugando a un juego de mesa. Usarán cada pieza en el tablero para su ventaja.#!"
 black_pearl_masters_maa: "Maestros de la Perla Negra"
 black_pearl_masters_maa_flavor: "#F Nombrados en honor al más exaltado [Glossary('Arhat','podgloss.arhat')] de las Flores de Hueso, estos soldados están entre las pocas Flores de Hueso que realmente dedicaron su sed de conocimiento a dominar la guerra.#!"
 keepers_black_metal_maa: "Guardianes del Huevo de Metal Negro"
 keepers_black_metal_maa_flavor: "#F Aquellas Flores de Hueso que realmente dominan el Yin son casi inmunes al dolor y completamente impasibles. Ambos grandes activos para usar en el campo de batalla.#!"
 kataragama_chosen_maa: "Elegidos de Kataragama"
 kataragama_chosen_maa_flavor: "#F Nombrados en honor al exaltado fundador del Fénix Ascendente, estos guerreros emulan sus campañas victoriosas contra los vampiros infernalistas de Sri Lanka.#!"
 jade_warriors_maa: "Guerreros de Jade"
 jade_warriors_maa_flavor: "#F Un Guerrero de Jade es un discípulo que ha dominado la destreza física necesaria para luchar por el [Glossary('Dharma','podgloss.dharma')]. En esta etapa, pueden ser reclutados para la guerra si es necesario.#!"
 lotus_mist_warriors_maa: "Emboscadores de Niebla de Loto"
 lotus_mist_warriors_maa_flavor: "#F Usando un poder secreto conocido solo por aquellos de su [Glossary('Dharma','podgloss.dharma')], estos guerreros usan su entorno para volverse casi invisibles.#!"
 children_sita_maa: "Hijos de Sita"
 children_sita_maa_flavor: "#F Los hijos de una Diosa agraviada y exiliada solo pueden ir a la guerra con las mejores monturas y equipos que sus cultos puedan comprar.#!"
 celestial_guard_maa: "Guardias Celestiales"
 celestial_guard_maa_flavor: "#F Los Dioses Renacidos de la Tribu Celestial deben ser protegidos por sus seguidores más celosos y hábiles en todo momento.#!"
 kabalyeru_maa: "Kabalyeru"
 kabalyeru_maa_flavor: "#F Cuando un Buscador demuestra su valía mediante la destreza en la batalla, se convierte en Kabalyeru y a partir de entonces se le considera un guerrero apropiado para su secta.#!"
 fighting_cloud_maa: "Maestros de la Nube Luchadora"
 fighting_cloud_maa_flavor: "#F Los maestros de este arte pueden atravesar el velo de la ilusión que sofoca este mundo. Al hacerlo, aparentemente pueden atacar y retirarse como si nunca hubieran existido.#!"
 illusion_shattering_maa: "Golpe Rompeilusiones"
 illusion_shattering_maa_flavor: "#F Los maestros del Camino Interior saben qué es real y qué no. Usando su arte secreto, pueden disipar cualquier criatura que no debería estar en este reino con un solo golpe.#!"
 disciples_riyan_maa: "Discípulos de Riyan"
 disciples_riyan_maa_flavor: "#F El antepasado de los Velos Cerúleos tuvo un viaje largo y arduo lleno de peligros. Estos guerreros honran sus pruebas endureciéndose contra condiciones extremas.#!"     
    
 shikome_assassin: "Shikome"
 shikome_assassin_flavor: "#F Icónicamente hermosas, las Shikome son las asesinas, guardaespaldas y concubinas de [Glossary('Emma-O','podgloss.emmao')]. Todas fueron una vez $pod_kueijin$ que él personalmente cautivó para su servicio.#!"
 kumo_huntress: "Cazadora Kumo"
 kumo_huntress_flavor: "#F Delgadas y pálidas, las habitantes Kumo de [UmbraGlossary('kakuri')] [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] son como arañas incluso en su forma humana.#!"
 raksha_of_ravana: "Raksha de Ravana"
 raksha_of_ravana_flavor: "#F Los raksha viajan al Reino Medio con regularidad para alimentarse y realizar negocios, así como para deambular furtivamente por [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] en busca de ofrendas para Lanka.#!"
 the_children_of_tou_mou: "Los Hijos de Tou Mu"
 the_children_of_tou_mou_flavor: "#F Figuras achaparradas, encorvadas, de hierro negro con ojos rojos brillantes, mitad autómata con forma humana, mitad insecto, los Hijos de [Glossary('Tou Mu','podgloss.toumu')] están diseñados para sobrevivir a las duras condiciones del reino de la Reina Yama.#!"
 mikaboshis_demons_of_iron_and_violence: "Demonios de Hierro y Violencia de Mikaboshi"
 mikaboshis_demons_of_iron_and_violence_flavor: "#F Localizar objetivo. Eliminar objetivo. Causar tantos daños colaterales como sea posible durante la eliminación.#!"
 shinjuku_undercity_scavengers: "Carroñeros del Submundo de Shinjuku"
 shinjuku_undercity_scavengers_flavor: "#F Nadie sale de la [Glossary('Ciudad Malvada','podgloss.wickedcity')]. La mayoría rebotan entre las calles y el trabajo manual hasta que finalmente se desgastan (y poco después, se extinguen). Pero para aquellos que logran salir de la rutina brutal, la caída inevitable es mucho peor. Shinjuku no es una ama acogedora.#!"
 fat_striders_of_the_hell_of_boiling_oil: "Zancudos Gordos del Infierno del Aceite Hirviendo"
 fat_striders_of_the_hell_of_boiling_oil_flavor: "#F En apariencia, estas criaturas se parecen algo a una larva de mosquito cruzada con la forma inmadura de algún tipo particularmente vil de langosta o cigarra, con las patas delgadas de un 'insecto patinador de agua' unidas. Los zancudos gordos atacan con una boca de dientes de acero en el extremo de una probóscide extensible extremadamente rápida.#!"
 wu_huas_corpse_tiger_demons: "Demonios Tigre Cadáver de Wu Hua"
 wu_huas_corpse_tiger_demons_flavor: "#F Los demonios tigre cadáver parecen ser hombres y mujeres enormes (de tres metros de altura), muy musculosos, con cabezas y colas de tigre, y patas como de tigre con largas garras negras retráctiles en lugar de manos.#!"
 kani_no_jingoku: "Kani no Jingoku"
 kani_no_jingoku_flavor: "#F Los Kani no Jingoku son habitantes de los Siete Mares Ardientes y sirvientes de la misteriosa Reina Yama, la Emperatriz de las Perlas.#!"
 generic_servitor: "Servidor Genérico"
 generic_servitor_flavor: "#F No todos en [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] pueden ser un sirviente del mal emocionante y único. Alguien tiene que tomar el papel de la monstruosidad de nivel medio, el horror tambaleante, el torturador común que ayuda a formar la base de las legiones de [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')].#!"
 the_unfaced_ones_maa: "Los Descarados"
 the_unfaced_ones_maa_flavor: "#F Los Descarados son los restos retorcidos cubiertos de harapos de Espectros que han permanecido demasiado tiempo en el Camino de Ébano. A pesar de sus formas decrépitas, los Descarados son increíblemente rápidos y son utilizados por muchos [Glossary('Reyes Yama','podgloss.yamaking')] como perros guardianes.#!"
 the_guardians_yomi_maa: "Guardianes de la Muralla"
 the_guardians_yomi_maa_flavor: "#F Creados por los [Glossary('Reyes Yama','podgloss.yamaking')] específicamente para el propósito de custodiar la Muralla que rodea el Mundo de Yomi, estos espíritus son combinaciones aterradoras de depredadores del Reino Medio y demonios de Yomi. Un Guardián típico se mueve sobre seis patas escamosas y con garras, su cuerpo sinuoso cubierto de placas de armadura de jade negro.#!"

 shades: "Sombras"
 shades_flavor: "#F Entre los más poderosos de los Espectros, las Sombras son antiguos espectros que fueron arrojados a la [UmbraGlossary('tempestad')], atrapados en un Maelstrom o Gran Maelstrom, o se perdieron durante una Aflicción.#!"
 wraiths_flavor: "#F Espectros materializados invocados desde la [UmbraGlossaryLocalized('tierras de las sombras','Inframundo')].#!"
 spectres: "Espectros"
 spectres_flavor: "#F Espectros materializados invocados desde el [UmbraGlossary('pod_realm_labyrinth')].#!"
 the_reavers_of_ur: "Los Devastadores de Ur"
 the_reavers_of_ur_flavor: "#F Un enjambre de horribles formas grises ondulantes invocadas de un lugar desconocido para despachar a los enemigos de manera horrible.#!"
 soldiers_of_the_emperor: "Soldados del Emperador"
 soldiers_of_the_emperor_flavor: "#F Los soldados gozan de un tremendo prestigio en el Imperio de Jade, ya que defienden el Imperio contra demonios, Espectros y otros invasores.#!"
 bureaucrats_of_jade_palace: "Burócratas del Palacio de Jade"
 bureaucrats_of_jade_palace_flavor: "#F Los Ministros que habitan los salones y patios del Palacio del Emperador envuelto en la Tempestad son una raza especial, los conspiradores y burócratas más efectivos de todo el Imperio.#!"
 demon_jailer: "Carcelero Demonio"
 demon_jailer_flavor: "#F Los carceleros, torturadores y capataces del Infierno han utilizado el poder espectral Moliate para convertirse en demonios de leyenda.#!"
 phantasies: "Fantasías"
 phantasies_flavor: "#F Estas son criaturas que tienen un gran parecido con criaturas vivientes, como una ballena o un pájaro. Las Fantasías pueden ser lo suficientemente sensibles para comunicarse, y a veces ayudarán a los espectros en la [UmbraGlossary('tempestad')]. Como los animales en el [Glossary('Mundo de la Piel','game_concept_skinlands_desc')], algunos animales son hostiles a los humanos, algunos son amigables y otros es mejor dejarlos solos.#!"
 deliriums: "Delirios"
 deliriums_flavor: "#F Plásmicos que parecen animales modificados, como caballos alados o gatos con antenas. Los Delirios tienden a ser algo más inteligentes y poderosos que las Fantasías.#!"
 legendaries: "Legendarios"
 legendaries_flavor: "#F Plásmicos que emulan algún tipo de bestia mítica, como un Fénix. Los Legendarios tienden a ser inteligentes, poderosos y raros.#!"
 angelics: "Angélicos"
 angelics_flavor: "#F Como su nombre indica, los Angélicos aparecen como hermosos seres angelicales en la tradición judeocristiana clásica: túnicas, halos y alas son comunes, pero algunos Angélicos pueden tomar formas más andróginas o centelleantes. Generalmente flotan a través de la [UmbraGlossary('tempestad')], ayudando a los espectros en sus viajes.#!"
 demonics: "Demoníacos"
 demonics_flavor: "#F Como su nombre indica, los Demoníacos son criaturas que aparecen como un reflejo de fealdad, lujuria, o ambas. El único propósito de los Demoníacos parece ser torturar, esclavizar o destruir a cualquier espectro que encuentren. Algunos Demoníacos pueden tomar temporalmente la forma de Angélicos, y pueden guiar a un espectro antes de revelar su verdadera forma e infligir castigo.#!"
 archangelics: "Arcangélicos"
 archangelics_flavor: "#F Los Arcangélicos pueden parecerse a los Angélicos al principio, pero en algún momento se transforman en formas ígneas, terribles de contemplar. Por lo general, llevan una espada o pergaminos de juicio, y usarán una habilidad especial de Castigar para sacar la Sombra de un espectro con el fin de destruirla. Entonces, la Psique del espectro es tomada por el Arcangélico para usos desconocidos, aunque se sospecha que las Psiques juegan un papel en la forja de las espadas llameantes de los Arcangélicos.#!"
 archdemonics: "Arcademoníacos"
 archdemonics_flavor: "#F Lo opuesto al Arcangélico, un Arcademoníaco intentará fortalecer la Sombra de un espectro en lugar de purificarla. Aparecen beneficiosos al principio, enseñando a los espectros nuevos Arcanoi, pero solo enseñarán las habilidades que les causan obtener Angustia. Eventualmente, un Arcademoníaco desgastará a su víctima y permitirá que la Sombra tome el control, convirtiéndolos en un sirviente de [UmbraGlossary('oblivion')].#!"
 djinn: "Djinn"
 djinn_flavor: "#F Algunos Angélicos y Demoníacos aparecen como genios o efrits y parecen poseer los poderes atribuidos a esos seres. Pueden proporcionar a los espectros una riqueza fabulosa — en moneda de Stygian, por supuesto — y otros elementos materiales como palacios reliquia y alfombras voladoras. Esta riqueza le cuesta caro al espectro.#!"
 wyrds: "Wyrd"
 wyrds_flavor: "#F Plásmicos que no tienen punto de referencia con criaturas vivientes o legendarias. Los Wyrd son generalmente alienígenas; incluso si son lo suficientemente inteligentes para comunicarse con los espectros (y la mayoría son terriblemente inteligentes), sus requisitos o peticiones son generalmente demasiado arcanos para tener sentido.#!"
 ailerons: "Ailerones"
 ailerons_flavor: "#F No hay mucho en el cuerpo de un Ailerón; una boca succionadora llena de ganchos, una larga cola como un látigo y grandes alas que usan para deslizarse a lo largo de las corrientes de la [UmbraGlossary('tempestad')] es todo lo que constituyen. Son sus cuerpos delgados y su coloración lo que los hace casi invisibles en los escombros arremolinados de las tormentas.#!"
 cerements: "Mortajas"
 cerements_flavor: "#F Las Mortajas aparecen como grandes masas de ectoplasma rezumante con venas pulsantes que recorren la sustancia. Las Mortajas son uno de los tipos más benignos de Whistimmu, y raramente buscan problemas. Sin embargo, si un espectro se encuentra con una, pasará un mal momento; el desafortunado espectro que queda atrapado en una Mortaja pierde un año de recuerdos por cada día que pasa atrapado en su interior. Las Mortajas incluso pueden liberar a su víctima de sus [Anclas|E] y Pasiones, y usarlas como si fueran suyas. Eventualmente, el espectro capturado se convertirá él mismo en una Mortaja.#!"
 kraken: "Kraken"
 kraken_flavor: "#F El Kraken es aterrador debido a su enorme tamaño; es tan grande, de hecho, que ningún espectro ha informado jamás haberlo visto en su totalidad. Se sabe que tiene tentáculos y ojos masivos, pero no se sabe nada más sobre su forma o anatomía. El Kraken también es bastante antiguo; la Gran Biblioteca de Stygia tiene informes de su existencia antes de que Caronte terminara de construir su gran reino en la Isla de las Penas.#!"
 mourners: "Lamentadores"
 mourners_flavor: "#F Los Lamentadores, a primera vista, se parecen a las figuras encapuchadas de los Barqueros. Sin embargo, en lugar de llevar sus linternas y guadañas, los Lamentadores usan masas de cadenas pesadas. Sus rostros no se ven, ocultos en la oscuridad de sus capas. Siempre viajan en manadas, con todos los Lamentadores de un grupo particular encadenados al más poderoso entre ellos. A diferencia de muchas de las criaturas de la [UmbraGlossary('tempestad')], los Lamentadores siempre parecen tener un objetivo específico cuando aparecen, marchando desde la [UmbraGlossary('tempestad')] hacia la [UmbraGlossary('tierras de las sombras')].#!"
 shroudrippers: "Rasgavelos"
 shroudrippers_flavor: "#F Los Rasgavelos se encuentran entre los más esquivos de los Whistimmu, difíciles de detectar y casi imposibles de capturar y examinar. Si bien aún no se han examinado en detalle, se acepta generalmente que los Rasgavelos tienen un cuerpo pequeño y compacto y una fina membrana estirada entre diez 'dedos' que les permite volar. La membrana también tiene pequeños chorros de los que se puede rociar ácido, y los dedos terminan cada uno en una garra muy afilada. Sin embargo, los Rasgavelos son extremadamente frágiles; los destruidos cuyo [Corpus|E] se recupera se derriten en un montón amorfo de plasma en segundos.#!"
 tindelhounds: "Sabuesos de Tindel"
 tindelhounds_flavor: "#F Como su nombre indica, los Sabuesos de Tindel se parecen superficialmente a los perros. Debido a la mancha de [UmbraGlossary('oblivion')], sin embargo, estos perros tienen muchas más cabezas, bocas y ojos que el canino promedio; los más vistos tenían diez bocas y quince ojos. También son mucho más grandes que el perro promedio, alrededor de 15 pies hasta el hombro. Además de sus fauces y tamaño, tienen ganchos en lugar de pelo, emiten fuego verde por la boca y dejan un rastro hollín. Como si eso no fuera suficiente, los Sabuesos de Tindel también son bastante inteligentes, capaces de adaptarse a situaciones inusuales con bastante rapidez. Afortunadamente para los espectros, la mayoría de ellos evitan la [UmbraGlossary('tierras de las sombras')], viviendo en lo profundo de la [UmbraGlossary('tempestad')].#!"
 shadow_beasts: "Bestias de Sombra"
 shadow_beasts_flavor: "#F Bestias de sombra materializadas invocadas del Abismo mediante magia de sangre.#!"
 hungry_shade: "Sombras Hambrientas"
 hungry_shade_flavor: "#F Sombras materializadas invocadas del Abismo mediante magia de sangre.#!"

 mist_dragons: "Dragones de Niebla"
 mist_dragons_flavor: "#F En lo profundo de estas nieblas mágicas hay dragones diminutos, no más grandes que gatos.#!"
 giants_flavor: "#F Sus cuerpos masivos, a menudo de más de 20 pies de altura, son similares a los humanos de músculos gruesos con piel áspera y pedregosa, lo que sugiere teorías de que pueden ser parientes lejanos de los inanimae de piedra.#!"
 tarrkel: "T'arrkel"
 tarrkel_flavor: "#F El abismo de Bajo Puente engendra criaturas retorcidas y pesadillescas más allá de la capacidad de comprensión humana, criaturas que prosperan con el dolor y sobreviven de la carne de los vivos.#!"
 fire_salamanders: "Salamandras de Fuego"
 fire_salamanders_flavor: "#F Estas criaturas, aunque se parecen a sus primos mundanos, son criaturas de magia que viven principalmente en reinos feéricos más allá del mundo natural.#!"
 firebirds: "Pájaros de Fuego"
 firebirds_flavor: "#F El pájaro de fuego es una criatura de colores brillantes de las tierras eslavas de Europa del Este.#!"
 
 aughisky: "Aughisky"
 aughisky_flavor: "#F Caballos demoníacos oscuros que acechan en cruces de caminos o acechan cerca de estanques y arroyos salobres.#!"


 
 sirens: "Sirenas"
 sirens_flavor: "#F Tentadoras de pelo largo del mar, las Sirenas atraen a los marineros a tumbas acuáticas en arrecifes invisibles o en peligrosos estrechos.#!"

 incubus: "Íncubo"
 incubus_flavor: "#F El Íncubo es la forma masculina de este demonio de la tentación y la lujuria, conocido en casi todas las culturas (aunque con diferentes nombres).#!"
 succubus: "Súcubo"
 succubus_flavor: "#F La Súcubo es la forma femenina de este demonio de la tentación y la lujuria, conocido en casi todas las culturas (aunque con diferentes nombres).#!"
 
 pelesit: "Pelesit"
 pelesit_flavor: "#F Pequeñas criaturas construidas a partir de la propia carne del wan-kuei y enviadas a hacer recados.#!"
 
 vampires_hunters: "Cazadores de Vampiros"
 vampires_hunters_flavor: "#F La ballesta es el arma preferida cuando se cazan chupasangres. ¿Qué mejor manera de repartir estacas directamente al corazón del asunto?#!"
 demons_hunters: "Cazadores de Demonios"
 demons_hunters_flavor: "#F Entrenados para resistir la corrupción y disipar ilusiones, estos hombres derriban sin piedad a los esbirros del gran enemigo.#!"
 monsters_hunters: "Cazadores de Monstruos"
 monsters_hunters_flavor: "#F Los monstruosos cambiaformas son demasiado horribles de contemplar para el hombre común. Por suerte, esos no son hombres comunes.#!"
 dazbog_hunters: "Guerreros de Dazbog"
 dazbog_hunters_flavor: "#F Herederos del gran dios guerrero del sol, estos héroes matan monstruos poderosos dondequiera que van.#!"
        
 dragons_flavor: "#F O ser un dragón\na symbol of the power of Heaven.#!"

 minion_of_the_divine: "Guerreros Bendecidos"
 minion_of_the_divine_flavor: "#F Inspirados por tu aura divina, estos orgullosos guerreros luchan como los propios ángeles.#!"
 
 hoplites: "Hoplitas"
 hoplites_flavor: "#F Regresa con tu escudo, o sobre él.#!"
 companion_cavalry: "Caballería de Compañeros"
 companion_cavalry_flavor: "#F '¿Qué harías si alguna vez llegaras al fin del mundo?' 'Regresaría y conquistaría su opuesto.' #!"
    
 envy_dragon: "Envidia"
 envy_dragon_flavor: "#F La forma natural de la Envidia es una gran serpiente marina, mucho más larga que cualquier embarcación. Una cabeza de dragón de colmillos verdes se asienta en la parte superior de un vasto cuerpo serpentino, con dos pares de aletas con garras. Elegante y flexible, la Envidia se deleita envolviendo su cuerpo alrededor de los barcos varias veces antes de privar a sus tripulaciones y carga, para luego enviar todo a las profundidades.#!"
 gluttony_dragon: "Gula"
 gluttony_dragon_flavor: "#F Esta gran y gorda serpiente se enrosca en el norte de la Selva Negra, no lejos del lugar de su nacimiento. El lagarto negro como el carbón no necesitó viajar lejos para encontrar un hogar adecuado a sus necesidades. A diferencia de algunos de sus parientes, no tiene alas y por lo tanto no puede volar. Sin embargo, su velocidad terrestre en forma de serpiente compensa con creces la pérdida. Puede recorrer vastas extensiones de tierra en meros momentos, dejando enormes nubes de polvo y un rastro de escombros a su paso.#!"
 greed_dragon: "Avaricia"
 greed_dragon_flavor: "#F La Serpiente de la Avaricia huyó a las montañas de Italia para buscar un nuevo hogar. Pocos vieron a la gran bestia negra atravesar la noche. Nadie vio su llegada, bajo la apariencia de un mendigo que pedía los regalos que pudiera obtener, su lengua plateada siempre aflojando incluso las cuerdas de monedero más apretadas. Pronto, había acumulado suficiente fortuna para establecer un negocio. Su voz melosa persuadió de nuevo a los incautos, esta vez para atraer socios para sus empresas. Sus fortunas se sumaban a la suya y crecían al mismo tiempo. No pasó mucho tiempo antes de que se convirtiera en una fuerza empresarial.#!"
 lust_dragon: "Lujuria"
 lust_dragon_flavor: "#F Esta gran bestia roja se elevó al cielo después de su nacimiento, volando sobre las aguas hasta las Islas Británicas. La Serpiente de la Lujuria es un draco esbelto y flexible, no tan grande como algunos de sus parientes, pero aún de tamaño formidable. Sus alas se extienden una vez y media su longitud. Sus escamas brillantes son tan rojas como los rubíes, lo que la convierte en una criatura atractiva, si no fuera por los colmillos del tamaño de un hombre y las garras del largo de una lanza.#!"
 pride_dragon: "Orgullo"
 pride_dragon_flavor: "#F La Serpiente escamada del Orgullo hace su guarida bajo las catacumbas de Roma, en túneles sellados hace mucho tiempo por sus propios sirvientes. Una puerta pesada y cerrada con llave es la única entrada o salida utilizable; el corredor exterior conduce a la residencia palaciega de su forma humana actual. Pasa tiempo aquí entre la alta sociedad, siempre cuidando de ser un poco más guapo, un poco mejor vestido y, sorprendentemente, un poco mejor educado que nadie. Deja la mayoría de sus asuntos mortales simulados en manos de sirvientes humanos de confianza, y generalmente engañados.#!"
 sloth_dragon: "Pereza"
 sloth_dragon_flavor: "#F La Pereza es un gran gusano de color marrón sucio, completamente despreocupado por su apariencia. A diferencia de sus parientes, no tiene alas ni extremidades. Es una serpiente enorme y gorda con cabeza de dragón. Como su nombre indica, su cuerpo es una sólida bobina de cuerda de reptil, cuya superficie lisa solo se rompe por el bulto ocasional de una comida aún en digestión.#!"
 wrath_dragon: "Ira"
 wrath_dragon_flavor: "#F Cuando la Serpiente de la Ira irrumpió en el mundo, su hostilidad sacudió la tierra. Sus pensamientos de agresión y venganza se extendieron hasta que se encontró un anfitrión dispuesto para su ira. Los hunos arrasaron Europa, saciando el temperamento de la bestia. Habita durmiendo bajo las heladas del oeste de Rusia. Cuando despierte de nuevo, sin duda será con el olor de la matanza.#!"
 

 mob_maa: "Turba"
 mob_maa_flavor: "#F Una banda de mortales apenas armados, engañados o persuadidos para morir por su señor inmortal.#!"
 poachers_maa: "Cazadores Furtivos"
 poachers_maa_flavor: "#F Personajes desagradables de la naturaleza pagados para luchar por patrocinadores aún más desagradables.#!"
 outriders_maa: "Jinetes Exploradores"
 outriders_maa_flavor: "#F Los jinetes competentes con pocos escrúpulos morales tienen una gran demanda entre los gobernantes de la noche.#!"
 rabble_maa: "Milicia"
 rabble_maa_flavor: "#F La horca es una especie de pica, ¿no? Los mendigos no pueden elegir.#!"
 retainers_maa: "Séquito"
 retainers_maa_flavor: "#F La guardia mortal de cualquier señor inmortal que se precie. A menudo muy bien pagados (o dominados) para asegurar su lealtad.#!"
 disgraced_nobles_maa: "Nobles Deshonrados"
 disgraced_nobles_maa_flavor: "#F Hijos menores de la nobleza que han perdido su honor por su carácter dudoso y sus sórdidos asociados.#!"

 neteru_medjay: "Neteru Medjay"
 neteru_medjay_flavor: "#F Los 'auxiliares' de las bandas de guerra de los Renacidos son en su mayoría reclutados de conocidos de los extensos árboles genealógicos que las Momias inmortales fomentaron a lo largo de los siglos.#!"             
 neteru_slingers: "Honderos Neteru"
 neteru_slingers_flavor: "#F La humilde honda ha derribado a muchos guerreros poderosos a lo largo de los siglos. Con la habilidad de estos Neteru entrenados por las Momias, lo harán de nuevo.#!"             
 neteru_khopesh: "Guardia Khopesh Neteru"
 neteru_khopesh_flavor: "#F La guardia de élite del Faraón muerto hace mucho tiempo renace a través de estos guerreros Neteru entrenados por las propias Momias.#!"             
 neteru_tomb_guard: "Guardián de Tumba Neteru"
 neteru_tomb_guard_flavor: "#F Los Neteru elegidos para vigilar a sus señores inmortales mientras duermen son defensores de élite, cuyas habilidades se perfeccionan con años de repeler a los deshonestos saqueadores de tumbas.#!"             

 flagellants_maa: "Flagelantes"
 flagellants_maa_flavor: "#F Sangrar y morir por la gloria de los Ángeles de Dios... ¿qué podría ser una causa más digna?#!"
 chanters_cultists: "Coro Impío"
 chanters_cultists_flavor: "#F Cantan sobre la salvación que vendrá de manos de su amo... y sobre la perdición inevitable de sus enemigos.#!"
  
 silver_hunters: "Cazadores de Plata"
 silver_hunters_flavor: "#F Apariciones de las Nieblas hechas de Plata, estos Campeones del Sueño recorren los bosques como guardabosques de plata brillante. Hechos a partir de los relatos de los cazadores de bestias terribles en la noche, cazan a la presa más peligrosa y siembran el miedo en los corazones de los hijos de Gaia.#!"
 coffin_makers: "Fabricantes de Ataúdes"
 coffin_makers_flavor: "#F Se dice que significan la extinción de las sombras que beben sangre, las espinas de estos campeones azotan y queman la sangre de la vil estirpe del loco primer asesino. Como arbustos de rosas criados para matar, anhelan la sangre tanto como su presa.#!"
 guardian_angels: "Ángeles Guardianes"
 guardian_angels_flavor: "#F Moldeados a partir de los cuentos de hadas que los padres cuentan a sus hijos sobre protectores especiales que los vigilan, por extraños giros del destino, los extraños seres del Abismo encuentran a estos Guerreros del Sueño de luz especialmente aborrecibles.#!"
 unfettered_phantoms: "Fantasmas Desatados"
 unfettered_phantoms_flavor: "#F Tomando la forma de lo que la pobre alma que lo ve considera 'asuntos pendientes', los Fae han encontrado que estos guerreros son particularmente perturbadores para los muertos, ya que toman formas horribles que envían a los espectros gritando a otro lugar.#!"
        
 vigiles_francia_maa: "Vigiles Francia"
 vigiles_francia_maa_flavor:  "#F Creada por Salianna después de su toma de posesión de Francia, los 'gardes de nuit' es una orden de élite de caballeros Toreador franceses temidos por su dominio de la celeridad. #!"
 faydits_maa: "Faydits"
 faydits_maa_flavor: "#F Creada por Esclarmonde para defender Occitania, esta orden de caballeros compuesta por varios clanes está diseñada para responder rápidamente a cualquier incursión de los franceses.#!"
 centuries_epines_maa: "Centurie des Epines"
 centuries_epines_maa_flavor: "#F Creada originalmente para rechazar una invasión de Cainitas [Glossary('Ashirra','game_concept_ashirra_desc')] ibéricos en el siglo X en Occitania, este grupo ha evolucionado hasta convertirse en una despiadada banda mercenaria que opera tanto en Francia como en Iberia.#!"
 white_company_maa: "Compañía Blanca"
 white_company_maa_flavor: "#F Estos caballeros Cainitas caballerescos de España son renombrados por su impecable integridad y su estricta adhesión a las pautas morales establecidas por su líder, Doña Lupa Manrique.#!"
 fellowship_lady_maa: "Hermandad de Nuestra Señora"
 fellowship_lady_maa_flavor: "#F Creada por un Toreador inglés que recibió una visión de la Virgen María durante la Primera Cruzada, la Hermandad se dedica a proteger y asistir a las mujeres. Creen que esta santa tarea los liberará de la maldición de Caín. #!"
 order_chanticleer_maa: "Orden de Chanticleer"
 order_chanticleer_maa_flavor: "#F Esta elocuente orden de cazadores de demonios Cainitas tiene un historial impresionante. Sin embargo, su naturaleza imprudente les ha granjeado muchos enemigos y cada vez más gobernantes los exilian de sus tierras.#!"
 dispossessed_maa: "Los Desposeídos"
 dispossessed_maa_flavor: "#F Formada por ghouls abandonados cuando sus amos Cainitas cruzados terminaron muertos en Tierra Santa, los Desposeídos pronto se convirtieron en una red de ghouls libres que se ayudaban mutuamente, a veces incluso oponiéndose directamente a los vampiros opresores.#!"
 order_star_morning_maa: "Orden de la Estrella de la Mañana"
 order_star_morning_maa_flavor: "#F Seguidores de la Vía Adversarius que han tomado como su deber sagrado cazar lo infernal, la Orden es conocida por estar abierta a alianzas con grupos de ideas afines como sus compañeros en la Orden de Chanticleer o la esquiva Tal'mahe'Ra.#!"
 order_crooked_cross_maa: "Orden de la Cruz Torcida"
 order_crooked_cross_maa_flavor: "#F Una Orden de Caballeros Malkavian que sigue su propia y extraña interpretación de la voluntad de Malkav. Intentar interpretar su locura hace que terminen en los lugares y situaciones más inverosímiles. #!"
 order_bitter_ashes_maa: "Orden de las Cenizas Amargas"
 order_bitter_ashes_maa_flavor: "#F Los legendarios Caballeros del Grial son más mito que realidad, excepto para los elegidos que sobrevivieron a las búsquedas del Grial. Sus poderes los convierten en mucho más que meros vampiros y en combatientes insuperables.#!"
 order_of_vengeance_maa: "Su Santísima Orden de la Venganza"
 order_of_vengeance_maa_flavor: "#F El nombre colectivo para los seguidores de la Vía Vindicta que se comportan y organizan como una orden de caballeros.#!"
 leper_knights_maa: "Caballeros Leprosos"
 leper_knights_maa_flavor: "#F La orden Nosferatu de los Caballeros Leprosos son los patrones y guardianes de los enfermos y afectados por la peste entre los mortales. Cuando su santo deber está amenazado, forman una fuerza de combate temible utilizando la a menudo pasada por alto destreza física de su clan.#!"
 the_unblooded_maa: "Los No Sangrados"
 the_unblooded_maa_flavor: "#F Comenzando con dos Salubri tratando de salvar las tradiciones y ritos de su moribundo clan, los No Sangrados han crecido hasta convertirse en una orden de caballeros mixta dedicada a proteger los restos de los que una vez fueron orgullosos hijos de Saúl.#!"
 mahgrib_maa: "Buscadores del Mahgrib"
 mahgrib_maa_flavor: "#F Una subsección secreta de los Ashirra, los Mahgrib están dedicados a luchar contra las fuerzas de la corrupción en cualquier forma que puedan adoptar. Los miembros de los Mahgrib son tan respetados como temidos por su sombría diligencia.#!"
 banu_sasan_maa: "Banu Sasan"
 banu_sasan_maa_flavor: "#F Los Hijos de Sasan afirman descender de la realeza persa. Estos infames pícaros son empleados por muchos vampiros que necesitan soluciones más sutiles para sus problemas.#!"

 the_wardens_maa: "Los Guardianes"
 the_wardens_maa_flavor: "#F Los guardianes de los lugares sagrados del Camino de la Bestia, los Guardianes son muy experimentados en el trato con magos codiciosos, fae y otros $glossary_fera$ que intentan usar los poderes místicos de estos sitios para sus propios fines.#!"
 order_twilight_maa: "La Orden del Crepúsculo"
 order_twilight_maa_flavor: "#F También conocida como la Orden de los Verdaderos Caballeros del Sol Poniente, esta orden de caballeros se ha hecho una reputación cazando engendros, esos vampiros que se convirtieron en monstruos después de sucumbir a su Bestia.#!"
 knights_black_cross_maa: "Caballeros de la Cruz Negra"
 knights_black_cross_maa_flavor: "#F La Orden de Caballeros Cainitas que subvierte la Orden Teutónica mortal, la Cruz Negra es el principal brazo militar de los Ventrue alemanes. Formados y entrenados por Lord Jürgen von Verden, son la fuerza de combate más respetada del clan.#!"
 knights_avalon_maa: "Caballeros de Ávalon"
 knights_avalon_maa_flavor: "#F Modelándose a sí mismos según los Caballeros de la Mesa Redonda, estos honorables guerreros se han vinculado a Mitras. El Rey Dios de Inglaterra les ha encomendado la tarea de matar a los diversos enemigos que amenazan su dominio, ya sean Engendros, Licántropos, cazadores de brujas o de naturaleza aún más esquiva.#!"
 woodwose_savages_maa: "Salvajes de Woodwose"
 woodwose_savages_maa_flavor: "#F Los Salvajes son un grupo de caballeros no-muertos que ya no se adhieren a las reglas de la caballería o los códigos de conducta caballeresca. En cambio, forman bandas nómadas que viajan de aldea en aldea, tomando lo que les place y castigando a cualquiera que se atreva a sugerir que un determinado calderón/cruz de oro ornamentada/mujer joven no es suyo para tomar.#!"
 knights_shroud_maa: "Caballeros del Sudario"
 knights_shroud_maa_flavor: "#F Patrocinados por el propio Al-Ashrad, estos 'Caballeros Hechiceros' actúan como su vanguardia para luchar contra lo infernal y otras amenazas menos obvias para los Banu Haqim.#!"
 knights_blood_maa: "Caballeros de la Sangre"
 knights_blood_maa_flavor: "#F Formados durante los días oscuros de las invasiones bárbaras, los Caballeros de la Sangre son aquellos Ventrue que rechazaron las tradiciones de su clan para centrarse en cambio en el poder militar a toda costa. Entrenándose incesantemente para la guerra, son ferozmente leales al clan en su conjunto, aunque a menudo demasiado celosos para los gustos de los otros Ventrue.#!"
 valkyries_maa: "Valquirias"
 valkyries_maa_flavor: "#F Un grupo de mujeres guerreras, son literalmente las que eligen a los caídos, y su título y cargo datan de cuando los vampiros aún podían institucionalizarse en una religión. El papel de las Valquirias era el de hados de batalla: podían aparecer en una batalla importante para inclinar la balanza a favor de uno de los bandos. Hoy en día, siguen siendo la principal fuerza de élite de los vampiros Einherjar contra la invasión cristiana.#!"
 order_rose_sable_maa: "Orden de la Rosa Sable"
 order_rose_sable_maa_flavor: "#F Una suborden secreta dentro de los Caballeros Hospitalarios, estos caballeros ghouls altamente consumados son respetados y buscados por su destreza militar. Su patrón Toreador ha logrado hasta ahora evitar verse obligado a doblegarse ante las muchas fuerzas externas que intentan controlar la Orden. #!"
 knights_rose_sable_maa: "Hermandad de la Rosa Sable"
 knights_rose_sable_maa_flavor: "#F Formada en 1125 d.C. a partir de un grupo de nobles caballeros viajeros que se dirigían a unirse a la Cruzada, los Caballeros son conocidos por sus armaduras y armas artísticamente elaboradas. Sus creencias heréticas no se muestran abiertamente y pueden operar en la sociedad mortal para su amo, el Toreador Andrew.#!"
 disciples_anubis_maa: "Discípulos de Anubis"
 disciples_anubis_maa_flavor: "#F Los Discípulos de Anubis son un antiguo grupo de Cainitas dentro de Egipto. Rastrean sus orígenes hasta un methuselah Gangrel llamado Anpu, que fue amigo y aliado de Osiris en su lucha contra Set. Su progenie apoya la $glossary_osirian_league$ de Horus, teniendo fuertes lazos tanto con los Pasos Silenciosos Licántropos como con el culto mortal de Isis. #!"
 disciples_anubis_maa_upgraded: "Discípulos Vengativos de Anubis"
 disciples_anubis_maa_upgraded_flavor: "#F Los Discípulos de Anubis son un antiguo grupo de Cainitas dentro de Egipto. Rastrean sus orígenes hasta un methuselah Gangrel llamado Anpu, que fue amigo y aliado de Osiris en su lucha contra Set. Su progenie apoya la $glossary_osirian_league$ de Horus, teniendo fuertes lazos tanto con los Pasos Silenciosos Licántropos como con el culto mortal de Isis. #!"
 warrior_setites_maa: "Setitas Guerreros"
 warrior_setites_maa_flavor: "#F No todos los Seguidores de Set son seductores sutiles de lengua bífida. Un número de ellos prefiere seguir un camino más marcial, convirtiéndose en guerreros sagrados para su dios. Los Setitas Guerreros evitan la Disciplina de Ofuscación por Potencia — nada de esquivar en la oscuridad para estas serpientes. Son soldados orgullosos y brutales para Set, y están perfectamente dispuestos a entrar en batalla para respaldar a sus hermanos más sutiles. #!"
 lions_rodrigo_maa: "Leones de Rodrigo"
 lions_rodrigo_maa_flavor: "#F Dedicados a la causa de la Sombra de la Reconquista, estos 'caballeros' quieren la aniquilación total de todos los [Glossary('Ashirra','game_concept_ashirra_desc')] dentro de la Península Ibérica. Su crueldad les ha valido muchas victorias pero también muchos enemigos inmortales, y no solo entre los Ashirra.#!"

 knights_templar_maa: "Caballeros Templarios"
 knights_templar_maa_flavor: "#F A pesar de estar abrumados por la influencia sobrenatural competidora, los Templarios siguen siendo una fuerza de combate temible.#!"
 knights_hospitaler_maa: "Caballeros Hospitalarios"
 knights_hospitaler_maa_flavor: "#F El ideal del 'caballero cruzado virtuoso' está bien arraigado en la Orden del Hospital de San Juan de Jerusalén. Admirados o vilipendiados, son combatientes respetados.#!"
 teutonic_knights_maa: "Caballeros Teutónicos"
 teutonic_knights_maa_flavor: "#F Los Cruzados del Norte tienen una reputación de codicia y celo despiadado. Sin embargo, su dureza es casi incomparable entre los guerreros de Dios.#!"
 knights_calatrava_maa: "Caballeros de Calatrava"
 knights_calatrava_maa_flavor: "#F La orden militar española es un firme aliado de la Reconquista cristiana, aunque a veces desviada por aquellos que conspiran en las sombras de los reyes y reinas de Iberia.#!"
 knights_livonia_maa: "Caballeros de Livonia"
 knights_livonia_maa_flavor: "#F Los Portaespadas de Livonia están abiertos a personas de cualquier rango. Esto ha ayudado a que sus números aumenten, pero la calidad (y el carácter moral) de la orden ha sufrido bastante debido a esta elección.#!"
 knights_st_thomas_maa: "Caballeros de Santo Tomás de Acre"
 knights_st_thomas_maa_flavor: "#F Esta pequeña orden militar inglesa enfrenta presiones de la Iglesia para fusionarse con los Templarios o los Hospitalarios. Ha encontrado protección en la Inquisición Sombría gracias a sus propias investigaciones sobre lo sobrenatural en Tierra Santa.#!"
 knights_st_catherine_maa: "Caballeros de Santa Catalina del Sinaí"
 knights_st_catherine_maa_flavor: "#F Esta menguante orden ha sido casi aniquilada por ataques extraños pero mortales en las últimas décadas. Viendo la marca de la participación sobrenatural, la Inquisición Sombría ha protegido a sus maltrechos restos.#!"
 knights_st_helena_maa: "Damas Caballeros de Santa Elena"
 knights_st_helena_maa_flavor: "#F Esta orden autoproclamada no tiene la bendición de la Iglesia. Despreciadas y ridiculizadas por el orden establecido, su reputación virtuosa les ha ayudado a escapar de la resistencia, pero el descontento por su propia existencia crece día a día, con recompensas que ahora se ofrecen por cualquier caballero que lleve (a veces por la fuerza) a algunas de estas mujeres cabezotas a conventos.#!"
 twilight_light_footmen_maa: "Escaramuzadores del Crepúsculo"
 twilight_light_footmen_maa_flavor: "#F La unidad de guerrilla de élite de un gobernante aspirante que quiere demostrar ser un maestro de las Guerras del Crepúsculo.#!"
 midnight_light_footmen_maa: "Escaramuzadores de la Medianoche"
 midnight_light_footmen_maa_flavor: "#F Una turba de infantería apenas entrenada lanzada contra el enemigo cuando se acaban los miramientos. Utilizados principalmente como distracción o para abrumar con su gran número.#!"
 twilight_archers_maa: "Arqueros del Crepúsculo"
 twilight_archers_maa_flavor: "#F Los francotiradores de élite de un maestro de las Guerras del Crepúsculo, listos para defender a su señor en desafíos formales o en el campo de batalla.#!"
 midnight_archers_maa: "Arqueros de la Medianoche"
 midnight_archers_maa_flavor: "#F En el caos de las Guerras de Medianoche, a veces es suficiente darle un arco a alguien y señalar la dirección general del enemigo.#!"
 twilight_light_horsemen_maa: "Caballería Ligera del Crepúsculo"
 twilight_light_horsemen_maa_flavor: "#F Los maestros de las Guerras del Crepúsculo emplean unidades de caballería ligera con grandes resultados, utilizando la velocidad y las tácticas de golpear y huir como ningún otro.#!"
 midnight_light_horsemen_maa: "Caballería Ligera de la Medianoche"
 midnight_light_horsemen_maa_flavor: "#F Flanquear con una unidad de caballería ligera considerable siempre puede ser efectivo, incluso cuando dicha caballería ligera fue reunida apresuradamente.#!" 
 twilight_pikemen_maa: "Piqueros del Crepúsculo"
 twilight_pikemen_maa_flavor: "#F La guardia de élite de participantes experimentados en las Guerras del Crepúsculo, estos soldados han perfeccionado sus habilidades hasta niveles casi sobrenaturales.#!" 
 midnight_pikemen_maa: "Piqueros de la Medianoche"
 midnight_pikemen_maa_flavor: "#F Una turba de campesinos armados con horcas lanzados contra los enemigos con la esperanza de que ocurra algo bueno (para su amo secreto, no para ellos).#!"
 twilight_armored_footmen_maa: "Infantería del Crepúsculo"
 twilight_armored_footmen_maa_flavor: "#F Los peones en el tablero de ajedrez de un Maestro de Guerra del Crepúsculo. Peones muy blindados y muy hábiles, pero peones al fin y al cabo.#!"
 midnight_armored_footmen_maa: "Infantería de la Medianoche"
 midnight_armored_footmen_maa_flavor: "#F Una abundancia de armadura de buena calidad combinada con una falta de habilidad y entrenamiento conduce a... resultados mixtos.#!"
 twilight_armored_horsemen_maa: "Catafractos del Crepúsculo"
 twilight_armored_horsemen_maa_flavor: "#F El golpe de gracia en cualquier Guerra del Crepúsculo a menudo lo asestan esos guerreros de élite equipados con lo mejor que su señor puede ofrecer.#!"
 midnight_armored_horsemen_maa: "Catafractos de la Medianoche"
 midnight_armored_horsemen_maa_flavor: "#F Una carga impresionante puede cambiar el rumbo de muchas Guerras de Medianoche. Lamentablemente, estos jinetes están mejor equipados que entrenados.#!"
 massghouls_maa: "Turba Ghouleada"
 massghouls_maa_flavor: "#F Una turba de mortales alimentados apresuradamente con sangre vampírica y dirigidos hacia el enemigo más cercano. Los resultados pueden variar.#!"
 
 lesser_ushabti_maa: "Ushabti Menores"
 lesser_ushabti_maa_flavor: "#F Figuras de pequeñas criaturas como ratas o gorriones. Su inteligencia limitada y sus capacidades de combate se ven contrarrestadas por la facilidad de crearlos.#!"
 medium_ushabti_maa: "Ushabti Medianos"
 medium_ushabti_maa_flavor: "#F Figuras de criaturas de tamaño mediano como gatos, perros o cobras. Son más leales y tenaces que las criaturas menores, pero más difíciles de hacer.#!" 
 overseer_ushabti_maa: "Ushabti Supervisor"
 overseer_ushabti_maa_flavor: "#F Una forma más inteligente de servidor, los Ushabti Supervisores son capaces de comandar a sus contrapartes menores, lo que los convierte en un componente crítico en la formación de batalla de una Momia.#!" 
 great_ushabti_maa: "Grandes Ushabti"
 great_ushabti_maa_flavor: "#F Ushabti de tamaño imponente, hasta el de un elefante, estas raras y preciosas construcciones son capaces de aplastar formaciones enemigas con facilidad.#!" 
 guard_ushabti_maa: "Ushabti Guardia"
 guard_ushabti_maa_flavor: "#F Guardianes de las tumbas de las Momias más poderosas, este tipo de construcción es ampliamente temido por su tenacidad y su increíble resistencia.#!"
 terracottan_fodder_maa: "Soldados de Terracota"
 terracottan_fodder_maa_flavor: "#F Lo más bajo del ejército inmortal de Qin Shi Huang, proporcionando la columna vertebral del ejército de figurillas de una Momia.#!"
 terracottan_warriors_maa: "Guerreros de Terracota"
 terracottan_warriors_maa_flavor: "#F Renombrados soldados del ejército inmortal de Qin Shi Huang, ahora sirviendo a la voluntad de una Momia Oriental.#!"
 terracottan_scouts_maa: "Carros de Terracota"
 terracottan_scouts_maa_flavor: "#F Aunque el estilo de guerra en el que prosperaron ha desaparecido hace mucho, la eficiencia de estas figurillas sigue siendo más que suficiente para ser útiles.#!"
 terracottan_knights_maa: "Caballería de Terracota"
 terracottan_knights_maa_flavor: "#F Incluso los caballos tienen sus propias pequeñas figurillas, listas para ser convocadas una y otra vez para seguir las órdenes de su amo inmortal.#!"
 terracottan_guards_maa: "Campeones de Terracota"
 terracottan_guards_maa_flavor: "#F Lo mejor de lo que una vez fue el ejército más grande jamás visto, reducido a figurillas manejadas por la voluntad de los descendientes de los Ocho Inmortales.#!"
 ravnos_kshatriya_maa: "Ravnos Kshatriya"
 ravnos_kshatriya_maa_flavor: "#F La casta guerrera de los Ravnos ha estado enzarzada en una guerra total contra los [Glossary('Asuratizayya','game_concept_kuei_jin_desc')] desde que la memoria alcanza. Esto los ha convertido en luchadores fuertes y disciplinados.#!" 
 lamia_warmaidens_maa: "Gorgonas Lamia"
 lamia_warmaidens_maa_flavor: "#F Las mujeres guerreras de Lilith luchan con furia, ya sea en defensa de sus pupilos Cappadocios o por la gloria de la Madre Oscura.#!"
 agitators_maa: "Agitadores Brujah"
 agitators_maa_flavor: "#F Nombrados por primera vez en honor al contingente de rebeldes (y bandidos) de Robin Leeland, los Agitadores se han convertido en un término general para aquellos Brujah que buscan poner de rodillas al orden actual.#!"
 corsairs_lasombra_maa: "Corsarios Lasombra"
 corsairs_lasombra_maa_flavor: "#F Todos los Lasombra sienten la llamada del mar en algún momento de su no-muerte. La mayoría responden con bravuconería, espada en mano mientras abordan otros barcos al amparo de la noche.#!"
 salubri_warriors_maa: "Salubri Guerreros"
 salubri_warriors_maa_flavor: "#F La prole de Samiel lucha contra el mal desde la noche en que fue creada. Su líder puede haber desaparecido, pero su deber continúa.#!"
 web_assassins_maa: "Asesinos de la Red de Cuchillos"
 web_assassins_maa_flavor: "#F La secreta Red de Cuchillos rara vez sale al campo de batalla. Cuando es absolutamente necesario, sin embargo, se convierten en guerreros especializados preocupantemente efectivos.#!"
 tmr_column_maa: "Columna Vampírica"
 tmr_column_maa_flavor: "#F Las Columnas son la unidad básica de las operaciones de la Mano Negra. Formadas y dirigidas por dominios, las columnas son permanentes pero varían en tamaño. Los dominios reúnen asociaciones de varios equipos de ataque (conocidos como kamut) que consisten en una docena de agentes, según los parámetros de la misión.#!"
 ravnos_purified_maa: "Los Purificados"
 ravnos_purified_maa_flavor: "#F Una secta radical de Ravnos dedicada a luchar contra amenazas sobrenaturales, los Purificados son maestros de la guerra de guerrillas.#!"
 ghouled_cultists: "Fanáticos Ghouleados"
 ghouled_cultists_flavor: "#F Mortales fanáticamente devotos de su Dios Cainita, a quienes se les da la sangre como la recompensa definitiva por su completa devoción.#!"
 anda_jagun_maa: "Anda Jagun"
 anda_jagun_maa_flavor: "#F Una unidad del ejército mongol de 100 hombres, este Jagun está reforzado por miembros del linaje [Glossary('Anda','podgloss.anda')], lo que otorga a estos arqueros a caballo una reputación aún más temible de lo habitual.#!"

 the_leviathan: "El Leviatán"
 the_leviathan_flavor: "#F El Leviatán se describe como una marea de oscuridad, una legión de zarcillos con un agarre de piedra. La oscuridad es su fuerza, y cuando atrapa a sus víctimas, la negrura es completa. Aquellos lo suficientemente desafortunados como para ser atrapados por el abrazo de la criatura pueden oír los gritos y los ecos atrapados de la desesperación expresada hace mucho tiempo por penitentes torturados.#!"
 army_of_leviathans: "El Leviatán"

 the_dragon_kung_kung: "Kung Kung"
 the_dragon_kung_kung_flavor: "#F El gran dragón Kung Kung que una vez desalojó los Pilares del Cielo e inundó el mundo. Fue un amigo cercano de Wan Kung Yi y lo ayudó durante su fatídica batalla final contra los reunidos sobrenaturales. Nunca se le volvió a ver, aparentemente esperando que un alma digna de la de su amigo apareciera una vez más.#!"

 celestial_army: "Ejército Celestial"
 celestial_army_flavor: "#F La poderosa hueste de cazadores de demonios que una vez se reunió para vengar la muerte de Wan Kung Yi. Si bien perdieron su enfoque y se volvieron insensibles, su destreza en la batalla nunca estuvo en duda.#!"
 
 pharaohs_sentry: "Centinela del Faraón"
 pharaohs_sentry_flavor: "#F Los Centinelas del Faraón son cadáveres reanimados y sin emociones que sirven para siempre el edicto del hechicero, actuando como guerreros y guardias vigilantes sin escrúpulos morales contra matar, ni miedo a morir en el servicio.#!"
 
 sheddim_maa: "Sheddim"
 sheddim_maa_flavor: "#F Entidades misteriosas de 'fuera de este mundo'. Están aparentemente hechos de fuego pero son sensibles y albergan un odio ardiente por la Creación de Dios.#!"

 stone_lions: "Leones de Piedra"
 stone_lions_flavor: "#F Las bestias guardianas de templos y santuarios han cobrado vida por voluntad del Hambriento.#!"

 illusionary_combatants: "Combatientes Ilusorios"
 illusionary_combatants_flavor: "#flavor Una ilusión de combatientes fuertemente blindados, capaces de atraer la atención hacia ellos de manera efectiva.#!"
 
 black_crows_maa: "Cuervos Negros"
 black_crows_maa_flavor: "#F El grupo personal de escaramuzadores de Yidu. Compuesto por mortales ferozmente leales y jóvenes Erk, los Cuervos Negros evitan la armadura pesada en favor de la velocidad y la letalidad.#!

 dragon_fiends_maa: "Demonios Dragón"
 dragon_fiends_maa_flavor: "#F Estos moldeadores de carne Tzimisce se deleitan en ver cuánto tiempo les lleva a sus enemigos sobrevivir a la deformación constante de su propia carne.#!"
 
 knights_jordi_alfama_maa: "Caballeros de Sant-Jordi d'Alfama"
 knights_jordi_alfama_maa_flavor: "#F Fundada en Aragón en 1201, esta orden ayuda a administrar Mallorca después de su captura por Aragón. El clan Lasombra tiene un punto de apoyo sustancial dentro de la orden, ejerciendo gran parte de su influencia a través de ghouls de alto rango.#!"