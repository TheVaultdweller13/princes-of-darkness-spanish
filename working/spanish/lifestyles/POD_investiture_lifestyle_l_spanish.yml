l_spanish:
 game_concept_investiture_lifestyle: "Investidura"
 game_concept_investiture_lifestyle_desc: "Las #bold Investiduras#! son las habilidades blasfemas de los #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Infernalistas#!#!: individuos que se relacionan con $POD_splat_demon_plural$. Belleza, poder, longevidad y más aguardan a aquellos que están dispuestos a manchar sus almas.\n\nHay dos formas de ganar Investidura: firmando un [demonic_pact|E] con un demonio para entrar en [thralldom|E], o mediante la [diabolism_binding|E] de un demonio para tomar su poder por la fuerza. Ambos enfoques requieren primero el conocimiento de [GetTrait('demonology').GetName(GetNullCharacter)], que puede aprenderse mediante un [journey|E].\n\nEl infernalismo es considerado un [crime|E] por todas las [faiths|E] excepto las más malvadas."
 
 investiture_lifestyle_name: "Investidura"
 investiture_lifestyle_desc: "Centrarse en las habilidades otorgadas por los demonios."
 monthly_investiture_lifestyle_xp_gain_mult: "[experience|E] mensual de [lifestyle|E] de Investidura"
 
 demonic_investment_focus: "Enfoque en Investidura Demoníaca"
 demonic_investment_focus_modifier: "[GetFocus('demonic_investment_focus').GetName]"
 demonic_investment_focus_desc: "#X Los puntos de [perk|E] de [lifestyle|E] de [investiture_lifestyle|E] #bold SOLO#! se ganan mediante [demonic_pacts|E] o [diabolism|E].#!"
 demonic_investment_focus_effect_desc: "Centrarse en este estilo de vida es imposible."
 
 investments_of_soul_focus: "Enfoque en Investiduras del Alma"
 investments_of_soul_focus_modifier: "[GetFocus('investments_of_soul_focus').GetName]"
 investments_of_soul_focus_desc: "Favores de los [Glossary('Yama Kings','podgloss.yamaking')]."
 investments_of_soul_focus_effect_desc: "Centrarse en Investiduras del Alma otorga:"
 
 GAINS_INVESTITURE_LIFESTYLE_XP: "Gana $VALUE|V0$ de experiencia de [investiture_lifestyle|E]"
 GAINED_INVESTITURE_LIFESTYLE_XP: "Ganó $VALUE|V0$ de experiencia de [investiture_lifestyle|E]"
 I_GAIN_INVESTITURE_LIFESTYLE_XP: "Ganas $VALUE|V0$ de experiencia de [investiture_lifestyle|E]"
 I_GAINED_INVESTITURE_LIFESTYLE_XP: "Ganaste $VALUE|V0$ de experiencia de [investiture_lifestyle|E]"
 TARGET_GAINS_INVESTITURE_LIFESTYLE_XP: "[CHARACTER.GetShortUIName] gana $VALUE|V0$ de experiencia de [investiture_lifestyle|E]"
 TARGET_GAINED_INVESTITURE_LIFESTYLE_XP: "[CHARACTER.GetShortUIName] ganó $VALUE|V0$ de experiencia de [investiture_lifestyle|E]"

 GAINS_A_INVESTITURE_LIFESTYLE_PERKPOINT: "Gana $VALUE|V0$ desbloqueo de [perk|E] de [investiture_lifestyle|E]"
 GAINED_A_INVESTITURE_LIFESTYLE_PERKPOINT: "Ganó $VALUE|V0$ desbloqueo de [perk|E] de [investiture_lifestyle|E]"
 I_GAIN_A_INVESTITURE_LIFESTYLE_PERKPOINT: "Ganas $VALUE|V0$ desbloqueo de [perk|E] de [investiture_lifestyle|E]"
 I_GAINED_A_INVESTITURE_LIFESTYLE_PERKPOINT: "Ganaste $VALUE|V0$ desbloqueo de [perk|E] de [investiture_lifestyle|E]"
 TARGET_GAINS_A_INVESTITURE_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName] gana $VALUE|V0$ desbloqueo de [perk|E] de [investiture_lifestyle|E]"
 TARGET_GAINED_A_INVESTITURE_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName] ganó $VALUE|V0$ desbloqueo de [perk|E] de [investiture_lifestyle|E]"
 
