 ############################################################
 ############################################################

 investments_of_soul_visible: "Investiduras del Alma"

 NEEDS_COMMUNE_WITH_THE_YAMA_KINGS_TEXT: "@warning_icon!#X Necesitas comulgar con los [Glossary('Yama Kings','podgloss.yamaking')] situados en la [umbra|E] - [UmbraGlossary('yomi_wan')] para desbloquear esta ventaja.#!"
 NEEDS_BE_CHI_USER_FOR_FOCUS_TEXT: "@warning_icon!#X Necesitas ser un usuario de chi para elegir este enfoque#!\n"
 
 mask_of_yomi_perk_name: "La Máscara de Yomi"
 black_whispers_perk_name: "Susurros negros"
 ebon_fountain_perk_name: "La Fuente de Ébano"
 luck_of_yomi_perk_name: "Suerte de Yomi"
 savage_kiss_perk_name: "El Beso Salvaje"
 union_of_oppositions_perk_name: "La Unión de Oposiciones"
 iron_hands_perk_name: "Las Manos de Hierro"
 breath_of_knowledge_perk_name: "El Aliento del Conocimiento"
 touch_of_yama_kings_perk_name: "El Toque de los [Glossary('Yama Kings','podgloss.yamaking')]"
 unfolding_scarlet_lotus_perk_name: "Loto Escarlata Desplegándose"

 MASK_OF_YOMI_PERK_EFFECT: "El rasgo [GetTrait('witch').GetName( GetPlayer )] se ocultará automáticamente al ser expuesto\nRevierte todos los cambios de apariencia forzados por la investidura\n#F Las Investiduras del personaje ya no exhiben señales reveladoras. Ninguna cantidad de sondeo mental, visión del alma o detección de la verdad puede asegurar que el personaje es un [akuma|E] o forzarla a traicionar sus actividades injustas.#!"
 BLACK_WHISPERS_PERK_EFFECT: "Como [character_interaction|E], te permite conocer cada secreto e intriga del objetivo.\n#F Los espías de los [Glossary('Yama Kings','podgloss.yamaking')] están en todas partes, y lo que sus [akuma|E] no ven ni oyen, sus esbirros espirituales lo aprenden.#!"
 EBON_FOUNTAIN_PERK_EFFECT: "Pierdes 10 de [stress|E] cada mes\n#F El P'o del personaje está conectado a un manantial de poder demoníaco.#!"
 LUCK_OF_YOMI_PERK_EFFECT: "Como [decision|E], te permite gastar puntos de investidura para ganar oro y prestigio. Si ya has desbloqueado la decisión, recompensará con más oro.\n#F Los Reyes Yama alteran el joss del personaje, y la fortuna sonríe al [akuma|E] como resultado.#!"
 SAVAGE_KISS_PERK_EFFECT: "#F El alma del personaje es sometida a las caricias de los Mukade.#!"
 UNION_OF_OPPOSITIONS_PERK_EFFECT: "#F Los [Glossary('Yama Kings','podgloss.yamaking')] ponen sus manos sobre el personaje y este es remodelado.#!"
 IRON_HANDS_PERK_EFFECT: "#F El personaje ahora se mueve con el poder de los [Glossary('Yama Kings','podgloss.yamaking')] tras ella.#!"
 BREATH_OF_KNOWLEDGE_PERK_EFFECT: "#F Los [Glossary('Yama Kings','podgloss.yamaking')] susurran su conocimiento a los oídos del personaje, y este arde en su cerebro como hierro al rojo vivo.#!"
 TOUCH_OF_YAMA_KINGS_PERK_EFFECT: "#F El toque del [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] está sobre el personaje.#!"
 UNFOLDING_SCARLET_LOTUS_PERK_EFFECT: "Ignora el requisito de nivel de [Glossary('Dharma','podgloss.dharma')] para elegir ventajas de arte.\n#F Las Perdiciones susurran al personaje los secretos de su estado exaltado.#!"
