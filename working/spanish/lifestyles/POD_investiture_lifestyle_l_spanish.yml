 demonic_investment_visible: "Investiduras Demoníacas"

 INVESTITURE_COST_EFFECT: "#clickable Esta [perk|E] cuesta $VALUE|V0$ [Select_CString( EqualTo_CFixedPoint( '(CFixedPoint)$VALUE|q$', '(CFixedPoint)1' ), 'punto', 'puntos' )] de ventaja#!"
 INVESTITURE_STACKING_EFFECT: "#clickable Esta [perk|E] se puede comprar muchas veces.#!"
 INVESTITURE_VISUAL_CHANGE_EFFECT: "#N ¡Esta [perk|E] cambiará permanentemente tu apariencia!#!"

 investiture_armor_perk_name: "Armadura #low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_armor_perk_modifier_stacks')])#!"
 investiture_backgrounds_perk_name: "Trasfondos #low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_backgrounds_perk_modifier_stacks')])#!"
 investiture_demonic_strength_perk_name: "Fuerza demoníaca #low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_demonic_strength_perk_modifier_stacks')])#!"
 investiture_longevity_perk_name: "Longevidad #low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_longevity_perk_modifier_stacks')])#!"
 investiture_service_perk_name: "Servicio #low ([ROOT.Char.MakeScope.ScriptValue('POD_investiture_service_perk_modifier_stacks')])#!"

 INVESTITURE_ARMOR_PERK_EFFECT: "#flavor Como un engendro, este adorador del diablo posee piel escamosa, verrugas gruesas, cuero curtido o alguna otra forma de protección repugnante.#!"
 INVESTITURE_BACKGROUNDS_PERK_EFFECT: "#flavor Algunos #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Infernalistas#!#! prefieren una ayuda más... sutil de su patrón. Y los contactos encajan perfectamente para tales necesidades.#!"
 INVESTITURE_DEMONIC_STRENGTH_PERK_EFFECT: "#flavor La vitalidad maligna inunda los miembros del suplicante. Desde este momento hasta su muerte, tiene el poder físico de un diablo menor.#!"
 INVESTITURE_LONGEVITY_PERK_EFFECT: "#flavor La mayoría de los #TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L Infernalistas#!#! temen morir. Y realizar un pequeño sacrificio de inocentes para prolongar su propia vida se ajusta a ese objetivo.#!"
 INVESTITURE_SERVICE_PERK_EFFECT: "#flavor En una ironía digna del Infierno, un esclavo del Abismo puede 'comprar' esclavos del Abismo. Estas criaturas vinculadas aparecen al lado del [GetTrait('witch').GetName(GetPlayer)] y preguntan: 'Maestro, ¿cuál es tu voluntad?'. Sin duda, él tendrá alguna tarea preparada...#!"
 INVESTITURE_SERVICE_PERK_IMPS_EFFECT: "Desbloquea [GetMaA('imps').GetName] como [men_at_arms|E]."
 INVESTITURE_SERVICE_PERK_MALEBRANCHE_EFFECT: "Desbloquea [GetMaA('malebranche').GetName] como [men_at_arms|E]."
 INVESTITURE_SERVICE_PERK_LUCIFERGIA_EFFECT: "Desbloquea [GetMaA('lucifergia').GetName] como [men_at_arms|E]."
 INVESTITURE_SERVICE_PERK_WAR_SERVITORS_EFFECT: "Desbloquea [GetMaA('war_servitors').GetName] como [men_at_arms|E]."
 INVESTITURE_SERVICE_PERK_HINT_EFFECT: "#italic (Se pueden desbloquear más tipos de tropas invirtiendo más puntos de [perk|E])#!"

 investiture_claws_and_horns_perk_name: "Garras y cuernos"
 investiture_goat_feet_perk_name: "Pies de cabra"
 investiture_panpipe_voice_perk_name: "Voz de flauta de Pan"

 INVESTITURE_CLAWS_AND_HORNS_PERK_EFFECT: "Inflige [GetPlayer.MakeScope.ScriptValue('POD_investiture_claws_and_horns_perk_damage')] de [POD_superficial_damage_with_box|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante los [single_combat_duel_plural|E].\n#flavor Garras o cuernos brotan del cuerpo del suplicante, resultando en una apariencia inhumana.#!"
 INVESTITURE_GOAT_FEET_PERK_EFFECT: "#flavor Tras besar a su Patrón (no preguntes dónde), un Infernalista asume los pies hendidos del Diablo. Tras esta transformación insoportable (que lleva varios minutos), el Infernalista puede trotar o correr más rápido que un hombre; y patear o pisotear a sus enemigos con las pezuñas.#!"
 INVESTITURE_PANPIPE_VOICE_PERK_EFFECT: "Inflige 25 de [static_stress|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante los [single_combat_duel_plural|E].\n#flavor Con palabras o canciones sencillas, una moza juramentada por el alma puede embelesar a su audiencia. Una vez vinculada, la víctima pierde su buena naturaleza; se vuelven lujuriosos, casi ebrios en su temperamento.#!"

 investiture_beast_form_perk_name: "Forma de bestia"
 investiture_hellfire_perk_name: "Fuego infernal"
 investiture_invulnerability_perk_name: "Invulnerabilidad"
 investiture_serpent_skin_perk_name: "Piel de serpiente"
 investiture_wings_perk_name: "Alas"

 INVESTITURE_BEAST_FORM_PERK_EFFECT: "Desbloquea varios cambios de forma animalistas.\n#flavor Al invocar a su Patronus, un adorador del diablo puede transformarse en una de las bestias más viles (una rata, un gato, un lobo, etc.).#!"
 INVESTITURE_HELLFIRE_PERK_EFFECT: "Inflige [GetPlayer.MakeScope.ScriptValue('POD_investiture_hellfire_perk_damage')] de [POD_aggravated_damage_with_box|E] de fuego a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante los [single_combat_duel_plural|E].\n#flavor Como un dragón humano, este vendedor de almas puede escupir chorros de fuego sobre sus enemigos. Otros ataques posibles incluyen bilis ácida, sangre caliente, entrañas llameantes u otras sustancias viles.#!"
 INVESTITURE_INVULNERABILITY_PERK_EFFECT: "#flavor Las armas mortales rebotan en la piel del Infernalista con poco efecto.#!"
 INVESTITURE_SERPENT_SKIN_PERK_EFFECT: "Como [character_interaction|E], escapa de [prison|E] al coste de [GetPlayer.MakeScope.ScriptValue('POD_investiture_serpent_skin_perk_damage')] de [POD_superficial_damage_with_box|E].\n#flavor En una espantosa imitación de la serpiente, la Infernalista puede literalmente mudar su piel y escapar de sus ataduras.#!"
 INVESTITURE_WINGS_PERK_EFFECT: "#flavor Al pronunciar una orden blasfema, al suplicante le crecen horribles alas demoníacas entre los omóplatos.#!"

 investiture_devils_eyes_perk_name: "Ojos del Diablo"
 investiture_apportation_perk_name: "Aportación"
 investiture_awareness_perk_name: "Conciencia"
 investiture_luciferian_charm_perk_name: "Encanto luciferino"
 investiture_master_of_the_domain_perk_name: "Maestro del dominio"

 INVESTITURE_DEVILS_EYES_PERK_EFFECT: "Como [character_interaction|E], genera una [epidemic|E] en la ubicación actual del objetivo.\n#flavor Con una mirada, un Infernalista puede agriar la leche, pudrir el grano y enfermar a los niños. Aunque el poder de los Ojos es inútil contra los adultos (que se sienten incómodos bajo su influencia, no obstante), puede diezmar una aldea destruyendo sus reservas de comida justo antes del invierno.#!"
 INVESTITURE_APPORTATION_PERK_EFFECT: "Como [character_interaction|E], roba el [artifact|E] de un objetivo al coste de 2 puntos de [perk|E] de [investiture_lifestyle|E].\n#flavor Con este 'don', el buscador del infierno puede encantar un solo objeto, vinculándolo a sí mismo. Desde el momento del encantamiento en adelante, puede invocar ese objeto desde cualquier lugar del mundo mortal (pero no a través de la Celosía). El objeto debe ser lo suficientemente pequeño y ligero como para caber en una mano, pero puede ser cualquier cosa, mágica o no.#!"
 INVESTITURE_AWARENESS_PERK_EFFECT: "#flavor Con un choque que destroza la mente, el demonio abre de par en par las puertas de la percepción oculta, otorgando a un Infernalista un conocimiento instintivo de los secretos que le rodean.#!"
 INVESTITURE_LUCIFERIAN_CHARM_PERK_EFFECT: "#flavor Literalmente un diablo encantador, un Infernalista con esta Investidura puede salirse con la suya en casi cualquier cosa. No importa lo que diga o haga, asombra a todos los que conoce.#!"
 INVESTITURE_MASTER_OF_THE_DOMAIN_PERK_EFFECT: "#flavor El Patrón de un Infernalista le otorga un 'don' que le permite saber siempre lo que está sucediendo a 500 pies dentro de su dominio como si estuviera observando desde arriba.#!"

 investiture_sign_of_the_inferno_perk_name: "Signo del Infierno"
 investiture_uncanny_beauty_perk_name: "Belleza inquietante"
 investiture_teleportation_perk_name: "Teletransporte"
 investiture_invisibility_to_animals_perk_name: "Invisibilidad para los animales"

 INVESTITURE_SIGN_OF_THE_INFERNO_PERK_EFFECT: "Te vuelves inmune al fuego.\n#flavor Besado por el Infierno, este diabolista no necesita temer a las llamas. Ningún calor o fuego puede dañarle de ninguna manera; puede consumir su ropa y posesiones, pero no deja cicatrices en su carne.#!"
 INVESTITURE_UNCANNY_BEAUTY_PERK_EFFECT: "#flavor La tentación a menudo viste un esplendor terrible. A cambio de un pecado o dos, el suplicante asume una belleza sobrenatural e irresistible.#!"
 INVESTITURE_TELEPORTATION_PERK_EFFECT: "Como [character_interaction|E], te permite teletransportar a tu ejército a la ubicación de tu objetivo, o teletransportarte a tu próximo destino cuando viajes.\n#flavor Cuando la necesidad de estar en todas partes a la vez es insoportable para un Infernalista, su Patrón infernal puede otorgarle un poder que satisfaga su necesidad, pero recuerda que ningún regalo es gratuito.#!"
 INVESTITURE_INVISIBILITY_TO_ANIMALS_PERK_EFFECT: "Inflige el [modifier|E] [GetModifier('POD_investiture_invisibility_to_animals_perk_modifier').GetNameWithTooltip] al [ruler|E] enemigo cuando actúes como [commander|E] durante la [combat_phase|E].\n#flavor Tan terrible es el aura del Infernalista que todos los animales que los percibirían reprimen instantáneamente ese recuerdo.#!"

 investiture_bond_breaking_perk_name: "Ruptura de vínculos"
 investiture_shameful_sight_perk_name: "Visión vergonzosa"
 investiture_journey_to_the_spirit_realm_perk_name: "Viaje al reino espiritual"

 INVESTITURE_BOND_BREAKING_PERK_EFFECT: "Como [character_interaction|E], haz que el objetivo pierda todos los [hooks|E] que posea.\n#flavor La mano de Surgat guía a este Infernalista; las cerraduras, nudos o ataduras normales se abren cuando ella los acaricia.#!"
 INVESTITURE_SHAMEFUL_SIGHT_PERK_EFFECT: "#flavor Mirando a los ojos de una persona, un Infernalista puede discernir los pecados que yacen más cerca de la superficie. En los 'ojos internos' del Infernalista, surge una imagen del acto, clara como el día. Podría decidir guardarse esa imagen para usarla más tarde, burlarse de ella abiertamente o atormentar a la víctima con una visión de la misma.#!"
 INVESTITURE_JOURNEY_TO_THE_SPIRIT_REALM_PERK_EFFECT: "#flavor Al desprenderse de su piel y carne como si fueran solo una vestimenta, un Infernalista puede abandonar su carne por un día, lo que le permite un acceso superficial a la Umbra.#!"

 investiture_mammons_gift_perk_name: "Don de Mammón"
 investiture_talons_of_the_plague_crow_perk_name: "Garras del cuervo de la plaga"
 investiture_army_of_the_damned_perk_name: "Ejército de los condenados"

 INVESTITURE_MAMMONS_GIFT_PERK_EFFECT: "Como [character_interaction|E], convierte un [artifact|E] en [gold_i]250 de [gold|E].\n#flavor Una vez por noche, el Infernalista puede convertir un pequeño objeto no vivo en oro. (No, las criaturas no muertas no cuentan como 'objetos no vivos').#!"
 INVESTITURE_TALONS_OF_THE_PLAGUE_CROW_PERK_EFFECT: "Como [character_interaction|E], gana [GetModifier('POD_talons_of_the_plague_crow_modifier').GetNameWithTooltip] durante 4 años.\n#flavor Un Infernalista puede, por orden, alargar sus manos en garras de pájaro, haciendo que cualquier acción que no sea de combate sea mucho más difícil pero convirtiéndose en un arma infernal de destrucción masiva.#!"
 INVESTITURE_ARMY_OF_THE_DAMNED_PERK_EFFECT: "Como [character_interaction|E], genera un ejército de 250 [GetMaA('demons').GetName] durante la duración de una [war|E].\n#flavor Del foso vienen y al foso arrojarán a sus enemigos.#!"

 investiture_relentless_perk_name: "Implacable"
 investiture_regeneration_perk_name: "Regeneración"

 INVESTITURE_RELENTLESS_PERK_EFFECT: "#flavor El mismísimo poder del Infierno impulsa al Infernalista hacia su objetivo, sin importar las heridas, sin importar los obstáculos. El Infernalista llegará a donde quiera.#!"
 INVESTITURE_REGENERATION_PERK_EFFECT: "Sana cada año en lugar de cada 2 años.\nHabilita la curación natural para los $POD_splat_vampire_plural$.\n#flavor Uno de los mayores \"dones\" ofrecidos a los mortales, ¡esta Investidura permite a un Infernalista restaurar su salud con un mero esfuerzo de voluntad!#!"

