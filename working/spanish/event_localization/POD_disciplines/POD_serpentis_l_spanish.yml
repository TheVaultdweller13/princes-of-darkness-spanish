l_spanish:

 POD_heart_of_darkness.001.t: "Corazón de las tinieblas"
 POD_heart_of_darkness.001.desc: "Es hora de alejarse aún más de la humanidad. Todo está listo para un ritual oscuro que te permitirá extraer tu propio corazón, convirtiéndote en dueño de tu propio destino, con tu Bestia perdiendo influencia sobre ti. Pero, ¿tienes suficiente valor para continuar?"
 POD_heart_of_darkness.001.option.a: "Ha llegado el momento"
 POD_heart_of_darkness.001.option.a.tt: "Extraerás tu corazón"
 POD_heart_of_darkness.001.option.a.tt.beast: "#beast ¡Un gran error!#!"
 POD_heart_of_darkness.001.option.b: "No estoy preparado"
 POD_heart_of_darkness.001.option.b.tt: "Abandonas tu intento de someterte al ritual"
 POD_heart_of_darkness.001.option.b.tt.beast: "#beast ¡Exacto! ¡No puedes sobrevivir sin mí!#!"

 POD_heart_of_darkness.002.t: "Sin corazón"
 POD_heart_of_darkness.002.desc: "Finalmente está hecho, el ritual se ha completado. Sientes que tus emociones se vuelven más apagadas, lo que facilita la supervivencia. La desventaja es que te resulta más difícil entender a la gente y ahora tus enemigos podrían encontrar tu corazón y destruirlo. Pero el mayor beneficio concierne a la Bestia: ahora está más tranquila, es más fácil de superar."
 POD_heart_of_darkness.002.option.a: "¡Las emociones no tienen control sobre mí!"
 POD_heart_of_darkness.002.option.a.tt: "Has extraído con éxito tu corazón, pero siempre puedes volver a ponértelo en el pecho"

