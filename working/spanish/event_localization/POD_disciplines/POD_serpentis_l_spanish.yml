 # POD_heart_of_darkness.003.option.b.tt.beast: "#beast ¡Me decepcionas!#!"

 #POD_heart_of_darkness.004.t: "Corazón conquistado"
 #POD_heart_of_darkness.004.desc: "¡Tu ritual oscuro ha tenido éxito! [heart_victim.GetFirstName] observó impotente cómo tomabas su corazón, sin poder detener el ritual. Y ahora solo puede esperar que no decidas poner fin a su no-vida. Vuelves a casa con una nueva pieza en tu oscura colección."
 #POD_heart_of_darkness.004.option.a: "Tu vida está en mis manos ahora."
 
 #POD_heart_of_darkness.005.t: "Corazón no conquistado"
 #POD_heart_of_darkness.005.desc: "[heart_victim.GetFirstName] ve a través de tu intriga y te evade. El ritual no ha terminado y pocas cosas pueden compararse con su ira. Escapando por poco con vida, temes lo que [heart_victim.GetFirstName] pueda emprender para vengarse de ti."
 #POD_heart_of_darkness.005.option.a: "¡Es hora de correr!"
 POD_manage_hearts_tooltip: "Ahora puedes gestionar este corazón usando una interacción de personaje sobre ti mismo."