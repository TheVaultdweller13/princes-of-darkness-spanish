 # POD_heart_of_darkness.003.option.a.tt.beast: "#beast ¡Vamos a poseer[heart_victim.GetHerHim]!#!"
 # POD_heart_of_darkness.003.option.a.desc: "El plan se pone en marcha."
 POD_heart_of_darkness.003.option.a.success: "Robas el corazón con éxito."
 POD_heart_of_darkness.003.option.a.failure: "No logras robar el corazón."
 # POD_heart_of_darkness.003.option.a.tt.attacker_wins: "Posees el corazón de [heart_victim.GetFirstName]"
 # POD_heart_of_darkness.003.option.a.tt.defender_wins: "Fracasas espectacularmente y ahora tienes que lidiar con las consecuencias."
 # POD_heart_of_darkness.003.option.b: "Aún no es el momento..."
