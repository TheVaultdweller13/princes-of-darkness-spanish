l_spanish:
 POD_mirror_duplicate.001.t: "Duplicado de espejo"
 POD_mirror_duplicate.001.desc: "Con tu maestría en Quimerismo puedes intentar animar tu propio reflejo y convertirlo en un duplicado de ti mismo. Tal criatura será de gran ayuda en la lucha eterna de la Jyhad, pero tales poderes tienen un coste."
 POD_mirror_duplicate.001.option.a: "Yo ordeno a los reflejos, es hora de que obedezcan"
 POD_mirror_duplicate.001.option.a.tt: "Intentarás crear un Duplicado de espejo"
 POD_mirror_duplicate.001.option.a.desc: "Una lucha con la realidad"
 POD_mirror_duplicate.001.option.a.tt.success: "Se ha creado con éxito un Duplicado de espejo"
 POD_mirror_duplicate.001.option.a.tt.failure: "No logras crear un Duplicado de espejo"
 POD_mirror_duplicate.001.option.b: "Ahora no es el momento adecuado"
 POD_mirror_duplicate.001.option.b.tt: "Abandonarás tu idea de crear un Duplicado de espejo"

 POD_mirror_duplicate.002.t: "Duplicado de espejo II"
 POD_mirror_duplicate.002.desc: "Con tu maestría en Quimerismo logras crear con éxito un Duplicado de espejo, ahora es el momento de dar órdenes."
 POD_mirror_duplicate.002.option.a: "Incluso los reflejos me obedecen"
 POD_mirror_duplicate.002.option.a.tt: "Se ha creado con éxito un Duplicado de espejo."

 POD_mirror_duplicate.003.t: "Duplicado de espejo II"
 POD_mirror_duplicate.003.desc: "Incluso tu maestría en Quimerismo no es suficiente para crear un Duplicado de espejo... por ahora."
 POD_mirror_duplicate.003.option.a: "Aún no estoy preparado para comandar reflejos"
 POD_mirror_duplicate.003.option.a.tt: "No has logrado crear un Duplicado de espejo"

 POD_mirror_duplicate.death_management.t: "Perdiendo un reflejo de ti mismo"
 POD_mirror_duplicate.death_management.desc: "Han llegado noticias graves, tu Duplicado de espejo, un reflejo de ti mismo, ha muerto."
 POD_mirror_duplicate.death_management.option.a: "Otro más que muerde el polvo"
 POD_mirror_duplicate.death_management.option.a.tt: "Tu Duplicado de espejo ha muerto"