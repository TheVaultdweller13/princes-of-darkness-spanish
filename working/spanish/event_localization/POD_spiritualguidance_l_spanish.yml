l_spanish:

 POD_spiritual_guidance.001.t: "Guía espiritual"
 POD_spiritual_guidance.001.desc: "[student.GetFirstName] lleva una vida pecaminosa. Crees que puedes ayudar[student.GetHerHim], pero ¿te escuchará? Al fin y al cabo, el camino hacia la redención y la absolución de los pecados puede ser un proceso largo y arduo, no apto para todos."
 POD_spiritual_guidance.001.option.a: "Ayudaré a [student.GetHerHim]"
 POD_spiritual_guidance.001.option.a.tt: "Estás intentando ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.001.option.b: "No lo siento"
 POD_spiritual_guidance.001.option.b.tt: "Abandonas tu intento de ayudar a [student.GetFirstName]"
 
 
 POD_spiritual_guidance.002.t: "Intentando ayudar"
 POD_spiritual_guidance.002.desc: "[teacher.GetFirstName] se te ha acercado y se ha ofrecido a ayudarte a ser un mejor servidor de Dios. ¿Cuál será tu respuesta? Podrías convertirte en una mejor persona al final, o simplemente perder un tiempo valioso, es difícil de decir."
 POD_spiritual_guidance.002.option.a: "Acepto agradecid[GetPlayer.GetCustom('ES_O')] su oferta"
 POD_spiritual_guidance.002.option.a.tt: "Comienza una lección"
 POD_spiritual_guidance.002.option.b: "No creo que me guste hacia dónde va esto"
 POD_spiritual_guidance.002.option.b.tt: "Te niegas"
 
 POD_spiritual_guidance.102.t: "Una negativa"
 POD_spiritual_guidance.102.desc: "[student.GetFirstName] no quiere que le 'ayudes'. Parece que el camino a la redención era demasiado empinado para este. De todos modos, Dios será el único juez del alma al final."
 POD_spiritual_guidance.102.option.a: "Qué lástima..."
 POD_spiritual_guidance.102.option.a.tt: "[student.GetFirstName] rechazó tu oferta"
 
 POD_spiritual_guidance.202.t: "Guía espiritual II"
 POD_spiritual_guidance.202.desc: "Una persona verdaderamente devota no debe actuar pecaminosamente. [student.GetFirstName] no está preparad[student.GetCustom('ES_O')] para servir a Dios con total eficiencia. Y tu sagrada misión es ayudar[student.GetHerHim] a comprender mejor a Dios. ¿Serás el maestro devoto que se necesita ahora?"
 POD_spiritual_guidance.202.option.a: "Tu lujuria no nublará tu mente"
 POD_spiritual_guidance.202.option.a.tt: "Intentarás librar[student.GetHerHim] de su lujuria"
 POD_spiritual_guidance.202.option.a.desc: "Prueba de fe"
 POD_spiritual_guidance.202.option.a.failure.tt: "No logras ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.202.option.b: "Tu ira no te controlará"
 POD_spiritual_guidance.202.option.b.tt: "Intentarás librar[student.GetHerHim] de su ira"
 POD_spiritual_guidance.202.option.b.failure.tt: "No logras ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.202.option.c: "No eres tan grande después de todo"
 POD_spiritual_guidance.202.option.c.tt: "Intentarás librar[student.GetHerHim] de su arrogancia"
 POD_spiritual_guidance.202.option.c.failure.tt: "No logras ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.202.option.d: "Descansas demasiado"
 POD_spiritual_guidance.202.option.d.tt: "Intentarás librar[student.GetHerHim] de su pereza"
 POD_spiritual_guidance.202.option.d.failure.tt: "No logras ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.202.option.e: "Comes demasiado"
 POD_spiritual_guidance.202.option.e.tt: "Intentarás librar[student.GetHerHim] de sus malos hábitos alimenticios"
 POD_spiritual_guidance.202.option.e.failure.tt: "No logras ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.202.option.f: "La codicia no es buena"
 POD_spiritual_guidance.202.option.f.tt: "Intentarás librar[student.GetHerHim] de su codicia"
 POD_spiritual_guidance.202.option.f.failure.tt: "No logras ayudar a [student.GetFirstName]"
 POD_spiritual_guidance.202.option.g: "Tu corazón está lleno de rencor"
 POD_spiritual_guidance.202.option.g.tt: "Intentarás librar[student.GetHerHim] de su vena vengativa"
 POD_spiritual_guidance.202.option.g.failure.tt: "No logras ayudar a [student.GetFirstName]"
 
 POD_spiritual_guidance.302.t: "Guía espiritual III"
 POD_spiritual_guidance.302.desc: "Has logrado librar[student.GetHerHim] de su pecado. Pero aún no has terminado, ahora es el momento de mostrar a [student.GetFirstName] la forma de vida virtuosa. ¿Quizás con el ejemplo? Solo ten cuidado de no caer tú mismo en el pecado de la soberbia..."
 POD_spiritual_guidance.302.option.a: "La mente antes que la carne"
 POD_spiritual_guidance.302.option.a.tt: "[student.GetFirstName] se vuelve cast[student.GetCustom('ES_O')]"
 POD_spiritual_guidance.302.option.b: "Deberías saber cuándo es suficiente"
 POD_spiritual_guidance.302.option.b.tt: "[student.GetFirstName] se vuelve templad[student.GetCustom('ES_O')]"
 POD_spiritual_guidance.302.option.c: "Compartir es vivir"
 POD_spiritual_guidance.302.option.c.tt: "[student.GetFirstName] se vuelve generos[student.GetCustom('ES_O')]"
 POD_spiritual_guidance.302.option.d: "Deberías poner la otra mejilla"
 POD_spiritual_guidance.302.option.d.tt: "[student.GetFirstName] se vuelve compasiv[student.GetCustom('ES_O')]"
 POD_spiritual_guidance.302.option.e: "Deberías estar tranquil[student.GetCustom('ES_O')] sin importar las circunstancias"
 POD_spiritual_guidance.302.option.e.tt: "[student.GetFirstName] se vuelve calmad[student.GetCustom('ES_O')]"
 POD_spiritual_guidance.302.option.f: "No eres mejor que los demás"
 POD_spiritual_guidance.302.option.f.tt: "[student.GetFirstName] se vuelve humilde"
 POD_spiritual_guidance.302.option.g: "Descansarás en el cielo"
 POD_spiritual_guidance.302.option.g.tt: "[student.GetFirstName] se vuelve diligent[student.GetCustom('ES_E')]"
 
 POD_spiritual_guidance.402.t: "Guía espiritual fallida"
 POD_spiritual_guidance.402.desc: "¡[teacher.GetFirstName] te ha fallado! Después de todos esos discursos... Algunas almas simplemente no están destinadas a ser salvadas."
 POD_spiritual_guidance.402.option.a: "Muy decepcionante"
 POD_spiritual_guidance.402.option.a.tt: "La guía espiritual ha fallado"
 
 POD_spiritual_guidance.502.t: "Guía espiritual exitosa"
 POD_spiritual_guidance.502.desc: "[teacher.GetFirstName] ha logrado mostrarte el camino correcto. Tus días pecaminosos casi han terminado, ahora tienes que mejorar por tu propia fuerza."
 POD_spiritual_guidance.502.option.a: "¡Realmente lo logró!"
 POD_spiritual_guidance.502.option.a.tt: "Ahora eres una mejor persona"