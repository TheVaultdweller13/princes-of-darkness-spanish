l_spanish:
 POD_wraith_maintenance.1.t: "Elegir Grilletes"
 POD_wraith_maintenance.1.desc: "Elegir Grilletes es una decisión muy importante que te perseguirá durante mucho tiempo, elige sabiamente.\n\nOdio - Cada vez que matas a alguien tienes una probabilidad de X/5 de ganar pathos y perder estrés\nAmor - Cada año tiene una probabilidad de X/5 de reducir el estrés y ganar pathos mientras un mortal específico (generado) esté vivo\nCodicia - Cada vez que obtienes un artefacto tienes una probabilidad de X/5 de perder estrés y ganar pathos\nCreatividad - Cada vez que fabricas algo usando la interfaz de fabricación, tienes una probabilidad de X/5 de perder estrés y ganar pathos\nCompasión - Cada vez que consigues un [friend|E] pierdes estrés y ganas pathos dependiendo del nivel del grillete\nLujuria - Cada vez que consigues un [lover|E] pierdes estrés y ganas pathos dependiendo del nivel del grillete\nJusticia - Cada vez que encarcelas legalmente a alguien tienes una probabilidad de X/5 de perder estrés y ganar pathos"
 POD_wraith_maintenance.1.a: "Odio [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.1.b: "Amor [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.1.c: "Codicia [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.1.d: "Creatividad [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.1.e: "Compasión [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.1.f: "Lujuria [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 POD_wraith_maintenance.1.g: "Justicia [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10"
 
 POD_wraith_maintenance.11.t: "Elegir Grilletes"
 POD_wraith_maintenance.11.desc: "¿Qué cantidad de puntos de grillete asignarás a este grillete?"
 POD_wraith_maintenance.11.a: "1 #weak [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10#!"
 POD_wraith_maintenance.11.b: "2 #weak [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10#!"
 POD_wraith_maintenance.11.c: "3 #weak [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10#!"
 POD_wraith_maintenance.11.d: "4 #weak [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10#!"
 POD_wraith_maintenance.11.e: "5 #weak [GetPlayer.MakeScope.ScriptValue('free_fetter_points')]/10#!"
 POD_wraith_maintenance.11.f: "Volver"
 
 POD_wraith_maintenance.2.t: "Deterioro de [Fetters|E]"
 POD_wraith_maintenance.2.i: "Se ha seleccionado un [Fetter|E] al azar..."
 POD_wraith_maintenance.2.desc: "Tener a la sombra al mando no es algo bueno, especialmente para tus [Fetters|E]. Las sombras son casi siempre autodestructivas y quieren ver a su contraparte wraith fracasar y sucumbir al Olvido. La forma más rápida de hacerlo es atacar los grilletes de un wraith."
 POD_wraith_maintenance.2.a: "\"No se siente igual...\""
 POD_wraith_maintenance.2.b: "\"¡NO! ¡No me rendiré!\""
 
 #POD_wraith_maintenance.21.t: "Sin grillete"
 #POD_wraith_maintenance.21.desc: "No tienes ningún [Fetters|E] que te una a las [Glossary('Skinlands','game_concept_skinlands_desc')], por lo que eres enviado por la fuerza de vuelta al [Glossary('Dark Kingdom','game_concept_dark_kingdom_desc')]."
 #POD_wraith_maintenance.21.option.a: "¡No!"
 #POD_wraith_maintenance.21.option.b: "¿Se acaba de dividir mi Po?"
  
 #POD_wraith_maintenance.22.t: "Escape de Yomi"
 #POD_wraith_maintenance.22.desc: "Has estado atrapado en el [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] durante mucho tiempo, siendo torturado por los [Glossary('Yama Kings','podgloss.yamaking')] todo el tiempo, pero crees haber encontrado una forma de escapar y reunirte con tu Hun."
 #POD_wraith_maintenance.22.option.a: "¡Podría ir incluso más lejos!"
 #POD_wraith_maintenance.22.option.b: "Solo déjame volver a las [UmbraGlossaryLocalized('shadowlands','Tierras de las Sombras')]."