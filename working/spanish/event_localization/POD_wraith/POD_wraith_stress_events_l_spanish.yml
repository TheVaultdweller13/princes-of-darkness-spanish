l_spanish:
 POD_wraith_stress_events.0010.t: "La Sombra gana fuerza"
 POD_wraith_stress_events.0010.desc: "Los últimos días no han sido fáciles, y la lucha constante con mi sombra no ayuda. A medida que pasan los días y la existencia de la sombra es cada vez más acechante, por un solo momento, debilito mi control. Y la sombra aprovechó esta oportunidad..."
 POD_wraith_stress_events.0010.a: "Mierda."

 POD_wraith_stress_events.0020.t: "¡La Sombra ataca!"
 POD_wraith_stress_events.0020.desc: "Pasan los días y me siento miserable. Las dulces palabras de mi sombra no ayudan, #weak ¿o tal vez sí?#! Quiero rendirme, pero no lo haré. Iré más allá. #weak ¿pero tal vez hacia el olvido?#!"
 POD_wraith_stress_events.0020.a: "¿Acaso me importa?"
 POD_wraith_stress_events.0020.a.a: "¡Tu sombra ha tomado el control sobre ti!"
 POD_wraith_stress_events.0020.a.b: "Tu sombra no ha ganado esta vez."

 POD_wraith_stress_events.0030.t: "Dulce Olvido"
 POD_wraith_stress_events.0030.desc: "Vivir es difícil, no-vivir es más difícil todavía. Pasa un día de miseria, solo para que otro ocupe su lugar. #weak Yo#! y la #bold sombra#!, si todavía puedo distinguir entre ambos, estamos de acuerdo. El mundo es un lugar oscuro y doloroso, #beast ¡así que quemémoslo todo!#!"
 POD_wraith_stress_events.0030.a: "QuEmAr."
