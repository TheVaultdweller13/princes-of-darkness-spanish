l_spanish:
 POD_wraith_passions.100.t: "Obteniendo Pasiones"
 POD_wraith_passions.100.desc: "Tus Pasiones están inextricablemente ligadas a quién eres y por qué te convertiste en un wraith, así que obtienes 10 puntos para dividir entre ellas como elijas. Puedes tener 10 Pasiones menores, cada una con un punto, o dos mayores con cinco puntos cada una. Las Pasiones con puntuaciones más altas son más exigentes, pero obtienes más beneficios al actuar de acuerdo con ellas. Las Pasiones más pequeñas exigen menos, pero también ofrecen menos."
 POD_wraith_passions.100.option.a: "Encontrar a mi asesino #weak ([ROOT.Var('passion_count').GetValue|0]/5)#!"
 POD_wraith_passions.100.option.b: "Amasar riqueza #weak ([ROOT.Var('passion_count').GetValue|0]/2)#!"
 POD_wraith_passions.100.option.c: "Ser exaltado entre los muertos #weak ([ROOT.Var('passion_count').GetValue|0]/3)#!"
 POD_wraith_passions.100.option.d: "Ser un dechado de Trascendencia #weak ([ROOT.Var('passion_count').GetValue|0]/2)#!"
 POD_wraith_passions.100.option.e: "Crear un tesoro #weak ([ROOT.Var('passion_count').GetValue|0]/4)#!"
 POD_wraith_passions.100.option.f: "Construir una maravilla #weak ([ROOT.Var('passion_count').GetValue|0]/2)#!"
 POD_wraith_passions.100.option.g: "Hacer un mejor amigo #weak ([ROOT.Var('passion_count').GetValue|0]/3)#!"
 POD_wraith_passions.100.option.h: "Proteger a mi familia #weak ([ROOT.Var('passion_count').GetValue|0]/2)#!"
 POD_wraith_passions.100.option.i: "Matar a mi rival #weak ([ROOT.Var('passion_count').GetValue|0]/4)#!"
 POD_wraith_passions.100.option.back: "Terminar."