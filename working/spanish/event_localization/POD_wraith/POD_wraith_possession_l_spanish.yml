l_spanish:

 POD_wraith_possession.100.t: "Posesión"
 POD_wraith_possession.100.desc: "[actor.GetTitledFirstName] está intentando poseerte. Notas partes de tu cuerpo moviéndose por su cuenta, pensamientos que no deberías tener. ¿Quizás es hora de llamar a un exorcista?"
 POD_wraith_possession.100.option.a: "Ejercer mi fuerza de voluntad y luchar por mi cuerpo."
 POD_wraith_possession.100.option.b: "Resistir al intruso."
 POD_wraith_possession.100.option.c: "Aceptar la posesión."
 
 POD_wraith_possession.200.t: "Poseyendo a [recipient.GetFirstNameNoTooltip]"
 POD_wraith_possession.200.desc: "Es el momento adecuado para tomar el control del cuerpo de [recipient.GetTitledFirstName], pero se está resistiendo."
 POD_wraith_possession.200.option.a: "Continuar de todos modos."
 POD_wraith_possession.200.a.tt_willpower: "[recipient.GetFirstNameNoTooltip] ha ejercido su voluntad para resistir tu intrusión."
 POD_wraith_possession.200.a.tt_fortitude: "[recipient.GetFirstNameNoTooltip] es expert[recipient.GetCustom('ES_O')] en la $pod_discipline$ de Fortaleza y es resistente a tu manipulación."
 POD_wraith_possession.200.a.success.desc: "Victoria"
 POD_wraith_possession.200.a.tt_success: "¡Su cuerpo será mío!"
 POD_wraith_possession.200.a.failure.desc: "Derrota"
 POD_wraith_possession.200.a.tt_failure: "[recipient.GetTitledFirstName] se resistió a mi intento de [possess|E] a [actor.GetHerHim]."
 
 POD_wraith_possession.200.option.b: "Ejercer mi voluntad. Todos los mortales son marionetas movidas por mis hilos."
 POD_wraith_possession.200.option.c: "Abandonar este empeño, ya no deseo tomar el control de su cuerpo."
 POD_wraith_possession.200.option.c.tt: "La posesión fallará."

 
 POD_wraith_possession.300.t: "Cuerpo de [recipient.GetFirstNameNoTooltip] poseído"
 POD_wraith_possession.300.desc: "Has fortalecido tu control sobre el cuerpo de [recipient.GetTitledFirstName]. Esta marioneta ahora te pertenece."
 POD_wraith_possession.300.option.a: "Es como debe ser."


 POD_wraith_possession.400.t: "Has sido poseído"
 POD_wraith_possession.400.desc: "Habiendo perdido la batalla de voluntades contra [actor.GetTitledFirstName], pierdes otro grado de control ante [actor.GetHerHim]." 
 POD_wraith_possession.400.option.a: "Mi cuerpo ya no es mío."
 
 POD_wraith_possession.500.t: "Posesión resistida"
 POD_wraith_possession.500.desc: "[recipient.GetTitledFirstName] se ha resistido a mi intento de [possess|E][recipient.GetHerHim]." 
 POD_wraith_possession.500.option.a: "¡Frustrado!"


 POD_wraith_possession.600.t: "Posesión resistida"
 POD_wraith_possession.600.desc: "[actor.GetTitledFirstName] ha abandonado su intento de invadir tu cuerpo."
 POD_wraith_possession.600.option.a: "¡Mi cuerpo es mío!"
 
 POD_wraith_possession.1000.t: "Un nadie sin cuerpo"
 POD_wraith_possession.1000.desc: "Tu cuerpo original ha muerto, ya no puedes volver a él.\nEso suena como algo muy malo, probablemente porque lo es. ¿Hora de un nuevo tú, tal vez?"
 POD_wraith_possession.1000.option.a: "¿Estoy atrapado en este cuerpo para siempre?"
 
 POD_wraith_possession_toast_title: "¡Wraith exitoso!"
 POD_wraith_possession_toast_text: "Tu wraith logró [possess|E] al objetivo, dándote cierto control sobre él e imbuyéndolo de poder."
 
 POD_wraith_possession.toast.fail: "¡Wraith fallido!"
 POD_wraith_possession.toast.fail.desc: "Tu objetivo se resistió a la posesión del wraith."