l_spanish:
 POD_wraith_arcanoi_learning_events.1.t: "Los secretos de los muertos"
 POD_wraith_arcanoi_learning_events.1.desc: "Los Arcanoi, las artes de los muertos, son habilidades espirituales secretas que pueden enseñarse o adquirirse mediante la experiencia.\nEl Inframundo tiene un conjunto de leyes extrañas que son más psicológicas que físicas. Las cualidades emocionales como el Pathos y el Angst tienen propiedades físicas que pueden usarse y trasladarse. Más críticamente, el inframundo tiene una grave escasez de materiales. Aunque un pequeño número de reliquias pasan al inframundo cuando un wraith muere, la mayoría de las cosas en el inframundo están hechas de almas.\nEsto convirtió a dichas almas en la moneda más común ofrecida a un posible maestro de Arcanos. Los precios varían enormemente dependiendo de la reputación de dicho maestro o simplemente del estado general de la economía del inframundo en cualquier momento dado.\nParece que algunas cosas nunca cambian. Ni siquiera en la muerte."
 POD_wraith_arcanoi_learning_events.1.a: "Hora de baratear..."
 
