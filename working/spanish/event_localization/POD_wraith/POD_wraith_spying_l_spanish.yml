l_spanish:
 POD_wraith_spying.100.t: "Ojos invisibles"
 POD_wraith_spying.100.desc: "Sientes que te están observando. Algo no va bien. Temes que si sigues operando como de costumbre, la presencia incognoscible deducirá tus secretos.\nTal vez sea el momento de usar dobles, códigos y otros medios para confundir a un observador. Por supuesto, podrías estar simplemente paranoico....."
 POD_wraith_spying.100.option.a: "Ejercer mi fuerza de voluntad y ocultar mi secreto."
 POD_wraith_spying.100.option.b: "Ocultar mis secretos."
 POD_wraith_spying.100.option.c: "Es solo mi imaginación."
 
 POD_wraith_spying.200.t: "Espiando a [recipient.GetFirstNameNoTooltip]"
 POD_wraith_spying.200.desc: "Es el momento adecuado para usar mi invisibilidad sobre [recipient.GetTitledFirstName] y descubrir algunos secretos, pero se está resistiendo."
 POD_wraith_spying.200.option.a: "Continuar de todos modos."
 POD_wraith_spying.200.a.tt_willpower: "[recipient.GetFirstNameNoTooltip] ha ejercido su voluntad para ocultar mejor sus movimientos y conversaciones clandestinas."
 POD_wraith_spying.200.a.tt_auspex: "Los poderes de [recipient.GetFirstNameNoTooltip] le permiten ver lo invisible, privándote de tu invisibilidad."
 POD_wraith_spying.200.a.success.desc: "Victoria"
 POD_wraith_spying.200.a.tt_success: "¡Sus secretos me serán revelados!"
 POD_wraith_spying.200.a.failure.desc: "Derrota"
 POD_wraith_spying.200.a.tt_failure: "[recipient.GetTitledFirstName] se resistió a mi intento de espionaje."
 POD_wraith_spying.200.option.b: "Ejercer mi voluntad. ¡Sabré todos sus secretos!"
 
 POD_wraith_spying.200.option.c: "Abandonar este empeño, ya no deseo espiar a [recipient.GetHerHim]."
 POD_wraith_spying.200.option.c.tt: "El intento fallará."
 
 
 POD_wraith_spying.300.t: "Secretos de [recipient.GetFirstNameNoTooltip] descubiertos."
 POD_wraith_spying.300.desc: "He aprendido los secretos de [recipient.GetTitledFirstName] al observar[recipient.GetHerHim]."
 POD_wraith_spying.300.option.a: "Es como debe ser."
 
 
 POD_wraith_spying.400.t: "Tus secretos han sido revelados"
 POD_wraith_spying.400.desc: "Habiendo fallado en el intento de ocultar tus posesiones y conversaciones a [actor.GetTitledFirstName], tus secretos ahora le son conocidos." 
 POD_wraith_spying.400.option.a: "Mis secretos ya no están ocultos."
 
 POD_wraith_spying.500.t: "Espionaje frustrado"
 POD_wraith_spying.500.desc: "[recipient.GetTitledFirstName] se ha resistido a mi intento de espiar[recipient.GetHerHim]." 
 POD_wraith_spying.500.option.a: "¡Frustrado!"
 POD_wraith_spying.500.option.a.tt.beast: "#beast ¡Debemos conocer sus secretos!#!"
 
 POD_wraith_spying.600.t: "Espionaje frustrado"
 POD_wraith_spying.600.desc: "[actor.GetTitledFirstName] ha abandonado su intento de robar tus secretos."
 POD_wraith_spying.600.option.a: "¡Mis secretos están a salvo!"
 POD_wraith_spying.600.toasttitle: "¡Wraith frustrado!"
 POD_wraith_spying.600.toasttext: "El wraith que enviaste no logró aprender ninguno de los secretos de tu objetivo."
 POD_wraith_spying.300.toasttitle: "¡Wraith exitoso!"
 POD_wraith_spying.300.toasttext: "Tu wraith recuperó información valiosa para tu uso."
 
 
 
 turned_to_wraith: "El objetivo morirá y renacerá como un wraith en tu corte. O, si ya es un wraith, se verá significativamente debilitado y atraído a tu corte."