l_spanish:
 POD_wraith_binding.100.t: "Vínculos de magia y voluntad."
 POD_wraith_binding.100.desc: "Mientras te ocupas de tus asuntos habituales como wraith, sientes una poderosa atracción hacia un lugar desconocido. ¡Alguien está interfiriendo con tu conexión con el mundo mortal!\nAl llegar a una cámara de invocación, conoces a tu invocador: un nigromante llamado [actor.GetFirstNameNoTooltip]. El ritual de vinculación ya está empezando a afectarte y a deformar tu ser."
 POD_wraith_binding.100.option.a: "¡YO. NO. SERÉ. CONTROLADO!"
 POD_wraith_binding.100.option.b: "Resistir, por supuesto."
 POD_wraith_binding.100.option.c: "La resistencia es inútil... Venganza, pero más tarde."
 
 POD_wraith_binding.200.t: "Vínculos de magia y voluntad."
 POD_wraith_binding.200.desc: "Con el terreno del ritual preparado, invocas las oscuras magias del abismo y atraes al wraith objetivo a tu círculo preparado.\nA través de un agujero en la realidad mortal aparece [recipient.GetFirstNameNoTooltip], con el rostro contorsionado por el dolor y la rabia. Ahora que el fantasma está aquí, es el momento de la vinculación."
 POD_wraith_binding.200.wp: "Continuar de todos modos."
 POD_wraith_binding.200.wp.tt_willpower: "[recipient.GetFirstNameNoTooltip] ha ejercido su voluntad para ocultar mejor sus movimientos y conversaciones clandestinas."
 POD_wraith_binding.200.blood.tt_success: "Éxito"
 POD_wraith_binding.200.wp.success.desc: "Victoria"
 POD_wraith_binding.200.wp.tt_success: "¡[recipient.GetTitledFirstName] me obedecerá!"
 POD_wraith_binding.200.wp.failure.desc: "Derrota"
 POD_wraith_binding.200.blood.tt_failure: "Fracaso"
 POD_wraith_binding.200.wp.tt_failure: "[recipient.GetTitledFirstName] se resistió a mi intento de vinculación."
 POD_wraith_binding.200.option.wp: "Ejercer mi voluntad. ¡Seré su maestro!"
 POD_wraith_binding.200.blood: "Ejercer mi voluntad y mi sangre. El abismo me otorgará poder sobre la muerte y los muertos."
 
 POD_wraith_binding.200.option.c: "Abandonar este empeño, ya no deseo vincular a [recipient.GetHerHim]."
 POD_wraith_binding.200.option.c.tt: "El intento fallará."
 
 
 POD_wraith_binding.300.t: "[recipient.GetFirstNameNoTooltip] vinculad[recipient.GetCustom('ES_O')]"
 POD_wraith_binding.300.desc: "He invocado con éxito los temibles poderes del olvido para obligar a [recipient.GetTitledFirstName] a un servicio eterno. La pregunta es, ¿qué tan fuerte es el vínculo?"
 POD_wraith_binding.300.option.a: "Es como debe ser."
 POD_wraith_binding.300.twolevels: "¡La potencia del vínculo aumentará en dos niveles!"
 POD_wraith_binding.300.threelevels: "¡La potencia del vínculo aumentará en tres niveles!"

 POD_wraith_binding.400.t: "¡Vinculad[GetPlayer.GetCustom('ES_O')]!"
 POD_wraith_binding.400.desc: "A pesar de tus esfuerzos por luchar contra los oscuros poderes de [actor.GetTitledFirstName], la magia te ha obligado a convertirte en un esclavo involuntario de [actor.GetHerHim]." 
 POD_wraith_binding.400.option.a: "Mi independencia... perdida."
 
 POD_wraith_binding.500.t: "Vinculación fallida"
 POD_wraith_binding.500.desc: "[recipient.GetTitledFirstName] se ha resistido a mi intento de vincular[recipient.GetHerHim]." 
 POD_wraith_binding.500.option.a: "¡Frustrado!"


 POD_wraith_binding.600.t: "Vinculación frustrada"
 POD_wraith_binding.600.desc: "[actor.GetTitledFirstName] ha abandonado su intento de obligarte a servirle."
 POD_wraith_binding.600.option.a: "¡Mi independencia está a salvo!"
 
 POD_wraith_binding.1000.t: "El wraith marcado ha llegado"
 POD_wraith_binding.1000.desc: "[wraith.GetTitledFirstName] ha muerto y ha llegado como invitado a tu corte. Si no haces nada, se irá a las [UmbraGlossaryLocalized('shadowlands','Tierras de las Sombras')] después de siete días."
 POD_wraith_binding.1000.option.a: "Debería vincular[wraith.GetHerHim] inmediatamente."
 POD_wraith_binding.1000.option.b: "No haré nada."