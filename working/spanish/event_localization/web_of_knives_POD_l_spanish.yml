 #POD_web_of_knives.1.t: "Prueba de habilidad"
 #POD_web_of_knives.1.desc: "Has sido contactado por uno de los esquivos reclutadores de la Red de Cuchillos. Habrá tres pruebas bajo su supervisión y la primera será una 'simple' prueba de habilidad contra él. Usando la espada o la intriga, tendrás que impresionarlo lo suficiente para que el proceso continúe. Tienes la opción de elegir entre estos dos tipos de habilidades de asesino para demostrar."
 #POD_web_of_knives.1.a: "La espada"
 #POD_web_of_knives.1.effect.success.desc: "¡Triunfaste!"
 #POD_web_of_knives.1.critical.failure.effect.desc: "Fuiste derrotado..."
 #POD_web_of_knives.1.b: "La intriga es mi fuerte"
 #POD_web_of_knives.1.c: "Aún no estoy listo"
 #web_setback_tooltip: "Abandonas la prueba por ahora. Podrás volver a ella."
 #POD_web_of_knives.1.d: "¡Eso es demasiado difícil!"
 #web_ending_tooltip: "Abandonas la prueba y cortas todos los lazos que tenías con la Red. No podrás contactar con ellos en el futuro."
 # 
 #POD_web_of_knives.3.t: "Prueba: Derrotado"
 #POD_web_of_knives.3.desc: "Has sido considerado indigno durante la prueba. La Red de Cuchillos no trabajará contigo por ahora y tendrás que esperar algún tiempo antes de intentarlo de nuevo, si es que es algo que quieres considerar. Sin embargo, no se ha perdido nada de valor real, excepto un poco de orgullo."
 #POD_web_of_knives.3.a: "La próxima vez estaré listo"
 #web_trial_failure_tooltip: "Podrás volver a intentarlo en 5 años" 
 #POD_web_of_knives.3.b: "¡Estos lunáticos no valen mi tiempo!"
 #
 #POD_web_of_knives.2.t: "Prueba de humanidad"
 #POD_web_of_knives.2.desc: "La segunda prueba es en realidad bastante sencilla. Debes matar al mortal específico que se presenta ante ti. Sin preguntas, sin razones dadas.\nSimplemente un asesinato sin sentido.\nClaramente, están probando si eres capaz de seguir órdenes, sin importar lo brutales o idiotas que puedan parecer. También es probable que estén juzgando tus límites morales, ya que los miembros de la Red son conocidos como vampiros muy inhumanos."
 #POD_web_of_knives.2.a: "Asesinato sin sentido, sea pues"
 #POD_web_of_knives.2.b: "Esto va demasiado lejos... por ahora"
 #POD_web_of_knives.2.c: "¡Esto va demasiado lejos!"
 #
 #POD_web_of_knives.5.t: "Prueba de fe"
 #POD_web_of_knives.5.desc: "La última prueba es en realidad más una promesa que otra cosa. La Red de Cuchillos cree en un relato fantasioso donde Haqim se abrazó a sí mismo para luchar contra los 'Malditos Hijos de Khayyin'. Todo su negocio de asesinos es simplemente una tapadera para matar a tantos $pod_cainites$ como sea posible con impunidad y apoderarse lentamente de todo su $pod_clan$.\nClaramente, están dementes y delusorios... ¿o no? Quizás hay algo en un culto de asesinos sangrientos e impenitentes que te atrae. O podrías simplemente fingir que crees en sus relatos fantasiosos... pero claramente se ofenderían gravemente si alguna vez se enteran."
 #POD_web_of_knives.5.a: "¡Gloria a Haqim!"
 #POD_web_of_knives.5.b: "Gloria a Haqim..."
 #POD_web_of_knives.5.effect.success.desc: "¡Te creen!"
 #POD_web_of_knives.5.success: "¡Estás dentro!"
 #POD_web_of_knives.5.critical.failure.effect.desc: "No te creen..." 
 #POD_web_of_knives.5.critical.failure: "No confíes en los cultos"    
 #POD_web_of_knives.5.c: "Debo declinar cortésmente"
 #join_web_tooltip: "Te unirás a la Red, obteniendo acceso a un nuevo panel con contratos para cumplir"
 #
 #web_of_knives_intro: "Puedes matar a los objetivos por cualquier medio."
 #web_of_knives_intro2: "Obtienes una [interaction|E] de Perseguir Contrato que termina en un duelo letal con ellos."
 #
 #POD_web_of_knives.6.t: "¡Asesino!"
 #POD_web_of_knives.6.desc: "Has estado estudiando a tu objetivo durante un tiempo, aprendiendo sus hábitos, sus fortalezas y, lo que es más importante, sus debilidades. Los vampiros son criaturas paranoicas por naturaleza, y a menudo es bastante difícil encontrar un momento en el tiempo en el que se pueda realizar la acción, pero tu minucioso reconocimiento ha logrado encontrar tal oportunidad.\nSaltando desde las sombras, golpeas primero. Solo uno de vosotros saldrá vivo de este encuentro."
 #POD_web_of_knives.6.a: "¡La muerte viene a por ti!"
 web_of_knives_diablerie_tt: "Un duelo a muerte. Se te ofrecerá realizar una $pod_diablerie$ si ganas."
 #POD_web_of_knives.6.b: "¡Tu alma es mía!"
 
  POD_web_of_knives.7.t: "La Red de Cuchillos"
  POD_web_of_knives.7.desc: "Los Hijos de Haqim tienen una larga tradición, aunque muy debatida internamente, de actuar como mercenarios o asesinos a sueldo para otros vampiros. Organizados bajo la secreta facción de la Red de Cuchillos, estos contratos aportan una gran riqueza (y oportunidades de $pod_diablerie$ para los menos escrupulosos) a los aventureros Banu Haqim. Aunque ningún miembro del clan está obligado a seguir esta práctica, la mayoría de ellos al menos coquetean con ella, al menos para reforzar las ideas erróneas de los otros vampiros de que todos los Banu Haqim son asesinos sedientos de sangre con los que no hay que meterse.\n #X La Red de Cuchillos es una característica definitoria de los Banu Haqim. Recibirás periódicamente ofertas para perseguir un contrato. Si aceptas, una victoria te reportará oro, prestigio y una oportunidad de $pod_diablerie$.#!"
  POD_web_of_knives.7.a: "Una reputación útil de mantener."
 
  POD_web_of_knives.600.t: "Su cabeza y su alma"
  POD_web_of_knives.600.desc: "Tu asalto directo contra tu víctima ha dado sus frutos. Se encuentran intimidados ante ti, incapaces de oponer resistencia a tus próximas acciones. Una muerte simple y limpia cumpliría el contrato y te daría las recompensas prometidas, pero también sabes que la Red de Cuchillos fomenta la $pod_diablerie$ como parte del botín del vencedor.\nEl atractivo está ciertamente ahí, con la sangre de tu enemigo derrotado llamándote, rogando ser puesta para un propósito más útil..."
  POD_web_of_knives.600.option.a: "Tu cabeza y tu alma."
  POD_web_of_knives.600.option.b: "Tu cabeza bastará."
  
  POD_web_of_knives.10.t: "El precio por su cabeza"
  POD_web_of_knives.10.desc: "Has contactado con la sombría organización conocida como la Red de Cuchillos con la intención de poner precio a la cabeza de tu rival. Sus condiciones son las siguientes: pagas la mitad del oro ahora mismo y la otra mitad al cumplirse el contrato. Cuanto más pagues, más hábil será el miembro de la Red que envíen. No hay reembolso de tu primera mitad si el golpe falla.\nTambién existe esta extraña demanda de que entregues una pequeña gota de tu sangre para que aparentemente sea enviada al gran maestro de su orden, pero te aseguran que es solo una tradición y nada más siniestro. Si no puedes confiar en asesinos a sueldo, ¿en quién puedes confiar realmente?"
  POD_web_of_knives.10.a: "Una pequeña suma debería bastar."
  wok_reward_low_tt: "Si tu objetivo tiene más de 10 de intriga o 20 de proeza, esta opción no tiene ninguna posibilidad de éxito.\nObtendrás un resultado en un par de meses.\nLas mejores opciones solo están disponibles en áreas con una fuerte presencia de la Red de Cuchillos."
  POD_web_of_knives.10.b: "Puedo ofrecer más."
  wok_reward_medium_tt: "Si tu objetivo tiene más de 15 de intriga o 30 de proeza, esta opción no tiene ninguna posibilidad de éxito.\nObtendrás un resultado en un par de meses.\nLas mejores opciones solo están disponibles en áreas con una fuerte presencia de la Red de Cuchillos."
  POD_web_of_knives.10.c: "Soy un vampiro con recursos."
  wok_reward_high_tt: "Si tu objetivo tiene más de 20 de intriga o 40 de proeza, esta opción no tiene ninguna posibilidad de éxito.\nObtendrás un resultado en un par de meses.\nSolo disponible donde la presencia de la Red de Cuchillos es históricamente fuerte."
  POD_web_of_knives.10.d: "¡Los quiero muertos!"
  wok_reward_very_high_tt: "Si tu objetivo tiene más de 25 de intriga o 50 de proeza, esta opción no tiene ninguna posibilidad de éxito.\nObtendrás un resultado en un par de meses.\nSolo disponible donde la presencia de la Red de Cuchillos es históricamente más fuerte."
  POD_web_of_knives.10.e: "Pensándolo mejor..."     
  
  POD_web_of_knives.11.desc: "Han pasado unos meses desde que contactaste con la Red de Cuchillos para que te ayudaran a solucionar tu pequeño problema. Has estado vigilando a tu rival y recientemente te has enterado de un intento de asesinato dirigido contra él. Mientras su corte es un hervidero, agradeces el profesionalismo de la Red que se asegura de que, sea cual sea el resultado, el evento no pueda ser rastreado hasta ti.\nAhora, solo necesitas comprobar si tuvieron éxito o no..."
  POD_web_of_knives.11.a: "¡Lo hicieron! Ahora a pagar la otra mitad..."
  POD_web_of_knives.11.b: "¡Fallaron! Matones inútiles..."
  
  POD_web_of_knives.13.desc: "Tu contacto en la Red de Cuchillos te ha informado recientemente de un contrato puesto por la cabeza de un vampiro en tu zona. La Red tiene varios agentes que podrían intentar cumplir esta misión, pero tú tienes la primera opción si deseas perseguirla tú mismo.\nComo siempre, se presentan dos opciones ante ti. Un asesinato sutil podría funcionar y dejarte lejos de la (probablemente muy enfadada) víctima potencial si las cosas salieran mal, o podrías optar por un enfoque más \"directo\". Esto es obviamente mucho más arriesgado, pero también es la única forma de asegurar el potencial para una $pod_diablerie$ al final..."
  POD_web_of_knives.13.a: "No hay necesidad de riesgos innecesarios."
  wok_intrigue_duel_tt: "Esta opción no te arriesga a más que una pérdida de prestigio si fallas. Sin embargo, no tendrás la oportunidad de diabolizar a tu víctima si ganas."
  POD_web_of_knives.13.effect.success.desc: "Silencioso y mortal"
  POD_web_of_knives.13.critical.failure.effect.desc: "Un fracaso..."
  POD_web_of_knives.13.b: "¡Un asalto directo!"
  POD_web_of_knives.13.c: "No aceptaré este contrato."
