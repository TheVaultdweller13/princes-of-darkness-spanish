l_spanish:

 POD_learntruefaith.001.t: "Fe Verdadera"
 POD_learntruefaith.001.desc: "Pides ayuda a [teacher.GetFirstName]. A pesar de ser uno de los servidores más devotos de Dios, no logras obtener la fuerza divina que muestran algunos de los otros fieles. ¿Es tu alma demasiado débil? ¿Estás haciendo algo mal? Ahora estás decidido a mejorar, pero no estás muy seguro de cómo hacerlo. A [teacher.GetFirstName] se le ha ocurrido una prueba de fe que puede ayudarte, pero ¿eres lo suficientemente piadoso como para completarla?"
 POD_learntruefaith.001.option.a: "¡Soy lo suficientemente piadoso!"
 POD_learntruefaith.001.option.a.tt: "Tu fe es puesta a prueba"
 POD_learntruefaith.001.option.a.desc: "Una prueba de fe"
 POD_learntruefaith.001.option.a.success: "Eres digno"
 POD_learntruefaith.001.option.a.success.tt: "Has completado la prueba"
 POD_learntruefaith.001.option.a.failure: "No eres digno"
 POD_learntruefaith.001.option.a.failure.tt: "Has fallado la prueba"
 POD_learntruefaith.001.option.b: "No creo que pueda hacer esto"
 POD_learntruefaith.001.option.b.tt: "Abandonas tu intento de obtener [Glossary('True Faith','game_concept_true_faith_desc')]"
 POD_learntruefaith.101.t: "Digno del Poder Divino"
 POD_learntruefaith.101.desc: "¡Has completado la prueba! ¿Quizás esta fuerza estuvo en ti todo el tiempo y solo necesitaba una muestra de confianza por tu parte? Probablemente nunca lo sabrás, ya que Dios actúa de formas misteriosas. [teacher.GetFirstName] está muy orgulloso de ti y tu tiempo con [teacher.GetHerHim] ha terminado, ya que ahora puedes sentir la gracia de Dios."
 POD_learntruefaith.101.option.a: "Le serviré hasta que muera"
 POD_learntruefaith.101.option.a.tt: "Eres digno del poder divino"
 POD_learntruefaith.201.t: "Indigno del Poder Divino"
 POD_learntruefaith.201.desc: "Has fallado la prueba. Quizás no sea el camino que Dios eligió para ti. Quieres creer esto porque la alternativa, la posibilidad de que hayas perdido Su favor de alguna manera, es insoportable. [teacher.GetFirstName] está decepcionado pero dispuesto a intentarlo de nuevo en otro momento."
 POD_learntruefaith.201.option.a: "No me detendré"
 POD_learntruefaith.201.option.a.tt: "No obtienes [Glossary('True Faith','game_concept_true_faith_desc')]... todavía"