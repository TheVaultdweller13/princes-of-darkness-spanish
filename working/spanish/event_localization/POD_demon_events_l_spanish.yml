l_spanish:
 
  POD_demon_maintenance.1.t: "El tributo del Diablo"
  POD_demon_maintenance.1.desc: "Cada año tu poder crece gracias a la adoración de tus cultistas."
 
  POD_demon_maintenance.2.t: "Cambiando el Camino"
  POD_demon_maintenance.2.desc: "He visto la luz de mi maestro, pero mis caminos actuales no son opuestos a los suyos. ¿Debería convertirme a su camino o mantener el mío? ¡Por supuesto, todo en su nombre!"
  POD_demon_maintenance.2.a: "Su camino es el mío."
  POD_demon_maintenance.2.b: "Mi camino es el mío propio."
 
  POD_demon_maintenance.10.t: "Receptáculo"
  POD_demon_maintenance.10.desc: "Para permanecer en la Creación, un demonio debe habitar un receptáculo físico de algún tipo. Los demonios odian sus receptáculos, las cáscaras en las que deben esconderse en el mundo sin valor de Dios; aunque es mejor que la nada ineludible del Abismo, un receptáculo sigue siendo una especie de prisión y cada momento pasado anclado en un cuerpo físico es otra razón para aborrecer a Dios. Anhelan el momento en que puedan prender fuego a todo el mundo material, observando la gloriosa destrucción desde la comodidad de su aborrecible reino espiritual.\n#X En términos de juego, los Earthbound son verdaderamente inmortales pero deben tener su alma contenida en una parte del mundo material. Puede ser su capital, lo que resultará en que no puedan comandar tropas, mover su capital y sean empujados de vuelta a la Prisión Abisal si la pierden. O pueden estar vinculados a un relicario, un artefacto que les da más movilidad, pero que también es mucho más frágil. Si el relicario es destruido, el demonio regresará a la Prisión Abisal, un proceso muy costoso del que escapar.#!"
  POD_demon_maintenance.10.option.a: "Solo poseo anfitriones humanos."
  POD_demon_maintenance.10.option.a.tt: "Poseer solo anfitriones humanos (sin poseer un receptáculo inanimado) ayudará a reducir tu tormento. (-1 xp de tormento/año)"
  POD_demon_maintenance.10.option.b: "Estoy en una prisión de piedra."
  POD_demon_maintenance.10.option.b.tt: "No podrás convertirte en comandante ni viajar, a menos que también poseas un cuerpo anfitrión."
  POD_demon_maintenance.10.option.c: "Estoy vinculado a la tierra."
  POD_demon_maintenance.10.option.c.tt: "No podrás mover tu capital y serás depuesto si la pierdes."
  earthbound_artifact_choice_tt: "Se te presentará una selección de artefactos para elegir como tus relicarios, los contenedores de tu alma."
 
  POD_demon_maintenance.11.t: "Prisiones de piedra"
  POD_demon_maintenance.11.desc: "La mayoría de los demonios sueltos en la Creación están contenidos en relicarios, objetos inanimados creados por sus adoradores para que los habiten. Cuando se invoca a un demonio, el ritual se centra en el relicario; el demonio aparece dentro de él, fundiéndose su espíritu con la sustancia física del objeto."
  POD_demon_maintenance.11.option.a: "Estoy contenido en un arma."
  POD_demon_maintenance.11.option.b: "Estoy contenido en una armadura."
  POD_demon_maintenance.11.option.c: "Estoy contenido en una baratija brillante."
  POD_demon_maintenance.11.option.d: "Estoy contenido en un libro."
  POD_demon_maintenance.11.option.e: "Estoy contenido en un mueble."
  POD_demon_maintenance.11.option.f: "Estoy contenido en un accesorio."
 
  POD_demon_maintenance.15.t: "¿Continuar buscando nuevos anfitriones?"
  POD_demon_maintenance.15.desc: "Usar anfitriones humanos te permite viajar y disfrutar de actividades, pero tiene el inconveniente de que los anfitriones mueren rápidamente, como estás experimentando ahora. ¿Seguirás buscando anfitriones humanos en el futuro? Vincularte a un objeto en su lugar eliminaría tanto las debilidades como las fortalezas de tu método actual de anfitrión humano."
  POD_demon_maintenance.15.option.a: "Seguiré cambiando."
  POD_demon_maintenance.15.option.b: "Estoy cansado de la vida humana."
 
  POD_demon_maintenance.20.t: "El próximo anfitrión"
  POD_demon_maintenance.20.desc: "La única alternativa a habitar un relicario para un ángel caído es poseer un anfitrión humano —y hasta hace poco, esta era una alternativa muy pobre. Los demonios pueden poseer humanos por un tiempo, pero no permanentemente, porque el acto de posesión condena al mortal a una muerte inevitable y espantosa en poco tiempo. El Ritual del Alma Fragmentada es una nueva posibilidad que hace el proceso un poco más fácil.\n#X En términos de juego, eres verdaderamente inmortal pero siempre debes tener un anfitrión o te verás obligado a regresar a la Prisión Abisal. Puedes elegir tu próximo anfitrión tú mismo a través de la [character_interaction|E] Añadir anfitrión potencial, esto también te permitirá \"vampirizar\" algunos de los atributos del anfitrión. Si no tienes un anfitrión durante un tiempo después de que el actual muera, se te presentará un cultista aleatorio para usarlo como anfitrión de \"emergencia\" en su lugar (sin vampirismo de alma en ese caso). Como habrás adivinado, los personajes anfitriones son importantes para tu juego, y puedes encontrarlos en tu pestaña de relaciones de Esbirros. ¡Vigílalos!#!"
  POD_demon_maintenance.20.option.a: "Poseeré a un cultista aleatorio."
  POD_demon_maintenance.20.option.b: "Poseeré un artefacto aleatorio."
  POD_demon_maintenance.20.option.c: "Poseeré mi capital."
  #POD_demon_maintenance.20.option.a.tt: "Jugarás como tu receptáculo designado que heredará tu nombre, edad, rasgos, ventajas..."
  POD_demon_maintenance.20.option.d: "Permíteme regresar a mi forma espiritual."
 
  demon_without_host_tt: "Esta es una elección peligrosa. Sin un anfitrión, podrías quedarte atrapado en la [umbra|E] durante un tiempo."
 
  POD_demon_maintenance.70.t: "Esclavo insolente"
  POD_demon_maintenance.70.desc: "¡¿Cómo te atreves a intentar encarcelar a tu legítimo señor?! ¡¿Al dueño de tu alma?!\nTu ambición mal encaminada te costará cara y disfrutaré mucho haciéndote pagar..."
  POD_demon_maintenance.70.option.a: "¡Fue un error honesto!"
 
  POD_demon_arcana.100.t: "Comprar Arsenal de la Bestia"
  POD_demon_arcana.100.desc: "Compra una nueva arma bestial."
  POD_demon_arcana.100.a: "[GetModifier('arsenal_of_the_beast_claws_modifier').GetNameWithTooltip]"
  POD_demon_arcana.100.b: "[GetModifier('arsenal_of_the_beast_fangs_modifier').GetNameWithTooltip]"
  POD_demon_arcana.100.c: "[GetModifier('arsenal_of_the_beast_gaping_maw_modifier').GetNameWithTooltip]"
  POD_demon_arcana.100.d: "[GetModifier('arsenal_of_the_beast_horns_modifier').GetNameWithTooltip]"
  POD_demon_arcana.100.e: "[GetModifier('arsenal_of_the_beast_lashing_tail_modifier').GetNameWithTooltip]"
  POD_demon_arcana.100.f: "[GetModifier('arsenal_of_the_beast_poison_modifier').GetNameWithTooltip]"
  POD_demon_arcana.100.g: "[GetModifier('arsenal_of_the_beast_venom_spit_modifier').GetNameWithTooltip]"
  POD_demon_arcana.100.h: "[GetModifier('arsenal_of_the_beast_spines_modifier').GetNameWithTooltip]"
  POD_demon_arcana.100.i: "[GetModifier('arsenal_of_the_beast_tentacles_modifier').GetNameWithTooltip]"
  POD_demon_arcana.100.j: "[GetModifier('arsenal_of_the_beast_wings_modifier').GetNameWithTooltip]"
 
  POD_days_of_fire.1342.t: "Segundo Gran Maelstrom"
  POD_days_of_fire.1342.desc: "Para los seguidores del Hombre Condenado, tal oscuridad cae sobre la Tierra\nY sobre el alma humana\nQue los vivos envidian a los muertos, y más, envidian a los que han olvidado morir.\nIncluso mientras los muertos sufren su segunda gran tormenta, los vivos,\nDespreciando el don supremo del Único Dador,\nEn su lugar abrazan la maldición del Gran Rey de la Sangre.\nNo una vez sucederá esto, sino dos."
  POD_days_of_fire.1401.t: "Renacimiento"
  POD_days_of_fire.1401.desc: "Con el tiempo, la oscuridad se levanta.\nEl hombre vuelve sus ojos una vez más a los cielos\nY encuentra algo más grande que él mismo.\nUn hombre con un ojo de cristal ve la verdad, y un hombre con una nariz de plata la huele.\nUn necio sabio pregunta por qué la luna no cae.\nSon padres, sin saberlo, de una nueva tribu, que triunfa sin ser vista.\nFundan la tribu de la Mente."
  POD_days_of_fire.1430.t: "Inquisición"
  POD_days_of_fire.1430.desc: "Cuando los hijos del Hombre Condenado se conviertan en padres\nY sin embargo se nieguen a engendrar hijos\nSe lanzarán sobre los hijos del Gran Rey de la Sangre\nY se lanzarán sobre los hijos del Libro.\nSu lluvia cae sobre los justos y los injustos por igual\nY esa lluvia no es agua, sino fuego.\nBuscando hacer el mal en nombre del bien, sin embargo hacen el bien."
  POD_days_of_fire.1450.t: "Revuelta Anarquista"
  POD_days_of_fire.1450.desc: "Con el tiempo, la maldición del Gran Rey\nLlega a su pleno fruto.\nComo el primer hijo escupió al Único Dador,\nComo su semilla bastarda escupió sobre él,\nAsí los gusanos de su miserable prole\nSe levantarán para picar a las serpientes,\nEl número de su debilidad es catorce: de su fuerza, uno menos."
  POD_days_of_fire.1492.t: "La Tierra Rica"
  POD_days_of_fire.1492.desc: "La Tierra Rica dormita\nHasta que es despertada por hombres de hierro sobre peces de madera.\nSu primer heraldo es la Plaga.\nSu segundo heraldo es el Caballo.\nSu tercer heraldo es el Rayo invocado desde el suelo.\nSu heraldo final es una pestilencia de Alimañas punzantes.\nVienen, iluminan y despojan."
  POD_days_of_fire.1605.t: "Tercer Gran Maelstrom"
  POD_days_of_fire.1605.desc: "La caída de la tribu de la\nTierra Rica\nEs el primer gran pecado de esa nación.\nDe él nace una lluvia de tal\ntormento que, por tercera vez,\nincluso los muertos gimen.\nSu segundo gran pecado es robar a los\nhijos de la Tierra de la Calavera.\nEsclavos para trabajar la tierra pierden\ncada don\nDe libertad, familia y adoración\nPara que los ladrones tengan ropas suaves\ny conozcan el arrullo del dulce licor."
  POD_days_of_fire.1759.t: "Revolución Industrial"
  POD_days_of_fire.1759.desc: "Viendo las maravillas, y prodigios,\ny portentos\nLa gente acude en masa a la tribu de\nla Mente.\nSin abandonar el Libro, ni los \nPilares, ni al Hombre Condenado\nAun así muchos mantienen esa primera lealtad en\nsus bocas y no en sus almas.\nVestiduras finas visten, cosidas\ny tejidas por ninguna mano humana.\nSu voluntad hace girar motores con solo\nla bruma de la niebla.\nDe la elección humana viene todo\nlo que sigue."
  POD_days_of_fire.1775.t: "Revolución Americana"
  POD_days_of_fire.1775.desc: "Una nueva fuerza llega a una tierra antigua\nDesafiando la vieja sabiduría con\nnuevo metal\nY a los viejos gobernantes con nuevos dueños.\nPor el bien de una hoja y una bebida\nse hace esto\nY por caminos hacia el Imperio Medio\ny el Pueblo del Sueño.\nEl orgullo de un antiguo reino es así\nrebajado\nY sus hijos obligados a tomar el\nveneno que sus invasores desprecian."
  POD_days_of_fire.1837.t: "Era Victoriana"
  POD_days_of_fire.1837.desc: "Es llamada una edad hermosa, por\naquellos que no son de la Calavera, o\ndel Sueño.\nIncluso para sus pocos, dura menos de\nuna generación.\nIdeas de caridad y amabilidad y\nhumanidad perfeccionada\nSon sacrificadas a la codicia y la envidia\ny a la imperfección humana.\nLlamadas al gobierno por la razón\nLlevan al gobierno de la razón por la pasión.\nEn nombre de la virtud, impulsos oscuros marchan."
  POD_days_of_fire.1914.t: "Primera Guerra Mundial"
  POD_days_of_fire.1914.desc: "Con miradas codiciosas, cada nación observa\nlos platos de sus vecinos.\nLa Tierra de la Calavera, para siempre\nmaldita, es asaltada como por chacales.\nLa guerra se desata sobre el mundo,\nLuchada no solo en el campo sino\ndentro del mar y sobre el cielo.\nUna vasta llanura de desolación, y\nlodo, y venenos, y bordes afilados\npara cortar\nCicatrizan la tierra por millas\nMientras las mujeres, y los hombres, y\nlos hijos perecen por banderas."
  POD_days_of_fire.1916.t: "Cuarto Gran Maelstrom"
  POD_days_of_fire.1916.desc: "Tal pesar surge de esta guerra\nQue los muertos son perturbados en sus tumbas una vez más.\nUna cuarta tormenta de sombras\nUna cuarta lluvia de recuerdos\nMás amarga que las anteriores pero menos ruda y ruinosa\nQue las dos por venir."
  POD_days_of_fire.1918.t: "Pandemia de Gripe"
  POD_days_of_fire.1918.desc: "Solo cuando la Tierra Rica\nDespierte al fin a los gritos de sus padres\nPodrán las batallas detenerse penosamente.\nPero la miseria no termina entonces.\nCuando la matanza del hombre por el hombre es\nreemplazada\nPor la matanza de todos por la plaga,\nEntonces el tiempo del mundo se\ncuenta en siglos."
  POD_days_of_fire.1931.t: "Segunda Guerra Mundial"
  POD_days_of_fire.1931.desc: "Una segunda guerra se engendra de las semillas\nde la primera\nY una segunda tormenta entre los\nmasacrados.\nEsta vez los derrotados luchan para\nrecuperar su orgullo\nSu signo es la araña de la vida,\nretorcida\nPues es muerte lo que traen al\nPueblo del Libro.\nNo masacran por el calor\nde la batalla,\nSino que asesinan con la calma constante de\nuna madre horneando pan."
  POD_days_of_fire.1937.t: "Guerra Sino-Japonesa"
  POD_days_of_fire.1937.desc: "Más que la nación de la araña negra\nluchan.\nA ellos se une una isla de\nluz oriental.\nA punta de espada violan el\nImperio Medio.\nLos descendientes de los Hijos\ndel Lobo\nBuscan repetir las conquistas\nde sus ancestros\nRegresando una vez más a la Tierra\nde la Calavera."
  POD_days_of_fire.1945.t: "Fin de la Segunda Guerra Mundial"
  POD_days_of_fire.1945.desc: "De nuevo, es la Tierra Rica la que\ninclina una contienda de equilibrio ajustado\nGastando sus riquezas de comida e\nhierro y la sangre de sus hijos.\nAl final de esta guerra,\nLa matanza de hombres por hombres es\nreemplazada\nPor la matanza de ideas y\ncreencias.\nUna guerra de fuego y rayos\nReemplazada por una lucha de silencio\ny frío."
  POD_days_of_fire.1950.t: "Telón de Acero"
  POD_days_of_fire.1950.desc: "Un muro se levanta\nPero es sobrevolado\nMientras el Águila y el Oso contienden.\nMentes superficiales engendran profunda animosidad\nY el número de su miedo ciego es cincuenta y siete.\nMarionetas luchan guerras con sangre real\nY todos viven a la sombra del fuego impío."
  POD_days_of_fire.1999.t: "Sexto Gran Maelstrom"
  POD_days_of_fire.1999.desc: "Viene una sexta tormenta que no\nmuere, nunca calmada por el sol.\nUna tormenta silenciosa invisible, un muro de\nspantos y sombras.\n¿Viene de un don de Ángel,\ndespertando el fuego que duerme en todos?\n¿Viene de las sombras recordadas,\nlibrando guerra contra los olvidados?\nViene. Luego viene ella.\nLas tumbas escupen, los recuerdos arruinan lo\nreal, un lamento resuena en el salón del [UmbraGlossary('oblivion')].\nSu temida progenie oscura teme a la\nGran Fauce, que ama incluso mientras\nconsume."
 
  POD_demon_flavor.1.t: "Recuerdos: Desearía haber sido un ángel"
  POD_demon_flavor.1.desc: "Todos los demonios fueron una vez ángeles, la creación artesanal de Dios para ayudarle a administrar y vigilar a los humanos. Cada ángel tenía un propósito (a veces amplio, a veces muy específico) grabado en su ser durante la Creación. Este propósito divino es su esencia misma, y aunque ha sido retorcido y corrompido por milenios de rebelión y encarcelamiento, nunca puede ser completamente borrado.\nTu creciente eminencia ha rescatado del olvido algunos de esos primeros recuerdos. Durante esos tiempos más simples antes de la Rebelión, ¿cuál era tu propósito?"
  POD_demon_flavor.1.a: "Un ángel del destino"
  POD_demon_flavor.1.b: "Un ángel de los patrones"
  POD_demon_flavor.1.c: "Un ángel del liderazgo"
  POD_demon_flavor.1.d: "Un ángel de los senderos"
  POD_demon_flavor.1.e: "Un ángel de la luz estelar"
 
  POD_demon_flavor.100.t: "Escalera al Infierno"
  POD_demon_flavor.100.desc: "Los demonios se alimentan de la fe proporcionada directamente por sus esclavos o incluso indirectamente por personas que caen en su pecado de especialización. Con fe, un demonio se vuelve verdaderamente poderoso y puede, teóricamente al menos, alcanzar un poder igual al del propio Dios.\nA medida que tu eminencia crece y tu dominio sobre la humanidad de Dios se expande, también lo hace tu poder. ¿Deseas usar la piedad de tu rebaño para fortalecerte y ascender en las filas demoníacas?"
  POD_demon_flavor.100.a: "Un pequeño impulso."
  POD_demon_flavor.100.b: "Mi potencial es ilimitado."
  POD_demon_flavor.100.c: "¡Alabadme!"
  POD_demon_flavor.100.d: "¡Los Cielos temblarán!"
  POD_demon_flavor.100.e: "¡Poder ilimitado!"
  POD_demon_flavor.100.f: "Soy lo suficientemente poderoso"
 
  POD_demon_flavor.2.t: "Recuerdos: Génesis"
  POD_demon_flavor.2.desc: "La humanidad era la creación más fina de Dios, o eso pensaba Él. Tu propósito, como ángel, era vigilarlos y guiarlos, pero nunca mostrarte. En verdad, fue un punto de inflexión con Dios favoreciendo claramente a su creación más reciente... pero también advirtiéndote que no interfirieras con sus posibles errores. Incluso si tales errores pudieran llevar a catástrofes. Muchos ángeles estaban divididos en este asunto, algunos pensando que las órdenes contradictorias de Dios eran una prueba. O que dejó de preocuparse por ellos ahora que la humanidad comenzaba su ascenso.\nAl final, algunos se volvieron celosos de la humanidad, otros sobreprotectores, otros se quedaron al margen. ¿Y tú?"
  POD_demon_flavor.2.a: "Seguiste tu propósito: guiarlos."
  POD_demon_flavor.2.b: "Estabas envidioso y resentido con ellos."
  POD_demon_flavor.2.c: "Te mostraste como un maestro."
 
  POD_demon_flavor.3.t: "Recuerdos: La Caída"
  POD_demon_flavor.3.desc: "La Guerra en el Cielo comenzó cuando llegó una profecía para advertir a los ángeles sobre un desastre inminente que caería sobre la humanidad. Algunos, liderados por Lucifer, querían revelarse a los mortales para salvarlos de este destino. Otros pensaban que la voluntad de Dios de no interferir con la humanidad era más importante que su papel como guardianes. El debate se convirtió en guerra después de que Caín asesinara a su hermano Abel, introduciendo el concepto de violencia en el mundo naciente.\nLa rebelión de Lucifer perdió al final, y todos los rebeldes se convirtieron en los seres ahora conocidos como demonios, como tú mismo. Pero ¿por qué te uniste al bando de Lucifer en primer lugar?"
  POD_demon_flavor.3.a: "El carisma de Lucifer te convenció."
  POD_demon_flavor.3.b: "Querías proteger a la humanidad."
  POD_demon_flavor.3.c: "El nuevo concepto de guerra te fascinó."
  POD_demon_flavor.3.d: "A día de hoy, todavía no estás seguro."
 
  POD_demon_flavor.4.t: "Recuerdos: Condenado al Infierno"
  POD_demon_flavor.4.desc: "Los ángeles rebeldes derrotados, incluyéndote a ti mismo, fueron todos expulsados a la Prisión Abisal. Esta aterradora construcción rompió a la mayoría de sus reclusos en una patética sombra de lo que fueron. Algunos todavía lograron encontrar alguna apariencia de nueva normalidad y no dejaron que su tormento divino los superara. Sin embargo, incluso esto tuvo un coste. Lejos de su propósito original, su esencia misma, los seres antaño conocidos como ángeles se volvieron retorcidos más allá del reconocimiento con la esperanza de encontrar una forma de sobrellevar el estar eternamente excluidos del Cielo.\nAl final, fuiste uno de los pocos afortunados que escapó, pero todavía puedes sentir la atracción de la Prisión llamándote de vuelta. Y los recuerdos de este lugar también están regresando."
  POD_demon_flavor.4.a: "Hiciste cosas allí que preferirías olvidar."
  POD_demon_flavor.4.b: "Rezaste por un perdón que nunca llegó."
  POD_demon_flavor.4.c: "Aguantaste. Eso es todo lo que importa."
 
  POD_demon_flavor.5.t: "Recuerdos: El Infierno en la Tierra"
  POD_demon_flavor.5.desc: "Fuiste uno de los pocos afortunados que terminó siendo convocado fuera de la Prisión Abisal, permitiéndote escapar al mundo mortal después de milenios de tormento con tus compañeros rebeldes. El mundo había cambiado mucho desde tu encarcelamiento. La guerra y la desesperación están en todas partes, las enfermedades campan a sus anchas y el paraíso que fue el Edén parece un mito en este punto. La humanidad todavía adora a Dios pero en múltiples formas y lucha por cuál es mejor.\nÉl podría haber apartado verdaderamente su mirada de la Tierra, tal vez debido a la rebelión de Lucifer, o a los fracasos de la humanidad. En cualquier caso, ¿cuál fue tu primera reacción al ver este nuevo mundo por primera vez?"
  POD_demon_flavor.5.a: "¡Necesita ser purificado!"
  demonic_objective_final_war_unlock: "Desbloquea el objetivo #s $POD_demon_final_war_objective_decision$#! si has completado los objetivos anteriores"
  POD_demon_flavor.5.b: "¡Tantos adoradores potenciales!"
  demonic_objective_overthrow_unlock: "Desbloquea el objetivo #s $POD_new_genesis_objective_decision$#! si has completado los objetivos anteriores"
  POD_demon_flavor.5.c: "Tal vez, en algún lugar, una tenue esperanza de redención."
  chance_of_redemption_unlock: "Desbloquea el objetivo #s $POD_demon_redemption_objective_decision$#!"
  POD_demon_flavor.5.d: "Debo encontrar respuestas a la pregunta Divina."
  demonic_objective_knowledge_unlock: "Desbloquea el objetivo #s $demonic_knowledge_objective_decsion$#! si has completado los objetivos anteriores"
