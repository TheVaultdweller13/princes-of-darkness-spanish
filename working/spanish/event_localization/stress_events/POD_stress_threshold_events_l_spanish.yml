l_spanish:
 
 # Reemplaza stress_threshold.3301 —	Dolor de corazón
 
 stress_threshold.3311.t: "Crisis mental: La Bestia gana"
 stress_threshold.3311.desc: "Tras siglos de lucha, la bestia finalmente toma el control. Intentaste seguir una senda, aferrarte a nobles ideas de autocontrol, de repeler al monstruo que llevas dentro.\nHas fracasado.\nCon tu adhesión a tu senda menguando y tu fuerza de voluntad agotada, ya nada detiene a la bestia. #beast Nunca pudiste mantenerme a raya. ¡ERES MÍO!#!"
 stress_threshold.3311.desc_instinct: "Tras siglos de lucha contra ella, la bestia finalmente te ahoga. Intentaste seguir una senda, perseguir ideas ambiciosas para controlar al monstruo que llevas dentro, de aprovechar su poder conservando tu personalidad.\nHas fracasado.\nCon tu adhesión a la senda menguando y tu fuerza de voluntad agotada, la ola de frenesí te ahoga para siempre. #beast ¿USARME? ¿APROVECHARME? Alfeñique, te mostraré mi poder.#!" 
 stress_threshold.3311.a: "Estoy perdido."
 
 stress_threshold.3321.t: "Crisis mental: Alma sombría"
 stress_threshold.3321.desc: "De todos los estados del alma, el alma sombría es el más temido. Durante el alma sombría, el Demonio del personaje busca establecer su dominio. Cuando un personaje cae en el alma sombría, libra una guerra interna contra los impulsos e insinuaciones del P'o.\nSi el Hun pierde esta guerra, retrocede en sumisión y la Naturaleza del P'o toma el control por un tiempo, causando posiblemente que el personaje cometa actos que su yo superior encontraría aborrecibles. El fracaso prolongado en resistir al P'o puede enviar a un personaje en una espiral lejos de su [Glossary('Dharma','podgloss.dharma')] para unirse a las filas de los chih-mei, o algo peor."
 stress_threshold.3321.a: "Estoy perdido."
 
 stress_threshold.3331.t: "Crisis mental: La caída de la gracia"
 stress_threshold.3331.desc: "El camino de Ma'at es difícil de recorrer, y no todos los Renacidos pueden realizar el viaje. Si una momia cae de la gracia, ocurre uno de los dos resultados posibles. La primera posibilidad es que los Jueces de Ma'at consideren a la momia indigna de la vida eterna. Arrojan el alma de la momia a Amemait, y la momia deja de existir. La segunda opción y la única posibilidad de que la momia siga existiendo es que el Amenti renuncie a Osiris y a Ma'at y acepte servir a $glossary_wyrm_apophis$."
 stress_threshold.3331.a: "Acepto vuestra sentencia."
 stress_threshold.3331.b: "¡Sálvame, Gran Serpiente!"
 
 stress_threshold.3341.t: "Crisis mental: Nacimiento de un Espectro"
 stress_threshold.3341.desc: "Un mortal que muere en circunstancias especialmente violentas o un wraith cuya Sombra lo reclama es \"renacido\" como un Espectro. Esto es más que una simple transformación física. La personalidad y la estructura psicológica del individuo, así como su propia forma física, se disuelven y se reconstruyen con la materia del propio [UmbraGlossary('oblivion')]. Los detalles varían de un Espectro a otro —algunos emergen como monstruosidades, con su [Corpus|E] escaldado, deformado y estirado en una pesadilla andante, mientras que otros parecen poco diferentes salvo por la evidencia de su muerte grabada permanentemente en ellos—, pero todos llevan la marca inconfundible del Olvido."
 stress_threshold.3341.a: "Estoy perdido."
 stress_threshold.3341.b: "¡No puedes llevarme!"
 stress_threshold.3341.tooltip: "Esta opción está disponible porque tienes la [perk|E] [GetPerk( 'defiance_perk' ).GetName( GetPlayer )]"
 
 stress_threshold.3351.t: "Crisis mental: Consunción"
 stress_threshold.3351.desc: "Las escrituras afirman que el salario del pecado es la muerte, y los malditos saben que esto es cierto. Los demonios y esclavos con mucho Tormento sufren daños letales cada día al amanecer. La manifestación real de estas heridas varía entre los malditos, aunque a menudo guarda relación con el Vicio del personaje e inevitablemente resulta en un fallecimiento dramáticamente espantoso. La Ira podría arder como una llama literal hasta que el personaje sufra una combustión espontánea. La Envidia puede tomar la forma de veneno o incluso ácido con fines similares. La Gula a menudo consume la carne, canibalizando el cuerpo hasta convertirlo en una cáscara marchita. La Soberbia puede tomar la forma de estigmas sagrados para burlarse del sacrificio de Cristo."
 stress_threshold.3351.a: "¡Ugh...!"
 
 stress_threshold.3361.t: "Crisis mental: Desequilibrio"
 stress_threshold.3361.desc: "Todos los fae tienen un grado limitado de control tanto sobre las Nieblas como sobre el Tejido, el caos y el orden, el potencial mágico y la aplicación mágica. Para un hada individual, mantener ambas fuerzas en equilibrio es fundamental, sin embargo. Si una eclipsa a la otra, un fae puede quedar Perdido (un exceso de Nieblas) o Bloqueado (una dependencia excesiva del Tejido). Ambos estados, si no se controlan, pueden suponer el fin del fae, haciendo que se desvanezca del mundo por completo o que se atrinchere tanto en lo físico y predecible que pierda su conexión con las Nieblas y se convierta, a todos los efectos prácticos, en humano."
 stress_threshold.3361.a: "¡Ugh...!"
 
 stress_threshold.3362.t: "Crisis mental: Deshacer"
 stress_threshold.3362.desc: "La fuerza de la Banalidad en el mundo mortal es tan fuerte que, si un changeling no tiene cuidado, puede separar a un fae de su yo mortal. A medida que un changeling es desgastado por la Banalidad, empieza a olvidar su conexión con el [UmbraGlossary('dreaming')]. Los recuerdos de sus yos feéricos desaparecen y un fae puede caer en el Deshacer, un tiempo en el que un changeling olvida su tiempo como fae y, en su lugar, es subsumido por completo en su apariencia mortal. Si el proceso no se detiene o al menos se ralentiza, el changeling pierde el contacto con su mitad feérica por completo. Lo que queda es la mitad mortal hueca, viviendo su vida solo en el mundo aburrido y banal."
 stress_threshold.3362.a: "¡Ugh...!"
 
 # Evento de nivel de estrés 2 de KJ
 
 stress_threshold.2361.t: "Crisis mental: Alma de fuego"
 stress_threshold.2361.desc: "El alma de fuego es locura, pura y simple. Los [GetTrait('kueijin').GetName( GetNullCharacter )] en el estado de alma de fuego son monstruos salvajes, consumidos por la rabia. Los ignorantes Kin-jin se refieren a esta fase como 'frenesí', y hay poca diferencia entre los dos estados."
 stress_threshold.2361.a: "Sucumbe a tu rabia."
 stress_threshold.2361.b: "Resiste con todo tu Chi Yin."
 stress_threshold.2361.fight.failed: "Has fracasado."
 
 stress_threshold.2371.t: "Crisis mental: Alma de ola"
 stress_threshold.2371.desc: "Los [GetTrait('kueijin').GetName( GetNullCharacter )] que sufren la debilitante alma de ola pierden completamente el control ante impulsos de terror. Este estado (llamado así porque los [GetTrait('kueijin').GetName( GetNullCharacter )] bajo su control parecen ser sacudidos por olas de miedo) es considerado sumamente vergonzoso por los [Glossary('Hungry Dead','game_concept_kuei_jin_desc')], quienes buscan evitarlo a toda costa, particularmente frente a sus pares."
 stress_threshold.2371.a: "Sucumbe a tu miedo."
 stress_threshold.2371.b: "Resiste con todo tu Chi Yang."
 stress_threshold.2371.fight.failed: "Has fracasado."
 
 # Evento de nivel de estrés 1 de KJ
 
 stress_threshold.1742.t: "Crisis mental: Toma de control por El Bandido"
 stress_threshold.1742.desc: "Aunque un [GetTrait('kueijin').GetName( GetNullCharacter )] puede tener un papel específico que cumplir o una razón particular para haber regresado de entre los muertos, el bandido no acepta nada de eso.\nEste P'o no ve utilidad en el Gran Ciclo, que, después de todo, está muy alejado de su existencia noche tras noche. Más bien, ignora los mandatos del Cielo y del infierno y busca llevar al [GetTrait('kueijin').GetName( GetNullCharacter )] a actos aleatorios de destrucción autosatisfecha. El objetivo final del bandido es derribar todo el Gran Ciclo, tal vez por resentimiento al haber sido ordenado de vuelta a las tierras de los vivos, pero mientras tanto cualquier objetivo —y cualquier representante del orden— sirve como foco para la rabia del P'o."
 stress_threshold.1742.a: "Mi Alma de Viento está abrumada."
 
 stress_threshold.1743.t: "Crisis mental: Toma de control por El Bárbaro"
 stress_threshold.1743.desc: "El Bárbaro busca rechazar las formas tradicionales de los [GetTrait('kueijin').GetName( GetNullCharacter )] y reemplazarlas con los métodos caóticos e indisciplinados de los Kin-jin. Al ver la libertad relativa de los vampiros occidentales, desea abandonar su herencia y unirse a los Kin-jin en su decadencia.\nEl bárbaro se burla de la devoción al deber y el respeto por la tradición del Hun, y aprovecha cada oportunidad para comparar las formas catayanas y occidentales. No hace falta decir que, en el análisis del bárbaro, las formas occidentales siempre salen mejor paradas."
 stress_threshold.1743.a: "Mi Alma de Viento está abrumada."
 
 stress_threshold.1744.t: "Crisis mental: Toma de control por El Engañador"
 stress_threshold.1744.desc: "El Engañador no tiene utilidad para la verdad, sea buena, mala o indiferente. Practica la mentira por el simple hecho de mentir: diciéndole al Hun lo que quiere oír en un momento, y luego llevándolo al borde de la locura con una falsedad patente al siguiente.\nAunque este comportamiento pueda parecer errático, el P'o tiene un objetivo subyacente. No busca nada menos que hacer que el [GetTrait('kueijin').GetName( GetNullCharacter )] sea incapaz de confiar en sí mismo. Cuantas más veces consiga el Engañador que el Hun crea sus mentiras —y cuantas más veces diga la verdad y sea ignorado—, menos podrá el Hun confiar en su propio juicio. Si el P'o se sale con la suya, finalmente la voluntad del Hun queda destrozada, y el vampiro se encuentra incapaz de dar un paso o tomar cualquier decisión sin el consejo amoroso del Engañador."
 stress_threshold.1744.a: "Mi Alma de Viento está abrumada."
 
 stress_threshold.1745.t: "Crisis mental: Toma de control por El Demonio"
 stress_threshold.1745.desc: "El Demonio busca devorarlo todo. Cualquier cosa más débil que el [GetTrait('kueijin').GetName( GetNullCharacter )] es una presa, y cualquier cosa más fuerte es poder que puede ser subsumido mediante la traición. Aunque el Demonio pueda fingir respeto por el deber, la amistad y el honor, está dedicado al poder personal y no le preocupan las opiniones de los demás.\nPara el Demonio, todo lo que ve existe para su diversión, para que él lo destruya y devore a su antojo. Otras almas importan solo en términos de cómo se relacionan con el Demonio, y con qué rapidez puede el Demonio devorarlas."
 stress_threshold.1745.a: "Mi Alma de Viento está abrumada."
 
 stress_threshold.1746.t: "Crisis mental: Toma de control por El Loco"
 stress_threshold.1746.desc: "Un Hun afligido por un Loco está destinado a una no-vida frustrante, ya que su P'o pide explicaciones incluso para la acción más simple o evidente. Además, el Loco es incapaz de realizar acciones a largo plazo o planificadas de antemano, y no ve virtud en ninguna de las dos. Como tal, trabaja tan duro como puede (se distrae fácilmente) para conseguir que el [GetTrait('kueijin').GetName( GetNullCharacter )] tome el camino fácil y sencillo, y para evitar riesgos innecesarios (léase: cualquier complicación).\nUn P'o Loco nunca está en silencio, y su incesante parloteo puede distraer incluso al Hun más autocontrolado."
 stress_threshold.1746.a: "Mi Alma de Viento está abrumada."
 
 stress_threshold.1747.t: "Crisis mental: Toma de control por El Legalista"
 stress_threshold.1747.desc: "El P'o Legalista no tolera ninguna desviación del orden de las cosas ordenado celestialmente. No hay lugar para la interpretación o la improvisación en el mundo de este P'o; todo tiene un papel específico que desempeñar, del cual no puede desviarse.\nCualquier acción que tome el [GetTrait('kueijin').GetName( GetNullCharacter )] que contradiga este orden divino —ya sea hablar con familiaridad a alguien de rango superior o aceptar la insubordinación de un inferior— hace que el Legalista entre en cólera hasta que el \"insulto\" haya sido corregido. Por supuesto, solo el P'o puede decidir qué constituye una expiación apropiada, ya sea por parte del [GetTrait('kueijin').GetName( GetNullCharacter )] o de otro. Como tal, un P'o Legalista particularmente sádico puede mantener a su otra mitad pasando por aros muy formales durante días (o incluso más)."
 stress_threshold.1747.a: "Mi Alma de Viento está abrumada."
 
 stress_threshold.1748.t: "Crisis mental: Toma de control por El Mono"
 stress_threshold.1748.desc: "Aunque el [GetTrait('kueijin').GetName( GetNullCharacter )] puede haber regresado al Reino Medio por una razón, al Mono no le importa mucho. Es una criatura del momento, siendo cada nuevo placer o distracción lo más importante del mundo. El Mono es capaz de urdir planes elaborados para lograr objetivos pequeños o momentáneos, pero no le preocupa en absoluto ninguna misión general que el [GetTrait('kueijin').GetName( GetNullCharacter )] pueda tener. De hecho, el Mono busca, en cada momento, desviar al catayano de su objetivo asignado, para desviar toda la atención y energía del vampiro hacia cosas menores y transitorias."
 stress_threshold.1748.a: "Mi Alma de Viento está abrumada."
 
 stress_threshold.1749.t: "Crisis mental: Toma de control por El Esclavo"
 stress_threshold.1749.desc: "El Esclavo no confía en el juicio del [GetTrait('kueijin').GetName( GetNullCharacter )], el cual busca socavar en cada momento. Siempre que es posible, el Esclavo hace todo lo posible para poner al [GetTrait('kueijin').GetName( GetNullCharacter )] bajo el control de otro. Este camino es lo mejor, obviamente, ya que el Esclavo sabe que el [GetTrait('kueijin').GetName( GetNullCharacter )] es incapaz de hacer nada correctamente por sí mismo.\nPor lo tanto, cuestiona cada decisión que toma el Hun y aprovecha cada oportunidad para obligar al [GetTrait('kueijin').GetName( GetNullCharacter )] a someterse. No es de extrañar que, una vez que el P'o logra esclavizar al Hun, el Esclavo comience inmediatamente a lamentar su destino e inste al Hun a escapar, a buscar otro \"maestro\" que lo guíe a través de la existencia. En última instancia, el Esclavo busca servir a los [Glossary('Yama Kings','podgloss.yamaking')], y los catayanos con un fuerte Arquetipo de Esclavo a menudo se convierten en [akuma|E]."
 stress_threshold.1749.a: "Mi Alma de Viento está abrumada."