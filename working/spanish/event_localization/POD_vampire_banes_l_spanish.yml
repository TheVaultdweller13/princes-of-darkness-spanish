l_spanish:

 POD_vampire_banes.0001.t: "Embelesado por la Belleza"
 POD_vampire_banes.0001.desc.intro: "Los Toreador tienen un ojo agudo para la belleza. Tan agudo que pueden ser llevados a alturas extáticas, arrobados, cautivados por un verdadero vislumbre de ella.\n\n"
 POD_vampire_banes.0001.desc.painting: "Viste el cuadro de pasada, luego volviste a mirarlo una y otra vez, contemplándolo durante horas. Los colores radiantes, el sutil sombreado y la pincelada, la superposición de la intención del artista sobre una escena por lo demás ordinaria... cada noche que pasas con este cuadro, notas algo nuevo."
 POD_vampire_banes.0001.desc.song: "La oíste por casualidad. Una fregona, cantando distraídamente para sí misma mientras trabajaba. Y sin embargo, la melodía que compuso con tanta naturalidad tenía una profundidad, una chispa de lo divino. Noche tras noche te la tarareas a ti mismo, intentando recuperar la brillantez de aquel momento."
 POD_vampire_banes.0001.desc.sculpture: "Rara vez te fijas en las esculturas que adornan tus salones y pasillos. Pero una noche una te llamó la atención. Estaba medio olvidada en su nicho, rara vez limpia, y sin embargo los rastros de polvo resaltaban lo mejor de ella, sombreando las curvas y los bordes de esta obra maestra accidental. Prohibiendo a tus sirvientes tocarla, vuelves a esta escultura noche tras noche, encontrando nueva belleza en ella cada vez."
 POD_vampire_banes.0001.desc.poem: "A veces la biblioteca puede ser peligrosa. Especialmente cuando coges un libro y se cae medio poema. ¡Medio poema! Y uno con tanto potencial. Habla de algo verdadero en el alma, pero las partes que faltan son desesperantes. Noche tras noche pruebas rimas para completar el poema. Cada vez estás más cerca, pero ninguno de tus trabajos le hace justicia."
 POD_vampire_banes.0001.desc.end: "\n\nUna distracción como esta puede durar meses antes de desvanecerse."
 POD_vampire_banes.0001.a: "La belleza es el alma del mundo."
