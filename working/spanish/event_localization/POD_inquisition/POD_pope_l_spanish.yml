l_spanish:
 
  inquisition_full_support_modifier: "Apoyo papal total"
  inquisition_full_support_modifier_desc: "Cuentas con el respaldo total de Su Santidad y, por tanto, de la propia Iglesia. ¡Gloria a Dios!"
  
  PODask_pope.1.t: "Su Santidad: Gregorio IX"
  PODask_pope.1.desc: "La Inquisición en las Sombras es, en muchos sentidos, una extensión directa de la Iglesia Católica, y la mayor parte de su financiación y respaldo provienen directamente de ella. El Papa Gregorio es un ferviente defensor de este esfuerzo, hasta el punto de que está considerando crear una Inquisición \"pública\" para abordar amenazas menos sobrenaturales en el futuro. Tener el oído directo de un individuo tan poderoso es una bendición que la naciente Inquisición en las Sombras no debe desperdiciar a la ligera.\nMuchos inquisidores temen que los sucesores de Gregorio no estén tan dispuestos a apoyar vuestros esfuerzos, tal vez debido a la interferencia sobrenatural o simplemente al desinterés (o la incredulidad ante la amenaza) por su parte. Si esto ocurriera, es probable que la organización en su conjunto sufriera. Voces preocupadas entre los inquisidores planean hacer todo lo que puedan a corto plazo y rezan por una vida larga y saludable para Gregorio."
  PODask_pope.1.a: "¡Larga vida a Su Santidad!"
  
  PODask_pope.3.t: "Humo blanco, nubes blancas"
  PODask_pope.3.desc: "Su Santidad ha fallecido recientemente, dejando a los estimados cardenales la tarea de elegir al próximo ocupante de la sede de San Pedro. Este es un acontecimiento seguido de cerca por la Inquisición en las Sombras, no solo por cuestiones de devoción cristiana, sino también porque el apoyo del Papa es primordial para la salud a largo plazo de la organización.\nLos cardenales han elegido bien esta vez, y el nuevo Papa apoya plenamente a la Inquisición en las Sombras, utilizando toda su considerable influencia para asegurarse de que no os falte nada que pueda ayudaros a combatir la verdadera amenaza."
  
  PODask_pope.4.t: "Humo blanco, cielos despejados"
  PODask_pope.4.desc: "Su Santidad ha fallecido recientemente, dejando a los estimados cardenales la tarea de elegir al próximo ocupante de la sede de San Pedro. Este es un acontecimiento seguido de cerca por la Inquisición en las Sombras, no solo por cuestiones de devoción cristiana, sino también porque el apoyo del Papa es primordial para la salud a largo plazo de la organización.\nEl nuevo Papa ha optado por no interferir en los asuntos de la Inquisición en las Sombras de ninguna forma. Aunque habríais agradecido un apoyo más claro de Roma, al menos no hay oposición contra vuestra orden. Esto tendrá que bastar por ahora."
  PODask_pope.4.a: "Larga vida a Su Santidad."
 
  inquisition_no_support_modifier: "Prohibición papal"
  inquisition_no_support_modifier_desc: "Ya no formas parte oficialmente de la Iglesia Católica. Solo unos pocos miembros de alto rango de la Curia te siguen apoyando."
  
  PODask_pope.5.t: "Humo blanco, nubes negras"
  PODask_pope.5.desc: "Su Santidad ha fallecido recientemente, dejando a los estimados cardenales la tarea de elegir al próximo ocupante de la sede de San Pedro. Este es un acontecimiento seguido de cerca por la Inquisición en las Sombras, no solo por cuestiones de devoción cristiana, sino también porque el apoyo del Papa es primordial para la salud a largo plazo de la organización.\nPreocupantemente, el nuevo Papa se ha horrorizado al ser informado de la existencia de la Inquisición en las Sombras. Acusándola de ser uno de los sucios secretos de los que quiere deshacerse durante su mandato, Su Santidad ha retirado oficialmente todo el apoyo de la Iglesia. Esta es una situación extrema, pero podría haber una solución: algunos cardenales todavía apoyan vuestra causa y, con el apoyo adecuado por vuestra parte, aún podrían mantener abierta la línea de comunicación entre vosotros y la Iglesia."
  PODask_pope.5.a: "Larga vida a Su Santidad..."
  PODask_pope.5.b: "Nosotros sabemos más."
 
  PODask_pope.6.t: "Humo blanco, sombras cambiantes"
  PODask_pope.6.desc: "Su Santidad ha fallecido recientemente, dejando a los estimados cardenales la tarea de elegir al próximo ocupante de la sede de San Pedro. Este es un acontecimiento seguido de cerca por la Inquisición en las Sombras, no solo por cuestiones de devoción cristiana, sino también porque el apoyo del Papa es primordial para la salud a largo plazo de la organización.\nEl nuevo Papa es un hombre de inclinaciones espirituales y no se preocupa mucho por los asuntos temporales como vuestra organización. Parece que los cardenales tendrán una importancia inflada durante su mandato y esto es una noticia preocupante para vosotros, ya que a menudo son el objetivo de la influencia sobrenatural. Podríais intentar lanzar una investigación a gran escala sobre ellos, pero esto sin duda molestaría a algunos."
  PODask_pope.6.a: "Apuntemos a los que son realmente corruptos."
  PODask_pope.6.b: "¡Los herejes serán purgados!"
  PODask_pope.6.effect.success.desc: "¡Una investigación exitosa!"
  PODask_pope.6.critical_failure.effect.desc: "Obstaculizados a cada paso..."
 
  PODask_pope.7.t: "Humo blanco, sombras blancas"
  PODask_pope.7.desc: "Su Santidad ha fallecido recientemente, dejando a los estimados cardenales la tarea de elegir al próximo ocupante de la sede de San Pedro. Este es un acontecimiento seguido de cerca por la Inquisición en las Sombras, no solo por cuestiones de devoción cristiana, sino también porque el apoyo del Papa es primordial para la salud a largo plazo de la organización.\nPara ayudar a la Inquisición en las Sombras, el nuevo Papa planea un acercamiento diplomático a otras fes y a sus propias organizaciones de cazadores. Obviamente se espera que os unáis y ayudéis a aclarar cualquier malentendido pasado entre ellos y la Iglesia Católica para facilitar el proceso. Estando Su Santidad inclinado a ayudar, también podríais convencerle de que sería un esfuerzo inútil y redirigir los fondos a otra parte."
  PODask_pope.7.a: "Una idea brillante, Su Santidad."
  PODask_pope.7.b: "No se puede confiar en estos herejes."
  PODask_pope.7.effect.success.desc: "¡Una negociación exitosa!"
  PODask_pope.7.critical_failure.effect.desc: "Exitosa, pero costosa."
 
  PODask_pope.8.t: "Humo blanco, vientos dorados"
  PODask_pope.8.desc: "Su Santidad ha fallecido recientemente, dejando a los estimados cardenales la tarea de elegir al próximo ocupante de la sede de San Pedro. Este es un acontecimiento seguido de cerca por la Inquisición en las Sombras, no solo por cuestiones de devoción cristiana, sino también porque el apoyo del Papa es primordial para la salud a largo plazo de la organización.\nAunque no es abiertamente hostil a la Inquisición en las Sombras, el nuevo Papa está convencido de que estáis exagerando la amenaza real. Como tal, ha decretado un recorte masivo en los fondos que se os proporcionan, fondos que os ayudan a organizar la mayor parte del trabajo que hacéis en el campo. Tendréis que revisar todos vuestros procesos existentes y probablemente hacer algunos recortes difíciles si queréis seguir funcionando como hasta ahora."
  PODask_pope.8.a: "Hora de reorganizarse."
  PODask_pope.8.b: "Hora de recortar gastos."
  PODask_pope.8.effect.success.desc: "¡Una reorganización exitosa!"
  PODask_pope.8.critical_failure.effect.desc: "Hizo que las cosas empeoraran..."
 
  inquisition_disorganized_levies_modifier: "Ansiosos e inexpertos"
  inquisition_disorganized_levies_modifier_desc: "Muchos nuevos reclutas se unen a la buena lucha. Sin embargo, su gran número y su total inexperiencia están causando problemas."
  
  PODask_pope.9.t: "Humo blanco, vientos de sangre"
  PODask_pope.9.desc: "Su Santidad ha fallecido recientemente, dejando a los estimados cardenales la tarea de elegir al próximo ocupante de la sede de San Pedro. Este es un acontecimiento seguido de cerca por la Inquisición en las Sombras, no solo por cuestiones de devoción cristiana, sino también porque el apoyo del Papa es primordial para la salud a largo plazo de la organización.\nEl nuevo Papa está ansioso por ayudar a la Inquisición en las Sombras y, como tal, ha emitido un llamamiento para que todos los jóvenes aptos se unan a vuestras filas sin avisaros primero. Aunque ciertamente bien intencionado, este gesto ha causado una gran desorganización en vuestras filas, ya que esos nuevos reclutas están muy lejos de los estándares que esperáis de los campeones de la Inquisición. Esto requerirá cierto esfuerzo para solucionarlo."
  PODask_pope.9.a: "Hora de reorganizarse."
  PODask_pope.9.b: "Simplemente aceptar a todos y ocuparse de ello más tarde."
 
  PODask_pope.10.t: "Humo blanco, vientos blancos"
  PODask_pope.10.desc: "Su Santidad ha fallecido recientemente, dejando a los estimados cardenales la tarea de elegir al próximo ocupante de la sede de San Pedro. Este es un acontecimiento seguido de cerca por la Inquisición en las Sombras, no solo por cuestiones de devoción cristiana, sino también porque el apoyo del Papa es primordial para la salud a largo plazo de la organización.\nAunque no descarta el uso de la Inquisición en las Sombras, al nuevo Papa le preocupa la moralidad de algunas acciones emprendidas en su nombre. Astuto teólogo, ha pedido hablar con vosotros para ayudaros a ambos a evaluar si los resultados valen realmente el coste que amenaza al alma. Obviamente estáis convencidos de que la respuesta es sí, pero hacer que Su Santidad esté de acuerdo con eso podría ser más difícil."
  PODask_pope.10.a: "Hora de debatir."
  PODask_pope.10.b: "Su Santidad tiene razón, obviamente."
  PODask_pope.10.effect.success.desc: "¡Su Santidad está de acuerdo!"
  PODask_pope.10.critical_failure.effect.desc: "¿Estoy verdaderamente condenado?"
 
  PODask_pope.11.t: "Humo blanco, niebla blanca"
  PODask_pope.11.desc: "Su Santidad ha fallecido recientemente, dejando a los estimados cardenales la tarea de elegir al próximo ocupante de la sede de San Pedro. Este es un acontecimiento seguido de cerca por la Inquisición en las Sombras, no solo por cuestiones de devoción cristiana, sino también porque el apoyo del Papa es primordial para la salud a largo plazo de la organización.\nEl nuevo Papa no discute la importancia de la Inquisición en las Sombras, pero le preocupa la imagen pública que podría darle. Después de todo, vuestra organización no está bajo supervisión directa y podría descarrilar en cualquier momento. Como las repercusiones para la Iglesia serían nefastas, Su Santidad os pide que cortéis la mayoría de vuestros vínculos con él. Esto significaría que la Inquisición en las Sombras se retiraría aún más tras el telón, lo que puede ser un arma de doble filo."
  PODask_pope.11.a: "Su Santidad ha hablado."
  PODask_pope.11.b: "¡Necesitamos esos vínculos con la Iglesia!"
 
  PODask_pope.12.t: "Humo blanco, cielos nublados"
  PODask_pope.12.desc: "Su Santidad ha fallecido recientemente, dejando a los estimados cardenales la tarea de elegir al próximo ocupante de la sede de San Pedro. Este es un acontecimiento seguido de cerca por la Inquisición en las Sombras, no solo por cuestiones de devoción cristiana, sino también porque el apoyo del Papa es primordial para la salud a largo plazo de la organización.\nPor suerte, el nuevo Papa apoya a la Inquisición en las Sombras, aunque parece especialmente afecto a vuestra orden específica. Aceptar los numerosos títulos y otras muestras de elogio que intenta otorgar sin duda se reflejaría bien en vuestra gente, pero menos en vuestra propia persona."
  PODask_pope.12.a: "Su Santidad nos halaga."
  PODask_pope.12.b: "Es un esfuerzo de equipo."
 
  PODask_pope.30.t: "El Legado Papal"
  PODask_pope.30.desc.exco: "Estaba destinado a suceder.\nA pesar de tus mejores esfuerzos por ocultarlo, el Legado Papal enviado por el nuevo Papa para evaluar tu orden no tardó en oír los rumores de tus poderes y resistencia claramente impíos. Desvió tus intentos de \"convencerle\" de lo contrario y se apresuró a huir de tu campamento tan rápido como había llegado.\nLa carta de Roma llegó poco después y no es una sorpresa. Has sido excomulgado, tú y tu orden despojados de cualquier forma de apoyo por parte de la Iglesia. Aunque eres libre de seguir haciendo lo que hacías (ya que Roma no parece tener intención de cazarte, al menos por ahora), tu existencia se ha vuelto de repente mucho más complicada."
  PODask_pope.30.desc.witch: "Estaba destinado a suceder.\nA pesar de tus mejores esfuerzos por ocultarlo, el Legado Papal enviado por el nuevo Papa para evaluar tu orden no tardó en oír los rumores de tus poderes y resistencia claramente impíos. Tu conversación para convencerle de que estás usando estos poderes por el bien de la cristiandad fue tensa, por decir lo menos. Está claro que tu crédito ante la Iglesia ha disminuido significativamente tras ese evento. Aun así, lograste evitar una amenaza más drástica, como la excomunión, lo que significa que puedes continuar tu trabajo como de costumbre... aunque bajo un mayor escrutinio de Roma."
  PODask_pope.30.desc: "El Legado Papal enviado por el nuevo Papa para evaluar tu orden sagrada ha partido recientemente. Ha sido una visita agradable, considerando todo. El compromiso de Su Santidad de ayudar a la Inquisición en las Sombras tanto como pueda fue reafirmado por el enviado. Parece, al menos por el momento, que la Curia apoyará vuestros esfuerzos plenamente. Una perspectiva bienvenida."
  PODask_pope.30.a: "No necesito a la Iglesia para salvar la cristiandad."
  inquisition_excommunicated_tt: "Esta Prohibición Papal significa que has perdido el [curia_support|E] y el acceso a la mayoría de los hombres de armas de la Inquisición en las Sombras. Puedes recuperar el [curia_support|E] tras la próxima elección papal si tu personaje no está excomulgado en ese momento (por ejemplo, porque dejas que tu heredero tome el mando)."
  PODask_pope.30.b: "¡Mis poderes no son del Diablo!... probablemente"
  
  PODask_pope.40.desc: "El Legado Papal que llegó con la noticia de un nuevo Papa no estaba realmente interesado en los pormenores de vuestra organización. Siguiendo el nuevo protocolo de Roma, se limitó a comprobar rápidamente que no ocurría nada obviamente herético antes de marcharse. Parece que tendréis muy poca supervisión de la Curia durante el reinado de este Papa."
  
  PODask_pope.50.desc: "El Legado Papal enviado por el nuevo Papa para \"revisar\" vuestra orden es casi abiertamente hostil, creyendo que todas estas \"tonterías de la Inquisición en las Sombras\" son una completa pérdida de tiempo y recursos. Critica cada pequeña cosa y tienes la impresión de que desvincularía vuestra orden de Roma si pudiera hacerlo por su cuenta.\nEn cualquier caso, está claramente intentando provocarte, probablemente esperando que cometas un error público que le permita hacer un informe aún más condenatorio al Vaticano."
  PODask_pope.50.a: "¡Dale su merecido!"
  PODask_pope.50.b: "Aprieta los dientes."
  
  PODask_pope.60.desc: "El Legado Papal enviado por Roma para supervisar vuestra orden es un tipo escurridizo que ha despertado tus sospechas. Con el nuevo Papa siendo de mentalidad espiritual, es lamentablemente muy probable que un cardenal en el bolsillo de los engendros del infierno esté moviendo los hilos de este legado, probablemente para presentar un informe condenatorio que corte el tan necesario apoyo que recibís.\nActuar directamente contra el hombre sería imprudente, ya que después de todo sigue siendo un agente del Vaticano, pero podrías puentearlo. Has redactado una carta detallando la importancia espiritual de vuestra santa misión a Su Santidad, con la esperanza de empujarle a ignorar el informe sin duda comprometido que pronto llegará a su escritorio."
  PODask_pope.60.a: "Libramos una guerra por el alma misma de la humanidad."
  PODask_pope.60.effect.success.desc: "Eres escuchado."
  PODask_pope.60.critical_failure.effect.desc: "Oídos sordos..."
   
  PODask_pope.70.desc: "Parte del acercamiento del nuevo Papa a otras fes ya ha dado sus frutos. Te sorprende ver a un legado papal llegando a tu campamento con un grupo de cazadores ortodoxos. Aunque hay cierta sospecha hacia estos cismáticos entre tu gente, los reprendes rápidamente. Estos son compañeros guerreros de Cristo que vienen de lejos, deben ser recibidos como invitados de honor y nada más. Gracias a tu esfuerzo, los Akritai establecen rápidamente su propio campamento no lejos del tuyo y juran sus espadas a tu causa para satisfacción del legado papal."
  PODask_pope.70.a: "Una vista bienvenida."
    
  PODask_pope.80.desc: "El legado papal enviado para supervisar la \"reestructuración\" de vuestra orden se complace al ver que al menos hacéis algunos esfuerzos por recortar gastos. Te asegura que Roma no planea retirar su apoyo a vuestra orden, sino que está preocupada principalmente por algunos problemas recientes del tesoro. Te hace saber de paso que, si aún os sobra algo, una donación adecuada al esfuerzo actual sin duda haría que la Curia valorara vuestra santa misión aún más de lo que ya lo hace."
  PODask_pope.80.a: "Una \"donación\", ya veo..."
  PODask_pope.80.b: "Nuestro tesoro está bajo mínimos."
 
  PODask_pope.90.desc: "Los nuevos reclutas enviados por el Papa han llegado con un legado papal ansioso por ver cómo transformáis a estos jóvenes sin formación en inquisidores hechos y derechos. Lo cual, como bien sabes, requeriría mucho tiempo, muchos esfuerzos y un gran coste en vuestras provisiones, ya que Roma claramente juzgó mal cuánto tiempo llevaría todo este proceso. Sin embargo, a juzgar por el entusiasmo del legado, no hacer al menos un esfuerzo se reflejaría bastante mal en vuestra organización."
  PODask_pope.90.a: "¿Quizás debería pedirles que ayunen para su entrenamiento?"
  PODask_pope.90.b: "Necesitamos calidad, no cantidad."
 
  PODask_pope.100.desc: "El legado papal enviado por el nuevo Papa para revisar vuestra orden ha sido una presencia amigable en vuestro campamento. Además de buscar signos obvios de comportamiento herético, se ha preocupado más por discutir los puntos más finos de la teología con alguien más \"activo en el frente\" como tú. Aunque estás lejos de tener todas las respuestas (sabes más sobre matar a los engendros del infierno que sobre entenderlos), al menos constituye una visita agradable e intrascendente." 
  PODask_pope.100.a: "Creen que el Caín bíblico fue su progenitor."
 
  PODask_pope.110.desc: "El legado papal enviado por el nuevo Papa ha confirmado lamentablemente la nueva política del Vaticano. Es probable que el apoyo a vuestra organización se agote en los próximos años, ya que Su Santidad quiere evitar la posibilidad de un escándalo. Aun así, tenías contingencias preparadas con muchos cardenales que buscan ayudaros en una capacidad menos oficial. Aseguras a tu gente que esto es un contratiempo pero que está lejos de ser el fin de vuestra orden." 
  PODask_pope.110.a: "Aguantaremos."
 
  PODask_pope.120.desc: "La postura favorable del nuevo Papa hacia vuestra orden ya ha dado sus frutos. El legado papal enviado por Su Santidad se apresura a proponer una relación más estrecha con la Curia para vuestra organización específicamente. Aunque esto tiene ventajas obvias, este favoritismo ya ha tensado vuestra relación con otras órdenes de inquisidores que cuestionan vuestro carácter y lo que tuvisteis que hacer para ganar estos favores. Rechazarlos sería una muestra de buena voluntad hacia vuestros aliados." 
  PODask_pope.120.a: "Merecemos esta relación privilegiada."
  PODask_pope.120.b: "Tenemos todo el apoyo que necesitamos."
  
  POD_curia_support_decision: "[curia_support|E]"
  POD_curia_support_decision_tooltip: "Usa tu capital político para pedir favores al Vaticano o pedirles que actúen."
  POD_curia_support_decision_desc: "#X Tu [curia_support|E] actual es [ROOT.ScriptValue('curia_support')|0].#! \n\nEl capital político que has adquirido gracias a tus acciones puede usarse para atraer a Roma a tu bando en diversos asuntos. Puedes ganar más [curia_support|E] ganando guerras mientras permanezcas sin tierras."
  POD_curia_support_decision.tt: "Usarás tu [curia_support|E] para pedir diversos recursos o pedir a la Santa Sede que planee una invasión de una región específica."
  POD_curia_support_decision_confirm: "Una carta a la Santa Sede."
  
  PODask_pope.1000.desc: "Tu influencia sobre la Curia Romana puede aprovecharse para diversos favores. Tanto si el Papa es amistoso con vuestra causa como si no, siempre hay al menos algunos cardenales que comprenden la justicia de vuestra lucha y son capaces de proporcionar algún apoyo.\nCon suficiente apoyo de este tipo, incluso podríais empujar al Vaticano a patrocinar un gran ejército para una Cruzada contra los engendros del infierno en una región específica, ayudando con suerte a purgarla a largo plazo.\n\n#X Tu [curia_support|E] actual es [ROOT.ScriptValue('curia_support')|0].#!"
  pod_curia_renown_tooltip: "#weak $POD_curia_support_decision.tt$#!"
  pod_curia_piety_tooltip: "#weak $POD_curia_support_decision.tt$#!"
  pod_curia_gold_tooltip: "#weak $POD_curia_support_decision.tt$#!"
  pod_curia_crusade_tooltip: "#weak $POD_curia_support_decision.tt$#!"
  PODask_pope.1000.a: "Mi orden necesita reconocimiento"
  PODask_pope.1000.b: "No usaré mi influencia para preocupaciones materiales"
  PODask_pope.1000.c: "Necesito apoyo material"
  PODask_pope.1000.d: "¡Es hora de una Cruzada en las Sombras!"
  PODask_pope.1000.d.tt: "Solicitar una Cruzada en las Sombras te costará 100 de [curia_support|E]. Elegir esta opción si tienes los medios te mostrará varias regiones potenciales. Aún podrás cambiar de opinión y no seleccionar ninguna."
  gregory_intro_jeanne_tt: "Como no estás patrocinada oficialmente por la Iglesia, no recibirás un beneficio de esto. Sin embargo, varios cardenales siguen viendo con buenos ojos tus esfuerzos y, por tanto, la situación podría cambiar con el próximo Papa."
  
  PODask_pope.1001.t: "Una Cruzada en las Sombras: El Centro"
  PODask_pope.1001.desc: "Europa Occidental siempre ha sido el centro del poder católico. Aquí es donde la Iglesia es más fuerte y donde más fácilmente se la podría convencer de gastar sus recursos para hacer frente a la amenaza. Solo cuando esta tierra cristiana central esté asegurada, la Santa Sede considerará otros territorios más periféricos como objetivos válidos.\n #X Solo puedes elegir cada región una vez. Una vez que cada una de esas regiones haya sido el objetivo de una Cruzada en las Sombras, se ofrecerán nuevas opciones.#!" 
  PODask_pope.1001.a: "Italia"
  PODask_pope.1001.b: "Britannia"
  PODask_pope.1001.c: "Germania"
  PODask_pope.1001.d: "Francia"
  curia_sponsored_crusade_tt: "Un nuevo inquisidor usurpará pronto un condado en esta región. Comenzará con un ejército considerable y una personalidad agresiva (más o menos dependiendo de tu elección de regla de juego de la Inquisición)."
  PODask_pope.1001.e: "Iberia"
  PODask_pope.1000.d.tt2: "Ya no hay objetivos válidos para una Cruzada en las Sombras."
  
  PODask_pope.1002.t: "Una Cruzada en las Sombras: Las Fronteras"
  PODask_pope.1002.desc: "El alcance de la Iglesia Católica es largo. Gracias a las cruzadas o a un entendimiento relativamente cordial con los cazadores ortodoxos, la Inquisición en las Sombras puede apuntar a territorios alejados de Roma. Si estos pudieran ser purgados de lo sobrenatural, la cristiandad estaría verdaderamente a salvo.\n #X Solo puedes elegir cada región una vez.#!" 
  PODask_pope.1002.a: "Escandinavia"
  PODask_pope.1002.b: "Tierra Santa"
  PODask_pope.1002.c: "Polonia"
  PODask_pope.1002.d: "Los Balcanes"
  PODask_pope.1002.e: "Bizancio" 
  curiasuppport_needtwenty_tt: "Necesitas 20 de [curia_support|E] o más para usar esta opción."
  curiasuppport_needhundred_tt: "Necesitas 100 de [curia_support|E] o más para usar esta opción."
  POD_landless_inquisitor_war_curia_tt: "Entregarás el territorio conquistado a un personaje de tu elección.\n#P;bold Seguirás sin tierras.#!\nEl Gran Inquisidor te ofrecerá elegir entre varias recompensas."
 
  POD_war.2.t: "Felicitaciones romanas"
  POD_war.2.desc: "El Gran Inquisidor ha oído hablar de vuestra reciente victoria y os envía sus más cordiales saludos. Sin embargo, Su Eminencia sabe que las palabras no ganarán la lucha contra el Enemigo y también se ofrece a apoyar a vuestra orden tanto como pueda para continuar vuestro valiente esfuerzo. Depende de ti elegir qué pedirás a Roma, si es que pides algo." 
  POD_war.2.a: "Necesitamos más reconocimiento de la Santa Sede."
  POD_war.2.b: "El apoyo material siempre es de agradecer."
  POD_war.2.c: "Nada. ¡Gloria a Dios!"
 
  PODask_pope.1003.desc: "Lady Jeanne, a pesar de vuestro evidente celo e impulso por luchar por la Iglesia, Roma ha rechazado vuestra orden sagrada recién creada hasta ahora. Aunque no os han excomulgado, no formaréis parte oficialmente de la Inquisición en las Sombras por el momento.\nSin embargo, hay esperanza: Leopold von Murnau, el coordinador informal de la Inquisición, ha quedado muy impresionado por vuestro impulso. Os ha puesto en contacto con las Caballeras de Santa Elena, una orden de damas caballeras creada durante las Cruzadas y también marginada por la Iglesia.\nTras reuniros con su gran maestra Perinne y convencerla de la importancia de vuestra misión contra el verdadero Enemigo (sobrenatural), ella está dispuesta a unirse a vuestra naciente orden. Tener a estas mujeres dotadas para lo marcial a vuestro lado sería una gran bendición, pero os preocupa que Roma pueda enfadarse aún más al ver a dos órdenes espurias unir sus fuerzas sin una bendición papal."
  PODask_pope.1003.a: "La santa misión es más importante que Roma."
  PODask_pope.1003.b: "...pero seguimos necesitando su apoyo."
