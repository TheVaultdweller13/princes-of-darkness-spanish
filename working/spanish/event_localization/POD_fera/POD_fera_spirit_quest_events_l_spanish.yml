l_spanish:

 POD_fera_spirit_quest.1.t: "Búsqueda espiritual"
 POD_fera_spirit_quest.1.desc: "Has consultado a los espíritus y varios de ellos tienen una búsqueda que ofrecerte. Cumplir una de ellas te permitirá progresar en tu viaje espiritual para aprender más poderes, pero también te debilitará de diversas formas, ya que cada búsqueda tiene sus propios desafíos."
 POD_fera_spirit_quest.1.option.a: "Una búsqueda fácil"
 POD_fera_spirit_quest.1.option.b: "Algo sencillo."
 POD_fera_spirit_quest.1.option.c: "Estoy preparado para cualquier cosa."
 POD_fera_spirit_quest.1.option.d: "Dame un desafío."
 POD_fera_spirit_quest.1.option.e: "No temo a nada."
 POD_fera_spirit_quest.1.option.exit: "No es el momento adecuado para una búsqueda"

 spirit_quest_difficulty_1: "Estas búsquedas son #bold muy fáciles#!, casi sin riesgo ni recompensa."
 spirit_quest_difficulty_2: "Estas búsquedas son #bold sencillas#!, con riesgos menores pero recompensas bajas."
 spirit_quest_difficulty_3: "Estas búsquedas tienen riesgos y recompensas #bold normales#!."
 spirit_quest_difficulty_4: "Estas búsquedas son #bold desafiantes#!, con riesgos variables pero buenas recompensas."
 spirit_quest_difficulty_5: "@warning_icon! Estas búsquedas son #bold mortales#!, con altos riesgos que #warning pueden incluso llevar a la muerte#!, pero sus recompensas son grandes."

 spirit_quest_difficulty_spirit_wilds_unavailable: "No tienes $spirit_wilds_access$"

 spirit_quest_message_title: "Búsqueda espiritual"

 POD_fera_spirit_quest.10.good: "Resolviste un acertijo e impresionaste a un espíritu."
 POD_fera_spirit_quest.10.bad: "No lograste resolver un acertijo y los espíritus se ríen de ti."
 POD_fera_spirit_quest.11.good: "Un espíritu jugó al escondite contigo. Luego se volvió invisible, pero aun así lograste encontrarlo."
 POD_fera_spirit_quest.11.bad: "Un espíritu jugó al escondite contigo. Luego se volvió invisible y no pudiste encontrarlo."
 POD_fera_spirit_quest.12.good: "Conociste a un espíritu amistoso que hablaba una lengua antigua. Afortunadamente, pudiste entenderlo."
 POD_fera_spirit_quest.12.bad: "Conociste a un espíritu amistoso que hablaba una lengua antigua. Desafortunadamente, no tenías ni idea de lo que decía."
 POD_fera_spirit_quest.13.good: "Un espíritu te cuenta una historia extremadamente larga y pudiste aprender algo de ella."
 POD_fera_spirit_quest.13.bad: "Un espíritu te cuenta una historia extremadamente larga, pero no aprendes nada."
 POD_fera_spirit_quest.14.good: "Un espíritu te ha desafiado a un concurso de bebida y has ganado."
 POD_fera_spirit_quest.14.bad: "Un espíritu te ha desafiado a un concurso de bebida y has perdido."
 POD_fera_spirit_quest.15.good: "Un espíritu elogió tu buen aspecto."
 POD_fera_spirit_quest.15.bad: "Un espíritu te llamó feo."
 POD_fera_spirit_quest.16.good: "Fuiste emboscado por cazadores, pero no fueron rival para ti."
 POD_fera_spirit_quest.16.bad: "Fuiste emboscado por cazadores."
 POD_fera_spirit_quest.17.good: "Bailaste con algunos espíritus."
 POD_fera_spirit_quest.17.bad: "Intentaste bailar con algunos espíritus. Fue un intento muy malo."
 POD_fera_spirit_quest.18.good: "Un espíritu te pidió consejo sobre relaciones, lograste ayudarlo."
 POD_fera_spirit_quest.18.bad: "Un espíritu te pidió consejo sobre relaciones, de alguna manera hiciste que las cosas empeoraran aún más."
 POD_fera_spirit_quest.19.good: "Te perdiste en el camino pero lograste encontrar el rumbo de nuevo."
 POD_fera_spirit_quest.19.bad: "Te perdiste en el camino."
 POD_fera_spirit_quest.20.good: "Tropezaste con una batalla entre mortales pero lograste salir luchando."
 POD_fera_spirit_quest.20.bad: "Tropezaste con una batalla entre mortales y quedaste atrapado entre ellos."
 POD_fera_spirit_quest.21.good: "Navegaste con éxito por las [UmbraGlossary('spirit_wilds')]."
 POD_fera_spirit_quest.21.bad: "Te perdiste en las [UmbraGlossary('spirit_wilds')]."
 POD_fera_spirit_quest.22.good: "Has sido atacado por otro $glossary_fera$ pero lograste rechazarlo."
 POD_fera_spirit_quest.22.bad: "Un $glossary_fera$ renegado te atacó."
 POD_fera_spirit_quest.23.good: "Un espíritu te preguntó por el sentido de la vida. De alguna manera lograste darle una respuesta satisfactoria."
 POD_fera_spirit_quest.23.bad: "Un espíritu te preguntó por el sentido de la vida. Encontró tu respuesta ridícula, así que decidió robarte."
 POD_fera_spirit_quest.24.good: "Un espíritu logró seducirte y luego se marchó abruptamente. Enterraste tus sentimientos y seguiste adelante."
 POD_fera_spirit_quest.24.bad: "Un espíritu logró seducirte y luego se marchó abruptamente. Esto te ha puesto muy triste."
 POD_fera_spirit_quest.25.good: "Un espíritu ha intentado tratarte como a una pequeña mascota, lo asustaste."
 POD_fera_spirit_quest.25.bad: "Un espíritu te está tratando como a su pequeña mascota y no puedes hacer que se detenga."
 POD_fera_spirit_quest.26.good: "Apostaste en una posada y ganaste."
 POD_fera_spirit_quest.26.bad: "Apostaste en una posada y perdiste estrepitosamente."
 POD_fera_spirit_quest.27.good: "Algunos espíritus te exigieron que les prepararas un banquete, resultó genial."
 POD_fera_spirit_quest.27.bad: "Algunos espíritus te exigieron que les prepararas un banquete, fracasaste miserablemente."
 POD_fera_spirit_quest.28.t: "Ataque de vampiro"
 POD_fera_spirit_quest.28.desc: "Durante tu búsqueda espiritual, un vampiro solitario te ha atacado. Tendrás que rechazarlo antes de poder continuar."
 POD_fera_spirit_quest.28.a: "¡A la batalla!"
 POD_fera_spirit_quest.29.good: "Con el vampiro derrotado, continúas."
 POD_fera_spirit_quest.29.bad: "El vampiro te derrotó, retrasando tu progreso."
 POD_fera_spirit_quest.30.good: "Cantaste un relato de tu pueblo a los espíritus."
 POD_fera_spirit_quest.30.bad: "Te equivocaste al contar un relato de tu pueblo."
 
 
 
 
 
 
 
 
 
 
  POD_fera_spirit_quest.1000.t: "Búsqueda exitosa"
  POD_fera_spirit_quest.1000.desc: "Los espíritus poseen un amplio conocimiento del paisaje espiritual. Ya sea que negocies, te comuniques o les mandes, son aliados poderosos. Sin embargo, todo lo efímero necesita algo a cambio de su ayuda; los $glossary_fera$ usan la palabra chiminage para describir los regalos y favores que pueden motivar a los espíritus.\n\nLas búsquedas pueden tomar muchas formas, desde acertijos hasta aventuras heroicas y cualquier cosa intermedia. Sea cual sea el caso, son una parte integral de la sociedad $glossary_fera$ desde el amanecer de los tiempos y, al cumplir con tu deber hoy, has honrado esta larga tradición de alianza con el mundo espiritual."
  POD_fera_spirit_quest.1000.option.a: "Enséñame los secretos de mi raza."
  POD_fera_spirit_quest.1000.option.b: "Fortalece tus poderes innatos."
  POD_fera_spirit_quest.1000.option.c: "Extraigo poder de mi [GetPlayer.Custom('PODFeraAuspiceType')]."
  POD_fera_spirit_quest.1000.option.d: "Los Dones de mi pueblo."
  POD_fera_spirit_quest.1000.option.e: "Muéstrame los entresijos de las Cortes de las Bestias."
  POD_fera_spirit_quest.1000.option.f: "Concédeme un fetiche."
  POD_fera_spirit_quest.common_artifact: "Ganarás un [fetish|E] #V común#!"
  POD_fera_spirit_quest.masterwork_artifact: "Ganarás un [fetish|E] de #color_dark_green maestría#!"
  POD_fera_spirit_quest.famed_artifact: "Ganarás un [fetish|E] #FAMEDBLUE famoso#!"
  POD_fera_spirit_quest.illustrious_artifact: "Ganarás un [fetish|E] #ILLUSTRIOUSPURPLE ilustre#!"
  POD_fera_spirit_quest.1000.option.g: "Mis experiencias me han cambiado."
  POD_fera_spirit_quest.1000.option.h: "Ayúdame en mis empeños."
