l_spanish:

 POD_perfect_world.001.t: "Un mundo perfecto"
 POD_perfect_world.001.desc: "Eres un ser de un poder considerable y tu maestría en Presencia es monumental. Miras tu dominio y ves a todo ese ganado viviendo sus vidas, sin preocuparse por el panorama general. Pero tienes el poder de cambiar eso, de hacer que vivan de la manera que consideres adecuada, un poder para hacer de tu dominio un mundo perfecto... para ti.\nPero, ¿cuál es tu mundo perfecto?"
 POD_perfect_world.001.a: "Les inspiraré para que lleguen a ser grandes; gobernar sobre élites es mejor."
 POD_perfect_world.001.a.tt.beast: "#beast Ah, ¿por qué querríamos gobernar a campesinos?#!"
 POD_perfect_world.001.b: "Este mundo es cruel, deberían reunir sus fuerzas para ayudar a mis planes."
 POD_perfect_world.001.b.tt.beast: "#beast La guerra se acerca.#!"
 POD_perfect_world.001.c: "Ahora no es el momento."
 POD_perfect_world.001.c.tt: "Abandonarás tus intentos de hacer que los mortales actúen como deseas"
 POD_perfect_world.001.c.tt.beast: "#beast ¡No! ¡Debemos controlarlos!#!"

 POD_perfect_world.002.t: "Un mundo perfecto"
 POD_perfect_world.002.desc: "Tuviste que gastar mucho poder y algunos mortales notaron que algo raro estaba pasando, ¡pero el resultado fue fenomenal! Ya ves cómo actúan los mortales según tu visión, y estás listo para cosechar los beneficios."
 POD_perfect_world.002.option.a: "Ah, qué perfección."
 POD_perfect_world.002.option.a.tt: "Has logrado influir en los mortales de la ciudad"

 POD_mask_of_empathy.001.t: "Máscara de empatía"
 POD_mask_of_empathy.001.desc: "Todo está en marcha; usando tus inmensos poderes de Presencia, ahora puedes hacer un movimiento. Expandas tu voluntad y tu encanto antinatural y ya puedes sentir que tu objetivo está cerca, muy cerca. ¿Procederás?"
 POD_mask_of_empathy.001.option.a: "Es hora de romper sus lazos."
 POD_mask_of_empathy.001.option.a.tt: "Intentarás usar el poder Máscara de empatía"
 POD_mask_of_empathy.001.option.a.desc: "Batalla de voluntades"
 POD_mask_of_empathy.001.option.a.tt.attacker_wins: "[target.GetFirstName] y [target_relation.GetFirstName] ya no están conectados"
 POD_mask_of_empathy.001.option.a.tt.defender_wins: "Has fallado y tu voluntad flaquea"
 POD_mask_of_empathy.001.option.b: "No es el momento."
 POD_mask_of_empathy.001.option.b.tt: "Abandonarás tus intentos de evitar que [target.GetFirstName] y [target_relation.GetFirstName] estén conectados"

 POD_mask_of_empathy.002.t: "Máscara de empatía"
 POD_mask_of_empathy.002.desc: "Has tenido éxito, ya puedes sentir que [target.GetFirstName] y [target_relation.GetFirstName] no sienten lo mismo el uno por el otro"
 POD_mask_of_empathy.002.option.a: "Ah, por supuesto que no pudieron resistirse a mis encantos."
 POD_mask_of_empathy.002.option.a.tt: "Has tenido éxito"
 POD_mask_of_empathy.002.option.a.tt.beast: "#beast ¡Los controlamos!#!"

 POD_mask_of_empathy.003.t: "Máscara de empatía"
 POD_mask_of_empathy.003.desc: "Has fallado, [target.GetFirstName] y [target_relation.GetFirstName] siguen conectados entre sí. Apenas lograste que no te atraparan, eso es un punto a favor"
 POD_mask_of_empathy.003.option.a: "Qué lástima."
 POD_mask_of_empathy.003.option.a.tt: "Has fallado"
 POD_mask_of_empathy.003.option.a.tt.beast: "#beast ¡Qué decepción!#!"
