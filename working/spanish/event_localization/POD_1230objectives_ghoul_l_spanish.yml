l_spanish:
 ultimate_submission_objective_decision: "Sumisión definitiva"
 ultimate_submission_objective_decision_desc: "El objetivo de mi vida es ser útil a mi maestro, mi amante, mi luz en la oscuridad. Esa es la razón por la que nací, por la que los conocí y por la que los amo.\n\nSolo puedo soñar con servirles por toda la eternidad, volviéndome verdaderamente inmortal a su lado, alcanzando el estado exaltado de un $POD_splat_vampire$ bajo su diligente tutela."
 ultimate_submission_objective_decision_tooltip: "Una eternidad de servicio"
 ultimate_submission_objective_decision_confirm: "Hasta el fin de los tiempos"
 ultimate_submission_objective_decision_custom1: "Debes completar al menos #V 10#! [bound_ghoul_missions_with_icon|E] para tu [Glossary('Domitor','game_concept_domitor_desc')] actual #weak ([GetPlayer.MakeScope.ScriptValue('POD_number_of_completed_ghoul_missions')])#!"
 ultimate_submission_objective_decision_custom2: "Tu [Glossary('Domitor','game_concept_domitor_desc')] actual debe tener #V 100#! de [opinion|E] sobre ti"
 ultimate_submission_objective_decision_effect1: "Recibirás el $pod_Embrace$ de [vampiresire.GetShortUIName]"

 pod1230objectives_ghoul.1.t: "Sumisión definitiva"
 pod1230objectives_ghoul.1.desc: "Algunos dicen que ser un ghoul es una adicción fatal, un pacto fáustico para vender tu alma a cambio de una eternidad como esclavo. Quizás tengan razón.\nPara ti, sin embargo, el concepto de libertad parece sobrevalorado. Te sientes protegido y amado sin importar lo que tu maestro crea realmente y sin importar sus acciones. Volver a la incertidumbre y al caos de los días antes de conocerlos sería una agonía.\n\nMientras tu estrella guía drena todo lo que eras, te llena el consuelo de encontrar finalmente una claridad de propósito. Pronto serás como ellos, y eres feliz por ello.\n\nEl tiempo dirá si esto sigue siendo así."
 pod1230objectives_ghoul.1.a: "Después de todo este tiempo"
 POD_fulfilled_lifes_goal_modifier: "Objetivo de vida cumplido"
 POD_fulfilled_lifes_goal_modifier_desc: "Este personaje cumplió su objetivo de vida."

 POD_ghoul_objective_mechanic_rebellion_strength: "#underline;TOOLTIP:POD_ghoul_objective_mechanic_rebellion_strength_desc Fuerza de la rebelión#!"
 POD_ghoul_objective_mechanic_rebellion_strength_desc: "Todos los [Concept('decision', 'Objectives')|E] para [masterless_ghouls|E] después de #V $ambitions_of_blood_objective_decision$#! requieren #bold Fuerza de la rebelión#! para completarse.\n\nLa Fuerza de la rebelión es la suma de la [prowess|E] total de los [masterless_ghouls|E] bajo tu mando, lo que incluye a cada [knight|E], [vassal|E] y sus [knights|E].\n\nAdemás, la Fuerza de la rebelión puede aumentarse completando ciertos [Concept('decision', 'Objectives')]\n\nTu Fuerza de la rebelión actual es [GetPlayer.MakeScope.ScriptValue('POD_ghoul_objective_rebellion_strength')|0V]"

 POD_has_ghoul_rebellion_strength_trigger: "La $POD_ghoul_objective_mechanic_rebellion_strength$ debe exceder [SCOPE.GetValue('required_rebellion_strength')|0V] #weak ([GetPlayer.MakeScope.ScriptValue('POD_ghoul_objective_rebellion_strength')|0])#!"
 POD_ghoul_increase_rebellion_strength: "La $POD_ghoul_objective_mechanic_rebellion_strength$ aumentará en [SCOPE.GetValue('increase_value')|0V] "

 ambitions_of_blood_objective_decision: "Ambiciones de sangre"
 ambitions_of_blood_objective_decision_desc: "Somos esclavos de la sangre, de los $POD_splat_vampire_plural$. Esta siempre fue la verdad, y no hay forma de escapar de ella. Pero los ghouls siempre pueden soñar, y muchos ghouls que comparten el mismo sueño pueden lograr lo imposible."
 ambitions_of_blood_objective_decision_tooltip: "Porque sueño con sangre"
 ambitions_of_blood_objective_decision_confirm: "¿Un sueño? ¿O una profecía?"
 ambitions_of_blood_objective_decision_custom1: "Tienes al menos #V 10#! [courtiers|E] o [vassals|E] que son [masterless_ghouls|E] #weak ([SCOPE.GetValue('num_of_ghouls_under')])#!"
 ambitions_of_blood_objective_decision_custom2: "Tienes al menos un rasgo de [Glossary('Discipline','game_concept_discipline_desc')] avanzada"
 ambitions_of_blood_objective_decision_effect1: "Al convertirte en un [bound_ghoul|E], morirás instantáneamente. Esto se aplica a toda tu [dynasty|E]"
 ambitions_of_blood_objective_decision_effect2: "Los [Concept('ghoul', 'Ghouls')|E] aceptarán más fácilmente tu invitación a la [court|E] y para convertirse en agentes de [scheme|E]"
 ambitions_of_blood_objective_decision_effect3: "Desbloquea una nueva mecánica: #V $POD_ghoul_objective_mechanic_rebellion_strength$#!"
 FRIENDLY_GHOUL: "Eres el líder de una rebelión de ghouls: $VALUE|+=0$"

 pod1230objectives_ghoul.2.t: "Ambiciones de sangre"
 pod1230objectives_ghoul.2.desc: "Has reunido a un pequeño grupo de [masterless_ghouls|E] como tú. Y todos compartís el mismo sueño.\nLas noticias sobre tu pequeño séquito ya han llegado a algunos oídos amenazantes, pero la mayoría lo considera una broma no muy graciosa.\n\nEsta complacencia es tu mayor fuerza. Lamentablemente, sabes que no durará para siempre. Los vampiros temen el cambio, y más aún los cambios que podrían llevarlos a ser derribados de sus tronos. Tienes que usar los tiempos venideros con sabiduría."
 pod1230objectives_ghoul.2.a: "¿Cobrará vida nuestro sueño?"

 the_vitae_rebellion_objective_decision: "La rebelión de la vitae"
 the_vitae_rebellion_objective_decision_desc: "En estos últimos años has reclutado a más y más de los tuyos, ya sea fusionándote con otros grupos de [ghouls|E] con ideas similares, o creando otros nuevos.\n\nPero cómo has llegado hasta aquí no es importante, lo importante es que tienes la fuerza suficiente para que tu plan tenga éxito. Forjarás un pedazo de tierra para tu pueblo, libre de la opresión de los $POD_splat_vampire$."
 the_vitae_rebellion_objective_decision_tooltip: "Después de todo, era una profecía"
 the_vitae_rebellion_objective_decision_confirm: "¡Seremos libres!"
 the_vitae_rebellion_objective_decision_custom1: "Tienes al menos #V 2#! rasgos de [Glossary('Discipline','game_concept_discipline_desc')] avanzada"
 the_vitae_rebellion_objective_decision_effect1: "Cada [masterless_ghoul|E] en tu [domain|E] se convertirá a la fe [GetFaithByKey('unmastered').GetName]."
 the_vitae_rebellion_objective_decision_effect2: "Los $POD_splat_vampire_plural$ [imprisoned|E] por [masterless_ghouls|E] de la fe [GetFaithByKey('unmastered').GetName] tendrán mucho más difícil escapar de [prison|E]."
 the_vitae_rebellion_objective_decision_effect3: "Probabilidad de que los $POD_splat_vampire_plural$ [imprisoned|E] usen [Glossary('Disciplines','game_concept_discipline_desc')] durante la alimentación: #P -75%#!"
 the_vitae_rebellion_objective_decision_effect4: "Elimina el enfriamiento para las [holy_wars|E] de nivel de reino"
 the_vitae_rebellion_objective_decision_effect5: "Desbloquea una [character_interaction|E] para intentar liberar a un [bound_ghoul|E] de su [Glossary('Domitor','game_concept_domitor_desc')]."

 pod1230objectives_ghoul.3.t: "La rebelión de la vitae"
 pod1230objectives_ghoul.3.desc: "Un ghoul nunca envejece, puede curar casi cualquier herida, tiene el doble de la fuerza que antes tenía. Eso suena genial.\n\nNo lo es.\n\nPuede que los ghouls no estén condenados, pero en muchos sentidos su suerte es peor. La $pod_vitae$ cambia muchas cosas cuando entra en un ser. La maldición vampírica del frenesí los persigue, llevándolos a extremos de ira y deseo. Otras máculas se apoderan de ellos, a veces incluso la locura. Quizás peor aún, la mayoría de los ghouls quedan encadenados por el Vínculo de Sangre. Estos adictos indefensos se obsesionan con sus maestros. Son esclavos, quizás primero por elección, pero ya no. Una vez que has probado la sangre, no tienes ninguna elección en absoluto.\n\nY así, si la $pod_vitae$ ha de ser nuestra cadena, también tiene que ser nuestra salvadora. La rebelión no nos salvará de la adicción, pero podría llevarnos un paso más cerca de encontrarnos a nosotros mismos todavía."
 pod1230objectives_ghoul.3.a: "En la vitae, renacemos."

 contact_the_dispossessed_objective_decision: "Contactar con los Desposeídos"
 contact_the_dispossessed_objective_decision_desc: "Muchos $POD_splat_vampire_plural$ viajan a la Ciudad Santa de Jerusalén. Pero algunos no reconocen las dificultades que encontrarán allí, y se ven obligados a huir. A menudo, en tales situaciones, sus [ghouls|E] son abandonados a su suerte. La mayoría muere, pero algunos sobreviven uniéndose a grupos de orígenes similares. Colectivamente se les llama los Desposeídos.\n\nAl amasar suficientes recursos y demostrar que podemos proteger a todos los [ghouls|E], podríamos convencerlos de unirse a nuestra rebelión."
 contact_the_dispossessed_objective_decision_tooltip: "Ya no están desposeídos"
 contact_the_dispossessed_objective_decision_confirm: "Más fuertes unidos"
 contact_the_dispossessed_objective_decision_custom1: "Tienes al menos #V 400#! [men_at_arms|E] #TOOLTIP:MEN_AT_ARMS_TYPE,dispossessed_maa #L Desposeídos#!#! #weak ([SCOPE.GetValue('number_of_the_dispossessed')])#!"
 contact_the_dispossessed_objective_decision_effect1: "Podrás convocar [ghouls|E] hábiles en [diplomacy|E] mediante una [decision|E]"
 contact_the_dispossessed_objective_decision_effect2: "Si completaste el [Concept('decision', 'Objective')|E] #V $the_vitae_rebellion_objective_decision$#!, la [faith|E] que se creará ganará la doctrina [GetFaithDoctrine('special_masterless_ghoul_dispossessed_doctrine').GetBaseName]. Si no completaste el [Concept('decision', 'Objective')|E], se pospondrá para después de que lo completes."
 THE_DISPOSSESSED_CONNECTIONS: "Tienes [GetFaithDoctrine('special_masterless_ghoul_dispossessed_doctrine').GetBaseName]: $VALUE|+=0$"

 pod1230objectives_ghoul.4.t: "Uno con los Desposeídos"
 pod1230objectives_ghoul.4.desc: "Tras varias rondas de negociaciones, los [ghouls|E] que una vez fueron los Desposeídos se han unido oficialmente a nosotros. Hemos ganado otra ventaja contra la tiranía de nuestros \"maestros\".\n\n¿Pero será eso suficiente para que nuestro sueño se haga realidad? En cualquier caso, sus habilidades para dar cobijo y proteger a los ghouls olvidados resultarán ciertamente muy útiles en el futuro."
 pod1230objectives_ghoul.4.a: "Estamos creciendo"

 contact_the_folch_cutthroats_objective_decision: "Contactar con los Degolladores de Folch"
 contact_the_folch_cutthroats_objective_decision_desc: "En Francia existe un grupo mercenario formado por los nuestros. Unidos por su odio hacia los $POD_splat_vampire_plural$, estos bandidos serían otro aliado en nuestra guerra contra nuestros \"maestros\".\n\nSi demostramos que somos más fuertes que ellos, al tiempo que mostramos que odiamos a los vampiros tanto como ellos, convencerlos de unirse será solo un trámite."
 contact_the_folch_cutthroats_objective_decision_tooltip: "Unidos en el odio"
 contact_the_folch_cutthroats_objective_decision_confirm: "Más fuertes unidos"
 contact_the_folch_cutthroats_objective_decision_custom1: "Tienes al menos un [county|E] en la [region|E] de [GetGeographicalRegion('ghw_region_southern_france').GetName]"
 contact_the_folch_cutthroats_objective_decision_custom2: "Has matado al menos a #V 50#! $POD_splat_vampire_plural$ #weak ([SCOPE.GetValue('killed_vampires')])#!"
 contact_the_folch_cutthroats_objective_decision_custom3: "Has matado al menos a un $POD_splat_vampire$ de [GetTrait('vampgeneration4').GetName(GetNullCharacter)] o [GetTrait('vampgeneration5').GetName(GetNullCharacter)]"
 ghw_region_southern_france: "Sur de Francia"
 contact_the_folch_cutthroats_objective_decision_effect1: "Podrás convocar [ghouls|E] hábiles en [martial|E] o [prowess|E] mediante una [decision|E]"
 contact_the_folch_cutthroats_objective_decision_effect2: "Si completaste el [Concept('decision', 'Objective')|E] #V $the_vitae_rebellion_objective_decision$#!, la [faith|E] que se creará ganará la doctrina [GetFaithDoctrine('special_masterless_ghoul_folch_cutthroats_doctrine').GetBaseName]. Si no completaste el [Concept('decision', 'Objective')|E], se pospondrá para después de que lo completes."
 FOLCH_CUTTHROATS_TACTICS: "Tácticas de los Degolladores de Folch"

 pod1230objectives_ghoul.5.t: "Odio común"
 pod1230objectives_ghoul.5.desc: "Folch fue una vez como muchos de nosotros, un esclavo de un maestro indiferente. Al contrario que muchos de nosotros, sin embargo, la muerte de su domitor no lo dejó sin un sentido en la vida, sino que lo llenó de odio.\nSiendo ya un mercenario competente que sabía mucho sobre los vampiros de Francia, pronto se labró una reputación y demostró ser demasiado útil para ser simplemente aniquilado.\n\nLa ira solo te llevará hasta cierto punto, sin embargo, y nuestra ayuda para canalizarla hacia esfuerzos productivos podría resultar crítica para el futuro de nuestra rebelión."
 pod1230objectives_ghoul.5.a: "Odiar con un propósito"

 contact_the_order_of_st_panteleimon_objective_decision: "Contactar con la Orden de San Pantaleón"
 contact_the_order_of_st_panteleimon_objective_decision_desc: "Existe una cierta Orden de herejes en Venecia, formada por [masterless_ghouls|E]. Aunque no comparten nuestro odio por los vampiros, podrían ser excelentes camaradas. Después de todo, no todos deberían estar cegados por la rabia; algunos de nosotros deberíamos aprender en lugar de luchar.\n\nPero convencerlos será problemático; no comparten nuestra ira, pero podrían estar necesitados de aliados con el colapso en curso de la Iglesia de Caín."
 contact_the_order_of_st_panteleimon_objective_decision_tooltip: "Trato herético"
 contact_the_order_of_st_panteleimon_objective_decision_confirm: "Más fuertes unidos"
 contact_the_order_of_st_panteleimon_objective_decision_custom1: "Tienes equipado un diario de categoría #FAMEDBLUE Famoso#!"
 contact_the_order_of_st_panteleimon_objective_decision_custom2: "Tienes equipado un diario de categoría #ILLUSTRIOUSPURPLE Ilustre#!"
 contact_the_order_of_st_panteleimon_objective_decision_effect1: "Podrás convocar [ghouls|E] hábiles en [learning|E] mediante una [decision|E]"
 contact_the_order_of_st_panteleimon_objective_decision_effect2: "Si completaste el [Concept('decision', 'Objective')|E] #V $the_vitae_rebellion_objective_decision$#!, la [faith|E] que se creará ganará la doctrina [GetFaithDoctrine('special_masterless_ghoul_order_of_st_panteleimon_doctrine').GetBaseName]. Si no completaste el [Concept('decision', 'Objective')|E], se pospondrá para después de que lo completes."

 pod1230objectives_ghoul.6.t: "Conocimiento de la rebelión"
 pod1230objectives_ghoul.6.desc: "La Orden de San Pantaleón fue una vez principalmente el brazo de escribas y burócratas de la Iglesia de Caín. Compuesta casi en su totalidad por ghouls, vivían una vida sin incidentes bajo la protección del Arzobispo de Caín, Narsés de Venecia. Su muerte y el lento colapso de la Iglesia trastocaron este estado de cosas.\n\nEl director de la Orden estaba vinculado al propio Narsés y él, junto con muchos otros miembros, se encontró de repente sin un suministro fiable de sangre. Tiempos desesperados requerían medidas desesperadas y algunos miembros pidieron tu ayuda para destituir al director, que seguía siendo leal a la Iglesia. Lo cual hiciste sin muchos problemas.\n\nLa Orden de San Pantaleón todavía está lejos de ser un activo militar, pero su conocimiento de la historia y la religión cainita resultará ciertamente útil para tu rebelión."
 pod1230objectives_ghoul.6.a: "Conocer a nuestro enemigo"

 contact_the_haqims_assassins_objective_decision: "Contactar con los Asesinos del Falso Haqim"
 contact_the_haqims_assassins_objective_decision_desc: "El grupo más antiguo de [masterless_ghouls|E] que conocemos se encuentra en Aluh Amut. 'Fundados' por el #weak Falso#! Haqim, comparten nuestro odio por los vampiros y los cazan dondequiera que vayan. Eso los convierte en socios ideales, tanto en fuerza como en estrategia.\n\nSi presentáramos un regalo de algunas cabezas de Assamitas, ¿quizás podríamos consolidar nuestros lazos con ellos?"
 contact_the_haqims_assassins_objective_decision_tooltip: "Asesinos de Aluh Amut"
 contact_the_haqims_assassins_objective_decision_confirm: "Un extraño compañero de cama."
 contact_the_haqims_assassins_objective_decision_custom1: "Tienes al menos un [county|E] en la [region|E] de [GetGeographicalRegion('world_middle_east_persia').GetName]"
 contact_the_haqims_assassins_objective_decision_custom2: "Has matado al menos a #V 25#! [GetTrait('assamite').GetName( GetPlayer )] #weak ([SCOPE.GetValue('killed_banuhaqim')])#!"
 contact_the_haqims_assassins_objective_decision_effect1: "Podrás convocar [ghouls|E] hábiles en [intrigue|E] mediante una [decision|E]"
 contact_the_haqims_assassins_objective_decision_effect2: "Si completaste el [Concept('decision', 'Objective')|E] #V $the_vitae_rebellion_objective_decision$#!, la [faith|E] que se creará ganará la doctrina [GetFaithDoctrine('special_masterless_ghoul_haqims_assassins_doctrine').GetBaseName]. Si no completaste el [Concept('decision', 'Objective')|E], se pospondrá para después de que lo completes."

 pod1230objectives_ghoul.7.t: "Asesinos de sangre"
 pod1230objectives_ghoul.7.desc: "La historia del \"Falso\" Haqim es desconcertante. Un hábil ghoul de un asesino Assamita que murió durante las Guerras Baali, \"Haqim\" tiene claramente una psique fracturada, pensando a veces que es el maestro de todo el clan vampírico que lleva \"su\" nombre.\nAunque su cordura está en duda, sus habilidades no lo están. Infiltrándose magistralmente en los Hashshāshīn, ha logrado ser una espina clavada en el costado de los Assamitas durante siglos, ganándose incluso una gran cantidad de respeto por parte de sus guerreros, que ahora a veces imitan sus tácticas.\n\nAunque el hombre fue difícil de encontrar y aún más difícil de convencer, ha aceptado ofrecer los servicios de su \"clan\" para tu rebelión. No tienes dudas de que, bajo un liderazgo más estable, se convertirán en un activo crítico para tu causa."
 pod1230objectives_ghoul.7.a: "Nuestros propios asesinos"
