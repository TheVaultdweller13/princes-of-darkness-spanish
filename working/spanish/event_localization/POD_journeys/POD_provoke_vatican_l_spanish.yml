 POD_verses_notranslation: "[GetPlayer.GetFirstNameNoTooltip] #bold no#! habla latín"

 POD_psalm23_latin: "\"Nam et si ambulavero in medio umbrae mortis, non timebo mala, quoniam tu mecum es. Virga tua, et baculus tuus, ipsa me consolata sunt.\""
 # Salmo 23: RV1960
 POD_psalm23_translation: "#italic Aunque ande en valle de sombra de muerte, no temeré mal alguno, porque tú estarás conmigo; tu vara y tu cayado me infundirán aliento.#!"

 POD_psalm94_latin: "\"Et factus est mihi Dominus in refugium, et Deus meus in adjutorium spei meae. Et reddet illis iniquitatem ipsorum, et in malitia eorum disperdet eos: disperdet illos Dominus Deus noster.\""
 # Salmo 94:2-23 RV1960
 POD_psalm94_translation: "#italic Pero el SEÑOR ha sido mi baluarte, y mi Dios la roca de mi refugio. Y él hará volver sobre ellos su iniquidad, y los destruirá en su propia maldad; los destruirá el SEÑOR nuestro Dios.#!"

 POD_lordsprayer_latin: "\"Pater noster, qui es in caelis, sanctificetur nomen tuum. Adveniat regnum tuum. Fiat voluntas tua, sicut in caelo et in terra.\""
 # Mateo 6:9-13 RV1960
 POD_lordsprayer_translation: "#italic Padre nuestro que estás en los cielos, santificado sea tu nombre. Venga tu reino. Hágase tu voluntad, en la tierra como en el cielo.#!"


 POD_faith_vulnerability_demon_tt: "Aquellos que tratan con demonios son especialmente vulnerables a la [Glossary('Fe Verdadera','game_concept_true_faith_desc')]..."
 POD_faith_vulnerability_wraith_tt: "Los Espectros son especialmente vulnerables a la [Glossary('Fe Verdadera','game_concept_true_faith_desc')]..."

 POD_provoke_vatican_escape_tt: "Continúas tu huida de la ciudad..."
 POD_provoke_vatican_escape_complete_tt: "Finalmente lograste escapar de los Inquisidores que te perseguían."


 POD_progenitor_caine: "[GetScriptedCharacterByHistoryID('505001').GetFirstNameNicknamed]"
 POD_progenitor_lilith: "[GetScriptedCharacterByHistoryID('505002').GetFirstNameNicknamed]"
 POD_progenitor_set: "[GetScriptedCharacterByHistoryID('505012').GetFirstName]"
 POD_progenitor_odin: "[GetScriptedCharacterByHistoryID('505055').GetFirstName]"
 POD_progenitor_zapathasura: "[GetScriptedCharacterByHistoryID('505020').GetFirstNameNicknamed]"


 POD_provoke_vatican.1.t: "Una Gran Entrada"
 POD_provoke_vatican.1.desc: "Ahora me encuentro en el umbral de la Ciudad Eterna.\n\nEl escenario está preparado. Los actores se han reunido. Las cortinas están descorridas, y la gran obra está a punto de comenzar. ¿Qué queda? Ah, sí. El público cautivo.\n\nNo hay nadie alrededor para recibirme. Lo cual es extraño, ya que los rumores sobre mi empresa ya se han extendido entre los de mi especie. No aprecian lo que estoy a punto de hacer.\n\nUn público difícil, ciertamente. ¿De verdad estoy tan desconectado de la realidad?"
 POD_provoke_vatican.1.option.a: "No, son todos los demás los que están equivocados."
 POD_provoke_vatican.1.option.a.tt: "Continuarás adentrándote en la ciudad..."

 POD_provoke_vatican.2.t: "Una Entrada Denegada"
 POD_provoke_vatican.2.desc: "Al intentar entrar en la ciudad propiamente dicha, [adversary.GetFirstName] me cierra el paso.\n\n"
 POD_provoke_vatican.2.desc.vampire: "\"Abandonarás esta insensata empresa de inmediato, [ROOT.Char.GetFirstNameNoTooltip]. ¿No comprendes las ramificaciones de lo que estás a punto de hacer? El bienestar de todos los chiquillos de Caín exige que seas detenido.\""
 POD_provoke_vatican.2.desc.nonvampire: "\"Abandonarás esta insensata empresa de inmediato, [ROOT.Char.GetFirstNameNoTooltip]. ¿No comprendes las ramificaciones de lo que estás a punto de hacer? Si los mortales conocen tu existencia, no se detendrán ante nada para verte destruido.\""
 POD_provoke_vatican.2.desc.ruler: "\n\nEl gobernante de [GetTitleByKey('c_roma').GetNameNoTier] me observa con frialdad. Parece que no hay forma de convencer a [adversary.GetHerHim] de la rectitud de mi causa."
 POD_provoke_vatican.2.desc.neighbor: "\n\nSi [adversary.GetSheHe] viajó hasta [GetTitleByKey('c_roma').GetNameNoTier] solo para impedirme la entrada, [adversary.GetSheHe] debe tomárselo muy en serio. Parece que no hay forma de convencer a [adversary.GetHerHim] de la rectitud de mi causa."
 POD_provoke_vatican.2.desc.repeat: "[coterie_loser.GetFirstNameNicknamed] se precipita hacia delante, y de inmediato queda claro que está irremediablemente superado. [adversary.GetFirstName] se hace a un lado, amaga abajo, taja arriba, y antes de que nadie pueda reaccionar, la cabeza cercenada de [coterie_loser.GetFirstNamePossessiveNoTooltip] vuela por los aires.\n\nEstamos justo donde empezamos, con un miembro menos en nuestra [GetPlayer.Custom('PODCoterie')].\n\n[adversary.GetFirstNameNoTooltip] sigue sin mostrar emoción alguna mientras se gira para dirigirse a mí: \"Tengo toda la noche, [ROOT.Char.GetFirstNameNoTooltip].\""
 POD_provoke_vatican.2.option.a: "Apártate, o te obligaré a hacerlo."
 POD_provoke_vatican.2.option.a.2: "Muy bien, ahora es mi turno."
 POD_provoke_vatican.2.option.a.tt: "Parece que [adversary.GetSheHe] no está interesado en negociar... tendrás que luchar contra [adversary.GetHerHim]."
 POD_provoke_vatican.2.option.b: "[prowess_duelist.GetFirstName], dale una lección a este [adversary.Custom('WomanManGirlBoy')]."
 POD_provoke_vatican.2.option.c: "Tienes razón. Debería retirarme antes de que sea demasiado tarde."
 POD_provoke_vatican.2.option.c.2: "Has dejado claro tu punto. Abandonaré esta búsqueda."
 POD_provoke_vatican.2.option.c.tt: "Abandonarás tu [journey|E]. Pero el daño a tu reputación jamás se recuperará..."

 POD_provoke_vatican.3.t: "Eliminando el Primer Obstáculo"
 POD_provoke_vatican.3.desc: "[adversary.GetFirstName] yace a mis pies, magullado y derrotado. ¿Dónde está ahora su confianza en sí mismo? "
 POD_provoke_vatican.3.desc.root: "Debe haberse esfumado en el aire cuando le hice papilla."
 POD_provoke_vatican.3.desc.coterie: "Debe haberse esfumado en el aire cuando [coterie_victor.GetFirstNameNicknamed] le hizo papilla."
 POD_provoke_vatican.3.desc.end: "\n\nAntes de continuar, tendré que decidir qué hacer con [adversary.GetHerHim]."
 POD_provoke_vatican.3.option.a: "Eres demasiado peligroso para dejarte con vida."
 POD_provoke_vatican.3.option.b: "Eres completamente indigno de mi atención."

 POD_provoke_vatican.4.t: "Cortado en Seco"
 POD_provoke_vatican.4.desc: "Mi visión da vueltas. ¿En qué momento salió todo mal? Todo lo que quería era liberarnos de la esclavitud. "
 POD_provoke_vatican.4.desc.caelestius: "Mi visión da vueltas. ¿En qué momento salió todo mal? Todo lo que quería era una bendición. "
 POD_provoke_vatican.4.desc.end: "¿Por qué [adversary.GetFirstName] no puede entenderlo? ¿Por qué nadie puede entenderlo...?\n\nMi adversario niega con la cabeza. \"Esta noche, le hago un favor al mundo. Este es el mejor desenlace posible para tu búsqueda, [ROOT.Char.GetFirstNameNoTooltip]: contigo muerto, y tu nombre borrado de todos los registros, para que nadie se sienta jamás inspirado a intentar un plan tan desacertado de nuevo\".\n\nEl destello del arma de [adversary.GetHerHis] es lo último que veo antes de que todo termine."
 POD_provoke_vatican.4.option.a: "Pero yo quería hacer historia..."
 POD_provoke_vatican.4.option.a.caelestius: "Pero aún no he hablado con el Papa..."

 POD_provoke_vatican.5.t: "Una Victoria Pírrica"
 POD_provoke_vatican.5.desc: "La pelea se vuelve muy confusa muy rápidamente. [coterie_loser.GetFirstNameNicknamed] salta sobre [adversary.GetFirstName] y en cuestión de segundos, la sangre salpica por todas partes. Intentamos ayudar a nuestro miembro de la [ROOT.Char.Custom('PODCoterie')], pero en este caos, es imposible encontrar una apertura.\n\n[adversary.GetFirstNameNoTooltip] ruge de rabia y redobla su asalto. [coterie_loser.GetFirstNameNoTooltip] devuelve golpe por golpe.\n\nCuando el polvo se asienta, queda claro que ambos han sufrido grandes heridas agravadas. Nuestro adversario perece poco después, pero también lo hace [coterie_loser.GetFirstNameNoTooltip]."
 POD_provoke_vatican.5.option.a: "Tu sacrificio no será en vano, [coterie_loser.GetFirstNameNoTooltip]."

 POD_provoke_vatican.10.t: "Corderos al Matadero"
 POD_provoke_vatican.10.desc: "Los mortales abarrotan las calles de [GetTitleByKey('c_roma').GetNameNoTier], y su sola vista me llena de desdén.\n\n¿Por qué una [Select_CString(ROOT.Char.IsFemale,'leona','león')] como yo debería verse forzada a esconderse en la oscuridad, mientras estas ovejas pueden ir a donde les plazca?\n\nNo puedo entrar en el Vaticano propiamente dicho — el suelo sagrado seguramente me destruiría. Pero esto es la Ciudad Eterna. Los hombres santos están por todas partes."
 POD_provoke_vatican.10.desc.caelestius: "No quería que llegara a esto, pero los hombres santos de [GetTitleByKey('c_roma').GetNameNoTier] no me dejan otra opción.\n\n¡No he sido más que educado, y me pagan con desdén! Apuesto a que se están riendo de mí a mis espaldas. ¿Qué hice yo para merecer esto?"
 POD_provoke_vatican.10.desc.end: "\n\nSería tan fácil darles un espectáculo que nunca olvidarán."
 POD_provoke_vatican.10.option.a: "Matarlos. Matarlos a todos."
 POD_provoke_vatican.10.option.a.tt.beast: "#beast Sí... HAZLO.#!"
 POD_provoke_vatican.10.option.a.tt: "Mostrarás tus colmillos y te pondrás manos a la obra."
 POD_provoke_vatican.10.option.b: "Espera, no. Tengo dudas."
 POD_provoke_vatican.10.option.b.tt.beast: "#beast Aguafiestas.#!"
 POD_provoke_vatican.10.option.b.tt: "Abandonarás tu [journey|E]. Pero el daño a tu reputación jamás se recuperará..."
 POD_provoke_vatican.10.option.b.tt.caelestius: "Reflexionarás sobre las otras opciones a tu disposición."

 POD_provoke_vatican.11.t: "La Masacre"
 POD_provoke_vatican.11.desc: "Soy un artista, y [GetTitleByKey('c_roma').GetNameNoTier] es mi lienzo. Sus calles corren carmesí esta noche.\n\n¿Por qué huyen los mortales? Convertirse en el pigmento de mi obra maestra es el mayor propósito que jamás servirán.\n\nMis colmillos están al descubierto, para que todo el mundo los vea. Y me verán, ciertamente. ¡Mirad bien, todos! Contemplad a vuestro nuevo señor, que ya no se esconde en las sombras.\n\nMe siento mejor que nunca. Esto es algo que debería haber hecho hace mucho tiempo."
 POD_provoke_vatican.11.desc.caelestius: "Oh, si Pelagio pudiera verme ahora. Esta es una forma mucho más fácil de exponer la hipocresía del clero. Todo lo que necesito hacer es desgarrar y destrozar. Desgarrar y destrozar...\n\nA pesar de todas sus grandes palabras, su sangre sabe igual que la de los demás. Sus vísceras tienen el mismo aspecto que las de los demás. Si las amontonara lo suficientemente alto, ¿podría alcanzar el cielo?\n\nMe siento mejor que nunca. Esto es algo que debería haber hecho hace mucho tiempo. Dejar que mis acciones hablen, en lugar de mis palabras..."
 POD_provoke_vatican.11.tt.caelestius: "Te has hartado de la sangre del clero de Roma."
 POD_provoke_vatican.11.tt: "Te has hartado de la sangre de los plebeyos de Roma."
 POD_provoke_vatican.11.tt.notvampire: "Has cometido una masacre entre los plebeyos de Roma."
 POD_provoke_vatican.11.option.a: "Un baño de sangre para la posteridad."

 POD_provoke_vatican.12.t: "¿Dónde está el Papa?"
 POD_provoke_vatican.12.desc: "Hasta ahora, mi visita a [GetTitleByKey('c_roma').GetNameNoTier] ha sido un gigantesco ejercicio de frustración.\n\nEl Vaticano me está vedado. Ninguno de los hombres santos parece tener tiempo para hablar conmigo. ¡Ni siquiera están dispuestos a escucharme! ¡A mí, un maestro de la teología!\n\n¿Qué puedo hacer para convencerles de que les traigo asuntos de la mayor importancia?"
 POD_provoke_vatican.12.desc.repeat: "Sin éxito hasta ahora. "
 POD_provoke_vatican.12.desc.repeat.coterie: "Hemos estado buscando por todas partes, y ninguno de los clérigos con los que nos hemos reunido ha mostrado el más mínimo interés.\n\n"
 POD_provoke_vatican.12.desc.repeat.1: "[commenter.GetFirstNameNicknamed] asiente con aire de sabiduría. \"Solo tenemos que seguir intentándolo\", dice."
 POD_provoke_vatican.12.desc.repeat.2: "La frente de [commenter.GetFirstNameNicknamedPossessive] está fruncida. \"Nuestra paciencia será recompensada con el tiempo\", dice, sonando cada vez menos convencido por momentos."
 POD_provoke_vatican.12.desc.repeat.3: "[commenter.GetFirstNameNicknamed] masculla algo por lo bajo que suena sospechosamente a #italic \"Con lo de amar al prójimo...\"#!"
 POD_provoke_vatican.12.desc.repeat.4: "[commenter.GetFirstNameNicknamed] entrecierra los ojos hacia el horizonte, como si pudiera convocar a un obispo con solo mirar fijamente."
 POD_provoke_vatican.12.desc.repeat.5: "[commenter.GetFirstNameNicknamed] niega con la cabeza. \"Pensarías que leer la Biblia les habría enseñado más palabras aparte de 'no'.\""
 POD_provoke_vatican.12.desc.repeat.6: "[commenter.GetFirstNameNicknamed] suelta un grito de frustración ensordecedor, haciendo que algunos pájaros cercanos salgan volando. \"No me mires así\", dice. \"Estaba completamente justificado\"."
 POD_provoke_vatican.12.desc.repeat.7: "[commenter.GetFirstNameNicknamed] estira las piernas. \"¿Sabes qué me haría sentir mejor? Hacer papilla a uno de estos obispos\"."
 POD_provoke_vatican.12.desc.repeat.8: "[commenter.GetFirstNameNicknamed] suspira. \"Ya hemos probado el enfoque diplomático. ¿No deberíamos considerar algunas alternativas?\""
 POD_provoke_vatican.12.desc.repeat.9: "[commenter.GetFirstNameNicknamed] sisea. \"Quizás deberíamos tomar ejemplo de Nerón y quemar todo este lugar\"."
 POD_provoke_vatican.12.desc.repeat.10: "[commenter.GetFirstNameNicknamed] simplemente me lanza una mirada resentida, sin decir nada."
 POD_provoke_vatican.12.desc.repeat.nocoterie: "He estado buscando por todas partes, y ninguno de los clérigos con los que me he reunido ha mostrado el más mínimo interés.\n\nSolo tengo que seguir intentándolo. O quizás haya alternativas más drásticas que considerar..."
 POD_provoke_vatican.12.option.a: "Entraré en el Vaticano y hablaré con el Papa yo mismo."
 POD_provoke_vatican.12.option.a.tt: "No hay mayor concentración de tierra sagrada en ningún lugar del mundo. Esto solo puede terminar de una manera."
 POD_provoke_vatican.12.option.b: "Seguro que un obispo de alto rango puede concedernos audiencia."
 POD_provoke_vatican.12.option.b.tt: "Seguro..."
 POD_provoke_vatican.12.option.b.success.root: "Encuentras a un obispo dispuesto a escucharte."
 POD_provoke_vatican.12.option.b.success.coterie: "[learning_duelist.GetFirstNameNicknamed] encuentra a alguien dispuesto a escucharos."
 POD_provoke_vatican.12.option.b.failure.root: "No encuentras a nadie."
 POD_provoke_vatican.12.option.b.failure.coterie: "[learning_duelist.GetFirstNameNicknamed] no encuentra a nadie."
 POD_provoke_vatican.12.option.b.pope.root: "Contra todo pronóstico, consigues una audiencia con el Papa, lejos de cualquier tierra sagrada."
 POD_provoke_vatican.12.option.b.pope.coterie: "Contra todo pronóstico, [learning_duelist.GetFirstNameNicknamed] consigue organizar una audiencia con el mismísimo Papa, lejos de cualquier tierra sagrada."
 POD_provoke_vatican.12.option.c: "¡Esto es indignante! Debería enseñarles a respetarme..."
 POD_provoke_vatican.12.option.c.tt: "Emprenderás una matanza desenfrenada."
 POD_provoke_vatican.12.option.d: "Esto es imposible. Me rindo."

 POD_provoke_vatican.13.t: "Humillado por la Fe"
 POD_provoke_vatican.13.desc: "No me arrepiento #italic inmediatamente#! de mi decisión.\n\nEl dolor comienza lentamente al principio. Aprieto los dientes y sigo adelante. Seguro que esto es solo una prueba — una forma de que los fieles demuestren su devoción. Pero va a peor, y peor, y peor...\n\nNi siquiera he llegado aún a la Basílica, y la sensación de ardor se ha vuelto insoportable. Aunque no es solo una sensación. Estoy literalmente bañado en fuego divino.\n\n"
 POD_provoke_vatican.13.desc.coterie: "¿Dónde está el resto de mi [ROOT.Char.Custom('PODCoterie')]? No se les ve por ninguna parte. ¿Ya se han ido?\n\n"
 POD_provoke_vatican.13.desc.nocoterie: "¿Por qué me está pasando esto a mí? ¿No debería mi fe protegerme?\n\n"
 POD_provoke_vatican.13.desc.end: "Solo tengo unos instantes para meditar esta pregunta antes de que el fuego me consuma por completo."
 POD_provoke_vatican.13.option.a: "Qué irónica forma de morir para un teólogo."

 POD_provoke_vatican.14.t: "Recibido con Escepticismo"
 POD_provoke_vatican.14.desc.coterie: "¡Por fin estamos llegando a alguna parte! La pericia teológica de [learning_duelist.GetFirstNameNicknamedPossessive] puede abrir muchas puertas. "
 POD_provoke_vatican.14.desc.nocoterie: "¡Por fin estamos llegando a alguna parte! Mi pericia teológica puede abrir muchas puertas. "
 POD_provoke_vatican.14.desc.end: "En este caso, significa una reunión con el Obispo Sufragáneo [bishop.GetFirstName].\n\nÉl queda impresionado con mis eruditos argumentos, pero no es suficiente. Con una sonrisa beatífica, me dice que no, que no cualquiera que lo pida amablemente puede ver al Papa.\n\n¿Está intentando darme calabazas suavemente? ¿Sabe siquiera quién soy yo? Esto no puede quedar así."
 POD_provoke_vatican.14.option.a: "Debo convencerle, cueste lo que cueste."
 POD_provoke_vatican.14.option.a.tt: "¡Una oportunidad para un debate teológico! Esto es para lo que naciste. Cuéntaselo todo."
 POD_provoke_vatican.14.option.b: "Esto no tiene sentido. Seguiré buscando al Papa por otra parte."
 POD_provoke_vatican.14.option.b.tt: "Continúas tu búsqueda..."

 POD_provoke_vatican_revelation: "¡Se lo cuento #italic TODO#!.\n\nLe hablo de $POD_progenitor_caine$. Le hablo de $POD_progenitor_lilith$. Le cuento todo sobre los sucesos que acontecieron en la Tierra de Nod, hace mucho tiempo. Y le hablo de los muchos $pod_cainites$ que deambulan por las ciudades de Europa esta noche.\n\nCuanto más hablo, más exaltado me pongo. [bishop.GetFirstName] me escucha con profunda atención. Sus ojos se abren cada vez más por momentos. Esto va bien, puedo sentirlo."

 POD_provoke_vatican.15.t: "La Revelación"
 POD_provoke_vatican.15.desc: "$POD_provoke_vatican_revelation$\n\nEn cierto momento, me interrumpe, me agradece las ideas y se disculpa. Se va a toda prisa."
 POD_provoke_vatican.15.option.a: "¡Eh! ¡Tiene que darle buenas referencias mías al Papa!"
 POD_provoke_vatican.15.option.a.tt: "Pero ya se ha ido..."

 POD_provoke_vatican.16.t: "El Santo Padre"
 POD_provoke_vatican.16.desc: "¡Aleluya! Dios ciertamente me sonríe esta noche, pues he conseguido una audiencia con el mismísimo Santo Padre. Tantas veces he fantaseado con este acontecimiento, y ahora se ha hecho realidad.\n\nAunque parece... un poco menos piadoso de lo que era en mi imaginación. Pero no importa.\n\nEsto es lo que he estado esperando. El momento de la verdad. Una oportunidad para recibir una bendición del mismísimo [bishop.GetFirstName]."

 POD_provoke_vatican.17.t: "La Revelación"
 POD_provoke_vatican.17.desc: "$POD_provoke_vatican_revelation$\n\nDe repente, me interrumpe. \"Ya he oído suficiente, [ROOT.Char.GetFirstNameNoTooltip]. Gracias por traer esto a mi atención\". Sonríe."
 POD_provoke_vatican.17.option.a: "...Eso es bueno, ¿no?"
 POD_provoke_vatican.17.option.a.tt: "Pero, ¿qué es ese ruido que oyes detrás de ti?"
 POD_provoke_vatican.17.option.a.tt.success: "Algo malo sucede"
 POD_provoke_vatican.17.option.a.tt.failure: "Algo MUY malo sucede"

 POD_provoke_vatican.18.t: "¡Traición!"
 POD_provoke_vatican.18.desc.coterie: "Por suerte, [prowess_duelist.GetFirstNameNicknamed] reacciona lo bastante rápido como para desviar la estaca dirigida a mi corazón.\n\n"
 POD_provoke_vatican.18.desc.nocoterie: "Por suerte, reacciono lo bastante rápido como para desviar la estaca dirigida a mi corazón.\n\n"
 POD_provoke_vatican.18.desc: "Un [GetTrait('supehunter').GetName(GetNullCharacter)] se había acercado sigilosamente por detrás e intentó eliminarme. De repente, hay muchos de ellos alrededor. ¿Siempre estuvieron ahí?\n\n"
 POD_provoke_vatican.18.desc.end.coterie: "Los ojos de [bishop.GetFirstNamePossessive] arden con celo mientras grita: \"¡TRAS ELLOS!\"\n\nIntento reprimir mi decepción por cómo ha ido esta reunión mientras $POD_player_coterie$ se dan a la fuga."
 POD_provoke_vatican.18.desc.end.nocoterie: "Los ojos de [bishop.GetFirstNamePossessive] arden con celo mientras grita: \"¡TRAS [Select_CString(ROOT.Char.IsFemale,'ELLA','ÉL')]\"\n\nIntento reprimir mi decepción por cómo ha ido esta reunión mientras me doy a la fuga."
 POD_provoke_vatican.18.option.a: "¡Hora de correr!"
 POD_provoke_vatican.18.option.a.tt: "Intentarás escapar de la ciudad... con una horda de Inquisidores pisándote los talones."

 POD_provoke_vatican.19.t: "Traición..."
 POD_provoke_vatican.19.desc: "No reacciono lo bastante rápido ante el [GetTrait('supehunter').GetName(GetNullCharacter)] que se acerca sigilosamente por detrás.\n\nUna estaca se clava en mi corazón, dejándome paralizado. Mi forma aletargada solo puede observar impotente cómo los Inquisidores se acercan a mi alrededor. Algunos de ellos portan antorchas...\n\n[bishop.GetFirstName] me lanza una mirada significativa. \"Debería darte las gracias, [ROOT.Char.GetFirstNameNoTooltip]\", dice. \"Si no hubieras venido, jamás habría conocido la verdadera magnitud de lo que enfrenta la Iglesia. Necesitamos emplear todos nuestros recursos. La Inquisición en la Sombra ya no estará más en las sombras\"."
 POD_provoke_vatican.19.option.a: "No es así como imaginaba que iría esto..."


 POD_provoke_vatican.20.t: "[adversary.GetFirstNameNicknamedNoTooltip]"
 POD_provoke_vatican.20.desc.coterie: "Cuando empezamos a salir de la ciudad, un [GetTrait('supehunter').GetName(adversary)] se cruza en nuestro camino. ¡Por fin! Qué emocionante.\n\nNuestra emoción se convierte en horror cuando [adversary.GetSheHe] recita un versículo. [GetPlayer.Custom('PODPsalm23')]\n\nUna súbita sensación de fragilidad me invade. Los otros miembros de $POD_player_coterie$ no están mucho mejor. Claramente, este es un adversario con el que no se puede jugar."
 POD_provoke_vatican.20.desc.nocoterie: "Cuando empiezo a salir de la ciudad, un [GetTrait('supehunter').GetName(adversary)] se cruza en mi camino. ¡Por fin! Qué emocionante.\n\nMi emoción se convierte en horror cuando [adversary.GetSheHe] recita un versículo. [GetPlayer.Custom('PODPsalm23')]\n\nUna súbita sensación de fragilidad me invade. Claramente, este es un adversario con el que no se puede jugar."
 POD_provoke_vatican.20.desc.coterie.bishop: "Con sentimientos encontrados, caminamos por las calles de [GetTitleByKey('c_roma').GetNameNoTier], meditando cuál debería ser nuestro próximo paso. De repente, un caballero santo se cruza en nuestro camino. ¡Qué emocionante! ¿Quizás pueda llevarnos ante el Papa?\n\nNuestra emoción se convierte en horror cuando [adversary.GetSheHe] recita un versículo. [GetPlayer.Custom('PODPsalm23')]\n\nUna súbita sensación de fragilidad me invade. Los otros miembros de $POD_player_coterie$ no están mucho mejor. Entonces, el caballero desenfunda su [adversary.Custom('signature_weapon')]. ¡Esto no está yendo como esperaba..."
 POD_provoke_vatican.20.desc.nocoterie.bishop: "Con sentimientos encontrados, camino por las calles de [GetTitleByKey('c_roma').GetNameNoTier], meditando cuál debería ser mi próximo paso. De repente, un caballero santo se cruza en mi camino. ¡Qué emocionante! ¿Quizás pueda llevarme ante el Papa?\n\nMi emoción se convierte en horror cuando [adversary.GetSheHe] recita un versículo. [GetPlayer.Custom('PODPsalm23')]\n\nUna súbita sensación de fragilidad me invade. Entonces, el caballero desenfunda su [adversary.Custom('signature_weapon')]. Esto no está yendo como esperaba..."
 POD_provoke_vatican.20.desc.coterie.pope: "Cuando empezamos a salir de la ciudad, un [GetTrait('supehunter').GetName(adversary)] se cruza en nuestro camino. La noticia de nuestra reunión con el Papa debe haberse extendido rápido.\n\nPara empeorar las cosas, [adversary.GetSheHe] empieza a recitar un versículo. [GetPlayer.Custom('PODPsalm23')]\n\nUna súbita sensación de fragilidad me invade. Los otros miembros de $POD_player_coterie$ no están mucho mejor. Claramente, este es un adversario con el que no se puede jugar."
 POD_provoke_vatican.20.desc.nocoterie.pope: "Cuando empiezo a salir de la ciudad, un [GetTrait('supehunter').GetName(adversary)] se cruza en mi camino. La noticia de mi reunión con el Papa debe haberse extendido rápido.\n\nPara empeorar las cosas, [adversary.GetSheHe] empieza a recitar un versículo. [GetPlayer.Custom('PODPsalm23')]\n\nUna súbita sensación de fragilidad me invade. Claramente, este es un adversario con el que no se puede jugar."
 POD_provoke_vatican.20.desc.hunter2.coterie: "Nos apresuramos por calles secundarias y callejones, haciendo todo lo posible por mantenernos alejados de todas las patrullas de [GetTrait('supehunter').GetName(adversary)]. Y casi lo conseguimos, hasta que nos topamos con un operador que actúa en solitario.\n\n[adversary.GetSheHe|U] blande su lanza hacia nosotros y proclama: [GetPlayer.Custom('PODPsalm94')]\n\nLa fe de este es aún más fuerte. Esto empieza a ser molesto..."
 POD_provoke_vatican.20.desc.hunter2.nocoterie: "Me apresuro por calles secundarias y callejones, haciendo todo lo posible por mantenerme alejado de todas las patrullas de [GetTrait('supehunter').GetName(adversary)]. Y casi lo consigo, hasta que me topo con un operador que actúa en solitario.\n\n[adversary.GetSheHe|U] blande su lanza hacia mí y proclama: [GetPlayer.Custom('PODPsalm94')]\n\nLa fe de este es aún más fuerte. Esto empieza a ser molesto..."
 POD_provoke_vatican.20.desc.hunter3.coterie: "Ya casi hemos salido de la ciudad. La libertad está tan cerca que casi puedo saborearla. Parece que tampoco hay patrullas de [GetTrait('supehunter').GetName(adversary)] tan lejos.\n\nEntonces, un auténtico gigante de [adversary.Custom('WomanManGirlBoy')] sale de una puerta.\n\n[adversary.GetSheHe|U] alza su hacha en alto y grita: [GetPlayer.Custom('PODLordsPrayer')]\n\nCon la fe de [adversary.GetHerHis] amenazando con aplastarnos, nos preparamos para una confrontación final."
 POD_provoke_vatican.20.desc.hunter3.nocoterie: "Ya casi he salido de la ciudad. La libertad está tan cerca que casi puedo saborearla. Parece que tampoco hay patrullas de [GetTrait('supehunter').GetName(adversary)] tan lejos.\n\nEntonces, un auténtico gigante de [adversary.Custom('WomanManGirlBoy')] sale de una puerta.\n\n[adversary.GetSheHe|U] alza su hacha en alto y grita: [GetPlayer.Custom('PODLordsPrayer')]\n\nCon la fe de [adversary.GetHerHis] amenazando con aplastarme, me preparo para una confrontación final."
 POD_provoke_vatican.20.option.a: "Si quieres luchar conmigo, entonces luchemos."
 POD_provoke_vatican.20.option.a.tt: "Te batirás en duelo con este siervo de Dios tú mismo."
 POD_provoke_vatican.20.option.b: "[prowess_duelist.GetFirstName], es tu momento de brillar."

 POD_provoke_vatican.21.t: "Superando la Adversidad"
 POD_provoke_vatican.21.desc: "[adversary.GetFirstNameNicknamed] ha sido completamente derrotado. Su fe está quebrantada, sus salmos silenciados.\n\n¿Debería rematarlo ahora, o es mejor seguir adelante rápidamente?"
 POD_provoke_vatican.21.desc.drain: "\n\nPor supuesto, podría reponer mi $pod_vitae$ y encargarme de este problema, todo a la vez..."
 POD_provoke_vatican.21.desc.sanguine: "\n\nLa sangre de este [GetTrait('supehunter').GetName(adversary)] está completamente impregnada de fe. Beberla sería una idea extremadamente mala."
 POD_provoke_vatican.21.option.b: "Drenaré toda tu sangre."

 POD_provoke_vatican.22.t: "Fe Inquebrantable"
 POD_provoke_vatican.22.desc: "[adversary.GetFirstNameNicknamed] me desarma y, con la velocidad de un profesional consumado, se mueve para dar el golpe de gracia.\n\nEl tiempo parece ralentizarse mientras los acontecimientos de esta noche pasan ante mis ojos. ¿Se envalentonarán otros $POD_splat_hunter_plural$ con mi muerte? ¿Se unirán ahora los mortales en torno a una causa común? ¿Ha sido toda esta empresa un gran error?\n\nMis reflexiones se ven interrumpidas cuando el [adversary.Custom('signature_weapon')] del [GetTrait('supehunter').GetName(adversary)] golpea mi cuello."
 POD_provoke_vatican.22.option.a: "Qué será de mis sucesores, me pregunto..."

 POD_provoke_vatican.23.t: "A un Gran Coste"
 POD_provoke_vatican.23.desc: "La fe de [adversary.GetFirstNameNicknamed] nos pilla desprevenidos. [adversary.GetSheHe|U] blande su crucifijo y santifica todo el terreno a su alrededor, lo que acaba dándole una gran ventaja táctica.\n\nAhora estamos bloqueados fuera, y [coterie_loser.GetFirstNameNicknamed] se está quemando allí donde está.\n\nSin embargo, nuestro miembro de la [ROOT.Char.Custom('PODCoterie')] no está dispuesto a caer sin luchar, e incluso mientras la piel de [coterie_loser.GetHerHis] se ennegrece y humea, [coterie_loser.GetSheHe] se las arregla para llevarse al [GetTrait('supehunter').GetName(adversary)] por delante."


 POD_provoke_vatican.30.t: "¿El Fin...?"
 POD_provoke_vatican.30.desc: "Está hecho.\n\nAl Vaticano se le ha dado una lección de respeto, y yo viví para contarlo. Las batallas fueron duras, y salí victorioso. Ahora seré yo quien escriba la historia."
 POD_provoke_vatican.30.desc.caelestius: "Se acabó.\n\nPuede que no haya conseguido la bendición que esperaba, pero sin embargo, este Viaje resultó ser una gran prueba de fe. Y salí victorioso. Ninguno de los $POD_splat_hunter_plural$ pudo derrotarme."
 POD_provoke_vatican.30.desc.coterie: "\n\nSin embargo, al despedirme del resto de $POD_player_coterie$ y seguir cada uno nuestro camino, la tensión no abandona mi cuerpo. "
 POD_provoke_vatican.30.desc.nocoterie: "\n\nY sin embargo... la tensión no abandona mi cuerpo. "
 POD_provoke_vatican.30.desc.end: "Vencí, ¿no es cierto? Entonces, ¿por qué no puedo quitarme esta sensación de pavor?\n\nMi aprensión no disminuye cuando me acerco a las puertas de mi [ROOT.Char.Custom('PODDomicile')] y veo que están abiertas de par en par.\n\nAlguien ha estado aquí.\n\nY ciertamente yo no he invitado a nadie."
 POD_provoke_vatican.30.option.a: "Desenfundo mi arma y me preparo para lo peor..."

 POD_provoke_vatican.31.t: "#TOOLTIP:NICKNAME,nick_vatican_hunter4,[hunter4.GetID] #L El Cordero#!#!"
 POD_provoke_vatican.31.desc.coterie: "Los otros miembros de $POD_player_coterie$ yacen muertos en un montón. En medio de ellos se alza un [Select_CString(hunter4.IsFemale,'Inquisitriz','Inquisidor')], enmarcado en un halo de luz diurna insoportable, semejante a una visión del apocalipsis.\n\n"
 POD_provoke_vatican.31.desc.nocoterie: "El interior de mi [ROOT.Char.Custom('PODDomicile')] es una ruina humeante. En medio de ella se alza un [Select_CString(hunter4.IsFemale,'Inquisitriz','Inquisidor')], enmarcado en un halo de luz diurna insoportable, semejante a una visión del apocalipsis.\n\n"
 POD_provoke_vatican.31.desc.vampire: "[hunter4.GetSheHe|U] no reza.\n[hunter4.GetSheHe|U] no habla.\n[hunter4.GetSheHe|U] da un paso al frente, y mi sangre aúlla en agonía.\n\nRevelaciones de culpa me invaden. El peso de todos los pecados de mis antepasados, remontándose hasta [ROOT.Char.Custom('PODProgenitor')], asaltándome como fantasmas hambrientos, cortando mi mente como cuchillos.\n\nArde.\n\n"
 POD_provoke_vatican.31.desc.notvampire: "[hunter4.GetSheHe|U] no reza.\n[hunter4.GetSheHe|U] no habla.\n[hunter4.GetSheHe|U] da un paso al frente, y la fe de [hunter4.GetHerHis] retumba como un trueno.\n\nRevelaciones de culpa me invaden. El peso de todos los pecados de mis antepasados, amenazando con aniquilarme, asaltándome como fantasmas hambrientos, cortando mi mente como cuchillos.\n\nArde.\n\n"
 POD_provoke_vatican.31.desc.end: "Quiero gritar, pero ningún sonido escapa de mis labios."
 POD_provoke_vatican.31.option.a: "¿Me quieres a mí? Entonces ven a buscarme."
 POD_provoke_vatican.31.option.a.tt: "Una sensación de finalidad te invade mientras preparas tu espada una última vez..."

 POD_provoke_vatican.32.t: "Cenizas a las Cenizas"
 POD_provoke_vatican.32.desc: "Cuando mi arma golpea el corazón del [GetTrait('supehunter').GetName(hunter4)], las visiones apocalípticas se desvanecen. La luz del día también retrocede. ¿Era eso también una alucinación?\n\nMe siento entre los escombros de lo que solía ser mi [ROOT.Char.Custom('PODDomicile')] y reflexiono sobre los acontecimientos de este viaje.\n\n"
 POD_provoke_vatican.32.desc.coterie: "Salí de una pieza. No se puede decir lo mismo de los otros miembros de $POD_player_coterie$. ¿Fueron mis decisiones las que les condenaron? ¿O habría venido la Inquisición a por ellos de todos modos?\n\n"
 POD_provoke_vatican.32.desc.nocoterie: "Salí de una pieza. Eso es lo que cuenta, ¿no?\n\n"
 POD_provoke_vatican.32.desc.caelestius.nopope: "Salí de una pieza. Eso es lo que cuenta, ¿no? Es una pena que nunca llegara a reunirme con el Papa. ¿Me habría bendecido? Me pregunto...\n\n"
 POD_provoke_vatican.32.desc.caelestius.pope: "Salí de una pieza. Eso es lo que cuenta, ¿no? Es una pena que la reunión con el Papa saliera como salió. ¿Había alguna posibilidad de que pudiera haberme bendecido?\n\n"
 POD_provoke_vatican.32.desc.end: "Sea cual sea el caso... tengo la sensación de que las dificultades no han hecho más que empezar."
 POD_provoke_vatican.32.option.a: "\"Que vivas en tiempos interesantes\", como suele decirse."
 POD_provoke_vatican.32.option.a.tt: "Los $POD_splat_hunter_plural$ han dejado de ir a por ti. Por ahora."
 POD_provoke_vatican.32.option.a.tt2: "Tus acciones te han hecho ser aborrecido por el resto del $pod_wod$. Haría falta un auténtico milagro para restaurar tu reputación..."

 POD_provoke_vatican.33.t: "El Cuarto Sello"
 # Apocalipsis 5:1-12 RV1960
 POD_provoke_vatican.33.desc: "Me siento tan lento en esta lucha. Como si me moviera a través de miel espesa. ¿Cuánto de esto es real? Ya no puedo distinguirlo...\n\n\nY miré, y oí la voz de muchos ángeles alrededor del trono, y de los seres vivientes, y de los ancianos; y el número de ellos era miríadas de miríadas, y millares de millares,\n\nque decían a gran voz: Digno es el Cordero que fue inmolado de recibir el poder, y las riquezas, y la sabiduría, y la fortaleza, y la honra, y la gloria, y la bendición."


 POD_provoke_vatican.200.t: "Por Siempre Indomable"
 POD_provoke_vatican.200.desc: "Yo tenía razón, desde el principio.\n\n¿Necesito decir algo más?\n\nNo, no lo necesito."
 POD_provoke_vatican.200.option.a: "Ahora puedo decir \"Te lo dije\"."