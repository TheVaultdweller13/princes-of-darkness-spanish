l_spanish:

 POD_provoke_inquisition_effect_tt: "#N;bold ¡El mundo ha cambiado irreversiblemente por tu culpa.#!"
 POD_provoke_inquisition_effect_tt_2: "La Santa Sede ha tomado nota de tus acciones, y la Inquisición ha comenzado a movilizarse. En aproximadamente #V [EmptyScope.ScriptValue('premature_inquisition_delay')]#! años, desatarán sus ejércitos sobre el $pod_wod$, y no se sabe cuáles serán las repercusiones de este acontecimiento..."

 POD_vatican_coterie_duel_success_tt: "[prowess_duelist.GetFirstNameNicknamed] derrota a [adversary.GetFirstName]"
 POD_vatican_coterie_duel_failure_tt: "[prowess_duelist.GetFirstNameNicknamed] y [adversary.GetFirstName] sucumben ambos a sus heridas"
 POD_vatican_coterie_duel_critfail_tt: "[prowess_duelist.GetFirstNameNicknamed] es completamente aniquilado"


 POD_psalm23_translated: "#TOOLTIP:POD_psalm23_translation #V;L $POD_psalm23_latin$#!#!"
