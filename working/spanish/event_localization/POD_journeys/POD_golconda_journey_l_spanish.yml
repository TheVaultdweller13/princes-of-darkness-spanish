l_spanish:
 POD_golconda_journey.1.t: "En busca de respuestas"
 POD_golconda_journey.1.desc: "[teacher.GetFirstName] se reúne conmigo en un jardín apartado, lejos de miradas indiscretas. Su voz es baja, pero sus ojos brillan.\n\nMe habla de la Redención.\n\nPrometida por primera vez a [GetScriptedCharacterByHistoryID('505001').GetFirstName] por Gabriel, mensajero de Dios. Alcanzada por primera vez por [GetScriptedCharacterByHistoryID('505008').GetFirstNameNicknamed]. Un estado buscado por muchos y alcanzado por pocos.\n\nEl nombre de esta redención es [GetTrait('golconda').GetName(GetNullCharacter)]."
 POD_golconda_journey.1.option.a: "Hablamos hasta las primeras horas de la mañana..."

 POD_golconda_journey.2.t: "Un viaje de mil pasos"
 POD_golconda_journey.2.desc: "[teacher.GetFirstName] intenta explicar el camino a la [golconda|E] con una larga serie de metáforas vagas, cada una más esotérica y confusa que la anterior. #italic Creo#! que entiendo la idea general, sin embargo.\n\nLa Golconda es, en cierto modo, un retorno a la Humanidad. Un $pod_cainite$ que recorre el camino #X nunca debe dejar que su Humanidad decaiga cometiendo asesinatos o robos#!.\n\nAdemás, #X el frenesí debe evitarse a toda costa#!. Tener un alto [piety_level|E] en la propia [Concept('faith','Senda')|E] puede debilitar la influencia de [Glossary('The Beast','game_concept_beast_desc')].\n\nCuando [teacher.GetFirstName] se despide de mí, me quedo sumido en mis pensamientos."
 POD_golconda_journey.2.effect: "Has aprendido sobre la [golconda|E] y has desbloqueado el [journey|E] para hacer las paces con tu [Glossary('Beast','game_concept_beast_desc')]."
 POD_golconda_journey.2.option.a: "Ahora sé lo que debo hacer."


 POD_golconda_journey.10.t: "Un goteo de revelaciones"
 POD_golconda_journey.10.desc: "Me recluyo en mi [ROOT.Char.Custom('PODDomicile')] y reflexiono sobre lo que he aprendido.\n\n"
 POD_golconda_journey.10.desc.1: "[Glossary('The Beast','game_concept_beast_desc')] es poderosa. De hecho, algunas [Concept('faith','Sendas')|E] intentarán aprovechar su poder #beast rindiéndose#! a ella, y sus seguidores se alejarán cada vez más de la Humanidad, sin importarles las consecuencias.\n\nPor supuesto, el camino de la [golconda|E] es fundamentalmente incompatible con tal enfoque. Sin embargo, [Glossary('The Beast','game_concept_beast_desc')] no aceptará nada que no sea una #beast rendición#! completa. ¿Podría convencérsela para entablar una asociación de igualdad?"
 POD_golconda_journey.10.desc.2: "[Glossary('The Beast','game_concept_beast_desc')] está #beast hambrienta#!. La Bestia es el #beast hambre#! misma.\n\nPero ¿qué #italic es#! el #beast hambre#!? Solo un instinto de supervivencia. Un recordatorio de que cada criatura en este mundo necesita #beast alimentarse#!.\n\nSin embargo, lo que la Bestia exige va mucho más allá de lo necesario para la supervivencia. Algo no cuadra."
 POD_golconda_journey.10.desc.3: "[Glossary('The Beast','game_concept_beast_desc')] es impulsiva. Tira de mí constantemente, exigiendo que me #beast beba#! a mis cortesanos, a mis pares, a mis amigos, a todos los que conozco, a todos los que aprecio.\n\nSin embargo, también es astuta. En mis observaciones, he visto pruebas de su inteligencia. Así que puede planificar con antelación.\n\nLo que plantea la pregunta: ¿están todas sus demandas aparentemente impulsivas al servicio de algún propósito mayor?"
 POD_golconda_journey.10.desc.4: "[Glossary('The Beast','game_concept_beast_desc')] es una #beast maldición#!. Muchos dirían que del propio Dios o de alguna otra entidad de tal poder, pero los detalles no importan realmente.\n\nNunca se puede confiar en ella, ni negociar con ella, ni siquiera coaccionarla. Ya sea un invasor extranjero o un reflejo oscuro no tiene importancia porque, al final, es una prueba.\n\nComprender esta prueba y cómo superarla podría ser la clave de todo."
 POD_golconda_journey.10.desc.5: "[Glossary('The Beast','game_concept_beast_desc')] es primitiva. El hombre fue #beast salvaje#! una vez, y todos los adornos modernos de la \"civilización\" intentan ocultar torpemente la brutalidad inherente a la existencia del hombre.\n\nLos mortales no oyen a [Glossary('The Beast','game_concept_beast_desc')] como nosotros, pero ciertamente sienten sus efectos, lo que explica la #beast violencia#! de su mundo. Los vampiros, como criaturas atrapadas en un estasis eterno, están más cerca de este estado primitivo de las cosas y, como tales, oyen la llamada a la violencia con mucha más claridad.\n\nLa Golconda es quizás el verdadero siguiente paso de la evolución de uno, donde el #beast salvajismo#! del nacimiento de la humanidad puede finalmente dejarse atrás."
 POD_golconda_journey.10.desc.6: "[Glossary('The Beast','game_concept_beast_desc')] soy yo. Muchos se escandalizarían ante tal noción, pero pocos pueden negar el crudo #beast atractivo#! de sus susurros. ¿Cómo podría nacer tal #beast atractivo#! si no fuera por ser un reflejo oscuro de la propia persona? Como los vampiros saben muy bien, los mejores tentadores lo saben todo sobre su presa.\n\nSin embargo, superar esta comprensión no es un asunto menor. Uno no puede simplemente eliminar una parte de sí mismo sin perder mucho en el proceso, lo que deja solo un curso de acción, aterrador en su simplicidad.\n\nAceptación.\n\nYo soy [Glossary('The Beast','game_concept_beast_desc')] y [Glossary('The Beast','game_concept_beast_desc')] es yo."
 POD_golconda_journey.10.desc.7: "[Glossary('The Beast','game_concept_beast_desc')] es seductora. Como la serpiente en el primer jardín, ofrece promesas tentadoras, soluciones sencillas y salidas fáciles. Y, al igual que la serpiente, todos esos son caminos a la #beast condenación#!.\n\nSi el vampirismo fuera de hecho una maldición bíblica de algún tipo, no puede haber una solución sencilla, ningún poder mágico para deshacerlo todo.\n\nLa respuesta solo puede residir en un largo camino de expiación personal, lejos de los #beast antojos#! bestiales de nuestra especie. En este camino solitario, solo hay un compañero, [Glossary('The Beast','game_concept_beast_desc')], intentando hacernos caer en cada paso del camino. Solo tenemos que rechazar sus tentadoras ofertas.\n\nEva solo tuvo que rechazar las de la serpiente, después de todo."
 POD_golconda_journey.10.desc.8: "[Glossary('The Beast','game_concept_beast_desc')] es Prometeo. El portador del fuego que salvó a la humanidad de la esclavitud de los Dioses pero que también la condenó a quemarse una y otra vez. Alimenta mis poderes, aplasta a mis enemigos y me protege de los horrores en la oscuridad.\n\nPero también me convierte en un monstruo, un Dios-Esclavista que esclaviza a la humanidad para mi propio #beast placer#! pervertido y repite el ciclo interminable. Quizás romperlo signifique simplemente dejar de depender de él.\n\nPero ¿qué soy yo sin el #beast poder#! que me hizo libre?"
 POD_golconda_journey.10.desc.9: "[Glossary('The Beast','game_concept_beast_desc')] es una ilusión. Una fabricación de nuestra propia mente para racionalizar los horrores que #beast desatamos#! sobre la humanidad. La mera existencia de la Golconda, y el hecho de que se rumorea que aquellos que la alcanzan están libres de ella, demuestra que [Glossary('The Beast','game_concept_beast_desc')] es un mito tan profundamente arraigado en la psique de los $pod_cainites$ que se ha convertido en su propia forma de realidad.\n\nLas voces en mi cabeza, el oscuro #beast impulso#! de beber, matar, mutilar, son solo eso, fragmentos de una mentalidad depredadora que puede ser recortada con suficiente fuerza de voluntad."

 POD_golconda_journey.10.option.a: "Cada respuesta conduce a aún más preguntas."
 POD_golconda_journey.10.option.a.success: "Tienes un gran avance en tu comprensión de [Glossary('The Beast','game_concept_beast_desc')]."
 
 POD_golconda_journey.11.t: "Mirando al Abismo"
 POD_golconda_journey.11.desc: "Algo es diferente esta vez.\n\nMientras me siento y contemplo, me relajo mucho. Mi conciencia sigue las sensaciones de mi cuerpo, el flujo de $pod_vitae$ en mis venas. Y de repente, lo noto.\n\nComo el pinchazo más pequeño de un dolor ardiente. Un dolor indistinto flotando a través de la sangre de mi corazón.\n\nEstá hecho de... ¿recuerdos? Y #beast hambre#!.\n\nMe siento absolutamente seguro. Aquí es donde reside [Glossary('The Beast','game_concept_beast_desc')]. Si despertara mi sangre, podría desbloquear lo que sea que esté escondiendo. Y finalmente podría enfrentarme a ella, cara a cara."
 POD_golconda_journey.11.effect: "Has desbloqueado el Suspiro como un [journey|E]."
 POD_golconda_journey.11.option.a: "La pregunta es... ¿estoy listo?"


 POD_golconda_journey.100.t: "Sondeando las profundidades"
 POD_golconda_journey.100.desc: "Cierro las puertas de mi [ROOT.Char.Custom('PODDomicile')] por última vez, pensando en los acontecimientos que me han traído hasta aquí.\n\n"
 POD_golconda_journey.100.desc.compassion: "En todo lo que hago, trato de ver lo mejor en los demás. Y me he esforzado por extender esa misma compasión a [Glossary('The Beast','game_concept_beast_desc')], pero no me lo está poniendo fácil.\n\n¿Puedo mostrar compasión al #beast hambre ciega#!? Cuanto más trato de entender sus motivos, más inescrutable parece.\n\nSolo puedo esperar que enfrentarme a ella de frente me lleve a las respuestas que busco."
 POD_golconda_journey.100.desc.selfreliance: "Aprendí pronto que no se puede confiar en los demás. Así es el mundo. La ingenuidad destruirá a un $pod_cainite$ tan seguramente como la luz del sol.\n\nNadie puede ayudarme en esta búsqueda. Si quiero enfrentarme a [Glossary('The Beast','game_concept_beast_desc')], la responsabilidad recae directamente sobre mí.\n\nSé lo que tengo que hacer y tengo la determinación para hacerlo."
 POD_golconda_journey.100.option.a: "Extiendo mis sentidos y los envío a lo más profundo..."

 POD_golconda_journey.101.t: "A la deriva"
 POD_golconda_journey.101.desc: "Dolor.\n\nEstoy atrapado en un torbellino de colores ensordecedores. Ruidos discordantes dejan regustos metálicos en mi lengua. Lo de arriba es abajo y lo de abajo es arriba.\n\nEl asalto sensorial me golpea como un alud. El pánico se apodera de mí. ¿Estoy a punto de morir?\n\nNecesito una forma de conectarme a tierra, y rápido."
 POD_golconda_journey.101.option.a: "Centrarse en las sensaciones corporales."
 POD_golconda_journey.101.option.b: "Centrarse en un recuerdo agradable."

 POD_golconda_journey.102.t: "Flotando"
 POD_golconda_journey.102.desc: "El caos a mi alrededor se calma, aunque solo sea un poco. Las formas se reorganizan en un orden geométrico. Como una serie infinita de espejos, me veo repetido en ellos.\n\nSon como un microcosmos de mi pasado. Todos mis recuerdos de alegrías y penas, orgullo y arrepentimiento, decepción y alivio.\n\nDesde esta distancia, parecen tan pequeños e insignificantes."
 POD_golconda_journey.102.option.a: "Un recordatorio para no dejar que las cosas se me suban a la cabeza."
 POD_golconda_journey.102.option.b: "Un recordatorio para pensar en lo que es verdaderamente importante."

 POD_golconda_journey.103.t: "Con los pies en la tierra"
 POD_golconda_journey.103.desc: "Las ilusiones se rompen y me encuentro en el valle de un río.\n\nEl sol brilla. Ya había olvidado lo que es recibir su calor. Las palabras no pueden describir la sensación.\n\nUn hombre está de pie en la orilla del río. El cuerpo sin vida de su hermano está extendido ante él, la sangre de una herida en la cabeza se derrama sin ceremonias en las aguas.\n\nEl rostro del hombre está inexpresivo. Sin embargo, me invade una intensa sensación de reconocimiento. Sé exactamente lo que siente."
 POD_golconda_journey.103.option.a: "Culpa."
 POD_golconda_journey.103.option.b: "Confusión."
 POD_golconda_journey.103.option.c: "Rabia insondable."

 POD_golconda_journey.104.t: "Horizonte de sucesos"
 POD_golconda_journey.104.desc: "El hombre se gira para mirarme. Su entorno se arremolina y se disuelve. Todo el mundo se agita, convirtiéndose en un océano de líquido rojo hirviente.\n\n#beast;bold Hambre.#!\n\nY finalmente entiendo lo que es el hambre. "
 POD_golconda_journey.104.desc.guilt: "Es su culpa.\n\nFue etiquetado como pecador, pero no se le ofreció ninguna oportunidad realista de redención, incluso a medida que pasaban los milenios."
 POD_golconda_journey.104.desc.confusion: "Es su confusión.\n\nEs su sentimiento de impotencia al ver cómo le cambiaban las reglas, y preguntarse durante milenios si algo podría hacerle sentir poderoso de nuevo."
 POD_golconda_journey.104.desc.rage: "Es su rabia.\n\nOfreció amor y recibió milenios de castigo a cambio."
 POD_golconda_journey.104.desc.end: "\n\nY me doy cuenta: ninguno de estos sentimientos son míos. Son suyos, y son suyos para conservarlos.\n\nSin embargo, su peso está a punto de ahogarme."
 POD_golconda_journey.104.option.a.tt: "Intentarás evitar el frenesí una última vez."
 POD_golconda_journey.104.option.a.success: "Internalizas tu comprensión del hambre, lo que te lleva a la [enlightenment|E]."
 POD_golconda_journey.104.option.a.failure: "Te conviertes en #beast hambre#!, y el #beast hambre#! se convierte en ti."

 POD_golconda_journey.105.t: "Golconda"
 POD_golconda_journey.105.desc: "Despierto. La realidad se desenfoca y vuelve lentamente a enfocarse, tomándose su tiempo.\n\nEstoy absolutamente cubierto de $pod_vitae$. Debe de haber rezumado de mis poros mientras mi mente estaba en su búsqueda de visiones.\n\nLa visión de esto sería suficiente para enviar a cualquier $pod_cainite$ al frenesí. Pero nada se agita en mi interior. Ninguna voz interna que me inste a bebérmelo todo.\n\nSolo silencio."
 POD_golconda_journey.105.option.a: "Silencio..."
 POD_golconda_journey.105.option.b: "Sondear el silencio más profundamente."
 POD_golconda_journey.105.option.b.tt: "Vuelves a ser [GetTrait('mortal').GetName(GetNullCharacter)], perdiendo toda tu influencia y habilidades vampíricas."

 POD_golconda_journey.106.t: "Wassail"
 POD_golconda_journey.106.desc: "Sangre es todo lo que puedo ver.\n\nEn todas partes. Efervescente. Hirviendo. Burbujeantes baratijas llamando.\n\nDentro de mí, a mi alrededor. No hay separación. No dual, no duelo, solo rendición, solo rendi#beast ción, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo rendición, solo r#!"
 POD_golconda_journey.106.option.a: "#beast rendición#!"

 POD_golconda_journey.107.t: "Segunda aurora"
 POD_golconda_journey.107.desc: "Vomito, violentamente.\n\nCon cada gota de $pod_vitae$ que golpea el suelo, me vuelvo del revés. Todo da vueltas. El pasado se desenreda, los hilos de su tapiz se desconectan uno a uno. Tengo arcadas y más arcadas.\n\nY entonces termina.\n\nRespiro hondo, y otra vez, y la comprensión de que las #italic cosas muertas#! no deberían respirar solo me golpea después de que haya pasado algún tiempo. El hambre que secuestró mi cuerpo y se llamó a sí misma \"[ROOT.Char.GetFirstNameNoTooltip]\" ha sido expulsada, para siempre.\n\nLo que queda soy verdaderamente yo. Un ser vivo y frágil. ¿Valió la pena?"
 POD_golconda_journey.107.option.a: "Mi historia termina aquí."
 POD_golconda_journey.107.option.a.tt: "Te conviertes en [GetTrait('mortal').GetName(GetNullCharacter)] #N y el juego termina#!, mientras [THIS.Char.GetFirstName] deja atrás el $pod_wod$ y vive sus días restantes en paz."
 POD_golconda_journey.107.option.b: "Mi historia continúa en otra parte."
 POD_golconda_journey.107.option.b.tt: "Continúas jugando como tu heredero, [heir_tooltip.GetShortUIName], mientras [THIS.Char.GetFirstName] se convierte en [GetTrait('mortal').GetName(GetNullCharacter)] y es depuesto."
 POD_golconda_journey.107.option.c: "Mi historia continúa aquí."
 POD_golconda_journey.107.option.c.tt: "Te conviertes en un [GetTrait('supehunter').GetName(GetNullCharacter)] [GetFaithByKey('independenthunters').GetAdjective] y sigues jugando como un [adventurer|E] [unlanded|E] con una nueva [dynasty|E]. Podrías perder tu [THIS.Char.Custom('PODCoterie')] o a tu cónyuge si ahora consideran hostil a tu [splat|E]."


 POD_golconda_journey.1000.t: "Hola oscuridad, mi vieja amiga"
 POD_golconda_journey.1000.desc: "#beast Oh, AHORA estamos hablando.\n\n¿Pensaste que podrías librarte de mí para siempre? ¿REALMENTE pensaste que tu numerito de santurrón iba a engañar a alguien? Bueno, a MÍ no me iba a engañar.\n\nY mira a dónde te ha llevado. Simplemente no pudiste resistir la tentación, ¿verdad? Bueno, por mi parte estoy TAN feliz de que hayas vuelto.\n\nNos vamos a divertir mucho juntos. Solo espera...#!"
 POD_golconda_journey.1000.option.a.tt: "Te has desviado del camino de la [golconda|E]. Si quieres recuperar este estado, tendrás que empezar de nuevo desde el principio..."
 POD_golconda_journey.1000.option.b: "Me rindo."
 POD_golconda_journey.1000.option.b.tt: "Abandonas el camino de la [golconda|E] por completo."

 POD_golconda_journey.1001.t: "Un contratiempo"
 POD_golconda_journey.1001.desc: "#beast ¡LO SABÍA! Lo sabía. Simplemente lo sabía.\n\nTe gusta actuar de forma tan noble y poderosa, ¿eh? ¿Crees que eres algún tipo de sabio? ¿Crees que eres MEJOR QUE YO? Pues PIÉNSALO OTRA VEZ, CABRÓN.\n\nMe gustas más así. Ceder a tus impulsos te hace mucho más simpático. Deberías convertirlo en un hábito.#!"
 POD_golconda_journey.1001.option.a.tt: "Te has desviado del camino de la [golconda|E], y tu progreso en el [trait|E] [GetTrait('golconda_seeker').GetName(GetNullCharacter)] se ha restablecido."

 POD_golconda_journey.2000.toast.t: "Fin de la mentoría"
 POD_golconda_journey.2000.toast.golconda: "[golconda_mentee.GetShortUIName] ha alcanzado la [GetTrait('golconda').GetName(GetNullCharacter)]"
 POD_golconda_journey.2000.toast.insight: "La perspicacia de [golconda_mentee.GetShortUINamePossessive] ha superado la tuya"
 POD_golconda_journey.2000.toast.lowinsight: "Debido a tu baja perspicacia, ya no puedes ser mentor de otros"
 POD_golconda_journey.2000.toast.invalid: "[golconda_mentee.GetShortUIName] ya no puede recibir mentoría"

 POD_golconda_journey.2001.t: "Guía constante"
 POD_golconda_journey.2001.desc: "Ha pasado un año desde la última vez que impartí parte de mi conocimiento sobre [Glossary('The Beast','game_concept_beast_desc')] a [golconda_mentee.GetFirstNameNicknamed].\n\nEn el tiempo transcurrido desde entonces, su comprensión se ha profundizado, por lo que su mente está abierta a nuevos conocimientos una vez más."
 POD_golconda_journey.2001.desc.xp: "\n\nActualmente, su #TOOLTIP:GAME_TRAIT,golconda_seeker,[golconda_mentee.GetID] #L Perspicacia#!#! está al #V [golconda_mentee.MakeScope.ScriptValue('suspire_success_chance')]%#!."
 POD_golconda_journey.2001.desc.end: "\n\nDebería decidir si sigo siendo su mentor o no."
 POD_golconda_journey.2001.option.a: "Le daré mentoría esta noche, y lo haré de nuevo el año que viene."
 POD_golconda_journey.2001.option.a.tt: "En un año, volverás a dar mentoría a [golconda_mentee.GetShortUIName]"
 POD_golconda_journey.2001.option.b: "Le daré mentoría esta noche, pero no más allá."
 POD_golconda_journey.2001.option.b.tt: "Dejarás de dar mentoría a [golconda_mentee.GetShortUIName]"
 POD_golconda_journey.2001.option.c: "Dejaré de darle mentoría por ahora."
