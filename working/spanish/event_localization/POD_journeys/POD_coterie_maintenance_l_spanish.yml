l_spanish:

 POD_coterie_maintenance.1.t: "Fundar una [ROOT.Char.Custom('PODCoterieNoTooltip')]"
 POD_coterie_maintenance.1.desc: "Últimamente he estado contemplando los beneficios de trabajar en equipo.\n\nLa confianza es difícil de encontrar en este $pod_wod$, pero ¿significa eso que tengo que pasar el resto de mi existencia como un lobo solitario, sin nadie que luche a mi lado o apoye mis esfuerzos?\n\nSi creara una [ROOT.Char.Custom('PODCoterie')] de individuos con ideas afines, podríamos unir nuestras habilidades y recursos para futuros [journeys|E]."
 POD_coterie_maintenance.1.option.a: "Crearé una nueva [ROOT.Char.Custom('PODCoterieNoTooltip')]."
 POD_coterie_maintenance.1.option.b: "No quiero crear una [ROOT.Char.Custom('PODCoterieNoTooltip')] en este momento."

 POD_coterie_maintenance.2.t: "Nombrar mi [ROOT.Char.Custom('PODCoterieNoTooltip')]"
 POD_coterie_maintenance.2.desc: "¿Cuál debería ser el nombre de tu [ROOT.Char.Custom('PODCoterie')]?\n\nPuedes cambiarlo en cualquier momento en el futuro."
 POD_coterie_maintenance.2.option.a: "Elegir este nombre."
 POD_coterie_maintenance.2.option.b: "Mantener el nombre por defecto #italic ([ROOT.Char.Custom('PODGetDefaultCoterieName')])#!."

 POD_coterie_maintenance.10.t: "Otro más que muerde el polvo"
 POD_coterie_maintenance.10.desc: "$POD_player_coterie$ ha perdido a un miembro.\n\n[dead_member.GetFirstNameNicknamed] [dead_member.GetDeathReason]."
 POD_coterie_maintenance.10.option.a: "Nuestra [ROOT.Char.Custom('PODCoterieNoTooltip')] se está reduciendo."

 POD_coterie_maintenance.20.t: "Una [ROOT.Char.Custom('PODCoterieNoTooltip')] a considerar"
 POD_coterie_maintenance.20.desc: "Como sucesor de [dead_member.GetFirstNameNicknamed], tengo la opción de unirme a su [dead_member.Custom('PODCoterie')], [coterie.Custom('PODGetCoterieNameFromStory')]."
 POD_coterie_maintenance.20.desc.2: "Como ya soy miembro de $POD_player_coterie$, también debo decidir qué hacer con ella."
 POD_coterie_maintenance.20.option.a: "#bold Me uniré#! a [coterie.Custom('PODGetCoterieNameFromStory')]."
 POD_coterie_maintenance.20.option.a.tt: "Te unirás a la [dead_member.Custom('PODCoterie')] de tu predecesor [dead_member.GetFirstNameNicknamed], [coterie.Custom('PODGetCoterieNameFromStory')]."
 POD_coterie_maintenance.20.option.b: "#bold Disolveré#! [coterie.Custom('PODGetCoterieNameFromStory')]."
 POD_coterie_maintenance.20.option.b.tt: "Disolverás la [dead_member.Custom('PODCoterie')] de tu predecesor [dead_member.GetFirstNameNicknamed], [coterie.Custom('PODGetCoterieNameFromStory')]."
 POD_coterie_maintenance.20.option.c: "No haré nada."
 POD_coterie_maintenance.20.option.c.tt: "No te unirás a la [dead_member.Custom('PODCoterie')] de tu predecesor [dead_member.GetFirstNameNicknamed], [coterie.Custom('PODGetCoterieNameFromStory')], pero seguirá existiendo."
 POD_coterie_maintenance.20.option.d: "#bold Unirse#! a [coterie.Custom('PODGetCoterieNameFromStory')] y dejar [ROOT.Char.Custom('PODGetCoterieName')]."
 POD_coterie_maintenance.20.option.e: "#bold Unirse#! a [coterie.Custom('PODGetCoterieNameFromStory')] y #bold disolver#! [ROOT.Char.Custom('PODGetCoterieName')]."
 POD_coterie_maintenance.20.option.f: "#bold Disolver#! [coterie.Custom('PODGetCoterieNameFromStory')] y quedarse en [ROOT.Char.Custom('PODGetCoterieName')]."
 POD_coterie_maintenance.20.option.g: "Simplemente quedarse en [ROOT.Char.Custom('PODGetCoterieName')]."

 POD_coterie_maintenance.30.t: "Descontento creciente"
 POD_coterie_maintenance.30.desc: "Es cierto que [potential_rival.GetFirstNameNicknamed] y yo no hemos estado en los mejores términos últimamente.\n\nAnoche [potential_rival.GetSheHe] me confrontó, diciendo que si las cosas no mejoran, va a dejar $POD_player_coterie$."
 POD_coterie_maintenance.30.option.a: "No es demasiado tarde para resolver nuestras diferencias."
 POD_coterie_maintenance.30.option.a.tt: "Si [potential_rival.GetFirstName] sigue teniendo una [opinion|E] de #N [EmptyScope.ScriptValue('coterie_rivalry_opinion')]#! o menos en #V 3 meses#!, dejará $POD_player_coterie$ y se convertirá en tu [rival|E]."
 POD_coterie_maintenance.30.option.b: "¿Quieres irte? Pues vete."