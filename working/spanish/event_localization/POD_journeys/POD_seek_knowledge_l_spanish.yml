 confused_populace_modifier: "Población Confundida"
 confused_populace_modifier_desc: "La población de aquí ha sido confundida por el uso amateur de una disciplina vampírica." 

 POD_mentoring_disciplines.10.t: "Poder de la Mente"
 POD_mentoring_disciplines.10.desc: "La Dominación consiste en usar tu fuerza de voluntad contra otros para obligarlos a hacer tu voluntad. Mientras aprendes, tendrás que empezar a practicar con sujetos reales para probar tu progreso. Los mortales serían una elección fácil y relativamente intrascendente, pero necesitarías dominar a muchos de ellos para aprender algo, ya que su fuerza de voluntad es más débil. O también podrías probar tus nuevos poderes en uno de tus vasallos, aunque quizás no aprecien ser usados como conejillos de indias de poderes tan invasivos."
 POD_mentoring_disciplines.10.a: "¡Conozco a la persona adecuada!"
 POD_mentoring_disciplines.10.b: "Hay muchos mortales para elegir."

 POD_mentoring_disciplines.11.t: "Trucos Mentales"
 POD_mentoring_disciplines.11.desc: "Estoy bastante seguro de que entiendo la Dominación lo suficiente como para usarla ahora, pero mi mentor insiste en lo contrario. Dice que aún necesito ser víctima de la Dominación para comprender realmente sus efectos.\nSoy bastante escéptico sobre esta afirmación, ya que parece una forma encubierta de meterse con mi mente. Podría simplemente rechazar sus demandas y disfrutar de mis nuevos poderes, pero eso despertaría sus sospechas, o su ira."
 POD_mentoring_disciplines.11.a: "Si dices que es seguro..."
 POD_mentoring_disciplines.11.b: "Gracias, pero no."

 POD_mentoring_disciplines.20.t: "Amigos y Enemigos Peludos"
 POD_mentoring_disciplines.20.desc: "Para aprender Animalismo, debes interactuar con animales. Esto no es una noticia innovadora, pero aún tienes que elegir cómo hacerlo. Podrías responder al llamado de la naturaleza y probar tus nuevos poderes en objetivos potencialmente amenazantes. O simplemente podrías inundar tu corte con una multitud de animales domésticos para facilitarte las cosas.\nSin embargo, esta segunda opción es probable que sea controvertida, ya que no todo el mundo disfruta imponiéndose a una horda de gatos y perros antes de llegar al Elíseo."
 POD_mentoring_disciplines.20.a: "¿Serpientes? ¿En serio?"
 POD_mentoring_disciplines.20.b: "Mucho más complacientes que mis cortesanos."

 POD_mentoring_disciplines.21.t: "Lado Salvaje"
 POD_mentoring_disciplines.21.desc: "Tu mentor de Animalismo insiste en que te pongas en contacto adecuadamente con tu bestia interior adoptando tú mismo los adornos de un animal durante un tiempo usando tus nuevos poderes. No me entusiasma especialmente la idea porque, como gobernante de la noche, me atengo a ciertos estándares de etiqueta. La alternativa sería aislarme por un tiempo para concluir mi entrenamiento, lo que al menos es menos probable que me deje completamente expuesto."
 POD_mentoring_disciplines.21.a: "¡No tengo nada que ocultar!"
 POD_mentoring_disciplines.21.b: "Solo necesito un momento a solas."

 court_tutor_mentoring_disc_tt: "Tener un Tutor de Corte con alta aptitud reduce el coste de prestigio de la mentoría."

 POD_mentoring_disciplines.30.t: "Atractivo Misterioso"
 POD_mentoring_disciplines.30.desc: "Aprender Auspex significa que tienes que lidiar con un 'sexto sentido' que antes no habías considerado realmente. Las pequeñas acciones adquieren un significado más profundo, e incluso los fragmentos de conversación pueden revelar una gran perspicacia.\nComo tal, te has ralentizado y meditas más cada una de tus acciones y palabras. Esto, de forma indirecta, te ha hecho parecer un tanto distante para tu corte, algo que quizás quieras rectificar. Pero el misterio tiene su propio atractivo."
 POD_mentoring_disciplines.30.a: "Veo mucho más."
 POD_mentoring_disciplines.30.b: "Necesito concentrarme."

 POD_mentoring_disciplines.31.t: "Viendo Demasiado"
 POD_mentoring_disciplines.31.desc: "Auspex es una disciplina compleja que abre las puertas a una miríada de posibilidades, desde el simple espionaje hasta la exploración de mundos invisibles. Estas maravillosas y aterradoras posibilidades pueden ser una carga para las mentes más fuertes.\nAunque la parte más difícil ya ha pasado, todavía sufres algunos dolores de cabeza y crisis inducidas por 'destellos' repentinos. Afortunadamente, tu mentor sigue ahí y te ayuda a controlar tus nuevos poderes a medida que pasa el tiempo."
 POD_mentoring_disciplines.31.a: "Me alegra que estés a mi lado."

 POD_mentoring_disciplines.40.t: "¡Esquiva!"
 POD_mentoring_disciplines.40.desc: "Celeridad es la disciplina para, bueno, ir rápido y ser rápido. Hay varias formas de entrenar esta habilidad y yo pensaba principalmente en una carrera y otros ejercicios físicos, pero parece que mi mentor tiene otros planes. Ahora me está lanzando cosas con una alegría apenas disimulada mientras me dice que esquive.\nPara mi crédito, al menos estoy evitando algunas."
 POD_mentoring_disciplines.40.a: "¡No tiene gracia!"

 POD_mentoring_disciplines.41.t: "Corre Vampiro, ¡Corre!"
 POD_mentoring_disciplines.41.desc: "Celeridad es un poder estimulante de entrenar la mayoría de las veces, ya que simplemente correr muy rápido por tu ciudad produce una gran sensación de poder. También te deja algo mareado y desorientado por un tiempo, ya que luego tienes que adaptarte de nuevo al lento caminar de la vida normal. Tu mentor te aconseja que te tomes con calma, pero no es tan fácil como parece."
 POD_mentoring_disciplines.41.a: "¡Tengo que ir rápido!"
 POD_mentoring_disciplines.41.b: "¡Tengo que ir más rápido!"

 POD_mentoring_disciplines.50.t: "Acechando"
 POD_mentoring_disciplines.50.desc: "Ofuscación es el poder para ocultarse a uno mismo y a otros de la vista. Es obvio que, para entrenarlo adecuadamente, tienes que ponerlo a prueba contra otros vampiros que realmente intenten verte. Los mortales no sirven porque son demasiado miopes para ver nada de todos modos, así que tendrás que correr algunos riesgos.\nSin embargo, esto probablemente tendrá el efecto no deseado de propagar rumores desagradables en la corte sobre exactamente 'por qué' estás aprendiendo una herramienta tan traicionera..."
 POD_mentoring_disciplines.50.a: "No estoy espiando a todos vosotros, lo prometo."

 POD_mentoring_disciplines.51.t: "Amenazas por Todas Partes"
 POD_mentoring_disciplines.51.desc: "Tu nuevo conocimiento de Ofuscación te permite aprender mucho más sobre tus cortesanos, ya que ahora puedes espiarlos sin ser visto. Lamentablemente, lo que aprendes de ellos es que, en su mayoría, no puedes confiar en nadie, ya que la mayoría están tramando algún pequeño plan mezquino u otro. Te encuentras mirando por encima del hombro incluso más de lo habitual, ahora preocupado de que todos estén aquí para atraparte.\nRealísticamente, probablemente lo estén."
 POD_mentoring_disciplines.51.a: "¡Traidores, por todas partes!"
 POD_mentoring_disciplines.51.b: "Necesito mantener la calma."
 POD_mentoring_disciplines.51.c: "No, son personas de confianza."
 POD_mentoring_disciplines.51.d: "¡Lo sabía!"

 POD_mentoring_disciplines.60.t: "Sacos de Arena"
 POD_mentoring_disciplines.60.desc: "Potencia, como el poder de golpear cosas muy fuerte, podría ser la disciplina más fácil de entrenar. Solo golpea cosas.\nTambién podría ser la más estimulante, ya que soltarse de vez en cuando puede ser una gran ventaja para la mente a menudo frustrada de un gobernante de la noche. Así que golpeas cosas cada vez más grandes a tu gusto, sin preocuparte por la noche siguiente."
 POD_mentoring_disciplines.60.a: "¡No necesitamos esa pared! ¡Golpea!"

 POD_mentoring_disciplines.61.t: "Diplomacia a Golpes"
 POD_mentoring_disciplines.61.desc: "Tu nueva fuerza, gracias a Potencia, te ha dado una perspectiva sesgada sobre cómo se pueden resolver los problemas, que es golpeándolos muy fuerte. Lamentablemente, hay un límite en cuanto a cuánta fuerza bruta puede ser la respuesta a todos tus problemas, y estás empezando a alcanzarlo. Pronto tendrás que volver a la rutina diaria de intrigas, conspiraciones cortesanas y diplomacia aburrida, en lugar de andar como una cuadrilla de demolición."
 POD_mentoring_disciplines.61.a: "¡Solo un poco más!"
 POD_mentoring_disciplines.61.b: "Hora de volver al mundo real."

 POD_mentoring_disciplines.70.t: "Amado por Todos"
 POD_mentoring_disciplines.70.desc: "Presencia es un poder embriagador de aprender. ¿A quién no le gustaría la capacidad de hacer que todos te amen o incluso te adoren abiertamente? Tu mentor pronuncia palabras de precaución, contándote los efectos secundarios después de perder el contacto directo con las víctimas, pero no podría importarte menos. ¡Finalmente, todos tus súbditos muestran la devoción adecuada que deberían haber mostrado hace mucho tiempo!"
 POD_mentoring_disciplines.70.a: "Mi grandeza es reconocida por fin."

 POD_mentoring_disciplines.71.t: "Secuelas del Amor"
 POD_mentoring_disciplines.71.desc: "Ahora has completado tu aprendizaje de la disciplina Presencia, lo que incluye ser más consciente de sus inconvenientes. Aunque la capacidad de ser respetado y amado es ciertamente muy poderosa, no dura mucho después de perder el contacto con la víctima, lo que termina dejando a una persona muy molesta detrás. A nadie le gusta que jueguen con sus sentimientos usando poderes sobrenaturales.\nLas últimas noches, has usado tus nuevos poderes quizás con demasiada frecuencia y te has ganado algunos enemigos nuevos en el proceso. Puede que sea hora de enmendar tu entusiasmo por aprender que se extralimitó en las mentes de los demás."
 POD_mentoring_disciplines.71.a: "¡Solo quería que todos me quisieran!"
 POD_mentoring_disciplines.71.b: "Lo superarán."

 POD_mentoring_disciplines.80.t: "Encontrándote a Ti Mismo"
 POD_mentoring_disciplines.80.desc: "Protean es la capacidad de cambiarte a ti mismo de varias maneras y moldear tu apariencia externa con pocos límites. Aunque poderoso, esto hace que sea una disciplina difícil de aprender, ya que te has acostumbrado bastante a tu forma física. Un inmortal como tú nunca cambia realmente, y poder cambiar repentinamente algunas partes de tu cuerpo te ha afectado emocionalmente más de lo que habrías imaginado."
 POD_mentoring_disciplines.80.a: "¿Qué significa esto realmente?"

 POD_mentoring_disciplines.81.t: "Ventaja Injusta"
 POD_mentoring_disciplines.81.desc: "A medida que dominas la disciplina de Protean, descubres que tiene un gran potencial marcial. De repente, sacar garras de tus manos ciertamente puede cambiar el rumbo de una batalla perdida, y te encuentras confiando en estas tácticas cada vez más. Tu mentor aconseja precaución, ya que esta sensación de superioridad puede ser tu perdición si no puedes usar Protean en una pelea o si tu adversario está preparado para ello.\nPero quizás solo están celosos de que estés aprendiendo tan bien."
 POD_mentoring_disciplines.81.a: "¡Soy genial! ¡Eso es todo!"
 POD_mentoring_disciplines.81.b: "Un sabio consejo."
 
 POD_mentoring_disciplines.90.t: "El Horror Arriba"
 POD_mentoring_disciplines.90.desc: "Vicisitud es uno de los poderes más horripilantes de los Cainitas, principalmente porque sus aplicaciones a menudo resultan en la muerte de los 'sujetos de prueba' participantes. Los mortales son abundantes de todos modos, así que crees que puedes salirte con la tuya experimentando con algunos mientras aprendes estos poderes para obtener algo de experiencia práctica. Por otro lado, un Príncipe sabio sabe que el bienestar de la comunidad mortal en su área puede ser un activo en sí mismo, por lo que asegurarse de no tomar demasiado de ella a la vez también tiene sus méritos."
 POD_mentoring_disciplines.90.a: "Tomaré todo lo que necesito ahora."
 POD_mentoring_disciplines.90.b: "Experimentaré durante un período más largo."

 POD_mentoring_disciplines.91.t: "El Horror Interior"
 POD_mentoring_disciplines.91.desc: "Ahora eres lo suficientemente competente en Vicisitud como para sentirte más cómodo usándola sin la ayuda de tu mentor. Aún así, no puedes quitarte de encima la sensación de que algo anda mal contigo desde que aprendiste este nuevo poder. Es difícil de describir, pero es casi como si alguien más llevara tu propia piel y tratara de controlarte a veces.\nProbablemente sea solo tu imaginación jugando trucos, pero estás lo suficientemente preocupado como para considerar investigar el asunto por ti mismo."
 POD_mentoring_disciplines.91.a: "Nada de qué preocuparse. Seguramente."
 POD_mentoring_disciplines.91.b: "¿Por qué me siento tan... ajeno?"

 POD_mentoring_disciplines.100.t: "Empollando Libros"
 POD_mentoring_disciplines.100.desc: "La Hechicería de Sangre es una disciplina peculiar para aprender para los vampiros, ya que no es 'innata' como todas las demás. Es más bien una práctica muy ritualizada con muchos ingredientes que comprar y recetas que seguir. Esta será una empresa costosa, ya que el ensayo y error es un hecho de la no-muerte cuando se intenta entender una disciplina tan compleja.\nEs hora de leer libros y prepararte lo mejor que puedas para dominar verdaderamente el poder de tu impía sangre."
 POD_mentoring_disciplines.100.a: "Libro 1. Capítulo 1. Página 1..."
 learning_mentoring_tt: "Cuanto mayor sea tu aprendizaje, menos costoso será."
 
 POD_mentoring_disciplines.101.t: "Lecturas Nocturnas"
 POD_mentoring_disciplines.101.desc: "Has comprendido lo suficiente del concepto básico de la Hechicería de Sangre para entender realmente las profundidades de esta disciplina. No hay límites para lo que puede lograr, ya que se encuentran nuevas formas de aprovechar el poder de la sangre en todo el mundo con una velocidad sorprendente. Un ser nunca puede esperar dominar verdaderamente un rango tan amplio de poderes... pero ciertamente no evitará que muchos lo intenten.\nFascinado por estos nuevos descubrimientos, te encuentras cada vez más aislado de tu corte, y tus consejeros temen que esto pueda obstaculizar tu capacidad para gobernar eficientemente."
 POD_mentoring_disciplines.101.a: "De vuelta a lo de siempre, supongo..."
 POD_mentoring_disciplines.101.b: "¡Tanto más por aprender!"

 POD_mentoring_disciplines.110.t: "Solo una Herida Superficial"
 POD_mentoring_disciplines.110.desc: "Fortaleza es la disciplina que permite a los vampiros sostener heridas que normalmente habrían matado fácilmente a los mortales. Para aprender a entenderla adecuadamente, la mejor manera es simplemente recibir golpes fuertes hasta que puedas ignorarlos. Desconfías un poco de las intenciones de tu mentor, pero ya ha empezado a golpearte con una alegría apenas disimulada.\nClaramente, todo se hace para tu beneficio al final."
 POD_mentoring_disciplines.110.a: "¡Puedo soportar más!"

 POD_mentoring_disciplines.111.t: "¿Invencible?"
 POD_mentoring_disciplines.111.desc: "Después de un par de días de entrenamiento intenso, ahora eres lo suficientemente competente en Fortaleza como para tener confianza en tu capacidad para dominarla con el tiempo. Quizás demasiado confiado, en realidad, ya que se sabe que Fortaleza da una sensación (mayormente falsa) de invulnerabilidad a su usuario. Se cuentan muchas historias de usuarios demasiado confiados de Fortaleza que alcanzan sus límites y no tienen tiempo para arrepentirse después. Esto es lo último que tu mentor te advierte, después de todo, el exceso de confianza es un asesino lento e insidioso."
 POD_mentoring_disciplines.111.a: "Debo mantener la humildad."
 POD_mentoring_disciplines.111.b: "¡Inmortalidad verdadera, por fin!"

 POD_mentoring_disciplines.120.t: "Rodeado de Falsedades"
 POD_mentoring_disciplines.120.desc: "Estás entendiendo con bastante facilidad la disciplina de Quimerismo. Hacer pequeñas ilusiones no es un asunto muy difícil, y tu mentor está ayudando a coordinar tu entrenamiento.\nSin embargo, algo te roe la mente. Si entender esto es tan fácil, ¿quién dice que tus enemigos no lo están usando ya extensamente? ¿Qué es real y qué es falso?\nEn las primeras noches después de descubrir este nuevo poder, te ves atrapado en un frenesí de hacerlo todo tú mismo, ya que tus propias observaciones son realmente las únicas en las que puedes confiar."
 POD_mentoring_disciplines.120.a: "¡Solo yo sé la verdad!"

 POD_mentoring_disciplines.121.t: "Verdades e Ilusiones"
 POD_mentoring_disciplines.121.desc: "Aunque tu entrenamiento de Quimerismo va lo suficientemente bien como para que puedas hacerlo por tu cuenta ahora, tu mentor se ha preocupado por tu creciente paranoia sobre el potencial de que tus enemigos usen tales tácticas contra ti. Está tratando de enseñarte los límites de Quimerismo, asegurándose de que entiendas que una duplicidad de tal escala es difícilmente realista.\nEscuchas sus palabras y contemplas reducir la velocidad en tus esfuerzos de microgestión, pero aún no estás completamente convencido."
 POD_mentoring_disciplines.121.a: "Quizás hay méritos en este consejo."
 POD_mentoring_disciplines.121.b: "¡Otra mentira!"

 POD_mentoring_disciplines.130.t: "No Solo en la Oscuridad"
 POD_mentoring_disciplines.130.desc: "Obtenebración, en la superficie, parece una disciplina relativamente sencilla, simplemente usar sombras como herramientas o armas. Sin embargo, tu mentor rápidamente desmonta esta idea y entiendes que en realidad está usando la energía de un reino misterioso llamado el 'Abismo'. Y a veces el abismo contraataca ante tu intrusión.\nTus primeros pasos en este nuevo mundo aterrador son difíciles, ya que está claro que este abismo está poblado por todo tipo de criaturas peligrosas muy descontentas con que te metas en sus hogares. Es como si la oscuridad misma quisiera que perecieras... o que te unieras a ellos."
 POD_mentoring_disciplines.130.a: "¡No le temo a la oscuridad!"
 POD_mentoring_disciplines.130.b: "Necesito una vela..."
 mentoring_slowed_tt: "Tu mentoría progresará más lentamente de lo habitual."

 POD_mentoring_disciplines.131.t: "Abrazando la Oscuridad"
 POD_mentoring_disciplines.131.desc: "Has dado tus primeros pasos en el Abismo y has logrado reunir el valor para usarlo para tus propios fines, completando tus primeras incursiones en la disciplina de Obtenebración. Ahora que estás más familiarizado con él, no puedes negar que este extraño reino de oscuridad de alguna manera te atrae de nuevo, algo que muchos Lasombra saben sentir.\nIncluso ahora que tu entrenamiento está completo, estás ansioso por volver a él y aprender más, a pesar de todos los peligros que acechan allí."
 POD_mentoring_disciplines.131.a: "Después de todo, somos hijos de la oscuridad."
 POD_mentoring_disciplines.131.b: "La verdad es que estoy un poco asustado."

 POD_mentoring_disciplines.140.t: "Naturaleza Oscura"
 POD_mentoring_disciplines.140.desc: "Daimonion es una disciplina muy ligada a lo infernal. Aunque no te pide directamente que hagas un pacto con demonios, es como si estuvieras muy cerca del borde del precipicio. El simple hecho de intentar entenderla ha comenzado a cambiar tu propia naturaleza. Te encuentras volviéndote más insensible, propenso a soltar comentarios sarcásticos o abiertamente crueles más de lo habitual.\nPodrías hacer un esfuerzo consciente para enmendar este cambio o simplemente abrazar a este nuevo tú."
 POD_mentoring_disciplines.140.a: "Soy mejor que esto."
 POD_mentoring_disciplines.140.b: "¡Necios, todos ellos!"

 POD_mentoring_disciplines.141.t: "Pensamientos Oscuros"
 POD_mentoring_disciplines.141.desc: "Has terminado tu entrenamiento temprano de Daimonion y ya quieres más. El poder que insinúa esta disciplina es adictivo y te engatusa para que abraces tu naturaleza más oscura con el fin de desbloquear todos sus secretos. Aceptar tal cambio probablemente conduciría a algunas complicaciones en la forma en que gobiernas tu dominio, pero a veces, la respuesta rápida y fácil es la más atractiva."
 POD_mentoring_disciplines.141.a: "¡Estos necios no me frenarán!"
 POD_mentoring_disciplines.141.b: "Necesito estar solo por un tiempo."

 POD_mentoring_disciplines.150.t: "Atractivo de la Serpiente"
 POD_mentoring_disciplines.150.desc: "Serpentis es la disciplina para tentar a otros con lo prohibido, lo incorrecto, la manzana en el jardín del Edén. Una herramienta poderosa sin duda, aprenderla requiere una profunda instrucción de tu mentor, que siente un placer culpable al mostrarte la fuerza de Serpentis, haciéndote dudar de todo lo que alguna vez consideraste verdadero. Todo parte del proceso, por supuesto, sin ninguna intención indecorosa detrás..."
 POD_mentoring_disciplines.150.a: "Mirando a los ojos de la serpiente..."
 POD_mentoring_disciplines.150.b: "Es tentador..."
 POD_mentoring_disciplines.150.c: "¡Mi fe es fuerte!"

 POD_mentoring_disciplines.151.t: "Serpiente Indulgente"
 POD_mentoring_disciplines.151.desc: "Uno de los principales atractivos de Serpentis como disciplina es la capacidad de cambiar de forma, principalmente hacia el tipo serpentino. Has estado entrenando esta parte lo suficientemente bien últimamente, disfrutando realmente del alivio de tus dificultades noche tras noche mientras te deslizas en forma de serpiente.\nSin embargo, esta no es la forma más prestigiosa de gobernar tu dominio, y tus vasallos podrían empezar pronto a reírse de su extraño gobernante si no detienes este régimen de entrenamiento."
 POD_mentoring_disciplines.151.a: "Deslizándose, deslizándose..."
 POD_mentoring_disciplines.151.b: "Molestando a los cortesanos como siempre."

 POD_mentoring_disciplines.160.t: "La Bestia Interior"
 POD_mentoring_disciplines.160.desc: "Abombwe utiliza la estrecha conexión del vampiro con su propia Bestia (y la de los demás), así como canaliza el poder de la Bestia para diversos propósitos. Esto hace que sea una disciplina agotadora de aprender, ya que la Bestia no es fácil de controlar o intimidar, resistiendo con todas sus fuerzas tus intentos de acorralarla. A pesar de la ayuda de tu mentor, tus primeros intentos son básicamente disparos en la oscuridad."
 POD_mentoring_disciplines.160.a: "¡Sujeta! ¡Sujeta!"

 POD_mentoring_disciplines.161.t: "Ira Hirviente"
 POD_mentoring_disciplines.161.desc: "Has mejorado en el dominio de la disciplina Abombwe, pero ha requerido varias noches de experimentos y pruebas. Esto ha resultado en algunos... incidentes cuando jugaste demasiado con la Bestia de algunos de tus cortesanos. Como resultado, te encuentras sin unos cuantos guardias, lo que ha dejado tu dominio menos seguro de lo habitual. El tiempo resolverá el problema por sí solo, pero podrías estar interesado en acelerar el proceso."
 POD_mentoring_disciplines.161.a: "Unos pocos más o unos pocos menos..."
 POD_mentoring_disciplines.161.b: "Contratar nuevos."

 POD_mentoring_disciplines.170.t: "Viendo Gente Muerta"
 POD_mentoring_disciplines.170.desc: "Nigromancia es la disciplina que intenta comprender, y a veces controlar, la muerte, ya sea física o espiritual. Para aprenderla se requieren algunas prácticas macabras, desde acechar cementerios espeluznantes hasta intentar comunicarse con los espectros de la [UmbraGlossaryLocalized('tierras de las sombras','Inframundo')]. Ya sabes que tus pesadillas en los próximos días se llenarán de formas fantasmales y otras alucinaciones espectrales."
 POD_mentoring_disciplines.170.a: "¿Fantasmas y vampiros?"
 POD_mentoring_disciplines.170.b: "¡No me asustaré!"
 
 POD_mentoring_disciplines.171.t: "Corazón Muerto"
 POD_mentoring_disciplines.171.desc: "Aprender Nigromancia ha sido un asunto agotador estas últimas noches. Te ves más pálido de lo habitual y la compañía de seres (no) vivos te ha puesto de los nervios hasta el punto de que has reaccionado bruscamente con ellos en múltiples ocasiones recientemente. Finalmente captaron el mensaje y te dejaron solo para perfeccionar tu comprensión de los secretos de los muertos, pero te preguntas si has ido demasiado lejos. Se supone que un gobernante de la noche como tú no deambula eternamente solo por su castillo, ¿verdad?"
 POD_mentoring_disciplines.171.a: "Los muertos caminan conmigo, es suficiente."
 POD_mentoring_disciplines.171.b: "Invitaré a todos de vuelta."
 
 POD_mentoring_disciplines.180.t: "Perdido en el Tiempo"
 POD_mentoring_disciplines.180.desc: "Se cree que Temporis es la verdadera disciplina del antiguo clan Brujah antes de que 'devolviera' a Celeridad. Mientras que Celeridad se ocupa únicamente de ser físicamente rápido, Temporis intenta manipular el tiempo mismo hasta extremos aterradores. Tu mentor insta a la precaución y la paciencia, ya que es muy fácil terminar varado en las brumas de la historia, o perder tu propio sentido del tiempo en el proceso si actúas descuidadamente."
 POD_mentoring_disciplines.180.a: "No tengo miedo."
 POD_mentoring_disciplines.180.b: "Lento pero seguro."
 temporis_celerity_tt: "Celeridad y Temporis actúan como dos fuerzas opuestas. Es especialmente difícil aprender una si ya conocías la otra antes, lo que hace que el proceso sea más difícil." 
 
 POD_mentoring_disciplines.181.t: "Justo a Tiempo"
 POD_mentoring_disciplines.181.desc: "Tu última incursión en los misterios de la disciplina Temporis ha sido un éxito, permitiéndote ahora tener la confianza suficiente para llamarte a ti mismo un practicante de este arte. Las pruebas iniciales fueron más duras, sin embargo, y tu mente está confusa sobre lo que sucedió exactamente durante esos eventos. Jugar con el flujo del tiempo es uno de los poderes más desorientadores que un vampiro puede conjurar, después de todo."
 POD_mentoring_disciplines.181.a: "¿Recuerdo una caja azul más grande por dentro?"

 POD_mentoring_disciplines.190.t: "Manicomio"
 POD_mentoring_disciplines.190.desc: "Dementación es la disciplina característica del clan Malkavian y está intrínsecamente ligada a ellos. Algunos incluso piensan que Dementación es la causa de la inestabilidad mental de este clan y puede causarla en cualquiera que intente dominar sus efectos. Cuando la sangre que contiene este extraño poder comienza a entrar en tu cadáver no-muerto, eres muy consciente de la posibilidad de que esto haya sido un terrible error..."
 POD_mentoring_disciplines.190.a: "Rumores infundados."
 POD_mentoring_disciplines.190.b: "Tengamos mucho cuidado..."
 POD_mentoring_disciplines.190.c: "¡Se equivocan, ya estoy loco!"
 
 POD_mentoring_disciplines.191.t: "Entrando y Saliendo"
 POD_mentoring_disciplines.191.desc: "Has dominado el nuevo poder en tu sangre y ahora eres capaz de usar Dementación a tu antojo.\nPero a veces tienes la sensación de que es Dementación la que te usa a ti y no al revés.\nDesde que lo aprendiste, te han plagado visiones y varios otros episodios inestables de frenesí profético. Esto ha afectado tu capacidad para gobernar realmente tu dominio y probablemente necesitarás algo de tiempo antes de controlar completamente estas nuevas habilidades."
 POD_mentoring_disciplines.191.a: "Tantas cosas que compartir..."
 POD_mentoring_disciplines.191.b: "¡No sabes nada!"

 POD_mentoring_disciplines.200.t: "La Voz"
 POD_mentoring_disciplines.200.desc: "Nombrada en honor a la musa griega de la tragedia, Melpómene explora el poder de la voz, sacudiendo el alma misma de los cercanos y permitiendo al vampiro realizar hazañas sónicas de otro modo imposibles.\nEsta peculiaridad hace que Melpómene sea mucho más fácil de trabajar para alguien realmente competente en el canto. Tendrás que buscar entrenadores competentes que puedan ayudarte a dominar tu voz antes de que el potencial de Melpómene pueda ser tuyo."
 POD_mentoring_disciplines.200.a: "No estoy buscando un jurado, sin embargo..."
 diplomacy_mentoring_tt: "Cuanto mayor sea tu diplomacia, menos costoso será."

 POD_mentoring_disciplines.201.t: "El Final"
 POD_mentoring_disciplines.201.desc: "Has estado estudiando los entresijos de Melpómene durante las últimas noches y ha ido bien. Aún así, tu corte se ha enterado de este nuevo pasatiempo tuyo y ahora clama por un recital. Esta sería una buena manera de impresionar a todos, ya que las actuaciones reforzadas por Melpómene son asombrosas, pero probablemente también sería bastante estresante. No esperabas tener que actuar frente a un público cuando comenzaste todo este proceso, la verdad."
 POD_mentoring_disciplines.201.a: "Respiración profunda..."
 POD_mentoring_disciplines.201.b: "No me apetece."
 POD_mentoring_disciplines.201.c: "La próxima vez que alguien pida una canción, les haré cantar a ellos."
 
 POD_mentoring_disciplines.210.t: "Tótem Animal"
 POD_mentoring_disciplines.210.desc: "Espíritu es una Disciplina que permite al usuario interactuar con espíritus animalísticos. En sus niveles más básicos permite al vampiro hablar con los espíritus y convocarlos, pero en niveles superiores se puede canalizar poder de ellos para fortalecerse a sí mismo.\nAprenderla a menudo comienza con un despertar espiritual, notando finalmente a todos los residentes espirituales que viven alrededor del mundo y pudiendo aprender de su perspicacia y experiencia."
 POD_mentoring_disciplines.210.a: "Un despertar espiritual."

 POD_mentoring_disciplines.211.t: "Fuerza Espiritual"
 POD_mentoring_disciplines.211.desc: "Mientras que la práctica temprana de Espíritu se ocupaba de notar y aprender de los espíritus que te rodean, los ejercicios posteriores se centran más en cómo explotar mejor este nuevo conocimiento. Devorando un espíritu animal o invocando a los muertos, el usuario de Espíritu puede obtener grandes beneficios, aunque temporales. Sin embargo, puede ser una experiencia perturbadora después de aprender a encontrar y respetar esos mismos espíritus animales."
 POD_mentoring_disciplines.211.a: "El poder nunca tiene un costo demasiado grande."
 POD_mentoring_disciplines.211.b: "Puedo tomarlo con calma."

 POD_mentoring_disciplines.220.t: "Entrenamiento de Guerrero"
 POD_mentoring_disciplines.220.desc: "En su nivel más básico, Valeren proporciona control sobre el dolor y una mayor habilidad marcial, permitiendo aparentemente a los guerreros aprovechar el poder del cielo para vencer a sus enemigos.\nEspiritualmente, sin embargo, está profundamente asociada con la Casta Guerrera de los Salubri y toma muchos de sus rituales y prácticas de ellos. Como tal, cualquier mentoría de Valeren requiere disciplina y un régimen estricto que puede interferir realmente con tus deberes como gobernante de la noche."
 POD_mentoring_disciplines.220.a: "¡Puedo hacer ambas!"
                            
 POD_mentoring_disciplines.221.t: "¿Guerrero o Gobernante?"
 POD_mentoring_disciplines.221.desc: "Has completado tu entrenamiento temprano de Valeren y puede que sea hora de que regreses a tu rutina nocturna. Sin embargo, tu mentor insiste en que continúes con tu nuevo horario, incluso redoblando la apuesta. Hay algunos méritos en presentar la imagen de un gobernante disciplinado al exterior, sin duda, pero también significaría trabajar aún más de lo que ya lo hacías."
 POD_mentoring_disciplines.221.a: "De vuelta a lo de siempre."
 POD_mentoring_disciplines.221.b: "¡Puedo hacer aún más!"
 
 POD_mentoring_disciplines.230.t: "En la Cacería"
 POD_mentoring_disciplines.230.desc: "Conocida principalmente como una herramienta de asesino en manos de la casta guerrera Banu Haqim, Quietus es el poder sobre la sangre en su forma más pura. En su nivel más simple (lo que estás tratando de aprender ahora), es una herramienta de cazador, que permite transformar tu sangre en veneno o silenciar un área antes de acercarte. Tu mentor te anima a perfeccionar estas nuevas habilidades cazando animales, quizás organizando una cacería a gran escala en el proceso como ejercicio."
 POD_mentoring_disciplines.230.a: "Una idea sólida."
 POD_mentoring_disciplines.230.b: "Eso no sería barato..."

 POD_mentoring_disciplines.231.t: "Gobernante Temido"
 POD_mentoring_disciplines.231.desc: "Has completado los primeros pasos para dominar Quietus, añadiendo una nueva herramienta a tu arsenal. Sin embargo, esta es una herramienta bastante temida, ya que esta disciplina está vinculada a asesinos y otros tratos sombríos en la oscuridad. Como tal, tu corte ha estado susurrando preocupada sobre por qué necesitarías añadir tan terribles poderes a tu repertorio. Es hora de tranquilizarlos... o no."
 POD_mentoring_disciplines.231.a: "Ya veréis... quizás."
 POD_mentoring_disciplines.231.b: "No hay necesidad de alarmar a todos."

 POD_mentoring_disciplines.240.t: "Sueños de Locura"
 POD_mentoring_disciplines.240.desc: "Una colección de poderes atribuidos a las hadas e inclinados hacia la exposición de nuevos conocimientos, Miterceria ha llevado a muchas de sus víctimas a la locura balbuceante, o al menos a la frustración.\nComo tal, tu mentor recomienda precaución al querer aprender demasiado demasiado rápido. ¿Pero acaso tienes tiempo para perder?"

 POD_mentoring_disciplines.241.t: "Atractivo Feérico"
 POD_mentoring_disciplines.241.desc: "Miterceria se nutre profundamente de los poderes de las Hadas (reales o no) y de los mitos que las rodean. Como disciplina muy rara, también es un tema de debate considerable en tu corte ahora que has terminado tu entrenamiento. Algunos observan que pareces más pálido, casi translúcido, mientras que otros discuten que te has convertido en un recluso, quizás arrastrado por los nuevos poderes en tu sangre."
 POD_mentoring_disciplines.241.a: "Ahora veo mucho más."
 POD_mentoring_disciplines.241.b: "¡No necesito sus charlatanerías sin sentido!"
  
 POD_mentoring_disciplines.242.t: "La Magia es Aprender"
 POD_mentoring_disciplines.242.desc: "La Hechicería, conocida por los magos como magia lineal o más despectivamente como magia de seto o brujería de seto, es la forma de magia utilizada por los no magos. A diferencia de la magia verdadera, no es necesario estar Despierto (o Iluminado) para usar la hechicería. Por lo tanto, cualquiera con los rasgos suficientes puede convertirse en hechicero y usar los senderos lineales de la magia de seto. Como resultado, la hechicería es la forma más común de magia en el mundo. En contraste con las habilidades psíquicas, la hechicería no es una habilidad innata y tiene que ser aprendida.\nLentamente, dolorosamente lentamente, aprendida.\nTu maestro te ha enterrado en recomendaciones de libros que tendrás que comprar, aparentemente todos ellos necesarios para progresar en el dominio de este arte arcano. No hay otra opción real que ponerse manos a la obra."

 POD_mentoring_disciplines.243.t: "Aprender es Magia"
 POD_mentoring_disciplines.243.desc: "Has adquirido los libros necesarios para progresar en tu aventura hechicera y estás seguro de que ningún obstáculo real queda en tu camino para dominar los conceptos básicos. ¡El nuevo poder está a tu alcance! ...y muchos libros para leer también.\nHas notado rápidamente que algunos de estos hacen referencia a otros textos más antiguos sobre hechicería. Lo que tienes ahora probablemente sea suficiente para tu aprendizaje, pero podrías ir un paso más allá y adquirirlos también. Podría ser una buena manera de aprender sobre conocimientos antiguos y probablemente olvidados."
 POD_mentoring_disciplines.243.a: "¡Encuentra esos textos!"
 POD_mentoring_disciplines.243.b: "No. Más. Libros."

 POD_mentoring_disciplines.244.t: "La Magia de la Fe"
 POD_mentoring_disciplines.244.desc: "La Teurgia es similar a la Magia de Seto (también conocida como Hechicería), pero las supersticiones y sacrificios que alimentan este [Glossary('Numinum','game_concept_numina_desc')] siguen los modismos de la Iglesia Cristiana. Los teurgistas a menudo invocan el nombre del Arcángel Raziel, 'El Guardián de los Secretos', 'El Ángel de los Misterios', quien, según está escrito, se encuentra cerca del trono de Dios y plasmó todos los secretos del universo en un libro.\nComo práctica altamente codificada, solo se requiere un aprendizaje diligente para dominar sus conceptos básicos. Pronto descubres que los adornos cristianos son bastante fuertes, sin embargo, y dificultan el progreso si no entiendes bien esta religión."
 POD_mentoring_disciplines.244.a: "La Biblia debe tener pistas sobre ello."
 theurgy_mentoring_tt: "Cuanto más pecador seas (para una mentalidad cristiana), más costoso será progresar."

 POD_mentoring_disciplines.245.t: "Evangelio Compartido"
 POD_mentoring_disciplines.245.desc: "Has dominado los conceptos básicos de la Teurgia gracias a tu arduo trabajo y has notado que la Teurgia es en realidad bastante más antigua que el cristianismo. Sus raíces se extienden más atrás en el misticismo judío y las enseñanzas del Cristianismo Esotérico — para elevar la propia naturaleza espiritual, para hablar con el Ser Superior, con el Dios Interior, con el fin de comprender mejor la sabiduría de Dios — para oír, ver y hablar los misterios que el oído carnal, el ojo gelatinoso y la lengua de barro no podían.\nEsto te ha dado una nueva perspectiva sobre la interconexión entre las religiones y los muchos conceptos que tienen en común."
 POD_mentoring_disciplines.245.a: "Lo Divino es multifacético."
 POD_mentoring_disciplines.245.b: "¡Eso no cambia la verdad!"

 POD_mentoring_disciplines.246.t: "Viendo Fantasmas"
 POD_mentoring_disciplines.246.desc: "Un Lamento es el método que una persona utiliza para proyectar su espíritu en los reinos de los muertos. Los Lamentos no están ligados a la personalidad de un personaje tanto como a su estado de ánimo. Aquellos que han tenido múltiples experiencias cercanas a la muerte o un sentido de bravura o propósito tienen más probabilidades de proyectarse que aquellos que no creen en los fantasmas o nunca han rozado la muerte.\nComo está tan estrechamente ligado a los atributos centrales de una persona, es un concepto difícil de enseñar. A menudo hay que hacer muchos intentos, y estos pueden ser experiencias dolorosas por derecho propio."
 POD_mentoring_disciplines.246.a: "Pongámonos a ello..."
 POD_mentoring_disciplines.246.b: "¡Me rindo!"
 lament_mentoring_tt: "Consigues proyectar tu espíritu."
 lament_mentoring_tt2: "Sin suerte. Se te ofrecerá la posibilidad de intentarlo de nuevo pronto."

 POD_mentoring_disciplines.247.t: "Acechando a los Muertos"
 POD_mentoring_disciplines.247.desc: "Has logrado viajar espiritualmente a los reinos de los muertos, convirtiéndote oficialmente en un Lamento. Hay muchas maneras de lograr tal hazaña, desde los que rozan, o aquellos capaces de forzar a su espíritu a salir de su cuerpo mediante la meditación o drogas como el pigmento, hasta los durmientes, o aquellos que están congelados hasta el punto de la muerte, momento en el que son expulsados de sus cuerpos hasta que son reanimados, y todo lo demás.\nSi te esfuerzas un poco más para precisar exactamente tu método preferido de proyección, podría darte una ventaja inicial para progresar en este nuevo talento."
 POD_mentoring_disciplines.247.a: "Más pruebas..."
 POD_mentoring_disciplines.247.b: "Eso fue bastante espeluznante, gracias."
 
 POD_mentoring_disciplines.248.t: "No hay Cuchara"
 POD_mentoring_disciplines.248.desc: "Los psíquicos son personas con la capacidad de percibir fuerzas ocultas a los sentidos mundanos a través de la percepción extrasensorial, que luego pueden usar sus mentes para manipular estos elementos sobrenaturales. Algunos piensan que están manipulando los mismos poderes que los hechiceros, pero dependen de su mente en lugar de elaborados rituales. Los poderes psíquicos tienden a ser poco fiables y volubles, y sus practicantes son rechazados por muchos.\nAlgunas personas simplemente nacen con dones inusuales o talento innato que lleva al descubrimiento de estas habilidades paranormales, como la telepatía, la telequinesis y la clarividencia. El primer paso es, por lo tanto, probar si posees este poder latente o si hay que tomar medidas más complejas."
 POD_mentoring_disciplines.248.a: "Abriendo mi mente..."
 psychic_mentoring_tt: "¡Tienes talento!"
 psychic_mentoring_tt2: "Sin suerte. Hay que considerar otra opción."
 
 POD_mentoring_disciplines.249.t: "Abriendo el Camino de la Mente"
 POD_mentoring_disciplines.249.desc: "Lamentablemente, parece que no tienes talento latente para los poderes psíquicos. Sin embargo, no todo está perdido, ya que hay métodos para despertar tu mente a la fuerza... métodos desagradables y dolorosos. Si sigues este camino, tendrás que soportar varias sesiones de dolorosa invasión mental.\nLa alternativa sería 'conmocionar' tu cerebro para que despierte de un solo golpe rápido. Una solución atractiva y menos complicada, pero hay algunos efectos secundarios que podrían ocurrir después de tal proceso..."
 POD_mentoring_disciplines.249.a: "Lento pero seguro..."
 POD_mentoring_disciplines.249.b: "...gano la carrera ahora!"

 POD_mentoring_disciplines.250.t: "Conocimiento Prohibido"
 POD_mentoring_disciplines.250.desc: "La Demonología es la ciencia de aprender sobre los demonios, desde su origen hasta el alcance de sus poderes y la longitud de sus [Glossary('Nombres Verdaderos','podgloss.truename')]. Como tal, no es técnicamente infernalismo, que es el acto de invocar, vincular o confraternizar de otro modo con demonios. Pero, seamos honestos, la línea entre ambos es muy delgada, y la mayoría de la gente no notará la diferencia.\nPodrías tomar el enfoque lento de comprar libros y artefactos antiguos de todas partes para aprender a tu propio ritmo. O podrías tomar el camino más fácil de simplemente intentar preguntar sobre demonología a la fuente de la misma..."
 POD_mentoring_disciplines.250.a: "Todo se puede encontrar en los libros."
 POD_mentoring_disciplines.250.b: "Solo una pequeña invocación inofensiva..."

 POD_mentoring_disciplines.251.t: "La Horrible Verdad"
 POD_mentoring_disciplines.251.desc: "Tu incursión en la demonología te enseñó muchas cosas sobre los demonios y el origen del mundo. También te abrió los ojos a lo que parecen ser verdades ominosas, como que Dios aparta la mirada de la Tierra, dejándola en un lento descenso hacia la locura y la desesperación. El panorama ante ti es sombrío, para decir lo menos, y desafía la forma en que veías el mundo hasta ahora.\nSe necesitará un corazón de acero para continuar por este camino."
 POD_mentoring_disciplines.251.a: "Meramente rumores... ¿verdad?"
 POD_mentoring_disciplines.251.b: "¡El fin está cerca!" 
 
 POD_mentoring_disciplines.252.t: "Inmóvil como la Piedra"
 POD_mentoring_disciplines.252.desc: "Bardo es una extraña $pod_discipline$. Se basa en la negación del control de la Bestia sobre un vampiro. Enseñada originalmente por la deidad egipcia Osiris a sus seguidores, requiere una profunda meditación personal para siquiera entender su concepto.\nTu maestro no puede ayudarte mucho más allá de darte la idea central y ofrecerte varias formas de alcanzar este estado de paz interior. El resto está en tus manos y, con suerte, tu personalidad no es demasiado hostil a la idea de quedarte sentado en silencio durante horas..."
 POD_mentoring_disciplines.252.a: "Respiración profunda..."

 POD_mentoring_disciplines.253.t: "Fluir como el Agua"
 POD_mentoring_disciplines.253.desc: "Tu meditación ha demostrado ser lo suficientemente exitosa para 'centrar tu espíritu interior' o eso afirma tu maestro. Sin embargo, en los tiempos venideros no siempre tendrás el lujo de encontrar tu enfoque, y por lo tanto debes aprender a practicar Bardo incluso durante eventos más difíciles.\nY por eso ahora estás practicando algunas antiguas artes marciales en la cima de una montaña, un poco inseguro sobre la utilidad real de este ejercicio, pero sin querer enfadar a tu maestro de repente muy estricto que comenta sobre tu forma y cada uno de tus movimientos."
 POD_mentoring_disciplines.253.a: "A todo el mundo le gusta el kung..."

 POD_mentoring_disciplines.254.t: "Hogar y Piedra"
 POD_mentoring_disciplines.254.desc: "Visceratika, en muchos sentidos, es una forma especializada de Protean centrada en la piedra. Desde interactuar con ella hasta volverse tan resistente como ella, todo comienza y termina con algunas rocas sólidas. Tu mentor es bastante crítico con la falta de construcciones de piedra en tu área y te insta a observar cómo se utiliza este importante material para crear las más grandes maravillas arquitectónicas.\nAunque es un concepto desconocido para la mayoría de los vampiros, para comprender verdaderamente Visceratika, primero debes entender el proceso de transformar una humilde roca en el más poderoso de los castillos."
 POD_mentoring_disciplines.254.a: "Siempre quise ser albañil. Probablemente."
 POD_mentoring_disciplines.254.b: "Supongo que es hora de abrir una nueva cantera."

 POD_mentoring_disciplines.255.t: "No Parpadees"
 POD_mentoring_disciplines.255.desc: "Los Gargolias a menudo dominan Visceratika de forma bastante natural, utilizando sus potentes efectos para permanecer perfectamente quietos durante semanas si no meses. Esto no es tan fácil para la mayoría de los otros vampiros y tu mentor ahora quiere juzgar tu capacidad para lograr esta hazaña... lo que suena terriblemente aburrido.\nNotando tu falta de voluntad para comprometerte con esta idea, tu mentor ha amenazado con quitarte la roca que has estado usando hasta ahora para llevar a cabo tus experimentos de Visceratika, que llevas a todas partes contigo. No es la amenaza más horripilante que hayas escuchado, ¡pero te gusta bastante esta roca!"
 POD_mentoring_disciplines.255.a: "Eres una persona horrible, pero has ganado."
 POD_mentoring_disciplines.255.b: "Puedo vivir sin mi roca mascota."

 POD_mentoring_disciplines.256.t: "Sacrificio de Sangre"
 POD_mentoring_disciplines.256.desc: "Llegas y encuentras a tu mentor sentado bajo un árbol frente a un cuenco de aceites.\n\n\"Para encontrar poder y concentración dentro de ti mismo, debes encontrar claridad cuando tu [Glossary('Bestia','game_concept_beast_desc')] esté royendo furiosamente tu mente\", explica [recipient.GetFirstName] mientras [recipient.GetSheHe] te indica que te purgues de sangre."
 POD_mentoring_disciplines.256.a: "Vacíes tus humores por completo en el cuenco."

 POD_mentoring_disciplines.257.t: "Prueba de Fuego"
 POD_mentoring_disciplines.257.desc: "La mirada determinada de [recipient.GetFirstNamePossessiveNoTooltip] nunca te abandona mientras permaneces sentado en silencio, desprovisto de sangre, preguntándote hacia dónde se dirige esta lección.[AddTextIf( PlayerHasBeast, ' El hambre es casi insoportable.' )] Entonces, casi sin pasión, [recipient.GetSheHe] prende fuego al cuenco de aceites.\n\n\"Entrégate al miedo, y la Bestia te #beast controlará#!. Supera este miedo, y la Bestia temerá a #italic ti#!.\"\n\nTu mentor presenta tablas de madera de aspecto resistente, las coloca sobre los cuencos y te indica que las rompas con tus propias manos, mientras las llamas despiadadas las lamen.\n\n\"No manipules esta prueba usando disciplinas. Deja que solo tu voluntad resuene. Enciende los aceites dentro del alma y deja que la llama brille intensamente\"."
 POD_mentoring_disciplines.257.a: "Y golpea con todas tus fuerzas."
 POD_mentoring_disciplines.257.b: "No es un desafío en absoluto."

 POD_mentoring_disciplines.258.t: "Entorno Siniestro"
 POD_mentoring_disciplines.258.desc: "Te acercas al lugar designado por tu mentor a medianoche.\n\nAnte ti hay un breve camino de losas de piedra que conduce a lo que parece un altar adornado con seda, con una gran cuenca ornamentada sobre él llena hasta el borde de sangre.\n\nNo ves a tu mentor, pero una nota frente a la cuenca dice:\n\n#italic Adorna tu rostro con sangre y te mostraré lo que necesitas ver.#!"
 POD_mentoring_disciplines.258.a: "Haces lo que tu mentor te indica."

 POD_mentoring_disciplines.259.t: "Pesadilla Hecha Manifiesta"
 POD_mentoring_disciplines.259.beast.desc: "Por un momento nada parece suceder...\npero lo sientes, tu #beast Bestia#! te insta, más bien, #beast exige#! que bebas del cuenco."
 POD_mentoring_disciplines.259.nobeast.desc: "Por un momento nada parece suceder...\npero lo sientes, tu #beast Bestia#! ha regresado con #beast venganza#!, y te insta, más bien, #beast exige#! que bebas del cuenco."
 # final paragraph says "And thus the moment ends, with the world fading to black." with a transparency gradient
 POD_mentoring_disciplines.259.desc: "\n\nIncapaz de resistirte, te lanzas sobre el cuenco de líquido carmesí.\n\nPara tu horror, la sangre... retrocede ante ti. Se drena del cuenco y se introduce en la tierra.\n\nLamentando el descenso de la sangre hacia el suelo, te encuentras postrado, languideciendo en tus intentos de encontrar siquiera una gota.\n\nEs en este momento cuando sientes el peso aplastante de la fe, el peso de cualquier #beast maldad#!, cualquier #beast pecado#! que hayas podido cometer, que te incapacita por completo.\n\nCualquier poder que puedas haber tenido está completamente ausente mientras sientes una estaca hundirse en tu corazón: un cazador de vampiros se cierne sobre ti en silencio.\n\n[recipient.GetSheHe|U] se cierne con un agarre suelto sobre una antorcha ardiente, y tu bestia se retuerce impotente dentro de ti, intentando huir del fuego.\n\nLa bestia no puede ayudarte.\n\nEl sol comienza a amanecer.\n\nPor un momento sientes confusión, ¿cómo puede ser? Pensabas que quedaban horas para el amanecer.\n\nPor un momento crees ver al cazador sonreír;\n\nPor un momento que se extiende hacia una eternidad agonizante.\n\nLos colmillos de tu mentor se hunden en tu cuello.\n\nY así, el m#color:{0.61,0.6,0.56,0.975} o#!#color:{0.61,0.6,0.56,0.95} m#!#color:{0.61,0.6,0.56,0.925} e#!#color:{0.61,0.6,0.56,0.9} n#!#color:{0.61,0.6,0.56,0.875} t#! #color:{0.61,0.6,0.56,0.85} e#!#color:{0.61,0.6,0.56,0.825} n#!#color:{0.61,0.6,0.56,0.8} d#!#color:{0.61,0.6,0.56,0.775} s#!#color:{0.61,0.6,0.56,0.75} ,#! #color:{0.61,0.6,0.56,0.725} c#!#color:{0.61,0.6,0.56,0.7} o#!#color:{0.61,0.6,0.56,0.675} n#!#color:{0.61,0.6,0.56,0.65} #! #color:{0.61,0.6,0.56,0.625} e#!#color:{0.61,0.6,0.56,0.6} l#!#color:{0.61,0.6,0.56,0.575} #! #color:{0.61,0.6,0.56,0.55} m#!#color:{0.61,0.6,0.56,0.525} u#!#color:{0.61,0.6,0.56,0.5} n#!#color:{0.61,0.6,0.56,0.475} d#!#color:{0.61,0.6,0.56,0.45} o#!#color:{0.61,0.6,0.56,0.425} #! #color:{0.61,0.6,0.56,0.4} d#!#color:{0.61,0.6,0.56,0.