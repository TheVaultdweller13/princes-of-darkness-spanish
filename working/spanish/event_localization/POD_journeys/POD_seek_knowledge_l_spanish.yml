 POD_mentoring_disciplines.0001.option.g: "Mi mente es mi mejor arma"
 POD_mentoring_disciplines.0001.option.h: "Las garras siempre están de moda"
 POD_mentoring_disciplines.0001.option.i: "El arte de esculpir la carne es una perspectiva tentadora"
