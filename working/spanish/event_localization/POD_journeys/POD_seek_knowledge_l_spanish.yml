 POD_mentoring_disciplines.259.a.toast: "Aún aterrorizado, ahora sabes que fue una pesadilla."

 POD_demon_tainted_modifier: "Mancha Infernal"
 POD_demon_tainted_modifier_desc: "Este personaje apesta a lo infernal y a lo impío. Los puros retroceden ante su presencia, los impuros temen la competencia."


 ############# SABERES DEMONÍACOS

 POD_demon_lore_learning_events.1.t: "Aprendiendo un Nuevo Saber de Casa"
 POD_demon_lore_learning_events.1.desc: "Los Saberes son los restos de las habilidades divinas que los demonios poseían como Elohim. El Saber de una Casa Celestial no es menos que los secretos recopilados del universo, evocaciones que abarcan los fundamentos de la realidad y gobiernan las fuerzas que la mantienen en movimiento. Antes de la Caída, cada Casa tenía sus propios conjuntos específicos de Saber que reflejaban sus deberes dentro de la jerarquía angelical. Estas evocaciones eran consideradas el corazón de cada Casa, y eran custodiadas celosamente como una cuestión de pragmatismo, y muchos entre los Caídos intercambiaban fragmentos de su Saber entre sí para obtener cualquier ventaja que pudieran contra sus enemigos más intransigentes."
 POD_demon_lore_learning_events.1.a: "Estoy mucho más cerca de mi poder original."

 learnt_lore_of_herald: "Aprendes el Saber del Heraldo"
 learnt_lore_of_life_bringer: "Aprendes el Saber del Portador de Vida"
 learnt_lore_of_creation: "Aprendes el Saber de la Creación"
 learnt_lore_of_seer: "Aprendes el Saber del Vidente"
 learnt_lore_of_beauty: "Aprendes el Saber de la Belleza"
 learnt_lore_of_living: "Aprendes el Saber del Viviente"
