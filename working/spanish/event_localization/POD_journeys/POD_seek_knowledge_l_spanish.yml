l_spanish:

 POD_seek_knowledge.2.t: "Encuentro con el Mentor"
 POD_seek_knowledge.2.desc.coterie_member: "Resulta que no tuve que buscar mucho.\n\n[recipient.GetFirstNameNicknamed] ya posee el conocimiento que busco, y como miembro de $POD_player_coterie$, [recipient.GetSheHe] está encantado de compartirlo conmigo.\n\nPasamos un tiempo rememorando nuestras aventuras compartidas, luego la conversación deriva hacia asuntos más prácticos."
 POD_seek_knowledge.2.desc: "Tras llegar a [ROOT.Var('current_journey').Var('destination').Province.GetCounty.GetTitle.GetNameNoTier], empiezo a hacer averiguaciones sobre el paradero de mi futuro maestro.\n\n"
 POD_seek_knowledge.2.desc.local_ruler: "Resulta que no es otro que el gobernante del dominio local, [recipient.GetNameNicknamed]."
 POD_seek_knowledge.2.desc.wanderer: "En una posada mugrienta, finalmente conozco a la persona que buscaba: un errante llamado [recipient.GetFirstName]."
 POD_seek_knowledge.2.desc.ghoul: "En una taberna decrépita en las afueras de la ciudad, me encuentro con la persona que buscaba: un [GetTrait('ghoul').GetName(recipient)] independiente llamado [recipient.GetFirstName]. Parece que [recipient.GetSheHe] recientemente se liberó del vínculo de sangre, y ahora está revelando los secretos de su antiguo amo como forma de venganza."
 POD_seek_knowledge.2.desc.gargoyle: "En un callejón oculto en las afueras de la ciudad, me encuentro con la persona que buscaba: un solitario [GetTrait('gargoyle').GetName(recipient)] llamado [recipient.GetFirstName]."
 POD_seek_knowledge.2.desc.fae: "En un parque abandonado en las afueras de la ciudad, me encuentro con la persona que buscaba: un hada misteriosa llamada [recipient.GetFirstName]."
 POD_seek_knowledge.2.desc.kueijin: "En una esquina extrañamente silenciosa de la ciudad, me encuentro con la persona que buscaba: un enigmático [GetTrait('kueijin').GetName(recipient)] llamado [recipient.GetFirstName]."
 POD_seek_knowledge.2.desc.mortal: "En una posada mugrienta, finalmente conozco a la persona que buscaba: un enigmático mortal llamado [recipient.GetFirstName]."
 POD_seek_knowledge.2.desc.2: "\n\nIntercambiamos algunos cumplidos iniciales, luego la conversación deriva hacia asuntos más prácticos."
 POD_seek_knowledge.2.option.a: "Estoy listo para aprender."
 POD_seek_knowledge.2.option.a.tt: "Procederás a aprender esta nueva habilidad."
 POD_seek_knowledge.2.option.b: "Estamos listos para aprender."
 POD_seek_knowledge.2.option.b.tt: "Debido a que viajáis juntos, los otros miembros de $POD_player_coterie$ también aprenderán esta habilidad (si son elegibles)."

 POD_seek_knowledge.100.t: "Clase Terminada"
 POD_seek_knowledge.100.desc: "Tras un largo período de estudio y práctica, mi comprensión finalmente está completa.\n\n"
 POD_seek_knowledge.100.desc.tutor: "No podría haberlo logrado sin mi [GetCourtPositionType('court_tutor_court_position').GetName()], [court_tutor.GetNameNicknamed]."
 POD_seek_knowledge.100.option.a: "Mi arduo trabajo ha dado sus frutos."


 ############# EVENTOS DE MENTORÍA

 POD_disciplines_interaction: "Pedir Mentoría"
 POD_disciplines_interaction_desc: "Puedes pedir a un amigo, amante o alma gemela que te enseñe una $pod_discipline$ que aún no conoces."
 POD_disciplines_interaction_accept: "Si tu mentor tiene algo que enseñarte, se te dará una elección de [Glossary('Disciplinas','game_concept_discipline_desc')] para aprender."
 POD_mentoring_disciplines_custom: "Si tu amigo no posee ninguna $pod_discipline$ que puedas aprender, no puedes hacer nada en este momento"
 POD_mentoring_disciplines.0001.t: "Mentoría"
 POD_mentoring_disciplines.0001.desc: "Si tu futuro mentor conoce una $pod_discipline$ que tú no, puedes pedirle que comparta [recipient.GetHerHis] conocimiento contigo.\nNo es un proceso gratuito, sin embargo; tendrá que compartir [recipient.GetHerHis] sangre contigo, resultando en un vínculo de sangre débil. También es algo degradante pedir ayuda en la política vampírica. Como tal, tu prestigio se verá afectado."
 POD_mentoring_disciplines.0001.option.a: "Dominación. Quiero aprender a controlar a los demás"
 POD_mentoring_disciplines.0001.option.b: "Quiero aprender a controlar animales"
