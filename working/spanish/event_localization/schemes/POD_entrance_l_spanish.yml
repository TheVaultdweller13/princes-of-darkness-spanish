l_spanish:

 POD_entrance.100.t: "Estás siendo encandilado"
 POD_entrance.100.desc: "Te gusta [schemer.GetTitledFirstName]. Te gusta mucho, mucho [schemer.GetHerHim]."
 POD_entrance.100.option.a: "Ejercer mi fuerza de voluntad para resistir el encandilamiento."
 POD_entrance.100.option.b: "Rechazar el encandilamiento."
 POD_entrance.100.option.c: "Aceptar el encandilamiento."
 
 POD_entrance.200.t: "Encandilando a [target.GetFirstNameNoTooltip]"
 POD_entrance.200.desc: "Sientes tu energía mística tocando la mente de [target.GetTitledFirstName]. Se está resistiendo al encandilamiento."
 POD_entrance.200.option.a: "Exaltar la sangre para encandilar[target.GetHerHim]."
 POD_entrance.200.a.tt_fortitude: "[target.GetFirstNameNoTooltip] es expert[target.GetCustom('ES_O')] en la $pod_discipline$ de Fortaleza y es resistente a mis poderes."
 POD_entrance.200.a.tt_willpower: "[target.GetFirstNameNoTooltip] ha ejercido su voluntad para resistir tus poderes."
 POD_entrance.200.a.success.desc: "[target.GetTitledFirstNameNoTooltip] será encandilad[target.GetCustom('ES_O')] para que le gustes"
 POD_entrance.200.a.failure.desc: "[target.GetTitledFirstNameNoTooltip] resistirá tu encandilamiento"
 POD_entrance.200.option.b: "Exaltar la sangre y ejercer mi voluntad. ¡No seré rechazad[GetPlayer.GetCustom('ES_O')]!"
 POD_entrance.200.option.b.tt.beast: "#beast ¡[target.GetSheHe|U] debe amarnos!#!"
 POD_entrance.200.option.c: "Abandonar este empeño, ya no deseo encandilar[target.GetHerHim]."
 POD_entrance.200.option.c.tt: "El encandilamiento fallará."
 
 POD_entrance.300.t: "[target.GetFirstNameNoTooltip] encandilad[target.GetCustom('ES_O')]"
 POD_entrance.300.desc: "Mediante el uso de mi poder místico, [target.GetTitledFirstName] ha sido encandilad[target.GetCustom('ES_O')]."
 POD_entrance.300.option.a: "Por supuesto, me ama. Todos me amarán."
 POD_entrance.300.option.a.tt.beast: "#beast ¡Todos nos contemplarán y desesperarán!#!"

 POD_entrance.400.t: "Has llegado"
 POD_entrance.400.desc: "Te encuentras en la corte de [schemer.GetTitledFirstName]." 
 POD_entrance.400.option.a: "Mi nuevo hogar."
  
 POD_entrance.500.t: "Resistió el encandilamiento"
 POD_entrance.500.desc: "[target.GetTitledFirstName] se ha resistido a mi encandilamiento." 
 POD_entrance.500.option.a: "¡Frustrado!"
 POD_entrance.500.option.a.tt.beast: "#beast ¡Rechazarnos significa la muerte!#!"
 
 POD_entrance.600.t: "Encandilamiento resistido"
 POD_entrance.600.desc: "Ya no sientes el encandilamiento de [schemer.GetTitledFirstName]." 
 POD_entrance.600.option.a: "¡Fuera de mi mente!"
 
 POD_entrance.tt.pc.majesty: "Tu [GetPerk('majesty_perk').GetName(GetPlayer)] aumenta ligeramente tus posibilidades de éxito"
 POD_entrance.tt.pc.presenceadvanced: "Tu maestría en [GetTrait('presenceadvanced').GetName(GetPlayer)] aumenta tus posibilidades de éxito"
 POD_entrance.tt.pc.ironclad_command_perk: "Tu [GetPerk('ironclad_command_perk').GetName(GetPlayer)] aumenta enormemente tus posibilidades de éxito"
 POD_entrance.tt.willpower_spent: "[defender.GetFirstNameNoTooltip] ha gastado fuerza de voluntad para resistir tu ataque mental"
 POD_entrance.tt.unswayable_mind_perk: "[defender.GetFirstNameNoTooltip] tiene una [GetPerk('unswayable_mind_perk').GetName(GetPlayer)], lo que reduce ligeramente tus probabilidades de éxito"
 POD_entrance.tt.fortify_the_inner_facade_perk: "[defender.GetFirstNameNoTooltip] tiene [GetPerk('fortify_the_inner_facade_perk').GetName(GetPlayer)], lo que reduce tus probabilidades de éxito"
