l_spanish:

 POD_mesmerize.100.t: "Estás siendo dominado"
 POD_mesmerize.100.desc: "[schemer.GetTitledFirstName] te está dominando para exigirte un favor."
 POD_mesmerize.100.option.a: "Ejercer mi fuerza de voluntad para resistir la dominación."
 POD_mesmerize.100.option.b: "Rechazar la dominación."
 POD_mesmerize.100.option.c: "Aceptar la dominación."
 
 POD_mesmerize.200.t: "Dominando a [target.GetFirstNameNoTooltip]"
 POD_mesmerize.200.desc: "Mi voluntad ordena a [target.GetTitledFirstName]. ¡Pero [target.GetSheHe] se me resiste!\nTendrás que superar su voluntad si quieres proceder. Los individuos de voluntad fuerte son más difíciles de quebrar y este enfoque intenso de tus poderes mentales podría resultar en una experiencia estresante para ti también."
 POD_mesmerize.200.option.a: "Exaltar la sangre para dominar a [target.GetHerHim]."
 POD_mesmerize.200.a.tt_fortitude: "[target.GetFirstNameNoTooltip] es expert[target.GetCustom('ES_O')] en la $pod_discipline$ de Fortaleza y es resistente a tus poderes."
 POD_mesmerize.200.a.tt_willpower: "[target.GetFirstNameNoTooltip] ha ejercido su voluntad para resistir tus poderes."
 POD_mesmerize.200.a.success.desc: "[target.GetTitledFirstNameNoTooltip] te concederá un favor"
 POD_mesmerize.200.a.failure.desc: "[target.GetTitledFirstNameNoTooltip] resistirá tu dominación y existe la posibilidad de que malogres el intento y no puedas Dominar a [target.GetHerHim] durante 10 años"
 POD_mesmerize.200.option.b: "Exaltar la sangre y ejercer mi voluntad. ¡Yo soy el maestro!"
 POD_mesmerize.200.option.b.tt.beast: "#beast ¡Yo soy TU maestro! #!"
 POD_mesmerize.200.option.c: "Esto es una pérdida de tiempo, ya no deseo dominar a [target.GetHerHim]."
 POD_mesmerize.200.option.c.tt: "La dominación fallará."
 
 POD_mesmerize.300.t: "[target.GetFirstNameNoTooltip] dominad[target.GetCustom('ES_O')]"
 POD_mesmerize.300.desc: "Mediante el uso de mi $pod_discipline$ de Dominación, [target.GetTitledFirstName] seguirá mis órdenes. \n\n #X Para usar tu orden, usa la [character_interaction|E] Comandar marioneta.\nAlgunas órdenes requerirán que un objetivo sea marcado, lo cual puede hacerse como la [character_interaction|E] Marcar objetivo secundario.#!"
 POD_mesmerize.300.desc.short_term: "\n\n Como no tienes la ventaja de Directiva sumergida, solo tienes unos pocos días para usar tu orden."
 POD_mesmerize.300.option.a: "Ahora, ¿qué quiero que haga?"
 POD_mesmerize.300.option.a.tt.beast: "#beast ¡Sangre! ¡Queremos sangre! #!"
 
 POD_mesmerize.400.t: "Una deuda que no puedo rechazar"
 POD_mesmerize.400.desc: "Le debo un favor a [schemer.GetTitledFirstName]." 
 POD_mesmerize.400.option.a: "¿Cómo podré compensárselo?"
  
 POD_mesmerize.500.t: "Resistió la dominación"
 POD_mesmerize.500.desc: "[target.GetTitledFirstName] ha resistido mi dominación." 
 POD_mesmerize.500.botched_mesmerize: "[target.GetSheHe|U] es ahora inmune a futuros intentos de dominación."
 POD_mesmerize.500.option.a: "¡Esto no puede ser!"
 POD_mesmerize.500.option.a.tt.beast: "#beast ¡Golpéalos hasta que obedezcan! #!"
  
 POD_mesmerize.600.t: "Dominación resistida"
 POD_mesmerize.600.desc: "Me he librado de los grilletes mentales de la dominación de [schemer.GetTitledFirstName]." 
 POD_mesmerize.600.option.a: "¡Tengo una voluntad de hierro!"
 
 POD_mesmerize.700_toast_title: "Dominación expirada"
 POD_mesmerize.700_toast_ct: "Debes iniciar una nueva intriga si deseas comandar a [target.GetName]."
  
 POD_mesmerize.tt.pc.dominateadvanced: "Tu maestría en [GetTrait('dominateadvanced').GetName(GetNullCharacter)] aumenta tus posibilidades de éxito"
 POD_mesmerize.tt.pc.will_conquers_perk: "Tus poderes de dominación son tan poderosos que tu [GetPerk('will_conquers_perk').GetName(GetNullCharacter)] aumenta tus probabilidades de éxito significativamente"
 POD_mesmerize.tt.pc.rationalize_perk: "Tu capacidad para [GetPerk('rationalize_perk').GetName(GetNullCharacter)] aumenta ligeramente tus posibilidades de éxito"
 POD_mesmerize_tt_defender_generation_adv: "La [Glossary('Generation','game_concept_vampgeneration_desc')] inferior de [defender.GetFirstNameNoTooltip] le otorga una ventaja"
 POD_mesmerize_tt_attacker_generation_adv: "Tu [Glossary('Generation','game_concept_vampgeneration_desc')] inferior te otorga una ventaja"
