l_spanish:

 POD_tempt_scheme: "Tentar"
 POD_tempt_scheme_desc: "Tienta a tu víctima para que adquiera el Pecado que te caracteriza."
 POD_TEMPT_SUCCESS_DESC: "El objetivo ganará tu rasgo de Pecado personal"
 POD_tempt_scheme_desc_general: "Tienta a tu víctima para que adquiera el Pecado que te caracteriza."
 POD_tempt_scheme_action: "Tentar"
 
 POD_tempt_scheme.0003.t: "Tentación exitosa"
 POD_tempt_scheme.0003.desc: "Te ha costado algunos esfuerzos notables, pero finalmente estás viendo el éxito. Tu objetivo está actuando lentamente de forma diferente a su ser habitual, mostrando cada vez más signos placenteros de entregarse a tu Pecado favorito.\nSi bien esto es en sí mismo una pequeña victoria, te ofrece algunas nuevas y tentadoras posibilidades en el futuro. Después de todo, ahora compartes un interés común con ellos y puedes enseñarles mucho más al respecto..."
 POD_tempt_scheme.0003.a: "El comienzo de un viaje maravilloso..."

 POD_tempt_scheme.0004.t: "Tentación fallida"
 POD_tempt_scheme.0004.desc: "A pesar de tus mejores esfuerzos, no pudiste tentar a tu objetivo hacia tu pecado favorito. Peor aún, ahora desconfían de cualquier 'regalo envenenado' que puedas ofrecerles en el futuro, lo que significa que tendrás que replantear tus planes. Un contratiempo, sin duda, pero aún tienes una eternidad por delante para condenarlos. Al final, serán tuyos."
 POD_tempt_scheme.0004.a: "El Infierno puede esperar un poco más."
 
 can_be_converted_tooltip: "Para poder ser convertido, este personaje necesita primero el rasgo de Pecado correspondiente a tu fe."
 
 POD_corrupt_scheme: "Corromper"
 POD_corrupt_scheme_desc: "Corrompe a tu víctima para que siga tu fe demoníaca."
 POD_CORRUPT_SUCCESS_DESC: "El objetivo se convertirá a tu fe"
 POD_corrupt_scheme_desc_general: "Corrompe a tu víctima para que siga tu fe demoníaca."
 POD_corrupt_scheme_action: "Corromper"
  
 POD_tempt_scheme.0006.t: "Corrupción exitosa"
 POD_tempt_scheme.0006.desc: "Te ha costado algunos esfuerzos notables, pero finalmente estás viendo el éxito. Tu objetivo está ahora plenamente inmerso en la gloria del Pecado y no puede esperar a experimentar más de él, algo que estás encantado de permitir.\nSus nuevas pasiones alimentarán tu poder y asegurarán que sigan siendo sirvientes leales en los tiempos venideros. Un paso más para hacer de este mundo miserable tu juguete."
 POD_tempt_scheme.0006.a: "Una alma fresca para disfrutar"

 POD_tempt_scheme.0007.t: "Corrupción fallida"
 POD_tempt_scheme.0007.desc: "A pesar de tus mejores esfuerzos, no pudiste corromper a tu objetivo para que uniera su suerte a los poderes del Infierno. Peor aún, ahora desconfían de cualquier 'regalo envenenado' que puedas ofrecerles en el futuro, lo que significa que tendrás que replantear tus planes. Un contratiempo, sin duda, pero aún tienes una eternidad por delante para condenarlos. Al final, serán tuyos."
 POD_tempt_scheme.0007.a: "El Infierno puede esperar un poco más."