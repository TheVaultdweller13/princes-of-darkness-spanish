l_spanish:

 POD_bloodbond.100.t: "Vínculos de sangre"
 POD_bloodbond.100.desc: "[schemer.GetTitledFirstName] está intentando vincularte por sangre."
 POD_bloodbond.100.option.a: "Ejercer mi fuerza de voluntad para resistir el vínculo de sangre."
 POD_bloodbond.100.option.b: "Rechazar el vínculo de sangre."
 POD_bloodbond.100.option.c: "Aceptar el vínculo de sangre."
 
 POD_bloodbond.200.t: "Vinculando por sangre a [target.GetFirstNameNoTooltip]"
 POD_bloodbond.200.desc: "La intriga está en marcha para vincular por sangre a [target.GetTitledFirstName], pero se está resistiendo."
 POD_bloodbond.200.tt_unswayable_mind_perk: "[TARGET_CHARACTER.GetShortUINameNoTooltip] tiene una [GetPerk('unswayable_mind_perk').GetName(GetNullCharacter)], lo que reduce tus probabilidades de éxito."
 POD_bloodbond.200.option.a: "[target.GetHerHim] abrumaré, obligándo[target.GetHerHim] a beber mi sangre"
 POD_bloodbond.200.a.tt_willpower: "[target.GetFirstNameNoTooltip] ha ejercido su voluntad para resistirse a ser vinculad[target.GetCustom('ES_O')] por sangre."
 POD_bloodbond.200.a.tt_fortitude: "[target.GetFirstNameNoTooltip] es expert[target.GetCustom('ES_O')] en la $pod_discipline$ de Fortaleza y es resistente a tu manipulación."
 POD_bloodbond.200.a.success.desc: "[target.GetTitledFirstNameNoTooltip] será vinculad[target.GetCustom('ES_O')] por sangre a ti"
 POD_bloodbond.200.a.failure.desc: "[target.GetTitledFirstNameNoTooltip] se resistió a tu intento de vincular[target.GetHerHim] por sangre"
 POD_bloodbond.200.option.b: "Exaltar la sangre y ejercer mi voluntad. ¡No seré rechazad[GetPlayer.GetCustom('ES_O')]!"
 POD_bloodbond.200.option.b.tt.beast: "#beast ¡[target.GetSheHe|U] debe amarnos!#!"
 POD_bloodbond.200.option.c: "Abandonar este empeño, ya no deseo vincular[target.GetHerHim] por sangre."
 POD_bloodbond.200.option.c.tt: "El vínculo de sangre fallará."
 POD_bloodbond.200.option.c.tt.beast: "#beast ¡Deberíamos estar tomando sangre, no dándola!#!"
 
 POD_bloodbond.300.t: "[target.GetFirstNameNoTooltip] vinculad[target.GetCustom('ES_O')] por sangre"
 POD_bloodbond.300.desc: "[target.GetTitledFirstName] ha sido vinculad[target.GetCustom('ES_O')] por sangre a mí."
 POD_bloodbond.300.option.a: "Es como debe ser."
 POD_bloodbond.300.option.a.tt.beast: "#beast Ahora, ¿qué haremos con [target.GetHerHim]?#!"

 POD_bloodbond.400.t: "Has sido vinculad[GetPlayer.GetCustom('ES_O')] por sangre"
 POD_bloodbond.400.desc: "Habiendo bebido la sangre de [schemer.GetTitledFirstName], estás vinculad[GetPlayer.GetCustom('ES_O')] a [schemer.GetHerHim]." 
 POD_bloodbond.400.option.a: "Cumpliré la voluntad de [schemer.GetHerHis]."
 
 POD_bloodbond.500.t: "Vínculo de sangre resistido"
 POD_bloodbond.500.desc: "[target.GetTitledFirstName] se ha resistido a mi intento de vincular[target.GetHerHim] por sangre." 
 POD_bloodbond.500.option.a: "¡Frustrado!"
 POD_bloodbond.500.option.a.tt.beast: "#beast ¡Consigamos más sangre e intentémoslo de nuevo!#!"

 POD_bloodbond.600.t: "Vínculo de sangre resistido"
 POD_bloodbond.600.desc: "[schemer.GetTitledFirstName] ha abandonado su intriga para vincularte por sangre."
 POD_bloodbond.600.option.a: "¡No seré el esclavo de sangre de [schemer.GetHerHis]!"
