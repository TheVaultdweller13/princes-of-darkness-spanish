l_spanish:

 POD_mummy_command_effigy.100.t: "Tus efigies de criaturas regresan"
 POD_mummy_command_effigy.100.desc: "Tus efigies han regresado de su tarea con un cofre lleno de oro."
 POD_mummy_command_effigy.100.option.a: "Beneficio"

 POD_mummy_command_effigy.200.t: "Tus efigies de criaturas regresan"
 POD_mummy_command_effigy.200.desc: "Tus efigies han regresado de su tarea, habiendo difundido tu nombre por todas partes."
 POD_mummy_command_effigy.200.option.a: "El mundo sabrá quién soy."
 
 POD_mummy_command_effigy.300.t: "Tus efigies de criaturas regresan"
 POD_mummy_command_effigy.300.desc: "Tus efigies han regresado de su tarea, habiendo prestado su fuerza a tu causa."
 POD_mummy_command_effigy.300.option.a: "Ellas me servirán."

 POD_mummy_command_effigy.400.t: "Tus efigies de criaturas regresan"
 POD_mummy_command_effigy.400.desc: "Tus efigies han regresado de su tarea, habiendo ayudado a tu familia a fortalecerse."
 POD_mummy_command_effigy.400.option.a: "Mi linaje se fortalece con cada generación."

 POD_mummy_command_effigy.500.t: "Tus efigies de criaturas regresan"
 POD_mummy_command_effigy.500.desc: "Tus efigies de criaturas regresan de observar a [target.GetFirstName]. Compartirán el conocimiento que han aprendido."
 POD_mummy_command_effigy.500.option.a: "El conocimiento es poder"

 POD_mummy_command_effigy.510.desc: "Tus efigies de criaturas regresan de observar a [target.GetFirstName], sin haber aprendido nada útil."
 POD_mummy_command_effigy.510.option.b: "Regresar con [target.GetFirstName] para seguir observando"