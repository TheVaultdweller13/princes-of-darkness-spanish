l_spanish:
 pod1230objectives_kj.1.t: "Destello de comprensión dhármica"
 pod1230objectives_kj.1.desc: "En virtud de lo que son, los $pod_kueijin$ se ven a sí mismos como fundamentalmente impuros. Aun así, sirven a algún propósito bajo el Cielo. Un [Glossary('Dharma','podgloss.dharma')] ayuda a guiarla hacia ese propósito, ayuda a reflejar su ascenso por encima de su estado original. La sabiduría —y el hambre de ella— a menudo llega con la edad, pues durante los primeros años de su no-vida, la $pod_kueijin$ se encuentra enredada en preocupaciones mortales. Resplandeciente en sus nuevos poderes, suele regresar a su antiguo hogar para saldar algunas cuentas y tallar un nuevo trozo de territorio. Después de un tiempo, sin embargo, comprende que los juegos mortales son como mil granos de arroz dispersos: demasiado pequeños para recogerlos y demasiado tediosos para perseguirlos. Una $pod_kueijin$ que sobrevive lo suficiente como para apreciar la inmortalidad acaba queriendo algo más que meros poderes sobrehumanos. La búsqueda por un camino dhármico le lleva a una $pod_kueijin$ muchas vidas mortales; las linternas de esa búsqueda —momentos de perspicacia llamados den— la espolean en la noche.\nLos den son destellos de perspicacia, en los que las cosas de repente se vuelven claras. Tales destellos indican progreso en un viaje dhármico. Aquel verdaderamente destinado a encontrar la iluminación sabe cómo reconocer y actuar sobre estos momentos preciosos (pero fugaces)."
 pod1230objectives_kj.1.a: "Es el momento."
 pod1230objectives_kj.1.b: "Este no es el momento adecuado."
 pod1230objectives_kj.1.b.tt: "#X @icon_warning!Recuerda que #italic ¡cualquier!#! [mental_break|E] hará que caigas a [GetTrait('dharma9').GetName(GetPlayer)]#!"

 pod1230objectives_kj.2.t: "Las [Glossary('Hundred Clouds','podgloss.hundredclouds')]"
 pod1230objectives_kj.2.desc: "Los niveles más altos del [Glossary('Dharma','podgloss.dharma')] son tan invisibles como las gotas de agua en una nube de montaña. Tan indescriptibles como el aroma de la noche. Un $pod_kueijin$ debe existir durante muchas vidas mortales antes de que las verdades sublimes de Las [Glossary('Hundred Clouds','podgloss.hundredclouds')] se vuelvan obvias. Hasta entonces, puede recitar los sutras, decir los koans y comandar los elementos, sin entender verdaderamente qué es lo que hace.\n\"Las [Glossary('Hundred Clouds','podgloss.hundredclouds')]\" es un término metafórico para la paz definitiva, el estado trascendente en el que incluso los deberes del Cielo se dejan de lado. Las Nubes no son poder, aunque los $pod_kueijin$ menores puedan verlas así; no son ilusiones, aunque puedan parecérselo a individuos que no pueden entenderlas. Al unirse a Las [Glossary('Hundred Clouds','podgloss.hundredclouds')] (que los sabios entienden como un símbolo, no como un grupo), un $pod_kueijin$ alcanza el umbral de la divinidad, pero espera para guiar a otros hacia esa puerta.\nComo las nieblas que las forman, Las [Glossary('Hundred Clouds','podgloss.hundredclouds')] son intangibles. Ningún sutra puede contener su esencia, y ninguna lección puede impartir sus verdades. Se ha dicho que un $pod_kueijin$ que alcanza tal estado ya no es un vampiro —o que se ha convertido en el vampiro definitivo. Quizás sea ambas cosas. Los dioses no hablan.\nY las laderas del Monte Meru son muy empinadas."
 pod1230objectives_kj.2.a: "Es hora de volver a unirse a la perfección."

 pod1230objectives_kj.3.t: "Un paso atrás"
 pod1230objectives_kj.3.desc: "A veces, un $pod_kueijin$ —especialmente uno joven— actúa de forma tan egoísta que la perspicacia se atenúa. El Demonio se alimenta de tales errores y los fomenta siempre que es posible. Al actuar como un mortal mezquino, la $pod_kueijin$ puede realmente costarse a sí misma la iluminación. Si no puede elevarse por encima de las preocupaciones triviales, razonan los sabios, ¡una $pod_kueijin$ merece cocerse en ellas por toda la eternidad!\nSin embargo, nadie es perfecto. Incluso los ancestros más grandes tienen sus momentos de debilidad y pueden perder de vista sus papeles bajo el Cielo. La única derrota verdadera ocurre cuando la $pod_kueijin$ que tropieza no considera que el viaje es largo y que tiene la inmortalidad por delante para intentarlo de nuevo."
 pod1230objectives_kj.3.a: "Aprender y crecer de este fracaso."
 
 pod1230objectives_kj.4.t: "Girando hacia el final"
 pod1230objectives_kj.4.desc: "El Ciclo no puede evitarse.\n\nAunque muchos esperaban que sus acciones detuvieran el giro inexorable hacia la Quinta Edad, no fue así. Ya fuera por el colapso de las Cortes, el ascenso de los [Glossary('Anda','podgloss.anda')] y los [akuma|E] o incluso algo completamente ajeno, nadie puede decirlo con seguridad. Pero todos pueden sentirlo. Esta es la última Edad antes de que el [Glossary('Demon Emperor','podgloss.demonemperor')] tome su trono como el maestro de la Creación.\n\nUn aire de desesperación y melancolía inunda a los seres sobrenaturales del Reino Medio mientras contemplan el alcance de sus fracasos. Aun así, hay muchos que se niegan a rendirse. Hay nuevas organizaciones políticas que construir, nuevos poderes que descubrir, nueva iluminación que encontrar.\n\nLa Quinta Edad está comenzando y será una de un lento desgaste hacia el final. O quizás el improbable triunfo de una esperanza parpadeante."
 pod1230objectives_kj.4.a: "Ha comenzado." 
 wheel_ages_lose_dharma_tt: "Todos los usuarios de [Glossary('Dharma','podgloss.dharma')], excepto los [akuma|E], tendrán más dificultades para avanzar en su Dharma durante 50 años."
 wheel_ages_lose_godbodies_modifier_tt: "Los Cuerpos Divinos, restos del poder ejercido por los $pod_kueijin$ de antaño, se han perdido para siempre."
 wheel_ages_akuma_buff_modifier_tt: "Los [akuma|E] se ven envalentonados por el giro de la rueda. Obtienen una bonificación poderosa y serán más agresivos durante 50 años."
 wheel_ages_political_instability_tt: "Todos los gobernantes con tierras del Reino Medio sufrirán inestabilidad política, excepto los [akuma|E]."
 
 political_instability_modifier: "Inestabilidad política"