l_spanish:

 POD_masquerade_enforcement.001.t: "Imposición de la Mascarada"
 POD_masquerade_enforcement.001.desc: "El mandamiento más importante de Caín, al menos para cualquier Vástago cuerdo, es la [the_masquerade|E]. Esta regla simple es el corazón de la sociedad vampírica y proclama que los mortales nunca deben saber de vuestra existencia.\n[target.GetFirstName] pone en peligro la existencia de toda vuestra raza al no seguir la [the_masquerade|E]. Es hora de solucionar este problema."
 POD_masquerade_enforcement.001.option.a: "¡Te ordeno que obedezcas!"
 POD_masquerade_enforcement.001.option.a.tt: "Usar Dominación para imponer la mascarada a [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.a.desc: "Un choque de voluntades"
 POD_masquerade_enforcement.001.option.a.success: "Dominas con éxito a [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.a.tt.enforcer_wins: "Le obligas a obedecer"
 POD_masquerade_enforcement.001.option.a.failure: "No logras dominar a [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.a.tt.enforcer_lost: "[target.GetSheHe|U] se resiste a tu orden"
 POD_masquerade_enforcement.001.option.b: "Oh, [target.GetFirstName], ¿realmente quieres desobedecerme?"
 POD_masquerade_enforcement.001.option.b.tt: "Usar Presencia para imponer la mascarada a [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.b.desc: "Un duelo de encantos"
 POD_masquerade_enforcement.001.option.b.success: "Usas con éxito Presencia sobre [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.b.tt.enforcer_wins: "Usando tu $pod_discipline$ de Presencia haces que [target.GetHerHim] te obedezca"
 POD_masquerade_enforcement.001.option.b.failure: "No logras usar Presencia sobre [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.b.tt.enforcer_lost: "[target.GetSheHe|U] se resiste a tu encanto"
 POD_masquerade_enforcement.001.option.c: "Veamos cómo puedo obligarte a obedecer..."
 POD_masquerade_enforcement.001.option.c.tt: "Usa tu habilidad de intriga para imponer la mascarada a [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.c.desc: "Un duelo de ingenio"
 POD_masquerade_enforcement.001.option.c.success: "Usas con éxito maquinaciones sobre [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.c.tt.enforcer_wins: "Usando tu ingenio haces que [target.GetHerHim] te obedezca"
 POD_masquerade_enforcement.001.option.c.failure: "No logras manipular a [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.c.tt.enforcer_lost: "[target.GetSheHe|U] se resiste a tus maquinaciones"
 POD_masquerade_enforcement.001.option.d: "Un soborno, ¿qué mejor incentivo podría haber?"
 POD_masquerade_enforcement.001.option.d.tt: "Usa oro e influencia para imponer la mascarada a [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.d.desc: "Un duelo de palabras y oro"
 POD_masquerade_enforcement.001.option.d.success: "Sobornas con éxito a [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.d.tt.enforcer_wins: "Usando tu dinero e influencia haces que [target.GetHerHim] te obedezca"
 POD_masquerade_enforcement.001.option.d.failure: "No logras sobornar a [target.GetFirstName]"
 POD_masquerade_enforcement.001.option.d.tt.enforcer_lost: "[target.GetSheHe|U] rechaza tu soborno"
 POD_masquerade_enforcement.001.option.e: "Voy a dejar pasar esta... por un favor"
 POD_masquerade_enforcement.001.option.e.tt: "Podrías obtener un favor de [target.GetFirstName]"
 
 POD_masquerade_enforcement.002.t: "Imposición de la Mascarada exitosa"
 POD_masquerade_enforcement.002.desc.dominate: "Con tu poder para controlar mentes inferiores, has obligado con éxito a [target.GetFirstName] a obedecerte y a comportarse con más cuidado con los mortales; debería estar agradecid[target.GetCustom('ES_O')]."
 POD_masquerade_enforcement.002.desc.presence: "[target.GetFirstName] claramente no puede resistirse a tu encanto sobrenatural, [target.GetSheHe] quiere mantener la mascarada por su cuenta, siguiendo tu consejo... al menos eso es lo que cree."
 POD_masquerade_enforcement.002.desc.intrigue: "Unas pocas palabras aquí, una indirecta sabiamente colocada allá, y ahora [target.GetFirstName] mantendrá la mascarada con suficiente empeño como para complacerte. Las maquinaciones pueden hacer que tanto el ganado como los vástagos hagan lo que quieras incluso sin invocar los poderes de la sangre de Caín."
 POD_masquerade_enforcement.002.desc.bribe: "Oro, algo que todo vástago desea tener, al igual que sus 'hermanos' mortales. Usando tu oro e influencia has hecho que [target.GetFirstName] mantenga la mascarada lo suficientemente bien como para no poner en peligro el mundo de los vástagos, al menos por ahora."
 POD_masquerade_enforcement.002.option.a: "Trabajo bien hecho"
 POD_masquerade_enforcement.002.option.a.tt: "La exposición de la mascarada de [target.GetFirstName] disminuirá"
 
 POD_masquerade_enforcement.003.t: "Imposición de la Mascarada fallida"
 POD_masquerade_enforcement.003.desc.dominate: "[target.GetFirstName] logra resistir tus poderes de control mental; tal vez su voluntad sea demasiado fuerte, o tal vez simplemente te volviste descuidado. No importa realmente, lo que importa es el hecho de que has fallado."
 POD_masquerade_enforcement.003.desc.presence: "Pensaste que nadie podría resistirse a tu encanto antinatural, pero parece que [target.GetFirstName] de hecho lo hizo. Has fallado, pero tal vez puedas vengarte... después de un tiempo."
 POD_masquerade_enforcement.003.desc.intrigue: "[target.GetFirstName] logró ver a través de tus tramas; no lograste nada al intentar que siguiera tu voluntad."
 POD_masquerade_enforcement.003.desc.bribe: "Oro, pensaste que el oro gobernaba tanto al ganado como a los vástagos por igual. Pero tal vez te equivocaste, [target.GetFirstName] se ha resistido a tu oro e incluso tu influencia no ha ayudado. Ahora has perdido tu oro, y tu objetivo sigue amenazando la [the_masquerade|E]."
 POD_masquerade_enforcement.003.option.a: "Esto no es nada más que un simple contratiempo"