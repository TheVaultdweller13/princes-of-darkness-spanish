l_spanish:

 POD_education_events.1.t: "Una Educación"
 POD_education_events.1.desc: "Tu nuevo vástago ha dado [victim.GetHerHis] primeros pasos tentativos en la noche. Ahora que [victim.GetSheHe] tiene la suficiente experiencia para entender cómo alimentarse, pronto será el momento de comenzar una educación formal, que será muy importante para [victim.GetHerHis] futuro, pero también para tu relación. ¿Cuál será tu enfoque?"
 POD_education_events.1.option.a: "Enseñar a [victim.GetFirstName] [victim.GetHerHis] lugar"
 POD_education_events.1.option.b: "Mantener a [victim.GetHerHim] cerca, pero con algunas libertades"
 POD_education_events.1.option.c: "[victim.GetFirstName] lo descubrirá por [victim.GetHerHis] cuenta"
 POD_education_events.1.option.obedience: "Esta educación puede producir vástagos obedientes, aunque sin inspiración"
 POD_education_events.1.option.lenient: "Una educación equilibrada"
 POD_education_events.1.option.free: "Con esta educación, es más probable que [victim.GetFirstName] resulte bueno, pero también más de espíritu libre"
 POD_education_events.1.option.d: "Aplicar tus magistrales habilidades de enseñanza"
 POD_education_events.1.option.durga: "Como Durga Syn, puedes asegurarte de que tu vástago llegue a ser grande en [victim.GetHerHis] primeros pasos con esta opción única" 
 POD_education_events.2.t: "Una Educación: El Palo"
 POD_education_events.2.desc: "Los jóvenes de hoy en día... Apenas has empezado a enseñar al necio cuando ya oyes quejas sobre la forma 'dura' e 'injusta' en que haces las cosas. ¡Como si [victim.GetSheHe] pudiera aprender de otra manera!\nDe todos modos, puedes reconocer los signos de que tu vástago está a punto de romperse bajo tu presión si no cedes. Podrías, obviamente, cambiar tu enfoque, pero 'cambiar' no es algo que los vampiros hagan fácilmente."
 POD_education_events.2.option.a: "Los viejos métodos funcionan mejor"
 POD_education_events.2.option.b: "Cederé, por ahora"
 POD_education_events.3.t: "Una Educación: Lazos Humanos"
 POD_education_events.3.desc: "Tu vástago todavía tiene lazos humanos, amigos, familia y demás. Como para la mayoría de los jóvenes vampiros, es muy difícil para [victim.GetHerHim] dejarlos ir. Obviamente, tú sabes más, y estos sentimientos es mejor mantenerlos ocultos, ya que [the_masquerade|E] está en peligro por acciones imprudentes cerca de los mortales. Y a menudo se cometen actos imprudentes con los seres queridos.\n¿Quizás es hora de que tu vástago aprenda a soltar el pasado?"
 POD_education_events.3.option.a: "Cubriré a [victim.GetFirstName]. Deja que el joven tenga [victim.GetHerHis] sueños"
 POD_education_events.3.option.b: "Vástago, debemos hablar..."
 POD_education_events.4.t: "Una Educación: ¡Libertad!"
 POD_education_events.4.desc: "Últimamente, no has podido ocuparte mucho de tu vástago. Esperabas que esta nueva libertad resultara en algunas ideas interesantes que [victim.GetFirstName] pudiera descubrir por [victim.GetHerHis] cuenta, pero... no del todo.\nTodavía resentido contigo por haber sido convertido en vampiro, este rebelde neonato ha comenzado a dudar públicamente de tu autoridad y a no responder a tus raras convocatorias. Esto podría escalar rápidamente si no detienes este comportamiento ahora."
 POD_education_events.4.option.a: "Vástago, debemos hablar..."
 POD_education_events.4.option.b: "Pasará, probablemente"
 POD_education_events.100.t: "Una Educación: Asuntos de Fe"
 POD_education_events.100.desc: "Hasta ahora, tu vástago ha seguido tu fe principalmente porque tú lo decías. Obviamente, sin embargo, [victim.GetSheHe] está lejos de entender el funcionamiento interno de la Bestia y cómo lidiar con ella. Tendrás que tomarte un tiempo para comenzar esta parte de la enseñanza, o contratar a algunos eruditos practicantes del Sendero para ayudar a tu progenie."
 POD_education_events.100.option.a: "Lo primero que hay que saber..."
 POD_education_events.100.option.b: "Escucha bien a tus maestros. No fueron baratos."
 POD_education_events.100.option.c: "Puedo contarte mucho más sobre nuestro Sendero"
 POD_education_events.100.dionysius: "Como Dionisio, puedes usar esta opción para asegurarte de que tu vástago permanezca en tu sendero y sea bien enseñado sobre él"
 POD_education_events.100.option.d: "Escucha las palabras del Señor"
 POD_education_events.100.ahmed: "Como Ahmed, puedes usar esta opción para asegurarte de que tu vástago siga tu religión. Estará disponible solo si permaneces en la Vía Christi."
 POD_education_events.100.option.e: "Es hora del Segundo Abrazo."
 POD_education_events.100.ashirra: "Como miembro de los [Glossary('Ashirra','game_concept_ashirra_desc')] puedes usar esta opción para eliminar un pecado o fortalecer la fe de tu vástago."
 POD_education_events.101.t: "Una Educación: Tentado por la Humanidad"
 POD_education_events.101.desc: "No es una gran sorpresa que, a pesar de tus enseñanzas, tu vástago haya sido tentado por la Vía Humanitatis. Es, después de todo, el sendero más fácil de seguir para un neonato, e intenta seguir de cerca los pasos de los mortales.\nPlaneas montar un gran espectáculo de fe, sin interferir con la humanidad durante los próximos meses, como una prueba para tu vástago de la verdad en el asunto. O podrías simplemente dejarlo pasar."
 POD_education_events.101.option.a: "Estamos castigados durante los próximos meses"
 POD_education_events.101.option.b: "Los jóvenes serán jóvenes"
 POD_education_events.102.t: "Una Educación: Tentado por la Rebelión"
 POD_education_events.102.desc: "Informes preocupantes, ya que tus espías han rastreado la reciente desaparición de tu vástago hasta un grupo de rebeldes en los confines de tu reino. Estos llamados 'Furores' son una plaga para cualquier vampiro que se precie, queriendo abolir las finas tradiciones de la sangre en un vano intento de 'libertad'.\n¡Tu vástago debe aprender rápidamente el error de [victim.GetHerHis] caminos, o [victim.GetSheHe] podría incluso empezar a creer en estas idioteces!"
 POD_education_events.102.option.a: "¡Ve a tu cámara y no la abandones hasta que yo lo diga!"
 POD_education_events.102.option.b: "Pasará, como todo pasa"
 POD_education_events.300.t: "Una Educación: El Final"
 POD_education_events.300.desc: "Has hecho lo que has podido. Tu vástago ha aprendido las formas de tu condición, los métodos para controlar a la Bestia, e incluso cómo acercarse a los clanes y sus sutilezas. Quizás sea suficiente. O quizás has creado el enemigo más peligroso que jamás enfrentarás.\nEl tiempo lo dirá, como siempre hace."
 POD_education_events.300.option.a: "Ya no eres un polluelo indefenso. Pero sigues siendo mi vástago."
 POD_education_events.5.t: "Una Educación: Vástago Tranquilo"
 POD_education_events.5.desc: "Hasta ahora, tu vástago ha aceptado bastante bien [victim.GetHerHis] nueva condición. [victim.GetFirstName] no arma un escándalo, [victim.GetSheHe] obedece tus órdenes y es, en general, un estudiante diligente.\nPuede que no dure, pero ya es mejor que la mayoría de los vástagos. Así que lo disfrutas mientras puedes."
 POD_education_events.5.option.a: "Estoy contento contigo, vástago"
 POD_education_events.5.option.b: "Darás una buena impresión en mi corte"
 POD_education_events.6.t: "Una Educación: Vástago Diplomático"
 POD_education_events.6.desc: "Desde [victim.GetHerHis] introducción en la noche, [victim.GetFirstName] ha mostrado un gran interés en la etiqueta de la corte. Siempre tratando de aprender más sobre los clanes y las diversas políticas de tu raza, [victim.GetSheHe] ya es un activo valioso en tu arsenal diplomático.\nSabes que los polluelos son volubles, sin embargo, y este interés podría no durar. Como tal, estás considerando aprovechar esto lo antes posible."
 POD_education_events.6.option.a: "Lo estás haciendo bien hasta ahora, vástago"
 POD_education_events.6.option.b: "Acompañarás a mis diplomáticos durante las próximas semanas"
 POD_education_events.7.t: "Una Educación: Vástago Obediente"
 POD_education_events.7.desc: "Has vuelto a demostrar tus habilidades superiores con este vástago en particular. La envidia de todo [Glossary('Sire','game_concept_Sire_desc')] en ciernes, tu progenie ayuda obedientemente en todo lo que [victim.GetSheHe] puede, al mismo tiempo que da gracias al gran patrón que trajo [victim.GetHerHim] a la noche.\nPodrías concentrar tus próximos esfuerzos en convertir [victim.GetHerHim] en un aliado útil a largo plazo, o simplemente en un asistente confiable por ahora."
 POD_education_events.7.option.a: "Hablemos del futuro, vástago"
 POD_education_events.7.option.b: "Vuelve al trabajo"
 POD_education_events.8.t: "Una Educación: Vástago Animoso"
 POD_education_events.8.desc: "Tu nuevo vástago se ha adaptado a la noche como por arte de magia. Con una curiosidad ávida, [victim.GetSheHe] ha aprendido rápidamente por [victim.GetHerHis] cuenta el conocimiento básico necesario para sobrevivir en el mundo $pod_cainite$. Lo aprecias, y también te alivia que esto no parezca haberle dado [victim.GetHerHim] ideas de independencia... todavía.\nEl siguiente paso es saber si dejarás que [victim.GetHerHim] continúe de esta manera, o intentarás trabajar más de cerca con [victim.GetHerHim] para tu ventaja."
 POD_education_events.8.option.a: "¡Ah, ser joven de nuevo!"
 POD_education_events.8.option.b: "Trabajemos juntos, vástago"
 POD_education_events.9.t: "Una Educación: Vástago Torpe"
 POD_education_events.9.desc: "Tu vástago lo está haciendo bastante bien hasta ahora, excepto en un aspecto: la etiqueta de la corte. Por alguna razón, [victim.GetSheHe] no puede entender bien el protocolo adecuado que se debe observar en la corte. ¡No es tan difícil! Si quieres salvar sus habilidades diplomáticas, tendrás que enseñarle política de corte con el ejemplo. Lo cual no es lo más glorioso de hacer."
 POD_education_events.9.option.a: "Quédate aquí y mira. Y no digas nada."
 POD_education_events.9.option.b: "...Bueno, este tendrá otro uso, espero"
 POD_education_events.103.t: "Una Educación: Tentado por el Oro"
 POD_education_events.103.desc: "Tu nuevo vástago ha demostrado ser bastante excéntrico en [victim.GetHerHis] adaptación al vampirismo. [victim.GetSheHe|U] piensa que [victim.GetHerHis] nueva condición se usa mejor para... ganar dinero. [victim.GetSheHe|U] habla todo el día de cómo la inmortalidad significa inversiones fáciles, nuevas oportunidades y esas tonterías.\nMientras suspiras, te consuelas pensando que es al menos un pasatiempo mejor que intentar asesinarte. Pero quizás aún quieras sacar a [victim.GetHerHim] de esta 'fase'."
 POD_education_events.103.option.a: "Aquí está tu maldito oro. Pásalo bien."
 POD_education_events.103.option.b: "...¿Qué demonios se les ocurrirá a estos malditos polluelos después?"
 POD_education_events.104.t: "Una Educación: Vástago Fiel"
 POD_education_events.104.desc: "Tu vástago ha adoptado fácilmente tus propios principios como [victim.GetHerHis] fe. Estás complacido con el progreso mostrado hasta ahora y no esperas nada más que una mejora continua. Como maestro exitoso, también has alcanzado una comprensión más profunda gracias a esta experiencia compartida."
 POD_education_events.104.option.a: "Como debe ser"
 POD_education_events.105.t: "Una Educación: Tentado por el Hedonismo"
 POD_education_events.105.desc: "Tu vástago ha aceptado bien [victim.GetHerHis] nueva condición. Quizás demasiado bien... [victim.GetFirstName] pasa [victim.GetHerHis] tiempo de fiesta con mortales, o incluso con otros vampiros, de una manera bastante depravada.\nObviamente, preferirías que [victim.GetHerHim] hiciera cosas útiles con [victim.GetHerHis] inmortalidad, pero convencer a [victim.GetHerHim] podría ser una tarea ardua en este punto."
 POD_education_events.105.option.a: "Suelta a ese mortal, vástago, tenemos que hablar"
 POD_education_events.105.option.b: "Ya ni me importa en este punto..."
 POD_education_events.10.t: "Una Educación: Vástago Mayordomo"
 POD_education_events.10.desc: "[victim.GetFirstName] ha sido emprendedor desde [victim.GetHerHis] $pod_Embrace$, [victim.GetSheHe] ha esbozado varios proyectos para añadir regiones periféricas a tu influencia, y nuevas personas a sobornar para asegurarse de que permanezca oculto.\nEstás considerando empujar al ansioso neonato más en esta dirección, o usar su visión en tales asuntos ahora mismo."
 POD_education_events.10.option.a: "Tienes un talento aquí, vástago"
 POD_education_events.10.option.b: "Interesante, cuéntame más sobre tus planes"
 POD_education_events.11.t: "Una Educación: Vástago Despistado"
 POD_education_events.11.desc: "Tu progenie tiene dificultades para entender que, como vampiro, las reglas son diferentes a las de la vida mortal. [victim.GetHerHis|U] hábitos como ser vivo están obstaculizando a [victim.GetHerHim], y administrar la red de informantes y agentes parece estar muy por encima de su comprensión en este momento.\nPodrías organizar una 'misión de práctica' para enseñarle los entresijos, o simplemente rendirte en esta parte del proceso de entrenamiento."
 POD_education_events.11.option.a: "Sígueme y observa, vástago"
 POD_education_events.11.option.b: "Los libros de registros no están a tu alcance"
 POD_education_events.106.t: "Una Educación: Tentado por la Corona"
 POD_education_events.106.desc: "Tu nueva progenie está fascinada por la estructura de poder de los vampiros, y [victim.GetSheHe] quiere saberlo todo sobre quién gobierna qué, y cómo lograste tu posición actual como gobernante de la noche.\nAunque es halagador, esto está acercando rápidamente a [victim.GetHerHim] a la Vía Regalis, algo de lo que quizás no estés de acuerdo."
 POD_education_events.106.option.a: "Centrémonos en lo espiritual por un tiempo, vástago"
 POD_education_events.106.option.b: "¡Pues sí, puedo hablar de mí mismo!"
 POD_education_events.12.t: "Una Educación: Vástago Conspirador"
 POD_education_events.12.desc: "Tu nuevo vástago ama el ambiente de capa y daga de la política vampírica. [victim.GetSheHe|U] ya ha burlado a otros neonatos, y ha mostrado un serio talento para la intriga. Podrías empujar a [victim.GetHerHim] más hacia el perfeccionamiento de estas habilidades por [victim.GetHerHis] cuenta, o podrías usar su ayuda para algunos planes apremiantes que estás planeando actualmente..."
 POD_education_events.12.option.a: "Lo estás haciendo muy bien, vástago. Solo ten cuidado de no hacerlo demasiado bien..."
 POD_education_events.12.option.b: "¿Qué opinas de estos planes?"
 POD_education_events.13.t: "Una Educación: Vástago Superado"
 POD_education_events.13.desc: "Tu progenie tiene problemas para adaptarse a esta nueva no-muerte. [victim.GetFirstName] toma la mayoría de lo que se dice al pie de la letra, y no considera que, bueno, todo el mundo miente en la política vampírica. Tus mejores esfuerzos por enseñarle han sido, hasta ahora, infructuosos. Y empieza a ponerte de los nervios."
 POD_education_events.13.option.a: "Estas personas no son tus amigas. No tenemos amigas."
 POD_education_events.13.option.b: "Bueno, al menos esta no será una amenaza para mí"
 POD_education_events.107.t: "Una Educación: Tentado por el Puño de Hierro"
 POD_education_events.107.desc: "Tu vástago ha mostrado un gran interés en los asuntos del gobierno. Un interés que le ha llevado, hasta ahora, a concluir que la fuerza es el derecho. Aunque no estés necesariamente de acuerdo, debes admitir que ya has aprendido algunas ideas interesantes de su forma de hacer las cosas. ¿Quizás animarle a continuar daría más experiencia?"
 POD_education_events.107.option.a: "Hay más poder que la fuerza bruta, vástago"
 POD_education_events.107.option.b: "Quizás podamos aprender el uno del otro, después de todo"
 POD_education_events.14.t: "Una Educación: Vástago Amigable"
 POD_education_events.14.desc: "Tu progenie se ha adaptado bastante bien a la no-muerte hasta ahora. Debes admitir que sientes una conexión aún más fuerte con [victim.GetHerHim] de la que anticipaste antes del $pod_Embrace$. Quizás esta vez, por una vez, tus largas noches de soledad se llenarán de una nueva compañía."
 POD_education_events.14.option.a: "Hablemos un poco más, vástago"
 POD_education_events.108.t: "Una Educación: Tentado por los Cielos"
 POD_education_events.108.desc: "Tu vástago siempre necesitó algo en lo que creer durante [victim.GetHerHis] días mortales. Como tal, no te sorprende demasiado que [victim.GetSheHe] se haya aferrado a la Vía Caeli como su sendero de predilección. Lo que no esperabas, sin embargo, es el puro fervor que [victim.GetSheHe] ha mostrado hasta ahora. Hoy en día pocas cosas te conmueven, pero quizás una muestra pura de devoción puede ser una de esas pocas cosas."
 POD_education_events.108.option.a: "Soy lo que soy"
 POD_education_events.108.option.b: "Eres una visión inspiradora, vástago"
 POD_education_events.15.t: "Una Educación: Vástago Marcial"
 POD_education_events.15.desc: "Las guerras de vampiros son muy diferentes a las de los mortales. Un asunto de relativo secreto, que utiliza un pequeño número de tropas de élite, estas guerras requieren un conjunto de habilidades flexible. Por suerte, tu vástago parece tener una comprensión natural de los desafíos que este estilo de guerra conlleva.\n¿Cómo animarás a [victim.GetHerHim] a usar estos éxitos iniciales?"
 POD_education_events.15.option.a: "Continúa por tu cuenta, vástago"
 POD_education_events.15.option.b: "Deberías centrar tu experiencia en un área, vástago"
 POD_education_events.16.t: "Una Educación: Vástago Desdentado"
 POD_education_events.16.desc: "De todas las cosas, parece ser con la escala del conflicto vampírico con la que tu vástago tiene problemas. Obviamente muy diferente a la guerra mortal, con su pequeño número de tropas de élite, estas batallas pueden ser difíciles de evaluar para un comandante no preparado. Podrías olvidar el problema, ya que no todos los vampiros están destinados a ver un campo de batalla de todos modos, u organizar un 'ejemplo en vivo' con algunas tropas mortales locales para que tu vástago aprenda una o dos cosas."
 POD_education_events.16.option.a: "Concéntrate en tus otros estudios, vástago"
 POD_education_events.16.option.b: "Juguemos a un juego de guerra con mortales, vástago"
 POD_education_events.17.t: "Una Educación: Vástago Poco Espectacular"
 POD_education_events.17.desc: "Hasta ahora, tu nueva progenie lo ha hecho lo suficientemente bien. Nada espectacular, sin embargo, lo que te ha hecho pensar que [victim.GetSheHe] podría ser útil de otras maneras. ¿Tal vez como ejemplo? La mayoría de los $pod_cainites$ hacen gran alarde de la brillantez de su progenie, pero podrías revertir este hábito. Aplastar la mente de tu vástago, sin más razón que la pura crueldad, y sería temido durante bastante tiempo después..."
 POD_education_events.17.option.a: "No dolerá... mucho"
 POD_education_events.17.option.b: "Este aún puede ser útil"
 POD_education_events.109.t: "Una Educación: Tentado por la Crueldad"
 POD_education_events.109.desc: "Tu vástago parece haber abrazado [victim.GetHerHis] nueva condición como monstruo de la noche con demasiado entusiasmo. Has oído historias de 'fiestas' y 'experimentos' perturbadores de los que [victim.GetSheHe] ha participado, o incluso organizado. Lamentablemente, el pequeño desgraciado probablemente no aceptará fácilmente tu autoridad en este asunto..."
 POD_education_events.109.option.a: "¡Detendrás esta locura de inmediato!"
 POD_education_events.109.option.b: "Mientras no me afecte a mí..."
 POD_education_events.18.t: "Una Educación: Vástago Estudioso"
 POD_education_events.18.desc: "Tu vástago está fascinado por la vasta historia de la raza $pod_cainite$. Los clanes, los mitos, los rumores... todo lo que [victim.GetSheHe] puede aprender realmente. [victim.GetSheHe|U] podría tener incluso información sobre algunos asuntos en los que no habías pensado desde hace tiempo. ¿Quizás podrían trabajar juntos?"
 POD_education_events.18.option.a: "Tienes mi bendición para continuar, vástago"
 POD_education_events.18.option.b: "¿Qué opinas de esta historia, vástago?"
 POD_education_events.19.t: "Una Educación: Vástago Lento"
 POD_education_events.19.desc: "Tu progenie tiene problemas con la gran cantidad de nueva información que [victim.GetSheHe] tiene que aprender. Los clanes, la historia de la raza $pod_cainite$, los mitos... parece ser demasiado. Si no haces algo pronto, tu vástago probablemente se rendirá, lo que podría ser un obstáculo para [victim.GetHerHis] iniciación en la noche."
 POD_education_events.19.option.a: "...Este servirá para otro propósito"
 POD_education_events.19.option.b: "Tomemos algo de tiempo para estudiar juntos, vástago"
 POD_education_events.20.t: "Una Educación: Maestra Perfecta"
 POD_education_events.20.desc: "Como la anciana más respetada de los Ravnos occidentales, has enseñado a muchos jóvenes en tu tiempo, Durga Syn. Incluso disfrutas haciéndolo, apareciendo de la nada para traer a los confusos neonatos tu sabiduría, a menudo críptica.\nComo tal, es bastante fácil aplicar tus grandes talentos a tu propia progenie. Un suave empujón aquí, un sutil codazo allá y este resultará exactamente como quieres."
 POD_education_events.20.option.a: "Escucha a tu Bestia, luego domínala"
 POD_education_events.20.option.b: "La Rosa es para las Rosas, el Azul es para los Señores" 
 POD_education_events.20.option.c: "Para desbloquear tu propio misterio, debes buscar tu propia llave"
 POD_education_events.110.t: "Una Educación: Falta de Ambición"
 POD_education_events.110.desc: "Últimamente, tu vástago está abordando [victim.GetHerHis] no-muerte de una manera más cautelosa que antes. Satisfecho con permanecer en las sombras, [victim.GetSheHe] parece contento con dejar las responsabilidades y peligros a otros, aunque todavía a menudo [victim.GetSheHe] aporta [victim.GetHerHis] experiencia cuando es necesario. Aunque es tranquilizador para ti tener un vástago aparentemente confiable, quizás tengas otros planes para el futuro."
 POD_education_events.110.option.a: "¡Ten algo de carácter, vástago!"
 POD_education_events.110.option.b: "Un rival potencial menos... probablemente"
 POD_education_events.111.t: "Una Educación: Maestro Perfecto"
 POD_education_events.111.desc: "Pocos $pod_cainites$ pueden afirmar haber moldeado un sendero como tú lo hiciste con el Sendero de la Humanidad, lord Dionisio. Obviamente, te dio una gran perspicacia en estos asuntos, y has estado aprendiendo y debatiendo sobre ellos durante bastante tiempo.\nComo tal, hay muy pocas personas más capacitadas para enseñar sobre esto que tú. El polluelo a tu cargo ahora es muy privilegiado, de hecho."
 POD_education_events.111.option.a: "Aprenderé mucho debatiendo con una mente fresca"
 POD_education_events.111.option.b: "Tengo mucho que enseñarte"
 POD_education_events.112.t: "Una Educación: El Segundo Abrazo"
 POD_education_events.112.desc: "Un ritual sagrado que se realiza después de que un vástago recién abrazado se convierte al Islam, el Rito del Segundo Abrazo es una recreación metafórica de las propias experiencias del fundador de los [Glossary('Ashirra','game_concept_ashirra_desc')] junto al Profeta.\n\nEl rito en sí se lleva a cabo entre el kindred neófito y el responsable de [victim.GetHerHis] conversión, en este caso tú. Debes guiar a este polluelo hacia [victim.GetHerHis] verdadero despertar, dejar atrás la ignorancia y tener [victim.GetHerHis] alma galvanizada por la nueva fe."
 POD_education_events.112.option.a: "Oremos."
 POD_education_events.112.option.b: "Debes limpiarte del pecado."
 POD_education_events.112.option.c: "Una verdadera oración viene del corazón."


 POD_education_events.200.t: "Una Educación: La Presentación"
 POD_education_events.200.desc: "Es hora de que tu vástago sea presentado formalmente en tu corte... ¿o no? Esta parte tradicional de la sociedad $pod_cainite$ está plagada de oportunidades y peligros, ya que tus [ROOT.Char.Custom('GetFollowerOrVassalPlural')] ciertamente buscarán cualquier debilidad que valga la pena explotar en tu nuevo protegido.\nPodrías saltarte todo el asunto, pero eso no te favorecerá."
 POD_education_events.200.option.a: "Compórtate ahí dentro"
 POD_education_events.200.option.b: "No necesitan saber de ti"
 POD_education_events.201.t: "Una Educación: Molesto [ROOT.Char.Custom('GetFollowerOrVassal')|U]"
 POD_education_events.201.desc: "Durante la presentación de tu vástago, uno de tus [ROOT.Char.Custom('GetFollowerOrVassalPlural')] aprovechó cada oportunidad disponible para criticar a tu progenie. No es suficientemente bueno, no es digno del $pod_Embrace$, pérdida de tiempo... Puedes ver que tu vástago apenas está controlando [victim.GetHerHis] temperamento en este punto.\nQuizás quieras intervenir si no quieres que estos dos se odien."
 POD_education_events.201.option.a: "Mientras no me odien a mí..."
 POD_education_events.201.option.b: "Deja de hablar"
 POD_education_events.202.t: "Una Educación: Amigable [ROOT.Char.Custom('GetFollowerOrVassal')|U]"
 POD_education_events.202.desc: "Uno de tus [ROOT.Char.Custom('GetFollowerOrVassalPlural')] realmente ha tomado cariño a tu vástago durante la presentación. Sincero o motivado políticamente, realmente no importa mientras mantenga la paz aquí. Te unes a ellos mientras hablan animadamente entre ellos."
 POD_education_events.202.option.a: "Me alegra que se lleven bien"
 POD_education_events.202.option.b: "¡Pues sí! ¡Elegí muy bien a mi vástago!"
 POD_education_events.203.t: "Una Educación: Conspirador [ROOT.Char.Custom('GetFollowerOrVassal')|U]"
 POD_education_events.203.desc: "Tu vástago cometió un pequeño error durante la presentación. Sorprendentemente, uno de tus [ROOT.Char.Custom('GetFollowerOrVassalPlural')] ayudó a encubrirlo lo suficientemente rápido para que no tuviera repercusiones.\nEntiendes por qué cuando esta serpiente conspiradora viene a ti, diciéndote que ahora le debes algo..."
 POD_education_events.203.option.a: "Has ganado esta ronda"
 POD_education_events.203.option.b: "¡No te debo nada!"
 POD_education_events.204.t: "Una Educación: Enamorado [ROOT.Char.Custom('GetFollowerOrVassal')|U]"
 POD_education_events.204.desc: "Uno de tus [ROOT.Char.Custom('GetFollowerOrVassalPlural')] ha quedado cautivado por la impecable presentación de tu vástago y ahora pide algo de tiempo a solas con tu progenie. Obviamente, sería una forma fácil para ti de ponerlo en tu deuda, pero a tu progenie podría no gustarle que lo usen como una especie de regalo."
 POD_education_events.204.option.a: "Ven aquí, vástago, quiero presentarte a alguien..."
 POD_education_events.204.option.b: "Lamentablemente, no puedo aceptar tu petición"
 POD_education_events.205.t: "Una Educación: Suficientemente Bueno"
 POD_education_events.205.desc: "La presentación de tu vástago fue... suficientemente bien. De ninguna manera un éxito rotundo, pero tampoco un fracaso. Supones que, en la sociedad vampírica, incluso lograr un éxito promedio ya es bastante difícil de todos modos."
 POD_education_events.205.option.a: "Decididamente mediocre"
 POD_education_events.206.t: "Una Educación: Impecable"
 POD_education_events.206.desc: "Todo sobre la presentación de tu vástago salió muy bien, incluso por encima de tus expectativas. Tus [ROOT.Char.Custom('GetFollowerOrVassalPlural')] quedaron impresionados por tu nueva progenie, e incluso más impresionados por tus cualidades como [Glossary('Sire','game_concept_Sire_desc')]. Esto te favorecerá durante algún tiempo."
 POD_education_events.206.option.a: "Un resultado perfecto"
 POD_education_events.207.t: "Una Educación: Fracaso Encubierto"
 POD_education_events.207.desc: "En la superficie, todo parece haber ido bien en la presentación de tu vástago. Pero en el fondo, sabes que algo salió mal. Tus [ROOT.Char.Custom('GetFollowerOrVassalPlural')] fueron todo palabras melosas, y se congregaron unos alrededor de otros, hablando en voz baja.\nQuizás planearon este movimiento durante algún tiempo, o quizás hiciste algo para enfadarlos. Sea cual sea la razón, esto podría ser un problema en el futuro."
 POD_education_events.207.option.a: "La política nunca se detiene"
 POD_education_events.208.t: "Una Educación: Demasiado Exitoso"
 POD_education_events.208.desc: "Tu vástago ha causado una gran primera impresión durante [victim.GetHerHis] presentación. Quizás incluso demasiado grande, en realidad... Animado por tus [ROOT.Char.Custom('GetFollowerOrVassalPlural')], deseosos de entorpecer tus planes, [victim.GetSheHe] ha comenzado a tener delirios de grandeza.\nObviamente, esto está muy por encima de su posición o poder en este momento, pero el insolente mocoso está casi abiertamente conspirando para su 'futuro' mandato como tu heredero. Tendrás que controlar a este con cuidado..."
 POD_education_events.208.option.a: "¡Idiota insolente!"
 POD_education_events.209.t: "Una Educación: Impresionado [ROOT.Char.Custom('GetFollowerOrVassal')|U]"
 POD_education_events.209.desc: "La presentación de tu vástago en la corte va bien. Nada fuera de lo común, excepto la buena voluntad aparentemente genuina que [victim.GetSheHe] se ha ganado de uno de tus poderosos [ROOT.Char.Custom('GetFollowerOrVassalPlural')]. Este pequeño gesto de diplomacia se puede aprovechar para tu ventaja, ya sea hacia el [ROOT.Char.Custom('GetFollowerOrVassal')] o tu vástago."
 POD_education_events.209.option.a: "Obviamente, mi vástago habla con mi bendición"
 POD_education_events.209.option.b: "Te elegí bien, vástago"
 POD_education_events.210.t: "Una Educación: El Regalo"
 POD_education_events.210.desc: "Durante la primera presentación de tu vástago en la corte, un pequeño número de tus [ROOT.Char.Custom('GetFollowerOrVassalPlural')] llega con un generoso regalo... para tu progenie, no para ti. Obviamente, están tratando de crear una brecha entre ustedes dos haciendo que reclames el regalo para ti. Un plan no tan sutil, pero aún tentador por su puro valor..."
 POD_education_events.210.option.a: "Eres demasiado joven, vástago, esto es mío"
 POD_education_events.210.option.b: "Entonces disfruta"
 POD_education_events.211.t: "Una Educación: Vástago Dotado"
 POD_education_events.211.desc: "Debes admitir, tu vástago es bastante bueno para calmar las mezquinas quejas de tus [ROOT.Char.Custom('GetFollowerOrVassalPlural')] y halagar sus aún más mezquinos egos. Tan bueno, de hecho, que no necesitas hacer nada durante esta presentación en la corte.\nPuede que sea pronto, pero te preguntas si podrías usar a tu dotada progenie para aliviar tu carga de gobierno, al menos por un tiempo."
 POD_education_events.211.option.a: "Hablemos de nuevas responsabilidades, vástago"
 POD_education_events.211.option.b: "Descansaré cuando esté... bueno"
 POD_education_events.1001.t: "Hijos contra Padres"
 POD_education_events.1001.desc: "Observas a tu nuevo vástago, todavía recuperándose de la sangre que tan generosamente le diste a [victim.GetHerHim]. ¿En qué resultará este? ¿Un amigo, un sirviente, un enemigo? Reflexionas sobre esto mientras el nuevo polluelo se levanta para encontrarse con tu mirada.\nEspera, esa mirada, no podría ser...\nReaccionas demasiado tarde cuando [victim.GetSheHe] te agarra con [victim.GetHerHis] recién descubierta fuerza y hunde [victim.GetHerHis] colmillos en tu cuello. Sientes cómo tu conciencia se desvanece en el olvido hasta que tu Bestia, por una vez tu mayor aliada, te insta a luchar. ¡No te rendirás tan fácilmente!"
 POD_education_events.1001.option.a: "¡Todavía no es demasiado tarde!"
 POD_education_events.1001.effect.success.desc: "Rechazas a tu vástago"
 POD_education_events.1001.critical.failure.effect.desc: "...la sensación de dicha es demasiado fuerte"
 POD_education_events.1002.t: "Hijos contra Padres: ¿Misericordia?"
 POD_education_events.1002.desc: "En un esfuerzo supremo de fuerza de voluntad y fuerza física, lograste liberarte del mortal $pod_Embrace$ de tu vástago. Ahora eres plenamente consciente de la amenaza, y tu enemigo ha perdido la ventaja. [victim.GetSheHe|U] ahora te considera cuidadosamente, con miedo acechando detrás de [victim.GetHerHis] ojos.\nCon tu plena conciencia y poderes de vuelta, ahora puedes aplastar a este insolente mocoso si te place. O podrías perdonar y olvidar, pues conoces demasiado bien el atractivo de la sangre antigua para un polluelo recién abrazado..."
 POD_education_events.1002.option.a: "Tienes ambición. Puedo respetar eso."
 POD_education_events.1002.option.b: "¡No eres digno de mi sangre!"
 POD_education_events.1003.t: "Cenizas de lo Antiguo"
 POD_education_events.1003.desc: "Es demasiado tarde. Potenciado por la sangre que usaste para devolver a [victim.GetHerHim] a la vida, tu nuevo vástago ha logrado drenarte lo suficiente como para dejarte sin poder para resistir. Así es como terminará, entonces, asesinado por tu propia progenie, como tantos antes, y después, de ti.\nUna curiosa ironía, que no se te escapa mientras tu conciencia se desliza cada vez más lejos, consumida por una dicha artificial.\nHasta que todo termina, en la oscuridad, como siempre esperaste."
 POD_education_events.1003.option.a: "Hay que matar al padre algún día"
 POD_education_events.22.t: "Una Educación: Caballero Ceniciento"
 POD_education_events.22.desc: "Tu $pod_clan$ tiene una fuerte tradición de destreza militar. Como tal, es bastante fácil para ti encontrar los mejores maestros para tu nuevo vástago. En este ambiente de mentalidad militar, nacerá un nuevo campeón. Con suerte, uno leal."
 POD_education_events.22.option.a: "¡Denme diez vueltas más!"
 POD_education_events.21.t: "Una Educación: Noble Ceniciento"
 POD_education_events.21.desc: "Tu $pod_clan$ tiene una fuerte tradición de nobleza. Como tal, es bastante fácil para ti encontrar los mejores maestros para tu nuevo vástago. En este ambiente edificante, nacerá un nuevo noble de la noche. Con suerte, uno leal."
 POD_education_events.21.option.a: "Respeta a tus superiores y usa al resto"
 POD_education_events.23.t: "Una Educación: Senescal Ceniciento"
 POD_education_events.23.desc: "Tu $pod_clan$ tiene una fuerte tradición de gobierno. Como tal, es bastante fácil para ti encontrar los mejores maestros para tu nuevo vástago. En este ambiente diligente, nacerá un nuevo gobernante de la noche. Con suerte, uno leal."
 POD_education_events.23.option.a: "Valoraré tu consejo, hasta cierto punto"
 POD_education_events.24.t: "Una Educación: Ladrón Ceniciento"
 POD_education_events.24.desc: "Tu $pod_clan$ tiene una fuerte tradición de picardía. Como tal, es bastante fácil para ti encontrar los mejores maestros para tu nuevo vástago. En este ambiente competitivo, nacerá un nuevo cazador de la noche. Con suerte, uno leal."
 POD_education_events.24.option.a: "Toma lo que es tuyo"
 POD_education_events.25.t: "Una Educación: Cultista Ceniciento"
 POD_education_events.25.desc: "Tu $pod_clan$ tiene una fuerte tradición de lucrarse con los cultos. Como tal, es bastante fácil para ti encontrar los mejores maestros para tu nuevo vástago. En este ambiente erudito, nacerá un nuevo profeta de la noche. Con suerte, uno leal."
 POD_education_events.25.option.a: "Haz que [victim.GetHerHim] gane su salvación"

 POD_education_events.1.option.f: "¡Haremos una Valquiria de ti!"
 POD_education_events.1.option.adisa: "Esta opción de educación especial, solo disponible para Adisa, te permite entrenar más específicamente a tu vástago."
 POD_education_events.28.t: "Una Educación: Una Nueva Valquiria"
 POD_education_events.28.desc: "Freya te enseñó a luchar y a defenderte contra el mal de los hombres, pero sabes que no todas tus hermanas son capaces de tal hazaña. Por suerte, entiendes que, aunque la mayoría de las Valquirias están destinadas a ser guerreras, otras están destinadas a un papel diferente, más tranquilo pero no menos importante.\nEl mundo es vasto, y las Valquirias hábiles en diplomacia podrían ser valiosas enviadas a los señores y damas de la noche, allanando el camino para que liberes a más oprimidas."
 POD_education_events.28.option.a: "¡Veamos lo dura que eres, hermana!"
 POD_education_events.28.option.b: "Tienes una forma de hablar que yo no tengo."
 POD_education_events.28.option.c: "Podrías encontrar el éxito en el equilibrio."

 POD_education_events.29.t: "Una Educación: Una Mentoría"
 POD_education_events.29.desc: "Uno de tus cortesanos ha notado que tu nuevo vástago está dando [victim.GetHerHis] primeros pasos en la noche. Probablemente buscando obtener algunos favores de ti, [mentor.GetSheHe] ha propuesto dar algunos consejos a tu protegido. Esto podría ser útil, ya que incluso la persona más talentosa necesita algo de tiempo antes de adaptarse a la condición Cainita.\nTambién podrías decidir participar también, con suerte, ganando algo de experiencia en el proceso."
 POD_education_events.29.option.a: "Bien, aquí está tu favor y tu oro."
 POD_education_events.29.option.b: "Lo harás. Gratis."
 POD_education_events.29.option.c: "También participaré."
 POD_education_events.29.option.d: "No es necesario."
 badmentor_tooltip: "El mentor podría no hacer [mentor.GetHerHis] mejor esfuerzo en ese contexto..."

 POD_education_events.302.t: "El Rito de Liberación"
 POD_education_events.302.desc: "Los Tzimisce tienen muchas tradiciones que honran con gran celo. Una de ellas es el Rito de Liberación, un evento formal donde un vástago es oficialmente reconocido como un Tzimisce de pleno derecho por su [Glossary('Sire','game_concept_Sire_desc')] durante una ceremonia ritualizada. Sin importar la relación entre los dos, este es un momento muy esperado por los vástagos ambiciosos que buscan independizarse.\nEn tu caso específico, tu vástago ya es un terrateniente por [victim.GetHerHis] cuenta, lo que significa que este Rito será una mera formalidad. La única pregunta es si hacer de esto un gran evento o no."
 POD_education_events.302.option.a: "Hacer un evento fastuoso alabando a tu vástago."
 POD_education_events.302.option.b: "Un evento más pequeño será suficiente."
 POD_education_events.302.option.c: "Ningún evento, [victim.GetSheHe] no lo merecía."
                    
 POD_education_events.303.desc: "Los Tzimisce tienen muchas tradiciones que honran con gran celo. Una de ellas es el Rito de Liberación, un evento formal donde un vástago es oficialmente reconocido como un Tzimisce de pleno derecho por su [Glossary('Sire','game_concept_Sire_desc')] durante una ceremonia ritualizada. Sin importar la relación entre los dos, este es un momento muy esperado por los vástagos ambiciosos que buscan independizarse.\nTu vástago ha pedido formalmente su liberación, pensando que su tiempo a tu sombra debería llegar a su fin. El Rito requeriría que organices una ceremonia donde liberes el control que tienes sobre [victim.GetHerHim] y, si [victim.GetSheHe] todavía está bajo tu cuidado, le des permiso para crear su propia fortuna en otro lugar. Sin embargo, siempre existe la posibilidad de negarse, pero probablemente enfadará a [victim.GetHerHim]."
 POD_education_events.303.option.a: "Ahora eres un verdadero Tzimisce."
 POD_education_events.303.option.b: "Organizar un evento fastuoso para aplacar a [victim.GetHerHim] pero no liberarlo."
 POD_education_events.303.option.c: "Te quedas aquí. Fin de la historia."
                    
 POD_education_events.304.desc: "Los Tzimisce tienen muchas tradiciones que honran con gran celo. Una de ellas es el Rito de Liberación, un evento formal donde un vástago es oficialmente reconocido como un Tzimisce de pleno derecho por su [Glossary('Sire','game_concept_Sire_desc')] durante una ceremonia ritualizada. Sin importar la relación entre los dos, este es un momento muy esperado por los vástagos ambiciosos que buscan independizarse.\nTu vástago no parece importarle mucho, sin embargo, aparentemente contento con dejar que continúes decidiendo por [victim.GetHerHis] futuro por ahora. Como tal, el Rito de Liberación estará mayoritariamente bajo tu control, o podrías saltártelo por completo con pocas consecuencias."
 POD_education_events.304.option.a: "Ahora eres un verdadero Tzimisce. Debes irte."
 POD_education_events.304.option.b: "Organizar un evento fastuoso pero no liberar a [victim.GetHerHim]."
 POD_education_events.304.option.c: "Estás donde perteneces."
        