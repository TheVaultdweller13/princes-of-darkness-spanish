l_spanish:
 activity_invite_rule_coterie_members: "Invitar a miembros de [GetPlayer.Custom('PODCoterieNoTooltip')]"

 ACTIVITY_GUEST_COTERIE_REASON: "[ROOT.Char.GetSheHe|U] también es miembro de $POD_player_coterie$: $VALUE|=+0$"

 activity_brujah_panegyra: "Panegyra Brujah"
 activity_brujah_panegyra_desc: "Una tradición creada por los Brujah helénicos, la Panegyra es una versión vampírica de los juegos olímpicos adaptada a las fortalezas y debilidades únicas de los hijos de Caín."
 activity_brujah_panegyra_host_desc: "$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$Pérdida de [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$[trait_level_track_xp|E] de [GetTrait('tourney_participant').GetName( GetNullCharacter )]"
 activity_brujah_panegyra_selection_tooltip: "Invita a tus [knight_culture_player_plural|E], súbditos y vecinos a un gran espectáculo de competiciones\n\nRecompensas anticipadas:\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$Pérdida de [stress_loss_i] [stress|E]"
 activity_brujah_panegyra_destination_selection: ""
 brujah_panegyra_conclusion_general: "La Panegyra finalmente ha llegado a su fin.\n" 
 activity_brujah_panegyra_guest_desc: "$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$Pérdida de [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$[trait_level_track_xp|E] de [GetTrait('tourney_participant').GetName( GetNullCharacter )]"
 #activity_brujah_panegyra_conclusion_desc: ""
 
 brujah_panegyra_option_accommodations: "Alojamientos"
 brujah_panegyra_accommodations_bad: "Tiendas de Campaña Ruinosas"
 brujah_panegyra_accommodations_bad_desc: "$EFFECT_LIST_BULLET$ Cuanto mejores sean los alojamientos, más prestigio de dinastía ganarás al final de la actividad.\n\n#weak ¿Qué importa más, las habilidades demostradas o el lugar donde se demuestran?#!"
 brujah_panegyra_accommodations_normal: "Pabellones Sencillos"
 brujah_panegyra_accommodations_normal_desc: "$EFFECT_LIST_BULLET$ Cuanto mejores sean los alojamientos, más prestigio de dinastía ganarás al final de la actividad.\n\n#weak La clave para un buen desempeño es descansar bien durante el día.#!"
 brujah_panegyra_accommodations_good: "Campamentos Lujosos"
 brujah_panegyra_accommodations_good_desc: "$EFFECT_LIST_BULLET$ Cuanto mejores sean los alojamientos, más prestigio de dinastía ganarás al final de la actividad.\n\n#weak La Panegyra debería ser más que simples eventos deportivos, ¡deberían ser #underline experiencias#! completas para mostrar la gloria del clan Brujah!#!"
 
 brujah_panegyra_option_prizes: "Premios"
 brujah_panegyra_prizes_bad: "Premios Sencillos"
 brujah_panegyra_prizes_bad_desc: "$EFFECT_LIST_BULLET$ Determina la cantidad de oro ofrecida a los ganadores.\n\n#weak Estamos aquí por el amor al deporte, las baratijas ofrecidas son solo una excusa.#!"
 brujah_panegyra_prizes_normal: "Premios Decorosos"
 brujah_panegyra_prizes_normal_desc: "$EFFECT_LIST_BULLET$ Determina la cantidad de oro ofrecida a los ganadores.\n\n#weak Aunque no estamos aquí por los premios, poder financiar el viaje de regreso es un objetivo muy práctico.#!"
 brujah_panegyra_prizes_good: "Buenos Premios"
 brujah_panegyra_prizes_good_desc: "$EFFECT_LIST_BULLET$ Determina la cantidad de oro ofrecida a los ganadores.\n\n#weak Sin algo en juego, ¿qué sentido tiene una competición?#!"
 brujah_panegyra_prizes_very_good: "Premios Notables"
 brujah_panegyra_prizes_very_good_desc: "$EFFECT_LIST_BULLET$ Determina la cantidad de oro ofrecida a los ganadores.\n\n#weak Un premio no es solo una baratija que se entrega al vencedor, es un faro para atraer a los valientes y audaces a que asistan.#!"
 brujah_panegyra_prizes_splendid: "Premios Espléndidos"
 brujah_panegyra_prizes_splendid_desc: "$EFFECT_LIST_BULLET$ Determina la cantidad de oro ofrecida a los ganadores.\n\n#weak Los mejores premios son aquellos tan glamurosos que eclipsan a sus ganadores.#!"

 brujah_panegyra_phase_archery: "Tiro con Arco"
 brujah_panegyra_phase_archery_desc: "Una competición de arco en la que cada concursante dispara a una diana con un número determinado de flechas, buscando obtener la mayor puntuación posible.\nEs una adición algo reciente a la Panegyra, solicitada principalmente por los miembros más jóvenes del clan Brujah que buscan algo más "moderno" en lo que competir."
 brujah_panegyra_phase_kerykes: "Kerykes"
 brujah_panegyra_phase_kerykes_desc: "Un concurso de habilidades oratorias, es, con diferencia, el favorito de la parte más culta de los Brujah... y el más temido por los forasteros por su gran duración."
 brujah_panegyra_phase_wrestling: "Lucha Libre"
 brujah_panegyra_phase_wrestling_desc: "Una parte clásica de las Olimpiadas griegas, la lucha es un concurso de fuerza e ingenio, en el que los concursantes intentan derribar o lanzar a sus oponentes fuera del círculo para ser el último en pie."
 brujah_panegyra_phase_boxing: "Boxeo"
 brujah_panegyra_phase_boxing_desc: "La competición con más probabilidades de causar frenesí entre sus participantes, el boxeo enfrenta a dos combatientes en un duelo con un elaborado (y a menudo cambiante entre cada Panegyra) conjunto de reglas."
 brujah_panegyra_phase_board_game: "Juegos de Mesa"
 brujah_panegyra_phase_board_game_desc: "Un concurso de ingenio en el que los concursantes juegan una serie de partidas de juegos de mesa, siendo el ganador definitivo el último jugador que permanezca.\nEl ajedrez es, con diferencia, el más practicado, pero las Panegyras celebradas en tierras donde no es tan común a menudo lo han intercambiado por una alternativa más local."
 brujah_panegyra_phase_horse_race: "Carreras de Caballos"
 brujah_panegyra_phase_horse_race_desc: "Un deporte para espectadores en el que los señores y damas inscriben caballos para que compitan entre sí, siendo el ganador el primero en cruzar la línea de meta.\nAlgunas Panegyras usan carros para esta competición, mientras que otras separan las carreras de caballos en varios concursos más pequeños."
 
 panegyra_rewards_tt: "Se otorgan recompensas al vencedor."
 
 brujah_panegyra_events.1000.t: "Tiro con Arco"
 brujah_panegyra_events.1000.desc: "El tiro con arco nunca fue parte de los juegos olímpicos originales y, como tal, los Brujah no lo consideraban adecuado para su Panegyra. No fue sino después de una larga y agotadora campaña de los miembros más jóvenes del clan que finalmente se añadió como competición. Los defensores del tiro con arco tienden a explicar que es la encarnación perfecta del Brujah, ya que requiere tanto aptitud física como una mente aguda.\nLa mayoría de los ganadores suelen ser esos jóvenes neonatos que crecieron con un arco en las manos y es, con diferencia, la competición que más esperan. Los ancianos tienden a verlo como un mal necesario, una introducción a partes mucho más tradicionales y respetadas de la Panegyra que vendrán después."
 brujah_panegyra_events.1000.a: "¡Hora de dar lo mejor de mí!"
 brujah_panegyra_events.1000.b: "No es mi fuerte, lo tomaré con calma."
 brujah_panegyra_events.1000.c: "Estoy listo."
 panegyra_overdrive_tt: "Esto aumentará tus posibilidades de éxito en esta competición."
 panegyra_underdrive_tt: "Esto disminuirá tus posibilidades de éxito en esta competición."
 
 brujah_panegyra_events.1010.t: "Kerykes"
 brujah_panegyra_events.1010.desc: "Los kerykes (heraldos) estaban asociados con los salpinktai (trompetistas) en las antiguas Olimpiadas para formar el concurso de Heraldo y Trompeta. La parte de la trompeta nunca fue realmente popular entre los Brujah, pero la competición de oratoria definitivamente sí lo es. Los ganadores se eligen tanto por la claridad de la enunciación y la audibilidad de su voz como por lo que realmente dicen. Algunos usan poesía, mientras que otros prefieren obras políticas griegas antiguas como Platón o Aristóteles.\nAmada por los ancianos Brujah, esta es una competición temida por los otros clanes, ya que puede durar noches enteras antes de llegar a su fin. Las peticiones educadas de instituir un límite de tiempo para cada concursante han sido, hasta ahora, firmemente rechazadas."
 brujah_panegyra_events.1010.b: "Intentemos no quedarnos dormidos..."
 brujah_panegyra_events.1010.c: "¡Mi voz es un arma afilada!"

 brujah_panegyra_events.1020.t: "Lucha Libre"
 brujah_panegyra_events.1020.desc: "El clásico de los clásicos, la lucha ha sido un elemento fijo de las Olimpiadas desde que existen las Olimpiadas. Sus reglas apenas han cambiado desde su primera creación y sigue siendo una de las favoritas de la Panegyra hasta esta noche. Se sabe que los Gangrel y Nosferatu son contendientes particularmente feroces, a menudo negándole la victoria a los Brujah, ya que están acostumbrados a las proezas físicas de fuerza necesarias para prevalecer aquí."

 brujah_panegyra_events.1030.t: "Boxeo"
 brujah_panegyra_events.1030.desc: "El boxeo tiene la dudosa distinción de ser tanto la competición cuyas reglas cambian más a menudo como la que más induce al frenesí entre sus participantes. Como tal, a veces se ha debatido si es adecuado para vampiros, pero el impulso para eliminarlo de la Panegyra nunca ganó mucha tracción.\nEs una competición favorita de los Toreador, quienes dicen apreciar el "arte físico" que muestra tal concurso. Sin embargo, se sabe que los Brujah maliciosos insinúan que solo quieren saciar su lujuria con los participantes, ya que el boxeo, según la tradición griega, se practica desnudo."

 brujah_panegyra_events.1040.t: "Juegos de Mesa"
 brujah_panegyra_events.1040.desc: "La primera adición no griega a la Panegyra, los juegos de mesa han sido un elemento básico desde hace mucho tiempo. Favorecidos por los ancianos Brujah (y por los Lasombra participantes), esta tiende a ser la competición más importante políticamente, ya que esos ancianos a menudo hablan durante estos juegos y algunos piensan que decisiones importantes (o rivalidades) que han dado forma al mundo Cainita han comenzado aquí.\nEl ajedrez es un elemento básico, pero no es el único que se practica. Sin embargo, los jueces se muestran algo reacios a introducir nuevos juegos rápidamente, ya que se sabe que algunos concursantes intentan imponer su juego olvidado de alguna cultura olvidada sin forma de verificar las reglas, lo que les daría una ventaja injusta."

 brujah_panegyra_events.1050.t: "Carreras de Caballos"
 brujah_panegyra_events.1050.desc: "Las Olimpiadas griegas eran aficionadas a las carreras de caballos, que eran consideradas la competición más prestigiosa, y los Brujah las han imitado en su Panegyra durante siglos. Cada una tiene su propia interpretación de la carrera, aunque los carros son un espectáculo glorioso pero cada vez más raro en estos días (ya que los aurigas y fabricantes de carros competentes son escasos en esta era).\nMuchos han hecho la transición a una carrera de caballos más tradicional y luego tienen que considerar si aceptar caballos emproblemados o no. No se ha llegado a un consenso definitivo sobre este tema y, por lo tanto, un concursante probablemente debería informarse antes de la carrera, o arriesgarse a ser acusado de hacer trampa."

 brujah_panegyra_events.20.t: "Fin de la Competición"
 brujah_panegyra_events.20.desc: "¡[contest_winner.GetTitledFirstName] ganó la competición!\nEl polvo se asienta en la arena mientras esta parte de la Panegyra llega a su fin. Los perdedores lamen sus heridas (físicas o de otro tipo), los ganadores se deleitan con la gloria (y la envidia) ganada por su actuación, y los sirientes emproblemados se quedan para limpiar el desastre dejado por sus amos no-muertos."
 brujah_panegyra_events.20.a: "Gloria al vencedor, pesar al vencido."
 
 brujah_panegyra_events.13.t: "Olimpia Renacida"
 brujah_panegyra_events.13.desc: "Introducida por primera vez por los Brujah helénicos fascinados por el concepto de los juegos olímpicos, la Panegyra es una reunión tradicional del clan Brujah en la isla de Calcis que se celebra cada década. Los juegos patrocinados, siguiendo de cerca las antiguas Olimpiadas griegas, son la parte más esperada del evento.\nLas Panegyras se han extendido tan lejos como el clan Brujah a lo largo de los siglos y muchas más pequeñas se celebran en otras partes del mundo. Cada Panegyra tiende a tener sus propias variaciones, a menudo ligadas a la cultura de la región donde se celebra. Todos los vampiros son bienvenidos a participar, aunque el uso de $pod_discipline$ está estrictamente prohibido, lo que tiende a igualar las condiciones entre los diversos contendientes.\nSi bien la mayoría de los clanes no están realmente interesados en el evento, muchos vienen al menos a presenciarlo o a usarlo como cobertura para hacer política con Cainitas de tierras lejanas."
 brujah_panegyra_events.13.a: "¡Que comiencen los juegos!"
  
 panegyra_conclusion_general: "La Panegyra ha llegado a su fin. Algunos han ganado gloria, otros han sentido el aguijón de la derrota y otros han aprovechado el evento para tramar e intrigar para el futuro. Los jueces ya están pensando en cambios de reglas para la próxima y los concursantes están pensando en cómo mejorar los regímenes de entrenamiento para hacerlo incluso mejor.\nEn general, un éxito para el clan Brujah, que recuerda al mundo Cainita que aún son fieles a sus ideales de perfección mental y física."
 
 panegyra_archery_tt: "El tiro con arco favorece la paciencia, aquellos hábiles con el arco (y tener uno bueno también ayuda) y los concursantes físicamente dotados."
 panegyra_kerykes_tt: "Los Kerykes favorecen a los diplomáticos, poetas y concursantes gregarios. Los personajes tímidos o con problemas de habla tienen menos probabilidades de ganar."
 panegyra_wrestling_tt: "La lucha favorece enormemente la destreza física y los personajes de complexión fuerte."
 panegyra_boxing_tt: "El boxeo favorece a los personajes pacientes, insensibles y hábiles en el duelo (como los maestros de la espada)."
 panegyra_board_game_tt: "Los juegos de mesa favorecen a los personajes eruditos, pacientes y engañosos."
 panegyra_horse_race_tt: "Las carreras de caballos favorecen a los jinetes hábiles, a los inclinados a la mayordomía y a los personajes diligentes."
 
 brujah_panegyra_events.1001.t: "Herramientas del Oficio"
 brujah_panegyra_events.1001.desc: "Se espera que los concursantes de tiro con arco traigan sus propios arcos, lo que ha llevado a que una pequeña pero próspera comunidad de fabricantes de arcos se establezca cerca de la Panegyra. Muchos vampiros no usan arcos habitualmente, por lo que compran uno de los propuestos por los artesanos antes del concurso. Incluso aquellos pocos Cainitas que vienen con su propia arma probablemente la harán revisar antes de que comiencen los juegos para asegurarse de que esté en perfectas condiciones."
 brujah_panegyra_events.1001.a: "¡Quiero el mejor arco del país!"
 brujah_panegyra_events.1001.b: "Solo junta dos ramas y estará bien."
 brujah_panegyra_events.1001.c: "Un arco común será suficiente."
 
 panegyra_overdrive_other_tt: "Este concursante tendrá mayores posibilidades de ganar la competición actual."
 panegyra_underdrive_other_tt: "Este concursante tendrá menores posibilidades de ganar la competición actual."
 
 brujah_panegyra_events.1002.t: "Ayuda"
 brujah_panegyra_events.1002.desc: "Mientras el concurso de tiro con arco está en marcha, otro participante ha notado tus buenos resultados iniciales y ha venido a pedirte consejo. Siendo la sociedad vampírica lo que es, ciertamente no esperan que sea gratis y, en lugar del complejo juego de politiquería habitual en tu especie, te proponen una pequeña suma de oro para contratarte como una especie de consultor durante la duración de este concurso."
 brujah_panegyra_events.1002.a: "Primero, hablemos del viento..."
 brujah_panegyra_events.1002.b: "¡Ja! No."
 brujah_panegyra_events.1002.c: "Solo dales algunos consejos básicos y sigue adelante."
  
 panegyra_disqualified_tt: "Eres descalificado de esta competición."
 panegyra_disqualified_other_contestant: "[other_contestant.GetShortUIName] es descalificado de esta competición."
 
 brujah_panegyra_events.1003.t: "Una Pequeña Ayuda"
 brujah_panegyra_events.1003.desc: "Incluso el vampiro más joven tiene el potencial de realizar grandes hazañas físicas si usa su sangre para hacerlo. Como tal, sería ridículamente fácil hacer trampa durante cualquier competición que favorezca a esos. Las reglas de la Panegyra son claras, sin embargo: no se permite el uso de ningún tipo de poderes de sangre durante el torneo. Se sabe que los jueces Brujah son sorprendentemente hábiles para detectar cualquier intento de hacer trampa.\nEstás bastante seguro de que algunos (si no la mayoría) no son atrapados, así que podrías intentarlo. Podría darte una ventaja seria durante el concurso o hacer que te descalifiquen si te atrapan."
 brujah_panegyra_events.1003.a: "No es trampa si no me atrapan."
 brujah_panegyra_events.1003.b: "Mi cuerpo perfecto es toda la trampa que necesito."
 brujah_panegyra_events.1003.c: "Hacer trampa es para perdedores."
 brujah_panegyra_events.1003.d: "¡Atrapado!"
 
 brujah_panegyra_events.1011.t: "Preparación Perfecta"
 brujah_panegyra_events.1011.desc: "Para algunos de los Brujah tradicionalistas, los Kerykes es el evento más importante de la Panegyra. Pasan años preparando su discurso, buscando las palabras y entonaciones perfectas para su actuación (probablemente muy larga) durante el evento.\nPara un forastero, es bastante difícil irrumpir en este nivel de competición sin una buena cantidad de preparación. Aunque se sabe que ocurren sorpresas, lo más probable es que sirvan para evitar que los concursantes habituales piensen que necesitan hacer un discurso aún más largo para ganar."
 brujah_panegyra_events.1011.a: "¡Tengo todo perfectamente planeado!"
 brujah_panegyra_events.1011.b: "Podría aprender una o dos cosas de tales oradores."
 brujah_panegyra_events.1011.c: "Solo preparemos lo necesario."
  
 brujah_panegyra_events.1012.t: "Negro Literario"
 brujah_panegyra_events.1012.desc: "Mientras deambulas por los terrenos, notas que uno de los participantes de los Kerykes ha dejado su discurso desatendido mientras habla con otro invitado no muy lejos de aquí. Tal muestra es bastante rara y, al confirmar que parece que no hay nadie cerca, percibes una oportunidad.\nTodo vale en la guerra y en los juegos, ¿verdad?"
 brujah_panegyra_events.1012.a: "¡Quémalo! Porque es divertido."
 brujah_panegyra_events.1012.b: "Robarlo para perjudicar su actuación."
 brujah_panegyra_events.1012.c: "Estudiarlo para aprender de él."
 brujah_panegyra_events.1012.d: "Solo devuélvelo cortésmente."
 
 brujah_panegyra_events.1013.t: "Listo para Hablar"
 brujah_panegyra_events.1013.desc: "El evento principal de los Kerykes es el momento en que pronuncias tu discurso frente a los jueces y los espectadores. Los que provienen de un entorno tradicionalista hacen un discurso muy largo y pesado que a menudo les gana el respeto de sus compañeros. Por otro lado, los concursantes más jóvenes tienden a favorecer un enfoque más "directo" y a hablar de temas más modernos, llegando incluso a usar los Kerykes como plataforma para desahogar algunas frustraciones políticas.\nLos intentos de hacer trampa no son raros durante el concurso, ya que las disciplinas mentales pueden ser muy útiles para influir en el jurado. Sin embargo, como siempre, los árbitros Brujah observan atentamente desde la barrera y están listos para pronunciar una descalificación rápida si es necesario."
 brujah_panegyra_events.1013.a: "Solo un pequeño empujón mental..."
 brujah_panegyra_events.1013.b: "¡Me darás el primer lugar!"
 brujah_panegyra_events.1013.c: "Por mi primer punto de ciento sesenta y seis..."
 brujah_panegyra_events.1013.d: "Sigamos con esto."
  
 brujah_panegyra_events.1021.t: "Ojos de Tigre"
 brujah_panegyra_events.1021.desc: "El boxeo en la Panegyra casi se ha elevado a una forma de arte, principalmente porque algunos de sus practicantes han tenido siglos literalmente de práctica para dominarlo. Si quieres competir contra oponentes tan intimidantes, necesitarás un régimen de entrenamiento serio. Afortunadamente, la Panegyra tiene amplias posibilidades para ese entrenamiento, aunque los resultados son siempre impredecibles, el cuerpo vampírico no reacciona de la misma manera que el mortal a tales ejercicios."
 brujah_panegyra_events.1021.a: "¡Que empiece el montaje!"
 brujah_panegyra_events.1021.b: "Soy tan perfecto como siempre lo seré."
 
 brujah_panegyra_events.1022.t: "Compañero de Entrenamiento"
 brujah_panegyra_events.1022.desc: "Los concursantes se preparan para el evento de boxeo y muchos buscan compañeros de entrenamiento para poner realmente a prueba sus habilidades. Uno de esos concursantes se te ha acercado con una súplica para tal asociación. Depende de ti elegir si darás todo de ti, dando potencialmente una ventaja a este oponente, o si, por el contrario, intentarás socavar sutilmente su potencial."
 brujah_panegyra_events.1022.a: "Haz lo tuyo, solo miraré."
 brujah_panegyra_events.1022.b: "¡Más rápido! ¡Puedes hacerlo mejor que eso!"

 brujah_panegyra_events.1023.t: "Arremetiendo"
 brujah_panegyra_events.1023.desc: "El boxeo es, con diferencia, la competición con más descalificaciones en la Panegyra. Tener dos vampiros golpeándose es una receta para el frenesí fácil, y el concurso es casi tanto una prueba de fuerza de voluntad como física. Caer en un frenesí es una pérdida instantánea, pero refrenar demasiado tus instintos también puede perjudicar tu rendimiento general. Se debe lograr un equilibrio delicado para ganar."
 brujah_panegyra_events.1023.a: "¡Déjalo salir!"
 brujah_panegyra_events.1023.b: "¡Déjarlo SALIR todo!"
 brujah_panegyra_events.1023.c: "Calmado y sereno."
  
 brujah_panegyra_events.1031.t: "Juego Comenzado"
 brujah_panegyra_events.1031.desc: "Una gran variedad de juegos de mesa están presentes durante cada Panegyra, aunque la mayoría solo se usan para entrenamiento o fines novedosos y no para la competición real. Aún así, muchos vampiros encuentran estos entretenimientos sorprendentemente cercanos a algunas de las situaciones que tienen que enfrentar noche tras noche. Como tal, no es raro que muchos espectadores se unan a los concursantes durante el tiempo de inactividad, probando las diversas actividades presentes en el lugar."
 brujah_panegyra_events.1031.a: "¿Quizás un juego de trivia?"
 brujah_panegyra_events.1031.b: "¡Los juegos de guerra son los mejores!"
 brujah_panegyra_events.1031.c: "Centrémonos en la competición que tenemos por delante."
  
 brujah_panegyra_events.1032.t: "Reglas Extrañas"
 brujah_panegyra_events.1032.desc: "El mundo mortal ha producido muchos juegos de mesa y muchos conjuntos de reglas diferentes para cada uno. Puede ser difícil seguirles la pista, especialmente para los vampiros que a menudo son conocidos por ser rígidos en sus costumbres. Uno de esos concursantes ha venido a pedirte ayuda para entender un juego particularmente arcano de tu zona. Una buena oportunidad para presumir de tu conocimiento... o para simplemente burlarte de ellos por sus deficiencias."
 brujah_panegyra_events.1032.a: "¡Los niños saben jugar a este juego!"
 brujah_panegyra_events.1032.b: "Entonces, durante el primer turno..."
  
 brujah_panegyra_events.1033.t: "Movimientos de la Yihad"
 brujah_panegyra_events.1033.desc: "Uno de tus primeros oponentes durante el concurso de juegos de mesa ve claramente el juego que estás jugando como una representación de la Yihad, el llamado Gran Juego de política e intrigas que juegan los Cainitas. Esta no es una práctica poco común, ya que muchos vampiros ven a los demás como piezas en un tablero y planean sus movimientos con décadas de antelación. Sin embargo, es más raro durante una competición real, y tu oponente parece más concentrado en empujarte a hacer algunas declaraciones políticas sutiles con tu juego que en jugarlo realmente."
 brujah_panegyra_events.1033.a: "Solo juega al maldito juego."
 brujah_panegyra_events.1033.b: "Si esta pieza representa a este Príncipe, entonces..."
    
 brujah_panegyra_events.1041.t: "Vitrineo"
 brujah_panegyra_events.1041.desc: "Antes del evento principal, la Panegyra ha proporcionado algo de entretenimiento con una exhibición de mortales y luchadores emproblemados atacándose entre sí. Si bien ciertamente carecen de experiencia y fuerza vampírica bruta, usan algunas tácticas más modernas que podrían ser útiles durante el concurso.\nEstos también son unos magníficos especímenes mortales y notas a algunos vampiros mirándolos con hambre, quizás esperando algo de su probablemente dulce y fuerte sangre..."
 brujah_panegyra_events.1041.a: "¡Qué apetitoso!"
 brujah_panegyra_events.1041.b: "Quiero este otro."
 brujah_panegyra_events.1041.c: "Solo estudia su combate."
 
 brujah_panegyra_events.1042.t: "Combate de Exhibición"
 brujah_panegyra_events.1042.desc: "Los jueces de la Panegyra te informan que has sido elegido para un combate de exhibición antes de que comience formalmente el concurso de lucha. Esto es un arma de doble filo, ya que si das todo de ti, es probable que reveles tus debilidades y fortalezas a los otros concursantes. Si no lo haces, sin embargo, es probable que pierdas, lo que siempre es un asunto vergonzoso frente a tantos espectadores."
 brujah_panegyra_events.1042.a: "Pierde para ocultar tus tácticas."
 brujah_panegyra_events.1042.b: "¡Gana por la gloria!"
  
 brujah_panegyra_events.1043.t: "Combate Arreglado"
 brujah_panegyra_events.1043.desc: "Un sirviente de otro concursante anónimo se te ha acercado antes de que comenzara el concurso de lucha. Identificándote como una amenaza potencial para su victoria, te ofrecen algo de oro para que pierdas uno de tus primeros combates, eliminándote como competidor para las etapas posteriores. Se sabe que los jueces de la Panegyra son notablemente perceptivos para notar el uso de poderes vampíricos... pero también notablemente torpes para considerar que las viejas trampas y amaños también pueden ocurrir, por lo que es muy poco probable que te atrapen."
 brujah_panegyra_events.1043.a: "El oro es más útil que la gloria."
 brujah_panegyra_events.1043.b: "...¡pero la gloria es eterna!"
   
 brujah_panegyra_events.1051.t: "Carro Dorado"
 brujah_panegyra_events.1051.desc: "Los organizadores de esta Panegyra han decidido que esta vez será una carrera de carros, una tradición muy antigua que se remonta a las Olimpiadas mortales. Lamentablemente, los carros han sido casi olvidados por los mortales de esta era oscura y conseguir uno suficientemente impresionante y eficiente no será tarea barata.\nLos artesanos (a menudo ghouls provenientes de una larga línea de fabricantes de carros alimentados por vampiros) están en las afueras de la Panegyra, listos para ofrecerte su trabajo para que lo uses. ¿Cuál será tu elección?"
 brujah_panegyra_events.1051.a: "¡Este barato será más que suficiente!"
 brujah_panegyra_events.1051.b: "Uno robusto y sólido."
 brujah_panegyra_events.1051.c: "¡Solo los carros dorados de antaño servirán!"

 brujah_panegyra_events.1052.t: "Justa Nocturna"
 brujah_panegyra_events.1052.desc: "La justa ha sido un pasatiempo popular para los nobles mortales durante algún tiempo, pero ha sido bastante más lenta en ser adoptada por los vampiros de pensamiento mucho más tradicionalista. Aún así, una generación más joven de Cainitas nació en esta era y a veces incluso eran nobles que practicaban la justa ellos mismos. Como tal, ha ganado suficiente tracción como para aparecer a veces como una competición de la Panegyra.\nEs mortal, ya que la justa requiere no inmutarse, sabiendo muy bien que tu oponente podría tratar sutilmente de usar el poder de su sangre para matarte directamente cuando tus lanzas choquen."
 brujah_panegyra_events.1052.a: "El miedo no está en mi vocabulario."
 brujah_panegyra_events.1052.b: "Retrocedamos un paso antes del contacto..."
 
 brujah_panegyra_events.1053.t: "Sangre Útil"
 brujah_panegyra_events.1053.desc: "Los organizadores de la Panegyra han decidido que, esta vez, no se permiten caballos emproblemados durante el concurso de carreras de caballos. Habrá pruebas como de costumbre para asegurarse de que nadie intente hacer trampa.\nSin embargo, esto te da una oportunidad, ya que notas un establo desprotegido en el camino al tuyo propio. Con un pequeño soborno al mozo de cuadra y un poco de tu propia sangre, podrías transformar el caballo de uno de los otros concursantes en un ghoul, asegurando así su descalificación en el proceso."
 brujah_panegyra_events.1053.a: "Los planes mezquinos son los mejores planes."
 brujah_panegyra_events.1053.b: "...sigue siendo demasiado mezquino."
 
