l_spanish:
 oust_mithras_objective_decision: "Ocaso del Sol"
 oust_mithras_objective_decision_tooltip: "Si tienes éxito, cosecharás grandes recompensas y paralizarás para siempre el Culto de Mitras"
 oust_mithras_objective_decision_desc: "Mitras y su progenie han sido una plaga en estas islas desde que llegó aquí huyendo, huyendo de sus fracasos en el continente. Hace mucho que llegó el momento de que los Kindred de Albión reclamen su patria de este supuesto 'Dios' persa."
 #oust_mithras_objective_decision_effect_tooltip: "Emite una proclamación para decir que Britania está libre de la influencia de Mitras."
 oust_mithras_objective_decision_effect_tooltip2: "Esto paralizará la Vía Mitras, te otorgará gran prestigio y formará un nuevo grupo de guerreros dedicados a la defensa de Albión." 
 oust_mithras_objective_decision_confirm: "Finalmente, es hora"
 oust_mithras_custom_decision: "Necesitas no tener vasallos de la fe [GetFaithByKey('viamithras').GetName]. Los Barones no importan"
 oust_mithras_custom_decision2: "El propio [GetScriptedCharacterByHistoryID('505071').GetFirstName] necesita estar muerto o en $pod_torpor$"
 mithras_victory_objective_decision: "El Cetro y el Sol"
 mithras_victory_objective_decision_tooltip: "A medida que el Culto de Mitras crece en influencia, el $pod_clan$ Ventrue caerá bajo su control"
 mithras_victory_objective_decision_desc: "Mitras estuvo cerca de dominar el panorama religioso una vez, en la Antigua Roma. Esta noche, la humanidad parece inalcanzable, pero como miembro prominente de los Ventrue, aún existe la posibilidad de tomar el control del $pod_clan$ a través de la fe. Si primero se resuelven algunos asuntos menores..."
 mithras_victory_objective_decision_effect_tooltip2: "El Culto de Mitras será fortalecido, y la mayoría de los Ventrue se convertirán a él, entrelazando para siempre el $pod_clan$ y la fe" 
 mithras_victory_objective_decision_confirm: "$pod_clan$ y fe, como uno"
 mithras_victory_custom_decision: "[GetScriptedCharacterByHistoryID('505050').GetFirstName], [GetScriptedCharacterByHistoryID('505082').GetFirstName] y [GetScriptedCharacterByHistoryID('790101').GetFirstName], los tres principales rivales por el dominio del clan Ventrue, deben estar muertos o en $pod_torpor$"
 mithras_victory_custom_decision2: "Ningún otro Ventrue aparte de ti mismo o [GetScriptedCharacterByHistoryID('505071').GetFirstName] puede tener un [title|E] de Imperio. A menos que ellos mismos sean miembros del Culto de Mitras"
 toreador_victory_objective_decision: "Soñando de Nuevo"
 toreador_victory_objective_decision_tooltip: "Una ocasión trascendental que resonará en toda la Historia $pod_cainite$."
 toreador_victory_objective_decision_desc: "En 1204, ocurrió lo impensable, Miguel, Patriarca del Sueño de Constantinopla, murió mientras su ciudad ardía. Desde ese momento fatídico, numerosos seguidores del difunto Arcángel han intentado recrear esta santísima utopía."
 toreador_victory_objective_decision_confirm: "Espero que Miguel esté mirando"
 toreador_victory_objective_decision_effect_tooltip: "Se te presentará una opción entre renovar la fe del Arcángel o simplemente disfrutar de las recompensas materiales." 
 shadow_reconquista_objective_decision: "Sombra Reconquista"
 shadow_reconquista_objective_decision_tooltip: "Esto complacerá a los líderes del $pod_clan$ Lasombra y, bueno, allanará tu camino hacia cosas mayores por venir."
 shadow_reconquista_objective_decision_desc: "En un intento equivocado de retener su poder político, los miembros [Glossary('Ashirra','game_concept_ashirra_desc')] del $pod_clan$ Lasombra han desencadenado una guerra civil que casi ha puesto fin al dominio de los Lasombra en Iberia. Deben ser detenidos lo antes posible."
 shadow_reconquista_objective_decision_confirm: "Su rebelión ha terminado"
 shadow_reconquista_objective_decision_effect_tooltip: "Usurparás o crearás el título del Mar de Sombras (Italia) siempre que no esté en manos de un no Lasombra. Esto puede resultar impopular durante algún tiempo." 
 shadow_reconquista_objective_decision_custom: "No debe haber fieles [Glossary('Ashirra','game_concept_ashirra_desc')] en tu reino. Los Barones no cuentan" 
 einherjar_victory_objective_decision: "Derrotando al Ragnarök"
 einherjar_victory_objective_decision_tooltip: "Más allá del Ragnarök yace la posibilidad de un futuro para tu pueblo."
 einherjar_victory_objective_decision_desc: "Los Hijos de Canarl están siendo acosados por la llegada del cristianismo. Odín está ausente y su propia gente se vuelve contra ellos con horcas y fuego. Como los Ventrue alemanes ya han asegurado ciudades en el sur de Escandinavia, parece que el tiempo de los [Glossary('Einherjar','game_concept_einherjar_desc')] ha terminado."
 einherjar_victory_objective_decision_confirm: "El Valhalla está asegurado"
 einherjar_victory_objective_decision_effect_tooltip: "Utilizarás tus tremenda e inesperadas victorias para revitalizar la fe [Glossary('Einherjar','game_concept_einherjar_desc')] y llevarla a esta nueva era." 
 ashirra_deconquista_objective_decision: "Iberia después de la Medianoche"
 ashirra_deconquista_objective_decision_tooltip: "Terminar la guerra civil ibérica a favor de los [Glossary('Ashirra','game_concept_ashirra_desc')] es una tarea tremenda, pero con recompensas dignas."
 ashirra_deconquista_objective_decision_desc: "Los fieles [Glossary('Ashirra','game_concept_ashirra_desc')] han sufrido revés tras revés desde el inicio de la guerra civil de los Lasombra. Con el respaldo del Mar de Sombras, la victoria de De Ruiz parece asegurada. Pero quizás aún puedas cambiar el rumbo..."
 ashirra_deconquista_objective_decision_confirm: "Los Fieles han triunfado"
 ashirra_deconquista_objective_decision_effect_tooltip: "Tu victoria paralizará el poder del Mar de Sombras, te pondrá en línea para cosas mayores por venir y te permitirá reconstruir la Iberia devastada por la guerra." 
 ashirra_deconquista_objective_decision_custom: "No debe haber personajes de Vía Noctis en tu reino. Los Barones no cuentan" 
 malkavian_victory_objective_decision: "La Pequeña Broma"
 malkavian_victory_objective_decision_tooltip: "Malkav te está hablando y te dice que hagas cosas. Probablemente."
 malkavian_victory_objective_decision_desc: "Tienes una compulsión, o una visión profética, o un sueño febril... de todos modos, estás casi seguro de que necesitas reunir al $pod_clan$ Malkavian para hacer un gran ritual en Bohemia. O en Jerusalén."
 malkavian_victory_objective_decision_confirm: "¡Cosas importantes por venir!"
 malkavian_victory_objective_decision_effect_tooltip: "Realizarás un ritual con perfecta precisión y conocimiento de lo que estás haciendo. Probablemente." 
 senate_victory_objective_decision: "La República Eterna"
 senate_victory_objective_decision_tooltip: "Roma ha caído, pero no su espíritu republicano. El $pod_clan$ Ventrue se mueve en nuevas direcciones, pero puede ser orientado hacia otras más antiguas y orgullosas."
 senate_victory_objective_decision_desc: "Antes de su corrupción en un pozo decadente de pecado, la Roma No-muerta era una utopía de $pod_cainites$ Republicanos. El sueño de un Senado donde todos, bueno, la mayoría de los clanes, puedan tener un representante aún es alcanzable. Si primero se frena el intento equivocado de los Ventrue alemanes de construir un nuevo imperio..."
 senate_victory_objective_decision_confirm: "Somos el Senado"
 senate_victory_objective_decision_effect_tooltip: "La Roma Republicana será reconstruida, y se implementarán nuevas políticas para recompensar y castigar a los Clanes en consecuencia." 
 senate_victory_objective_decision_custom: "El título [GetTitleByKey('e_fiefs_of_the_black_cross').GetNameNoTier] debe ser tuyo, o no existir en absoluto" 
 brujah_victory_objective_decision: "Cartago"
 brujah_victory_objective_decision_tooltip: "Nunca olvidaremos Cartago, la utopía de Troile de hombres y $pod_cainites$. Quemada por los celosos romanos, su espíritu aún vive en cada uno de nosotros."
 brujah_victory_objective_decision_desc: "Roma y Camila destruyeron nuestra amada Cartago, la ciudad perfecta. Pero nunca desaparecerá por completo mientras el $pod_clan$ Brujah aún viva. Quizás estos tiempos, en los que la propia Roma ha caído, podrían ver el renacimiento de nuestra utopía."
 brujah_victory_objective_decision_confirm: "Troile estaría orgullosa"
 brujah_victory_objective_decision_effect_tooltip: "Tendrás una opción sobre cómo manejar este momento importante. Ya sea como una herramienta política o una utopía verdadera y divisiva." 
 brujah_victory_objective_decision_custom: "[GetScriptedCharacterByHistoryID('790101').GetFirstName], el entonces y ahora Príncipe de Roma que una vez destruyó nuestra ciudad, debe estar muerto o en $pod_torpor$" 
 babayaga_victory_objective_decision: "Tu Abuela Cariñosa"
 babayaga_victory_objective_decision_tooltip: "El $pod_clan$ Nosferatu está condenado, a menos que logres forjar una alianza con la Reina Bruja."
 babayaga_victory_objective_decision_desc: "Absimilliard, progenitor del $pod_clan$ Nosferatu, está ahí fuera, planeando la muerte de su progenie. La única esperanza reside en Baba Yaga, la Abuelita, quien logró detenerlo una vez antes. Complácela, y quizás aún puedas sobrevivir a la tormenta que se avecina."
 babayaga_victory_objective_decision_confirm: "¡Abuela, atiende nuestra súplica!"
 babayaga_victory_objective_decision_effect_tooltip: "El $pod_clan$ Nosferatu se unirá detrás de Baba Yaga y su campeona elegida, tú.\nTe permite reclutar [GetMaA('zmei').GetName] como [men_at_arms|E]." 
 babayaga_victory_objective_decision_custom: "La vieja rival de Baba Yaga, [GetScriptedCharacterByHistoryID('790274').GetFirstName] de la Rus Blanca, debe estar muerta o en $pod_torpor$" 
 nosferatu_victory_objective_decision: "Horrores en la Oscuridad"
 nosferatu_victory_objective_decision_tooltip: "Las amenazas literalmente acechan en la oscuridad. El $pod_clan$ Nosferatu necesita un protector."
 nosferatu_victory_objective_decision_desc: "Tu $pod_clan$ es cazado por su propio progenitor, Absimilliard. Como tal, te ves obligado a escabullirte en las sombras, esperando que su ira te consuma. Pero quizás alguien pueda unir al $pod_clan$ y contraatacar..."
 nosferatu_victory_objective_decision_confirm: "Te soportaremos, fundador"
 nosferatu_victory_objective_decision_effect_tooltip: "Unificarás al $pod_clan$ Nosferatu, un activo poderoso para tener con un linaje tan resistente y astuto."  
 nosferatu_exclusive_decisions_tt: "Horrores en la Oscuridad y Tu Abuela Cariñosa son mutuamente excluyentes."
 urshulgi_victory_objective_decision: "Un Dios Sueña"
 urshulgi_victory_objective_decision_tooltip: "Solo el hijo favorito, Ur-Shulgi, conoce la voluntad de Haqim."
 urshulgi_victory_objective_decision_desc: "El $pod_clan$ Assamita está en negación. Nuestro destino es limpiar la tierra de la sangre impura de los Hijos de Khayyin y reclamarla para nuestro progenitor, Haqim. Debemos mostrarles la verdad."
 urshulgi_victory_objective_decision_confirm: "El Pastor Negro asciende"
 urshulgi_victory_objective_decision_effect_tooltip: "El $pod_clan$ Assamita se convertirá a tu culto, y el sueño de Ur-Shulgi destrozará las almas de los impuros." 
 urshulgi_victory_objective_decision_custom: "Los principales rivales por el control de Alamut, Jamal, Nakurtum y Al-Ashrad, deben estar muertos o en $pod_torpor$" 
 assamite_victory_objective_decision: "Una Casa Dividida"
 assamite_victory_objective_decision_tooltip: "Los Hijos de Haqim necesitan un nuevo liderazgo unificador."
 assamite_victory_objective_decision_desc: "El $pod_clan$ Assamita está dividido entre fes competidoras, cultos secretos e intereses personales. Estas divisiones son profundas y amenazan con destruir al $pod_clan$ antes de mucho tiempo. Deben ser sanadas."
 assamite_victory_objective_decision_confirm: "Hermano contra hermano, no más"
 assamite_victory_objective_decision_effect_tooltip: "Unificarás al $pod_clan$ Assamita y elegirás un camino para su destino."  
 assamite_victory_objective_decision_custom: "Las sectas cismáticas, [GetTitleByKey('k_webofknives').GetNameNoTier] y [GetTitleByKey('k_losttribe').GetNameNoTier], están destruidas o controladas directamente por ti"  
 sinner_victory_objective_decision: "El Pecado Político"
 sinner_victory_objective_decision_tooltip: "Los Pecadores pueden transformar esta época moralmente estricta en algo mucho más."
 sinner_victory_objective_decision_desc: "Esta noche, los Pecadores son criaturas lamentables, apenas coherentes en su deseo de decadencia. Pero una vez, los Pecadores gobernaron el imperio $pod_cainite$ más poderoso, la propia Roma. Podría serlo de nuevo."
 sinner_victory_objective_decision_confirm: "Amigos, romanos, conciudadanos, prestadme vuestros oídos"
 sinner_victory_objective_decision_effect_tooltip: "La Roma Eterna será restaurada. El Sendero del Pecado recreará su dominio político." 
 ventrue_victory_objective_decision: "Rey de Reyes"
 ventrue_victory_objective_decision_tooltip: "Hay demasiados reyes de los Kindred en este mundo."
 ventrue_victory_objective_decision_desc: "Eres del $pod_clan$ de los Gobernantes, pero ¿y si pudieras ser el gobernante de los gobernantes? El $pod_clan$ Ventrue está en su momento más fuerte cuando está unido, después de todo..."
 ventrue_victory_objective_decision_confirm: "Primero el $pod_clan$ Ventrue, luego el mundo"
 ventrue_victory_objective_decision_effect_tooltip: "Unificarás el $pod_clan$ Ventrue, asegurando su dominio sobre la raza Kindred."  
 ventrue_victory_objective_decision_custom: "Ningún Ventrue aparte de ti mismo puede tener un [title|E] de Imperio"  
 lasombra_victory_objective_decision: "Fe en las Sombras"
 lasombra_victory_objective_decision_tooltip: "Esta desordenada guerra civil debe terminar. Necesitas actuar antes de que sea demasiado tarde."
 lasombra_victory_objective_decision_desc: "El $pod_clan$ Lasombra está en guerra consigo mismo desde la secesión del movimiento [Glossary('Ashirra','game_concept_ashirra_desc')]. Esto ha debilitado el control del Mar de Sombras sobre el Mediterráneo y debe detenerse ahora."
 lasombra_victory_objective_decision_confirm: "Hora de cerrar esta página de nuestra Historia"
 lasombra_victory_objective_decision_effect_tooltip: "El movimiento [Glossary('Ashirra','game_concept_ashirra_desc')] restante será paralizado y tu autoridad sobre el $pod_clan$ será absoluta... por un tiempo." 
 lasombra_victory_objective_decision_custom: "Los [titles|E] del Imperio [GetTitleByKey('k_midnight_crescent').GetNameNoTier] y [GetTitleByKey('e_ashirra').GetNameNoTier] deben ser controlados por ti o destruidos"  
 ashirra_victory_objective_decision: "Crescente sobre Sombras"
 ashirra_victory_objective_decision_tooltip: "El movimiento [Glossary('Ashirra','game_concept_ashirra_desc')] debe triunfar en la guerra civil en curso."
 ashirra_victory_objective_decision_desc: "El $pod_clan$ Lasombra está en guerra, y la parte musulmana ha formado una coalición de la que eres parte, los [Glossary('Ashirra','game_concept_ashirra_desc')]. Para que los fieles estén a salvo, se debe lidiar con el antiguo liderazgo de los Lasombra."
 ashirra_victory_objective_decision_confirm: "Hora de limpiar a los rezagados"
 ashirra_victory_objective_decision_effect_tooltip: "A los Lasombra cristianos restantes se les dará una última oportunidad de convertirse y tu autoridad como Mulá Eterno será asegurada."  
 ashirra_victory_objective_decision_custom: "O controlas tú el [GetTitleByKey('e_sea_of_shadows').GetNameNoTier], o nadie lo hace"  
 heretic_victory_objective_decision: "Verdad hasta Caín"
 heretic_victory_objective_decision_tooltip: "Si no se hace nada, el Tercer Caín regresará a un mundo condenado lleno de incrédulos."
 heretic_victory_objective_decision_desc: "La Iglesia del Tercer Caín, o Herejía $pod_cainite$ para los forasteros, está muriendo. Cazada en casi todos los rincones de Europa, su liderazgo roto, enfrenta la extinción. Un regreso es poco probable, pero... la fe no necesita razón después de todo."
 heretic_victory_objective_decision_confirm: "El Demiurgo recibe un duro golpe esta noche"
 heretic_victory_objective_decision_effect_tooltip: "Reactivarás la Iglesia, encontrando nuevos creyentes y una nueva era de expansión." 
 #anda_victory_objective_decision: "Trueno de las Estepas"
 #anda_victory_objective_decision_tooltip: "Estas nuevas tierras necesitan una conquista rápida y decisiva si vamos a soportar el contraataque de los $pod_wan_kuei$."
 #anda_victory_objective_decision_desc: "Viajando con nuestros parientes mongoles, los [Glossary('Anda','podgloss.anda')] han prosperado. Pero los $pod_wan_kuei$ chinos se preparan para la guerra, y debemos consolidar nuestra posición en el oeste antes de su ataque."
 #anda_victory_objective_decision_confirm: "Estas estepas son nuestras ahora"
 #anda_victory_objective_decision_effect_tooltip: "Eliminarás la amenaza de la invasión de los $pod_wan_kuei$ que de otro modo ocurriría en 1360 e inspirarás a los Gangrel occidentales a unirse a ti."  
 gangrel_victory_objective_decision: "El Azote"
 gangrel_victory_objective_decision_tooltip: "Tu mundo está muriendo, pero aún es tiempo de contraatacar."
 gangrel_victory_objective_decision_desc: "Durante siglos, los Gangrel han sido expulsados de la política Vampírica. Peor aún, sus parientes han sido cazados y convertidos por la fuerza. Tiene que parar."
 gangrel_victory_objective_decision_confirm: "La Era del Lobo comienza"
 gangrel_victory_objective_decision_effect_tooltip: "Al unificar el $pod_clan$ Gangrel, paralizarás a los llamados clanes civilizados." 
 tremere_victory_objective_decision: "La Voluntad de Tremere"
 tremere_victory_objective_decision_tooltip: "El $pod_clan$ Tremere es joven y está rodeado de enemigos. Debemos intensificar y fortificar nuestra nueva posición antes de que sea demasiado tarde."
 tremere_victory_objective_decision_desc: "El $pod_clan$ Tremere nació en la guerra y el dolor. Los Tzimisce son implacables, y nuestra campaña de propaganda contra los Salubri aún podría volverse en nuestra contra. No debemos detenernos y aplastar a todos los que se opongan a la voluntad de Tremere."
 tremere_victory_objective_decision_confirm: "Un nuevo $pod_clan$, seguro por fin"
 tremere_victory_objective_decision_effect_tooltip: "Te convertirás en el Consejero Principal del $pod_clan$, y desatarás una maldición sobre tus enemigos restantes."  
 tremere_victory_objective_decision_custom: "El [GetTitleByKey('e_voivodate').GetNameNoTier] Tzimisce debe ser destruido"
 tremere_victory_objective_decision_customb: "Debemos asegurarnos de que los Salubri no tengan un [title|E] de imperio"
 tzimisce_victory_objective_decision: "La Gran Guerra"
 tzimisce_victory_objective_decision_tooltip: "Nuestra incapacidad para aplastar a los insolentes Usurpadores nos ha convertido en el hazmerreír de la política $pod_cainite$ durante demasiado tiempo."
 tzimisce_victory_objective_decision_desc: "El $pod_clan$ Tzimisce yace dividido, incapaz de responder adecuadamente a la minúscula amenaza que deberían ser las incursiones de los Tremere. Necesitamos un nuevo liderazgo, más fuerte."
 tzimisce_victory_objective_decision_confirm: "Esta convocatoria es para un festín..."
 tzimisce_victory_objective_decision_effect_tooltip: "Elegirás el camino a seguir para el $pod_clan$ Tzimisce." 
 tzimisce_victory_objective_decision_custom: "El título [GetTitleByKey('e_tremere').GetNameNoTier] debe ser destruido"
 cappadocian_victory_objective_decision: "El Códice de Sargón"
 cappadocian_victory_objective_decision_tooltip: "La reliquia más sagrada del $pod_clan$ Cappadocio debe ser recuperada."
 cappadocian_victory_objective_decision_desc: "Se dice que contiene todas las profecías hechas por Sargón -Cappadocius- durante sus días mortales, el códice se perdió y se fragmentó cuando Lázaro perdió su batalla contra Constancia. Reforjarlo sería un evento trascendental."
 cappadocian_victory_objective_decision_confirm: "...Me está llamando"
 cappadocian_victory_objective_decision_effect_tooltip: "Elegirás qué hacer con esta fuente definitiva de conocimiento."  
 giovanni_victory_objective_decision: "La Conspiración"
 giovanni_victory_objective_decision_tooltip: "El $pod_clan$ Cappadocio está reteniendo nuestro verdadero potencial. Podemos ser mucho más."
 giovanni_victory_objective_decision_desc: "Somos una nueva adición al $pod_clan$ Cappadocio, pero nuestros 'benefactores' ya han superado su utilidad. Es hora de pensar en nuestro futuro como un $pod_clan$ independiente..."
 giovanni_victory_objective_decision_confirm: "Invitemos a nuestro querido antepasado a un festín..."
 giovanni_victory_objective_decision_effect_tooltip: "Pondrás en marcha el nacimiento del $pod_clan$ Giovanni." 
 giovanni_victory_objective_decision_custom: "O controlas tú el [GetTitleByKey('k_erciyes').GetNameNoTier], o nadie lo hace"
 furores_victory_objective_decision: "Nuevos Comienzos"
 furores_victory_objective_decision_tooltip: "Estamos muriendo lentamente en las guerras mezquinas de los Ancianos de nuestra especie, sin libre albedrío del que hablar. Esto tiene que parar."
 furores_victory_objective_decision_desc: "La corrupta jerarquía Vampírica está estrangulando cualquier esperanza de que los más jóvenes hagan algo. Si esto va a cambiar, debe haber una revolución lo suficientemente fuerte como para resistir su contraataque."
 furores_victory_objective_decision_confirm: "Un futuro completamente nuevo nos espera"
 furores_victory_objective_decision_effect_tooltip: "Confederarás los Estados Libres en una nueva y poderosa entidad política."  
 setite_victory_objective_decision: "El Abrazo de la Serpiente"
 setite_victory_objective_decision_tooltip: "El amoroso abrazo de Set y el máximo deseo de libertad moral deben ser difundidos por todas partes."
 setite_victory_objective_decision_desc: "Los llamados Hijos de Caín están equivocados, creyendo en una parodia retorcida de la verdad. Todos somos Setitas, y al asegurar nuestras fronteras tradicionales, daremos el primer paso para hacerles entender."
 setite_victory_objective_decision_confirm: "Demos la bienvenida a nuestros nuevos hermanos"
 setite_victory_objective_decision_effect_tooltip: "La verdad será difundida por todas partes, y llevarás la lucha a los enemigos tradicionales de tu $pod_clan$." 
 setite_victory_objective_decision_custom: "El [title|E] [GetTitleByKey('e_ashirra').GetNameNoTier] debe ser destruido"
 salubri_victory_objective_decision: "El Ajuste de Cuentas"
 salubri_victory_objective_decision_tooltip: "Muchos piensan que estamos viviendo las últimas horas de los Salubri como $pod_clan$, ya que somos rápidamente destruidos por nuestros muchos enemigos."
 salubri_victory_objective_decision_desc: "El $pod_clan$ Salubri yace disperso, casi llevado a la extinción por el brutal asalto de los Usurpadores Tremere. Peor aún, enemigos más antiguos como los Baali están aprovechando nuestra debilidad. Debemos contraatacar antes de que sea demasiado tarde."
 salubri_victory_objective_decision_confirm: "La venganza tiene un sabor agridulce"
 salubri_victory_objective_decision_effect_tooltip: "Unificarás el $pod_clan$, expondrás las mentiras de los Tremere y elegirás un camino para ti mismo." 
 salubri_victory_objective_decision_custom: "Los títulos Baali, [GetTitleByKey('k_moloch').GetNameNoTier] y [GetTitleByKey('k_angellisater').GetNameNoTier], deben ser destruidos"
 baali_victory_objective_decision: "El Fin de las Eras"
 baali_victory_objective_decision_tooltip: "Esta ilusión corrupta y dolorosa de la realidad debe terminar con la quema de toda la Creación."
 baali_victory_objective_decision_desc: "Nuestro amo, Nergal, estuvo muy cerca de terminar con este mundo miserable durante las Guerras Baali anteriores. Aunque los Molochim se nos oponen más que nunca, podríamos superarlos y acelerar la perdición de todos."
 baali_victory_objective_decision_confirm: "...Y así, el fin comienza"
 baali_victory_objective_decision_effect_tooltip: "Unificarás el $pod_clan$ Baali, convocarás poderosos demonios de los pozos y comenzarás la guerra final. Tu dinastía podrá reclutar [GetMaA('demons').GetName]" 
 baali_victory_objective_decision_custom: "Tu rival, los [GetTitleByKey('k_moloch').GetNameNoTier] deben ser destruidos. Al igual que los enemigos habituales de tu $pod_clan$, los Salubri [GetTitleByKey('k_olives').GetNameNoTier] y el imperio Assamita de [GetTitleByKey('e_assamites').GetNameNoTier]. Controlar esos títulos también funcionará."
 molochim_victory_objective_decision: "Protegiendo el Mal"
 molochim_victory_objective_decision_tooltip: "Somos los únicos que evitamos que los Niños regresen. Nuestro deber es ingrato, pero sagrado."
 molochim_victory_objective_decision_desc: "Si vamos a evitar que los insensatos Azaneali despierten horrores antiguos, deben ser derrotados decisivamente en la guerra civil en curso. Lamentablemente, también debemos lidiar con la enemistad de los Salubri y Assamitas, que no discriminan entre nosotros y nuestros hermanos caídos."
 molochim_victory_objective_decision_confirm: "Y ahora, debemos alimentarlos"
 molochim_victory_objective_decision_effect_tooltip: "Fortalecerás las doctrinas de Hyron y sus seguidores." 
 molochim_victory_objective_decision_custom: "Tu rival, los [GetTitleByKey('k_angellisater').GetNameNoTier] deben ser destruidos. Al igual que los enemigos habituales de tu $pod_clan$, los Salubri [GetTitleByKey('k_olives').GetNameNoTier] y el imperio Assamita de [GetTitleByKey('e_assamites').GetNameNoTier]"
 ravnos_victory_objective_decision: "Oeste y Este"
 ravnos_victory_objective_decision_tooltip: "Lejos de casa, debes hacerte un nombre."
 ravnos_victory_objective_decision_desc: "Eres parte de la pequeña minoría del $pod_clan$ Ravnos que no vive en la India. Este éxodo ha causado muchos problemas a tus parientes, ya que apenas eres reconocido como $pod_cainite$. Pero quizás puedas perdurar, e incluso prosperar, en estas circunstancias."
 ravnos_victory_objective_decision_confirm: "Surge un nuevo $pod_clan$ Ravnos"
 ravnos_victory_objective_decision_effect_tooltip: "Unificarás el $pod_clan$ Ravnos occidental y elegirás una postura para adoptar hacia tus hermanos orientales." 
 indian_victory_objective_decision: "Terminando lo Eterno"
 indian_victory_objective_decision_tooltip: "El subcontinente está destrozado por la guerra y los conflictos. Debes intervenir y actuar."
 indian_victory_objective_decision_desc: "La Guerra Eterna entre los $pod_cainites$ nativos de la India y los invasores [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] ha durado tanto como nadie puede recordar. La India nunca será libre a menos que alguien pueda unir a sus dispares defensores."
 indian_victory_objective_decision_confirm: "Finalmente, ganamos"
 indian_victory_objective_decision_effect_tooltip: "Unificarás la India, reclamarás el manto de Chakravarti y comenzarás la purga de los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] restantes." 
 kueijin_victory_objective_decision: "Auge del Sol Escarlata"
 kueijin_victory_objective_decision_tooltip: "La Guerra Eterna es un asunto sórdido, que tu pueblo no puede permitirse perder."
 kueijin_victory_objective_decision_desc: "La invasión [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] de la India se ha estancado durante milenios, con miles de muertos sin que los obstinados Kain-Jin parezcan más cerca de rendirse. No estarás atrapado con el mismo destino."
 kueijin_victory_objective_decision_confirm: "Envía un mensaje a las Cortes Centrales"
 kueijin_victory_objective_decision_effect_tooltip: "Unificarás la India. Luego elegirás cómo lidiar con las Cortes Centrales." 
 laibon_victory_objective_decision: "El Reino de Ébano"
 laibon_victory_objective_decision_tooltip: "Los Hijos de Cagn siempre están en conflicto interno, y esto ha permitido que amenazas extranjeras se afiancen en el Reino de Ébano."
 laibon_victory_objective_decision_desc: "África yace desunida, con $pod_cainites$ invasores del mundo musulmán y más allá reclamando nuestra tierra como propia. Es hora de rechazarlos."
 laibon_victory_objective_decision_confirm: "Hemos protegido África"
 laibon_victory_objective_decision_effect_tooltip: "Unificarás el Reino de Ébano y cosecharás el enorme prestigio que conlleva tal logro." 
 restore_the_dream: "Restaurando el Sueño"
 restore_the_dream_tooltip: "Mientras algunos Vampiros crean en él, el Sueño aún puede resurgir de sus cenizas."
 restore_the_dream_desc: "El 1204 destruyó la utopía sin igual que era el Sueño de Constantinopla. Una tragedia así marcará el comienzo de una terrible era de oscuridad para el mundo $pod_cainite$, a menos que alguien retome el manto de Miguel una vez más."
 restore_the_dream_confirm: "Como fue, será."
 restore_the_dream_effect_tooltip: "Crearás el [title|E] del Imperio del Sueño." 
 witching_lands: "Fundando las Tierras de Brujería"
 witching_lands_tooltip: "El tiempo de los Druidas ha llegado."
 witching_lands_desc: "Con el auge de los cultos druídicos y las brujas vampiros, los bosques de las Islas Británicas parecen haberse rebelado contra los antiguos dominios Cainitas. Un nuevo coro clama en las Islas del Cetro y Esmeralda; los Druidas - una vez rechazados por todos los Cainitas - ahora se alzan triunfantes, y sus bosques oscuros se extenderán para siempre."
 witching_lands_confirm: "Por siempre y para siempre."
 witching_lands_effect_tooltip: "Crearás el [title|E] de las Tierras de Brujería." 
 restore_the_black_cross: "Restaurando la Cruz Negra"
 restore_the_black_cross_tooltip: "Alemania necesita un liderazgo Ventrue fuerte más que nunca."
 restore_the_black_cross_desc: "La primera Cruz Negra de Hardestadt tenía fallos, pero aún así era un testimonio del liderazgo Ventrue que podríamos usar para legitimar nuestro gobierno."
 restore_the_black_cross_confirm: "Bajo la Cruz una vez más."
 restore_the_black_cross_effect_tooltip: "Crearás el [title|E] del Imperio de la Cruz Negra." 
 restore_the_voivodate: "Restaurando el Voivodato"
 restore_the_voivodate_tooltip: "Los Tzimisce son un grupo rebelde y necesitan un liderazgo fuerte."
 restore_the_voivodate_desc: "Una herramienta política, el Voivodato siempre ha sido disputado. Pero sigue siendo un título prestigioso, y podría fortalecerse más que nunca."
 restore_the_voivodate_confirm: "Entramos aquí una vez más."
 restore_the_voivodate_effect_tooltip: "Crearás el [title|E] del Imperio del Voivodato." 
 restore_the_sea_of_shadows: "Restaurando el Mar de Sombras"
 restore_the_sea_of_shadows_tooltip: "Nuestro progenitor, Lasombra, necesita una mano derecha fuerte para liderar su $pod_clan$."
 restore_the_sea_of_shadows_desc: "El reino de los Lasombra siempre había sido liderado por Montano, el vástago más leal de Lasombra. Pero los tiempos están cambiando, y un nuevo favorito podría surgir."
 restore_the_sea_of_shadows_confirm: "Padre, ¡mira mi ascensión!"
 restore_the_sea_of_shadows_effect_tooltip: "Crearás el [title|E] del Imperio del Mar de Sombras." 
 restore_avalon: "Restaurando Ávalon"
 restore_avalon_tooltip: "El reino de un Dios nunca muere realmente."
 restore_avalon_desc: "Como sabes, Mitras es más Dios que Vampiro. Tanto si decide regresar algún día con sus seguidores como si no, debes preparar un reino mortal para sus seguidores."
 restore_avalon_confirm: "Estamos listos."
 restore_avalon_effect_tooltip: "Crearás el [title|E] del Imperio de Ávalon." 
 restore_love: "Restaurando las Cortes del Amor"
 restore_love_tooltip: "Francia será Toreador, o no será en absoluto."
 restore_love_desc: "Las Cortes del Amor fueron la expresión del triunfo de la Matriarca Toreador sobre los Ventrue en Francia. Esta gran empresa política y artística no puede dejarse pudrir como historia."
 restore_love_confirm: "El amor es eterno, después de todo."
 restore_love_effect_tooltip: "Crearás el [title|E] del Imperio de las Cortes del Amor." 
 restore_midgard: "Restaurando Midgard"
 restore_midgard_tooltip: "Odín todavía nos vigila."
 restore_midgard_desc: "Midgard ha sufrido revés tras revés mientras los [Glossary('Einherjar','game_concept_einherjar_desc')] se desmoronaban ante la invasión de los Ventrue. Para sobrevivir, necesitarán un contraataque masivo y un nuevo Altísimo."
 restore_midgard_confirm: "El Ragnarök puede esperar."
 restore_midgard_effect_tooltip: "Crearás el [title|E] del Imperio de Midgard." 
 restore_ashirra: "Restaurar la Bay't el-Awal"
 restore_ashirra_tooltip: "Los Fieles necesitan un hogar."
 restore_ashirra_desc: "La Bay't el-Awal era una creación joven para los estándares de los Vampiros. Pero está respaldada por la fe de millones y, como tal, solo puede resurgir a su debido tiempo."
 restore_ashirra_confirm: "Alá es verdaderamente grande."
 restore_ashirra_effect_tooltip: "Crearás el [title|E] del Imperio de la Bay't el-Awal." 
 restore_alamut: "Restaurando Alamut"
 restore_alamut_tooltip: "Los Hijos de Haqim están perdidos sin su hogar."
 restore_alamut_desc: "Reputada inexpugnable, Alamut era más que una fortaleza para el $pod_clan$ Haqimita. Un símbolo político de la voluntad y unidad de Haqim, debe ser restaurada si los Hijos han de prosperar de nuevo."
 restore_alamut_confirm: "El viento está de nuevo a nuestro favor."
 restore_alamut_effect_tooltip: "Crearás el [title|E] del Imperio de Alamut." 
 restore_giovanni: "Restaurando la Familia"
 restore_giovanni_tooltip: "Los comienzos de la Familia no fueron tan fluidos como se anticipaba."
 restore_giovanni_desc: "Los Giovanni han sufrido reveses, pero ahora tenemos una eternidad para salir airosos. Empecemos por reunir a la familia."
 restore_giovanni_confirm: "El trato perfecto."
 restore_giovanni_effect_tooltip: "Crearás el [title|E] del Reino de los Giovanni." 
 restore_ravnos: "Restaurando el $pod_clan$"
 restore_ravnos_tooltip: "La Guerra Eterna no permite disidencias."
 restore_ravnos_desc: "Hemos perdido el corazón unificador del $pod_clan$ Ravnos. Este golpe aplastante a nuestro orgullo y espíritu debe ser vengado lo antes posible."
 restore_ravnos_confirm: "La guerra continúa."
 restore_ravnos_effect_tooltip: "Crearás el [title|E] del Imperio Ravnos." 
 restore_setite: "Restaurando el $pod_clan$"
 restore_setite_tooltip: "La Tierra Elegida debe ser controlada por los Fieles."
 restore_setite_desc: "Egipto siempre ha sido el corazón de nuestro $pod_clan$ y nuestra fe. Si vamos a difundir la palabra de Set al mundo, primero debemos asegurar nuestro gobierno aquí."
 restore_setite_confirm: "¡Alabado sea Set!"
 restore_setite_effect_tooltip: "Crearás el [title|E] del Imperio Setita." 
 restore_talmahera: "Restaurando la Tal'mahe'Ra"
 restore_talmahera_tooltip: "Incluso Enoc debe tener un punto de apoyo en la Tierra."
 restore_talmahera_desc: "Aunque todavía gobernamos firmemente en el [UmbraGlossaryLocalized('shadowlands','Inframundo')], que nuestra conexión con el reino mortal esté cortada no es bueno. Reconquistar nuestros bastiones perdidos es una prioridad."
 restore_talmahera_confirm: "Abre los portales una vez más."
 restore_talmahera_effect_tooltip: "Crearás el [title|E] del Imperio de la Tal'mahe'Ra." 
 restore_obertus: "Restaurando la Orden Obertus"
 restore_obertus_tooltip: "El legado de Constantinopla aún vive."
 restore_obertus_desc: "Como seguidores de la Vía Caeli, los demás Tzimisce del $pod_clan$ desconfían de nosotros. Pero podríamos reinstaurar la antigua Orden Obertus para darnos algo de legitimidad en estos tiempos difíciles."
 restore_obertus_confirm: "Por el Hijo y el Padre."
 restore_obertus_effect_tooltip: "Crearás el [title|E] del Reino de los Obertus." 
 restore_moloch: "Restaurando la Orden de Moloch"
 restore_moloch_tooltip: "Los Niños deben ser alimentados."
 restore_moloch_desc: "Nuestra eterna guerra en la sombra para proteger al mundo de los demonios ha ido mal. Si vamos a sobrevivir, debemos unirnos bajo una sola Orden una vez más."
 restore_moloch_confirm: "Ahora, a los pozos..."
 restore_moloch_effect_tooltip: "Crearás el [title|E] del Reino de la Orden de Moloch." 
 restore_azaneal: "Restaurando la Orden de Azaneal"
 restore_azaneal_tooltip: "Todavía podemos abrir los pozos..."
 restore_azaneal_desc: "Azaneal tenía una visión para los Baali. A pesar de algunos reveses, debemos unir a nuestros hermanos detrás de esta visión, o el bendito fin nunca llegará."
 restore_azaneal_confirm: "El principio del fin."
 restore_azaneal_effect_tooltip: "Crearás el [title|E] del Reino de la Orden de Azaneal." 
 restore_web: "Restaurando la Red de Cuchillos"
 restore_web_tooltip: "Todavía tenemos muchos oídos."
 restore_web_desc: "El regreso de Ur-Shulgi debe ser preparado. La Red de Cuchillos es nuestra organización proxy para tomar el control del $pod_clan$ Haqimita con este propósito. Debe ser reconstruida."
 restore_web_confirm: "Ahora, a tomar Alamut."
 restore_web_effect_tooltip: "Crearás el [title|E] del Reino de la Red de Cuchillos." 
 restore_lost_tribe: "Restaurando la Tribu Perdida"
 restore_lost_tribe_tooltip: "La visión de Anosh es más que un simple territorio."
 restore_lost_tribe_desc: "Si vamos a acelerar la venganza de la 2ª Generación contra su díscolo vástago, necesitamos una base de operaciones sólida. La Tribu Perdida de Dastur Anosh era perfecta."
 restore_lost_tribe_confirm: "En el camino a Enoc..."
 restore_lost_tribe_effect_tooltip: "Crearás el [title|E] del Reino de la Tribu Perdida." 
 restore_olives: "Restaurando la Dieta de los Olivos"
 restore_olives_tooltip: "El $pod_clan$ Salubri aún no ha muerto."
 restore_olives_desc: "La última resistencia de Qawiya alrededor de los Estados Cruzados fue encomiable. Si vamos a salvar al $pod_clan$ Salubri, podríamos tomar nota de sus métodos."
 restore_olives_confirm: "Ven a por ello, Tremere."
 restore_olives_effect_tooltip: "Crearás el [title|E] del Reino de la Dieta de los Olivos." 
 restore_see_of_nod: "Restaurando la Sede de Nod"
 restore_see_of_nod_tooltip: "Los Fieles necesitan una Iglesia."
 restore_see_of_nod_desc: "La Iglesia del Tercer Caín está en las últimas, acosada por incrédulos en todas partes. Se debe hacer una demostración de fe y fuerza recuperando Venecia, la sede del primer Arzobispo."
 restore_see_of_nod_confirm: "Ahora, a difundir la palabra."
 restore_see_of_nod_effect_tooltip: "Crearás el [title|E] del Reino de la Sede de Nod." 
 restore_tremere: "Restaurando a los Tremere"
 restore_tremere_tooltip: "Todo Mago necesita un estudio."
 restore_tremere_desc: "Nuestra supervivencia es precaria, con enemigos acercándose, pero los Tremere son, si no otra cosa, resistentes. Podríamos reconstruir la sede del poder del $pod_clan$ en todas partes, si es necesario."
 restore_tremere_confirm: "Prepara las Cámaras del Consejo."
 restore_tremere_effect_tooltip: "Crearás el [title|E] del Imperio de la Casa Tremere." 
 restore_curtain: "Restaurando la Cortina de Sombras"
 restore_curtain_tooltip: "La Abuela necesita de sus ayudantes."
 restore_curtain_desc: "Los agentes del Progenitor han asestado duros golpes contra nosotros. Pero la Abuela todavía duerme y necesita protección. No debemos flaquear."
 restore_curtain_confirm: "Ten un sueño tranquilo."
 restore_curtain_effect_tooltip: "Crearás el [title|E] del Imperio de la Cortina de Sombras." 
 restore_erciyes: "Restaurando el Erciyes"
 restore_erciyes_tooltip: "La montaña profética es nuestra por derecho."
 restore_erciyes_desc: "El propio Cappadocius decretó que el Erciyes es la base principal del $pod_clan$. Debemos reunirnos y conquistarlo como lo hicimos la primera vez."
 restore_erciyes_confirm: "Necesitará una limpieza."
 restore_erciyes_effect_tooltip: "Crearás el [title|E] del Reino del Erciyes." 
 restore_crescent: "Restaurando la Media Luna de Medianoche"
 restore_crescent_tooltip: "Iberia aún no está perdida."
 restore_crescent_desc: "El intento de Badr de detener la Reconquista cristiana no ha ido bien. Pero podríamos hacerlo mejor y unir el sur de Iberia para los Fieles una vez más."
 restore_crescent_confirm: "Ahora, a mirar hacia el norte..."
 restore_crescent_effect_tooltip: "Crearás el [title|E] del Reino de la Media Luna de Medianoche." 
 restore_feral: "Restaurando la Horda Feral"
 restore_feral_tooltip: "¡Deberíamos reunirnos una vez más!"
 restore_feral_desc: "Muchos señores de la guerra Gangrel han intentado unir al $pod_clan$ mediante la diplomacia o la fuerza. Debemos hacerlo mejor que ellos y realmente tener éxito."
 restore_feral_confirm: "La Cacería comienza."
 restore_feral_effect_tooltip: "Crearás el [title|E] del Reino de la Horda Feral." 
 restore_eastern: "Restaurando los Señores Orientales"
 restore_eastern_tooltip: "Ventrue con características húngaras."
 restore_eastern_desc: "Los Ventrue al este de Alemania son una raza rara, vistos con desconfianza. Como tales, deberían unirse como lo hicieron los Señores Orientales bajo Bulscu."
 restore_eastern_confirm: "La verdadera realeza regresa a estas tierras."
 restore_eastern_effect_tooltip: "Crearás el [title|E] del Reino de los Señores Orientales." 
 restore_thunder: "Restaurando el Trueno Infinito"
 restore_thunder_tooltip: "La Corte debe ser reconstruida si el ciclo ha de continuar."
 restore_thunder_desc: "Extraños tanto para los Kin-Jin como para otros [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], siempre estamos al borde de la extinción. Pero nuestra fe es fuerte, y la Corte puede resurgir."
 restore_thunder_confirm: "El fénix ha resurgido."
 restore_thunder_effect_tooltip: "Crearás el [title|E] del Imperio del Trueno Infinito." 
 #restore_scarlet: "Restaurando la Corte Escarlata"
 #restore_scarlet_tooltip: "La Corte Escarlata tiene el poder [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] en la mayor parte del sudeste asiático."
 #restore_scarlet_desc: "Un miembro poderoso, pero algo externo, de las cinco augustas Cortes de los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], el Fénix Escarlata es un trofeo adecuado para cualquier [Glossary('Hungry Dead','game_concept_kuei_jin_desc')] ambicioso."
 #restore_scarlet_confirm: "Un nuevo fénix nace."
 #restore_scarlet_effect_tooltip: "Crearás el [title|E] del Imperio del Fénix Escarlata." 
 #restore_celestial: "Restaurando la Tribu Celestial"
 #restore_celestial_tooltip: "La divinidad no es un viaje fácil."
 #restore_celestial_desc: "Los diosecillos impenitentes no son bienvenidos por otros [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], y aún menos por los Kin Jin. Como tal, la Tribu Celestial siempre está en peligro, pero es lo suficientemente flexible como para ser reconstruida donde sea necesario."
 #restore_celestial_confirm: "Hormigas entrometiéndose con Dioses."
 #restore_celestial_effect_tooltip: "Crearás el [title|E] del Reino de la Tribu Celestial." 
 restore_golden: "Restaurando la Cruz Dorada"
 restore_golden_tooltip: "Occitania aún no es francesa."
 restore_golden_desc: "Alzándose contra la tiranía de la Corte del Amor parisina, la Cruz Dorada es un símbolo de la experiencia e independencia occitana. Un poderoso grito de guerra que podríamos usar."
 restore_golden_confirm: "París no nos define."
 restore_golden_effect_tooltip: "Crearás el [title|E] del Reino de la Cruz Dorada." 
 restore_grand: "Restaurando la Gran Corte"
 restore_grand_tooltip: "Francia aún puede ser nuestra."
 restore_grand_desc: "Los errores de Alejandro le costaron Francia al $pod_clan$ Ventrue. Pero las cosas pueden cambiar, y podríamos regresar como los gobernantes legítimos de este poderoso Reino."
 restore_grand_confirm: "La dominación Ventrue no es negociable."
 restore_grand_effect_tooltip: "Crearás el [title|E] del Reino de la Gran Corte." 
 restore_timisoara: "Restaurando el Banato de Timisoara"
 restore_timisoara_tooltip: "Cartago del Este."
 restore_timisoara_desc: "Los intentos de Dominic de crear una nueva utopía han sido frustrados por, una vez más, el vil $pod_clan$ Ventrue. Aún así, su idea tenía méritos, y podríamos recoger las piezas y comenzar de nuevo."
 restore_timisoara_confirm: "Un nuevo comienzo esperanzador."
 restore_timisoara_effect_tooltip: "Crearás el [title|E] del Reino del Banato de Timisoara." 
 restore_anda: "Restaurando la Horda [Glossary('Anda','podgloss.anda')]"
 restore_anda_tooltip: "Todavía se pueden escuchar los sonidos de los caballos."
 restore_anda_desc: "Los [Glossary('Anda','podgloss.anda')] se enfrentan a muchos enemigos, con [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] vengativos al este y Gangrel hostiles al oeste. Pero el espíritu mongol no se domestica tan fácilmente. La Horda resurgirá."
 restore_anda_confirm: "Cabalgamos una vez más."
 restore_anda_effect_tooltip: "Crearás el [title|E] del Imperio de la Horda [Glossary('Anda','podgloss.anda')]." 
 ruler_exit_torpor: "Despertando del Torpor"
 ruler_exit_torpor_tooltip: "Gobernar desde el sueño no es lo más fácil."
 ruler_exit_torpor_desc: "Cualquier Vampiro que se precie tiene un plan de contingencia en caso de caer en $pod_torpor$ involuntariamente. Como ahora eres el gobernante nominal de otros Vampiros, podría ser un buen momento para activar dicho plan de contingencia."
 ruler_exit_torpor_confirm: "He vuelto."
 restore_golconda: "Restaurando la Golconda"
 restore_golconda_tooltip: "El sueño de Saulot nunca morirá realmente."
 restore_golconda_desc: "Golconda es la ciudad donde Saulot encontró el bendito estado que le da nombre. Es de suma importancia para cualquier Salubri que desee unirse a su progenitor en esta santa comunión."
 restore_golconda_confirm: "Un paso más hacia la iluminación."
 restore_golconda_effect_tooltip: "Crearás el [title|E] del Reino de la Golconda." 
 restore_livonia: "Restaurando Livonia"
 restore_livonia_tooltip: "La Cruz nunca nos destruirá."
 restore_livonia_desc: "Acosados durante siglos por los $pod_cainites$ caballerescos de la Cruz, los seguidores de la Vía Bestiae estuvieron unificados, por un tiempo, bajo la bandera del Gangrel Qarakh. Este espíritu de resistencia aún podría ser un poderoso activo para nuestra causa."
 restore_livonia_confirm: "Ni un paso atrás."
 restore_livonia_effect_tooltip: "Crearás el [title|E] del Reino de los Ferales de Livonia." 
 restore_reconquista: "Restaurando la España Lasombra"
 restore_reconquista_tooltip: "Con Fe y Sombras, regresaremos."
 restore_reconquista_desc: "La guerra civil de los Lasombra en España fue principalmente un asunto político, pero trajo muchas oportunidades a los miembros más jóvenes del $pod_clan$. Al aprovechar su legado, esperamos poder cosechar las mismas recompensas."
 restore_reconquista_confirm: "De vuelta en nuestro hogar."
 restore_reconquista_effect_tooltip: "Crearás el [title|E] del Reino de la Sombra Reconquista."
 occupy_san_michele_decision: "Ocupar el Monasterio de San Michele"
 occupy_san_michele_decision_tooltip: "Crear una sede para la Inquisición"
 occupy_san_michele_decision_desc: "[st_peters_city|E] yace cautiva. Si podemos liberarla, nos estableceremos en uno de sus monasterios, para que sirva como sede contra las fuerzas de la oscuridad."
 occupy_san_michele_decision_confirm: "Liberar la Ciudad Santa"
