 enter_torpor_decision: "Entrar en Torpor"
 enter_torpor_decision_tooltip: "Entrar en $pod_torpor$ voluntariamente no es lo más prestigioso que un gobernante puede hacer"
 enter_torpor_decision_desc: "Cualquier inmortal puede aburrirse de permanecer activo durante mucho tiempo. Y ahora que has terminado con esta era, tal vez sea hora de descansar y dejar que tus herederos manejen las cosas por sí mismos."
 enter_torpor_decision_confirm: "Es hora de descansar"
 enter_little_death_decision: "Entrar en la Pequeña Muerte"
 enter_little_death_decision_desc: "Cualquier Wan-Kuei puede aburrirse de no vivir durante mucho tiempo. Y ahora que estás aburrido de esta era, tal vez sea hora de descansar en la Pequeña Muerte?"
 enter_slumber_decision: "Entrar en Sueño"
 enter_slumber_decision_desc: "Esta era te aburre. ¿Quizás es hora de entrar en un Sueño profundo y despertar en una época nueva y más emocionante?"
 enter_coccon_decision: "Entrar en Capullo"
 enter_coccon_decision_desc: "El personaje se envuelve en una cáscara endurecida mientras su metabolismo se ralentiza hasta un estado de animación suspendida."
 enter_long_sleep_decision: "Rito del Sueño Largo"
 enter_long_sleep_decision_desc: "Con la realización del rito, el Gurahl puede poner a un individuo en un estado de animación suspendida no diferente a la habilidad de hibernación natural del oso. En este estado, el sujeto no envejece; las funciones corporales se detienen y la respiración se reduce al mínimo absoluto. Este rito hace posible mantener a individuos incapacitados por un período de tiempo indefinido, manteniéndolos con vida para que puedan ser curados (ya sea de forma natural o mágica) en una fecha posterior."
 enter_dragon_sleep_decision: "Sueño del Dragón"
 enter_dragon_sleep_decision_desc: "Los Mokolé entran en un estado de estivación. El Mokolé no envejece mientras duerme, aunque puede soñar. Por lo general, el Mokolé se entierra en el barro mientras duerme. El Mokolé dormido se despierta si lo mueven o lo tocan, pero no por ruidos ordinarios."
 revenant_victory_objective_decision: "Robar el Poder de la Vitae"
 revenant_victory_objective_decision_tooltip: "Viaja a la fuente del poder."
 revenant_victory_objective_decision_desc: "Libérate de la tiranía de tus amos Kindred, usa el conocimiento arcano y los rituales impíos para aprovechar el preciado poder de su sangre."
 revenant_victory_objective_decision_effect_tooltip: "Este asalto sin precedentes a los secretos de la $pod_vitae$ implica la recuperación de manuscritos antiguos, así como tus propios estudios. El procedimiento en sí requerirá ingredientes preciosos y raros, sobre todo la conexión con los linajes de sangre [Glossary('Antediluvian','game_concept_antediluvian_desc')]."
 revenant_victory_objective_decision_confirm: "¡Comienza el ritual!"
 revenant_victory_objective_decision_custom: "Has capturado #V 3#! Vampiros [GetTrait('vampgeneration4').GetName( GetPlayer )]."
 #revenant_victory_followup_decision: "Un Festín para la Nueva Generación"
 #revenant_victory_followup_decision_tooltip: "Usarás los cuerpos obsoletos de los niños nacidos de sangre imperfecta para nutrir a los que vienen después de ellos."
 #revenant_victory_followup_decision_desc: "En tu larga búsqueda para trascender las limitaciones inherentes de tu $pod_vitae$, tus lomos dieron vida a muchos hijos igualmente atrofiados que no tienen forma de seguir tu camino hacia la redención. Recuperar esas vidas será un acto de misericordia... y de frugalidad."
 #revenant_victory_followup_decision_effect_tooltip: "Lo viejo perecerá, lo nuevo florecerá."
 #revenant_victory_followup_decision_confirm: "¡Dejemos atrás nuestra debilidad!"
 #revenant_victory_followup_custom_decision: "Tienes al menos cinco descendientes vivos que llevan tu sangre mejorada"
 custom_bloodline_objective_decision: "Poder de la Sangre"
 custom_bloodline_objective_decision_desc: "Estás cansado de ser rechazado por la sociedad $pod_cainite$ debido a tu linaje caitiff. Ahora es el momento de finalmente establecerte en este mundo."
 custom_bloodline_custom_decision:  "Debes ser de quinta generación o inferior"
 custom_bloodline_objective_decision_effect_tooltip: "Crearás tu propio linaje de sangre vampírico con sus propias opciones de $pod_discipline$."
 custom_bloodline_objective_decision_confirm: "El momento ha llegado"
 custom_bloodline_objective_decision_tooltip: "Crearás tu propio linaje de sangre vampírico con sus propias opciones de $pod_discipline$."
 PODghw_decision: "Escalar la Yihad"
 PODghw_decision_desc: "Escalar la Yihad invocando grandes guerras santas."
 PODghw_decision_tooltip: "Las Grandes Guerras Santas podrán ser invocadas por todos los líderes religiosos que tengan los principios adecuados."
 PODghw_decision_effect_tooltip: "Por el costo de una cantidad masiva de piedad, las grandes guerras santas se desbloquearán."
 PODghw_decision_confirm: "¡Escalar la Yihad!"
 PODshadowcrusade_decision: "Solicitar la Cruzada Sombría"
 PODshadowcrusade_decision_desc: "Solicitar al líder de la Inquisición Sombría que invoque la Cruzada Sombría."
 PODshadowcrusade_decision_tooltip: "Las Grandes Guerras Santas podrán ser invocadas por todos los líderes religiosos que tengan los principios adecuados."
 PODshadowcrusade_decision_effect_tooltip: "Por el costo de una cantidad masiva de piedad, las grandes guerras santas se desbloquearán."
 PODshadowcrusade_decision_confirm: "Solicitar la Cruzada Sombría"  
 test_of_faith_decision: "Prueba de Fe"
 test_of_faith_decision_tooltip: "Intentarás cambiar tu forma de vida pecaminosa."
 test_of_faith_decision_desc: "Ser un sirviente de Dios significa ser devoto de Él. De hecho, no eres lo suficientemente devoto. Tus caminos pecaminosos pueden convertirse en una barrera que no te permita cumplir tu causa. Una Prueba de Fe podría ayudarte a deshacerte de tus pecados."
 test_of_faith_decision_confirm: "Es hora de cambiar"
 test_of_faith_custom_decision: "Tu personaje tiene al menos uno de los siete pecados medievales cristianos (gula, envidia/venganza, orgullo, lujuria, ira, codicia, pereza)"
 test_of_faith_decision_effect_tooltip: "Intentarás deshacerte de uno de tus pecados y reemplazarlo con una virtud"
 helena_decision: "Troya contra Esparta"
 helena_decision_tooltip: "¡Menelao debe morir!"
 helena_decision_desc: "Si vas a, finalmente, moverte libremente de nuevo en el mundo de los $pod_cainites$, primero debes lidiar con el que te ha cazado durante tanto tiempo."
 helena_decision_effect_tooltip: "Obtendrás un nuevo [character_interaction|E] especial" 
 helena_decision_confirm: "Finalmente..."
 helena_custom_decision: "[GetScriptedCharacterByHistoryID('790309').GetFirstName] debe estar muerto"
 absalon_decision: "El Ritual de Svantevit"
 absalon_decision_tooltip: "¿El camino hacia la divinidad?"
 absalon_decision_desc: "Cada paso es una prueba para tu triunfo definitivo, una que emprenderás con gusto.\nEs probable que el ritual completo te otorgue grandes poderes, pero los costos podrían ser aún mayores."
 absalon_decision_effect_tooltip: "¡El ritual está completo!" 
 absalon_decision_confirm: "Pongámonos a trabajar"
 mithras_decision: "Tomando el Control"
 mithras_decision_tooltip: "Es hora de demostrar a esos idiotas vasallos que hablas en serio"
 mithras_decision_desc: "Tus vasallos piensan que eres débil y enamorado. Demuestra lo contrario antes de que la reputación se extienda."
 mithras_decision_effect_tooltip: "Acallarás los desagradables rumores en tu contra." 
 mithras_decision_confirm: "¿Satisfechos?"
 mithras_custom_decision: "Esta decisión solo está disponible antes de 1300"
 greek_fire_objective_decision: "Recuperar el Fuego Griego"
 greek_fire_objective_decision_desc: "En nuestros muchos encuentros con sirvientes de Satanás del tipo chupasangres, el fuego ha demostrado ser su mayor debilidad. No ha pasado mucho tiempo desde que los romanos gobernaron los mares con su aterradora arma de fuego, sin embargo, su secreto se ha perdido. Es hora de recuperarlo y re-ingeniarlo para nuestros propósitos."
 greek_fire_objective_decision_tooltip: "Utiliza el Fuego Griego contra tus enemigos."
 greek_fire_objective_decision_effect_tooltip: "Obtendrás la capacidad de equipar a otros cazadores con armamento basado en fuego."
 greek_fire_objective_decision_custom1: "Buscar la fórmula en la ciudad requiere #V 12#! de [intrigue|E] y controlar [GetTitleByKey('c_byzantion').GetNameNoTier]"
 greek_fire_objective_decision_custom2: "Recuperar el secreto de una 'persona' requiere que tú o tu cortesano tengan el [trait|E] [GetTrait('torturer').GetName( GetPlayer )] y capturar a uno de los demonios que se rumorea que lo conocen: [GetScriptedCharacterByHistoryID('790015').GetFirstName], [GetScriptedCharacterByHistoryID('790115').GetFirstName], [GetScriptedCharacterByHistoryID('790767').GetFirstName], [GetScriptedCharacterByHistoryID('790341').GetFirstName], [GetScriptedCharacterByHistoryID('790939').GetFirstName]"
 greek_fire_objective_decision_custom3: "Descubrir la fórmula por ti mismo requiere [learning|E] de #V 20#! y que tu cultura descubra la [innovation|E] $innovation_development_04$"
 greek_fire_objective_decision_confirm: "¡Hágase la luz!"
 ghoulbro_objective_decision: "Marchar sobre la Ciudad"
 ghoulbro_objective_decision_desc: "Constantinopla es donde Basilio y Bayezid comenzaron a predicar. En aquel entonces predicaban las mentiras de sus amos, pero con su caída y la de la Ciudad, los hermanos abrieron sus ojos a una nueva verdad. Una verdad que necesita ser moldeada en el más virulento de los evangelios y llevada por predicadores fieles a tantas almas como sea posible. Y no hay más almas que donde todo comenzó, la Gran Ciudad de Constantinopla."
 ghoulbro_objective_decision_tooltip: "Regresa de tu exilio y reúne al rebaño."
 ghoulbro_objective_decision_effect_tooltip: "Despertarás a las masas miserables para que sigan tu causa."
 ghoulbro_custom_decision: "Tienes #V 20#! [knights|E] que son tanto $POD_splat_ghoul_plural$ como [GetFaithByKey('calomenasforsaken').GetName]"
 ghoulbro_custom_decision1: "El engañador, el conde [GetScriptedCharacterByHistoryID('791424').GetFirstName] de Ohrid, está muerto, sin tierras o en $pod_torpor$"
 ghoulbro_custom_decision2: "El engañador, el conde [GetScriptedCharacterByHistoryID('791418').GetFirstName] de Thyatria, está muerto, sin tierras o en $pod_torpor$"
 ghoulbro_custom_decision3: "El engañador, el conde [GetScriptedCharacterByHistoryID('791419').GetFirstName] de Hadrianeia, está muerto, sin tierras o en $pod_torpor$"
 ghoulbro_objective_decision_confirm: "¡Prediquemos!"
 tabitha_decision: "Escudo de Andalucía"
 tabitha_decision_tooltip: "Tu desempeño está siendo observado"
 tabitha_decision_desc: "La Anciana te ha encargado asegurar la rápida derrota de los $pod_cainites$ cristianos. Se esperan resultados rápidamente."
 tabitha_decision_effect_tooltip: "Alamut estará complacido y enviará recompensas" 
 tabitha_decision_confirm: "No fallo"
 tabitha_custom_decision1: "O tú o la Media Luna de Medianoche controlan [GetTitleByKey('c_coimbra').GetNameNoTier]"
 tabitha_custom_decision2: "O tú o la Media Luna de Medianoche controlan [GetTitleByKey('c_madrid').GetNameNoTier]"
 montano_decision: "Olas en el Mar"
 montano_decision_tooltip: "El $pod_clan$ Lasombra necesita una mano guía fuerte"
 montano_decision_desc: "Si vas a salvar la grave situación del Mar de Sombras, debes mostrar tu fuerza en los asuntos italianos"
 montano_decision_effect_tooltip: "Restaurar tu autoridad te permitirá una vasallización más fácil de los Principados Lasombra" 
 montano_decision_confirm: "Un $pod_clan$, un líder"
 qawiyya_decision: "Salvando Damasco"
 qawiyya_decision_tooltip: "El tiempo se acaba para tu vecino caído"
 qawiyya_decision_desc: "Te has comprometido a salvar Damasco lo antes posible. Y la guerra de desinformación de los Baali en tu contra hace que sea aún más apremiante..."
 qawiyya_decision_effect_tooltip: "Acallarás los desagradables rumores en tu contra." 
 qawiyya_decision_confirm: "Los Salubri aún no se han ido"
 petaniqua_decision: "Caminando la Espiral Negra"
 petaniqua_decision_tooltip: "La única solución yace en las profundidades subterráneas"
 petaniqua_decision_desc: "Probablemente no encontrarás nada más que locura y muerte en este lugar, pero... no tienes nada que perder de todos modos"
 petaniqua_decision_effect_tooltip: "Intentarás encontrar algo de verdad en la oscuridad de abajo, pero muy probablemente solo encontrarás más locura.\nEs muy probable que encuentres solo estrés y aflicción. Sin embargo, hay una pequeña posibilidad de que Petaniqua encuentre lo que está buscando..." 
 petaniqua_decision_confirm: "Mirando al abismo..."
 poltzimi_objective_decision: "Una Nueva Sede de Poder"
 poltzimi_objective_decision_desc: "Durante demasiado tiempo, tus compañeros de clan de los Cárpatos se han burlado de tu supuesto provincianismo. Aunque tu dominio es periférico al Voivodato y no tan antiguo como los feudos que lo componen, el Reino de Polonia y su capital, Cracovia, son más prósperos y están más cerca de los asuntos del mundo exterior que cualquier parte de Cárpatos. Demostrar tu hegemonía aquí constituirá un cambio innegable del centro de autoridad del $pod_clan$ en tu dirección."
 poltzimi_objective_decision_tooltip: "Muéstrale al $pod_clan$ dónde reside el verdadero poder."
 poltzimi_objective_decision_effect_tooltip: "Tu gobierno sobre Cracovia te marcará como digno de liderar a los voivodas."
 poltzimi_objective_decision_confirm: "¡El dragón de Wawel ruge!"
 invite_ashen_prospect_decision: "Invitar Prospecto Ceniciento"
 invite_ashen_prospect_decision_desc: "El primer método para estimar la inteligencia de un gobernante es mirar a los hombres que tiene a su alrededor. Un Príncipe sabio mantiene cerca a aquellos que lo servirían con lealtad, fuerza y convicción, y los recompensa bien."
 invite_ashen_prospect_decision_confirm: "¡Convoca a los que servirían tu causa!"
 invite_ashen_prospect_decision_tooltip: "Hay hombres y mujeres competentes que podrían servir a un Príncipe prestigioso..."
 invite_ashen_prospect_decision_effect_tooltip: "Tres posibles secuaces llegan a tu corte, listos para ganarse tu favor."
 #join_web_of_knives_decision: "Unirse a la Red de Cuchillos"
 #join_web_of_knives_decision_tooltip: "Solicitar a los Banu Haqim unirse a una mortal red de asesinos"
 #join_web_of_knives_decision_confirm: "Coge mi cuchillo"
 #join_web_of_knives_decision_desc: "La red de asesinos de los Banu Haqim conocida como la Red de Cuchillos a veces acepta miembros externos. Si crees que tienes lo necesario para triunfar como asesino, puedes solicitar a los Banu Haqim que te incluyan en la red, lo que te permitirá cazar recompensas y ganar recompensas... a un precio. Para entrar en la red, debes tener habilidad, una buena reputación con los Banu Haqim, la disposición a pagar tributo a los dueños de la red y pasar una prueba."
 #join_web_of_knives_decision_ct: "Pasarás una prueba. Si tienes éxito, te convertirás en miembro de la Red de Cuchillos, capaz de cazar objetivos con precio en sus cabezas. Sin embargo, debes pagar un tributo mensual y una parte de tus ganancias a los Banu Haqim."
 #NEED_BANU_HAQIM_DYNAST_TO_LIKE_ME_LOC: "El Jefe de la dinastía Banu Haqim debe aprobarte"
 fellow_web_of_knives_member_loc: "La Red de Cuchillos no acepta contratos contra compañeros Banu Haqim."
 #wok_outside_areas_tt: "Esta opción solo está disponible en áreas con una fuerte presencia de la Red de Cuchillos, como Europa Occidental, India, África del Norte o el Medio Oriente."
 #wok_core_areas_tt: "Esta opción solo está disponible en áreas donde la Red de Cuchillos es más fuerte, es decir, Medio Oriente, Asia Menor, Iberia y África del Norte."
 #skilled_assassin: "Ser un asesino hábil (ya sea más de 10 de intriga o más de 45 de destreza)"
 #cant_fight_banu_haqim: "No estar en guerra con ningún Banu Haqim"
 #leave_web_of_knives_decision: "Abandonar la Red de Cuchillos"
 #leave_web_of_knives_decision_tooltip: "Separarse de la red y dejar de pagar tributo."
 #leave_web_of_knives_decision_confirm: "Un poco de descanso es necesario..."
 #leave_web_of_knives_decision_desc: "Ser miembro de la Red de Cuchillos es agotador y caro: el duro entrenamiento, el riesgo para tu vida, el consumo de tiempo y recursos... Y encima de todo, ¡incluso tenías que pagar una tarifa por cada asesinato! Nadie te culparía si no puedes con ello... Bueno, casi nadie."
 #leave_web_of_knives_decision_ct: "Abandonarás la Red de Cuchillos, ya no podrás aceptar recompensas."
 become_vampire_decision: "Buscar el Abrazo"
 become_vampire_decision_desc: "¿Quizás es hora de visitar a un amigo que conoces y suplicar por la inmortalidad?"
 become_vampire_decision_tooltip: "Usando un [character_interaction|E] en cualquier otro vampiro vivo que sea tu amigo, podrás seleccionar un personaje con el que estar relacionado."
 become_vampire_decision_confirm: "Hagámoslo"
 become_mummy_decision: "Buscar el Hechizo de la Vida"
 become_mummy_decision_desc: "¿Quizás es hora de visitar a [GetScriptedCharacterByHistoryID('792600').GetFirstName] y suplicar por la inmortalidad?"
 become_mummy_decision_tooltip: "Pide el famoso Hechizo de la Vida para obtener la vida eterna."
 become_mummy_decision_confirm: "Hagámoslo"
 become_ghoul_decision: "Adicción Fatal"
 become_ghoul_decision_desc: "Los ghouls sin amo son el tipo menos común de ghouls, que viven una vida libre sin ningún Cainita Regente que los gobierne, pero también una existencia peligrosa en lucha constante por la $pod_vitae$."
 become_ghoul_decision_tooltip: "Ejecutando a un [GetTrait('vampire').GetName( GetPlayer )] en tu prisión, podrás convertirte en un ghoul sin amo."
 become_ghoul_decision_confirm: "Hagámoslo"
 become_changeling_decision: "Buscar el Encantamiento Eterno"
 become_changeling_decision_desc: "¿Quizás es hora de visitar a un amigo que conoces y suplicar ser encantado para siempre?"
 become_changeling_decision_tooltip: "Usando un [character_interaction|E] en cualquier otra hada viva que sea tu amiga, te distanciarás de tu humanidad y eventualmente te convertirás en un changeling."
 become_changeling_decision_confirm: "Hagámoslo"
 become_demon_decision: "Buscar Posesión Demoníaca"
 become_demon_decision_desc: "¿Quizás es hora de encontrar un demonio poderoso y entregarle tu alma?"
 become_demon_decision_tooltip: "Completando los requisitos previos, puedes convertirte en anfitrión de un demonio poderoso."
 become_demon_decision_confirm: "¿Quién necesita un alma de todos modos?"
 become_asekh_sen_decision: "Buscar una Vida Extra"
 become_asekh_sen_decision_desc: "¿Quizás es hora de visitar a un amigo que conoces y suplicar su impía bendición?"
 become_asekh_sen_decision_tooltip: "Pide el rito para convertirte en un Asekh-sen."
 become_asekh_sen_decision_confirm: "Mi vida continuada vale cualquier costo."
 become_asekh_sen_decision_custom: "Tiene algún [friend|E] o [lover|E] [GetTrait('banemummy').GetName( GetPlayer )]"
 join_order_decision: "Unirse a la Inquisición Sombría"
 join_order_decision_desc: "Como verdadero creyente, quieres ser parte de la buena lucha, tal vez sea hora de visitar a algún amigo que conoces y suplicar entrenamiento."
 join_order_decision_tooltip: "Usando un [character_interaction|E] en cualquier otro miembro de la orden vivo (excepto los von Murnau) que sea tu amigo, podrás seleccionar un personaje con el que estar relacionado."
 join_order_decision_confirm: "Hagámoslo"
 join_wu_decision: "Unirse a un [Glossary('Wu','podgloss.wu')]"
 join_wu_decision_desc: "No tienes que caminar solo en tu camino. Te has vinculado con otras almas perdidas como tú para formar un [Glossary('Wu','podgloss.wu')] — una 'familia de sangre' de no-muertos."
 join_wu_decision_tooltip: "Usando un [character_interaction|E] en cualquier otro [GetTrait('kueijin').GetName( GetNullCharacter )] vivo que sea tu amigo, podrás seleccionar un personaje con el que estar relacionado."
 join_wu_decision_confirm: "Hagámoslo"
 join_ghoulbros_decision: "Unirse a los Abandonados"
 join_ghoulbros_decision_desc: "Si eres amigo de los Abandonados de Calomena, puedes pedir una iniciación"
 join_ghoulbros_decision_tooltip: "Usando un [character_interaction|E] en cualquier otro Abandonado de Calomena vivo que sea tu amigo, podrás seleccionar un personaje con el que estar relacionado."
 join_ghoulbros_decision_confirm: "Hagámoslo"
 join_shih_decision: "Unirse a los [GetTrait('shih').GetName( GetPlayer )]"
 join_shih_decision_desc: "Busca en la naturaleza, sigue las pistas, supera las pruebas y conviértete en miembro de los Cazadores Orientales."
 join_shih_decision_tooltip: "Te convertirás en un [GetTrait('shih').GetName( GetPlayer )]"
 join_shih_decision_confirm: "Hagámoslo"
 POD_convert_government_decision: "Cambiar Forma de Gobierno"
 POD_convert_government_decision_desc: "Estás usando un tipo de gobierno que no está destinado a tu personaje. Esta decisión te permite cambiarlo."
 POD_convert_government_decision_tooltip: "Estás usando un tipo de gobierno que no está destinado a tu personaje. Esta decisión te permite cambiarlo.\nCambia el tipo de [government|E] usando un [government|E] que se adapte a tu personaje."
 POD_convert_government_decision_confirm: "Adoptar el Camino Correcto"
 restore_celestial_army_objective_decision: "Restaurar el Ejército Celestial"
 restore_celestial_army_objective_decision_desc: "Hace cien años, muchos [GetTrait('shih').GetName( GetPlayer )] eligieron seguir un camino más grandioso: Llamándose a sí mismos el 'Ejército Celestial', estos cazadores de demonios buscaban destruir a los shen dondequiera que habitaran, incluso cuando no había necesidad de que actuaran. Muchos [GetTrait('shih').GetName( GetPlayer )] denunciaron a este Ejército Celestial, horrorizados por la violación de uno de los mandamientos principales de Yi. Finalmente, los [GetTrait('shih').GetName( GetPlayer )] se volvieron orgullosos y desterraron a todos los cazadores de demonios que no pertenecían al Ejército Celestial. Fue entonces cuando su cuartel general fue destruido durante un terremoto, dejando solo a los vagabundos atrás."
 restore_celestial_army_objective_decision_tooltip: "La escuela más grande del Ejército Celestial fue construida en las Montañas Kun Lun, recupérala y luego decide qué camino quieres seguir"
 restore_celestial_army_objective_decision_confirm: "¿El Nuevo Cuartel General?"
 shih_peace_decision: "Acción Reflexiva"
 shih_peace_decision_desc: "Los [GetTrait('shih').GetName( GetPlayer )] errantes solo actúan cuando es necesario, como ayudar a los que sufren el yugo de lo sobrenatural. Matar a un monstruo simplemente por verse diferente es una forma segura de despertar su P'o."
 shih_peace_decision_tooltip: "Negociarás una tregua con tus gobernantes independientes vecinos."
 shih_peace_decision_confirm: "Calmar mi P'o"
 learning_kaja_decision: "Aprender Kaja"
 learning_kaja_decision_desc: "La antigua y extraordinariamente compleja escritura ideográfica de los [Glossary('Wan Xian','game_concept_kuei_jin_desc')]. Aprenderla te dará una comprensión con todos los demás usuarios de kaja."
 learning_kaja_decision_tooltip: "Aprenderás Kaja y recibirás ventaja de ello."
 learning_kaja_decision_confirm: "¡Tan complejo!"
 meng_huo_you_supply_decision: "Suministro de Meng Huo You"
 meng_huo_you_supply_decision_desc: "Meng Huo You, laca de piedra, aceite de roca o simplemente petróleo, se utiliza como arma incendiaria en la guerra desde la Dinastía Han. Una vez parte del tributo pagado por una pequeña dinastía mortal en Vietnam al emperador chino en ese momento, es posible que puedas tomar esta arma para ti para equipar a otros cazadores."
 meng_huo_you_supply_decision_tooltip: "Tomarás el suministro de petróleo de Chiêm Thành."
 meng_huo_you_supply_decision_confirm: "¡Prende fuego!"
 
 toreador_grandeur_victory_objective_decision: "Grandiosidad Deslumbrante"
 toreador_grandeur_victory_objective_decision_tooltip: "Tu corte es un reflejo de tu poder y, como tal, debes esforzarte constantemente por mejorarla."
 toreador_grandeur_victory_objective_decision_desc: "Los más grandes Toreador son creadores de tendencias, respetados y admirados en todas partes por sus audaces esfuerzos artísticos y eruditos. Debes esforzarte por ser el mecenas más renombrado del mundo no-muerto."
 toreador_grandeur_victory_objective_decision_effect_tooltip: "Serás respetado entre los Toreador como el líder a seguir, y las mentes más grandes de esta época acudirán en masa a tu reino." 
 toreador_grandeur_victory_objective_decision_confirm: "Una obra maestra en proceso"
 toreador_grandeur_custom_decision: "Todas tus posiciones de corte de [primogen|E] disponibles deben estar ocupadas por personas con al menos un nivel de Aptitud Bueno"
 toreador_grandeur_custom_decision2: "Necesitas que el nivel de grandeza de tu corte sea 10"
 
 library_victory_objective_decision: "Conocimiento Eterno"
 library_victory_objective_decision_tooltip: "El conocimiento es poder, como dicen."
 library_victory_objective_decision_desc: "Eres de un clan erudito, que conoce el valor y el poder escondido detrás de la palabra escrita. Debes asegurarte de tener la biblioteca más grande de esta época a tu disposición."
 library_victory_objective_decision_effect_tooltip: "Podrás aprender nuevos estilos de vida más rápido, y las innovaciones de tu cultura también se beneficiarán." 
 library_victory_objective_decision_confirm: "Una biblioteca que rivalice con la antigua Alejandría"
 #library_victory_objective_decision_custom: "Debes poseer el [GetPODArtifact('book_of_nod_link').GetName]"
 library_victory_objective_decision_custom: "Debes poseer el [GetPODArtifactName('book_of_nod_link')]"
 library_victory_objective_decision_custom2: "Debes poseer una de las grandes bibliotecas de los no-muertos. [GetTitleByKey('c_barcelona').GetNameNoTier], [GetTitleByKey('c_toulouse').GetNameNoTier], [GetTitleByKey('c_malta').GetNameNoTier], [GetTitleByKey('c_vienna').GetNameNoTier] o el Erciyes ([GetTitleByKey('c_cappadocia').GetNameNoTier])"
 
 avenge_arikels_shame_objective_decision: "Vengar la Vergüenza de Arikel"
 avenge_arikels_shame_objective_decision_tooltip: "Tu antepasada fue avergonzada hace mucho tiempo, y los rencores antiguos nunca mueren realmente."
 avenge_arikels_shame_objective_decision_desc: "La fundadora del $pod_clan$ Toreador, Arikel, una vez gobernó como una Diosa de Sumeria. Su amarga rival, Ennoia de los Gangrel, la expulsó, creando una disputa entre las dos que persiste hasta esta noche."
 avenge_arikels_shame_objective_decision_effect_tooltip: "Tu fama como principal defensora de Arikel estará asegurada y el clan Gangrel será avergonzado."
 avenge_arikels_shame_objective_decision_confirm: "Un mal enmendado"
 avenge_arikels_shame_custom_decision_gangrel: "[GetScriptedCharacterByHistoryID('792050').GetFirstName] y [GetScriptedCharacterByHistoryID('792051').GetFirstName], los lugartenientes de Ennoia que la ayudaron en Sumeria, deben estar muertos"
 avenge_arikels_shame_custom_decision_malks: "[GetScriptedCharacterByHistoryID('790319').GetFirstName], el amigo de Arikel que la protegió después de Sumeria, debe estar en tu corte o debes tener un [malkavian_primogen|E] con una calificación de aptitud excelente"
 
 toreador_unity_objective_decision: "Una Nueva Era"
 toreador_unity_objective_decision_tooltip: "Es hora de que los Toreador sigan adelante desde Constantinopla."
 toreador_unity_objective_decision_desc: "El $pod_clan$ Toreador ha sido en gran medida influenciado por el poderoso Miguel de Constantinopla durante siglos. Con su muerte, es hora de un nuevo comienzo. Francia será el nuevo hogar de los Toreador, si finalmente puede unirse..."
 toreador_unity_objective_decision_effect_tooltip: "Unirás al Clan Toreador bajo tu liderazgo, obteniendo el [title|E] del Clan y bonificaciones relacionadas con las culturas del área francesa."
 toreador_unity_objective_decision_confirm: "Un país perfecto para el Clan perfecto"
 toreador_unity_objective_decision_alexander: "El antiguo gobernante de Francia, [GetScriptedCharacterByHistoryID('505082').GetFirstName] del clan Ventrue, debe estar muerto"
 toreador_unity_objective_decision_love: "Debes controlar el [title|E] [GetTitleByKey('e_love').GetNameNoTier], o el [title|E] no debe existir"
 toreador_unity_objective_decision_goldencross: "Debes controlar el [title|E] [GetTitleByKey('k_golden_cross').GetNameNoTier], o el [title|E] no debe existir"

 stealing_wistom_objective_decision: "Robando Sabiduría"
 stealing_wistom_objective_decision_tooltip: "Robarás el conocimiento de la Perla del Dragón, como te ordenó tu antepasado."
 stealing_wistom_objective_decision_desc: "El nombre Saulot es desconocido para los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], ellos conocen a Zao-Lat, un estudiante de [GetScriptedCharacterByHistoryID('791111').GetFirstName], un ladrón, una criatura despreciable que se benefició de la compasión de [GetScriptedCharacterByHistoryID('791111').GetFirstName], aprendió Ch'iuh Muh, se sentó a los pies del maestro y robó su sabiduría.\n¿Podrás hacer lo mismo?"
#  stealing_wistom_objective_decision_custom: "Has capturado #V 3#! [GetTrait('kueijin').GetName( GetPlayer )] [Glossary('Bodhisattva','podgloss.bodhisattva')] ([GetTrait('dharma9').GetName( GetPlayer )]) o que aspiran a serlo ([GetTrait('dharma8').GetName( GetPlayer )])"
 stealing_wistom_objective_decision_custom: "Has capturado #V 3#! [GetTrait('kueijin').GetName( GetPlayer )] [GetTrait('dharma4').GetName( GetPlayer )]+"
 stealing_wistom_objective_decision_confirm: "El Robo Perfecto"
 saving_white_tiger_objective_decision: "El Tigre Herido"
 saving_white_tiger_objective_decision_tooltip: "Los guardianes del Monte Meru deben estar unidos."
 saving_white_tiger_objective_decision_desc: "La Corte del Tigre Blanco se dividió en facciones rivales cuando la Emperatriz Fan abandonó su posición. Su sucesor, el Emperador Da, el líder de sus leales, Fu Hao, y los monjes de Shigatze son las fuerzas restantes más fuertes y las más propensas a reunificar la Corte."
 saving_white_tiger_objective_decision_da: "El emperador actual, [GetScriptedCharacterByHistoryID('795038').GetFirstName], debe ser tu vasallo si aún vive."
 saving_white_tiger_objective_decision_fu_hao: "La líder de los leales a Fan, [GetScriptedCharacterByHistoryID('793348').GetFirstName], debe ser tu vasallo si aún vive."
 saving_white_tiger_objective_decision_tenzing: "El maestro de los monjes de Shigatze, [GetScriptedCharacterByHistoryID('793347').GetFirstName], debe ser tu vasallo si aún vive."
 #saving_white_tiger_objective_decision_time: "Debes hacerlo antes de la unificación de la Quincunx. #weak (1320 - 1355)#!"
 saving_white_tiger_objective_decision_confirm: "¡El tigre ruge!"
 ending_the_empire_objective_decision: "Terminando el Imperio"
 ending_the_empire_objective_decision_desc: "Los 'Carontistas' creen que el Caronte que lidera el Imperio de los Muertos, y el demonio Caronte, supuesto creador del Inframundo, son uno y el mismo. Si puedes demostrarlo con la existencia de la guadaña Siklos que ambos afirman tener, y estudiar demonología para encontrar una conexión, puedes encontrar la verdad y quizás causar gran agitación en Stygia."
 ending_the_empire_objective_decision_tooltip: "Intentarás descubrirlo."
 ending_the_empire_objective_decision_confirm: "¡Lo sé!"
 
 life_bring_life_objective_decision: "La Vida Trae Vida"
 life_bring_life_objective_decision_desc: "Mientras los shen luchan entre ellos por baratijas de jade, los Reyes Yama envenenan los corazones en todos los frentes, jugando cada extremo en contra del medio para que solo el infierno gane.\nSin embargo, más que romper algunas peleas, los emisarios del Wu Feng reclutan a otros shen nobles para su causa, desde los feroces hengeyokai $glossary_fera$ hasta los ocultos diosecillos de los hsien. La vida es preciosa, demasiado preciosa para desperdiciarla en luchas internas sin sentido. La paz trae esperanza, la esperanza trae curación, la curación trae vida. En todas estas cosas, el infierno es derrotado."
 life_bring_life_objective_decision_tooltip: "Unirás tantos Shen como puedas."
 life_bring_life_objective_decision_confirm: "Unidos por fin"
 life_bring_life_kueijin_modifier_tooltip: "Gana [GetModifier('life_bring_life_kueijin_modifier').GetNameWithTooltip], si has cumplido el requisito de tener vasallos [GetTrait('kueijin').GetName( GetPlayer )] poderosos y contentos."
 life_bring_life_hengeyokai_modifier_tooltip: "Gana [GetModifier('life_bring_life_hengeyokai_modifier').GetNameWithTooltip], si has cumplido el requisito de tener vasallos hengeyokai poderosos y contentos"
 life_bring_life_chin_ta_modifier_tooltip: "Gana [GetModifier('life_bring_life_chin_ta_modifier').GetNameWithTooltip], si has cumplido el requisito de tener vasallos magos poderosos y contentos."
 life_bring_life_jade_wraiths_modifier_tooltip: "Gana [GetModifier('life_bring_life_jade_wraiths_modifier').GetNameWithTooltip], si has cumplido el requisito de tener vasallos wraith poderosos y contentos."
 life_bring_life_hsien_modifier_tooltip: "Gana [GetModifier('life_bring_life_hsien_modifier').GetNameWithTooltip], si has cumplido el requisito de tener vasallos hsien poderosos y contentos."
 life_bring_life_shih_modifier_tooltip: "Gana [GetModifier('life_bring_life_shih_modifier').GetNameWithTooltip], si has cumplido el requisito de tener vasallos [GetTrait('shih').GetName( GetPlayer )] poderosos y contentos."
 life_bring_life_kueijin_modifier: "Unido con los [GetTrait('kueijin').GetName( GetNullCharacter )]"
 life_bring_life_kueijin_modifier_desc: "Obtén acceso a edificios exclusivos de [GetTrait('kueijin').GetName( GetPlayer )], permite vasallizar a gobernantes [GetTrait('kueijin').GetName( GetPlayer )] con la [doctrine|E] [GetFaithDoctrine('under_wufeng_cause_doctrine').GetBaseName]."
 life_bring_life_hengeyokai_modifier: "Unido con los Hengeyokai"
 life_bring_life_chin_ta_modifier: "Unido con los Chi'n Ta"
 life_bring_life_jade_wraiths_modifier: "Unido con los Espectros de Jade"
 life_bring_life_hsien_modifier: "Unido con los Hsien"
 life_bring_life_shih_modifier: "Unido con los Shih"
 life_bring_life_shih_modifier_desc: "Obtén acceso a edificios exclusivos de [GetTrait('shih').GetName( GetPlayer )], permite vasallizar a gobernantes [GetTrait('shih').GetName( GetPlayer )] con la [doctrine|E] [GetFaithDoctrine('under_wufeng_cause_doctrine').GetBaseName]."

 purifying_black_tortoise_objective_decision: "Purificando la Tortuga Negra"
 purifying_black_tortoise_objective_decision_tooltip: "Unificarás la Corte de la Tortuga Negra."
 purifying_black_tortoise_objective_decision_desc: "La Corte de la Tortuga Negra fue corrompida por los [Glossary('Yama Kings','podgloss.yamaking')], los [akuma|E] han tomado el poder y han seguido a los [Glossary('Anda','podgloss.anda')] en su invasión. Deben ser detenidos."
 purifying_black_tortoise_objective_decision_time: "Debes hacerlo antes de que el último [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] no corrompido restante se rinda. #weak (1372)#!"
 purifying_black_tortoise_objective_decision_custom: "El título [GetTitleByKey('e_anda').GetNameNoTier] debe ser destruido"
 purifying_black_tortoise_objective_decision_confirm: "La Tortuga perduró"
 
 true_brujah_victory_objective_decision: "La Verdad sobre los Brujah"
 true_brujah_victory_objective_decision_tooltip: "Los llamados 'Brujah' son niños engañados creados por la traicionera Troile. La verdad debe salir a la luz."
 true_brujah_victory_objective_decision_desc: "Para probar la verdad sobre el clan Brujah, necesitas obligar a los hijos de Cartago a respaldar tu reclamo... o estar en una posición en la que ya no puedan cuestionarte."
 true_brujah_victory_objective_decision_confirm: "¡Que escuchen la verdad!"
 trujah_victory_objective_decision_effect_tooltip: "Tendrás una opción para lidiar con los Falsos Brujah. Ya sea mostrando perdón o pidiendo su destrucción definitiva."
 trujah_objective_tt: "Los vástagos de Troile deben ser traídos a tu lado, ya sea por persuasión o por la fuerza."
 trujah_victory_objective_decision_custom: "[GetScriptedCharacterByHistoryID('790303').GetFirstName] debe ser tu [friend|E], miembro de tu [coterie|E] o [soulmate|E]. O estar muerto"
 trujah_victory_objective_decision_custom2: "[GetScriptedCharacterByHistoryID('605102').GetFirstName] debe ser tu [friend|E], miembro de tu [coterie|E] o [soulmate|E]. O estar muerto"
 trujah_victory_objective_decision_custom3: "[GetScriptedCharacterByHistoryID('790309').GetFirstName] debe ser tu [friend|E], miembro de tu [coterie|E] o [soulmate|E]. O estar muerto"
 trujah_victory_objective_decision_custom4: "[GetScriptedCharacterByHistoryID('790305').GetFirstName] debe ser tu [friend|E], miembro de tu [coterie|E] o [soulmate|E]. O estar muerto"
 trujah_victory_objective_decision_custom5: "[GetScriptedCharacterByHistoryID('792741').GetFirstName] debe ser tu [friend|E], miembro de tu [coterie|E] o [soulmate|E]. O estar muerto"
 
 repentant_brujah_modifier: "Falsos Brujah Arrepentidos"
 repentant_brujah_modifier_desc: "Avergonzados por su ascendencia de Troile, los Falsos Brujah buscan la redención."
 repentant_brujah_tooltip: "Todos los Brujah, excepto los Verdaderos, obtendrán un modificador de Brujah Arrepentido. Tendrán acceso automático a la vasallización y conversión religiosa hacia ti mientras tengan este modificador."
 end_false_brujah_tooltip: "Todos los Brujah, excepto los Verdaderos, obtendrán un modificador de Matar a la Vista, haciendo su no-muerte mucho más desagradable."
 

 ashirra_lands_victory_objective_decision: "Las Tierras de la Fe"
 ashirra_lands_victory_objective_decision_tooltip: "Las tierras del Islam son las tierras de los Ashirra."
 ashirra_lands_victory_objective_decision_desc: "Muchas de las ciudades santas del Islam yacen bajo la ocupación de infieles o falsos creyentes. Solo con el control total de las Tierras de la Fe estarán los [Glossary('Ashirra','game_concept_ashirra_desc')] verdaderamente victoriosos."
 ashirra_lands_victory_objective_decision_confirm: "Por la voluntad de Alá."
 ashirra_lands_victory_objective_decision_tooltip2: "Todas las provincias de [GetTitleByKey('e_ashirra').GetNameNoTier], [GetTitleByKey('k_egypt').GetNameNoTier] y [GetTitleByKey('k_persia').GetNameNoTier] deben seguir una fe [GetReligionByKey('ashirra_religion').GetName]."


 shepherds_islam_victory_objective_decision: "Pastoreando a los Fieles"
 shepherds_islam_victory_objective_decision_tooltip: "Los fieles necesitan guardianes inmortales."
 shepherds_islam_victory_objective_decision_desc: "Estuvimos junto al propio Profeta, sus palabras permanecen con nosotros. Los mortales mueren, y el mensaje del Profeta será malrecordado o, peor, corrompido. Los mortales no pueden liderar el Islam, solo nosotros podemos."
 shepherds_islam_victory_objective_decision_confirm: "Ellos verán."
 shepherds_islam_victory_objective_decision_tooltip2: "O controlas tú el [GetTitleByKey('e_ashirra').GetNameNoTier], o nadie lo hace"

 ikhwan_al_safa_egypt_objective_decision: "Ayudar a los Portadores de Luz"
 ikhwan_al_safa_egypt_objective_decision_desc: "Los miembros más prácticos de los Sayyadin reconocen que las Momias son más experimentadas y conocedoras de los acechadores nocturnos que incluso los Ikhwan al-Safa, y por lo tanto les extienden su ayuda."
 ikhwan_al_safa_egypt_objective_decision_tooltip: "Limpiarás el núcleo de la Tierra de la Fe, y te beneficiarás de su ayuda."
 ikhwan_al_safa_egypt_objective_decision_confirm: "¿Amigos inmortales?"
 ikwan_egypt_effect_tt: "Tendrás una opción entre convertirte en una Momia de pleno derecho o disfrutar de una vida extra en su lugar."
 
 ikhwan_al_safa_arabia_objective_decision: "Liberar el Lamento"
 ikhwan_al_safa_arabia_objective_decision_desc: "El Lamento comenzó después de que el Profeta conquistara La Meca y generalmente se cree que es una manifestación del poder de Alá, que emana de la Piedra Negra dentro de la Kaaba. Los sobrenaturales contaminados, como los vampiros, sienten el Lamento como una cacofonía clamorosa de lamentos y gritos. El Lamento se detuvo solo una vez en su historia, cuando los carmatianos, miembros de una secta islámica, robaron la Piedra Negra de la Kaaba en 950. Esto permitió al vampiro Tarique erigir protecciones hechiceras que pueden contener una parte del Lamento, aunque no pueden silenciarlo por completo."
 ikhwan_al_safa_arabia_objective_decision_tooltip: "Liberarás el Lamento de la malvada hechicería de Tarique."
 ikhwan_al_safa_arabia_objective_decision_confirm: "Allá hablará"
 ikhwan_al_safa_arabia_objective_decision_effect_tooltip: "El Lamento liberará su poder una vez contenido, haciendo que todos los vampiros de Arabia retrocedan ante la fe.\nPerderán sus títulos y tú los heredarás."

 ikhwan_al_safa_persia_objective_decision: "Contactar a los Taftani"
 ikhwan_al_safa_persia_objective_decision_desc: "Los reclusos magos persas conocidos como los Taftani han sido un aliado ocasional en el pasado. Demostrar tu valía y forjar una alianza duradera con ellos podría abrir nuevas posibilidades de cooperación mutua."
 ikhwan_al_safa_persia_objective_decision_tooltip: "Los Taftani te enseñarán una forma más débil de su magia."
 ikhwan_al_safa_persia_objective_decision_confirm: "Encontraré el camino"
 ikhwan_al_safa_persia_objective_decision_effect_tooltip: "[ROOT.Char.GetFaith.GetName] obtendrá el [trait|E] [GetTrait('sorcerer').GetName( GetPlayer )] en la ordenación."
 
 akritai_mend_hunter_schism_decision: "Sanar el Gran Cisma de los Cazadores"
 akritai_mend_hunter_schism_decision_desc: "El Gran Cisma dividió a la Iglesia Cristiana y la Cuarta Cruzada vio menguar el poder del bando ortodoxo, pero si las cinco Sedes Episcopales de la Pentarquía apoyaran a los Akritai, la Sombra Inquisición Católica tendría que someterse a nosotros."
 akritai_mend_hunter_schism_decision_tooltip: "Reuniré la Cristiandad"
 akritai_mend_hunter_schism_decision_confirm: "¡Un solo Dios, una sola Iglesia!"
 akritai_schism_tt: "Los personajes de la Sombra Inquisición se convertirán a la fe Akritai.\nLos personajes Akritai obtendrán ahora acceso a las Artes Sagradas."
 
 judge_sorcery_objective_decision: "Kabbalah"
 judge_sorcery_objective_decision_desc: "Estudiarás los textos sagrados y las prácticas del Talmud secreto, una recopilación de enseñanzas y debates de Jueces ancestrales, con la esperanza de encontrar el secreto para extraer el poder de la magia menor para tu propio uso."
 judge_sorcery_objective_decision_tooltip: "Encontrarás el poder contenido en el misticismo judío."
 judge_sorcery_objective_decision_confirm: "Encontraré el camino"
 
 #hunter_theurgist_ordination_objective_decision: "Teurgia"
 #hunter_theurgist_ordination_objective_decision_desc: "Estudiarás los textos sagrados y, con suerte, encontrarás el secreto de cómo invocar el poder de Dios."
 #hunter_theurgist_ordination_objective_decision_tooltip: "Encontrarás el poder contenido en la Teurgia."
 #hunter_theurgist_ordination_objective_decision_confirm: "Encontraré el camino"
 
 POD_demon_unearthbound_decision: "Purgar la Influencia Demoníaca"
 POD_demon_unearthbound_decision_tooltip: "Cuidando la tierra mancillada."
 POD_demon_unearthbound_decision_desc: "Parte de tus dominios ha sido contaminada por influencia demoníaca. Sería un proceso costoso, pero puede solucionarse."
 POD_demon_unearthbound_decision_confirm: "¡Necesito un exorcista!"
 
 POD_demon_maintenance.30.t: "Purgando la Influencia Demoníaca"
 POD_demon_maintenance.30.desc: "La influencia demoníaca suele ser algo generalizado. Pero hay casos en que los moradores del Infierno son menos sutiles e intentan corromper la tierra misma con la esperanza de vincularse a ella.\nNo estás seguro del \"por qué\" o el \"cómo\", pero el resultado final es una visión terrible, con la propia naturaleza mancillada por esta presencia infernal. Por suerte, eliminar tal presencia es factible si te lo propones (y pones los medios). Has reunido a los mejores cazadores de lo infernal dispuestos a unirse a ti en esta región y estás listo para comenzar."
 POD_demon_maintenance.30.option.a: "¡Te repudio!"

 POD_demon_earthbound_duchy_decision: "Aumentar la Influencia Demoníaca"
 POD_demon_earthbound_duchy_decision_tooltip: "Aumenta el rango de tu [title|E] vinculado."
 POD_demon_earthbound_duchy_decision_desc: "Controlas una vasta extensión de tierra. Extender tus zarcillos demoníacos por esta área requeriría cierto esfuerzo, pero consolidaría tu posición en la región."
 POD_demon_earthbound_duchy_decision_confirm: "¡Estaré en todas partes!"

 POD_demon_earthbound_kingdom_decision: "Aumentar la Influencia Demoníaca"
 POD_demon_earthbound_kingdom_decision_tooltip: "Aumenta el rango de tu [title|E] vinculado."
 POD_demon_earthbound_kingdom_decision_desc: "Controlas una vasta extensión de tierra. Extender tus zarcillos demoníacos por esta área requeriría cierto esfuerzo, pero consolidaría tu posición en la región."
 POD_demon_earthbound_kingdom_decision_confirm: "¡Estaré en todas partes!"

 POD_demon_earthbound_empire_decision: "Aumentar la Influencia Demoníaca"
 POD_demon_earthbound_empire_decision_tooltip: "Aumenta el rango de tu [title|E] vinculado."
 POD_demon_earthbound_empire_decision_desc: "Controlas una vasta extensión de tierra. Extender tus zarcillos demoníacos por esta área requeriría cierto esfuerzo, pero consolidaría tu posición en la región."
 POD_demon_earthbound_empire_decision_confirm: "¡Estaré en todas partes!"

 POD_demon_earthbound_kupala_decision: "Crónica de Transilvania"
 POD_demon_earthbound_kupala_decision_tooltip: "Es hora de arrebatar Transilvania a su actual amo, Kupala."
 POD_demon_earthbound_kupala_decision_desc: "Quizás el primer demonio en escapar de la Prisión Abismal, Kupala se ha vinculado fuertemente a Transilvania. Mientras permanezca sin ser desafiado, será un rival peligroso para tu ascensión."
 kupala_victory_objective_decision_custom: "Necesitas un arma creada específicamente para matar a Kupala: o la [GetPODArtifactName('sword_of_dracula_link')] o su prototipo, la [GetPODArtifactName('ainkurn_link')]."
 kupala_victory_objective_decision_custom2: "La única forma de vincular (o desvincular) a Kupala de esta tierra se puede encontrar en el Incunable Kupalam, creado al tener cinco artefactos del Tratado sobre Kupala."
 POD_demon_earthbound_kupala_decision_confirm: "¡Transilvania es mía!"
 
 sin_conversion_decision: "Conversión Masiva"
 sin_conversion_decision_tooltip: "Convierte tu reino usando tu Dragón del Pecado"
 sin_conversion_decision_desc: "Como domador de dragones del pecado, podrías extender su poder sobre la población local."
 sin_conversion_decision_confirm: "¡Hora de pecar!"
 sin_conversion_decision_effect_tooltip: "Los condados de tu reino se convertirán a tu fe."
 
 commit_suicide_decision_desc_mummy: "Una momia tiene el poder de acabar con su propia existencia inmortal. Osiris no fuerza la vida eterna a nadie. Se considera que una momia que se suicida no tiene voluntad de vivir, independientemente de su Fuerza de Voluntad. La momia debe tener la intención de morir verdadera y permanentemente. Los actos suicidas que una momia realiza por otras razones no terminan con la existencia de la momia."
 
 POD_infernalist_study_demonology_1_decision: "Aprender Demonología"
 POD_infernalist_study_demonology_1_decision_tooltip: "Gana el rasgo de demonología."
 POD_infernalist_study_demonology_1_decision_desc: "Si el atractivo del mal es tentador, el poder que puede otorgar lo es aún más. Hay conocimientos prohibidos que podrías investigar..."
 POD_infernalist_study_demonology_1_decision_confirm: "Conocimiento infernal"
 POD_infernalist_study_demonology_2_decision: "Estudiar Demonología"
 POD_infernalist_study_demonology_2_decision_tooltip: "Rasgo de demonología avanzado."
