 generic_landless_mummy_objective_decision: "Inmortales Alrededor del Mundo"
 generic_landless_mummy_objective_decision_desc: "Muchas culturas han intentado dominar, o al menos han estudiado, la muerte y el más allá. Aprender de sus descubrimientos y artefactos podría ser un esfuerzo valioso."
 generic_landless_mummy_objective_decision_tooltip: "Muriendo desde Irlanda hasta Catay."
 generic_landless_mummy_objective_decision_confirm: "Una biblioteca digna de mi tumba."
 need_artifact_each_slot_decision_tt: "Necesitas un artefacto equipado en las siguientes ranuras: Arma, Regalías, Casco, Armadura y las cuatro de Misceláneos."
 generic_landless_mummy_objective_decision_requirement: "Has visitado #V 60#! [points_of_interest|E] #weak (Actual: [THIS.Var('poi_visited').GetValue|V0])#!"

 withering_blood_objective_decision: "Curar la Sangre Marchita"
 withering_blood_objective_decision_tooltip: "La línea mortal Bomkazi — nuestros aliados del pacto, nuestro sustento — está fallando. Cada generación porta menos de la antigua magia vital. Debemos encontrar una manera de salvarlos o trascender nuestra dependencia."
 withering_blood_objective_decision_desc: "Durante siglos, el pacto entre Impundulu y Bomkazi nos ha sustentado. Pero las brujas mortales se vuelven menos y más débiles. La magia vital que una vez ardió en sus venas se atenúa hasta convertirse en brasas.\n\nHemos viajado lejos, aprendido tanto de Cappadocios como de Giovanni. Con el conocimiento nigromántico que hemos reunido, dos caminos se abren ante nosotros: renovar el antiguo pacto mediante un ritual, o liberarnos de él por completo a través del Rito Ishologu."
 withering_blood_objective_decision_confirm: "El momento ha llegado."

 withering_blood_extra_necromancy_tt: "Ha aprendido al menos un camino de [GetTrait('necromancy').GetName(THIS.Char.Self)] que no sea Impundulu"
 #imp_guardian_necromancy_level_tt: "Tiene nivel de Nigromancia 2 o superior" # unused
 #imp_guardian_bomkazi_died_tt: "Un cortesano Bomkazi ha muerto recientemente" # unused

 craft_shewstone_decision: "Fabricar una Piedra de Shew"
 craft_shewstone_decision_tooltip: "Consagra una piedra pulida y píntala con sangre de ave. Los espíritus susurrarán los secretos de aquellos cuyo nombre esté escrito en ella."
 craft_shewstone_decision_desc: "La Piedra de Shew es una tradición más antigua que el propio linaje: una piedra consagrada pintada con un nombre en sangre de ave. Cuando se pronuncia el nombre, los espíritus inquietos susurran el paradero y los secretos de la persona nombrada.\n\nEl Camino del Cenotafio proporciona el conocimiento para vincular espíritus a la piedra."
 craft_shewstone_decision_confirm: "Comenzar el ritual."

 craft_nightmare_drums_decision: "Fabricar Tambores de Pesadilla"
 craft_nightmare_drums_decision_tooltip: "Fabrica tambores con piel humana. Inaudibles para los vivos, obligan a los espíritus a atormentar los sueños de un rival."
 craft_nightmare_drums_decision_desc: "Los Tambores de Pesadilla están hechos de piel humana estirada sobre hueso. Ningún oído vivo puede oír su ritmo, pero los muertos lo oyen y obedecen.\n\nAl tocarlos a medianoche, los tambores ordenan a los fantasmas que invadan los sueños de un rival, llenando su sueño de terror y pavor."
 craft_nightmare_drums_decision_confirm: "Forjar los instrumentos del terror."

 craft_witch_eye_decision: "Fabricar el Ojo de Bruja"
 craft_witch_eye_decision_tooltip: "Implanta un ojo encantado de un cadáver inquieto en tu propia cuenca. El precio es tu apariencia; la recompensa es la Visión de la Muerte permanente."
 craft_witch_eye_decision_desc: "El Ojo de Bruja es el más extremo de los rituales Impundulu. Se extrae un ojo de un cadáver inquieto, se encanta con poder nigromántico y se implanta en la propia cuenca del nigromante.\n\nEl precio es terrible: el ojo encantado marca a su portador como algo inhumano. Pero el don de la Visión de la Muerte permanente, la capacidad de ver espíritus y atravesar todo engaño, no tiene precio."
 craft_witch_eye_decision_confirm: "Acepto el precio."
 
 ennamaru_victory_objective_decision: "La Grande Tragédie"
 ennamaru_victory_objective_decision_tooltip: "¡Ah, qué gran escenario de desesperación!"
 ennamaru_victory_objective_decision_desc: "Somos los fragmentos rotos de Ennamaru, y la única canción que nuestro oscuro sire escucha es la pura desesperación. Al sumergir a Francia en un orquestado y pesadillesco escenario de tragedia, recompondremos a nuestro maestro y prepararemos el mundo para su gloriosa ruina."
 ennamaru_victory_objective_decision_custom: "Tienes al menos #V 3#! Childer con [intrigue_i][intrigue|E] de #V 10#! o más"
 ennamaru_victory_objective_decision_effect_tooltip: "Ennamaru ciertamente recompensará tus esfuerzos." 
 ennamaru_victory_objective_decision_confirm: "Saluda. La obra maestra está completa."
 
 volgirre_objective_decision: "Magnum Opus"
 volgirre_objective_decision_desc: "A los Diablillos les encanta esculpir su carne en formas grotescas y monstruosas sin ningún atisbo de gracia estética. Estudiando los entresijos de la carne y el hueso, podría transformarme en una forma terriblemente bella, mejor de lo que esos salvajes podrían hacer jamás."
 volgirre_objective_decision_custom: "Necesitas al menos #V 3#! [prisoners|E] con cualquier rasgo de belleza positivo."
 volgirre_objective_decision_confirm: "Preparar a los prisioneros."
 volgirre_objective_decision_effect_tooltip: "Desbloquearás la opción de cambio de forma [GetModifier('POD_shapeshift_form_dark_angel_modifier').GetNameWithTooltip]."
 volgirre_objective_decision_tooltip: "Una forma adecuada para un artista maestro."
 
 mnemachien_objective_decision: "Perfeccionar la Humanitas"
 mnemachien_objective_decision_desc: "Desde las noches de la antigua Lutetia, hemos residido en Francia, pero una gran podredumbre se extiende en esta tierra. Para asegurar el futuro de nuestro pueblo, debemos erradicar la oscuridad infernal que crece en nuestras fronteras. Dominando nuestras hechicerías y fortaleciendo nuestra armonía con los mortales, podríamos aislarnos tanto de lo infernal como de la [Glossary('Bestia','game_concept_beast_desc')] que llevamos dentro. Una vez que se purgue la sombra demoníaca y nos fortalezcamos, finalmente podremos concentrarnos en elevar nuestros dominios y cuidar a nuestra gente en paz."
 mnemachien_objective_decision_custom: "Debes tener al menos #V 3#! [GetCourtPositionType('touchstones_court_position').GetName()] ocupados por mortales de [aptitude|E] buena o superior."
 mnemachien_objective_decision_customtwo: "Ningún Hijo de Ennamaru debe poseer tierras en Francia."
 mnemachien_objective_decision_confirm: "Por fin a salvo."
 mnemachien_objective_decision_effect_tooltip: "Obtendrás [GetModifier('lutetian_roots_modifier').GetNameWithTooltip] y la capacidad de desarrollar tu reino con la acción del consejo de mayordomía."
 mnemachien_objective_decision_tooltip: "El reino necesita ser purificado."