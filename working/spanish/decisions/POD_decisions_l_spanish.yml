 PODinquisition.9999.desc: "Has decidido pasar algún tiempo fuera de tu corte para centrarte en la ardiente fe que brota del centro de tu alma. Una elección virtuosa, sin duda, pero la política vampírica no espera a nadie, y tienes que elegir cuánto tiempo exactamente deseas dejar que tus rivales conspiren a tus espaldas..."
