 unshameer_modifier: "Amigos de los Fera"

 reckoning_dragon_river_war_objective_decision: "Los Nueve Soles de la Guerra del Río Dragón"
 reckoning_dragon_river_war_objective_decision_tooltip: "Levantarás la maldición solar sobre los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')]."
 reckoning_dragon_river_war_objective_decision_desc: "La Guerra del Río Dragón fue una guerra cataclísmica en tiempos pasados que involucró a casi todos los seres sobrenaturales del Reino Medio. Aunque la causa y los eventos de la guerra están envueltos en las brumas del tiempo, sus resultados son claros: la maldición de Yi hace que el sol sea letal para los $pod_kueijin$.\nSi alguien estudiara lo que realmente sucedió y encontrara el legendario arco que Yi usó para perforar el sol, podrían ocurrir resultados maravillosos."
 reckoning_dragon_river_war_objective_decision_confirm: "¿Perforar la maldición?"
 sunny_wankuei: "Los [GetTrait('kueijin').GetName( GetPlayer )] ya no sufrirán heridas por poderes que causen luz solar."
 sun_curse_lifter_modifier: "Levantador de la Maldición Solar"
 wheel_ages_lose_godbodies_modifier_prevented_tt: "#warning Si se completa antes de 1350, esto desactivará la pérdida del modificador Cuerpos Divinos que les ocurriría a los $pod_kueijin$ en esa fecha.#!"
 shih_curse_lifter_tt: "Cuando lo complete un Shih, este objetivo hará que los $pod_kueijin$ no infernalistas ya no consideren el rasgo Shih como un delito."

 little_god_reinstatement_objective_decision: "Restituir a los Pequeños Dioses"
 little_god_reinstatement_objective_decision_tooltip: "Pondrás fin al exilio de los Hsien."
 little_god_reinstatement_objective_decision_desc: "Los burócratas celestiales fueron derrocados durante los días turbulentos que siguieron a la caída en desgracia de los $pod_kueijin$. Ahora forzados a vivir como mortales, han abandonado su lugar en el orden de las cosas.\nEmpujarlos a aceptar nuevamente su tarea divinamente mandatada, y obligar a otros a acatar su autoridad cuando sea necesario, contribuiría enormemente a reparar el debilitado orden celestial."
 little_god_reinstatement_objective_decision_confirm: "Una nueva era (pequeñamente) divina."
 hsien_fae: "Cada hsien perderá el rasgo [GetTrait('changeling').GetName( GetPlayer )] y ganará el rasgo [GetTrait('fae').GetName( GetPlayer )]."
 best_mediator_modifier: "Mediador Celestial"
 little_god_decision_custom: "Necesitas al menos 20 en todas las estadísticas (excepto proeza). Los miembros de tu [GetPlayer.Custom('PODCoterie')] también cuentan."   
