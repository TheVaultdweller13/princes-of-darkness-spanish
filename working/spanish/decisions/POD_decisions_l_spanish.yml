 POD_demon_longevity_decision: "¿Inmortalidad?"
 POD_demon_longevity_decision_tooltip: "Usa tu poder arcano para aumentar la esperanza de vida."
 POD_demon_longevity_decision_desc: "Por cada inversión de este Arcano, el siervo deja de envejecer durante un período de cinco años. Un pequeño paso hacia el mayor de los premios."
 POD_demon_longevity_decision_confirm: "¡Joven otra vez!"
