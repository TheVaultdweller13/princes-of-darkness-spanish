 #new_demon_warrior_empire_objective_decision: "El Demonio Interior"
 #new_demon_warrior_empire_objective_decision_tooltip: "Crearás un nuevo Imperio de Guerrero Demonio."
 #new_demon_warrior_empire_objective_decision_desc: "El Imperio de Guerrero Demonio fue una sociedad predharmánica entre los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] recién caídos que se oponía a los Cinco Emperadores. Se deleitaban en su nueva forma corrupta y elegían abrazarla en lugar de luchar contra ella."
