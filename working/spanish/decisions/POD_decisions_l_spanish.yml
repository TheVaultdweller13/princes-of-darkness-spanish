 achieve_ra_hekau_objective_decision: "Alcanzando el Ra-Hekau"
 achieve_ra_hekau_objective_decision_desc: "Los antiguos Shemsu-Heru llamaban al Ra-Hekau el arte supremo del Hekau, el dominio del mundo mediante el uso de los [Glossary('Nombres Verdaderos','podgloss.truename')] de todo para doblegarlo a la voluntad de uno. Según la leyenda egipcia, el Ra-Hekau fue revelado por primera vez cuando el Dios-Sol Ra le dio a Isis su [Glossary('Nombre Verdadero','podgloss.truename')] para que ella pudiera curarlo de un envenenamiento mortal. Esto le permitió convertirse en la Diosa de la Magia y construir el Hechizo de Vida.\nEl Ra-Hekau se perdió hace mucho tiempo y se cree que es imposible de aprender para las Momias desde entonces, pero han ocurrido cosas más extrañas..."
 achieve_ra_hekau_objective_decision_tooltip: "Poder sobre todos los nombres"
 achieve_ra_hekau_objective_decision_confirm: "Trascendiendo los límites de la magia"
 achieve_ra_hekau_objective_decision_custom1: "Conoces los [Glossary('Nombres Verdaderos','podgloss.truename')] de #V 25#! [traits|E] #weak ([GetPlayer.MakeScope.ScriptValue('known_trait_true_names_number')])#!"

