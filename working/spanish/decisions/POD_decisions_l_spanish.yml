 reckoning_war_of_shame_objective_decision: "Venganza por la Guerra de la Vergüenza"
 reckoning_war_of_shame_objective_decision_tooltip: "Vengarás a los [Glossary('Wan Xian','game_concept_kuei_jin_desc')] corruptos y te aliarás con los Garou."
 reckoning_war_of_shame_objective_decision_desc: "Durante su caída, los primeros $pod_kueijin$ libraron una vergonzosa guerra contra los $glossary_fera$, casi exterminando a algunos de ellos. Para enmendar este error, los Nidos de Dragón robados durante esa guerra deben ser devueltos a su cuidado y sus espíritus ancestrales restaurados."
 reckoning_war_of_shame_objective_decision_confirm: "La venganza es nuestra"
