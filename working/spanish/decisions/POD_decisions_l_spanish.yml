 #ask_pope_decision: "Pedir fondos al Santo Padre"
 #ask_pope_decision_desc: "Solicitarás al Obispo de Roma oro para apoyar la causa."
 #ask_pope_decision_confirm: "Escribir la carta"
 #ask_pope_decision_tooltip: "¡El Papa ciertamente escuchará mi súplica!"
 #ask_pope_decision_effect_tooltip: "Se necesitará algo de sutileza de tu parte para manejar la política bizantina de la Santa Sede"
 #ask_pope.1.t: "Solicitud de Fondos"
 #ask_pope.1.desc: "Tu elección es conformarte con la cantidad de ayuda monetaria proporcionada en la carta fundacional de la orden o persuadir al papa para que profundice en las arcas con el riesgo de disgustarlo."
 #ask_pope.a: "Solicitar fondos adicionales, exagerar la amenaza."
 #ask_pope.a.success: "Pintaste un cuadro aterrador de la amenaza inminente."
 #ask_pope.a.failure: "El papa desestimó tu informe como alarmista."
 #ask_pope.b: "Solicitar fondos adicionales, subrayar la santidad de la causa."
 #ask_pope.b.success: "Lograste apelar al lado ferviente del Santo Padre."
 #ask_pope.b.failure: "No lograste elevar tu causa por encima de otros gastos del papa."
 #ask_pope.c: "Solicitar fondos adicionales, halagar al Santo Padre."
 #ask_pope.c.success: "Hiciste cosquillas a la vanidad del Santo Padre para ponerte de su lado."
 #ask_pope.c.failure: "El papa vio a través de tus obvios intentos de adulación."
 #ask_pope.d: "Solicitar fondos adicionales, inflar tus gastos." 
 #ask_pope.d.success: "Moviste los números en los libros para justificar fondos adicionales."
 #ask_pope.d.failure: "El papa no fue engañado por tu contabilidad creativa."
 #ask_pope.e: "Simplemente solicitar la suma acordada."
 #ask_pope.a.success.t: "El papa te cree."
 #ask_pope.a.success.desc: "El Santo Padre está conmocionado hasta lo más profundo por el caos y la depravación que presenciaste. Envía una asignación doble."
 #ask_pope.a.failure.t: "El papa es escéptico."
 #ask_pope.a.failure.desc: "Embelleciste tu informe hasta tal punto fantástico que el Santo Padre comienza a dudar de que haya algo que hagas aparte de inventar historias."
 #ask_pope.b.success.t: "El papa está convencido."
 #ask_pope.b.success.desc: "El Santo Padre está de acuerdo, no hay causa más justa para un clérigo que proteger a su rebaño. Envía una asignación doble."
 #ask_pope.b.failure.t: "El papa reconsidera sus gastos."
 #ask_pope.b.failure.desc: "Tu inepta descripción de la causa de tu orden le recordó al Santo Padre gastos más inmediatos."
 #ask_pope.c.success.t: "El papa se siente halagado."
 #ask_pope.c.success.desc: "Tu sutil y finamente elaborada adulación te convirtió en una de las personas favoritas del Santo Padre para financiar. Envía una asignación doble."
 #ask_pope.c.failure.t: "El papa ve a través de tu adulación."
 #ask_pope.c.failure.desc: "Tus torpes intentos de halagar al Santo Padre fueron recibidos como nada menos que insultantes."
 #ask_pope.d.success.t: "Lograste justificar el presupuesto."
 #ask_pope.d.success.desc: "El Santo Padre concedió que tu misión podría ser una empresa más costosa de lo que se anticipó inicialmente."
 #ask_pope.d.failure.t: "Tus libros son sospechosos."
 #ask_pope.d.failure.desc: "Tu torpe intento de inflar tus gastos llevó a los contables papales a concluir que, de hecho, estás sobrefinanciado."
 #ask_pope.e.t: "Recibes financiación."
 #ask_pope.e.desc: "Justo la cantidad proporcionada en el fondo designado, ni más ni menos." 
