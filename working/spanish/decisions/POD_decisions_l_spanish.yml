 ravnos_jati_decision: "Los Jati Ravnos"
 ravnos_jati_decision_tooltip: "Una familia dividida, cada una persiguiendo sus propios objetivos."
 ravnos_jati_decision_desc: "El Clan Ravnos está dividido entre numerosos Jati (castas), cada uno persiguiendo sus propios objetivos. Si lograras esos objetivos, el espíritu de tu Jati en su conjunto mejoraría."
 ravnos_jati_decision_confirm: "¡Nuestra casta se alza triunfante!"
  
 awake_hun_and_po_objective_decision: "Despertar tu Hun y P'o"
 awake_hun_and_po_objective_decision_tooltip: "Despertarás tu Hun y P'o para convertirte en un [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] en toda regla"
 awake_hun_and_po_objective_decision_desc: "Los Salubri reciben una bienvenida fría pero esencialmente cortés por parte de los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] interesados en estudiar la difusión de su saber. Las Disciplinas Salubri son perversiones (o transformaciones) fascinantes de la herencia [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], por lo que los [Glossary('Muertos Hambrientos','game_concept_kuei_jin_desc')] de inclinación académica encuentran mucho de interés. Se rumorea que uno o más Salubri realmente despertaron su Hun y P'o, pero el proceso en sí es misterioso, por decir lo menos."
 awake_hun_and_po_objective_decision_confirm: "El rumor era cierto"
