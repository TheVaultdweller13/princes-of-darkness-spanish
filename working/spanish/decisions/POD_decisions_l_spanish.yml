 POD_sabbat_join_black_hand_decision: "Unirse a la Mano Negra"
 POD_sabbat_join_black_hand_decision_tooltip: "Únete a la Mano Negra para poder cazar criminales que amenazan al Sabbat."
 POD_sabbat_join_black_hand_decision_confirm: "Un mundo ennegrecido"
 POD_sabbat_join_black_hand_decision_desc: "La Mano Negra, o simplemente la Mano, comprende una subdivisión especial del Sabbat, una secta dentro de una secta. Son un grupo de élite de vampiros reconocidos como separados de todos los demás miembros de la secta. Son, esencialmente, el ejército del Sabbat."
 
 POD_sabbat_leave_black_hand_decision: "Abandonar la Mano Negra"
 POD_sabbat_leave_black_hand_decision_tooltip: "He cumplido mi parte para el Sabbat."
 POD_sabbat_leave_black_hand_decision_confirm: "Mi vida militar ha terminado"
 POD_sabbat_leave_black_hand_decision_desc: "Abandona la Mano Negra, perdiendo los privilegios y obligaciones que conlleva."

 suicide_by_diablerie_decision: "Diablerie Ritual"
 suicide_by_diablerie_decision_tooltip: "¿Es hora de pasar la antorcha a la siguiente generación?"
 suicide_by_diablerie_decision_confirm: "Al morir, me vuelvo verdaderamente inmortal"
 suicide_by_diablerie_decision_desc: "Los Jocastianos tienen una práctica donde un maestro puede dejarse diablerizar por un estudiante para preservar el conocimiento que ha acumulado. ¿Quizás ha llegado tu momento?"
 
 qorjin_victory_objective_decision: "Historia Secreta de los Mongoles"
 qorjin_victory_objective_decision_tooltip: "Muchas amenazas acechan al pueblo mongol. El Khan se ocupará de lo mundano, tú te ocuparás de lo sobrenatural."
 qorjin_victory_objective_decision_desc: "Las estepas están llenas de criaturas sobrenaturales que se alimentan del pueblo mongol. Debes asegurar tu posición antes de que se haga realidad el rumor de una invasión aún más amenazante proveniente del este."
 qorjin_victory_objective_decision_confirm: "No se atreverán a venir ahora"
 qorjin_victory_objective_decision_effect_tooltip: "Eliminarás la amenaza de la invasión [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] que de otro modo ocurriría en 1360.\nElegirás entre abrazar tu papel como protector de los mongoles y ganar tropas de eventos mongolas, o apoyarte en tu amistad con los hombres lobo, obteniendo acceso a sus Soldados."  
 
 dazbog_victory_objective_decision: "El Legado de Dazbog"
 dazbog_victory_objective_decision_tooltip: "Dazbog observa a sus sucesores con ojo avizor. ¿Serás digno?"
 dazbog_victory_objective_decision_desc: "Dazbog fue quizás el mejor guerrero de esta tierra. ¿Qué mejor manera de honrar este legado que matando a tu enemigo ancestral, el odiado Tzimisce?"
 dazbog_victory_objective_decision_confirm: "¡Los demonios acobardados!"
 dazbog_victory_objective_decision_effect_tooltip: "Ganarás la ilustre espada Szczerbiec y acceso a los [GetMaA('dazbog_hunters').GetName] como recompensa."  
  
 indep_victory_objective_decision: "Creando un Legado"
 indep_victory_objective_decision_tooltip: "No estarás aquí para siempre, pero tristemente el enemigo podría estarlo."
 indep_victory_objective_decision_desc: "Eres solo una persona contra la oscuridad. Si quieres tener un impacto duradero, debes prepararte para el futuro y para tus sucesores."
 indep_victory_objective_decision_confirm: "Un legado de cazadores"
 indep_victory_objective_decision_effect_tooltip: "Elegirás entre varios modificadores de dinastía."  
 has_supernatural_race_trigger_tt: "es sobrenatural"
 
 pet_dragon_decision: "Mascota [ROOT.Char.Custom('DragonStoryName')]"
 pet_dragon_decision_desc: "Es hora de respirar hondo y encontrar a mi fiel compañero de cuatro patas [ROOT.Char.Custom('DragonStoryName')]. Algunas personas dicen que los dragones son criaturas de temperamento difícil, pero sin importar lo dura que se ponga la vida, sé que [ROOT.Char.Custom('DragonStorySheHe')] ¡siempre estará ahí para mí!"
 pet_dragon_decision_tooltip: "¡Escamoso!"
 pet_dragon_decision_confirm: "¿Quién es un buen dragón? ¡Tú lo eres!"
 
 POD_sabbat_victory_objective_decision: "Triunfo del Sabbat"
 POD_sabbat_victory_objective_decision_tooltip: "Unidos como uno solo, allanando el camino para el regreso de Caín."
 POD_sabbat_victory_objective_decision_desc: "El Sabbat y la Camarilla están envueltos en una guerra total por el alma del mundo vampírico. Solo cuando los clanes estén alineados bajo una misma visión, uno de ellos será verdaderamente el vencedor."
 POD_sabbat_victory_objective_decision_confirm: "El mundo está listo para Caín."
 POD_sabbat_victory_objective_decision_custom: "#weak Cardenal es un personaje que al menos una vez tuvo control de más del 33% de una región mientras era miembro del Sabbat#!"
