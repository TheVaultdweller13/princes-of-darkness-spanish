 #back_to_third_age_objective_decision_tooltip: "Harás retroceder la rueda hasta la [Glossary('Tercera Era','game_concept_third_age_desc')]."
 #back_to_third_age_objective_decision_desc: "Con la [Glossary('Cuarta Era','game_concept_fourth_age_desc')] asegurada, es hora de traer de vuelta la [Glossary('Tercera Era','game_concept_third_age_desc')]."
 #back_to_third_age_objective_decision_confirm: "Aún más atrás."
