 new_yama_king_objective_decision: "Nacimiento de un Nuevo [Glossary('Rey Yama','podgloss.yamaking')]"
 new_yama_king_objective_decision_desc: "Los [Glossary('Reyes Yama','podgloss.yamaking')] son los guardianes supremos de Yomi Wan, y en su mayoría sirvientes caídos del [Glossary('Augusto Personaje de Jade','podgloss.augustpersonageofjade')] que, al descubrir que el chi podía extraerse de las almas humanas mediante la tortura, adoptaron tales técnicas para extraer esa energía. Son conocidos como azotes en Occidente, mientras que aquellos de Yin son llamados Malfeantes por los espectros occidentales.\nLa jerarquía de estos seres cambia con el tiempo, ya que los viejos son derrotados por otros más nuevos cuyo ascenso a menudo está ligado a algún trastorno importante en el mundo mortal."
 new_yama_king_objective_decision_tooltip: "¿Por qué servir cuando puedes controlar?"
 new_yama_king_objective_decision_confirm: "Es bueno ser Rey Yama."
 new_yama_king_objective_decision_custom1: "La suma total de las habilidades de tus $POD_splat_wraith$ vinculados debe exceder #V 200#!"
 new_yama_king_objective_decision_custom2: "Tu [umbra_aptitude|E] debe exceder [grace_i]#V 75#!"
 new_yama_king_objective_decision_effect: "Comenzarás una gran batalla contra un [Glossary('Rey Yama','podgloss.yamaking')] existente por su dominio. Ten cuidado, no caerán sin una pelea seria."

 rediscover_kung_yis_training_style_objective_decision: "Redescubriendo el Estilo de Entrenamiento de Wan Kung Yi"
 rediscover_kung_yis_training_style_objective_decision_desc: "El Maestro Yi era un defensor del entrenamiento dedicado uno a uno. Su estilo se perdió durante el ascenso del Ejército Celestial, pero algunas pistas permanecen y podrían llevar a su redescubrimiento."
 rediscover_kung_yis_training_style_objective_decision_tooltip: "De vuelta a lo básico"
 rediscover_kung_yis_training_style_objective_decision_confirm: "Siguiendo los pasos del maestro"
 rediscover_kung_yis_training_style_objective_decision_custom1: "Tus [skills|E] totales, incluida la [prowess|E], deben exceder #V 95#!"
 rediscover_kung_yis_training_style_objective_decision_effect1: "El límite de [skill|E] para el entrenamiento aumenta de 15 a 20 (25 a 30 en el caso de la [prowess|E])."
 rediscover_kung_yis_training_style_objective_decision_effect2: "Desbloquea el objetivo 'Continuando el Legado de Wan Kung Yi'"

 continuing_kung_yi_legacy_objective_decision: "Continuando el Legado de Wan Kung Yi"
 continuing_kung_yi_legacy_objective_decision_desc: "El Maestro Yi tenía varias enseñanzas secretas que ahora están perdidas en el tiempo. Aun así, podrías intentar emular lo poco que se sabe de ellas para mejorar tu estilo de entrenamiento."
 continuing_kung_yi_legacy_objective_decision_tooltip: "Las enseñanzas secretas"
 continuing_kung_yi_legacy_objective_decision_confirm: "Siguiendo los pasos del maestro"
 continuing_kung_yi_legacy_objective_decision_custom1: "Las [skills|E] totales, incluida la [prowess|E], de al menos 3 de tus hijos (estudiantes) deben exceder #V 60#!"
 continuing_kung_yi_legacy_objective_decision_effect1: "Los Shih ahora pueden entrenar a cualquier otro shih, ya no están restringidos solo a sus hijos"
 continuing_kung_yi_legacy_objective_decision_effect2: "Desbloquea el objetivo 'La Causa Justa y Sabia'"

 restoring_shih_legacy_objective_decision: "La Causa Justa y Sabia"
 restoring_shih_legacy_objective_decision_desc: "Los Shih del pasado perdieron el rumbo cuando formaron el Ejército Celestial que llevó a su perdición. Sin embargo, ¿fue su idea en sí un error o simplemente la forma en que la llevaron a cabo?"
 restoring_shih_legacy_objective_decision_tooltip: "La elección celestial"
 restoring_shih_legacy_objective_decision_confirm: "La elección celestial"
 restoring_shih_legacy_objective_decision_effect1: "Los Shih seguirán el camino original de Wan Kung Yi."
 restoring_shih_legacy_objective_decision_effect2: "Los Shih seguirán el camino del Ejército Celestial para aniquilar a todos los shen (sobrenaturales)."
 restoring_shih_legacy_objective_decision_effect3: "'Traicionarás' a los otros Shih y buscarás poder solo para tu propio beneficio."

 keeping_the_roots_safe_objective_decision: "Manteniendo las Raíces a Salvo"
 keeping_the_roots_safe_objective_decision_desc: "Nosotros nos originamos en #ONCLICK:CULTURE,[GetCultureByKey('ancient_egyptian').GetID] #TOOLTIP:CULTURE,[GetCultureByKey('ancient_egyptian').GetID] #L el Antiguo Egipto#!#!#!, y no debemos olvidar nuestras raíces. Pero con cada año que pasa, lo que una vez fue la civilización más grandiosa se pierde lentamente entre las arenas del tiempo. No podemos permitirlo, porque nuestros recuerdos son lo que nos hace humanos."
 keeping_the_roots_safe_objective_decision_tooltip: "Manteniendo nuestros corazones vivos"
 keeping_the_roots_safe_objective_decision_confirm: "Salvando las Raíces"
 keeping_the_roots_safe_objective_decision_custom1: "Debe haber al menos #V 10#! condados con [cultura|E] [GetCultureByKey('ancient_egyptian').GetName]"
 keeping_the_roots_safe_objective_decision_effect1: "Los $POD_splat_mummy_plural$ de [GetFaithByKey('ishmaelite').GetName] resucitarán el doble de rápido #weak (5 años en lugar de 10)#!"
 keeping_the_roots_safe_objective_decision_effect2: "Los requisitos para todos los demás objetivos de $POD_splat_mummy$ se reducirán"

 ending_the_snake_objective_decision: "El Fin de la Serpiente"
 ending_the_snake_objective_decision_desc: "Desde el primer enfrentamiento entre [GetScriptedCharacterByHistoryID('792593').GetFirstName] y [GetScriptedCharacterByHistoryID('505012').GetFirstName], los Setitas han sido nuestros enemigos. Se aliaron con $glossary_wyrm_apophis$ y corrompen lo que una vez fue grande. Debemos aniquilarlos y finalmente dejar atrás esta guerra."
 ending_the_snake_objective_decision_tooltip: "La derrota definitiva de las serpientes"
 ending_the_snake_objective_decision_confirm: "La guerra eterna, por fin terminada"
 ending_the_snake_objective_decision_custom1: "El propietario de [GetTitleByKey('c_cairo').GetBaseName] #weak ([GetTitleByKey('c_cairo').GetHolder.GetFirstName])#! debe ser [GetTrait('shemsuheru').GetName(GetNullCharacter)] o [GetFaithDoctrine('special_doctrine_osirian_league').GetBaseName]"
 ending_the_snake_objective_decision_custom2: "No puede haber ningún [landed|E] [GetReligionByKey('roadofset_religion').GetName] [GetTrait('vampgeneration5').GetName(GetPlayer)] [GetTrait('setite').GetName(GetPlayer)] independiente"
 ending_the_snake_objective_decision_custom2_ex: "$ending_the_snake_objective_decision_custom2$ #weak ([example.GetFirstName])#!"
 ending_the_snake_objective_decision_effect1: "#TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Los Setitas#!#! ya no podrán hacer la $pod_Embrace$"
 ending_the_snake_objective_decision_effect2: "Todos los Setitas restantes verán su autoridad quebrantada."

 land_of_faith_objective_decision: "La Tierra de la Fe"
 land_of_faith_objective_decision_desc: "La Tierra de la Fe se refiere tradicionalmente a las líneas de poder del Antiguo Egipto que se extendieron hacia afuera a lo largo de los siglos. Este es un lugar donde el Sekhem es más fácil de usar y recolectar. Controláramos este río de energía pura, podríamos lograr lo imposible."
 land_of_faith_objective_decision_tooltip: "Red de la Vida"
 land_of_faith_objective_decision_confirm: "Desde Egipto y más allá"
 land_of_faith_objective_decision_custom1: "No debe haber personajes [landed|E] 'malvados' independientes, ej. $POD_splat_vampire_plural$, $POD_splat_demon_plural$, etc., en la [region|E] [GetGeographicalRegion('pod_lands_of_faith').GetName] #weak (a menos que su fe sea [GetFaithDoctrine('special_doctrine_against_to_apophis_hostility').GetBaseName])#!"
 land_of_faith_objective_decision_custom1_ex: "$land_of_faith_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 land_of_faith_objective_decision_custom2: "No debe haber personajes [landed|E] independientes, ej. $POD_splat_vampire_plural$, $POD_splat_demon_plural$, $POD_splat_hunter_plural$, etc., en la [region|E] [GetGeographicalRegion('pod_lands_of_faith').GetName] #weak (a menos que su fe sea [GetFaithDoctrine('special_doctrine_against_to_apophis_hostility').GetBaseName])#!"
 land_of_faith_objective_decision_custom2_ex: "$land_of_faith_objective_decision_custom2$ #weak ([example.GetFirstName])#!"

 ending_the_serpent_objective_decision: "El Antagonista Principal: $glossary_wyrm_apophis$"
 ending_the_serpent_objective_decision_desc: "Nuestro objetivo más fundamental, restaurar el Ma'at (el concepto del Antiguo Egipto de un equilibrio justo), se consideraba imposible debido a la existencia de [UmbraGlossary('oblivion')] corrompiendo y perturbando constantemente el universo. Con la fuerza vital casi infinita de la Tierra de la Fe, podemos intentar destruir finalmente el concepto mismo de [UmbraGlossary('oblivion')]."
 ending_the_serpent_objective_decision_tooltip: "La última batalla de $glossary_wyrm_apophis$"
 ending_the_serpent_objective_decision_confirm: "El triunfo del Ma'at"
 ending_the_serpent_objective_decision_custom1: "Todas #TOOLTIP:GAME_TRAIT,banemummy,[GetNullCharacter] #L las Momias Azote#!#! deben estar muertas"
 ending_the_serpent_objective_decision_custom1_ex: "$ending_the_serpent_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 ending_the_serpent_objective_decision_effect1: "[UmbraGlossary('oblivion')] está muerto, y tú lo mataste. El equilibrio se ha restaurado y el mundo derivará lentamente hacia la rectitud, como siempre debería haber sido. #X La partida ha terminado, pues el mundo que conocías cambió de maneras imposibles de representar en Crusader Kings 3#!"


 serving_eagles_head_objective_decision: "Cortando la Cabeza del Águila"
 serving_eagles_head_objective_decision_desc: "El mundo está condenado, pero algunos aún intentan salvar este barco que se hunde. Es inútil, y solo prolonga su mísera existencia. Es hora de que $glossary_wyrm_apophis$ festine."
 serving_eagles_head_objective_decision_tooltip: "El festín de $glossary_wyrm_apophis$"
 serving_eagles_head_objective_decision_confirm: "Los últimos defensores de este mundo caen."
 serving_eagles_head_objective_decision_custom1: "No debe haber ningún $POD_splat_mummy_plural$ [landed|E] [GetTrait('shemsuheru').GetName(GetNullCharacter)]"
 serving_eagles_head_objective_decision_custom1_ex: "$serving_eagles_head_objective_decision_custom1$ #weak ([example.GetFirstName])#!"

 last_meal_before_midnight_objective_decision: "La Última Cena Antes de la Medianoche"
 last_meal_before_midnight_objective_decision_desc: "Después de eliminar a las ilusas Momias de la ecuación, [UmbraGlossary('oblivion')] está casi listo para su última comida. Pero eso no es suficiente, lo que queda de las fuerzas de Horus dificulta nuestra tarea. La solución es simple, solo tenemos que matarlos a todos."
 last_meal_before_midnight_objective_decision_tooltip: "La Última Cena Antes de la Medianoche"
 last_meal_before_midnight_objective_decision_confirm: "El fin está aquí"
 last_meal_before_midnight_objective_decision_custom1: "No debe haber ningún [character|E] [landed|E] que sea [GetFaithDoctrine('special_doctrine_against_to_apophis_hostility').GetBaseName]"
 last_meal_before_midnight_objective_decision_custom1_ex: "$last_meal_before_midnight_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 last_meal_before_midnight_objective_decision_effect1: "[UmbraGlossary('oblivion')] devorará el mundo. #X La partida ha terminado, pues el mundo que conocías se desvanece en la nada.#!"

 POD_show_true_name_decision: "Mostrar Nombres Verdaderos Conocidos"
 POD_show_true_name_decision_desc: "Muestra una lista de los Ren conocidos de plantas, animales y metales."
 POD_show_true_name_decision_confirm: "OK"
 POD_show_true_name_decision_tooltip: "Muestra una lista de los Ren conocidos"

 POD_renaming_the_hekau_decision: "Renombrar el Hekau"
 POD_renaming_the_hekau_decision_desc: "En los niveles más altos de dominio del ren, una $POD_splat_mummy$ puede reorganizar las leyes que rigen otra habilidad sobrenatural.\n\n@warning_icon!#X Esta decisión solo puede tomarse una vez. ¡Elige con cuidado!#!"

 POD_renaming_the_hekau_decision_tt: "Comenzarás un [journey|E] para #bold [Localize(Concatenate(GetPlayer.MakeScope.Var('renaming_the_hekau_selection').GetFlagKey,'_name'))]#!"
 POD_renaming_the_hekau_decision_confirm: "El significado hecho manifiesto"
 POD_renaming_the_hekau_decision_tooltip: "Reescribe una habilidad para que se adapte a tus necesidades"

 side_with_horus_objective_decision: "Aplacando al Vengador"
 side_with_horus_objective_decision_desc: "[GetScriptedCharacterByHistoryID('792593').GetFirstName] odia nuestra propia existencia y vuelve nuestra inmortalidad muy desagradable. Aunque hay rencillas entre nosotros, aún podríamos llegar a un acuerdo con un serio esfuerzo diplomático."
 side_with_horus_objective_decision_tooltip: "Aliarse con Horus"
 side_with_horus_objective_decision_confirm: "Tenemos enemigos comunes"
 side_with_horus_objective_decision_custom1: "No debe haber ningún $POD_splat_mummy_plural$ [GetTrait('shemsuheru').GetName(GetNullCharacter)] de la [faith|E] [GetFaithByKey('code_of_horus').GetName] cuya [opinion|E] hacia ti sea inferior a #V 75#!"
 side_with_horus_objective_decision_custom1_ex: "$side_with_horus_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 side_with_horus_objective_decision_effect1: "#X Esto es mutuamente excluyente con los otros objetivos de [GetTrait('cabiri').GetName(GetNullCharacter)]#!"

 ending_the_hunt_objective_decision: "El Fin del Vengador"
 ending_the_hunt_objective_decision_desc: "[GetScriptedCharacterByHistoryID('792593').GetFirstName] odia nuestra propia existencia y vuelve nuestra inmortalidad muy desagradable. Sin embargo, ni un ser como él es invencible, y quizás deberíamos adoptar un enfoque más agresivo para este problema..."
 ending_the_hunt_objective_decision_tooltip: "El Fin de la Cacería"
 ending_the_hunt_objective_decision_confirm: "Set estará contento, supongo"
 ending_the_hunt_objective_decision_custom: "Debes tener más [prowess|E] que [GetScriptedCharacterByHistoryID('792593').GetFirstName] #weak (#V [GetPlayer.GetProwess]#! vs #V [GetScriptedCharacterByHistoryID('792593').GetProwess]#!)#!"
 ending_the_hunt_objective_decision_effect1: "Todos los $POD_splat_mummy_plural$ [GetTrait('cabiri').GetName(GetNullCharacter)] obtendrán [GetModifier('cabiri_secured_future_modifier').GetNameWithTooltip]"
 ending_the_hunt_objective_decision_effect2: "#X Esto es mutuamente excluyente con el objetivo 'Aplacando al Vengador'#!"

 new_theourgia_arts_objective_decision: "Expandiendo las Artes de la Teurgia"
 new_theourgia_arts_objective_decision_desc: "Nosotros, los $POD_splat_mummy_plural$, estamos anclados en el pasado. Seguimos usando la magia de #ONCLICK:CULTURE,[GetCultureByKey('ancient_egyptian').GetID] #TOOLTIP:CULTURE,[GetCultureByKey('ancient_egyptian').GetID] #L el Antiguo Egipto#!#!#!, pero desde entonces ha surgido algo nuevo (¿y quizás mejor?). Forjado por generaciones de #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechiceros#!#!, es un desarrollo muy interesante que podría darnos ventaja en los años venideros."
 new_theourgia_arts_objective_decision_tooltip: "Hechicería para una nueva era"
 new_theourgia_arts_objective_decision_confirm: "Hechicería para una nueva era"
 new_theourgia_arts_objective_decision_custom1: "Tener al menos 10 [prisoners|E] que #italic podrían#! aprender #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#! #weak ([GetTrait('bastet').GetName(GetNullCharacter)], [GetTrait('mortal').GetName(GetNullCharacter)], o semi-splats similares a mortales)#!"
 new_theourgia_arts_objective_decision_custom2: "Tener al menos 5 [prisoners|E] [GetTrait('sorcerer').GetName(GetNullCharacter)]"
 new_theourgia_arts_objective_decision_custom3: "Tener al menos 2 [friends|E] [GetTrait('sorcerer').GetName(GetNullCharacter)] u otras [relations|E] positivas"
 new_theourgia_arts_objective_decision_effect1: "Todos los $POD_splat_mummy_plural$ [GetTrait('cabiri').GetName(GetNullCharacter)] podrán convertirse en #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechiceros#!#! y su [duchy_building|E] ya no requerirá [friends|E] hechiceros"

 secure_hades_objective_decision: "Asegurando el Hades"
 secure_hades_objective_decision_desc: "Cuando [GetScriptedCharacterByHistoryID('792600').GetFirstName] usó por primera vez su versión del Hechizo de Vida, eligió el Hades como nuestro nuevo reino de ultratumba. Pero no es tan estable como el Amenti egipcio y causa problemas masivos al resucitar después de la muerte. Debemos estabilizarlo."
 secure_hades_objective_decision_tooltip: "Nuestro propio lugar para descansar"
 secure_hades_objective_decision_confirm: "¿Necesitamos un Cerbero?"
