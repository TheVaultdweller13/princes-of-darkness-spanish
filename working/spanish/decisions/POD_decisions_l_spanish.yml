 talmahera_victory_objective_decision: "El Principio del Fin"
 talmahera_victory_objective_decision_tooltip: "Debes preparar el fin de la raza $pod_cainite$"
 talmahera_victory_objective_decision_desc: "La Tal'mahe'Ra yace dividida entre Este y Oeste, cortada por la mitad por los Assamitas de Persia y los Ravnos de la India. Si vas a preparar el regreso de los [Glossary('Antediluvians','game_concept_antediluvian_desc')], este cisma debe ser sanado."
