 blackcross_victory_objective_decision: "Bajo la Cruz Negra"
 blackcross_victory_objective_decision_tooltip: "El Este está libre para tomar"
 blackcross_victory_objective_decision_desc: "A pesar de un intento fallido de Jürgen von Verden, los Ventrue alemanes todavía miran al Este como una tierra salvaje e indómita. Sin embargo, será necesario lidiar con muchos enemigos antes de lograr un liderazgo Ventrue adecuado."
 blackcross_victory_objective_decision_effect_tooltip2: "Obtendrás un derecho sobre los reinos occidentales. Un nuevo prospecto llegará a tu corte." 
