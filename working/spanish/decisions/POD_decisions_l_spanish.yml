 POD_demon_maintenance.40.t: "Elección Infernal"
 POD_demon_maintenance.40.desc: "Con tu dominio de la demonología, puedes realizar un gran ritual de sacrificio dedicado a uno de los Archiduques Infernales.\nLos cinco lugartenientes de Lucifer han sido durante mucho tiempo la cúspide de la jerarquía del Infierno, compitiendo entre ellos para corromper la Creación y obtener su venganza contra Dios. Siempre están buscando más seguidores y pueden ser generosos con aquellos que los honran... pero siempre hay un precio que pagar al final."
 POD_demon_maintenance.40.option.abaddon: "Abaddon, Señor de la Legión de Ébano"
