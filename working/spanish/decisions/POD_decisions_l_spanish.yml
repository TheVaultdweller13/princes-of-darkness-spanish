 #unsevering_objective_decision: "Reparar la Separación"
 #unsevering_objective_decision_tooltip: "Intentarás debilitar la red que contiene al $glossary_wyrm$."
 #unsevering_objective_decision_desc: "El [Glossary('San Yuan', 'glossary_triat_tt')] fue traído a la existencia, y la vida tal como se conoce hoy fue formada. Pero ocurrió la Separación, la Gran Araña aprisionó al Ciempiés, volviéndolo loco. Liberaremos y sanaremos (o destruiremos todas las partes corruptas de) al Ciempiés... pero primero debemos debilitarlo para hacerlo más controlable."
 #unsevering_objective_decision_confirm: "Reequilibrando las balanzas cósmicas."
 #unsevering_objective_decision_custom: "No debe haber ningún [independent_ruler|E] wyrmish en el mapa."
 #unsevering_objective_decision_custom_ex: "$unsevering_objective_decision_custom$ #weak ([example.GetFirstName])#!"
 #unsevering_objective_decision_effect_tooltip: "Todo guanteletes y sudarios se debilitarán al nivel #V 1#!."
 #wall_beaker_modifier: "Rompedor del Muro"

 unhell_objective_decision: "Acosar al Emperador Demonio"
 unhell_objective_decision_tooltip: "Tendrá que luchar por cada paso de su trono."
 unhell_objective_decision_desc: "La llegada del [Glossary('Emperador Demonio','podgloss.demonemperor')] es un hecho inevitable en el Reino Medio. Aun así, puede ser ralentizado y debilitado por aquellos lo suficientemente valientes y preparados para enfrentarse a sus sirvientes."
 unhell_objective_decision_confirm: "Victoria... por ahora."
 unhellish_modifier: "Perdición de Yomi"
 wheel_ages_akuma_buff_prevented_tt: "#warning Si se completa antes de 1350, esto evitará el aumento de poder para los [akuma|E] que de otro modo ocurriría en esa fecha.#!"
 unhell_objective_decision_tt: "Necesitas un arma #ILLUSTRIOUSPURPLE Ilustre#! y una armadura #ILLUSTRIOUSPURPLE Ilustre#!.\nTambién necesitas un yelmo de cualquier rareza."

 #unkuei_objective_decision: "Buscando una Segunda Era"
 #unkuei_objective_decision_tooltip: "El poder divino envolviendo el mundo nuevamente."
 #unkuei_objective_decision_desc: "El fuego que duerme dentro de todos despierta de nuevo. La Segunda Era original terminó porque el mal echó raíces en nuestros corazones. Nos prepararemos para el despertar del poder divino en los mortales y para que se imbuyan... y lo haremos mejor que en la primera Segunda Era."
 #unkuei_objective_decision_confirm: "Imbuidos de divinidad."
 #unkuei_objective_decision_effect_tooltip: "Los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] tendrán mucha más facilidad para avanzar en su [Glossary('Dharma','podgloss.dharma')], y todos los poderes podrán desbloquearse independientemente del nivel de [Glossary('Dharma','podgloss.dharma')]."
 #imbued_teacher_modifier: "Portador Imbuido"

 #back_to_second_age_objective_decision: "Regresar a la Segunda Era"
 #back_to_second_age_objective_decision_tooltip: "Harás retroceder la rueda hasta la [Glossary('Segunda Era','game_concept_second_age_desc')]."
 #back_to_second_age_objective_decision_desc: "El momento ha llegado por fin, la purificación de todo mal y corrupción del mundo. Es nuestra última batalla, nuestro último viaje, nuestra última guerra. Desharemos la Separación y purificaremos al Ciempiés. Mataremos a los [Glossary('Reyes Yama','podgloss.yamaking')] y destruiremos el [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')]. Encontraremos un camino hacia el cielo para todos."
 #back_to_second_age_objective_decision_confirm: "El final perfecto."
 #back_to_second_age: "El Reino Medio regresará a la [Glossary('Segunda Era','game_concept_second_age_desc')]"
 #middle_kingdom_ending_tooltip: "Con el regreso de la [Glossary('Segunda Era','game_concept_second_age_desc')], tu partida terminará, pues el mundo que una vez conociste cambiará para siempre."

 sacrifice_perk_from_obtenebration_decision: "Sacrificar Obtenebración por Misticismo del Abismo"
 sacrifice_perk_from_obtenebration_decision_tooltip: "Progresar en este camino requiere sacrificios."
 sacrifice_perk_from_obtenebration_decision_desc: "Sacrifica un nivel de Obtenebración para aumentar tu dominio del Misticismo Abismal, desbloqueando nuevos [bs_rituals|E]."
 sacrifice_perk_from_obtenebration_decision_confirm: "Un sacrificio digno."

 daimyos_presence_decision: "Presencia del Daimyo"
 daimyos_presence_decision_tooltip: "Enfoque"
 daimyos_presence_decision_desc: "Vincula soldados a tu causa mediante el honor"
 daimyos_presence_decision_confirm: "Prepárate para infundir honor"
 daimyos_presence_decision_effect: "Podrás desbloquear un único regimiento de [men_at_arms|E] entre las siguientes opciones:\n$BULLET_WITH_TAB$[GetMaA('POD_ronin_hatamoto').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_ronin').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_yumihiki').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_yumihiki_riders').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_sojutsuka').GetName]\n$BULLET_WITH_TAB$[GetMaA('POD_sojutsuka_riders').GetName]\n"
 daimyos_presence_decision_effect_2: "Si ya has realizado tu elección, también puedes usar esta decisión para cambiarla, siempre que no tengas ningún regimiento de los tipos mencionados anteriormente."

 vaulderie_decision: "Realizar la Vaulderie"
 vaulderie_decision_desc: "Al realizar un ritual y beber de una copa llena de la [pod_vitae$] compartida de todos los miembros de [GetPlayer.Custom('PODCoterie')], se puede crear un [Glossary('Vínculo de Sangre','game_concept_bloodbond_desc')] comunal con propiedades especiales. Este vínculo, llamado Vínculo, destruye todos los vínculos de sangre existentes y no se deteriora con el tiempo. Los participantes sentirán un fuerte sentido de lealtad entre ellos, sin el enredo emocional que suele acompañar a los vínculos de sangre."
 vaulderie_decision_tooltip: "Forja un vínculo irrompible con tus compañeros"
 vaulderie_decision_confirm: "Sin cadenas, sin amos"
 vaulderie_decision_is_valid: "Tienes un miembro de [GetPlayer.Custom('PODCoterie')] con sangre vampírica #weak ($POD_splat_vampire$, $POD_splat_ghoul$, $POD_splat_revenant$)#! que aún no ha participado en este ritual"
 vaulderie_decision_effect: "Todos los miembros de [GetPlayer.Custom('PODCoterie')] con sangre vampírica obtienen [perpetual_hooks|E] mutuos. Estos beneficios se pierden al abandonar la [GetPlayer.Custom('PODCoterieNoTooltip')]."
 POD_vaulderie_toast: "Lazos Forjados en Sangre"
 POD_vinculum_modifier: "Vínculo"
 POD_vinculum_modifier_desc: "No puede estar [Glossary('Vinculado por la Sangre','game_concept_bloodbond_desc')]."

 overwork_capital_decision: "Sobreexplotar la Capital"
 overwork_capital_decision_desc: "La ciudad aún duerme. Sueña débilmente con su potencial no realizado.\nDespiértala, oh Buscador. Tráela a la vida. Las calles serán venas, y las grandes edificaciones se calcificarán como huesos, y cada alma se convertirá en una terminación nerviosa, siendo testigo del organismo hambriento de la industria."
 overwork_capital_decision_tooltip: "Impulsa a los mortales de tu reino a realizar tu visión"
 overwork_capital_decision_confirm: "Los trabajadores sangrarán por mí"
 POD_county_overworked_modifier: "Sobrecargados"
 POD_county_overworked_modifier_desc: "Los mortales de esta ciudad trabajan hasta el agotamiento para hacer realidad la visión de su cruel señor."
 
 one_with_shadows_objective_decision: "Uno con las Sombras"
 one_with_shadows_objective_decision_tooltip: "En la oscuridad..."
 one_with_shadows_objective_decision_desc: "Para comprender verdaderamente el Abismo, debes interactuar con él. Una empresa arriesgada que pretendes hacer más segura utilizando algunos sujetos de prueba desechables como \"exploradores\" primero. Incluso sus probables y horribles muertes te iluminarán sobre los peligros del Abismo."
 one_with_shadows_objective_decision_confirm: "...Y de vuelta"
 one_with_shadows_objective_decision_prisoner: "Tener #color_white 5#! [prisoners|E] con [GetTrait('shadow').GetName(GetNullCharacter)] o [GetTrait('spectre').GetName(GetNullCharacter)]"
 
 demonization_objective_decision: "Ascensión Impía: Cacería de Decani"
 demonization_objective_decision_tooltip: "¡Poder impío a mi alcance!"
 demonization_objective_decision_desc: "Los Decani son descritos como los 36 demonios de la plaga que son, de hecho, facetas de la criatura durmiente Namtaru, el ser demoníaco que Shaitan había intentado resucitar. Namtaru fomenta la competencia y la ambición, y se sabe que los infernalistas hábiles pueden usurpar su posición y convertirse ellos mismos en verdaderos demonios."
 demonization_objective_decision_confirm: "Soy digno."
 demonization_objective_decision_effect: "Recibirás eventos para iniciar tu cacería.\n#X Esto terminará mal si no estás preparado y eres demasiado débil para defenderte de los Decani.#!"

 quest_for_sargon_codex_objective_decision: "Caza del Códice Sargon"
 quest_for_sargon_codex_objective_decision_tooltip: "El Conocimiento Supremo Aguarda"
 quest_for_sargon_codex_objective_decision_desc: "El Códice Sargon es una tablilla de arcilla escrita por Cappadocius durante sus años mortales. Después de su [pod_Embrace$], la pérdida de su Avatar causó caos y destrucción dentro de sus recuerdos. No podía recordar lo que había escrito ni dónde lo había dejado. Después de milenios, el Códice Sargon fue destruido y sus partes dispersadas por todo el mundo. Si alguien lo restaurara, un poder inmenso le aguardaría."
 quest_for_sargon_codex_objective_decision_confirm: "La Sabiduría de los Antiguos está al alcance…"
 quest_for_sargon_codex_objective_decision_at_least_1_shard: "Debes tener al menos 1 Fragmento del Códice Sargon"
 quest_for_sargon_codex_objective_decision_at_effect1: "Desbloquea un [journey|E] para buscar los otros Fragmentos del Códice por todo el mundo"
 quest_for_sargon_codex_objective_decision_at_effect2: "Desbloquea una [character_interaction|E] para comenzar a estudiar los Fragmentos del Códice Sargon que has adquirido."
 quest_for_sargon_codex_objective_decision_at_effect3: "Desbloquea una [decision|E] para entregar los Fragmentos del Códice Sargon que adquiriste a Cappadocius."

 deliver_shards_to_cappadocius_objective_decision: "Devolver los fragmentos a Cappadocius"
 deliver_shards_to_cappadocius_objective_decision_tooltip: "Devuélvelos a donde pertenecen"
 deliver_shards_to_cappadocius_objective_decision_desc: "El Códice de Sargón es una tablilla de arcilla escrita por Cappadocius durante sus años mortales. Tras su $pod_Embrace$, la pérdida de su Avatar causó caos y destrucción en sus recuerdos. No podía recordar lo que había escrito ni dónde lo había dejado. Tras milenios, el Códice de Sargón fue destruido y sus partes dispersadas por el mundo. Si alguien lograra restaurarlo, un poder inmenso le aguardaría.\n\nPero tú no codicias tal poder, así que en su lugar se lo entregarás a su dueño"
 deliver_shards_to_cappadocius_objective_decision_confirm: "Te lo presento..."
 deliver_shards_to_cappadocius_objective_decision_effect: "Entrega a Cappadocius los Fragmentos recolectados. Cada fragmento te otorga [GetModifier('cappadocius_boon_modifier').GetNameWithTooltip]"
 deliver_shards_to_cappadocius_objective_decision_effect2: "Pierdes la [character_interaction|E] para estudiar los fragmentos en tu posesión"

 deliver_shards_to_cappadocius_objective_decision_shard_custom: "Debes tener al menos 1 Fragmento del Códice de Sargón $POD_understand_sargon_codex_shard_interaction_custom$"

 malkavian_aenigmatis_objective_decision: "Aenigmatis: Acertijos y Enigmas Mundanos"
 malkavian_aenigmatis_objective_decision_tooltip: "Encontrando el secreto más grande."
 malkavian_aenigmatis_objective_decision_desc: "La Ordo Aenigmatis busca obliterar la locura Malkavian enfrentándose a lo inimaginable y magnífico, ya sea Dios, el tiempo, la totalidad del Cosmos o el propio Caín. Cada misterio merece la pena buscarle una solución."
 malkavian_aenigmatis_objective_decision_confirm: "¡Los resolveré todos!"
 malkavian_aenigmatis_objective_decision_effect: "Como [character_interaction|E], puedes 'resolver' libros (lo que los destruirá) para ganar un modificador. Después de alcanzar ciertos umbrales, obtendrás bonificaciones adicionales."
 malkavian_aenigmatis_objective_decision_has_5_book_artifact: "Tiene al menos #color_white 5#! [artifact|E] de libro"
 
 malkavian_ecstasis_objective_decision: "Éxtasis: Dolor y Placer"
 malkavian_ecstasis_objective_decision_tooltip: "Ascensión a través de las emociones."
 malkavian_ecstasis_objective_decision_desc: "El Ordo Éxtasis sostiene que la verdadera locura reside en la forma mortal. Desde su perspectiva, la Bestia es la verdadera creación divina y, por tanto, debe ser escuchada y apaciguada. Comprenderla es la clave para entender tanto a Dios como a uno mismo."
 malkavian_ecstasis_objective_decision_confirm: "Sensaciones divinas."
 malkavian_ecstasis_objective_decision_effect: "Como [character_interaction|E], puedes forzar un frenesí para obtener un modificador basado en la cantidad de Elíseos que hayas organizado (tras tomar esta [decision|E]).\nTras organizar una cantidad específica de Elíseos, obtendrás recompensas adicionales."
 
 malkavian_maleficus_objective_decision: "Maleficus: Oscuridad Interior"
 malkavian_maleficus_objective_decision_tooltip: "Encontrando las respuestas en las profundidades."
 malkavian_maleficus_objective_decision_desc: "El más secreto (y herético) de los Ordos, Maleficus cree en la oscuridad inherente a la condición cainita. Como tal, no existen límites a los extremos a los que llegarán para curar su locura. ¿Qué es el infernalismo para aquel que ya está verdaderamente condenado?"
 malkavian_maleficus_objective_decision_confirm: "Dios nos ignora, el Infierno escucha."
 malkavian_maleficus_objective_decision_effect: "Como [character_interaction|E], puedes sacrificar prisioneros para obtener un modificador que escalará con la cantidad total de sacrificios realizados usando esta interacción."

