 POD_infernalist_wealth_and_influence_decision: "Solicitar Riqueza e Influencia"
 POD_infernalist_wealth_and_influence_decision_tooltip: "Usa una inversión demoníaca para ganar riqueza e influencia."
 POD_infernalist_wealth_and_influence_decision_desc: "Gran riqueza, influencia o compañía. Casi cualquier cosa se puede ganar o aumentar con un pacto con la \"persona\" adecuada..."
