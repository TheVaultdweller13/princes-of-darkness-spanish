l_spanish:


 restore_per_bast_objective_decision: "Restaurar Per-Bast"
 restore_per_bast_objective_decision_desc: "La \"Ciudad de Bastet\" fue una vez el centro de adoración de los agradecidos egipcios a sus benefactores gatos de las sombras. ¿Podría volver a serlo?"
 restore_per_bast_objective_decision_tooltip: "Nuestra antigua capital nos espera."
 restore_per_bast_objective_decision_confirm: "Alabado sea el Gato."
 
 the_fleeing_scarab_objective_decision: "El Escarabajo Fugitivo"
 the_fleeing_scarab_objective_decision_desc: "El secreto más preciado de los Bubasti, el Escarabajo Fugitivo, es un ritual oscuro que permite a un Bastet comprar su inmortalidad con las almas de otros seres vivos."
 the_fleeing_scarab_objective_decision_tooltip: "La vida eterna, tan cerca."
 the_fleeing_scarab_objective_decision_confirm: "Ningún precio es demasiado alto por este poder."
 fleeing_scarab_decision_custom: "Una Momia debe ser tu mejor amigo o tu alma gemela."
 fleeing_scarab_decision_custom2: "Debes tener 15 o más prisioneros con el rasgo Mortal."
 
 royal_privilege_objective_decision: "Privilegio Real"
 royal_privilege_objective_decision_desc: "Un secreto raro y preciado de los Simba, el Privilegio Real les permite aprender los poderes de las otras tribus Bastet. Solo los Simba más exitosos (y algunos dicen que insensibles) son considerados dignos de aprenderlo por el espíritu del Deshacedor."
 royal_privilege_objective_decision_tooltip: "Ser un Rey tiene sus ventajas."
 royal_privilege_objective_decision_confirm: "Verdadero Rey de los Gatos, por fin."