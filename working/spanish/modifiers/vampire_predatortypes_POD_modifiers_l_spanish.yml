l_spanish:
 predatortype_farmer_modifier: "Tipo de depredador: Granjero"
 predatortype_farmer_modifier_desc: "Este vampiro prefiere alimentarse de animales."
 predatortype_bloodleech_modifier: "Tipo de depredador: Sanguijuela"
 predatortype_bloodleech_modifier_desc: "¡Este vampiro prefiere alimentarse de la sangre de otros vampiros!"
 predatortype_phlebotomist_modifier: "Tipo de depredador: Flebotomista"
 predatortype_phlebotomist_modifier_desc: "Este vampiro adquiere $pod_vitae$ bajo la apariencia de un médico que realiza sangrías."
 predatortype_bedlamite_modifier: "Tipo de depredador: Manicomio"
 predatortype_bedlamite_modifier_desc: "Este vampiro se alimenta de los locos. También puede estar loco, o al menos parecerlo ante su presa."
 predatortype_cenobite_modifier: "Tipo de depredador: Cenobita"
 predatortype_cenobite_modifier_desc: "Este vampiro tiene un [POD_herd|E] en una institución religiosa como un monasterio."
 predatortype_alleycat_modifier: "Tipo de depredador: Gato callejero"
 predatortype_alleycat_modifier_desc: "Este vampiro acecha y ataca violentamente a los mortales para obtener la sangre. Es un enfoque vulgar."
 predatortype_cauchemar_modifier: "Tipo de depredador: Cauchemar"
 predatortype_cauchemar_modifier_desc: "Este vampiro se alimenta solo de aquellos que están dormidos."
 predatortype_familias_modifier: "Tipo de depredador: Familias"
 predatortype_familias_modifier_desc: "Este vampiro se alimenta casi exclusivamente de una dinastía familiar en particular. Incluso puede estar emparentado con la familia; al menos eso es lo que la familia piensa."
 predatortype_footpad_modifier: "Tipo de depredador: Salteador"
 predatortype_footpad_modifier_desc: "Este liche se junta con los bajos fondos de la sociedad, tomando la sangre de los empobrecidos. Si desaparecen, las autoridades no muestran interés."
 predatortype_consensualist_modifier: "Tipo de depredador: Consensualista"
 predatortype_consensualist_modifier_desc: "Este vampiro solo se alimenta de los que están dispuestos... lo que complica enormemente la cobertura de la Mascarada en el dominio."
 predatortype_osiris_modifier: "Tipo de depredador: Osiris"
 predatortype_osiris_modifier_desc: "Este vampiro lidera un culto de sangre, como en los tiempos antiguos. El ganado adora y se ofrece libremente a este dios de la sangre."
 predatortype_siren_modifier: "Tipo de depredador: Sirena"
 predatortype_siren_modifier_desc: "Este vampiro seduce a sus amantes para drenar su sangre a través del beso."
 predatortype_gentry_modifier: "Tipo de depredador: Nobleza"
 predatortype_gentry_modifier_desc: "Este vampiro tiene una posición de cierto estatus en la sociedad mortal. Utiliza ese estatus para cazar a los ricos y poderosos. Nadie creerá que alguien de tal refinamiento es un monstruo."
 predatortype_graverobber_modifier: "Tipo de depredador: Saqueador de tumbas"
 predatortype_graverobber_modifier_desc: "Este vampiro frecuenta cementerios y criptas, alimentándose de los dolientes y de la sangre fría de los recién fallecidos." 
 predatortype_extortionist_modifier: "Tipo de depredador: Extorsionador"
 predatortype_extortionist_modifier_desc: "Este vampiro amenaza y explota a los mortales por su sangre. Los extorsionadores hacen 'ofertas que no se pueden rechazar'."
