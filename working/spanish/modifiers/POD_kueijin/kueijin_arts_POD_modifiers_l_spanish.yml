 demon_regalia_barbed_hide_modifier: "Piel de púas"
 demon_regalia_razor_claws_modifier: "Garras afiladas"
 demon_regalia_razor_claws_modifier_desc: "Al personaje le crecen garras afiladas."
 demon_regalia_razor_horns_modifier: "Cuernos afilados"
 demon_regalia_razor_horns_modifier_desc: "Al personaje le brotan cuernos de la cabeza. Pueden ser cortos o largos, lisos o dentados, rectos o torcidos, de varias puntas o de una sola, según desee el personaje."
 demon_regalia_demon_weapon_modifier: "Armas demoníacas"
 demon_regalia_demon_weapon_modifier_desc: "Un arma mística aparece en la mano del personaje. Tal arma podría brillar con Chi, emitir gemidos espantosos, estar cubierta de rostros burlones, etc."
 demon_regalia_demon_armor_modifier: "Armadura demoníaca"
 demon_regalia_demon_armor_modifier_desc: "La armadura demoníaca puede aparecer como escamas, una ornamentada armadura de samurái o cualquier otra cosa, y ofrece una mayor protección contra los ataques."
 demon_regalia_extra_arms_modifier: "Brazos extra"
 demon_regalia_extra_arms_modifier_desc: "Dos brazos extra brotan del torso del personaje, lo que permite una mayor habilidad en el forcejeo o simplemente permite más ataques de lo habitual."
 demon_regalia_huge_size_modifier: "Tamaño enorme"
 demon_regalia_huge_size_modifier_desc: "La salud del personaje aumenta a medida que crece repentinamente hasta alcanzar entre dos metros y medio y tres metros y medio de altura."
 demon_regalia_poisoned_fangs_modifier: "Colmillos envenenados"
 demon_regalia_poisoned_fangs_modifier_desc: "Los colmillos en la boca del personaje se vuelven especialmente grandes, afilados y cáusticos."
 demon_regalia_spikes_modifier: "Púas"
 demon_regalia_spikes_modifier_desc: "El cuerpo del personaje está cubierto de uno de los siguientes elementos: púas, piel abrasiva como la de un tiburón, vello corporal tan rígido y afilado como el alambre de espino, clavos, piel ardiente o gélida, cuchillas, púas o cristales rotos."
 demon_regalia_tentacles_modifier: "Tentáculos"
 demon_regalia_tentacles_modifier_desc: "Al personaje le crecen tentáculos repugnantes y cubiertos de limo."
 demon_regalia_tail_modifier: "Cola"
 demon_regalia_tail_modifier_desc: "Al personaje le crece una cola."
 demon_regalia_wings_modifier: "Alas"
 demon_regalia_wings_modifier_desc: "Unas alas similares a las de un murciélago emergen y se extienden desde la espalda del personaje."
 demon_regalia_antennae_modifier: "Antenas"
 demon_regalia_antennae_modifier_desc: "Al usuario le crecen un par de antenas similares a las de un insecto que le ayudan a percibir su entorno."
 demon_regalia_monstrous_maw_modifier: "Fauces monstruosas"
 demon_regalia_monstrous_maw_modifier_desc: "Las fauces del personaje pueden desencajarse hasta niveles anormales."
 
 
