l_spanish:

 PODadventurers.0003.desc: "La familia mortal Visconti ha sido la pieza central de la política del norte de Italia durante varias generaciones. Han producido muchos individuos famosos (e infames), además de dejar su huella en la historia de la región. Se habían mantenido alejados de lo sobrenatural y habían evitado su interferencia... hasta ahora.\nUn vástago de la familia, Giangaleazzo, ha sido recientemente [Glossary('Embraced','game_concept_Embrace_desc')] por un Lasombra desconocido y se ha apresurado a utilizar tanto el prestigio de su familia como su astuto talento político para ganar una gran influencia en Lombardía en un tiempo sorprendentemente corto. Agentes anteriormente de confianza y contactos leales se han vuelto contra las autoridades sobrenaturales (y a veces mortales) locales para unirse a su causa, debilitando seriamente el control de los gobernantes locales en esta zona."
 PODadventurers.0003.a: "¿Quién se cree que es?"
 PODadventurers.0003.b: "Luchemos contra su creciente influencia."
 visconti_contacts_modifier: "Contactos Visconti"
 visconti_contacts_modifier_desc: "Los contactos familiares de Giangaleazzo resultan útiles para expandir tu influencia."
 PODadventurers.0005.desc: "En un movimiento sorprendente, Giangaleazzo Visconti ha acudido a tu [ROOT.Char.Custom('PODDomicile')] en persona. No siendo tonto, comprendes rápidamente que no ha venido solo, sino respaldado por su creciente ejército en una demostración de fuerza que solo puedes respetar. El joven Lasombra aparentemente te ha señalado como el vampiro más influyente de Italia (aunque piensas que podría estar diciéndole eso a cada gobernante vampiro que encuentra) y quiere discutir un acuerdo potencialmente beneficioso para ambos.\nEstá dispuesto a abandonar Italia con su ejército, sin causar más problemas en la región, si accedes a proporcionarle recursos y fondos para que pueda comenzar su ascenso al poder en otro lugar. Para endulzar el trato, incluso ofrece algunos de sus contactos Visconti para ayudar a extender tu influencia en la región si aceptas."
 PODadventurers.0005.a: "Tenemos un trato, milanés."
 PODadventurers.0005.b: "¡Advenedizo presuntuoso! ¡Fuera de mi vista!"
 PODadventurers.0003.b.tt: "Los [buildings|E] en la [barony|E] de [GetTitleByKey('c_como').GetNameNoTier] serán destruidos."
 PODadventurers.0003.a.tt: "Los [buildings|E] en las [baronies|E] de [GetTitleByKey('c_lombardia').GetNameNoTier], [GetTitleByKey('c_brescia').GetNameNoTier] y [GetTitleByKey('c_como').GetNameNoTier] serán destruidos."
 
 PODadventurers.1001.desc: "Informes recientes de tus agentes traen noticias de Giangaleazzo. Este joven vampiro parece tener ambiciones elevadas y ha reunido tropas en el norte de Italia con un propósito desconocido, engañando a gobernantes mortales (e inmortales) crédulos para que le den más apoyo para su creciente ejército. Hasta ahora, ha demostrado ser demasiado astuto y esquivo para ser capturado, lo cual es en sí mismo preocupante..."
 PODadventurers.1001.a: "Tengo un mal presentimiento sobre esto..."
 PODadventurers.1001.player_warning: "Prepárate, pronto oirás hablar más de él."
 PODadventurers.1002.t: "El Príncipe: Giangaleazzo"
 PODadventurers.1002.desc: "#italic 'No soy un hombre de pasiones. Es cierto que considero a Milán mi derecho de nacimiento, ya que fui su duque hace mucho tiempo y, también es cierto, Italia siempre ocupará un lugar especial en mi frío corazón. Pero, ¿detuvo César sus ambiciones en una sola ciudad? ¿En una sola nación, siquiera? No estoy conquistando tierras y títulos por un propósito superior o incluso por la emoción de hacerlo. En absoluto. No hay religiones, ni filosofías, ni emociones; solo existe el Juego. Superar a tu oponente, ver cómo sus planes se desmoronan antes de que sepa siquiera tu nombre, obligarle a traicionar todo lo que ama... Ese es el sentido de nuestra existencia. Recuerda, siempre hay un jugador mejor que tú. Alguien a quien observar, de quien aprender y a quien luego aplastar. ¿Y en la cima de la Pirámide...? Bueno, te veré allí, siempre que sobrevivas lo suficiente'. #!\nTras una meticulosa recopilación de información e influencia, Giangaleazzo ha amasado un ejército sustancial compuesto por algunos de sus antiguos contactos Condottieri y jóvenes vampiros descontentos. Ya ha progresado en su campaña para conquistar el norte de Italia."
 PODadventurers.1002.a: "¡Es hora de enseñarle algo de humildad a este arrogante Visconti!"
 PODadventurers.1002.a.target.tt: "Te encargarás de él cuando llegue el momento"
 PODadventurers.1002.a.not_target.tt: "Tu señor está ahora en guerra con Giangaleazzo"
 PODadventurers.1002.b: "¡Quiero a este hombre de mi lado, cueste lo que cueste!"
 PODadventurers.1002.b.custom: "Vasallizarás al ambicioso Visconti. Te costará mucho lograrlo y él estará agradecido solo por un tiempo..." 
 POD_giangaleazzo.notification: "El Príncipe hace su movimiento"
 POD_giangaleazzo.desc: "En Italia, Giangaleazzo Visconti, un ambicioso Lasombra, ha lanzado una campaña de conquista. ¿Sacudirá el antiguo centro del Imperio?"
 PODadventurers.1011.t: "Problemas a la vista"
 PODadventurers.1011.desc: "La rebelión de Wat Tyler hace estragos en Inglaterra, y ha empezado a impactar también en el mundo de los $pod_cainite$. Crecen los rumores de una acólita entre sus vampiros convertidos, decidida a iniciar una rebelión de tipo más... nocturno." 
 PODadventurers.1011.a: "Tengo un mal presentimiento sobre esto..."
 PODadventurers.1011.player_warning: "Prepárate, pronto oirás hablar más de esto."
 PODadventurers.1012.t: "La Rebelde: Tyler"
 PODadventurers.1012.desc: "La rebelión de Wat Tyler ha sido una molestia para los $pod_cainites$ ingleses, pero parece que sus efectos dominó no han hecho más que empezar. Una joven Brujah, Patricia de Bollingbroke, ha tomado el nombre del rebelde y ha empezado a soliviantar a jóvenes $pod_cainites$ desilusionados y a otra chusma. La fogosa mujer parece decidida a acabar con los tiranos, sean mortales o de otro tipo. Como ya ha tomado su primera ciudad, y más se unen a su bando cada noche que pasa, los señores de Inglaterra tienen que elegir cómo tratar con ella. ¿Será con guante de seda o con puño de hierro?"
 PODadventurers.1012.a: "Otra rebelde, otro fracaso condenado a ser aplastado pronto"
 PODadventurers.1012.a.target.tt: "Te encargarás de ella cuando llegue el momento"
 PODadventurers.1012.a.not_target.tt: "Tu señor está ahora en guerra con Tyler"
 PODadventurers.1012.b: "Bueno... tiene algunos puntos buenos... y un gran ejército"
 PODadventurers.1012.b.custom: "Tyler solo hincará la rodilla si te unes a su causa. Una propuesta muy insultante, sin duda, pero también ganarías una poderosa aliada." 
 PODadventurers.1012.c: "¡Estamos en el mismo bando!"
 POD_tyler.notification: "La Rebelde hace su movimiento"
 POD_tyler.desc: "En Inglaterra, Patricia de Bollingbroke se levanta contra los tiranos en un intento de libertad probablemente condenado... ¿o es la primera chispa real de una gran revolución?"
 PODadventurers.1021.t: "Problemas a la vista"
 PODadventurers.1021.desc: "Te han llegado rumores de que Vlad Tepes, el ya famoso gobernante de Valaquia, ha hecho indagaciones sobre el mundo de los $pod_cainite$. De algún modo, se ha enterado de la existencia de vuestra clase y parece interesado en ella." 
 PODadventurers.1021.a: "Tengo un mal presentimiento sobre esto..."
 PODadventurers.1021.player_warning: "Prepárate, pronto oirás hablar más de esto."
 PODadventurers.1022.t: "El Empalador: Vlad Tepes"
 PODadventurers.1022.desc: "El gobernante mortal de Valaquia, Vlad Tepes Draculesti, ha demostrado una y otra vez estar bendecido con una voluntad indomable. Se negó a ser abrazado si no era bajo sus propios términos y sabía mucho más sobre la condición vampírica que muchos antiguos incluso antes de convertirse en uno. Los primeros años de su no-vida estuvieron encendidos por los rumores. ¿Quién fue su [Glossary('Sire','game_concept_Sire_desc')]? ¿Había encontrado realmente la Catedral de la Carne y salido ileso? ¿A quién debe lealtad? Estas preguntas siguen sin respuesta, pero el autodenominado Drácula parece haber tenido suficiente de vagar de un lado a otro. El Tzimisce, un simple jovencito, ha reunido una impresionante hueste de vampiros, ghouls y soldados de su época mortal y ha finalizado su primera conquista. Ahora se presenta ante ti con una oferta: reconócelo como tu protegido y podríais iniciar una relación mutuamente beneficiosa. Niégate y... bueno, la amenaza que presenta tal individuo no necesita explicación."
 PODadventurers.1022.a: "Un advenedizo sigue siendo un advenedizo, incluso con un apodo elegante"
 PODadventurers.1022.a.target.tt: "Te encargarás de él cuando llegue el momento"
 PODadventurers.1022.a.not_target.tt: "Tu señor está ahora en guerra con Drácula"
 PODadventurers.1022.b: "Una oferta que no puedo rechazar"
 PODadventurers.1022.b.custom: "Aunque sería costoso reconocer la amenaza que supone un simple jovencito, tener al famoso Drácula como tu chiquillo adoptivo es una oferta tentadora. Al menos, probablemente te daría algo de tiempo antes de que se vuelva contra ti..." 
 POD_vlad.notification: "El Empalador hace su movimiento"
 POD_vlad.desc: "En Transilvania, Vlad Tepes continúa su sangrienta carrera, esta vez como un no-muerto. ¿Un nuevo Señor de la Noche para la tierra más allá del bosque?"
 first_giangaleazzo_event_troops: "Condottieri de Giangaleazzo"
 first_tyler_event_troops: "Rebeldes de Tyler"
 first_vlad_event_troops: "Empaladores de Vlad"
