l_spanish:

 POD_sin_oathbreaking.100.t: "Rompetreguas, Rompejuramentos"
 POD_sin_oathbreaking.100.desc: "Tus violaciones de una tregua se han extendido por todas partes. Ahora se te conoce como un rompejuramentos. Esto es malo. Algunos incluso lo consideran un crimen."
 POD_POD_sin_oathbreaking.100.a: "Mis palabras no son mis vínculos"
