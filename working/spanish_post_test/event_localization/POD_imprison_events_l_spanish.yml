l_spanish:

 POD_imprison.002.title: "Encarcelamiento: [targetdefender.GetFirstName]"
 POD_imprison.002.desc: "Estás intentando encarcelar a [targetdefender.GetFirstName], pero se atreve a resistirse, ¿qué deberías hacer?"
 POD_imprison.002.desc.hunter: "Estás intentando encarcelar a un engendro del diablo, [targetdefender.GetFirstName], pero es poco probable que las sanguijuelas dejen que los servidores de Dios las atrapen. ¿Qué deberías hacer?"


 POD_imprison.002.option.a: "¡[targetdefender.GetFirstName] me obedecerá!"
 POD_imprison.002.option.b: "[targetdefender.GetFirstName] no puede resistirse a mi encanto."
 POD_imprison.002.option.c: "¡Lo despedazaré!"
 POD_imprison.002.option.d: "¡[attacker_marshal.GetFirstName] pondrá a [targetdefender.GetHerHim] en su sitio!"
 POD_imprison.002.option.coterie: "Mi miembro de la [GetPlayer.Custom('PODCoterieNoTooltip')] [prowess_duelist.GetFirstName] someterá a [targetdefender.GetHerHim]."
 POD_imprison.002.option.e: "¡[attacker_marshal.GetFirstName] seguramente sabe cómo atrapar a tales engendros!"
 POD_imprison.002.option.f: "Es hora de que [targetdefender.GetShortUIName] se enfrente a la gravedad de sus pecados."
 POD_imprison.002.option.g: "No es el momento adecuado"
 POD_imprison.002.option.h: "Mis pesadillas de la grieta le harán compañía hasta que decida qué hacer con él"
 POD_imprison.002.option.success: "[attacker.GetFirstName] gana"


 POD_imprison.002.option.a.desc: "Un conflicto de dominación"
 POD_imprison.002.option.b.desc: "Un conflicto de personalidad"
 POD_imprison.002.option.c.desc: "Una batalla de proeza"
 POD_imprison.002.option.d.desc: "Una batalla de proeza, tu mariscal te representa"
 POD_imprison.002.option.d.success: "[attacker_marshal.GetFirstName] gana"
 POD_imprison.002.option.coterie.desc: "Una batalla de proeza, tu miembro de la [GetPlayer.Custom('PODCoterie')] te representa"
 POD_imprison.002.option.coterie.success: "[prowess_duelist.GetFirstName] gana"
 POD_imprison.002.option.e.desc: "Habilidad de guerra de tu mariscal contra la proeza de la sanguijuela"
 POD_imprison.002.option.e.success: "[attacker_marshal.GetFirstName] atrapa a un vil demonio"
 POD_imprison.002.option.failure: "[targetdefender.GetFirstName] gana"
 POD_imprison.002.option.e.failure: "[targetdefender.GetFirstName] logra escapar"
 OD_imprison.002.option.f.desc: "Uso del arte sagrado Lágrimas del Mártir"

 POD_imprison.002.option.a.tt.attacker_wins: "¡Domino a [targetdefender.GetFirstName]!"
 POD_imprison.002.option.a.tt.attacker_lost: "La voluntad de [targetdefender.GetFirstName] es demasiado fuerte para dominarla."
 POD_imprison.002.option.b.tt.attacker_wins: "¡Encandilo a [targetdefender.GetFirstName]!"
 POD_imprison.002.option.b.tt.attacker_lost: "[targetdefender.GetFirstName] es inmune a mis encantos." 
 POD_imprison.002.option.c.tt.attacker_wins: "¡Derroto a [targetdefender.GetFirstName] en combate personal!"
 POD_imprison.002.option.c.tt.attacker_lost: "Soy derrotad[GetPlayer.GetCustom('ES_O')] por [targetdefender.GetFirstName] en combate personal."
 POD_imprison.002.option.d.tt.attacker_wins: "¡[attacker_marshal.GetFirstName] derrota a [targetdefender.GetFirstName] en combate personal!"
 POD_imprison.002.option.d.tt.attacker_lost: "[attacker_marshal.GetFirstName] es derrotado por [targetdefender.GetFirstName] en combate personal."
 POD_imprison.002.option.coterie.tt.attacker_wins: "¡[prowess_duelist.GetFirstName] derrota a [targetdefender.GetFirstName] en combate personal!"
 POD_imprison.002.option.coterie.tt.attacker_lost: "[prowess_duelist.GetFirstName] es derrotado por [targetdefender.GetFirstName] en combate personal."
 POD_imprison.002.option.e.tt.attacker_wins: "¡[targetdefender.GetFirstName] se pudrirá en tu prisión!"
 POD_imprison.002.option.e.tt.attacker_lost: "[targetdefender.GetFirstName] escapa"
 POD_imprison.002.option.f.tt: "[targetdefender.GetFirstName] verá en tus ojos la profundidad de su culpa reflejada con una claridad abrumadora."
 POD_imprison.002.option.g.tt: "Dejarás de intentar encarcelar a [targetdefender.GetFirstName]."
 POD_imprison.002.option.h.tt: "[targetdefender.GetFirstName] será incapaz de resistirse a ser sellad[targetdefender.GetCustom('ES_O')] perpetuamente en tu grieta"

 POD_imprison.102.title: "Nuevo prisionero"
 POD_imprison.102.desc.dominate: "Has logrado doblegar con éxito la mente de [targetdefender.GetFirstName] a tu propia voluntad, ahora entrará en tu prisión sin objeciones"
 POD_imprison.102.desc.presence: "Has logrado con éxito que [targetdefender.GetFirstName] quiera entrar en su nueva celda de prisión solo para complacerte."
 POD_imprison.102.desc.prowess: "Has ganado. [targetdefender.GetFirstName] ya no puede resistirse a ti. Esto debería enseñar a todos lo que les sucede a quienes se te oponen."
 POD_imprison.102.desc.marshal: "[attacker_marshal.GetFirstName] ha derrotado a [targetdefender.GetFirstName]. Esto enseñará a todos a no oponerse a tu autoridad."
 POD_imprison.102.desc.coterie: "[prowess_duelist.GetFirstName] ha derrotado a [targetdefender.GetFirstName]. Esto enseñará a todos a no oponerse a la $POD_player_coterie$."
 POD_imprison.102.desc.hunter: "[attacker_marshal.GetFirstName] ha logrado usar las debilidades del vampiro para atrapar a una bestia impía, [targetdefender.GetFirstName]. Esto enseñará a cada engendro del infierno a no oponerse a ti."
 POD_imprison.102.desc.tears: "Mientras [targetdefender.GetFirstName] permanece paralizad[targetdefender.GetCustom('ES_O')] frente a ti, obligad[targetdefender.GetCustom('ES_O')] a recordar sus muchos pecados, tus hombres se posicionan cuidadosamente para someter[targetdefender.GetHerHim]. Antes de que recupere totalmente la conciencia, su cuerpo es envuelto fuertemente en cadenas y estacas de madera apuntando al corazón están listas para golpear al menor movimiento."
 POD_imprison.102.desc.rift: "[targetdefender.GetFirstName] no puede escapar de tu grieta. Esto debería enseñar a todos lo que les sucede a quienes se te oponen."
 POD_imprison.102.option.a: "Ahora, ¿qué haré contigo?"

 POD_imprison.103.desc: "Mientras [targetdefender.GetFirstName] permanece paralizad[targetdefender.GetCustom('ES_O')] frente a ti, obligad[targetdefender.GetCustom('ES_O')] a recordar sus muchos pecados, tus hombres se posicionan cuidadosamente para someter[targetdefender.GetHerHim]. Antes de que recupere totalmente la conciencia, su cuerpo es envuelto fuertemente en cadenas y estacas de madera apuntando al corazón están listas para golpear al menor movimiento."
 POD_imprison.103.option.a: "Ahora llega el juicio."


 POD_imprison.202.title: "Perdiendo la pelea"
 POD_imprison.202.desc: "La pelea se ha perdido, tu objetivo ha huido de ti. ¿Quizás deberías intentarlo de nuevo cuando llegue el momento adecuado?"
 POD_imprison.202.desc.hunter: "[attacker_marshal.GetFirstName] ha fallado. ¡Su plan no funcionó y ahora este demonio encarnado, [targetdefender.GetFirstName], ha escapado! ¿Quizás deberías intentarlo de nuevo cuando llegue el momento adecuado?"
 POD_imprison.202.option.a: "Esto es simplemente un contratiempo"

 POD.imprison.302.title: "Por pura voluntad"
 POD_imprison.302.desc.dominate: "Tu intento de dominar a [targetdefender.GetFirstName] para que se someta ha fallado. Puedes intentar capturar[targetdefender.GetHerHim] por la fuerza bruta."
 POD_imprison.302.desc.presence: "[targetdefender.GetFirstName] ha resistido tu encanto. Puedes intentar capturar[targetdefender.GetHerHim] por la fuerza bruta."
 POD_imprison.302.option.a: "¡[targetdefender.GetFirstName] no escapará!"
 POD_imprison.302.option.b: "He fallado..."
 POD_imprison.302.option.b.tt: "Fallarás en tu intento de encarcelamiento. [targetdefender.GetFirstName] obtendrá un favor débil sobre ti."

 POD_imprison.002.option.labyrinth: "Laberinto Kami"
 POD_imprison.002.option.labyrinth.tt: "Al esconder este kami en una habitación y pronunciar una palabra de vinculación, puedes evitar que [targetdefender.GetFirstName] se vaya. Por ejemplo, si [targetdefender.GetFirstName] sale por la ventana, se encontrará volviendo a entrar por la puerta, y así sucesivamente."