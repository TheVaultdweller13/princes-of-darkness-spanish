l_spanish:
 POD_wraith_shadow.001.t: "Materializar Sombra"
 POD_wraith_shadow.001.desc: "Con la maestría de tu Sombra en Espina, tu Sombra puede intentar materializarse."
 POD_wraith_shadow.001.option.a: "¡Fuera, Sombra mía! ¿A dónde vas?"
 POD_wraith_shadow.001.option.a.tt: "Tu Sombra intentará materializarse"
 POD_wraith_shadow.001.option.a.desc: "Una lucha entre la Psique y la Sombra"
 POD_wraith_shadow.001.option.a.tt.success: "Tu Sombra se ha materializado con éxito"
 POD_wraith_shadow.001.option.a.tt.failure: "Tu Sombra no ha logrado materializarse"
 POD_wraith_shadow.001.option.b: "Ahora no es el momento adecuado"
 POD_wraith_shadow.001.option.b.tt: "Tu Sombra abandonará la idea de materializarse"

 POD_wraith_shadow.002.t: "Materializar Sombra II"
 POD_wraith_shadow.002.desc: "Con la maestría de tu sombra en Espina, tu Sombra ha logrado materializarse con éxito, ¿es algo bueno?"
 POD_wraith_shadow.002.option.a: "Mi propia sombra"
 POD_wraith_shadow.002.option.a.tt: "Tu Sombra se ha materializado con éxito."

 POD_wraith_shadow.003.t: "Materializar Sombra II"
 POD_wraith_shadow.003.desc: "Incluso la maestría de tu sombra en Espina no es suficiente para materializarse... por ahora."
 POD_wraith_shadow.003.option.a: "Aún no estás preparado"
 POD_wraith_shadow.003.option.a.tt: "Tu Sombra no ha logrado materializarse"

 POD_wraith_shadow.004.t: "Regreso de tu Sombra"
 POD_wraith_shadow.004.desc: "Tu Sombra materializada ha sufrido un incidente y debe regresar a ti."
 POD_wraith_shadow.004.option.a: "Mi sombra ha regresado"
 POD_wraith_shadow.004.option.a.tt: "Tu Sombra y tú sois uno de nuevo"
 POD_wraith_shadow.004.t_ferryman: "Destinos entrelazados"
 POD_wraith_shadow.004.desc_ferryman: "La Pasífae y el Barquero siguen conectados de tal manera que si uno es destruido, el otro también lo es."
 POD_wraith_shadow.004.option.b: "Mi Pasífae se ha ido, y yo también..."