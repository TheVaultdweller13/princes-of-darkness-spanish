l_spanish:

 POD_vamphunt.1.t: "¡Sangre!"
 POD_vamphunt.1.desc: "Has rastreado a tu presa. Das el primer mordisco y [target.GetSheHe] sucumbe al beso. ¿Cuánta sangre beberás?"
 POD_vamphunt.1.option.a: "No beber nada. Dejar[target.GetHerHim] ir ileso."
 POD_vamphunt.1.option.b: "Beber un poco. Solo un sorbo."
 POD_vamphunt.1.option.c: "Beber un trago. [target.GetSheHe|U] se debilitará pero estará bien."
 POD_vamphunt.1.option.d: "Beber mucho, hiriendo a [target.GetHerHim]."
 POD_vamphunt.1.option.e: "Beberlo todo, matando a [target.GetFirstName] y saciando completamente mi hambre."
 POD_vamphunt.1.option.f: "Hacer que [target.GetHerHim] sea adicto a la dicha de mi beso, para que me ruegue que me alimente de [target.GetHerHim]."

 POD_vamphunt.11.t: "¡Chi!"
 POD_vamphunt.11.desc: "Has rastreado a tu presa. ¿Qué devorarás?"
 POD_vamphunt.11.option.a: "No devorar nada. Dejar[target.GetHerHim] ir ileso."

 POD_vamphunt.21.t: "¡Sangre y carne!"
 POD_vamphunt.21.desc: "Has rastreado a tu presa. ¿Cuánta sangre y carne comerás?"

 POD_vamphunt.32.desc: "Ante ti yace tu presa indefensa, inconsciente tras vuestra batalla. Sería tan fácil satisfacer tu ansia por al menos una noche más.\n¿Cuánto te obliga a beber tu adicción?"

 POD_vamphunt.33.t: "¿Muerte?"
 POD_vamphunt.33.desc: "Yaces en el suelo frío, mientras tu futura víctima te mira desde arriba."
 POD_vamphunt.33.desc.death: "\n\nEl vampiro te aplasta la garganta sin decir palabra. En tus últimos momentos, solo hay oscuridad."
 POD_vamphunt.33.desc.submission: "\n\nEl vampiro, pareciendo bastante divertido por tu valentía, te propone un simple ultimátum. Sírvele o muere."
 POD_vamphunt.33.a: "Una adicción fatal, ciertamente."
 POD_vamphunt.33.b: "Someterte a tu nuevo maestro."
 POD_vamphunt.33.c: "Desafiante hasta el final."