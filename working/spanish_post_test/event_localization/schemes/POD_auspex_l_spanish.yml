l_spanish:

 POD_auspex.100.t: "Invasión psíquica"
 POD_auspex.100.desc: "[actor.GetTitledFirstName] está intentando robar tus secretos de tu mente. Usando su maestría en Auspex, es capaz de abrir tu mente incluso a gran distancia. Por suerte, tal intento es poco sutil, y puedes intentar resistir esta flagrante invasión de tu privacidad mental."
 POD_auspex.100.option.a: "Ejercer mi fuerza de voluntad para resistir el ataque telepático."
 POD_auspex.100.option.b: "Luchar contra la intrusión psíquica."
 POD_auspex.100.option.c: "Aceptar la intrusión psíquica."
 
 POD_auspex.200.t: "Leyendo la mente de [recipient.GetFirstNameNoTooltip]"
 POD_auspex.200.desc: "Es el momento adecuado para invadir la psique de [recipient.GetTitledFirstName], pero se está resistiendo."
 POD_auspex.200.option.a: "Exaltar la sangre para espiar a [recipient.GetHerHim]."
 POD_auspex.200.a.tt_willpower: "[recipient.GetFirstNameNoTooltip] ha ejercido su voluntad para resistir tu telepatía."
 POD_auspex.200.a.tt_fortitude: "[recipient.GetFirstNameNoTooltip] es expert[recipient.GetCustom('ES_O')] en la $pod_discipline$ de Fortaleza y es resistente a tu manipulación."
 POD_auspex.200.a.success.desc: "Victoria"
 POD_auspex.200.a.tt_success: "¡Sus secretos me serán revelados!"
 POD_auspex.200.a.failure.desc: "Derrota"
 POD_auspex.200.a.tt_failure: "[recipient.GetTitledFirstName] se resistió a mi intento de espionaje telepático."
 POD_auspex.200.option.b: "Exaltar la sangre y ejercer mi voluntad. ¡Mi mente lo verá todo!"
 POD_auspex.200.option.b.tt.beast: "#beast ¡Debe quebrarse ante nuestro poder mental!#!"
 POD_auspex.200.option.c: "Abandonar este empeño, ya no deseo espiar psíquicamente a [recipient.GetHerHim]."
 POD_auspex.200.option.c.tt: "La telepatía fallará."
 POD_auspex.200.option.c.tt.beast: "#beast ¡Como la presa, estamos ciegos!#!"
 
 POD_auspex.300.t: "Mente de [recipient.GetFirstNameNoTooltip] vulnerada"
 POD_auspex.300.desc: "He aprendido el secreto de [recipient.GetTitledFirstName] a través de los susurros de su mente."
 POD_auspex.300.option.a: "Es como debe ser."
 POD_auspex.300.option.a.tt.beast: "#beast Ahora, ¿qué haremos con este dulce conocimiento?#!"

 POD_auspex.400.t: "Tu mente ha sido vulnerada"
 POD_auspex.400.desc: "Habiendo perdido la batalla de voluntades contra [actor.GetTitledFirstName], tus secretos ahora le son conocidos." 
 POD_auspex.400.option.a: "Mi mente ya no es mi santuario"
 
 POD_auspex.500.t: "Espionaje telepático resistido"
 POD_auspex.500.desc: "[recipient.GetTitledFirstName] se ha resistido a mi intento de espiar[recipient.GetHerHim]." 
 POD_auspex.500.option.a: "¡Frustrado!"
 POD_auspex.500.option.a.tt.beast: "#beast ¡Consigamos más sangre e intentémoslo de nuevo!#!"

 POD_auspex.600.t: "Espionaje telepático resistido"
 POD_auspex.600.desc: "[actor.GetTitledFirstName] ha abandonado su intento de invadir tu mente."
 POD_auspex.600.option.a: "¡Mi mente es mía!"
