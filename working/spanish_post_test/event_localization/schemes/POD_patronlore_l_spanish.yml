 POD_patronlore.100.t: "Apócrifos Cainitas"
 POD_patronlore.100.option.a: "Cerrar los Apócrifos Cainitas."
 POD_patronlore.100.desc: "No hay ninguna leyenda escrita para este espacio (¡todavía!)\n\n" 
 POD_patronlore.100.desc.headnote: "Este personaje fue creado por uno de nuestros colaboradores y no forma parte oficial del $pod_wod$.\n\n"
 POD_patronlore.100.desc.footnote: "\n\n Este personaje no tiene un destino canónico conocido."
 
 POD_patronlore.100.t.560027: "Leyenda del Patrón: Loukios"
 POD_patronlore.100.desc.560027: "Antes un centurión romano de cierta fama y seguidor secreto del culto a la diosa Isis. En los años previos al colapso de Roma ante las hordas góticas, Loukios desertó cuando las guerras comenzaron a volverse desesperanzadas y se enamoró cada vez más de la mitología egipcia hasta el punto de realizar una peregrinación a la tierra de las arenas movedizas para comprender mejor a su diosa. Desafortunadamente, no halló el conocimiento que tanto buscaba —solo encontró a los Seguidores de la Serpiente. Set lo recibió en los antiguos templos. Habían tomado interés en él o quizás en su conocimiento del ejército romano..."
 POD_patronlore.100.t.560002: "Leyenda del Patrón: Ciarán"
 POD_patronlore.100.desc.560002: "Ciarán era un nómada irlandés, o más exactamente, un Mincéirí o uno de an lucht siúil (literalmente, 'la gente caminante'). Era un joven de veintitrés años que simplemente hacía lo necesario para sobrevivir y mantener a su familia. A menudo eso implicaba mentir y hacer trampas porque no tenía muchas otras habilidades. A pesar de su naturaleza deshonesta, la familia siempre fue lo más importante para él, y consideraba a todo an lucht siúil como su familia. Respetaba a cualquier nómada casi tanto como a ellos. Por eso ofreció refugio a un extraño viajero hindú que se hacía llamar Viswanathan.\n\nSin que lo supiera, Viswanathan era un matusalén, un vampiro de quinta generación del Clan Ravnos y un hombre que había viajado por todo el mundo conocido hasta llegar a Irlanda. Afortunadamente, porque poco después su campamento fue atacado por lugareños y el irlandés resultó mortalmente herido. Viswanathan traicionó sus propios principios al abrazar a Ciarán, salvándole la vida. Le enseñó el Camino de la Paradoja y le advirtió que nunca hiciera lo que acababa de hacer. Luego desapareció.\n\nIncluso ahora como Cainita, Ciarán no soportaba abandonar a su familia y a su pueblo. Especialmente cuando enfrentaban tanta hostilidad y prejuicio por parte de las comunidades con las que entraban en contacto. Esta hostilidad en Irlanda crecía rápidamente, lo que los llevó a partir poco tiempo después. Ciarán se determinó a encontrarles un hogar seguro.\n\nAsí viajaron durante décadas, reclutando a otros nómadas en el camino. Desafortunadamente, Ciarán no pudo mantener su promesa a Viswanathan y en una ocasión salvó la vida de una joven de su pueblo llamada Caiomhe. Ella fue la única Cainita entre su comunidad que él mismo engendró, aunque muchos otros se unieron a ellos en el viaje. Algunos Ravnos, otros no. Como Viswanathan le había dicho, Ciarán declaraba pertenecer al clan Gangrel ante cualquiera que no fuera de su pueblo (aunque hacía lo posible por mantener la máscara con ellos).\n\nFinalmente llegaron a Hungría. En gran parte mediante engaño, manipulación y una buena dosis de Quimerismo —las tres cosas en las que Ciarán era mejor—, convenció a los barones locales de permitir a su gente establecerse allí sin ser molestados."
 POD_patronlore.100.t.560007: "Leyenda del Patrón: José deCalamar"
 POD_patronlore.100.desc.560007: "La vida mortal de José nació de un vendedor de pescado y su esposa en algún lugar del norte de la Península Ibérica, pero pasó la mayor parte de sus primeros años en las calles causando problemas. Era más grande que la mayoría de los niños de su edad y usaba ese tamaño para intimidar a otros niños. Aprendió en su adolescencia temprana que la gente pagaba por información, así que empezó a reunir tanta información como pudiera para chantajear o comerciar mediante escuchar a escondidas, seguir discretamente o simplemente intimidar. Terminó siendo un adulto joven dirigiendo una pequeña red de información en la ciudad de Sarria, donde fue notado por un vampiro visitante. Éste observó los talentos de José y decidió que sería un candidato perfecto para engendrar. José y su sire tuvieron una relación tumultuosa, que terminó con José diablerizando al anciano.\n\nEn los años 1300, José se convierte en la cabeza y único cainita de la pequeña casa deCalamar, tomando el control del ducado de A Coruña y prometiéndose a sí mismo que gobernaría la Península Ibérica en nombre de la Bestia."
 POD_patronlore.100.t.560017: "Leyenda del Patrón: Kylar Shadovie"
 POD_patronlore.100.desc.560017: "Nacido como hijo bastardo de un noble, aprendió las intrigas cortesanas para sobrevivir, aunque era un niño enfermizo. A los 26 años, mientras tramaba una artimaña contra su señor, un vampiro irrumpió en su castillo y lo abrazó." 
 POD_patronlore.100.t.560013: "Leyenda del Patrón: Gavrili"
 POD_patronlore.100.desc.560013: "Gavrili era un noble menor. Un soldado en su vida mortal, como su padre y su abuelo antes que él. Fue criado para ser protector de su pueblo.\n\nComo vampiro, siente un placer perverso al cazar y alimentarse de mortales de sus antiguas tierras.\n\nA pesar de su lealtad a su clan, Gavrili lucha por comprender la filosofía superior de los Tzimisce. Compensa esto recluyéndose en su dominio y concentrándose en criar linajes de sirvientes."
 POD_patronlore.100.t.560014: "Leyenda del Patrón: Descardion Namesh"
 POD_patronlore.100.desc.560014: "Fue sacado de las canteras de Egipto cuando su inteligencia y perspicacia llamaron la atención de su sire. Durante años viajó por ciudades ya antiguas, y su sire le inculcó sed de conocimiento para combatir la estagnación del tiempo. Como seguidor de Tariq el-Sama, Descardion cree que la lucha entre el yo y la bestia es la prueba definitiva impuesta por Alá. Descardion se ha asentado en la desembocadura del Nilo, donde comienza la vida para muchos en el norte de África, y trabaja diligentemente para difundir el conocimiento y la fe entre quienes lo rodean. Sus experimentos suelen ser introspectivos, pero en el pasado ha tomado medidas extremas, como convertir en sirvientes a toda una aldea o imponer ayunos de un mes para purgar mente y cuerpo (y eliminar a los individuos débiles) de tribus locales. Siendo una de las pocas personas alfabetizadas en la cantera —razón por la que fue abrazado inicialmente—, Descardion ha mantenido volúmenes de diarios y valora profundamente la palabra escrita, de modo que su corte aprecia la educación y la táctica más que cualquier otro rasgo. Al oír relatos sobre las guerras entre Tremere, Ventrue y Tzimisce, Descardion ha crecido preocupado por proteger su obra y se ha vuelto proactivo en el norte de África, intentando impedir que los Reyes y la Pirámide controlen al pueblo egipcio."
 POD_patronlore.100.t.560019: "Leyenda del Patrón: Aryan de Gray"
 POD_patronlore.100.desc.560019: "Hijo de un caballero sin tierras juramentado al Conde de Chester, Aryan de Gray pasó su infancia educado en la corte de su señor. Demostró ser hábil en combate, ganándose un puesto como el miembro más joven de la guardia de su señor, seguido pronto por un cargo de mando en sus ejércitos. El joven tuvo la oportunidad de demostrar su valía durante una rebelión en Normandía. A lo largo de cinco años logró ser capturado tres veces: dos veces fue rescatado mediante rescate, y una vez escapó. A pesar de estas desgracias, fue elogiado por su valentía y habilidad, ganándose la confianza del propio rey. El punto álgido de su carrera puso fin a la guerra: en la Batalla de Brémule de 1119 logró poner en fuga a la caballería enemiga y lideró una carga contra su flanco derecho. La maniobra no tenía nada que ver con las órdenes recibidas y fue descrita tanto como \"un golpe de genio\" como \"un acto de pura locura\". En cualquier caso, condujo a una victoria decisiva, que aparentemente le costó la vida a Aryan. Tras el impacto de su famosa carga, persiguió al ejército en retirada acompañado apenas por una fuerza simbólica. Se encontró rodeado tras las líneas enemigas, donde fue empalado con una lanza y dejado por muerto. Sus propios hombres lo hallaron aún con vida y lo llevaron al campamento para ser tratado, pero había poca esperanza de recuperación. Un amigo estaba a su lado cuando un hombre entró en la tienda. Lo reconoció: uno de los consejeros del rey. Su amigo salió a petición del hombre, y ambos quedaron a solas. «Eso no pinta nada bien. Diría que tienes una hora, tal vez dos». El hombre no esperó respuesta: «Puedo asegurarme de que sobrevivas, a cambio deberás jurarme lealtad el resto de tu vida, sea esta tan larga como sea. ¿Aceptas?». Entre el dolor y el delirio, aceptó, y despertó en un lugar desconocido sirviendo a un amo completamente distinto."
 POD_patronlore.100.t.560020: "Leyenda del Patrón: Cyrus Helid"
 POD_patronlore.100.desc.560020: "Hijo de una familia adinerada de tejedores y nacido en Estrasburgo, Wilhelm siempre fue curioso. Buscando nuevos secretos, empezó aprendiendo bajo la tutela de la iglesia. Tras tomar sus votos, se convirtió en monje en la abadía de Hohenbourg, en la cima del 'Monte Santa Odilia'. Allí estudió las clásicas, pero también se volvió cada vez más curioso acerca del 'Muro Pagano' (Heidenmauer), un antiguo muro celta que rodeaba la montaña y que se cree anterior al cristianismo. También oyó relatos sobre criaturas extrañas que habitaban el cercano Bosque Negro: humanoides gigantes, de unos dos metros de altura y con ojos negros.\n\nSu búsqueda prohibida de los orígenes del muro y su creciente interés por los asuntos paganos atrajeron la atención de un errante desterrado del Clan Tremere, Jonas Helid. Tras ser abrazado por él, dejó atrás su vida monástica para viajar, lejos del sol.\n\nDurante su no-vida, él y Jonas viajaron a Bolonia, donde desempeñaron un papel de apoyo en la fundación de la universidad en 1088. Interesado en el conocimiento de épocas antiguas, Wilhelm tomó inspiración de cuentos persas para su nuevo nombre: Cyrus. Un nombre nuevo para su no-vida.\n\nEn 1180, tras un intento fallido de reintegrarse al Clan Tremere junto a su sire, regresó a su región natal, cerca de la ciudad renana de Colmar. Innecesario decir que eso bastó para que Marconius de Estrasburgo, fundador de la estirpe Kiasyd y antiguo mago, lo contactara. A pesar de pertenecer a clanes distintos, sus intereses académicos los unieron. En nombre del conocimiento, forjaron una alianza." 
 POD_patronlore.100.t.560025: "Leyenda del Patrón: Eden Varten"
 POD_patronlore.100.desc.560025: "Secuestrar mortales (especialmente ejemplares físicos destacados, fuertes, hermosos, etc.) llama la atención; especialmente cuando la mayoría de los secuestrados aparecen... como restos. Los fallecidos parecen haber sido cruelmente experimentados; con algunos de sus miembros u órganos deformados casi más allá del reconocimiento. Ay, la buena ayuda es difícil de encontrar, y aquellos individuos 'de confianza' a quienes Eden encargó (empleados) deshacerse de los fracasos decidieron simplemente arrojar los cuerpos en algún lugar conveniente, asumiendo que simplemente se contabilizarían como más asesinatos (de tipo mundano) en la región. Sin embargo, cualquiera remotamente familiarizado con los efectos de la Vicisitud tendría sus sospechas muy elevadas."
 POD_patronlore.100.t.560030: "Leyenda del Patrón: Patrick Ramos"
 POD_patronlore.100.desc.560030: "Abrazado y abandonado a su suerte, la única manera de ganar respeto es mediante el poder y la fuerza. Sin clan que lo limite, Patrick anhela el día en que pueda someter a cainitas y mortales bajo su control y hará lo que sea necesario para obtener poder y construir el mundo a su imagen."
 POD_patronlore.100.t.560031: "Leyenda del Patrón: Gabriel Felipe de la Casta"
 POD_patronlore.100.desc.560031: "Vástago de una familia antes noble, Gabriel fue preparado para el gobierno desde su nacimiento. Tras su Abrazo, optó por permanecer fuera de los focos y gobernar desde las sombras, como corresponde a un miembro del clan Lasombra."
 POD_patronlore.100.t.560028: "Leyenda del Patrón: Lucia Canale"
 POD_patronlore.100.desc.560028: "Lucia pareció surgir de la nada, y por suerte, muchos de sus rivales en su ascenso al poder sufrieron 'accidentes desafortunados' o cambios de corazón sorprendentemente repentinos. Su sire fue identificado como un hombre misterioso llamado Guiseppe, visto por última vez camino a una reunión con ella; se desconoce si su destino fue la Diablería, el empalamiento o simplemente la Muerte Final para atar el último cabo suelto. Quizás no sea alguien a quien enfadar si tu espía no es muy competente."
 POD_patronlore.100.t.560032: "Leyenda del Patrón: Liliana Szantovich"
 POD_patronlore.100.desc.560032: "Preparada para el abrazo por su Sire, Stoffer Ravensburg, quien desciende de Dracon. Poco después de su abrazo, se descubrió que Stoffer era un Infernalista, y con la ayuda de su otro childe, Miguel Barbaneagra, dio caza a Stoffer y lo envió a la Muerte Final. Ahora trabaja para asegurar su posición en la corte del Voivoda Brancoveanu, a pesar de las animosidades entre sus respectivos Caminos. Aún conserva cierto grado de lealtad hacia su crianza como [Glossary('Revenant','game_concept_revenant_desc')], y busca proteger y asegurar el lugar de su antigua familia en el mundo, aunque con poco éxito."
 POD_patronlore.100.t.560048: "Leyenda del Patrón: Antariksha-Chandra"
 POD_patronlore.100.desc.560048: "Lo suficientemente antiguo como para formar parte realmente del Rig-Veda, Chandra es el dios de la Luna en el Rig-Veda. Antariksha es el dios del Espacio. Nacido alrededor del 1500 a.C., fue Abrazado probablemente por entonces."
 POD_patronlore.100.t.560041: "Leyenda del Patrón: Hakon Fystond"
 POD_patronlore.100.desc.560041: "Siempre llamó la atención de todos desde niño debido a su piel pálida como la de un cadáver. Pasó la mayor parte de su infancia en el bosque recolectando alimentos y luego empezó a cazar. Era astuto y listo, y finalmente se unió a una banda de ladrones conocida por atacar a soldados y mercaderes que viajaban por Nordmark.\n\nSu papel en la banda era recopilar información y usarla para planear emboscadas.\n\nUna noche, un Gangrel vinculado por sangre se acercó al escondite de los ladrones con intención asesina, matando a la mayoría o dejándolos en estado crítico. Tras eso, el Gangrel huyó, y todos dentro estaban muertos o desangrándose. Hakon tuvo la 'suerte' de solo tener una hemorragia moderada e intentó cauterizar las heridas para detener el sangrado.\n\nMás tarde intentó salir del escondite tras vendar sus heridas, pero no llegó lejos antes de ver una figura sombría a la luz de la luna que le ordenó acercarse. Obedeció, y poco después sintió un leve dolor seguido de un placer sobrenatural, y luego todo se volvió negro.\n\nSu sire era un desterrado del mar de sombras, pero nunca mencionó por qué. Su sire le enseñó mucho: cómo manipular a la gente con mayor eficacia y cuán hermoso es el abismo. Más adelante, tras consumir el alma de un Toreador y volverse adicto a la $pod_vitae$, empezó a actuar de forma extraña y su humor cambiaba aleatoriamente sin explicación."
 POD_patronlore.100.t.560043: "Leyenda del Patrón: Anatolios Tenebris"
 POD_patronlore.100.desc.560043: "Hijo de pequeños comerciantes, nació en la aldea de Chernivtsi en uno de los principados moldavos. Desde niño supo cómo conciliar y conseguir las conexiones necesarias. Una noche, conoció a una joven que acompañaba al embajador del Imperio Bizantino. La chica era increíblemente hermosa, pero más importante aún, no tenía guardias a su alrededor. Esta circunstancia permitió a Anatolios y a su hermano mayor entablar amistad con la chica en una taberna local. Según su relato, regresaban tras negociaciones con el príncipe de Kiev y se detuvieron allí para cambiar caballos y descansar. Gracias a su encanto natural, Anatolios logró convencerla de pasar la noche en su casa... al menos eso pensó entonces. Fue su última noche como humano. Por la mañana encontró los cuerpos mutilados y desecados de su familia. Sobre el cadáver frío de su hermano mayor halló un mensaje: 'Nuestra próxima cita será en mi residencia. Tu Arianne'. Pocos días después, sirvientes del Toreador lo contactaron y le dieron instrucciones sobre el lugar de encuentro con el resto de sus parientes.\n\nHan pasado nueve años desde que fue aceptado en una nueva familia. Anatolios logró consolidarse como un miembro leal, eficiente e inteligente del clan. En tan breve período, logró derrocar al antiguo gobernante local y jurar lealtad al gobernante del Voivodato. Ni Vladimir Rustovich ni la Matriarca dudan de su lealtad. Pero ¿y si la lealtad y los juramentos no son más que una farsa, y la nueva 'familia' es solo un medio para vengarse de la antigua y verdadera? El tiempo lo dirá."
 POD_patronlore.100.t.560049: "Leyenda del Patrón: Gorm"
 POD_patronlore.100.desc.560049: "El hombre era un feroz guerrero. Su voluntad en el campo de batalla y su cuidadosa gestión de tropas y posiciones le valieron numerosas victorias. Fue observado durante una de ellas por Brunhilde. Mientras moría tras matar a cuatro atacantes, ella lo abrazó y lo dejó solo en la naturaleza para que sobreviviera. Durante ese tiempo, aprendió cuánto servían solo a los débiles las habilidades sociales y las intrigas, y usó su astucia y fuerza para cazar con implacable eficacia. Tras descubrir lo que se había convertido, comenzó a arrasar activamente a quienes escupían sobre los dioses. Actuando como comandante y verdugo, fue enviado a eliminar las raíces podridas del árbol de la vida. Cualquier Einherjar que se desviara del camino debía responder por sus crímenes contra los dioses, y pocos vivieron lo suficiente como para unirse a los cristianos. Pero por cada batalla que ganaba, otras se perdían, y los cristianos nunca retrocedían. Peor aún, envenenaron los corazones de su rebaño, y las numerosas disputas entre los Einherjar llevaron a la caída de Midgard. Tras la desaparición de Odín, disgustado por el fracaso humano de reconocer el verdadero poder y mantener los caminos de los Aesir, se recluyó en su hogar ancestral de Helgum, sin participar en nuevas batallas. Pero nunca perdió la fe. Si Odín despertara, volvería a empuñar sus hachas y marcharía al campo de batalla una vez más."
 POD_patronlore.100.t.560050: "Leyenda del Patrón: Hannibal Barcid"
 POD_patronlore.100.desc.560050: "Los padres romanos asustaban a sus hijos diciéndoles: «Hannibal ante portas» —«Hannibal está a las puertas»— durante la Segunda Guerra Púnica. Persisten rumores de que fue Abrazado por el matusalén Brujah Troile en Cartago, pero se desconoce si sobrevivió a la destrucción de la ciudad o pereció con ella. Algunos incluso dudan de que existiera un Hannibal. Lo hubo. Despertado del Torpor en las ruinas de Hattusa, Hannibal regresa a su hogar ancestral y desde allí tiene un solo pensamiento: Destruir. Roma. O algo así."
 POD_patronlore.100.t.560053: "Leyenda del Patrón: Ruadh Sutherland"
 POD_patronlore.100.desc.560053: "Fue un arzobispo del cristianismo. Cree que los vampiros forman parte de la voluntad de Dios, pero el abrazo lo desequilibró. Cree que los vampiros son pastores de los humanos, quienes no son más que ganado que debe guiarse según la voluntad de los vampiros hacia lo que ellos consideran correcto. Aunque piensa que los humanos no deben mentir ni asesinar (a menos que sus señores vampiros se lo ordenen), cree que los vampiros pueden usar esas herramientas «Por un Bien Mayor». Considera que la gente es buena o malvada, sin términos medios, y ve el mundo en blanco y negro. Fue abrazado por Goratrix como sacerdote con un inmenso conocimiento de la religión y lo oculto. Tras su abrazo, Sutherland se desequilibró tanto que incluso Goratrix tuvo que enviarlo un tiempo a Malta para que se calmara y aclarara su mente. Su mecanismo de afrontamiento le hizo seguir creyendo que es un agente de Dios, pero ahora ve el mundo en blanco y negro, Bien y Mal. Como cualquier cazador del Mal, eventualmente usó las herramientas del Mal para vencerlo y se volvió ambicioso. En su mente, todo conduce a su objetivo final: la supremacía del Sacro Imperio Romano y de los Tremere, lo que lo llevará por un oscuro camino."
 POD_patronlore.100.t.560066: "Leyenda del Patrón: Arturia Pendragon"
 POD_patronlore.100.desc.560066: "Afirma liderar la defensa de Britania contra los sajones invasores mientras se disfraza de hombre entre los mortales." 
 POD_patronlore.100.t.560067: "Leyenda del Patrón: Anciano Diego"
 POD_patronlore.100.desc.560067: "Diego es un antiguo monje de una orden sagrada cristiana. Solía ser un cazador, pero fue abrazado tras una cacería exitosa por un sire que pensó que sería divertido —y no le importó mucho que Diego hubiera eliminado a un par de neonatos."
 POD_patronlore.100.t.560072: "Leyenda del Patrón: Morgano Murchadh"
 POD_patronlore.100.desc.560072: "Estuvo presente cuando Tremere bebió la poción que lo transformó en vampiro. Originalmente un mago demasiado joven para ser abrazado por el fundador del clan, Morgano fue abrazado por Goratrix poco después de la ceremonia. Había sido fundamental en la captura de varios Tzimisce de Estiria y, tras su abrazo, se dedicó a estudiar los secretos de su sangre. Debido a su proximidad al Ritual de Usurpación, la disciplina del clan Tzimisce, Vicisitud, estaba presente en su sangre. Este raro rasgo, que ocasionalmente aparecía en los Tremere a lo largo de los siglos, se convirtió rápidamente en el foco de los estudios de Morgano. Creía que la manipulación de carne y hueso mediante la Vicisitud podría desvelar muchos secretos alquímicos y pronto aprendió nuevas formas de integrar este poder en su taumaturgia sanguinaria.\n\nEste don único y el relativo éxito de sus experimentos le dieron notoriedad dentro de su clan. La sed de poder de Morgano Murchadha se reflejaba en la crueldad de sus experimentos y tuvo un papel clave en que los Tzimisce declararan la guerra a la incipiente casa Tremere. Como resultado, Morgano fue exiliado de la casa Tremere, y él y sus seguidores fueron excluidos del vínculo sanguíneo al estructurarse la pirámide en 1037. Furioso por su exclusión de la política Tremere y urgido por su sed de poder, se llevó a los pocos que había abrazado y creó la Casa de Murchadha, una rama menor de los Tremere originales que estableció su base en Esztergom tras asesinar al voivoda original en un acto de monomaquia.\n\nDesde su nuevo asiento de poder, Morgano de la Casa de Murchadha comenzó a lanzar invasiones a los alrededores de Visegrado, a pesar de la gran cantidad de enemigos que lo rodeaban. Muchos de sus seguidores, aunque creían que tales ataques eran suicidas, se sorprendieron al obtener victorias repetidas. Los distintos voivodas de Hungría estaban tan en conflicto entre sí y con la rama principal de la Casa Tremere como con Murchadha.\n\nEstas victorias iniciales llevaron a la captura de muchos cainitas bastante poderosos que satisficieron el deseo de Morgano de experimentar y crear nuevos poderes, por lo que temporalmente desvió su enfoque de la conquista hacia los viajes. Morgano se aventuró en los Baronatos de Avalon y en las Cortes del Amor en Francia, donde supuestamente engendró a dos de sus childes. Una joven noble llamada Charlotte, en la ciudad kentiana de Canterbury, fue su primera childe. No está claro si fue algún efímero concepto mortal de amor lo que lo impulsó o algún otro aspecto de ella que captó su interés. Su otro childe fue un mago itinerante de la Orden de Hermes que coincidió en conocer, llamado Niklaus. Para cuando se encontraron, Morgano era un formidable practicante de magia sanguinaria y utilizaba otras disciplinas vampíricas, específicamente Vicisitud, para acercarse tanto a sus víctimas que no podían reaccionar a su ataque. Niklaus odiaba a Morgano por abrazarlo, lo consideraba una broma cruel por parte de Morgano, y pasó muchos años intentando rastrearlo hasta su capilla en Esztergom.\n\nMorgano se ha vuelto conocido por su locura en noches más recientes. Tras emerger de su investigación en reclusión, el Hechicero vio cómo muchos cainitas menores, como los Caitiff, alcanzaban posiciones de relevancia. Tras estudiar intensamente las profecías de Gehenna, lo interpretó como un presagio e inició su propia cruzada para limpiar Europa de los sin clan, reuniendo a su lado a muchos vampiros tradicionalistas. Aunque antes experimentaba con sus cautivos, el Loco Señor de la Casa Murchadha ahora prefiere quemar a sus enemigos en la hoguera o en sus hogares; a veces, aldeas y ciudades enteras son reducidas a cenizas si corren rumores de que albergan sin clan. Sin embargo, debido a su aislamiento y la indiferencia de los clanes altos, nadie ha detenido la loca purga de Morgano en Hungría." 
 POD_patronlore.100.t.560074: "Leyenda del Patrón: Brand de Draeck"
 POD_patronlore.100.desc.560074: "Fue un Potestado Guerrero conocido como 'De Draeck'. Combatió contra los daneses que exigían tributo en la zona. Se negó a pagarles. Siguió una batalla en la que los holandeses salieron victoriosos: 500 de los 800 daneses murieron, incluido su líder. Sin embargo, los holandeses también perdieron a su líder.\n\nO al menos eso se creyó. En realidad, fue abrazado durante la batalla, poseído, cambió su identidad y desde entonces ha viajado por Europa buscando su lugar. Finalmente regresó a Holanda para gobernar desde las sombras mientras lucha por recuperar la cordura —o sucumbe a la locura."
 POD_patronlore.100.t.560076: "Leyenda del Patrón: Aedan Cathasach"
 POD_patronlore.100.desc.560076: "Aedan fue abrazado por un anciano Verdadero Brujah preocupado por la desaparición y corrupción de los Aulladores Blancos. Como descendiente de los druidas que trabajaban con los Aulladores Blancos, su sire esperaba que Aedan pudiera aportar alguna idea sobre el misterio."
 POD_patronlore.100.t.560079: "Leyenda del Patrón: Luna Morningstar"
 POD_patronlore.100.desc.560079: "Como humana, Luna siempre fue distinta a sus compañeros. Contemplativa de la vida y la muerte, interesada en lo extraño y enamorada de la noche. Algo en ella la calmaba. La brisa lenta pero constante que pasaba entre las rocas de la casa de sus padres, que asustaba a otros niños, le hacía sentirse cómoda y segura. El crujido de la madera bajo sus pies y el silencio de una habitación oscura inspiraban su imaginación. Su belleza parecía atemporal, pero casi fue extinguida cuando rechazó los avances de un vecino y fue proclamada bruja. Mientras los inquisidores la preparaban para la hoguera, sus gritos de ira y angustia llegaron a un señor vampiro local que vio su odio implacable hacia la raza humana. La salvó y poco después la abrazó. Quería ver qué caos y sufrimiento podía causar un individuo tan hermoso y loco antes de condenarse a sí misma, o si podía ascender en las filas de la corte nocturna y convertirse en una verdadera Señora de la noche."
 POD_patronlore.100.t.560081: "Leyenda del Patrón: Caelia Tertia"
 POD_patronlore.100.desc.560081: "Nacida en el año 390 d.C. en la ciudad de Roma, Caelia en vida fue la tercera hija de un centurión romano. No se sabe mucho de su vida humana simplemente porque no hay mucho que saber, sin mencionar que la mayoría de los registros de su época fueron destruidos; llevó una vida sin incidentes en Roma hasta que los galos la saquearon en el 410 d.C. Su padre y hermanos mayores murieron en la lucha, y mientras intentaba huir fue atacada por un Cainita. Luchó lo mejor que pudo, pero fue una batalla perdida desde el principio y fue derrotada con facilidad despectiva.\n\nQuienquiera que la convirtiera en vampiro la abandonó a su suerte. Su nueva identidad como vampiro fue rápidamente descubierta por la población local, y apenas logró escapar ilesa. Huyó hacia el noreste, tardando casi un siglo en dominar plenamente sus nuevos poderes y aprender a evitar la detección —o incurrir en la ira de otros cainitas. Solo tras otros dos siglos logró forjarse un lugar, aunque pequeño. Pero es un comienzo —si será el inicio de algo grande o no, está por verse." 
 POD_patronlore.100.t.560084: "Leyenda del Patrón: Michel Tenoctis"
 POD_patronlore.100.desc.560084: "Se sabe poco de él, ya que normalmente se mantiene aislado estudiando el Abismo. Todo lo que se sabe es que ya había descubierto la existencia del Abismo y había comenzado a estudiarlo antes de ser engendrado. Eso atrajo la atención del clan Lasombra y eventualmente lo llevó a su actual estado de no-muerte, cortesía del mencionado clan."
 POD_patronlore.100.t.560086: "Leyenda del Patrón: Alexarchus"
 POD_patronlore.100.desc.560086: "Alexarchus era un hombre sencillo antes de su abrazo, criado en una pequeña aldea en algún lugar de Grecia, un lugar que ha sido olvidado hace mucho tiempo. Más adelante en la vida, Alexarchus se convirtió en un místico esquivo, al que muchas personas acudían para recibir bendiciones y ritos. Viajó por las tierras cuando las noches eran mucho menos sangrientas de lo que son ahora. En algún momento de sus viajes, estuvo a punto de perecer y fue abrazado por uno de los Baali.\n\nAños de entrenamiento excruciante en las artes de su Sire lo hicieron poderoso, aunque se volvió loco. Hoy en día vive como un hombre recluso en una torre especialmente adaptada a sus necesidades, manipulando a la población de su condado y conduciéndola casi como un culto, con él en el centro de la adoración. Ellos miran con asombro la torre que habita, pero los ojos de su amo han mirado ya hacia otro lado. Las voces en su mente hablan de grandes logros, y sería sabio que les prestara atención."  
 POD_patronlore.100.t.560070: "Leyenda del Patrón: Abe no Seimei"
 POD_patronlore.100.desc.560070: "Un onmyōji, especialista destacado del onmyōdō durante el período Heian en Japón. El onmyōdō es un sistema de ciencia natural, astronomía, almanaques, adivinación y magia que se desarrolló independientemente en Japón basándose en las filosofías chinas del yin y el yang y el wuxing (cinco elementos). Además de su prominencia histórica, es una figura legendaria en el folclore japonés y ha sido retratado en numerosas historias. Seimei trabajó como onmyōji para emperadores y el gobierno Heian, aconsejando sobre la forma espiritualmente correcta de abordar los problemas. Oraba por el bienestar de los emperadores y el gobierno, además de asesorar sobre diversos asuntos. También fue astrólogo y predijo eventos astrológicos. Disfrutó de una vida extremadamente larga, libre de enfermedades graves, lo que contribuyó a la creencia popular de que poseía poderes místicos. Hacia el final de su vida, fue abrazado por uno de los Salubri orientales."
 POD_patronlore.100.t.560073: "Leyenda del Patrón: Jimeno FitzRoy"
 POD_patronlore.100.desc.560073: "Antes de su abrazo, Jimeno FitzRoy era un noble menor en Valencia —pariente lejano de algún rey español (o al menos eso afirma). Se labró una mala reputación al relacionarse libremente con comerciantes sin escrúpulos, ladrones y maleantes. Su desviación y disposición a doblar las leyes para su beneficio atrajeron la atención de un poderoso Lasombra en busca de un mortal para abrazar.\n\nTras el abrazo, Jimeno se sintió atraído por las turbias olas —como algunos Lasombra. Reclutó a los criminales que conocía en su vida anterior para tripular sus barcos y partió en un gran viaje lleno de aventuras, batallas y abundante botín saqueado. Para algunos corsarios, saquear y festejar es suficiente, pero Jimeno finalmente encontró restrictiva su vida en el mar. Aprovechando el caos en el Levante causado por las cruzadas, tomó el control de varios puertos clave y decidió 'establecerse'. Así nació la Corte de los Cuervos. Desde entonces, el poder de Jimeno se ha expandido ligeramente hasta abarcar la mayor parte de Siria y algunas tierras dispersas al otro lado del mar. Jimeno sueña con crear un reino pirata lo suficientemente poderoso como para gobernarse sin temor a que otros interfieran en sus asuntos; donde cada vampiro pueda vivir y morir como le plazca."
 POD_patronlore.100.t.560080: "Leyenda del Patrón: Matthaios Yelbeghen"
 POD_patronlore.100.desc.560080: "Como muchos Tzimisce, Yelbeghen ha descartado principalmente su pasado mortal. Antes fue Matthaios Dragastes, un místico judeo-romaniota que practicaba la Cábala Ma’asit usando magia Qliphothica en épocas pasadas. El estudio y la habilidad de Matthaios en tales magias lo convirtieron en una persona de interés para los vampiros que habitaban en la Antigua Constantinopla, y finalmente un childe del matusalén Tzimisce Andeleon (probablemente Urdo, 'Maestro de Perros del Infierno', o quizás Jedrik, 'el erudito') le otorgó el abrazo bajo las instrucciones de su sire.\n\nBajo la tutela de Andeleon, Dragastes estudió la disciplina de la Vicisitud en todas sus formas, y su dominio de la disciplina creció rápidamente más allá de lo esperado para su edad, como todos los vástagos de Andeleon. A medida que su dominio de la Vicisitud se consolidaba, Dragastes descubrió que al extender su conciencia hacia los Qliphoth, como lo había hecho en vida, podía sentir una inteligencia antigua que habitaba en la anti-vida presionando contra su conciencia. Bajo la guía de Andeleon, el místico entró en comunión con esta gran inteligencia. Le revelaron muchos grandes secretos de la Vicisitud y le hablaron de los antiguos y numerosos crímenes de seres llamados Nefilim. Atraído por estas entidades Eldritch, Matthaios se adentró en las [UmbraGlossary('shadowlands')] y viajó a los bosques de D’hainu, las ruinas de la Segunda Ciudad y las raíces del Monte Meru.\n\nEn estos viajes, los Vigilantes —como se llamaban a sí mismos estas entidades Qliphothicas— desmantelaron la mente de Matthaios y la reconstruyeron como una extensión de la suya. Impulsado por revelaciones insanas y poseído por estas entidades malévolas, Matthaios dio dirección y voz al brote emergente de Assaku que lentamente crecía como un tumor en la sociedad Cainita. Matthaios se convirtió en una especie de profeta para los Assaku, comunicándose directamente con los Vigilantes y proclamando revelaciones enloquecedoras en su nombre. Como línea principal de comunicación entre el creciente culto sanguíneo Assaku en Constantinopla y los amos Qliphothicos a los que servían, el resto del linaje de Andeleon comenzó a llamar a Dragastes el 'Susurrador en la Oscuridad', ya que se convirtió en un Hierofante para el creciente culto sanguíneo.\n\nHaciéndose pasar por un místico errante, Dragastes usaba su Vicisitud para sanar a los enfermos y heridos tanto de los Mortales como de los Cainitas. Sin embargo, con cada curación, su sangre contaminada se extendía entre las masas, pudriéndolas desde dentro y corrompiéndolas en meras extensiones de la voluntad de los Assaku. Potencialmente, la maldición de Dragastes podría haberse extendido por gran parte del Mediterráneo. Sin embargo, los Assaku, o más correctamente los Vigilantes que dominaban su voluntad, subestimaron a los demás Cainitas de la Ciudad. El Dracon, un antiguo Tzimisce cuyo conocimiento de la Vicisitud eclipsaba incluso al de los Assaku, erradicó muchos de los cultos de Matthaios y rápidamente obligó al Tzimisce renegado a huir de la ciudad. No obstante, algunos restos de la locura de Dragastes permanecieron en las afueras de la antigua Bizancio, aunque siglos de preparación y conspiración se deshicieron en pocos años. Aunque la victoria de la Trinidad sobre los Assaku fue rápida, los matusalenes que gobernaban Constantinopla ocultaron el culto sanguíneo derrotado para preservar la imagen de un Sueño estable e infalible.\n\nTras la expulsión de Dragastes de Constantinopla, el Hierofante errante de los Assaku aparentemente desapareció del mapa. Algunos susurran que el culto Assaku fue perseguido por los Elioud a través de Europa y Oriente Medio. Recientemente, el 'Susurrador en la Oscuridad' ha reaparecido bajo un nuevo nombre en los confines más remotos de Siberia, habiendo aparentemente eludido temporalmente la persecución del Tal’mahe’ra."
 POD_patronlore.100.t.560012: "Leyenda del Patrón: Izalda Kishlovsky"
 POD_patronlore.100.desc.560012: "Izalda nació en una familia relativamente exitosa, lo que no fue suficiente para evitar que creciera rodeada de problemas, muchos de su propia cosecha. En sus primeros años mostró un talento natural como académica.\nSin embargo, eligió un camino diferente, sumergiéndose secretamente en lo oculto. Los rumores sobre sus búsquedas secretas se extendieron rápidamente y, junto con su apariencia altamente inusual, convirtieron a Izalda en una marginada. Durante una noche fatídica, la joven doncella descubrió lo malos que eran los rumores, ya que fue dejada mutilada y medio muerta en las calles. Tal vez no sorprenda que quien la encontró y ayudó no fuera otro que un miembro de un aquelarre de brujas.\nBajo la guía del aquelarre, Izalda aprendió y creció rápidamente para convertirse en una bruja bastante ingeniosa. Pero nuevamente fue atacada en mitad de la noche. Esta vez, quienes resultaron mutiladas fueron sus propias hermanas del aquelarre, víctimas de su hambre.\nUna vez superada la etapa de neonata, Izalda dejó a su [Glossary('Sire','game_concept_Sire_desc')], Mellandis, y se exilió, aún llena de dolor por la muerte de sus hermanas. Durante este tiempo, se sumergió profundamente en la historia de su propio $pod_clan$, encontrando textos e información sobre el Ordo Aenigmatis.\nAhora, inspirada por el camino del Ordo, ha regresado a Leczyca, su ciudad natal, tomando fácilmente el puesto de condesa. Sin embargo, esto es solo el primer paso de un plan mucho más elaborado para elevar tanto a los Malkavian como al Ordo Aenigmático. Mientras tanto, permanecerá justo en el centro, lista para desatar el verdadero conocimiento sobre el mundo y cosechar su poder."
 POD_patronlore.100.t.560093: "Leyenda del Patrón: Amducious"
 POD_patronlore.100.desc.560093: "Nacido en Francia en el 787, Amducious fue un noble francés en la corte de Carlomagno en la cumbre de su reinado. Fue uno de los consejeros más cercanos de Carlomagno y un hombre extremadamente inteligente. Era conocido por su mente astuta y maquiavélica, pero también atormentado por la paranoia común en la corte francesa. Fue abrazado por Azaneal la noche de la muerte de Carlomagno, adoptó rápidamente su nueva no-vida y abandonó la anterior, perdiendo su nombre original en la historia. La Orden solo conoce a Amducious. Rápido en sus estudios de Daimonion, se hizo conocido como el Señor Engendrado por el Infierno dentro de la Orden y muy respetado en la estirpe por sus experimentos y estudios."
 POD_patronlore.100.t.560094: "Leyenda del Patrón: Æthelflæd"
 POD_patronlore.100.desc.560094: "Engendrado por Melusine d'Anjou más o menos como una obra de arte viviente y juguete, ha acumulado una pizca de poder simplemente por ser favorecido por ella y por encantar a quienes lo rodean, más que por cualquier competencia real, en la que carece seriamente. Tanto su nombre como su casa menor —Doe— le fueron otorgados por ella tanto como entretenimiento como para encajar en cierto tema." 
 POD_patronlore.100.t.560095: "Leyenda del Patrón: Memnon"
 POD_patronlore.100.desc.560095: "Memnon fue un rey semidiós etíope que combatió al héroe Aquiles. Aunque Memnon cayó en batalla, Zeus quedó impresionado por su habilidad y valor y le concedió la inmortalidad. Tras regresar a su tierra natal, vagó un tiempo en desesperación por su derrota hasta caer en torpor. Al despertar en el siglo XII, regresó a Grecia para enfrentar y derrotar a Aquiles. Aquiles había muerto hacía mucho tiempo. Atormentado por sentimientos de duda, ha intentado saciar su sensación de insuficiencia enfrentándose a los Cainitas de Grecia para probar su temple antes de regresar a Etiopía. Ahora desea demostrar su valía forjando un imperio cainita desde Etiopía. O quizás toda esta leyenda sea una farsa, creada por un guerrero Gangrel que deseaba inflar su ficción para inspirar devoción en sus seguidores y temor en sus enemigos."
 POD_patronlore.100.t.560096: "Leyenda del Patrón: Phillip"
 POD_patronlore.100.desc.560096: "Un arquitecto en ascenso originario de Nápoles, Phillip rechazó ofertas de trabajo prometedoras de ciudades italianas cuando un misterioso patrón lo invitó a renovar la exótica ciudad de Alejandría.\n\nAl llegar, Phillip encontró la ciudad indigna de Alejandro, Tolomeo y César. Declaró que se necesitarían varias vidas para restaurar Alejandría a sus días de grandeza. Su patrón, Marcelo de Alejandría, le ofreció esas vidas: una eternidad de vino, mujeres y canciones, intercalada con inspiración, con un cuerpo y una mente intactos por el paso del tiempo. ¿Un arquitecto diseña obras para que duren, no debería su recipiente terrenal estar también construido sobre cimientos de adamantio?\n\nEn las sobrias noches posteriores a su abrazo, Marcelo reveló que la casa de Caín se edificaba sobre cimientos de conflicto incesante. Egipto era un hervidero de conflictos entre Setitas y Cainitas; Marcelo estaba más interesado en guaridas y pasadizos secretos en las entrañas de Alejandría que en la restauración de la ciudad mortal.\n\nFue un viaje amargo de regreso a Italia, y Phillip se maldijo a sí mismo por haber confiado en el egipcio. Ahora se entierra en proyectos para distraer a la bestia: dibujando a la luz de las velas, inspeccionando a la luz de la luna e incluso trabajando piedra y madera con una destreza sobrenatural en la oscuridad. Los títeres mortales en su dominio siguen viviendo y muriendo a la sombra de sus obras, como muñecas en sus casas de muñecas."
 POD_patronlore.100.t.560097: "Leyenda del Patrón: Senen"
 POD_patronlore.100.desc.560097: "El Vigilante Blanco es una figura antigua y enigmática entre los magísteres. Su prole, los Renegados, es una rama disidente de los Lasombra a menudo llamada la 'sombra blanca', que actúa como guardiana del Silencio de la Sangre —la Máscara—. Valoran el deber por encima de todo y sirven como vigilantes para salvaguardar el futuro de su casa y dinastía."
 POD_patronlore.100.t.560098: "Leyenda del Patrón: Golub"
 POD_patronlore.100.desc.560098: "Con antecedentes como noble menor bosnio, devoto seguidor del bogomilismo y médico talentoso, Golub atrajo la atención, y el abrazo, de Nikita de Sredetz. Sin embargo, esto no produjo un peón dispuesto que combinara influencia temporal, devoción religiosa y conocimiento para Nikita.\n\nGolub quedó profundamente horrorizado por la Herejía Cainita y su corrupción de la iglesia. Al alejarse del alcance de su sire, buscó un dominio en los márgenes de la influencia de Nikita. Aun así, no huye más allá de eso, ya que se siente responsable de contraatacar a los monstruos que mantienen la fe como rehén. Con este fin, ha atacado a varios ancianos y sirvientes de la Herejía que ha encontrado. Inadvertidamente, a pesar de verse a sí mismo como salvador, llegó a considerar a las instituciones religiosas como el enemigo. Ve la influencia de la Herejía y a su sire detrás de todo."
 POD_patronlore.100.t.560099: "Leyenda del Patrón: Niobe"
 POD_patronlore.100.desc.560099: "Niobe nació alrededor del siglo XIV a.C. en la ciudad-estado micénica de Tebas, en Beocia. Poca información ha llegado hasta nosotros, aunque podemos asumir orígenes nobles e interés por las artes o la música. Los testimonios sobre su encuentro con su Sire Amphion el 'Músico' se perdieron en los meandros del tiempo, pero por su apariencia física podemos estimar que recibió el abrazo antes de cumplir treinta primaveras. Su ascenso relativamente modesto dentro del clan no dejó hechos notables para la posteridad, dejando un vacío hasta el -519 a.C., cuando abandonó Grecia rumbo a Roma en medio del conflicto entre tebanos y atenienses. Emprendió actividades de mecenazgo para artistas cainitas bajo la protección de los Toreador y no parece haber tenido un papel importante en las intrigas del clan o del Imperio Romano. En el -509 a.C. conoció a Tanitbaal-Sahar, huésped de Titus Venturus Camillus, quien le enseñó los preceptos de su tratado filosófico 'Sobre el Hambre y su Satisfacción', del cual la Vía Desideratio es heredera. Desde entonces, Niobe participó activamente en los asuntos de la joven república romana para promover los valores libertarios de la Vía Desideratio, pero se topó con la oposición de los cultos de la Vía Regalis y la Vía Caelis. Marginada por sus costumbres consideradas inmorales, los seguidores de la Vía Desideratio fueron marcados con el sello de la infamia y designados como pecadores, llegando incluso a ser renombrados como Camino de los Pecados por sus detractores. Niobe abandonó Roma hacia fines del siglo I a.C. para dirigirse a Narbona, donde reanudó sus actividades proselitistas. En el siglo X fundó un culto dedicado a la Vía Adversarius en el condado de Toulouse para difundir las creencias del Camino de los Pecados en el sur. Al alba de la herejía cátara, Niobe influyó y organizó a los cátaros con el objetivo de desestabilizar a la Iglesia de Roma en Occitania. Durante la cruzada albigense, primero se unió a la Corte de Esclarmonde la Negra, la ayudó a repeler la invasión septentrional y luego, con el apoyo de los príncipes occitanos de la oposición, destituyó a Esclarmonde en su beneficio. Niobe logró fortalecer su influencia en Occitania y convertir esta región al Camino de los Pecados, realizando finalmente su sueño de una tierra de asilo para sus acólitos oprimidos." 
 POD_patronlore.100.t.560104: "Leyenda del Patrón: Hagbard"
 POD_patronlore.100.desc.560104: "Nacido en una familia tradicional de la Rus de Kiev, la debida reverencia a los antiguos dioses le fue inculcada desde joven. Al no ser tonto, cuando su señor decretó que el reino se convertía al cristianismo, permitió que los vientos del cambio lo llevaran lejos de allí. Tras numerosas aventuras famosas entre los mortales de esa época, el viajero experimentado aparentemente encontró un hogar sirviendo al emperador bizantino como miembro de la Guardia Varega. En Constantinopla, su paganismo obstinado era visto con condescendencia más que con hostilidad abierta como en otros lugares, pero su fe en los antiguos dioses atrajo un tipo de atención completamente distinto. Conoció a un hombre que le mostró que los dioses de su tierra natal no tenían poder allí... y al mismo tiempo, le presentó a otros que sí lo tenían. Su mente destrozada por el abrazo, se aferró a algunos fragmentos de lo que fue, convirtiéndose en un firme defensor de los antiguos dioses de su hogar adoptivo." 
 POD_patronlore.100.t.560106: "Leyenda del Patrón: Conrado Adelchi"
 POD_patronlore.100.desc.560106: "En sus seiscientos años de no-vida, Conrado Adelchi ha adquirido y regalado numerosas fortunas, a menudo obtenidas por medios legítimos como el comercio de arte, la fabricación de perfumes y similares, pero ocasionalmente mediante robos de tumbas, contrabando y otras empresas criminales.\n\nUna vez, en los primeros días de su no-vida, Conrado vendió 'el regalo de Caín' gratis a los verdaderamente desesperados y a quienes estaban dispuestos a pagar. Sus errores fueron 'corregidos' por Calida antes de que se violara la Máscara. Alguien debe financiar los lujosos saraos de los Toreador, y para Calida, el talento de Conrado para adquirir riqueza alcanzaba el nivel del arte, al menos lo suficiente como para pasar por alto sus indiscreciones juveniles."
 POD_patronlore.100.t.560105: "Leyenda del Patrón: Viktor"
 POD_patronlore.100.desc.560105: "En su época, Viktor fue un general ruso temido. Como gobernante, aunque gobernaba con mano de hierro, siempre tuvo el respeto de sus súbditos, pues no tomaba a la ligera su palabra. Durante su vida mortal, ascendió desde un noble y general íntegro hasta convertirse en señor de un vasto dominio y una riqueza considerable. Otros lo veían como un hombre orgulloso, firme en sus creencias tradicionales, pero sobre todo, Viktor siempre apreció el poder y la lealtad de sus hombres. Para cuando envejeció, cultivó a su alrededor una compañía de sirvientes de élite, soldados valiosos reclutados de todas sus tierras; pero ni siquiera ellos tenían respuestas para su mayor temor: su vejez y muerte inminente. Pero sus hazañas no pasaron desapercibidas, y una figura sombría se le acercó cuando su fuerza mortal comenzaba a fallarle. Como criatura de la noche, su autoridad y sed de poder solo crecieron, al desvelársele un nuevo mundo lleno de oportunidades.\n\nViktor pronto se dio cuenta, sin embargo, de que ahora tendría que cambiar su estrategia: en lugar de gobernar bajo los focos, tendría que hacerlo desde las sombras. Abrazó a sus sirvientes más cercanos y partió para empezar de nuevo y reclamar un dominio en una nueva región. Hombre de convicción inquebrantable, Viktor, en su no-vida, lidera con el ejemplo tal como lo hizo antes."
 POD_patronlore.100.t.560044: "Leyenda del Patrón: Damian Eridanus"
 POD_patronlore.100.desc.560044: "El segundo hijo reservado pero recalcitrante de un barquero igualmente taciturno, Damian no era un rebelde según la mayoría de los estándares.\n\nPermanecía callado y observador —un pensador profundo—; miraba el agua desde la barca de su padre, fascinado por las ondas que dejaban a su paso, o contemplaba las estrellas con su madre, mientras ella señalaba cómo se conectaban para formar constelaciones.\n\nAunque contento con su imaginación, introspección e indiferencia general hacia los asuntos materiales, el joven no dudaba en emplear un sarcasmo inteligente y crítica analítica para expresar su disconformidad ante ancianos innecesariamente autoritarios, ganándose su respeto a regañadientes. Ascendido a posiciones de influencia siendo aún joven, pero sin ambición; comprendía rápidamente las motivaciones y deseos de los demás, pero nunca los suyos propios.\n\nDamian se había cansado de su vida antes de que siquiera hubiera comenzado.\n\nAhora, lleno hasta el tope de poder oscuro y sed de algo más, busca la verdad tras su abrazo.\n\nAl percibir las transacciones antinaturales de los monstruos que lo crearon, Damian pretende descubrir su papel en sus maquinaciones y hallar un método para desmantelar los vínculos fantasmales que lo obligan a observar en silencio la tediosa y mezquina política entre necios pérfidos.\n\nIncluso ahora en la muerte, busca una resolución al camino que ha seguido desde su nacimiento. Pero el camino de menor resistencia, como el fluir del río, solo terminará cuando alcance el mar." 
 POD_patronlore.100.t.560107: "Leyenda del Patrón: Aisling Leanhaun"
 POD_patronlore.100.desc.560107: "Como Fae, Aisling sufría la maldición Leanhaun, que la hacía envejecer rápidamente si no robaba suficiente Glamour a los mortales. En un intento por escapar de esta maldición, orquestó su propio abrazo, intercambiando una adicción por otra.\n\nAl no querer someterse a su Sire, Aisling se liberó rápidamente de su tutela. Sus primeros años alimentándose en las Tierras Altas escocesas son responsables de las primeras leyendas de las Baobhan Sith, o 'Banshee'. Al aprender a integrarse en la sociedad Cainita por su cuenta, ha adoptado con diversión este legado, modelando su corte a imagen de las Fae y estableciendo una fe de Pecadores basada en interpretar el papel de esta criatura mítica."
 POD_patronlore.100.t.560131: "Leyenda del Patrón: Riniva"
 POD_patronlore.100.desc.560131: "Una mujer de mentiras superpuestas, la no-vida de Riniva comenzó cuando fue vendida como esclava en el Imperio Bizantino, lejos de su hogar. Su sire pensó que el conocimiento de Riniva sobre la hechicería india ayudaría a su causa y la consideró una compra excepcional, casi demasiado buena para ser verdad. Era exactamente así; Riniva se había vendido a sí misma como esclava bajo un seudónimo para huir de obligaciones contraídas con sus tutores mágicos originales.\n\nUna vez que la joven advenediza obtuvo la inmortalidad de su nuevo benefactor, puso en marcha una serie de eventos para escapar también de esta nueva tierra, pero tales planes fueron interrumpidos por una incursión de la 'jubilada' Guardia Varega que saqueó su aldea.\n\nFingiendo ser la doncella en apuros, Riniva accedió a los invasores y representó el papel de cautiva. Viajó con esta tripulación de guerreros de regreso a su tierra ancestral para ver cómo manejaría su propia base de poder lejos de aquellos a quienes debía la inmortalidad, y aún más lejos de aquellos a quienes debía por la magia. Riniva estaba finalmente libre para actuar como quisiera, rodeada de guerreros encantados y desvinculada de la influencia de mentores o acreedores, pero sus viejos trucos podrían alcanzarla pronto al acercarse al extremo norte del mundo. Una traición más y podría no quedar ningún lugar adonde huir."
 POD_patronlore.100.t.560082: "Leyenda del Patrón: Nárkissos"
 POD_patronlore.100.desc.560082: "Nárkissos nació en una familia noble de la antigua Grecia, hijo del dios del río Cefiso y de una ninfa llamada Liriope. Desde joven, Nárkissos era conocido por su asombrosa belleza y carisma, que atraía admiradores de todas partes. Sin embargo, también era conocido por su arrogancia y su desdén por quienes no cumplían con sus altos estándares de belleza y perfección.\n\nAl crecer, Nárkissos se volvió cada vez más obsesionado con su propia apariencia, pasando horas admirándose en superficies reflectantes y encargando esculturas y pinturas de sí mismo. Se volvió cada vez más aislado, negándose a relacionarse con quienes consideraba indignos de su atención.\n\nUn día, su hermana gemela, llamada Narkissa, se le acercó. Eran idénticos en apariencia, y se decía que su belleza era incomparable en toda la tierra. Nárkissos se vio reflejado en su hermana, y ella en él. Se volvieron inseparables, pasando sus días y noches juntos en un mundo propio.\n\nSin embargo, su amor no estaba destinado a durar. Una noche, ambos fueron abordados por vampiros Toreador atraídos por su belleza única, quienes les ofrecieron la inmortalidad a cambio de su servicio. Nárkissos y su hermana aceptaron, viendo esto como una forma de alcanzar la juventud y belleza eternas.\n\nComo vampiros, Nárkissos y su hermana permanecieron tan vanos y egocéntricos como siempre. Continuaron obsesionándose con su apariencia y se negaron a relacionarse con quienes consideraban inferiores. También se fascinaron con el concepto de diablería, viéndolo como una forma de obtener aún más poder y belleza al consumir las almas de otros vampiros.\n\nUna noche, Nárkissos y su hermana cazaban juntos cuando se encontraron con un poderoso vampiro anciano al que decidieron diablerizar. Sin embargo, durante el proceso, Nárkissos traicionó a su hermana y consumió también su alma, impulsado por su insaciable hambre de poder y belleza.\n\nAhora, Nárkissos vaga solo por la noche, consumido por la culpa y el remordimiento por lo que le hizo a aquella que era su reflejo perfecto. Está atormentado por su recuerdo y nunca puede escapar plenamente del conocimiento de que él fue quien la mató. Para empeorar las cosas, cada vez que se mira en el espejo, ve su rostro mirándolo de vuelta, un recordatorio constante del terrible acto que cometió. Sin embargo, sigue siendo tan vano y egocéntrico como siempre, continuando su obsesión por su apariencia y buscando otros vampiros para diablerizar en su búsqueda interminable de poder y belleza."
 POD_patronlore.100.t.560189: "Leyenda del Patrón: Shou Yu"
 POD_patronlore.100.desc.560189: "Cuando la guerra civil desgarró la tierra media y dividió la dinastía de las Llanuras Centrales en tres, y Wu Lung y los Hermanos Akáshicos luchaban en confrontación, un gobernante benevolente brilló como una estrella fugaz en el norte de China. El mago independiente Fu Jian, quien afirmaba ser Ti'an Wang, estableció un reino celestial en las tierras del norte, lejos de las llamas de la guerra. Sin embargo, los buenos tiempos no duraron mucho, y Wu Lung finalmente destruyó su gobierno.\n\nMientras Fu Jian era olvidado por el tiempo, un nuevo Rey Celestial regresó a la Tierra Media en forma de inmortal, acompañado de la máxima bondad y valentía acordes con Ti'an Wang, para salvar al pueblo chino del sufrimiento."
 POD_patronlore.100.t.560202: "Leyenda del Patrón: Alarvyne"
 POD_patronlore.100.desc.560202: "Alarvyne nació de un capitán vikingo danés y su concubina, y pasó la mayor parte de su vida mortal en el mar. Siendo una niña solitaria, tenía talento para extraños rituales ocultos que involucraban a los muertos, los cuales guardaba para sí misma, practicando secretamente su 'arte' con los cuerpos de las víctimas de las incursiones de su padre. Cuando aún era adolescente, encontró a Raymonde Roussel Japhet, una vampira del clan Cappadociano, quien vio el talento de la joven y decidió vigilarla. Años después, tras la muerte de su padre durante una incursión fallida, Raymonde decidió que era hora de abrazar a Alarvyne. Alarvyne se adaptó rápidamente a su nueva vida como vampira, desarrollando sus habilidades como nigromante, y siguió los pasos de su padre, liderando una tripulación de saqueadores compuesta por sirvientes, espectros y otros vampiros."
 POD_patronlore.100.t.560200: "Leyenda del Patrón: Adrahasis"
 POD_patronlore.100.desc.560200: "Bajo la luna nueva, entre las grandes serpientes curvas de la civilización, nació un niño. Progenie de una nobleza menor, el niño escamoso Adrahasis fue mantenido oculto. Al crecer en las sombras, Adrahasis mostró una afinidad inusual para descubrir secretos. Sus escamas aparentes, un secreto familiar, lo llevaron a un aislamiento extremo. Al acercarse a la adolescencia, algo vil fermentaba dentro de él. A los 17 años, escapó de su confinamiento llevándose gran parte de la riqueza familiar. Luego, durante cinco años, lo gastó todo satisfaciendo todos sus deseos, lo que lo llevó al norte, a las tierras salvajes de Europa.\n\nQuizás por lástima, desdén o cualquier otra razón, fue abrazado bajo una luna roja sangre. De cualquier forma, pasó el siglo siguiente bajo la vigilancia de su sire, absorbiendo conocimiento como una esponja. En el 490 a.C., harto de su sire, Adrahasis lo engañó y huyó al sur, hacia Maratón, solo para verse atrapado en una batalla. Tras la Batalla de Maratón, pasó los años explorando las polis griegas. Se convirtió en consejero, susurrando ideas a figuras influyentes bajo el velo de la obfuscación. Eventualmente se dirigió al este, involucrándose en el ascenso del Imperio Maurya en la India. Pasó su tiempo estudiando numerosos textos religiosos y filosóficos, e incluso persiguió brevemente el conocimiento que Saulot había buscado. Abandonó este empeño cuando perdió una pierna ante uno de los [Glossary('Muertos Hambrientos','game_concept_kuei_jin_desc')], una herida que nunca sanará del todo. La lesión lo obligó a entrar en torpor, en el que permaneció hasta el 12 d.C. Durante ese tiempo, sirvientes sirvientes lo transportaron al oeste, enterrado en el Levante. En el 19 d.C. comenzó a viajar a Tiro, donde absorbió conocimientos 'inusuales'.\n\nCansado del caos de Roma, regresó al este, a la India, donde vagó hasta el 312 d.C. Adrahasis encontró una vez a los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] que lo mutilaron; se dice que su batalla duró catorce noches. El resultado se desconoce, pero lo cierto es que Adrahasis huyó al sur, a Sri Lanka. Allí se sometió a un vínculo sanguíneo con Kartarirya a cambio de refugio. Hizo su guarida en Ratnapura, la ciudad de las Gemas. Desde entonces ha vuelto a involucrarse en la política de la sociedad Cainita; el vínculo sanguíneo se ha debilitado o quizás ha desaparecido.\n\nAhora es tiempo de mayores intrigas, después de todo, el premio más grande aguarda: la India está madura para ser tomada."
 POD_patronlore.100.t.560197: "Leyenda del Patrón: Nafisa"
 POD_patronlore.100.desc.560197: "Nafisa nació en una tribu beduina con sangre Fae, lo que se manifestaba en su longevidad antinatural y en alas de cuervo en su espalda. Llegó a ser adorada como un espíritu del Cambio por su tribu —aunque les otorgaba pocos dones a cambio de su adoración. Cientos de años después de su nacimiento, Nafisa memorizó el Corán, el libro sagrado de la religión emergente del Islam; desde entonces se la conoce como Hafiza.\n\nTécnicamente abrazada en un Gran Clan, pero para siempre fuera de él, este 'Elemental Alado' se dice que es una luchadora firme contra el monoteísmo y la hostilidad dogmática hacia otros seres sobrenaturales." 
 POD_patronlore.100.t.560201: "Leyenda del Patrón: Aren Darkwell"
 POD_patronlore.100.desc.560201: "Aren Darkwell, un valiente guerrero abrazado en el clan Lasombra en el 648, ascendió rápidamente a la prominencia gracias a su dominio de las sombras, una habilidad que manejaba con gracia letal en los campos de batalla de la Europa medieval. En 1066, orquestó las sombras tras la Conquista Normanda, inclinando la balanza del poder y remodelando el panorama político de Inglaterra. En el siglo XII, la influencia de Aren se extendió a las Cruzadas, donde maniobró hábilmente en medio del caos, utilizando los conflictos para fortalecer la posición de su clan y eliminar rivales bajo el pretexto de una guerra santa. Ahora, en 1250 en Francia, se erige como un rey oculto, su nombre susurrado con reverencia y temor en las cortes europeas, mientras su legado oscuro continúa moldeando el destino de las naciones."
 POD_patronlore.100.t.560196: "Leyenda del Patrón: Sylven ap Sorel"
 POD_patronlore.100.desc.560196: "En las calles de Vannes, un joven noble bretón vivía una vida de ocio. Se entregaba a juergas, peleas y mentiras a su antojo.\n\nA pesar de todos sus defectos, adoraba a su hermano menor, un vínculo fortalecido por las dificultades compartidas en su infancia. Pero no pudo evitar lo inevitable. Noches oscuras se desplegaron con signos inquietantes, desde sombras hasta cadáveres desangrados. Los horrores atacaron, y llegó la muerte. Muerte para su linaje, su pueblo y su tierra.\n\nLo perdió todo. Con pasos sin rumbo, encontró un propósito en la Cruzada Popular para recuperar Jerusalén. Seguramente, pensó, cualquier mal que hubiera acechado a Vannes también era enemigo de Dios.\n\nFue una matanza total, pero luchó hasta el amargo final. Impresionado por su determinación, un capitán mercenario le ofreció una oportunidad: ser abrazado y renacer como miembro del Clan Brujah.\n\nDesde entonces, Sylven se alineó con la causa del Portador del Fuego. Reconociendo su talento latente, su sire lo moldeó en un duelista hábil. Sus deberes incluían supervisar las células Promethean y eliminar amenazas tanto externas como internas.\n\nCon una estela de carnicería a su paso, el llamado Ejecutor se desilusionó con el tiempo. Desde entonces se ha alejado y ahora busca forjar su propio destino.\n\nPero incluso ahora, hay una cuenta pendiente. La masacre de Vannes y la muerte de su hermano no pueden quedar sin respuesta. Los vástagos de Tzimisce deben pagar."
 POD_patronlore.100.t.560192: "Leyenda del Patrón: Galeria"
 POD_patronlore.100.desc.560192: "Originaria de la Hermandad del Libro, nacida de madre y padre Fae en el año 970, y adoptada por un erudito vampírico, se esfuerza por aprender todo lo posible sobre otros seres sobrenaturales. Sus padres han muerto hace mucho y sus rasgos sobrenaturales no se manifestaron hasta mucho después, lo que llevó a la mayoría de la tribu a creer que había nacido más frágil que un mortal."
 POD_patronlore.100.t.560108: "Leyenda del Patrón: Valuk"
 POD_patronlore.100.desc.560108: "Tras el fracaso del intento de los ávaros de capturar Constantinopla en el 626, se volvieron hacia el oeste y atacaron el territorio habitado por los eslavos alpinos. Las tribus se unieron bajo su nuevo líder Valuk, quien repelió a los ávaros y estableció el Principado de Carantania.\n\nCon el tiempo, la fama de Valuk creció, y la noticia de su gobierno justo pero firme llegó a oídos de los Ventrue, quienes lo abrazaron en su clan. Tras décadas de gobierno, Valuk renunció a su cargo y en cambio dirigió el destino de su pueblo desde las sombras. Los moldeó a su imagen y aseguró su supervivencia bajo diversos poderes extranjeros.\n\nDestino futuro:\n\nValuk continuaría guiando a su pueblo a través de los años cruciales del siglo XX. Con su búsqueda de un estado soberano carantanio cumplida en los últimos años de esa era, lo volvió a entregar en manos de sus servidores mortales. Algunos dicen que el viejo Príncipe ahora se dedica plenamente a practicar su otra pasión mortal: el arte de la arquitectura." 
 POD_patronlore.100.t.560130: "Leyenda del Patrón: Atticus"
 POD_patronlore.100.desc.560130: "Un antiguo esclavo en el Imperio Romano, nacido a finales del siglo III, esclavo desde su nacimiento, su nombre es Atticus. Griego y propiedad de un patricio, fue bien educado desde la infancia en asuntos militares. Atticus desarrolló un cuerpo fuerte, voluntad firme y una mente muy aguda. Siempre mostró gran aptitud para la lucha y era muy curioso, entrenando y leyendo constantemente. Fue su lectura de un tomo prohibido lo que le valió las cicatrices en la espalda. Fue vendido a un lanista a los doce años. Mientras entrenaba para la arena, seguía buscando mejorar sus conocimientos. Se convirtió en uno de los mejores gladiadores esclavizados del ludus. Ganó las dieciséis contiendas en las que participó. Le ofrecieron la 'libertad' si servía en las legiones. Utilizado en las primeras líneas, realizó un trabajo increíble y fue esencial para la victoria en algunas batallas. Pasó tres años en servicio, pero su lanista exigió un último combate gladiatorio, del que Atticus salió victorioso. Esa noche, cuando fue a hablar con su lanista para obtener finalmente su libertad, fue emboscado y apuñalado. Una figura emergió de las sombras y le preguntó qué quería más: libertad, venganza o muerte. Aceptó de inmediato la oferta, y la figura le hizo beber su sangre para sanar sus heridas, explicándole que su lanista había enviado a los asesinos para matarlo. Conocería a su salvador como Karotos. Su domitor lo había estado observando desde hacía tiempo. Esa noche, Atticus visitó a su lanista y lo mató. Después de eso, fue tutelado durante diez años sobre la sociedad Cainita. Luego, Karotos, tras juzgar el valor de Atticus, lo abrazó. Atticus ha pasado la mayor parte de su tiempo desde entonces perfeccionando sus habilidades y conocimientos, siempre errante." 
 POD_patronlore.100.t.560129: "Leyenda del Patrón: Suleyman ibn Arua"
 POD_patronlore.100.desc.560129: "Durante su vida, Suleyman fue miembro de la tripulación de un barco pirata que saqueaba el Mediterráneo.\n\nNacido en Beirut, se unió a un barco, el 'Arua', siendo muy joven como grumete. En este barco, Suleyman participó en robos, saqueos y batallas navales, y en pocos años pasó de ser un grumete a un miembro importante de la tripulación.\n\nConsidera al barco su único hogar y a la tripulación su única familia. La llegada del califa Osman a Siria le ofrece una nueva visión; se convierte a la nueva religión junto con su tripulación y saquea y mata a los enemigos de su nueva fe.\n\nPero atrae atención, y el lado vampírico de la expansión del Islam quiere controlar los mares, y piensa que tener a Suleyman de su lado puede ser una ventaja contra los bizantinos.\n\nEl Arua es atacado de noche, el barco es devastado, la tripulación es masacrada y Suleyman queda gravemente herido. Mientras yace moribundo, un ser le ofrece un pacto: inmortalidad a cambio de sus talentos para proteger la verdadera fe y la sociedad vampírica. Aceptó, y desde ese día, ha viajado por tierras y mares para proteger su fe." 
 POD_patronlore.100.t.560136: "Leyenda del Patrón: Ambesa"
 POD_patronlore.100.desc.560136: "Una simple comerciante en vida, Ambesa fue atacada de noche y dejada por muerta. Despertó la noche siguiente sin latidos y sin memoria de lo ocurrido. A lo largo de las décadas ha aprendido la naturaleza de su condición y ha usado el poder otorgado por su sire desconocido para arrebatar el control de su hogar montañoso.\n\nMuchos despreciarían las pretensiones de poder de un Caitiff, pero muchos están cegados por el deber hacia sus linajes. Cainitas discutiendo sobre su descendencia de Caín, Set y Zapathasura plagaron el este de África. Lo que todos olvidan es que el poder no viene del linaje, sino de la sangre, y Ambesa pretende apoderarse de tanta como pueda."
 POD_patronlore.100.t.560138: "Leyenda del Patrón: Al Mualim"  
 POD_patronlore.100.desc.560138: "Al Mualim, cuyo nombre real ha descartado, es una guerrera/erudita y, más importante, defensora de Tierra Santa. Nacida en La Meca, su padre era líder de una caravana y ganaba su sustento viajando por el Sultanato Ayyubí de Egipto. Su hermano mayor era un espadachín consumado y guardia principal de la caravana. Fue él quien, tras mucha insistencia, le enseñó técnicas de espada y combate por las noches.\n\nHasta una noche fatídica en que un grupo de cruzados atacó la aldea donde la caravana había parado, matando a sus habitantes y reduciéndola a cenizas. Al Mualim fue salvada y abrazada por un Cainita poco después de emboscar a sus atacantes, matándolos pero quedando mortalmente herida. Tras dejar atrás su vida, abandonó su nombre y se convirtió en un arma sin nombre usada contra los cruzados y sus contrapartes no-muertas, especializándose en guerra asimétrica. Con el tiempo, debido a sus habilidades, comenzó a enseñar a otros Neonatos a realizar emboscadas y, en general, cómo luchar."
 POD_patronlore.100.t.560144: "Leyenda del Patrón: Rosalie"
 POD_patronlore.100.desc.560144: "Cuando la sire de Rosalie la vio por primera vez, pensó que la bonita hija de un noble, que pasaba sus días durmiendo mientras los sirvientes trabajaban, sería una childe obediente y dócil. Pero con los años, vio cómo su nuevo juguete atraía la atención de todos los que la rodeaban, volviéndose más arrogante que una princesa de sangre real. Rosalie sabía lo que su sire pensaba de ella, pero no le importaba, nada de eso le importaba. Pronto los sirvientes la vieron como su señora, lo que facilitó enormemente derrocar a la sire que pensaba tan poco en ella. Se aburrió de esto, nunca parecía satisfecha sin importar la atención que le prodigaran. Pronto comenzó a viajar por el mundo conocido, buscando algo inalcanzable que solo existía en los cuentos.\n\nFue en Francia, entre las muchas maravillas de París, que finalmente encontró lo que buscaba. Una princesa que le recordaba tanto a sí misma. Un fantasma, tan odiado por su familia y todos a su alrededor. Se compadeció de la pobre chica, ocultándose entre los cortesanos para garantizar su seguridad. Pero no duraría, pues en el decimoséptimo invierno de la chica ocurrió una tragedia. La enfermedad que la aquejaba desde hacía tanto tiempo se agravó, sin esperanza de cura. En mitad de la noche, solo quedaba un salvador: sacó a la moribunda del palacio hacia la libertad.\n\nPero justo cuando se sentía completa, se reveló una nueva pieza faltante. ¿De qué sirve una princesa sin un reino que gobernar? Y así, Rosalie espera los años, acumulando fuerzas, hasta que quizá, algún día, las dos puedan regresar a Francia con un ejército de soldados leales tras ellas."
 POD_patronlore.100.t.560150: "Leyenda del Patrón: Haldor"
 POD_patronlore.100.desc.560150: "En vida, devoto de Thor en Dinamarca, se unió al ejército del rey Bacgsecg durante la conquista vikinga de Inglaterra, fue asesinado en la Batalla de Ashdown en el 871, pero fue seleccionado por las Valquirias de Odín para convertirse en uno de los Einherjar, aunque encontró el camino de los Jotuns más de su agrado."
 POD_patronlore.100.t.560152: "Leyenda del Patrón: Barachiel"
 POD_patronlore.100.desc.560152: "Barachiel fue un Salubri que llegó a Constantinopla para vigilar la ciudad tras el creciente influjo Baali en la zona. Quedó impresionado por Michael y sus ideales. Apoyó secretamente el Sueño cazando Baali en la ciudad y sus alrededores. Tras la diablería de Michael, Barachiel quedó devastado porque creía que la muerte final de Michael era parcialmente su culpa. Se recluyó en Malta porque duda de que actualmente sea capaz de cazar Baali."
 POD_patronlore.100.t.560163: "Leyenda del Patrón: Dàniel"
 POD_patronlore.100.desc.560163: "Dàniel fue muchas cosas en vida: un errante, un jugador, un borracho, etc... Sin embargo, siempre pareció tener una extraña inclinación intelectual. Se enseñó a leer solo, a veces apostaba libros o fragmentos de folclore, e incluso apostó famosamente una década de servicio a un señor a cambio de leer su biblioteca. Ganó, y tras unos días de estudio y conversación con el señor, fue invitado a quedarse para ayudar en un proyecto del señor. Resultó que el proyecto era de naturaleza infernal, pues el señor resultó ser uno de los Baali. Tras un ritual demoníaco fallido y la milla más rápida que Dàniel jamás corrió, fue encontrado por un Malkavian al servicio de Mithras, quien se dio cuenta de que Dàniel sabía demasiado. Al ver cercano su fin, Dàniel pidió un último juego y apostó su vida. Esto divirtió al hijo de Malkav, y cuando Dàniel ganó por poco, se le ofreció una elección: morir drenado pero en éxtasis, ser atado a su servicio como sirviente (aunque no sabía qué significaba en ese momento), o convertirse en hijo de Malkav. Desde aquella noche, Dàniel ha seguido su vida como antes, pero a menudo usa alias asociados con espíritus locales o personificaciones de la suerte, tentando a los mortales con conocimientos o tesoros que ha obtenido. Recientemente se encuentra en Alemania, donde un juego violento resultó en que perdió el control y diablerizó a otro Malkavian; las consecuencias potenciales de tal acción son su preocupación actual."
 POD_patronlore.100.t.560169: "Leyenda del Patrón: Neferkheperu"
 POD_patronlore.100.desc.560169: "Neferkheperu acaba de regresar de su ciclo por primera vez en más de dos mil años, lo que lo deja mal adaptado a la era moderna y sus tácticas famosas inútiles en un mundo tan cambiado respecto a la Edad de Bronce y los Dioses que habitó. Está tan dedicado al Horus Dorado como lo estuvo en su juventud, y afirma que fue bajo el reinado de su madre —Hatshepsut—. Sin embargo, la historia proclama que el Thutmose Neferkheperu de Hatshepsut vivió hasta los cincuenta años, lo que genera confusión sobre la veracidad de la historia de Neferkheperu. Todo lo que los demás Shemshu-Heru saben con certeza es que el hombre de piel dorada es un guerrero devoto y se esfuerza rápidamente por conocer todo lo posible sobre el mundo en el que ahora habita."
 POD_patronlore.100.t.560174: "Leyenda del Patrón: Stephen Gawain"
 POD_patronlore.100.desc.560174: "Como líder mercenario anglo-normando, Stephen Gawain se unió a la Guardia Varega y rápidamente ascendió en las filas hasta convertirse en uno de los comandantes más importantes del imperio en guerras posteriores. Sus tácticas brutales y sin principios le valieron comparaciones con Roussel de Bailleul por parte del pueblo de Constantinopla. Aunque intentó demostrar que no los traicionaría, las altas esferas del imperio, incluyendo posiblemente al propio emperador Alejo I, dudaban de su lealtad. A pesar de la desconfianza del Imperio Bizantino, Belisario reconoció su lealtad y sufrimiento, y lo abrazó a principios de 1119.\n\nA lo largo de su vida, Gowen permaneció leal y usó su astucia y métodos brutales para asegurar su posición como Príncipe de Sinope/Popeiopolis, y ayudó encubiertamente al ejército imperial a repeler a cualquier invasor hasta que los Cruzados Amargos destruyeron el Imperio Bizantino y el Sueño de los Cainitas.\n\nDurante su carrera, desarrolló un romance clandestino con la Gran Princesa del imperio, Ana Comnena. Sin embargo, debido a su lealtad, no se involucró en la conspiración de la Gran Princesa contra su hermano. Tras el Abrazo de la Gran Princesa, se convirtió en un firme partidario de ella en el Sueño. Pero pronto descubre que Ana ya no es la mujer que una vez amó, sino solo un remanente vicioso y rencoroso. Ahora Stephen Gowan vive en el dolor, impulsado por la esperanza de que su amada vuelva a ser la persona que amó."
 POD_patronlore.100.t.560176: "Leyenda del Patrón: Veles"
 POD_patronlore.100.desc.560176: "Antes un soldado montado al servicio del señor local, que en un arrebato de furia orquestó la muerte de un linaje entero después de que su prometida eligiera a un joven señor sobre él. Organizó una fiesta donde todos los invitados perecieron en un incendio. Fue abrazado poco después porque uno de los invitados era un Cainita del que no tenía conocimiento. El plan fue brillante e incluso dispuso carros pesados para impedir que la gente escapara. El costo fue su vida al servicio de su sire. Una sombra manejada con impureza del clan y elevando a su sire. La diablería es una de las cosas que disfruta. Alimenta la oscuridad interior que conserva incluso en la no-vida. A veces lamenta cómo cocinó a su único amor en el fuego destinado solo a su objetivo. Pasa por episodios de comportamiento melancólico. A lo largo de los siglos, se ha vuelto más frío ante la muerte, pero siempre tiene un punto débil por los amantes y los demonios de las sombras."
 POD_patronlore.100.t.560183: "Leyenda del Patrón: Zofia Łupieżca"
 POD_patronlore.100.desc.560183: "Hija de un noble polaco menor. Su padre y madre eran criaturas frías y calculadoras que solo se preocupaban por aumentar su estatus entre la nobleza. Conocida por su belleza e inteligencia, Zofia fue casada joven con un señor vecino para asegurar una alianza para su padre, pero su naturaleza independiente chocaba con sus expectativas y se resentía bajo la atención de su marido. Como resultado, él la maltrataba física y mentalmente, y rápidamente adoptó los peores aspectos de la personalidad de sus padres y la de él. Harta de la situación, sedujo a un joven escudero que logró asesinar al señor, y luego lo traicionó ante las autoridades para ocultar su escape. Sin saberlo, era observada por un observador aún más peligroso.\n\nCapturada y abrazada por el sadista Hedeon Yaroslavich, Zofia tuvo la suerte de sobrevivir a las consecuencias. Su gran interés en el arte de la Vicisitud quizás la salvó de convertirse en el próximo experimento de Hedeon, o ser igual de astuta y brutal desvió su atención lo suficiente para evitar el vínculo sanguíneo. Decidiendo que distanciarse de su sire y sus intrigas era una buena idea, Zofia emprendió su propio camino, decidida a aprender tantas disciplinas como pudiera mediante seducción, intrigas y asesinato puro y simple."
 POD_patronlore.100.t.560184: "Leyenda del Patrón: Umayyah"
 POD_patronlore.100.desc.560184: "Umayyah fue el progenitor del clan Umayyad en Quraysh (La Meca), fundado antes del islam. Fue abrazado en sus veinte años antes del islam, pero se inspiró en los sermones del profeta que escuchó de musulmanes torturados alrededor de Quraysh cuando el profeta comenzó a predicar su mensaje. Abrazó el islam en cuestión de semanas. Desde entonces, ayudó a los musulmanes en su migración desde La Meca, estableció el gobierno sobre Medina y los auxilió en lograr la victoria durante sus batallas iniciales contra los adversarios del islam.\n\nUmayyah apoyó discretamente a su familia, permitiéndoles gobernar el mundo musulmán durante 100 años, y otros 200 años en Al-Ándalus, antes de entrar en un estado de torpor. Asistió directamente a Abd al-Rahman, el futuro primer gobernante de Al-Ándalus, a evadir la furia de los abasíes.\n\nCuando la dinastía de Umayyah perdió el poder en Córdoba, él estaba en torpor. La razón de su torpor voluntario sigue siendo un misterio; sin embargo, algunos Cainitas especulan que podría deberse al abandono por parte de los Umayyads de su herencia beduina y su posterior adopción de un estilo de vida más hedonista.\n\nFue despertado recientemente por la reina Badr 'Espada de Al-Ándalus' durante el siglo XII. Ella solicitó su ayuda en la defensa de Al-Ándalus, y él juró asistirla tras conducir a los dignos de los restos de su familia de regreso a La Meca. Al llegar, decidió realizar la peregrinación (Hajj) tras enterarse de que la severidad del Lamento (Keening) había disminuido. Desde entonces, ha estado gobernando junto al duque Tariq, demostrando ser un activo invaluable en la administración de la ciudad de Al-Ta'if en su nombre. Hasta la fecha, no ha regresado a Al-Ándalus para ayudar a la reina Badr, y hasta que lo haga, la gente lo ha etiquetado como un Quebrantador de Juramentos."
 POD_patronlore.100.t.560186: "Leyenda del Patrón: Sebatian Kragen"
 POD_patronlore.100.desc.560186: "Originario de Asia Central, Sebastian se había aburrido de la no-vida a lo largo de muchas generaciones, al no ver un propósito real en una vida tan larga e interminable.\n\nDurante los turbulentos eventos que condujeron a la Guerra del Patrón a mediados del siglo XIV, conoció a una joven sirvienta judía llamada Tali Berlinger. Los dos se enamoraron secretamente y mantuvieron una relación clandestina durante unos dos años hasta que Sebastian encontró a Tali muerta en sus aposentos, con la sangre drenada. Esto lo envió a una furia ciega, matando a cada sirviente y vampiro que veía. Se volvió contra su propia familia, matando a cada uno de ellos sin importar si eran responsables o no. Solo los sirvientes mortales fueron perdonados, pero quedaron visiblemente y emocionalmente marcados al ver a un gigante vampírico despedazar a sus propios familiares. Tras terminar y que la furia cesara, regresó al cuerpo de Tali y juró matar a todos los no-muertos y luego a sí mismo. Cabalgó fuera de la finca de su familia hacia Dantenkul, exponiéndose y revelando la existencia de vampiros a toda la ciudad. Luego declaró el comienzo de la cruzada traidora y obtuvo el apoyo de campesinos, comerciantes y nobles. Tras reunirse con los Jueces que anunciaron una nueva fe —los Rechazadores de Caín—, Kragen se convirtió en cazador con ellos, jurando su existencia a la matanza de los no-muertos antes de volverse las armas contra sí mismos. Creen que Sebastian es un semidiós enviado por Yahvé para recuperar el reino mortal. Cuando su tarea termine, se entregarán a la luz de Yahvé. O al menos eso creen."
 POD_patronlore.100.t.560187: "Leyenda del Patrón: Sonja 'Little Red' Harald"
 POD_patronlore.100.desc.560187: "Nacida alrededor del 929 en el frío de Nordmark, Sonja pronto se dio cuenta de que su futuro le esperaba en otro lugar. Siempre soñando con aventuras, nunca prestó mucha atención a las tareas domésticas o los números. Pero una espada... era algo que entendía bien. Tras demostrar su valía contra los invasores noruegos y daneses, sirvió como doncella escudo bajo el jarl local. Pero eso no era suficiente. El oro era escaso, y ella, propensa a gastar cada moneda en ropas nuevas, armas o celebraciones pantagruélicas con sus compañeros, no ayudaba. Un día llegaron mensajeros de las tierras de Grecia. El emperador Constantino convocaba a guerreros dispuestos a luchar por él en la llamada 'Guardia Varega', ofreciendo grandes recompensas en oro y gloria. Junto con otros hambrientos de aventura, embarcó, dejándolo todo atrás. La corte bizantina era un mundo completamente nuevo, tan diferente de Nordmark. En las calles de Constantinopla, la ciudad de las Maravillas, descubrió nuevos idiomas, costumbres, placeres y formas de gastar su oro. En el 949 se organizó una gran expedición contra el Emirato de Creta, y cientos de Varegos fueron enviados a la lucha, incluida Sonja. Tras la desastrosa batalla dirigida por su incompetente líder, Constantino Gongyles, solo unos pocos lograron regresar con vida a Constantinopla. Decepcionada y aburrida, cayó en una espiral autodestructiva, bebiendo demasiado y frecuentando demasiados burdeles. Una noche conoció a una mujer, algo diferente en ella, no era del tipo al que estaba acostumbrada. No le ofrecía sus servicios ni buscaba monedas, sino que le hizo una oferta: una nueva vida, juventud eterna, pero más importante, una eternidad para demostrar su valía. Desde que fue abrazada aquella noche, Sonja ha luchado por muchos señores diferentes, en muchos campos de batalla, desde las áridas arenas de Jerusalén hasta el Cáucaso, siempre buscando gloria. Y oro."
 POD_patronlore.100.t.560188: "Leyenda del Patrón: Chough"
 POD_patronlore.100.desc.560188: "Un chamán loco. Se rumorea que usó algún tipo de brujería para forzar a un Tremere a abrazarlo. Nadie conoce su nombre real, pero siempre lleva consigo un arrendajo."
 POD_patronlore.100.t.560190: "Leyenda del Patrón: Benedictus"
 POD_patronlore.100.desc.560190: "El hijo de un guerrero celta desconocido que luchó en los muchos levantamientos contra la invasión romana. Golpeado y magullado, y finalmente abrazado por aquellos a quienes intentaba expulsar de sus tierras. Su venganza vive aún después de todos estos siglos. Un hombre de muchos nombres, actualmente Benedictus, nunca muestra su pasado —después de todo, la mayoría de las personas que conocieron su vida anterior han desaparecido hace mucho. Quizás su sire todavía esté por ahí... en algún lugar."
 POD_patronlore.100.t.560228: "Leyenda del Patrón: Yakub"
 POD_patronlore.100.desc.560228: "Durante toda su vida mortal, Yakub fue ridiculizado por su apariencia. Los miembros de su aldea creían que había sido corrompido por demonios, enviado como una maldición al pueblo. Yakub fue desterrado, obligado a vivir en una choza en las afueras del pueblo. Estaba en el fondo de la jerarquía social; los niños a menudo hacían un juego de ir a su casa para 'Matar a la bestia', prendiendo fuego a su hogar o lanzándole piedras cuando salía a cosechar sus cultivos.\nUna noche, mientras se preparaba para dormir, escuchó un crujido dentro de su casa. Entró en pánico, agarró al intruso y lo golpeó contra la mesa hasta que ya no fue una amenaza. Al acercar el rostro del intruso a la luz de la vela, se horrorizó al ver el rostro de uno de los niños que frecuentemente asaltaban su hogar. Se había convertido en la bestia que creían que era, y en un arrebato de tristeza y furia huyó de su hogar, sabiendo que lo perseguirían. Yakub durmió en lo más profundo del desierto esa noche, pero su sueño fue interrumpido por la mordedura de dientes en su cuerpo. Yakub se sintió débil, pero pronto esa debilidad se convirtió en fuerza. Al levantarse, sintió un poder recién descubierto, sabía entonces que había sido elegido por los Dioses. Ante él yacía otro ser, debilitado y cansado. Yakub canibalizó a la criatura antes de regresar a su aldea y dar el mismo destino a sus antiguos perseguidores. Sabía entonces cuál era su misión: convertirse en un dios; su mutación no era una maldición, sino un don, y crearía una raza maestra como él. Sabiendo su misión, Yakub vagó por el mundo, creando abominaciones para satisfacer sus delirios de divinidad." 
 
 POD_patronlore.100.t.560226: "Leyenda del Patrón: Asterion ‘el Minotauro’"
 POD_patronlore.100.desc.560226: "Asterion ‘el Minotauro’ de Alepo nació en el 765 a.C. en la isla de Creta. Hijo bastardo de Pasífae (esposa del entonces rey Minos). Para mantener en secreto la identidad del padre, ella hizo un trato con un demonio para alterar la apariencia del niño de modo que no fuera reconocible con el padre. Lo que no esperaba era que el niño, Asterion, naciera con cuernos que recordaban a un toro, cumpliendo así la promesa del demonio de que nadie sabría quién era el padre. Asterion fue arrojado al laberinto bajo Knossos, en Creta, donde su única sustancia fueron los humanos enviados abajo para matarlo. No fue hasta 20 años después de su nacimiento que Domitrix Tabitha ‘Señora de los Misterios’ de la Orden de Moloch oyó cuentos del Toro de Minos. Más tarde fabricó los eventos de la muerte de Asterion a manos del héroe griego Teseo y lo abrazó en el año 745 a.C. Como su sire, Tanith Molochim lo ayudó a escapar del laberinto y lo exilió a Alepo, donde sirve fielmente a su rescatadora. Su tiempo fuera de Creta lo ha vuelto vengativo e iracundo contra la humanidad."
 
 POD_patronlore.100.t.560225: "Leyenda del Patrón: Anton Von Lycaon"
 POD_patronlore.100.desc.560225: "Desde joven, Anton Von Lycaon tuvo que ver los efectos de la vasallaje opresivo bajo el sistema feudal, sin esperanza de superar jamás la posición de su familia y teniendo que vivir en la más absoluta pobreza. Aprendió rápidamente que predicar el cambio social era recibir represión violenta y burlas, después de todo, los señores sabían mejor. Antes de resignarse a una vida de servidumbre, llamó la atención de un vampiro anarquista que oyó hablar de su falta de miedo hacia la autoridad y su impulso por mejorar siempre la condición humana, no muy diferente al suyo propio. Fue esa misma falta de respeto por las leyes que no aprobaba lo que hizo que esta sanguijuela abrazara a Anton, antes de ser rápidamente asesinada por el alguacil local por hacerlo sin autorización. Ahora, al despertar en un mundo de oscuridad, sin sire, maldito, Anton no es menos el hombre que era antes: tras pasar su poco tiempo en este nuevo mundo aprendiendo sobre todo tipo de conocimientos sobrenaturales, ha encontrado su nueva vocación: elevar tanto a seres mortales como sobrenaturales, y traer la iluminación a las masas. Los humanos son tan importantes como los sobrenaturales, y quiere llevar su visión a todos, por la fuerza si es necesario, especialmente hacia los vampiros más 'tradicionales' que pueda encontrar en su camino."

 POD_patronlore.100.t.560216: "Leyenda del Patrón: Grigori"
 POD_patronlore.100.desc.560216: "Grigori nació como segundo hijo de un noble georgiano menor, recibiendo educación en teología, medicina e historia, además de aprender griego y latín, para prepararlo para convertirse en monje. Diligente en sus estudios, Grigori siempre fue bastante distante y reclusivo, aunque bien querido por sus compañeros por su compostura. Finalmente llamó la atención del Cappadociano Andreas, quien vio gran potencial en el joven erudito y pronto lo abrazó. Grigori se adaptó rápidamente a su nueva naturaleza vampírica y demostró cumplir las expectativas de su sire, mostrando interés inmediato en la nigromancia. Sin embargo, Andreas no vio al monstruo escondido dentro de su childe, cegado por su amor creciente. En efecto, Grigori solo estaba interesado en una cosa: el sufrimiento ajeno. Su abrazo en el clan de la muerte fue simplemente una oportunidad para expresarse más libremente y disfrutar de la agonía tanto de los muertos como de los vivos. Aun así, mantuvo la apariencia de un childe contento y amoroso, aprendiendo las complejidades de la sociedad vampírica, hasta que un día descubrió el concepto de diablería. Grigori se obsesionó instantáneamente con la idea de atrapar eternamente un alma torturada dentro de sí mismo, y así comenzó a tramar. Poner a Andreas en una posición vulnerable no fue difícil: su sire ya depositaba plena confianza en él, y Grigori conocía bien su pasión, por lo que al tramposo solo le faltó fingir sentimientos correspondidos. Un mes después, la hazaña estaba hecha, y Grigori logró ocultar bien su culpa, saboreando los tormentos de su sire en su mente. Deseando distanciarse del resto de su clan, Grigori ha entrado ahora al servicio de la Brujah Herleva y ha ganado cierta influencia en Arbanon, asegurándose una buena población para torturar."
 
 POD_patronlore.100.t.560214: "Leyenda del Patrón: Garrett"
 POD_patronlore.100.desc.560214: "Una vez marcado en batalla, Garrett, un guerrero de Alemania, se encontró en medio del conflicto en Alemania cuando un vampiro nigromante de Grecia puso sus ojos en él. Al presenciar la carga temeraria de Garrett en medio de la batalla contra tribus germánicas rivales, el príncipe vampiro se sintió compelido a abrazarlo, reconociendo la notable destreza combativa que distinguía a Garrett entre las tribus en guerra.\nDesconocido para el príncipe, las habilidades de Garrett estaban potenciadas por sustancias que agudizaban sus capacidades bélicas. No obstante, el vampiro vio potencial en él como guardaespaldas leal. Tras su transformación, la mente de Garrett derivó hacia la locura, adentrándose profundamente en los reinos de la muerte y la nigromancia, inspirándose en la historia griega antigua, el conocimiento druídico y la comunicación con los difuntos. Las historias mortales sobre druidas y la isla de Hyperion afirman que desaparecieron.\nMientras que la sed de conocimiento de Garrett rivalizaba con su destreza en combate, se desarrolló una relación compleja entre él y su amo vampiro. Aunque cumplía con sus deberes como guardaespaldas, su curiosidad insaciable lo llevaba a explorar los misterios del renacimiento y la venganza, alineándose con deidades como Dionisio, Hécate, Hades y Nye, dioses del inframundo.\nDesinteresado en la política o la diplomacia, el único enfoque de Garrett seguía siendo perfeccionar sus habilidades como guerrero e invocador de muertos, blandiendo una lanza renombrada de sus días en las guerras germánicas. Como guardaespaldas devoto del señor vampiro, Garrett demostraba su formidable fuerza al despachar enemigos con un simple movimiento de brazo, utilizando su lanza como barrera entre él y su amo.\nSin embargo, como dictaba el destino, el señor vampiro encontró la muerte bajo circunstancias misteriosas, dejando a Garrett en una encrucijada. ¿Debería buscar un nuevo amo o aprovechar la oportunidad para trazar su propio camino como maestro de la nigromancia, ejerciendo su poder para establecer una presencia formidable en el mundo? El desenlace de Garrett promete una historia de poder, ambición y la eterna lucha entre servidumbre y autonomía."
 
 POD_patronlore.100.t.560211: "Leyenda del Patrón: Baichangxi"
 POD_patronlore.100.desc.560211: "Baichangxi fue en su día un funcionario encargado de registrar la historia en la Dinastía Han Oriental. Cuando Dong Zhuo incendió Luoyang, fue brutalmente asesinado al intentar proteger la biblioteca.\n\nCuando su alma regresó a las Llanuras Centrales, solo quería hacer algo por el país. Pero la guerra no cesaba, el país del pueblo Han fue destruido, y decenas de millones de personas fueron masacradas o incluso devoradas por bárbaros. Y él no podía hacer nada al respecto.\n\nMás tarde, se retiró en silencio a un bosque de bambú, bebiendo con sus amigos mortales todos los días, como si hubiera olvidado muchas cosas. De hecho, todos a su alrededor saben que tras pasar por estas cosas, su personalidad cambió y se volvió loco."
 
 POD_patronlore.100.t.560229: "Leyenda del Patrón: Xeno Amess"
 POD_patronlore.100.desc.560229: "Un híbrido no bendecido, los restos de una atrocidad forzada, una cáscara caótica.\n\nXeno Amess siempre busca su propio camino para sobrevivir.\n\nNo nacido del pecado de la sangre, ni aceptado por el deber de los Shih, solo la fe verdadera ganada sacrificando sus ojos y siguiendo el camino correcto puede hacerlo un pilar real... ¿O es una burla de un dios?\n\n#glow_color:{1,0,0,1} Solo en la fe correcta podrá encontrar su camino.\n\nUsará cada gota de sangre para difundir la verdad.\n\n#!" 

 POD_patronlore.100.t.793052: "Leyenda de Personaje Dev: Ingrid"
 POD_patronlore.100.desc.793052: "Este personaje fue creado por uno de nuestros desarrolladores y no forma parte oficial del $pod_wod$.\nIngrid no eligió esta vida. Ella la eligió.\nNacida en una pequeña aldea del norte de Suecia, Ingrid fue criada según su propio cuerpo, un estilo de vida que encontraba privadamente detestable, pero representó el papel de hombre que le habían asignado. A lo largo de su vida, a menudo encontró que mil cosas salían mal continuamente, como si la vida misma la estuviera poniendo a prueba cada vez más mientras las cosas se volvían más infernales. Y luego llegó el día en que su aldea se volvió contra ella y la expulsó, sus pensamientos privados garabateados en los árboles de algún modo expuestos, arrojándola al desierto. Pero se negó a morir, e intentó vivir. Esto atrajo la atención del arquitecto de su miseria, quien intentó abrazar a su proyecto favorito tras haber pasado los últimos 20 años haciendo su vida un infierno. Pero mientras la última gota de sangre la abandonaba, un destello rojo cubrió a su asesino, y el sabor de un hierro increíblemente delicioso rozó sus labios, negando la maldición de su asesino y otorgándole los dones de Freyja en su lugar.\nEso fue hace mucho tiempo. Ingrid es fiel al propósito de su sire incluso ahora, acechando la noche en busca de otras mujeres que necesiten ayuda. Si debe ser una salvadora bañada en sangre, que así sea. Es una hija de Adisa, al fin y al cabo." 

 POD_patronlore.100.t.560235: "Leyenda del Patrón: Jorav" 
 POD_patronlore.100.desc.560235: "Nacido albino, el pálido Jorav buscó refugio del mundo en los estudios universitarios. Una noche, el estudiante recluso observó a uno de sus profesores alimentándose de uno de sus compañeros. El erudito no-muerto se volvió contra él y lo mató. Por suerte, Jorav resucitaría como vampiro. Fue accidentalmente convertido por su sire, un profesor, tras verlo alimentarse de un compañero."

 POD_patronlore.100.t.560237: "Leyenda del Patrón: Mihai" 
 POD_patronlore.100.desc.560237: "Un campesino rumano que huyó al sur como consecuencia de las incursiones cumanas, hacia territorio controlado por Bizancio. Se alfabetizó mientras servía a un noble bizantino y fue abrazado debido a su sed de conocimiento del mundo antiguo y su deseo ilimitado de adquirir más erudición estudiando literatura y filosofía griegas antiguas.\nSu sed de conocimiento se debe al sentimiento de impotencia que experimentó cuando los cumanos quemaron su aldea, pero no alberga ningún odio hacia ellos, viéndolos meramente como un síntoma de un mundo roto, que necesita ser enderezado por un rey filósofo dispuesto a alcanzar el poder absoluto para remodelar el mundo en algo cuerdo.\nSu principal virtud es su sed de conocimiento y la velocidad con la que absorbe información, pero no es un gran táctico y no sabe relacionarse con los demás.\nEs un hombre callado que guarda bien los secretos, por lo que es algo hábil en las intrigas, pero aún no ha participado en ninguna conspiración.\nFísicamente, es bastante débil, ya que se centró únicamente en adquirir conocimiento en detrimento de todo lo demás.\nNo se enfada fácilmente y no guarda rencor, pero tiende a sobreestimar su importancia, preocupándose primero por su bienestar antes que por el de los demás, aunque no es despiadado ni causa daño innecesario ni traiciona a quienes le rodean, a menos que sea un último recurso absoluto. Básicamente, es una persona pragmática y amoral, que reconoce la necesidad de cooperar con otros, pero que en última instancia se preocupa primero por sí misma y por sus objetivos.\nEs muy nuevo en el mundo Cainita, pero está muy enfocado en aprender todo lo que pueda y aumentar su poder, mientras navega por la telaraña que es el Voivodato."

 POD_patronlore.100.t.560238: "Leyenda del Patrón: Zanthana" 
 POD_patronlore.100.desc.560238: "Zanthana fue abrazada cuando los primeros saqueadores nórdicos llegaron a la Isla de Man. Creyó que eran guerreros del fin de los días —Ragnarok—. La maldición Malkavian refuerza esta creencia." 
 
 POD_patronlore.100.t.560239: "Leyenda del Patrón: Ingridr" 
 POD_patronlore.100.desc.560239: "En vida, Ingridr fue enviada a la guardia varega, pero se negó a servir como soldado. En cambio, empezó a escalar en las filas de intendentes. Abrazada en los Tzimisce, ahora busca la perfección."  
 
 POD_patronlore.100.t.560241: "Leyenda del Patrón: Oraz" 
 POD_patronlore.100.desc.560241: "Oraz era una persona violenta cuando aún era humano. Había sido rechazado por su familia durante su juventud. Desde entonces, nunca ha dejado de hacer daño a otras personas de diversas maneras: robando, secuestrando, asaltando y asesinando.\nEn algún momento, fue mordido por un vampiro en Sibir. Intentó robar a la persona equivocada tarde en la noche en las calles, se enfrentó a su objetivo, que resultó ser el vampiro que más tarde lo torturaría toda una noche antes de convertirlo finalmente en uno de los no-muertos.\nOraz quedó marcado física y mentalmente. Lo primero que hizo como vampiro fue masacrar a toda su familia mortal.\nOraz se deleita en la diablería, intentando regularmente robar las almas de los Cainitas. Y nunca sentirá que su hambre esté plenamente saciada."
 
 POD_patronlore.100.t.560242: "Leyenda del Patrón: Jordaine Diale" 
 POD_patronlore.100.desc.560242: "Jordaine Diale nació el 17 de enero del año 100 en la familia Corvinus, un linaje vinculado a hombres lobo pero carente de su don transformador. Como mortal, Jordaine destacó en diplomacia, guerra y combate, impulsado por los principios inquebrantables de la fe Get de Fenris. Mediante devoción y perseverancia, completó los ritos sagrados de la dinastía, desbloqueando la gama completa de ventajas dinásticas de los Get de Fenris, otorgándole una resistencia incomparable, destreza en combate y una voluntad indómita.\nEn el año 140, durante los últimos años del auge del Imperio Romano, Jordaine se vio envuelto en un conflicto que casi le cuesta la vida. Sus fuerzas fueron devastadas, y yacía moribundo en el campo de batalla, rodeado de caídos. Fue allí, al borde de la muerte, que Julian di Piero, un anciano Ventrue de quinta generación, se le acercó. Julian había estado activo en las intrigas políticas del antiguo Imperio Romano, observando el reino mortal con una mezcla de sutileza y fuerza. Vio en Jordaine no solo fuerza, sino el potencial para el poder.\nImpresionado por la voluntad inquebrantable y la ambición de Jordaine, Julian decidió abrazarlo, ofreciéndole la oportunidad de trascender la mortalidad. Con la muerte llamando a su puerta, Jordaine aceptó. Sin embargo, el abrazo no salió como Julian había planeado. En lugar de convertirse en parte del linaje Ventrue, Jordaine emergió como un Caitiff, desligado de cualquier clan, despojado de la herencia noble que Julian pretendía transmitirle.\nAbandonado por Julian, quien vio el fracaso como una mancha en su legado, Jordaine fue dejado a vagar solo por los rincones oscuros del mundo. A pesar de la traición, sus instintos de supervivencia —forjados por su herencia Fenrir e impulsados por su feroz ambición— le permitieron superar las adversidades. Ahora, como vampiro de sexta generación, Jordaine ve su naturaleza Caitiff como tanto una maldición como una bendición: libertad de la lealtad clan, pero un recordatorio constante de su estatus de marginado.\nImpulsado por su herencia Garou latente y su deseo de forjar su propio destino, Jordaine busca el poder mediante la diablería, decidido a tallar un legado que haga que su sire se arrepienta de haberlo abandonado. A los 1.064 años en 1204, Jordaine sigue siendo una fuerza de la naturaleza, impulsado por su voluntad inquebrantable de demostrar su valía tanto a la sociedad Cainita como al mundo en general."
 
 POD_patronlore.100.t.560248: "Leyenda del Patrón: Yajie" 
 POD_patronlore.100.desc.560248: "Solía ser una poderosa vampira local, pero fue petrificada en un accidente y perdió toda movilidad. Espera a un personaje que la salvará. Antes era una vampira poderosa en la zona, pero debido a un accidente fue forzada a entrar en torpor. ¿Será despertada?" 
 POD_patronlore.100.t.560244: "Leyenda del Patrón: Sancho" 
 POD_patronlore.100.desc.560244: "El Childe de Don Quijote, Sancho fue en su día una chica vacía cuya vida fue salvada por su sire, quien la abrazó por capricho tras encontrarla intentando quitarse la vida quemando su casa. El abrazo y su inclusión en la familia de Don, ocasionalmente llamada Familia Manchega, le dio sentido a su vida. Don, Sancho y los otros Cainitas que engendró vivían en un gran castillo, muy aislados de la sociedad humana. Así continuó hasta la llegada de un caballero humano que dueleó a Don Quijote durante días. El duelo terminó sin un vencedor claro, pero el caballero humano entabló amistad con el Cainita y a menudo lo visitaba. En sus visitas, el humano le contaba a Don Quijote historias de héroes y salvadores que desafiaban las probabilidades para hacer lo que creían correcto y emprender grandes aventuras. Mientras Sancho era apática a tales relatos, Don Quijote se absorbió en ellos y eventualmente inspiró su sueño: la Coexistencia entre Cainitas y Mortales, un sueño aún más radical que el de los idealistas Brujah. Pues verán, Don Quijote era extrañamente resistente a la Bestia, algo que lo llevó a malinterpretar su naturaleza. Prohibió a sus Cainitas beber sangre humana y les ordenó saciar su sed por medios menores. Mientras Don Quijote partía a emprender aventuras como las que le contaba el caballero, dejó a Sancho y a los demás atrás. Sancho era la administradora del dominio de Don, gestionándolo en su ausencia. Ella y los demás sufrieron por el sueño de Don, hasta que un día... su lealtad se quebró.\nEn una conspiración ideada por sus compañeros cainitas, Don sería capturado y empalado hasta que 'recuperara la cordura', diciéndole abiertamente que ya no sufrirían más bajo los delirios de su sueño. Cuando Sancho oyó de esta trama... dio su consentimiento, ella también había sufrido por ello y sintió que era hora de que su sire despertara de sus delirios.\nY así... la trama avanzó, los Cainitas de Don lo rodearon y lo empalaron, con lágrimas en los ojos mientras lo hacían. Don no luchó, para sorpresa de Sancho y de todos, no levantó un dedo para exterminarlos... porque realmente los amaba.\nLa trama saldría mal, y Don perecería a manos de Sancho, quien carga con esa culpa hasta hoy. Ahora gobernante de nombre y título, Sancho jura que nunca más permitirá que su familia sufra y les permitirá vivir como deseen, a menudo a expensas de los Mortales."
 
 POD_patronlore.100.t.560234: "Leyenda del Patrón: Ilya" 
 POD_patronlore.100.desc.560234: "¿Cómo es que es tan difícil encontrar una disposición al cambio sin importar la especie? Vivos, muertos —sobrenaturales—. Inocentes. A diferencia de muchos tiranos egomaníacos, Ilya es consciente de que un gobierno absolutamente centralizado en una sola figura se sostiene gracias al apoyo y la adoración de una legión de aduladores talentosos con deseos y ambiciones tan cambiantes como los suyos propios. Ese tipo de afecto solo puede formarse mediante un toque personal, una conexión íntima, el conocimiento de que Ilya participó en tu vida y te dio la fuerza que te faltaba para salvarte a ti mismo, para mejorar y ser mejor. Ella realmente se preocupa. Y por eso, tú harías cualquier cosa por ella.\n\nLa apatía es la muerte de los débiles, como le gusta decir."
 
 POD_patronlore.100.t.560251: "Leyenda del Patrón: Léandre Valargent"
 POD_patronlore.100.desc.560251: "Nacido en una familia de la pequeña nobleza francesa, Léandre vivió en comodidad y expectativa. Rico, pero no poderoso, su familia vivía lo suficientemente alto en la escalera social como para preocuparse profundamente por las apariencias.\nLéandre, sin embargo, se preocupaba más por sus propios deseos que por la reputación familiar. Era un romántico, un lector, un dandi y una rareza. Su abrazo llegó a los 21 años, de la mano de un Nagaraja visitante de la India, quien vio potencial en la agudeza y crueldad sutil de Léandre. Fue dejado solo en Francia sin guía. Así que improvisó.\nLéandre no oculta lo que es. Es Nagaraja, una rareza en el mejor de los casos para los demás Cainitas, un peligro que eliminar en el peor. Pero su manera —elegante, poética y casi gentil— lo hace más aceptable para los Toreador franceses, quienes ahora lo toleran como un primo extraño pero fascinante. Algunos dicen que tiene el corazón de un Toreador, incluso si prefiere comer corazones en lugar de lucirlos en la manga.\nRecientemente, abrió La Salle du Goût —un salón privado en su finca ancestral donde los Cainitas más curiosos se reúnen para satisfacer sus apetitos. Allí, Léandre organiza noches de consumo ritual, invitando a los huéspedes a deleitarse no solo con mortales cuidadosamente preparados, sino también con Cainitas capturados. Es parte cena, parte espectáculo. El ambiente es siempre refinado y la atmósfera, de buen gusto. Las invitaciones son raras y solo se extienden a quienes tienen el paladar adecuado y la discreción necesaria.\n\nDestino futuro:\n\nLéandre se obsesionará con un cierto cainita en el futuro, viéndolo como la comida perfecta. Trágicamente, escapará de sus garras antes de que Léandre pueda probarlo. Esta pérdida lo llevará a una espiral descendente, y pronto se convertirá en un recluso en su mansión ancestral, apenas aferrándose a la cordura. Solo sus fieles sirvientes lo mantendrán alejado de la Muerte Final, aunque en un estado demacrado y gravemente deprimido."
 
 
 POD_patronlore.100.t.560252: "Leyenda del Patrón: Rhys ap Arthuis"
 POD_patronlore.100.desc.560252: "Nacido de una hija de granjero y un comerciante nórdico en Ynys Môn. Rhys se hizo a la mar tan pronto como tuvo edad suficiente, viajando con la tripulación de su padre por gran parte de Europa. Adquirió habilidades con el dinero y con la gente. Se casó a los diecinueve años con una campesina francesa, a quien rara vez veía.\n\nSus aventuras terminaron a los 24 años, mientras dormía en puerto tras un largo viaje, fue atacado, drenado de sangre y renacido como un monstruo."
 
 POD_patronlore.100.t.560253: "Leyenda del Patrón: Viviane Iwindu"
 POD_patronlore.100.desc.560253: "Nacida en los Montes Cárpatos, fue criada por su madre y su padre, Dyonas Inwundu, y su madre Trene. Durante sus años jóvenes, tenía pasión por las plantas y los animales en su tiempo libre, y debido a esa pasión aprendió el arte de la herbolaria junto con sus estudios sobre la historia de las tierras y su gente.\n\nMientras crecía como persona y como herbolaria, mejoraba su talento entendiendo cómo sobrevivir en la naturaleza, para disgusto de su padre, quien prefería que se enfocara en otros caminos laborales. A lo largo de su vida llegó a los 19 años; durante ese tiempo, trabajando junto a sus padres, su madre falleció por enfermedad y su padre se marchó poco después, dejándola sola. Entonces abrió una tienda de herbolaria poco después como forma de generar ingresos.\n\nMientras poseía esta tienda durante un año, fue acusada de bruja debido a su género y profesión, sumado a que uno de sus pacientes no se recuperó y murió bajo sus cuidados, lo que llevó a que la lincharan poco después de que comenzaran las acusaciones. Con un chasquido de la cuerda y otro de su cuello, dejándolo desgastado, sangrante y destrozado, cayó bajo el cadalso para huir hacia los bosques cercanos.\n\nHuyó tan lejos como pudo; su cuerpo exhausto mientras se impulsaba lo más lejos posible en sus últimos alientos, mientras su herida palpitaba de dolor. Calculó que no estaba lejos de la turba que imaginaba lo perseguiría, aunque en su pánico no trató su herida, que de algún modo milagrosamente sobrevivió, aunque fuera de forma efímera, si es que no era intratable desde el principio. En su huida frenética, colapsó cuando su adrenalina se agotó, quedando inmóvil en el suelo, esperando que la muerte lo reclamara.\n\nPasaron minutos, minutos que se sintieron como horas. Finalmente obtuvo alivio al ser observada por un individuo que le otorgó alivio de su dolor y un renacimiento para vivir una nueva no-vida."