l_spanish:
 POD_sorcery_legendary_studying.1.t: "Avance Hechicero"
 POD_sorcery_legendary_studying.1.desc: "Aunque la mayoría de las sendas de la hechicería lineal se comprenden bien desde el principio de los tiempos, siempre ha habido rumores de que es posible ir más allá. La piedra filosofal, ver el futuro, la verdadera inmortalidad... hazañas soñadas por generaciones de hechiceros pero rara vez (¿alguna vez?) logradas.\n\nAlgunos piensan que solo la verdadera magia puede lograr tales hechizos que cambian la realidad, pero tú estás a punto de demostrar que se equivocan. Es hora de unirse al selecto círculo de los Archimaestros hechiceros."
 POD_sorcery_legendary_studying.1.a: "Lo he logrado."
