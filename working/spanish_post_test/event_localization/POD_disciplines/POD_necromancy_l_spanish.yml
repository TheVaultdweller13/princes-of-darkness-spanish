l_spanish:
 POD_find_wraith.100.t: "Algo extraño en el vecindario"
 POD_find_wraith.100.desc: "Buscando por la zona, encuentras un espíritu solitario que sería vulnerable a tus maquinaciones."
 POD_find_wraith.100.option.a: "Ahora, ¿qué haré contigo?"
 
 POD_curse_of_the_maelstrom.100.t: "Maldición del Maelstrom"
 POD_curse_of_the_maelstrom.100.desc: "Con solo una inhalación profunda y una exhalación forzada puedes convocar Espectros, fantasmas terribles que adoran al [UmbraGlossary('oblivion')], sobre tu enemigo; y aunque para un observador mundano no habrá pruebas de que haya sucedido nada, incluso los bebés en su cuna sentirán que algo terrible se avecina."
 POD_curse_of_the_maelstrom.100.option.a: "¡Que vuelen los sirvientes del Olvido!"
 POD_curse_of_the_maelstrom.100.option.a.tt: "Invocas Espectros sobre el condado de la capital de [target.GetFirstName]"
 POD_curse_of_the_maelstrom.100.option.b: "Aún no es el momento adecuado"
 POD_curse_of_the_maelstrom.100.option.b.tt: "Abandonas tus planes de maldecir su reino. Por ahora..."
 
 POD_wails_and_whispers.100.t: "Lamentos y susurros"
 POD_wails_and_whispers.100.desc: "A medida que la comprensión de la nigromante se profundiza, explora la vacilante barrera entre la vida y la muerte. Cuando grita como una banshee, puede atraer a un alma hacia su fin, aumentando la probabilidad de una herida fatal."
 POD_wails_and_whispers.100.option.a: "Déjame susurrarte al oído"
 POD_wails_and_whispers.100.option.b: "Tal vez debería reconsiderarlo"
 POD_wails_and_whispers.100.option.b.tt: "No es el momento adecuado. Pero puede que lo sea pronto..."
 
 POD_intimations_of_mortality.100.t: "Insinuaciones de mortalidad"
 POD_intimations_of_mortality.100.desc: "Insinuaciones de mortalidad inflige los aspectos más desagradables e irritantes de la mortalidad a un vampiro. Estas experiencias se extraen directamente de la memoria del usuario de la $pod_discipline$ e incluyen vivencias como el hambre y la sed mortales, la necesidad de eliminar desechos, una agudeza sensorial deficiente y una vulnerabilidad al trauma físico que incluso un vampiro neonato podría ignorar."
 POD_intimations_of_mortality.100.option.a: "[recipient.GetFirstName] necesita un recordatorio de cómo se siente la mortalidad"
 POD_intimations_of_mortality.100.option.a.tt: "Veamos cómo maneja esto"
 POD_intimations_of_mortality.100.option.b: "Tal vez debería reconsiderarlo"
 POD_intimations_of_mortality.100.option.b.tt: "Tal vez no se merezca esto. Al menos no ahora mismo..."
 
 POD_gift_of_melancholia.100.t: "Don de la melancolía"
 POD_gift_of_melancholia.100.desc: "Este poder inflige una virulenta enfermedad debilitante tanto a mortales como a cainitas. Ambos se ven afectados por una dolencia que causa mareos, debilidad, malestar y náuseas. La enfermedad es altamente contagiosa entre los mortales, que pueden propagársela entre sí por mera proximidad.\n\nUna vez que la enfermedad ha empezado a propagarse, no hay forma de detenerla debido a su naturaleza virulenta, lo que significa que la única opción es dejar que se agote por sí sola. Tampoco tienes forma de controlar cómo se propaga la enfermedad tras la primera infección, por lo que si no tienes cuidado, tus propias tierras podrían sufrir el mismo destino."
 POD_gift_of_melancholia.100.option.a: "Vengo portando regalos terribles"
 POD_gift_of_melancholia.100.option.b: "Tal vez debería reconsiderarlo"
 POD_gift_of_melancholia.100.option.b.tt: "Abandonas tus planes de propagar la enfermedad en su reino. Por ahora..."
 
 POD_witchs_fruit.100.t: "Fruta de la bruja"
 POD_witchs_fruit.100.desc: "Cada planta depende de la muerte para crecer. Las cosas en descomposición enriquecen el suelo, y los árboles, enredaderas y hierbas beben ecos necróticos junto con nutrientes vitales. Una nigromante puede despertar esta aura de muerte exponiendo sus frutos a su sangre. Despierta y concentra sus trazas de energías necróticas para que cualquier mortal que los consuma se vea desorientado por visiones retorcidas de fantasmas y edificios caídos hace tiempo mientras esté bajo su influencia."
 POD_witchs_fruit.100.option.a: "Es hora de que [recipient.GetFirstName] pruebe el fruto prohibido"
 POD_witchs_fruit.100.option.a.tt: "Tal vez una bonita manzana roja..."
 POD_witchs_fruit.100.option.b: "Tal vez debería reconsiderarlo"
 POD_witchs_fruit.100.option.b.tt: "Los frutos aún no están maduros..."
 
 POD_song_of_the_dead.100.t: "Canto de los muertos"
 POD_song_of_the_dead.100.desc: "El vampiro entona cánticos, tejiendo palabras inaudibles en la canción e infundiendo una fascinación malsana por la muerte en su oyente. Los individuos afectados se ven atraídos por lugares solitarios y poco propicios mientras se hunden en la depresión; la mortalidad les preocupa como nunca antes y ven malos presagios por todas partes. Si se ven afectados por este poder durante un periodo prolongado, los mortales enloquecen y se vuelven suicidas, mientras que los vampiros acaban sucumbiendo al letargo."
 POD_song_of_the_dead.100.option.a: "Te cantaré la canción de mi pueblo"
 POD_song_of_the_dead.100.option.b: "Tal vez debería reconsiderarlo"
 POD_song_of_the_dead.100.option.b.tt: "Habrá otras oportunidades para cantar juntos."
 
 POD_necromancy.200.t: "Robando cráneos y almas"
 POD_necromancy.200.desc: "Cuando se practicó el Degulo por primera vez, sus creadores nigromantes lo celebraron en un largo y sombrío ensueño. En estas noches, la eficacia del Degulo se sopesa frente a los peligros que presenta. Mientras que la Posesión Demoníaca se centra en el arte de trasponer un espíritu difunto al caparazón vacío de un cadáver, el Degulo es el método por el cual un nigromante consume un fragmento de alma y lo retiene para siempre como parte de sí mismo. El proceso por el cual un nigromante devora un espíritu requiere un gran sacrificio por parte del practicante, que debe entregar una parte de sí mismo para permitir que el muerto se instale. Se sabe que algunos nigromantes despojan a sus cuerpos de la fragilidad para asumir las almas de poderosos guerreros, mientras que otros pierden el conocimiento de sus propias lenguas para dejar espacio a dialectos antiguos y arcanos. En el extremo, algunos Heraldos se despojan de sus poderes otorgados por el clan a cambio de Disciplinas poseídas por cainitas fallecidos.\nPrimero elegirás una $pod_discipline$ que no tengas del cráneo de la víctima..."
 POD_necromancy.201.desc: "...luego pagas el precio."
 
