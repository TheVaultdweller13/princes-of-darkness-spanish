l_spanish:

 POD_drain_the_life.001.t: "Drenar la vida"
 POD_drain_the_life.001.desc: "Con tu nivel actual de Obtenebración puedes cubrir la capital de [target.GetFirstName] en oscuridad. Pero tal poder tiene un coste."
 POD_drain_the_life.001.desc.ahrimans_demesne: "Eres el maestro de la oscuridad. Con tu gran maestría del Abismo, puedes cubrir todo el reino que controla [target.GetFirstName] en una oscuridad que devora todo lo que toca. Tal poder tiene un coste, y [target.GetFirstName] no estará complacido."
 POD_drain_the_life.001.option.a: "¡Con mi inmenso control sobre el Abismo, cubriré su reino de oscuridad!"
 POD_drain_the_life.001.option.a.tt: "Intentarás lanzar el poder Drenar la vida sobre el reino de [target.GetFirstName]; este poder afectará a cada condado sobre el que tenga control, incluso las tierras que controlan sus vasallos"
 POD_drain_the_life.001.option.a.desc: "Desafío oscuro"
 POD_drain_the_life.001.option.a.success: "Usas con éxito el poder Drenar la vida"
 POD_drain_the_life.001.option.a.tt.attacker_wins: "El reino de [target.GetFirstName] se sumerge en una oscuridad que devora todo lo que toca"
 POD_drain_the_life.001.option.a.failure: "No logras usar el poder Drenar la vida"
 POD_drain_the_life.001.option.a.tt.attacker_lost: "Fracasas"
 POD_drain_the_life.001.option.b: "Pronto, la capital de [target.GetFirstName] quedará envuelta en tinieblas"
 POD_drain_the_life.001.option.b.tt: "Lanzas el poder Drenar la vida sobre el condado de la capital de [target.GetFirstName]"
 POD_drain_the_life.001.option.c: "No es el momento adecuado"
 POD_drain_the_life.001.option.c.tt: "Dejarás de intentar lanzar Drenar la vida sobre el dominio de [target.GetFirstName]"

 POD_whole_realm_was_drained_toast: "[attacker.GetFirstName] ha lanzado una oscuridad horrible sobre tu reino"
 POD_drained_enemy_realm_toast: "Has lanzado con éxito una oscuridad horrible sobre el reino de [target.GetFirstName]"
 POD_drain_the_life_failed_toast: "No pudiste lanzar una oscuridad horrible sobre el reino de [target.GetFirstName]"
 POD_capital_county_drained_toast: "[attacker.GetFirstName] ha lanzado una oscuridad horrible sobre tu capital"


 POD_shadow_twin.001.t: "Gemelo de sombra"
 POD_shadow_twin.001.desc: "Con tu maestría en Obtenebración puedes intentar animar tu propia sombra y convertirla en un duplicado de ti mismo. Tal criatura será de gran ayuda en la lucha eterna de la Jyhad, pero tales poderes tienen un coste."
 POD_shadow_twin.001.option.a: "Yo ordeno a las sombras, es hora de que obedezcan"
 POD_shadow_twin.001.option.a.tt: "Intentarás crear un Gemelo de sombra"
 POD_shadow_twin.001.option.a.desc: "Una lucha con tu oscuridad interior"
 POD_shadow_twin.001.option.a.tt.success: "Se ha creado con éxito un Gemelo de sombra"
 POD_shadow_twin.001.option.a.tt.failure: "No logras crear un Gemelo de sombra"
 POD_shadow_twin.001.option.b: "Ahora no es el momento adecuado"
 POD_shadow_twin.001.option.b.tt: "Abandonarás tu idea de crear un Gemelo de sombra"

 POD_shadow_twin.002.t: "Gemelo de sombra II"
 POD_shadow_twin.002.desc: "Con tu maestría en Obtenebración logras crear con éxito un Gemelo de sombra, ahora es el momento de dar órdenes."
 POD_shadow_twin.002.option.a: "Incluso las sombras me obedecen"
 POD_shadow_twin.002.option.a.tt: "Se ha creado con éxito un Gemelo de sombra."

 POD_shadow_twin.003.t: "Gemelo de sombra II"
 POD_shadow_twin.003.desc: "Incluso tu maestría en Obtenebración no es suficiente para crear un Gemelo de sombra... por ahora."
 POD_shadow_twin.003.option.a: "Aún no estoy preparado para comandar sombras"
 POD_shadow_twin.003.option.a.tt: "No has logrado crear un Gemelo de sombra"

 POD_shadow_twin.death_management.t: "Perdiendo una parte de ti mismo"
 POD_shadow_twin.death_management.desc: "Han llegado noticias graves, tu Gemelo de sombra, una parte de tu propia alma, ha muerto. Puedes sentir un vacío terrible en tu interior."
 POD_shadow_twin.death_management.option.a: "Otro más que muerde el polvo"
 POD_shadow_twin.death_management.option.a.tt: "Tu Gemelo de sombra ha muerto"

 POD_commune_with_the_abyss.001.t: "Comulgar con el Abismo"
 POD_commune_with_the_abyss.001.desc: "El Abismo escucha. Es un lugar de secretos, y dicen que oye cada susurro jamás pronunciado. Con este poder, te imbuyes de la sombra tan completamente que vuestras mentes se vuelven una. Una vez unidos, puedes hacer una pregunta a la oscuridad, que por una vez no puede ocultar la respuesta.\nEsta respuesta será verdadera y completa, y no estará oculta en un acertijo. El Abismo solo oculta la verdad; no la confunde ni la guarda celosamente."
 POD_commune_with_the_abyss.001.a: "\"¿He alcanzado todo mi potencial?\""
 POD_commune_with_the_abyss.001.a.tt: "Recibirás otro evento para elegir qué ventaja de [lifestyle|E] mundano obtendrás."
 POD_commune_with_the_abyss.001.b: "\"¿Hacia dónde se dirige la humanidad?\""
 POD_commune_with_the_abyss.001.c: "\"¿Qué le enseñó Lilith a Caín?\""
 POD_commune_with_the_abyss.001.c.tt: "Recibirás otro evento para elegir qué ventaja de [lifestyle|E] vampírico obtendrás."
 POD_commune_with_the_abyss.001.d: "\"¿Qué me ocultan mis cortesanos?\""
 POD_commune_with_the_abyss.001.d.tt: "Descubrirás todos los secretos e intrigas de tu corte."

 POD_commune_with_the_abyss.002.t: "Comulgar con el Abismo - Conocimiento"
 POD_commune_with_the_abyss.002.desc: "\"¿Puedo mejorar todavía?\" recibe una respuesta positiva, inundando pronto vuestras mentes con diversos campos en los que aún podrías hacerlo mejor."
 POD_commune_with_the_abyss.002.a: "Carisma y presencia."
 POD_commune_with_the_abyss.002.b: "Estrategia y liderazgo."
 POD_commune_with_the_abyss.002.c: "Gobierno e influencia."
 POD_commune_with_the_abyss.002.d: "Engaño y mentiras."
 POD_commune_with_the_abyss.002.e: "Conocimiento y sabiduría."

 POD_commune_with_the_abyss.003.t: "Comulgar con el Abismo - Conocimiento místico"
 POD_commune_with_the_abyss.003.desc: "\"¿Qué le enseñó Lilith a Caín?\". Muchas cosas, resulta, ya que ella fue quien ayudó a Caín a canalizar el poder de su sangre en las disciplinas que todavía usan hoy los vampiros. En la miríada de imágenes que el Abismo conjuró como respuesta, algunas se quedan grabadas mejor que otras en tu mente y te ayudan a alcanzar un nuevo grado de comprensión."
 POD_commune_with_the_abyss.003.a: "Los primeros pasos hacia el Animalismo."
 POD_commune_with_the_abyss.003.b: "La ira de Caín y su poderosa rabia."
 POD_commune_with_the_abyss.003.c: "Las noches que Lilith dejó a Caín para que reflexionara."
 POD_commune_with_the_abyss.003.d: "El poder de las emociones de Caín."
 POD_commune_with_the_abyss.003.e: "La sangre siempre fue la clave."