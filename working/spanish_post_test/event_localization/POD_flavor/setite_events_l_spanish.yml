l_spanish:

 setite_faith_corruption_decision: "Predicar la palabra de Set"
 setite_faith_corruption_decision_tooltip: "Set siempre puede usar más seguidores fieles."
 setite_faith_corruption_decision_desc: "El culto de Set es conocido como una fuerza insidiosa capaz de infiltrarse en cualquier religión y retorcer su propósito hacia la gloria de Set."
 setite_faith_corruption_decision_effect_tooltip: "La doctrina especial Pilares de Set se añadirá a la religión, haciendo que sus practicantes sean justos con (y hacia) los diversos otros cultos setitas."
 setite_faith_corruption_decision_confirm: "¡Alabemos a Set juntos!"
 setite_corrupt_sites: "Necesitas controlar 3 o más lugares sagrados de una religión vampírica que no tenga ya la doctrina especial Pilares de Set."
 
 podsetite.1.t: "El Clan de la Fe"
 podsetite.1.desc: "Los Seguidores de Set son tanto una religión como un $pod_clan$ propiamente dicho. Ven a cada vampiro que adora a Set como parte de su comunidad, aunque los que descienden directamente de él siguen siendo los más favorecidos.\nLos setitas han perfeccionado el arte de infiltrarse y corromper (o \"liberar\") otras religiones y cultos, desvelándoles lentamente los misterios de Set antes de integrarlos plenamente en el redil. Esta es, con mucho, su mayor arma, y muchos aspirantes a conquistadores de Egipto se vieron acogidos y luego esclavizados por el culto en lugar de resistirse directamente a ellos.\nEn esta era de Cruzadas y fervor religioso, los setitas miran al extranjero a todas esas pobres almas que desesperan por la aprobación de sus dioses heréticos. Y ven oportunidades en abundancia."
 podsetite.1.a: "Bienvenidos al Jardín de la Serpiente."
 setite_intro_tt: "Mientras mantengas una fe setita, tendrás acceso a una decisión para sincretizar con el Culto de Set cualquier religión de la que controles tres o más lugares sagrados."
 
 podsetite.2.t: "El Abrazo de la Serpiente"
 podsetite.2.desc: "Empieza poco a poco. La insinuación de un profundo misterio sugerido a algunas figuras importantes de la fe elegida, el fomento de la decadencia y la autogratificación, la lenta difusión de ideas más \"liberadoras\" entre los practicantes.\nLuego cae en cascada. La revelación de que todos los misterios (incluidos los suyos propios) conducen a Set. La aceptación de que el mundo es una prisión construida por Ra y sus Eones, y que todo lo que creían verdadero era una mentira. Luego, finalmente, el celo del nuevo converso, ansioso por mostrar la verdad a sus hermanos.\nY antes de que te des cuenta, toda esta fe no es más que una fachada útil para el culto de Set. Como debe ser todo, hasta la gran noche de la liberación."
 
 special_doctrine_set_corrupted_kindred_name: "Culto de Set"
 special_doctrine_set_corrupted_kindred_desc: "Esta fe, aunque mantiene la fachada de sus primeros días, ha sido profundamente infiltrada por el Culto de Set."
 corrupted_set_name: "Culto de Set"
 doctrine_parameter_hostility_override_special_doctrine_set_corrupted_kindred: "Otras [faiths|E] de vástagos que tengan la [doctrine|E] [GetFaithDoctrine('special_doctrine_set_corrupted_kindred').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_hostile_tooltippable$"