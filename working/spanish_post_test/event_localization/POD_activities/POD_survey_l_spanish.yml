l_spanish:

 survey_capital_decision: "Inspeccionar tu capital"
 survey_capital_decision_tooltip: "Viajarás por tu principado"
 survey_capital_decision_opening_desc: "A veces, es necesario hacer las cosas uno mismo. ¿Quién puede confiar realmente en estos consejeros aduladores?"
 survey_capital_decision_confirm: "Recorramos mis tierras"
 survey_capital_decision_desc_shy: "Como eres perezoso, esta actividad puede resultar estresante"
 survey_capital_decision_effect_tooltip: "Esto te dará oportunidades para mejorar tu capital"
 
 strict_control_modifier: "Control estricto"
 strict_control_modifier_desc: "Estás supervisando todo lo que ocurre en tu dominio, lo que te da mayores oportunidades de influencia, pero también un mayor rechazo por parte de los mortales."
 lax_control_modifier: "Control laxo"
 lax_control_modifier_desc: "Estás dejando a los mortales mayormente libres para hacer lo que quieran aquí. Prosperan rápidamente sin la influencia vampírica que los obstaculice."
  
 opportunities1_modifier: "Nuevas oportunidades I"
 opportunities1_modifier_desc: "Pronto podrían surgir nuevas oportunidades de influencia en esta provincia. Una vez que este modificador llegue a 5, se desbloqueará un nuevo espacio para edificios. Ten en cuenta que puedes tener un máximo de 9 espacios para edificios a la vez; este modificador será inútil una vez alcanzado ese límite."

 opportunities2_modifier: "Nuevas oportunidades II"
 opportunities2_modifier_desc: "Pronto podrían surgir nuevas oportunidades de influencia en esta provincia. Una vez que este modificador llegue a 5, se desbloqueará un nuevo espacio para edificios. Ten en cuenta que puedes tener un máximo de 9 espacios para edificios a la vez; este modificador será inútil una vez alcanzado ese límite."
  
 opportunities3_modifier: "Nuevas oportunidades III"
 opportunities3_modifier_desc: "Pronto podrían surgir nuevas oportunidades de influencia en esta provincia. Una vez que este modificador llegue a 5, se desbloqueará un nuevo espacio para edificios. Ten en cuenta que puedes tener un máximo de 9 espacios para edificios a la vez; este modificador será inútil una vez alcanzado ese límite."
  
 opportunities4_modifier: "Nuevas oportunidades IV"
 opportunities4_modifier_desc: "Pronto podrían surgir nuevas oportunidades de influencia en esta provincia. Una vez que este modificador llegue a 5, se desbloqueará un nuevo espacio para edificios. Ten en cuenta que puedes tener un máximo de 9 espacios para edificios a la vez; este modificador será inútil una vez alcanzado ese límite."

 opportunitiesend_modifier: "Totalmente influenciado"
 opportunitiesend_modifier_desc: "Has alcanzado la cantidad máxima de influencia (y espacios para edificios) que puedes tener en esta provincia."
  
 POD_survey_events.1000.t: "La inspección: ¿Una escolta?"
 POD_survey_events.1000.desc: "Eres consciente de que, a pesar de estar nominalmente en tu dominio, hay peligros acechando fuera de tu sede de poder. Mientras preparas esta importante inspección de tu capital, te preguntas qué escolta llevar contigo, si es que llevas alguna. Obviamente, no quieres que parezca que tienes miedo de viajar por tus propias tierras, pero podrías estar aún más preocupado por una posible emboscada o una amenaza inesperada..."
 POD_survey_events.1000.option.a: "¡Todo un ejército!"
 POD_survey_events.1000.option.b: "Unos pocos guardias bastarán"
 POD_survey_events.1000.option.c: "Ellos deberían temerme a mí, no al revés"
 full_escort_survey_tooltip: "Una elección segura pero poco impresionante"
 half_escort_survey_tooltip: "Probablemente una buena elección equilibrada"
 no_escort_survey_tooltip: "Una elección prestigiosa pero potencialmente peligrosa"
  
 POD_survey_events.1001.t: "La inspección: ¿A dónde?"
 POD_survey_events.1001.desc: "Estás listo para partir, pero la noche no es eterna (lamentablemente), así que tendrás que elegir qué parte de la ciudad inspeccionarás esta noche. Obviamente, hay diferentes oportunidades y riesgos en cada una de ellas. También limitarás tu elección a las zonas donde tengas activos de los que ocuparte; no hay necesidad de vagar sin rumbo."
 POD_survey_events.1001.option.a: "Un repaso general de mi influencia en la ciudad"
 POD_survey_events.1001.option.b: "Vayamos a los cuarteles militares"
 POD_survey_events.1001.option.c: "¿Quizás a los gremios de mercaderes?"
 survey_buildings_option_tooltip: "Se abren más opciones dependiendo de los edificios presentes en tu capital"
 POD_survey_events.1001.option.d: "¿Qué hace el clero por la noche?"
 POD_survey_events.1001.option.e: "El barrio noble es donde está el poder"
 POD_survey_events.1001.option.f: "Tengo amigos en los bajos fondos"
 
 POD_survey_events.1.t: "La inspección: Una patrulla"
 POD_survey_events.1.desc: "Durante tu recorrido por la ciudad, te encuentras con una patrulla de guardias, probablemente de la milicia. Sinceramente, son un grupo lamentable; sus armaduras apenas se sostienen y sus pies apenas los arrastran. Esto hace que sean fáciles de evitar y no te molestan, pero este encuentro te hace pensar que, tal vez, podrías aumentar tu control sobre la ciudad influyendo en más de ellos.\nSería fácil de hacer, pero eso ciertamente no ayudaría a la suerte de los ciudadanos, apenas protegidos por este simulacro de soldados. Por otro lado, podrías retirar la influencia que ya ejerces sobre ellos, esperando que mejoren con el tiempo sin tu interferencia."
 POD_survey_events.1.option.a: "Más control siempre es mejor"
 POD_survey_events.1.option.b: "Tal vez pueda relajarme en este caso específico"
 POD_survey_events.1.option.c: "Simplemente pagar uniformes nuevos"
 
 POD_survey_events.2.t: "La inspección: Sin hogar"
 POD_survey_events.2.desc: "Mientras recorres la ciudad, te das cuenta de que hay bastantes mortales sin hogar intentando sobrevivir en las calles. Son presas fáciles, pero no ayudan a mejorar el prestigio de tu dominio. Se te ocurre una idea novedosa: ¡tal vez podrías hacer una 'inversión'! Darles algo de oro podría ayudar a convertirlos en miembros productivos de tu ganado con el tiempo. O simplemente podrías no molestarte; al fin y al cabo, los mortales siempre serán mortales."
 POD_survey_events.2.option.a: "Toma, para servirme mejor"
 POD_survey_events.2.option.b: "Las presas fáciles ya son suficientes"
 
 POD_survey_events.3.t: "La inspección: Reclutas"
 POD_survey_events.3.desc: "Tu control sobre la guarnición militar de la ciudad es bueno, pero siempre debe mantenerse. Especialmente cuando nuevos reclutas entran en el proceso de entrenamiento, ya que estos recién llegados aún están libres de tu influencia. Al acercarte al barrio militar, notas que están realizando un ejercicio de entrenamiento nocturno, lo que podría ser una oportunidad. ¿Quizás podrías presentarte?"
 POD_survey_events.3.option.a: "Consideradme vuestro superior"
 POD_survey_events.3.option.b: "No molestaré a estos"
 POD_survey_events.3.option.c: "¡Entrenaré a estos gusanos yo mismo!"

 survey_mercenaries_contact_modifier: "Contacto con mercenarios"
 survey_mercenaries_contact_modifier_desc: "Has invertido mucho en los mercenarios locales. Da sus frutos."
 
 POD_survey_events.4.t: "La inspección: Mercenarios"
 POD_survey_events.4.desc: "Los mercenarios son una realidad de la vida en estos tiempos turbulentos. Has sido lo suficientemente diligente como para invertir en los locales durante bastante tiempo y no te sorprende verlos esta noche, divirtiéndose ruidosamente en las calles de la ciudad. Si planeas alguna aventura militar, invertir aún más en ellos podría resultar fructífero. Otra opción sería reducir tu control sobre ellos por un tiempo, ya que estás seguro de que los habitantes de la ciudad no están tan encantados de tener a tantos rufianes escandalosos desfilando entre ellos sin control."
 POD_survey_events.4.option.a: "¡Amigos, tengo un nuevo trabajo para vosotros!"
 POD_survey_events.4.option.b: "Dejad de molestar a los vecinos, por favor"
 
 POD_survey_events.5.t: "La inspección: Oportunidades"
 POD_survey_events.5.desc: "Gracias a tu considerable influencia sobre la clase mercantil de la ciudad, a menudo eres el primero en enterarte de nuevas oportunidades lucrativas. Y como cualquier patrón generoso como tú, no dudas en llevarte tu parte de cualquier nuevo negocio. Uno de tus contactos te advierte esta noche sobre las últimas noticias y cómo sacar el mejor provecho de ellas. También dice que esto podría ser un gran beneficio para el desarrollo de la ciudad... pero llevarte tu merecida parte podría obstaculizarlo bastante. ¿Qué harás?"
 POD_survey_events.5.option.a: "Invertiré en ello"
 POD_survey_events.5.option.b: "Enseñadme el dinero"
 POD_survey_events.5.option.c: "Enseñadme TODO el dinero"
 auspexadvanced_tooltip: "Esta opción está disponible porque tienes fuertes poderes de percepción"
 
 POD_survey_events.6.t: "La inspección: El chico nuevo"
 POD_survey_events.6.desc: "Un nuevo negocio ha abierto recientemente en tu ciudad y estabas pensando en hacerle una visita esta noche. Obviamente, es útil hacer saber a cualquier forastero quién es el verdadero líder del barrio mercantil aquí. Aun así, tienes dudas.\nHas notado que, tras tu visita, la mayoría de estos mercaderes parecen perder de algún modo la voluntad de trabajar realmente hasta la extenuación por el bien de tu comunidad. ¿Quizás podrías intentar un enfoque nuevo y audaz y simplemente no interferir?"
 POD_survey_events.6.option.a: "Los viejos métodos funcionan mejor"
 POD_survey_events.6.option.b: "Dejarlo en paz"
 POD_survey_events.6.option.c: "¡Dadle un susto!"
 greedy_tooltip: "Esta opción está disponible porque eres un chupasangre codicioso"
 
 POD_survey_events.7.t: "La inspección: Hombres de fe"
 POD_survey_events.7.desc: "El clero es quizás la parte de la sociedad mortal más difícil de influenciar. Solo hace falta que uno de sus miembros tenga una fe fuerte para poner en peligro toda tu operación. Esta noche, te han informado de que un predicador problemático ha venido a dar un mitin en tu ciudad y ya ha atraído a bastantes seguidores. Su diatriba contra los 'demonios' y los 'monstruos' podría ser un peligro potencial... pero eliminarlo por la fuerza o de otro modo también tendría consecuencias."
 POD_survey_events.7.option.a: "¡Nada de predicadores en mi ciudad!"
 POD_survey_events.7.option.b: "No será una amenaza... ¿verdad?"
 POD_survey_events.7.option.c: "Unirse a la multitud disfrazado de seguidor"
 obfuscateadvanced_tooltip: "Esta opción está disponible porque tienes una gran maestría de Ofuscación"
  
 POD_survey_events.8.t: "La inspección: Nuevo templo"
 POD_survey_events.8.desc: "A pesar de la buena influencia que tienes sobre el clero de tu dominio, no has podido detener la construcción prevista de un nuevo lugar de oración cercano. Ahora deambulas cerca de él, mirando con fastidio cómo progresa la obra. Tener aún más hombres de fe en tu zona podría ser problemático, ya que a menudo son capaces de discernir tu verdadera naturaleza. Sin embargo, aún hay tiempo para asegurarse de que la construcción sufra algunos contratiempos desafortunados..."
 POD_survey_events.8.option.a: "Dejarlo en paz"
 POD_survey_events.8.option.b: "Contratar a unos rufianes"
 POD_survey_events.8.option.c: "¡Dadle un buen golpe!" 
 potenceadvanced_tooltip: "Esta opción está disponible porque tus puños pueden causar terremotos literales"
 
 POD_survey_events.9.title: "La inspección: Amor joven"
 POD_survey_events.9.desc: "Mientras deambulas por el barrio noble, te encuentras con una situación interesante. Desde la calle, un joven intenta cortejar a una señorita que lo mira desde su balcón. Sin embargo, no parece muy eficaz, ya que él tartamudea mucho y su bella pronto cierra la ventana, dejándolo abatido.\nClaramente es hijo de la nobleza, y esa situación suena como una posibilidad fácil, aunque inusual, de ganar un nuevo contacto que podría ser útil en el futuro."
 POD_survey_events.9.option.a: "Darle algunos consejos"
 POD_survey_events.9.option.b: "Reírse de él"
 POD_survey_events.9.option.c: "Ayudar a lograr un final feliz" 
 
 POD_survey_events.10.t: "La inspección: La Ley"
 POD_survey_events.10.desc: "Tienes algunos contactos útiles en el sistema judicial mortal de tu ciudad. Por uno de ellos te has enterado de que esta noche se va a juzgar un caso, uno que incluye a unos rufianes que probablemente acabarán ahorcados por sus fechorías. El problema es que estos son 'tus' rufianes y aún podrían serte útiles para asegurar que los mortales de la zona se mantengan a raya. ¿Intervendrás para ayudarlos?"
 POD_survey_events.10.option.a: "La justicia es ciega"
 POD_survey_events.10.option.b: "¡Yo soy la ley!"
 
 POD_survey_events.11.t: "La inspección: Los ladrones"
 POD_survey_events.11.desc: "Gracias a tus contactos en los bajos fondos de tu ciudad, has podido acorralar a un exitoso grupo de ladrones que lleva tiempo asolando el barrio noble. Son simples mortales y no suponen ninguna amenaza para ti, pero podrían ser de utilidad. Estás pensando en 'contratarlos', asegurándote de que una parte de sus hazañas vuelva a ti. O simplemente podrías deshacerte de ellos, haciendo que el vecindario sea más seguro en el futuro previsible."
 POD_survey_events.11.option.a: "Ahora trabajáis para mí"
 POD_survey_events.11.option.b: "Detengamos esta tontería, muchachos"
 
 POD_survey_events.12.t: "La inspección: El matón"
 POD_survey_events.12.desc: "A pesar de tu influencia en los bajos fondos de la ciudad, parece que uno de los delincuentes no captó el mensaje. Estás sonriendo mientras este matón te amenaza. Realmente, todo es tan pintoresco que apenas puedes reprimir una carcajada, lo que hace que el matón se agite visiblemente y se acerque a ti con lo que parece una mirada amenazadora. Una distracción refrescante, sin duda, pero ¿qué hacer ahora?"
 POD_survey_events.12.option.a: "Desangrarlo"
 POD_survey_events.12.option.b: "Hacer que trabaje para ti"
 POD_survey_events.12.option.c: "Es hora de reconsiderar tus elecciones de vida"
 
 POD_survey_events.101.t: "La inspección: Regreso sin incidentes"
 POD_survey_events.101.desc: "Tras tu pequeño recorrido por la ciudad, regresas a tu [ROOT.Char.Custom('PODDomicile')] sin ningún contratiempo. La actividad noche tras noche pronto volverá a desgastar tu cordura, pero al menos ha sido refrescante dar un paseo."
 POD_survey_events.101.option.a: "Todo ha ido bien"
 
 POD_survey_events.128.t: "La inspección: El asesino"
 POD_survey_events.128.desc: "Apenas lo ves venir.\nMientras regresas a tu [ROOT.Char.Custom('PODDomicile')], el sonido de una daga desenvainada te hace darte la vuelta, justo a tiempo para ver una figura sombría demasiado cerca de tu cuello para tu tranquilidad. ¿El agente de un rival? ¿Un rival olvidado hace tiempo? No tienes tiempo para reflexionar sobre ello mientras tu aspirante a asesino salta hacia ti en un movimiento demasiado rápido para ser el de un simple mortal..."
 POD_survey_events.128.option.a: "¡Guardias! ¡A mí!"
 survey_assassin_tooltip: "Tu escolta completa se encargará de esto." 
 POD_survey_events.128.option.b: "Hagamos esto"
 POD_survey_events.128.effect.success.desc: "Abrumado, el asesino huye"
 POD_survey_events.128.critical.failure.effect.desc: "Un movimiento en falso..."
 POD_survey_events.128.critical.failure: "Sangre y oscuridad"
 POD_survey_events.128.option.d: "¡Huir!"
 
 POD_survey_events.111.t: "La inspección: El asesino II"
 POD_survey_events.111.desc: "Abrumado por tu fuerte defensa, el asesino de repente da media vuelta y empieza a huir. En un movimiento reflejo impulsado sobre todo por tu Bestia vengativa, corres tras él. Pronto ambos os movéis a una velocidad sobrenatural y la persecución os lleva a través de calles, edificios e incluso tejados. Se está volviendo bastante difícil seguirlo, pero también ves signos de agotamiento en tu objetivo. ¿Se le estará acabando la sangre? Sea como sea, la persecución termina y..."
 POD_survey_events.111.option.a: "¡...escapa!"
 assassin_flees_tooltip: "Es demasiado rápido para ti. Es hora de volver a casa." 
 POD_survey_events.111.option.b: "¡...lo has atrapado!"
 celerityadvanced_tooltip: "Esta opción está disponible gracias a tus poderes de velocidad sobrenatural." 
 
 list_names_survey_modifier: "Lista de nombres"
 list_names_survey_modifier_desc: "Sabes quiénes son. Y los encontrarás."
  
 POD_survey_events.112.t: "La inspección: El asesino III"
 POD_survey_events.112.desc: "Te estabas acercando a tu cazador convertido en presa cuando, de repente, el asesino vuelve su daga contra sí mismo. Probablemente dándose cuenta de que su huida era inútil e imaginando las cosas tan gráficas que le harías para obligarle a hablar, eligió poner fin a su propia no-vida.\nNo es exactamente el final que querías, pero tras un rápido escaneo entre las cenizas, notas varios trozos de papel que hablan del contrato sobre tu cabeza. Obviamente no enumeran con precisión quién te quiere muerto, pero siguen siendo bastante esclarecedores..."
 POD_survey_events.112.option.a: "Mejor que nada"
  
 POD_survey_events.120.t: "La inspección: El incendio"
 POD_survey_events.120.desc: "¿Por qué ahora? ¿Es solo incompetencia mortal? ¿O un ataque indirecto de uno de tus rivales? Sea quien sea el culpable, un gran incendio ha empezado a extenderse por tu ciudad y está cerca de rodear tu posición, haciendo que el regreso a tu [ROOT.Char.Custom('PODDomicile')] sea una perspectiva peligrosa.\nTu Bestia ya ruge dentro de su jaula para salir corriendo mientras consideras cómo evitar mejor, o despejar, a los mortales que gritan y al fuego voraz. No será fácil."
 POD_survey_events.120.option.a: "¡Guardias! ¡Abrid paso!"
 beast_takeover_survey_tooltip: "Tu Bestia frenética te llevará a un lugar seguro" 
 POD_survey_events.120.option.b: "Encontraré una manera..."
 POD_survey_events.120.effect.success.desc: "Escapas de lo peor del infierno"
 POD_survey_events.120.critical.failure.effect.desc: "Termina como empezó. En el fuego."
 POD_survey_events.120.critical.failure: "¡Quema! ¡Quema!"
 POD_survey_events.120.option.d: "Dejar que la Bestia tome el control" 
  
 POD_survey_events.121.t: "La inspección: El incendio II"
 POD_survey_events.121.desc: "Has conseguido evitar lo peor del fuego y los mortales lo están apagando poco a poco. Lamentablemente, tu ruta de escape te ha alejado bastante de tu [ROOT.Char.Custom('PODDomicile')], demasiado lejos para evitar el sol de la mañana si intentas llegar allí. Por ello, no tienes más remedio que buscar refugio en un lugar poco digno hasta que puedas regresar a tu sede de poder la noche siguiente."
 POD_survey_events.121.option.a: "¡Es como un viaje de acampada!"
 survey_fire_ending_tooltip: "Vuelves a casa la noche siguiente sintiéndote sucio, pero entero." 
 POD_survey_events.121.option.b: "Simplemente me fundiré con la Tierra"
 proteanadvanced_tooltip: "Esta opción está disponible gracias a tu maestría de Protean." 
 POD_survey_events.121.option.c: "Organizar un buen alojamiento"
 
 POD_survey_events.130.t: "La inspección: Los cazadores"
 POD_survey_events.130.desc: "¡Una emboscada! En tu camino de vuelta a tu [ROOT.Char.Custom('PODDomicile')], un grupo de cazadores de vampiros aparentemente bien organizado (e informado) te ha rodeado. Están bien armados y son cautelosos en su enfoque, lo que demuestra que esta no es su primera caza. Los mortales no suelen ser una preocupación, pero un grupo así con antorchas, flechas incendiarias y probablemente uno o dos verdaderos creyentes es otro asunto muy distinto... Consideras tus opciones."
 POD_survey_events.130.option.a: "¡Guardias! ¡Encargaos de ellos!"
 best_bravely_tooltip: "No esperaban que huyeras. Los pierdes fácilmente, pero te recordarán." 
 POD_survey_events.130.option.b: "¡A la batalla!"
 POD_survey_events.130.effect.success.desc: "¡Una victoria decisiva!"
 POD_survey_events.130.critical.failure.effect.desc: "Termina como empezó. En el fuego."
 POD_survey_events.130.critical.failure: "¡Quema! ¡Quema!"
 POD_survey_events.130.option.d: "¡Huir!" 
 
 POD_survey_events.131.t: "La inspección: Los cazadores II"
 POD_survey_events.131.desc: "La victoria es tuya. Te sirves de la sangre de estos mortales, ya que no la necesitarán más, y piensas qué hacer con los supervivientes heridos de este asalto que ahora están a tu merced. Llevarlos de vuelta a tu [ROOT.Char.Custom('PODDomicile')] para una 'demostración' ante tu corte parece una opción agradable y relajante. O podrías optar por una exhibición más pública en una parte céntrica de tu ciudad, aunque esto seguro que llamará la atención de más cazadores en el futuro."
 POD_survey_events.131.option.a: "Una exhibición privada suena bien"
 POD_survey_events.131.option.b: "Dominarlos para que otros pierdan tu rastro"
 POD_survey_events.131.option.c: "Es hora de dar ejemplo"
  
 POD_survey_events.140.t: "La inspección: El profeta"
 POD_survey_events.140.desc: "Mientras regresas a casa, a tu [ROOT.Char.Custom('PODDomicile')], te aborda un anciano que murmura lo que parece un balbuceo incoherente. Sin embargo, alcanzas a distinguir palabras como 'vampiros' y 'Dios', que captan tu atención. Al frenar un poco, el loco se acerca y empieza a hablar con más entusiasmo que antes. Incluso prestando atención, comprender una pizca de lo que intenta decir seguiría siendo toda una hazaña."
 POD_survey_events.140.option.a: "Me quedo un rato y escucho"
 ending_survey_tooltip: "Regresas a casa sin más contratiempos." 
 POD_survey_events.140.option.b: "No escucho a ningún loco"
 POD_survey_events.140.effect.success.desc: "Eso tiene sentido, en cierto modo"
 POD_survey_events.140.critical.failure.effect.desc: "No lo entiendo..."
 POD_survey_events.140.critical.failure: "¡Ni idea!"
 
 POD_survey_events.141.t: "La inspección: El profeta II"
 POD_survey_events.141.desc: "Bueno, no ha sido exactamente 'esclarecedor', pero al menos hay algunas cosas interesantes en las que reflexionar sobre lo que ha dicho este anciano. Aunque la naturaleza siempre críptica de tales profecías hace que la mayoría de las veces no merezcan la pena. En cualquier caso, el autoproclamado profeta está contento de que le hayas escuchado y te ha dejado en paz. Tu [ROOT.Char.Custom('PODDomicile')] te espera, con más preguntas que respuestas."
 POD_survey_events.141.option.a: "Solo desvaríos, la verdad"
 malkavian_survey_tooltip: "Esta opción está disponible porque eres un Malkavian" 
 POD_survey_events.141.option.b: "¡Las preguntas son lo importante!"
 POD_survey_events.141.option.c: "No, de verdad, esto estaba clarísimo"
