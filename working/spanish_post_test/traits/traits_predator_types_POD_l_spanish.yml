l_spanish:

 trait_predatortype_farmer: "Granjero"
 trait_predatortype_farmer_desc: "Este vampiro prefiere alimentarse de animales."
 
 trait_predatortype_bloodleech: "Sanguijuela"
 trait_predatortype_bloodleech_desc: "¡Este vampiro prefiere alimentarse de la sangre de otros vampiros!"
 
 trait_predatortype_phlebotomist: "Flebotomista"
 trait_predatortype_phlebotomist_desc: "Este vampiro adquiere $pod_vitae$ bajo la apariencia de un médico que realiza sangrías."
 
 trait_predatortype_bedlamite: "Manicomio"
 trait_predatortype_bedlamite_desc: "Este vampiro se alimenta de los locos. Puede que él mismo esté loco o no."
 
 trait_predatortype_cenobite: "Cenobita"
 trait_predatortype_cenobite_desc: "Este vampiro tiene un [POD_herd|E] en una institución religiosa como un monasterio."
 
 trait_predatortype_alleycat: "Gato Callejero"
 trait_predatortype_alleycat_desc: "Este vampiro acecha y ataca violentamente a los mortales para obtener sangre. Es un enfoque vulgar."
 
 trait_predatortype_cauchemar: "Cauchemar"
 trait_predatortype_cauchemar_desc: "Este vampiro se alimenta principalmente de presas dormidas."
 
 trait_predatortype_familias: "Familias"
 trait_predatortype_familias_desc: "Este vampiro se alimenta casi exclusivamente de una dinastía familiar concreta. Incluso puede estar emparentado con la familia, o al menos eso es lo que la familia cree."
 
 trait_predatortype_footpad: "Salteador"
 trait_predatortype_footpad_desc: "Este vampiro se mueve entre los bajos fondos de la sociedad, tomando la sangre de los desposeídos. Si desaparecen, las autoridades no muestran interés."
 
 trait_predatortype_consensualist: "Consensualista"
 trait_predatortype_consensualist_desc: "Este vampiro se alimenta de quienes acceden voluntariamente. Esto complica enormemente [the_masquerade|E]."
 
 trait_predatortype_cultist: "Cultista"
 trait_predatortype_cultist_desc: "Este vampiro lidera un culto de sangre, como en los tiempos antiguos. El ganado le adora y se ofrece libremente a este dios de la sangre."
 
 trait_predatortype_siren: "Sirena"
 trait_predatortype_siren_desc: "Este vampiro seduce a sus amantes para drenar su sangre a través del beso."
 
 trait_predatortype_gentry: "Gentry"
 trait_predatortype_gentry_desc: "Este vampiro ocupa una posición de cierto estatus en la sociedad mortal. Utiliza ese estatus para cazar a los ricos y poderosos. Nadie creerá que alguien con tal refinamiento sea un monstruo."
 
 trait_predatortype_graverobber: "Saqueador de Tumbas"
 trait_predatortype_graverobber_desc: "A este vampiro se le puede encontrar merodeando por cementerios y criptas en busca de cadáveres frescos o de dolientes. Puede obtener sustento de los cadáveres recientes."
 
 trait_predatortype_extortionist: "Extorsionador"
 trait_predatortype_extortionist_desc: "Este vampiro obliga a sus víctimas a sangrar para él. Supuestamente, el extorsionador adquiere sangre a cambio de servicios como seguridad o vigilancia, pero aunque muchas veces la necesidad de protección es real, con la misma frecuencia es una ficción diseñada para que el trato parezca aceptable."
