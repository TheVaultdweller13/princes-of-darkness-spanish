 building_type_jerusalem_muslim_al_yaqubi_01: "Mezquita al-Yaqubi"
 building_type_jerusalem_muslim_al_yaqubi_01_desc: "#F Esta mezquita fue nombrada en honor a un gran historiador y geógrafo árabe que registró muchas fábulas de la era de la Yahiliyya e información detallada sobre ciudades clave desde el Imperio Bizantino hasta China. Incluso realizó un seguimiento de estadísticas, detalles fiscales e información topográfica de esas ciudades.#!"
