 building_type_jerusalem_muslim_madrasa_01_desc: "#F Llamada así por Dho 'l-Nun al-Misri, esta madrasa honra al antiguo místico, santo y maestro de la magia. Como otras madrasas, esta sirve como una institución educativa que enseña una mezcla de temas seculares, religiosos y místicos.#!"
