 building_type_jerusalem_divided_armenian_quarter_01: "Barrio Armenio"
 building_type_jerusalem_divided_armenian_quarter_01_desc: "#F El más pequeño de los 4 barrios, el Barrio Armenio es el hogar de cristianos de la Iglesia Apostólica Armenia. Si pudierais atraer a más de ellos a Jerusalén, podríais beneficiaros de sus artesanos y de su experiencia suavizando conflictos entre los otros 3 barrios, un papel bastante estresante que cederán gustosamente.#!"
