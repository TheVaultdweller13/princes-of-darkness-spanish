 building_type_jerusalem_divided_jewish_quarter_01: "Barrio Judío"
 building_type_jerusalem_divided_jewish_quarter_01_desc: "#F El Barrio Judío es el hogar de los judíos oprimidos que quedan en Jerusalén y de aquellos que hacen la aliá. Si se mejorara su barrio, podrían proporcionar acceso a su conocimiento oral y a sus bibliotecas ocultas.#!"
