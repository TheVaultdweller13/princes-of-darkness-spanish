 building_type_jerusalem_divided_muslim_quarter_01: "Barrio Musulmán"
 building_type_jerusalem_divided_muslim_quarter_01_desc: "#F El Barrio Musulmán es el hogar de una mezcla de comerciantes y peregrinos procedentes de todo Oriente Medio. Si les ayudáis, os proporcionarán su experiencia para navegar, luchar y recaudar impuestos en el desierto.#!"
