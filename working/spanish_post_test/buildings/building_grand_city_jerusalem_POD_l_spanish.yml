 building_type_jerusalem_muslim_al_khanqah_salahiyya_01: "Mezquita al-Khanqah as-Salahiyya"
 building_type_jerusalem_muslim_al_khanqah_salahiyya_01_desc: "#F Esta mezquita fue nombrada Salah ad-Din Yusuf ibn Ayyub y desempeñó un papel importante para él. Mientras estuvo vivo, la mezquita proporcionó alojamiento a sus oficiales, sirvió como su retiro espiritual personal, impartió lecciones y funcionó como mezquita. Más allá de eso, anteriormente fue una Khanqah, lo que significaba que funcionaba como un gremio en tiempos de paz y como una orden marcial en tiempos de guerra.#!"
