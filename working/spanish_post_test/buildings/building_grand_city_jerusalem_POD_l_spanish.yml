 building_jerusalem_muslim_dome_rock_03_desc: "$building_jerusalem_muslim_dome_rock_01_desc$"
 building_jerusalem_muslim_dome_rock_04: "Cúpula de la Roca Consagrada"
 building_jerusalem_muslim_dome_rock_04_desc: "La Cúpula de la Roca fue construida en la década de 690 d.C. sobre el lugar donde Adán fue creado, donde Abraham casi sacrificó a su hijo y donde Mahoma comenzó su Viaje Nocturno. Con los daños reparados, el tercer lugar más sagrado del Islam está finalmente listo para honrar adecuadamente los grandes logros de Alá en esta ubicación."

 building_type_jerusalem_muslim_damascus_market_01: "Mercado de Damasco"
 building_type_jerusalem_muslim_damascus_market_01_desc: "#F El Mercado de Damasco comercia con todo, desde mercancías importadas hasta ganado, y es el corazón financiero de Jerusalén.#!"
 building_jerusalem_muslim_damascus_market_01: "Mercado de Damasco"
 building_jerusalem_muslim_damascus_market_01_desc: "El Mercado de Damasco comercia con todo, desde mercancías importadas hasta ganado, y es el corazón financiero de Jerusalén."
 building_jerusalem_muslim_damascus_market_02: "Bazar de Damasco"
 building_jerusalem_muslim_damascus_market_02_desc: "El Mercado de Damasco comercia con todo, desde mercancías importadas hasta ganado, y es el corazón financiero de Jerusalén. Cualquier cosa que pueda comprarse legalmente se encuentra aquí."
 building_jerusalem_muslim_damascus_market_03: "Gran Bazar de Damasco"
 building_jerusalem_muslim_damascus_market_03_desc: "El Mercado de Damasco comercia con todo, desde mercancías importadas hasta ganado, y es el corazón financiero de Jerusalén. Jerusalén es el punto focal alrededor del cual gira el comercio mundial, y el Gran Bazar de Damasco es el centro de ese punto focal."

 building_type_jerusalem_muslim_zawiya_01: "Zauiya Ahmad"
 building_type_jerusalem_muslim_zawiya_01_desc: "#F Llamada así por Ahmad ibn Harb \"el Hijo de la Guerra\", esta zauiya honra al antiguo tradicionalista y guerrero de la yihad. Como otras zauiyas, esta sirve como una orden militar religiosa muy parecida a las órdenes de los cruzados cristianos.#!"
