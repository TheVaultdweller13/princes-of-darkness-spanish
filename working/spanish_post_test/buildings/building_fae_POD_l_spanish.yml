 building_type_glade_freehold_01: "Claro"
 building_type_glade_freehold_01_desc: "#F Los Claros son cañadas silvanas, típicamente situadas en lo profundo de un bosque. Los Linajes favorecen los claros para muchos de sus festivales. A diferencia de la mayoría de los feudos, los Claros son fuentes naturales de Glamour.#!"
 building_glade_freehold_01: "Claro Pequeño"
 building_glade_freehold_01_desc: "Los Claros son cañadas silvanas, típicamente situadas en lo profundo de un bosque. Los Linajes favorecen los claros para muchos de sus festivales."
 building_glade_freehold_02: "Claro Mediano"
 building_glade_freehold_02_desc: "Los Claros son cañadas silvanas, típicamente situadas en lo profundo de un bosque. Los Linajes favorecen los claros para muchos de sus festivales."
 building_glade_freehold_03: "Claro Grande"
 building_glade_freehold_03_desc: "Los Claros son cañadas silvanas, típicamente situadas en lo profundo de un bosque. Los Linajes favorecen los claros para muchos de sus festivales."
 glade_freehold_effect_desc: "Si se construye en la capital, regenera Glamour extra cada mes (33% de probabilidad por nivel)."
 
 building_type_hearth_freehold_01: "Hogar"
 building_type_hearth_freehold_01_desc: "#F Un feudo de Hogar es una taberna, bar o cafetería de hadas, generalmente con una entrada en un callejón trasero. Todos los Linajes son bienvenidos siempre que tengan algo que intercambiar.#!"
 building_hearth_freehold_01: "Hogar Pequeño"
 building_hearth_freehold_01_desc: "Un feudo de Hogar es una taberna, bar o cafetería de hadas, generalmente con una entrada en un callejón trasero."
 building_hearth_freehold_02: "Hogar Mediano"
 building_hearth_freehold_02_desc: "Un feudo de Hogar es una taberna, bar o cafetería de hadas, generalmente con una entrada en un callejón trasero."
 building_hearth_freehold_03: "Hogar Grande"
 building_hearth_freehold_03_desc: "Un feudo de Hogar es una taberna, bar o cafetería de hadas, generalmente con una entrada en un callejón trasero."
 
 building_type_lodge_freehold_01: "Logia"
 building_type_lodge_freehold_01_desc: "#F Las cabañas, casas y mansiones, consideradas colectivamente como logias, pueden ser feudos. Las logias son típicamente los baluartes de los nobles, que pasan gran parte de su tiempo residiendo en ellas.#!"
 building_lodge_freehold_01: "Logia Pequeña"
 building_lodge_freehold_01_desc: "Las cabañas, casas y mansiones, consideradas colectivamente como logias, pueden ser feudos."
 building_lodge_freehold_02: "Logia Mediana"
 building_lodge_freehold_02_desc: "Las cabañas, casas y mansiones, consideradas colectivamente como logias, pueden ser feudos."
 building_lodge_freehold_03: "Logia Grande"
 building_lodge_freehold_03_desc: "Las cabañas, casas y mansiones, consideradas colectivamente como logias, pueden ser feudos."
 
 building_type_manor_freehold_01: "Solar"
 building_type_manor_freehold_01_desc: "#F Un solar es una pequeña cañada de hadas que rodea una cabaña u otro edificio, y suele estar situada en tierras salvajes.#!"
 building_manor_freehold_01: "Solar Pequeño"
 building_manor_freehold_01_desc: "Un solar es una pequeña cañada de hadas que rodea una cabaña u otro edificio, y suele estar situada en tierras salvajes."
 building_manor_freehold_02: "Solar Mediano"
 building_manor_freehold_02_desc: "Un solar es una pequeña cañada de hadas que rodea una cabaña u otro edificio, y suele estar situada en tierras salvajes."
 building_manor_freehold_03: "Solar Grande"
 building_manor_freehold_03_desc: "Un solar es una pequeña cañada de hadas que rodea una cabaña u otro edificio, y suele estar situada en tierras salvajes."
 
 building_type_eyrie_freehold_01: "Nidos de Águila"
 building_type_eyrie_freehold_01_desc: "#F Los Nidos de Águila son feudos de alta montaña y son típicamente los refugios de los parias.#!"
 building_eyrie_freehold_01: "Nidos de Águila Pequeños"
 building_eyrie_freehold_01_desc: "Los Nidos de Águila son feudos de alta montaña y son típicamente los refugios de los parias."
 building_eyrie_freehold_02: "Nidos de Águila Medianos"
 building_eyrie_freehold_02_desc: "Los Nidos de Águila son feudos de alta montaña y son típicamente los refugios de los parias."
 building_eyrie_freehold_03: "Nidos de Águila Grandes"
 building_eyrie_freehold_03_desc: "Los Nidos de Águila son feudos de alta montaña y son típicamente los refugios de los parias."
 
 building_type_grotto_freehold_01: "Gruta"
 building_type_grotto_freehold_01_desc: "#F Las Grutas suelen ser claros silvanos cubiertos de maleza o minas abandonadas. Los [GetTrait('sluagh').GetName(GetNullCharacter)] y los #TOOLTIP:GAME_TRAIT,nocker,[GetNullCharacter] #L Nockers#!#! a menudo se reúnen en tales feudos apartados, aunque otros también los usan.#!"
 building_grotto_freehold_01: "Gruta Pequeña"
 building_grotto_freehold_01_desc: "Las Grutas suelen ser claros silvanos cubiertos de maleza o minas abandonadas."
 building_grotto_freehold_02: "Gruta Mediana"
 building_grotto_freehold_02_desc: "Las Grutas suelen ser claros silvanos cubiertos de maleza o minas abandonadas."
 building_grotto_freehold_03: "Gruta Grande"
 building_grotto_freehold_03_desc: "Las Grutas suelen ser claros silvanos cubiertos de maleza o minas abandonadas."
 
 building_type_faerie_ring_freehold_01: "Círculo de Hadas"
 building_type_faerie_ring_freehold_01_desc: "#F Un Círculo de Hadas es una cañada muy pequeña que se encuentra en lo profundo del bosque. Estos feudos naturales son cada vez más raros a medida que los lugares salvajes del mundo disminuyen.#!"
 building_faerie_ring_freehold_01: "Círculo de Hadas Pequeño"
 building_faerie_ring_freehold_01_desc: "Un Círculo de Hadas es una cañada muy pequeña que se encuentra en lo profundo del bosque."
 building_faerie_ring_freehold_02: "Círculo de Hadas Mediano"
 building_faerie_ring_freehold_02_desc: "Un Círculo de Hadas es una cañada muy pequeña que se encuentra en lo profundo del bosque."
 building_faerie_ring_freehold_03: "Círculo de Hadas Grande"
 building_faerie_ring_freehold_03_desc: "Un Círculo de Hadas es una cañada muy pequeña que se encuentra en lo profundo del bosque."
 
 building_type_isle_freehold_01: "Isla"
 building_type_isle_freehold_01_desc: "#F Estas islas encantadas rara vez aparecen en los mapas o son mancilladas por pies mortales. Las islas son refugios privados y se encuentran entre los feudos más preciados.#!"
 building_isle_freehold_01: "Isla Pequeña"
 building_isle_freehold_01_desc: "Estas islas encantadas rara vez aparecen en los mapas o son mancilladas por pies mortales."
 building_isle_freehold_02: "Isla Mediana"
 building_isle_freehold_02_desc: "Estas islas encantadas rara vez aparecen en los mapas o son mancilladas por pies mortales."
 building_isle_freehold_03: "Isla Grande"
 building_isle_freehold_03_desc: "Estas islas encantadas rara vez aparecen en los mapas o son mancilladas por pies mortales."
 
 building_type_thorpe_freehold_01: "Aldea"
 building_type_thorpe_freehold_01_desc: "#F Una aldea es un pueblo de hadas.#!"
 building_thorpe_freehold_01: "Aldea Pequeña"
 building_thorpe_freehold_01_desc: "Una aldea es un pueblo de hadas."
 building_thorpe_freehold_02: "Aldea Mediana"
 building_thorpe_freehold_02_desc: "Una aldea es un pueblo de hadas."
 building_thorpe_freehold_03: "Aldea Grande"
 building_thorpe_freehold_03_desc: "Una aldea es un pueblo de hadas."
 
 building_type_urban_freehold_01: "Urbano"
 building_type_urban_freehold_01_desc: "#F Solo los Kithain más resistentes se atreven a vivir en las asfixiantes extensiones urbanas del Mundo de Tinieblas. La Banalidad está en su punto más alto aquí, y el Glamour sin mácula es escaso. Estos feudos están al borde del Invierno venidero.#!"
 building_urban_freehold_01: "Urbano Pequeño"
 building_urban_freehold_01_desc: "Solo los Kithain más resistentes se atreven a vivir en las asfixiantes extensiones urbanas del Mundo de Tinieblas."
 building_urban_freehold_02: "Urbano Mediano"
 building_urban_freehold_02_desc: "Solo los Kithain más resistentes se atreven a vivir en las asfixiantes extensiones urbanas del Mundo de Tinieblas."
 building_urban_freehold_03: "Urbano Grande"
 building_urban_freehold_03_desc: "Solo los Kithain más resistentes se atreven a vivir en las asfixiantes extensiones urbanas del Mundo de Tinieblas."
 
 building_type_market_freehold_01: "Mercado"
 building_type_market_freehold_01_desc: "#F Los Mercados de Hadas son lugares, a menudo feudos, donde los linajes vienen a comprar, vender e intercambiar extraños tesoros de mil reinos. Estos lugares a menudo comparten espacio con los mercados humanos de forma encubierta, aunque pueden existir totalmente en el [UmbraGlossary('dreaming')], como el [UmbraGlossary('goblin_market')]. Un humano puede comprar una pieza de artesanía de hadas \"accidentalmente\" en ocasiones. Tales transacciones pueden ser afortunadas o desastrosas para el humano incauto.#!"
 building_market_freehold_01: "Mercado Pequeño"
 building_market_freehold_01_desc: "Los Mercados de Hadas son lugares, a menudo feudos, donde los linajes vienen a comprar, vender e intercambiar extraños tesoros de mil reinos."
 building_market_freehold_02: "Mercado Mediano"
 building_market_freehold_02_desc: "Los Mercados de Hadas son lugares, a menudo feudos, donde los linajes vienen a comprar, vender e intercambiar extraños tesoros de mil reinos."
 building_market_freehold_03: "Mercado Grande"
 building_market_freehold_03_desc: "Los Mercados de Hadas son lugares, a menudo feudos, donde los linajes vienen a comprar, vender e intercambiar extraños tesoros de mil reinos."
 
 building_type_homestead_freehold_01: "Hacienda"
 building_type_homestead_freehold_01_desc: "#F Las haciendas son feudos que están totalmente en el [UmbraGlossary('dreaming')], pero sin acceso a un Rath. No tienen la naturaleza dual de la mayoría de los feudos; su principal virtud es la estabilidad. Los Kithain construyen haciendas para resistir los rigores del [UmbraGlossary('dreaming')]. Los hacendados son pocos pero ferozmente independientes. Algunos linajes de cada kith establecen haciendas (incluso pequeñas aldeas) en el [UmbraGlossary('dreaming')] Cercano.#!"
 building_homestead_freehold_01: "Hacienda Pequeña"
 building_homestead_freehold_01_desc: "Las haciendas son feudos que están totalmente en el [UmbraGlossary('dreaming')], pero sin acceso a un Rath."
 building_homestead_freehold_02: "Hacienda Mediana"
 building_homestead_freehold_02_desc: "Las haciendas son feudos que están totalmente en el [UmbraGlossary('dreaming')], pero sin acceso a un Rath."
 building_homestead_freehold_03: "Hacienda Grande"
 building_homestead_freehold_03_desc: "Las haciendas son feudos que están totalmente en el [UmbraGlossary('dreaming')], pero sin acceso a un Rath."
 
 building_type_land_trod_01: "Senda Terrestre"
 building_type_land_trod_01_desc: "#F Las sendas terrestres pueden ser cualquier cosa, desde una amplia autopista hasta un estrecho camino a lo largo de un precipicio. Pueden pasar por idílicos pueblos de hadas, por desiertos literalmente ardientes o por bosques de nieblas y árboles que gimen. Un linaje puede caminar, cabalgar o conducir por estas sendas; el modo de viaje está limitado solo por el terreno.#!"
 building_land_trod_01: "Senda Terrestre Pequeña"
 building_land_trod_01_desc: "Las sendas terrestres pueden ser cualquier cosa, desde una amplia autopista hasta un estrecho camino a lo largo de un precipicio."
 building_land_trod_02: "Senda Terrestre Mediana"
 building_land_trod_02_desc: "Las sendas terrestres pueden ser cualquier cosa, desde una amplia autopista hasta un estrecho camino a lo largo de un precipicio."
 building_land_trod_03: "Senda Terrestre Grande"
 building_land_trod_03_desc: "Las sendas terrestres pueden ser cualquier cosa, desde una amplia autopista hasta un estrecho camino a lo largo de un precipicio."
 land_trod_effect_desc: "Si se construye en la capital, otorga acceso al [UmbraGlossary('dreaming')]."
 
 building_type_water_trod_01: "Senda Acuática"
 building_type_water_trod_01_desc: "#F Estas sendas pueden ser tan pequeñas como un arroyo de montaña o tan vastas como mil océanos. Debido a la falta de puntos de referencia reconocibles, los viajeros en este tipo de senda deben confiar en cartas y otros tesoros de navegación para recorrer estos caminos acuáticos de forma segura.#!"
 building_water_trod_01: "Senda Acuática Pequeña"
 building_water_trod_01_desc: "Estas sendas pueden ser tan pequeñas como un arroyo de montaña o tan vastas como mil océanos."
 building_water_trod_02: "Senda Acuática Mediana"
 building_water_trod_02_desc: "Estas sendas pueden ser tan pequeñas como un arroyo de montaña o tan vastas como mil océanos."
 building_water_trod_03: "Senda Acuática Grande"
 building_water_trod_03_desc: "Estas sendas pueden ser tan pequeñas como un arroyo de montaña o tan vastas como mil océanos."
 
 building_type_sun_trod_01: "Senda Solar"
 building_type_sun_trod_01_desc: "#F Las sendas solares son sendas celestiales que están abiertas solo durante el día. Solo aquellos linajes que pueden volar (incluso en un globo) pueden viajar por estas autopistas etéreas. Las sendas solares pueden aparecer como haces de luz solar enfocada o como caminos a lo largo de nubes iluminadas por el sol. Un linaje que viaje por una senda solar debe encontrar una senda lunar para continuar su viaje después del anochecer.#!"
 building_sun_trod_01: "Senda Solar Pequeña"
 building_sun_trod_01_desc: "Las sendas solares son sendas celestiales que están abiertas solo durante el día."
 building_sun_trod_02: "Senda Solar Mediana"
 building_sun_trod_02_desc: "Las sendas solares son sendas celestiales que están abiertas solo durante el día."
 building_sun_trod_03: "Senda Solar Grande"
 building_sun_trod_03_desc: "Las sendas solares son sendas celestiales que están abiertas solo durante el día."
 
 building_type_moon_trod_01: "Senda Lunar"
 building_type_moon_trod_01_desc: "#F Las sendas lunares son sendas celestiales que están abiertas solo por la noche. Solo aquellos linajes que pueden volar pueden viajar por estos senderos fantasmas lunares. Las sendas lunares pueden aparecer como motas de polvo danzando en haces de pálida luz de luna o como caminos a lo largo de nubes del cielo nocturno.#!"
 building_moon_trod_01: "Senda Lunar Pequeña"
 building_moon_trod_01_desc: "Las sendas lunares son sendas celestiales que están abiertas solo por la noche."
 building_moon_trod_02: "Senda Lunar Mediana"
 building_moon_trod_02_desc: "Las sendas lunares son sendas celestiales que están abiertas solo por la noche."
 building_moon_trod_03: "Senda Lunar Grande"
 building_moon_trod_03_desc: "Las sendas lunares son sendas celestiales que están abiertas solo por la noche."
 
 building_type_chimerical_trod_01: "Senda Quimérica"
 building_type_chimerical_trod_01_desc: "#F Las sendas quiméricas son demasiado etéreas para que las recorran criaturas materiales como las hadas, pero las quimeras tienen pocos problemas para usar estos caminos ricos en Glamour. Algunas Artes arcanas pueden permitir a los linajes entrar en estas sendas alienígenas. Tales caminos son extraordinariamente peligrosos, incluso para los Kithain más potentes. El Sendero de Plata no se extiende a estas sendas.#!"
 building_chimerical_trod_01: "Senda Quimérica Pequeña"
 building_chimerical_trod_01_desc: "Las sendas quiméricas son demasiado etéreas para que las recorran criaturas materiales como las hadas, pero las quimeras tienen pocos problemas para usar estos caminos ricos en Glamour."
 building_chimerical_trod_02: "Senda Quimérica Mediana"
 building_chimerical_trod_02_desc: "Las sendas quiméricas son demasiado etéreas para que las recorran criaturas materiales como las hadas, pero las quimeras tienen pocos problemas para usar estos caminos ricos en Glamour."
 building_chimerical_trod_03: "Senda Quimérica Grande"
 building_chimerical_trod_03_desc: "Las sendas quiméricas son demasiado etéreas para que las recorran criaturas materiales como las hadas, pero las quimeras tienen pocos problemas para usar estos caminos ricos en Glamour."
 
 building_type_nightmare_trod_01: "Senda de Pesadilla"
 building_type_nightmare_trod_01_desc: "#F Los [Glossary('Nightmare Realms','game_concept_nightmare_realm_desc')] supuran en el [UmbraGlossary('deep_dreaming')] como un cáncer insaciable. Sendas oscuras y retorcidas surgen de ellos, tocando casi cualquier otra parte del [UmbraGlossary('dreaming')]. Quimeras malignas y criaturas aún más oscuras recorren estos temibles caminos. Algunos linajes Unseelie usan estas sendas en recados secretos, pero estos caminos son peligrosos incluso para ellos. El Sendero de Plata existe a lo largo de algunas de estas sendas. La mayoría cree que los Tuatha de Danaan construyeron el sendero allí durante sus guerras con los Fomorianos.#!"
 building_nightmare_trod_01: "Senda de Pesadilla Pequeña"
 building_nightmare_trod_01_desc: "Los [Glossary('Nightmare Realms','game_concept_nightmare_realm_desc')] supuran en el [UmbraGlossary('deep_dreaming')] como un cáncer insaciable."
 building_nightmare_trod_02: "Senda de Pesadilla Mediana"
 building_nightmare_trod_02_desc: "Los [Glossary('Nightmare Realms','game_concept_nightmare_realm_desc')] supuran en el [UmbraGlossary('deep_dreaming')] como un cáncer insaciable."
 building_nightmare_trod_03: "Senda de Pesadilla Grande"
 building_nightmare_trod_03_desc: "Los [Glossary('Nightmare Realms','game_concept_nightmare_realm_desc')] supuran en el [UmbraGlossary('deep_dreaming')] como un cáncer insaciable."
 
 building_type_wild_portal_01: "Portal Salvaje"
 building_type_wild_portal_01_desc: "#F Nadie está exactamente seguro de dónde provienen estos fenómenos o cómo llegaron a existir. Las hadas Seelie creen que son obra de los Unseelie, mientras que los Unseelie culpan a los Seelie. Ambos bandos afirman que hadas poderosas crearon deliberadamente los portales para atraer y atrapar enemigos. Otros postulan que estos portales son creaciones del propio Ensueño de la época del [Glossary('Shattering','game_concept_shattering_desc')]... un último suspiro de la Magia intentando mantener una conexión con el mundo mundano cuando el antiguo falló y se cerró.#!"
 building_wild_portal_01: "Portal Salvaje Pequeño"
 building_wild_portal_01_desc: "Un Portal Salvaje es un tipo de entrada incontrolada y desconocida al [UmbraGlossary('dreaming')]."
 building_wild_portal_02: "Portal Salvaje Mediano"
 building_wild_portal_02_desc: "Un Portal Salvaje es un tipo de entrada incontrolada y desconocida al [UmbraGlossary('dreaming')]."
 building_wild_portal_03: "Portal Salvaje Grande"
 building_wild_portal_03_desc: "Un Portal Salvaje es un tipo de entrada incontrolada y desconocida al [UmbraGlossary('dreaming')]."
 
 building_type_silvers_gate_01: "Puerta de Plata"
 building_type_silvers_gate_01_desc: "#F La Isla de los Sueños centelleaba sobre el agua, una extensión verde de terreno que se elevaba suavemente hasta culminar en una colina redondeada en el centro de la isla. En la cima de la colina, un castillo de hadas con agujas de cristal y torres prismáticas coronaba el punto más alto de la isla. Ante la puerta del castillo se alzaba un par de estatuas de piedra, caballeros elegantemente vestidos con largos cabellos flotantes.#!"
 building_silvers_gate_01: "Puerta de Plata"
 building_silvers_gate_01_desc: "En el centro de la isla se alzaba la Puerta de Plata, un portal al corazón de Tir-na-N’og, ahora conocido como [UmbraGlossary('arcadia')]."
 
 building_type_gwyddnos_track_01: "Rastro de Gwyddno"
 building_type_gwyddnos_track_01_desc: "#F Solo recordada en rumores y leyendas, la entrada a un sarn (senda en galés) de poder antiguo yace oculta en Powys.#!"
 building_gwyddnos_track_01: "Rastro de Gwyddno"
 building_gwyddnos_track_01_desc: "Utilizada por última vez durante el reinado del rey Gwyddno Garanhir, la senda se extendía a todos los cantrevs de Cymru así como a Hibernia."
 
 building_type_pookas_favor_01: "Favor del Pooka"
 building_type_pookas_favor_01_desc: "#F Esta senda se extiende desde Gwynt hasta Edimburgo, y los [GetTrait('pooka').GetName(GetNullCharacter)] que la controlan no piden precio por viajar desde Cymru hasta la capital de Escocia.#!"
 building_pookas_favor_01: "Favor del Pooka"
 building_pookas_favor_01_desc: "Esta senda se extiende desde Gwynt hasta Edimburgo, y los [GetTrait('pooka').GetName(GetNullCharacter)] que la controlan no piden precio por viajar desde Cymru hasta la capital de Escocia.\n\nSin embargo, cuando un viajero intenta regresar a Gwynt desde Escocia, la tarifa de vuelta es cara, al menos en términos de orgullo. El mero dinero no tiene interés para los [GetTrait('pooka').GetName(GetNullCharacter)]; prefieren tartazos en la cara, cabezas afeitadas o desnudez, dependiendo de su humor y de la personalidad del viajero."
 
 building_type_pen_mynydd_01: "Pen Mynydd"
 building_type_pen_mynydd_01_desc: "#F Llevando desde el monte Snowdon en Cymru hasta Ben Nevis en Escocia, esta es una senda secreta de los [GetTrait('sluagh').GetName(GetNullCharacter)] Unseelie, guardada celosamente por los ban durrag escoceses que la mantienen. Estas viles criaturas llaman a esta senda el Retorcimiento de Ban-Durrag.#!"
 building_pen_mynydd_01: "Pen Mynydd"
 building_pen_mynydd_01_desc: "El Retorcimiento de Ban-Durrag es una serie de sendas que conectan las alturas de Ben Nevis con las alcantarillas de Glasgow y los riscos del monte Snowdon en Gales. Los Ban-Durrag que controlan estas sendas forman un grupo de [GetTrait('sluagh').GetName(GetNullCharacter)] Unseelie que las usan para esconder los cuerpos de sus víctimas e intercambiar información. Solo los [GetTrait('sluagh').GetName(GetNullCharacter)] pueden escurrirse por las entradas de estos túneles."
 
 building_type_cefn_yr_oguf_01: "Cefn yr Oguf"
 building_type_cefn_yr_oguf_01_desc: "#F Recorriendo desde Clwyd hasta el Puente de Londres y subiendo hasta Chester, esta senda es un premio muy disputado en Clwyd.#!"
 building_cefn_yr_oguf_01: "Cefn yr Oguf"
 building_cefn_yr_oguf_01_desc: "Recorriendo desde Clwyd hasta el Puente de Londres y subiendo hasta Chester, esta senda es un premio muy disputado en Clwyd." 
 
 building_type_camelot_01: "Camelot"
 building_type_camelot_01_desc: "#F Como prueba, os doy Camelot. No son muchos los que recuerdan que la leyenda del Rey Arturo surgió primero en Cymru, en el incomparable relato de Culhwch y Olwen, que es demasiado largo para contar aquí. Lo que digo es que los cuentos de Arturo brotan de esta tierra de Gales, sin importar las versiones de la Edad Oscura que escuchéis ahora, la propaganda inventada por la Tecnocracia.#!"
 building_camelot_01: "Camelot en Ruinas"
 building_camelot_01_desc: "Las leyendas reales, el verdadero corazón de Camelot, han crecido en el [UmbraGlossary('dreaming')]. Todas las visiones del mito de Arturo existen allí juntas, y todas son correctas. Los personajes de las historias viven allí, como vosotros y yo aquí, pero en sus muchos aspectos, y nosotros, que los alcanzamos, vemos solo un aspecto a la vez, como podríais ver solo un destello de las muchas facetas de un diamante."
 building_camelot_02: "Camelot en Recuperación"
 building_camelot_02_desc: "Las leyendas reales, el verdadero corazón de Camelot, han crecido en el [UmbraGlossary('dreaming')]. Todas las visiones del mito de Arturo existen allí juntas, y todas son correctas. Los personajes de las historias viven allí, como vosotros y yo aquí, pero en sus muchos aspectos, y nosotros, que los alcanzamos, vemos solo un aspecto a la vez, como podríais ver solo un destello de las many facetas de un diamante."
 building_camelot_03: "Camelot Triunfante"
 building_camelot_03_desc: "Las leyendas reales, el verdadero corazón de Camelot, han crecido en el [UmbraGlossary('dreaming')]. Todas las visiones del mito de Arturo existen allí juntas, y todas son correctas. Los personajes de las historias viven allí, como vosotros y yo aquí, pero en sus muchos aspectos, y nosotros, que los alcanzamos, vemos solo un aspecto a la vez, como podríais ver solo un destello de las many facetas de un diamante."
 
 building_type_chaw_gully_mine_01: "Mina de Chaw Gully"
 building_type_chaw_gully_mine_01_desc: "#F En la [Glossary('Mythic Age','game_concept_mythic_age_desc')], cuando los #TOOLTIP:GAME_TRAIT,nocker,[GetNullCharacter] #L Nockers#!#! eran todavía un linaje joven, llegaron a las tierras que un día se llamarían Cornualles y la cresta de Challacombe. En su codicia por el estaño, pero más aún por el oro, que yacía bajo la tierra, arrancaron el corazón mismo del páramo.#!"
 building_chaw_gully_mine_01: "Mina Bloqueada"
 building_chaw_gully_mine_01_desc: "Las leyendas dicen que, aparte del estaño de la zona, había oro. Y había... mucho. Los #TOOLTIP:GAME_TRAIT,nocker,[GetNullCharacter] #L Nockers#!#! solo insinuaban la cantidad real para mantener vivos los sueños, pero rara vez permitían que los mortales lo encontraran." 
 building_chaw_gully_mine_02: "Mina Reabierta"
 building_chaw_gully_mine_02_desc: "Las leyendas dicen que, aparte del estaño de la zona, había oro. Y había... mucho. Los #TOOLTIP:GAME_TRAIT,nocker,[GetNullCharacter] #L Nockers#!#! solo insinuaban la cantidad real para mantener vivos los sueños, pero rara vez permitían que los mortales lo encontraran." 
 building_chaw_gully_mine_03: "Mina Excavada"
 building_chaw_gully_mine_03_desc: "Las leyendas dicen que, aparte del estaño de la zona, había oro. Y había... mucho. Los #TOOLTIP:GAME_TRAIT,nocker,[GetNullCharacter] #L Nockers#!#! solo insinuaban la cantidad real para mantener vivos los sueños, pero rara vez permitían que los mortales lo encontraran." 
 
 building_type_balors_tower_01: "Torre de Balor"
 building_type_balors_tower_01_desc: "#F En el extremo oriental de la isla Tory, un promontorio rocoso llamado Torre de Balor marca el legendario hogar de Balor del Ojo Maligno.#!"
 building_balors_tower_01: "Torre de Balor"
 building_balors_tower_01_desc: "En el extremo oriental de la isla Tory, un promontorio rocoso llamado Torre de Balor marca el legendario hogar de Balor del Ojo Maligno." 
 
 building_type_brides_lodge_01: "Logia de la Novia"
 building_type_brides_lodge_01_desc: "#F Justo al oeste de Glastonbury, a orillas de un río, se encuentra otra colina, llamada Túmulo de la Novia por los lugareños. Cerca del pie del Túmulo de la Novia se alza una casa de tres plantas con un pequeño jardín exterior, en el número 19 de Bride's Lane.#!"
 building_brides_lodge_01: "Logia de la Novia"
 building_brides_lodge_01_desc: "Justo al oeste de Glastonbury, a orillas de un río, se encuentra otra colina, llamada Túmulo de la Novia por los lugareños. Cerca del pie del Túmulo de la Novia se alza una casa de tres plantas con un pequeño jardín exterior, en el número 19 de Bride's Lane.\n\nLa casa es uno de los feudos más antiguos de todo Albión. Consta de una docena de pequeños dormitorios (la mayoría en la segunda y tercera planta), una cocina, un baño y una gran sala de reuniones en el centro. Aunque a lo largo de los años mucho ha cambiado en la casa, una cosa permanece igual: el hogar. El punto focal de la sala principal es un gran hogar de piedra, donde el Gran Fuego de Albión ha ardido desde tiempos inmemoriales." 
 
 building_type_bullring_01: "Plaza de Toros"
 building_type_bullring_01_desc: "#F La Plaza de Toros se encuentra en Barcelona, España, y si recibió su nombre por los actos de audacia que los invitados han realizado allí o por la cantidad de verdad que hay tras las historias que comparten es una cuestión de opinión.#!"
 building_bullring_01: "Plaza de Toros"
 building_bullring_01_desc: "La Plaza de Toros se encuentra en Barcelona, España, y si recibió su nombre por los actos de audacia que los invitados han realizado allí o por la cantidad de verdad que hay tras las historias que comparten es una cuestión de opinión.\n\nEn cualquier caso, es un lugar agradable: un recinto elegante para los ojos mortales y un gran castillo antiguo de estilo morisco para los quiméricos." 
 
 building_type_rock_of_cashel_01: "Cashelmore"
 building_type_rock_of_cashel_01_desc: "#F Elevándose 60 metros sobre las llanuras del condado de Tipperary, la colina escarpada y rocosa conocida como la Roca de Cashel sirvió tanto de lugar desde el que gobernaban los reyes de Munster como de hito religioso.#!"
 building_rock_of_cashel_01: "Cashelmore"
 building_rock_of_cashel_01_desc: "Elevándose 60 metros sobre las llanuras del condado de Tipperary, la colina escarpada y rocosa conocida como la Roca de Cashel sirvió tanto de lugar desde el que gobernaban los reyes de Munster como de hito religioso.\n\nDentro de la roca, accesible a través de una puerta oculta cerca de la base de la colina, se encuentra Cashelmore." 
 
 building_type_dun_aenghus_01: "Dún Aenghus"
 building_type_dun_aenghus_01_desc: "#F Antaño el hogar fortaleza de un legendario caudillo Fir-bholg tras el exilio de esa raza por los Tuatha de Danaan al oeste de Irlanda, Dún Aenghus se convirtió más tarde en un poderoso lugar de magia de hadas.#!"
 building_dun_aenghus_01: "Dún Aenghus"
 building_dun_aenghus_01_desc: "Antaño el hogar fortaleza de un legendario caudillo Fir-bholg tras el exilio de esa raza por los Tuatha de Danaan al oeste de Irlanda, Dún Aenghus se convirtió más tarde en un poderoso lugar de magia de hadas.\n\nTras su abandono por los habitantes originales, un príncipe de la Casa Dougal descubrió la asociación innata del triple círculo de piedra con la magia latente de la tierra. Usando Glamour para evocar y despertar el poder dormido, este príncipe sin nombre construyó una enorme cámara del tesoro en la que albergar algunas de las posesiones más valiosas de los sidhe." 
 
 building_type_emain_macha_01: "Emain Macha"
 building_type_emain_macha_01_desc: "#F Las leyendas se refieren al fuerte de Navan como Emain Macha (\"Gemelos de Macha\") y lo asocian con la maldición agonizante de la veloz esposa de Cruinniuc.#!"
 building_emain_macha_01: "Emain Macha"
 building_emain_macha_01_desc: "Las leyendas se refieren al fuerte de Navan como Emain Macha (\"Gemelos de Macha\") y lo asocian con la maldición agonizante de la veloz esposa de Cruinniuc.\n\nEl palacio es hermoso, su extraña geometría y los colores oscuros y ricos de su interior inducen un temperamento que rezuma el peso de la historia y la leyenda, lleno de violencia latente y profunda pasión." 
 
 building_type_glenlea_01: "Glenlea"
 building_type_glenlea_01_desc: "#F No muy lejos de Glencolumbkille, aunque no se encontrará en ningún mapa, se halla la aldea de hadas de Glenlea, un pequeño pueblo encantado habitado enteramente por Kithain y unos pocos mortales encantados con la suerte (o la desgracia) suficiente para toparse con uno de los aldeanos y recibir una invitación para \"dejar atrás las preocupaciones del mundo\".#!"
 building_glenlea_01: "Glenlea"
 building_glenlea_01_desc: "No muy lejos de Glencolumbkille, aunque no se encontrará en ningún mapa, se halla la aldea de hadas de Glenlea, un pequeño pueblo encantado habitado enteramente por Kithain y unos pocos mortales encantados con la suerte (o la desgracia) suficiente para toparse con uno de los aldeanos y recibir una invitación para \"dejar atrás las preocupaciones del mundo\".\n\nEl pueblo en sí consiste en una calle principal flanqueada por tiendas y casas con techos de paja, con algunos callejones laterales que conducen a otras viviendas." 
 
 building_type_shalott_01: "Shalott"
 building_type_shalott_01_desc: "#F Los estudiosos estipulan que un feudo que no sobrevivió fue la base de los relatos de \"Shalott\".#!"
 building_shalott_01: "Shalott Perdida"
 building_shalott_01_desc: "Los estudiosos estipulan que un feudo que no sobrevivió fue la base de los relatos de \"Shalott\".\n\nUna torre encantada cuyos habitantes estaban malditos a conocer el mundo mortal solo a través de las visiones del mismo que aparecían en un tapiz mágico." 
 
 building_type_tuath_of_chronos_01: "Tuath de Cronos"
 building_type_tuath_of_chronos_01_desc: "#F El Tuath de Cronos es un lugar misterioso que se cree que está en un túmulo de hadas en algún lugar de las orillas del Tay. Muchas hadas creen que un poderoso Vidente de Cronos y su esposa hada lograron ocultar un lugar anterior al [Glossary('Shattering','game_concept_shattering_desc')] de los estragos del tiempo y la Banalidad.#!"
 building_tuath_of_chronos_01: "Tuath de Cronos"
 building_tuath_of_chronos_01_desc: "Si un linaje divisa un montículo coronado por un enorme árbol con muchas ramas, cada una con nuevos brotes de hojas, mientras deambula por las orillas del Tay, puede que se encuentre con el Tuath de Cronos. Un cuerno de plata cuelga de una de las ramas y, acunado por las enormes raíces del árbol, hay un pozo hecho de piedra blanca. Los magos y las hadas que viven en este tuath guardan sus secretos celosamente."
 
 building_type_pearl_of_dawn_01: "Perla del Amanecer"
 building_type_pearl_of_dawn_01_desc: "#F El feudo rodea un exuberante oasis y se encuentra en la convergencia de varias sendas importantes en el [UmbraGlossary('dreaming')], y ha adquirido reputación dentro de la Tribu como punto de partida de muchos viajes únicos, ya que la mezcla ecléctica de hadas que se encuentra allí prácticamente asegura que estalle una aventura tarde o temprano.#!"
 building_pearl_of_dawn_01: "Perla del Amanecer"
 building_pearl_of_dawn_01_desc: "El feudo rodea un exuberante oasis y se encuentra en la convergencia de varias sendas importantes en el [UmbraGlossary('dreaming')], y ha adquirido reputación dentro de la Tribu como punto de partida de muchos viajes únicos, ya que la mezcla ecléctica de hadas que se encuentra allí prácticamente asegura que estalle una aventura tarde o temprano."
 
 building_type_garden_of_olives_01: "Huerto de los Olivos"
 building_type_garden_of_olives_01_desc: "#F El Huerto de los Olivos acoge a linajes de todo el mundo. El gobernante dirige y actúa regularmente en representaciones de los dramas griegos clásicos.#!"
 building_garden_of_olives_01: "Huerto de los Olivos"
 building_garden_of_olives_01_desc: "El Huerto de los Olivos acoge a linajes de todo el mundo. El gobernante dirige y actúa regularmente en representaciones de los dramas griegos clásicos."
 
 building_type_eternal_story_01: "Historia Eterna"
 building_type_eternal_story_01_desc: "#F Desde la Historia Eterna, cerca de las afueras de Addis Abeba, el gobernante orquesta una colección considerable de eshu, sátiros y #TOOLTIP:GAME_TRAIT,pooka,[GetNullCharacter] #L Pookas#!#!.#!"
 building_eternal_story_01: "Historia Eterna"
 building_eternal_story_01_desc: "Desde la Historia Eterna, cerca de las afueras de Addis Abeba, el gobernante orquesta una colección considerable de eshu, sátiros y #TOOLTIP:GAME_TRAIT,pooka,[GetNullCharacter] #L Pookas#!#!."
 
 building_type_oasis_of_lingering_dreams_01: "Oasis de los Sueños Persistentes"
 building_type_oasis_of_lingering_dreams_01_desc: "#F Los linajes de Arabia Saudí combinan la elegancia del desierto con los relatos románticos de las tribus beduinas. El gobernante actual habita en su feudo, el Oasis de los Sueños Persistentes, situado en el desierto a las afueras de la capital, Riad.#!"
 building_oasis_of_lingering_dreams_01: "Oasis de los Sueños Persistentes"
 building_oasis_of_lingering_dreams_01_desc: "Los linajes de Arabia Saudí combinan la elegancia del desierto con los relatos románticos de las tribus beduinas. El gobernante actual habita en su feudo, el Oasis de los Sueños Persistentes, situado en el desierto a las afueras de la capital, Riad."
 
 building_type_grimsfen_tor_01: "Grimsfen Tor"
 building_type_grimsfen_tor_01_desc: "#F Un túmulo de hadas particularmente poderoso y antiguo en Grimsfen Tor, en las Midlands.#!"
 building_grimsfen_tor_01: "Grimsfen Tor"
 building_grimsfen_tor_01_desc: "Un túmulo de hadas particularmente poderoso y antiguo en Grimsfen Tor, en las Midlands."
 
 building_type_grand_bazaar_01: "El Gran Bazar"
 building_type_grand_bazaar_01_desc: "#F Aquellos perdidos en interminables dunas de arena o escondidos en los páramos estériles del desierto pueden ver este oasis y ciudad de tiendas como un espejismo borroso en el horizonte.\n\nLas oportunidades son infinitas, pero el Bazar es como un glorioso tapiz que descansa ligeramente sobre un nido de víboras.#!" 
 building_grand_bazaar_01: "El Gran Bazar"
 building_grand_bazaar_01_desc: "Aquellos perdidos en interminables dunas de arena o escondidos en los páramos estériles del desierto pueden ver este oasis y ciudad de tiendas como un espejismo borroso en el horizonte.\n\nLas oportunidades son infinitas, pero el Bazar es como un glorioso tapiz que descansa ligeramente sobre un nido de víboras." 
