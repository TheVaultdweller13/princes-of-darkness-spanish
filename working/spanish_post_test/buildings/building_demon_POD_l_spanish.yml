l_spanish:
 building_type_bastion_01: "Bastión"
 building_type_bastion_01_desc: "#F Los Bastiones eran fortalezas de los Elohim rebeldes en la Guerra de la Ira en la Tierra, donde reunían sus fuerzas, perfeccionaban sus habilidades y daban tutoría a sus consortes mortales.#!"
 building_bastion_01: "Bastión Pequeño"
 building_bastion_01_desc: "Hay un pequeño puesto de avanzada aquí que sirve como base para un Bastión. Aún queda mucho trabajo por hacer."
 building_bastion_02: "Bastión Grande"
 building_bastion_02_desc: "Lo que antaño fue un pequeño puesto de avanzada se ha convertido en una fortaleza respetable, donde vuestra posición es ahora decentemente fuerte."
 building_bastion_03: "Bastión Gargantuesco"
 building_bastion_03_desc: "Este complejo en expansión es un baluarte denso y bizantino contra vuestros enemigos."
 building_bastion_04: "Bastión Colosal"
 building_bastion_04_desc: "Imponente y glorioso, este baluarte de vuestro poder es un testimonio de vuestra voluntad."
 building_bastion_05: "Bastión Enorme"
 building_bastion_05_desc: "Suficiente para rivalizar con las puertas del cielo, vuestro Bastión podría resistir cualquier asalto mortal."
 building_bastion_06: "Bastión Monumental"
 building_bastion_06_desc: "Desde aquí, podríais resistir los Fuegos de la Revelación."
 
 building_type_ministry_of_dragons_01: "Censores del Culto"
 building_type_ministry_of_dragons_01_desc: "#F El Ministerio de los Dragones, también llamados los Censores, tiene la tarea de cuestionar y desafiar la autoridad. Dicha autoridad es Dios, por supuesto.#!"
 building_ministry_of_dragons_01: "Censores Menores del Culto"
 building_ministry_of_dragons_01_desc: "Aquí dentro, tenéis unas pocas almas dedicadas a ayudar a los mortales a cuestionar sus necias creencias."
 building_ministry_of_dragons_02: "Censores Respetables del Culto"
 building_ministry_of_dragons_02_desc: "Imitando ahora las oficinas menores de los Caídos que aún están atrapados en el Abismo, la influencia de los Censores ha comenzado a crecer."
 building_ministry_of_dragons_03: "Censores Mayores del Culto"
 building_ministry_of_dragons_03_desc: "Incluso los mortales a vuestro alrededor están empezando a cuestionar su propósito y la divinidad misma, haciendo eco de las llamadas de vuestros Censores."
 building_ministry_of_dragons_04: "Grandes Censores del Culto"
 building_ministry_of_dragons_04_desc: "Vuestros Censores son ahora influyentes en toda la región, expandiendo el poder del que ellos, y por extensión vos, os nutrís."
 building_ministry_of_dragons_05: "Poderosos Censores del Culto"
 building_ministry_of_dragons_05_desc: "Incluso los otros Atados a la Tierra vacilan ahora bajo las desgastantes preguntas de vuestros Censores; vuestra influencia es innegable."
 building_ministry_of_dragons_06: "Censores Eternos del Culto"
 building_ministry_of_dragons_06_desc: "Que nada sea cuestionado. Que todo esté permitido. Vos y vuestra verdad sois todo lo que hay. Ninguna otra creencia es segura."
 
 building_type_ministry_of_eagles_01: "Vigías del Culto"
 building_type_ministry_of_eagles_01_desc: "#F Los Vigías del Culto, también llamados el Ministerio de las Águilas, tienen la tarea de obtener inteligencia sobre enemigos potenciales.#!"
 building_ministry_of_eagles_01: "Vigías Menores del Culto"
 building_ministry_of_eagles_01_desc: "Ahora tenéis unos pocos espías, vuestros primeros Vigías, comenzando a expandir vuestra mirada."
 building_ministry_of_eagles_02: "Vigías Respetables del Culto"
 building_ministry_of_eagles_02_desc: "Vuestros Vigías tienen ahora una influencia profunda sobre el distrito de vuestra base de operaciones, informándoos regularmente."
 building_ministry_of_eagles_03: "Vigías Mayores del Culto"
 building_ministry_of_eagles_03_desc: "Todo el centro de población de este dominio está ahora bajo vuestra mirada, y pocas cosas pasan por aquí sin vuestro conocimiento."
 building_ministry_of_eagles_04: "Grandes Vigías del Culto"
 building_ministry_of_eagles_04_desc: "Tanto los secretos como los cotilleos os son conocidos; la mirada de vuestros Vigías cubre ahora las zonas rurales, casi nada escapa a vuestra vista."
 building_ministry_of_eagles_05: "Poderosos Vigías del Culto"
 building_ministry_of_eagles_05_desc: "Vuestros Vigías conocen ahora todas las cosas en esta área, y vuestros espías no tienen parangón, siendo la envidia incluso de los otros Atados a la Tierra."
 building_ministry_of_eagles_06: "Vigías Eternos del Culto"
 building_ministry_of_eagles_06_desc: "Habrá historias de un 'Gran Hermano' que los mortales contarán. Vos habéis ascendido más allá de eso."
 
 building_type_ministry_of_aurochs_01: "Guardianes del Culto"
 building_type_ministry_of_aurochs_01_desc: "#F Los Guardianes del Culto, también llamados el Ministerio de los Uros, tienen la tarea de defender la Corte y hacer cumplir sus leyes.#!"
 building_ministry_of_aurochs_01: "Guardianes Menores del Culto"
 building_ministry_of_aurochs_01_desc: "Ahora tenéis un pequeño equipo de guardaespaldas, vuestros primeros Guardianes destinados a defenderos en este dominio."
 building_ministry_of_aurochs_02: "Guardianes Respetables del Culto"
 building_ministry_of_aurochs_02_desc: "Una pequeña fuerza está aquí ahora, suficiente para proporcionar un destacamento de seguridad respetable."
 building_ministry_of_aurochs_03: "Guardianes Mayores del Culto"
 building_ministry_of_aurochs_03_desc: "El alcance de vuestro poder es ahora suficiente para tener un pequeño ejército de Guardianes a vuestro mando."
 building_ministry_of_aurochs_04: "Grandes Guardianes del Culto"
 building_ministry_of_aurochs_04_desc: "Vuestros Guardianes abarcan ahora vuestra corte, su sola influencia disuade la violencia (o la fomenta cuando surge la necesidad)."
 building_ministry_of_aurochs_05: "Poderosos Guardianes del Culto"
 building_ministry_of_aurochs_05_desc: "Los Guardianes equivalen ahora a un pequeño ejército, de un grado igualado por pocos, con un poder casi sin rival."
 building_ministry_of_aurochs_06: "Guardianes Eternos del Culto"
 building_ministry_of_aurochs_06_desc: "El Cielo mismo tendría que considerar los pros y los contras de atacar a un ejército como el vuestro."
 
 building_type_ministry_of_lions_01: "Espadas del Culto"
 building_type_ministry_of_lions_01_desc: "#F Las Espadas del Culto, también llamadas el Ministerio de los Leones, tienen la tarea de luchar contra las amenazas a la Corte.#!"
 building_ministry_of_lions_01: "Espadas Menores del Culto"
 building_ministry_of_lions_01_desc: "Habéis contratado a unas pocas Espadas, que ahora actúan como 'limpiadores' para los lugareños que queréis eliminar."
 building_ministry_of_lions_02: "Espadas Respetables del Culto"
 building_ministry_of_lions_02_desc: "Una fuerza militar que ahora puede librar una buena batalla; vuestras Espadas son ahora vuestra mano derecha de confianza."
 building_ministry_of_lions_03: "Espadas Mayores del Culto"
 building_ministry_of_lions_03_desc: "Vuestras Espadas ejercen ahora su control sobre una ciudad entera, librando la guerra en su interior a vuestra entera disposición."
 building_ministry_of_lions_04: "Grandes Espadas del Culto"
 building_ministry_of_lions_04_desc: "La primera señal de vuestro alcance en expansión; los otros Caídos han comenzado a temer a vuestras leales Espadas."
 building_ministry_of_lions_05: "Poderosas Espadas del Culto"
 building_ministry_of_lions_05_desc: "Los ejércitos mortales temerían enfrentarse a un puñado de vuestras Espadas, y vuestro alcance se expande aún más, la hoja ardiente de vuestra ambición."
 building_ministry_of_lions_06: "Espadas Eternas del Culto"
 building_ministry_of_lions_06_desc: "El Cielo debería temblar ante vuestras fuerzas."
 
 building_type_ministry_of_dust_01: "Guías del Culto"
 building_type_ministry_of_dust_01_desc: "#F Los Guías del Culto, también llamados el Ministerio del Polvo, tienen la tarea de custodiar el rebaño mortal así como del avance de la Corte.#!"
 building_ministry_of_dust_01: "Guías Menores del Culto"
 building_ministry_of_dust_01_desc: "Se han asignado unos pocos guardianes a vuestros cultistas, actualmente una fuerza invisible que debe avisaros cuando surja la necesidad."
 building_ministry_of_dust_02: "Guías Respetables del Culto"
 building_ministry_of_dust_02_desc: "Vuestros Guías se mantienen ahora siempre vigilantes de vuestros cultos, en los pequeños lugares donde residen."
 building_ministry_of_dust_03: "Guías Mayores del Culto"
 building_ministry_of_dust_03_desc: "Los Guías actúan regularmente como enlaces, siendo ahora una preocupación omnipresente en las vidas de vuestros cultistas y sus enemigos."
 building_ministry_of_dust_04: "Grandes Guías del Culto"
 building_ministry_of_dust_04_desc: "Los Guías ostentan ahora un mayor poder sobre el reino local mismo, firmes protectores de vuestras fuentes de fe y poder."
 building_ministry_of_dust_05: "Poderosos Guías del Culto"
 building_ministry_of_dust_05_desc: "Los Guías son ahora campeones de vuestro dominio; vuestros cultistas están a salvo y protegidos, y sus enemigos no se atreven a dañar vuestra preciada reserva de fe."
 building_ministry_of_dust_06: "Guías Eternos del Culto"
 building_ministry_of_dust_06_desc: "Ceniza a la ceniza, polvo al polvo; todo aquí se mantiene a salvo bajo vuestra mirada eterna."
 
 building_type_theistic_cults_01: "Culto Teísta"
 building_type_theistic_cults_01_desc: "#F El teísmo, o la creencia en la existencia de dioses que se interesan personalmente por la humanidad, ofrece numerosas oportunidades para que los demonios se introduzcan en sistemas religiosos ya bien establecidos y los subviertan. Estos cultos giran en torno a la adoración de un demonio que se hace pasar por un dios o una diosa, generalmente la deidad de una cultura con leyendas de dioses que interactúan personalmente con sus creyentes.#!"
 building_theistic_cults_01: "Culto Teísta Diminuto"
 building_theistic_cults_01_desc: "Dentro de unos pocos lugares sagrados, los susurros de vuestro poder han comenzado."
 building_theistic_cults_02: "Culto Teísta Pequeño"
 building_theistic_cults_02_desc: "Unos pocos hombres santos ya no son santos; vuestra esclavitud comienza ahora a crecer de verdad."
 building_theistic_cults_03: "Culto Teísta Moderado"
 building_theistic_cults_03_desc: "Ahora tenéis un edificio entero dedicado secretamente a vuestra adoración, un faro de poder y fe solo para vos."
 building_theistic_cults_04: "Culto Teísta Grande"
 building_theistic_cults_04_desc: "¡Todos en la ciudad conocen el nombre de vuestro sumo sacerdote, y podéis atiborraros de fe, un verdadero deleite!"
 building_theistic_cults_05: "Culto Teísta Masivo"
 building_theistic_cults_05_desc: "Vuestra influencia en los corazones y la fe de los mortales ha crecido hasta ser la doctrina oficial de esta zona, con más fe de la que jamás hubierais pedido en el pasado."
 building_theistic_cults_06: "Culto Teísta Eterno"
 building_theistic_cults_06_desc: "Ni siquiera los cultos de los Elohim de días muy lejanos igualan lo que tenéis ahora."
 
 building_type_pseudo_angelic_cults_01: "Culto Pseudo-Angélico"
 building_type_pseudo_angelic_cults_01_desc: "#F El pueblo llano, crédulo, es un excelente adorador, listo para escuchar vuestras mentiras sobre la salvación y sobre ser uno de los elegidos de la Hueste de Dios.#!"
 building_pseudo_angelic_cults_01: "Culto Pseudo-Angélico Diminuto"
 building_pseudo_angelic_cults_01_desc: "Dentro de unas pocas comunidades, los susurros de vuestro poder han comenzado."
 building_pseudo_angelic_cults_02: "Culto Pseudo-Angélico Pequeño"
 building_pseudo_angelic_cults_02_desc: "La gente habla más de su salvador; vuestra esclavitud comienza ahora a crecer de verdad."
 building_pseudo_angelic_cults_03: "Culto Pseudo-Angélico Moderado"
 building_pseudo_angelic_cults_03_desc: "Ahora tenéis un edificio entero dedicado secretamente a vuestra adoración, un faro de poder y fe solo para vos."
 building_pseudo_angelic_cults_04: "Culto Pseudo-Angélico Grande"
 building_pseudo_angelic_cults_04_desc: "¡Todos en la ciudad conocen el nombre de su dios, y podéis atiborraros de fe, un verdadero deleite!"
 building_pseudo_angelic_cults_05: "Culto Pseudo-Angélico Masivo"
 building_pseudo_angelic_cults_05_desc: "Vuestra influencia en los corazones y la fe de los mortales ha crecido hasta ser la doctrina oficial de esta zona, con más fe de la que jamás hubierais pedido en el pasado."
 building_pseudo_angelic_cults_06: "Culto Pseudo-Angélico Eterno"
 building_pseudo_angelic_cults_06_desc: "Ni siquiera los cultos de los Elohim de días muy lejanos igualan lo que tenéis ahora."
 
 building_type_demonic_cults_01: "Culto Demoníaco"
 building_type_demonic_cults_01_desc: "#F Aunque todos los cultos involucrados en la adoración de demonios podrían llamarse técnicamente cultos demoníacos, el término se usa aquí para referirse a cultos que sirven a un demonio que no intenta disfrazar su verdadera naturaleza. Los adherentes de los cultos demoníacos no se hacen ilusiones sobre el tipo de criatura que veneran.#!"
 building_demonic_cults_01: "Culto Demoníaco Diminuto"
 building_demonic_cults_01_desc: "Dentro de unos pocos hogares mancillados, los susurros de vuestro poder han comenzado."
 building_demonic_cults_02: "Culto Demoníaco Pequeño"
 building_demonic_cults_02_desc: "Están apareciendo unos pocos pecadores; vuestra esclavitud comienza ahora a crecer de verdad."
 building_demonic_cults_03: "Culto Demoníaco Moderado"
 building_demonic_cults_03_desc: "Ahora tenéis un edificio entero dedicado secretamente a vuestra adoración, un faro de poder y fe solo para vos."
 building_demonic_cults_04: "Culto Demoníaco Grande"
 building_demonic_cults_04_desc: "¡Todos en la ciudad conocen el verdadero placer del pecado, y podéis atiborraros de fe, un verdadero deleite!"
 building_demonic_cults_05: "Culto Demoníaco Masivo"
 building_demonic_cults_05_desc: "Vuestra influencia en los corazones y la fe de los mortales ha crecido hasta ser la doctrina oficial de esta zona, con más fe de la que jamás hubierais pedido en el pasado."
 building_demonic_cults_06: "Culto Demoníaco Eterno"
 building_demonic_cults_06_desc: "Saben lo que sois realmente, y os aman por ello."
 
 building_type_noble_cults_01: "Culto Noble"
 building_type_noble_cults_01_desc: "#F Los nobles son muy fáciles de corromper. Después de todo, se entregan a muchos pecados por su propio estilo de vida, lo que hace que el empujón para 'experimentar solo un poco más' sea mucho más efectivo.#!"
 building_noble_cults_01: "Culto Noble Diminuto"
 building_noble_cults_01_desc: "Dentro de unos pocos salones de castillos, los susurros de vuestro poder han comenzado."
 building_noble_cults_02: "Culto Noble Pequeño"
 building_noble_cults_02_desc: "Unos pocos nobles depravados siguen vuestra llamada; vuestra esclavitud comienza ahora a crecer de verdad."
 building_noble_cults_03: "Culto Noble Moderado"
 building_noble_cults_03_desc: "Ahora tenéis un edificio entero dedicado secretamente a vuestra adoración, un faro de poder y fe solo para vos."
 building_noble_cults_04: "Culto Noble Grande"
 building_noble_cults_04_desc: "¡Todos en la ciudad conocen los deleites que podéis proporcionar, y podéis atiborraros de fe, un verdadero deleite!"
 building_noble_cults_05: "Culto Noble Masivo"
 building_noble_cults_05_desc: "Vuestra influencia en los corazones y la fe de los mortales ha crecido hasta ser la doctrina oficial de esta zona, con más fe de la que jamás hubierais pedido en el pasado."
 building_noble_cults_06: "Culto Noble Eterno"
 building_noble_cults_06_desc: "Ni siquiera los cultos de los Elohim de días muy lejanos igualan lo que tenéis ahora."
 
 feast_cost_discount_min_medium_desc: "$feast_cost_discount_effect_desc$[EmptyScope.ScriptValue('feast_activity_cost_discount_min_medium_value')|P0%]"
 feast_cost_discount_medium_max_desc: "$feast_cost_discount_effect_desc$[EmptyScope.ScriptValue('feast_activity_cost_discount_medium_max_value')|P0%]"
