l_spanish:
 POD_animal_herd_cattle_small_modifier: "Pequeño rebaño de ganado vacuno"
 POD_animal_herd_cattle_small_modifier_desc: "'Esto es una granja de vacas, vas a tener vacas fuera'."
 POD_animal_herd_cattle_moderate_modifier: "Rebaño de ganado vacuno moderado"
 POD_animal_herd_cattle_moderate_modifier_desc: "Un tamaño modesto de ganado para ser ordeñado o sacrificado."
 POD_animal_herd_cattle_large_modifier: "Gran rebaño de ganado vacuno"
 POD_animal_herd_cattle_large_modifier_desc: "Un gran rebaño de ganado que reportará al propietario unos ingresos regulares mediante la leche y el sacrificio." 
 POD_animal_herd_sheep_small_modifier: "Pequeño rebaño de ovejas"
 POD_animal_herd_sheep_small_modifier_desc: "'Baa, baa, oveja negra,\n¿tienes algo de lana?\nSí, señor, sí, señor,\ntres sacos llenos;\nuno para el amo,\notro para la dama,\ny otro para el niño\nque vive en la cañada'."
 POD_animal_herd_sheep_moderate_modifier: "Rebaño de ovejas moderado"
 POD_animal_herd_sheep_moderate_modifier_desc: "Un rebaño modesto de ovejas que proporciona lana o carne."
 POD_animal_herd_sheep_large_modifier: "Gran rebaño de ovejas"
 POD_animal_herd_sheep_large_modifier_desc: "Un gran rebaño de ovejas que reportará al propietario unos ingresos regulares mediante la lana o la carne."  
 POD_animal_herd_goats_small_modifier: "Pequeño rebaño de cabras"
 POD_animal_herd_goats_small_modifier_desc: "'¿Quién es ese que cruza mi puente?', rugió el trol.\n'Oh, solo soy yo, el más pequeño de los Chivitos Gruff, y voy a la ladera para engordar', dijo el chivo, con una voz muy pequeña.\n'Pues ahora voy a devorarte', dijo el trol."
 POD_animal_herd_goats_moderate_modifier: "Rebaño de cabras moderado"
 POD_animal_herd_goats_moderate_modifier_desc: "Un rebaño modesto de cabras que pueden ser ordeñadas o sacrificadas. Aunque son más pequeñas que el ganado vacuno, comen casi cualquier cosa y son más fáciles de mantener."
 POD_animal_herd_goats_large_modifier: "Gran rebaño de cabras"
 POD_animal_herd_goats_large_modifier_desc: "Un gran rebaño de cabras que reportará al propietario unos ingresos regulares mediante la leche y el sacrificio. Aunque son más pequeñas que el ganado vacuno, comen casi cualquier cosa y son más fáciles de mantener."   
 POD_animal_herd_pigs_small_modifier: "Pequeña piara de cerdos"
 POD_animal_herd_pigs_small_modifier_desc: "'Este cerdito fue al mercado,\neste cerdito se quedó en casa,\neste cerdito comió carne asada,\neste cerdito no tuvo nada.\nEste cerdito se fue...\n¡Oinc, oinc, oinc!,\n¡todo el camino a casa!'"
 POD_animal_herd_pigs_moderate_modifier: "Piara de cerdos moderada"
 POD_animal_herd_pigs_moderate_modifier_desc: "Una piara modesta de cerdos esperando ser sacrificados. Aunque son más pequeños que el ganado vacuno, comen casi cualquier cosa y son más fáciles de mantener."
 POD_animal_herd_pigs_large_modifier: "Gran piara de cerdos"
 POD_animal_herd_pigs_large_modifier_desc: "Una gran piara de cerdos que reportará al propietario unos ingresos regulares mediante el sacrificio. Aunque son más pequeños que el ganado vacuno, comen casi cualquier cosa y son más fáciles de mantener." 
 POD_animal_herd_reindeer_small_modifier: "Pequeña manada de renos"
 POD_animal_herd_reindeer_small_modifier_desc: "Encontrada solo en el norte, esta es una pequeña manada de renos."
 POD_animal_herd_reindeer_moderate_modifier: "Manada de renos moderada"
 POD_animal_herd_reindeer_moderate_modifier_desc: "Encontrada solo en el norte, esta es una manada modesta de renos que pueden ser sacrificados por su carne y sus pieles."
 POD_animal_herd_reindeer_large_modifier: "Gran manada de renos"
 POD_animal_herd_reindeer_large_modifier_desc: "Encontrada solo en el norte, esta es una gran manada de renos que pueden ser sacrificados por su carne y sus pieles." 
 POD_animal_herd_camel_small_modifier: "Pequeña caravana de camellos"
 POD_animal_herd_camel_small_modifier_desc: "Estas bestias de carga son ideales para los desiertos secos, incluso pueden usarse en la guerra."
 POD_animal_herd_camel_moderate_modifier: "Caravana de camellos moderada"
 POD_animal_herd_camel_moderate_modifier_desc: "Estas bestias de carga son ideales para los desiertos secos, incluso pueden usarse en la guerra. Su uso principal es el comercio a larga distancia."
 POD_animal_herd_camel_large_modifier: "Gran caravana de camellos"
 POD_animal_herd_camel_large_modifier_desc: "Estas bestias de carga son ideales para los desiertos secos, incluso pueden usarse en la guerra. Su uso principal es el comercio a larga distancia."  
 POD_animal_herd_horse_small_modifier: "Pequeña manada de caballos"
 POD_animal_herd_horse_small_modifier_desc: "Principales bestias de carga en el mundo medieval, adecuadas para tirar de un carro, arar un campo o cabalgar a la batalla."
 POD_animal_herd_horse_moderate_modifier: "Manada de caballos moderada"
 POD_animal_herd_horse_moderate_modifier_desc: "Principales bestias de carga en el mundo medieval, adecuadas para tirar de un carro, arar un campo o cabalgar a la batalla."
 POD_animal_herd_horse_large_modifier: "Gran manada de caballos"
 POD_animal_herd_horse_large_modifier_desc: "Principales bestias de carga en el mundo medieval, adecuadas para tirar de un carro, arar un campo o cabalgar a la batalla." 
 POD_animal_herd_elephant_small_modifier: "Pequeña manada de elefantes"
 POD_animal_herd_elephant_small_modifier_desc: "Animales gigantescos que son caros de domesticar, pero formidables en la guerra."
 POD_animal_herd_elephant_moderate_modifier: "Manada de elefantes moderada"
 POD_animal_herd_elephant_moderate_modifier_desc: "Animales gigantescos que son caros de domesticar, pero formidables en la guerra."
 POD_animal_herd_elephant_large_modifier: "Gran manada de elefantes"
 POD_animal_herd_elephant_large_modifier_desc: "Animales gigantescos que son caros de domesticar, pero formidables en la guerra."
