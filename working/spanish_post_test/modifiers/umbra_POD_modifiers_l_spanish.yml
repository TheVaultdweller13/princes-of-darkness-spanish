 difference_engine_modifier: "Máquina diferencial"
 difference_engine_modifier_desc: "Una calculadora mecánica automática diseñada para tabular funciones polinómicas."
 aeolipile_modifier: "Eolípila"
 aeolipile_modifier_desc: "Una turbina de vapor radial simple, sin paletas, que gira cuando se calienta el contenedor de agua central."
 antikythera_mechanism_modifier: "Mecanismo de Anticitera"
 antikythera_mechanism_modifier_desc: "Un planetario manual de la antigua Grecia, utilizado para predecir posiciones astronómicas y eclipses con décadas de antelación."
 flexible_glass_modifier: "Cuenco de vidrio flexible"
 flexible_glass_modifier_desc: "El cuenco fue sometido a una prueba para romperlo, pero simplemente se abolló en lugar de hacerse añicos."
 archimedes_death_ray_modifier: "Rayo de la muerte de Arquímedes"
 archimedes_death_ray_modifier_desc: "Una gran cantidad de espejos parabólicos y escudos pulidos hasta brillar."
 wodden_hawk_modifier: "Halcón de madera"
 wodden_hawk_modifier_desc: "Una cometa de madera hecha por Mo-tse, que podía volar en el cielo."
 wodden_ox_modifier: "Buey de madera"
 wodden_ox_modifier_desc: "Un carro de una sola rueda con dos mangos creado por Zhuge Liang."
 lingjen_modifier: "Ling Jen"
 lingjen_modifier_desc: "Una marioneta hecha por Tanshi, puede cantar y bailar, como una persona viva."
 south_pointing_chariot_modifier: "Carro que apunta al sur"
 south_pointing_chariot_modifier_desc: "Un antiguo vehículo chino de dos ruedas que llevaba un puntero móvil para indicar el sur, sin importar cómo girara el carro."
 seismoscope_modifier: "Veleta de terremotos"
 seismoscope_modifier_desc: "El sismoscopio de Zhang, capaz de determinar aproximadamente la dirección de donde provino el terremoto."
 bhaskaras_wheel_modifier: "Rueda de Bhāskara"
 bhaskaras_wheel_modifier_desc: "Una hipotética máquina de movimiento perpetuo creada por el matemático indio Bhāskara II."
 
