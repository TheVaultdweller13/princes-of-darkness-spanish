 seat_of_burning_waters_modifier: "Estudiando desde la Sede de las Aguas Ardientes"
 seat_of_burning_waters_modifier_desc: "La Sede de las Aguas Ardientes es el palacio del Señor Sonriente y el cuartel general de la Legión Sombría en Estigia. Desde aquí, el Señor Sonriente conspira contra sus compañeros Señores de la Muerte y hace grandes planes para el futuro de su rama de la Jerarquía."
 seat_of_dust_modifier: "Estudiando desde la Sede del Polvo"
 seat_of_dust_modifier_desc: "La Sede del Polvo es el palacio del Señor Esquelético y el cuartel general de la Legión Esquelética. Mientras que la mayoría de las Sedes cuentan con una forma para que los miembros de su Legión se reconecten con sus pasiones y [Fetters|E] y los resuelvan, la Sede del Polvo es única en el sentido de que es puramente para asuntos de la Legión, tanto militares como civiles."
 seat_of_golden_tears_modifier: "Estudiando desde la Sede de las Lágrimas de Oro"
 seat_of_golden_tears_modifier_desc: "La Sede de las Lágrimas de Oro es el palacio del Señor Mendigo y el cuartel general de la Legión de los Pobres. Al igual que la propia Legión, la Sede de las Lágrimas de Oro está en constante cambio a medida que se le añaden nuevos wraiths de todos los ámbitos de la vida."
 seat_of_shadows_modifier: "Estudiando desde la Sede de las Sombras"
 seat_of_shadows_modifier_desc: "La Sede de las Sombras es el palacio de la Dama de Ceniza, jefa de la Legión de Hierro de Estigia. Desde la Sede de las Sombras, la Dama de Ceniza y la Legión de Hierro supervisan su parte de la Jerarquía construyendo y reforzando las defensas de Estigia y sus necrópolis."
 seat_of_silence_modifier: "Estudiando desde la Sede del Silencio"
 seat_of_silence_modifier_desc: "La Sede del Silencio es el palacio del Señor Silencioso y el cuartel general de la Legión Silenciosa. El edificio tiene una belleza simple y ordenada que sirve de contrapunto al torbellino interno de muchos de sus residentes."
 seat_of_succor_modifier: "Estudiando desde la Sede del Socorro"
 seat_of_succor_modifier_desc: "La Sede del Socorro es el palacio de la Dama Risueña y el cuartel general de la Legión Penitente. Es uno de los pocos palacios que ha sido conquistado por otra Legión, pero muchos afirman que sus debilidades también sirven como sus fortalezas. Existe como una fortificación, pero también es una especie de clínica donde los miembros de la Legión aceptan su locura."
 seat_of_thorns_modifier: "Estudiando desde la Sede de las Espinas"
 seat_of_thorns_modifier_desc: "La Sede de las Espinas es el palacio del Señor Esmeralda y el cuartel general de la Legión Esmeralda. Brilla con el resplandor de miles de cristales de fuego de alma de color verde brillante en el propio edificio, lo que lo hace destacar entre los grises y negros lúgubres de Estigia y las [UmbraGlossary('shadowlands')]. Cada cristal está cargado con suficiente energía para enviar a un wraith directamente a un Tormento. Rodeando la belleza hay un enredo de media milla de espesor de espinas conscientes que protegen el palacio de intrusos y forman una gruesa armadura sobre el edificio en caso de asedio."
 seat_of_fate_modifier: "Estudiando desde la Sede del Destino"
 seat_of_fate_modifier_desc: "Una mansión grande y extensa de estilo ibérico, la Sede del Destino logra, no obstante, permanecer en armonía con la isla en la que descansa. Lo más notable son los árboles que crecen en los muchos patios del edificio; estos árboles son la única madera que crece en el [UmbraGlossary('dark_kingdom_of_iron')] y, junto con los juncos a lo largo del [UmbraGlossary('river_of_death')], son una de las pocas fuentes de papel en el [UmbraGlossaryLocalized('shadowlands','Inframundo')]."
 
 jade_palace_modifier: "Visitó el Palacio de Jade"
 jade_palace_modifier_desc: "El Palacio de Jade es el centro del gobierno imperial en los Manantiales Amarillos, situado en el corazón de un maelstrom perpetuo en la [UmbraGlossary('tempest')]."
 
 blessed_by_great_celestial_dragons_modifier: "Bendecido por los Grandes Dragones Celestiales"
 blessed_by_great_celestial_dragons_modifier_desc: "Estas entidades son más fuerzas de la naturaleza que bestias."
