 doomslayer_modifier: "Doomslayer"
 doomslayer_modifier_desc: "Un Doomslayer es un wraith elegido para servir a un grupo especial dedicado a la exploración y el combate en el [UmbraGlossary('pod_realm_labyrinth')]. Los Doomslayers pueden tener cualquier número de tareas, desde el simple reconocimiento del [UmbraGlossary('pod_realm_labyrinth')] hasta la captura de un espectro específico."
 
