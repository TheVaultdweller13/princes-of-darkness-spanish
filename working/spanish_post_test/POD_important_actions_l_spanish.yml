 reactive_advice_fetters_and_passions: "Ataduras, Pasiones y [oblivion_pull|E]"
 action_reactive_advice_fetters_and_passions: "Consejo: Ataduras, Pasiones y [oblivion_pull|E]"
 action_reactive_advice_fetters_and_passions_desc: "Introducción rápida a las principales mecánicas de [GetTrait('wraith').GetName(GetNullCharacter)]"
 action_reactive_advice_fetters_and_passions_click: "$click_to_open_lesson$"
 fetters_and_passions: "Ataduras, Pasiones y [oblivion_pull|E]"
 lesson_fetters_and_passions: "Ataduras, Pasiones y [oblivion_pull|E]"
 lesson_fetters_and_passions_desc: "Lo primero que debes saber es la existencia del [oblivion_pull|E] que debes monitorear de cerca para no caer ante el [GetTrait('shadow').GetName(GetNullCharacter)]. Para disminuirlo necesitas [Fetters|E], cada punto de [Fetter|E] no asignado significa un [stress|E] adicional cada mes."
 
 fetters_and_passions2: "Perder Estrés"
 lesson_fetters_and_passions2: "Perder Estrés"
 lesson_fetters_and_passions2_desc: "Los $POD_splat_wraith_plural$ no pueden perder [stress|E] excepto al activar una pasión. Para activar una pasión necesitas realizar acciones específicas detalladas en la descripción del modificador de [Fetter|E]. Cada tipo de [Fetter|E] tiene desencadenantes diferentes, como 'ODIO' que se activa después de cometer un asesinato y 'AMOR' que se activa cada año que un personaje elegido permanece con vida.\n\nEl nivel de un [Fetter|E] es una medida importante para las pasiones, ya que es un factor de cuánto estrés podrás perder usándolo y cuánto Pathos ganarás."
 
 fetters_and_passions3: "Crisis Mentales"
 lesson_fetters_and_passions3: "Crisis Mentales"
 lesson_fetters_and_passions3_desc: "Para un [GetTrait('wraith').GetName(GetNullCharacter)], sufrir una crisis mental es muy peligroso, ya que cada crisis fortalece al [GetTrait('shadow').GetName(GetNullCharacter)] otorgándote [perk|E] aleatorios del [estilo de vida|E] de [thorn_lifestyle|E] que harán el juego más difícil.\nEn #N nivel de crisis mental 2#!, el [GetTrait('shadow').GetName(GetNullCharacter)] intentará derrocarte como personalidad principal. Si tiene éxito en este empeño, te convertirás en un [GetTrait('shadow').GetName(GetNullCharacter)] con todo lo que eso conlleva.\nEn #N nivel de crisis mental 3#!, tu [GetTrait('shadow').GetName(GetNullCharacter)] intentará borrarte de la existencia. Si tiene éxito, te convertirás en un [GetTrait('spectre').GetName(GetNullCharacter)] y tu partida habrá terminado."
 
 fetters_and_passions4: "Arcanoi"
 lesson_fetters_and_passions4: "Arcanoi"
 lesson_fetters_and_passions4_desc: "A pesar de no sentirse cómodos en el mundo de los vivos, un [GetTrait('wraith').GetName(GetNullCharacter)] no está indefenso, ya que tiene acceso a [arcanoi_lifestyle|E], los poderes de los muertos.\n\nPara usarlos necesitarás aprenderlos; hay dos formas de hacerlo: la primera es aprenderlos de un [friend|E] u otra relación positiva. La segunda es, mientras exploras el [umbra|E], encontrar a otro [GetTrait('wraith').GetName(GetNullCharacter)] dispuesto a enseñarte uno de ellos.\n\nCada arcanoi requiere Pathos para usarse, y el pathos se obtiene mediante pasiones, como se explicó antes.\n\nCada arcanoi también desbloquea [domicile_building|E] que otorgan más bonificaciones."

