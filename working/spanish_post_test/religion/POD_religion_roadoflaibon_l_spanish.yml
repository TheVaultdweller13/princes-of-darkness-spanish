 laibon_desc: "Los Laibon no son una raza sobrenatural separada, pero son en muchos aspectos bastante diferentes de los vástagos 'regulares'. Atribuyen sus orígenes a dioses y leyendas africanas, a diferencia de la versión nodista de los vástagos."
