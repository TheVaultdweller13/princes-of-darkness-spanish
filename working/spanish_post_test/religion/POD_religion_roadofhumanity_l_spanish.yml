  #Prodigal-Group Faiths
  viahumanitatis: "Via Humanitatis"
  viahumanitatis_adj: "Pródigo"
  viahumanitatis_adherent: "Pródigo"
  viahumanitatis_adherent_plural: "Pródigos"
  viahumanitatis_desc: "Los seguidores de la Via Humanitatis usan la condición humana para luchar contra su Bestia, recordando que eran mortales ordinarios antes de recibir la maldición de Caín. Ponen énfasis en las virtudes humanas, como la libertad, el corazón y el alma humanos, y en la razón y la inteligencia como separadores del hombre de la bestia."
 
  viaanima: "Via Anima"
  viaanima_adj: "Anima"
  viaanima_adherent: "Inspirado"
  viaanima_adherent_plural: "Inspirados"
  viaanima_desc: "La Via Anima es comúnmente llamada la Senda del Aliento. Los Inspirados intentan encontrar significado y propósito entre los hombres mortales, compartiendo sus cargas y vidas diarias. Al hacerlo, esperan dejar de ser monstruos en su propia mente y así frenar a la Bestia. Muchos de los que recorren esta senda lo hacen puramente por instinto, sin pensar mucho en el asunto."
 
  viacommunitas: "Via Communitas"
  viacommunitas_adj: "Communitas"
  viacommunitas_adherent: "Civilizado"
  viacommunitas_adherent_plural: "Civilizados"
  viacommunitas_desc: "Comúnmente llamada la Senda de la Comunidad. Los Civilizados están más centrados en la comunidad como un todo, más que en los individuos. Rara vez se esfuerzan por exaltarse a sí mismos, y cuando lo hacen suele ser como un medio para beneficiar a la comunidad en general."
 
  vialuminis: "Via Luminis"
  vialuminis_adj: "Luminis"
  vialuminis_adherent: "Iluminado"
  vialuminis_adherent_plural: "Iluminados"
  vialuminis_desc: "Comúnmente llamada la Senda de la Iluminación. Aquellos que siguen la Senda de la Iluminación buscan el Camino Amargo hacia la [golconda|E] para dejar atrás el mundo material. Los seguidores de la Via Luminis son un grupo solitario, no necesariamente por elección, sino porque la sociedad los rehúye. El vituperio de los Salubri (y de la [golconda|E] en general) también ha servido para que la Senda parezca sospechosa a los vampiros piadosos."
 
  viavireo: "Via Vireo"
  viavireo_adj: "Vireo"
  viavireo_adherent: "Vagabundo"
  viavireo_adherent_plural: "Vagabundos"
  viavireo_desc: "Comúnmente llamada la Senda del Vigor. Aquellos que siguen la Senda del Vigor no solo están dedicados a un ideal de lo que es la humanidad, sino también a su naturaleza. Los Vagabundos se sienten atraídos por la tendencia humana a innovar, expandir sus horizontes y seguir adelante para bien o para mal. La Senda del Vigor es una senda contundente y enérgica que enfatiza el movimiento y la acción antes que la contemplación y la quietud."
  
  eternalsenate: "Senado Eterno"
  eternalsenate_adj: "Senado Eterno"
  eternalsenate_adherent: "Senador"
  eternalsenate_adherent_plural: "Senadores"
  eternalsenate_desc: "El Senado Eterno es un consejo de $pod_cainites$ modelado según el Senado Romano (aunque mucho más pequeño), para gobernar, legislar y mandar sobre los Vástagos. Los Ventrue de Roma se organizaron como lo hicieron los mortales, como una república: el Senado Eterno de los Ventrue. En el senado, cada Ventrue tiene derecho a la palabra y el poder de voto es independiente de la edad o el sexo."
  
  inconnu: "Inconnu"
  inconnu_adj: "Inconnu"
  inconnu_adherent: "Inconnu"
  inconnu_adherent_plural: "Inconnu"
  inconnu_desc: "El Inconnu es una secta de vampiros extremadamente secreta. Prácticamente no se sabe nada con certeza sobre ellos, pero algunas de las teorías más populares afirman que el grupo es una coalición de matusalenes que existe para manipular tanto a la Camarilla como al Sabbat desde las sombras, compuesta enteramente por antiguos que han renunciado a la Yihad para perseguir la [golconda|E], o un poderoso culto vinculado a los [Glossary('Antediluvians','game_concept_antediluvian_desc')]. Incluso la antigüedad de la secta es discutida, y algunos creen que se remonta a la época de Roma."
  
