  holy_order_order_of_anima: "La Orden Anima"
  holy_order_order_of_commumnitas: "Comunidad de Guerreros"
  holy_order_order_of_illuminated: "Orden de la Iluminación"
  holy_order_order_of_rovers: "Vagabundos de la Guerra"
  holy_order_legio_mortuum: "Legio Mortuum"
  holy_order_phalanx_of_entelechia: "Falange de Entelechia"
  holy_order_phalanx_of_heracleitus: "Falange de Heráclito"
  holy_order_phalanx_of_praedicanda: "Falange de Praedicanda"
  holy_order_monitors: "Monitores"
  holy_order_ignoti: "Ignoti"
  holy_order_seekers_of_golconda: "Buscadores de la Golconda"
  holy_order_the_unknown: "Los Desconocidos"
   
  childofosiris: "Hijos de Osiris"
  childofosiris_adj: "Osiriano"
  childofosiris_adherent: "Osiriano"
  childofosiris_adherent_plural: "Osirianos"
  childofosiris_desc: "Los Hijos de Osiris creen en el folclore egipcio y ven su papel como algo sagrado, combatiendo la \"oscuridad\" de los Setitas con la \"luz\" de Osiris.\nCasi destruidos durante las primeras guerras contra Set, ahora viven en reclusión y escondidos, esperando el regreso de Osiris para liderarlos una vez más."
    
  amaranthans: "Amarantinos"
  amaranthans_adj: "Amarantinos"
  amaranthans_adherent: "Amarantino"
  amaranthans_adherent_plural: "Amarantinos"
  amaranthans_desc: "Un pequeño grupo de $pod_cainites$ dedicados a cazar diabolistas. Usan el nombre de la primera víctima de la $pod_diablerie$ como compromiso con su tarea."
