  viatantabus: "Via Tantabus"
  viatantabus_adj: "Tantabus"
  viatantabus_adherent: "Cazador"
  viatantabus_adherent_plural: "Cazadores"
  viatantabus_desc: "Vampiros que siguen a la todopoderosa Baba Yaga, la Bruja de Rusia. La única Nosferatu que ha desafiado a su monstruoso progenitor, la Abuela es tanto admirada como revocada en igual medida por su $pod_clan$."
  
