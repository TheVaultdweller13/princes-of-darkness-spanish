  #Feral-Group Faiths
  viabestiae: "Via Bestiae"
  viabestiae_adj: "Feral"
  viabestiae_adherent: "Feral"
  viabestiae_adherent_plural: "Ferales"
  viabestiae_desc: "Los seguidores de la Vía de la Bestia controlan a su Bestia a través de los conceptos primordiales de supervivencia, fuerza e individualidad. Muchos miembros de la Vía de la Bestia eligen una existencia simple y animalista para servir mejor a las creencias de la Via Bestiae, mientras que otros la siguen viviendo una existencia simplista, similar a la de los bárbaros."
 
  viapraedator: "Via Praedator"
  viapraedator_adj: "Praedator"
  viapraedator_adherent: "Cazador"
  viapraedator_adherent_plural: "Cazadores"
  viapraedator_desc: "Los ferales que siguen la Senda del Cazador existen para depredar a aquellos que consideran inferiores a ellos. Hacer lo contrario es blasfemo. También usan a su Bestia como una herramienta para llevar a cabo sus cacerías."
 
  viaerronis: "Via Erronis"
  viaerronis_adj: "Vagabundo"
  viaerronis_adherent: "Vagabundo"
  viaerronis_adherent_plural: "Vagabundos"
  viaerronis_desc: "Para estos ferales que siguen la Senda del Nómada, la civilización y cualquier cosa asociada con ella es anatema. Viajan ligeros y viajan siempre. También ha sido llamada la Senda de los Viajes."
 
  viaferitas: "Via Feritas"
  viaferitas_adj: "Salvaje"
  viaferitas_adherent: "Salvaje"
  viaferitas_adherent_plural: "Salvajes"
  viaferitas_desc: "Los ferales en la Senda del Salvaje son los más propensos a desatar a la Bestia en ataques de rabia. Su furia se dirige hacia cualquier cosa que consideren débil, especialmente la civilización. Golpean a menudo y golpean fuerte."
 
  viavenatorumbra: "Via Venator Umbra"
  viavenatorumbra_adj: "Venator Umbra"
  viavenatorumbra_adherent: "Cazador Gris"
  viavenatorumbra_adherent_plural: "Cazadores Grises"
  viavenatorumbra_desc: "Si hay ferales que no detestan el concepto de civilización, son estos que siguen la Senda del Cazador Gris. Más bien, ven los pueblos y ciudades como una forma diferente de coto de caza. Son los más civilizados de los ferales, pero no te equivoques, ya que no son menos capaces de cazar que los demás."
  
  vialiberatio: "Via Liberatio"
  vialiberatio_adj: "Liberatio"
  vialiberatio_adherent: "Liberador"
  vialiberatio_adherent_plural: "Liberadores"
  vialiberatio_desc: "A menudo confundidos con los Furores, los ferales de la Via Liberatio ven las ciudades como una trampa y la muerte del alma. Ven su deber como liberar a la gente atrapada hacia una forma de vida más pura y primordial."
 
  viaeinherjar: "Einherjar"
  viaeinherjar_adj: "Einherjar"
  viaeinherjar_adherent: "Einherjar"
  viaeinherjar_adherent_plural: "Einherjar"
  viaeinherjar_desc: "Una Vía practicada entre los vampiros nórdicos que sirve como recordatorio de la antigua ética que el Padre de Todos les dio. La Vía enseña responsabilidad, valor ante la adversidad e iniciativa individual. Muchos ahuyentan a la Bestia mediante actos de disciplina de voluntad de hierro y valor, como observar la salida del sol. La mayoría de los seguidores de la Vía son irrespetuosos, egoístas y físicamente abusivos con aquellos a quienes no respetan. A menudo, incluso las personas a las que sí respetan son tratadas solo un poco mejor."
  
  viayasaq: "Yasaq"
  viayasaq_adj: "Yasa"
  viayasaq_adherent: "Anda"
  viayasaq_adherent_plural: "Anda"
  viayasaq_desc: "Una Vía de los vampiros de la Estepa, específicamente de los [Glossary('Anda','podgloss.anda')]. Recordaba muchas de las tradiciones de yasa (hermandades de guerreros) entre los mongoles. Los seguidores de la Vía de la Yasa eran llamados bárbaros entre los occidentales."
  
  pathofnoiad: "Senda de los Noiad"
  pathofnoiad_adj: "Noiad"
  pathofnoiad_adherent: "Noiad"
  pathofnoiad_adherent_plural: "Noiads"
  pathofnoiad_desc: "El origen de los Noiads ha sido olvidado tanto por $pod_cainite$ como por mortales. En la mente de los Noiads, siempre habitaron en el Norte, guiando y protegiendo a las tribus Sámi en el norte de Escandinavia. Los Noiads se creían seres divinos, enviados por los dioses para guiar y proteger a su pueblo elegido de las amenazas sobrenaturales y mundanas, así como para interpretar los presagios de los Dioses en el guovssahas. La relación entre los Noiads y su tribu era algo simbiótica: el Noiad protegía a la tribu de los enemigos y actuaba como guía, chamán y maestro para ellos, mientras que la tribu entregaba voluntariamente su sangre y daba cobijo al Noiad durante los largos meses sin oscuridad. En tiempos de hambruna, el Noiad convertía en [ghoul|E] a miembros de la tribu para asegurar su supervivencia. El Noiad habitaba abiertamente entre los Sámi, y Abrazaba exclusivamente de esta población. Los seleccionados para el $pod_Embrace$ solían ser aquellos con talento para la adivinación, así como para la interpretación de sueños y estrellas. El Noiad también vigilaba a los niños descendientes de familias que incluían al menos a un vampiro, buscando los rasgos que favorecían."
  
