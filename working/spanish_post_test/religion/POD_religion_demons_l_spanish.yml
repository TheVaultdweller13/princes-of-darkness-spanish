 avarice: "Avaricia"
 avarice_adj: "Avaro"
 avarice_desc: "Los demonios de la avaricia quieren poseerlo todo, controlar todo lo que ven y negárselo a los demás. A diferencia de los glotones, los demonios codiciosos no quieren consumir las cosas que codician, quieren conservarlas para siempre, mucho después de que se hayan desmoronado en la inutilidad. Los demonios de la avaricia tienden a ser sutiles y astutos, vigilando las ganancias a largo plazo; para un ser inmortal, no es un gran esfuerzo pasar tres siglos ganando influencia sobre un país o un culto, siempre que se tenga el control total al final."
 avarice_adherent: "Demonio de la Avaricia"
 avarice_adherent_plural: "Demonios de la Avaricia"

 envy: "Envidia"
 envy_adj: "Envidioso"
 envy_desc: "Los demonios de la envidia buscan destruir a quienes poseen lo que a los demonios les falta: libertad, amor, esperanza y el consuelo de la bendición de Dios. Tales demonios no quieren esas cosas para sí mismos; lo que quieren es castigar a quienes tienen la audacia de poseer tales cosas, que se sienten superiores por tener tales bendiciones. Solo después de arrastrar a todos los demás al fango pueden estos demonios sentirse satisfechos, sabiendo que nadie más en la Creación es más feliz que ellos."
 envy_adherent: "Demonio de la Envidia"
 envy_adherent_plural: "Demonios de la Envidia"

 gluttony: "Gula"
 gluttony_adj: "Glotón"
 gluttony_desc: "Los demonios de la gula ansían las sensaciones, complacer cada apetito y deseo más allá del punto de saciedad y seguir adelante. Los mortales suelen asociar la gula con el deseo de comida, pero en realidad es simplemente el deseo de consumir, de usar más recursos de los necesarios. Un demonio en un frenesí glotón elige un recurso particular —comida, fe, vidas humanas— y siente un gozo obsceno no solo al agotar o destruir esa cosa, sino al alardear de la destrucción y el consumo ante aquellos que ahora se ven obligados a prescindir de ella."
 gluttony_adherent: "Demonio de la Gula"
 gluttony_adherent_plural: "Demonios de la Gula"

 lust: "Lujuria"
 lust_adj: "Lujurioso"
 lust_desc: "Los demonios de la lujuria se pierden en los impulsos y sensaciones de lo físico, enloquecidos por las posibilidades de la indulgencia física. Estos demonios poseen seguidores de forma regular, atiborrándose de placer y actividad antes de deleitarse con las sensaciones de las horribles muertes de sus recipientes. Los demonios lujuriosos suelen estar obsesionados con el sexo, pero no es la única forma de placer físico que desean: se embarcan en orgías de comida, lucha, bebida y destrucción en el tiempo que tienen disponible en un recipiente."
 lust_adherent: "Demonio de la Lujuria"
 lust_adherent_plural: "Demonios de la Lujuria"

 pride: "Soberbia"
 pride_adj: "Soberbio"
 pride_desc: "Todos los demonios comprenden el pecado de la soberbia, quizás mejor de lo que los humanos podrían hacerlo jamás. Fue la soberbia el Primer Pecado, el pecado de Lucifer y de todos los ángeles que se rebelaron contra Dios en lugar de aceptar Sus decretos. Los demonios de la soberbia siguen situándose por encima de todas las demás entidades y exigen la adoración y adulación de mortales y demonios por igual. Perdido en la arrogancia, un demonio soberbio podría arrasar una ciudad como castigo por un desaire menor, o torturar a una sociedad entera hasta que cada miembro acepte amarle y adorarle incondicionalmente."
 pride_adherent: "Demonio de la Soberbia"
 pride_adherent_plural: "Demonios de la Soberbia"

 sloth: "Pereza"
 sloth_adj: "Perezoso"
 sloth_desc: "Los demonios de la pereza no son precisamente vagos; esa es una visión mortal y errónea del pecado. La pereza es la necesidad de simplicidad, de conveniencia; un desinterés por el mundo, en última instancia sociopático. Los demonios de la pereza son casi todos demonios de la muerte, que antaño guiaban a las almas hacia sus recompensas finales. Ahora ansían la soledad y la calma de la muerte, la serenidad de un mundo vacío. Estos demonios son raros, porque la nada del Infierno tiende a tragárselos para siempre; los que quedan son monstruos que apagarían un país para silenciar a un niño que llora, que anhelan la destrucción absoluta y un mundo de polvo y lápidas."
 sloth_adherent: "Demonio de la Pereza"
 sloth_adherent_plural: "Demonios de la Pereza"

 wrath: "Ira"
 wrath_adj: "Iracundo"
 wrath_desc: "Los demonios de la ira son torbellinos de carnicería y destrucción, monstruos que se ensañan y matan por el puro placer de la destrucción. La ira es algo más que un simple ansia de violencia, sin embargo; es la pretensión de una rabia justa, de infligir castigo a quienes han transgredido. Algunos demonios de la ira se ven a sí mismos como ejecutores de un orden social, pero otros no se molestan en contarse tales mentiras. En cualquier caso, la obsesión del demonio es arremeter y destruir cualquier cosa que le frustre, bloquee o simplemente le incomode."
 wrath_adherent: "Demonio de la Ira"
 wrath_adherent_plural: "Demonios de la Ira"
