  #Seeker-Group Faiths
  viamutationis: "Via Mutationis"
  viamutationis_adj: "Metamorfosista"
  viamutationis_adherent: "Buscador"
  viamutationis_adherent_plural: "Buscadores"
  viamutationis_desc: "Los seguidores de la Vía de la Metamorfosis usan el conocimiento no para otros, sino para sí mismos. Aquellos que se convierten en Buscadores viven vidas solitarias e introvertidas mientras descubren sus propias capacidades. Confían en acertijos y fragmentos de información, y suelen dar respuestas similares a cambio."
 
  pathoftheflesh: "Senda de la Carne"
  pathoftheflesh_adj: "Metamorfosista de la Carne"
  pathoftheflesh_adherent: "Buscador de la Carne"
  pathoftheflesh_adherent_plural: "Buscadores de la Carne"
  pathoftheflesh_desc: "El verdadero objetivo de la senda es enteramente físico. La transformación corporal que conduce a la adquisición de un vasto poder en el mundo material. Lo espiritual solo se considera importante cuando ayuda a esta transformación física."
 
  pathofthespirit: "Senda del Espíritu"
  pathofthespirit_adj: "Metamorfosista del Espíritu"
  pathofthespirit_adherent: "Buscador del Espíritu"
  pathofthespirit_adherent_plural: "Buscadores del Espíritu"
  pathofthespirit_desc: "El verdadero objetivo de la senda es una transformación enteramente espiritual. Creen que uno solo debe centrarse en la mente y el alma, que el cambio físico es una ilusión. El mundo físico es simplemente una herramienta para el crecimiento espiritual."
  
  viaapotheosis: "Via Apotheosis"
  viaapotheosis_adj: "Apoteosis"
  viaapotheosis_adherent: "Apoteosista"
  viaapotheosis_adherent_plural: "Apoteosistas"
  viaapotheosis_desc: "Esta religión no canónica ha sido encargada por un mecenas.\nLos seguidores se esfuerzan por trascender sus limitaciones biológicas, mejorando sus habilidades mentales y físicas hasta que son indistinguibles de la divinidad. Los rituales competitivos implican humillarse ante los superiores y aprender de ellos a cambio de sacrificios de sangre. La Vicisitud es la $pod_discipline$ más común empleada en la búsqueda de la perfección durante toda la (no)vida, aunque se anima a los practicantes a usar casi todos los poderes disponibles para lograr sus objetivos idealistas y egoístas (incluso pactos demoníacos y $pod_diablerie$)."
  viaapotheosis_religious_head_title: "Dios-Rey"
  viaapotheosis_religious_head_title_name: "Dios-Rey"
  viaapotheosis_priest_male: "lector"
  viaapotheosis_priest_male_plural: "lectores"
  viaapotheosis_priest_alternate_plural: "lectores"
  viaapotheosis_devotee_male: "novicio"
  viaapotheosis_devotee_male_plural: "novicios"
  viaapotheosis_devotee_female: "novicia"
  viaapotheosis_devotee_female_plural: "novicias"
  viaapotheosis_devotee_neuter: "novicio"
  viaapotheosis_devotee_neuter_plural: "novicios"
  viaapotheosis_bishop_male: "archilector"
  viaapotheosis_bishop_plural_male: "archilectores"
  viaapotheosis_bishop_female: "archilectora"
  viaapotheosis_bishop_plural_female: "archilectoras"
  
  holy_order_order_of_oradea: "La Orden de Oradea"
  holy_order_knez_of_dacia: "Knez de Dacia"
  holy_order_dragons_of_wallachia: "Dragones de Valaquia"
 
  pathofasakku: "Senda de Asakku"
  pathofasakku_adj: "Corrupto"
  pathofasakku_adherent: "Corrupto"
  pathofasakku_adherent_plural: "Corruptos"
  pathofasakku_desc: "Esta versión de la senda no es canónica y ha sido encargada por un mecenas.\nUn místico errante, Dragastes, usó su Vicisitud para curar a los enfermos y heridos tanto del Ganado como de los Vástagos. Sin embargo, con cada curación, su sangre maculada se extendía a las masas, pudriéndolas desde dentro y corrompiéndolas en meras extensiones de la voluntad de los Asakku. Potencialmente, la maldición de Dragastes podría haberse extendido por gran parte del Mediterráneo. Sin embargo, los Asakku, o más correctamente los Vigilantes que dominaban su voluntad, habían subestimado a los otros Vástagos de la Ciudad. El Dracón, un antiguo Tzimisce cuyo conocimiento de la Vicisitud eclipsaba incluso al de los Asakku, erradicó muchos de los cultos y rápidamente obligó al Tzimisce renegado a huir de la ciudad. Sin embargo, algunos restos de la locura de Dragastes permanecieron en los márgenes de la antigua Bizancio, aunque siglos de preparación y conspiración habían sido deshechos en unos pocos años. Desde entonces, el culto ha emigrado a los páramos de Siberia liderado por su Hierofante Matthaios Yelbeghen."
  
  pathofstars: "Senda de las Estrellas"
  pathofstars_adj: "Senda de las Estrellas"
  pathofstars_adherent: "Buscador"
  pathofstars_adherent_plural: "Buscadores"
  pathofstars_desc: "Una versión retorcida de la Senda de la Metamorfosis, los seguidores de la Senda de las Estrellas buscan la perfección y el servicio a un nuevo maestro no solo mediante la perfección del yo, sino la perfección del mundo. El sufrimiento es esencia, un recurso que debe ser extraído. Así que para ascender verdaderamente, uno debe hacer que el sufrimiento sea mundano, hacerlo tan fácil de intercambiar como la moneda, y tan común que nadie piense en desafiarlo. Ser un Buscador no es solo elevarse a uno mismo, sino mostrar al mundo entero lo que realmente vale." 
