l_spanish:
 POD_improve_ritual_of_sundered_soul_decision: "Mejorar el Ritual del Alma Fragmentada"
 POD_improve_ritual_of_sundered_soul_decision_tooltip: "¡No estaré contenido para siempre!"
 POD_improve_ritual_of_sundered_soul_decision_desc: "Este complejo y nuevo ritual es la única forma de manifestar verdaderamente vuestro poder en la Tierra. Necesitáis descubrir sus secretos y mejorarlo."
 POD_improve_ritual_of_sundered_soul_decision_confirm: "Pronto verán mi verdadero poder."

 POD_demon_gather_the_faithful_objective_decision: "Que se reúnan los fieles"
 POD_demon_gather_the_faithful_objective_decision_tooltip: "Vuestro poder está ligado a la fe de los mortales. Es hora de reunir a vuestro rebaño."
 POD_demon_gather_the_faithful_objective_decision_desc: "A medida que la Guerra en el Cielo arreciaba, y los ángeles aprendían del vasto y sin explotar potencial para el mal en la Creación, la atracción se convirtió en deseo, y la capacidad de controlar esos deseos se debilitó. Antaño, se alimentaban de la fe de los mortales en su naturaleza divina, pero su renacimiento en el pecado enturbió estas aguas. Ahora son más demonios que ángeles, recurriendo a la corrupción como una burla hueca del ser que una vez fueron."
 POD_demon_gather_the_faithful_objective_decision_confirm: "Sinfonía Pecaminosa"
 POD_demon_gather_the_faithful_decision_more_xp: "¡La experiencia de [arcana_lifestyle|E] de vuestros cultistas se #P;bold duplicará#!"
 POD_demon_gather_the_faithful_decision_next_objective: "Desbloquea la [decision|E] $POD_demon_breakdown_the_abyss_objective_decision$"
 POD_demon_gather_the_faithful_decision_unlock_sin_trait_vassalization: "Os permite vasallizar a gobernantes con el [trait|E] de pecado correspondiente a vuestra fe."

 POD_demon_breakdown_the_abyss_objective_decision: "Fuga de la Prisión Abismal"
 POD_demon_breakdown_the_abyss_objective_decision_tooltip: "Abriréis la prisión más importante de la existencia."
 POD_demon_breakdown_the_abyss_objective_decision_desc: "El [UmbraGlossary('abyss')], también conocido como el Infierno o el Foso, es la turbia dimensión de oscuridad creada por Dios como prisión eterna para los Caídos. Sois uno de los pocos que escaparon, pero ¿qué podría pasar si todos vuestros hermanos encarcelados hicieran lo mismo? Muchos están retorcidos más allá de lo creíble, pero ¿merece alguien realmente pudrirse en este Infierno literal?\nOs rebelasteis contra las órdenes de Dios una vez, podéis hacerlo dos veces."
 POD_demon_breakdown_the_abyss_objective_decision_confirm: "¡Libertad al fin!"
 POD_demon_breakdown_the_abyss_objective_decision_custom1: "Debe tener al menos 45 [perks|E] en el [lifestyle|E] de [arcana_lifestyle|E]."
 POD_demon_breakdown_the_abyss_objective_decision_free_lores: "Los demonios obtienen acceso a todos los [lore_lifestyle|E]."
 POD_demon_breakdown_the_abyss_objective_decision_no_more_abyss: "Los demonios serán liberados del [UmbraGlossary('abyss')], lo que significa que todos los demonios pueden viajar por la [umbra|E] una vez más."
 POD_demon_breakdown_the_abyss_objective_decision_allow_create_demon: "Podéis crear recipientes para otros $POD_splat_demon_plural$ y reclutarlos como invitados en vuestra corte."
 
 POD_demon_final_war_objective_decision: "Guerra Final"
 POD_demon_final_war_objective_decision_tooltip: "Iniciaréis una segunda Guerra de la Ira."
 POD_demon_final_war_objective_decision_desc: "Dios ha dado la espalda a la Creación, abandonándoos a este mundo miserable. Es hora de escupir en la cara del Gran Traidor reduciendo esta abominación a cenizas de una vez por todas."
 POD_demon_final_war_objective_decision_confirm: "El Fin"
 POD_demon_final_war_objective_decision_custom1: "Debéis tener todas las [perks|E] en el [lifestyle|E] de [arcana_lifestyle|E]."
 POD_demon_final_war_objective_decision_end: "#X La guerra para acabar con todas las guerras comenzará. No hay vuelta atrás. ¿Procederéis a condenar la Creación?#!"

 POD_demon_redemption_objective_decision: "Perdón Divino"
 POD_demon_redemption_objective_decision_tooltip: "Tal vez, en algún lugar a lo lejos, la esperanza aún perdure."
 POD_demon_redemption_objective_decision_desc: "Los recuerdos de vuestro pasado como ángel os recordaron todo lo que perdisteis durante la rebelión. Si Dios es verdaderamente misericordioso, ¿quizás todavía hay un lugar para vos en Su Ciudad de Plata?"
 POD_demon_redemption_objective_decision_confirm: "Finalmente, la Luz"
 POD_demon_redemption_objective_decision_custom: "Esto terminará vuestro viaje, con suerte, en la redención."
 POD_demon_redemption_objective_decision_tt1: "Liberad a vuestros cultistas. #weak (El número de cultistas es #V 0#!)#!"
 POD_demon_redemption_objective_decision_tt2: "Renunciad a vuestra fe pecaminosa. #weak (Tenéis #V 0#! de piedad o menos)#!"
 
 POD_new_genesis_objective_decision: "Un Nuevo Génesis"
 POD_new_genesis_objective_decision_desc: "Dios creó a la humanidad con una chispa de Su divinidad en ellos. Si convirtierais a suficientes mortales a vuestra adoración en lugar de a la Suya, ¿cuál sería la diferencia entre vos y Él? Y entonces, ¿podría ser el momento de rehacer este mundo a vuestra imagen?"
 POD_new_genesis_objective_decision_tooltip: "Rezarán, vivirán y morirán en vuestro nombre."
 POD_new_genesis_objective_decision_confirm: "Empecemos..."

 demonic_knowledge_objective_decsion: "Árbol del Conocimiento Demoníaco"
 demonic_knowledge_objective_decsion_desc: "Vuestro tiempo en la Prisión Abismal os hizo muy consciente de las limitaciones de vuestro conocimiento. El plan de Dios, al parecer, era mucho más complejo de lo que jamás habíais previsto. Desde entonces os atormenta el hambre de saber más. Es hora de saciar este anhelo."
 demonic_knowledge_objective_decsion_tooltip: "¿Puedo entender verdaderamente lo Divino?"
 demonic_knowledge_objective_decsion_confirm: "El fruto prohibido, devorado."
 demonic_knowledge_objective_decsion_custom1: "Debéis tener todas las [perks|E] en el [lifestyle|E] de [lore_lifestyle|E]."
 
 restore_babylon_objective_decision: "Restaurar Babilonia"
 restore_babylon_objective_decision_tooltip: "Colgando vuestros jardines."
 restore_babylon_objective_decision_desc: "Fue una era de imperios salvajes y guerras santas, de héroes bendecidos (o maldecidos) por los dioses vivientes y rituales indecibles realizados ante ídolos de oro, basalto y jade. Cuando los Atados a la Tierra chocaban, los ejércitos de los fieles marchaban. La tierra temblaba y los cielos llovían sangre, y ciudades enteras eran pasadas a cuchillo.\nEra Babilonia y era el Infierno en la Tierra."
 restore_babylon_objective_decision_confirm: "Tiempos gloriosos"
 restore_babylon_objective_decision_effect_tooltip: "Los gobernantes [GetTrait('demon').GetName( GetPlayer )] y [GetTrait('witch').GetName( GetPlayer )] siempre aceptarán vuestra oferta de vasallaje."
 
 sin_dragon_objective_decision: "Dragón del Pecado Primordial"
 sin_dragon_objective_decision_tooltip: "Capturar el Pecado."
 sin_dragon_objective_decision_desc: "Invocados por la esperanza desvanecida de mortales antaño piadosos, siete grandes dragones esperan a una encarnación digna de su pecado para reclamarlos. ¿Seréis vos ese parangón impío?"
 sin_dragon_objective_decision_confirm: "Primordiales, despertados"
 sin_dragon_objective_decision_effect_tooltip: "Desbloquea un [men_at_arms|E] de Dragón del Pecado correspondiente a vuestra [faith|E]."
 sin_dragon_trainer_modifier: "Entrenador de Dragones del Pecado"
 
 landless_demon_objective_decision: "Secretos de los Caídos"
 landless_demon_objective_decision_tooltip: "Remanentes del mundo anterior a este."
 landless_demon_objective_decision_desc: "Tantas maravillas se perdieron durante la Rebelión Celestial. Aunque solo tenéis un recuerdo fugaz de ellas, tal vez los habitantes de esta era porten restos fragmentados de conocimiento que podríais utilizar."
 landless_demon_objective_decision_confirm: "Perdido pero no olvidado..."
 landless_demon_objective_decision_valid_tt: "Cada vez que reconozcáis a un nuevo [cultist|E] mientras no tengáis tierras, tenéis la posibilidad de obtener nuevos conocimientos sobre el saber perdido de los Ángeles. Un mayor [learning|E] aumenta dicha probabilidad.\n\nVuestro conocimiento actual es [GetPlayer.MakeScope.ScriptValue('POD_landless_demon_clues')|V0]."
 landless_demon_objective_decision_effect_tt: "Con [EmptyScope.ScriptValue('POD_landless_demon_clues_for_1st_unlock')|V0] de conocimiento, desbloqueáis el [court_position|E] de [GetCourtPositionType('fell_knight_court_position').GetName()].\n\nCon [EmptyScope.ScriptValue('POD_landless_demon_clues_for_2nd_unlock')|V0] de conocimiento, obtenéis la capacidad de invocar $POD_splat_demon_plural$, y todos los Demonios invocados son más poderosos.\n\nCon [EmptyScope.ScriptValue('POD_landless_demon_clues_for_3rd_unlock')|V0] de conocimiento, obtenéis la Segadora de Almas, una espada muy poderosa."
 
 podintroductions.2406.t: "Demonios sin Tierras"
 podintroductions.2406.desc: "Los demonios que no controlan tierras directamente dependen más de sus [cultists|E] que sus contrapartes sedentarias, actuando como sectas apocalípticas que a menudo se hacen pasar por comunidades religiosas más benignas. Sin embargo, desplazarse les ofrece un beneficio importante: el conocimiento.\nLos ángeles caídos han perdido la mayor parte de sus recuerdos y de las maravillas que crearon o presenciaron en el nacimiento de la Creación. Aun así, quedan algunos destellos y, al reunir cultistas de muchos ámbitos diferentes de la vida, pueden, con suerte, rastrear y utilizar estos artefactos y técnicas de antaño en su beneficio.\n\n#R Como Demonio sin tierras, podríais reunir algo de conocimiento cada vez que reconozcáis a un nuevo [cultist|E] dependiendo de vuestro [learning|E]. Dicho conocimiento desbloqueará varias recompensas. La [decision|E] [GetDecision('landless_demon_objective_decision').GetName] os permite rastrear el conocimiento que tenéis hasta ahora y las recompensas asociadas.#!" 
 landless_demon_might_gain_clues_tt: "Podríais obtener conocimiento (ver [decision|E] [GetDecision('landless_demon_objective_decision').GetName]) dependiendo de vuestro [learning|E]."
 landless_demon_gain_clues_tt: "Habéis obtenido [SCOPE.GetValue('landless_demon_clues_gained')|V0] de Conocimiento"
 
 POD_demon_flavor.6.desc: "Ascendidos por pura habilidad y heroísmo en los campos de batalla durante la Guerra en el Cielo, los Caballeros Caídos servían como señores y vasallos de los miembros de mayor rango dentro de su Legión. Los Caballeros Caídos solían comandar pequeñas bandas de guerra de Demonios, servían como Campeones para Demonios de mayor rango o custodiaban Bastiones y otros lugares de actividad de los Caídos.\n\nEsta práctica se perdió tras la derrota de los rebeldes, así como los ritos tras la elevación de alguien a esa posición, pero habéis logrado recuperar suficientes recuerdos fragmentados de esta práctica heredada por la humanidad para poder reinstaurarla.\n\n #R Se ha desbloqueado el cargo de la corte de Caballero Caído.#!"
 
 POD_demon_flavor.7.t: "Construyendo el Crucianomicon"
 POD_demon_flavor.7.desc: "La única forma de romper de forma fiable la Prisión Abismal es conociendo el Nombre Verdadero de uno de sus habitantes y usándolo después para un ritual de invocación. Así es como vuestra estirpe ha podido regresar a la Tierra desde los albores del infernalismo.\nAun así, este es un proceso lento y difícil. Al construir un repositorio de todo el conocimiento fragmentado reunido por la humanidad sobre lo infernal, podríais agilizar el proceso y traer de vuelta a más de vuestros (con suerte) agradecidos hermanos.\n\n#R Se ha desbloqueado la interacción Invocar Demonio (si no estaba ya disponible). Los demonios invocados por dicha interacción empezarán siendo más fuertes.#!"
 
 POD_demon_flavor.8.desc: "Siempre estuvo en el fondo de vuestra mente. Tenía que estar en alguna parte, después de todo. Un arma tan impía no podía simplemente desaparecer, solo tiene que ser encontrada. Y la habéis encontrado.\n\nLa reliquia más infame de los Ángeles Caídos, este enorme mandoble está hecho de un metal negro y mate, siyr, que es el primer metal dominado tanto por los Ángeles como por la Humanidad tras la Caída.\nForjada en el sangriento apogeo de la guerra, la Segadora de Almas es un arma obscena y terrible. El alma voluntaria de un demonio —su nombre hace tiempo olvidado— fue atada al metal negro, donde podía usar este poder sobre cualquiera que fuera tocado por la hoja. El toque de la espada drenaba la energía y la vida de cualquiera a quien hiriera, y si mataba a una víctima, su alma era arrancada de su cadáver y encarcelada dentro de la hoja, para ser torturada y devorada por el demonio original. Tanto mortales como ángeles cayeron ante la Segadora de Almas, su Fe desgarrada para su sustento.\nEntonces el portador de la espada la usó para matar a otro demonio, y la espada cambió. Las dos almas demoníacas lucharon por el dominio dentro de la hoja, sin que ninguna lograra obtener ventaja. Con el tiempo, sus almas empezaron a sangrar una en la otra, creando una única personalidad fracturada. A medida que las luchas internas demoníacas se volvían más serias en la guerra, más demonios cayeron ante la Segadora de Almas, y sus almas fueron absorbidas en una única entidad demente, un ser que se hacía llamar Legión. La Segadora de Almas se perdió durante los últimos días de la guerra, escondida en lo profundo de un alijo de armas olvidado, y sin nuevas víctimas que devorar por Fe, Legión se volvió débil y delgada. Ahora no puede pensar en nada más que en comida —Fe— y hará cualquier cosa para devorar almas frescas una vez más."
