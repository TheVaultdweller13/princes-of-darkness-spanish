 countermeasures_desc_all_seeing_eye: "$EFFECT_LIST_BULLET$Nueva [scheme_countermeasure_countermeasure|E]: $scheme_countermeasure_type_all_seeing_eye$\n$EFFECT_LIST_BULLET$[secrecy|E] reducida"
 
