 scheme_countermeasure_type_all_seeing_eye_t3_desc: "$scheme_countermeasure_type_all_seeing_eye_desc$"
 
 countermeasures_unlocks_t1_all_seeing_eye: "Desbloquea la [scheme_countermeasure_countermeasure|E] #V $scheme_countermeasure_type_all_seeing_eye$#! #weak (Nivel 1)#!"
 countermeasures_unlocks_t2_all_seeing_eye: "Desbloquea la [scheme_countermeasure_countermeasure|E] #V $scheme_countermeasure_type_all_seeing_eye$#! #weak (Nivel 2)#!"
