l_spanish:
 tab_tremere_council: "#T Consejo Interno#!"
 
 tremere_council_tab_tt: "#bold Consejo Interno #!"
 tremere_council_intro: "El Consejo Interno lidera al Clan Tremere en lugar de su fundador. Cada consejero otorga una doctrina específica a la fe del Código de Tremere.\nSi un consejero muere, se convierte a otra fe distinta del Código de Tremere o cae a 0 de influencia, es reemplazado por alguien que el propio Tremere considere digno.\nUna [character_interaction|E] especial con los consejeros te permite pedir un favor, o aumentar/obstaculizar su influencia."
 council_influence_loc: "Influencia"
 
 generic_prowess_council_doctrine_name: "Consejero de proeza"
 generic_prowess_council_doctrine_desc: "Tener al menos un consejero con una educación de proeza aporta esta doctrina para los Tremere." 
 generic_intrigue_council_doctrine_name: "Consejero de intriga"
 generic_intrigue_council_doctrine_desc: "Tener al menos un consejero con una educación de intriga aporta esta doctrina para los Tremere." 
 generic_stewardship_council_doctrine_name: "Consejero de gestión"
 generic_stewardship_council_doctrine_desc: "Tener al menos un consejero con una educación de gestión aporta esta doctrina para los Tremere." 
 generic_learning_council_doctrine_name: "Consejero de aprendizaje"
 generic_learning_council_doctrine_desc: "Tener al menos un consejero con una educación de aprendizaje aporta esta doctrina para los Tremere." 
 generic_martial_council_doctrine_name: "Consejero marcial"
 generic_martial_council_doctrine_desc: "Tener al menos un consejero con una educación marcial aporta esta doctrina para los Tremere." 
 generic_diplomacy_council_doctrine_name: "Consejero de diplomacia"
 generic_diplomacy_council_doctrine_desc: "Tener al menos un consejero con una educación de diplomacia aporta esta doctrina para los Tremere." 
 abetorius_council_doctrine_name: "Consejero Abetorius"
 abetorius_council_doctrine_desc: "A pesar de muchos contratiempos, Abetorius cuenta con la confianza de Tremere en su capacidad para comprender y manipular los intereses extranjeros en beneficio del clan." 
 grimgroth_council_doctrine_name: "Consejero Grimgroth"
 grimgroth_council_doctrine_desc: "Grimgroth traicionó a sus colegas herméticos, marcando el inicio de una guerra interminable entre ellos y la Orden de la Razón. Ha sido debidamente recompensado por Tremere por esta hazaña." 
 astio_council_doctrine_name: "Consejero Astio Giavetti"
 astio_council_doctrine_desc: "El viejo mentor se siente más a gusto practicando su oficio que haciendo política en el Consejo, lo que lo convierte en una fuerza mayoritariamente ignorada en la Pirámide." 
 leduc_council_doctrine_name: "Consejero LeDuc"
 leduc_council_doctrine_desc: "LeDuc es más leal que brillante, pero la lealtad tiene sus propias ventajas." 
 calderon_council_doctrine_name: "Consejero Calderón"
 calderon_council_doctrine_desc: "Calderón es rápido para la ira y lento para el perdón. El lento Clan Tremere es incitado a la acción por su cólera." 
 xavier_council_doctrine_name: "Consejero Xavier de Cincao"
 xavier_council_doctrine_desc: "Xavier es un hábil coordinador, capaz de manejar varios asuntos en una gran región. Sin embargo, su determinación absoluta en algunas tareas específicas a veces roza lo patológico." 
 meerlinda_council_doctrine_name: "Consejera Meerlinda"
 meerlinda_council_doctrine_desc: "La diplomática Meerlinda es el verdadero corazón del Consejo, la que mantiene unida la Pirámide a pesar de sus mejores esfuerzos por desmoronarse." 
 goratrix_council_doctrine_name: "Consejero Goratrix"
 goratrix_council_doctrine_desc: "Goratrix perdió su lucha de poder inicial con Etrius, pero hará falta mucho más que eso para mantenerlo realmente abajo." 
 etrius_council_doctrine_name: "Consejero Etrius"
 etrius_council_doctrine_desc: "El leal se sienta en la cima de la Pirámide, manteniéndola estable en lugar de Tremere." 
                      
 POD_tremere_council_interaction: "Audiencia con el consejero"       
 POD_tremere_council_interaction_desc: "Usa tu piedad para aumentar o disminuir la influencia del consejero, o pide un favor."                    
        
