 pod_tremere_council.2.t: "Una audiencia con el consejero"
 pod_tremere_council.2.desc: "El Consejo Interno de los Tremere maneja la mayoría de los asuntos del clan en lugar de Tremere. Como es sabido que Tremere a veces despierta y emite sus propios edictos, los consejeros siempre están compitiendo por el poder y la influencia, esperando complacer a su maestro (o al menos no desagradarle).\nEn esta lucha eterna, todos los Tremere desempeñan su papel, creando camarillas de seguidores que alaban a su campeón elegido y esperan cosechar recompensas de ellos cuando llegue el momento."
 pod_tremere_council.2.a: "Alabar al consejero"           
 pod_tremere_council.2.b: "Obstaculizar al consejero"           
 pod_tremere_council.2.c: "Pedir un favor al consejero"           
 tremere_council_gain_influence_tt: "El consejero ganará 10 de influencia"           
 tremere_council_lose_influence_tt: "El consejero perderá 10 de influencia.\nSi la influencia llega a 0 o menos, será destituido del Consejo."          
            
 pod_tremere_council.4.t: "Cima de la Pirámide"
 pod_tremere_council.4.desc: "Acaba de abrirse una vacante en el Consejo Interno y, como siempre, toda la Pirámide está esperando la llamada de Tremere sobre quién será el elegido. El proceso de pensamiento de Tremere al respecto es tan arcano como se esperaba pero, aparte de unas pocas elecciones \"extrañas\", parece seguir principalmente líneas políticas. Cuanto más poderoso es un Tremere, y cuanto más celo muestra en el Código de Tremere, más probabilidades tendrá de ser nombrado en el Círculo Interno.\nY finalmente, tras un estresante periodo de espera, los actuales miembros del Círculo te presentan la noticia: Tremere te ha elegido. Algunos de ellos parecen complacidos, otros descontentos, pero es la voluntad de Tremere y, como tal, ahora es un hecho."
 pod_tremere_council.4.a: "La escalera ha sido subida"           
             
 tremere_council_entry_tt: "Ahora formas parte del Círculo Interno Tremere"

 pod_tremere_council.6.t: "El Círculo Interno"
 pod_tremere_council.6.desc: "El Consejo Interno lidera la Casa Tremere en lugar de su fundador. Esos poderosos vampiros, elegidos personalmente por el propio Tremere, son los verdaderos líderes del $pod_clan$, ya que el fundador está en $pod_torpor$ o preocupado por asuntos más importantes. En su esencia, son los cerebros definitorios de la Casa, y sus doctrinas y políticas deben ser seguidas por todos los Tremere leales.\n #X El Círculo Interno es una característica definitoria de los Tremere leales al Código. Puedes acceder a él en una pestaña a la derecha de tu pantalla.#!"
 pod_tremere_council.6.a: "La Pirámide se asienta sobre la disciplina"           
   
 pod_tremere_council.7.t: "Disputas piramidales"
 pod_tremere_council.7.desc: "Como el poder más alto en el $pod_clan$ Tremere, aparte del propio fundador obviamente, el Consejo Interno es un hervidero de intrigas y rivalidades. Cada consejero quiere socavar a sus compañeros y elevarse en el favor de Tremere, lo que resulta en conflictos (a menudo bastante insignificantes) que pueden resonar en toda la Pirámide.\nUno de estos conflictos ha estallado recientemente y muchos están tomando partido, expresando sus propios recelos y rumores sobre los consejeros enfrentados para echar más leña al fuego."
 pod_tremere_council.7.c: "Esto está por debajo de mí."                
 pod_tremere_council.7.a: "[councilor1.GetFirstName] ha cometido muchos errores..."
 pod_tremere_council.7.b: "¡[councilor2.GetFirstName] no es verdaderamente fiel a Tremere!"
  
 pod_tremere_council.8.t: "Elogio piramidal"
 pod_tremere_council.8.desc: "La guerra de sombras por la influencia entre los consejeros se libra de muchas formas diferentes. Reunir el apoyo de Tremere influyentes es una de ellas y un consejero ha estado cortejando tu apoyo desde hace algún tiempo. Se han utilizado pequeños gestos, halagos y sobornos directos y tu nuevo 'amigo' busca ahora que hagas público cuánto lo valoras."
 pod_tremere_council.8.a: "En mi objetiva opinión, ¡eres el mejor!"
 pod_tremere_council.8.b: "Estoy por encima de esa política insignificante."
 pod_tremere_council.8.c: "Ciertamente, mi apoyo vale más..."
 
 pod_tremere_council.9.t: "Conocimiento piramidal"
 pod_tremere_council.9.desc: "Recientemente has localizado un libro importante para tu última investigación y, por suerte, está en posesión del $pod_clan$ Tremere. Más concretamente, en la biblioteca privada de un consejero. Podrías hacer una petición formal (y bastante agotadora) para usarlo o recurrir a un buen soborno a la antigua usanza. Después de todo, incluso el conocimiento tiene un precio."
 pod_tremere_council.9.a: "Emitir una petición formal."
 pod_tremere_council.9.b: "Una donación a la biblioteca privada es lo que procede..."
 pod_tremere_council.9.c: "Ya no quiero este libro."
 
 pod_tremere_council.10.t: "Patrocinio piramidal"
 pod_tremere_council.10.desc: "Un consejero se ha interesado por ti y viene con una propuesta de asociación de investigación. Juntos, podríais hacer grandes progresos en el desbloqueo de los secretos de la Sangre para el $pod_clan$ Tremere (y para ti mismo). Sin embargo, una asociación de este tipo entre dos poderosos taumaturgos suele ser difícil de llevar y podría ser menos estresante rechazar esta propuesta y continuar trabajando por tu cuenta."
 pod_tremere_council.10.a: "¡Lograremos grandes cosas!"
 pod_tremere_council.10.b: "¿A tiempo parcial quizás?"
 pod_tremere_council.10.c: "¡No necesito ninguna ayuda!"
  
 pod_tremere_council.11.t: "Intriga piramidal"
 pod_tremere_council.11.desc: "Mientras trabajabas en otro asunto, recientemente encontraste algo sucio sobre un consejero. Nada demasiado grande, pero lo suficiente como para hacer mella en su influencia si esta información sensible se hiciera pública. Sin embargo, esto probablemente causaría una brecha entre tú y él, y en su lugar puedes considerar entregarle la información directamente para ganar algo de buena voluntad de este asunto."
 pod_tremere_council.11.a: "¡La Casa Tremere debe saber la verdad!"
 pod_tremere_council.11.b: "Olvidemos esta indiscreción."

 window_council_session_tooltip: "Una sesión del Consejo permite al Círculo Interno discutir la política Tremere y proporcionar una guía útil a la Casa... o simplemente discutir interminablemente entre ellos.\nSolo los consejeros pueden iniciar una sesión del Consejo.\nSolo se permite una cada 20 años."
 Council_Session: "#V Sesión del Consejo#!"
 
 pod_tremere_council.12.t: "Sesión del Consejo"
 pod_tremere_council.12.desc: "El Círculo Interno rara vez se reúne, pero cuando lo hace, siempre es un acontecimiento trascendental. Aquí reside el verdadero poder de la Casa Tremere, con los consejeros elegidos a dedo trabajando incansablemente por la gloria de toda la Pirámide.\nAl menos, esa es la versión oficial.\nLa mayoría de las veces, estas sesiones se disuelven en discusiones improductivas e insultos entre consejeros rivales y, aparte de insultos y amenazas, no se logra mucho. Aun así, si quieres marcar una verdadera diferencia en los asuntos del clan, aquí es donde sucede."
 tremere_council_player_lose_influence_tt: "Perderás 10 de influencia.\nSi la influencia llega a 0 o menos, serás destituido del Consejo Tremere."
 tremere_council_gold_tt: "Cada Tremere lealista de rango duque o superior ganará 100 de oro."
 pod_tremere_council.12.a: "¡Financia los esfuerzos de nuestros leales miembros de la casa!"
 tremere_council_military_tt: "Se te presentarán varias opciones para usar la parte más exótica del arsenal Tremere."
 pod_tremere_council.12.b: "Necesitamos toda la ayuda que podamos conseguir..."
 pod_tremere_council.12.c: "¡Debemos golpear a nuestros enemigos!"
 tremere_council_aggressive_tt: "Cada Tremere lealista de rango duque o superior ganará un modificador de diez años que les dará una mayor probabilidad de ir a la guerra y alguna bonificación marcial ofensiva al coste de estrés."
 pod_tremere_council.12.d: "Reforzar nuestras defensas es clave."
 tremere_council_defensive_tt: "Cada Tremere lealista de rango duque o superior ganará un modificador de diez años que les dará una menor probabilidad de ir a la guerra y alguna bonificación marcial defensiva al coste de estrés."
 tremere_council_player_gain_influence_tt: "Ganarás 10 de influencia."
 pod_tremere_council.12.e: "Simplemente juega el juego político en esta sesión."
 
 aggressive_order_modifier: "Doctrina agresiva"
 aggressive_order_modifier_desc: "El Círculo Interno ha decretado que la Pirámide debe ser audaz contra sus enemigos, y la Casa Tremere obedecerá."
 defensive_order_modifier: "Doctrina defensiva"
 defensive_order_modifier_desc: "El Círculo Interno ha decretado que la Pirámide debe centrarse en fortalecer sus defensas, y la Casa Tremere obedecerá."
 
 pod_tremere_council.13.t: "Asuntos militares"
 pod_tremere_council.13.desc: "No es ninguna gran revelación que la Casa Tremere tiene muchos enemigos. El clan habría caído hace mucho tiempo si no fuera por su pura ingenuidad (y falta de moderación) al crear diversas monstruosidades criadas para la guerra.\nLas gárgolas son solo la punta del iceberg oficial y visible. Hay muchos más experimentos inquietantes creados por Goratrix y Virstania que podrían desatarse si el Consejo Interno lo aprobara..."
 pod_tremere_council.13.a: "¡Solo necesitamos más gárgolas!"
 tremere_council_gargoyles_tt: "Cada Tremere lealista de rango duque o superior obtendrá dos grupos de [GetMaA('gargoyle_warriors').GetName]."
 pod_tremere_council.13.b: "¿Ratas parecidas a lobos con pico? ¿En serio?"
 tremere_council_chitterers_tt: "Los Tremere lealistas ahora podrán usar [GetMaA('chitterers').GetName]."
 pod_tremere_council.13.c: "¿Escarabajos armados con cuchillas? Cuéntame más..."
 tremere_council_reapers_tt: "Los Tremere lealistas ahora podrán usar [GetMaA('reapers').GetName]."
 pod_tremere_council.13.d: "Un enjambre de devoradores de carne suena divertido..."
 tremere_council_skin_eaters_tt: "Los Tremere lealistas ahora podrán usar [GetMaA('skin_eaters').GetName]."
 pod_tremere_council.13.e: "Nuestra milicia está bien como está."
 
 pod_gui_nick: "#V '[Character.GetNicknameNoTooltip|U]'#!"
 
 pod_tremere_council.30.t: "¿Un asiento en la mesa?"
 pod_tremere_council.30.desc: "La Pirámide Tremere bulle con el rumor de que un asiento en el Consejo Interno se ha abierto recientemente. Los detalles son incompletos en el mejor de los casos, ya que la cima de la Pirámide no es conocida por ser comunicativa con la información sobre sus tratos internos. Sea cual sea la causa de este puesto vacante, ha llegado el momento de que todos los Tremere leales esperen la palabra de su fundador sobre su elección para un reemplazo.\nAunque los caminos de Tremere son impenetrables, podría ser un buen momento para que cualquier consejero prospectivo muestre su devoción a la causa demostrando su fidelidad al Código."
 entry_tremere_council_tt: "Serás elegido como el próximo consejero Tremere. Esta opción se vuelve menos costosa cuanto más altos sean tu rango, el tamaño de tu reino y tu piedad."
