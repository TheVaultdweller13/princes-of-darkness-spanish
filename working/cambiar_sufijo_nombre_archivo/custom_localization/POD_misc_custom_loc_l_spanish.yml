l_spanish:
 # This is you
 THIS_IS_YOU_FOREVER_INFAMOUS: "Este eres tú: #R;bold ¡Enemigo Público nº 1!#!"
 THIS_IS_YOU_FOREVER_INDOMITABLE: "Este eres tú: #P;bold Destructor de la Inquisición#!"
 THIS_IS_YOU_POSSESSED: "Este ya no eres tú"
 THIS_IS_YOU_UMBROOD: "¿Cuánto de esto sigue siendo tú?"
 THIS_IS_YOU_LASOMBRA: "Ellos #italic dicen#! que este eres tú, pero ¿cómo puedes saberlo?"
 THIS_IS_YOU_SHADOW: "Este es el otro tú"
 THIS_IS_YOU_TRAPPED: "Este eres tú, ¡y lo estás pasando #italic fatal!#!"
 THIS_IS_YOU_SANTA: "Este eres tú. ¡Ho ho ho!"
 THIS_IS_YOU_GOLDEN: "Este eres tú, ¡y eres #italic brillante!#!"
 THIS_IS_YOU_DRACUL: "Este eres tú: una criatura de pesadilla"
 THIS_IS_YOU_REDEMPTION: "Este eres tú... pero ¿a qué precio?"
 THIS_IS_YOU_CRINOS: "Este eres tú, ¡y estás listo para la #italic carnicería!#!"
 THIS_IS_YOU_VICISSITUDE: "Esta es la versión perfecta de ti"
 THIS_IS_YOU_DEMON_HIGH: "Este eres finalmente tú, todo tú"
 THIS_IS_YOU_DEMON: "Este eres tú, o al menos parte de ti"
 
 
