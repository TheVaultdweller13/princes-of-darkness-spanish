l_spanish:
  supernatural_diseases: "Enfermedades sobrenaturales"
 
  epidemic_crimson_fever: "Fiebre carmesí"
  disease_crimson_fever: "fiebre carmesí."
  health.2101.crimson_fever_outbreak.desc: "Una enfermedad sobrenatural que se manifiesta en los Catayanos cuyos aspectos Yang se han desequilibrado. Aunque es una enfermedad bastante rara, se rumorea que es extremadamente contagiosa. Su rareza también significa que las curas potenciales nunca han sido exploradas realmente, lo que la convierte en una perspectiva temible de tratar.\n\nUn caso peligroso de lo que parece ser fiebre carmesí se ha infiltrado en tu corte. Erupciones, tos y fiebre acosan a los afligidos y podría ser solo el principio."
  health.2101.crimson_fever_spreads.desc: "Otro caso de fiebre carmesí ha asomado su fea cabeza."
  
  POD_epidemic.1001.t: "[SCOPE.Custom('EventTitleDisease')]: Fiebre carmesí"
  POD_epidemic.1001.desc: "Una enfermedad sobrenatural que se manifiesta en los Catayanos cuyos aspectos Yang se han desequilibrado. Aunque es una enfermedad bastante rara, se rumorea que es extremadamente contagiosa. Su rareza también significa que las curas potenciales nunca han sido exploradas realmente, lo que la convierte en una perspectiva temible de tratar.\n\nNunca pensé que tendría que sufrir esto yo mismo, pero esta pesadilla febril y dolorosa no me deja otra opción.\n\nMientras considero las consecuencias de mi desequilibrio, rezo por la redención, con mis fosas nasales escocidas por el agudo hedor de la bilis."
  POD_epidemic.1001.court_physician.desc: "\n\n\"¡No se preocupe, mi [ROOT.Char.GetLadyLord]! La fiebre carmesí es tratable, se lo aseguro\"."
  POD_epidemic.1001.a: "¡Te lo ruego, que termine!"
 
  POD_epidemic.1002.t: "[SCOPE.Custom('EventTitleDisease')]: Una batalla ganada"
  POD_epidemic.1002.desc: "A diferencia de muchos antes que yo, fui lo suficientemente fuerte como para sobrevivir a los estragos de la temida fiebre carmesí. Fue un desafío brutal, no lo negaré, ¡pero perseveré!"
  POD_epidemic.1002.a: "¡Vivo para luchar otro día!"
  
  epidemic_chulorviosis: "Chulorviosis"
  disease_chulorviosis: "chulorviosis."
  health.2101.chulorviosis_outbreak.desc: "Un elemento extraño e infeccioso que desafía toda clasificación, la Chulorviosis es claramente de naturaleza sobrenatural. Mutando a su anfitrión en un híbrido corrupto de hombre y monstruo con tentáculos, roba lentamente a su anfitrión su libre albedrío hasta que ellos también se convierten en un Chulorviah y comienzan a propagar la mácula aún más.\n\nRecientemente se ha encontrado una desafortunada víctima de esta enfermedad parasitaria. Aunque se ha lidiado con ella rápidamente, podría haber infectado a otros antes de su misericordiosa muerte..."
  health.2101.chulorviosis_spreads.desc: "La muerte tanto del cuerpo como del alma."
 
  POD_epidemic.1101.t: "[SCOPE.Custom('EventTitleDisease')]: Poco a poco"
  POD_epidemic.1101.desc: "Un elemento extraño e infeccioso que desafía toda clasificación, la Chulorviosis es claramente de naturaleza sobrenatural. Mutando a su anfitrión en un híbrido corrupto de hombre y monstruo con tentáculos, roba lentamente a su anfitrión su libre albedrío hasta que ellos también se convierten en un Chulorviah y comienzan a propagar la mácula aún más.\n\nLa piel moteada de una sepia, tan marcada contra la tela pálida. La miro con incredulidad, reprimiendo otra tos. ¿Acaso...? ¿Acaso yo...?\n\nMe limpio los dedos contra los labios, mi mano tiembla mientras la retiro. Puedo sentir la humedad cálida, pero temo mirar."
  POD_epidemic.1101.court_physician.desc: "\n\n\"Me temo que ha contraído algo terrible, mi [ROOT.Char.GetLadyLord]. Le trataré de inmediato\"."
  POD_epidemic.1101.a: "¿Es este mi destino? ¿Perderme lentamente?"
 
  POD_epidemic.1102.t: "[SCOPE.Custom('EventTitleDisease')]: Una segunda oportunidad"
  POD_epidemic.1102.desc: "Me volví demacrado, tosía y sangraba. Pensé que me consumiría hasta la nada. Ciertamente me sentí así cuando apenas podía salir de la cama.\n\nSin embargo, mi salud y mi fuerza se recuperaron, aunque muy lentamente. Finalmente, estoy listo para enfrentarme al mundo y a todos sus desafíos."
  POD_epidemic.1102.a: "¡Hora de conquistar el mundo!"
 
  POD_epidemic.1103.t: "[SCOPE.Custom('EventTitleDisease')]: La llamada de las profundidades"
  POD_epidemic.1103.desc: "La mutación llegó lentamente al principio, con cosas como pequeñas ventosas saliendo de tu antebrazo. Luego empezó a nublar tu intelecto. Finalmente, las voces hablaron en su lenguaje alienígena. A pesar de tus mejores esfuerzos, sus cánticos solo se hicieron más fuertes hasta que un día finalmente los entendiste.\n\nEl mar espera."
  POD_epidemic.1103.a: "¡Debo resistir!"
  POD_epidemic.1103.b: "Parte de un todo mayor, al fin."
  
  POD_epidemic.1111.t: "[SCOPE.Custom('EventTitleDisease')]: ¿Una cura?"
  POD_epidemic.1111.desc: "Claramente, no puedes curar la chulorviosis con métodos mundanos e incluso los poderes curativos no funcionan. Esta enfermedad parasitaria ha demostrado ser resistente a todo lo que has intentado hasta ahora y, a medida que la mutación crece, empiezas a sentirte desesperado. ¿Qué otras alternativas tienes?"
  POD_epidemic.1111.a: "El puro poder de lo Divino."
  POD_epidemic.1111.b: "El puro poder de lo Infernal."
  POD_epidemic.1111.c: "El puro poder de la $glossary_triat$ y Gaia."
  POD_epidemic.1111.d: "La resurrección podría ser una salida."
  POD_epidemic.1111.fallback: "Necesito encontrar otra forma."
  POD_epidemic.1111.fallback.tt: "Consulta tu lista de decisiones, hay una sobre cómo curar la chulorviosis."
  
  epidemic_demonic_plague: "Plaga demoníaca"
  disease_demonic_plague: "plaga demoníaca."
  health.2101.demonic_plague_outbreak.desc: "El terrible poder llamado Traer la Plaga invoca una plaga bíblica sobre los enemigos del lanzador, maldiciéndolos con una enfermedad altamente infecciosa que asola a mortales y cainitas por igual. Causa forúnculos violentos y dolorosos que parecen quemaduras sangrantes cuando revientan. El objetivo atrae enjambres de insectos y alimañas dondequiera que vaya mientras esperan su muerte inevitable y su festín inevitable.\n\nEste terrible poder ha sido usado una vez más, alzando la guadaña de la muerte sobre mi reino."
  health.2101.demonic_plague_spreads.desc: "Otra alma más se encuentra a las puertas de la Muerte, con los temidos bubones marcando su piel."
 
  POD_epidemic.1201.t: "[SCOPE.Custom('EventTitleDisease')]: El toque del Segador"
  POD_epidemic.1201.desc: "El terrible poder llamado Traer la Plaga invoca una plaga bíblica sobre los enemigos del lanzador, maldiciéndolos con una enfermedad altamente infecciosa que asola a mortales y cainitas por igual. Causa forúnculos violentos y dolorosos que parecen quemaduras sangrantes cuando revientan. El objetivo atrae enjambres de insectos y alimañas dondequiera que vaya mientras esperan su muerte inevitable y su festín inevitable.\n\nEste poder ya no es solo una historia de miedo. Con cuidado, presiono mis dedos contra el bulto en mi axila. Una fuerza oscura y mortal está mancillando mi carne, consumiéndome con cada paso que doy."
  POD_epidemic.1201.court_physician.desc: "\n\n\"Mi [ROOT.Char.GetLadyLord], haré todo lo que esté en mi mano, pero podría ser sabio prepararse para lo peor...\""
  POD_epidemic.1201.a: "¡Oh, [ROOT.Char.GetFaith.HealthGodName]! ¡Sálvame de esta pesadilla!"
 
  POD_epidemic.1202.t: "[SCOPE.Custom('EventTitleDisease')]: Contra todo pronóstico"
  POD_epidemic.1202.desc: "Parece como si la Muerte hubiera pasado por mi puerta, se hubiera demorado junto a mi cama, pero al final hubiera decidido dejarme vivir. Nunca olvidaré los tormentos del toque de [ROOT.Char.GetFaith.DeathDeityName], pero me ha abierto los ojos al milagro del presente.\n\nLa plaga demoníaca se ha cobrado muchas almas, pero yo no seré una de ellas."
  POD_epidemic.1202.a: "¡Alabado sea [ROOT.Char.GetFaith.HealthGodName] por este milagro!"
  POD_epidemic.1202.a.tt: "Ahora soy inmune a la [GetTrait('demonic_plague').GetName( GetNullCharacter )]"
  
  epidemic_gift_of_melancholia: "Don de la melancolía"
  disease_gift_of_melancholia: "don de la melancolía"
  health.2101.gift_of_melancholia_outbreak.desc: "El Don de la Melancolía inflige una virulenta enfermedad debilitante tanto a mortales como a cainitas. Ambos se ven afectados por una dolencia que causa mareos, debilidad, malestar y náuseas. La enfermedad es altamente contagiosa entre los mortales, que pueden propagarla entre sí por mera proximidad. Un vampiro debe ser el objetivo directo del poder o alimentarse de un mortal infectado para contraerla. Un vampiro infectado, sin embargo, propagará la plaga a todos aquellos de los que se alimente hasta que se cure.\n\nRecientemente se ha descubierto un caso en tu reino."
  health.2101.gift_of_melancholia_spreads.desc: "Otra alma más ha sido maldita con la enfermedad."
  
  POD_epidemic.1301.t: "[SCOPE.Custom('EventTitleDisease')]: Don de la melancolía"
  POD_epidemic.1301.desc: "El Don de la Melancolía inflige una virulenta enfermedad debilitante tanto a mortales como a cainitas. Ambos se ven afectados por una dolencia que causa mareos, debilidad, malestar y náuseas. La enfermedad es altamente contagiosa entre los mortales, que pueden propagarla entre sí por mera proximidad. Un vampiro debe ser el objetivo directo del poder o alimentarse de un mortal infectado para contraerla. Un vampiro infectado, sin embargo, propagará la plaga a todos aquellos de los que se alimente hasta que se cure.\n\nCon la primera oleada de fiebre y vómitos, ya no puedo negarlo: he sido infectado."
  POD_epidemic.1301.end.desc: "\n\nY ahora las reveladoras lesiones se extienden por mi piel..."
  POD_epidemic.1301.court_physician.desc: "\n\n\"Ciertamente, estas lesiones son una señal segura del Don de la Melancolía. Muy peligroso si no se trata\"."
  POD_epidemic.1301.a: "¡Aguantaré!"
 
  POD_epidemic.1302.t: "[SCOPE.Custom('EventTitleDisease')]: Escapando de la muerte"
  POD_epidemic.1302.desc: "Aunque queden cicatrices, tanto en mi piel como en mi mente, parece que la aflicción ha abandonado mi cuerpo. Sobreviviré. Aún hay tiempo."
  POD_epidemic.1302.a: "¡Gloria a [ROOT.Char.GetFaith.HealthGodName]! ¡Estoy bien!"
  POD_epidemic.1302.a.tt: "Ahora soy inmune al [GetTrait('gift_of_melancholia').GetName( GetNullCharacter )]"
  
  epidemic_flaying_plague: "Plaga desolladora"
  disease_flaying_plague: "plaga desolladora."
  health.2101.flaying_plague_outbreak.desc: "No todos los enemigos de los Garou pueden ser combatidos con colmillos y garras. En el invierno de 1229, los hombres lobo de Lituania fueron víctimas de una fiebre. Al principio parecía una extraña variante de la tisis, luego aparecieron los forúnculos, después la piel se desprendió, agónicamente, de los huesos. Toda la población Garou de la región murió y la enfermedad empezó a extenderse hacia el oeste. Cientos de Garou y parientes mueren a su paso mientras los Teúrgos apenas parecen capaces de contenerla.\n\nY ahora, ha venido a reclamar su tributo en tu reino."
  health.2101.flaying_plague_spreads.desc: "¡Debemos encontrar la causa!"
 
  POD_epidemic.1401.t: "[SCOPE.Custom('EventTitleDisease')]: El toque del Diablo"
  POD_epidemic.1401.desc: "No todos los enemigos de los Garou pueden ser combatidos con colmillos y garras. En el invierno de 1229, los hombres lobo de Lituania fueron víctimas de una fiebre. Al principio parecía una extraña variante de la tisis, luego aparecieron los forúnculos, después la piel se desprendió, agónicamente, de los huesos. Toda la población Garou de la región murió y la enfermedad empezó a extenderse hacia el oeste. Cientos de Garou y parientes mueren a su paso mientras los Teúrgos apenas parecen capaces de contenerla.\n\nPero la plaga ya no es solo una historia de miedo. Con cuidado, presiono mis dedos contra el bulto en mi axila. Una fuerza oscura y mortal está mancillando mi carne, consumiéndome mientras aún respiro."
  POD_epidemic.1401.court_physician.desc: "\n\n\"Mi [ROOT.Char.GetLadyLord], haré todo lo que esté en mi mano, pero podría ser sabio prepararse para lo peor...\""
  POD_epidemic.1401.a: "¡Oh, [ROOT.Char.GetFaith.HealthGodName]! ¡Sálvame de esta pesadilla!"
 
  POD_epidemic.1402.t: "[SCOPE.Custom('EventTitleDisease')]: Contra todo pronóstico"
  POD_epidemic.1402.desc: "Parece como si [ROOT.Char.GetFaith.DeathDeityName] hubiera pasado por mi puerta, se hubiera demorado junto a mi cama, pero al final hubiera decidido dejarme vivir. Nunca olvidaré los tormentos del toque de [ROOT.Char.GetFaith.DeathDeityName], pero me ha abierto los ojos al milagro de la vida.\n\nLa plaga se ha cobrado muchas almas, pero yo no seré una de ellas."
  POD_epidemic.1402.a: "¡Alabado sea [ROOT.Char.GetFaith.HealthGodName] por este milagro!"
  POD_epidemic.1402.a.tt: "Ahora soy inmune a la [GetTrait('flaying_plague').GetName( GetNullCharacter )]"
  
  epidemic_scourge: "Azote"
  disease_scourge: "azote."
  health.2101.scourge_outbreak.desc: "El Azote es una plaga específica de los vampiros que infecta la Sangre. Esta enfermedad es una cepa mutada de lepra cruzada con la peste bubónica que ataca directamente a la $pod_vitae$ del vampiro. Una vez infectada, la víctima debe gastar más sangre cada vez que emplea $pod_vitae$. Esto empeora por cada noche que la víctima sufre el Azote. En algunos casos, la víctima también sufre una dolencia desfigurante que afecta a su apariencia pero no amenaza su vida.\n\nAunque el Azote es curable caso por caso, la enfermedad en sí no puede ser exterminada. En casos extremadamente raros, un vampiro afligido se convierte en portador de la enfermedad e inmune a sus efectos. El portador entonces propaga el Azote a otros vampiros.\n\nRecientemente se ha encontrado un caso en tu reino, sumiendo a todos en un frenesí paranoico (más de lo habitual)."
  health.2101.scourge_spreads.desc: "Hora de replantearme mis hábitos alimenticios..."
 
  POD_epidemic.1501.t: "[SCOPE.Custom('EventTitleDisease')]: ¡Infectado!"
  POD_epidemic.1501.desc: "El Azote no perdona a nadie... al menos no a ti. Es una sensación extraña, la verdad; la enfermedad ha sido un vago recuerdo de tus días de respirar durante mucho tiempo hasta este momento y ahora ha vuelto para perseguirte.\n\nTe sientes débil, tu sangre tiene problemas para conjurar el poder que una vez tuvo y puedes ver en los ojos de tu séquito el miedo a estar expuestos a ti... y el brillo codicioso de las oportunidades que se sopesan mientras estás así de debilitado.\n\nTiempos difíciles por delante."
  POD_epidemic.1501.a: "Solo necesito recostarme un poco..."
 
  POD_epidemic.1502.t: "[SCOPE.Custom('EventTitleDisease')]: Contra todo pronóstico"
  POD_epidemic.1502.desc: "Parece como si [ROOT.Char.GetFaith.DeathDeityName] hubiera pasado por mi puerta, se hubiera demorado junto a mi cama, pero al final hubiera decidido dejarme vivir. Nunca olvidaré los tormentos del toque de [ROOT.Char.GetFaith.DeathDeityName], pero me ha abierto los ojos al milagro de la vida.\n\nEl Azote se ha cobrado muchas almas directa o indirectamente, pero yo no seré una de ellas."
  POD_epidemic.1502.a: "¡Alabado sea [ROOT.Char.GetFaith.HealthGodName] por este milagro!"
  POD_epidemic.1502.a.tt: "Ahora soy inmune al [GetTrait('scourge').GetName( GetNullCharacter )]"
 
 
  epidemic_entoban_plague: "Plaga entobánica"
  disease_entoban_plague: "plaga entobánica."
  health.2101.entoban_plague_outbreak.desc: "$POD_epidemic.1601.desc$"
  health.2101.entoban_plague_spreads.desc: "¡Maldiciones!"
  POD_epidemic.1601.t: "[SCOPE.Custom('EventTitleDisease')]: Enfermedad antigua"
  POD_epidemic.1601.desc: "Hace mucho tiempo, el gran Mokolé-Mbembe creó protecciones de fiebre alrededor del continente de Entoban, o más comúnmente conocido como África. Las protecciones han estado intactas durante milenios, hasta ahora. Algún necio ha desenvainado la Espada de la Fiebre y nos ha traído la miseria a todos."
  POD_epidemic.1601.end.desc: "\n\nY ahora parece que la miseria me ha llegado a mí también."
  POD_epidemic.1601.court_physician.desc: "\n\n\"Ciertamente, estas lesiones son una señal segura de la plaga entobánica. Muy peligrosa si no se trata\"."
  POD_epidemic.1601.a: "¡Aguantaré!"
 
  POD_epidemic.1602.t: "[SCOPE.Custom('EventTitleDisease')]: Escapando de la muerte"
  POD_epidemic.1602.desc: "Aunque queden cicatrices, tanto en mi piel como en mi mente, parece que la aflicción ha abandonado mi cuerpo. Sobreviviré. Aún hay tiempo."
  POD_epidemic.1602.a: "¡Gloria a [ROOT.Char.GetFaith.HealthGodName]! ¡Estoy bien!"
  POD_epidemic.1602.a.tt: "Ahora soy inmune a la [GetTrait('entoban_plague').GetName( GetNullCharacter )]"
