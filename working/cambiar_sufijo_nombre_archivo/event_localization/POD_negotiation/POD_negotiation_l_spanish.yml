l_spanish:
 POD_negotiation.4000.t: "Cazador caído"
 POD_negotiation.4000.desc: "¿Qué te impulsó, al final? ¿Codicia? ¿Miedo? ¿Sed de poder? ¿O tal vez te has convencido de que esta traición a tus principios fue todo en servicio de algún propósito noble y superior?\n\nLo hecho, hecho está. Puede que estés en paz con tu decisión, pero tus compañeros $POD_splat_hunter_plural$ no lo estarán. La noticia de tu caída en desgracia viajará rápido.\n\nMejor actúa con decisión, antes de que saquen los cuchillos."
 POD_negotiation.4000.a: "Debo cortar los lazos con mis antiguos camaradas y pasar desapercibido."
 POD_negotiation.4000.b: "Por suerte, ninguno de mis vasallos puede oponérseme."
 POD_negotiation.4000.c: "Abandonaré mis posesiones por completo."
 POD_negotiation.4000.d: "¿Así que quieren pelear conmigo? Que lo intenten."
 
 POD_negotiation.4010.t: "El mortal que sabía demasiado"
 POD_landed_mortal_warning: "#N;bold Posees tierras como un $POD_splat_mortal$ sin poder y sin conexión con ninguna de las facciones existentes. Como tal, no puedes construir nada en tus posesiones.#!"
 POD_negotiation.4010.desc: "Te sientes como un pececillo sangrando en un estanque de tiburones odiosos."
 POD_negotiation.4010.desc.diabolist: "El hecho de que hayas vinculado a un $POD_splat_demon$ no parece tan impresionante ahora. No tienes aliados, ni ingresos, ni influencia. Tampoco perspectivas, a menos que encuentres a alguien que pueda apoyarte. Aparte del demonio furioso que tienes al hombro, claro."
 POD_negotiation.4010.desc.exghoul: ""
 POD_negotiation.4010.desc.fallenhunter: "Érase una vez, podías contar con el apoyo de tus compañeros $POD_splat_hunter_plural$. Eso parece otra vida ahora. Estás solo. Y conoces demasiado bien a las bestias que acechan en la noche, y lo que le harían a un estorbo como tú."
 POD_negotiation.4010.desc.mortal: "#italic De algún modo#!, posees algunas propiedades inmobiliarias no reclamadas en el $pod_wod$. Los inquilinos de este inframundo te consideran un error. Lo rectificarán en breve. Como un $POD_splat_mortal$ solitario, sin poderes y sin conexiones, no tienes voz ni voto en el asunto."
 POD_negotiation.4010.desc.end: "Este es el momento más desesperado en el que has estado nunca. Respiras hondo y consideras tus opciones."
 POD_negotiation.4010.a: "Todo lo que puedo hacer es huir muy, muy lejos."
 POD_negotiation.4010.b: "Me arriesgaré."
 POD_negotiation.4010.b.tt: "A menos que encuentres algún tipo de apoyo #italic MUY#! rápido, solo hay una forma en que esto puede terminar."
 POD_negotiation.4010.c: "La Inquisición seguramente aceptará a un nuevo recluta."
 POD_negotiation.4010.d: "Me uniré a los Shih."
 POD_negotiation.4010.e: "Encontraré a otros que quieran luchar contra la oscuridad."
 POD_negotiation.4010.f: "Los vampiros tratan bien a sus sirvientes, ¿verdad?"
 POD_negotiation.4010.f.tt: "No, no lo hacen."
 POD_negotiation.4010.f.tt2: "" # TODO MORTAL: bound ghoul explanation with game_concept
 POD_negotiation.4010.g: "Por suerte, tengo un prisionero del que tomar vitae."
 POD_negotiation.4010.g.tt: "" # TODO MORTAL: masterless ghoul explanation with game_concept
 POD_negotiation.4010.h: "Mi única opción es vender mi alma a un nuevo maestro."
 POD_negotiation.4010.i: "Las momias están del lado de la rectitud."
 POD_negotiation.4010.j: "¿Quizás uno de los seres feéricos me encante?"
 
 POD_negotiation.4020.t: "Fin"
 POD_negotiation.4020.desc: "Una noche te vas a dormir y simplemente nunca despiertas.\n\nNo tienes forma de averiguar quién es el responsable de este desenlace tan anticlimático. Tal vez un Nosferatu invisible te cortó la garganta mientras estabas inconsciente. Tal vez un Nephandus te maldijo desde la distancia, pensando que los actos de crueldad improvisados representan la cumbre de la comedia. Tal vez fue alguien completamente diferente. Sería un experimento mental divertido, si aún tuvieras la capacidad de pensar o experimentar.\n\nAl menos de esta manera, te has librado del arrepentimiento que sentirías por tus decisiones en este momento."
 POD_negotiation.4020.a: "¿Viví una buena vida?"
 POD_negotiation.4020.b: "He vivido prácticamente la peor vida posible."
 POD_negotiation.4020.c: "He dejado algunos asuntos pendientes."