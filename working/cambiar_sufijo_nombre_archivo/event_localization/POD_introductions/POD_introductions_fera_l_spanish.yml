l_spanish:

 podintroductionsfera.2.t: "¡Alabado sea el Sol!"
 podintroductionsfera.2.desc: "El Sept de la Gloria del Sol es quizás el puesto avanzado de hombres lobo más fuerte que sobrevive en Europa Occidental tras la devastadora Plaga del Desollamiento. Aun así, la sucesión de su fundador no ha estado exenta de problemas y es una forastera improbable, Helen de las Furias Negras, quien ha ascendido como líder del Túmulo.\nSin embargo, esa fue la parte fácil. Los vampiros vecinos se han apresurado a abalanzarse sobre el Sept debilitado y han tomado la mayor parte de su territorio del sur. Si Helen quiere ser recordada como una leyenda por derecho propio, tendrá que asegurar rápidamente sus alrededores antes de que los poderosos vampiros cercanos, e inquisidores, vayan a por el golpe de gracia."
 podintroductionsfera.2.a: "Forjaremos nuestra gloria de nuevo."
 podintroductionsfera.3.t: "Pendiente de un hilo"
 podintroductionsfera.3.desc: "La presencia de los hombres lobo en Iberia casi ha desaparecido. El antaño poderoso Sept de los Campos de Estrellas ha sido devastado en una costosa guerra contra la vecina Orden de Santiago y, cuando el polvo se asentó, los únicos ganadores fueron los vampiros. Con la mayoría de sus líderes y guerreros muertos, el Sept estaba prácticamente destruido hasta que apareció una extraña forastera, Lucille de los Roerhuesos.\nEsta astuta embaucadora logró confundir a las sanguijuelas y a los inquisidores en enrevesadas intrigas el tiempo suficiente para que los Campos de Estrellas se recuperaran un poco. Para sorpresa de todos, incluso tal vez la suya, se convirtió en la gobernante de facto de los asediados supervivientes. Aun así, incluso con esas pequeñas victorias, su posición es casi desesperada. ¿Serán sus trucos y su astucia suficientes para salvar a los Garou ibéricos?"
 podintroductionsfera.3.a: "¿Supervivencia contra todo pronóstico?"
 podintroductionsfera.4.t: "El día después"
 podintroductionsfera.4.desc: "Por toda Escandinavia, la Camada de Fenris grita su reciente victoria contra el odiado Wotan, también conocido como Odín. Pero incluso ellos saben que esta victoria les costó mucho más de lo que podían permitirse. Con sus mejores guerreros y líderes de guerra muertos y desaparecidos, ha surgido un líder sin demostrar y la estirpe de Odín se está reuniendo rápidamente en el sur para vengar a su Dios maldito.\nMás al este, los Hijos de Gaia del Sept del Mar Blanco observan la situación, preocupados de que esta guerra pueda envolverlos pronto a ellos también. ¿Deberían encontrar nuevos amigos en la cercana Rusia o poner todo su apoyo detrás de la guerra desesperada librada por la Camada de Fenris? Su respuesta podría cambiar el destino de los hombres lobo escandinavos."
 podintroductionsfera.4.a: "No sabe a victoria"
 podintroductionsfera.5.t: "La última resistencia de los celtas"
 podintroductionsfera.5.desc: "Siempre una fuerza poderosa en las Islas Británicas, la Tribu Fianna ha sido diezmada por la Plaga del Desollamiento, dejándolos totalmente expuestos al poderoso vampiro conocido como Mitra. Apenas aguantando en Gales, se han reagrupado en el Túmulo del Mar Salvaje bajo el liderazgo del Rey Bladdud, un líder probado y carismático.\nA pesar del respeto que inspira, muchos se preguntan si incluso él puede hacer algo ante esta situación desesperada. ¿Quizás el tiempo de los celtas ha terminado realmente? ¿O tal vez este sea el comienzo de la historia más grande que surja de los Fianna, la de su gloriosa reconquista de su hogar?"
 podintroductionsfera.5.a: "Al menos, será una historia que valga la pena contar"
 podintroductionsfera.6.t: "Tierra de lobos"
 podintroductionsfera.6.desc: "Rusia y las Estepas siguen siendo una tierra indómita y los hombres lobo están en una posición fuerte aquí. Desde el poderoso Sept de la Luna Creciente, Yuri Tvarivich gobierna a los Colmillos Plateados y es un ejemplo de su tribu. Sus hazañas contra la maldita Cortina de Sombras de Baba Yaga ya son legendarias.\nMás al este, los Garras Rojas se han retirado al Túmulo del Bosque de Invierno para lamerse las heridas, ya que han sido heridos de gravedad por la Plaga del Desollamiento.\nFinalmente, en el sur, los Señores de las Sombras siguen librando su guerra eterna contra los Tzimisce. También debilitados por la Plaga del Desollamiento, han sido puestos a la defensiva, pero podrían beneficiarse de la guerra en curso entre Tzimisce y Tremere para recuperarse de sus pérdidas territoriales."
 podintroductionsfera.6.a: "Si tan solo pudiéramos unirnos..."
 podintroductionsfera.7.t: "Lobos cruzados"
 podintroductionsfera.7.desc: "Acre es la tierra de los Guardianes de los Hombres, esa peculiar tribu que se siente como en casa entre los humanos en sus ciudades. Eso no los hace menos hombres lobo que los demás, como muestra la reciente y despiadada guerra por el liderazgo del Túmulo de la Promesa Brillante. Cuando el polvo se asentó, es la dama de Ultramar, Isabeau du Laurent, quien se erige como Alfa por ahora.\nPreocupados por este conflicto interno, los Guardianes fueron ajenos a la creciente amenaza presentada por los vampiros en la región. Esta amenaza, si no se trata con rapidez y decisión, podría significar la perdición para los lobos de la ciudad."
 podintroductionsfera.7.a: "¿Una Promesa Brillante destrozada?"
 podintroductionsfera.8.t: "Lejos de Egipto"
 podintroductionsfera.8.desc: "Desde su derrota contra el odiado 'dios' egipcio Set, los Caminantes Silenciosos han estado huyendo tras su gobernante inmortal, el sabio Wepauwet. Siguiendo signos y profecías auspiciosas, han descubierto la Rueda de Ptah cerca de Marrakech y han estado ocupados reclamando el área circundante para sí mismos desde entonces.\nLos Caminantes son pocos y no son los más belicosos de los Garou, pero con un sentido de propósito renovado y el liderazgo paciente de su venerado Alfa, finalmente están encontrando la esperanza de nuevo. Algunos incluso sueñan con volver a ver Egipto algún día..."
 podintroductionsfera.8.a: "Una nueva esperanza"
 podintroductionsfera.9.t: "La cima del mundo"
 podintroductionsfera.9.desc: "Lejos del resto de la nación Garou, la pequeña tribu de los Contemplaestrellas ha estado prosperando en el Himalaya. Contemplativos y pacientes por naturaleza, se han contentado con vivir sus vidas en relativa paz. Aun así, este estado actual no podía durar para siempre.\nEl reciente ataque de un poderoso espíritu maligno ha sido visto como un presagio por el sabio Chakal. Si los Contemplaestrellas permanecen aislados y rechazan cualquier contacto con el mundo exterior, solo les espera la perdición. Con una sensación de mezcla de pavor y curiosidad, los Contemplaestrellas miran ahora hacia afuera por primera vez en siglos. ¿Qué les espera?"
 podintroductionsfera.9.a: "Todo un mundo por explorar"
 
 podintroductionsfera.100.t: "¡Bienvenidos a Tribus de Tinieblas!"
 podintroductionsfera.100.desc: "$POD_generic_introduction$"
 podintroductionsfera.100.a: "Hablemos de las mecánicas principales de los Hombres Lobo..." 
 podintroductionsfera.100.b: "...o sobre la sucesión de los Hombres Lobo" 
 podintroductionsfera.100.c: "Saber de las Tribus" 
 podintroductionsfera.100.d: "¡Estoy bien, vamos!"
 podintroductionsfera.103.t: "Hora de la Rabia"
 podintroductionsfera.103.desc: "Los hombres lobo tienen varias diferencias clave con otros personajes. Primero, viven en posesiones tribales y mayoritariamente no les importa, o quieren activamente bajar, el desarrollo para acceder a sus edificios. Esos edificios cuestan prestigio, al igual que la mayoría de las cosas en la sociedad y mecánicas de los hombres lobo.\nAunque son luchadores muy fuertes y bastante resistentes, los hombres lobo son completamente mortales y deben planificar su sucesión en consecuencia. Cada hombre lobo tiene una 'raza' (que describe quién era antes de su Primer Cambio) y un 'auspicio' (que describe bajo qué Luna Llena ocurrió este Primer Cambio). Estos dos determinan qué estilos de vida especiales están disponibles para cada hombre lobo individual. Ganan experiencia en ellos realizando búsquedas espirituales, un Viaje.\nFinalmente, ten en cuenta que todos los hombres lobo tienen acceso a los saqueos, independientemente de su religión."
 podintroductionsfera.103.a: "¿Qué hay de la sucesión?"
 podintroductionsfera.103.c: "Saber de las Tribus" 
 podintroductionsfera.103.h: "Volver al principio"
 podintroductionsfera.104.t: "Amor a la luz de la luna"
 podintroductionsfera.104.desc: "Los hombres lobo tienen compañeros y familias que se llaman 'Parientes' (un rasgo en el mod). Cualquier hijo nacido de un hombre lobo, pariente (o una combinación de ambos) nacerá también como pariente. Luego, existe la posibilidad de que este pariente pase por el Primer Cambio en algún momento durante la pubertad.\nEsta experiencia es la primera vez que un pariente se convierte en hombre lobo (en términos de juego, el rasgo de pariente es reemplazado por el de hombre lobo). Si tu heredero resulta ser un pariente (y no experimenta el Primer Cambio), esto debilitará considerablemente tu reino, ya que algunos edificios se desactivarán y perderás el acceso a los estilos de vida especiales. Aunque esto será incapacitante, aún podrías recuperarte más adelante con otra generación de hombres lobo si planificaste con antelación este suceso."
 podintroductionsfera.104.a: "Volver a lo básico" 
 podintroductionsfera.104.c: "Saber de las Tribus" 
 podintroductionsfera.105.t: "La historia hasta ahora..."
 podintroductionsfera.105.desc: "El $pod_wod$ es un universo que lleva funcionando más de 30 años, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales interactúan bajo la superficie, creando un inframundo lleno de intrigas e historias.\nEstás jugando a Dark Ages: Werewolves. Los hombres lobo (o Garou) son los campeones de Gaia (el espíritu de la Tierra). Propensos a la ira y a la acción precipitada, son no obstante valientes y diligentes en su tarea. Los Garou se dividen por Tribus, cada una con su propia cultura y características separadas. Juntos, forman la 'Nación Garou'.\nEn 1230, sin embargo, la unidad de la Nación es, en el mejor de los casos, una ilusión. La discordia entre las tribus, combinada con la devastadora Plaga del Desollamiento y el crecimiento de las civilizaciones humanas, ha dejado a los hombres lobo gravemente debilitados y retirándose a sus bosques menguantes.\nSi no se toman medidas decisivas pronto para recuperar parte del terreno perdido, los campeones de Gaia podrían convertirse pronto en nada más que una leyenda."
 podintroductionsfera.100.f: "Quiero saber aún más" 
 
 podintroductionsfera.110.t: "Los secretos de las Tribus"
 podintroductionsfera.110.desc: "¿Sobre qué concepto quieres aprender?"
 podintroductionsfera.110.a: "La Manada" 
 
 podintroductionsfera.111.t: "La Manada"
 podintroductionsfera.111.desc: "La [pack|E] es la unidad social central de la cultura de los hombres lobo, representando a un grupo de personas unidas de por vida, a menudo para lograr una gran búsqueda o propósito.\nEn el juego, puedes pedir a cualquier hombre lobo con más de 50 de opinión sobre ti que se convierta en miembro de tu [pack|E]. Una vez hecho esto, obtienes acceso a un [journey|E] que te permite entrenar a tu manada, lo que resulta en diversas mejoras para ti y tus compañeros.\nUna vez que tu manada esté completa (tú mismo y otros cuatro miembros), puedes elegir un Tótem de Manada para bendecir a tu equipo, representando a un espíritu poderoso que os da su fuerza para las pruebas que os esperan."
 podintroductionsfera.111.a: "Volver al principio" 
 
 
 podintroductionsfera.200.a: "Hablemos de las mecánicas principales de los Bastet..." 
 podintroductionsfera.200.b: "...o sobre la sucesión de los Bastet" 
 podintroductionsfera.201.t: "Secretos felinos"
 podintroductionsfera.201.desc: "Los Bastet tienen varias diferencias clave con otros personajes. Primero, viven en posesiones tribales y mayoritariamente no les importa el desarrollo para acceder a sus edificios. Esos edificios cuestan prestigio, algunos también requieren que cargos específicos de la corte sean ocupados por personajes hábiles.\nAunque son luchadores fuertes y bastante resistentes, los Bastet son completamente mortales y deben planificar su sucesión en consecuencia. Cada hombre gato tiene una 'raza' (que describe quién era antes de su Primer Cambio). Estas determinan qué estilos de vida especiales están disponibles para cada Bastet individual.\nLos Bastet (excepto los Swara) se sienten menos cómodos en la [umbra|E] que los hombres lobo y deben alcanzar el rango 2 de su rasgo antes de poder acceder a ella.\nFinalmente, ten en cuenta que todos los Bastet tienen acceso a los saqueos, independientemente de su religión."
 podintroductionsfera.202.desc: "Los Bastet tienen compañeros y familias que se llaman 'Parientes' (un rasgo en el mod). Cualquier hijo nacido de un Bastet, pariente (o una combinación de ambos) nacerá también como pariente. Luego, existe la posibilidad de que este pariente pase por el Primer Cambio en algún momento durante la pubertad.\nEsta experiencia es la primera vez que un pariente se convierte en Bastet (en términos de juego, el rasgo de pariente es reemplazado por el de Bastet). Si tu heredero resulta ser un pariente (y no experimenta el Primer Cambio), esto debilitará considerablemente tu reino, ya que algunos edificios se desactivarán y perderás el acceso a los estilos de vida especiales. Aunque esto será incapacitante, aún podrías recuperarte más adelante con otra generación de Bastet si planificaste con antelación este suceso."
 podintroductionsfera.203.desc: "El $pod_wod$ es un universo que lleva funcionando más de 30 años, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales interactúan bajo la superficie, creando un inframundo lleno de intrigas e historias.\nEstás jugando a los Bastet. Los Bastet (u hombres gato) son los ojos y oídos de Gaia (el espíritu de la Tierra). Capriciosos e individualistas, los Bastet siguen siendo considerados el segundo grupo de $glossary_fera$ más poderoso después de los hombres lobo. Los hombres gato se dividen por Tribus, cada una con su propia cultura y características separadas. Juntos, forman la 'Nación Bastet'.\nEn 1230, sin embargo, la unidad de la Nación es, en el mejor de los casos, una ilusión. Tras su derrota durante la Guerra de la Rabia contra los hombres lobo, los Bastet solo prosperaron en áreas donde los lobos no estaban presentes, principalmente África e India. La mayoría de las tribus ahora no tienen contacto entre sí, y algunas incluso se creen muertas hace tiempo. Hará falta mucho esfuerzo y un campeón hábil para que los Bastet vuelvan a estar unidos y fuertes."
 podintroductionsfera.205.desc: "La [pride|E] es la unidad social central de la cultura Bastet, representando a un grupo de personas unidas de por vida, a menudo para lograr una gran búsqueda o propósito.\nEn el juego, puedes pedir a cualquier Bastet con más de 50 de opinión sobre ti que se convierta en miembro de tu [pride|E]. Una vez hecho esto, obtienes acceso a un [journey|E] que te permite entrenar a tu manada, lo que resulta en diversas mejoras para ti y tus compañeros.\nUna vez que tu manada esté completa (tú mismo y otros cuatro miembros), puedes elegir un Tótem de Manada para bendecir a tu equipo, representando a un espíritu poderoso que os da su fuerza para las pruebas que os esperan."
 
 
 podintroductionsfera.300.a: "Hablemos de las mecánicas principales de los Mokolé..." 
 podintroductionsfera.300.b: "...o sobre la sucesión de los Mokolé" 
 podintroductionsfera.300.c: "Saber de los Mokolé"
 
 podintroductionsfera.301.t: "Recuerdos de dragón"
 podintroductionsfera.301.desc: "Los Mokolé tienen varias diferencias clave con otros personajes. Primero, viven en posesiones tribales y quieren activamente bajar el desarrollo para acceder a sus edificios.\nLos Mokolé tienen vidas muy largas y su esperanza de vida aumenta aún más a medida que ganan Rango. Son una raza moribunda y al principio les cuesta expandir su dinastía. Su [journey|E] de Mnesis es fundamental para su poder, ya que ayuda a desbloquear sus [perks|E] más poderosas.\nLos Mokolé también deben ser siempre cautelosos con los [innocents|E] mientras viajan por la [umbra|E]."
 podintroductionsfera.302.desc: "Los Mokolé tienen compañeros y familias que se llaman 'Parientes' (un rasgo en el mod). Cualquier hijo nacido de un Mokolé, pariente (o una combinación de ambos) nacerá también como pariente. Luego, existe la posibilidad de que este pariente pase por el Primer Cambio al llegar a la edad adulta.\nEsta experiencia es la primera vez que un pariente se convierte en Mokolé (en términos de juego, el rasgo de pariente es reemplazado por el de Mokolé). No todos los parientes se convierten en Mokolé, pero la probabilidad aumenta enormemente si cualquiera de sus padres es un jugador."
 podintroductionsfera.303.desc: "El $pod_wod$ es un universo que lleva funcionando más de 30 años, con cientos de libros y otros medios que lo cubren. La idea principal es que, en nuestro mundo, varias facciones de criaturas sobrenaturales interactúan bajo la superficie, creando un inframundo lleno de intrigas e historias.\nEstás jugando a los Mokolé. Los Mokolé (u hombres lagarto) son la memoria de Gaia (el espíritu de la Tierra) y descendientes de los prehistóricos Reyes Dinosaurio. Su escaso número y una aversión mutua con los dominantes hombres lobo los convierte en un grupo de $glossary_fera$ pequeño y en peligro de extinción. Se dividen por Corrientes, cada una con su propia cultura y características separadas. Comparten un enfoque en la Mnesis, un término para describir su memoria de eras pasadas y su voluntad de preservarlas a toda costa.\nEn 1230, no ha cambiado mucho desde que los Mokolé se retiraron al aislamiento tras la Guerra de la Rabia contra los hombres lobo. Se concentran en sus unidades familiares (llamadas nidadas), preservando su legado y haciendo una crónica de los eventos para las eras venideras. Sin embargo, solo los necios confundirían esta naturaleza satisfecha con debilidad. Hubo un tiempo en que los Lagartos eran Reyes y ciertamente sabían cómo defender sus tronos."