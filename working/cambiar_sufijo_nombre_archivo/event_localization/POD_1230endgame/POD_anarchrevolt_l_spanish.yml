l_spanish:

 PODanarchrevolt.0002.t: "La Revuelta Anarquista"
 PODanarchrevolt.0002.desc: "Mientras los fuegos de la Inquisición arden por toda Europa, las cosas se vuelven cada vez más nefastas para la sociedad de los Vástagos. Los vampiros jóvenes, enfurecidos por su uso como escudos de carne bastante inflamables contra los soldados de Dios, se han levantado contra sus Antiguos en lo que ahora se llama la Revuelta Anarquista.\nHasta ahora, la Revuelta consiste principalmente en neonatos, Furores y Brujah con algunos oportunistas añadidos, pero a algunos les preocupa que pueda seguir creciendo como una bola de nieve si no se hace nada al respecto. Estos Anarquistas son débiles individualmente, pero luchan implacablemente por algo raro para los Vástagos: una causa."
 PODanarchrevolt.0002.a: "Es hora de darles una lección a estos jovencitos."
 PODanarchrevolt.0002.b: "¡Neonatos del mundo, uníos!"
 anarch_revolt_effect_message: "Muchos vampiros jóvenes, Brujah y Furores se están convirtiendo a la causa Anarquista. Se han envalentonado y son difíciles de contener." 
 anarch_revolt_name: "Revuelta Anarquista"
 anarch_revolt_doctrine_name: "Luchadores por la libertad"
 anarch_revolt_doctrine_desc: "Los Anarquistas luchan por algo que pocos $pod_cainites$ conciben jamás: una causa digna."
 PODanarchrevolt.0004.t: "La Revuelta: Muerte de Lasombra"
 PODanarchrevolt.0004.desc: "Aunque a muchos les cuesta creerlo, parece que recientemente ocurrió un evento cataclísmico en Castel d'Ombro. El centro de poder del $pod_clan$ Lasombra ha sido el objetivo de un audaz asalto liderado por un grupo de Anarquistas Lasombra ayudados por algunos de los mejores agentes de la temida casta de Guerreros Assamitas.\nLos informes del asalto real son incompletos, y solo un Lasombra salió vivo de la fortaleza, pero si se le cree... el propio Lasombra ha muerto. Este evento ha envalentonado a los Anarquistas en todas partes, y una gran mayoría del $pod_clan$ Lasombra se ha unido ahora a la causa de los chiquillos rebeldes. La Revuelta Anarquista se caldea noche tras noche."
 PODanarchrevolt.0004.a: "¡Aprenderán cuál es su lugar!"
 PODanarchrevolt.0004.b: "...quizás sea hora de replantear mi posición."
 lasombra_revolt_effect_message: "El $pod_clan$ Lasombra se está convirtiendo a la causa Anarquista. Solo el más poderoso de sus gobernantes se resiste." 
 slayer_of_gods: "Asesino de dioses"
 slayer_of_gods_desc: "Este personaje ha matado, posiblemente, a una de las entidades más poderosas de esta realidad. Inspira respeto y temor a partes iguales."  
 PODanarchrevolt.0006.t: "La Revuelta: Muerte de Absimilliard"
 PODanarchrevolt.0006.desc: "Lo imposible ha sucedido.\nEn uno de los bosques más profundos de Rusia, un grupo de Anarquistas Nosferatu logró localizar lo que afirmaban ser el lugar de descanso del monstruoso progenitor de su $pod_clan$, Absimilliard. Tras una terrible batalla contra los guardianes de la tumba, solo quedó uno de los asaltantes, pero este ha matado, si se le cree, al [Glossary('Antediluvian','game_concept_antediluvian_desc')] mientras dormía. En todo el mundo, el $pod_clan$ Nosferatu respira finalmente libre por primera vez desde su creación y ahora se une en masa a las filas de su héroe.\nEn toda Rusia, se puede oír la risa maníaca de una anciana noche tras noche desde el evento...."
 nosferatu_revolt_effect_message: "El $pod_clan$ Nosferatu se está convirtiendo a la causa Anarquista. Solo el más poderoso de sus gobernantes podría resistirse." 
 PODanarchrevolt.0008.t: "La Revuelta: Muerte de Ennoia"
 PODanarchrevolt.0008.desc: "Llegan noticias graves del gélido Norte; la manada de Anarquistas Gangrel que partió para localizar a Ennoia, la progenitora de su $pod_clan$, ha regresado, o al menos uno de ellos.\nEste superviviente atormentado pero orgulloso cuenta historias de maravillas y monstruos, de traiciones y batallas dignas del mismísimo Ragnarok, pero, al final, el guerrero habla de la muerte de Ennoia, asesinada en su sueño letárgico tras la terrible lucha contra los guardianes de su tumba. Obviamente, es increíblemente difícil verificar tales afirmaciones, pero ya han tenido un poderoso efecto dominó en el $pod_clan$ Gangrel, ya que muchos se han unido a la causa Anarquista. La revuelta se caldea noche tras noche."
 gangrel_revolt_effect_message: "El $pod_clan$ Gangrel se está convirtiendo a la causa Anarquista. Solo el más poderoso de sus gobernantes podría resistirse." 
 PODanarchrevolt.0010.t: "La Revuelta: Muerte de Tzimisce"
 PODanarchrevolt.0010.desc: "Ha vuelto a suceder.\nUn grupo de anarquistas Tzimisce ha realizado una incursión contra algunos antiguos de su $pod_clan$, con el objetivo ostensible de asegurar el lugar de descanso del [Glossary('Antediluvian','game_concept_antediluvian_desc')]. Tras obtener esta información, su ejército marchó sobre el Monasterio de Semog, donde se produjo una terrible batalla con los Szlachta defensores. Saliendo victoriosos, los Anarquistas lograron de algún modo disipar las protecciones mágicas de la tumba y su líder consumió ávidamente al propio Tzimisce.\nEsta asombrosa victoria ha sumido al viejo $pod_clan$ en manos de la Revuelta, reclamando su lugar como uno de los pocos linajes que logró deshacerse de su progenitor."
 tzimisce_revolt_effect_message: "El $pod_clan$ Tzimisce se está convirtiendo a la causa Anarquista. Solo el más poderoso de sus gobernantes podría resistirse." 
 PODanarchrevolt.0012.t: "La Revuelta: Muerte de Arikel"
 PODanarchrevolt.0012.desc: "Arikel, la progenitora del $pod_clan$ Toreador, siempre pareció ajena al Gran Juego jugado por los [Glossary('Antediluvians','game_concept_antediluvian_desc')]. Sin embargo, eso no ha sido suficiente para protegerla de la Revuelta Anarquista.\nTe han llegado informes de que una audaz fuerza de anarquistas Toreador ha atacado su refugio en Creta, aparentemente ayudada por información proporcionada por algún antiguo Nosferatu. El resto de la historia es confuso, con algunos miembros supervivientes afirmando que Arikel estaba dormida, mientras que otros hablan de una gran batalla, pero todos están de acuerdo en decir que la Bailarina del Toro de Enoch ha caído ante su propio linaje.\nAlentado por esta noticia, el $pod_clan$ Toreador está asumiendo ahora un papel mucho más activo en la Revuelta Anarquista."
 toreador_revolt_effect_message: "El $pod_clan$ Toreador se está convirtiendo a la causa Anarquista. Solo el más poderoso de sus gobernantes podría resistirse." 
 PODanarchrevolt.0014.t: "La Revuelta: Muerte de Ventru"
 PODanarchrevolt.0014.desc: "Ni siquiera el $pod_clan$ de los Reyes se libra de la locura de la Revuelta Anarquista. En algún lugar profundo de Persia, una coterie de anarquistas Ventrue tropezó con la tumba del [Glossary('Antediluvian','game_concept_antediluvian_desc')]. Algunos dicen que buscaban a Haqim, el progenitor de los Assamitas, y fueron engañados por sus astutos chiquillos; otros simplemente hablan de una obvia y bastante burda toma de poder.\nSea cual sea la razón real, estos Ventrue han regresado afirmando haber matado a su progenitor, desaparecido hace mucho tiempo. Aunque dudosa, esta afirmación ha llevado a muchos Ventrue a la Revuelta Anarquista, donde se deslizan fácilmente en posiciones de liderazgo. A la mayoría de los Anarquistas les preocupa que esto sea una amenaza para la ideología real de la Revuelta, pero no están realmente en posición de rechazar una mano amiga tan poderosa que se les ofrece."
 ventrue_revolt_effect_message: "El $pod_clan$ Ventrue se está convirtiendo a la causa Anarquista. Solo el más poderoso de sus gobernantes podría resistirse."