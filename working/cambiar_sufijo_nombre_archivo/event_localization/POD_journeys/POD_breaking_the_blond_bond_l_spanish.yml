l_spanish:
 POD_breaking_the_blond_bond.1.t: "Debilitar el Vínculo de Sangre"
 POD_breaking_the_blond_bond.1.desc: "Lo has logrado; lo que antes era un amor y afecto inmensos se ha reducido a un ligero agrado. Con esto, puedes herir a quien una vez consideraste tu amo eterno. Sin embargo, no será una tarea sencilla, ya que una adicción así no se supera en un día, pero al menos has dado valientemente el primer paso.\n\n#weak Solo tienes que ignorar el vacío persistente en tu corazón...#!"
 POD_breaking_the_blond_bond.1.a: "Me siento perdido..."
 POD_breaking_the_blond_bond.1.a.tooltip: "Durante los próximos #V 10#! años podrás usar una [character_interaction|E] para escapar de tu amo a cambio de un [modifier|E], o matar directamente a tu [Glossary('Domitor','game_concept_domitor_desc')]. #X ¡Si completas cualquier [bound_ghoul_mission_with_icon|E], todo este Viaje quedará anulado instantáneamente!#!"

 POD_breaking_the_blond_bond.2.t: "El Vínculo de Sangre ha Regresado"
