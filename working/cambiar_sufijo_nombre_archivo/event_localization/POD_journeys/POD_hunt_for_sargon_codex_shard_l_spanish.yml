l_spanish:
 all_sargon_codex_shards_are_in_possession: "¡Todos los fragmentos del Códice Sargón pertenecen a alguien más!"
 POD_hunt_for_sargon_codex_shard.tt: "Llevarás los fragmentos a su 'legítimo' dueño."
 POD_hunt_for_sargon_codex_shard.3.t: "Búsqueda del Códice Sargón: Una pequeña aldea"
 POD_hunt_for_sargon_codex_shard.3.desc: "Mi búsqueda del Códice Sargón me ha llevado a una pequeña aldea donde, según la información que he podido reunir, un fragmento del Códice Sargón circula en la economía local. Mis sospechas se confirman al ver el fragmento a la venta en un puesto. ¿Cómo debería proceder?"
 POD_hunt_for_sargon_codex_shard.3.a: "Simplemente compraré el fragmento."
 POD_hunt_for_sargon_codex_shard.3.b: "Lo robaré."
 POD_hunt_for_sargon_codex_shard.3.c: "Matar a todos y tomarlo para mí."
 POD_hunt_for_sargon_codex_shard.3.d: "Usaré mis poderes de control para obligar al dueño a entregármelo."
 
 POD_hunt_for_sargon_codex_shard.4.t: "Búsqueda del Códice Sargón: El recuerdo familiar"
 POD_hunt_for_sargon_codex_shard.4.desc: "Mi búsqueda del Códice Sargón me ha llevado ante una familia de estatus notable, donde se rumorea que el fragmento se encuentra entre sus tesoros familiares. Naturalmente, no están muy dispuestos a desprenderse de él. ¿Cómo debería proceder?"
 POD_hunt_for_sargon_codex_shard.4.a: "Simplemente robarlo."
 POD_hunt_for_sargon_codex_shard.4.b: "Matarlos a todos y tomarlo."
 POD_hunt_for_sargon_codex_shard.4.c: "Usar mis poderes mentales para obligar al cabeza de familia a entregármelo."
 
 POD_hunt_for_sargon_codex_shard.5.t: "Búsqueda del Códice Sargón: El refugio"
 POD_hunt_for_sargon_codex_shard.5.desc: "Mi búsqueda del Códice Sargón me ha llevado a las ruinas de lo que oculta un refugio vampírico, donde se rumorea que se encuentra el fragmento. Por lo que has averiguado, estos rumores son correctos, ya que tus fuentes han confirmado que se halla dentro del refugio. Desafortunadamente, tus fuentes no pudieron tomarlo realmente, dejándote ese trabajo a ti. Tus opciones son limitadas, pero el fragmento te espera."
 POD_hunt_for_sargon_codex_shard.5.a: "Asaltar las ruinas."
 POD_hunt_for_sargon_codex_shard.5.b: "Sobornar a algunos mortales para que saqueen el lugar."
 POD_hunt_for_sargon_codex_shard.5.c: "Usar tus poderes de dominación sobre los mortales locales para que saqueen el lugar."
 
 POD_hunt_for_sargon_codex_shard.6.t: "Búsqueda del Códice Sargón: El neonato"
 POD_hunt_for_sargon_codex_shard.6.desc: "Mi búsqueda del Códice Sargón me ha llevado al refugio de un neonato, donde he confirmado que están vendiendo el fragmento. Tras reunirme con él, he sabido que no conoce su verdadero valor, pero el precio al que lo vende es obsceno. ¿Cómo debería proceder?"
 POD_hunt_for_sargon_codex_shard.6.a: "Aceptar la pérdida de dinero."
 POD_hunt_for_sargon_codex_shard.6.b: "Enseñarle lo que sucede cuando intentan estafar a sus antiguos."
 
 POD_hunt_for_sargon_codex_shard.7.t: "Búsqueda del Códice Sargón: El culto mortal"
 POD_hunt_for_sargon_codex_shard.7.desc: "Mi búsqueda del Códice Sargón me ha llevado ante un culto mortal, donde los mortales parecen adorarlo como una reliquia divina. Frustrantemente, se niegan a desprenderse de él. Su fe es verdadera, y dominarlos es poco probable que funcione. Realmente solo hay dos formas de proceder."
 POD_hunt_for_sargon_codex_shard.7.a: "Simplemente robarlo."
 POD_hunt_for_sargon_codex_shard.7.b: "Masacrarlos."
 POD_hunt_for_sargon_codex_shard.7.c: "Debatir su fe."
 
 POD_hunt_for_sargon_codex_shard.8.desc: "Mi búsqueda del Códice Sargón me ha traído aquí...\nY no hay ningún fragmento. Mis fuentes estaban equivocadas, y he perdido el tiempo viniendo aquí..."
 POD_hunt_for_sargon_codex_shard.8.a: "Maldita sea."