l_spanish:

 pod_vampire_flavor.1000.t: "Recuerdos de la luz solar"
 pod_vampire_flavor.1000.desc: "Es sorprendente lo que una persona echa de menos tras su abrazo. Te encuentras añorando la luz del sol. Intentas recordar cómo se ve el mundo en un día soleado, con cielos azules y nubes blancas y brillantes. ¿Están estos pequeños goces verdaderamente fuera de tu alcance para siempre?"
 pod_vampire_flavor.1000.a: "Debería contratar a un pintor."
 pod_vampire_flavor.1000.b: "Si poseo a un animal podré ver el sol."
 pod_vampire_flavor.1000.c: "Un vistazo no hará daño..."
 pod_vampire_flavor.1000.d: "¡Contrólate! ¡Eres un Vástago! ¡Actúa como tal!"
 pod_vampire_flavor.1001.t: "Recuerdos de la luz solar"
 pod_vampire_flavor.1001.desc: "El artista desvela su pintura para tu aprobación. Representa un hermoso paisaje local durante un día soleado. ¡Cuando lo miras, sientes como si estuvieras realmente fuera, bajo la luz del sol! El hecho de que encargar esta obra maestra haya mejorado tu reputación es un beneficio añadido."
 pod_vampire_flavor.1001.a: "Esto es justo lo que necesitaba."

 #pod_mass.100.t: "¡Ghouls, ghouls por todas partes!"
 #pod_mass.100.desc: "Hay acusaciones de que has dado tu sangre a muchísimos lugareños para alimentar tu maquinaria de guerra con soldados ghouls, lo cual es rechazado por las Tradiciones de los cainitas y muchas de las vías. Esto también es mal visto por la mayoría como una grave brecha de la Mascarada a punto de ocurrir, ya que tantos ghouls son difíciles de ocultar.\n¿Cuál es tu respuesta?"
 #pod_mass.100.a: "Pagar a alguien para que lo encubra."
 #POD_massregnant_event_repeat.tt: "Este evento se repetirá si sigues teniendo regimientos de $POD_ghoul_maa$ en el futuro."
 #pod_mass.100.b: "Es verdad, ¿y qué?"
 #pod_mass.200.t: "¡Vampiros, vampiros por todas partes!"
 #pod_mass.200.desc: "Hay acusaciones de que has dado tu sangre a muchísimos lugareños para alimentar tu maquinaria de guerra con soldados vampiros recién creados, lo cual es rechazado por las Tradiciones de los cainitas y muchas de las vías. Esto también es mal visto por la mayoría como una grave brecha de la Mascarada a punto de ocurrir, ya que tantos vampiros nuevos son difíciles de ocultar.\n¿Cuál es tu respuesta?"
 #pod_mass.200.a: "Pagar a alguien para que lo encubra."
 #POD_masssire_event_repeat.tt: "Este evento se repetirá si sigues teniendo regimientos de hombres de armas vampiros en el futuro."
 #pod_mass.200.b: "Es verdad, ¿y qué?"
 
 ### ==========================================
 ### EVENTOS DE CULTIVO BOMKAZI
 ### ==========================================

 ### Evento 1: Iniciación del cultivo
 POD_impundulu.1001.t: "La llamada de las Bomkazi"
 POD_impundulu.1001.desc: "El antiguo pacto entre nuestra sangre y las brujas Bomkazi exige una renovación. Se debe encontrar un nuevo compañero, uno cuyas venas porten la chispa de la magia de vida, que pueda caminar a nuestro lado como pareja y sustento a la vez.\n\nLa búsqueda llevará tiempo y esfuerzo, pero sin una Bomkazi a nuestro lado, estamos mermados."
 POD_impundulu.1001.a: "Comenzar la búsqueda de inmediato."
 POD_impundulu.1001.b: "Aún no es el momento adecuado."
 POD_impundulu.1001.c: "No necesito a ninguna bruja."
 POD_impundulu_bomkazi_start_cultivation_tt: "Comenzarás a buscar a un mortal con potencial de magia de vida para cultivarlo como compañero Bomkazi."
 POD_impundulu_bomkazi_delay_cultivation_tt: "Se te recordará esta oportunidad en 20-40 años."
 POD_impundulu_bomkazi_refuse_cultivation_tt: "Rechazas el cultivo. El pacto se debilita."

 ### Evento 2: Selección de calidad
 POD_impundulu.1002.t: "La forma del don"
 POD_impundulu.1002.desc: "¿Qué clase de Bomkazi buscamos? La magia de vida se manifiesta de forma diferente en cada mortal que porta su semilla. Algunos la canalizan a través del intelecto y el estudio, otros a través de la propia resistencia del cuerpo, y unos pocos elegidos ven más allá del propio velo.\n\nLa búsqueda debe ser guiada por nuestras necesidades."
 POD_impundulu.1002.a: "Buscar a un erudito: uno cuya mente arda con fuerza."
 POD_impundulu.1002.b: "Buscar a un sanador: uno cuyo toque remiende la carne."
 POD_impundulu.1002.c: "Buscar a un vidente: uno que mire más allá del velo."
 POD_impundulu_bomkazi_seek_scholar_tt: "El cultivo favorecerá el intelecto y el aprendizaje. Tu búsqueda llevará de 5 a 15 años."
 POD_impundulu_bomkazi_seek_healer_tt: "El cultivo favorecerá la salud y la resistencia. Tu búsqueda llevará de 5 a 15 años."
 POD_impundulu_bomkazi_seek_seer_tt: "El cultivo favorecerá la visión mística y la intuición. Tu búsqueda llevará de 5 a 15 años."

 ### Evento 3: Creación oculta (el texto de la opción nunca se muestra)
 #POD_impundulu.1003.a: "La búsqueda continúa..."

 ### Evento 4: Éxito
 POD_impundulu.1004.t: "Una Bomkazi encontrada"
 POD_impundulu.1004.desc: "La búsqueda ha dado sus frutos. Un joven [bomkazi_candidate.Custom('WomanManGirlBoy')] está ante nosotros, con su sangre cantando con el antiguo poder. Ha sido probado y entrenado, y la magia de vida fluye pura en sus venas.\n\nSerá nuestro compañero, nuestro ancla al mundo de los vivos. El pacto perdura."
 POD_impundulu.1004.a: "Bienvenido, [Select_CString( bomkazi_candidate.IsFemale, 'hermana', 'hermano' )] del pacto."
 POD_impundulu_bomkazi_witch_arrives_tt: "Una bruja Bomkazi totalmente cultivada se une a tu corte como amiga y compañera."

 ### Evento 5: Éxito parcial
 POD_impundulu.1005.t: "La promesa de un aprendiz"
 POD_impundulu.1005.desc: "El candidato es prometedor, pero la magia de vida en su interior es tenue: una llama vacilante donde debería haber una hoguera. Podría servir como aprendiz Bomkazi, aprendiendo las viejas costumbres, aunque puede que nunca alcance el pleno poder de las brujas de antaño.\n\nEs algo. Tendrá que ser suficiente."
 POD_impundulu.1005.a: "Crecerá con el tiempo. Bienvenido sea."
 POD_impundulu.1005.b: "No es suficiente. Esperaré."
 POD_impundulu_bomkazi_apprentice_arrives_tt: "Un aprendiz Bomkazi se une a tu corte. Sus poderes son más débiles que los de una bruja Bomkazi completa."

 ### Evento 6: Fracaso
 POD_impundulu.1006.t: "La búsqueda flaquea"
 POD_impundulu.1006.desc: "Años de búsqueda no han dado nada. Cada candidato probado, cada mortal examinado... ninguno porta la chispa de la magia de vida con la fuerza suficiente para ser cultivado. El linaje Bomkazi se debilita con cada generación.\n\nQuizás la próxima búsqueda resulte más fructífera. O quizás las viejas costumbres estén muriendo de verdad."
 POD_impundulu.1006.a: "Lo intentaremos de nuevo. El pacto lo exige."
 POD_impundulu.1006.b: "La línea Bomkazi está fallando..."

 ### ==========================================
 ### LOCALIZACIÓN DE RASGOS
 ### ==========================================

 trait_bomkazi_witch: "Bruja Bomkazi"
 trait_bomkazi_witch_desc: "Una bruja de vida mortal cultivada por los Impundulu. Las Bomkazi portan la chispa de la magia de vida en su sangre, sirviendo como compañeras espirituales y sustento para sus parejas no muertas."
 trait_bomkazi_witch_character_desc: "[ROOT.Char.GetFirstNameNoTooltip|U] porta el pleno poder de las brujas de vida Bomkazi, cultivado mediante ritos antiguos para servir como compañero de los Impundulu."

 trait_bomkazi_apprentice: "Aprendiz Bomkazi"
 trait_bomkazi_apprentice_desc: "Un mortal con cierto potencial de magia de vida, pero no totalmente cultivado. El poder en su sangre es tenue comparado con el de una verdadera bruja Bomkazi."
 trait_bomkazi_apprentice_character_desc: "[ROOT.Char.GetFirstNameNoTooltip|U] muestra rastros de talento para la magia de vida, aunque el poder no se ha manifestado plenamente. Un aprendiz en la tradición Bomkazi."

 ### ==========================================
 ### EVENTOS DE CREACIÓN DE ARTEFACTOS
 ### ==========================================

 ### Piedra de Visión (Shew-Stone)
 POD_impundulu.3001.t: "El rito de la piedra de visión"
 POD_impundulu.3001.desc: "La piedra se pule hasta quedar lisa y se coloca sobre una tumba. Con sangre de ave pintamos el nombre de aquel a quien queremos vigilar. Los espíritus se agitan, atraídos por la piedra como polillas a la llama.\n\nCuando el rito se completa, la piedra zumba débilmente en nuestra palma. Dondequiera que vaya el nombrado, los susurros le seguirán."
 POD_impundulu.3001.a: "Los muertos lo ven todo. Ahora, yo también."
 POD_impundulu_shewstone_crafted_tt: "Has fabricado una piedra de visión. Otorga bonificaciones a la Intriga y al descubrimiento de intrigas."

 ### Tambores de Pesadilla
 POD_impundulu.3002.t: "Los tambores del pavor"
 POD_impundulu.3002.desc: "Piel humana estirada sobre hueso. Las baquetas talladas en las costillas de un ahorcado. Al ser golpeados, ningún oído vivo percibe el sonido, pero los muertos oyen, y obedecen.\n\nLos espíritus vinculados a estos tambores llevarán pesadillas a cualquier durmiente que nombremos."
 POD_impundulu.3002.a: "Que los vivos conozcan el terror de los muertos."
 POD_impundulu_nightmare_drums_crafted_tt: "Has fabricado tambores de pesadilla. Generan pavor y potencian el poder de las intrigas hostiles."

 ### Ojo de Bruja
 POD_impundulu.3003.t: "El precio de la visión"
 POD_impundulu.3003.desc: "El ojo del cadáver ha sido preparado: empapado en tierra de tumba, inscrito con signos de muerte, encantado con todo el peso de nuestro conocimiento nigromántico. Ahora viene la parte más difícil.\n\nCon manos firmes, nos quitamos nuestro propio ojo y presionamos el del muerto en la cuenca. El dolor es extraordinario. Y entonces, vemos. Todo. Los espíritus, los muertos persistentes, las mentiras que se esconden tras cada rostro vivo.\n\nEl mundo nunca volverá a verse igual."
 POD_impundulu.3003.a: "El precio está pagado. La visión es mía."
 POD_impundulu_witch_eye_crafted_tt: "Te has implantado el ojo de bruja. Otorga bonificaciones a la nigromancia y a la detección de intrigas, pero marca permanentemente tu apariencia."

 ### Nombres y descripciones de artefactos
 artifact_shewstone_name: "Piedra de visión"
 artifact_shewstone_description: "Una piedra pulida consagrada pintada con sangre de ave. Los espíritus susurran los secretos de los nombrados en ella."

 artifact_nightmare_drums_name: "Tambores de pesadilla"
 artifact_nightmare_drums_description: "Tambores de piel y hueso humanos. Inaudibles para los vivos, ordenan a los fantasmas atormentar los sueños de un rival."

 artifact_witch_eye_name: "Ojo de bruja"
 artifact_witch_eye_description: "Un ojo encantado de un cadáver inquieto, implantado en la propia cuenca del nigromante. Otorga Visión de la Muerte permanente a un coste terrible."

 ### Tooltips de decisiones de artefactos
 imp_requires_cenotaph_path_tt: "Requiere conocimiento de la Senda del Cenotafio #italic ([GetPerk('ns_a_touch_of_death_perk').GetName(GetPlayer)] [perk|E])#!"
 imp_requires_haunting_path_3_tt: "Requiere nivel 3 de la Senda del Atormentamiento #italic ([GetPerk('ns_harrowing_perk').GetName(GetPlayer)] [perk|E])#!"

 ### Localización de modificadores de artefactos
 artifact_shewstone_modifier: "Piedra de visión"
 artifact_shewstone_modifier_desc: "Los espíritus susurran secretos del nombrado."
 artifact_nightmare_drums_modifier: "Tambores de pesadilla"
 artifact_nightmare_drums_modifier_desc: "Los muertos obedecen la llamada silenciosa de los tambores."
 artifact_witch_eye_modifier: "Ojo de bruja"
 artifact_witch_eye_modifier_desc: "El ojo muerto ve lo que los vivos no pueden."
 imp_witch_eye_scarred_modifier: "Cicatrizado por el ojo de bruja"
 imp_witch_eye_scarred_modifier_desc: "La automutilación requerida por el ritual del ojo de bruja ha dejado marcas permanentes."

 ### ==========================================
 ### EVENTOS DE TRASFONDO
 ### ==========================================

 ### Evento 1: La sangre se debilita
 POD_impundulu.1.t: "La sangre se debilita"
 POD_impundulu.1.desc: "Tu Bomkazi trae noticias preocupantes. La generación más joven de brujas mortales muestra un talento más débil que el de sus madres. La magia de vida que antaño ardía en su linaje se está apagando, desvaneciéndose como una vela al viento.\n\nCada década, menos candidatos muestran la chispa. El pacto que nos sostiene —que nos ha sostenido durante siglos— podría estar muriendo."
 POD_impundulu.1.a: "Esto me preocupa enormemente. Debemos encontrar una solución."
 POD_impundulu.1.b: "No dejaré que el pacto falle. No mientras yo perdure."
 POD_impundulu.1.c: "Las Bomkazi han sobrevivido todo este tiempo. Perdurarán."

 ### Evento 2: El fallecimiento de una Bomkazi
 POD_impundulu.2.t: "El fallecimiento de una Bomkazi"
 POD_impundulu.2.desc: "La bruja Bomkazi ha muerto. Su magia de vida, que nos sostenía y nos anclaba al mundo de los vivos, se ha apagado.\n\nLos viejos ritos exigen que guiemos su alma a través del pasaje entre mundos. Es lo mínimo que debemos a quienes nos lo dan todo."
 POD_impundulu.2.a: "Realizaré los ritos funerarios. El pacto lo exige."
 POD_impundulu.2.b: "Guardo luto en silencio. Los muertos guardan sus propios secretos."

 ### Evento 3: La oferta del nigromante
 # (nota: sin usar)
 POD_impundulu.3.t: "La oferta del nigromante"
 POD_impundulu.3.desc: "Nos han llegado noticias de un colega estudioso de la muerte: [imp_necromancer_contact.GetFirstNameNicknamed], cuyo enfoque de la nigromancia difiere del nuestro. Ha expresado curiosidad por nuestras sendas del Cenotafio y del Atormentamiento, conocimientos exclusivos de los Impundulu.\n\nQuizás un intercambio de conocimientos podría beneficiarnos a ambos."
 POD_impundulu.3.a: "Debería acercarme a ellos. El conocimiento es poder."
 POD_impundulu.3.b: "No estoy listo para tal intercambio."
 POD_impundulu_necromancer_offer_hint_tt: "La interacción 'Intercambiar conocimientos nigrománticos' puede estar disponible con este personaje."

 ### Evento 4: El pesar del fundador
 POD_impundulu.4.t: "El pesar del fundador"
 POD_impundulu.4.desc: "En las profundas vigilias de la noche, un recuerdo aflora sin ser llamado: Bomkazi, la primera esposa-bruja. Su rostro. Su voz. El ritual que nos unió, vivos y muertos, en un pacto que ninguno de los dos comprendía del todo.\n\nElla rechazó el Abrazo. Eligió la mortalidad, eligió envejecer y marchitarse mientras nosotros permanecíamos inalterados. Y sin embargo se quedó. Hasta el final.\n\nLos siglos no han mitigado el pesar. Quizás nada lo haga jamás."
 POD_impundulu.4.a: "Te recuerdo, Bomkazi. Siempre te recordaré."
 POD_impundulu.4.b: "El pesar se ha convertido en un compañero. Familiar, aunque no bienvenido."
