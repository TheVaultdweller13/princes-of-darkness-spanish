l_spanish:


 POD_fera_pack.1.t: "Tu [GetPlayer.Custom('PODCoterie')]"
 POD_fera_pack.1.desc: "Los miembros de tu [GetPlayer.Custom('PODCoterie')] se han reunido. Como líder, tienes el derecho de elegir cómo entrenar durante los próximos años o en qué actividad centraros."
 
 POD_fera_pack.1.option.a: "Debemos frenar el crecimiento de la humanidad"
 POD_fera_pack.1.option.b: "¡Debemos prepararnos para la guerra!"
 POD_fera_pack.1.option.c: "¡Hora de entrenar!"
 POD_fera_pack.1.option.d: "La lengua de plata de [pack_diplomacy_teacher.GetFirstName] es digna de respeto."
 POD_fera_pack.1.option.e: "Todos podemos aprender más estrategias de [pack_martial_teacher.GetFirstName]."
 POD_fera_pack.1.option.f: "Estudiar las habilidades administrativas de [pack_stewardship_teacher.GetFirstName] resultará útil."
 POD_fera_pack.1.option.g: "[pack_intrigue_teacher.GetFirstName] nos enseñará a ser uno con las sombras."
 POD_fera_pack.1.option.h: "La sabiduría de [pack_learning_teacher.GetFirstName] puede iluminarnos."
 POD_fera_pack.1.option.i: "Debemos pedir a los Espíritus su bendición." 
 POD_fera_pack.1.option.z: "Nada por ahora"

 fera_pack_coterie_rewards_tt: "Los miembros de tu [GetPlayer.Custom('PODCoterie')] también obtendrán esta recompensa."
 fera_pack_teaching_rewards_tt: "Todos los miembros de tu [GetPlayer.Custom('PODCoterie')], excepto el maestro, mejorarán su [skill|E] relacionada."
 fera_pack_teaching_warning_tt: "@warning_icon!#X Tienes la [skill|E] más alta de tu [GetPlayer.Custom('PODCoterie')] y no obtendrás ninguna recompensa.#!"
 fera_pack_totem_tt: "Suplicarás por un Tótem para tu [GetPlayer.Custom('PODCoterie')]\n@warning_icon!#X Tu elección de tótem es permanente.#!"



 POD_fera_pack.2.t: "Protección espiritual" 
 POD_fera_pack.2.desc: "Entre los $glossary_fera$ y especialmente los Garou, el tótem es uno de los aspectos vinculantes fundamentales de la manada. Un tótem es un espíritu potente que presta su poder a un grupo de individuos con inclinaciones místicas a cambio de algún servicio o tributo simbólico. La elección de un tótem es de extrema importancia para una manada, ya que este espíritu los protegerá en momentos de necesidad y servirá como una luz guía para que los Garou la sigan.\nEsta elección funciona como una petición al espíritu tótem, quien luego decide si adopta a los miembros de la manada como sus 'hijos'."
 POD_fera_pack.2.desc.bastet: "\nLos Bastet llaman a tales espíritus \"Jamak\" y aquellos que eligen aliarse con los hombres gato tienden a ser caprichosos, apareciendo de la nada para exigir peticiones aparentemente absurdas. Aun así, otorgan su protección como lo hacen todos los demás tótems espirituales y son respetados como protectores poderosos, aunque difíciles de entender, de los Bastet."
 
