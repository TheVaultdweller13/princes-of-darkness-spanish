l_spanish:
 
 
 
 
  POD_fera_beastborn.1.t: "Parientes perdidos"
  POD_fera_beastborn.1.desc: "Hace mucho tiempo, los Bubasti se unieron a Horus en su lucha eterna contra su decadente tío, Set. Aunque la causa era justa y los Bubasti todavía se enorgullecen de su contribución, el resultado fue una derrota terrible. Los triunfantes Setitas capturaron a los parientes felinos de los Bubasti, los gatos Kyphur, y los mataron o los alimentaron con sangre para convertirlos en monstruos aberrantes.\nHoy en día, los Bubasti aún no se han recuperado y, a diferencia de sus tribus hermanas Bastet, no tienen acceso a sus parientes felinos para obtener ayuda y aumentar sus números.\nEs probable que la tribu nunca prospere verdaderamente hasta que los últimos gatos Kyphur sean rescatados de los Setitas."
  POD_fera_beastborn.1.a: "Salvaremos a nuestros parientes perdidos."
  bubasti_beastborn_content_tt: "Los Bubasti tienen el objetivo de salvar a sus parientes felinos perdidos. No pueden beneficiarse de su ayuda hasta entonces."
 
 
 
 
  POD_fera_beastborn.10.t: "Parentesco animal"
  POD_fera_beastborn.10.desc: "Has decidido adoptar un enfoque proactivo en la vigilancia de tus parientes animales en tu región. Ya tienes a varios aliados de confianza buscando señales del Primer Cambio entre ellos sobre el terreno, pero el área a cubrir es muy extensa. Cuando un animal experimenta el Primer Cambio, suele ser una carrera entre los de tu clase y varios cazadores con malas intenciones, por lo que cuanta más gente asignes a esa tarea de vigilancia, más probabilidades tendrás de no perder a nadie."
  POD_fera_beastborn.10.a: "Ningún pariente se queda atrás."
  numerous_beast_born_tooltip: "Obtendrás varios cortesanos [GetTrait('beast_born').GetName( GetPlayer )] cuando termine esta cadena de eventos."
  POD_fera_beastborn.10.b: "No puedo cubrir a todos."
  single_beast_born_tooltip: "Solo obtendrás un cortesano [GetTrait('beast_born').GetName( GetPlayer )] cuando termine esta cadena de eventos."
 
  POD_fera_beastborn.11.t: "Rey de las bestias"
  POD_fera_beastborn.11.desc: "La naturaleza es una ama severa. Tus parientes animales, ajenos a las luchas de este mundo, todavía viven y mueren según sus reglas. Un argumento común entre los $glossary_fera$ es el grado de interferencia que debes tomar para proteger a tus parientes del mundo exterior y de la depredación de los hombres en su entorno natural. Algunos piensan que deberían defenderlos a toda costa, mientras que otros creen que estas luchas solo darán como resultado $glossary_fera$ más fuertes cuando les llegue el Primer Cambio."
  POD_fera_beastborn.11.a: "Se fortalecerán con la lucha."
  POD_fera_beastborn.11.b: "Su protección es nuestro deber."
  POD_fera_beastborn.11.c: "Un término medio es lo mejor."
  beastborn_no_interference_tooltip: "Tus prospectos habrán mejorado sus [skills|E] y pueden desarrollar [traits|E] relacionados con [martial|E] o [intrigue|E]."
  beastborn_full_interference_tooltip: "Tus prospectos habrán mejorado ligeramente sus [skills|E] y pueden acabar siendo más dóciles."
  wait_time_beastborn_tooltip: "Una vez elegidos tus enfoques, tendrás que esperar una señal del Primer Cambio entre tus parientes animales. Esto probablemente llevará varios años."
  
  POD_fera_beastborn.12.t: "Compañero de juegos"
  POD_fera_beastborn.12.desc: "Los parientes animales a los que atiendes hoy están de humor juguetón. Reconociéndote ya como un amigo de su prole, se reúnen a tu alrededor, mirándote con curiosidad mientras esperan obviamente a que los entretengas. Abrir sus horizontes introduciendo nuevos conceptos mediante juegos es ciertamente algo que puedes hacer si tienes tiempo."
  POD_fera_beastborn.12.a: "¡Hora de jugar!"
  POD_fera_beastborn.12.b: "Hoy no, amigos."
  beastborn_more_diplomacy_tooltip: "El [GetTrait('beast_born').GetName( GetPlayer )] que se unirá más tarde a tu corte empezará con más diplomacia." 
  
  POD_fera_beastborn.13.t: "Naturaleza cuentacuentos"
  POD_fera_beastborn.13.desc: "Aún no hay señales del Primer Cambio en tus parientes animales locales, pero eso no significa que no puedas pasar tiempo con ellos. Aunque carecen del conocimiento mundano de los de tu clase, tus primos animales todavía te escuchan instintivamente. Mientras se reúnen a tu alrededor, preguntándose qué harás, te planteas si tienes tiempo para contarles una historia. Después de todo, hablas su idioma y esta podría ser una buena forma de preparar a los potenciales futuros $glossary_fera$ para el mundo del más allá."
  POD_fera_beastborn.13.a: "Quedaos un rato y escuchad."
  POD_fera_beastborn.13.b: "Quizás no."
  beastborn_more_learning_tooltip: "El [GetTrait('beast_born').GetName( GetPlayer )] que se unirá más tarde a tu corte empezará con más aprendizaje." 
  
  POD_fera_beastborn.14.t: "Ira de la naturaleza"
  POD_fera_beastborn.14.desc: "Gracias a tu cuidadosa vigilancia, recientemente has sabido que unos cazadores furtivos han estado invadiendo el hábitat de tus parientes animales. Este será el último error que cometan.\nAunque su muerte ya es un hecho, te planteas si podrías ayudar sutilmente a tus parientes animales a defenderse por sí mismos, con la esperanza de que aprendan y crezcan en el proceso. De lo contrario, podrías simplemente acabar con esta amenaza por tu cuenta con bastante facilidad."
  POD_fera_beastborn.14.a: "La naturaleza contraataca."
  POD_fera_beastborn.14.b: "Me encargaré de ellos yo mismo."
  beastborn_more_martial_tooltip: "El [GetTrait('beast_born').GetName( GetPlayer )] que se unirá más tarde a tu corte empezará con más marcialidad." 
  
  POD_fera_beastborn.15.t: "Padre sobreprotector"
  POD_fera_beastborn.15.desc: "Has sido un poco demasiado sobreprotector con tus parientes animales recientemente. Se han vuelto numerosos gracias a las abundantes presas y los pocos depredadores, y las habituales leyes severas de la naturaleza se han suavizado bastante por tu presencia vigilante. Una solución sencilla para restaurar el equilibrio sería trasladar a algunos de ellos a un nuevo entorno, con la esperanza de que aprendan y se adapten a esta nueva lucha. También podrías dejar pasar esta situación; tener parientes animales felices y abundantes en tu zona no es precisamente una maldición."
  POD_fera_beastborn.15.a: "Hora de un cambio."
  POD_fera_beastborn.15.b: "Lo bueno nunca es demasiado."
  beastborn_more_stewardship_tooltip: "El [GetTrait('beast_born').GetName( GetPlayer )] que se unirá más tarde a tu corte empezará con más gestión." 
  
  POD_fera_beastborn.16.t: "El dotado"
  POD_fera_beastborn.16.desc: "Uno de tus parientes animales ha mostrado una gran promesa recientemente, con mucho ingenio y astucia. Aunque no es el espécimen más fuerte ni impresionante, algunos en tu corte ven estos talentos como una señal de grandeza y de un seguro Primer Cambio en el futuro. Sin embargo, nadie entiende realmente qué es lo que hace que alguien experimente el Primer Cambio, por lo que no estás seguro de unirte a este coro de elogios. ¿Y si los espíritus no están de acuerdo?"
  POD_fera_beastborn.16.a: "¡Claramente, es el elegido!"
  POD_fera_beastborn.16.b: "No podemos saberlo con seguridad."
  beastborn_more_intrigue_tooltip: "El [GetTrait('beast_born').GetName( GetPlayer )] que se unirá más tarde a tu corte empezará con más intriga." 
  
  POD_fera_beastborn.20.t: "Nueva generación"
  POD_fera_beastborn.20.desc: "La población animal de tu zona ha experimentado recientemente un Primer Cambio. Tu vigilancia de sus actividades ha dado sus frutos y tus agentes fueron los primeros en llegar, ayudando a aliviar la experiencia traumática para los nuevos $glossary_fera$ y ocultando su rastro de cualquier posible cazador. Agradecidos, ahora se han unido a tu corte listos para descubrir el mundo exterior y tu noble causa."
  POD_fera_beastborn.20.a: "¡Bienvenidos!"
  POD_fera_beastborn.20.b: "Este tiene potencial."
  POD_fera_beastborn.20.c: "Llevarás mi nombre."
  POD_fera_beastborn.20.d: "[beastborn_3.GetName] será mío."
  POD_fera_beastborn.20.tooltip_redtalon: "[GetDynastyPerk('redtalon_legacy_4').GetName] otorga a [beastborn_1.GetHerHim] proeza adicional."
