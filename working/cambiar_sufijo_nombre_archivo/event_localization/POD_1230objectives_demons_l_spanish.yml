l_spanish:
  pod1230objectives_demons.1.desc: "La fe es la forma en que los demonios potencian muchas de sus habilidades; como ángeles, tenían cantidades infinitas de fe para manipular. La mayoría de los caídos ahora \"cosechan\" fe de humanos dispuestos mediante la formación de pactos.\nCon cada Demonio siendo ahora una encarnación de uno de los pecados fundamentales, la mejor manera de ganar más poder es corromper a más mortales. Los cultos pequeños son bastante fáciles de establecer, pero tú has logrado algo mucho más impresionante con la creación de una red considerable de influencia teológica en tu zona.\nAunque muchos ignoran la situación real, la mayoría de los habitantes de esta región están alimentando tu ascenso al poder cada vez que rezan a lo divino... o cuando se entregan a sus deseos.\nTal victoria asegurará que nunca te quedes sin fe, convirtiendo los horrores de la Prisión Abisal en una pesadilla lejana. Obviamente, si buscas venganza en su lugar, también podría ser un comienzo adecuado para tu inevitable ascensión como el mayor enemigo de Dios..." 
  pod1230objectives_demons.1.a: "Pecado eterno"
  eternal_avarice_modifier: "Avaricia eterna"
  eternal_envy_modifier: "Envidia eterna"
  eternal_gluttony_modifier: "Gula eterna"
  eternal_lust_modifier: "Lujuria eterna"
  eternal_pride_modifier: "Soberbia eterna"
  eternal_sloth_modifier: "Pereza eterna"
  eternal_wrath_modifier: "Ira eterna"

  pod1230objectives_demons.2.t: "Fuga de la Prisión Abisal"
  pod1230objectives_demons.2.desc: "La rebelión de Lucifer fue finalmente perdida por sus seguidores y los derrotados fueron arrojados a una prisión abisal diseñada por Dios para arrepentirse de sus crímenes por toda la eternidad. Desde entonces, sin embargo, muchos Demonios (como tú) han escapado por grietas en la prisión, o al ser convocados por infernalistas ambiciosos. Aun así, esto es un mero goteo comparado con la Hueste del Infierno que sigue encarcelada allí.\nAbrir de par en par tal fortaleza inexpugnable no es tarea fácil, pero tu reciente ascenso al poder te ha dado nuevas oportunidades. Puede que aún no seas el Todopoderoso, pero ahora eres lo suficientemente fuerte como para ser una amenaza para el Abismo.\nCada vez que abres un nuevo agujero en la prisión, más y más de tus hermanos escapan para unirse a ti en la Tierra. Muchos de ellos han perdido la naturaleza divina que una vez tuvieron como Ángeles, pero ¿qué bien podría hacer realmente mantenerlos encerrados en el Infierno a estas alturas? Algunos de ellos aún podrían encontrar la redención y, para los demás, bueno, ahora te ven como el nuevo Lucifer que los guiará hacia una retribución de proporciones bíblicas que lleva miles de años gestándose..."
  pod1230objectives_demons.2.a: "Se está gestando una nueva Rebelión Divina."

  pod1230objectives_demons.3.t: "Apocalipsis bíblico"
  pod1230objectives_demons.3.desc: "Dios abandonó este mundo hace mucho tiempo, abatido por los fracasos de la humanidad y la rebelión de sus ángeles fieles. Tú, y los otros Caídos, fuisteis expulsados del Cielo para pudriros en el Infierno para siempre. Pero resististeis, mejor aún, triunfasteis. A pesar de todos los esfuerzos de los agentes de Dios y de las mezquinas intrigas de otras criaturas sobrenaturales, el mundo canta ahora vuestras alabanzas impías, situándote como un rival del mismísimo Todopoderoso.\nEs hora de la afrenta definitiva, el Apocalipsis predicho hace tanto tiempo. Arranca las estrellas del cielo, derriba toda la Creación y arroja las cenizas a la cara de Dios. Entonces, y solo entonces, tendrás poder suficiente para liderar a tu Hueste infernal para la batalla divina final."
  pod1230objectives_demons.3.a: "El Fin ha llegado."
  pod1230objectives_demons.3.b: "Aún puedo divertirme aquí abajo..."
  the_end_of_the_world_tooltip: "Con el fin de la Creación y tú llevando la lucha al Gran Traidor, tu partida habrá terminado."
  final_war_modifier: "Guerra final"
  final_war_modifier_desc: "La Creación tiembla ante su propio destructor\nSe elimina el límite para el [casus_belli|E] de [holy_war|E] de [kingdom|E]."

  pod1230objectives_demons.4.t: "Hijos de los Caídos"
  pod1230objectives_demons.4.desc: "Durante los tiempos más violentos de la Guerra del Cielo, Abadón y Asmodeo (dos de los lugartenientes de Lucifer) realizaron experimentaciones aborrecibles que resultaron en el nacimiento de los Nephilim: la descendencia de un demonio con un anfitrión humano y una mujer mortal. Aunque algunos de ellos eran benevolentes, la mayoría fueron retorcidos y corrompidos por sus \"padres\" inmortales que querían usar su potencial ilimitado en su propia rebelión contra Lucifer.\nAquellos primeros Nephilim cometieron crímenes atroces contra la humanidad, hasta que Lucifer y los que aún le eran leales lograron detenerlos.\nComo finalmente has logrado descubrir los secretos de su creación, eres capaz de engendrar una nueva estirpe de Nephilim. ¿Serán usados para el bien o para el mal? La elección será tuya."
  pod1230objectives_demons.4.a: "La prole de los Dioses camina sobre la Tierra una vez más."

  pod1230objectives_demons.5.t: "Perdón divino"
  pod1230objectives_demons.5.desc: "Tus recuerdos han vuelto finalmente y lo recuerdas todo. La Creación, la luz de Dios sobre el mundo, los primeros pasos vacilantes de la humanidad, las súplicas de Lucifer para proteger a los mortales a pesar de los planes de Dios... todo ha vuelto a ti. Y con ello, un profundo sentimiento de pérdida. Pérdida de tu propósito original, de la mirada amorosa de Dios sobre ti, del potencial indómito que una vez fomentaste en los mortales.\nDesde entonces, hiciste cosas horribles y fuiste castigado por ello. Luego escapaste de la Prisión Abisal, tal vez como una de las pruebas de Dios para ti. Claramente, no has sido mucho mejor desde que regresaste a la Tierra pero, al final, no importa. Ahora ves la verdad. No importa cuán malvado sea un ser, no importa cuán atroces sean los crímenes que cometa, siempre hay una oportunidad para el perdón.\nSolo tienes que dar el primer paso hacia él, y el último paso de tu viaje."
  pod1230objectives_demons.5.a: "Una luz cegadora..."
  demonic_redemption_tooltip: "Y así tu historia termina como empezó, ascendiendo a la puerta del Cielo."
  pod1230objectives_demons.5.b: "Aún no es el momento."

  pod1230objectives_demons.6.t: "Babilonia"
  pod1230objectives_demons.6.desc: "En reinos antiguos como Babilonia y Sumeria, el círculo de adoradores de cada demonio creció hasta convertirse en un culto, luego en una religión de pleno derecho, con templos e ídolos tallados a semejanza del espíritu apareciendo en ciudades, aldeas y hogares por toda la tierra.\nA medida que el goteo de fe se convertía en un flujo constante, y luego en un río caudaloso, los Atados a la Tierra usaron su saber para saciar su rabia y castigar a los incrédulos con maldiciones, peste y hambruna.\nEn ningún otro momento desde la Creación los Ángeles Caídos gobernaron tan abiertamente sobre la débil humanidad. La caída de estas civilizaciones y el ascenso del monoteísmo debilitaron considerablemente a los demonios, obligando a muchos a entrar en letargo o a ser desterrados de nuevo al Abismo.\nReclamar el manto de estos tiempos poco gloriosos envía un mensaje muy fuerte a tus hermanos y hermanas en el pecado."
  pod1230objectives_demons.6.a: "Simplemente glorioso"

  pod1230objectives_demons.7.t: "Dragón del Pecado Primordial"
  pod1230objectives_demons.7.desc: "Algunos mortales, creyendo que podían alcanzar la pureza espiritual y moral expulsando de sí mismos el pecado, pasaron años buscando formas de vivir mejor a los ojos de Dios. Cuando los años demostraron que la naturaleza humana hacía casi imposible evitar los siete pecados capitales, el curso de su camino cambió.\nMiembros de más de una secta terminaron sus vidas en sacrificio, seguros de que los pecados de la carne podrían ser absueltos una vez que el cuerpo fuera dejado atrás. Otros cayeron en caminos más oscuros, creyendo que no era su propio fracaso, sino el de la humanidad. Destruyeron aldeas enteras en nombre de la erradicación del pecado, sin ver ni una sola vez la ironía de sus propios actos.\nFinalmente, el movimiento disminuyó y se convirtió en un recuerdo lejano para todos excepto para los habitantes de las aldeas situadas en los bordes de la Selva Negra. El sacerdote de la aldea, un herético fronterizo, tuvo una visión de un gran rito mágico capaz de arrancar los pecados mismos de la carne humana y desterrarlos del mundo.\nDurante cuarenta días y cuarenta noches, de acuerdo con el castigo de Dios por los pecados, el rebaño ayunó. En el cuadragésimo primer día, entre la oración y el canto del servicio, un ángel entró por las puertas de la iglesia. \"Habéis hecho bien\", dijo. \"Vuestros pecados son absueltos y no serán nunca más\". Una luz azul-blanca llenó la iglesia, ahogando incluso al sol. Cuando la luz se desvaneció, siete bestias feroces estaban ante la congregación aullando por sangre. La encontraron.\nUna vez que el último de la congregación cayó ante las bestias, reinó el silencio. Cada criatura miró a las demás con un conocimiento innato de su lugar en el mundo. Un faro primordial de uno de los pecados capitales."
  pod1230objectives_demons.7.a: "Mi propio pecado primordial."

  pod1230objectives_demons.8.t: "Árbol Demoníaco del Conocimiento"
  pod1230objectives_demons.8.desc: "Tras muchos eones atrapado en el Abismo pensando en tu destino, y viendo ahora en qué se ha convertido el mundo después de que tú y tus compañeros caídos escaparais, te quedaste con tantas preguntas e incertidumbres. ¿Cuál era el plan de Dios? ¿Cuál era tu parte en él? ¿Por qué tuviste que sufrir durante tanto tiempo en esta prisión infernal?\nQuerías saber las respuestas a muchas de estas preguntas... y ahora lo sabes todo. Conoces los verdaderos objetivos de tu Creador, cada misterio del mundo, cada consulta realizada por una mente sintiente, ya sea verdaderamente mundana o insondable para los mortales.\nCONOCES las motivaciones detrás de las acciones de Dios, y crees que deberías ser capaz de visitarlo para una charla (o una discusión) que sacudirá el núcleo mismo de la Creación."
  pod1230objectives_demons.8.a: "Sé lo que te motiva, \"Padre\". Y hablaremos de ello."
  pod1230objectives_demons.8.b: "La reunión familiar puede esperar."
  #demonic_knowledge_character_interaction: "En cualquier momento puedes cambiar de opinión, desbloquea una [character_interaction|E] sobre ti mismo"
  godly_knowledge_modifier: "Conocimiento divino"
  godly_knowledge_modifier_desc: "El conocimiento de este personaje rivaliza con el del mismísimo Dios."
  death_godly_talk: "Abandonó este plano de existencia"

  pod1230objectives_demons.9.t: "Un nuevo Génesis"
  pod1230objectives_demons.9.desc: "Dios ha abandonado este mundo hace mucho tiempo, lo sabes con certeza tras ver el estado de este lugar miserable. Con ese conocimiento reúnes la adoración de tantos mortales como sea posible porque sabes que Dios creó a la humanidad con una chispa de Su divinidad en ellos y tienes planes de usar esto para tu propia ascensión. La humanidad claramente desperdició su potencial a pesar de la rebelión de Lucifer y, en cierto modo, estás rescatando la poca utilidad que aún pueden tener para un propósito mayor.\nTal vez incluso dejes que lo disfruten al final.\nAhora, con la fe de tantas almas a tu disposición, tu empuje final hacia la divinidad está al final. No desafiarás a Dios mismo, al menos no todavía, pero a todos los efectos, te convertirás en Su igual.\nTal vez, con el tiempo, en Su superior."
  pod1230objectives_demons.9.a: "Mi Cielo, tu Infierno."
  world_in_your_hand_ending_tooltip: "#n El mundo se ha doblegado a tu voluntad.#! Tu partida terminará mientras el mundo que una vez conociste cambiará. ¿Serás una deidad benevolente? ¿Una iracunda? Esta es una historia para otro momento, y demasiado grandiosa para Crusader Kings 3."