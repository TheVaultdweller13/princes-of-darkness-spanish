l_spanish:
 POD_cappadocian_power.2000.title: "Chiquillos estudiosos"
 POD_cappadocian_power.2000.desc: "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo ha tenido un gran éxito! Ha corregido errores de juicio, suavizado agravios y tendido nuevos puentes.\n[recipient.GetName] está muy complacido con el regalo que le hiciste. Te ha notificado que tu chiquillo permanecerá a su lado por el momento, y que te debe un favor por los servicios prestados."
 
 POD_cappadocian_power.3000.title: "Chiquillos estudiosos"
 POD_cappadocian_power.3000.desc: "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo ha tenido un gran éxito! Ha aumentado los ingresos, eliminado gastos innecesarios y mejorado los vínculos con la población.\n[recipient.GetName] está muy complacido con el regalo que le hiciste. Te ha notificado que tu chiquillo permanecerá a su lado por el momento, y que te debe un favor por los servicios prestados."
 
 POD_cappadocian_power.4000.title: "Chiquillos estudiosos"
 POD_cappadocian_power.4000.desc: "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo ha tenido un gran éxito! Ha entrenado tropas, construido líneas de suministro y elaborado nuevas estrategias.\n[recipient.GetName] está muy complacido con el regalo que le hiciste. Te ha notificado que tu chiquillo permanecerá a su lado por el momento, y que te debe un favor por los servicios prestados."
 
 POD_cappadocian_power.5000.title: "Chiquillos estudiosos"
 POD_cappadocian_power.5000.desc: "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo ha tenido un gran éxito! Ha establecido conexiones, eliminado posibles filtraciones y entrenado a operativos clandestinos.\n[recipient.GetName] está muy complacido con el regalo que le hiciste. Te ha notificado que tu chiquillo permanecerá a su lado por el momento, y que te debe un favor por los servicios prestados."
 
 POD_cappadocian_power.6000.title: "Chiquillos estudiosos"
 POD_cappadocian_power.6000.desc: "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo ha tenido un gran éxito! Ha leído las escrituras, actuado con virtud y mejorado los vínculos con la población.\n[recipient.GetName] está muy complacido con el regalo que le hiciste. Te ha notificado que tu chiquillo permanecerá a su lado por el momento, y que te debe un favor por los servicios prestados."
 
 POD_cappadocian_power.7000.title: "Chiquillos desastrosos"
 POD_cappadocian_power.7000.desc: "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo ha fracasado estrepitosamente! Ha causado un daño y un caos incalculables en el campo elegido.\n[recipient.GetName] está furioso por el \"regalo\" que le hiciste. Te ha notificado que tu chiquillo regresará a tu corte lo antes posible, y que está muy decepcionado por cómo elegiste abusar de su confianza. Esperará que le compenses, tarde o temprano."
 
 POD_cappadocian_power.8000.title: "Chiquillos desastrosos"
 POD_cappadocian_power.8000.desc: "Llegan noticias de la corte de [recipient.GetName]: ¡tu chiquillo ha fracasado estrepitosamente! Ha causado un daño y un caos incalculables en el campo elegido.\n[recipient.GetName] está furioso por el \"regalo\" que le hiciste. Te ha notificado que tu chiquillo se quedará a su lado, pero ya no como invitado, y que está muy decepcionado por cómo elegiste abusar de su confianza. Esperará que le compenses, tarde o temprano."
 
 POD_cappadocian_power.optiongood: "Excelente."
 POD_cappadocian_power.optionbad: "¿Había cometido un error?....."
 
 POD_cappadocian_power.toast: "El chiquillo ya no es consejero de [recipient.GetName]"