l_spanish:

 POD_rift.100.t: "Retiro de Pesadilla"
 POD_rift.100.desc: "Las presiones sobre un inmortal son sin duda significativas; resulta bastante estresante el constante conspirar y las traiciones tanto de amigos como de enemigos.\n\nHoy, el incesante parloteo de tus subordinados finalmente ha ido demasiado lejos, por lo que te encuentras retirándote a tu grieta con más frecuencia.\n\nTu grieta está lejos de ser agradable, pero es considerablemente más segura; tu capacidad para distinguir la realidad de la pesadilla es considerablemente mejor que cuando usaste [GetTrait('rift').GetName(GetPlayer)] por primera vez."
 POD_rift.100.a: "Yo, conmigo mismo y mis pesadillas"
