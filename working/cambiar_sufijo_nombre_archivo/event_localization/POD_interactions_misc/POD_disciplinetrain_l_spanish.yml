  POD_disciplinetrain.130.t: "Entrenamiento en Hekau"
  POD_disciplinetrain.130.desc: "Las momias deben aceptar la eternidad e internalizarla. En lugar de tomar la inmortalidad como una maldición, la momia debe aprender a verla como una oportunidad para cosechar sabiduría. En lugar de verse abrumada por la experiencia o encontrarse desprevenida ante las vicisitudes del mundo, la momia tiene la oportunidad de enseñar, de sobrevivir y de tener todos los beneficios de la edad sin los inconvenientes. Enseñarás a [disciplinetrainee.GetFirstName] el Hekau de..."
  POD_disciplinetrain.130.option.a: "Alquimia"
  POD_disciplinetrain.130.option.b: "Amuletos"
