  POD_disciplinetrain.140.t: "Entrega de Dones"
  POD_disciplinetrain.140.desc: "A veces los Garou pueden enseñar dones a otros Garou, pero este proceso generalmente lleva varias semanas (o meses) y está plagado de peligros mientras el estudiante practica con su nuevo poder. Algunos parientes pueden aprender dones, pero se trata de individuos excepcionalmente raros. La mayoría de los parientes no conocen ningún don. Incluso el pariente más adepto probablemente solo conozca uno o dos. Enseñarás a [disciplinetrainee.GetFirstName] el Don de..."
  POD_disciplinetrain.140.option.a: "Dones comunes"
  POD_disciplinetrain.140.option.b: "Dones de raza"
