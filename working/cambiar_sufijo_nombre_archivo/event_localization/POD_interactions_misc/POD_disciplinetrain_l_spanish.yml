l_spanish:
 
  POD_disciplinetrain.100.t: "Entrenamiento en $pod_discipline$"
  POD_disciplinetrain.100.desc: "Si tu subordinado tiene sangre vampírica en sus venas pero no conoce una $pod_discipline$ que tú conozcas, puedes entrenarlo en esa $pod_discipline$. No es un proceso gratuito; tendrás que compartir sangre con [disciplinetrainee.GetHerHim]. Más importante aún, necesitarás compartir tu experiencia y la resonancia de sangre acumulada. Algunas [Glossary('Disciplines','game_concept_discipline_desc')] son más difíciles de enseñar que otras y, como tales, agotarán tu fuerza de voluntad causando estrés. Enseñarás a [disciplinetrainee.GetFirstName] a..."
  POD_disciplinetrain.100.desc_mass: "Si tus subordinados tienen sangre vampírica en sus venas pero no conocen una $pod_discipline$ que tú conozcas, puedes entrenarlos en esa $pod_discipline$. No es un proceso gratuito; tendrás que compartir sangre con ellos. Más importante aún, necesitarás compartir tu experiencia y la resonancia de sangre acumulada. Algunas [Glossary('Disciplines','game_concept_discipline_desc')] son más difíciles de enseñar que otras y, como tales, agotarán tu fuerza de voluntad causando estrés. Les enseñarás a..."
