  POD_disciplinetrain.150.t: "Entrenamiento en Cantrips"
  POD_disciplinetrain.150.desc: "Aprender una habilidad, conocimiento, arte o reino completamente nuevo requiere algo de tutoría y estudio. Este estudio puede ser sencillo (unos pocos días de entrenamiento con un amigo para aprender los conceptos básicos de combate cuerpo a cuerpo) o brutalmente difícil (una búsqueda en el [UmbraGlossary('near_dreaming')] para descubrir los principios detrás del arte de la Oneiromancia), pero siempre debe llevarse a cabo. Tener un mentor ayuda, pero incluso un mentor solo puede enseñar lo que ella misma sabe. Enseñarás a [disciplinetrainee.GetFirstName] el Reino o Arte de..."
  POD_disciplinetrain.150.desc_mass: "Aprender una habilidad, conocimiento, arte o reino completamente nuevo requiere algo de tutoría y estudio. Este estudio puede ser sencillo (unos pocos días de entrenamiento con un amigo para aprender los conceptos básicos de combate cuerpo a cuerpo) o brutalmente difícil (una búsqueda en el [UmbraGlossary('near_dreaming')] para descubrir los principios detrás del arte de la Oneiromancia), pero siempre debe llevarse a cabo. Tener un mentor ayuda, pero incluso un mentor solo puede enseñar lo que ella misma sabe. Les enseñarás el Reino o Arte de..."
