 stress_trait_coping_decisions.1501.desc.smoke: "Me reclino en mi asiento mientras alcanzo casualmente mi pipa. Invoco una breve oración antes de inhalar el humo divino, una niebla agradable que aleja lentamente mis problemas.\n\nNo he estado tan tranquilo en #EMP semanas#!. Solo... estar aquí. Con este alijo de hachís. Eso es suficiente."
