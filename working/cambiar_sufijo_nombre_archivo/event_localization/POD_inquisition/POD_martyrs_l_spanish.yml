l_spanish:

 POD_martyrs.1.t: "Una procesión de mártires"
 POD_martyrs.1.desc: "Uno tras otro, las personas que aprecias perecen en la lucha contra el Adversario. Por muy brillantes que resplandezcan con su virtud, parece ser solo cuestión de tiempo antes de que su llama sea engullida, sofocada y extinguida por la oscuridad implacable. A veces, cuando cierras los ojos, ves los rostros de los que murieron, violenta y prematuramente, mirándote con expresiones indescifrables." 
 POD_martyrs.1.a: "Y me siento honrado de seguir sus pasos."
 POD_martyrs.1.a.tt: "Esta opción está disponible porque tengo el rasgo [GetTrait('beatific').GetName( GetPlayer )]."
 POD_martyrs.1.b: "¿Qué me está diciendo Dios?"
 POD_martyrs.1.b.tt: "Rezarás pidiendo guía."
 POD_martyrs.1.c: "¡No dejaré que esto me pase a mí!"
 POD_martyrs.1.c.tt: "Tomarás un curso intensivo de defensa personal."
 POD_martyrs.1.d: "Todo el mundo tiene que morir tarde o temprano."
 POD_martyrs.2.t: "La fe verdadera no cuestiona."
 POD_martyrs.2.desc: "Lo sabes desde hace mucho tiempo: solo hay una dirección a seguir y es hacia la luz de Dios. Es totalmente irrelevante qué tipo de sufrimiento aguarda en el camino para ti o para cualquier otro, simplemente no hay otra elección posible. No te importa si estás a punto de pisar brasas ardientes o serpientes venenosas, pues estás siguiendo al Señor."
 POD_martyrs.2.a: "Nunca hubo ninguna duda."
 POD_martyrs.3.t: "¡Toma tu cruz!"
 POD_martyrs.3.desc: "Poco después de empezar tu oración, experimentas una especie de suave empujón que lanza tu mente hacia una única conclusión cristalina: toda tu vida juraste seguir el camino de Cristo, ¿por qué habrías de desviarte de él en su tramo final? La convicción de que seguir al Señor hasta el martirio sería la expresión definitiva de tu fe te inunda como agua fresca de manantial en un bochornoso día de verano. Tu corazón se endereza y se llena de alegría."
 POD_martyrs.3.a: "¡Aleluya!"
 POD_martyrs.4.t: "Un silencio ensordecedor."
 POD_martyrs.4.desc: "Te retiras para rezar en paz y, en lugar del habitual sentimiento reconfortante de cercanía a Dios, te abruma una sensación de soledad aplastante. No hay ni el más leve susurro de consuelo en tu cabeza, ni siquiera el toque más sutil acariciando tu alma, solo silencio. Estás solo, más que nunca."
 POD_martyrs.4.a: "Dios mío, Dios mío, ¿por qué me has abandonado?"
 POD_martyrs.5.t: "Armado y listo."
 POD_martyrs.5.desc: "Ya sea que uno se enfrente a abominaciones infernales o a simples matones, nunca está de más ser hábil con un arma y, tras semanas de intensos ejercicios y combates de práctica, te sientes mucho más capaz. Si este nuevo conjunto de técnicas te permitirá salir ileso del próximo enfrentamiento con el enemigo es muy incierto, pero encuentras consuelo al tener el arma en tu mano. Sabes que no eres invencible, pero al menos no te sientes indefenso."
 POD_martyrs.5.a: "Llegaré a sus corazones con el evangelio o con esta afilada punta de acero."
 POD_martyrs.6.t: "Desesperadamente indefenso."
 POD_martyrs.6.desc: "Han pasado semanas y apenas puedes ejecutar las técnicas que te enseñaron sin lastimarte o adoptar las posturas sin caerte. Es cierto que te saltaste algunas clases, pero una persona solo puede hacer un número limitado de cosas al día. Sea cual sea la causa, los resultados del entrenamiento son dolorosamente decepcionantes; sientes que apenas puedes defenderte de un maniquí de práctica, y mucho menos de un engendro del Infierno."
 POD_martyrs.6.a: "Me siento más vulnerable que antes de empezar."
 POD_martyrs.7.t: "La vida es cruel y luego mueres."
 POD_martyrs.7.desc: "¿Qué diferencia hay si mueres desmembrado por un engendro de Satanás o por alguna peste inmunda? ¿Hay alguien que pueda decir que una cosa es mejor o peor que la otra? Uno debería atesorar cada momento en que no siente un dolor horrible, porque a partir de ahí solo empeora."
 POD_martyrs.7.a: "Es lo que hay."