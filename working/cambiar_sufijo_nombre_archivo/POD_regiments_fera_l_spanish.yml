l_spanish:
 
 
 
 
  kinfolk_militia: "Milicia de parientes"
  kinfolk_militia_flavor: "#F El humilde pariente es a menudo la columna vertebral de cualquier banda de guerra de los $glossary_fera$. Aunque a menudo están mal equipados, lo compensan con su pura determinación.#!"    
  kinfolk_leeches_hunters: "Parientes cazadores de sanguijuelas"
  kinfolk_leeches_hunters_flavor: "#F Todos los parientes conocen los peligros que representan los chupasangres. Los arcos y las ballestas son el arma preferida de aquellos encargados de cazar estas amenazas.#!"
  kinfolk_outriders: "Exploradores parientes"
  kinfolk_outriders_flavor: "#F Al vivir cerca de sus parientes cambiapieles, los parientes suelen estar más acostumbrados a los parajes salvajes que otros mortales, lo que puede aprovecharse para convertirlos en una fuerza de combate potente y rápida.#!"
 
 
  amazons: "Parientes amazonas"
  amazons_flavor: "#F Estas mujeres, liberadas del yugo patriarcal, lucharán por sus benefactoras las Furias Negras como las leyendas de antaño.#!"
  kinfolk_defenders: "Defensores"
  kinfolk_defenders_flavor: "#F La humanidad necesita ser defendida, y estos parientes fuertes y bien preparados están listos para cumplir con su parte.#!"
  woad_raider_maa: "Incursores de glasto"
  woad_raider_maa_flavor: "#F El glasto es una planta que se encuentra en las Islas Británicas de la que se puede extraer un pigmento azul. Los antiguos guerreros celtas se pintaban con este pigmento antes de la batalla para parecer más temibles y poner nerviosos a sus enemigos. Los parientes Fianna todavía honran esta tradición en la batalla.#!"
  berserkers_maa: "Berserkers"
  berserkers_maa_flavor: "#F Los parientes de la Camada de Fenris a menudo visten poca o ninguna armadura o ropa, entrando en batalla ataviados solo con pieles de oso o lobo.#!"
  ratha_maa: "Ratha"
  ratha_maa_flavor: "#F Aunque los carros declinaron en la India desde alrededor del 300 a.C., su alto significado cultural y religioso impidió su abandono a pesar de ser menos efectivos en batalla que la caballería montada y los elefantes, y se desplegaban junto a ellos. Los parientes Contemplaestrellas todavía los usan a menudo en batalla para hostigar a los enemigos de su tribu.#!"
 
 
 
 
  werewolfpack: "Manada de hombres lobo"
 
  battlescarred_fera: "Fera curtidos en batalla"
  battlescarred_fera_flavor: "#F Un grupo de veteranos $glossary_fera$ listos para defender a sus parientes.#!"
 
  skull_pigs: "Cerdos calavera"
  skull_pigs_flavor: "#F Los cerdos calavera no son más que los restos enloquecidos de la raza cambiapieles antaño llamada Grondr, los administradores de la limpieza y la eliminación de Gaia que una vez mantuvieron a toda Gaia libre de podredumbre y decadencia.#!"
 
 ###Hombres lobo
 
  cliath: "Cliath"
  cliath_flavor: "#F Los Cliath son Garou jóvenes, a menudo llamados \"Cachorros\" por sus antiguos. Estos jóvenes están ansiosos por alcanzar la Gloria y subir de Rango.#!"
 
  amazons_diana_maa: "Amazonas de Diana"
  amazons_diana_maa_flavor: "#F Las Amazonas de Diana son un grupo de Furias que están más preocupadas por ser mujeres guerreras impetuosas e imparables que por ser vengadoras sagradas. Este campamento rara vez se ve como un grupo formal, y es más un cajón de sastre para aquellas más dedicadas a demostrar con razón que son iguales a cualquier hombre en el combate contra el $glossary_wyrm$.#!"
 
  children_of_cluid_maa: "Hijos de Cluid"
  children_of_cluid_maa_desc: "#F Muchos Cluithi se ven a sí mismos como los hijos más verdaderos de Cluid, el héroe que lideró por primera vez a los pictos a Caledonia. Estos guerreros luchan con un vigor impío para promover sus objetivos.#!"
 
  swarm_maa: "El Enjambre"
  swarm_maa_flavor: "#F Este campamento de Roedores de Huesos se centra en el aspecto bélico de la rata, concentrándose en la lucha sucia y explotando cada ventaja que obtienen sobre un enemigo. Se especializan en tácticas de guerrilla, golpeando contra el $glossary_wyrm$ y desapareciendo instantáneamente.#!"
 
  imminent_strike_maa: "Golpe Inminente"
  imminent_strike_maa_flavor: "#F El Golpe Inminente es el campamento de guerra de los Hijos de Gaia, que busca unir a todos los Garou para la batalla final.#!"
 
  herne: "Hermanos de Herne"
  herne_flavor: "#F Una fuerza de ataque rápido compuesta casi en su totalidad por Ahrouns, lista para defender cualquier Túmulo Fianna en peligro en cualquier momento.#!"
 
  mjolnir: "Hijos de Mjolnir"
  mjolnir_flavor: "#F Considerados maníacos sedientos de sangre incluso por el resto de la Camada, estos guerreros salvajes son un espectáculo digno de ver.#!"
 
  predator_kings_maa: "Reyes Predadores"
  predator_kings_maa_flavor: "#F Los Reyes Predadores creen que el tiempo de los compromisos ha terminado y que los humanos tienen que ser masacrados hasta que no quede nadie. Son los más agresivos de los Caminantes de las Sombras.#!"
 
  bringers_light_maa: "Portadores de la Luz"
  bringers_light_maa_flavor: "#F Si hay un grupo de Señores de las Sombras que recibe algo cercano al respeto general, son los Portadores de la Luz. Estos Señores de las Sombras son los que manejan los poderes malignos, como los Danzantes de la Espiral Negra o los vampiros.#!"
 
  hakken_samurai_maa: "Samurái"
  hakken_samurai_maa_flavor: "#F Los Hakken han pasado sus vidas perfeccionando sus habilidades con la hoja. El honor dicta que le den un buen uso contra los sirvientes del $glossary_wyrm$.#!"
 
  daggers_nut_maa: "Dagas de Nut"
  daggers_nut_maa_flavor: "#F Las Dagas de Nut se dedican a romper el control de los descendientes de Sutekh sobre Egipto y, por extensión, el de los vampiros sobre su territorio en general.#!"
 
  royal_guard_sf_maa: "Guardia Real"
  royal_guard_sf_maa_flavor: "#F Como la realeza de la Nación Garou, los verdaderos gobernantes Colmillos Plateados siempre están escoltados por los luchadores más selectos de su casa.#!"
 
  heavenlysuccessors_maa: "Sucesores Celestiales"
  heavenlysuccessors_maa_flavor: "#F Herederos de Zhong Kuei, los Sucesores Celestiales se han juramentado para la destrucción de los vampiros y otras criaturas que drenan el alma de Gaia.#!"
 
  luperci_maa: "Luperci"
  luperci_maa_flavor: "#F Los prósperos y poderosos Guardianes de los Hombres italianos son expertos en lidiar con los numerosos vampiros que se aprovechan de su floreciente imperio mercantil. Han dado su nombre a aquellos Guardianes que se especializan en luchar contra la prole maldita de Caín.#!"
 
 
 
 
 ###Bastet
 
  tekhmet: "Tekhmet"
  tekhmet_flavor: "#F Estos \"Pequeños\" están listos para desatar su Ferocidad y subir de Rango entre sus parientes.#!"
 
  children_saraam: "Hijos de Saraam"
  children_saraam_flavor: "#F La madre de los Bagheera se enorgullece de ver a sus hijos bien disciplinados proteger su legado.#!"
 
  warriors_ubastet: "Guerreros de Ubastet"
  warriors_ubastet_flavor: "#F Los Bubasti una vez gobernaron Egipto como dioses. Aunque este tiempo ha pasado hace mucho, todavía saben luchar en su tierra natal como nadie.#!"
 
  samhach_bane: "Perdición de Samhach"
  samhach_bane_flavor: "#F Los Ceilican nunca olvidarán al que casi los mata a todos. Su necia especie pagará.#!"
 
  durga_chosen: "Elegidos de Durga"
  durga_chosen_flavor: "#F Seline, en su aspecto de Durga, sonríe a su élite elegida, los honorables guerreros más grandes del Khan.#!"
 
  seline_pride: "Orgullo de Seline"
  seline_pride_flavor: "#F Los autoproclamados elegidos de la Luna, los Simba son luchadores orgullosos y despiadados. Su historia también les ha dado el dudoso honor de saber cómo luchar contra otros cambiapieles.#!"
 
  danaa_runners: "Corredores de Danaa"
  danaa_runners_flavor: "#F Muchos descartan a los enjutos Swara, pero su asombrosa velocidad ha demostrado ser la perdición de muchos posibles depredadores.#!"
 
 
 ###Mokole
  mokole_hatchlings: "Crías"
  mokole_hatchlings_flavor: "#F Los Mokolé son una especie en extinción. Por ello, es imperativo que las futuras generaciones sean protegidas. Con este fin, los del Rango más bajo, las Crías, han aprendido a defenderse contra la mayoría de las incursiones, ya sean humanoides o animales.#!"
 
  primal_saurians: "Saurios primordiales"
  primal_saurians_flavor: "#F La Corriente de la Tierra es la más sintonizada con sus instintos primordiales. Los rugidos de los Mokolé-mbembe infunden miedo mientras buscan vengar a sus parientes perdidos.#!"
 
  bronzescales: "Escamas de bronce"
  bronzescales_flavor: "#F La arena es gruesa, áspera y se mete por todas partes. Un escondite perfecto para los Gumagan, mientras surgen de las arenas para dar muerte a aquellos lo suficientemente necios como para desafiarlos en su dominio.#!"
 
  hidden_fangs: "Colmillos ocultos"
  hidden_fangs_flavor: "#F Las selvas y los bosques albergan a muchos depredadores aterradores. Sin embargo, incluso estos depredadores son presas para los Makara que los acechan.#!"
 
  sleeping_dragons: "Dragones durmientes"
  sleeping_dragons_flavor: "#F Los mitos de los mortales han logrado acertar en una cosa. Nunca despiertes a un Dragón de su sueño, pues su ira será de lo más terrible.#!"
 
  army_aten: "Ejército del Atón"
  army_aten_flavor: "#F Esta nidada de guerra de Mokolé se prepara constantemente para librar una batalla contra el [Glossary('Disolvedor', 'glossary_wyrm_tt')] y las fuerzas de la oscuridad. También buscan y destruyen a los $glossary_fera$ caídos antes de que la Mácula del Wyrm se asiente.#!"
 
 ###Animales
  whitewolves: "Lobos blancos"
  whitewolves_flavor: "#F Se rumorea que son la forma ancestral y más pura de los Colmillos Plateados; los Lobos Blancos aparecen en momentos de necesidad para ayudar a la Tribu.#!"
 
  royal_crocodiles: "Cocodrilos reales"
  royal_crocodiles_flavor: "#F Estos cocodrilos de aspecto majestuoso han crecido mucho más fuertes y grandes que otros gracias a la protección de sus cuidadores Mokolé.#!"
 
 
 
 ###Dinosaurios del Pasado
  archators: "Archators"
  archators_flavor: "#F Estas bestias descomunales son una fusión de dinosaurios y la forma Archid. Comparten muchos rasgos que se encuentran en la forma Archid de un Mokolé pero no su temperamento, una distinción que muchos llegan a descubrir. Sirven fielmente a sus compañeros saurios, siempre que se respete su fuerza y se llenen sus estómagos.#!"
  dipeltas: "Dipeltas"
  dipeltas_flavor: "#F Dinosaurios con grandes placas óseas en su cráneo. Estas placas son más fuertes que el acero tradicional y ayudan a protegerlos mientras cargan contra sus objetivos.#!"
  avithons: "Avithons"
  avithons_flavor: "#F Terrores emplumados voladores. Estos dinosaurios surcan los cielos y se lanzan sobre su presa con gran velocidad y precisión.#!"
  dicravenators: "Dicravenators"
  dicravenators_flavor: "#F Estos pequeños dinosaurios bípedos son la pesadilla de muchos herbívoros. Su agilidad y ferocidad al perseguir a su presa no tienen rival.#!"
  rhincanthuses: "Rhincanthuses"
  rhincanthuses_flavor: "#F Más un rinoceronte reptiliano gigante que un dinosaurio, los Rhincanthuses son arietes descomunales que cargarán a través de cualquier cosa.#!"
  baroceratops: "Baroceratops"
  baroceratops_flavor: "#F El grueso cráneo y la armadura natural del Baroceratops lo protegen mientras rompe fortificaciones temerariamente.#!"
  dracomuses: "Dracomuses"
  dracomuses_flavor: "#F Grandes bestias dracónicas que se inmolan mientras tajan y queman a su presa.#!"
  archeorexes: "Archeorexes"
  archeorexes_flavor: "#F Los superdepredadores de los sueños jurásicos de los Mokolé. Manifestados con un único propósito: la destrucción.#!"
  dryptoraptors: "Dryptoraptors"
  dryptoraptors_flavor: "#F Estos pequeños dinosaurios bípedos no son más grandes que un Mokolé medio. Sus números, sin embargo, son lo que los hace mortales.#!"
