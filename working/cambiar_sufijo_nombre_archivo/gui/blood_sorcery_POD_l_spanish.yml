 POD_bloodmagic_events.3.t: "[Localize(Concatenate3('ritual_',ROOT.Var('current_journey').Var('ritual').GetFlagKey,'_name'))]" 
 POD_bloodmagic_events.3.desc: "Incluso después de siglos de experimentación, la miríada de rituales desarrollados por los $pod_cainites$ en todo el mundo se basan todos en la misma base. Ya sea que estos ritos provengan de la Taumaturgia, la Hechicería, la Nigromancia o prácticas más extrañas, todos invocan el poder de la #R sangre#!.\n\nEn las profundidades carmesí de su ser, estos Cainitas encuentran poder: poder bruto que espera ser sacado a la superficie. A través de su fuerza de voluntad, estos Cainitas arrastran este poder pataleando y gritando a la intemperie para realizar hazañas milagrosas. Se han desarrollado rituales para dirigir y enfocar esta nueva fuerza, sin restricciones por la estructura de las [Glossary('Disciplines','game_concept_discipline_desc')] conocidas.\n\nSolo una palabra puede describir este poder que ha resonado a lo largo de los tiempos:\n\nMagia."
 POD_bloodmagic_events.3.a: "Agito mi vitae y comienzo..."
