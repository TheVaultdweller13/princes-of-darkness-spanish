l_spanish:
 pod_mod_compatibility_header: "#bold;beast ADVERTENCIA: MOD INCOMPATIBLE#!"

 pod_mod_compatibility_character: "Uno de tus mods está sobrescribiendo el archivo:\n\n#bold /gui/window_character.gui#!\n\nEsto provocará muchos problemas con la ventana de personaje, incluyendo pero no limitado a: botones faltantes, información de personaje faltante o mal mostrada, o relaciones faltantes.\n\nRecomendamos encarecidamente eliminar otros mods hasta que esta advertencia ya no se muestre."
 pod_mod_compatibility_hud: "Uno de tus mods está sobrescribiendo el archivo:\n\n#bold /gui/hud.gui#!\n\nEsto provocará problemas con el HUD, como botones de la barra lateral faltantes.\n\nRecomendamos encarecidamente eliminar otros mods hasta que esta advertencia ya no se muestre."
 pod_mod_compatibility_county: "Uno de tus mods está sobrescribiendo el archivo:\n\n#bold /gui/window_county_view.gui#!\n\nEste archivo es necesario para mantener nuestros scripts de edificios.\n\nRecomendamos encarecidamente eliminar otros mods hasta que esta advertencia ya no se muestre."
 pod_mod_compatibility_interaction: "Uno de tus mods está sobrescribiendo el archivo:\n\n#bold /gui/interaction_menu_window.gui#!\n\nEste archivo asegura que haya una barra de desplazamiento si un personaje tiene acceso a un gran número de interacciones de personaje.\n\nRecomendamos encarecidamente eliminar otros mods hasta que esta advertencia ya no se muestre."
 pod_mod_compatibility_lifestyle: "Uno de tus mods está sobrescribiendo el archivo:\n\n#bold /gui/window_character_lifestyle.gui#!\n\nEste archivo asegura que haya una barra de desplazamiento para árboles de estilo de vida grandes.\n\nRecomendamos encarecidamente eliminar otros mods hasta que esta advertencia ya no se muestre."
 pod_mod_compatibility_domicile: "Uno de tus mods está sobrescribiendo el archivo:\n\n#bold /gui/window_domicile.gui#!\n\nEste archivo es necesario para mantener los edificios de Refugio al cambiar de gobierno o pasar de sin tierras <-> con tierras.\n\nRecomendamos encarecidamente eliminar otros mods hasta que esta advertencia ya no se muestre."
 
