  #Scholar-Group Faiths
  viaossium: "Via Ossium"
  viaossium_adj: "Ossium"
  viaossium_adherent: "Erudito"
  viaossium_adherent_plural: "Eruditos"
  viaossium_desc: "Los seguidores de la Vía de los Huesos valoran el conocimiento por encima de todo. A través del estudio intenso de lo desconocido, los Eruditos mantienen a raya a sus Bestias. Harán casi cualquier cosa para aprender algo nuevo, pero no se sacrificarán innecesariamente por una causa. Después de todo, su propio conocimiento acumulado es demasiado importante para dejarlo en manos de otros. Al mismo tiempo, los Eruditos no temen a la muerte; están fascinados por ella."
  
  followersoflazarus: "Seguidores de Lázaro"
  followersoflazarus_adj: "Lazareno"
  followersoflazarus_adherent: "Infitiore"
  followersoflazarus_adherent_plural: "Infitiores"
  followersoflazarus_desc: "Los Seguidores de Lázaro, también llamados Infitiores, fueron los Capadocios que por una razón u otra no respondieron a la llamada que condujo al Festín de la Locura y así evitaron la purga del $pod_clan$. Inseguros de si habrían sido perdonados y sintiéndose traicionados por su fundador, se divorciaron efectivamente del cuerpo principal del $pod_clan$ Capadocio. Lázaro era considerado informalmente el líder de los Infitiores."
  
  pathofthewheel: "Senda de la Rueda"
  pathofthewheel_adj: "Rueda"
  pathofthewheel_adherent: "Científico"
  pathofthewheel_adherent_plural: "Científicos"
  pathofthewheel_desc: "Los miembros de esta senda creen que los vampiros están atrapados fuera del ciclo y deben seguir adelante. Buscan cualquier medio científico para empujar a todos los $pod_cainites$ de vuelta al ciclo de la vida."
  
  roadoftheabyss: "Vía del Abismo"
  roadoftheabyss_adj: "Abisal"
  roadoftheabyss_adherent: "Místico"
  roadoftheabyss_adherent_plural: "Místicos"
  roadoftheabyss_desc: "Los Místicos están inmersos en el estudio eterno de una fuerza que trasciende y, en última instancia, se opone a toda luz y vida. La humanidad y conceptos como el bien o el mal tienen poca utilidad para quienes estudian los misterios de la oscuridad exterior."
 
  holy_order_harbringers_cappa: "Los Heraldos"
  holy_order_erciyes: "Guardianes de Erciyes"
 
  viaprimordia: "Via Primordia"
  viaprimordia_adj: "Primordia"
  viaprimordia_adherent: "Primordial"
  viaprimordia_adherent_plural: "Primordiales"
  viaprimordia_desc: "Los Primordiales creen en los 'Tres', poderosos espíritus de la Creación, la Destrucción y la Preservación. Esperan un gran acontecimiento en el que los tres espíritus se fusionarán en un solo Avatar. Curiosamente, parece estar bastante cerca de la creencia de algunos Lupinos."
