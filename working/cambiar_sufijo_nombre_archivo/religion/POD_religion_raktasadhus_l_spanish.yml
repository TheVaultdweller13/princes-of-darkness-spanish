  #Rakta-sadhu-Group Faiths
  raktasadhus: "Rakta-sadhus"
  raktasadhus_adj: "Rakta-sadhus"
  raktasadhus_adherent: "Raktasadhu"
  raktasadhus_adherent_plural: "Rakta-sadhus"
  raktasadhus_desc: "Los vampiros de la India practican una forma de hechicería de sangre llamada Sadhana. A pesar de que hay $pod_cainites$ indios que no practican Sadhana, el término plural rakta-sadhus todavía se utiliza a veces para referirse colectivamente a todos los $pod_cainites$ indios, en gran parte porque hasta ahora han descuidado formalizar su red de lealtades efímeras en una secta o Corte real. Esas lealtades podrían no haber llegado a existir en absoluto si no fuera por la oposición de los vampiros catayanos de la Corte de los Truenos Infinitos del sur de la India y la Corte del Fénix Escarlata del este de la India."
  
  mayaparisatya: "Mayaparisatya"
  mayaparisatya_adj: "Mayaparisatya"
  mayaparisatya_adherent: "Asura"
  mayaparisatya_adherent_plural: "Asura"
  mayaparisatya_desc: "La Senda de la Paradoja tiene una gran deuda con ciertos principios del hinduismo. Según ella, los Vástagos están encerrados perpetuamente fuera del ciclo ilusorio del universo (maya). Mientras que la mayoría de los seres se reencarnan a través del Saṃsāra, un enredo continuo en el ciclo de renacimiento, los Vástagos han eludido ese ciclo. Cada individuo tiene su propio propósito, o Svadharma, aunque los vampiros, excluidos del ciclo, han perdido el suyo."
 
  viaparadox: "Senda de la Paradoja"
  viaparadox_adj: "Paradoja"
  viaparadox_adherent: "Engañador"
  viaparadox_adherent_plural: "Engañadores"
  viaparadox_desc: "Los Engañadores creen en un propósito superior para todos, incluidos ellos mismos, otros vampiros y mortales. Su tarea en la vida es guiar a todos hacia su destino superior. Si es necesario, esto incluye la muerte, especialmente para los Vástagos que consideran descarriados y que han caído de su verdadero destino.\nDurante los siglos de división de sus hermanos orientales, la senda cambió drásticamente y ahora se ve a menudo como una mera excusa para el robo, la diablerie y otros crímenes contra la sociedad."
 
  pathofdevaraja: "Senda de Devaraja"
  pathofdevaraja_adj: "Devaraja"
  pathofdevaraja_adherent: "Divino"
  pathofdevaraja_adherent_plural: "Divinos"
  pathofdevaraja_desc: "Los seguidores de esta senda no creen en algún derecho divino a gobernar. En cambio, creen que deben ganarse el derecho a gobernar y elevarse a la divinidad a los ojos de su pueblo. Los Divinos no crean súbditos e inferiores, sino seguidores y adoradores."
 
  pathofdaitya: "Senda de Daitya"
  pathofdaitya_adj: "Daitya"
  pathofdaitya_adherent: "Encantador de serpientes"
  pathofdaitya_adherent_plural: "Encantadores de serpientes"
  pathofdaitya_desc: "Los Daitya veneran a Shiva y reclaman el liderazgo de todos los vampiros que adoran a Shiva. Los Daitya ven su deber de casta como una extraña inversión del brahmanismo mortal. Como demonios, deben luchar contra los dioses y esforzarse por derrocar el orden moral del mundo. Como brahmanes, sin embargo, deben esforzarse por mantener a sus compañeros vampiros dentro de sus propios deberes de casta particulares como asesinos, embaucadores, profanadores de ritos sagrados y todos los demás roles aborrecibles asignados a los demonios."
 
  samsara: "Samsara"
  samsara_adj: "Samsara"
  samsara_adherent: "Rakshasa"
  samsara_adherent_plural: "Rakshasa"
  samsara_desc: "La Senda de la Paradoja moderna, también llamada Saṃsāra, es una creación de los neonatos Ravnos. No es tan rígida como la Mayaparisatya, pero tampoco permite la crueldad gratuita y el hedonismo de la Senda Occidental. Su ética es la misma que la de la Mayaparisatya, pero la Jerarquía de Pecados ha sido modificada para permitir la interacción con vampiros que no siguen la senda."
