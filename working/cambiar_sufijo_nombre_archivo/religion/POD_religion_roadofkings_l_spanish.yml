  #Scion-Group Faiths
  viaregalis: "Via Regalis"
  viaregalis_adj: "Regalis"
  viaregalis_adherent: "Luminaria"
  viaregalis_adherent_plural: "Luminarias"
  viaregalis_desc: "Los seguidores de la Via Regalis controlan a su Bestia gobernando sobre los demás. Los mortales son inferiores, las promesas se cumplirán, el poder lo es todo."
 
  viaequitum: "Via Equitum"
  viaequitum_adj: "Equitum"
  viaequitum_adherent: "Paladín"
  viaequitum_adherent_plural: "Paladines"
  viaequitum_desc: "Quienes siguen la Senda de la Caballería creen que, como seres superiores, están obligados a defender a los inferiores a ellos, tanto cainitas como humanos. Estos Vástagos creen firmemente en los conceptos de deber y honor."
 
  viamercator: "Via Mercator"
  viamercator_adj: "Mercator"
  viamercator_adherent: "Mercader"
  viamercator_adherent_plural: "Mercaderes"
  viamercator_desc: "Para estos Vástagos que siguen la Senda del Mercader, el poder y el dinero van de la mano; por lo tanto, pasan gran parte de su tiempo adquiriendo riqueza y usándola para influir sutilmente en las cosas entre bastidores. Sin embargo, también atesoran sus propias reputaciones y harán todo lo posible para asegurarse de que sean positivas."
 
  viatyrannus: "Via Tyrannus"
  viatyrannus_adj: "Tyrannus"
  viatyrannus_adherent: "Tirano"
  viatyrannus_adherent_plural: "Tiranos"
  viatyrannus_desc: "Aunque muchos tienen reputación de feroces, controladores y hambrientos de poder, los Vástagos de la Senda del Tirano también se encuentran entre los más obligados por el honor de la Via Regalis. Si uno de ellos tiene una obligación contigo, la cumplirá, sin importar el coste. Sin embargo, son los más propensos a gobernar a través del miedo en lugar de la atracción."
 
  viaconsuasor: "Via Consuasor"
  viaconsuasor_adj: "Consuasor"
  viaconsuasor_adherent: "Visir"
  viaconsuasor_adherent_plural: "Visires"
  viaconsuasor_desc: "Los Vástagos de esta Senda del Visir se contentan con asesorar en lugar de gobernar directamente, pero eso no los hace menos expertos en ejercer el poder que los demás en la Vía de los Reyes. De hecho, estos Vástagos se encuentran entre los mejores en manipulaciones sutiles y en notar detalles que podrían amenazar la influencia de quienes están al mando."
  
  viamithras: "Via Mithras"
  viamithras_adj: "Mitraísmo"
  viamithras_adherent: "Mitraísta"
  viamithras_adherent_plural: "Mitraístas"
  viamithras_desc: "Los mitraístas se sitúan en la línea entre la Via Regalis y un culto real. Aunque el poder y el honor siguen siendo muy valorados, la devoción a un dios real, Mitras, es primordial. Siguen siendo fieles a una organización que se remonta a los días de gloria del culto, en la Antigua Roma."
 
  viaentelechia: "Via Entelechia"
  viaentelechia_adj: "Entelechia"
  viaentelechia_adherent: "Dedicado"
  viaentelechia_adherent_plural: "Dedicados"
  viaentelechia_desc: "Los Dedicados se definen por las tres bases de la Entelequia: Andreia, hombría; enkratia, fuerza interior; y sophrosyne, control interior. Las restricciones humanas como la misericordia o la simpatía (o la consideración) están por debajo de ellos. Cuando un Dedicado se encuentra con un grupo de sus compañeros de clan, asume el liderazgo sobre ellos, señalando la obvia inferioridad de sus opuestos y no rehuyendo matar a los vampiros que desobedezcan sus órdenes."		
  
  codexoflegacies: "Códice de Legados"
  codexoflegacies_adj: "Códice de Legados"
  codexoflegacies_adherent: "Soñador"
  codexoflegacies_adherent_plural: "Soñadores"
  codexoflegacies_desc: "Los $pod_cainites$ de Constantinopla no se adherían a las seis Tradiciones de Caín. En su lugar, el Brujah Tribonio creó el Códice de Legados, una colección de preceptos que pretendía cimentar el gobierno de la Trinidad y los tres clanes gobernantes: los Toreador, Tzimisce y Ventrue. Un consejo de tres Quaesitors —uno de cada uno de esos tres clanes— supervisaba el códice y juzgaba a quienes rompían sus principios."
  
