  holy_order_condottieri: "Los Condottieri"
  holy_order_scions_of_tyranny: "Vástagos de la Tiranía"
  holy_order_viziers_contigency: "Contingencia de los Visires"
  holy_order_scions_of_mithras: "Vástagos de Mitras"
  holy_order_lions_of_mithras: "Leones de Mitras"
  holy_order_miles_of_mithras: "Miles de Mitras"
  holy_order_spears_of_artemis_orthia: "Lanzas de Artemis Orthia"
 
  cleopatrans: "Cleopatranos de Yima"
  cleopatrans_adj: "Cleopatrano"
  cleopatrans_adherent: "Cleopatrano"
  cleopatrans_adherent_plural: "Cleopatranos"
  cleopatrans_desc: "Este culto es una fusión entre el relato de Yima, este mítico Nosferatu aparentemente no afectado por la maldición de su $pod_clan$, y Cleopatra, la hermosa faraona egipcia. Esta fascinación hizo poderoso al $pod_clan$, y muchos Príncipes fueron cleopatranos hasta la caída del Imperio Romano. El culto está prácticamente muerto desde entonces."
  
  path_of_carnal_desire: "Senda del Deseo Carnal"
  path_of_carnal_desire_adj: "Deseo"
  path_of_carnal_desire_adherent: "Deseado"
  path_of_carnal_desire_adherent_plural: "Deseados"
  path_of_carnal_desire_desc: "Esta religión no canónica ha sido encargada por un mecenas.\n\nTambién conocida como Via Carnalium Desideriorum, esta senda no trata de ceder al placer, sino del uso de la lujuria como herramienta de control. Aunque es tan erótica como la Via Voluptarius, trata menos del instinto y más de la dominación a través del deseo sexual. Son las sirenas cantando en las rocas, no los marineros condenados que las buscan. A diferencia de los seguidores de la Vía del Pecado, los Deseados se ajustan a las normas de la Vía de los Reyes y sus tradiciones, por lo que encuentran refugio en las cortes de los Clanes Altos.\n\nSe sabe que los Deseados tienen una rivalidad religiosa con los Voluptuarios que se desarrolla en dormitorios y burdeles por toda Italia." 
  holy_order_order_of_whores: "Orden de Babilonia"
  holy_order_order_of_dominatrices: "Orden del Deseo"
  holy_order_studs_of_desire: "Señuelo del Deseo"
  
  viaofficii: "Via Officii"
  viaofficii_adj: "Deber"
  viaofficii_adherent: "Juramentado"
  viaofficii_adherent_plural: "Juramentados"
  viaofficii_desc: "Esta religión no canónica ha sido encargada por un mecenas.\n\nTambién conocida como la Vía del Deber, esta senda fue desarrollada por Senen el Juramentado —el Vigilante Blanco— para imponer estrictamente el Silencio de la Sangre. Toman medidas extremas para mantener la integridad de la Mascarada."
  tenet_carnal_desire_name: "Deseo carnal"
  tenet_carnal_desire_desc: "Un principio no canónico solicitado por un mecenas."
   
  shatteredspear: "Lanza Quebrada"
  shatteredspear_adj: "Quebrada"
  shatteredspear_adherent: "Espartano"
  shatteredspear_adherent_plural: "Espartanos"
  shatteredspear_desc: "Aquellos que portan el legado de Artemis Orthia, primera y más amada de los chiquillos de Ventrue y Diosa de la antigua Esparta, que lideró la vanguardia contra los Brujah de Cartago y cayó luchando contra la oscuridad que se apoderó de esa ciudad con su vil agarre.\nLa Lanza opera en secreto, cada guerrero manteniéndose firme contra la marea de la Gehenna y las fuerzas diabólicas que acechan fuera de la sociedad cainita civilizada."
  
  pathofleviathan: "Senda del Leviatán"
  pathofleviathan_adj: "Leviatán"
  pathofleviathan_adherent: "Leviatán"
  pathofleviathan_adherent_plural: "Leviatanes"
  pathofleviathan_desc: "Esta religión no canónica ha sido encargada por un mecenas.\n\nOriginaria del antiguo uniformismo chino, se dedica a construir un colectivo similar al Leviatán, creando un concepto colectivo del cuerpo erudito a través de un adoctrinamiento flexible y leyes duras, y finalmente creando una voluntad colectiva unificada para evolucionar espiritualmente como un organismo unicelular en un organismo multicelular."
  
