 #Spectre-Group Faiths
 malfean: "Malféico"
 malfean_adj: "Malféico"
 malfean_desc: "Los Malfeanos son grandes fuerzas de oscuridad y destrucción, que traen sufrimiento, maldad y terror dondequiera que llegue su influencia. En su mayor parte, sin embargo, son una fuerza invisible y que solo se siente a través de sus esbirros y sirvientes. La humanidad debería estar agradecida."
 malfean_adherent: "Espectro"
 malfean_adherent_plural: "Espectros"
 
 grand_maw: "Gran Fauce"
 grand_maw_adj: "Abuela"
 grand_maw_desc: "Abuela es el nombre de... algo. Algunos creen que \"ella\" es la gemela malvada de Dios, otros piensan que \"ella\" es el remanente de un universo muerto, y otros señalan a \"ella\" como el propio [UmbraGlossary('oblivion')]. Qué es \"ella\" exactamente nunca se sabe, pero lo que sí se sabe es que es antigua y quiere consumir cada alma viviente en la tierra. Su nombre común deriva del apodo \"la Gran Fauce\" (the Grand Maw), que suena parecido al término \"Abuela\" (Grandma). De ahí que se la conociera como Abuela."
 grand_maw_adherent: "Espectro"
 grand_maw_adherent_plural: "Espectros"
