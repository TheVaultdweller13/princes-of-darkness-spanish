l_spanish: 
 
 #Main religion
 ashirra_religion: "@vampire_icon! Ashirra"
 ashirra_religion_adj: "Ashirra"
 ashirra_religion_adherent: "Ashirra"
 ashirra_religion_adherent_plural: "Ashirra"
 ashirra_religion_desc: "La [Glossary('Ashirra','game_concept_ashirra_desc')] (de ashira, árabe para 'clan') es la secta bajo la cual los vampiros islámicos declaran su fe en Alá, y que gobierna sobre Arabia y el norte de África, comenzando en la Edad Oscura. Los miembros de la [Glossary('Ashirra','game_concept_ashirra_desc')] creen que la redención para los Vástagos estaba entre las promesas que Mahoma hizo si elegían seguir a Alá."

 ashirra_religious_head_title: "Mullah"
 ashirra_religious_head_title_name: "Sultanato"


 #Holy Orders
 holy_order_the_mahgrib: "El Magreb"
 holy_order_the_shuhada: "Los Shuhada"
 holy_order_defenders_ashirra: "Defensores de la Ashirra"
 holy_order_companions_of_the_prophet: "Compañeros del Profeta"


 #Ashirra-Group Faiths
 tariqelsama: "Tariq el-Sama"
 tariqelsama_adj: "Sama"
 tariqelsama_adherent: "el-Sama"
 tariqelsama_adherent_plural: "el-Sama"
 tariqelsama_desc: "Un seguidor del Tariq el-Sama se aferra a las revelaciones del Profeta y contrarresta la furia de la Bestia con oraciones nocturnas y una fe inquebrantable. No se resiste a la Bestia cuando se agita, sino que le permite una liberación moderada, refrenándola cuando los impulsos amenazan con tomar el control por completo. El desafío es mantener el equilibrio y permitirlos solo con moderación, pues el mal reside en el exceso."

 tariqelumma: "Tariq el-Umma"
 tariqelumma_adj: "Umma"
 tariqelumma_adherent: "Sadeeq"
 tariqelumma_adherent_plural: "Asdiqa"
 tariqelumma_desc: "Los seguidores del Tariq el-Umma se dedican a reafirmar sus naturalezas básicas mediante actos de bondad y compasión. A menudo buscan proteger y ayudar a sus vecinos mortales en secreto, e interceden cuando es posible para corregir injusticias o ver castigados a los culpables. Muchos adherentes equilibran sus naturalezas bestiales contribuyendo a la difusión del conocimiento y la curación en todo el mundo islámico."

 tariqelharb: "Tariq el-Harb"
 tariqelharb_adj: "Harb"
 tariqelharb_adherent: "Guerrero"
 tariqelharb_adherent_plural: "Guerreros"
 tariqelharb_desc: "Se espera que un guerrero Ashirra proteja a los creyentes de sus enemigos o de aquellos que interfieran con la práctica de la fe. Asimismo, debe defender el honor de las mujeres y los niños. En el campo de batalla, debe luchar como un hombre poseído, sin preocuparse por su propia seguridad. No es la vida del guerrero la que se pierde, sino la de Alá."

 tariqelbedouin: "Tariq el-Bedouin"
 tariqelbedouin_adj: "Beduino"
 tariqelbedouin_adherent: "Miembro de la tribu"
 tariqelbedouin_adherent_plural: "Miembros de la tribu"
 tariqelbedouin_desc: "Un vampiro musulmán sigue este Tariq porque cree que la indolencia y los lujos seductores de los palacios y las ciudades debilitan la autodisciplina y el valor moral de un individuo. En lugar de sufrir las innumerables distracciones de una existencia nocturna llena de miríadas de entretenimientos, el vampiro busca una existencia más dura y desesperada, vaciando su mente de todo excepto de los desafíos momento a momento que plantea la naturaleza salvaje."

 tariqelalaam: "Tariq el-Alaam"
 tariqelalaam_adj: "Alaam"
 tariqelalaam_adherent: "Shaheed"
 tariqelalaam_adherent_plural: "Shuhada"
 tariqelalaam_desc: "Los Shuhada son mártires que se ofrecen como sacrificios no-muertos para que otros no tengan que sufrir. Se sacrificarán voluntariamente para detener la corrupción causada por cualquier cosa considerada impía, ya sea mediante la batalla o de otro modo. Se ofrecen a la causa de Alá, esperando ser considerados tan dignos como los mártires mortales del Islam."

 sheperdsofislam: "Pastores del Islam"
 sheperdsofislam_adj: "Pastores"
 sheperdsofislam_adherent: "Testigo"
 sheperdsofislam_adherent_plural: "Testigos"
 sheperdsofislam_desc: "Los Pastores creen que Alá mismo, en Su sabiduría y compasión, los eligió para ser los cuidadores inmortales de las palabras del último y más grande Profeta (la paz sea con él). El Islam seguiría vivo —solo podría seguir vivo— en aquellos que hubieran presenciado personalmente las palabras del Profeta y estuvieran siempre presentes para relatarlas a los demás."

 tariqelatham: "Tariq el-A'Tham"
 tariqelatham_adj: "A'Tham"
 tariqelatham_adherent: "Erudito"
 tariqelatham_adherent_plural: "Eruditos"
 tariqelatham_desc: "Practicado principalmente por la Qabilat al-Mawt, este Tariq combina tanto el Camino de los Huesos con las creencias Ashirra. Esto ha llevado a métodos más benignos de búsqueda de conocimiento, como los estudios astrológicos del mundo musulmán. Aunque no es plenamente aceptado por la mayoría de las sectas Ashirra, el Tariq el-A'Tham es tolerado y sus adherentes son libres de buscar el conocimiento siempre que no dañe a los mortales."
