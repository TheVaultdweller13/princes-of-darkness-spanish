 pod_factions.1103.t: "¡Habéis sido derrotado!"
 pod_factions.1103.desc: "A pesar de vuestra concertada defensa, los cazadores han abrumado la mayor parte de vuestro reino, arrancando vuestra cuidadosamente construida red de influencia a través de él. Vuestro prestigio está gravemente dañado y vuestra autoridad se encuentra en su punto más bajo. Los buitres acechan... y los cazadores podrían regresar en cualquier momento. Podríais recuperaros de esto, pero os costaría muy caro. Como tal, el sueño de los siglos es una perspectiva tentadora. El tiempo no es una preocupación, de todos modos..."
 pod_factions.1103.a: "Regresaré"
 pod_factions.1103.b: "¡Aún no he terminado!"
 POD_factions_county_loss_modifier: "Revuelta Popular"
 POD_factions_county_loss_modifier_desc: "Los mortales están resistiendo la influencia en esta zona de forma coordinada."
