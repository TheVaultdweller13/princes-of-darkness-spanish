l_spanish:
 arcana_visible: "Poderes de Fe"

 game_concept_arcana_lifestyle: "Arcanos"
 game_concept_arcana_lifestyle_desc: "Un Arcano es una proeza de “magia espiritual” que se nutre de la fe y las creencias de los seguidores mortales de un demonio."
 
 arcana_lifestyle_name: "Arcanos"
 arcana_lifestyle_desc: "Céntrate en los poderes que provienen de la fe de los mortales convertida en milagros de tus propios diseños pecaminosos."
 monthly_arcana_lifestyle_xp_gain_mult: "[experience|E] mensual de [lifestyle|E] de Arcanos"
 
 arcana_focus: "Información de Arcanos"
 arcana_focus_modifier: "[GetFocus('arcana_focus').GetName]"
 arcana_focus_desc: "#X La [experience|E] de [lifestyle|E] de [arcana_lifestyle|E] #bold SOLO#! se obtiene como ingresos anuales de los cultistas.#!"
 arcana_focus_effect_desc: "Centrarse en este estilo de vida es imposible."
 
 GAINS_ARCANA_LIFESTYLE_XP: "Gana $VALUE|V0$ de experiencia de [arcana_lifestyle|E]"
 GAINED_ARCANA_LIFESTYLE_XP: "Ganó $VALUE|V0$ de experiencia de [arcana_lifestyle|E]"
 I_GAIN_ARCANA_LIFESTYLE_XP: "Ganas $VALUE|V0$ de experiencia de [arcana_lifestyle|E]"
 I_GAINED_ARCANA_LIFESTYLE_XP: "Ganaste $VALUE|V0$ de experiencia de [arcana_lifestyle|E]"
 TARGET_GAINS_ARCANA_LIFESTYLE_XP: "[CHARACTER.GetShortUIName] gana $VALUE|V0$ de experiencia de [arcana_lifestyle|E]"
 TARGET_GAINED_ARCANA_LIFESTYLE_XP: "[CHARACTER.GetShortUIName] ganó $VALUE|V0$ de experiencia de [arcana_lifestyle|E]"

 GAINS_A_ARCANA_LIFESTYLE_PERKPOINT: "Gana $VALUE|V0$ desbloqueo de [perk|E] de [arcana_lifestyle|E]"
 GAINED_A_ARCANA_LIFESTYLE_PERKPOINT: "Ganó $VALUE|V0$ desbloqueo de [perk|E] de [arcana_lifestyle|E]"
 I_GAIN_A_ARCANA_LIFESTYLE_PERKPOINT: "Ganas $VALUE|V0$ desbloqueo de [perk|E] de [arcana_lifestyle|E]"
 I_GAINED_A_ARCANA_LIFESTYLE_PERKPOINT: "Ganaste $VALUE|V0$ desbloqueo de [perk|E] de [arcana_lifestyle|E]"
 TARGET_GAINS_A_ARCANA_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName] gana $VALUE|V0$ desbloqueo de [perk|E] de [arcana_lifestyle|E]"
 TARGET_GAINED_A_ARCANA_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName] ganó $VALUE|V0$ desbloqueo de [perk|E] de [arcana_lifestyle|E]"
 
 ARCANA_LIFESTYLE_PERK_POINTS_TRIGGER: "Puntos de ventaja de estilo de vida de Arcanos: $NUM|V0$"

 POD_arcana_perk_check_effect_limited: "#X ¡Esta ventaja solo puede ser usada por $POD_splat_demon_plural$!#!"
 POD_ARCANA_PERK_CHECK_EFFECT_PERK: "#X ¡No tienes suficientes puntos de ventaja de Arcanos!#! #weak ($VALUE|0$)#!"
 POD_ARCANA_PERK_CHECK_EFFECT_PERK_FULL: "#clickable Esta ventaja cuesta $VALUE|V0$ [Select_CString( EqualTo_CFixedPoint( '(CFixedPoint)$VALUE|q$', '(CFixedPoint)1' ), 'punto', 'puntos' )] de ventaja de Arcanos#!"

 arcana_apocalyptic_form_perk_name: "Forma Apocalíptica"
 arcana_devour_soul_perk_name: "Devorar alma"
 arcana_divine_potential_perk_name: "Potencial divino"
 arcana_enthrall_perk_name: "Esclavizar"
 arcana_hardened_flesh_perk_name: "Carne endurecida"
 arcana_inviolate_soul_perk_name: "Alma inviolable"
 arcana_invocation_of_name_perk_name: "Invocación del Nombre"
 arcana_pattern_sense_perk_name: "Sentido del Patrón"
 arcana_ravage_perk_name: "Asolar"
 arcana_regeneration_perk_name: "Regeneración"
 arcana_revelation_perk_name: "Revelación"

 ARCANA_APOCALYPTIC_FORM_PERK_EFFECT: "Como [character_interaction|E], cambia de forma a [GetModifier('POD_shapeshift_form_apocalyptic_angelic_modifier').GetNameWithTooltip] o [GetModifier('POD_shapeshift_form_apocalyptic_damned_modifier').GetNameWithTooltip]\n#flavor Todos los demonios, como remanente de su divinidad, poseen un estado de existencia al que pueden cambiar en batalla: su asombrosa forma Apocalíptica. Dependiendo del Tormento del demonio, pueden parecer angelicales, como si nunca hubieran caído, o verdaderamente malvados y violentos, mostrando el verdadero alcance de su tormento interior. En todos los casos, esta terrible y poderosa forma es el recurso principal de un demonio para la guerra.#!"
 ARCANA_DEVOUR_SOUL_PERK_EFFECT: "Como opción de ejecución, devora el alma de otro $POD_splat_demon$ para ganar #V 10#! puntos de ventaja de [arcana_lifestyle|E].\n#flavor Cuando está fuera de los confines del Infierno, un demonio puede atacar ferozmente a otro, destruyendo su alma y drenándola de su propia esencia.#!"
 ARCANA_DIVINE_POTENTIAL_PERK_EFFECT: "Como [character_interaction|E], intercambia 10 puntos de ventaja de [arcana_lifestyle|E] por #V 1#! punto de [skill|E] #italic permanente#!.\n#flavor Bajo tal comprensión de los Arcanos y la forma mortal, un demonio puede trascender los límites anteriormente mortales.#!"
 ARCANA_ENTHRALL_PERK_EFFECT: "Como [character_interaction|E], convierte a tu objetivo en tu Esclavo. Obtienen el [investiture_lifestyle|E], y puedes hacerles peticiones a cambio de puntos de ventaja de [arcana_lifestyle|E].\n#flavor Con un mero toque, un suplicante mortal ante el demonio puede ser 'bendecido' por su nuevo señor demoníaco.#!"
 ARCANA_HARDENED_FLESH_PERK_EFFECT: "#flavor El cuerpo anfitrión del demonio, en este estado, se vuelve verdaderamente duradero, capaz de ignorar golpes normalmente letales cuando está en condiciones óptimas. El poder puro que fluye hacia el cuerpo lo mantiene siempre joven, hasta que el demonio decida que ha terminado con su cuerpo actual.#!"
 ARCANA_INVIOLATE_SOUL_PERK_EFFECT: "Te vuelves inmune a los poderes mentales\n#flavor Como criaturas de posesión, nadie puede arrebatarle el control del cuerpo de un demonio.#!"
 ARCANA_INVOCATION_OF_NAME_PERK_EFFECT: "Desbloquea un [journey|E] que te permite aprender el [Glossary('True Name','podgloss.truename')] de un $POD_splat_demon$.\n#flavor Siempre que se pronuncia, el nombre verdadero de un demonio resuena en sus oídos, permitiéndoles potencialmente encontrar a la persona que se atrevió a pronunciarlo.#!"
 ARCANA_PATTERN_SENSE_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n #flavor Los demonios tuvieron una vez una sensibilidad instintiva a los patrones del orden natural, habiendo establecido esos patrones al principio de los tiempos. Con este arcano, un demonio ha vuelto a aprender eso y cómo explotarlo.#!"
 ARCANA_RAVAGE_PERK_EFFECT: "Como [character_interaction|E], mata a uno de tus Esclavos para restaurar [CHARACTER.Custom('PODEnergySplat')].\n#flavor En tiempos de desesperación, un demonio puede devorar las almas de sus esclavos para obtener poder, entregando sus vidas por sus señores caídos.#!"
 ARCANA_REGENERATION_PERK_EFFECT: "#flavor Con una comprensión de su poder interior, un demonio puede sanar las heridas de su forma para mantener su recipiente actual en perfecto estado.#!"
 ARCANA_REVELATION_PERK_EFFECT: "Como [character_interaction|E], revélate ante los mortales, ganando [CHARACTER.Custom('PODEnergySplat')] a cambio de [piety|E] o [prestige|E].\n#flavor Cuando carece de una fuente fiable de resolución, un demonio puede minar la fe de un mortal a través de una crisis religiosa extrema.#!"

 arcana_sharpen_senses_perk_name: "Agudizar sentidos"
 arcana_perfect_lie_perk_name: "Mentira perfecta"
 arcana_twist_of_fate_perk_name: "Giro del destino"
 arcana_read_the_heart_perk_name: "Leer el corazón"

 ARCANA_SHARPEN_SENSES_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$ \n #flavor Habiendo sido una vez la mano de Yahvé en la creación, un demonio puede continuar guiando el universo como elija.#!"
 ARCANA_PERFECT_LIE_PERK_EFFECT: "#flavor No importa cuán absurdo sea, los demonios con este poder pueden mentir tan fácilmente como respiran.#!"
 ARCANA_TWIST_OF_FATE_PERK_EFFECT: "Como [character_interaction|E], intercambia un punto de [perk|E] de [arcana_lifestyle|E] por [gold|E], [prestige|E] o [piety|E].\n#flavor El destino parece favorecer al demonio, ya que obtiene inusuales beneficios mortales, aparentemente al azar.#!"
 ARCANA_READ_THE_HEART_PERK_EFFECT: "Desbloquea un [journey|E] para tentar a tu objetivo al pecado. Obtienen el [trait|E] de pecado correspondiente a tu fe o, si ya lo tienen, se convierten a tu fe.\n #flavor Tan agudo se ha vuelto el sentido espiritual de un demonio que puede encontrar el pecado y las virtudes de todos, sin importar cuán profundamente enterrados estén.#!"

 arcana_gift_of_faith_perk_name: "Don de fe"
 arcana_increased_health_perk_name: "Salud aumentada"
 arcana_contagion_mastery_perk_name: "Maestría del contagio"
 arcana_spirit_sight_perk_name: "Visión espiritual"
 arcana_read_the_sin_perk_name: "Leer el pecado"
 arcana_shield_of_spite_perk_name: "Escudo de despecho"

 ARCANA_GIFT_OF_FAITH_PERK_EFFECT: "Reduce el coste de la [interaction|E] #V $POD_set_cultist_interaction$#! en un #P -25%#!\nMejora [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] aumentando la cantidad de [CHARACTER.Custom('PODEnergySplat')] ganada.\n#flavor Cuando rebosa energía divina, un demonio puede regalar su poder a un esclavo para aliviar el peso del estrés en su alma.#!"
 ARCANA_SHIELD_OF_SPITE_PERK_EFFECT: "#flavor Tan atormentada está la mente de un demonio que el simple hecho de intentar indagar en ella hace que el necio atacante sufra un dolor horrible por la desesperación y la maldad que contiene.#!"
 ARCANA_CONTAGION_MASTERY_PERK_EFFECT: "Como [character_interaction|E], infecta a un objetivo con una enfermedad de tu elección.\n#flavor El demonio, con este poder, obtiene la comprensión incluso de las formas de vida más pequeñas de Dios, siendo capaz de purgar la enfermedad de un anfitrión o, peor aún, afligirlo con una.#!"
 ARCANA_SPIRIT_SIGHT_PERK_EFFECT: "$POD_can_summon_on_death_trigger_loca$\n#flavor Como seres espirituales, ni siquiera los muertos inquietos escapan a los ojos de un demonio vigilante.#!"
 ARCANA_READ_THE_SIN_PERK_EFFECT: "Mejora [GetPerk('arcana_read_the_heart_perk').GetName(GetPlayer)] aumentando la [planning_speed|E] y la probabilidad de éxito.\n#flavor Como criaturas del pecado, un demonio puede observar a un mortal y encontrar el pecado que gobierna su corazón.#!"
 ARCANA_INCREASED_HEALTH_PERK_EFFECT: "[GetPerk('arcana_regeneration_perk').GetName(GetPlayer)] ahora ocurre #V dos veces#! al año.\n#flavor Con una comprensión de su físico, un demonio puede llevar su recipiente más allá de los meros límites mortales.#!"

 arcana_incorporeal_form_perk_name: "Forma incorpórea"
 arcana_compel_sin_perk_name: "Compeler pecado"
 arcana_ultimate_horror_perk_name: "Horror definitivo"
 arcana_resilience_perk_name: "Resiliencia"
 arcana_spirit_strike_perk_name: "Golpe espiritual"
 arcana_healing_touch_perk_name: "Toque sanador"
 arcana_sin_eating_perk_name: "Comer pecado"
 arcana_preternatural_reflexes_perk_name: "Reflejos preternaturales"
 arcana_scry_perk_name: "Escrutar"
 arcana_relentless_soul_perk_name: "Alma implacable"

 ARCANA_INCORPOREAL_FORM_PERK_EFFECT: "Como [character_interaction|E], cambia de forma a [GetModifier('POD_shapeshift_form_incorporeal_modifier').GetNameWithTooltip].\nYa no puedes ser encarcelado durante [sieges|E] o [raids|E].\n#flavor Usando su forma física como ancla, un demonio ha encontrado una manera de engañar a las prisiones del infierno, permitiéndole proyectarse desde un recipiente y convertirse de nuevo en un ser espiritual.#!"
 ARCANA_SIN_EATING_PERK_EFFECT: "Mejora [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] reduciendo su coste.\n#flavor El conocimiento del pecado del demonio llega a ser tal que los mortales en medio de la desesperación alimentan a su atormentador infernal.#!"
 ARCANA_ULTIMATE_HORROR_PERK_EFFECT: "Inflige a cada gobernante del bando opuesto [GetModifier('POD_ultimate_horror_modifier').GetNameWithTooltip] al comenzar una [war|E] como atacante o defensor principal.\n#flavor Tan terrible se ha vuelto la forma apocalíptica de este demonio que la locura y la aflicción lo siguen allá donde va a la guerra.#!"
 ARCANA_RESILIENCE_PERK_EFFECT: "#flavor Habiendo dominado el daño que puede resistir, un demonio con este arcano es mucho más difícil de herir, siendo su cuerpo sobrenaturalmente resistente al daño.#!"
 ARCANA_SPIRIT_STRIKE_PERK_EFFECT: "#flavor Con este poder, el demonio puede invocar su forma espiritual para mutilar incluso a los espíritus; nada escapa a la ira del demonio.#!"
 ARCANA_HEALING_TOUCH_PERK_EFFECT: "Como [character_interaction|E], sana a tu objetivo.\n#flavor Con los poderes de la fe mortal, el demonio puede sanar a los vivos, reparando sus heridas salvajes.#!"
 ARCANA_COMPEL_SIN_PERK_EFFECT: "Mejora [GetPerk('arcana_read_the_heart_perk').GetName(GetPlayer)] aumentando la [planning_speed|E] y la probabilidad de éxito.\n#flavor Con este poder, un demonio puede inyectar su pecado en una víctima, sacando el pecado de lo más profundo de su propia alma.#!"
 ARCANA_PRETERNATURAL_REFLEXES_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$ \n #flavor En este estado de poder, un demonio obtiene una conciencia sobrenatural de su entorno, siempre listo para entrar en combate, y siempre preparado.#!"
 ARCANA_SCRY_PERK_EFFECT: "Habilita la [scheme|E] de [GetScheme('abduct').GetTypeName]\n#flavor Con concentración y un nombre, un demonio puede adivinar información sobre este lugar de enfoque.#!"
 ARCANA_RELENTLESS_SOUL_PERK_EFFECT: "#flavor Cuando un demonio fuera a recibir un golpe mortal, su poder innato puede detener las puertas de la muerte para su caparazón, dejándolo 'meramente' inconsciente en su lugar.#!"

 arcana_arsenal_of_the_beast_perk_name: "Arsenal de la Bestia"
 arcana_inhuman_strength_perk_name: "Fuerza inhumana"
 arcana_damage_immunity_perk_name: "Inmunidad al daño"
 arcana_trait_aptitude_perk_name: "Aptitud de rasgo"
 arcana_speed_of_thought_perk_name: "Velocidad del pensamiento"
 arcana_premonition_perk_name: "Premonición"
 arcana_invinsibility_perk_name: "Invisibilidad"
 arcana_read_the_mind_perk_name: "Leer la mente"
 arcana_command_the_dead_perk_name: "Comandar a los muertos"
 arcana_fortunate_guess_perk_name: "Conjetura afortunada"
 arcana_shrouded_soul_perk_name: "Alma velada"

 ARCANA_ARSENAL_OF_THE_BEAST_PERK_EFFECT: "Como [character_interaction|E], puedes añadir armas de cambio de forma bestiales a tu repertorio, o transformarte en todas ellas a la vez.\n#flavor El demonio, en este estado, puede manifestar un arma en su forma Apocalíptica, en forma de hojas sublimes o garras perversas que ni siquiera las bestias más crueles usarían.#!"
 ARCANA_INHUMAN_STRENGTH_PERK_EFFECT: "#flavor Con este poder, la fuerza de un demonio se manifiesta en poder puro, como cordones de músculo ondulante o como una reserva oculta de poder aterrador.#!"
 ARCANA_DAMAGE_IMMUNITY_PERK_EFFECT: "No recibirá daño por estacas o fuego, y no puede volverse [GetTrait('inappetetic').GetName(GetPlayer)].\n#flavor Con este poder, un demonio se vuelve totalmente inmune a una forma de destrucción física, y su forma se vuelve verdaderamente, apocalípticamente, duradera.#!"
 ARCANA_TRAIT_APTITUDE_PERK_EFFECT: "#flavor Tan profunda se ha vuelto la comprensión de un demonio sobre un campo que no tiene rival en él, ya que todo lo que realiza con esta habilidad se ha convertido en una obra maestra.#!"
 ARCANA_SPEED_OF_THOUGHT_PERK_EFFECT: "#flavor Tan cegadora es la velocidad de este demonio que podría disparar una ballesta y atrapar el virote en el aire usando su temible poder.#!"
 ARCANA_PREMONITION_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$ \n Recibirás una notificación si alguien intenta asesinar a tus amigos o familiares.\n#flavor Como una araña en su tela, el personaje siente vibraciones en los hilos del destino cuando se acerca el peligro, preparándolo para todos los resultados.#!"
 ARCANA_INVINSIBILITY_PERK_EFFECT: "Como [character_interaction|E], cambia de forma a [GetModifier('POD_shapeshift_form_invisible_modifier').GetNameWithTooltip].\n#flavor A medida que su forma se vuelve más y más maleable a la voluntad del demonio, obtienen la capacidad de eliminarse de la visión de los seres de la creación.#!"
 ARCANA_COMMAND_THE_DEAD_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\nDesbloquea [men_at_arms|E] de Wraiths y No Muertos.\n#flavor Ni siquiera los muertos pueden escapar a este poder, ya que un demonio puede obligarlos a servir.#!"
 ARCANA_READ_THE_MIND_PERK_EFFECT: "Como [character_interaction|E], conoce todos los secretos e intrigas de tu objetivo. Si te eliges a ti mismo, descubre todas las intrigas dirigidas contra ti.\n#flavor Con el libro de la mente al descubierto, un demonio con este poder puede saquear los pensamientos de la mente como si fuera un libro abierto.#!"
 ARCANA_FORTUNATE_GUESS_PERK_EFFECT: "Habilita la [scheme|E] de [GetScheme('fabricate_hook').GetTypeName]\n#flavor Tan sintonizado con las conexiones mortales se ha vuelto el demonio que a veces puede comprender y saber si alguien muestra mala voluntad hacia sus cultistas favorecidos.#!"
 ARCANA_SHROUDED_SOUL_PERK_EFFECT: "$countermeasures_unlocks_t1_obfuscated_court$ \n #flavor Con este poder, un demonio puede nublar la cognición de quienes lo rodean, volviéndose anónimo entre la multitud, sin importar cuánto destaque el demonio.#!"

 arcana_conquering_will_perk_name: "Voluntad conquistadora"
 arcana_inured_to_agony_perk_name: "Inmune a la agonía"
 arcana_visage_of_glory_perk_name: "Visaje de gloria"
 arcana_reshape_flesh_perk_name: "Remodelar carne"
 arcana_excise_soul_perk_name: "Extirpar alma"
 arcana_foretell_perk_name: "Predecir"
 arcana_shortened_path_perk_name: "Camino acortado"
 arcana_reapers_hunger_perk_name: "Hambre del segador"
 arcana_touch_from_afar_perk_name: "Toque desde lejos"

 ARCANA_CONQUERING_WILL_PERK_EFFECT: "#flavor Invocando el nombre del mismísimo Yahvé, un demonio puede potenciar a sus guerreros con la palabra del dios que los expulsó.#!"
 ARCANA_INURED_TO_AGONY_PERK_EFFECT: "#flavor Un demonio con este poder triunfa sobre preocupaciones mortales como el 'dolor' o la 'edad' y, más bien, no importa cuán mutilado esté, mientras el demonio permanezca en pie, luchará como si no hubiera sido tocado por la guerra o la enfermedad.#!"
 ARCANA_VISAGE_OF_GLORY_PERK_EFFECT: "#flavor Canalizando los recuerdos de su antiguo estatus como Elohim, durante un corto tiempo, un demonio puede volverse verdaderamente angelical.#!"
 ARCANA_RESHAPE_FLESH_PERK_EFFECT: "Puedes cambiar los [traits|E] físicos de un objetivo voluntario.\n#flavor El demonio con este poder puede ordenar a la materia animal viva que cambie e incluso fluya como la cera bajo su toque, siendo capaz de darle forma según su voluntad maldita.#!"
 ARCANA_EXCISE_SOUL_PERK_EFFECT: "$POD_can_covert_to_wraith_trigger_loca$\n$POD_can_summon_wraith_trigger_loca$\nDestruyes el alma de cualquier personaje que mates, ignorando las habilidades de resurrección.\n#flavor Con este terrible poder, un demonio invoca un ritual, arrancando el alma de una víctima y obligándola a servir a los deseos del demonio.#!"
 ARCANA_FORETELL_PERK_EFFECT: "#flavor Tal es la comprensión de un demonio sobre la creación que puede ser capaz de predecir aquello que aún no ha ocurrido.#!"
 ARCANA_SHORTENED_PATH_PERK_EFFECT: "#flavor Con una comprensión de las antiguas sendas de la creación, un demonio puede reducir el tiempo de travesía a fracciones de lo que fue una vez.#!"
 ARCANA_REAPERS_HUNGER_PERK_EFFECT: "Cada muerte otorga [GetModifier('POD_reapers_hunger_modifier').GetNameWithTooltip] durante 5 años.\n#flavor Siempre que un demonio con este poder acaba con la vida de un mortal, puede cosechar el alma agonizante para obtener un preciado poder.#!"
 ARCANA_TOUCH_FROM_AFAR_PERK_EFFECT: "#flavor A medida que crece la comprensión del demonio sobre la realidad espacial, también lo hace el alcance de sus arcanos.#!"

 arcana_unyielding_perk_name: "Inflexible"
 arcana_theft_of_faith_perk_name: "Robo de fe"
 arcana_behold_the_metatron_perk_name: "Contemplar al Metatrón"
 arcana_command_the_eternal_soul_perk_name: "Comandar el alma eterna"
 arcana_implacable_vengeance_perk_name: "Venganza implacable"
 arcana_trait_enhancement_perk_name: "Mejora de rasgos"
 arcana_certainties_of_chance_perk_name: "Certezas del azar"
 arcana_celestial_radience_perk_name: "Resplandor celestial"
 arcana_shadow_mastery_perk_name: "Maestría de las sombras"
 arcana_step_between_perk_name: "Paso intermedio"

 ARCANA_UNYIELDING_PERK_EFFECT: "#flavor Tan fuerte es la fuerza de voluntad de un demonio que, mientras tenga la fuerza de su convicción, los golpes pueden ser desviados solo con la voluntad.#!"
 ARCANA_THEFT_OF_FAITH_PERK_EFFECT: "Reduce el coste de la [interaction|E] #V $POD_set_cultist_interaction$#! en un #P 50%#!\nMejora [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] aumentando la cantidad de [CHARACTER.Custom('PODEnergySplat')] ganada.\n#flavor Tan completa se ha vuelto la comprensión de un demonio sobre las almas que ninguna alma puede escapar a la posibilidad de ser devorada por su señor infernal.#!"
 ARCANA_BEHOLD_THE_METATRON_PERK_EFFECT: "#flavor Convirtiéndose en un verdadero arquitecto de la creación, el demonio desvela su forma más verdadera, su estado más primigenio, ya sea uno de sublime perfección o de horrendo mal.#!"
 ARCANA_COMMAND_THE_ETERNAL_SOUL_PERK_EFFECT: "Como [character_interaction|E] sobre un $POD_splat_demon$ en tu prisión, tienes un 50% de probabilidad de convertirlo en una marioneta leal o enviarlo al [UmbraGlossary('abyss')].\n#flavor Con este poder, un demonio puede invocar el nombre verdadero de otro demonio, obligándolo a la sumisión.#!"
 ARCANA_IMPLACABLE_VENGEANCE_PERK_EFFECT: "#flavor Monstruos implacables, un demonio puede invocar el nombre verdadero de un objetivo para ser el heraldo imparable de la perdición de su víctima, convirtiéndose en heraldos indomables de la desesperación.#!"
 ARCANA_TRAIT_ENHANCEMENT_PERK_EFFECT: "#flavor En este nivel de maestría, un demonio ha superado verdaderamente los límites de la humanidad.#!"
 ARCANA_CERTAINTIES_OF_CHANCE_PERK_EFFECT: "#flavor Con solo observar el flujo del azar y el destino, un demonio puede retorcerlo para sus fines.#!"
 ARCANA_CELESTIAL_RADIENCE_PERK_EFFECT: "#flavor El demonio canaliza su poder como una luz cegadora, convirtiéndose en un faro de luz ardiente.#!"
 ARCANA_SHADOW_MASTERY_PERK_EFFECT: "Como [character_interaction|E], cambia de forma a [GetModifier('POD_shapeshift_form_shadow_modifier').GetNameWithTooltip].\n#flavor Tan poderosa se ha vuelto la voluntad del demonio sobre su propia alma que puede vestir su alma, convirtiéndose en una imponente columna de oscuridad.#!"
 ARCANA_STEP_BETWEEN_PERK_EFFECT: "#flavor Con este poder, un demonio puede deformar suavemente el espacio, desapareciendo y reapareciendo en un estallido de luz o una sombra vacilante.#!"

 arcana_ravage_sinner_perk_name: "Asolar al pecador"
 arcana_greater_invocation_perk_name: "Invocación mayor"
 arcana_lash_of_anguish_perk_name: "Látigo de angustia"
 arcana_raise_the_dead_perk_name: "Alzar a los muertos"
 arcana_portal_mastery_perk_name: "Maestría de portales"

 ARCANA_RAVAGE_SINNER_PERK_EFFECT: "Mejora [GetPerk('arcana_revelation_perk').GetName(GetPlayer)] reduciendo su coste.\n#flavor Con este poder, la presencia del demonio hace que los peores deseos de los mortales salgan a la luz.#!"
 ARCANA_GREATER_INVOCATION_PERK_EFFECT: "Mejora [GetPerk('arcana_command_the_eternal_soul_perk').GetName(GetPlayer)] permitiendo que se use en no demonios.\n#flavor Con este poder, un demonio comienza a tener poder sobre los nombres mismos, siendo capaz de obligar a otros a someterse a sus invocaciones.#!"
 ARCANA_PORTAL_MASTERY_PERK_EFFECT: "Como [character_interaction|E], te permite teletransportar tu ejército a la ubicación de tu objetivo, o teletransportarte a tu siguiente destino cuando viajas.\nIgnora la inmunidad a la captura.\n#flavor Del mismo modo que la existencia estuvo una vez a su entera disposición, un demonio puede atravesar o cerrar barreras a su voluntad.#!"
 ARCANA_RAISE_THE_DEAD_PERK_EFFECT: "Como [character_interaction|E], convierte a un $POD_splat_wraith$ vinculado en un [GetTrait('risen').GetName(GetPlayer)].\n#flavor Ni siquiera los muertos pueden escapar a la servidumbre al demonio, ya que con este poder, el demonio puede alzar legiones de muertos para servir a sus deseos infernales.#!"
 ARCANA_LASH_OF_ANGUISH_PERK_EFFECT: "#flavor Tan sintonizado se ha vuelto un demonio con su propio dolor que puede proyectar su angustia y dolor interior como una ráfaga de energía telepática.#!"

 arcana_open_gate_perk_name: "Abrir puerta"
 arcana_alter_fate_perk_name: "Alterar el destino"

 ARCANA_OPEN_GATE_PERK_EFFECT: "Mejora [GetPerk('arcana_portal_mastery_perk').GetName(GetPlayer)] eliminando las limitaciones en el tamaño del ejército.\n#flavor El dominio del demonio sobre el espacio crece hasta tal punto que el espacio mismo se dobla bajo la voluntad del demonio.#!"
 ARCANA_ALTER_FATE_PERK_EFFECT: "#flavor Habiendo adivinado una vez la creación misma, con este poder, un demonio puede invocar el nombre de una víctima para manipular y retorcer su propio destino.#!"

 arcana_beyond_now_perk_name: "Más allá del ahora"

 ARCANA_BEYOND_NOW_PERK_EFFECT: "Como [character_interaction|E], obtén [GetModifier('POD_beyond_now_modifier').GetNameWithTooltip] durante 1 semana a un coste de 300 de [static_stress|E].\n#flavor Con este poder, un demonio puede salir del tiempo mismo, teniendo el tapiz del cosmos temporalmente a su disposición.#!"
