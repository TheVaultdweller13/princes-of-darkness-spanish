 neutral_totems_legacy_track_name: "Tótems Espirituales"
 neutral_totems_legacy_track_desc: "Algunos Tótems son neutrales y no eligen una tribu o una manada a la que apoyar. Podrían ser atraídos a tu causa si demuestras suficiente respeto por sus áreas de interés específicas."
 neutral_totems_legacy_1_name: "El Halcón"
 neutral_totems_legacy_1_perk: "@warning_icon!#X Para desbloquear esta ventaja de dinastía, necesitas ser un Maestro Cazador.#!"
 neutral_totems_legacy_2_name: "La Esfinge"
 neutral_totems_legacy_2_perk: "@warning_icon!#X Para desbloquear esta ventaja de dinastía, necesitas tener el rasgo [GetTrait('scholar').GetName( GetPlayer )] y 20 de Aprendizaje o más. Aún necesitas la ventaja anterior.#!" 
 neutral_totems_legacy_3_name: "El Zorro"
 neutral_totems_legacy_3_perk: "@warning_icon!#X Para desbloquear esta ventaja de dinastía, necesitas haber terminado los tres árboles de estilo de vida de Intriga. Aún necesitas las ventajas anteriores.#!"
 neutral_totems_legacy_4_name: "La Tortuga Negra"
 neutral_totems_legacy_4_perk: "@warning_icon!#X Esta ventaja de dinastía se desbloqueará automáticamente cuando encuentres a la Tortuga Negra (asigna un explorador en la [umbra|E] para encontrar una pista sobre la ubicación e inicia una [umbra_expedition|E] para llegar a ella) y superes un desafío en la parte de los [UmbraGlossary('spirit_wilds')] de la [umbra|E].#!"
 neutral_totems_legacy_5_name: "La Hiena"
 neutral_totems_legacy_5_perk: "@warning_icon!#X Esta ventaja de dinastía también puede desbloquearse automáticamente cuando adquieras el rasgo [GetTrait('viking').GetName( GetPlayer )]. Empezar con él no cuenta.#!"


