 bagheera_legacy_track_name: "Hijos de Saraam"
 bagheera_legacy_track_desc: "Curiosos y eruditos, los Bagheera honran el sacrificio de su madre manteniendo la paz entre los humanos y los Bastet."
 bagheera_legacy_1_name: "Orgullo de Saraam"
 bagheera_legacy_1_perk: "Puede reclutar [GetMaA('children_saraam').GetName] como [men_at_arms|E] \n#flavor Gráciles y letales, la élite de la prole de Saraam protege la justicia y el honor dondequiera que viajen. #!"
 bagheera_legacy_2_name: "Gyani, la Sabiduría"
 bagheera_legacy_2_perk: "#flavor \"Yo soy la sabiduría\", dijo el gato negro. \"El guardián de secretos que ruge en la noche. Llámame Gyani, el observador del bosque\". #!"
 bagheera_legacy_3_name: "Guerreros del Viento"
 bagheera_legacy_3_perk: "#flavor Un Bagheera en batalla es una criatura hermosa de contemplar, cada movimiento calculado perfectamente sincronizado con la danza de la muerte. #!"
 bagheera_legacy_4_name: "Agun, la Ira"
 bagheera_legacy_4_perk: "#flavor \"Yo soy la ira\", dijo el gato manchado. \"Las garras furiosas con mil ojos. Llámame Agun, el observador de las llanuras\". #!"
 bagheera_legacy_5_name: "Panteras y Tigres"
 bagheera_legacy_5_perk: "Puede reclutar [GetMaA('durga_chosen').GetName] como [men_at_arms|E] \n#flavor Los Hijos del Tigre, los Khan, siempre han sido amigos de los Bagheera. Ambas tribus trabajan en concierto para sanar a la herida nación Bastet. #!"
 
 bubasti_legacy_track_name: "Hijos de Cymaa"
 bubasti_legacy_track_desc: "Misteriosos y distantes, los Bubasti anhelan la noche en que regresarán como los legítimos dioses de Egipto."
 bubasti_legacy_1_name: "Elegidos de Ubastet"
 bubasti_legacy_1_perk: "Puede reclutar [GetMaA('warriors_ubastet').GetName] como [men_at_arms|E] \n#flavor Nadie conoce las tierras de Egipto tanto como estos guerreros de los Bubasti. No escuches a las serpientes. #!"
 bubasti_legacy_2_name: "Nobleza de Khem"
 bubasti_legacy_2_perk: "#flavor Los Bubasti una vez eligieron solo entre los mejores nobles de Egipto para tener el privilegio de unirse a sus filas. Aunque este periodo ha terminado, su altivez no. #!"
 bubasti_legacy_3_name: "Hechiceros Reservados"
 bubasti_legacy_3_perk: "#flavor Los Bubasti una vez castigaron a los mortales insolentes con poderosas hazañas de magia capaces de nivelar ciudades enteras. Han disminuido en poder desde entonces, pero los secretos no se han perdido por completo. #!"
 bubasti_legacy_4_name: "Maestro de las Artes Oscuras"
 bubasti_legacy_4_perk: "#flavor Aunque han perdido mucho desde sus días de gloria, los Bubasti vigilaron de cerca su activo más poderoso, su conocimiento de muchos rituales inusuales y poderosos. #!"
 bubasti_legacy_5_name: "Isis, la Amada"
 bubasti_legacy_5_perk: "Puede reclutar [GetMaA('cultists').GetName] como [men_at_arms|E] \n#flavor Isis una vez compartió secretos y amor con los Bubasti, cimentando sus lazos con la $glossary_osirian_league$. Sus cultistas todavía veneran adecuadamente a los gatos de Khem hasta esta noche. #!"

 ceilican_legacy_track_name: "Hijos del Sueño"
 ceilican_legacy_track_desc: "Traicionados por sus parientes hadas, los sueños de los Ceilican se convirtieron en pesadillas."
 ceilican_legacy_1_name: "Azote del Traidor"
 ceilican_legacy_1_perk: "Puede reclutar [GetMaA('samhach_bane').GetName] como [men_at_arms|E] \n#flavor El gran traidor casi exterminó a los Ceilican. Algún día llegará a arrepentirse de no haber terminado el trabajo. #!"
 ceilican_legacy_2_name: "El Camino Silencioso"
 ceilican_legacy_2_perk: "#flavor Para el mundo exterior, los Ceilican están todos muertos o esclavizados por Samhach. Tienen la intención de mantener al mundo pensando así el mayor tiempo posible. #!"
 ceilican_legacy_3_name: "Gatos Camaleón"
 ceilican_legacy_3_perk: "#flavor Los Ceilican son expertos en hacerse pasar por otras tribus Bastet o incluso otros tipos de seres sobrenaturales. Esto les permite infiltrarse en otras sociedades secretas para protegerse. #!"
 ceilican_legacy_4_name: "La Broma Amarga"
 ceilican_legacy_4_perk: "#flavor Los Ceilican lo perdieron todo excepto su pasión ardiente. Bailarán y festejarán hasta que el mundo se acabe... y tal vez incluso después. #!"
 ceilican_legacy_5_name: "Gatos Hada"
 ceilican_legacy_5_perk: "Puede reclutar [GetMaA('ovinniks').GetName] como [men_at_arms|E] \n#flavor Aunque fueron traicionados y cazados por un señor de las Hadas, los Ceilican todavía pueden contar con algunos aliados entre sus antiguos parientes Hada. #!"

 khan_legacy_track_name: "Hijos de Durga"
 khan_legacy_track_desc: "Los Khan, obligados por el deber, están listos para defender a la raza felina contra sus muchos enemigos. Su honor no exige menos."
 khan_legacy_1_name: "Guardia del Khan"
 khan_legacy_1_perk: "Puede reclutar [GetMaA('durga_chosen').GetName] como [men_at_arms|E] \n#flavor Los más fuertes y firmes de los hijos del Tigre son un espectáculo digno de ver y un enemigo al que temer. #!"
 khan_legacy_2_name: "Salvadores Temerarios"
 khan_legacy_2_perk: "#flavor Las leyendas de los Khan hablan de su gran batalla para salvar a Durga, la Luna, que los vio triunfar sobre Asura. En su triunfo, sin embargo, quedaron cegados ante el verdadero objetivo del demonio. #!"
 khan_legacy_3_name: "Ojo del Tigre"
 khan_legacy_3_perk: "#flavor El entrenamiento de un Khan nunca termina. Al esperar lo mejor de sí mismo, impulsa a sus aliados a mayores alturas. #!"
 khan_legacy_4_name: "Merodeando Juntos"
 khan_legacy_4_perk: "#flavor Cada Khan es un guerrero nato. Un grupo entero de ellos cargando a la guerra es una visión gloriosa para la nación Bastet. #!"
 khan_legacy_5_name: "Tigres y Panteras"
 khan_legacy_5_perk: "Puede reclutar [GetMaA('children_saraam').GetName] como [men_at_arms|E] \n#flavor Los Hijos de la Pantera, los Bagheera, siempre han sido amigos de los Khan. Ambas tribus trabajan en concierto para sanar a la herida nación Bastet. #!"

 simba_legacy_track_name: "Hijos de Seline"
 simba_legacy_track_desc: "Los Simba recibieron de la propia Luna la tarea de gobernar a la pendenciera e ineficaz nación Bastet. ¿Puede haber arrogancia cuando hay un destino?"
 simba_legacy_1_name: "Luchadores Reales"
 simba_legacy_1_perk: "Puede reclutar [GetMaA('seline_pride').GetName] como [men_at_arms|E] \n#flavor Los leones son gobernantes y, como tales, rara vez tienen que ir a la guerra ellos mismos, pero cuando lo hacen, se les recuerda a todos su estatus. #!"
 simba_legacy_2_name: "Los Reyes Leones"
 simba_legacy_2_perk: "#flavor El gobierno de los Simba es de legitimidad y justicia... o más a menudo, de terror y tiranía. Los Reyes Leones exigen obediencia absoluta. #!"
 simba_legacy_3_name: "Maestros de la Sabana"
 simba_legacy_3_perk: "#flavor Un Simba no es tan rápido como un Swara ni tan fuerte como un Khan, pero ningún Bastet puede igualar la pura dureza de sus preciadas pieles. #!"
 simba_legacy_4_name: "Gobernando por el Miedo"
 simba_legacy_4_perk: "#flavor Los Simba valoran la fuerza y la obediencia. Salvarán a la nación Bastet y esperan que los demás felinos se mantengan a raya mientras lo hacen. #!"
 simba_legacy_5_name: "Compostura Ardiente"
 simba_legacy_5_perk: "Puede reclutar [GetMaA('fire_elemental').GetName] como [men_at_arms|E] \n#flavor Como la raza $glossary_fera$ más poderosa del África subsahariana, los Simba han hecho pactos durante mucho tiempo con los espíritus nativos de esta tierra. #!"

 swara_legacy_track_name: "Hijos de Danaa"
 swara_legacy_track_desc: "Los Swara son los guardianes de los lugares puros, siempre corriendo de uno a otro, purificándolos a su paso."
 swara_legacy_1_name: "Carrera del Guepardo"
 swara_legacy_1_perk: "Puede reclutar [GetMaA('danaa_runners').GetName] como [men_at_arms|E] \n#flavor Los Swara no son tan duros ni de aspecto tan impresionante como sus compañeros Bastet, pero su velocidad inigualable les ha ganado muchas peleas. #!"
 swara_legacy_2_name: "Guerra Veloz"
 swara_legacy_2_perk: "#flavor Siempre en movimiento, el orgullo de un Swara es casi imposible de atrapar. Probablemente solo los verás cuando ellos realmente quieran que lo hagas. #!"
 swara_legacy_3_name: "Vengadores Implacables"
 swara_legacy_3_perk: "#flavor Aunque no son tan agresivos como sus compañeros Bastet, los Swara guardan rencores largos. Escapar de uno decidido a vengarse de ti es casi inaudito. #!"
 swara_legacy_4_name: "Evitando a los Simios"
 swara_legacy_4_perk: "#flavor A los Swara no les importa la interferencia humana siempre que no invadan los lugares puros. Es raro que uno de ellos entre en conflicto con ellos, lo cual es un marcado contraste con los otros Bastet. #!"
 swara_legacy_5_name: "Contactos Espirituales"
 swara_legacy_5_perk: "Puede reclutar [GetMaA('air_elemental').GetName] como [men_at_arms|E] \n#flavor Los Swara entienden la [umbra|E] mucho más que cualquier otro Bastet. Sus contactos en el [spirit_world|E] no tienen rival, un hecho que se esmeran en mantener en secreto.#!"


 ###TODO Mokole Optional: add flavor to individual perks
 mokole_mbembe_legacy_track_name: "Corriente de Tierra"
 mokole_mbembe_legacy_track_desc: "#flavor La primera y más numerosa Corriente. El camino de los Mokolé-mbembe está lleno de la sangre de sus enemigos.#!"
 mokole_mbembe_legacy_1_name: "Espíritu Guerrero"
 mokole_mbembe_legacy_1_perk: "$UNLOCKS_ABILITY_TO_DUEL_RIVALS$.\nDerrotar a [rivals|E] en [single_combat_duel_plural|E] otorga experiencia de [martial_lifestyle|E] que escala con la [prowess|E] de tu oponente.\n #flavor #!"
 mokole_mbembe_legacy_2_name: "Poder del $glossary_wyld$"
 mokole_mbembe_legacy_2_perk: "Puede reclutar [GetMaA('primal_saurians').GetName] como [men_at_arms|E].\n#flavor #!"
 mokole_mbembe_legacy_3_name: "Fuerza Fluida"
