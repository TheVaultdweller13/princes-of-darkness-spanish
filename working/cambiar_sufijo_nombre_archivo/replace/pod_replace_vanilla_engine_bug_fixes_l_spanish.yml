 ARTIFACT_EFFECT_HAS_CAN_BENEFIT: "#S Si cumples los requisitos:#!\n"
 POD_ARTIFACT_EFFECT_HAS_CAN_BENEFIT: "#L #S Requisitos del artefacto:#! #weak (ver descripción emergente)#!#!"

 # Corrección de vanilla para crashes al pasar el ratón sobre los requisitos de cargos en la corte
