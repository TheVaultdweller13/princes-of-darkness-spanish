 # Este archivo es para correcciones temporales de problemas extraños de vanilla (crashes, colisiones de hash, desbordamientos, etc.)
 # Es posible que se solucionen solos en futuras actualizaciones, por lo que vale la pena revisarlos regularmente para ver si es seguro revertirlos.

