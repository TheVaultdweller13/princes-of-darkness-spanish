l_spanish:

 pod_power_struggle_diarchy_type: "Lucha de Poder"
 pod_power_struggle_diarch_title: "Diarca"
 pod_diarch_domain_limit_bonus: "Apoyo del Diarca"
 pod_diarch_stress_malus: "En una Lucha de Poder"
 pod_diarch_prestige_bonus: "Compitiendo en una Lucha de Poder"
 diarch_value_good_ventrue_name: "El Clan antes que los Rencores Personales"
 POD_start_powerstruggle_decision: "Iniciar una Lucha de Poder"
 POD_start_powerstruggle_decision_desc: "Tu señor es débil, pero una guerra civil podría ser costosa. Sin embargo, hay otras formas de obtener el poder que anhelas..."
 POD_start_powerstruggle_decision_tooltip: "¡El reino necesita un cambio de liderazgo!"
 POD_start_powerstruggle_decision_effect_tooltip: "Amenazarás a tu señor para que te dé más poder.\nSi acepta, esto iniciará una diarquía de Lucha de Poder, contigo como diarca.\nSi se niega, esto le costará mucho prestigio y te ganarás su enemistad."
 POD_start_powerstruggle_decision_confirm: "¡Aquí están mis demandas!"
 diarchy_prestige_tt: "Necesitas tener más prestigio que tu señor"
 diarchy_legitimacy_tt: "Necesitas tener más legitimidad que tu señor."
 diarchy_military_strength_tt: "Necesitas tener más del 150% de la fuerza militar máxima de tu señor (representada por el número de tropas)."
 POD_diarchy_events.0002.t: "¡Tu Liderazgo es Cuestionado!"
 POD_diarchy_events.0002.desc: "Un vasallo ambicioso tuyo ha hecho recientemente un intento de disputar tu poder. Utilizando su creciente legitimidad, su gran prestigio y el hecho de que no le agradas mucho, ahora pide abiertamente una nueva distribución del poder en tu reino.\nEste será un caso difícil de combatir ahora que su demanda está hecha, pero aún podrías hacer un último esfuerzo para recortar su poder. La otra opción sería aceptar sus demandas; después de todo, podría haber algunos beneficios en tener tal acuerdo."
 POD_diarchy_events.0002.a: "¡Este es MI reino!"
 liege_warning_diarchy_tt: "Esto sucedió porque este vasallo tiene más prestigio, fuerza militar (número de levas) y una opinión débil de ti.\nSi rechazas su demanda ahora, podrá volver a presentarla en 10 años, siempre que siga cumpliendo los requisitos previos."
 POD_diarchy_events.0002.b: "El reino podría beneficiarse de tal sacudida."
 POD_diarchy_events.0003.t: "¡Tirano!"
 POD_diarchy_events.0003.desc: "Tu perfectamente legítima \"oferta\" para establecer una nueva división de poder en tu reino ha sido rechazada por tu tiránico señor. Esto le ha costado bastante legitimidad a los ojos del reino y podría abrirte nuevas oportunidades en el futuro. Esto también le enfureció, pero claramente este es un pequeño precio a pagar en tu camino al poder."
 POD_diarchy_events.0003.a: "El tiempo está de mi lado."
 POD_diarchy_events.0004.t: "¡Larga Vida al Diarca!"
 POD_diarchy_events.0004.desc: "Tu perfectamente legítima \"oferta\" para establecer una nueva división de poder en tu reino ha sido aceptada por tu sabio señor. Esta es una ocasión tremenda para que demuestres de lo que eres capaz. Tal vez si haces un trabajo lo suficientemente bueno y logras marginar a tu señor durante el proceso, podrías convencer al reino de que un cambio completo de liderazgo es necesario..."
 POD_diarchy_events.0004.a: "Mi primera reforma será..."
 POD_end_powerstruggle_decision: "Abandonar la Lucha de Poder"
 POD_end_powerstruggle_decision_tooltip: "Es hora de poner fin a este sinsentido."
 POD_end_powerstruggle_decision_desc: "Algunas luchas de poder nunca llegan a nada y terminan debilitando a ambas partes. Quizás sea hora de abandonar esta farsa, devolviendo el poder que le quitaste a tu señor."
 POD_end_powerstruggle_decision_confirm: "Hay otras formas de adquirir poder"
