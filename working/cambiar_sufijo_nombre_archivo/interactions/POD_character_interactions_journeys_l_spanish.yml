l_spanish:
 POD_hunt_target_interaction: "Cazar"
 POD_hunt_target_interaction_desc_vampire: "Emprende un [journey|E] para cazar a [recipient.GetShortUINameNoTooltip]. Podrás drenar su sangre para reponer tus reservas."
 POD_hunt_target_interaction_effect_vampire: "Emprenderás un [journey|E] para cazar a [recipient.GetShortUIName] y beber su sangre."
 POD_hunt_target_interaction_desc_chi: "Emprende un [journey|E] para cazar a [recipient.GetShortUINameNoTooltip]. Podrás drenar su sangre para reponer tu Fuerza de Voluntad."
 POD_hunt_target_interaction_desc_banemummy: "Emprende un [journey|E] para cazar a [recipient.GetShortUINameNoTooltip]. Podrás comer su carne para reponer tu Fuerza de Voluntad."
 POD_hunt_target_interaction_effect_banemummy: "Emprenderás un [journey|E] para cazar a [recipient.GetShortUIName] y comer su carne."
 POD_hunt_target_interaction_monthly: "El [journey|E] tendrá una [planning_speed|E] de $hunt_journey_monthly_num$ al mes."
 
 POD_wake_from_torpor_interaction: "Encontrar escondite"
 POD_wake_from_torpor_interaction_desc: "Emprende un [journey|E] para averiguar la ubicación exacta de este vampiro en letargo. Luego, podrías invitar[recipient.GetHerHim] a tu corte, o atacar[recipient.GetHerHim]..."
 POD_wake_from_torpor_interaction_effect: "Emprenderás un [journey|E] para intentar averiguar la ubicación exacta de este vampiro en letargo. Luego comenzará la caza. Obviamente, hay riesgos graves implicados..." 
 POD_wake_from_torpor_interaction_monthly: "#help La [planning_speed|E] de este [journey|E] se basa en la [intrigue_skill|E] tuya y de tu objetivo.#!"
 
 POD_assault_lair_interaction: "Encontrar guarida"
 POD_assault_lair_interaction_desc: "Emprende un [journey|E] para averiguar la ubicación exacta de este engendro. Luego comenzará la caza. Obviamente, hay riesgos graves implicados..."
 POD_assault_lair_interaction_infiltration: "@death_icon!#N;bold Dado que [recipient.GetShortUIName] tiene rango de [kingdom|E] o superior, solo puedes cazar[recipient.GetHerHim] [infiltrating|E] directamente en su guarida.#!"
 POD_assault_lair_interaction_effect: "Emprenderás un [journey|E] para averiguar la ubicación exacta de este engendro. Luego comenzará la caza. Obviamente, hay riesgos graves implicados..." 
 POD_assault_lair_interaction_monthly: "#help La [planning_speed|E] de este [journey|E] se basa en muchos factores, como la edad de tu objetivo, su rango, [intrigue|E], [masquerade_exposure|E] y otros.#!"
 POD_assault_lair_interaction_instant: "#help Debido a que has [GetModifier('tracked_down_modifier').GetNameWithTooltip|L] a tu objetivo, el [journey|E] se completará instantáneamente.#!"

 POD_heist_interaction_hostile_warning: "@death_icon!#N;bold El [splat|E] de [recipient.GetFirstName] es hostil hacia ti. Esta [infiltration|E] será mucho más mortal de lo normal, y el fracaso terminará en tu #R ejecución#! en lugar de en prisión.#!"
 POD_heist_interaction_wary: "@warning_icon! #X [recipient.GetShortUINameNoTooltip] está [GetModifier('wary_of_infiltrators_modifier').GetNameWithTooltip]#!"
 POD_heist_interaction_dont_scout: "El mapa #N;bold no#! será revelado de antemano."
 POD_heist_interaction_scout: "El mapa #P;bold sí#! será revelado, pero la [planning_phase|E] tardará tres veces más."
 POD_heist_interaction_one_key: "Tu objetivo estará en una cámara #N;bold cerrada#!. Tendrás que encontrar la llave durante la [infiltration|E]."
 POD_heist_interaction_two_keys: "Tu objetivo estará en una cámara #N;bold cerrada#!. Al tratarse de un artefacto valioso, tendrás que encontrar #N;bold dos llaves#! durante la [infiltration|E]."

 POD_gold_heist_interaction: "Robar oro"
 POD_gold_heist_interaction_desc: "Emprende una [infiltration_mission|E] para robar [gold|E] a [recipient.GetShortUINameNoTooltip]"
 POD_gold_heist_dont_scout: "Prepararse rápidamente"
 POD_gold_heist_scout: "Explorar a fondo"
 POD_cant_scout_hostile_heist: "No puedes reunir suficiente información sobre tus enemigos mortales"
 POD_gold_heist_interaction_effect: "Emprenderás una [infiltration_mission|E] para robar [gold|E] a [recipient.GetShortUIName]."
 POD_gold_heist_interaction_monthly: "El [journey|E] tendrá una [planning_speed|E] de $twelve_months_monthly_num$ al mes."
 POD_gold_heist_interaction_monthly_scouted: "El [journey|E] tendrá una [planning_speed|E] de $three_years_monthly_num$ al mes."
 POD_gold_heist_interaction_ghoul_mission: "Si logras robar algo de [gold|E] a [recipient.GetFirstName], completarás tu [bound_ghoul_mission_with_icon|E] de #V $POD_ghoul_mission_steal_rivals_gold_contract$#!."

 POD_artifact_heist_interaction: "Robo de artefacto"
 POD_artifact_heist_interaction_desc: "Emprende una [infiltration_mission|E] para robar un [artifact|E] a [recipient.GetShortUINameNoTooltip]"
 POD_artifact_heist_interaction_effect: "Emprenderás una [infiltration_mission|E] para robar [target.Custom('ColorizedArtifactName')] a [recipient.GetShortUIName]."
 POD_artifact_heist_interaction_monthly: "#help La [planning_speed|E] de este [journey|E] se basa en tu [stewardship_skill|E].#!"