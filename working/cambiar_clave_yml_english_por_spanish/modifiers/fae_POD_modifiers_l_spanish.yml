 POD_desprete_for_immortality_desc: "Solías ser inmortal, y ahora el tiempo corre en tu contra..."
 POD_useless_dreamers: "Soñadores Inútiles"
 POD_useless_dreamers_desc: "Gracias a tu estudio de la Banalidad, has perdido temporalmente la capacidad de drenar a los soñadores de manera efectiva.\nNo puedes perder estrés ni ganar Glamour de tus [dreamers|E]"
 POD_weird_dreaming_contection: "Conexión Extraña con el Ensueño"
 POD_weird_dreaming_contection_desc: "Gracias a tu estudio del Glamour, has perturbado temporalmente tu conexión con el [UmbraGlossary('dreaming')], haciendo los Conjuros más costosos.\n¡Coste de los [cantrips|E] multiplicado por #N 2#!"
 POD_disconected_from_dreaming: "Desconectado del Ensueño"
 POD_disconected_from_dreaming_desc: "En tu intento por alcanzar el equilibrio entre Glamour y Banalidad, hiciste algo mal...\n¡Coste de los [cantrips|E] multiplicado por #N 4#!\nNo puedes intentarlo de nuevo mientras dure este modificador"