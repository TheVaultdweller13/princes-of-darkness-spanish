l_spanish:
 POD_book_of_nod_decision: "Libro de Nod"
 POD_book_of_nod_decision_tooltip: "El Libro de Nod es un artefacto significativo del saber cainita."
 POD_book_of_nod_decision_opening_desc: "Revisarás tu colección de relatos del Libro de Nod para su ensamblaje o lectura."
 POD_book_of_nod_decision_effect_tooltip: "Puedes ensamblar partes del Libro de Nod o leer el texto.\n\nUna colección de textos antiguos, considerados sagrados para los cainitas nodistas. Consiste en múltiples recensiones y fragmentos que han sido reensamblados por varios eruditos vástagos. Tradicionalmente, la transmisión principal de la historia de Caín es oral, mientras que los textos con los eventos más importantes de la historia cainita están fuertemente custodiados para proteger a los cainitas. Su autor es desconocido, aunque a menudo se cita a Malkav, Saulot e incluso a Caín como autores de partes del mismo, si no de su totalidad. Algunos consideran que el libro entero son mitos o mentiras, una historia que los vampiros inventaron para explicar su existencia o una herramienta utilizada para engañar a otros para que piensen y actúen de una determinada manera. La pieza más antigua del Libro data de poco antes de la época de Sumeria, alrededor del 4500 a.C." 
 POD_book_of_nod_decision_confirm: "Considerar el Libro de Nod"
 POD_book_of_nod_decision_custom_cain: "Debes poseer La Crónica de Caín"
