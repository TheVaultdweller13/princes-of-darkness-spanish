 language_enochian_name: "Enoquiano"
 language_ghemalish_name: "Ghemalish"
 language_punic_name: "Púnico"
 language_coptic_name: "Copto"
 language_ancient_egyptian_name: "Egipcio Antiguo"
 language_kaja_name: "Kaja"
 language_kaja_desc: "La antigua y extraordinariamente compleja escritura ideográfica de los [Glossary('Wan Xian','game_concept_kuei_jin_desc')]."
 language_domari_name: "Domari"
 language_spring_name: "Primavera"
 language_spring_desc: "La Corte de la Primavera habla una lengua tonal, un método de comunicación que depende tanto de la entonación y el tono de voz como de las palabras reales. El idioma suena muy parecido a cantos y tarareos, además de palabras melifluas de sonido elegante. Cuando se escribe, el lenguaje de la Corte de la Primavera se parece mucho a espirales intrincadamente superpuestas y telarañas circulares en una página."
 language_summer_name: "Verano"
 language_summer_desc: "Los parientes del Verano se comunican en una lengua que tiene, con diferencia, el vocabulario más amplio en comparación con cualquier lenguaje humano o fae; es famosa por tener varias palabras para casi cualquier objeto o concepto posible. Cuando se habla, es un flujo de sílabas cortas y afiladas pronunciadas rápidamente. Cuando se escribe, parece superficialmente similar al lenguaje humano (en líneas horizontales), aunque es obvio, tras un vistazo superficial, que la lengua del Verano tiene cientos de letras y ninguna puntuación visible."
 language_autumn_name: "Otoño"
 language_autumn_desc: "Los fae del Otoño tienen un lenguaje susurrado puntuado e inflexionado con gestos de las manos. El estado de ánimo del hablante se transmite en la velocidad y la agudeza de los movimientos, desde gestos tranquilos y lentos cuando están relajados o cansados, hasta gestos cortantes y dentados cuando están enfadados; de hecho, es posible mantener conversaciones enteras sin pronunciar un sonido. Los susurros mismos suenan como vientos huracanados o suspiros largos, apenas vocalizados. Cuando se escribe, el lenguaje aparece como tajos de líneas curvas de grosor variable."
 language_winter_name: "Invierno"
 language_winter_desc: "El lenguaje de la Corte del Invierno suena como una combinación de gruñidos, aullidos, gruñidos y rugidos similares a los de los animales. Una conversación escuchada entre fae del Invierno puede confundirse muy fácilmente con una pelea entre varios animales depredadores grandes, lo que muestra el extenso vocabulario de la lengua. El lenguaje, cuando se escribe, consiste en una enorme variedad de pictogramas, con muchos miles de palabras representadas cada una por un símbolo único."
 language_ancient_arcadian_name: "Arcadio Antiguo"
 language_ancient_arcadian_desc: "Un lenguaje escrito indescifrable que parece ser un predecesor de los lenguajes de las Cortes Estacionales. Su elegante escritura está grabada en la pared de la Fortaleza de Cristal. Hasta ahora, ningún erudito ha sido capaz de dar sentido a la escritura. Puede contener secretos como el origen de los fae y su verdadero propósito en el mundo."
