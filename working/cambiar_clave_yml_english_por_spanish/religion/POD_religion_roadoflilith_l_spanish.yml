  #Lilin-Group Faiths
  derechlilit: "Derech Lilit"
  derechlilit_adj: "Lilín"
  derechlilit_adherent: "Lilín"
  derechlilit_adherent_plural: "Lilín"
  derechlilit_desc: "La Vía de Lilith está dedicada a la figura rabínica de Lilith, que aparece en múltiples fuentes nodistas así como en tradiciones mantenidas por cultos ocultos. La mayoría de los cultos descomponen a Lilith en principios fundamentales: el dolor y la creación. Para crear, uno debe herir y ser herido. Este es el principio fundamental de la vida misma."
 
  viafaciendi: "Via Faciendi"
  viafaciendi_adj: "Faciendi"
  viafaciendi_adherent: "Creador"
  viafaciendi_adherent_plural: "Creadores"
  viafaciendi_desc: "La Senda de la Creación se dedica a encontrar y propagar a los hijos-demonio de Lilith, basándose en la tradición bíblica de Lilith como la Madre de los Monstruos."
 
  viaspinae: "Via Spinae"
  viaspinae_adj: "Bahari"
  viaspinae_adherent: "Ba'ham"
  viaspinae_adherent_plural: "Bahari"
  viaspinae_desc: "La Senda de las Espinas se centra en el dolor físico. Sus miembros estudian el dolor de forma lógica, buscando codificar los puntos de ruptura y las formas de romper el umbral de una víctima para hacerle ver la dolorosa verdad de Lilith."
 
  viacalantica: "Via Calantica"
  viacalantica_adj: "Ki-sikil-lil-la-ke"
  viacalantica_adherent: "Ki-sikil-lil-la-ke"
  viacalantica_adherent_plural: "Ki-sikil-lil-la-ke"
  viacalantica_desc: "La Senda de los Velos se centra en Lilith como figura rebelde y opuesta tanto al Dios abrahámico como a Caín. Son los más virulentos de los Lilín, a menudo más guerreros que eruditos."
 
  holy_order_bahari: "Los Bahari"
  holy_order_faithful_of_the_dark_mother: "Fieles de la Madre Oscura"
  holy_order_lhaka: "Los Lhaka"
 
  daughtersofgorgo: "Hijas de Gorgo"
  daughtersofgorgo_adj: "Gorgona"
  daughtersofgorgo_adherent: "Gorgona"
  daughtersofgorgo_adherent_plural: "Gorgonas"
  daughtersofgorgo_desc: "Una organización pequeña pero militante que busca asesinar a cualquier tirano vampiro. Operan como asesinos, entrenando a neonatos agraviados para convertirlos en asesinos endurecidos listos para vengarse de sus opresores."
