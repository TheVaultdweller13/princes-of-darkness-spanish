 # Fe de grupo Setita
 viaset: "Vía de Set"
 viaset_adj: "Setita"
 viaset_adherent: "Setita"
 viaset_adherent_plural: "Setitas"
 viaset_desc: "La rama principal del $pod_clan$ de Set es una organización de tipo sectario, que adora a su [Glossary('Antediluvian','game_concept_antediluvian_desc')] (o dios literal) como el libertador de toda la humanidad."
 
 viaapep: "Vía de Apep"
 viaapep_adj: "Apepita"
 viaapep_adherent: "Apepita"
 viaapep_adherent_plural: "Apepitas"
 viaapep_desc: "Estas figuras ven su estado de no-muerto como un don bendito de la serpiente del caos, no como una maldición. Como resultado, se deleitan en el caos y la autogratificación. Ven a $glossary_wyrm_apep$, la Serpiente del Caos, como un avatar de Set."
 
 pathofsubversion: "Senda de la Subversión"
 pathofsubversion_adj: "Corrupción"
 pathofsubversion_adherent: "Corruptor"
 pathofsubversion_adherent_plural: "Corruptores"
 pathofsubversion_desc: "Solo a través de la corrupción de las instituciones a gran escala puede la gente ser liberada. Los corruptores son excelentes agentes en religiones organizadas y estados."
 
 pathofheliopolis: "Senda de Heliópolis"
 pathofheliopolis_adj: "Tifoniana"
 pathofheliopolis_adherent: "Teofidiano"
 pathofheliopolis_adherent_plural: "Teofidianos"
 pathofheliopolis_desc: "Una nueva Senda de Set creada a partir de las enseñanzas de los templos fundadores en El Cairo. Solo el tiempo dirá cómo le irá a esta nueva Senda en el mundo."
 
