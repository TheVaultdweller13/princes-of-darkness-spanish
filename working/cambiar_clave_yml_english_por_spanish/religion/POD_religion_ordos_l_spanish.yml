l_spanish: 
 
  #Common Road of Bones Localization
  ordos_religion: "@vampire_icon! Ordos"
  ordos_religion_adj: "Mystai"
  ordos_religion_adherent: "Mystai"
  ordos_religion_adherent_plural: "Mystai"
  ordos_religion_desc: "Los Ordos eran cultos de misterio de la Edad Oscura, cuyos miembros eran reclutados exclusivamente entre vampiros del $pod_clan$ Malkavian. Los Ordos se dedicaban a descifrar las técnicas de escudriñamiento de los antiguos Malkavian y a desbloquear el potencial dentro de su locura para superar a la Bestia. Estaban fragmentados por todo el Viejo Mundo en pequeños cultos, cada uno independiente y solo identificable a través de sus métodos."
  ordos_high_god_name: "Misterio"
  ordos_high_god_name_possessive: "del Misterio"
