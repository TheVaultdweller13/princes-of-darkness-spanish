  #Scholar-Group Faiths
  
  ordoaenigmatis: "Ordo Aenigmatis"
  ordoaenigmatis_adj: "Aenigmatis"
  ordoaenigmatis_adherent: "Mystai"
  ordoaenigmatis_adherent_plural: "Mystai"
  ordoaenigmatis_desc: "Este Ordo se ocupaba de acertijos y símbolos, desbloqueando significados ocultos, descifrando mitos y leyendas para alcanzar el verdadero conocimiento sobre el mundo, ellos mismos y la Bestia."
  
  ordosecstasis: "Ordo Ecstasis"
  ordosecstasis_adj: "Ecstasis"
  ordosecstasis_adherent: "Mystai"
  ordosecstasis_adherent_plural: "Mystai"
  ordosecstasis_desc: "Este Ordo se ocupaba de trances y frenesíes, buscando comunicarse con su Bestia para finalmente saciarla a través de extremos tanto de placer como de dolor."
  
  ordomaleficus: "Ordo Maleficus"
  ordomaleficus_adj: "Maleficus"
  ordomaleficus_adherent: "Mystai"
  ordomaleficus_adherent_plural: "Mystai"
  ordomaleficus_desc: "Pocas cosas se registran sobre este Ordo, salvo que eran infernalistas que buscaban misterios mayores con la ayuda de las Fuerzas del Más Allá."
  
  jocastian: "Jocastiano"
  jocastian_adj: "Jocastiano"
  jocastian_adherent: "Jocastiano"
  jocastian_adherent_plural: "Jocastianos"
  jocastian_desc: "Una pequeña y oscura secta (y posiblemente una línea de sangre Malkavian) que se originó dentro del Sabbat como un culto nodista, pero que desde entonces se ha independizado. Aunque la mayoría de los jocastianos son Malkavian, también hay algunos Brujah y otros Vástagos eruditos en sus filas. Se dedican a desentrañar la verdadera historia de los $pod_cainites$ y son rivales de los Mnemosyne. Aunque algunos eruditos los consideran una línea de sangre debido a la práctica de que un maestro se deje diabolizar por un estudiante para preservar el conocimiento que ha reunido, no son diferentes de su $pod_clan$ de origen."
  
  mnemosyne: "Mnemosyne"
  mnemosyne_adj: "Mnemosyne"
  mnemosyne_adherent: "Mystai"
  mnemosyne_adherent_plural: "Mystai"
  mnemosyne_desc: "Los Mnemosyne, o Buscadores de Memoria, son un culto de nodistas compuesto por eruditos Malkavian; algunos sugieren que los Mnemosyne son de hecho una línea de sangre de los Malkavian. Su miembro más prominente es Aristóteles de Laurent. Los miembros del culto buscan el conocimiento de la historia de los Vástagos, y la mayoría de ellos siguen la Senda de Caín. El culto está en conflicto con los jocastianos y, hasta hace poco, con el antiguo Ventrue Bindusara. Sus miembros practican una forma de $pod_diablerie$; cuando un antiguo cree que ha llegado su hora, permite que Vástagos más jóvenes lo diabolicen para que su conocimiento pueda ser transmitido. Esta es la razón por la que el culto a veces es llamado línea de sangre. El culto lleva el nombre de la musa griega de la memoria."
  
  ordovaticinii: "Ordo Vaticinii"
  ordovaticinii_adj: "Vaticinii"
  ordovaticinii_adherent: "Mystai"
  ordovaticinii_adherent_plural: "Mystai"
  ordovaticinii_desc: "Esta religión no canónica ha sido encargada por un mecenas.\nEste Ordo está obsesionado con las profecías de la Gehenna."
  
  holy_order_habringers: "Los Heraldos de Malkav"
  holy_order_lamia: "El Misterio de las Lamias"
  holy_order_order_of_argaeus: "La Orden de Argaeus"
  holy_order_cult_of_hecate: "El Culto de Hécate"
  holy_order_sworn_to_cecil: "Juramentados a Cecil"
  
  daughtersofthesun: "Hijas del Sol"
  daughtersofthesun_adj: "Hijas"
  daughtersofthesun_adherent: "Hija"
  daughtersofthesun_adherent_plural: "Hijas"
  daughtersofthesun_desc: "Un culto de misterio Malkavian preislámico, que adora a tres 'Diosas' $pod_cainites$. Han sido exiliadas de La Meca y obligadas a esconderse en su mayoría por los victoriosos musulmanes [Glossary('Ashirra','game_concept_ashirra_desc')]."
  
  eyesofmalakai: "Ojos de Malakai"
  eyesofmalakai_adj: "Ojos"
  eyesofmalakai_adherent: "Ojo"
  eyesofmalakai_adherent_plural: "Ojos"
  eyesofmalakai_desc: "Aparentemente adorando a la mítica hermana gemela de Malkav, este culto de cultistas locos a menudo surge de la nada, dejando solo locura y destrucción a su paso."
