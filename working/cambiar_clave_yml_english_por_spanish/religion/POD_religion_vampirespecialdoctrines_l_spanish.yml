l_spanish: 
 
  burning_faith_name: "Fe ardiente"
  burning_faith_doctrine_name: "Fe ardiente"
  burning_faith_doctrine_desc: "Siguiendo una causa justa, hay poco que los hombres y mujeres de corazones y creencias fuertes no puedan lograr."
  undead_aesir_name: "Aesir no muertos"
  undead_aesir_doctrine_name: "[Glossary('Einherjar','game_concept_einherjar_desc')] rejuvenecidos"
  undead_aesir_doctrine_desc: "Los guerreros de Canarl están hambrientos de gloria y batalla, y son temidos con razón por los débiles $pod_cainites$."
  restored_republic_name: "República restaurada"
  restored_republic_doctrine_name: "Senado en sesión"
  restored_republic_doctrine_desc: "Para ser una institución $pod_cainite$, el Senado es sorprendentemente abierto de mente. Pero no por ello menos estresante y sangriento que otros."
  senatorial_clans_name: "Amigos de la República"
  senatorial_clans_doctrine_name: "Clanes senatoriales"
  senatorial_clans_doctrine_desc: "El Senado no ha olvidado la traición de Miguel de Constantinopla o de Cartago. Sus decadentes 'Clanes' no son bienvenidos en las sagradas salas del Senado."
  vengeful_carthage_name: "Cartago vengativa"
  vengeful_carthage_doctrine_name: "Utopía despiadada"
  vengeful_carthage_doctrine_desc: "Cartago tiene generaciones de agravios que deben ser reparados. Preferiblemente con la sangre de los traidores romanos."
  broken_hope_name: "Esperanza rota"
  broken_hope_doctrine_name: "Utopía fallida"
  broken_hope_doctrine_desc: "La Nueva Cartago es solo una herramienta política sin alma. El espíritu de los verdaderos Prometeos ha sido aplastado por esta nueva derrota."
  secure_anda_name: "[Glossary('Anda','podgloss.anda')] seguro"
  secure_anda_doctrine_name: "Gestionando un imperio"
  secure_anda_doctrine_desc: "De hábiles belicistas, los [Glossary('Anda','podgloss.anda')] también se convirtieron en hábiles estadistas, utilizando la tolerancia religiosa de sus parientes mongoles como piedra angular."
  crimsom_curia_name: "Curia carmesí"
  crimsom_curia_doctrine_name: "Sede de Nod restaurada"
  crimsom_curia_doctrine_desc: "El consejo eclesiástico restaurado de la Iglesia del Tercer Caín se encarga de los asuntos cotidianos... pero también pide la expansión del dominio de la Iglesia antes de la llegada del Salvador."
  militarized_experiments_name: "Taller de los horrores"
  militarized_experiments_doctrine_name: "Experimentos militarizados"
  militarized_experiments_doctrine_desc: "Horrores retorcidos y abominaciones son ahora utilizados de forma aún más rutinaria por el $pod_clan$ Tzimisce como tropas de choque."
  warden_network_name: "Red de guardianes"
  warden_network_doctrine_name: "Ojos y oídos"
  warden_network_doctrine_desc: "La Orden de Moloch está más unificada que nunca, asegurando que cualquier guardián pueda encontrar ayuda en cualquier lugar."
  knights_acre_name: "Caballeros de Acre"
  knights_acre_doctrine_name: "Espada de Dios preparada"
  knights_acre_doctrine_desc: "Los valientes caballeros están ahora plenamente comprometidos con el propósito de la Inquisición, listos para desatar la furia santa sobre los engendros del infierno."
  oculi_dei_name: "Oculi Dei"
  oculi_dei_doctrine_name: "Ojos vigilantes"
  oculi_dei_doctrine_desc: "El Oculi Dei ha refrenado a sus miembros más paranoicos, convirtiéndolo en un activo aún más formidable contra el Mal."
  sisters_stjohn_name: "Hermanas de San Juan"
  sisters_stjohn_doctrine_name: "Cuidado divino"
  sisters_stjohn_doctrine_desc: "Las Hermanas son el corazón de la Inquisición, la mismísima roca que la sostiene a través de la oscuridad acechante."
  red_order_name: "Orden Roja"
  red_order_doctrine_name: "Guardianes cuidadosos"
  red_order_doctrine_desc: "La Orden Roja es la guardiana de los secretos de la Inquisición. Y solo liberan su conocimiento con la máxima precaución."
  von_murnau_name: "Casa von Murnau"
  von_murnau_doctrine_name: "Sabuesos de Dios"
  von_murnau_doctrine_desc: "La familia alemana está plenamente comprometida con la causa de la Inquisición, aportando sus considerables recursos."
  great_awakening_name: "Gran Despertar"
  great_awakening_doctrine_name: "Gran Despertar"
  great_awakening_doctrine_desc: "Durante mucho tiempo, los Abandonados de Calomena han luchado por transmitir la verdad que se les reveló a las masas, pero ya no luchan más. Dondequiera que predican, la gente escucha y los sigue."
  champions_gaia_name: "Campeones de Gaia"
  champions_gaia_doctrine_name: "Campeones de Gaia"
  champions_gaia_doctrine_desc: "Gaia está legítimamente orgullosa de sus más valientes defensores. Los Garou están unidos tras su estandarte, salvando finalmente al mundo del apocalipsis."
  under_wufeng_cause_name: "Bajo la causa de Wu Feng"
  under_wufeng_cause_doctrine_name: "Bajo la causa de Wu Feng"
  under_wufeng_cause_doctrine_desc: "La paz trae esperanza, la esperanza trae sanación, la sanación trae vida. En todas estas cosas, el infierno es derrotado."
  special_doctrine_is_wufeng_faith_name: "Wu Feng"
  special_doctrine_is_wufeng_faith_desc: "La paz trae esperanza, la esperanza trae sanación, la sanación trae vida. En todas estas cosas, el infierno es derrotado." 
  doctrine_parameter_hostility_override_special_doctrine_is_wufeng_faith: "Las [faiths|E] con la [doctrine|E] [GetFaithDoctrine('under_wufeng_cause_doctrine').GetBaseName] se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
  hostility_override_under_wufeng_cause_doctrine: "Las [faiths|E] que siguen a Wu Feng se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
  
  hunter_schism_mended_name: "Cisma de los cazadores reparado"
  special_doctrine_hunter_schism_mended_name: "Cisma de los cazadores reparado"
  special_doctrine_hunter_schism_mended_desc: "La Inquisición en las Sombras está ahora bajo nuestro mandato."
  doctrine_parameter_access_to_holy_arts: "Obtiene acceso a las Artes Sagradas"
  
  theurgist_ordination_name: "Ordenación de teúrgo"
  special_doctrine_theurgist_ordination_name: "Ordenación de teúrgo"
  special_doctrine_theurgist_ordination_desc: "La teúrgia es ahora una parte fundamental de lo que enseñamos a nuestros alumnos."
  doctrine_parameter_theurgist_ordination: "El discípulo obtendrá el [trait|E] [GetTrait('theurgist').GetName( GetPlayer )] al ser ordenado."
  
  sorcerer_ordination_name: "Ordenación de hechicero"
  special_doctrine_sorcerer_ordination_name: "Ordenación de hechicero"
  special_doctrine_sorcerer_ordination_desc: "La hechicería es ahora una parte fundamental de lo que enseñamos a nuestros alumnos."
  doctrine_parameter_sorcerer_ordination: "El discípulo obtendrá el [trait|E] [GetTrait('sorcerer').GetName( GetPlayer )] al ser ordenado."
 
  psychic_shunned_name: "Psíquicos rechazados"
  special_doctrine_psychic_shunned_name: "Psíquicos rechazados"
  special_doctrine_psychic_shunned_desc: "Esta facción desconfía de las personas nacidas con habilidades psíquicas. Podría ser un don de Dios... pero también una marca del Diablo."
   
  revelations_piyau_name: "Enseñanzas de Piyau Payung"
  revelations_piyau_hunger_doctrine_name: "Enseñanza del Hambre"
  revelations_piyau_hunger_doctrine_desc: "#italic \"Cuando tengas hambre, come. Si no hay comida, quítasela a alguien más débil que tú, o róbasela al fuerte pero estúpido. Si no puedes comer, entonces muere de hambre\". #!"
  revelations_piyau_sex_doctrine_name: "Enseñanza del Sexo"
  revelations_piyau_sex_doctrine_desc: "#italic \"Folla cuando estés cachondo. Si no encuentras una pareja dispuesta, toma lo que quieras o usa a la hermana mejor vestida de la toma, la seducción.\nProcrea, pues los hijos son la fuerza de sus padres y continuarán la sangre y la misión de sus padres incluso cuando estos ya no existan. Si no puedes engendrar una descendencia exitosa, entonces perece solo y sin ser recordado\". #!."
  revelations_piyau_glory_doctrine_name: "Enseñanza de la Gloria"
  revelations_piyau_glory_doctrine_desc: "#italic \"Gloríate en ti mismo y disfruta de lo que puedas, porque la miseria, la lucha y los problemas serán tus compañeros constantes en la inmortalidad. No encontrarás muchas oportunidades para disfrutar, incluso en una existencia larga como la nuestra\". #!"
