l_spanish:

####Colérico

##Vicisitud

 malleable_visage_perk_name: "Semblante maleable"
 MALLEABLE_VISAGE_PERK_EFFECT: "[character_interaction|E]: [fleshcrafting|E].\n\n#flavor El usuario puede alterar su propio cuerpo de formas cosméticas sencillas. Puede ser más alto o más robusto. Puede cambiar su voz remodelando su laringe. Puede adoptar un nuevo tono de piel, un nuevo color de ojos, y así sucesivamente.#!"
 transmogrify_the_mortal_clay_perk_name: "Transmutar la arcilla mortal"
 TRANSMOGRIFY_THE_MORTAL_CLAY_PERK_EFFECT: "Puede modificar la @flesh_icon!Carne durante la [fleshcrafting|E].\n\n#flavor Ahora el vampiro puede realizar alteraciones dramáticas en la carne, y no solo sobre sí mismo, sino sobre cualquier sujeto al que pueda someter el tiempo suficiente para impartir su visión.#!"
 rend_the_osseous_frame_perk_name: "Desgarrar la estructura ósea"
 REND_THE_OSSEOUS_FRAME_PERK_EFFECT: "Puede modificar el @bone_icon!Hueso durante la [fleshcrafting|E].\nPuede reclutar [GetMaA('szlachta').GetName] como [men_at_arms|E].\n\n#flavor En esta etapa de maestría, el vampiro puede manipular el hueso. Cuando se usa en conjunto con Transmutar la arcilla mortal, las pesadillas se hacen posibles.#!"
 awaken_the_zulo_shape_perk_name: "Despertar la forma Zulo"
 AWAKEN_THE_ZULO_SHAPE_PERK_EFFECT: "Desbloquea la opción de cambio de forma [GetModifier('POD_shapeshift_form_zulo_modifier').GetNameWithTooltip].\n\n#flavor Cuando uno considera los bosques primordiales de Transilvania, a menudo le viene a la mente el pensamiento de que están acechados por demonios. La inspiración para ello es la forma zulo. Una pesadilla de escamas y pelaje grasiento con filas de púas a lo largo del cuerpo.#!"
 the_body_impolitic_perk_name: "El cuerpo impolítico"
 THE_BODY_IMPOLITIC_PERK_EFFECT: "#flavor El usuario puede investir una parte de su conciencia en su propia carne, y luego cercenarla para que cumpla sus órdenes.#!"
 bloodform_perk_name: "Forma de sangre"
 BLOODFORM_PERK_EFFECT: "Desbloquea la opción de cambio de forma [GetModifier('POD_shapeshift_form_blood_modifier').GetNameWithTooltip].\n\n#flavor Un vampiro con este poder puede transformar físicamente su cuerpo en vitae consciente. Esta sangre es en todos los aspectos idéntica a la vitae normal de un vampiro, puede usarse para crear ghouls o establecer vínculos de sangre.#!"
 inner_mastery_perk_name: "Maestría interna"
 INNER_MASTERY_PERK_EFFECT: "#flavor Este poder permite al vampiro controlar sus órganos y fluidos. Los órganos pueden ser remodelados fácilmente y los fluidos hostiles son expulsados del cuerpo.#!"
 vicissitudeadvanced_perk_name: "Vicisitud avanzada"
 body_arsenal_perk_name: "Arsenal corporal"
 BODY_ARSENAL_PERK_EFFECT: "$unlock_forging_node$ Añade aleatoriamente [GetModifier('body_arsenal_prowess_modifier').GetNameWithTooltip] o [GetModifier('body_arsenal_ghoul_modifier').GetNameWithTooltip].\n\n#flavor El vampiro puede usar su propio cuerpo para crear armas. Esto va más allá de manifestar garras y similares, puede crear espadas, mazas y la mayoría de las demás armas de cuerpo a cuerpo.#!"
 graft_life_to_life_perk_name: "Injertar vida a la vida"
 GRAFT_LIFE_TO_LIFE_PERK_EFFECT: "Puede reclutar [GetMaA('vozhd').GetName] como [men_at_arms|E].\n\n#flavor El escultor de carne es capaz de tomar partes del cuerpo de criaturas vivas e injertarlas en otras, vivas o no muertas, y permitir que el receptor use el nuevo miembro. Con este poder se pueden crear criaturas excepcionalmente monstruosas e inquietantes.#!"
 sublimation_of_the_larval_flesh_perk_name: "Sublimación de la carne larvaria"
 SUBLIMATION_OF_THE_LARVAL_FLESH_PERK_EFFECT: "#flavor El vampiro encierra a su víctima en un capullo de su propia carne. El vampiro imagina entonces una nueva forma para su víctima, en la que se convertirá una vez que sea liberada.#!"
 ##TODO Tzimisce: Unlock the #V Odious Chalice#! transmogrification option.\n\n

 the_last_dracul_perk_name: "El último Dracul"
 THE_LAST_DRACUL_PERK_EFFECT: "Desbloquea la opción de cambio de forma [GetModifier('POD_shapeshift_form_dracul_modifier').GetNameWithTooltip].\n\n#flavor La más temible de las formas monstruosas de los Tzimisce, este poder permite a los Dragones asumir la forma de la que deriva su antiguo apodo.#!"
 living_testudo_perk_name: "Testudo viviente"
 LIVING_TESTUDO_PERK_EFFECT: "Al comienzo de la batalla, elimina al [knight|E] enemigo con mayor [prowess|E] de la batalla e inflígele #V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0] de [POD_aggravated_damage|E]#! cuando actúes como [commander|E].\n\n#flavor El vampiro agarra a una víctima y con artes de esculpido de carne y hueso expone la espalda de la víctima de tal manera que sus vértebras quedan al descubierto. La víctima se usa entonces como un escudo que protege contra los ataques y puede ser manipulada posteriormente en armas horribles.#!"
 liquefy_the_mortal_coil_perk_name: "Licuar la espiral mortal"
 LIQUEFY_THE_MORTAL_COIL_PERK_EFFECT: "[character_interaction|E]: Cercena una parte del cuerpo de un personaje, no podrá curarse durante 10 años.\n\n#flavor Las víctimas de este espantoso poder son traicionadas por sus propios cuerpos, mientras el Tzimisce transforma la carne y los huesos de su oponente en charcos de sangre.#!"
 perfect_essence_perk_name: "Esencia perfecta"
 PERFECT_ESSENCE_PERK_EFFECT: "Realizar [fleshcrafting|E] sobre ti mismo siempre tendrá éxito\nAumenta el [hunger_with_icon|E] saciado de los mortales\nLa interacción $POD_blood_surge_interaction$#! aumenta una [skill|E] en un #P +1#! adicional\n\n#flavor Un Tzimisce con este poder tiene un control casi perfecto sobre su sangre y su cuerpo. Puede alterar perfectamente su propia forma a voluntad con apenas un pensamiento.#!"
 sculpture_of_the_mind_perk_name: "Escultura de la mente"
 SCULPTURE_OF_THE_MIND_PERK_EFFECT: "Ahora puede realizar [fleshcraft|E] sobre cualquiera que no tenga defensas mentales fuertes\n\n#flavor A este nivel, el vampiro es capaz de alterar la carne a distancia. El contacto físico es la herramienta de un artista menor, el verdadero arte proviene de la mente de un Tzimisce, no de sus manos.#!"



