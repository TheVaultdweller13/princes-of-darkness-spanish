 EARTH_SENSE_PERK_EFFECT: "#F El Garou puede sentir el \"aura\" de una zona y determinar si está sana o marchita.#!"
 HERB_CALL_PERK_EFFECT: "#F Mediante cantos o salmodias, un Garou puede encontrar plantas, raíces o cortezas útiles o medicinales incluso en zonas pobres como los desiertos.#!"
 OAKSONG_PERK_EFFECT: "#F Al usar este Don, un Garou puede comunicarse con objetos inanimados hechos de madera o alguna otra sustancia orgánica.#!"
 LORE_OF_THE_LAND_PERK_EFFECT: "#F Al comer, fumar o ingerir de otro modo una porción de la tierra, el Garou puede sentir cosas que sucedieron en las inmediaciones en el pasado.#!"
 EARTH_HEAL_PERK_EFFECT: "#F Este Don permite al Garou ayudar a un trozo de tierra a recuperarse de la marchitez, la mácula del $glossary_wyrm$, el envenenamiento o algún otro tipo de perturbación ambiental.#!"
 LAMBENT_SIGHT_PERK_EFFECT: "#F Este Don otorga al Garou la capacidad de ver en circunstancias donde la visión sería normalmente imposible, como en condiciones de oscuridad total o si el Garou tiene los ojos vendados.#!"
 MOONPOOL_OF_SOKHTA_PERK_EFFECT: "Recibirás una notificación si alguien pretende asesinar a tus amigos o familiares.\nRecibirás una notificación si alguien pretende seducir a tus amantes o consortes.\nTu prisionero tiene menos probabilidades de escapar de tu prisión.\n#F Este Don permite a un Garou transformar agua clara y estancada en un pozo que ofrece visiones de posibles futuros.#!"
 MOONRIVER_PERK_EFFECT: "#F Al usar este Don, el Garou puede viajar rápidamente por la superficie de una masa de agua que refleje la luz de la luna.#!"
 MOONCAT_PERK_EFFECT: "Desbloquea la opción de cambio de forma [GetModifier( 'POD_shapeshift_form_mooncat_modifier' ).GetNameWithTooltip|L].\n#F Este Don permite al Garou asumir la forma de un pequeño gato blanco. Esta habilidad puede resultar útil para entrar en lugares pequeños (o escapar de ellos) y permanecer oculto.#!"
 MOONDREAM_PERK_EFFECT: "#F El Garou pide a Sokhta que le conceda un sueño profético antes de quedarse dormido bajo la luz de la luna.#!"
 FIND_THE_HEARTS_FLAME_PERK_EFFECT: "#F Con este Don, el Garou puede identificar fuentes de energía o poder, incluso cuando están ocultas o no le son familiares.#!"
 FLAME_OF_THE_WIND_RIDER_PERK_EFFECT: "#F Este Don hace que el Garou sea más difícil de dañar al envolverlo en una llama fantasmal de color blanco azulado.#!"
 RIDE_THE_SOLAR_WINDS_PERK_EFFECT: "#F Este Don permite al Garou cabalgar los vientos solares que barren el [UmbraGlossary('aetherial_realm')] sin preocuparse por ser desviado de su curso por las tormentas.#!"
 HAND_OF_THE_SUN_PERK_EFFECT: "#F La mano del Garou arde con un calor terrible y emite una luz blanca incandescente, similar a un hierro de marcar.#!"
 CLEANSING_FLAME_PERK_EFFECT: "#F El Garou puede señalar una zona (o un individuo) y prenderle fuego con una llama intensa y purificadora. El fuego puede quemar toda la mácula del $glossary_wyrm$ o la contaminación humana de una zona o limpiar a un individuo (siempre que la víctima sobreviva) de la mácula del Wyrm.#!"
 SPEED_OF_THE_MESSENGER_PERK_EFFECT: "#F Este Don aumenta la velocidad de movimiento del Garou para que pueda recorrer largas distancias en cortos periodos de tiempo.#!"
 PLANETARYGIFTS_STICKY_FINGERS_PERK_EFFECT: "#F Este truco recubre los dedos de un Garou con una sustancia plateada que se adhiere a cualquier cosa, permitiendo trepar por superficies verticales con facilidad.#!"
 PLANETARYGIFTS_DELIBERATE_MISINFORMATION_PERK_EFFECT: "#F El Garou puede introducir información confusa y contradictoria en la conversación de su objetivo, haciendo que sus planes se desmoronen o provocando que sufra un grave colapso en las comunicaciones.#!"
 MERCURIAL_MESSENGER_PERK_EFFECT: "#F Este Don permite a un Garou que oye una conversación o a quien se le confía un mensaje recordar lo que ha oído.#!"
 MADTHOUGHT_PERK_EFFECT: "#F El Garou puede hacer que los procesos de pensamiento de sus enemigos se aceleren tan radicalmente que literalmente piensen demasiado rápido para poner en marcha cualquier plan.#!"
 UNCLOAK_THE_HIDDEN_PERK_EFFECT: "#F Al concentrarse en una persona, objeto o zona, el Garou puede determinar si su objetivo oculta algo o no.#!"
 SHADOW_OF_THE_EBON_WHISPERER_PERK_EFFECT: "#F Este Don hace al Garou tan insustancial como una sombra y tan difícil de ver.#!"
 HIDDEN_HEART_PERK_EFFECT: "#F Este Don permite al Garou tomar un conocimiento peligroso que posea y encerrarlo en su mente para que sea inaccesible sin una llave.#!"
 WHISPER_IN_THE_DARK_PERK_EFFECT: "Velocidad de progreso de [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F Este Don permite al Garou determinar un hecho perjudicial para un individuo.#!"
 WHISPER_IN_THE_DARK_PERK_BONUS_VALUE: "[GetPerk('whisper_in_the_dark_perk').GetName(GetPlayer)]"
 PLANETARYGIFTS_EBON_BINDING_PERK_EFFECT: "Velocidad de progreso de [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\nComo [character_interaction|E], permite otorgar el modificador [GetModifier('ebon_binding_modifier').GetNameWithTooltip] a un objetivo que tenga [secrets|E] conocidos por ti.\n#F Este Don permite al Garou tomar su conocimiento de la falta, práctica o vicio secreto de alguien y vincular un castigo adecuado a esa persona.#!"
 PLANETARYGIFTS_EBON_BINDING_PERK_BONUS_VALUE: "[GetPerk('planetarygifts_ebon_binding_perk').GetName(GetPlayer)]"
 FIND_THE_CHILD_WITHIN_PERK_EFFECT: "#F Con este Don, un Garou puede jugar con la respuesta instintiva de un individuo a la autoridad o el afecto parental y convencer a esa persona de que siga una orden o responda favorablemente a una sugerencia que de otro modo podría rechazar.#!"
 MANTLE_OF_THE_LAND_PERK_EFFECT: "#F El Garou extrae una bruma o niebla del agua de la atmósfera.#!"
 VEIL_OF_THE_MOTHER_PERK_EFFECT: "#F Este Don permite al Garou asumir una apariencia diferente durante un corto periodo de tiempo para confundir a los perseguidores o escapar de la detección.#!"
 MOTHERLY_GUARDIAN_PERK_EFFECT: "#F Este Don permite al Garou \"marcar\" a un individuo para poder seguir la salud y el bienestar de su objetivo.#!"
 BRING_FORTH_THE_FUTURE_PERK_EFFECT: "#F Este Don permite al Garou pedir a Tambiyah que cambie una faceta del futuro del individuo.#!"
 PLANETARYGIFTS_BATTLESENSE_PERK_EFFECT: "#F El Garou puede sentir la mejor dirección desde la que realizar un ataque, teniendo en cuenta el terreno del campo de batalla, el número y la colocación del enemigo y las fuerzas disponibles bajo el mando del Garou o aliadas con él.#!"
 SHARDS_OF_ICY_RAGE_PERK_EFFECT: "#F El Garou que invoca este Don recurre al gélido poder de su Rabia, convirtiendo su ira en hielo físico.#!"
 NERIGALS_CALL_TO_ARMS_PERK_EFFECT: "#F Este Don permite al Garou convocar a su lado a cualquier criatura o espíritu aliado de Nerigal o apropiado para el Guerrero de Hielo.#!"
 CHALLENGE_OF_SINGLE_COMBAT_PERK_EFFECT: "Permite usar la [character_interaction|E] de desafiar a un rival a luchar incluso en guerra.\n#F Al invocar el nombre del Guerrero de Hielo y lanzar un desafío directo a un enemigo, el Garou puede obligar a su oponente a luchar uno contra uno según las reglas tácitas del juego limpio.#!"
 HEART_OF_THE_ICE_WARRIOR_PERK_EFFECT: "#F Usado normalmente solo en las circunstancias más extremas, este Don hace al Garou impermeable al daño el tiempo suficiente para asestar un golpe final a su oponente.#!"
 ROUSE_TO_ANGER_PERK_EFFECT: "#F Este Don permite al Garou decir o hacer algo que haga que su objetivo recupere su Rabia interior.#!"
 FOETRACKER_PERK_EFFECT: "#F Al usar este Don, el Garou puede seguir a su presa sin riesgo de perder el rastro.#!"
 SAVAGERY_OF_THE_TALONED_HUNTER_PERK_EFFECT: "Como [character_interaction|E], permite gastar un punto de $POD_energy_gnosis$ y fuerza de voluntad para ganar dos de $POD_energy_gnosis$.\n#F Este Don permite a un Garou obtener el doble de ventaja de su Rabia, aumentando así la ferocidad y frecuencia de los ataques o permitiéndole lograr más bajo estrés de lo que normalmente lograría.#!"
 HUNTERS_HORN_PERK_EFFECT: "#F Este Don permite al Garou crear un sonido tan horrible y escalofriante que sume a los enemigos en un pánico absoluto y les hace huir de una zona sin importar la dirección o el destino.#!"
 PACK_MIND_PERK_EFFECT: "Otorga el [modifier|E] [GetModifier('pack_mind_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante los [single_combat_duel_plural|E].\n#F Este Don obliga a un grupo de enemigos a comportarse como una manada con un solo propósito.#!"
 AURA_OF_LEADERSHIP_PERK_EFFECT: "#F Este Don rodea al Garou con un aura de autoridad que le permite asumir el manto del liderazgo durante un breve periodo de tiempo.#!"
 PROCLAMATION_OF_ACTION_PERK_EFFECT: "#F Este Don permite al Garou forzar el fin de una discusión y tomar el curso de acción que el personaje considere mejor.#!"
 PLANETARYGIFTS_UNDISPUTED_RULER_PERK_EFFECT: "#F Este Don permite a un Garou asumir el liderazgo de una pequeña reunión de humanos o un grupo de espíritus.#!"
 ENTHRONEMENT_PERK_EFFECT: "#F El Garou puede crear objetos pequeños o sencillos de la nada, incluyendo bruma, nubes o viento.#!"
 GRAND_GESTURE_PERK_EFFECT: "#F Al otorgar regalos apropiados a un individuo o grupo, el Garou aumenta su estima y reputación a los ojos de los receptores de su generosidad.#!"
 SENSE_LIMITS_PERK_EFFECT: "#F El Garou puede determinar aproximadamente la cantidad de Rabia, Gnosis o Fuerza de Voluntad de un individuo.#!"
 PEACE_OF_THE_COUNSELOR_PERK_EFFECT: "Desbloquea la [interaction|E] $purchase_truce_interaction$.\n#F Este Don permite a un Garou llevar incluso la discusión más acalorada a una conclusión pacífica.#!"
 PALL_OF_DESPAIR_PERK_EFFECT: "Cuando comienza una guerra, el campeón con mayor proeza de tu enemigo resultará herido.\n#F Este Don inflige una oleada de desesperación sobre un individuo seleccionado, haciendo que la víctima sea incapaz de actuar debido a sentimientos de profunda melancolía.#!"
 HARMONIOUS_SLUMBER_PERK_EFFECT: "#F Este Don permite al Garou crear un entorno perfecto para dormir incluso en las circunstancias más difíciles.#!"
 BURDEN_OF_KNOWLEDGE_PERK_EFFECT: "Como [character_interaction|E], permite hacer que la víctima gane [GetModifier('murderous_frenzy_modifier').GetNameWithTooltip], [GetModifier('change_for_better_modifier').GetNameWithTooltip] o se suicide.\n#F El Garou inunda a un individuo con el conocimiento de todas sus propias limitaciones, haciendo que la víctima sea consciente de cada defecto o fallo y recordándole todos los males que ha cometido o causado.#!"
 FIND_THE_PORTENT_PERK_EFFECT: "#F Con este Don, un Garou puede pedir y recibir algún presagio o portento que pueda ayudarle a determinar su próximo curso de acción.#!"
 HIDDEN_DEPTHS_PERK_EFFECT: "#F Este Don permite a un Garou descubrir alguna información oculta, o descifrar algún pasaje críptico de un texto.#!"
 UNRAVEL_PERK_EFFECT: "#F Este Don permite al Garou reunir fragmentos de información aparentemente aleatorios para formar un análisis tentativo de una situación y formular un curso de acción.#!"
 BLANK_SLATE_PERK_EFFECT: "#F El Garou puede eliminar por completo una sola pieza de información de su propia mente o de la de otro.#!"
 DIPLOMATIC_IMMUNITY_PERK_EFFECT: "#F Este Don permite al Garou caminar en medio de un grupo hostil sin provocar el estallido de hostilidades.#!"
 THREADS_OF_THE_TAPESTRY_PERK_EFFECT: "#F Este Don permite al Garou determinar los elementos básicos de una situación que parece confusa o deliberadamente ofuscada.#!"
 FIXIT_PERK_EFFECT: "#F El Garou puede averiguar qué le pasa a un dispositivo y realizar reparaciones en el acto que permitan que el objeto funcione durante un corto periodo de tiempo.#!"
 TANGLING_THE_SKEIN_PERK_EFFECT: "#F Este Don permite al Garou causar confusión entre sus enemigos mezclando sus percepciones para que no puedan decidir a quién seguir o qué hacer a continuación.#!"
 SHANTARS_LOOM_PERK_EFFECT: "Puede reclutar [GetMaA('golems').GetName] como [men_at_arms|E].\n#F El uso de este Don permite al Garou fabricar algún objeto a partir de la energía proporcionada por la Gnosis, la Rabia o la Fuerza de Voluntad.#!"
 DROWN_PERK_EFFECT: "#F Este Don hace que los pulmones de un oponente se llenen de líquido. La víctima debe recibir asistencia médica o mágica inmediata o morirá en pocos minutos.#!"
 SENSE_OF_THE_TRANSFORMATION_PERK_EFFECT: "Si alguno de tus familiares o amigos es asesinado en circunstancias misteriosas, conocerás a su asesino.\n#F Con este Don, el Garou puede identificar estados de transformación o cambios significativos dentro de criaturas u objetos.#!"
 SHORTEN_THE_ROAD_PERK_EFFECT: "#F Este Don permite al Garou reducir el tiempo normal de viaje en un tercio, incluso en la [umbra|E].#!"
 WYLD_SPIRITS_PERK_EFFECT: "Otorga el [modifier|E] [GetModifier('erratic_behavior_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante los [single_combat_duel_plural|E].\n#F El Garou puede invocar la naturaleza errática de Meros e infligir a uno o más de sus oponentes un ataque de comportamiento errático, dificultando así que las víctimas coordinen ataques o actúen con sensatez en cualquier situación dada.#!"
 SLEEPS_TRAVELS_PERK_EFFECT: "#F A través de este Don, el espíritu de un Garou puede viajar a otro lugar mientras su cuerpo duerme.#!"
 ESSENTIAL_TRANSFORMATION_PERK_EFFECT: "Como [character_interaction|E], permite aumentar las heridas para ganar $POD_energy_gnosis$.\n#F Este Don permite al Garou convertir parte de su esencia en Gnosis para su uso en situaciones que requieran el gasto de grandes cantidades de poder espiritual.#!"
