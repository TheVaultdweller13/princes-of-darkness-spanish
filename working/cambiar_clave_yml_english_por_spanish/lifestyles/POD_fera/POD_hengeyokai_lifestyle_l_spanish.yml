l_spanish:
 
 hengeyokaigifts_lifestyle_name: "Hengeyokai"
 hengeyokaigifts_lifestyle_desc: "Céntrate en los poderes que provienen de las Cortes de las Bestias."
 hengeyokaigifts_lifestyle_highlight_desc: "Debido a tu [GetModifier('POD_gnosis_5_modifier').GetNameWithTooltip], ganas un #P [GetPlayer.Custom('GetEducationLifestylePercentageBoost')]#! más de [experience|E] en este estilo de vida."
 monthly_hengeyokaigifts_lifestyle_xp_gain_mult: "[experience|E] mensual de [lifestyle|E] de Dones Hengeyokai"
 hengeyokaigifts_focus: "Enfoque en Dones Hengeyokai"
 hengeyokaigifts_focus_modifier: "[GetFocus('hengeyokaigifts_focus').GetName]"
 hengeyokaigifts_focus_desc: "Fuerza en la unidad."
 hengeyokaigifts_focus_effect_desc: "Centrarse en los Dones Hengeyokai otorga:"
 hengeyokaigifts_court_visible: "Dones de la Corte"


 mindspeak_perk_name: "Habla mental"
 MINDSPEAK_PERK_EFFECT: "Puede aprender #V 2#! [languages|E] adicionales sin penalizaciones.\n#flavor Este Don se comparte comúnmente entre los recién llegados a las Cortes como la forma más básica de comunicación universal.#!"
 create_element_perk_name: "Crear elemento"
 CREATE_ELEMENT_PERK_EFFECT: "#flavor Los Hengeyokai en sintonía con los elementos apropiados pueden convocar la \"luna\" como un elemento; esto se manifiesta como luz de luna pura, proporcionando iluminación y a menudo cierta medida de consuelo.#!"
 courtly_speech_perk_name: "Habla cortesana"
 COURTLY_SPEECH_PERK_EFFECT: "#flavor Cuando actúan como enviados, los hengeyokai consideran de buena educación hablar en la lengua del anfitrión. Este Don permite a un hengeyokai hablar cualquiera de las lenguas de las Razas Cambiantes como si fuera un nativo.#!"
 blaze_talons_perk_name: "Garras ardientes"
 BLAZE_TALONS_PERK_EFFECT: "#flavor Una de las artes de guerra de los hengeyokai, este Don permite al cambiapieles prender fuego a sus manos, patas o alas, otorgando a sus golpes la ferocidad de un incendio forestal.#!"
 sense_imbalance_perk_name: "Sentir desequilibrio"
 SENSE_IMBALANCE_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\nTu [court_chaplain|E] es un #P 25%#! más rápido en la [councillor_task|E] de [convert_county|E].\n#flavor Este Don permite al hengeyokai centrar sus percepciones en el equilibrio entre los Tres, discerniendo cualquier desequilibrio local de energías, ya sean las de la $glossary_triat$, o las de Yin, Yang y Yomi.#!"
 waking_dream_of_unity_perk_name: "Sueño despierto de unidad"
 WAKING_DREAM_OF_UNITY_PERK_EFFECT: "#flavor Este don pone a un grupo de Hengeyokai en comunicación silenciosa enviando sueños despiertos a sus mentes. Se utiliza para comunicarse con toda la corte a la vez.#!"
 part_the_wall_perk_name: "Partir el muro"
 PART_THE_WALL_PERK_EFFECT: "#flavor Este Don se comparte entre los hengeyokai que normalmente no pueden caminar de lado. Les permite caminar hacia las Tierras del Espejo tan fácilmente como lo hacen sus primos más afortunados.#!"
 exorcism_perk_name: "Exorcismo"
 EXORCISM_PERK_EFFECT: "Puede [POD_banish|E] a $POD_splat_wraith_plural$ a sus reinos nativos de la [umbra|E].\nYa no puedes ser poseído por $POD_splat_wraith_plural$.\n#flavor Los Reyes Yama envían frecuentemente a sus esbirros espirituales para plagar las cortes hengeyokai; como resultado, el conocimiento para desterrar espíritus malignos se comparte libremente entre los hijos-bestia.#!"
 walking_the_bone_road_perk_name: "Caminar por la senda de los huesos"
 WALKING_THE_BONE_ROAD_PERK_EFFECT: "#flavor La Hengeyokai puede caminar de lado hacia el Mundo Yin tan fácilmente como lo hace normalmente hacia el Mundo Yang.#!"
 way_of_ten_thousand_cities_perk_name: "Senda de las diez mil ciudades"
 WAY_OF_TEN_THOUSAND_CITIES_PERK_EFFECT: "Reduce el coste base de establecer nuevas [culture_traditions|E] en un #P 25%#!.\n#flavor El hengeyokai puede mezclarse suavemente con cualquier cultura, sin importar cuán peculiar o desconocida sea.#!"
