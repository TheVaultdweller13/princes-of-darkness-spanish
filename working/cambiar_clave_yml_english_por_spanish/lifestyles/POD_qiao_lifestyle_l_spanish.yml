l_spanish:
  
  GAINS_QIAO_LIFESTYLE_XP: "Gana $VALUE|V0$ de experiencia de [qiao_lifestyle|E]"
  GAINED_QIAO_LIFESTYLE_XP: "Ganó $VALUE|V0$ de experiencia de [qiao_lifestyle|E]"
  I_GAIN_QIAO_LIFESTYLE_XP: "Ganas $VALUE|V0$ de experiencia de [qiao_lifestyle|E]"
  I_GAINED_QIAO_LIFESTYLE_XP: "Ganaste $VALUE|V0$ de experiencia de [qiao_lifestyle|E]"
  TARGET_GAINS_QIAO_LIFESTYLE_XP: "[CHARACTER.GetShortUIName] gana $VALUE|V0$ de experiencia de [qiao_lifestyle|E]"
  TARGET_GAINED_QIAO_LIFESTYLE_XP: "[CHARACTER.GetShortUIName] ganó $VALUE|V0$ de experiencia de [qiao_lifestyle|E]"
 
  GAINS_A_QIAO_LIFESTYLE_PERKPOINT: "Gana $VALUE|V0$ desbloqueo de [perk|E] de [qiao_lifestyle|E]"
  GAINED_A_QIAO_LIFESTYLE_PERKPOINT: "Ganó $VALUE|V0$ desbloqueo de [perk|E] de [qiao_lifestyle|E]"
  I_GAIN_A_QIAO_LIFESTYLE_PERKPOINT: "Ganas $VALUE|V0$ desbloqueo de [perk|E] de [qiao_lifestyle|E]"
  I_GAINED_A_QIAO_LIFESTYLE_PERKPOINT: "Ganaste $VALUE|V0$ desbloqueo de [perk|E] de [qiao_lifestyle|E]"
  TARGET_GAINS_A_QIAO_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName] gana $VALUE|V0$ desbloqueo de [perk|E] de [qiao_lifestyle|E]"
  TARGET_GAINED_A_QIAO_LIFESTYLE_PERKPOINT: "[CHARACTER.GetShortUIName] ganó $VALUE|V0$ desbloqueo de [perk|E] de [qiao_lifestyle|E]"
  
  QIAO_LIFESTYLE_PERK_POINTS_TRIGGER: "Puntos de ventaja de estilo de vida Qiao: $NUM|V0$"
 
  POD_qiao_elder_penalty_effect: "#X Los poderes avanzados de Qiao son demasiado poderosos para que los mortales los usen de forma segura.#!"
  
  # Qiao #
 
  CELESTIAL_PUNISHMENT_PERK_EFFECT: "Inflige a cada gobernante del bando opuesto [GetModifier('celestial_punishment_modifier').GetNameWithTooltip] al comenzar una [war|E] como atacante o defensor principal.\n#flavor Estas oraciones sirven como advertencia para los shen. Cuando golpean a su objetivo, se prenden fuego, sin causar daño físico pero quemando el P'o del objetivo. Estas oraciones de papel son tan efectivas como los cuchillos arrojadizos y resisten incluso los vientos naturales más fuertes mientras se dirigen a su objetivo.#!"
  DIVINE_BINDINGS_PERK_EFFECT: "Mejora el [modifier|E] de [GetPerk('celestial_punishment_perk').GetName(GetPlayer)] a [GetModifier('divine_bindings_modifier').GetNameWithTooltip].\n#flavor Cuando se lanzan hacia un objetivo shen, estas inocuas hojas de papel se mueven contra el viento e incluso sortean obstáculos para golpear. Una vez que las oraciones golpean al objetivo, brillan con una inquietante energía verde y se expanden, volviéndose más gruesas y largas mientras se envuelven alrededor del shen.#!"
  HEAVENLY_FLAMES_PERK_EFFECT: "Mejora el [modifier|E] de [GetPerk('celestial_punishment_perk').GetName(GetPlayer)] a [GetModifier('heavenly_flames_modifier').GetNameWithTooltip].\n#flavor Cuando esta oración golpea a un shen objetivo, estalla inmediatamente en llamas de color azul brillante que causan daño agravado. Al igual que con las Ataduras Divinas, la oración se mueve alrededor de los obstáculos para alcanzar a su objetivo.#!"
  CELESTIAL_FIRES_PERK_EFFECT: "Mejora el [modifier|E] de [GetPerk('celestial_punishment_perk').GetName(GetPlayer)] a [GetModifier('celestial_fires_modifier').GetNameWithTooltip].\n#flavor Fuegos Celestiales es idéntico a Llamas Celestiales, con una excepción: el daño no puede absorberse sin defensas especiales.#!"
  HEAVENS_THUNDER_PERK_EFFECT: "Mejora el [modifier|E] de [GetPerk('celestial_punishment_perk').GetName(GetPlayer)] a [GetModifier('heavens_thunder_modifier').GetNameWithTooltip].\n#flavor Esta, la más poderosa de las oraciones del [GetTrait('shih').GetName( GetNullCharacter )], es virtualmente imparable una vez lanzada. A medida que las oraciones dejan la mano del [GetTrait('shih').GetName( GetNullCharacter )], brillan intensamente y se mueven con la velocidad del rayo hacia su destino. Cuando golpean al shen, explotan en bolas de furia eléctrica capaces de herir gravemente a casi cualquier demonio.#!"
  HEAVENS_JUDGMENT_PERK_EFFECT: "Mejora el [modifier|E] de [GetPerk('celestial_punishment_perk').GetName(GetPlayer)] a [GetModifier('heavens_judgment_modifier').GetNameWithTooltip].\n#flavor Las oraciones preparadas por este Qiao literalmente queman el Chi del cuerpo del shen, devolviendo esa fuerza vital robada al entorno para animarlo.#!"
  DIVINE_PROHIBITION_PERK_EFFECT: "Mejora el [modifier|E] de [GetPerk('celestial_punishment_perk').GetName(GetPlayer)] a [GetModifier('divine_prohibition_modifier').GetNameWithTooltip].\n#flavor Esta técnica de I Shen, la más poderosa de todas, desconecta al objetivo de las fuentes externas de Chi.#!"
  
  STEEL_SKIN_PERK_EFFECT: "#flavor Aumentas tu Resistencia mediante el uso de este poder.#!"
  DRAGONS_SPEED_PERK_EFFECT: "#flavor Aumentas tu Destreza mediante el uso de este poder.#!"
  TIGERS_STRENGTH_PERK_EFFECT: "#flavor Usas esta habilidad para aumentar tu Fuerza en preparación para el combate.#!"
  CELESTIAL_EYES_PERK_EFFECT: "#flavor Aumentas tu Percepción usando este nivel del Mo Kung Qiao.#!"
  BODY_OF_THE_DRAGON_PERK_EFFECT: "#flavor Aumentas todos tus Atributos a niveles sobrehumanos.#!"
  TEN_OX_STRENGTH_PERK_EFFECT: "#flavor El [GetTrait('shih').GetName( GetNullCharacter )] es capaz de realizar hazañas momentáneas de fuerza sobrehumana.#!"
  DIAMOND_BODY_PERK_EFFECT: "#flavor Un [GetTrait('shih').GetName( GetNullCharacter )] que usa este don manifiesta una tremenda capacidad para ignorar el daño.#!"
 
  OPENED_EYES_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$ \n Ya no sufrirás el #TOOLTIP:STATIC_MODIFIER,POD_delirium_modifier #N;L Delirio#!#! al luchar contra $glossary_fera$ durante guerras o [single_combat_duel_plural|E].\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] puede ver a los shen por lo que son. El [GetTrait('shih').GetName( GetNullCharacter )] también puede ignorar los efectos del Delirio.#!"
  DIVINE_PERCEPTIONS_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$ \n #flavor Este poder permite al [GetTrait('shih').GetName( GetNullCharacter )] ver el espíritu de otro ser. Funciona como un detector de mentiras en su mayor parte, pero el [GetTrait('shih').GetName( GetNullCharacter )] también puede ver cuando un mortal u otra entidad está poseída por un demonio.#!"
  WIND_TALK_PERK_EFFECT: "$POD_can_summon_on_death_trigger_loca$\n$POD_can_summon_wraith_trigger_loca$\nDesbloquea la [decision|E] $seek_aid_of_the_spirits_decision$.\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] que emplea esta habilidad puede escuchar a los habitantes de los reinos espirituales y comunicarse con ellos. Los shen no están, sin embargo, obligados a responder a ninguna pregunta o demanda que el [GetTrait('shih').GetName( GetNullCharacter )] pueda hacer.#!"
  CELESTIAL_WINDOW_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] que emplea esta habilidad interactúa en todos los niveles con un habitante del Reino Yin o Yang. A todos los efectos, el espíritu elegido está en el mismo nivel de existencia que el [GetTrait('shih').GetName( GetNullCharacter )]. Ese espíritu puede ser tocado, herido, ayudado o enfrentado en combate como si tanto el [GetTrait('shih').GetName( GetNullCharacter )] como el espíritu estuvieran en el mismo lugar.#!"
  CELESTIAL_DOORWAY_PERK_EFFECT: "Te permite interactuar con seres de la [umbra|E] cuando estás en el mundo material.\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] puede interactuar activamente con los [spirit_worlds|E]; sin embargo, este curso de acción no es necesariamente el más sabio. Mientras el personaje permanece realmente en el Reino Medio, puede ver y afectar a los mundos Yin y [Glossary('Yang Worlds','game_concept_yang_world_desc')] que lo rodean. Aunque los habitantes de esos reinos pueden devolver el favor, y muchos de ellos no son afectos al [GetTrait('shih').GetName( GetNullCharacter )].#!"
  SIGHT_WITHOUT_EYES_PERK_EFFECT: "$countermeasures_unlocks_t3_all_seeing_eye$ \n #flavor Usando esta técnica, un [GetTrait('shih').GetName( GetNullCharacter )] puede ver y detectar sin el uso de los sentidos físicos, percibiendo solo con el espíritu.#!"
  THE_EYE_OF_HEAVEN_PERK_EFFECT: "$countermeasures_unlocks_t4_all_seeing_eye$ \n #flavor Un [GetTrait('shih').GetName( GetNullCharacter )] con este nivel de maestría puede ver con el Ojo del Cielo, percibiendo cualquier lugar.#!"
  
  BARRIER_OF_PAIN_PERK_EFFECT: "#flavor El [GetTrait('shih').GetName( GetNullCharacter )] puede obligarse a sí mismo a ignorar el dolor en este nivel.#!"
  THE_CLOSING_WOUND_PERK_EFFECT: "Como [character_interaction|E], cura cualquier nivel del [trait|E] [GetTrait('wounded_1').GetName(GetPlayer)].\n#flavor A este nivel, el [GetTrait('shih').GetName( GetNullCharacter )] es capaz de curar heridas. La carne magullada pierde su sensibilidad; las heridas se cierran y dejan cicatrices frescas.#!"
  SPIRITUAL_HEALING_PERK_EFFECT: "Mejora [GetPerk('the_closing_wound_perk').GetName(GetPlayer)] permitiéndole curar cualquier enfermedad no sobrenatural.\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] puede volver a unir huesos y reconstruir tejido nervioso con esta habilidad. Este proceso es doloroso y a menudo arriesgado si se usa en una situación de combate. Los huesos deben colocarse correctamente o el [GetTrait('shih').GetName( GetNullCharacter )] corre el riesgo de quedar lisiado permanentemente.#!"
  ESCAPE_FROM_DEATH_PERK_EFFECT: "Mejora [GetPerk('the_closing_wound_perk').GetName(GetPlayer)] permitiéndole curar [GetTrait('maimed').GetName(GetPlayer)] y otros problemas de salud permanentes.\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] que usa esta habilidad puede regenerar incluso quemaduras y otros daños de energía. Aunque es muy útil, Escapar de la Muerte también es muy costoso.#!"
  FLAMES_OF_THE_PHOENIX_PERK_EFFECT: "Mejora [GetPerk('the_closing_wound_perk').GetName(GetPlayer)] permitiéndole curar cualquier enfermedad sobrenatural a un gran coste.\nTe vuelves inmune a los ataques al corazón.\n#flavor El personaje que usa esta habilidad se regenera completamente a nivel celular. Este poder no puede traer a un personaje de entre los muertos, pero revierte los efectos del envenenamiento por radiación, el cáncer, los traumas graves e incluso la vejez.#!"
  THE_LIZARDS_TAIL_PERK_EFFECT: "Cura automáticamente todos los problemas de salud una vez al año.\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] puede regenerar extremidades u órganos perdidos; básicamente cualquier daño que no resulte en la muerte.#!"
  ASHES_OF_THE_PHOENIX_PERK_EFFECT: "Resucita tras una muerte no natural al coste de 200 de [static_stress|E], siempre que estés por debajo de 300 de [stress|E].\n#flavor Los [GetTrait('shih').GetName( GetNullCharacter )] con verdadera maestría en el Puente del Fénix pueden regresar de la muerte.#!"
 
  THOUSAND_FISTS_PERK_EFFECT: "Probabilidad adicional de causar heridas a los [knights|E] enemigos cuando participas en la [combat_phase|E] como [knight|E].\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] enfoca su Chi Yang y lanza múltiples puñetazos. Los golpes son sobrehumanamente rápidos, a menudo desdibujándose en el aire.#!"
  SPEAR_HAND_PERK_EFFECT: "Probabilidad adicional de causar heridas graves a los [knights|E] enemigos cuando participas en la [combat_phase|E] como [knight|E].\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] enfoca su Chi Yang e inflama la energía alrededor de una mano. Esta energía ondula el aire y arde intensamente.#!"
  BURNING_GHOSTS_PERK_EFFECT: "Probabilidad adicional de causar heridas graves a los [knights|E] enemigos cuando participas en la [combat_phase|E] como [knight|E].\n#flavor El caballero [GetTrait('shih').GetName( GetNullCharacter )] enfoca su Chi, lo que le permite combatir wraiths y espíritus de todo tipo. Su piel brilla con una luz dorada y las energías del Chi lo envuelven. El cuerpo del [GetTrait('shih').GetName( GetNullCharacter )] no golpea realmente a los espíritus, pero el aura de poder que lo rodea sí lo hace.#!"
  STEEL_BODY_PERK_EFFECT: "Probabilidad adicional de mutilar a los [knights|E] enemigos cuando participas en la [combat_phase|E] como [knight|E].\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] enfoca su Chi Yin, endureciendo su cuerpo y aumentando su capacidad de infligir daño. Cada músculo del cuerpo del [GetTrait('shih').GetName( GetNullCharacter )] se tensa y su piel se vuelve mucho más resistente.#!"
  THOUSAND_SWORDS_PERK_EFFECT: "Probabilidad adicional de mutilar a los [knights|E] enemigos cuando participas en la [combat_phase|E] como [knight|E].\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] concentra su Chi y luego arremete contra sus enemigos en una furia de acciones. Cada golpe abre heridas en su enemigo, y el sonido de los impactos es como el del metal golpeando el metal.#!"
  HUNDRED_WARRIORS_STRIKE_PERK_EFFECT: "Probabilidad adicional de matar a los [knights|E] enemigos cuando participas en la [combat_phase|E] como [knight|E].\n#flavor Lleno de un Chi furioso, el [GetTrait('shih').GetName( GetNullCharacter )] se convierte en un torbellino de devastación.#!"
  HEAVEN_THUNDER_STRIKE_PERK_EFFECT: "Probabilidad adicional de matar a los [knights|E] enemigos cuando participas en la [combat_phase|E] como [knight|E].\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] puede concentrar el Chi en un golpe que puede partir el acero o sacudir el suelo con la fuerza de un terremoto.#!"
 
  FROZEN_RIVER_PERK_EFFECT: "Inmunidad a todos los poderes de drenaje, incluido el $pod_Embrace$.\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] usa su Chi Yang para construir una barrera protectora alrededor de su propia fuerza vital, evitando así el robo de su Chi.#!"
  STOLEN_SERPENT_PERK_EFFECT: "#flavor El [GetTrait('shih').GetName( GetNullCharacter )] puede capturar cualquier ataque sobrenatural a distancia dirigido contra él y luego enviarlo de vuelta al oponente que lo lanzó. Este es un asunto peligroso, ya que el [GetTrait('shih').GetName( GetNullCharacter )] debe demostrar una sincronización perfecta para apoderarse de las energías místicas que le lanzan.#!"
  CELESTIAL_BARRIER_PERK_EFFECT: "Inflige a cada gobernante del bando opuesto [GetModifier('shih_celestial_barrier_modifier').GetNameWithTooltip] al comenzar una [war|E] como atacante o defensor principal.\n#flavor Con este poder, el [GetTrait('shih').GetName( GetNullCharacter )] bloquea temporalmente la capacidad del shen para tomar Chi de otras fuentes.#!"
  CLUTCH_OF_THE_WAN_KUEI_PERK_EFFECT: "#flavor El [GetTrait('shih').GetName( GetNullCharacter )] que usa esta habilidad es capaz de robar Chi de un shen. Aunque el Chi robado ya no está disponible para el shen, el [GetTrait('shih').GetName( GetNullCharacter )] tampoco puede usar el Chi robado.#!"
  BITE_OF_THE_MU_PERK_EFFECT: "Como [character_interaction|E], usa a un $POD_splat_kueijin$ encarcelado para perder [stress|E].\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] que usa esta habilidad no solo roba el Chi de un shen objetivo, sino que también usa ese Chi en un ataque contra el shen. Este procedimiento es muy arriesgado, pues despierta el P'o del [GetTrait('shih').GetName( GetNullCharacter )].#!"
  RIGHTEOUS_HUNGRY_SPIRIT_PERK_EFFECT: "Te vuelves inmune a los poderes mentales hostiles.\n#flavor El alma del [GetTrait('shih').GetName( GetNullCharacter )] está tan fortalecida que cualquier intento de drenar o robar su Chi no solo falla automáticamente, sino que el cazador puede robarle el Chi al atacante.#!"
  DEMON_EATING_TECHNIQUET_PERK_EFFECT: "Desbloquea una opción de ejecución que te permite aumentar tus [skills|E] base devorando a un $POD_splat_kueijin$.\n#flavor Los ataques de combate cuerpo a cuerpo (armados y desarmados) del [GetTrait('shih').GetName( GetNullCharacter )] contra los shen no solo infligen daño, sino que disipan el Chi del objetivo.#!"
 
  EYES_OF_THE_DRAGON_PERK_EFFECT: "#flavor El [GetTrait('shih').GetName( GetNullCharacter )] intimida a un oponente con la mirada. La intimidación es la clave para evitar el combate con éxito.#!"
  DARK_REFLECTION_PERK_EFFECT: "#flavor Este poder obliga a los enemigos del [GetTrait('shih').GetName( GetNullCharacter )] a darse cuenta de las consecuencias de sus acciones. Los [GetTrait('shih').GetName( GetNullCharacter )] usan este poder al pronunciar un juicio sobre un shen.#!"
  HUNTED_EYES_PERK_EFFECT: "Como [character_interaction|E], otorga 100 de [static_stress|E] a un $POD_splat_kueijin$ que se encuentre en el mismo lugar que tú.\n#flavor Este poder funciona tanto con los [Glossary('Hungry Dead','game_concept_kuei_jin_desc')] como con los Muertos Inquietos. Mirando a los ojos de un oponente, el [GetTrait('shih').GetName( GetNullCharacter )] obliga al objetivo a volver a experimentar cualquier tiempo pasado en el mundo del [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')].#!"
  VOICE_OF_THE_YAMA_KINGS_PERK_EFFECT: "Como [character_interaction|E], intenta ganar un [strong_hook|E] sobre un $POD_splat_kueijin$, con la probabilidad basada en tu [dread|E].\n$POD_can_command_wraith_trigger_loca$\n#flavor Un [GetTrait('shih').GetName( GetNullCharacter )] que emplea este poder puede ordenar a un espíritu que realice una tarea sencilla.#!"
  DIVINE_ORDINANCE_PERK_EFFECT: "#flavor El [GetTrait('shih').GetName( GetNullCharacter )] inspira un miedo abrumador en todos los oponentes dentro de su rango visual.#!"
  MANTLE_OF_HEAVEN_PERK_EFFECT: "#flavor Revestido con la protección divina del Cielo, un cazador de demonios se convierte en un enemigo terrible a los ojos de los shen.#!"
  DIVINE_MANDATE_PERK_EFFECT: "Mejora [GetPerk('voice_of_the_yama_kings_perk').GetName(GetPlayer)] permitiéndole afectar a todos los [splats|E].\n#flavor Hablando con la voz del Cielo, el [GetTrait('shih').GetName( GetNullCharacter )] puede comandar a cualquier shen y esperar obediencia.#!"
 
  BALANCE_OF_THE_SPIRIT_PERK_EFFECT: "Como [character_interaction|E], haz que un objetivo pierda 50 de [static_stress|E] al coste de 25 de [static_stress|E].\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] puede discernir los desequilibrios espirituales del Yin y el Yang e intentar restaurar el orden adecuado con este poder.#!"
  FOCUS_OF_THE_MIND_PERK_EFFECT: "#flavor Los [GetTrait('shih').GetName( GetNullCharacter )] usan una gran parte de su Fuerza de Voluntad luchando contra los shen. Este poder les permite recuperar su resolución y realizar una vez más sus deberes sagrados.#!"
  NIGHTMARE_EXORCISM_PERK_EFFECT: "[GetPerk('balance_of_the_spirit_perk').GetName(GetPlayer)] ahora también te permite eliminar [traits|E] de [stress|E] negativos.\n#flavor Muchos [GetTrait('shih').GetName( GetNullCharacter )] recurren a las drogas y al alcohol en un esfuerzo por aliviar su angustia mental. El [GetTrait('shih').GetName( GetNullCharacter )] que usa este poder adopta un enfoque más directo borrando el impacto emocional del recuerdo y, con suerte, eliminando las cicatrices mentales que ese recuerdo crea.#!"
  SELF_EXORCISM_PERK_EFFECT: "Ya no puedes ser poseído por $POD_splat_wraith_plural$.\n#flavor Los [GetTrait('shih').GetName( GetNullCharacter )], como todos los mortales, están sujetos a los riesgos de la posesión demoníaca. Con este poder, el cazador de demonios entabla una batalla psíquica con un demonio que ha logrado entrar con éxito en su cuerpo, adquiriendo una segunda oportunidad para expulsarlo.#!"
  MENTAL_DOMINION_PERK_EFFECT: "[GetPerk('balance_of_the_spirit_perk').GetName(GetPlayer)] ahora también te permite eliminar completamente el [stress|E] a cambio de [GetModifier('mental_dominion_modifier').GetNameWithTooltip].\n#flavor Un [GetTrait('shih').GetName( GetNullCharacter )] que usa este poder puede restaurar completamente su Fuerza de Voluntad y debilitar realmente su P'o.#!"
  MOUNTAIN_MEDITATION_PERK_EFFECT: "#flavor Los [GetTrait('shih').GetName( GetNullCharacter )] que usan esta disciplina maestra alcanzan un grado de tranquilidad que los hace tan inamovibles como las raíces de una montaña.#!"
  WALKING_IN_BALANCE_PERK_EFFECT: "#flavor El [GetTrait('shih').GetName( GetNullCharacter )] está tan perfectamente equilibrado entre el Yin y el Yang que supera cualquier intento externo de perturbar su equilibrio interno de Chi.#!"
 
  CLOUD_WALKING_PERK_EFFECT: "#flavor Este poder permite al [GetTrait('shih').GetName( GetNullCharacter )] moverse silenciosamente y sin dejar rastro, incluso mientras corre. El [GetTrait('shih').GetName( GetNullCharacter )] no deja ningún olor que indique que ha estado alguna vez en la zona.#!"
  WATER_TREADING_PERK_EFFECT: "#flavor Con este poder, el [GetTrait('shih').GetName( GetNullCharacter )] es capaz de viajar sobre superficies inestables, como el agua o las arenas movedizas, y de usar virtualmente cualquier superficie, incluso las hojas de un árbol, para escalar.#!"
  WIND_STRIKE_PERK_EFFECT: "#flavor El [GetTrait('shih').GetName( GetNullCharacter )] usa el propio impulso de un oponente para lanzar a un enemigo a distancias increíbles.#!"
  MOUNTAIN_STANCE_PERK_EFFECT: "Como [character_interaction|E], entra o sal de [GetModifier('mountain_stance_modifier').GetNameWithTooltip].\n#flavor El [GetTrait('shih').GetName( GetNullCharacter )] absorbe el impacto de un ataque, redirigiendo la fuerza hacia el suelo.#!"
  CELESTIAL_WIND_PERK_EFFECT: "#flavor El [GetTrait('shih').GetName( GetNullCharacter )] que usa este poder enfoca su Chi para detener el avance de un objetivo y posiblemente incluso enviar a un oponente hacia atrás de un golpe.#!"
  ARROW_CUTTING_PERK_EFFECT: "#flavor Los reflejos del [GetTrait('shih').GetName( GetNullCharacter )] son sobrehumanamente rápidos, capaces de desviar cualquier ataque a distancia, incluso una lluvia de balas.#!"
  WIND_RACING_PRANA_PERK_EFFECT: "#flavor Usando este poder, un [GetTrait('shih').GetName( GetNullCharacter )] puede aplicar una ráfaga momentánea de velocidad sobrehumana.#!"
