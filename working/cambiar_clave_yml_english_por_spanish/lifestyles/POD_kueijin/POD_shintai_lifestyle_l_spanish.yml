l_spanish:
 shintai_lifestyle_name: "Shintai"
 shintai_lifestyle_desc: "Las Artes Shintai son símbolos icónicos de iluminación, que solo pueden desarrollarse creciendo en el [Glossary('Dharma','podgloss.dharma')]. La puntuación máxima de un personaje $pod_kueijin$ en cualquier Shintai está limitada por su puntuación de [Glossary('Dharma','podgloss.dharma')]; además, solo pueden dominar un Shintai con [GetTrait('dharma5').GetName(GetNullCharacter)], dos con [GetTrait('dharma6').GetName(GetNullCharacter)], y así sucesivamente."
 shintai_lifestyle_highlight_desc: "Debido a tu [Glossary('Dharma','podgloss.dharma')], ganas un #P [GetPlayer.MakeScope.ScriptValue('dharma_lifestyle_xp_mult')|%0]#! más de [experience|E] en este estilo de vida."
 monthly_shintai_lifestyle_xp_gain_mult: "[experience|E] mensual de [lifestyle|E] Shintai"
 monthly_shintai_lifestyle_xp_gain_add: "[experience|E] mensual de [lifestyle|E] Shintai"

 shintai_focus: "Enfoque Shintai"
 shintai_focus_modifier: "[GetFocus('shintai_focus').GetName]"
 shintai_focus_desc: "Expresiones de iluminación."
 shintai_focus_effect_desc: "Centrarse en Shintai otorga:"

 shintai_ash_and_flames_visible: "Shintai de Ceniza y Fuego"
 shintai_blood_visible: "Shintai de Sangre"
 shintai_bone_visible: "Shintai de Hueso"
 shintai_devotion_visible: "Shintai de Devoción"
 shintai_flesh_visible: "Shintai de Carne"
 shintai_illusion_visible: "Shintai de Ilusión"
 shintai_jade_visible: "Shintai de Jade"
 shintai_poxes_visible: "Shintai de las Pústulas"
 shintai_storms_visible: "Shintai de las Tormentas"
 shintai_smoke_visible: "Shintai de Humo"

 shintai_fearless_fire_perk_name: "Fuego sin miedo"
 shintai_dance_of_embers_perk_name: "Danza de las brasas"
 shintai_beautiful_spark_perk_name: "Chispa hermosa"
 shintai_fire_tempered_soul_perk_name: "Alma templada por el fuego"
 shintai_the_shintai_of_ash_and_fire_perk_name: "Shintai de Ceniza y Fuego"
 SHINTAI_FEARLESS_FIRE_PERK_EFFECT: "#flavor Los maestros de Ceniza y Llama utilizan un arma especial, un bastón largo con fuego de antorcha en ambos extremos. Los estudiantes de Ceniza dominan su miedo a la llama aprendiendo a bailar a través de las estocadas y golpes del maestro; los estudiantes de Llama responden fuego con fuego, blandiendo sus propios bastones ardientes en mortales combates de práctica.#!"
 SHINTAI_DANCE_OF_EMBERS_PERK_EFFECT: "Te vuelves inmune al fuego.\n#flavor Los iniciados de Ceniza y Llama deben caminar por un laberinto construido con numerosas hogueras y antorchas. En cualquier momento, las llamas pueden tomar forma humana y abrazar al Hambriento (o atacar directamente, en el caso de la Llama), moldeadas por un adepto o maestro vigilante. El Arte Demoníaco de la Montaña de Hierro está prohibido aquí; si te quemas, te quemas.#!"
 SHINTAI_BEAUTIFUL_SPARK_PERK_EFFECT: "#flavor Los estudiantes ya no pasan largas meditaciones en el Reino de la Noche, intentando invocar fuego que caliente con los dedos congelados; parece que el Señor [Glossary('Emma-O','podgloss.emmao')] ya no tolera visitantes. La alternativa antaño eran cuevas heladas y glaciares, pero el advenimiento moderno de los congeladores industriales ha sido una bendición.#!"
 SHINTAI_FIRE_TEMPERED_SOUL_PERK_EFFECT: "Todo el [POD_aggravated_damage_with_box|E] relacionado con el sol se limitará a 1 de [POD_damage|E].\n#flavor La 'Meditación a la Luz del Día' es exactamente lo que parece: el estudiante de Ceniza se sienta ante el horizonte, permaneciendo tanto tiempo como se atreva. Entre los estudiantes de Llama, la Meditación es una batalla con espadas al amanecer, en la que a ninguno se le permite detenerse hasta que uno se avergüenza pidiendo clemencia.#!"
 SHINTAI_THE_SHINTAI_OF_ASH_AND_FIRE_PERK_EFFECT: "La luz solar ahora inflige [POD_superficial_damage_with_box|E]. Te vuelves inmune a los métodos de asesinato basados en el sol.\n#flavor El maestro es un dios ardiente, envuelto instantáneamente en calor y poder destructivo... O bien se vuelve lo más parecido a un ser humano que puede llegar a ser un Muerto Hambriento, capaz de caminar bajo el sol sin miedo.#!"

 shintai_eyes_in_the_blood_perk_name: "Ojos en la sangre"
 shintai_flow_like_blood_perk_name: "Fluir como la sangre"
 shintai_lash_of_blood_perk_name: "Azote de sangre"
 shintai_bloodwalk_perk_name: "Caminar por la sangre"
 shintai_the_shintai_of_blood_perk_name: "Shintai de Sangre"
 SHINTAI_EYES_IN_THE_BLOOD_PERK_EFFECT: "Cada año, cura tu ceguera, incluso si es permanente de otro modo.\n#flavor A un estudiante laico de Sangre se le arrancarán los ojos, la nariz y la lengua hasta que se dé cuenta de la verdad: que en realidad ya no los necesita. Cada sentido, cada cualidad de la existencia puede experimentarse enteramente a través de su sangre.#!"
 SHINTAI_FLOW_LIKE_BLOOD_PERK_EFFECT: "Como [character_interaction|E], escapa del [imprisonment|E].\nYa no puedes ser encarcelado durante [sieges|E] o [raids|E].\n#flavor Un iniciado de Sangre se sentará, atado y momificado, frente a un jarrón alto lleno de sus propios fluidos, hasta que pueda atraer cada última gota de vuelta a su cuerpo. A partir de esto, comienza a romper la ilusión de su cuerpo físico, comprendiendo que su verdadera existencia es mucho más fluida.#!"
 SHINTAI_LASH_OF_BLOOD_PERK_EFFECT: "#flavor Un aprendiz de los misterios superiores de la Sangre debe meditar en una pila de sus propias partes del cuerpo cercenadas, separándolas y volviéndolas a unir con intensa concentración, hasta que finalmente se alcanza la perspicacia.#!"
 SHINTAI_BLOODWALK_PERK_EFFECT: "#flavor En noches antiguas, los estudiantes de Sangre ponían a prueba su temple vaciando sus venas en cauces de ríos y en la trayectoria de tifones. Dondequiera que el agua los llevara, allí irían ellos, sin importar cuán lejano y doloroso fuera el destino.#!"
 SHINTAI_THE_SHINTAI_OF_BLOOD_PERK_EFFECT: "Como [character_interaction|E], cambia de forma a [GetModifier('POD_shapeshift_form_blood_modifier').GetNameWithTooltip].\n#flavor Un maestro del Shintai de Sangre comprende que no hay un 'cuerpo' verdadero en absoluto, ni un 'yo'; solo hay sangre. Se disuelve en un charco de sangre chapoteante, o explota violentamente y rocía la habitación de rojo, y permanece así por el resto de la escena.#!"

 shintai_relentless_bone_perk_name: "Hueso implacable"
 shintai_punishing_bone_perk_name: "Hueso punitivo"
 shintai_bone_obiedience_perk_name: "Obediencia del hueso"
 shintai_garden_of_bones_perk_name: "Jardín de huesos"
 shintai_the_shintai_of_bone_perk_name: "Shintai de Hueso"
 SHINTAI_RELENTLESS_BONE_PERK_EFFECT: "[POD_aggravated_damage|E] necesario para matarte: #P +25%#!.\n#flavor En tiempos antiguos, a los estudiantes laicos de Hueso se les permitía visitar varios infiernos como invitados de honor, para que la carne fuera arrancada de sus huesos mientras arrastraban rocas y escalaban montañas aullantes. Los Muertos Hambrientos modernos tienden a preferir las simulaciones al modo antiguo, pero el resultado es el mismo.#!"
 SHINTAI_PUNISHING_BONE_PERK_EFFECT: "#flavor Un momento temido para el estudiante de Hueso, la práctica común de enterrar a los estudiantes vivos, preferiblemente provocando un desprendimiento de rocas o bajo un tonelaje preparado de mineral de hierro. Allí permanecerá el estudiante de Hueso, hasta que obtenga la perspicacia y la fuerza para abrirse paso hacia fuera, o haga su paz final en la oscuridad del metal.#!"
 SHINTAI_BONE_OBIEDIENCE_PERK_EFFECT: "#flavor Para convertirse en aprendiz de los misterios superiores de Hueso, el estudiante se somete a las atenciones de un maestro, permitiendo que sus huesos sean deformados y retorcidos en configuraciones dolorosas y desconcertantes. Luego es simplemente cuestión de sentarse en meditación hasta que alcance la perspicacia suficiente para volver a romperse en la forma adecuada, y desde ahí ir más allá. En el este de Japón asocian este entrenamiento con Ebisu, el niño-sanguijuela sin huesos del mito y uno de los siete dioses de la fortuna.#!"
 SHINTAI_GARDEN_OF_BONES_PERK_EFFECT: "[POD_aggravated_damage|E] necesario para matarte: #P +25%#!.\n#flavor En el umbral de la maestría, un adepto de Hueso vuelve su conocimiento hacia el exterior, experimentando con esqueletos tanto vivos como muertos. A diferencia del entrenamiento previo, obtener esta técnica requiere un tipo diferente de implacabilidad: un impulso silencioso y estudioso de retorcer, romper, remendar y repetir, una y otra vez, a través de los gritos de los diversos sujetos de prueba del Hambriento, hasta que, por fin, llega la comprensión.#!"
 SHINTAI_THE_SHINTAI_OF_BONE_PERK_EFFECT: "Casillas de [POD_health_track|E]: #P +1#!.\n#flavor El maestro de Hueso no se dobla ante el mundo; lo corta como un cuchillo a través del tendón y la grasa. Cuando se activa, el Shintai le da al Hambriento un brillo pálido y pulido, como si todo su cuerpo se hubiera osificado. Los [Glossary('Bodhisattvas','podgloss.bodhisattva')] de las Flores de Hueso y otros antiguos Muertos Hambrientos pueden tener en su lugar cuerpos de metal negro puro, tan oscuro que absorbe la luz a su alrededor.#!"

 shintai_the_flow_of_worship_perk_name: "El flujo de la adoración"
 shintai_your_god_beckons_perk_name: "Tu dios te llama"
 shintai_touch_of_the_asura_perk_name: "Toque del Asura"
 shintai_festival_night_perk_name: "Noche de festival"
 shintai_the_shintai_of_devotion_perk_name: "Shintai de Devoción"
 SHINTAI_THE_FLOW_OF_WORSHIP_PERK_EFFECT: "Cada año, descubre todos los [secrets|E] que tu [CHARACTER.Custom('PODCoterie')] conoce.\n#flavor A diferencia de otros Cuerpos Divinos, la primera etapa del Shintai de Devoción es tan natural como abrir una puerta. Un Dios menor incipiente rara vez cree en su propia divinidad desde el principio; debe ser convencido a través de la experiencia. Pero una vez que el Dios menor conoce la verdad y obtiene su primer seguidor, los susurros comienzan rápidamente.#!"
 SHINTAI_YOUR_GOD_BECKONS_PERK_EFFECT: "Como [character_interaction|E], convoca a un miembro sin tierras de tu [CHARACTER.Custom('PODCoterie')] a tu [court|E].\n#flavor A diferencia de los dioses celestiales, los Dioses menores no pueden estar en todas partes ni ver todo lo que hacen sus seguidores. Sin embargo, no hace falta caminar mucho por los Cielos Inferiores, recompensando y castigando a los seguidores según se considere oportuno, antes de que el destino y el espacio comiencen a doblegarse ante el Dios menor, como es debido.#!"
 SHINTAI_TOUCH_OF_THE_ASURA_PERK_EFFECT: "Todos los miembros de la [CHARACTER.Custom('PODCoterie')] ganan [GetModifier('shintai_touch_of_the_asura_modifier').GetNameWithTooltip].\n#flavor En teoría, un dios nunca está obligado a responder a las oraciones; es solo su voluntad y visión divina lo que lleva a un Dios menor a cumplir los deseos de sus seguidores. En la práctica, sin embargo, los Dioses menores tienden a disfrutar teniendo legiones de seguidores, y rápidamente se les enseña cómo mantener a los mortales felices y obedientes.#!"
 SHINTAI_FESTIVAL_NIGHT_PERK_EFFECT: "Cada año, pierde @stress_icon![static_stress|E] basado en el número de miembros de tu [CHARACTER.Custom('PODCoterie')].\n#flavor El poder característico de los Dioses menores, y la fuente del nombre insultante de 'Devorador de Oraciones', un Hambriento llega a comprender su conexión directa con el flujo de espiritualidad y adoración en el mundo mortal. Esto normalmente ocurre después de que el Dios menor disfruta de su primer festival verdadero en su honor.#!"
 SHINTAI_THE_SHINTAI_OF_DEVOTION_PERK_EFFECT: "Gana un [strong_hook|E] sobre todos los miembros de la [CHARACTER.Custom('PODCoterie')].\n#flavor El Shintai de Devoción, cuando se activa con maestría total, pone a los seguidores mortales del Dios menor en completa comunión con ella, cuerpo y alma.#!"

 shintai_excellent_corpse_perk_name: "Cadáver excelente"
 shintai_flowers_of_flesh_perk_name: "Flores de carne"
 shintai_human_sculpture_perk_name: "Escultura humana"
 shintai_a_thousand_forms_of_flesh_perk_name: "Mil formas de carne"
 shintai_the_shintai_of_flesh_perk_name: "Shintai de Carne"
 SHINTAI_EXCELLENT_CORPSE_PERK_EFFECT: "Como [character_interaction|E], manipula tu [trait|E] [GetTrait('scarred').GetName(GetPlayer)].\n#flavor Muchas muertes creativas aguardan al estudiante laico de la Carne: ahorcado, serrado por la mitad, aplastado... Eventualmente, el Hambriento llega a comprender que hay un arte en morir, que incluso un cadáver contiene infinitas posibilidades de expresión. En partes del sudeste asiático, este entrenamiento facilita la práctica tradicional de separar la parte superior e inferior del cuerpo al salir a cazar; un recordatorio para los Muertos Hambrientos, entre otras cosas, de que hay un tiempo para actuar como humano y un tiempo para ser honesto.#!"
 SHINTAI_FLOWERS_OF_FLESH_PERK_EFFECT: "Como [character_interaction|E], cambia un solo [trait|E] físico tuyo con un enfriamiento de 10 años.\n#flavor La práctica tradicional de decapitar ritualmente a un estudiante y enterrar su cabeza en un jardín, para que pueda reformarse a sí mismo a partir de los restos de otros cadáveres enterrados y aprender la naturaleza transitiva de la carne, se ha vuelto menos común con el tiempo; entre algunos Muertos Hambrientos, incluso se considera un poco rústica.#!"
 SHINTAI_HUMAN_SCULPTURE_PERK_EFFECT: "Mejora [GetPerk('shintai_flowers_of_flesh_perk').GetName(GetPlayer)] aumentando el número de [traits|E] que puedes cambiar a 2 por sesión.\n#flavor Deleitarse en la propia carne es una cosa; imitar minuciosamente cada parpadeo y espasmo de un ser humano vivo es otra muy distinta. Como un estudiante de las artes visuales, el aprendiz de los misterios superiores de la Carne estudia la forma, la figura y el movimiento con una intensidad absoluta, graduándose solo cuando ha elegido un objetivo y lo ha copiado a la perfección; a veces hasta el punto de que el original es señalado como un 'impostor' y despachado sumariamente por aquellos a quienes amaba y en quienes confiaba.#!"
 SHINTAI_A_THOUSAND_FORMS_OF_FLESH_PERK_EFFECT: "Mejora [GetPerk('shintai_flowers_of_flesh_perk').GetName(GetPlayer)] disminuyendo el enfriamiento a 5 años.\nComo [character_interaction|E], cambia de forma a varias formas animales, incluyendo animales míticos como dragones.\n#flavor Hay historias de los inmortales celestiales pasando tiempo como elegantes sementales, o como monos en las montañas. En las noches modernas, un estudiante de la Carne alcanza esta iluminación cuando un maestro lo transforma en un gorrión u otra criatura pequeña, y a sí mismo en un superdepredador. Al estudiante no se le permite regresar a la forma humana hasta que sea tan fluido y proteico como los inmortales de la leyenda, o hasta que el maestro, decepcionado, retuerza al estudiante en un horror y lo encierre para que medite sobre sus fracasos.#!"
 SHINTAI_THE_SHINTAI_OF_FLESH_PERK_EFFECT: "Mejora [GetPerk('shintai_flowers_of_flesh_perk').GetName(GetPlayer)] eliminando el límite de [trait|E] y el enfriamiento, además de permitir cambiar los [traits|E] de otros personajes tras superar una prueba de [prowess|E].\n#flavor A diferencia de los otros pilares-cadáver de los Inmortales Demoníacos, el Shintai de Carne es difícil de describir como una forma específica: el maestro, en su estado perfeccionado, se convierte en un vector de cambio puro. Todas las formas están a su disposición, y toda la carne que toca es como arcilla fresca para esculpir.#!"

 shintai_the_root_of_illusion_perk_name: "La raíz de la ilusión"
 shintai_non_self_perk_name: "No-Yo"
 shintai_glittering_paradise_perk_name: "Paraíso reluciente"
 shintai_rakshasa_blade_perk_name: "Hoja Rakshasa"
 shintai_the_shintai_of_illusion_perk_name: "Shintai de Ilusión"
 SHINTAI_THE_ROOT_OF_ILLUSION_PERK_EFFECT: "Como [character_interaction|E], obliga a un $POD_splat_vampire$ a entrar en frenesí u otórgale @stress_icon!50 de [static_stress|E].\n#flavor El deseo es la raíz de la ilusión; esta es la primera lección que aprenden todos los seguidores. Un maestro obliga al estudiante laico de la Ilusión a reconocer la vacuidad de sus apegos, incluso sus amores más profundos y definitorios. Pero no es tarea del maestro retorcer y destruir estas conexiones; el estudiante debe hacer tales cosas por sí mismo.#!"
 SHINTAI_NON_SELF_PERK_EFFECT: "#flavor Un maestro de la Ilusión puede tejer una ilusión tan completa que aquellos dentro de ella crean que son lo que el maestro dice que son: un humilde cartero, una amante sensual, un asesino en serie, un mendigo. Y cuando el sueño se desvanece, y el estudiante de la Ilusión despierta a lo que realmente es, ¿a qué otra cosa puede llevar eso sino a la iluminación?#!"
 SHINTAI_GLITTERING_PARADISE_PERK_EFFECT: "#flavor Una vez que el estudiante de la Ilusión comprende lo básico, suele dedicarse a la creación de ilusiones con desenfreno. El salto de iniciado a aprendiz ocurre cuando el estudiante experimenta un fracaso enorme, sufriendo las consecuencias de una ilusión que se desmorona. Entonces debe sentarse entre los restos, sean cuales sean, y reconstruir.#!"
 SHINTAI_RAKSHASA_BLADE_PERK_EFFECT: "Como [character_interaction|E], crea un [artifact|E] aleatorio de [rarity|E] #FAMEDBLUE Famosa#!.\n#flavor Una y otra vez, el maestro le recuerda al estudiante: no están imponiendo ilusiones sobre el mundo real; no hay mundo real. Una supuesta ilusión no es diferente de una supuesta verdad. Esta técnica sirve de mucho para demostrar este principio dhármico, pero a veces un adepto debe perder un dedo o un pie antes de que lo asimile.#!"
 SHINTAI_THE_SHINTAI_OF_ILLUSION_PERK_EFFECT: "#flavor El Shintai de Ilusión es un mundo-ilusión tan completo que el mundo 'real' se doblega enteramente a su voluntad, por breve que sea el tiempo.#!"

 shintai_smiling_at_thunder_perk_name: "Sonriendo al trueno"
 shintai_tread_the_dragons_tail_perk_name: "Pisar la cola del dragón"
 shintai_earths_embrace_perk_name: "El abrazo de la tierra"
 shintai_catching_the_wind_perk_name: "Atrapando el viento"
 shintai_the_shintai_of_jade_perk_name: "Shintai de Jade"
 SHINTAI_SMILING_AT_THUNDER_PERK_EFFECT: "#flavor El primer entrenamiento estereotípico en Jade es un ejercicio de melodrama: una tormenta eléctrica, un acantilado escarpado con una larga caída y un oleaje aplastante debajo, tanto el maestro como el estudiante descalzos en un camino resbaladizo, armados solo con puños o cuchillos. La pelea no termina hasta que el maestro dice que ha terminado.#!"
 SHINTAI_TREAD_THE_DRAGONS_TAIL_PERK_EFFECT: "#flavor Se han escrito muchos tratados sobre los movimientos y posturas adecuados necesarios para alcanzar la comprensión del Jade. No son del todo inútiles, pero no hay sustituto para la experiencia directa: el iniciado que desee dominar esta técnica debe eventualmente dar un salto de fe literal.#!"
 SHINTAI_EARTHS_EMBRACE_PERK_EFFECT: "#flavor El Infierno de Ser Enterrado Vivo es un reino infernal menor, reservado para aquellos que mataron a otros de esta misma manera. Es un campo tranquilo y cubierto de hierba, salpicado de un puñado de árboles jóvenes y nada más. Pero si escuchas el viento con mucho cuidado, podrías oír los gritos ahogados de estudiantes prometedores.#!"
 SHINTAI_CATCHING_THE_WIND_PERK_EFFECT: "#flavor Para volar como una doncella celestial, uno puede estudiar durante años y décadas, o puede viajar a las puertas de los Cielos superiores, pidiendo a los gloriosos espíritus que enseñen sus caminos a un humilde Muerto Hambriento... O uno puede encontrar a una doncella celestial exiliada en la tierra, alimentarse de su sangre divina y meditar sobre la belleza que se ha perdido para siempre.#!"
 SHINTAI_THE_SHINTAI_OF_JADE_PERK_EFFECT: "Como [character_interaction|E], cambia de forma a [GetModifier('POD_shapeshift_form_the_shintai_of_jade_modifier').GetNameWithTooltip].\n#flavor El Shintai de Jade convierte a los Muertos Hambrientos en divinidades de la tierra. El suelo, el cielo y el cuerpo-cadáver son como uno solo, por el tiempo que el maestro pueda hacerlo durar.#!"

 shintai_touch_of_the_stranger_perk_name: "Toque del extraño"
 shintai_hemorrhagic_strike_perk_name: "Golpe hemorrágico"
 shintai_fevers_purity_perk_name: "Pureza de la fiebre"
 shintai_wild_eyed_bulwark_perk_name: "Baluarte de ojos desorbitados"
 shintai_the_shintai_of_poxes_perk_name: "Shintai de las Pústulas"
 SHINTAI_TOUCH_OF_THE_STRANGER_PERK_EFFECT: "Como [character_interaction|E], inflige o cura una enfermedad a tu objetivo.\n#flavor No faltan enfermos y moribundos en este mundo. El estudiante laico compasivo vive entre ellos, aprendiendo a otorgar un toque curativo o, a veces, dejando que lo inevitable se imponga con menos demora. Pero no todos los estudiantes de las Pústulas son tan amables.#!"
 SHINTAI_HEMORRHAGIC_STRIKE_PERK_EFFECT: "#flavor El iniciado de las Pústulas debe tragar un demonio parásito, tradicionalmente tomado del Infierno de los Gusanos Perforadores. Esta criatura se enrosca alrededor de los órganos muertos del Hambriento y se alimenta de su sangre robada, mientras el estudiante medita en silenciosa agonía. Eventualmente, el cuerpo absorbe y destruye al demonio, pero el recuerdo del dolor ha enseñado su lección.#!"
 SHINTAI_FEVERS_PURITY_PERK_EFFECT: "Como [character_interaction|E], pierde @stress_icon!100 de [static_stress|E] al coste de ganar [GetTrait('crimson_fever').GetName(GetPlayer)].\n#flavor El aprendiz de las Pústulas acepta una fiebre aplastante, otorgada por un maestro o por un espíritu poderoso; tal vez uno de los dioses de las pústulas que aún vagan por la península de Corea, o un funcionario enfermizo de la Ciudad Malvada que lleva una bolsa de medicina dudosa. Desafortunadamente, hace falta mucho más que un brote de fiebre para comprender sus poderes purificadores.#!"
 SHINTAI_WILD_EYED_BULWARK_PERK_EFFECT: "Como [character_interaction|E], cura [EmptyScope.ScriptValue('POD_wild_eyed_bulwark_heal_value')|V0] de [POD_aggravated_damage_with_box|E] al coste de ganar [GetTrait('crimson_fever').GetName(GetPlayer)].\n#flavor Se dice que los misterios superiores del Shintai de las Pústulas estaban en un texto robado a la propia Señora de la Pestilencia, sacado de contrabando de los Mil Infiernos haciendo que cada palabra se transformara en una enfermedad. Esas enfermedades todavía aparecen en el mundo, esperando a que adeptos cuidadosos y vigilantes las encuentren, reúnan e interpreten.#!"
 SHINTAI_THE_SHINTAI_OF_POXES_PERK_EFFECT: "Como [character_interaction|E], genera una [epidemic|E] mayor de tu elección en la ubicación de tu objetivo.\n#flavor El Shintai de las Pústulas, cuando se activa con maestría total, es el poder puro de la enfermedad —y la perspicacia febril— hecho forma.#!"

 shintai_breath_of_the_sky_perk_name: "Aliento del cielo"
 shintai_arms_of_the_sea_perk_name: "Brazos del mar"
 shintai_thunderbolts_kiss_perk_name: "Beso del rayo"
 shintai_chamber_bed_of_clouds_perk_name: "Cámara-lecho de nubes"
 shintai_the_shintai_of_storms_perk_name: "Shintai de las Tormentas"
 SHINTAI_BREATH_OF_THE_SKY_PERK_EFFECT: "#flavor Un estudiante laico de las Tormentas observa el aire arriba y estudia sus movimientos, meditando bajo el granizo y la lluvia, así como bajo cielos estrellados. Los estudiantes más bestiales o impacientes beberán la esencia espiritual de las sílfides, o se atarán a cometas de seda para meditar más directamente sobre el poder del viento.#!"
 SHINTAI_ARMS_OF_THE_SEA_PERK_EFFECT: "Como [character_interaction|E], manipula el clima sobre un [duchy|E] en el que se encuentre tu objetivo.\nDesbloquea la opción #V Sequía#! en la [character_interaction|E] de [GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)].\nDesbloquea la opción #V Tierra fértil#! en la [character_interaction|E] de [GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)].\n#flavor Hay sirenas y dioses del mar; no solo la Madre de las Profundidades y sus hijos de escamas plateadas, sino verdaderos seres de las aguas de la tierra, poseídos de una inteligencia de sabio del Shintai de las Tormentas y una gran magia. Un estudiante de las Tormentas, con o sin maestro, busca a estos seres y les pide sabiduría.#!"
 SHINTAI_THUNDERBOLTS_KISS_PERK_EFFECT: "#flavor Encontrar un rayo por el que ser alcanzado es bastante difícil. Debe ser un rayo verdadero y natural del cielo, no invocado ni creado, sino atraído directamente a la mano; y, por supuesto, luego hay que sobrevivir a él.#!"
 SHINTAI_CHAMBER_BED_OF_CLOUDS_PERK_EFFECT: "Mejora [GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)] permitiéndole apuntar a un [kingdom|E] entero.\nDesbloquea la opción #V Tormenta#! en la [character_interaction|E] de [GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)].#flavor Agua, aire, la carga invisible de poder: todos los ingredientes necesarios están en su lugar, y el adepto de las Tormentas tradicionalmente pasa años comprendiendo el oficio necesario para forjarlos en la magia del clima. En esta era de prodigios diabólicos, sin embargo, un Hambriento puede aprender a blandir la lluvia en mucho menos tiempo que antes.#!"
 SHINTAI_THE_SHINTAI_OF_STORMS_PERK_EFFECT: "Mejora [GetPerk('shintai_arms_of_the_sea_perk').GetName(GetPlayer)] permitiéndole apuntar a un [empire|E] entero.\n#flavor El poder total del Shintai de las Tormentas es la devastación pura y sin adulterar de la naturaleza. Pero puede controlarse, si uno es muy cuidadoso.#!"

 shintai_smokeshow_perk_name: "Espectáculo de humo"
 shintai_a_smoker_has_eyes_in_the_back_of_the_head_perk_name: "Un fumador tiene ojos en la nuca"
 shintai_reach_of_smoke_perk_name: "Alcance del humo"
 shintai_a_body_of_smoke_perk_name: "Un cuerpo de humo"
 shintai_the_shintai_of_smoke_perk_name: "Shintai de Humo"
 SHINTAI_SMOKESHOW_PERK_EFFECT: "#flavor El Hambriento puede manipular el humo existente, expandiendo su volumen hasta el área de una gran mansión, así como dándole todo tipo de formas encantadoras u horribles.#!"
 SHINTAI_A_SMOKER_HAS_EYES_IN_THE_BACK_OF_THE_HEAD_PERK_EFFECT: "#flavor Los Muertos Hambrientos pueden convertir reflexivamente parte de su cuerpo en humo, escapando con éxito de un ataque entrante.#!"
 SHINTAI_REACH_OF_SMOKE_PERK_EFFECT: "#flavor Al concentrarse y no realizar ninguna otra acción, el Hambriento puede dar a una sola columna de humo la solidez y el alcance de un largo tentáculo, dándole la capacidad de realizar acciones físicas desde la distancia visual (incluyendo el combate) como si estuviera presente directamente.#!"
 SHINTAI_A_BODY_OF_SMOKE_PERK_EFFECT: "Como [character_interaction|E], cambia de forma a [GetModifier('POD_shapeshift_form_incorporeal_modifier').GetNameWithTooltip].\n#flavor El Muerto Hambriento se transforma en humo, conservando su forma humanoide pero siendo completamente inmune a la mayoría de las fuentes de daño natural.#!"
 SHINTAI_THE_SHINTAI_OF_SMOKE_PERK_EFFECT: "#flavor Con una comprensión total del humo, uno puede transformarse en él, desencadenado de cualquier forma determinada.#!"
