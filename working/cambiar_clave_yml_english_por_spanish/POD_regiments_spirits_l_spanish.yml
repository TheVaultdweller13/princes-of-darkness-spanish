l_spanish: 
 
  jagglings: "Jagglings"
  jagglings_flavor: "#F Los Jagglings son los \"ciudadanos\" umbrales comunes. Suelen ser sintientes y poseen una identidad individual. Los Jagglings suelen servir a un Incarna.#!"
 
  water_spirits: "Espíritus del agua"
  water_spirits_flavor: "Espíritus menores de las aguas locales convocados para servir."
 
  rat_headed_dragonfly_demon: "Demonios libélula con cabeza de rata"
  rat_headed_dragonfly_demon_flavor: "#F Con una longitud de entre treinta y cuarenta y cinco centímetros, y una envergadura de hasta sesenta centímetros, los demonios libélula tienen caparazones con la misma iridiscencia brillante que el tórax de una mosca o el aceite sobre el agua. Son utilizados por los Tigres del Diablo como exploradores.#!"
 
  sleeper_seducing_bane: "Perdición seductora de durmientes"
  sleeper_seducing_bane_flavor: "#F Estos demonios similares a súcubos son cualquier cosa menos atractivos. De hecho, las Perdiciones seductoras de durmientes aparecen como masas rojas carnosas y húmedas de unos pocos pies de ancho y erizadas de tentáculos de varios tamaños. Se sabe que los Tigres del Diablo las vinculan a su servicio.#!"
 
  face_robe_demon: "Demonios de túnica de rostros"
  face_robe_demon_flavor: "#F Los Demonios de túnica de rostros son desagradables incluso para los estándares de los Tigres del Diablo. Habitantes entre atrocidades y desesperación, estos demonios se llaman así por su desagradable hábito de vestirse con túnicas elegantes hechas con los rostros de sus víctimas.#!"
 
  fire_elemental: "Elemental de fuego"
  fire_elemental_flavor: "#F Elementales de fuego, que se ven a sí mismos como las pasiones de Gaia y que una vez enseñaron a la humanidad el uso del fuego. Surgen espontáneamente a la existencia tras la Celosía, solo para desvanecerse una vez que su alimento se agota.#!"
 
  air_elemental: "Elemental de aire"
  air_elemental_flavor: "#F Elementales de aire, que suelen residir en los confines exteriores del [UmbraGlossary('aetherial_realm')] o siguen los Vientos Umbrales.#!"
 
  water_elemental: "Elemental de agua"
  water_elemental_flavor: "#F Elementales de agua, que residen en masas de agua dentro del paisaje umbral.#!"
 
  earth_elemental: "Elemental de tierra"
  earth_elemental_flavor: "#F Elementales de tierra, de los que se rumorea que son los más cercanos a Gaia y que suelen habitar en suelo incontaminado dentro de la [UmbraGlossary('penumbra')].#!"
 
  electricity_elemental: "Elemental de rayo"
  electricity_elemental_flavor: "#F Los Garou ancianos creen que los Elementales son la primera creación de Gaia y que los elementales más nuevos son una perversión que señala el Apocalipsis. Otros creen que estos elementales siempre estuvieron presentes pero carecían de la sustancia material para manifestarse. Aunque hay historias de una Corte Elemental en la [UmbraGlossaryLocalized('astral_reaches','Umbra Alta')], la mayoría de los Garou no creen en su existencia. Los Teúrgos dicen que lo que los forasteros perciben como una jerarquía son solo reflejos de las propias suposiciones que el Elemental refleja para comunicarse mejor con una criatura de carne.#!"
 
  metal_elemental: "Elemental de metal"
  metal_elemental_flavor: "#F Los elementales de metal se ven a sí mismos como los futuros gobernantes de su clase y tienen una relación tensa con los Elementales de tierra. Aparecen como humanoides hechos del metal que representan, y a menudo son de mal genio y arrogantes.#!"
 
  wood_elemental: "Elemental de madera"
  wood_elemental_flavor: "#F Solo un poco más antiguos que los elementales de metal, los lin shen también tienen una relación estrecha con los humanos. Mientras que algunos de los tieh shen se sienten abandonados por el hombre, la mayoría de los elementales de Madera se sienten victimizados.#!"
 
  liderci: "Liderci"
  liderci_flavor: "#F Estos astutos espíritus son manifestaciones del deseo puro, espíritus tentadores y amantes demoníacos.#!"
 
  animated_tree: "Árboles animados"
  animated_tree_flavor: "#F Árboles imbuidos de magia y animados para la acción, los árboles marchan a la guerra cuando son guiados por un jardinero mágico.#!"
 
  stormcrows: "Cuervos de la tormenta"
  stormcrows_flavor: "#F Favorecidos por el Abuelo Trueno, los Cuervos de la tormenta actúan principalmente como espías para los Señores de las Sombras, pero pueden ser una fuerza potente cuando son lo suficientemente numerosos.#!"
 
  apis_minotaurs: "Minotauros"
  apis_minotaurs_flavor: "#F Los Apis o Toros de la Luna fueron llevados a la extinción por los Garou, un crimen atroz cometido contra una raza compasiva. Pero no confundas su compasión con debilidad, ya que regresan para vengar sus muertes gracias al poder de la Mnesis de los Mokolé.#!"
 
  camazotz_megachiropteras: "Megaquiroptéras"
  camazotz_megachiropteras_flavor: "#F A través del poder de la Mnesis, los extintos hombres murciélago regresan para volar en las sombras. Sus colmillos están listos para hundirse en aquellos que causaron su desaparición, o en cualquier otro que se interponga en su camino.#!"
 
  grondr_daeodons: "Daeodones"
  grondr_daeodons_flavor: "#F Donde otros podrían retirarse por miedo a la corrupción o a la posesión por parte del $glossary_wyrm$, los Grondr avanzarían, impávidos ante una corrupción abrumadora. Muchos Fera recuerdan a los Grondr de esta manera, y ahora esos recuerdos han sido traídos a la realidad a través de la Mnesis. Ahora los Grondr buscan a los Garou, para purgarlos a ellos y a su corrupción. Pues, ¿por qué otra razón habrían cometido tal traición?.#!"
 
  hoglings: "Hoglings"
  hoglings_flavor: "#F Estas Perdiciones aparecen como densas nubes de vapores nocivos, rodando ominosamente sobre sus objetivos.#!"
  furmlings: "Furmlings"
  furmlings_flavor: "#F Masas luminosas enfermizas de fuego verde, estas Perdiciones propagan el fuego y la destrucción allá donde van.#!"
  hrugglings: "H'rugglings"
  hrugglings_flavor: "#F Estas Perdiciones son montones rodantes de aguas residuales sin tratar, con un hedor y una fuerza impía a juego.#!"
  wakshaani: "Wakshaani"
  wakshaani_flavor: "#F Perdiciones que aparecen como láminas de líquido purpúreo con manchas, venas y verrugas burbujeantes.#!"
  phantasmi: "Phantasmi"
  phantasmi_flavor: "#F Los Phantasmi son restos de fomoré muertos. Estos caparazones buscan destruir lo que sea que los mató.#!"
  bitter_rages: "Rabias amargas"
  bitter_rages_flavor: "#F Perdiciones creadas por el Wyrm en un intento de convertir a todo el mundo en lunáticos.#!"
  meat_puppets: "Marionetas de carne"
  meat_puppets_flavor: "#F Cadáveres poseídos de animales jóvenes y humanos que sufrieron muertes injustas, traídos de vuelta para sembrar la miseria.#!"
  shade_spiders: "Arañas de sombra"
  shade_spiders_flavor: "#F Manos humanas cercenadas que buscan arrastrar a los vivos a su desaparición.#!"
  gray_masses: "Masas grises"
  gray_masses_flavor: "#F Antiguos espíritus del Wyld, ahora su crecimiento fúngico destructivo sirve al Wyrm en su lugar.#!"
  thinbones: "Huesos flacos"
  thinbones_flavor: "#F Perdiciones insaciables de hambre, nacidas en lugares de terrible hambruna.#!"
  glutton_worms: "Gusanos glotones"
  glutton_worms_flavor: "#F Se parecen aproximadamente a un cruce entre una larva gigante y una serpiente hinchada y sin piel; no tienen ojos, solo pliegues de carne pálida de color gris rosáceo que rodean un largo conjunto de mandíbulas similares a las de una barracuda.#!"
  scrags: "Scrags"
  scrags_flavor: "#F Perdiciones guerreras que sirven como soldados del Wyrm en su búsqueda infinita de destrucción.#!"
  nexus_crawlers: "Rastreadores del nexo"
  nexus_crawlers_flavor: "#F Terribles Perdiciones cuya mera presencia corroe y descompone el tejido de la realidad a su alrededor.#!"