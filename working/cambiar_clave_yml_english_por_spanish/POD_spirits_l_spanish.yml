 learn_language_outcome_success.spirits.desc: "Los lenguajes espirituales son tan caprichosos como sus hablantes. Algunos usan patrones reconocibles, otros no. Por suerte, los más extendidos suelen haber pasado por el mismo viaje que los mortales, lo que ha llevado a que se simplifiquen para ser usados por entidades no espirituales.\nDespués de todo, los espíritus necesitan ser entendidos cuando negocian con los visitantes. Aunque es probable que los más astutos también utilicen las complejidades de su lenguaje para intentar llevar la voz cantante en las negociaciones.\nPor eso tomaste precauciones para aprender lo que podría considerarse un vocabulario más especializado, con la esperanza de evitarte el destino de malinterpretar un contrato espiritual en el futuro."

 learn_language_outcome_failure.spirits.desc: "\"Después de mucho trabajo duro... ¡nada! Es #EMP imposible#! aprender este lenguaje espiritual. ¡Por mucho que lo intente, hablo como un bebé recién destetado y balbuceo como un tonto!\n\n¡Bah! Esto ha sido una pérdida de tiempo...\""

