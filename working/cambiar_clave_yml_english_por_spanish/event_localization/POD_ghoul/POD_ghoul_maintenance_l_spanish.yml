l_spanish:
 POD_ghoul_maintenance.1.a: "Necesito un amigo de los Desposeídos"
 POD_ghoul_maintenance.1.b: "Necesito un amigo de los Degolladores de Folch"
 POD_ghoul_maintenance.1.c: "Necesito un amigo de la Orden de San Pantaleón"
 POD_ghoul_maintenance.1.d: "Necesito un amigo de los Asesinos de Haqim"
 POD_ghoul_maintenance.1.back: "He cambiado de opinión"

 POD_ghoul_maintenance.2.t: "Vitae en mis venas"
 POD_ghoul_maintenance.2.desc: "Dado que has usado el Diseñador de Personajes para convertirte en un [ghoul|E], debes seleccionar tu [ghoul_greatest_vitae_ingested|E].\n\n#X ¡Si has elegido un rasgo de [Glossary('Discipline','game_concept_discipline_desc')] avanzada, elegir cualquier [Glossary('Generation','game_concept_vampgeneration_desc')] que no sea la 4ª Generación lo truncará instantáneamente al nivel correcto!#!"

 POD_ghoul_maintenance.50.t: "Rechazado por mi Domitor"
 POD_ghoul_maintenance.50.desc: "Mi [Glossary('Domitor','game_concept_domitor_desc')] me ha retirado su patrocinio. Ya no estoy a su servicio. Ya no me regalarán su sangre vampírica. Sin esa sangre, acabaré envejeciendo y muriendo."
 POD_ghoul_maintenance.50.option.a: "Los odio por esto."
 POD_ghoul_maintenance.50.option.b: "Tal vez sea lo mejor."
 POD_ghoul_maintenance.300.t: "Revenancia"
 POD_ghoul_maintenance.300.desc: "Me he convertido en un [Glossary('Revenant','game_concept_revenant_desc')]."
 POD_ghoul_maintenance.300.option.a: "¡El poder de la sangre!"
 POD_ghoul_thrall_release_option.tt: "Liberará a un esclavo [ghoul|E] de tu servicio."
