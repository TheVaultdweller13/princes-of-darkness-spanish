 POD_natural_disasters.0003.t: "Visión climática"
 POD_natural_disasters.0003.desc: "Tu visión climática ha predicho que habrá un desastre peligroso en [task_contract.MakeScope.Var('target_title').Title.GetName] en [GetGameTimeDifferenceForDiffDays(GetVarTimeRemaining(task_contract.MakeScope,'time_remaining'))].\n\n¿Intervendrás?"
 POD_natural_disasters.0003.desc.coterie: "Tu miembro de la [GetPlayer.Custom('PODCoterieNoTooltip')] [coterie_member.GetFirstNameNicknamed] llega con noticias.\n\nSu visión climática ha predicho que habrá un desastre peligroso en [task_contract.MakeScope.Var('target_title').Title.GetName] en [GetGameTimeDifferenceForDiffDays(GetVarTimeRemaining(task_contract.MakeScope,'time_remaining'))].\n\n¿Intervendrás?"
 
 POD_natural_disasters.0003.tt: "Se ha creado un [task_contract|E] de #bold [task_contract.GetType.GetName]#! en [task_contract.GetLocation.GetName]"
  
 POD_natural_disasters.0005.t: "Perdición inminente"
 POD_natural_disasters.0005.desc: "Llegas a [task_contract.GetLocation.GetName].\n\nSi no haces nada, el próximo [task_contract.MakeScope.Var('disaster_type').GetFlagName|l] causará grandes daños a todo [task_contract.MakeScope.Var('target_title').Title.GetName].\n\n¿Qué harás ahora?"
 POD_natural_disasters.0005.a: "Detendré el [task_contract.MakeScope.Var('disaster_type').GetFlagName|l] con magia climática."
 POD_natural_disasters.0005.b: "¡Me esforzaré por #P mejorar#! el clima en su lugar!"
 POD_natural_disasters.0005.c: "¡Haré que el [task_contract.MakeScope.Var('disaster_type').GetFlagName|l] sea #X;bold aún peor!#!"
 POD_natural_disasters.0005.d: "Proporcionaré alivio a los mortales."
 POD_natural_disasters.0005.e: "Iré más allá para #P apoyar#! a los mortales."
 POD_natural_disasters.0005.f: "He cambiado de opinión."
  
