 POD_natural_disasters.0101.t: "[Localize(SCOPE.GetFlagName('disaster_loc'))]"
 POD_natural_disasters.0101.desc_flood: "Grandes partes de [target_title.GetNameNoTierNoTooltip] fueron arrasadas por el agua."
 POD_natural_disasters.0101.desc_earthquake: "Grandes partes de [target_title.GetNameNoTierNoTooltip] fueron diezmadas por el terremoto."
 POD_natural_disasters.0101.desc_storm: "Un tornado ha azotado [target_title.GetNameNoTierNoTooltip]."
 POD_natural_disasters.0101.desc_great_relief: "No se perdieron vidas, y los esfuerzos de reconstrucción proceden sin problemas gracias a un generoso benefactor."
 POD_natural_disasters.0101.desc_relief: "La mayoría de los mortales lograron reubicarse a tiempo, y el daño a la infraestructura fue mínimo."
 POD_natural_disasters.0101.desc_stopped: "Por suerte, la magia climática de alguien logró contener el desastre antes de que pudiera cobrarse vidas."
 POD_natural_disasters.0101.desc_aggraved: "De repente, el peligro se ha vuelto aún más poderoso de lo que era antes. Nadie puede contar cuántas personas han perecido."
 POD_natural_disasters.0101.desc_default: "Muchísimas personas han muerto en este desastre."
 POD_natural_disasters.0101.option.a: "Oh, naturaleza."