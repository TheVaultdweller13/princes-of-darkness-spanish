  POD_artifacts_book_of_nod.100.t: "El Libro de Nod"
  POD_artifacts_book_of_nod.100.desc: "Una colección de textos antiguos, considerados sagrados para los $pod_cainites$ nodistas. Consiste en múltiples recensiones y fragmentos que han sido reensamblados por varios eruditos. Tradicionalmente, la transmisión principal de la historia de Caín es oral, mientras que los textos con los eventos más importantes de la historia cainita están fuertemente custodiados para proteger la Mascarada.\n\nExisten numerosas preguntas abiertas sobre la historia del Libro de Nod. Su autor es desconocido, aunque a menudo se cita a Malkav, Saulot e incluso a Caín como autores de partes del mismo, si no de su totalidad. Aunque la veracidad de su contenido se pone a menudo en duda, sigue siendo el relato de la historia temprana de los $pod_cainites$ más aceptado.\n\nAlgunos consideran que todo el libro son mitos o mentiras, una historia que los vampiros inventaron para explicar su existencia o una herramienta utilizada para engañar a otros para que piensen y actúen de una determinada manera. A estas dudas se añade el hecho de que muchos escritos atribuidos al Libro de Nod son increíblemente vagos o contradictorios, pareciendo a veces un engaño absoluto, lo que crea algunos cismas de interpretación grandes (y a menudo violentos) entre los grupos nodistas.\nLa pieza más antigua del Libro data de poco antes de la época de Sumer, alrededor del 4500 a.C."
  POD_artifacts_book_of_nod.100.option.a: "Crónica de Caín"
  POD_artifacts_book_of_nod.100.option.b: "Crónica de las Sombras"
  POD_artifacts_book_of_nod.100.option.c: "Crónica de los Secretos"
  POD_artifacts_book_of_nod.100.option.d: "Cerrar el Libro de Nod"
  POD_artifacts_book_of_nod.100.option.e: "Ensamblar la Crónica de Caín"
  POD_artifacts_book_of_nod.100.option.f: "Ensamblar el Libro de Nod"
  POD_artifacts_book_of_nod.200.t: "La Crónica de Caín"
  POD_artifacts_book_of_nod.200.desc: "Caín relata los motivos que le llevaron a su maldición, dando su visión de los acontecimientos que rodearon los días posteriores a la Caída del Hombre, y su historia como Padre Oscuro."
  POD_artifacts_book_of_nod.200.option.a: "El Primer Tiempo"
  POD_artifacts_book_of_nod.200.option.b: "La llegada de Lilith"
  POD_artifacts_book_of_nod.200.option.c: "La magia de Lilith"
  POD_artifacts_book_of_nod.200.option.d: "La tentación de Caín"
  POD_artifacts_book_of_nod.200.option.e: "El relato de Zillah"
  POD_artifacts_book_of_nod.200.option.f: "El relato de la Bruja"
  POD_artifacts_book_of_nod.200.option.g: "El relato de la Primera Ciudad"
  POD_artifacts_book_of_nod.200.option.h: "Tabla de contenidos"
  POD_artifacts_book_of_nod.300.t: "Crónica de las Sombras"
  POD_artifacts_book_of_nod.300.desc: "Una Crónica de 'El Libro de Nod'. Una colección de piezas y fragmentos que se debate si forman parte siquiera del Libro de Nod. Hay analistas que afirman que esta sección fue diluida por los eruditos y escritores de Cartago, que se tomaron licencias poéticas para escribir las 'Leyes de Caín'. Incluso se ha dicho que la Crónica de las Sombras es solo una colección de propaganda creada por la Camarilla para apoyar su reinado tiránico. Mientras que algunos creen que se trata de una elaborada broma Malkavian, otros creen que estos textos proceden directamente del propio Padre Oscuro, especialmente los trece mandamientos que se entregaron en tablillas auténticamente envejecidas."
  POD_artifacts_book_of_nod.300.desc.notale: "No posees una copia de la 'Crónica de las Sombras'."
  POD_artifacts_book_of_nod.300.option.a: "Continuar leyendo"
  POD_artifacts_book_of_nod.400.t: "Crónica de los Secretos"
  POD_artifacts_book_of_nod.400.desc: "Una Crónica de 'El Libro de Nod'. Contiene profecías y visiones de un evento llamado Gehenna. A algunos les parece que las preocupaciones por este evento han pasado de generación en generación y han causado una oleada de paranoia y miedo que continúa resonando a través de los cainitas y la canalla."
  POD_artifacts_book_of_nod.400.desc.notale: "No posees una copia de la 'Crónica de los Secretos'."
  POD_artifacts_book_of_nod.400.option.a: "Continuar leyendo"
  POD_artifacts_book_of_nod.500.t: "El Primer Tiempo"
  POD_artifacts_book_of_nod.500.desc: "Sueño con el primer tiempo\nel recuerdo más largo\nhablo del primer tiempo\nel Padre más antiguo\ncanto del primer tiempo\ny del amanecer de la Oscuridad\nEn Nod\ndonde la luz del Paraíso\niluminaba el cielo nocturno\ny las lágrimas de nuestros padres mojaban el suelo.\n\nCada uno de nosotros, a su manera,\nse dispuso a vivir\ny a tomar su sustento de la tierra."
  POD_artifacts_book_of_nod.500.desc.notale: "No posees una copia de 'El Primer Tiempo'." 
  POD_artifacts_book_of_nod.500.option.a: "Continuar leyendo El Primer Tiempo"
  POD_artifacts_book_of_nod.500.option.b: "Volver a la Crónica de Caín"
  POD_artifacts_book_of_nod.510.t: "El Primer Tiempo, continuación"
  POD_artifacts_book_of_nod.510.desc: "Y yo, Caín el primogénito, yo,\ncon cosas afiladas\nplanté las semillas oscuras\nlas mojé en la tierra\nlas cuidé, las vi crecer\nY Abel, Abel el segundo hijo\ncuidaba los animales\nayudaba en sus partos sangrientos\nlos alimentaba, los veía crecer.\nYo le amaba, a mi Hermano\nÉl era el más brillante, el más dulce, el más fuerte.\nÉl era la primera parte de toda mi alegría."
  POD_artifacts_book_of_nod.510.option.b: "Pasaje anterior"
  POD_artifacts_book_of_nod.520.t: "El Primer Tiempo, continuación"
  POD_artifacts_book_of_nod.520.desc: "Entonces un día nuestro Padre nos dijo.\nCaín, Abel, a Aquel de Arriba\ndebéis hacer un sacrificio -\nun regalo de la primera parte\nde todo lo que tenéis\nY yo, Caín el primogénito, yo\nreuní los brotes tiernos\nlos frutos más brillantes\nla hierba más dulce\nY Abel, Abel el segundo hijo\nsacrificó al más joven,\nal más fuerte,\nal más dulce de sus animales."
  POD_artifacts_book_of_nod.530.t: "El Primer Tiempo, continuación"
  POD_artifacts_book_of_nod.530.desc: "En el altar de nuestro Padre\npusimos nuestros sacrificios\ny encendimos fuego bajo ellos\ny vimos cómo el humo los llevaba\nhasta el Único de Arriba\n\nEl sacrificio de Abel, el segundo hijo,\nolió dulce para el Único de Arriba\ny Abel fue bendecido.\nY yo, Caín el primogénito, yo\nfui golpeado desde el más allá por\nuna palabra dura y una maldición,\npues mi sacrificio era indigno."
  POD_artifacts_book_of_nod.540.t: "El Primer Tiempo, continuación"
  POD_artifacts_book_of_nod.540.desc: "Miré el sacrificio de Abel, aún humeante, la carne, la sangre.\nLloré, me tapé los ojos\nrecé noche y día.\n\nY cuando el Padre dijo\nha llegado de nuevo el tiempo del Sacrificio\nY Abel llevó a su más joven,\na su más dulce,\na su más amado\nal fuego del sacrificio\nyo no traje a mi más joven,\na mi más dulce,\npues sabía que el Único de Arriba no los querría."
  POD_artifacts_book_of_nod.550.t: "El Primer Tiempo, continuación"
  POD_artifacts_book_of_nod.550.desc: "Y mi hermano, el amado Abel, me dijo\n'Caín, no has traído un sacrificio,\nun regalo de la primera parte de tu alegría,\npara quemar en el altar del Único de Arriba'.\n\nLloré lágrimas de amor mientras yo, con cosas afiladas,\nsacrifiqué aquello que era la primera parte de mi alegría,\nmi hermano.\n\nY la Sangre de Abel cubrió el altar\ny olió dulce mientras ardía." 
  POD_artifacts_book_of_nod.560.t: "El Primer Tiempo, continuación"
  POD_artifacts_book_of_nod.560.desc: "Pero mi Padre dijo\n'Maldito seas, Caín, que mataste a tu hermano.\nComo yo fui expulsado\nasí lo serás tú'.\n\nY Él me exilió a vagar en la Oscuridad,\nla tierra de Nod.\n\nVolé hacia la Oscuridad\nno vi ninguna fuente de luz\ny tuve miedo.\nY estaba solo."
  POD_artifacts_book_of_nod.600.t: "La llegada de Lilith"
  POD_artifacts_book_of_nod.600.desc: "Estaba solo en la Oscuridad\nY sentí hambre.\nEstaba solo en la Oscuridad\nY sentí frío.\nEstaba solo en la Oscuridad\nY lloré.\n\nEntonces llegó a mí una voz dulce,\nuna voz de miel,\npalabras de socorro.\npalabras de consuelo.\n\nUna mujer, oscura y encantadora,\ncon ojos que perforaban la Oscuridad\nllegó a mí.\n\n"
  POD_artifacts_book_of_nod.600.desc.notale: "No posees una copia de 'La llegada de Lilith'."  
  POD_artifacts_book_of_nod.600.option.a: "Continuar leyendo La llegada de Lilith"
  POD_artifacts_book_of_nod.610.t: "La llegada de Lilith, continuación"
  POD_artifacts_book_of_nod.610.desc: "'Conozco tu historia. Caín de Nod'.\nDijo ella, sonriendo.\n'Tienes hambre. ¡Ven! Tengo comida.\nTienes frío. ¡Ven! Tengo ropa.\nEstás triste. ¡Ven! Tengo consuelo.\n\n'¿Quién consolaría a uno tan Maldito como yo?\n¿Quién me vestiría?\n¿Quién me alimentaría?'\n\n'Soy la primera esposa de tu Padre,\nque no estuvo de acuerdo con el Único de Arriba\ny obtuvo la Libertad en la Oscuridad.\nSoy Lilith."
  POD_artifacts_book_of_nod.620.t: "La llegada de Lilith, continuación"
  POD_artifacts_book_of_nod.620.desc: "'Una vez, tuve frío, y no hubo calor para mí.\nUna vez, tuve hambre y no hubo comida para mí.\nUna vez, estuve triste, y no hubo consuelo para mí'.\nElla me acogió, me alimentó.\nElla me vistió.\nEn sus brazos encontré consuelo.\nLloré hasta que la sangre goteó de mis ojos\ny ella las borró con sus besos."
  POD_artifacts_book_of_nod.700.t: "La magia de Lilith"
  POD_artifacts_book_of_nod.700.desc: "Y habité por un tiempo en la Casa de Lilith\ny le pregunté\n'De la Oscuridad,\n¿cómo construiste este lugar?\n¿Cómo hiciste la ropa?\n¿Cómo cultivaste la comida?'\n\nY Lilith sonrió y dijo.\n'A diferencia de ti, yo estoy Despierta.\nVeo los Hilos que Giran\na tu alrededor, yo hago aquello\nque necesito a partir del Poder'."
  POD_artifacts_book_of_nod.700.desc.notale: "No posees una copia de 'La magia de Lilith'." 
  POD_artifacts_book_of_nod.700.option.a: "Continuar leyendo La magia de Lilith"
  POD_artifacts_book_of_nod.710.t: "La magia de Lilith, continuación"
  POD_artifacts_book_of_nod.710.desc: "'Despiértame, entonces, Lilith'. Dije.\n'Tengo necesidad de este Poder.\nEntonces, podré hacer mi propia ropa,\nhacer mi propia comida,\nhacer mi propia Casa'.\n La preocupación surcó la frente de Lilith.\n 'No sé qué te hará\nel Despertar,\npues estás verdaderamente Maldito por tu Padre.\nPodrías morir.\nPodrías cambiar para siempre'."
  POD_artifacts_book_of_nod.720.t: "La magia de Lilith, continuación"
  POD_artifacts_book_of_nod.720.desc: "Caín dijo: 'Aun así, una vida sin Poder no valdrá la pena vivirla.\nMoriría sin tus dones.\nNo viviré como tu Esclavo'.\n\nLilith me amaba, y yo lo sabía.\nLilith haría lo que yo le pedía,\naunque ella no lo deseaba." 
  POD_artifacts_book_of_nod.730.t: "La magia de Lilith, continuación"
  POD_artifacts_book_of_nod.730.desc: "Y así, Lilith, Lilith la de ojos brillantes, me Despertó.\nSe cortó con un cuchillo,\nsangró para mí en un cuenco.\nBebí profundamente. Era dulce.\n\nY entonces caí en el Abismo.\nCaí para siempre, cayendo\nen la oscuridad más profunda."  
  
  POD_artifacts_book_of_nod.800.t: "La tentación de Caín"
  POD_artifacts_book_of_nod.800.desc: "Y de la Oscuridad\nllegó una luz brillante y resplandeciente -\nfuego en la noche.\nY el arcángel Miguel se me reveló.\n\nNo tuve miedo. Le pregunté a qué venía.\nMiguel, General del Cielo,\nportador de la Llama sagrada,\nme dijo:\n'Hijo de Adán, Hijo de Eva, tu crimen es grande,\ny sin embargo la misericordia de mi Padre también es grande.\n¿No te arrepentirás del mal que has hecho, y dejarás que su misericordia te limpie?'"
  POD_artifacts_book_of_nod.800.desc.notale: "No posees una copia de 'La tentación de Caín'."  
  POD_artifacts_book_of_nod.800.option.a: "Continuar leyendo La tentación de Caín"
  POD_artifacts_book_of_nod.810.t: "La tentación de Caín, continuación"
  POD_artifacts_book_of_nod.810.desc: "Y le dije a Miguel,\n'No por la gracia de (el Único de Arriba), sino por la mía propia\nviviré, con orgullo'.\n\nMiguel me maldijo, diciendo\n'Entonces, mientras camines por esta tierra,\ntú y tus hijos temeréis mi llama viva,\ny morderá profundamente y saboreará vuestra carne'\n\nY por la mañana, Rafael llegó sobre alas radiantes,\nluz sobre el horizonte,\nel conductor del Sol,\nguardián del Este." 
  POD_artifacts_book_of_nod.820.t: "La tentación de Caín, continuación"
  POD_artifacts_book_of_nod.820.desc: "Rafael habló, diciendo\n'Caín, hijo de Adán, hijo de Eva,\ntu hermano Abel te perdona tu pecado\n¿no te arrepentirás y aceptarás la misericordia del Todopoderoso?'\n\nY le dije a Rafael:\n'No por el perdón de Abel, sino por el mío propio,\nseré perdonado'."  
  POD_artifacts_book_of_nod.830.t: "La tentación de Caín, continuación"
  POD_artifacts_book_of_nod.830.desc: "Rafael me maldijo, diciendo\n'Entonces, mientras camines por esta tierra,\ntú y tus hijos temeréis el amanecer,\ny los rayos del sol buscarán quemaros como el fuego,\ndondequiera que os escondáis, siempre.\nEscóndete ahora, pues el Sol se levanta para descargar su ira sobre ti.\n\nPero encontré un lugar secreto en la tierra\ny me escondí de la luz ardiente del Sol.\nEn lo profundo de la tierra, dormí hasta que la Luz del Mundo se ocultó tras la montaña de la Noche'."
  POD_artifacts_book_of_nod.840.t: "La tentación de Caín, continuación"
  POD_artifacts_book_of_nod.840.desc: "Cuando desperté de mi día de sueño, oí el sonido de unas alas suaves y veloces y vi las alas negras de Uriel envolviéndome — Uriel, segador, Ángel de la Muerte, el oscuro Uriel que habita en las tinieblas.\n\nUriel me habló en voz baja, diciendo: 'Hijo de Adán. Hijo de Eva. Dios Todopoderoso ha perdonado tu pecado. ¿Aceptarás su misericordia y dejarás que te lleve a tu recompensa, ya no maldito?\"\n\nY le dije al oscuro Uriel,\n'No por la misericordia de Dios, sino por la mía propia, viviré.\nSoy lo que soy, hice lo que hice,\ny eso nunca cambiará'."
  POD_artifacts_book_of_nod.850.t: "La tentación de Caín, continuación"
  POD_artifacts_book_of_nod.850.desc: "Y entonces, a través del temible Uriel\nDios Todopoderoso me maldijo, diciendo\n'Entonces, mientras camines por esta tierra,\ntú y tus hijos os aferraréis a la Oscuridad\nBeberéis solo sangre\nComeréis solo cenizas\nSeréis siempre como erais al morir,\nSin morir nunca, siguiendo adelante.\nCaminaréis para siempre en la Oscuridad,\ntodo lo que toquéis se desmoronará en la nada,\nhasta los últimos días'." 
  POD_artifacts_book_of_nod.860.t: "La tentación de Caín, continuación"
  POD_artifacts_book_of_nod.860.desc: "Lancé un grito de angustia ante esta terrible maldición y desgarré mi carne.\nLloré sangre,\nrecogí las lágrimas en una copa\ny las bebí.\n\nCuando levanté la vista de mi bebida de dolor\nel arcángel Gabriel\nel gentil Gabriel\nGabriel, Señor de la Misericordia\nse me apareció."  
  POD_artifacts_book_of_nod.870.t: "La tentación de Caín, continuación"
  POD_artifacts_book_of_nod.870.desc: "El arcángel Gabriel me dijo,\n'Hijo de Adán, Hijo de Eva,\nHe aquí, la misericordia del Padre es mayor\nde lo que jamás podrás saber\npues incluso ahora hay un camino abierto\nuna senda de Misericordia\ny llamarás a esta senda [golconda|E].\nY cuéntaselo a tus hijos,\npues por esa senda podrán llegar\na habitar una vez más en la Luz'."
  POD_artifacts_book_of_nod.875.t: "La tentación de Caín, continuación"
  POD_artifacts_book_of_nod.875.desc: "Y con eso, la oscuridad se levantó\n como un velo\n y la única luz eran los ojos brillantes de Lilith.\n\nMirando a mi alrededor, supe\nque había Despertado.\nCuando mis energías surgieron por primera vez\na través de mí\ndescubrí\ncómo moverme como el rayo\ncómo tomar prestada la fuerza de la tierra\ncómo ser como la piedra\nEsto era para mí como lo fue una vez respirar."  
  POD_artifacts_book_of_nod.880.t: "La tentación de Caín, continuación"
  POD_artifacts_book_of_nod.880.desc: "Lilith me mostró entonces\ncómo se oculta de los cazadores\ncómo ordena obediencia\ny cómo exige respeto\n\nEntonces, Despertándome más, encontré\nla forma de alterar las formas\nla forma de tener dominio sobre los animales\nla forma de hacer que los ojos vean la visión"   
  POD_artifacts_book_of_nod.885.t: "La tentación de Caín, continuación"
  POD_artifacts_book_of_nod.885.desc: "Entonces Lilith ordenó que me detuviera, diciendo que\nhabía sobrepasado mis límites\nQue había ido demasiado lejos\nQue amenazaba mi esencia misma. Usó sus poderes y me ordenó que me detuviera. Debido a su poder, le hice caso,\npero en lo profundo de mí se plantó una semilla, una semilla de rebelión\ny cuando ella apartó su rostro de mí,\nme abrí una vez más a la Noche,\ny vi las infinitas posibilidades en las estrellas\ny supe que una senda de poder, una senda de Sangre\nera mía para tomarla,\ny así desperté en mí esta Senda Final,\nde la que todas las demás sendas crecerían."    
  POD_artifacts_book_of_nod.890.t: "La tentación de Caín, continuación"
  POD_artifacts_book_of_nod.890.desc: "Con este nuevo poder, rompí los vínculos\nque la Dama de la Noche me impuso\nDejé a la Reina Condenada esa noche,\nenvolviéndome en sombras,\nhuí de las tierras de Nod\ny llegué por fin a un lugar\ndonde ni siquiera sus demonios podían encontrarme."
  POD_artifacts_book_of_nod.900.t: "El relato de Zillah"
  POD_artifacts_book_of_nod.900.desc: "Dejadme contar el relato de Zillah\nprimera amada de Caín,\nprimera esposa de Caín,\nla sangre más dulce,\nla piel más suave,\nlos ojos más claros\n\nSola entre los nuevos Chiquillos de Caín,\nCaín la deseó,\ny ella no hizo caso de su deseo, apartándose de Él.\nNi regalos, ni sacrificios, ni perfumes, ni palomas,\nni hermosos bailarines, ni cantantes, ni bueyes,\nni esculturas, ni hermosas ropas,\nnada haría que el corazón de Zillah pasara\nde piedra a dulce fruto."
  POD_artifacts_book_of_nod.900.desc.notale: "No tienes una copia de 'El relato de Zillah'"
  POD_artifacts_book_of_nod.900.option.a: "Continuar leyendo El relato de Zillah"
  POD_artifacts_book_of_nod.910.t: "El relato de Zillah, continuación"
  POD_artifacts_book_of_nod.910.desc: "Así que Caín se tiró de la barba\ny se arrancó los cabellos\ny se dedicó a vagar por los parajes salvajes\nde noche, pensando en ella,\nardiendo por ella,\ny una noche Caín se encontró con\nuna vieja Bruja cantando a la luna.\n\nCaín dijo a la Bruja,\n\"¿Por qué cantas así?\"\nY la Bruja respondió,\n'Porque anhelo lo que no puedo tener...'."  
  POD_artifacts_book_of_nod.920.t: "El relato de Zillah, continuación"
  POD_artifacts_book_of_nod.920.desc: "Caín dijo a la Bruja,\n'Yo también anhelo. ¿Qué se puede hacer?'' \n\nLa Bruja sonrió y dijo,\n'Bebe de mi sangre esta noche,\nCaín, Padre de los Vástagos,\ny vuelve mañana por la noche.\nEntonces te contaré la sabiduría de la Luna'.\nCaín bebió del cuello desnudo de la Bruja,\ny partió."
  POD_artifacts_book_of_nod.930.t: "El relato de Zillah, continuación"
  POD_artifacts_book_of_nod.930.desc: "La noche siguiente, Caín encontró a la Bruja durmiendo sobre una roca.\n'Despierta, Bruja', dijo Caín.\n'He vuelto'.\n\nLa Bruja abrió un ojo y dijo,\n'Sueño con la solución para ti esta noche. Bebe una vez más de mí,\ny luego vuelve mañana por la noche.\nTrae un cuenco de arcilla.\nTrae un cuchillo afilado.\nTendré tu respuesta entonces'."
  POD_artifacts_book_of_nod.940.t: "El relato de Zillah, continuación"
  POD_artifacts_book_of_nod.940.desc: "Una vez más, Caín tomó sangre de la Bruja,\nquien inmediatamente volvió a caer en un profundo sueño.\n\nCuando Caín regresó la noche siguiente,\nla Bruja le miró y sonrió,\n'Saludos, Señor de la Bestia', dijo la Bruja.\n'Tengo la sabiduría que buscas'.\n'Toma un poco de mi sangre,\nen el cuenco que tienes,\ny mezcla estas bayas\ny estas hierbas,\ny bebe profundamente del elixir'." 
  POD_artifacts_book_of_nod.950.t: "El relato de Zillah, continuación"
  POD_artifacts_book_of_nod.950.desc: "'Serás irresistible.\nSerás potente.\nSerás magistral.\nSerás ardiente.\nSerás resplandeciente.\nEl corazón de Zillah se derretirá\ncomo las nieves en primavera'.\n\nY así, Caín bebió del elixir de la Bruja,\nporque estaba tan enamorado de Zillah,\ny tanto deseaba su amor a cambio."
  POD_artifacts_book_of_nod.960.t: "El relato de Zillah, continuación"
  POD_artifacts_book_of_nod.960.desc: "Y la Bruja se rió. La Bruja se rió a carcajadas. ¡Le había engañado! ¡Le había atrapado! Caín estaba furioso más allá de toda comparación. Caín extendió sus poderes, para despedazar a esta Bruja con su fuerza.\n\nLa Bruja soltó una carcajada y dijo: 'No lo hagas'\nY Caín no pudo hacer nada contra ella.\nLa Bruja se rió entre dientes y dijo: 'Ámame'.\nY Caín no pudo hacer otra cosa que mirar sus ojos antiguos, desear su piel curtida.\nLa Bruja se rió y dijo: 'Hazme inmortal'.\nY Caín la Abrazó. Ella volvió a soltar una carcajada, rió con el puro éxtasis del Abrazo, pues no le dolió." 
  POD_artifacts_book_of_nod.970.t: "El relato de Zillah, continuación"
  POD_artifacts_book_of_nod.970.desc: "'Te he hecho poderoso. Caín de Enoch, Caín de Nod,\npero estarás para siempre vinculado a mí. ¡Te he hecho señor de todo, pero nunca me olvidarás!\nTu sangre, potente como es ahora,\nvinculará a quienes la beban,\ncomo hiciste tú, una vez por noche durante tres noches.\nTú serás el maestro.\nEllos serán tus esclavos, como tú eres mía.\nPues aunque Zillah te amará, como querías,\ntú me amarás a mí, para siempre.\nVe ahora, y reclama a tu encantadora novia,\nte esperaré en los lugares más oscuros,\nmientras preparo más pociones para tu salud'." 
  POD_artifacts_book_of_nod.980.t: "El relato de Zillah, continuación"
  POD_artifacts_book_of_nod.980.desc: "Y así, con el corazón apesadumbrado,\nCaín regresó a Enoch.\nY cada noche,\ndurante tres noches,\nZillah bebió de su Sire,\naunque ella no lo sabía.\nY, en la tercera noche,\nCaín anunció que se casaría con\nZillah, su más dulce Chiquilla,\ny ella aceptó." 
  POD_artifacts_book_of_nod.1000.t: "El relato de la Bruja"
  POD_artifacts_book_of_nod.1000.desc: "Durante un año y un día\nCaín trabajó al servicio\nde la Bruja, quien con sabiduría de sangre\nle vinculó tan firmemente como a cualquier prisionero.\nElla le visitaba por la noche\nle obligaba a entregar su sangre\npara sus elixires secretos\ny potentes fórmulas\nElla tomaba a los Chiquillos de sus Chiquillos,\ny nunca más se sabía de ellos.\n\nPero Caín era sabio. No volvió a beber de ella nunca más.\nY ella no se lo pidió, pensando\nque él estaba siempre bajo su Vínculo."
  POD_artifacts_book_of_nod.1000.desc.notale: "No tienes una copia de 'El relato de la Bruja'"
  POD_artifacts_book_of_nod.1000.option.a: "Continuar leyendo El relato de la Bruja"
  POD_artifacts_book_of_nod.1010.t: "El relato de la Bruja, continuación"
  POD_artifacts_book_of_nod.1010.desc: "Una noche, Caín fue a ver a la Bruja al bosque\ny le habló de los terribles sueños que tenía durante su sueño.\n\n'Temo por mi vida, Bruja.\nTemo la profecía de Uriel,\ny el ansia de mis Hijos por mi sangre.\nCuéntame conocimientos secretos, para que pueda\nser poderoso contra los míos'.\n\nY la Bruja fue a un árbol hecho de madera de gofer,\ny rompió una rama.\nTomó un cuchillo afilado\ny afiló la rama."
  POD_artifacts_book_of_nod.1020.t: "El relato de la Bruja, continuación"
  POD_artifacts_book_of_nod.1020.desc: "'Toma este trozo de madera viva,\nafilado, fuerte,\nperfora el corazón de tu chiquillo descarriado.\nLo dejará inmóvil,\ny bajo tu mando.\nEn lugar de darse un festín con la sangre de tu corazón,\nsentirá el peso de tu justicia'.\n\nCaín dijo: 'Gracias, Madre', y\ncon eso, moviéndose con rapidez,\nCaín tomó la estaca de madera de gofer,\nla asió y la clavó\nprofundamente en el corazón de la Bruja."
  POD_artifacts_book_of_nod.1030.t: "El relato de la Bruja, continuación"
  POD_artifacts_book_of_nod.1030.desc: "Porque Caín, el sabio Caín\nno se había alimentado de ella durante un año y un día\ny porque forzó su Voluntad a través de\nsus manos, rompió el Vínculo que ella tenía\nsobre él, y cambió su suerte.\n\nElla volvió a reír, mientras la sangre brotaba\ny salía de su boca.\nSus ojos destilaban odio.\nCaín la besó una vez,\nbesó sus labios fríos y marchitos,\ny la dejó allí\nante la gentil sonrisa de Rafael: el sol que sale."
  POD_artifacts_book_of_nod.1040.t: "El relato de la Bruja, continuación"
  POD_artifacts_book_of_nod.1040.desc: ""
  POD_artifacts_book_of_nod.1050.t: "El relato de la Bruja, continuación"
  POD_artifacts_book_of_nod.1050.desc: "" 
 
  POD_artifacts_book_of_nod.1100.t: "El relato de la Primera Ciudad"
  POD_artifacts_book_of_nod.1100.desc: "Al principio solo existía Caín\nCaín que sacrificó a su hermano por\namor.\nCaín que fue expulsado.\nCaín que fue maldito para siempre con la inmortalidad.\nCaín que fue maldito con el ansia de sangre,\nEs de Caín de quien todos venimos,\nel Sire del Sire de nuestro Sire.\n\nDurante el paso de una era vivió en la tierra de Nod.\nEn soledad y sufrimiento\nDurante un eón permaneció solo\npero el paso de la memoria ahogó su pesar."
  POD_artifacts_book_of_nod.1100.desc.notale: "No tienes una copia de 'El relato de la Primera Ciudad'"
  POD_artifacts_book_of_nod.1100.option.a: "Continuar leyendo El relato de la Primera Ciudad" 
  POD_artifacts_book_of_nod.1110.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1110.desc: "Y así regresó al mundo de los mortales,\nal mundo que su hermano Set, el tercer hijo de Eva,\ny los hijos de Set habían creado.\nRegresó y fue bienvenido.\nPues nadie se volvería contra él,\ndebido a la Marca que le fue impuesta.\n\nLa gente vio su poder y le adoró,\nse hizo poderoso, y su poder era fuerte,\nsus formas de asombro y mando eran grandes\nY los Hijos de Set le hicieron Rey\nde su gran Ciudad, la Primera Ciudad."
  POD_artifacts_book_of_nod.1115.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1115.desc: "Pero Caín se sintió solo en su Poder.\nEn lo profundo de él, la semilla de la soledad floreció, y creció una flor oscura\nVio en su sangre la potencia de la fertilidad\nInvocando demonios y escuchando la sabiduría susurrada\naprendió la forma de crear un hijo para sí mismo.\nLlegó a conocer su poder y, al hacerlo,\ndecidió Abrazar a uno de los que estaban cerca de él."
  POD_artifacts_book_of_nod.1120.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1120.desc: "Y, he aquí, Uriel, el Temible Uriel, se reveló a Caín\nesa misma noche y le dijo,\n'Caín, aunque poderoso eres, y marcado por Dios,\nsabe esto: que cualquier Chiquillo que crees\nllevará tu maldición, que cualquiera de tu Progenie\ncaminará para siempre en la Tierra de Nod, y\ntemerá la llama y el sol, bebiendo solo sangre\ny comiendo solo cenizas. Y puesto que llevarán la semilla celosa de su padre, conspirarán y lucharán para siempre entre ellos.\nNo condenes a aquellos de los nietos de Adán que buscan caminar en la rectitud. ¡Caín!\n¡Detén tu temible Abrazo!'"
  POD_artifacts_book_of_nod.1125.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1125.desc: "Aun así, Caín sabía lo que debía hacer, y un joven\nllamado Enoch, que era el más amado de los parientes de Set,\nsuplicó ser hecho Hijo del Padre oscuro.\n\nY Caín, aunque consciente de las palabras de Uriel,\ntomó a Enoch, y lo envolvió en el oscuro Abrazo.\n\nY así, sucedió que Caín engendró a\nEnoch y, al hacerlo, llamó a la Primera Ciudad Enoch."
  POD_artifacts_book_of_nod.1130.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1130.desc: "Y al hacerlo, Enoch suplicó por un hermano,\nuna hermana, y Caín, Padre indulgente,\nse los dio, y sus nombres fueron\nZillah, cuya sangre era la más favorecida por Caín,\ne Irad, cuya fuerza servía al brazo de Caín.\n\nY estos Vástagos de Caín aprendieron las formas\nde crear Progenie propia, y\nAbrazaron a más parientes de Set, sin pensar.\n\nY entonces el sabio Caín dijo: 'Fin a este crimen.\nNo habrá más'.\nY como la palabra de Caín era la ley, su Prole le obedeció."
  POD_artifacts_book_of_nod.1135.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1135.desc: "La ciudad se mantuvo durante muchas eras,\ny se convirtió en el centro de un poderoso Imperio.\nCaín se acercó a aquellos que no eran como él.\nLos hijos de Set le conocieron\ny él, a su vez, les conoció a ellos\npero el mundo se oscureció con el pecado.\n\nLos Hijos de Caín vagaban por aquí y por allá, entregándose a sus oscuros caminos. Caín sintió ira cuando sus hijos luchaban. Descubrió el engaño cuando los vio hacerse la guerra de palabras. Sintió tristeza cuando los vio abusar de los hijos de Set. Caín leyó las señales en el cielo que se oscurecía, pero no dijo nada."
  POD_artifacts_book_of_nod.1140.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1140.desc: "Entonces llegó el gran Diluvio, una gran inundación que cubrió el mundo.\nLa Ciudad fue destruida,\nlos hijos de Set con ella.\n\nDe nuevo, Caín cayó en un gran pesar y se retiró a la soledad.\nY nos dejó a nosotros, su Progenie, a nuestra suerte.\nLe encontramos, tras mucho buscar, en lo profundo de la tierra,\ny nos ordenó partir, diciendo que el Diluvio era un castigo,\npor haber regresado al mundo de la vida\ny subvertido la verdadera ley.\nNos pidió que nos fuéramos, para poder dormir."
  POD_artifacts_book_of_nod.1145.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1145.desc: "Así que regresamos solos para encontrar a los hijos de Noé,\ny anunciamos que éramos los nuevos gobernantes.\n\nCada uno creó una Prole, para reclamar la gloria de Caín,\npero no teníamos su sabiduría ni su moderación.\nSe libró una gran guerra, los Antiguos contra sus Hijos,\ntal como Uriel había dicho, y los Hijos mataron a sus padres.\nSe levantaron. Usaron fuego y madera. Espadas y garras.\nPara destruir a quienes los habían creado.\n\nLos rebeldes construyeron entonces una nueva ciudad. Del Imperio caído, reunieron a los Trece clanes que habían sido dispersados por la Gran Guerra, y los juntaron a todos,"
  POD_artifacts_book_of_nod.1150.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1150.desc: "Trajeron al Clan de la Realeza,\nal Clan de la Bestia,\nal Clan de la Luna,\nal Clan de los Ocultos,\nal Clan de los Vagabundos,\nal Clan de la Rosa,\nal Clan de la Noche,\nal Clan de los Escultores,\nal Clan de la Serpiente,\nal Clan de la Muerte,\nal Clan de los Sanadores,\nal Clan de la Caza,\ny al Clan de los Eruditos."
  POD_artifacts_book_of_nod.1155.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1155.desc: "Hicieron una ciudad hermosa,\ny la gente los adoraba como a dioses.\n\nCrearon nueva Progenie propia,\nla Cuarta Generación de cainitas.\nPero temían la Yihad,\nla Profecía de Uriel,\ny se prohibió a esos Hijos\ncrear a otros de su clase.\nEste poder sus Antiguos se lo guardaron para sí mismos.\nCuando se creaba un Chiquillo, era cazado y muerto,\ny su Sire con él."
  POD_artifacts_book_of_nod.1160.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1160.desc: "Aunque Caín estaba lejos de nosotros,\nsentíamos su ojo atento vigilándonos,\ny sabíamos que marcaba nuestros movimientos y nuestros caminos.\nMaldijo a Malkav, cuando este difamó su imagen\ny le condenó a la locura, para siempre.\nCuando se descubrió que Absimiliard se entregaba a sus gustos de formas viles con sus propios Hijos,\nCaín puso su mano sobre Absimiliard,\ny le dijo que para siempre llevaría su maldad y retorció su semblante."
  POD_artifacts_book_of_nod.1165.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1165.desc: "Nos maldijo a todos, por matar a la primera parte de sus Hijos, la Segunda Generación,\npues los habíamos cazado uno por uno,\nZillah la Bella, Irad el Fuerte y Enoch el Primer Gobernante.\nY los lloramos a todos, pues éramos todos de una misma clase,\ny todas las familias de los chiquillos de Caín.\n\nAunque esta ciudad era tan grande como la de Caín,\ncon el tiempo envejeció.\nComo todas las cosas vivas, lentamente comenzó a morir."
  POD_artifacts_book_of_nod.1170.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1170.desc: "Los dioses al principio no vieron la verdad,\ny cuando por fin miraron a su alrededor era demasiado tarde.\nPues, como Uriel había dicho,\nla semilla del Mal plantada floreció como una rosa roja como la sangre.\nY Troile, el Hijo del Hijo del Hijo de Caín\nse levantó, y mató a su Padre, Brujah.\nY comió de su carne.\nEntonces la guerra sacudió la ciudad\ny nada pudo volver a ser como era."
  POD_artifacts_book_of_nod.1175.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1175.desc: "Los Trece vieron su ciudad destruida y su poder extinguido,\ny se vieron obligados a huir, su Progenie junto con ellos.\nPero muchos murieron en la huida, pues se habían vuelto débiles.\n\nCon su autoridad desaparecida,\ntodos fueron libres de crear sus propias Proles,\ny pronto hubo muchos nuevos Vástagos,\nque gobernaron sobre la faz de la Tierra.\nPero esto no podía durar.\n\nCon el tiempo, llegó a haber demasiados Vástagos\ny entonces hubo guerra una vez más,"
  POD_artifacts_book_of_nod.1180.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1180.desc: "Los Antiguos ya estaban profundamente escondidos,\npues habían aprendido la precaución,\npero sus Hijos habían fundado sus propias ciudades y Proles,\ny son ellos quienes murieron en la gran oleada de guerra.\nHubo una guerra tan total, que no queda nadie de esa Generación\npara hablar de sí mismos por más tiempo.\nOleadas de carne mortal fueron enviadas a través de los continentes\npara aplastar y quemar las ciudades de los Vástagos.\nLos mortales pensaban que estaban librando sus propias guerras.\nPero fue por nosotros por quienes derramaron su sangre."
  POD_artifacts_book_of_nod.1185.t: "El relato de la Primera Ciudad, continuación"
  POD_artifacts_book_of_nod.1185.desc: "Una vez terminada esta guerra,\ntodos los Vástagos se escondieron unos de otros\ny de los humanos que los rodeaban.\nEscondidos permanecemos hoy,\npues la Yihad continúa todavía.\nY nadie dirá cuándo se levantará Caín de nuevo,\nde su sueño en la tierra,\ny llamará a la ciudad Gehenna,\nla Última Ciudad, la Ciudad del Juicio.\nLa Yihad continúa todavía."
  POD_artifacts_book_of_nod.1185.option.f: "Revivir la cultura de la Primera Ciudad"
