l_spanish:

 POD_midnight_circus.100.t: "El Antiguo Carnaval Lunar y el Circo de Medianoche"
 POD_midnight_circus.100.option.a: "¡Visitar el Carnaval!"
 POD_midnight_circus.100.option.b: "Permitir el Carnaval, pero prohibir la asistencia a tus vasallos y cortesanos."
 POD_midnight_circus.100.option.c: "¡Expulsar al Carnaval de tu dominio!"
 POD_midnight_circus.100.desc: "Un misterioso carnaval ha llegado a tu dominio. Trovadores errantes invitan a la gente a venir y experimentar las maravillas de su Teatro y Feria. Muchos dicen que sería una buena diversión desenfadada, pero otros desconfían de los visitantes por considerarlos de algún modo desagradables."
