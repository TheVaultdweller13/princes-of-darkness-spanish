l_spanish:

 podnosferatu.1.t: "Horrores en la oscuridad"
 podnosferatu.1.desc: "El clan Nosferatu está doblemente maldecido. La maldición obvia es visible en su persona, pero la segunda es más insidiosa.\nEl fundador del $pod_clan$, Absimilliard, cree que solo matando a todo su linaje será perdonado por Caín. Para este propósito, creó un pequeño grupo de chiquillos fanáticamente devotos conocidos colectivamente como los Nictuku. Su único propósito es matar a tantos Nosferatu como puedan y, lamentablemente, son bastante eficientes en ello.\nComo tal, los Nosferatu viven una no-vida de miedo y paranoia, mirando siempre por encima del hombro, esperando no ver a los famosos hombres del saco listos para terminar con su existencia."
 podnosferatu.1.a: "¡No me atraparán!"
 nosferatu_intro_tt: "Tal vez los Nictuku interfieran en tu no-vida en el futuro. O tal vez no. ¿Quién sabe?"
 
 nictuku_well_prepared_modifier: "Paranoia Nictuku"
 nictuku_well_prepared_modifier_desc: "¡Ya vienen. YA VIENEN!"
 nictuku_well_prepared_tt: "Si algo sucede realmente, estarás bien preparado para ello."
 
 nictuku_prepared_modifier: "Miedo Nictuku"
 nictuku_prepared_modifier_desc: "Deberíamos estar preparados, con suerte."
 nictuku_prepared_tt: "Si algo sucede realmente, estarás algo preparado para ello."
  
 podnosferatu.3.t: "Horrores en la oscuridad: Nieblas mortales"
 podnosferatu.3.desc: "La gente informa de un aumento repentino e inexplicable de desapariciones en tu zona. Parece estar ligado al clima, con una niebla densa inesperada que dificulta especialmente los viajes.\nTus compañeros Nosferatu empiezan a susurrar que el temido Nictuku, Abraxes, podría estar cerca, ya que se le conoce como el \"Señor de las Nieblas\". Tus cortesanos más sensatos simplemente culpan a los habituales ataques de los Lupinos y descartan cualquier motivo de preocupación real."
 podnosferatu.3.a: "¡Barricadlo todo!"
 podnosferatu.3.b: "Seamos... prudentes"
 podnosferatu.3.c: "Cuentos de hadas y hombres del saco."
 
 podnosferatu.30.t: "Horrores en la oscuridad: Abraxes"
 podnosferatu.30.desc: "Las misteriosas desapariciones en tu zona han continuado y la niebla no se disipa. Tus agentes más fiables están siendo el objetivo ahora y cada vez hay menos dudas de que un Nictuku te está acechando, eliminando lentamente cualquier obstáculo en su camino antes de ir a por la presa.\nSin embargo, aún no has terminado y, conociendo ahora el peligro de la situación, podrías reorganizar tus activos y, con suerte, quitarte de encima a este horror antiguo.\nO simplemente podrías huir y esconderte en algún agujero."
 podnosferatu.30.a: "Puedo ser más astuto que ellos."
 podnosferatu.30.effect.success.desc: "¡Se rinden!"
 podnosferatu.30.critical.failure.effect.desc: "¿Por qué hay niebla en mi sala del trono?"
 
 podnosferatu.4.t: "Horrores en la oscuridad: ¿Abominaciones?"
 podnosferatu.4.desc: "Los mortales de tu dominio informan de cada vez más avistamientos de lo que describen como \"abominaciones infernales\". Este evento repentino e inexplicable, en lo que a ti respecta, ha hecho que muchos posibles cazadores acudan a la zona.\nLa mayoría de tus cortesanos sostienen que esto se debe simplemente a algún comportamiento laxo por parte de algunos vampiros (u otras criaturas) no identificados, pero tus compañeros Nosferatu confían menos, compartiendo que incitar a los mortales al frenesí es una táctica conocida del Nictuku Azazel. Abogan por tomar el control de la situación más directamente, incluso si esto significa tener que lavar el cerebro a algunos mortales y, por tanto, exponerte durante un tiempo."
 podnosferatu.4.a: "Asumiendo el control directo."
  
 podnosferatu.40.t: "Horrores en la oscuridad: Azazel"
 podnosferatu.40.desc: "Numerosos cazadores han acudido a tu dominio, buscando las \"abominaciones\" de las que el pueblo informa desde hace varios años. Hay demasiados para ignorarlos y tu influencia se está paralizando a medida que la sospecha se arrastra por toda la zona. Hay pocas dudas de que se trata de un esfuerzo concertado contra ti, probablemente para aislarte antes de ir a por la presa.\nHay un último intento desesperado que podrías hacer, apareciendo como una figura de respetada autoridad clerical de algún tipo para explicar estos \"avistamientos infernales\" a los mortales. Tal vez entonces la situación se resuelva por sí sola.\nO simplemente podrías huir y pasar desapercibido hasta que el Nictuku se rinda."
 podnosferatu.40.a: "¡No hay necesidad de entrar en pánico!"
 podnosferatu.40.critical.failure.effect.desc: "¡No soy una de las abominaciones! ¡Deteneos!"
 
 podnosferatu.5.t: "Horrores en la oscuridad: Muerte y decadencia"
 podnosferatu.5.desc: "Los mortales están muriendo. Aunque no es exactamente un fenómeno nuevo, el gran número de muertes recientes por enfermedad en tu dominio te tiene preocupado. Tus cortesanos sostienen que se trata de una plaga, como las que se sufren a menudo en estos tiempos, y que desaparecerá en un tiempo. Tus hermanos Nosferatu, sin embargo, responden que esta \"plaga\" parece demasiado centrada en tu zona para ser un asunto genuino. Cuentan historias de la Nictuku Equidna, la madre de la Decadencia, y cómo todo lo que ella se acerca se pudre y se desmorona en polvo. Su solución sería poner en cuarentena las zonas afectadas de forma muy estricta, lo que podría ayudar a interrumpir los movimientos de Equidna pero también paralizaría a la comunidad local."
 podnosferatu.5.a: "Que ningún mortal deambule por nuestras calles."
   
 podnosferatu.50.t: "Horrores en la oscuridad: Equidna"
 podnosferatu.50.desc: "Ya no hay duda, la temida Nictuku Equidna te tiene como objetivo. Al infectar a tus mortales con su poderosa decadencia, se ha asegurado de aislarte de tus rebaños y de tu influencia en los pueblos cercanos. Está bastante claro que te atacará directamente pronto.\nAún hay tiempo para contrarrestar sus planes, ya que sanadores itinerantes han empezado a intentar ayudar a la población local. Si logras ayudarlos y guiarlos con éxito, el método principal de Equidna para aislarte fallará."
 podnosferatu.50.a: "Obtendrán todo lo que necesiten."
 podnosferatu.50.critical.failure.effect.desc: "¿Por qué huele tan mal de repente?"
  
 podnosferatu.6.t: "Horrores en la oscuridad: Guerra de sombras"
 podnosferatu.6.desc: "Alguien ha estado atacando tus activos recientemente. Este rival, sea quien sea, ha estado comprando a tus útiles contactos mortales e incluso a algunos vampíricos antes de ponerlos en tu contra. Esto está todavía en sus inicios, y tienes tiempo para reaccionar, pero esto podría ser costoso.\nTus cortesanos buscan quién podría ser este nuevo rival potencial, pero tus hermanos Nosferatu susurran sobre una figura sombría que usa un disfraz angelical para engañar y sobornar a tus antiguos contactos. Hablan del Nictuku, Gayomart, y te advierten que este podría ser el primer paso en su ataque contra ti."
 podnosferatu.6.a: "Más oro solucionará el problema."
   
 podnosferatu.60.t: "Horrores en la oscuridad: Gayomart"
 podnosferatu.60.desc: "Ya no hay debate: una figura invisible en tu dominio te está cortando hábilmente de tus contactos mortales y aliados vampíricos. Los Nosferatu de tu zona insisten en que esto es obra de Gayomart, el seductor Nictuku, y que pronto actuará directamente contra ti ahora que estás aislado.\nSin embargo, aún hay tiempo para actuar, y podrías desplegar tu red de intriga por completo para asegurarte de que aún tendrías aliados a los que recurrir en caso de ataque. O podrías huir, esperando escapar antes de que sea demasiado tarde."
 podnosferatu.60.a: "Aún tengo cartas que jugar."
 podnosferatu.60.critical.failure.effect.desc: "Solo en la oscuridad..."
    
 nictuku_knight_large_modifier: "Paranoia Nictuku"
 nictuku_knight_large_modifier_desc: "Tus campeones están ocupados persiguiendo a un fantasma. Tal vez literalmente."
 nictuku_knight_modifier: "Miedo Nictuku"
 nictuku_knight_modifier_desc: "Tus campeones están ocupados persiguiendo a un fantasma. Tal vez literalmente."

 podnosferatu.7.t: "Horrores en la oscuridad: Guerra de guerrillas"
 podnosferatu.7.desc: "Alguien ha estado atacando a tus fuerzas armadas recientemente, y algunos de tus contactos mortales en el ejército han sido encontrados misteriosamente muertos. Incluso los soldados comunes a tueldo tienen miedo de repente de trabajar para ti, hablando de un cazador terrible que se alimenta específicamente de aquellos que trabajan contigo.\nTus cortesanos hablan de un posible nuevo rival que intenta socavarte, pero tus hermanos Nosferatu no están convencidos. Susurran sobre Gorgo, La que Grita en la Oscuridad, una poderosa Nictuku conocida por usar tales tácticas. Te instan a usar todos los medios considerables a tu disposición para frenarla."
 podnosferatu.7.a: "¡Encontradla!"
   
 podnosferatu.70.t: "Horrores en la oscuridad: Gorgo"
 podnosferatu.70.desc: "Tras años de guerra de guerrillas por parte de quien solo puede ser la legendaria Nictuku Gorgo, tu control sobre las fuerzas armadas en tu dominio ha disminuido considerablemente. Guardias nuevos y sin demostrar están ante tu sala del trono y se puede ver el miedo en los rostros de los Nosferatu presentes esta noche. Esto tiene que parar.\nPodrías reunir a tus fuerzas restantes y organizar una caza de Nictuku en todo el dominio para acabar con Gorgo (o al menos obligarla a huir) para siempre. O podrías huir y escapar, tal vez esperando evitar la venganza de la Nictuku una noche más de esta manera."
 podnosferatu.70.a: "¡La cazaremos!"
 podnosferatu.70.critical.failure.effect.desc: "Esa fue una idea terrible..."
     
 podnosferatu.8.t: "Horrores en la oscuridad: el Segador"
 podnosferatu.8.desc: "Últimamente se ha informado de asesinatos sangrientos en tu dominio. Aunque hasta ahora no se ha podido encontrar un patrón discernible, parece acechar en torno a tus intereses y ha empezado a hacer que tus contactos habituales y fuentes de influencia recelen de trabajar contigo.\nTus cortesanos hablan de un posible vampiro no identificado que se ha vuelto feral o tal vez de otro tipo de criatura por completo. Tus hermanos Nosferatu, sin embargo, señalan el hecho de que algunos miembros jóvenes de vuestro clan ya han sido asesinados de esta manera y piden que tomes medidas considerables contra esta amenaza. Susurran que podría ser obra de un temido Nictuku."
 podnosferatu.8.a: "¡Buscad por todas partes!"
   
 podnosferatu.80.t: "Horrores en la oscuridad: Illuyankas"
 podnosferatu.80.desc: "Ya no queda ninguna duda, eres el objetivo de un Nictuku. Los estudiosos Nosferatu piensan que podría ser Illuyankas, el Segador, conocido por sus sangrientos asesinatos de cualquiera que se interponga en su camino. Has estado rastreándolo durante algún tiempo, pero no has podido detenerlo.\nTe quedan dos opciones: prepararle una trampa, con la esperanza de rechazarlo con la ayuda de tus campeones, o simplemente huir lejos durante un tiempo hasta que pierda tu rastro."
 podnosferatu.80.a: "¡Resistiremos y lucharemos!"
 podnosferatu.80.critical.failure.effect.desc: "Resistimos y luchamos..."
     
 podnosferatu.9.t: "Horrores en la oscuridad: el Monstruo"
 podnosferatu.9.desc: "Últimamente te han llegado informes de avistamientos extraños. Al parecer, un horrible monstruo con forma de caballo ha empezado a causar estragos no muy lejos de tu zona de influencia. Tus cortesanos buscan pistas sobre la identidad de esta criatura, planteando que podría ser una raza de cambiapieles nunca vista hasta ahora. Tus hermanos Nosferatu no están convencidos, sin embargo, y hablan en susurros de Nuckelavee, un temido Nictuku con la forma de tal monstruo. Piden que se tomen medidas drásticas para protegerte (y protegerlos) de su ira si se dirigiera hacia ti."
 podnosferatu.9.a: "¡Preparad nuestras defensas!"
              
 podnosferatu.90.t: "Horrores en la oscuridad: Nuckelavee"
 podnosferatu.90.desc: "El monstruo con forma de caballo del que oíste hablar hace varios años ha resultado ser un problema mucho mayor de lo que pensaste inicialmente. Su patrón de ataques algo aleatorio dificultó su localización y su aparente gran fuerza hizo aún más difícil acabar con él. Tras arrasar la región (y atacar especialmente a los Nosferatu), ahora se acerca a tu dominio.\nLas dos opciones que quedan son claras: preparar tu mejor defensa y enfrentarte a él en el campo de batalla o huir y esperar que pierda tu rastro."
