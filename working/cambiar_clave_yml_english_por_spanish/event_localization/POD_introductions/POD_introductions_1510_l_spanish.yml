l_spanish:
 
  podintroductions1500.10.t: "Rosas ardientes"
  podintroductions1500.10.desc: "La Inquisición comenzó y alcanzó su punto álgido en Francia, y la estructura política $pod_cainite$ ha sufrido bastante por ello. Salianna y Esclarmonde han sido traicionadas y expulsadas por la despiadada Beatrix, que ahora gobierna las Cortes del Amor con la ayuda fundamental de sus dos campeones: Francois Villon y Eon de l'Etoile.\nAunque su ascenso fue rápido y mostró una mente política aguda, no fue suficiente para evitar el intento de golpe de la ambiciosa Isouda, y Francia quedó entonces dividida entre las dos reinas. El nacimiento de las sectas cambió poco este estado de cosas, con Beatrix uniéndose a la Camarilla e Isouda al Sabbat, y parece que la batalla ideológica pasa a un segundo plano frente a las ambiciones de las últimas Reinas del Amor.\nFrancia tiene un largo camino por recorrer antes de lograr finalmente la estabilidad una vez más."
  podintroductions1500.10.a: "Dos Reinas para una corona."
  podintroductions1500.11.t: "El despreocupado Dios-Rey de Inglaterra"
  podintroductions1500.11.desc: "Desde su regreso tras la invasión normanda de 1066, Mitras ha vuelto a asegurar su control sobre Inglaterra. Con sus rivales debilitados y su culto en ascenso, el Dios-Rey miraba hacia el exterior... hasta que la Peste Negra, la Inquisición y la Revuelta Anarquista ocurrieron en rápida sucesión.\nLe llevó varias décadas lidiar con estos problemas que Mitras achacó a los Tremere, a quienes expulsó rápidamente de su isla. Victorioso una vez más, Mitras se vio sorprendido cuando ese molesto Hardestadt se aseguró una importante victoria diplomática al crear la Camarilla. Sintiendo que una ocasión tan trascendental debería haber sido liderada por él, Mitras sopesa desde entonces sus opciones. Unirse a la Camarilla sería la elección lógica, pero tomar un camino alternativo borraría la sonrisa de suficiencia de la cara de ese enfurecedor alemán, algo que suena bastante atractivo para el señor de Inglaterra..."
  podintroductions1500.11.a: "¿Inglaterra y el continente enfrentados? ¡No me digas!"
  podintroductions1500.12.t: "Pecados del padre"
  podintroductions1500.12.desc: "El gobierno seguro de Hardestadt sobre Alemania y sus astutas políticas durante la Era de la Inquisición y la Revuelta Anarquista le llevaron a crear la Camarilla, un gran esfuerzo para asegurar la supervivencia $pod_cainite$ frente a estas nuevas amenazas. Aun así, no todo es paz bajo la Cruz Negra; el trato insensible de Hardestadt hacia su carismático chiquillo Jürgen von Verden provocó una rebelión generalizada en las filas de sus antiguos seguidores, liderada por Lucretia von Hardtz.\nEl fundador de la Camarilla ha perdido ahora gran parte de su poder en el este de Alemania, donde los restos de la Revuelta Anarquista, los vengativos seguidores de Jürgen y otros pequeños señores de la guerra se reúnen con una sola cosa en común: un odio eterno hacia el nuevo autoproclamado $pod_cainite$ más importante del mundo de los no muertos."
  podintroductions1500.12.a: "Jürgen todavía proyecta una larga sombra sobre Alemania..."
  podintroductions1500.13.t: "El reino de Su Eminencia"
  podintroductions1500.13.desc: "En un tiempo sorprendentemente corto (para un $pod_cainite$), Ambrosio Luis Moncada logró ganar la Reconquista en las Sombras, deshacerse de su [Glossary('Sire','game_concept_Sire_desc')] y participar en la creación del Sabbat, lo que llevó a la adopción de una jerarquía eclesiástica para esta secta naciente.\nParece no haber límites para lo que el Cardenal puede lograr, y muchos empiezan a creer que está verdaderamente bendecido por el propio Dios como Su instrumento. A estos rumores, Moncada solo responde con una sonrisa y una bendición antes de volver a su enigmático objetivo.\nParece poco probable que los pequeños enclaves de poderes ibéricos independientes puedan resistir por mucho más tiempo a las tropas disciplinadas de creyentes fanáticos de Moncada. Bendecido por Dios o no, Iberia solo tiene un señor por el momento."
  podintroductions1500.13.a: "¿Ha elegido Dios su bando?"
  podintroductions1500.14.t: "Después del Ragnarok"
  podintroductions1500.14.desc: "El Ragnarok ha llegado y se ha ido para los vampiros vikingos, los llamados [Glossary('Einherjar','game_concept_einherjar_desc')]. Con Werter y Brunhilde derrotados, Escandinavia es ahora una tierra como tantas otras, dividida por la política y las ambiciones personales.\nEn Dinamarca, tras asegurar Copenhague, el Tremere renegado Rutor debe enfrentarse ahora a la retribución de su enfurecido $pod_clan$, liderado por la poderosa Meerlinda. En Suecia y Noruega, la Camarilla se ha afianzado con fuerza gracias a los invasores Ventrue alemanes, pero el Sabbat controla la mayor parte del norte, dejando el destino de la región bastante incierto. Más al norte, en los páramos donde pocos hombres se atreven a viajar, reliquias de una época pasada intentan sobrevivir en este mundo donde perdieron y sus Dioses han muerto."
  podintroductions1500.14.a: "Un nuevo comienzo tras el final."
  podintroductions1500.15.t: "La carrera por Roma"
  podintroductions1500.15.desc: "Italia ha cambiado mucho gracias a los fuegos de la Inquisición y de la Revuelta Anarquista. Los victoriosos anarquistas Lasombra han barrido el norte y se han unido tras el Sabbat bajo el liderazgo de Giangaleazzo y Gratiano, dos héroes de la Revuelta.\nEn el sur, el colapso de la autoridad del Mar de las Sombras ha beneficiado a un forastero improbable, Antonio Cardona de los Ventrue. Gobernando su reino como una familia extendida con un fuerte enfoque en los deberes y derechos del pueblo siciliano, este extraño independiente ha disfrutado de una gran cantidad de éxito hasta ahora.\nGratiano y Giangaleazzo están nominalmente aliados entre sí, lo que convierte al Sabbat en el ganador más probable para Italia. Pero cosas más extrañas han sucedido ya en esta cuna de imperios..."
  podintroductions1500.15.a: "¿Dos contra uno? No parece justo."
  podintroductions1500.16.t: "El colapso levantino"
  podintroductions1500.16.desc: "La Dieta de los Olivos, este último aliento del $pod_clan$ Salubri, no duró mucho, dejando al Príncipe de Jerusalén, Lucius Trebus Rufus, para recoger los pedazos. Bajo su gobierno justo y mayoritariamente benévolo, el Levante disfrutó de un periodo de paz sin precedentes... hasta su asesinato durante la Revuelta Anarquista a manos de su propio chiquillo.\nCon cualquier apariencia de autoridad destruida, el Levante es una vez más un sangriento campo de batalla entre Príncipes menores y señores de la guerra.\nCuriosamente, la mejor esperanza para la región podría venir de Damasco. Purgada de sus demonios por un esfuerzo combinado Salubri-Assamita, la ciudad está ahora gobernada por la sensata Mannal, una gobernante fuerte y sabia que muchos acogerían con agrado. El tiempo dirá si elige centrarse en la propia Damasco o responder a esta llamada."
  podintroductions1500.16.a: "La inestable tierra de la Fe es fiel a su reputación."
  podintroductions1500.17.t: "Recién llegados inoportunos"
  podintroductions1500.17.desc: "Una vez unificado en su mayor parte bajo los [Glossary('Ashirra','game_concept_ashirra_desc')], Oriente Medio tuvo que soportar el primer asalto a gran escala dirigido por la Camarilla. Aunque este esfuerzo se dirigió contra Alamut y los Hijos de Haqim, también ha roto la estabilidad de la región, especialmente desde que muchos de los atacantes se quedaron en Mesopotamia bajo el liderazgo del propio Menelao.\nAyudada por esta agitación, surgió otra amenaza insidiosa. Kemintiri, la famosa chiquilla renegada de Set, también ha puesto sus ojos en la región para lograr un objetivo misterioso que solo ella conoce. Divididos por el conflicto interno sobre qué postura adoptar contra estos forasteros, ¿podrán los [Glossary('Ashirra','game_concept_ashirra_desc')] reclamar su tierra?"
  podintroductions1500.17.a: "Puede que esta vez haya que romper las reglas de la hospitalidad..."
  podintroductions1500.18.t: "Rotos y derrotados"
  podintroductions1500.18.desc: "Los orgullosos Hijos de Haqim han sido humillados por la Camarilla. En su primer asalto a gran escala, rompieron las puertas de Alamut y forzaron una rendición, deteniendo la expansión del $pod_clan$ tras los pasos de los otomanos. Peor aún, se les ha impuesto una maldición como parte del tratado de paz, debilitándolos aún más. Sin embargo, los Hijos de Haqim son resistentes si algo son, y ya han empezado a reconstruir.\nIrónicamente, estas derrotas ayudaron a unificar a las facciones enfrentadas y ahora se están fortaleciendo bajo el nuevo liderazgo de Jamal, su guerrero más renombrado.\nLa Camarilla observa con aprensión cómo Alamut se reafirma, preguntándose si solo han retrasado lo inevitable..."
  podintroductions1500.18.a: "El nido del Águila se prepara, con la venganza en el corazón."
  podintroductions1500.19.t: "Mareas cambiantes"
  podintroductions1500.19.desc: "La India se ha librado de la Inquisición y de la Revuelta Anarquista, pero ha sufrido un acontecimiento masivo a pesar de todo: el colapso de la Corte del Fénix Escarlata. Una vez el principal oponente de los Ravnos en la llamada 'Guerra Eterna', la corte birmana se ha desmoronado sobre sí misma, plagada de corrupción y traición.\nMientras varios líderes menores intentan recoger los pedazos, este evento deja una fuerte oportunidad para que los Ravnos asesten finalmente un golpe decisivo a sus enemigos jurados. Aun así, el camino hacia la victoria no será precisamente fácil, ya que la segunda gran corte de [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], el Trueno Infinito, sigue siendo fuerte y está dispuesta a contrarrestar el avance de los Ravnos en cada paso.\nEl destino de la India podría haber cambiado finalmente, pero es demasiado pronto para proclamar un vencedor."
  podintroductions1500.19.a: "¿Un cambio duradero o una mera nota al pie?"
  podintroductions1500.20.t: "Tierra de esperanzas y secretos"
  podintroductions1500.20.desc: "El Magreb ha cambiado mucho tras la conclusión de la Reconquista en las Sombras en España. Los [Glossary('Ashirra','game_concept_ashirra_desc')] derrotados huyeron aquí, con la esperanza de usar esta tierra como base para un improbable regreso. Sin embargo, no estaba destinado a suceder, y la repentina desaparición de Zamra Matoub, la poderosa Sultana de Argel, dejó la región en el caos.\nPara sorpresa de todos, es una forastera la que ha restaurado el orden. Elaine de Calinot, una poderosa hechicera Tremere, tomó repentinamente el control de Argel y comenzó a expandirse hacia el exterior buscando... algo (¿o a alguien?) con una inquietante determinación. Su devoto grupo de seguidores y la división de la oposición le han permitido crecer sin control hasta ahora.\nPero tanto desde el oeste con los últimos [Glossary('Ashirra','game_concept_ashirra_desc')] andalusíes, como desde el este con la todavía poderosa Túnez, nuevos y viejos poderes están empezando a prepararse para ir contra esta recién llegada inoportuna..."
  podintroductions1500.20.a: "Viejos y jóvenes, derrotados y vencedores... todos chocan en el Magreb."
  podintroductions1500.21.t: "El mameluco y la serpiente"
  podintroductions1500.21.desc: "Empujado cada vez más a la irrelevancia y plagado de divisiones internas, el $pod_clan$ Setita está empezando a perder su propio corazón de Egipto. Esto se debe en gran parte al ascenso de Mukhtar Bey, el nuevo Príncipe de El Cairo.\nEste extraño Caitiff ha sido un gobernante misterioso pero querido hasta ahora, y ha sido capaz de expandir cuidadosamente su influencia en la región, acelerando el declive de los Seguidores de Set.\nLa reciente caída de Nakhthorheb en $pod_torpor$ ha forzado un cambio de liderazgo en los Setitas, con el ascenso de Maatkare como nueva Hierofante. Conocida como una gobernante más astuta y proactiva que su predecesor, ella podría ser la clave para detener la caída en desgracia de las Serpientes, si puede superar en astucia (o en poder) a la creciente fama y poder de Mukhtar Bey."
  podintroductions1500.21.a: "La Serpiente todavía tiene algo de mordida."
  podintroductions1500.22.t: "Las tierras salvajes"
  podintroductions1500.22.desc: "Más allá del alcance de lo que la mayoría llamaría civilización se encuentran las Estepas, una tierra bastante hostil para los vampiros con muy pocas ciudades y demasiados Lupinos. Aun así, esos vampiros salvajes expulsados por el ascenso del cristianismo y el islam han encontrado aquí un respiro temporal.\nLa Cortina de Sombras, esos desquiciados seguidores de la misteriosa Baba Yaga, han sido expulsados de Rusia pero planean su inevitable regreso desde aquí. Más al este, la Horda [Glossary('Anda','podgloss.anda')] (vampiros del pueblo mongol) ha sido casi destruida por los vengativos [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] chinos, desde donde la Vanguardia sigue vigilando desde el borde de su imperio.\nEstos dos poderes son los contendientes más probables para la supremacía en las Estepas, pero están lejos de ser los únicos."
  podintroductions1500.22.a: "Escitas, hunos, mongoles... ¿quién será el siguiente?"
  podintroductions1500.23.t: "Hijos de la noche"
  podintroductions1500.23.desc: "La Guerra de los Presagios entre los Tzimisce y los Tremere ha terminado en Transilvania, con la retirada disciplinada de los hechiceros a Austria. Aun así, los Tzimisce están tan fracturados como siempre.\nLa aparente muerte de su [Glossary('Antediluvian','game_concept_antediluvian_desc')] los ha dividido entre los primeros partidarios del Sabbat y la Vieja Guardia. Esta división permitió a los Ventrue húngaros mantenerse firmes, bajo el firme liderazgo de Vencel Rikard.\nPero por ahora, todas las miradas están puestas en el Castillo de Bran, donde el misterioso mortal llamado Vlad Tepes se convirtió recientemente en vampiro. El infame 'empalador' ya ha causado una gran impresión en el mundo de los no muertos, y no ha hecho más que empezar..."
  podintroductions1500.23.a: "Entrad libremente..."
  podintroductions1500.24.t: "Delicias turcas"
  podintroductions1500.24.desc: "Constantinopla ha sido durante mucho tiempo un sueño que se desvanece para los vampiros desde su caída en 1204. Mientras las viejas reliquias griegas se ven arrastradas a la irrelevancia, todas las miradas se vuelven hacia Anatolia y el naciente Imperio Otomano.\nUno de sus más grandes generales ha sido convertido en un vampiro llamado ahora Karsh, y es un fanático leal de la Camarilla. Sus golpes de puño contra los invasores Assamitas han sido decisivos para obligarlos a sentarse a la mesa de paz. Aun así, una amenaza aún mayor podría poner pronto a prueba el temple del Señor de la Guerra de la Camarilla.\nAbundan los rumores de que, más al este, la misteriosa secta conocida como la Tal'mahe'Ra ha encontrado un nuevo líder y se ha unificado de nuevo en una fuerza poderosa. Sus desquiciados objetivos chocarán sin duda con la naciente Camarilla en el futuro."
  podintroductions1500.24.a: "Un Sueño convertido en campo de batalla."
  podintroductions1500.25.t: "Abriendo la cortina"
  podintroductions1500.25.desc: "La Rusia vampírica ha estado durante mucho tiempo bajo el control de los seguidores de Baba Yaga, pero con la misteriosa desaparición de la Bruja y la urbanización gradual del país, ha empezado a cambiar. El Sabbat ya ha hecho algunas incursiones fuertes en el antiguo territorio de la Cortina de Sombras.\nEstán liderados oficialmente por Seinia de Nóvgorod, pero la sombra del extraño Tzimisce Sascha Vykos también se ve fortalecida noche tras noche.\nSin embargo, estos no son los únicos contendientes, ya que Natalya Svyatoslav ha regresado a su tierra natal tras un mandato infructuoso como Príncipe de Constantinopla. Sus sueños idealistas de una utopía probablemente chocarán pronto con el Sabbat, mucho más salvaje, dejando el destino de Rusia tan incierto como siempre."
  podintroductions1500.25.a: "¿Qué hay más allá de la Cortina?"
  podintroductions1500.26.t: "Mal desatado"
  podintroductions1500.26.desc: "La Polonia vampírica se ha visto sacudida hasta sus cimientos por la muerte de la Princesa Razkoljna, su firme pero respetada gobernante, durante las etapas iniciales de la Revuelta Anarquista. Sin su esfuerzo estabilizador, nadie fue capaz de detener realmente el ascenso al poder del infame monstruo (incluso comparado con sus compañeros Tzimisce) Hedeon Yaroslavich.\nMientras el horror y la locura se extienden a su paso, la salvación parece poder venir de solo dos fuentes. El incondicional Yitzhak ben Avraham sigue haciendo todo lo posible para proteger a la gente (ya sea no muerta o no), mientras que la ambiciosa Bena se ha unido al Sabbat, esperando que su apoyo sea suficiente para enfrentarse a Hedeon.\nQueda por ver si uno de ellos tendrá éxito, o si Polonia está condenada a permanecer bajo la correa del monstruo para siempre." 
  podintroductions1500.26.a: "El mal es una escalera, de todos modos."
  podintroductions1500.27.t: "Luces del norte"
  podintroductions1500.27.desc: "Una vez el último bastión de los vampiros paganos, el área báltica ha cambiado bastante desde su famosa última resistencia en Livonia. Los Salvajes siguen aquí, pero ahora han seguido la llamada de su líder Aajav-Jalan para unirse al Sabbat.\nEl Estado Libre bajo Karl el Azul se unió a la malograda Revuelta Anarquista, y perdió la mayor parte de sus efectivos y territorio tras ella.\nEn la propia Finlandia, es un sorprendente y afable Gangrel el que se ha alzado como el poder dominante. Tuomo Markus Sampsa cuenta con el respaldo de la Camarilla, y su destreza diplomática ha sido hasta ahora suficiente para ayudarle a hacer crecer su dominio discretamente.\nCon las tres sectas principales representadas en la zona, es poco probable que esta tenue paz dure mucho tiempo." 
  podintroductions1500.27.a: "Viejas bestias, nuevos conflictos."
 
  podintroductions1500.100.t: "El Dios-Rey reflexiona"
  podintroductions1500.100.desc: "Tu relación con la naciente Camarilla siempre ha sido compleja. Por un lado, ciertamente puedes valorar el fuerte liderazgo central que esta secta defiende. Por otro... fue idea de Hardestadt, y odias a ese advenedizo que se cree el Ventrue perfecto.\nEn 1486, aceptaste los principios básicos de la Camarilla, prometiendo al menos no actuar contra ella. Aun así, hay una diferencia entre 'no actuar contra ella' y 'unirse' a ella. Los fieles de tu culto están listos para seguirte, sea cual sea tu elección final al respecto." 
  podintroductions1500.100.a: "Las rivalidades están por debajo de mí."
  podintroductions1500.100.b: "¡No me inclinaré ante el alemán!"
  podintroductions1500.100.tooltipa: "Todos los personajes de la Vía Mitras se convertirán a la Camarilla"
  podintroductions1500.100.tooltipb: "La Vía Mitras seguirá manteniéndose al margen de la Camarilla"
 
  podintroductions1500.101.t: "El Dios-Rey reflexiona"
  podintroductions1500.101.desc: "La relación de Mitras con la naciente Camarilla siempre ha sido compleja. Por un lado, ciertamente valora el fuerte liderazgo central que esta secta defiende. Por otro... fue idea de Hardestadt, y ha quedado muy claro que esos dos no se soportan realmente.\nEn 1486, Mitras aceptó los principios básicos de la Camarilla, prometiendo al menos no actuar contra ella. Aun así, hay una diferencia entre 'no actuar contra ella' y 'unirse' a ella.\nEsta situación ambigua se ha aclarado recientemente, cuando Mitras anunció que se unirá formalmente a la Camarilla. Como era de esperar, su fiel culto pronto hizo lo mismo, poniendo la mayor parte de las Islas Británicas firmemente bajo el control de la secta." 
  podintroductions1500.101.a: "Una victoria para la Camarilla."
  
  podintroductions1500.102.t: "El Dios-Rey reflexiona"
  podintroductions1500.102.desc: "La relación de Mitras con la naciente Camarilla siempre ha sido compleja. Por un lado, ciertamente valora el fuerte liderazgo central que esta secta defiende. Por otro... fue idea de Hardestadt, y ha quedado muy claro que esos dos no se soportan realmente.\nEn 1486, Mitras aceptó los principios básicos de la Camarilla, prometiendo al menos no actuar contra ella. Aun así, hay una diferencia entre 'no actuar contra ella' y 'unirse' a ella.\nEsta situación ambigua se ha aclarado recientemente, cuando Mitras anunció que no irá más allá de este pact. El Culto de Mitras seguirá siendo su propia entidad, y aunque la Camarilla será tolerada en las Islas Británicas, no será la forma principal de gobernar a los Cainitas en el dominio de Mitras." 
  podintroductions1500.102.a: "Parece difícil convencer a un Dios."
   
  treaty_of_tyre_modifier: "Tratado de Tiro"
  treaty_of_tyre_modifier_desc: "La humillante rendición del Tratado de Tiro obliga a todos los Banu Haqim a mantener la paz con la Camarilla, al menos abiertamente.\nNo puedes declarar guerras a los gobernantes de la Camarilla mientras este modificador esté activo." 
  podintroductions1500.103.tooltip: "La humillante rendición del Tratado de Tiro obliga a todos los Banu Haqim a mantener la paz con la Camarilla, al menos abiertamente.\nNo puedes declarar guerras a los gobernantes de la Camarilla mientras este modificador esté activo." 
 
  podintroductions1500.103.t: "El Tratado de Tiro"
  podintroductions1500.103.desc: "El Tratado de Tiro es una tregua convocada entre la Camarilla y los Banu Haqim en 1496 tras diez años de violencia y guerra casi abierta entre la Camarilla y los Assamitas; comenzó en 1486 cuando la Camarilla convocó una Caza de Sangre contra ellos. Los guerreros del clan ya habían estado golpeando a los Vástagos de Occidente durante los años de la Revuelta Anarquista, en gran parte como retribución por las Cruzadas, vistas por muchos en el clan como una estratagema de la Yihad que habían buscado evitar durante mucho tiempo.\nLa Caza de Sangre puede atribuirse en gran parte a la Gran Mentira del antiguo Tremere Etrius, que pintó a los Hijos de Haqim como nada más que asesinos viciosos y diabolistas. Una vez convocada la Caza de Sangre, el asediado $pod_clan$ luchó con más fuerza, y especialmente tras la Convención de Espinas, cuando sus aliados anarquistas fueron atraídos de nuevo al redil de la Camarilla. El conflicto probablemente habría terminado con la muerte de cada Haqimita en Europa, pero el repentino descubrimiento de Alamut por un Nosferatu solitario y un asalto directo liderado por Menelao a la propia fortaleza obligaron a los Banu Haqim a sentarse a la mesa de rendición." 
  podintroductions1500.103.a: "...y se pone aún peor."
   
  tremere_blood_curse_modifier: "Maldición de sangre Tremere"
  tremere_blood_curse_modifier_desc: "Impuesta como castigo infligido por la Camarilla a los Haqimitas, la Maldición de Sangre Tremere hace que la $pod_vitae$ $pod_cainite$ sea venenosa para ellos, una afrenta al credo de la Senda de la Sangre." 
  
  podintroductions1500.104.t: "La Maldición de Sangre Tremere"
  podintroductions1500.104.desc: "Los Hijos de Haqim siempre han sido feroces oponentes de los infernalistas Baali, y han pagado un alto precio por ello. En el siglo VII, los Baali utilizaron a trece Guerreros para introducir una Maldición de Hambre en la Casta de los Guerreros como venganza por su papel activo durante las Guerras Baali. La Casta pronto tuvo sed de $pod_vitae$ $pod_cainite$ cada noche.\nPor lo tanto, la Maldición de Sangre de los Tremere de 1496 es al mismo tiempo un castigo infligido por la Camarilla a los Assamitas, así como una protección contra su hambre, ya que hace que la $pod_vitae$ $pod_cainite$ sea venenosa para ellos. Muchos Hijos de Haqim siguen la Senda de la Sangre, que exalta las prácticas de la $pod_diablerie$. La incapacidad de saborear la sangre de otros vampiros es una afrenta a su credo.\nMientras los Hechiceros trabajan para encontrar una cura, el hambre venenosa permanece hasta el día de hoy." 
  podintroductions1500.104.a: "Maldiciones y castigos en abundancia..."
  podintroductions1500.104.tooltip: "La Maldición permanecerá para siempre, a menos que un Hijo de Haqim sea capaz de lograr la decisión 'Terminar con la Maldición'." 
     
  podintroductions1500.105.t: "La Purga de los Capadocios"
  podintroductions1500.105.desc: "En 1444, lo impensable volvió a suceder. Tras la $pod_diablerie$ de Saulot a manos de los colmillos de Tremere, ahora era Capadocio quien era asesinado por su propio chiquillo, Augustus Giovanni. Con un plan bien preparado y ejecutado, la familia Giovanni fue capaz de asegurar rápidamente su posición como un $pod_clan$ de pleno derecho.\nDesorganizados, y todavía recuperándose de la pérdida de sus ancianos más confiables, los Capadocios fueron incapaces de tomar represalias. El Clan Giovanni se vuelve más audaz cada noche, y ha comenzado la purga de sus antepasados. Los antaño influyentes Capadocios son ahora cazados, sabiendo que podrían ser traicionados por cualquiera que esté dispuesto a ganar algunos favores de los poderosos nigromantes italianos.\nLa Purga podría calmarse en un tiempo, pero por ahora, el ascenso del clan Giovanni ha comenzado en sangre y fuego." 
  podintroductions1500.105.a: "La caza ha comenzado"
  podintroductions1500.105.tooltip: "Los Giovanni son ahora un clan separado de los Capadocios. Estos últimos sufren un modificador negativo mientras la purga está en pleno apogeo." 
