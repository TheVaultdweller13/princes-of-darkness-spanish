l_spanish:

 POD_embrace.100.t: "El Abrazo"
 POD_embrace.100.desc: "He orquestado los acontecimientos para que [target.GetFirstName] haya caído en mis garras. En un lugar apartado, [victim.GetSheHe] no podrá escapar. ¿Le concederé la inmortalidad aunque eso signifique la condenación de [victim.GetHerHis]? ¿Estará [victim.GetSheHe] agradecido, o me guardará rencor para siempre? ¿Tuvo mi [Glossary('Sire','game_concept_Sire_desc')] estos mismos pensamientos?"
 POD_embrace.100.option.a: "$pod_Embrace$ a [target.GetFirstName]"
 POD_embrace.100.option.a.tt: "Matarás a [target.GetFirstName] y luego transformarás a [victim.GetHerHim] en un vampiro. Esto te costará piedad, puede aumentar tu hambre y podría arriesgarse a exponer [the_masquerade|E]."  
 POD_embrace.100.option.a.tt.beast: "#beast ¡Sí! Drénalos hasta dejarlos secos y luego dales una sola gota de nuestra sangre. ¡Siempre podemos volver a tomarla toda!#!" 
 POD_embrace.100.option.b: "Dejar ir a [victim.GetHerHim]."
 POD_embrace.100.option.b.tt.beast: "#beast ¡No! ¡No dejes que [victim.GetHerHim] se escape! ¡He esperado demasiado tiempo para esto! ¡Hemos esperado demasiado tiempo para esto.#!"
 POD_embrace.200.t: "El Abrazo"
 POD_embrace.200.desc: "El cazador, [target.GetFirstName], está asegurado en una celda de detención a la espera del $pod_Embrace$. Desgraciadamente, la misma fiereza que lo hace digno de ello, dificultará el proceso."
 POD_embrace.200.option.a: "$pod_Embrace$ al cazador por la fuerza."
 POD_embrace.200.option.a.s.tt: "Inmovilizas al cazador y drenas su sangre."
 POD_embrace.200.option.a.f.tt: "El cazador te tiene preparada una desagradable sorpresa."
 POD_embrace.210.desc: "Con la garganta aún goteando sangre, [target.GetFirstName] te mira con ojos resentidos. Queda por ver si tu regalo de no-vida eterna será aceptado como tal o si el cazador se aferrará a la convicción de que es una maldición terrible."
 POD_embrace.220.desc: "Las puertas de la celda se abren de golpe y saltas a través de la habitación hacia tu objetivo. En pleno salto notas que al taburete de madera que generosamente proporcionaste a tu prisionero le falta una pata. [target.GetFirstName] te lanza una mirada decidida y alza una estaca afilada. Tus garras alcanzan el cuerpo de la víctima, pero tu propio impulso sigue llevando tu corazón hacia la punta de la estaca."
 POD_embrace.200.option.b: "Acechar al cazador sigilosamente."
 POD_embrace.200.option.b.s.tt: "Muerdes el cuello de una víctima desprevenida y dormida."
 POD_embrace.200.option.b.f.tt: "El cazador solo fingía dormir..."
 POD_embrace.230.desc: "[target.GetFirstName] parece estar profundamente dormido mientras te inclinas hacia el cuello de [victim.GetHerHis]. En ese momento te das cuenta de la fuente del hedor abrumador en la celda. ¿Es aceite de lámpara? [target.GetFirstName] abre los ojos de [victim.GetHerHis], te agarra por el cuello y susurra: 'Muere, demonio'. Solo cuando ves el encendedor te das cuenta de lo que está a punto de suceder."
 POD_embrace.200.option.c: "Convencerle de que es la única forma de continuar su existencia"
 POD_embrace.200.option.c.s.tt: "Convence al cazador de que la no-vida puede ser virtuosa."
 POD_embrace.200.option.c.f.tt: "El cazador te convence a ti de algo..."
 POD_embrace.240.desc: "En tu intento de persuadir a tu futuro chiquillo de que la no-vida es una bendición, estabas ansioso por responder preguntas. Preguntas difíciles que exigían respuestas que incluso a ti te resultaban profundamente perturbadoras. ¿Es cierto? ¿Estás irremediablemente perdido para todo aquello que hace la existencia soportable?"
 POD_embrace.200.option.d: "Esto es una mala idea."
 POD_embrace.200.option.d.tt: "De todos los mortales del mundo, ¿por qué iba yo a [Glossary('Sire','game_concept_Sire_desc')] a uno que ha jurado asesinar vástagos?"
 POD_embrace.210.t: "Como quitarle una moneda a un mendigo ciego."
 POD_embrace.210.option.a: "Descansa tranquilo, chiquillo mío."
 POD_embrace.210.option.a.tt: "[target.GetFirstName] se convierte en tu chiquillo."
 POD_embrace.220.t: "Fundido a negro."
 POD_embrace.220.option.a: "¿Por qué? ¿Por qué un taburete de madera?"
 POD_embrace.220.option.a.tt: "Mueres."
 POD_embrace.230.t: "La ropa de cama empapada en aceite se convierte en un infierno abrasador."
 POD_embrace.230.option.a: "¿Cómo consiguió [victim.GetSheHe] el aceite?"
 POD_embrace.230.option.a.tt: "Mueres."
 POD_embrace.240.t: "No era una bendición después de todo."
 POD_embrace.240.option.a: "Necesito algo de tiempo para pensar."
 POD_embrace.240.option.a.tt: "Estás profundamente perturbado por la conversación."
 

 POD_embrace.300.t: "Abrazo Voluntario"
 POD_embrace.300.desc: "Tu fe enseña que el $pod_Embrace$ es un asunto sombrío y serio. Después de todo, estás condenando otra alma a la perdición eterna. Por lo tanto, te han enseñado a nunca Abrazar sin permiso. Has concertado una reunión con [target.GetFirstName], pero ahora debes decidir cuánto revelar."
 POD_embrace.300.option.a: "Contarle a [target.GetHerHim] solo lo que necesita saber."
 POD_embrace.300.option.b: "[target.GetSheHe|U] debería saber lo suficiente para tomar una decisión adecuada."
 POD_embrace.300.option.c: "¡[target.GetSheHe|U] debe saberlo todo!"
 POD_embrace.300.option.d: "He cambiado de opinión."

 POD_embrace.301.t: "Abrazo Voluntario"
 POD_embrace.301.desc: "Te has tomado el tiempo de hablar largamente con este nuevo chiquillo potencial sobre lo que es realmente el vampirismo, y lo que esta terrible maldición puede hacerle al alma de uno. [target.GetSheHe |U|] ha escuchado hasta ahora atentamente, si bien no sin miedo, todo lo que has dicho. [target.GetFirstName] te pide que le dejes solo para meditarlo."
 POD_embrace.301.option.a: "Dar unas palabras de despedida."
 POD_embrace.301.option.b: "Dejar que decida."

 POD_embrace.310.t: "Abrazo Voluntario"
 POD_embrace.310.desc: "Es la hora de la respuesta de [target.GetFirstName].\nExhalas un suspiro de alivio (inútil, pues estás muerto) cuando tu futuro chiquillo te dice que acepta. Has cumplido con los deberes de tu fe, y ahora puedes proceder con el $pod_Embrace$ en sí."
 POD_embrace.310.option.a: "Un día gozoso."

 POD_embrace.340.t: "Abrazo Voluntario"
 POD_embrace.340.desc: "Es la hora de la respuesta de [target.GetFirstName].\nParece que has asustado demasiado a este mortal, y su respuesta es negativa. Deberías ahora, por todas las cuentas, darle permiso para partir y vivir el resto de su corta vida en paz pero... nadie observa verdaderamente su propia fe todo el tiempo, después de todo."
 POD_embrace.340.option.a: "Vete en paz"
 POD_embrace.340.option.b: "Olvida todo."
 POD_embrace.340.option.c: "Una [target.GetWomanMan] no puede hablar..."
 POD_embrace.340.option.d: "¡No se me negará!"
 unwilling_embrace_tt: "Forzarás el $pod_Embrace$, independientemente de su opinión."

 willing_embrace_fully_accept.tooltip: "Están completamente convencidos"
 willing_embrace_partial_accept.tooltip: "Se lo están planteando"
 willing_embrace_failure.tooltip: "Se niegan"


 POD_embrace.400.t: "El Abrazo"
 POD_embrace.400.desc: "He orquestado los acontecimientos para que [target.GetFirstName] haya caído en mis garras. Ahora, todo lo que tengo que hacer es quebrantar la voluntad de [victim.GetHerHis]."
 POD_embrace.400.option.a: "¡[victim.GetSheHe|U] hará lo que yo diga!"
 POD_embrace.400.option.a.success.tt: "Dominas exitosamente a [victim.GetFirstName] hasta someterlo"
 POD_embrace.400.option.a.fail.tt: "Fallas en tu intento de dominar a [victim.GetFirstName]"
 POD_embrace.400.option.b: "Nadie puede rechazarme"
 POD_embrace.400.option.b.success.tt: "Usas exitosamente Presencia para quebrantar la voluntad de [victim.GetHerHis]"
 POD_embrace.400.option.b.fail.tt: "Fallas en tu intento de seducir a [victim.GetFirstName]"
 POD_embrace.400.option.c: "¡[victim.GetSheHe|U] no es rival para mi poder!"
 POD_embrace.400.option.c.success.tt: "Golpeas exitosamente a [victim.GetFirstName] hasta someterlo"
 POD_embrace.400.option.c.fail.tt: "[victim.GetFirstName] te repele"
 POD_embrace.400.option.d: "En realidad... déjalo"
 POD_embrace.400.option.d.tt: "Abandonas tu intento de abrazar a [victim.GetFirstName]"
 
 POD_embrace.410.t: "El Abrazo"
 POD_embrace.410.desc: "Conseguiste tomar la delantera, y ahora [victim.GetFirstName] está a tu merced. Drenando la sangre de su cuerpo, puedes sentir cómo la vida abandona a [victim.GetFirstName]. Sabes que lo que intentas hacer rara vez tiene éxito, pero pensar en lo que podrías crear te hace olvidar todas esas tontas precauciones.\nAbrazar a cambiaformas casi nunca tiene éxito, ya que están protegidos contra la sangre vampírica. Los pocos casos registrados en que la víctima no muere durante el proceso terminan convirtiéndose en las temidas [Glossary('Abominaciones','game_concept_abomination_desc')]."
 POD_embrace.410.option.a: "Es hora de actuar"
 POD_embrace.410.option.a.tt: "Intentas abrazar a [victim.GetFirstName]"
 POD_embrace.410.option.a.fail.tt: "[victim.GetFirstName] muere en agonía"
 POD_embrace.410.option.a.success.tt: "[victim.GetFirstName] es abrazado con éxito"
 
 POD_embrace.420.t: "Creador de Monstruos"
 POD_embrace.420.desc: "Después de un tiempo [victim.GetFirstName] abre los ojos de [victim.GetHerHis]. Puedes ver una mueca de horror en el rostro de [victim.GetHerHis] y es entonces cuando te alcanza la terrible comprensión... Has tenido éxito, has creado un monstruo, una abominación que ahora es tu chiquillo."
 POD_embrace.420.option.a: "Éxito al fin"
 POD_embrace.420.option.a.tt: "[victim.GetFirstName] deja de ser un cambiaformas, y se convierte en una [Glossary('Abominación','game_concept_abomination_desc')]."
 
 POD_embrace.430.t: "Abrazo Fallido"
 POD_embrace.430.desc: "A pesar de todos tus intentos, [victim.GetFirstName] se ha ido. Todo lo que pudiste oír fueron los gritos de agonía de [victim.GetHerHis], cuando el cuerpo y el alma de [victim.GetHerHis] rechazaron violentamente tu sangre. Y ahora [victim.GetFirstName] se ha ido de verdad. Tal vez [victim.GetSheHe] tuvo suerte después de todo..."
 POD_embrace.430.option.a: "Decepcionante"
 POD_embrace.430.option.a.tt: "Tu intento de abrazo fracasó"
 
 POD_embrace.440.t: "Intento Fallido"
 POD_embrace.440.desc: "[victim.GetFirstName] consiguió resistir tus intentos de tomar la delantera. Ahora todo lo que puedes hacer es escapar de la ira de [victim.GetHerHis]."
 POD_embrace.440.option.a: "Derrota al fin"
 POD_embrace.440.option.a.tt: "Fallaste en abrazar a [victim.GetFirstName]"
 
 POD_embrace_ongoing.tt.target_will_be_embraced: "[target.GetFirstName] será abrazado por [foe.GetFirstName]"
 POD_embrace_ongoing.tt.ai_embraces_target: "[target.GetFullName] ha sido abrazado por [vampiresire.GetFullName]"
 POD_opponent_may_use_willpower: "[defender.GetFirstNameNoTooltip] podría ejercer su voluntad para resistir tus poderes." 
 POD_embrace_ongoing.t.mesmerize.success: "Intento de Hipnotizar Exitoso"
 
 POD_embrace_ongoing.1000.opening: "[rival.Custom2('AppropriateGreeting', ROOT.Char)]"
 POD_embrace_ongoing.1000.target_killed.desc: "Tu gusto por los mortales es verdaderamente decepcionante. Te he hecho el favor de elevar tus estándares. Realmente no deberías intentar traer a escoria como [target.GetFirstName] a nuestras filas. Estoy seguro de que me lo agradecerás más tarde."
 POD_embrace_ongoing.1000.target_killed.not_vampire.desc: "Sé qué clase de monstruo eres. ¡[target.GetFirstName] está mejor muerto que convertido en algo como tú!"
 POD_embrace_ongoing.1000.target_kidnapped.desc: "Cuando me enteré de tus intenciones hacia [target.GetFirstName], realmente no pude contenerme. Me he tomado la libertad de convertir a [target.GetHerHim] en mi invitado de honor. He llegado a pensar en [target.GetFirstName] como de la familia. Separarme de [target.GetHerHim] me entristecería profundamente. Aunque he oído que los regalos pueden alegrarle el día a uno."
 POD_embrace_ongoing.1000.target_embraced.desc: "¿Creíste que no me daría cuenta de que acechabas por aquí? He tomado lo que creías que era tuyo y lo he hecho mío."
 POD_embrace_ongoing.1000.option.a: "Pagar el Rescate"
 POD_embrace_ongoing.1000.pay_ransom.tt: "[target.GetFullName] te será enviado"
 POD_embrace_ongoing.1000.option.b: "Es solo otro mortal después de todo"
 POD_embrace_ongoing.1000.option.c: "¡Cruzarte en mi camino fue un error!"
 POD_embrace_ongoing.1001.target_maimed.desc: "Disfruté mucho de la compañía de [target.GetFullName]. Nos divertimos mucho juntos."
 POD_embrace_ongoing.1001.returned.desc: "Un placer hacer negocios contigo."
 POD_embrace_ongoing.1001.option.a: "Veamos la condición de nuestro futuro chiquillo"
 POD_embrace_ongoing.1001.option.b: "[rival.GetFirstNameNoTooltip] más vale que vigile sus espaldas"
 POD_embrace_ongoing.1002.desc.target_maimed: "[rival.GetTitledFirstName] te ha devuelto a [victim.GetFullName], pero no como era [victim.GetSheHe]. Sean cuales sean los horrores infligidos a [victim.GetHerHim], ahora debes decidir qué hacer con [victim.GetFirstName]."
 POD_embrace_ongoing.1002.desc.target_returned: "[rival.GetTitledFirstName] te ha devuelto a [victim.GetFullName] ileso, tal como prometió. Al menos el villano mantiene su palabra. Ahora debes decidir qué hacer con [victim.GetFirstName]."
 POD_embrace_ongoing.1002.t: "¿Qué hacer con [target.GetFullName]?"
 POD_embrace_ongoing.1002.option.a: "He cambiado de opinión"
 POD_embrace_ongoing.1002.option.b: "¿Por dónde íbamos?"
 POD_embrace.ongoing.1002.tt.embrace: "Abrazas a [victim.GetFirstName]"
 POD_embrace_ongoing.1002.option.c: "Este está arruinado, pero hay otros usos..."
 POD_embrace_ongoing.1002.option.d: "¡Esto es un trabajo impresionante. Verdaderamente impresionante!"
 POD_embrace_ongoing.1002.option.e: "¡Aficionados! ¡Os mostraré cómo se hace!"
 POD_embrace_ongoing.1002.tt.transmogrify_option: "Usar vicisitud para transmutar a [victim.GetFirstName] puede despertar el hambre, poner a prueba tu voluntad y arriesgarse a exponer la Mascarada."

 POD_embrace_ongoing.1010.t: "Otro Acecha la Noche"
 POD_embrace_ongoing.1010.desc: "Mientras observas a [target.GetFirstName], notas que no estás solo. Sientes otra presencia oscura muy parecida a la tuya. Te preguntas si ellos también pueden sentirte a ti. ¿Deberías usar el elemento sorpresa u otros medios para asegurarte de que [target.GetFirstName] siga siendo solo tuyo?"
 POD_embrace_ongoing.1010.option.a: "Concertar una Reunión"
 POD_embrace_ongoing.1010.option.b: "Intentar una Emboscada"
 POD_embrace_ongoing.1010.option.ambush_won.desc: "Ahuyentas con éxito a tu competencia"
 POD_embrace_ongoing.1010.option.ambush_fail.desc: "[foe.GetSheHe|U] sabía que estabas ahí. Ahora debes enfrentarte a [foe.GetFirstName] en combate"
 POD_embrace_ongoing.1010.option.prowess_lost.desc: "Eres derrotado"
 POD_embrace_ongoing.1010.option.c: "De todos modos, ya no quiero a [target.GetFullName]"
 POD_embrace_ongoing.1011.t: "Reunión"
 POD_embrace_ongoing.1011.desc: "Decides reunirte con [foe.GetFullName] para discutir el futuro de [target.GetFullName]. ¿Quizás se puede llegar a una solución amistosa?"
 POD_embrace_ongoing.1011.option.a: "Tus sirvientes no tienen derecho a lo que es legítimamente tuyo"
 POD_embrace_ongoing.1011.option.b: "La adulación tiene sus usos"
 POD_embrace_ongoing.1011.option.b.t.CRITICAL_SUCCESS: "Lengua de Plata Ciertamente"
 POD_embrace_ongoing.1011.option.b.t.SUCCESS: "Se Llegó a un Acuerdo"
 POD_embrace_ongoing.1011.option.b.t.FAILURE: "La Conversación Nunca Fue tu Punto Fuerte de Todos Modos"
 POD_embrace_ongoing.target_will_be_embraced: "[target.GetFullName] será abrazado por [foe.GetFullName]"
 POD_embrace_ongoing.1011.option.e: "[foe.GetFullName] me debe un favor"
 POD_embrace_ongoing.1011.option.f: "Todo el mundo tiene un precio"
 POD_embrace_ongoing.1011.option.c: "Intentar Hipnotizar a [foe.GetHerHim]"
 POD_embrace_ongoing.1011.option.d: "Intentar Cautivar a [foe.GetHerHim]"
 POD_embrace_ongoing.1012.t: "Ataque Sorpresa"
 POD_embrace_ongoing.1012.duel_won.desc: "Has conseguido herir a [foe.GetFirstName], haciéndole huir. Ahora que eso está resuelto, puedes volver a centrar tus esfuerzos en [target.GetFullName]"
 POD_embrace_ongoing.1012.duel_lost.desc: "Has sido derrotado. Debes escapar rápidamente mientras puedas."
 POD_embrace_ongoing.1012.option.a: "¡[target.GetFullName] es todo mío ahora!"
 POD_embrace_ongoing.1012.option.b: "Olvídate de [target.GetFullName]. [sc_defender.GetFullName] puede quedarse con [target.GetHerHim]"
 POD_embrace_ongoing.1013.t: "Cautivar a [defender.GetFirstNameNoTooltip]"
 POD_embrace_ongoing.entrance_success: "[defender.GetTitledFirstName] estará asombrado por tu majestuosidad"
 POD_embrace_ongoing.willpower_spent: "Avivar la sangre y ejercer mi voluntad. ¡No se me negará!"
 POD_embrace_ongoing.t.entrance.success: "[defender.GetTitledFirstName] Cautivado"
 POD_embrace_ongoing.willpower_unspent: "Avivar la sangre"
 POD_embrace_ongoing.1014.t: "Hipnotizar a [defender.GetTitledFirstName]"
 POD_embrace_ongoing.mesmerize_win: "Implantarás con éxito una sugestión hipnótica en la mente subconsciente de [defender.GetHerHis]"
 POD_embrace_ongoing.mesmerize_lose: "Fracasarás en influir en la mente de [defender.GetHerHis]"
 POD_embrace_ongoing.1015.t: "Hipnotizar Fallido"
 POD_embrace_ongoing.1015.give_up.desc: "Decidiste no disputar el destino de [target.GetFullName]. Sin tu interferencia, [foe.GetFullName] ha abrazado a [target.GetHerHim]."
 POD_embrace_ongoing.1015.defiant_vassal.desc: "En directa desobediencia a tus órdenes, [foe.GetFullName] no te ha entregado a [target.GetFullName] y en su lugar ha abrazado a [target.GetHerHim]. Seguramente esta rebeldía no puede quedar sin castigo."
 POD_embrace_ongoing.1015.negotiations_failed.desc: "Tus negociaciones con [foe.GetFullName] han fracasado. No solo ha abrazado [foe.GetSheHe] a [target.GetFullName], sino que no has recibido nada a cambio por renunciar a tu futuro chiquillo."
 POD_embrace_ongoing.1015.entrance_failed.desc: "Tu intento de cautivar sutilmente a [foe.GetFullName] ha salido mal. [foe.GetSheHe|U] ha abrazado a [target.GetFullName] y no olvidará tu intento de manipular a [foe.GetHerHim]."
 POD_embrace_ongoing.1015.mesmerize_failed.desc: "Tu intento de doblegar a [foe.GetFullName] a tu voluntad ha fracasado. Los Vástagos no se toman a la ligera los intentos de usar tales poderes contra otros vástagos. [foe.GetSheHe|U] ha abrazado a [target.GetFullName] y es poco probable que perdone u olvide lo que intentaste hacer."
 POD_embrace_ongoing.1015.option.a: "No se puede ganar siempre"
 POD_embrace_ongoing.1015.option.b: "¡Si no puedo tener a [target.GetFullName], nadie lo hará!"
 POD_embrace_ongoing.1015.option.c: "Hay otras formas de ajustar cuentas"
 
 POD_embrace_ongoing.1020.t: "[target.GetFirstNameNoTooltip] No es Digno del Don"
 POD_embrace_ongoing.1020.desc: "Durante tus observaciones de [target.GetFullName] no puedes evitar sentirte decepcionado con [target.GetHerHim]. [target.GetSheHe|U] no está alcanzando todo su potencial. Tal vez juzgaste mal a [target.GetHerHim] y ¿no es [target.GetSheHe] verdaderamente digno del don?"
 POD_embrace_ongoing.1020.option.a: "Continuar con los preparativos según lo planeado"
 POD_embrace_ongoing.stop: "Detener los Preparativos"
 POD_embrace_ongoing.1020.option.c: "Este solo sirve como alimento"
 POD_embrace_ongoing.1020.option.c.tt.suck: "#beast ¡Sí! Toma la sangre. Ellos ya no la necesitan. ¡Nosotros sí!#!"
 POD_embrace_ongoing.1020.option.d: "No solo es indigno [target.GetSheHe] del don..."
 POD_embrace_ongoing.1030.t: "[target.GetFullNameNoTooltip] Te Impresiona"
 POD_embrace_ongoing.1030.intro.desc: "Después de seguir a [target.GetFirstName] durante un tiempo, has llegado a la conclusión de que [target.GetSheHe] tiene un potencial sin explotar."
 POD_embrace_ongoing.1030.diplomacy_bonus.desc: "Encuentras que sea quien sea con quien se encuentre [target.GetSheHe], es capaz de usar una conversación trivial para hacerlos sentir cómodos y dóciles. Un talento que solo se verá potenciado por el Abrazo."
 POD_embrace_ongoing.1030.martial_bonus.desc: "[target.GetFirstName] es un líder nato. Ves que otros gravitan hacia [target.GetHerHim] y encuentran fácil asumir un papel subordinado ante [target.GetHerHim]."
 POD_embrace_ongoing.1030.stewardship_bonus.desc: "[target.GetSheHe|U] ha logrado mantener sus finanzas en orden a pesar de las dificultades. [target.GetFirstName] se adaptará fácilmente a los aspectos comerciales."
 POD_embrace_ongoing.1030.intrigue_bonus.desc: "[target.GetSheHe|U] ha aprendido que el engaño es una herramienta útil para la supervivencia en los asuntos humanos. Esto es doblemente cierto en el mundo de los no-muertos."
 POD_embrace_ongoing.1030.learning_bonus.desc: "Pocos llegan a comprender verdaderamente que 'El Conocimiento es Poder'. Sin embargo, [target.GetFirstName] ha comenzado ese viaje con una inclinación por la lectura."
 POD_embrace_ongoing.1030.option.a: "Un Buen Comienzo"

 POD_embrace_ongoing.1040.t: "¡[target.GetFirstNameNoTooltip] ya es un Vampiro!"
 POD_embrace_ongoing.1040.desc: "[target.GetFirstName] tiene un talento para la Mascarada. Su disfraz funcionó tan bien que incluso tú te dejaste engañar al principio. ¿Quizás hay otros propósitos para los que podrías utilizar a [target.GetHerHim]?"
 POD_embrace_ongoing.1040.option.a: "¡Esto ya ha sido una pérdida de tiempo!"
 POD_embrace_ongoing.1040.option.b: "¿Un nuevo subordinado o juguete?"
 POD_embrace_ongoing.1040.option.c: "¡Mátalos!"
 POD_embrace_ongoing.1040.option.c.duel_won.desc: "Despachas rápidamente al indigno $pod_cainite$ sin problemas."
 POD_embrace_ongoing.1040.option.c.duel_won.t: "Duelo Ganado"
 POD_embrace_ongoing.1040.option.c.duel_lost.desc: "Has subestimado a [target.GetHerHim]"
 POD_embrace_ongoing.duel_outcome.LOST.1043.t: "¡Mi Reino por un Caballo!"
 POD_embrace_ongoing.duel_outcome.LOST.1043.desc: "Lo impensable ha sucedido. [target.GetFirstNameNoTooltip] te ha herido. Debes escapar rápidamente antes de perder algo más que tu orgullo. ¿Dejarás a [target.GetHerHim] sin castigo?"
 POD_embrace_ongoing.1041.t: "Amigo o Enemigo"
 POD_embrace_ongoing.1041.desc: "Después de estudiar sus rutinas diarias, esperas en una zona donde seguro que [target.GetSheHe] se topará contigo. Te enfrentas a [target.GetFirstName] en un intento de reclutarlo para tu corte."
 POD_embrace_ongoing.1041.option.a: "Resulta que ya me deben un favor"
 POD_embrace_ongoing.1041.option.b: "Intentar Hipnotizar a [target.GetHerHim]"
 POD_embrace_ongoing.1041.option.c: "Intentar Cautivar a [target.GetHerHim]"
 POD_embrace_ongoing.1041.option.d: "Puedo convencer a [target.GetHerHim] de que se una a mí"
 POD_embrace_ongoing.1041.option.e: "Cambio de opinión"
 POD_embrace_ongoing.1041.tt.SUCCESS: "Logras convencer a [target.GetFirstNameNoTooltip] para que se una a tu corte"
 POD_embrace_ongoing.1041.tt.FAILURE: "No logras convencer a [target.GetFirstNameNoTooltip] para que se una a tu corte"
 POD_embrace_ongoing.1042.t: "Hostilidad Inesperada"
 POD_embrace_ongoing.1042.desc: "Aunque intentaste presentarte como una amenaza nula, ¡[target.GetFirstName] ha aprovechado esta oportunidad para atacarte!"
 POD_embrace_ongoing.1042.won.desc: "Sometes a [target.GetFirstNameNoTooltip]"
 POD_embrace_ongoing.1042.lost.desc: "[target.GetFirstNameNoTooltip] te hiere"
 POD_embrace_ongoing.1043.option.a: "Admito la derrota"
 POD_embrace_ongoing.1044.duel_lost.desc: "A pesar de tus valientes esfuerzos, [target.GetFirstName] logró herirte. Desapareces rápidamente entre las sombras."
 POD_embrace_ongoing.1048.entrance_failed.desc: "Tus encantos no sirven de nada. [target.GetFirstNameNoTooltip] se ha percatado de tu intento de fascinación y se ha negado a hablar más contigo."
 POD_embrace_ongoing.1048.mesmerize_failed.desc: "Tu intento de doblegar a [target.GetFullNameNoTooltip] a tu voluntad ha fracasado. Los Vástagos no se toman a la ligera los intentos de usar tales poderes contra otros vástagos y es poco probable que perdonen u olviden lo que intentaste hacer."
 
 POD_embrace_ongoing.1050.t: "¡[target.GetFirstNameNoTooltip] es un Hombre Lobo!"
 POD_embrace_ongoing.1050.desc: "Este es más listo que la mayoría de los de su especie. [target.GetSheHe|U] fue capaz de ocultarte su verdadera naturaleza. Quizás le pasa algo a tu olfato, ya que el hedor a hombre lobo es ahora inconfundible."
 POD_embrace_ongoing.1050.option.a: "Crear una [Glossary('Abominación','game_concept_abomination_desc')]"
 POD_embrace_ongoing.1050.option.c.duel_won.desc: "Matas a la apestosa criatura"
 POD_embrace_ongoing.1050.abomo_warning: "Si es que es siquiera posible, abrazar a un hombre lobo conlleva un gran riesgo tanto para ti como para tu víctima"
 
 POD_embrace_ongoing.1060.t: "¡[target.GetFirstNameNoTooltip] es un Cazador!"
 POD_embrace_ongoing.1060.desc: "A la luz de la luna notas que hay más en este mortal de lo que parece a simple vista. [target.GetSheHe|U] lleva un símbolo religioso alrededor del cuello que te resulta vagamente familiar. Sigues observando a [target.GetHerHim] y ves que [target.GetSheHe] tiene un cinturón oculto bajo su capa con varias herramientas destinadas únicamente a la destrucción de tu especie."
 POD_embrace_ongoing.1060.option.c.duel_won.desc: "Un supuesto 'cazavampiros' menos del que ocuparse"
 POD_embrace_ongoing.1060.hunter_warning.tt: "Abrazar a un cazador conlleva riesgos inherentes"
 POD_embrace_ongiong.1060.option.d: "Azuzar a [target.GetHerHim] contra mi rival"
 POD_embrace_ongoing.mesmerize_failed.1061.t: "Intento de Hipnotizar Fallido"
 POD_embrace_ongoing.mesmerize_failed.1061.desc: "[target.GetFirstNameNoTooltip] ha sido capaz de resistir tu dominación sobre su mente. Te has revelado ante los cazadores de la zona y ahora tienes una diana en tu espalda."
 POD_embrace_ongoing.mesmerize_failed.1061.option.a: "Debo mantener un perfil bajo por un tiempo"
 POD_embrace_ongoing.mesmerize_success.1062.t: "Quién Dijo que los Cazadores no Sirven para Nada"
 POD_embrace_ongoing.mesmerize_success.1062.desc: "Has implantado con éxito la idea en [target.GetFirstNameNoTooltip] de poner su punto de mira sobre [picked_rival.GetFirstNameNoTooltip]. Con algo de suerte, el cazador matará a [picked_rival.GetFirstNameNoTooltip] o morirá a manos de [picked_rival.GetFirstNameNoTooltip], o mejor aún, ambos morirán."
 POD_embrace_ongoing.mesmerize_success.1062.option.a: "Espléndido"