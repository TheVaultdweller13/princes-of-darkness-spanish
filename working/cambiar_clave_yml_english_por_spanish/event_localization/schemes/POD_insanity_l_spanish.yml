l_spanish:

 POD_insanity.001.t: "Dones de locura"
 POD_insanity.001.desc: "¡Todo está listo, ahora puedo compartir mi locura con [defender.GetFirstName]! Estará agradecid[defender.GetCustom('ES_O')] por tales dones, ¿verdad?"
 POD_insanity.001.option.a: "¡Un don de conocimiento, eso es lo que necesita!"
 POD_insanity.001.option.a.tt: "Duelo de aprendizaje entre tú y [defender.GetFirstName]"
 POD_insanity.001.option.a.tt.beast: "#beast ¡La maldición del conocimiento quebrantará su mente!#!"
 POD_insanity.001.option.b: "Las sombras, ¿acaso hablan?"
 POD_insanity.001.option.b.tt: "Duelo de intriga entre tú y [defender.GetFirstName]"
 POD_insanity.001.option.b.tt.beast: "#beast ¡No se sentirá segur[defender.GetCustom('ES_O')] en la oscuridad!#!"
 POD_insanity.001.option.c: "Su mente parece un buen hogar para... alguien más."
 POD_insanity.001.option.c.tt: "Duelo marcial entre tú y [defender.GetFirstName]"
 POD_insanity.001.option.c.tt.beast: "#beast ¡Nunca más volverá a estar sol[defender.GetCustom('ES_O')]!#!"
 POD_insanity.001.option.d: "La verdad aplastará sus vanas esperanzas"
 POD_insanity.001.option.d.tt: "Duelo de gestión entre tú y [defender.GetFirstName]"
 POD_insanity.001.option.d.tt.beast: "#beast ¡Oh, cruel verdad!#!"
 POD_insanity.001.option.e: "Sin dones para [defender.GetHerHim]"
 POD_insanity.001.option.e.tt: "Detendrás tus intentos de infligir locura a [defender.GetFirstName]"
 POD_insanity.001.option.e.tt.beast: "#beast ¡¿Por qué te detienes, necio?!#!"  
     
 POD_insanity.001.option.a.desc: "Conflicto de aprendizaje"
 POD_insanity.001.option.b.desc: "Conflicto de intriga"
 POD_insanity.001.option.c.desc: "Conflicto marcial"
 POD_insanity.001.option.d.desc: "Conflicto de gestión"
 POD_insanity.001.option.success: "[attacker.GetFirstName] gana"
 POD_insanity.001.option.failure: "[defender.GetFirstName] gana"
 POD_insanity.001.option.a.tt.attacker_wins: "Inflijo mi maldición de conocimiento a [defender.GetFirstName]"
 POD_insanity.001.option.a.tt.attacker_lost: "[defender.GetFirstName] se resiste"
 POD_insanity.001.option.b.tt.attacker_wins: "Las sombras están hablando con [defender.GetFirstName]"
 POD_insanity.001.option.b.tt.attacker_lost: "[defender.GetFirstName] se resiste"
 POD_insanity.001.option.c.tt.attacker_wins: "[defender.GetFirstName] no está sol[defender.GetCustom('ES_O')] en su mente"
 POD_insanity.001.option.c.tt.attacker_lost: "[defender.GetFirstName] se resiste"
 POD_insanity.001.option.d.tt.attacker_wins: "La carga de la verdad recae sobre sus hombros"
 POD_insanity.001.option.d.tt.attacker_lost: "[defender.GetFirstName] se resiste"
 
 POD_insanity.toast.success: "¡Maldit[defender.GetCustom('ES_O')]!"
 POD_insanity.toast.failure: "¡Maldición fallida!"
