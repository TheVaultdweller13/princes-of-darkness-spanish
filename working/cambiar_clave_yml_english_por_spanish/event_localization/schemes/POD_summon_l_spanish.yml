l_spanish:

 POD_summon.10.desc: "Sientes tu energía mística tocando la mente de [target.GetTitledFirstName].\nUsar Convocar es un poder invasivo. A menos que ya tengas una relación amistosa con [target.GetFirstNameNoTooltip], te guardará rencor por usar el poder de la sangre con él. Si tienes éxito, tendrás que continuar la convocatoria hasta que [target.GetFirstNameNoTooltip] llegue."
 POD_summon.10.option.a: "¡Ven a mí!"
 POD_summon.10.crit_success.desc: "[target.GetFirstNameNoTooltip] correrá hacia ti. Hará cualquier cosa para alcanzarte."
 POD_summon.10.success_desc: "[target.GetFirstNameNoTooltip] vendrá a ti a una velocidad razonable"
 POD_summon.10.failure_desc: "[target.GetFirstNameNoTooltip] resistirá tu convocatoria y no podrás intentar otra convocatoria con [target.GetHerHim] durante 10 años"
 POD_summon.10.botch_desc: "Tu convocatoria fallará críticamente, impidiéndote intentar otra convocatoria con [target.GetHerHim] durante 50 años"
 POD_summon.10.option.b: "Ya no deseo convocar a [target.GetHerHim]"

 POD_summon.11.desc.crit_success: "Tu convocatoria ha sido un éxito crítico. [target.GetFirstNameNoTooltip] está haciendo todo lo que está en su mano para llegar a ti lo antes posible."
 POD_summon.11.desc.success: "[target.GetFirstNameNoTooltip] viene hacia ti a un ritmo razonable."
 POD_summon.11.desc: "Tendrás que seguir gastando puntos de sangre para progresar en la convocatoria hasta que [target.GetSheHe] llegue."
 POD_summon.11.option.a: "Vale"

 POD_summon.100.t: "Estás siendo convocad[GetPlayer.GetCustom('ES_O')]"
 POD_summon.100.desc: "Sientes un impulso de acudir al lado de [schemer.GetTitledFirstName]. ¡Es claramente antinatural, un vampiro fuerte está usando los dones de Caín contra ti!"
 POD_summon.100.option.a: "Ejercer mi fuerza de voluntad para resistir la convocatoria."
 POD_summon.100.option.b: "Rechazar la convocatoria."
 POD_summon.100.option.c: "Aceptar la convocatoria."
 
 POD_summon.200.t: "Convocando a [target.GetFirstNameNoTooltip]"
 POD_summon.200.desc: "Siento mi energía mística tocando la mente de [target.GetTitledFirstName]. Se está resistiendo a la convocatoria. Los dones de Caín no son perfectos, y solo llegan hasta donde llega tu fuerza de voluntad. Sin embargo, el vínculo aún no se ha perdido y podría usar mi sangre y mi fortaleza mental para aumentar la convocatoria, haciéndola aún más irresistible."
 POD_summon.200.option.a: "Exaltar la sangre para traer[target.GetHerHim] ante mí."
 POD_summon.200.a.tt_fortitude: "[target.GetFirstNameNoTooltip] es expert[target.GetCustom('ES_O')] en la $pod_discipline$ de Fortaleza y es resistente a tus poderes."
 POD_summon.200.a.tt_willpower: "[target.GetFirstNameNoTooltip] ha ejercido su voluntad para resistir tus poderes."
 POD_summon.200.a.success.desc: "Victoria"
 POD_summon.200.a.tt_success: "[target.GetTitledFirstName] llegará a mi corte"
 POD_summon.200.a.failure.desc: "Derrota"
 POD_summon.200.a.tt_failure: "[target.GetTitledFirstName] resistirá mi convocatoria"
 POD_summon.200.option.b: "Exaltar la sangre y ejercer mi voluntad. ¡No seré rechazad[GetPlayer.GetCustom('ES_O')]!"
 POD_summon.200.option.b.tt.beast: "#beast ¡Sí! ¡Tráe[target.GetHerHim] ante nosotros!#!"
 POD_summon.200.option.c: "Rendirse, ya no quiero a [target.GetHerHim]."
 POD_summon.200.option.c.tt: "La convocatoria fallará."
 POD_summon.200.option.c.tt.beast: "#beast ¡No! ¡Se está escapando!#!"
 
 POD_summon.300.t: "[target.GetFirstNameNoTooltip] convocad[target.GetCustom('ES_O')]"
 POD_summon.300.desc: "Mediante el uso de mi poder místico, [target.GetTitledFirstName] ha llegado a mi corte. Ahora es el momento de decidir qué haré con este nuevo invitado. ¿Un lugar de honor o de vergüenza?\nEn cualquier caso, no esperes que se lo tome bien al principio. Convocar a alguien sin su consentimiento usando el poder puro de tu sangre no es muy amistoso."
 POD_summon.300.option.a: "Bienvenido a mi hogar, dijo la araña a la mosca."
 POD_summon.300.option.a.tt.beast: "#beast ¡Hora de cenar!#!"
 
 POD_summon.400.t: "Has llegado"
 POD_summon.400.desc: "Te encuentras en la corte de [schemer.GetTitledFirstName]." 
 POD_summon.400.option.a: "Mi nuevo hogar."
  
 POD_summon.500.t: "Resistió la convocatoria"
 POD_summon.500.desc: "[target.GetTitledFirstName] se ha resistido a mi convocatoria. Su voluntad fue más fuerte y probablemente no olvidará tu invasión en su mente por un tiempo. Convocar a alguien con el poder puro de la sangre no es muy amistoso, después de todo." 
 POD_summon.500.option.a: "¡Frustrado!"
 POD_summon.500.option.a.tt.beast: "#beast ¡Vamos a cazar[target.GetHerHim] y a comer[target.GetHerHim]!#!"
 POD_summon.500.desc.summon_failure: "\n\n#X No podrás intentar convocar a [target.GetFirstNameNoTooltip] durante 10 años.#!"
 POD_summon.500.desc.summon_botch: "\n\n#X No podrás intentar convocar a [target.GetFirstNameNoTooltip] durante 50 años.#!"
 
 POD_summon.600.t: "Convocatoria resistida"
 POD_summon.600.desc: "Ya no sientes la llamada de [schemer.GetTitledFirstName]." 
 POD_summon.600.option.a: "¡Fuera de mi mente!"
 
 temp_immune_summon: "Debido a un intento fallido previo, [recipient.GetFirstNameNoTooltip] es inmune a tus intentos de Convocar hasta el [GetCurrentDateWithDiff( GetVarTimeRemaining( recipient.MakeScope, 'immune_to_summon_from_actor') )]"
