l_spanish:

 POD_werewolves.1.t: "Canciones primordiales"
 POD_werewolves.1.desc: "Los hombres lobo Galliard son la voz del Pueblo, llamándolos a la batalla e inspirándolos a la grandeza en la vida y en la muerte. También son guardianes de las tradiciones, portando el saber de las tribus desde el principio de los tiempos.\nComo narradores alrededor de la hoguera, los Galliard transmiten historias y canciones contadas desde el inicio de los tiempos. ¿Cuál será hoy?"
 POD_werewolves.1.option.a: "Una canción de unidad tribal."
 primal_song_modifier: "Canción de unidad"
 primal_song_modifier_desc: "¡Como los héroes de antaño, debemos permanecer unidos!"
 POD_werewolves.1.option.b: "Un relato de victorias antiguas."
 song_heroes_modifier: "Canción de héroes"
 song_heroes_modifier_desc: "Hay sabiduría en las victorias, e incluso en las derrotas, de nuestros antepasados."
 POD_werewolves.1.option.c: "Un relato de sangre y batalla."
 song_rage_modifier: "Canción de rabia"
 song_rage_modifier_desc: "Ante todo, somos guerreros y debemos recordar siempre nuestro espíritu de lucha."
 POD_werewolves.1.option.d: "Un relato de unidad y valor."


 POD_werewolves.2.t: "Convocar duplicados sombríos"
 POD_werewolves.2.desc: "Con tu maestría en el Don del espíritu de la noche, puedes intentar convocar duplicados sombríos de ti mismo para el combate."
 POD_werewolves.2.option.a: "¡Yo os convoco!"
 POD_werewolves.2.option.a.tt: "Intentarás convocar duplicados sombríos"
 POD_werewolves.2.option.a.desc: "Una lucha con tu fuerza de voluntad"
 POD_werewolves.2.option.a.tt.success: "Tu duplicado sombrío ha sido convocado con éxito"
 POD_werewolves.2.option.a.tt.failure: "No logras convocar a tu duplicado sombrío"
 POD_werewolves.2.option.b: "Ahora no es el momento adecuado"
 POD_werewolves.2.option.b.tt: "Abandonarás tu idea de convocar duplicados sombríos"
 POD_werewolves.3.t: "Convocar duplicados sombríos"
 POD_werewolves.3.desc: "Con tu maestría en el Don del espíritu de la noche, has logrado convocar con éxito duplicados sombríos de ti mismo, ahora es el momento de dar órdenes."
 POD_werewolves.3.option.a: "Luchad por mí en la batalla"
 POD_werewolves.3.option.a.tt: "Tu duplicado sombrío ha sido convocado con éxito."
 POD_werewolves.4.t: "Convocar duplicados sombríos"
 POD_werewolves.4.desc: "Incluso tu maestría en el Don del espíritu de la noche no es suficiente para convocar a tu duplicado sombrío... por ahora."
 POD_werewolves.4.option.a: "Aún no estoy preparado"
 POD_werewolves.4.option.a.tt: "No has logrado convocar a tu duplicado sombrío"
 POD_werewolves.5.t: "El duplicado sombrío se desvanece"
 POD_werewolves.5.desc: "Tu duplicado sombrío ha sufrido un incidente y se ha desvanecido."
 POD_werewolves.5.option.a: "Mi duplicado sombrío es destruido"
 POD_werewolves.5.option.a.tt: "Tu duplicado sombrío ya no existe"
 POD_werewolves.6.t: "Renuncia al Auspicio"
 POD_werewolves.6.desc: "En este raro rito, un hombre lobo rechaza el auspicio bajo el cual nació y elige uno nuevo. Deseas adoptar..."

 POD_werewolves.7.t: "Es un niño..."
 POD_werewolves.7.desc: "Parece que Gaia no ha creído conveniente bendecirte hoy: tu bebé es un niño. La sociedad de las Furias Negras es muy estricta sobre lo que debe hacerse y sabes que ha sido el camino de tu tribu durante generaciones.\nHay algunos varones entre tu gente, por lo que elegir quedarte con este niño no carecería de precedentes si así lo desearas, pero seguiría siendo una gran afrenta a la tradición y sería considerado como un signo de debilidad por tus hermanas. Al final del día, sin embargo, la elección es solo tuya."
 POD_werewolves.7.option.a: "¡Un varón débil no tiene lugar entre nosotras!"
 POD_werewolves.7.option.b: "¡Sigo siendo su madre!"