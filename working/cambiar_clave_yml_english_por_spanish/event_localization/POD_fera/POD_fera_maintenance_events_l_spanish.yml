 POD_fera_maintenance.2.t: "Primer Cambio"
 POD_fera_maintenance.2.desc: "El Primer Cambio es el nombre que recibe la primera transformación de un joven $glossary_fera$. Normalmente viene acompañado del primer frenesí y el primer uso de la forma de combate en situaciones de gran estrés.\nAcabas de experimentar este evento traumático y ahora eres oficialmente un cambiaformas, un miembro de pleno derecho de tu tribu con todas las responsabilidades y privilegios que conlleva tal papel."
 POD_fera_maintenance.2.option.a: "Ahora soy un adulto."


 POD_fera_maintenance.101.t: "Regeneración"
