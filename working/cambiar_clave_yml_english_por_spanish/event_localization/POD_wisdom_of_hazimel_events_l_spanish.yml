l_spanish:

 POD_hazimel_wisdom.001.t: "Buscando la Sabiduría"
 POD_hazimel_wisdom.001.desc: "El gran Hazimel pagó un precio por su sabiduría: su ojo. Su ejemplo sigue siendo seguido por algunos Ravnos hasta el día de hoy, ya que nadie puede alcanzar la grandeza sin sacrificios.\nNo todos los vástagos están dispuestos a sacrificar una parte de su cuerpo inmortal para obtener conocimiento. Tú, a diferencia de otros, estás preparado para hacerlo. Solo los valientes pueden alcanzar la sabiduría eterna, pero ¿eres lo suficientemente fuerte como para hacer un sacrificio sin vuelta atrás?"
 POD_hazimel_wisdom.001.option.a: "Seguiré el ejemplo de Hazimel. Un ojo a cambio de conocimiento"
 POD_hazimel_wisdom.001.option.a.tt: "Perderás tu ojo y no podrás curarlo"
 POD_hazimel_wisdom.001.option.b: "¡Mi pierna no es nada comparada con el conocimiento que obtendré!"
 POD_hazimel_wisdom.001.option.b.tt: "Perderás tu pierna y no podrás curarla"
 POD_hazimel_wisdom.001.option.c: "Yo... no estoy preparado"
 POD_hazimel_wisdom.001.option.c.tt: "Abandonarás tu búsqueda de sabiduría"