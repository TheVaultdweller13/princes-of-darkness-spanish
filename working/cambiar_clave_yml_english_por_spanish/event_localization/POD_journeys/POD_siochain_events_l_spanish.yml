l_spanish:
 POD_siochain.1.t: "Mundo de gris"
 POD_siochain.1.desc: "El Mundo de Otoño se me ha revelado.\n\nLa Banalidad es necesaria. Sin sombra, no habría luz. Sin un contorno, no habría formas. Y la Banalidad es lo que da forma al caos puro y desenfrenado del Ensueño.\n\nCon esta comprensión, he obtenido una pieza del rompecabezas. Pero aún queda más por aprender."
 POD_siochain.1.a: "Un paso más cerca de la perfección."
 POD_siochain.1.a.tooltip: "Ahora puedes pasar al siguiente paso de tu [journey|E]: contemplar el Ensueño."
 
 POD_siochain.2.t: "Mundo de color"
 POD_siochain.2.desc: "El Ensueño se me ha revelado.\n\nLa creatividad significa dejarse llevar. Significa estar abierto a lo que sea que se cruce en mi camino, ya sea bueno o malo, alegría o dolor, éxito o fracaso.\n\nTiene sentido de forma aislada, pero ¿puede esta perspicacia coexistir con la Banalidad?"
 POD_siochain.2.a.tooltip: "Ahora puedes pasar al paso final de tu [journey|E]: integrar ambos aspectos de tu alma."
 
 POD_siochain.3.t: "El ojo de la tormenta"
 POD_siochain.3.desc: "Medito para convocar a las dos mitades de mi ser, y el aire mismo empieza a gritar.\n\nEl Glamour voluble, tirando de mí, anhelando correr libre. Y la pesada Banalidad, anclándome al sitio, implacable, despiadada.\n\nHay destellos de algo allí. Alguna perspicacia medio olvidada, como una palabra en la punta de la lengua que no puedo recordar. Está ahí. Lo sé. Y estoy a punto de perderlo..."
 POD_siochain.3.a.tooltip: "Este es el momento de la verdad. Mantén la calma. Sé paciente."
 POD_siochain.3.a.success: "Tienes éxito"
 POD_siochain.3.a.failure: "Fracasas"
 
 POD_siochain.4.t: "La calma tras la tormenta"
 POD_siochain.4.desc: "No sabía que la tensión podía empeorar tanto. Está a punto de desgarrarme.\n\nY de repente, no lo hace.\n\nEstallo en carcajadas porque ahora es tan obvio. El equilibrio no es el destino. El equilibrio es un proceso. Y ese proceso soy yo.\n\nMe siento más vivo de lo que me he sentido nunca. Mis músculos se flexionan y mi mente corre con nuevas posibilidades, y me siento presente, verdaderamente presente, por primera vez en mi vida."
 POD_siochain.4.a: "He nacido de nuevo."
 POD_siochain.4.a.tooltip: "Has logrado algo que se creía imposible."
 
 POD_siochain.5.t: "Devastación"
 POD_siochain.5.desc: "No sabía que la tensión podía empeorar tanto. Está a punto de desgarrarme.\n\nY entonces sucede.\n\nMi alma feérica se encoge como un animal asustado ante la Banalidad, oh majestuosa Banalidad, Banalidad demoledora. El gran vacío. El señor frío e indiferente de este universo.\n\n¿En qué estaba pensando, enfrentándome a esta fuerza de la naturaleza? Todo el color ha abandonado el mundo. Se acabó. Estoy pensando..."
 POD_siochain.5.a: "...¡Aún no ha terminado!"
 POD_siochain.5.a.tooltip: "Se requiere toda tu fuerza para superar la Banalidad, pero te recuperarás, con el tiempo."
 POD_siochain.5.b: "...Así que no había esperanza desde el principio..."
 POD_siochain.5.b.tooltip: "Caes en la Banalidad..."
 dauntain_work_in_progress: "¡Los Dauntain aún no están implementados en [princes_of_darkness|E]!"
 
 POD_siochain.6.t: "Una odisea gris"
 POD_siochain.6.desc.1: "La Banalidad es como un océano. Es, tipo, muy grande."
 POD_siochain.6.desc.2: "La Banalidad es como un burro. Es muy peludo."
 POD_siochain.6.desc.3: "La Banalidad es como un caballero orgulloso, si no fuera muy orgulloso."
 POD_siochain.6.desc.4: "La Banalidad es como colores que no tienen ningún color."
 POD_siochain.6.desc.5: "La Banalidad es como una calle de sentido único que va en ambos sentidos."
 POD_siochain.6.desc: "\n\nVaya, esa ha sido una metáfora terrible. Antes se me daban mejor estas cosas. ¿A dónde se fue mi chispa creativa? Debo haberla perdido después de pasar tanto tiempo en el Mundo de Otoño.\n\nCreo que he perdido algo más. ¿Qué era? No puedo recordarlo..."
 POD_siochain.6.a: "¿Qué es un \"soñador\"?"
 POD_siochain.6.a.tooltip: "Tu búsqueda para comprender la Banalidad te ha desapegado de tus Soñadores..."
 
 POD_siochain.7.t: "Una odisea colorida"
 POD_siochain.7.desc: "El Glamour es embriagador. ¿A quién le importa lo que es \"real\" cuando puedes convertir la pura fantasía en algo que puedes ver, saborear y tocar?\n\n¿Me estoy pasando? De ninguna manera. Esto es importante para mi desarrollo.\n\nProbar todos estos deleites quiméricos ha hecho que sea más difícil usar Cantrips para otras cosas. Pero eso probablemente sea normal."
 POD_siochain.7.a: "Así que a esto sabe el púrpura."