l_spanish:
 POD_sorcery_events.1000.t: "Más Bestia que Hombre"
 POD_sorcery_events.1000.desc: "Incluso entre las magias primordiales, la capacidad de transformarse en animal destaca como algo excepcional. Muchos monstruos que acechan en la noche tienen el poder de la transformación, incluidos aquellos que son verdaderos cambiapieles. Los magos de senda que estudian la Senda del Cambio de Forma imitan una cierta cantidad de su poder, transformando primero partes de sí mismos y más tarde todo su cuerpo de formas dramáticas.\n\nTu experiencia en la Senda del Cambio de Forma ha crecido lo suficiente como para que puedas mejorar tu Forma Bestial personal."
 POD_sorcery_events.1000.a: "Es suficiente."
 
 POD_sorcery_events.1000.no_points: "¡Has maximizado tu Forma Bestial al máximo de tu experiencia actual!"

 POD_sorcery_events.1000.claws: "$POD_shapeshift_bestial_form_claws_modifier$"
 POD_sorcery_events.1000.claws.upgrade: "Mejorarás [GetModifier('POD_shapeshift_bestial_form_claws_modifier').GetNameWithTooltip] al nivel [SCOPE.GetValue('new_level')|0V]"
 POD_sorcery_events.1000.claws.buy: "Introducirás [GetModifier('POD_shapeshift_bestial_form_claws_modifier').GetNameWithTooltip] en tu Forma Bestial"

