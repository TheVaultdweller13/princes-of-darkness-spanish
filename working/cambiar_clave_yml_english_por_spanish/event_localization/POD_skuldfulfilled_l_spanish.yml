l_spanish:

 POD_skuldfulfilled.001.t: "Skuld cumplido"
 POD_skuldfulfilled.001.desc: "Estás intentando arrebatar el poder eterno de la sangre al insignificante no-$pod_cainite$ que es [defender.GetFirstName], convirtiéndo[defender.GetHerHim] en un simple humano una vez más. Si [defender.GetSheHe] es lo suficientemente mayor, existe la posibilidad de que tus manipulaciones maten a [defender.GetHerHim]."
 POD_skuldfulfilled.001.option.a: "¡[defender.GetSheHe|U] no merece tal poder!"
 POD_skuldfulfilled.001.option.a.tt: "Intentarás arrebatarle su poder de la sangre"
 POD_skuldfulfilled.option.001.a.desc: "Usarás tu conocimiento místico del Olvido"
 POD_skuldfulfilled.001.option.success: "[defender.GetFirstName] se convierte en un simple humano"
 POD_skuldfulfilled.001.option.a.tt.attacker_wins: "Tienes éxito"
 POD_skuldfulfilled.001.option.failure: "Tu conocimiento no es suficiente"
 POD_skuldfulfilled.001.option.a.tt.attacker_lost: "[defender.GetFirstName] se resiste"
 POD_skuldfulfilled.001.option.b: "No es el momento adecuado..."
 POD_skuldfulfilled.001.option.b.tt: "Abandonas tu intento de robar el poder de la sangre a [defender.GetFirstName]"


 POD_skuldfulfilled.002.t: "Skuld cumplido"
 POD_skuldfulfilled.002.desc: "¡Alguien ha usado los oscuros poderes del Olvido para robar los poderes de tu sangre a [defender.GetFirstName]! Ahora [defender.GetSheHe] ya no está vinculad[defender.GetCustom('ES_A')] a ti por vínculos de sangre..."
 POD_skuldfulfilled.002.option.a: "Debería hacer algo al respecto"
 POD_skuldfulfilled.002.option.a.tt: "[defender.GetFirstName] ya no es tu esclavo"