 POD_error_suppression.0002.t: "Better Barbershop"
 #POD_error_suppression.0002.desc: "Hemos notado que estás usando el mod Better Barbershop (anteriormente Full Screen Barbershop). Por favor, asegúrate de usar el siguiente orden de carga: mod Prince of Darkness, luego mod Better Barbershop, y finalmente el mod \"POD + Better Barbershop Compatibility Patch\" (podbb).\nDe lo contrario, te perderás varias funciones de Princes of Darkness y todos los personajes terminarán siendo musculosos o con sobrepeso, y las interacciones de personajes con desplazamiento no estarán disponibles. ¡Gracias!"
 POD_error_suppression.0002.desc: "Hemos notado que estás usando el mod Better Barbershop (anteriormente Full Screen Barbershop). Ese mod es actualmente #N incompatible#! con PoD, y su parche de compatibilidad está desactualizado. Recomendamos eliminarlo de la lista de mods por el momento.\n\nDe lo contrario, te perderás varias funciones de Princes of Darkness y todos los personajes terminarán siendo musculosos o con sobrepeso, y las interacciones de personajes con desplazamiento no estarán disponibles. ¡Gracias!"
 POD_error_suppression.0002.a: "Entendido"
 
 POD_error_suppression.0004.t: "Search & Trade Artifacts"
 POD_error_suppression.0004.desc: "Estás usando el mod #bold Search & Trade Artifacts#! sin su parche de compatibilidad. Esto provocará errores y comportamientos no deseados.\n\nRecomendamos descargar el parche de [princes_of_darkness|E] desde el siguiente enlace."
 POD_error_suppression.0004.button: "#T Recargar cuadro de texto#!"
 POD_search_artifacts_steam_link: "https://steamcommunity.com/sharedfiles/filedetails/?id=3108318083"

 POD_error_suppression.0005.t: "Aviso de Rasgos de Vanilla"
 POD_error_suppression.0005.desc: "Uno de tus mods está cambiando los rasgos de vanilla, lo que sobrescribe los cambios realizados por [princes_of_darkness|E]. Esto provocará errores y comportamientos no deseados.\n\nRecomendamos eliminar otros mods hasta que este aviso deje de mostrarse."