l_spanish:
 
  beer_merchant.1.t: "El mercader de cerveza"
  beer_merchant.1.desc: "Un mercader entra en tu despacho, te saluda adecuadamente y explica el motivo de su visita: 'Viajando por estas tierras pasé la noche en un monasterio al norte de aquí. Los frailes me sirvieron la cerveza más deliciosa que jamás he probado. Siendo la cerveza mi oficio, pregunté por la posibilidad de comprar una parte de sus considerables y crecientes existencias para vendérselas a mi clientela. Me dijeron que llevara esta oferta \"más arriba\". Mi investigación sobre quién está \"más arriba\" me ha llevado hasta usted, Excelencia. ¿Podemos llegar a un acuerdo?'."
  beer_merchant.a: "¿La más deliciosa, dices? Mejor la vendemos nosotros mismos."
  beer_merchant.a.success.ctt: "Intentarás construir tu propia red de distribución para la cerveza."
  beer_merchant.a.success.tt: "Esto complementará nuestros ingresos."
  beer_merchant.a.failure.ctt: "Tu incursión en el mundo de los negocios solo traerá humillación."
  beer_merchant.a.failure.tt: "Perderás prestigio."
  beer_merchant.b: "Una causa más santa que la cerveza necesita a un hombre con sentidos agudos y talento para el dinero."
  beer_merchant.b.success.ctt: "Reclutarás al mercader como tu agente."
  beer_merchant.b.success.tt: "Un hábil administrador se unirá a tu corte."
  beer_merchant.b.failure.ctt: "El mercader no verá el beneficio de unirse a ti."
  beer_merchant.b.failure.tt: "Continuará sus viajes."
  beer_merchant.c: "No necesitamos al mercader, solo su lista de clientes."
  beer_merchant.c.success.ctt: "Emborracharás al mercader y harás que revele sus contactos."
  beer_merchant.c.success.tt: "Beneficio fácil."
  beer_merchant.c.failure.ctt: "El mercader no se dejará excluir."
  beer_merchant.c.failure.tt: "Tus métodos impropios quedarán expuestos."
  beer_merchant.d: "Siempre nos vendría bien una donación."
  beer_merchant.a.success.t: "La gente no tiene suficiente."
  beer_merchant.a.success.desc: "Los instintos del mercader eran correctos; la cerveza es enormemente popular entre los consumidores, y tu red de distribución apenas puede seguir el ritmo de la demanda."
  beer_merchant.a.success: "¡A vuestra salud!"
  beer_merchant.a.failure.t: "No se encuentran compradores."
  beer_merchant.a.failure.desc: "La fe y la convicción por sí solas no hacen a uno competente en marketing; no logras atraer ninguna atención hacia tu producto."
  beer_merchant.a.failure: "¿Cerveza, alguien?"
  beer_merchant.b.success.t: "Una nueva vocación."
  beer_merchant.b.success.desc: "La conversación con el mercader revela que, a pesar de considerarse un hombre afortunado, siempre anheló formar parte de algo más grande, más significativo que acumular riqueza. Animado por esta confesión a levantar el velo del secreto, le presentas la causa que le ha estado llamando."
  beer_merchant.b.success: "Como una vez distribuiste cerveza, ahora distribuirás esperanza."
  beer_merchant.b.failure.t: "Siguiendo con el comercio de cerveza."
  beer_merchant.b.failure.desc: "Tus torpes intentos de convencer al mercader de la vacuidad de sus búsquedas terrenales, sumados a tu incapacidad para ofrecer una alternativa lo suficientemente tentadora, han hecho que se retire de tu despacho sintiéndose perplejo y ofendido."
  beer_merchant.b.failure: "Ninguna cantidad de dinero comprará la salvación de este necio."
  beer_merchant.c.success.t: "Directo a los compradores."
  beer_merchant.c.success.desc: "Tu fingida preocupación por los establecimientos donde se servirá la cerveza de los frailes, sumada a los constantes rellenos de la copa del mercader, convierten su seguridad en arrogancia. Antes de que se vacíe la botella, enumera a sus clientes como una recitación. Tu plan funcionó a la perfección, y el hecho de que tu secretario, escondido tras la puerta, tome notas cuidadosamente es lo mejor de tu velada."
  beer_merchant.c.success: "¿Qué era lo que quería, de nuevo?"
  beer_merchant.c.failure.t: "El mercader se percata de tu engaño."
  beer_merchant.c.failure.desc: "Cuando le propones otra copa, el mercader de repente te mira con sospecha y te recuerda la virtud de la templanza."
  beer_merchant.c.failure: "En fin, guarda tus secretos."
  beer_merchant.d.t: "Se llega a un acuerdo."
  beer_merchant.d.desc: "Tienes tareas más importantes por delante que vender cerveza, y el dinero por adelantado es tu tipo de acuerdo favorito."
  beer_merchant.d.done: "Un placer hacer negocios con usted."
  heretic_event.1.t: "Hereje socavando a la nobleza"
  heretic_event.1.desc: "Un noble local se te acerca con un asunto que considera que requiere tu atención. Un predicador carismático se ha instalado en su posesión y ha empezado a incitar a los siervos contra su señor citando la Sagrada Biblia como supuesta condenadora de cualquier promesa y juramento de lealtad. Cree que esta doctrina subversiva está socavando el mandato de su poder y quiere que te encargues de este problemático revolucionario."
  heretic_event.1.a: "Tratar con herejes no es exactamente nuestra jurisdicción."
  heretic_event.1.b: "¿Afirma conocer las Escrituras? Veamos eso."
  heretic_event.1.c: "¿Quieres que lo quemen? Claro, podemos quemarlo."
  heretic_event.1.a.success.ctt: "Deslumbrarás al noble con descripciones nebulosas de tu posición superior en la jerarquía eclesiástica."
  heretic_event.1.a.success.tt: "Ganarás prestigio."
  heretic_event.1.a.failure.ctt: "El noble concluirá que eres algún tipo de malversador perezoso de los fondos de la iglesia."
  heretic_event.1.a.failure.tt: "Perderás prestigio."
  heretic_event.2.t: "Un debate teológico"
  heretic_event.2.desc: "El predicador cree que sus afirmaciones están respaldadas por la Sagrada Biblia, pero la alfabetización por sí sola no otorga el conocimiento necesario para interpretar las Escrituras en doctrina. Pondremos a prueba este conocimiento suyo entablando con él un debate teológico sobre sus ideas. La cuestión es qué pretendemos lograr."
  heretic_event.2.a: "Hacer que se incrimine a sí mismo acorralándolo para que admita su herejía."
  heretic_event.2.a.success.ctt: "El predicador se expondrá como un hereje."
  heretic_event.2.a.success.tt: "Castigarás al hereje y ganarás piedad"
  heretic_event.2.a.failure.ctt: "El predicador defenderá sus tesis sin hablar en contra de la doctrina establecida de la iglesia."
  heretic_event.2.a.failure.tt: "Habrá que tomar una decisión."
  heretic_event.2.b: "Hacerle ver las trampas de una educación insuficiente."
  heretic_event.2.b.success.ctt: "Impresionarás al predicador con tu conocimiento teológico superior."
  heretic_event.2.b.success.tt: "El predicador se unirá a tu corte."
  heretic_event.2.b.failure.ctt: "No lograrás que el predicador vea el error de sus caminos."
  heretic_event.2.b.failure.tt: "El predicador quedará libre y perderás prestigio."
  heretic_event.211.t: "El hereje se encuentra con la pira"
  heretic_event.211.desc: "Usar las Sagradas Escrituras para causar problemas no es un esfuerzo que valga la pena."
  heretic_event.212.t: "El predicador evita incriminarse."
  heretic_event.212.desc: "Al elegir sus palabras cuidadosamente y construir sus argumentos sobre supuestos universalmente aceptados, el predicador logró exponer su caso sin aventurarse en el territorio de la herejía."
  heretic_event.212.a: "Los elocuentes son de la peor calaña, quémalo."
  heretic_event.212.a.tt: "Ejecutarás al predicador sin una justificación formal."
  heretic_event.212.b: "Supongo que tendremos que dejarlo ir."
  heretic_event.212.b.tt: "El predicador quedará libre."
  heretic_event.2121.t: "Culpable hasta que se demuestre lo contrario."
  heretic_event.2121.desc: "El predicador puede ser un orador hábil y cuidadoso, pero sigue siendo un hereje. Sabes cuán pecaminosas son las implicaciones que se esconden tras sus nebulosas alusiones. Puede que no esté dispuesto a admitir su culpa, pero sus problemáticas payasadas son suficientes para condenarlo a muerte. Mientras dictas la sentencia, algo te inquieta, la situación te recuerda a algo, pero no logras precisar qué es."
  heretic_event.2121.a: "Lo que he escrito, escrito está."
  heretic_event.2122.t: "El predicador queda libre."
  heretic_event.2122.desc: "Sin pruebas de herejía, no hay hereje al que puedas sentenciar."
  heretic_event.221.t: "El predicador se une a tu causa."
  heretic_event.221.desc: "Impresionado por tu conocimiento y piedad, el predicador decide continuar su educación a tu lado." 
  heretic_event.222.t: "El predicador se marcha triunfante."
  heretic_event.222.desc: "Perdiste el control de la discusión y con ello una razón para mantener cautivo al predicador." 
  heretic_event.11.t: "El noble está impresionado"
  heretic_event.11.desc: "El noble está más impresionado que molesto con tu sugerencia indirecta de que eres demasiado importante para ayudarle."
  heretic_event.12.t: "El noble está decepcionado"
  heretic_event.12.desc: "Tu negativa a ayudar disminuyó tu prestigio ante la nobleza local."
  heretic_event.3.t: "El hereje se encuentra con la pira"
  heretic_event.3.desc: "Puede que nunca sepamos con seguridad si cumplía los criterios formales para ser llamado hereje, pero ciertamente arde como uno."
  defeated_general.1.t: "El general derrotado"
  defeated_general.1.desc: "Uno de los empleados de tu despacho se te acerca con un asunto de lo más delicado. Es confesor de un general antaño prominente y célebre, pero ahora caído en desgracia. Desde que una campaña que se le encargó liderar resultó desastrosa, la tentación de un pecado grave le persigue: el pecado de quitarse la vida. El empleado se siente impotente para evitarlo y recurre a ti, esperando que logres restaurar la esperanza en este hombre derrotado. Ambos visitáis su residencia. El sirviente os deja entrar en el despacho del comandante, donde lo veis desplomado en un sillón. Algún tiempo después de unas breves y torpes presentaciones, el general os dice: 'Simplemente no puedo vivir así, con esta sombra de gloria perdida aplastándome'."
  defeated_general.1.a: "¡Buen hombre, los días de la verdadera gloria aún están por delante!"
  defeated_general.a.success.ctt: "Revigorizarás el espíritu del general convenciéndole de que se comprometa plenamente con tu causa."
  defeated_general.a.success.tt: "El general se une a ti libre de desesperación."
  defeated_general.a.meh.ctt: "El general dará una oportunidad a trabajar para ti, pero su espíritu seguirá roto."
  defeated_general.a.meh.tt: "El general se une a ti como un hombre roto."
  defeated_general.a.failure.ctt: "Nada convence al general de que unirse a tu causa mejorará las cosas."
  defeated_general.a.failure.tt: "El general se quitará la vida."
  defeated_general.1.b: "Cuéntame sobre esa campaña."
  defeated_general.b.success.ctt: "Entablarás con el general una conversación sobre asuntos militares que le permitirá desahogar su pesar."
  defeated_general.b.success.tt: "Ganarás un mentor en asuntos de guerra."
  defeated_general.b.failure.ctt: "El general se desanimará de abrirse por tu falta de comprensión."
  defeated_general.b.failure.tt: "El general no encontrará consuelo en tu compañía."
  defeated_general.1.c: "Podemos asegurarnos de que tengas un entierro cristiano a cambio de una donación."
  defeated_general.1.c.tt: "Facilitarás el suicidio del general para obtener beneficios económicos."
  defeated_general.111.t: "Un nuevo propósito"
  defeated_general.111.desc: "'Enemigos más temibles que los sarracenos... Una guerra secreta librada durante milenios... Una misión del mismísimo Santo Padre... Sí, sí, puedo ver cómo eso haría que los errores de mi carrera pasada fueran relativamente insignificantes. ¡Excelencia, tiene mi lealtad!'"
  defeated_general.111.a: "¡In hoc signo vinces!"
  defeated_general.112.t: "Servicio reacio"
  defeated_general.112.desc: "'No sé nada de ese asunto del \"propósito sagrado\", pero si necesita un comandante, supongo que comandar soldados es mejor que pudrirse aquí'."
  defeated_general.112.a: "Yo también lo supongo."
  defeated_general.113.t: "Cuando la esperanza se escapa"
  defeated_general.113.desc: "'¿Volver al servicio? ¿Para que mueran más hombres buenos por mi culpa? ¡Nunca! ¡Salga de mi casa, ahora!'."
  defeated_general.113.a: "¿He oído caer un taburete?"
  defeated_general.21.t: "Aprendiendo de los errores del pasado"
  defeated_general.21.desc: "El general comienza su relato pero vacila cuando llega a la parte problemática de su historia. La oportunidad de tener a alguien ansioso por escucharle y que le escuche con atención le convence para continuar. Le aseguras al general que nadie podría condenar sus decisiones dada la información que tenía en ese momento. Oír eso de alguien con aparentes amplios conocimientos en asuntos militares es un alivio tremendo para el hombre torturado. Después de que termina la historia, pasáis horas discutiendo la estrategia militar. Cuando finalmente te marchas, el sirviente susurra: 'Gracias, no le había visto sonreír desde la guerra'."
  defeated_general.21.a: "¡Hagamos de esto algo habitual!"
  defeated_general.22.t: "La difícil situación del soldado incomprendida"
  defeated_general.22.desc: "El general empieza a contar su historia pero concluye rápidamente que cualquier intento de explicar su tragedia es una pérdida de tiempo. La mirada perpleja que habita en tu rostro mientras haces preguntas que delatan tu falta de conocimientos militares traicionó tus buenas intenciones. 'Digamos que... las cosas se pusieron terribles. Quizás lo explique en otro momento. Os ruego que me perdonéis, mis honorables invitados, pero estoy completamente agotado por el momento'."
  defeated_general.22.a: "Quizás debería haber venido mejor preparado."
  defeated_general.3.t: "El festín de un buitre"
  defeated_general.3.desc: "El general parece brevemente conmocionado tras darse cuenta de lo que le estás proponiendo. Rápidamente, el alivio y la determinación superan la expresión sombría de su rostro. 'Bien, le incluiré en mi testamento. Debo decir que no esperaba que ese fuera el resultado de esta reunión. Pero supongo que siempre he sido el necio. Adiós'."
  defeated_general.3.a: "Pecunia non olet, como dicen."
  donors_daughter.1.t: "La hija del donante"
  donors_daughter.1.desc: "Una abadía que alberga tu base regional de operaciones es visitada por una joven noble. Se presenta como hija de un amigo de la causa recientemente fallecido, pero sigue sin saber por qué su padre te suministraba fondos y sus hermanos le encargaron investigar. Leyendo entre líneas su presentación queda claro que el donante debió de fallar al preparar un testamento por escrito y la decisión de sus hijos de honrar su deseo de muerte de dedicar una parte de su herencia a tu causa dependerá de la impresión que esta chica tenga de ti.\n\n'¿Me enseñará su Excelencia el lugar? Quiero ver todo lo que hacen aquí', pregunta ella."
  donors_daughter.1.a: "Con mucho gusto, mi señora, pero verá, las alas están en renovación..."
  donors_daughter.1.a.success.tt: "Convencerás a la chica para que se salte las secciones sensibles."
  donors_daughter.1.a.failure.tt: "La chica verá a través de tus excusas."
  donors_daughter.1.a.success.ctt: "La visita tendrá un resultado más favorable."
  donors_daughter.1.a.failure.ctt: "La visita tendrá un resultado menos favorable."
  donors_daughter.1.b: "Emm... claro."
  donors_daughter.1.c: "Recibimos a los visitantes en el salón principal, todo lo demás está fuera de los límites."
  donors_daughter.2.t: "La hija del donante: Tu talentoso personal"
  donors_daughter.2.desc: "Mientras caminas por el salón principal, la joven noble se fija en los monjes escribas que manejan tus documentos.\n'¡Oh, una vez oí a un coro de monjes cantar en el funeral de mi tía, fue tan hermoso! Por favor, haga que canten para mí', suplica ella."
  donors_daughter.2.a: "Créeme, niña, estos monjes son unos cantantes terribles."
  donors_daughter.2.a.success.tt: "La chica quedará encantada por tu preocupación por sus oídos."
  donors_daughter.2.a.failure.tt: "La chica considerará que sus deseos han sido ignorados."
  donors_daughter.2.a.success.ctt: "La visita tendrá un resultado más favorable."
  donors_daughter.2.a.failure.ctt: "La visita tendrá un resultado menos favorable."
  donors_daughter.2.b: "Ya has oído a la dama."
  donors_daughter.2.c: "Su tarea aquí no es entretener a los invitados."
  donors_daughter.3.t: "La hija del donante: Una prenda tentadora"
  donors_daughter.31.desc: "Cuando llegas a tu despacho, la mirada de la visitante se vuelve hacia el gorro de Santa Wiborada, una reliquia sagrada que exhibes con orgullo en un soporte dedicado. '¡Qué prenda tan peculiar, nunca he visto una de este estilo! Debe de ser muy antigua. ¡Quiero probármela!', exclama mientras los empleados del despacho se vuelven hacia ti con expresiones preocupadas."
  donors_daughter.32.desc: "Cuando llegas a tu despacho, la mirada de la visitante se vuelve hacia el velo de Santa Belina, una reliquia sagrada que exhibes con orgullo en un soporte dedicado. '¡Qué prenda tan peculiar, nunca he visto una de este estilo! Debe de ser muy antigua. ¡Quiero probármela!', exclama mientras los empleados del despacho se vuelven hacia ti con expresiones preocupadas."
  donors_daughter.33.desc: "Cuando llegas a tu despacho, la mirada de la visitante se vuelve hacia el manto de Santa Ludmila, una reliquia sagrada que exhibes con orgullo en un soporte dedicado. '¡Qué prenda tan peculiar, nunca he visto una de este estilo! Debe de ser muy antigua. ¡Quiero probármela!', exclama mientras los empleados del despacho se vuelven hacia ti con expresiones preocupadas."
  donors_daughter.3.a: "Mi señora, esa cosa está terriblemente polvorienta."
  donors_daughter.3.a.success.tt: "La chica considerará eso una excusa."
  donors_daughter.3.a.failure.tt: "La chica reevaluará el atractivo de la prenda."
  donors_daughter.3.a.success.ctt: "La visita tendrá un resultado más favorable."
  donors_daughter.3.a.failure.ctt: "La visita tendrá un resultado menos favorable."
  donors_daughter.3.b: "Adelante."
  donors_daughter.3.c: "Olvídalo, jovencita."
  donors_daughter.4.t: "La hija del donante: Hora de decidir"
  donors_daughter.4.desc: "Después de que finalmente lograste aburrir soberanamente a la joven enumerando todas las iniciativas caritativas que el dinero de su padre ayudó a financiar, tanto las que realmente se llevan a cabo como las que sirven de tapadera para otras operaciones, decidió que ya ha visto y oído suficiente. Sabrás el alcance de su generosidad antes de que parta."
  donors_daughter.4.a: "Parecía que le encantaba estar aquí."
  donors_daughter.4.b: "Esperemos que haya disfrutado de su estancia."
  donors_daughter.4.c: "Esperemos que haya disfrutado de su estancia."
  donors_daughter.4.d: "Probablemente sea mejor que simplemente se vaya."
  donors_daughter.4.e: "No podría importarme menos si la mocosa se lo pasó bien."
  donors_daughter.5.t: "La hija del donante: Encantada más allá de las expectativas"
  donors_daughter.5.desc: "'Su Excelencia es el servidor de Cristo más magnánimo que he conocido. Todavía no estoy del todo segura de lo que está haciendo aquí, pero sea lo que sea, con usted al mando merece cada pieza de plata que mi familia reservó, pero también una donación personal mía'."
  donors_daughter.5.a: "Fue un placer, mi señora."
  donors_daughter.6.t: "La hija del donante: Hospitalidad adecuada"
  donors_daughter.6.desc: "'Su Excelencia es tan piadoso como su causa y sería impío por mi parte irme de aquí sin donar la suma total de la que se me autorizó a desprenderme. Mi padre siempre gestionó bien nuestro dinero y veo que esta no es una excepción. Vaya con Dios'."
  donors_daughter.6.a: "Adiós, pues."
  donors_daughter.7.t: "La hija del donante: Hospitalidad deficiente"
  donors_daughter.7.desc: "'Creo que ya he visto suficiente. No puedo decir que entienda del todo la devoción de mi padre por apoyar sus esfuerzos, pero si desprenderme de esta suma me mantiene tranquila sabiendo que se cumplió su último deseo, que así sea. Adiós, su Excelencia'."
  donors_daughter.7.a: "Eso apenas valió el tiempo."
  donors_daughter.8.t: "La hija del donante: Malas impresiones"
  donors_daughter.8.desc: "'La hospitalidad de su Excelencia deja mucho que desear. Nunca supe que mi padre se asociara con individuos tan desagradables y, fuera cual fuera su negocio con usted, no es algo que deseemos continuar en esta familia. Adiós'."
  donors_daughter.8.a: "Probablemente debería contratar a alguien para hacer esto."
  donors_daughter.9.t: "La hija del donante: Cambio de paradigma"
  donors_daughter.9.desc: "'Su Excelencia ignoró cada una de mis peticiones y no hizo ningún esfuerzo por acomodarme de la manera que corresponde a una mujer noble; siento que debería dar media vuelta e irme sin dejarle nada, pero al mismo tiempo estoy asombrada por su dignidad y enfoque. Toda mi vida he sido mimada y rodeada de sicofantes que buscaban las migajas de la riqueza de mi familia; usted es diferente. Está claro que su vocación dirige sus ojos por encima de esta mezquindad y, sea lo que sea, quiero formar parte de ello. Quedarme aquí nunca fue parte del acuerdo que hice con mis hermanos y me temo que no podría representar al patrimonio si tomara esa decisión, pero le ruego, su Excelencia, que me libere de esta existencia sin sentido y derrochadora y me deje servirle'."
  donors_daughter.9.a: "Tienes mucho que aprender, hija mía."
  donors_daughter.9.a.t: "La joven noble se une a tu corte."
  donors_daughter.9.a.desc: "[ddaughter.GetShortUIName] está lista para servir a la causa."
  donors_daughter.9.b: "Una búsqueda encomiable, pero no tenemos vacantes."
