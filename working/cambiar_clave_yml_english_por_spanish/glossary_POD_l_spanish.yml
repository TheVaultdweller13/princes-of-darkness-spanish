 ####### Glosario Kuei-Jin / Asia

 podgloss.dokhorkhan: "Dokhor-Khan es el [Glossary('Rey Yama','podgloss.yamaking')] del [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')].\nA partir de 1230, es uno de los [Glossary('Reyes Yama','podgloss.yamaking')] más poderosos que existen y su control sobre las estepas es casi indiscutible. Se alimenta de la agonía y el odio y es conocido por sus audaces, a veces temerarios, planes para lograr el dominio sobre sus rivales."
 podgloss.hellspikedchains: "El Infierno de las Cadenas de Púas es un [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] que se presenta como una vasta llanura plana habitada por las almas de los mortales que han muerto en las estepas. Cada una de estas almas es asignada a una tribu al azar por el [Glossary('Rey Yama','podgloss.yamaking')] [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], quien periódicamente elige a una de estas tribus como su favorita.\nTodas las demás tribus son despojadas de uno de sus sentidos (o extremidades) y tienen que obedecer a la tribu favorecida en todo. Si desobedecen, o si a uno de los Favorecidos le apetece, son sometidos a las torturas de la Cadena de Púas.\nLas víctimas son atadas con cadenas de hierro con espinas forjadas en Yomi y colgadas de las estalactitas de una gran cueva por un periodo de tiempo no especificado. Cada vez que las víctimas forcejean, las espinas se clavan más profundamente en su esencia, alimentando al [Glossary('Rey Yama','podgloss.yamaking')]."
 podgloss.yamaking: "Los Reyes Yama, también conocidos como Reyes Diablo, son entidades poderosas que reinan sobre un [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')].\nSe cree que una vez fueron jueces de los muertos pero se han corrompido con el tiempo y ahora usan su posición para elevarse por encima de los demás, esperando convertirse en el [Glossary('Emperador Demonio','podgloss.demonemperor')] que derrocará a los Cielos.\nAunque todos tienen sus diferentes personalidades y preferencias, todos usan sirvientes [akuma|E] para promover sus objetivos en el mundo mortal."
 podgloss.dharma: "Para los $pod_kueijin$, un Dharma es un camino hacia la iluminación que les permite trascender sus naturalezas bestiales y les ofrece la esperanza de la iluminación y de volver a unirse al ciclo kármico. Como criaturas demoníacas, la iluminación es mucho más difícil para los $pod_kueijin$, y el camino hacia la sabiduría puede llevar milenios.\nTradicionalmente, los Cinco Dharma esbozados por el Gran Arhat Xue (Tigre-Diablo, Canción de la Sombra, Grulla Resplandeciente, Flores de Hueso y Dragones Azotadores) se consideran los Dharma ortodoxos y adecuados, mientras que todos los demás son heréticos en algún grado."
 podgloss.hundredclouds: "Las Cien Nubes son el objetivo final del [Glossary('Dharma','podgloss.dharma')]. Significa el desprendimiento de la propia condenación kármica y la reincorporación al ciclo de la reencarnación.\n\"Las Cien Nubes\" es un término metafórico para la paz definitiva, el estado trascendente en el que incluso los deberes del Cielo se dejan de lado. Las Nubes no son poder, aunque los $pod_kueijin$ menores puedan verlo así; no son ilusiones, aunque puedan parecérselo a individuos que no pueden comprenderlas. Al unirse a Las Cien Nubes (que los sabios entienden como un símbolo, no como un grupo), un $pod_kueijin$ alcanza la cima de su ser, incluso más alto que un [Glossary('Bodhisattva','podgloss.bodhisattva')]. La mayoría deja atrás este mundo tras alcanzar tales alturas, desapareciendo hacia un destino desconocido. Otros eligen permanecer y guiar a los demás en su lugar."
 podgloss.bodhisattva: "Los Bodhisattvas son $pod_kueijin$ que han alcanzado las etapas finales de su [Glossary('Dharma','podgloss.dharma')] elegido.\nRelativamente pocos $pod_kueijin$ alcanzan el rango de bodhisattva; el proceso lleva siglos, incluso milenios, y la mayoría de los $pod_kueijin$ encuentran la Muerte Definitiva o sucumben al demonio interior mucho antes de alcanzar la etapa de bodhisattva. Aquellos que alcanzan esta etapa son seres inmensamente poderosos, fácilmente al nivel de un Matusalén $pod_cainite$.\nAunque unos pocos permanecen activos políticamente, la mayoría actúa como líderes espirituales en su lugar."
 podgloss.arhat: "Un Arhat es un $pod_kueijin$ que ha trascendido su [Glossary('Dharma','podgloss.dharma')] y ha alcanzado las [Glossary('Cien Nubes','podgloss.hundredclouds')], liberándose de la maldición de la no-vida. La mayoría tenía cientos de años antes de lograr trascender.\nEl Arhat más famoso y recordado es Xue, quien estableció el Camino Quíntuple que dio origen a los Cinco [Glossary('Dharma','podgloss.dharma')] Ortodoxos. A día de hoy, muchos piensan que emular a Xue sigue siendo la única forma verdadera de alcanzar la Iluminación."
 podgloss.wheelofages: "La Rueda de las Eras es el ciclo eterno del ser, en el que la tierra sufre eras de miseria creciente, hasta que se alcanza el nadir del ciclo y el mundo comienza a enderezarse hacia el Paraíso una vez más.\nSe divide por Eras, aunque los diversos seres sobrenaturales tendrán diferentes interpretaciones de las mismas. La mayoría coincide en que la última Era antes del Paraíso será el ascenso de un [Glossary('Emperador Demonio','podgloss.demonemperor')] que intentará detener la Rueda y gobernar para siempre."
 podgloss.demonemperor: "En la escatología de los $pod_kueijin$, la Sexta Era estará marcada por la llegada de un señor supremo de la oscuridad y el horror que gobernará el mundo con puño de hierro (y púas). Este inminente Emperador Demonio será el sello distintivo de esa era caída, y la única misericordia en su tiempo es que la Sexta Era será breve... si el Universo sigue funcionando correctamente.\n\nAdivinar quién será el Emperador Demonio es un deporte popular para los $pod_kueijin$. Los [Glossary('Reyes Yama','podgloss.yamaking')] generalmente asumen que el Emperador Demonio será uno de los suyos, siendo el candidato más común en 1230 [Glossary('Emma-O','podgloss.emmao')]. Otras opciones comunes incluyen a Saulot, quien parece haber encontrado la mitología al viajar por el Este y decidió que gobernar como Emperador Demonio sería preferible al acercamiento con el Todopoderoso."
 podgloss.penangallan: "Originario de un término malayo para los vampiros, Penangallan terminó siendo un nombre genérico para las matriarcas $pod_kueijin$ del sudeste asiático. Seguidoras del [Glossary('Dharma','podgloss.dharma')] de los Dragones Azotadores y muy desequilibradas hacia el Yang, estas $pod_kueijin$ agresivamente feministas están fomentando una liberación completa del yo o son pozos infernales brutales y sádicos, dependiendo de a quién se pregunte."
 podgloss.emmao: "Emma-O, el señor oscuro de [Glossary('Kakuri','podgloss.kakuri')], es el favorito actual en la gran guerra de los [Glossary('Reyes Yama','podgloss.yamaking')] por el trono del [Glossary('Emperador Demonio','podgloss.demonemperor')].\nEpítome del Aspecto Yin, Emma-O es un individuo astuto y calculador que carece de misericordia. Suele aparecer como un hombre extremadamente alto, con una larga barba y cultivando generalmente una apariencia velluda, con piel de obsidiana, vestido con telas ainu que llevan diseños de batalla, enfermedad y muerte. A menudo le acompañan sus hermosas sirvientas [Glossary('Shikome','podgloss.shikome')].\n\nEmma-O es el único [Glossary('Rey Yama','podgloss.yamaking')] activo actualmente que puede jactarse de haber triunfado sobre uno de sus pares, el antiguo Juez del Equilibrio Yen-Lo."
 podgloss.kakuri: "También conocido como el Reino de la Noche, Kakuri es un [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] controlado por el [Glossary('Rey Yama','podgloss.yamaking')] [Glossary('Emma-O','podgloss.emmao')].\nKakuri es un dominio de aspecto Yin, un vacío de hielo y nieve sin luz, sin alegría y sin honor.\nComo dominio ancestral de la muerte de los Ainu, Kakuri tiene una salida secreta para los adoradores originales de [Glossary('Emma-O','podgloss.emmao')]."
 podgloss.shikome: "Gélidamente hermosas, las Shikome son las asesinas, guardaespaldas y concubinas de [Glossary('Emma-O','podgloss.emmao')]. Cada shikome fue elegida personalmente por el propio [Glossary('Emma-O','podgloss.emmao')] y cuidadosamente atraída para servirle. Muchas de ellas fueron maltratadas, descuidadas u olvidadas en sus años mortales, y ahora sirven felizmente a su maestro en quien han encontrado las cualidades de un padre, amante y señor. Él, a su vez, les muestra respeto.\n\nLa habilidad más peligrosa de una shikome es su destreza para manipular a los hombres. Las shikome se alimentan de la fuerza de voluntad de los hombres de la misma forma que la mayoría de los $pod_kueijin$ se alimentan de Chi. Mientras que las mujeres desprecian automáticamente a las shikome e intentan atacarlas, los hombres harán cualquier cosa por ellas, les darán todo lo que deseen y morirán por ellas con la esperanza de una mirada amable (que nunca recibirán)."
 podgloss.mikaboshi: "Mikaboshi, señor de la [Glossary('Ciudad Malvada','podgloss.wickedcity')], es un [Glossary('Rey Yama','podgloss.yamaking')] que una vez fue un erudito y arquitecto japonés. Aunque es muy joven comparado con sus pares, su impulso por la innovación implacable y la creación de un \"estado máquina\" que convertirá a la humanidad en cáscaras sin alma lo convierte en una estrella en ascenso a medida que las civilizaciones de la humanidad se expanden más y más."
 podgloss.wickedcity: "La Ciudad Malvada es un [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] controlado por el [Glossary('Rey Yama','podgloss.yamaking')] [Glossary('Mikaboshi','podgloss.mikaboshi')].\nEs una pesadilla de cyberpunk, Feng Shui demente y teorías de gestión que aplastan el alma.\nEs un lugar donde todos los peores elementos de la codicia y el capitalismo se encuentran en la atmósfera de corrupción de Yomi. También es uno de los [UmbraGlossaryLocalized('yomi_wan','Infiernos Yomi')] de más rápido crecimiento."
 podgloss.anda: "Los Anda son una línea de sangre $pod_cainite$ de los [GetTrait('gangrel').GetName(GetNullCharacter)] que existen entre los mongoles. Ellos mismos creen que son vástagos de Itugen, la diosa de la tierra de la religión mongola.\nSu proximidad regional a los $pod_kueijin$ ha dado lugar a menudo a escaramuzas, aunque las conquistas mortales mongolas amenazan con empeorar mucho la situación."
 podgloss.augustpersonageofjade: "En el mito $pod_kueijin$, el actual, aunque inactivo, gobernante del Cielo y encarnación de la Creación. Cuando llegue la Sexta Era, el Personaje dejará el cargo, para ser reemplazado por el [Glossary('Emperador Demonio','podgloss.demonemperor')]."
 podgloss.infantdevilcivilizer: "Hay un momento y un lugar para la persuasión amable de un padre, pero durante la doma de los $pod_kueijin$ salvajes recién regresados del [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] no es ese momento. En este papel entra el Civilizador de Diablos Infantes, el supervisor de los esfuerzos de varias Sociedades Civilizadoras de Diablos Infantes locales para reclamar, someter y escoltar a estas almas regresadas a la Corte más cercana."
 podgloss.wu: "La idea del apoyo mutuo natural entre $pod_kueijin$ con ideas afines ordena el nivel primario de interacción social y definición dentro de la sociedad $pod_kueijin$. Se organizan en grupos de cinco (normalmente), llamados tradicionalmente Wu. Un Wu funciona como la familia sustituta de un $pod_kueijin$ durante esta segunda oportunidad de existencia."
 podgloss.toumu: "Los $pod_kueijin$ tienen un enemigo formidable en un [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] más terrible que cualquier otro, y su nombre es Tou Mu.\nTou Mu se encuentra entre los más maliciosos de los [Glossary('Reyes Yama','podgloss.yamaking')], y es esta odiosidad la que la ha traído tan cerca del trono del [Glossary('Emperador Demonio','podgloss.demonemperor')]. La Emperatriz de Hierro es, con diferencia, la Reina Yama mejor conocida y es famosa por su apasionado odio hacia los Vástagos de Oriente.\nMientras que otros [Glossary('Reyes Yama','podgloss.yamaking')] intentarán corromperlos y atraparlos, trabajar para la Emperatriz de Hierro es, en el mejor de los casos, un aplazamiento de la ejecución."
 podgloss.wuhua: "Wu Hua, señor del Foso de Sal e Hierro, es un [Glossary('Rey Yama','podgloss.yamaking')]. Aunque su Infierno y su poder general son menores que los de algunos de sus rivales, no le falta maldad.\nHaciendo trabajar a sus prisioneros hasta los huesos, Wu Hua solo ofrece los Burdeles de Hierro como una potencial ruta de escape que muchos terminan lamentando haber elegido.\nLa estructura organizativa de Wu Hua ha sido modelada según las estructuras burocráticas de la China primitiva. Los sirvientes obedientes son recompensados con regalos y ascensos. Los lacayos desobedientes son castigados y finalmente destruidos. Cualquier criatura que haya ascendido a través de estas filas retorcidas es sin duda una criatura de gran maldad y astucia, y debe ser tratada con precaución."
 podgloss.truename: "El Nombre Verdadero de un ser es a la vez su existencia, su historia y su identidad. Es una palabra que abarca cada parte de su objetivo, desde sus órganos internos hasta su propia alma. Varias formas de magia permiten invocar el Nombre Verdadero de otro ser para afectar su propia realidad.\n\nEn [princes_of_darkness|E], aprender el Nombre Verdadero de otro personaje es un lento [journey|E] disponible para algunos [splats|E]. Es un requisito previo para ciertas habilidades; por ejemplo, los #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Demonólogos#!#! necesitan conocer el Nombre Verdadero de un $POD_splat_demon$ para poder [diabolism_bind|E] vincularlos.\n\nLas $POD_splat_mummy_plural$ hacen un uso extensivo de los Nombres Verdaderos, a los que llaman #italic Ren#!. Además de aprender el Ren de los personajes, tienen un [journey|E] para aprender el Ren de los metales, las plantas y los animales, que utilizan como parte de su Hekau de Nomenclatura."

 ####### Glosario histórico

 podgloss.kisaeng: "Una cortesana entrenada y animadora legal."
 podgloss.kwanryong_kuibu_koryo_changwan: "Comandante de los guerreros Koryo sometidos."
 podgloss.joseon_gyeonggukjeon: "Un extenso libro que detalla un nuevo sistema de gobierno, modelado según el confuciano chino utilizado bajo la dinastía Zhou."
 podgloss.uinyo: "Una médico mujer, especializada en el tratamiento de mujeres."
 podgloss.sambyeolcho: "Las Tres Guardias Extraordinarias son una rama del gobierno militar de Goryeo, organizada por la familia Ch'oe, actualmente a cargo de Goryeo. Los Sambyeolcho asumen la función de fuerzas policiales y de combate."
 podgloss.taejo_joseon: "Yi Sǒng-gye es el fundador de la dinastía Joseon, que reemplazará a la dinastía Goryo con una administración neoconfuciana."
 podgloss.nobi: "Los nobi son miembros de la clase esclava. Se consideran propiedad o bienes y pueden ser comprados, vendidos o regalados."
 podgloss.jajewi: "La Guardia de la Juventud Noble está compuesta por los hijos más prometedores de la nobleza y están organizados para ser preparados como la próxima generación de oficiales leales del gobierno."
 podgloss.hunminjeongeum: "El #italic Hunminjeongeum#! es un documento, redactado por eruditos del Salón de los Dignos para formalizar y enseñar el Hangul, la escritura coreana inventada por el Rey Sejong el Grande."
 podgloss.seonbi: "Los #italic seonbis#! son eruditos y normalmente servidores públicos no gubernamentales. Eligieron renunciar a los beneficios y la autoridad del poder oficial para desarrollar y compartir el conocimiento."
 podgloss.sahwa: "La calamidad de los eruditos, también conocida como las Purgas de los Literatos, son purgas dirigidas a los eruditos Sarim, uno de los dos grupos envueltos en una lucha de poder sobre la política de Joseon."
 podgloss.geobukseon: "El barco tortuga fue uno de los primeros destructores jamás diseñados. Construidos para la maniobrabilidad bajo el fuego enemigo y para mantener a distancia a los abordajes japoneses, lograron asegurar muchas victorias para la armada de Joseon."
 podgloss.thai-to: "El nombre de templo dado al primer emperador de una dinastía."
 podgloss.tran-trieu: "Los templos en los que se venera el espíritu de Đuc Thanh Hung Đao y en los que las sacerdotisas de su culto chamánico son poseídas por sus manifestaciones."
 podgloss.hyangyak: "El núcleo de las leyes sociales en Joseon, que permite un grado de autonomía local."
 podgloss.guyen: "Un solo volumen en una colección más grande de tomos."
 podgloss.man_da_la: "La Man Da La, también conocida como Cà Đôc Duoc, es una flor blanca sagrada que deja a uno en un trance comatoso."
 podgloss.thai_hoc_sinh: "El examen confuciano más alto organizado por la corte feudal de los Đan Viêt, durante el reinado de la dinastía Trân."
 podgloss.hanh_khien: "Funcionario de alto rango, justo por debajo del Primer Ministro y equivalente a un viceprimer ministro. A las personas elevadas a esta posición se les permitía vestir ropas rojas."
 podgloss.chua: "Un cargo de poder utilizado por los clanes rivales de Trinh y Nguyen para gobernar el Đai Viet, mientras que el emperador Lê quedaba reducido mayoritariamente a un título honorífico."
 podgloss.stupa: "Una estupa es una estructura en forma de túmulo que contiene reliquias y que los budistas utilizan como lugar de meditación."
 podgloss.binnya_thau: "La Vieja Reina."
 podgloss.tachiuchi_ni_myo_o_etaru: "El arte de tajar en todas las direcciones."
 podgloss.chidori: "Mil Pájaros es la espada de un samurái leal."
 podgloss.raikiri: "Cortadora de Rayos es la espada que cortó a un Dios del Trueno dentro del rayo dirigido al portador de la espada."
 podgloss.kensho: "En el budismo zen, Kenshō es un despertar repentino a la verdadera naturaleza de uno, refiriéndose esta verdadera naturaleza al Dharmadhatu."
 podgloss.nareswari: "La madre de los grandes reyes."
 podgloss.kerbau_yang_menyeberang: "El Cruce del Búfalo."
 podgloss.rakryan_patih: "Los Patih son ministros en el archipiélago indonesio, siendo el Rakryan Patih el más prestigioso, el Primer Ministro a cargo de administrar el reino de Majapahit."
 podgloss.kshatriya: "Una de las cuatro castas sociales de la sociedad hindú, los kshatriyas están asociados con la aristocracia guerrera."
 podgloss.miezu: "La ejecución de las nueve relaciones es una sentencia pronunciada en los asuntos de estado más graves, y consiste en la extinción del linaje del delincuente. Sus padres, abuelos, cualquier hijo o nieto, hermanos y cuñados, tíos y tías y sus cónyuges, primos, cónyuge y padres del cónyuge eran ejecutados, así como el delincuente. Los niños más pequeños se salvaban pero a menudo eran vendidos como esclavos."
 podgloss.maha_patih: "El más grande de los [Glossary('patih', 'podgloss.rakryan_patih')] era tan poderoso que su alcance se extendía por encima de los simples deberes ministeriales y era visto más como un regente o vice-rey que como un simple Primer Ministro."
 podgloss.bhayangkara: "Una guardia real de élite de los Majapahit, dedicada a proteger las vidas del emperador y su familia."
 podgloss.sumpah_palapa: "El juramento prestado por Gajah Mada de no descansar nunca hasta que el imperio Majapahit domine el archipiélago de Nusantara.\n#italic 'Si he conquistado el archipiélago de Nusantara, entonces disfrutaré del descanso. Si he conquistado Gurun, Seram, Tanjungpura, Haru, Pahang, Dompo, Bali, Sunda, Palembang, Tumasik, entonces disfrutaré del descanso'.#!"
 podgloss.kinalakian: "Las Kinalakian son un grupo guerrero de élite compuesto exclusivamente por mujeres que protegen el reino de Talawasi, vistas como las amazonas de Nusantara en el resto del archipiélago."
 podgloss.kakawin: "El Kakawin es una forma de poesía javanesa, normalmente en verso métrico."
 podgloss.bhinneka_tunggal_ika: "#italic La Diversidad de Uno.#!\nEste verso se convertiría más tarde en el lema del gobierno indonesio."
 podgloss.silat: "Silat es un término colectivo utilizado para designar una clase de artes marciales centradas en el uso de una multitud de armas, normalmente forjadas por el maestro cuando consideran que su estudiante es digno de comenzar tal entrenamiento."
 podgloss.bentahara: "El Bentahara es un cargo en los reinos malayos que corresponde a Primer Ministro o Tesorero."
 podgloss.wally_songo: "Los [Glossary('Wali', 'podgloss.wali')] Songo son los Nueve Santos del Islam venerados por su papel histórico en la difusión del Islam en Indonesia."
 podgloss.wali: "Un santo o un amigo de Dios, en árabe."
 podgloss.shahbander: "El capitán del puerto está a cargo de los comerciantes y de la recaudación de impuestos."
 podgloss.laksamana: "Un almirante en los sultanatos malayos."
