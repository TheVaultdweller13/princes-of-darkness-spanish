 ####### Glosario POD

 glossary_clan_curse: "[Glossary('Maldición de Clan', 'glossary_clan_curse_tt')]"
 glossary_clan_curse_tt: "Una Maldición de Clan es una limitación sobrenatural experimentada por un $POD_splat_vampire$ basada en su $pod_clan$.\n\nEstos déficits tienen un profundo impacto psicológico en el nuevo vampiro y a menudo le obligan a remodelar su existencia nocturna por completo. Varios clanes, sin embargo, racionalizan su Maldición. Otros la interpretan como un don oculto o el efecto secundario de una gran iluminación o ventaja para engañarse a sí mismos.\n\nSegún el Libro de Nod, las Maldiciones de Clan son el resultado de la ira de Caín contra la [GetTrait('vampgeneration3').GetName(GetNullCharacter)] tras la destrucción de la [GetTrait('vampgeneration2').GetName(GetNullCharacter)]."

 glossary_courts_of_love: "[Glossary('Cortes del Amor', 'glossary_courts_of_love_tt')]"
 glossary_courts_of_love_tt: "Las Cortes del Amor son un dominio [GetTrait('vampire').GetName(GetNullCharacter)] e institución feudal que fue formada por los [GetTrait('toreador').GetName(GetNullCharacter)] franceses. Se compone de muchas Cortes del Amor, cada una de ellas el dominio de un poderoso Toreador.\n\nLas más prominentes e influyentes de estas cortes y sus dueños históricos fueron:\n$BULLET_WITH_TAB$Valois, en manos de la Matriarca Salianna\n$BULLET_WITH_TAB$Champagne, en manos de la Reina Helene 'la Juste'\n$BULLET_WITH_TAB$Poitiers, en manos del Rey Etienne de Poitiers\n$BULLET_WITH_TAB$Anjou, en manos de la Reina Isouda de Blaise\n$BULLET_WITH_TAB$Toulouse, en manos de la Reina Esclaramonde"

 glossary_osirian_league: "[Glossary('Liga Osiriana', 'glossary_osirian_league_tt')]"
 glossary_osirian_league_tt: "La Liga Osiriana es una sociedad dedicada a luchar contra [Glossary('Set','game_concept_antediluvian_desc')].\n\nSus miembros son:\n$BULLET_WITH_TAB$Los [GetTrait('mokole').GetName(GetNullCharacter)] bajo Sobek.\n$BULLET_WITH_TAB$La tribu #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Garou#! de los Caminantes Silenciosos.\n$BULLET_WITH_TAB$Los #TOOLTIP:GAME_TRAIT,bastet,[GetNullCharacter] #L hombres gato#! Bubasti.\n$BULLET_WITH_TAB$Los Hijos de Osiris y Discípulos de Anubis #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L vampíricos#!.\n$BULLET_WITH_TAB$Los magos-sacerdotes mortales del Culto de Isis.\n$BULLET_WITH_TAB$Los errantes [GetTrait('eshu').GetName(GetNullCharacter)].\n$BULLET_WITH_TAB$Los propios [GetTrait('shemsuheru').GetName(GetNullCharacter)]."


 glossary_khitta: "[Glossary('Khitta', 'glossary_khitta_tt')]"
 glossary_khittas: "[Glossary('Khittas', 'glossary_khitta_tt')]"
 glossary_khitta_tt: "El Cairo alberga varias facciones organizadas en Khittas, distritos vagamente definidos que son el dominio de un $pod_clan$ o linaje particular. Estos dominios suelen ser autónomos, pero todos responden ante el Sultán o el Príncipe al final. Aunque El Cairo es predominantemente musulmán, solo unas pocas Khittas están alineadas con los [Glossary('Ashirra','game_concept_ashirra_desc')].\n\nKhittas Ashirra:\n$BULLET_WITH_TAB$Banu al-Lam'a: El distrito Lasombra.\n$BULLET_WITH_TAB$Banu Yashkur: El distrito Assamita.\n$BULLET_WITH_TAB$Banu al-Hajj: El distrito Nosferatu.\n$BULLET_WITH_TAB$Banu al-Fen: El distrito Toreador. Esta Khitta es conocida canónicamente como Banu Duval y solo se fundó cuando un Toreador llegó junto a Napoleón a El Cairo en 1798.\n\nOtras Khittas:\n$BULLET_WITH_TAB$Banu Ahl ar-Raya: El distrito Brujah Verdadero.\n$BULLET_WITH_TAB$Banu al as-Sa'idi: El distrito Setita.\n$BULLET_WITH_TAB$Banu Zamalek: Un distrito libre donde varios otros vampiros establecen su hogar.\n$BULLET_WITH_TAB$Banu al-Azraq: El distrito Ventrue liderado por Antonio y sus descendientes.\n$BULLET_WITH_TAB$Banu al-Giza: El distrito de los Discípulos de Anubis situado a las afueras de El Cairo."

 ###############
 #### Fera #####
 ###############
 glossary_fera: "[Glossary('Fera', 'glossary_fera_tt')]"
 glossary_fera_tt: "Los #bold Fera#! son un pueblo espiritual con la capacidad de cambiar de forma a formas animales. Los $POD_splat_werewolf_plural$ son los más numerosos y conocidos, pero hay muchos otros tipos.\n\nSegún la mitología Fera, fueron creados por Gaia, la Madre Diosa de todos los seres vivos, y a cada uno se le dio su propio papel en la salvaguarda de sus creaciones. Sin embargo, muchos se han desviado de su tarea, ya sea por apatía, cinismo o sangrientos conflictos entre tribus, y Gaia se vuelve cada vez más distante.\n\nLos siguientes Fera son jugables en [princes_of_darkness|E]:\n$BULLET_WITH_TAB$#TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L;bold Garou#!#! #weak (Hombres lobo)#!\n$BULLET_WITH_TAB$#bold [GetTrait('bastet').GetName(GetNullCharacter)]#! #weak (Hombres gato)#!\n$BULLET_WITH_TAB$#bold [GetTrait('mokole').GetName(GetNullCharacter)]#! #weak (Hombres cocodrilo y Hombres dragón)#!"

 glossary_triat: "[Glossary('Tríada', 'glossary_triat_tt')]"
 glossary_triat_tt: "La Tríada son tres de las entidades más grandes de la jerarquía espiritual: el $glossary_wyld$, la $glossary_weaver$ y el $glossary_wyrm$.\n\nOriginalmente la Tríada estaba en equilibrio. El Wyld creaba la materia prima, la vida y el espíritu, mientras que la Tejedora daba a estas creaciones forma y función, y el Wyrm las destruía para dejar espacio a nuevas creaciones.\n\nSin embargo, la Tríada ya no está en equilibrio. La Tejedora se nutre de la fuerza de la humanidad —sus ciudades, tecnología, industria y ciencia— y es más fuerte que nunca. La influencia del Wyld retrocede a medida que se saquean los recursos naturales, se destruyen los lugares salvajes del mundo y se obliga a la naturaleza a cumplir las órdenes del hombre. Lo más peligroso de todo, sin embargo, es el Wyrm: se alimenta del mal y destruye sin distinción."

 glossary_wyld: "[Glossary('Wyld', 'glossary_wyld_tt')]"
 glossary_wyld_tt: "El #bold Wyld#! es uno de los tres espíritus incalculablemente poderosos que componen la $glossary_triat$.\n\nEl Wyld es una fuerza generativa: crea el Caos absoluto, al que la $glossary_weaver$ da orden antes de que sea destruido y devuelto al caos por el $glossary_wyrm$. Mientras que los otros dos de la Tríada enloquecieron, el Wyld está disminuyendo, siendo aplastado por la Tejedora y destruido temerariamente por el Wyrm.\n\nEl dominio del Wyld es la naturaleza y su crecimiento desenfrenado, que está siendo destruido lentamente por la humanidad."

 glossary_weaver: "[Glossary('Tejedora', 'glossary_weaver_tt')]"
 glossary_weaver_tt: "La #bold Tejedora#! es uno de los tres espíritus incalculablemente poderosos que componen la $glossary_triat$.\nLa función de la Tejedora era poner orden en las creaciones del $glossary_wyld$, dándoles forma y función durante el tiempo de su existencia antes de que fueran destruidas por el $glossary_wyrm$, manteniendo un equilibrio entre la creación y la destrucción.\n\nSe cree que la Tejedora es la principal culpable del desequilibrio en la Tríada; la Tejedora se cansó de que su orden fuera destruido por el Wyrm, y tejió sus redes para aprisionar al Wyrm y poner fin a su destrucción. Este encarcelamiento volvió loco al Wyrm, e hizo que empezara a destruirlo todo, en lugar de solo aquellas cosas cuyo tiempo había terminado.\n\nLos avatares e hijos de la Tejedora suelen adoptar la forma de arañas, o a veces de insectos. Es patrona de la ley, el orden, la ciencia y la tecnología. A medida que la humanidad avanza, también lo hace la Tejedora."

 glossary_wyrm: "[Glossary('Wyrm', 'glossary_wyrm_tt')]"
 glossary_wyrm_triatic: "[Glossary('Wyrm Triático', 'glossary_wyrm_tt')]"
 glossary_wyrm_apep: "[Glossary('Apep', 'glossary_wyrm_tt')]"
 glossary_wyrm_apophis: "[Glossary('Apofis', 'glossary_wyrm_tt')]"
 glossary_wyrm_tt: "El #bold Wyrm#! es uno de los tres espíritus incalculablemente poderosos que componen la $glossary_triat$.\n\nEl propósito del Wyrm era purificar y rectificar toda la Creación, fomentando su descenso hacia la Entropía. Lo lograba eliminando aquello que el $glossary_wyld$ crea y la $glossary_weaver$ estructura, completando el ciclo eterno del nacimiento a la muerte. Fue el segundo miembro de la $glossary_triat$ en enloquecer. Cuando la $glossary_weaver$ enloqueció y empezó a envolverlo todo en redes para evitar la destrucción de sus creaciones, el Wyrm fue progresivamente constreñido hasta que ya no pudo cumplir su propósito como deseaba. Al negársele la oportunidad de hacer aquello para lo que había sido creado, se vio sumido en un estado de pura rabia y locura, empeñado en destruirlo todo sin importar si su momento designado había llegado o no.\n\nAhora, el Wyrm existe como un Dios Oscuro de la [Glossary('Calamidad', 'glossary_wyrm_calamity_tt')], el [Glossary('Consumo', 'glossary_wyrm_consumption_tt')] y la [Glossary('Corrupción', 'glossary_wyrm_corruption_tt')]."

 glossary_wyrm_calamity: "[Glossary('Bestia de la Guerra', 'glossary_wyrm_calamity_tt')]"
 glossary_wyrm_calamity_tt: "La #bold Bestia de la Guerra#! o #bold Wyrm de la Calamidad#! es la primera de las tres cabezas del $glossary_wyrm_triatic$.\n\nEs un monstruo de rabia sin sentido, listo para destruir todo a su paso. Una rabia ilimitada lo alimenta, e instintos destructivos lo guían. Sus esbirros van desde tropas de choque autodestructivas que se lanzan a la batalla hasta brutos descomunales que se deleitan en dominar y aniquilar a sus víctimas.\n\nEsta cabeza es análoga al amor por el caos del $glossary_wyld$, pero aquí es un caos logrado a través del terror destructivo."

 glossary_wyrm_consumption: "[Glossary('Devorador de Almas', 'glossary_wyrm_consumption_tt')]"
 glossary_wyrm_consumption_tt: "El #bold Devorador de Almas#! o #bold Wyrm del Consumo#! es la segunda de las tres cabezas del $glossary_wyrm_triatic$.\n\nEs la encarnación de las hambres roedoras de la codicia, la lujuria y la glotonería. Algunos de sus esbirros han entregado toda su fuerza de voluntad; otros son asesinos decididos que acechan lo que neciamente creen que los completará. El odio del Devorador de Almas supura tan virulentamente como una enfermedad que devasta inexorablemente la carne infectada y erosiona la cordura atribulada.\n\nEsta cabeza es análoga al deseo de unificar de la $glossary_weaver$, pero lo que se hace aquí es poco más que la unificación a través del consumo y la eventual digestión."

 glossary_wyrm_corruption: "[Glossary('Wyrm Corruptor', 'glossary_wyrm_corruption_tt')]"
 glossary_wyrm_corruption_tt: "El #bold Wyrm Corruptor#! es la tercera de las tres cabezas del $glossary_wyrm_triatic$.\n\nEs una manifestación de cada impulso e instinto corruptor en existencia. Insidiosamente, el Wyrm Corruptor seduce a sus víctimas silenciosamente desde dentro, susurrando tentaciones que llevan a su presa voluntariamente a sus fauces. Es la serpiente en el Jardín del Edén, la ambición insensata de un ángel caído, la arrogancia de un [GetTrait('mage').GetName(GetNullCharacter)] que invoca más poder del que puede controlar, o la arrogancia de un $glossary_fera$ que cree que puede dominar las mismas fuerzas espirituales que inevitablemente lo condenarán a la perdición.\n\nEsta cabeza es análoga a la función purgativa original del Wyrm, pero en el mundo mortal es un ser que está restringido a solo poder carcomer a sus víctimas de forma intangible, sutil y desde dentro, hasta que todo lo que queda es una cáscara oscurecida demasiado corrupta para vivir."



