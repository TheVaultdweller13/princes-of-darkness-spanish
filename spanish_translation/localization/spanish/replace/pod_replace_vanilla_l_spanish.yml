 camp_purpose_legitimists_effects: "$EFFECT_LIST_BULLET$Igualdad de oportunidades para encontrar [task_contracts|E] de cualquier tipo\n$EFFECT_LIST_BULLET$Puede usar la Interacción $request_laamp_legitimist_support$ sobre Reyes y Emperadores\n$EFFECT_LIST_BULLET$Puede usar el [casus_belli|E] $claim_cb$\n$EFFECT_LIST_BULLET$Encuentra [task_contract|E] único de $laamp_legitimist_support_contract$\n\n#WEAK Una reclamación, la llaman. Una mera reclamación. No es solo una reclamación, es una carta de deuda, una declaración de intenciones y una clara señal de la recuperación que está por venir.#!"
