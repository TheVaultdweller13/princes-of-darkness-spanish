 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$Encuentra más [task_contracts|E] de [mercenary_task_contracts|E]\n$EFFECT_LIST_BULLET$Encuentra más [task_contracts|E] de [prowess|E] y [martial|E]\n\n#WEAK Los mercenarios ganan su dinero ante todo con la espada. Normalmente legalmente, pero cuando los tiempos son difíciles y solo tienes un hacha...#!"
