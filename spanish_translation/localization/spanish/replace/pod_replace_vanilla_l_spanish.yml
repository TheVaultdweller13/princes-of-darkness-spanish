 game_concept_levies_desc: "La $game_concept_levies$ a menudo se ve envuelta en las guerras de los sobrenaturales, a menudo sin saber a quién sirven realmente.\n\nCada [holding|E] proporciona un número determinado de $game_concept_levies$ a su [holder|E]. Los [vassals|E] a su vez proporcionan una parte de sus $game_concept_levies$ a su [liege|E].\n\nLa $game_concept_levies$ se compone principalmente de combatientes mal armados #weak (milicias campesinas, rufianes, mercenarios locales, nobles arruinados, etc.)#! y se consideran su propio tipo de unidad.\n\nUna $game_concept_levy$ tiene [GetDefine('NCombat', 'LEVY_ATTACK')|0] de [damage|E] y [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] de [toughness|E]. El otro tipo de [soldiers|E] en el juego son los [men_at_arms|E] — costosos profesionales entrenados."
