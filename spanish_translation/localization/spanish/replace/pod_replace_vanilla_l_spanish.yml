 #Drunk stuff
 bp1_yearly.9010.desc.drunk: ", claramente sin sentirse bien. [bp1_yearly_9007_doppelganger.GetSheHe|U] tambalea hacia mí con furia en [bp1_yearly_9007_doppelganger.GetHerHis] ojos.\n\n"¡Impostor! ¡Ese *#EMP hipo#!*"
 bp1_yearly.9010.desc.stoner: ", claramente sin sentirse bien. Los sangrientos ojos errantes de [bp1_yearly_9007_doppelganger.GetHerHis|U] miran con desprecio la zona alrededor de mi cabeza mientras [bp1_yearly_9007_doppelganger.GetSheHe] tambalea perezosamente hacia mí, riendo como un loco[a] todo el camino.\n\n"¡Impostor! ¡Ese *#EMP tos#!*"
 bp1_yearly.9010.desc.outro: "¡El [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom('InsultNoun')] no es [ROOT.Char.GetNameNoTooltip]! ¡Yo soy el verdadero [ROOT.Char.GetNameNoTooltip]!"\n\nAunque es una mentira obvia, ¡mi corte parece de alguna manera muy divertida de que mi verdadera identidad sea puesta en duda! Mientras [bp1_yearly_9007_doppelganger.GetNameNoTooltip] desenvaina [bp1_yearly_9007_doppelganger.GetHerHis] arma, queda claro que la violencia es la única respuesta."
 
 # Grand City stuff
 # Gruesome Festival (Colosseum)
 gruesomefestivalname_spectacle: "Espectáculo"
 gruesomefestivalname_spectacles: "Espectáculos"
 fp1_other_decisions.0002.b: "¡Que traigan una bestia por cada [blotter.Custom('WomanManPerson_GenderPreference')]!"
 fp1_other_decisions.0003.desc.intro.colosseum_small: "Aunque la reunión en el Coliseo es pequeña, el ambiente en el [blotter.Custom('GruesomeFestivalName')] es entusiasta. El público se empuja y abuchea mientras"
 fp1_other_decisions.0003.desc.intro.colosseum_medium: "Aproximadamente la mitad de los asientos del Coliseo están llenos de gente feliz y vitoreando, todos rugiendo mientras"
 fp1_other_decisions.0003.desc.intro.colosseum_large: "Los invitados al [blotter.Custom('GruesomeFestivalName')] son tan numerosos que lograron llenar el Coliseo hasta su capacidad, soltando un rugido ensordecedor mientras"
 fp1_other_decisions.0003.desc.colosseum_animals.regular: "una manada de feroces lobos es arreada a la arena.\n\n"
 fp1_other_decisions.0003.desc.colosseum_animals.magnificent: "una magnífica manada de leones es arreada a la arena.\n\n"
 fp1_other_decisions.0003.desc.colosseum_humans.regular.sans_chief: "un grupo de prisioneros son llevados a la arena, se les entregan armas y se les suelta sobre nuestros lobos.\n\n"
 fp1_other_decisions.0003.desc.colosseum_humans.magnificent.sans_chief: "una banda de temibles gladiadores entra en la arena, seguida de una magnífica manada de leones.\n\n"
 fp1_other_decisions.0003.desc.colosseum_humans.regular.plus_chief: "[sacrifice.GetFirstName] es llevado a la arena, completamente desarmado, y abandonado a su suerte contra una horda de prisioneros y lobos.\n\n"
 fp1_other_decisions.0003.desc.colosseum_humans.magnificent.plus_chief: "[sacrifice.GetFirstName] es llevado a la arena, completamente desarmado, y abandonado a su suerte contra una horda de gladiadores y leones.\n\n"
 fp1_other_decisions.0003.desc.sacrifice.named.colosseum: "La interminable ofensiva finalmente desgasta a [sacrifice.GetHerHim|l]. Después de una cantidad verdaderamente ridícula de violencia y derramamiento de sangre, [sacrifice.GetFirstName] expira, provocando un aplauso ensordecedor del público."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.colosseum: "Algunos de los gladiadores están entrenados en combate, otros no. No importa. Al final, ninguno de ellos queda en pie."
 fp1_other_decisions.0003.desc.sacrifice.animal.colosseum: "Muchas de las bestias hambrientas se despedazan entre sí, luego nuestros cazadores entrenados acaban con el resto rápidamente."
 fp1_other_decisions.0003.desc.outro.colosseum: "\n\nEsta gran exhibición será el tema de conversación de mi corte durante los próximos meses."
 fp1_other_decisions.0003.g: "Esta parece una excelente oportunidad para impresionar a la nobleza."
 fp1_other_decisions.0003.h: "Hora de codearme con la plebe común."
 
