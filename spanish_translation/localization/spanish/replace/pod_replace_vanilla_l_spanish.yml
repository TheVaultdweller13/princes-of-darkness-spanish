 bp1_yearly.7100.desc: "Un momento estaba disfrutando de un agradable paseo por [owned_county.GetName] y al siguiente estoy cubierto de excremento y revolcándome en el barro. Después de limpiarme furiosamente la suciedad de [ROOT.Char.Custom('EyeEyes')], encuentro al culpable con facilidad.\n\n"[potential_nemesis.GetTitledFirstName] envía [potential_nemesis.GetHerHis] saludos!" El campesino asomado a la ventana grita antes de huir de la escena.\n\nPatéticamente, intento lavar una piel que particularmente atesoro en un arroyo cercano, pero está claro que está más allá de toda salvación."
 
