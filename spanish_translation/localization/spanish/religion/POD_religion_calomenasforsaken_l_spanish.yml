 calomenasforsaken: "Abandonados de Calomena"
 calomenasforsaken_adj: "Abandonado"
 calomenasforsaken_adherent: "Abandonado"
 calomenasforsaken_adherent_plural: "Abandonados"
 calomenasforsaken_desc: "Azotes de la raza $pod_cainite$, los Abandonados son un grupo de cazadores que creen en la herejía bogomila. Creen que Calomena era la hermana de Caín, y que deben provocar la destrucción de los hijos de Caín: los vampiros. Creen en una filosofía dualista y también observan la pobreza extrema defendida por la mayoría de los bogomilos."
 holy_order_forsaken_militant: "Militante Abandonado"