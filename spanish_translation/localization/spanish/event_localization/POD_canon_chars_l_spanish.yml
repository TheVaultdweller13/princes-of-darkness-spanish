l_spanish:

 PODcanon_chars.1.t: "Nuevos comienzos"
 PODcanon_chars.1.desc: "Por fin ha terminado. El necio Menelao de Esparta ha muerto, y por primera vez en milenios eres libre de hacer lo que desees. Sin embargo, la victoria sabe más... vacía de lo que imaginabas, pues has perdido de repente aquello que fue tu propósito durante toda tu no-vida... pero seguirás adelante, como siempre lo haces.\nEl mundo te ha olvidado, e incluso los Toreador más antiguos ya te consideran un mito. Esto podría jugarte a favor. Ha llegado la hora de regresar al mundo de la política $pod_cainita$, un mundo que conoces tan bien, pero con una ventaja decisiva: nadie importante sospecha realmente de tus verdaderos poderes.\nEsta es una ventaja que resultará muy útil, y que piensas conservar el mayor tiempo posible..."
 PODcanon_chars.1.a: "Mi ascenso puede comenzar por fin"
 PODcanon_chars.helena: "Has desbloqueado una nueva [character_interaction|E] sobre gobernantes extranjeros: Infiltrar"
 PODcanon_chars.2.t: "El despertar de un dios"
 PODcanon_chars.2.desc: "Por fin ha terminado. Casi has completado el ritual para invocar a Svantevit en un huésped dispuesto. ¡No puedes esperar a sentir el poder de un dios fluyendo por tus venas inmortales!\nSin embargo, hay un pequeño problema: durante tus investigaciones descubriste que la mente del huésped debería borrarse por completo con la llegada de Svantevit. Obviamente, tú posees una voluntad férrea y no te rendirías tan fácilmente como esos idiotas seguidores que aplastaste... pero aun así, esto resulta preocupante.\nSimplemente descifrar el ritual ya te ha enseñado mucho, y quizá eso sea recompensa suficiente por sí mismo.\nO podrías invocar a un dios e intentar doblegarlo a tu voluntad. La elección es tuya... quizás por última vez."
 PODcanon_chars.2.a: "¡Poder absoluto!"
 PODcanon_chars.2.b: "...No me convence"
 PODcanon_chars.3.t: "Romance de los dioses"
 PODcanon_chars.3.desc: "Ha regresado.\nLa amada hija de Isis se ha unido de nuevo a tu lado, y una oleada de emociones contradictorias vuelve a invadirte. Lo que tuvisteis en aquella ocasión fue apasionado, aunque efímero. Quizá ahora, siendo ambos más viejos y con suerte más sabios, vuestra historia resista mejor la prueba del tiempo.\nAl menos será interesante, especialmente porque tus vasallos ya murmuran a tus espaldas. Kemintiri nunca fue una figura muy popular entre ellos.\nPero a ti no te importa. Ha regresado, y la no-vida vuelve a merecer la pena... con suerte, durante mucho tiempo."
 PODcanon_chars.3.a: "Rehagamos esta tierra a nuestra imagen"
 PODcanon_chars.mithras: "Has desbloqueado una nueva decisión importante limitada en el tiempo"
 PODcanon_chars.4.t: "Juicio por la guerra"
 PODcanon_chars.4.desc: "Has planeado una serie de escaramuzas rápidas y decisivas contra este vasallo rebelde. Si logras la victoria, estarás a salvo de rebeliones —al menos de esta— durante un tiempo.\nAsegúrate bien antes de lanzar el ataque, porque si pierdes, las consecuencias serán peores que no haber intentado nada en absoluto..."
 PODcanon_chars.4.a: "¡Adelante, hacia la victoria!"
 PODcanon_chars.4.b: "Esta noche no es la indicada"
 PODcanon_chars.4.effect.success.desc: "La victoria quebrantará el ánimo del vasallo durante un tiempo"
 PODcanon_chars.4.success: "¡Victoria!"
 PODcanon_chars.4.critical.failure.effect.desc: "La derrota avivará el espíritu rebelde del vasallo"
 PODcanon_chars.4.failure: "Derrotado..."
 PODcanon_chars.5.t: "Mirando hacia lo alto de la pirámide"
 PODcanon_chars.5.desc: "Ha llegado la hora de ejercer tu legítimo poder como maestro del clan $pod_clan$ Tremere en la buena y vieja política hermética. Como estás en la cima de la pirámide, al final ganarás. Solo queda por ver qué obtendrás exactamente de ello.\n¡Tantas opciones y tan pocas consecuencias! Excepto molestar a quienes están por debajo, obviamente. Aunque eso tampoco importa demasiado."
 PODcanon_chars.5.a: "Robar las ideas de otro"
 PODcanon_chars.5.b: "Culpar a otro de tus fracasos"
 PODcanon_chars.5.c: "Requerir fondos de las arcas del Clan"
 PODcanon_chars.5.d: "No estoy de humor para intrigas políticas"
 PODcanon_chars.6.t: "Las recompensas de Alamut"
 PODcanon_chars.6.desc: "Los líderes de los Hijos de Haqim están satisfechos con los progresos del Creciente de Medianoche en Iberia. Te envían sus mejores deseos y felicitaciones, junto con refuerzos: neonatos prometedores de las castas Vizir, Hechicero y Guerrero.\nTu labor aún no ha concluido, pero la presión sobre ti ha disminuido, pues al parecer confían por fin en que actúas en beneficio del $pod_clan$, e incluso consideran la posibilidad de convertir Iberia en una futura fortaleza digna del propio Haqim."
 PODcanon_chars.6.a: "Soy el tema de conversación de la década en Alamut"
 PODcanon_chars.7.t: "Intrigas dentro de intrigas"
 PODcanon_chars.7.desc: "Has logrado averiguar más sobre este posible enemigo. Siempre te resulta extrañamente reconfortante, príncipe Roque, pues adoras superar en astucia a tus rivales y atraparlos en una telaraña de planes improbables.\nAun así, a veces no conspiras solo por el placer de conspirar. ¡Podrías aprovechar la información obtenida para urdir aún más intrigas!"
 PODcanon_chars.7.a: "¡Tejer más complots contra él!"
 PODcanon_chars.7.b: "La intriga es un pasatiempo tan relajante..."
 PODcanon_chars.7.c: "¡Que todos conozcan el alcance de tu astucia!"
 PODcanon_chars.8.t: "Haciendo olas"
 PODcanon_chars.8.desc: "Señor Montano, con la recuperación de gran parte de Italia bajo tu control, has demostrado al clan $pod_clan$ Lasombra que sigues siendo un gobernante eficaz y decidido. Por supuesto, aún queda mucho por hacer para restaurar el lugar que le corresponde al Mar de Sombras en el mundo mediterráneo, pero al menos ya no se discute tu posición como cabeza del $pod_clan$.\nAhora puedes usarla para reclamar el dominio sobre cualquier principado lasombrano rebelde."
 PODcanon_chars.8.a: "Puedo hacerlo aún mejor"
 PODcanon_chars.montano: "Ahora tienes una bonificación especial para la aceptación de la interacción «Ofrecer vasallaje» con cualquier gobernante Lasombra"
 PODcanon_chars.9.t: "Un abrazo amoroso"
 PODcanon_chars.9.desc: "Eres difícil de resistir cuando te propones algo, hermosa Maatkare, pero los $pod_cainitas$ son criaturas obstinadas. Para mostrarle a este el amor de Set, necesitarás emplear todas tus notables habilidades de persuasión y seducción.\nSiempre existe el riesgo de fracasar, lo que te costaría bastante ante los implacables ojos de Set..."
 PODcanon_chars.9.a: "¡La gloria de Set no puede esperar!"
 PODcanon_chars.9.b: "Esta noche no es la indicada"
 PODcanon_chars.9.effect.success.desc: "La victoria hará que este personaje se convierta a la Vía de Set"
 PODcanon_chars.9.success: "¡Alabado sea Set!"
 PODcanon_chars.9.critical.failure.effect.desc: "El fracaso te costará bastante"
 PODcanon_chars.9.failure: "He fracasado..."
 PODcanon_chars.10.t: "Caminando la Espiral Negra"
 PODcanon_chars.10.desc: "Has visto a esos «Bailarines de la Espiral Negra». Están completamente locos, incluso según tus laxos estándares. ¿Vale la pena arriesgarse por la mínima posibilidad de hallar una respuesta a tu dolor? Lo único seguro es que no volverás a ser el mismo tras salir de ese lugar maldito..."
 PODcanon_chars.10.a: "Ya no hay vuelta atrás"
 PODcanon_chars.10.b: "Esta es una idea muy, muy mala"
 PODcanon_chars.petaniqua: "Es muy probable que regreses de allí peor de lo que entraste. Pero quizá haya un mínimo atisbo de algo valioso..."
 PODcanon_chars.11.t: "La locura de la Espiral Negra"
 PODcanon_chars.11.desc: "La gente cree que has regresado de la Espiral Negra prácticamente sin cambios. Pero tú sabes la verdad: nunca saliste de allí. Ahora forma parte de ti.\nY esas... cosas que viste jamás abandonarán tu visión. Quizá todo el mundo no sea más que una extensión de aquello. O tal vez ya estés demasiado perdido como para importarte.\nNo quieres volver allí. ¿O sí?"
 PODcanon_chars.11.a: "Ya no hay luz"
 PODcanon_chars.12.t: "Claridad en la Espiral Negra"
 PODcanon_chars.12.desc: "No recuerdas gran cosa de tu viaje por la Espiral Negra, lo cual... probablemente sea lo mejor. No hallaste verdades ocultas ni horrores espantosos. Si los hubieras encontrado, tendrías algún recuerdo, ¿no?\nEn cualquier caso, pese a lo que podría considerarse un revés, te alegra haber salido de allí. El mundo exterior ahora te parece extrañamente agradable."
 PODcanon_chars.12.a: "Podría haber sido peor"
 PODcanon_chars.13.t: "Fuerza de la Espiral Negra"
 PODcanon_chars.13.desc: "No cabe duda de que la Espiral Negra es un lugar de absoluta locura. Pero has pasado por tantas cosas en tu vida y no-vida que esta vez no te ha quebrantado. Has vencido a tus miedos, y «eso» quedó satisfecho con tu actuación.\nA pesar de esta muestra de fortaleza, reconoces sentirte aliviado de regresar al mundo exterior. Desde luego, no ha sido una experiencia precisamente relajante..."
 PODcanon_chars.13.a: "No me asusto fácilmente"
 PODcanon_chars.14.t: "El don de la Espiral Negra"
 PODcanon_chars.14.desc: "Lo has encontrado.\nQuizá la Espiral Negra haya tenido compasión de ti o se haya impresionado por tu dedicación. O tal vez solo sea un sueño, una fantasía de tu mente destrozada. No te importa.\nÉl está contigo ahora, y todo volverá a estar bien."
 PODcanon_chars.14.a: "Estás destinado a ser rey del mundo"
 PODcanon_chars.petaniqua2: "Ya no tienes motivos para adentrarte en la Espiral Negra"
 podintroductions.116.t: "Tu historia hasta ahora"
 podintroductions.116.desc: "Señor Hardestadt, tu ascenso político ha sido brillante hasta el momento. Desde un linaje oscuro y una posición fronteriza, supiste aprovechar hábilmente la ascensión del Sacro Imperio Romano Germánico para trasladar el centro del clan $pod_clan$ Ventrue desde Roma hasta Alemania.\nSin embargo, los viejos hábitos cuestan de erradicar, y tuviste que aliarte con Julia Antasia, líder de los restos romanos, para llegar hasta aquí. Tal vez sea hora de «renegociar» vuestra asociación y relegar a esos polvorientos antiguos al museo al que pertenecen.\nCuenta con fuertes aliados y vástagos leales; mantenlos cerca y atento a sus posiciones, y la historia será tuya."
 podintroductions.116.a: "Alemania es el futuro"
 podintroductions.hardestadt: "Como Hardestadt, dispones de una [character_interaction|E] especial con tus vástagos para mantenerlos a raya.\nAdemás, comienzas en una Lucha de Poder contra Julia Antasia."

 pressure_on_modifier: "Presión encima"
 pressure_on_modifier_desc: "Este personaje está bajo presión para dar lo mejor de sí."

 PODcanon_chars.15.t: "Apretando las riendas"
 PODcanon_chars.15.desc: "Tu vástago ha respondido a tu llamada, ansioso por conocer tus deseos. Eres conocido como un [Glossary('Sire','game_concept_Sire_desc')] severo, de los que no toleran fácilmente el fracaso. Aun así, nadie puede negar que tus métodos educativos han producido algunos de los neonatos más dotados de su generación. Los demás... bueno, no suelen empañar tu reputación durante mucho tiempo."
 PODcanon_chars.15.a: "¡Hazlo mejor!"
 PODcanon_chars.15.b: "Nunca te conformes"
 PODcanon_chars.15.c: "¡Eres un fracaso sin remedio!"
 PODcanon_chars.hardestadt_tooltip: "Mientras este personaje siga siendo tu rival, no podrás volver a convocarlo"

 POD_hardestadt_interaction: "Apretar las riendas"
 POD_hardestadt_interaction_desc: "Convoca a tu vástago para hablar"

 podintroductions.117.t: "Tu historia hasta ahora"
 podintroductions.117.desc: "Señora Antasia, te mantienes firme en tu hogar exiliado en Alemania, pero tu corazón anhela un regreso triunfal a Roma. El clan $pod_clan$ Ventrue ha caído muy lejos de sus nobles orígenes en el Senado Eterno, y tú eres la única capaz de detener a Hardestadt y Camila antes de que conviertan a tu amado $pod_clan$ en una burla de sí mismo.\nEste empeño requerirá tiempo, pero recientemente has hallado un aliado sorprendente: Angiwar, el Nosferatu. Es un ser extraño, aficionado a relatos fantásticos, pero ya ha demostrado ser un amigo leal y un campeón digno de tu causa. Con vuestro poder combinado, aún hay esperanza para los verdaderos ideales de Roma."
 podintroductions.117.a: "El Senado no caerá"
 podintroductions.antasia: "Como Julia Antasia, dispones de una [character_interaction|E] especial con Angiwar mientras sigáis siendo amigos.\nAdemás, comienzas en una Lucha de Poder contra Hardestadt."

 POD_antasia_interaction: "Charla amistosa"
 POD_antasia_interaction_desc: "Invita a Angiwar a una charla agradable"

 PODcanon_chars.16.t: "Angiwar, el cuentacuentos"
 PODcanon_chars.16.desc: "Cuando lo conociste, esperabas que Angiwar tuviera alguna revelación sobre tu abuelo, el propio Ventrue. Lamentablemente, no fue así: ni siquiera un ser tan antiguo como él llegó a encontrarse con un [Glossary('Antediluviano','game_concept_antediluvian_desc')]. Aun así, el Nosferatu tiene muchas historias que contar sobre el mundo $pod_cainita$, algunas de las cuales hasta a ti te cuesta creer.\nA Angiwar no le importa; se siente feliz compartiéndolas contigo. Recibir con franqueza, sin engaños, los consejos de un vampiro tan anciano —aunque excéntrico— es una bendición que no piensas desperdiciar."
 PODcanon_chars.16.a: "¿De verdad? ¡Es increíble!"

 PODcanon_chars.17.t: "Angiwar, el confidente"
 PODcanon_chars.17.desc: "Angiwar está callado esta noche y parece dispuesto simplemente a escuchar tus problemas. En el mundo $pod_cainita$, es raro poder confiar en alguien sin temor a engaños o manipulaciones. Pero contigo se siente cómodo, pues sabe que vuestros objetivos están alineados. Este lujo no es nada desdeñable, y cada vez que pasas tiempo con él, el sueño eterno parece un poco menos tentador."
 PODcanon_chars.17.a: "La amistad es un activo valioso"

 PODcanon_chars.18.t: "Angiwar, el guerrero"
 PODcanon_chars.18.desc: "Angiwar está inquieto esta noche y habla de la grave amenaza que enfrenta su $pod_clan$: los Nictuku. Ya lo has visto así antes, y aunque desconoces de qué habla, prefieres seguirle la corriente. Incluso cuando te reta a un duelo de entrenamiento para estar «preparados cuando lleguen». No todas las noches puedes entrenar con un guerrero tan experimentado, y seguro que aprenderás algo."
 PODcanon_chars.18.a: "Estaremos preparados"

 podintroductions.118.t: "Tu historia hasta ahora"
 podintroductions.118.desc: "Señor Alejandro, en otros tiempos fuiste el Ventrue más influyente del mundo, susurrando al oído del mismísimo Carlomagno. Ahora estás exiliado de tu amada Francia por la maldita Salianna y tu traidor vástago Godofredo. Regresarás, pero otros asuntos requieren tu atención.\nEl señor Jürgen von Verden, tu actual anfitrión, ha reunido un pequeño ejército para ayudarte, cumpliendo con su deber como miembro más joven del clan. Aceptar su ayuda sería útil, pero también significaría que has caído en la mendicidad. Rechazarla sería más acorde con tu estatus... pero sin duda enfurecería al príncipe de Magdeburgo. Elige con sabiduría: podría ser el primer paso hacia tu regreso triunfal al mundo $pod_cainita$."
 podintroductions.118.a: "Agradezco la ayuda, señor Jürgen"
 podintroductions.118.b: "¡Un rey no suplica!"
 alexander_black_cross_event_troops: "Ghuls de la Cruz Negra"

 alexander_help_modifier: "Bien relacionado"
 alexander_help_modifier_desc: "Se dicen cosas favorables de ti en las altas esferas, gracias a la ayuda de un patrón poderoso."

 podintroductions.119.t: "Tu historia hasta ahora"
 podintroductions.119.desc: "Señor Jürgen, tu ascenso ha progresado a un ritmo vertiginoso desde tu $pod_Embrace$. Sin embargo, el reciente revés en la guerra contra el Voivodato ha limitado tu influencia. Ahora surge una nueva oportunidad con la llegada a tu corte del príncipe exiliado de Francia, Alejandro.\nHasta ahora has sido un anfitrión ejemplar, y seguir siéndolo beneficiaría tus ambiciones, pues Alejandro aún posee gran prestigio en el $pod_clan$. Pero el poderoso Ventrue no ha venido solo: también trae consigo a Rosamunda de Islington, la más bella entre las bellas del $pod_clan$... y la que ha robado tu corazón.\nRecientemente le confesaste tus sentimientos, pero parece que el propio Alejandro también la desea. Debes tomar una decisión..."
 podintroductions.119.a: "Amor..."
 podintroductions.119.b: "...¿o poder?"
 jurgen_love_tooltip: "Rosamunda se unirá a tu corte, dejándote al cuidado de sus tierras."

 podintroductions.120.t: "Tu historia hasta ahora"
 podintroductions.120.desc: "¡Salve, poderoso Camila, antaño indiscutible señor de Roma y del clan $pod_clan$ Ventrue!\nEn aquellos tiempos benditos, todos se postraban ante ti; la infernal Cartago fue destruida por tu orden, y todo era perfecto... hasta que caíste en $pod_torpor$. Obviamente, nadie pudo asumir tu manto, y el Imperio cayó contigo. Recientemente has despertado en este mundo nuevo, tan distinto al que conocías... pero aún lleno de oportunidades.\nReafirmar tu control sobre tu amada Roma fue fácil, pero ahora te aguardan retos mayores.\nEres la Cónsul Eterna del Pecado, y tu futuro no puede ser otro que uno de gloria inmortal y placeres decadentes."
 podintroductions.120.a: "Roma Eterna"
 podintroductions.camilla: "Como Camila, disfrutas de un evento especial, más beneficioso y probable, durante la actividad «Celebrar un Elíseo».\nAdemás, puedes mejorar tu Corona Laurel si completas el objetivo Pecado Político."

 POD_elysium_events.25.t: "Fiesta al estilo romano"
 POD_elysium_events.25.desc: "Más allá de ser una de las Ventrue más poderosas y una astuta estratega política, eres famosa como la mejor anfitriona de toda la raza $pod_cainita$. Después de todo, tú misma inventaste el concepto durante el Imperio Romano, y sabes exactamente cómo hacerlo.\nFluirá la sangre, todos lo pasarán magníficamente, y gracias a tu meticulosa planificación, una pequeña parte de lo que hizo grande a Roma sobrevivirá esta noche."
 POD_elysium_events.25.option.a: "¡Que empiece la fiesta!"

 anna_ambition_modifier: "Ambición ardiente"
 anna_ambition_modifier_desc: "Anna no se detendrá ante nada para reclamar su derecho de nacimiento. Puedes ayudarla o ser apartado; no hay término medio."

 podintroductions.121.t: "Tu historia hasta ahora"
 podintroductions.121.desc: "Noble señora, provienes del linaje griego más ilustre, y Constantinopla es tuya por derecho; ni siquiera convertirte en vampiro ha cambiado ese hecho. Te adaptaste bien a tu nueva condición y ascendías rápidamente en la jerarquía bizantina cuando ocurrió la Cuarta Cruzada. Con Miguel y el Sueño destruidos, y los vampiros latinos triunfantes, tu ciudad vuelve a escapársete.\nSin embargo, aún hay esperanza: los latinos tienen dificultades para consolidar su dominio, lo que te ha permitido ayudar a fundar el imperio sucesor de Nicea. Desde esta base de poder, estás a punto de cumplir tu ambición eterna...\n¡Adelante, hija de emperadores, y cumple tu destino!"
 podintroductions.121.a: "Mi ciudad, anhelo del mundo..."
 podintroductions.anna: "Para mejorar tu modificador inicial, puedes usar una [decision|E] especial que requiere que controles Constantinopla"

 anna_decision: "Nacida en la púrpura"
 anna_decision_tooltip: "Debe acabar la opresión latina."
 anna_decision_desc: "Constantinopla debe ser tuya, ahora más que nunca. Liberarás la ciudad de los malditos Lasombra latinos y comenzarás tu reinado eterno sobre la más grande del mundo."
 anna_decision_effect_tooltip: "Cumplirás tu ambición."
 anna_decision_confirm: "¡Por fin!"

 anna_ambition_fulfilled_modifier: "Ambición cumplida"
 anna_ambition_fulfilled_modifier_desc: "Los Comnenos son ahora los gobernantes inmortales y eternos de Constantinopla. Como debe ser."

 podintroductions.122.t: "Tu historia hasta ahora"
 podintroductions.122.desc: "Señora Anadja, tu vida sencilla se sumió en el caos con la llegada de Belisario y Shabah. Estos dos vampiros se encariñaron contigo y te enseñaron mucho sobre cómo sobrevivir en la sociedad nocturna... y luego tu vida se volvió aún más extraña cuando una secta apocalíptica secreta, la Manus Nigrum, anunció que eras su líder prometida.\nA pesar de todo, te has desenvuelto bien: Armenia se ha convertido en una fortaleza bajo tu mando, atrayendo tanto a miembros del culto como a refugiados bizantinos. Tus «padres adoptivos» siguen contigo y son una ayuda inestimable para estabilizar tu nuevo reino, pero ha llegado la hora de tomar las riendas tú misma.\nHas sido instruida por los mejores, y muchos ya te consideran una de las $pod_cainitas$ más importantes del mundo, pero tu historia es solo tuya."
 podintroductions.122.a: "Soy mi propia $pod_cainita$"
 podintroductions.anadja: "Mientras Belisario y Shabah estén vivos, puedes pedir más enseñanzas mediante una [decision|E]"

 anadja_decision: "Aprender de los mejores"
 anadja_decision_tooltip: "Siempre hay margen para mejorar"
 anadja_decision_desc: "Belisario y Shabah siempre están dispuestos a ayudarte a progresar, aunque sus lecciones a veces pueden ser agotadoras."
 anadja_decision_effect_tooltip: "Comenzará una sesión de entrenamiento"
 anadja_decision_confirm: "Estoy lista"
 anadja_custom_decision: "Esta [decision|E] dejará de estar disponible una vez alcances 25 en combate, 20 en diplomacia y 20 en intriga, o si tanto [GetScriptedCharacterByHistoryID('790015').GetFirstName] como [GetScriptedCharacterByHistoryID('790962').GetFirstName] mueren"

 PODcanon_chars.19.t: "Aprender de los mejores"
 PODcanon_chars.19.desc: "Belisario fue un gran general en vida mortal y luego gestionó numerosos asuntos militares para el Sueño $pod_cainita$ de Constantinopla. Hay mucho que aprender de él. Shabah, en cambio, es una espía y embajadora experta —a menudo ambas cosas a la vez— y puede instruirte en esos temas. ¿Sobre qué les preguntas esta noche?"
 PODcanon_chars.19.a: "Cuéntame tus campañas militares, Belisario"
 PODcanon_chars.19.b: "La diplomacia es un tema complejo..."
 PODcanon_chars.19.c: "...quizá tan complejo como la intriga"
 PODcanon_chars.19.d: "He cambiado de opinión"

 shaky_secrets_modifier: "Secretos frágiles"
 shaky_secrets_modifier_desc: "Saben que ocultas algo, y quieren descubrirlo."

 shrouded_secrets_modifier: "Secretos velados"
 shrouded_secrets_modifier_desc: "Tus secretos están protegidos por una tenue capa de sombras."

 darkened_secrets_modifier: "Secretos en tinieblas"
 darkened_secrets_modifier_desc: "No te conocen en absoluto. Nadie lo hará jamás."

 secrets_secrets_modifier: "Secretos dentro de secretos"
 secrets_secrets_modifier_desc: "Peones en un tablero, hábilmente movidos por tu mano."

 podintroductions.123.t: "Tu historia hasta ahora"
 podintroductions.123.desc: "Sultán Badr, has asumido el control del Creciente de Medianoche, y los [Glossary('Ashirra','game_concept_ashirra_desc')] acorralados se están uniendo sabiamente tras de ti. Observa atentamente a quienes no lo hacen, para castigarlos después.\nDebes respetar la Reconquista Sombra cristiana, pues tanto de Ruiz como su linaje son oponentes formidables, pero tu asunto más urgente es el secreto.\nOcultas muchas cosas a tus nuevos seguidores «leales», cosas que no quieres que descubran pese a sus insistencias. Usa tu dominio de las sombras y la intriga para esconderte tras un velo impenetrable de misterio antes de que sea demasiado tarde. Solo entonces podrás expulsar a los cristianos de Iberia."
 podintroductions.123.a: "La verdad es mía para moldearla"
 podintroductions.badr: "Tienes hasta 1300 para usar una decisión especial que mejora tu modificador inicial"

 badr_decision: "Los misterios de Badr"
 badr_decision_tooltip: "Nunca deben saberlo."
 badr_decision_desc: "Como nuevo gobernante del Creciente de Medianoche, todas las miradas están puestas en ti. Debes ocultarte bien antes de que sea demasiado tarde."
 badr_decision_decision_effect_tooltip: "El misterio se intensifica."
 badr_decision_confirm: "Nunca lo sabrán"

 podintroductions.124.t: "Tu historia hasta ahora"
 podintroductions.124.desc: "Piadoso Suleimán, los tiempos son duros para los fieles [Glossary('Ashirra','game_concept_ashirra_desc')]. Los despreciables Lasombra cristianos han declarado la guerra a tu pueblo, sumiendo a Iberia y al Magreb en el caos. Pero también hay problemas más cercanos: tu antiguo amigo Jalid está reclutando tropas en Mesopotamia tras una violenta disputa contigo sobre si intervenir o no en los asuntos mortales. Además, tu propio vástago, Harún el-La’il, ha proclamado su independencia tras revelar su doctrina herética.\nDebes actuar, Suleimán. Los [Glossary('Ashirra','game_concept_ashirra_desc')] necesitan unidad ahora más que nunca, y quizá debas hacer concesiones para conseguirla. Aunque también es posible mantener una postura inflexible..."
 podintroductions.124.a: "No habrá compromisos"
 podintroductions.124.b: "¡Jalid, tenemos amenazas más graves!"
 podintroductions.124.c: "Harún, podemos hablar más de tus teorías..."

 podintroductions.125.t: "Tu historia hasta ahora"
 podintroductions.125.desc: "Valiente Lucita, tras haber estado atrapada en el mundo mortal por ser mujer, ahora estás atrapada en el no-mundo por ser Lasombra. Esto no puede continuar. Eres un espíritu libre que anhela independencia, y no vas a esperar siglos a convertirte en anciana para conseguirla.\nTu primer objetivo debe ser tu propio [Glossary('Sire','game_concept_Sire_desc')], Ambrosio Luis Moncada. Aunque hasta ahora has disfrutado de su protección y usado su nombre para tus propios fines, está claro que su actitud posesiva será un problema en el futuro. Luego, el propio clan $pod_clan$ Lasombra deberá entender que tú no eres su «estrella emergente», sino una mujer independiente, y esos ancianos decrépitos aprenderán a respetarte.\nEl caos de una Iberia sumida en la guerra civil de tu clan será la oportunidad perfecta para forjar tu propio destino. Solo tienes que aprovecharla bien."
 podintroductions.125.a: "Vivir libre o morir intentándolo"
 podintroductions.125.b: "Quizá haya una alternativa..."
 podintroductions.lucita: "Como Lucita, dispones de una decisión especial para mejorar tu modificador inicial"

 podintroductions.1250.desc: "Tu [Glossary('Sire','game_concept_Sire_desc')], Ambrosio Luis Moncada, ha sido una bendición ambigua. Como miembro poderoso e influyente del clan $pod_clan$ Lasombra, tu estatus como su «hija» favorita te ha abierto muchas puertas y te ha protegido de las consecuencias de tus errores juveniles. Sin embargo, la presencia celosa de este hombre y su firme convicción de «moldear tu destino» te provocan escalofríos.\nAmbrosio no es ajeno a ese sentimiento y te ofrece retomar tu labor como [ashen_ambassador|E] suya, como hiciste en Constantinopla. Así, seguirías ayudándolo sin tener que estar en contacto cercano, algo que prefieres enormemente.\nEs una oferta que, por ahora, sirve bien a tus intereses, especialmente porque podrás contar con tu viejo amigo Anatole, acompañado de su recién adoptada vástaga Zoe. Los tres podréis vagar por el mundo y hacer prácticamente lo que os plazca, olvidando por un tiempo la larga sombra de vuestro [Glossary('Sire','game_concept_Sire_desc')]."
 podintroductions.1250.a: "Una libertad condicional, al menos"
 lucita_landless_tt: "Ahora serás un personaje sin tierras, comenzando como [ashen_ambassador|E] de Ambrosio Luis Moncada. Mientras seas sin tierras, dispondrás de una decisión alternativa para eliminar tu modificador inicial Lucita Encarcelada."

 caged_lucita_modifier: "Lucita, encarcelada"
 caged_lucita_modifier_desc: "Aún no eres la heroína de tu propia historia, y eso te enfurece sobremanera."
 unleashed_lucita_modifier: "Lucita, liberada"
 unleashed_lucita_modifier_desc: "Tu propia historia ha comenzado por fin. Será gloriosa."
 heiress_lucita_modifier: "Lucita, heredera de la noche"
 heiress_lucita_modifier_desc: "Has aceptado el camino trazado por tu Sire. El mundo es tuyo para reclamarlo, tal como él predijo."

 lucita_landless_decision: "El destino de Lucita"
 lucita_landless_decision_tooltip: "Tu hora está por llegar"
 lucita_landless_decision_desc: "Libre para vagar por el mundo, sigues atada a la influencia de tu Sire. Quizá una noche él considere que estás preparada para soltarte por completo."
 lucita_landless_decision_effect_tooltip: "Si tu Sire, Ambrosio Luis Moncada, sigue vivo, te ofrecerá heredar todos sus títulos. Si ha muerto, simplemente eliminarás tu modificador negativo."
 lucita_landless_decision_confirm: "¿Una forma de libertad?"

 lucita_decision: "El destino de Lucita"
 lucita_decision_tooltip: "Tu hora está por llegar"
 lucita_decision_desc: "Debes deshacerte de los últimos grilletes que te atan. Entonces, llegará la hora de actuar."
 lucita_decision_confirm: "¡Libre, por fin!"
 lucita_custom_decision: "[GetScriptedCharacterByHistoryID('505154').GetFirstName] debe estar muerto"

 good_moncada_modifier: "Un mundo perfecto"
 good_moncada_modifier_desc: "Tanto si te ama como si te odia, Lucita está viva. Tu mundo está en perfecta armonía."

 podintroductions.126.t: "Tu historia hasta ahora"
 podintroductions.126.desc: "Piadoso Moncada, Iberia está en tumulto y Dios te ha llamado a salvarla. Tu [Glossary('Sire','game_concept_Sire_desc')], Silvestre de Ruiz, lidera oficialmente el esfuerzo cristiano, pero tú eres el verdadero poder tras el trono. Por ahora te resulta útil, pero quizá llegue un momento en que debas salir a la luz.\nY luego está Lucita... un ángel enviado por Dios para guiarte, sin duda, aunque ella aún no lo sepa. Desde su $pod_Embrace$, has estado en tu mejor momento: más perspicaz, más rápido, más fuerte. Con el tiempo aprenderá a apreciarte, pero hasta entonces debes asegurarte de que permanezca a salvo. Ni siquiera soportas pensar qué sería de tu pobre alma si le ocurriera algo..."
 podintroductions.126.a: "Dios me ha concedido el mayor de los dones"
 podintroductions.moncada: "Como Moncada, disfrutarás de este modificador mientras Lucita esté viva. Pero si ella muere...\nAdemás, comienzas en una Lucha de Poder contra Silvestre de Ruiz."

 PODcanon_chars.20.t: "El fin de tu mundo"
 PODcanon_chars.20.desc: "Ha muerto.\nLucita, tu ángel guía, ha muerto.\nYa no hay esperanza para ti. Probablemente tampoco la haya para el mundo, pues esto es clara prueba de que Dios ha abandonado incluso a sus siervos más fieles. ¿Puedes siquiera continuar con esta miserable no-vida? ¿Qué sentido tiene intentarlo?... Quizá, quizá sea una prueba, como tantas veces antes. Si es así, será la más dura de toda tu existencia.\nTal vez resistas, pero ni siquiera estás seguro de querer hacerlo."
 PODcanon_chars.20.a: "Se ha ido..."

 bad_moncada_modifier: "Un mundo roto"
 bad_moncada_modifier_desc: "El centro de tu mundo ha muerto. Eres una cáscara vacía arrastrándose por una vida inútil."
 podintroductions.127.t: "Tu Historia Hasta Ahora"
 podintroductions.127.desc: "Príncipe Alfonzo, después de siglos de espera, Constantinopla finalmente es tuya. Sin embargo, ten cuidado, esos cobardes vampiros griegos huyeron cuando usaste expertamente la 4ª Cruzada para tu ventaja y ahora están reuniendo sus tropas y agentes contra ti. Sabiamente te has arrodillado ante el Mar de Sombras para obtener su protección mientras consolidas tu gobierno. Un proceso temporal, por supuesto, ya que tienes mayores ambiciones que seguir siendo un mero vasallo.\nTe importa poco tu 'fe' en la Herejía $pod_cainite$ y la cambiarías en un instante si fuera necesario, aunque todavía podría haber oportunidades al aferrarte a ella.\nExpande el dominio latino y deshazte de los restos bizantinos tan pronto como sea posible. ¡Tu ascensión apenas comienza!"
 podintroductions.127.a: "Un nuevo triunfo se acerca"
 podintroductions.alfonzo: "Como Alfonzo, eres el único que puede crear el Imperio Latino, a través de una decisión especial"
 
 alfonzo_decision: "El Dominio Latino"
 alfonzo_decision_tooltip: "Es hora de lidiar con los restos"
 alfonzo_decision_desc: "Eres el símbolo de la victoria de los Latinos sobre los Griegos. Abraza y usa esta imagen para forjarte un nuevo imperio."
 alfonzo_decision_confirm: "Bizancio ha muerto"
 
 bad_gratiano_modifier: "El Advenedizo"
 bad_gratiano_modifier_desc: "Eres el vástago pelirrojo de la familia Lasombra. ¡Esto no ayuda en nada!"
 
 podintroductions.128.t: "Tu Historia Hasta Ahora"
 podintroductions.128.desc: "Lord Gratiano, el poderoso Lasombra vio tu grandeza y te Abrazó en su $pod_clan$. Este acto enfureció a tus nuevos 'hermanos' y desde entonces has sido marcado como un advenedizo, negándote las numerosas responsabilidades y títulos que deberían ser tuyos. Tienes que empezar desde cero.\nCon ese propósito, elegiste Verona, una ciudad que conoces bien desde tus días mortal, y se ha establecido el punto de apoyo pero... nada ha cambiado todavía. Todavía se ríen de ti, te insultan a tus espaldas, ¡incluso planean tu caída! Esto debe parar.\nLes mostrarás por qué Lasombra te eligió a ti. ¡Les mostrarás que Gratiano de Veronese nació para gobernar!"
 podintroductions.128.a: "Ellos verán..."
 podintroductions.gratiano: "Para deshacerte del modificador inicial de Gratiano, debes completar una decisión especial."
 
 gratiano_decision: "Nacido para Gobernar"
 gratiano_decision_tooltip: "Ellos aprenderán"
 gratiano_decision_desc: "Demuestra al $pod_clan$ Lasombra que eres más que la última mascota de Papá. Logra algo que no puedan ignorar."
 gratiano_decision_confirm: "Han aprendido"
 
 podintroductions.129.t: "Tu Historia Hasta Ahora"
 podintroductions.129.desc: "Lord Sejanus, después de tu fatídico $pod_Embrace$, vagaste durante bastante tiempo por Europa buscando un lugar para comenzar tu Imperio de la Noche. Tu ubicación actual es prometedora, aunque quizás demasiado cerca del poderoso Hardestadt. Tendrás que lidiar con él.\nAseguraste fácilmente el Principado sobre esta área porque recibiste una ayuda muy inesperada. Un extraño Tzimisce inglés llamado Jack se ha maravillado contigo y tus sueños y se ha comprometido con entusiasmo a tu servicio. Después de una breve investigación, crees que es digno de confianza y bastante capaz para ser un vampiro tan joven.\nEncontrar a un menor que reconozca tu grandeza siempre es gratificante, quizás podrías recompensarlo con un papel importante en tu incipiente reino."
 podintroductions.129.a: "Puedo hacer uso de ti"
 podintroductions.129.b: "¡No necesito ninguna ayuda!"
 
 podintroductions.130.t: "Tu Historia Hasta Ahora"
 podintroductions.130.desc: "Lady Salianna, tu golpe contra Alejandro fue un gran éxito y ahora finalmente controlas la mayor parte de Francia. Tuviste que hacer algunas concesiones para que sucediera, sobre todo con el vástago de Alejandro, Geoffrey du Temple, quien obtuvo la propia París como recompensa. Si realmente quieres fortalecer tu control sobre el país, necesitarás la prestigiosa capital en tus manos.\nGeoffrey es joven y crédulo, pero tiene muchos amigos que podrían ser problemáticos. Tendrás que actuar con cuidado para burlarlo sin derramamiento de sangre innecesario."
 podintroductions.130.a: "Es hora de reconsiderar nuestra asociación"
 salianna_intro_tooltip: "Recibirás algunos eventos sobre tu relación con Geoffrey en los próximos días.\nTambién comienzas en una Lucha de Poder con Geoffrey du Temple."
 
 PODcanon_chars.21.t: "Burlar a Geoffrey"
 PODcanon_chars.21.desc: "Para comenzar tu plan de obtener París, tendrás que aislar a Geoffrey. Su red de agentes y contactos no es tan fuerte, pero como Ventrue, representa un gobernante más 'legítimo' de Francia para algunos de tus súbditos que tú. Con unos pocos sobornos y amenazas veladas podrías cambiar este estado de cosas. Seguramente entenderán fácilmente que serías un Príncipe de París mucho mejor que algún necio señor de la guerra."
 PODcanon_chars.21.a: "Fácilmente hecho"
 PODcanon_chars.21.b: "Dejaré que Geoffrey conserve su premio"
 salianna_exit_tooltip: "Abandonas el plan de obtener París para ti"
 
 PODcanon_chars.22.t: "Manejar a los Aliados de Geoffrey"
 PODcanon_chars.22.desc: "Te deshiciste fácilmente de la mayoría de los partidarios tentativos de Geoffrey, excepto dos de ellos. Isouda de Blaise, la Reina de Anjou, ha manifestado su desaprobación pero... ella ya te odia, así que, ¿a quién le importa de todos modos?\nMás problemática es la terquedad de Francois d'Alencourt. El poderoso príncipe de Lyon se ha comprometido con la causa de Geoffrey y no cederá. Si continúas con tu curso de acción, te harás un nuevo y poderoso enemigo."
 PODcanon_chars.22.a: "Uno más o uno menos..."
 PODcanon_chars.22.b: "Dejaré que Geoffrey conserve su premio"
 
 PODcanon_chars.23.t: "Una Vez Más, París"
 PODcanon_chars.23.desc: "Has terminado tus preparativos y ahora estás lista para expulsar, sin demasiados problemas, a Geoffrey de París. La ciudad servirá como una poderosa capital para tu Corte de Amor y asegurará la superioridad de los Toreador en Francia durante generaciones.\nEl último asunto a resolver es el propio Geoffrey. Sin París, está prácticamente desdentado y podrías deshacerte de él si crees que ya no sirve. O podrías mantenerlo a mano para otra tarea en el futuro. En cualquier caso, obviamente no tiene voz ni voto en el asunto."
 PODcanon_chars.23.a: "Seré generosa en la victoria"
 PODcanon_chars.23.b: "No tengo uso para ancillae petulantes"
 
 podintroductions.131.t: "Tu Historia Hasta Ahora"
 podintroductions.131.desc: "Lady Isouda, durante el caos de la caída de Alejandro, fuiste superada en la línea de meta para el liderazgo de las Cortes del Amor por Salianna. Sin embargo, este no tiene que ser el final de tu carrera. Tu control sobre Anjou sigue siendo fuerte, y Salianna es vulnerable mientras su poder no esté consolidado.\nNecesitarás ayuda para las futuras batallas, ya sean políticas o militares. Afortunadamente, tienes un buen control sobre cómo 'educar' a tus vástagos y deshacerte de los débiles e inútiles. Úsalo para tu ventaja, y Francia finalmente podría ser tuya."
 podintroductions.131.a: "La guerra no ha terminado"
 isouda_intro_tooltip: "Como Isouda tienes una posibilidad especial gratificante, aunque arriesgada, para educar a tus vástagos"
 
 POD_education_events.1.option.e: "Veamos si sobreviven en mi corte..."
 POD_education_events.1.option.isouda: "Como Isouda, puedes poner a tu vástago en la despiadada arena que es tu corte. Se volverán más fuertes por ello... si sobreviven."
 
 POD_education_events.26.t: "Una Educación: Vástago Digno"
 POD_education_events.26.desc: "Las pruebas han terminado y parece que este será útil. Bueno, eso es genial y todo, pero para ser honesta, estás un poco decepcionada. Tal vez deberías animarlos para la próxima vez para hacerlo más desafiante y más divertido verlos retorcerse en tu despiadada corte. Oh, bueno, pensamientos para otra noche."
 POD_education_events.26.option.a: "Bien hecho, supongo"
 
 POD_education_events.27.t: "Una Educación: Vástago Indigno"
 POD_education_events.27.desc: "Las pruebas han terminado y, bueno, este no lo logró. Oh, bueno, hay muchos más mortales para probar de todos modos. Al menos fue divertido de ver hasta su conclusión inevitable. Presenciar a neonatos indefensos siendo atrapados en la red de intrigas que es tu corte siempre te da una profunda sensación de satisfacción."
 POD_education_events.27.option.a: "El mejor entretenimiento, realmente"
 
 podintroductions.132.t: "Tu Historia Hasta Ahora"
 podintroductions.132.desc: "Lady Esclarmonde, eres reconocida como la líder de la resistencia occitana a los franceses desde el inicio de la Cruzada Albigense... No es que te importe tanto la propia Occitania, pero es una farsa útil para mantener ante el ojo público.\nAún más por una de tus habilidades únicas. Usando Presencia de la manera que te enseñó tu difunto [Glossary('Sire','game_concept_Sire_desc')], eres capaz de hacer que cualquier hombre se pierda en un cuento de hadas donde él es el caballero y tú eres la princesa. A partir de ahí, obviamente, la amable princesa puede dirigir a sus valientes caballeros a matar 'monstruos' para protegerla..."
 podintroductions.132.a: "Todos representamos un papel"
 esclarmonde_intro_tooltip: "Como Esclarmonde, tienes un [character_interaction|E] especial disponible para hombres en tu reino para hechizarlos. Cuesta piedad enactarlo."
 
 POD_esclarmonde_interaction: "Faydits de Esclarmonde"
 POD_esclarmonde_interaction_desc: "¡Valiente Caballero, ayúdame en mi momento de necesidad!"
 
 faydit_modifier: "Faydit de Esclarmonde"
 faydit_modifier_desc: "Esta pobre alma está perdida en una ilusión donde él es el caballero de la hermosa princesa Esclarmonde"
 
 podintroductions.133.t: "Tu Historia Hasta Ahora"
 podintroductions.133.desc: "Melinda la Intrépida, tu [Glossary('Sire','game_concept_Sire_desc')], Helena, te abandonó después de aburrirse de atormentarte. Ahora te quedas para valerte por ti misma, pero has aprendido una cosa importante durante tu tiempo bajo la 'tutela' de Helena: eres tú contra ellos.\nAquellos que besen tus pies y demuestren ser útiles podrían vivir. Los demás... te divertirás mucho lidiando con los demás.\nSi este mundo tiene que ser sumido en el horror eterno para que tú seas poderosa, respetada e independiente, que así sea.\nReinarás en el Infierno, y malditos sean los Cielos."
 podintroductions.133.a: "Ahora lo entiendo, 'madre'"
 melinda_intro_tooltip: "Como Melinda Galbraith tienes una decisión única para asolar tu capital en busca de recompensas rápidas, siempre que tu capital no esté ya completamente arruinada."
 
 melinda_decision: "¡Alboroto!"
 melinda_decision_tooltip: "Es hora de desahogarse"
 melinda_decision_desc: "Hay muchos mortales indefensos en tu capital. Podría ser el momento de mostrarles que el fin se acerca mucho más rápido de lo que piensan..."
 melinda_decision_confirm: "...y el Infierno la siguió"
 
 podintroductions.134.t: "Tu Historia Hasta Ahora"
 podintroductions.134.desc: "Rafael el Astuto, seamos honestos, no tienes idea de qué demonios está pasando. Apenas salvaste tu no-muerte engañando a tu [Glossary('Sire','game_concept_Sire_desc')] para que pensara que eres un artista de las maquinaciones y el engaño, pero aún no tienes una idea real de cómo funciona toda esta sociedad vampírica.\nPor las pocas cosas que has reunido, sería mejor que aprendieras muy rápido, porque los vampiros despistados se convierten en vampiros muertos la mayoría de las veces. Solo tienes una ventaja de la que hablar: tu ingenio. Eres capaz de convencer a casi cualquier persona de que acepte casi cualquier cosa. Esta podría ser tu salvavidas..."
 podintroductions.134.a: "¡Puedo lograrlo!"
 rafael_intro_tooltip: "Como Rafael, tienes un [character_interaction|E] especial que cuesta prestigio para engañar a otros gobernantes con tierras y hacer que te den algo. La recompensa específica depende de sus rasgos."
 
 POD_rafael_interaction: "¡Mi Mejor Oferta!"
 POD_rafael_interaction_desc: "Propón una oferta extraordinaria a este gobernante"

 PODcanon_chars.24.t: "Un Engaño Encantador"
 PODcanon_chars.24.desc: "Tienes a este enganchado en tu discurso de venta perfecto, Rafael. Ahora es momento de ir por el kill, ¿qué pedirás? Tendrá que tener en cuenta el ángulo que estás trabajando."
 PODcanon_chars.24.a: "¡Puedes confiar en mí!"
 rafael_trusting_tooltip: "Esta opción está disponible porque tu objetivo tiene el rasgo confiado o gregario"
 PODcanon_chars.24.b: "...¡y entonces mi [Glossary('Sire','game_concept_Sire_desc')] me abandonó!"
 rafael_compassionate_tooltip: "Esta opción está disponible porque tu objetivo tiene el rasgo compasivo"
 PODcanon_chars.24.c: "Esto es fascinante, ¡seguro que me convertiré!"
 rafael_zealous_tooltip: "Esta opción está disponible porque tu objetivo tiene el rasgo ferviente"
 PODcanon_chars.24.d: "Cosas interesantes, ¡déjame tomar notas!"
 rafael_diligent_tooltip: "Esta opción está disponible porque tu objetivo tiene el rasgo diligente o paciente"
 PODcanon_chars.24.e: "¡Maldición, nunca me habría atrevido!"
 rafael_brave_tooltip: "Esta opción está disponible porque tu objetivo tiene el rasgo valiente o terco"
 PODcanon_chars.24.f: "¡Eres simplemente el mejor!"
 rafael_ambitious_tooltip: "Esta opción está disponible porque tu objetivo tiene el rasgo ambicioso o arrogante"
 PODcanon_chars.24.g: "¡La no-muerte es genial!"
 rafael_content_tooltip: "Esta opción está disponible porque tu objetivo tiene el rasgo contento o humilde"
 PODcanon_chars.24.h: "¡Están totalmente ahí afuera para atraparnos!"
 rafael_deceitful_tooltip: "Esta opción está disponible porque tu objetivo tiene el rasgo engañoso o paranoico"
 PODcanon_chars.24.i: "...eso fue gráfico"
 rafael_cynical_tooltip: "Esta opción está disponible porque tu objetivo tiene el rasgo cínico o insensible"
 PODcanon_chars.24.j: "¡Buena charla!"
 rafael_end_tooltip: "No tienes otro ángulo para atacar a este objetivo"
       
 podintroductions.135.t: "Tu Historia Hasta Ahora"
 podintroductions.135.desc: "Rosamund la Bella, aquí estás en Magdeburgo casi secuestrada por el metusalah exiliado Alejandro. El que fuera gobernante de Francia dice que te ama, pero sabes que su corazón frío una noche se enfurecerá lo suficiente como para destruirte, como hizo con sus anteriores 'almas gemelas'. Necesitas aliados.\n¿Y quién mejor que el audaz Jürgen von Verden? Lo conoces desde hace un tiempo y ambos se tienen mucho cariño. Pero tu amor no podrá crecer realmente, incluso si te casaras con él, hasta que Alejandro sea eliminado de una vez por todas. Te han enseñado bien y no eres una damisela indefensa, Rosamund, sabes lo que hay que hacer."
 podintroductions.135.a: "El amor triunfará"
 rosamund_intro_tooltip: "Como Rosamund, tienes una decisión especial disponible mientras sigas siendo almas gemelas con Jürgen"
 podintroductions.135.b: "Hay otro camino a seguir"
 rosamund_landless_tt: "Comenzarás como un aventurero sin tierras, más precisamente como un [ashen_ambassador|E] de Jürgen von Verden"
 
 love_triumph_modifier: "Amor Triunfante"
 love_triumph_modifier_desc: "...y vivieron felices para siempre. Probablemente."
  
 rosamund_decision: "Triángulo Amoroso"
 rosamund_decision_tooltip: "Es hora de simplificar tu vida amorosa"
 rosamund_decision_desc: "Alejandro es un maniático del control opresivo que podría matarte en un ataque de ira en cualquier momento. Necesitas lidiar con él."
 rosamund_decision_confirm: "Final feliz"
 rosamund_custom_decision: "[GetScriptedCharacterByHistoryID('505082').GetFirstName] debe estar muerto"
 rosamund_custom_decisionb: "Aún debes ser almas gemelas con [GetScriptedCharacterByHistoryID('505086').GetFirstName]"

 podintroductions.136.t: "Tu Historia Hasta Ahora"
 podintroductions.136.desc: "Karl el Sabio, tu iniciativa para preservar las viejas costumbres ha sido hasta ahora un éxito. El Estado Libre sigue siendo joven, pero se vuelve más seguro cada noche... pero hay problemas en el horizonte.\nTus dos principales aliados, Eirik Diente Largo y Ulfsdottir, han llegado a un punto de quiebre y están a la yugular. Eirik es un guerrero poderoso, pero su total falta de consideración por los mortales altera a la Valquiria. En respuesta, la tranquila aceptación de Ulfsdottir del lento final de vuestras costumbres enfurece a Diente Largo.\nSi quieres que el Estado Libre perdure, debes elegir un bando... y probablemente lidiar con el que se sienta agraviado."
 podintroductions.136.a: "Eres un monstruo, Eirik, y debes ser detenido"
 podintroductions.136.b: "¡Debemos luchar por nuestra causa, Ulfsdottir!"
 podintroductions.136.c: "¡Ambos sois idiotas!"
 
 podintroductions.137.t: "Tu Historia Hasta Ahora"
 podintroductions.137.desc: "Bjorn el Poderoso, una vez más te arrastran a una guerra perdida. Mientras navegabas hacia Vinland, naufragaste en Escocia y eres el único superviviente de tu tripulación inicial. Los vampiros locales, en su mayoría refugiados del férreo control de Mitras sobre las islas, fueron muy acogedores, tanto que te sientes en deuda con ellos.\nY no eres el tipo de hombre que dejaría atrás a un amigo, así que aquí estás, liderando el esfuerzo de guerra contra el inevitable ataque de Mitras a esta tierra. Necesitarás una nueva tripulación para una tarea tan desalentadora y solo los mejores y más leales servirán."
 podintroductions.137.a: "Nueva tierra, mismos problemas"
 bjorn_intro_tooltip: "Como Bjorn, tienes un [character_interaction|E] especial para convertir a alguien en miembro de tu tripulación.\nSolo 5 vampiros sin tierras pueden ser miembros de la tripulación en un momento dado, y deben agradarte ya para aceptar."
  
 bjorn_crew_modifier: "Tripulante de Bjorn"
 bjorn_crew_modifier_desc: "Un miembro de la tripulación de Bjorn Garinson, una posición prestigiosa para guerreros habilidosos."
 
 POD_bjorn_crew_opinion: "Tripulante de Bjorn"
 
 POD_bjorn_interaction: "Invitar a tu tripulación"
 POD_bjorn_interaction_desc: "Este personaje será uno de tus 5 tripulantes"
 POD_bjorn_crew_interaction_limit: "Este personaje debe tener una opinión positiva de ti y no puedes tener más de 5 tripulantes"
 POD_bjorn_opinion_limit: "Este personaje debe tener una opinión positiva de ti"

 podintroductions.138.t: "Tu Historia Hasta Ahora"
 podintroductions.138.desc: "Robin el Intrépido, el futuro de tu rebelión parece sombrío. El odiado tirano, Mitras, ha ganado la última batalla campal entre vosotros hace varios años, reduciendo severamente tu influencia sobre las Islas Británicas. Aún así, hay esperanza, ya que todavía no ha ido a matar, quizás ocupado con otros asuntos o simplemente aburrido como tienden a ser los vampiros muy viejos. Esta podría ser tu oportunidad.\nPrepárate rápidamente en caso de otro ataque, planta la semilla de la rebelión en aquellos que estén dispuestos a escuchar y acaba con Mitras de una vez por todas. Solo entonces las Islas Británicas serán verdaderamente libres."
 podintroductions.138.a: "Estoy acorralado, pero no derrotado"
 leeland_intro_tooltip: "Como Robin, tienes un [character_interaction|E] especial para plantar la semilla de la rebelión en jóvenes vampiros, sembrando así discordia en otros reinos."
 
 seed_of_rebellion_leeland_modifier: "Semilla de Rebelión"
 seed_of_rebellion_leeland_modifier_desc: "Este personaje ha sido llevado al borde de la rebelión por un forajido legendario"
 
 POD_leeland_interaction: "Semilla de Rebelión"
 POD_leeland_interaction_desc: "Planta la semilla de la rebelión en la mente de este joven vampiro"

 podintroductions.139.t: "Tu Historia Hasta Ahora"
 podintroductions.139.desc: "Lady Veronique, has regresado a tu ciudad natal después de tu aventura parisina. Ayudaste en el golpe contra Alejandro, el tiránico Príncipe de Francia, y ganaste algo de reconocimiento en el proceso. Lamentablemente, también perdiste muchos sirvientes de confianza a manos del engañoso Jean Baptiste de Montrond. Puede que tengas que 'devolvérselo' una noche.\nMás allá de esta creciente rivalidad, tu posición es mayormente segura. Ya estás trabajando duro para reconstruir tu séquito de amigos mortales, una rareza entre los $pod_cainites$, pero que te da fuerza. Usa tu confianza en la humanidad para tu ventaja y aquellos que te subestimen pronto aprenderán que puedes ser tan hábil en cualquier campo de especialización como ellos."
 podintroductions.139.a: "Estoy jugando su juego a mi manera"
 veronique_intro_tooltip: "Como Veronique, tienes un evento especial durante la actividad Inspeccionar Capital mientras permanezcas en la fe de la Vía Humanitatis"
 
 POD_survey_events.150.t: "La Inspección: El Séquito de Veronique"
 POD_survey_events.150.desc: "Eres uno de los pocos $pod_cainites$ que realmente cultiva algunas relaciones con los mortales y no solo los considera como ganado o peones en un juego mayor. Como tal, tienes algunos amigos en la ciudad que están dispuestos a ayudarte en muchos asuntos diferentes. Como con todos los contactos, debes visitarlos de vez en cuando para encargarte de cualquier problema relevante que puedan tener, pero siempre lo encuentras una experiencia gratificante. Los mortales están mucho más en sintonía con el mundo cambiante de lo que cualquier $pod_cainite$ podría soñar."
 POD_survey_events.150.option.a: "¡Un placer verte de nuevo!"
 veronique_survey_tooltip: "Este resultado especial de la inspección siempre puede ocurrirle a Veronique mientras permanezca en la fe de la Vía Humanitatis."
 
 podintroductions.140.t: "Tu Historia Hasta Ahora"
 podintroductions.140.desc: "Menele el Grande de Esparta, has perseguido a la traicionera Helena durante siglos ahora y parece no haber fin para este conflicto. Obviamente, debe ser castigada por haber orquestado la destrucción de tu amada Cartago, pero también lamentas la decadencia de tu $pod_clan$. Podrías hacer mucho para ayudar a que se recupere... si no estuvieras tan preocupado por la caza de tu némesis.\nTu legendaria rivalidad debe terminar de una forma u otra, entonces aún podría ser momento de sanar tu roto $pod_clan$."
 podintroductions.140.a: "Terminando la enemistad eterna..."
 menele_intro_tooltip: "Como Menele, tienes una decisión especial donde debes encargarte del problema de Helena. Si lo logras, entonces desbloqueas un [character_interaction|E] para enseñar a otros Brujah sobre tu glorioso $pod_clan$."
 
 menele_decision: "Esparta contra Troya"
 menele_decision_tooltip: "Es hora de terminar con esta tontería"
 menele_decision_desc: "Helena ya ha tomado demasiado de tu tiempo. Lidia con ella, luego asuntos más apremiantes requieren tu atención."
 menele_decision_confirm: "¡Finalmente!"
 menele_custom_decision: "[GetScriptedCharacterByHistoryID('790179').GetFirstName] debe estar muerta, o ya no ser tu rival"
 menele_decision_effect_tooltip: "Desbloquearás un nuevo [character_interaction|E] para enseñar a los Brujah sobre la gloria de tu $pod_clan$"

 PODcanon_chars.25.t: "Nuevos Comienzos"
 PODcanon_chars.25.desc: "Finalmente, este desagradable asunto con Helena ha quedado atrás. Ha llevado mucho tiempo, pero finalmente te diste cuenta de que su mayor traición no fue ayudar a los romanos contra Cartago, sino mantenerte distraído en el momento en que tu $pod_clan$ más te necesitaba.\nLos Brujah yacen dispersos, abrumados por la ira y la tristeza, un pálido reflejo de sus gloriosas noches antiguas. No tiene que ser la única manera de avanzar. Eres una leyenda, Menele, e incluso el miembro más terco de tu $pod_clan$ escuchará si hablas. Tienes que ser la luz guía para ellos en el futuro, porque nadie más puede."
 PODcanon_chars.25.a: "Somos el legado de Cartago"
 menele_victory_tooltip: "Desbloquearás un nuevo [character_interaction|E] para enseñar a otros Brujah sobre la gloria de tu $pod_clan$."
 
 POD_menele_teachings_interaction: "Enseñanzas de Cartago"
 POD_menele_teachings_interaction_desc: "Recuerda a otros Brujah su glorioso pasado y su brillante futuro."

 PODcanon_chars.26.t: "Una Lección"
 PODcanon_chars.26.desc: "Como quizás el Brujah más respetado aún activo en estas noches, tienes suficiente influencia para hacer que cualquier miembro de tu $pod_clan$ se siente y te escuche si te lo propones.\nFuera de las preparaciones, solo tienes que pensar en qué exactamente le enseñarás a este. Si el conflicto con Helena te enseñó algo, es que no tienes todo el tiempo del mundo para una sola persona."
 PODcanon_chars.26.a: "Solo hay una forma de dominar a tu Bestia"
 PODcanon_chars.26.b: "Hablemos de Cartago"
 PODcanon_chars.26.c: "El autocontrol es la clave"

 ANTI_HEDEON_PACT: "Pacto Anti Hedeon" 

 podintroductions.141.t: "Tu Historia Hasta Ahora"
 podintroductions.141.desc: "Lord Yitzhak, recientemente has logrado expandir considerablemente tu influencia sobre Polonia gracias a los problemas de la Princesa Razkoljna con una incursión de los Ventrue. Pero no eres el único que se beneficia de este evento. Hedeon Yaroslavich, un monstruo vicioso incluso para su ya bastante sádico $pod_clan$, también ha hecho crecer bastante su dominio. Su sombra oscura ahora se acerca cada vez más para envolver Polonia.\nPodría haber una salida. No confías en Razkoljna, pero sabes que es un mal mucho menor que Hedeon, y ella probablemente siente lo mismo sobre ti. Negociar una tregua entre vosotros dos podría permitiros centraros en Hedeon primero. Después de eso, obviamente, todo vale..."
 podintroductions.141.a: "Princesa Razkoljna, hablemos"
 podintroductions.141.b: "¡Ella no es mejor que Hedeon!"

 podintroductions.142.t: "Tu Historia Hasta Ahora"
 podintroductions.142.desc: "Lord Hektor, Nueva Lacedemonia está segura gracias a tu fuerte liderazgo. El desmoronado Imperio Bizantino que rodea tu dominio podría incluso presentar oportunidades de expansión si así lo deseas. Aunque también hay problemas en casa que resolver.\nGobiernas con el asesoramiento de un Senado, en la tradición cartaginesa, pero esta augusta institución está dividida. La mayoría de los senadores quieren que sigas el camino de una Cartago idealizada y pura. Una minoría creciente quiere un enfoque más pragmático, incluyendo los elementos más desagradables de la antigua Cartago. Tu apoyo a una u otra facción allanará el camino para el enfoque de tu reino en los próximos años."
 podintroductions.142.a: "¡La sesión está abierta!"
 hektor_intro_tooltip: "Como Hektor, tienes una decisión especial para convocar al Senado y elegir tu enfoque para los próximos años.\nPuedes elegir un enfoque más fuerte si Antíoco y Maureen, los líderes de las facciones, siguen vivos."

 hektor_decision: "Sesión del Senado"
 hektor_decision_tooltip: "Necesito el consejo del Senado"
 hektor_decision_desc: "¿A qué facción favorecerás para el próximo mandato del Senado?"
 hektor_decision_confirm: "¡Orden en la asamblea!"
 hektor_decision_effect_tooltip: "Elegirás una política para los próximos años."

 PODcanon_chars.27.t: "El Senado"
 PODcanon_chars.27.desc: "Esta nueva sesión de tu renacido Senado Cartaginés es igual que siempre, Hektor. Los idealistas te critican por 'traicionar' su querida utopía, mientras que los pragmáticos te instan a considerar por qué Cartago era tan fuerte, sin importar los costes. Afortunadamente, la última palabra es solo tuya."
 PODcanon_chars.27.a: "¡Luchamos por un ideal!"
 PODcanon_chars.27.b: "Cartago es ante todo una idea."
 PODcanon_chars.27.c: "Un enfoque equilibrado es la única manera."
 PODcanon_chars.27.d: "¡Hay que hacer sacrificios!"
 PODcanon_chars.27.e: "¡Los lobos están a nuestras puertas!"
 antiochus_alive_tooltip: "Esta opción está disponible mientras Antíoco esté vivo"
 maureen_alive_tooltip: "Esta opción está disponible mientras Maureen esté viva"

 full_idealist_support_modifier: "Apoyo Total de los Idealistas"
 full_idealist_support_modifier_desc: "Cartago era una utopía pura y perfecta. Que nadie discuta esta verdad."
 
 idealist_support_modifier: "Apoyo de los Idealistas"
 idealist_support_modifier_desc: "Cartago es una idea por la que vale la pena luchar, a pesar de cualquier defecto que pueda tener."
 
 pragmatist_support_modifier: "Apoyo de los Pragmáticos"
 pragmatist_support_modifier_desc: "No vivimos en un sueño. Hay que hacer sacrificios."
 
 full_pragmatist_support_modifier: "Apoyo Total de los Pragmáticos"
 full_pragmatist_support_modifier_desc: "El Sueño de Cartago no era nada sin su Pesadilla."
 
 podintroductions.143.t: "Tu Historia Hasta Ahora"
 podintroductions.143.desc: "Lady Ecaterina, hasta ahora has podido hacer crecer tu influencia en la región en gran parte gracias a tu talentoso vástago, Christof Romuald. Lamentablemente, tu imprudente descendencia ha desaparecido después de lo que parece ser una brutal batalla en el castillo de Vysehrad. ¡El loco intentó asaltar la fortaleza por su cuenta, destrozando a todos los horrores Tzimisce que la custodiaban!\nAún así, Christof será Christof y sabes que, bien guiado, puede ser muy útil. Podrías organizar un equipo de búsqueda en las ruinas de Vysehrad para encontrarlo y traerlo de vuelta. ¿O quizás su utilidad ha llegado a su fin?"
 podintroductions.143.a: "Tengo otra misión para ti, Christof"
 podintroductions.143.b: "Parece que su protección de guion ha llegado a su fin"

 podintroductions.144.t: "Tu Historia Hasta Ahora"
 podintroductions.144.desc: "Lord Augustus, has sido rápido en aprovechar las oportunidades que te ha brindado el $pod_Embrace$. El imperio mercantil (y nigromántico) de tu familia está creciendo y esos indolentes Cappadocios no sospechan nada. Aún así, eres solo un hombre y debes centrar primero tus esfuerzos en finalmente arrebatar el control de la propia Venecia.\nPara los demás asuntos, puedes confiar en tus tres lugartenientes, Claudius, Ambrogino e Ignazio. Cada uno tiene su propia especialidad y todos ellos buscan tu aprobación. Si juegas bien tus cartas, puedes mantenerlos útiles y ocupados peleándose entre ellos (y no conspirando contra ti) durante mucho tiempo."
 podintroductions.144.a: "Nuestra ascensión comienza"
 augustus_intro_tooltip: "Como Augustus, tienes una decisión especial donde puedes favorecer a uno de tus lugartenientes más que a los demás, siempre que estén vivos, por supuesto."

 augustus_decision: "Tu Mano Derecha"
 augustus_decision_tooltip: "Hijos peleones pero útiles"
 augustus_decision_desc: "¿A qué lugarteniente favorecerás en los próximos años?"
 augustus_decision_confirm: "Déjame pensar..."
 augustus_decision_effect_tooltip: "Elegirás a qué lugarteniente favorecer en los próximos años."
 augustus_custom_decision: "Al menos uno de [GetScriptedCharacterByHistoryID('790141').GetFirstName], [GetScriptedCharacterByHistoryID('790140').GetFirstName] y [GetScriptedCharacterByHistoryID('790144').GetFirstName] debe estar vivo"

 claudius_support_modifier: "Apoyo de Claudius"
 claudius_support_modifier_desc: "Claudius es un bastardo maquinador y lleno de intrigas. Pero es tu bastardo maquinador y lleno de intrigas."
 
 ignazio_support_modifier: "Apoyo de Ignazio"
 ignazio_support_modifier_desc: "Ignazio no es, con diferencia, el Giovanni más brillante, pero su fuerte brazo armado es muy útil."
 
 ambrogino_support_modifier: "Apoyo de Ambrogino"
 ambrogino_support_modifier_desc: "Ambrogino es demasiado ambicioso para su propio bien. Mejor mantenerlo cerca y satisfecho."
 
 PODcanon_chars.28.t: "Los Lugartenientes"
 PODcanon_chars.28.desc: "Como Patriarca de la familia, tu favor es un recurso valioso en sí mismo. Tus tres principales agentes siempre buscan complacerte y superar a sus competidores. Este pequeño juego también tiene el beneficio de mantenerlos divididos y ocupados conspirando entre ellos y no contra ti. Un verdadero beneficio para todos.\nAl final, sin embargo, la elección de en quién confiar y a quién menospreciar es solo tuya."
 PODcanon_chars.28.a: "Claudius es mi hijo favorito."
 PODcanon_chars.28.b: "Ambrogino es el mejor de nosotros."
 PODcanon_chars.28.c: "Los métodos simples de Ignazio son útiles."
 PODcanon_chars.28.d: "Nadie ha ganado mi favor esta vez"
 claudius_alive_tooltip: "Esta opción está disponible mientras Claudius esté vivo"
 ambrogino_alive_tooltip: "Esta opción está disponible mientras Ambrogino esté vivo"
 ignazio_alive_tooltip: "Esta opción está disponible mientras Ignazio esté vivo"

 podintroductions.145.t: "Tu Historia Hasta Ahora"
 podintroductions.145.desc: "Lord Ambrogino, estás destinado a la grandeza. A pesar de ser un mero bastardo de la familia Giovanni, ya has logrado mucho y sabes más sobre tu nueva condición vampírica que el resto de la familia, incluido Augustus. Aún así, esto es solo el comienzo, ya que tu cabeza da vueltas con las posibilidades que tienes por delante.\nNecesitas más textos ocultos, más profecías perdidas, más pergaminos crípticos. Hay una verdad que encontrar en algún lugar y esa verdad puede llevar a la deidad, estás seguro de ello. El viaje será largo, pero la recompensa... la recompensa será tu sueño más salvaje, ¡no, tu destino!, hecho realidad."
 podintroductions.145.a: "Encontraré la clave"
 ambrogino_intro_tooltip: "Como Ambrogino, reunir Fragmentos del Códice de Sargón es mucho más rápido."

 ambrogino_sargon_codex_modifier: "El Destino de Ambrogino"
 ambrogino_sargon_codex_modifier_desc: "¡El Códice de Sargón te mostró mucho más de lo que jamás imaginaste! La deidad está más cerca que nunca..."
 pod1230objectives.49.c: "Sé cómo manejarlo..."
 sargon_ambrogino_tooltip: "Esta opción solo está disponible para Ambrogino Giovanni"

 podintroductions.146.t: "Tu Historia Hasta Ahora"
 podintroductions.146.desc: "Lord Claudius, ese bastardo maquinador y conspirador, Ambrogino, ha ido demasiado lejos esta vez. Has estado preparando durante mucho tiempo a tu propia tataranieta, Lucretia, para una posición prestigiosa como una de tus childer, pero ese ladrón codicioso de alguna manera convenció a tu propio padre Augustus de regalar a Lucretia. ¡Esta es la gota que colma el vaso!\nEres el heredero de Augustus, tanto en vida como en no-muerte. Ambrogino no es más que un advenedizo hijo de una sirvienta que se cree demasiado importante. Es hora de deshacerse de él de una vez por todas... y de Lucretia también, ya que ahora ha sido contaminada por la sangre del bastardo. Solo entonces podrás asumir tu legítimo lugar como la mano derecha de Augustus."
 podintroductions.146.a: "¡Se arrepentirá de este plan!"
 claudius_intro_tooltip: "Como Claudius, tienes una decisión especial para deshacerte de Ambrogino y Lucretia por una recompensa"

 rightful_giovanni_heir_modifier: "Legítimo Heredero de los Giovanni"
 rightful_giovanni_heir_modifier_desc: "Nadie puede negar que eres el verdadero heredero del legado de tu padre ahora."
 
 claudius_decision: "Heredero de los Giovanni"
 claudius_decision_tooltip: "Tú, y nadie más, eres el heredero de Augustus"
 claudius_decision_desc: "Deshacerse de ese molesto Ambrogino y su childer favorita, ¡que te robó!, sería una poderosa advertencia para cualquier posible rival"
 claudius_decision_confirm: "¡La justicia triunfa!"
 claudius_custom_decision: "Tanto [GetScriptedCharacterByHistoryID('790140').GetFirstName] como [GetScriptedCharacterByHistoryID('790161').GetFirstName] deben estar muertos"
 
 weak_falsinar_modifier: "Ayuda Débil de Falsinar"
 weak_falsinar_modifier_desc: "Tu fiel Falsinar aún hace su mejor esfuerzo desde el inframundo para ayudarte."
 
 podintroductions.147.t: "Tu Historia Hasta Ahora"
 podintroductions.147.desc: "Lord Markus Musa, tu fama tanto en tu familia como en tu $pod_clan$ está creciendo rápidamente. Te has demostrado más que capaz al frustrar el loco plan de Lázaro en Egipto. El costo fue alto, sin embargo, y perdiste a tus dos sirvientes de confianza en la batalla. Uno de ellos, Falsinar, ha demostrado ser un alma bastante voluntariosa, ya que incluso desde el Inframundo, todavía te ayuda lo mejor que puede.\nFalsinar sigue siendo un wraith débil y joven, pero eres un nigromante hábil y, como tal, has identificado dos posibilidades para ayudar a tu amigo espectral a manifestarse más fácilmente en tu mundo. Ambas oportunidades no serán fáciles de lograr, pero tú y Falsinar tenéis todo el tiempo del mundo de todos modos."
 podintroductions.147.a: "Nigromante y wraith, un dúo perfecto"
 markus_intro_tooltip: "Como Markus Musa, tienes dos decisiones especiales que pueden mejorar a Falsinar si se logran."

 markus_nikita_decision: "El Nexo de la Muerte"
 markus_nikita_decision_tooltip: "Una clave está en Croacia"
 markus_nikita_decision_desc: "Nikita de Sredetz, el Arzobispo de Nod, parece atraer poderosas energías nigrománticas hacia él. Esta es una oportunidad para fortalecer a Falsinar."
 markus_nikita_decision_confirm: "Otra alma atada a mí"
 markus_nikita_custom_decision: "[GetScriptedCharacterByHistoryID('790261').GetFirstName] debe estar muerto"
 markus_nikita_decision_effect_tooltip: "Falsinar se volverá más fuerte"

 medium_falsinar_modifier: "Ayuda de Falsinar"
 medium_falsinar_modifier_desc: "Tu fiel Falsinar aún hace su mejor esfuerzo desde el inframundo para ayudarte."
 
 high_falsinar_modifier: "Ayuda Fuerte de Falsinar"
 high_falsinar_modifier_desc: "Tu fiel Falsinar aún hace su mejor esfuerzo desde el inframundo para ayudarte."
 
 markus_egypt_decision: "De vuelta a Egipto"
 markus_egypt_decision_tooltip: "Algunos malos recuerdos de este lugar..."
 markus_egypt_decision_desc: "Falsinar murió protegiéndote de Lázaro en Egipto. Nunca pudiste recuperar sus restos. Hacerlo ciertamente te ayudaría a fortalecer su wraith."
 markus_egypt_decision_confirm: "Un entierro adecuado"
 markus_egypt_decision_effect_tooltip: "Falsinar se volverá más fuerte"

 podintroductions.148.t: "Tu Historia Hasta Ahora"
 podintroductions.148.desc: "Lord Japhet, tu papel como líder informal del $pod_clan$ Cappadocio es ingrato. Tus hermanos son conocidos por ser bastante reclusos y en su mayoría no prestan atención a tu augusta responsabilidad. Peor aún, tu propio [Glossary('Sire','game_concept_Sire_desc')], el propio Cappadocius, a menudo se pierde en sus delirios de grandeza o ataques de locura. Pero como fundador del $pod_clan$, su palabra es ley y tú no eres nada si no eres cumplidor.\nSu última fantasía ha visto a los venecianos Giovanni Abrazados a la Sangre, algo con lo que no estás de acuerdo. No tienes más remedio que continuar, limitando los peores excesos de tu [Glossary('Sire','game_concept_Sire_desc')] mientras preservas la integridad del $pod_clan$ Cappadocio. La eternidad nunca se ha sentido tan larga."
 podintroductions.148.a: "Mi trabajo nunca terminará"
 japhet_intro_tooltip: "Como Japhet, tienes una pequeña decisión especial para controlar a Cappadocius. Pero cuidado con sus excentricidades."

 japhet_decision: "Pecados del Padre"
 japhet_decision_tooltip: "Esperemos que esté de buen humor..."
 japhet_decision_desc: "Eres el guardián del Erciyes, el hogar del propio Cappadocius. Un gran honor... y una gran carga, ya que el [Glossary('Antediluvian','game_concept_antediluvian_desc')] a menudo es difícil de entender."
 japhet_decision_confirm: "Sin vuelta atrás"
 japhet_decision_effect_tooltip: "Vigilarás al propio Cappadocius, con la esperanza de encontrarlo bien... y no demasiado perdido en su propio mundo fantasioso."

 PODcanon_chars.29.t: "Cappadocius: El Plan"
 PODcanon_chars.29.desc: "Aquí vamos otra vez... tu augusto [Glossary('Sire','game_concept_Sire_desc')], el venerable Cappadocius, está una vez más trabajando en su alucinado plan para [Glossary('Diablerize','game_concept_diablerie_desc')] a Dios. Un converso ferviente al cristianismo, siempre ha estado fascinado por el 'Dios Único' a su propia manera retorcida. Estás bastante seguro de que el $pod_Embrace$ de Augustus Giovanni también está relacionado con ello.\nEn cualquier caso, habla extensamente de su loco plan, esperando tu aprobación entusiasta, por supuesto. No hay manera de que puedas razonar con él, pero al menos preferirías no ser arrastrado demasiado profundo en esta demente búsqueda."
 PODcanon_chars.29.a: "Todavía podría haber algunos defectos."
 PODcanon_chars.29.b: "¡Qué plan perfecto, [Glossary('Sire','game_concept_Sire_desc')]!"
 PODcanon_chars.29.c: "*Suspiro* Sí, esto es brillante"

 PODcanon_chars.30.t: "Cappadocius: El Mentor"
 PODcanon_chars.30.desc: "Tu estimado [Glossary('Sire','game_concept_Sire_desc')] está de buen y tranquilo humor esta noche, trayéndote recuerdos de tiempos mejores antes de que su mente alucinada comenzara a divagar. Está contento de verte y estáis hablando de las muchas maravillas y horrores que ambos visteis. Es en estos tiempos simples que recuerdas a la gran persona que fue Cappadocius y que, con suerte, aún puede ser.\nSales de su habitación más decidido a continuar tu trabajo y más sabio de lo que entraste."
 PODcanon_chars.30.a: "¿Qué hay de Sargón, [Glossary('Sire','game_concept_Sire_desc')]?"
 PODcanon_chars.30.b: "Ojalá hubiera conocido a Enoc yo mismo..."
 PODcanon_chars.30.c: "¿Podemos hablar de Ashur?"
 
 PODcanon_chars.31.t: "Cappadocius: El Sacerdote"
 PODcanon_chars.31.desc: "Cappadocius es un creyente ferviente en su, ciertamente retorcida, versión del cristianismo. Como tal, no es raro que quiera asistir a misa... o servir como el propio sacerdote, a pesar de la obvia ironía de tal situación.\nEstás acostumbrado a lidiar con esta fantasía suya, pero siempre es difícil evitar la atención no deseada, ya que tu [Glossary('Sire','game_concept_Sire_desc')] no es precisamente cuidadoso con su condición vampírica."
 PODcanon_chars.31.a: "Participaré en la comunión"
 PODcanon_chars.31.b: "Rezar será suficiente"
 PODcanon_chars.31.c: "Primero la seguridad"
 
 podintroductions.149.t: "Tu Historia Hasta Ahora"
 podintroductions.149.desc: "Lord Bela, finalmente has encontrado tu propósito en la vida. Las mezquinas cadenas de la moral cristiana no son para ti, ¡estás destinado a mucho más! Kupala, esa entidad benevolente y poderosa, busca un avatar en la Tierra y ¿quién mejor que tú?\nObviamente, habrá que hacer algunos sacrificios... o muchos. Pero ¿a quién le importa una persona, una ciudad o incluso una nación entera frente a la apoteosis? Tú ciertamente no. Pronto desgarrarás el frágil velo de la cordura de este mundo condenado, entonces todo serán cenizas, sangre y fuego.\nY en este renacimiento cataclísmico, te alzarás como el único superviviente."
 podintroductions.149.a: "Los últimos suspiros de un mundo moribundo..."
 bela_intro_tooltip: "Como Bela Rusenko, tienes una decisión especial para sacrificar tus condados por Kupala. Si lo haces lo suficiente, ¿quién sabe lo que podría pasar?"

 bela_decision: "Kupala Ascendiendo"
 bela_decision_tooltip: "¡Vamos a darles infierno!"
 bela_decision_desc: "Kupala requiere sacrificios para manifestarse en este mundo miserable. Estás más que feliz de proporcionarlos."
 bela_decision_confirm: "El infierno está ascendiendo"
 bela_decision_effect_tooltip: "Está hecho..."
 
 kupala_rising_weakest: "Débil Influencia de Kupala"
 kupala_rising_weakest_desc: "El Gran Demonio ha notado tus esfuerzos..."
 kupala_rising_weak: "Influencia Débil de Kupala"
 kupala_rising_weak_desc: "El Gran Atado a la Tierra está complacido con tus continuos esfuerzos..."
 kupala_rising_medium: "Influencia Media de Kupala" 
 kupala_rising_medium_desc: "El Gran Archiduque piensa en ti como su sirviente favorito..."
 kupala_rising_strong: "Influencia Fuerte de Kupala" 
 kupala_rising_strong_desc: "El Gran Arcángel está muy cerca de ti ahora, susurrándote al oído para que hagas más..."
 kupala_avatar_modifier: "Avatar de Kupala" 
 kupala_avatar_modifier_desc: "...y el Infierno le siguió"
 
 PODcanon_chars.32.t: "Somos Uno"
 PODcanon_chars.32.desc: "Este anfitrión es interesante. Obviamente, es bastante frágil comparado con mi forma apocalíptica, pero servirá. No puedo negar los grandes esfuerzos que ha hecho para invocarme a una forma más apropiada para este mundo. Estuve lo suficientemente complacido como para devorar su alma rápidamente durante tu toma de control.\nFinalmente libre después de todos esos eones encerrado en esta maldita prisión, tengo mucho que hacer. Y a pesar de mis considerables poderes, este frágil cuerpo solo puede soportar tanto antes de romperse, así que tendré que tener cuidado. Aún así, tengo todo el tiempo del mundo gracias al idiota que me invocó.\nDespués de todo, el camino más seguro al Infierno es el gradual."
 PODcanon_chars.32.a: "Los Cielos están llorando"
 vampire_demonhood_tt: "Obtienes acceso a nuevos soldados demoníacos y a un nuevo árbol de estilo de vida infernal."
  
 silver_attacks_modifier: "Incursiones de Colmillos de Plata"
 silver_attacks_modifier_desc: "Los lupinos están inquietos en esta provincia, poniendo constantemente a prueba los límites de tu control."

 podintroductions.150.t: "Tu Historia Hasta Ahora"
 podintroductions.150.desc: "Lady Apacia, tu pueblo adoptivo está en peligro. Tu control sobre el Kanato de Sibir es desafiado por manadas de lupinos rabiosos de Colmillos de Plata, enfadados por tu presencia en lo que consideran su tierra natal. Podrías luchar contra ellos, pero sería un proceso largo y arduo y tu posición en la región es ya bastante insegura.\nSin embargo, se presenta otra solución: los [Glossary('Anda','podgloss. anda')], vampiros de la cultura mongol, están reclamando rápidamente las Estepas para sí mismos. Su líder ha enviado recientemente un mensaje pidiendo tu juramento de lealtad a su Horda a cambio de su protección contra los lupinos merodeadores. ¿Quizás una pérdida temporal de independencia vale la seguridad de tu pueblo?"
 podintroductions.150.a: "¡No necesito ninguna ayuda!"
 podintroductions.150.b: "Las Estepas se están uniendo"
 
 podintroductions.151.t: "Tu Historia Hasta Ahora"
 podintroductions.151.desc: "Lord Myka, tu astuta jugada durante el reciente tratado de paz resultó en el establecimiento de tu Orden Obertus como un estado tapón entre los Ventrue alemanes y tus compañeros de clan del Este. Esta posición es insegura, sin embargo, y aún queda mucho por hacer.\nTambién te has enterado recientemente de que Nikita de Sredetz, el Arzobispo de Nod, podría estar relacionado con uno de los secretos más celosamente guardados del $pod_clan$ Tzimisce. Tu mente erudita no puede resistir el atractivo de tal hallazgo, pero tendrás que asaltar la ciudad de Nikita para aprender más, lo que podría ser una perspectiva desalentadora. Como siempre, procura equilibrar tus intereses intelectuales con tus ambiciones más seculares. Este ha sido siempre tu propio camino hacia la grandeza."
 podintroductions.151.a: "Ni un momento que perder."
 myka_intro_tooltip: "Como Myka Vykos, tienes una decisión especial para aprender los secretos del Arzobispo de Nod. La recompensa podría ser más de lo que Myka puede manejar, sin embargo..."
 
 myka_decision: "Secretos Oscuros"
 myka_decision_tooltip: "Buscando la verdad incognoscible"
 myka_decision_desc: "Nikita de Sredetz esconde uno de los secretos más importantes del $pod_clan$ Tzimisce. Lidia con él, asalta su refugio y aprende la verdad."
 myka_decision_confirm: "¡Debo saber!"
 myka_decision_effect_tooltip: "Myka renacerá de nuevo."
 
 PODcanon_chars.33.t: "La Fea Verdad"
 PODcanon_chars.33.desc: "Toda esta fantástica búsqueda había sido solo una trampa.\nNo encontraste ninguna verdad en el refugio de Nikita, más allá de la realización de que Nikita estaba muerto mucho antes de que siquiera supieras de él y fue suplantado por un poderoso Metusalah Tzimisce. Y este Metusalah te guió aquí, ya que encontró que serías un mejor 'anfitrión' que el difunto Arzobispo.\nYa puedes ver sus tentáculos, espirituales o no, alcanzándote para fusionarte en una forma más 'apropiada' para tu unión.\nEste podría ser el final para Myka Vykos."
 PODcanon_chars.33.a: "...Todo cambia"
 PODcanon_chars.33.b: "¡Huye!"
 
 podintroductions.152.t: "Tu Historia Hasta Ahora"
 podintroductions.152.desc: "Lord Noriz, el tiempo de la decadencia indolente ha terminado. Aunque ciertamente es divertido enfrentar a tus childer entre sí en combates a muerte, no debes olvidar que una vez fuiste el amo del $pod_clan$ Tzimisce. Vladimir Rustovitch, ese usurpador cobarde, te lo quitó, pero su humillante derrota contra los Ventrue alemanes es la oportunidad que esperabas.\nDebes presionar tu legítimo reclamo como Voivoda de Voivodas y lidiar con Rustovitch de una vez por todas. Entonces tu linaje podrá recuperar el prestigio que le es debido."
 podintroductions.152.a: "Este fue tu último error, Vladimir..."
 noriz_intro_tooltip: "Como Noriz, tienes una decisión especial que se puede lograr si te conviertes en el líder del Voivodato. Mejorará tu modificador de casa inicial si se logra."
 
 house_noriz_modifier: "Casa Noriz"
 house_noriz_modifier_desc: "El verdadero Voivoda de Voivodas ha regresado. Transilvania es más temida que nunca."
 
 noriz_decision: "El Retorno del Voivoda"
 noriz_decision_tooltip: "El tiempo de Rustovitch ha terminado"
 noriz_decision_desc: "Muchos piensan que eres indolente y perdido en la decadencia. Demuéstrales que están equivocados recuperando tu título."
 noriz_decision_confirm: "Se arrodillarán de nuevo"
 noriz_custom_decision: "[GetScriptedCharacterByHistoryID('505053').GetFirstName] debe estar muerto."
 
 podintroductions.153.t: "Tu Historia Hasta Ahora"
 podintroductions.153.desc: "Lady Razkoljna, tu reciente caída en $pod_torpor$ ha visto debilitado tu control sobre Polonia. Aún así, Cracovia no ha caído, por lo que tienes una base sólida desde la que lanzar tu reconquista. \nEs especialmente importante para ti, ya que eres uno de los pocos vampiros que realmente se preocupa por el bienestar de su ciudad. No por algún sentimiento de bondad fuera de lugar, obviamente, sino desde el punto de vista pragmático de que una ciudad fuerte significa un Príncipe fuerte. Debes reconstruir rápidamente tu red de influencia en Cracovia y ayudar a su prosperidad una vez más. La ciudad debe volverse poderosa, como corresponde a una capital de tu nuevo imperio Tzimisce."
 podintroductions.153.a: "Transilvania es cosa del pasado, aquí está el futuro."
 raz_intro_tooltip: "Como Razkoljna, tienes un evento especial disponible durante la actividad de inspeccionar capital."
 
 POD_survey_events.160.t: "La Inspección: La Capital de Razkoljna"
 POD_survey_events.160.desc: "Conoces la importancia de una comunidad mortal bien desarrollada más que cualquier Tzimisce. Como tal, has estado practicando el arte de guiar una ciudad hacia la prosperidad durante mucho tiempo en Cracovia. Las valiosas lecciones aprendidas te facilitan desarrollar sutilmente tu capital hacia tu objetivo. Sin embargo, sigue siendo un proceso agotador, y quizás quieras tomarte tu tiempo."
 POD_survey_events.160.option.a: "No hay tiempo que perder"
 POD_survey_events.160.option.b: "Tengo la eternidad de mi lado"
 raz_survey_tooltip: "Este resultado especial de la inspección está disponible mientras juegues como Razkoljna."
 
 podintroductions.154.t: "Tu Historia Hasta Ahora"
 podintroductions.154.desc: "Lord Hedeon, recientemente has hecho crecer tu influencia en Polonia gracias al tiempo de la Princesa Razkoljna en $pod_torpor$. Y a medida que crece tu influencia, también lo hacen los gritos de los mortales bajo tu 'cuidado', claramente el más placentero de los sonidos. Tu fortaleza siempre necesita más renovación y, como tal, obviamente necesitas más ganado que desollar y desmembrar con fines artísticos.\n¿Qué mejor manera de adquirir más que aplastando a Razkoljna y a los otros usurpadores polacos y luego trayendo sus patéticas ciudades a tu red? Eres un hombre imaginativo, después de todo, piensa en todas las cosas que podrías hacer con tantos mortales indefensos añadidos a tu dominio..."
 podintroductions.154.a: "Pesada es la carga del artista."
 hedeon_intro_tooltip: "Como Hedeon, obtienes un gran alivio de estrés y algo de experiencia en intriga cuando torturas a alguien."
 
 podintroductions.155.t: "Tu Historia Hasta Ahora"
 podintroductions.155.desc: "Lord Yorak, como el childe más antiguo de Tzimisce activo en Transilvania, has asumido el papel de líder espiritual para tu $pod_clan$. Se ha visto fortalecido por tu construcción de la Catedral de Carne, un logro magistral en el arte de esculpir carne.\nAún así, también fuiste una fuerza política en el pasado y es posible que necesites volver a serlo, ya que tus hermanos son asaltados por los Ventrue alemanes y sus aliados Tremere. Claramente, eres el único con suficiente influencia para unificar realmente al $pod_clan$. ¿Y para aquellos que no están de acuerdo? Bueno, la Catedral siempre tiene hambre..."
 podintroductions.155.a: "Abre las puertas..."
 yorak_intro_tooltip: "Como Yorak, tienes un método de ejecución especial que te permite alimentar a la Catedral mientras la controles"
 
 EXECUTION_YORAK: "Alimentar a la Catedral"
 EXECUTION_SHOU: "Devorar-Llamas"
 
 cathedral_famished_modifier: "Catedral Famélica"
 cathedral_famished_modifier_desc: "Después de la reciente entrada, la Catedral quiere más. Muchas más."
 
 cathedral_hungry_modifier: "Catedral Hambrienta"
 cathedral_hungry_modifier_desc: "La enloquecedora estructura se expande más y más a medida que las pobres almas son alimentadas a su hambre interminable."
 
 cathedral_satiated_modifier: "Catedral Saciada"
 cathedral_satiated_modifier_desc: "La aparente calma que reina en la Catedral solo se ve perturbada por los gritos de sus innumerables víctimas."
 
 podintroductions.156.t: "Tu Historia Hasta Ahora"
 podintroductions.156.desc: "Darvag el Temible, Kiev está a tu merced y una noche te vengarás de su voluble población que traicionó tu antigua religión. Pero hay asuntos más apremiantes.\nEl Voivodato Tzimisce al oeste pidió tu juramento de lealtad, pero te negaste, sabiendo que hay poderes mucho mayores que ellos. La Abuelita de la fama rusa, Baba Yaga, está cerca, puedes sentirlo. No importa si está dormida o no, sabes que es la única Diosa de estas tierras y también conoces las historias: ella bendecirá a aquellos que muestren la debida deferencia. Bueno, estás seguro de que la gente de Kiev estará encantada de servir como ofrendas..."
 podintroductions.156.a: "¡Escúchame, Abuela!"
 darvag_intro_tooltip: "Como Darvag, tienes acceso a un método de ejecución especial."
 
 EXECUTION_DARVAG: "Sacrificar a Baba Yaga"
 
 baba_intrigued_modifier: "Notada por la Bruja"
 baba_intrigued_modifier_desc: "Baba Yaga ha mostrado interés en tu devoción a su grandeza."
 
 baba_pleased_modifier: "Baba Yaga Complacida"
 baba_pleased_modifier_desc: "La Bruja rusa está complacida con tu devoción ferviente."
 
 baba_delighted_modifier: "Nieto Favorito"
 baba_delighted_modifier_desc: "Claramente, ahora eres su favorito, el que recibe los mejores regalos."
 
 podintroductions.157.t: "Tu Historia Hasta Ahora"
 podintroductions.157.desc: "Lady Shaagra, a medida que tu control sobre Bohemia crece, has aprendido una información interesante. Vukodlak, un Tzimisce incluso más viejo que tú, estuvo activo en Praga recientemente hasta su caída en $pod_torpor$ después de una batalla titánica contra algunos atacantes desconocidos.\nVukodlak es un loco sádico y arrogante, pero no puedes negar sus poderes y habilidades. Si lo rescataras, podría ser amigable para una alianza, al menos por un tiempo. Su fuerza sería un gran activo para ayudar a facilitar tu regreso al poder... pero también podría salir mal en el futuro, ya que Vukodlak es bastante ambicioso por sí mismo."
 podintroductions.157.a: "Hay honor entre monstruos."
 podintroductions.157.b: "...Eso suena como una muy mala idea."
 
 podintroductions.158.t: "Tu Historia Hasta Ahora"
 podintroductions.158.desc: "Jamal el Temible, la mera mención de tu nombre infunde miedo en los corazones de los incrédulos que intentan invadir tu tierra. Pero esto no es suficiente.\nComo líder de la casta guerrera Banu Haqim, eres una figura respetada y poderosa dentro del $pod_clan$, un hecho que debes usar para asegurarte de que tus hermanos no se desvíen del verdadero camino. Demasiadas facciones rivales, y una Anciana ilusa, intentan impedir tu visión única para el futuro de los Banu Haqim. Usa tu destreza suprema y habilidades de liderazgo para un buen efecto y sus esfuerzos inútiles ciertamente fallarán."
 podintroductions.158.a: "Por diplomacia o guerra, triunfaremos."
 jamal_intro_tooltip: "Como Jamal, puedes usar un [character_interaction|E] para comenzar un duelo con cualquier personaje que no sea Banu Haqim"
 
 POD_jamal_interaction: "El Invencible"
 POD_jamal_interaction_desc: "Comenzarás un duelo con este personaje. Otro morderá el polvo."
 
 podintroductions.159.t: "Tu Historia Hasta Ahora"
 podintroductions.159.desc: "Lord Dastur, el caos actual en el $pod_clan$ Banu Haqim le da a tu Tribu Perdida alguna esperanza de un mañana mejor. Aún así, estás preocupado.\nHas descubierto que agentes de un culto apocalíptico llamado 'Manus Nigrum' se han infiltrado en tu reino con algún propósito desconocido, pero probablemente nefasto. Podrías lanzar una purga general de los supuestos agentes de este culto, pero esto podría parecer un movimiento paranoico y temerario. La otra opción sería mantener una vigilancia más indulgente sobre ellos, pero eso también podría permitirles ganar más y más influencia."
 podintroductions.159.a: "Cortemos esta 'Mano Negra'"
 podintroductions.159.b: "No son una amenaza... todavía."
 
 podintroductions.160.t: "Tu Historia Hasta Ahora"
 podintroductions.160.desc: "Fátima la Intrépida, tu misión de obstaculizar la 4ª Cruzada ha sido un éxito rotundo hasta ahora. Pero aún hay trabajo por hacer.\nAlamut ha enviado nuevas órdenes: debes asegurarte de que los restos del ejército cruzado atrapados en Anatolia sean eliminados. Luego, a los ancianos les gustaría que tallaras un nuevo feudo en la región usando el caos de la caída del Imperio Bizantino como cobertura. Esto sería un gran estado tapón contra cualquier futura incursión de los Francos en tu tierra natal.\nGrandes expectativas, sin duda, pero no eres conocida por el fracaso. No los decepcionarás esta vez tampoco."
 podintroductions.160.a: "Mi deber está claro."
 fatima_intro_tooltip: "Como Fátima, tienes una decisión especial que requiere que controles Anatolia disponible hasta 1300."
 
 fatima_decision: "Terminando la Cruzada"
 fatima_decision_tooltip: "¡Los Franj no pertenecen aquí!"
 fatima_decision_desc: "Los últimos restos de la 4ª Cruzada deben ser eliminados y Anatolia asegurada para los Banu Haqim."
 fatima_decision_confirm: "Misión cumplida"
 fatima_decision_effect_tooltip: "Alamut envía sus saludos... y recompensas."
 
 podintroductions.161.t: "Tu Historia Hasta Ahora"
 podintroductions.161.desc: "Sabio Al-Ashrad, los Banu Haqim están en conflicto. El faccionalismo dentro de tu $pod_clan$ ha alcanzado un punto de ebullición y sabes que este es el momento que algunas fuerzas oscuras esperaban para intentar tomar el control del $pod_clan$. Tendrás que ser fuerte.\nAfortunadamente, estás preparado. Eres un hechicero de sangre sin par y tu conocimiento del ocultismo ciertamente será útil en los tiempos turbulentos que se avecinan. Cultiva esta fuerza, estudia a tu enemigo y luego ataca con decisión. Solo tú puedes proteger a los Banu Haqim del terror que acecha en su interior."
 podintroductions.161.a: "Una planificación cuidadosa asegurará la victoria"
 alashrad_intro_tooltip: "Como Al-Ashrad, tienes una decisión especial que te permite mejorar tu aprendizaje cada diez años."
 
 alashrad_decision: "Conocimiento Ilimitado"
 alashrad_decision_tooltip: "Debo encontrar la respuesta..."
 alashrad_decision_desc: "Sabes mucho, Al-Ashrad, pero siempre hay más que descifrar y comprender. Tu búsqueda nunca terminará."
 alashrad_decision_confirm: "...tan cerca"
 
 broken_alamut_modifier: "La Anciana Más Débil"
 broken_alamut_modifier_desc: "Tu reclamo como Anciana de Alamut es extremadamente débil. Nadie te respeta y tu control sobre la situación se deteriora cada noche."
 
 podintroductions.162.t: "Tu Historia Hasta Ahora"
 podintroductions.162.desc: "Lady Nakurtum, la situación es grave. Los Banu Haqim no han aceptado tu toma de poder como Anciana. El $pod_clan$ yace fracturado.\nControlas Alamut, pero no mucho más; los otros ancianos solo rinden homenaje verbal a tu autoridad. La situación se acerca a la guerra civil cada noche. Quizás esto sea inevitable en este punto.\nSi quieres salvar tu posición, tendrás que actuar rápida y decisivamente, porque los Hijos de Haqim no respetan la debilidad."
 podintroductions.162.a: "¡Soy la Regente de Haqim!"
 nakurtum_intro_tooltip: "Como Nakurtum, tienes dos decisiones especiales que te permiten deshacerte de tus modificadores iniciales negativos."
 
 nakurtum_losing_control_modifier: "Perdiendo el Control"
 nakurtum_losing_control_modifier_desc: "Apenas controlas Alamut. Todo lo demás se escapa de tu débil agarre."
 
 nakurtum_eldest_decision: "Ganando Respeto"
 nakurtum_eldest_decision_tooltip: "¡Les demostraré mi valía!"
 nakurtum_eldest_decision_desc: "Si quieres sobrevivir mucho como Anciana de los Banu Haqim, tendrás que demostrar tu valía. Afirmar el control sobre la tierra natal de los Haqimitas es un buen comienzo."
 nakurtum_eldest_decision_confirm: "Me mantengo firme"
 
 nakurtum_control_decision: "Estabilizar tu Gobierno"
 nakurtum_control_decision_tooltip: "¡Les demostraré mi valía!"
 nakurtum_control_decision_desc: "Si quieres sobrevivir mucho como Anciana de los Banu Haqim, tendrás que demostrar tu valía. Afirmar el control sobre la tierra natal de los Haqimitas es un buen comienzo."
 nakurtum_control_decision_confirm: "Me mantengo firme"
 
 podintroductions.163.t: "Tu Historia Hasta Ahora"
 podintroductions.163.desc: "Lord Ahmed, has participado en la creación de la Dieta de los Olivos con la esperanza de una paz duradera en la zona, pero aún tienes algunas reservas. Quizás tendrás que encontrar otra manera, una que podría obligarte a actuar más.\nLamentablemente, tu fe te ha aislado del resto del $pod_clan$. Como tal, podrías tener que depender de encontrar prospectos prometedores e introducirlos a tu filosofía única. Esta será una tarea larga, pero ¿por la paz en Tierra Santa? Vale la pena."
 podintroductions.163.a: "La más importante de todas las tareas"
 ahmed_intro_tooltip: "Como Ahmed, siempre tendrás éxito en la parte de enseñanza de la fe de la educación de tu childer mientras permanezcas en la Vía Christi."
 
 podintroductions.164.t: "Tu Historia Hasta Ahora"
 podintroductions.164.desc: "Lord Thetmes, has progresado considerablemente recientemente. Los Banu Haqim están más divididos que nunca, lo que significa que tu Red de Cuchillos puede ejercer mucha más influencia que antes. Aún así, hay mucho trabajo por hacer antes de que el $pod_clan$ esté listo para el regreso de tu Amo.\nPresta atención a las otras facciones que te rodean y aplástalas rápidamente. No puedes dejar que otra Anciana se apodere de los Banu Haqim. Una vez que Alamut esté completamente asegurada por tus hermanos, puedes estar seguro de que el Pastor Negro te recompensará generosamente, ¿no eres acaso su sirviente más confiable?"
 podintroductions.164.a: "La era prometida llegará."
 thetmes_intro_tooltip: "Como Thetmes, obtienes recompensas adicionales si completas el objetivo 'Un Dios Sueña'."
 pod1230objectives.24.customthetmes: "Como Thetmes, obtienes recompensas adicionales. Ur Shulgi te bendice por tu continuo servicio."

 podintroductions.165.t: "Tu Historia Hasta Ahora"
 podintroductions.165.desc: "Morrow la Temible, tu fama entre el $pod_clan$ Gangrel crece cada noche, gracias a tu reciente victoria contra los Ventrue de la Cruz Negra y el Voivodato Tzimisce. Pero esto es solo un comienzo.\nSi quieres unificar verdaderamente al $pod_clan$, tendrás que continuar en esta dirección, demostrando que eres, de hecho, la caudilla más poderosa. Una herramienta por la que ya eres famosa es tu costumbre de aparecer sin invitación en las cortes de posibles enemigos y hacer una muestra de fuerza antes de irte. Esta táctica te ha servido bien en el pasado y podría seguir haciéndolo."
 podintroductions.165.a: "La era de la bestia se acerca."
 morrow_intro_tooltip: "Como Morrow, tienes un [character_interaction|E] especial con gobernantes con tierras para asustarlos con una muestra de fuerza."

 show_of_force_morrow_modifier: "Muestra de Fuerza"
 show_of_force_morrow_modifier_desc: "Este personaje ha sido asustado por la repentina aparición de Morrow y sus silenciosas amenazas en la corte."

 POD_morrow_interaction: "Muestra de Fuerza"
 POD_morrow_interaction_desc: "Asusta a este gobernante apareciendo repentinamente en su corte."

 podintroductions.166.t: "Tu Historia Hasta Ahora"
 podintroductions.166.desc: "Lord Viktor, tu ama Baba Yaga te confió su reino mientras se recupera de la terrible batalla contra su [Glossary('Sire','game_concept_Sire_desc')]. No la decepcionarás.\nEl ascenso del cristianismo y las hordas orientales están demostrando ser una gran preocupación y debes asegurar rápidamente tus alrededores para que la Abuela pueda dormir en paz. También presta atención a Durga Syn, al oeste, una vieja oponente de Baba Yaga.\nSi logras lidiar con todas estas amenazas, no hay duda en tu mente de que la Abuela estará complacida y te recompensará en consecuencia..."
 podintroductions.166.a: "Duerme bien, Abuela. Yo vigilo."
 viktor_intro_tooltip: "Como Viktor, obtienes recompensas personales adicionales si logras el objetivo 'Abuela Cariñosa'."

 pod1230objectives.20.custom.viktor: "Como Viktor, obtienes recompensas adicionales. Baba Yaga está muy complacida con su sirviente favorito."

 podintroductions.167.t: "Tu Historia Hasta Ahora"
 podintroductions.167.desc: "Lady Brunhilde, los [Glossary('Einherjar','game_concept_einherjar_desc')] están muriendo. Tu fe está siendo reemplazada por el Dios Blanco y sus seguidores, y tus hermanos han perdido la esperanza. El propio Werter, el elegido por Odín para lideraros en estos tiempos turbulentos, parece cerca del punto de quiebre. Debes actuar.\nTienes un gran respeto por Werter y fue un amigo digno durante siglos, pero ahora debes forzarlo a abdicar de su posición como Altísimo de Midgard antes de que os lleve a todos a la ruina. ¡Es hora de que las Valquirias salven Escandinavia contigo a su mando!"
 podintroductions.167.a: "Debo apartar a Werter por nuestro propio bien."
 brunhilde_intro_tooltip: "Como Brunhilde, tendrás varios eventos en los próximos meses que te permitirán usurpar el [title|E] de Midgard."
 podintroductions.167.b: "¡Convoca a las Valquirias, cabalgaremos para salvar Midgard!"

 PODcanon_chars.34.t: "Fe y Poder"
 PODcanon_chars.34.desc: "Ahora has dejado clara tu ambición a los otros habitantes de Midgard: debes reemplazar a Werter como líder pronto. Esto ha provocado cierto debate entre tus hermanos, pero el apoyo inicial es alto, especialmente entre aquellos que aún quieren luchar contra el cristianismo.\nEl propio Werter no está realmente sorprendido por tu movimiento, pero te ha instado a reconsiderar tu posición. Después de todo, él es el elegido por el propio Odín, e ir en contra de la voluntad del Padre de Todos podría ser incluso peor que caer ante el Dios Blanco."
 PODcanon_chars.34.a: "Odín lo entenderá."
 brunhilde_exit_tooltip: "Abandonas tu plan de obtener el control de Midgard."
 PODcanon_chars.34.b: "...tiene un punto."

 PODcanon_chars.35.t: "Tradiciones y Poder"
 PODcanon_chars.35.desc: "Ha surgido un fuerte oponente a tu toma de poder: Karl el Azul del Estado Libre Finlandés. Este valiente [Glossary('Einherjar','game_concept_einherjar_desc')] es un firme tradicionalista y desaprueba tu acción por las mismas razones que Werter: Odín no te eligió y quizás incluso este final de la fe nórdica es tu destino.\nNo hay manera de cambiar su opinión en esta etapa; debes aceptar su hostilidad o abandonar tu plan por completo."
 PODcanon_chars.35.a: "Yo forjo mi propio destino."
 PODcanon_chars.35.b: "...tiene un punto."

 PODcanon_chars.36.t: "Una Nueva Saga"
 PODcanon_chars.36.desc: "Ahora eres lo suficientemente fuerte para reclamar Midgard y, afortunadamente, Werter no quiere luchar contra ti e iniciar una guerra civil sangrienta. Lo último que tienes que considerar ahora es cómo manejar tu victoria.\nSería costumbre que avergonzaras a Werter y sus débiles políticas para poder empezar desde cero. Pero mantener a este poderoso childe de Odín de tu lado también tendría beneficios."
 PODcanon_chars.36.a: "¡Vergüenza para los vencidos!"
 PODcanon_chars.36.b: "Trabajemos juntos."

 podintroductions.168.t: "Tu Historia Hasta Ahora"
 podintroductions.168.desc: "Lord Dunlop, has esperado tu oportunidad de venganza durante mucho tiempo. Mitras mató a tu amada hija y pagará caro por este asesinato. No eres conocido por el perdón o la misericordia, después de todo.\nSerá un proceso difícil, ya que Mitras está bien atrincherado en las Islas Británicas y sus vástagos lo protegen. Ese pensamiento te hace detenerte... quizás podrías atacar a sus childer para hacerle soportar una fracción del dolor que sentiste esa fatídica noche."
 podintroductions.168.a: "No estás olvidada, Mary."
 dunlop_intro_tooltip: "Como Dunlop, tienes una decisión especial para matar a Mitras y a su progenie."

 mary_dunlop_avenged_modifier: "Mary Vengada"
 mary_dunlop_avenged_modifier_desc: "La venganza es dulce. Todos pueden ver que el viejo y terrorífico Conde Dunlop ha regresado."

 dunlop_decision: "Venganza y Castigo"
 dunlop_decision_tooltip: "Querida, dulce Mary Elizabeth..."
 dunlop_decision_desc: "Mitras y sus childer pagarán caro por matar a tu amada hija. Un castigo se acerca."
 dunlop_decision_confirm: "En tu memoria..."
 dunlop_custom_decision: "[GetScriptedCharacterByHistoryID('505071').GetFirstName] debe estar muerto"
 dunlop_custom_decision2: "[GetScriptedCharacterByHistoryID('790820').GetFirstName], el querido childe más joven de Mitras, debe estar muerto"
 dunlop_custom_decision3: "[GetScriptedCharacterByHistoryID('790134').GetFirstName], el childe más leal y devoto de Mitras, debe estar muerto"
 dunlop_custom_decision4: "[GetScriptedCharacterByHistoryID('505109').GetFirstName], el childe más antiguo de Mitras, debe estar muerto"

 podintroductions.169.t: "Tu Historia Hasta Ahora"
 podintroductions.169.desc: "Lord Qarakh, estás liderando a los Ferales de Livonia contra el continuo asalto occidental. Hasta ahora, la situación está bajo control, pero es solo cuestión de tiempo antes de que tu reino esté bajo ataque nuevamente. Tu amada Deverra ha propuesto una solución.\nUsando su conexión mística con el Dios de esta tierra, Telyavel, podría realizar un ritual que te daría una fuerza inmensa, quizás suficiente para salvar a tu pueblo. Pero el costo... el costo sería la propia vida de Deverra. Algo que te parte el corazón solo de pensarlo.\n¿Lo permitirás?"
 podintroductions.169.a: "¡No! ¡Te necesito!"
 podintroductions.169.b: "Serás recordada, amada."

 podintroductions.170.t: "Tu Historia Hasta Ahora"
 podintroductions.170.desc: "Valborg la Intrépida, el Ragnarök se acerca, pero estás más que lista para aprovecharlo. Hay muchas oportunidades para una guerrera habilidosa como tú. Algunos lo llamarían una parodia de la 'verdadera fe nórdica', pero prefieres llamarlo una mera adaptación para estos tiempos cambiantes.\nDesde tu amado barco, el Thor Rojo, estás lista para saquear y pillar en busca de fortuna y gloria. ¡Y si los dioses antiguos lo desaprueban, siempre pueden venir aquí y decírselo a la cara de tu fiel martillo!"
 podintroductions.170.a: "¡Zarpa!"
 valborg_intro_tooltip: "Como Valborg, tienes acceso a una pequeña decisión especial para ganar algo de 'dinero extra'."

 valborg_decision: "Contratos de Mercenario"
 valborg_decision_tooltip: "¡Vikingos a sueldo!"
 valborg_decision_desc: "Hay muchas oportunidades para una tripulación resistente de experimentados guerreros nórdicos."
 valborg_decision_confirm: "¡Señálanos el objetivo!"
 valborg_decision_effect_tooltip: "Se te presentará una selección de contratos."

 red_thor_weakened_modifier: "Thor Rojo Debilitado"
 red_thor_weakened_modifier_desc: "Algunos de tus guerreros están en una misión de mercenarios, debilitando algo tu control sobre tu reino."

 red_thor_depleted_modifier: "Thor Rojo Agotado"
 red_thor_depleted_modifier_desc: "Muchos de tus guerreros están en una misión de mercenarios, debilitando tu control sobre tu reino."

 red_thor_empty_modifier: "Thor Rojo Vacío"
 red_thor_empty_modifier_desc: "Tus guerreros están en una misión de mercenarios, debilitando severamente tu control sobre tu reino."

 PODcanon_chars.37.t: "El Thor Rojo Zarpa"
 PODcanon_chars.37.desc: "Tu tripulación está lista para partir y muchos $pod_cainites$ extranjeros están ansiosos por contratarlos para sus propias guerras mezquinas. La decisión que debes tomar es sobre la dificultad del contrato. Cuanto más difícil, mejor la recompensa, pero más de tus guerreros tendrás que comprometer con la tarea. Si están en el extranjero, obviamente ya no pueden ayudarte en casa."
 PODcanon_chars.37.a: "Uno pequeño estará bien."
 PODcanon_chars.37.b: "Este parece bien equilibrado."
 PODcanon_chars.37.c: "¡El más difícil!"
 PODcanon_chars.37.d: "Ninguna navegación por ahora."

 podintroductions.171.t: "Tu Historia Hasta Ahora"
 podintroductions.171.desc: "Lord Thomas, a pesar de tus mejores esfuerzos, Constantinopla ha caído ante los Latinos. Pero no ha terminado aún.\nNo eres el tipo de hombre que se rinde, e incluso si la mayoría de los $pod_cainites$ griegos se han exiliado, tú seguirás luchando. Es una batalla cuesta arriba, sin duda, pero tienes décadas de experiencia como el principal ejecutor en esa misma ciudad. ¡Harás que la no-muerte de los $pod_cainites$ Latinos sea un infierno, y luego atacarás y los acabarás de una vez por todas!"
 podintroductions.171.a: "El castigo se acerca."
 thomas_intro_tooltip: "Como Thomas, tienes un [character_interaction|E] especial contra gobernantes con tierras donde puedes debilitarlos antes de una guerra."

 guerilla_thomas_modifier: "Guerrilla Gangrel Griega"
 guerilla_thomas_modifier_desc: "Siendo objetivo de bandas de Gangrel griegos bien organizados, este personaje tiene problemas para mantener el control de su reino."

 POD_thomas_interaction: "Guerrilla"
 POD_thomas_interaction_desc: "Desorganiza el reino de este gobernante lanzando acciones de guerrilla."

 podintroductions.172.t: "Tu Historia Hasta Ahora"
 podintroductions.172.desc: "Lady Tryphosa, Camila ha despertado y ha tomado el control de Roma una vez más, tal como anticipaste. Fuiste una vez su amiga cercana y consejera de confianza, y con ese rol ejercías una tremenda influencia. ¿Quizás podrías hacerlo de nuevo?\nPodrías hacer saber tu presencia al poderoso Ventrue y entrar a su servicio nuevamente. Esto proporcionaría una protección útil contra los traicioneros Lasombra del Sur. O podrías continuar por tu cuenta, quizás Camila ya no es parte de tu futuro esta vez."
 podintroductions.172.a: "Bienvenido de nuevo, cónsul."
 podintroductions.172.b: "Su tiempo ha pasado."

 podintroductions.173.t: "Tu Historia Hasta Ahora"
 podintroductions.173.desc: "Lady Vasantasena, estás furiosa. En tus años de vagabundeo y prédica por la libertad, nunca viste una abominación como esta 'Casa Tremere'. ¡Estos magos están todos oprimidos bajo un Consejo tiránico y, peor aún, forzados a soportar el vínculo de sangre hasta el último! Esto no puede continuar.\nAfortunadamente, los Tremere claramente te subestiman y todavía no han notado realmente tu presencia e influencia. Esta es una gran oportunidad para derribar esta 'pirámide' desde dentro. ¡Esta será tu obra maestra y todo el mundo $pod_cainite$ se llenará de esperanza cuando hayas terminado!"
 podintroductions.173.a: "Romperemos sus cadenas."
 vasantasena_intro_tooltip: "Como Vasantasena, tienes acceso a una decisión especial que te hará crear tu propia religión si tiene éxito."

 vasantasena_decision: "Rompiendo la Pirámide"
 vasantasena_decision_tooltip: "¡Esta abominación debe ser derribada!"
 vasantasena_decision_desc: "La Casa Tremere se opone a todo lo que aprecias. Debes actuar."
 vasantasena_decision_effect_tooltip: "Codificas tu propio sendero, allanando el camino para futuras liberaciones."
 vasantasena_decision_confirm: "¡La Pirámide ha sido derribada!"

 podintroductions.174.t: "Tu Historia Hasta Ahora"
 podintroductions.174.desc: "Louhi, tu pacto con el amo Abisal está progresando bien. Le has jurado lealtad y está complacido con tu trabajo hasta ahora, pero hay más por hacer.\nEl extremo norte donde resides está aislado, lo cual es útil para la soledad pero limita la escala de tus experimentos, especialmente en cuanto a tus bien elaborados [Glossary('Revenants','game_concept_revenant_desc')], los Keskinen. ¿Quizás podrías expandir tu reino? Sabes que los sirvientes de tu amo estarían encantados de ayudar en tal empresa..."
 podintroductions.174.a: "¡Posibilidades, posibilidades!"
 louhi_intro_tooltip: "Como Louhi, mientras permanezcas en el sendero del abismo, puedes usar una decisión para generar Sombras, un tipo de soldado normalmente único de los Lasombra."

 louhi_decision: "Negocio Turbio"
 louhi_decision_tooltip: "Tienes amigos en lugares oscuros."
 louhi_decision_desc: "El amo Abisal es generoso. Pide su apoyo."
 louhi_decision_effect_tooltip: "Tendrás una opción sobre cuántas Sombras convocar."
 louhi_decision_confirm: "¡Escúchame!"

 PODcanon_chars.38.t: "Negocio Turbio"
 PODcanon_chars.38.desc: "Estás listo para hacer tus ofrendas al amo Abisal. ¿Cuántos de sus sirvientes quieres intentar convocar?"
 PODcanon_chars.38.a: "Solo algunos de ellos."
 PODcanon_chars.38.b: "¡Más!"
 PODcanon_chars.38.c: "¡Todos!"
 PODcanon_chars.38.d: "Pensándolo bien..."
 louhi_small_shades_tt: "Un grupo de Sombras se añade a tus soldados disponibles."
 louhi_medium_shades_tt: "Dos grupos de Sombras se añaden a tus soldados disponibles."
 louhi_high_shades_tt: "Tres grupos de Sombras se añaden a tus soldados disponibles."

 podintroductions.175.t: "Tu Historia Hasta Ahora"
 podintroductions.175.desc: "Lord Anatole, has estado haciendo la obra de Dios humillando a la Herejía $pod_cainite$ parisina, pero tu tarea aún no está completa. Estas tierras del sur están llenas de herejes escondidos detrás o entre los Cátaros.\nHas obtenido el derecho a operar dentro de la región y estás confiado en que tendrás éxito a su debido tiempo. Sin embargo, las raíces de la corrupción podrían ser más profundas de lo que pensaste al principio, y quizás necesites destituir a algunos Príncipes de sus cargos para descubrirlas. Después de eso... Dios elegirá tu próximo camino, como siempre hace."
 podintroductions.175.a: "Comencemos."
 podintroductions.175.b: "Quedarme quieto no es para mí."
 anatole_intro_tooltip: "Como Anatole, tienes una pequeña decisión disponible para entender la voluntad de Dios para ti."

 anatole_decision: "La Voluntad de Dios"
 anatole_decision_tooltip: "¿Qué ha planeado para mí?"
 anatole_decision_desc: "Tu fe es fuerte, pero Sus caminos son misteriosos. Debes hacer tiempo para entenderlos."
 anatole_decision_effect_tooltip: "Recibirás una visión, que podría ser buena o mala."
 anatole_decision_confirm: "El camino a seguir..."

 PODcanon_chars.39.t: "La Ira de Dios"
 PODcanon_chars.39.desc: "¿Hiciste algo malo? ¿O es que Él está disgustado contigo? Quizás nunca lo sepas, pero lo que sí sabes es que Dios no está contento contigo. Las visiones de temor y furia que acabas de recibir son claras: debes cambiar tus caminos."
 PODcanon_chars.39.a: "¡Debo hacerlo mejor!"
 PODcanon_chars.39.b: "No habrá descanso hasta mi redención."
 PODcanon_chars.39.c: "¡Hice mi mejor esfuerzo!"

 PODcanon_chars.40.t: "El Celoso de Dios"
 PODcanon_chars.40.desc: "Siempre puedes mejorar y hacer más. Eso es lo que Dios te ha recordado con las últimas visiones que recibiste. Tu celo se renueva y tu sentido del propósito nunca ha sido mayor.\n¿Dónde canalizarás este gran don?"
 PODcanon_chars.40.a: "Entendiendo las Escrituras"
 PODcanon_chars.40.b: "Predicando a las masas."
 PODcanon_chars.40.c: "Entendiendo mi papel."

 PODcanon_chars.41.t: "La Voluntad de Dios"
 PODcanon_chars.41.desc: "Gracias a una visión reciente, encontraste la guarida de un hereje vampírico cercano. Lamentablemente, este se esconde a plena vista, teniendo poderosas conexiones con los gobernantes mortales de la tierra. Actuar contra él ciertamente atraería una atención no deseada.\n¿Pero puedes realmente negar la justicia de Dios sobre un alma tan maldita?"
 PODcanon_chars.41.a: "Su alma será purificada."
 PODcanon_chars.41.b: "La salvación aún es una opción."
 PODcanon_chars.41.c: "No puedo actuar esta vez."

 broken_talmahera_modifier: "El Improbable Del'Roh"
 broken_talmahera_modifier_desc: "Tu reclamo como Del'Roh de la Tal'mahe'Ra es extremadamente débil. Nadie te respeta y tu control sobre la situación se deteriora cada noche."

 podintroductions.176.t: "Tu Historia Hasta Ahora"
 podintroductions.176.desc: "Lord Elimelech, después de tu buena parte de vagabundeo confuso, has terminado en este extraño culto a la muerte llamado Tal'mahe'Ra. Tienen sus propias ideas extrañas por lo que has visto hasta ahora, como adorar a los [Glossary('Antediluvians','game_concept_antediluvian_desc')].\nTu edad bíblica y tu considerable poder personal te han hecho temido y respetado por este culto, y han empezado a seguirte a ti y a tus órdenes. ¿Quizás este es el propósito de tu no-muerte que tanto has extrañado hasta ahora? Si decides quedarte, sin embargo, tendrás que consolidar rápidamente el débil control que tienes sobre ellos."
 podintroductions.176.a: "Un desarrollo extraño."
 elimelech_intro_tooltip: "Como Elimelech, tienes dos decisiones especiales que te permiten deshacerte de tus modificadores negativos iniciales."

 elimelech_losing_control_modifier: "Perdiendo el Control"
 elimelech_losing_control_modifier_desc: "Apenas controlas tu propia sala del trono. Todo lo demás se escapa de tu débil agarre."

 elimelech_delroh_decision: "Ganando tu Poder"
 elimelech_delroh_decision_tooltip: "¡Les demostraré mis habilidades de liderazgo!"
 elimelech_delroh_decision_desc: "Si quieres sobrevivir mucho como Del'Roh de la Tal'mahe'Ra, tendrás que demostrar tu valía. Afirmar el control sobre las tierras circundantes es un buen comienzo."
 elimelech_delroh_decision_confirm: "¡Respeten mi autoridad!"

 elimelech_control_decision: "Estabilizar tu Gobierno"
 elimelech_control_decision_tooltip: "¡Les demostraré mis habilidades de liderazgo!"
 elimelech_control_decision_desc: "Tu gobierno sobre la misteriosa Tal'mahe'Ra es una rareza, nadie espera que dure mucho. Demuéstrales que están equivocados."
 elimelech_control_decision_confirm: "¡Sigo aquí!"

 elimelech_custom_decision: "Esta decisión solo se puede lograr después de 1300"

 podintroductions.177.t: "Tu Historia Hasta Ahora"
 podintroductions.177.desc: "Lord Zettler, ahora entiendas mucho más. El dragón de tres cabezas te ha mostrado la verdad.\nEras ingenuo al intentar proteger a los Salubri de los Tremere, porque al final, ¿no somos todos cenizas? Solo hay una constante en esta maldita existencia y es la del dolor. Gracias a las muchas bendiciones de tu nuevo patrón, aprenderás todos sus secretos y te convertirás en su artista definitivo.\nLos gritos nunca cesarán, pero ahora los entenderás."
 podintroductions.177.a: "Claridad, al fin."
 zettler_intro_tooltip: "Como Zettler, tienes una decisión especial para invocar a uno de los aspectos del dragón de tres cabezas para que te ayude."

 zettler_beast_of_war_modifier: "Bestia de Guerra"
 zettler_beast_of_war_modifier_desc: "El hermano menor, una criatura de furia e ira desenfrenadas."

 zettler_eater_of_souls_modifier: "Devora Almas"
 zettler_eater_of_souls_modifier_desc: "El hermano del medio, el que consumirá todo al final."

 zettler_defiler_modifier: "Violador"
 zettler_defiler_modifier_desc: "El hermano mayor, corrompiendo todo lo que toca."

 zettler_decision: "Los Tres Hermanos"
 zettler_decision_tooltip: "El dragón te habla, complacido por tu devoción."
 zettler_decision_desc: "Las tres cabezas del dragón representan cada una un aspecto diferente y diferentes beneficios para aprovechar para tus objetivos."
 zettler_decision_effect_tooltip: "Elegirás entre los tres aspectos para los próximos cinco años."
 zettler_decision_confirm: "Una ayuda divina..."

 PODcanon_chars.42.t: "El Dragón de Tres Cabezas"
 PODcanon_chars.42.desc: "Tu patrón es una entidad poderosa, pero aún misteriosa incluso para ti. Lo que has reunido hasta ahora es su división en tres 'cabezas' que son casi criaturas diferentes, pero que aún forman parte del todo de alguna manera.\nCada una anhela tu devoción y promete recompensas si cumples."
 PODcanon_chars.42.a: "La Bestia de Guerra"
 PODcanon_chars.42.b: "El Devora Almas"
 PODcanon_chars.42.c: "El Violador"
 PODcanon_chars.42.d: "No elegiré ahora mismo."

 podintroductions.178.t: "Tu Historia Hasta Ahora"
 podintroductions.178.desc: "Lady Adolana, mientras la Herejía $pod_cainite$ se desmorona a tu alrededor, has usado este caos para obtener un asiento en la Sede de Nod a pesar de tu juventud. Sabes cómo aprovechar al máximo una mala situación, después de todo.\nDesde tu llegada aquí, has estado muy sospechosa del actual Arzobispo de Nod, quien parece extrañamente despreocupado por el estado crítico de tu Iglesia. ¿Quizás es hora de un cambio de liderazgo? Podrías presionar el asunto en la próxima sesión de la Curia, asegurándote de que todos sepan de tu ambición... lo que puede ser un arma de doble filo, obviamente."
 podintroductions.178.a: "¡Necesitamos un cambio!"
 podintroductions.178.b: "El Arzobispo tiene mi apoyo total."

 josef_terrified_modifier: "Bajo Presión"
 josef_terrified_modifier_desc: "Shaagra está tras de ti, puedes sentirlo. ¡Debes mirar a tu espalda ahora mismo!"

 podintroductions.179.t: "Tu Historia Hasta Ahora"
 podintroductions.179.desc: "Lord Josef, has estado trabajando duro para asegurar Praga después de tu revuelta contra el gobierno tiránico del último Príncipe, pero un nuevo problema ya ha surgido.\nShaagra, la que gobernó Bohemia en tiempos antiguos, ha despertado y ha tomado fácilmente el control de la parte oriental del país. Ciertamente querrá más, y estás aterrado de lo que un ser tan antiguo podría hacerte. ¡Debes encontrar una manera de deshacerte de ella!"
 podintroductions.179.a: "¡Todavía hay esperanza!"
 josef_intro_tooltip: "Como Josef, tienes un modificador inicial que se puede mejorar logrando una decisión especial."

 josef_breathing_modifier: "Respiro"
 josef_breathing_modifier_desc: "Shaagra está fuera de escena y puedes respirar de nuevo... metafóricamente, por supuesto."

 josef_decision: "El Destino de Bohemia"
 josef_decision_tooltip: "¡Ella se acerca!"
 josef_decision_desc: "Shaagra, el terror antiguo que una vez gobernó Bohemia con puño de hierro, ha regresado. Y ciertamente no apreciará que te aferres a tanta de su tierra 'legítima'."
 josef_decision_confirm: "...Uf"
 josef_custom_decision: "[GetScriptedCharacterByHistoryID('790946').GetFirstName] debe estar muerta"

 podintroductions.180.t: "Tu Historia Hasta Ahora"
 podintroductions.180.desc: "Lord Tarique, La Meca y Medina están firmemente en manos piadosas de los [Glossary('Ashirra','game_concept_ashirra_desc')] en gran parte gracias a ti. Pero tu trabajo aún no ha terminado.\nOtras ciudades importantes como El Cairo, Damasco y Córdoba aún están en conflicto o directamente controladas por enemigos de la fe. ¡Esto no puede continuar! Conoces tu deber y no te detendrás hasta que los [Glossary('Ashirra','game_concept_ashirra_desc')] protejan a los fieles desde Arabia hasta Iberia."
 podintroductions.180.a: "El Hajj triunfará."
 tarique_intro_tooltip: "Como Tarique, tienes un objetivo especial para asegurar las ciudades más significativas del Islam."

 tarique_guardian_modifier: "Guardián de las Ciudades Santas"
 tarique_guardian_modifier_desc: "El prestigio y la piedad del Guardián son conocidos en todas partes. Uno de los raros $pod_cainites$ verdaderamente dedicado a una causa."

 tarique_decision: "Guardián de las Ciudades Santas"
 tarique_decision_tooltip: "Tu deber está claro."
 tarique_decision_desc: "Has renacido en la gracia de La Meca y quieres permitir que otros experimenten esta bendita experiencia. Como tal, las ciudades más importantes de la fe deben ser protegidas."
 tarique_decision_confirm: "Mi deber está cumplido"

 podintroductions.181.t: "Tu Historia Hasta Ahora"
 podintroductions.181.desc: "Lord Malachite, el tiempo de vagar y desesperar ha terminado. Debes actuar.\nLos Latinos están bien atrincherados en Constantinopla, y esta afrenta a la memoria de Miguel no debe continuar. Fuiste su roca, su protegido, y ahora debes devolver su amabilidad salvando su legado.\nConstantinopla es eterna. El Sueño es eterno. Asegúrate de que los malditos Latinos lo entiendan pronto."
 podintroductions.181.a: "No fuimos dignos, Patriarca."
 malachite_intro_tooltip: "Como Malachite, obtienes recompensas adicionales si completas el objetivo 'Soñando de Nuevo'."

 pod1230objectives.6.c: "Ellos saben quién soy."
 pod1230objectives.6.custom.malachite: "Esta opción está disponible porque estás jugando como Malachite."

 podintroductions.182.t: "Tu Historia Hasta Ahora"
 podintroductions.182.desc: "Lady Mnemach, tu atención está dividida.\nPor un lado, las consecuencias del golpe de Salianna dejan a Francia en una posición vulnerable. Tienes muchos contactos y suficiente influencia como para aprovechar esto y finalmente devolver esta tierra a sus antiguas raíces.\nPor otro lado, finalmente recuperaste a tu hermana. Sin embargo, Suleviae tiene la mente completamente rota por siglos de condicionamiento de los Ventrue, y apenas te reconoce. Una vez la amaste profundamente, y ayudarla podría restaurar sus recuerdos. Pero no puedes realizar esa ardua tarea mientras también entras en la arena política francesa."
 podintroductions.182.a: "La familia es la familia."
 podintroductions.182.b: "Este tiempo ya pasó."

 podintroductions.183.t: "Tu Historia Hasta Ahora"
 podintroductions.183.desc: "Lord Lukas, a pesar de ser Abrazado por un Nosferatu, has logrado salvar tu perfecta belleza... a un precio. Tu patrón infernal pidió 100 almas en tus primeros 100 años de existencia y ya las entregaste, pero... ahora quiere más y a un ritmo más rápido.\nSin embargo, no tienes opción, ya que cualquier sacrificio vale la pena si puedes mantener tu apariencia juvenil. Es hora de abrir tu Monasterio Sumergido y expandirte. Necesitarás más personas para atrapar y corromper mientras tu benefactor tenga hambre de más. Estará satisfecho pronto...\n¿Verdad?"
 podintroductions.183.a: "La perfección hecha carne."
 lukas_intro_tooltip: "Como Lukas, tu patrón infernal te pedirá regularmente un sacrificio, ya sea del desarrollo de tu capital (si tienes suficiente) o de miembros seleccionados al azar de tu corte. Puedes negarte, pero la cordura de Lukas probablemente no soportará que se le niegue su belleza una vez más."

 PODcanon_chars.43.t: "El Precio de la Perfección"
 PODcanon_chars.43.desc: "Tu patrón ha regresado, recordándote la deuda que tienes que pagar. Hay que hacer sacrificios, literalmente, para salvar tu piel intacta.\nSi tu capital está lo suficientemente poblada, podrías sacrificar parte de ella. De lo contrario, tendrás que dejar que el demonio elija de tu corte. O... podrías negarte a seguir jugando a este terrible juego por completo, pero conoces el costo..."
 PODcanon_chars.43.a: "¿Quién echará de menos a unos simples mortales?"
 PODcanon_chars.43.b: "Cortesanos, ¿para qué sirven?"
 PODcanon_chars.43.c: "...Ya no puedo más."
 lukas_sacrifice_dev_tt: "Debes tener una capital con más de 5 de desarrollo para mantener esta opción disponible en futuras peticiones."

 gregor_knight_modifier: "Caballero de la Dama"
 gregor_knight_modifier_desc: "Gregor vive en su propio mundo de fantasía donde nunca debe separarse del lado de su amada Dama."

 podintroductions.184.t: "Tu Historia Hasta Ahora"
 podintroductions.184.desc: "Gregor el Temible, finalmente encontraste un propósito para tu vida. Esos patéticos Caballeros Teutónicos estaban demasiado asustados de tu fuerza para aceptarte, pero la Dama de las Espinas es diferente.\nElla no se preocupa por tu llamada 'crueldad' e incluso te hace sentir más fuerte que nunca. Necesita un campeón diligente, y tú eres el elegido. Sin embargo, parece ser posesiva y no le gusta cuando te alejas demasiado de ella, lo que podría ser un problema a largo plazo.\nNo importa, ¡tienes monstruos que matar en su nombre!"
 podintroductions.184.a: "Un Caballero perfecto para la Dama perfecta."
 gregor_intro_tooltip: "Como Gregor, tienes una pequeña decisión especial donde puedes pedir más ayuda a la Dama o romper lazos con ella."

 gregor_decision: "Conociendo a la Dama"
 gregor_decision_tooltip: "Soy su leal servidor."
 gregor_decision_desc: "La Dama te concede fuerza, pero puede ayudarte aún más si lo deseas. O podrías intentar romper lazos con ella si es demasiado posesiva para tu gusto."
 gregor_decision_confirm: "A tu servicio"
 gregor_decision_effect_tooltip: "Te reunirás con la Dama. Puede potenciarte por un tiempo, o podrías romper lazos con ella."

 PODcanon_chars.44.t: "La Dama de las Espinas"
 PODcanon_chars.44.desc: "En lo profundo de su bosque, la Dama te espera, tan hermosa como la primera noche que la conociste. Sonríe y te agradece calurosamente por tu continuo servicio.\nComo la patrona gentil y amable que es, sin duda escuchará tus peticiones si tienes alguna. O podría tener una propia."
 PODcanon_chars.44.a: "Humildemente solicito tu bendición."
 PODcanon_chars.44.b: "¿Nuevos sirvientes? Por supuesto, mi Dama."
 PODcanon_chars.44.c: "¡Esta locura debe terminar!"
 gregor_briey_tooltip: "Debes controlar el condado de Briey para mantener esta opción disponible."
 PODcanon_chars.44.d: "La visitaré en otro momento."
 gregor_is_done_tooltip: "No podrás interactuar con la Dama en el futuro."

 podintroductions.185.t: "Tu Historia Hasta Ahora"
 podintroductions.185.desc: "Famoso Zelios, ya eres conocido como el arquitecto más competente del mundo de la noche. Has construido castillos y mansiones para los señores y damas no-muertos durante décadas. Aún así, tu verdadera obra maestra se te escapa.\nUna corazonada te ha llevado a Transilvania, donde la tierra misma parece... diferente. Estas extrañas energías geománticas están suplicando ser aprovechadas por tus manos magistrales, y no puedes esperar para empezar."
 podintroductions.185.a: "¿El mejor material?"
 zelios_intro_tooltip: "Como Zelios, tienes acceso a un edificio especial, el Taller de Zelios."

 building_type_architect_workshop_01: "Taller de Zelios"
 building_type_architect_workshop_01_desc: "#F Cada edificio comienza con una buena herramienta en la mano de un buen artesano.#!"
 building_architect_workshop_01: "Taller de Zelios"
 building_architect_workshop_01_desc: "Zelios tiene su propio taller aquí, preparando sus planos y aprendices para algunas construcciones magistrales aún por venir."

 podintroductions.186.t: "Tu Historia Hasta Ahora"
 podintroductions.186.desc: "Lord Chandraputra, conoces tu deber.\nLa guerra está en tu sangre y tu [Glossary('Sire','game_concept_Sire_desc')] te confió la prestigiosa, pero difícil, tarea de finalmente asegurar la India para los Ravnos. Los malditos [Glossary('Asuratizayya','game_concept_kuei_jin_desc')] son oponentes fuertes y los otros $pod_cainites$ indios no ayudan al no someterse a tu justo liderazgo. No importa, triunfarás tarde o temprano.\nEres el regente firme y maestro de guerra de tu $pod_clan$. ¡Prepara tus ejércitos, reúne a tus tropas y marcha hacia la victoria!"
 podintroductions.186.a: "Nuestro destino será escrito en sangre."
 chandraputra_intro_tooltip: "Como Chandraputra, tienes acceso a una pequeña decisión especial para mejorar tus habilidades en la guerra."

 chandraputra_decision: "Los Tambores de Guerra"
 chandraputra_decision_tooltip: "La guerra es un asunto complicado, debes estar preparado."
 chandraputra_decision_desc: "Has sido un maestro de la guerra desde tus días mortales, hace tanto tiempo. Aún así, siempre hay margen de mejora."
 chandraputra_decision_confirm: "Nuevas tácticas para un viejo general"
 chandraputra_decision_effect_tooltip: "Enfocarás tus esfuerzos en un tema específico relacionado con la guerra durante los próximos cinco años, recibiendo alguna bonificación."

 chandraputra_martial_modifier: "Maestro de Guerra"
 chandraputra_martial_modifier_desc: "Un ejército liderado por Chandraputra parece ser sobrenaturalmente rápido y avanza con poco o ningún respiro necesario."

 chandraputra_knights_modifier: "Ejercicio Intenso"
 chandraputra_knights_modifier_desc: "Tus campeones nunca serán lo suficientemente buenos para tu gusto. Pero pueden acercarse más con algo de ejercicio a la antigua."

 PODcanon_chars.45.t: "Los Tambores de Guerra"
 PODcanon_chars.45.desc: "Incluso tu extenso conocimiento en la guerra no siempre es suficiente para asegurar la victoria. Siempre hay nuevas tácticas que estudiar, nuevos métodos de entrenamiento que idear o nuevos planes de batalla que trazar. Debes mantenerte diligente."
 PODcanon_chars.45.a: "La velocidad es siempre la clave."
 PODcanon_chars.45.b: "¡Quiero una batalla simulada preparada ahora mismo!"
 PODcanon_chars.45.c: "Quiero informes sobre las recientes batallas mortales."
 PODcanon_chars.45.d: "¿Se llaman a sí mismos campeones?"

 podintroductions.187.t: "Tu Historia Hasta Ahora"
 podintroductions.187.desc: "Lady Karmenita, has estado trabajando tan duro en promover tu nueva casta Ravnos que no viste la caída en el pecado de tu vástago, Iago Castille, hasta que fue demasiado tarde.\nTu antes prometedor estudiante es ahora un mero bandido, saqueando los mares desde su refugio en Córcega. Este no es el legado que quieres para tu linaje.\nPodrías intentar enviarle un mensaje, aliviando vuestras relaciones con la esperanza de una reconciliación futura. O quizás sea mejor olvidarse realmente de él."
 podintroductions.187.a: "No es demasiado tarde para nosotros, vástago."
 podintroductions.187.b: "Está demasiado perdido."

 podintroductions.188.t: "Tu Historia Hasta Ahora"
 podintroductions.188.desc: "Iago el Intrépido, eres el maestro del Mediterráneo... o esperas serlo al menos. Tu refugio pirata en Córcega podría llevarte allí con el tiempo.\nDeja que los Príncipes arrogantes sigan con sus mezquinas maquinaciones, tú sabes dónde está el verdadero poder y eres lo suficientemente astuto para tomarlo por cualquier medio necesario.\n¡Cuando todos los marineros del Mediterráneo teman tu nombre y tus cofres estén rebosantes de oro... entonces será cuando realmente triunfarás!"
 podintroductions.188.a: "¡Todos a cubierta!"
 iago_intro_tooltip: "Como Iago, tienes una decisión especial para buscar botín y riquezas."

 iago_decision: "Zarpando"
 iago_decision_tooltip: "La tripulación está inquieta, ¿hora de zarpar quizás?"
 iago_decision_desc: "Gobernar está muy bien, pero necesitas el viento a favor y un botín por delante para sentirte realmente vivo. O cerca de ello, de todos modos."
 iago_decision_confirm: "¡El viento está a nuestro favor!"
 iago_decision_effect_tooltip: "Se te presentará una selección de objetivos."

 iago_crew_weakened_modifier: "Tripulación Debilitada"
 iago_crew_weakened_modifier_desc: "Algunos de tus marineros nunca regresaron del último saqueo, debilitando algo tu control sobre tu reino."

 iago_crew_depleted_modifier: "Tripulación Agotada"
 iago_crew_depleted_modifier_desc: "Muchos de tus marineros nunca regresaron del último saqueo, debilitando tu control sobre tu reino."

 iago_crew_empty_modifier: "Sin Tripulación"
 iago_crew_empty_modifier_desc: "Tu tripulación fue casi asesinada hasta el último hombre en el último saqueo, debilitando severamente tu control sobre tu reino."

 PODcanon_chars.46.t: "El Príncipe Pirata Zarpa"
 PODcanon_chars.46.desc: "Tu tripulación está lista para partir y muchos objetivos ricos están disponibles. La decisión que debes tomar es sobre la dificultad del botín. Cuanto más difícil, mejor la recompensa, pero más de tu tripulación perderás durante el abordaje. Si están muertos, obviamente ya no pueden ayudarte en casa."
 PODcanon_chars.46.a: "Presa pequeña, riesgos pequeños."
 PODcanon_chars.46.b: "Este parece bien equilibrado."
 PODcanon_chars.46.c: "¡El botín más grande de todos!"
 PODcanon_chars.46.d: "Ninguna navegación por ahora."

 podintroductions.189.t: "Tu Historia Hasta Ahora"
 podintroductions.189.desc: "Lord Mritunjay, después de una larga espera y una cuidadosa planificación, finalmente has asegurado Bagdad para ti. ¡Es hora de disfrutar de tu nuevo poder!\nO quizás no, ya que la corte está cada vez más preocupada por la llamada 'Horda Mongol', esos jinetes mortales que están atacando el Califato ahora mismo. No estás convencido, ya que fueron derrotados recientemente en Erbil, pero escuchas las advertencias de precaución de tus consejeros. ¿Quizás podrías guardar parte del botín de tu victoria como reserva si estos funestos presagios se cumplen?"
 podintroductions.189.a: "Puedo esperar un poco más antes de disfrutar de la no-muerte."
 podintroductions.189.b: "¡Mi dinero para hacer lo que quiera!"
 mritunjay_intro_tooltip: "Planificarás con anticipación en caso de que los mongoles se acerquen a tu ciudad."

 baghdad_recovering_modifier: "Recuperándose"
 baghdad_recovering_modifier_desc: "Gracias a tu cuidadosa planificación, el daño causado por el ejército mongol podría haber sido mucho peor. La ciudad se está recuperando."

 PODcanon_chars.47.t: "El Príncipe Sabio"
 PODcanon_chars.47.desc: "El ejército mongol finalmente ha detenido su saqueo y destrucción de la hermosa ciudad de Bagdad. Ha sido una experiencia angustiosa, pero gracias a tus cuidadosas preparaciones, pudiste salvar la mayor parte. Te estremeces al pensar lo que habría pasado si no hubieras estado tan preparado como lo estabas.\nBueno, el tiempo avanza como siempre, pero al menos tu amada Bagdad seguirá siendo un gran centro de aprendizaje y cultura gracias a tus esfuerzos."
 PODcanon_chars.47.a: "Elegí bien hace treinta años."

 podintroductions.190.t: "Tu Historia Hasta Ahora"
 podintroductions.190.desc: "Lady Marcia, has estado trabajando duro para completar tu tratado sobre el $pod_clan$ Ravnos y sus numerosas castas. Sin embargo, es posible que tengas que centrar tu atención en otro lugar por un tiempo.\nDurante tus viajes, notaste la caída en la decadencia de una gran parte del $pod_clan$, muy lejos de las nobles virtudes que tu [Glossary('Sire','game_concept_Sire_desc')] y tú misma defienden. Si actúas con la suficiente rapidez, podrías ofrecer un punto de reunión y un ejemplo a seguir para las generaciones más jóvenes, quizás salvando el legado de tu $pod_clan$ en el proceso. Incluso podrías escribir uno o dos capítulos sobre ello en tu Magnum Opus si tienes tiempo."
 podintroductions.190.a: "Hora de actuar."
 marcia_intro_tooltip: "Como Marcia, tienes una decisión especial para centrarte en tus escritos por un tiempo, dándote una opción entre varias bonificaciones de estilos de vida."

 marcia_decision: "Del Clan Ravnos"
 marcia_decision_tooltip: "No hay tiempo para el bloqueo del escritor."
 marcia_decision_desc: "No has olvidado tu trabajo interminable de referenciar cada linaje del $pod_clan$ Ravnos. Deberías continuar."
 marcia_decision_confirm: "¿Qué tema será..."
 marcia_decision_effect_tooltip: "Se te presentará una selección de temas en los que centrarte."

 PODcanon_chars.48.t: "Del Clan Ravnos"
 PODcanon_chars.48.desc: "A medida que continúas tu revisión de los diversos linajes de tu $pod_clan$, aprendes más y más sobre sus especialidades. Como con cualquier buen libro, estás bastante seguro de que terminarás aprendiendo tanto al hacerlo como tus lectores al leerlo."
 PODcanon_chars.48.a: "Los Phaedymitas, orgullosos caballeros."
 PODcanon_chars.48.b: "Los Phuri Dae, astutos tricksters."
 PODcanon_chars.48.c: "Los Alejandrinos, astutos mercaderes."
 PODcanon_chars.48.d: "Los Bashirites, ingeniosos fanáticos."

 podintroductions.191.t: "Tu Historia Hasta Ahora"
 podintroductions.191.desc: "Lady Zoe, después de perder tanto tu ciudad como tu [Glossary('Sire','game_concept_Sire_desc')] en rápida sucesión, estuviste casi perdida en la desesperación y la ira. Afortunadamente, Anatole te tomó bajo su protección y ambos crecieron para ser mejores personas gracias a ello.\nClaramente te sientes en deuda con él, así que has aceptado seguirlo en su última misión en el sur de Francia. Quizás sea aquí donde finalmente encuentres un propósito para tu no-muerte? Muchas personas perdieron tanto como tú debido a la Cruzada Albigense, y podrías ayudarles a reconstruir. Estás segura de que Anatole estará de acuerdo con este plan, y probablemente incluso te ayudaría de nuevo si pudiera."
 podintroductions.191.a: "¿Quizás un nuevo hogar?"
 zoe_intro_tooltip: "Como Zoe, tienes un [character_interaction|E] especial con Anatole para pedir su ayuda."

 POD_zoe_interaction: "Creciendo Juntos"
 POD_zoe_interaction_desc: "Anatole y tú aún podéis aprender mucho el uno del otro."

 PODcanon_chars.49.t: "Dos Almas Perdidas"
 PODcanon_chars.49.desc: "Anatole es un hombre complicado, a menudo perdido en sus visiones. Pero cuando está mentalmente presente, siempre ha sido amable y paciente contigo. A menudo te dice crípticamente que eres uno de sus 'anclajes' al mundo real, y parece sinceramente agradecido por tu amistad.\nEn cualquier caso, pasar tiempo juntos siempre termina con ambos ganando una nueva perspectiva sobre las cosas. Un largo camino hacia la sabiduría, pero uno con un amigo a tu lado al menos."
 PODcanon_chars.49.a: "Charlemos esta noche."
 PODcanon_chars.49.b: "Qué tal... ya veo."
 PODcanon_chars.49.c: "¿Tuviste una visión? Podemos entenderla juntos."
 PODcanon_chars.49.d: "¿Rezar?... podría ayudar."

 etienne_support_modifier: "Vasallo Nominal de Jürgen"
 etienne_support_modifier_desc: "Jürgen von Verden todavía te considera su vasallo y te ofrece apoyo y ayuda, a pesar de las grandes distancias involucradas."

 podintroductions.192.t: "Tu Historia Hasta Ahora"
 podintroductions.192.desc: "Lord Etienne, estás atrapado entre dos fuerzas opuestas. Tras la reciente Cruzada, has asegurado tu control sobre Acre gracias a la ayuda de los caballeros alemanes de Jürgen von Verden, y luego le juraste lealtad a cambio. Pero el reciente nacimiento de la Dieta de los Olivos te ha presionado.\nSu líder, Qawiyya el Ghaduba, quiere tu lealtad ya que claramente estás en su esfera de influencia. Jürgen está demasiado lejos para importar realmente, pero ha prometido apoyo si, al menos nominalmente, sigues siendo su vasallo. Esto probablemente enfurecería a Qawiyya, sin embargo."
 podintroductions.192.a: "Tengo que ser pragmático aquí."
 podintroductions.192.b: "Mantendré mi palabra."

 podintroductions.193.t: "Tu Historia Hasta Ahora"
 podintroductions.193.desc: "Lady Kemintiri, acabas de despertar de un largo $pod_torpor$ después de una horrible lucha contra una de las malditas criaturas de Set. Soportaste, como siempre haces.\nSet te quitó todo, excepto la única cosa que realmente quería, y le devolverás el favor. Su patético linaje de compinches y aduladores debe ser purgado. Es cierto, estás sola contra todo el poder de un $pod_clan$ entero, pero... hay una razón muy real por la que ya te temen. Y les darás más en el futuro."
 podintroductions.193.a: "Espero que estés mirando."
 kemintiri_intro_tooltip: "Como Kemintiri, tienes un objetivo especial para destruir el culto de Set."

 kemintiri_decision: "La Venganza de Isis"
 kemintiri_decision_tooltip: "La serpiente debe ser aplastada."
 kemintiri_decision_desc: "Cuando los Setitas y su maldito culto ya no existan y el nombre de Set haya sido arrastrado por el barro... entonces estarás a mano con él."
 kemintiri_decision_confirm: "Isis se apiadó de mí"
 kemintiri_decision_effect_tooltip: "La religión Setita desaparecerá, y sus adherentes se convertirán a la Vía Humanitatis en su lugar."

 podintroductions.194.t: "Tu Historia Hasta Ahora"
 podintroductions.194.desc: "Lord Andreas, eres renombrado como un [ashen_caravan|E] justo y confiable. Es cierto que a menudo usas estos viajes para predicar la gloria de Set, pero sin embargo siempre cumples tu palabra.\nRecientemente has hecho una parada en esta región, tomándote el tiempo para enseñar a tus nuevos reclutas sobre su papel en los planes de Set y, menos importante, en tu caravana. Pronto será hora de partir de nuevo, pero los caminos se vuelven más difíciles cada año. Afortunadamente, tu fuerte núcleo de seguidores y tu impecable reputación aseguran que tienes mucha ayuda potencial y contactos que te asistirán en el futuro si es necesario."
 podintroductions.194.a: "Honra a Set, y honra tu palabra."
 andreas_intro_tooltip: "Como Andreas, comienzas con varios patrones que ya te apoyan de tus tratos anteriores con ellos."

 #andreas_decision: "El Maestro de la Caravana"
 #andreas_decision_tooltip: "Revisemos las posibilidades."
 #andreas_decision_desc: "Como renombrado maestro de caravanas, siempre tienes oportunidades para aceptar varias proposiciones de $pod_cainites$ errantes."
 #andreas_decision_confirm: "Hablemos de negocios"
 #andreas_decision_effect_tooltip: "Se te ofrecerán varias ofertas de trabajo."
 # 
 #andreas_away_modifier: "El Maestro de la Caravana"
 #andreas_away_modifier_desc: "Andreas está guiando una de sus caravanas, lo que le hace moverse mucho y no centrarse realmente en su reino por el momento."
 # 
 #PODcanon_chars.50.t: "El Maestro de la Caravana"
 #PODcanon_chars.50.desc: "Siempre tienes muchas ofertas para trabajar como guía gracias a tu estelar reputación. Como siempre, también usarás este tiempo fuera de tu reino para difundir la palabra de Set por todas partes, pero queda una pregunta: ¿Cuánto durará el viaje? Hay límites sobre cuánto tiempo puedes pasar fuera sin que tu reino sufra."
 #PODcanon_chars.50.a: "Un pequeño viaje estará bien."
 #PODcanon_chars.50.b: "Puedo manejar ese."
 #PODcanon_chars.50.c: "El reino estará bien sin mí."
 #PODcanon_chars.50.d: "Soy necesario aquí."

 podintroductions.195.t: "Tu Historia Hasta Ahora"
 podintroductions.195.desc: "Lord Nakhthorheb, eres el regente de Set hasta que él considere que el mundo es lo suficientemente digno para regresar. Pero tienes que trabajar con los otros Hierofantes.\nEsta augusta asamblea sabiamente se aplaza a ti la mayor parte del tiempo, pero aún ofrecen consejos útiles cuando es necesario. Como principal guardián de Set, es tu deber proteger al $pod_clan$ y atraer a los incrédulos al redil. Un proceso largo sin duda, pero tienes la eternidad de tu lado."
 podintroductions.195.a: "Gloria al Amo de Duat."
 nakh_intro_tooltip: "Como Nakhthorheb, puedes usar una pequeña decisión para convocar una reunión de los Hierofantes mientras Seterpenre y Maatkare estén vivos."

 nakh_decision: "Reunión de los Hierofantes"
 nakh_decision_tooltip: "Tenemos que hablar."
 nakh_decision_desc: "Como principal líder del $pod_clan$ Setita, aún tienes que escuchar otras opiniones sobre la situación. Tus compañeros Hierofantes son los más confiables para tal papel."
 nakh_decision_confirm: "En el orden del día de esta noche..."
 nakh_decision_effect_tooltip: "Se te ofrecerá un curso de acción para los próximos cinco años."
 nakh_custom_decision: "Esta decisión estará disponible mientras [GetScriptedCharacterByHistoryID('790126').GetFirstName] o [GetScriptedCharacterByHistoryID('790128').GetFirstName] estén vivos"

 seterpenre_advice_modifier: "Consejo de Seterpenre"
 seterpenre_advice_modifier_desc: "El previsor Seterpenre siempre quiere centrarse en las relaciones exteriores y la imagen de tu $pod_clan$."

 maatkare_advice_modifier: "Consejo de Maatkare"
 maatkare_advice_modifier_desc: "La paciente Maatkare quiere centrarse en tu propia tierra, haciendo de Egipto el mejor lugar de la Tierra, digno del regreso de Set."

 PODcanon_chars.51.t: "Reunión de los Hierofantes"
 PODcanon_chars.51.desc: "Este tipo de evento es siempre muy predecible. Los vampiros no cambian mucho, después de todo, y sus posiciones políticas tampoco. Como el Hierofante más importante de todos, tienes el lujo de tener siempre la última palabra, pero incluso tú sabes que, a veces, escuchar los consejos de otras personas puede ser gratificante."
 PODcanon_chars.51.a: "Seterpenre, seguiremos tu plan."
 PODcanon_chars.51.b: "Maatkare, tienes razón esta vez."
 PODcanon_chars.51.c: "¡Haremos las cosas a mi manera!"

 podintroductions.196.t: "Tu Historia Hasta Ahora"
 podintroductions.196.desc: "Lady Neferu, tu Corte de Fuego crece en poder cada noche. Pero puedes hacer más.\nTu reputación como maestra de misterios y corrupción está bien merecida y hay pocos seres que puedan abandonar la Corte sin comprometer su alma inmortal a Set. Esta es una reputación que debes fomentar, ya que ayudará a tu ascenso en la jerarquía de Set. Pronto, todos aprenderán a temer y amar tu tierno cuidado por igual."
 podintroductions.196.a: "Bienvenido, disfruta de tu estancia..."
 neferu_intro_tooltip: "Como Neferu, tienes una opción de liberación especial para tus prisioneros usando la Corte de Fuego."

 NEFERU_RELEASE: "Pruebas de la Corte de Fuego"

 sarrasine_running_modifier: "Huyendo"
 sarrasine_running_modifier_desc: "Los seguidores de Khay'Tall todavía te están cazando. Esto ciertamente complica las cosas."

 podintroductions.197.t: "Tu Historia Hasta Ahora"
 podintroductions.197.desc: "Lord Sarrasine, las cosas no salieron realmente como planeabas. Tu $pod_diablerie$ de Khay'Tall fracasó y tuviste que escapar apresuradamente para salvar tu piel de sus seguidores enfadados. Hora de recuperarse.\nTe has unido a los restos de la 4ª Cruzada, ya que percibes debilidad en ellos; podrían ser derribados desde dentro, y los griegos están demasiado ocupados retomando Constantinopla para aprovechar la oportunidad. Como tal, podrías ser capaz de tallar tu propio feudo en Anatolia antes de que nadie más pueda reaccionar. Solo entonces serás lo suficientemente fuerte para evitar a tus perseguidores para siempre."
 podintroductions.197.a: "Hora de mudar mi piel."
 sarrasine_intro_tooltip: "Como Sarrasine, comienzas con un modificador negativo del que puedes deshacerte con una decisión especial."

 sarrasine_decision: "Fin de la Línea"
 sarrasine_decision_tooltip: "Estoy cansado de huir."
 sarrasine_decision_desc: "Los seguidores de Khay'Tall solo dejarán de cazarte cuando te vuelvas lo suficientemente fuerte para asustarlos. ¿Qué mejor lugar para hacerlo que el desmoronado Imperio Bizantino?"
 sarrasine_decision_confirm: "¿Quién huye ahora?"

 podintroductions.198.t: "Tu Historia Hasta Ahora"
 podintroductions.198.desc: "Lord Arnulf, tu culto a Jormungandr está creciendo bien, bastante ayudado por la agitación en la región. Aún así, hay problemas que resolver.\nEl más importante entre ellos es Valdis, tu propio vástago, que tiene ideas extravagantes sobre un culto 'adecuado' a los Dioses Escandinavos. Seamos honestos por un segundo, tú estás aquí por el dinero y el poder, y estás más que feliz de dejar las cosas divinas a los sacerdotes.\nSin embargo, podrías necesitar a Valdis en el futuro y hacer avances hacia una reconciliación, por poco sincera que sea, podría ser un movimiento sabio."
 podintroductions.198.a: "¡Por supuesto que me importan los Dioses, Valdis!"
 podintroductions.198.b: "Nah, es una causa perdida."

 podintroductions.199.t: "Tu Historia Hasta Ahora"
 podintroductions.199.desc: "Lord Jean-Baptiste, la no-muerte se ve bastante bien. Tu comienzo fue difícil, pero te recuperaste bien y ahora eres uno de los 'empresarios nocturnos' más exitosos de Francia.\nProporcionas entretenimiento de calidad para la más alta esfera de los políticos mortales y $pod_cainites$. Hay dinero que hacer, y si el dicho sobre el dinero y el poder es cierto, estás a punto de volverte muy poderoso muy pronto."
 podintroductions.199.a: "¡Hora de expandir mis actividades!"
 jean_intro_tooltip: "Como Jean-Baptiste, tienes acceso a una cadena de edificios única: Influenciando la Vida Nocturna."

 building_type_influence_night_life_01: "Influenciando la Vida Nocturna"
 building_type_influence_night_life_01_desc: "#F El agudo sentido comercial de Jean-Baptiste puede ser bien utilizado en esta provincia.#!"
 building_influence_night_life_01: "Influenciando las Casas de Juego"
 building_influence_night_life_01_desc: "La casa siempre gana."
 building_influence_night_life_02: "Influenciando las Tabernas"
 building_influence_night_life_02_desc: "Olvida tus penas, pero no tu bolsa."
 building_influence_night_life_03: "Influenciando los Burdeles"
 building_influence_night_life_03_desc: "Donde supuestamente nadie va, pero que de todos modos están misteriosamente llenos cada noche."

 podintroductions.200.t: "Tu Historia Hasta Ahora"
 podintroductions.200.desc: "Lord Goratrix, a pesar de todo lo que has hecho por la Casa, el propio Tremere te exilió a Francia. Claramente un síntoma de una enfermedad mayor que corroe a tu $pod_clan$.\n¡Y ciertamente no será ese bufón balbuceante de Etrius quien descubra la verdad! Ese idiota todavía está tratando de socavarte, incluso mientras ha sido nombrado Regente de la Casa Tremere. No importa, usarás la fértil situación política en Francia para crear tu propia base de poder, y luego regresar triunfante a las tierras centrales de los Tremere. Salvarás a tu Casa, incluso de sí misma si es necesario."
 podintroductions.200.a: "Regresaré."
 goratrix_intro_tooltip: "Como Goratrix, sufrirás las maquinaciones de Etrius mientras él esté vivo."

 PODcanon_chars.52.t: "Las Maquinaciones de Etrius"
 PODcanon_chars.52.desc: "Una de las intrigas de Etrius para socavarte ha sido descubierta. Como siempre, es un débil intento de un tonto de mente débil. Lamentablemente, todavía está interrumpiendo tus propios planes en el futuro previsible y tendrás que lidiar con ello de alguna manera."
 PODcanon_chars.52.a: "Soborna a los tontos que trabajan para él."
 PODcanon_chars.52.b: "¡Tengo gente para lidiar con esto!"
 PODcanon_chars.52.c: "Bien, ¡lo haré yo mismo!"

 podintroductions.201.t: "Tu Historia Hasta Ahora"
 podintroductions.201.desc: "Lady Meerlinda, a pesar de algunas dificultades, has podido establecer una fuerte presencia Tremere en Inglaterra. Mitras no te está haciendo la vida fácil, sin embargo, y tendrás que observar sus próximos movimientos con cuidado.\nTambién has estado buscando información sobre el legendario Santo Grial y su efecto en los vampiros. Con este fin, has identificado dos fuentes probables, los castillos de Avalon y de las Cenizas Amargas, donde residen dos órdenes de 'caballeros vampiros'. Si pudieras explorar estas fortalezas, podrías encontrar, si no el Grial mismo, al menos algunos datos interesantes sobre él."
 podintroductions.201.a: "Quizás soy la Morgan le Fay de estas tierras."
 meerlinda_intro_tooltip: "Como Meerlinda, tienes un objetivo especial para asegurar los dos castillos por una recompensa."

 meerlinda_morgan_modifier: "Morgan le Fay Renacida"
 meerlinda_morgan_modifier_desc: "Meerlinda no encontró el Grial, pero ciertamente encontró algo. Es la bella, poderosa y terrible Hechicera de estas islas ahora."

 meerlinda_decision: "Hada de Inglaterra"
 meerlinda_decision_tooltip: "Las leyendas a menudo tienen una chispa de verdad en ellas."
 meerlinda_decision_desc: "Los castillos de Avalon y de las Cenizas Amargas seguramente albergan algunos secretos sobre el Santo Grial. Asegúralos y toma sus poderes ocultos para ti."
 meerlinda_decision_confirm: "...¿quién necesita a Arturo?"

 podintroductions.202.t: "Tu Historia Hasta Ahora"
 podintroductions.202.desc: "Lord Jervais, tu ascenso continúa. Gracias a tu gran conocimiento de la escena diplomática germánica, se te ha encomendado una misión gratificante, si es difícil. Destruir a la líder de los cismáticos conocidos como 'Tremere Telyavelic', Deverra, y a los Gangrel que la apoyan.\nHas reunido una coterie de compañeros de clan confiables y talentosos, pero aún estás muy superado en número por los enemigos. Este podría ser tu mayor desafío hasta ahora."
 podintroductions.202.a: "Planifiquemos con cuidado."
 jervais_intro_tooltip: "Como Jervais, tienes un objetivo especial para deshacerte de Deverra y los Ferales de Livonia por una recompensa."

 jervais_rising_modifier: "La Estrella Ascendente"
 jervais_rising_modifier_desc: "El ascenso de Jervais en la Pirámide de los Tremere continúa a un ritmo rápido, impresionando al $pod_clan$ en su conjunto."

 jervais_decision: "El Azote de Livonia"
 jervais_decision_tooltip: "Debo terminar este cisma antes de que se extienda."
 jervais_decision_desc: "Las órdenes de Etrius son claras. Mata a la líder de los Telyavelic, Deverra, y a los Ferales de Livonia que la protegen."
 jervais_decision_confirm: "Misión cumplida"
 jervais_custom_decision: "[GetScriptedCharacterByHistoryID('790106').GetFirstName] debe estar muerta"
 jervais_custom_decision2: "[GetTitleByKey('k_ferals_livonia').GetNameNoTier] debe ser destruido"

 rutor_running_modifier: "Huyendo"
 rutor_running_modifier_desc: "Los Tremere te quieren muerto por tu traición y te están cazando. Esto ciertamente complica las cosas."

 podintroductions.203.t: "Tu Historia Hasta Ahora"
 podintroductions.203.desc: "Lord Rutor, estás harto de que te den órdenes, ya sea por Tzimisce o Tremere. Nunca más te inclinarás ante nadie.\nEscapaste de la Casa Tremere huyendo hacia Dinamarca, una elección fortuita ya que la región carece de un poder vampírico centralizado fuerte. ¿Quizás podrías ser tú? Si actuaras con la suficiente rapidez y decisión para asegurar una base de poder sólida, tu $pod_clan$ tendría que renunciar a su caza. Entonces, finalmente sería tu turno de dar órdenes, una perspectiva muy tentadora, ciertamente."
 podintroductions.203.a: "¿Un nuevo comienzo?"
 rutor_intro_tooltip: "Como Rutor, tienes una decisión especial para deshacerte de tu modificador inicial."

 rutor_decision: "Fin de la Línea"
 rutor_decision_tooltip: "Estoy cansado de huir."
 rutor_decision_desc: "El $pod_clan$ Tremere nunca dejará de cazarte, a menos que seas lo suficientemente fuerte para hacerlos detenerse. Hora de convertirte en tu propio amo."
 rutor_decision_confirm: "¿Quién huye ahora?"

 faithful_xavier_modifier: "Consejero Leal"
 faithful_xavier_modifier_desc: "Un paradigma de la élite Tremere, nadie duda del compromiso de Xavier con la causa."

 unfaithful_xavier_modifier: "¿Consejero Leal?"
 unfaithful_xavier_modifier_desc: "Nadie duda del compromiso de Xavier con la causa... en público al menos."

 podintroductions.204.t: "Tu Historia Hasta Ahora"
 podintroductions.204.desc: "Lord Xavier, has llegado al norte de África decidido a descubrir los misterios de este continente para la gloria de tu $pod_clan$. Al menos, esa es la versión oficial.\nEn verdad, el resto del consejo no estaba realmente contento con tu decisión de dejarlos mientras el corazón mismo está asediado. Pero no les diste opción, ya que estás cansado de las mezquinas intrigas en casa y ansías algo más grande. Tendrás que equilibrar cuidadosamente tus deberes oficiales con los Tremere con tu incesante búsqueda de conocimiento y secretos."
 podintroductions.204.a: "¡Por la gloria del Clan Tremere!"
 podintroductions.204.b: "Por la gloria del Clan Tremere..."

 therimna_secrets5_modifier: "Secretos Restantes: 5"
 therimna_secrets5_modifier_desc: "Estás vendiendo todo lo que sabes sobre el $pod_clan$ Tremere al mejor postor. Eso te da algunos amigos... y algunos enemigos."

 therimna_secrets4_modifier: "Secretos Restantes: 4"
 therimna_secrets4_modifier_desc: "Estás vendiendo todo lo que sabes sobre el $pod_clan$ Tremere al mejor postor. Eso te da algunos amigos... y algunos enemigos."

 therimna_secrets3_modifier: "Secretos Restantes: 3"
 therimna_secrets3_modifier_desc: "Estás vendiendo todo lo que sabes sobre el $pod_clan$ Tremere al mejor postor. Eso te da algunos amigos... y algunos enemigos."

 therimna_secrets2_modifier: "Secretos Restantes: 2"
 therimna_secrets2_modifier_desc: "Estás vendiendo todo lo que sabes sobre el $pod_clan$ Tremere al mejor postor. Eso te da algunos amigos... y algunos enemigos."

 therimna_secrets1_modifier: "Secreto Restante: 1"
 therimna_secrets1_modifier_desc: "Estás vendiendo todo lo que sabes sobre el $pod_clan$ Tremere al mejor postor. Eso te da algunos amigos... y algunos enemigos."

 podintroductions.205.t: "Tu Historia Hasta Ahora"
 podintroductions.205.desc: "Lady Therimna, los Tremere están acabados, lo sabes. Y no te hundirás con ese barco.\nEscapaste de tu $pod_clan$ con muchos secretos interesantes sobre la hechicería de sangre bajo tu manga, secretos que muchos pagarían caro por adquirir. Estos podrían ser tu salvavidas, ya que eres demasiado importante para matar mientras los tengas... pero también eres un objetivo mucho más importante para eliminar para los propios Tremere.\nTendrás que lograr un equilibrio entre vender tus secretos por algo de oro siempre importante y guardarlos por el margen de maniobra que te dan."
 podintroductions.205.a: "Mi supervivencia es todo lo que importa."
 therimna_intro_tooltip: "Como Therimna, comienzas con 5 secretos que puedes vender mediante una pequeña decisión, cambiando el equilibrio entre la penalización y la bonificación que te dan."

 therimna_decision: "Moneda de Cambio"
 therimna_decision_tooltip: "Todo tiene un precio."
 therimna_decision_desc: "Los secretos de hechicería de sangre que posees te convierten en un objetivo para los Tremere, pero también te convierten en alguien demasiado importante para que otros te maten. ¿Estás dispuesta a intercambiar esta relativa tranquilidad por oro?"
 therimna_decision_confirm: "Trato hecho"

 podintroductions.206.t: "Tu Historia Hasta Ahora"
 podintroductions.206.desc: "Lady Virstania, finalmente has encontrado consuelo y compañía en tus amadas Gárgolas. Lejos de la crueldad y brutalidad del resto de tus hermanos, solo ellas te entienden verdaderamente.\nTu corazón duele ante la idea de enviarlas a la masacre por las insensatas guerras de los Tremere. Por ahora, sin embargo, tienes pocas opciones y debes seguir su juego. Pero estás dedicada a cambiar eso pronto. Después de todo, tus hermosos bebés solo pueden ser verdaderamente cuidados por su amorosa madre..."
 podintroductions.206.a: "La familia es todo lo que importa."
 virstania_intro_tooltip: "Como Virstania, puedes usar una decisión para generar regimientos de soldados Gárgolas."

 virstania_decision: "Hermosos Bebés de Piedra"
 virstania_decision_tooltip: "¡Más de ellos vienen!"
 virstania_decision_desc: "Eres la madre de las Gárgolas, y debes ayudarlas a nacer adecuadamente. Una gran responsabilidad, pero también tu mayor alegría."
 virstania_decision_confirm: "Shhh... Mamá está aquí"
 virstania_decision_effect_tooltip: "Tendrás una opción sobre cuántas Gárgolas generar."

 PODcanon_chars.53.t: "El Nacimiento"
 PODcanon_chars.53.desc: "El próximo grupo de Gárgolas está casi listo. Sin embargo, los codiciosos Tremere ya están tratando de arrebatártelas, y tendrás que actuar rápido si quieres salvarlas. ¿A cuántas ayudarás?"
 PODcanon_chars.53.a: "Al menos salvé a algunas de ellas."
 PODcanon_chars.53.b: "¡Debo salvar más!"
 PODcanon_chars.53.c: "¡A todas!"
 PODcanon_chars.53.d: "No puedo ayudarlas esta vez..."
 virstania_small_gargoyles_tt: "Un grupo de Gárgolas se añade a tus soldados disponibles."
 virstania_medium_gargoyles_tt: "Dos grupos de Gárgolas se añaden a tus soldados disponibles."
 virstania_high_gargoyles_tt: "Tres grupos de Gárgolas se añaden a tus soldados disponibles."

 angry_fays_marconius_modifier: "Hadas Enfadadas"
 angry_fays_marconius_modifier_desc: "Estás aprendiendo mucho experimentando con las misteriosas Hadas... pero también estás haciendo poderosos enemigos."

 podintroductions.207.t: "Tu Historia Hasta Ahora"
 podintroductions.207.desc: "Lord Marconius, has estado trabajando duro para tratar de entender tu nueva condición como Kiasyd. Obviamente, el mejor curso de acción era 'experimentar' con algunas Hadas capturadas, ya que pareces compartir algunas similitudes con ellas. Sin embargo, no están contentas con eso.\nTambién sabes que el $pod_clan$ Lasombra está buscando cualquier signo de debilidad para atacarte, y este cisma con tus aliados podría ser lo que estaban esperando. Puede que necesites tener cuidado al equilibrar tu sed de conocimiento y tu precaria alianza con las Hadas."
 podintroductions.207.a: "Una situación desconcertante."
 marconius_intro_tooltip: "Como Marconius, tienes acceso a una decisión para equilibrar tu relación con las Hadas."

 marconius_decision: "Tú y las Hadas"
 marconius_decision_tooltip: "Cómo abordarlas..."
 marconius_decision_desc: "Las Hadas son una parte importante de tu reino, te guste o no. Como tal, tu postura hacia ellas debe ser elegida cuidadosamente."
 marconius_decision_confirm: "¿Hora de reconsiderar mi elección?"
 marconius_decision_effect_tooltip: "Tendrás una opción sobre cómo abordar a las Hadas en el futuro previsible."

 happy_fays_marconius_modifier: "Hadas Útiles"
 happy_fays_marconius_modifier_desc: "Las Hadas te consideran un aliado útil, aunque voluble, y te prefieren en el trono antes que a otro vampiro por el momento."

 PODcanon_chars.54.t: "Tú y las Hadas"
 PODcanon_chars.54.desc: "Tu reino está repleto de Hadas, gracias a su importancia histórica entre su especie, y debes lidiar con ello. Son aliadas útiles, especialmente contra posibles represalias de tus compañeros de clan, pero también son sujetos de prueba muy interesantes para aprender más sobre tu condición como $pod_cainite$ tocado por las Hadas. Decisiones, decisiones..."
 PODcanon_chars.54.a: "Lamentablemente, las necesito como aliadas ahora mismo."
 PODcanon_chars.54.b: "Mantendré mis distancias por un tiempo."
 PODcanon_chars.54.c: "¡Tanto que aprender!"

 podintroductions.208.t: "Tu Historia Hasta Ahora"
 podintroductions.208.desc: "Lord Chinkhai, tu deber es proteger a los [Glossary('Anda','podgloss.anda')]. Sin embargo, las estepas son vastas, y tienes que vagar mucho para lidiar con los diversos problemas que surgen noche tras noche.\nHa empeorado desde que tu pueblo ha comenzado a considerarte la máxima autoridad para resolver disputas y otros conflictos menores. Como 'Juez de las Estepas' informal, tienes mucho poder, poder que estás empezando a entender lo suficiente como para usarlo para el bien mayor de tus hermanos. Lo sepan o no."
 podintroductions.208.a: "Juez y Señor de la Guerra."
 chinkhai_intro_tooltip: "Como Chinkhai, tienes un [character_interaction|E] especial disponible con tus vasallos para emitir un juicio."

 POD_chinkhai_interaction: "Juez de las Estepas"
 POD_chinkhai_interaction_desc: "Estoy en sesión."

 PODcanon_chars.55.t: "El Juicio"
 PODcanon_chars.55.desc: "Como la máxima autoridad en la Horda [Glossary('Anda','podgloss.anda')], eres completamente libre de comenzar y terminar cualquier juicio de la manera que prefieras. Sin embargo, tienes una reputación que mantener, y demasiada indulgencia podría ser vista como una debilidad."
 PODcanon_chars.55.a: "¡Inocente!"
 PODcanon_chars.55.b: "¡Culpable!"
 PODcanon_chars.55.c: "Este caso no es concluyente."

 podintroductions.209.t: "Tu Historia Hasta Ahora"
 podintroductions.209.desc: "Magda la Temible, un invasor más intenta profanar tu hermosa isla. Este Mitras es solo el último de una larga lista de conquistadores extranjeros que toman lo que es tuyo. No lo permitirás.\nTu pueblo se ha ido hace tiempo y tu fe es apenas un recuerdo, incluso para ti en este punto. Solo queda tu furia, y es hora de dejar que hable por ti. Las islas han sido corrompidas más allá de toda reparación y tendrás que destruir todo a tu paso para purificarlas de nuevo.\nSerá sangriento, pero solo están cosechando lo que siembran."
 podintroductions.209.a: "Todos pagarán."
 magda_intro_tooltip: "Como Magda, tienes acceso a una línea de edificios especial en condados con bajo desarrollo."

 building_type_magda_purge_01: "Purga de Magda"
 building_type_magda_purge_01_desc: "#F Solo con un nuevo comienzo las islas se recuperarán. Un nuevo comienzo fresco y sangriento.#!"
 building_magda_purge_01: "Manadas de Magda"
 building_magda_purge_01_desc: "Manadas de Gangrel feroces bajo el mando de Magda deambulan por esta tierra, sembrando terror y muerte a su paso.\nEste edificio necesita menos de 11 de desarrollo en el condado para ser construido y permanecer activo."
 building_magda_purge_02: "Horda de Magda"
 building_magda_purge_02_desc: "La ley salvaje del más fuerte ha retomado el control aquí. La civilización se derrumba bajo las garras y colmillos de la vengativa horda de Magda.\nEste edificio necesita menos de 6 de desarrollo en el condado para ser construido y permanecer activo."

 podintroductions.210.t: "Tu Historia Hasta Ahora"
 podintroductions.210.desc: "Lady Catubodua, finalmente has dejado Francia después de bastante tiempo pasado aquí. Finalmente encontraste lo que buscabas y es hora de seguir adelante.\nEl propio Brujah confió en ti para mantener a su $pod_clan$ en el camino correcto, pero la tarea es inmensa. Tendrás que darte a conocer al resto de tus hermanos y hacer crecer tu ya impresionante leyenda. Solo entonces aceptarán que eres la verdadera heredera del legado de Brujah."
 podintroductions.210.a: "Hay mucho por hacer."
 catubodua_intro_tooltip: "Como Catubodua, no puedes $pod_Embrace$ ya que juró no volver a hacerlo después de su primer vástago.\nTambién tienes acceso a una decisión especial para hacer crecer tu leyenda e impresionar al resto del clan."

 catu_heir_of_brujah_modifier: "Heredera de Brujah"
 catu_heir_of_brujah_modifier_desc: "Finalmente, el $pod_clan$ Brujah está sanando. Una heredera digna de Brujah y Troile se ha levantado y liderará a los Guerreros-Eruditos hacia una nueva y brillante era."

 catubodua_decision: "La Renovación de los Brujah"
 catubodua_decision_tooltip: "No puedo fallarle."
 catubodua_decision_desc: "Los orgullosos Brujah no aceptarán a un nuevo gobernante a menos que él o ella represente a la perfección tanto el aspecto Guerrero como el Erudito de su $pod_clan$. Todo mientras es también un gobernante exitoso, obviamente."
 catubodua_decision_confirm: "Una nueva era comienza"

 podintroductions.211.t: "Tu Historia Hasta Ahora"
 podintroductions.211.desc: "Lady Deverra, tu gente está en grave peligro. A medida que los seguidores cristianos se vuelven más y más agresivos, el $pod_clan$ Tremere ha enviado una coterie liderada por Jervais para matarte a ti y a los otros Telyavelic.\nAfortunadamente, encontraste a Qarakh y ahora estás bajo la protección de los Ferales de Livonia. Aún así, no descansarás hasta que este ataque de los Tremere sea resuelto y las fronteras de los Ferales estén seguras. La seguridad tuya y de los tuyos está en juego."
 podintroductions.211.a: "Telyavel nos bendice."
 deverra_intro_tooltip: "Como Deverra, tienes un objetivo especial para deshacerte de Jervais y expandir las fronteras de los Ferales hacia el Este.\nTambién comienzas en una Lucha de Poder con Qarakh."

 deverra_blessed_modifier: "Campeona de Telyavel"
 deverra_blessed_modifier_desc: "Deverra es claramente la elegida de Telyavel. Su fe irradia para que todos la vean, un recordatorio para los seguidores de la Cruz de que aún no han ganado."

 deverra_decision: "Campeona de Telyavel"
 deverra_decision_tooltip: "No puedo fallarle."
 deverra_decision_desc: "Tu gente depende de ti y de la protección de los Ferales en los tiempos turbulentos que se avecinan. Si pudieras matar al líder de los Tremere atacantes y asegurar tu frontera occidental, tu situación mejoraría."
 deverra_decision_confirm: "Hemos resistido"
 deverra_custom_decision: "[GetScriptedCharacterByHistoryID('790359').GetFirstName] debe estar muerto"
 deverra_custom_decision2: "Tú o tu señor controláis completamente el ducado de [GetTitleByKey('d_pomerelia').GetNameNoTier]"
 deverra_custom_decision3: "Tú o tu señor controláis completamente el ducado de [GetTitleByKey('d_prussia').GetNameNoTier]"

 podintroductions.212.t: "Tu Historia Hasta Ahora"
 podintroductions.212.desc: "Lady Dyanang, tu Corte está dividida.\nLos [akuma|E] infernalistas están surgiendo de aparentemente todas partes, los Ancestros regionalistas están ignorando tus convocatorias y tu antigua alumna Piyau Payung aparentemente está preparando algún tipo de gran retribución. Sin embargo, no todo está perdido.\nGracias a tu alianza con el Pueblo Feroz de las selvas de Dai Viet y Angkor, todavía tienes un as poderoso bajo la manga. Numerosos favores y pactos te vinculan a ellos y, aunque serías cautelosa al pedir demasiado a estos caprichosos cambiaformas, deberían estar felices de prestarte ayuda contra los más taimados de tus enemigos. Su ayuda debería ser suficiente para restaurar el orden en tu Corte."
 podintroductions.212.a: "El Fénix Escarlata aún no está listo para renacer."
 dyanang_intro_tooltip: "Como Dyanang, tienes una pequeña decisión especial para reclutar Soldados Hombres Lobo."

 dyanang_decision: "El Pueblo Feroz"
 dyanang_decision_tooltip: "Amigos, necesito vuestra ayuda."
 dyanang_decision_desc: "La buena relación entre tu Corte y el Pueblo Feroz de los Reinos de la Jungla puede ser aprovechada para obtener ayuda."
 dyanang_decision_confirm: "Bienvenidos, y gracias"
 dyanang_decision_effect_tooltip: "Tendrás una opción sobre cuántos Soldados Hombres Lobo generar."

 PODcanon_chars.56.t: "Ayuda de las Junglas"
 PODcanon_chars.56.desc: "Los temibles Hengeyokai han sido tus aliados provisionales desde que el [Glossary('Wu','podgloss.wu')] del Velo Dorado salvó desinteresadamente la vida del cambiaformas dragón Zhong Lung conocido como Nongkhai en 1210. Sin embargo, no sería sabio abusar de esta amistad, pero aún puedes contar con ellos para que te ayuden en momentos de necesidad."
 PODcanon_chars.56.a: "Un sentai debería ser suficiente."
 PODcanon_chars.56.b: "Se necesitan dos sentai."
 PODcanon_chars.56.c: "Toda la ayuda que puedas reunir."
 PODcanon_chars.56.d: "En realidad, puedo manejar la situación por mí misma."
 dyanang_small_werewolves_tt: "Un grupo de Hombres Lobo se añade a tus soldados disponibles."
 dyanang_medium_werewolves_tt: "Dos grupos de Hombres Lobo se añaden a tus soldados disponibles."
 dyanang_high_werewolves_tt: "Tres grupos de Hombres Lobo se añaden a tus soldados disponibles."

 durga_young_tt: "Como estás jugando como Durga Syn, al lograr este objetivo, también levantaste la maldición de Baba Yaga sobre ti."

 podintroductions.213.t: "Tu Historia Hasta Ahora"
 podintroductions.213.desc: "Lord Leopold, a pesar de ser un Inquisidor renombrado, sigues siendo un noble con deberes que cumplir. Uno de ellos es encontrar una cónyuge adecuada.\nComo vástago de una casa menor bávara, sería fácil casarse con una doncella noble local. Gerberga viene a la mente, ya que has visto en ella la formación de una pareja útil. Otra opción sería lanzar una red más amplia, a Italia quizás. Una opción más prestigiosa, sin duda, pero sabrías poco sobre tu futura esposa.\nLa última opción es... poco convencional. Tu mejor amigo, Baudioun, a menudo ha bromeado sobre presentarte a una de sus amigas de la infancia, una alborotadora marimacho que aparentemente era más que rival para las habilidades de pelea del joven Baudioun. Con tu frágil físico, su fuerza compensaría tu debilidad.\n...Y te encantaría ver la cara de Baudioun si realmente te casaras con su amiga después de todas esas bromas."
 podintroductions.213.a: "Sí Baudioun, esto está sucediendo."
 podintroductions.213.b: "Lady Gerberga, ¿quieres...?"
 podintroductions.213.c: "Encantado de conocerte por fin, Lady Adelaida."
 podintroductions.213.d: "No tengo tiempo para estas frivolidades."

 aignen_secrets_modifier: "Secretos de Aignen"
 aignen_secrets_modifier_desc: "Los Oculi Dei saben mucho. Quizás demasiado para algunos de los miembros más celosos de la Iglesia."

 podintroductions.214.t: "Tu Historia Hasta Ahora"
 podintroductions.214.desc: "Lord Aignen, estás en la poco envidiable posición de ser los ojos y oídos de la incipiente Inquisición Sombría, algo que muchos en la Santa Iglesia no aprueban. Sin embargo, conoces la importancia de tu misión.\nBajo tu guía, los Oculi ya se han extendido por todas partes, ofreciendo muchos contactos que puedes aprovechar para la gloria de la Inquisición. Este trabajo de preparación crucial ya está siendo amenazado por la propia Santa Sede, sin embargo, y tendrás que mantener a tus 'aliados' a raya por el momento."
 podintroductions.214.a: "Sé lo que hay que hacer."
 aignen_intro_tooltip: "Como Aignen, comienzas con un poderoso modificador de intriga. Durará mientras Aignen esté vivo, y si puedes mantener a la Iglesia fuera de tu caso."

 PODcanon_chars.57.t: "La Visita Papal"
 PODcanon_chars.57.desc: "Un enviado de la Santa Sede viene, queriendo ver la verdadera magnitud de tus operaciones. Esto podría ser peligroso, ya que muchos en Roma no quieren nada más que cerrar los Oculi Dei, preocupados de que sus mezquinas maquinaciones sean perturbadas por tu presencia.\nSabes que tu misión es mucho más importante que eso, pero aún tendrás que lidiar con estos tontos miopes si quieres continuar con tu propia versión de la Santa obra."
 PODcanon_chars.57.a: "Sobornar al enviado debería ser suficiente."
 PODcanon_chars.57.b: "Soy un humilde servidor de la Iglesia."
 PODcanon_chars.57.c: "Seré tu guía personal."
 PODcanon_chars.57.d: "No tengo más remedio que romper lazos con algunos contactos."

 vittoria_illness_modifier: "Maldición Sobrenatural"
 vittoria_illness_modifier_desc: "Vittoria ha sido maldecida por una poderosa bruja. Aunque su mente sigue siendo fuerte, su cuerpo se está marchitando lentamente."

 podintroductions.215.t: "Tu Historia Hasta Ahora"
 podintroductions.215.desc: "Vittoria la Intrépida, has comenzado tu deber sagrado en Italia, pero has ocultado una terrible verdad a tus hermanos: has sido maldecida.\nUna bruja poderosa a la que te enfrentaste hace años pudo escapar de ti, pero no antes de usar su magia vil. Desde entonces, tu cuerpo se ha estado marchitando lentamente, y podrías ser llamada de vuelta por el Señor mucho antes de terminar tu tarea si esto continúa.\nAfortunadamente, una solución se ha presentado recientemente. Gracias a información de los Oculi Dei, te has enterado de que la bruja se ha establecido en Marsella. Si pudieras hacer un 'desvío' por esa ciudad y purgarla de sus vampiros y hechiceros residentes... seguramente tu maldición terminaría."
 podintroductions.215.a: "¡Una maldición mezquina no me acabará!"
 vittoria_intro_tooltip: "Como Vittoria, tienes una decisión especial para deshacerte de la maldición tomando Marsella."

 vittoria_decision: "La Maldición"
 vittoria_decision_tooltip: "Aún tienes mucho que hacer."
 vittoria_decision_desc: "Todavía eres fuerte, pero esa maldición maldita sigue siendo una preocupación. ¡Purga Marsella y acaba con la bruja!"
 vittoria_decision_confirm: "Por el fuego, sé purificada"

 rodrigue_paranoia_modifier: "Paranoia Total"
 rodrigue_paranoia_modifier_desc: "Están ahí para atraparte. Todos podrían estar bajo su influencia."

 podintroductions.216.t: "Tu Historia Hasta Ahora"
 podintroductions.216.desc: "Lord Rodrigue, fuiste el primero en enfrentarte a un vampiro y vivir, y sigues siendo el único que conoce la verdad: están en todas partes.\nIncluso la Iglesia y su llamada 'Inquisición Sombría' está probablemente llena de sus sirvientes. No debes confiar absolutamente en nadie excepto en ti mismo. Se acerca un gran ajuste de cuentas y Dios te mostrará el camino hacia la salvación.\nSi este mundo tiene que ser quemado para ser salvado, te alzarás sobre las cenizas."
 podintroductions.216.a: "Nunca volveré a ser engañado."

 roque_paranoia_modifier: "Maquinaciones de Roque"
 roque_paranoia_modifier_desc: "¿Es hora de maquinar? ¡Pues sí, siempre es hora de maquinar!"

 podintroductions.217.t: "Tu Historia Hasta Ahora"
 podintroductions.217.desc: "Madre María, a pesar de la inmensidad de tu tarea aquí en Inglaterra, no debes olvidar de dónde vienes.\nSe lo debes todo a Madre Teresa, el alma bendita que fundó las Hermanas de San Juan y fue el corazón de la Inquisición primitiva. Su fallecimiento fue un momento difícil para todas las Hermanas y estarías más tranquila si la Santa Iglesia conociera a esta mujer santa.\nComo tal, has comenzado a recopilar relatos de la vida y los milagros de Teresa para llevarlos a Roma, con la esperanza de su canonización. Si tuvieras éxito, las Hermanas estarían en paz, sabiendo que su fundadora fallecida vive para siempre."
 podintroductions.217.a: "Una tarea muy piadosa."
 maria_intro_tooltip: "Como María, tienes una decisión especial para recopilar relatos de la vida de Teresa. Si terminas antes de la muerte de María, las Hermanas obtendrán un impulso considerable de renombre."

 teresa_life_4_modifier: "Proceso de Canonización de Teresa: 4"
 teresa_life_4_modifier_desc: "Estás trabajando para llevar la verdad sobre los milagros de la Madre Teresa a los oídos de Roma.\nUna vez que este modificador alcance 5, el proceso estará completo."

 teresa_life_3_modifier: "Proceso de Canonización de Teresa: 3"
 teresa_life_3_modifier_desc: "Estás trabajando para llevar la verdad sobre los milagros de la Madre Teresa a los oídos de Roma.\nUna vez que este modificador alcance 5, el proceso estará completo."

 teresa_life_2_modifier: "Proceso de Canonización de Teresa: 2"
 teresa_life_2_modifier_desc: "Estás trabajando para llevar la verdad sobre los milagros de la Madre Teresa a los oídos de Roma.\nUna vez que este modificador alcance 5, el proceso estará completo."

 teresa_life_1_modifier: "Proceso de Canonización de Teresa: 1"
 teresa_life_1_modifier_desc: "Estás trabajando para llevar la verdad sobre los milagros de la Madre Teresa a los oídos de Roma.\nUna vez que este modificador alcance 5, el proceso estará completo."

 maria_decision: "Canonización de la Madre Teresa"
 maria_decision_tooltip: "Ella se lo merece, y mucho más además."
 maria_decision_desc: "Para ayudar a tus Hermanas a saber que la Madre Teresa aún las vigila, tendrás que asegurarte de que Roma reconozca las muchas bendiciones que trajo a esta tierra. Escribirás un relato detallado de su vida, sin duda convenciendo a Roma de canonizarla."
 maria_decision_confirm: "Una empresa santa"

 heir_gauthier_modifier: "Heredero de Gauthier"
 heir_gauthier_modifier_desc: "El poderoso Baudioun es el sucesor elegido de Gauthier. Los Caballeros de Acre se están reuniendo obedientemente tras 'le Breton'."

 heiress_gauthier_modifier: "Heredera de Gauthier"
 heiress_gauthier_modifier_desc: "La brillante Jehan es la sucesora elegida de Gauthier. Liderará a los Caballeros de Acre hacia la victoria... les guste o no."

 podintroductions.218.t: "Tu Historia Hasta Ahora"
 podintroductions.218.desc: "Lord Gauthier, el tiempo no espera a nadie y el Señor pronto te llamará de vuelta a Su lado. Debes preparar a los Caballeros de Acre para este momento.\nEl curso de acción esperado sería que llamaras de vuelta al fiel Baudioun de Alemania y lo nombraras tu sucesor. Como líder talentoso y carismático, lo haría lo suficientemente bien, estás seguro de ello.\nPero... está Jehanne, o Jehan como le gusta llamarse. La pura brillantez de su mente te ha asombrado muchas veces en el pasado y podría ser la mayor amenaza para el Adversario que el mundo haya visto jamás. Sin embargo, hay un problema... es una mujer. Los Caballeros de Acre ya están descontentos de que la hayas promovido a tu círculo íntimo, así que si la nombraras sucesora...\nSea cual sea el caso, hay que elegir. Tu legado depende de ello."
 podintroductions.218.a: "Baudioun es la elección obvia."
 podintroductions.218.b: "Jehan es el futuro."

 gauthier_intro_tooltip: "Jehan, furiosa, abandona los Caballeros de Acre, para no ser vista nunca más."

 PODcanon_chars.58.t: "Siempre Hardestadt"
 PODcanon_chars.58.desc: "Tu [Glossary('Sire','game_concept_Sire_desc')], Hardestadt, ha encontrado recientemente la Muerte Final. Un evento trágico sin duda, pero no uno que pensaras que te afectaría tanto a largo plazo. Aún así, desde su fallecimiento, te has sentido... extraño.\nRecuerdos de una reunión con él, conversaciones sobre un 'plan de contingencia', una laguna de una semana en tu memoria... De repente te sientes imitando a tu difunto amo más y más, hablando y moviéndote como él lo hacía... e incluso pensando como él. ¿Está realmente muerto Hardestadt? ¿Qué te está sucediendo?\nQuizás siempre haya un Hardestadt..."
 PODcanon_chars.58.a: "Los informes de mi Muerte Final fueron muy exagerados."
 PODcanon_chars.58.b: "¡Soy mi propio hombre!"
 hardestadt_takeover_tt: "Te convertirás en Hardestadt, ganando sus rasgos, perdiendo los tuyos, e incluso pareciéndote a él."

 podintroductions.219.desc: "Astuta dama, eres una de los Shih, las herederas del infame Ejército Celestial. La caída de esta gran alianza ha desorganizado a tu especie y ahora cazas sola. Ya has demostrado ser bastante hábil en este juego, usando las conexiones de tu ingenuo esposo entre los nobles para rastrear y luego eliminar a enemigos sobrenaturales desprevenidos.\nAún así, hay un premio mayor en juego. La caída del Ejército Celestial hizo que sus artefactos más preciados se esparcieran a los cuatro vientos, ahora usados como trofeos (o peor, armas) por los indignos. Tus poderosos abanicos místicos ya te sirven bien, pero sueñas con lo que podrías lograr si pudieras recuperar estos tesoros. Son reliquias formidables por sí mismas, sin duda, pero también darían mucho prestigio a su dueño, quizás poniéndote en el camino de reformar el Ejército Celestial si así lo deseas."
 podintroductions.219.a: "Los he rastreado, ahora a adquirirlos..."

 PODcanon_chars.59.t: "El Legado de Moncada"
 PODcanon_chars.59.desc: "Lady Lucita, has triunfado sobre tu maldito sire, Moncada, hace varios años, pero esta victoria está empezando a sentirse vacía. Habías dedicado tu no-muerte a acabar con él y ahora que la acción está hecha... no tienes rumbo, vagando de una causa a otra con la esperanza de encontrar un nuevo objetivo impulsor para tu existencia.\nPeor aún, tienes la molesta sensación de que Moncada predijo este resultado y este mismo momento. De hecho, tu [Glossary('Sire','game_concept_Sire_desc')] a menudo hablaba de su deber sagrado y de tu destino de seguir sus pasos, lo quisieras o no. En ese momento, sonaba como una amenaza, pero ahora... quizás más como una profecía. Quizás tenía razón, y quizás su deber era convertirse en tu deber todo el tiempo.\nParece que no es tan fácil escapar de tu destino."
 PODcanon_chars.59.a: "Ahora lo entiendo."
 PODcanon_chars.59.b: "¡No puedo dejar que gane!"

 PODcanon_chars.93.desc: "Lady Lucita, tu [Glossary('Sire','game_concept_Sire_desc')] ha estado muy complacido con tu crecimiento. Si trabajabas para él o no realmente no le importaba al final, ya que todo lo que hacía era por ti. En su mente (¿alucinada?), él era solo el mensajero que tenía que allanar el camino para tu ascensión como la Reina de la Noche.\nEs una ambición que nunca tuviste antes y una perspectiva aterradora, pero cuando Moncada se ofrece a dar un paso atrás y darte todo lo que tiene, la perspectiva sigue siendo tentadora. No será libertad, no realmente, pero el poder es su propia forma de liberación. Al menos, eso es lo que Moncada y sus enseñanzas decían y quizás por primera vez en tu existencia, puedes ver el atractivo de esta filosofía.\nQuizás tu historia nunca fue una de rebelión, sino una de mayoría de edad y finalmente abrazar tu gran destino."
 lucita_landless_transfer_tt: "Heredarás todos los títulos en poder de Ambrosio Luis Moncada"

 podintroductions.220.t: "Tu Historia Hasta Ahora"
 podintroductions.220.desc: "Poderoso Horus, tu legendaria guerra contra tu monstruoso tío, Set, debe continuar. No negarás que ha habido reveses y la prole de la Serpiente es tan fuerte como siempre en Egipto. Pero no importa, porque tú eres el Vengador. Osiris e Isis te observan desde el más allá, ansiosos por el momento en que finalmente envíes a esta serpiente cobarde de vuelta gritando al abismo que la engendró.\nReúne a tus fieles guerreros y prepara la marcha hacia el norte. Es hora de terminar esto de una vez por todas."
 podintroductions.220.a: "Voy por ti, tío..."
 horus_intro_tooltip: "Como Horus, tienes un objetivo especial para finalmente lograr tu venganza."

 horus_decision: "El Vengador"
 horus_decision_tooltip: "Pronto estaré en tus pesadillas, tío."
 horus_decision_desc: "Si vas a encontrar el escondite de Set, primero tienes que paralizar la base de poder de sus cultistas y destruir a su grupo de seguidores más confiables."
 horus_decision_confirm: "¡¿Dónde está?!"
 horus_custom_decision_1: "[GetScriptedCharacterByHistoryID('505094').GetFirstName], el hijo favorito de Set, debe estar muerto"
 horus_custom_decision_2: "[GetScriptedCharacterByHistoryID('790126').GetFirstName], pilar del culto de Set, debe estar muerto"
 horus_custom_decision_3: "[GetScriptedCharacterByHistoryID('790128').GetFirstName], la concubina de Set, debe estar muerta"
 horus_custom_decision_4: "[GetScriptedCharacterByHistoryID('790988').GetFirstName], el campeón de Set, debe estar muerto"
 horus_decision_effect_tooltip: "Tu venganza se cumplirá."

 horus_the_avenger_modifier: "Horus, el Vengador"
 horus_the_avenger_modifier_desc: "El Faraón Viviente, el Hijo Inmortal, Her-nedi-tef-ef, el Rey Regresado, el Rey Tuerto, Primero-entre-Renacidos y muchos, muchos otros títulos... pero ante todo, la Perdición de Set."
 PODcanon_chars.60.custom.tt: "Todos los Setitas restantes tendrán su autoridad quebrantada."
 horus_first_modifier: "Horus, el Primero"
 horus_first_modifier_desc: "Horus fue momificado por su madre, Isis, ella misma. Como tal, ha conservado mucho más de su fuerza original que cualquier otro inmortal."

 PODcanon_chars.60.t: "Decapitando a la Serpiente"
 PODcanon_chars.60.desc: "Eso es decepcionante.\nDespués de arrasar su culto y matar a sus consejeros más confiables, esperabas que Set te ofreciera una batalla final gloriosa para celebrar tu victoria. Es cierto, tuviste que abrirte paso a cuchilladas entre cientos de fanáticos enloquecidos para llegar al sótano de esta Pirámide y ahora estás cubierto de sangre, pero esto fue apenas un calentamiento. Ahora aquí estás, parado frente al sarcófago de tu tío con el necio durmiendo dentro, moviéndose de vez en cuando, quizás algo consciente del destino que le tienes preparado.\nComienzas destrozando su cadáver con salvaje abandono hasta que puedes tomar cada pieza individual en tu mano. Luego sales, dejando que el divino Ra queme los restos hasta convertirlos en cenizas. Excepto su ojo, que arrojas a un buitre de paso en memoria del tuyo perdido.\nY entonces, solo entonces, caes de rodillas y dejas que la arena te arrastre hasta que renaces una vez más, libre de tu necesidad de venganza por primera vez en eones."
 PODcanon_chars.60.a: "Padre, madre, descansen en paz."

 podintroductions.221.t: "Tu Historia Hasta Ahora"
 podintroductions.221.desc: "Bendita Reina de Egipto, sabiamente te has distanciado de la absurda cruzada de Horus. En cambio, te preocupas por asuntos más importantes, como la preservación de la grandeza del Antiguo Egipto en la mente de los mortales. Verdaderamente una tarea tremenda, incluso para alguien tan dedicada e influyente como tú.\nSin embargo, no tienes elección, con Horus empeñado en la guerra y los depravados seguidores de Set corrompiendo tu amada patria, solo tú puedes recordar lo que hizo de Egipto un lugar tan especial y poderoso en el pasado. Es tu deber mantener esa llama viva."
 podintroductions.221.a: "El único legado digno de Isis es el propio Egipto"
 neferukhayt_intro_tooltip: "Como Neferukhayt, no puedes convertir la cultura.\nSin embargo, tu tarea de consejo de promover cultura es más fuerte."

 socialite_queen_egypt_modifier: "La Reina Socialité"
 socialite_queen_egypt_modifier_desc: "Neferukhayt es la encarnación de la grandeza del Antiguo Egipto. Hablar con ella te hace sentir que, verdaderamente, Khem es eterno."

 NEFERUKHAYT_CULTURE_BONUS: "La pasión de Neferukhayt"

 podintroductions.222.t: "Tu Historia Hasta Ahora"
 podintroductions.222.desc: "Magnífico Hemhemti, eres una de las siete Momias Plaga creadas por el propio Set. Y, por lo que puedes ver, eres el único competente de este lamentable grupo (excepto Amam, que es un muy buen compañero de comida si nada más). Como tal, tienes que tomar la iniciativa y asegurarte de que tu divina misión de destrucción se mantenga en el objetivo.\nObviamente, no esperas nada menos de los otros seis que la obediencia total y la disposición a desprenderse de su oro en cuanto lo necesites. Siempre te gustó el oro incluso cuando eras un mero mortal y, claramente, encaja mejor en tus voluminosos bolsillos que en sus escuálidos tesoros. ¿Y si no tienen suficiente oro a mano? Bueno, quizás podrían ser el invitado de honor en uno de tus famosos banquetes..."
 podintroductions.222.a: "¿Qué hay mejor que una barriga llena y un tesoro más lleno?"
 hemhemti_intro_tooltip: "Como Hemhemti, tienes acceso directo a la decisión Extorsionar a los Súbditos. Esta decisión también alivia el estrés de manera única."

 hunted_down_eternity_modifier: "Cazado Eternamente"
 hunted_down_eternity_modifier_desc: "Horus y sus Shemsu-Heru nunca dejarán de cazarte. Set y sus Momias Plaga tampoco. Y todo Mago o Vampiro codicioso que quiera la verdadera inmortalidad también estará en la persecución.\nEse es tu destino."
 cabirus_intro_tooltip: "Mantendrás tu acceso al Hechizo de la Vida y la capacidad de hacer nuevas Momias, pero serás eternamente perseguido por personas que quieren el Hechizo para sí mismas."
 cabirus_intro_giveup_tooltip: "Renuncias a tu conocimiento del Hechizo de la Vida, lo que te impide crear nuevas Momias en el futuro."

 podintroductions.223.t: "Tu Historia Hasta Ahora"
 podintroductions.223.desc: "Maestro Cabirus, has logrado lo imposible: aprender el Hechizo de la Vida y arrebatar la verdadera inmortalidad de las manos de los Dioses... pero los Dioses están enfadados. Desde el glorioso día en que te convertiste en Momia, has sido cazado por las numerosas personas que quieren el Hechizo para sí mismas.\nLa única salida (aparte de una muerte lenta y dolorosa) que te han dado fue por el propio Horus, pidiéndote que dejaras que borrara el Hechizo de la Vida de tus recuerdos. Esto definitivamente pondría fin a tus perseguidores, pero también significaría que nunca podrías hacer una nueva Momia. Y la inmortalidad puede ser mucho tiempo para soportar solo..."
 podintroductions.223.a: "¡No puedo estar huyendo toda mi vida inmortal!"
 podintroductions.223.b: "Soportaré, como siempre"

 helen_internal_modifier: "Asuntos Internos"
 helen_internal_modifier_desc: "Te estás centrando en asuntos internos, asegurándote de fortalecer rápidamente tu nuevo poder sobre el Sept de la Gloria del Sol."

 shaky_helen_modifier: "Gobierno Disputado"
 shaky_helen_modifier_desc: "Tomaste este Sept bajo la nariz de sus Garou residentes. No han olvidado ese hecho."

 podintroductions.225.t: "Tu Historia Hasta Ahora"
 podintroductions.225.desc: "Helen la Audaz, has asegurado tu ascenso al poder sobre el prestigioso Sept de la Gloria del Sol gracias a tu acción decisiva y tu pura fuerza de voluntad. Lamentablemente, la mayoría del Sept todavía no reconoce realmente tu ascenso al poder y esta desunión podría ser una oportunidad para los muchos enemigos del Sept. Tienes que actuar.\nPodrías hacer una demostración de escuchar sus preocupaciones o podrías apoyarte en la ayuda de tus hermanas para convertir realmente la Gloria del Sol en un Sept de las Furias Negras. Obviamente, tal elección sería impopular entre los residentes actuales del Sept."
 podintroductions.225.a: "Escucharé vuestras preocupaciones."
 podintroductions.225.b: "Hermanas, ¡remodelaremos esta tierra!"
 podintroductions.225.c: "¡No necesito ninguna ayuda!"

 lucille_intro_tooltip: "Como Lucille, comienzas con más oro gracias a tus hazañas anteriores. También tienes acceso único a la [character_interaction|E] Comprar Tregua."

 podintroductions.226.t: "Tu Historia Hasta Ahora"
 podintroductions.226.desc: "Lucille la Astuta, el Sept del Campo de las Estrellas ha sido diezmado después de una victoria pírrica contra los Inquisidores cercanos. Con la mayor parte de su liderazgo desaparecido, tuviste poca dificultad para convertirte en la última esperanza de los defensores acosados. Sabes que la valentía y la fuerza de las armas no serán suficientes para ganar contra tus poderosos enemigos, sin embargo.\nDado que muchos de tus vecinos te consideran débil o insignificante, podrías convencer a algunos de ellos para que miren hacia otro lado por un tiempo a cambio de la promesa de una bolsa de monedas. Y, como la suerte lo quiere, tienes varias de esas bolsas de monedas por ahí de tus aventuras anteriores."
 podintroductions.226.a: "¿A quién no le gusta el oro?"

 timno_intro_tooltip: "Como Timno, cada hijo que tú mismo tutorices ganará 5 de administración y 5 de diplomacia al alcanzar la mayoría de edad."

 podintroductions.227.t: "Tu Historia Hasta Ahora"
 podintroductions.227.desc: "Sabio Timno, tu Sept se encuentra en la encrucijada de muchos reinos poderosos. Tendrás que tener cuidado con tus poderosos vecinos vampíricos del Estado Libre y la Cortina de Sombras. Contactar con los Getos de Fenris de Suecia o los Colmillos de Plata de Rusia podría ser de ayuda.\nEn cualquier caso, sabes que la lucha por Gaia continuará mucho después de tu muerte. Como tal, has jurado preparar a la próxima generación lo mejor que puedas para las pruebas que les esperan. Esta podría ser la clave para la victoria definitiva contra el Apocalipsis."
 podintroductions.227.a: "Estarán listos."

 podintroductions.228.t: "Tu Historia Hasta Ahora"
 podintroductions.228.desc: "Bladdud el Audaz, después de muchas aventuras, has regresado del exilio para liderar a los Fianna de las Islas Británicas en su momento de necesidad. Tu carisma y tus astutas estrategias los han salvado de lo peor, pero aún queda mucho por hacer.\nSin embargo, hay otro problema a tener en cuenta, uno más personal. Tu antepasado fue avergonzado por su asociación con la vampira llamada Stephanie, lo que llevó al exilio de tu linaje. Si bien te has demostrado a ti mismo, Stephanie sigue prófuga y jugando contigo. Ha habido indicios, advertencias e incluso profecías: tendrás que enfrentarte a ella en el futuro. Quizás ganes, quizás no, pero lo importante es que te enfrentarás a ella con espada en mano, lavando la vergüenza que aún mancha tu linaje."
 podintroductions.228.a: "No puedo escapar de mi destino."
 bladdud_intro_tooltip: "Si ambos seguís vivos, Stephanie vendrá a por ti en 10 años."

 podintroductions.229.t: "El Duelo Fatídico"
 podintroductions.229.desc: "Ella está ahí. La que engañó a tu antepasado y ha plagado a tu familia desde entonces. Se ha tomado su tiempo, pero el demonio finalmente ha terminado de jugar contigo.\nTe has demostrado incorruptible, así que no viene con promesas u ofertas, viene con los colmillos desnudos.\nNo te someterás. No te echarás atrás. Tus antepasados están mirando, esperando que seas tú quien vengue su vergüenza. Es hora de enfrentar tu destino, Bladdud."
 podintroductions.229.a: "¡Gaia me vigila!"
 podintroductions.229.effect.success.desc: "¡Stephanie ha sido vencida!"
 podintroductions.229.critical.failure.effect.desc: "Al final, la valentía no fue suficiente."

 podintroductions.230.t: "Triunfo sobre el Destino"
 podintroductions.230.desc: "Lo lograste, Rey Bladdud. Stephanie no es más que cenizas a tus pies, los últimos rastros de la vergüenza de tu linaje siendo arrastrados por el viento. Un alivio inmenso te invade, porque aunque todavía tienes que liderar a los Fianna hacia su futuro, sabes que los salones de tus antepasados están puros de nuevo y listos para recibirte cuando llegue el momento.\nTe alejas del campo de batalla, listo para volver con tu gente. Es momento de celebrar y los bardos querrán saberlo todo sobre este duelo, para asegurarse de que tu historia sea contada alrededor de las hogueras hasta el propio Apocalipsis."
 podintroductions.230.a: "La victoria sabe casi tan bien como la cerveza."

 podintroductions.231.t: "Encontrando tu Destino"
 podintroductions.231.desc: "Nadie puede escapar de su destino, Rey Bladdud, ni siquiera tú. Como predijeron las profecías, Stephanie perseguirá y maldecirá tu linaje por más tiempo. Mientras yaces, sangrando, en el suelo, sabes que aún lograste una victoria, sin embargo. Morir con la espada en la mano contra un enemigo tan poderoso será recordado durante mucho tiempo por tu tribu y el pasado vergonzoso de tu linaje será perdonado.\nQuizás algún día uno de tus descendientes te vengue y finalmente termine esta disputa. Hasta entonces, sin embargo, cierras los ojos por última vez, esperando que Gaia reciba en sus brazos a su campeón caído."
 podintroductions.231.a: "Muero como viví."

 depopulated_fenris_modifier: "Generación Perdida"
 depopulated_fenris_modifier_desc: "Demasiados valientes Fenrir y sus parientes murieron durante la guerra contra Odín. Tomará tiempo para que los Caerns se repueblen."

 podintroductions.232.t: "Tu Historia Hasta Ahora"
 podintroductions.232.desc: "Lady Yvonne, estabas fuera en una misión en Inglaterra cuando ocurrió la lucha climática contra Odín. Aunque los valientes guerreros regresaron victoriosos, el costo fue demasiado alto. Muchos Fenrir experimentados y sus devotos parientes murieron durante esa campaña. Tantos, de hecho, que de repente te convertiste en la opción más probable para el liderazgo entre los Jarls restantes.\nNo puedes decirlo en voz alta, pero sabes que la situación es terrible. Se perdió una generación entera para, al final, poca ganancia contra las malditas proles de Odín. Tendrás que confiar en incursiones rápidas hasta que los Fenrir hayan recuperado suficientes fuerzas para reanudar la guerra."
 podintroductions.232.a: "Debemos lamer nuestras heridas."

 podintroductions.233.t: "Tu Historia Hasta Ahora"
 podintroductions.233.desc: "Manchas-Vidrio el Astuto, te ganaste tu apodo y tu fama por tus audaces incursiones y trucos contra los seguidores de la Cruz Blanca, pero el tiempo de la imprudencia está terminando. Del este llega una nueva especie de invasores, hombres que viven con sus caballos, pisoteando tanto a humanos como a lobos bajo sus cascos. Estos son enemigos peligrosos, y puedes sentir el olor de los malditos vampiros entre ellos.\nEres respetado entre las manadas locales, y ahora te miran a ti para que los lideres en incursiones más audaces. Esta vez, sin embargo, serán incursiones de sangre, para recordar a estos orientales que las estepas son una tierra para lobos y para nadie más."
 podintroductions.233.a: "Cazamos. Ellos mueren."
 stains_intro_tooltip: "Cada vez que el ejército de Manchas-Vidrio saquea una baronía, obtiene prestigio adicional."

 podintroductions.234.t: "Tu Historia Hasta Ahora"
 podintroductions.234.desc: "Lady Elizaveta, los Señores de la Sombra del Cielo Nocturno se enfrentan a una situación terrible. Los recientes ataques contra los odiados Tzimisce no han tenido éxito y solo su guerra contra los Tremere los distrae de emplear todo su poder contra ti.\nLos cercanos Colmillos de Plata de la Luna Creciente, tomándose en serio sus deberes como gobernantes de la Nación Garou, han ofrecido su ayuda. Esta es una oferta tentadora, pero incluso considerar esta opción hace que la sangre de tu orgulloso Señor de la Sombra hierva. Aceptar su reclamo de liderazgo sería vergonzoso a los ojos de muchos de tus compañeros de tribu, pero quizás el orgullo debe pasar a un segundo plano esta vez."
 podintroductions.234.a: "¡Nos mantenemos orgullosamente solos!"
 podintroductions.234.b: "Un poco de ayuda sería bienvenida."
 podintroductions.234.c: "Son nuestros Reyes. Por ahora."

 podintroductions.235.t: "Tu Historia Hasta Ahora"
 podintroductions.235.desc: "Sabio Wepauwet, los Pasos Silenciosos una vez más te admiran para que los lideres en su exilio forzado. Eres el último en recordar el Antiguo Egipto, y esperan que algún día los lideres de regreso a tu tierra natal.\nVerdaderamente, eres único. Como uno de los primeros partidarios de Horus, se te concedió el Hechizo de la Vida y casi te convertiste en una Momia, pero Búho, el espíritu guardián de tu tribu, intervino. Con su bendición ahora eres... algo más: inmortal, parte momia pero también completamente hombre lobo. Usa esta considerable gracia para ayudar a tu pueblo varado a encontrar finalmente un propósito una vez más."
 podintroductions.235.a: "Soy el puente entre mundos."
 wepauwet_intro_tooltip: "Como Wepauwet, eres inmortal, obtienes acceso a algunas habilidades de Momia pero aún conservas todas las capacidades de Hombre Lobo."

 podintroductions.236.t: "Tu Historia Hasta Ahora"
 podintroductions.236.desc: "Sabio Chakal, has estado liderando a los Mirando a las Estrellas como un mentor respetado durante algún tiempo y con suerte lo harás en el futuro cercano.\nDurante esos tiempos te hiciste amigo de tu extraño vecino, el vampiro Milarepa, un compañero misterioso pero sabio que parece disfrutar mucho conversando con tu gente sobre muchos temas espirituales. Ha sido un amigo para tu gente desde que ayudó a proteger el Caern de un temible Nexus Crawler hace un siglo. Este tipo de amistad entre vampiro y hombre lobo es casi inaudita, pero aún la atesoras. Una criatura tan vieja y sabia no aparece a menudo y aún hay mucho que deseas entender sobre él y su visión del mundo."
 podintroductions.236.a: "Soy el puente entre mundos."
 chakal_intro_tooltip: "Mientras tanto tú como Milarepa sigan siendo mejores amigos, él vendrá regularmente a conversar contigo, ofreciendo varias bendiciones."

 podintroductions.237.t: "Amigo Extraño"
 podintroductions.237.desc: "Milarepa ha bajado recientemente de su refugio de montaña a tu corte, esperando pasar algo de tiempo entre tu gente y conversar con ellos. Aunque muchos aún desconfían de la presencia de un vampiro en este recinto sagrado, tú sabes que Milarepa es inofensivo y les muestras el camino al ser el primero en saludarlo y preguntarle sobre sus perspectivas actuales."
 podintroductions.237.a: "¿Un libro antiguo? Cuéntame."
 podintroductions.237.b: "¿Los espíritus? Sabemos una o dos cosas sobre ellos."
 podintroductions.237.c: "¿El Gaiadharma? Por dónde empezar..."

 tvarivich_twins_modifier: "Los Gemelos Destinados"
 tvarivich_twins_modifier_desc: "Los gemelos Tvarivich tienen mucho que lograr. Mientras estén juntos, son imparables."

 podintroductions.238.t: "Tu Historia Hasta Ahora"
 podintroductions.238.desc: "Audaz Yuri, eres el legítimo Rey de los Colmillos de Plata y, como tal, de toda la Nación Garou. A pesar de tus ya grandes aventuras y muchas reclamaciones de fama, aún hay quienes disputan este hecho. Les demostrarás que están equivocados.\nPara esta empresa, puedes contar con el apoyo eterno de tu gemela Sophia. Ya has demostrado muchas veces que, juntos, pueden lograr prácticamente cualquier cosa. Apóyate en ella, como ella se apoyará en ti, ¡y avanza para llevar a los Colmillos de Plata a alturas aún mayores!"
 podintroductions.238.a: "Hermana, ¡triunfaremos!"
 yuri_intro_tooltip: "Mientras tú y Sophia estéis vivos, disfrutarás de un poderoso modificador. Si uno de vosotros muere, el otro sufrirá consecuencias negativas."

 PODcanon_chars.61.t: "El Fin de tu Mundo"
 PODcanon_chars.61.desc: "Sophia ha muerto. Parece que el destino no espera a nadie, ni siquiera a los legendarios gemelos Tvarivich. Hace mucho tiempo, en tiempos más felices, se prometieron mutuamente que morirían juntos en la medida de lo posible, pues ¿de qué sirve continuar si no? Pero eres Rey de los Colmillos de Plata, y puede que ni siquiera tengas el lujo de cumplir esa promesa, pues tienes muchos deberes.\nQuizás Sophia entenderá si tiene que esperar un poco más antes de volver a verte, pero ¿puedes realmente continuar sin ella?"
 PODcanon_chars.61.a: "Hermana, solo espera un poco más."
 PODcanon_chars.61.b: "Tengo una promesa que cumplir."

 podintroductions.239.t: "Tu Historia Hasta Ahora"
 podintroductions.239.desc: "Lady Isabeau, has logrado el control sobre el Sept de la Promesa Brillante atrapando a los últimos gobernantes en una red de chantaje antes de atacar.\nEste enfoque despiadado te ha servido bien una y otra vez, especialmente cuando te apoderaste de las tierras de tu noble familia en Francia. Estas propiedades ahora sirven para poco, ya que estás bien atrincherada en los Estados Cruzados, pero podrías usar esos títulos menores para obtener algo de oro rápido. Después de todo, en tu experiencia, si el chantaje no es suficiente para conseguir lo que quieres, el oro normalmente lo es."
 podintroductions.239.a: "Hora de obtener ganancias."
 isabeau_intro_tooltip: "Como Isabeau, tienes acceso a la pequeña decisión Vender Títulos. También es menos costosa en cuanto a prestigio."

 podintroductions.240.t: "Tu Historia Hasta Ahora"
 podintroductions.240.desc: "Hermana Gusano, el $glossary_wyrm$ te llama, como siempre lo hace. Todos piensan que estás loca, incluido tu hermano (aunque está muerto, así que claramente él era el loco), pero tú sabes la verdad: el Wyrm te ama.\nPor eso te guió aquí para ayudar a uno de sus más grandes sirvientes, una Bruja de algún tipo. Está complacido ahora y te dice que quizás quieras comprometerte con uno de sus aspectos para prepararte completamente para tu misión divina. El Gusano tiene muchas cabezas, como todo el mundo sabe. Solo tienes que acariciar una. Metafóricamente, por supuesto.\nNo eres una idiota como lo era tu hermano."
 podintroductions.240.a: "¡Ruge como una Bestia-de-Guerra!"
 podintroductions.240.b: "Comer Almas suena divertido"
 podintroductions.240.c: "¡Soy la gran Engañadora!"
 podintroductions.240.d: "¡El $glossary_wyrm$ me ama tal como soy!"

 podintroductions.241.t: "Tu Historia Hasta Ahora"
 podintroductions.241.desc: "Adisa la Intrépida, luchaste bien, y Freyja quedó lo suficientemente impresionada como para darte acceso a tu venganza. Pero con eso fuera del camino, hay nuevas preocupaciones apremiantes.\nEn cada uno de tus viajes, viste mujeres inclinadas, su espíritu femenino esclavizado a la voluntad de tiranos como ese maldito Ahriman. Necesitan una campeona, alguien que las eleve a las increíbles alturas que pueden alcanzar. Esa persona solo puede ser tú.\nEs hora de hacer que tu divina madre se sienta orgullosa una vez más."
 podintroductions.241.a: "¡Levantaos, Valquirias de Freyja!"
 adisa_intro_tooltip: "Como Adisa, solo puedes $pod_Embrace$ a mujeres. Tus vástagos también recibirán un evento de educación especial."

 podintroductions.242.t: "Tu Historia Hasta Ahora"
 podintroductions.242.desc: "Supremo Vassago, uno de tus planes magistralmente elaborados pronto se hará realidad.\nHace tiempo que previste que tu culto Jain en Golconda se debilitaría y, como tal, decidiste dividir tu esencia en muchos artefactos más pequeños, haciendo que tus devotos los esparcieran por el mundo. Una de esas piezas, un pendiente, ha encontrado un dueño digno. Una poderosa bruja de los Tremere llamada Viorica ha estado bailando al son de tu música durante algún tiempo, difundiendo tu gloria en la lejana Europa. Esto ha sido una distracción divertida, pero ahora que estás preparando tu próximo movimiento, se te presenta una elección.\n¿Quieres atraer a Viorica a la India y corromperla por completo como una sirvienta potencialmente útil usando el pendiente? ¿O quieres empujarla a sacrificarse por tu gloria, infundiendo tu artefacto con más poder en el proceso?"
 podintroductions.242.a: "¡Ven a mí, bruja!"
 podintroductions.242.b: "¡Mi precioso debe regresar!"

 podintroductions.243.t: "Tu Historia Hasta Ahora"
 podintroductions.243.desc: "Grotesco Orobas, no podrías haber despertado en una era mejor.\nLos mortales tienen hambre y se les niegan sus legítimos impulsos por una Iglesia restrictiva. Será tu deber, ¡no, tu placer!, liberarlos de sus cadenas y dejar que se entreguen a todos y cada uno de los oscuros deseos que tan lamentablemente reprimen.\nPor ahora, sin embargo, todavía eres débil y podrías necesitar la ayuda de tus mascotas favoritas para consolidar tu posición. Siempre te han gustado las alimañas que pululan después de los espectaculares festines por los que eres famoso. Estos pequeños adoradores de la glotonería pueden no darte poder real, pero la fuerza está en los números..."
 podintroductions.243.a: "¡Qué época tan alegre pasaremos todos!"
 orobas_intro_tt: "Como Orobas, tienes acceso único a una variedad de Soldados de animales pequeños."

 babayaga_bound_bezariel_modifier: "Atado a Baba Yaga"
 babayaga_bound_bezariel_modifier_desc: "La Bruja contiene tu verdadero poder para mantenerte a raya, pero su mera presencia a tu alrededor te hace parecer mucho más temible."

 podintroductions.244.t: "Tu Historia Hasta Ahora"
 podintroductions.244.desc: "Perfecto Bezariel, tu regreso al plano mortal ha sido un asunto difícil hasta ahora.\nHas sido convocado y atado por la poderosa vampira conocida como Baba Yaga, quien pretende usarte como general en sus ejércitos. Aunque estás agradecido por su ayuda para escapar de la Prisión Abisal y la posición de poder, sabes que el destino no espera a nadie e incluso un ser tan poderoso como la Bruja tendrá una noche que enfrentar su destino. Querrás estar preparado para esta eventualidad y crear tu propia base de poder mientras tanto.\nSiempre estuviste destinado a grandes cosas e incluso Lucifer se detendría si viera el verdadero alcance de tu potencial. Como antiguo ángel del destino, ahora es hora de crear el tuyo propio y hacer temblar al Cielo y al Infierno."
 podintroductions.244.a: "¡Sobreviviré a la Bruja, a Lucifer e incluso al propio Dios!"
 bezariel_intro_tt: "Como Bezariel, tienes acceso único a una decisión que te permite reconsiderar tu lealtad a Baba Yaga."

 bezariel_decision: "La Ascensión del Ángel de Sangre"
 bezariel_decision_tooltip: "La Bruja es una aliada útil, pero..."
 bezariel_decision_desc: "Baba Yaga te convocó para su propio propósito. Pero si pudieras crecer en poder a pesar de sus cadenas, podrías 'renegociar' tu acuerdo..."
 bezariel_decision_effect_tooltip: "Reconsiderarás tu asociación con la Bruja."
 bezariel_decision_confirm: "Visitando a la Abuela..."

 PODcanon_chars.62.t: "Sangre y Hierro"
 PODcanon_chars.62.desc: "La Bruja de Hierro, Baba Yaga, fue fundamental para liberarte de la Prisión Abisal. En cierto modo, le debes tu libertad, pero también ha sido lo suficientemente prudente como para poner algunas limitaciones sobre cuánto de tu poder angélico puedes aprovechar realmente.\nA pesar de este inconveniente, has logrado crecer en poder y has alcanzado la posición máxima de autoridad en la Cortina de Sombras, además de la propia Abuela, obviamente. Esta podría ser la oportunidad perfecta para renegociar los términos de tu acuerdo anterior en tu beneficio..."
 PODcanon_chars.62.a: "Todavía podemos trabajar juntos..."
 PODcanon_chars.62.b: "¡No le rindo cuentas a nadie!"
 bezariel_loyal_tt: "Baba Yaga te dará acceso a los Zmei, un grupo muy poderoso de dragones corruptos representados como Soldados."
 bezariel_disloyal_tt: "Todos los personajes en la Vía Tantabus se convertirán a tu religión."

 babayaga_allied_bezariel_modifier: "Hierro y Sangre"
 babayaga_allied_bezariel_modifier_desc: "El Ángel de Sangre se ha aliado formalmente con la Bruja de Hierro. El propio Dios debería detenerse ante este giro de los acontecimientos."
 bezariel_unleashed_modifier: "Ascensión de Sangre"
 bezariel_unleashed_modifier_desc: "No hay prisión lo suficientemente segura para detenerlo. No hay cadenas lo suficientemente fuertes para contenerlo. Su ascensión ha comenzado."

 ares_war_modifier: "Dios de los Guerreros"
 ares_war_modifier_desc: "El Dios de la Guerra desprecia a los llamados soldados de esta era, que apenas son más que campesinos. ¡Él merece ser servido solo por aquellos verdaderamente dedicados a la guerra!"
 podintroductions.245.t: "Tu Historia Hasta Ahora"
 podintroductions.245.desc: "Ares el Colérico, has caído muy lejos de tus días de gloria en la gloriosa Grecia antigua.\nYa no eres adorado como un Dios por los valientes hoplitas de Hélade o las imparables legiones de Roma. Tu poder se ha debilitado considerablemente, ya que ahora la guerra es hecha por débiles campesinos reclutados que rinden homenaje al Dios Cristiano en lugar de a ti. Aún así, tu historia aún no ha terminado. Todavía hay hombres de guerra verdaderos en este mundo, incluidos algunos que respetan adecuadamente al Dios de la Guerra en sus múltiples formas. Puede que no sea mucho, pero será suficiente para que reavives el amor por la batalla y el derramamiento de sangre en la humanidad.\nDespués de todo, la guerra nunca cambia."
 podintroductions.245.a: "La paz es una ilusión."

 podintroductions.246.t: "Tu Historia Hasta Ahora"
 podintroductions.246.desc: "Lady Lamashtu, tu ascenso de demonio menor a dominación divina ha sido largo y arduo hasta ahora.\nTu victoria contra Tiamat fue un buen punto de partida, pero luego tuviste dificultades para crear y mantener un culto de seguidores lo suficientemente fuerte como para ascender más. Los persas destruyeron tu lugar de descanso antes de que pudiera ser asegurado por completo y te viste obligada a dormir durante varios siglos. Un encuentro casual te despertó y aún puedes sentir el eco del poder que perdiste durante tu primera derrota en la ciudad ahora conocida como Acre. Si pudieras recuperar el control sobre ella, finalmente podrías completar este importante ritual. Un importante primer paso hacia tu victoria definitiva."
 podintroductions.246.a: "Soporté, ¡ahora triunfaré!"
 lamashtu_intro_tt: "Como Lamashtu, tienes acceso único a una decisión que te permite mejorar el 'Corazón de Lamashtu' una vez que Acre sea recuperada."

 gabriel_trumpet_modifier: "Maldición del Pacto"
 lamashtu_decision: "Completando el Pacto"
 lamashtu_decision_tooltip: "Ocupándose de asuntos pendientes."
 lamashtu_decision_desc: "Tu relicario estaba casi terminado antes del ataque de los persas. Si pudieras recuperar Acre, su poder errante sería una vez más parte de él."
 lamashtu_decision_confirm: "¡Mi corazón está completo una vez más!"

 podintroductions.247.t: "Tu Historia Hasta Ahora"
 podintroductions.247.desc: "Mammon el Devorador, tu ascenso al dominio está comenzando.\nLa avaricia es una emoción poderosa de tener control y una vez estuviste convencido de que nadie podía detenerte. Sin embargo, te demostraron que estabas equivocado cuando llegaron los primeros cristianos. Usando su prédica de pobreza y vidas piadosas, debilitaron considerablemente tu culto hasta que finalmente te llevaron a dormir.\nComo tal, fue una gran alegría para ti ver que tu despertar se debe a estos mismos cristianos, que ahora finalmente aprecian los lujos y el oro tanto como todos deberían. Sin embargo, todavía te estás recuperando, y sería sabio que construyas lentamente tu base de poder, un nuevo adorador a la vez. Todo ser anhela más de lo que tiene y tú estarás feliz de proporcionarlo... por un precio tan pequeño."
 podintroductions.247.a: "¿Qué es lo que realmente deseas?"
 mammon_intro_tt: "Como Mammon, tu [character_interaction|E] 'Enviar Regalo' tiene probabilidad de dar el rasgo 'Codicioso' al objetivo, abriendo más posibilidades para la corrupción."

 podintroductions.248.t: "Tu Historia Hasta Ahora"
 podintroductions.248.desc: "Sabio Nikanuuranu, tu repentina huida de la Prisión Abisal fue muy inesperada, incluso para ti mismo.\nQuizás Dios se ha apiadado de ti? No está respondiendo, pero te encontraste atado a un castillo modesto, Hunedoara, en esta tierra devastada por la guerra de Hungría. Tienes poca ambición aparte de esperar el Día del Juicio, pero no eres tonto. Si no encuentras una fuente de adoradores lo suficientemente pronto, serás arrastrado de vuelta a la terrible prisión. Por suerte, tienes una idea: proporcionar refugio y protección a aquellos que buscan apartarse del mundo, buscando quizás la contemplación y la tranquilidad.\nPronto se forjará un Pacto, y tienes a los candidatos perfectos en mente..."
 podintroductions.248.a: "La guarida de los ocultos se abre..."
 niku_intro_tt: "Como Nikanuuranu, pronto recibirás la oportunidad de vincular a algunos vampiros específicos al Pacto."

 PODcanon_chars.63.t: "El Pacto: Los Guerreros"
 PODcanon_chars.63.desc: "Quizás cansados de la guerra, golpeados por sus enemigos o simplemente buscando un respiro, identificaste a un grupo de candidatos potenciales que estarían dispuestos a firmar el Pacto que los vincularía a Hunedoara. Serían sirvientes útiles y una buena fuente de adoradores hábiles para asegurar tu estancia duradera en el plano mortal."
 PODcanon_chars.63.a: "Bienvenidos a su nuevo hogar."
 PODcanon_chars.63.b: "No servirán."

 PODcanon_chars.64.t: "El Pacto: Los Eruditos"
 PODcanon_chars.65.t: "El Pacto: Los Nobles"
 PODcanon_chars.66.t: "El Pacto: Los Viajeros"

 podintroductions.249.t: "Secretos de Persia"
 podintroductions.249.desc: "Lord Mitras, escondes un secreto potencialmente destructivo. Siempre has afirmado que Veddartha es tu [Glossary('Sire','game_concept_Sire_desc')], lo cual es cierto, pero todos asumen que este nombre es un alias del propio Ventrue, lo cual no es cierto. Hace mucho tiempo, realizaste la temida $pod_diablerie$ en un vampiro olvidado y así es como realmente te convertiste en un poderoso miembro de la 4ª generación. Si alguien descubriera la verdad, el potencial para una crisis sería grande.\nAfortunadamente, esta $pod_diablerie$ fue hace tanto tiempo que la mayoría de las evidencias han sido enterradas por el tiempo. Aún así, algunos rastros podrían ser encontrados por rivales curiosos y estás considerando deshacerte de cualquier cosa que pudiera llevarlos a este crimen antes de que sea demasiado tarde."
 podintroductions.249.a: "Nunca deben saber esto."
 podintroductions.249.b: "Mis secretos ya están suficientemente ocultos."

 PODcanon_chars.67.t: "El Siguiente Paso"
 PODcanon_chars.67.desc: "Lady Kemintiri, con los seguidores de tu némesis eliminados, ahora eres libre de reconsiderar los turbulentos eventos de tu pasado. Set te torturó por tu conocimiento del Hechizo de la Vida, la poderosa magia de Isis que le permitió crear Momias para la guerra contra su medio hermano. Te mantuviste firme durante esas oscuras noches y nunca entregaste tu secreto. Lamentablemente, tu psique fue destrozada por el evento y solo recuerdas fragmentos de este difícil ritual.\nCon la derrota de los seguidores de Set y tu mente más tranquila, ahora podrías tratar de encontrar una manera de reconstruir el Hechizo de la Vida. El conocimiento para crear Momias sería un activo poderoso para tus futuros esfuerzos, sean cuales sean."
 PODcanon_chars.67.a: "Mi mente finalmente está sanando."
 kemintiri_phasetwo_tt: "Tienes acceso a una nueva decisión."

 kemintiri_second_decision: "Recuerdos de Vida"
 kemintiri_second_decision_tooltip: "En el fondo, conoces uno de los secretos más importantes que existen. Solo tienes que recordar."
 kemintiri_second_decision_desc: "Has soportado mucho para proteger el Hechizo de la Vida de Isis. Si finalmente lo recordaras claramente, podrías crear las legendarias Momias una vez más."
 kemintiri_second_decision_confirm: "Soy digna del legado de Isis"
 kemintiri_second_decision_custom: "[GetScriptedCharacterByHistoryID('792593').GetFirstName] conoce el Hechizo de la Vida. Si pudieras mostrarle tu devoción a Isis, podría ayudarte.\nEsta condición se cumplirá si se convierte en tu [friend|E], miembro de tu [coterie|E] o [soulmate|E]."
 kemintiri_second_decision_effect_tooltip: "Podrás usar un [character_interaction|E] en mortales para convertirlos en tus adoradores, conocidos como Neteru.\nObtendrás acceso al [character_interaction|E] Hechizo de la Vida en Neteru, lo que te permitirá convertirlos en $POD_splat_mummy_plural$."

 PODcanon_chars.68.t: "Hija de Isis"
 PODcanon_chars.68.desc: "Lady Kemintiri, finalmente después de todos estos años lo recuerdas todo. Tu devoción a la causa del divino Osiris. La hermosa sonrisa de Isis mientras te enseñaba el Hechizo de la Vida. La guerra eterna contra el Gran Enemigo. Los siglos de tortura de Set para extraerte el secreto que tanto deseaba.\nPero también recuerdas el peor dolor de todos, entender que nadie iba a salvarte entonces. Que Horus y sus devotos te habían olvidado o, peor, pensaban que te habías unido voluntariamente a Set. Recuerdas las historias que contaban sobre ti, cómo eras irredimible, algunos de tus amigos más antiguos incluso discutiendo con Horus para tu destrucción.\nPor primera vez desde entonces, recuerdas lo suficiente como para tomar una decisión que podría cambiar tu no-muerte eterna. El perdón nunca fue tu fuerte, pero quizás puedas aprender."
 PODcanon_chars.68.a: "Finalmente estoy en casa, Isis."
 PODcanon_chars.68.b: "¡Todos pagarán!"
 kemintiri_no_redemption_tt: "Podrás usar un [character_interaction|E] en mortales para convertirlos en tus adoradores, conocidos como Neteru.\nObtendrás acceso al [character_interaction|E] Hechizo de la Vida en Neteru, lo que te permitirá convertirlos en $POD_splat_mummy_plural$.\nEn lugar de costar 10000 de piedad para crear una Momia como es habitual, solo te costará 2500."

 PODcanon_chars.69.t: "Veni, Vidi, Vici"
 PODcanon_chars.69.desc: "¡Ave, Cónsul Eterno!\nTu triunfal regreso a la política italiana ha sido tan rompedor de paradigmas como muchos esperaban. Una vez más demostraste al clan Ventrue que el verdadero camino del gobierno solo se puede encontrar mientras también se aprecian las cosas buenas de la no-muerte para cuidar tu alma eterna.\nAlgunos Ventrue esperaban un regreso tan triunfal, ya que esto podría significar un regreso a la gloriosa era romana donde tu clan dominaba. Pero muchos otros esperaban en silencio que fracasaras, y luego atribuir ese fracaso a tus costumbres hedonistas para mover al clan Ventrue hacia un futuro gris y estricto. Estos tontos han sido refutados y aunque aún hay trabajo por hacer antes de que Roma Eterna recupere todo su poder, el primer paso se ha dado."
 PODcanon_chars.69.a: "Roma es tan eterna como yo."

 PODcanon_chars.70.t: "La Hija Mayor"
 PODcanon_chars.70.desc: "Lady Helena, has [Glossary('Embraced','game_concept_Embrace_desc')] a varios vástagos durante tu no-muerte. Con tu guerra contra Ménele calentándose de nuevo, puede que sea hora de revisar su utilidad potencial.\nEletria es la mayor, una artista espartana de la que tu amado Prias se apiadó, instándote a salvarla de un final vicioso. Eletria es, francamente, una cobarde sin carácter, así que forzarla a regresar contigo debería ser muy fácil, ya que no se atrevería a resistirse. No es la vampira más brillante que hayas visto, pero aún podría ser lo suficientemente útil y no representaría ninguna amenaza para ti de todos modos."
 PODcanon_chars.70.a: "Vuelve ahora, o si no."
 PODcanon_chars.70.b: "Los tontos cobardes no son necesarios en mi corte."

 PODcanon_chars.71.t: "La Hija Mediana"
 PODcanon_chars.71.desc: "El sádico noble menor Philippe Volgirre es tu segundo vástago. Lamentablemente está fuera de tu alcance debido a algunas alteraciones que hizo en su propia sangre que quizás tengas que investigar más adelante. María es tu tercer vástago, pero huyó tan lejos que alcanzarla podría no valer la pena.\nLuego viene Melinda Galbraith, tu orgullo y alegría.\nForjaste a Melinda para convertirla en una criatura despiadadamente ambiciosa, lista para pisotear cualquier cosa en su camino. No se quebró durante tu entrenamiento como lo hicieron tus otros vástagos, sino que fomentó un profundo odio hacia ti y escapó tan pronto como encontró una oportunidad... pero no lo suficientemente lejos. En muchos sentidos, te recuerda a ti misma y a tu propia difícil crianza vampírica y odio hacia tu propio [Glossary('Sire','game_concept_Sire_desc')], Minos.\nPodrías forzar a Melinda a regresar 'a casa', ya que es demasiado joven para resistirse. Sin embargo, su voluntad siempre fue fuerte, y es bastante seguro que te odiará aún más si haces eso... pero quizás este es un precio que estás dispuesta a pagar para tener a tu vástago pródigo a tu lado una vez más."
 PODcanon_chars.71.a: "Aprenderás a amarme con el tiempo."
 PODcanon_chars.71.b: "...no quiero terminar como Minos."

 PODcanon_chars.72.t: "El Vástago Más Joven"
 PODcanon_chars.72.desc: "Guillaume de Lorris fue un poeta muy reputado en Francia no hace mucho tiempo. Tan reputado, de hecho, que todas las Cortes del Amor se tropezaban entre sí sobre quién tendría el honor de Abrazarlo, usando reglas complejas e intrigas a su alrededor para asegurar su derecho. Y luego tú simplemente te abalanzaste y lo Abrazaste sin su consentimiento (ni el de ellos) solo porque ver la cara que ponían era divertido.\nRápidamente te aburriste de De Lorris y lo dejaste valerse por sí mismo en Francia, probablemente condenándolo a una corta no-muerte de desesperación y autodesprecio. Sin embargo, durante tu breve tiempo con él viste algo en el hombre, la chispa de algunas ambiciones y talentos más profundos y oscuros que quizás podrían sacarse a la luz y perfeccionarse en un arma poderosa. ¿Vale la pena obligar al poeta roto a venir a ti y trabajar con él durante algún tiempo para ver dónde podría terminar?"
 PODcanon_chars.72.a: "Observaré su carrera con gran interés."
 PODcanon_chars.72.b: "Fue divertido mientras duró, nada más."
 helena_villon_tt: "Si Guillaume de Lorris sigue siendo tu cortesano, o tu vasallo, en tres años, su personalidad cambiará y sus aptitudes mejorarán."

 PODcanon_chars.73.t: "El Poeta Renacido"
 PODcanon_chars.73.desc: "Has estado alimentando esa extraña chispa que viste en Guillaume de Lorris durante tres años y te complace notar algunas 'mejoras' en su personalidad. El poeta una vez desesperado ha aprendido a disfrutar de las cosas buenas de la no-muerte bajo tu tutela, lo suficiente como para que ahora se haya convertido en una parte valiosa de tu corte, donde antes apenas participaba.\nParece que tenías razón en tu evaluación de su potencial. Quizás un poco demasiado justo en cierto modo, ya que De Lorris ahora muestra más ambición y crueldad que nunca antes.\nTendrás que mantener a ese con una correa corta."
 PODcanon_chars.73.a: "Te has vuelto útil. No te vuelvas amenazante."

 PODcanon_chars.74.t: "La Alexiada"
 PODcanon_chars.74.desc: "Lady Anna, nunca pudiste tomar el trono bizantino y los mortales nunca te recordarán como la Emperatriz que deberías haber sido. Aún así, pudiste completar tu obra maestra, la 'Alexiada', un vívido relato político de la política bizantina de tu época con no poca cantidad de sesgo personal, si eres honesta contigo misma. Se está convirtiendo rápidamente en un texto bien considerado gracias a tu estilo de escritura inusual y tus descripciones del funcionamiento interno de la misteriosa Constantinopla.\nCon tu amada ciudad ahora en manos de los bárbaros latinos, la Alexiada se erige como un recordatorio de días mejores. Al menos, te mantendrá concentrada en tu objetivo de recuperarla para los griegos y escribir tu propia historia, esta vez para los gobernantes de la noche."
 PODcanon_chars.74.a: "Padre, te haré sentir orgulloso."

 podintroductions.250.desc: "Lady Thrax, el evangelio teológico gnóstico te salvó de la desesperación y te duele ver a los cátaros mortales ardiendo en Francia, pero tienes asuntos más apremiantes que atender.\nRoma es la cabeza de la serpiente Ventrue y tuviste mucho éxito en debilitarla hasta que Camila despertó. En un movimiento desconcertante, el Cónsul Eterno declaró tus ataques 'gran deporte' y te nombró Pretor Urbano de la ciudad. Quizás el poderoso Ventrue tiene una agenda oculta o es simplemente tan despreocupado como parece.\nEn cualquier caso, tu camino está claro. Debes desarmar a Camila de una forma u otra, reclamar Roma para ti y reconstruir desde allí el $pod_clan$ Brujah, purificado de sus viejos pecados."
 podintroductions.250.a: "¡Un Clan Brujah perfeccionado espera!"
 thrax_intro_tt: "Como Thrax, tienes acceso a un objetivo único para guiar a los Brujah hacia tu meta."

 thrax_decision: "Brujah Perfecto"
 thrax_decision_tooltip: "Ahora es el momento de guiar a los Brujah hacia una nueva era."
 thrax_decision_desc: "Domestica Roma y a su Cónsul Eterno, y los Brujah acudirán en masa a tu estandarte."
 thrax_decision_confirm: "¡Una nueva utopía!"
 thrax_decision_custom: "[GetScriptedCharacterByHistoryID('790101').GetFirstName] debe estar muerto, en $pod_torpor$ o ser tu vasallo"
 thrax_decision_effect_tooltip: "El Clan Brujah ganará renombre y muchos de sus miembros se convertirán a la Vía Pura."

 PODcanon_chars.75.desc: "Exaltada dama, lo lograste. Roma es indiscutiblemente tuya, el yugo de los Ventrue sobre el espíritu de los Brujah ha sido finalmente desechado después de siglos de dificultades. Tus compañeros de clan de todo el mundo contemplan tu victoria con asombro y debaten ferozmente sobre los méritos de tu hasta ahora nicho ideología del Gnosticismo. Tras la caída de Cartago, los Brujah buscaban desesperadamente una nueva utopía a la que aferrarse, desde el Sueño de Constantinopla hasta la Entelequia Menelea, pero, al final, parece que has triunfado sobre todos ellos.\nTu éxito indiscutible allanará el camino para el futuro de tu clan. Mantente firme en tus convicciones y sigue adelante, ¡y serás recordada como la segunda venida de Troile!"
 PODcanon_chars.75.a: "Un nuevo camino por delante."
 thrax_conversion_tt: "Los Brujah no fervientes tienen una alta probabilidad de convertirse a la Vía Pura."

 podintroductions.251.desc: "Sabio Caelestius, ¡tu hora ha llegado! En vida, se te negó el reconocimiento que debería haber sido tuyo con tu trabajo sobre la llamada 'Herejía Pelagiana'. Esos tontos de mente simple no te detendrán ahora que tienes la inmortalidad de tu lado.\nHas fusionado tus teorías pelagianas con tu nueva condición Cainita para formar una comprensión perfecta del Cristianismo y el Nodismo. Solo te falta la bendición papal para asegurarte de que el mundo finalmente reconozca tu genio.\nHasta ahora, esos simples vampiros italianos te barrieron el camino hacia la Santa Sede cada vez que lo intentaste, hablando de conceptos de mente estrecha como la 'Mascarada' o 'Esto es simplemente una idea terrible', pero no te has rendido. Verás al Papa y entonces el nombre de Caelestius pasará a la historia."
 podintroductions.251.a: "¡Roma espera!"
 caelestius_intro_tt: "Como Caelestius, puedes comenzar el [journey|E] para Revelarte al Vaticano gratis."

 podintroductions.252.desc: "Sabia Constancia, has regresado recientemente de tu exitoso viaje a Egipto, donde lograste frustrar los planes del loco Lázaro. Aún así, él era solo una parte de los muchos problemas que aquejan al $pod_clan$ Cappadocio. Con Japhet ocupado tratando de frenar a tu voluble abuelo, recae en ti actuar.\nLos Giovanni son la preocupación más apremiante y deben ser frenados antes de que tengan ideas. Los Lamia son exteriormente leales, pero su extraño culto a Lilith necesita ser vigilado cuidadosamente. Finalmente, Lázaro ha sido detenido, pero aún vive; algunos de sus secuaces probablemente intentarán despertarlo, lo cual no debe suceder.\nEl futuro del Clan Cappadocio depende de tus acciones, lady Constancia. No dejes que las oscuras profecías que experimentaste se cumplan."
 podintroductions.252.a: "El futuro puede cambiar."
 constancia_intro_tt: "Como Constancia, tienes una decisión única para unificar al clan Cappadocio."

 united_cappadocians_modifier: "Cappadocios Unidos"
 united_cappadocians_modifier_desc: "Por primera vez en la historia, el clan de la muerte está verdaderamente unido en pensamientos y propósito."

 constancia_decision: "Reparando a los Cappadocios"
 constancia_decision_tooltip: "Debes actuar antes de que las profecías se cumplan."
 constancia_decision_desc: "Varias fuerzas internas intentan separar a los Cappadocios. Eres la única que puede actuar para detenerlos."
 constancia_decision_confirm: "Las profecías no se cumplirán"
 constancia_decision_custom: "[GetScriptedCharacterByHistoryID('790537').GetFirstName] debe estar muerto, en $pod_torpor$, ser tu vasallo o vasallo de [GetTitleByKey('k_erciyes').GetNameNoTier]"
 constancia_decision_custom2: "[GetScriptedCharacterByHistoryID('710502').GetFirstName], el principal lugarteniente de [GetScriptedCharacterByHistoryID('710501').GetFirstName], debe estar muerto o en $pod_torpor$"
 constancia_decision_custom4: "El [title|E] [GetTitleByKey('k_giovanni').GetNameNoTier] no debe existir"

 lucretia_reckless_modifier: "Lucretia Imprudente"
 lucretia_reckless_modifier_desc: "Sin darse cuenta siempre, Lucretia corre muchos más riesgos de los que debería en todos sus esfuerzos."

 podintroductions.253.desc: "Lucretia la Intrépida, has sido recibida en el lado vampírico de la familia Giovanni con los brazos abiertos gracias a tu fuerte conexión con el reino de los muertos. Lamentablemente, lo que no se dan cuenta es que este vínculo ha sido una terrible carga para ti durante mucho tiempo, hasta el punto de que te sientes despreocupada por tu vida, lista para tirarla por capricho.\nAfortunadamente, tu [Glossary('Sire','game_concept_Sire_desc')] te ha mantenido ocupada con muchas tareas ocultas interesantes, quizás entendiendo que asegurarse de que tu mente esté siempre ocupada podría ser la mejor manera de ayudarte a soportar tu destino. Quizás esta es la clave, si pudieras encontrar un propósito lo suficientemente interesante para enfocar tu energía, las voces finalmente se calmarían."
 podintroductions.253.a: "Encontraré una manera."
 lucretia_intro_tt: "Como Lucretia, comienzas con un modificador negativo que puede mejorarse mediante una decisión única."

 lucretia_appeased_modifier: "Lucretia Aplacada"
 lucretia_appeased_modifier_desc: "Exteriormente, Lucretia parece tan atrevida como siempre. Sin embargo, en su interior, ahora valora su no-muerte como algo crítico para continuar con su nuevo propósito."

 lucretia_decision: "La Prodigio Imprudente"
 lucretia_decision_tooltip: "¿Cuál es el valor de tu propia vida?"
 lucretia_decision_desc: "Ambrogino vio potencial en ti y te ayudó a fomentarlo. Quizás encontrar un propósito superior es la clave para tu predicamento."
 lucretia_decision_confirm: "Mi mente está enfocada"

 podintroductions.254.desc: "Lord Guilelmo, te encuentras en lo que debería ser una posición envidiable: Príncipe de la poderosa ciudad de Venecia y respetado obispo de la Iglesia de Caín. Pero la realidad es mucho más preocupante.\nTu golpe (y la posterior falta de interés en administrar) ha dejado a Venecia como presa fácil para la codiciosa familia Giovanni, que, a todos los efectos, ahora controla el territorio de la República excepto la ciudad misma. Puede que pronto quieran ir por la yugular (y la tuya).\nPeor aún, el nuevo arzobispo de la Iglesia de Caín, Nikita de Sredetz, ha demostrado ser una amenaza para la propia Sede de Nod, aparentemente comprometido a tomar las peores decisiones posibles. Actualmente estás construyendo un caso contra él para presentarlo ante la Sede... pero todos estos esfuerzos serían en vano si perdieras Venecia antes."
 podintroductions.254.a: "Estoy caminando sobre una cuerda floja."
 guilelmo_intro_tt: "Como Guilelmo, tienes una decisión única que requiere que mantengas Venecia durante los próximos 20 años. Si lo haces, heredarás lo que quede de la Sede de Nod en ese momento."

 guilelmo_decision: "Salvando la Iglesia y a Ti Mismo"
 guilelmo_decision_tooltip: "Salvar las almas de los Hijos de Caín primero requiere salvarte a ti mismo."
 guilelmo_decision_desc: "Casi has terminado tu caso contra Nikita de Sredetz. Si puedes mantener tu posición un poco más, la Sede de Nod será tuya."
 guilelmo_decision_confirm: "¡Estás acusado!"
 guilelmo_custom_decision: "Esta decisión está disponible después del 1 de enero de 1250"

 podintroductions.255.desc: "Lady Fatima, tu no-muerte ha sido serena hasta ahora. Tu [Glossary('Sire','game_concept_Sire_desc')] fue un mentor paciente y el $pod_clan$ Lasombra reconoció rápidamente tu potencial. Pero con esta gran educación vienen grandes expectativas y el clan ahora ha delineado su primera misión para ti, y es difícil.\nLos Lasombra siempre han reclamado Mogadiscio como su ciudad a pesar de nunca haberla controlado realmente. Muchos neonatos (o incluso vampiros más experimentados) fueron enviados a la 'ciudad de las perlas' para domarla, pero ninguno de ellos pudo navegar la compleja situación política allí.\nFrancamente, ninguno de ellos regresó.\nSin embargo, no eres solo otra Lasombra. Has sido preparada para la grandeza y demostrarás tu valía aquí y ahora."
 podintroductions.255.a: "Regresaré victoriosa."
 fatimaallama_intro_tt: "Como Fatima, tienes una decisión especial que requiere que controles completamente Ajuraan. Si lo logras, el clan Lasombra te enviará grandes recompensas."

 fatima_queen_pearls_modifier: "Monarca de Luz Perla"
 fatima_queen_pearls_modifier_desc: "La Reina de Mogadiscio gobierna una de las ciudades más prósperas del mundo, haciendo que todo su clan se sienta orgulloso en el proceso."

 fatimaallama_decision: "Monarca de Luz Perla"
 fatimaallama_decision_tooltip: "Tienes una misión y la cumplirás. Los ojos del clan están puestos en ti."
 fatimaallama_decision_desc: "Mogadiscio debe ser de los Lasombra. Esta es tu tarea y las recompensas que te esperan son grandes. Has sido demasiado bien preparada para fallar."
 fatimaallama_decision_confirm: "Sombras sobre Mogadiscio"

 podintroductions.256.desc: "Lord Darshuf, este es el final del camino. Una vez gobernaste Damasco con justicia e hiciste de esta ciudad una joya del Levante, pero la insidiosa corrupción de Annazir llegó a ti. Los Baali infernalistas ahora merodean por tus calles, gobernando tu ciudad en tu lugar mientras estás confinado indefenso en tu palacio. Los rumores de un temido pozo de sacrificios se extienden y podrías ser recordado como el príncipe débil que permitió que el infierno fuera traído a la tierra. La posibilidad de un inminente ataque de los Banu Haqim a tu ciudad te da algo de esperanza, pero eres impotente para ayudarlos.\nSin embargo, hay algo que puedes hacer. Tu querido vástago, Mannal, nunca se apartó de tu lado e hizo todo lo posible por salvarte. Es hora de que la salves tú. Usarás la poca fuerza que te queda para ayudarla a asumir el poder en Damasco y frustrar a los Baali. Sabes que solo la destrucción te espera al final de este camino.\nPero también, quizás, la redención."
 podintroductions.256.a: "Mi último acto será bueno."
 podintroductions.256.b: "Todo está perdido..."
 darshuf_intro_tt: "Al final de esta cadena de eventos, abdicarás en favor de Mannal con varias preparaciones para ayudarla a asumir el poder."

 PODcanon_chars.76.t: "Tratando con el Diablo"
 PODcanon_chars.76.desc: "Annazir ha sido tu perdición. Viniendo a Damasco y haciéndose pasar por un amigo, poco a poco introdujo su corrupción en tu mente, haciéndote participar en cosas horribles que no quieres recordar. Desde entonces, a todos los efectos, ha tomado el control de Damasco y sus secuaces están invadiendo tu ciudad.\nEs demasiado tarde para la sutileza ahora. Si quieres que Mannal herede una ciudad en recuperación, debes actuar audazmente contra los Baali, sin importar las consecuencias. Sigues siendo un vampiro de impresionante poder individual, lo que te da dos opciones. La primera sería atacar a los lugartenientes de Annazir que viven satisfechos bajo tu nariz, mientras que la otra sería lidiar con los numerosos activos mortales que adquirió desde que llegó a Damasco."
 PODcanon_chars.76.a: "Hora de morir, 'amigos'."
 PODcanon_chars.76.b: "Damasco debe ser purgada."

 PODcanon_chars.77.t: "Tu Legado"
 PODcanon_chars.77.desc: "Mannal necesitará toda la ayuda que pueda obtener cuando Damasco finalmente quede a su cuidado. Todavía tienes algunos activos que podrías liquidar antes de que los Baali lancen su contraofensiva, ya que el oro ciertamente podría ser útil. De lo contrario, a pesar de todo lo que ha sucedido desde entonces, una vez lograste que Damasco fuera una ciudad próspera y bien gestionada. Tomarte el tiempo para hablar con ella y enseñarle lo que aprendiste podría darle una ventaja inicial y, con suerte, evitar que cometa los mismos errores que tú.\nY, si eres honesto contigo mismo, disfrutarías pasar tus últimas noches en esta tierra con ella."
 PODcanon_chars.77.a: "Mi tiempo ha pasado, ella necesitará activos."
 PODcanon_chars.77.b: "Necesitamos hablar, vástago..."

 PODcanon_chars.78.t: "El Final y el Principio"
 PODcanon_chars.78.desc: "Lord Darshuf, ha llegado el momento. Ahora que has dejado de ser solo un títere para los Baali, tus enemigos se acercan. Tienes una última opción, la opción de cómo morir.\nBistakh de los Banu Haqim tomaría tu cabeza con gusto por tus crímenes y sabes que eres el único obstáculo entre ella y la amistad de Mannal. Tener un aliado tan fuerte ciertamente ayudaría a tu vástago en el futuro.\nAnnazir es otra posibilidad. Morir como mártir podría reunir algo de buena voluntad para aquellos aún no corrompidos por los infernalistas, y eso también podría ayudar a Mannal.\nAquí es donde termina. Harás que cuente."
 PODcanon_chars.78.a: "La justicia está hecha."
 PODcanon_chars.78.b: "En un resplandor de gloria."

 podintroductions.257.desc: "Lord Shamit, la repentina desaparición de tu [Glossary('Sire','game_concept_Sire_desc')] te ha permitido tomar las riendas del poder en Adén. Antes de eso, siempre has sido un vástago diligente y cumplidor, renombrado como un administrador habilidoso que ayudó a Adén a alcanzar la prosperidad que conoce hoy. La transición a la posición real de poder en la ciudad resultó natural y emocionante.\nAprovechando al máximo esta oportunidad, rápidamente creciste en poder en la región, convirtiéndote en el principal actor de poder en Yemen. Sin embargo, dos nubes se ciernen en tu horizonte. Han circulado rumores sobre el resurgimiento de tu Sire últimamente en el este, y no renunciarás a tu poder, lo que te deja sin otra opción que lidiar con él para siempre.\nMás cerca de casa, tu hermano de sangre Sakan fue una vez preparado para gobernar por tu Sire y podría representar una amenaza. Sin embargo, hasta ahora no ha hecho ningún movimiento contra ti, por lo que podrías manejarla sin recurrir a la violencia."
 podintroductions.257.a: "No me inclinaré ante nadie nunca más."
 shamshit_intro_tt: "Como Shamit, tienes una decisión única que requiere que estabilices tu situación antes de buscar nuevas oportunidades."

 shamit_decision: "Consolidando tu gobierno"
 shamit_decision_tooltip: "Adén es tuya, te asegurarás de que siga siéndolo."
 shamit_decision_desc: "La sombra de tu Sire todavía se cierne sobre Yemen. Debes eliminar los restos de su gobierno antes de buscar oportunidades en el norte."
 shamit_decision_confirm: "Ya no soy un vástago"
 shamit_decision_custom: "[GetScriptedCharacterByHistoryID('790296').GetFirstName], tu Sire, debe estar muerto o en $pod_torpor$"
 shamit_decision_custom2: "[GetScriptedCharacterByHistoryID('791099').GetFirstName], tu hermano de sangre, debe estar muerto, en $pod_torpor$ o tener una relación positiva contigo ([lover|E], [friend|E], [soulmate|E], [best_friend|E], miembro de tu [coterie|E])"

 podintroductions.258.desc: "Poderoso Dracon, has estado suplantando al débil Nikita de Sredetz para socavar la odiada Iglesia de Caín desde dentro. Esto ha sido un éxito rotundo hasta ahora, ya que has reducido la que fue una poderosa organización a sus posesiones centrales en los Balcanes.\nEs hora del golpe de gracia. Una vez que la propia Sede de Nod caiga, podrás deshacerte de esta personalidad fabricada y reflexionar sobre qué hacer a continuación. Recrear el Sueño podría ser una opción, para honrar a tu amado Miguel si no es por nada más. Pero hay otras opciones y la eternidad por delante una vez que tu venganza esté completa."
 podintroductions.258.a: "Terminaré esto y renaceré."
 podintroductions.258.b: "Puede haber otro camino por delante."
 nikita_intro_tt: "Seguirás una cadena de eventos que alterará drásticamente tu posición inicial, terminando con que te conviertas en el Dracon, un vampiro poderoso, pero destruyendo la Sede de Nod y comenzando de nuevo desde un solo condado."

 PODcanon_chars.79.t: "Liquidando la Iglesia"
 PODcanon_chars.79.desc: "Como Arzobispo de Nod, tienes una gran autoridad sobre los miembros de la Iglesia de Caín. Hasta ahora, tu socavamiento ha sido sutil, pero has llegado a un punto donde tal duplicidad ya no es necesaria. Emitirás una serie de edictos contradictorios y sin sentido a los fieles, mientras también revelas sus activos secretos a sus enemigos.\nCualquier miembro restante de la Iglesia después de tu purga seguramente encontrará que su no-muerte se vuelve bastante desagradable."
 PODcanon_chars.79.a: "El comienzo de su fin."
 nikita_liquidating_tt: "Cada seguidor de la Vía Caín, excepto tú, perderá oro, prestigio y piedad."

 PODcanon_chars.80.t: "Un Asesinato de Cardenales"
 PODcanon_chars.80.desc: "Muchos miembros de alto rango de la Iglesia de Caín ya fueron eliminados durante tus primeros planes contra la organización hace varios años. Aún así, algunos cardenales poderosos sobreviven y podrían presentar una amenaza si intentaran tomar la Iglesia para sí mismos después de tu partida.\nPara asegurarte de que esto no suceda, has convocado una sesión de la Sede de Nod donde los cardenales restantes están ansiosos por discutir una solución para salvar su religión fallida.\nTe asegurarás de que nadie salga con vida de la sala del Cenáculo. Excepto tú, por supuesto."
 PODcanon_chars.80.a: "Renacido en su sangre."

 PODcanon_chars.81.t: "El Fin de su Era"
 PODcanon_chars.81.desc: "No queda nada importante de la Iglesia de Caín. Sus líderes están muertos, su doctrina calumniada, sus miembros cazados como la débil presa que son. Tu venganza está completa y los instigadores de la desastrosa 4ª Cruzada que mató a tu amado Miguel son cenizas al viento. Solo queda un paso.\nEs hora de deshacerte de este penoso disfraz y disolver la Sede de Nod, eliminando cualquier última esperanza que los Herejes Cainitas pudieran albergar. La Iglesia de Caín está muerta. Nikita de Sredetz está muerto.\nEl Dracon ha renacido."
 PODcanon_chars.81.a: "En su locura, mi redención."

 kartarirya_eternal_war_modifier: "Guerra Eterna"
 kartarirya_eternal_war_modifier_desc: "Avanzas para conquistar este mundo miserable, con tus feroces ghouls de guerra liderando el camino."

 podintroductions.259.desc: "Kartarirya el Temible, la India te ha resistido por demasiado tiempo. Como dios de la guerra de esta tierra, deberías haberla bañado en sangre y horror hace mucho tiempo, pero estos obstinados Ravnos y [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] resultan ser enemigos resistentes, a veces incluso aliándose entre ellos para detenerte. No más.\nHas pasado la última era perfeccionando tus ghouls de guerra hasta un grado nunca antes visto y estás listo para desatarlos en una gloriosa conquista sangrienta.\nLa guerra eterna de la India terminará cuando toda la tierra yazca muriendo a tus pies y entonces... entonces el mundo será tu horrible patio de recreo."
 podintroductions.259.a: "¡La muerte y la carnicería aguardan!"
 kartarirya_intro_tt: "Como Kartarirya, siempre tienes acceso al [casus_belli|E] de Invasión, independientemente de tu religión o cultura."

 vencel_divided_attention_modifier: "Atención Dividida"
 vencel_divided_attention_modifier_desc: "Su deber jurado tanto para con su sire como para con Budapest hace que la vida de Vencel sea bastante complicada."

 podintroductions.260.desc: "Vencel el Leal, Budapest prospera bajo tu cuidadoso gobierno mientras equilibras tu diplomacia entre los arrogantes Ventrue alemanes y sus aliados Tremere. Los Tzimisce en su mayoría te ignoran por ahora, concentrados como están en los Tremere. Aún así, tienes problemas más cercanos a casa que resolver.\nHas estado vigilando a tu [Glossary('Sire','game_concept_Sire_desc')] Bulscu durante algún tiempo. Este que fuera un orgulloso y poderoso caudillo se ha reducido a un desastre hedonista a pesar de tus mejores esfuerzos. Sin embargo, recientemente ha caído en $pod_torpor$ y esperas que despierte purgado de sus indeseables ansias. Mientras lo cuidas, también tienes que gestionar activamente tu creciente ciudad y su compleja red de intrigas. Esta atención dividida pesa sobre ti, pero, como siempre, harás lo que se requiera de ti."
 podintroductions.260.a: "Como dicta el honor."
 vencel_intro_tt: "Tendrás oportunidades para deshacerte de tu modificador inicial en los próximos años. Si no lo haces y, en cambio, equilibras tu atención, obtendrás una recompensa por tu dedicación."

 PODcanon_chars.82.t: "Querida Familia"
 PODcanon_chars.82.desc: "Lord Vencel, siempre has sido el único vástago leal y útil de la prole vampírica 'Arpad' que tu Sire Bulscu creó. Tus compañeros van desde los casi cómicamente incompetentes como Nova hasta los realmente dañinos como Geza y su extraña ideología apocalíptica.\nLamentablemente, nunca pudiste eliminar verdaderamente su influencia de Hungría mientras los mantenías alejados de Bulscu, y el daño que causan solo se acumula. Podrías tomar el asunto en tus propias manos, pero eso requeriría dejar a Bulscu desprotegido por un tiempo, algo que no te gusta hacer."
 PODcanon_chars.82.a: "Tienen que ser detenidos."
 PODcanon_chars.82.b: "Solo paga a algunos agentes para frenar su influencia."
 vencel_balancing_tt: "Mantienes tu enfoque equilibrado, y dividido."

 PODcanon_chars.83.t: "Entre la Cruz y los Voivodas"
 PODcanon_chars.83.desc: "Lord Vencel, Hungría siempre ha estado en una posición precaria. Por un lado, los Feudos de la Cruz Negra básicamente te consideran un vasallo, mientras que por el otro, los Voivodatos Tzimisce piensan que eres un invasor. En verdad, has estado equilibrando precariamente sus posiciones para asegurarte de que tus 'Señores Orientales' sigan siendo independientes y útiles para todos.\nEsto ha ido bien hasta ahora, pero una reciente serie de comunicaciones, que van desde demandas hasta amenazas, de tus vecinos te ha dejado sobrecargado de trabajo para mantener el ritmo. Podrías dedicar todas tus horas de trabajo a esa importante tarea, pero eso dejaría tus otros deberes, más secretos, desatendidos."
 PODcanon_chars.83.a: "Esto es demasiado importante para posponerlo."
 PODcanon_chars.83.b: "Puedo manejar todo yo mismo sin problema."

 PODcanon_chars.84.t: "El Hombre de Sangre Regresa"
 PODcanon_chars.84.desc: "Al principio te costó creerlo, pero es verdad, Bulscu, tu respetado [Glossary('Sire','game_concept_Sire_desc')], finalmente ha despertado de su letargo hedonista. Temías que volviera a caer en sus oscuros hábitos, pero parece que el $pod_torpor$ le ha sido beneficioso y ves indicios del gran señor de la guerra que una vez fue.\nAnunciando rápidamente su regreso a la corte, el carisma y la fuerza de Bulscu ya han atraído a muchos aspirantes dispuestos a participar en su gloria recuperada. El caudillo no ha pasado por alto tu lealtad, permitiéndote mantener el poder en Hungría hasta que se aclimate completamente a los tiempos cambiantes.\nCon su carisma, su experiencia marcial y tu diligente administración, estás seguro de que nada puede detenerte ahora."
 PODcanon_chars.84.a: "Es un honor servirte de nuevo."

 podintroductions.261.desc: "Bendito Cardenal, has sido la influencia $pod_cainite$ más importante en la Iglesia durante algún tiempo. Algunos temen que tus maquinaciones puedan causar problemas con esta poderosa organización, pero estás seguro de que tienes todo bajo control.\nEn verdad, no sientes amor por el catolicismo, una pálida sombra del gran arrianismo de tu juventud, pero reconoces una herramienta útil cuando la ves. Sin embargo, se avecinan problemas, ya que Camila, la que fuera Cónsul Eterno de Roma, ha despertado y rápidamente ha asumido el control de Roma, cortándote efectivamente de muchos de tus activos. Peor aún, si lograra debilitar a la propia Iglesia Católica, tu propio poder se vería afectado.\nVerdaderamente, solo hay un camino a seguir. Debes tomar el control de la propia Roma para que nadie pueda poner en peligro tus esfuerzos en el Vaticano nuevamente."
 podintroductions.261.a: "Y así lo haré."
 fabrizio_intro_tt: "Como Fabrizio, tienes acceso a una decisión única que requiere que controles Roma. Si lo logras, obtienes acceso a un nuevo tipo de Soldados y te aseguras de que, durante la Era de la Inquisición, Italia se salve."

 eternal_cardinal_modifier: "Cardenal Eterno"
 eternal_cardinal_modifier_desc: "Tu rostro está en las pinturas del Vaticano, tus palabras en los edictos papales y tu voluntad en la mente del Papa."

 fabrizio_decision: "El Cardenal Eterno"
 fabrizio_decision_tooltip: "Tu estrangulamiento sobre la política de Roma está amenazado. Debes actuar."
 fabrizio_decision_desc: "La toma de poder de Camila en Roma amenaza tu control sobre la Santa Sede. Esto no es algo que puedas permitir."
 fabrizio_decision_confirm: "Bendita sea Roma. Bendito soy yo"
 fabrizio_custom_decision: "Obtendrás acceso a los Soldados Cazadores de Brujas. Además, durante la Era de la Inquisición, Italia se salvará"

 podintroductions.262.desc: "Valiente Enkara, has estado planeando tu regreso a Corazín durante años. Salvar a tu amado [Glossary('Sire','game_concept_Sire_desc')] de las garras del demonio Namtaru es tu máxima prioridad. Lamentablemente, el resto de tu clan no lo aprueba.\nIncluso el sabio y respetado Al-Ashrad te aconsejó no emprender este viaje, previendo una gran crisis para los Banu Haqim si lo hacías. Pero no importa porque, al final, eres una de las guerreras más poderosas y respetadas de Alamut y, como tal, realmente no pueden detenerte.\nEsperas con ansias reencontrarte con Izhim y finalmente recompensarlo por todo lo que hizo por ti. Pero una sensación persistente permanece en tu mente, advirtiéndote que podría ser una idea terrible..."
 podintroductions.262.a: "No hay más tiempo que perder."
 podintroductions.262.b: "Quizás debería reconsiderarlo..."
 enkara_intro_tt: "Este es un curso de acción muy peligroso."

 PODcanon_chars.85.t: "Tan Cerca y Sin Embargo..."
 PODcanon_chars.85.desc: "Las cavernas están inquietantemente silenciosas cuando entras, muy lejos de la frenética batalla que lideraste allí hace mucho tiempo. Tu misión es tan importante como lo fue entonces, al menos para ti. Esperas trampas, quizás cultistas enfurecidos, pero nada de eso. Solo tus recuerdos, tu tristeza y tu inquebrantable convicción te acompañan. Y finalmente, llegas.\nIzhim está donde lo dejaste, aparentemente todavía atormentado por el demonio que lo sostiene literalmente en la palma de su mano. El debilitado Banu Haqim te extiende la mano, ofreciéndote la sombra de una sonrisa astuta que tanto anhelabas. Este es tu momento y sin embargo..."
 PODcanon_chars.85.a: "Algo no anda bien..."
 PODcanon_chars.85.b: "¡Finalmente!"

 PODcanon_chars.86.t: "Enterrando a Tu Amor"
 PODcanon_chars.86.desc: "Mientras Enkara, tu amor, se disuelve gritando en el abrazo de Namtaru, reflexionas sobre el sacrificio que tuviste que hacer. Para liberarte de sus garras, aceptaste la oferta de Namtaru de desatar la Maldición de los Baali sobre ellos de una vez por todas, asegurándote de que nunca vuelvan a ser los mismos. Un ritual tan poderoso requería un sacrificio digno y sabías que Enkara vendría una noche. Y así lo hizo.\nAhora eres libre para caminar de nuevo, pero sabes que el demonio nunca te dejará ir por completo. Para deshacerte de este amo, tendrás que encontrar otras entidades poderosas que te ayuden.\nAl final, tu alma sigue siendo tuya y honrarás el sacrificio de Enkara asegurándote de que, pase lo que pase en el futuro, termines sobreviviéndolo."
 PODcanon_chars.86.a: "No te olvidaré."
 izhim_intro_tt: "Ahora juegas como Izhim. El clan Banu Haqim, excepto tú, ha sido maldito por los Baali gracias a tus acciones."

 white_pearl_modifier: "La Perla Blanca"
 white_pearl_modifier_desc: "Mogadiscio es el bullicioso y rebelde centro de comercio de un continente entero, siempre expandiéndose como si tuviera vida propia."

 podintroductions.263.desc: "Lady Farnaza, te encuentras en una encrucijada. A medida que Mogadiscio se expande hasta convertirse en una ciudad poderosa, todos intentan arrebatártela. Los Laibon piensan que uno de los suyos debería liderar esta ciudad africana, los Ramanga quieren recuperarla para lavar la mancha de tu toma de poder, los Ashirra usan la creciente comunidad musulmana para reclamarla e incluso los Lasombra tejen algunas historias fantásticas sobre su lugar natural como gobernantes del mar. Bueno, que todos lo intenten.\nSin embargo, no eres tan confiada como para quedarte inactiva y tienes varias opciones abiertas. La Reina de la Perla Blanca no renunciará a su trono tan fácilmente."
 podintroductions.263.a: "Apelar a Alamut en busca de apoyo."
 podintroductions.263.b: "Necesito el apoyo de los Ashirra."
 podintroductions.263.c: "Abre de par en par el puerto, Mogadiscio prosperará en el caos."
 podintroductions.263.d: "Necesito más información de Jakuta..."

 podintroductions.264.desc: "Ikkenai la Temible, te preparas para tu asalto a Aquisgrán. No es la primera vez que atacas este lugar, ya lo hiciste una vez cuando esta ciudad todavía se llamaba Aquis. En aquel entonces, lideraste una improbable coalición de hombres lobo Getos de Fenris y magos de la Antigua Fe, pero ni siquiera estos fuertes aliados fueron suficientes.\nEl panorama político ha cambiado mucho desde entonces, pero los Getos de Fenris no han olvidado que una vez fuiste compañero de armas. Un pequeño número de ellos se ha ofrecido a ayudarte en este nuevo ataque y, aunque ciertamente no serán suficientes por sí solos, sigue siendo una gran ayuda para tu causa.\nSi demostraras tu fuerza y tomaras Aquisgrán, es probable que los Getos de Fenris permitieran una relación más formal. Claramente, el primer camino para vengar a tu tribu."
 podintroductions.264.a: "¡Marchamos a la guerra una vez más!"
 ikkenai_intro_tt: "Como Ikkenai, tienes una decisión que requiere que mantengas Aquisgrán. Si tienes éxito, obtendrás acceso a los Soldados Mjolnir de los Getos de Fenris."

 ikkenai_decision: "Guerrero de las Viejas Costumbres"
 ikkenai_decision_tooltip: "Mientras vivas, tu tribu no será olvidada."
 ikkenai_decision_desc: "La ciudad de Aquis, luego Aquisgrán, ha sido la perdición de tu tribu desde su creación. Destruirla será el primer paso en tu labor para socavar a los cristianos alemanes."
 ikkenai_decision_confirm: "¡Las viejas costumbres triunfan!"
 ikkenai_custom_decision: "Obtendrás acceso a los Soldados Mjolnir de los Getos de Fenris, ya que los hombres lobo están impresionados por tu victoria sobre la civilización"

 podintroductions.265.desc: "Arnulf el Temible, esta alianza 'Ferales de Livonia' te complace. Finalmente, las fuerzas de la naturaleza trabajan juntas bajo una misma bandera para repeler a los guerreros de la cruz.\nAunque tienes que darle algo de crédito al joven Qarakh por ello, has encontrado al hombre insuficiente y dudas de que pueda llevarte a la victoria.\nTu fama entre los Gangrel es material de leyendas y, aunque no te gusta usarla demasiado, podría ser el momento de hacerlo. Esta excelente oportunidad podría no repetirse.\nHas visto muchos intentos fallidos de acabar con la civilización en tu no-muerte, desde las invasiones godas hasta las actuales hordas mongolas, pero esta vez puedes sentirlo, esta será la buena."
 podintroductions.265.a: "¡La Cruz se derrumba!"
 arnulf_intro_tt: "Como Arnulf, tienes un [character_interaction|E] que te permite llamar a tu lado a cualquier Gangrel que no sea rival ni esté en $pod_torpor$. Cuanto más poderosos sean, más costoso será."

 POD_arnulf_interaction: "La Llamada de Arnulf"
 POD_arnulf_interaction_desc: "¡Únete a mí! ¡Cabalgaremos hacia la victoria!"

 indebted_giovanni_modifier: "En Deuda con los Giovanni"
 indebted_giovanni_modifier_desc: "Todavía estás pagando tu deuda con tus patrocinadores mercaderes nigromantes."

 podintroductions.266.desc: "Poderosa Inanna, tu última expedición para matar al demonio Angiwar no salió bien. Tienes que reconsiderar tu estrategia y considerar alianzas nuevas o antiguas, especialmente porque el propio Angiwar encontró un poderoso amigo en la persona de Julia Antasia.\nEl rival de Julia, Hardestadt, estaría más que feliz de permitirte arrodillarte ante él, lo que ayudaría a igualar el campo de juego de los aliados alemanes entre tú y Angiwar.\nLos misteriosos nigromantes Giovanni también están interesados en establecerse en tu dominio, ofreciéndote un préstamo del oro que tanto necesitas si aceptas su ayuda.\nFinalmente, el que fuera Cónsul Eterno de Roma, Camila, ha despertado recientemente. Fuiste uno de sus generales favoritos en el pasado y trabajasteis bien juntos. Es probable que te envíe regalos, quizás incluso tu antiguo equipo romano, si reavivas esta amistad.\nConsidera bien la elección que tienes por delante y luego cabalga para destruir finalmente a tu némesis de una vez por todas."
 podintroductions.266.a: "Necesito mi propio patrón alemán."
 podintroductions.266.b: "¿Oro y tropas no-muertas? ¿Dónde firmo?"
 podintroductions.266.c: "Como en los viejos tiempos."
 podintroductions.266.d: "¡No necesito a nadie!"

 midian_courtiers_modifier: "¿Quién necesita cortesanos?"
 midian_courtiers_modifier_desc: "¡Ya tienes tu propia corte en tu cabeza!"

 midian_councilors_modifier: "¿Quién necesita consejeros?"
 midian_councilors_modifier_desc: "Las voces tienen consejos mucho más sabios."

 midian_vassals_modifier: "¿Quién necesita vasallos?"
 midian_vassals_modifier_desc: "Gobernar todo tú mismo es mucho más seguro."

 podintroductions.267.desc: "Lord Midian, gobiernas justa y legítimamente la ciudad de Hamburgo después de tu triunfo contra la codiciosa clase mercantil. Desde tu reluciente torre, rodeado de tu sabio consejo y tu prestigiosa corte, ahora estás listo para inaugurar una nueva era de prosperidad para Alemania.\nIgnora a las mentes mezquinas que vienen a tu ciudad y afirman que estás solo en una torre en ruinas, solo rodeado de las voces en tu cabeza. O mejor aún, añádelos a tu corte. Descubriste que las almas de las personas hostiles que conoces terminan siendo mucho más dóciles una vez añadidas al palacio de tu mente..."
 podintroductions.267.a: "¡Silencio en la corte! ¡No todos a la vez!"
 midian_intro_tt: "Como Midian, si de alguna manera sobrevives como Príncipe de Hamburgo durante 20 años, podrás curar uno de tus modificadores negativos.\nNo los otros, sin embargo, nadie dijo que ser el Malkavian más loco de la región sería justo."

 midian_decision: "Sabio Gobernante de Hamburgo"
 midian_decision_tooltip: "Tu gobierno puede no ser eterno, pero ¿puede durar al menos 20 años?"
 midian_decision_desc: "Todo está bien en la bella Hamburgo bajo tu sabio gobierno. Todo obviamente seguirá bien para siempre."
 midian_decision_confirm: "Un gobierno eterno y próspero"
 midian_decision_effect_tooltip: "Un evento te permitirá eliminar uno de tus modificadores iniciales negativos."

 PODcanon_chars.87.t: "Mejorando la Perfección"
 PODcanon_chars.87.desc: "A pesar de los detractores que proclaman lo contrario, has demostrado que tu sabio gobierno sobre Hamburgo ha llegado para quedarse. Con tu erudito consejo y tus estimados cortesanos guiándote, has podido llevar a la ciudad hacia su máximo potencial.\nIncluso la perfección tiene margen de mejora, sin embargo, y has estado considerando permitir algunos cambios en tus métodos de gobierno. ¿Quizás permitir que algunos recién llegados expresen su opinión, incluso cuando no se sientan dentro del palacio de tu mente, podría proporcionar algunos beneficios?"
 PODcanon_chars.87.a: "Abriré mi corte."
 PODcanon_chars.87.b: "Acepto nuevos consejos."
 PODcanon_chars.87.c: "¿Quizás delegar podría ser sabio?"
 PODcanon_chars.87.d: "¡Todo está perfectamente bien como está!"

 podintroductions.268.desc: "Honorable Angiwar, has pasado toda tu existencia luchando por la salvación del $pod_clan$ Nosferatu. Tu última derrota contra los temidos Nictuku, esos cazadores de tu pueblo, te ha hecho entender que no puedes ganar esta guerra por tu cuenta.\nTu reciente encuentro con Julia Antasia y sus tentadoras ideas para una utopía de sabor romano te interesan enormemente; quizás con la ayuda de este poderoso Metusalah tu clan finalmente podría prosperar. Sin embargo, hay otras opciones disponibles.\nMuchos Nosferatu quieren que reclames el liderazgo del clan, algo que has estado considerando pero que nunca has intentado lograr hasta ahora.\nFinalmente, podrías esforzarte por lograr un frente más unido para tu pueblo, encontrando la fuerza para contraatacar a los horrores que te acechan poniéndote al lado de tus hermanas y hermanos."
 podintroductions.268.a: "¿Es Roma nuestro camino hacia la salvación?"
 podintroductions.268.b: "Debo liderarlos y salvarlos."
 podintroductions.268.c: "Juntos, triunfaremos."
 angiwar_intro_tt: "Como Angiwar, obtienes acceso al objetivo de la República Eterna."
 angiwar_intro_tt2: "Como Angiwar, lograr el objetivo Horrores en la Oscuridad otorga recompensas adicionales."
 angiwar_intro_tt3: "Como Angiwar, siempre puedes ofrecer una alianza negociada a personajes Nosferatu."

 podintroductions.269.desc: "Lord Kodesh, encontrar el Grial te liberó de la maldición Nosferatu... pero luego te trajo solo un aburrimiento eterno. No te gusta la idea de morir, pero la perspectiva de vivir para siempre te ha resultado terriblemente aburrida. Por eso has orientado toda tu existencia hacia la búsqueda de nuevas fuentes de entretenimiento.\nRecientemente sumergiste a los Templarios de Jerusalén en una búsqueda insensata de un Grial inexistente en la tumba de una Momia gruñona. Fue divertido, pero sabes que solo te durará un tiempo.\nEn tu larga no-muerte, no habías visitado esta parte del mundo todavía, lo que te trae una nueva emoción para probar nuevos planes en las incautas criaturas de esta zona. Probablemente no les importará demasiado, no es que te importe de todos modos."
 podintroductions.269.a: "¡Tanta diversión aguarda!"
 kodesh_intro_tt: "Kli Kodesh está hastiado más allá de toda creencia, solo puede recuperar estrés de su único [character_interaction|E] Pequeñas Maquinaciones de Kodesh en otros."

 eternal_boredom_modifier: "Aburrimiento Eterno"
 eternal_boredom_modifier_desc: "Kli Kodesh está hastiado más allá de toda creencia, solo puede recuperar estrés de su único [character_interaction|E] Pequeñas Maquinaciones de Kodesh en otros."

 POD_kodesh_interaction: "Pequeñas Maquinaciones de Kodesh"
 POD_kodesh_interaction_desc: "Métete con este personaje para divertirte y aliviar el estrés."

 grail_fool_errand_modifier: "Insensato Buscador del Grial"
 grail_fool_errand_modifier_desc: "Este personaje busca febrilmente un artefacto inexistente."

 PODcanon_chars.88.desc: "Durante tu larga vida has dominado el arte de divertirte a expensas de los demás. Ahora que tu objetivo está elegido, lo único que queda es seleccionar una de las múltiples opciones que tienes para asegurarte de que te entretengan involuntariamente en los años venideros."
 PODcanon_chars.88.a: "Entrégales un rompecabezas irresoluble."
 PODcanon_chars.88.b: "Soborna a sus mejores guardias para que se lo tomen con calma."
 PODcanon_chars.88.c: "Diles al oído un montón de tonterías de sonido importante."
 PODcanon_chars.88.d: "Envíalos en la búsqueda del Falso Grial."

 podintroductions.270.desc: "Lord Varsik, tu llegada a la política vampírica de Jerusalén fue un gran éxito, con tu influencia y tu tesoro creciendo constantemente. Luego llegó la llamada 'Leona' y su actitud de fanática no encajaba bien con tus planes. Sabiamente decidiste retirarte y probar un enfoque más a largo plazo.\nEstás bastante seguro de que se estrellará contra su perdición antes de lo que se piensa sin ayuda, pero te preguntas si un pequeño 'empujón' de tu parte podría ser oportuno. Necesitas volver a Jerusalén para predicar la buena palabra del credo bashirita antes de que llegue el Apocalipsis.\nY, bueno, también para ganar algo de dinero. Después de todo, nadie es perfecto."
 podintroductions.270.a: "¡Mi rebaño clama por mi regreso!"
 varsik_intro_tt: "Como Varsik, tienes una decisión especial que requiere controlar Jerusalén. Una vez hecho, podrás elegir entre la fe o la codicia."

 varsik_decision: "De vuelta a Jerusalén"
 varsik_decision_tooltip: "Aquí es donde el mundo terminará y comenzará de nuevo, y aquí es donde perteneces."
 varsik_decision_desc: "Estuviste cerca de la grandeza antes de que te obligaran a abandonar la Ciudad Santa. Es hora de planificar tu regreso."
 varsik_decision_confirm: "¡Una Ciudad Dorada de fe!"

 PODcanon_chars.89.desc: "Tu regreso a Jerusalén ha sido tan glorioso como se esperaba. La Ciudad Santa claramente te estaba esperando, al igual que tu rebaño, ansioso por escuchar tus palabras de sabiduría. Los negocios también están en auge y has reactivado algunos de tus viejos planes para asegurarte de que el oro comience a fluir de nuevo hacia tus merecedores cofres.\nA pesar de esta victoria, te has sentido incómodo y algunos de tus discípulos han hecho una buena observación. Quizás tu atención dividida entre asuntos del alma y asuntos de la moneda te ha hecho sentir algo desorientado.\nQuizás es hora de comprometerse con un camino y seguirlo."
 PODcanon_chars.89.a: "El alma es más importante..."
 PODcanon_chars.89.b: "...¡pero el oro es más brillante!"
 PODcanon_chars.89.c: "¡Puedo hacer que funcione!"

 podintroductions.271.desc: "Lord Ramessu, aunque no eres nativo de esta región, rápidamente te enamoraste de la rica historia y cultura de Egipto. Usaste el conflicto entre Set y los leales a Osiris para tallar tu propio pedazo de tierra, pero tu empresa conquistadora pronto se convirtió en otra cosa.\nLos cultistas de Set son una perversión de lo que era el antiguo Egipto y los fanáticos osirianos no son mucho mejores. Pronto concluiste que eras el único capaz de preservar la gloria que fue esta tierra y lucharás por ella con todas tus considerables fuerzas.\nHora de levantarse, poderoso Faraón, y salvar esta tierra creando una nueva dinastía eterna."
 podintroductions.271.a: "¡Salvaré a Egipto de sí mismo!"
 ramessu_intro_tt: "Como Ramessu, tienes acceso a un edificio ducal único."

 podintroductions.272.desc: "Lord Sundervere, la India es una tierra profundamente disputada entre los Ravnos y los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')]. Eres joven, no tan fuerte como esas poderosas facciones, de fe extranjera y $pod_clan$. Muchos ni siquiera te considerarían un contendiente por el verdadero poder aquí. Hora de demostrarles que están equivocados.\nHaces tu mejor trabajo en las sombras, con una mezcla de fervor fanático y astuta manipulación que algunos dirían que es la característica distintiva de tu especie. Usa estas fortalezas bien y podrías ser el improbable ganador de la Guerra Eterna de la India."
 podintroductions.272.a: "¡La India se postrará ante el Dios Serpiente!"
 sundervere_intro_tt: "Como Sundervere, tienes acceso a un edificio ducal único."

 podintroductions.273.desc: "Lady Zhenga, se te ha encomendado asegurar las fronteras del sur de los Setitas, una tarea difícil por decir lo menos, ya que el continente africano está dominado por todo tipo de criaturas muy hostiles a tu dios serpiente. Aún así, tienes un plan.\nNecesitarás números para lograr esta victoria y has estudiado el trato de otros clanes con la cría de revenants. Si se hace con éxito, estas familias atadas por la sangre proporcionan tropas de choque leales que podrían darte una ventaja seria en tu conquista africana.\nTu $pod_clan$ no es muy conocedor de este arte, pero aún has progresado y los primeros resultados están a la vista."
 podintroductions.273.a: "Los de aspecto rudo serán buenos músculos."
 podintroductions.273.b: "Necesito agentes engañosos y seductores."
 podintroductions.273.c: "Hay que priorizar el intelecto."
 zhenga_intro_tt: "Comenzarás con un par de revenants especializados en fuerza bruta en tu corte."
 zhenga_intro_tt2: "Comenzarás con un par de revenants especializados en intriga en tu corte."
 zhenga_intro_tt3: "Comenzarás con un par de revenants especializados en intelecto en tu corte."

 podintroductions.274.desc: "Regente Abetorius, te han enviado a Constantinopla para tres tareas. Matar a un Salubri oculto, lidiar con la Tremere rebelde Theresa Kymena y asegurar la posición del $pod_clan$ Tremere en Bizancio. La primera tarea está hecha, ya que el insensato robador de almas fue asesinado por uno de sus aprendices. Quedan dos por hacer.\nLa 4ª Cruzada ha cambiado mucho las cosas y has optado por unir tu suerte a la de Ana Comneno para continuar tu misión. El Círculo Interno espera resultados rápidamente, pero te dejan los medios a ti. Tener a una poderosa Ana en deuda contigo podría ser suficiente, aunque la perspectiva de gobernar tú mismo también es tentadora..."
 podintroductions.274.a: "Un nuevo poder se levanta sobre las cenizas de Bizancio."
 abetorius_intro_tt: "Como Abetorius, tienes una decisión única para asegurar la posición del clan Tremere en la región."

 abetorius_decision: "Terminando la Misión"
 abetorius_decision_tooltip: "Tienes un trabajo que hacer. Ceoris está vigilando."
 abetorius_decision_desc: "A pesar del caos causado por la 4ª Cruzada, tu trabajo aquí no ha terminado. Debes acabar con la vida de la rebelde y asegurar la posición del clan Tremere en las cenizas de Bizancio."
 abetorius_decision_custom: "La rebelde, [GetScriptedCharacterByHistoryID('790474').GetFirstName], debe estar muerta"
 abetorius_decision_custom2: "Tú o [GetScriptedCharacterByHistoryID('790004').GetFirstName] deben controlar [GetTitleByKey('c_byzantion').GetNameNoTier] y tener al menos rango de Rey"
 abetorius_decision_custom3: "Si logras la decisión controlando tú mismo [GetTitleByKey('c_byzantion').GetNameNoTier], ganarás piedad y la ciudad recibirá un impulso de desarrollo mientras el clan te ayuda a reconstruir.\nSi logras esta decisión ayudando a [GetScriptedCharacterByHistoryID('790004').GetFirstName] a controlar [GetTitleByKey('c_byzantion').GetNameNoTier], ella te recompensará con oro, prestigio y progresarás hacia la amistad."
 abetorius_decision_confirm: "Trabajo bien hecho"

 podintroductions.275.desc: "Regente Amichai, tu falta de comprensión de la hechicería de sangre te ha convertido en un paria en la política de los Tremere, y esta asignación a la India, lejos de tus compañeros de clan, no es algo que muchos quisieran. Pero harás que funcione.\nLos lugareños te subestiman y has estado usando este hecho a tu favor. Haciendo algunos amigos entre los oprimidos de la rígida jerarquía de vampiros india, has desarrollado un nuevo sistema donde vinculas a algunos vampiros nativos a la Pirámide, convirtiéndolos en 'Tremere honorarios' en cierto modo. Con esta poderosa innovación ayudándote a hacer crecer tu base de poder, ¡es hora de demostrar a los rígidos amos de casa lo equivocados que estaban sobre ti!"
 podintroductions.275.a: "¡El ascenso de los Tremere indios, los Trimira!"
 amichai_intro_tt: "Como Amichai, puedes usar un [character_interaction|E] en vampiros sin tierras de alta generación (9ª o superior) que te agraden para darles un modificador de 'Trimira Honorario'."

 honorary_trimira_modifier: "Trimira Honorario"
 honorary_trimira_modifier_desc: "Un miembro honorario de los Tremere indios, los Trimira, que trabaja para la gloria de los Tremere a pesar de no ser uno."

 POD_amichai_interaction: "Trimira Honorario"
 POD_amichai_interaction_desc: "Convierte a este personaje en miembro honorario de los Tremere indios, los Trimira."
 more_than_20opinion_tt: "Este personaje necesita 20 o más de opinión hacia ti."

 podintroductions.276.desc: "Sabia Lamia, tu introducción a la no-muerte no fue algo que planearas, pero, obviamente, fue la voluntad de la Madre Oscura.\nHas transformado tu antiguo culto secreto en un linaje, los Lamiae, y has optado por seguir trabajando codo a codo con tus progenitores Cappadocios. La política no-muerta es mortal y lidiar con ellos solo sería imprudente. Por lo tanto, has llegado a un acuerdo con ellos donde tu culto proporciona ayuda marcial a los Cappadocios, más centrados en lo académico, y eres libre de continuar con tu adoración a Lilith.\nEn los siglos transcurridos, este acuerdo ha resultado fructífero para tu especie, extendiendo lentamente la adoración de la Madre Oscura a Europa y más allá. Y tú, como la Sacerdotisa Oscura, te encuentras en el centro de todo, lista para convocar a los fieles cuando sea necesario."
 podintroductions.276.a: "¡Alabada sea la Primera Mujer!"
 lamia_intro_tt: "Como Lamia, tienes un [character_interaction|E] que te permite llamar a tu lado a cualquier fiel de la religión del Camino de Lilith que no sea rival ni esté en $pod_torpor$. Cuanto más poderosos sean, más costoso será."

 POD_lamia_interaction: "La Llamada de Lilith"
 POD_lamia_interaction_desc: "Usa tu autoridad como la Elegida de Lilith para hacer que este personaje fiel se una a tu corte."

 podintroductions.277.desc: "Misterioso Inauhaten, tus objetivos han avanzado constantemente. Has asegurado la ayuda de la poderosa secta Tal'mahe'Ra, algunos incluso dirían que eres el verdadero cerebro detrás de ella. En cualquier caso, esto asegura tu posición en el futuro previsible.\nNecesitas seguir mejorando la situación de la Tal'mahe'Ra en la India, ya que sabes que vuestros destinos están entrelazados. Afortunadamente, ahora eres competente en aprovechar el Sekhem del propio Inframundo, lo que te hace mucho más flexible que esas Momias atadas a Egipto. Es una fuerza que pretendes usar al máximo."
 podintroductions.277.a: "De Egipto a Enoc..."
 inauhaten_intro_tt: "Como Inauhaten tienes acceso al objetivo El Principio del Fin.\nTambién tienes acceso a edificios ducales únicos."

 podintroductions.278.desc: "Lord Astrokhen, la inmortalidad no es tan grandiosa como pensaste que sería. Es cierto, ya no tienes que angustiarte por la muerte, pero ahora tienes que preocuparte por la maldición que Horus te impuso. Este tesoro de artefactos que se te dio en custodia ha sido una carga durante milenios. Usaste muchos cultos, intermediarios y otros grupos de mortales insensatos a lo largo de las edades para ayudarte en tu tarea, y todo iba bien... hasta Kli Kodesh.\nEste payaso infuriante manipuló a la Orden del Temple y a algunos vampiros aventureros para que saquearan tu tesoro, usando el caos de la batalla para huir con tus preciados artefactos... antes de dispersarlos por el mundo.\nNunca supiste los detalles de la maldición de Horus, pero temes que el reloj haya comenzado a contar. Necesitas recuperarlos, uno por uno si es necesario, antes de que la propia inmortalidad por la que tanto luchaste se vea comprometida."
 podintroductions.278.a: "¡Estos pertenecen a mi museo!"
 astrokhen_intro_tt: "Como Astrokhen tienes acceso gratuito al [character_interaction|E] Comprar Reclamación de Artefacto."

 PODcanon_chars.90.t: "Tu Pecado Original"
 PODcanon_chars.90.desc: "Lady Helena, tu primer acto como vampiro fue matar a tu sádico [Glossary('Sire','game_concept_Sire_desc')] y devorar su alma en un acto desesperado de defensa propia. En ese momento no sabías nada sobre las costumbres vampíricas y solo más tarde supiste que tu acto, conocido como $pod_diablerie$, es considerado un crimen atroz por la mayoría de los $pod_cainites$.\nDesde entonces has ocultado sabiamente este evento, pero el miedo de que este secreto resurja en algún momento y te cause problemas aún existe.\nHas estado trabajando duro para encontrar las últimas pistas que podrían guiar a las mentes curiosas hacia la muerte de Minos y confías en que puedes, con algo de esfuerzo, enterrar este desafortunado evento de una vez por todas."
 PODcanon_chars.90.a: "Knossos debe permanecer enterrada para siempre."
 PODcanon_chars.90.b: "No temo a mi pasado."

 podintroductions.279.desc: "Los Akritai todavía están tambaleándose por el impactante ataque a Constantinopla orquestado por quienes deberían ser sus hermanos y hermanas en la fe. Rompiendo todos los lazos incipientes con la Inquisición Católica en su justa ira, los cazadores ortodoxos han recurrido a sus hermanos rusos en su momento de necesidad.\nHasta ahora una orden casi exclusivamente bizantina, ahora están abriendo sus puertas al mundo ortodoxo en general. Sin embargo, algunas voces preocupadas se alzan, argumentando que buscar la ayuda de los rusos desplazaría el centro de poder de los Akritai lejos de la santa Constantinopla, algo que muchos pueden aceptar. El contraargumento obvio es que, dada la gravedad de su situación, los Akritai podrían no tener otra opción de todos modos."
 podintroductions.279.a: "¡Nuestra fe será suficiente para salvarnos!"
 podintroductions.279.b: "¿Con amor desde Rusia?"

 dazbog_reckless_modifier: "La Furia de Dazbog"
 dazbog_reckless_modifier_desc: "Dazbog no favorece a los cobardes. Sus vástagos cargarán a la batalla con una sonrisa en sus rostros, como él una vez hizo."
 dazbog_patient_modifier: "La Resistencia de Dazbog"
 dazbog_patient_modifier_desc: "Dazbog ganó muchas batallas, pero también perdió algunas. Hay mucho que aprender de su resiliencia ante la derrota."

 podintroductions.280.desc: "Profundamente ligados a la fe eslava, los Guerreros de Dazbog han sido duramente golpeados por el avance del cristianismo en su patria tradicional. Ahora son apenas una nota al pie, incluso por debajo de la atención de su archienemigo, los vampiros Tzimisce. Su propensión a cargar de cabeza a la batalla y buscar una muerte gloriosa ciertamente tampoco ayudó.\nA pesar de todos estos reveses, es un testimonio de su compromiso con la causa que los Guerreros sigan existiendo como una organización coherente. Aunque el futuro parece sombrío para los vástagos del Dios Guerrero, quizás todavía haya esperanza para que cambien las tornas."
 podintroductions.280.a: "¡Un final glorioso nos espera!"
 podintroductions.280.b: "Debemos aprender de nuestros errores."

 podintroductions.281.desc: "Valiente Ishaq, a medida que la edad te alcanza, debes admitir tus fracasos. Nunca pudiste cazar al vampiro que asesinó a tu primera familia todos esos años atrás, y tu cobardía en esa fatídica noche aún te persigue. Aún así, ver a tu nueva familia prosperar y aprender de tus errores te llena de esperanza para el futuro. Tus hijos ya muestran un gran potencial y quizás tengan éxito donde tú fracasaste.\nSin embargo, todavía son jóvenes y podría ser el momento de compartir tu experiencia ganada con tanto esfuerzo. Todos ellos merecen tu ayuda, pero tu tiempo en esta Tierra no es infinito, por lo que hay que elegir."
 podintroductions.281.a: "Jahaira y Mubarak lo harán bien."
 podintroductions.281.b: "La fe de Yasmin es impresionante."

 artifact_judge_talmud_name: "El Talmud de los Jueces"
 artifact_judge_talmud_description: "Los Jueces han heredado una gran cantidad de sabiduría recopilada contenida en un Talmud secreto; una compilación de enseñanzas y argumentos de Jueces anteriores. A diferencia de otros grupos de cazadores, los Jueces tienen suficiente información para distinguir entre los diferentes tipos de magia utilizados por los vampiros."

 podintroductions.282.desc: "Aunque es una organización pequeña y altamente descentralizada, los Jueces han tenido un éxito considerable protegiendo a sus comunidades de lo sobrenatural gracias a un Talmud secreto donde se ha registrado todo el conocimiento acumulado por los cazadores anteriores.\nRecientemente se te ha confiado este fascinante libro y, como eres un erudito aprendido, no pudiste evitar notar algunas inconsistencias lógicas (y teológicas) en este tomo. Estás considerando añadir tus propios comentarios para ayudar a la próxima generación de Jueces. Sin duda, sería un esfuerzo agotador, pero los beneficios futuros podrían valer la pena."
 podintroductions.282.a: "Esta parte necesita reescritura y esta parte y..."
 podintroductions.282.b: "Está suficientemente bien como está."

 qorjin_werewolf_modifier: "Instructores de Combate Hombres Lobo"
 qorjin_werewolf_modifier_desc: "Los nuevos reclutas de los Baghatur están entrenando en estrecha cooperación con hombres lobo amigos. Aunque podrían argumentar que 'amigos' no es exactamente el mejor término para describir el régimen de entrenamiento preparado para ellos."

 podintroductions.283.desc: "Qorjin el Intrépido, has progresado enormemente en tu misión de proteger el Imperio Mongol de la insidiosa amenaza de lo sobrenatural. Tu decisión de aliarte con hombres lobo 'amigos' ha suscitado algunas preocupaciones, pero los resultados hablan por sí mismos. Con ellos a tu lado, has aprendido mucho sobre tus enemigos y has evitado muchas de las trampas en las que los cazadores desprevenidos tienden a caer.\nLos Kanes están complacidos con tu progreso y recientemente han enviado un nuevo grupo de reclutas prometedores para unirse a tu causa. Sin embargo, Pei Ling, tu principal asesor hombre lobo, ha argumentado que deberías centrar tus esfuerzos en incorporar a los hombres lobo más profundamente en tu estructura de mando. Puedes ver claramente los beneficios de una fuerza tan de élite entrenada por estos feroces guerreros, pero es probable que los Kanes entonces retiren su apoyo, temiendo que te estés volviendo demasiado amigable con el enemigo."
 podintroductions.283.a: "Bienvenidos a la lucha."
 podintroductions.283.b: "Tienes mi bendición, Pei Ling."

 fire_fury_modifier: "Fuego y Furia"
 fire_fury_modifier_desc: "Harás que supliquen piedad. Y luego se la negarás."

 fire_fury_scorn_modifier: "Fuego, Furia y Desprecio"
 fire_fury_scorn_modifier_desc: "El infierno ha venido por ellos. Tú eres su mensajero."

 podintroductions.284.desc: "Karl el Temible, tu fama como cazador de monstruos ha crecido bastante recientemente gracias a tu victoria contra un poderoso demonio llamado Eigermann. Los vampiros alemanes susurran tu nombre con preocupación, aunque para ti este monstruo era solo otra presa como cualquier otra. También has llamado la atención de la llamada Inquisición Sombría de la Iglesia Católica y de su líder informal, Leopold von Murnau. Este hombre diplomático ha hecho algunos acercamientos para intentar reclutarte, argumentando que podrías lograr mucho más dentro de una organización poderosa respaldada por la Iglesia que por tu cuenta. Promete el apoyo total de su casa, que incluiría hombres fervientes para comandar en batalla, oro para armarte y una red de informantes para mantenerte un paso por delante del enemigo.\nSus emisarios esperan tu respuesta."
 podintroductions.284.a: "No."
 podintroductions.284.b: "¡NO!"
 podintroductions.284.c: "Hora de moverse."
 pod_generic_landless_tooltip: "Ya que tienes el DLC requerido y este personaje podría ser interpretado como sin tierras según el lore, te ofrecemos la posibilidad de convertirte en un aventurero con él si así lo deseas."

 artifact_monthly_piety_gain_mult_5_modifier: "[piety|E] Mensual: #P +10%#!"
 qorjin_intro_tt: "Tres talentosos reclutas mongoles se unirán a tu corte."
 qorjin_intro_tt2: "Ten en cuenta que solo las tribus de hombres lobo Mirando a las Estrellas y Pasos Silenciosos han aceptado completamente tu alianza. Las otras tribus todavía te considerarán con sospecha, en el mejor de los casos."

 podintroductions.285.desc: "Aunque exteriormente siguen el mismo objetivo, que es librar al mundo de los vampiros en nombre de la fe bogomila, los hermanos Gantenbein son individuos muy diferentes. Basil es un verdadero creyente, un hombre tranquilo y paciente con un amor genuino por su rebaño. A menudo está asustado por los ataques de ira de su hermano Bayezid, cuya dura filosofía le parece una excusa apenas disimulada para la violencia.\nLa verdad es que Bayezid ha perdido hace tiempo su idealismo juvenil, manteniendo la fachada de creencia solo para tener acceso a su próxima dosis de sangre vampírica que ahora ansía como un adicto.\nBayezid es un individuo mucho más carismático y ha sido el líder informal de los Abandonados desde su creación, pero claramente los está llevando por un camino oscuro. Si Basil marginara silenciosamente a su hermano, los atribulados Abandonados de Calomena podrían cambiar para mejor... o ser aplastados más fácilmente como tantos idealistas antes que ellos."
 podintroductions.285.a: "Viviremos y moriremos por nuestros ideales."
 podintroductions.285.b: "Las buenas intenciones no nos salvarán."

 podintroductions.286.desc: "En las tierras de los Rápidos cuentan la historia así: Hace muchos, muchos años, Perséfone, hija de Deméter, fue secuestrada por Hades, que la había visto y se había enamorado de ella. La llevó para vivir en su reino como su reina. Allí le ofrecieron comida y bebida, pero ella no comió ni bebió, hasta que, por cortesía, comió seis semillas de una granada. Por cada semilla que comía, era condenada a pasar un mes de cada año en la tierra de los muertos. Durante ese tiempo, su madre lloraría, y la tierra se volvería fría y estéril.\n\nAl final de los seis meses, Perséfone regresaría con su madre y al mundo de los vivos. Deméter, en su alegría, haría que el clima se calentara y que las plantas crecieran y florecieran de nuevo.\n\nEn la superficie, es una simple historia de desesperación, triunfo, compromiso y, por supuesto, el origen de las estaciones. Pero, ¿qué hay de la otra mitad de la historia, su Sombra?\n\nHades no era un dios, sino un poderoso wraith, que se enamoró de una niña viva llamada Perséfone y arregló su muerte prematura para poder tener su compañía en la muerte. Deméter no era una diosa, sino una talentosa maga. La 'granada' era teóricamente una reliquia, cuya naturaleza exacta se ha olvidado hace mucho tiempo. Se supone que esta misma reliquia ayudó a proporcionar a Perséfone el poder necesario para arrastrarse de vuelta a la tierra de los Rápidos."
 podintroductions.286.a: "Me levantaré y caeré eternamente."
 podintroductions.286.a.tt: "Como Perséfone, puedes usar una [decision|E] especial para vivir en el Hades durante 6 meses."

 persephone_decision: "Invierno en el Hades"
 persephone_decision_desc: "Una parte de Perséfone se enamoró de Hades, y ella cruzó de un lado a otro entre los reinos de los vivos y los muertos a medida que su amor crecía y disminuía. Huía de Hades cuando su posesividad y celos se volvían demasiado restrictivos para ella, y regresaba cuando su soledad la abrumaba."
 persephone_decision_tooltip: "Hades me está llamando."
 persephone_decision_confirm: "El invierno ha llegado"

 living_in_hades_modifier: "Viviendo en el Hades"

 podintroductions.287.desc: "Sabia Tola, tu tribu, los Bagheera, fueron una vez fuertes contendientes en la lucha por el control de la India. Sin embargo, la civilización se expandió más y más y, aunque a tu tribu no le importa la compañía de los humanos, aún así significó que los vampiros tomaron ventaja gracias a su fuerte influencia sobre ellos. Tu especie se ha contentado con viajar y aprender junto al pueblo indio desde entonces, pero este no es el caso de tu tribu hermana de inclinación más marcial, los Telugu Khan.\nSu nuevo líder se ha acercado recientemente a ti con una propuesta de alianza, esbozando su plan para luchar contra los chupasangres y recuperar lo que una vez fue tuyo. Como Bagheera, a menudo considerados los jueces de los felinos, tu aprobación significaría mucho para este aspirante a señor de la guerra."
 podintroductions.287.a: "Enseña los colmillos, orgulloso tigre."
 podintroductions.287.b: "¡Déjame con mi investigación!"

 podintroductions.288.desc: "Astuta Ananka, tu tribu, los Bubasti, fueron una vez venerados como Dioses por el pueblo del Antiguo Egipto. Lamentablemente, la desastrosa guerra contra Set casi aniquila a todo tu linaje y muchos de tus parientes supervivientes fueron encarcelados por los victoriosos Setitas como un trofeo. Obviamente, esto te colocó firmemente en la esfera de la $glossary_osirian_league$ de Horus, los guerreros más devotos contra Set.\nAún así, toda esta historia es cosa del pasado y, aunque estás agradecida por la protección de Horus, aún quieres explorar otras posibilidades para tu futuro, en lugar de la guerra eterna contra los Seguidores de Set. Como la Bubasti activa más conocida actualmente, tienes mucha influencia en cómo dirigir los esfuerzos de tu tribu. Horus obviamente espera que comprometas tus recursos en su lucha, pero ¿puede realmente obligarte a hacerlo?\nLos gatos son criaturas caprichosas, después de todo."
 podintroductions.288.a: "El enemigo de mi enemigo sigue siendo mi amigo."
 podintroductions.288.b: "Solo dile que estoy ocupada."
 POD_alliance_formed_tt: "Formarás una alianza con este gobernante."

 podintroductions.289.desc: "Audaz Paso-Suave, has sido bienvenido por tus primos tibetanos gracias a tu impresionante fama entre la tribu Khan. Aunque estas tierras tienen mucha sabiduría que ofrecer, también están llenas de peligros. Tus nuevos amigos te han pedido tu orientación sobre la mejor manera de proteger sus hogares de las muchas amenazas que los rodean.\nTe has enterado de la existencia de un Caern de hombres lobo, el Sept del Leopardo de las Nieves, cercano. Su líder parece ser una mujer complaciente y erudita con la que podrías encontrar puntos en común. Lamentablemente, los Khans tibetanos no parecen estar de acuerdo, debido a algunas viejas disputas entre ellos y los lobos.\nEstás bastante convencido de que una alianza con el Leopardo de las Nieves sería muy beneficiosa para tu defensa, pero ¿valdría la pena agitar las aguas tan pronto después de tu llegada?"
 podintroductions.289.a: "Hacer nuevos amigos es lo que mejor sé hacer."
 podintroductions.289.b: "Por esta vez, mejor caminar suavemente."

 podintroductions.290.desc: "Poderoso Taa Mlimba, gracias a tus recientes victorias contra los vampiros de Hausaland, eres ahora el indiscutible gobernante de los poderosos Simba. Este es solo un primer paso para reafirmar el dominio de los leones sobre África, pero aún deberías tomarte un tiempo para disfrutar de los frutos de tus esfuerzos.\nEn la sociedad muy patriarcal de los Simba, convertirse en la Primera Esposa de un conquistador exitoso como tú es el mayor honor que una leona puede lograr. No es de extrañar, entonces, que tus varios amantes te estén presionando gentilmente para que elijas a una de ellas para esta posición. Después de todo, un poderoso Rey de las Bestias necesita una Reina igualmente poderosa a su lado."
 podintroductions.290.a: "La astuta Nafissa."
 podintroductions.290.b: "La fuerte Youma."
 podintroductions.290.c: "La inteligente Djenly."
 podintroductions.290.d: "La hermosa Lorane."
 podintroductions.290.e: "¡Puedo tomar mi propia decisión!"

 podintroductions.291.desc: "Sabia Nyolo, tu reciente excursión a la [umbra|E] ha atraído el tipo equivocado de atención. Un poderoso espíritu, Shi'a el Fantasma de Agua, ha desarrollado un gusto muy poco saludable por ti. Tuviste que usar todo tu ingenio y encanto para convencerla de que te diera algo de tiempo antes de 'unirte a su abrazo', sea lo que sea que eso signifique (pero probablemente nada bueno).\nSabes que es solo un respiro y que volverá, muy probablemente no tan fácilmente disuadida esta vez. Necesitas prepararte para su regreso. Afortunadamente, tu mente astuta ya está trabajando duro planeando diferentes soluciones potenciales para este dilema."
 podintroductions.291.a: "Qué hacer, qué hacer..."
 nyolo_intro_tt: "En 15 años, Shi'a estará de vuelta. Enfrentarás consecuencias terribles a menos que tengas la ventaja Caricia Fantasmal del árbol de estilo de vida Swara, más de 15 de diplomacia o 15 de intriga, o más de 750 de piedad."

 ghost_water_spirit_curse_modifier: "La Maldición del Agua Fantasma"
 ghost_water_spirit_curse_modifier_desc: "En 1245, Shi'a estará de vuelta. Enfrentarás consecuencias terribles a menos que tengas la ventaja Caricia Fantasmal del árbol de estilo de vida Swara, más de 15 de diplomacia o 15 de intriga, o más de 750 de piedad."
 ghost_water_spirit_blessing_modifier: "La Bendición del Agua Fantasma"
 ghost_water_spirit_blessing_modifier_desc: "Con la ayuda de tu amante espiritual, tu conexión con la [umbra|E] nunca ha sido tan fuerte."

 podintroductions.292.desc: "Como se esperaba, el espíritu del Agua Fantasma Shi'a ha regresado y te está esperando para que te unas a ella en su reino espiritual. Parece mucho más decidida que la última vez, pero con suerte has tenido tiempo de prepararte..."
 podintroductions.292.a: "Nuestro amor es más fuerte desde la distancia."
 podintroductions.292.b: "¡Puedo obligarte, espíritu!"
 podintroductions.292.c: "No soy tan perfecta como crees."
 podintroductions.292.d: "¡Te protegeré desde la distancia!"
 podintroductions.292.e: "¡Huye!"
 podintroductions.292.f: "Hora de irme. Preparé a mi heredero para este día."

 podintroductions.293.desc: "Lord Fridebraht, hasta ahora has ocultado tus poderes a la Inquisición Sombría mientras los apoyabas tanto como podías. Sabes que algunos de ellos no aceptarían tal ayuda si supieran que proviene de tus dones hechiceros. Sin embargo, al darte cuenta del tamaño de la amenaza, podría ser el momento de tomar una decisión.\nSi renunciaras a tus dones, lo más probable es que pudieras contar con el apoyo de la Inquisición en tropas y personal capacitado, con suerte ayudándote a hacer aún más para luchar contra los secuaces del mal. La otra opción es continuar como siempre lo has hecho, confiando en que tus habilidades mágicas compensarán el hecho de seguir siendo un lobo solitario."
 podintroductions.293.a: "Hora de revelarme."
 podintroductions.293.b: "La hechicería es poder suficiente."

 podintroductions.294.desc: "Lord Aimeric, has trabajado como [ashen_ambassador|E] de Esclarmonde durante algún tiempo y has sido fundamental para asegurar su posición en las Cortes de la Cruz Dorada. La dama está muy complacida contigo y le gustaría brindarte más apoyo, en forma de oro y cortesanos hábiles, para ayudarte en tu tarea. Aunque has sido bien tratado por Esclarmonde y la respetas mucho, te has enterado recientemente de que tu viejo amor, Veronique d'Orléans, se ha convertido en Príncipe por derecho propio.\nTan sorprendentemente ingenua como suele ser, 'Vero', como la llamas, es probable que tropiece y caiga bastante en su nuevo papel. Como Esclarmonde está bastante segura ahora, estás considerando la idea de proponer tu candidatura como [ashen_ambassador|E] de Vero. Aunque ella tendría poco que ofrecer en términos de apoyo, trabajar cerca de ella sería una recompensa en sí misma.\nVero no es exactamente una damisela en apuros, pero ¿puede un poeta como tú resistir el atractivo de convertirse en un caballero de brillante armadura?"
 podintroductions.294.a: "Por desgracia, el deber, y Lady Esclarmonde, son lo primero."
 podintroductions.294.b: "¡Una historia épica en ciernes!"

 Eleanor_of_Aragon: "Leonor de Aragón"

 PODcanon_chars.91.desc: "Lady Lucita, hace cuatro años estabas en una misión en el sur de Francia para tu despreciable [Glossary('Sire','game_concept_Sire_desc')]. Como siempre, intentaste lo mejor posible frustrar sus órdenes mientras aún permanecías técnicamente leal. Para ser sincera, sin embargo, tenías otro objetivo. Tu pariente lejana Leonor de Aragón estaba en esta área y los azares de la guerra convirtieron a esta antigua condesa en un objetivo tentador.\nSentiste un parentesco con esta mujer de tu familia que luchaba por sobrevivir en el caos de la Cruzada Albigense mientras mantenía la cabeza alta. Se sabe y está registrado que tuviste muchas conversaciones con ella, sondando su potencial para un $pod_Embrace$. Sin embargo, lo que no se sabe es tu elección final, ¿llevaste a Leonor a tu lado como compañera para las largas noches venideras o la dejaste enfrentar la muerte como todos los mortales terminan haciendo?"
 PODcanon_chars.91.a: "La maldije lejos de la muerte, como yo lo fui."
 PODcanon_chars.91.b: "Al final, no interferí."

 pod_experimental_landless_tooltip: "#warning La opción sin tierras es muy experimental en Príncipes de la Oscuridad. Considera esto una prueba y espera problemas y rarezas, repórtalos si puedes.#!"
 PODcanon_chars.92.desc: "Mientras terminas de reunir la tripulación mortal y los diversos ghouls que manejarán tu campamento en las próximas noches, te alivia saber que las Valquirias restantes han respondido a tu llamada. Aunque cada una de ellas ha seguido su propio camino en los últimos años, su compromiso con la causa (y contigo) sigue siendo fuerte. Han traído los recursos que pudieron reunir para ayudar a comenzar esta nueva aventura.\nAhora están esperando tu liderazgo, listas para recorrer los campos de batalla en busca de la gloria de Odín, como todas ustedes hicieron una vez hace mucho tiempo."
 PODcanon_chars.92.a: "¡Al Valhalla, hermanas!"
 brunhilde_landless_cb_tt: "Mientras permanezca sin tierras y en la Vía Einherjar, Brunhilde tiene acceso a un Casus Belli especial donde puede invadir ducados y poner una Valquiria a cargo si gana."

 podintroductions.295.desc: "Lady Arishat, has sido la primera recreada en las sombras infernales de Corazín por tu amo y [Glossary('Sire','game_concept_Sire_desc')], Azaneal. Has sido marcada y siempre serás una prole del diablo de ahora en adelante, pero tu apariencia externa y tu comportamiento calculador no han cambiado. Estos son activos que tu amo quiere explotar.\nYa has comenzado a actuar como los ojos y oídos de Azaneal y has corrompido a varios Lasombra desprevenidos. Sin embargo, queda mucho más por hacer y el amo de Corazín espera cosas aún mayores de ti en el futuro."
 podintroductions.295.a: "Como él manda"
 podintroductions.295.b: "Serviré más cerca de casa en su lugar"
 arishat_landless_tt: "Comenzarás como un aventurero sin tierras, más precisamente como un [ashen_ambassador|E] de Azaneal"

 podintroductions.296.desc: "Lord Lanzo, has sido el principal embajador de Hardestadt durante varias décadas, estando presente durante los preparativos de la Cuarta Cruzada y luego en Constantinopla durante sus consecuencias con la esperanza de asegurar la ciudad para los Ventrue.\nSeamos honestos, tu historial hasta ahora no ha sido el más impresionante, ya que estos dos eventos terminaron en fracasos para los intereses de los Ventrue alemanes. Algunos dirían que tu celo intransigente influyó, pero tú, por supuesto, sabes más.\nAún así, Hardestadt está empezando a reconsiderar la elevada posición que te dio y pronto podría buscar otro embajador. Esto no es algo que puedas permitirte y debes redoblar tus esfuerzos para convencer a esos herejes y bárbaros del derecho (alemán) de los Ventrue a gobernar."
 podintroductions.296.a: "El gobierno de los Ventrue no es negociable"
 lanzo_landless_tt: "Comenzarás como un aventurero sin tierras, más precisamente como un [ashen_ambassador|E] de Hardestadt"

 podintroductions.297.desc: "Lady Shabah, tú y tu amado Belisario se han retirado de Constantinopla durante varias décadas. Este tiempo de viaje pacífico ha sido el mejor de tu no-muerte, pero la política está empezando a alcanzarte.\nTú y Belisario han adoptado a Anadja como su vástago y le han estado enseñando a la joven mucho sobre la vida como vampiro. La reciente atención que tu 'hija' ha recibido de un extraño culto a la muerte que la ve como su líder prometida te preocupa.\nSon influyentes y poderosos, lo que significa que no quieres oponerte directamente a ellos, especialmente porque Anadja puede manejarlos sola. Aún así, probablemente pueda usar tu ayuda para consolidar su gobierno, mantenerla con los pies en la tierra y asegurarse de que esta 'Manus Nigrum' no termine siendo su perdición.\nPodría ser el momento de revivir tu pasado como embajadora, y a veces asesina, para un nuevo propósito."
 podintroductions.297.a: "Te vigilaré"
 shabah_landless_tt: "Comenzarás como un aventurero sin tierras, más precisamente como un [ashen_ambassador|E] de Anadja"

 podintroductions.298.desc: "Lady Manrique, eres la fundadora y líder de la Compañía Blanca, una respetada Orden de Caballería Ibérica. Has guiado a tu compañía hacia la venganza de crímenes contra la verdad y el honor. Esperas autocontrol y gentileza de tus seguidores y tu habilidad mortal en torneos, gracia y elegancia austera ya te han convertido en el tema de muchos trovadores que especulan sobre tu pasado.\n #N Eres un [ashen_grandmaster|E] y puedes mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras o haciendo contratos militares y de guerra.\nTu orden tiene los siguientes preceptos: \n #bold Motivo Específico#!: Puedes desbloquear nuevas mejoras internas para el edificio del domicilio de Cuarteles Militares.\n #bold Reclutas Honorables #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Equilibradas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje."
 podintroductions.298.a: "Mi historia es mía para escribir."

 podintroductions.299.desc: "Urraca, eres la miembro más respetada de los Salvajes Woodwose en Iberia. Los Salvajes son un grupo de caballeros no-muertos que ya no se adhieren a las reglas de la caballería o los códigos de conducta caballeresca. En su lugar, forman bandas nómadas que viajan de pueblo en pueblo, tomando lo que les plazca y castigando a cualquiera que se atreva a sugerir que un determinado caldero/cruz de oro ornamentada/mujer joven no es suyo para tomar. La mayoría de los Salvajes Woodwose se complacen especialmente en atormentar a cualquier caballero mortal que encuentran, y a menudo desafían a los caballeros a pruebas de fuerza o coraje.\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Motivo Específico#!: Puedes desbloquear nuevas mejoras internas para el edificio del domicilio de Cuarteles Militares.\n #bold Reclutas Numerosos #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Alborotadoras #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje."
 podintroductions.299.a: "¡Hora de armar un poco de caos!"

 podintroductions.300.desc: "Felipe, lideras a los Leones de Rodrigo, un grupo de vampiros despiadados dedicados a la causa de la Reconquista en la Sombra. No buscas nada menos que la aniquilación de los [Glossary('Ashirra','game_concept_ashirra_desc')] dentro de la Península Ibérica. Tan grande es tu fervor que incluso atacas a los Cainitas cristianos traidores que intentan acomodarse con tus enemigos. Desde la batalla de Las Navas de Tolosa, eres una fuerza a tener en cuenta e incluso los príncipes cristianos que antes eran prudentes ahora te miran con más respeto... y miedo.\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Orden Santa#!: Puedes pedir la conversión de tus cortesanos. En el segundo nivel, obtienes un modificador de guerra positivo al unirte a una guerra que involucre a un gobernante de tu fe. En el nivel más alto, todos tus caballeros obtienen este modificador.\n #bold Reclutas Numerosos #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Alborotadoras #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje."
 podintroductions.300.a: "Arden los fuegos de la Reconquista."

 podintroductions.301.desc: "Lord Godfrey, eres el fundador y líder de los Caballeros de Ávalon. Esta orden es una orden británica de caballeros compuesta principalmente por Gangrel que rechazan las costumbres salvajes de sus hermanos escandinavos y paganos y, en cambio, aspiran a seguir los principios de la caballería y el honor medieval. Estás obligado con Mitras y los Barones de Ávalon, quienes te confiaron la tarea de difundir su influencia y matar monstruos en su nombre. Actualmente estás estacionado en Normandía, tratando de purgar los restos de la pagana Alianza de l'Orme.\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Orden Dedicada#!: Sinergia con [ashen_ambassador|E] donde puedes crear tropas para tu Patrón Ambassadorial y ganar experiencia en el rasgo de [ashen_ambassador|E], cuanto mayor sea el nivel de este precepto, más tropas crearás.\n #bold Reclutas Honorables #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Especializadas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje.\n\n También comenzarás como un [ashen_ambassador|E] de Mitras."
 podintroductions.301.a: "En nombre de Santa Austreberta."

 podintroductions.302.desc: "Lord Varro, lideras la logia húngara de la Orden de la Cruz Torcida. A veces también llamada Hermandad de la Cruz Torcida, es una banda de caballeros Malkavian que eligen honrar a su [Glossary('Antediluvian','game_concept_antediluvian_desc')] y seguir una versión ligeramente diferente de la Trinidad cristiana que se encuentra en el Libro de Andreas. Contiene las enseñanzas de un supuesto discípulo vampírico de Jesús llamado Andreas y una nueva Trinidad: Jesús, el Hijo, Caín, el Padre, y Malkav, el Espíritu Santo. A través del servicio y la adhesión a los conjuntos de leyes que Jesús estableció, la Orden intenta arrepentirse y redimir a Caín de la maldición de Dios. Con este fin, siguen la voz de Malkav e interpretan su locura guía.\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Orden Santa#!: Puedes pedir la conversión de tus cortesanos. En el segundo nivel, obtienes un modificador de guerra positivo al unirte a una guerra que involucre a un gobernante de tu fe. En el nivel más alto, todos tus caballeros obtienen este modificador.\n #bold Reclutas Numerosos #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Equipos de Ataque #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje."
 podintroductions.302.a: "¡Por Dios, Caín y Malkav!"

 podintroductions.303.desc: "Una unión de Nosferatu con ideas afines que se sintieron tocados por Dios durante su $pod_Embrace$, los Caballeros Leprosos son los asociados $pod_cainite$ de la Orden mortal de San Lázaro. Su historia ha estado entrelazada con los Nosferatu bizantinos y la mayoría de ellospiensan en Malachite, el líder de dichos Nosferatu, como su ancla espiritual. Este es el caso de su actual gran maestre, Zoticus, que es un conocido seguidor del Sueño y la visión de Malachite.\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Orden Mendicante#!: Después de una peregrinación, repondrás tus Soldados dañados en el primer nivel, ganarás provisiones en el segundo y ganarás piedad adicional en el último.\n #bold Reclutas de Orden Sombría #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Equilibradas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje.\n\n También comenzarás como un [ashen_ambassador|E] de Malachite."
 podintroductions.303.a: "Siguiendo nuestra santa visión."

 podintroductions.304.desc: "Lord Xavier, has estado a la vanguardia de muchas guerras contra el infierno desde tu $pod_Embrace$. Durante esta edad media, has sido uno de los miembros más respetados de la Orden de las Cenizas Amargas, los escurridizos cazadores de monstruos y reliquias que bebieron del Santo Grial. Si bien alabas ese trabajo, has estado inquieto por actuar contra los Tremere que masacraron a tu parentela. Sin embargo, la bendición del Grial no está garantizada y debes equilibrar tus deberes con la Orden y la necesidad de venganza que arde en tu corazón.\n #N Eres un [ashen_grandmaster|E] y puedes mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tiene los siguientes preceptos: \n #bold Motivo Específico#!: Puedes desbloquear nuevas mejoras internas para el edificio del domicilio de Cuarteles Militares.\n #bold Reclutas de Élite #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Disciplinadas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje."
 podintroductions.304.a: "Samiel y el Grial me guían."

 podintroductions.305.desc: "Lord Joachim, la necesidad de venganza contra los Tremere ha abandonado tu corazón. Ahora estás dedicado a la Orden del Crepúsculo. La tarea de la orden es cazar a los wights, una empresa difícil pero necesaria. Está abierta a todos los que siguen la Vía Humanitatis y muestran suficiente valentía para manejar esta tarea. Sin embargo, sabes que los Tremere te alcanzarán en algún momento y tu último deber es dejar la Orden del Crepúsculo lo suficientemente fuerte como para sobrevivir a tu probable fallecimiento. No dejarás que los Usurpadores tengan esta victoria.\n #N Eres un [ashen_grandmaster|E] y puedes mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tiene los siguientes preceptos: \n #bold Motivo Específico#!: Puedes desbloquear nuevas mejoras internas para el edificio del domicilio de Cuarteles Militares.\n #bold Reclutas Numerosos #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Especializadas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje."
 podintroductions.305.a: "Una última misión antes del descanso final"

 podintroductions.306.desc: "Lord Antoine, tienes el honor de ser el agente más confiable de Salianna. Eres ferozmente leal a ella y has creado los Vigiles Francia, una orden de élite de caballeros (mayoritariamente) Toreador, para proteger a tu dama de los muchos que la amenazarían. Con su reciente ascenso al poder en Francia, tu ojo perspicaz y tu diestra espada son más necesarios que nunca.\n #N Eres un [ashen_grandmaster|E] y puedes mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tiene los siguientes preceptos: \n #bold Orden Dedicada#!: Sinergia con [ashen_ambassador|E] donde puedes crear tropas para tu Patrón Ambassadorial y ganar experiencia en el rasgo de [ashen_ambassador|E], cuanto mayor sea el nivel de este precepto, más tropas crearás.\n #bold Reclutas de Élite #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Equipos de Ataque #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje.\n\n También comenzarás como un [ashen_ambassador|E] de Salianna."
 podintroductions.306.a: "A su servicio, ahora y siempre"

 podintroductions.307.desc: "Lord Alphonse, eres el líder de los Caballeros de la Rosa Sable, la suborden de la Herejía Cainita que se infiltra en los Hospitalarios. Trabajas principalmente con ghouls para permitir una mezcla más fácil con los mortales y solo cooperas con los altos mandos de la Herejía a través de intermediarios. Aunque enrevesada, esta estrategia te ha salvado del reciente lento colapso de la Herejía, dejándote mirando hacia un futuro incierto para ti y tu orden.\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Orden Santa#!: Puedes pedir la conversión de tus cortesanos. En el segundo nivel, obtienes un modificador de guerra positivo al unirte a una guerra que involucre a un gobernante de tu fe. En el nivel más alto, todos tus caballeros obtienen este modificador.\n #bold Reclutas de Orden Sombría #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Equilibradas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje.\n\n También comenzarás como un [ashen_ambassador|E] de Malachite."
 podintroductions.307.a: "¿Hora de reconsiderar nuestra lealtad?"

 podintroductions.308.desc: "Lord Carel, eres el líder de la Hermandad de la Rosa Sable, una conspiración que se alimenta de los Hospitalarios para proporcionar caballeros de élite a la Herejía Cainita. El reciente lento colapso de esta organización ha tenido poco impacto en ti, ya que tienes una fuerte influencia en el Brabante y estás demasiado arraigado en los Hospitalarios para ser desenraizado tan fácilmente. Aún así, este podría ser un buen momento para reevaluar tu futuro.\n¿Gran Maestre o Príncipe?\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Orden Santa#!: Puedes pedir la conversión de tus cortesanos. En el segundo nivel, obtienes un modificador de guerra positivo al unirte a una guerra que involucre a un gobernante de tu fe. En el nivel más alto, todos tus caballeros obtienen este modificador.\n #bold Reclutas de Élite #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Disciplinadas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje."
 podintroductions.308.a: "La Hermandad perdura."

 podintroductions.309.desc: "Lady Bellisenda, tú y tu hermana de sangre Erminsenda sois las líderes de los Faydits, la orden militar privada de Esclarmonde dedicada a defender Occitania. Eres renombrada por tu crueldad en el campo de batalla y tu dedicación a la venganza contra los norteños que asolaron tu tierra. Los Faydits crecen cada noche gracias a que más y más caballeros del sur son desplazados por París. Con esta creciente fuerza y la astuta mente política de Lady Esclarmonde, ¡veremos Occitania restaurada en la sangre de los franceses!\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Orden Dedicada#!: Sinergia con [ashen_ambassador|E] donde puedes crear tropas para tu Patrón Ambassadorial y ganar experiencia en el rasgo de [ashen_ambassador|E], cuanto mayor sea el nivel de este precepto, más tropas crearás.\n #bold Reclutas Específicos #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Equilibradas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje.\n\n También comenzarás como un [ashen_ambassador|E] de Esclarmonde."
 podintroductions.309.a: "Veremos sufrir a París como lo hicimos nosotros."

 podintroductions.310.desc: "Lady Edythe, eres el miembro más (in)famoso de la Orden de Chanticleer. Esta audaz orden militar dedicada a destruir infernalistas y demonios ha sido alienada por la mayoría de los otros Cainitas recientemente. Su agresiva piedad, su reciente desastroso ataque a Corazín y su manifiesto desprecio por los Príncipes 'perezosos' les ha granjeado pocos amigos. Después de insultar personalmente a muchos Príncipes británicos, tú misma has sido puesta oficialmente bajo una cacería de sangre. ¿Será este el fin de la Orden de Chanticleer o sobrevivirá tu justa causa para luchar otra noche?\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Motivo Específico#!: Desbloquearás nuevas mejoras internas para el edificio del domicilio de Cuarteles Militares.\n #bold Reclutas Específicos #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Especializadas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje."
 podintroductions.310.a: "¡Idiotas sin cerebro, todos ellos!"

 podintroductions.311.desc: "Fundada originalmente para defenderse de la invasión de los Moros en el siglo X, la Centuria de las Espinas ha sido una orden militar influyente en Occitania desde entonces. Su propósito original, en su mayoría olvidado, se ha convertido en una herramienta para su ambicioso líder, Guillaume, que ha hecho varias ofertas (hasta ahora infructuosas) para tomar el control de la región. Guillaume no está por encima de usar su orden para su propio propósito, lo que ha convertido lentamente a las Centurias en una especie de compañía mercenaria, abierta a cualquier misión siempre que sirva al propósito de su líder.\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Banda Mercenaria#!: Obtendrás mejores recompensas al emprender contratos mercenarios, cuanto mayor sea el nivel de este precepto, mayor será la mejora.\n #bold Reclutas Numerosos #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Equilibradas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje."
 podintroductions.311.a: "Una herramienta para mi ascensión."

 podintroductions.312.desc: "La Hermandad de Nuestra Señora es una pequeña orden de caballería fundada por William Grey después de que recibiera una visión de la Virgen María. Su misión es proteger y ayudar a las mujeres con la esperanza de que esto les valga la salvación de su estado vampírico al final. La orden solo acepta vampiros que fueron nombrados caballeros en su vida mortal e incluso rechazará a aquellos que Grey considere nombrados caballeros por las razones equivocadas. Esta actitud y su compromiso con la humanidad les ha granjeado pocos amigos entre los $pod_cainites$ más politizados.\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Motivo Específico#!: Desbloquearás nuevas mejoras internas para el edificio del domicilio de Cuarteles Militares.\n #bold Reclutas Específicos #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Equipos de Ataque #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje."
 podintroductions.312.a: "En nombre de la Dama."

 podintroductions.313.desc: "Lord Gabriel, después de tu encuentro con un infernalista Lasombra en Tierra Santa, dedicaste tu no-muerte a la tarea de destruir a los sirvientes del Enemigo. Reuniendo a aquellos que muestran el mismo celo, creaste la Orden de la Estrella de la Mañana y has estado buscando nuevos reclutas y aliados desde entonces. Tus esfuerzos actuales se dirigen a la Orden de Azaneal, uno de los cultos Baali más poderosos y dementes que quedan. Puede que sea el momento de reunir a tu Orden e ir a cazar de nuevo.\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Orden Santa#!: Puedes pedir la conversión de tus cortesanos. En el segundo nivel, obtienes un modificador de guerra positivo al unirte a una guerra que involucre a un gobernante de tu fe. En el nivel más alto, todos tus caballeros obtienen este modificador.\n #bold Reclutas Numerosos #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Especializadas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje."
 podintroductions.313.a: "Los demonios nunca duermen. Yo tampoco."

 jurgen_landless_tt: "Como fundador y líder de los Caballeros de la Cruz Negra, puedes dar tu Principado a tu amiga Lucretia y optar por liderar tu orden militar en su lugar, apartándote de la política Cainita por el momento.\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Motivo Específico#!: Desbloquearás nuevas mejoras internas para el edificio del domicilio de Cuarteles Militares. \n #bold Reclutas de Orden Sombría #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Disciplinadas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje."
 podintroductions.119.c: "Hay otro camino..."

 podintroductions.314.desc: "Lady Lucretia, eres la mano derecha de confianza del señor Jürgen von Verden. Organizas a los Caballeros de la Cruz Negra, escondidos dentro de la Orden Teutónica mortal, mientras él gobierna en Magdeburgo. Cuando él cabalga a la batalla con los Caballeros, tú gobiernas sus posesiones en su lugar. Estás contenta con esto, aunque a veces discrepes de algunas de las decisiones más divisivas de tu señor. Él valora tu opinión incluso cuando no te escucha y, al final, esto es suficiente para ti. Actualmente estás preparando a los Caballeros de la Cruz Negra para su próxima misión contra los enemigos de tu señor.\n #N Te convertirás en un [ashen_grandmaster|E] sin tierras y podrás mejorar tu orden militar usando la experiencia del rasgo de gran maestre ceniciento, que puedes ganar ganando guerras, o haciendo contratos militares y de guerra.\nTu orden tendría los siguientes preceptos: \n #bold Orden Dedicada#!: Sinergia con [ashen_ambassador|E] donde puedes crear tropas para tu Patrón Ambassadorial y ganar experiencia en el rasgo de [ashen_ambassador|E], cuanto mayor sea el nivel de este precepto, más tropas crearás.\n #bold Reclutas de Orden Sombría #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje. \n #bold Tropas Disciplinadas #! El efecto actual proporcionado por este precepto se muestra como un modificador de personaje.\n\n También comenzarás como un [ashen_ambassador|E] de Jürgen von Verden."
 podintroductions.314.a: "Estamos listos para marchar."

 podintroductions.315.desc: "Lady Shahara, tu introducción en el $pod_clan$ Setita te salvó de una vida de miseria y desde entonces has prosperado. Acogiste las enseñanzas de tu [Glossary('Sire','game_concept_Sire_desc')] con gran celo y éxito, convirtiéndote en una de las principales seductoras de los fieles de Set. Te especializas en halagar al tipo de hombres 'segundos al mando', aquellos con suficiente ambición para escuchar cumplidos pero no suficiente sentido para reconocerlos por lo que son. Tus esfuerzos actuales en Jerusalén han sido prometedores, pero la reciente llegada de los Salubri como potencia líder podría representar una amenaza para tus planes.\nAl final, realmente no importa. Eres ante todo una superviviente; si no puedes difundir el culto de Set en esta ciudad, simplemente seguirás adelante y comenzarás de nuevo. Después de todo, tienes una eternidad por delante."
 podintroductions.315.a: "Los hombres son criaturas tan simples."
 shahara_intro_tooltip: "Como Shahara, cuando completas con éxito un plan de Seducir, ganarás piedad y la opción de convertir a tu objetivo a la Vía Apep o aprender todos sus secretos."

 unnamed_amnesia_modifier: "¿Quién soy?"
 podintroductions.316.desc: "Además de los recuerdos de sangre, gritos y carne quemada, no hay más que un vacío donde debería estar tu pasado. Incluso tu nombre es un misterio, si es que alguna vez tuviste uno. El lugar donde despertaste es familiar en su horror pero misterioso en su edad. Parece que el mundo ha seguido adelante desde estos fragmentos de recuerdos tempranos. Te sientes lento, débil, desorientado, y tus únicas pistas son dejadas por aquellos que te encontraron (antes de servir como comida para tu hambre que regresaba). Se llamaban a sí mismos la 'Orden de la Noche Terrible'. Quizás haya otros como ellos ahí fuera.\nQuizás incluso sepan quién eres."
 podintroductions.316.a: "¿Quién soy?"
 unnamed_intro_tooltip: "Como el Innombrable, tienes una decisión única que, una vez lograda, comenzará una cadena de eventos que culminarán en un posible cambio mayor de tu ser (y la eliminación de tu modificador negativo inicial)."

 unnamed_decision: "Nombrar lo Innombrable"
 unnamed_decision_desc: "La 'Orden de la Noche Terrible' es la única conexión que tienes con tu pasado. Encuéntrala y foméntala, y quizás el velo que oscurece tus recuerdos finalmente se levante."
 unnamed_decision_tooltip: "Necesito saber..."
 unnamed_decision_confirm: "¿Es esto..."
 unnamed_decision_prerequisites_tt: "Necesitas 10 o más seguidores de tu fe."

 PODcanon_chars.94.t: "Tu Comienzo"
 PODcanon_chars.94.desc: "Tu pasado más temprano es difícil de evaluar a pesar de tus esfuerzos por reconstruir la Orden de la Noche Terrible. Algunos piensan que eres uno de los progenitores Baali, esos miembros de la primera tribu infernalista de hombres que fueron arrojados a un pozo. Eso significaría que serías uno de los tres que salieron gateando de dicho pozo, junto con tus hermanos (¿o amantes?).\nOtras historias susurran que Saulot fue tu [Glossary('Sire','game_concept_Sire_desc')] (¿o incluso tu padre?) y te dejó atrás cuando comenzó su búsqueda de la Golconda. En esta versión, viste el insensible desprecio de Saulot por su linaje y decidiste prepararte para su regreso.\nAmbas historias están llenas de inconsistencias y a veces incluso se entrecruzan. No hay una verdad definitiva que encontrar aquí, pero quizás suficientes fragmentos del pasado para desbloquear algo en ti..."
 PODcanon_chars.94.b: "El pozo... ¿Nergal? ¿Moloch?"
 PODcanon_chars.94.a: "¿Debería haberle advertido a Samiel sobre nuestro padre?"

 PODcanon_chars.95.t: "Tu Propósito"
 PODcanon_chars.95.desc: "Para un culto dedicado a venerarte, la Orden de la Noche Terrible ha sido sorprendentemente poco útil para ayudarte a recordar tus objetivos. Algunos de ellos piensan que eres un punto de equilibrio entre los Baali infernalistas (los 'Nergalitas') y los anti infernalistas (los 'Molochim'). Se supone que ese 'punto de equilibrio' es misterioso en el mejor de los casos, completamente críptico en el peor.\nOtros tejieron una historia más grandiosa sobre ti entrando en contacto (¿o siendo contactado por?) con entidades de otro mundo llamadas los 'Sheddim'. Aparentemente, estas criaturas son anteriores a la humanidad y fueron expulsadas cuando Dios las consideró indignas de poblar Su Creación. Aliado a ellos, estarías en una ardiente misión para quemar este mundo y recrearlo desde cero.\nDudas seriamente de que esos indefensos cultistas supieran el verdadero alcance de tus planes, pero estas pequeñas migas de pan aún pueden ser suficientes para descubrir algo de verdad."
 PODcanon_chars.95.a: "Un fuego interminable..."
 PODcanon_chars.95.b: "¿Hermanos demoníacos en disputa?"

 PODcanon_chars.96.t: "Su Fin"
 PODcanon_chars.96.a: "Y así comienza."
 PODcanon_chars.96.unnamed: "Reunir a la Orden de la Noche Terrible no trajo las respuestas que buscabas. Sus relatos contradictorios, rayando en lo absurdo, solo te frustraron más y más a medida que avanzaba tu búsqueda. El último fracaso fue la gota que colmó el vaso.\nTe has resignado a saber que probablemente nunca recuperarás tus recuerdos. Peor aún, aquellos que ofrecen ayuda probablemente están impulsados por segundas intenciones, arrastrándote a sus redes en el proceso. Has terminado de buscar.\nSabes suficiente. Eres un vampiro poderoso, quizás el más poderoso actualmente activo. Tu fuerza es suficiente para hacer lo que quieras. Quizás conquistarás este mundo miserable, quizás lo quemarás. Puede que dejes que algunos vivan para temerte y venerarte... o puede que no.\nDespués de todo, ya no estás atado a tu pasado."
 PODcanon_chars.96.seker: "Aunque las historias que la Orden de la Noche Terrible te contó probablemente estén llenas de errores e inconsistencias, una parte despertó algo en ti. El dolor y el odio que sentiste al escuchar el nombre 'Saulot'. Quizás la orden tenga razón y tu 'padre' te traicionó (a ti y a todos los que surgieron de él, ya sean Salubri, Baali o incluso algo completamente diferente), pero realmente no importa. Este odio es lo primero que has experimentado en mucho tiempo que te hace sentir vivo. Puede ser tu fuerza motriz en el futuro.\nSi las historias son ciertas, Saulot ha sido diablerizado por Tremere (¿quizás con tu ayuda?), pero sabes más que nadie que asumir que esa será la última vez que oigas hablar de él. No, para asegurarte de que Saulot nunca vuelva a caminar sobre esta Tierra, solo hay una cosa que hacer.\nQuemarlo todo... y sabes exactamente a qué criaturas llamar para este trabajo."
 PODcanon_chars.96.third: "Las muchas historias contradictorias que la Orden de la Noche Terrible te contó te hicieron darte cuenta de que probablemente no estás experimentando esta amnesia por primera vez. Probablemente has vivido muchas vidas, bajo muchos nombres, géneros y con diferentes (quizás incluso contradictorios) objetivos. La única constante en tu historia es el pozo donde todo comenzó, donde te abriste paso junto a Nergal y Moloch. Mientras ellos se hicieron infames, tú te hiciste desconocido. Mientras ellos se aferraron a un nombre, tú tomaste muchos. Mientras ellos fueron impulsados por un objetivo, tú no estabas atado.\nEres el Tercero, el último superviviente activo de la tribu original de los Baali. Lo que hagas con esta simple verdad depende de ti."

 podintroductions.320.desc: "El Culto del Arcángel también es conocido coloquialmente (y despectivamente) como los Mártires o, para unos pocos elegidos, los Nefilim. En las últimas noches del Patriarca, sus delirios en letargo tocaron la mente de cada Toreador de la ciudad, convenciéndolos de que él era verdaderamente el Arcángel Miguel. Su adoración hacia él superó los deberes cívicos, los empeños creativos, los vínculos de sangre, todo. Su Muerte Final no los ha curado de su devoción, solo la ha convertido en un nuevo propósito. Dos de sus vástagos, Paul Bathalos y Pakourianis la Paloma, lideran a los michaelitas restantes."
 podintroductions.320.a: "Difundiremos la palabra de Miguel."
 podintroductions.320.b: "Recuperar Constantinopla es una prioridad."

 podintroductions.321.desc: "Bena fue una de las primeras en ser convertida en ghoul al servicio de Stanislaw, un vampiro de Cracovia que lideraba un culto como 'santo', y rápidamente se convirtió en una de sus favoritas. Lo seguía constantemente y solo se apartaba de su lado cuando se le ordenaba, y su devoción pronto le valió el $pod_Embrace$. A medida que el culto crecía y más adoradores ofrecían su sangre al 'santo' que había regresado de entre los muertos, Stanislaw se volvió gradualmente más indolente y altivo, perdido en visiones de su propia importancia. Como resultado, Bena asumió gran parte del trabajo nocturno. Se volvió experta en robar carteras para llenar sus cofres y atraer a posibles cultistas a las cuevas subterráneas con un acto de niña asustada ejecutado con maestría, y alimentó el creciente culto hasta convertirlo en un grupo fuerte y unificado.\nEn los últimos años, se dice que Stanislaw ha caído en $pod_torpor$. Se desconoce la razón detrás de esto, y Bena no habla. Ahora dirige el culto abiertamente, aunque lo hace con mano suave, y su número ha crecido considerablemente desde que Stanislaw dejó de hacer apariciones públicas. Ciertamente, Bena parece creer en su sire ahora tanto como antes de su Abrazo, pero las circunstancias de su desaparición sugieren que esta historia puede tener más, y ella ha estado más que dispuesta a asumir el control del culto."
 podintroductions.321.a: "Los lideraré a nuevos reinos."
 podintroductions.321.b: "Polonia seguirá siendo nuestro hogar."

 junius_alim_modifier: "Alim"
 junius_alim_modifier_desc: "Junius tiene un conocimiento inigualable de la ley y la tradición islámica fuera de los Ashirra. Esto le ha valido un gran respeto en el mundo $pod_cainite$ islámico."

 podintroductions.322.t: "Girando la Tortuga"
 podintroductions.322.desc: "$TAB$El noreste de Asia ha sido tradicionalmente el dominio de los [GetTitleByKey('e_andong').GetNameNoTier] de los $pod_kueijin$. Fuertemente influenciada por los nómadas con los que convivía, esta Corte ha tenido conflictos fronterizos con la [GetTitleByKey('h_china').GetNameNoTier] china durante siglos, aún más desde que la dinastía Jurchen Jin comenzó a avanzar hacia el sur.\n\n$TAB$La naturaleza altamente descentralizada de la Tortuga Negra está demostrando ser su perdición, ya que la influencia de los [Glossary('Yama Kings','podgloss.yamaking')] ha estado creciendo constantemente durante mucho tiempo y los [akuma|E] ahora están desenfrenados en las estepas. Los $pod_cainite$ [Glossary('Anda','podgloss.anda')] que siguen a los mongoles resultaron ser el último clavo en el ataúd. La Corte de la Tortuga Negra ahora yace destrozada, su centro de poder aparentemente ignorante de su desmoronamiento mientras continúa sus mezquinas escaramuzas con la Corte del Emperador Amarillo.\n\n$TAB$La principal pregunta que queda es qué poder terminará finalmente con la agonía de la Tortuga y se levantará para controlar la región."
 podintroductions.322.a: "El lento declive de una corte que fue grande."

 podintroductions.323.t: "Daimyos de la Noche"
 podintroductions.323.desc: "$TAB$Sobre el papel, Japón es parte de la [GetTitleByKey('e_goryeo').GetNameNoTier] de los $pod_kueijin$ continentales. De facto, sin embargo, ha estado haciendo lo suyo durante varios siglos.\n$TAB$Los vampiros de Japón se llaman a sí mismos 'Gaki' y están divididos por clanes, siendo el [GetDynastyHouseByID('house_bishamon').GetName] liderado por [GetScriptedCharacterByHistoryID('795044').GetFirstName] el dominante en este momento. También tiene la mayor concentración de $pod_cainites$ en Asia, aunque su relevancia política es básicamente inexistente.\n\n$TAB$Los gobernantes nocturnos de Japón han estado observando con interés el colapso de las cortes continentales. Miura Yasutami es partidario de esperar su caída para cortar formalmente los lazos con ellos, mientras que otros preferirían una separación más agresiva. Sea cual sea el método que terminen eligiendo, los $pod_kueijin$ japoneses parecen estar a punto de construir su propia corte y convertirse en una fuerza considerable por derecho propio.\n$TAB$Está por ver si los clanes rivales (y los $pod_cainites$ distanciados) permanecerán unidos después de lograr este objetivo común."
 podintroductions.323.a: "El dominio de Amaterasu se levanta."

 podintroductions.324.t: "El Dragón Durmiente"
 podintroductions.324.desc: "$TAB$Corea es el corazón de la [GetTitleByKey('e_goryeo').GetNameNoTier], una entidad política que también debe supervisar Japón. De facto, este no ha sido el caso durante siglos y la Corte ha sido marginada como dependiente de la más poderosa [GetTitleByKey('h_china').GetNameNoTier] china. [GetScriptedCharacterByHistoryID('793153').GetFirstName], el último Emperador 'sugerido' por los chinos, es un ejemplo brillante de una línea de peones apenas competentes.\n\n$TAB$Sin embargo, los tiempos están cambiando a medida que la Corte del Emperador Amarillo cae cada vez más en declive. Los $pod_kueijin$ coreanos ambiciosos, como el (no reconocido) Ancestro de P'yong'yang [GetScriptedCharacterByHistoryID('795046').GetFirstName] y la misteriosa [GetScriptedCharacterByHistoryID('793174').GetFirstName], están esperando su momento y acumulando fuerzas. Es probable que el tiempo de Xiao en el trono sea corto, pero aún no está claro qué surgirá de la caída del Dragón Azul y bajo qué liderazgo."
 podintroductions.324.a: "En la encrucijada."

 podintroductions.325.t: "La Sangrienta Caída del Fénix"
 podintroductions.325.desc: "$TAB$El sudeste asiático fue una vez el hogar de la única Corte que rivalizaba con la [GetTitleByKey('h_china').GetNameNoTier] de China, el Fénix Escarlata. Si bien dicha Corte todavía existe técnicamente, se ha reducido a muy poco debido a siglos de indolencia y una buena dosis de luchas internas. Este vacío de poder ha permitido que los [akuma|E] se apoderen de la mayor parte del área, y la [GetTitleByKey('h_scarlet_phoenix_court').GetNameNoTier] ahora goza de la dudosa reputación de ser un infierno infestado de infernalistas.\n$TAB$La propia Corte del Emperador Amarillo ha contemplado una intervención directa, algo que los ferozmente independientes [Glossary('Kuei-Jin','game_concept_kuei_jin_desc')] de la región probablemente no permitirían fácilmente.\n\n$TAB$Mientras que la mayoría ya considera perdida la Corte del Fénix Escarlata, abundan los rumores de un [Glossary('Bodhisattva','podgloss.bodhisattva')] recluso llamado [GetScriptedCharacterByHistoryID('791113').GetFirstName] que recientemente ha salido de las junglas para arreglar las cosas.\n\n$TAB$Sin embargo, conociendo la filosofía 'única' de Piyau, la mayoría se pregunta si la cura será peor de soportar que la enfermedad..."
 podintroductions.325.a: "Se acerca una sangrienta rendición de cuentas..."

 podintroductions.326.t: "Todo Está Bien Bajo el Cielo"
 podintroductions.326.desc: "$TAB$A los ojos externos, la [GetTitleByKey('h_china').GetNameNoTier] sigue siendo la cúspide de las cortes $pod_kueijin$. Está unificada bajo un liderazgo sabio que promueve innovaciones regionales, no le preocupan las luchas mortales y funciona como un recordatorio de días mejores.\n\n$TAB$La verdad, como siempre, es más complicada.\n\n$TAB$El #ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('795039').GetID] #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('795039').GetID] #L Emperador Amarillo#!#!#! es recluso en el mejor de los casos, un loco en el peor. Sus incompetentes aduladores gobiernan el reino en su lugar. Las cortes Jurchen del Norte y las cortes Song del Sur están tramando silenciosamente un cisma. Los $pod_cainites$ [Glossary('Anda','podgloss.anda')] están esperando el momento adecuado para seguir las conquistas de sus homólogos mortales. Nuevas herejías, algunas peligrosamente cercanas al infernalismo, aparecen sin control en todas partes.\n\n$TAB$Se necesitará muy poco para que el Cielo se derrumbe sobre el frágil hegemón de China."
 podintroductions.326.a: "Largo tiempo unido..."

 podintroductions.327.desc: "Ambicioso Wang Kyu, tus audaces planes para tomar Corea durante tu vida mortal no dieron fruto. Aún así, tu muerte fue meramente un paso en tu inevitable ascensión, al parecer. Al regresar como un $pod_kueijin$, no perdiste tiempo buscando oportunidades para escalar la escalera inmortal.\nEl caos actual en P'yong'yang ha cobrado la vida del anterior Ancestro y, antes de que la Corte del Dragón Azul pudiera reaccionar, aprovechaste la oportunidad y tomaste el trono. Aunque no te han confirmado, estás poco preocupado por la reacción de la Corte, ya que, durante tu tiempo allí, notaste que son indolentes y lentos para reaccionar.\nLa verdadera amenaza para tu reinado está mucho más cerca. El autoproclamado rebelde Hojil, quemado hasta el infierno junto con su mentor Myoch'ong en 1136, regresó y usó su prestigio para reunir seguidores y reclamar P'yong'yang como suya.\nEste es tu primer obstáculo que superar y la eliminación de Hojil será, con suerte, un buen primer paso para ganar algo de legitimidad."
 podintroductions.327.a: "He llegado para quedarme."
 wang_kyu_intro_tt: "Como Wang Kyu, comienzas con una legitimidad muy baja, algo que se puede resolver con una decisión única."

 wang_kyu_decision: "Amo Destinado de Corea"
 wang_kyu_decision_desc: "Desde tu muerte, las reglas han cambiado, pero el objetivo no. Corea será tuya, pase lo que pase. Asegurar tu gobierno sobre P'yong'yang es el primer paso."
 wang_kyu_decision_tooltip: "Mirando hacia el futuro."
 wang_kyu_decision_confirm: "P'yong'yang, y Corea, son mías."
 wang_kyu_custom_decision: "[GetScriptedCharacterByHistoryID('795047').GetFirstName] debe estar muerto."

 podintroductions.328.desc: "Lady Ahn, no tienes recuerdos de tu vida mortal y despertaste como $pod_kueijin$ junto a algunas hermosas flores. Has usado este aura misteriosa y tu carisma natural con gran efecto hasta ahora y te has ganado una envidiable reputación entre los vampiros de Corea. Aún así, el misterio de tu pasado te intriga.\nLas flores, claramente mágicas por naturaleza, son sin duda la clave de algo más profundo. Estudiarlas mientras florecen en tu jardín podría ser una solución a tu dilema."
 podintroductions.328.a: "De Ébano y Escarlata..."
 soo_kyung_intro_tt: "Como Soo-kyung Ahn, tienes una decisión única para mejorar tu artefacto de flores inicial, siempre que lo poseas, por supuesto."

 soo_kyung_decision: "De Ébano y Escarlata"
 soo_kyung_decision_desc: "Las flores que encontraste a tu lado cuando despertaste como $pod_kueijin$ tienen un significado más profundo. Hora de descubrir sus secretos."
 soo_kyung_decision_tooltip: "¿La clave de mi pasado o de mi futuro?"
 soo_kyung_decision_confirm: "Cuéntame más, reinas de mi jardín..."
 soo_kyung_decision_tt: "Mejorarás el artefacto de las flores a una rareza superior y elegirás un nuevo modificador para darle."

 PODcanon_chars.97.desc: "Las flores que te han acompañado desde que tienes memoria están aparentemente vinculadas al Dragón de Ébano y la Reina Escarlata, dos de las entidades divinas más poderosas de los sobrenaturales asiáticos.\n¿Fueron un regalo? ¿Un recordatorio? ¿Una promesa? No hay manera de saberlo, pero incluso los no iniciados pueden sentir el poder mágico que reside en ellas. Como las obras maestras de tu famoso jardín, parecen crecer y florecer junto con tu propia comprensión de ti mismo y del mundo que te rodea."
 PODcanon_chars.97.a: "Su magia se está expandiendo."
 PODcanon_chars.97.b: "Están sintonizadas con mi [Glossary('Dharma','podgloss.dharma')]."
 PODcanon_chars.97.c: "Rebosan de Chi."
 PODcanon_chars.97.d: "Susurran secretos..."
 artifact_magic_amulet_modifier: "Resonancia Mágica"
 the_celestial_nail_modifier: "Iluminación Dármica"
 the_three_books_modifier: "Fuente de Chi"
 artifact_learning_per_piety_level_modifier: "Herramientas de Aprendizaje"

 podintroductions.329.desc: "Emperatriz Zetian, tu llegada al mundo $pod_kueijin$ ha sido un evento tremendo para esta comunidad sobrenatural cansada. Aunque ninguno te lo diría a la cara, está claro que están observando cada uno de tus movimientos, preguntándose si tendrás tanto impacto aquí como lo tuviste como Emperatriz de China. Por tu parte, te has contentado con aprender sobre este extraño sistema de la Corte Augusto, tan diferente de la China mortal y sin embargo tan cercano.\nDesde los confines del Monasterio Shaolin donde has sido entrenada, has oído los rumores de invasores nómadas del norte e infernalistas del interior que amenazan la paz aparentemente interminable de la Corte del Emperador Amarillo. Si se avecina una época de caos, es probable que los ojos que te observan se desvíen hacia otro lado y entonces... bueno, entonces podría ser el momento de elegir tu propio destino y ambición para tu segunda vida."
 podintroductions.329.a: "¿Una dinastía inmortal al alcance?"
 wu_zetian_modifier: "Emperatriz Celestial"
 wu_zetian_modifier_desc: "La gente recuerda el reinado de Wu Zetian. Su derecho a gobernar ha trascendido su propia muerte.\nLa [tarea_de_consejero|E] [fabricate_claim|E] es #P 50%#! más rápida"

 podintroductions.330.desc: "Descarada Shou, has sido, con razón, la [akuma|E] infernalista activa más temida de Asia durante mucho tiempo. A pesar de muchas (cortas) alianzas entre las Cortes del Emperador Amarillo y del Fénix Escarlata para destruirte, sigues ahí mientras ellas se desmoronan por su propia debilidad.\nAunque esto te brinda una oportunidad única para expandir tu dominio sin que las cortes mayores puedan intervenir, también hace que las cosas sean... aburridas. Ser adorada por pequeñas aldeas y bandas de piratas pronto perderá su brillo si no tienes un 'héroe justiciero' al que quemar vivo de vez en cuando. Tendrás que encontrar una fuente alternativa de 'voluntarios', ya que no querrías perder tu apodo de Comefuegos, después de todo..."
 podintroductions.330.a: "Abriendo el camino para el [Glossary('Demon Emperor','podgloss.demonemperor')]."
 shou_intro_tt: "Shou tiene acceso a un método de ejecución único, Devorar-Llamas, que otorga experiencia de estilo de vida y alivio del estrés."

 podintroductions.331.desc: "Astuto Tashimoto, tu ascenso a la fama como el mejor general japonés no-muerto ha sido rápido e impresionante por donde se mire. Para muchos de tus detractores, esto podría ser el signo de un oscuro secreto que alimenta este evento sin precedentes.\n\nPara ser honesto, en realidad tienen razón.\n\nPor donde se mire, en realidad eres un [akuma|E] infernalista, ya que has vendido tu alma a [Glossary('Emma-O','podgloss.emmao')] a cambio de tu mayor destreza y nuevos poderes magistrales. La cosa es que, en la guerra y en el trato con demonios, nunca pretendes jugar limpio. Mientras Japón canta tus alabanzas y [Glossary('Emma-O','podgloss.emmao')] se regocija por haberte atraído a su servicio, estás planeando quizás el mayor atraco de la historia. Llevará tiempo planificarlo a fondo. No querrías apresurar las cosas.\n\nDespués de todo, tu propia alma está en juego."
 podintroductions.331.a: "Nunca lo verán venir."
 tashimoto_intro_tt: "En 20 años, Tashimoto comenzará su plan. Este evento tendrá serias repercusiones (y recompensas)."

 hunted_emmao_modifier: "Cazado por [Glossary('Emma-O','podgloss.emmao')]"
 hunted_emmao_modifier_desc: "El más poderoso de los [Glossary('Yama Kings','podgloss.yamaking')] ha tomado un interés personal, obsesivo y furioso en tu muerte. La promesa de poder a cualquiera que ofrezca información sobre ti es muy, muy halagadora para tu ego."
 PODcanon_chars.98.t: "Robando Tu Propia Alma"
 PODcanon_chars.98.desc: "El atraco está listo.\nUsando el descuido de [Glossary('Emma-O','podgloss.emmao')] y tu creciente reputación en Japón, confías en que podrás llevarlo a cabo, robando el alma que le vendiste al demonio por poder. Aún así, hay repercusiones que considerar.\nPodrías ir a por todas, robando tu alma junto con el tesoro de [Glossary('Emma-O','podgloss.emmao')]. Un movimiento audaz pero gratificante que revelará a todos que eras un [akuma|E]... y también enfurece al poderoso [Glossary('Yama King','podgloss.yamaking')] sin límites.\nOtra opción es solo robar tu alma. Aún te marginará de otros $pod_kueijin$, pero debería mitigar la ira de [Glossary('Emma-O','podgloss.emmao')].\nFinalmente, no podrías hacer nada en absoluto, pero esto significaría pertenecer verdaderamente al amo de [Glossary('Kakuri','podgloss.kakuri')] por toda la eternidad..."
 PODcanon_chars.98.a: "¡A lo grande o a casa!"
 PODcanon_chars.98.b: "Mi alma es recompensa suficiente."
 PODcanon_chars.98.c: "Es demasiado arriesgado..."

 podintroductions.332.desc: "Yukio la Intrépida, eres una de las pupilas más respetadas de Kuro-sama, el legendario maestro de los asesinos $pod_kueijin$. Sin embargo, tu entrenamiento está lejos de terminar y tu atención se desvía de él por tu deseo de venganza contra [Glossary('Emma-O','podgloss.emmao')] y tus deberes con el clan Koga.\nNecesitarás equilibrar todo esto para cumplir tu gran potencial. La cima de la montaña aún está lejos, pero no planeas desviarte de tu viaje."
 podintroductions.332.a: "Enfoque y paciencia."
 yukio_intro_tt: "Yukio tiene acceso a una interacción de personaje especial con Kuro-sama para pedir entrenamiento. Esto le dará destreza hasta llegar a 40. Entonces, completará su entrenamiento."

 pod_exhausted_modifier: "Agotada"
 POD_yukio_interaction: "Entrenando con Sensei"
 POD_yukio_interaction_desc: "Una sesión de entrenamiento (extenuante) para dominar los caminos del asesino."

 PODcanon_chars.99.t: "La Última Ascensión"
 PODcanon_chars.99.desc: "Has conquistado Daisetsuzan. La desolada cima de la montaña donde Kuro-sama entrena a sus pupilos es ahora una amiga y ya no una maestra severa. Kuro-sama te enseñó todo lo que sabe sobre el asesinato, desde la planificación del acto hasta el momento frío y calculado en que tu daga atraviesa el corazón de tu objetivo.\nSensei siempre ha sido frío y difícil de leer, y esta noche no es la excepción. Te enfrentas a él una última vez mientras Kuro-sama evalúa tu forma y esgrima, una mera formalidad en este punto. Después de este duelo, te despide fríamente y te dice que nunca regreses a Daisetsuzan.\nInclinas la cabeza y te preparas para irte cuando, quizás por primera vez en todos esos años, Kuro-sama muestra un atisbo de una sonrisa orgullosa mientras dice que espera con ansias el día en que cumplas tu venganza.\n\nLuego está hecho, y abandonas la montaña, ya no una estudiante..."
 PODcanon_chars.99.a: "...sino una ninja."

 podintroductions.333.desc: "General Ma, a pesar de tu corta edad para una inmortal, ya has ganado bastante reputación. Aunque tu mente severamente disciplinada te ha valido elogios de tus mayores, están menos contentos con tus críticas al sistema de la Corte y, por lo tanto, te han enviado a la línea de frente con la Corte de la Tortuga Negra.\nFrancamente, es una tarea sin sentido, ya que sabes que amenazas mucho mayores que las guerras entre Cortes acechan. Aún así, esta es una buena oportunidad para que perfecciones tu Legión del Cielo y el Infierno, una fuerza disciplinada compuesta por otros $pod_kueijin$ que creen como tú en un cambio ordenado de era mediante el poder militar.\nEn este tiempo de creciente incertidumbre, estás oscuramente segura de que tendrán más que suficiente tiempo para demostrar su valía."
 podintroductions.333.a: "Traeré orden, pase lo que pase."
 ma_hai_lan_intro_tt: "Ma tiene acceso a Soldados únicos, la Legión del Cielo y el Infierno."

 podintroductions.334.desc: "General Li, los tiempos están cambiando. Estabas contento viviendo como un recluso lejos de la política de la Corte hasta hace unas décadas, y ahora de alguna manera eres el líder de un grupo de resistencia contra la influencia de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] en las estepas.\nNunca pediste esto y los jóvenes pueden ser realmente molestos con sus fastidios, pero si eres honesto contigo mismo, te intriga ver si puedes ganar esto y hacer que tu nombre sea conocido por algo más que la mezquina crueldad y los repetidos errores políticos.\nSin embargo, las fuerzas de Dokhor-Khan son fuertes y la Corte de la Tortuga Negra come de la palma de su mano. Si quieres sobrevivir, y mucho menos triunfar, con el grupo heterogéneo de refugiados bajo tu mando, tendrás que pensar de manera diferente, elegir tus batallas, saquear y tender emboscadas cuando sea necesario.\n\nEs bueno que luchar sucio siempre haya sido tu fuerte."
 podintroductions.334.a: "Al menos esta vez no hay Guo Si."
 li_jue_intro_tt: "Li Jue siempre puede saquear siempre que su religión no lo prohíba."

 podintroductions.335.desc: "Piyau la Intrépida, has alcanzado la iluminación durante tu tiempo como reclusa en la jungla al observar a una mantis devorar a su compañero. La fuerza de la esencia femenina es la única verdad y exaltarla hasta sus extremos monstruosos es el camino hacia la redención de los $pod_kueijin$.\nMientras abandonas tu jungla y ves la Corte del Fénix Escarlata en ruinas, plagada por [akuma|E] infernalistas y funcionarios corruptos, sabes lo que tienes que hacer. Tu furia, y la furia de tus hermanas despreciadas, salvarán el mundo. Aquellos que se sometan y abracen la esencia femenina serán perdonados. Los que no serán acuchillados, devorados o abandonados para pudrirse a raíz de tu purga.\n\nEs hora. Hora de rehacer el mundo a tu imagen, en una marea de sangre, lujuria y caos."
 podintroductions.335.a: "Nos bañaremos en la sangre de los hombres."
 piyau_intro_tt: "El contenido de Piyau comienza con una decisión única que le permite ganar el rasgo [GetTrait('conqueror').GetName(GetNullCharacter)]."

 piyau_first_decision: "El Despertar de Piyau"
 piyau_first_decision_desc: "Tu marea de sangre primero tiene que ganar impulso. Hartarte de los infernalistas de Malasia será un buen aperitivo."
 piyau_first_decision_tooltip: "Desde las junglas..."
 piyau_first_decision_confirm: "Ellos mueren. Nosotras nos hacemos más fuertes."
 piyau_first_decision_tt: "Desbloquea la siguiente decisión para el contenido de Piyau."

 PODcanon_chars.100.desc: "Piyau la Temible, tus primeras conquistas van bien y más y más conversos se unen alegremente a las Flores de Sangre Apasionadas. Sin embargo, esto ha puesto de manifiesto un problema creciente.\nAunque el [Glossary('Dharma','podgloss.dharma')] que creaste parece muy simple por fuera, sus principios de indulgencia y desprecio absoluto por las reglas pueden ser fácilmente malinterpretados y llevar a una violencia inútil y al colapso Dármico. Afortunadamente, estás aquí para explicar y enseñar a estos recién llegados.\n\n #italic \"Las Flores de Sangre Apasionadas exaltan la feminidad para liberarse a sí mismas y a las próximas generaciones. Se entregan a todas sus necesidades porque una necesidad insatisfecha dejará a uno vulnerable a la envidia y la duda. Lucha con todas tus fuerzas contra los infernalistas y los que quieren someterte y destruir este mundo. Vives aquí, si perece, tú también pereces.\nHaz que los [Glossary('Yama Kings','podgloss.yamaking')] vean tu furia y pasión y tiemblen de miedo. Recibe al [Glossary('Demon Emperor','podgloss.demonemperor')] con colmillos, garras, dientes y uñas hasta que esté muerto o tú lo estés.\n\nEsta es la sabiduría en la vida. Si necesitas algo más que eso, estás caminando por el camino equivocado. Cósete el coño y vete a ser una Grulla si piensas así.\nEl trueno solo conoce una palabra y esa palabra sacude el mundo entero. Cuando hayas aprendido a vivir como habla el trueno, entonces sabrás algo.\" #!"
 PODcanon_chars.100.a: "Exalta tu hambre."
 PODcanon_chars.100.b: "Exalta tus necesidades carnales."
 PODcanon_chars.100.c: "Exalta tu gloria."

 piyau_second_decision: "La Danza de Piyau"
 piyau_second_decision_desc: "La marea está subiendo, pero el sudeste asiático todavía está encadenado por funcionarios indolentes e infernalistas. Su sangre nutrirá tus flores voraces y desenfrenadas."
 piyau_second_decision_tooltip: "...una marea de sangre se eleva..."
 piyau_second_decision_confirm: "Pinta las junglas de rojo."
 piyau_second_decision_tt: "Tú y los miembros de tu [GetPlayer.Custom('PODCoterie')] obtendréis estadísticas de bonificación.\nObtendrás [GetBuilding('bloodflowers_fleshpits_01').GetName] en cada condado que poseas que no tenga ya un edificio especial.\nElegirás un nuevo modificador de casa."

 house_penangallan_improved_modifier: "Casa Flores de Sangre"
 house_penangallan_improved_modifier_desc: "La feminidad será exaltada en los restos sangrientos de sus enemigos."
 house_penangallan_run_modifier: "Flores Astutas"
 house_penangallan_run_modifier_desc: "#italic Cuando haya peligro, huye. Cuando estés acorralada, lucha. No libres batallas que te perjudiquen, el tigre lisiado no puede luchar mañana. Si no puedes huir o ganar la lucha, entonces muere.#!"
 house_penangallan_protect_modifier: "Flores Protectoras"
 house_penangallan_protect_modifier_desc: "#italic Protege el Tapiz, porque hay muchos que lo romperían y destruirían. Defiéndelo hasta la muerte, porque vives dentro del mundo, y si perece, tú también pereces. Contra estos enemigos, siempre estás acorralada.#!"

 PODcanon_chars.101.t: "La Danza del Dragón"
 PODcanon_chars.101.desc: "Piyau la Victoriosa, tus últimos triunfos en el campo de batalla han causado bastante estupor en las Cortes del norte que tontamente pensaron que tú y tus ejércitos eran una banda de lunáticos desquiciados sin aprecio por la guerra. Olvidaron que eres el Dragón Rojo.\n\nEste título te ha sido otorgado después de tu dominio completo de la Danza del Dragón, un trance de batalla cargado de Yang que forma un arte marcial elegante pero furioso. Aunque eres la única que realmente lo ha dominado, tus [Glossary('Wu','podgloss.wu')], los Monos Desolladores, no se quedan muy atrás y son todos combatientes hábiles por derecho propio.\n\nLa destreza personal no es tu único punto fuerte. Aunque te burlas de las complicadas 'reglas de la guerra' de los norteños, tu propia filosofía demuestra ser tan simple como efectiva.\nSi puedes ganar, gana rápida y decisivamente. Si no puedes ganar, huye. Si no puedes huir, lucha como un tigre acorralado.\nAunque las sofisticadas Cortes chinas una vez se rieron de estos principios, se están volviendo cada vez más silenciosas a medida que matas más infernalistas en décadas de lo que ellos hicieron en siglos. Surgen susurros preocupados de que tu purga del sudeste asiático podría ser solo el comienzo de tus ambiciones.\n\nBien. Si te temen, ya has ganado."
 PODcanon_chars.101.a: "Perfecciona la Danza del Dragón."
 PODcanon_chars.101.b: "Si son demasiado fuertes, huye..."
 PODcanon_chars.101.c: "...pero siempre lucha contra el verdadero enemigo."

 piyau_third_decision: "La Purga de Piyau"
 piyau_third_decision_desc: "No habrá medias tintas. Es hora de que el sudeste asiático renazca en sangre y sea gobernado por la esencia femenina dadora de vida."
 piyau_third_decision_tooltip: "...que limpiará el mundo."
 piyau_third_decision_confirm: "Hermanas, bebed, comed y follad, porque hemos ganado."
 piyau_third_decision_tt: "Las gobernantes $pod_kueijin$ femeninas no fervientes y no infernalistas con menos de [GetTrait('dharma7').GetName(GetNullCharacter)] se convertirán a la fe de las Flores de Sangre Apasionadas.\nLos personajes (con la misma restricción anterior) también son más propensos a aceptar tu demanda de conversión.\nLos personajes de Flores de Sangre Apasionadas ahora siempre aceptarán la demanda de vasallaje de Piyau.\nTodos tus condados en posesión se convierten a Flores de Sangre Apasionadas."

 PODcanon_chars.102.t: "Mareas de Sangre y Feminidad"
 PODcanon_chars.102.desc: "Piyau la Celestial, tus victorias no conocen límites. Multitudes de [akuma|E] y funcionarios indolentes han caído a tu paso, haciendo espacio para una nueva era de feminidad exaltada.\nAlgunos llamarían a tu nueva Corte un infierno de mujeres salvajes y sádicas, pero tú sabes más. Esta es la verdadera sabiduría en la vida, la visión de pura gloria que devolverá el favor del Cielo a sus hijas una vez descarriadas.\nUna vez eras solo un puñado de hermanas devotas y ahora reinos enteros siguen tu filosofía, desgarrando el patriarcado corrupto y reemplazándolo con un hambre, una lujuria y un impulso de derramamiento de sangre sin límites.\nYa tu triunfo ha llegado a oídos de las lejanas Cortes Augustas y las Flores de Sangre Apasionadas se están extendiendo más lejos de lo que tus sueños más locos jamás imaginaron... y eres conocida por tener sueños muy salvajes, de hecho.\n\nMientras tus hermanas e hijas cantan tu nombre mientras triunfan de un campo de batalla a otro, te hace preguntarte. ¿Por qué parar ahí?\n\n¿Por qué no liberar el mundo entero?"
 PODcanon_chars.102.a: "Derramamiento de sangre eterno para los Cielos."

 podintroductions.336.desc: "Lady Sun, hace mucho que se han olvidado de tu desafortunado encuentro con Sun Tzu. Ahora eres justamente alabada como la estratega más hábil que el mundo $pod_kueijin$ haya visto jamás. Los Ancestros de las Cortes más exaltadas matarían por tenerte como su general, pero has estado rechazando todas y cada una de las ofertas. En cambio, vagas por el mundo, aprendiendo y enseñando a medida que avanzas. Tus libros son de lectura obligatoria para todo discípulo dispuesto a abrazar el arte de la guerra, aunque, obviamente, guardas las mejores tácticas para ti.\nSin embargo, no hay tiempo para descansar en los laureles, la guerra es un arte en constante evolución y no querrías quedarte atrás. La espada auspiciosa no ha hecho su última aparición sorprendente en un campo de batalla lejano."
 podintroductions.336.a: "¿Dónde está la próxima guerra?"
 sun_li_intro_tt: "Como Sun Li, tienes una decisión única para gastar tu experiencia de [ashen_grandmaster|E] para aumentar tu habilidad marcial directamente."

 sun_li_decision: "La Artista de la Guerra"
 sun_li_decision_desc: "Siempre hay más que aprender sobre tu tema favorito. ¿Qué mejor manera de despreciar a Sun Tzu que superar continuamente su conocimiento por toda la eternidad?"
 sun_li_decision_tooltip: "Pintado con la sangre de los hombres."
 sun_li_decision_confirm: "Un tapiz de sangre en constante cambio."

 PODcanon_chars.103.t: "Los Últimos Aletazos del Fénix"
 PODcanon_chars.103.desc: "A pesar de que Dyanang era una líder respetada y hábil, la Corte del Fénix Escarlata ha estado en un largo estado de declive durante algún tiempo, debido principalmente a que Dyanang se centraba cada vez más en su iluminación [glossary('dharmic','podgloss.dharma')]. Este no es un desarrollo sorprendente, y su renuncia mientras se centraba en asuntos espirituales era esperada.\nLamentablemente, a pesar de sus esfuerzos, parece que nunca pudo encontrar un sucesor digno para dejar la Corte en buenas manos. La situación empeoró más y más hasta alcanzar un punto de quiebre recientemente.\n\nSin previo aviso, Dyanang simplemente desapareció de Angkor, dejando la Corte del Fénix Escarlata en completo desorden mientras los ancestros regionales están reuniendo frenéticamente su base de poder para reclamar la que fue una poderosa Corte Augusto.\nAlgunos dicen que, en verdad, Dyanang eligió a Piyau Payung, su discípula distanciada, como su sucesora de una manera indirecta. El brutal [Glossary('Dharma','podgloss.dharma')] y la legitimidad de Piyau solo pueden demostrarse con una lucha violenta y sangrienta según la mayoría y, por lo tanto, al abdicar repentinamente, Dyanang creó el caótico campo de pruebas donde Piyau prosperará o será destruida.\n\nSea cual sea el caso, la Corte del Fénix Escarlata ya no existe y pocos pueden prever verdaderamente lo que sucederá después, excepto una lucha larga y probablemente difícil."
 PODcanon_chars.103.a: "El Fénix ha alzado el vuelo."

 PODcanon_chars.105.t: "La Oportunidad de Livonia"
 PODcanon_chars.105.desc: "Lord Jürgen, la guerra en las tierras paganas de Livonia ha creado una oportunidad para que cambies el equilibrio de poder. Durante décadas, tus Caballeros de la Cruz Negra han influido en secreto en la Orden Teutónica desde las sombras, sin embargo, las Órdenes de Livonia han seguido siendo frustrantemente difíciles de influir. Pero ahora que los Caballeros marchan sobre sus tierras, tienes la oportunidad de remediarlo. Será costoso, pero la recompensa sería muy útil; otra orden infiltrada por la Cruz Negra, lista para luchar y morir por ti."
 PODcanon_chars.105.a: "Este es mi momento."
 livonian_orders_tooltip: "Obtendrás acceso a los [GetMaA('knights_livonia_maa').GetName] como [men_at_arms|E]"
 PODcanon_chars.105.b: "No, no vale la pena."

 PODcanon_chars.106.t: "Recuerdos del Senado"
 PODcanon_chars.106.desc: "Pretor Sejanus, has vivido, e influido directamente, una de las eras más significativas de los Kindred: la era de Roma y Cartago. Los recuerdos de esas noches se agitan en tu mente no-muerta. La Ciudad Eterna era entonces el centro de la influencia vampírica, con muchos Kindred jugando a sus juegos de política, con la esperanza de dar forma al futuro de la historia. Había muchos jugadores, pero dos destacaban por encima de todos.\n\nJulia Antasia imaginaba una Roma donde cada Kindred, sin importar su Clan o posición, tuviera voz en el Senado. Donde incluso el Neófito más bajo tuviera la libertad de hacer oír su voz. Su habilidad en la diplomacia era excepcional, y no fue sorprendente que se convirtiera en una figura importante en las noches de Roma.\n\nFrente a ella se encontraba Camila. Un Pecador que quería ahogar Roma en placer hedonista. Para él, la indulgencia excesiva, la lujuria y el dominio eran la expresión más pura de la no-muerte. Sus festivales hacían que las Saturnales parecieran tímidas.\n\nY tú, Sejanus, estabas entre estas visiones enfrentadas. Durante esas noches en la Ciudad Eterna, ¿a qué visión apoyaste?"
 PODcanon_chars.106.a: "Lady Antasia tenía una lengua de plata."
 PODcanon_chars.106.b: "Las palabras de Camila ciertamente eran tentadoras."
 aphro_saturn_court_tooltip: "Obtendrás acceso a las posiciones de corte de Celebrante Afrodita y Señor del Desgobierno."
 PODcanon_chars.106.c: "Sus intentos de influenciarme fueron necios."

 PODcanon_chars.107.t: "Recuerdos de la Caída"
 PODcanon_chars.107.desc: "Mientras tu mente divaga hacia el pasado, no puedes evitar pensar en Bretaña. No por el barro, la niebla o los molestos habitantes, sino por la compañía que una vez tuviste. En medio de las facciones en guerra y la intriga mortal, una figura se mantuvo a tu lado. Siegfried, el Ventrue.\n\nSe conducía con un honor rígido, un hombre de nobles creencias que quizás era un Ventrue demasiado ideal para que su Clan lo aceptara verdaderamente, algo con lo que resonabas. Hubo un gran respeto mutuo y cooperación que floreció en amistad. Te había apoyado durante la caída de Roma, sin importar qué.\n\nÚltimamente, parece que puedes haber encontrado otro aliado leal. Este 'Jack' es un hombre de instintos agudos y lealtad. Sin pulir, pero lealtad al fin y al cabo. Aún así, podrías optar por reavivar viejas amistades. El firme Siegfried volvería a tu lado, de eso estás seguro.\n\nO podrías dejar descansar el recuerdo. El mundo ha cambiado mucho, y tú también. Jack podría ser afilado hasta convertirse en la hoja más peligrosa que podrías tener en tu arsenal. Un hombre de acción podría resultar más útil que un diplomático. La noche espera tu decisión."
 PODcanon_chars.107.a: "Como en los viejos tiempos, Siegfried."
 PODcanon_chars.107.b: "Es hora de que busque nuevas oportunidades y alianzas."

 PODcanon_chars.108.t: "Aliados Salvajes"
 PODcanon_chars.108.desc: "Piyau la Descarada, ahora que tu gran purga ha comenzado, habrá que trazar líneas entre quienes se rendirán y quienes morirán. Un grupo interesante podría caer en la primera categoría.\n\nLos hombres tigre de Malasia, conocidos como 'Khans', han sido amigables contigo durante algún tiempo. Incluso más que amigables, algunos dirían, ya que su líder pasó algún tiempo de calidad contigo antes de que dejaras las selvas. Su odio por los [akuma|E] es casi tan fuerte como el tuyo y su destreza en la batalla no debe subestimarse.\nPodrían ser aliados poderosos a medida que comiences tus conquistas."
 PODcanon_chars.108.a: "Uníos a nosotras, hijas del Tigre."
 PODcanon_chars.108.b: "Fue una distracción divertida, nada más."
 piyau_khans_tt: "Si los Khans aceptan, se convertirán en tu tributario, te darán acceso a nuevos Soldados y enviarán algunos campeones para servir en tus ejércitos."

 PODcanon_chars.109.desc: "Sabia madre, una vieja llama ha hecho saber su presencia al mundo últimamente.\n\nPiyau Payung, una temible [Glossary('Kuei-Jin','game_concept_kuei_jin_desc')] ha dejado su retiro en las selvas para comenzar una purga de la creciente infestación infernalista en Asia. Habiendo encontrado a Piyau tú misma hace algún tiempo (muy íntimamente), sabes que la mujer no detendrá su ataque hasta que los propios Cielos la noten. Afortunadamente para ti, no ha olvidado el tiempo que pasaron juntos y ha enviado un mensaje. Te pide a ti y a tu camada ayuda y extenderá su protección a cambio.\nTus hijas parecen ansiosas por unirse a su causa también, lo que haría que aceptar esta oferta sea probablemente la opción más prudente."
 PODcanon_chars.109.a: "Los Tigres se unirán a la marcha de Piyau."

 podintroductions.337.desc: "Orgulloso Rey, estás lejos de Egipto y más lejos aún de su apogeo donde tu parentela era venerada como dioses. Los hijos de la serpiente te quitaron todo. Tu participación en la malograda $glossary_osirian_league$ cambió poco, lo que resultó en que tu Nidada se aislara de la menguante alianza de Horus.\n\nAún así, no toda esperanza está perdida. Tus hijos están alcanzando la edad adulta y ofrecen nuevas perspectivas para el futuro. También estás lejos de la base de poder de los Setitas, lo que te permite proteger a tu familia y crecer más fuerte lejos de sus ojos curiosos. Quizás, con el tiempo, marches una vez más para liberar tu tierra natal, esta vez con tus hijos a tu lado en lugar de aliados de conveniencia en los que no se puede confiar."
 podintroductions.337.a: "Ni perdonamos ni olvidamos."

 podintroductions.338.desc: "Lord Masamune, tu familia ha crecido desde el exilio autoimpuesto de China por tus antepasados hace casi un siglo. Incluso tu nuevo nombre, 'Hakken', está empezando a sentirse más familiar.\n\nAunque muchos predijeron un rápido final para tu parentela en las inexploradas islas de Japón, has demostrado tus habilidades diplomáticas al entrar en contacto con los nativos [Glossary('Hungry Dead','game_concept_kuei_jin_desc')] y ofrecer los servicios de tu familia en sus guerras contra los vástagos del infierno. Tus victorias te permitieron establecer el primer Sept para tu especie en Japón y este éxito es, con suerte, solo el comienzo. Aunque probablemente no estarás aquí para verlo, sabes que tus hijos establecerán a los Hakken como un poder lo suficientemente fuerte como para resistir la prueba del tiempo en tu nuevo hogar."
 podintroductions.338.a: "Nuestro reconocimiento se gana con nuestras hazañas."

 podintroductions.339.desc: "Sabio Nongkhai, tus tendencias aislacionistas casi te cuestan la vida en el pasado. Aprendiste la lección y ahora estás monitoreando diligentemente el mundo fuera de tu jungla. Lamentablemente, lo que ves no parece prometedor.\n\nTus contactos en la Corte del Fénix Escarlata informan que la inestabilidad crece cada noche y que no pasará mucho tiempo antes de que la que fuera una poderosa Corte Augusto se derrumbe. Tienes que estar preparado.\nEl [Glossary('Wu','podgloss.wu')] del Velo Dorado que una vez te salvó la vida son tus aliados potenciales más fuertes en los tiempos turbulentos que se avecinan. Lamentablemente, ellos mismos han sido propensos a luchas internas últimamente, lo que te obliga a elegir un bando y un amigo potencial para el futuro."
 podintroductions.339.a: "Sriteja respeta a nuestra especie."
 podintroductions.339.b: "Le debo mi vida a Bhadra."

 podintroductions.340.desc: "Sabio Dragón, se avecinan tiempos oscuros, lo has previsto.\n\nLa que una vez fue poderosa Corte del Emperador Amarillo está colgando de un hilo y, aunque sabes que Wang Hongben nunca sería hostil contigo, no puedes decir lo mismo de sus secuaces. La situación podría empeorar aún más si la autoridad restante de Chang'an desapareciera.\nNo eres un hombre de guerra o conflicto, pero tienes un deber con tu Corte. Te prepararás para la tormenta que se avecina lo mejor que puedas y la soportarás.\nTu Corte no se llama la 'Eterna' por nada, después de todo."
 podintroductions.340.a: "Construiremos un refugio contra la tormenta."

 podintroductions.341.desc: "Wolaru la Firme, tú y tu especie han estado protegiendo Bandaiyan desde que la (impresionante) memoria de los Mokolé puede recordar. Hasta ahora, no has fallado en tu tarea y tu hogar permanece tan puro como la Madre lo pretendía. Aún así, la complacencia no está en tu naturaleza.\n\nAl ver las islas cercanas a tu gente caer en la corrupción y algo peor, has resuelto liderar una vanguardia para enfrentar la amenaza de frente antes de que pueda extenderse a Bandaiyan. Afortunadamente, no tendrás que hacer esto solo. Los Hijos del Perro, también conocidos como 'Bunyip', están ansiosos por pagar la deuda que deben a tu gente por tu hospitalidad y lucharán a tu lado."
 podintroductions.341.a: "La mejor defensa..."
 wolaru_intro_tt: "Tienes acceso a los Soldados [GetMaA('battlescarred_fera').GetName]"

 podintroductions.342.desc: "Orgullosa dama, gobiernas, discutiblemente, un pequeño dominio amenazado por todos lados por [akuma|E] y otras amenazas. Aún así, hay un asunto mucho más apremiante.\n\nTu nidada toma su nombre de los 'Dragones de Komodo' de tu tierra natal y, aunque aprecias a tus hermanos menores tanto como cualquier otro Mokolé, es una correlación no entendida por los forasteros que solo piensan que los habitantes de tu reino se llaman a sí mismos 'Pequeños Dragones'. Esto ciertamente no es aceptable.\n\nEs hora de considerar seriamente este asunto tan importante y llegar a una solución decisiva."
 podintroductions.342.a: "¡Necesitamos un cambio de nombre de inmediato!"
 podintroductions.342.b: "¿Quizás no es una prioridad?"
 d_clutch_majestic_dragons: "Nidada de los Dragones Majestuosos"
 towers_intro_tt: "Renombrarás tu ducado a la Nidada de los Dragones Majestuosos"

 podintroductions.343.desc: "Dragón Estoico, tu terquedad podría acabar causando tu perdición.\n\nAunque nunca te gustaron particularmente los [Glossary('Gaki','game_concept_kuei_jin_desc')] que tienes como vecinos, te contentabas con ignorarlos, y ellos hacían lo mismo. Esto cambió cuando los llamados hombres lobo 'Hakken' llegaron a Japón hace varias décadas.\nViste en ellos la semilla del declive moral de los sobrenaturales de las islas y advirtiste a los [Glossary('Gaki','game_concept_kuei_jin_desc')] que no se podía confiar en estos exiliados de China. Tus palabras cayeron en oídos sordos. Ahora los Hakken son aliados de los Clanes Uji y tú estás marginado. Peor aún, tus constantes interjecciones (algunos dirían que son molestias) han llegado a un punto de quiebre y Miura Yasutami te ha pedido una disculpa formal de tu parte.\nAceptar sería vergonzoso, pero rechazar podría llevar a tus vecinos a la guerra contra ti."
 podintroductions.343.a: "¿Disculparme? ¡Nunca!"
 podintroductions.343.b: "...Quizás reaccioné de forma exagerada."

 podintroductions.344.desc: "Sabio Dragón, tu fascinación por el gran Zhuge Liang te ha convertido en una enciclopedia viviente de la vida del gran estratega. Aprender sobre él también ha sido una experiencia gratificante y puedes presumir de una comprensión (al menos teórica) sin igual de las estrategias militares entre tu especie.\nAún así, la carrera de #italic Kongming#! fue larga e ilustre, así que la pregunta sigue siendo, ¿cuál de sus campañas terminó siendo tu favorita?"
 podintroductions.344.a: "Las Expediciones al Norte."
 podintroductions.344.b: "Chibi, por supuesto."
 podintroductions.344.c: "La pacificación de Nanman es un clásico."

 podintroductions.345.desc: "Ambiciosa dama, tus audaces objetivos no son del agrado de tu especie, normalmente contemplativa. Hiciste todo lo posible por encajar en su molde y lograste cierto progreso en el aprendizaje de la moderación, pero tu inquietud no puede ser domada para siempre. Es hora de actuar.\n\nSin embargo, si vas a liberar a la India del yugo de su inframundo parasitario, es posible que necesites aliados. Aunque tu propia especie es una causa perdida, este no es el caso de los hombres pantera conocidos como Bagheera. Has disfrutado de relaciones amistosas con los cercanos a tu Nidada y han demostrado ser receptivos a la idea de ayudarte en tu misión. Por otro lado, demostrar que no necesitas la ayuda de nadie también podría ser una declaración audaz de tu renovada convicción."
 podintroductions.345.a: "¡Bienvenidos, amigos!"
 podintroductions.345.b: "Solo necesito mi propio consejo."

 podintroductions.346.desc: "Hace mucho tiempo, tu especie gobernaba estas tierras. Has visto esto a través de la memoria colectiva que todos compartían. Está tan lejos que hoy en día podría ser solo un sueño, ya que los mortales te han olvidado mientras las sanguijuelas y los demonios han corrompido la tierra y destruido las Nidadas que una vez prosperaron aquí. Para la mayoría de tu especie, esto sería simplemente una triste realidad que aceptar y reflexionar.\n\nPero no para ti.\n\nEres el Mokolé que se niega a este estado de cosas y tiene la intención de contraatacar. Aunque estarás terriblemente superado en número, tendrás que emplear métodos creativos. Por una vez, un Rey Lagarto podría disfrutar de las sombras en lugar del sol."
 podintroductions.346.a: "Se acerca un ajuste de cuentas."

 podintroductions.347.desc: "Reverenciado Ancestro, has visto y hecho mucho durante los largos milenios de tu existencia. Muchas de tus experiencias ahora están a la deriva en la memoria compartida de tu especie, ayudando a las próximas generaciones a encontrar su camino. Aún así, hay momentos en que tu intervención directa es necesaria.\n\nMientras despiertas de tu largo letargo, tu mente tardará en adaptarse nuevamente a la velocidad del mundo mortal. Afortunadamente, parte de tu conocimiento inmortal está bastante presente en el frente de tus pensamientos y será una base sólida para construir tu regreso."
 podintroductions.347.a: "El amor de mis compañeros y el orgullo de mis hijos."
 podintroductions.347.b: "Mi Nidada, bien cuidada y atendida."
 podintroductions.347.c: "El Lago Telé, majestuosamente atemporal."

 podintroductions.348.desc: "Astuta guardiana, desde tu llegada a esta región, has fomentado contactos diplomáticos con los [GetTrait('bastet').GetName(GetNullCharacter)] nativos. Los hombres pantera ('Bagheera') se han convertido en un aliado fácil y han demostrado ser receptivos al potencial de vínculos más profundos en el futuro. Los hombres león ('Simba') lamentablemente han sido más reacios a cualquier cosa que resultara en que ellos no estuvieran a cargo. Aún así, tus diligentes esfuerzos no han sido en vano y sientes que un pequeño empujón más podría resultar en un avance.\n\nSolo tienes que decidir dónde centrar tu atención por el momento. ¿Convertir a los Bagheera en miembros de pleno derecho de tu Nidada o fomentar una alianza con los Simba?"
 podintroductions.348.a: "El comienzo de una gran coalición Fera."
 podintroductions.348.b: "Los Leones serían aliados dignos."
 podintroductions.348.c: "Ninguno de los dos es necesario por el momento."

 podintroductions.350.t: "Suma Sacerdotisa del Placer"
 podintroductions.350.desc: "Sacerdotisa Valentina, has gobernado el dominio Pecador de Ancona durante algún tiempo. Por cómo pueda parecer, eres simplemente una cuidadora, sin embargo. La Suma Sacerdotisa Aconia Messalina sucumbió al $pod_torpor$ hace algún tiempo, dejándote como la única sustituta digna. Has hecho un trabajo admirable, pero la propia Aconia es muy extrañada y el regreso de Camila a Roma podría ser el momento perfecto para mostrarle esta extraña nueva era.\n\nEstás segura de que podrías despertarla de su letargo y devolver el control de la región a la legítima Suma Sacerdotisa del Pecado, si así lo deseas. Sin embargo, has demostrado ser una heredera digna, y nadie se quejaría si continuaras gobernando Ancona."
 podintroductions.350.a: "¡Despierta, mi señora!"
 podintroductions.350.b: "Descansa, Suma Sacerdotisa. Yo cuidaré de nuestro pueblo."

 PODcanon_chars.111.t: "Sacerdotisa Durmiente"
 PODcanon_chars.111.desc: "Pontífice Camila, has trabajado en bastante intimidad con las Sacerdotisas del Placer establecidas en Ancona, especialmente con su líder, Aconia Messalina. La Suma Sacerdotisa ha estado durmiendo bajo un templo de su diosa patrona durante algún tiempo, con uno de su linaje gobernando la región en su lugar.\n\nGracias a tu influencia sobre la región y tu relación con ellas, podrías inclinar al vástago de Aconia para que te jure lealtad, fortaleciendo aún más tu control sobre Italia en el proceso. Tu vieja amante también podría ser finalmente despertada. O podrían simplemente dejarse en paz, si así lo deseas."
 PODcanon_chars.111.a: "Júrame lealtad, sacerdotisa, y serás protegida."
 PODcanon_chars.111.b: "Pueden valerse por sí mismas."

 podintroductions.349.desc: "Folch el Severo, eres un líder mercenario de reputación en el sur de Francia, habiendo librado la guerra para los señores $pod_cainite$ de aquí durante varias décadas. Sin embargo, todavía te tratan a ti y a tus hombres como bandidos a sueldo, y parece que ninguna cantidad de contratos completados te comprará respeto en este mundo nocturno. No importa, tomarás lo que se te debe por ti mismo, como siempre haces.\n\nTu último contrato fue especialmente agotador. La Ventrue Jehanne usó sus poderes para meterse contigo y te utilizó en lo que debería haber sido un ataque suicida. Sin embargo, sobreviviste y ahora puedes ver con satisfacción cómo la reputación de Jehanne está en ruinas y ella es cazada por su antigua amante y muchos otros enemigos.\n\nA decir verdad, te gustaría echarle el guante antes que ellos. La venganza será dulce, obviamente, pero demostrarles a todos que puedes lograrla antes que ellos será aún más dulce.\n\n #warning Ten en cuenta que eres un [masterless_ghoul|E] #!"
 podintroductions.349.a: "¿Dónde estás..."
 folch_intro_tt: "Como Folch, tener a Jehanne en tu prisión abrirá una decisión única."

 folch_decision: "Venganza Fría"
 folch_decision_desc: "Jehanne te utilizó hace años. Hora de demostrarle que los peones pueden convertirse en reyes."
 folch_decision_tooltip: "No olvido fácilmente. O en absoluto."
 folch_decision_confirm: "Me alegra volver a verte..."
 folch_decision_effect_tt: "Un evento te ofrecerá varias opciones sobre cómo tratar a tu prisionera favorita."

 PODcanon_chars.110.desc: "Bueno, esto fue algo anticlimático. La mujer que una vez viste como una vampira poderosa y dominante resultó ser un despojo roto que solo intentaba sobrevivir en un mundo de poderes mucho mayores que ella. Algo así como tú, de alguna manera.\nQue esté casi inconsciente ahora que ha sido capturada dificulta el orgullo que deberías sentir, para ser honesto. Aún así, la atrapaste antes de que sus muchos otros enemigos pudieran hacerlo, lo que sigue siendo algo. Ejecutarla ahora enviaría un fuerte mensaje a esos señores engreídos de que Folch y sus hombres no son solo peones en sus juegos y que deben ser tomados en serio.\n\nAún así, una parte de ti se pregunta si no podrías trabajar con ella ahora que claramente eres la fuerza dominante. Tiene habilidades útiles, no tiene ataduras a otros vampiros y no tendría a dónde ir. La desesperación y el odio mutuo hacia los señores de la noche podrían convertiros en compañeros de cama improbables."
 PODcanon_chars.110.a: "Levántate y ponte a trabajar."
 PODcanon_chars.110.b: "La venganza sigue siendo venganza."
 PODcanon_chars.110.c: "Puede pudrirse por todo lo que me importa."

 podintroductions.351.desc: "Exaltado Haqim, estás burlándote abiertamente de tus antiguos amos al usar el nombre de su amado [Glossary('Antediluvian','game_concept_antediluvian_desc')] como propio. Y a pesar de sus muchos intentos, han sido impotentes para detenerte.\n\nAdemás de tu astucia y poderes, tu activo más fuerte es tu influencia sobre los legendarios hashshāshīn. Aunque tu control sobre ellos no es absoluto, sigue siendo suficiente para desempeñar un papel en tu continua supervivencia.\nLos vampiros de Persia están empezando lentamente a respetarte, impresionados por tus tácticas y audacia. Algunos incluso han empezado a imitarte. Aunque aprecias el cumplido a medias, sabes que es solo un primer paso. Una noche, ya no te llamarán el 'Falso' Haqim.\n\n #warning Ten en cuenta que eres un [masterless_ghoul|E] #!"
 podintroductions.351.a: "¡Soy el amo de Alamut!"
 false_haqim_assassins_modifier: "Influencia sobre los Hashshāshīn"
 false_haqim_assassins_modifier_desc: "Una poderosa red de agentes y espías que muchos vampiros solo soñarían con tener."

 podintroductions.352.desc: "Leal Prias, han pasado milenios pero tu amor por Helena no se ha desvanecido. Aunque rechazaste su oferta de convertirte en vampiro, encontraste atractiva la perspectiva de la inmortalidad a su lado como un [ghoul|E]. Lamentablemente, tu alma gemela tomó algunas... decisiones cuestionables que hicieron tu no-muerte más difícil, especialmente con su aparentemente eterna rivalidad con Ménele.\n\nAunque eres solo una pequeña parte del arsenal de Helena, a veces tienes una mejor visión del panorama general que ella, y tu sabio consejo es el único que ella todavía tolera. Esto no significa que tu brazo armado sea débil tampoco. Todavía recuerdas haber clavado una jabalina en Minos hace una eternidad. Quizás tu próximo objetivo sea el propio Ménele.\nCualquier cosa para mantener a tu amor a salvo y eterno.\n\n #warning Ten en cuenta que eres un [bound_ghoul|E] de Helena. #!"
 podintroductions.352.a: "Una pareja legendaria para una historia legendaria."
 prias_intro_tt: "Mientras seas un [bound_ghoul|E] de Helena, ganarás más experiencia de resonancia al completar [bound_ghoul_missions_with_icon|E]."

 podintroductions.353.desc: "Misteriosa Layla, tu pasado es un cuento de mentiras y desinformación. Es algo que te ha ayudado a lograr tus objetivos, pero aún así, solo hay una verdad.\n\nAlgunos dicen que eres una verdadera hija de Lilith, o quizás una mortal que ha bebido de su sangre. Dicen que has atrapado al Príncipe de Gante, Diederik Rechtvaardigen, y que estás planeando su caída y la caída de los Brujah en su conjunto.\n\nOtros piensan que eres la ghoul de Catubodua, la poderosa Brujah Verdadera que reside actualmente en África, y que estás ayudando a tu ama en su difícil tarea de sanar el cisma de los Brujah y alcanzar la Golconda.\n\nOtros te vinculan con una cábala de misteriosos antiguos que han unido su suerte a Lilith. Algunos susurran que podrían ser [Glossary('Antediluvians','game_concept_antediluvian_desc')] perdidos por sí mismos.\n\nLa verdad de estos rumores es solo tuya para saber."
 podintroductions.353.a: "Su hija responde."
 podintroductions.353.b: "Lady Catubodua necesitará toda la ayuda que pueda obtener."
 podintroductions.353.c: "Agente leal de la Madre Oscura."
 POD_ghoul_unlimited_blood_tt: "Este Ghoul, por medios misteriosos, genera su propia sangre"
 layla_intro_1_tt: "Con esta elección, te establecerás en el norte de Francia. Comenzarás como un [masterless_ghoul|E] con la ventaja única de no perder sangre pasivamente."
 layla_intro_2_tt: "Con esta elección, te establecerás en Darfur como un [bound_ghoul|E] de Catubodua."
 layla_intro_3_tt: "Con esta elección, no te moverás y comenzarás como un [masterless_ghoul|E] normal."
 layla_intro_4_tt: "Esta opción solo está disponible en el marcador de Ghouls"

 podintroductions.354.desc: "Ferox el Firme, los siglos han sido largos y arduos desde tu valiente resistencia al lado de tu madre Boudica. Desde entonces, has servido honorablemente a tus amos Ventrue, siendo Fabrizio Ulfilia el último. Aún así, tu alma se siente vacía.\n\nTu entusiasta adopción del cristianismo en los últimos días de Roma ha sido tu gracia salvadora. Estudiando la sabiduría de la Iglesia durante muchos siglos, solo te has convencido más de que este es el camino para la redención de la humanidad.\nSin embargo, eres consciente de que el camino por delante será largo y sufres al ver las formas cada vez más insensibles en que los arrogantes señores $pod_cainite$ tratan a los mortales. Parece que, incluso después de una eternidad como sirviente, tu espíritu de rebelión no está completamente apagado.\n\nSabes que combinar la fe y la ira es una receta para el desastre, sin embargo, lo que te deja con una decisión difícil de tomar.\n\n #warning Ten en cuenta que eres un [masterless_ghoul|E]. Como eres invulnerable al vínculo, no puedes convertirte en un [bound_ghoul|E]. #!"
 podintroductions.354.a: "Fe..."
 podintroductions.354.b: "...o ira?"

 podintroductions.355.desc: "Lady Delizbieta, a pesar de tu juventud, tus talentos mágicos han sido una bendición para ayudar a tu familia a sobrevivir en esta tierra difícil. El protector de tu kumpania, el vampiro Izydor, ha notado eso y te ha convertido en su ghoul. Aunque estás agradecida por el don de la inmortalidad, te preocupa la imprudencia y la vena vengativa de Izydor y las consecuencias que podría tener para tu gente.\n\nActualmente estás cerca de las tierras de la llamada Durga Syn. La conociste solo brevemente, pero su comportamiento amable y su interés en tus talentos mágicos (ya que ella misma fue una vez chamana) te han causado una impresión duradera.\nIzydor rechazó tu propuesta de establecerte bajo la protección de Durga, argumentando que tenía asuntos pendientes más al sur.\n\nEstos últimos días te han visto dividida sobre si usar tu influencia para poner a tu gente bajo la seguridad de Durga o mantenerte leal a Izydor, sin importar el costo potencial en el futuro.\n\n #warning Ten en cuenta que eres un [bound_ghoul|E] de Izydor Torenu. #!"
 podintroductions.355.a: "Mi gente antes que mi lealtad."
 podintroductions.355.b: "Le debemos demasiado a Izydor."

 PODcanon_chars.112.desc: "Alta Reina Eanflead, estás en una posición precaria. Tus enemigos Kindred te consideran una reliquia de una era olvidada. Se burlan de ti con el título de 'Alta Reina de Sul'. Mientras que tus hermanos y hermanas en Irlanda se aferran a sus círculos que se desvanecen, tú te mantienes sola en este lado del mar.\n\nLa sombra de Mitras se extiende amplia, larga y terrible. Sus legiones y los otros Cainitas invasores consideran tu mera existencia como una afrenta a su orden. Te aferras a este pequeño pedazo de tierra, un pequeño santuario en medio de un mar de enemigos que desean ver tu linaje extinguido.\n\nLa elección que tienes ante ti es una de supervivencia o desafío. ¿Hundirás tus raíces profundamente en esta tierra y enfrentarás la tormenta que se avecina, o cortarás tus lazos con la tierra, desvaneciéndote en la niebla para vagar como una errante?"
 PODcanon_chars.112.t: "Una Fe Moribunda"
 PODcanon_chars.112.a: "Un árbol que no se dobla, se rompe. El camino llama."
 PODcanon_chars.112.b: "Que vengan y aprendan que incluso un árbol viejo tendrá espinas."

 PODcanon_chars.113.desc: "Te sientas sobre un trono precario, Lady Nova. Tu experimento, el Consejo de Cenizas, está en grave peligro. Inicialmente concebido como un estado tapón aceptado por todas las facciones, rápidamente se convirtió en un desastre de influencias competitivas y politiquería despiadada. Es poco probable que tu 'neutralidad' sea un escudo por mucho más tiempo.\n\nAl norte y al este, los Usurpadores construyen su poder en Ceoris, su hechicería manchando el cielo nocturno. Al sur, los Voivodas Tzimisce afilan sus espadas, considerando tus tierras como nada más que una propiedad esperando ser reclamada por ellos. Estás rodeada de lobos, sin embargo, el mordisco más inmediato proviene de un compañero de sangre azul.\n\nUn enviado de Vencel Rikard está ante tu corte. Te ofrece su protección para contener la marea de Hechiceros y Demonios. El costo es simple. Solo necesitas jurarle lealtad, cesar tu experimento fallido de 'estado tapón' y convertirte en su tributario. Admitir que tú, una Arpad, no puedes mantener tus propias tierras sin que él te sostenga la mano."
 PODcanon_chars.113.t: "Kindred de los Santos Reyes"
 PODcanon_chars.113.a: "Me arrodillaré hoy, para poder levantarme y atacar mañana."
 PODcanon_chars.113.b: "¡No necesito amo!"
 PODcanon_chars.113.toast: "¡Nova suplica tu protección!"

 podintroductions.356.desc: "Lady Belphegor, fuiste una vez la respetada ama del Palacio de los Suspiros, encargada por el propio Lucifer de experimentar con la humanidad.\nQué época tan deliciosa pasaste, aprendiendo todo sobre cómo estas peculiares criaturas prosperan, se doblegan y se rompen. Tus hallazgos se utilizaron en la creación de los Lham, los mortales imperfectos con esencia demoníaca, y los Nefilim, los 'semidemonios' mucho más refinados.\n\nLamentablemente, la Hueste Celestial ganó al final y recorrió tu palacio a fondo antes de enviarte al Infierno, calificando tu trabajo de 'repugnante' y 'atroz', demostrando su estrechez de miras. Por suerte, pudiste escapar gracias a unos descuidados infernalistas hebreos, y lo que les hiciste fue tan perfectamente despiadado que se convirtió en un mito.\n\nDesde entonces, has estado vagando por el mundo, tratando de volver a donde estabas, aunque sin el apoyo de la hueste de Lucifer, ha sido un proceso lento, ya que ahora debes tener mucho más cuidado con tus experimentos. Últimamente se ha producido un avance, siendo Chenksa el primer Nefilim nacido bajo tu cuidado desde la Caída.\n\nEl primero, pero claramente no el último."
 podintroductions.356.a: "Cada grito es un paso hacia el conocimiento."
 belphegor_intro_tt: "Belphegor ya comienza con el conocimiento necesario para criar [GetTrait('nephilim').GetName(GetNullCharacter)]."