l_spanish:
 
 POD_blackdeath.0002.t: "Rumores de una plaga"
 POD_blackdeath.0002.desc: "Las enfermedades son algo habitual en esta época, pero un rumor naciente te ha hecho reflexionar. Habla de una plaga más terrible que cualquier otra, proveniente del lejano oriente. Esta terrible infección parece propagarse a un ritmo alarmante y el número de muertos aumenta cada día.\nTu gobierno, aunque algo desapegado de las preocupaciones mortales, sigue estando muy ligado al bienestar de esos seres frágiles de tu reino. ¿Qué pasaría si de repente fueras el gobernante de nada más que cadáveres y pulgas? Es una perspectiva sombría, suficiente para dar que pensar incluso al señor más cruel.\nSin embargo, el tiempo se agota y tienes que tomar una decisión: ¿intentarás preparar sutilmente a los mortales de tu zona para los tiempos difíciles que se avecinan?"
 POD_blackdeath.0002.a: "¡Recemos por la salvación!"
 POD_blackdeath.0002.b: "¡Necesito a mis mortales sanos!"
 POD_blackdeath.0002.c: "Eso está muy por debajo de mis preocupaciones"
 POD_blackdeath_preparations: "Estarás más preparado cuando llegue el jinete pálido."
 #small_blackdeath_devastation_modifier: "Pequeña devastación de la Peste Negra"
 #small_blackdeath_devastation_modifier_desc: "El Jinete Pálido está aquí, su toque es frío y mortal, pero algo suave comparado con el resto del mundo."
 #medium_blackdeath_devastation_modifier: "Devastación media de la Peste Negra"
 #medium_blackdeath_devastation_modifier_desc: "El Jinete Pálido está aquí. Afortunados, pero pocos, son los que lograron escapar de su abrazo mortal."
 #high_blackdeath_devastation_modifier: "Gran devastación de la Peste Negra"
 #high_blackdeath_devastation_modifier_desc: "El Jinete Pálido está aquí. Este es su reino, y ninguna alma viviente puede entrar aquí ya."
 POD_blackdeath.0004.t: "La Peste Negra"
 POD_blackdeath.0004.desc: "El mundo ha conocido su buena ración de plagas y enfermedades, pero ¿ha conocido alguna vez algo tan mortal como esta Peste Negra? Incluso con tu gran conocimiento, no recuerdas un evento tan funesto como este.\nLos mortales mueren en masa, reclamados por el Jinete Pálido que se mueve de ciudad en ciudad, dejando solo cadáveres y pulgas a su paso. Oraciones, fuego, culpas... nada parece ser capaz de detenerlo, ni siquiera de frenarlo. Comunidades enteras han sido reducidas a cenizas y el inquietante silencio que impregna el aire día y noche es revelador...\n¿Es este el fin?"
 POD_blackdeath.0004.a: "¿Un final lento y agotador para la humanidad?"
 POD_blackdeath_happening: "La Peste Negra ha llegado. Los reinos han sido devastados, perdiendo desarrollo y edificios dependiendo de la escala de la infección. Verás un modificador de condado indicando la cantidad de daño causado en cada condado."
 POD_blackdeath.0005.t: "El Azote"
 POD_blackdeath.0005.desc: "Está empeorando.\nDe algún modo, la cepa de la Peste Negra parece haber mutado. Hasta ahora, solo afectaba a los mortales y conllevaba pocas consecuencias directas para los vampiros, pero este ya no es el caso. Esta variante, apodada 'el Azote' por los estudiosos, ataca directamente a la $pod_vitae$ del vampiro. Hace que la sangre sea menos poderosa de lo que es habitualmente y, como tal, requiere un mayor gasto para que realmente funcione. Combinado con el suministro limitado de sangre debido a que los mortales siguen muriendo por doquier con la Peste Negra...\nLa única buena noticia es que el Azote no parece letal para los vampiros, solo debilitante como mucho. A pesar de las frenéticas indagaciones, nadie tiene la menor pista sobre cómo ha podido ocurrir esto o si alguien es responsable de ello..."
 POD_blackdeath.0005.a: "¿Hay un final para esta pesadilla?"
 POD_blackdeath.0005.b: "¡Los Tremere tienen la culpa, seguro!"
 POD_blackdeath.0005.c: "¡Los Capadocios han manipulado los cadáveres de los mortales muertos!"
 POD_blackdeath.0005.d: "Obviamente es culpa de los setitas."
 POD_scourge_tremere: "A los Tremere de tu reino no les gustará eso."
 POD_scourge_cappadocian: "A los Capadocios de tu reino no les gustará eso."
 POD_scourge_setite: "A los setitas de tu reino no les gustará eso."
 POD_scourge_warning: "Algunos vampiros han empezado a infectarse por el Azote y a propagarlo."
 #weak_scourge_modifier: "Síntomas leves del Azote"
 #weak_scourge_modifier_desc: "Has sido infectado por el Azote. Por suerte, solo estás experimentando una debilidad leve por ahora."
 #medium_scourge_modifier: "Síntomas medios del Azote"
 #medium_scourge_modifier_desc: "Has sido infectado por el Azote. Estás gravemente debilitado y tienes problemas para mantener la apariencia de un gobernante fuerte."
 #high_scourge_modifier: "Síntomas graves del Azote"
 #high_scourge_modifier_desc: "Has sido infectado por el Azote. Te sientes muy débil y, lo que es peor, pareces muy débil ante el resto del mundo cainita."
 #POD_blackdeath.0007.t: "El Azote: ¡Infectado!"
 #POD_blackdeath.0007.desc: "El Azote no perdona a nadie... al menos no a ti. Es una sensación extraña, la enfermedad ha sido un vago recuerdo de tus días de respirar durante mucho tiempo hasta este momento y ahora ha vuelto para perseguirte.\nTe sientes débil, tu sangre tiene problemas para conjurar el poder que una vez tuvo y puedes ver en los ojos de tu séquito el miedo a estar expuestos a ti... y el brillo codicioso de las oportunidades que se sopesan mientras estás así de debilitado.\nTiempos difíciles por delante."
 #POD_blackdeath.0007.a: "Solo necesito recostarme un poco..."
 POD_scourge_happening: "Has sido infectado por el Azote. Dada la naturaleza infecciosa de la enfermedad, tu séquito probablemente también lo esté o lo estará pronto.\nPuedes comprobar la gravedad de tu estado actual en el propio rasgo."
 #POD_blackdeath.0008.t: "¿El fin de una pesadilla?"
 #POD_blackdeath.0008.desc: "La Peste Negra está perdiendo terreno lentamente en el reino mortal. Y aunque ha sido un evento totalmente devastador, no ha aniquilado a la humanidad como algunos temían. Pasará mucho tiempo antes de que la civilización vuelva a estar donde estaba antes, pero los esfuerzos de reconstrucción han comenzado.\nEl Azote, esta enfermedad vampírica que les afectó, también está remitiendo, probablemente debido a su conexión parasitaria con la propia Peste Negra. Parece que la raza condenada de Caín ha ganado un poco más de tiempo bajo el cielo nocturno."
 #POD_blackdeath.0008.a: "El Jinete Pálido ha mostrado misericordia."
 POD_blackdeath.0007.t: "La Plaga del Desollamiento"
 POD_blackdeath.0007.desc: "No todos los enemigos de los Garou pueden combatirse con colmillos y garras. En el invierno de 1229, los hombres lobo de Lituania fueron víctimas de una fiebre. Al principio parecía una extraña variante de la tisis, luego aparecieron los bubones, después la piel se desprendió, agónicamente, de los huesos. Toda la población Garou de la región murió y la enfermedad empezó a extenderse hacia el oeste. Cientos de Garou y Parientes mueren a su paso mientras los Theurges parecen apenas capaces de contenerla.\nManadas de todo el mundo comparten información y rumores sobre la causa potencial de esta enfermedad mortal que parece claramente de naturaleza sobrenatural, ya que solo afecta a los hombres lobo y a sus parientes. ¿Se encontrará al culpable antes de que sea demasiado tarde para los orgullosos guerreros de Gaia?"
 POD_blackdeath.0007.a: "¡Debemos actuar!"
 POD_flaying_plague_happening: "La Plaga del Desollamiento ha comenzado en Europa del Este. Tienes acceso a una decisión para detenerla. Se producirán nuevos brotes periódicamente hasta que se encuentre una solución."
