l_spanish:

 podgangrel.1.t: "El Rito de Estatus: Fanfarronadas"
 podgangrel.1.desc: "Cuando dos Gangrel se encuentran por primera vez, o tras una larga ausencia, suelen participar en el Rito de Estatus. Este evento se ve como una forma de reforzar los vínculos entre compañeros de clan o, para los vampiros más agresivos, de afirmar rápidamente su superioridad.\nLa primera prueba suele ser el concurso de fanfarronadas. Los dos participantes claman a gritos cosas que podrían hacer, subiendo cada vez más la dificultad hasta que uno de ellos cede o pide pruebas. Cuando se piden pruebas, los dos contendientes deben cumplir su última fanfarronada, lo que a menudo puede resultar una tarea difícil cuando ambos han estado superándose mutuamente durante un rato."
 podgangrel.1.a: "¿Matar a un Lupino? ¡Ja! ¡Puedo enfrentarme a una manada entera!"
 POD_gangrel_challenge_interaction_succ: "¡Tu oponente cede!"
 POD_gangrel_challenge_interaction_lose: "Debes ceder."
 
 gangrel_challenge_unfriendly_tt: "Tu compañero recordará eso."
 
 podgangrel.2.t: "El Rito de Estatus: Combate amistoso"
 podgangrel.2.desc: "Has ganado el concurso de fanfarronadas y el ambiente entre vosotros dos está mejorando a medida que os comprendéis un poco más. Aun así, al final de la noche, has ganado y podrías restregarle esta victoria a tu invitado si quisieras un pequeño impulso para tu propio ego a su costa...\nEn cualquier caso, el Rito continuará con un combate amistoso que durará hasta que uno de vosotros ceda. Este concurso, aunque no es letal, ha sido materia de leyendas cuando dos poderosos Gangrel se encuentran y se produce una batalla despiadada para afirmar el dominio. ¿Quizás tú y tu oponente crearéis tal leyenda con vuestra propia batalla? ¿O tal vez sea solo un asunto unilateral?"
 podgangrel.2.a: "¡Fuiste débil fanfarroneando, esperemos que seas mejor luchando!"
 podgangrel.2.b: "Buenas fanfarronadas, amigo, ¡ahora luchemos!"

 podgangrel.3.desc: "Has perdido el concurso de fanfarronadas, pero esto es solo el comienzo del Rito. Mientras te preguntas si tu compañero realmente podría cumplir las monumentales tareas de las que alardeó, te preparas para el siguiente evento.\nEl Rito continuará con un combate amistoso que durará hasta que uno de vosotros ceda. Este concurso, aunque no es letal, ha sido materia de leyendas cuando dos poderosos Gangrel se encuentran y se produce una batalla despiadada para afirmar el dominio. ¿Quizás tú y tu oponente crearéis tal leyenda con vuestra propia batalla? ¿O tal vez sea solo un asunto unilateral?"
 podgangrel.3.a: "¡Es hora de vengarme!"
 
 podgangrel.4.t: "El Rito de Estatus: Relatos de viaje"
 podgangrel.4.desc: "Has ganado el combate entre vosotros dos y el subidón de la victoria fluye por tus venas. Tu compañero derrotado cura sus heridas y parece abatido; sería justo que le felicitaras por su actuación antes de continuar.\nLa última parte del Rito de Estatus es el intercambio informal de información relevante entre vosotros dos. Los Gangrel se mueven mucho y se espera que compartas cualquier cosa que pueda ayudar a tu compañero de clan mientras esté en esta región. A diferencia del concurso de fanfarronadas, este trata exclusivamente de verdades, no de promesas vacías."
 podgangrel.4.a: "¡Qué exhibición tan vergonzosa!"
 podgangrel.4.b: "Tuve suerte."

 podgangrel.5.desc: "Has perdido el combate entre vosotros dos y te tomas un momento para curar tus heridas y tu orgullo herido. Tu compañero espera a que te recuperes antes de pasar al siguiente evento.\nLa última parte del Rito de Estatus es el intercambio informal de información relevante entre vosotros dos. Los Gangrel se mueven mucho y se espera que compartas cualquier cosa que pueda ayudar a tu compañero de clan mientras esté en esta región. A diferencia del concurso de fanfarronadas, este trata exclusivamente de verdades, no de promesas vacías."
 podgangrel.5.a: "Espero que esto vaya mejor."

 podgangrel.6.t: "El Rito de Estatus: Caminos separados"
 podgangrel.6.desc: "Estabas claramente más informado sobre la región que tu compañero, lo que significa que te cedió este concurso. Aun así, no vendría mal ser amable con esta victoria si quisieras.\nCon el Rito de Estatus oficialmente concluido, ambos os preparáis para partir. El $pod_clan$ Gangrel tiene pocas tradiciones y ninguna organización general como muchos otros, pero este suceso aparentemente pequeño ayuda a consolidar una especie de cultura de clan, allanando con suerte el camino para una mayor unidad en el futuro."
 podgangrel.6.a: "Eras lamentablemente ignorante."
 podgangrel.6.b: "He aprendido mucho, gracias."

 podgangrel.7.t: "El Rito de Estatus: Partida"
 podgangrel.7.desc: "Con los tres concursos formalmente terminados, el Rito de Estatus se ha completado. Para bien o para mal, ahora comprendes un poco más a este compañero Gangrel y los vínculos del clan se han fortalecido, con suerte, por este evento. Cómo te hayas comportado durante el Rito afectará a cómo te vean en el futuro y es quizás el comienzo de una nueva relación."
 podgangrel.7.a: "Se ha creado un vínculo entre nosotros."
 podgangrel.7.b: "Esto fue un fastidio."
 podgangrel.7.c: "Hasta que nos volvamos a encontrar."
