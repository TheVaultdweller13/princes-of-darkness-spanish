l_spanish:

 podmalkavian.1.t: "La Red de Locura: la Novia de la Plaga"
 podmalkavian.1.desc: "La Red de Locura Malkavian es el hogar de tres residentes espirituales que destacan muy por encima de los demás. Algunos incluso dirían que estos Coronati, chiquillos del propio Malkav, sobrevivirían aquí si llegaran a encontrar su fin en el mundo físico.\nLa Novia de la Plaga es una de esas presencias. La prostituta del templo de la Primera Ciudad fue quien consoló a Malkav durante sus ataques de locura y muchos Malkavians la invocan durante los tiempos difíciles. A menudo aparecerá y aliviará la carga, pero siempre hay un precio: mientras que la enfermedad mental actual se curará, también se plantarán las semillas de una locura futura."
 podmalkavian.1.a: "El futuro está demasiado lejos para que me importe."
 podmalkavian.1.b: "¡Estoy perfectamente!"
 
 podmalkavian.2.t: "La Red de Locura: el Príncipe Astuto"
 podmalkavian.2.desc: "La Red de Locura Malkavian es el hogar de tres residentes espirituales que destacan muy por encima de los demás. Algunos incluso dirían que estos Coronati, chiquillos del propio Malkav, sobrevivirían aquí si llegaran a encontrar su fin en el mundo físico.\nEl Príncipe Astuto es una de esas presencias. Un aliado útil cuando sus engaños se dirigen a los enemigos de uno, pero atraer su atención sobre uno mismo es, ciertamente, un destino funesto. Y nunca puedes saber de qué lado se pondrá al final."
 podmalkavian.2.a: "¡Necesito ir un paso por delante!"
 random_scheme_exposed_tt: "Se revelará una intriga hostil aleatoria que te tenga como objetivo (si existe alguna)..."
 random_scheme_exposed_tt2: "...O una de tus intrigas hostiles será revelada al objetivo."
 
 podmalkavian.3.t: "La Red de Locura: el Innominado"
 podmalkavian.3.desc: "La Red de Locura Malkavian es el hogar de tres residentes espirituales que destacan muy por encima de los demás. Algunos incluso dirían que estos Coronati, chiquillos del propio Malkav, sobrevivirían aquí si llegaran a encontrar su fin en el mundo físico.\nEl Innominado es una de esas presencias. Una criatura de apetito voraz (físico y espiritual), se comerá todo, desde tus preocupaciones hasta tu propio nombre, si tiene suficiente hambre. Invocarlo puede ser tentador para olvidar algunas de las experiencias más traumáticas de la no-vida vampírica, pero siempre hay un coste."
 podmalkavian.3.a: "La bendita ignorancia aguarda."
 
 podmalkavian.4.t: "La Red de Locura: la Gran Pregunta"
 podmalkavian.4.desc: "Metatrón, la Boca de Dios, la conexión, la telaraña, los nervios de Malkav, Babel, el tejido, la mente-Legión, el sephiroth... La Red de Locura tiene casi tantos nombres como Malkavians hay en ella pero, al final de la noche, nadie sabe realmente qué es.\nPara muchos Malkavians, ni siquiera merece una explicación, simplemente es. Pero unas pocas mentes inquisitivas quieren saber más, y recorren su extensión espiritual con la esperanza de encontrar algún día una solución. ¿Eres tú uno de ellos?"
 podmalkavian.4.a: "¡Necesito una respuesta!"
 podmalkavian.4.b: "Simplemente es, en realidad."
  
 podmalkavian.5.t: "La Red de Locura: la Gemela"
 podmalkavian.5.desc: "Un rumor tácito entre el clan Malkavian es la existencia de una [Glossary('Antediluvian','game_concept_antediluvian_desc')] perdida llamada Malakai. Algunos dicen que era la gemela del propio Malkav y que, preocupantemente, podría ser incluso más peligrosa y estar más loca que su hermano. En algunas interpretaciones del mito, la separación forzada entre ambos hace mucho tiempo es lo que causó la psique fragmentada del fundador de vuestro clan.\nSea cierto o no, a veces puedes sentir una atracción en la Red de Locura, cerca de alguien que te arrulla para que abandones todos tus problemas y encuentres finalmente la paz lejos de la política despiadada de los no-muertos. Una propuesta tentadora, sin duda..."
 podmalkavian.5.a: "¿Paz al fin?"
 podmalkavian.5.b: "¡Tengo trabajo que hacer!"
   
 podmalkavian.6.t: "La Red de Locura: el Padre"
 podmalkavian.6.desc: "Muchos piensan que Malkav, el fundador de vuestro clan, tiene al menos algo que ver con la Red de Locura. ¡¿Tal vez la use como una red de espionaje, o como una forma de garantizar el control sobre vuestras almas, o tal vez incluso la red sea en realidad la psique fracturada de Malkav manifestándose en sus descendientes e intentando reconstruirse?! Nadie lo sabe, y probablemente nadie lo sabrá nunca hasta que Malkav (si realmente tiene algo que ver con ello) revele la verdad.\nPero eso no impide que las mentes inquisitivas busquen perspicacia. Sin embargo, juguetear demasiado en los confines más remotos de esta locura espiritual puede tener graves inconvenientes."
 podmalkavian.6.b: "A veces, es mejor no saber."
    
 podmalkavian.7.t: "La Red de Locura: Individualidad fugaz"
 podmalkavian.7.desc: "La Red de Locura es, por encima de todo, un colectivo de mentes Malkavian unidas de algún modo. Para aquellos que se sumergen profundamente en ella, puede convertirse rápidamente en una sensación abrumadora que pone en peligro el propio sentido del yo del viajero. Sin embargo, para aquellos dispuestos a arriesgarse, en este reino se encuentra el conocimiento acumulado de todo un clan."
 podmalkavian.7.a: "¡Lo veo todo!"
 podmalkavian.7.b: "Estoy lo bastante entero, gracias."
    
 podmalkavian.8.t: "La Red de Locura: Sueños del pasado"
 podmalkavian.8.desc: "La Red de Locura está plagada de recuerdos. Hay vampiros muy antiguos aquí y han visto muchas cosas. Algunos incluso dicen que los recuerdos de los vampiros muertos pueden permanecer aquí durante un tiempo. La mayoría de estos fragmentos hablan de una época mejor para el clan Malkavian, cuando eran respetados como videntes y profetas y asesoraban a los más grandes emperadores.\nCada Malkavian tiene en su interior la chispa de esta antigua grandeza. Pero activarla puede requerir mucho esfuerzo."
 podmalkavian.8.a: "¡Quiero ver el futuro!"
 podmalkavian.8.b: "Vivir en el presente parece más seguro."
      
 podmalkavian.9.t: "La Red de Locura: Sueños del futuro"
 podmalkavian.9.desc: "El clan Malkavian está lleno de profetas y videntes. Tal es la naturaleza de las profecías que son notoriamente difíciles de interpretar pero, raramente, uno puede vislumbrar verdaderamente una visión del futuro. Durante uno de tus recientes viajes por la conciencia colectiva del clan, has sido bendecido con tal evento. Aunque no recuerdas los detalles, puedes sentir un nuevo poder intentando despertar en ti, algo que se volverá crucial para tus hermanos en las próximas décadas, o incluso siglos."
 podmalkavian.9.a: "Necesito dominar esto."
     
 podmalkavian.10.t: "La Red de Locura: Locura y Genio"
 podmalkavian.10.desc: "El clan Malkavian cabalga la línea entre la locura y el genio más que cualquier otro clan. Sus perspicacias son buscadas por cualquier Príncipe prudente, pero también temidas por su falta de fiabilidad. Al final, incluso los propios Malkavians no entienden la diferencia la mayoría de las veces.\nSumergirse en la conciencia colectiva del clan, la Red de Locura, está exacerbando estos dos opuestos hasta el extremo. Uno puede volver con una perspectiva de la vida nueva y perspicaz... o como un loco delirante."
 podmalkavian.10.a: "¿Cruzaré la línea?"