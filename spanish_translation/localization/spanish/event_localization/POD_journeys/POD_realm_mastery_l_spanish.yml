l_spanish:
 POD_realm_mastery.2.t: "[Select_CString( DidShatteringHappen, 'Los Fantasmas de', 'La Corte de' )] [PlayerJourneyDestination.GetHolding.GetCurrentSpecialBuildingType.GetNameNoTooltip]"
 POD_realm_mastery.2.desc: "El Glamour en este lugar es palpable. Es como si el aire mismo vibrara con potencial creativo, listo para hacer realidad los sueños.\n\n"
 POD_realm_mastery.2.desc.preshattering: "Los nobles $POD_splat_fae$ que residen aquí en [PlayerJourneyDestination.GetHolding.GetCurrentSpecialBuildingType.GetName] me han concedido una audiencia. Rostros estoicos por todas partes, pero no necesariamente hostiles."
 POD_realm_mastery.2.desc.postshattering: "Tras el [Glossary('Shattering','game_concept_shattering_desc')], el feudo de [PlayerJourneyDestination.GetHolding.GetCurrentSpecialBuildingType.GetName] fue supuestamente abandonado. Sin embargo, hay claramente alguien poderoso observándome; puedo sentir su presencia en el [UmbraGlossary('dreaming')]."
 POD_realm_mastery.2.desc.end: "Hay una sensación de curiosa expectativa.\n\n¿Cómo debería presentar mi caso?"
 POD_realm_mastery.2.option.a: "Presentando tesoros incalculables."
 POD_realm_mastery.2.option.a.success: "El [Select_CString( DidShatteringHappen, 'Perdido está', 'Los Nobles están' )] impresionado"
 POD_realm_mastery.2.option.a.fail: "El [Select_CString( DidShatteringHappen, 'Perdido', 'Los Nobles' )] quería más"
 POD_realm_mastery.2.option.a.critfail: "MUCHO más"
 POD_realm_mastery.2.option.b: "Recitando un poema épico."
 POD_realm_mastery.2.option.b.success: "Una actuación impecable"
 POD_realm_mastery.2.option.b.fail: "Una actuación decente, con algunos contratiempos"
 POD_realm_mastery.2.option.b.critfail: "MUCHOS contratiempos"
 POD_realm_mastery.2.option.c: "Creando una obra de arte quimérica."
 POD_realm_mastery.2.option.c.success: "Una obra de arte asombrosa"
 POD_realm_mastery.2.option.c.fail: "La obra de arte necesitaba algunas revisiones menores"
 POD_realm_mastery.2.option.c.critfail: "La obra de arte necesitaba MUCHAS revisiones"
 
 POD_realm_mastery.3.t.success: "Una petición exitosa"
 POD_realm_mastery.3.t.fail: "Una petición costosa"
 POD_realm_mastery.3.t.critfail: "Una petición muy costosa"
 POD_realm_mastery.3.desc.preshattering: "Un murmullo de aprobación recorre la multitud. Parece que los nobles están complacidos con mi petición."
 POD_realm_mastery.3.desc.postshattering: "Sigo sin ver a mi acompañante, pero parece que la presencia invisible está complacida con mi petición."
 POD_realm_mastery.3.desc: "El aire chisporrotea y burbujea, y el Glamour puro brota del [UmbraGlossary('dreaming')], fusionándose en una serie de imágenes rápidas.\n\n"
 POD_realm_mastery.3.desc.actor: "Veo a los Olímpicos en los cielos, enemistados, discutiendo y luchando hasta que las nubes truenan y los mortales de abajo hablan en voz baja de su legendaria enemistad."
 POD_realm_mastery.3.desc.fae: "Veo a los Pródigos, los miles y miles y miles de rostros de aquellos que han olvidado sus orígenes $POD_splat_fae$ y esperan ser reunidos con el [UmbraGlossary('dreaming')], anhelando algo que nunca supieron que existía."
 POD_realm_mastery.3.desc.prop: "Veo una espada clavada en una piedra, esperando a su legítimo portador. Veo un martillo defectuoso, destinado a grandes hazañas a pesar de un mango demasiado corto. Y veo muchos más de estos tesoros, inmortalizados en canciones y sagas, y convirtiéndose en parte del propio [UmbraGlossary('dreaming')]."
 POD_realm_mastery.3.desc.nature: "Veo las estaciones, guerreando y nutriéndose mutuamente al mismo tiempo, como una danza intrincada. Veo océanos agitados y tormentas furiosas. Y veo la luna, y las lágrimas fluyen libremente de mis ojos, aunque no sé por qué."
 POD_realm_mastery.3.desc.scene: "Veo historias, viajando a través de continentes como si fueran seres vivos que respiran, llegando a cada rincón del mundo e inspirando asombro en Soñadores y Kithain por igual, sin importar la distancia."
 POD_realm_mastery.3.desc.time: "Veo historias como tesoros antiguos, perdurando a través de los eones, viviendo mientras haya Soñadores y Kithain para contarlas. Y aunque pasen las eras, su chispa nunca se apagará, y su capacidad de inspirar nunca se desvanecerá."
 POD_realm_mastery.3.desc.end: "\n\nLas imágenes quiméricas son demasiado para que las procese, pero algo profundo en mi interior ha alcanzado una nueva comprensión."
 POD_realm_mastery.3.option.a: "Atesoraré esta experiencia."