l_spanish:

 POD_journey_maintenance.1.t: "[Localize(Concatenate(PlayerJourneyID,'_planning_title'))]"
 POD_journey_maintenance.1.desc: "[Localize(Concatenate(PlayerJourneyID,'_planning_desc'))]"
 POD_journey_maintenance.1.option.a: "[Localize(Concatenate(PlayerJourneyID,'_planning_confirm'))]"
 POD_journey_maintenance.1.option.a.tt: "[Select_CString( GetScriptedGui('POD_can_start_travel_phase_sgui').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).End), Localize('POD_journey_maintenance.1.option.a.tt.default'), GetPlayer.Custom('PODCoterieTravelStatusGUI') )]"
 POD_journey_maintenance.1.option.a.tt.default: "$EFFECT_LIST_BULLET$Comenzarás inmediatamente la [travel_phase|E] de este [journey|E].\n[GetPlayer.Custom('PODCoterieTravelStatus')]"
 POD_journey_maintenance.1.option.b: "[Localize(Concatenate(PlayerJourneyID,'_planning_decline'))]"
 POD_journey_maintenance.1.option.b.tt: "La [planning_phase|E] de este [journey|E] concluirá."
 POD_journey_maintenance.1.option.b.tt.2: "El [journey|E] a $POD_current_journey$ se pausará. Puedes reanudarlo más tarde manteniendo todo tu progreso."
 
 POD_journey_maintenance.3.message: "Contratos encontrados"
 
 POD_journey_maintenance.20.t: "Un fallecimiento inoportuno"
 POD_journey_maintenance.20.desc: "Acabo de recibir noticias de que [journey_target.GetName] ha muerto.\n\nNaturalmente, esto significa que no podré continuar ningún [journeys|E] que tuviera a [journey_target.GetHerHim] como objetivo."
 POD_journey_maintenance.20.option.a: "Lamentable."
 POD_journey_maintenance.20.tt: "Todos tus [journeys|E] que tenían como objetivo a [journey_target.GetName] han terminado."
 
 POD_journey_maintenance.21.t: "Un tesoro perdido"
 POD_journey_maintenance.21.desc: "Ya sea deliberadamente o por accidente, uno de los [artifacts|E] que he estado buscando ha sido destruido.\n\nNaturalmente, esto significa que no podré continuar ningún [journeys|E] que lo tuviera como objetivo."
 POD_journey_maintenance.21.tt: "Todos tus [journeys|E] que tenían como objetivo este [artifact|E] perdido han terminado."
 
 POD_journey_maintenance.100.t: "[Localize(Concatenate(PlayerJourneyID,'_travel_title'))]"
 POD_journey_maintenance.100.desc: "[GetPlayer.Custom('PODCoterieTravelStatusFlavor')]\n\n[Localize(Concatenate(PlayerJourneyID,'_travel_desc'))]"
 POD_journey_maintenance.100.desc.companion: "\n\n[companion.Custom('PODCoterieIntroFlavor')]"
 POD_journey_maintenance.100.option.a: "[Localize(Concatenate(PlayerJourneyID,'_travel_confirm'))]"
 
 POD_journey_maintenance.110.t: "¿Qué sigue?"
 POD_journey_maintenance.110.desc: "Ahora que he regresado a casa, puedo centrar mi atención en otros asuntos pendientes.\n\nAlgunos de mis [journeys|E] están listos para ser reanudados."
 POD_journey_maintenance.110.option.a: "No quiero reanudar ningún viaje en este momento."