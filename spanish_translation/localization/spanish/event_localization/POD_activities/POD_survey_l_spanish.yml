l_spanish:

 survey_capital_decision: "Inspeccionar tu Capital"
 survey_capital_decision_tooltip: "Viajarás por tu principado"
 survey_capital_decision_opening_desc: "A veces, es posible que necesites hacer las cosas tú mismo. ¿Quién puede confiar realmente en estos halagadores consejeros?"
 survey_capital_decision_confirm: "Hagamos un recorrido por mis tierras"
 survey_capital_decision_desc_shy: "Como eres perezoso, esta actividad puede ser estresante"
 survey_decision_effect_tooltip: "Esto te dará oportunidades para mejorar tu capital"
 
 strict_control_modifier: "Control Estricto"
 strict_control_modifier_desc: "Estás supervisando todo lo que sucede en tu dominio, lo que te brinda mayores oportunidades de influencia, pero también una mayor resistencia por parte de los mortales."
 lax_control_modifier: "Control Laxo"
 lax_control_modifier_desc: "Estás dejando que los mortales hagan mayormente lo que quieran aquí. Prósperan rápidamente sin la influencia vampírica que los obstaculice."
  
 opportunities1_modifier: "Nuevas Oportunidades I"
 opportunities1_modifier_desc: "Pueden surgir pronto nuevas oportunidades de influencia en esta provincia. Una vez que este modificador alcance 5, se desbloqueará una nueva ranura de edificio. Ten en cuenta que puedes tener un máximo de 9 ranuras de edificio a la vez; este modificador será inútil después de alcanzar ese límite."

 opportunities2_modifier: "Nuevas Oportunidades II"
 opportunities2_modifier_desc: "Pueden surgir pronto nuevas oportunidades de influencia en esta provincia. Una vez que este modificador alcance 5, se desbloqueará una nueva ranura de edificio. Ten en cuenta que puedes tener un máximo de 9 ranuras de edificio a la vez; este modificador será inútil después de alcanzar ese límite."
  
 opportunities3_modifier: "Nuevas Oportunidades III"
 opportunities3_modifier_desc: "Pueden surgir pronto nuevas oportunidades de influencia en esta provincia. Una vez que este modificador alcance 5, se desbloqueará una nueva ranura de edificio. Ten en cuenta que puedes tener un máximo de 9 ranuras de edificio a la vez; este modificador será inútil después de alcanzar ese límite."
  
 opportunities4_modifier: "Nuevas Oportunidades IV"
 opportunities4_modifier_desc: "Pueden surgir pronto nuevas oportunidades de influencia en esta provincia. Una vez que este modificador alcance 5, se desbloqueará una nueva ranura de edificio. Ten en cuenta que puedes tener un máximo de 9 ranuras de edificio a la vez; este modificador será inútil después de alcanzar ese límite."

 opportunitiesend_modifier: "Totalmente Influenciada"
 opportunitiesend_modifier_desc: "Has alcanzado la cantidad máxima de influencia (y ranuras de edificio) que puedes tener en esta provincia."
  
 POD_survey_events.1000.t: "La Inspección: ¿Una Escolta?"
 POD_survey_events.1000.desc: "Eres consciente de que, a pesar de estar nominalmente en tu dominio, hay peligros acechando fuera de tu centro de poder. Mientras te preparas para esta importante inspección de tu capital, te preguntas qué escolta llevar contigo, si es que llevas alguna. Obviamente, no quieres aparentar que temes viajar por tus propias tierras, pero podrías estar aún más preocupado por una posible emboscada o amenaza inesperada..."
 POD_survey_events.1000.option.a: "¡Todo un ejército!"
 POD_survey_events.1000.option.b: "Unos cuantos guardias serán suficientes"
 POD_survey_events.1000.option.c: "Deberían temerme a mí, no al revés"
 full_escort_survey_tooltip: "Una elección segura pero poco impresionante"
 half_escort_survey_tooltip: "Probablemente una buena elección equilibrada"
 no_escort_survey_tooltip: "Una elección prestigiosa pero potencialmente peligrosa"
  
 POD_survey_events.1001.t: "La Inspección: ¿A Dónde Ir?"
 POD_survey_events.1001.desc: "Estás listo para salir, pero la noche no es eterna (lamentablemente), así que tendrás que elegir qué parte de la ciudad inspeccionarás esta noche. Obviamente, hay diferentes oportunidades y riesgos en cada una de ellas. También limitarás tu elección entre áreas donde tienes algunos activos que atender, no es necesario deambular sin rumbo."
 POD_survey_events.1001.option.a: "Un barrido general de mi influencia en la ciudad"
 POD_survey_events.1001.option.b: "Vayamos a los cuarteles militares"
 POD_survey_events.1001.option.c: "¿Quizás los gremios de mercaderes?"
 survey_buildings_option_tooltip: "Más opciones se abren dependiendo de los edificios presentes en tu capital"
 POD_survey_events.1001.option.d: "¿Qué hace el clero por la noche?"
 POD_survey_events.1001.option.e: "El barrio noble es donde está el poder"
 POD_survey_events.1001.option.f: "Tengo amigos en lugares bajos"
 
 POD_survey_events.1.t: "La Inspección: Una Patrulla"
 POD_survey_events.1.desc: "Durante tu recorrido por la ciudad, te encuentras con una patrulla de guardias, probablemente de la milicia. Honestamente, son un grupo lastimoso, su armadura apenas se sostiene y sus pies apenas los arrastran. Esto los hace bastante fáciles de evitar y no te molestan, pero este encuentro te hace pensar que, tal vez, podrías aumentar tu control sobre la ciudad influyendo en algunos más de ellos.\nSería fácil de hacer, pero eso ciertamente no ayudaría a la suerte de los ciudadanos, apenas protegidos por esta parodia de soldados. Por otro lado, podrías retirar la influencia que ya tienes sobre ellos, esperando que mejoren con el tiempo sin tu interferencia."
 POD_survey_events.1.option.a: "Más control siempre es mejor"
 POD_survey_events.1.option.b: "Quizás pueda relajarme en este caso específico"
 POD_survey_events.1.option.c: "Simplemente paga por nuevos uniformes"
 
 POD_survey_events.2.t: "La Inspección: Personas sin Hogar"
 POD_survey_events.2.desc: "Mientras viajas por la ciudad, te das cuenta de que hay bastantes mortales sin hogar que intentan sobrevivir en las calles. Estos son presas fáciles, pero no ayudan a mejorar el prestigio de tu dominio. Se te ocurre una idea novedosa, ¡quizás podrías hacer una 'inversión'! Darles algo de oro podría ayudar a que se conviertan en miembros productivos de tu ganado con el tiempo. O podrías simplemente no molestarte, después de todo, los mortales serán mortales."
 POD_survey_events.2.option.a: "Toma, para que me sirvas mejor"
 POD_survey_events.2.option.b: "La presa fácil es suficientemente buena"
 
 POD_survey_events.3.t: "La Inspección: Reclutas"
 POD_survey_events.3.desc: "Tu control sobre la guarnición militar estacionada en la ciudad es bueno, pero debe mantenerse siempre. Especialmente cuando nuevos reclutas entran en el proceso de entrenamiento, ya que estos recién llegados aún están libres de tu influencia. Mientras te acercas al cuartel militar, notas que están realizando un ejercicio de perforación nocturno, lo que podría ser una oportunidad. ¿Quizás podrías presentarte?"
 POD_survey_events.3.option.a: "Considérame como tu superior"
 POD_survey_events.3.option.b: "No molestaré a estos"
 POD_survey_events.3.option.c: "¡Entrenaré yo mismo a estos gusanos!"

 survey_mercenaries_contact_modifier: "Contacto con Mercenarios"
 survey_mercenaries_contact_modifier_desc: "Has invertido mucho en mercenarios locales. Vale la pena."
 
 POD_survey_events.4.t: "La Inspección: Mercenarios"
 POD_survey_events.4.desc: "Los espadas por encargo son una realidad en estos tiempos turbulentos. Has sido lo suficientemente diligente como para invertir en los tuyos locales durante bastante tiempo y no te sorprende verlos esta noche, divirtiéndose ruidosamente en las calles de la ciudad. Si estás planeando algunas aventuras militares, invertir aún más en ellos podría ser fructífero. Otra opción sería reducir tu control sobre ellos por un tiempo, ya que estás bastante seguro de que los ciudadanos no están tan entusiasmados con tener tantos rufianes ruidosos desfilando impunemente entre ellos."
 POD_survey_events.4.option.a: "¡Amigos, tengo un nuevo trabajo para ustedes!"
 POD_survey_events.4.option.b: "Por favor, dejen de molestar a los vecinos"
 
 POD_survey_events.5.t: "La Inspección: Oportunidades"
 POD_survey_events.5.desc: "Gracias a tu considerable influencia sobre la clase mercantil de la ciudad, a menudo eres el primero en enterarte de nuevas oportunidades lucrativas. Y como cualquier patrón generoso como tú haría, no dudas en tomar tu parte de cualquier nuevo negocio. Uno de tus contactos te advierte esta noche sobre las últimas noticias y cómo sacar el mejor provecho de ellas. También dice que esto podría ser una gran bendición para el desarrollo de la ciudad... pero tomar tu merecida parte podría obstaculizarlo bastante. ¿Qué harás?"
 POD_survey_events.5.option.a: "Invertiré en ello"
 POD_survey_events.5.option.b: "Muéstrame el dinero"
 POD_survey_events.5.option.c: "Muéstrame TODO el dinero"
 auspexadvanced_tooltip: "Esta opción está disponible porque tienes poderes de percepción fuertes"

 POD_survey_events.6.t: "La Inspección: El Recién Llegado"
 POD_survey_events.6.desc: "Un nuevo negocio ha abierto recientemente en tu ciudad y estabas pensando en visitarlo esta noche. Obviamente, es solo para ser servicial hacer saber a cualquier forastero quién es el verdadero líder del barrio mercantil aquí. Aún así, tienes dudas.\nNotaste que, después de tu visita, la mayoría de estos mercaderes parecen perder la voluntad de trabajar realmente hasta los huesos por el bien de tu comunidad. Quizás podrías intentar un nuevo enfoque audaz y simplemente no interferir."
 POD_survey_events.6.option.a: "Los viejos métodos funcionan mejor"
 POD_survey_events.6.option.b: "Déjalo en paz"
 POD_survey_events.6.option.c: "¡Sacúdelo!"
 greedy_tooltip: "Esta opción está disponible porque eres un chupasangre codicioso"
 
 POD_survey_events.7.t: "La Inspección: Hombres de Fe"
 POD_survey_events.7.desc: "El clero es quizás la parte más difícil de influenciar de la sociedad mortal. Solo se necesita que uno de sus miembros tenga una fe fuerte para poner en peligro toda tu operación. Esta noche, te han informado de que un predicador problemático ha venido a hacer una reunión en tu ciudad y ya ha atraído a bastantes seguidores. Su diatriba contra 'demonios' y 'monstruos' podría ser un peligro potencial... pero eliminarlo por la fuerza o de otro modo también tendría consecuencias."
 POD_survey_events.7.option.a: "¡Ningún predicador en mi ciudad!"
 POD_survey_events.7.option.b: "No será una amenaza... ¿verdad?"
 POD_survey_events.7.option.c: "Únete a la multitud disfrazado de seguidor"
 obfuscateadvanced_tooltip: "Esta opción está disponible porque tienes un fuerte dominio de Ofuscación"
  
 POD_survey_events.8.t: "La Inspección: Nuevo Templo"
 POD_survey_events.8.desc: "A pesar de la buena influencia que tienes sobre el clero de tu dominio, no has podido detener la construcción planeada de un nuevo lugar de oración cerca. Ahora estás deambulando cerca de él, mirando con fastidio el sitio de construcción en progreso. Tener aún más hombres de fe en tu área podría ser problemático, ya que a menudo son bastante capaces de discernir tu verdadera naturaleza. Sin embargo, todavía hay tiempo para asegurarse de que la construcción sufra algunos contratiempos desafortunados..."
 POD_survey_events.8.option.a: "Déjalo estar"
 POD_survey_events.8.option.b: "Contrata a algunos rufianes"
 POD_survey_events.8.option.c: "¡Golpéalo fuerte!" 
 potenceadvanced_tooltip: "Esta opción está disponible porque tus puños pueden causar terremotos literales"

 POD_survey_events.9.title: "La Inspección: Amor Joven"
 POD_survey_events.9.desc: "Mientras deambulas por el barrio noble, te encuentras con una situación interesante. Desde la calle, un joven intenta cortejar a una joven que lo mira desde su balcón. No parece muy efectivo, sin embargo, ya que tartamudea mucho y su bella pronto cierra su ventana, dejándolo abatido.\nEs claramente hijo de la nobleza, y esa situación suena como una posibilidad fácil, aunque inusual, de obtener un nuevo contacto que podría ser útil en el futuro."
 POD_survey_events.9.option.a: "Dale algunos consejos"
 POD_survey_events.9.option.b: "Ríete de él"
 POD_survey_events.9.option.c: "Ayuda a lograr un final feliz" 
 
 POD_survey_events.10.t: "La Inspección: La Ley"
 POD_survey_events.10.desc: "Tienes algunos contactos útiles en el sistema judicial mortal de tu ciudad. A través de uno de ellos te enteraste de que un caso será juzgado esta noche, uno que involucra a algunos rufianes que probablemente serán ahorcados por sus fechorías. El problema es que estos son rufianes 'tuyos' y aún podrían serte útiles para asegurar que los mortales de la zona se mantengan en línea. ¿Intervendrás para ayudarlos?"
 POD_survey_events.10.option.a: "La justicia es ciega"
 POD_survey_events.10.option.b: "¡Yo soy la ley!"

 POD_survey_events.11.t: "La Inspección: Los Ladrones"
 POD_survey_events.11.desc: "Gracias a tus contactos en el hampa de tu ciudad, has podido acorralar a un exitoso grupo de ladrones que ha estado plagando el barrio noble durante algún tiempo. Son meros mortales y no representan una amenaza para ti, pero podrían ser útiles. Estás pensando en 'contratarlos', asegurándote de que una parte de sus fechorías vuelva a ti. O podrías simplemente deshacerte de ellos, haciendo que el vecindario sea más seguro en el futuro previsible."
 POD_survey_events.11.option.a: "Ahora trabajan para mí"
 POD_survey_events.11.option.b: "Detengamos esto, muchachos"
 
 POD_survey_events.12.t: "La Inspección: El Matón"
 POD_survey_events.12.desc: "A pesar de tu influencia en el hampa de la ciudad, parece que uno de los maleantes no recibió el mensaje. Sonríes mientras este matón te amenaza. Realmente, es todo tan pintoresco que apenas reprimes una risa, lo que pone al matón visiblemente agitado y acercándose a ti con lo que parece una mirada amenazadora. Un distracción refrescante sin duda, pero ¿qué hacer ahora?"
 POD_survey_events.12.option.a: "Déjalo seco"
 POD_survey_events.12.option.b: "Haz que trabaje para ti"
 POD_survey_events.12.option.c: "Es hora de reconsiderar tus elecciones de vida"

 POD_survey_events.101.t: "La Inspección: Regreso sin Incidentes"
 POD_survey_events.101.desc: "Después de tu pequeño recorrido por tu ciudad, regresas a tu [ROOT.Char.Custom('PODDomicile')] sin ningún problema. La actividad noche tras noche pronto volverá a consumir tu cordura, pero al menos ha sido refrescante dar un paseo."
 POD_survey_events.101.option.a: "Todo salió bien"

 POD_survey_events.110.t: "La Inspección: El Asesino"
 POD_survey_events.110.desc: "Apenas lo ves venir.\nMientras regresas a tu [ROOT.Char.Custom('PODDomicile')], el sonido de una daga desenvainada te hace girar, justo a tiempo para ver a una figura sombría demasiado cerca de tu cuello para tu comodidad. ¿Un agente de un rival? ¿Un rival largamente olvidado? No tienes tiempo para reflexionar sobre ello mientras tu aspirante a asesino salta hacia ti con un movimiento demasiado rápido para ser el de un mero mortal..."
 POD_survey_events.110.option.a: "¡Guardias! ¡A mí!"
 survey_assassin_tooltip: "Tu escolta completa se encargará de esto." 
 POD_survey_events.110.option.b: "Hagámoslo"
 POD_survey_events.110.effect.success.desc: "Abrumado, el asesino huye"
 POD_survey_events.110.critical.failure.effect.desc: "Un movimiento equivocado..."
 POD_survey_events.110.critical.failure: "Sangre y Oscuridad"
 POD_survey_events.110.option.d: "¡Huye!"

 POD_survey_events.111.t: "La Inspección: El Asesino II"
 POD_survey_events.111.desc: "Abrumado por tu fuerte defensa, el asesino de repente se da la vuelta y comienza a huir. En un movimiento reflejo impulsado principalmente por tu Bestia vengativa, corres tras él. Pronto ambos se mueven a una velocidad sobrenatural y la persecución te lleva a través de calles, edificios e incluso tejados. Se está volviendo bastante difícil seguirlo, pero también ves signos de agotamiento en tu objetivo. ¿Quizás su sangre se está agotando? Sea cual sea el caso, la persecución termina y..."
 POD_survey_events.111.option.a: "...¡él escapa!"
 assassin_flees_tooltip: "Es demasiado rápido para ti. Es hora de volver a casa." 
 POD_survey_events.111.option.b: "...¡lo atrapaste!"
 celerityadvanced_tooltip: "Esta opción está disponible gracias a tus poderes de velocidad sobrenatural." 

 list_names_survey_modifier: "Lista de Nombres"
 list_names_survey_modifier_desc: "Sabes quiénes son. Y los encontrarás."
 
 POD_survey_events.112.t: "La Inspección: El Asesino III"
 POD_survey_events.112.desc: "Te estabas acercando a tu cazador convertido en presa cuando, de repente, el asesino se vuelve su daga contra sí mismo. Probablemente al darse cuenta de que su huida era inútil e imaginando las cosas muy gráficas que le harías para hacerle hablar, eligió poner fin a su propia no-muerte.\nNo es exactamente el final que querías, pero después de un rápido vistazo a las cenizas, notas varios papeles que hablan del contrato sobre tu cabeza. Obviamente no enumeran precisamente quién quiere que mueras, pero aún así son bastante esclarecedores..."
 POD_survey_events.112.option.a: "Mejor que nada"
 
 POD_survey_events.120.t: "La Inspección: El Incendio"
 POD_survey_events.120.desc: "¿Por qué ahora? ¿Es solo incompetencia mortal? ¿O un ataque indirecto de uno de tus rivales? No importa el culpable, un gran incendio ha comenzado a extenderse por tu ciudad y está cerca de cercar tu posición, haciendo que regresar a tu [ROOT.Char.Custom('PODDomicile')] sea una perspectiva peligrosa.\nTu Bestia ya ruge dentro de su jaula para huir a toda prisa mientras consideras cómo evitar, o despejar, mejor a los mortales que gritan y al fuego voraz. No será fácil."
 POD_survey_events.120.option.a: "¡Guardias! ¡Despejen un camino!"
 beast_takeover_survey_tooltip: "Tu Bestia en frenesí te llevará a un lugar seguro" 
 POD_survey_events.120.option.b: "Encontraré una manera..."
 POD_survey_events.120.effect.success.desc: "Escapas de lo peor del infierno"
 POD_survey_events.120.critical.failure.effect.desc: "Termina como empezó. En fuego."
 POD_survey_events.120.critical.failure: "¡Arde! ¡Arde!"
 POD_survey_events.120.option.d: "Deja que la Bestia tome el control" 
 
 POD_survey_events.121.t: "La Inspección: El Incendio II"
 POD_survey_events.121.desc: "Lograste evitar lo peor del incendio y los mortales lo están apagando lentamente. Lamentablemente, tu ruta de escape te ha dejado bastante lejos de tu [ROOT.Char.Custom('PODDomicile')], demasiado lejos para que puedas evitar el sol matutino si intentas llegar allí. Como tal, no tienes más remedio que encontrar refugio en un lugar poco digno hasta que puedas regresar a tu sede de poder la noche siguiente."
 POD_survey_events.121.option.a: "¡Es como un viaje de campamento!"
 survey_fire_ending_tooltip: "Regresas a casa la noche siguiente sintiéndote sucio, pero aún en una pieza." 
 POD_survey_events.121.option.b: "Simplemente me fusionaré con la Tierra"
 proteanadvanced_tooltip: "Esta opción está disponible gracias a tu dominio de Protean." 
 POD_survey_events.121.option.c: "Organiza un buen alojamiento"

 POD_survey_events.130.t: "La Inspección: Los Cazadores"
 POD_survey_events.130.desc: "¡Una emboscada! De camino a tu [ROOT.Char.Custom('PODDomicile')], un grupo aparentemente bien organizado (e informado) de cazadores de vampiros te ha cercado. Están bien armados y son cautelosos en su enfoque, demostrando que no es su primera caza. Los mortales a menudo no son una preocupación, pero un grupo así con antorchas, flechas incendiarias y probablemente uno o dos verdaderos creyentes es otro asunto completamente diferente... Consideras tus opciones."
 POD_survey_events.130.option.a: "¡Guardias! ¡Encárguense de ellos!"
 best_bravely_tooltip: "No esperaban que huyeras. Los pierdes fácilmente, pero te recordarán." 
 POD_survey_events.130.option.b: "¡A la batalla!"
 POD_survey_events.130.effect.success.desc: "¡Una victoria decisiva!"
 POD_survey_events.130.critical.failure.effect.desc: "Termina como empezó. En fuego."
 POD_survey_events.130.critical.failure: "¡Arde! ¡Arde!"
 POD_survey_events.130.option.d: "¡Huye!" 

 POD_survey_events.131.t: "La Inspección: Los Cazadores II"
 POD_survey_events.131.desc: "La victoria es tuya. Te sirves de la sangre de estos mortales, ya que ya no la necesitarán, y piensas en qué hacer con los supervivientes heridos de este asalto que ahora están a tu merced. Llevarlos de vuelta a tu [ROOT.Char.Custom('PODDomicile')] para una 'demostración' frente a tu corte parece una opción agradable y relajante. O podrías optar por una exhibición más pública en una parte central de tu ciudad, pero eso seguramente llamará la atención de más cazadores en el futuro."
 POD_survey_events.131.option.a: "Una demostración privada suena bien"
 POD_survey_events.131.option.b: "Domínalos para que otros se aparten de tu rastro"
 POD_survey_events.131.option.c: "Es hora de dar un escarmiento"
  
 POD_survey_events.140.t: "La Inspección: El Profeta"
 POD_survey_events.140.desc: "Mientras regresas a casa a tu [ROOT.Char.Custom('PODDomicile')), un anciano que murmura lo que parece un galimatías incoherente te aborda. Puedes distinguir palabras como 'vampiros' y 'Dios', sin embargo, lo que capta tu atención. Mientras reduces un poco la velocidad, el loco se acerca y comienza a hablar aún más excitado que antes. Incluso prestando atención, comprender un ápice de lo que intenta decir sería toda una hazaña."
 POD_survey_events.140.option.a: "Me quedo un rato y escucho"
 ending_survey_tooltip: "Regresas a casa sin más obstáculos." 
 POD_survey_events.140.option.b: "No escucho a ningún loco"
 POD_survey_events.140.effect.success.desc: "Eso tiene sentido, hasta cierto punto"
 POD_survey_events.140.critical.failure.effect.desc: "No lo entiendo..."
 POD_survey_events.140.critical.failure: "¡Ni idea!"

 POD_survey_events.141.t: "La Inspección: El Profeta II"
 POD_survey_events.141.desc: "Bueno, fue... no exactamente 'esclarecedor', pero al menos hay algunas cosas interesantes en qué reflexionar sobre lo que dijo este anciano. Aunque la naturaleza siempre críptica de tales profecías las hace no merecer realmente la pena la mayoría de las veces. En cualquier caso, el autoproclamado profeta está feliz de que hayas escuchado y te ha dejado solo. Tu [ROOT.Char.Custom('PODDomicile')] te espera, con más preguntas que respuestas."
 POD_survey_events.141.option.a: "Solo divagaciones, realmente"
 malkavian_survey_tooltip: "Esta opción está disponible porque eres Malkavian" 
 POD_survey_events.141.option.b: "¡Las preguntas son el punto!"
 POD_survey_events.141.option.c: "No, realmente, esto estuvo clarísimo"