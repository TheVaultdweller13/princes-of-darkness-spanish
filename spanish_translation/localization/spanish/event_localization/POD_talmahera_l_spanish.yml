l_spanish:
 POD_talmahera.10.t: "La Mano tras la cortina"
 POD_talmahera.10.desc: "Últimamente te han llegado a ti y a otros gobernantes de la noche con ideas afines informes preocupantes sobre un culto de la Gehena de algún tipo. Aunque la mayoría de esos fanáticos del apocalipsis suelen ser bastante inofensivos, estos en concreto parecen utilizar su fachada de inocuidad para reunir información sobre diversos asuntos, como los principales actores de poder en la región, sus debilidades y otros activos políticos que no suelen asociarse a las prácticas de los cultos de la Gehena.\nPodría haber una conspiración mayor en juego."
 POD_talmahera.10.a: "¿Quién intenta mover nuestros hilos?"
 
 POD_talmahera.11.t: "¡Expuestos!"
 POD_talmahera.11.desc: "Si la Camarilla es una espada para la Tal'Mahe'Ra, el Sabbat es su maza de hierro. No todos los vampiros del Sabbat son cabezas de pala juerguistas, pero hay una falta de contención definitiva que solo se encuentra en estas filas. La Tal'Mahe'Ra se ha infiltrado en la Secta en todos los niveles de poder e influencia, incluyendo al menos a dos Arzobispos y un Cardenal. Su mejor activo es la libertad de sembrar ramas y vástagos de sus cultos principales por todo el Sabbat. Estos grupos son pequeños, compuestos por agentes leales y piadosos, que presentan diversas caras públicas al Sabbat.\nA pesar de estos éxitos, el Sabbat sigue siendo el enemigo ideológico más real al que debe enfrentarse la Tal'Mahe'Ra. La Espada de Caín busca hacer la guerra a los Antediluvianos. Cuando llegue la Gehena, el Sabbat será sin duda la principal fuerza de oposición. Cuando las noticias sobre la adoración a los Antediluvianos llegan a oídos de los verdaderos creyentes de la secta, su respuesta es siempre rápida y sangrienta.\n #N ¡Esto ha sucedido porque tu intento de infiltración alcanzó el máximo de sospecha! #!"
 POD_talmahera.11.a: "No es más que un contratiempo."
 POD_talmahera.11.a.tt: "Infiltrarse en el Sabbat está prohibido durante #V 20#! años."
 
 POD_talmahera.12.t: "¡Expuestos!"
 POD_talmahera.12.desc: "La Camarilla es a la vez la Secta más fácil y la más difícil de infiltrar, y los agentes de la Tal'Mahe'Ra disfrutan de diversos grados de éxito en sus misiones. En todos los aspectos importantes, la Camarilla es el hijo bastardo de la meritocracia y la aristocracia, y la Tal'Mahe'Ra se ha convertido en maestra en manipular el sistema para lograr el poder dentro de la estructura política de la Secta. Los agentes de la Tal'Mahe'Ra vigilan cuidadosamente el desprecio de la Camarilla hacia los Antediluvianos como cuentos de hadas y leyendas urbanas. Qué hacer al respecto sigue siendo un punto de discordia dentro de la Tal'Mahe'Ra. Algunos agentes siembran semillas de duda en sus ciudades, intentando atraer a los Vástagos a los cultos. Buscan poner fin a los abusos de la Camarilla intentando derrocar a la corrupta Secta desde dentro, utilizando a sus propios miembros. Otros agentes fomentan la ignorancia de la Camarilla, alimentando y reforzando la incredulidad. Al fin y al cabo, los Antediluvianos tendrán que alimentarse cuando despierten. Qué mejor festín que una población de vampiros de mente débil y sangre fuerte pillados desprevenidos.\nA pesar de esta aparente facilidad, varios Príncipes y Justicars han sospechado lo suficiente como para iniciar investigaciones. Hasta la fecha, no ha surgido ninguna prueba de una gran conspiración, pero puede ser solo cuestión de tiempo antes de que algo incriminatorio salga a la luz.\n #N ¡Esto ha sucedido porque tu intento de infiltración alcanzó el máximo de sospecha! #!"
 POD_talmahera.12.a: "No es más que un contratiempo."
 POD_talmahera.12.a.tt: "Infiltrarse en la Camarilla está prohibido durante #V 20#! años."
 
 POD_talmahera.13.t: "¡Expuestos!"
 POD_talmahera.13.desc: "La Tal'Mahe'Ra de África y Oriente Medio es una división diminuta y aislacionista que no comparte sus secretos con el cuerpo principal de la Secta. Algunos creen que un serafín habita en sus filas, pero muchos saben que la Mano en África no está supervisada por un serafín en absoluto, sino por un triunvirato de antiguos que interpretan la voluntad del Del'Roh como mejor les parece. El propósito principal de esta división es vigilar la presencia de la Camarilla, la Ashirra y el Sabbat en África, frustrar las intrigas de los setitas y obtener información sobre los misteriosos e insulares vampiros Laibon de África. La Mano africana no suele adoptar un papel combativo en los asuntos de la región, lo que la convierte en la división más pasiva de la Tal'Mahe'Ra. La jerarquía laxa deja en gran medida a sus miembros a su aire. Como resultado, han surgido muchos cultos de sangre bajo la guía de la Tal'Mahe'Ra, que proporcionan un suministro constante de sangre, criados, agentes, espías e informantes a sus maestros. A pesar de esta pasividad, la Mano africana no siempre es lo suficientemente sutil como para evitar problemas, sobre todo por parte de la secta Ashirra, bien organizada e ideológicamente opuesta.\n #N ¡Esto ha sucedido porque tu intento de infiltración alcanzó el máximo de sospecha! #!"
 POD_talmahera.13.a: "No es más que un contratiempo."
 POD_talmahera.13.a.tt: "Infiltrarse en la Ashirra está prohibido durante #V 20#! años."
 
 POD_talmahera.14.t: "¡Expuestos!"
 POD_talmahera.14.desc: "Los Seguidores de Set parecen una adición obvia a la Tal'mahe'Ra, ya que su paradigma no se desvía mucho de nuestra veneración a los fundadores de los Clanes. Sin embargo, la Secta ha estado en guerra con los setitas desde los primeros días de su historia. Originados inicialmente por la competencia sobre Enoch hace milenios, los conflictos posteriores surgieron cuando las Serpientes demostraron ser expertas en manipular tanto a la Tal'Mahe'Ra como a los Assamitas para que entraran en conflicto.\nAunque la Tal'Mahe'Ra no desea nada más que la destrucción total de este Clan, tienen que proceder con cuidado. Los setitas saben mucho sobre la Secta y utilizan esta información para defenderse estratégicamente si la Tal'Mahe'Ra actúa demasiado abiertamente contra ellos. Esto obliga a la Secta a abandonar el enfoque en los setitas y concentrarse en el control de daños para preservar su secreto.\nLamentablemente, las Serpientes también son maestras en este juego específico, lo que ha provocado que muchos agentes de la Tal'mahe'Ra en Egipto desaparezcan o se conviertan directamente a la adoración de Set.\n #N ¡Esto ha sucedido porque tu intento de infiltración alcanzó el máximo de sospecha! #!"
 POD_talmahera.14.a: "No es más que un contratiempo."
 POD_talmahera.14.a.tt: "Infiltrarse en los setitas está prohibido durante #V 20#! años."
 
 POD_talmahera.15.t: "¡Expuestos!"
 POD_talmahera.15.desc: "Desde las sombras de los palacios de Potala y Norbulinka, hasta el tejado dorado del templo de Jokhang, Lhasa es el corazón y el alma cultural del Tíbet, así como de la Tal'Mahe'Ra en Asia. La jerarquía de la Mano asiática es rígida, dando menos importancia al beneficio personal y más a la devoción al conjunto. Cada vampiro en su interior conoce su lugar en el orden de las cosas, y aquellos que sobrepasan los límites de ese lugar son tratados con decisión. Esta división está profundamente conectada con los mortales de la región, y la Tal'Mahe'Ra asume un papel más activo en la vida cotidiana del ganado.\nLa influencia de la Tal'mahe'Ra se ve limitada por el simple hecho de que estos territorios suelen estar bajo el control de los Catayanos, o [GetTrait('kueijin').GetName( GetNullCharacter )], y esos seres pueden detectar fácilmente a un vampiro occidental entrometiéndose en sus asuntos.\n #N ¡Esto ha sucedido porque tu intento de infiltración alcanzó el máximo de sospecha! #!"
 POD_talmahera.15.a: "No es más que un contratiempo."
 POD_talmahera.15.a.tt: "Infiltrarse en los Catayanos está prohibido durante #V 20#! años."