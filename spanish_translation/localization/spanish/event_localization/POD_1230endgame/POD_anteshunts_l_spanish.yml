l_spanish:

 POD_anteshuntabsi.1.t: "Cazando Dioses"
 POD_anteshuntabsi.1.desc: "La Revuelta Anarquista es una época de crisis sin precedentes... y de oportunidades. Con la mayoría de los clanes sumidos en el caos, y la Inquisición impidiendo que los ancianos se comuniquen a larga distancia, los antiguos $pod_cainites$ son vulnerables como nunca antes.\nAlgunos de los Anarquistas más vengativos están planeando ataques audaces contra los [Glossary('Antediluvianos','game_concept_antediluvian_desc')], progenitores de los clanes, con la esperanza de repetir la $pod_diablerie$ de Tremere sobre Saulot. ¿Intentarás probar suerte en esta empresa? Las recompensas potenciales son atractivas pero los riesgos... los riesgos están más allá de la imaginación. Estas entidades están más cerca de ser Dioses que simples mortales."
 POD_anteshuntabsi.1.a: "Cazaré al cazador, Absimilliard de los Nosferatu."
 POD_anteshuntabsi.1.b: "...No tengo un deseo de muerte."
 POD_anteshuntabsi.1.c: "Cazaré a la sombra, Lasombra."
 big_freaking_warning: "#R Tus posibilidades de éxito en esta búsqueda son absurdamente bajas. No lo intentes si te importa el bienestar de tu personaje.\nNi siquiera guardar y recargar la partida para probar suerte te salvará.\nQuedas advertido.#!"
 POD_anteshuntabsi.2.t: "La Cacería: Encontrando a la Bruja"
 POD_anteshuntabsi.2.desc: "La ubicación de Absimilliard es desconocida, lo cual es el primer obstáculo a superar en tu búsqueda. La única persona que podría tener una pista al respecto podría ser Baba Yaga, su descarriada chiquilla y el blanco de su ira durante tanto tiempo. El problema es... que ella también se esconde.\nPara encontrarla, puedes, penosamente, buscar cualquier información sobre ella tú mismo o pedirle a su segundo al mando, Viktor de la Cortina de Sombras, una posible alianza contra Absimilliard. Si es que sigue vivo y activo, obviamente."
 POD_anteshuntabsi.2.a: "¡La encontraré yo mismo!"
 POD_anteshuntabsi.2.effect.success.desc: "Avanzas un paso más en tu búsqueda."
 POD_anteshuntabsi.2.critical.failure.effect.desc: "Un contratiempo, pero no el fin de las cosas." 
 POD_anteshuntabsi.2.b: "Encontraré un terreno común con Viktor."
 POD_anteshuntabsi.2.c: "Querida Abuelita, ¡es hora de contraatacar!"
 skip_viktor: "Como Viktor, puedes saltarte esta fase. Sabes dónde está Baba Yaga."
 POD_anteshuntabsi.2.d: "¡Soy su campeón elegido, sé dónde está!"
 skip_objectivedone: "Como el objetivo de la Abuela Protectora se ha logrado, Baba Yaga se ha revelado. Puedes saltarte esta fase sin problemas."
 POD_anteshuntabsi.4.t: "La Cacería: Forzando el Camino"
 POD_anteshuntabsi.4.desc: "Hasta ahora, no has podido conseguir la ubicación de Baba Yaga, el primer paso hacia tu búsqueda de matar a Absimilliard.\nNecesitas intensificar tu investigación, lo que significa más oro, tiempo y recursos en general gastados en lo que probablemente sea una misión descabellada en el mejor de los casos. Quizás es hora de reconsiderar este curso de acción... o continuar a pesar de todo."
 POD_anteshuntabsi.4.a: "¡No seré frustrado tan fácilmente!"
 anteabsi_continue: "Tu búsqueda continúa."
 POD_anteshuntabsi.4.b: "Es mejor parar ahora."
 anteabsi_end: "Tu búsqueda termina aquí."
 POD_anteshuntabsi.3.t: "La Cacería: Dagas en la Noche"
 POD_anteshuntabsi.3.desc: "Te estás preparando para el viaje hacia el hogar de Baba Yaga cuando te llegan informes de un misterioso asesinato. Un miembro de tu séquito ha sido asesinado, lo cual no es realmente sorprendente, pero los detalles del ataque son más preocupantes.\nEl asesino ha dejado una palabra, escrita con sangre, en una pared cerca de la víctima: 'Nictuku'.\nHas oído hablar de ello durante tu tiempo investigando a Absimilliard, parece ser su chiquillo vinculado por sangre, todos máquinas de matar sin alma empeñadas en destruir cualquier cosa que amenace a su progenitor.\nParece que ahora estás en su lista negra, y estás bastante seguro de que debes ocuparte de ellos, antes de que ellos se ocupen de ti..."
 POD_anteshuntabsi.3.a: "Debo detenerlos rápidamente."
 anteabsi_nictuku: "Ahora tienes acceso a cinco decisiones para despistar a los Nictuku. Si lo logras, esto ayudará en las etapas posteriores de tu búsqueda."
 abraxes_decision: "Ocupándose de Abraxes"
 abraxes_decision_tooltip: "Despistando al Señor de las Nieblas"
 abraxes_decision_desc: "El Nictuku Abraxes es un maestro del engaño. Debes fabricar un rastro de desinformación para mantenerlo alejado."
 abraxes_decision_effect_tooltip: "Abraxes no intervendrá en las etapas posteriores de tu búsqueda." 
 abraxes_decision_confirm: "Hazlo"
 echidna_decision: "Ocupándose de Equidna"
 echidna_decision_tooltip: "Engañando a la Madre de la Inmundicia"
 echidna_decision_desc: "El Nictuku Equidna es la madre de los horrores. Debes fabricar un rastro de desinformación para mantenerla alejada."
 echidna_decision_effect_tooltip: "Equidna no intervendrá en las etapas posteriores de tu búsqueda." 
 echidna_decision_confirm: "Hazlo"
 gorgo_decision: "Ocupándose de Gorgo"
 gorgo_decision_tooltip: "Silenciando a Aquella que Grita en la Oscuridad"
 gorgo_decision_desc: "El Nictuku Gorgo es la señora de las pesadillas. Debes fabricar un rastro de desinformación para mantenerla alejada."
 gorgo_decision_effect_tooltip: "Gorgo no intervendrá en las etapas posteriores de tu búsqueda." 
 gorgo_decision_confirm: "Hazlo"
 nuckalavee_decision: "Ocupándose de Nuckalavee"
 nuckalavee_decision_tooltip: "Domando al Despellejado"
 nuckalavee_decision_desc: "El Nictuku Nuckalavee es el Corcel del Infierno. Debes fabricar un rastro de desinformación para mantenerlo alejado."
 nuckalavee_decision_effect_tooltip: "Nuckalavee no intervendrá en las etapas posteriores de tu búsqueda." 
 nuckalavee_decision_confirm: "Hazlo"
 gayomart_decision: "Ocupándose de Gayomart"
 gayomart_decision_tooltip: "Moviendo lo Inamovible"
 gayomart_decision_desc: "El Nictuku Gayomart es un guerrero inquebrantable. Debes fabricar un rastro de desinformación para mantenerlo alejado."
 gayomart_decision_effect_tooltip: "Gayomart no intervendrá en las etapas posteriores de tu búsqueda." 
 gayomart_decision_confirm: "Hazlo"
 babayaga_bound_modifier: "Vinculado a la Bruja"
 babayaga_bound_modifier_desc: "Perteneces a Baba Yaga. Incluso mantener tu cordura intacta está resultando ser un obstáculo."
 POD_anteshuntabsi.5.t: "La Cacería: La Ayuda de la Abuela"
 POD_anteshuntabsi.5.desc: "Encontraste a Baba Yaga. La esquiva Nosferatu es tan aterradora como imaginabas pero tampoco es tonta. Sabe de las posibilidades traídas por la Revuelta Anarquista y está escuchando tu oferta de una alianza para atacar a su temido [Glossary('Sire','game_concept_Sire_desc')].\nEl silencio después de que terminas de hablar es largo y chirriante, y solo se rompe cuando ella te presenta su brazo. El mensaje es claro, quiere que tomes un sorbo de su sangre, lo que te haría leal a ella.\nEs un alto precio a pagar, pero no tienes posibilidades de derrotar a Absimilliard, o incluso encontrarlo, sin su ayuda."
 POD_anteshuntabsi.5.a: "Si este es el único camino..."
 POD_anteshuntabsi.5.b: "¡Corre como alma que lleva el diablo!"
 POD_anteshuntabsi.5.effect.success.desc: "¡Logras huir!"
 POD_anteshuntabsi.5.critical.failure.effect.desc: "Eres atrapado...."
 POD_anteshuntabsi.5.critical.failure: "¡A la Olla!"
 anteabsi_end_baba: "#warning Esta elección terminará tu búsqueda incluso si sobrevives #!."
 POD_anteshuntabsi.6.t: "La Cacería: Hacia el Bosque"
 POD_anteshuntabsi.6.desc: "Tu presa está en algún lugar profundo de la naturaleza salvaje rusa. Has reunido a tus compañeros de mayor confianza y Baba Yaga ha hecho lo mismo. En conjunto, es una fuerza formidable la que ahora camina a tu lado pero... aún estás lejos de tener confianza.\nAbsimilliard seguramente tendrá varias salvaguardas letales para proteger su lugar de descanso e incluso la propia Bruja desconfía de los temidos Nictuku que probablemente te esperan.\nEs el paso final de tu búsqueda, pero podría ser el más difícil."
 POD_anteshuntabsi.6.a: "Ya no hay vuelta atrás"
 POD_anteshuntabsi.7.t: "La Cacería: La Furia de Darvag"
 POD_anteshuntabsi.7.desc: "Mientras caminas hacia el denso bosque, tu grupo es repentinamente emboscado por una manada de temibles bestias lupinas. Estas criaturas son veloces y se retiran al bosque después de cada muerte.\nEsto es, hasta que Darvag Grozny, uno de los lugartenientes de Baba Yaga, cargó de repente tras ellas. Las bestias fueron pilladas desprevenidas, y no pudieron huir lo bastante rápido. Pronto, el feral Tzimisce estaba sobre ellas y logró mantenerlas en su sitio el tiempo suficiente para que tu grupo las hiciera pedazos.\nContinúas tu búsqueda con tu expedición prácticamente intacta."
 POD_anteshuntabsi.7.a: "La Bruja tiene aliados útiles."
 darvaghelped: "Que Darvag Grozny estuviera vivo te permitió saltarte esta parte del viaje."
 POD_anteshuntabsi.8.t: "La Cacería: Furia Bestial"
 POD_anteshuntabsi.8.desc: "Mientras caminas hacia el denso bosque, tu grupo es repentinamente emboscado por una manada de temibles bestias lupinas. Estas criaturas son veloces y se retiran al bosque después de cada muerte.\nEstos ataques incesantes deben ser tratados, o tu séquito será eliminado uno a uno. Podrías tenderles una trampa, o preparar una defensa sólida.\nEn cualquier caso, algo debe hacerse, y pronto, ya que puedes oír a los lobos aullando de nuevo cerca de tu posición..."
 POD_anteshuntabsi.8.a: "¡Formad un círculo!"
 POD_anteshuntabsi.8.effect.success.desc: "Rechazas a los monstruos; tu búsqueda continúa."
 POD_anteshuntabsi.8.critical.failure.effect.desc: "Otro que muerde el polvo..."
 POD_anteshuntabsi.8.critical.failure: "Fuiste Masticado"
 POD_anteshuntabsi.9.t: "La Cacería: El Sacrificio de Gutka"
 POD_anteshuntabsi.9.desc: "Hay una criatura gigante bloqueándote el camino. Este pedazo de obra escamosa, grasienta y en general desagradable no se parece a nada que hayas encontrado antes. Baba Yaga la describe como la 'mascota favorita' de su [Glossary('Sire','game_concept_Sire_desc')], y está en tu camino.\nAfortunadamente, la Bruja tiene una solución: lanzarle a la lastimera criatura conocida como 'Gutka'. Esta cáscara de vampiro te ha estado siguiendo desde tu partida y aparentemente ha encontrado un propósito en darte algo de tiempo para esquivar a la 'mascota' de Absimilliard.\n¿Quién sabe? Puede que el monstruo incluso se apiade de otro monstruo."
 POD_anteshuntabsi.9.a: "La Bruja tiene aliados útiles."
 gutkahelped: "Que el Gutka estuviera vivo te permitió saltarte esta parte del viaje."
 POD_anteshuntabsi.10.t: "La Cacería: La Mascota de Absimilliard"
 POD_anteshuntabsi.10.desc: "Hay una criatura gigante bloqueándote el camino. Este pedazo de obra escamosa, grasienta y en general desagradable no se parece a nada que hayas encontrado antes. Baba Yaga la describe como la 'mascota favorita' de su [Glossary('Sire','game_concept_Sire_desc')], y está en tu camino.\nNo hay forma de esquivarla y tendrás que luchar. Esa cosa podría partirte por la mitad con solo un golpe de sus manos... garras... lo que sea, pero has pasado el punto de no retorno."
 POD_anteshuntabsi.10.a: "Debería replantearme mis elecciones de vida."
 POD_anteshuntabsi.10.effect.success.desc: "Matas al monstruo, tu búsqueda continúa."
 POD_anteshuntabsi.10.critical.failure.effect.desc: "Otro que muerde el polvo..."
 POD_anteshuntabsi.10.critical.failure: "Fuiste Partido"
 POD_anteshuntabsi.11.t: "La Cacería: La Astucia de Siamko"
 POD_anteshuntabsi.11.desc: "Estás perdido. Ya no se puede negar. El bosque te está jugando malas pasadas, cubriendo tus huellas, o cambiando repentinamente los senderos ante ti. No tienes un suministro infinito de sangre a tu disposición, así que debes actuar rápidamente.\nAfortunadamente, tienes a uno de los mejores rastreadores de Rusia en tu grupo, Siamko. El inquietante 'nieto' de la Bruja pronto te está guiando fuera de este laberinto antinatural, recordándote cuánto necesitabas la ayuda de Baba Yaga en esta búsqueda."
 POD_anteshuntabsi.11.a: "La Bruja tiene aliados útiles."
 siamkohelped: "Que Siamko estuviera vivo te permitió saltarte esta parte del viaje."
 POD_anteshuntabsi.12.t: "La Cacería: Perdido"
 POD_anteshuntabsi.12.desc: "Estás perdido. Ya no se puede negar. El bosque te está jugando malas pasadas, cubriendo tus huellas, o cambiando repentinamente los senderos ante ti. No tienes un suministro infinito de sangre a tu disposición, así que debes actuar rápidamente.\nCon vampiros tan viejos y poderosos en tu séquito, calculas que la falta de sustento pronto podría convertirse en un baño de sangre. Debe haber una pista o un patrón en este laberinto que puedas explotar para salir antes de que sea demasiado tarde."
 POD_anteshuntabsi.12.a: "¿Por aquí... o por allí?"
 POD_anteshuntabsi.12.effect.success.desc: "Encuentras una salida, tu búsqueda continúa."
 POD_anteshuntabsi.12.critical.failure.effect.desc: "Perdido en el bosque..."
 POD_anteshuntabsi.12.critical.failure: "Sin Salida"
 POD_anteshuntabsi.13.t: "La Cacería: Abraxes"
 POD_anteshuntabsi.13.desc: "Mientras continúas tu viaje hacia el bosque, una densa niebla cae de repente sobre tu grupo. Claramente de origen sobrenatural, realmente dificulta tu campo de visión y pronto te ves separado de tus compañeros.\nEs entonces cuando empiezan los gritos.\nEstás siendo emboscado uno a uno, tu enemigo usando la cobertura de esta niebla para aislarte. Si no encuentras una forma de salir de esta situación rápidamente, todo habrá terminado muy pronto."
 POD_anteshuntabsi.13.a: "¡Reuníos a mi alrededor!"
 POD_anteshuntabsi.13.effect.success.desc: "El enemigo ya no se atreve a atacar. Tu búsqueda continúa."
 POD_anteshuntabsi.13.critical.failure.effect.desc: "Otro que muerde el polvo..."
 POD_anteshuntabsi.13.critical.failure: "Un Final Brumoso"
 POD_anteshuntabsi.14.t: "La Cacería: Equidna"
 POD_anteshuntabsi.14.desc: "Los vampiros no pueden enfermar. Esa es una de las primeras cosas que aprendiste sobre tu condición hace mucho tiempo. Así que... ¿por qué te sientes tan mal ahora? Tampoco eres el único, ya que todo tu grupo parece afectado de repente por la inmundicia que emana del bosque.\nBaba Yaga piensa que esto es obra de Equidna, uno de los Nictuku. La Bruja está preparando una poción para ayudarte a sobrevivir, pero necesita algunos ingredientes muy específicos, y te estás quedando sin tiempo. Tendrás que ser rápido e impecable."
 POD_anteshuntabsi.14.a: "Recogiendo setas para salvar mi vida..."
 POD_anteshuntabsi.14.effect.success.desc: "¡Me siento mejor!"
 POD_anteshuntabsi.14.critical.failure.effect.desc: "Ese color no parece correcto..."
 POD_anteshuntabsi.14.critical.failure: "Un Final Enfermizo"
 POD_anteshuntabsi.15.t: "La Cacería: Gorgo"
 POD_anteshuntabsi.15.desc: "Este bosque maldito te ha estado poniendo de los nervios desde el comienzo de tu viaje, pero está empeorando. Un grito ensordecedor comenzó no hace mucho y aparentemente viene de todas partes a tu alrededor.\nTampoco es un mero grito mortal o animal, como pronto te das cuenta cuando la sangre empieza a brotar de tus oídos. Debes encontrar la fuente y eliminarla rápidamente o simplemente serás exanguinado. Un destino irónico para una sanguijuela de sangre inmortal."
 POD_anteshuntabsi.15.a: "¡¿Quieres callarte de una vez?!"
 POD_anteshuntabsi.15.effect.success.desc: "Paz y tranquilidad al fin."
 POD_anteshuntabsi.15.critical.failure.effect.desc: "No encuentras la fuente lo bastante rápido..."
 POD_anteshuntabsi.15.critical.failure: "Un Final Gritado"
 POD_anteshuntabsi.16.t: "La Cacería: Nuckalavee"
 POD_anteshuntabsi.16.desc: "Tu grupo es atacado por... algo. Una horda de monstruos de aspecto equino ha surgido del bosque y pisoteado a varios de tus seguidores. Te agachaste a un lado lo bastante rápido pero, a juzgar por el sonido de sus cascos, atacarán pronto desde el otro lado.\nSi tu séquito permanece completamente desorganizado como está ahora, es probable que esta horda simplemente os pisotee cada vez que ataquen, hasta que no quede nadie en pie. Debes reaccionar rápidamente para cambiar el rumbo."
 POD_anteshuntabsi.16.a: "¡Preparaos para su carga!"
 POD_anteshuntabsi.16.effect.success.desc: "¡Los haces retroceder!"
 POD_anteshuntabsi.16.critical.failure.effect.desc: "Te pisotean hasta la muerte."
 POD_anteshuntabsi.16.critical.failure: "Pisoteado hasta la Muerte"
 POD_anteshuntabsi.17.t: "La Cacería: Gayomart"
 POD_anteshuntabsi.17.desc: "Estás cerca del final de tu viaje, puedes sentirlo. Pero hay un nuevo obstáculo en tu camino, los cambiantes caminos del bosque se mueven más rápido, teniendo cada vez menos sentido. Claramente, uno de los Nictuku está jugando contigo, probablemente tratando de aislarte, o llevándote a la locura.\nHay límites a cuánto más puede aguantar tu fuerza de voluntad después de un viaje tan arduo, y quieres terminarlo. Debes encontrar un patrón, una pista o incluso simplemente abrirte paso a la fuerza fuera de esta ilusión rápidamente."
 POD_anteshuntabsi.17.a: "¡Estoy cansado de estos juegos!"
 POD_anteshuntabsi.17.effect.success.desc: "Disipas la ilusión."
 POD_anteshuntabsi.17.critical.failure.effect.desc: "Estoy tan cansado..."
 POD_anteshuntabsi.17.critical.failure: "Perdido en un Laberinto"
 POD_anteshuntabsi.18.t: "La Cacería: Vasilisa"
 POD_anteshuntabsi.18.desc: "Estás al final de tu viaje, ya que puedes sentir la presencia de Absimilliard cerca. El último obstáculo parece ser una... niña pequeña.\nParece lo bastante inocente, pero la mirada de puro terror en los ojos de Baba Yaga te dice lo contrario. 'Has sido traviesa, Abuelita.' dice ella.\nLa Bruja no responde, en su lugar lanza una maldición a la niña pequeña, cuya sonrisa espeluznante parece solo hacerse más amplia.\nTe enfrentas a la última batalla, e incluso con Baba Yaga a tu lado, no te gustan mucho tus posibilidades..."
 POD_anteshuntabsi.18.a: "¡Una última batalla!"
 POD_anteshuntabsi.18.effect.success.desc: "¡Lo lograste!"
 POD_anteshuntabsi.18.critical.failure.effect.desc: "Tan cerca de la victoria..."
 POD_anteshuntabsi.18.critical.failure: "Travieso y Castigado"
 POD_anteshuntabsi.19.t: "La Cacería: ¿Victoria?"
 POD_anteshuntabsi.19.desc: "Has derrotado el último obstáculo en tu camino hacia Absimilliard y el gran antiguo yace ante ti, en $pod_torpor$, afortunadamente. Baba Yaga ya ha comenzado a succionar su sangre, ejecutando una venganza planeada durante milenios.\nComo fuiste útil y leal, te ha prometido una parte de la potente sangre del [Glossary('Antediluviano','game_concept_antediluvian_desc')]. No lo suficiente para convertirte en una amenaza para ella, pero aún suficiente para incrementar significativamente tu propio poder.\nLa Bruja está distraída ahora mismo, sin embargo, devorando codiciosamente el alma de su [Glossary('Sire','game_concept_Sire_desc')]. Podrías ser capaz de apuñalarla por la espalda y reclamar el premio completo para ti mismo... pero, ¿y si ella lo está esperando?"
 POD_anteshuntabsi.19.a: "Una recompensa más que suficiente"
 POD_anteshuntabsi.19.b: "¡Su alma es mía!" 
 POD_anteshuntabsi.19.effect.success.desc: "Sorprendes a Baba Yaga."
 POD_anteshuntabsi.19.critical.failure.effect.desc: "La codicia no es buena"
 POD_anteshuntabsi.19.critical.failure: "La Codicia te Mató"
 young_third_modifier: "Joven Tercero"
 young_third_modifier_desc: "Eres demasiado joven para ser la amenaza apocalíptica que otros de la 3ª generación son. Aun así, probablemente eres el vampiro activo más temido y poderoso del mundo."
 POD_anteshuntabsi.20.t: "La Cacería: Victoria"
 POD_anteshuntabsi.20.desc: "Sorprendiste a Baba Yaga y la mataste limpiamente antes de que pudiera reaccionar. No tuvo tiempo de consumir el alma de Absimilliard. Como tal, el premio definitivo está justo frente a ti.\nNada te detendrá ahora, el poder definitivo yace por delante y te convertirás en el ser más poderoso activo en la Tierra... con el tiempo.\nTen cuidado, ya que muchos envidiarán tu poder e intentarán robarlo, y el Grande cuya alma estás comiendo probablemente intentará tomar el control de tu cuerpo.\nSi logras sobrevivir a estas pruebas entonces... el mundo será verdaderamente tu patio de recreo."
 POD_anteshuntabsi.20.a: "¡Lo he logrado!"
 POD_anteshuntlasomb.1.t: "La Cacería: Preparativos"
 POD_anteshuntlasomb.1.desc: "Las buenas noticias sobre Lasombra es que es fácil de encontrar, ya que ha estado mayormente durmiendo en el Castel del Ombro desde la caída de Roma. Las malas noticias son que el Castel es quizás la fortaleza $pod_cainite$ más fuerte aparte de Alamut, y el propio Lasombra está defendido en todo momento por su progenie.\nNecesitarás ayuda si quieres romper las defensas del castillo, y mucho menos tener éxito al final. Es hora de que lances una amplia red, y reúnas una fuerza verdaderamente formidable."
 POD_anteshuntlasomb.1.a: "Envía mensajeros a lo largo y ancho."
 lasombra_support_warning: "Cuanto más apoyo reúnas, más fácil será el asalto"
 POD_anteshuntlasomb.2.t: "La Cacería: Los Assamitas"
 POD_anteshuntlasomb.2.desc: "Los primeros en responder a tu llamada son una célula de asesinos Assamitas entrenados. Estos guerreros formidables, malditos a ansiar la sangre de otros $pod_cainites$, saborean la oportunidad de una batalla contra enemigos de sangre tan potente.\nSerían un gran activo para tu proyecto, pero sus servicios no son exactamente baratos..."
 POD_anteshuntlasomb.2.a: "El dinero no es problema."
 POD_anteshuntlasomb.2.b: "¡Eso es extorsión!"
 POD_anteshuntlasomb.3.t: "La Cacería: Los Anarquistas"
 POD_anteshuntlasomb.3.desc: "La horda aparentemente interminable de chusma Anarquista barriendo Europa ha mostrado obviamente un gran interés en tu proyecto. Matar a un [Glossary('Antediluviano','game_concept_antediluvian_desc')] estaría muy cerca de una victoria definitiva para ellos y tú eres uno de los pocos que parecen dispuestos a arriesgarse en tal empresa.\nPodrían ser útiles, como escudos de carne durante el asalto si nada más, pero alinearte con una banda de neonatos mal lavados sería bastante costoso para tu prestigio."
 POD_anteshuntlasomb.3.a: "¡Muerte a los ancianos! Excepto yo, por supuesto."
 POD_anteshuntlasomb.3.b: "Volved a vuestro patio de recreo."
 POD_anteshuntlasomb.4.t: "La Cacería: Contactos y Aliados"
 POD_anteshuntlasomb.4.desc: "Como señor prominente de la noche, has hecho muchos contactos, o incluso aliados formales, a lo largo de los años. Podría ser el momento de reclamar algunos favores si quieres tener una oportunidad de asaltar el Castel del Ombro.\nNo hace falta decir que nada es gratis en el mundo vampírico, sin embargo, incluso cuando se trata con 'amigos'..."
 POD_anteshuntlasomb.4.a: "Necesito toda la ayuda que pueda conseguir."
 POD_anteshuntlasomb.4.b: "¡Bufones codiciosos!"
 POD_anteshuntlasomb.5.t: "La Cacería: Disensiones"
 POD_anteshuntlasomb.5.desc: "Has reunido una fuerza esperanzadoramente lo bastante fuerte para tomar el Castel del Ombro. Mientras repasas tu plan de acción una vez más, te perturban gritos provenientes del campamento.\nParece que, con tantos vampiros con diferentes objetivos reunidos en un solo lugar, las tensiones están a flor de piel y la frágil alianza que creaste ya está amenazada. Si no lo detienes ahora, esto podría escalar. Incluso un solo frenesí en un espacio tan abarrotado podría ser desastroso..."
 POD_anteshuntlasomb.5.a: "¡Que todo el mundo mantenga la calma!"
 POD_anteshuntlasomb.5.effect.success.desc: "Las cabezas más frías prevalecieron."
 POD_anteshuntlasomb.5.critical.failure.effect.desc: "Hora del frenesí..."
 POD_anteshuntlasomb.5.critical.failure: "Final Inesperado"
 POD_anteshuntlasomb.8.t: "La Cacería: Asalto Fallido"
 POD_anteshuntlasomb.8.desc: "A pesar de tus mejores esfuerzos, no estabas preparado para las defensas del Castel del Ombro. Su guarnición era una cosa, pero las sombras arremolinándose alrededor del lugar eran otra muy distinta. Cobraron vida cuando tu asalto comenzó, y fue entonces cuando supiste que no tenías ninguna posibilidad.\nTragándose a tu séquito, a veces dejándolos caer en otro lugar, o simplemente devorándolos, dieron buena cuenta de cualquier coordinación que tuviera tu ejército. Con tan pocos de vosotros quedando capaces de luchar, solo pudiste retrasar lo inevitable. Algunas pequeñas victorias, o muestras de destreza, aquí y allá, no cambiaron el resultado final.\nMientras las sombras te consumen, piensas que fuiste un necio al esperar una victoria pero al menos..."
 POD_anteshuntlasomb.8.a: "...Lo intenté."
 POD_anteshuntlasomb.7.t: "La Cacería: Asalto Exitoso"
 POD_anteshuntlasomb.7.desc: "Las defensas del Castel del Ombro eran tan terribles como temías. Constructos de sombra pura, poderosos vampiros Lasombra, un ejército de ghouls bien entrenados... Casi no lo logras.\nPero estabas bien preparado, y también notaste que los chiquillos más poderosos del propio Lasombra no estaban allí, quizás esperándote dentro... Tienes la inquietante sensación de que esto está lejos del final. El Castel del Ombro se extiende abierto ante ti... pero lejos de estar indefenso."
 POD_anteshuntlasomb.7.a: "¡No seré detenido!"
 POD_anteshuntlasomb.9.t: "La Cacería: La Mística"
 POD_anteshuntlasomb.9.desc: "Está oscuro ahí dentro. No es que esperaras otra cosa, pero incluso los vampiros tienen problemas para ver en tal oscuridad absoluta. Fue entonces cuando empezaron los ataques.\nViniendo aparentemente de todas partes, la oscuridad misma cobró vida y azotó a tu grupo. Esperabas algo así pero... ¿cómo luchas contra la oscuridad misma? Ninguna cantidad de espadas, puños o hechizos será suficiente...\nLa primera prueba del interior del Castel del Ombro ya podría ser la última."
 POD_anteshuntlasomb.9.a: "¡Fuego! ¡Antorchas, magia, lo que sea!"
 POD_anteshuntlasomb.9.effect.success.desc: "La luz triunfa por ahora."
 POD_anteshuntlasomb.9.critical.failure.effect.desc: "Tan oscuro..."
 POD_anteshuntlasomb.9.critical.failure: "Hola, Oscuridad..."
 POD_anteshuntlasomb.10.t: "La Cacería: La Hija Rechazada"
 POD_anteshuntlasomb.10.desc: "Otro corredor oscuro, otro obstáculo en tu camino. Esta mujer, obviamente también una chiquilla de Lasombra, no parece querer hacerte daño sin embargo.\nEsta 'Sybil' habla bastante odiosamente de su propio [Glossary('Sire','game_concept_Sire_desc')], y de hecho se propone ayudarte en tu búsqueda para matarlo. Dice que, sin su apoyo, no tienes ninguna posibilidad, incluso si llegas al corazón del castillo.\nEsto podría ser una trampa, pero esto también podría ser la única manera de que realmente tengas éxito..."
 POD_anteshuntlasomb.10.a: "Acepto tu ofrecimiento, dama oscura."
 POD_anteshuntlasomb.10.b: "¡No necesito ayuda!"
 sybil_help_tooltip: "Sybil te ayudará más adelante... probablemente."
 POD_anteshuntlasomb.11.t: "La Cacería: El Advenedizo"
 POD_anteshuntlasomb.11.desc: "'¡LASOMBRA ES MÍO!'\nTe giras para ver a un noble italiano aparentemente franco mirándote con asesinato en los ojos. Gratiano, el más reciente chiquillo de Lasombra, ha dejado clara su intención de matar a su propio padre... y tú estás en su camino.\nNo hay más opción que luchar. Este es tu destino contra el suyo. Solo uno de vosotros saboreará la sangre de Lasombra."
 POD_anteshuntlasomb.11.a: "Un duelo de los destinos será."
 POD_anteshuntlasomb.11.effect.success.desc: "¡Yo tengo el terreno elevado!"
 POD_anteshuntlasomb.11.critical.failure.effect.desc: "¡Él tiene el terreno elevado!"
 POD_anteshuntlasomb.11.critical.failure: "Esto estaba Escrito..."
 POD_anteshuntlasomb.12.t: "La Cacería: La Defensora"
 POD_anteshuntlasomb.12.desc: "Otro corredor, otro obstáculo. Una chiquilla de Lasombra, Khanom Mehr, ha iniciado una pequeña pelea con tu grupo pero pudiste dominarla.\nDerrotada, ahora suplica clemencia, lo que ciertamente facilitaría tu búsqueda. ¿Podrías permitirte dejarla con vida, sin embargo?\nMientras meditas tu próximo movimiento, de repente vislumbras un pequeño movimiento desde dentro de sus ropajes..."
 POD_anteshuntlasomb.12.a: "¡Mátala ahora!"
 POD_anteshuntlasomb.12.effect.success.desc: "Evitaste su ataque final."
 POD_anteshuntlasomb.12.critical.failure.effect.desc: "No evitaste su ataque final."
 POD_anteshuntlasomb.12.critical.failure: "No es Justo..."
 POD_anteshuntlasomb.13.t: "La Cacería: La Pirata"
 POD_anteshuntlasomb.13.desc: "Tu grupo ha llegado a una gran sala, adornada con estatuas antiguas aparentemente de origen dorio temprano. Te apresuras a señalar varias figuras sombrías usando lo que parecen espadas y escudos de bronce.\nSi las historias son ciertas, Lasombra era importante en la civilización de los Pueblos del Mar y así parece que los últimos vampiros de esta era velada se interponen en tu camino."
 POD_anteshuntlasomb.13.a: "¡Pertenecen a un museo!"
 POD_anteshuntlasomb.13.effect.success.desc: "Lees la ley a esos piratas."
 POD_anteshuntlasomb.13.critical.failure.effect.desc: "Caminas por la plancha..."
 POD_anteshuntlasomb.13.critical.failure: "Malditos Piratas..."
 POD_anteshuntlasomb.14.t: "La Cacería: El Titiritero"
 POD_anteshuntlasomb.14.desc: "Tu grupo es acosado por una horda de vampiros de aparente baja generación pero jóvenes. No son realmente una gran amenaza en sí mismos, pero siguen viniendo. Cada vez que atacan, pierdes uno o dos miembros de tu séquito, y esto podría llevarte a la muerte por desgaste.\nDebe haber alguien, en algún lugar de este castillo, que trama esta táctica cobarde. Este 'titiritero' debe ser eliminado."
 POD_anteshuntlasomb.14.a: "¡Muéstrate!"
 POD_anteshuntlasomb.14.effect.success.desc: "¡Lo encontraste!"
 POD_anteshuntlasomb.14.critical.failure.effect.desc: "Demasiado tarde..."
 POD_anteshuntlasomb.14.critical.failure: "Arrollado hasta la Muerte"
 POD_anteshuntlasomb.15.t: "La Cacería: El Guardián"
 POD_anteshuntlasomb.15.desc: "Una puerta está bloqueándote el camino. Aunque no es cualquier tipo de puerta, parece hecha enteramente de sombras, lo que significa que no tienes ni idea de cómo abrirla.\nPor suerte, un vampiro está de pie frente a ella, aparentemente no amenazante. Explicando que no siente amor por su [Glossary('Sire','game_concept_Sire_desc')], podría ser persuadido para abrirla. O podría dejar que la puerta te devore, si no presentas tu caso lo bastante bien.\nEs hora de poner a prueba tus habilidades menos marciales."
 POD_anteshuntlasomb.15.a: "Mi primer punto es..."
 POD_anteshuntlasomb.15.effect.success.desc: "La puerta se abre."
 POD_anteshuntlasomb.15.critical.failure.effect.desc: "La puerta te abre a ti."
 POD_anteshuntlasomb.15.critical.failure: "Asesinado por una Puerta"
 POD_anteshuntlasomb.16.t: "La Cacería: El Lealista"
 POD_anteshuntlasomb.16.desc: "Obviamente, tenía que estar aquí. Montano, la mano derecha de Lasombra y su más devoto lealista, está de pie frente a ti, una resolución profundamente arraigada en sus ojos. El viejo guerrero no se echará atrás en su deber y tú tampoco lo harás.\nNo hay necesidad de palabras. Solo uno de vosotros saldrá vivo del castillo."
 POD_anteshuntlasomb.16.a: "¿La última pelea?"
 POD_anteshuntlasomb.16.effect.success.desc: "Montano es derrotado."
 POD_anteshuntlasomb.16.critical.failure.effect.desc: "Eres derrotado."
 POD_anteshuntlasomb.16.critical.failure: "Un Final Honorable"
 POD_anteshuntlasomb.17.t: "La Cacería: La Cripta"
 POD_anteshuntlasomb.17.desc: "Llegaste al área del sótano del Castel del Ombro, donde, presumiblemente, yace el propio Lasombra. En un giro interesante de los acontecimientos, eres el único superviviente de tu séquito... lo que significa que no tendrás que compartir la sangre del [Glossary('Antediluviano','game_concept_antediluvian_desc')]... si lo encuentras.\nCiertamente, pronto notas que esta área de la cripta es un laberinto, y además absolutamente oscuro. Las paredes están hechas de sombras, y la disposición cambia constantemente. Podrías perderte por toda la eternidad aquí si no eres cuidadoso..."
 POD_anteshuntlasomb.17.a: "Encontraré un camino..."
 POD_anteshuntlasomb.17.effect.success.desc: "La última cámara está más adelante."
 POD_anteshuntlasomb.17.critical.failure.effect.desc: "Estoy de vuelta en la entrada, otra vez..."
 POD_anteshuntlasomb.17.critical.failure: "Perdido en la Oscuridad"
 POD_anteshuntlasomb.18.t: "La Cacería: Victoria"
 POD_anteshuntlasomb.18.desc: "Estás en el corazón del Castel del Ombro y puedes sentir la presencia de Lasombra... pero no puedes verlo. El [Glossary('Antediluviano','game_concept_antediluvian_desc')] parece haberse fusionado con las sombras antes de entrar en $pod_torpor$, haciendo su $pod_diablerie$ mucho más difícil.\nAfortunadamente, Sybil no te olvidó; la hija descarriada ha aparecido, y comenzado un ritual para devolver la esencia de Lasombra a su cuerpo. Esperas y esperas, hasta que finalmente el cuerpo del [Glossary('Antediluviano','game_concept_antediluvian_desc')] se reconstruye ante ti.\nSybil se despide de ti, tan misteriosa como siempre, y estás completamente solo frente a tu destino, uno de poder incalculable.\nEntonces golpeas."
 POD_anteshuntlasomb.18.a: "La victoria sabe dulce y sangrienta"
 POD_anteshuntlasomb.19.t: "La Cacería: ¿Victoria?"
 POD_anteshuntlasomb.19.desc: "Estás en el corazón del Castel del Ombro y puedes sentir la presencia de Lasombra... pero no puedes verlo. El [Glossary('Antediluviano','game_concept_antediluvian_desc')] parece haberse fusionado con las sombras antes de entrar en $pod_torpor$, haciendo su $pod_diablerie$ mucho más difícil.\nNo tienes forma de encontrar dónde está realmente su alma y realizar la $pod_diablerie$ sobre sombras no es exactamente algo que sepas hacer... Aun así lo intentas, arremetiendo contra la oscuridad, siguiendo tus instintos bestiales y deambulando por esta sala como una furia vengativa.\nEs un proceso agotador y no la sensación estimulante que anticipabas y sin embargo, sientes una oleada de poder en ti.\nLograste... algo. Quizás no la fuerza definitiva que buscabas, pero definitivamente eres victorioso y, en lo que respecta al resto del mundo, derrotaste a un [Glossary('Antediluviano','game_concept_antediluvian_desc')]."
 POD_anteshuntlasomb.19.a: "Una victoria incompleta."
 POD_anteshuntset.1.t: "La Cacería: Encontrando una Pista"
 POD_anteshuntset.1.desc: "Has puesto tu mira en Set, el 'Dios' por quien el $pod_clan$ Setita fue nombrado. Es razonable pensar que yace en algún lugar de Egipto, bien custodiado por su fanática progenie. Egipto es un gran lugar, sin embargo, y no puedes realmente preguntar a los lugareños sobre un asunto tan delicado.\nTu primera orden del día es conseguir una pista sobre la ubicación actual del [Glossary('Antediluviano','game_concept_antediluvian_desc')]. Como tal, tendrás que enviar a tus agentes a lo largo y ancho, con una fuerte cantidad de oro para incitar a algunos informantes útiles a presentarse."
 POD_anteshuntset.1.a: "Ningún precio es demasiado alto."
 POD_anteshuntset.1.b: "...Reconsideremos esto."
 set_end_warning: "Abandonas esta insensata búsqueda."
 POD_anteshuntset.2.t: "La Cacería: Preparativos"
 POD_anteshuntset.2.desc: "Una pista creíble ha vuelto a ti. La Corte de Fuego, uno de los principales templos Setitas, podría saber más sobre la ubicación de Set. Te estás preparando para el viaje al templo cuando una sensación de pavor te invade.\nNo fuiste realmente cuidadoso al pedir información sobre Set, y su $pod_clan$ podría ya estar sobre tu pista. Tendrás que prepararte cuidadosamente para el camino por delante, o tu búsqueda será corta."
 POD_anteshuntset.2.a: "Aventajando a las serpientes..."
 POD_anteshuntset.2.effect.success.desc: "Un viaje sin incidentes."
 POD_anteshuntset.2.critical.failure.effect.desc: "Bueno, eso escaló rápido..."
 POD_anteshuntset.2.critical.failure: "¡Emboscado!"        
 POD_anteshuntset.3.t: "La Cacería: Entrada Ardiente"
 POD_anteshuntset.3.desc: "Llegaste a la Corte de Fuego y ahora debes encontrar de alguna manera la forma de hacer que divulguen la ubicación de Set. La coerción no funcionará, ya que son fanáticos y maestros torturadores de todos modos.\nAsí que eliges la diplomacia. La señora del templo, una encantadora Setita llamada Scyla, te ha dado la bienvenida lo suficiente, impresionada por tu valentía al entrar en la guarida de la serpiente.\nPero ahora, te está preguntando dulcemente por qué no debería matarte aquí y ahora. Estás amenazando a su Dios después de todo..."
 POD_anteshuntset.3.a: "¿Dónde estaría la gracia en eso?"
 POD_anteshuntset.3.effect.success.desc: "Un argumento convincente."
 POD_anteshuntset.3.critical.failure.effect.desc: "No les gusta la gracia..."
 POD_anteshuntset.3.critical.failure: "Decapitado"        
 POD_anteshuntset.4.t: "La Cacería: Primera Prueba"
 POD_anteshuntset.4.desc: "Scyla ha sido complaciente hasta ahora pero no relinquinará la información que necesitas tan fácilmente. Tendrás que soportar algunas 'pruebas amistosas' para ver si eres digno de estar en presencia de Set.\nLa primera es bastante fácil. Scyla te está presentando algunos mortales exquisitos, hábiles en placer a los de tu especie de cualquier manera que tu mente condenada pueda imaginar. Es una trampa obvia, ya que fácilmente podrías perderte en el placer aquí mostrado durante mucho tiempo, pero aún tienes que probar un poco o tu anfitriona se ofenderá..."
 POD_anteshuntset.4.a: "Moderación, moderación..."
 POD_anteshuntset.5.t: "La Cacería: Segunda Prueba"
 POD_anteshuntset.5.desc: "Tu siguiente prueba en la Corte de Fuego será una buena pelea de arena. Los Setitas adoran su sangriento entretenimiento, y no te sorprende ver que las probabilidades están en tu contra.\nTe enfrentan contra una manada de hombres lobo. Son criaturas lamentables para ser honestos, ya que fueron constantemente maltratados por los Setitas. Llevados a una rabia irreflexiva, no te mostrarán piedad en esta lucha a muerte."
 POD_anteshuntset.5.a: "Hombre contra bestia."
 POD_anteshuntset.5.effect.success.desc: "Son liberados de su miseria."
 POD_anteshuntset.5.critical.failure.effect.desc: "Eres liberado de tu miseria."
 POD_anteshuntset.5.critical.failure: "A muerte..."        
 POD_anteshuntset.6.t: "La Cacería: Tercera Prueba"
 POD_anteshuntset.6.desc: "Ahora eres 'invitado' a una partida de ajedrez... con piezas vivientes y tú como uno de los Reyes. No hace falta decir que cualquier pieza perdida es sumariamente eliminada, lo que significa que las apuestas de este amistoso juego son tan altas como puedas imaginar.\nLos lamentos y gritos de las pobres almas escogidas como peones en este juego truculento tampoco te ayudan a concentrarte..."
 POD_anteshuntset.6.a: "Concéntrate en el centro del tablero..."
 POD_anteshuntset.6.effect.success.desc: "¡Jaque mate!"
 POD_anteshuntset.6.critical.failure.effect.desc: "Eso no tiene buena pinta..."
 POD_anteshuntset.6.critical.failure: "¡Jaque mate!"        
 POD_anteshuntset.7.t: "La Cacería: Cuarta Prueba"
 POD_anteshuntset.7.desc: "Has sido escoltado a la entrada del subterráneo de la Corte de Fuego. Scyla, tu anfitriona, simplemente te ha dicho que debes encontrar la salida para terminar esta prueba.\nEsperabas un laberinto, pero la primera sala subterránea es en realidad una cámara de tortura, donde un Setita [ghoul|E] escuálido está realizando su 'arte' en un sacerdote indefenso. El torturador es lo bastante amistoso, hablando sobre su trabajo y sin hacer movimientos para impedirte continuar. ¿Qué harás en esta situación desconcertante?"
 POD_anteshuntset.7.a: "¿Rescatar al sacerdote?"
 POD_anteshuntset.7.b: "¿Continuar tu camino?"
 POD_anteshuntset.8.t: "La Cacería: Cuarta Prueba II"
 POD_anteshuntset.8.desc: "El subterráneo continúa, y un tipo de aspecto nervioso te espera más adelante. Se presenta como un Tzimisce 'invitado' de la Corte de Fuego y te dice que tu prueba es simple: tienes que soportar sus 'experimentos' en tu cuerpo durante un rato. Entonces, y solo entonces, abrirá la siguiente puerta.\nTe asegura que te dejará en, aproximadamente, el mismo estado en que empezaste. Esto no es exactamente reconfortante, pero parece que no tienes elección en este asunto..."
 POD_anteshuntset.8.a: "Bueno, allá vamos..."
 POD_anteshuntset.9.t: "La Cacería: Cuarta Prueba III"
 POD_anteshuntset.9.desc: "Estás casi acabando con este maldito subterráneo. Un ghoul Setita te espera frente a dos puertas: 'La correcta te llevará al final de la prueba sin nuevos obstáculos. La izquierda será mucho más larga y mucho más difícil, pero también te llevará al final. Elige.'\nEl ghoul no sabe más y solo repite esta frase una y otra vez, dejándote solo frente a esta elección desconcertante."
 POD_anteshuntset.9.b: "¿La derecha? ¿Es eso siquiera una elección?"
 POD_anteshuntset.9.a: "¡La izquierda! ¡Me encanta el dolor y el sufrimiento!"
 POD_anteshuntset.12.t: "La Cacería: El Encanto de Set"
 POD_anteshuntset.12.desc: "Has terminado las pruebas, y Scyla te da la bienvenida con los brazos abiertos. Eres agasajado con un suntuoso banquete y todo el templo canta tus alabanzas. Scyla está lujosamente recostada a tu lado, hablándote sobre la grandeza de Set todo el rato, y la insensatez de tu búsqueda para cazar a un Dios benévolo como él.\n...Y solo puedes estar de acuerdo, este asunto de las pruebas reveló la verdadera naturaleza de tu alma. Quizás tomaste las decisiones equivocadas por el camino, o quizás ya estabas corrompido desde el principio, pero eres incapaz de resistir el encanto de los Setitas. Son tus hermanos y hermanas en la fe ahora."
 antesetcorrupted: "Tu búsqueda termina aquí."
 POD_anteshuntset.12.a: "¡Alabado sea Set!"
 POD_anteshuntset.11.t: "La Cacería: Fuerte de Voluntad"
 POD_anteshuntset.11.desc: "Has terminado las pruebas, y Scyla te da la bienvenida con los brazos abiertos. Eres agasajado con un suntuoso banquete y todo el templo canta tus alabanzas. Scyla está lujosamente recostada a tu lado, hablándote sobre la grandeza de Set todo el rato, y la insensatez de tu búsqueda para cazar a un Dios benévolo como él.\nPero eres fuerte, y logras desviar su intento de seducirte para su causa. Sin otras opciones, Scyla finalmente revela una pieza de información que podría ayudarte. El cuerpo de Set está protegido por una cábala llamada la Espiral del León. Si los encuentras, estarás mucho más cerca de tu objetivo."
 POD_anteshuntset.11.a: "Casi allí..."
 POD_anteshuntset.13.t: "La Cacería: Encontrando la Espiral"
 POD_anteshuntset.13.desc: "Localizar la Espiral del León no es exactamente un proceso fácil. Ahora que al menos tienes un nombre, sin embargo, puedes empezar a trabajar en esta pista.\nTienes dos opciones, contratar gente para buscar a lo largo y ancho o hacerlo tú mismo. Ambas serán costosas de una forma u otra, pero debe hacerse. Estás demasiado cerca de Set para rendirte ahora."
 POD_anteshuntset.13.a: "¡Encuéntralos!"
 POD_anteshuntset.13.b: "Si quieres un trabajo bien hecho..."
 POD_anteshuntset.14.t: "La Cacería: Domando a los Leones"
 POD_anteshuntset.14.desc: "Has encontrado la Espiral del León. Se mueven constantemente por Egipto, con el sarcófago de Set a cuestas. Lograste conocer su ruta y planeaste una emboscada.\nSerá ciertamente una batalla feroz, ya que es poco probable que los propios protectores de Set sean presa fácil. Das la orden de lanzar el asalto, tu mirada derivando al centro de la caravana donde tu premio yace tan cerca al alcance de la mano..."
 POD_anteshuntset.14.a: "Voy a por ti..."
 POD_anteshuntset.14.effect.success.desc: "¡Están acabados!"
 POD_anteshuntset.14.critical.failure.effect.desc: "Yo estoy acabado..."
 POD_anteshuntset.14.critical.failure: "Tan cerca..."        
 POD_anteshuntset.16.t: "La Cacería: El Campeón"
 POD_anteshuntset.16.desc: "La Espiral del León yace derrotada, con solo un superviviente entre tú y el sarcófago de Set... pero no 'solo' un superviviente. Has oído historias de este así llamado Campeón de Set. Qufur am-Heru, escogido de generación en generación para erigirse como guardaespaldas del propio Set, es probablemente el Setita más poderoso que aún camina sobre la Tierra.\nEl propósito de toda su vida es detener a gente como tú de amenazar a su Dios y parece más que ansioso por cumplirlo... El último obstáculo en tu camino podría ser el más difícil."
 POD_anteshuntset.16.a: "Bailemos..."
 POD_anteshuntset.16.effect.success.desc: "¡El campeón cae!"
 POD_anteshuntset.16.critical.failure.effect.desc: "¡Maldito seas!"
 POD_anteshuntset.16.critical.failure: "Tan cerca..."        
 POD_anteshuntset.17.t: "La Cacería: Horror Primordial"
 POD_anteshuntset.17.desc: "Ante ti yace el cuerpo de un hombre con la cabeza de una bestia innombrable, desnudo salvo por un simple taparrabos. Te asalta un miedo que hace que incluso el Miedo Rojo parezca insignificante.\nNo puedes moverte y estás seguro de que vas a encontrar la Muerte Definitiva, seguro de que esto es Set, y de que el [Glossary('Antediluviano','game_concept_antediluvian_desc')] saciará su sed con tu sangre.\nCon todas tus fuerzas, saltas hacia adelante y comienzas a beber de la $pod_vitae$ de la criatura aletargada.\nTu mente estalla."
 POD_anteshuntset.17.a: "¡Debo resistir!"
 POD_anteshuntset.17.effect.success.desc: "Solo un poco más..."
 POD_anteshuntset.17.critical.failure.effect.desc: "...¿Dónde estoy?"
 POD_anteshuntset.18.t: "La Cacería: Victoria"
 POD_anteshuntset.18.desc: "Recuerdas un recuerdo distante de poder, poder inimaginable, surgiendo a través de ti, y de un rugido tremendo que ahogó toda otra sensación. Sabes, también, que hubo dolor, como si el sol mismo te hubiera tragado. Tu cuerpo tiembla inconscientemente con un terror tan absoluto que hasta esta noche todos tus otros miedos han perdido su dominio sobre ti.\nPero lo lograste. Ahora eres uno de, si no el más poderoso vampiro activo. Tu juego es ahora el juego de los Dioses."
 POD_anteshuntset.18.a: "La victoria sabe dulce"
 POD_anteshuntset.19.t: "La Cacería: ¿Victoria?"
 POD_anteshuntset.19.desc: "Recuerdas un recuerdo distante de poder, poder inimaginable, surgiendo a través de ti, y de un rugido tremendo que ahogó toda otra sensación. Sabes, también, que hubo dolor, como si el sol mismo te hubiera tragado. Tu cuerpo tiembla inconscientemente con un terror tan absoluto que hasta esta noche todos tus otros miedos han perdido su dominio sobre ti.\nEn lo que respecta a todos, lo lograste; mataste a un [Glossary('Antediluviano','game_concept_antediluvian_desc')], pero no puedes quitarte la persistente sensación de que algo siempre estará mal..."
 POD_anteshuntset.19.a: "Una victoria no obstante."
 POD_anteshuntabsi.1.d: "Cazaré al Dios de Egipto, Set."
 POD_anteshunttzimisce.1.t: "La Cacería: Rastreando al Anciano"
 POD_anteshunttzimisce.1.desc: "El Anciano, o Tzimisce como es más comúnmente conocido, tiene muchas historias a su nombre. Esto debería ayudar a tu búsqueda, pero esto también envuelve su ubicación actual en bastante misterio. Como tal, un primer paso importante será estudiar esos rumores y medias verdades para formar una historia coherente. Quizás entonces seas capaz de rastrearlo."
 POD_anteshunttzimisce.1.a: "Paga a algunos Nodistas para que lo hagan."
 POD_anteshunttzimisce.1.b: "Lo haré yo mismo." 
 POD_anteshunttzimisce.1.effect.success.desc: "Eso tiene sentido."
 POD_anteshunttzimisce.1.critical.failure.effect.desc: "¡Eso no tiene ningún sentido!"
 POD_anteshunttzimisce.3.t: "La Cacería: Resultados Contradictorios"
 POD_anteshunttzimisce.3.desc: "Es muy difícil dar sentido a todos los rumores que rodean a Tzimisce y estás atascado. Necesitarás buena ayuda, experimentada, si quieres continuar. Esto supone un golpe a tu ego ya que querías al principio hacerlo tú mismo, pero ¿qué es un pequeño golpe a tu orgullo cuando el poder supremo yace al final de este viaje?"
 POD_anteshunttzimisce.3.a: "¡Encuéntrame a los mejores Nodistas!"
 POD_anteshunttzimisce.3.b: "Abandonemos toda esta locura." 
 antetzimisce_continue: "Tu búsqueda continuará." 
 antetzimisce_end: "Tu búsqueda terminará aquí." 
 POD_anteshunttzimisce.2.t: "La Cacería: La Historia de Samiel"
 POD_anteshunttzimisce.2.desc: "Según tus fuentes, estás de pie en el lugar donde el gran Guerrero Salubri Samiel luchó contra Tzimisce hace eras. No está claro si Samiel fue engañado y pensó que estaba luchando contra infernalistas Baali, o si el Anciano era ciertamente su objetivo.\nEn cualquier caso, Samiel nunca salió de aquí, y el propio Tzimisce apenas sobrevivió también. Ahora tienes que adentrarte más en esta ominosa red de túneles si quieres encontrar la siguiente pieza del rompecabezas."
 POD_anteshunttzimisce.2.a: "No tengo miedo de la oscuridad."
 POD_anteshunttzimisce.2.effect.success.desc: "¡Encontrado!"
 POD_anteshunttzimisce.2.critical.failure.effect.desc: "Estoy perdido..."
 POD_anteshunttzimisce.2.critical.failure: "Aún buscando..."
 POD_anteshunttzimisce.4.t: "La Cacería: La Historia de Damek"
 POD_anteshunttzimisce.4.desc: "Ahora estás en las ruinas de Sarmizegetusa, la antigua capital de Dacia. Más precisamente, estás en lo que queda del castillo de Damek Ruthven, de quien sospechas que fue el cuidador del cuerpo en recuperación de Tzimisce después de su batalla con Samiel.\nNo queda mucho aquí, pero encuentras que el sótano sigue siendo accesible. Después de una larga búsqueda, te topas con los restos secos de lo que podría haber sido un árbol hace mucho tiempo. Esta es una pista interesante que tendrás que descifrar, pero tus ojos son atraídos por lo que parece una manzana todavía jugosa caída del árbol..."
 POD_anteshunttzimisce.4.a: "¿Qué hace esto aquí?"
 POD_anteshunttzimisce.4.effect.success.desc: "Demasiado peligroso."
 POD_anteshunttzimisce.4.critical.failure.effect.desc: "¡Apetitoso!"
 POD_anteshunttzimisce.4.critical.failure: "Tragado entero"
 POD_anteshunttzimisce.5.t: "La Cacería: La Historia de Ilias"
 POD_anteshunttzimisce.5.desc: "Después de su recuperación en el castillo de Damek, parece que el Anciano tomó forma de nuevo, esta vez invadiendo el cuerpo de un Tzimisce más joven. Con esta información, rastreaste el paradero de esta pobre alma y surgió un nombre: el Monasterio de Sernog.\nSin embargo, antes de ir allí, necesitarás hacer algunos preparativos serios, como reclutar un equipo capaz de manejar los horrores que probablemente custodian a tu presa."
 POD_anteshunttzimisce.5.a: "El dinero no es problema."
 POD_anteshunttzimisce.5.b: "¡Esto se está volviendo demasiado costoso!"
 POD_anteshunttzimisce.6.t: "La Cacería: Un Trato con el Diablo"
 POD_anteshunttzimisce.6.desc: "Durante tu investigación sobre Tzimisce, un nombre surgió a menudo: Kupala. Este 'demonio', aparentemente fusionado con la misma tierra de Transilvania, ha sido un enemigo del Anciano durante mucho tiempo. Como tal, no es una gran sorpresa cuando, una noche, una figura velada viene a ti y te ofrece la bendición de su amo si la deseas.\nEl demonio te está observando, y te ayudará si lo necesitas en las pruebas venideras. Ahora tienes un poderoso aliado... pero ten cuidado de abusar de su generosidad."
 POD_anteshunttzimisce.6.a: "La ayuda siempre es bienvenida... supongo."
 antetzimisce_kupala: "Serás capaz de recurrir a la ayuda de Kupala para el resto de esta búsqueda."
 POD_anteshunttzimisce.7.t: "La Cacería: La Historia de Lambach"
 POD_anteshunttzimisce.7.desc: "Un tipo extraño te está siguiendo desde que empezaste a preparar tu ataque a Sernog. Este Lambach Ruthven no parece amenazante, todo lo contrario, ya que aparece como un lastimero cascarón de vampiro plagado de desvaríos dementes.\nA pesar de no ser un Malkavian profético, algunos de tu séquito piensan que podría estar conectado a Tzimisce de alguna manera y, como tal, es una amenaza para tu plan. Te cuesta imaginar a este pobre despojo de hombre siendo un problema para nadie pero las apariencias pueden ser engañosas..."
 POD_anteshunttzimisce.7.a: "Puede acompañarnos."
 POD_anteshunttzimisce.7.b: "¡Echa a este desdichado de mi vista!"
 POD_anteshunttzimisce.8.t: "La Cacería: Preparativos"
 POD_anteshunttzimisce.8.desc: "Para tomar Sernog, necesitarás un ejército. O al menos suficientes cuerpos para lanzar contra los horrores que probablemente defienden el lugar. Por suerte, los Anarquistas son la solución perfecta. Son numerosos, ansiosos por derribar a un [Glossary('Antediluviano','game_concept_antediluvian_desc')], y nadie les echará realmente de menos.\nComo tal, estás negociando con su grupo local más grande para convencerles de que se unan a ti. Sin embargo, esto no está yendo muy bien, ya que quieren 'concesiones' y la garantía de no ser usados en el plan de algún Anciano. No tienes ninguna de las dos, así que tendrás que convencerles por las malas antes de que esto escale más."
 POD_anteshunttzimisce.8.a: "¡Dejad de gritar y escuchad!"
 POD_anteshunttzimisce.8.effect.success.desc: "¡Aceptan!"
 POD_anteshunttzimisce.8.critical.failure.effect.desc: "Escala..."
 POD_anteshunttzimisce.8.critical.failure: "Muerte por Pelea"
 POD_anteshunttzimisce.9.t: "La Cacería: Fuera de Sernog"
 POD_anteshunttzimisce.9.desc: "Finalmente llegaste al Monasterio de Sernog. La estructura se asienta en lo alto de una cresta por encima del límite del bosque. La fortaleza abandonada se alza amenazadoramente, sus ennegrecidas murallas formando un oscuro esqueleto contra el cielo, una cáscara de edificio abierta a las estrellas. Adjunta a la fortaleza hay una antigua catedral, ostensiblemente en mejores condiciones pero no menos siniestra que su edificio compañero.\nY eras esperado. Un pequeño ejército de jinetes negros te está esperando justo antes de las escaleras. No puedes distinguir bien sus rasgos desde tan lejos, pero probablemente sean alguna raza especial de [Glossary('Revenants','game_concept_revenant_desc')] defendiendo la fortaleza. El conflicto es inevitable."
 POD_anteshunttzimisce.9.a: "¡Cargad!"
 POD_anteshunttzimisce.9.effect.success.desc: "¡Victoria!"
 POD_anteshunttzimisce.9.critical.failure.effect.desc: "Abrumado..."
 POD_anteshunttzimisce.9.critical.failure: "Pisoteado hasta la Muerte"
 POD_anteshunttzimisce.10.t: "La Cacería: Las Escaleras"
 POD_anteshunttzimisce.10.desc: "Debería haber 1236 escalones rotos y serpenteantes hasta el monasterio según tu investigación. Entonces, ¿por qué sientes que ya has subido el doble de ese número? No tienes todo el tiempo del mundo y empiezas a sospechar juego sucio, quizás una ilusión mágica de algún tipo, o algo más siniestro.\nTienes que encontrar una solución, o simplemente subirás esta cosa hasta que salga el Sol, y eso serían malas noticias."
 POD_anteshunttzimisce.10.a: "Debe haber un patrón..."
 POD_anteshunttzimisce.10.b: "¡Kupala! ¡Disipa esta magia!"
 rely_on_kupala: "Recurres a Kupala para superar este obstáculo"
 POD_anteshunttzimisce.10.effect.success.desc: "La ilusión es disipada"
 POD_anteshunttzimisce.10.critical.failure.effect.desc: "Sin final a la vista..."
 POD_anteshunttzimisce.10.critical.failure: "Aún Escalando..."
 POD_anteshunttzimisce.11.t: "La Cacería: La Entrada de Sernog"
 POD_anteshunttzimisce.11.desc: "El interior de la catedral refleja una atmósfera de oscuro presagio. La arquitectura parece tallada desde la imaginación febril de algún diseñador loco. Grotescas tallas de seres que podrían ser ángeles pero semejan demonios miran con furia a aquellos que pasan a través del arco en la entrada del antiguo santuario. El aire dentro de la catedral tiene un olor mohoso y empalagoso, como si algo eternamente agonizante se hubiera incrustado dentro de las piedras y ahora exudara su esencia en un miasma de perpetua decadencia.\nDe alguna manera, este hedor fétido también es peligroso para los $pod_cainites$, ya que empiezas a toser violentamente. Será mejor que encuentres la fuente rápidamente antes de verte abrumado por ella."
 POD_anteshunttzimisce.11.a: "Sigue el hedor..."
 POD_anteshunttzimisce.11.b: "¡Kupala! ¿Adónde debo ir?"
 POD_anteshunttzimisce.11.effect.success.desc: "Quemas la pila de cuerpos que está causando esto"
 POD_anteshunttzimisce.11.critical.failure.effect.desc: "Estás perdido en los corredores..."
 POD_anteshunttzimisce.11.critical.failure: "Perdido y Apestoso"
 POD_anteshunttzimisce.12.t: "La Cacería: La Cámara Central"
 POD_anteshunttzimisce.12.desc: "Sonidos de gemidos espeluznantes llenan la cavernosa cámara central, haciendo eco en las altas vigas abovedadas y reverberando en una cacofonía de gritos estridentes que imitan los clamores de víctimas sometidas a las agonías de una tortura prolongada y exquisita.\nHay una trampilla oculta bajo el altar de la iglesia. Tallada en el entablado de madera del suelo, la puerta se abre tirando hacia arriba de su anilla de hierro. Una estrecha y oscura escalera conduce hacia abajo, a la cripta de la catedral y, con suerte, al final de tu búsqueda."
 POD_anteshunttzimisce.12.a: "No tengo miedo... creo."
 POD_anteshunttzimisce.13.t: "La Cacería: La Cripta de Sernog"
 POD_anteshunttzimisce.13.desc: "Estás cerca. Puedes sentirlo. Allí, en el centro de esta cripta, puedes vislumbrar un sarcófago, esperanzadoramente el de Tzimisce. Tristemente, hay un pequeño ejército de criaturas sirvientes en tu camino. Puedes reconocer algunos Vozhd y Szlachta en él, pero también algunos otros horrores de varias formas y tamaños.\nNo tienes miedo de los monstruos, pero esta será una batalla terrible aun así. Estos son constructos de guerra sin mente empeñados en proteger este lugar."
 POD_anteshunttzimisce.13.a: "¡A las armas!"
 POD_anteshunttzimisce.13.b: "¡Kupala! ¡Préstame tu poder!"
 POD_anteshunttzimisce.13.effect.success.desc: "¡Tan cerca!"
 POD_anteshunttzimisce.13.critical.failure.effect.desc: "...pero tan lejos."
 POD_anteshunttzimisce.13.critical.failure: "Hackeado en Pedazos"
 POD_anteshunttzimisce.15.t: "La Cacería: Victoria..."
 POD_anteshunttzimisce.15.desc: "Al acercarte al sarcófago para reclamar tu premio, Lambach, que te ha estado siguiendo todo el tiempo, suelta un gemido aterrorizado. Sorprendido, te detienes en tu movimiento... justo a tiempo para evitar ser empalado por un pilar de carne proveniente del malformado cadáver interior.\nSin dejar que el no tan aletargado [Glossary('Antediluviano','game_concept_antediluvian_desc')] se recupere, hundes tus colmillos en lo que debería ser su cuello, preguntándote ociosamente si Lambach te salvó a propósito o por pura suerte. En cualquier caso, lo lograste, el poder de la 3ª Generación ahora fluye a través de ti.\nEres más fuerte que nunca pero... ¿por qué sigues sintiendo una verdadera sensación de pavor entonces?"
 POD_anteshunttzimisce.15.a: "Algo anda mal..."
 POD_anteshunttzimisce.16.t: "La Cacería: ¿Victoria?..."
 POD_anteshunttzimisce.16.desc: "Al acercarte al sarcófago para reclamar tu premio, un pilar de carne proveniente del no tan aletargado cadáver interior te empala a través del pecho. Apenas consciente y mayormente conducido por tu Bestia, te apresuras a hundir tus colmillos en lo que debería ser el cuello de esta criatura malformada. El resto de los eventos suceden en una ráfaga de imágenes y sonidos apenas legibles.\nAl final, sigues vivo, y más poderoso que antes. Tampoco queda nada en el sarcófago. Aun así... sientes que algo anda mal como si alguien te hubiera estado observando todo el tiempo y estuviera a punto de hacer su movimiento..."
 POD_anteshunttzimisce.16.a: "Algo anda mal..."
 POD_anteshunttzimisce.18.t: "La Cacería: El Demonio"
 POD_anteshunttzimisce.18.desc: "Mientras dejas Sernog en victoria, eres detenido por una figura solitaria esperándote en la base del largo tramo de escaleras del Monasterio. Sus rasgos indistintos, no obstante le reconoces por lo que es: Kupala, el Demonio de Transilvania y némesis de Tzimisce.\nHiciste bien tu parte al ayudarle, pero aún hay un remanente del Anciano en ti, y Kupala no puede permitir eso. Es hora de probar tus nuevos poderes."
 POD_anteshunttzimisce.18.a: "La batalla final..."
 POD_anteshunttzimisce.18.effect.success.desc: "Un Demonio derrotado"
 POD_anteshunttzimisce.18.victory: "¡Una Victoria Definitiva!"
 POD_anteshunttzimisce.18.critical.failure.effect.desc: "Superado"
 POD_anteshunttzimisce.18.critical.failure: "Enviado al Infierno"
 POD_anteshunttzimisce.19.t: "La Cacería: El Demonio"
 POD_anteshunttzimisce.19.desc: "Mientras dejas Sernog en victoria, eres detenido por una figura solitaria esperándote en la base del largo tramo de escaleras del Monasterio. Sus rasgos indistintos, no obstante le reconoces por lo que es: Kupala, el Demonio de Transilvania y némesis de Tzimisce.\nHiciste bien tu parte al ayudarle, pero aún hay un remanente del Anciano en ti, y Kupala no puede permitir eso. Puedes sentir la atracción que el Demonio tiene sobre tu alma por cada vez que pediste ayuda volviendo para atormentarte ya que le hace más fuerte. Es hora de probar tus nuevos poderes y esperar que sean suficientes."
 POD_anteshunttzimisce.19.a: "La batalla final..."
 endofthequest: "Victoria o muerte, este es el final de esta búsqueda."
 POD_anteshunttzimisce.19.effect.success.desc: "Un Demonio derrotado"
 POD_anteshunttzimisce.19.victory: "¡Una Victoria Definitiva!"
 POD_anteshunttzimisce.19.critical.failure.effect.desc: "Superado"
 POD_anteshunttzimisce.19.critical.failure: "Enviado al Infierno"
 POD_anteshunttzimisce.20.t: "La Cacería: El Demonio"
 POD_anteshunttzimisce.20.desc: "Mientras dejas Sernog en victoria, eres detenido por una figura solitaria esperándote en la base del largo tramo de escaleras del Monasterio. Sus rasgos indistintos, no obstante le reconoces por lo que es: Kupala, el Demonio de Transilvania y némesis de Tzimisce.\nHiciste bien tu parte al ayudarle, pero aún hay un remanente del Anciano en ti, y Kupala no puede permitir eso. Confiaste tanto en él para llegar hasta aquí que no te diste cuenta del coste que tal ayuda tendría. Mientras el Demonio pronuncia algunos nombres arcanos de poder y comienza a desentrañar tu misma alma, ahora lo entiendes. Y es demasiado tarde."
 POD_anteshunttzimisce.20.a: "El diablo recibe su merecido."
 instakillkupala: "Confiaste demasiado en Kupala y pagaste el precio."

 POD_anteshunttzimisce.21.t: "La Cacería: El Cambio Final"
 POD_anteshunttzimisce.21.desc: "Nadie sabe realmente qué es Azhi Dahaka. Incluso tú, en tu estado elevado de ser, tendrías problemas para ponerlo en palabras. Una cosa ha estado en el fondo de tu mente sin embargo, la profunda conexión con el Anciano, Tzimisce, que este poder parece poseer. Has hecho a un lado los rumores de que Azhi Dahaka es una estratagema del progenitor para ganar control sobre múltiples cuerpos pero ahora, mientras dejas el Monasterio de Sernog en (aparente) triunfo, estás reconsiderando esta postura.\n\nTu forma física se sacude violentamente mientras sientes tu cuerpo pasar por cambios involuntarios en una rápida sucesión. Apenas logras evitar un colapso completo antes de remodelarte en algo más familiar. Para tu horror sin embargo, ves que algunos grumos viscosos desprendidos de tu propia carne durante el estallido inicial han comenzado a reformarse en monstruosidades en constante cambio.\nTienes la inquietante sensación de que buscan más 'absorberte' que matarte directamente. Pero como no estás de humor para aceptar ninguno de los dos resultados, te preparas para una pelea difícil."
 POD_anteshunttzimisce.21.a: "¿Es Tzi...? No, necesito concentrarme."
 POD_anteshunttzimisce.21.effect.success.desc: "Una victoria inquietante"
 POD_anteshunttzimisce.21.critical.failure.effect.desc: "¿Parte de un todo mayor?"

 POD_anteshunttzimisce.22.t: "La Cacería: El Merecimiento del Diablo"
 POD_anteshunttzimisce.22.desc: "Cuando finalmente alcanzas alguna forma de estabilidad (relativa) tras tu victoria, tienes la sensación de ser observado una vez más. Esta vez sin embargo, el observador hace clara su presencia (al menos en tu mente). Kupala ha estado observando y ayudando a tu progreso durante esta aventura para su propio propósito y ahora está considerando el siguiente paso.\n\nDesconfías de un potencial ataque del demonio pero puedes sentir un ápice de satisfacción proveniente de él, especialmente después de tu último combate. No estás exactamente seguro de por qué pero parece que Kupala quiere continuar fomentando una relación de trabajo contigo.\nComo prueba de esto y quizás un atisbo de lo que podría ser si cooperarais aún más en el futuro, algunos de los secretos del Vinculado a la Tierra te son revelados.\n\nParece que finalmente puedes dejar el Monasterio de Sernog muy atrás, con mucho más poder pero quizás más preguntas nuevas que respuestas."
 POD_anteshunttzimisce.22.a: "El futuro es cambio, después de todo."
 POD_anteshunttzimisce.22.tooltip: "Has recibido algo del poder de Kupala para ti mismo.\nObtienes el Estilo de Vida completo #T Saber de la Creación#!"

 POD_anteshuntabsi.1.e: "Cazaré al Anciano, Tzimisce."
  





 POD_anteshunttremere.1.t: "La Cacería: Localizando a Tremere"
 POD_anteshunttremere.1.desc: "Como un $pod_clan$ asediado desde su creación, los Tremere tienen varias fortalezas alrededor de Europa que sirven como cuarteles generales, o a veces refugios de retirada. Es razonable pensar que el propio Tremere podría estar dentro de una de esas fortalezas o, al menos, podrían contener pistas sobre su escondite actual.\nCeoris, la temida capilla de Transilvania, será tu primera investigación."
 POD_anteshunttremere.1.a: "No espero una cálida bienvenida."
 POD_anteshunttremere.2.t: "La Cacería: Ceoris"
 POD_anteshunttremere.2.desc: "A pesar del absurdo número de asedios que ha soportado, Ceoris sigue en manos Tremere. Esta impresionante torre, velada en brumas mágicas, es realmente una fortaleza inexpugnable... al menos para un ejército. Incluso los Tremere necesitan beber sangre y reponer sus diversas reservas de vez en cuando, lo que significa que hay algo de movimiento entrando y saliendo hacia las aldeas cercanas.\nEsta es quizás tu única oportunidad de infiltrar a alguien dentro pero, obviamente, los Tremere tienen un serio proceso de selección que será difícil de superar. Este podría ser tu primer paso hacia la localización del propio Tremere."
 POD_anteshunttremere.2.effect.success.desc: "Consigues algo de ello."
 cluetremere_tt: "Una pista para encontrar a Tremere."
 POD_anteshunttremere.2.critical.failure: "¡Maldecido!"
 POD_anteshunttremere.2.critical.failure.effect.desc: "¡Contraataque mágico!"
 POD_anteshunttremere.6.critical.failure.effect.desc: "¡Contraataque mágico!"
 POD_anteshunttremere.9.critical.failure.effect.desc: "¡Contraataque mágico!"
 POD_anteshunttremere.2.a: "Planifiquemos esto a fondo."
 POD_anteshunttremere.2.b: "¡Ofrece una recompensa por cualquier información!"
 POD_anteshunttremere.2.c: "Esto no funcionará."
 POD_anteshunttremere.3.t: "La Cacería: Ceoris"
 POD_anteshunttremere.3.desc: "Ceoris fue una vez la mayor fortaleza de los Tremere, pero desde entonces ha caído ante fuerzas externas. Aun así, la torre en sí es ahora un monumento legendario en la región, lleno de trampas mágicas y otros horrores que se quedaron atrás cuando los Magus se retiraron.\nMuchos aventureros esperanzados han probado suerte pero la mayoría nunca regresó, una advertencia que consideras cuidadosamente. Tienes tiempo, y muchos sirvientes de sobra, pero Ceoris no debe ser subestimada."
 POD_anteshunttremere.3.a: "Planifiquemos esto a fondo."
 POD_anteshunttremere.3.b: "Simplemente lanza aventureros codiciosos al problema."
 POD_anteshunttremere.3.c: "Esto no funcionará."
 POD_anteshunttremere.6.t: "La Cacería: Lion's Green"
 POD_anteshunttremere.6.desc: "Lion's Green, una pequeña y modesta torre, ha sido el lugar de residencia de Meerlinda desde su llegada a las Islas Británicas. Su naturaleza diplomática brilla incluso contigo, ya que eres recibido con todos los honores debidos a alguien de tu posición.\nLa poderosa consejera seguramente tendrá algunas pistas sobre la ubicación de Tremere pero es conocida como una negociadora feroz y extraer cualquier tipo de información de ella (o sus aprendices) será una tarea difícil. Especialmente si no quieres revelar tu objetivo final durante la conversación, lo que podría hacer las cosas... incómodas."
 POD_anteshunttremere.6.effect.success.desc: "Consigues algo de la conversación."
 POD_anteshunttremere.6.critical.failure: "¡Maldecido!"
 POD_anteshunttremere.6.a: "Hablemos esto con calma."
 POD_anteshunttremere.6.b: "Ofrece muchas concesiones por cualquier migaja de información."
 POD_anteshunttremere.6.c: "Esto es una pérdida de tiempo."
 POD_anteshunttremere.7.t: "La Cacería: Lion's Green"
 POD_anteshunttremere.7.desc: "Antaño la sede de poder de la influyente Meerlinda, Lion's Green ha sido una fortaleza importante para los Tremere. Ahora abandonada, está desprovista de cualquier información útil. Pero la presencia de Meerlinda aún puede sentirse en los alrededores con muchos habitantes teniendo recuerdos (o historias) sobre la hermosa y aparentemente bondadosa erudita solitaria en su torre.\nEsto podría resultar útil, ya que estas historias podrían contener una pista para progresar en tu búsqueda... pero estos aldeanos no hablarán fácilmente, ya que no querrían traicionar a su amada 'Dama Feérica'."
 POD_anteshunttremere.7.a: "Puedo convencerles."
 POD_anteshunttremere.7.b: "Cúbreles de promesas vacías hasta que hablen."
 POD_anteshunttremere.7.c: "Esto es una pérdida de tiempo."
 drained_troops_modifier: "Ejército Agotado"
 drained_troops_modifier_desc: "Todas tus fuerzas militares están agotadas en este momento."
 POD_anteshunttremere.9.t: "La Cacería: Viena"
 POD_anteshunttremere.9.desc: "Si Ceoris era la fortaleza avanzada de los Tremere, Viena era su verdadero centro político. Fortificada durante siglos en preparación para la caída de Ceoris como respaldo, la Capilla de Viena podría ser uno de los refugios mejor defendidos que existen. Hay una fuerte posibilidad de que el propio Tremere esté aquí pero... necesitas estar seguro.\nA nadie se le permite entrar aquí sin una investigación exhaustiva, y los Tremere no negociarán. Necesitas liderar (o al menos enviar) una poderosa fuerza militar para un ataque relámpago, esperando distraer a los Usurpadores lo suficiente para que puedas aprender los secretos de la Capilla y de la ubicación de Tremere."
 POD_anteshunttremere.9.effect.success.desc: "¡Un éxito rotundo!"
 POD_anteshunttremere.9.critical.failure: "¡Maldecido!"
 POD_anteshunttremere.9.a: "Revisemos el plan una vez más."
 POD_anteshunttremere.9.b: "¡Simplemente lánzalo todo a este lugar!"
 POD_anteshunttremere.9.c: "Será demasiado costoso."
 POD_anteshunttremere.10.t: "La Cacería: Viena"
 POD_anteshunttremere.10.desc: "La Capilla de Viena era el plan de respaldo de los Tremere en caso de la caída de Ceoris. Como tal, fue fortificada y atrapada con rituales mágicos hasta el límite. Los Tremere ya no están en la zona ahora pero sus contrapartidas mortales, la Orden de Hermes, se han instalado y tomado la capilla fortaleza como propia.\nSi quieres asaltar el lugar y hacerte con lo que sea que los Tremere dejaron atrás, tendrás que organizar una fuerza de asalto muy sólida para sorprender a los magos. Una vez que estén distraídos por tu asalto, podrías ser capaz de reunir alguna pista importante sobre la ubicación de Tremere desde el interior."
 POD_anteshunttremere.10.a: "Revisemos el plan una vez más."
 POD_anteshunttremere.10.b: "¡Simplemente lánzalo todo a este lugar!"
 POD_anteshunttremere.10.c: "Será demasiado costoso."
 POD_anteshunttremere.11.t: "La Cacería: La Ubicación de Tremere"
 POD_anteshunttremere.11.desc: "Ahora has reunido todo lo que pudiste sobre la ubicación actual de Tremere. Es hora de analizar todo lo que tienes y concluir si es suficiente o no.\nPodrías hacer un último esfuerzo desesperado (y costoso) si estás cerca del premio final pero no del todo. En cualquier caso, será entonces hora de pasar a la parte verdaderamente peligrosa de tu búsqueda..."
 POD_anteshunttremere.11.a: "¡Tengo más que suficiente, avancemos!"
 POD_anteshunttremere.11.b: "Solo un poco más..."
 POD_anteshunttremere.11.c: "Tremere me elude..."
 POD_anteshunttremere.11.d: "Paremos esta misión descabellada antes de que sea demasiado tarde."
 POD_anteshunttremere.12.t: "La Cacería: El Asalto"
 POD_anteshunttremere.12.desc: "Ya no hay vuelta atrás. Sabes dónde se esconde el cuerpo aletargado de Tremere y has reunido todo lo que pudiste para lanzar un asalto a gran escala contra las formidables defensas. La Pirámide no relinquinará a su venerado fundador sin una lucha infernal y estás decidido a dársela.\nPuedes sentir tu premio esperándote en las profundidades de la fortaleza, justo más allá de todos esos molestos magus y sus trampas... ¡Tan cerca!"
 POD_anteshunttremere.12.a: "¡Cargad!"
 POD_anteshunttremere.12.effect.success.desc: "¡Victoria! ¡Avanzamos hacia el interior!"
 POD_anteshunttremere.12.critical.failure.effect.desc: "Tan cerca..."
 POD_anteshunttremere.15.t: "La Capilla: El Favorito"
 POD_anteshunttremere.15.desc: "¡No había forma de que Etrius, el favorito de Tremere, no intentara interferir con tus planes! Esperabas que el poderoso Magus te confrontara con hechizos y fuego pero en su lugar... ¡te sorprendes cuando una parte de tu hueste de repente gira sus espadas contra ti!\n¿Fue una traición planeada por su parte? ¿O un resultado de uno de los trucos de los Tremere? No tienes tiempo para meditar esto ya que tu vida está en juego."
 POD_anteshunttremere.15.a: "¡Sin piedad para los traidores!"
 POD_anteshunttremere.15.effect.success.desc: "Los traidores son eliminados. Continuamos."
 POD_anteshunttremere.15.critical.failure.effect.desc: "Eso fue demasiado inesperado..."
 POD_anteshunttremere.15.critical.failure: "Traicionado..."
 POD_anteshunttremere.14.t: "La Capilla: El Consejo de los Siete"
 POD_anteshunttremere.14.desc: "Tan pronto como tu grupo pone un pie en la Capilla, la mitad de ellos estalla en llamas. Cánticos rituales en una docena de idiomas diferentes pueden oírse y el asalto mágico comienza.\nEres confrontado por todo el poder del Consejo de los Siete. El cuerpo gobernante del $pod_clan$ Tremere te estaba esperando y todos se prepararon para confrontarte y proteger a su fundador.\nTal reunión de poderosos hechiceros de sangre es algo inaudito desde el mismo ritual de creación de los Tremere. Superarlos será una dura prueba, por decir lo mínimo."
 POD_anteshunttremere.14.a: "¡Malditos hechiceros!"
 POD_anteshunttremere.14.effect.success.desc: "Siete menos, uno por venir."
 POD_anteshunttremere.14.critical.failure.effect.desc: "¡Archimagos por todas partes!"
 POD_anteshunttremere.14.critical.failure: "Cenizas a las cenizas..."
 POD_anteshunttremere.16.t: "La Capilla: El Prodigio"
 POD_anteshunttremere.16.desc: "Goratrix es muchas cosas, pero no se le puede acusar de cobarde. El poderoso aprendiz del propio Tremere se planta frente a tu grupo, solo, para poner fin a tu búsqueda.\nEsperaba tu llegada, y puedes ver muchas runas de poder (¿o trampas?) en la sala. Potenciado como tal y absolutamente decidido a detenerte, el 'Portador de Luz' será un adversario formidable."
 POD_anteshunttremere.16.a: "Tu ambición contra la mía."
 POD_anteshunttremere.16.effect.success.desc: "Un digno adversario ha caído."
 POD_anteshunttremere.16.critical.failure.effect.desc: "¿Qué es esa runa? Oh"
 POD_anteshunttremere.16.critical.failure: "Cenizas a las cenizas..."
 POD_anteshunttremere.17.t: "La Capilla: El Pilar"
 POD_anteshunttremere.17.desc: "De repente, una voz imperiosa te dice que te detengas y no tienes más remedio que obedecer. Meerlinda, el corazón diplomático del Consejo de los Siete, aparece y comienza a usar sus formidables poderes de persuasión para controlarte.\nObviamente, está usando su magia para mantenerte pacificado, pero incluso sabiendo ese hecho, es difícil superar su calmante voz potenciada por el poder de la propia Capilla. Uno a uno, está convenciendo a tus aliados de que se maten a sí mismos y ahora se está girando hacia ti..."
 POD_anteshunttremere.17.a: "¡Debo resistir!"
 POD_anteshunttremere.17.effect.success.desc: "¡Apártate, bruja!"
 POD_anteshunttremere.17.critical.failure.effect.desc: "Una voz tan bonita..."
 POD_anteshunttremere.17.critical.failure: "Como digas..."
 POD_anteshunttremere.18.t: "La Capilla: El Explorador"
 POD_anteshunttremere.18.desc: "Estabas bien preparado contra formas convencionales de magia de sangre cuando entraste en la Capilla. Pero al entrar en esta nueva sala, no esperabas ver a este hombre imponente cubierto de extraños tatuajes cantando en un extraño idioma extranjero.\nXavier de Cincao, el miembro más joven del Consejo de los Siete, siempre ha sido aficionado a formas de magia extrañas y esotéricas, lo que podría resultar ser tu perdición. Tienes que adaptarte rápidamente en esta lucha, o no habrá lucha en absoluto."
 POD_anteshunttremere.18.a: "¡Debe haber un patrón!"
 POD_anteshunttremere.18.effect.success.desc: "¡Veo tu debilidad!"
 POD_anteshunttremere.18.critical.failure.effect.desc: "¿Qué demonios es esta cosa?"
 POD_anteshunttremere.18.critical.failure: "¡Fuego! ¡Fuego!"
 POD_anteshunttremere.19.t: "La Capilla: La Ira"
 POD_anteshunttremere.19.desc: "'¡Luchad conmigo, cobardes!', Calderon, el guerrero Magus del Consejo de los Siete, aparece. Visiblemente potenciado por un aura mágica, probablemente de la propia Capilla, desenvaina sus dos espadas y parece esperar tu primer movimiento.\nAunque le superas en número, él tiene la preparación de su lado y su reputación como un poderoso luchador mejorado por su magia de batalla es bien merecida. Tienes una difícil lucha frontal entre manos."
 POD_anteshunttremere.19.a: "Un mago de batalla ¿eh? Qué sofisticado."
 POD_anteshunttremere.19.effect.success.desc: "Fuerte, pero no lo suficiente."
 POD_anteshunttremere.19.critical.failure.effect.desc: "¿Bolas de fuego y espadas? ¡Eso es trampa!"
 POD_anteshunttremere.19.critical.failure: "Una muerte honorable..."
 POD_anteshunttremere.20.t: "La Capilla: El Diligente"
 POD_anteshunttremere.20.desc: "Llevas horas dando vueltas en círculos. Te ha llevado mucho tiempo entenderlo, pero debe estar activo un hechizo que oculta el verdadero camino hacia Tremere. A este ritmo, perderás tu preciosa sangre y te quedarás sin tiempo antes de encontrarlo.\nEste podría ser el plan de LeDuc, un consejero famoso por sus experimentos en ilusiones y similares. Este conocimiento podría ayudarte a encontrar una salida, pero no te queda mucho tiempo."
 POD_anteshunttremere.20.a: "Debemos encontrar un camino."
 POD_anteshunttremere.20.effect.success.desc: "¡Una salida! Por fin."
 POD_anteshunttremere.20.critical.failure.effect.desc: "Odio los laberintos..."
 POD_anteshunttremere.20.critical.failure: "Sin salida..."
 POD_anteshunttremere.21.t: "La Capilla: El Mentor"
 POD_anteshunttremere.21.desc: "Debes estar cerca ya que los Tremere parecen cada vez más desesperados. Ahora están lanzando todo lo que aún tienen contra ti, desde aprendices hasta Gárgolas a medio formar. Este ejército improvisado no debería ser un gran problema pero su puro número podría causarte problemas.\nEn el fondo de la biblioteca convertida en campo de batalla, puedes divisar a un hombre, probablemente un consejero, dirigiendo más y más 'reclutas' al combate. Si pudieras deshacerte de él, eso podría contener la marea..."
 POD_anteshunttremere.21.a: "¡Concéntrate en este!"
 POD_anteshunttremere.21.effect.success.desc: "Todos muertos. Seguimos adelante."
 POD_anteshunttremere.21.critical.failure.effect.desc: "¡Siguen viniendo!"
 POD_anteshunttremere.21.critical.failure: "Demasiados..."
 POD_anteshunttremere.22.t: "La Capilla: ¿El Fin?"
 POD_anteshunttremere.22.desc: "Las defensas interiores de la Capilla están por fin rotas y, en un sótano algo anodino, yace el propio Tremere. El gran hechicero se agita en su cama de roble elaboradamente tallada como si tuviera una pesadilla. De vez en cuando, sus brazos se retraen en su torso o nuevos ojos burbujean como bubones en su frente, solo para estallar en una erupción de pus y vapores cáusticos.\nA pesar de este estado preocupante, no ofrece ninguna resistencia a tu $pod_diablerie$ y pronto queda reducido a cenizas en tus manos.\n¿Acabas de convertirte en un [Glossary('Antediluviano','game_concept_antediluvian_desc')]? De alguna manera, se siente un poco anticlimático..."
 POD_anteshunttremere.22.a: "Algo no cuadra..."
 tremere_reborn_modifier: "Tremere Renacido"
 tremere_reborn_modifier_desc: "El alma de Tremere ha tomado el control de este cuerpo, dejando al poderoso magus libre para vagar por este mundo una vez más."
 POD_anteshunttremere.23.t: "La Capilla: La Toma de Control de Tremere"
 POD_anteshunttremere.23.desc: "Visiones de grandeza aparecen en tu mente, de un pasado que no es el tuyo. Nunca fuiste un joven y ambicioso mago buscando una cura para tu inmortalidad menguante. Nunca creaste tu propio $pod_clan$ vampírico antes de cazar a los propios [Glossary('Antediluvianos','game_concept_antediluvian_desc')].\nUna voz resuena de repente en tu cabeza '¡Luché contra Dioses intentando tomar mi cuerpo. Controlarte a ti será fácil!'"
 POD_anteshunttremere.23.a: "¡Puedo resistir!"
 POD_anteshunttremere.23.b: "¡¿Qué está pasando?!"
 tremerewins_tt: "...y la risa de Tremere puede oírse proveniente de tu... su cuerpo."
 POD_anteshunttremere.24.t: "La Capilla: El Plan de Reserva de Tremere"
 POD_anteshunttremere.24.desc: "Lograste superar el alma de Tremere pero, demasiado enfrascado en esta batalla mental, no has notado a Etrius escabulléndose de nuevo detrás de ti. Aparentemente lleva un pequeño espejo y, antes de que puedas realmente darte cuenta, ves el alma de Tremere precipitándose en el voluntarioso Etrius.\nAlgo más le ocurrió al espejo, pero no tienes tiempo que perder meditando esta cuestión, Etrius/Tremere se está lanzando contra ti súbitamente potenciado por las extraordinarias habilidades del propio fundador del $pod_clan$ Tremere. Esta no será una lucha fácil."
 POD_anteshunttremere.24.a: "¡Tremere muere ahora!"
 POD_anteshunttremere.24.effect.success.desc: "Y el último muerde el polvo."
 POD_anteshunttremere.24.critical.failure.effect.desc: "¿Qué? ¡No!"
 POD_anteshunttremere.24.critical.failure: "Malditos seáis todos..."
 saulot_reborn_modifier: "Saulot Renacido"
 saulot_reborn_modifier_desc: "El alma de Saulot ha tomado el control de este cuerpo, dejando a la enigmática figura libre para vagar por este mundo una vez más."
 POD_anteshunttremere.25.t: "La Capilla: La Toma de Control de Saulot"
 POD_anteshunttremere.25.desc: "Con Tremere eliminado, pensaste que estabas listo para irte y finalmente libre para disfrutar de las recompensas de tu búsqueda.\nEstabas equivocado.\nTan pronto como el alma de Tremere es destruida, sientes de repente otro tirón, tu cuerpo comienza a cambiar, ojos enfermizos apareciendo por todo tu ser. Tu mente se llena de visiones de un gran plan, de un destino que cumplir y de la salvación potencial para todos los $pod_cainites$... pero tienes que rendirte y ser sacrificado. Lo quieras o no."
 POD_anteshunttremere.25.a: "¡Fuera de mi mente!"
 POD_anteshunttremere.25.b: "¡¿Otra vez?!"
 saulotwins_tt: "...y Saulot se aleja caminando, ya calculando su próximo movimiento en el Gran Juego."
 tzimisce_reborn_modifier: "Tzimisce Renacido"
 tzimisce_reborn_modifier_desc: "El alma de Tzimisce ha tomado el control de este cuerpo, dejando al aterrador monstruo libre para vagar por este mundo una vez más."
 POD_anteshunttremere.26.t: "La Capilla: La Toma de Control de Tzimisce"
 POD_anteshunttremere.26.desc: "¿Cuántas almas había en el cuerpo de Tremere? Saulot claramente no era el último intentando tomar el control ya que tu cuerpo ha comenzado a mutar incontrolablemente, fusionando extremidades y haciéndote caer mientras te ves forzado a arrastrarte. A este ritmo, pronto no parecerás ni remotamente humano.\nPuedes sentir tu mente siendo atacada también, pensamientos de pertenecer a un 'todo mayor' apoderándose de ti de repente. Incluso más allá de los intentos de toma de control de Tremere y Saulot, este ataque es aún más terrible e incluso abiertamente alienígena en su forma..."
 POD_anteshunttremere.26.a: "¡No me rendiré!"
 POD_anteshunttremere.26.b: "...¿somos todos uno?"
 tzimiscewins_tt: "...y Tzimisce se aleja caminando, deseando ya reunirse con sus otros yo."
 POD_anteshunttremere.27.t: "La Cacería: Victoria"
 POD_anteshunttremere.27.desc: "Finalmente, tras una búsqueda terrible, puedes reclamar la victoria. Has domado (por ahora) las almas de Tremere, Saulot y Tzimisce para completar tu toma de control. Puedes sentir el poder del [Glossary('Antediluviano','game_concept_antediluvian_desc')] corriendo por tu sangre, listo para obedecerte. Aun así, este inmenso potencial es difícil de dominar y no serás capaz de hacerlo completamente durante mucho tiempo, una debilidad que podría ser explotada por tus enemigos u otros oportunistas.\nPase lo que pase sin embargo, ahora eres probablemente la criatura más poderosa activa en este mundo y controlas el respeto y temor debidos a tal hazaña."
 POD_anteshunttremere.27.a: "¡Poder supremo!"
 POD_anteshuntabsi.1.f: "Cazaré al Usurpador, Tremere."  
 
 POD_anteshunttroile.1.t: "La Cacería: Desenterrando el Pasado"
 POD_anteshunttroile.1.desc: "Troile no es un [Glossary('Antediluviano','game_concept_antediluvian_desc')] difícil de encontrar. Es de conocimiento común que está enterrada bajo Cartago, dejada a pudrirse aquí después de su fatídica derrota contra la coalición romana. Esta historia es la premisa de la aún vigente rivalidad Brujah/Ventrue pero carece de algunos detalles cruciales.\n¿Qué hay exactamente bajo Cartago esta noche? ¿Qué clase de defensas protegen el lugar? ¿Está Moloch, el amante infernal de Troile, todavía allí? Necesitas respuestas, y harás que otras personas las busquen en tu lugar. Simplemente tropezar en las ruinas de Cartago sería una insensatez, y eres lo bastante viejo para pagar a otros para que sean insensatos en su lugar."
 POD_anteshunttroile.1.a: "Pon una recompensa por información relacionada con Cartago."
 POD_anteshunttroile.1.b: "Puedo usar algunos viejos favores en su lugar."
 POD_anteshunttroile.1.c: "Ya tengo una idea de lo que me espera allí..."
 
 POD_anteshunttroile.2.t: "La Cacería: Plan de Escape"
 POD_anteshunttroile.2.desc: "De los (pocos) aventureros que regresaron de las ruinas de Cartago dedujiste que toda el área está envuelta en una especie de 'bucle temporal' de la noche en que cayó la ciudad. Sirve como una forma de castigo, asegurándose de que los aún vivos defensores de Cartago sean atormentados con su derrota para siempre, y un mecanismo de protección, ya que cualquiera que intente entrar en las ruinas quedará atrapado en el propio bucle.\nComo tal, es de importancia crucial que pienses en algún plan de escape. Troile probablemente está dentro de esa área así que tendrás que entrar en el bucle temporal, encontrarla, diablerizarla y luego escapar de alguna manera. Algo de conocimiento sobre magia de sangre o temporal parece un prerrequisito para siquiera tener una oportunidad de frustrar un ritual tan poderoso."
 POD_anteshunttroile.2.a: "Sé desenvolverme con la magia. Estaré bien."
 POD_anteshunttroile.2.b: "Conozco fuentes fiables para encontrar una solución."
 POD_anteshunttroile.2.c: "Esto es una locura, debería rendirme."
 given_up_troile_hunt_tt: "Careces de las habilidades mínimas para escapar del bucle temporal. Troile está fuera de tu alcance pero se te traerá de vuelta a la elección de otros [Glossary('Antediluvianos','game_concept_antediluvian_desc')] para potencialmente consumir."

 POD_anteshunttroile.3.t: "La Cacería: Historias de Veteranos"
 POD_anteshunttroile.3.desc: "Ahora que has solidificado un plan de escape, necesitas entender lo que realmente ocurrió la noche que Cartago cayó para encontrar una manera de manipular el bucle temporal a tu favor. Obviamente, este fue un evento bastante trascendental pero incluso los participantes reales de la batalla no tenían el panorama completo en su momento. Como tal, tendrás que preguntar a todos aquellos que estuvieron verdaderamente allí sobre su versión de la historia.\nSolo esperas que suficientes de ellos sigan activos y dispuestos a hablar para que puedas entender verdaderamente en qué te estarás metiendo."
 POD_anteshunttroile.3.a: "Dando sentido a un mito."
 camilla_insights_tt: "Camilla, el Príncipe de Roma, compartió su historia contigo."
 lysander_insights_tt: "Lisandro, general de Roma, compartió su historia contigo."
 alchias_insights_tt: "Alchias, el Príncipe de Siracusa, compartió su historia contigo."
 eshmunazar_insights_tt: "Eshmunazar, el rebelde Haqimita, compartió su historia contigo."
 dominic_insights_tt: "Dominic, general de Cartago, compartió su historia contigo."
 cybele_insights_tt: "Cibeles, Perdición de Moloch, compartió su historia contigo."
 menele_insights_tt: "Menele, diplomático de Cartago, compartió su historia contigo."
 helena_insights_tt: "Helena, traidora de Cartago, compartió su historia contigo."
 tryphosa_insights_tt: "Tryphosa, vidente de Roma, compartió su historia contigo."
 zamra_insights_tt: "Zamra, Vástago de Cartago, compartió su historia contigo."
 ecaterina_insights_tt: "Ecaterina, presunta superviviente, compartió su historia contigo."
 
 POD_anteshunttroile.4.t: "La Caída: La Última Noche de Cartago"
 POD_anteshunttroile.4.desc: "Con todos los preparativos completos, has viajado a las ruinas de Cartago y audazmente te has adentrado hacia el bucle temporal. Sin previo aviso, te encuentras viendo la gran ciudad en el horizonte, llamas ardiendo del asedio en curso. Parece que has aparecido dentro del campamento principal romano lo que te presenta una primera oportunidad para manipular el tiempo a tu favor.\nQuieres a Troile lo más débil posible para poder consumirla y, como tal, necesitas ayudar a los romanos a ganar más decisivamente de lo que históricamente lo hicieron. Los generales romanos están revisando su plan pero tú sabes lo que ocurrirá: Camilla, el Príncipe de Roma, se quedará atrás para llegar más tarde con refuerzos. Un ataque sorpresa de los Banu Haqim de Eshmunazar sobre el campamento principal lo retrasará sin embargo, y los refuerzos nunca llegarán antes de que la batalla termine.\nSi pudieras persuadir a Camilla del peligro inminente, podría prepararse mejor para ello y esperanzadoramente todavía llegar a tiempo para ayudar contra Troile más tarde durante la noche."
 POD_anteshunttroile.4.a: "¡Tengo noticias importantes para el Cónsul Eterno!"
 POD_anteshunttroile.4.effect.success.desc: "Camilla presta atención a tu advertencia."
 POD_anteshunttroile.4.critical.failure: "El tiempo sigue su curso fatídico."
 
 POD_anteshunttroile.5.t: "La Caída: La Última Carga de la Diosa de la Guerra"
 POD_anteshunttroile.5.desc: "El asalto a las murallas de Cartago ha comenzado y puedes ver a Artemis Orthia, la intrépida chiquilla del propio Ventrue, liderando la carga. Sabes cómo termina, con las murallas rotas y un camino despejado pero la propia Artemis destrozada por el puro número de defensores y los romanos quedándose sin su mejor guerrera.\nEsta es una oportunidad para salvarla, pero esto significaría cargar de frente junto a ella. Si la Diosa de los Espartanos, la guerrera más hábil de los Ventrue, no pudo sobrevivir... ¿cuáles son tus posibilidades? Por otro lado, tener la lanza de Artemis cubriendo tu espalda durante el asalto final contra Troile sería un tremendo activo."
 POD_anteshunttroile.5.a: "¡Por Roma!"
 POD_anteshunttroile.5.effect.success.desc: "¡Artemis está ensangrentada, pero viva!"
 POD_anteshunttroile.5.critical.failure: "Cartago se mantiene fuerte..."
 POD_anteshunttroile.5.b: "Esto es demasiado arriesgado, déjala morir."
 
 POD_anteshunttroile.6.t: "La Caída: El Enfrentamiento de los Maestros de Guerra"
 POD_anteshunttroile.6.desc: "El ejército de Roma está ahora dentro de Cartago. Les sigues cuidadosamente, tratando de evitar ser arrastrado por la marea de frenesí y derramamiento de sangre. Luchar en las calles de la ciudad es un asunto terrible, que favorece en gran medida al defensor. Sabes que Lisandro, el general de Roma, triunfará finalmente sobre Dominic, su contrapartida cartaginesa, pero tomará demasiado tiempo, forzando a Camilla y los otros a usar su plan de respaldo de evitar a Troile, algo que no puedes permitir que ocurra.\nPodrías ofrecer tu ayuda a Lisandro, ayudándole a coordinar el vasto campo de batalla lo mejor que puedas. Esto sin duda pondría una diana en tu espalda, y Dominic haría todo lo posible por detenerte. ¿Haría que mantenerse alejado de esta refriega por completo fuera una elección más sabia?"
 POD_anteshunttroile.6.a: "Legatus, puedo ayudar con la coordinación del ejército."
 POD_anteshunttroile.6.effect.success.desc: "¡Victoria Romana Decisiva!"
 POD_anteshunttroile.6.critical.failure: "Superado en astucia..."
 POD_anteshunttroile.6.b: "Esto es demasiado arriesgado, deja que choquen por su cuenta."
  
 POD_anteshunttroile.7.t: "La Caída: Los Cálculos de Alchias"
 POD_anteshunttroile.7.desc: "Mientras estabas ocupado con el asalto a la ciudad en sí, sabes que una parte crítica de la noche está teniendo lugar justo fuera de las murallas ahora mismo. Alchias, el Príncipe Malkavian de Siracusa, es una parte importante del esfuerzo de guerra ya que sus poderosos poderes mentales ayudan a coordinar los diversos grupos romanos mejor de lo que cualquier sistema de mensajeros podría. Él está siendo emboscado por agentes Baali sin embargo y sabes que su destino final es un largo letargo y un súbito desorden en las líneas romanas.\nLlegas demasiado tarde para salvar al propio Alchias pero aún podrías intentar salvar la organización del ejército ya que sabes que pronto comenzará a desmoronarse. Eso ciertamente mejoraría las probabilidades de los romanos."
 POD_anteshunttroile.7.a: "¡Quiero informes del frente, ahora!"
 POD_anteshunttroile.7.effect.success.desc: "Los romanos permanecen unidos."
 
 POD_anteshunttroile.8.t: "La Caída: El Demonio Romano"
 POD_anteshunttroile.8.desc: "Cibeles es el as en la manga de los romanos. Esta poderosa Baali Nergalita está aquí para matar a Moloch, el amante de Troile, y ella será en última instancia quien los atrape a ambos bajo Cartago cuando la batalla se vuelva amarga para sus aliados. Esto no es algo que quieras que ocurra. Por suerte, tampoco es algo que la propia Cibeles quiera que ocurra, ya que preferiría mucho más quemar a Moloch ella misma que simplemente atraparlo.\nLa Nergalita tiene muchos rituales preparados para debilitar a Moloch pero pocos contra la propia Troile, ya que no se preocupa mucho por ella. Si eres lo bastante sutil, podrías intentar convencerla de redirigir algunos de sus hechizos contra tu verdadero objetivo. Esto es arriesgado sin embargo, ya que se sabe que la poderosa hechicera Baali tiene un genio terrible con los entrometidos..."
 POD_anteshunttroile.8.a: "Esto ayudaría a las causas de ambos."
 POD_anteshunttroile.8.effect.success.desc: "Cibeles acepta."
 POD_anteshunttroile.8.critical.failure: "Sujeto de pruebas involuntario para un hechizo..."
 POD_anteshunttroile.8.b: "Esto es demasiado arriesgado, déjala hacer lo suyo."

 POD_anteshunttroile.10.t: "La Caída: Tiempo Inmutable"
 POD_anteshunttroile.10.desc: "A pesar de tus esfuerzos, el bucle temporal está procediendo como históricamente ocurrió. Los romanos están demasiado debilitados por el asalto para atreverse a desafiar a Troile y Moloch y, como tal, Cibeles está preparando su plan de respaldo de atraparlos bajo la ciudad con un poderoso ritual.\nEn este punto, cargar tú solo hacia Troile sería absoluta locura y en su lugar tienes que preparar rápidamente tu plan de escape. El bucle temporal pronto se reiniciará y notará que hay un intruso en él. Realmente no quieres estar aquí cuando eso ocurra.\nAunque no sea una victoria, aún lograste sobrevivir a toda esta aventura. No es una pequeña hazaña considerando las circunstancias."
 POD_anteshunttroile.10.a: "Podría haber terminado mejor. O mucho peor."

 POD_anteshunttroile.11.t: "El Fin del Tiempo: Troile y Moloch"
 POD_anteshunttroile.11.desc: "Lo lograste. Tus esfuerzos consiguieron ayudar al ejército romano lo suficiente como para que estén siguiendo su plan primario: matar a Troile y Moloch. Mientras les sigues hacia el centro de la ciudad sin embargo, puedes ver la realidad misma resquebrajándose a tu alrededor ya que el bucle temporal ha comenzado a notar tu interferencia. El tiempo se agota.\nTroile y Moloch te esperan al frente de su palacio, ya bañados en sangre romana y aparentemente despreocupados por el rumbo de la batalla volviéndose contra ellos. Antes de que puedas siquiera levantar un dedo, Troile ha hecho un movimiento imperceptible de su muñeca, resultando en que su legendaria espada de cristal cercena una gran parte de tu ejército sin que tú siquiera lo notes.\nTe enfrentas a un verdadero [Glossary('Antediluviano','game_concept_antediluvian_desc')], la mayor maestra de la Celeridad, y de repente te das cuenta de cuán lastimosas son tus probabilidades a pesar de tus mejores esfuerzos hasta ahora..."
 POD_anteshunttroile.11.a: "Todo esto fue una idea terrible..."
 POD_anteshunttroile.11.effect.success.desc: "Mantienes el tipo por ahora..."
 POD_anteshunttroile.11.critical.failure: "Parpadeo. Estás muerto."
    
 POD_anteshunttroile.12.t: "El Fin del Tiempo: La Batalla"
 POD_anteshunttroile.12.desc: "Troile está jugando contigo. Incluso sin la ayuda de Moloch, parece más que rival para todas tus fuerzas combinadas. Hasta ahora has logrado mantener la cabeza sobre los hombros pero no es el caso para todos los que te rodean. Necesitas dejar de estar a la defensiva y realmente hacerla retroceder de alguna manera si quieres salir de aquí con vida."
 POD_anteshunttroile.12.desc.b: "\nMientras preparabas tu próximo movimiento, se oye un poderoso grito de guerra y Artemis Orthia salta lanza en ristre hacia la cabeza de Troile. Sorprendida, la Antediluviana debe realmente defenderse por una vez mientras el choque de lanza contra espada se oye de repente mientras las dos poderosas guerreras chocan a una velocidad borrosa. Aunque Artemis ciertamente no durará mucho, esta podría ser tu apertura."
 POD_anteshunttroile.12.a: "Puedo hacerlo..."
 POD_anteshunttroile.12.effect.success.desc: "Un golpe de refilón a Troile."
     
 POD_anteshunttroile.13.t: "El Fin del Tiempo: Los Refuerzos de Cartago"
 POD_anteshunttroile.13.desc: "Mientras ya apenas aguantas contra Troile y Moloch, de repente notas que has sido flanqueado por los últimos defensores restantes de Cartago. No serían una amenaza individualmente, pero en las circunstancias actuales podrían ser más que suficientes para acabar contigo para siempre. Necesitas reagrupar a tus tropas contra ellos."
 POD_anteshunttroile.13.desc.b: "\nPor suerte, el incondicional Lisandro también ha notado este problema y ya ha comenzado a organizar una defensa apresurada. Trabajando ambos juntos, podríais salir de este aprieto."
 POD_anteshunttroile.13.a: "¡Reagrupaos! ¡Reagrupaos!"
 POD_anteshunttroile.13.effect.success.desc: "Son eliminados."
          
 POD_anteshunttroile.14.t: "El Fin del Tiempo: Moloch"
 POD_anteshunttroile.14.desc: "Troile es una adversaria aterradora, pero su amante Moloch está lejos de ser un enemigo débil también. El poderoso Matusalén Baali de 4ª generación es un maestro de la magia, a menudo del tipo bastante oscuro, y no es tímido en usarla brutalmente contra tus compañeros. Si quieres centrarte realmente en Troile, tendrás que silenciar a Moloch para siempre, lo que implica sobrevivir a su ataque mágico..."
 POD_anteshunttroile.14.desc.b: "\nCibeles está demostrando ser una aliada útil en esta empresa. La Baali Nergalita está luchando sin restricciones contra su rival y, aunque no es rival para él por sí misma, es más que suficiente para distraerlo y esperanzadoramente darte una apertura para tu propio ataque."
 POD_anteshunttroile.14.a: "¡Muere, infernalista!"
 POD_anteshunttroile.14.effect.success.desc: "Uno menos. Queda uno."
               
 POD_anteshunttroile.15.t: "El Fin del Tiempo: Exhibición Vergonzosa"
 POD_anteshunttroile.15.desc: "Tus hombres están flaqueando. Incluso el soldado romano más robusto se vería sacudido hasta la médula viendo la aterradora exhibición de poder mostrada por Troile. A medida que la batalla se alarga, algunos han comenzado a huir, abriendo brechas en tu línea defensiva que Troile se apresura a explotar. Debes reagrupar a tus asediados compañeros antes de que no quede nada que reagrupar en absoluto."
 POD_anteshunttroile.15.desc.b: "\nTu experiencia en el manejo de las órdenes de las tropas tras la caída de Alchias te ha dado una buena ventaja en saber cómo animar a estos soldados. Eso será útil."
 POD_anteshunttroile.15.effect.success.desc: "¡Nos mantenemos firmes!"
 POD_anteshunttroile.15.b: "Solo concéntrate en mi propia lucha."            
 
 POD_anteshunttroile.16.t: "El Fin del Tiempo: Acercándose"
 POD_anteshunttroile.16.desc: "Troile está empezando a mostrar algunos pequeños signos de debilidad. Tu incesante asalto, ayudado por tus compañeros, ha hecho mella en sus reservas de sangre y está siendo más conservadora con sus movimientos, aunque aún igual de letal. Si pudieras organizar a tus fuerzas restantes en un último ataque coordinado, eso podría ser la clave..."
 POD_anteshunttroile.16.desc.b: "\nSe oyen gritos desde detrás de tu retaguardia cuando divisas al Cónsul Eterno Camilla llegando finalmente con sus refuerzos. El ensangrentado y maltratado Ventrue sigue siendo un espectáculo agradable para la vista, y sus disciplinadas tropas pronto se unen a ti para cercar a Troile."
 POD_anteshunttroile.16.effect.success.desc: "¡Venceremos!"
 POD_anteshunttroile.16.a: "¡Roma Invicta!" 
 POD_anteshunttroile.16.b: "Necesito un pequeño descanso. Deja que los demás se encarguen de esto por ahora."            
  
 POD_anteshunttroile.17.t: "El Fin del Tiempo: ¿La Caída de Troile?"
 POD_anteshunttroile.17.desc: "Esto es ahora o nunca. Troile está sola, debilitada por la prolongada lucha. Tú y tus compañeros no estáis en mucha mejor forma pero aún seguís en pie. Puedes sentir el bucle temporal comenzando a contraatacar con más fuerza, tratando de corregir la paradoja que creaste, lo que significa que no tienes mucho tiempo antes de que se desate el infierno sobre ti.\nTroile una vez más prepara su mortífera espada y puedes ver una sonrisa letal asomando tras su rostro ensangrentado. Aquí y ahora, rodeado por la ardiente Cartago, es donde yace tu destino."
 POD_anteshunttroile.17.effect.success.desc: "¿Victoria?"
 POD_anteshunttroile.17.a: "Puedo hacerlo..." 
   
 POD_anteshunttroile.18.t: "El Fin del Tiempo: Victoria"
 POD_anteshunttroile.18.desc: "La lucha termina en un borrón. Troile arrodillándose, finalmente lo bastante debilitada por la batalla como para que puedas acercarte a ella. La realidad misma rompiéndose mientras el hechizo defensivo intenta impedirte interferir. Tus compañeros romanos aproximándose para el golpe final pero ralentizados por el vórtice desatado por el bucle temporal rompiéndose.\nTus colmillos en el cuello de Troile.\nLa sensación de poder incalculable corriendo a través de ti y dicha completa hasta que una rápida chispa de lucidez te recuerda usar tu plan de escape para huir de la escena antes de que sea demasiado tarde.\nEmerges a las actuales, verdaderas, ruinas de Cartago. El bucle temporal se ha ido, ya que no queda nada que proteger aquí. Cartago está en silencio una vez más.\nY mientras te alejas, los fantasmas del pasado se arremolinan dentro de ti, haciéndote más poderoso de lo que jamás soñaste."
 POD_anteshunttroile.18.a: "Derroté al tiempo mismo." 
 POD_anteshuntabsi.1.g: "Hay otras posibilidades..." 
 POD_anteshuntabsi.100.a: "Cazaré a Troile, la Reina de Cartago."
 
 POD_anteshuntyamakings.1.desc: "A pesar de lo que pueda ocurrir en el resto del mundo sobrenatural, los [Glossary('Reyes Yama','podgloss.yamaking')] aún continúan su lucha por el trono del [Glossary('Emperador Demonio','podgloss.demonemperor')]. Los más poderosos entre ellos rara vez, si acaso, pisan el reino mortal ya que son mucho más poderosos (y por tanto están a salvo de sus rivales) en sus personales [UmbraGlossaryLocalized('yomi_wan','Infiernos Yomi')]. Aun así, incluso ellos no son invencibles.\n\nEventos pasados han demostrado que pueden ser derribados. Para sus rivales, es la mejor manera de eliminar a un competidor por el trono mientras que para otros sobrenaturales se trata simplemente de ganar un valioso retraso en el inevitable (?) ascenso del [Glossary('Emperador Demonio','podgloss.demonemperor')].\n\nCon los ojos del mundo vueltos hacia el caos provocado por la caída de las Cortes, el cambio de las eras y el avance de los [Glossary('Anda','podgloss.anda')], esta podría ser una de tus mejores oportunidades para pillar a una de estas entidades divinas al menos un poco desprevenida...\n\n #R Estas cacerías usan una puntuación llamada Fuerza Militar. Esta puntuación comienza mirando tu destreza y la de tus campeones. Será aumentada o disminuida durante la cacería misma.\n¡Tu Fuerza Militar inicial es [GetPlayer.MakeScope.GetVariable('character_ykhunt_force').GetValue|0]#!"
 POD_anteshuntyamakings.1.a: "[Glossary('Emma-o','podgloss.emmao')] es la mayor amenaza."
 POD_anteshuntyamakings.1.c: "El ascenso de [Glossary('Dokhor-khan','podgloss.dokhorkhan')] debe ser detenido."
 POD_anteshuntyamakings.1.d: "[Glossary('Tou Mu','podgloss.toumu')] debe encontrar la derrota." 
 POD_anteshuntyamakings.1.e: "Rangda está festejando con nuestra ruina." 
 POD_anteshuntyamakings.1.f: "Ravana debe ser abatido mientras está debilitado."  
 yk_emmao_start_hunt_tt: "¡La Fuerza Militar de [Glossary('Emma-o','podgloss.emmao')] se estima en #V 2500#!"
 yk_dokhorkhan_start_hunt_tt: "¡La Fuerza Militar de [Glossary('Dokhor-khan','podgloss.dokhorkhan')] se estima en #V 2000#!"
 yk_toumu_start_hunt_tt: "¡La Fuerza Militar de [Glossary('Tou Mu','podgloss.toumu')] se estima en #V 1700#!"
 yk_rangda_start_hunt_tt: "¡La Fuerza Militar de Rangda se estima en #V 1500#!"
 yk_ravana_start_hunt_tt: "¡La Fuerza Militar de Ravana se estima en #V 1300#!"

