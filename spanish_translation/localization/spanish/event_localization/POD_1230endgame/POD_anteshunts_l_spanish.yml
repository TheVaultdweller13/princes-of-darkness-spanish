 POD_anteshuntyamakings_military_strength_dokhorkhan: "#clickable Tu Fuerza Militar actual es [GetPlayer.MakeScope.GetVariable('character_ykhunt_force').GetValue|V0]\nLa Fuerza Militar de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] se estima en [GetPlayer.MakeScope.GetVariable('yamaking_ykhunt_force').GetValue|V0]#!"
