 POD_anteshuntyamakings.50.t: "Hermanos en el Odio"
 POD_anteshuntyamakings.50.desc: "$POD_anteshuntyamakings_military_strength_ravana$\n\nRavana es un misterioso [Glossary('Rey Yama','podgloss.yamaking')]. Encargado del dominio de la guerra, siempre ha estado más presente en India que en el resto de Asia. Su ascenso fue rápido y se le consideraba ampliamente el contendiente más poderoso al trono del [Glossary('Emperador Demonio','podgloss.demonemperor')]. Quién es realmente (o fue) está sujeto a debate sin embargo.\n\nMuchos $pod_kueijin$ piensan que es el progenitor de los $pod_cainites$ Ravnos, lo que no ha hecho más que avivar las llamas del odio entre ellos y los Ravnos. Por su parte, los $pod_cainites$ indios reconocen la existencia de un Ravana pero lo describen como un chiquillo traidor a su amado progenitor.\nDe hecho, a pesar de lo que los $pod_kueijin$ harían creer, algunos de los golpes más fuertes asestados a las fuerzas de Ravana fueron obra de los propios Ravnos.\n\nComo tal, es razonable pensar que tu ataque a Lanka, el reino de Ravana, podría ser reforzado por una alianza con los $pod_cainites$ indios. Los viejos odios son inmortales sin embargo y la Guerra Eterna no se ganó su apodo por nada. Convencer a estos obstinados y amargados enemigos de trabajar contigo sería toda una hazaña."
 POD_anteshuntyamakings.50.desc.b: "\n\nPara hacer las cosas más difíciles, Chandraputra, el General Eterno de los Ravnos, sigue siendo el líder indiscutible de su $pod_clan$. Tener a un maestro de la guerra tan estimado de tu lado sería una bendición pero el hombre es increíblemente terco y aún más improbable que escuche tu oferta que el resto de sus hermanos."
 POD_anteshuntyamakings.50.a: "El enemigo de mi enemigo..."
 POD_anteshuntyamakings.50.effect.success.desc: "¡Convencido!"
 POD_anteshuntyamakings.50.critical.failure.effect.desc: "Necios obstinados..."
  
 POD_anteshuntyamakings.51.t: "La Perdición de Lanka"
 POD_anteshuntyamakings.51.desc: "$POD_anteshuntyamakings_military_strength_ravana$\n\nComo ya sabes, Ravana fue una vez el más fuerte de los [Glossary('Reyes Yama','podgloss.yamaking')] y el candidato más probable para el trono del [Glossary('Emperador Demonio','podgloss.demonemperor')]. Esto cambió drásticamente cuando el misterioso Hanuman le enseñó una seria lección de humildad.\nCon magistral sigilo, Hanuman se infiltró en Lanka y, usando poderes que le fueron otorgados específicamente para castigar a Ravana, envolvió toda la isla en fuego purificador. La isla gritó, los ministerios del dolor se derrumbaron, y la isla se sacudió en agonía mientras los muros de sus edificios ardían y se desmoronaban. El fuerte desequilibrio Yang de Lanka hizo que quisiera arder, y así lo hizo la mayor parte. Solo el centro de la isla, la tierra bajo el palacio de Ravana y el templo impío donde se hacían sacrificios a la propia isla, aún muestran signos de vida.\n\nQuién es (¿o son?) Hanuman no está claro ya que algunos piensan que es un $pod_kueijin$ mientras que otros apuntan a una extraña raza de cambiaformas Mono. Sea cual sea el caso, la Perdición de Lanka asumió un perfil bajo después de sus hazañas, probablemente tratando de evitar el contraataque vengativo de Ravana. Su conocimiento, o incluso ayuda, sería un tremendo activo para tu causa si pudieras encontrarlo."
 POD_anteshuntyamakings.51.desc.b: "\n\nLamentablemente, tus primeras indagaciones parecen mostrar que Hanuman ha sido asesinado, o ha dejado este plano de existencia por completo. Esto es claramente una victoria para Ravana, ya que el [Glossary('Rey Yama','podgloss.yamaking')] puede ahora redirigir sus fuerzas a la propia Lanka en lugar de tratar de encontrar a su némesis.\nPodrías prevenir este aumento de poder usando tus recursos para iniciar una campaña engañando a Ravana haciéndole pensar que Hanuman ha vuelto, retrasando así el retorno de sus fuerzas a su reino."
 POD_anteshuntyamakings.51.a: "¿Dónde está este Rey Mono?"
 POD_anteshuntyamakings.51.effect.success.desc: "¡Te encontré!"
 POD_anteshuntyamakings.51.critical.failure.effect.desc: "Una pérdida de tiempo..."
 POD_anteshuntyamakings.51.b: "¡Hanuman ha vuelto! ¡Creedme!"
 POD_anteshuntyamakings.51.c: "Nos las arreglaremos sin él." 
 
 POD_anteshuntyamakings.52.t: "La Prole del de Muchos Brazos"
 POD_anteshuntyamakings.52.desc: "$POD_anteshuntyamakings_military_strength_ravana$\n\nRavana mora en Lanka, cuya entrada no es difícil de encontrar. Ubicada en la isla de Sri Lanka, esto significa tristemente que está protegida indirectamente por la prole del demente Tzimisce conocido como Kartarirya. Este $pod_cainite$ de impresionante poder personal ha hecho de la isla su hogar durante milenios y su prole la ha estado infestando hasta el punto de asumir el control de ella durante largos períodos de tiempo.\nA los Tzimisce no les importa (o ni siquiera parecen saber) la entrada del reino del [Glossary('Rey Yama','podgloss.yamaking')] en su medio. Tampoco son conocidos por sus contactos amistosos con los forasteros. Esto deja a tu expedición con solo dos opciones. Abrirse paso a la fuerza a través de las filas Tzimisce es factible pero probablemente sería costoso. La otra opción sería ofrecer tal tributo y muestra de humildad que incluso esas criaturas sádicas permitirían el paso seguro a tus tropas."
 POD_anteshuntyamakings.52.desc.b: "\n\nEl propio Kartarirya está activo en este momento, tristemente. Esto significa tristemente que un asalto directo sería más costoso mientras que un tributo necesitaría ser mucho más humillante para complacer al hombre lo bastante codicioso como para haber usurpado el nombre de un dios."
 POD_anteshuntyamakings.52.a: "Nada de parlamentos con monstruos."
 POD_anteshuntyamakings.52.b: "Pedimos humildemente vuestra hospitalidad..."

 POD_anteshuntyamakings.53.t: "La Desolación de Lanka"
 POD_anteshuntyamakings.53.desc: "$POD_anteshuntyamakings_military_strength_ravana$\n\nNo está claro, o es siquiera concebible, al mirar la decadencia y el estancamiento de este dominio, que Lanka fuera una vez uno de los mayores infiernos en Yomi. Hay poco sonido que rompa el silencio perturbador. El aire apesta a humo rancio de fuegos extinguidos mucho tiempo atrás. La sangre que una vez corrió por las calles y cubrió las piedras de los edificios está seca y se desprende en escamas con la brisa.\n\nLanka está carbonizada, sus edificios más grandes destripados por el fuego. Enredaderas espinosas se envuelven alrededor de muros ennegrecidos de hollín como si trataran de derribar las estructuras restantes; hasta ahora, parecen estar haciendo un buen trabajo. La tierra estéril que rodea la ciudad se extiende en la distancia, terminando solo donde se encuentra con el mar de sangre hirviente que rodea la ciudad-isla. No hay noche ni día aquí, ya que el dominio parece atrapado en un perpetuo crepúsculo. El cielo brilla de un rojo sombrío, prometiendo eternamente un amanecer que nunca llega.\n\nEs por esta razón que muchos vienen a Lanka. Algunos que han escapado del [Glossary('Rey Yama','podgloss.yamaking')] o del infierno que los arrastró a Yomi —pero que no pueden escapar de Yomi por completo— encuentran en Lanka un respiro de los tormentos incesantes que de otro modo podrían soportar. Otros usan Lanka como base de operaciones para asaltos desesperados contra el resto de Yomi, y aún otros ven la ciudad como una manera de tomar el poder y ascender al estatus de un [Glossary('Rey Yama','podgloss.yamaking')]. En las últimas décadas, una próspera colonia de refugiados y rufianes ha surgido en Lanka, una que la ciudad tolera por razones propias.\n\nEstas almas perdidas están ansiosas por unirse a una fuerza bien organizada como la tuya. El desafío radica más en asegurarse de que encajen bien en tu orden de batalla ya que cada uno de estos individuos está muy lejos de los guerreros bien entrenados y preparados reunidos a tu alrededor."
 POD_anteshuntyamakings.53.a: "Haced lo que digo."
 POD_anteshuntyamakings.53.effect.success.desc: "¡Bien, marchamos!"
 POD_anteshuntyamakings.53.critical.failure.effect.desc: "¡Dejad de romper filas!"

 yk_hunt_lose_haruman_help_tt: "Hanuman no podrá ayudar más adelante."
 POD_anteshuntyamakings.54.t: "La Ciudad Demoníaca de los Rakshas"
 POD_anteshuntyamakings.54.desc: "$POD_anteshuntyamakings_military_strength_ravana$\n\nEn el centro de la ciudad de tormento yace una de las pocas estructuras en pie que no está enredada en vides. Esta enorme estructura parece estar cubierta con un extraño mosaico blanco, pero en realidad está construida con los dientes arrancados a las víctimas de Lanka. Aquí es donde mora el ejército de Ravana, los Rakshas.\n\nLos Rakshas son todos guerreros poderosos, a menudo cambiaformas terriblemente transformados por la corrupción de Lanka, que asumen la forma de animales en batalla. Los favoritos entre los Rakshas también poseen una serie de otros poderes, a menudo control del fuego o tormentas, haciéndolos enemigos verdaderamente peligrosos. Tampoco son bestias sin mente, y su estrategia de esperar a que tu fuerza entre en su desolado dominio urbano ciertamente muestra su perspicacia táctica.\nEsta no será una batalla fácil."
 POD_anteshuntyamakings.54.desc.b: "\n\nHanuman ha estado siguiendo silenciosamente a tu ejército hasta ahora pero, viendo la fuerza que te espera, se acerca a tu lado para ofrecer una alternativa. El Rey Mono es un conocido embaucador y su reputación entre los Rakshas significa que morirían por atraparlo de verdad.\nUsando esto, se ofrece a provocarlos y distraerlos mientras tu ejército continúa hacia su objetivo."
 POD_anteshuntyamakings.54.a: "¡A la batalla!"
 POD_anteshuntyamakings.54.effect.success.desc: "¡Seguimos adelante!"
 POD_anteshuntyamakings.54.critical.failure.effect.desc: "Una victoria difícil."
 POD_anteshuntyamakings.54.b: "Hora de confiar en el embaucador."
  
 POD_anteshuntyamakings.55.t: "La Fortaleza Demoníaca de Ravana"
 POD_anteshuntyamakings.55.desc: "$POD_anteshuntyamakings_military_strength_ravana$\n\nAunque ha visto tiempos mejores, la fortaleza de Ravana sigue siendo una visión terrible de contemplar. Al igual que Ravana y sus servidores demoníacos, el palacio no puede mantener una forma, fluyendo constantemente de una forma a otra. Los visitantes dicen que el palacio se comporta como una cosa viva, una masa estacionaria de tendón palpitante y carne. Incluso los rakshas que entran y salen del edificio son más tragados o vomitados, que lo que se les permite entrar o salir.\n\nEl edificio en sí lleva cicatrices de los fuegos que arrasaron la ciudad hace mucho tiempo, aunque Ravana ha logrado sanar la mayor parte del daño infligido a su amada ciudadela. No es sorpresa que las defensas del reino sean las más impresionantes allí, con la élite Rakhsa reagrupándose para detener tu avance antes de que puedas acercarte a su señor. En este punto, tienen todas las ventajas, desde la posición defensiva hasta la propia fortaleza tratando de asegurarse de que no puedas acercarte. A menos que emplees tus reservas personales, este será un asalto costoso."
 POD_anteshuntyamakings.55.desc.b: "\n\nThratri, la temida general de los Raksha, lidera personalmente a sus tropas. Su reputación como una potencial futura [Glossary('Reina Yama','podgloss.yamaking')] por derecho propio ya es conocida a lo largo y ancho. Tenerla en el lado opuesto de esta batalla la hará mucho más difícil."
 POD_anteshuntyamakings.55.a: "Algunos de vosotros podéis morir..."
 POD_anteshuntyamakings.55.b: "¡No seremos detenidos mientras nuestro objetivo esté a la vista!"
 
 POD_anteshuntyamakings.56.t: "Ravana, Rajá de los Demonios"
 POD_anteshuntyamakings.56.desc: "$POD_anteshuntyamakings_military_strength_ravana$\n\nEn la fortaleza en ruinas de Lanka puede encontrarse a Ravana, el señor devastado. En un tiempo fue el más temido y poderoso de todos los señores de Yomi de aspecto Yang.\nRavana fue una vez el más arrogante y egoísta de todos los [Glossary('Reyes Yama','podgloss.yamaking')]. Creía verdaderamente que ningún ser podía superarle en poder, intelecto o crueldad. Esta arrogancia lo hizo muy peligroso pero también causó su perdición.\n\nDesde su ruina, Ravana ha experimentado una transformación. Volviéndose taciturno, el miedo a su potencial derrota definitiva ha creado una entidad más sutil y motivada. Su plan maestro, si los rumores son de creer, será de una escala más grandiosa que cualquier cosa jamás intentada por los de su calaña.\n\nRavana es un maestro de las formas infinitas. A diferencia de tantos de sus compañeros [Glossary('Reyes Yama','podgloss.yamaking')], que parecen preferir unas pocas formas selectas, el semblante de Ravana está siempre en flujo. Puede incluso cambiar varias veces en el transcurso de un ataque. Las únicas constantes en todas las formas de Ravana son su monstruosidad y su terrible poder. Cualquiera que subestime al señor Devastado como un enemigo débil sería probado equivocado muy rápidamente, con poco tiempo para lamentar su insensatez."
 POD_anteshuntyamakings.56.desc.b: "\n\nDivisando al solitario guerrero de aspecto de Mono en medio de tus filas, Ravana suelta un aullido furioso mientras carga contra Hanuman. Parece que el amo de Lanka no ha olvidado a quien le trajo la ruina hace tanto tiempo.\nEsta obcecación será ciertamente una bendición para tu bando en esta batalla culminante."
 POD_anteshuntyamakings.56.a: "No hay vuelta atrás."
 POD_anteshuntyamakings.56.effect.success.desc: "Aguantando..."
 POD_anteshuntyamakings.56.critical.failure: "Fuimos unos necios."
 POD_anteshuntyamakings.56.failure: "Aún podemos ganar..."
  
 POD_yk_chandra_add_100_ms_tt: "La presencia de Chandraputra añade un esfuerzo desesperado de 100 de Fuerza Militar a tu causa."
 POD_anteshuntyamakings.57.t: "Ravana, Rajá de los Demonios"
 POD_anteshuntyamakings.57.desc: "$POD_anteshuntyamakings_military_strength_ravana$\n\nEsta es la última batalla, si tu Fuerza Militar es inferior a la de Ravana, tu camino terminará aquí.#!\n\nRavana es un oponente aterrador. Aunque carente de refinamiento, su estilo de batalla es completamente impredecible gracias a su constante cambio de forma. Las únicas constantes de su forma son las cicatrices quemadas en su cuerpo, un remanente de su ruina anterior y una debilidad que todos tratáis de explotar a su máximo potencial.\n\nEl torbellino de colmillos y garras hace esto muy difícil sin embargo y tus maltratadas fuerzas están siendo lentamente rechazadas. ¿Será suficiente tu fuerza restante para resistir más que el Rey de los Raksha? La propia Lanka parece contener el aliento."
 POD_anteshuntyamakings.57.desc.b: "\n\nEl contingente Ravnos de tu ejército tampoco se está conteniendo. Al entrar en la sala, Chandraputra ha mostrado un ápice de sorpresa al notar la forma cambiante de Ravana, quizás inseguro de si realmente es el hermano que una vez conoció. No importa la respuesta, el General Eterno está luchando con toda su considerable fuerza para salir vivo de este Infierno."
 POD_anteshuntyamakings.57.a: "¿Victoria?"
 POD_anteshuntyamakings.57.b: "Tan cerca..."
  
 POD_anteshuntyamakings.58.t: "La Segunda y Última Caída de Lanka"
 POD_anteshuntyamakings.58.desc: "La caída de Ravana es algo anticlimática. Revirtiendo a lo que podría haber sido su forma original de simplemente un hombre de aspecto sencillo, el [Glossary('Rey Yama','podgloss.yamaking')] se desploma al suelo mientras Lanka tiembla a tu alrededor. Con la perdición final del Señor Arruinado, esta parte de Yomi está ahora disponible. Aunque te encantaría reclamarla para tu propio uso, es una propuesta irrazonable. Tan pronto como los otros [Glossary('Reyes Yama','podgloss.yamaking')] oigan de la derrota de su rival, se apresurarán a tomar el control de esta área, esperanzadamente iniciando hostilidades renovadas entre ellos.\n\nLa propia Lanka es una ruina de todos modos, aún más con los Rakshas y Ravana eliminados y por tanto procurará muy poco en términos de recursos para los señores de Yomi.\n\nTus aliados, ya sean de conveniencia o convicción, están preparando su regreso al mundo mortal después de saquear el tesoro de la fortaleza.\n\nEres el último en pie mientras observas el cadáver de Ravana desapareciendo y un silencio inquietante cubriendo la antaño devastada por la guerra Lanka. La carrera por el trono del [Glossary('Emperador Demonio','podgloss.demonemperor')] ha perdido a uno de sus competidores más serios, dejando el horizonte pareciendo un poco menos desesperanzado."
 POD_anteshuntyamakings.58.a: "El Infierno de la Guerra ha encontrado la paz."
 
 POD_anteshuntyamakings.40.t: "Donde los Gusanos Horadan"
 POD_anteshuntyamakings.40.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\nLa Señora de la Pestilencia Rangda gobierna sobre el Infierno de los Gusanos Horadantes. Como una de las más poderosas [Glossary('Reinas Yama','podgloss.yamaking')], su dominio es extenso y cubre un amplio reino en Yomi. Tristemente, Rangda siempre fue también lo bastante sutil como para ofuscar las entradas a su Infierno, lo que presenta el primer obstáculo para tu búsqueda. Necesitas saber dónde ir si quieres hacer algún progreso en esta cacería.\n\nLos rumores apuntan hacia el sudeste asiático como una ubicación potencial pero eso es mucho terreno que cubrir. Y cuanto más tardes... más probable es que Rangda oiga de tus actividades y haga preparativos propios para «darte la bienvenida»."
 POD_anteshuntyamakings.40.a: "Sigue el rastro enfermizo."
 POD_anteshuntyamakings.40.effect.success.desc: "Pegado al Rastro."
 POD_anteshuntyamakings.40.critical.failure.effect.desc: "Una Cacería Fría."
 POD_anteshuntyamakings.40.b: "Lanza dinero al problema."
 
 POD_anteshuntyamakings.41.t: "Un Regalo de Bienvenida"
 POD_anteshuntyamakings.41.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\nRangda ha oído de tu investigación sobre su Infierno y su reacción es tan predecible como potencialmente letal. Llegan informes de que sus temidos portadores de plagas están en movimiento, preparándose para desatar una enfermedad de letalidad incalculable justo en el centro de tu reino.\n\nNo es demasiado tarde para cazar a estos portadores de plagas y detener esta catástrofe antes de que siquiera ocurra. Los demonios de Rangda son numerosos y formidables sin embargo y por tanto tendrías que dirigir algunas de tus fuerzas a esta tarea, sabiendo perfectamente que podrían ser críticas en el asalto final a la [Glossary('Reina Yama','podgloss.yamaking')]..."
 POD_anteshuntyamakings.41.a: "Una pequeña fiebre exagerada."
 POD_anteshuntyamakings.41.b: "Rastréalos. Detenlos."
 
 POD_anteshuntyamakings.42.t: "El Enemigo Enfermizo de mi Enemigo Enfermizo..."
 POD_anteshuntyamakings.42.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\nCon un área de especialización tan vasta como «enfermedades», no es sorpresa que Rangda no sea ni mucho menos la única [Glossary('Reina Yama','podgloss.yamaking')] que ha intentado acaparar este mercado de almas. Muchos señores menores estuvieron una vez en competición por él antes de que Rangda triunfara sobre todos ellos. Mientras la mayoría de ellos son ahora historia olvidada, uno no lo es.\n\nTou Shen, una vez un rival potencial de Rangda, ha perdido más y más de su prestigio y fuerza a medida que la [Glossary('Reina Yama','podgloss.yamaking')] ascendía en poder. No es sorpresa que la hostilidad entre los dos sea casi sin comparación entre los Señores de Yomi. Esto es algo que probablemente puedas explotar.\n\nAlimentando información en los oídos adecuados, podrías asegurarte de que Tou Shen lance su propio ataque sobre Rangda. Esto sería obviamente una gran bendición para debilitar a la Señora de la Pestilencia."
 POD_anteshuntyamakings.42.a: "Dividiendo y conquistando."
 POD_anteshuntyamakings.42.desc.b: "\n\nComo tú mismo estás dedicado al servicio de Tou Shen, principalmente presentar tu plan y pedir ayuda será suficiente para convencer a tu maestro."
 POD_anteshuntyamakings.42.effect.success.desc: "¡Un Nuevo Frente!"
 POD_anteshuntyamakings.42.critical.failure.effect.desc: "Rechazado..."
 POD_anteshuntyamakings.42.b: "Un ataque concertado."
  
 POD_anteshuntyamakings.43.t: "Guerra Biológica"
 POD_anteshuntyamakings.43.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\nA pesar de tus mejores esfuerzos por rastrearlos antes de concluir tus preparativos, uno de los portadores de plagas de Rangda encontró su camino a tu corte. La cepa que portaba ya ha cobrado las vidas de algunos cortesanos menores tuyos. Si se le permite propagarse, miembros más importantes de tu séquito podrían ser sus próximas víctimas.\n\nUna opción para evitar tal destino sería aislarte a ti y a tus cortesanos de mayor confianza. Esto sería visto como un signo de miedo por tus rivales sin embargo. Después de todo, no es porque estés planeando una cacería grandiosa que los juegos políticos habituales se detengan."
 POD_anteshuntyamakings.43.a: "Se extinguirá por sí solo, estoy seguro."
 POD_anteshuntyamakings.43.b: "¡Trancad las puertas!"
  
 POD_anteshuntyamakings.44.t: "El Infierno de los Gusanos Horadantes"
 POD_anteshuntyamakings.44.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\nAl entrar en el Infierno de Rangda, un vistazo rápido revela que este lugar es una vasta llanura de lo que parece ser fina arena blanca. No hay sol, pero el cielo nublado no es particularmente oscuro. Muchos que vienen aquí inicialmente se burlan de la vista, pensando que de alguna manera han burlado al destino o que Yomi no es tan terrible como han oído.\nSolo entonces se dan cuenta de que la arena bajo sus pies está reptando. Otras veces la realidad de la situación se hace evidente cuando un enorme demonio gusano del tamaño de un elefante rompe la arena y arrebata a un intruso.\n\nDespués de unos momentos más, el olor a putrefacción golpea completamente a cualquier viajero, y el hedor de la decadencia hace tambalearse a cualquiera tan desafortunado como para necesitar respirar. El reino entero está lleno de gusanos y otros devoradores de carroña, y no hay tregua en ninguna parte del dominio de la putrefacción y la decadencia.\n\nEste lugar parece interminable y dónde está realmente Rangda está lejos de estar claro. Con las duras condiciones poniendo a prueba tus suministros, tendrás que mantener todo tan bien organizado como sea posible si quieres siquiera encontrar a la Señora de la Pestilencia."
 POD_anteshuntyamakings.44.a: "No molestéis lo que hay bajo las arenas."
 POD_anteshuntyamakings.44.effect.success.desc: "En Buen Orden."
 POD_anteshuntyamakings.44.critical.failure.effect.desc: "Arena por Todas Partes..."
   
 POD_anteshuntyamakings.45.t: "El Foso de Engendramiento"
 POD_anteshuntyamakings.45.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\nCuando un alma en el Infierno de los Gusanos Horadantes está casi consumida o ha demostrado ser digna de servir a Rangda, es llevada al Foso de Engendramiento. El foso mismo palpita con energía Yang corrompida y está agresivamente custodiado por los más grandes servidores de Rangda. Esos sirvientes arrojan el alma elegida al foso, y la parte superior del agujero es sellada.\nDespués de un tiempo, el alma en su interior experimenta una transformación. Las energías corruptoras del foso transforman el cuerpo de la víctima, y el alma emerge como un servidor de Rangda. Algunos se alzan como veneros humanos de plaga y enfermedad, mientras que otros mutan en grandes gusanos y son puestos a trabajar como soldados y capataces en el suave ejército blanco de Rangda.\n\nEsta ubicación siempre ha sido un objetivo clave de tu ataque. Dejar que Rangda tenga un medio para reponer infinitamente su ejército significaría rápidamente tu perdición. Dos maneras de lidiar con este problema fueron propuestas durante tu fase de planificación.\n\nLa primera opción sería intentar desviar a los servidores del Foso. Si estuvieran ocupados persiguiendo a tus exploradores en lugar de engendrar nuevas tropas, el resultado sería placentero.\nLa otra opción es lanzar tus propias reservas para asaltar el Foso. Aunque improbable de detener completamente el proceso, al menos obstaculizaría al ejército de la Señora de la Pestilencia... al coste casi seguro de todas sus vidas."
 POD_anteshuntyamakings.45.a: "Lanzad nuestra distracción."
 POD_anteshuntyamakings.45.effect.success.desc: "Un Resultado Placentero"
 POD_anteshuntyamakings.45.critical.failure.effect.desc: "El Foso Burbujea..."

 POD_anteshuntyamakings.46.t: "La Gran Bestia"
 POD_anteshuntyamakings.46.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\nDentro del Infierno de los Gusanos Horadantes hay una formación que parece ser una gran montaña blanca. Es el hogar de los más grandes y viles de todos los habitantes del reino. A medida que los visitantes se acercan a esta área, comienzan a entender por qué es este el caso. El afloramiento que parece una montaña es en realidad los restos de una criatura de inmenso tamaño que murió en este lugar hace mucho tiempo. Algunos han dicho que la bestia estaba allí antes de la propia Rangda, y que ha estado muerta más tiempo del que el mundo ha vivido.\n\nEn cualquier caso, parece que puede tomar una eternidad devorar completamente al monstruo, y las criaturas que se alimentan de sus restos son sin duda las más grandes y agresivas de los gusanos de este reino. Algunos han alcanzado el tamaño de una ballena azul, mientras que el más pequeño de ellos mide al menos seis pies de largo. Estas criaturas también parecen haber desarrollado un intelecto rudimentario y medios de comunicación, permitiéndoles actuar en sincronía.\n\nEn cierto modo, forman la última línea de defensa de la Señora de la Pestilencia y su más impresionante muestra de fuerza como [Glossary('Reina Yama','podgloss.yamaking')].\nEstas bestias no pueden ser atraídas lejos o engañadas y tendrás que enfrentarlas de frente para forzar a tu verdadero objetivo a mostrarse infligiendo una derrota tajante en el sitio de su mayor victoria."

 POD_anteshuntyamakings.47.t: "La Reina Pestilente"
 POD_anteshuntyamakings.47.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\nRangda es una de las pocas [Glossary('Reinas Yama','podgloss.yamaking')] que rara vez se muestra. Careciendo de la arrogancia de sus hermanos, prefiere trabajar con planes a largo plazo y solo aparece cuando no hay otra opción. Como tal, que tu fuerza finalmente la encuentre es un cumplido de cierta clase.\n\nRangda aparece como una hermosa mujer cubierta de lesiones y llagas supurantes. Su cabello es largo y negro, y su cuerpo está desnudo, salvo por un harapiento taparrabos alrededor de su cintura. Aunque sus rasgos son encantadores, su apariencia asolada por la enfermedad es suficiente para mover a todos menos a los de voluntad más fuerte a una absoluta repulsión.\nLucha con abandono salvaje, careciendo de cualquier sentido de decoro y simplemente saltando y desgarrando al azar con una fuerza salvaje. Cada uno de sus ataques, incluso el golpe de refilón más débil, termina envenenando a su desafortunada víctima con una enfermedad lo bastante fuerte como para derribar incluso a los más poderosos entre vosotros en un instante.\nAunque los números están de vuestro lado, el resultado de esta lucha final está lejos de ser seguro..."
 POD_anteshuntyamakings.47.a: "¡No dejéis que os toque!"
 POD_anteshuntyamakings.47.effect.success.desc: "Casi allí..."
 POD_anteshuntyamakings.47.critical.failure.effect.desc: " #italic Tos Tos #!"
 
 POD_anteshuntyamakings.48.t: "La Reina y Sus Súbditos"
 POD_anteshuntyamakings.48.desc: "$POD_anteshuntyamakings_military_strength_rangda$\n\nEsta batalla trascendental dependerá de si tu maltratado ejército puede o no soportar esta última batalla desesperada."
  
 POD_anteshuntyamakings.49.t: "Sanando el Reino de las Enfermedades"
 POD_anteshuntyamakings.49.desc: "Cuando Rangda finalmente cae, tu ejército sabiamente se aleja tanto como puede. Para sorpresa de nadie, los gritos de muerte de la Señora de la Pestilencia desatan un torrente de enfermedades que no tienes mucho interés en probar. Por suerte, sus últimos momentos también significan que el resto de su ejército se desmorona a su alrededor ya que su relación simbiótica con sus «hijos» no les permitirá vivir sin ella.\n\nEl Infierno mismo no cambia y parece imperturbado por la muerte de su señora. Rangda no fue la primera [Glossary('Señor de Yomi','podgloss.yamaking')] en reclamar las enfermedades como su dominio y no será la última. Es tristemente probable que otro poder se alce y tome el control de esta área más pronto que tarde pero tendrán que empezar desde cero. Con algo de suerte, tomará siglos para que alguien ascienda tan alto como lo hizo Rangda.\n\nEl mundo nunca lo sabrá pero aquí y ahora, en este reino pestilente donde el cuerpo de la [Glossary('Reina Yama','podgloss.yamaking')] se pudre en el suelo, has comprado a la realidad un largo respiro. El ascenso del [Glossary('Emperador Demonio','podgloss.demonemperor')] se ha ralentizado."
 POD_anteshuntyamakings.49.a: "...pero no detenido."

 POD_anteshuntyamakings.30.t: "El Rastro de Hierro"
 POD_anteshuntyamakings.30.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\n[Glossary('Tou Mu','podgloss.toumu')] es ampliamente considerada la más directa de los [Glossary('Señores de Yomi','podgloss.yamaking')]. Hambrienta de batalla, colérica y vengativa, lidera su legión de demonios ella misma cuando llega la guerra, a menudo para atacar a los $pod_kueijin$ que tanto odia.\n\nAun así, eso no la hace estúpida o temeraria. Como una de las más antiguas [Glossary('Reinas Yama','podgloss.yamaking')], [Glossary('Tou Mu','podgloss.toumu')] conoce el valor de mantener sus cartas cerca de su pecho acorazado. Como tal, la entrada a su Infierno de Ser Despellejado Vivo es en realidad desconocida, lo que sirve como el primer obstáculo en tu búsqueda.\n\nActuando rápidamente, podrías intentar localizar dicha entrada antes de que [Glossary('Tou Mu','podgloss.toumu')] se entere de tu intromisión y se prepare. O podrías tomarte tu tiempo y actuar con intermediarios para evitar levantar demasiadas sospechas."
 POD_anteshuntyamakings.30.a: "La sorprenderemos."
 POD_anteshuntyamakings.30.effect.success.desc: "Hecho rápidamente."
 POD_anteshuntyamakings.30.critical.failure.effect.desc: "Fallado rápidamente..."
 POD_anteshuntyamakings.30.b: "No precipitemos las cosas."

 POD_anteshuntyamakings.31.t: "El Puño de Hierro"
 POD_anteshuntyamakings.31.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\n[Glossary('Tou Mu','podgloss.toumu')] ha oído de tu investigación sobre su persona. Parece que la Emperatriz de Hierro, fiel a su reputación, simplemente decidió que el ataque era la mejor defensa. Apareciendo desde un portal crepitante en el mismo centro de tu corte, la monstruosidad acorazada despacha rápidamente a tus aturdidos guardias con un movimiento de sus infames cadenas de hierro.\n\nRápidamente te das cuenta de que esto es «solo» un avatar de la propia [Glossary('Tou Mu','podgloss.toumu')] ya que no dejaría la seguridad de su reino tan fácilmente. Aun así, siendo solo una parte de su poder, este avatar es más fuerte que la mayoría de demonios y [akuma|E] que jamás hayan caminado por el Reino Medio. Si no quieres que tu búsqueda, y tu vida, terminen aquí, tendrás que demostrar que no eres alguien que pueda ser simplemente despachado por una fracción del poder de una [Glossary('Reina Yama','podgloss.yamaking')]."
 POD_anteshuntyamakings.31.a: "No seré derrotado fácilmente."
 POD_anteshuntyamakings.31.effect.success.desc: "¡Desterrado a Yomi!"
 POD_anteshuntyamakings.31.critical.failure.effect.desc: "Fui un necio..."

 POD_anteshuntyamakings.32.t: "La Oferta de Hierro"
 POD_anteshuntyamakings.32.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\nEl avatar de [Glossary('Tou Mu','podgloss.toumu')] retrocede bajo tu embestida. Sintiendo su inminente destierro de vuelta a Yomi, la Emperatriz de Hierro pausa la lucha, mirándote con una nueva mirada, mucho más interesada, que durante vuestra batalla. Aunque no habla, ya que no está verdaderamente aquí, la [Glossary('Reina Yama','podgloss.yamaking')] usa el poder restante de su avatar para crear imágenes en tu cabeza.\nVes el ascenso de [Glossary('Tou Mu','podgloss.toumu')] como la [Glossary('Emperatriz Demonio','podgloss.demonemperor')], aplastando a los otros [Glossary('Reyes Yama','podgloss.yamaking')] bajo su bota acorazada. Ves el reinado de violencia, terror y caos que impondrá sobre el mundo, los pecadores siendo castigados por haber creído neciamente en la misericordia del Cielo.\n\nY te ves a ti mismo a su lado, un apreciado compañero de la Emperatriz, disfrutando del prestigio debido a lo que sería la segunda entidad más poderosa de la Creación.\n\nParece que impresionaste lo suficiente a la Emperatriz de Hierro como para que te haga una oferta para reinar en el Infierno junto a ella, en lugar de tratar de acatar las leyes del Cielo."
 POD_anteshuntyamakings.32.a: "¡No me interesa, demonio!"
 POD_anteshuntyamakings.32.b: "...¿un desposorio de Hierro?"

 POD_anteshuntyamakings.33.t: "El Infierno de Ser Despellejado Vivo"
 POD_anteshuntyamakings.33.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\nSi hay un lugar peor bajo el Cielo que el Infierno de Ser Despellejado Vivo, nadie lo ha encontrado aún. A simple vista, este infierno se asemeja a la superficie de un mundo desértico. Los visitantes dicen que combina lo peor de los desiertos del Reino Medio. La cuestión es discutible; el retorcido reino de [Glossary('Tou Mu','podgloss.toumu')] es infinitamente peor que cualquiera de estos, o todos ellos juntos.\n\nLos aullantes vientos que azotan para siempre las arenas rojas de este infierno son suficientes para arrancar la carne de los huesos de seres menores en segundos. Fragmentos de vidrio y metal arrastrados en estos vientos de velocidad sónica tienen suficiente fuerza para penetrar armaduras pesadas; la piel, incluso los duros pellejos de los $pod_kueijin$, se desgasta en momentos. Estos vientos han esculpido las rocas y mesetas en formas dentadas y horripilantes.\nAquellos que pueden ver a través de las constantes tormentas de arena de este dominio pueden divisar formas demoníacas realizando toda clase de torturas en las almas de aquellos arrastrados aquí, pero los gritos de las víctimas quedan cubiertos por el aullido del viento. Los vientos se convierten frecuentemente en nubes de embudo, succionando arena y almas millas por encima del suelo antes de dejarlas caer en picado sobre las afiladas cimas de piedra inferiores.\n\nPara añadir a esta desolada visión, [Glossary('Tou Mu','podgloss.toumu')] ha preparado un comité de bienvenida compuesto por sus demonios acorazados, monstruos deformes semejantes a ogros, trolls y otros seres dedicados a derribar a tu fuerza para la gloria de la Emperatriz de Hierro."
 POD_anteshuntyamakings.33.a: "Estos no pueden detenernos."
 POD_anteshuntyamakings.33.effect.success.desc: "¡Adelante!"
 POD_anteshuntyamakings.33.critical.failure.effect.desc: "Una victoria dolorosa..."

 POD_anteshuntyamakings.34.t: "El Valle de la Última Resistencia"
 POD_anteshuntyamakings.34.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\nSe cree que [Glossary('Tou Mu','podgloss.toumu')] podría haber sido la primera [Glossary('Reina Yama','podgloss.yamaking')]. Una vez encargada de castigar a los pecadores de la codicia y el orgullo, se hartó de Chi corrupto y tramó su dominación del Reino Medio. En este pasado lejano, los $pod_kueijin$ aún eran luchadores heroicos y fue el más grande entre ellos, Lei-Tsu, quien la derrotó y puso fin a sus planes.\nAun así, no pasó mucho hasta que los propios $pod_kueijin$ cayeron en desgracia y [Glossary('Tou Mu','podgloss.toumu')] tuvo su venganza. Capturó al debilitado Lei-Tsu y a sus guerreros y es aquí, en el Valle de la Última Resistencia, donde desgasta sus cuerpos y los rehace mil veces para que puedan comenzar a entender el alcance de su desagrado.\n\nEl Valle es el único lugar en el Infierno donde los vientos no soplan. Con las almas de sus enemigos derrotados ahora aprisionadas en este lugar, esta es una demostración de fuerza de [Glossary('Tou Mu','podgloss.toumu')].\nAun así, el propio Lei-Tsu nunca se quebró realmente. El una vez gran héroe puede ser encontrado aquí y podría ser fácilmente liberado. ¿Podría ser útil para tu búsqueda? Esto es más difícil de decir. La mente del hombre está severamente debilitada y tomaría tiempo valioso intentar ayudarle a recomponerse, y mucho menos ser un activo útil en tu lucha contra la Emperatriz de Hierro."
 POD_anteshuntyamakings.34.a: "Recuerda quién fuiste."
 POD_anteshuntyamakings.34.effect.success.desc: "Bienvenido de vuelta."
 POD_anteshuntyamakings.34.critical.failure.effect.desc: "No sirve de nada."
 POD_anteshuntyamakings.34.b: "No tenemos tiempo."

 POD_anteshuntyamakings.35.t: "La Fortaleza Siniestra"
 POD_anteshuntyamakings.35.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\nLa Fortaleza Siniestra es una de las pocas estructuras que descansa sobre la superficie real de este infierno. La fortaleza es un gran palacio, fortificado con hierro oxidado que se retuerce en un semblante horrible que refleja la máscara de la propia [Glossary('Reina Yama','podgloss.yamaking')]. La fortaleza entera está recorrida por la energía de los relámpagos que constantemente golpean allí. En las murallas exteriores están azotados los cuerpos de aquellos en cuyos tormentos [Glossary('Tou Mu','podgloss.toumu')] se ha tomado un interés especial.\nEstas criaturas condenadas están constantemente sometidas a los vientos cortantes y ráfagas de relámpagos. [Glossary('Tou Mu','podgloss.toumu')] no les permite morir, sin embargo, y sus gritos pueden oírse incluso por encima de los aullantes vientos.\n\nEsta naturaleza obstinada podría usarse en tu beneficio. Con la mayor parte de su ejército derrotado en la entrada, hay poco que pueda detenerte de liberar a estos prisioneros y organizarlos para contraatacar a su infernal carcelera.\nAun así, convertir a estas pobres almas de prisioneros decrépitos a una fuerza de combate efectiva requeriría habilidad y tiempo, tiempo que podría emplearse mejor en apresurarte hacia la Emperatriz de Hierro antes de que pueda prepararse para la batalla final."
 POD_anteshuntyamakings.35.a: "¡Esto es una fuga de prisión!"
 POD_anteshuntyamakings.35.effect.success.desc: "¡Libertad!"
 POD_anteshuntyamakings.35.critical.failure.effect.desc: "Son inútiles..."

 POD_anteshuntyamakings.36.t: "El Laberinto Siniestro"
 POD_anteshuntyamakings.36.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\nLas áreas interiores de la fortaleza de la [Glossary('Reina Yama','podgloss.yamaking')] son una colmena de cámaras. Incluso los más confiados de sus sirvientes no las conocen todas, y se cree que algunas de ellas pueden haber existido incluso antes de que la Emperatriz de Hierro llegara a gobernar este lugar. Si este es el caso, entonces partes de la fortaleza pueden albergar peligros de los cuales incluso [Glossary('Tou Mu','podgloss.toumu')] desconoce.\n\nTristemente, en algún lugar de este laberinto están sus propias cámaras y por tanto tienes que encontrar una manera de navegarlas tan rápido como sea posible.\nAlgunos de tus campeones ofrecen dividir tu fuerza, esperando cambiar velocidad por números para enfrentar a [Glossary('Tou Mu','podgloss.toumu')]. Si esta opción no te atrae, simplemente tendrás que encontrar la lógica detrás de este laberinto o forzarlo corriendo a través de él tan rápido como sea posible."
 POD_anteshuntyamakings.36.a: "Debe haber un método..."
 POD_anteshuntyamakings.36.effect.success.desc: "¡La salida!"
 POD_anteshuntyamakings.36.critical.failure.effect.desc: "Tan perdidos..."
 POD_anteshuntyamakings.36.b: "¡Nos dividimos!"
 POD_anteshuntyamakings.36.c: "¡Simplemente corred tan rápido como podáis!"
 
 POD_anteshuntyamakings.37.t: "La Emperatriz de Hierro"
 POD_anteshuntyamakings.37.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\nLos tres serpentinos ojos de [Glossary('Tou Mu','podgloss.toumu')] miran fijamente, sin pestañear, desde debajo de su máscara de hierro.\nAparece como una mujer en elaborada armadura de hierro completa con máscara cornuda y guanteletes con garras en cada uno de sus 18 brazos. Su largo cabello negro fluye desde detrás de la acerada máscara, el único toque humano que se permite.\n\nAl final de sus 18 brazos enguantados, cada una de sus garras sostiene algo letal, fétido o prodigioso: una cabeza de dragón exhalando fuego, un antiguo pergamino, una flor de loto, la cabeza de un bebé, un pendón negro goteando la corrupción del Olvido... La mayoría de estos objetos son artefactos de gran poder que [Glossary('Tou Mu','podgloss.toumu')] ha coleccionado para fortalecer su dominio sobre Yomi. Blandidos en concierto, la hacen efectivamente invulnerable, incluso fuera del Infierno de Ser Despellejado Vivo.\n\nLa Emperatriz de Hierro en regalia de batalla completa es un espectáculo que incluso otros [Glossary('Reyes Yama','podgloss.yamaking')] temen tanto que han considerado aliarse entre ellos para detenerla. Esto nunca ha ocurrido y por tanto, hoy, sois tú y tu fuerza quienes tenéis el dudoso honor de enfrentar a este aterrador ser en combate.\nIncluso aunque la superáis grandemente en número, no hay duda de la tensión en el aire. Estáis terriblemente superados, y todo el mundo aquí lo sabe."
 POD_anteshuntyamakings.37.a: "No hay vuelta atrás..."
 POD_anteshuntyamakings.37.effect.success.desc: "Podemos hacerlo..."
 POD_anteshuntyamakings.37.critical.failure.effect.desc: "Despellejado Vivo..."
  
 POD_anteshuntyamakings.38.t: "La Emperatriz Invulnerable"
 POD_anteshuntyamakings.38.desc: "$POD_anteshuntyamakings_military_strength_toumu$\n\nEsta es la última batalla, si tu Fuerza Militar es inferior a la de Tou Mu, tu camino terminará aquí.#!\n\nEstás ganando terreno lentamente sobre [Glossary('Tou Mu','podgloss.toumu')]. La ventaja numérica y tu propia gran habilidad demuestran ser suficientes para impedir que la Emperatriz de Hierro masacre a tu fuerza con salvaje abandono.\nEl estilo de lucha de la [Glossary('Reina Yama','podgloss.yamaking')] es muy ofensivo, usando la aparente indestructibilidad de su armadura para permitirle prescindir de las defensas.\n\nTristemente, la infame panoplia de hierro hace mucho, mucho más que simplemente proteger a la Emperatriz de Hierro de los vientos abrasivos de su dominio. Frecuentemente muestra signos de consciencia, moviéndose por su propia voluntad en ocasiones para proteger a la [Glossary('Reina Yama','podgloss.yamaking')] de golpes que no había detectado. También produce un formidable arsenal de armamento de su propia sustancia oscura, incluyendo cuchillas giratorias, cadenas de hierro terminadas en ganchos, shurikens, puntas de taladro y tentáculos metálicos.\nCasi parece una entidad demoníaca independiente vinculada a [Glossary('Tou Mu','podgloss.toumu')] de alguna manera. Independientemente de su naturaleza, la armadura cambia constantemente según los deseos de [Glossary('Tou Mu','podgloss.toumu')], manteniendo solo su característico aspecto de hierro oscuro como constante.\n\nSin haberle hecho apenas una abolladura en esta batalla hasta ahora, sabes que no ganarás una guerra de desgaste. La esperanza no está perdida sin embargo, ya que más y más de tus fuerzas encuentran su salida del Laberinto Siniestro y se unen a la refriega. Si suficientes de ellos han sobrevivido, podrías tener una oportunidad..."
 POD_anteshuntyamakings.38.a: "¡No cejéis!"

 POD_anteshuntyamakings.39.t: "Hierro Frío"
 POD_anteshuntyamakings.39.desc: "Incluso la temida Panoplia de Hierro y la legendaria destreza de [Glossary('Tou Mu','podgloss.toumu')] no fueron suficientes para triunfar sobre la habilidad, los números y la determinación. Cuando la Emperatriz cae al suelo en un gorgoteo de sangre negra, la Panoplia de Hierro se retrae de su cuerpo, probando su consciencia. Sin su preciada armadura, la [Glossary('Reina Yama','podgloss.yamaking')] parece una mujer algo poco impresionante ya que todos sus rasgos demoníacos se desvanecen mientras su vida la abandona.\n\nCon su último suspiro, la primera [Glossary('Reina Yama','podgloss.yamaking')] y una gran contendiente al trono del [Glossary('Emperador Demonio','podgloss.demonemperor')] desaparece, mientras los vientos del Infierno se desvanecen lentamente. Hoy será recordado como un triunfo para los enemigos de los [Glossary('Reyes Yama','podgloss.yamaking')]... pero también para aquellos entre ellos que temían a [Glossary('Tou Mu','podgloss.toumu')] y ahora ven a una temida competidora eliminada.\n\nAun así, una plaga sobre los Cielos ha sido eliminada y el horizonte parece un poco más brillante para los días venideros."
 POD_anteshuntyamakings.39.a: "El silencio proclama nuestra victoria."

 tou_mu_consort_modifier: "Consorte Predestinado de Tou Mu"
 tou_mu_consort_modifier_desc: "Cuando la Sexta Edad llegue, la Emperatriz no gobernará sola. Aquel que la impresionó adecuadamente será recompensado."

 POD_anteshuntyamakings.20.t: "Hierro contra Púas"
 POD_anteshuntyamakings.20.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\nEl ascenso de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] a la prominencia ha sido sorprendentemente rápido. Usando las victorias de la Horda Mongola, saltó de un [Glossary('Rey Yama','podgloss.yamaking')] menor y marginado a uno de los contendientes más fuertes al trono del [Glossary('Emperador Demonio','podgloss.demonemperor')]. Arrogante hasta la exageración, [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] usó este ascenso para acaparar las estepas como su propio patio de recreo, ganando más y más poder a medida que sus planes para corromper las energías del área daban fruto.\n\nAun así, esto le ha granjeado muchos enemigos, principalmente sus rivales [Glossary('Reyes Yama','podgloss.yamaking')]. La Emperatriz de Hierro, [Glossary('Tou Mu','podgloss.toumu')], es especialmente conocida como una enemiga obstinada suya, ya que era ella quien controlaba las estepas antes. Asegurándote de que sus agentes conozcan tu plan de asaltar el Infierno de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], harías tu tarea mucho más fácil ya que ella probablemente crearía otro frente propio.\n\nUn problema potencial sin embargo es causar aún más caos en lo que ya será un campo de batalla caótico. Tus consejeros sugieren mantener tu asalto en secreto si confías en poder ganar por ti mismo."
 POD_anteshuntyamakings.20.a: "Podríamos necesitar esta distracción."
 POD_anteshuntyamakings.20.b: "Estaremos bien por nuestra cuenta."

 POD_anteshuntyamakings.21.t: "Plagas contra Púas"
 POD_anteshuntyamakings.21.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\nOtra enemiga acérrima de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] es Rangda, la Señora de la Pestilencia. Su experimentación con Chi corrompido tuvo el efecto secundario de cortarle su suministro de la corrupción necesaria para sus enfermedades. Que [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] añadiera un sello a estas energías para que solo él pudiera usarlas fue añadir insulto a la herida. Desde entonces, los portadores de plagas y los favoritos a menudo chocan en Yomi (y más raramente en el mundo mortal).\n\nComo con [Glossary('Tou Mu','podgloss.toumu')], es ciertamente posible entrar en contacto con sus servidores y plantar la idea de un ataque a gran escala coincidiendo con tu propio asalto.\nAunque ciertamente útil para tu fuerza general, tener que navegar un campo de batalla empapado en las muchas enfermedades de Rangda no haría más fácil coordinar todo el asunto."
 
 POD_anteshuntyamakings.22.t: "El Infierno de las Cadenas Puntiagudas"
 POD_anteshuntyamakings.22.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\nEl [Glossary('Infierno de las Cadenas Puntiagudas','podgloss.hellspikedchains')] es una llanura aparentemente interminable tan plana que el suelo casi parece curvarse hacia el horizonte. Las muchas almas dedicadas (voluntariamente o no) a [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] están reunidas aquí, divididas en tribus y sumidas en guerra eterna para el retorcido placer del [Glossary('Rey Yama','podgloss.yamaking')].\nEsto las convierte en guerreros endurecidos y cada pedazo de terreno debe ser duramente disputado. Tu fuerza encontrará poco respiro aquí. Tan pronto como entráis, los primeros miembros deformes y de aspecto demoníaco de las tribus comienzan a cargar contra vosotros."
 POD_anteshuntyamakings.22.a: "No hay vuelta atrás..."
 POD_anteshuntyamakings.22.effect.success.desc: "Continuamos."
 POD_anteshuntyamakings.22.critical.failure.effect.desc: "Ya demasiadas pérdidas..."
  
 POD_anteshuntyamakings.23.t: "El Tormento de las Cadenas Puntiagudas"
 POD_anteshuntyamakings.23.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\nUna de las pocas características definitorias de esta llanura interminable es una gran cueva ventosa donde, como sabes gracias a los escapados de este Infierno, los prisioneros son colgados de estalactitas en cadenas de hierro de Yomi con espinas. Ya sean almas siendo torturadas para el placer de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] o miembros de tribus que perdieron los interminables conflictos de este reino, no importa realmente. Liberar a esos prisioneros, armarlos y organizarlos para añadirlos a tu fuerza sería ciertamente una bendición.\n\nHay un problema potencial sin embargo, ya que esta mezcolanza de cautivos apenas coherentes y de aspecto débil no son precisamente una fuerza de combate. Tendrás que convertirlos en una ayuda eficiente para tu causa en tiempo récord."
 POD_anteshuntyamakings.23.a: "¡Obedecedme, gusanos!"
 POD_anteshuntyamakings.23.effect.success.desc: "¡Adelante, marchad!"
 POD_anteshuntyamakings.23.critical.failure.effect.desc: "¡Sois todos unos inútiles!"
 
 POD_anteshuntyamakings.24.t: "Dividiendo y Conquistando"
 POD_anteshuntyamakings.24.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\nA medida que te acercas al palacio de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], el acoso que sufren tus fuerzas se está volviendo casi insoportable. Estás perdiendo más y más tropas mientras los interminables guerreros de este Infierno parecen nunca debilitarse. Aun así, este estado constante de guerra ofrece oportunidades.\n\nLas fuerzas de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] son empujadas a luchar siempre, incluyendo entre ellas. Aunque actualmente están centradas en tu intrusión, no haría falta mucha desinformación para avivar las llamas entre las tribus una vez más.\nSi todo sale bien, esto disminuiría la presión sobre tu fuerza y crearía división en las filas enemigas."
 POD_anteshuntyamakings.24.a: "¡Están robando vuestra gloria!"
 POD_anteshuntyamakings.24.effect.success.desc: "Exactamente como planeado."
 POD_anteshuntyamakings.24.critical.failure.effect.desc: "Arqueros a Caballo por Todas Partes..."
  
 POD_anteshuntyamakings.25.t: "Favoreciendo a los Favorecidos"
 POD_anteshuntyamakings.25.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\nLa tribu más fuerte en el [Glossary('Infierno de las Cadenas Puntiagudas','podgloss.hellspikedchains')] son los Favorecidos. Estos guerreros escogidos por el propio [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] reciben amplia libertad para pisotear a las otras tribus e infligir tormentos incalculables a sus víctimas. Convertirse en un Favorecido es el único respiro que pueden encontrar las almas aquí, aunque uno siempre puede caer de esta posición y la caída es dolorosa ciertamente.\n\nEsta ambición despiadada tiene el efecto secundario de hacer que los Favorecidos más poderosos busquen maneras de mejorar aún más su posición, incluyendo potencialmente derrocar al propio [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. Aunque una perspectiva completamente ridícula en sí misma, se vuelve más palpable ahora que has puesto el Infierno en estado de asedio y te estás acercando al [Glossary('Rey Yama','podgloss.yamaking')].\n\nContactar a los Favorecidos más ambiciosos y hacerles ver la posibilidad de reemplazar a su maestro una vez que te ocupes de él los pondría de tu lado por un tiempo. ¿Pero puedes realmente confiar en estas almas corrompidas por una eternidad de engaño y guerra?"
 
 POD_anteshuntyamakings.26.t: "La Guarida del Señor de los Caballos"
 POD_anteshuntyamakings.26.desc: "$POD_anteshuntyamakings_military_strength_dokhorkhan$\n\nEsta es una batalla culminante, si tu Fuerza Militar es inferior a la de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], tu camino terminará aquí.#!\n\nLa última línea de defensa de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] está compuesta por su círculo íntimo de [akuma|E] favorecidos, hinchados con energías corrompidas provenientes de los muchos nodos que el [Glossary('Rey Yama','podgloss.yamaking')] conquistó durante su conquista de las estepas. Algunos de su último proyecto personal, los [akuma|E] [Glossary('Anda','podgloss.anda')], también están presentes, aunque su apariencia inestable delata su estado inacabado. Parece que [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] está lanzando a todo y a todos los que aún le son leales contra tu fuerza aunque, sorprendentemente, aún no se ha mostrado.\n\nEste crisol de guerreros de élite y experimentos a medio terminar conforman una fuerza difícil de derribar, especialmente porque aún estás siendo acosado por la retaguardia por las tribus restantes. Esto será una prueba de la resistencia y voluntad de lucha restantes de tu fuerza."
 POD_anteshuntyamakings.26.a: "¡Muéstrate!"

 POD_anteshuntyamakings.27.t: "El Señor de los Caballos de Yomi"
 POD_anteshuntyamakings.27.desc: "Cuando finalmente entras en el palacio mismo, finalmente posas tus ojos en tu objetivo.\nGroseramente gordo, [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] engulle sangre ácida de bolsas cosidas con revestimientos estomacales de mortales. RebOSANTE de las energías que robó durante su conquista de las estepas, [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] parece casi inestable, como si estuviera cerca de implosionar en cualquier momento.\n\nEsto no lo hace menos peligroso ya que, aunque carece de habilidad en batalla (y definitivamente de gracia), lo compensa con creces con poder bruto. El miedo de provocar una reacción en cadena si le golpearas en el lugar equivocado tampoco ayuda..."
 POD_anteshuntyamakings.27.a: "Ni un movimiento en falso..."
 POD_anteshuntyamakings.27.critical.failure.effect.desc: "#italic ¡BOOM! #!"
 
 POD_anteshuntyamakings.28.t: "El Infierno del Caos Puntiagudo"
 POD_anteshuntyamakings.28.desc: "Mientras [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] se desmorona con un sonido repulsivo frente a ti, rápidamente te das cuenta de que tu victoria será efímera. La muerte del [Glossary('Rey Yama','podgloss.yamaking')] ha desatado a las tribus restantes pero también a los rivales [Glossary('Señores de Yomi','podgloss.yamaking')] para intentar conquistar este Infierno.\n\nEl reino entero está en caos, los Favorecidos restantes luchando contra los Portadores de Plagas de Rangda y los Demonios de Hierro de [Glossary('Tou Mu','podgloss.toumu')] en un torbellino de violencia completamente descontrolada.\n\nPeor aún, como el que derribó a [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], todas estas facciones tienen la misma idea de que eliminarte les daría una fuerte reclamación para tomar el reino. Tu debilitada y maltratada fuerza debe aún encontrar la fuerza o el genio táctico para escapar de alguna manera del lugar más peligroso bajo el Cielo y el Infierno ahora mismo."
 POD_anteshuntyamakings.28.a: "¡Corred! ¡CORRED!"
 POD_anteshuntyamakings.28.effect.success.desc: "De alguna manera, escapamos."
 
 POD_anteshuntyamakings.29.t: "Escapando y Triunfando"
 POD_anteshuntyamakings.29.desc: "Mientras tu fuerza de alguna manera logra escapar del caótico campo de batalla en que se ha convertido el [Glossary('Infierno de las Cadenas Puntiagudas','podgloss.hellspikedchains')], tu fuerza puede finalmente descansar y celebrar su triunfo en el mundo material. Te das cuenta de que realmente lo lograste, detuviste el ascenso de uno que parecía muy cerca de reclamar el trono del [Glossary('Emperador Demonio','podgloss.demonemperor')]. Aunque las secuelas de su muerte dejaron claro que su Infierno será conquistado por una facción u otra, probablemente tomará a los otros [Glossary('Reyes Yama','podgloss.yamaking')] décadas hacerlo, debilitándolos en este conflicto interno en el proceso.\nComo tal, tu victoria, aunque no suficiente para detener lo inevitable por sí sola, probablemente lo retrasará por un largo tiempo.\n\nY quién sabe, si uno tan fuerte como [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] puede ser derribado, quizás los otros también puedan serlo con el tiempo. Una esperanza ridícula quizás, pero mucho más realista después de tu heroica victoria."
 POD_anteshuntyamakings.29.a: "Una abolladura en el trono demoníaco."

 POD_anteshuntyamakings.10.t: "No Solos en la Oscuridad"
 POD_anteshuntyamakings.10.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\nEmma-o es ampliamente considerado el más poderoso de los [Glossary('Reyes Yama','podgloss.yamaking')]. Una criatura fría y metódica, ha estado escalando lentamente hacia el trono del [Glossary('Emperador Demonio','podgloss.demonemperor')] desde sus primeros días como un dios vengativo de los muertos Ainu. En contraste con sus hermanos, que son en su mayoría seres impetuosos y temerarios, Emma-o se mueve lentamente y planea a largo plazo.\nEsto lo ha hecho muy exitoso, incluyendo eliminar algunos de sus rivales menores e integrar sus reinos al suyo.\n\nEsto crea un serio problema para tu plan. Para decirlo claramente, nadie quiere luchar contra Emma-o ya que suena como una misión suicida. Peor aún, incluso intentar atraer a sus rivales [Glossary('Reyes Yama','podgloss.yamaking')] para un ataque concertado tendría poco efecto. Emma-o siempre ha sido lo bastante cuidadoso para no hacerse enemigos acérrimos de sus hermanos, solo iniciando una disputa cuando puede terminarla.\n\nComo tal, solo una opción para reforzar tu asalto está sobre la mesa, lanzar dinero y favores a cada ser lo bastante necio o desesperado para unirse a tu fuerza a pesar de las probabilidades."
 POD_anteshuntyamakings.10.a: "¡Os necesitamos! ¡Y a ti!"
 POD_anteshuntyamakings.10.b: "Mi fuerza principal será suficiente."

 POD_anteshuntyamakings.11.t: "Guardia Nocturna"
 POD_anteshuntyamakings.11.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\nEstás preparando tu partida a [Glossary('Kakuri','podgloss.kakuri')] pero serías un necio si pensaras que tu asalto, incluso si tiene éxito, será rápido. Estarás ausente por un tiempo y, peor aún, Emma-o tiene muchos agentes en el mundo mortal que seguramente vendrán a estrellarse contra tu reino tan pronto como amenaces a su maestro.\n\nComo el sabio general sabe, si tus líneas de suministro (al mundo mortal en este caso) son cortadas, entonces toda la guerra estará perdida. Así que tienes dos opciones, o bien irte y esperar que tu reino soporte sin tu supervisión directa o estacionar una parte de tus fuerzas para proteger el frente interno, sabiendo perfectamente que se les echará de menos en el otro lado."
 POD_anteshuntyamakings.11.a: "Mi reino es fuerte."
 POD_anteshuntyamakings.11.b: "Nuestra retaguardia debe estar segura."

 POD_anteshuntyamakings.12.t: "Dividiendo y Conquistando"
 POD_anteshuntyamakings.12.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\nDesolado y hostil, sin luz y frío, [Glossary('Kakuri','podgloss.kakuri')] personifica la manifestación más corrupta del principio Yin. Lo primero que notas es que no hay fin a la oscuridad. Ninguna luz mancha la noche eterna que Emma-o prefiere. No hay amanecer que traiga esperanza a aquellos aprisionados aquí.\nA veces la nieve que cubre el paisaje infernal emite una tenue luz blanca, pero este suave resplandor es justo suficiente para permitir a los atormentados observar su propia mutilación interminable.\n\nLos vientos de [Glossary('Kakuri','podgloss.kakuri')] son amargamente fríos. Portando cristales de hielo afilados como dagas, se cuelan a través de las ropas y desgarran la tierna carne debajo. Encarar el viento en [Glossary('Kakuri','podgloss.kakuri')] es una manera excelente de quedarse ciego, y algunos viajeros desafortunados han sido desollados hasta el hueso en cuestión de minutos por borrascas particularmente feroces.\nLa mayoría de las veces, el propio [Glossary('Kakuri','podgloss.kakuri')] es tormento suficiente para sus prisioneros para mantener satisfecho a Emma-o. Los fuegos, cuando pueden encenderse aquí, no proporcionan calor. En su lugar producen una pálida luz azul por unos momentos, luego parpadean y mueren en los vientos incesantes.\n\nComo esperabas, el [Glossary('Rey Yama','podgloss.yamaking')] ha elegido retirar todas sus fuerzas a su castillo en lugar de darte la ventaja de una batalla campal. Tu primera orden del día será por tanto organizar líneas de suministro al mundo mortal para prepararte para un largo asedio en esta tierra desolada donde no pueden encontrarse recursos."
 POD_anteshuntyamakings.12.a: "Asegura la entrada, montad tiendas."
 POD_anteshuntyamakings.12.effect.success.desc: "Como Planeado."
 POD_anteshuntyamakings.12.critical.failure.effect.desc: "Tan Frío y Sin Vida..."
  
 yk_hunt_jizo_help_tt: "La ayuda de Jizo podría resultar crucial en el futuro."
 POD_anteshuntyamakings.13.t: "El Honorable"
 POD_anteshuntyamakings.13.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\nAparte de Emma-o y sus servidores, solo hay un ser capaz de vagar por la oscuridad de [Glossary('Kakuri','podgloss.kakuri')] ileso. Su nombre es Jizo-Bosatsu, y encarna el mismo honor que Emma-o niega.\nApareciendo como un hombre menudo y calvo que viste las ropas negras o azafrán de un monje, Jizo-Bosatsu ha ayudado y aconsejado a innumerables almas atrapadas aquí. Los anillos de bronce en la parte superior de su bastón tintinean cuando camina para advertir a las pequeñas criaturas de su llegada, para no dañarlas inadvertidamente.\n\nEn ningún momento se ha sabido que Jizo-Bosatsu mostrara miedo o ira, y parece calmado en todas las circunstancias. Los testigos han afirmado que ha hablado palabras a las [Glossary('Shikome','podgloss.shikome')] lo bastante insensatas para cazarle, y que las [Glossary('Shikome','podgloss.shikome')] han huido, llorando, como resultado. Muchas de estas [Glossary('Shikome','podgloss.shikome')] dejan el servicio de Emma-o poco después de oír las palabras de Jizo-Bosatsu.\n\nDe todos los seres que jamás han vagado por [Glossary('Kakuri','podgloss.kakuri')], Jizo tiene el singular honor de ser el único que jamás ha intimidado realmente a Emma-o. Siempre que esta figura sonriente y silbante es vista en [Glossary('Kakuri','podgloss.kakuri')], el gran [Glossary('Rey Yama','podgloss.yamaking')] se retira a su fortaleza.\n\nConociendo esta reputación, siempre planeaste buscar la ayuda de este extraño ser. Afortunadamente, intrigado por el alboroto que tu ejército está causando, Jizo-Bosatsu ha encontrado su propio camino a tu campamento para preguntar sobre tu propósito aquí.\nHas preparado un fuerte discurso para hacerle unirse a tu causa pero, francamente, estás listo para suplicar y rogar si es necesario. Muchos piensan que tu búsqueda está condenada si el «Honorable» no te ayuda de alguna forma o manera."
 POD_anteshuntyamakings.13.a: "¡Podemos detenerlo para siempre!"
 POD_anteshuntyamakings.13.effect.success.desc: "Gracias."
 POD_anteshuntyamakings.13.critical.failure.effect.desc: "Viejo Necio..."
 POD_anteshuntyamakings.13.b: "Te lo rogamos, Honorable."

 POD_anteshuntyamakings.14.t: "Tenían que Ser Arañas"
 POD_anteshuntyamakings.14.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\nMientras Emma-o y sus servidores de mayor confianza se han retirado a su castillo tan pronto como entraste en este reino, otras criaturas deambulan por los yermos de [Glossary('Kakuri','podgloss.kakuri')]. Las más numerosas de estas son las Kumo hembra que sirven libremente a Emma-o. Estas criaturas han establecido guaridas en las sombras más profundas del dominio, atrapando a las almas que pueden y drenando a estas desventuradas víctimas de su Chi.\nEstas horribles cazadoras actúan como las cazadoras del [Glossary('Rey Yama','podgloss.yamaking')] de vez en cuando. Su líder se considera a sí misma «reina» de las Kumo y se ve como la consorte del Daimyo de la Oscuridad. Los no-Kumo piensan que está loca, pero pocas criaturas son lo bastante poderosas para decírselo y sobrevivir.\n\nSintiendo una oportunidad para ascender en posición a los ojos de su oscuro amo, las Kumo han lanzado un ataque total para aniquilar a tu fuerza. Aunque improbable que tengan éxito ya que tu ejército es lo bastante fuerte para manejarlas, aún tienes que ser cuidadoso.\nSi infligieran demasiadas bajas en tu bando, todo tu ataque podría ponerse en peligro."
 POD_anteshuntyamakings.14.a: "¡Cuidado con las telarañas!"
 POD_anteshuntyamakings.14.effect.success.desc: "Limpiadlas"
 POD_anteshuntyamakings.14.critical.failure.effect.desc: "Malditas Arañas..."

 POD_anteshuntyamakings.15.t: "Las Gélidas"
 POD_anteshuntyamakings.15.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\nLas sirvientas más conocidas de Emma-o son, de lejos, las [Glossary('Shikome','podgloss.shikome')].\n\nMediante ensayo y error, Emma-o ha creado esta fiera legión de [akuma|E] femeninas para actuar como sus guardaespaldas, sirvientas y concubinas. Ha entrenado a sus sirvientas sin piedad hasta que se convirtieron en las asesinas ideales de aspecto Yin: silenciosas, sin emociones y gélidamente astutas.\nCada [Glossary('Shikome','podgloss.shikome')] fue escogida personalmente por el propio Emma-o y cuidadosamente atraída a convertirse en uno de sus [akuma|E]. Comparten muchas similitudes: Cada una es devastadoramente hermosa y completamente sociópata. La mayoría de las [Glossary('Shikome','podgloss.shikome')] son maestras consumadas de las Disciplinas Yin Prana y Shintai Óseo.\n\nLa habilidad más peligrosa de una [Glossary('Shikome','podgloss.shikome')] es su destreza manipulando hombres. Las [Glossary('Shikome','podgloss.shikome')] se alimentan de la fuerza de voluntad de los hombres de la misma manera que la mayoría de los $pod_kueijin$ se alimentan de Chi. Mientras que las mujeres automáticamente desprecian a las [Glossary('Shikome','podgloss.shikome')] e intentan atacarlas, los hombres harán cualquier cosa por ellas, les darán cualquier cosa que deseen y morirán por ellas con la esperanza de una mirada amable (que nunca recibirán).\n\nObviamente entrenaste a tu fuerza lo mejor que pudiste para resistir esta letal manipulación incluso antes de entrar en este reino. Y parece que dicho entrenamiento será puesto a prueba.\nEn lugar de un ataque a gran escala sobre tu campamento, Emma-o simplemente dejó que un puñado de sus más sigilosas [Glossary('Shikome','podgloss.shikome')] se infiltraran en tu asedio y jugaran sus juegos con tus fuerzas. Se han ido mucho antes de que te des cuenta de lo que está ocurriendo y aunque Emma-o no perderá a ninguna de sus sirvientas en este ataque desleal, el impacto en tu ejército está por ver."
 POD_anteshuntyamakings.15.a: "¡Controlaos!"
 POD_anteshuntyamakings.15.effect.success.desc: "Crisis Evitada"
 POD_anteshuntyamakings.15.critical.failure.effect.desc: "Lavados de cerebro..."
 yk_hunt_ainu_help_tt: "Encontrar el Inframundo Ainu podría resultar crucial en el futuro."
 POD_anteshuntyamakings.16.t: "Su Propósito Original"
 POD_anteshuntyamakings.16.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\nEmma-o y sus fuerzas no se han movido de su inexpugnable castillo desde que entraste en este reino. Esto te deja con cada vez menos opciones. Un asalto directo sería similar al suicidio, así que encontrar una manera de forzar al Daimyo de la Oscuridad a salir y luchar contra ti sería mejor. Pero, ¿qué podría enfurecer a una criatura tan fría y calculadora lo suficiente como para cometer un acto tan temerario?\n\nTus consejeros señalan hacia un rumor. Como fue una vez el guardián de los muertos Ainu, Emma-o mantuvo su propósito original en mente, aunque luego se convirtió en un [Glossary('Rey Yama','podgloss.yamaking')] para vengar a su pueblo de la agresión japonesa.\nSi dichos rumores son ciertos, hay algún lugar aquí que oculta la verdadera entrada al inframundo Ainu, aún disponible para aquellos de esta herencia que lo merezcan. Encontrarlo y amenazarlo podría ser suficiente para hacer que incluso la gélida sangre de Emma-o se vuelva caliente."
 POD_anteshuntyamakings.16.a: "¡Buscad por todas partes!"
 POD_anteshuntyamakings.16.effect.success.desc: "Aquí está..."
 POD_anteshuntyamakings.16.critical.failure.effect.desc: "¿Solo un rumor?"
 POD_anteshuntyamakings.16.b: "¡Convocad a nuestras reservas para unirse a la búsqueda!"

 POD_anteshuntyamakings.17.t: "Kyuden no Kakuri"
 POD_anteshuntyamakings.17.desc: "$POD_anteshuntyamakings_military_strength_emmao$\n\n«El Castillo de Kakuri» es el único lugar glorioso en este infierno, y ha sido cuidadosamente situado en la cima de un enorme pico para hacerlo inexpugnable. Esta es la fortaleza de Emma-o, y sus elaboradas murallas y almenas de obsidiana son un testimonio de su vanidad y presunción. El castillo está ocupado por las más potentes [Glossary('Shikome','podgloss.shikome')] del [Glossary('Rey Yama','podgloss.yamaking')], quienes le atienden como guardaespaldas y concubinas.\nLas almas atrapadas en [Glossary('Kakuri','podgloss.kakuri')] así como tus propias fuerzas oyen sonidos extraños bajando de la montaña, haciéndoles preguntarse sobre qué perversiones ocurren dentro, mientras les recuerdan los placeres terrenales que quizás nunca experimenten de nuevo.\n\nEmma-o tiene la clara ventaja aquí. Como entidades espirituales, él y sus demonios pueden soportar un asedio para siempre mientras que tus tropas ciertamente no pueden.\nUn asalto está también fuera de cuestión, ya que todo este castillo ha sido creado y posicionado para resistir legiones enteras de los rivales [Glossary('Reyes Yama','podgloss.yamaking')] de Emma-o."
 POD_anteshuntyamakings.17.desc.b: "\n\nPor suerte, tu estratagema para empujar a Emma-o a cometer un error ha funcionado. Aliándote con su némesis Jizo-Bosatsu y amenazando su amado Inframundo Ainu, el usualmente frío y calculador Daimyo de la Oscuridad ha sido empujado a una ira lo bastante caliente como para forzarle a una salida.\nEstás brevemente aliviado al ver las puertas del castillo abrirse para dejar salir una legión de [Glossary('Shikome','podgloss.shikome')] antes de recordarte a ti mismo que esta seguirá siendo una batalla nunca antes vista. Tus fuerzas han sido debilitadas por las durezas de este largo asedio mientras que los demonios de Emma-o no.\n\nSolo puedes esperar que lo que quede sea suficiente para resistir un poco más.\n\n #R Esta es una batalla culminante, si tu Fuerza Militar es inferior a la de Emma-o, tu camino terminará aquí.#!."
 POD_anteshuntyamakings.17.desc.c: "\n\nLos días se convierten en semanas y nada cambia salvo la moral desmoronándose de tu fuerza. Parece que el [Glossary('Rey Yama','podgloss.yamaking')] está contento con esperar y tiene los medios para hacerlo. Ninguna clase de provocación o pose es suficiente para hacerle moverse.\nAunque consideras brevemente un asalto, rápidamente renuncias. Este castillo ha sido hecho para ser el trono indestructible de un [Glossary('Emperador Demonio','podgloss.demonemperor')]. Tu fuerza, maltratada y magullada por las duras condiciones de [Glossary('Kakuri','podgloss.kakuri')], no está en forma para ganar tal batalla.\n\nLa única opción que queda se vuelve inevitable a medida que más y más descontento se oye en tu ejército y tu ausencia en el reino mortal se vuelve más preocupante. Con un corazón pesado, ordenas la retirada.\nAparentemente contento de demostrar que su paciencia le ganó el día, Emma-o no intenta detenerte.\n\nRegresas a tu propio reino y, aunque no tuviste éxito, esperas haber hecho al menos una mella en la confianza de los [Glossary('Reyes Yama','podgloss.yamaking')] en su triunfo inevitable."
 POD_anteshuntyamakings.17.a: "Podría haber ido peor."
 POD_anteshuntyamakings.17.b: "¡Manteneos firmes!"
 POD_anteshuntyamakings.17.c: "¡¿Es ese el propio Emma-o?!"

 POD_anteshuntyamakings.18.t: "La Batalla por Kakuri"
 POD_anteshuntyamakings.18.desc: "Incluso estando enfurecido por tus acciones, Emma-o no es aún lo bastante necio como para dejar que su ira se interponga en el camino de su seguridad. En lugar de esperarte en su sala del trono o monologar como un [Glossary('Rey Yama','podgloss.yamaking')] más arrogante habría hecho, simplemente carga contra tu ejército junto a sus [Glossary('Shikome','podgloss.shikome')].\n\nEsto hace las cosas notablemente más difíciles de lo que podrías haber anticipado.\n\nEl Daimyo de la Oscuridad es una fuerza abrumadora y la presencia de sus poderosas [Glossary('Shikome','podgloss.shikome')] a su lado hacen imposible concentrarse y abrumarlo con tus números. Así, tienes que actuar como un general aquí. La salida de Emma-o no le permitió posicionar fácilmente a sus fuerzas y si puedes mantener a tu ejército disciplinado y cosechar esta ventaja, la esperanza podría no estar perdida.\nUn esfuerzo desesperado también es posible. Tus reservas, que principalmente se quedaron en el mundo mortal hasta ahora, podrían ser llamadas. Aunque servirían como poco más que carne de cañón, esto aún podría marcar la diferencia."
 POD_anteshuntyamakings.18.a: "¡Rodeadlos!"
 POD_anteshuntyamakings.18.effect.success.desc: "Aún no hemos terminado..."
 POD_anteshuntyamakings.18.critical.failure.effect.desc: "Tal poder..."
 POD_anteshuntyamakings.18.b: "¡Convocad a nuestras reservas! ¡Hasta el último de ellos!"

 POD_anteshuntyamakings.19.t: "El Daimyo de la Oscuridad"
 POD_anteshuntyamakings.19.desc: "A medida que las [Glossary('Shikome','podgloss.shikome')] caen una a una ante tu ejército, solo un obstáculo se interpone en el camino de tu victoria, el propio Emma-o.\n\nTu oponente aparece como un hombre excesivamente alto con barba negra y ojos que irradian malicia. Su piel, donde se muestra, parece obsidiana y está hecha de la sustancia del Yin puro. Viste una vestidura de fina tela Ainu bordada con exquisitamente representadas escenas de batalla, enfermedad y muerte. Porta una espada de Yin puro, la infame arma que cobró la vida de un [Glossary('Rey Yama','podgloss.yamaking')] rival, Yen-Lo.\n\nEl estilo de lucha de Emma-o es rápido y decisivo. No hace ningún movimiento innecesario y cada golpe de su espada está hecho para o bien matar a alguien o defenderse. No hay emociones que leer ni debilidades obvias que explotar.\n\nTe enfrentas al poder de aquel que está cerca de convertirse en el [Glossary('Emperador Demonio','podgloss.demonemperor')], el amo de toda la Creación en la próxima Era. Incluso tan terriblemente superado en número como está, no hay duda de que esta será la mayor batalla de tu existencia."
 POD_anteshuntyamakings.19.a: "Firme..."
 POD_anteshuntyamakings.19.effect.success.desc: "¿Está hecho?"

 POD_anteshuntyamakings.190.t: "La Luz en la Oscuridad"
 POD_anteshuntyamakings.190.desc: "Emma-o cae al suelo y comienza a desaparecer lentamente. Y... nada obvio cambia. [Glossary('Kakuri','podgloss.kakuri')] sigue estando ventoso y frío, el castillo aún se alza y las [Glossary('Shikome','podgloss.shikome')] no volvieron a su estado normal. Aun así, todo se siente diferente no obstante.\n\nEste lugar fue una vez el Inframundo Ainu y es probable que vuelva lentamente a este estado primario con el tiempo. Los reinos que Emma-o absorbió durante su ascenso se restaurarán a sí mismos también, esperanzadamente ofreciendo algo de equilibrio de vuelta a los Infiernos.\n\nEl contendiente más fuerte al [Glossary('Emperador Demonio','podgloss.demonemperor')] ha caído y tomará siglos para que los otros se acerquen tanto como Emma-o lo había hecho. Este hecho por sí solo significa que lograste preservar al mundo mortal de la desesperación por un largo tiempo. Esperanzadamente tu ejemplo también hará a los otros [Glossary('Reyes Yama','podgloss.yamaking')] más cuidadosos, dando aún más tiempo para quizás lograr otras victorias contra ellos en el futuro.\n\nMientras levantas la espada desechada de Emma-o, puedes sentir que marcaste la diferencia.\n\nQuizás incluso una duradera."
 POD_anteshuntyamakings.190.a: "El trono se desmorona."
 
 yk_death_faith_random_tt: "Los personajes de la fe del Rey Yama muerto se convertirán a otra fe de los Mil Infiernos."
 yk_death_faith_yours_tt: "Los personajes de la fe del Rey Yama muerto se convertirán a tu fe."