l_spanish:

 POD_rationalize.100.t: "Estás siendo dominado"
 POD_rationalize.100.desc: "[schemer.GetTitledFirstName] te está dominando para exigirte un favor."
 POD_rationalize.100.option.a: "Ejercer mi fuerza de voluntad para resistir la dominación."
 POD_rationalize.100.option.b: "Rechazar la dominación."
 POD_rationalize.100.option.c: "Aceptar la dominación."
 
 POD_rationalize.200.t: "Dominando a [target.GetFirstNameNoTooltip]"
 POD_rationalize.200.desc: "Mi voluntad ordena a [target.GetTitledFirstName]. Se está resistiendo a mi dominación."
 POD_rationalize.200.option.a: "Exaltar la sangre para dominar[target.GetHerHim]."
 POD_rationalize.200.a.tt_fortitude: "[target.GetFirstNameNoTooltip] es expert[target.GetCustom('ES_O')] en la $pod_discipline$ de Fortaleza y es resistente a tus poderes."
 POD_rationalize.200.a.tt_willpower: "[target.GetFirstNameNoTooltip] ha ejercido su voluntad para resistir tus poderes."
 POD_rationalize.200.a.success.desc: "Victoria"
 POD_rationalize.200.a.tt_success: "[target.GetTitledFirstName] racionalizará el concederte un favor."
 POD_rationalize.200.a.failure.desc: "Derrota"
 POD_rationalize.200.a.tt_failure: "[target.GetTitledFirstName] resistirá tu dominación."
 POD_rationalize.200.option.b: "Exaltar la sangre y ejercer mi voluntad. ¡Yo soy el maestro!"
 POD_rationalize.200.option.b.tt.beast: "#beast ¡Yo soy el maestro!#!"
 POD_rationalize.200.option.c: "Esto es una pérdida de tiempo, ya no deseo dominar[target.GetHerHim]."
 POD_rationalize.200.option.c.tt: "La dominación fallará."
 
 POD_rationalize.300.t: "[target.GetFirstNameNoTooltip] racionalizado"
 POD_rationalize.300.desc: "Mediante el uso de mi $pod_discipline$ de Dominación, [target.GetTitledFirstName] racionalizará el deberme un favor."
 POD_rationalize.300.option.a: "Ahora, ¿qué quiero que haga?"
 POD_rationalize.300.option.a.tt.beast: "#beast ¡Sangre! ¡Queremos sangre!#!"
 
 POD_rationalize.400.t: "Una deuda que no puedo rechazar"
 POD_rationalize.400.desc: "Le debo un favor a [schemer.GetTitledFirstName]." 
 POD_rationalize.400.option.a: "¿Cómo podré compensárselo?"
  
 POD_rationalize.500.t: "Resistió la dominación"
 POD_rationalize.500.desc: "[target.GetTitledFirstName] se ha resistido a mi dominación." 
 POD_rationalize.500.option.a: "¡Esto no puede ser!"
 POD_rationalize.500.option.a.tt.beast: "#beast ¡Golpéalos hasta que obedezcan!#!"
 
 POD_rationalize.600.t: "Dominación resistida"
 POD_rationalize.600.desc: "Me he librado de los grilletes mentales de la dominación de [schemer.GetTitledFirstName]." 
 POD_rationalize.600.option.a: "¡Tengo una voluntad de hierro!"
