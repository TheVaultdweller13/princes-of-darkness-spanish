  REYNARD_LIE_PERK_STATS_EFFECT: "Desbloquea la [impatient_rushing_all_schemes_decision|E]"
  FIREBRINGER_PERK_STATS_EFFECT: "Probabilidad de ganar un punto de ventaja de estilo de vida aleatorio por cada ser sobrenatural muerto.\nGana [prestige|E] y [dynasty_prestige|E] cuando realices la [interaction|E] de entrenamiento de estilo de vida.\n#F El Ragabash realiza el truco definitivo, robando un poder sobrenatural y convirtiéndolo en un Don, que a su vez puede ser otorgado a otros como si la Luna Nueva fuera un maestro espiritual. Por desgracia, el Ragabash debe primero sobrevivir a que el poder sea usado sobre él. Coyote u otro Incarna embaucador enseña este Don.#!"
  FIREBRINGER_REQUIREMENT: "@warning_icon!#X Necesitas terminar una misión de un Incarna embaucador (estaciona a un explorador en cualquier reino de la umbra para encontrar una pista sobre la ubicación e inicia una [umbra_expedition|E] para llegar a ellos y luego recibir una misión) para desbloquear esta ventaja.#!"
 
  
