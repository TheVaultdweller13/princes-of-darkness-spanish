  NEEDS_GALLIARD_TEXT: "@warning_icon!#X Requiere el [traits|E] [GetTrait('galliard').GetName( GetPlayer )] para comprar ventajas en este árbol.#!"
  PRIMAL_SONG_PERK_STATS_EFFECT: "Desbloqueas la [character_interaction|E] 'Canción primordial' sobre ti mismo. Luego puedes elegir una canción para interpretar. Hay canciones adicionales disponibles en el resto de este árbol de estilo de vida."
