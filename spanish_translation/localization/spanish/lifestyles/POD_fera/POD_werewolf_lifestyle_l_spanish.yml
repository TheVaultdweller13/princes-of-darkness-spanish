  SONG_RAGE_PERK_STATS_EFFECT: "Desbloqueas una canción adicional que se puede interpretar usando la [character_interaction|E] 'Canción primordial'." 
  SONG_SIREN_PERK_STATS_EFFECT: "Desbloqueas una canción adicional que se puede interpretar usando la [character_interaction|E] 'Canción primordial'."
  STORYTELLER_PERK_STATS_EFFECT: "Como [character_interaction|E], permite usar $POD_energy_gnosis$ para tener la oportunidad de que ocurra un evento aleatorio.\n#F En lugar de simplemente contar y volver a contar las historias de antaño, o incluso esperar hasta que los eventos del día se conviertan en las nuevas historias, el Galliard puede cambiar los eventos del drama en curso que se desarrolla a su alrededor. Puede añadir nuevos \"personajes\", alterar cadenas de eventos e incluso cambiar las motivaciones de los participantes principales. Sin embargo, como este Don puede tener literalmente ramificaciones que alteran el mundo, el puñado de Garou en la historia que lo han conocido se han mostrado reacios a usarlo realmente. Nadie sabe qué tipo de espíritu enseña este Don; presumiblemente un avatar de Gaia, pero como tan pocos Garou conocen siquiera la existencia del Don, nadie puede decirlo con certeza.#!" 
  STORYTELLER_REQUIREMENT: "@warning_icon!#X Necesitas terminar una misión de un avatar de Gaia (estaciona a un explorador en cualquier reino de la umbra para encontrar una pista sobre la ubicación e inicia una [umbra_expedition|E] para llegar a ellos y luego recibir una misión) para desbloquear esta ventaja.#!"
 
 
 
