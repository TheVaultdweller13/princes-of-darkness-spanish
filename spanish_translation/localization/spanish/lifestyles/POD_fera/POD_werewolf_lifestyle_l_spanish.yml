  HEAR_SILENCE_PERK_STATS_EFFECT: "Desbloquea la decisión menor Meditar en reclusión"
  NAME_SPIRIT_PERK_STATS_EFFECT: "Desbloquea la decisión menor Pedir ayuda a los espíritus."
  PROPHETIC_VISION_PERK_STATS_EFFECT: "Desbloquea la [decision|E] Adivinar las estrellas\nRecibirás una notificación si alguien pretende asesinar a tus amigos o familiares.\nRecibirás una notificación si alguien pretende seducir a tus amantes o consortes.\nTu prisionero tiene menos probabilidades de escapar de tu prisión."
  REBIRTHING_PERK_STATS_EFFECT: "Renacerás como un personaje de #V 1#! año si mueres.\n#F Este, el más sagrado y raro de los Dones de Gaia, permite al Garou, tras su muerte, reencarnarse instantáneamente en el cuerpo de un cachorro recién nacido que viva a menos de 2.000 millas de donde murió el Garou. La reencarnación es casi siempre de la misma raza que el Garou tenía en su vida anterior, pero puede ser en otra raza si el único recién nacido dentro del rango no es de la raza original. Si no hay cachorros recién nacidos en el rango dentro de un giro de la luna desde el momento de la muerte, entonces el Garou no renace y va a donde van todos los Garou tras la muerte.#!"
  REBIRTHING_REQUIREMENT: "@warning_icon!#X Necesitas terminar una misión de la propia Gaia (estaciona a un explorador en cualquier reino de la umbra para encontrar una pista sobre la ubicación e inicia una [umbra_expedition|E] para llegar a ellos y luego recibir una misión) para desbloquear esta ventaja.#!"
