  NEEDS_PHILODOX_TEXT: "@warning_icon!#X Requiere el [traits|E] [GetTrait('philodox').GetName( GetPlayer )] para comprar ventajas en este árbol.#!"
  AURA_LEADERSHIP_PERK_STATS_EFFECT: "Desbloqueas la decisión menor 'Juez de la Tierra'. Beneficiará a tu capital. Hay beneficios adicionales disponibles en el resto de este árbol de estilo de vida."
  COMMAND_GATHERING_PERK_STATS_EFFECT: "Desbloqueas una recompensa adicional que se otorgará durante la decisión menor 'Juez de la Tierra'."
  RELEASE_FROM_BONDAGE_PERK_STATS_EFFECT: "Ganas fuertes defensas mentales, lo que te hace inmune a algunos poderes mentales.\nComo [character_interaction|E], permite usar $POD_energy_gnosis$ para hacer que un objetivo gaste un gancho que tenga sobre ti.\n#F Hay muchas formas de doblegar místicamente la voluntad de otro. Este Don rompe todos esos vínculos, desde la dominación de sangre de un vampiro hasta el control mental de un mago o el geas de un Media Luna. Aquellos que conocen este Don pueden usarlo sobre cualquier ser, incluyéndose a sí mismos. Este Don solo es otorgado por un Incarna o un espíritu igualmente poderoso, normalmente como recompensa por algún gran servicio.#!"
  RELEASE_FROM_BONDAGE_REQUIREMENT: "@warning_icon!#X Necesitas terminar una misión de un Incarna (estaciona a un explorador en cualquier reino de la umbra para encontrar una pista sobre la ubicación e inicia una [umbra_expedition|E] para llegar a ellos y luego recibir una misión) para desbloquear esta ventaja.#!"
 
