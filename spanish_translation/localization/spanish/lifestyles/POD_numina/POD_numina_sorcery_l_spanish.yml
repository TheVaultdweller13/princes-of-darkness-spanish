 numina_alchemy_1_perk_name: "Alquimia $numina_1_name$"
 numina_alchemy_2_perk_name: "Alquimia $numina_2_name$"
 numina_alchemy_3_perk_name: "Alquimia $numina_3_name$"
 numina_alchemy_4_perk_name: "Alquimia $numina_4_name$"
 numina_alchemy_5_perk_name: "Alquimia $numina_5_name$"
 numina_alchemy_6_perk_name: "Alquimia $numina_6_name$"
 numina_alchemy_common_description: "#flavor El estudio de la transformación y la purificación, la Alquimia es un arte y una ciencia ancestrales. Sus practicantes recurren a prácticas dispares, tanto mágicas como científicas, para comprender las propiedades ocultas de la materia y el alma. El objetivo más tradicional de la alquimia no es la más famosa transformación de la materia base en contrapartidas más 'nobles' —como plomo en oro—, sino más bien la perfección del alquimista.#!"
 
 NUMINA_ALCHEMY_1_PERK_EFFECT: "$unlock_brewing_node$ [GetModifier('alchemy_antidepresants_1_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_aphrodisiac_1_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_poison_1_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_antibiotics_1_modifier').GetNameWithTooltip]\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_2_PERK_EFFECT: "Mejora todos los nodos de fabricación de [GetPerk('numina_alchemy_1_perk').GetName(GetPlayer)]\n$unlock_brewing_node$ Añade un modificador que aumenta una habilidad aleatoria en 1 ([GetModifier('alchemy_stimulant_diplomacy_modifier').GetNameWithTooltip])\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_3_PERK_EFFECT: "Mejora todos los nodos de fabricación de [GetPerk('numina_alchemy_2_perk').GetName(GetPlayer)]\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_4_PERK_EFFECT: "Mejora todos los nodos de fabricación de [GetPerk('numina_alchemy_3_perk').GetName(GetPlayer)]\n$unlock_brewing_node$ [GetModifier('alchemy_health_booster_1_modifier').GetNameWithTooltip]\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_5_PERK_EFFECT: "Mejora todos los nodos de fabricación de [GetPerk('numina_alchemy_4_perk').GetName(GetPlayer)]\n$unlock_brewing_node$ #TOOLTIP:GAME_TRAIT,immortal,[GetNullCharacter] #L Inmortalidad#!\n$unlock_brewing_node$ #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L Vampirismo#!\nDuración del efecto de la poción: #P +1#!\n$numina_alchemy_common_description$"
 NUMINA_ALCHEMY_6_PERK_EFFECT: "Mejora todos los nodos de fabricación de [GetPerk('numina_alchemy_5_perk').GetName(GetPlayer)]\n$unlock_brewing_node$ Aumenta una habilidad seleccionada en #P 1#! sacrificando un personaje con esa habilidad por encima de #bold [EmptyScope.ScriptValue('POD_numina_sorcery_alchemy_skill_potion_requirement')]#!\nDuración del efecto de la poción: #P +2#!\n$numina_alchemy_common_description$"

 NUMINA_ALCHEMY_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #v Estudiar Archimaestría de Tapadillo: Alquimia#!#!"
 
 numina_conjuration_1_perk_name: "Conjuración $numina_1_name$"
 numina_conjuration_2_perk_name: "Conjuración $numina_2_name$"
 numina_conjuration_3_perk_name: "Conjuración $numina_3_name$"
 numina_conjuration_4_perk_name: "Conjuración $numina_4_name$"
 numina_conjuration_5_perk_name: "Conjuración $numina_5_name$"
 numina_conjuration_6_perk_name: "Conjuración $numina_6_name$"
 numina_conjuration_common_description: "#flavor La Conjuración es la Senda por excelencia de los magos de escenario: sacar conejos de chisteras y cartas del bolsillo de un espectador son ejemplos comunes de sus aplicaciones más básicas. Los hechiceros que desean ganarse la vida con sus estudios a menudo aprenden Conjuración. Debido a esta inextricable asociación con la magia escénica, los Durmientes tienden a racionalizar la Conjuración como simple prestidigitación experta.#!"
 
 NUMINA_CONJURATION_1_PERK_EFFECT: "$numina_conjuration_common_description$"
 NUMINA_CONJURATION_2_PERK_EFFECT: "$numina_conjuration_common_description$"
 NUMINA_CONJURATION_3_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Invoca una mascota aleatoria.\n$numina_conjuration_common_description$"
 NUMINA_CONJURATION_4_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Invoca un artefacto #color_dark_green Obra Maestra#! aleatorio.\n$numina_conjuration_common_description$"
 NUMINA_CONJURATION_5_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Invoca un objetivo [GetTrait('mortal').GetName(GetPlayer)] o sobrenatural voluntario.\nMejora el @sorcerer_icon![bs_spell|E] de [GetPerk('numina_conjuration_4_perk').GetName(GetPlayer)] invocando en su lugar un artefacto #FAMEDBLUE Afamado#!.\n$numina_conjuration_common_description$"
 NUMINA_CONJURATION_6_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Invoca un [GetTrait('demon').GetName(GetPlayer)] del Abismo. Selecciónate a ti mismo para invocar un Demonio aleatorio, o selecciona un personaje [GetTrait('demon').GetName(GetPlayer)] que tenga [GetModifier('trapped_in_abyss_modifier').GetNameWithTooltip] para invocarlo específicamente.\nMejora el @sorcerer_icon![bs_spell|E] de [GetPerk('numina_conjuration_4_perk').GetName(GetPlayer)] invocando en su lugar un artefacto #ILLUSTRIOUSPURPLE Ilustre#!.\nMejora el @sorcerer_icon![bs_spell|E] de [GetPerk('numina_conjuration_5_perk').GetName(GetPlayer)] eliminando el requisito de opinión.\n$numina_conjuration_common_description$"

 NUMINA_CONJURATION_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Conjuración#!#!"
 
 numina_conveyance_1_perk_name: "Transporte $numina_1_name$"
 numina_conveyance_2_perk_name: "Transporte $numina_2_name$"
 numina_conveyance_3_perk_name: "Transporte $numina_3_name$"
 numina_conveyance_4_perk_name: "Transporte $numina_4_name$"
 numina_conveyance_5_perk_name: "Transporte $numina_5_name$"
 numina_conveyance_6_perk_name: "Transporte $numina_6_name$"
 numina_conveyance_common_description: "#flavor Ya sea soñando con la teletransportación o con escobas voladoras, la gente siempre ha querido viajar rápidamente de un lugar a otro. Sin importar lo rápido que puedan hacerlo, nunca es lo bastante rápido, y muchos recurren a la magia y las ciencias extrañas para llegar a su destino mucho antes. Hasta que alcanzan las cimas del dominio de la Senda, un mago de tapadillo que usa la Senda del Transporte requiere algún tipo de vehículo, el cual es preparado para un único viaje por el mago.#!"
 
 NUMINA_CONVEYANCE_1_PERK_EFFECT: "$numina_conveyance_common_description$"
 NUMINA_CONVEYANCE_2_PERK_EFFECT: "$numina_conveyance_common_description$"
 NUMINA_CONVEYANCE_3_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Teletranspórtate a tu siguiente destino al viajar.\n$numina_conveyance_common_description$"
 NUMINA_CONVEYANCE_4_PERK_EFFECT: "$numina_conveyance_common_description$"
 NUMINA_CONVEYANCE_5_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Teletransporta un ejército que estés comandando a la localización del objetivo.\n$numina_conveyance_common_description$"
 NUMINA_CONVEYANCE_6_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de [GetPerk('numina_conveyance_5_perk').GetName(GetPlayer)] eliminando la limitación de tamaño del ejército.\n$numina_conveyance_common_description$"

 NUMINA_CONVEYANCE_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Transporte#!#!"
 
 numina_divination_1_perk_name: "Adivinación $numina_1_name$"
 numina_divination_2_perk_name: "Adivinación $numina_2_name$"
 numina_divination_3_perk_name: "Adivinación $numina_3_name$"
 numina_divination_4_perk_name: "Adivinación $numina_4_name$"
 numina_divination_5_perk_name: "Adivinación $numina_5_name$"
 numina_divination_6_perk_name: "Adivinación $numina_6_name$"
 numina_divination_common_description: "#flavor Leer hojas de té, lanzar runas o huesos, estudiar el cielo nocturno — todos estos son ejemplos de prácticas tradicionales de Adivinación, cuyas variantes abarcan multitud de culturas. Desde que existe el concepto de futuro, ha habido gente queriendo saber lo que les deparaba. Un mago de tapadillo que realiza actos de Adivinación intenta predecir el futuro. Sin embargo, el futuro es un embrollo siempre cambiante y confuso. Un hechicero puede usar la Adivinación para encontrar pistas sobre los resultados más probables, pero el vidente sabio conoce el valor de interpretar con precisión el simbolismo impreciso y onírico para juzgar los cambios probables de probabilidad.#!"
 
 NUMINA_DIVINATION_1_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n$numina_divination_common_description$"
 NUMINA_DIVINATION_2_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Descubre un secreto aleatorio del objetivo.\n$numina_divination_common_description$"
 NUMINA_DIVINATION_3_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n$numina_divination_common_description$"
 NUMINA_DIVINATION_4_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Descubre un plan aleatorio del objetivo.\nRecibirás una notificación si alguien intenta asesinar a tus amigos o familiares.\n$numina_divination_common_description$"
 NUMINA_DIVINATION_5_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Descubre un plan aleatorio que tenga como objetivo al objetivo.\n$countermeasures_unlocks_t3_all_seeing_eye$\n$numina_divination_common_description$"
 NUMINA_DIVINATION_6_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de [GetPerk('numina_divination_5_perk').GetName(GetPlayer)] deteniendo también el plan descubierto.\n$countermeasures_unlocks_t4_all_seeing_eye$\n$numina_divination_common_description$"

 NUMINA_DIVINATION_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Adivinación#!#!"
 
 numina_enchantment_1_perk_name: "Encantamiento $numina_1_name$"
 numina_enchantment_2_perk_name: "Encantamiento $numina_2_name$"
 numina_enchantment_3_perk_name: "Encantamiento $numina_3_name$"
 numina_enchantment_4_perk_name: "Encantamiento $numina_4_name$"
 numina_enchantment_5_perk_name: "Encantamiento $numina_5_name$"
 numina_enchantment_6_perk_name: "Encantamiento $numina_6_name$"
 numina_enchantment_common_description: "#flavor La Senda del Encantamiento recompensa la paciencia y la previsión más que ninguna otra Senda. No hay hechizos en esta Senda, solo rituales, incluyendo los largos y difíciles rituales de creación de objetos mágicos llamados Artefactos. Cada uno de estos Artefactos debe ser cuidadosamente elaborado por el Encantador. El primer paso es crear el objeto base mundano. Usualmente estos son fabricados a mano por el Encantador, llevando sus habilidades mundanas al límite para hacer justo el recipiente adecuado para su magia. A veces, sin embargo, el recipiente adecuado puede encontrarse en forma de un objeto raro o antiguo. Una vez que el recipiente ha sido hecho o encontrado, el Encantador puede pasar al proceso de infundir el objeto con energía mágica para ser usada más tarde.#!"

 NUMINA_ENCHANTMENT_1_PERK_EFFECT: "Mejora los nodos de fabricación básicos\n$numina_enchantment_common_description$"
 NUMINA_ENCHANTMENT_2_PERK_EFFECT: "Mejora los nodos de fabricación básicos\nDesbloquea versiones más débiles de los nodos de fabricación básicos para mejorar\n$numina_enchantment_common_description$"
 NUMINA_ENCHANTMENT_3_PERK_EFFECT: "Mejora los nodos de fabricación básicos y sus versiones de mejora\n$numina_enchantment_common_description$"
 NUMINA_ENCHANTMENT_4_PERK_EFFECT: "Mejora los nodos de fabricación básicos y sus versiones de mejora\n$unlock_forging_node$ Añade un modificador que aumenta una habilidad aleatoria ([GetModifier('enchantment_attribute_diplomacy_modifier').GetNameWithTooltip]) con un límite de 1 nodo de fabricación por sesión de artesanía\n$numina_enchantment_common_description$"
 NUMINA_ENCHANTMENT_5_PERK_EFFECT: "Mejora los nodos de fabricación básicos y sus versiones de mejora\nCambia el límite de [GetPerk('numina_enchantment_4_perk').GetName(GetPlayer)] de 1 a 2\n$numina_enchantment_common_description$"
 NUMINA_ENCHANTMENT_6_PERK_EFFECT: "Mejora los nodos de fabricación básicos y sus versiones de mejora\nElimina el límite de [GetPerk('numina_enchantment_4_perk').GetName(GetPlayer)] para forja, y lo aumenta para mejora\n$numina_enchantment_common_description$"

 NUMINA_ENCHANTMENT_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Encantamiento#!#!"
 
 numina_ephemera_1_perk_name: "Efímero $numina_1_name$"
 numina_ephemera_2_perk_name: "Efímero $numina_2_name$"
 numina_ephemera_3_perk_name: "Efímero $numina_3_name$"
 numina_ephemera_4_perk_name: "Efímero $numina_4_name$"
 numina_ephemera_5_perk_name: "Efímero $numina_5_name$"
 numina_ephemera_6_perk_name: "Efímero $numina_6_name$"
 numina_ephemera_common_description: "#flavor Algunos magos —aquellos que se centran en la Senda de la Nigromancia— comandan espíritus. Aquellos que siguen la Senda de lo Efímero buscan una relación de mayor familiaridad con ellos. Para los magos que usan la Senda de lo Efímero, su relación con los espíritus es más como familia y amigos que amo y sirviente. Cuando llaman a un espíritu, es una invitación, no una citación. En lugar de atar y comandar espíritus, la Senda de lo Efímero permite al mago negociar con ellos.#!"

 NUMINA_EPHEMERA_1_PERK_EFFECT: "Puede interactuar con personajes al otro lado de la Barrera.\n$numina_ephemera_common_description$"
 NUMINA_EPHEMERA_2_PERK_EFFECT: "Puede aprender #V 1#! idioma adicional sin penalizaciones.\n$numina_ephemera_common_description$"
 NUMINA_EPHEMERA_3_PERK_EFFECT: "Puede reclutar [GetMaA('jagglings').GetName] como hombres de armas.\n$numina_ephemera_common_description$"
 NUMINA_EPHEMERA_4_PERK_EFFECT: "$numina_ephemera_common_description$"
 NUMINA_EPHEMERA_5_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Realiza una quiminaje falsa para aumentar ligeramente el rango de un compañero espiritual #ONCLICK:FAITH,velvet_brood #TOOLTIP:FAITH,velvet_brood $Gaiano|L$#!#!.\n$numina_ephemera_common_description$"
 NUMINA_EPHEMERA_6_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de [GetPerk('numina_ephemera_5_perk').GetName(GetPlayer)] duplicando su efecto.\nElimina el coste de entrar en las [UmbraGlossary('spirit_wilds')].\nObtienes el rasgo #V [GetTrait('immortal').GetName(GetPlayer)]#!.\n$numina_ephemera_common_description$"

 NUMINA_EPHEMERA_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Efímero#!#!"
 
 numina_fascination_1_perk_name: "Fascinación $numina_1_name$"
 numina_fascination_2_perk_name: "Fascinación $numina_2_name$"
 numina_fascination_3_perk_name: "Fascinación $numina_3_name$"
 numina_fascination_4_perk_name: "Fascinación $numina_4_name$"
 numina_fascination_5_perk_name: "Fascinación $numina_5_name$"
 numina_fascination_6_perk_name: "Fascinación $numina_6_name$"
 numina_fascination_common_description: "#flavor Las historias del hechicero cautivador o el mago embrujador se encuentran en cuentos populares de todo el mundo. Pérfidos encantadores someten a los inocentes a su influjo, y los pactos de poder atrapan los corazones y las mentes de aquellos lo bastante insensatos como para entregar sus almas a tales tratos. La pizca de verdad de este viejo tópico es sólida como el diamante. Magos sin escrúpulos que doblegan las mentes de otros a su voluntad han practicado esta Senda desde que alguien deseó que otro simplemente actuara o pensara de manera agradable.#!"
 
 NUMINA_FASCINATION_1_PERK_EFFECT: "$numina_fascination_common_description$"
 NUMINA_FASCINATION_1_PERK_REASON: "[GetPerk('numina_fascination_1_perk').GetName(GetPlayer)]: $VALUE|0+=$"
 NUMINA_FASCINATION_2_PERK_EFFECT: "Desbloquea el plan [GetScheme('befriend').GetTypeName].\n$numina_fascination_common_description$"
 NUMINA_FASCINATION_3_PERK_EFFECT: "Los personajes son menos propensos a iniciar o unirse a facciones y a unirse a planes como agentes.\n$numina_fascination_common_description$"
 NUMINA_FASCINATION_3_PERK_REASON: "[GetPerk('numina_fascination_3_perk').GetName(GetPlayer)]: $VALUE|0+=$"
 NUMINA_FASCINATION_4_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Obtén un favor débil sobre el objetivo.\nTus amigos y mejores amigos a veces intentarán iniciar el plan [GetScheme('murder').GetTypeName] contra tus rivales.\n$numina_fascination_common_description$"
 NUMINA_FASCINATION_5_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de [GetPerk('numina_fascination_4_perk').GetName(GetPlayer)] obteniendo un favor fuerte en su lugar.\nTus amantes a veces intentarán iniciar el plan [GetScheme('murder').GetTypeName] contra tus rivales.\nObtienes fuertes defensas mentales.\n$numina_fascination_common_description$"
 NUMINA_FASCINATION_5_PERK_REASON: "[GetPerk('numina_fascination_5_perk').GetName(GetPlayer)]: $VALUE|0+=$"
 NUMINA_FASCINATION_6_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Disuelve todas las facciones y planes dirigidos contra el objetivo siempre que sus dueños no tengan fuertes defensas mentales.\n$numina_fascination_common_description$"
 NUMINA_FASCINATION_6_PERK_REASON: "[GetPerk('numina_fascination_6_perk').GetName(GetPlayer)]: $VALUE|0+=$"

 NUMINA_FASCINATION_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Fascinación#!#!"
 
