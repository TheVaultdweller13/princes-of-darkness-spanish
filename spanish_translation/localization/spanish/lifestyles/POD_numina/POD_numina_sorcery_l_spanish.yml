 numina_fortune_2_perk_name: "Fortuna $numina_2_name$"
 numina_fortune_3_perk_name: "Fortuna $numina_3_name$"
 numina_fortune_4_perk_name: "Fortuna $numina_4_name$"
 numina_fortune_5_perk_name: "Fortuna $numina_5_name$"
 numina_fortune_6_perk_name: "Fortuna $numina_6_name$"
 numina_fortune_common_description: "#flavor El destino es voluble, incluso antes de tener en cuenta las manipulaciones de los magos. La Senda de la Fortuna les permite esgrimir la suerte como un arma, abatiendo a sus enemigos con maldiciones o fortaleciendo a sus aliados con bendiciones. Aunque los métodos y las explicaciones pueden variar, desde el Mal de Ojo, hasta la Mano de Dios, pasando por la manipulación de probabilidades, la Senda de la Fortuna nunca hace que suceda lo verdaderamente imposible, solo lo extremadamente improbable. También es una de las Sendas menos precisas: Aunque el mago de tapadillo pone la Fortuna en movimiento y controla la magnitud y el rango general de resultados potenciales, los efectos de esta Senda a menudo les sorprenden o desaparecen en el ruido de la vida diaria.#!"
 
 NUMINA_FORTUNE_1_PERK_EFFECT: "$numina_fortune_common_description$"
 NUMINA_FORTUNE_2_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Maldice a un objetivo de tipo mortal (ej. [GetTrait('ghoul').GetName(GetNullCharacter)], [GetTrait('revenant').GetName(GetNullCharacter)], [GetTrait('kinfolk').GetName(GetNullCharacter)]) para que resulte herido.\n@sorcerer_icon![bs_spell|E]: Bendice a tu objetivo otorgando [GetModifier('numina_fortune_2_bless_modifier').GetNameWithTooltip].\n$numina_fortune_common_description$"
 NUMINA_FORTUNE_3_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Realiza un ritual de zahorí para ganar [gold_i]#V 50#!.\nMejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_fortune_2_perk #L Maldecir#!#! empeorando las heridas causadas.\nMejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_fortune_2_perk #L Bendecir#!#! otorgando en su lugar [GetModifier('numina_fortune_3_bless_modifier').GetNameWithTooltip].\n$numina_fortune_common_description$"
 NUMINA_FORTUNE_4_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_fortune_2_perk #L Maldecir#!#! mutilando al objetivo.\nMejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_fortune_2_perk #L Bendecir#!#! otorgando en su lugar [GetModifier('numina_fortune_4_bless_modifier').GetNameWithTooltip].\nMejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_fortune_3_perk #L Zahorí#!#! aumentando el rendimiento a [gold_i]#V 100#!.\n$numina_fortune_common_description$"
 NUMINA_FORTUNE_5_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_fortune_2_perk #L Maldecir#!#! permitiendo que afecte a cualquier tipo corpóreo menor de #V 500#! años.\nMejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_fortune_2_perk #L Bendecir#!#! otorgando en su lugar [GetModifier('numina_fortune_5_bless_modifier').GetNameWithTooltip].\nMejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_fortune_3_perk #L Zahorí#!#! aumentando el rendimiento a [gold_i]#V 150#!.\n$numina_fortune_common_description$"
 NUMINA_FORTUNE_6_PERK_EFFECT: "Mejora el [bs_spell|E] de #TOOLTIP:PERK,numina_fortune_2_perk #L Maldecir#!#! permitiendo que afecte a cualquier tipo.\nMejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_fortune_2_perk #L Bendecir#!#! otorgando en su lugar [GetModifier('numina_fortune_6_bless_modifier').GetNameWithTooltip].\nMejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_fortune_3_perk #L Zahorí#!#! aumentando el rendimiento a [gold_i]#V 200#!.\n$numina_fortune_common_description$"

 NUMINA_FORTUNE_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Fortuna#!#!"
 
 numina_healing_1_perk_name: "Curación $numina_1_name$"
 numina_healing_2_perk_name: "Curación $numina_2_name$"
 numina_healing_3_perk_name: "Curación $numina_3_name$"
 numina_healing_4_perk_name: "Curación $numina_4_name$"
 numina_healing_5_perk_name: "Curación $numina_5_name$"
 numina_healing_6_perk_name: "Curación $numina_6_name$"
 numina_healing_common_description: "#flavor Dondequiera que prospera la humanidad, hay necesidad de curación. Desde el alba de la civilización, los sanadores surgieron de la empatía y la necesidad comunitaria, aprendieron a servir a su gente de la tradición, la comunión con espíritus, el ensayo y error, y una multitud de otras maneras.#!"
 
 NUMINA_HEALING_1_PERK_EFFECT: "$numina_healing_common_description$"
 NUMINA_HEALING_2_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Cura una enfermedad trivial como [GetTrait('ill').GetName(GetPlayer)] o [GetTrait('sickly').GetName(GetPlayer)].\n@sorcerer_icon![bs_spell|E]: Sana [EmptyScope.ScriptValue('POD_numina_sorcery_healing_2_heal')|V0] [POD_superficial_damage_with_box|E].\n$numina_healing_common_description$"
 NUMINA_HEALING_3_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_healing_2_perk #L Sanar#!#! curando también [GetTrait('disfigured').GetName(GetPlayer)].\n$numina_healing_common_description$"
 NUMINA_HEALING_4_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_healing_2_perk #L Curar#!#! curando también enfermedades más graves como [GetTrait('pneumonic').GetName(GetPlayer)], [GetTrait('consumption').GetName(GetPlayer)], etc.\n$numina_healing_common_description$"
 NUMINA_HEALING_5_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_healing_2_perk #L Sanar#!#! aumentando la cantidad sanada a [EmptyScope.ScriptValue('POD_numina_sorcery_healing_5_heal')|V0] [POD_superficial_damage_with_box|E] y [EmptyScope.ScriptValue('POD_numina_sorcery_healing_5_aggravated_heal')|V0] [POD_aggravated_damage_with_box|E]. También cura rasgos de mutilación como [GetTrait('one_eyed').GetName(GetPlayer)], [GetTrait('maimed').GetName(GetPlayer)], etc.\nMejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_healing_2_perk #L Curar#!#! curando también enfermedades incurables como [GetTrait('cancer').GetName(GetPlayer)] o [GetTrait('infirm').GetName(GetPlayer)].\n$numina_healing_common_description$"
 NUMINA_HEALING_6_PERK_EFFECT: "Casillas de salud: #P +1#!\nMejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_healing_2_perk #L Sanar#!#! aumentando la cantidad sanada a [EmptyScope.ScriptValue('POD_numina_sorcery_healing_6_heal')|V0] [POD_superficial_damage_with_box|E] y [EmptyScope.ScriptValue('POD_numina_sorcery_healing_6_aggravated_heal')|V0] [POD_aggravated_damage_with_box|E].\nMejora el @sorcerer_icon![bs_spell|E] de #TOOLTIP:PERK,numina_healing_2_perk #L Curar#!#! curando también enfermedades sobrenaturales como [GetTrait('chulorviosis').GetName(GetPlayer)] o [GetTrait('crimson_fever').GetName(GetPlayer)].\nObtienes el rasgo #V [GetTrait('immortal').GetName(GetPlayer)]#!.\n$numina_healing_common_description$"

 NUMINA_HEALING_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Curación#!#!"
 
 numina_hellfire_1_perk_name: "Fuego Infernal $numina_1_name$"
 numina_hellfire_2_perk_name: "Fuego Infernal $numina_2_name$"
 numina_hellfire_3_perk_name: "Fuego Infernal $numina_3_name$"
 numina_hellfire_4_perk_name: "Fuego Infernal $numina_4_name$"
 numina_hellfire_5_perk_name: "Fuego Infernal $numina_5_name$"
 numina_hellfire_6_perk_name: "Fuego Infernal $numina_6_name$"
 numina_hellfire_common_description: "#flavor Se rumorea que es el resultado de tratos infernales, el Fuego Infernal otorga a su lanzador poderes destructivos masivos. Aunque generalmente invoca fuego, se han observado variantes que conjuran relámpagos, aguanieve, tormentas de arena, terremotos o humo. La Senda del Fuego Infernal no tiene poderes individuales, el avance adicional solo permite conjurar fuerzas más destructivas.#!"
 
 NUMINA_HELLFIRE_1_PERK_EFFECT: "$numina_hellfire_common_description$"
 NUMINA_HELLFIRE_2_PERK_EFFECT: "$numina_hellfire_common_description$"
 NUMINA_HELLFIRE_3_PERK_EFFECT: "$numina_hellfire_common_description$"
 NUMINA_HELLFIRE_4_PERK_EFFECT: "$numina_hellfire_common_description$"
 NUMINA_HELLFIRE_5_PERK_EFFECT: "Al inicio de la batalla cuando actúas como comandante: Inflige [EmptyScope.ScriptValue('POD_numina_hellfire_5_damage')|V0] [POD_aggravated_damage_with_box|E].\n$numina_hellfire_common_description$"
 NUMINA_HELLFIRE_6_PERK_EFFECT: "Mejora el daño de [GetPerk('numina_hellfire_5_perk').GetName(GetPlayer)] a [EmptyScope.ScriptValue('POD_numina_hellfire_6_damage')|V0] [POD_aggravated_damage_with_box|E].\n$numina_hellfire_common_description$"

 NUMINA_HELLFIRE_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Fuego Infernal#!#!"
 
 numina_illusion_1_perk_name: "Ilusión $numina_1_name$"
 numina_illusion_2_perk_name: "Ilusión $numina_2_name$"
 numina_illusion_3_perk_name: "Ilusión $numina_3_name$"
 numina_illusion_4_perk_name: "Ilusión $numina_4_name$"
 numina_illusion_5_perk_name: "Ilusión $numina_5_name$"
 numina_illusion_6_perk_name: "Ilusión $numina_6_name$"
 numina_illusion_common_description: "#flavor Una de las magias más fundamentales es el poder de engañar a otros para que crean lo que el mago quiere. La Senda de la Ilusión confunde los sentidos, haciendo que sus objetivos perciban cosas que no están ahí o alterando su percepción de lo que sí está. La mayoría de la gente confía en sus sentidos. 'Ver para creer', pero cuando un ilusionista está cerca, este viejo adagio puede matarte.#!"

 NUMINA_ILLUSION_1_PERK_EFFECT: "Aumenta la probabilidad de éxito de la decisión [GetDecision('escape_from_prison_decision').GetName].\n$numina_illusion_common_description$"
 NUMINA_ILLUSION_2_PERK_EFFECT: "Al inicio de una guerra, invoca un ejército de #V 100#! [GetMaA('illusionary_combatants').GetName] durante la duración de dicha guerra.\n$countermeasures_unlocks_t1_obfuscated_court$\n$numina_illusion_common_description$"
 NUMINA_ILLUSION_3_PERK_EFFECT: "Mejora [GetPerk('numina_illusion_2_perk').GetName(GetPlayer)] aumentando el número de [GetMaA('illusionary_combatants').GetName] invocados a #V 250#!.\n$countermeasures_unlocks_t2_obfuscated_court$\n$numina_illusion_common_description$"
 NUMINA_ILLUSION_4_PERK_EFFECT: "Mejora [GetPerk('numina_illusion_2_perk').GetName(GetPlayer)] aumentando el número de [GetMaA('illusionary_combatants').GetName] invocados a #V 500#!.\n$numina_illusion_common_description$"
 NUMINA_ILLUSION_5_PERK_EFFECT: "Mejora [GetPerk('numina_illusion_2_perk').GetName(GetPlayer)] aumentando el número de [GetMaA('illusionary_combatants').GetName] invocados a #V 1000#!.\n$countermeasures_unlocks_t3_obfuscated_court$\n$numina_illusion_common_description$"
 NUMINA_ILLUSION_6_PERK_EFFECT: "Aumenta enormemente la probabilidad de éxito de la decisión [GetDecision('escape_from_prison_decision').GetName].\n$countermeasures_unlocks_t4_obfuscated_court$\n$numina_illusion_common_description$"

 NUMINA_ILLUSION_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Ilusión#!#!"
 
 numina_necromancy_1_perk_name: "Nigromancia $numina_1_name$"
 numina_necromancy_2_perk_name: "Nigromancia $numina_2_name$"
 numina_necromancy_3_perk_name: "Nigromancia $numina_3_name$"
 numina_necromancy_4_perk_name: "Nigromancia $numina_4_name$"
 numina_necromancy_5_perk_name: "Nigromancia $numina_5_name$"
 numina_necromancy_6_perk_name: "Nigromancia $numina_6_name$"
 numina_necromancy_common_description: "#flavor Algunas cosas deberían permanecer enterradas. La principal entre ellas: los muertos. Pero aquellos que siguen la Senda de la Nigromancia ven las cosas de manera un poco diferente. Como el Fuego Infernal, la Nigromancia tiene reputación de ser vil, practicada solo por los peores de los peores. A diferencia del Fuego Infernal, esta reputación está al menos algo merecida.#!"
 
 NUMINA_NECROMANCY_1_PERK_EFFECT: "Puede interactuar con personajes al otro lado del Velo.\n$POD_can_summon_on_death_trigger_loca$\n$numina_necromancy_common_description$"
 NUMINA_NECROMANCY_2_PERK_EFFECT: "$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n$numina_necromancy_common_description$"
 NUMINA_NECROMANCY_3_PERK_EFFECT: "Desbloquea [GetMaA('hidden').GetName], [GetMaA('walker').GetName], [GetMaA('shambler').GetName] y [GetMaA('skeletons').GetName] como hombres de armas.\n$POD_can_command_wraith_trigger_loca$\n$numina_necromancy_common_description$"
 NUMINA_NECROMANCY_4_PERK_EFFECT: "$unlock_forging_node$ Sacrifica un prisionero $POD_splat_wraith$ para mejorar el artefacto basado en los rasgos del sacrificio\n$numina_necromancy_common_description$"
 NUMINA_NECROMANCY_5_PERK_EFFECT: "$numina_necromancy_common_description$"
 NUMINA_NECROMANCY_6_PERK_EFFECT: "$numina_necromancy_common_description$"

 NUMINA_NECROMANCY_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Nigromancia#!#!"
 
 numina_oneiromancy_1_perk_name: "Oniromancia $numina_1_name$"
 numina_oneiromancy_2_perk_name: "Oniromancia $numina_2_name$"
 numina_oneiromancy_3_perk_name: "Oniromancia $numina_3_name$"
 numina_oneiromancy_4_perk_name: "Oniromancia $numina_4_name$"
 numina_oneiromancy_5_perk_name: "Oniromancia $numina_5_name$"
 numina_oneiromancy_6_perk_name: "Oniromancia $numina_6_name$"
 numina_oneiromancy_common_description: "#flavor Los magos que aprenden la Senda de la Oniromancia aprenden a caminar dentro de los sueños de otros. Una vez allí, intentan tomar el control, y pueden recabar información o alterar los sueños en beneficio o perjuicio del soñador. En la cima de su poder, los oniromantes pueden incluso reunir a varias personas en un sueño compartido. Según la leyenda, algunos pueden incluso hacer los sueños realidad o volverse capaces de entrar físicamente en los sueños.#!"
 
 NUMINA_ONEIROMANCY_1_PERK_EFFECT: "$numina_oneiromancy_common_description$"
 NUMINA_ONEIROMANCY_2_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Inflige [stress_i]#V 15#! de estrés al objetivo. El objetivo también tiene una probabilidad del #V 5%#! de ganar un mecanismo de afrontamiento negativo aleatorio y una probabilidad del #V 2.5%#! de sufrir una enfermedad mental aleatoria.\n$numina_oneiromancy_common_description$"
 NUMINA_ONEIROMANCY_3_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de [GetPerk('numina_oneiromancy_2_perk').GetName(GetPlayer)] aumentando el estrés a [stress_i]#V 25#!, la probabilidad de un mecanismo de afrontamiento negativo al #V 10%#!, y la probabilidad de una enfermedad mental al #V 5%#!.\n$numina_oneiromancy_common_description$"
 NUMINA_ONEIROMANCY_4_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de [GetPerk('numina_oneiromancy_2_perk').GetName(GetPlayer)] aumentando el estrés a [stress_i]#V 50#!, la probabilidad de un mecanismo de afrontamiento negativo al #V 20%#!, y la probabilidad de una enfermedad mental al #V 10%#!.\n$numina_oneiromancy_common_description$"
 NUMINA_ONEIROMANCY_5_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de [GetPerk('numina_oneiromancy_2_perk').GetName(GetPlayer)] aumentando el estrés a [stress_i]#V 75#!, la probabilidad de un mecanismo de afrontamiento negativo al #V 30%#!, y la probabilidad de una enfermedad mental al #V 15%#!.\n$numina_oneiromancy_common_description$"
 NUMINA_ONEIROMANCY_6_PERK_EFFECT: "Mejora el @sorcerer_icon![bs_spell|E] de [GetPerk('numina_oneiromancy_2_perk').GetName(GetPlayer)] aumentando el estrés a [stress_i]#V 100#!, la probabilidad de un mecanismo de afrontamiento negativo al #V 50%#!, y la probabilidad de una enfermedad mental al #V 25%#!.\nDesbloquea [GetMaA('night_elves').GetName], [GetMaA('goblins').GetName], [GetMaA('duergar').GetName] y [GetMaA('nuckelavee').GetName] como hombres de armas.\n$numina_oneiromancy_common_description$"

 NUMINA_ONEIROMANCY_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Oniromancia#!#!"
 
 numina_quintessence_manipulation_1_perk_name: "Manipulación de la Quintaesencia $numina_1_name$"
 numina_quintessence_manipulation_2_perk_name: "Manipulación de la Quintaesencia $numina_2_name$"
 numina_quintessence_manipulation_3_perk_name: "Manipulación de la Quintaesencia $numina_3_name$"
 numina_quintessence_manipulation_4_perk_name: "Manipulación de la Quintaesencia $numina_4_name$"
 numina_quintessence_manipulation_5_perk_name: "Manipulación de la Quintaesencia $numina_5_name$"
 numina_quintessence_manipulation_6_perk_name: "Manipulación de la Quintaesencia $numina_6_name$"
 numina_quintessence_manipulation_common_description: "#flavor Casi todos los hechiceros pueden estar de acuerdo en un hecho. Hay un flujo de poder que alimenta sus obras. El nombre de ese poder ha adoptado multitud de rostros y filosofías: maná, qi, gnosis, shakti, sekhem y muchos otros. Cada mago puede describir el flujo de energía mientras imponen su voluntad sobre la realidad. Surcándolos como carga a través de un cable eléctrico, puede sentirse, y para algunos puede ser directamente aprovechado.#!"
 
 NUMINA_QUINTESSENCE_MANIPULATION_1_PERK_EFFECT: "Puede usar artefactos fetiche\nInflige el modificador [GetModifier('numina_sorcery_quintessence_manipulation_malus_modifier').GetNameWithTooltip] a los caballeros enemigos [GetTrait('werewolf').GetName(GetPlayer)] cuando actúas como comandante durante la fase de combate, o a tu adversario durante duelos singulares.\n$numina_quintessence_manipulation_common_description$"
 NUMINA_QUINTESSENCE_MANIPULATION_2_PERK_EFFECT: "Puede usar artefactos de Chi\nInflige el modificador [GetModifier('numina_sorcery_quintessence_manipulation_malus_modifier').GetNameWithTooltip] a los caballeros enemigos [GetTrait('kueijin').GetName(GetPlayer)] cuando actúas como comandante durante la fase de combate, o a tu adversario durante duelos singulares.\n$numina_quintessence_manipulation_common_description$"
 NUMINA_QUINTESSENCE_MANIPULATION_3_PERK_EFFECT: "Puede usar artefactos demoníacos\nInflige el modificador [GetModifier('numina_sorcery_quintessence_manipulation_malus_modifier').GetNameWithTooltip] a los caballeros enemigos [GetTrait('demon').GetName(GetPlayer)] cuando actúas como comandante durante la fase de combate, o a tu adversario durante duelos singulares.\n$numina_quintessence_manipulation_common_description$"
 NUMINA_QUINTESSENCE_MANIPULATION_4_PERK_EFFECT: "Puede usar artefactos Feéricos\nInflige el modificador [GetModifier('numina_sorcery_quintessence_manipulation_malus_modifier').GetNameWithTooltip] a los caballeros enemigos [GetTrait('fae').GetName(GetPlayer)] cuando actúas como comandante durante la fase de combate, o a tu adversario durante duelos singulares.\n$numina_quintessence_manipulation_common_description$"
 NUMINA_QUINTESSENCE_MANIPULATION_5_PERK_EFFECT: "Puede usar artefactos de Magia\nInflige el modificador [GetModifier('numina_sorcery_quintessence_manipulation_malus_modifier').GetNameWithTooltip] a los caballeros enemigos [GetTrait('mage').GetName(GetPlayer)] cuando actúas como comandante durante la fase de combate, o a tu adversario durante duelos singulares.\n$numina_quintessence_manipulation_common_description$"
 NUMINA_QUINTESSENCE_MANIPULATION_6_PERK_EFFECT: "Inflige el modificador [GetModifier('numina_sorcery_quintessence_manipulation_6_malus_modifier').GetNameWithTooltip] a los caballeros enemigos cuando actúas como comandante durante la fase de combate, o a tu adversario durante duelos singulares.\n$numina_quintessence_manipulation_common_description$"

 NUMINA_QUINTESSENCE_MANIPULATION_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Manipulación de la Quintaesencia#!#!"
 
 numina_shadows_1_perk_name: "Sombras $numina_1_name$"
 numina_shadows_2_perk_name: "Sombras $numina_2_name$"
 numina_shadows_3_perk_name: "Sombras $numina_3_name$"
 numina_shadows_4_perk_name: "Sombras $numina_4_name$"
 numina_shadows_5_perk_name: "Sombras $numina_5_name$"
 numina_shadows_6_perk_name: "Sombras $numina_6_name$"
 numina_shadows_common_description: "#flavor El poder sobre la oscuridad es un cliché al que algunos hechiceros no tienen problema en aferrarse por alegría irónica o creencia genuina. Uno no andaría desacertado al suponer la Senda de las Sombras como la fuente del concepto de que las fuerzas oscuras potencian las artes místicas, dado lo a menudo que los charlatanes hacen tal afirmación. Independientemente de su reputación, la Senda conlleva un aire amenazador e intimidante, ya que da forma y desplaza la sustancia del miedo instintivo — las sombras y la oscuridad.#!"
 
 NUMINA_SHADOWS_1_PERK_EFFECT: "$numina_shadows_common_description$"
 NUMINA_SHADOWS_2_PERK_EFFECT: "Inflige el modificador [GetModifier('numina_shadows_2_modifier').GetNameWithTooltip] durante #V 6 meses#! a los caballeros enemigos cuando actúas como comandante durante la fase de combate, o a tu adversario durante duelos singulares.\n$numina_shadows_common_description$"
 NUMINA_SHADOWS_3_PERK_EFFECT: "Mejora el modificador de [GetPerk('numina_shadows_2_perk').GetName(GetPlayer)] a [GetModifier('numina_shadows_3_modifier').GetNameWithTooltip].\n$numina_shadows_common_description$"
 NUMINA_SHADOWS_4_PERK_EFFECT: "Mejora el modificador de [GetPerk('numina_shadows_2_perk').GetName(GetPlayer)] a [GetModifier('numina_shadows_4_modifier').GetNameWithTooltip].\n$numina_shadows_common_description$"
 NUMINA_SHADOWS_5_PERK_EFFECT: "Mejora el modificador de [GetPerk('numina_shadows_2_perk').GetName(GetPlayer)] a [GetModifier('numina_shadows_5_modifier').GetNameWithTooltip].\n$numina_shadows_common_description$"
 NUMINA_SHADOWS_6_PERK_EFFECT: "Mejora el modificador de [GetPerk('numina_shadows_2_perk').GetName(GetPlayer)] a [GetModifier('numina_shadows_6_modifier').GetNameWithTooltip].\n$numina_shadows_common_description$"

 NUMINA_SHADOWS_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Sombras#!#!"
 
 numina_shapeshifting_1_perk_name: "Cambio de Forma $numina_1_name$"
 numina_shapeshifting_2_perk_name: "Cambio de Forma $numina_2_name$"
 numina_shapeshifting_3_perk_name: "Cambio de Forma $numina_3_name$"
 numina_shapeshifting_4_perk_name: "Cambio de Forma $numina_4_name$"
 numina_shapeshifting_5_perk_name: "Cambio de Forma $numina_5_name$"
 numina_shapeshifting_6_perk_name: "Cambio de Forma $numina_6_name$"
 numina_shapeshifting_common_description: "#flavor Incluso entre las magias primigenias, la capacidad de transformarse en un animal destaca como excepcional. Muchos monstruos que acechan la noche tienen el poder de la transformación, incluyendo aquellos que son auténticos cambiaformas. Los magos de tapadillo que estudian la Senda del Cambio de Forma imitan una cierta cantidad de su poder, transformando primero partes de sí mismos y más tarde todo su cuerpo de maneras dramáticas.#!"
 
 NUMINA_SHAPESHIFTING_1_PERK_EFFECT: "Opción de cambio de forma: Cambia tus rasgos faciales.\nOpción de cambio de forma: Cambia tu edad visual (si eres inmortal).\n$numina_shapeshifting_common_description$"
 NUMINA_SHAPESHIFTING_2_PERK_EFFECT: "Opción de cambio de forma: Transfórmate en tu #V Forma Bestial#!.\nOpción de cambio de forma: Compra hasta #V 2#! partes animales para incorporar a tu #V Forma Bestial#!, o mejora una parte existente.\n$numina_shapeshifting_common_description$"
 NUMINA_SHAPESHIFTING_3_PERK_EFFECT: "Obtén #V 2#! partes animales adicionales para incorporar a tu #V Forma Bestial#!.\nOpción de cambio de forma: Transfórmate en varias formas animales.\n$numina_shapeshifting_common_description$"
 NUMINA_SHAPESHIFTING_4_PERK_EFFECT: "Obtén #V 4#! partes animales adicionales para incorporar a tu #V Forma Bestial#!.\n$numina_shapeshifting_common_description$"
 NUMINA_SHAPESHIFTING_5_PERK_EFFECT: "Obtén #V 2#! partes animales adicionales para incorporar a tu #V Forma Bestial#!.\n$numina_shapeshifting_common_description$"
 NUMINA_SHAPESHIFTING_6_PERK_EFFECT: "Obtén #V 5#! partes animales adicionales para incorporar a tu #V Forma Bestial#!.\nOpción de cambio de forma: Transfórmate en criaturas míticas.\nOpción de cambio de forma: Cambia tus rasgos físicos.\n$numina_shapeshifting_common_description$"

 NUMINA_SHAPESHIFTING_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Cambio de Forma#!#!"
 
 numina_weather_control_1_perk_name: "Control Climático $numina_1_name$"
 numina_weather_control_2_perk_name: "Control Climático $numina_2_name$"
 numina_weather_control_3_perk_name: "Control Climático $numina_3_name$"
 numina_weather_control_4_perk_name: "Control Climático $numina_4_name$"
 numina_weather_control_5_perk_name: "Control Climático $numina_5_name$"
 numina_weather_control_6_perk_name: "Control Climático $numina_6_name$"
 numina_weather_control_common_description: "#flavor En sociedades que dependían en gran medida de la agricultura o la navegación, aquellos que podían controlar el clima eran apreciados, siendo a menudo la diferencia entre la vida y la muerte en sus comunidades. Se han prevenido o terminado hambrunas, y se sabe que los hechiceros más poderosos han disipado o desviado desastres naturales. El Control Climático permite a los hechiceros hacer lo que dice el nombre — pueden controlar el clima.#!"
 
 NUMINA_WEATHER_CONTROL_1_PERK_EFFECT: "Puede predecir peligros naturales\n$numina_weather_control_common_description$"
 NUMINA_WEATHER_CONTROL_2_PERK_EFFECT: "$numina_weather_control_common_description$"
 NUMINA_WEATHER_CONTROL_3_PERK_EFFECT: "Puede prevenir o fortalecer peligros naturales\n$numina_weather_control_common_description$"
 NUMINA_WEATHER_CONTROL_4_PERK_EFFECT: "$numina_weather_control_common_description$"
 NUMINA_WEATHER_CONTROL_5_PERK_EFFECT: "@sorcerer_icon![bs_spell|E]: Provoca peligros naturales en reinos menores de 50 condados\n$numina_weather_control_common_description$"
 NUMINA_WEATHER_CONTROL_6_PERK_EFFECT: "Mejora [GetPerk('numina_weather_control_5_perk').GetName(GetPlayer)] eliminando el límite de tamaño del reino.\n$numina_weather_control_common_description$"

 NUMINA_WEATHER_CONTROL_6_PERK_FLAG_REQUIREMENT: "#X @warning_icon! ¡Primero debes completar el viaje #V Estudiar Archimaestría de Tapadillo: Control Climático#!#!"