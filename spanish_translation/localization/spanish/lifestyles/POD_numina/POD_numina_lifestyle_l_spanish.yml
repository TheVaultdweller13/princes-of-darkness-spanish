 psychokinesis_2_perk_name: "Psicoquinesis 2"
 psychokinesis_3_perk_name: "Psicoquinesis 3"
 psychokinesis_4_perk_name: "Psicoquinesis 4"
 psychokinesis_5_perk_name: "Psicoquinesis 5"

 PSYCHOKINESIS_1_PERK_EFFECT: "#weak La Psicoquinesis, también llamada telequinesis, permite al psíquico mover objetos sin tocarlos.\nEl psíquico puede levantar medio kilogramo.#!"
 PSYCHOKINESIS_2_PERK_EFFECT: "#weak El psíquico puede levantar 10 kilogramos.#!"
 PSYCHOKINESIS_3_PERK_EFFECT: "#weak El psíquico puede levantar 100 kilogramos.#!"
 PSYCHOKINESIS_4_PERK_EFFECT: "#weak El psíquico puede levantar 250 kilogramos.#!"
 PSYCHOKINESIS_5_PERK_EFFECT: "#weak El psíquico puede levantar 500 kilogramos.#!"

 psychometry_1_perk_name: "Psicometría 1"
 psychometry_2_perk_name: "Psicometría 2"
 psychometry_3_perk_name: "Psicometría 3"
 psychometry_4_perk_name: "Psicometría 4"
 psychometry_5_perk_name: "Psicometría 5"

 PSYCHOMETRY_1_PERK_EFFECT: "Desbloquea la [buy_artifact_claim_interaction|E].\nCoste de [buy_claim_interaction|E] y [buy_artifact_claim_interaction|E]: #P -10%#!\n#weak A través del tacto, el psíquico puede aprender algo sobre un objeto y las personas que interactuaron con él en el pasado.\nEl psíquico puede leer la resonancia psíquica general de un objeto para obtener una imagen aproximada.#!"
 PSYCHOMETRY_2_PERK_EFFECT: "Coste de [buy_claim_interaction|E] y [buy_artifact_claim_interaction|E]: #P -10%#!\n#weak El psíquico puede ver eventos que ocurrieron cerca del objeto en las últimas 24 horas.#!"
 PSYCHOMETRY_3_PERK_EFFECT: "Coste de [buy_claim_interaction|E] y [buy_artifact_claim_interaction|E]: #P -10%#!\n#weak El psíquico puede descubrir y comprender la historia completa del objeto o lugar.#!"
 PSYCHOMETRY_4_PERK_EFFECT: "Coste de [buy_claim_interaction|E] y [buy_artifact_claim_interaction|E]: #P -10%#!\n#weak El psíquico puede sintonizarse con un objeto, permitiéndole alinear su visión con la localización del dueño del objeto.#!"
 PSYCHOMETRY_5_PERK_EFFECT: "Coste de [buy_claim_interaction|E] y [buy_artifact_claim_interaction|E]: #P -10%#!\nComo [character_interaction|E], puede invocar/robar un [artifact|E] reclamado tras ganar un duelo de administración.\n#weak El psíquico obtiene una imagen clara de cualquier evento resonante que tuvo lugar cerca del objeto y puede seguir su rastro psíquico.#!"

 psychoportation_1_perk_name: "Salto Corto"
 psychoportation_2_perk_name: "Salto Simple"
 psychoportation_3_perk_name: "Salto Largo"
 psychoportation_4_perk_name: "Salto Muy Largo"
 psychoportation_5_perk_name: "Salto a Ciegas"

 PSYCHOPORTATION_1_PERK_EFFECT: "#weak Usando su mente, el psíquico puede teleportarse a corta distancia.\nEl psíquico puede teleportarse a una distancia corta dentro de su campo de visión.#!"
 PSYCHOPORTATION_2_PERK_EFFECT: "Como [character_interaction|E], te permite teleportar tu ejército a la localización de tu objetivo, o teleportarte a tu siguiente destino al viajar. La distancia máxima equivale a un reino pequeño (ejemplo: de Gales de arriba a abajo)\n#weak El psíquico puede teleportarse a través de distancias mayores.#!"
 PSYCHOPORTATION_3_PERK_EFFECT: "Aumenta la distancia máxima de [GetPerk('psychoportation_2_perk').GetName( GetNullCharacter )] a un reino grande (ejemplo: de Francia de arriba a abajo)\n#weak El psíquico puede teleportarse a través de distancias considerables.#!"
 PSYCHOPORTATION_4_PERK_EFFECT: "Aumenta la distancia máxima de [GetPerk('psychoportation_2_perk').GetName( GetNullCharacter )] a un reino masivo (ejemplo: del Sacro Imperio Romano de izquierda a derecha)\n#weak El psíquico puede teleportarse a través de distancias aún mayores.#!"
 PSYCHOPORTATION_5_PERK_EFFECT: "Elimina el límite de distancia de [GetPerk('psychoportation_2_perk').GetName( GetNullCharacter )]\n#weak El psíquico ya no necesita ver el destino para su teleportación.#!"

 pyrokinesis_1_perk_name: "Cerillas"
 pyrokinesis_2_perk_name: "Ignición"
 pyrokinesis_3_perk_name: "Fuegos Artificiales"
 pyrokinesis_4_perk_name: "Pirotécnia"
 pyrokinesis_5_perk_name: "Infierno"

 PYROKINESIS_1_PERK_EFFECT: "#weak El psíquico puede invocar fuego.\nEl psíquico puede producir una pequeña llama suficiente para encender una vela o un cigarrillo.#!"
 PYROKINESIS_2_PERK_EFFECT: "#weak El psíquico puede hacer que objetos inflamables ardan.#!"
 PYROKINESIS_3_PERK_EFFECT: "#weak El psíquico puede producir pequeñas ráfagas de llamas de la nada.#!"
 PYROKINESIS_4_PERK_EFFECT: "#weak El psíquico puede dar a las llamas invocadas una dirección general.#!"
 PYROKINESIS_5_PERK_EFFECT: "#weak El psíquico puede provocar llamaradas más grandes y dirigirlas a voluntad.#!"

 soulstealing_1_perk_name: "Invasión Onírica"
 soulstealing_2_perk_name: "Minar la Voluntad"
 soulstealing_3_perk_name: "Drenar Esencia Vital"
 soulstealing_4_perk_name: "Transferir Vida"
 soulstealing_5_perk_name: "Robo de Gnosis"

 SOULSTEALING_1_PERK_EFFECT: "#weak El Robo de Almas drena la esencia de su objetivo para fortalecer al psíquico.\nEl psíquico puede entrar en el paisaje onírico de un objetivo.#!"
 SOULSTEALING_2_PERK_EFFECT: "Como [character_interaction|E], te permite perder estrés drenando la fuerza de voluntad de un prisionero.\n#weak El psíquico puede robar Fuerza de Voluntad temporal del objetivo.#!"
 SOULSTEALING_3_PERK_EFFECT: "Como [character_interaction|E], te permite obtener sangre de un prisionero.\n#weak El psíquico puede robar fuerza vital del objetivo.#!"
 SOULSTEALING_4_PERK_EFFECT: "Como [character_interaction|E], te permite curar heridas drenando la fuerza vital de un prisionero.\n#weak El psíquico puede transferir la fuerza vital robada a otro objetivo.#!"
 SOULSTEALING_5_PERK_EFFECT: "Como [character_interaction|E], te permite drenar cualquier forma de energía de un prisionero.\n#weak El psíquico puede robar Gnosis de un objetivo.#!"
 
 synergy_1_perk_name: "Sentido Psíquico"
 synergy_2_perk_name: "Compartir Voluntad"
 synergy_3_perk_name: "Efecto Grupal"
 synergy_4_perk_name: "Compartir Poderes"
 synergy_5_perk_name: "Gestalt de Poder"

 SYNERGY_1_PERK_EFFECT: "Aumenta la probabilidad de éxito de cualquier [character_interaction|E] de [GetTrait('psychic').GetName( GetPlayer )] contra otro [GetTrait('psychic').GetName( GetPlayer )] en un #P 10#!.\n#weak Un talento increíblemente raro, la Sinergia permite al psíquico vincularse a otros psíquicos para formar una entidad gestalt que combina varios de sus poderes.\nEl psíquico puede sentir a otros psíquicos.#!"
 SYNERGY_2_PERK_EFFECT: "Por cada [GetTrait('psychic').GetName( GetPlayer )] en tu [coterie|E], gana [GetModifier('psi_synergy_coterie_stress_buff').GetNameWithTooltip].\n#weak El psíquico puede establecer un vínculo psíquico básico para compartir fuerza de voluntad con otro psíquico.#!"
 SYNERGY_3_PERK_EFFECT: "Por cada [GetTrait('psychic').GetName( GetPlayer )] en tu [coterie|E] y en la misma localización, aumenta la probabilidad de éxito de cualquier [character_interaction|E] de [GetTrait('psychic').GetName( GetPlayer )] en un #P 10#!. Limitado a #V 1#! miembro de la [coterie|E].\n#weak Los psíquicos dentro de un vínculo sinérgico pueden combinar sus mentes al intentar una acción.#!"
 SYNERGY_4_PERK_EFFECT: "Aumenta el límite de [GetPerk('synergy_3_perk').GetName( GetNullCharacter )] en #V 2#!\n#weak Los psíquicos dentro de un vínculo sinérgico pueden usar múltiples habilidades psíquicas a la vez.#!"
 SYNERGY_5_PERK_EFFECT: "Elimina el límite de [GetPerk('synergy_3_perk').GetName( GetNullCharacter )]\n#weak Los psíquicos dentro de un vínculo sinérgico pueden combinar sus poderes psíquicos en un único poder compartido.#!"

 telepathy_1_perk_name: "Telepatía 1"
 telepathy_2_perk_name: "Telepatía 2"
 telepathy_3_perk_name: "Telepatía 3"
 telepathy_4_perk_name: "Telepatía 4"
 telepathy_5_perk_name: "Telepatía 5"

 TELEPATHY_1_PERK_EFFECT: "#weak La Telepatía es el talento de dominar la mente de otro con la del psíquico.\nEl psíquico puede sentir emociones básicas de un objetivo, enviarle un impulso menor o hacer que se contraiga.#!"
 TELEPATHY_2_PERK_EFFECT: "#weak El psíquico puede leer pensamientos superficiales, transmitir una sola idea o provocar una breve noción.#!"
 TELEPATHY_3_PERK_EFFECT: "Como [character_interaction|E], inicia un duelo de diplomacia contra el objetivo para obtener un favor débil sobre él.\n#weak El psíquico puede leer recuerdos recientes o planes futuros, transmitir emociones o ideas complejas o provocar una acción inusual.#!"
 TELEPATHY_4_PERK_EFFECT: "Nueva opción para la [character_interaction|E] de Telepatía para obtener un favor fuerte en lugar de uno débil.\n#weak El psíquico puede leer pensamientos profundos, enviar varias frases o tomar temporalmente el control del cuerpo del objetivo.#!"
 TELEPATHY_5_PERK_EFFECT: "Nueva opción para la [character_interaction|E] de Telepatía para obtener un favor fuerte perpetuo.\n#weak El psíquico puede leer los secretos subconscientes más profundos de un objetivo, mantener una conversación con él o tomar control completo de su cuerpo, incluyendo la reescritura de recuerdos.#!"