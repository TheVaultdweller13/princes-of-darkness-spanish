 ANIMAL_PSI_1_PERK_EFFECT: "Como [character_interaction|E], acelera los planes (25% de probabilidad).\n#weak El psíquico puede leer las intenciones y deseos básicos del animal que tiene delante. Los poderes afectan a mamíferos superiores.\nPsi Animal es la capacidad de contactar con animales. Cuanto más inteligente o entrenado sea el animal, más fácil es darle órdenes. #!"
 ANIMAL_PSI_2_PERK_EFFECT: "Aumenta la probabilidad de éxito de [GetPerk('animal_psi_1_perk').GetName( GetNullCharacter )] del 25% al 50%\n#weak El psíquico puede dar al animal una orden sencilla para que la cumpla. El animal no está obligado a hacerlo.#!"
 ANIMAL_PSI_3_PERK_EFFECT: "Como [character_interaction|E], te permite obtener una mascota.\nComo [character_interaction|E], te permite llamar a tu mascota a la guerra.\nAumenta la probabilidad de éxito de [GetPerk('animal_psi_1_perk').GetName( GetNullCharacter )] del 50% al 75%\nDesbloquea muchos $POD_animals_maa$ [men_at_arms|E]\n#weak El psíquico obtiene una comprensión instintiva de lo que el animal quiere. Puede comunicarse con varios animales a la vez o dar a un solo animal una orden más compleja.#!"
 ANIMAL_PSI_4_PERK_EFFECT: "Desbloquea la [character_interaction|E] de Cambiaformas.\nDesbloquea opciones de cambio de forma animal.\nAumenta la probabilidad de éxito de [GetPerk('animal_psi_1_perk').GetName( GetNullCharacter )] del 75% al 100%\n#weak El psíquico puede conectar su mente con un animal, viendo a través de sus ojos y usando sus sentidos como propios.#!"
 ANIMAL_PSI_5_PERK_EFFECT: "Como [character_interaction|E], invoca una plaga de ratas sobre la capital del objetivo con una pequeña probabilidad de generar una epidemia.\n#weak El psíquico puede obtener control total sobre un animal, permitiendo que su mente le siga mientras realiza la tarea que le ha sido asignada.#!"

 anti_psi_1_perk_name: "Anti Psi/Escudos Mentales 1"
 anti_psi_2_perk_name: "Anti Psi/Escudos Mentales 2"
 anti_psi_3_perk_name: "Anti Psi/Escudos Mentales 3"
 anti_psi_4_perk_name: "Anti Psi/Escudos Mentales 4"
 anti_psi_5_perk_name: "Anti Psi/Escudos Mentales 5"

 ANTI_PSI_1_PERK_EFFECT: "#P +10#! de probabilidad de defenderse contra efectos que alteran la mente\nAumenta en un 25% el coste de cualquier [character_interaction|E] de [GetTrait('psychic').GetName( GetPlayer )] dirigido contra ti\n#weak Anti Psi es la rara capacidad de anular otros numina psíquicos.\nEl psíquico puede erigir defensas mentales contra intrusiones sobrenaturales.\nEl psíquico suprime otras habilidades psíquicas en un radio de cinco metros alrededor del usuario#!"
 ANTI_PSI_2_PERK_EFFECT: "#P +10#! de probabilidad de defenderse contra efectos que alteran la mente\nAumenta en un 25% el coste de cualquier [character_interaction|E] de [GetTrait('psychic').GetName( GetPlayer )] dirigido contra ti\n#weak El psíquico suprime otras habilidades psíquicas en un radio de diez metros alrededor del usuario#!"
 ANTI_PSI_3_PERK_EFFECT: "#P +10#! de probabilidad de defenderse contra efectos que alteran la mente\nAumenta en un 25% el coste de cualquier [character_interaction|E] de [GetTrait('psychic').GetName( GetPlayer )] dirigido contra ti\n#weak El psíquico suprime otras habilidades psíquicas en un radio de quince metros alrededor del usuario#!"
 ANTI_PSI_4_PERK_EFFECT: "#P +10#! de probabilidad de defenderse contra efectos que alteran la mente\nInmunidad contra cualquier [character_interaction|E] de [GetTrait('psychic').GetName( GetPlayer )]\n#weak El psíquico suprime otras habilidades psíquicas en un radio de veinte metros alrededor del usuario#!"
 ANTI_PSI_5_PERK_EFFECT: "#P +10#! de probabilidad de defenderse contra efectos que alteran la mente\nFuertes Defensas Mentales\n#weak El psíquico suprime otras habilidades psíquicas en un radio de veinticinco metros alrededor del usuario#!"

 astral_projection_1_perk_name: "Proyección Astral 1"
 astral_projection_2_perk_name: "Proyección Astral 2"
 astral_projection_3_perk_name: "Proyección Astral 3"
 astral_projection_4_perk_name: "Proyección Astral 4"
 astral_projection_5_perk_name: "Proyección Astral 5"

 ASTRAL_PROJECTION_1_PERK_EFFECT: "#weak El psíquico puede separar su espíritu de su cuerpo y vagar por el reino astral.\nEl psíquico puede trasladar sus sentidos al espacio astral, percibiendo el reino como superpuesto al mundo mortal.#!"
 ASTRAL_PROJECTION_2_PERK_EFFECT: "#weak El psíquico puede abandonar su cuerpo durante unos minutos. Dentro del reino astral, está limitado a la vista.#!"
 ASTRAL_PROJECTION_3_PERK_EFFECT: "#weak El psíquico puede abandonar su cuerpo durante varios minutos. Dentro del reino astral, puede oír y ver, y viajar rápidamente lejos de su cuerpo.#!"
 ASTRAL_PROJECTION_4_PERK_EFFECT: "#weak El psíquico puede abandonar su cuerpo durante horas, viajando a gran velocidad lejos de él. También puede manifestarse en la forma física en una forma translúcida, aunque es incapaz de comunicarse verbalmente.#!"
 ASTRAL_PROJECTION_5_PERK_EFFECT: "#weak El psíquico puede viajar a cualquier lugar del mundo mientras está en el espacio astral, usar todo su abanico de sentidos y puede hablar mientras está manifestado.#!"

 biocontrol_1_perk_name: "Autocontrol"
 biocontrol_2_perk_name: "Autocuración"
 biocontrol_3_perk_name: "Fuerza Histérica"
 biocontrol_4_perk_name: "Ignorar la Respuesta al Dolor"
 biocontrol_5_perk_name: "Mente sobre Materia"

 BIOCONTROL_1_PERK_EFFECT: "Desbloquea la [character_interaction|E] de Cambiaformas.\nDesbloquea opciones de cambio de forma cosmético.\n#weak El psíquico puede controlar su propio cuerpo.\nEl psíquico puede controlar funciones menores de su cuerpo, como contener la respiración, entrando en trance.#!"
 BIOCONTROL_2_PERK_EFFECT: "Como [character_interaction|E], puede curar instantáneamente [GetTrait('ill').GetName( GetNullCharacter )].\n#weak El psíquico puede acelerar su propio proceso de curación a través de la meditación.#!"
 BIOCONTROL_3_PERK_EFFECT: "Como [character_interaction|E], puede curar heridas instantáneamente.\n#weak Al tomar el control de sus glándulas suprarrenales, el psíquico puede entrar en un período de fuerza y velocidad mejoradas.#!"
 BIOCONTROL_4_PERK_EFFECT: "Como [character_interaction|E], puede curar instantáneamente enfermedades mortales.\n#weak El psíquico puede bloquear el dolor de su conciencia.#!"
 BIOCONTROL_5_PERK_EFFECT: "Como [character_interaction|E], puede curar instantáneamente cualquier enfermedad.\n#weak El psíquico puede ordenar a su propio corazón que se detenga si es necesario, regular directamente su sistema inmunológico y contorsionar su cuerpo en posiciones antinaturales.#!"

 necro_psi_1_perk_name: "Necro Psi 1"
 necro_psi_2_perk_name: "Necro Psi 2"
 necro_psi_3_perk_name: "Necro Psi 3"
 necro_psi_4_perk_name: "Necro Psi 4"
 necro_psi_5_perk_name: "Necro Psi 5"

 NECRO_PSI_1_PERK_EFFECT: "Como [character_interaction|E], puede invocar un [GetTrait('wraith').GetName( GetNullCharacter )] a tu corte.\n#weak Necro Psi, también llamado Canalización, es una habilidad que permite al psíquico contactar con los fantasmas de los muertos.\nEl psíquico puede oír cualquier fantasma cercano.#!"
 NECRO_PSI_2_PERK_EFFECT: "Te permite interactuar con seres de la [umbra|E] cuando estás en el mundo material.\n$POD_can_summon_on_death_trigger_loca$\n$POD_can_weaken_fetter_trigger_loca$\n$POD_can_bind_wraith_trigger_loca$\n#weak El psíquico puede comunicarse con fantasmas en la zona.#!"
 NECRO_PSI_3_PERK_EFFECT: "$POD_can_command_wraith_trigger_loca$\nComo [character_interaction|E], puede permitir que un espectro vinculado te canalice, aumentando todos los atributos en 2 mientras ganas [GetTrait('possessed_1').GetName( GetNullCharacter )]\n#weak El psíquico puede ver dentro de las [UmbraGlossary('shadowlands')].#!"
 NECRO_PSI_4_PERK_EFFECT: "Como [character_interaction|E], puede permitir que un espectro vinculado te canalice, aumentando un solo atributo en 2 sin ganar [GetTrait('possessed_1').GetName( GetNullCharacter )]\n#weak El psíquico se convierte en un faro para los espíritus, que se sienten atraídos hacia él. Cuando un fantasma le posee, puede disputarle el control.#!"
 NECRO_PSI_5_PERK_EFFECT: "Puede ser canalizado por dos espectros en lugar de uno mediante la [character_interaction|E] de [GetPerk('necro_psi_3_perk').GetName( GetNullCharacter )] y [GetPerk('necro_psi_4_perk').GetName( GetNullCharacter )]\n#weak El psíquico puede comunicarse libremente con los fantasmas y canalizar a dos a la vez.#!"

 clairvoyance_1_perk_name: "Clarividencia 1"
 clairvoyance_2_perk_name: "Clarividencia 2"
 clairvoyance_3_perk_name: "Clarividencia 3"
 clairvoyance_4_perk_name: "Clarividencia 4"
 clairvoyance_5_perk_name: "Clarividencia 5"

 CLAIRVOYANCE_1_PERK_EFFECT: "#weak El psíquico puede proyectar sus sentidos manteniendo su conciencia dentro de su cuerpo.\nEl psíquico ve cosas en el edificio en el que se encuentra a través de una neblina onírica.#!"
 CLAIRVOYANCE_2_PERK_EFFECT: "#weak El psíquico puede ver eventos en un radio de ochenta kilómetros a su alrededor, con sonidos amortiguados y distorsionados.#!"
 CLAIRVOYANCE_3_PERK_EFFECT: "#weak El psíquico puede ver y oír claramente a distancia, ganando la capacidad de experimentar el tacto. El radio se expande a 400 kilómetros.#!"
 CLAIRVOYANCE_4_PERK_EFFECT: "#weak El psíquico puede experimentar el tacto, la vista y el oído, junto con una vaga sensación del olfato. El radio se expande a 3200 kilómetros.#!"
 CLAIRVOYANCE_5_PERK_EFFECT: "#weak El psíquico puede usar los cinco sentidos mientras se proyecta teóricamente por todo el mundo.#!"
 
