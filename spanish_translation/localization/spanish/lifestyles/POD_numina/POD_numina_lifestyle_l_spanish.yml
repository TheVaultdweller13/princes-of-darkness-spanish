 cyberkinesis_4_perk_name: "Ciberquinesis 4"
 cyberkinesis_5_perk_name: "Ciberquinesis 5"

 CYBERKINESIS_1_PERK_EFFECT: "#weak Permite al psíquico tomar control sobre dispositivos electrónicos.\nEl psíquico puede encender y apagar un dispositivo electrónico.#!"
 CYBERKINESIS_2_PERK_EFFECT: "#weak El psíquico puede activar un programa en un ordenador, siempre que sepa que el programa está instalado. También puede manejar un ordenador sin tocar el teclado.#!"
 CYBERKINESIS_3_PERK_EFFECT: "#weak El psíquico puede leer, cifrar y descifrar comunicaciones electrónicas telepáticamente, además de provocarles el equivalente a un ataque epiléptico.#!"
 CYBERKINESIS_4_PERK_EFFECT: "#weak El psíquico puede anular programas de seguridad internos y manejar cualquier dispositivo electrónico que esté a la vista.#!"
 CYBERKINESIS_5_PERK_EFFECT: "#weak El psíquico puede reprogramar un ordenador para que haga algo que sea físicamente capaz de manejar.#!"

 cyberpathy_1_perk_name: "Ciberpatía 1"
 cyberpathy_2_perk_name: "Ciberpatía 2"
 cyberpathy_3_perk_name: "Ciberpatía 3"
 cyberpathy_4_perk_name: "Ciberpatía 4"
 cyberpathy_5_perk_name: "Ciberpatía 5"

 CYBERPATHY_1_PERK_EFFECT: "#weak El psíquico puede leer los datos almacenados en un dispositivo electrónico.\nEl psíquico puede saber qué tipo de datos están almacenados en un dispositivo.#!"
 CYBERPATHY_2_PERK_EFFECT: "#weak El psíquico puede leer archivos simples almacenados en un dispositivo.#!"
 CYBERPATHY_3_PERK_EFFECT: "#weak El psíquico puede 'copiar' un archivo en su mente y posteriormente reproducirlo.#!"
 CYBERPATHY_4_PERK_EFFECT: "#weak El psíquico puede acceder a dispositivos electrónicos adicionales junto a aquel al que ya está conectado.#!"
 CYBERPATHY_5_PERK_EFFECT: "#weak El psíquico puede descifrar materiales encriptados.#!"
 
 ectoplasmic_generation_1_perk_name: "El Gran Estornudo"
 ectoplasmic_generation_2_perk_name: "Las Nieblas"
 ectoplasmic_generation_3_perk_name: "«Una Niebla Tan Espesa...»"
 ectoplasmic_generation_4_perk_name: "Moldeador de Sueños"
 ectoplasmic_generation_5_perk_name: "Tulpa"

 ECTOPLASMIC_GENERATION_1_PERK_EFFECT: "#weak El psíquico puede crear plasma como una sustancia pegajosa que se evapora tras varios minutos de vuelta al Inframundo.\nEl psíquico crea unas pocas hebras de plasma de sus orificios que puede aplicar manualmente.#!"
 ECTOPLASMIC_GENERATION_2_PERK_EFFECT: "#weak El psíquico puede convertir el plasma en una forma similar a la niebla.#!"
 ECTOPLASMIC_GENERATION_3_PERK_EFFECT: "$unlock_forging_node$ Permitir que el dueño del artefacto hiera a espíritus\n#weak El psíquico puede endurecer la niebla ectoplásmica a voluntad y darle forma manualmente.#!"
 ECTOPLASMIC_GENERATION_4_PERK_EFFECT: "Mejora el [artifact|E] creado por [GetPerk('ectoplasmic_generation_3_perk').GetName( GetNullCharacter )] añadiendo también un [modifier|E] basado en el tipo de [artifact|E]\n#weak El psíquico puede dar forma a sus constructos ectoplásmicos con su mente en el momento de su creación.#!"
 ECTOPLASMIC_GENERATION_5_PERK_EFFECT: "Mejora el [artifact|E] creado por [GetPerk('ectoplasmic_generation_4_perk').GetName( GetNullCharacter )] añadiendo también un [modifier|E] basado en el tipo de [artifact|E]\n$unlock_forging_node$ Sacrifica un $POD_splat_wraith$ [prisoner|E] para mejorar un [artifact|E] basado en los [traits|E] del sacrificio\nObtén acceso a la mayoría de los $POD_plasmic_maa$ [men_at_arms|E]\n#weak El psíquico puede crear un constructo rudimentario inteligente de ectoplasma que obedece su voluntad.#!"

 empathic_healing_1_perk_name: "Calmar el Espíritu"
 empathic_healing_2_perk_name: "Tejer la Carne"
 empathic_healing_3_perk_name: "Remendar Huesos"
 empathic_healing_4_perk_name: "Reparar Órganos"
 empathic_healing_5_perk_name: "Pacificar la Locura"
 
 EMPATHIC_HEALING_1_PERK_EFFECT: "Como [character_interaction|E], permite eliminar rasgos de estrés negativos.\n#weak El psíquico puede establecer un vínculo empático que le permite influir en el proceso de curación de otra persona.\nEl psíquico puede aliviar la aflicción y dolencias menores similares.#!"
 EMPATHIC_HEALING_2_PERK_EFFECT: "Como [character_interaction|E], permite absorber rasgos de cicatriz.\n#weak El psíquico puede reparar heridas superficiales.#!"
 EMPATHIC_HEALING_3_PERK_EFFECT: "Como [character_interaction|E], permite absorber rasgos de enfermedad.\n#weak El psíquico puede curar enfermedades agudas o reparar huesos rotos.#!"
 EMPATHIC_HEALING_4_PERK_EFFECT: "Como [character_interaction|E], permite absorber rasgos de herida.\n#weak El psíquico puede reparar lesiones internas.#!"
 EMPATHIC_HEALING_5_PERK_EFFECT: "Como [character_interaction|E], permite eliminar rasgos mentales negativos.\n#weak El psíquico puede curar daños psíquicos severos, incluyendo trastornos y harano.#!"

 psychic_healing_1_perk_name: "Diagnóstico"
 psychic_healing_2_perk_name: "Una Buena Noche de Sueño"
 psychic_healing_3_perk_name: "Curación Básica"
 psychic_healing_4_perk_name: "Triaje"
 psychic_healing_5_perk_name: "Cirugía Psíquica"

 PSYCHIC_HEALING_1_PERK_EFFECT: "#weak El psíquico puede curar heridas y otras lesiones con el poder de su mente.\nEl psíquico puede sentir lo que le falta al paciente.#!"
 PSYCHIC_HEALING_2_PERK_EFFECT: "Permite dar a un objetivo [GetModifier('psi_treatment').GetNameWithTooltip] como [character_interaction|E]\n#weak El psíquico puede acelerar el proceso de curación natural de su paciente, enviándolo a un sueño tras el cual la mayoría de las enfermedades menores se curan.#!"
 PSYCHIC_HEALING_3_PERK_EFFECT: "Permite curar cicatrices y desfiguraciones como [character_interaction|E]\nPermite dar a un objetivo [GetModifier('psi_good_treatment').GetNameWithTooltip] como [character_interaction|E]\n#weak El psíquico puede reparar heridas y desterrar enfermedades más persistentes.#!"
 PSYCHIC_HEALING_4_PERK_EFFECT: "Permite curar heridas y enfermedades como [character_interaction|E]\n#weak El psíquico puede reparar huesos rotos y desterrar enfermedades más graves.#!"
 PSYCHIC_HEALING_5_PERK_EFFECT: "Permite curar enfermedades y rasgos físicos negativos como [character_interaction|E]\n#weak El psíquico puede eliminar cáncer o infecciones.#!"

 precognition_1_perk_name: "Intuición"
 precognition_2_perk_name: "Perspicacia"
 precognition_3_perk_name: "Sentido del Peligro"
 precognition_4_perk_name: "Muéstrame las Cartas"
 precognition_5_perk_name: "Visión Clara"

 PRECOGNITION_1_PERK_EFFECT: "#weak El psíquico puede obtener destellos del giro más probable de los acontecimientos y a veces incluso ver el futuro.\nLa predicción del psíquico para eventos aleatorios, como una tirada de dados, se vuelve más precisa.#!"
 PRECOGNITION_2_PERK_EFFECT: "Tus prisioneros tienen menos probabilidades de escapar de tu prisión.\n#weak El psíquico puede meditar para recibir visiones de un futuro posible. Estas visiones son vagas y metafóricas y dependen de mucha interpretación para ser útiles.#!"
 PRECOGNITION_3_PERK_EFFECT: "Recibirás una notificación si alguien intenta asesinar a tus amigos o familiares.\nRecibirás una notificación si alguien intenta seducir a tus amantes o consortes.\n#weak El psíquico puede sentir cuando está en peligro.#!"
 PRECOGNITION_4_PERK_EFFECT: "#weak El psíquico puede ver qué reacción inmediata tendría una acción.#!"
 PRECOGNITION_5_PERK_EFFECT: "Como [character_interaction|E], puede descubrir cada plan hostil dirigido contra ti, y frustrar aquellos ya descubiertos.\n#weak El psíquico puede ver el futuro más probable en el momento.#!"

 psychic_hypnosis_1_perk_name: "Estado de Trance"
 psychic_hypnosis_2_perk_name: "Sugestión de Feria"
 psychic_hypnosis_3_perk_name: "Acción Retardada"
 psychic_hypnosis_4_perk_name: "Trance Rápido"
 psychic_hypnosis_5_perk_name: "Candidato de Manchuria"

 PSYCHIC_HYPNOSIS_1_PERK_EFFECT: "Como [character_interaction|E] da a un objetivo [GetModifier('psi_hypnosis_stress_buff').GetNameWithTooltip] durante 5 años. Disponible solo si el objetivo tiene una opinión de #V 0+#! del psíquico y está en la misma localización.\n#weak El psíquico puede implantar órdenes y sugestiones en su objetivo enviándolo a un trance y luego hipnotizándolo.\nEl psíquico puede enviar a un objetivo a un trance hipnótico.#!"
 PSYCHIC_HYPNOSIS_2_PERK_EFFECT: "La [character_interaction|E] de [GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )] ahora también te permite aumentar la opinión del objetivo sobre ti con un duelo de diplomacia.\n#weak El psíquico puede hacer una sugestión menor mientras el objetivo está en trance.#!"
 PSYCHIC_HYPNOSIS_3_PERK_EFFECT: "La [character_interaction|E] de [GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )] ahora también te permite curar malos hábitos de estrés o ganar un favor débil tras ganar un duelo de diplomacia.\n#weak El psíquico puede hacer sugestiones que permanecen incluso después de que el trance haya terminado.#!"
 PSYCHIC_HYPNOSIS_4_PERK_EFFECT: "La [character_interaction|E] de [GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )] ahora también te permite curar la mayoría de los problemas mentales.\nAumenta la probabilidad de éxito en la hipnosis.\n#weak El psíquico puede enviar a un objetivo a un trance con una simple mirada.#!"
 PSYCHIC_HYPNOSIS_5_PERK_EFFECT: "Puede usar la [character_interaction|E] de [GetPerk('psychic_hypnosis_1_perk').GetName( GetNullCharacter )] sin que el objetivo tenga una opinión de 0+ sobre ti. Aumenta la probabilidad de éxito y puede mejorar el favor obtenido por hipnosis a un favor fuerte.\n#weak El psíquico puede programar profundamente a un objetivo mientras está en trance, afectando incluso a su memoria.#!"

 psychic_invisibility_1_perk_name: "Esconderse"
 psychic_invisibility_2_perk_name: "Movimiento Lento"
 psychic_invisibility_3_perk_name: "Invisibilidad"
 psychic_invisibility_4_perk_name: "Invisibilidad Selectiva"
 psychic_invisibility_5_perk_name: "Olvida que me Viste"

 PSYCHIC_INVISIBILITY_1_PERK_EFFECT: "#weak Similar a la Disciplina vampírica de Ofuscación, el psíquico puede enmascarar su presencia, no registrándose ante los ojos de los espectadores.\nEl psíquico no es notado mientras permanezca perfectamente quieto.#!"
 PSYCHIC_INVISIBILITY_2_PERK_EFFECT: "#weak El psíquico no es notado mientras se mueva lo suficientemente despacio.#!"
 PSYCHIC_INVISIBILITY_3_PERK_EFFECT: "#weak El psíquico puede volverse invisible y moverse siempre que no le estén mirando cuando active ese poder.#!"
 PSYCHIC_INVISIBILITY_4_PERK_EFFECT: "#weak El psíquico puede hacer que ciertas personas le vean mientras está oculto.#!"
 PSYCHIC_INVISIBILITY_5_PERK_EFFECT: "Como [character_interaction|E], puedes ralentizar cualquier plan hostil dirigido contra ti en 2 fases.\n#weak El psíquico puede volverse invisible justo delante de alguien.#!"

 psychic_vampirism_1_perk_name: "Subidón"
 psychic_vampirism_2_perk_name: "Minar la Voluntad"
 psychic_vampirism_3_perk_name: "Transferencia de Energía"
 psychic_vampirism_4_perk_name: "Sanguijuela Vital"
 psychic_vampirism_5_perk_name: "Vórtice Emocional"

 PSYCHIC_VAMPIRISM_1_PERK_EFFECT: "Como [character_interaction|E], puedes disminuir tu estrés 'comiéndote' las emociones de alguien. Requiere que el objetivo esté en la misma localización que tú, y tenga #V 0#! de [stress|E] o [stress_level|E] #V 3#!.\n#weak El psíquico puede drenar de más de una persona.\nEl psíquico puede drenar emociones fuertes para experimentarlas él mismo.#!"
 PSYCHIC_VAMPIRISM_2_PERK_EFFECT: "Mejora la [character_interaction|E] de [GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] aumentando la pérdida de estrés y cambiando los requisitos a #V 0#! de [stress|E] o [stress_level|E] #V 2#!.\n#weak El psíquico puede drenar Fuerza de Voluntad de un objetivo para reponer la suya propia.#!"
 PSYCHIC_VAMPIRISM_3_PERK_EFFECT: "Mejora la [character_interaction|E] de [GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] ganando también una acumulación de [GetModifier('psi_vampirism_health').GetNameWithTooltip] durante 20 años.\n#weak El psíquico puede drenar fuerza vital para curar heridas menores.#!"
 PSYCHIC_VAMPIRISM_4_PERK_EFFECT: "Mejora la [character_interaction|E] de [GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] reduciendo el tiempo de recarga de 5 a 2 años\n#weak El psíquico puede drenar aún más fuerza vital para curar heridas mayores.#!"
 PSYCHIC_VAMPIRISM_5_PERK_EFFECT: "Elimina el requisito de localización de [GetPerk('psychic_vampirism_1_perk').GetName( GetNullCharacter )] si previamente has drenado la fuerza vital del objetivo.\n#weak El psíquico puede drenar de más de una persona.#!"

