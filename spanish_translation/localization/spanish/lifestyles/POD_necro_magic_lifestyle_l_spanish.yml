 NS_SONG_OF_THE_DEAD_PERK_EFFECT: "Como un [bs_spell|E], inflige 25 de [static_stress|E] al objetivo a costa de [static_stress|E] en ti mismo.\n#flavor El vampiro canta, tejiendo palabras inauditas en la canción e instilando una fascinación poco saludable con la muerte en su oyente.#!"
 NS_SUMMON_WISP_PERK_EFFECT: "#flavor El vampiro infunde gotas de su sangre con la energía efímera del [UmbraGlossaryLocalized('shadowlands','Inframundo')], invocando una esfera de luces parpadeantes. La luzfatuo puede atraer a mortales desprevenidos a una trampa o proporcionar una distracción inteligente.#!"
 NS_HARROWING_PERK_EFFECT: "Mejora [GetPerk('ns_song_of_the_dead_perk').GetName(GetNullCharacter)] aumentando el [static_stress|E] del objetivo a 50 y disminuyendo el coste a 13 de [static_stress|E].\n#flavor Inquisición extiende el terror infligido por la Canción de los Muertos al acecharla en su sueño, convirtiendo sus sueños en visiones pesadillescas de su propia muerte.#!"
 NS_PHANTASMS_PERK_EFFECT: "Mejora [GetPerk('ns_song_of_the_dead_perk').GetName(GetNullCharacter)] aumentando el [static_stress|E] del objetivo a 75.\n#flavor El vampiro esculpe la energía del [UmbraGlossaryLocalized('shadowlands','Inframundo')] en alucinaciones elaboradas que aterrorizan a los vivos.#!"
 NS_H_TORMENT_PERK_EFFECT: "Mejora [GetPerk('ns_song_of_the_dead_perk').GetName(GetNullCharacter)] aumentando el [static_stress|E] del objetivo a 100.\n#flavor El vampiro rasga el velo entre la vida y el [UmbraGlossaryLocalized('shadowlands','Inframundo')] alrededor de su víctima, invocando fantasmas maliciosos para acecharla.#!"
  
