 LORE_MANIPULATE_COHESION_PERK_EFFECT: "Desbloquea un movimiento de [single_combat_duel|E].\nComo [character_interaction|E], cambia la personalidad o sexualidad de tu objetivo.\nDesbloquea una nueva opción de ejecución.\n#flavor El Caído puede manipular la cohesión tanto de objetos como de personas.#!"
 LORE_FADE_PERK_EFFECT: "Como [character_interaction|E], haz que tu objetivo pierda todo el [prestige|E] y la [piety|E].\n#flavor El Caído puede hacer que cualquier cosa se desvanezca en la oscuridad, ya sea una persona o las leyes de la física.#!"

