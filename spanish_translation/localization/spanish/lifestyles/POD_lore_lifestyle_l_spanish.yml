 LORE_TRANSLATE_PERK_EFFECT: "#flavor El Caído puede traducir cualquier lenguaje hablado de los mortales, así como traducir un estado de la materia (agua) en otro (hielo).#!"
 LORE_MANIPULATE_ADHESION_PERK_EFFECT: "Desbloquea un movimiento de [single_combat_duel|E].\nComo [character_interaction|E], fortalece una relación aleatoria de tu objetivo.\n#flavor El Caído puede manipular la adhesión tanto de objetos como de personas.#!"
