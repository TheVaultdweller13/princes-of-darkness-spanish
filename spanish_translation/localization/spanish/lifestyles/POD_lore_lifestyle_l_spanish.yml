 LORE_LASH_OF_CORRUPTION_PERK_EFFECT: "Mejora el [modifier|E] de [GetPerk('lore_reality_tremors_perk').GetName(GetPlayer)] a [GetModifier('lore_lash_of_corruption_modifier').GetNameWithTooltip].\n#flavor El Earthbound puede corromper la realidad hasta que cruja por las costuras.#!"
 LORE_WAVE_OF_MUTILATION_PERK_EFFECT: "Mejora el [modifier|E] de [GetPerk('lore_reality_tremors_perk').GetName(GetPlayer)] a [GetModifier('lore_wave_of_mutilation_modifier').GetNameWithTooltip].\n#flavor El Earthbound puede desollar la realidad hasta que se derrumbe.#!"
 LORE_SUMMON_OUTSIDER_PERK_EFFECT: "Puede reclutar a [GetMaA('the_unnamable').GetName] como [men_at_arms|E].\nComo [character_interaction|E], destruye todos los edificios en la propiedad de tu ubicación actual.\n#flavor El Earthbound puede abrir camino a seres que no son de esta realidad.#!"
 LORE_UNSPEAKABLE_SURVIVOR_PERK_EFFECT: "Puede mejorar el Ritual del Alma Fragmentada a un nivel previamente inaccesible.\n#flavor El Earthbound puede enfocar su control sobre la realidad en un receptáculo perfecto y eterno.#!"

