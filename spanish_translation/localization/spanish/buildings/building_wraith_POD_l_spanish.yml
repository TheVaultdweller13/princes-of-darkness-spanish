 building_type_haunted_city_walls_01: "Murallas de la Ciudad Encantada"
 building_type_haunted_city_walls_01_desc: "El camino está cerrado. Fue hecho por aquellos que están Muertos, y los Muertos lo guardan, hasta que llegue el momento. El camino está cerrado."
