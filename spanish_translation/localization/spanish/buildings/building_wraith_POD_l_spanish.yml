 building_type_haunted_blacksmiths_01: "Herrerías Encantadas"
 building_type_haunted_blacksmiths_01_desc: "#F La forja de almas es la práctica de convertir a un wraith en un Artefacto. Se utiliza tanto como castigo como técnica de fabricación.#!"
 building_haunted_blacksmiths_01: "Herrerías Encantadas 1"
 building_haunted_blacksmiths_01_desc: "Un pequeño horno que cumple la doble función de lugar de ejecución y forja; esta Forja de Almas al menos cumple su cometido."
 building_haunted_blacksmiths_02: "Herrerías Encantadas 2"
 building_haunted_blacksmiths_02_desc: "Vuestra forja ha sido ampliada desde entonces, y ahora los wraiths se estremecen ante la idea de ser traídos a este lugar."
 building_haunted_blacksmiths_03: "Herrerías Encantadas 3"
 building_haunted_blacksmiths_03_desc: "La forja ha crecido de verdad, y las herrerías de las fábricas palidecerían ante ella; ni siquiera el verdugo más entusiasta podría alcanzar el ritmo de los muertos que podríais procesar aquí."
 building_haunted_blacksmiths_04: "Herrerías Encantadas 4"
 building_haunted_blacksmiths_04_desc: "Los wraiths de toda la [umbra|E] tiemblan de miedo ante esta terrible fábrica de muerte, ya que las armas y armaduras aquí fabricadas son de la calidad más inmaculada. Un precio terrible por un producto inmaculado. Perfecto."
 building_haunted_blacksmiths_05: "Herrerías Encantadas 5"
 building_haunted_blacksmiths_05_desc: "Los wraiths de toda la [umbra|E] tiemblan de miedo ante esta terrible fábrica de muerte, ya que las armas y armaduras aquí fabricadas son de la calidad más inmaculada. Un precio terrible por un producto inmaculado. Perfecto."

 building_type_haunted_church_01: "Iglesia Encantada"
 building_type_haunted_church_01_desc: "Antaño un lugar de luz y esperanza, hace tiempo que cayó en el abandono y se rumorea que alberga todo tipo de fantasmas."
