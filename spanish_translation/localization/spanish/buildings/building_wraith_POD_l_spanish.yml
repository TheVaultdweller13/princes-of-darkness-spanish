 building_type_haunted_cemetery_01: "Cementerio Encantado"
 building_type_haunted_cemetery_01_desc: "#F Un Refugio es un lugar donde los wraiths buscan cobijo. Ciertas áreas se conocen en las [Glossary('Skinlands','game_concept_skinlands_desc')] como \"encantadas\" o \"espeluznantes\", y por una buena razón; estos edificios, caminos y otras zonas tienen fuertes vínculos con un wraith o varios. Un cementerio en particular es siempre un buen lugar, debido a su capacidad para albergar a una gran cantidad de wraiths.#!"
 building_haunted_cemetery_01: "Tumba Encantada"
 building_haunted_cemetery_01_desc: "Donde yace un hombre muerto, un wraith puede encontrar un momento de respiro entre los gusanos de sus huesos."
 building_haunted_cemetery_02: "Cementerio Encantado"
 building_haunted_cemetery_02_desc: "Donde yacen los muertos, los wraiths pueden encontrar un lugar para detenerse y reunirse, un pequeño oasis entre los terrores de los muertos."
 building_haunted_cemetery_03: "Sepulcro Encantado"
 building_haunted_cemetery_03_desc: "Una gran reunión de muertos, ya estén durmiendo o inquietos. Aquí existe la ilusión de la paz."
 building_haunted_cemetery_04: "Mausoleo Encantado"
 building_haunted_cemetery_04_desc: "Los mortales temen este lugar, hablando en susurros de los muertos que se agitan aquí y de los terrores que encierra. Tienen razón."
 building_haunted_cemetery_05: "Catacumbas Encantadas"
 building_haunted_cemetery_05_desc: "Los aventureros suelen entrar aquí pensando que pueden limpiar este lugar de sus señores fantasmales. Siempre acaban uniéndose a ellos en su lugar."

 building_type_haunted_mansions_01: "Mansiones Encantadas"
 building_type_haunted_mansions_01_desc: "Bienvenidos, necios mortales, a la Mansión Encantada. Soy vuestro anfitrión, vuestro anfitrión fantasma. Tengan la amabilidad de pasar hasta el fondo, por favor, y dejen sitio para todos. Ya no hay vuelta atrás."
 building_haunted_mansions_01: "Mansiones Encantadas 1"
