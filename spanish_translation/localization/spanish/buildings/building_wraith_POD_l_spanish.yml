 building_type_tithe_of_the_dead_01: "Tributo de los Muertos"
 building_type_tithe_of_the_dead_01_desc: "#F El tributo de los muertos consistía en dos monedas colocadas sobre los ojos de un wraith recién fallecido; estas monedas reliquia se entregaban a Nhudri, quien a su vez las utilizaba para fabricar bienes.#!"
 building_tithe_of_the_dead_01: "Tributo Bajo"
 building_tithe_of_the_dead_01_desc: "Para permitir el paso seguro, habéis empezado a extraer un modesto tributo. Es una faena para los que pasan, pero no es que tengan voz ni voto en el asunto."
 building_tithe_of_the_dead_02: "Tributo Alto"
 building_tithe_of_the_dead_02_desc: "Un peaje considerable; los muertos empiezan a murmurar sobre la 'carestía', pero dejad que murmuren. Ahora es vuestra moneda."
 building_tithe_of_the_dead_03: "Tributo Serio"
 building_tithe_of_the_dead_03_desc: "Vuestros tasadores son ahora temidos en todos vuestros dominios, y con razón. La moneda debe fluir, pase lo que pase."

 building_type_lux_veritatis_01: "Lux Veritatis"
 building_type_lux_veritatis_01_desc: "#F La Lux Veritatis dictaba que todas las grandes obras de la humanidad debían ser recogidas y preservadas dondequiera que se encontraran, y que se guardaran en bóvedas bajo el senado para el disfrute de todos, de modo que todo el arte y la historia pudieran preservarse para siempre.#!"
 building_lux_veritatis_01: "Bóveda Diminuta"
 building_lux_veritatis_01_desc: "Una bóveda personal; habéis escondido una pequeña cápsula del tiempo del arte y la belleza locales, con la esperanza de preservarlos de las arenas del tiempo. Puede que no signifique mucho para el mundo, pero significa mucho para vos."
 building_lux_veritatis_02: "Bóveda Pequeña"
 building_lux_veritatis_02_desc: "Vuestro pequeño escondite para las reliquias de la humanidad ha sido ampliado, y tenéis algunas baratijas que realmente vale la pena preservar. Esperáis que sea suficiente."
 building_lux_veritatis_03: "Bóveda Grande"
 building_lux_veritatis_03_desc: "Vuestro búnker de arte y cultura ha ganado cierto renombre, ya que ahora albergáis reliquias verdaderamente inestimables, con la esperanza de preservarlas contra los estragos de la historia. ¡Podría funcionar! Probablemente."

