 building_type_citadel_01: "Ciudadela"
 building_type_citadel_01_desc: "#F El corazón visible de una Necrópolis y el símbolo visible de la Jerarquía, una Ciudadela es un refugio masivo, generalmente construido alrededor de uno o más edificios reforzados con puertas de acero de alma y otros pertrechos.#!"
