 nick_master_kau: "Maestro Kau"
 nick_zealous_convert: "Conversos Celosos"
 nick_zealous_convert_desc: "Este encontró un nuevo propósito en la verdad que antes rechazaba."
 nick_relentless_seeker: "Buscador Incesante"
 nick_relentless_seeker_desc: "Este quiere respuestas y las obtendrá, pase lo que pase."
 nick_disgruntled_watcher: "Vigilante Descontento"
 nick_disgruntled_watcher_desc: "A veces, ver es creer. Otras veces, no lo es."
