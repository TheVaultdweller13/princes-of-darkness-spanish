 nick_three_eyed: "el de Tres Ojos"
 nick_obscured_observer: "el Observador Oscurecido"
 nick_flagella_legionum: "Flagella Legionum"
 nick_betrayer_blood: "Traidor de la Sangre"
 nick_betrayer_blood_desc: "Una parte de la Trinidad Impía, tratando desesperadamente de encontrar a los otros para acabarlo todo."
 nick_santa: "Santa"
 nick_santa_desc: "Santa Claus, Papá Noel, San Nicolás, San Nicolás, Joulupukki, Kris Kringle, Sinterklaas, Weihnachtsmann, Belsnickel, Jólnir, Mikulás, Père Noël, Święty Mikołaj, Ded Moroz, Langbarðr, Ayaz Ata, Moș Gerilă, Yule Goat, El Hombre del Saco"
 nick_mrs_claus: "Señora Claus"
 nick_mrs_claus_desc: "Señora Santa Claus, Madre Navidad, Tía Claus, Margaret Claus, Signora Natale, La Mère Noël, Pani Mikołajowa, Télanyó" 
 nick_seppo: "Seppo"
 nick_the_little_dreamer: "la Pequeña Soñadora"
 nick_first_risen: "Primera Resucitada"
 nick_eternal_seeker: "Buscadora Eterna"
 nick_eternal_seeker_desc: "Siempre buscando a su otra mitad, la que se fue demasiado pronto de su vida."
 nick_unhindered_ages: "Edades Sin Obstáculos"
 nick_unhindered_ages_desc: "Ríe para que otros no puedan ver tus lágrimas."
 nick_god_storm: "Tormenta de Dios"
 nick_god_storm_desc: "Jeanne es una mujer intransigente en su fe. Su terquedad le ha valido el respeto a regañadientes de la Inquisición Sombría."
 nick_the_last_white_howler: "El Último Aullador Blanco"
 nick_the_last_white_howler_desc: "Coruroc fue el último miembro de la tribu de los Aulladores Blancos que logró escapar del destino de ser convertido en un Danzante de la Espiral Negra."
 nick_truthcatcher: "Atrápador de la Verdad"
 nick_philosopher: "El Filósofo"
 nick_philosopher_desc: "Aristóteles fue venerado entre los eruditos musulmanes medievales como 'El Primer Maestro', y entre los cristianos medievales como Tomás de Aquino simplemente como 'El Filósofo', mientras que el poeta Dante lo llamó 'el maestro de los que saben'."
 nick_the_last_of_the_hellenes: "El Último de los Helenos"
 nick_the_last_of_the_hellenes_desc: "El asesinato de Hipatia conmocionó al imperio romano y la transformó en una 'mártir de la filosofía'."
 nick_bonastruc_ca_porta: "Bonastruc Ca Porta"
 nick_bonastruc_ca_porta_desc: "'Mazel Tov cerca de la Puerta' es un título respetado otorgado por la comunidad judía ibérica a su erudito más respetado."
 nick_leaf_typhoon: "el Epicentro del Tifón"
 nick_leaf_typhoon_desc: "La hoja que baila suavemente en el centro del tifón es el apodo que Pei Ling le dio a Qorjin después de trabajar con él por un tiempo. Nunca se hizo una descripción más acertada."
 nick_champion_dazbog: "Campeón de Dazbog"
 nick_champion_dazbog_desc: "Nadie igualará jamás las hazañas del Dios Guerrero, pero este seguro que lo intentará."
 nick_mouth_dazbog: "Boca de Dazbog"
 nick_mouth_dazbog_desc: "El único capaz de interpretar los decretos del Dios... y de equilibrar los libros de sus guerreros imprudentes." 
 nick_of_tronje: "de Tronje"
 nick_of_tronje_desc: "'Tronje' también podría ser la Colonia Ulpia Traiana, una ciudad romana cerca de la moderna Xanten, y el área de la que provenía Siegfreid. Esto explicaría el aparentemente profundo conocimiento de Hagen de incidentes y hazañas de la juventud de Siegfreid. Del mismo modo, el nombre de la pequeña aldea del Castillo de Dhronecken en las Montañas de Hunsrück suena como 'Tronje'; en la Edad Media su nombre era 'Troneck' y se encontraba en el histórico Reino de los Burgundios. No muy lejos, hay topónimos que insinúan otras figuras del Cantar de los Nibelungos, especialmente el pariente de Hagen, Ortwin de Metz, y sus colegas Hunold y Volker von Alzey. Basado en los castillos alrededor de Dhronecken, Ortwin puede ser asignado a Metz, Hagen a Dhronecken, Hunold a Hunoldispetra (ahora Hunolstein en Morbach), y Volker a Alzey. Estos son lugares que los viajeros pasarían en el camino de Xanten a través de Metz y Worms a Passau."
 nick_lord_of_the_mountains: "Señor de las Montañas"
 nick_la_bretagne: "la Bretagne"
 nick_eileen: "Eileen"
 nick_siren_of_the_rhine: "Sirena del Rin"
 nick_kills_the_weak: "Mata al Débil"
 nick_handmaiden_of_the_cursed: "la Doncella de los Malditos"
 nick_handmaiden_of_the_cursed_desc: "La Matriarca de Lamont ha asegurado el Hospital de Leprosos de la Abadía de Fearn en Loch Flynn como una colmena de los Danzantes de la Espiral Negra."
 nick_mistborn: "el Nacido de la Niebla"
 nick_mistborn_desc: "Las Nieblas son los mecanismos que esconden el mundo de las Hadas del mundo de los Humanos. Inducen un sentimiento de olvido en su objetivo que hace que pasen por alto los actos quiméricos o los declaren como delirios o encuentren explicaciones 'racionales' para lo que vieron. Por alguna razón, Brandbub tiene una conexión especial con las Nieblas y no parece ser completamente de este mundo."
 nick_half_giant: "el Semigigante"
 nick_half_giant_desc: "Direach Ghlinn Eitidh"
 nick_the_weeper: "el Llorón"
 nick_good_son: "el Buen Hijo"
 nick_good_son_desc: "Creer verdaderamente en una causa podría ser suficiente para absolver tus pecados. Pero no para apaciguar tu alma atormentada." 
 nick_premonstratensian_giant: "el Gigante Premonstratense"
