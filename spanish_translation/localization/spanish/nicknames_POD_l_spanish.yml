l_spanish:
 nick_the_dark_mother: "la Madre Oscura"
 nick_the_dark_mother_desc: "Dama del Destino, La Primera Mujer, Ishtar, Malkah Ha-Shedim. Lilith es el principio de la vida y, algunos temen, será el fin de ella."
 nick_the_dark_father: "el Padre Oscuro"
 nick_the_dark_father_desc: "El Primer Asesino. El Primer Vampiro. El Padre Oscuro. El Errabundo. El Tirano Oscuro. El Rey Pescador. El Gran Rey de Sangre y Oscuridad. Khayyin. Canarl. Cagn. El Hombre Sangriento, y muchos más. Caín fue el principio, y podría ser el fin."
 nick_trusted_regent: "el Regente de Confianza"
 nick_trusted_regent_desc: "Sha'hiri ha sido capaz de mantener unidos a los Banu Haqim hasta el regreso de Nakurtum. Haqim fue sabio al elegirlo como su sucesor."
 nick_exiled_prodigal: "Prodigio Exiliado"
 nick_exiled_prodigal_desc: "Demasiadas dagas apuntaban a la espalda de Hilel. El cansado guerrero vio la escritura en la pared."
 nick_the_shepherd_of_wolves: "el Pastor de Lobos"
 nick_the_shepherd_of_wolves_desc: "Antara intenta mantener muchas lealtades para lograr su objetivo final. Lo ha hecho funcionar, hasta ahora."
 nick_cursed_sultan: "el Sultán Maldito"
 nick_cursed_sultan_desc: "Karim hizo un poderoso enemigo y pagó el precio. Uno lento y agonizante."
 nick_the_spear_of_destiny: "la Lanza del Destino"
 nick_the_spear_of_destiny_desc: "Zayyat encontró a Dios en una tienda de campaña de un Cruzado y lamentó amargamente que los propios Cruzados no hicieran lo mismo."
 nick_merciless_spider: "la Araña Despiadada"
 nick_merciless_spider_desc: "La red de Thetmes es de gran alcance, casi irrompible, y sirve a un terrorífico amo oscuro."
 nick_master_sorcerer: "Maestro Hechicero"
 nick_master_sorcerer_desc: "Todo honor a Al-Ashrad, él que realizó el Ritual de Creación, que mantiene fuertes a los Hijos de Haqim. Él que forjó el Colmillo de Kali y el Arco del Sol. Él que encadena el sol y derriba a los demonios con su mano de hierro. ¡Todo honor a Al-Ashrad, el más grande mago del mundo!"
 nick_impassible_diplomat: "Diplomático Impasible"
 nick_impassible_diplomat_desc: "El semblante helado y el ingenio mordaz de Tegyrius nunca le impidieron ser respetado como el embajador más confiable de los Banu Haqim."
 nick_hand_of_vengeance: "Mano de la Venganza"
 nick_hand_of_vengeance_desc: "Fátima desata la furia de Haqim y Alá sobre sus enemigos por igual. Su único miedo es tener que elegir una noche entre sus dos lealtades."
 nick_northern_bastion: "Bastión del Norte"
 nick_northern_bastion_desc: "Al-Ándalus está cayendo, pero los cristianos aún deben romper la disciplinada defensa de Tabitha antes de reclamar la victoria."
 nick_the_rogue: "el Pícaro"
 nick_the_rogue_desc: "Talaq no sirve a ningún amo más que a sí mismo. Su búsqueda para salvar a su pueblo será su salvación o su perdición."
 nick_the_enigma: "el Enigma"
 nick_the_enigma_desc: "Oculto tras varios velos de engaño, nadie sabe realmente a quién sirve Dastur."
 nick_the_dutiful: "el Cumplidor"
 nick_the_dutiful_desc: "El deber lo es todo. El deber eterno aún más."
 nick_goddess_of_war_and_love: "Diosa de la Guerra y el Amor"
 nick_goddess_of_war_and_love_desc: "Una mujer de dos caras, que traerá dos linajes muy diferentes al mundo."
 nick_the_spearmaster: "el Maestro de la Lanza"
 nick_the_spearmaster_desc: "¡Mi abuelo golpea más fuerte que tú! ¡Y está muerto!"
 nick_herald_of_destruction: "Heraldo de la Destrucción"
 nick_herald_of_destruction_desc: "El Pastor Negro. La Prole Odiosa. Heraldo de Haqim. El Desollado. Heraldo de la Destrucción. Ur-Shulgi verá el mundo arder en un infierno de justa retribución."
 nick_the_thrice_damned: " el Tres Veces Maldito"
 nick_the_thrice_damned_desc: "Izhim fue el más grande guerrero que los Haqimitas hayan visto jamás. Su caída en desgracia condenó a todo su Clan."
 nick_the_once_and_forever_prince: " el Príncipe de Una Vez y para Siempre"
 nick_the_once_and_forever_prince_desc: "Mitras ha muerto. ¡Larga vida a Mitras!"
 nick_the_dark_angel: "el Ángel Oscuro"
 nick_the_dark_angel_desc: "Al final, solo queda la oscuridad."
 nick_the_bronze_bow: "el Arco de Bronce"
 nick_the_bronze_bow_desc: "Un arma elegante, dominada para nunca fallar en su deber."
 nick_wind_of_change: "Viento de Cambio"
 nick_wind_of_change_desc: "Nakurtum trae cambios a los Haqimitas. Les guste o no."
 nick_voyager_caged: "el Viajero Enjaulado"
 nick_voyager_caged_desc: "La ansia de viajar por conocimiento nunca puede ser verdaderamente saciada."
 nick_mistress_of_weapons: "Señora de las Armas"
 nick_mistress_of_weapons_desc: "La elegida del heraldo del fin, buscando hábilmente evitarlo ella misma."
 nick_suffet_of_hell: "Sufete del Infierno"
 nick_suffet_of_hell_desc: "Una traición muy vil del cazador infernal convertido en infernalista aún persigue a los Banu Haqim."
 nick_sword_of_haqim: "Espada de Haqim"
 nick_sword_of_haqim_desc: "Bistakh arde con una furia justiciera para vengar el nombre de su Sire. El propio Haqim parece haberla bendecido con un celo eterno."
 nick_eyes_of_the_serpent: "Ojos de la Serpiente"
 nick_eyes_of_the_serpent_desc: "Mira profundamente en ellos."
 nick_lovestruck_ghost: "Fantasma Enamorado"
 nick_lovestruck_ghost_desc: "Shabah lo ha sacrificado todo en pos de la única causa digna: el amor."
 nick_the_cold: "el Frío"
 nick_the_cold_desc: "El temperamento severo y sereno de Brujah solo era igualado por la pasión de su descendencia."
 nick_the_fiery: "el Ardiente"
 nick_the_fiery_desc: "La pasión puede hacerte ascender a la cima más alta... antes de caer al abismo más profundo."
 nick_the_serene: "el Sereno"
 nick_the_serene_desc: "Guillermo busca la verdadera salvación, una paz de otro mundo parece emanar de él."
 nick_the_reluctant_sultan: "el Sultán Renuente"
 nick_the_reluctant_sultan_desc: "La mayoría de la gente quiere terminar en una posición de poder. Algunos simplemente fueron forzados a ello por los caprichos del destino."
 nick_patron_of_the_sun: "Patrón del Sol"
 nick_patron_of_the_sun_desc: "Salvador de la ciudad más grande del mundo, olvidado por quienes le sucedieron."
 nick_gods_witness: "Testigo de Dios"
 nick_gods_witness_desc: "Al-Muntathir vio muchos caminos hacia la salvación durante su larga vida. Al final, nunca caminó verdaderamente por uno."
 nick_outlaw: "el Proscrito"
 nick_outlaw_desc: "La ley no le importa a Robin. Solo lucha por la verdadera justicia."
 nick_autokrator: "Autócrator"
 nick_autokrator_desc: "Una extraña adoptada en un Sueño, Natalya podría ser la única que puede continuarlo verdaderamente."
 nick_iberian_hound: "el Sabueso Ibérico"
 nick_iberian_hound_desc: "Alessandro es un verdadero amigo para sus compañeros, y un enemigo tenaz para sus muchos enemigos."
 nick_the_eternal_mullah: "el Mulá Eterno"
 nick_the_eternal_mullah_desc: "La eternidad podría ser demasiado larga para algunos."
 nick_the_gladiator: "el Gladiador"
 nick_the_gladiator_desc: "Solo los más fuertes sobrevivieron a la arena de Roma. Pero incluso esos pocos salieron como hombres cambiados."
 nick_roman_promethean: "el Prometeo Romano"
 nick_roman_promethean_desc: "Lucio abandonó su patria romana para abrazar la utopía cartaginesa de los Brujah. Una rareza que le hizo tener pocos amigos."
 nick_murderer_of_kings: "Asesino de Reyes"
 nick_murderer_of_kings_desc: "A pesar de ser un vástago del clan de los Reyes, Armin solo quiere ver rodar por el suelo las cabezas de los poderosos."
 nick_flawed_dictator: "Dictador Defectuoso"
 nick_flawed_dictator_desc: "Hektor está tratando de recrear Cartago en todo su esplendor. Incluyendo su lado más oscuro."
 nick_dark: "Oscuro"
 nick_dark_desc: "Cuando quieres asegurarte de que otros capten rápidamente dónde te sitúas en toda la escala del bien contra el mal."
 nick_praetor_urbanus: "Pretor Urbano"
 nick_praetor_urbanus_desc: "Thrax pensó que sacudiría a los Ventrue romanos con sus ataques. En cambio, el divertido Camila la puso en una posición de autoridad."
 nick_rightly_guided: "el Bien Guiado"
 nick_rightly_guided_desc: "Proteger la propia patria y fe es verdaderamente la empresa más digna."
 nick_mysterious_sorceress: "Hechicera Misteriosa"
 nick_mysterious_sorceress_desc: "Eileen conoce la fuerza que se puede aprovechar con algunos rumores bien situados. Es su propia forma de magia, en cierto modo."
 nick_soft_prince: "el Príncipe Blando"
 nick_soft_prince_desc: "Nehemías se preocupa por propósitos más elevados que solo gobernar. Las risitas de la gente a sus espaldas no le preocupan."
 nick_ashen_rabbi: "Rabinó Cenizo"
 nick_ashen_rabbi_desc: "A veces, la muerte solo refuerza la fe de uno."
 nick_pale_wolf: "el Lobo Pálido"
 nick_pale_wolf_desc: "Ménele es un fantasma vengativo que acecha la noche, buscando a la presa más hermosa (y peligrosa) de todas."
 nick_brute_patriarch: "el Patriarca Bruto"
 nick_brute_patriarch_desc: "Domingo gobernó los ejércitos de Cartago con un puño de hierro. La muerte solo ha apretado más su agarre."
 nick_paragon_humanity: "Parangón de la Humanidad"
 nick_paragon_humanity_desc: "Vero, como la conocen sus muchos amigos, es la pastora que realmente se preocupa por su rebaño."
 nick_devious_zealot: "Fanático Astuto"
 nick_devious_zealot_desc: "La fe ardiente consume a uno tan rápido como la ira ardiente."
 nick_sole_survivor: "Único Superviviente"
 nick_sole_survivor_desc: "Bjorn perdió a su tripulación, pero un capitán eterno nunca pierde realmente su vocación."
 nick_eternal_rebel: "la Rebelde Eterna"
 nick_eternal_rebel_desc: "Cabalgando siempre en la moto de la justa rebelión."
 nick_muse_of_rebellion: "Musa de la Rebelión"
 nick_muse_of_rebellion_desc: "La Revolución No-muerta ha encontrado a su estrella a seguir."
 nick_anarch_visionary: "Visionaria Anarquista"
 nick_anarch_visionary_desc: "El cerebro detrás del caos, luchando por traer orden a aquellos que lo derribaron todo."
 nick_nines: "Nueves"
 nick_nines_desc: "El noveno hijo de una familia empobrecida nunca olvidó sus raíces."
 nick_ruthless_iconoclast: "Iconoclasta Despiadado"
 nick_ruthless_iconoclast_desc: "La no-muerte es solo una broma."
 nick_vanguard_thinblood: "Vanguardia de los Sangre Débil"
 nick_vanguard_thinblood_desc: "Jenna lidera audazmente a los oprimidos hacia un futuro más brillante. Podría ser su salvación o su perdición."
 nick_teacher_warrior: "Maestro y Guerrero"
 nick_teacher_warrior_desc: "La guerra es solo una asignatura como cualquier otra."
 nick_unwilling_messiah: "Mesías Renuente"
 nick_unwilling_messiah_desc: "¿Puedes realmente salvar el mundo a pesar de tus mejores intentos de no hacerlo?"
 nick_usurper_prince: "el Príncipe Usurpador"
 nick_usurper_prince_desc: "Técnicamente hablando, todos los principados fueron usurpados de alguien más remontándose a Caín de todos modos."
 nick_doctor: "Doctor"
 nick_doctor_desc: "Una profesión en vida puede adquirir un significado mucho más oscuro en la no-muerte."
 nick_the_ticktock_man: "el Hombre del Tic-Tac"
 nick_the_ticktock_man_desc: "Tic. Tac. Tic. Tac.\nBoom."
 nick_count: "el Conde Rebelde"
 nick_count_desc: "La rebelión aristocrática tiene cierto atractivo rudo."
 nick_unhinged_autarkis: "Autarkis Desquiciado"
 nick_unhinged_autarkis_desc: "Si todo tiene que arder para que te sientas vivo de nuevo, que así sea."
 nick_tyler: "Tyler"
 nick_tyler_desc: "Wat Tyler inspiró a muchos, y Patricia lleva su nombre con orgullo y determinación en su corazón rebelde."
 nick_redeemed_knight: "Caballero Redimido"
 nick_redeemed_knight_desc: "La historia de Christof es una de Redención, provocada por un amor improbable y una diligencia incesante en su deber."
 nick_pelagian_heretic: "Hereje Pelagiano"
 nick_pelagian_heretic_desc: "Un día todos entenderán la brillantez de tu visión. Incluso si tienes que condenarlos a todos por ello."
 nick_the_pale: "el Pálido"
 nick_the_pale_desc: "A medida que la posibilidad de destrucción total se acerca, uno solo puede perder el color de sus mejillas."
 nick_scion_of_carthage: "Vástago de Cartago"
 nick_scion_of_carthage_desc: "Zamra encarna la utopía de Cartago más que nadie, lo que podría cegarla ante la verdad más oscura."
 nick_the_patriarch: "el Patriarca"
 nick_the_patriarch_desc: "La Familia exige respeto. Y el Patriarca exige un respeto eterno."
 nick_faithless_son: "el Hijo Infiel"
 nick_faithless_son_desc: "Lázaro vio la locura de Cappadocius, pero no pudo ver la suya propia."
 nick_guardian_of_the_necropoli: "Guardián de las Necrópolis"
 nick_guardian_of_the_necropoli_desc: "Angelique espera el regreso de su amado maestro, sabiendo que la verdadera salvación solo vendrá de sus manos."
 nick_faithful_son: "el Hijo Fiel"
 nick_faithful_son_desc: "Jafet apoyará a su padre hasta el inevitable y amargo final."
 nick_the_oracle_of_bones: "el Oráculo de Huesos"
 nick_the_oracle_of_bones_desc: "Constancia ve mucho y actúa aún más. Pero incluso entonces, sus esfuerzos podrían no ser suficientes para evitar la catástrofe que ve."
 nick_herald_of_kupala: "Heraldo de Kupala"
 nick_herald_of_kupala_desc: "Kupala caminará sobre la Tierra una vez más, reclamando gustosamente el cuerpo de su peón en el proceso. Esa será su única recompensa."
 nick_ambition_personified: "Ambición Personificada"
 nick_ambition_personified_desc: "Ambrogino Giovanni tiene el dudoso honor de ser el bastardo más interesado en sí mismo de todo un clan de bastardos interesados en sí mismos."
 nick_augustus_right_hand: "Mano Derecha de Augusto"
 nick_augustus_right_hand_desc: "Claudio hace la voluntad de su padre. Sin embargo, su recompensa podría no ser la que anhela."
 nick_weak_overseer: "Supervisor Débil"
 nick_weak_overseer_desc: "La debilidad no se tolera. Bueno, a menos que seas parte de la familia."
 nick_unrelenting_loyalist: "Leal Incesante"
 nick_unrelenting_loyalist_desc: "Markus quiere ser el ejemplo de su familia. Lamentablemente, es un Giovanni."
 nick_family_muscle: "Músculo de la Familia"
 nick_family_muscle_desc: "Ignazio no es sutil ni brillante, pero la eficiencia de una buena paliza no se puede exagerar."
 nick_exemplar_of_humanity: "Ejemplo de Humanidad"
 nick_exemplar_of_humanity_desc: "Dionisio codificó cómo debería actuar un vampiro. Su ejemplo es uno que muchos seguirán en el futuro."
 nick_reckless_occultist: "Ocultista Imprudente"
 nick_reckless_occultist_desc: "Lucrecia se lanza de cabeza a cualquier peligro. Su deseo de muerte aún la elude, quizás para su propia sorpresa."
 nick_the_queenoftombs: "Reina de las Tumbas"
 nick_the_queenoftombs_desc: "Apacia una vez guardó las tumbas de su pueblo escita. Es un legado del que todavía se siente orgullosa hasta esta noche."
 nick_guardian_of_nicaea: "Guardián de Nicea"
 nick_guardian_of_nicaea_desc: "Un deber autoimpuesto es el más probable de ser cumplido."
 nick_the_penitent: "el Penitente"
 nick_the_penitent_desc: "¿Existe realmente la salvación?"
 nick_byzantium_architect: "Arquitecto de Bizancio"
 nick_byzantium_architect_desc: "Byzar creó Bizancio antes de que se lo robaran Miguel y sus secuaces. Observó con sentimientos encontrados cuando Constantinopla finalmente ardió en 1204."
 nick_keeper_of_the_golgotha: "Guardián del Gólgota"
 nick_keeper_of_the_golgotha_desc: "En las profundidades subterráneas del secreto más oscuro del Clan Cappadocio, Unre espera su inevitable regreso."
 nick_the_gentleman: "el Caballero"
 nick_the_gentleman_desc: "El estoico y leal consejero de Mitras es una fuente de conocimiento, lista para transmitirla con su habitual y tranquila serenidad."
 nick_hanseatic_ambassador: "Embajador Hanseático"
 nick_hanseatic_ambassador_desc: "Desde Venecia hasta Alemania, unidos por el atractivo de la moneda."
 nick_wearer_sun_mask: "Portador de la Máscara del Sol"
 nick_wearer_sun_mask_desc: "Un apodo bastante literal."
 nick_fates_pawn: "Peón del Destino"
 nick_fates_pawn_desc: "Sabe que su muerte anunciará un gran cambio. También sabe que ya no tiene sentido huir de ello."
 nick_charnel_maid: "la Doncella del Osario"
 nick_charnel_maid_desc: "Drenis sufrió para finalmente ganarse su libertad. Sin embargo, su camino hacia la salvación apenas comienza."
 nick_cynical_abbot: "Abad Cínico"
 nick_cynical_abbot_desc: "Dios es indulgente después de todo."
 nick_broken_hersir: "Hersir Cansado"
 nick_broken_hersir_desc: "Werter sabe que el Ragnarok está aquí. Y sabe cómo termina."
 nick_the_untamed: "el Indómito"
 nick_the_untamed_desc: "Qarakh lucha por un futuro para su pueblo. Su furia salvaje se ve reforzada por la convicción en su causa."
 nick_bestial_force_of_nature: "Fuerza de la Naturaleza Bestial"
 nick_bestial_force_of_nature_desc: "Arnulf es un ejemplo para los Gangrel, el que realmente rechaza la civilización y luchará contra ella hasta el final."
 nick_furore_crusader: "Cruzado Furioso"
 nick_furore_crusader_desc: "Eirik lucha contra los cristianos con un celo impresionante. Pero su mayor enemigo podría ser su propia furia."
 nick_chooser_of_the_slain: "La que Elige a los Caídos"
 nick_chooser_of_the_slain_desc: "Una vez eligió a los dignos de luchar durante la batalla final. Y ahora se mantiene junto a ellos."
 nick_thehun: "la Huna"
 nick_thehun_desc: "Matasuntha una vez cabalgó con el Azote de Dios. Es la última de los hunos, los que hicieron gritar a la propia Roma de terror."
 nick_thesandstorm: "la Tormenta de Arena"
 nick_thesandstorm_desc: "Zayyat acecha las arenas de Arabia, proporcionando sabiduría a los dignos y muerte a los que no lo son."
 nick_witch_of_connaught: "la Bruja de Connacht"
 nick_witch_of_connaught_desc: "Tanto mito como realidad, la última bruja irlandesa ronda la isla, lista para defender su territorio de todos los intrusos."
 nick_last_polish_pagan: "la Última Pagana Polaca"
 nick_last_polish_pagan_desc: "Jolanta trabaja incansablemente para traer de vuelta una época pasada hace mucho tiempo. La futilidad de su causa la está volviendo lentamente loca."
 nick_crooked_eye: "Ojo Torcido"
 nick_crooked_eye_desc: "Valborg surca los mares como lo hicieron los vikingos de antaño. Incluso si los Aesir están muertos, no tiene intención de parar pronto."
 nick_the_valkyrie: "Diosa-Escudo"
 nick_the_valkyrie_desc: "Brunhilda fue elegida por el propio Odín para seleccionar a los Einherjar dignos de luchar por su causa. Ahora, tiene la intención de liderarlos."
 nick_the_young_wolf: "el Joven Lobo"
 nick_the_young_wolf_desc: "A veces, la sabiduría puede venir incluso de los jóvenes."
 nick_first_lilin: "la Primera Lilin"
 nick_first_lilin_desc: "Hukros encontró las Revelaciones de la Madre Oscura y ahora está difundiendo la verdad a aquellos que quieran escuchar."
 nick_warlord_of_the_camarilla: "Señor de la Guerra de la Camarilla"
 nick_warlord_of_the_camarilla_desc: "Una institución vigilada necesita un puño de hierro salvaje y brutal para mantenerla a raya."
 nick_the_nubian: "el Nubio"
 nick_the_nubian_desc: "Shabaqo inspira a los Gangrel a buscar una causa digna por la que luchar. Muchos buscan al exótico hombre de piel oscura para aprender su sabiduría."
 nick_the_night_general: "el General de la Noche"
 nick_the_night_general_desc: "El segundo al mando de Baba Yaga es honorable y leal hasta el extremo. Lidera su ejército y hará su voluntad, incluso contra el temido Antediluviano si es necesario."
 nick_the_reluctant_prince: "el Príncipe Renuente"
 nick_the_reluctant_prince_desc: "El poder lo es todo, incluso todo lo que no quieres."
 nick_lupine_hunter: "el Cazador de Licántropos"
 nick_lupine_hunter_desc: "Disfrutando del deporte más mortal de todos, haciendo que los vampiros parezcan presas dóciles en comparación."
 nick_the_reaver: "el Saqueador"
 nick_the_reaver_desc: "Una reliquia de una época pasada, todavía navegando con la esperanza de noches mejores por delante."
 nick_the_midnight_queen: "la Reina de la Medianoche"
 nick_the_midnight_queen_desc: "Cuando las luces están apagadas, el espectáculo continúa."
 nick_the_egyptian: "el Egipcio"
 nick_the_egyptian_desc: "Un apodo despectivo para un invasor indigno."
 nick_diplomatic_shaman: "Chamán Diplomático"
 nick_diplomatic_shaman_desc: "Inyanga protegió ferozmente a su pueblo con trucos inteligentes y engaños. La fuerza de sus palabras puede crear héroes y deshacer Príncipes."
 nick_savage_military_mastermind: "Mente Maestra Militar Salvaje"
 nick_savage_military_mastermind_desc: "La paciencia no lo es todo. Se pueden ganar guerras con poder bruto."
 nick_geoffrey_leigh: "Geoffrey Leigh"
 nick_geoffrey_leigh_desc: "Renunciando a las propias raíces para renacer de nuevo, limpiado de errores pasados."
 nick_curious_nomad: "Nómada Curioso"
 nick_curious_nomad_desc: "Creando nuevas identidades y formando nuevos mitos a su alrededor, cada una una nueva capa de protección."
 nick_chief_enforcer: "el Jefe de los Verdugos"
 nick_chief_enforcer_desc: "El orden se hará cumplir, a dentelladas y zarpazos si es necesario."
 nick_scion_of_constantinople: "Vástago de Constantinopla"
 nick_scion_of_constantinople_desc: "Tomás lo debe todo a Constantinopla. Y quiere pagar su deuda por cualquier medio necesario."
 nick_byzantine_envoy: "Enviado Bizantino"
 nick_byzantine_envoy_desc: "La autoridad rota de un imperio roto no significa mucho."
 nick_warlord_of_avalon: "Señor de la Guerra de Ávalon"
 nick_warlord_of_avalon_desc: "El leal señor de la guerra de Mitras lleva consigo la autoridad y la amistad de su poderoso patrón en todas sus batallas."
 nick_veela_priestess: "Sacerdotisa Veela"
 nick_veela_priestess_desc: "Una reliquia de una época pasada, tratando de frenar el ataque de la Cruz en sus tierras."
 nick_beast_of_wales: "la Bestia de Gales"
 nick_beast_of_wales_desc: "La tierra tiene a su protector. Pero podría ser demasiado poco, demasiado tarde."
 nick_shadow_prince: "el Príncipe Sombra"
 nick_shadow_prince_desc: "Marc sabe que el verdadero poder no consiste necesariamente en sentarse en un trono."
 nick_treacherous_beast: "la Bestia Traicionera"
 nick_treacherous_beast_desc: "Esta te morderá la mano."
 nick_tireless_pagan: "la Pagana Incansable"
 nick_tireless_pagan_desc: "Su fe se está muriendo, su fuerza de voluntad se está agotando. Descansar solo la deshará."
 nick_friend_of_wolves: "Amigo de los Lobos"
 nick_friend_of_wolves_desc: "Aliados poderosos para tener, mientras no huelan la mancha en ti."
 nick_vanguard_of_the_west: "Vanguardia de Occidente"
 nick_vanguard_of_the_west_desc: "Para derrotar a tus enemigos, primero debes entenderlos."
 nick_shattered_mind: "de la Mente Fragmentada"
 nick_shattered_mind_desc: "La claridad perdida en los vientos, la locura llenando el vacío."
 nick_noble_savage: "el Salvaje Noble"
 nick_noble_savage_desc: "Interpretando el papel, pero nunca perteneciendo realmente a ellos."
 nick_spineless_tactician: "el Táctico Sin Espina"
 nick_spineless_tactician_desc: "A veces también conocido como el general de sillón."
 nick_god_river_of_darkness: "Dios del Río de la Oscuridad"
 nick_god_river_of_darkness_desc: "Lasombra es la propia oscuridad, librando una batalla contra el único enemigo digno: el sol."
 nick_hammer_of_the_goths: "Martillo de los Godos"
 nick_hammer_of_the_goths_desc: "Narsés ganó todas sus batallas políticas y militares. Su triunfo definitivo sobre Bizancio fue también su perdición."
 nick_latin_tyrant: "el Tirano Latino"
 nick_latin_tyrant_desc: "Alfonzo ganó Constantinopla. Pero tuvo que romperla en el proceso, gobernando ahora sobre una ciudad en ruinas llena de los fantasmas del pasado."
 nick_true_believer: "el Verdadero Creyente"
 nick_true_believer_desc: "El Tercer Caín está cerca. Solo los dignos serán recompensados durante su venida."
 nick_sword_of_alandalus: "Espada de Al-Ándalus"
 nick_sword_of_alandalus_desc: "Badr lleva consigo las esperanzas de una cultura moribunda. Eligió luchar con un abandono brutal para hacerla sobrevivir."
 nick_lord_of_shadows: "Señor de las Sombras"
 nick_lord_of_shadows_desc: "Silvester lidera la Reconquista. Pero sus enemigos podrían estar más cerca de él de lo que cree."
 nick_the_gadfly: "el Tábano"
 nick_the_gadfly_desc: "Zamra nunca se rinde con su presa o su ambición. Muchos la subestimaron una vez, pocos lo hicieron dos veces."
 nick_monarch_of_the_light: "Monarca de la Luz"
 nick_monarch_of_the_light_desc: "La heredera de la ciudad más grande del mundo, brillando entre un clan de sombras."
 nick_first_mullah: "el Primer Mulá"
 nick_first_mullah_desc: "Suleiman vio la redención de la raza Cainita en los pasos del Profeta hace mucho tiempo. Nada puede hacerle desviarse de este camino ahora."
 nick_repudied_daughter: "la Hija Repudiada"
 nick_repudied_daughter_desc: "Un padre que repudia a su hija crea un enemigo para toda la vida. Y Sybil tiene la intención de vivir lo suficiente para ver su venganza."
 nick_the_praetorian: "el Pretoriano"
 nick_the_praetorian_desc: "Forjados en los fuegos de los mejores de Roma, los Pretorianos eran amos ambiciosos de la guerra y la intriga. Convertirse en vampiro no cambió mucho realmente."
 nick_the_upstart: "el Advenedizo"
 nick_the_upstart_desc: "Graciano se lo debe todo a su (autoproclamada) incomparable variedad de talentos. Lamentablemente, muchos no parecen estar de acuerdo con este simple hecho."
 nick_dutiful_sire: "el Sire Cumplidor"
 nick_dutiful_sire_desc: "Boukephos es renombrado como mentor de los Lasombra emergentes. Sus enseñanzas pueden ser duras, pero siempre terminan siendo fructíferas."
 nick_guardian_lasmedulas: "Guardián de Las Médulas"
 nick_guardian_lasmedulas_desc: "Siempre atraído de vuelta a las minas que forjaron quién es, Marcelo encuentra consuelo en proteger el único lugar que le recuerda su pasado."
 nick_the_subtle_shadow: "la Sombra Sutil"
 nick_the_subtle_shadow_desc: "De Polanco juega a largo plazo y no le da vergüenza. Áspero pero honorable, pocos subestimarían su talento para la sutileza y la planificación."
 nick_hero_of_the_reconquista: "Héroe de la Reconquista"
 nick_hero_of_the_reconquista_desc: "Tercio Bravo luchó junto al propio Cid, pero olvidó la verdadera lección de la historia de su amigo en el camino."
 nick_cardinal_maledictus_sanguine: "Cardenal Maledictus Sanguine"
 nick_cardinal_maledictus_sanguine_desc: "Su Excelencia está guiado por Dios. Todos sus actos, desde los benignos hasta los monstruosos, son parte de Su plan."
 nick_the_independent: "el Independiente"
 nick_the_independent_desc: "Mantenerse alejado de las disputas de los demás es una virtud, pero también puede llevar a una falta de aliados."
 nick_the_golden: "el Dorado"
 nick_the_golden_desc: "El oro puede ser cegador, incluso para su dueño."
 nick_the_knight: "el Caballero"
 nick_the_knight_desc: "La caballería no está muerta. Solo está no-muerta."
 nick_desperate_sultan: "el Sultán Desesperado"
 nick_desperate_sultan_desc: "La desesperación solo acelera la perdición de uno."
 nick_the_spark_of_war: "la Chispa de la Guerra"
 nick_the_spark_of_war_desc: "Largo tiempo gestándose, una guerra civil aún necesita un punto de partida adecuado."
 nick_the_mistake: "el Error"
 nick_the_mistake_desc: "Un dicho en la sociedad Ashirra dice: Tus errores no te persiguen. En cambio, te llaman Sire."
 nick_the_prodigal_daughter: "la Hija Pródiga"
 nick_the_prodigal_daughter_desc: "Lucita se enfurece contra todas las jaulas en su vida. Pero, ¿qué pasará cuando no quede ninguna?"
 nick_daughter_of_genoa: "Hija de Génova"
 nick_daughter_of_genoa_desc: "La república expande sus horizontes. Sus patrones no-muertos hacen lo mismo."
 nick_intense_venus: "la Venus Intensa"
 nick_intense_venus_desc: "Aconia lo experimenta todo al máximo, sin ataduras de nada ni nadie que quiera mantenerla a raya."
 nick_king_of_rome: "Rey de Roma"
 nick_king_of_rome_desc: "Algunos títulos se ganan por mérito. Otros son solo autoproclamados. Esto es lo último."
 nick_lasombra_guardian: "Guardián de Lasombra"
 nick_lasombra_guardian_desc: "Devota de su padre oscuro, hará cualquier cosa para protegerlo."
 nick_the_reformist: "el Reformista"
 nick_the_reformist_desc: "El cambio llega lentamente en la sociedad eterna de los no-muertos."
 nick_latin_dissenter: "la Disidente Latina"
 nick_latin_dissenter_desc: "En un océano de traición y tiranía latina, Gabriela es la pequeña gota de una solución alternativa para la convivencia."
 nick_the_patient_sister: "la Hermana Paciente"
 nick_the_patient_sister_desc: "Una presencia calmante en una familia desarticulada, quizás suficiente para sanarla."
 nick_the_hound: "el Sabueso"
 nick_the_hound_desc: "Talley nunca pierde el rastro de su presa. Pero a veces, incluso el mejor perro de caza puede resentir la correa de su amo."
 nick_military_cardinal: "el Cardenal Militar"
 nick_military_cardinal_desc: "Guerra y fe, encadenadas como una sola."
 nick_the_people_choice: "la Elección del Pueblo"
 nick_the_people_choice_desc: "Y si el pueblo no está de acuerdo, serán puestos de nuevo en fila."
 nick_traitor_prince: "el Príncipe Traidor"
 nick_traitor_prince_desc: "Las lealtades de Giangaleazzo son tan volubles como el viento. Quizás incluso más, de hecho."
 nick_unruly_daughter: "la Hija Rebelde"
 nick_unruly_daughter_desc: "Nacer en la grandeza puede ser un hecho sofocante en la sociedad no-muerta."
 nick_treacherous_daughter: "la Hija Traicionera"
 nick_the_many_faced: "el de las Muchas Caras"
 nick_the_many_faced_desc: "¿Pero dónde está la verdadera?"
 nick_of_the_hoof: "del Casco"
 nick_of_the_hoof_desc: "¿Era el caballo realmente leal a su jinete?"
 nick_savage_sorceress: "Hechicera Salvaje"
 nick_savage_sorceress_desc: "¿Quién dijo que la magia tenía que ser aburrida y ritualista?"
 nick_sabbat_crusader: "Cruzado del Sabbat"
 nick_sabbat_crusader_desc: "Verdaderos creyentes, listos para luchar y morir por una causa."
 nick_smiling_mastermind: "Mente Maestra Sonriente"
 nick_smiling_mastermind_desc: "Pietro está preparando el futuro de la Tal'mahe'Ra. Detrás de su fácil sonrisa se esconden intrigas dentro de intrigas."
 nick_conrad: "Conrad"
 nick_conrad_desc: "Identidades dentro de identidades, confundiendo a enemigos y amigos por igual."
 nick_daring_pirate: "la Pirata Audaz"
 nick_daring_pirate_desc: "A través de los siete mares, cazando a los amos de las sombras donde creen que gobiernan."
 nick_crafty_ambassador: "la Embajadora Astuta"
 nick_crafty_ambassador_desc: "En la casa de las sombras, los embajadores pueden ser tan mortales como los asesinos."
 nick_misguided_zealot: "el Fanático Equivocado"
 nick_misguided_zealot_desc: "El celo puede ser un arma poderosa, o un poderoso error."
 nick_burgeoning_diplomat: "el Diplomático Floreciente"
 nick_burgeoning_diplomat_desc: "Una vida protegida, que lleva a un comienzo lento pero prometedor de una no-muerte."
 nick_magister_envoy: "Enviado Magister"
 nick_magister_envoy_desc: "¿Usurpadores y sombras, trabajando al unísono?"
 nick_small: "el Pequeño"
 nick_small_desc: "Subestimado por los que no saben, a menudo por su propio riesgo."
 nick_disgraced_physician: "Médico Deshonrado"
 nick_disgraced_physician_desc: "El médico no se curó a sí mismo."
 nick_fanatic_cultist: "Cultista Fanático"
 nick_fanatic_cultist_desc: "En la devoción absoluta, salvación para algunos y condenación para otros."
 nick_the_moon: "la Luna"
 nick_the_moon_desc: "Tocado por la luna, mirando a la luna que los tocó."
 nick_mad_prince: "el Príncipe Loco"
 nick_mad_prince_desc: "Solo yo y las calaveras de mis cortesanos disfrutando de una buena comida. No hay nada que ver aquí."
 nick_the_madman_of_marrakich: "el Loco de Marrakech"
 nick_the_madman_of_marrakich_desc: "No entienden. Quizás es mejor así."
 nick_prince_of_the_mad: "Príncipe de los Locos"
 nick_prince_of_the_mad_desc: "Roque gobierna a su pueblo con la paranoia necesaria para un líder de la noche. Y quizás un poco más."
 nick_the_greek_relic: "la Reliquia Griega"
 nick_the_greek_relic_desc: "Si estás en Atenas, actúa como un antiguo griego."
 nick_vengeful_conspirator: "Conspirador Vengativo"
 nick_vengeful_conspirator_desc: "La venganza puede volver loco a uno."
 nick_the_sybil: "la Sibilia"
 nick_the_sybil_desc: "Tryphosa ve el futuro y actúa según estas visiones. ¿Dónde está la línea entre presenciar y hacer historia?"
 nick_the_mortified_one: "el Mortificado"
 nick_the_mortified_one_desc: "Cada cicatriz es un recordatorio del precio del conocimiento y la sabiduría. Incluso si todo vale la pena al final."
 nick_deadly_devoted: "la Mortalmente Devota"
 nick_deadly_devoted_desc: "Vasantasena lucha por sus convicciones con una pasión raramente vista entre su especie de corazón frío."
 nick_cainite_krive: "Krive Cainita"
 nick_cainite_krive_desc: "Luchando por los perdidos, y los que pronto se perderán."
 nick_abbess_of_cain: "Abadesa de Caín"
 nick_abbess_of_cain_desc: "Alabado sea el Padre Oscuro, para que Él pueda regresar con nosotros una noche."
 nick_old_man_hate: "Viejo Odio"
 nick_old_man_hate_desc: "El Príncipe Astuto. Iktomi. Malk Content. El Babilonio. Diablo Hanse. Come-tontos. ¿Quién sabe realmente?"
 nick_sunblind_prophet: "el Profeta Ciego de Sol"
 nick_sunblind_prophet_desc: "Mirar al sol puede ser cegador o esclarecedor."
 nick_the_syracusan: "el Siracusano"
 nick_the_syracusan_desc: "Alchias se mantuvo firme con sus aliados romanos contra los horrores de Cartago, antes de pagar el precio por su valentía."
 nick_holy_harbinger: "Heraldo Sagrado"
 nick_holy_harbinger_desc: "Anatole escucha a Dios. Un hombre tan bendecido puede ser tu amigo más cercano o tu enemigo más mortal."
 nick_typhoid_mary: "María la Tifoidea"
 nick_typhoid_mary_desc: "Pagada por su bondad con locura, María acecha el mundo buscando compañía perdida."
 nick_his_own_enemy: "su Propio Enemigo"
 nick_his_own_enemy_desc: "Esaú está encerrado en una lucha mortal con Jacob. Después de todo, la propia mente puede ser el enemigo más terrible."
 nick_her_better_half: "su Mejor Mitad"
 nick_her_better_half_desc: "¿Quién lo negaría?"
 nick_auntie: "Tía"
 nick_auntie_desc: "Buscando a sus sobrinos y sobrinas desde su locura ilustrada."
 nick_plot_twist: "el Giro Argumental"
 nick_plot_twist_desc: "No te esperabas esa, ¿verdad?"
 nick_the_jocastatian: "La Jocastatiana"
 nick_the_jocastatian_desc: "Conocimiento transmitido a través de la sangre."
 nick_the_conquistadora: "la Conquistadora"
 nick_the_conquistadora_desc: "Como los audaces aventureros de antaño, conquistando todo a su paso sin notar el número de víctimas."
 nick_the_twice_damned: "el Dos Veces Maldito"
 nick_the_twice_damned_desc: "Elimelec buscó expiar el más grande de los crímenes, pero solo cayó más profundamente en el horror como resultado."
 nick_the_lion_of_bactria: "el León de Bactria"
 nick_the_lion_of_bactria_desc: "Una vez luchando junto a los más grandes generales, Lados se ganó su reputación como un príncipe soldado de renombre."
 nick_vengeful_longbow: "Arco Largo Vengativo"
 nick_vengeful_longbow_desc: "Los advenedizos deben ser puestos en su lugar, sofocando sus mezquinos gritos de independencia."
 nick_the_arthurian: "el Artúrico"
 nick_the_arthurian_desc: "La Búsqueda del Grial hecha manifiesta, al menos en la mente engañada de un necio."
 nick_dark_thaumaturgist: "el Taumaturgo Oscuro"
 nick_dark_thaumaturgist_desc: "Zettler trabaja para el más oscuro de los dioses, uno que haría retroceder de horror incluso al Tzimisce más cínico."
 nick_of_cruel_appetites: "de Apetitos Crueles"
 nick_of_cruel_appetites_desc: "Aprovecharse de la presa más fácil no te convierte en un depredador. Te convierte en un cobarde."
 nick_the_peacock_prince: "el Príncipe Pavo Real"
 nick_the_peacock_prince_desc: "¿Le ves pavoneándose?"
 nick_the_noddist: "el Nodista"
 nick_the_noddist_desc: "La verdad está en los viejos mitos. Quizás el final también."
 nick_the_lizard: "el Lagarto"
 nick_the_lizard_desc: "El lagarto no puede evitar la suave caricia del sol para siempre."
 nick_master_of_ravens: "Maestro de los Cuervos"
 nick_master_of_ravens_desc: "Odio, amor y locura hirviendo en uno. El cuervo de tres ojos descarría a la gente."
 nick_great_liar: "el Gran Mentiroso"
 nick_great_liar_desc: "Quizás incluso el apodo es una mentira."
 nick_lazarus_james: "Lázaro James"
 nick_lazarus_james_desc: "Una blasfemia nacida de una mente rota."
 nick_relentless_fury: "Furia Incesante"
 nick_relentless_fury_desc: "Guardar rencor es un arte que ha dominado hace siglos."
 nick_voice_of_kupala: "Voz de Kupala"
 nick_voice_of_kupala_desc: "Escuchar la voz del Dios Oscuro es más una maldición que una bendición."
 nick_witness_end_times: "Testigo del Fin de los Tiempos"
 nick_witness_end_times_desc: "Al final, él seguirá mirando."
 nick_fool_of_magdeburg: "Bufón de Magdeburgo"
 nick_fool_of_magdeburg_desc: "Entreteniendo a los poderosos, riéndose de ellos con impunidad."
 nick_the_littlegrandmother: "la Abuelita"
 nick_the_littlegrandmother_desc: "Ella está protegiendo a su clan de un monstruo terrible. ¿Pero puede protegerlos de sí misma?"
 nick_the_defender: "el Defensor"
 nick_the_defender_desc: "Empujado al principado por un golpe del destino, Josef sigue mirando ante todo a su familia extensa."
 nick_the_one_that_got_away: "la que se Escapó"
 nick_the_one_that_got_away_desc: "Cazada por el propio Cazador, una huida eterna es la única opción."
 nick_hope_of_the_clan: "Esperanza del Clan"
 nick_hope_of_the_clan_desc: "Entre su fundador maldito y la Bruja demente, Angiwar se erige orgulloso como una esperanza para el futuro de los Nosferatu."
 nick_the_consigliere: "el Consigliere"
 nick_master_of_denmark: "Amo de Dinamarca"
 nick_master_of_denmark_desc: "Absalón creó Dinamarca. ¿Pero puede controlarla?"
 nick_guardian_of_holy_cities: "Guardián de las Ciudades Santas"
 nick_guardian_of_holy_cities_desc: "Tarique solo responde a la más alta de las vocaciones, la fe misma."
 nick_the_salt_queen: "la Reina de la Sal"
 nick_the_salt_queen_desc: "Habiéndose encontrado atrapada en las minas de sal de Cracovia, toda la identidad de Gutka se ha desplazado hacia lo extraño."
 nick_the_spared: "el Perdonado"
 nick_the_spared_desc: "Perdonado por el propio Caín o maldito mentalmente en lugar de físicamente, nadie sabe la verdad sobre Yima, pero muchos la buscan."
 nick_exemplar_justicar: "Justicar Ejemplar"
 nick_spider_eater: "Come Arañas"
 nick_the_sewer_goddess: "la Diosa de las Cloacas"
 nick_witch_of_paris: "la Bruja de París"
 nick_witch_of_paris_desc: "Mnemach estaba aquí antes de que París fuera algo. Podría seguir aquí después de que deje de serlo."
 nick_most_wanted: "la Más Buscada"
 nick_the_penitent_dog: "el Perro Penitente"
 nick_chosen_of_michael: "Elegido de Miguel"
 nick_chosen_of_michael_desc: "Malaquita vio la salvación en el Sueño de Miguel. Ahora soporta la pesada carga de continuarlo en su lugar."
 nick_the_truth_in_the_walls: "la Verdad en los Muros"
 nick_brash_monitor: "Monitor Audaz"
 nick_gentle_annie: "Annie la Gentil"
 nick_gentle_annie_desc: "No dejes a tu cordero o a tus hijos solos por la noche."
 nick_madame: "Madame"
 nick_golden_son: "el Hijo Dorado"
 nick_golden_son_desc: "La salvación parece venir al precio de una moneda."
 nick_matron: "Matrona"
 nick_the_vanguard: "la Vanguardia"
 nick_preacher_of_sin: "el Predicador del Pecado"
 nick_preacher_of_sin_desc: "Yendo lejos y ancho para predicar el evangelio de la libertad, pero siempre regresando a casa al final."
 nick_the_forsaken: "el Abandonado"
 nick_the_accursed_monster: "el Monstruo Maldito"
 nick_the_accursed_monster_desc: "Tratar con demonios puede convertirte en un diablo, a menos que ya lo fueras antes."
 nick_prince_of_dirt: "el Príncipe de la Suciedad"
 nick_prince_of_dirt_desc: "Como los vampiros no podían entrar en Acre durante mucho tiempo, Etienne fue llamado irónicamente el Príncipe de la Suciedad. Mantuvo el apodo incluso después de asegurar la ciudad como un recordatorio humillante de su pasado."
 nick_the_general: "el General"
 nick_the_general_desc: "La Guerra Eterna necesita un General Eterno. Chandraputra es ese hombre."
 nick_the_warrior_scholar: "el Erudito Guerrero"
 nick_the_warrior_scholar_desc: "¿Por qué elegir entre el pergamino y la espada cuando puedes aplastar a tus enemigos con ambos?"
 nick_the_rakshasa_of_rakshasas: "el Rakshasa de los Rakshasas"
 nick_the_rakshasa_of_rakshasas_desc: "Demonio o salvador, Hazimel podría ser ambas cosas."
 nick_the_vaisya: "el Vaisya"
 nick_the_vaisya_desc: "Presentándose orgullosamente como comerciante, Ramessu fusionó Egipto con su India natal."
 nick_kind_mentor: "el Mentor Amable"
 nick_kind_mentor_desc: "Todos los héroes necesitan un mentor amable y paciente. No pueden hacer mucho mejor que Durga Syn."
 nick_rising_star: "la Estrella Ascendente"
 nick_rising_star_desc: "Una nueva estrella ha nacido en Bagdad. Pero las sombras de los mongoles se acercan cada vez más."
 nick_avaricious_prophet: "el Estudiante Avaricioso"
 nick_avaricious_prophet_desc: "¿Fe o beneficio? ¿Por qué no ambas?"
 nick_the_wonder_maker: "el Hacedor de Maravillas" #TBD
 nick_the_vengeful_apprentice: "la Aprendiz Vengativa"
 nick_the_vengeful_apprentice_desc: "Zoe vengó a su mentor y casi se pierde a sí misma en el proceso. Aprender de Anatole la salvó."
 nick_careless_pawn: "el Peón Descuidado"
 nick_careless_pawn_desc: "En el gran juego, este solo tropieza, siendo manipulado por sus (muchos) superiores."
 nick_black_mother: "la Madre Negra"
 nick_black_mother_desc: "Kali vio la división dentro de los Ravnos y se apartó de ellos. Pero regresará en sus momentos de necesidad."
 nick_driven_knight: "la Caballero Impulsado"
 nick_driven_knight_desc: "Phaedyme adoptó la caballería como un guante. Espera que todo el clan Ravnos haga lo mismo."
 nick_courtly_entertainer: "Animador Cortesano" #TBD
 nick_the_phoenix: "el Fénix" #TBD
 nick_the_new_blood: "la Sangre Nueva" #TBD
 nick_the_setting_sun: "el Sol Poniente" #TBD
 nick_thelionessofjerusalem: "la Leona de Jerusalén"
 nick_thelionessofjerusalem_desc: "Qawiyya tomó Jerusalén por asalto con sus audaces acciones. Si los cachorros perdidos de los Salubri necesitan una madre a la que unirse, no necesitan buscar más allá."
 nick_the_wise_counsel: "el Consejo Sabio"
 nick_the_wise_counsel_desc: "Los guerreros deben ser equilibrados por los sanadores. La acción debe ser equilibrada por la sabiduría."
 nick_singer_of_peace: "Cantora de Paz"
 nick_singer_of_peace_desc: "Ella cantará para nosotros hasta el final. Y quizás será suficiente."
 nick_the_flaming_sword: "la Espada Llameante"
 nick_the_flaming_sword_desc: "El paradigma de los Salubri murió con la espada en la mano, su deber aparentemente cumplido."
 nick_third_eyed_heretic: "la Hereje del Tercer Ojo" #TBD
 nick_third_eyed_heretic_desc: "Su tercer ojo ve el camino hacia la salvación. O eso dice."
 nick_the_retribution: "la Retribución"
 nick_the_retribution_desc: "Incluso a un pacifista se le puede empujar demasiado."
 nick_the_fearless_cub: "el Cachorro Sin Miedo" #TBD
 nick_dedicated_warrior: "Guerrera Dedicada"
 nick_dedicated_warrior_desc: "Yael lucha para que la verdadera vocación de su clan pueda sobrevivir a su caída inevitable."
 nick_last_historian: "la Última Historiadora"
 nick_last_historian_desc: "Los Salubri terminarán, pero con suerte su historia les sobrevivirá."
 nick_divine_punishment: "el Castigo Divino"
 nick_divine_punishment_desc: "Ella castigará a aquellos que perjudicaron a su clan, incluso si eso significa perderse a sí misma al final."
 nick_the_last_elder: "la Última Anciana"
 nick_the_last_elder_desc: "Y cayó la última ficha de dominó."
 nick_sword_of_vengeance: "Espada de la Venganza"
 nick_sword_of_vengeance_desc: "Es demasiado tarde para la salvación, pero quizás no para la venganza."
 nick_the_forgiving: "el Indulgente" #TBD
 nick_typhon: "Tifón"
 nick_typhon_desc: "Nuestra salvación, nuestra libertad, solo al precio de nuestra alma."
 nick_the_first_son: "el Primer Hijo"
 nick_the_first_son_desc: "Es más fácil seguir a un Dios cuando primero lo conociste como hombre."
 nick_the_voice_of_reason: "la Voz de la Razón"
 nick_the_voice_of_reason_desc: "Ser la única voz sensata en un consejo de inmortales egoístas no es fácil."
 nick_the_sorceress: "la Hechicera"
 nick_the_sorceress_desc: "Maestría de las artes oscuras, trascendida a un grado impresionante."
 nick_the_beloved_of_the_moon: "la Amada de la Luna"
 nick_the_beloved_of_the_moon_desc: "Set quizás nunca amó verdaderamente. Pero si lo hizo, Maatkare fue la elegida."
 nick_he_who_lives: "El que Vive para el Dios Sol"
 nick_he_who_lives_desc: "Predicando la gloria de Set con el ejemplo, fomentando la libertad y el crecimiento dondequiera que camina."
 nick_night_jarl: "el Jarl Nocturno" #TBD
 nick_religious_scholar: "Erudito Religioso"
 nick_religious_scholar_desc: "La serpiente guía su mano, agudizando su mente."
 nick_snake_among_snakes: "Serpiente entre Serpientes"
 nick_snake_among_snakes_desc: "Hay pocos conceptos o personas que Sarrasine no haya traicionado aún. ¿Para el resto? Solo dale tiempo."
 nick_the_snake_of_eden: "la Serpiente del Edén" #TBD
 nick_daughter_of_hel: "Hija de Hel"
 nick_daughter_of_hel_desc: "La Serpiente toma muchas formas, y algunas de ellas son más dignas de alabanza que otras."
 nick_opportunistic_preacher: "Predicador Oportunista"
 nick_opportunistic_preacher_desc: "A Set no le importará si obtienes una ganancia rápida mientras difundes su palabra, ¿verdad?"
 nick_set_worst_nightmare: "la Peor Pesadilla de Set"
 nick_set_worst_nightmare_desc: "Y la última hija de Isis nunca se quebró. Su venganza una noche lo consumirá todo, incluida a sí misma."
 nick_fire_child: "la Hija del Fuego"
 nick_fire_child_desc: "La dueña de la Corte de Fuego es un ejemplo Setita tanto en lo bueno como en lo malo."
 nick_goddess_moon: "Diosa de la Luna" #TBD
 nick_queen_of_europe: "Reina de Europa"
 nick_queen_of_europe_desc: "Nefertiti prefiere obtener la fama del logro antes de lograrlo realmente."
 nick_occult_trader: "la Comerciante Ocultista" #TBD
 nick_born_from_fire: "Nacida del Fuego"
 nick_born_from_fire_desc: "Su cabello rojo es una bendición de Set, comienza audazmente su viaje para entender sus misterios."
 nick_lady: "Dama" #TBD
 nick_egyptologist: "el Egiptólogo"
 nick_egyptologist_desc: "Su pasión por Egipto alimenta la sed de conocimiento de Marriot."
 nick_the_copt: "el Copto" #TBD
 nick_the_serpent_of_paris: "la Serpiente de París"
 nick_the_serpent_of_paris_desc: "La ciudad de la Luz tiene un lado más oscuro. Jean-Baptiste es quien lo dirige."
 nick_the_rooster: "el Gallo" #TBD
 nick_temple_warrior: "el Guerrero del Templo" #TBD
 nick_amir_of_chains: "el Amir de las Cadenas" #TBD
 nick_tester_wanting: "el Evaluador Hallado Deficiente"
 nick_tester_wanting_desc: "Su mayor prueba es su propia alma. Y hasta ahora, ha fallado en todas."
 nick_champion_of_set: "Campeón de Set"
 nick_champion_of_set_desc: "Encargado de la protección de Set de generación en generación, los Qufur nunca han fallado en su deber."
 nick_gold_observer: "el Observador Dorado" #TBD
 nick_third_vessel_of_iniquity: "el Tercer Vaso de Iniquidad"
 nick_third_vessel_of_iniquity_desc: "En la Corte de Fuego, caer en desgracia es una forma de arte perfeccionada."
 nick_the_blossom: "la Flor"
 nick_the_blossom_desc: "La bella doncella de Enoc fue maldita por su vanidad, o quizás porque recordaba demasiado a los demás lo que habían perdido."
 nick_patriarch_of_constantinople: "Patriarca de Constantinopla"
 nick_patriarch_of_constantinople_desc: "Miguel creó un Sueño, y luego lo convirtió en una pesadilla."
 nick_red_empress: "la Emperatriz Roja"
 nick_red_empress_desc: "Roja con la sangre de su golpe, Salianna finalmente ascendió a su libertad, pero no a su salvación."
 nick_la_noire: "la Noire"
 nick_la_noire_desc: "Su ascendencia mora le valió a Esclarmonde este grosero apodo. Pero lo ha hecho suyo, y ahora lo lleva con orgullo."
 nick_king_of_roses: "el Rey de las Rosas"
 nick_king_of_roses_desc: "Único Rey entre Reinas, Etienne sabe cómo mezclarse entre las sombras y beneficiarse de ellas."
 nick_la_juste: "la Juste"
 nick_la_juste_desc: "La bella doncella de Champaña es justa en todas las cosas, excepto cuando su capricho infantil se apodera de ella."
 nick_saint: "Santo"
 nick_saint_desc: "Este Santo ha caído muy lejos, y el fondo del pozo aún no está a la vista."
 nick_living_tragedy: "la Tragedia Viviente"
 nick_living_tragedy_desc: "Su vida será un mito, su dolor será el entretenimiento de otros."
 nick_the_archangel: "el Arcángel"
 nick_the_archangel_desc: "Andrés predica la Herejía, incluso mientras su fe sangra por los bordes."
 nick_charming_con_man: "Estafador Encantador"
 nick_charming_con_man_desc: "Confía en este hombre solo hasta donde puedas lanzarlo. O mejor aún, no confíes en él en absoluto."
 nick_the_blue: "el Azul"
 nick_the_blue_desc: "El Ragnarok necesitará su escaldo. Karl está listo para ser ese hombre."
 nick_empowered_childe: "el Vástago Empoderado"
 nick_empowered_childe_desc: "La desaparición de un hombre es la oportunidad de otro."
 nick_fallen_prince: "el Príncipe Caído"
 nick_fallen_prince_desc: "No queda nada del orgulloso y sabio sultán de antaño, excepto su amor por su vástago."
 nick_fairy_of_lusignan: "el Hada de Lusignan"
 nick_fairy_of_lusignan_desc: "Aléjate del hada, que hizo huir de ella tanto a lo sagrado como a lo profano."
 nick_self_proclaimed_archbishop: "Arzobispo Autoproclamado"
 nick_self_proclaimed_archbishop_desc: "Ningún obispo ungió a Adrián, excepto el que vio en un reflejo."
 nick_goddess_among_mortals: "Diosa entre los Mortales"
 nick_goddess_among_mortals_desc: "Y al divisar a Helena moviéndose por las murallas, murmuraron unos a otros, suaves palabras aladas: '¿Quién en la tierra podría culparlos? Ah, no es de extrañar que los hombres de Troya y los argivos armados hayan sufrido años de agonía todo por ella, por una mujer así. ¡Belleza, terrible belleza! diosa inmortal – ¡así golpea nuestros ojos!'"
 nick_aspiring_baron: "Barón Aspirante"
 nick_aspiring_baron_desc: "Sueña con baronías, catedrales y multitudes arrodilladas."
 nick_shield_of_the_north: "Escudo del Norte"
 nick_shield_of_the_north_desc: "El protector del Norte sabe que un escudo puede ser un arma ofensiva mortal si se usa correctamente."
 nick_le_vieux: "le Vieux"
 nick_le_vieux_desc: "La vejez aparente en sus rasgos, Gerardo está más preocupado por su posición que por su empañada reputación."
 nick_iceland_shieldmaiden: "Doncella Escudera de Islandia"
 nick_iceland_shieldmaiden_desc: "Lejos del continente, las viejas tradiciones se mantienen vivas por alguien que creyó en ellas durante su vida."
 nick_careless_hedonist: "Hedonista Despreocupado"
 nick_careless_hedonist_desc: "Si la vida es un juego, Iontius tiene la intención de vivirla al máximo."
 nick_lover_of_beauty: "Amante de la Belleza"
 nick_lover_of_beauty_desc: "Cegado por visiones de grandeza artística, uno puede caer fácilmente en trampas más terrenales."
 nick_immortal_sword_maker: "Forjador de Espadas Inmortal"
 nick_immortal_sword_maker_desc: "La fragua sigue viva. Incluso cuando su dueño ya no lo está."
 nick_shrewd_grandmaster: "el Gran Maestre Astuto" #TBD
 nick_sire: "Sir" #TBD
 nick_bloody_rose: "la Rosa Sangrienta"
 nick_bloody_rose_desc: "Solo quedan espinas en esta rosa."
 nick_broken_poet: "el Poeta Roto"
 nick_broken_poet_desc: "Su talento le dio todo. Ahora, su talento le ha quitado todo."
 nick_artisan_rose: "la Rosa Artesana"
 nick_artisan_rose_desc: "Cualquier momento podría ser el último. Todo es más hermoso porque estamos condenados. Nunca serás más hermosa de lo que eres ahora. Nunca estaremos aquí de nuevo."
 nick_le_chansonneur: "le Chansonneur"
 nick_le_chansonneur_desc: "Nadie sospecha del bardo hasta que es demasiado tarde."
 nick_spiteful_baron: "Barón RenCOROSO"
 nick_spiteful_baron_desc: "Felipe engendró un legado de crueldad, y lo llamó refinamiento."
 nick_the_muse: "la Musa"
 nick_the_muse_desc: "Katherine inspira a los hombres a dar lo mejor de sí mismos, y ella no espera menos de ellos."
 nick_the_coquette_de_cannes: "la Coqueta de Cannes" #TBD
 nick_careful_socialite: "Socialité Cuidadosa" #TBD
 nick_lonely_prince: "el Príncipe Solitario" #TBD
 nick_victoria_ash: "Victoria Ash" #TBD
 nick_quiet_beauty: "la Belleza Serena"
 nick_quiet_beauty_desc: "La serenidad de Calida es una luz suave en medio de la oscuridad de la no-muerte."
 nick_bane_of_the_infernal: "Azote de lo Infernal" #TBD
 nick_inspiring_actress: "Actriz Inspiradora" #TBD
 nick_vv: "V.V." #TBD
 nick_bahari_prodigy: "Prodigio Bahari"
 nick_bahari_prodigy_desc: "La devoción de Antoinette por Lilith solo es igualada por el placer que obtiene al aplastar a sus rivales."
 nick_messenger_of_god: "Mensajero de Dios" #TBD
 nick_dutiful_artist: "el Artista Cumplidor" #TBD
 nick_the_middleman: "el Intermediario" #TBD
 nick_sealed_prince: "el Príncipe Sellado" #TBD
 nick_muse_of_sculpture: "Musa de la Escultura"
 nick_muse_of_sculpture_desc: "Miguel necesitaba inspiración y la buscó en las mentes y almas de sus seguidores."
 nick_the_dove: "la Paloma"
 nick_the_dove_desc: "Cuanto más alto ascienden..."
 nick_muse_of_architecture: "Musa de la Arquitectura"
 nick_muse_of_architecture_desc: "Miguel necesitaba inspiración y la buscó en las mentes y almas de sus seguidores."
 nick_first_fallen: "el Primer Caído"
 nick_first_fallen_desc: "La serpiente azotó a los seguidores del Arcángel, tentándolos a la condenación."
 nick_hope_of_damascus: "Esperanza de Damasco"
 nick_hope_of_damascus_desc: "Dentro del pozo de desesperación de Damasco, Mannal brilla como una obstinada luz brillante."
 nick_outsider_queen: "la Reina Forastera"
 nick_outsider_queen_desc: "Jugar el juego desde fuera puede llevar a los resultados más inesperados."
 nick_first_among_equals: "Primero entre Iguales"
 nick_first_among_equals_desc: "Los Siete del Consejo son iguales. Etrius es solo más igual que los demás."
 nick_magus_prince: "el Príncipe Mago"
 nick_magus_prince_desc: "Mientras otros se centran en asuntos esotéricos, Lotharius se asegura de que los Tremere tengan un hogar al que recurrir en su momento de necesidad."
 nick_the_lightbearer: "el Portador de la Luz"
 nick_the_lightbearer_desc: "Él era el objeto de nuestra devoción, el significado detrás del sacrificio de innumerables vidas – pitagóricos, cátaros, masones, alquimistas – todos luchando en la oscuridad para que un día, generaciones después, un hombre pudiera tener en su mano la fruta prohibida, la Piedra Filosofal, el elixir de la vida eterna. Su nombre era Goratrix, nuestro portador de la luz, nuestro Prometeo, nuestro Lucifer."
 nick_eye_of_the_storm: "el Ojo de la Tormenta"
 nick_eye_of_the_storm_desc: "Mientras la tormenta arrecia y amenaza con derribar la Pirámide, Meerlinda sigue siendo el centro tranquilo y sereno de todo."
 nick_the_brash: "el Impetuoso"
 nick_the_brash_desc: "Calderon no se toma los insultos a la ligera. Su furia es comparable a la de los legendarios Brujah."
 nick_the_smiling_envoy: "el Enviado Sonriente"
 nick_the_smiling_envoy_desc: "Detrás de esta sonrisa se esconden ambición y astucia. Una combinación mortal."
 nick_the_bane_of_mistridge: "el Azote de Mistridge"
 nick_the_bane_of_mistridge_desc: "¡Ay de la caída de Mistridge, el fin de una era y el comienzo del lento y doloroso final!"
 nick_watchful_eye: "el Ojo Vigilante"
 nick_watchful_eye_desc: "Xavier busca soluciones cuando otros ven problemas. Esto podría ser su clave para la victoria, o su perdición."
 nick_no_one_pawn: "Peón de Nadie"
 nick_no_one_pawn_desc: "Rutor nunca volverá a estar atado a otro. Al menos no abiertamente."
 nick_goddess_of_strife: "Diosa de la Discordia"
 nick_goddess_of_strife_desc: "Deverra escucha la llamada de Telyavel y prepara su magia más temible para responder a su convocatoria de batalla."
 nick_dutiful_spy: "el Espía Cumplidor" #TBD 
 nick_servile_envoy: "Enviado Servil"
 nick_servile_envoy_desc: "El rencor puede ser un poderoso motivador. Jervais conoce su lugar ahora, pero no estará satisfecho con él para siempre."
 nick_the_conspirator: "el Conspirador" #TBD
 nick_golden_lane: "de la Calle Dorada"
 nick_golden_lane_desc: "Nacido en Praga y una vez maestro del Santuario aquí, Ardan llevó el nombre de su calle a la no-muerte."
 nick_master_librarian: "el Maestro Bibliotecario"
 nick_master_librarian_desc: "Si el conocimiento es realmente poder, Celestyn debería ser temido."
 nick_usurper_huntress: "la Cazadora de Usurpadores" #TBD
 nick_master_of_spies: "Maestro de Espías"
 nick_master_of_spies_desc: "¿Quién espiará al maestro de espías?"
 nick_black_magus: "el Mago Negro" #TBD
 nick_the_patient_mentor: "el Mentor Paciente" #TBD
 nick_the_lightning_rod: "el Pararrayos" #TBD
 nick_new_age_witch: "Bruja de la Nueva Era" #TBD
 nick_last_true_tremere: "el Último Verdadero Tremere" #TBD
 nick_priestess_of_dreams: "Sacerdotisa de los Sueños" #TBD
 nick_odd_eyes: "Ojos Extraños" #TBD
 nick_the_director: "el Director" #TBD
 nick_the_lawyer: "el Abogado" #TBD 
 nick_the_magus: "el Mago" #TBD
 nick_foppish_magus: "un Loco para que Todos lo Vean"
 nick_foppish_magus_desc: "Al final, podría ser el último en reír."
 nick_lord: "Lord" #TBD
 nick_pyramid_climber: "Escalador de Pirámides"
 nick_pyramid_climber_desc: "Un paso a la vez, cueste lo que cueste."
 nick_hidden_regent: "el Regente Oculto" #TBD
 nick_crusader_magus: "Mago Cruzado" #TBD 
 nick_iron_maiden: "la Doncella de Hierro"
 nick_iron_maiden_desc: "La raza del asesino o la semilla del Demonio. El glamour, la fortuna, el dolor. Ve a la guerra de nuevo, la sangre es la mancha de la libertad. No reces más por mi alma."
 nick_insightful_charlatan: "Charlatán Perspicaz"
 nick_insightful_charlatan_desc: "El que escucha al necio, ¿es sabio o es él mismo un necio?"
 nick_of_broken_faith: "de la Fe Quebrantada" #TBD
 nick_great_mother: "la Gran Madre"
 nick_great_mother_desc: "Su hermosa y perfecta prole debe ser protegida. Incluso si para ello hay que derribar una Pirámide."
 nick_the_eldest: "el Anciano"
 nick_the_eldest_desc: "Nadie sabe realmente qué nombre llevó primero esta entidad. Para su clan, es simplemente el primero de todos: el Anciano."
 nick_the_manyarmed: "el de los Muchos Brazos"
 nick_the_manyarmed_desc: "Burlando a los Dioses de la India, Kartarirya intentó hacerse pasar por Kartikeya, el dios de la guerra, en espíritu y forma."
 nick_the_white_god: "el Dios Blanco"
 nick_the_white_god_desc: "Un maestro de las nieblas y la nieve, Byelobog pronto se hizo conocido como el Dios Blanco por sus hermanos lituanos nativos."
 nick_corruptor_of_legions: "Corruptor de Legiones"
 nick_corruptor_of_legions_desc: "Noriz destruyó a muchos en su búsqueda de poder. Ahora, solo destruye por su propio placer retorcido."
 nick_monster_among_monsters: "Monstruo entre Monstruos"
 nick_monster_among_monsters_desc: "Incluso los monstruos pueden temer algo. Especialmente si ese algo se llama Hedeon."
 nick_the_threeheaded: "el de Tres Cabezas" #TBD  
 nick_bane_of_wolves: "Azote de los Lobos"
 nick_bane_of_wolves_desc: "La disputa de Rustovitch contra los hombres lobo es legendaria. Es su título preferido, recordando a todos que incluso los temidos Licántropos le temen."
 nick_mistress_of_hunedoara: "Dueña de Hunedoara"
 nick_mistress_of_hunedoara_desc: "Un castillo maldito necesita una dueña con suficiente astucia y terquedad para vigilarlo."
 nick_the_butcher_of_rus: "el Carnicero de la Rus"
 nick_the_butcher_of_rus_desc: "Darvag protege la misma ciudad que juró destruir. Solo a él se le permite traer muerte y desesperación a ella."
 nick_the_seeking_sinner: "el Pecador Buscador"
 nick_the_seeking_sinner_desc: "El camino al conocimiento es largo y está lleno de delicias. Pero cuidado con el exceso."
 nick_his_brothers_keeper: "Cuidador de su Hermano"
 nick_his_brothers_keeper_desc: "Simeón y Gesu debían ser el centro de un Sueño. Su historia lo convirtió en una pesadilla."
 nick_self_proclaimed_martyr: "Mártir Autoproclamado" #TBD
 nick_your_darkest_terror: "Tu Terror Más Oscuro"
 nick_your_darkest_terror_desc: "Porque él es la cara de las pesadillas y el horror que habita dentro de cada uno de nosotros, esperando ser desatado sobre un mundo desprevenido."
 nick_the_noble_born: "el de Cuna Noble"
 nick_the_noble_born_desc: "Tabak intenta ser el noble. Podría terminar siendo el necio."
 nick_the_puppet_prince: "el Príncipe Títere"
 nick_the_puppet_prince_desc: "¿Quién mueve los hilos?"
 nick_herald_of_caine: "Heraldo de Caín"
 nick_herald_of_caine_desc: "El Tercer Caín vendrá y bendecirá a los dignos en una orgía de sangre. Solo entonces llegará la verdadera salvación."
 nick_estranged_scholar: "Erudito Distanciado" #TBD
 nick_deluded_protector: "el Protector Iluso" #TBD
 nick_saint_divinity: "Santo de la Divinidad Interior" #TBD
 nick_holy_spirit: "el Espíritu Santo"
 nick_holy_spirit_desc: "El Espíritu Santo ha desaparecido de Constantinopla pero no la ha olvidado. El Sueño vivirá, pase lo que pase."
 nick_tzimisce_favorite: "Favorito de Tzimisce"
 nick_tzimisce_favorite_desc: "Cuando el mundo finalmente sea consumido, Lambach será el último en pie, mirando horrorizado cómo su pesadilla se hace realidad."
 nick_blood_breaker: "el Rompe Sangre"
 nick_blood_breaker_desc: "Lugoj liderará una revolución. Pero quizás no la que él pretendía."
 nick_senescent_master: "el Maestro Senescente"
 nick_senescent_master_desc: "Radu trae calma y disciplina al caótico Voivodato, pero sus sonrisas nunca llegan a sus ojos."
 nick_hammer_of_the_tremere: "el Martillo de los Tremere"
 nick_hammer_of_the_tremere_desc: "Mientras los otros Voivodas discuten y conspiran, Ioan está ganando la guerra contra los Tremere por sí solo."
 nick_the_deal_broker: "el Corredor de Tratos"
 nick_the_deal_broker_desc: "Mediar entre Tzimisce rencillosos ciertamente ayuda a tener una buena reputación diplomática."
 nick_mother_of_horrors: "Madre de los Horrores"
 nick_mother_of_horrors_desc: "Incluso los horrores necesitan a su madre amorosa y protectora."
 nick_alien_hunger: "el Hambre Alienígena"
 nick_alien_hunger_desc: "Andeleon miró profundamente al abismo. Y ciertamente, el abismo le devolvió la mirada."
 nick_the_judas: "el Judas de Praga" #TBD
 nick_the_sculptor_of_wolves: "la Escultora de Lobos"
 nick_the_sculptor_of_wolves_desc: "Los lobos son verdaderamente los mejores amigos de una dama."
 nick_hurul: "Hurul" #TBD
 nick_ignorant_little_girl: "Niñita Ignorante" #TBD
 nick_the_impassible: "el Impasible" #TBD
 nick_mother_of_the_nok: "Madre de los Nok" #TBD
 nick_dark_lord_tzimisce: "Señor Oscuro de los Tzimisce"
 nick_dark_lord_tzimisce_desc: "Que empiece la Marcha Imperial"
 nick_rebellious_scholar: "el Erudito Rebelde" #TBD
 nick_spider_bride: "la Novia Araña" #TBD
 nick_clever_monster: "el Monstruo Astuto"
 nick_clever_monster_desc: "Gabija esconde su astucia tras una máscara monstruosa. Aquellos que no la descubren a tiempo ya están muertos."
 nick_diligent_autocrat: "el Autócrata Diligente"
 nick_diligent_autocrat_desc: "Un pastor cuida de su rebaño. Es el deber del noble proteger a sus inferiores, después de todo."
 nick_scholar_of_enlightenment: "Erudito de la Iluminación"
 nick_scholar_of_enlightenment_desc: "El cambio es la única constante en la vida, y el único tema que vale la pena investigar."
 nick_masterless_spy: "Espía sin Amo" #TBD
 nick_fiend_among_fiends: "Demonio entre Demonios"
 nick_fiend_among_fiends_desc: "Las horribles tácticas de Koban en la guerra le aseguraron muchas victorias antes incluso de desenvainar su arma."
 nick_fiendish_knight: "el Caballero Diabólico"
 nick_fiendish_knight_desc: "Dedicada a su señor feudal, Kara demuestra que puede haber honor entre monstruos."
 nick_artist_of_screams: "Artista de los Gritos"
 nick_artist_of_screams_desc: "Una verdadera sinfonía de la noche."
 nick_the_unquenchable: "el Inextinguible"
 nick_the_unquenchable_desc: "El horror sin fondo debe ser alimentado."
 nick_sister_of_blood: "la Hermana de Sangre"
 nick_sister_of_blood_desc: "La mano derecha empapada de sangre de Kartarirya verá su continente ahogarse en sangre antes de permitir que sus enemigos triunfen."
 nick_vroi_goddess: "Diosa Vroi"
 nick_vroi_goddess_desc: "Diosa de un pueblo perdido durante una era perdida, arrojada a las noches actuales por los caprichos del destino."
 nick_father_brood: "Padre de la Prole" #TBD
 nick_master_of_hellhounds: "Amo de los Sabuesos del Infierno"
 nick_master_of_hellhounds_desc: "Escultor de la Carne de Miles y Vengador de Voivodas Descarríados"
 nick_the_renewer: "el Renovado" #TBD
 nick_test_subject: "el Sujeto de Prueba"
 nick_test_subject_desc: "Una eternidad de tormento por un propósito superior: el conocimiento."
 nick_the_main_antagonist: "el Antagonista Principal"
 nick_the_main_antagonist_desc: "La redención solo puede ganarse derrotando a Vukodlak."
 nick_the_lord_of_the_night: "el Señor de la Noche"
 nick_the_lord_of_the_night_desc: "A Ventru se le dio su derecho a gobernar por el propio Caín. Su derecho a morir, sin embargo, se lo dieron sus hermanos y hermanas de sangre."
 nick_sybaritic_mastermind: "la Mente Maestra Sibarita"
 nick_sybaritic_mastermind_desc: "Bulscu una vez tuvo el mayor potencial que se podía encontrar, y lo derrochó todo en decadencia y lujo. No todo el mundo puede ser Camila."
 nick_lord_of_light: "el Señor de la Luz"
 nick_lord_of_light_desc: "¡Alabado sea Mitras, Señor de Londres, el Príncipe de la Luz, el Conquistador de Bretaña, el Sol y Portador de la Luz! ¡Que su Divinidad trascienda la maldición y nos traiga la salvación!"
 nick_the_graceful_tyrant: "el Tirano Grácil"
 nick_the_graceful_tyrant_desc: "A menudo confundido con un Toreador, Alejandro esconde su arrogante insensibilidad tras su máscara de belleza juvenil."
 nick_sword_bearer: "el Portaespadas"
 nick_sword_bearer_desc: "Jürgen es la espada de Hardestadt y de los Ventrue en su conjunto. Pero incluso esta arma perfecta puede tener un día ambiciones propias."
 nick_roman_relic: "la Reliquia Romana"
 nick_roman_relic_desc: "Julia representa lo mejor de lo que fue Roma. Para muchos, es un modelo a seguir como ejemplo, y una mentora a la que escuchar atentamente."
 nick_bitter_ender: "el Amargo Finalista"
 nick_bitter_ender_desc: "Las cambiantes lealtades de Creteo pueden llevarle a tomar decisiones muy dudosas, a veces incluso muy costosas."
 nick_ingenious_daughter: "la Hija Ingeniosa"
 nick_ingenious_daughter_desc: "Ilse ve la escritura en la pared, los mortales son una amenaza que está dispuesta a enfrentar. Podría subestimar las amenazas más cercanas a casa, sin embargo..."
 nick_iron_fist: "el Puño de Hierro"
 nick_iron_fist_desc: "Para lograr su inmensa ambición, Gustav llegará a cualquier extremo, incluso si tiene que sumergir al mundo en la guerra."
 nick_thorn_on_their_side: "la Espina en su Costado"
 nick_thorn_on_their_side_desc: "Marcada para la muerte, pero demasiado obstinada para morir, su cacería es interminable."
 nick_forgotten_barbarian: "el Bárbaro Olvidado"
 nick_the_last_saxon: "el Último Sajón"
 nick_the_last_saxon_desc: "Su pueblo desaparecido hace mucho, Eirik observa a sus descendientes y los encuentra deficientes. Aún así, su linaje está mostrando promesa."
 nick_the_father: "el Padre"
 nick_the_father_desc: "La participación de Antonio en la Trinidad fue fundamental. Pero incluso los Sueños inmortales deben terminar en algún momento."
 nick_the_boy_king: "el Rey Niño"
 nick_the_boy_king_desc: "En busca de la divinidad, Antínoo solo encontró la inmortalidad. Un trueque del que aún no está seguro hasta esta noche."
 nick_the_lady_of_blood: "la Dama de la Sangre" #TBD
 nick_the_son: "el Hijo" #TBD
 nick_palace_prefect: "el Prefecto del Palacio"
 nick_palace_prefect_desc: "El Sueño de Miguel fue modelado según el Imperio Bizantino, y muchas de sus designaciones fueron utilizadas por ambas entidades."
 nick_prince_in_waiting: "Príncipe en Espera"
 nick_prince_in_waiting_desc: "A Ana se le negó su derecho de nacimiento en vida. No dejará que pase la oportunidad de obtenerlo finalmente en la no-muerte."
 nick_prince_in_waiting_improved: "el Príncipe Prometido"
 nick_prince_in_waiting_improved_desc: "Ana finalmente reclamó su derecho de nacimiento. La Ciudad del Deseo del Mundo es suya por fin y su ascenso apenas ha comenzado."
 nick_caesar_magister: "César Magister"
 nick_caesar_magister_desc: "El Sueño de Miguel fue modelado según el Imperio Bizantino, y muchas de sus designaciones fueron utilizadas por ambas entidades."
 nick_the_military_prefect: "el Prefecto Militar"
 nick_the_military_prefect_desc: "Belisario continuó en la no-muerte lo que hizo en vida: servir a Constantinopla con honor y diligencia. Lo único que finalmente lo desvió de este curso fue el amor."
 nick_the_eastern_praetorian_prefect: "el Prefecto Pretoriano de Oriente"
 nick_the_eastern_praetorian_prefect_desc: "El Sueño de Miguel fue modelado según el Imperio Bizantino, y muchas de sus designaciones fueron utilizadas por ambas entidades."
 nick_the_domestic_prefect: "el Prefecto Doméstico"
 nick_the_domestic_prefect_desc: "El Sueño de Miguel fue modelado según el Imperio Bizantino, y muchas de sus designaciones fueron utilizadas por ambas entidades."
 nick_model_prince: "el Príncipe Modelo" #TBD
 nick_pontifex_maximus: "Pontífice Máximo de los Condenados"
 nick_pontifex_maximus_desc: "Desde sus humildes comienzos hasta su decadente final, Camila es Roma. La Roma medieval ya no se inclina ante los Cónsules sino ante los Papas? Así sea, pues olvida a Camila, el Cónsul Eterno, ¡larga vida a Camila, el Pontífice Máximo!"
 nick_ambitious_pretender: "el Pretendiente Ambicioso"
 nick_ambitious_pretender_desc: "Dinamarca bien vale unos cuantos sacrificios. Especialmente si otros los hacen."
 nick_honor_incarnate: "Honor Encarnado"
 nick_honor_incarnate_desc: "Lucio ha visto a demasiados hombres sucumbir a la ambición y la codicia como para quedarse de brazos cruzados. Fiel a su palabra, como siempre lo es, protegerá la Más Santa de las Ciudades."
 nick_upstart_baron: "el Barón Advenedizo"
 nick_upstart_baron_desc: "Demasiado joven para la leyenda, demasiado ruidoso para la sabiduría. Pero su daga ya está en la espina dorsal del Dios Sol."
 nick_true_loyalist: "el Verdadero Leal"
 nick_true_loyalist_desc: "Marco cree verdaderamente en la causa de Mitras y es su lugarteniente más confiable. Nada podría romper tal vínculo... ¿podría?"
 nick_opportunist_crusader: "el Cruzado Oportunista"
 nick_opportunist_crusader_desc: "Eon logró emerger del caos de las Cruzadas Albigenses como un vencedor contra todo pronóstico. Ahora es vigilado atentamente en lugar de ser subestimado."
 nick_illprepared_king: "el Rey Mal Preparado"
 nick_illprepared_king_desc: "Godofredo quería venganza contra su sire y la consiguió. El siguiente paso no estuvo tan bien planeado."
 nick_fallen_countess: "la Condesa Caída"
 nick_fallen_countess_desc: "Saviarre fue una vez la Cainita más influyente de Francia. Pero a medida que sus recuerdos regresan, está entendiendo que perdió mucho más que su poder."
 nick_knight_black_cross: "Caballero de la Cruz Negra"
 nick_knight_black_cross_desc: "Lucrecia se ganó el derecho a luchar con su fuerza de armas y su lealtad. Estará al lado de su señor hasta el amargo final."
 nick_rome_advocate: "Defensora de Roma"
 nick_rome_advocate_desc: "Rávena fue una vez el centro del mundo romano. Livia no lo olvidó y espera que pueda serlo de nuevo."
 nick_little_wolf: "el Pequeño Lobo"
 nick_little_wolf_desc: "El último defensor del arrianismo todavía guarda rencor al catolicismo. Ahora tiene la inmortalidad por delante para rehacerlo a su imagen."
 nick_bane_carthage: "Azote de Cartago"
 nick_bane_carthage_desc: "¡Cartago debe ser destruida! Si Catón fue el orador que derribó Cartago, Lisandro fue la espada."
 nick_patient_rebel: "el Rebelde Paciente"
 nick_patient_rebel_desc: "Lejos del centro de la política, dejarse olvidar podría ser el curso de acción más sabio."
 nick_the_compulsive_agitator: "el Agitador Compulsivo"
 nick_the_compulsive_agitator_desc: "Lo único más rápido que su boca es su retirada."
 nick_weak_outsider: "el Forastero Débil"
 nick_weak_outsider_desc: "Demasiado cobarde para liderar, demasiado amargado para seguir, demasiado enfadado para desvanecerse."
 nick_seething_vassal: "Vasallo Hirviente"
 nick_seething_vassal_desc: "Eduardo sirve humildemente, pero sus ojos siempre están puestos en el trono que codicia."
 nick_old_warrior: "el Viejo Guerrero"
 nick_old_warrior_desc: "El que vivió por la espada podría morir por el cuchillo."
 nick_heir_to_the_throne: "Heredero del Trono"
 nick_heir_to_the_throne_desc: "El Trono Negro de Caín aguarda. Anadja ha sido preparada para él toda su no-muerte."
 nick_last_crusader: "el Último Cruzado"
 nick_last_crusader_desc: "Gondemar lo perdió todo durante la 4ª Cruzada. Por su señor feudal muerto, intentará salvar lo que aún pueda salvarse."
 nick_dutiful_son: "el Hijo Cumplidor"
 nick_dutiful_son_desc: "Vencel respeta a su sire en todas las cosas como debe hacerlo un buen vástago. A veces, teme que ese pueda ser el fin de ambos."
 nick_hungarian_overlord: "el Señor Supremo Húngaro"
 nick_hungarian_overlord_desc: "Nova Arpad se cree una maestra conspiradora y el futuro de Hungría. Lamentablemente, la realidad tiende a ser menos amable que los sueños."
 nick_agent_of_god: "Agente de Dios"
 nick_agent_of_god_desc: "Un Dios despiadado y cruel no podría pedir un mejor agente que Géza Árpád."
 nick_mademoiselle: "Mademoiselle" #TBD
 nick_scion_of_the_republic: "Vástago de la República"
 nick_scion_of_the_republic_desc: "Aquileya resistió al Imperio Romano y se reconstruyó después de la devastación de Atila. También lo hizo su príncipe."
 nick_ventrue_vanguard: "Vanguardia de los Ventrue"
 nick_ventrue_vanguard_desc: "En una tierra de dioses salvajes y sangre antigua, trae la mano fría del orden. Lo quieran o no."
 nick_unconcerned_soldier: "el Soldado Despreocupado"
 nick_unconcerned_soldier_desc: "¿Por qué molestarse? Al fin y al cabo, todos estamos muertos."
 nick_merchant_crusader: "el Mercader Cruzado"
 nick_merchant_crusader_desc: "Horst fue mediocre como mercader y sabe que lo será aún peor como Cruzado."
 nick_zealous_ambassador: "el Embajador Celoso" #TBD
 nick_the_wise_and_prosperous: "el Sabio y Próspero"
 nick_the_wise_and_prosperous_desc: "Verdades sombrías rodean a este hombre, siendo el misterio más profundo conocido solo por unos pocos elegidos."
 nick_the_explorer: "el Explorador"
 nick_the_explorer_desc: "¡Tantas cosas por descubrir y tan poco tiempo en mi inmortalidad!"
 nick_the_level_headed: "el Cuerpo Sereno"
 nick_the_level_headed_desc: "Fresco, calmado y sereno ganarán el día. Y la noche."
 nick_father_of_emperors: "Padre de Emperadores"
 nick_father_of_emperors_desc: "La vida turbulenta de un soldado leal, recompensada con la inmortalidad en cuerpo y fama."
 nick_battle_maiden: "la Doncella de Batalla"
 nick_battle_maiden_desc: "Los Ventrue nunca mostraron tal valentía hasta la carga de Artemisa en Cartago. Y probablemente nunca lo volverán a hacer."
 nick_historian_kindred: "Historiador de los Vástagos"
 nick_historian_kindred_desc: "Una empresa digna, aunque nunca terminada."
 nick_sycophant_prince: "el Príncipe Sifilítico" #TBD 
 nick_quiet_observer: "el Observador Silencioso" #TBD 
 nick_born_seneschal: "Senescal Nato"
 nick_born_seneschal_desc: "Verdaderamente, este nació para servir y nunca alzará la mano contra su amo. Verdaderamente."
 nick_iron_queen: "la Reina de Hierro" #TBD 
 nick_childe_camarilla: "Vástago de la Camarilla" #TBD 
 nick_master_of_diplomacy: "Maestro de la Diplomacia"
 nick_master_of_diplomacy_desc: "Si los hombres lobo están aullando en mi puerta, este es el hombre que quiero a mi lado."
 nick_drakonskyr: "Drakonskyr"
 nick_drakonskyr_desc: "Luchó con toda su alma. Pero, al final, solo hay oscuridad."
 nick_tired_warrior: "el Guerrero Cansado"
 nick_tired_warrior_desc: "Demasiadas batallas, demasiadas guerras, la inmortalidad a veces no ofrece respiro."
 nick_infernal_heir: "el Heredero Infernal" #TBD 
 nick_unending_feud: "de la Disputa Eterna" #TBD 
 nick_tricked_prince: "el Príncipe Engañado"
 nick_tricked_prince_desc: "¿Quién es el necio ahora?"
 nick_prince_of_wall_street: "Príncipe de Wall Street" #TBD 
 nick_consensus_choice: "la Elección por Consenso" #TBD 
 nick_respected_hostess: "Anfitriona Respetada"
 nick_respected_hostess_desc: "Ven a mi casa y disfruta de sus delicias. Sin compromiso... que puedas ver."
 nick_ventrue_exemplar: "Ejemplo Ventrue" #TBD 
 nick_paladin: "Paladín" #TBD 
 nick_the_chess_master: "el Maestro del Ajedrez"
 nick_the_chess_master_desc: "¿Quién es el peón y quién es el rey?"
 nick_the_light_wrath: "la Ira de la Luz"
 nick_the_light_wrath_desc: "El ardiente celo de Phaedyme purificará a los injustos... y a bastantes más además."
 nick_the_fixer: "el Arreglador" #TBD 
 nick_aristocratic_diplomat: "Diplomático Aristocrático" #TBD 
 nick_careful_planner: "el Planificador Cuidadoso" #TBD 
 nick_best_of_the_ventrue: "Ejemplo de los Ventrue" #TBD 
 nick_puppet_master: "el Titiritero" #TBD 
 nick_qadi_ventrue: "Cadí de los Ventrue" #TBD 
 nick_palace_prince: "el Príncipe del Palacio" #TBD 
 nick_the_hardliner: "el Intransigente" #TBD 
 nick_babbling_buffoon: "Bufón Parlanchín"
 nick_babbling_buffoon_desc: "¿Por qué preocuparse por asesinos y guerras cuando se tiene buena cuna?"
 nick_the_survivor: "el Superviviente" #TBD 
 nick_customs_officer: "el Príncipe de la Oficina de Aduanas"
 nick_customs_officer_desc: "Ríanse si quieren, al final, todavía tienen que pasar por aquí."
 nick_lost_warrior: "Guerrero Perdido de una Edad Perdida"
 nick_lost_warrior_desc: "Un mundo nuevo, una edad nueva. Solo la guerra parece eterna."
 nick_the_wanderer: "el Errante"
 nick_the_wanderer_desc: "Este errante encontrará a los que están perdidos."
 nick_ruthless_arrivist: "el Advenedizo Despiadado" #TBD 
 nick_distinguished_senator: "Senador Distinguido"
 nick_distinguished_senator_desc: "El Senado no sobrevivió al Imperio de Camila, pero los senadores sí."
 nick_tireless_protector: "Protector Incansable" #TBD
 nick_power_hungry_beauty: "Belleza Sedienta de Poder"
 nick_power_hungry_beauty_desc: "Detrás de esta bonita máscara yace el alma de un depredador, listo para explotar tu debilidad."
 nick_austere_seneschal: "Senescal Austero"
 nick_austere_seneschal_desc: "No busca trono, se contenta con sentarse junto a uno."
 nick_fallen_scholar: "el Erudito Caído" #TBD
 nick_the_failure: "el Fracaso"
 nick_the_failure_desc: "Incluso el Dios Sol puede a veces tomar decisiones dudosas con sus vástagos."
 nick_retired_rebel: "el Rebelde Retirado"
 nick_retired_rebel_desc: "Todos los fuegos se apagan al final."
 nick_forever_searching: "Buscando Eternamente"
 nick_forever_searching_desc: "El camino hacia la salvación es largo y la conclusión podría no ser tan gratificante como se anticipaba."
 nick_serpent_of_the_family_tree: "Serpiente del Árbol Genealógico"
 nick_serpent_of_the_family_tree_desc: "Cuando el árbol cae, la serpiente cae con él."
 nick_redbeard: "Barbarroja"
 nick_redbeard_desc: "Al final, encontró la inmortalidad antes que la propia Tierra Santa."
 nick_warrior_search_war: "Guerrero en busca de una Guerra"
 nick_warrior_search_war_desc: "A veces, incluso los guerreros sedientos de sangre quieren luchar por una causa digna para apoyar."
 nick_arrogant_noblewoman: "Noble Arrogante" #TBD
 nick_daughter_of_jorvik: "Hija de Jorvik"
 nick_daughter_of_jorvik_desc: "Dios no salvó a Inglaterra de los vikingos. En cambio, los convirtió en inmortales."
 nick_the_freelancer: "el Freelance"
 nick_the_freelancer_desc: "Una espada de alquiler, quizás buscando ser convencido de una causa digna."
 nick_the_weak_baron: "el Barón Débil"
 nick_the_weak_baron_desc: "Su mayor talento es la supervivencia, a pesar de no ser digno de la sangre del Dios Sol."
 nick_defender_of_sin: "Defensor del Pecado"
 nick_defender_of_sin_desc: "Incluso la decadencia y el lujo merecen su campeón."
 nick_ardent_student: "la Estudiante Ardiente"
 nick_ardent_student_desc: "La fe de Dominique está forjada en el pensamiento, no en el dogma, y por ello arde más intensamente."
 nick_mistress_of_mysteries: "Señora de los Misterios"
 nick_mistress_of_mysteries_desc: "Algunos misterios es mejor dejarlos ocultos."
 nick_utter_darkness: "la Oscuridad Total"
 nick_utter_darkness_desc: "El abismo lo miró. Y el abismo retrocedió horrorizado."
 nick_damnation_incarnate: "Condenación Encarnada"
 nick_damnation_incarnate_desc: "Al final del largo camino, solo la oscuridad."
 nick_eyes_of_oblivion: "Ojos del Olvido"
 nick_eyes_of_oblivion_desc: "¡Qué ojos para condenarte!"
 nick_looming_threat: "la Amenaza Inminente"
 nick_looming_threat_desc: "Muhammad susurra, paciente, mientras Iberia se desgarra."
 nick_the_blackeyesofthewyrm: "Ojos Negros del $glossary_wyrm$"
 nick_the_blackeyesofthewyrm_desc: "Mientras su hijo lamentaba que no quedaran más mundos por conquistar, Petaniqua se preparaba para terminar la conquista de este."
 nick_baal_hammon: "Ba'al Hammon"
 nick_baal_hammon_desc: "Cartago fue destruida por los romanos. Pero se perdió mucho antes de que ellos siquiera llegaran a la ciudad."
 nick_great_enemy: "el Gran Enemigo"
 nick_great_enemy_desc: "No queda esperanza para este mundo. Solo el lento y agonizante descenso a la locura y la desesperación. Déjame acabarlo."
 nick_first_sinner: "el Primer Pecador"
 nick_first_sinner_desc: "Conocerse verdaderamente a uno mismo y disfrutar es la única verdad de esta condenable existencia."
 nick_shadowy_whisperer: "el Susurrador Sombrío"
 nick_shadowy_whisperer_desc: "Debajo de cada suave susurro, aguarda la condenación."
 nick_the_devils_advocate: "el Abogado del Diablo"
 nick_the_devils_advocate_desc: "Dios ha elegido la autodepresentación en su lugar."
 nick_master_of_iblit: "Amo del Iblit al-Akbar"
 nick_master_of_iblit_desc: "El pozo eterno de oscuridad se cierne, tentando a su amo a ir cada vez más lejos."
 nick_chaos_factor: "el Factor Caos" #TBD
 nick_goddess_of_vice: "la Diosa del Vicio" #TBD
 nick_bat_god: "el Dios Murciélago" #TBD
 nick_unrelenting_prophet: "Profeta Incesante" #TBD
 nick_dark_priestess: "la Sacerdotisa Oscura"
 nick_dark_priestess_desc: "Recrear Cartago requiere algunos... sacrificios."
 nick_eldest_free: "Anciano de los Libres"
 nick_eldest_free_desc: "Tanto mito como hombre, el Hombre de Piedra es la esperanza de un mundo Cainita libre de cadenas Antediluvianas."
 nick_first_of_tribe: "Primero de la Tribu" #TBD
 nick_the_pragmatist: "el Pragmático" #TBD
 nick_anarch_organizer: "Organizadora Anarquista" #TBD 
 nick_first_singer: "la Primera Cantora"
 nick_first_singer_desc: "Muchas voces se unirán a ella con el tiempo, pero ninguna la encontrará realmente."
 nick_the_songbird: "el Pájaro Cantor" #TBD
 nick_the_willing_sacrifice: "el Sacrificio Voluntario"
 nick_the_willing_sacrifice_desc: "Un mártir voluntario, que cambia la mortalidad para convertirse en el primero de los comedores de carne."
 nick_padre_craneo: "Padre Craneo" #TBD
 nick_hidden_occultist: "el Ocultista Oculto" #TBD
 nick_enoch_enforcer: "Verdugo de Enoc" #TBD
 nick_blood_stealer: "Ladrón de Sangre"
 nick_blood_stealer_desc: "Este ladrón quizás nunca sea atrapado, pero su crimen resuena a través de la historia."
 nick_quiet_pacifist: "el Pacifista Silencioso" #TBD
 nick_crafty_maiden: "la Doncella Astuta" #TBD
 nick_lioness_of_britain: "la Leona de Bretaña"
 nick_lioness_of_britain_desc: "Incluso los leones se postran ante el sol. Al menos mientras brilla."
 nick_foolish_regent: "el Regente Necio" #TBD
 nick_wronged_patrician: "el Patricio Agraviado" #TBD
 nick_the_ghibelline: "el Gibelino" #TBD
 nick_pillar_latin: "Pilar de los Latinos" #TBD
 nick_his_lady_shield: "Escudo de su Dama"
 nick_his_lady_shield_desc: "Todo por ella. Porque ella merece todo."
 nick_scholar_of_hamburg: "Erudito de Hamburgo" #TBD
 nick_rose_au_loup: "la Rose au Loup"
 nick_rose_au_loup_desc: "Los lobos arrasan en el jardín, extrañamente protectores de esta única rosa espinosa."
 nick_the_feral: "el Salvaje" #TBD
 nick_loving_grandson: "el Nieto Amoroso"
 nick_loving_grandson_desc: "La Abuela tiene muchos enemigos, pero no la amenazarán mientras este esté vigilando."
 nick_fallen_heretic: "el Hereje Caído" #TBD 
 nick_chosen_voice: "la Voz Elegida" #TBD
 nick_the_spiteful: "el Rencoroso"
 nick_the_spiteful_desc: "Todo te es debido. El mundo simplemente no lo entiende todavía."
 nick_lord_in_waiting: "Lord en Espera" #TBD 
 nick_the_calligrapher: "el Calígrafo" #TBD
 nick_the_mamluk: "el Mameluco" #TBD
 nick_his_brother_keeper: "Cuidador de su Hermano" #TBD
 nick_burning_prophet: "el Profeta Ardiente" #TBD
 nick_whirlwind_steppes: "Torbellino de las Estepas"
 nick_whirlwind_steppes_desc: "Un terror nómada que golpea con la dureza y velocidad del viento del desierto."
 nick_sword_ashirra: "Espada de los Ashirra"
 nick_sword_ashirra_desc: "La fe necesita guardianes, pero la fe también necesita guerreros."
 nick_the_physician: "el Médico" #TBD
 nick_father_intelligence: "Padre de la Inteligencia" #TBD 
 nick_the_axe: "el Hacha" #TBD
 nick_peace_advocate: "el Defensor de la Paz" #TBD
 nick_the_oriental: "el Oriental"
 nick_the_oriental_desc: "El atractivo de lo desconocido, llevado a un grado inmortal."
 nick_poet_cordoba: "Poeta de Córdoba" #TBD 
 nick_beast_of_cordoba: "Bestia de Córdoba" #TBD
 nick_profesional_gobetween: "Intermediario Profesional" #TBD
 nick_immortal_udul: "el Udul Inmortal" #TBD
 nick_dervish_tunisia: "Derviche de Túnez" #TBD 
 nick_the_guide: "el Guía" #TBD
 nick_spice_merchant: "el Mercader de Especias"
 nick_spice_merchant_desc: "¿Un condimento para tu sangre quizás?"
 nick_refugee: "el Refugiado"
 nick_refugee_desc: "Lejos de casa, esperando escapar de la sombra de la Pirámide."
 nick_the_horde_coffers: "Tesorero de la Horda" #TBD 
 nick_slave_trader: "el Traficante de Esclavos"
 nick_slave_trader_desc: "Negociando con lágrimas y sangre, sufrimiento y dolor."
 nick_orphaned_heiress: "la Heredera Huérfana" #TBD
 nick_abandoned_ansar: "Ansar Abandonado" #TBD
 nick_warlord_of_jorvik: "Señor de la Guerra de Jorvik"
 nick_warlord_of_jorvik_desc: "El Danelaw ha desaparecido. Los daneses no."
