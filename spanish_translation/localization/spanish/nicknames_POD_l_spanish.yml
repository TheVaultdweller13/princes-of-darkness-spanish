 nick_witch_queen: "la Reina Bruja"
 nick_fire_maiden: "la Doncella del Fuego"
 nick_copper_maiden: "la Doncella de Cobre"
 nick_foam_maiden: "la Doncella de Espuma"
 nick_hope_of_keshalyi: "Esperanza de los Keshalyi"
 nick_goddess_hours: "Diosa de las Horas"
 nick_goddess_hours_desc: "Tic-tac lentamente para su placer."
 nick_stubborn_apprentice: "Aprendiz Terco"
 nick_stubborn_apprentice_desc: "Tola vive para aprender. Sus maestros a menudo terminan más exhaustos que él."
 nick_last_cat_standing: "Último Gato en Pie"
 nick_last_cat_standing_desc: "Por lo que ella sabe, Olwen podría ser la última de su especie. Parece que la fiesta ha terminado para los gatos mercuriales."
 nick_savior_khans: "Salvador de Kanes"
 nick_savior_khans_desc: "A pesar de sus ya grandes logros, incluido salvar al propio Kublai Khan, Paso-Suave aún se esfuerza por mejorar siempre."
 nick_rising_sun: "el Sol Naciente"
 nick_rising_sun_desc: "El sol trae vida pero también una muerte ardiente a aquellos que se acercan demasiado desafiándolo."
 nick_bringer_bounty: "el Rey Dadivoso"
 nick_bringer_bounty_desc: "Manu T'Chaa salvó a su pueblo de una terrible hambruna, demostrando que los Leones pueden gobernar con justicia y traer prosperidad a sus súbditos."
 nick_clearwater_lover: "Guepardo de Agua Clara"
 nick_clearwater_lover_desc: "Sano y agradable a la vista, la dedicación de Nyolo a la causa Swara lo ha convertido en el objeto del deseo de algunas entidades poderosas."
 nick_pawn_samhach: "Peón de Samhach"
 nick_pawn_samhach_desc: "Algunos Ceilican comprometieron voluntariamente sus vidas con el que trajo la perdición a su tribu. Para ellos, la supervivencia tuvo un precio demasiado alto."
 nick_mother_harimau: "Madre de los Harimau"
 nick_mother_harimau_desc: "Los Kanes malayos, ya sea nacidos de ella o que le sirven, todos la llaman Madre. Pues sin ella, todos estarían perdidos."
 nick_bon_bhat: "el Bon Bhat"
 nick_bon_bhat_desc: "Una Leyenda en Vida. Una Leyenda en la Muerte."
 nick_soft_paw_cub: "el Cachorro de Zarpa Suave"
 nick_soft_paw_cub_desc: "Ratna no fue bendecida con las formas múltiples. Así que ha perseguido todas las formas posibles de encontrar su lugar."
 nick_wave_general: "el General de la Ola"
 nick_wave_general_desc: "Las Cortes Bestiales la querrían como guerrera. Ella elige liderar."
 nick_pale_stalker: "el Acechador Pálido"
 nick_pale_stalker_desc: "Cómo un tigre blanco logra esconderse está más allá de toda descripción. Pero nadie ha vivido para contar cómo se hizo."
 nick_mincemeat_demon: "el Demonio Picadillo"
 nick_mincemeat_demon_desc: "Un diablo desfiguró una vez a un cachorro de tigre. Ahora un Khan con un rostro definido por la guerra los caza."
 nick_warrior_judge: "el Juez Guerrero"
 nick_warrior_judge_desc: "Las Leyes de la Madre Esmeralda deben ser respetadas. Melena Noble se ha dedicado a asegurarse de conocer tales cosas."
 nick_harimau_princess: "Princesa Harimau"
 nick_harimau_princess_desc: "Ser la hija de un Líder de Septo tiene sus ventajas. Y Ojos Orgullosos se asegura de disfrutar de tales honores."




 nick_wearer_triple_faced_mask: "Portador de la Máscara de Tres Rostros"
 nick_wearer_triple_faced_mask_desc: "Las tres caras de antaño, buscando una venganza largamente postergada."
 nick_wearer_gatto_mask: "Portador de la Máscara de Gatto"
 nick_wearer_gatto_mask_desc: "La sed de conocimiento del erudito lo trajo de vuelta de entre los muertos. Literalmente."
 nick_wearer_pantalone_mask: "Portador de la Máscara de Pantalone"
 nick_wearer_pantalone_mask_desc: "Todo lo que te han dicho es una mentira"
 nick_fate_conspirator: "Conspirador del Destino"
 nick_fate_conspirator_desc: "Para uno impulsado por el propio Destino, una conspiración no es más que una forma de acelerar el final inevitable."
 nick_birkibeinar: "los Birkibeinar"
 nick_birkibeinar_desc: "Nombre de un partido rebelde en Noruega, formado en 1174 en torno al pretendiente al trono noruego, Eystein Meyla. El nombre tiene su origen en la propaganda del partido establecido de que los rebeldes eran tan pobres que hacían sus zapatos de corteza de abedul. Aunque originalmente era un peyorativo, la oposición adoptó el nombre de Birkebeiner para sí mismos, y continuaron usándolo después de llegar al poder en 1184."
 nick_harefoot: "Pie de Liebre"
 nick_harefoot_desc: "Registrado por primera vez como 'Harefoh' o 'Harefah' en el siglo XII en la historia de la Abadía de Ely, y según algunos cronistas medievales tardíos significaba que era 'veloz de pies'."
 nick_wetfoot: "Pie Mojado"
 nick_wetfoot_desc: "Knud colocó su trono a la orilla del mar y ordenó a la marea entrante que se detuviera y no mojara sus pies y vestiduras. Sin embargo, al seguir subiendo como de costumbre, la marea le cubrió los pies y las piernas sin respetar su persona real. Entonces el rey saltó hacia atrás, diciendo: 'Que todos los hombres sepan lo vacío y sin valor que es el poder de los reyes, pues no hay nadie digno de ese nombre, excepto Aquel a quien el cielo, la tierra y el mar obedecen por leyes eternas.' Luego colgó su corona de oro en un crucifijo, y nunca volvió a usarla 'para honrar a Dios, el Rey todopoderoso'."
 nick_heartsong: "Canción del Corazón"
 nick_heartsong_desc: "Gunter Sorenson reúne a su alrededor a escaldos y folcloristas en cada oportunidad. Le encanta asistir a eventos musicales y obras de teatro."
 nick_the_poison_thorn: "la Espina Venenosa"
 nick_the_poison_thorn_desc: "Infame por su uso de armas tóxicas."
 nick_the_commoner_lover: "el Amante de los Plebeyos"
 nick_the_commoner_lover_desc: "Inusual entre los sidhe nobles, particularmente de la Casa Aesin, es conocido por su apoyo a los fae de la estirpe plebeya."
 nick_the_mute: "el Mudo"
 nick_the_mute_desc: "A pesar de ser un comandante militar, nunca habla."
 nick_of_the_gleaming_eyes: "de los Ojos Brillantes"
 nick_of_the_gleaming_eyes_desc: "Un escalofriante brillo rojo que emana de sus ojos"
 nick_servant_of_saint_secundinus: "Sirviente de San Secundino"
 nick_servant_of_saint_secundinus_desc: "Un discípulo de San Patricio y patrón de la familia de O'Maoilsheachlainn, u O'Melaghlen; bastante común en los siglos X y siguientes, especialmente entre los O'Melaghlens, O'Farrells, O'Kellys y O'Connors; todavía en uso, pero generalmente disfrazado como Malachy."
 nick_doireannara: "Doireannara"
 nick_general_of_the_forces: "General de las Fuerzas"
 nick_of_the_twisted_oak: "del Roble Retorcido"
 nick_general_of_the_bleak: "General de lo Sombrío"
 nick_the_dance_master: "el Maestro de Danza"
 nick_black_tongue_prefix: "Lengua Negra"
 nick_the_eye_blighter: "el Aojador"
 nick_the_eye_blighter_desc: "Es famoso por crear el veneno 'Aojador' favorecido por los asesinos de la Casa Balor. El veneno no mata, pero hace que los ojos de la víctima se pudran hasta salirse de sus órbitas."
 nick_the_old_soldier: "el Viejo Soldado"
 nick_the_old_soldier_desc: "Habiendo actuado como entrenador de la chusma de la Casa Balor durante mucho tiempo, se dice que tiene el don de la gente común con los soldados rasos."
 nick_the_child_stealer: "el Ladrón de Niños"
 nick_the_child_stealer_desc: "Lo mejor que hacen los fae Inseelie es robar niños a los mortales. Este fae es adepto a secuestrar niños mortales prometedores para transformarlos en cambiaformas."
 nick_the_six_fingered: "el de Seis Dedos"
 nick_the_six_fingered_desc: "Su deformidad como maldición de nacimiento de la Casa Balor son sus seis dedos en cada mano. Siempre usa guantes especialmente hechos."
 nick_the_hungry_fae: "el Fae Hambriento"
 nick_the_hungry_fae_desc: "Como miembro de la Casa Balor, tiene una deformidad. La suya es física y está representada por su complexión extremadamente delgada y sus ojos que parecen hambrientos. Siempre tiene hambre... de comida, emoción, tesoro, Glamour, dolor, placer o alabanza. Nunca puede tener suficiente y siempre ansía más, incluso cuando acaba de ser saciado."
 nick_the_rebel_financier: "el Financiero Rebelde"
 nick_the_rebel_financier_desc: "Las insurrecciones necesitan oro. Edana es bastante hábil para encontrarlo a través de sus dones de persuasión."
 nick_the_swift: "el Veloz"
 nick_the_swift_desc: "Bastante hábil en viajes rápidos, incluso cuando hay enemigos cerca."
 nick_stern_steward: "el Mayordomo Severo"
 nick_dashing_vixen: "la Zorra Gallarda" # ¡Ahora, Dasher! ¡ahora, Dancer! ¡ahora, Prancer y Vixen!
 nick_the_inscrutable_host: "el Anfitrión Inescrutable"
 nick_the_tempting_poet: "el Poeta Tentador"
 nick_the_honorable_adversary: "el Adversario Honorable"
 nick_the_white_wyrm: "el Gusano Blanco"
 nick_the_winter_guide: "la Guía Invernal"
 nick_the_very_clever: "el Muy Astuto"
 nick_the_very_clever_desc: "... y preocupantemente bueno apuñalando por la espalda."
 nick_the_forceful_personality: "la Personalidad Arrolladora"
 nick_the_forceful_personality_desc: "Carismática y entretenida, es una invitada bienvenida en muchas cortes."
 nick_the_hitherward_witch: "la Bruja Hitherward"
 #nick_the_hitherward_witch_desc: ""
 nick_the_night_surgeon: "el Cirujano Nocturno"
 nick_the_night_surgeon_desc: "Adicto al cuchillo."
 nick_the_virgin: "la Virgen"
 nick_the_adventerous_cook: "el Cocinero Aventurero"
 nick_sweet_poison: "Veneno Dulce"
 nick_the_blessed_person: "la Persona Bendecida"
 nick_the_blessed_person_desc: "Habiendo aceptado el Abrazo Voluntario de los Ashirra, busca la redención de su especie siguiendo un camino sagrado." 
 nick_bamboo_ghost: "el Fantasma del Bambú"
 nick_bamboo_ghost_desc: "El Fantasma de la Montaña de Bambú Recluido"
 #nick_the_waking_nightmare: "la Pesadilla Despierta"
 nick_the_crestfallen_steward: "el Mayordomo Abatido"
 nick_the_face_of_innocence: "el Rostro de la Inocencia"
 nick_the_face_of_innocent_desc: "El encanto y el semblante de Grigori no son más que máscaras que usa para ocultar el crimen definitivo: el alma consumida de su sire."
 nick_the_enamored_sire: "el Sire Enamorado"
 nick_the_enamored_sire_desc: "El creador adorador del vástago de apariencia inocente Grigori. ¿Qué causó la misteriosa desaparición de Andreas?"
 nick_the_mad_arab: "el Árabe Loco"
 nick_the_mad_arab_desc: "Un seguidor de un trío de paganos dementes, los Ashirra han llegado a considerar a Ya'rub como bastante demente."
 nick_the_knight_of_tears: "el Caballero de las Lágrimas"
 nick_the_knight_of_tears_desc: "Uno de los combatientes más temibles de su edad, no puede vencer su propia tristeza con su espada."
 nick_the_flickering_light: "la Luz Parpadeante"
 nick_the_flickering_light_desc: "Hombres buenos, la última ola al pasar, llorando cuán brillantes\nSus débiles actos pudieron haber bailado en una verde bahía,\nFuria, furia contra la agonía de la luz que se extingue."
 nick_the_minotaur: "el Minotauro"
 nick_the_big_headed: "el Cabezón"
 nick_death_dealer: "Repartidor de Muerte"
 nick_the_pale_elf: "el Elfo Pálido"
 nick_daughter_of_coldharbour: "Hija de Puerto Frío"
 nick_abetorius_minor: "Abetorius el Menor"
 nick_abetorius_minor_desc: "Es difícil salir de la sombra de un renombrado antepasado. Especialmente cuando dicho antepasado es inmortal."
 nick_lady_of_keys: "Dama de las Llaves"
 nick_the_relentless: "El Implacable"
 nick_the_relentless_desc: "La gente diría: '¡Por favor, no me saquees!'\n\nY yo diría: 'No, voy a saquear a todos, tú incluido'."
 nick_the_blue_al_azraq: "Al-Azraq"
 nick_the_blue_al_azraq_desc: "Mohammad Abu Abdallah Ben Hudzail al Sahuir era un comandante árabe moro en Iberia, al sur de Valencia. La gente lo llamaba 'el Azul' en referencia a sus ojos." 
 nick_flushing_administrator: "Administrador Sonrojado"
 nick_flushing_administrator_desc: "Aunque los vampiros normalmente no pueden sonrojarse, Matteo aún tiene una manera extraña de hacerlo cada vez que Lucita de Aragón está en su campo de visión."
 nick_sadistic_twins: "los Gemelos Sádicos"
 nick_sadistic_twins_desc: "Arturo y Leonid harán cualquier trabajo sucio que Alfonzo les asigne. Y disfrutarán cada segundo."
 nick_lugos_guardian: "Guardián de Lugos" 
 nick_lugos_guardian_desc: "El protector de un antiguo Santuario al dios Lugos, una memoria viva de batallas largamente olvidadas."
 nick_mortitian_cainite: "Morticianos de Cainitas"
 nick_mortitian_cainite_desc: "Muchos Cainitas traen las cenizas de sus compañeros a Vate, para que pueda ayudar a sus almas a encontrar la salvación final."
 nick_darkmane: "Crin Oscura"
 nick_darkmane_desc: "Ahrimán fluye por la $pod_vitae$ de Ingrid tanto como por la de Adísa. Ingrid no dejará que la supere."
 nick_blessed_vigilant: "de la Vigilancia Bendecida"
 nick_blessed_vigilant_desc: "Cecilia salvó a la incipiente Inquisición Sombría con sus talentos proféticos. Solo una persona sabe lo que realmente le costó."
 nick_grandmistress_helena: "Gran Maestra de Santa Elena"
 nick_knight_helena: "Caballero de Santa Elena"
 nick_mistress_death: "Señora de la Muerte"
 nick_mistress_death_desc: "Ahora al menos puede estudiarla de primera mano."
 nick_lady_cyber: "Dama de Cyber"
 nick_lady_cyber_desc: "Despierta Cainita, tenemos Edades Oscuras que quemar."
 nick_red_death: "Muerte Roja"
 nick_red_death_desc: "El fin del mundo podría llegar por algo tan simple como una hija traicionada por su padre."
 nick_the_blood_mage: "el Mago de Sangre"
 nick_the_undeceiver: "el Desengañador"
 nick_the_bloody_student: "el Estudiante Sangriento"
 nick_balaur: "Balaur"
 nick_the_varangian_quartermaster: "el Intendente Varego"
 nick_the_never_satisfied: "el Nunca Satisfecho"
 nick_slayer_of_the_undead: "Asesino de los No-muertos"
 nick_the_wolf_blooded: "el de Sangre de Lobo" 
 nick_disciple_arhat: "Discípulo del Gran Arhat"
 nick_disciple_arhat_desc: "Aunque solo fue el segundo discípulo del Gran Xue, Ki fue el primero en entender verdaderamente."
 nick_iron_poet: "el Loco Poeta de Hierro"
 nick_iron_poet_desc: "O fue el primero en explorar verdaderamente los reinos de los [Glossary('Reyes Yama','podgloss.yamaking')]. Su mente no sobrevivió al encuentro."
 nick_lovers_east: "Amante Mirando al Este"
 nick_lovers_east_desc: "Ju-Kan y Heeyun miran hacia el este juntos en la no-muerte como lo hicieron en vida."
 nick_dragon_still_black_water: "Tercer Dragón de las Aguas Negras y Quietas"
 nick_wandering_dark: "la Oscuridad Errante"
 nick_wandering_dark_desc: "Liao probó el poder ilimitado y lo encontró insuficiente. Ahora vive por la emoción de la caza, y sus presas son los [Glossary('Reyes Yama','podgloss.yamaking')]."
 nick_iron_foreman: "Capataz de la Mina de Hierro"
 nick_iron_foreman_desc: "El capataz del Infierno de Hierro y Sal se asegura de que el trabajo se haga correctamente. Y el trabajo nunca termina."
 nick_overseer_wicked: "Supervisor de la Ciudad Malvada"
 nick_overseer_wicked_desc: "Nadie ha visto realmente el rostro de Ibara. Bueno, nadie el tiempo suficiente para contar la historia de todos modos."
 nick_crafty_general: "General Astuto"
 nick_crafty_general_desc: "La sobrehumana destreza y experiencia marcial de Tashimoto esconden algo. Pero nadie sabe hasta dónde llega realmente la verdad."
 nick_scheming_dilettante: "Diletante Maquinador"
 nick_scheming_dilettante_desc: "La apariencia insulsa de Miriam esconde una verdad mucho más oscura. Una que incluso la mayoría de los ancianos no lograrían comprender la gravedad."                    
 nick_demon_of_the_western_provinces: "Demonio de las Provincias Occidentales"
 nick_demon_of_the_western_provinces_desc: "Ya sea un verdadero monstruo o simplemente un hombre de habilidad sin par, ninguno de los que se enfrentan a él vive para contar la historia."
 nick_little_dragon: "Pequeño Dragón"
 nick_little_dragon_desc: "Ojalá tuviera siete vidas para dar por su país—y aún así, no sería suficiente."
 nick_lady_of_the_shadows: "Dama de las Sombras"
 nick_lady_of_the_shadows_desc: "Moritoki suplicó a su tío que cuidara de su esposa con su último aliento. Takeda Shingen no solo honró su promesa. Le dio a la esposa de su hijo la oportunidad de vengarse."
 nick_devil_philosopher: "el Filósofo Diablo"
 nick_devil_philosopher_desc: "Shan-Bo hace muchas preguntas pero cree que ya sabe la respuesta. Solo la [Glossary('Augusta Persona de Jade','podgloss.augustpersonageofjade')] podría atravesar su terquedad."
 nick_heavenly_duchess: "Duquesa Celestial de los Ganshezhe"
 nick_heavenly_duchess_desc: "Gran mediadora de la Corte Amarilla y dueña de la guerra honorable, la influencia que el legado de Hong ha tenido en la sociedad de sus hermanos es innegable."
 nick_midnight_master: "Maestro de la Medianoche"
 nick_midnight_master_desc: "Yuan-Te codificó las Guerras de Medianoche. Sus enseñanzas siguen siendo la base de cómo librar una guerra adecuada y honorable para los $pod_kueijin$."
 nick_auspicious_sword: "la Espada Auspiciosa"
 nick_auspicious_sword_desc: "La consorte favorita de un Rey, ejecutada. Una diosa de la guerra, una lección aprendida. A medianoche, la consorte ejecutada escribe obras maestras sobre la guerra."
 nick_daughter_ebon_scarlet: "Hija del Ébano y el Escarlata"
 nick_daughter_ebon_scarlet_desc: "Nadie sabe realmente quién es Soo-kyung. Los más eruditos susurran que podría tener la llave del reino de la Reina Escarlata y el Dragón de Ébano."
 nick_focused_mind: "de la Mente Enfocada"
 nick_focused_mind_desc: "Hao fue despertado por su Segundo Aliento. Su mente aguda y versátil lo convierte en uno de los más grandes políticos entre los $pod_kueijin$."
 nick_labyrintine_contestant: "Contendiente Laberíntico"
 nick_labyrintine_contestant_desc: "Hsu solo perdió dos de las dos mil guerras crepusculares en las que ha participado. Algunos dicen que solo vive realmente por la emoción del juego."
 nick_envoy_salt_iron: "Enviado de la Sal y el Hierro"
 nick_envoy_salt_iron_desc: "La amabilidad exterior y el comportamiento diplomático de Tien Lu esconden su lealtad a [Glossary('Wu Hua','podgloss.wuhua')], Señor del Pozo de Sal y Hierro."
 nick_herald_revolution: "Heraldo de la Revolución"
 nick_herald_revolution_desc: "Burakumin cree verdaderamente en la fuerza de la juventud. Hará conocido su mensaje político y reformará la sociedad $pod_kueijin$ una mente a la vez."
 nick_fated_tragedy: "de la Tragedia Predestinada"
 nick_fated_tragedy_desc: "La elegancia e ingenio de Maliwan le granjearon muchos amigos devotos. También le ganarán un cruel destino."
 nick_martyr_teutonic: "Mártir Teutónico"
 nick_martyr_teutonic_desc: "Hermann sabe que su vida terminará la noche en que el último infiel sea llevado ante la luz de Dios. No tiene intención de detener su trabajo para evitar ese destino."
 nick_albino_rat: "la Rata Albina"
 nick_albino_rat_desc: "Torgeir se sienta en la base misma de la pirámide y sus 'útiles' colegas están ansiosos por recordárselo."
 nick_boyar_diplomat: "el Diplomático Boyardo"
 nick_boyar_diplomat_desc: "La mente analítica y el ingenio agudo de Osobei lo convierten en uno de los activos más confiables de Vladimir Rustovitch." 
 nick_dark_horse_from_faraway_lands: "Caballo Oscuro de Tierras Lejanas"
 nick_dark_horse_from_faraway_lands_desc: "Una tormenta envuelta en mentiras de seda, galopando sobre el lomo de la ambición."
 nick_myeongwol: "Myeongwol"
 nick_myeongwol_desc: "La Luna Brillante resplandece por su belleza e intelecto, prometiéndose a cualquier hombre que pueda resolver el Jeomiligu Idubulchool."
 nick_kwanryong_kuibu_koryo_changwan: "Kwanryong Kuibu Koryo Changwan"
 nick_kwanryong_kuibu_koryo_changwan_desc: "El Comandante de los Guerreros Koryo Sometidos sirve a su amo mongol para luchar contra la aristocracia Goryeo." 
 nick_king_of_light: "Rey de la Luz"
 nick_king_of_light_desc: "Han Lin'er afirmaba ser el legítimo emperador Song y el Buda Maitreya. No pudo respaldarlo."
 nick_architect_of_the_wall: "Arquitecto de la Muralla"
 nick_architect_of_the_wall_desc: "Sí, esa Muralla. La que estás pensando."
 nick_drifting_crane: "Grulla Errante"
 nick_drifting_crane_desc: "Lejos de su tierra natal y de su difunto esposo, Wang Qinghui aún posee la elocuencia y el porte propios de su antiguo título imperial."
 nick_pear_blossom_spear: "la Lanza de Flor de Peral"
 nick_pear_blossom_spear_desc: "Yang Miaozhen es la hija más peligrosa que Shandong haya producido jamás. Su astucia y destreza la llevaron de ser una reina bandida viuda a una gobernadora imperial legítima."
 nick_howling_wind: "el Viento Aullador" 
 nick_howling_wind_desc: "Hon Li está seguro de la rectitud de su causa. Su carisma y determinación serán el escudo para detener a los [Glossary('Reyes Yama','podgloss.yamaking')], les guste o no a los otros $pod_kueijin$." 
 nick_imperial_physician: "Médico Imperial"
 nick_imperial_physician_desc: "Este apodo irónico se le ha dado al hombre que está decidido a 'sanar' sangrientamente la corrupta Burocracia Imperial del [UmbraGlossary('reino_oscuro_de_jade')]."
 nick_the_tiger_kj: "el Tigre"
 nick_the_tiger_kj_desc: "Una noche, la profecía se cumplirá y tendrá que enfrentarse a una amenaza que acabará con el mundo. Se mantendrá firme hasta el final."
 nick_jack_trades_devil: "Diablo de Todos los Oficios"
 nick_jack_trades_devil_desc: "Raven es un torbellino de movimiento, pensamientos e ideas. Permanecer quieto es lo único que no puede hacer."
 nick_serene_flower: "Flor Serena"
 nick_serene_flower_desc: "Qin Shao codificó la [Glossary('Dharma','podgloss.dharma')] de la Flor de Hueso tal como se conoce hoy. Es la encarnación perfecta de la mentalidad serena y desapegada que este [Glossary('Dharma','podgloss.dharma')] trata de alcanzar."
 nick_sensei_daisetsuzan: "Sensei de Daisetsuzan"
 nick_sensei_daisetsuzan_desc: "Generación tras generación de espías y asesinos de la Flor de Hueso fueron, son y serán entrenados bajo su ojo vigilante."
 nick_family_protector: "Protector de la Familia"
 nick_family_protector_desc: "Para la población alrededor del Monte Tiantia, Han Houshou es la manifestación de la voluntad de sus antepasados y es alabado como tal."
 nick_conservative_genius: "Genio Conservador"
 nick_conservative_genius_desc: "Ku Zu nunca olvida nada. Como tal, su interpretación del camino no admite compromisos."
 nick_mother_shadows: "Madre de las Sombras"
 nick_mother_shadows_desc: "Pocos pueden encontrar a la exaltada Dueña. Aquellos que lo hacen están un paso más cerca de su iluminación."
 nick_sambong: "Sambong"
 nick_sambong_desc: "El erudito poeta que codificó la ideología de Joseon."
 nick_uiam: "Uiam"
 nick_uiam_desc: "La Dama Uiam del clan Sinan Joo dio su vida para vengar a su amante." 
 nick_dae: "Dae"
 nick_dae_desc: "Jang-geum se elevó por encima de la lucha de ser mujer bajo la dinastía Joseon y logró ser reconocida como la cuidadora oficial del Rey Jungjong."
 nick_the_exiled_sage: "el Sabio Exiliado"
 nick_the_exiled_sage_desc: "Ni monje ni lego, sino algo más."
 nick_tempered_ronin: "Ronin Templado"
 nick_tempered_ronin_desc: "Omi se vengó de aquellos que lo agraviaron. Ahora es un faro de calma y paciencia... hasta que alguien le dé razones para desenvainar su espada."
 nick_seed_scatterer: "Dispersora de las Semillas"
 nick_seed_scatterer_desc: "La Madre alcanzó la iluminación, y luego ofreció las semillas de ella al mundo, sacrificando su ego como una madre sacrifica comida para alimentar a sus crías."
 nick_the_dragon_kj: "el Dragón"
 nick_the_dragon_kj_desc: "Una noche, la profecía se cumplirá y tendrá que enfrentarse a una amenaza que acabará con el mundo. Se mantendrá firme hasta el final."
 nick_patient_blossom: "Flor Paciente"
 nick_patient_blossom_desc: "La meditación y la paciencia son las claves para entender el camino del honorable Wang Fu-chih hacia la iluminación." 
 nick_six_springs: "Seis Manantiales"
 nick_six_springs_desc: "Gao Hueli piensa que la virtud debe alcanzarse por cualquier medio necesario. Sus considerables logros han sido inmortalizados en los poemas de los Seis Manantiales escritos por su amigo I Dan." 
 nick_vengeful_patron: "Patrona Vengativa" 
 nick_vengeful_patron_desc: "Wang nunca abandonó verdaderamente el lugar donde murió. Sin embargo, su legado podría no ser el que ella espera." 
 nick_the_crane: "la Grulla"
 nick_the_crane_desc: "Una noche, la profecía se cumplirá y tendrá que enfrentarse a una amenaza que acabará con el mundo. Se mantendrá firme hasta el final."
 nick_clear_sky_sage: "el Sabio del Cielo Claro" 
 nick_carthaginian_envoy: "el Enviado Cartaginés" 
 nick_bane_khotans: "el Azote de los Jotanes" 
 nick_sky_swallowing_darkness: "la Oscuridad Devoradora del Cielo"
 nick_artisan_hundred: "Artesano de los Cien Cascos"
 nick_the_dreadnought: "el Acorazado"
 nick_the_chaineater: "el Comecadenas"
 nick_the_uralic_stalker: "el Acechador Uraliano"
 nick_wings_night: "las Alas en la Noche"
 nick_the_defiant_prince: "el Príncipe Desafiante"
 nick_bane_vaults: "el Azote de las Bóvedas"
 nick_the_emerald_wolf: "el Lobo Esmeralda"
 nick_the_sapphire_hawk: "el Halcón Zafiro"
 nick_steppe_lady: "Dama de las Estepas"
 nick_the_beauty: "la Belleza"
 nick_the_red_moon_shaman: "el Chamán de la Luna Roja"
 nick_the_black_wolf: "el Lobo Negro"
 nick_the_demonbane: "el Matademonios"
 nick_the_lighting_breaker: "el Romperrayos"
 nick_tigerbane: "Matatigres"
 nick_golden_wolf: "el Lobo Dorado"
 nick_lucky_lion: "León Afortunado"
 nick_lucky_lion_desc: "Aunque relativamente hábil por sí mismo, es la extraña y sobrecogedora suerte de Chan la que está empezando a ser una preocupación para otros [Glossary('Wan Kuei','game_concept_kuei_jin_desc')]."
 nick_gold_counselor: "Consejero de Oro"
 nick_gold_counselor_desc: "De las Cenizas del Monte Meru, Maya usará a los Caminantes de Sombras para devolver la luz al mundo."
 nick_child_ages: "Hijo de las Eras"
 nick_child_ages_desc: "Ti Feng vio el fin del Cielo y huyó de él. Ahora solo con sus recuerdos, espera el día en que pueda encontrar el valor necesario para contraatacar."
 nick_illuminating_darkness: "de la Oscuridad Iluminadora"
 nick_delicate_nuances: "Dama de los Matices Delicados y los Significados Ocultos"
 nick_god_rain: "Dios de la Lluvia y las Lágrimas"
 nick_god_rain_desc: "Indra podría ser el miembro más espiritualmente avanzado de la Tribu Celestial desde su fundador. Algunos creen que ella será quien mate a la [Glossary('Augusta Persona de Jade','podgloss.augustpersonageofjade')] cuando gire la Rueda."
 nick_the_usurper_kj: "la Usurpadora"
 nick_the_usurper_kj_desc: "La esposa de Krishna regresó de la muerte para proteger a las viudas mortales. O al menos eso es lo que ella cree."
 nick_assertive_excellence: "de la Excelencia Asertiva"
 nick_assertive_excellence_desc: "¿Es el Usurpador, asumiendo audazmente la divinidad a expensas de otro? ¿Es la fuente del mito original? Hanuman no lo dice."
 nick_spirit_guided: "el Guiado por los Espíritus"
 nick_spirit_guided_desc: "Una vez usado por los espíritus para sus propios planes mezquinos, Riyan creció lentamente hasta convertirse en su igual."
 nick_last_sambyeolcho: "el Último Sambyeolcho"
 nick_last_sambyeolcho_desc: "El último [Glossary('Sambyeolcho', 'podgloss.sambyeolcho')] se levantó contra la tiranía de la ocupación de Goryeo por Kublai Khan."
 nick_princess_jeonghwa: "Princesa Jeongwha"
 nick_princess_jeonghwa_desc: "Sufriendo abusos a manos de su esposo, el Rey de Goryeo, esta Princesa Yuan se detendrá ante nada para ejecutar su venganza."
 nick_yi_chachun: "Yi Chach'un"
 nick_yi_chachun_desc: "Yi Chach'un eligió la estabilidad y la paz sobre su lealtad a los Yuan."
 nick_kayaji: "Kayaji"
 nick_kayaji_desc: "Nacida como [Glossary('nobi','podgloss.nobi')|l], Kayaji usó sus encantos para ascender al estatus de Reina Consorte del Rey U, sobreviviendo a intrigas palaciegas que la llevaron al infierno."
 nick_howol: "Howǒl"
 nick_howol_desc: "Después de las amenazas de violación y el posterior asesinato de su esposo, el Rey Gongmin, Howǒl abandonó su vida cortesana para convertirse en monje budista."
 nick_sayuksin: "Sayuksin"
 nick_sayuksin_desc: "Uno de los seis ministros mártires, que participaron en un complot para asesinar al rey usurpador Sejo y posteriormente fueron condenados a muerte."
 nick_eowudong: "Eowudong"
 nick_eowudong_desc: "Una de las mujeres malvadas de la dinastía Joseon, Eowudong se negó a aceptar el papel sumiso de la mujer en el confucianismo."
 nick_jeongam: "Jeongam"
 nick_jeongam_desc: "Uno de los dieciocho sabios de Corea, un mártir confuciano y erudito [Glossary('seonbi', 'podgloss.seonbi')|l], Jeongam impulsó una reforma de la administración coreana antes de convertirse en víctima de la Tercera Purga de los Literatos."
 nick_chungmugong: "Chungmu-gong"
 nick_chungmugong_desc: "El Duque de la Lealtad y la Guerra es temido y respetado por cualquier marinero que haya oído hablar de él, recordando la destrucción de la flota japonesa a sus manos."
 nick_red_robe: "El General de la Túnica Roja"
 nick_red_robe_desc: "Vistiendo una túnica roja supuestamente teñida con la primera sangre menstrual de niñas, cargando de cabeza a la batalla, el General de la Túnica Roja está protegido por el Yin, anulando el Yang de las balas enemigas." 
 nick_holy_golden_emperor: "Santo Emperador Dorado"
 nick_holy_golden_emperor_desc: "La única soberana femenina reconocida de China llevó a la nación a nuevas alturas, incluso si el camino se allanó con sangre."
 nick_reclusive_advisor: "Consejero Recluso"
 nick_reclusive_advisor_desc: "Kautalya tuvo una gran influencia en los primeros conquistadores de la India. Desapareció de la vista del público cuando la guerra de sombras por la influencia en el subcontinente comenzó a volverse en su contra."
 nick_guide_power: "Guía del Poder"
 nick_guide_power_desc: "Kang aboga por que los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] gobiernen sobre los mortales como lo hicieron en tiempos legendarios. Para beneficio de los mortales despistados, por supuesto."
 nick_reaching_tiger: "Tigre que Alcanza"
 nick_reaching_tiger_desc: "El intento de Da de reformar la corte del Tigre Blanco terminó en desastre. Puede que sea demasiado tarde para salvar lo que queda de ella."
 nick_golden_jade_emperor: "Emperador de Jade Dorado"
 nick_golden_jade_emperor_desc: "Wang vive en su propio mundo, solo preocupado por su iluminación. Sin embargo, el mundo podría alcanzarlo en algún momento."
 nick_shout_anger: "Grito de Ira"
 nick_shout_anger_desc: "La furia de Mawar nunca la desvió. Desde sobrevivir a los infiernos hasta encontrar a su hermana de sangre, será la base de su ascenso a las [Glossary('Cien Nubes','podgloss.hundredclouds')]."
 nick_diamond_soul: "el Alma de Diamante"
 nick_diamond_soul_desc: "Intan es una superviviente. Lo único que realmente cambió es que ahora usa sus considerables instintos para su [Glossary('Wu','podgloss.wu')] en su conjunto."
 nick_singing_crocodile: "el Cocodrilo Cantor"
 nick_singing_crocodile_desc: "Mientras sus hermanas cargan a la batalla, Melati espera en una emboscada. El resultado final es la misma masacre sangrienta y despiadada."
 nick_lifter_stones: "El Levantador y Alzador de Piedras"
 nick_lifter_stones_desc: "Siti esperaba usar su habilidad para los números para la prosperidad de su hogar. Ahora ayuda a sus hermanas a nivelar la fortaleza de sus enemigos."
 nick_devil_eater: "el Come Demonios"
 nick_devil_eater_desc: "Algunos de sus enemigos piensan que este apodo es solo para aparentar. A menudo aprenden su error en horrible agonía." 
 nick_warden_shogun: "Guardián del Shogun"
 nick_warden_shogun_desc: "Miura protege diligentemente al acosado shogun, sin conocer la verdad más complicada detrás de los ataques."
 nick_myochong: "Myoch'ong" 
 nick_myochong_desc: "Quemado por los fuegos de sus pecados, Hojil ahora usa el nombre de su mentor muerto como una máscara para ganar poder." 
 nick_keeper_threshold: "Guardián del Umbral"
 nick_keeper_threshold_desc: "Jiang mantiene abierta la puerta a China. Algunos dirían que demasiado abierta." 
 nick_ocean_striding: "Bandido Caminante de Océanos" 
 nick_ocean_striding_desc: "Aunque muchos se burlarían de tal título, Yao se enorgullece enormemente de ser la pirata más famosa de los Wan Kuei. Su leyenda solo está comenzando." 
 nick_alyad_alyumnaa_alsawda: "Alyad Alyumnaa Alsawda" 
 nick_alyad_alyumnaa_alsawda_desc: "El peso de la Ilusión rompería muchas sombras. Todas excepto una, que tomaría la Ciudad que Nunca Duerme."
 nick_long_neck_legend: "Leyenda del Cuello Largo" 
 nick_long_neck_legend_desc: "La más grande maestra japonesa de Shintai de Carne dejó un impacto en los mortales que ahora tejen historias sobre el cuello increíblemente largo, flexible y que desafía la gravedad que ella exhibió una vez."
 nick_imperial_steadfast: "Leal Imperial Inquebrantable" 
 nick_imperial_steadfast_desc: "Taira y su Uji creen que el Emperador es la única autoridad que importa. Cualquier nueva idea o concepto que no se origine de él debe ser resistido a toda costa." 
 nick_southern_sycophant: "el Sifilítico Sureño" 
 nick_southern_sycophant_desc: "Mientras los Song entran en pánico ante la proximidad de los mongoles, ¿dónde está Guiying? En la corte de su señor, compitiendo cada vez más por su 'atención'." 
 nick_western_fawner: "el Adulador Occidental" 
 nick_western_fawner_desc: "Mientras los reinos de occidente se alinean con los mongoles y los bebedores de sangre extranjeros se acercan, las atenciones de Bai se dirigen hacia adentro, felizmente ignorante de los males venideros." 
 nick_northern_henchman: "el Secuaz Norteño"
 nick_northern_henchman_desc: "Una orden es una orden, y el soldado sin remordimientos no conoce la vergüenza." 
 nick_eastern_parasite: "el Parásito Oriental" 
 nick_eastern_parasite_desc: "Las costas han comenzado a gritar, hasta un punto que incluso los Tigres Diablo se sienten incómodos. Tal es la 'piedad' de Qing." 
 nick_nocturne_illuminator: "el Iluminador Nocturno" 
 nick_nocturne_illuminator_desc: "Cuando se trata de lidiar con mujeres berserker moldeadoras de carne, vívida mortalidad, religión y cultura en capas de milenios de profundidad, y océanos que esconden a Gangrel acechantes, uno necesita tener tacto para prosperar." 
 nick_flame_eater: "el Comefuegos" 
 nick_flame_eater_desc: "¿Qué tipo de monstruo se alimenta de dragones, diablos, vampiros, campeones de la tierra, distorsionadores de la realidad, fuego y pequeños dioses? Uno que alguna vez fue humano." 
 nick_purger_dragon_night: "Azote de la Noche del Dragón" 
 nick_purger_dragon_night_desc: "Shizuko salvó el mundo mundano y espiritual de la loca creación de Isamu Harujiro. Incluso el sobrenatural más obstinado reconoce que es el más poderoso de los cazadores de demonios." 
 nick_ghost_killer: "Asesino de Fantasmas" 
 nick_ghost_killer_desc: "Thitkwa no confiaría en aquellos alineados con la muerte. Pero la confianza no tiene nada que ver con lo sabrosos que pueden ser." 
 nick_knight_gold: "Caballero de Oro" 
 nick_knight_gold_desc: "Alguien investido de todas las virtudes de la caballería y el honor fue al este para evaluar la amenaza de los [Glossary('Anda','podgloss.anda')]. Pero ¿es caballeroso por convicción? ¿O por su propia vanidad?" 
 nick_returned_khan: "Khan de Kanes Retornado" 
 nick_returned_khan_desc: "Tömörbaatar afirma ser el propio Temujin, su antiguo cuerpo destruido y obligado a tomar un cuerpo femenino en su regreso de la muerte. Pero ¿es todo lo que Tömörbaatar afirma realmente cierto?" 
 nick_thai_to: "Thái Tổ"
 nick_thai_to_desc: "El nombre de templo de [Glossary('Thái Tổ','podgloss.thai-to')] ha sido ganado por [CHARACTER.GetHerHim] mediante [CHARACTER.GetHerHis] acciones, incluso si [CHARACTER.GetSheHe] nunca se sentó en un trono."
 nick_princess_of_precious_leaves_and_branches: "La Princesa de las Hojas y Ramas Preciosas"
 nick_princess_of_precious_leaves_and_branches_desc: "Ofrecida como distracción para un oponente, desempeñó su papel y permitió que la balanza se inclinara a favor de su emperador. Y todo lo que le costó fue todo."
 nick_duc_thanh_hung_dao: "Đúc Thanh Hung Đao"
 nick_duc_thanh_hung_dao_desc: "Venerado como una deidad en la [Glossary('Trân Trieú','podgloss.tran-trieu')], el espíritu del legendario general aún vela por el Đai Viêt para repeler a sus invasores."
 nick_father_of_dai_viet: "Padre del Đai Viêt"
 nick_father_of_dai_viet_desc: "El primer historiador del Đai Viêt desempeñó un papel crucial en el establecimiento de la autonomía e independencia del Đai Viêt, convirtiéndolo en un igual a su vecino del norte, China."
 nick_ca_doc_duoc: "Cà Đôc Duoc"
 nick_ca_doc_duoc_desc: "Las flores más hermosas son, a menudo, las más peligrosas. Y la [Glossary('Cà Đôc Duoc','podgloss.man_da_la')] no es una excepción."
 nick_ngoc_thien_lien: "Ngoc Tinh Lien"
 nick_ngoc_thien_lien_desc: "El Loto en un Pozo de Jade, a pesar de su apariencia física y baja estatura, logró imponerse como un increíble erudito y diplomático."
 nick_daring_bandit: "el Bandido Audaz"
 nick_daring_bandit_desc: "Yendo de un atraco a otro, el Bandido Audaz roba tanto riquezas como los corazones de cualquiera que se cruza en su camino, ya sea plebeyo o realeza."
 nick_mwei_manet: "Mwei Manet"
 nick_mwei_manet_desc: "La Señorita Rubí hizo todo lo necesario para ascender en la escala social, sin importar el costo, usando sus encantos y, según los rumores, brujería para envolver a un príncipe rebelde alrededor de su dedo."
 nick_poet_general: "el Poeta General"
 nick_poet_general_desc: "Tan hábil con la logística y los ejércitos como con las palabras, el Poeta General se mantendrá firme hasta que el último de sus soldados y amigos haya sido asesinado por el enemigo."
 nick_maha_devi: "Maha Devi"
 nick_maha_devi_desc: "La Gran Diosa orquestó una campaña de regicidio que duró diez años para finalmente sentarse en el trono."
 nick_first_chua: "Primera de los Chúa"
 nick_first_chua_desc: "La primera de los [Glossary('Chúa', 'podgloss.chua' )] conspiró contra sus rivales para afianzar a su clan detrás del trono y manipular al emperador."
 nick_binnya_thau: "Binnya Thau"
 nick_binnya_thau_desc: "[Glossary('Binnya Thau', 'podgloss.binnya_thau')] sobrevivió a las guerras fratricidas que la llevaron a convertirse en la reina monja, comenzando un período de paz en Pegu antes de retirarse del mundo."
 nick_old_general: "El Viejo General"
 nick_old_general_desc: "A pesar de su edad, y beneficiándose de una vida de experiencia pasada en el campo de batalla o en la intrigante corte de Ava, el Viejo General siguió siendo una pieza fija de una vida política turbulenta."
 nick_wine_maker: "el Vinatero"
 nick_wine_maker_desc: "Conocedor del fino vino gallego, este personaje llevó su pasión por la delicatesen a sus aventuras, compartiendo su gusto con sus conocidos, lo que llevó a circunstancias dramáticas."
 nick_mistress_lychee_garden: "la Dueña del Jardín de Lichis"
 nick_mistress_lychee_garden_desc: "El Jardín de Lichis, o Lê Chi Viên, era el lugar de residencia del más grande erudito del Đai Viêt, donde la Dueña puso al emperador bajo su encanto y donde él murió repentinamente."
 nick_tyrant_stars: "Tirano de las Estrellas"
 nick_tyrant_stars_desc: "Si un [Glossary('Emperador Demonio','podgloss.demonemperor')] debe ascender, ¿quién más podría ser la Emperatriz Demonio a su lado?" 
 nick_sword_tyranny_bane: "Espada de la Perdición de la Tiranía"
 nick_sword_tyranny_bane_desc: "Cuando la espada de Miyako se desenvaina, o ella o un tirano caerán, no hay alternativas."
 nick_the_seventh_son: "el Séptimo Hijo"
 nick_the_seventh_son_desc: "Ha sobrevivido durante mucho tiempo a los otros seis, pero ¿es el trono aún suyo para tomar?"
 nick_sword_great_clan: "Espada del Gran Clan"
 nick_sword_great_clan_desc: "Parece que puede haber honor entre monstruos."
 nick_dagger_great_clan: "Daga del Gran Clan"
 nick_dagger_great_clan_desc: "La venganza puede ser tan simple y mortal como una daga en la oscuridad."
 nick_sage_great_clan: "Sabio del Gran Clan"
 nick_sage_great_clan_desc: "¿Es realmente el monstruo enfurecido más terrible que el sabio?"
 nick_the_shark_eater: "el Come Tiburones"
 nick_the_shark_eater_desc: "Todo un cambio de papeles."
 nick_lord_mountains: "Señor de las Montañas"
 nick_lord_mountains_desc: "Un señor renuente podría revelarse a sí mismo en la protección de su pueblo adoptado."
 nick_the_white_lady_indah: "la Dama Blanca"
 nick_the_white_lady_indah_desc: "Un fantasma, no realmente de este mundo oriental pero tampoco realmente del occidental."
 nick_impulsive_scourge: "el Azote Impulsivo" 
 nick_impulsive_scourge_desc: "Ser ruidoso y descarado no siempre es una buena idea cuando estás en territorio enemigo."
 nick_seneschal_blood: "Senescal de Sangre"
 nick_seneschal_blood_desc: "Hay más en gobernar la noche que la intriga y la intimidación."
 nick_esotericist: "el Esoterista"
 nick_prodigal_student: "el Estudiante Pródigo"
 nick_damnation_seer: "Vidente de la Condenación"
 nick_smog_prophet: "Profeta del Esmog"
 nick_pale_phantom: "el Fantasma Pálido"
 nick_whispered_dagger: "la Daga Susurrada"
 nick_shadowed_flower: "Flor Sombría"
 nick_ox_monk: "Monje Buey"
 nick_serpent_monk: "Monje Serpiente"
 nick_smiling_goblin: "Duende Sonriente"
 nick_the_rumormonger: "el Sembrador de Rumores"
 nick_nightmare_slayer: "Matador de Pesadillas"
 nick_the_reed_stalker: "el Acechador de Cañas"
 nick_the_gold_gnawer: "el Roedor de Oro"
 nick_the_farswimmer: "el Nadador Lejano"
 nick_the_sandfish: "el Pez de Arena"
 nick_keeper_citadel: "Guardián de la Ciudadela"
 nick_the_quiet_vestige: "el Vestigio Silencioso"
 nick_the_pale_penangallan: "el Penangallan Pálido"
 nick_banpaia: "el Banpaia"
 nick_banpaia_desc: "Lo que otros le repiten con confusión, Hannah se lo afirma a sí misma con orgullo."
 nick_grasping_dragon: "Dragón Aferrador"
 nick_grasping_dragon_desc: "El prestigio y el poder temporal de Xiao solo son rivalizados por los del propio Emperador Amarillo.\nAl menos sobre el papel."
 nick_hellbringer: "Portador del Infierno"
 nick_hellbringer_desc: "Qiang Ru trae el infierno a los [akuma|E] que caza personalmente. En el futuro, aunque este apodo perdurará, su significado será mucho más oscuro."
 nick_afterbirth_slaughter: "el Alumbramiento de la Matanza"
 nick_afterbirth_slaughter_desc: "Quien confunda a un Dhampyr [Glossary('Penangallan','podgloss.penangallan')] por menos feroz que su madre [Glossary('Penangallan','podgloss.penangallan')] estaría rápidamente, y sangrientamente, equivocado."
 nick_devorer_shade_born: "Devorador del Nacido de la Sombra"
 nick_devorer_shade_born_desc: "El débil se aprovecha del más débil hasta que es atrapado por el fuerte."
 nick_light_false_promises: "la Luz de las Falsas Promesas"
 nick_light_false_promises_desc: "Seguir a este solo te llevará por mal camino."
 nick_gremlin_gold: "el Duende del Oro"
 nick_gremlin_gold_desc: "¡Más, más, MÁS!"
 nick_mother_monsters: "Madre de Monstruos"
 nick_mother_monsters_desc: "Nada es tan puro como el amor de una madre, ¿verdad?"
 nick_mommy_monster: "Monstruo de Mamá"
 nick_mommy_monster_desc: "Por su brutal resistencia a la purga de Borneo por parte de Piyau, Putra condenará a generaciones de Dhampyr varones en las Cortes Doradas venideras."
 nick_king_ashes: "Rey de las Cenizas"
 nick_king_ashes_desc: "¿Contra quién peleará cuando todo quede reducido a cenizas?"
 nick_craven_despoiler: "Saqueador Cobarde"
 nick_craven_despoiler_desc: "Algunos nunca cambian, ni siquiera en la muerte. Solo empeoran."
 nick_gaping_maw: "la Boca Abierta"
 nick_gaping_maw_desc: "Nunca será saciada."
 nick_protector_red_light: "Protector de las Luces Rojas"
 nick_protector_red_light_desc: "Cuando aquellos que te protegen tienen un destino mucho peor reservado para ti, ¿qué esperanza queda?"
 nick_laughing_demon: "el Demonio Risueño"
 nick_laughing_demon_desc: "En cierto modo, ella se reirá la última."
 nick_marble_resolve: "el Mármol de la Determinación"
 nick_marble_resolve_desc: "Locura es todo esto. A veces uno debe intervenir para arreglar las cosas."
 nick_ice_dragon: "el Dragón de Hielo"
 nick_ice_dragon_desc: "En la vida y en la muerte hay guerra. Y la Reina Guerrera responde como siempre lo ha hecho, hacha en mano."
 nick_devil_rose: "la Rosa que Estrangula al Diablo"
 nick_devil_rose_desc: "Una bonita flor desairada. Una enredadera que los golpeará a todos en pedazos por sus pecados."
 nick_boar_wisdom: "Jabalí de la Sabiduría"
 nick_boar_wisdom_desc: "Testarudo pero sabio, furioso pero reservado, Narayan es una tormenta de contradicciones pero inquebrantable en su determinación."
 nick_millipede: "el Milpiés"
 nick_millipede_desc: "En tiempos pasados, hablaban de un milpiés que observaba a todos, correteando sobre mil patas. Erke-kara está orgullosa de esa reputación."
 nick_brilliant_viper: "la Víbora Brillante"
 nick_brilliant_viper_desc: "A veces los colores más hermosos tienen los venenos más peligrosos."
 nick_the_warrior_courtier: "el Cortesano Guerrero"
 nick_the_warrior_courtier_desc: "Pocos Ancestros tolerarían a un ladrón. Por eso Jetsun insiste bastante en que no lo es."
 nick_the_healing_courtier: "el Cortesano Sanador"
 nick_the_healing_courtier_desc: "Yangwa es solo un médico, ¿verdad? Sin duda, él quiere lo mejor."
 nick_the_vermillion_courtier: "el Cortesano Bermellón"
 nick_the_vermillion_courtier_desc: "Es un enigma donde va, sus intenciones desconocidas. Tarareando al ritmo de algún latido invisible."
 nick_heaven_hell_general: "el General del Cielo y el Infierno"
 nick_heaven_hell_general_desc: "El Imperio largamente unido debe dividirse, el Imperio largamente dividido debe unirse. Como es en la luz, Ma Hai-Lan cree que debe hacerlo en la noche."
 nick_spiked_chain_warlord: "Señor de la Guerra de las Cadenas con Púas"
 nick_spiked_chain_warlord_desc: "Mil historias, mil mentiras. Y todo por su ciudad, su hogar, un lugar que nadie más debe tener."
 nick_scatterer_winds: "el Dispersador de Vientos"
 nick_scatterer_winds_desc: "Incluso si le costó la vida, Yanxiang se volvió experto en matar asaltantes. Incluso en la muerte, encuentra muchos enemigos para ejercer su habilidad."
 nick_demon_bull: "el Toro Demonio"
 nick_demon_bull_desc: "Tai es un monstruo de hombre, grande en forma y presencia. Donde pisa, los hombres escuchan."
 nick_alluring_devil: "el Diablo Atractivo"
 nick_alluring_devil_desc: "Bendecido con una belleza increíblemente deseable y una voz maravillosa, pocos son conscientes de los dientes de tigre hundiéndose en su garganta hasta que es demasiado tarde."
 nick_serpent_sovereign: "el Soberano Serpiente"
 nick_serpent_sovereign_desc: "Al ser descartado por las serpientes, Amphai encontraría un nuevo camino, sin importar la sangre que tuviera que derramar por él."
 nick_dragon_crushing: "la Constrictora Aplastadragones"
 nick_dragon_crushing_desc: "A la deriva en un mundo sin luz, Vixay persigue la última que tiene, incluso si cae a la condenación con él."
 nick_charcoal_viper: "la Víbora de Carbón"
 nick_charcoal_viper_desc: "Herboristería y veneno, una línea tan delgada entre curar y dañar... bailar en su umbral es una oleada de poder tan maravillosa."
 nick_financier_sorrows: "Financiero de las Penas"
 nick_financier_sorrows_desc: "Todo lo que necesita para arruinar una vida es ajustar los libros. Solo basta un pago atrasado para que una vida se derrumbe."
 nick_promising_cobra: "la Cobra Prometedora"
 nick_promising_cobra_desc: "En la naturaleza, cuanto más bonito es el animal, más letal puede ser su veneno. Con los humanos, a veces son las palabras las que esconden el peligro."
 nick_radiant_falcon: "el Halcón Radiante"
 nick_radiant_falcon_desc: "Hay una podredumbre en el corazón del mundo. No será conquistada por el exceso y la indulgencia, sino por la brillantez inquebrantable y la preservación de quienes viven en él."
 nick_ashen_hawk: "el Halcón Ceniciento"
 nick_ashen_hawk_desc: "Tanto que perder puesto ante ellos. Tanto por lo que luchar. Incluso si tienen que quemarse, protegerán su hogar, no importa cuán malditas las Cortes Augustas los denuncien."
 nick_southern_wind_gold: "Viento Sureño de Oro"
 nick_southern_wind_gold_desc: "A medida que las Cortes se desmoronan, sería un desperdicio dejar que los activos de los Ancestros asesinados se pierdan, y Wu Lishan no puede permitir eso."
 nick_roots_amber: "las Raíces que Entrelazan el Ámbar"
 nick_roots_amber_desc: "Cuando el viento aúlla contra la tierra, son las raíces de los árboles las que la mantienen firme. De la misma manera, Jingyi es lo que mantiene unidos a sus compañeros contra la tormenta."
 nick_golden_blizzard: "la Ventisca Dorada"
 nick_golden_blizzard_desc: "La guerra es tanto finanzas como matarse unos a otros. Y cuando se trata de reunir arcas de guerra, pocos lo hacen mejor que Xue."
 nick_golden_godfather: "el Padrino Dorado"
 nick_golden_godfather_desc: "Un seguidor verdaderamente estudioso de su [Glossary('Dharma','podgloss.dharma')], Lian es un árbol que ha dado muchos frutos, y sus masivos ejércitos de hijos resultan intensamente útiles como mensajeros de los muertos."
 nick_golden_bookkeeper: "el Contable Dorado"
 nick_golden_bookkeeper_desc: "Cuando se trata de mover tomos extremadamente peligrosos y preciosos, pocos son más huraños y de rostro de piedra que Jianhong."
 nick_guardian_quills: "Guardián de las Plumas"
 nick_guardian_quills_desc: "Mientras atacantes desconocidos golpean a los escribas, el rostro más frágil es el más letal."
 nick_tortoise_scribe: "el Escriba Tortuga"
 nick_tortoise_scribe_desc: "Redactando las obras de la gran extensión, Huai ha despojado su mente de las preocupaciones del mundo para concentrarse en su trabajo."
 nick_phoenix_scribe: "el Escriba Fénix"
 nick_phoenix_scribe_desc: "Mil consultas con terror, cien desviaciones documentadas. Y a veces tales palabras caen en oídos sordos."
 nick_tiger_scribe: "el Escriba Tigre"
 nick_tiger_scribe_desc: "Tener sentido de la Guerra Eterna como escriba es una tarea que quebraría a muchos. Y sin embargo, Feishan permanece tan resuelta como el Sauce."
 nick_dragon_scribe: "el Escriba Dragón"
 nick_dragon_scribe_desc: "Muchos asumen que Junko no se preocupa por nada, pero no es así. Tres ojos vigilan en la oscuridad, y si no hacen nada contra ellos, todos están condenados."
 nick_shield_empire: "Escudo del Imperio"
 nick_shield_empire_desc: "¿Por qué debería preocuparse la Corte del Emperador Amarillo? Tienen a Wei Anzang para defenderlos, y siempre lo harán."
 nick_riderbreaker: "el Rompecaballeros"
 nick_riderbreaker_desc: "Se dice que los Vientos rompen a muchos Demonios. Da'an les mostrará a todos cómo dispersarlos."
 nick_champion_hebei: "Campeón de la Llanura de Hebei"
 nick_champion_hebei_desc: "Maedaeri ha residido durante mucho tiempo en estas estepas. Estos nuevos conquistadores pasarán, y aquí permanecerá ella."
 nick_wardern_black_gates: "Guardián de las Puertas Negras"
 nick_wardern_black_gates_desc: "Mientras sombríos presagios vienen del norte, uno se mantiene firme en las puertas, listo para recibirlos a petición de su señora."
 nick_the_courier: "el Correo"
 nick_the_courier_desc: "Se necesita un gran cartero para mantener informados a todos los Ancestros de las Cortes Amarillas. Y Mutawuta es uno de los mejores en lo que hace."
 nick_the_ogre: "el Ogro"
 nick_the_ogre_desc: "Las leyendas dicen que Mapo una vez se comió a un hombre y a su caballo de un solo bocado. Una mentira, por supuesto. Fue solo el caballo."
 nick_whisper_winds: "Susurro en los Vientos"
 nick_whisper_winds_desc: "Demasiadas personas en estos tiempos difíciles mueren por disparos de flecha. Seguramente los [Glossary('Anda','podgloss.anda')] tienen la culpa..."
 nick_life_sage: "el Sabio de la Vida"
 nick_life_sage_desc: "El flujo de la esencia impregna todas las cosas, y pocos entre los Wan Kuei han alcanzado tal nivel de maestría como Kasumi."
 nick_the_gourmand: "el Glotón"
 nick_the_gourmand_desc: "Cenar con él es saborear el fin de algo sagrado, y anhelar más."
 nick_unbound_shikome: "la Shikome Liberada"
 nick_unbound_shikome_desc: "Yukio aborrece la semilla que [Glossary('Emma-O','podgloss.emmao')] había sembrado en ella. Se esfuerza por convertirse en una asesina sin parangón, para poder matar incluso al Emperador de la Noche."
 nick_gaunt_lieutenant: "Teniente Demacrado"
 nick_gaunt_lieutenant_desc: "Hsian Lo Fan es la encarnación del Yin para el Yang de [Glossary('Tou Mu','podgloss.toumu')]. Un lugarteniente huraño y despiadado para la Emperatriz de Hierro."
 nick_fire_mantled: "el Cubierto de Fuego"
 nick_fire_mantled_desc: "Que ardan aquellos que amenazarían la grandeza de Solyna. Serán solo más combustible para la hoguera de su brillantez."
 nick_sage_light: "el Sabio de la Luz"
 nick_sage_light_desc: "La luz de la salvación puede ser cegadora, pero eso rara vez ha desviado a Wuji de su curso."
 nick_sage_snow: "el Sabio de la Nieve"
 nick_sage_snow_desc: "El invierno es siempre una época de dificultades. Uno debe esforzarse por pastorear a las generaciones más jóvenes desde sus primeras noches largas."
 nick_sage_embers: "el Sabio de las Brasas"
 nick_sage_embers_desc: "El mundo se ha convertido en un incendio forestal de violencia y carnicería. Hongjian espera enseñar que incluso la ceniza puede ser útil para fertilizar el mundo que viene después." 
 nick_sage_reeds: "el Sabio de las Cañas"
 nick_sage_reeds_desc: "El jardín que brota de los hombres puede ser bastante fructífero. Entre los Sabios, Renyuan se asegura de que su semilla siempre dé fruto."
 nick_sage_storms: "el Sabio de las Tormentas"
 nick_sage_storms_desc: "Pocos sospecharían de un Xianbei entre los Sabios Quíntuples. Menos sospecharían que ella es su fortaleza."
 nick_emerald_savant: "el Sabio Esmeralda"
 nick_emerald_savant_desc: "Los Bier son renombrados por sus habilidades como trabajadores de la magia. Y por encima de ellos está su propio nigromante dedicado."
 nick_emerald_prophet: "la Profeta Esmeralda"
 nick_emerald_prophet_desc: "Hemavati es una rareza entre los Bier, pero su papel entre ellos es uno de los más importantes."
 nick_ruby_ghost: "el Fantasma Rubí"
 nick_ruby_ghost_desc: "Qun, como su hermana, es alguien que parece un fantasma salido de pesadillas. Para él, podrían estar en lo cierto."
 nick_the_reubbelite_ghost: "el Fantasma Reubbelita"
 nick_the_reubbelite_ghost_desc: "Youwu, como su hermano, es alguien que parece un fantasma salido de pesadillas. Para ella, podrían estar en lo cierto."
 nick_goddess_state: "la Diosa que Mueve los Mecanismos del Estado"
 nick_goddess_state_desc: "Controlar la Clase de los Eunucos es tener las llaves del poder del Emperador. Al menos, así era antes de esta era de decadencia."
 nick_key_empress: "la Llave de la Emperatriz"
 nick_key_empress_desc: "Una sombra para aquellos encargados de servir a la esposa del gobernante del mundo, Yuanheng escucha todos los susurros de la corte mortal y actúa en consecuencia."
 nick_soft_faced: "el de Rostro Blando"
 nick_soft_faced_desc: "Jiru una vez tuvo el corazón de un emperador. En la muerte, ha buscado durante mucho tiempo reconstruir algo parecido a eso."
 nick_staffless_martial: "el Artista Marcial sin Bastón"
 nick_staffless_martial_desc: "Para un Eunuco, Anqi es increíblemente letal, se rumorea que fue monje antes de su servicio como Eunuco."
 nick_frustrated_guard: "el Guardia Frustrado"
 nick_frustrated_guard_desc: "Rangneng se convirtió en Eunuco mucho más tarde en la vida. Algo que nunca superó, para poca sorpresa."
 nick_devil_treasurer: "el Tesorero Diablo"
 nick_devil_treasurer_desc: "Para financiar un mundo nocturno entero, uno debe ser bueno con el dinero. Y pocos son tan despiadados como Xinfu."
 nick_silver_keeper: "el Guardián de Plata"
 nick_silver_keeper_desc: "Para un [Glossary('Wu','podgloss.wu')] tan rico como el Candado de Plata, uno debe mantener una vigilancia adecuada de su dinero. Una tarea que Huaizhen ha asumido con entusiasmo."
 nick_golden_sword: "la Espada Dorada"
 nick_golden_sword_desc: "Cuando se trata de guerra, la fuerza mejor equipada a menudo gana. Un credo por el que vive Juyuan."
 nick_ogre_spider: "la Araña Ogro"
 nick_ogre_spider_desc: "Dirigir un imperio mercantil es un trabajo duro. Alguien tiene que asegurarse de que la competencia nunca sea un problema."
 nick_minister_industries: "Ministro de Industrias"
 nick_minister_industries_desc: "Las inversiones son una parte importante de las carteras del Candado de Plata. Chujun es el encargado de gestionarlas."
 nick_songbird_broken: "el Pájaro Cantor de Cristal Roto"
 nick_songbird_broken_desc: "La validación puede ser una droga increíblemente tóxica. Yingmei ya no la forzará más, se la ganará."
 nick_tiger_bandit: "la Bandida Tigre"
 nick_tiger_bandit_desc: "Una asaltante endurecida y asesina de inocentes. Ahora una vigilante, devorando a los malvados."
 nick_critic_blood_flower: "el Crítico de las Flores de Sangre"
 nick_critic_blood_flower_desc: "Para criticar una locura, uno debe entenderla. Por ello, hay una razón por la que los [Glossary('Penangallan','podgloss.penangallan')] detestan a Huitong."
 nick_penitent_ox: "el Buey Penitente"
 nick_penitent_ox_desc: "Algunas cosas son imperdonables. Él lo acepta, y se esfuerza por ser mejor, aunque sepa que nunca podrá compensarlo."
 nick_silken_bear: "el Oso de Seda"
 nick_silken_bear_desc: "Para aquellos que conocen a Benli, no ven más que un hombre grande que parece irradiar alegría. Pero para aquellos que conocen su pasado, se estremecen y temen su nombre."
 nick_prophet_mahavidya: "Profeta de la Mahavidya"
 nick_prophet_mahavidya_desc: "Los contemporáneos de Shodashi se atreverían a disminuir la salvación que la Mahadevi les ha concedido, reclamando su esencia divina como algo que ya tenían cuando se les fue dada. Ella no lo tolerará."
 nick_storm_crowned: "el Coronado por la Tormenta"
 nick_storm_crowned_desc: "Un estudiante de la guerra que se apartó del camino del maestro. Pero uno demasiado importante como la última línea de defensa contra el azote de los herejes y los demonios de la ilusión."
 nick_gold_crowned: "el Coronado de Oro"
 nick_gold_crowned_desc: "Para uno tan poderoso como el Coronado de Oro, pocos sospechan que sus fortalezas residen en la administración."
 nick_paper_crowned: "el Coronado de Papel"
 nick_paper_crowned_desc: "China ha sido durante mucho tiempo un lugar de innovación y brillantez, una fuente inagotable que el Hermano Erudito busca para encontrar la salvación."
 nick_bonfire_crowned: "el Coronado de la Hoguera"
 nick_bonfire_crowned_desc: "Un temperamento lo suficientemente feroz como para quemar a nuevos estudiantes hasta convertirlos en cenizas, el Hermano Chen de Cabello Rojo es temido. Pero su llama lo consumirá incluso a él?"
 nick_cloud_crowned: "el Coronado de la Nube"
 nick_cloud_crowned_desc: "Mientras todos sus hermanos se perdían en asuntos mortales, Yong anhelaba los cielos sobre todos ellos. ¿Qué altura alcanzaría?"
 nick_rainbow_west: "Arcoíris Occidental"
 nick_rainbow_west_desc: "Una forma perfeccionada del Arcoíris Risueño se eleva en Occidente. Sin embargo, muchos temen la llegada de una nube sangrienta."
 nick_emerald_queen: "la Reina Esmeralda"
 nick_emerald_queen_desc: "¿Por qué ser una suplicante en el Cielo cuando puedes ser una reina aquí en su lugar?"
 nick_young_rainbow: "Arcoíris Joven"
 nick_young_rainbow_desc: "Pequeño y modesto pero creciendo para convertirse en su forma perfecta."
 nick_self_serving_god: "Diosete Ególatra"
 nick_self_serving_god_desc: "Dicen que eres un dios. Bueno, ¿quién eres tú para contradecirlos?"
 nick_queen_of_moths: "la Reina de las Polillas"
 nick_queen_of_moths_desc: "No importa cuán grande sea el animal, suficientes insectos pueden derribar incluso a la presa más grande. Yewubdar enseña lo mismo sobre los hombres y los tiranos respectivamente, y vive según esos ideales."
 nick_wasp_king: "el Rey Avispa"
 nick_wasp_king_desc: "Detrás de todo revolucionario exitoso hay alguien que entiende las artes sutiles del control. La Mombasa vampírica tiene un Señor de las Avispas que la protege."
 nick_scarab_prince: "el Príncipe Escarabajo"
 nick_scarab_prince_desc: "Noble en porte y candor, a pesar de aquellos que menosprecian su sangre, nadie puede negar que Sagada se conduce como un rey."
 nick_termite_merchant: "el Mercader Termita"
 nick_termite_merchant_desc: "Los patrocinadores adinerados pueden hacer prosperar una ciudad mortal. Si la moneda se limpia adecuadamente, incluso los muertos pueden hacer prosperar una ciudad."
 nick_ant_general: "el General Hormiga"
 nick_ant_general_desc: "El mundo nocturno tiene muchas amenazas, y el Dominio de Hierro debe mantenerse firme contra ellas. Y para liderarlos está un general que demuestra que incluso las bestias poderosas pueden ser abrumadas por un conjunto cohesionado."
 nick_locust_whisperer: "el Susurrador de Langostas"
 nick_locust_whisperer_desc: "Equilibrar los intereses de una corte cosmopolita es un juego peligroso. Faraji no tuvo más remedio que ser bueno en ello."
 nick_dragonfly_mystic: "el Místico Libélula"
 nick_dragonfly_mystic_desc: "Caminar como lo hizo el Viejo es un camino a menudo lleno de pruebas y confusión. Rehema está ahí para ayudar a guiar a aquellos que lo recorrerían."
 nick_mantis_warrior: "la Guerrera Mantis"
 nick_mantis_warrior_desc: "Para un linaje que se preocupa tanto por la prosperidad, uno se preguntaría por qué abrazarían a una Pirata. Asha insiste en que es así de buena."
 nick_skullcracker_sage: "el Sabio Rompecráneos"
 nick_skullcracker_sage_desc: "Muchos pueden ver la sabiduría en las enseñanzas de Samira. Pero ella está más que dispuesta a machacarla en sus cabezas."
 nick_slayer_of_lies: "la Asesina de Mentiras"
 nick_slayer_of_lies_desc: "Neferusekhmet perdió a su sire por su llamada 'familia'. No tolerará que destruyan nada más tan querido para ella."
 nick_hand_of_iron: "Mano de Hierro"
 nick_hand_of_iron_desc: "Un dominio necesita un guardián que lo proteja. La Diarquía siempre ha buscado así a sus manos de hierro."
 nick_purveyor_of_delights: "Proveedor de Delicias"
 nick_purveyor_of_delights_desc: "Mombasa tiene muchas maravillas como capital comercial. Eiroatounnlki está feliz de probarlas todas."
 nick_junior_storyteller: "Joven Narrador"
 nick_junior_storyteller_desc: "Uno puede compensar la falta de experiencia con entusiasmo. Bueno, al menos puede intentarlo."
 nick_runaway: "la Fugitiva"
 nick_runaway_desc: "Tsunda estaba ansioso por convertir a Shawata en un monstruo. Shawata tomó el asunto en sus propias manos."
 nick_slayer_of_beasts: "el Asesino de Bestias"
 nick_slayer_of_beasts_desc: "Sa'ad tiene muchas maravillosas pieles de león y hiena, que parecen demasiado grandes para leones mundanos. Todo lo que hace es reírse ante la observación."
 nick_savant_of_whispers: "Sabio de los Susurros"
 nick_savant_of_whispers_desc: "Muchos conspirarían contra la causa del Dominio de Hierro. Pero aquellos que susurran sobre ello tienden a no durar mucho."
 nick_underworld_shadow: "la Sombra del Inframundo"
 nick_underworld_shadow_desc: "En una ciudad tan bulliciosa como Mombasa, es normal que las cosas pasen desapercibidas. Sería una lástima que se perdieran."
 nick_shunned_ghostwalker: "la Caminante de Fantasmas Rechazada"
 nick_shunned_ghostwalker_desc: "Muchos Laibon tolerarían a un Nigromante en sus ciudades. Chidimma está perfectamente dispuesta a cumplir con su acuerdo actual de aislamiento."
 nick_purger_of_invaders: "la Purgadora de Invasores"
 nick_purger_of_invaders_desc: "Varias expediciones Tremere han intentado llegar a Mombasa. Kedafu se ha asegurado de que ninguna regrese."
 nick_hermit: "el Ermitaño"
 nick_hermit_desc: "Kakaw es una anomalía en Mombasa, con una forma extrañamente elevada de 'celeridad'. Al menos, la ciudad respeta su privacidad."
 nick_tithe_drawer: "el Recaudador del Diezmo"
 nick_tithe_drawer_desc: "Uno debe respetar al Príncipe de un Dominio con un Regalo. Nwokike, por supuesto, está feliz de aceptar una compensación por tal servicio."
 nick_mask_made_man: "el Hombre Hecho de Máscaras"
 nick_mask_made_man_desc: "Cuando uno desempeña un papel durante tanto tiempo, ¿cuándo se convierte en él?"
 nick_ebony_envoy: "la Enviada de Ébano"
 nick_ebony_envoy_desc: "A medida que el Islam se extiende por África, también los Ashirra se interesan en la región. Y ante el poderoso Príncipe de Mombasa, Fadwa está ansiosa por ver si los vástagos nativos pueden ser convencidos por la Palabra del Profeta."
 nick_hand_of_hidden_trade: "la Mano del Comercio Oculto"
 nick_hand_of_hidden_trade_desc: "Zhenga trabaja diligentemente para extender la influencia de Set a través de Mombasa. Sutekhnedjmet es sus manos y brazos en este inframundo que busca construir."
 nick_snake_harlot: "la Ramera Serpiente"
 nick_snake_harlot_desc: "La palabra de Set vive en la Bima. Neferusutekh está ansiosa por mostrarles las liberaciones y esplendores que puede conllevar."
 nick_snake_brute: "el Bruto Serpiente"
 nick_snake_brute_desc: "La palabra de Set vive en la Bima. Sutekhhotep está feliz de mostrarles la locura de negarlos."
 nick_serpents_relay: "el Relevo de la Serpiente"
 nick_serpents_relay_desc: "Cuando Zhenga partió hacia Mombasa, todavía debía varias obligaciones al Clan. Nefertari fue elegida para cumplirlas, para probar en qué podían convertirse los Bima."
 nick_volcano_rage: "el Volcán de Ira"
 nick_volcano_rage_desc: "Para que una fe se afiance, debe tener personas que la protejan. El primer discípulo de las Caras de la Diosa ha sido ese escudo empapado en sangre."
 nick_redeemed_warlord: "Señor de la Guerra Redimido"
 nick_redeemed_warlord_desc: "La ambición y la crueldad fueron su perdición. Pero podrían ser exactamente lo que la Corte de la Tortuga Negra necesita ahora para sobrevivir."
 nick_tracker_tortoise: "Rastreador de la Tortuga"
 nick_tracker_tortoise_desc: "Las habilidades de rastreo de Sagezhi fueron la causa de su muerte, pero también podrían ser la fortaleza de su venganza."
 nick_escape_artist: "Artista del Escape"
 nick_escape_artist_desc: "El único fugitivo de las Cadenas con Púas es un hombre tranquilo y tímido, pero un amigo devoto de la causa de los Jinetes de la Hoja de Plata."
 nick_furious_vanguard: "Vanguardia Furiosa"
 nick_furious_vanguard_desc: "Mientras [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] permanezca, él tiene un propósito. Sin embargo, lo que sucede después..."
 nick_steppe_teacher: "Maestra de la Estepa"
 nick_steppe_teacher_desc: "Minggan pudo haberse convertido en una guerrera de la resistencia a caballo, pero sus libros nunca están lejos de su lado."
 nick_drifting_assistant: "Asistente Errante"
 nick_drifting_assistant_desc: "Cuando el único hogar que conoces se está desmoronando, ¿qué se supone que debes hacer?"
 nick_divine_conman: "Estafador Divino"
 nick_divine_conman_desc: "¡La mayor estafa de los tiempos está por comenzar!"
 nick_loyal_outsider: "Forastero Leal"
 nick_loyal_outsider_desc: "Sin importar los susurros y las miradas de reojo, Tooril luchará por los [Glossary('Anda','podgloss.anda')] con todas sus fuerzas."
 nick_seer_tengri: "Vidente de Tengri"
 nick_seer_tengri_desc: "Kuchuguden espera que Tengri le muestre la señal que, con suerte, salvará a su pueblo."
 nick_steppe_aristocrat: "Aristócrata de la Estepa"
 nick_steppe_aristocrat_desc: "Algunas cosas nunca cambian, ni siquiera bajo el cielo interminable de las estepas."
 nick_unknowing_remainder: "Resto Desconocedor"
 nick_unknowing_remainder_desc: "La existencia de Ibakha es muy preciosa para el monstruo del Gobi, incluso más de lo que ella cree."
 nick_thunder_gods_incarnation: "Encarnación del Dios del Trueno"
 nick_thunder_gods_incarnation_desc: "La lluvia tamborilea en la tierra, su aliento se une al rugido del trueno. ¿Quién se atreve a llamarlo hombre?"
 nick_ink_and_flame: "Tinta y Llama"
 nick_ink_and_flame_desc: "Este iconoclasta bebe como un bandido y predica como un santo."
 nick_face_revolution: "el Rostro de la Revolución"
 nick_face_revolution_desc: "Equilibrar independencia y poder es un equilibrio delicado. Con astucia y voluntad inflexible se pueden mantener ambos."
 nick_darkwater_trader: "el Comerciante de Agua Oscura"
 nick_darkwater_trader_desc: "Se debe lograr un equilibrio precario para navegar los mares del mundo nocturno. Si Ong no fuera capaz de navegarlos, nunca habría sido abrazada."
 nick_content_administrator: "Administrador Satisfecho"
 nick_content_administrator_desc: "Simplemente hacer tu trabajo con la suficiente competencia para satisfacer a la gente pero no lo suficiente para amenazarla es la clave para una larga vida."
 nick_bloody_warlord: "Señor de la Guerra Sangriento"
 nick_bloody_warlord_desc: "Si uno solo prospera en la guerra, tiene que asegurarse de que nunca termine."
 nick_burgeoning_legend: "Leyenda Floreciente"
 nick_burgeoning_legend_desc: "Quyen ha conocido a algunas de las leyendas de su infancia. Cree que puede alcanzar su nivel."
 nick_cherryfire: "Fuego de Cerezo"
 nick_cherryfire_desc: "Una vez que este árbol florece, nunca dejará de arder con ira."
 nick_still_water_scribe: "Escriba de Agua Quieta"
 nick_still_water_scribe_desc: "Debajo de una superficie tranquila, reside el peso de innumerables historias."
 nick_second_chance: "la Segunda Oportunidad"
 nick_second_chance_desc: "Wang Kyu casi alcanzó la cima de Corea en su vida. No desperdiciará esta segunda oportunidad para hacerlo."
 nick_midnight_provocateur: "Provocador de Medianoche"
 nick_midnight_provocateur_desc: "Todo lujo, toda malicia."
 nick_time_eater: "la Devoradora de Tiempo"
 nick_time_eater_desc: "No tiene pasado mortal al que regresar. Lo ha devorado."
 nick_luminous: "la Luminosa"
 nick_luminous_desc: "Tārā una vez se habría contentado con la paz. Ahora debe jugar el juego de los dioses."
 nick_spirit_queen: "la Reina de los Espíritus"
 nick_spirit_queen_desc: "Las calzadas del mundo detrás pueden confundir a muchos exploradores. Aquellos que pueden dominarlas se convierten en sus gobernantes."
 nick_thousand_times_martyred: "la Mártir de las Mil Veces"
 nick_thousand_times_martyred_desc: "Ser un héroe es algo terrible y doloroso."
 nick_smoke_crone: "la Bruja del Humo"
 nick_smoke_crone_desc: "Cuando uno ve humo, es fácil lamentar el fuego. Pero uno debe apreciar el alimento que esconde."
 nick_gold_silencer: "la Silenciadora Dorada"
 nick_gold_silencer_desc: "El asesinato es una palabra tan fea... ella preferiría que se refirieran a ellos como simplemente silenciados. Permanentemente."
 nick_outcast_sage: "el Sabio Marginado"
 nick_outcast_sage_desc: "Una vez encargado de deshacerse de los cuerpos, es un giro brusco tener que lidiar con ellos cuando se levantan y vuelven a caminar. Y otra cosa pensar que alguien tan bajo como ella sería elegida."
 nick_lotus_of_prosperity: "el Loto de la Prosperidad"
 nick_lotus_of_prosperity_desc: "El Ganges es uno de los lugares más desarrollados del mundo entero. Para beneficiarse de él se necesita a alguien que lo conozca bien."
 nick_violet_coral_sovereign: "Soberano de Coral Violeta"
 nick_violet_coral_sovereign_desc: "El blanco de muchas bromas como el único Ancestro cuyo dominio fue invadido por monstruos, Isagani aún se esfuerza a pesar de las dificultades ante él."
 nick_violet_grandmaster: "Gran Maestro Violeta"
 nick_violet_grandmaster_desc: "Yuan fue enviado a una nueva tierra para formar una Corte completamente nueva en nombre de las Cortes Augustas. Al menos sobre el papel."
 nick_first_divider: "el Primer Divisor"
 nick_first_divider_desc: "¿Cómo se roba el modelado de carne? Kalinaw no siente la necesidad de iluminar sobre su obra maestra."
 nick_foul_blood_slayer: "la Asesina de Sangre Vil"
 nick_foul_blood_slayer_desc: "No importa cuán terribles sean los colmillos, la ballena no teme al calamar gigante. Es por esa razón que Makisig no huye de los Anh."
 nick_mandirigma: "Mandirigma"
 nick_mandirigma_desc: "Enfrentar el desafío y encarar los horrores como Cazador de Demonios quiebra a muchos. Es un testimonio aún mayor de la voluntad de Adhika conocerlos y desafiarlos de todos modos."
 nick_favored_one: "el Favorecido"
 nick_favored_one_desc: "Munsuq, como lugarteniente de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')], está lleno de arrogancia. Lamentablemente, tiene los terribles poderes para respaldarla."
 nick_fickle_devil: "Diablo Voluble"
 nick_fickle_devil_desc: "¿Dónde encontrar más emoción que en el fin del mundo?"
 nick_spiked_avocate: "Defensor de las Cadenas"
 nick_spiked_avocate_desc: "El triunfo de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')] es el mal menor para las eras venideras. Songul salvará a todos asegurando su victoria."
 nick_broken_champion: "Campeón Roto"
 nick_broken_champion_desc: "Qurdjaquz fue una vez la esperanza de la Corte de la Tortuga Negra. Ahora es un recordatorio de su inminente derrota."
 nick_chained_couple: "Pareja Encadenada"
 nick_chained_couple_desc: "No todas las historias heroicas están destinadas a tener un final feliz."
 nick_incompetent_akuma: "Akuma Incompetente"
 nick_incompetent_akuma_desc: "Khanda es un agente muy inútil de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. ¿Pero es eso realmente malo?"
 nick_dedicated_warden: "Guardián Dedicado"
 nick_dedicated_warden_desc: "A veces, para proteger verdaderamente lo que está bien, tienes que mirar hacia otro lado."
 nick_chained_brother: "Hermano Encadenado"
 nick_chained_brother_desc: "A veces, tu Infierno personal te sigue incluso en la Tierra."
 nick_the_eclipse: "el Eclipse"
 nick_the_eclipse_desc: "Incluso la divinidad se quiebra bajo una ambición lo suficientemente afilada."
 nick_fire_of_the_many: "Fuego de los Muchos"
 nick_fire_of_the_many_desc: "Ni palacio, ni derecho divino. Solo la noche, y la decisión de compartirla."
 nick_rose_of_the_seven_sins: "Rosa de los Siete Pecados"
 nick_rose_of_the_seven_sins_desc: "Roma ha resurgido. No como imperio, sino como apetito."
 nick_sculptor_of_thrones: "Escultor de Tronos"
 nick_sculptor_of_thrones_desc: "En Cracovia, un nuevo castillo se alza, su corazón latiendo."
 nick_la_rose_couronnee: "La Rose Couronnée"
 nick_la_rose_couronnee_desc: "Francia florece una vez más, de vuelta en manos de sus legítimos gobernantes."
 nick_avenging_petal: "el Pétalo Vengador"
 nick_avenging_petal_desc: "Un pétalo cayó. Dos dioses sangraron. El jardín florece de nuevo, alimentado por su sangre."
 nick_architect_of_splendor: "Arquitecto del Esplendor"
 nick_architect_of_splendor_desc: "El sueño Toreador, en carne y hueso, y cubierto de terciopelo."
 nick_caretaker_of_dreams: "Cuidador de Sueños"
 nick_caretaker_of_dreams_desc: "Las ciudades pueden arder y los ángeles pueden caer, pero los sueños perduran."
 nick_second_seraph: "el Segundo Serafín"
 nick_second_seraph_desc: "Las ciudades pueden arder y los ángeles pueden caer, pero los sueños perduran."
 nick_western_warden: "el Guardián Occidental"
 nick_western_warden_desc: "Pocas personas odiarían las instituciones mortales más que alguien una vez condenado a lo más bajo."
 nick_godly_shepherd: "el Pastor Piadoso"
 nick_godly_shepherd_desc: "Bailando en la línea entre la Ortodoxia y la Herejía, todas las cosas llegan a aquellos lo suficientemente pacientes y astutos para hacerlas crecer."
 nick_illuminated: "el Iluminado"
 nick_illuminated_desc: "Sakchai es un adoptador temprano de una nueva fe en el Sudeste Asiático, con dudosa lealtad. El tiempo dirá cómo resulta eso."
 nick_golden_ambition: "Ambición Dorada"
 nick_golden_ambition_desc: "Solo un dragón podría detener el ascenso de Tilaka. Menos mal que esos no existen, ¿verdad?"
 nick_striking_gobetween: "Intermediario Llamativo"
 nick_striking_gobetween_desc: "Descendiendo de los Reyes Tigre, Sriteja se asegura de que los Pueblos Feroces y los Diez Mil Guerreros se lleven bien entre sí."
 nick_shrouded_diplomat: "Diplomático Envuelto"
 nick_shrouded_diplomat_desc: "Un aura de misterio esconde una ardiente convicción de evitar que el mal triunfe."
 nick_dragon_savior: "Salvador Dragón"
 nick_dragon_savior_desc: "Un título elegante a veces puede causar más daño que beneficio."
 nick_excitable_center: "Centro Excitable"
 nick_excitable_center_desc: "El centro del [Glossary('Wu','podgloss.wu')] del Velo Dorado es un torbellino de pasiones desenfrenadas."
 nick_oracle_storms: "el Oráculo de las Tormentas"
 nick_oracle_storms_desc: "Las tormentas peligrosas de los océanos significan la muerte para muchos marineros. La capacidad de Shenyou para mitigar esto lo hace invaluable."
 nick_biting_sands: "el General de las Arenas Mordedoras"
 nick_biting_sands_desc: "Suave y dócil, vuelto poderoso y feroz. Incluso la arena puede desollar la carne, si se la incita adecuadamente."
 nick_golden_keeper: "el Guardián Dorado"
 nick_golden_keeper_desc: "Numerosas amenazas yacen en secreto incluso entre las cortes centrales 'seguras'. Lingyuan mantiene la cohesión de las Cortes de Jingxinan."
 nick_yellow_flower: "la Flor Amarilla"
 nick_yellow_flower_desc: "A pesar del celo de su maestra, Hayati no cree que funcione a largo plazo. Encuentra que el éxito es mucho más probable entre aquellos lo suficientemente audaces para tomar su destino en el centro."
 nick_voice_sanity: "Voz de la Cordura"
 nick_voice_sanity_desc: "Todo a su alrededor es caos. Se necesita una compostura uniforme y una voluntad temible para permanecer cuerdo en tiempos como estos."
 nick_flaying_gales: "los Vientos Desolladores"
 nick_flaying_gales_desc: "Despojada de todo, ¿qué puede quedar? Xiaowan se pregunta eso cada día, el vacío avivando un fuego."
 nick_grey_glacier: "el Glaciar Gris"
 nick_grey_glacier_desc: "El Templo de las Tres Montañas supervisa mucho. Se necesita un sabio verdaderamente hábil para dar sentido a todo ello. Por supuesto, él disfruta bastante de los beneficios que conlleva."
 nick_scalpel_vengeance: "el Escalpelo de la Venganza"
 nick_scalpel_vengeance_desc: "Uno creería que los médicos no hacen daño. Zongmin elige en cambio eliminar lo que reduce la maldad en el mundo."
 nick_whip_hurricane: "el Látigo del Huracán"
 nick_whip_hurricane_desc: "Llámalo como quieran, los discípulos de la mantis están tan perdidos como las cortes principales. Yushi se especializa en romperlos."
 nick_knife_breaker: "el Rompecuchillos"
 nick_knife_breaker_desc: "Ve a un dios carbonizado de sangre vil sobre un trono negro, en la cima de una montaña en el oeste en medio de un océano de cuchillos rotos. Aiqin está segura de que este es el [Glossary('Emperador Demonio','podgloss.demonemperor')]... ¿puede siquiera oponerse a él?"
 nick_troubled_noro: "Noro ProbleMÁTICO"
 nick_troubled_noro_desc: "Si Amamikyu tiene planes para su sacerdotisa perdida, no los ha dejado lo suficientemente claros como para tranquilizar la mente de Umikana."
 nick_unlikely_ancestor: "Ancestro Improbable"
 nick_unlikely_ancestor_desc: "A veces, eres el único que puede hacer el trabajo. Sin importar lo poco calificado que puedas estar."
 nick_scarlet_seas: "de los Mares Escarlata"
 nick_scarlet_seas_desc: "Aunque el mundo se lo quitó, los mares ya no mantendrán a Dara abatida."
 nick_crimsom_razor: "la Navaja Carmesí"
 nick_crimsom_razor_desc: "La afilada hoja de Suryani rara vez está limpia. Hay sangre que derramar si el mal ha de ser derrotado."
 nick_golden_appetites: "de los Apetitos Dorados"
 nick_golden_appetites_desc: "Un vínculo compartido en el sabor prohibido podría significar la perdición para toda una región."
 nick_eastern_vanguard: "Vanguardia Oriental"
 nick_eastern_vanguard_desc: "China no será abatida por acciones precipitadas. Las tácticas lentas y metódicas allanarán el camino hacia la victoria de la horda."
 nick_smiling_envoy: "Enviado Sonriente"
 nick_smiling_envoy_desc: "¡Por fin un extranjero que reconoce la superioridad inherente de los $pod_kueijin$! Seguramente nada malo saldrá de la constante humillación que tiene que soportar..."
 nick_simmering_vanguard: "Vanguardia Hirviente"
 nick_simmering_vanguard_desc: "Saige quiere venganza contra el mundo entero, pero estará feliz de conformarse con la destrucción de los $pod_kueijin$ por ahora."
 nick_courtly_bandit: "Bandido Cortesano"
 nick_courtly_bandit_desc: "Cuando se ve arrojado a dos bestias competidoras, el ladrón sabio sabe que solo debe buscarse a sí mismo."
 nick_bjornson: "Bjornson"
 nick_lady_of_the_blackwoods: "Dama de los Bosques Negros"
 nick_of_the_white_hands: "de las Manos Blancas"
 nick_sanguine_daimyo: "el Daimyo Sanguinario"
 nick_gardener: "el Jardinero"
 nick_green_gold: "de Verde y Oro"
 nick_green_gold_desc: "El destino de Seok podría estar lejos de Corea. Después de todo, la ambición no conoce fronteras."
 nick_tired_young_man: "Joven Cansado"
 nick_tired_young_man_desc: "Aunque se verá joven para siempre, la chispa de rebelión y esperanza se ha apagado hace tiempo en el corazón de Gwang Hwa."
 nick_ceremonial_sword: "la Espada Ceremonial"
 nick_ceremonial_sword_desc: "El fastidio de Ji So por ser un guerrero trofeo la está royendo. Pocos saben lo que se encontrará una vez que no quede nada que roer."
 nick_azure_threads: "de los Hilos Azules"
 nick_azure_threads_desc: "Bo Hui ve los hilos políticos dondequiera que mira. Aspira a dominarlos todos."
 nick_jade_father: "el Padre de Jade"
 nick_jade_father_desc: "Alguien tan indispensable como Yeong solo puede vivir una vida larga y próspera. Siempre que su pasado no le alcance."
 nick_ambitious_toppler: "Carroña Ambiciosa"
 nick_ambitious_toppler_desc: "Alguien tiene que asegurarse de que las Cortes se derrumben cuando llegue su momento. Alguien también tiene que gobernar los escombros arruinados después."
 nick_bane_wicked: "Azote de los Malvados"
 nick_bane_wicked_desc: "La [Glossary('Ciudad Malvada','podgloss.wickedcity')] será derribada piedra a piedra hasta que finalmente reine el silencio."
 nick_first_shikome: "Primera de las Shikome"
 nick_first_shikome_desc: "Aún perfectamente única hasta el día de hoy, Kiyoko anticipa el día en que su señor pueda crear más hermanas para ella..."
 nick_soul_kakuri: "Alma de Kakuri"
 nick_soul_kakuri_desc: "El guardián de los muertos Ainu se desvió de su camino. Pero quizás incluso al 'Daimyo de la Oscuridad' se le pueda mostrar una luz guía."
 nick_cold_fire_shikome: "Shikome de Fuego Frío"
 nick_cold_fire_shikome_desc: "Las [Glossary('Shikome','podgloss.shikome')] son criaturas frías, pero se puede ver el temperamento de Ieko arder incluso en su estado extremadamente cargado de Yin."
 nick_scarlet_friend: "Amigo Escarlata"
 nick_scarlet_friend_desc: "Nongkhai tiene una memoria larga. La ayuda proporcionada por la Corte del Fénix Escarlata en su momento de necesidad no será olvidada fácilmente."
 nick_wise_dragon_north: "Sabio Dragón del Norte"
 nick_wise_dragon_north_desc: "Observando los vientos de las dinastías mortales ir y venir, en una tempestad aparentemente interminable de vida y muerte."
 nick_radiant_light: "Luz Radiante"
 nick_radiant_light_desc: "Protegiendo las tierras puras yendo a la ofensiva contra aquellos demasiado cerca para su comodidad, la aparición de [CHARACTER.GetFirstNamePossessiveNoTooltip|U] es anunciada por la llegada del sol."
 nick_dinosaur_king: "el/la Último/a [Select_CString(CHARACTER.IsFemale,'Rey','Reina')] Dinosaurio"
 nick_dinosaur_king_desc: "[CHARACTER.GetSheHe|U] ha estado allí desde el principio. Muchos piensan que [CHARACTER.GetSheHe] estará allí al final."
 nick_great_crocodile: "el Gran Cocodrilo"
 nick_great_crocodile_desc: "El Dios Cocodrilo cayó en la oscuridad por la Hechicería de Sangre de un Antediluviano, ahora su poder trasciende la divinidad. Si el Apocalipsis alguna vez llegara, Sobek sería su heraldo."
 nick_blade_anubis: "Hoja de Anubis"
 nick_blade_anubis_desc: "Desafiar al campeón del Dios de la Muerte sería muy poco sabio."
 nick_one_shadow: "Una Sombra"
 nick_one_shadow_desc: "La llama se extinguió, sin embargo, una sombra permaneció."
 nick_sleeping_dragon: "el Dragón Durmiente"
 nick_sleeping_dragon_desc: "Tácticas antiguas traídas a la vida a través de los sueños del Dragón Durmiente."
 nick_the_boulder: "la Roca"
 nick_the_boulder_desc: "Un río corta la roca no por su poder, sino por su persistencia. A menos que esa roca sea Munekane."
 nick_destroyer_ignorance: "Destructor de la Ignorancia"
 nick_destroyer_ignorance_desc: "La Tribu Celestial no es bien conocida por sus guerreros. En [CHARACTER.GetHerHis] corto mandato, [CHARACTER.GetFirstNameNoTooltip|U] ya ha demostrado que no los necesitan."
 nick_lord_people: "Señor del Pueblo"
 nick_lord_people_desc: "[CHARACTER.GetFirstNameNoTooltip|U] es bastante entusiasta con la verdad de la Tribu Celestial de que los Muertos Hambrientos son dioses. Sin embargo, no está claro qué dios es [CHARACTER.GetSheHe]..."
 nick_fashioner_artistry: "Creador de la Artesanía"
 nick_fashioner_artistry_desc: "La fragua es tanto un lugar de industria como de guerra. El verdadero artesano sabe cómo cantar ambas canciones."
 nick_rakshasha_break: "la Rakshasa que no se Rompió"
 nick_rakshasha_break_desc: "[CHARACTER.GetFirstNameNoTooltip|U] podría haber sido un/a [Select_CString(CHARACTER.IsFemale,'Emperador','Emperatriz')]. [CHARACTER.GetSheHe|U] se atreve a ser un/a [Select_CString(CHARACTER.IsFemale,'Diosa','Dios')]."
 nick_necessary_monster: "el Monstruo Necesario"
 nick_necessary_monster_desc: "[Select_CString(CHARACTER.IsFemale,'Hermana','Hermano')] del Rey de la Ciudad Demonio... al menos eso es lo que [CHARACTER.GetSheHe] afirma."
 nick_little_goddess: "el Pequeño/a [Select_CString(CHARACTER.IsFemale,'Diosa','Dios')]"
 nick_little_goddess_desc: "Tantos Diosetes aspiran a algo grandioso. [CHARACTER.GetFirstNameNoTooltip|U] se contenta con solo proteger lo que siempre ha sido importante para [CHARACTER.GetHerHim]."
 nick_priestess_aravan: "[Select_CString(CHARACTER.IsFemale,'Sacerdotisa','Sacerdote')] de Aravan"
 nick_priestess_aravan_desc: "Los Fénix Ascendentes se comprometen a proteger a sus comunidades. Aunque eso signifique algo diferente para [CHARACTER.GetFirstNameNoTooltip|U], [CHARACTER.GetSheHe] no está menos decidido a seguirlo."
 nick_raksha_queen: "el/la [Select_CString(CHARACTER.IsFemale,'Reina','Rey')] Raksha"
 nick_raksha_queen_desc: "El infierno no tiene furia como la de una [CHARACTER.Custom('WomanManGirlBoy')] despechada. [CHARACTER.GetFirstNameNoTooltip|U] está esperando el momento adecuado para enseñarle eso al hombre que una vez vio como un padre."
 nick_lanka_enigma: "El Enigma de Lanka"
 nick_lanka_enigma_desc: "Las lealtades de [CHARACTER.GetFirstNamePossessiveNoTooltip|U] podrían terminar desempeñando un papel crítico en el destino de la Ciudad Demonio."
 nick_hellist_arrivist: "Advenedizo Infernal"
 nick_hellist_arrivist_desc: "Si tomar atajos fuera un arte, no habría maestro más hábil que [CHARACTER.GetFirstNameNoTooltip|U]."
 nick_boiling_reaper: "el Segador Hirviente"
 nick_boiling_reaper_desc: "El [akuma|E] más importante de Hluh es un monstruo imponente digno de la temible reputación de [CHARACTER.GetHerHis] monstruoso amo."
 nick_feverish_zealot: "Fanático Febril"
 nick_feverish_zealot_desc: "Mientras los Monarcas de la enfermedad luchan entre sí, [CHARACTER.GetFirstNameNoTooltip|U] eligió su bando para no revivir lo que [CHARACTER.GetSheHe] tuvo que soportar."
 nick_despair_eater: "Comedor de Desesperación"
 nick_despair_eater_desc: "Si no hay esperanza a la vista, ¿no es misericordia destrozar cualquier ilusión de un futuro mejor?"
 nick_elder_leyak: "el/la Leyak Anciano/a"
 nick_elder_leyak_desc: "Principal entre los Generales de Rangda, [CHARACTER.GetFirstNameNoTooltip|U] es un/a retorcido/a [Select_CString(CHARACTER.IsFemale,'señora','señor')] del contagio, que convierte el más mínimo resfriado en enfermedades que rompen el cuerpo."
 nick_prince_leyak: "el Príncipe Leyak"
 nick_prince_leyak_desc: "Todo tipo de aflicciones y horrores se pudren y habitan dentro de [CHARACTER.GetFirstNameNoTooltip|U]. Más horriblemente, [CHARACTER.GetSheHe] no parece el tipo..."
 nick_younger_leyak: "el/la Leyak Joven"
 nick_younger_leyak_desc: "Todo tipo de enfermedades pueden fluir de los innumerables orificios del hombre. Rangda ha encargado a su joven que las propague a través de los vectores más 'agradables'."
 nick_madonna_succulent: "[Select_CString(CHARACTER.IsFemale,'Madonna','Procurador')] de Lágrimas Suculentas"
 nick_madonna_succulent_desc: "El Pozo de Sal y Hierro es el hogar del 'mejor' burdel de todos los Reinos. El/la [CHARACTER.Custom('WomanManGirlBoy')] que lo dirige es temido y deseado por igual."
 nick_devil_fish: "el Pez Diablo"
 nick_devil_fish_desc: "Los Mares del Infierno temen al Monstruo de la Madre Perla. Sus mitos no hacen justicia al verdadero crédito del Hambre."
 nick_vanguard_phoenix: "Vanguardia de los Fénix"
 nick_vanguard_phoenix_desc: "No son los soldados los que primero se enfrentan a los enemigos. Son los asesinos."
 nick_scourge_fiends: "Azote de los Demonios"
 nick_scourge_fiends_desc: "Algo vil y retorcido acecha en la sombra, que vuelve a los cuerpos ajenos a sus dueños. Que estos demonios teman el sonido del Trueno."
 nick_godeater: "el Come Dioses"
 nick_godeater_desc: "Si quieren engañarse a sí mismos y pretender ser dioses, que lo hagan. [CHARACTER.GetFirstNameNoTooltip|U] les mostrará que un dioses se deshace tan fácilmente como un cerdo."
 nick_khan_veil: "el Velo del Khan"
 nick_khan_veil_desc: "Érase una vez, Yanling fue la voz silenciosa detrás del nacimiento de una Corte Imperial. Ahora, [CHARACTER.GetSheHe] simplemente desea la tranquilidad de la oscuridad."
 nick_outrun_dawn: "El que Supera al Amanecer"
 nick_outrun_dawn_desc: "Un mensajero que puede superar al día es crucial para aquellos que necesitan actuar en la noche, y [CHARACTER.GetFirstNameNoTooltip|U] dominó eso. Pero a medida que los paradigmas cambian, incluso [CHARACTER.GetSheHe] puede no ser capaz de seguir el ritmo."
 nick_general_rock: "la Roca del General"
 nick_general_rock_desc: "En vida, [CHARACTER.GetFirstNameNoTooltip|U] se casó con uno de los más grandes generales que China haya tenido, y en la muerte lo aplicó contra el Infierno. Sin embargo, a medida que la amenaza cambia, [CHARACTER.GetSheHe] podría ser superado..."
 nick_decorated_champion: "el Campeón Condecorado"
 nick_decorated_champion_desc: "Entre todos los Muertos Hambrientos de la Corte de la Tortuga Negra, [CHARACTER.GetFirstNameNoTooltip|U] se destaca por encima de todos en reconocimientos. Pero ahora la mayor amenaza que [CHARACTER.GetSheHe] haya enfrentado jamás se presenta ante [CHARACTER.GetHerHim]."
 nick_dull_eyed: "el de Ojos Apagados"
 nick_dull_eyed_desc: "Los ojos blancos de [CHARACTER.GetFirstNamePossessiveNoTooltip|U] indican ceguera, y aunque una vez pudo haber sido eso, bien podría ser también el peso del mundo apagando la luz de ellos."
 nick_steppe_burner: "el Quemador de Estepas"
 nick_steppe_burner_desc: "Todo tipo de no-muertos temen al fuego. [CHARACTER.GetFirstNameNoTooltip|U] está más que ansioso por revelarles los fuegos del Infierno."
 nick_undoubted: "el Indudable"
 nick_undoubted_desc: "La duda es la enemiga de la acción y de la gloria. ¿Por qué perder el tiempo pensando en tus acciones cuando puedes simplemente hacerlas?"
 nick_gentle_sheperd: "el Pastor Gentil"
 nick_gentle_sheperd_desc: "Entre los pastores que apoyan la Corte de la Tortuga Negra, [CHARACTER.GetFirstNameNoTooltip|U] es la mano que los guía. Pero su gentil protector puede no tener lo necesario frente a la brutalidad de los Anda."
 nick_hunters_confidant: "el Confidente del Cazador"
 nick_hunters_confidant_desc: "Por todos los horrores que han cometido, los Cazadores Arrepentidos necesitan a alguien con quien desahogarse. [CHARACTER.GetFirstNameNoTooltip|U] es a regañadientes su fuente para depositar sus secretos."
 nick_overlord_doctor: "el Médico del Señor Supremo"
 nick_overlord_doctor_desc: "Una vez Cirujano de un Caballero, recibió un nuevo propósito de un Errante. [CHARACTER.GetFirstNameNoTooltip|U] está ansioso por ver qué nuevos medios de iluminación tiene el Este..."
 nick_sorrowless: "el Sin Pena"
 nick_sorrowless_desc: "En vida, [CHARACTER.GetFirstNameNoTooltip|U] estaba perdido, deambulando y confundido. En la no-muerte, [CHARACTER.GetSheHe] tiene propósito, arte y sangre fluyendo de [CHARACTER.GetHerHim] en igual medida."
 nick_iron_fiend: "el Demonio de Hierro"
 nick_iron_fiend_desc: "Muchos buscadores de la perfección tienden a aferrarse a la carne y el espíritu. [CHARACTER.GetFirstNameNoTooltip|U] se ramificó en medios más esotéricos de perfección."
 nick_yakshi_artisan: "el/la Artesano/a Yakshi"
 nick_yakshi_artisan_desc: "Mientras que la mayoría de los Tzimisce más al oeste tienen sus aterradoras Szlachta, los Yakshi de los Tzimisce indios no son menos terribles. Y la mayoría de ellos remiten al trabajo de [CHARACTER.GetFirstNameNoTooltip|U]."
 nick_shadow_greatness: "la Sombra de la Grandeza"
 nick_shadow_greatness_desc: "Aprendiendo de sus pocos errores, Chandraputra consideró oportuno preparar a un verdadero heredero. [CHARACTER.GetFirstNameNoTooltip|U] superó todas las expectativas."
 nick_sovereign_exchange: "el Soberano del Intercambio"
 nick_sovereign_exchange_desc: "[CHARACTER.GetFirstNameNoTooltip|U] nació en un imperio en su cenit, y en la noche financiaría a otro en una guerra eterna."
 nick_confounding_diplomat: "Diplomático Desconcertante"
 nick_confounding_diplomat_desc: "Cómo sobrevivió [CHARACTER.GetSheHe] es un misterio para todos. Cómo es tan encantador es desconcertante para todos con los que habla."
 nick_boy_commander: "el/la [Select_CString(CHARACTER.IsFemale,'Comandante Niña','Comandante Niño')]"
 nick_boy_commander_desc: "La belleza juvenil de [CHARACTER.GetFirstNamePossessiveNoTooltip|U] nunca escapará de [CHARACTER.GetHerHim]. [CHARACTER.GetSheHe|U] considera que no hay mejor rostro para ocultar [CHARACTER.GetHerHis] verdadera naturaleza."
 nick_sanctum_keeper: "el Guardián del Santuario"
 nick_sanctum_keeper_desc: "Aunque nunca sería su lugar abrazar a [CHARACTER.GetHerHim], Chandraputra nunca negaría [CHARACTER.GetHerHis] valía."
nick_pembuat_raja: "Pembuat Raja"
nick_pembuat_raja_desc: "[CHARACTER.GetFirstNameNoTooltip|U] elevó a un astuto bandido al rango de rey mediante una enseñanza paciente."
nick_nareswari: "Nareswari"
nick_nareswari_desc: "Se profetizó que la [Glossary('Nareswari', 'podgloss.nareswari')] daría a luz a muchos reyes."
nick_kerbau_yang_menyeberang: "Kerbau Yang Menyeberang"
nick_kerbau_yang_menyeberang_desc: "[Glossary('Kerbau Yang Menyeberang', 'podgloss.kerbau_yang_menyeberang')] es un hábil almirante y apto diplomático que sirvió al reino de Majapahit hasta su muerte."
nick_mahapati: "el Mahapati"
nick_mahapati_desc: "El Mahapati es responsable de la muerte de los Grandes Héroes de Majapahit."
nick_pitaloka: "Pitaloka"
nick_pitaloka_desc: "Pitaloka eligió la muerte sobre la deshonra de ser presentada como una simple concubina del rey de Majapahit."
nick_rakryan_mapatih_jirnodhara: "Rakryan Mapatih Jirnodhara"
nick_rakryan_mapatih_jirnodhara_desc: "El restaurador de la ambición de Kertanegara sobre Nusantara."
nick_kinalakian_queen: "la Reina Kinalakian"
nick_kinalakian_queen_desc: "La Reina [Glossary('Kinalakian', 'podgloss.kinalakian')] desafió las expectativas puestas sobre los gobernantes y las mujeres exaltando la definición de una princesa guerrera."
nick_the_unwavering: "el Inquebrantable"
nick_the_unwavering_desc: "[CHARACTER.GetFirstNameNoTooltip|U] es inquebrantable en sus ideales, lo que le permite aceptar que otros puedan tener una comprensión diferente del mundo."
nick_mahaguru: "el Mahaguru"
nick_mahaguru_desc: "El Mahaguru, o maestro supremo, es un gran maestro en [CHARACTER.GetHerHis|l] arte marcial."
nick_sunan_ampel: "Sunan Ampel"
nick_sunan_ampel_desc: "El Honorable Ampel, uno de los [Glossary('Wali Songo', 'podgloss.wally_songo')], es una de las principales fuentes de la difusión del Islam en el archipiélago de Nusantara."
nick_nyai_gede_pinatih: "Nyai Gede Pinatih"
nick_nyai_gede_pinatih_desc: "Nyai Gede Pinatih, la Gran Dama de Gresik, se estableció como la patrona del comercio y la actora principal del desarrollo del comercio en Majapahit."
nick_bendahara_paduka_raja: "Bendahara Paduka Raja"
nick_bendahara_paduka_raja_desc: "El más grande [Glossary('Bendahara', 'podgloss.bendahara')] fue el verdadero poder detrás del trono del Sultanato de Malaca."
nick_bitter_queen: "la Reina Amargada"
nick_bitter_queen_desc: "Juramentada a vengar a su familia calumniada, la reputación de [CHARACTER.GetFirstNamePossessiveNoTooltip|U] la precede, asustando a sus oponentes ya sea en el campo de batalla o en una sala de justicia."
nick_inong_balee: "Inong Balee"
nick_inong_balee_desc: "El/la [Glossary('laksamana', 'podgloss.laksamana')] de un ejército de viudas."
nick_the_great_ethnographer: "El Gran Etnógrafo"
nick_the_great_ethnographer_desc: "[CHARACTER.GetFirstNameNoTooltip|U] ha catalogado los pueblos y lugares de todo el mundo conocido."
nick_bleak_warden: "el Guardián Sombrío"
nick_bleak_warden_desc: "'No temas la noche, querido Señor, pues monstruos mucho más grandes te protegen'."
nick_architectural_purist: "el Purista Arquitectónico"
nick_architectural_purist_desc: "¿Por qué aguar el vino? ¿Por qué diluir la majestad con tonterías? La belleza se puede hacer sin forzar elementos extraños en las obras, como enseña Norinaka."
nick_snow_monkey: "el Mono de Nieve"
nick_snow_monkey_desc: "Para un Uji tan centrado en la tradición, uno pensaría que el campeón es una desgracia. Lo es, pero se ha vuelto experto en sacudirse las acusaciones."
nick_nights_maiden: "la Doncella de la Noche"
nick_nights_maiden_desc: "Desde su nacimiento fue preparada e instruida para ser una agente. Encontró una vocación más elevada como igual."
nick_vengeful_swan: "el Cisne Vengativo"
nick_vengeful_swan_desc: "Esperaba que la venganza reemplazara el dolor. Todo lo que hizo fue hacerle cantar el canto del cisne de una nación."
nick_azure_crane: "la Grulla Azul"
nick_azure_crane_desc: "Nariaki nació de dos mundos. Vivir entre ellos no es diferente."
nick_ashen_seneschal: "el Senescal Ceniciento"
nick_ashen_seneschal_desc: "¿Puede calentarse el corazón de un avaro? El suyo al menos lo hizo."
nick_golden_envoy: "la Enviada Dorada"
nick_golden_envoy_desc: "Una agente enviada a encontrarse con un dragón. Kogoko regresó con una sabiduría mayor que ayudaría a definir su Uji."
nick_herald_of_scorn: "el Heraldo del Desprecio"
nick_herald_of_scorn_desc: "Todos están marcados por la muerte. Todos están definidos por la profanación. ¿Qué son todos ellos sino sus encarnaciones de la madre muerta de la creación?"
nick_daughter_of_fire: "la Hija del Fuego"
nick_daughter_of_fire_desc: "La mayoría consideraría loco a alguien que se prendiera fuego siendo débil a él. Todo lo que necesitan hacer es tener un poco de fe."
nick_civilizing_samurai: "el Samurái Civilizador"
nick_civilizing_samurai_desc: "Tuvo un largo y célebre servicio. Le valió el Infierno. Esto, siente, fue una injusticia."
nick_purifier: "el Purificador"
nick_purifier_desc: "Las aguas están enfermas, en esas profundidades oscuras. Arrastrarlas es limpiarlas."
nick_key_holder: "el Portador de la Llave"
nick_key_holder_desc: "Aunque es tan esclava como los otros Akuma, tiene el placer especial de ejercer el control sobre los pobres pecadores de [Glossary('Kakuri','podgloss.kakuri')]."
nick_ice_fanged_huntress: "la Cazadora de Colmillos de Hielo"
nick_ice_fanged_huntress_desc: "Sus besos nunca han tenido ningún grado de calidez. En la vida, o en la muerte."
nick_warrior_smith: "el Herrero Guerrero"
nick_warrior_smith_desc: "Hacer algo y no usarlo siempre fue una farsa para Akira. Nunca dejaría que sus obras maestras cayeran en las manos equivocadas."
nick_tsuchigumo_slayer: "la Matadora de Tsuchigumo"
nick_tsuchigumo_slayer_desc: "Pocos otros Uji saben por qué caza con una furia tan implacable. Ella sabe mejor que nadie por qué todos deben morir."
nick_protector_of_peace: "Protectora de la Paz"
nick_protector_of_peace_desc: "Cometió un crimen terrible. Para expiarlo, defiende la paz. Sin importar cuántos tengan que morir para hacerlo."
nick_rebellious_swallow: "la Golondrina Rebelde"
nick_rebellious_swallow_desc: "A pesar de ser de sangre noble, la Golondrina parece obsesionada con volar hacia partes desconocidas."
nick_spear_of_the_sun: "la Lanza del Sol"
nick_spear_of_the_sun_desc: "El Ancestro de Tsushima siempre ha sido una posición crítica para la Corte del Dragón Azul. Sería un mal presagio para tal posición tener una agenda."
nick_advocate_of_the_gods: "Abogada de los Dioses"
nick_advocate_of_the_gods_desc: "Un enlace entre los Clanes del Sol y los Pequeños Dioses, asume el papel que nadie más quiere."
nick_hellwatcher: "la Vigilante del Infierno"
nick_hellwatcher_desc: "La mayoría de la gente estaría aterrorizada con un trabajo tan peligroso. Y sin embargo, no puede evitar sentirse atraída por él."
nick_sunset_necromancer: "la Nigromante del Atardecer"
nick_sunset_necromancer_desc: "La muerte siempre la acechó. Ahora busca entenderla por completo."
nick_high_society_devil: "la Diablesa de la Alta Sociedad"
nick_high_society_devil_desc: "Toda su vida nunca pudo disfrutar de su posición. Lo compensará en la muerte."
nick_cleaner: "el Limpiador"
nick_cleaner_desc: "Todos lo quieren como a una madre largamente perdida. En parte porque sabe que es mejor no hacer preguntas sobre la carnicería."
nick_rising_star_kj: "la Estrella Ascendente"
nick_rising_star_kj_desc: "Moroie siempre anheló el escenario. Su sueño ha sido realmente infernal de conseguir."
nick_sullied_dragon: "el Dragón Manchado"
nick_sullied_dragon_desc: "Una fuerza oscura yacía en lo profundo de ellos, rota en la muerte. ¿Qué significa ahora, ser libre?"
nick_true_bone_yacha: "Yacha de Hueso Verdadero"
nick_true_bone_yacha_desc: "Xiao ignora el mundo por su propia cuenta y riesgo. Su discípulo no repetirá el mismo error."
nick_investment_fox: "el Zorro Inversor"
nick_investment_fox_desc: "Los mortales están más que felices de que se financien sus sueños. Solo pide obtener su parte justa a cambio."
nick_fetter_fencer: "el Esgrimista Atado"
nick_fetter_fencer_desc: "Los muertos a menudo tienen sus propias riquezas escondidas. Sería una gran lástima dejarlas desperdiciar."
nick_bone_shaper: "el Modelador de Huesos"
nick_bone_shaper_desc: "Trabajar el material para financiar una orden entera es un asunto complicado. Ella lucha por estar a la altura de esas expectativas."
nick_old_bear: "el Viejo Oso"
nick_old_bear_desc: "¿Qué es un cártel sin su músculo?"
nick_silent_butcher: "el Carnicero Silencioso"
nick_silent_butcher_desc: "Uno pensaría que no decir cosas desquiciadas tranquilizaría a los demás. Pero su silencio solo aumenta el terror."
nick_overseer_of_interiors: "el Supervisor de Interiores"
nick_overseer_of_interiors_desc: "Gestionar los asuntos internos de un grupo como la Sociedad del Hueso Verdadero es un asunto complicado. Tiene trabajo por delante."
nick_ivory_cook: "el Cocinero de Marfil"
nick_ivory_cook_desc: "Mejor nuestros venenos que los suyos', ¿verdad?"
nick_bone_fox: "el Zorro de Hueso"
nick_bone_fox_desc: "Muchos mitos hablan del peligro de los espíritus zorro que se hacen pasar por mujeres hermosas. Resulta que era al revés."
nick_lapdog: "el Perrito Faldero"
nick_lapdog_desc: "Pocos pueden soportar los horrores que rodean a los cultos vampíricos de Mikaboshi. Ciertamente él no fue uno de ellos, y huyó al santuario de su sire."
nick_wicked_citys_nightmare: "la Pesadilla de la Ciudad Malvada"
nick_wicked_citys_nightmare_desc: "Entre muchos de los cultos de Mikaboshi, la mayoría se esfuerza por el mundo de su amo, pero ella actúa como si ya viviera en él, entregándose a cada depravación y horror que pueda imaginar en celebración del mundo por venir."
nick_monsters_eyes: "los Ojos del Monstruo"
nick_monsters_eyes_desc: "Acechando a través de los Refugios de Akane están sus ojos. Unos que nunca parecen dormir."
nick_monsters_hands: "las Manos del Monstruo"
nick_monsters_hands_desc: "Colecciona todo lo que su amo necesita para sus obras. Todo tras una sonrisa extraña."
nick_monsters_meat: "la Carne del Monstruo"
nick_monsters_meat_desc: "En el Refugio de Akane hay un Totai que nunca se separa de su lado cuando duermen, saciando cada deseo que Akane pueda imaginar en sus momentos tranquilos."
nick_monsters_claws: "las Garras del Monstruo"
nick_monsters_claws_desc: "Una muñeca odia estar sola. La Cuarta Muñeca prepara felizmente las partes para la creación de más."
nick_towering_soldier: "el Soldado Imponente"
nick_towering_soldier_desc: "El primero de muchos, el Gargolia de arcilla haría un teatro de violencia."
nick_restored_beauty: "la Belleza Restaurada"
nick_restored_beauty_desc: "Un todo perfecto puede hacerse con partes imperfectas."
nick_wolfbreaker: "el Rompelobos"
nick_wolfbreaker_desc: "Aunque numerosos Hakken han intentado matar al Banpaia, una fuerza siempre está allí antes que su fundador, rompiéndolos en su férreo agarre."
nick_master_of_dolls: "la Maestra de Muñecas"
nick_master_of_dolls_desc: "No necesita ser vista para gobernar. Simplemente necesita tirar de las cuerdas correctas."
nick_forward_general: "General de Avanzada"
nick_forward_general_desc: "Un general severo y adusto no parece estar a la vanguardia del pensamiento innovador. Iwase aún de alguna manera lo hace funcionar."
nick_david_alroy: "David Alroy"
nick_david_alroy_desc: "Un hombre de muchos nombres: David Alroy, Menahem ibn-abi-Da'ud Suleiman ibn al-Ruji, David Alrui, Ibn ar-Ruhi, David El-David, Menahem ben Shlomo, Menachem ben Solomon ben Ruji, Ibn Ruji, Ibn al-Ruji, Manahim ibn Sulaiman al-Ruji, Abu Da'ud, Portador de la Estrella de David, David Alroy'i, Manahim ibn Sulayman, Da'ud al-Ruhi, David Al Roy'i, David AlDavid, Menachem Al-Ruji, Menachem ben Sulayman, Menahem ben Solomon ben Duji, David Alro'i, Dawid al-Ro'i"
nick_raijin: "Raijin"
nick_raijin_desc: "Primero dominó la Espada. Luego dominó las Tormentas."
nick_raitaro: "Raitarō"
nick_raitaro_desc: "El hijo del Trueno lleva las esperanzas de los Inoue y los Hakken. Muchas responsabilidades han recaído sobre Tsunehiro, sin embargo, el hombre lobo permanece impertérrito."
nick_broken_blade: "la Hoja Rota"
nick_broken_blade_desc: "Con un cuerpo tan débil, Arishage no puede esperar perfeccionar su espada. Así que ha elegido perfeccionar su mente."
nick_eager_blade: "la Hoja Ansiosa"
nick_eager_blade_desc: "Siendo la hija más pequeña, Yasuko es constantemente mimada, protegida y consentida por su familia. Pero la niña ha crecido, y está ansiosa por luchar junto a sus hermanos."
nick_western_wind: "el Viento Occidental"
nick_western_wind_desc: "Yánqìng lee los Vientos Occidentales en busca de alguna señal de los bárbaros que llenan esas tierras."
nick_dragon_judge: "Juez Dragón"
nick_dragon_judge_desc: "Tanto los culpables como los inocentes temen sus juicios. Duro pero justo, Rénshí ha traído prosperidad a su tierra de manera rápida y eficiente."
nick_rain_dragon: "el Dragón de la Lluvia"
nick_rain_dragon_desc: "Se puede vislumbrar al Dragón de la Lluvia bailando entre las nubes en las noches lluviosas."
nick_noble_cyclone: "el Ciclón Noble"
nick_noble_cyclone_desc: "El Ciclón devastará a todos aquellos que quieran dañar a sus pupilos."
nick_devil_tiger: "el Tigre Diablo"
nick_devil_tiger_desc: "Muchos temen los bosques de Shannan. Él es la razón."
nick_tiger_lord: "Señor Tigre"
nick_tiger_lord_desc: "La gran y noble figura de Shuzhe inspira tanto admiración como temor en quienes lo contemplan."
nick_returned_wolf: "el Lobo Retornado"
nick_returned_wolf_desc: "La redención no se puede encontrar escondiéndose al otro lado del océano. El honor exige que hagamos nuestro deber, a pesar de nuestros fracasos."
nick_singing_moon: "la Luna Cantora"
nick_singing_moon_desc: "Las noches están llenas de sus canciones sombrías sobre el hogar de los Hakken, y su fracaso en la Guerra de la Vergüenza. Ahora quizás, sus canciones puedan ser de esperanza."
nick_feral_samurai: "el Samurái Salvaje"
nick_feral_samurai_desc: "A Sanemori no le importa la esgrima elegante, en cambio abruma a sus enemigos con una ráfaga de poderosos golpes. Su camino ha sido extremadamente efectivo hasta ahora."
nick_cackling_darkness: "la Oscuridad Carcajeante"
nick_cackling_darkness_desc: "Nadie sabe qué pasó realmente por la mente del Lupus, o cómo se convirtió en todo lo que los Hakken no son. Su carcajada maníaca se puede escuchar justo antes de que hunda su espada en tu espalda."
nick_soaring_moonblade_dead: "Hoja Lunar Voladora"
nick_soaring_moonblade_dead_desc: "La esgrima de Naokage era similar a una danza hipnotizante, que sus enemigos no podían igualar. Pero a pesar de toda su habilidad, no pudo bailar contra su propio hijo, ni siquiera para salvarse."
nick_deprived_moon: "la Luna Privada"
nick_deprived_moon_desc: "Cuando su hermano más hábil fue nombrado heredero del clan, Toshihiro voló en una furia y mató a su padre. Huyó de su hogar, solo para caer más profundamente en la oscuridad. Ahora está verdaderamente perdido."
nick_soaring_moonblade: "Hoja Lunar Voladora"
nick_soaring_moonblade_desc: "Heredó las habilidades y la espada de su padre, sin embargo, su propia danza está llena de tristeza."
nick_wolf_lord: "Señor Lobo"
nick_wolf_lord_desc: "Habiéndose negado a tomar pareja para sí mismo, en su lugar ha criado a los lobos como suyos. Los Lobos seguirán a su señor hasta cualquier final."
nick_the_outsider: "la Forastera"
nick_the_outsider_desc: "Alejada de su mentor y de los Clanes del Sol, Shigeno abraza este exilio y camina con orgullo por su propio camino."
nick_lords_mistress: "la Amante de los Señores"
nick_lords_mistress_desc: "Poder acceder a las cámaras del poder puede ser un lugar poderoso para influir en el mundo. Ruri es una maestra en hacer eso literalmente."
nick_steadfast_minister: "el Ministro Firme"
nick_steadfast_minister_desc: "Los valores nobles están muy bien. Otra cosa es mantenerlos realmente."
nick_lord_crocodiles: "Señor de los Cocodrilos"
nick_lord_crocodiles_desc: "Los cocodrilos lo obedecen no por parentesco, sino por miedo."
nick_crocodile_hunter: "el Cazador de Cocodrilos"
nick_crocodile_hunter_desc: "Ha estado cazando cocodrilos la mayor parte de su vida. Queda por ver si tendrá éxito en cazar a un #TOOLTIP:GAME_TRAIT,mokole,[GetNullCharacter] #! Hombrocodrilo#!."
nick_determined_tysiatskii: "Tysiatskii Determinado"
nick_determined_tysiatskii_desc: "Jovirdas encontró el Camino de los Reyes por sí mismo. Ahora solo tiene que caminar hacia adelante."
nick_falcontamer: "Domador de Halcones"
nick_falcontamer_desc: "El séptimo de los Shemsu-Heru es severo y diligente. El modelo de competencia silenciosa que Horus busca en los reclutas potenciales."
nick_shoulder_devil: "Diablo del Hombro"
nick_sheperd_power: "Pastor del Poder"
nick_sheperd_power_desc: "En vida, solo podía ver el sufrimiento de los demás. En la muerte, espera que el interés propio de los campeones caídos aún ayude a la humanidad."
nick_chaser_innocence: "Perseguidor de la Inocencia Perdida"
nick_chaser_innocence_desc: "Jilan busca el pasado que nunca tuvo, y huye del futuro del que no puede escapar."
nick_goddess_prince: "el Príncipe de la Diosa"
nick_goddess_prince_desc: "El único hombre digno de la atención de la mujer más bella del mundo paga este honor siendo completamente devoto a ella."
nick_of_the_veela: "de la Veela"
nick_of_the_veela_desc: "También a menudo llamada 'la lanzadora de jabalinas', Lukina aparece efectivamente como un demonio de la guerra para cualquiera que amenace a su señor Ioan."
nick_diligent_hedonist: "Hedonista Diligente"
nick_diligent_hedonist_desc: "Lidiar con los detalles de gobernar un dominio mientras satisface sus ansias nunca ha sido un problema para Ladislav."
nick_lost_seeker: "Buscadora Perdida"
nick_lost_seeker_desc: "La búsqueda de Golconda por parte de Vanth aún no ha dado muchos frutos, dejándole opciones cada vez más limitadas a medida que pasa el tiempo."
nick_lilin_hierophant: "Hierofante Lilin"
nick_lilin_hierophant_desc: "Solo a través del dolor se puede adquirir poder. El dolor es el mejor maestro, la prueba con la recompensa suprema."
nick_rebel_methuselah: "Matusalén Rebelde"
nick_rebel_methuselah_desc: "El patrón de muchos rebeldes es más viejo de lo que parece, pero la rebelión es todo lo que siempre ha conocido."
nick_the_cataboligne: "el Cataboligne"
nick_the_cataboligne_desc: "Un legionario de demonios más poderosos, Barliagus es sin embargo especialmente hábil en manipular agentes mortales a pesar de su desprecio por ellos."
nick_mandragora: "la Mandrágora"
nick_mandragora_desc: "Astuto pero sorprendentemente leal a su misterioso amo demoníaco, la 'sabiduría' de Grantel corrompe lentamente a cualquiera que busca su 'ayuda'."
nick_leeches_succubus: "la Súcubo de las Sangrientas"
nick_leeches_succubus_desc: "Especializándose en seducir vampiros, Lucricia pronto aprendió a usar el vínculo de sangre contra ellos, convirtiendo a los depredadores en su presa."
nick_grand_vizier_infernal_realms: "Gran Visir de los Reinos Infernales"
nick_grand_vizier_infernal_realms_desc: "Solo un paso más para el ascenso de Nubarus como archidemonio. Caminará ese paso con cuidado y determinación, como siempre hace."
nick_injurer_cats: "Lesionador de Gatos"
nick_injurer_cats_desc: "¡Incluso un demonio debería tener límites!"
nick_the_riven: "el Destrozado"
nick_the_riven_desc: "La amistad se convierte en conflicto dondequiera que va el Destrozado, con asesinatos y caos que pronto le siguen."
nick_brain_taster: "Degustador de Cerebros"
nick_brain_taster_desc: "¿Cerebros? ¡Cerebros!"
nick_guards_the_path: "Guarda el Camino"
nick_guards_the_path_desc: "Un buen compañero para tener en el camino, Psammtik es una fuente de datos históricos curiosos."
nick_first_outrider: "el Primer Jinete"
nick_first_outrider_desc: "Mientras la gente de las Estepas a menudo cabalgaban más allá del alcance del Infierno de Cadenas con Púas, todos los arrastrados a él temen al Escita que los arrastró allí."
nick_the_bagger: "el Empaquetador"
nick_the_bagger_desc: "Muy raramente alguno de los pecadores deseados por Dokhor está dispuesto a morir para entrar en el Infierno de Cadenas con Púas. Una hija olvidada de los Roxolanos facilita ese tránsito."
nick_the_tanner: "el Curtidor"
nick_the_tanner_desc: "Los Tigres Diablo son a menudo muy valorados por su habilidad para luchar contra Akuma. Pero nadie espera luchar fuego con fuego con fuego."
nick_the_apprentice: "el Aprendiz"
nick_the_apprentice_desc: "Aunque exteriormente los otros Jinetes son más temidos, los Ancestros temen la cara sonriente y silenciosa que aparentemente los deja ir."
nick_wolfskinner: "el Desollador de Lobos"
nick_wolfskinner_desc: "Muchos afirman ser pueblos de la estepa. Tugmandakh está decidido a ver si están a la altura."
nick_champion_sky: "Campeón del Cielo"
nick_champion_sky_desc: "Las tradiciones son tradiciones por una razón. Desviarse de ellas sería una locura. No importa lo loco que se haya vuelto el mundo."
nick_ocean_follower: "Seguidor del Océano"
nick_ocean_follower_desc: "Kumud encontró a alguien que entendía el mar más que él. Ha jurado seguir su estela."
nick_the_hellhound: "el Sabueso Infernal"
nick_the_hellhound_desc: "De las profundidades más oscuras surgió un cazador. Y los Infiernos están pisándole los talones."
nick_the_strangler_bastards: "el Estrangulador de Bastardos"
nick_the_strangler_bastards_desc: "Que los Dhampyr anden sueltos atrae la atención de los Cazadores de Demonios y los Cambiantes. Mejor podar el árbol de ramas errantes."
nick_shadowed_star: "la Estrella Sombría"
nick_shadowed_star_desc: "Podría haber sido grande. Pero en cambio, permanece para siempre ensombrecido."
nick_river_mother: "la Madre Río"
nick_river_mother_desc: "A través de las Estepas, algunos susurran sobre una hermosa mujer en los ríos que sale y funda tribus. La Corte de la Tortuga Negra sabe entonces que Tatahaui andaba de nuevo."
nick_iron_pillar: "el Pilar de Hierro"
nick_iron_pillar_desc: "Batbold no se mueve por ningún hombre. ¿Pero pueden moverlo los Demonios?"
nick_blinding_star: "la Estrella Cegadora"
nick_blinding_star_desc: "Muchos desean que la Estrella fuera un Dragón Azote. Pero esa estrella es igual de buena atrayendo a los [akuma|E] a su perdición."
nick_dusk_ward: "el Guardián del Crepúsculo"
nick_dusk_ward_desc: "Cuidar de los soldados es un trabajo tedioso. Necesita una mano firme."
nick_star_guide: "la Guía Estelar"
nick_star_guide_desc: "Guiar a toda una corte augusta es un asunto complicado. Pero es un jardín que vale la pena cultivar."
nick_kumo_hawk: "el Halcón Kumo"
nick_kumo_hawk_desc: "Cuidado con la Avispa que escapa de la telaraña. Pocos odian a la araña más que su antigua presa."
nick_tundra_wolf: "el Lobo de la Tundra"
nick_tundra_wolf_desc: "La Corte de la Tortuga Negra tiene un legado de violencia con los Fera. Ese puente aún puede ser reparado."
nick_sandwyrm: "el Sandwyrm"
nick_sandwyrm_desc: "Desde el Desierto de Gobi hasta el Infierno de Ser Desollado Vivo, Khongortsetseg siempre se adaptará y prosperará. Lo que queda de su orgullo no exige nada menos."
nick_silver_reaver: "el Saqueador Plateado"
nick_silver_reaver_desc: "Habían olvidado lo que es sentir miedo. Aisūltan lo grabará en su psique."
nick_horsebreaker: "el Rompecaballos"
nick_horsebreaker_desc: "Ay de la columna vertebral de cualquier caballo lo suficientemente desafortunado como para ser montado por Ulugbek. Y ay de cualquiera que encuentre en el campo."
nick_silent_fox: "el Zorro Silencioso"
nick_silent_fox_desc: "Aunque el lobo es la amenaza más fácil de reconocer, detrás de la sonrisa del zorro no hay más que dientes."
nick_hebei_outcast: "el Marginado de Hebei"
nick_hebei_outcast_desc: "Pocos son expulsados de un Wu. Sækæ nunca olvidará el insulto."
nick_healing_flame: "la Llama Sanadora"
nick_healing_flame_desc: "Buscar los secretos del desierto es siempre un asunto peligroso. Sin alguien que te repare, tales expediciones podrían ser las últimas."
nick_fire_sage: "el Sabio del Fuego"
nick_fire_sage_desc: "Muchos lugares de poder yacen bajo el Gran Desierto. Que se conviertan en un infierno que destruya a sus enemigos."
nick_sand_scorpion: "el Escorpión de Arena"
nick_sand_scorpion_desc: "Los desiertos son lugares peligrosos. Los accidentes ocurren allí todo el tiempo."
nick_scouring_flame: "la Llama Abrasadora"
nick_scouring_flame_desc: "Se necesita un tipo especial de hombre para tener la paciencia de encontrar tesoros en una extensión interminable de arena."
nick_the_grim_courser: "el Corcel Adusto"
nick_the_grim_courser_desc: "Mantener la justicia a través de las estepas no es una tarea fácil. Así que Isiha los cazará a través de toda su extensión para asegurarse de que no pierda su significado."
nick_the_battering_charger: "el Corcel Aporreador"
nick_the_battering_charger_desc: "Las murallas han retrasado durante mucho tiempo a los más grandes imperios de la estepa de sus derechos de conquista. Dumu, por lo tanto, se dedicó a derribarlas."
nick_the_lightning_strider: "el Caminante del Rayo"
nick_the_lightning_strider_desc: "Golpea fuerte, golpea rápido. Nunca dejes que sepan lo que les golpeó."
nick_the_thunder_mare: "la Yegua del Trueno"
nick_the_thunder_mare_desc: "Una guerra interminable necesita soldados interminables. Así que que haya una fuente interminable."
nick_the_golden_shewolf: "la Loba Dorada"
nick_the_golden_shewolf_desc: "Protegerá a sus cachorros hasta el amargo final, y más allá."
nick_broken_guardian: "Guardián Roto"
nick_broken_guardian_desc: "Algunos susurrarán que mató al amado vástago a propósito. Es una mentira, pero la escuchará hasta el fin de sus días."
nick_vigilant_wolf: "Lobo Vigilante"
nick_vigilant_wolf_desc: "El muchacho insolente murió hace mucho tiempo. Una guerra eterna necesita un comandante cauteloso."
nick_black_crow_east: "Cuervo Negro del Este"
nick_black_crow_east_desc: "Odio y rencor dados vuelo."
nick_the_young_crow: "el Joven Cuervo"
nick_the_young_crow_desc: "Chixin puede ser un cabeza caliente demasiado ambicioso para su propio bien, pero nadie puede dudar de su lealtad."
nick_ever_sweet: "Siempre Dulce"
nick_ever_sweet_desc: "El guante de hierro del Erk debe estar envuelto en seda para ser más atractivo para los demás."
nick_goldenhand: "Manos de Oro"
nick_goldenhand_desc: "Bayan espera olvidar el vacío que siente comiendo, bebiendo y riendo."
nick_gentle_moon: "Luna Gentil"
nick_gentle_moon_desc: "Modesta, justa y amable, el trágico final de Ay-Toldı dejó un silencio agonizante donde deberían haber estado las risas de un gobernante perfecto."
nick_black_heart: "Corazón Negro"
nick_black_heart_desc: "Nada puede desviar ese corazón oscuro. Excepto el oro, claro."
nick_the_smiling_viper: "la Víbora Sonriente"
nick_the_smiling_viper_desc: "Su sonrisa nunca parece llegar a sus ojos."
nick_beauty_millennium: "Belleza de un Milenio"
nick_beauty_millennium_desc: "Han pasado siglos, sin embargo, ella sigue siendo la más impecable de la noche."
nick_death_blue: "Azul Muerte"
nick_death_blue_desc: "Una mano ofrece la pálida y hermosa gracia de una diosa. La otra ofrece el frío escalofrío azul de Niflheim."
nick_queen_for_a_night: "Reina por una Noche"
nick_queen_for_a_night_desc: "'Creció entre los Godos una doncella nobilísima. Nadie en todas las tierras podía ser más bella. Se llamaba Hildiko — creció hasta convertirse en una mujer hermosa. Por ella muchos caballeros iban a perder la vida. Causó la muerte de tres reyes de una nación, brillante dama, antes de morir', el Mayor Premio de los Jinetes, que mató al Rey de los Hunos solo con su belleza."
nick_twice_devil: "el Dos Veces Diablo"
nick_twice_devil_desc: "¿Cuántas veces puedes ser condenado? ¿Cuánto debes expiar por el pecado de nacer?"
nick_bulgar_bride: "la Novia Búlgara"
nick_bulgar_bride_desc: "Esposa de un Khan convertido en Emperador, Sabina ha visto innumerables imperios nómadas surgir y caer, y en el infierno vio mil más. Es hora de ver caer a otro."
nick_prize_queen: "la Reina del Premio"
nick_prize_queen_desc: "Arrancada de su hogar dos veces, la Princesa Trofeo hará un hogar del que nunca podrá ser arrancada de nuevo."
nick_champions_trophy: "el Trofeo del Campeón"
nick_champions_trophy_desc: "Regalada a un conquistador en ascenso para asegurar una frontera, nunca olvidó el hambre de gobernar realmente."
nick_granddaughter_heaven: "la Nieta del Cielo"
nick_granddaughter_heaven_desc: "La hija de un Emperador casada con un señor de la estepa no tenía precedentes. Doblemente que terminara en los Mil Infiernos."
nick_little_lion: "Pequeño León"
nick_little_lion_desc: "Búrlate del pequeño cachorro bajo tu propio riesgo. Puede que sientas su mordida."
nick_khazar_peacock: "Pavo Real Jázaro"
nick_khazar_peacock_desc: "Serah disfruta montar un espectáculo y pavonearse, pero ciertamente no es el ave de presa que cree ser."
nick_mistress_of_sighs: "Dueña de los Suspiros"
nick_mistress_of_sighs_desc: "Dondequiera que esté prohibido pisar, caminarás. Cualquier cosa prohibida de pronunciar, dirás. Cualquier cosa tabú, te deleitarás en ella."
nick_bishop_chester: "Obispo de Chester"
nick_bishop_chester_desc: "Acumulando poder temporal y espiritual por igual, Godofredo es el raro pariente que los Colmillos Plateados deben respetar y obedecer."
nick_born_competitor: "Competidor Nato"
nick_born_competitor_desc: "Temerario hasta la médula, Malcolm aún no ha encontrado a su igual en el pequeño mundo en el que vive."
nick_stricken_knight: "Caballero Afligido"
nick_stricken_knight_desc: "La lepra no embotó ni el espíritu caballeresco de Enrique ni su esgrima."
nick_abbot_connemara: "Abad de Connemara"
nick_abbot_connemara_desc: "La propia marca de fe de Cynan le ha granjeado amigos improbables, desde los hombres lobo hasta los fae."
nick_cursed_bard: "Bardo Maldito"
nick_cursed_bard_desc: "Brian es bienvenido en cualquier corte... por una noche o dos, antes de que su maldición empiece a hacerle nuevos enemigos."
nick_stranded_serpent: "Serpiente Varada"
nick_stranded_serpent_desc: "Lejos de las salas de poder que ella cree que le pertenecen, los sueños de fama y fortuna de Juliote serán construidos sobre la sangre y las lágrimas de otros."
nick_caretaker_martyr: "la Mártir Cuidadora"
nick_caretaker_martyr_desc: "Aisha hizo de Jerusalén un refugio para los Salubri. Lamentablemente, no sobrevivió para verlo."
nick_keeper_lore: "Guardián del Saber"
nick_keeper_lore_desc: "El paciente y erudito fundador de la rama académica de la Tal'mahe'Ra intenta navegar tiempos demasiado turbulentos para su plácida perspectiva."
nick_farsighted_bride: "Novia Perspicaz"
nick_farsighted_bride_desc: "Zophia allanará el camino para el triunfo de los Colmillos Plateados en Polonia. La fuerza de las armas no será necesaria, solo la voluntad y la belleza."
nick_shadow_upon_lily: "Sombra sobre el Lirio"
nick_shadow_upon_lily_desc: "Una obra maestra de miseria y desesperación, pintada sobre el corazón de Francia."
nick_virtuoso: "el Virtuoso"
nick_virtuoso_desc: "Dolor, carne y hueso, todo resultando en una obra maestra terriblemente hermosa."
nick_druid_night: "Druida de la Noche"
nick_druid_night_desc: "Un sabio pastor de la noche, conocido tanto por los Kine como por los Vástagos."
nick_songs_glory: "Canciones de Gloria"
nick_songs_glory_desc: "La voz y la sabiduría de Gaia, transmitidas en el recuerdo de los prestigiosos antepasados."
nick_shrouded_enigma: "Enigma Envuelto"
nick_shrouded_enigma_desc: "Nadie que trabaje con Fortunato ha visto jamás su rostro. Tal cautela podría ser la clave de su éxito."
nick_night_wielder: "el Portador de la Noche"
nick_night_wielder_desc: "Incluso aquellos que carecen de una sombra temen al que dominó la noche."
nick_people_wolf: "Lobo del Pueblo"
nick_people_wolf_desc: "Un héroe improbable, que toma de los ricos para dar a los pobres con colmillos y garras."
nick_proud_scholar: "Erudito Orgulloso"
nick_proud_scholar_desc: "Gilbert sabe el valor de una buena educación. Y también sabe su propio valor."
nick_bookish_bodyguard: "Guardaespaldas Bibliófilo"
nick_bookish_bodyguard_desc: "Enrique simplemente quería leer y aprender. El acoso lo convirtió en un luchador."
nick_distant: "el Distante"
nick_distant_desc: "Pedro lleva las cargas de su problemático pasado consigo. Le da un objetivo, pero también quizás demasiado dolor para un solo hombre."
