 nick_inquisitive_guardian: "Guardián Inquisitivo"
 nick_inquisitive_guardian_desc: "Buscando respuestas sobre su pasado, Rusticus a menudo teme que algún día encuentre la verdad."
 nick_the_envious_sister: "la Hermana Envidiosa"
 nick_the_intoxicating_sovereign: "el Soberano Embriagador"
 nick_the_intoxicating_sovereign_desc: "Se dice que su nombre significa 'la que embriaga', y es cognado con la palabra inglesa 'hidromiel'; es probable que la ceremonia del matrimonio sagrado entre el rey y la diosa implicara una bebida compartida."
 nick_the_sworn_prince: "el Príncipe Juramentado"
 nick_maine_athramail: "Maine Athramail"
 nick_maine_athramail_desc: "Maeve y Ailill tuvieron siete hijos, todos llamados Maine. Originalmente todos tenían otros nombres, pero cuando Maeve le preguntó a un druida cuál de sus hijos mataría a Conchobar, él respondió: 'Maine'. Ella no tenía un hijo llamado Maine, así que renombró a todos sus hijos. Fedlimid se convirtió en Maine Athramail ('como su padre')."
 nick_maine_mathramail: "Maine Máthramail"
 nick_maine_mathramail_desc: "Maeve y Ailill tuvieron siete hijos, todos llamados Maine. Originalmente todos tenían otros nombres, pero cuando Maeve le preguntó a un druida cuál de sus hijos mataría a Conchobar, él respondió: 'Maine'. Ella no tenía un hijo llamado Maine, así que renombró a todos sus hijos. Cairbre se convirtió en Maine Máthramail ('como su madre')."
 nick_maine_andoe: "Maine Andoe"
 nick_maine_andoe_desc: "Maeve y Ailill tuvieron siete hijos, todos llamados Maine. Originalmente todos tenían otros nombres, pero cuando Maeve le preguntó a un druida cuál de sus hijos mataría a Conchobar, él respondió: 'Maine'. Ella no tenía un hijo llamado Maine, así que renombró a todos sus hijos. Eochaid se convirtió en Maine Andoe ('el veloz')."
 nick_maine_tail: "Maine Taí"
 nick_maine_tail_desc: "Maeve y Ailill tuvieron siete hijos, todos llamados Maine. Originalmente todos tenían otros nombres, pero cuando Maeve le preguntó a un druida cuál de sus hijos mataría a Conchobar, él respondió: 'Maine'. Ella no tenía un hijo llamado Maine, así que renombró a todos sus hijos. Fergus se convirtió en Maine Taí ('el silencioso')."
 nick_maine_morgor: "Maine Mórgor"
 nick_maine_morgor_desc: "Maeve y Ailill tuvieron siete hijos, todos llamados Maine. Originalmente todos tenían otros nombres, pero cuando Maeve le preguntó a un druida cuál de sus hijos mataría a Conchobar, él respondió: 'Maine'. Ella no tenía un hijo llamado Maine, así que renombró a todos sus hijos. Cet se convirtió en Maine Mórgor ('de gran deber')." 
 nick_maine_milscothach: "Maine Mílscothach"
 nick_maine_milscothach_desc: "Maeve y Ailill tuvieron siete hijos, todos llamados Maine. Originalmente todos tenían otros nombres, pero cuando Maeve le preguntó a un druida cuál de sus hijos mataría a Conchobar, él respondió: 'Maine'. Ella no tenía un hijo llamado Maine, así que renombró a todos sus hijos. Sin se convirtió en Maine Mílscothach ('de habla de miel')."
 nick_maine_moepirt: "Maine Móepirt"
 nick_maine_moepirt_desc: "Maeve y Ailill tuvieron siete hijos, todos llamados Maine. Originalmente todos tenían otros nombres, pero cuando Maeve le preguntó a un druida cuál de sus hijos mataría a Conchobar, él respondió: 'Maine'. Ella no tenía un hijo llamado Maine, así que renombró a todos sus hijos. Dáire se convirtió en Maine Móepirt ('más allá de toda descripción')."
 nick_the_white_phantom: "el Fantasma Blanco"
 nick_the_white_phantom_desc: "Findabair significa literalmente 'Fantasma Blanco'. Etimológicamente es cognado con Gwenhwyfar, la forma galesa original de Ginebra. Cú Chulainn se referirá a ella como 'ese hermoso cebo'."
