 seek_knowledge_thaumaturgy_name: "Aprender [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Taumaturgia)"
 seek_knowledge_thaumaturgy_desc: "[GetTrait('bloodsorcery').GetName(GetNullCharacter)] es una misteriosa $pod_discipline$ asociada más comúnmente con los [GetTrait('tremere').GetName(GetNullCharacter)], pero practicada por varios [Glossary('Clans','game_concept_Clan_desc')] diferentes. Permite al practicante usar su sangre para una variada gama de rituales mágicos: enfocar la mente, mejorar sus ejércitos, maldecir a sus enemigos... y muchos más.\nLos Taumaturgos suelen tener una reputación aterradora que usan en su beneficio. Es difícil para sus enemigos estimar adecuadamente qué esperar de un conflicto directo. Los no iniciados tienen poca idea del alcance y la magnitud del poder que un taumaturgo podría poseer, y a veces su imaginación se les escapa."
 seek_knowledge_thaumaturgy_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Tras viajar allí, podrás adquirir el [trait|E] de la $pod_discipline$. No solo te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('bloodsorcery').GetName(GetNullCharacter)], sino que también desbloquea la [character_interaction|E] de [bloodsorcery|E], que te permite lanzar varios hechizos beneficiosos y dañinos.\n\n#warning Aprender Taumaturgia significa que nunca podrás aprender Sihr.#!"
 seek_knowledge_thaumaturgy_tt: "Desvelaré los secretos más profundos de la vítae." 
 seek_knowledge_thaumaturgy_planning_title: "La Búsqueda de la Taumaturgia"
 seek_knowledge_thaumaturgy_planning_desc: "He agitado mi sangre y me he preparado lo mejor que he podido, pero los puntos más sutiles de [GetTrait('bloodsorcery').GetName(GetNullCharacter)] aún se me escapan.\n\nSi quiero dominar esta $pod_discipline$ por completo, necesitaré un maestro.\n\nPor suerte, mis exploradores me han dicho dónde se puede encontrar a esa persona."
 seek_knowledge_thaumaturgy_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_thaumaturgy_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_thaumaturgy_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_thaumaturgy_travel_desc: "Estoy emocionado por tener la oportunidad de aprender [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Sus secretos son celosamente guardados por una razón. Una vez que los desvele, no hay forma de saber de qué seré capaz.\nSe dice que la verdadera fortaleza de un taumaturgo es la disciplina para prepararse ante posibilidades peligrosas y usar rituales que quizás no parezcan poderosos a primera vista. Un buen taumaturgo llega preparado para todo tipo de situaciones y puede desatar las fuerzas que ha reunido en caso de emergencia. Los taumaturgos de mentalidad marcial comparan sus preparativos con asegurarse de tener munición adicional por si la batalla va mal." 
 seek_knowledge_thaumaturgy_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_thaumaturgy_isvalid: "$disciplines_learning_thaumaturgy_tt$"

 seek_knowledge_sielanic_thaumaturgy_name: "Aprender [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Taumaturgia Sielánica)"
 seek_knowledge_sielanic_thaumaturgy_desc: "La Taumaturgia Sielánica es una forma de Taumaturgia inspirada por el dios pagano Telyavel y practicada por los [GetTrait('tremere').GetName(GetNullCharacter)] Telyavelic, una línea de sangre de los Tremere nativa de Lituania.\n\nLos Telvays aprendieron a utilizar el poder de la siela, el espíritu animista latente en la tierra, la piedra, las plantas y los animales de su patria adoptiva. Basadas en prácticas chamánicas, estos Senderos combinan aspectos de la magia basada tanto en la naturaleza como en el espíritu.\n\nAlgunos Tremere fuera de la línea de sangre creen que la Taumaturgia Sielánica es una rama de la Hechicería Koldúnica y ven con recelo y desconfianza a quienes la practican. Sus sospechas no son del todo infundadas, ya que los practicantes de la Taumaturgia Sielánica tienen acceso a algunos [bs_paths|E] del Koldunismo."
 seek_knowledge_sielanic_thaumaturgy_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Tras viajar allí, podrás adquirir el [trait|E] de la $pod_discipline$. No solo te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('bloodsorcery').GetName(GetNullCharacter)], sino que también desbloquea la [character_interaction|E] de [bloodsorcery|E], que te permite lanzar varios hechizos beneficiosos y dañinos.\n\n#warning Aprender Taumaturgia significa que nunca podrás aprender Sihr.#!"
 seek_knowledge_sielanic_thaumaturgy_tt: "Desvelaré los secretos más profundos de la vítae." 
 seek_knowledge_sielanic_thaumaturgy_planning_title: "La Búsqueda de la Taumaturgia Sielánica"
 seek_knowledge_sielanic_thaumaturgy_planning_desc: "He agitado mi sangre y me he preparado lo mejor que he podido, pero los puntos más sutiles de [GetTrait('bloodsorcery').GetName(GetNullCharacter)] aún se me escapan.\n\nSi quiero dominar esta $pod_discipline$ por completo, necesitaré un maestro.\n\nPor suerte, mis exploradores me han dicho dónde se puede encontrar a esa persona."
 seek_knowledge_sielanic_thaumaturgy_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_sielanic_thaumaturgy_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sielanic_thaumaturgy_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sielanic_thaumaturgy_travel_desc: "A través de la Taumaturgia Sielánica, un vampiro puede convertirse en parte del mundo natural, participando de las habilidades inherentes a la tierra, los árboles, las rocas y la vida de cualquier suelo al que esté vinculado. Así como cruzar la frontera entre la vida y la muerte, usando su propio cuerpo no muerto como conducto para contactar a los muertos. Las artes Sielánicas utilizan tanto la Taumaturgia tradicional de los [GetTrait('tremere').GetName(GetNullCharacter)] como la Hechicería Koldúnica de los [GetTrait('tzimisce').GetName(GetNullCharacter)] para lograr un poder más allá del alcance de una sola [bs_tradition|E]." 
 seek_knowledge_sielanic_thaumaturgy_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_sielanic_thaumaturgy_isvalid: "$disciplines_learning_sielanic_tt$"

 seek_knowledge_dur_an_ki_name: "Aprender [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Dur-An-Ki)"
 seek_knowledge_dur_an_ki_desc: "La Hechicería Assamita comenzó en la Segunda Ciudad cuando magos mortales fueron Abrazados por el Clan con la promesa de poder y vida eterna. Estos hechiceros no muertos actuaron como interrogadores y cazadores de demonios durante las guerras contra los Baali. Tras la caída de la Segunda Ciudad, los hechiceros fueron usados para facilitar la comunicación mágica a larga distancia, manteniendo al Clan unificado y organizado. Además, usaron sus artes para proteger el rebaño que el Clan cultivaba. Nutrieron los cultivos que sostenía al rebaño y continuaron atacando a las fuerzas que amenazaban al Clan. \nEstos Hechiceros posteriormente han orientado sus talentos hacia las artes del Dur-An-Ki (sumerio para “Señor del Cielo y la Tierra”) para ayudarles en su causa. Una forma de magia que se originó en la antigua Mesopotamia, ha crecido a lo largo de los milenios para incorporar los adornos de numerosos mitos y religiones de todo el Gran Medio Oriente. Fundamentalmente, el Dur-An-Ki permite establecer pactos entre espíritus y hechiceros (conocidos como ashipu)."
 seek_knowledge_dur_an_ki_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Tras viajar allí, podrás adquirir el [trait|E] de la $pod_discipline$. No solo te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('bloodsorcery').GetName(GetNullCharacter)], sino que también desbloquea la [character_interaction|E] de [bloodsorcery|E], que te permite lanzar varios hechizos beneficiosos y dañinos."
 seek_knowledge_dur_an_ki_tt: "Desvelaré los secretos más profundos de la vítae." 
 seek_knowledge_dur_an_ki_planning_title: "La Búsqueda del Dur-An-Ki"
 seek_knowledge_dur_an_ki_planning_desc: "He agitado mi sangre y me he preparado lo mejor que he podido, pero los puntos más sutiles de [GetTrait('bloodsorcery').GetName(GetNullCharacter)] aún se me escapan.\n\nSi quiero dominar esta $pod_discipline$ por completo, necesitaré un maestro.\n\nPor suerte, mis exploradores me han dicho dónde se puede encontrar a esa persona."
 seek_knowledge_dur_an_ki_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_dur_an_ki_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_dur_an_ki_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_dur_an_ki_travel_desc: "Mientras que los sellos distintivos de la Taumaturgia son su orden y precisión científica, la Hechicería Assamita es mucho menos rígida. Obtiene su inspiración y forma de numerosas fuentes culturales y experimentos realizados a lo largo de muchos siglos: el Hinduismo, las epopeyas heroicas, el feng shui, la alquimia y astronomía islámicas, las magias altas y bajas de Mesopotamia, y los ritos persas de Mitra, por nombrar solo algunos.\nEn el caso de cada rito que un Hechicero lanza, el camino que toman hacia su finalización se compone de una serie de hitos. Sin embargo, el orden y la manera en que se cumplen es diferente de un lanzador a otro, dependiendo de la fuente cultural que utilicen para caracterizar sus prácticas."
 seek_knowledge_dur_an_ki_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_dur_an_ki_isvalid: "$POD_seek_knowledge_intro$\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_25$\n$BULLET_WITH_TAB$Eres un [GetTrait('assamite').GetName(GetPlayer)]\n$BULLET_WITH_TAB$Tienes [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)] y [GetTrait('quietusadvanced').GetName(GetPlayer)]\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"
 
 seek_knowledge_akhu_name: "Aprender [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Akhu)"
 seek_knowledge_akhu_desc: "La Hechicería Setita es un curioso fenómeno mágico. Tiene elementos de todo el espectro mágico, aunque su implementación tiene un formato mayoritariamente ritualístico y religioso. Dicho esto, \"Hechicería Setita\" es un nombre algo inapropiado. El término implica una práctica singular, pero Hechicerías Setitas sería más adecuado, ya que en realidad es una colección de diferentes prácticas de los Seguidores de Set alrededor del mundo. En el apogeo de Egipto, antes de su conversión al cristianismo por parte del Imperio Romano, la magia era común, practicada tanto por mortales como por vampiros. Los egipcios tenían varias palabras para la magia; los Setitas usaban Heka (literalmente \"magia\") para referirse a la magia mortal, y Ahku (\"hechizos\") para su magia de sangre. Esta sigue siendo la variante más conocida de la \"Hechicería Setita\" hasta la fecha."
 seek_knowledge_akhu_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Tras viajar allí, podrás adquirir el [trait|E] de la $pod_discipline$. No solo te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('bloodsorcery').GetName(GetNullCharacter)], sino que también desbloquea la [character_interaction|E] de [bloodsorcery|E], que te permite lanzar varios hechizos beneficiosos y dañinos."
 seek_knowledge_akhu_tt: "Desvelaré los secretos más profundos de la vítae." 
 seek_knowledge_akhu_planning_title: "La Búsqueda del Akhu"
 seek_knowledge_akhu_planning_desc: "He agitado mi sangre y me he preparado lo mejor que he podido, pero los puntos más sutiles de [GetTrait('bloodsorcery').GetName(GetNullCharacter)] aún se me escapan.\n\nSi quiero dominar esta $pod_discipline$ por completo, necesitaré un maestro.\n\nPor suerte, mis exploradores me han dicho dónde se puede encontrar a esa persona."
 seek_knowledge_akhu_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_akhu_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_akhu_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_akhu_travel_desc: "El Akhu, la escuela de Hechicería Setita más ampliamente practicada, se asemeja a la antigua religión egipcia. El dios Set para los antiguos egipcios era, entre otras cosas, el Dios de las Tormentas. Un practicante de Akhu, por lo tanto, erige un pararrayos simbólico a través del cual puede atraer un rayo de la tormenta de Set para alimentar sus ritos posteriores. Sin embargo, para atraer el favor de Set, debe hacer una ofrenda al Dios Oscuro que le complazca enormemente. La forma aceptada de lograr esto entre los practicantes de Akhu (conocidos como Sacerdotes Lector) es siguiendo las instrucciones establecidas por el propio Set en El Libro de la Salida por la Noche."
 seek_knowledge_akhu_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_akhu_isvalid: "$POD_seek_knowledge_intro$\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_25$\n$BULLET_WITH_TAB$Tu [faith|E] tiene la [doctrine|E] [GetFaithDoctrine('special_doctrine_set_pillars_kindred').GetBaseName]\n$BULLET_WITH_TAB$Tienes [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)] y [GetTrait('serpentisadvanced').GetName(GetPlayer)]\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"

 seek_knowledge_sadhana_name: "Aprender [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Sadhana)"
 seek_knowledge_sadhana_desc: "Al llegar a la India, los Seguidores de Set encontraron elementos de la religión Hindú que pudieron explotar para convertir Vástagos a su causa. Los practicantes de Sadhana son extraídos predominantemente de las filas de la línea de sangre Setita conocida como los Daitya. Estos Setitas siguen a Shiva, que deriva del dios Rudra, una deidad tormentosa, y por lo tanto identificado como una máscara de Set. Creyéndose demonios en carne, los Setitas indios ven como su misión derrocar a los dioses y tomar su poder para sí mismos."
 seek_knowledge_sadhana_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Tras viajar allí, podrás adquirir el [trait|E] de la $pod_discipline$. No solo te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('bloodsorcery').GetName(GetNullCharacter)], sino que también desbloquea la [character_interaction|E] de [bloodsorcery|E], que te permite lanzar varios hechizos beneficiosos y dañinos."
 seek_knowledge_sadhana_tt: "Desvelaré los secretos más profundos de la vítae." 
 seek_knowledge_sadhana_planning_title: "La Búsqueda del Sadhana"
 seek_knowledge_sadhana_planning_desc: "He agitado mi sangre y me he preparado lo mejor que he podido, pero los puntos más sutiles de [GetTrait('bloodsorcery').GetName(GetNullCharacter)] aún se me escapan.\n\nSi quiero dominar esta $pod_discipline$ por completo, necesitaré un maestro.\n\nPor suerte, mis exploradores me han dicho dónde se puede encontrar a esa persona."
 seek_knowledge_sadhana_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_sadhana_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sadhana_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sadhana_travel_desc: "Sadhana es el esfuerzo de la mente sobre la materia. Si bien se podría argumentar que su poder proviene de dentro en lugar de ser canalizado desde el Dios Oscuro, es su fe y devoción a Shiva lo que les otorga el enfoque que les permite dirigir este poder. Sin esto, se argumenta, simplemente se perderían en la meditación. Sin Shiva, no tendrían poder, y por lo tanto todo es atribuible al Dios Oscuro al final."
 seek_knowledge_sadhana_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
