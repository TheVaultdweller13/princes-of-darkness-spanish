 seek_knowledge_sorcery_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sorcery_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sorcery_travel_desc: "Estoy emocionado por la oportunidad de aprender #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#!. ¿Quién sabe lo que podré hacer una vez que la magia esté a mis órdenes? Las posibilidades son ilimitadas."
 seek_knowledge_sorcery_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_theurgy_name: "Aprender Numinum (#TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Teurgia#!#!)"
 seek_knowledge_theurgy_desc: "#TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Teurgia#!#! es una forma de magia practicada originalmente por místicos judíos y redescubierta recientemente por eruditos cristianos. Se ha formalizado en múltiples senderos, como la #TOOLTIP:PERK,numina_via_medicamenti_1_perk #L Via Medicamenti#!#!, la #TOOLTIP:PERK,numina_via_oraculi_5_perk #L Via Oraculi#!#! o la #TOOLTIP:PERK,numina_via_necromantiae_1_perk #L Via Necromantiae#!#!."
 seek_knowledge_theurgy_effects: "Aprenderás la ubicación de un maestro que conoce #TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Teurgia#!#!. Después de viajar allí, puedes adquirir el [trait|E] [GetTrait('theurgist').GetName(GetPlayer)], que te permite desbloquear [perks|E] en la rama de Teurgia del [lifestyle|E] de #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#!."
 seek_knowledge_theurgy_isvalid: "$EFFECT_LIST_BULLET$Tu [faith|E] no debe considerar la #TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_magicraft_crime #L Magia#!#! un [crime|E].\n#help $EFFECT_LIST_BULLET$Esta restricción se ignora si tu fe tiene raíces en religiones abrahámicas ([GetReligionByKey('roadofheaven_religion').GetName], [GetReligionByKey('ashirra_religion').GetName], [GetReligionByKey('bloodgnosticism_religion').GetName], [GetReligionByKey('roadofblood_religion').GetName], [GetReligionByKey('calomenasforsaken_religion').GetName], [GetReligionByKey('fishers_religion').GetName], [GetFaithByKey('shadowinquisition').GetName], [GetFaithByKey('akritai').GetName], [GetFaithByKey('ikhwan_al_safa').GetName], [GetFaithByKey('judge').GetName], [GetFaithByKey('crestofthehorn').GetName], [GetFaithByKey('orderofourmercifulmother').GetName] o [GetDoctrine('tenet_constantinian').GetBaseName]).#!"
 seek_knowledge_theurgy_tt: "Encarnaré a mi Ser Superior."
 seek_knowledge_theurgy_planning_title: "La Búsqueda de la Teurgia"
 seek_knowledge_theurgy_planning_desc: "Después de estudiar detenidamente tomos esotéricos y leer varios tratados sobre #TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Teurgia#!#!, ahora tengo una comprensión decente de su teoría.\n\nSin embargo, la práctica es otro asunto. Necesitaré un maestro antes de poder llamarme [GetTrait('theurgist').GetName(GetPlayer)] en serio.\n\nMis exploradores me han dicho dónde se puede encontrar a esa persona."
