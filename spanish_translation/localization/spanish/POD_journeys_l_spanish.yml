 seek_knowledge_animalism_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_animalism_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_animalism_travel_desc: "Estoy emocionado por la oportunidad de aprender [GetTrait('animalism').GetName(GetNullCharacter)]. Dicen que las bestias de la noche tienen muchas historias que contar, si uno sabe cómo escuchar."
 seek_knowledge_animalism_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 seek_knowledge_auspex_name: "Aprender Disciplina ([GetTrait('auspex').GetName(GetNullCharacter)])"
 seek_knowledge_auspex_desc: "[GetTrait('auspex').GetName(GetNullCharacter)] es la $pod_discipline$ de los sentidos sobrenaturales. Permite al usuario discernir la [resonance|E] de los demás, realizar [GetPerk('psychic_projection_perk').GetName(GetPlayer)] y, en general, mejora los [schemes|E]."
 seek_knowledge_auspex_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('auspex').GetName(GetNullCharacter)]. Después de viajar allí, puedes adquirir el [trait|E] de la $pod_discipline$, que te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('auspex').GetName(GetNullCharacter)]."
