 seek_knowledge_infusion_travel_desc: "Estoy emocionado por la oportunidad de aprender #TOOLTIP:GAME_TRAIT,art_infusion,[GetNullCharacter] #L Infusion#!#!. Con los #TOOLTIP:GAME_TRAIT,nocker,[GetNullCharacter] #L Nockers#!#!, la creatividad y la frustración van de la mano. Espero obtener más de lo primero y menos de lo segundo."
