 seek_knowledge_koldunic_name: "Aprender [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Koldúnica)"
 seek_knowledge_koldunic_desc: "Los koldun Tzimisce afirman haber practicado magia antes que todos los demás. La Hechicería Koldúnica se basa en el elementalismo primigenio, esclavizando espíritus débiles o haciendo tratos con los más fuertes. El más importante de estos espíritus elementales es la entidad de los Cárpatos, Kupala, llamada “la raíz de todo” por los koldun más antiguos. Las relaciones continuas con esta criatura han causado dificultades significativas, ya que el tráfico con espíritus está a un paso del infernalismo."
 seek_knowledge_koldunic_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Tras viajar allí, podrás adquirir el [trait|E] de la $pod_discipline$. No solo te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('bloodsorcery').GetName(GetNullCharacter)], sino que también desbloquea la [character_interaction|E] de [bloodsorcery|E], que te permite lanzar varios hechizos beneficiosos y dañinos."
 seek_knowledge_koldunic_tt: "Desvelaré los secretos más profundos de la vítae." 
 seek_knowledge_koldunic_planning_title: "La Búsqueda de la Hechicería Koldúnica"
 seek_knowledge_koldunic_planning_desc: "He agitado mi sangre y me he preparado lo mejor que he podido, pero los puntos más sutiles de [GetTrait('bloodsorcery').GetName(GetNullCharacter)] aún se me escapan.\n\nSi quiero dominar esta $pod_discipline$ por completo, necesitaré un maestro.\n\nPor suerte, mis exploradores me han dicho dónde se puede encontrar a esa persona."
 seek_knowledge_koldunic_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_koldunic_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_koldunic_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_koldunic_travel_desc: "La Hechicería Koldúnica es similar a la Taumaturgia en idea pero muy diferente en la práctica. Las diferencias principales incluyen que la Hechicería Koldúnica requiere el servicio de los espíritus de la naturaleza en lugar de ritos y rituales memorizados, que el Koldunismo tiende a ser mucho más sutil que la Taumaturgia en niveles bajos, y que el Koldunismo requiere no tanto una extensión de la voluntad como ser un maestro del material mismo que el Fiendish desea manipular."
 seek_knowledge_koldunic_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_koldunic_isvalid: "$POD_seek_knowledge_intro$\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_25$\n$BULLET_WITH_TAB$Tu [capital|E] está en [GetGeographicalRegion('world_europe_east').GetName]\n$BULLET_WITH_TAB$Eres un [GetTrait('overseer').GetName(GetPlayer)] con [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"


 seek_knowledge_sihr_name: "Aprender [GetTrait('bloodsorcery').GetName(GetNullCharacter)] (Sihr)"
 seek_knowledge_sihr_desc: "Esta forma de magia de sangre practicada por los pocos hechiceros [Glossary('Ashirra','game_concept_ashirra_desc')] se originó con el Tarique al-Hajji Mutasharid([GetTrait('nosferatu').GetName(GetNullCharacter)]) en el siglo IX. Tarique construyó contactos con los [GetTrait('assamite').GetName(GetNullCharacter)], incluyendo a Khalid al-Munir, un miembro prominente de la casta de hechiceros de ese clan. Juntos desarrollaron los senderos del Sihr, cuya fuerza se origina tanto en la fe del lanzador como en el poder de su sangre.\n\nMientras que la Taumaturgia y otras formas de magia de sangre se consideran blasfemas en el Islam (ya que buscan un poder distinto al de Dios para ayudar a alguien), muchos de los practicantes del Sihr creen que el poder del Sihr proviene solo a través de Dios. Lanzar hechizos generalmente se basa en oraciones que se usan como encantamientos."
 seek_knowledge_sihr_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('bloodsorcery').GetName(GetNullCharacter)]. Tras viajar allí, podrás adquirir el [trait|E] de la $pod_discipline$. No solo te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('bloodsorcery').GetName(GetNullCharacter)], sino que también desbloquea la [character_interaction|E] de [bloodsorcery|E], que te permite lanzar varios hechizos beneficiosos y dañinos.\n\n#warning Aprender Sihr significa que nunca podrás aprender Taumaturgia.#!"
 seek_knowledge_sihr_tt: "Desvelaré los secretos más profundos de la vítae." 
 seek_knowledge_sihr_planning_title: "La Búsqueda del Sihr"
 seek_knowledge_sihr_planning_desc: "He agitado mi sangre y me he preparado lo mejor que he podido, pero los puntos más sutiles de [GetTrait('bloodsorcery').GetName(GetNullCharacter)] aún se me escapan.\n\nSi quiero dominar esta $pod_discipline$ por completo, necesitaré un maestro.\n\nPor suerte, mis exploradores me han dicho dónde se puede encontrar a esa persona."
 seek_knowledge_sihr_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_sihr_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_sihr_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_sihr_travel_desc: "A diferencia de otros senderos de magia de sangre, el Sihr se lanza principalmente a través de la oración en lugar de encantamientos y símbolos arcanos. Muchos hechizos y rituales requieren una oración y un enfoque intensos por parte de sus practicantes, y solo los verdaderamente devotos pueden tener éxito al usarlos."
 seek_knowledge_sihr_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_sihr_isvalid: "$EFFECT_LIST_BULLET$Solo los vampiros que siguen una [faith|El] [GetReligionByKey('ashirra_religion').GetName] o la [GetFaithByKey('tariqelhaqim').GetName] pueden aprender Sihr"


 seek_knowledge_abyssal_mysticism_name: "Aprender [GetTrait('obtenebration').GetName(GetNullCharacter)] (Misticismo Abisal)"
 seek_knowledge_abyssal_mysticism_desc: "Inmersos en el estudio eterno de una fuerza que trasciende y finalmente se opone a toda luz y vida, los Místicos del Abismo tienen poco uso para la humanidad o los preceptos mortales del bien y el mal.\nLos místicos del Clan Lasombra se adentran en los lugares oscuros en busca de secretos, respuestas y quizás más preguntas. Para estas almas impulsadas, la Obtenebración convencional es solo el comienzo. Al aplicar los principios taumatúrgicos a la Obtenebración, los místicos Lasombra de la Edad Oscura desarrollaron rituales para desbloquear los poderes ocultos de la sombra y convocar a los horrores primigenios innombrables del Abismo, extendiendo así efectivamente la Obtenebración a una forma de hechicería de sangre."
 seek_knowledge_abyssal_mysticism_effects: "Aprenderás la ubicación de un maestro que conoce el Misticismo Abisal. Tras viajar allí, podrás adquirir el [trait|E] de la $pod_discipline$. No solo te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('bloodsorcery').GetName(GetNullCharacter)], sino que también desbloquea la [character_interaction|E] de [bloodsorcery|E], que te permite lanzar varios hechizos beneficiosos y dañinos."
 seek_knowledge_abyssal_mysticism_tt: "Desvelaré los secretos más profundos de la vítae." 
 seek_knowledge_abyssal_mysticism_planning_title: "La Búsqueda del Misticismo Abisal"
 seek_knowledge_abyssal_mysticism_planning_desc: "He agitado mi sangre y me he preparado lo mejor que he podido, pero los puntos más sutiles del Misticismo Abisal aún se me escapan.\n\nSi quiero dominar esta $pod_discipline$ por completo, necesitaré un maestro.\n\nPor suerte, mis exploradores me han dicho dónde se puede encontrar a esa persona."
 seek_knowledge_abyssal_mysticism_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_abyssal_mysticism_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_abyssal_mysticism_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_abyssal_mysticism_travel_desc: "La magia abisal invoca espíritus de otra dimensión, que se asemeja a una forma de purgatorio oscuro. Tales practicantes esclavizan y controlan espíritus, pero esos espíritus son diferentes a cualquier otra cosa en la creación y parecen no tener memoria o asociación con entidades demoníacas verdaderas."
 seek_knowledge_abyssal_mysticism_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_abyssal_mysticism_isvalid: "$POD_seek_knowledge_intro$\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_25$\n$BULLET_WITH_TAB$Tienes [GetTrait('bloodsorceryadvanced').GetName(GetNullCharacter)]\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"

