 seek_knowledge_infusion_desc: "#TOOLTIP:GAME_TRAIT,art_infusion,[GetNullCharacter] #L Infusion#!#! es el Arte de la invención practicado por los #TOOLTIP:GAME_TRAIT,nocker,[GetNullCharacter] #L Nockers#!#!. Un practicante puede crear varios dispositivos, usando habilidades como [GetPerk('fubar_generation_perk').GetName(GetPlayer)], [GetPerk('animantis_perk').GetName(GetPlayer)] o [GetPerk('gilgul_perk').GetName(GetPlayer)]."
 seek_knowledge_infusion_effects: "Aprenderás la ubicación de un maestro que conoce #TOOLTIP:GAME_TRAIT,art_infusion,[GetNullCharacter] #L Infusion#!#!. Después de viajar allí, puedes adquirir el [trait|E] [GetTrait('art_infusion').GetName(GetPlayer)], que te permite desbloquear [perks|E] en el [lifestyle|E] de #TOOLTIP:GAME_TRAIT,art_infusion,[GetNullCharacter] #L Infusion#!#!."
 seek_knowledge_infusion_tt: "Creatividad desatada."
 seek_knowledge_infusion_planning_title: "La Búsqueda de Infusion"
 seek_knowledge_infusion_planning_desc: "He despertado mi Glamour y me he preparado lo mejor que he podido, pero los detalles más finos de #TOOLTIP:GAME_TRAIT,art_infusion,[GetNullCharacter] #L Infusion#!#! aún se me escapan.\n\nSi quiero dominar este Arte por completo, necesitaré un maestro.\n\nAfortunadamente, mis exploradores me han dicho dónde se puede encontrar a esa persona."
