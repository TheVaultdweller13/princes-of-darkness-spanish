 provoke_vatican_warning: "#warning Esta violación sin precedentes de [the_masquerade|E] tendrá consecuencias masivas que cambiarán el mundo.\n\nTe convertirás en [GetTrait('forever_infamous').GetName(GetPlayer)] y [GetModifier( 'prestige_level_0' ).GetNameWithTooltip|L]. Seguramente pasarás a los libros de historia. Casi con toda seguridad, también desaparecerás.\n\n¿Estás dispuesto a arriesgarte?#!"
 
 provoke_vatican_name: "Revelarte ante el Vaticano"
 provoke_vatican_desc: "Estoy cansado de esconderme siempre en las sombras, de encogerme siempre por miedo a los mortales, de asegurarme siempre de que nuestra existencia permanezca oculta. ¡No más! Les mostraré que nuestra especie debe ser respetada. Se lo mostraré a todos..."
 provoke_vatican_effects: "Viajarás a Roma y revelarás tu naturaleza sobrenatural durante una violenta incursión, provocando una represalia de la Inquisición.\n\n$provoke_vatican_warning$"
 provoke_vatican_isvalid: "$EFFECT_LIST_BULLET$Eres [GetTrait('arrogant').GetName(GetPlayer)]\n$EFFECT_LIST_BULLET$Tu [capital|E] está en [GetGeographicalRegion('world_europe').GetName]\n$EFFECT_LIST_BULLET$Sigues una [christian_derived_faith|E]"
 provoke_vatican_religion_tt: "Necesitas seguir una [christian_derived_faith|E]"
 provoke_vatican_tt: "Pasaré a la infamia."
 provoke_vatican_planning_title: "Despertando al Tigre"
 provoke_vatican_planning_desc: "La decisión fue tomada. Los preparativos están hechos. Estoy tan listo como lo estaré nunca. Ahora todo lo que queda es un rápido viaje a la Ciudad Santa.\n\nNo todos compartirán mi visión. De hecho, espero que haya muchos que intentarán disuadirme de esta búsqueda, pensando que es una misión de necios. Simplemente no comprenden la amplitud de mi ambición.\n\nPero pronto, la comprenderán."
 provoke_vatican_planning_confirm: "Esta será mi obra maestra."
 provoke_vatican_planning_decline: "Será mejor que me asegure de estar listo para esto."
 provoke_vatican_travel_title: "Viaje al Vaticano"
 provoke_vatican_travel_desc: "El camino por delante será peligroso, y no puedo evitar sentir cierta aprensión. ¿Es así como se sintió César cuando cruzó el Rubicón? ¿Era consciente de que sus acciones cambiarían el destino de un pueblo entero? ¿Sintió el peso de la historia? Solo puedo esperar que algún día, cuando todo esté dicho y hecho y el polvo se haya asentado, mis acciones sean vindicadas."
 provoke_vatican_travel_confirm: "Pronto, el mundo entero sabrá mi nombre."
 
 provoke_vatican_caelestius_name: "$provoke_vatican_name$"
 provoke_vatican_caelestius_desc: "Nuestra especie ha estado escondiéndose en las sombras durante demasiado tiempo, ¿y para qué? La Iglesia nos tacha de pecadores, pero su propio concepto de Pecado se basa en premisas falsas. Sé cómo revelar sus incoherencias lógicas. Sé cómo corregir este error. Yo... debatiré con el Papa."
 provoke_vatican_caelestius_effects: "Viajarás a Roma e intentarás presentar al Santo Padre tu versión personal del nodismo, ganándote su bendición... o provocando una represalia de la Inquisición.\n\n$provoke_vatican_warning$"
 #provoke_vatican_caelestius_isvalid: ""
 provoke_vatican_caelestius_tt: "Seguramente el Santo Padre me bendecirá."
 provoke_vatican_caelestius_planning_title: "Preparando una Revelación"
 provoke_vatican_caelestius_planning_desc: "La decisión fue tomada. Los preparativos están hechos. Estoy tan listo como lo estaré nunca. Ahora todo lo que queda es un rápido viaje a la Ciudad Santa.\n\nNo todos compartirán mi visión. De hecho, espero que haya muchos que intentarán disuadirme de esta búsqueda, pensando que es una misión de necios. Simplemente no comprenden la profundidad de mi fe.\n\nPero pronto, la comprenderán."
 provoke_vatican_caelestius_planning_confirm: "$provoke_vatican_planning_confirm$"
 provoke_vatican_caelestius_planning_decline: "$provoke_vatican_planning_decline$"
 provoke_vatican_caelestius_travel_title: "$provoke_vatican_travel_title$"
 provoke_vatican_caelestius_travel_desc: "$provoke_vatican_travel_desc$"
 provoke_vatican_caelestius_travel_confirm: "$provoke_vatican_travel_confirm$"
 
 siochain_1_name: "La Leyenda del Equilibrio: Mundo Gris"
 siochain_1_desc: "Ya sea a través del estudio deliberado o del inminente horror de la muerte, has llegado a una realización. El equilibrio perfecto entre tu yo mortal y tu yo feérico es posible. Llegar allí, sin embargo, significa obtener una comprensión completa tanto del Glamour como de la Rutina. Una batalla cuesta arriba, si las hay."
 siochain_1_effects: "Meditarás sobre la Rutina, y estarás un paso más cerca de la perfección."
 siochain_1_isvalid: "$EFFECT_LIST_BULLET$Tienes la [perk|E] [GetPerk('realm_fae_5_perk').GetName(GetPlayer)]"
 siochain_1_tt: "El Mundo Otoñal tiene las respuestas."
 siochain_1_planning_title: "Buscando el Equilibrio"
 siochain_1_planning_desc: "Me he sumergido en el mundo de los mortales, estrangulado por sus sofocantes reglas y rígidos rituales.\n\nIncluso cuando la Rutina amenazaba con asfixiarme, lo tomé como una lección. Y ha habido muchas de estas lecciones, últimamente.\n\n¿Ha sido suficiente?"
 siochain_1_planning_confirm: "Es hora de reflexionar sobre lo que he aprendido."
 siochain_1_planning_decline: "Todavía no es el momento."

 siochain_2_name: "La Leyenda del Equilibrio: Mundo Colorido"
 siochain_2_desc: "Me he sumergido en la Rutina y he salido ileso, pero ese fue solo el primer paso. A continuación, necesitaré ponerme en contacto con mi yo feérico."
 siochain_2_effects: "Meditarás sobre el Glamour, y estarás un paso más cerca de la perfección."
 #siochain_2_isvalid: ""
 siochain_2_tt: "Preguntas que solo el Sueño puede responder."
 siochain_2_planning_title: "Buscando el Equilibrio"
 siochain_2_planning_desc: "He meditado mientras estaba sumergido en tormentas de Glamour. He dejado que la materia prima del Sueño me empapara hasta que no quedó nada de mí, sin separación, sin interior ni exterior.\n\n¿Puede este caos cristalizar en una comprensión real?"
 siochain_2_planning_confirm: "Es hora de reflexionar sobre lo que he aprendido."
 siochain_2_planning_decline: "Todavía no es el momento."

 siochain_3_name: "La Leyenda del Equilibrio: Confluencia de Mundos"
 siochain_3_desc: "Parece que no hay manera de reconciliar mi comprensión del Glamour y la Rutina. Son opuestos. Obviamente. Eso es sentido común. Pero ¿cuándo ha detenido el sentido común a un Cambiaformas?"
 siochain_3_effects: "Intentarás la arriesgada empresa de fusionar la Rutina y el Glamour dentro de ti."
 siochain_3_isvalid: "$EFFECT_LIST_BULLET$No estás [GetModifier('POD_disconected_from_dreaming').GetNameWithTooltip]"
 siochain_3_tt: "Encontrando el equilibrio entre las contradicciones."
 siochain_3_planning_title: "Alcanzando el Equilibrio"
 siochain_3_planning_desc: "La Rutina y el Glamour van juntos como el aceite y el agua. Nadie ha logrado mezclarlos.\n\nTodavía.\n\nMe he preparado para esto durante mucho tiempo. La práctica solo me llevará hasta cierto punto. Necesito dar el paso."
 siochain_3_planning_confirm: "Es ahora o nunca."
 siochain_3_planning_decline: "Esto suena estresante, lo haré en otro momento."

