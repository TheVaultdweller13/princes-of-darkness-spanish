 azhi_dahaka_1_name: "Sendero del Dragón"
 azhi_dahaka_1_desc: "Azhi Dahaka es persa para el dragón de tres cabezas del demonio Ahriman. Para los [GetTrait('tzimisce').GetName(GetNullCharacter)], es el Santo Grial del Metamorfosista, un estado del ser iluminado y último, provocado por el uso extensivo de [GetTrait('vicissitude').GetName(GetPlayer)].\n\nTus estudios han confirmado tu primera impresión, no hay una sola forma de llegar a Azhi Dahaka sino muchas. Tendrás que forjar tu camino a través del estudio riguroso y la extensa experimentación."
 azhi_dahaka_1_effects: "Ganarás [trait_level_track_xp|E] en [GetTrait('azhi_dahaka_scholar').GetName(GetPlayer)] al final del [journey|E]. La cantidad de [trait_level_track_xp|E] ganada escala con tu [learning|E] y [Glossary('Generation','game_concept_vampgeneration_desc')]."
 azhi_dahaka_1_tt: "El Cambio Eterno."
 azhi_dahaka_1_planning_title: "Sendero del Dragón"
 azhi_dahaka_1_planning_desc: "Solo puedo dedicar una cantidad limitada de tiempo a la búsqueda de Azhi Dahaka, el estancamiento nunca será el camino a seguir. Necesito evaluar mi progreso actual desde otra perspectiva."
 azhi_dahaka_1_planning_confirm: "$POD_journey_planning_confirm_default$"
 azhi_dahaka_1_planning_decline: "$POD_journey_planning_decline_default$"
 azhi_dahaka_1_travel_title: "Sendero del Dragón"
 azhi_dahaka_1_travel_desc: "Años persiguiendo un solo hilo, pero ¿conduce al Dragón?"
 azhi_dahaka_1_travel_confirm: "El cambio es la constante."
 azhi_dahaka_widget_tt: "Comenzarás inmediatamente otro [journey|E] para obtener información sobre Azhi Dahaka\nCoste: [piety_i|E] #V 1000#!"
 azhi_dahaka_widget_desc: "¿Continuar buscando la perfección?"
 azhi_dahaka_not_enough_piety: "No tienes suficiente [piety_i|E] para comenzar otro [journey|E]"


 azhi_dahaka_2_name: "Ritual de Ascensión"
 azhi_dahaka_2_desc: "Azhi Dahaka no es un Nirvana donde el Metamorfosista logra la unión con el universo, sino más bien lo contrario: experimentar la Metamorfosis es separarse completamente de la Creación, ser una voluntad autosuficiente en un universo que ya no tiene poder sobre el ego.\nAlgunos lo creen, de todas formas. La Metamorfosis es una búsqueda solitaria. ¿Realmente la lograrás? ¿O simplemente te perderás en un torbellino de cambio eterno?\nPara convertirse en el Dragón del Cambio Eterno, uno debe reinventarse en cuerpo y mente. Has preparado el más grandioso de los rituales para lograr esto."
 azhi_dahaka_2_effects: "Te convertirás en el #TOOLTIP:GAME_TRAIT,azhi_dahaka,[GetNullCharacter] #L Dragón del Cambio Eterno#!#!."
 azhi_dahaka_2_tt: "El dragón primordial ruge."
 azhi_dahaka_2_planning_title: "Ritual de Ascensión"
 azhi_dahaka_2_planning_desc: "El ritual está listo. Es hora de dar un paso adelante y encontrar el corazón palpitante del dragón desde donde se encuentran el caos y la eternidad... y luego beber de él."
 azhi_dahaka_2_planning_confirm: "$POD_journey_planning_confirm_default$"
 azhi_dahaka_2_planning_decline: "$POD_journey_planning_decline_default$"
 azhi_dahaka_2_travel_title: "Ritual de Ascensión"
 azhi_dahaka_2_travel_desc: "Estoy en el epicentro de este torbellino."
 azhi_dahaka_2_travel_confirm: "El dragón me espera."

 hunt_for_sargon_codex_shard_name: "Cacería de Fragmentos del Códice de Sargón"
 hunt_for_sargon_codex_shard_desc: "El Códice de Sargón es una tablilla de arcilla escrita por Cappadocius durante sus años mortales. Después de su $pod_Embrace$, la pérdida de su Avatar causó caos y destrucción en sus recuerdos. No podía recordar lo que había escrito ni dónde lo había dejado. Después de milenios, el Códice de Sargón fue destruido y sus partes esparcidas por todo el mundo. Si alguien lo restaurara, un poder inmenso le esperaría."
 hunt_for_sargon_codex_shard_effects: "Comenzarás a reunir información sobre las posibles ubicaciones de los fragmentos del Códice de Sargón."
 hunt_for_sargon_codex_shard_tt: "La obra maestra de un erudito sin igual."
 hunt_for_sargon_codex_shard_isvalid: "$EFFECT_LIST_BULLET$Todavía quedan fragmentos por descubrir."
 hunt_for_sargon_codex_shard_planning_title: "Un Fragmento ha sido Descubierto"
 hunt_for_sargon_codex_shard_planning_desc: "Mis exploradores finalmente han regresado con buenas noticias: la ubicación general de una de las piezas del Códice de Sargón.\n\nAhora que sé a dónde ir, puedo liberarlo.\n\nCon fuerza, si es necesario."
 hunt_for_sargon_codex_shard_planning_confirm: "$POD_journey_planning_confirm_default$"
 hunt_for_sargon_codex_shard_planning_decline: "$POD_journey_planning_decline_default$"
 hunt_for_sargon_codex_shard_travel_title: "En la Cacería del Conocimiento"
 hunt_for_sargon_codex_shard_travel_desc: "El Códice de Sargón fue esparcido a los cuatro vientos, hace mucho tiempo. Reunir todas las piezas será una tarea inmensa. Sin embargo, para un buscador de conocimiento, el premio al final hace que todo el esfuerzo valga la pena."
 hunt_for_sargon_codex_shard_travel_confirm: "Cappadocius seguramente bendecirá este esfuerzo."


