 golconda_1_name: "Aprender a Dominar tu Bestia"
 golconda_1_desc: "Hay rumores de $POD_splat_vampire_plural$ que lograron trascender [Glossary('La Bestia','game_concept_beast_desc')] para siempre, alcanzando un estado en el que ya no necesitan beber sangre. Suena demasiado bueno para ser verdad, pero si hay respuestas ahí fuera, vale la pena encontrarlas."
 golconda_1_effects: "Aprenderás la ubicación de un maestro que puede ponerte en el camino correcto."
 golconda_1_tt: "¿Es posible la paz interior?"
 golconda_1_planning_title: "Comprendiendo al Enemigo Interior"
 golconda_1_planning_desc: "El #beast Hambre#! es algo que todo $pod_cainite$ aprende a soportar... o a disfrutar. Se convierte en ruido de fondo. Un hecho inalterable de nuestra existencia.\n\n¿Pero tiene que ser así?\n\nMis exploradores me han hablado de un lugar donde puedo encontrar más respuestas."
 golconda_1_planning_confirm: "$POD_journey_planning_confirm_default$"
 golconda_1_planning_decline: "$POD_journey_planning_decline_default$"
 golconda_1_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 golconda_1_travel_desc: "Debe haber algo extraño en las respuestas que busco. ¿Acaso no busca todo $pod_cainite$ un respiro de [Glossary('La Bestia','game_concept_beast_desc')]? Entonces, ¿por qué las soluciones a este problema no son más conocidas? Supongo que pronto descubriré por qué."
 golconda_1_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
 golconda_2_name: "Hacer las Paces con tu Bestia"
 golconda_2_desc: "Ahora que conozco el camino de [golconda|E], me enfrento a la difícil tarea de obtener una comprensión profunda de mi [Glossary('Bestia','game_concept_beast_desc')]. Muchos que vinieron antes que yo han pasado siglos en ese empeño, sin mostrar más que frustración. ¿Podré tener éxito donde ellos fracasaron?"
 golconda_2_effects: "Ganarás [trait_level_track_xp|E] como [GetTrait('golconda_seeker').GetName(GetPlayer)]. También ganarás el [trait|E] si aún no lo tienes.\n\nCuantos más [trait_level_track_xp|E] tengas, mayores serán tus posibilidades de lograr un avance importante.\n\n#X Todo el progreso en este [journey|E] se pierde al entrar en frenesí, o al cometer asesinato o robo.#!"
 golconda_2_isvalid: "$EFFECT_LIST_BULLET$No tienes [men_at_arms|E] que hayan sido creados mediante actos atroces #weak ([GetMaA('szlachta').GetName] o [GetMaA('vozhd').GetName])#!"
 golconda_2_trigger: "Necesitas disolver cualquier [men_at_arms|E] que haya sido creado mediante actos atroces #weak ([GetMaA('szlachta').GetName] o [GetMaA('vozhd').GetName])#!"
 golconda_2_tt: "Un viaje de mil pasos."
 golconda_2_planning_title: "Contemplando al Depredador Interior"
 golconda_2_planning_desc: "[Glossary('La Bestia','game_concept_beast_desc')] ha estado royendo el fondo de mi mente como siempre, y he pasado un buen rato observándola y tratando de obtener una comprensión más profunda de su comportamiento.\n\nNecesito algo de tiempo a solas para pensar más profundamente en lo que he aprendido.\n\nEsto probablemente causará algo de [stress|E]."
 golconda_2_planning_confirm: "Estoy listo."
 golconda_2_planning_decline: "Debería contemplar esto en un momento menos estresante."
