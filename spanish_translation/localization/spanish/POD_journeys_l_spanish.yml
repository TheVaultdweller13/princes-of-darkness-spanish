 seek_knowledge_psychic_travel_desc: "Estoy emocionado por la oportunidad de aprender #TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Poderes Psíquicos#!#!. ¿De qué será capaz mi mente una vez que esté libre de sus restricciones actuales?"
