 ritual_blood_sorcery_casting_name: "" # la localización se aplica mediante customloc
 #ritual_casting_desc: ""
 #ritual_casting_effects: ""
 ritual_blood_sorcery_casting_tt: "Preparándose para aprovechar lo oculto."
 ritual_blood_sorcery_casting_planning_title: "Lanzando el [bs_ritual|E]" 
 ritual_blood_sorcery_casting_planning_desc: "Los preparativos requirieron gran disciplina y fortaleza mental. Ahora estoy tan listo como lo estaré nunca.\n\nCon este [bs_ritual|E], mi voluntad se imprimirá en la realidad, utilizando la sangre como medio.\n\nSerá mejor que me asegure de tener todos los reactivos que necesito." 
 ritual_blood_sorcery_casting_planning_confirm: "$POD_journey_planning_confirm_default$"
 ritual_blood_sorcery_casting_planning_decline: "$POD_journey_planning_decline_default$"
 ritual_blood_sorcery_casting_travel_title: "Viaje al [bs_ritual|E]"
 ritual_blood_sorcery_casting_travel_desc: "No importa cuántas veces realice estos ritos, evocan una sensación lejana de temor. Nuestros más grandes eruditos están lejos de comprender la gran [Glossary('Bestia','game_concept_beast_desc')] que duerme en nuestra sangre, despertándose cada vez que necesitamos sus poderes. Debajo de todo el artificio, todos los procedimientos, ceremonias y teatralidades, no somos más que niños tratando de aprovechar una fuerza de la naturaleza."
 #ritual_casting_travel_desc: "A lo largo de siglos de experimentación, los hechiceros Vástagos han expandido sus artes en una miríada de formas diferentes. Con cada paso que dan, otro camino se abre tentadoramente ante ellos, atrayéndolos hacia hazañas de magia aún mayores. La Taumaturgia fue desarrollada por los Vástagos a partir de rituales Herméticos para controlar y enfocar estas poderosas fuerzas.\nOtros Vástagos crearon una amplia gama de Hechicerías que han extraído de las creencias de los mortales de todo el mundo. Algunos han difuminado la línea entre la religión y el poder para crear un número cada vez mayor de ritos. Otros incluso han usado su sangre para comandar a los espíritus de los muertos, para contactar con entidades en reinos más allá de la comprensión, y para vender sus almas a seres que habitan en los rincones más oscuros de toda la creación. Al final, sin embargo, todos los rituales requieren disciplina y fortaleza mental para prepararse. Cualquier error podría ser el último que cometa un hechicero descuidado.\nDespués de una cuidadosa preparación, el [bs_ritual|E] está finalmente listo. Ahora solo necesito el momento y el lugar adecuados para lanzarlo." 
 ritual_blood_sorcery_casting_travel_confirm: "Adelante, hacia la ubicación del [bs_ritual|E]."

 ritual_necromagic_casting_name: "" # localización aplicada por customloc
 #ritual_casting_desc: ""
 #ritual_casting_effects: ""
 ritual_necromagic_casting_tt: "Preparándose para aprovechar el poder de la muerte." 
 ritual_necromagic_casting_planning_title: "Lanzando el [bs_ritual|E]" 
 ritual_necromagic_casting_planning_desc: "Los preparativos requirieron una gran disciplina y fortaleza mental. Ahora estoy tan listo como nunca lo estaré.\n\nCon este [bs_ritual|E], mi voluntad se impondrá en la realidad, usando la sangre como medio.\n\nSerá mejor que me asegure de tener todos los componentes que necesito." 
 ritual_necromagic_casting_planning_confirm: "$POD_journey_planning_confirm_default$"
 ritual_necromagic_casting_planning_decline: "$POD_journey_planning_decline_default$"
 ritual_necromagic_casting_travel_title: "Viaje hacia el [bs_ritual|E]"
 ritual_necromagic_casting_travel_desc: "No importa cuántas veces realice estos ritos, siempre evocan una sensación distante de pavor. Nuestros más grandes eruditos están lejos de comprender a la gran [Glossary('Beast','game_concept_beast_desc')] que yace en letargo en nuestra sangre, despertándose cada vez que necesitamos sus poderes. Bajo todo el artificio, todos los procedimientos, ceremonias y teatralidades, no somos más que niños intentando controlar una fuerza de la naturaleza."
 #ritual_casting_travel_desc: "A lo largo de siglos de experimentación, los hechiceros Vástagos han expandido sus artes en una miríada de formas diferentes. Con cada paso que dan, otro camino se abre tentadoramente ante ellos, señalando el camino hacia proezas mágicas aún mayores. La Taumaturgia fue desarrollada por Vástagos a partir de rituales Herméticos para controlar y enfocar estas poderosas fuerzas.\nOtros Vástagos crearon una amplia gama de Hechicerías que han extraído de las creencias de los mortales de todo el mundo. Algunos han difuminado la línea entre la religión y el poder para crear un número cada vez mayor de ritos. Otros incluso han usado su sangre para comandar a los espíritus de los muertos, para contactar con entidades en reinos más allá de toda comprensión, y para vender sus almas a seres que habitan en los rincones más oscuros de toda la creación. Al final, sin embargo, todos los rituales requieren disciplina y fortaleza mental para prepararse. Cualquier error podría ser el último que cometa un hechicero descuidado.\nDespués de una cuidadosa preparación, el [bs_ritual|E] está finalmente listo. Ahora solo necesito el momento y lugar adecuados para lanzarlo." 
 ritual_necromagic_casting_travel_confirm: "Adelante, hacia la ubicación del [bs_ritual|E]." 

