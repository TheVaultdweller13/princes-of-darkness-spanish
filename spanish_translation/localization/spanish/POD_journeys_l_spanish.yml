 seek_knowledge_sorcery_name: "Aprender Numinum (#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#!)"
 seek_knowledge_sorcery_desc: "#TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#! es una forma simple de magia que incluso los mortales no despiertos pueden aprender. Abarca una gran variedad de habilidades mágicas: #TOOLTIP:PERK,numina_conveyance_5_perk #L Transporte#!#!, #TOOLTIP:PERK,numina_conjuration_4_perk #L Conjuración#!#!, #TOOLTIP:PERK,numina_divination_5_perk #L Adivinación#!#!, #TOOLTIP:PERK,numina_enchantment_2_perk #L Encantamiento#!#!, y muchas más. Un practicante hábil podría incluso usar [GetPerk('numina_alchemy_5_perk').GetName(GetPlayer)] o [GetPerk('numina_healing_6_perk').GetName(GetPlayer)] para alcanzar la inmortalidad."
 seek_knowledge_sorcery_effects: "Aprenderás la ubicación de un maestro que conoce #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#!. Después de viajar allí, puedes adquirir el [trait|E] [GetTrait('sorcerer').GetName(GetPlayer)], que te permite desbloquear [perks|E] en la rama de Hechicería del [lifestyle|E] de #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#!."
 seek_knowledge_sorcery_isvalid: "$EFFECT_LIST_BULLET$Tu [faith|E] no debe considerar la #TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_magicraft_crime #L Magia#!#! un [crime|E]."
 seek_knowledge_sorcery_tt: "Aprenderé los secretos de la magia lineal."
 seek_knowledge_sorcery_planning_title: "La Búsqueda de la Magia Lineal"
 seek_knowledge_sorcery_planning_desc: "Después de estudiar detenidamente tomos esotéricos y leer varios tratados sobre #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#!, ahora tengo una comprensión decente de su teoría.\n\nSin embargo, la práctica es otro asunto. Necesitaré un maestro antes de poder llamarme [GetTrait('sorcerer').GetName(GetPlayer)] en serio.\n\nMis exploradores me han dicho dónde se puede encontrar a esa persona."
