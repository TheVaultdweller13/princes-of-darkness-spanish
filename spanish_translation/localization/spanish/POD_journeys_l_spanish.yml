 seek_knowledge_presence_name: "Aprender Disciplina ([GetTrait('presence').GetName(GetNullCharacter)])"
 seek_knowledge_presence_desc: "[GetTrait('presence').GetName(GetNullCharacter)] es la $pod_discipline$ del atractivo sobrenatural. Desbloquea varias habilidades relacionadas con las emociones, como [GetPerk('entrancement_perk').GetName(GetPlayer)] o [GetPerk('lingering_kiss_perk').GetName(GetPlayer)]. También puede encubrir violaciones de [the_masquerade|E] mediante [GetPerk('majesty_perk').GetName(GetPlayer)]."
 seek_knowledge_presence_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('presence').GetName(GetNullCharacter)]. Después de viajar allí, puedes adquirir el [trait|E] de la $pod_discipline$, que te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('presence').GetName(GetNullCharacter)]."
 seek_knowledge_presence_tt: "Influenciando corazones y mentes."
 seek_knowledge_presence_planning_title: "La Búsqueda de Presencia"
 seek_knowledge_presence_planning_desc: "He despertado mi sangre y me he preparado lo mejor que he podido, pero los detalles más finos de [GetTrait('presence').GetName(GetNullCharacter)] aún se me escapan.\n\nSi quiero dominar esta $pod_discipline$ por completo, necesitaré un maestro.\n\nAfortunadamente, mis exploradores me han dicho dónde se puede encontrar a esa persona."
 seek_knowledge_presence_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_presence_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_presence_travel_title: "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_presence_travel_desc: "Estoy emocionado por la oportunidad de aprender [GetTrait('presence').GetName(GetNullCharacter)]. Mis súbditos no podrán quitar sus ojos de mí. ¿Será eso una bendición o una maldición?"
 seek_knowledge_presence_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
