 seek_knowledge_animalism_name: "Aprender Disciplina ([GetTrait('animalism').GetName(GetNullCharacter)])"
 seek_knowledge_animalism_desc: "[GetTrait('animalism').GetName(GetNullCharacter)] es la $pod_discipline$ de control sobre los animales. Desbloquea varias habilidades relacionadas con animales, como [GetPerk('bond_famulus_perk').GetName(GetPlayer)] o [GetPerk('call_of_the_wild_perk').GetName(GetPlayer)]."
 seek_knowledge_animalism_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('animalism').GetName(GetNullCharacter)]. Después de viajar allí, puedes adquirir el [trait|E] de la $pod_discipline$, que te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('animalism').GetName(GetNullCharacter)]."
 seek_knowledge_animalism_tt: "Las bestias de la noche me obedecerán."
 seek_knowledge_animalism_planning_title: "La Búsqueda de Animalismo"
 seek_knowledge_animalism_planning_desc: "He despertado mi sangre y me he preparado lo mejor que he podido, pero los detalles más finos de [GetTrait('animalism').GetName(GetNullCharacter)] aún se me escapan.\n\nSi quiero dominar esta $pod_discipline$ por completo, necesitaré un maestro.\n\nAfortunadamente, mis exploradores me han dicho dónde se puede encontrar a esa persona."
