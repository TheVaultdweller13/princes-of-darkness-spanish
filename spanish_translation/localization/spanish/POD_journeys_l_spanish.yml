 seek_knowledge_tapestry_desc: "Tapiz es el arte del chi de usar las líneas de dragón a su máximo potencial. Mediante la práctica del Tapiz, el vampiro se sintoniza con las fuerzas del Yin y el Yang en el viento, el agua y el suelo, y luego manipula esas fuerzas para diversos fines."
