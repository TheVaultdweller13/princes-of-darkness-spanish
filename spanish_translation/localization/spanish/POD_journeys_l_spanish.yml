 seek_knowledge_mytherceria_name: "Aprender Disciplina Rara ([GetTrait('mytherceria').GetName(GetNullCharacter)])"
 seek_knowledge_mytherceria_desc: "[GetTrait('mytherceria').GetName(GetNullCharacter)] es una $pod_discipline$ de Engaño, practicada por los linajes [GetTrait('maeghar').GetName(GetNullCharacter)] y [GetTrait('kiasyd').GetName(GetNullCharacter)]. Mejora los [schemes|E] del practicante y le otorga varios poderes atribuidos a las Hadas, como [GetPerk('aura_absorption_perk').GetName(GetPlayer)] o [GetPerk('riddle_phantastique_perk').GetName(GetPlayer)]."
 seek_knowledge_mytherceria_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('mytherceria').GetName(GetNullCharacter)]. Después de viajar allí, puedes adquirir el [trait|E] de la $pod_discipline$, que te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('mytherceria').GetName(GetNullCharacter)]."
 seek_knowledge_mytherceria_tt: "Aprenderé los secretos de las Hadas."
 seek_knowledge_mytherceria_planning_title: "La Búsqueda de Miterceria"
 seek_knowledge_mytherceria_planning_desc: "He despertado mi sangre y me he preparado lo mejor que he podido, pero los detalles más finos de [GetTrait('mytherceria').GetName(GetNullCharacter)] aún se me escapan.\n\nSi quiero dominar esta $pod_discipline$ por completo, necesitaré un maestro.\n\nAfortunadamente, mis exploradores me han dicho dónde se puede encontrar a esa persona."
