 breaking_the_blond_bond_name: "Rompiendo el Vínculo de Sangre"
 breaking_the_blond_bond_desc: "Estás [Glossary('Blood Bound','game_concept_bloodbond_desc')], lo que significa que la mera idea de #italic rebelión#! es difícil de concebir, superada por el amor fabricado que corre por la sangre.\n\nPero incluso ese amor no puede evitar que tu ser interior vea lo que está sucediendo y acoja la idea perdida hace tiempo de la libertad."
 breaking_the_blond_bond_effects: "Comenzarás un largo [journey|E] para disminuir lentamente tu [Glossary('Blood Bond','game_concept_bloodbond_desc')] a un nivel donde sea posible huir o actuar contra tu [Glossary('Domitor','game_concept_domitor_desc')]. Ten en cuenta que este proceso requiere toda tu fuerza de voluntad y cualquier [mental_break|E] hará fracasar este empeño instantáneamente. Además, completar cualquier [bound_ghoul_mision_with_icon|E] revertirá tu progreso en un #N 10%#!."
 breaking_the_blond_bond_tt: "Incluso los Vínculos no son eternos."
 breaking_the_blond_bond_planning_title: "Cerca, pero no lo suficiente"
 breaking_the_blond_bond_planning_desc: "Estás cerca, puedes sentir que tu amor se degrada a una simple obsesión. Sin embargo, todavía necesitas un último empujón para ser verdaderamente libre."
 breaking_the_blond_bond_planning_confirm: "¿Ese amor era... falso?"
 breaking_the_blond_bond_planning_decline: "$POD_journey_planning_decline_default$"
 breaking_the_blond_bond_isvalid: "Para comenzar este [journey|E], necesitas estar en el nivel 0 de [stress|E]."
 
