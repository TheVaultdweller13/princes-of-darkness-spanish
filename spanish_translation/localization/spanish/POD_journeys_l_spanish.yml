 seek_knowledge_rosselini_name: "Aprender [GetTrait('necromancy').GetName(GetNullCharacter)] (Rosselini)"
 seek_knowledge_rosselini_desc: "Al igual que los Giovanni, los Rossellini tenían fuertes lazos con Venecia, donde ambas familias practicaban la nigromancia. Por otros magos, los Rossellini son a menudo considerados los nigromantes más talentosos. Son conocidos por su trato cruel (incluso para los estándares de los Giovanni) a sus sirvientes espectros. La mayoría de los nigromantes aprenden su oficio en una búsqueda de poder, pero los Rossellini simplemente lo disfrutan, y ese sadismo casual se puede sentir en los hechizos que crearon."
