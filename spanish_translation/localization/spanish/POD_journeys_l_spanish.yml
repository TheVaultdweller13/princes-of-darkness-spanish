 golconda_widget_desc: "¿Continuar haciendo las paces con tu [Glossary('Bestia','game_concept_beast_desc')]?"
 golconda_widget_tt: "Comenzarás inmediatamente otro [journey|E] para obtener información sobre [golconda|E].\nCoste: [piety_i|E] #V 1000#!"
 
 golconda_3_name: "El Suspiro"
 golconda_3_desc: "Toda mi preparación me ha llevado hasta esto. Me enfrentaré a [Glossary('La Bestia','game_concept_beast_desc')], de una vez por todas."
 golconda_3_effects: "Entrarás en los rincones más profundos de tu alma para el enfrentamiento final.\n\n#X Basado en tu [trait_level_track_xp|E] como [GetTrait('golconda_seeker').GetName(GetPlayer)], tienes una probabilidad del #V [GetPlayer.MakeScope.ScriptValue('suspire_success_chance')]%#! de salir con tu mente intacta.#!"
 golconda_3_tt: "Todo o nada."
 golconda_3_planning_title: "Destino Final"
 golconda_3_planning_desc: "Sé lo que tengo que hacer. Dejaré que la $pod_vitae$ fortalezca mis sentidos, no muy diferente a usar [GetTrait('auspex').GetName(GetNullCharacter)]. Luego enviaré mi conciencia hacia adentro, al lugar donde reside [Glossary('La Bestia','game_concept_beast_desc')].\n\nLo que no sé es qué me esperará.\n\nSolo hay una forma de descubrirlo."
 golconda_3_planning_confirm: "Hora de dar un salto de fe."
 golconda_3_planning_decline: "Todavía no es el momento de saltar."
