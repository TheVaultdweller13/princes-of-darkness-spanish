 # Fase de viaje
 pilgrimage_to_enoch_travel_title: "Descenso al Inframundo"
 pilgrimage_to_enoch_travel_desc: "El Velo se abre ante ti. El Inframundo aguarda, y con él, la antigua ciudad fantasma de Enoc."
 pilgrimage_to_enoch_travel_confirm: "No hay vuelta atrás ahora."