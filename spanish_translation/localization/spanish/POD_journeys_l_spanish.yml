 seek_knowledge_fortitude_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('fortitude').GetName(GetNullCharacter)]. Después de viajar allí, puedes adquirir el [trait|E] de la $pod_discipline$, que te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('fortitude').GetName(GetNullCharacter)]."
