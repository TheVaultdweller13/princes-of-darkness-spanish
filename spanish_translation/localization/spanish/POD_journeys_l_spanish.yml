 study_true_name_journey_name: "Estudiar Nombres Verdaderos"
 study_true_name_journey_desc: "Los [Glossary('True Names','podgloss.truename')] son, al menos para algunos, el fundamento de la realidad, y conocer el nombre verdadero de algo es tener control total sobre ello. Sin embargo, los nombres verdaderos siempre cambian, lo que hace que aprenderlos sea un proceso largo y arduo."
 study_true_name_journey_effects: "Aprenderás el [Glossary('True Name','podgloss.truename')] de un material, animal o planta aleatorio."
