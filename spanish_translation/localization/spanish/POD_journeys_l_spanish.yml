 realm_mastery_generic_travel_desc: "He reforzado mi comprensión de la etiqueta cortesana y preparado lujosos regalos para los [Select_CString( DidShatteringHappen, 'Perdidos', 'Nobles' )] de [PlayerJourneyDestination.GetHolding.GetCurrentSpecialBuildingType.GetName]. Espero que sea suficiente, sabiendo lo volubles que pueden ser."

 realm_mastery_actor_name: "Alcanzar [GetTrait('realm_actor').GetName(GetNullCharacter)]"
 realm_mastery_actor_desc: "El #TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L Reino del Actor#!#! es el [fae_realm|E] de los conocidos. Un $POD_splat_fae$ con escaso conocimiento de este [fae_realm|E] solo puede lanzar [cantrips|E] sobre personajes que conoce muy bien. Se requiere el dominio si uno quiere lanzar [cantrips|E] sobre sus enemigos odiados."
 realm_mastery_actor_effects: "Viajarás a un bastión libre y solicitarás a los [Select_CString( DidShatteringHappen, 'Perdidos', 'Nobles' )] que te otorguen conocimiento del #TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L Actor#!#! [fae_realm|E]. Si tienes éxito, ganarás el [trait|E] [GetTrait('realm_actor').GetName(GetNullCharacter)], que te permitirá desbloquear la última ventaja en el [lifestyle|E] de #TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L Actor#!#!."
 realm_mastery_actor_isvalid: "$EFFECT_LIST_BULLET$Tienes la [perk|E] [GetPerk('realm_actor_4_perk').GetName(GetPlayer)]\n$realm_mastery_generic_isvalid$"
 realm_mastery_actor_tt: "Encantaré a mis adversarios."
 realm_mastery_actor_planning_title: "La Búsqueda del Dominio del Reino del Actor"
 realm_mastery_actor_planning_desc: "Aunque me he esforzado por liberar mi imaginación, todavía está limitada en algunos aspectos.\n\nSi quiero obtener una comprensión completa del #TOOLTIP:GAME_TRAIT,realm_actor,[GetNullCharacter] #L Reino del Actor#!#!, necesitaré buscar la ayuda de los [Select_CString( DidShatteringHappen, 'Perdidos', 'Nobles' )] que lo han dominado.\n\nEstoy listo para presentar mi caso en uno de los bastiones libres."
