 pilgrimage_to_enoch_planning_title: "El Velo llama"
 pilgrimage_to_enoch_planning_desc: "Tus preparativos están completos. Los rituales se han realizado, las ofrendas hechas, y el camino a través del Velo ha sido trazado tan bien como cualquier ser vivo puede hacerlo.\n\nLa ciudad fantasma de Enoc aguarda en las profundidades del Inframundo."
