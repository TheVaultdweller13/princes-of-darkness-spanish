 seek_knowledge_dominate_desc: "[GetTrait('dominate').GetName(GetNullCharacter)] es la $pod_discipline$ del Control Mental. Permite al usuario [GetPerk('mesmerize_perk').GetName(GetPlayer)] a otros y dar órdenes que deben ser obedecidas. También puede encubrir violaciones de [the_masquerade|E] mediante [GetPerk('the_forgetful_mind_perk').GetName(GetPlayer)]."
 seek_knowledge_dominate_effects: "Aprenderás la ubicación de un maestro que conoce [GetTrait('dominate').GetName(GetNullCharacter)]. Después de viajar allí, puedes adquirir el [trait|E] de la $pod_discipline$, que te permite desbloquear [perks|E] en el [lifestyle|E] de [GetTrait('dominate').GetName(GetNullCharacter)]."
