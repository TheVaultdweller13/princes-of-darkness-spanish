 seek_knowledge_psychic_name: "Aprender Numinum (#TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Poderes Psíquicos#!#!)"
 seek_knowledge_psychic_desc: "Ciertos mortales pueden manifestar #TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Fenómenos Psíquicos#!#!. Estos abarcan una gran variedad de habilidades como #TOOLTIP:PERK,astral_projection_1_perk #L Proyección Astral#!#!, #TOOLTIP:PERK,psychometry_1_perk #L Psicometría#!#!, #TOOLTIP:PERK,animal_psi_3_perk #L Psi Animal#!#!, y muchas más. Se dice que las habilidades psíquicas son innatas, pero quizás hay formas de forzar la mente a abrirse..."
 seek_knowledge_psychic_effects: "Aprenderás la ubicación de un maestro que conoce #TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Poderes Psíquicos#!#!. Después de viajar allí, puedes adquirir el [trait|E] [GetTrait('psychic').GetName(GetPlayer)], que te permite desbloquear [perks|E] en el [lifestyle|E] de #TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Psi#!#!."
 seek_knowledge_psychic_tt: "Despertaré el poder de mi mente."
 seek_knowledge_psychic_planning_title: "La Búsqueda de Poderes Psíquicos"
 seek_knowledge_psychic_planning_desc: "Después de estudiar detenidamente tomos esotéricos y leer varios tratados sobre #TOOLTIP:GAME_TRAIT,psychic,[GetNullCharacter] #L Psi#!#!, ahora tengo una comprensión decente de su teoría.\n\nDesafortunadamente, ni la teoría ni la práctica pueden desbloquear verdaderamente el potencial de mi mente. Alguien con conocimientos tendrá que abrirla. Por la fuerza, si es necesario.\n\nMis exploradores me han dicho dónde se puede encontrar a esa persona."
