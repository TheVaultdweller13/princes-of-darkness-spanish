 seek_knowledge_obfuscate_desc: "[GetTrait('obfuscate').GetName(GetNullCharacter)] es la $pod_discipline$ del Sigilo. Mejora los [schemes|E] y la [scheme_resistance|E] del usuario en general. También desbloquea la capacidad de [GetPerk('vanish_perk').GetName(GetPlayer)]."
