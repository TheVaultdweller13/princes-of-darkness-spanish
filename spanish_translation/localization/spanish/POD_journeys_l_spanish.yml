 seek_knowledge_abombwe_desc: "[GetTrait('abombwe').GetName(GetNullCharacter)] es la $pod_discipline$ de aprovechar la [Glossary('Bestia','game_concept_beast_desc')], practicada por el linaje [GetDynastyHouseByID('house_akunanse').GetName]. [GetPerk('taming_the_beast_perk').GetName(GetPlayer)] puede traer beneficios, si uno está dispuesto a aceptar el riesgo."
