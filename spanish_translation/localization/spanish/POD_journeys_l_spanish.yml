 assemble_artifact_planning_title: "Otra Pieza del Rompecabezas"
 assemble_artifact_planning_desc: "Por fin, mis exploradores han regresado a mí con buenas noticias. Han descubierto dónde se puede encontrar otro capítulo del Libro de Nod. Recuperarlo me acercaría un paso más a completar el volumen.\n\nSolo puedo esperar que quien lo posee actualmente pueda ser... persuadido para desprenderse de él."
