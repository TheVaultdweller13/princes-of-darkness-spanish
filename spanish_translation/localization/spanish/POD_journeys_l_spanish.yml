 seek_knowledge_demonology_name: "Aprender #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Demonología#!#!"
 seek_knowledge_demonology_desc: "#TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Demonología#!#!, en sí misma, es meramente el estudio académico de los $POD_splat_demon_plural$. Por supuesto, la mayoría de los demonólogos no se contentan con la simple teoría, y toman la ruta mucho más drástica de vender su alma — una vía hacia muchas habilidades que algunos consideran antinaturales."
 seek_knowledge_demonology_effects: "Aprenderás la ubicación de un maestro que conoce #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Demonología#!#!. Después de viajar allí, puedes adquirir el [trait|E] [GetTrait('demonology').GetName(GetPlayer)], que abre la posibilidad de convertirte en un [GetTrait('witch').GetName(GetNullCharacter)] — ya sea a través de la difícil tarea de [diabolism_binding|E] a un [GetTrait('demon').GetName(GetNullCharacter)] a tu voluntad, o el camino mucho más fácil de [Concept('convertirte en su esclavo voluntario','esclavitud')|E]..."
 seek_knowledge_demonology_isvalid: "$EFFECT_LIST_BULLET$Debes estar en un mundo donde los $POD_splat_demon_plural$ sean uno de los [splats|E] disponibles."
 seek_knowledge_demonology_requirement_date: "Comenzaste en un marcador solo para [GetTrait('vampire').GetName(GetNullCharacter)], donde los $POD_splat_demon_plural$ (y muchos otros [splats|E]) no están disponibles"
 seek_knowledge_demonology_tt: "Pagaré cualquier precio por el verdadero poder."
 seek_knowledge_demonology_planning_title: "La Búsqueda de la Demonología"
 seek_knowledge_demonology_planning_desc: "Después de estudiar detenidamente tomos prohibidos y leer tratados blasfemos sobre #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Demonología#!#!, ahora tengo una comprensión decente de su teoría.\n\nSin embargo, la práctica es otro asunto. Necesitaré un maestro antes de poder llamarme un #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Demonólogo#!#! en serio.\n\nMis exploradores me han dicho dónde se puede encontrar a esa persona."

 seek_knowledge_demonology_planning_confirm: "$POD_journey_planning_confirm_default$"
 seek_knowledge_demonology_planning_decline: "$POD_journey_planning_decline_default$"
 seek_knowledge_demonology_travel_title: "Una Búsqueda de Conocimiento Prohibido"
 seek_knowledge_demonology_travel_desc: "No puedo negar cierta aprensión ante la idea de aprender #TOOLTIP:GAME_TRAIT,demonology,[GetNullCharacter] #L Demonología#!#!, pero he tomado una decisión. Seré despreciado, vilipendiado, incluso cazado. El mundo me rechazará. Pero al final... yo seré el último en reír."
 seek_knowledge_demonology_travel_confirm: "$POD_journey_travel_confirm_seek_knowledge$"
 
