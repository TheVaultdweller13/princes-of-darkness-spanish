 hunt_in_capital_name: "Cazar en tu Capital"
 hunt_in_capital_desc: "Cada $pod_cainite$ está impulsado por la sed de sangre, y yo no soy diferente. El dominio de [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] será mi coto de caza en las próximas noches.\n\n#help (También puedes cazar a un personaje específico haciendo clic derecho sobre él y seleccionando el [journey|E] de Caza mediante [character_interaction|E].)#!"
 #hunt_in_capital_effects: ""
 hunt_in_capital_tt: "Es hora de saciar mi sed."
 hunt_in_capital_planning_title: "En la Cacería"
 hunt_in_capital_planning_desc: "Una vez más es hora de saciar mi hambre con los mortales de [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier].\n\nDebería buscar tiempo para cazar cuando esté menos ocupado."
 hunt_in_capital_planning_desc_gui: "Mientras deambulo por las calles de [GetPlayer.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier], encuentro a varios mortales cercanos que serían vulnerables a mis maquinaciones.\n\nSolo tengo tiempo para perseguir a uno de ellos."
 hunt_in_capital_planning_confirm: "Desafortunadamente, no puedo cazar ahora mismo."
 hunt_in_capital_planning_confirm_gui: "Cazaré a [GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstNameNoTooltip] y beberé su sangre."
 hunt_in_capital_planning_confirm_gui_tt: "$EFFECT_LIST_BULLET$Puedes decidir qué hacer con [GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstNameNoTooltip] una vez que [GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetSheHe] esté en tus garras.\n$EFFECT_LIST_BULLET$[GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstNameNoTooltip] permanecerá en tu corte después.\n$EFFECT_LIST_BULLET$No volverás a ver a los otros mortales."
 hunt_in_capital_planning_restart: "Ninguna de estas opciones me conviene. Intentaré otra cacería."
 hunt_in_capital_planning_decline: "$POD_journey_planning_decline_default$"
 hunt_in_capital_planning_decline_gui: "Cambié de opinión. Abandono la cacería."
 hunt_in_capital_planning_decline_tt: "Tu [journey|E] hacia $POD_current_journey$ terminará."
 hunt_in_capital_planning_decline_tt_2: "No volverás a ver a estos mortales."
 hunt_in_capital_widget_desc: "¿Continuar cazando a #bold [Localize(Concatenate( 'POD_find_mortals_interaction_', GetPlayer.MakeScope.Var('hunt_in_capital_selection').GetFlagKey ))]#!?"
 hunt_in_capital_widget_tt: "Comenzarás inmediatamente otro [journey|E] para cazar a #bold [Localize(Concatenate( 'POD_find_mortals_interaction_', GetPlayer.MakeScope.Var('hunt_in_capital_selection').GetFlagKey ))]#! en tu capital.\n[GetPlayer.Custom('PODShowJourneyCostHunt')]"
 cthonic_womb_widget_desc: "¿Convertir a [EventWindowWidget.GetScope.sC('victim').GetShortUINameNoTooltip] en un [GetTrait('wraith').GetName(GetNullCharacter)] después de matar[lo/a]?"
 cthonic_womb_widget_tt: "#help Esto solo funciona si vacías completamente a tu víctima.#!"
 
 fera_training_name: "Entrenar con tu [GetPlayer.Custom('PODCoterieNoTooltip')]"
 fera_training_desc: "Mucho más que simples amigos, los miembros de tu [GetPlayer.Custom('PODCoterieNoTooltip')] son los que siempre te respaldarán en las situaciones más difíciles. Debéis estar preparados para todo como equipo."
 fera_training_effects: "Revisarás tu [GetPlayer.Custom('PODCoterie')] y decidirás en qué forma de entrenamiento centrarte."
 fera_training_isvalid: "$EFFECT_LIST_BULLET$Necesitas tener una [GetPlayer.Custom('PODCoterie')] con al menos #V 1#! otro miembro."
 fera_training_tt: "[GetPlayer.GetFaith.HighGodName] necesita soldados poderosos."
 fera_training_planning_title: "Afilando Garra y Colmillo"
 fera_training_planning_desc: "Los miembros de $POD_player_coterie$ han encontrado tiempo para reunirse de nuevo en otra sesión de entrenamiento.\n\nEsto nos ayudará a trabajar mejor en equipo y a hacer el trabajo que [GetPlayer.GetFaith.HighGodName] necesita que hagamos."
 fera_training_planning_confirm: "¡Comenzaremos la sesión de entrenamiento de inmediato!"
 fera_training_planning_decline: "$POD_journey_planning_decline_default$"
 fera_training_widget_desc: "¿Continuar entrenando con tu [GetPlayer.Custom('PODCoterie')]?"
 fera_training_widget_tt: "Comenzarás inmediatamente otro [journey|E] para entrenar con tu [GetPlayer.Custom('PODCoterie')]."

 fera_spirit_quest_name: "Embarcarse en una Búsqueda Espiritual"
 fera_spirit_quest_desc: "Los espíritus son los maestros del mundo de los $glossary_fera$, pero aprender sus dones tiene un precio. Una Búsqueda Espiritual te llevará en un viaje lleno de encuentros diversos."
 fera_spirit_quest_effects: "Podrás elegir entre una lista de recompensas al final de tu búsqueda:\n$EFFECT_LIST_BULLET$[lifestyle_experience|E] de $glossary_fera$\n$EFFECT_LIST_BULLET$[artifacts|El] Fetiches\n$EFFECT_LIST_BULLET$[traits|E] de Estilo de Vida o Fama\n$EFFECT_LIST_BULLET$Un [GetTrait('spirit').GetName(GetNullCharacter)] amistoso\n\nLas recompensas disponibles, así como su calidad o cantidad, dependen de la dificultad de la búsqueda elegida, tu [learning|E] y [piety_level|E]."
 fera_spirit_quest_tt: "Atiende sus súplicas y aprende sus poderes."
 fera_spirit_quest_planning_title: "Búsqueda Completada"
 fera_spirit_quest_planning_desc: "Tu Búsqueda Espiritual ha llegado a su fin. Es hora de comunicarte con los Espíritus y reclamar tus recompensas."
 fera_spirit_quest_planning_confirm: "Mi tarea está completa."
 fera_spirit_quest_planning_decline: "$POD_journey_planning_decline_default$"


 mokole_mnesis_quest_name: "Viaje a través de la Mnesis"
 mokole_mnesis_quest_desc: "Los poderes del antiguo [GetTrait('mokole').GetName(GetNullCharacter)] se han perdido en los tiempos. Con el poder de la Mnesis, un Mokolé puede nadar por el río del tiempo a través de los recuerdos de sus ancestros en busca de estos poderes olvidados."
 mokole_mnesis_quest_effects: "Obtendrás [lifestyle_experience|E] de [mnesis_lifestyle|E] al final del [journey|E]. La duración y dificultad del [journey|E] están determinadas por lo lejos que intentes recordar.\nLa cantidad de [lifestyle_experience|E] que obtienes está determinada por lo siguiente:\n$EFFECT_LIST_BULLET$[learning|E]\n$EFFECT_LIST_BULLET$[prestige_level|E]\n$EFFECT_LIST_BULLET$[piety_level|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level|E]\n$EFFECT_LIST_BULLET$[trait_level_track_xp|E] de [GetTrait('mokole').GetName(GetNullCharacter)]\n\nSe aplicará un modificador negativo durante el viaje mientras entras en un sueño profundo. También puedes ser atacado por Cazadores de Sueños, $POD_splat_spirit_plural$ oportunistas que buscan hacerte daño."
 mokole_mnesis_quest_tt: "El Río de la Mnesis es profundo."
 mokole_mnesis_quest_planning_title: "Recuerdos Recuperados"
 mokole_mnesis_quest_planning_desc: "Tu viaje a través de los ríos de la Mnesis ha terminado.\nMuchas visiones y recuerdos todavía se aferran a tu mente, pero ¿qué aprendiste?"
 mokole_mnesis_quest_planning_confirm: "Ahora lo recuerdo."
 mokole_mnesis_quest_planning_decline: "$POD_journey_planning_decline_default$"

 
