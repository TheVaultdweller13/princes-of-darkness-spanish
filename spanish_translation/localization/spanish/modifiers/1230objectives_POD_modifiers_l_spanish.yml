l_spanish:
 mithras_bane_modifier: "Perdición de Mitras"
 mithras_bane_modifier_desc: "Este prestigioso Vampiro ha expulsado a Mitras y a su especie de Britania. Tal hazaña es conocida por doquier."
 politically_secure_modifier: "Políticamente Seguro"
 politically_secure_modifier_desc: "Tus elecciones recientes te han hecho respetado entre tus pares. Tu posición parece segura por el momento."
 hostile_shadows_modifier: "Sombras Hostiles"
 hostile_shadows_modifier_desc: "Tu meteórico ascenso ha causado envidia en muchos. Te aguardarán dagas en las sombras durante mucho tiempo."
 blood_horn_modifier: "Cuerno de Sangre"
 blood_horn_modifier_desc: "Has redescubierto el famoso Cuerno de Sangre de Odín, un artefacto que puede crear sangre a partir de cualquier líquido."
 broken_authority_modifier: "Autoridad Quebrantada"
 broken_authority_modifier_desc: "Este personaje ha perdido una cantidad alarmante de credibilidad: siempre un problema en la política Vampírica."
 capital_past_modifier: "Reliquia de Al Ándalus"
 capital_past_modifier_desc: "Los mortales han superado Al Ándalus, pero esta ciudad tiene una sociedad no-muerta dedicada a preservar recuerdos de su herencia compartida."
 sword_of_troile_modifier: "Espada de Troile"
 sword_of_troile_modifier_desc: "Una de las armas más poderosas de la historia de los Kindred, esta espada de cristal fue empuñada por la propia Troile durante sus numerosas batallas por la defensa de Cartago."
 #zmei_legacy_perk_effect: "# Criaturas temibles de inmenso poder, antaño sirvientes del $glossary_wyrm$, ahora están vinculadas a Baba Yaga, la Pequeña Abuela.#!" 
 babayaga_victory_opinion: "Leal a la Anciana."
 eyes_and_ears_modifier: "Ojos y Oídos"
 eyes_and_ears_modifier_desc: "Como líder del $pod_clan$ Nosferatu, tu red de informantes no tiene rival."
 fortified_alamut_modifier: "Alamut Unida"
 fortified_alamut_modifier_desc: "Libre de luchas internas, el Nido del Águila se alza indomable como la fortaleza principal del mundo $pod_cainita$."
 path_of_the_zealot_modifier: "Haqimita Zelote"
 path_of_the_zealot_modifier_desc: "Unidos bajo el estandarte de la fe, cada Assamita es ahora un poderoso defensor de la verdad."
 path_of_the_diplomat_modifier: "Haqimita Diplomático"
 path_of_the_diplomat_modifier_desc: "Cada Assamita está ahora bajo un nuevo liderazgo, permitiéndoles solicitar favores y amigos de todo el mundo."
 path_of_the_sorcerer_modifier: "Haqimita Hechicero"
 path_of_the_sorcerer_modifier_desc: "Reclusos, pero ahora unidos en su investigación, el $pod_clan$ Assamita es el guardián de muchos secretos innombrables."
 eternal_consul_modifier: "Cónsul Eterno"
 eternal_consul_modifier_desc: "El gobernante de la Roma Pecadora es una criatura encantadora, que solo necesita un susurro para hacer realidad los deseos más oscuros de la mayoría."
 lasombra_chronicles_modifier: "Crónicas Lasombra"
 lasombra_chronicles_modifier_desc: "El volumen conclusivo sobre el ascenso del salvador del $pod_clan$ Lasombra, la perdición de los [Glossary('Ashirra','game_concept_ashirra_desc')]."
 eternal_mullah_modifier: "Mullah Eterno"
 eternal_mullah_modifier_desc: "El victorioso Mullah Eterno de los [Glossary('Ashirra','game_concept_ashirra_desc')] es un ser de inmensa autoridad espiritual y temporal."
 ashirra_castle_modifier: "Castel del Ombro [Glossary('Ashirra','game_concept_ashirra_desc')]"
 ashirra_castle_modifier_desc: "A medida que el $pod_clan$ Lasombra llega a ser dominado por los [Glossary('Ashirra','game_concept_ashirra_desc')], se construye una nueva sede, más adecuada."
 impressed_westerner_opinion: "Gangrel Occidental Impresionado"             
 collapse_civilisation_modifier: "Colapso de la Civilización"
 collapse_civilisation_modifier_desc: "Los lobos están a la puerta, y apenas puedes mantenerlos fuera. Tu control ya no se extiende mucho más allá de tu salón del trono."
 alpha_gangrel_modifier: "Gangrel Alfa"
 alpha_gangrel_modifier_desc: "Has derrotado a todos los desafiantes. Todo el $pod_clan$ te trata con respeto, si no con obediencia."
 prime_councilor_modifier: "Consejero Supremo"
 prime_councilor_modifier_desc: "Regente del $pod_clan$ en lugar de Tremere, este individuo tiene acceso a conocimiento poco común y puede contar con la lealtad de sus clanmates."
 prime_curse_modifier: "Maldición Suprema"
 prime_curse_modifier_desc: "La maldición del Consejero Supremo ha tocado a este individuo, dificultándole incluso pensar con claridad."
 dark_nobility_modifier: "Nobleza Oscura"
 dark_nobility_modifier_desc: "Dominando sobre castillos sombríos y una población oprimida, el $pod_clan$ Tzimisce es uno de los gobernantes más intimidantes."
 kupala_empowered_modifier: "Potenciado por Kupala"
 kupala_empowered_modifier_desc: "Has hecho un trato con el diablo. Literalmente."
 kupala_depowered_modifier: "Debilitado por Kupala"
 kupala_depowered_modifier_desc: "El Atado de los Cárpatos ha tomado la fuerza vital de este individuo para potenciar a su sirviente favorito."
 sargon_codex_modifier: "Códice Sargon"
 sargon_codex_modifier_desc: "El poder supremo, o al menos el conocimiento, es tuyo. Tu cordura ya no te pertenece, eso sí."
 grateful_brethren_opinion: "Hermanos Agradecidos"
 sargon_fragment_modifier: "Fragmento Sargon"
 sargon_fragment_modifier_desc: "Un mero fragmento del destruido Códice Sargon sigue siendo un poderoso receptáculo de profecías y percepciones."
 pseudo_third_modifier: "Pseudo Tercero"
 pseudo_third_modifier_desc: "No completaste la $pod_diablerie$ del [Glossary('Antediluviano','game_concept_antediluvian_desc')], pero aún así estás casi al nivel de poder y prestigio de una 3ra generación."
 cappadocian_purge_modifier: "Purga Cappadocia"
 cappadocian_purge_modifier_desc: "El nuevo $pod_clan$ Giovanni se enfoca en exterminar a sus antiguos benefactores, y a cualquiera que les dé cobijo."
 kill_on_sight_modifier: "Matar a la Vista"
 kill_on_sight_modifier_desc: "Señalados por sus enemigos, estos personajes viven con el tiempo contado, siendo cazados en cada esquina."
 decentralized_rule_modifier: "Gobierno Descentralizado"
 decentralized_rule_modifier_desc: "Eres meramente el pacificador de una variedad de constructos políticos diferentes. Como tal, aunque seas respetado, no siempre te obedecen."
 serpent_allure_modifier: "Atractivo de la Serpiente"
 serpent_allure_modifier_desc: "Eres bendecido por el propio Set, portando un aura palpable que promete la satisfacción de todo deseo oscuro."
 sword_of_samiel_modifier: "Espada de Samiel"
 sword_of_samiel_modifier_desc: "El legendario primer Guerrero Salubri fue un luchador sin par, y estaba dispuesto a ir más allá de su deber contra las fuerzas de la oscuridad."
 saulot_heir_modifier: "Heredero de Saulot"
 saulot_heir_modifier_desc: "Eres una criatura tan sabia como el propio Saulot; algunos incluso dicen que finalmente encontraste la [golconda|E] después de todos esos años de conflicto."
 usurpers_exposed_modifier: "Usurpadores Expuestos"
 usurpers_exposed_modifier_desc: "El $pod_clan$ Tremere ha sido expuesto por lo que es. Un puñado de mentirosos robadores de almas que casi llevaron a tu $pod_clan$ a la extinción por su propio beneficio personal."
 herald_of_the_end_modifier: "El Gran Enemigo"
 herald_of_the_end_modifier_desc: "Eres Nergal reencarnado, el heraldo de la perdición y condenación de este mundo maldito. Todos se arrodillarán o morirán."
 demons: "Demonios Atados"
 demons_flavor: "#F Ángeles Caídos de la condenada rebelión de Lucifer. Su prisión abismal tiene debilidades, y pueden ser invocados al plano mortal y atados a un gran costo.#!"
