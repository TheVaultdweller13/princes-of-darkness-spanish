 rebel_conqueror_modifier: "El Conquistador Rebelde de Occidente"
 rebel_conqueror_modifier_desc: "No te inclinas ante ninguna Corte o Ancestro. En tus tierras, tu voluntad es suprema, y ay de aquellos que te desafíen."
 first_magaji_modifier: "Primer Magaji"
 first_magaji_modifier_desc: "El primer Magaji oficialmente reconocido de toda África tiene una importancia tremenda en la política Laibon."
