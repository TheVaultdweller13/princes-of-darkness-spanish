 chosen_of_light_modifier: "Elegido de la Luz"
 chosen_of_light_modifier_desc: "Hay un aura extraña rodeando a este personaje. Como si lo divino mismo lo hubiera elegido para un propósito mayor."
 link_enoch_modifier: "Portal a Enoc"
 link_enoch_modifier_desc: "Enoc, la Primera Ciudad, es el verdadero hogar de los Tal'meha'Ra en el [UmbraGlossaryLocalized('shadowlands','Inframundo')]. Este condado ahora tiene acceso directo a ella y puede obtener recursos de ella a su antojo."
 seed_of_rebellion_modifier: "Semilla de Rebelión"
 seed_of_rebellion_modifier_desc: "El sombrío Tal'mahe'Ra ha plantado la semilla de la desconfianza y la rebelión en este personaje."
 runemages_community_modifier: "Comunidad de Runomagos"
 runemages_community_modifier_desc: "El Salón de Ulf se ha refugiado en esta provincia, proporcionando su influencia mística en su nuevo hogar."
 cursed_by_cathar_modifier: "La Maldición Cátara"
 cursed_by_cathar_modifier_desc: "El último cátaro maldijo tu nombre mientras moría una muerte impía. Te sientes... preocupado."
 cathar_community_modifier: "Comunidad Cátara"
 cathar_community_modifier_desc: "Los últimos cátaros se han refugiado aquí, bajo tu protección. Un hecho que ha molestado a los habitantes."
 lost_in_callous_modifier: "Terror Encarnado"
 lost_in_callous_modifier_desc: "Te temen. Dicen que Dios te ha abandonado. Pero tú sabes que nunca ha estado más cerca."
 hardened_heart_modifier: "Corazón Endurecido"
 hardened_heart_modifier_desc: "Este personaje ha limpiado su corazón del sentimentalismo que se interpone en el camino de lo que debe hacerse."
 bloodline_founder_modifier: "Fundador del linaje"
 bloodline_founder_modifier_desc: "Fundador de su propio linaje, cada miembro de esta estirpe te reconoce como su progenitor."
 firebombs_modifier: "Bombas Incendiarias"
 firebombs_modifier_desc: "Esta persona está armada con globos de cerámica que contienen una sustancia extremadamente inflamable, así como un sistema de ignición."
 firespewer_modifier: "Lanzallamas"
 firespewer_modifier_desc: "Esta persona está armada con un artilugio experimental capaz de expulsar una sustancia inflamable presurizada mientras la enciende simultáneamente."
 masters_of_fire: "Maestros del Fuego"
 masters_of_fire_desc: "Esta facción ha recuperado el secreto del Fuego Griego y ha adaptado el arma a sus necesidades."
 gifts_from_heaven_modifier: "Regalos del Cielo"
 gifts_from_heaven_modifier_desc: "El verdadero dominio del Qiao es otorgado a este personaje, permitiéndole aprender altos niveles de Qiao incluso antes del amanecer del [Glossary('Sexta Edad','game_concept_sixth_age_desc')]."
 keening_modifier: "El Lamento"
 keening_modifier_desc: "El poder del Lamento todavía te protege incluso lejos de la Piedra Negra."
 sufi_mystic_modifier: "Maestro de las Artes Místicas"
 sufi_mystic_modifier_desc: "Tu conocimiento de las fuerzas místicas combinado con las enseñanzas de los Taftani te ha enseñado mucho."
 kabbalah_modifier: "Gran Mekubbal"
 kabbalah_modifier_desc: "Gracias a tu completa comprensión del Talmud secreto, eres un maestro del misticismo judío."
 antediluvian_dominor_modifier: "Ritual Incompleto"
 antediluvian_dominor_modifier_desc: "No completaste perfectamente el ritual de Robo de Sangre, pero aún así parte del poder de la sangre se transfiere a ti."

