 PODElementalAscensionBuff_glome: "Casillas de [POD_health_track|E]: #P +1#!\nMejora los [crafting_nodes|E] básicos de [crafting_forging|E]."
 PODElementalAscensionBuff_kubera: "Coste de oro de [crafting|E]: #P -25%#!\n$passive_cantrip_actor$  Cura [EmptyScope.ScriptValue('POD_ascended_kubera_heal')] de [POD_superficial_damage_with_box|E] a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E], o a ti mismo durante los [single_combat_duel_plural|E]."
 PODElementalAscensionBuff_ondine: "$cantrip_standard_bunk$ Convoca al objetivo a tu corte.\n$cantrip_hard_bunk$ Convoca al objetivo a tu [prison|E]"
 PODElementalAscensionBuff_paroseme: "Mejora el [cantrip|E] [GetTrait('art_stratus').GetName(GetPlayer)] eliminando el límite de tamaño del [army|E]."
 PODElementalAscensionBuff_solimond: "$passive_cantrip_nature$ Según el #underline;TOOLTIP:PODElementalAscensionBuff_solimond_tt nivel#! de $fae_nature_realm$, inflige [POD_superficial_damage_with_box|E] o [POD_aggravated_damage_with_box|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E]."
 PODElementalAscensionBuff_solimond_tt: "[GetPerk('realm_nature_1_perk').GetName(GetPlayer)]: 0 de [POD_superficial_damage_with_box|E]\n[GetPerk('realm_nature_2_perk').GetName(GetPlayer)]: 1 de [POD_superficial_damage_with_box|E]\n[GetPerk('realm_nature_3_perk').GetName(GetPlayer)]: 2 de [POD_superficial_damage_with_box|E]\n[GetPerk('realm_nature_4_perk').GetName(GetPlayer)]: 1 de [POD_aggravated_damage_with_box|E]\n[GetPerk('realm_nature_5_perk').GetName(GetPlayer)]: 1 de [POD_aggravated_damage_with_box|E] y 2 de [POD_superficial_damage_with_box|E]"
 PODElementalAscensionBuff_mannikin: "Obtén la capacidad de usar [noble_arts_lifestyle|E], con la limitación de no poder elegir nunca [perks|E] de #N nivel 4#! o superior."

