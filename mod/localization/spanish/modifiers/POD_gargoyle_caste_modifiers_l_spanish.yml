l_spanish:
 POD_gargoyle_caste_stonewolf_modifier: "Casta de Perros de Piedra Gárgola"
 POD_gargoyle_caste_stonewolf_modifier_desc: "Creada mediante un experimento taumatúrgico con un lupino. Muy peligrosa para un buen perro."
 POD_gargoyle_caste_shade_modifier: "Casta de Sombras Gárgola"
 POD_gargoyle_caste_shade_modifier_desc: "Creada mediante un experimento taumatúrgico con un Lasombra."
 POD_gargoyle_caste_scout_modifier: "Casta de Exploradores Gárgola"
 POD_gargoyle_caste_scout_modifier_desc: "Creada mediante un experimento taumatúrgico, experta en espionaje."
 POD_gargoyle_caste_warrior_modifier: "Casta de Guerreros Gárgola"
 POD_gargoyle_caste_warrior_modifier_desc: "Creada mediante un experimento taumatúrgico, experta en el combate."
 POD_gargoyle_caste_sentinel_modifier: "Casta de Centinelas Gárgola"
 POD_gargoyle_caste_sentinel_modifier_desc: "Creada mediante un experimento taumatúrgico, experta en la guardia."
 POD_gargoyle_caste_blood_modifier: "Casta de Guardianes de Sangre Gárgola"
 POD_gargoyle_caste_blood_modifier_desc: "Creada mediante un experimento taumatúrgico con un Tremere. ¿Valió la pena el coste de los lanzadores de hechizos?"
 POD_gargoyle_caste_caryatid_modifier: "Casta de Cariátides Gárgola"
 POD_gargoyle_caste_caryatid_modifier_desc: "Creada mediante un experimento taumatúrgico con un Toreador, una estatua hermosa pero mortal."
 POD_gargoyle_caste_boyar_modifier: "Casta de Boyardos Gárgola"
 POD_gargoyle_caste_boyar_modifier_desc: "Creada mediante un experimento taumatúrgico con un Ventrue. Capaz de comandar animales y liderar a otras gárgolas." 
 POD_gargoyle_caste_chatterer_modifier: "Casta de Parlanchines Gárgola"
 POD_gargoyle_caste_chatterer_modifier_desc: "Creada mediante un experimento taumatúrgico con un Malkavian. Su ruido constante puede volver locos a muchos." 
 POD_gargoyle_caste_bingmayong_modifier: "Casta de Bingmayong Gárgola"
 POD_gargoyle_caste_bingmayong_modifier_desc: "Creada mediante un experimento taumatúrgico con un [GetTrait('kueijin').GetName( GetNullCharacter )], un autómata fabricado con materiales orientales exóticos."  
 POD_gargoyle_caste_bone_modifier: "Casta de Matracas Gárgola"
 POD_gargoyle_caste_bone_modifier_desc: "Creada mediante un experimento taumatúrgico con un Capadocio."
 POD_gargoyle_caste_onyx_cat_modifier: "Casta de Gatos de Ónice Gárgola"
 POD_gargoyle_caste_onyx_cat_modifier_desc: "Creada mediante un experimento taumatúrgico con un bastet." 
 POD_gargoyle_caste_golden_manticore_modifier: "Casta de Mantícoras Doradas Gárgola"
 POD_gargoyle_caste_golden_manticore_modifier_desc: "Creada mediante un experimento taumatúrgico con un bastet de la tribu Simba."  
 POD_gargoyle_caste_serpent_modifier: "Casta de Serpientes de Arena Gárgola"
 POD_gargoyle_caste_serpent_modifier_desc: "Creada mediante un experimento taumatúrgico con un Seguidor de Set."
 POD_gargoyle_caste_fairy_modifier: "Casta de Hadas Gárgola"
 POD_gargoyle_caste_fairy_modifier_desc: "Creada mediante un experimento taumatúrgico con uno de los Seres Feéricos."
 POD_gargoyle_caste_kintsugi_modifier: "Casta de Kintsugi Gárgola"
 POD_gargoyle_caste_kintsugi_modifier_desc: "Creados inicialmente por la fusión alquímica de un Kizoku y un Bushi, los Kintsugi parecen porcelana fina rota y restaurada."
 POD_gargoyle_caste_rogata_modifier: "Casta de Rogata Gárgola"
 POD_gargoyle_caste_rogata_modifier_desc: "Creados inicialmente por la síntesis taumatúrgica de un Bushi y un Chibo, Monomi o Kishu, los Rogata parecen estatuas de hierro fundido."
 POD_gargoyle_caste_totai_modifier: "Casta de Totai Gárgola"
 POD_gargoyle_caste_totai_modifier_desc: "Creados inicialmente por ritos de moldeado de carne entre Kizoku y Chibo, Monomi o Kishu, los Totai reciben su nombre de las muñecas de cerámica a las que se parecen."
