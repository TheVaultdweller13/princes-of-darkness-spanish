 #################
 # Pack Totems
 #################

 falcon_totem_modifier: "Tótem de Manada: Halcón"
 falcon_totem_modifier_desc: "El halcón odia a los cobardes y él mismo los abatirá si es necesario."
 grandfatherthunder_totem_modifier: "Tótem de Manada: Abuelo Trueno"
 grandfatherthunder_totem_modifier_desc: "El Abuelo enseña paciencia y planes meticulosos, pero no siente afecto por los gobernantes débiles."
 stag_totem_modifier: "Tótem de Manada: Ciervo"
 stag_totem_modifier_desc: "El ciervo es la encarnación perfecta de la naturaleza: amoroso y atento con sus amigos, pero terrible y despiadado con sus enemigos."
 fenris_totem_modifier: "Tótem de Manada: Gran Fenris"
 fenris_totem_modifier_desc: "El Gran Fenris siempre está cubierto de sangre, y espera que sus hijos también lo estén."
 pegasus_totem_modifier: "Tótem de Manada: Pegaso"
 pegasus_totem_modifier_desc: "Pegaso y sus hijas protegen los ritos sagrados del mal de los hombres."
 cockroach_totem_modifier: "Tótem de Manada: Cucaracha"
 cockroach_totem_modifier_desc: "La cucaracha tiene el tiempo de su lado. Al final, sus hijos serán los últimos en pie."
 owl_totem_modifier: "Tótem de Manada: Búho"
 owl_totem_modifier_desc: "Los hijos del búho lo ven todo, pero solo revelan sus secretos a quienes realmente escuchan."
 raven_totem_modifier: "Tótem de Manada: Cuervo"
 raven_totem_modifier_desc: "El insaciable hambre de comida, conocimiento y riqueza del cuervo impulsa a sus hijos hacia adelante."
 rat_totem_modifier: "Tótem de Manada: Rata"
 rat_totem_modifier_desc: "La rata tiene un ejército a su disposición. Pocos, si es que alguno, pueden igualar a su innumerable infantería."
 bonyscrap_totem_modifier: "Tótem de Manada: Bonyscrap"
 bonyscrap_totem_modifier_desc: "El espíritu del buitre es un tipo desagradable, pero pocos pueden carroñear como él."
 hatii_totem_modifier: "Tótem de Manada: Hatii"
 hatii_totem_modifier_desc: "El poderoso espíritu del elefante tiene una memoria larga y, para sus amigos, es un aliado fiable sin parangón."
 ika_ika_totem_modifier: "Tótem de Manada: Ika-Ika"
 ika_ika_totem_modifier_desc: "El travieso espíritu mono es un amigo divertido que tener cerca, pero su afán por gastar bromas a cualquiera cercano hace que sea menos respetado por los más estoicos Bastet."
 butterfly_totem_modifier: "Tótem de Manada: mariposa"
 butterfly_totem_modifier_desc: "La siempre cambiante mariposa es la patrona de los corazones pacíficos, aquellos llenos de asombro ante la danza eterna."
 king_cats_totem_modifier: "Tótem de Manada: Rey de los Gatos"
 king_cats_totem_modifier_desc: "El astuto Rey de los Gatos encarna a los Bastet como nadie más. Es el alma de la rebelión valiente y favorece a quienes poseen un ingenio rápido y una hoja aún más rápida."
 king_beasts_totem_modifier: "Tótem de Manada: Rey de las Bestias"
 king_beasts_totem_modifier_desc: "El espíritu del León es un tirano generoso. Si te postras ante él, te concederá una pizca de su impresionante poder."
 mantis_totem_modifier: "Tótem de Manada: Mantis"
 mantis_totem_modifier_desc: "El creador del mundo según algunos folclores, la sabia Mantis se abre paso entre los problemas soñando. Con su maestría sobre los siete niveles de silencio, una solución siempre se presenta a tiempo ante sus seguidores."
 mistress_catkind_totem_modifier: "Tótem de Manada: Señora de la estirpe felina"
 mistress_catkind_totem_modifier_desc: "La encarnación de la esencia femenina, la Señora es una madre afectuosa, una amante apasionada, diosa de la guerra y caminante del misterio, todo al mismo tiempo."
 whispers_totem_modifier: "Tótem de Manada: Susurros"
 whispers_totem_modifier_desc: "El espíritu de los secretos guía a los Bastet inquisitivos hacia descubrimientos, si ellos mismos se abstienen de acciones estrepitosas."
 dragon_totem_modifier: "Tótem de Manada: Dragón"
 dragon_totem_modifier_desc: "El Dragón es grande y feroz, quemando a todos aquellos que se le oponen con su aliento venenoso."
 agni_totem_modifier: "Tótem de Manada: Agni"
 agni_totem_modifier_desc: "Agni es el Dragón desatado, su fuerza no tiene igual."
 finch_totem_modifier: "Tótem de Manada: Gorrión"
 finch_totem_modifier_desc: "El Gorrión es la adaptación; adaptarse es sobrevivir. Forzar el cambio en la naturaleza es invitar a la calamidad."
 horseshoe_crab_totem_modifier: "Tótem de Manada: Cangrejo Herrado"
 horseshoe_crab_totem_modifier_desc: "Ha prosperado mientras los Reyes Lagarto ascendían y caían. Sobrevivirá a los seres humanos y al propio Apocalipsis."
 scarab_totem_modifier: "Tótem de Manada: Escarabajo"
 scarab_totem_modifier_desc: "Con el ayudante del Sol velando por ti, la oscuridad sobre Khem finalmente podría ser purificada."
 snake_doctor_totem_modifier: "Tótem de Manada: Médico Serpiente"
 snake_doctor_totem_modifier_desc: "Él cose las heridas de sus amigos escamosos y cose los oídos de otros."
 whiptail_lizard_totem_modifier: "Tótem de Manada: Lagarto Cola de Látigo"
 whiptail_lizard_totem_modifier_desc: "A sus hijas les da fuerza, a los hombres les da odio."
 narukami_totem_modifier: "Tótem de Manada: Naru-kami"
 narukami_totem_modifier_desc: "Abuelo Trueno respeta la fuerza, pero solo la de los dignos."
 tsukiyomi_totem_modifier: "Tótem de Manada: Tsuki-yomi"
 tsukiyomi_totem_modifier_desc: "La Diosa de la Luna iluminará tu camino, pero las mareas rugen con las lunas cambiantes."
 susanowo_totem_modifier: "Tótem de Manada: Susanowo"
 susanowo_totem_modifier_desc: "El Dios de las Tormentas responde a tu Furia con la suya propia.\nUsar magia climática de #V Tormenta#! inflige 1 de Rayo [POD_aggravated_damage|E] a tu objetivo y a todos sus [knights|E] si están en guerra contigo."

 #Wyrm
 whippoorwill_totem_modifier: "Tótem de Manada: Chotacabras"
 whippoorwill_totem_modifier_desc: "Los chirridos del Chotacabras serán lo último que oigan."
 kirijama_totem_modifier: "Tótem de Manada: Kirijama"
 kirijama_totem_modifier_desc: "La existencia de Kirijama el Oculto está envuelta en misterio."
 greendragon_totem_modifier: "Tótem de Manada: Dragón Verde"
 greendragon_totem_modifier_desc: "Una vez protector de los Aulladores Blancos, el Dragón Verde sintió la caída de la Gracia tan duramente como ellos y sigue bendiciendo a sus hijos corruptos hasta el día de hoy."
 bat_totem_modifier: "Tótem de Manada: Murciélago"
 bat_totem_modifier_desc: "La mitad de locura del murciélago aún sirve a su amo caído."
 hakaken_totem_modifier: "Tótem de Manada: Hakaken"
 hakaken_totem_modifier_desc: "La paranoia y el orgullo son los dos atributos de los seguidores de Hakaken. Mediante estas herramientas, difunden la palabra de su Incarna caída."
 darkfungus_totem_modifier: "Tótem de Manada: Hongo Oscuro"
 darkfungus_totem_modifier_desc: "La única planta lo suficientemente fuerte como para sobrevivir en la Espiral Negra bendice a sus hijos con visiones. Sin embargo, no todos son bienvenidos.\nElimina el coste de aprender [GetTrait('demonology').GetName(GetNullCharacter)] mediante un [journey|E]"
 relshab_totem_modifier: "Tótem de Manada: Relshab"
 relshab_totem_modifier_desc: "Al igual que Relshab, ahora tu Ansia es eterna."
 glouogh_totem_modifier: "Tótem de Manada: G'louogh"
 glouogh_totem_modifier_desc: "Una bola de horror en constante cambio, G'louogh engendra algunas de las criaturas más terribles del $glossary_wyrm$ cada vez que aparece."
 GLOUOGH_TOTEM_REASON: "$glouogh_totem_modifier$: $VALUE|+=0$"


