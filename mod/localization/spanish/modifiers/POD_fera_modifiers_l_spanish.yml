 POD_werewolf_form_crinos_modifier: "Forma Crinos"
 POD_werewolf_form_crinos_modifier_desc: "La «forma de guerra», un híbrido aterrador de humano y lobo con fuerza y velocidad superiores.\n#weak Otorga [GetModifier('POD_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E]#!"
 POD_werewolf_form_glabro_modifier: "Forma Glabro"
 POD_werewolf_form_glabro_modifier_desc: "Se asemeja vagamente a un humano, pero tiene demasiados rasgos bestiales para serlo."
 POD_werewolf_form_hispo_modifier: "Forma Hispo"
 POD_werewolf_form_hispo_modifier_desc: "Un lobo gigante prehistórico."
 POD_werewolf_form_lupus_modifier: "Forma Lupus"
 POD_werewolf_form_lupus_modifier_desc: "Indistinguible de un lobo normal, pero con una velocidad superior."
 
 POD_ajaba_form_crinos_modifier: "Forma Crinos"
 POD_ajaba_form_crinos_modifier_desc: "La forma de guerra; ligeramente más pequeña y menos poderosa que la de los Garou, pero también un poco más resistente.\n#weak Otorga [GetModifier('POD_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E]#!"
 POD_ajaba_form_anthros_modifier: "Forma Anthros"
 POD_ajaba_form_anthros_modifier_desc: "Forma casi humana."
 POD_ajaba_form_crocas_modifier: "Forma Crocas"
 POD_ajaba_form_crocas_modifier_desc: "Forma casi de hiena. Una hiena enorme del tamaño de un oso pequeño."
 POD_ajaba_form_hyaenid_modifier: "Forma Hyaenid" 
 POD_ajaba_form_hyaenid_modifier_desc: "Forma de hiena." 

 POD_ananasi_form_lilian_modifier: "Forma Lilian"
 POD_ananasi_form_lilian_modifier_desc: ""
 POD_ananasi_form_crawlerling_modifier: "Forma Crawlerling"
 POD_ananasi_form_crawlerling_modifier_desc: ""
 POD_ananasi_form_pithus_modifier: "Forma Pithus"
 POD_ananasi_form_pithus_modifier_desc: ""
 
 POD_bastet_form_crinos_modifier: "Forma Crinos"
 POD_bastet_form_crinos_modifier_desc: "Un imponente híbrido humano-felino, una combinación peligrosa de fuerza y astucia.\n#weak Otorga [GetModifier('POD_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E]#!"
 POD_bastet_form_sokto_modifier: "Forma Sokto"
 POD_bastet_form_sokto_modifier_desc: "Casi humano."
 POD_bastet_form_chatro_modifier: "Forma Chatro"
 POD_bastet_form_chatro_modifier_desc: "Forma felina primordial."
 POD_bastet_form_feline_modifier: "Forma Felina" 
 POD_bastet_form_feline_modifier_desc: "Gato normal." 
 
 POD_corax_form_crinos_modifier: "Forma Crinos"
 POD_corax_form_crinos_modifier_desc: "La forma Crinos es una criatura mitad aviar muy torpe. Los Corax generalmente solo usan esta forma para repeler enemigos el tiempo suficiente para escapar, y solo en momentos en los que se han quedado sin alternativa.\n#weak Otorga [GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúe como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E]#!"
 POD_corax_form_corvid_modifier: "Forma Corvid"
 POD_corax_form_corvid_modifier_desc: "La forma Corvid es esencialmente la de un cuervo común, aunque los Corax son aves particularmente grandes que tienen un tamaño más cercano al de las águilas."
 
 POD_gurahl_form_crinos_modifier: "Forma Crinos"
 POD_gurahl_form_crinos_modifier_desc: "La forma de guerra. Extraordinariamente fuerte y resistente, por no hablar de enorme: entre 10 y 16 pies de altura, y con un peso de hasta 1200 kg.\n#weak Otorga [GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúe como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E]#!"
 POD_gurahl_form_arthren_modifier: "Forma Arthren"
 POD_gurahl_form_arthren_modifier_desc: "Forma casi humana. Considerablemente más fuerte y resistente que la forma glabro de los hombres lobo, se cree que los Gurahl en forma Arthren inspiraron las leyendas del Sasquatch y criaturas similares."
 POD_gurahl_form_bjornen_modifier: "Forma Bjornen"
 POD_gurahl_form_bjornen_modifier_desc: "Forma casi de oso. Parecida a un antiguo oso de las cavernas, con garras y colmillos más largos, la forma Bjornen es casi tan grande y poderosa como la Crinos, con un daño por mordisco y garra aún más feroz."
 POD_gurahl_form_urus_modifier: "Forma Urus"
 POD_gurahl_form_urus_modifier_desc: "Forma de oso. Los Gurahl homínidos toman la forma de osos que corresponden a su Tribu."
 
 POD_kitsune_form_koto_modifier: "Forma Koto"
 POD_kitsune_form_koto_modifier_desc: "Híbrido entre zorro y humano."
 POD_kitsune_form_sambuhenge_modifier: "Forma Sambuhenge"
 POD_kitsune_form_sambuhenge_modifier_desc: "Casi humano."
 POD_kitsune_form_juko_modifier: "Forma Juko"
 POD_kitsune_form_juko_modifier_desc: "Zorro del tamaño de un lobo."
 POD_kitsune_form_kyubi_modifier: "Forma Kyubi"
 POD_kitsune_form_kyubi_modifier_desc: "Zorro común."
 
 POD_mokole_form_archid_modifier: "Forma Archid"
 POD_mokole_form_archid_modifier_desc: "La forma de guerra se considera la «forma verdadera» de cualquier individuo Mokolé. A través de la Mnesis, sueñan con los reptiles, aves y dinosaurios del pasado, lo que determina las características de la forma Archid.\n#weak Otorga [GetModifier('POD_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúe como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E]#!"



 
 POD_nagah_form_azhi_dahaka_modifier: "Forma Azhi Dahaka"
 POD_nagah_form_azhi_dahaka_modifier_desc: "La forma de combate varía de un Nagah a otro, pero todos tienen una capucha masiva como una cobra, muchos se hacen cicatrices para ser más perceptibles en esta forma, son capaces de desencajar sus mandíbulas y tienen branquias (son totalmente anfibios en esta forma). La masa del Nagah aumenta, pero se debe a una cola de 16 a 20 pies para la mitad inferior del cuerpo; sus brazos se vuelven similares a los de una serpiente al desarrollar vértebras en lugar de huesos normales, lo que les permite luchar cuerpo a cuerpo con mayor facilidad. Las manos del hombre serpiente desarrollan garras tan terribles como las de cualquier Garou, y sus escamas y osteodermos adquieren una resistencia sobrenatural. Cualquier cicatriz que el Nagah haya recibido destaca significativamente en esta forma, a menudo como patrones en las escamas del Azhi Dahaka. El Nagah provoca el efecto completo del Delirio en esta forma; pocos humanos pueden soportar mirar tal encarnación de su miedo primario a las serpientes.\n#weak Otorga [GetModifier('POD_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúe como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E]#!"
 POD_nagah_form_silkaram_modifier: "Forma Silkaram"
 POD_nagah_form_silkaram_modifier_desc: "De apariencia casi humana, pero el pelo y la piel son reemplazados por pequeñas escamas, el rostro se aplana y los ojos se vuelven más serpentinos, los dientes se fusionan excepto por dos colmillos que se retraen como los de una cobra. En esta forma, obtienen un veneno peligroso para los mortales e incluso para los no-muertos."
 POD_nagah_form_kali_dahaka_modifier: "Forma Kali Dahaka"
 POD_nagah_form_kali_dahaka_modifier_desc: "Se asemeja a una serpiente gigante con dos diferencias; son mucho más grandes que cualquier cobra normal y tienen grandes colmillos venenosos. Con un impulso primario, pueden desarrollar un conjunto de brazos esbeltos. Esta forma también tiene branquias y puede respirar bajo el agua."
 POD_nagah_form_vasuki_modifier: "Forma Vasuki"
 POD_nagah_form_vasuki_modifier_desc: "Indistinguible de una cobra normal, una serpiente de cascabel, una boca de algodón u otra forma de raza."
 
 POD_nuwisha_form_manabozho_modifier: "Forma Manabozho"
 POD_nuwisha_form_manabozho_modifier_desc: "La forma de guerra, un híbrido de humano y coyote.\n#weak Otorga [GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúe como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E]#!"
 POD_nuwisha_form_tsitsu_modifier: "Forma Tsitsu"
 POD_nuwisha_form_tsitsu_modifier_desc: "Forma casi humana."
 POD_nuwisha_form_sendeh_modifier: "Forma Sendeh"
 POD_nuwisha_form_sendeh_modifier_desc: "Forma casi de coyote."
 POD_nuwisha_form_latrani_modifier: "Forma Latrani"
 POD_nuwisha_form_latrani_modifier_desc: "Forma de coyote."
 

 POD_ratkin_form_crinos_modifier: "Forma Crinos"
 POD_ratkin_form_crinos_modifier_desc: "La forma de guerra, un híbrido de humano y rata.\n#weak Otorga [GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúe como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E]#!"
 POD_ratkin_form_rodens_modifier: "Forma Rodens"
 POD_ratkin_form_rodens_modifier_desc: "Una rata de tamaño variable."
 
 POD_rokea_form_gladius_modifier: "Forma Gladius"
 POD_rokea_form_gladius_modifier_desc: "Llamada «Mandíbulas Erguidas» por los hombres tiburón, el Gladius es una criatura bípede con forma de tiburón de diez pies de altura. Al igual que la Crinos, las Mandíbulas Erguidas combinan el poder de un tiburón con la versatilidad de la forma humana. Esta forma incita un Delirio parcial en los humanos.\n#weak Otorga [GetModifier('POD_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúe como [commander|E] durante la [combat_phase|E], o a tu oponente durante un [single_combat_duel_plural|E]#!"
 POD_rokea_form_grabrus_modifier: "Forma Grabrus"
 POD_rokea_form_grabrus_modifier_desc: "También conocida como «Espalda Redonda», esta forma suele ser conocida solo por los Rokea terrestres; los hombres-tiburón que habitan en el océano tienen poco uso de ella. El Rokea pierde todo el vello corporal y se vuelve aún más feo que su forma homínida. Él o ella duplica su masa muscular y la espalda se ensancha a medida que la aleta dorsal comienza a formarse.\n#weak Otorga [GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúe como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E]#!"
 POD_rokea_form_chasmus_modifier: "Forma Chasmus"
 POD_rokea_form_chasmus_modifier_desc: "La forma que los Rokea llaman «Mandíbulas Luchadoras» es una pesadilla prehistórica que incita un Delirio total en los humanos. El Rokea se convierte en una versión gigante de su forma de raza, creciendo el doble de largo que su forma Squamus. Los Rokea realizan sus combates submarinos con esta forma.\n#weak Otorga [GetModifier('POD_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúe como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E]#!"
 POD_rokea_form_squamus_modifier: "Forma Squamus"
 POD_rokea_form_squamus_modifier_desc: "También denominada «Mandíbulas Nadadoras», esta forma es indistinguible de un tiburón normal de la especie del Rokea."
 
 POD_apis_form_crinos_modifier: "Forma Minotauro"
 POD_apis_form_crinos_modifier_desc: "Un enorme hombre-toro con dientes afilados"
 POD_apis_form_aurochs_modifier: "Forma Uro"
 POD_apis_form_aurochs_modifier_desc: "La forma animal"
 
 POD_camazotz_form_crinos_modifier: "Forma Crinos"
 POD_camazotz_form_crinos_modifier_desc: "La forma de guerra de los Camazotz, un híbrido de humano y murciélago.\n#weak Otorga [GetModifier('POD_delirium_modifier').GetNameWithTooltip] [modifier|E] a los [knights|E] enemigos cuando actúe como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E]#!"
 POD_camazotz_form_apterous_modifier: "Forma Apterous"
 POD_camazotz_form_apterous_modifier_desc: "Casi humano, incapaz de volar pero capaz de trepar excepcionalmente bien."
 POD_camazotz_form_megachiroptera_modifier: "Forma Megachiroptera"
 POD_camazotz_form_megachiroptera_modifier_desc: "Un murciélago gigante con una envergadura de 1,5 metros."
 
 POD_grondr_form_crinos_modifier: "Forma Crinos"
 POD_grondr_form_crinos_modifier_desc: "Terrible humanoide con cabeza de jabalí."
 POD_grondr_form_aperius_modifier: "Forma Aperius"
 POD_grondr_form_aperius_modifier_desc: "Casi humano."
 POD_grondr_form_daeodon_modifier: "Forma Daeodon"
 POD_grondr_form_daeodon_modifier_desc: "Jabalí carnívoro, enorme y prehistórico."
 POD_grondr_form_scrofa_modifier: "Forma Scrofa"
 POD_grondr_form_scrofa_modifier_desc: "Jabalí salvaje."
 


