 POD_shapeshift_form_shiva_modifier: "Shiva el Destructor"
 POD_shapeshift_form_shiva_modifier_desc: "En un estallido de luz sagrada, el Bastet se convierte en una forma Crinos de 3,6 metros de altura y seis brazos, un pantera de las sombras que empuña armas flamígeras. Hasta que el suelo quede sembrado de cadáveres, esta máquina de ira divina despedaza todo a su paso —enemigo o no— en jirones sangrientos."
 POD_shapeshift_form_kali_modifier: "Kali la Madre Oscura"
 POD_shapeshift_form_kali_modifier_desc: "En un estallido de luz sagrada, el Bastet se convierte en una forma Crinos de 3,6 metros de altura y seis brazos, un pantera de las sombras que empuña armas flamígeras. Hasta que el suelo quede sembrado de cadáveres, esta máquina de ira divina despedaza todo a su paso —enemigo o no— en jirones sangrientos."


