 situation_parameter_war_of_seasons_convert_to_militant_fraction: "Desbloquea una [character_interaction|E] para [court_leader|E] con la que convertir a $POD_splat_fae$ de la misma [Concept('religion','Corte')|E] en [GetFaithDoctrine('doctrine_fae_agenda_militant').GetBaseName]"
 situation_parameter_war_of_seasons_convert_to_truce_bearer_fraction: "Desbloquea una [character_interaction|E] para [court_leader|E] con la que convertir a $POD_splat_fae$ de la misma [Concept('religion','Corte')|E] en [GetFaithDoctrine('doctrine_fae_agenda_trucebearer').GetBaseName]"

 situation_parameter_war_of_seasons_unlock_peace_objective: "Desbloquea un objetivo para que un [court_leader|E] ponga fin de una vez por todas a [GetSituationType('PoD_war_of_seasons').GetName]."
 situation_parameter_war_of_seasons_unlock_war_objective: "Desbloquea un objetivo para que un [court_leader|E] declare vencedora a tu Estación en [GetSituationType('PoD_war_of_seasons').GetName]."

