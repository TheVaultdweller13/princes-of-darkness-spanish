 situation_parameter_war_of_seasons_situation_war_active: "Todas las [faiths|E] Kithain obtendrán [GetDoctrine('special_doctrine_war_of_seasons_hostility_war').GetBaseName] mientras dure [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war').GetName]"
