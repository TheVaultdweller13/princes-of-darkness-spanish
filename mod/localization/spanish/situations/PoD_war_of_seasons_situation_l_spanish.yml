 PoD_war_of_seasons_gain_rival_court: "Ganar [rival|E]"
 PoD_war_of_seasons_gain_rival_court_desc: "Gana como [rival|E] a $POD_splat_fae$ de otra [Concept('religion', 'Corte')|E]"
 PoD_war_of_seasons_usurp_title_court: "Usurpar [title]|E"
 PoD_war_of_seasons_usurp_title_court_desc: "Usurpa o gana una reclamación sobre el [title|E] de $POD_splat_fae$ de otra [Concept('religion', 'Corte')|E]"

 PoD_war_of_seasons_gift_court: "Regalar"
 PoD_war_of_seasons_gift_court_desc: "Regala [gold|E] o un [artifact|E] a $POD_splat_fae$ de otra [Concept('religion', 'Corte')|E]"
 PoD_war_of_seasons_befriend_court: "Entablar amistad"
 PoD_war_of_seasons_befriend_court_desc: "Entabla amistad con $POD_splat_fae$ de otra [Concept('religion', 'Corte')|E]"
 PoD_war_of_seasons_seduce_court: "Seducir"
 PoD_war_of_seasons_seduce_court_desc: "Seduce a $POD_splat_fae$ de otra [Concept('religion', 'Corte')|E]"
 PoD_war_of_seasons_sign_truce_outside_war__court: "Tregua fuera de [war|E]"
 PoD_war_of_seasons_sign_truce_outside_war_court_desc: "Firma una [truce|E] fuera de una [war|E] con $POD_splat_fae$ de otra [Concept('religion', 'Corte')|E]"
 PoD_war_of_seasons_pay_random_court: "Pagar rescate"
 PoD_war_of_seasons_pay_random_court_desc: "Paga un rescate para liberar a $POD_splat_fae$ de otra [Concept('religion', 'Corte')|E]"

 WINDOW_POD_WAR_OF_SEASONS_LEADERS: "Líder de la [Concept('religion', 'Corte')|E]"
 PODWarOfSeasonsLeader_spring: "Líder de la Primavera" #Lady/Lord caused too much errors.
 PODWarOfSeasonsLeader_summer: "Soberano del Verano"
 PODWarOfSeasonsLeader_autumn: "Autócrata del Otoño"
 PODWarOfSeasonsLeader_winter: "Señor de la Guerra del Invierno"
 PODWarOfSeasonsLeader_solstice: "Líder del Solsticio"

 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_WAR: "Esta barra muestra el avance hacia [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war').GetName]. Ahora mismo está en [GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war')).GetProgress]/[GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war')).GetTakeoverPoints]$WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_GENERAL$"
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_PEACE: "Esta barra muestra el avance hacia [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace').GetName]. Ahora mismo está en [GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace')).GetProgress]/[GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace')).GetTakeoverPoints]$WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_GENERAL$"
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_STATUS_QUO: "Esta barra muestra el avance hacia [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_status_quo').GetName]. Ahora mismo está en [GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_status_quo')).GetProgress]/[GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_status_quo')).GetTakeoverPoints]"
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_GENERAL: "\n\nCuando cualquiera de las barras se llene por completo, [GetSituationType('PoD_war_of_seasons').GetName] avanzará hacia la [situation_phase|E] correspondiente. No importa cuánto haya avanzado la otra barra, solo cuál se llenó primero."
 WINDOW_POD_WAR_OF_SEASONS_FUTURE_EFFECTS: "Efectos de la fase futura"

 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SPRING: "Los líderes de la [GetReligionByKey('spring_court_religion').GetName] se eligen por voto popular de todos los [independent_rulers|E].\n\nLas elecciones se celebran cada #V 10 años#!, pero pueden forzarse gastando [prestige|E]."
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SPRING_BUTTON: "¡Iniciar elecciones!"

 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SUMMER: "Los líderes de la [GetReligionByKey('summer_court_religion').GetName] se eligen según sus [vassals|E]. Se elige al $POD_splat_fae$ con más [vassals|E].\n\n\n"

WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN: "Los líderes de la [GetReligionByKey('autumn_court_religion').GetName] no se eligen, sino que se reemplazan. Cualquier $POD_splat_fae$ del Otoño puede iniciar una [scheme|E] contra el líder actual para reemplazarlo.[AddTextIf(Not(ObjectsEqual(GetPlayer.Self,Situation.MakeScope.GetVariable('autumn_leader').Char)), Localize('WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN_BUTTON_TEXT'))]"
WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN_BUTTON_TEXT: "\n\nAl pulsar el botón se abrirá una [character_interaction|E] para iniciar una [scheme|E]"
WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN_BUTTON: "Hora de las [scheming|E]"
autumn_button_script: "Esto abrirá la [character_interaction|E] #V $PODClaimLeadership_scheme_interaction$#! contra [GetSituation('PoD_war_of_seasons').MakeScope.GetVariable('autumn_leader').Char.GetName]"

WINDOW_POD_WAR_OF_SEASONS_LEADERS_WINTER: "Los líderes de la [GetReligionByKey('winter_court_religion').GetName] se eligen según su [dread|E]. Se elegirá como $PODWarOfSeasonsLeader_winter$ al $POD_splat_fae$ con más [dread|E] entre los [independent_rulers|E].\n\nEsto se comprueba cada #V año#!"

WINDOW_POD_WAR_OF_SEASONS_LEADERS_SOLSTICE: "La [GetReligionByKey('solstice_court_religion').GetName] no tiene líder. Son demasiado pocos y están demasiado marginados para que las demás [Concept('religion', 'Cortes')|E] piensen en ellos como iguales.\n\nPero puedes cambiarlo. Con un [realm|E] lo bastante grande y suficientes [vassals|E], podrías imponerte en una posición de poder."
WINDOW_POD_WAR_OF_SEASONS_LEADERS_SOLSTICE_BUTTON: "¡Necesitamos que se nos oiga!"
solstice_button_script_vassal: "¡Necesitas #V 25#! [vassals|E]! #weak (#V [SCOPE.GetValue('vassal_num')]#!)#!"
WINDOW_POD_WAR_OF_SEASONS_LEADERS_SOLSTICE_LEADER: "Los líderes de la [GetReligionByKey('solstice_court_religion').GetName] son hereditarios, desde el Primer Líder del Solsticio hasta sus hijos.\n\nSi la línea principal de Líderes del Solsticio se extinguiera, un gobernante cualquiera del Solsticio ocuparía la posición de poder."