l_spanish:
 PoD_war_of_seasons: "La Guerra de las Estaciones"
 PoD_war_of_seasons_desc: "La Guerra de las Estaciones es un conflicto de larga data entre las cuatro Cortes Estacionales que se disputan el dominio del Mundo de Otoño. Aunque se firmó una Tregua del Juramento, ya ha expirado y los combates pueden reanudarse. ¿Lo harán?"
 situation_type_PoD_war_of_seasons: "$PoD_war_of_seasons$"
 situation_type_PoD_war_of_seasons_desc: "$PoD_war_of_seasons_desc$"
 situation_PoD_war_of_seasons: "$PoD_war_of_seasons$"
 situation_PoD_war_of_seasons_desc: "$PoD_war_of_seasons_desc$"

 PoD_war_of_seasons_sub_region_core: "$PoD_war_of_seasons$"
 PoD_war_of_seasons_sub_region_core_desc: "$PoD_war_of_seasons_desc$"

 PoD_war_of_seasons_situation_status_quo: "Status Quo"
 PoD_war_of_seasons_situation_status_quo_icon: "@fae_icon! $PoD_war_of_seasons_situation_status_quo$"
 PoD_war_of_seasons_situation_status_quo_desc_short: "Status Quo"
 PoD_war_of_seasons_situation_status_quo_desc: "La Tregua del Juramento debería haber terminado en 1230. Pero no estamos del todo convencidos de volver a la guerra, ni de abandonar por completo nuestro odio legítimo.\n\n...Pero un estado así no puede durar para siempre: tarde o temprano el odio florecerá en la guerra, ¿o quizá se extinguirá por completo?"
 PoD_war_of_seasons_PoD_war_of_seasons_situation_status_quo_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 PoD_war_of_seasons_situation_war: "Guerra por las Estaciones"
 PoD_war_of_seasons_situation_war_icon: "@fae_icon! $PoD_war_of_seasons_situation_war$"
 PoD_war_of_seasons_situation_war_desc_short: "Guerra"
 PoD_war_of_seasons_situation_war_desc: "La Tregua del Juramento ha terminado. La guerra está sobre nosotros: los combates entre las [Concept('religion','Cortes')|E] se avivan en un fuego glorioso. ¡Y solo puede haber un vencedor! ¡Empuñad las espadas, lanzad [cantrips|E] y matadlos a todos!\n\n... Pero quizá, solo quizá, ¿podamos reconciliarnos de nuevo? ¿Devolver la vida a la Tregua del Juramento?"
 PoD_war_of_seasons_PoD_war_of_seasons_situation_war_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 PoD_war_of_seasons_situation_peace: "la Armonía"
 PoD_war_of_seasons_situation_peace_icon: "@fae_icon! $PoD_war_of_seasons_situation_peace$"
 PoD_war_of_seasons_situation_peace_desc_short: "Status Quo"
 PoD_war_of_seasons_situation_peace_desc: "La Tregua del Juramento fue un gran éxito: el odio entre las [Concept('religion','Cortes')|E] se ha ido extinguiendo poco a poco. Y lo que antes se tenía por imposible, una amistad entre miembros de distintas [Concept('religion','Cortes')|E], ha brotado, ¿y por fin podemos unirnos todos? Como en los viejos tiempos, ¿verdad? ¿Amigos?\n\n... Pero el odio no ha muerto del todo: quedan pequeños focos de conflicto. ¿Qué pasaría si prendieran del todo? ¿Volvería la guerra?"
 PoD_war_of_seasons_PoD_war_of_seasons_situation_peace_situation_phase: "[SITUATION_PHASE_TYPE.GetName]"

 PoD_war_of_seasons_participant_group_spring_fae: "Hadas de la $spring_court_religion$"
 PoD_war_of_seasons_participant_group_spring_fae_desc: "$spring_court_religion_desc$"

 PoD_war_of_seasons_participant_group_summer_fae: "Hadas de la $summer_court_religion$"
 PoD_war_of_seasons_participant_group_summer_fae_desc: "$summer_court_religion_desc$"

 PoD_war_of_seasons_participant_group_autumn_fae: "Hadas de la $autumn_court_religion$"
 PoD_war_of_seasons_participant_group_autumn_fae_desc: "$autumn_court_religion_desc$"

 PoD_war_of_seasons_participant_group_winter_fae: "Hadas de la $winter_court_religion$"
 PoD_war_of_seasons_participant_group_winter_fae_desc: "$winter_court_religion_desc$"

 PoD_war_of_seasons_participant_group_solstice_fae: "Hadas de la $solstice_court_religion$"
 PoD_war_of_seasons_participant_group_solstice_fae_desc: "$solstice_court_religion_desc$"

 PoD_war_of_seasons_character_effects: "#bold Personaje#!"
