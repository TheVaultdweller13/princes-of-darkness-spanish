 POD_spirit_wyrm_possession_effect_tooltip2: "La cantidad de puntos de [perk|E] obtenidos de los Espíritus #ONCLICK:FAITH,wyrmbound #TOOLTIP:FAITH,wyrmbound $Bane|L$#!#! depende de lo siguiente:\n$BULLET_WITH_TAB$Rango del Espíritu: #P +1#! por Rango\n$BULLET_WITH_TAB$El Perverso habla Voz Corruptora: #P +2#!\n$BULLET_WITH_TAB$Es un Perverso Sembrador: #P +1#! adicional por Rango de Espíritu\n$BULLET_WITH_TAB$El Perverso habla Habla Contaminada: #P +4#!\n$BULLET_WITH_TAB$[core_tenets|E] de la [faith|E]: #P +1/+2#!"

