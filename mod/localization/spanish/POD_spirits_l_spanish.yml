 spirit_language_cannot_learn_ancestor: "No puedes aprender "

 learn_language_outcome_success.spirits.desc: "Los idiomas espirituales son tan caprichosos como sus hablantes. Algunos usan patrones reconocibles, otros no. Por suerte, los más extendidos suelen haber pasado por el mismo camino que los mortales, lo que ha llevado a que se simplifiquen para que los usen entidades no espirituales.\nAl fin y al cabo, a los espíritus hay que entenderlos cuando negocian con visitantes. Aunque es probable que los más astutos también aprovechen las sutilezas de su idioma para intentar llevar ventaja en las negociaciones.\nPor eso tomaste precauciones para aprender lo que podría considerarse un vocabulario más especializado, con la esperanza de ahorrarte en el futuro el destino de malinterpretar un contrato espiritual."

 learn_language_outcome_failure.spirits.desc: "Tras mucho trabajo duro... ¡nada! Es #EMP imposible#! aprender este idioma espiritual. Por mucho que lo intento, hablo como un bebé apenas destetado y farfullo como un necio.\n\n¡Bah! Esto fue una pérdida de tiempo..."

