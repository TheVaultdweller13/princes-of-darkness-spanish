l_spanish:
 pod_laibon_explain_aye_orun_decision: "Meditar sobre los Dos Mundos"
 pod_laibon_explain_aye_orun_decision_desc: "Vuelve tus pensamientos hacia dentro y reflexiona sobre los dos pilares de la existencia Laibon: Aye, el mundo de los vivos, y Orun, el mundo de los espíritus. ¿Dónde te sitúas entre ambos?"
 pod_laibon_explain_aye_orun_decision_tooltip: "Reflexiona sobre tu conexión con los dos mundos y descubre cómo el sistema Aye/Orun da forma a tu poder."
 pod_laibon_explain_aye_orun_decision_confirm: "Vuelve tus pensamientos hacia dentro."
 pod_laibon_invoke_authority_decision: "Invocar la Autoridad de los Vivos"
 pod_laibon_invoke_authority_decision_desc: "Hablas con la voz del mundo de los vivos: los mortales obedecen porque la propia tierra se lo ordena, y los demás Laibon reconocen tu autoridad de Aye."
 pod_laibon_invoke_authority_decision_confirm: "Invocar la autoridad de Aye."
 pod_laibon_invoke_authority_decision_tooltip: "Concede +10 de opinión popular y +10% de crecimiento de control durante 5 años. Todos los vasallos Laibon obtienen +5 de opinión durante 5 años."
 pod_laibon_commune_ancestors_decision: "Comulgar con los Ancestros"
 pod_laibon_commune_ancestors_decision_desc: "Abres la puerta a Orun y los ancestros responden: te muestran lo que se oculta en tu dominio y te prestan su fuerza."
 pod_laibon_commune_ancestors_decision_confirm: "Abrir la puerta a Orun."
 pod_laibon_commune_ancestors_decision_tooltip: "Revela un secreto que guarda un personaje de tu reino. Concede +5 de destreza y +25% de resistencia a conjuras hostiles durante 5 años."
 pod_laibon_commune_reveal_secret_tt: "Los ancestros pueden revelar una verdad oculta sobre alguien de tu reino."
 pod_laibon_remember_the_living_decision: "Recordar a los Vivos"
 pod_laibon_remember_the_living_decision_desc: "Camina entre los mortales, no para alimentarte ni gobernar, sino para recordar cómo se siente el calor. Siéntate junto a un fuego de cocina y escucha a una familia discutir por nada. Observa a unos niños jugar a un juego cuyas reglas tú conociste. Reconectar con Aye tras haberlo descuidado siempre duele. Pero el mundo de los vivos volverá a ser real, aunque solo sea por esta noche."
 pod_laibon_remember_the_living_decision_tooltip: "Obtén EXP de Aye a costa de piedad y estrés. Solo disponible cuando tu conexión con el mundo de los vivos se haya desvanecido."
 pod_laibon_remember_the_living_decision_confirm: "Caminar entre los vivos."
 pod_laibon_call_to_ancestors_decision: "Llamar a los Ancestros"
 pod_laibon_call_to_ancestors_decision_desc: "Ve a un lugar tranquilo, una tumba, una encrucijada, las raíces de un árbol viejo, y llama a los ancestros por primera vez en décadas. El silencio se alarga. Entonces, débilmente, una respuesta. No son palabras, sino una presión, una presencia, un recordatorio de que el mundo espiritual no te había abandonado aunque tú lo abandonaras a él. La reconexión es dolorosa, como la sangre que vuelve a un miembro entumecido. Pero vuelves a oírlos."
 pod_laibon_call_to_ancestors_decision_tooltip: "Obtén EXP de Orun a costa de piedad y estrés. Solo disponible cuando tu conexión con el mundo espiritual se haya desvanecido."
 pod_laibon_call_to_ancestors_decision_confirm: "Llamar a los ancestros."
 pod_laibon_walker_between_worlds_tt: "Has alcanzado el ideal Laibon, el equilibrio entre Aye y Orun. Eres un Caminante entre Mundos."
