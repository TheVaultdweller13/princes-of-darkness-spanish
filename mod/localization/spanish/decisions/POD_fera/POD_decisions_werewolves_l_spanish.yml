l_spanish:
 judge_land_decision: "Juez de la Tierra"
 judge_land_decision_tooltip: "Tienes un deber con el pueblo."
 judge_land_decision_desc: "Como Philodox, se supone que representas las leyes antiguas. Como tal, eres el baluarte de la tradición y la respetabilidad tanto para los hombres lobo como para los mortales."
 judge_land_decision_confirm: "Escucharé y consideraré"
    
 judge_land_modifier: "Juez de la Tierra"
 judge_land_modifier_desc: "Un Philodox se ha ocupado recientemente de cualquier asunto legal en esta zona, asegurando un juicio justo para los inocentes y una ejecución rápida para los culpables."

 prospering_populace_modifier: "Población próspera"
 prospering_populace_modifier_desc: "Un Philodox se asegura de que todos reciban lo que les corresponde y trabajen como una comunidad en esta zona."
  
 auspice_renunciation_decision: "Renuncia al Auspicio"
 auspice_renunciation_decision_tooltip: "Cambiarás tu auspicio."
 auspice_renunciation_decision_desc: "En este raro rito, un hombre lobo rechaza el auspicio bajo el cual nació y elige uno nuevo. El Garou debe realizar este rito durante la fase lunar que desea adoptar. Lo más común es que se vierta agua de un cuenco de plata expuesto al resplandor de Luna sobre el suplicante desnudo, lavándolo de todo lo que fue, incluido todo rango. Ahora es libre de empezar de nuevo como miembro de su auspicio adoptado."
 auspice_renunciation_decision_confirm: "Luna Cambiante"
  
 force_duel_criminals_interaction.death.tt: "Este duelo es a muerte."
