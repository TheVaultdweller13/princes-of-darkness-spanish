l_spanish:
 recognition_from_the_dreaming_objective_decision: "Dejar Nuestra Huella en el Ensueño"
 recognition_from_the_dreaming_objective_decision_desc: "Hemos demostrado ser sobresalientes entre los Plebeyos, pero aún nos falta la estimada posición de los Nobles. Si lograra una grandeza verdaderamente legendaria, mis hazañas elevarán el rango de toda mi casa. Nuestra historia se convertirá en un clásico de los anales de [UmbraGlossary('arcadia')], un mito entre mitos."
 recognition_from_the_dreaming_objective_decision_tooltip: "Es hora de situarse entre los Nobles"
 recognition_from_the_dreaming_objective_decision_confirm: "De personajes secundarios a protagonistas"
 recognition_from_the_dreaming_objective_decision_effect1: "El Ensueño reconocerá tu [house|E] como noble y te dará un [dynasty_perk|E] según el camino que elegiste."

 recognition_from_the_dreaming_path_of_diplomacy: "Camino del Amor"
 recognition_from_the_dreaming_path_of_diplomacy_tooltip: "Nos aseguraremos la adoración de las masas."
 recognition_from_the_dreaming_path_of_diplomacy_commoner_friends: "Necesitas al menos #V 3#! [friends|E] que #bold no#! sean [rulers|E] #weak ([SCOPE.GetValue('commoner_friends')|0])#!" 
 recognition_from_the_dreaming_path_of_diplomacy_noble_friends: "Necesitas al menos #V 3#! [friends|E] que #bold sean#! [rulers|E] #weak ([SCOPE.GetValue('noble_friends')|0])#!" 
 recognition_from_the_dreaming_path_of_diplomacy_average_popular_opinion: "La [county_opinion|E] de todos tus [counties|E] debe promediar más de #V 50#! #weak ([SCOPE.GetValue('average_popular_opinion')|1])#!"

 recognition_from_the_dreaming_path_of_martial: "Camino de los Guerreros"
