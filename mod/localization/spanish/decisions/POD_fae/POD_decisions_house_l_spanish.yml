 recognition_from_the_dreaming_path_of_prowess: "Camino del Poderío"
 recognition_from_the_dreaming_path_of_prowess_tooltip: "Seremos conocidos como valerosos caballeros, como los matadragones de antaño."
 recognition_from_the_dreaming_path_of_prowess_full_coterie: "Tu [coterie|E] debe tener #V 5#! miembros #weak ([GetPlayer.MakeScope.ScriptValue('coterie_size')|0])#!"
 recognition_from_the_dreaming_path_of_prowess_average_coterie_prowess: "La [prowess|E] media de tu [coterie|E] debe superar #V 60#! #weak ([SCOPE.GetValue('average_coterie_prowess')|0])#!"
 recognition_from_the_dreaming_path_of_prowess_total_knight_prowess: "La [prowess|E] total de tus [knights|E] debe superar #V 400#! #weak ([SCOPE.GetValue('total_knight_prowess')|0])#!"

 sidhe_house_dominance_beaumayn_objective_decision: "La Guerra de los Hermanos"
 sidhe_house_dominance_beaumayn_objective_decision_desc: "La Casa Beaumayn ha sido dividida por una amarga disputa clandestina entre los hermanos [GetScriptedCharacterByHistoryID('POD_fae_character_53').GetFirstName] y [GetScriptedCharacterByHistoryID('POD_fae_character_54').GetFirstName]. Todos los miembros de la casa están obsesionados con la fatal profecía final del Duque [GetScriptedCharacterByHistoryID('POD_fae_character_52').GetFirstName]: ¿promete el Camino de Hierro salvación o destrucción? La Casa determinará su camino mediante una guerra secreta."
 sidhe_house_dominance_beaumayn_objective_decision_tooltip: "Derrotarás el argumento del otro bando, para siempre."
 sidhe_house_dominance_beaumayn_objective_decision_confirm: "Zanjar el debate de una vez por todas"
 sidhe_house_dominance_beaumayn_objective_decision_custom: "[TARGET_CHARACTER.GetFirstName] debe estar muerto"
 brandell_victory_modifier: "Titular de la Reversión"
 markesh_victory_modifier: "Heraldos del Éxodo"

 sidhe_house_dominance_dougal_objective_decision: "Del Oro al Acero"
 sidhe_house_dominance_dougal_objective_decision_desc: "La Casa Dougal es célebre entre los Sidhe como herreros. En las maquinaciones de la política, muchos creen que la Casa Dougal es superflua, pero son sus ingenios los que alimentan las intrigas de la Casa Eiluned. Los fogosos Fiona se disputan sus hermosos artificios. Los señores de la Casa Gwydion realizan sus grandes hazañas con espadas Dougal, ataviados con cotas Dougal. Mientras la mayoría de las otras casas riñen, hacen pucheros y pierden el tiempo, los Dougal trabajan, construyen y crean. Ahora que el Bronce ha sido superado por el Hierro y el Acero, la Casa Dougal necesita crear un vasto depósito de armas y armaduras. Los oficiales y los talleres de los Dougal se centrarán en la creación de tal arsenal, pero no saldrá barato."
 sidhe_house_dominance_dougal_objective_decision_tooltip: "Crearás un enorme tesoro de armas y armaduras"
 sidhe_house_dominance_dougal_objective_decision_confirm: "Un golpe de herrero equivale a cien golpes de orfebre"
 dougal_victory_modifier: "Del Oro al Acero"

 sidhe_house_dominance_eiluned_objective_decision: "Freeholds Fortificados"
 sidhe_house_dominance_eiluned_objective_decision_desc: "La Casa de los Secretos ha conspirado con muchos seres y poderes oscuros y misteriosos para reunir conocimiento mágico. Con muchos videntes dotados, los Eiluned están prevenidos y, por tanto, buscan estar preparados. Con visiones y profecías del futuro, los arquitectos Eiluned proponen elaboradas fortificaciones que prevén cualquier tipo de asedio, repletas de pasadizos secretos, laberintos, escondrijos, matacanes y trampas mágicas de cantrip. Construir tan elaboradas fortificaciones no saldrá barato."
 sidhe_house_dominance_eiluned_objective_decision_tooltip: "Con la presciencia, construye elaboradas fortificaciones"
 sidhe_house_dominance_eiluned_objective_decision_confirm: "Prevenidos y Preparados"
 eiluned_victory_modifier: "Freeholds Fortificados"

 sidhe_house_dominance_fiona_objective_decision: "Gran Amante"
 sidhe_house_dominance_fiona_objective_decision_desc: "Para los Fiona, es mucho mejor ser amado que temido. Prácticamente todos los Fiona son Románticos; se entregan con regocijo al amor cortés y construyen elaborados juegos y rituales en torno a todos los asuntos del corazón. Las cortes Fiona son lugares de belleza y pasión, a menudo llenos de intrigas juguetonas, citas secretas y amores prohibidos. Los Fiona pueden ganar fama por su gran destreza en el amor, aumentando su atractivo ya sobrenatural, y teniendo también amantes variados y poderosos que resultan útiles en sus futuros planes."
 sidhe_house_dominance_fiona_objective_decision_tooltip: "Debes tener seis amantes interesantes."
 sidhe_house_dominance_fiona_objective_decision_confirm: "Amar con un amor que era más que amor"
 sidhe_house_dominance_fiona_objective_decision_custom1: "Tener #V 3#! grandes personajes como [lovers|E]"
 sidhe_house_dominance_fiona_objective_decision_custom2: "Tener un [GetTrait('sidhe').GetName( GetPlayer )] [landed|E] como [lover|E]"
 sidhe_house_dominance_fiona_objective_decision_custom3: "Tener un [GetTrait('satyr').GetName( GetPlayer )] como [lover|E]"
 sidhe_house_dominance_fiona_objective_decision_custom4: "Tener un [GetTrait('werewolf').GetName( GetPlayer )] como [lover|E]"
 fiona_victory_modifier: "Gran Amante"

 sidhe_house_dominance_gwydion_objective_decision: "El Verdadero Rey"
 sidhe_house_dominance_gwydion_objective_decision_desc: "Con la Escisión, los Tuatha de Danaan han abandonado la Tierra rumbo a [UmbraGlossary('arcadia')]. La Casa Gwydion, largamente acostumbrada al papel de caballero errante, ha reconocido con la Escisión una nueva responsabilidad: liderar a todos los Fae. Ahora era necesario que la Casa Gwydion reclamara tierras como propias y guardara estas posesiones de las depredaciones de los perdidos y desesperados. El Gwydion fab Don, sobrino del rey venedotiano, [GetScriptedCharacterByHistoryID('POD_fae_character_84').GetFirstName], tiene una clara línea de descendencia de Ogma y de la propia Danu. Los relatos cuentan que Lord [GetScriptedCharacterByHistoryID('POD_fae_character_03').GetFirstName] estuvo presente en la coronación del primer Alto Rey que gobernó jamás y que regaló al nuevo señor un par de enormes grifos grises. Afirma: «Si alguna vez la duda se apodera del corazón de tus súbditos, que miren a los grifos, que serán los heraldos del verdadero Alto Rey». Los señores de la Casa Gwydion tienen la valentía, la ambición y el linaje para guiar con derecho a todos los Sidhe Seelie hacia una renovada Edad de Oro. ¿Quién, sino el Verdadero Rey, podría emprender la búsqueda para hallar y empuñar el rayo, la Espada de Luz, la hoja del pacificador, [GetPODArtifact('caliburn_link').GetName]?"
 sidhe_house_dominance_gwydion_objective_decision_tooltip: "Debes demostrar a todos que la Casa Gwydion es conocida en todo el mundo: un largo reinado de muchos freeholds, asegurar lugares venerados de glamour, adquirir artefactos maravillosos y que se cuenten grandes epopeyas de tus hazañas convencerán a todos los Fae de tu legendario esplendor. Por último, una búsqueda para hallar la espada del Verdadero Rey, Excalibur, [GetPODArtifact('caliburn_link').GetName], demostrará tu innegable majestad."
 sidhe_house_dominance_gwydion_objective_decision_confirm: "¡A la Coronación!"
 sidhe_house_dominance_gwydion_objective_decision_custom1: "Debes recuperar [GetPODArtifactName('caliburn_link')] de la [Glossary('Gran Sima','umbra_realm_great_chasm_desc')]"
 gwydion_victory_modifier: "Verdadero Rey"

 sidhe_house_dominance_liam_objective_decision: "Canción Mortal"
 sidhe_house_dominance_liam_objective_decision_desc: "La imaginación de los mortales ha quedado enjaulada dentro de los confines de la Iglesia. La Casa Liam lidera a los Fae en el intento de comprender el dominio místico que la Iglesia tiene sobre la humanidad. O bien hay que neutralizar a la organización más tiránica de la Iglesia, o bien la Iglesia necesita que los Fae la alejen de la banalidad. Si la Casa Liam lo logra, podrá dirigir el crecimiento de la humanidad hacia la creatividad."
 sidhe_house_dominance_liam_objective_decision_tooltip: "Integrar o Neutralizar a la Iglesia"
 sidhe_house_dominance_liam_objective_decision_confirm: "Ponte aquí mismo ante el Señor de la canción" # With nothing, nothing on my tongue but Hallelujah
 sidhe_house_dominance_liam_objective_decision_custom1: "Has terminado la [decision|E] #V $destroy_inquisition_objective_decision$#!"
 sidhe_house_dominance_liam_objective_decision_custom2: "Tu fe es [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName] y has terminado la [decision|E] #V $constantinian_objective_decision$#!"
 sidhe_house_dominance_liam_objective_decision_custom3: "No debe haber ningún [independent_ruler|E] [GetTrait('supehunter').GetName( GetPlayer )] en el mapa"
 sidhe_house_dominance_liam_objective_decision_custom3_ex: "$sidhe_house_dominance_liam_objective_decision_custom3$ #weak ([example.GetFirstName])#!" 
 liam_victory_modifier: "Canción Mortal"

 sidhe_house_dominance_aesin_objective_decision: "Mantenerse en Midgard"
 sidhe_house_dominance_aesin_objective_decision_desc: "Los seguidores del Dios Clavado se han extendido por las tierras nórdicas y han apartado al pueblo de sus pactos con los Aesir y los Vanir. Impostores vampiros llamados los [GetFaithByKey('viaeinherjar').GetName] ocupan los antiguos templos de [GetTitleByKey('e_midgard').GetNameNoTier], incluido Uppsala, pervirtiendo nuestros antiguos ritos en su banal culto de sangre. Los [GetFaithByKey('getoffenris').GetName] del [GetTitleByKey('k_fimbul_winter').GetNameNoTier] merodean por los páramos septentrionales de Suecia y hay que meterlos en vereda. La [GetTitleByKey('d_crystal_fortress').GetNameNoTier] está en manos de [GetTrait('changeling').GetName( GetPlayer )] de la [GetFaithByKey('summer_court').GetName] de la Casa [GetDynastyByID( 'POD_fae_dynasty_gwydion' ).GetBaseName] y debería ser nuestra por derecho. Empuñaremos nuestras antiguas y sagradas armas y reclamaremos nuestra patria con sangre."
 sidhe_house_dominance_aesin_objective_decision_tooltip: "Reclama todo Midgard para los Aesin"
 sidhe_house_dominance_aesin_objective_decision_confirm: "Mejor morir con honor que vivir con vergüenza"
 sidhe_house_dominance_aesin_objective_decision_custom1: "Tener dos [powerful_vassals|E] del kith [GetTrait('troll').GetName( GetPlayer )]."
 sidhe_house_dominance_aesin_objective_decision_custom2: "Tener dos [councillors|E] del kith [GetTrait('troll').GetName( GetPlayer )]."
 sidhe_house_dominance_aesin_objective_decision_custom3: "Tener cinco [courtiers|E] [GetTrait('troll').GetName( GetPlayer )]."
 sidhe_house_dominance_aesin_objective_decision_custom4: "Tener dos [knights|E] del kith [GetTrait('troll').GetName( GetPlayer )]."
 aesin_victory_modifier: "Midgard Preservado"
 
 sidhe_house_dominance_ailil_objective_decision: "Poner Fin a la Guerra de las Estaciones"
 sidhe_house_dominance_ailil_objective_decision_desc: "La Casa Ailil prospera con el poder y ha afinado sus habilidades con la diplomacia y la intriga. Los fae Seelie traicionaron el giro estacional regular del trono y con ello negaron a los Ailil su turno legítimo de gobierno. Para restaurar el equilibrio, la Guerra de las Estaciones debe terminar. Si los Ailil logran poner fin a la Guerra de las Estaciones, su preeminencia entre todas las Casas Sidhe será incuestionable."
 sidhe_house_dominance_ailil_objective_decision_tooltip: "Pon fin a la Guerra de las Estaciones o reclama toda Irlanda y consigue tu reconocimiento"
 sidhe_house_dominance_ailil_objective_decision_confirm: "Para todo hay una estación, y un tiempo para cada propósito"
 sidhe_house_dominance_ailil_objective_decision_custom1: "La Lucha de la Guerra de las Estaciones ha terminado"
 ailil_victory_modifier: "Fin de la Guerra de las Estaciones"

 sidhe_house_dominance_balor_objective_decision: "Herencia de los Fomorianos"
 sidhe_house_dominance_balor_objective_decision_desc: "La Casa Balor remonta su ascendencia a un linaje de sidhe que mezclaron su sangre con la de los Fomorianos. Creen que el Invierno Sin Fin está casi aquí y que una mano firme debe guiar el timón para conducir a los fae a través de él. Mediante su conexión con la Wyrm, buscan alianzas entre los Unseelie con los Bailarines de la Espiral Negra y los Fomori. Dado el vínculo ancestral entre la Casa Balor y los Fomorianos, quizá sea posible, con un potente ritual, fusionar a un Fae con un poderoso espíritu perverso para crear un híbrido Fae-Fomori: un Fomarch."
 sidhe_house_dominance_balor_objective_decision_tooltip: "Fusionarse con un espíritu Perverso para convertirse en un Híbrido Fae-Fomori"
 sidhe_house_dominance_balor_objective_decision_confirm: "Invocar al Nexus Crawler"
 sidhe_house_dominance_balor_objective_decision_custom1: "Debes poseer el [artifact|E] Escoria de Sangre"
 balor_victory_modifier: "Fomoriano"

 sidhe_house_dominance_daireann_objective_decision: "Sanador-Guerrero"
 sidhe_house_dominance_daireann_objective_decision_desc: "La Casa obtuvo su noble posición porque [GetScriptedCharacterByHistoryID('POD_fae_character_21').GetFirstName] curó a un señor Gwydion, pero se ganó su verdadero respeto por el valor de su guerrero [GetScriptedCharacterByHistoryID('POD_fae_character_88').GetFirstName]. Los Daireann saben muy bien que la mano que puede curar también puede dañar. Una copa puede contener tanto veneno como antídoto. Una hoja puede usarse para sanar y puede usarse para cortar el hilo de una vida."
 sidhe_house_dominance_daireann_objective_decision_tooltip: "Desarrolla tanto tu habilidad en la guerra como en la sanidad"
 sidhe_house_dominance_daireann_objective_decision_confirm: "Para Todo Hay una Estación"
 daireann_victory_modifier: "Sanador-Guerrero"

 sidhe_house_dominance_varich_objective_decision: "Espíritus de los Rus"
 sidhe_house_dominance_varich_objective_decision_desc: "Los Inanimae, espíritus de la tierra y el cielo, han sido siempre los siervos de [GetScriptedCharacterByHistoryID('POD_fae_character_19').GetFirstName]; sus hijos. La tierra de Rusia rebosó en su día de Inanimae. Estos espíritus eran parte de todo para los fae: la tierra, los ríos, sus freeholds y la interminable taiga que los rodeaba. Los Varich saben cómo complacer a estos espíritus y también cómo usarlos. Los espíritus del hogar y la casa son tan poderosos y serviciales como lo permiten el tamaño y la magnificencia de sus Anclas, así como la cantidad de respeto que se les rinde. Ninguna posesión Varich está completa sin ellos y ningún miembro de la Casa Varich insultará a sabiendas a estos espíritus serviciales. Refuerza las filas de la Casa Varich incorporando más Inanimae al vasallaje."
 sidhe_house_dominance_varich_objective_decision_tooltip: "Lidera la cultura rusa y ten muchos vasallos Inanimae"
 sidhe_house_dominance_varich_objective_decision_confirm: "Нет плохой земли, есть плохие хозяева" 
 sidhe_house_dominance_varich_objective_decision_custom1: "Tener cinco [powerful_vassals|E] del [GetTraitGroup('phyla').GetName()] Inanimae de la [culture|E] rusa."
 sidhe_house_dominance_varich_objective_decision_custom2: "Eres el [cultural_head|E]."
 varich_victory_modifier: "Espíritus de los Rus"

 sidhe_house_dominance_scathach_objective_decision: "Edictos de los Oráculos Morfeos"
 sidhe_house_dominance_scathach_objective_decision_desc: "Desde que [GetScriptedCharacterByHistoryID('POD_fae_character_17').GetFirstName] derrotó a Octriallach, el Rey Blanco de los Fomorianos, en la Guerra de los Árboles, los Oráculos Morfeos han sido la fuerza definitoria dentro de la Casa Scathach. Aunque los Edictos de los Oráculos Morfeos no siempre tienen sentido para los miembros de la casa, la casa está unida en seguirlos. Sin embargo, los Oráculos previeron una calamidad si la Espada de Tethra entraba en el Corazón del [UmbraGlossary('dreaming')], y los Scathach atacaron a los Gwydion que intentaban trasladarla. Durante el derramamiento de sangre que siguió, la hoja desapareció en el Ensueño circundante. Las consecuencias políticas de la batalla hicieron que los Scathach se convirtieran en una Casa exiliada y rehuida por los Seelie. Aun así, los miembros de la casa siguen los Edictos de los Oráculos. A pesar de esta unidad, la Casa está dividida entre los Changelings encargados de quedarse atrás mientras la mayoría de los Sidhe huye a [UmbraGlossary('arcadia')], y [GetScriptedCharacterByHistoryID('POD_fae_character_87').GetFirstName] y sus seguidores Fae primogénitos, que rastrean el [UmbraGlossary('sea_of_silver')] en el [UmbraGlossary('deep_dreaming')] en busca de algo que preserve el Mundo Otoñal y derrote a los Fomorianos."
 sidhe_house_dominance_scathach_objective_decision_tooltip: ""
 sidhe_house_dominance_scathach_objective_decision_confirm: "Mantenerse en el Camino"
 sidhe_house_dominance_scathach_objective_decision_custom1: "No puede ocurrir el [Glossary('Quebranto','game_concept_shattering_desc')]"
 scathach_victory_modifier: "Edictos de los Oráculos Morfeos"

 sidhe_house_dominance_danaan_objective_decision: "Guardia del Ensueño"
 sidhe_house_dominance_danaan_objective_decision_desc: "La Casa Danaan recorre los muchos caminos a través del [UmbraGlossary('dreaming')]. Guardan sus sendas y abren nuevos caminos. Guían a los soñadores y, mediante su Juramento del Dragón, ganan el favor de muchas Quimeras. Un líder de la casa que haya viajado lejos por el [UmbraGlossary('dreaming')] puede ser capaz de reunir una impresionante horda de Quimeras para desatarla sobre el Mundo Otoñal cuando llegue el momento."
 sidhe_house_dominance_danaan_objective_decision_tooltip: "Viaja por el mundo y por el [UmbraGlossary('dreaming')] y aprende sus secretos para formar un ejército de Quimeras."
 sidhe_house_dominance_danaan_objective_decision_confirm: "Dos caminos se bifurcaron en la bruma y yo tomé el menos transitado"
 sidhe_house_dominance_danaan_objective_decision_custom1: "Eres un [GetTrait('eshu').GetName( GetPlayer )], [GetTrait('lifestyle_traveler').GetName( GetPlayer )], [GetTrait('pilgrim').GetName( GetPlayer )] o [GetTrait('adventurer').GetName( GetPlayer )]."
 sidhe_house_dominance_danaan_objective_decision_custom2: "Tener una montura: [GetPODArtifactName('ship_of_the_four_quarters_link')], [GetPODArtifactName('nightmare_horse_link')], [GetPODArtifactName('sorn_link')], [GetPODArtifactName('vozhd_palanquin_link')], [GetPODArtifactName('sorel_link')], caballo, lobo, oso, león o tigre" 
 danaan_victory_modifier: "Buscar la Guardia del Ensueño"

 sidhe_house_dominance_leanhaun_objective_decision: "La Maldición de Leanhaun"
 sidhe_house_dominance_leanhaun_objective_decision_desc: "La maldición secreta sobre [GetScriptedCharacterByHistoryID('POD_fae_character_15').GetFirstName] se extiende a toda su Casa y hace que sus miembros envejezcan rápidamente sin arrobar a mortales. Se ha profetizado que no terminará «hasta que las estrellas lloren sangre y la mismísima tierra se enfríe bajo tus pies», lo que parece improbable que ocurra pronto. Normalmente, los Leanhaun encantan y arroban a una víctima mortal cada vez. Se especula que, si se cultivan suficientes soñadores y el glamour de esos soñadores es de gran cantidad, el impacto de la maldición podría atenuarse, si no eliminarse."
 sidhe_house_dominance_leanhaun_objective_decision_tooltip: "Atenúa la maldición explotando un establo de Soñadores"
 sidhe_house_dominance_leanhaun_objective_decision_confirm: "Nuestros tormentos pueden convertirse en nuestros elementos"
 sidhe_house_dominance_leanhaun_objective_decision_custom1: "Necesitas al menos #bold 4#! [relations|E] positivas#weak (como [friends|E] o [soulmates|E])#! de [epiphanies_quality|E] superior a #bold 0#! #weak ([SCOPE.GetValue('sidhe_house_dominance_leanhaun_objective_decision_custom1_val')])#!"
 sidhe_house_dominance_leanhaun_objective_decision_custom2: "Necesitas al menos #bold 1#! [relation|E] positiva#weak (como [friends|E] o [soulmates|E])#! con una Gran Persona #weak ([SCOPE.GetValue('sidhe_house_dominance_leanhaun_objective_decision_custom2_val')])#!"
 leanhaun_victory_modifier: "Maldición de Leanhaun Reducida"

 sidhe_inert_cold_iron_objective_decision: "Hierro Frío Inerte"
 sidhe_inert_cold_iron_objective_decision_tooltip: "Alterarás la «realidad» científica, buscando un modo de transmutar o cambiar de otro modo las propiedades del hierro frío para volverlo inerte."
 sidhe_inert_cold_iron_objective_decision_desc: "Los Fae luchan por entender por qué el Hierro Frío los daña. Puede causar la destrucción permanente de un espíritu Fae. [GetScriptedCharacterByHistoryID('POD_fae_character_04').GetFirstName] dio la vida para intentar romper el dominio del hierro frío sobre los fae. Muchos creen que el hierro representa la fuerza de la Escisión; la división filosófica entre la humanidad y el [UmbraGlossary('dreaming')] hecha... carne. No fue formado por ninguna «cosa», sino como un efecto «natural» cuando la Banalidad alcanzó un nivel crítico. Los Fae deben estudiar el Hierro Frío y, de algún modo, volverlo inerte."
 sidhe_inert_cold_iron_objective_decision_confirm: "¡Transmuta el paradigma!"
 sidhe_inert_cold_iron_objective_decision_custom1: "Debes ser de la Casa [GetDynastyByID( 'POD_fae_dynasty_dougal' ).GetBaseName]."
 sidhe_inert_cold_iron_objective_decision_custom2: "Tú [completely_control|E] la Forja de Dougal en Stratchcruach ([GetTitleByKey('c_lennox').GetNameNoTier]), así como el ducado circundante de [GetTitleByKey('d_galloway').GetNameNoTier]"
 sidhe_inert_cold_iron_objective_decision_custom3: "Tú [completely_control|E] la Forja Valiente ([GetTitleByKey('c_warwickshire').GetNameNoTier]), así como los ducados de [GetTitleByKey('d_valiant_forge').GetNameNoTier] y [GetTitleByKey('d_hereford').GetNameNoTier]"
 sidhe_inert_cold_iron_objective_decision_custom4: "Tú [completely_control|E] la Forja Perdida de Vulcano ([GetTitleByKey('c_messina').GetNameNoTier]), así como el ducado de [GetTitleByKey('d_sicily').GetNameNoTier]" 
 sidhe_inert_cold_iron_objective_decision_custom5: "Gastas 10000 de oro o [completely_control|E] al menos una de estas minas de oro: [GetTitleByKey('b_turoc').GetNameNoTier], [GetTitleByKey('b_abrudbanya').GetNameNoTier], [GetTitleByKey('c_chalkidike').GetNameNoTier], [GetTitleByKey('c_allaqi').GetNameNoTier], [GetTitleByKey('b_wasulu').GetNameNoTier], [GetTitleByKey('b_diakha').GetNameNoTier], [GetTitleByKey('b_goundafa').GetNameNoTier]"
 sidhe_inert_cold_iron_objective_decision_effect1: "El hierro frío quedará inerte y ya no amenazará a los espíritus Fae. Los Fae dejarán de ser objetivos elegibles de planes de asesinato."
 sidhe_inert_cold_iron_objective_decision_effect2: "#X Esta [decision|E] es mutuamente excluyente con #V $destroy_order_of_reason_objective_decision$#!#!"