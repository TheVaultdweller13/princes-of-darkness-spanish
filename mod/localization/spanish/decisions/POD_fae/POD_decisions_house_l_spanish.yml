 recognition_from_the_dreaming_path_of_intrigue_killed: "Necesitas matar al menos a #V 75#! [characters|E]"

 recognition_from_the_dreaming_path_of_learning: "Camino de la Sabiduría"
 recognition_from_the_dreaming_path_of_learning_tooltip: "Seremos los sabios mentores que envían a héroes animosos a sus búsquedas."
 recognition_from_the_dreaming_path_of_learning_learning: "Tu [learning|E] o el de tu [coterie|E] debe superar #V 20#! #weak ([GetPlayer.MakeScope.ScriptValue('coterie_learning_gui')|0])#!"
