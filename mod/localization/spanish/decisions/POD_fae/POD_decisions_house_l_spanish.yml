 recognition_from_the_dreaming_path_of_martial_total_damage: "El [damage|E] y la [toughness|E] totales combinados de tu [army|E] deben superar #V 100,000#! #weak ([SCOPE.GetValue('total_damage_and_toughness')|0])#! #weak ($recognition_from_the_dreaming_path_of_martial_total_damage_tt$)#!"
 recognition_from_the_dreaming_path_of_martial_total_damage_tt: "Por limitaciones del motor, tienes que reclutar tu ejército para estos cálculos"
 recognition_from_the_dreaming_path_of_martial_number_of_wild_hunt: "Necesitas tener al menos #V 500#! tropas de [GetMaA('sidhe_wild_hunt').GetName] #weak ([SCOPE.GetValue('number_of_wild_hunt')|0])#!"
 recognition_from_the_dreaming_path_of_martial_number_of_troll_berserker: "Necesitas tener al menos #V 1250#! tropas de [GetMaA('troll_berserkers').GetName] #weak ([SCOPE.GetValue('number_of_troll_berserker')|0])#!"

 recognition_from_the_dreaming_path_of_stewardship: "Camino del Respeto"
 recognition_from_the_dreaming_path_of_stewardship_tooltip: "Seremos tan respetados como lo fue el Rey Arturo."
 recognition_from_the_dreaming_path_of_stewardship_vassal_amount: "Necesitas al menos #V 12#! [vassals|E] #weak ([GetPlayer.MakeScope.ScriptValue('POD_num_of_vassals')|0])#!"
 recognition_from_the_dreaming_path_of_stewardship_average_vassal_opinion: "La [opinion|E] que tus [vassals|E] tienen de ti debe promediar más de #V 75#! #weak ([SCOPE.GetValue('average_vassal_opinion')|0])#!"
 recognition_from_the_dreaming_path_of_stewardship_duke_council: "Tu [council|E] debe tener al menos #V 5#! [dukes|E] o superior #weak ([SCOPE.GetValue('duke_or_higher_councillor')|0])#!"
