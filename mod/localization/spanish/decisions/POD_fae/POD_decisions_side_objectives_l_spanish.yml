l_spanish:
 underbridge_kingdom_objective_decision: "Rey de Underbridge"
 underbridge_kingdom_objective_decision_desc: "Al asegurar más y más puentes, expandes el reino de Underbridge hasta un poderoso reino. Cobrarás lo que se te debe. Qué lástima del pobre viajero que no pueda pagar tus peajes."
 underbridge_kingdom_objective_decision_tooltip: "Te convertirás en el Rey de Underbridge."
 underbridge_kingdom_objective_decision_confirm: "Nadie cruzará sin mi permiso"
 underbridge_kingdom_objective_decision_custom: "Puedo usar el [casus_belli|E] de Guerra del Puente"
 underbridge_kingdom_objective_decision_custom2: "$unlocks_sailable_major_rivers$"
 underbridge_kingdom_objective_decision_custom3: "$culture_parameter_culture_can_raid_at_sea_even_if_feudal_no_restrictions$"
 underbridge_kingdom_objective_decision_riverside_county_contol_tt: "Tú [completely_control|E] todos los [counties|E] ribereños de [GetTitleByKey('k_novgorod').GetNameNoTier] ([SCOPE.ScriptValue('underbridge_kingdom_controlled_riverside_county_value')|0]/[SCOPE.ScriptValue('underbridge_kingdom_total_riverside_county_value')|0])"
 underbridge_king_modifier: "Rey de Underbridge"
 
 underbridge_empire_objective_decision: "Alto Rey de Underbridge"
 underbridge_empire_objective_decision_desc: "Cuando los ríos de toda Europa oriental caigan bajo tu control, el aterrador espacio bajo tantos puentes será tu gran dominio. Nadie podrá cruzar las aguas rugientes sin tu consentimiento. Todos te pagarán lo que te deben, mientras tú puedes trasladar criaturas de pura pesadilla al mundo con la misma facilidad que un agradable paseo."
 underbridge_empire_objective_decision_tooltip: "Te convertirás en el Alto Rey de Underbridge."
 underbridge_empire_objective_decision_confirm: "Nadie cruzará sin mi permiso"
 underbridge_empire_objective_decision_custom: "Todo condado ribereño tomado mediante el [casus_belli|E] de Guerra del Puente pasará a ser [counties|E] [de_jure|E] de [GetTitleByKey('e_underbridge').GetNameNoTier]"
 underbridge_empire_objective_decision_riverside_county_contol_tt: "Tú [completely_control|E] todos los [counties|E] ribereños de [GetTitleByKey('e_shadow_curtain').GetNameNoTier] ([SCOPE.ScriptValue('underbridge_empire_controlled_riverside_county_value')|0]/[SCOPE.ScriptValue('underbridge_empire_total_riverside_county_value')|0])"
 underbridge_empire_objective_decision_artifact_cauldron_of_fear: "Debes tener el [GetPODArtifactName('cauldron_of_fear_link')]"
 underbridge_emperor_modifier: "Alto Rey de Underbridge"

 rhineland_duchy_objective_decision: "Reclamar Borbetomagus"
 rhineland_duchy_objective_decision_desc: "Las leyendas de Sigfrido, Gunther y los Nibelungos aún se oyen en todos los hogares del pueblo germánico. Incluso los actuales Arzobispos mortales de Maguncia se llaman Sigfrido. La sede ancestral de los Gibichungos, la capital de la Vieja Borgoña, debería volver a estar bajo el control de los Fae. Tomar el control de Worms es el siguiente paso para reclamar el Rin para los Fae."
 rhineland_duchy_objective_decision_tooltip: "Asegurar la antigua capital de la Vieja Borgoña"
 rhineland_duchy_objective_decision_confirm: "Reclamar Borbetomagus"
 rhineland_duchy_objective_rhineland_dejure: "[GetTitleByKey('d_rhineland').GetName] pasa a ser señor [de_jure|E] de [GetTitleByKey('c_worms').GetNameNoTier], [GetTitleByKey('c_speyer').GetNameNoTier] y [GetTitleByKey('c_kaiserslautern').GetNameNoTier]"
 rhineland_duchy_objective_rhineland_county_claims: "Obtén [unpressed_claims|E] sobre el Alto Rin ([GetTitleByKey('d_alsace').GetName] y los [counties|E] de [GetTitleByKey('c_breisgau').GetNameNoTier], [GetTitleByKey('c_sundgau').GetNameNoTier], [GetTitleByKey('c_colmar').GetNameNoTier], [GetTitleByKey('c_strassburg').GetNameNoTier], [GetTitleByKey('c_baden').GetNameNoTier], [GetTitleByKey('c_erbach').GetNameNoTier], [GetTitleByKey('c_frankfurt').GetNameNoTier] y [GetTitleByKey('c_mainz').GetNameNoTier]) y algunos del Rin Medio ([GetTitleByKey('c_koblenz').GetNameNoTier] y [GetTitleByKey('c_sayn').GetNameNoTier])."
 
 rhineland_kingdom_objective_decision: "Reino de Renania"
 rhineland_kingdom_objective_decision_tooltip: "Expande el [GetTitleByKey('d_rhineland').GetName] hasta un verdadero [kingdom|E] a lo largo del río Rin."
 rhineland_kingdom_objective_decision_desc: "Una vez establecida una corte en la antigua capital borgoñona de [GetTitleByKey('d_rhineland').GetName], toda Renania queda abierta a la conquista. Cuando el Rin esté asegurado, podrá comenzar en serio la búsqueda del legendario tesoro de los Nibelungos: el [GetGlobalVariable('rhinegold').Artifact.GetName]."
 rhineland_kingdom_objective_decision_confirm: "Celebrar la Coronación"
 rhineland_duchy_objective_rhineland_duchy_claims: "Obtén [pressed_claims|E] sobre todos los [duchies|E] del río Rin: [GetTitleByKey('d_currezia').GetNameNoTier], [GetTitleByKey('d_augsburg').GetNameNoTier], [GetTitleByKey('d_swabia').GetNameNoTier], [GetTitleByKey('d_alsace').GetNameNoTier], [GetTitleByKey('d_west_franconia').GetNameNoTier], [GetTitleByKey('d_lower_lorraine').GetNameNoTier], [GetTitleByKey('d_julich').GetNameNoTier], [GetTitleByKey('d_gelre').GetNameNoTier], [GetTitleByKey('d_brabant').GetNameNoTier] y [GetTitleByKey('d_holland').GetNameNoTier]."
 POD_rhinegold_heist_tt: "Obtienes acceso a una $pod_infiltration_mission$ para recuperar el [GetGlobalVariable('rhinegold').Artifact.Custom('ColorizedArtifactName')]."

 rhineland_empire_objective_decision: "Renania Imperial"
 rhineland_empire_objective_decision_tooltip: "Expande el [GetTitleByKey('k_rhineland').GetName] a lo largo del río para que se convierta en un [empire|E]."
 rhineland_empire_objective_decision_desc: "Con todos los [duchies|E] de [GetTitleByKey('e_rhineland').GetNameNoTier] bajo tu dominio, los déspotas vampíricos que antaño reclamaron esta tierra eliminados y el Oro del Rin a salvo en tu tesoro, todos deben reconocer tu dominio sobre todo el Rin."
 rhineland_empire_objective_decision_confirm: "¡Todo el Rin!"
 rhineland_empire_objective_dead_stiffs: "Los vampiros destacados con pretensiones sobre Renania deben estar muertos o en [torpor|E]: [GetScriptedCharacterByHistoryID('505050').GetFirstName], [GetScriptedCharacterByHistoryID('505096').GetFirstName], [GetScriptedCharacterByHistoryID('505086').GetFirstName] y [GetScriptedCharacterByHistoryID('505121').GetFirstName]"
 rhineland_empire_objective_dejure_done: "[GetTitleByKey('k_rhineland').GetName] pasa a ser señor [de_jure|E] de los [duchies|e] del río Rin: [GetTitleByKey('d_currezia').GetNameNoTier], [GetTitleByKey('d_augsburg').GetNameNoTier], [GetTitleByKey('d_swabia').GetNameNoTier], [GetTitleByKey('d_alsace').GetNameNoTier], [GetTitleByKey('d_west_franconia').GetNameNoTier], [GetTitleByKey('d_lower_lorraine').GetNameNoTier], [GetTitleByKey('d_julich').GetNameNoTier], [GetTitleByKey('d_gelre').GetNameNoTier], [GetTitleByKey('d_brabant').GetNameNoTier] y [GetTitleByKey('d_holland').GetNameNoTier]."
 POD_region_borbetomagus: "Borbetomagus"
 POD_region_rhineland: "La Renania"
 POD_region_rhineland_empire: "La Renania Imperial"