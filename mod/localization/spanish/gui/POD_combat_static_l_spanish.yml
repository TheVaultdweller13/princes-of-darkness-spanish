 ###### MOVE BUTTON DATAMODEL LOC
 ##############################
 # Move-button keys use the datamodel move story as Scope.

 # Buttons omit the AP unit beside the pip header; detached tooltips include it.
 POD_combat_move_title:         "#bold;V [Scope.Var('decision').DecisionType.GetTitleForPlayer]#! (#bold;V [Scope.Var('ap_cost').GetValue|0]#!)"
 POD_combat_move_title_tooltip: "#bold;V [Scope.Var('decision').DecisionType.GetTitleForPlayer]#! (#bold;V [Scope.Var('ap_cost').GetValue|0]#! PA)"
 POD_combat_move_title_plain:   "[Scope.Var('decision').DecisionType.GetTitleForPlayer] ([Scope.Var('ap_cost').GetValue|0])"
 POD_combat_move_name:          "#bold;V [Scope.Var('decision').DecisionType.GetTitleForPlayer]#!"
 # Tooltip body = dynamic stats + flavor; AP is in the title.
 # PODCombatMoveFlavor resolves the generated skill_key tooltip directly.
