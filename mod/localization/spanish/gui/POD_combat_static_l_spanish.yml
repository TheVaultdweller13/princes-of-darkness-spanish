 ##############################
 ###### GAME CONCEPTS - general
 ##############################

 game_concept_pod_combat_encounter: "Encuentro de Combate"
 game_concept_pod_combat_encounter_with_icon: "@pod_combat_encounter_icon!Encuentro de Combate"
 game_concept_pod_combat_encounters: "Encuentros de Combate"
 game_concept_pod_combat_encounters_with_icon: "@pod_combat_encounter_icon!Encuentros de Combate"
 game_concept_pod_combat_encounter_desc: "Un minijuego de combate táctico por turnos en el que dos o más personajes zanjan sus diferencias con violencia.\n\nLos combatientes se turnan para gastar [pod_combat_action_points|E] en [pod_combat_moves|E] hasta que el enemigo queda [pod_combat_knocked_out|E].\n\nSe puede desbloquear una gran variedad de [pod_combat_moves|E] a partir de rasgos de [splat|E], ventajas y otras fuentes. Pueden infligir daño al [POD_health_track|E] o a la [pod_combat_morale|E], aplicar mejoras y penalizaciones, adoptar posturas como [pod_combat_guard_with_icon|E], [pod_combat_dodge_with_icon|E] o [pod_combat_stealth_with_icon|E], y más.\n\nLa [prowess_i][prowess|E] es un factor importante durante el combate, ya que determina la [pod_combat_hit_chance|E] y la [pod_combat_initiative|E].\n\n#I Para una explicación más detallada de las mecánicas de combate, pulsa el botón #bold Ayuda#! de la interfaz de combate.#!"

 game_concept_pod_combat_move: "Movimiento de Combate"
 game_concept_pod_combat_moves: "Movimientos de Combate"
 game_concept_pod_combat_move_desc: "#I Usa la [decision|E] #bold [SelectLocalization(IsInGame,'pod_combat_configure_moves_link_ingame','pod_combat_configure_moves')]#! para elegir un equipamiento de movimientos antes de la batalla.#!\n\nLas habilidades que se usan durante los [pod_combat_encounters_with_icon|E]. Los Movimientos de Combate se dividen en cuatro categorías:\n\n#color_red;bold ATQ (Ataque):#! Infligen daño al [POD_health_track|E]. Algunos movimientos tienen [POD_damage_types|E], como [fire_damage_short_with_icon] o [silver_damage_short_with_icon].\n\n#color_light_blue;bold DEF (Defensa):#! Curan, mejoran la [soak_damage|E] o la [pod_combat_hit_chance|E], o adoptan posturas como [pod_combat_guard_with_icon|E], [pod_combat_dodge_with_icon|E] o [pod_combat_stealth_with_icon|E].\n\n#color_porple;bold CTL (Control):#! Infligen daño a la [pod_combat_morale|E], penalizan la [soak_damage|E] o la [pod_combat_hit_chance|E] del enemigo, o drenan sus [pod_combat_ap|E].\n\n#color_pwr_orange;bold PDR (Poder):#! Poderosos movimientos finales que suelen venir con limitaciones.\n\nPuedes tener equipados #bold [EmptyScope.ScriptValue('pod_combat_max_per_category_base')|V0]#! movimientos de cada categoría, hasta un total de #bold [EmptyScope.ScriptValue('pod_combat_max_equipped_base')|V0]#!.\n\nLos Movimientos de Combate usan [pod_combat_action_points|E] #V (PA)#! y pueden tener costes adicionales como [hunger_with_icon|E] u [gold_i][gold|E]."
 
 pod_combat_configure_moves_link_ingame: "[GetDecision('pod_combat_configure_moves').GetName]"
 
 game_concept_pod_combat_action_points: "Puntos de Acción"
 game_concept_pod_combat_ap: "PA"
 game_concept_pod_combat_action_points_desc: "#bold Los Puntos de Acción (PA)#! son el recurso principal que se usa durante los [pod_combat_encounters_with_icon|E].\n\nPor defecto empiezas con [EmptyScope.ScriptValue('pod_combat_base_ap_base')|V0] Puntos de Acción cada ronda. Algunos [pod_combat_moves|E] pueden mejorar, drenar o devolver PA.\n\nLos PA no gastados se pierden al final de tu turno."
 
 game_concept_pod_combat_knocked_out: "Fuera de Combate"
 game_concept_pod_combat_knocked_out_desc: "Un combatiente queda #bold Fuera de Combate#! y es retirado de un [pod_combat_encounter_with_icon|E] cuando ocurre cualquiera de estas cosas:\n$BULLET_WITH_TAB$Su [POD_health_track|E] se llena por completo\n$BULLET_WITH_TAB$Su [pod_combat_morale|E] llega a #N cero#!\n$BULLET_WITH_TAB$Muere, queda #N Incapacitado#!, entra en $pod_torpor$ o queda atrapado en el Reino de las Sombras o en el Abismo\n\nGanas cuando todos los enemigos quedan fuera de combate. Pierdes si quedas fuera de combate tú, aunque sigan en pie algunos aliados."

 ##############################
 ###### GAME CONCEPTS - combat minigame stats
 ##############################

 game_concept_pod_combat_morale: "Moral"
 game_concept_pod_combat_morale_icon: "@stress_icon!"
 game_concept_pod_combat_morale_desc: "La #bold resiliencia mental#! de un combatiente durante los [pod_combat_encounters_with_icon|E]. La Moral suele empezar llena y cae con los ataques mentales directos, la intimidación y otras presiones. Cada casilla de herida que un golpe inflige realmente tras [soak_damage|E] también quita #N [EmptyScope.ScriptValue('pod_combat_morale_from_hp_base_ratio')|0]#! de Moral.\n\nCuando un combatiente queda [pod_combat_knocked_out|E], cada compañero superviviente pierde #N [EmptyScope.ScriptValue('pod_combat_ally_down_morale_penalty')|0]#! de Moral por la impresión. Esta pérdida se detiene en 1 de Moral, de modo que el shock no puede dejar fuera de combate a nadie por sí solo.\n\nFuera de la Práctica, cada combatiente vivo recibe #N [EmptyScope.ScriptValue('pod_combat_morale_base_stress_multiplier')|0]#! de [static_stress|E] al final del combate por cada punto de Moral que aún falte. Restaurar Moral antes de que termine la pelea reduce esta tensión duradera. El combate de práctica no aplica Tensión Mental duradera."

 game_concept_pod_combat_hit_chance: "Probabilidad de Impacto"
 game_concept_pod_combat_hit: "Impacto"
 game_concept_pod_combat_accuracy: "Precisión"
 game_concept_pod_combat_hit_chance_desc: "En los [pod_combat_moves|E] que requieren una #bold tirada de Impacto#!, la Probabilidad de Impacto es el porcentaje de probabilidad de superar esa tirada. Su base parte de [EmptyScope.ScriptValue('pod_combat_hit_chance_base_base')|0]% y se desplaza en la mitad de la diferencia entre tu [prowess|E] y la Destreza del objetivo elegido; luego se aplican tus mejoras y penalizaciones de Impacto activas y la bonificación de +[EmptyScope.ScriptValue('pod_combat_stealth_hit_base_bonus')|0]% del [pod_combat_stealth_with_icon|E].\n\nLa [pod_combat_dodge_with_icon|E] y el [pod_combat_stealth_with_icon|E] se resuelven antes de la tirada de Impacto, mientras que la [pod_combat_guard_with_icon|E] puede bloquear un ataque que de otro modo impactaría. La [soak_damage|E] y la capacidad de afectar a espíritus incorpóreos son también fases independientes. Ninguna de estas defensas cambia el porcentaje mostrado.\n\nUna Probabilidad de Impacto tirada queda limitada entre el [EmptyScope.ScriptValue('pod_combat_hit_chance_min_base')|0]% y el [EmptyScope.ScriptValue('pod_combat_hit_chance_max_base')|0]%. Los movimientos marcados como #bold Sin tirada de Impacto#! omiten solo esa tirada; cualquier defensa independiente que no ignoren aún puede detenerlos."

 ##############################
 ###### GAME CONCEPTS - combat stances
 ##############################

 game_concept_pod_combat_guard: "Guardia"
 game_concept_pod_combat_guard_with_icon: "@pod_combat_guard_icon!Guardia"
 game_concept_pod_combat_guarding: "En Guardia"
 game_concept_pod_combat_guarding_with_icon: "@pod_combat_guard_icon!En Guardia"
 game_concept_pod_combat_guarded: "Guardado"
 game_concept_pod_combat_guarded_with_icon: "@pod_combat_guard_icon!Guardado"
 game_concept_pod_combat_guard_desc: "Una #bold postura defensiva#!. Cuando un ataque que comprueba la Guardia impactaría de otro modo, se convierte en un golpe bloqueado y no inflige daño al [POD_health_track|E]. La Guardia se consume al bloquear ese ataque.\n\n#weak Un movimiento que ignora la Guardia puede impactar sin consumirla.#!"

 game_concept_pod_combat_dodge: "Esquiva"
 game_concept_pod_combat_dodge_with_icon: "@pod_combat_dodge_icon!Esquiva"
 game_concept_pod_combat_dodging: "Esquivando"
 game_concept_pod_combat_dodging_with_icon: "@pod_combat_dodge_icon!Esquivando"
 game_concept_pod_combat_dodged: "Esquivado"
 game_concept_pod_combat_dodged_with_icon: "@pod_combat_dodge_icon!Esquivado"
 game_concept_pod_combat_dodge_desc: "Una #bold postura evasiva#!. Cuando un ataque comprueba la Esquiva, falla automáticamente sin importar la [pod_combat_hit_chance|E] del atacante, y la Esquiva se consume.\n\n#weak Un movimiento Inesquivable ignora la Esquiva sin consumirla; un movimiento que Elimina la Esquiva rompe la postura antes de resolverse.#!"

 game_concept_pod_combat_stealth: "Sigilo"
 game_concept_pod_combat_stealth_with_icon: "@pod_combat_stealth_icon!Sigilo"
 game_concept_pod_combat_stealthed: "Oculto"
 game_concept_pod_combat_stealthed_with_icon: "@pod_combat_stealth_icon!Oculto"
 game_concept_pod_combat_stealth_desc: "Una #bold postura oculta#! que añade +[EmptyScope.ScriptValue('pod_combat_stealth_hit_base_bonus')|0]% de [pod_combat_hit_chance|E] mientras está activa. El Sigilo termina con lo que ocurra primero:\n$TAB$- Quien lo posee realiza un ataque de salud o un movimiento de contacto hostil\n$TAB$- Un ataque entrante comprueba el Sigilo y falla automáticamente\n\nLos ataques de pura Moral no consumen el Sigilo del atacante.\n\n#weak Un movimiento Inesquivable ignora el Sigilo sin consumirlo, mientras que un movimiento que Elimina el Sigilo rompe la postura antes de resolver sus demás efectos.#!"


 game_concept_pod_combat_initiative: "Iniciativa"
 game_concept_pod_combat_init: "Inic."
 game_concept_pod_combat_initiative_desc: "Una tirada que determina el [pod_combat_turn_order|E]. Quien tiene mayor iniciativa actúa antes.\n\nCada combatiente tira una sola vez, al entrar en la pelea, y conserva ese resultado durante el resto: una pelea tiene un único orden continuo, no uno nuevo cada ronda. La tirada se nutre de la [prowess|E] y del splat del combatiente; las ventajas y los rasgos la ajustan. Los combatientes más rápidos (Disciplinas de velocidad sobrenatural, rasgos de rapidez) pueden abrir con su ataque antes de que los enemigos más lentos siquiera reaccionen.\n\nLas penalizaciones de iniciativa aplicadas por movimientos alteran el resultado durante #bold una sola ronda#! y luego se disipan, de modo que una bien calculada te da exactamente un turno de ventaja sobre un rival más rápido."

 game_concept_pod_combat_turn_order: "Orden de Turnos"
 game_concept_pod_combat_turn: "Turno"
 game_concept_pod_combat_turn_order_desc: "El orden resuelto en el que actúan los combatientes, numerado de 1 (primero) a N (último). Lo determina la [pod_combat_initiative|E] de cada combatiente.\n\nEl orden se fija al comenzar la pelea y se mantiene durante toda ella, de modo que puedes planear varios turnos por adelantado. Solo cambia cuando algo altera la iniciativa de un combatiente: una penalización de iniciativa hace caer a su objetivo durante una ronda, y un combatiente que se une a mitad de pelea se integra en la siguiente ronda.\n\nEn peleas de tres o más, el orden se muestra como una tira de retratos en la parte superior de la ventana de combate: el actor actual aparece resaltado, y los retratos se atenúan cuando ya han actuado o han caído. El número de cada combatiente figura en su línea de [pod_combat_initiative|E] en la información emergente de su tarjeta."


 ##############################
 ###### GAME CONCEPTS - damage types
 ##############################
 # Describe player-visible outcomes; avoid internal variable, trigger and death-reason names.

 # ── Elemental damage flavors ──

 game_concept_fire_damage: "Daño por Fuego"
 game_concept_fire_damage_icon: "@pod_combat_fire_icon!"
 game_concept_fire_damage_short: "#L;color:{1.00,0.55,0.20} Fuego#!"
 game_concept_fire_damage_short_with_icon: "$game_concept_fire_damage_icon$$game_concept_fire_damage_short$"
 game_concept_fire_damage_desc: "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] contra #bold cualquier [splat|E] con cuerpo.#! Las heridas de fuego no se curan de la noche a la mañana.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] contra #bold $POD_splat_wraith_plural_with_icon$#! y #bold $POD_splat_spirit_plural_with_icon$#!, que son incorpóreos.\n$BULLET_WITH_TAB$#bold [GetTrait('bushi').GetName(GetNullCharacter)]#! reciben #bold el doble de daño#! por su $glossary_clan_curse$.\n$BULLET_WITH_TAB$Algunas ventajas poco comunes pueden conferir #bold inmunidad#! al daño por fuego.\n\n#weak La herramienta más antigua de la humanidad aleja la oscuridad, literal y metafóricamente. Hasta un campesino puede blandir una antorcha para defenderse de los monstruos.#!"

 game_concept_cold_damage: "Daño por Frío"
 game_concept_cold_damage_icon: "@pod_combat_cold_icon!"
 game_concept_cold_damage_short: "#L;color:{0.55,0.85,1.00} Frío#!"
 game_concept_cold_damage_short_with_icon: "$game_concept_cold_damage_icon$$game_concept_cold_damage_short$"
 game_concept_cold_damage_desc: "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] contra #bold $POD_splat_mortal_plural_with_icon$#!, cuya carne no soporta el frío cortante.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] contra los demás [splats|E].\n$BULLET_WITH_TAB$Sin multiplicadores de daño adicionales ni inmunidades.\n\n#weak Este elemento golpea con especial dureza a los mortales, pero ni siquiera los no-muertos son inmunes a que unos cristales de hielo afilados les desgarren la carne.#!"

 game_concept_lightning_damage: "Daño por Rayo"
 game_concept_lightning_damage_icon: "@pod_combat_lightning_icon!"
 game_concept_lightning_damage_short: "#L;color:{1.00,0.95,0.35} Rayo#!"
 game_concept_lightning_damage_short_with_icon: "$game_concept_lightning_damage_icon$$game_concept_lightning_damage_short$"
 game_concept_lightning_damage_desc: "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] contra #bold todo [splat|E]#!. La carne viva, la carne muerta y la materia espiritual conducen por igual.\n$BULLET_WITH_TAB$Sin multiplicadores de daño adicionales ni inmunidades.\n\n#weak El arma predilecta de Susanowo, el Dios de las Tormentas. Sea el rayo sobrenatural o corriente, nada puede resistir su poder destructivo.#!"

 game_concept_sun_damage: "Daño por Luz Solar"
 game_concept_sun_damage_icon: "@pod_combat_sun_icon!"
 game_concept_sun_damage_short: "#L;color:{1.00,0.92,0.50} Luz solar#!"
 game_concept_sun_damage_short_with_icon: "$game_concept_sun_damage_icon$$game_concept_sun_damage_short$"
 game_concept_sun_damage_desc: "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] contra #bold $POD_splat_vampire_plural_with_icon$#!, #bold $POD_splat_abomination_plural_with_icon$#! y #bold $POD_splat_kueijin_plural_with_icon$#!, los malditos por el sol. Unos pocos [Glossary('Dharmas','podgloss.dharma')] de los $POD_splat_kueijin_plural$ lo ignoran como daño superficial.\n$BULLET_WITH_TAB$Los demás [splats|E] son #bold inmunes#!, pues la luz del sol simplemente no hiere a los vivos ni a los no malditos.\n$BULLET_WITH_TAB$#bold #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Los Setitas#!#! y [GetTrait('bushi').GetName(GetNullCharacter)]#! reciben #bold el doble de daño#! por su $glossary_clan_curse$.\n\n#weak El sol esparce el calor de Dios por toda Su creación. Qué apropiado, pues, que los que Él maldijo ya no puedan recibirlo.#!"

 game_concept_silver_damage: "Daño por Plata"
 game_concept_silver_damage_icon: "@pod_combat_silver_icon!"
 game_concept_silver_damage_short: "#L;color:{0.85,0.85,0.95} Plata#!"
 game_concept_silver_damage_short_with_icon: "$game_concept_silver_damage_icon$$game_concept_silver_damage_short$"
 game_concept_silver_damage_desc: "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] contra #bold $POD_splat_werewolf_plural_with_icon$#! y la mayoría de los demás #bold $glossary_fera$#!, cuyo poder de regeneración flaquea al ser heridos por #italic «el Metal de $glossary_luna$»#!.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] contra los demás [splats|E].\n$BULLET_WITH_TAB$Sin multiplicadores de daño adicionales ni inmunidades.\n\n#weak Un arma de plata puede nivelar el campo de juego frente a un hombre lobo, pero que no te quepa duda: aun con su regeneración detenida, siguen siendo las mayores máquinas de matar de Gaia.#!"

 game_concept_gold_damage: "Daño por Oro"
 game_concept_gold_damage_icon: "@pod_combat_gold_icon!"
 game_concept_gold_damage_short: "#L;color:{1.00,0.75,0.20} Oro#!"
 game_concept_gold_damage_short_with_icon: "$game_concept_gold_damage_icon$$game_concept_gold_damage_short$"
 game_concept_gold_damage_desc: "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] contra #bold $POD_splat_mokole_plural_with_icon$#! y #bold $POD_splat_corax_plural_with_icon$#!, singularmente débiles al metal solar.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] contra los demás [splats|E].\n$BULLET_WITH_TAB$Sin multiplicadores de daño adicionales ni inmunidades.\n\n#weak Los Mokolé se han asegurado de que su debilidad al metal de Helios sea un secreto bien guardado. Solo pueden esperar que los Corax, tan parlanchines, hagan lo mismo.#!"

 game_concept_holy_damage: "Daño Sagrado"
 game_concept_holy_damage_icon: "@pod_combat_holy_icon!"
 game_concept_holy_damage_short: "#L;color:{1.00,0.95,0.65} Sagrado#!"
 game_concept_holy_damage_short_with_icon: "$game_concept_holy_damage_icon$$game_concept_holy_damage_short$"
 game_concept_holy_damage_desc: "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] contra #bold $POD_splat_vampire_plural_with_icon$#!, #bold $POD_splat_abomination_plural_with_icon$#!, #bold $POD_splat_demon_plural_with_icon$#!, #bold $POD_splat_kueijin_plural_with_icon$#!, #bold $POD_splat_wraith_plural_with_icon$#! y #bold $POD_splat_fae_plural_with_icon$#!, que retroceden ante las muestras de [Glossary('Fe Verdadera','game_concept_true_faith_desc')].\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] contra #bold $POD_splat_changeling_plural_with_icon$#!.\n$BULLET_WITH_TAB$Los demás [splats|E] son #bold inmunes#!.\n\n#weak He aquí que el nombre de Jehová viene de lejos; su rostro encendido, y la carga es grave; sus labios llenos de indignación, y su lengua como fuego que consume.#!" # Isaiah 30:27 KJV

 game_concept_poison_damage: "Daño por Veneno"
 game_concept_poison_damage_icon: "@pod_combat_poison_icon!"
 game_concept_poison_damage_short: "#L;color:{0.55,0.80,0.30} Veneno#!"
 game_concept_poison_damage_short_with_icon: "$game_concept_poison_damage_icon$$game_concept_poison_damage_short$"
 game_concept_poison_damage_desc: "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] contra #bold $POD_splat_mortal_plural_with_icon$#!, cuya carne viva pudre el veneno.\n$BULLET_WITH_TAB$#bold $POD_splat_vampire_plural_with_icon$#! y #bold $POD_splat_kueijin_plural_with_icon$#! son #bold inmunes#!, ya que los no-muertos no tienen un cuerpo vivo que envenenar.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] contra los demás [splats|E].\n\n#weak El arma predilecta de Lady Yul, Maeljin de las Toxinas. A menudo se la tacha de herramienta de traidores y cobardes. Pero ¿de qué sirve el honor cuando tu vida está en juego?#!"

 game_concept_cold_iron_damage: "Daño por Hierro Frío"
 game_concept_cold_iron_damage_icon: "@pod_combat_cold_iron_icon!"
 game_concept_cold_iron_damage_short: "#L;color:{0.65,0.70,0.78} Hierro frío#!"
 game_concept_cold_iron_damage_short_with_icon: "$game_concept_cold_iron_damage_icon$$game_concept_cold_iron_damage_short$"
 game_concept_cold_iron_damage_desc: "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] contra #bold $POD_splat_fae_plural_with_icon$#! y #bold $POD_splat_changeling_plural_with_icon$#!, que sufren horribles heridas humeantes por la [banality|E] del metal.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] contra los demás [splats|E].\n$BULLET_WITH_TAB$Sin multiplicadores de daño adicionales ni inmunidades.\n\n#weak Armas creadas mediante un proceso arcaico de hierro forjado. Son más pesadas y quebradizas que el acero, pero es esta naturaleza rudimentaria la que puede traer la muerte al alma feérica.#!"



