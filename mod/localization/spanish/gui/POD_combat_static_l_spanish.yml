 ##############################
 ###### DYNAMIC MOVE TOOLTIP (pod_combat_move_desc SGUI)
 ##############################
 # Tooltip values read saved scope story. 
 # each key must restore an explicit color with #medium;outline or equivalent.
 # A trailing $EFFECT_LIST_BULLET$ balances the hidden leading bullet for centering.

 # Capability callouts describe runtime behavior; their SGUI gates test absent capability flags.
 pod_combat_desc_always_hits:   "#medium;outline [Concept('pod_combat_hit_chance','No Hit roll')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_undodgeable:   "#medium;outline Inesquivable: ignora la [pod_combat_dodge_with_icon|E] y el [pod_combat_stealth_with_icon|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hits_spirits:  "#medium;outline Afecta a espíritus incorpóreos#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_uses_weapon:   "#medium;outline Usa tu [artifact|E] de arma #weak (si tiene bonificaciones para los [pod_combat_moves|E])#!#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_uses_weapon_armed: "#medium;outline Usa tu [artifact|E] de arma ([pod_weapon.GetNameNoTooltip])#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_weapon_empowered: "#medium;outline Usa #bold [pod_weapon.GetNameNoTooltip]#!:$pod_weapon_ovr_line$#! $EFFECT_LIST_BULLET$"
 # Cost fragments include a leading space; energy text is splat-aware.
 pod_combat_costline_energy:       " [GetPlayer.Custom('PODEnergySplatIcon')]#bold [Multiply_CFixedPoint( ROOT.Var('energy_cost').GetValue, GetPlayer.MakeScope.ScriptValue('pod_combat_energy_cost_display_multiplier') )|V0]#! #V [GetPlayer.Custom('PODEnergySplatWord')]#!"
 pod_combat_costline_gold:         " @gold_icon!#bold [ROOT.Var('gold_cost').GetValue|V0]#! de oro"
 pod_combat_costline_piety:        " @piety_icon!#bold [ROOT.Var('piety_cost').GetValue|V0]#! de piedad"
 pod_combat_costline_prestige:     " @prestige_icon!#bold [ROOT.Var('prestige_cost').GetValue|V0]#! de prestigio"
 pod_combat_costline_stress:       " @stress_icon!#bold [ROOT.Var('stress_cost').GetValue|V0]#! de estrés"
 pod_combat_desc_costs:            "#medium;outline Coste:[story.Custom('PODCombatEnergyCostInline')][story.Custom('PODCombatGoldCostInline')][story.Custom('PODCombatPietyCostInline')][story.Custom('PODCombatPrestigeCostInline')][story.Custom('PODCombatStressCostInline')]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_steal_gold:        "#medium;outline Roba #bold [story.MakeScope.Var('steal_gold').GetValue|V0]#! de oro al enemigo#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_gain_dread:        "#medium;outline Obtén #bold [story.MakeScope.Var('gain_dread').GetValue|V0]#! de temor#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_once_per_round:     "#medium;outline Se puede usar una vez por ronda#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_once_per_combat:    "#medium;outline Se puede usar una vez por combate#! $EFFECT_LIST_BULLET$"

 # Dispatch elements to namespaced keys to avoid vanilla flag-loc collisions.
 # Omit |E on colored concepts so the element color takes precedence over concept blue.
 pod_combat_desc_hp_damage_basic:        "#medium;outline #N Inflige#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [story.MakeScope.Var('damage_type').GetFlagName] #N de Daño#! a [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_elemental:    "#medium;outline #N Inflige#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [Localize( Concatenate( 'pod_combat_damage_type_', story.MakeScope.Var('damage_type').GetFlagKey ) )] #N de Daño#! a [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_damage:     "#medium;outline #N Inflige#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! de [pod_combat_morale|E] #N de Daño#! a [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_damage_on_hp_damage: "#medium;outline #N Inflige#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! de [pod_combat_morale|E] #N de Daño#! a [story.MakeScope.Var('targeting').GetFlagName], pero solo si el ataque inflige Daño a la salud tras Absorber#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_damage_on_contact:   "#medium;outline #N Inflige#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! de [pod_combat_morale|E] #N de Daño#! a [story.MakeScope.Var('targeting').GetFlagName], pero solo si el ataque hace contacto (incluido un golpe bloqueado o totalmente absorbido)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_damage_on_miss:      "#medium;outline #N Inflige#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! de [pod_combat_morale|E] #N de Daño#! a [story.MakeScope.Var('targeting').GetFlagName], pero solo si el ataque falla o es evadido#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage:       "#medium;outline Recibes #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! de autodaño#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage_on_hp_damage: "#medium;outline Recibes #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! de autodaño, pero solo si el ataque inflige Daño a la salud tras Absorber#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage_on_contact:   "#medium;outline Recibes #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! de autodaño, pero solo si el ataque hace contacto (incluido un golpe bloqueado o totalmente absorbido)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage_on_miss:      "#medium;outline Recibes #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! de autodaño, pero solo si el ataque falla o es evadido#! $EFFECT_LIST_BULLET$"
 # POD_combat_move_set_hp_heal always sets heal_type for the wound-box lookup.
 pod_combat_desc_hp_heal:           "#medium;outline #P Restaura#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] a [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 # Drain wording must require actual post-soak HP damage.
 pod_combat_desc_drain:             "#medium;outline #P Drena#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] del objetivo, pero solo si el ataque inflige Daño a la salud tras Absorber#! $EFFECT_LIST_BULLET$"
 # Combine damage and drain on one line. The standalone drain key covers moves without hp_damage.
 pod_combat_desc_hp_damage_basic_drain:        "#medium;outline #N Inflige#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [story.MakeScope.Var('damage_type').GetFlagName] #N de Daño#! a [story.MakeScope.Var('targeting').GetFlagName], #P drena#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] si el ataque inflige Daño a la salud tras Absorber#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_elemental_drain:    "#medium;outline #N Inflige#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [Localize( Concatenate( 'pod_combat_damage_type_', story.MakeScope.Var('damage_type').GetFlagKey ) )] #N de Daño#! a [story.MakeScope.Var('targeting').GetFlagName], #P drena#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] si el ataque inflige Daño a la salud tras Absorber#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_heal:       "#medium;outline #P Restaura#! #bold [story.MakeScope.Var('morale_heal').GetValue|V0]#! de [pod_combat_morale|E] a [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_energy_gain:       "#medium;outline #P Restaura#! #bold [Multiply_CFixedPoint( story.MakeScope.Var('energy_gain').GetValue, GetPlayer.MakeScope.ScriptValue('splat_energy_multiplier') )|V0]#! [GetPlayer.Custom('PODEnergySplatIcon')] #V [GetPlayer.Custom('PODEnergySplatWord')]#!#! $EFFECT_LIST_BULLET$"

 pod_combat_desc_soak_buff_round:    "#medium;outline #P +[soak_damage|E]#! (nivel [story.MakeScope.Var('soak_buff_round_tier').GetValue|V0]) hasta que empiece tu siguiente turno#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_soak_buff_combat:   "#medium;outline #P +[soak_damage|E]#! (nivel [story.MakeScope.Var('soak_buff_combat_tier').GetValue|V0]) durante el resto del combate#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_soak_debuff_round:  "#medium;outline #N -[soak_damage|E]#! (nivel [story.MakeScope.Var('soak_debuff_round_tier').GetValue|V0]) a [story.MakeScope.Var('targeting').GetFlagName] durante el siguiente turno del objetivo#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_soak_debuff_combat: "#medium;outline #N -[soak_damage|E]#! (nivel [story.MakeScope.Var('soak_debuff_combat_tier').GetValue|V0]) a [story.MakeScope.Var('targeting').GetFlagName] durante el resto del combate#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hit_buff_round:     "#medium;outline #P +[pod_combat_hit_chance|E]#! (nivel [story.MakeScope.Var('hit_buff_round_tier').GetValue|V0]) hasta que empiece tu siguiente turno#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hit_buff_combat:    "#medium;outline #P +[pod_combat_hit_chance|E]#! (nivel [story.MakeScope.Var('hit_buff_combat_tier').GetValue|V0]) durante el resto del combate#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hit_debuff_round:   "#medium;outline #N -[pod_combat_hit_chance|E]#! (nivel [story.MakeScope.Var('hit_debuff_round_tier').GetValue|V0]) a [story.MakeScope.Var('targeting').GetFlagName] durante el siguiente turno del objetivo#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hit_debuff_combat:  "#medium;outline #N -[pod_combat_hit_chance|E]#! (nivel [story.MakeScope.Var('hit_debuff_combat_tier').GetValue|V0]) a [story.MakeScope.Var('targeting').GetFlagName] durante el resto del combate#! $EFFECT_LIST_BULLET$"
 # Use ally wording only when targeting diverts the buff from the actor.
