 ##############################
 ###### GUI LABELS
 ##############################

 pod_combat_window_title: "#bold [GetPlayer.Custom('PODCombatTitle')]:#! [GetScriptedGui('pod_combat_display_team_name').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('is_enemy',MakeScopeValue('(CFixedPoint)0')).End)] contra [GetScriptedGui('pod_combat_display_team_name').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('is_enemy',MakeScopeValue('(CFixedPoint)1')).End)]"
 pod_combat_round: "Ronda #V [GetPlayer.MakeScope.ScriptValue('pod_combat_round_value')|0]#!"
 pod_combat_ap_label: "#bold [pod_combat_action_points|E]:#!"
 pod_combat_end_turn: "Terminar Turno"
 pod_combat_end_turn_desc: "Termina tu turno y deja que actúe el oponente."
 pod_combat_advance_turn_label: "Avanzar"
 pod_combat_advance_turn_tt: "Resuelve el turno del siguiente combatiente y luego hace una pausa para que puedas leer el tablero. Se muestra mientras actúa una IA; marca #bold Avance automático de turnos#! para resolver toda la ronda con un solo clic."
 pod_combat_auto_advance_label: "Avance automático de turnos"
 pod_combat_auto_advance_tt: "#bold Marcado:#! los turnos de la IA se resuelven automáticamente y se avanza directamente hasta tu siguiente turno.\n#bold Desmarcado:#! se avanza un combatiente por clic, con una pausa entre los turnos de la IA para que puedas leer el tablero."
 pod_combat_end_combat: "Terminar Combate"
 pod_combat_auto_resolve: "Resolución Automática"
 # Keep wounds qualitative: the damage and soak rolls have not happened yet.
 pod_combat_auto_resolve_desc: "Omite el resto del combate. El ganador se determina comparando la destreza.\n\nTodos los que sigan en pie corren el riesgo de sufrir una herida en el forcejeo final, en proporción a cómo se decidió la pelea: un ganador claro sale casi indemne y el bando derrotado se lleva lo peor. Los combates de práctica quedan exentos.[GetPlayer.Custom('PODCombatAutoResolveVerdict')]"
 pod_combat_auto_resolve_forced_loss_tt: "\n\n@warning_icon!#X Tu bando no tiene forma de dañar a un espíritu incorpóreo, así que resolver automáticamente aquí equivale a ceder la pelea y tu gente sufrirá las peores consecuencias.#!"
 pod_combat_auto_resolve_forced_win_tt: "\n\n#P Tus enemigos no tienen forma de dañar tu forma incorpórea, así que resolver automáticamente aquí gana la pelea.#!"
 pod_combat_help_button: "Ayuda"
 pod_combat_help_tooltip: "Abre la Visión General del Sistema de Combate como referencia rápida de las reglas."
 pod_combat_allies_label: "ALIADOS"
 pod_combat_enemies_label: "ENEMIGOS"

 pod_combat_status_guard_tt: "Guardia: bloquea el siguiente ataque que de otro modo impactaría"
 pod_combat_status_dodge_tt: "Esquiva: anula el siguiente ataque"
