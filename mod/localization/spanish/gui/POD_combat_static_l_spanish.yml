 pod_combat.0001.t: "Visión General del Sistema de Combate"
 pod_combat.0001.desc: "Los [pod_combat_encounters_with_icon|E] son por turnos: cada combatiente gasta [pod_combat_action_points|E] en [pod_combat_moves|E], y tú eliges entre el equipamiento que has preparado de antemano. Ganas cuando todos los enemigos están [pod_combat_knocked_out|E]. A menos que eso ocurra antes, pierdes en cuanto cae tu personaje, aunque queden aliados. Cada etiqueta azul de la ventana de combate tiene una información emergente: úsalas siempre que necesites un recordatorio.\n\nElige un tema a continuación para ver los detalles. Puedes volver a abrir este menú en cualquier momento con el botón #bold Ayuda#!."
 pod_combat.0001.a: "» Turnos y Selección de Objetivo"
 pod_combat.0001.b: "» Interpretar el Combate"
 pod_combat.0001.c: "» Ataque, Defensa y Efectos"
 pod_combat.0001.d: "» Resultados y Controles"
 pod_combat_help_back: "« Volver a los temas"
 pod_combat_help_close: "Cerca"
 pod_combat.0100.t: "Turnos y Selección de Objetivo"
 pod_combat.0100.desc: "#bold TU TURNO#!\nCada ronda empiezas con #bold [GuiScope.ScriptValue('pod_combat_base_ap')|0]#! [pod_combat_action_points|E] (más o menos si algo los ha mejorado, drenado o devuelto). Gasta PA en los movimientos de tu barra; los que no puedes pagar aparecen atenuados. Pulsa #bold Terminar Turno#! cuando acabes: los PA no gastados se pierden.\n\nMuchos movimientos cuestan además #bold energía sobrenatural#!: Sangre para los vampiros, Gnosis para los cambiaformas, Pathos o Angustia para los wraiths, Glamour para los changelings, etcétera. Se paga de la reserva habitual de tu splat, así que abusar de las Disciplinas costosas te desgasta durante la pelea y te deja agotado después. Unos pocos movimientos cuestan también Oro, Piedad, Prestigio o [static_stress|E].\n\nPara elegir qué hay en tu barra, abre la [decision|E] [GetDecision('pod_combat_configure_moves').GetName|V] antes del combate. Estás limitado a cuatro movimientos por categoría (#color_red ATQ#! / #color_light_blue DEF#! / #color_porple CTL#! / #color_pwr_orange PDR#!). Activa #bold Mostrar todos los movimientos#! allí para examinar los que aún no has desbloqueado: cada movimiento bloqueado indica exactamente qué rasgos, poderes o ventajas te faltan.\n\n#bold ELEGIR OBJETIVO#!\nHaz clic en la #bold tarjeta#! de un aliado o enemigo (o en su retrato de la tira del orden de turnos) para marcarlo como objetivo actual; su tarjeta muestra una insignia @check_icon! #bold Objetivo#!, y tu objetivo y tu [pod_combat_hit_chance|E] contra él aparecen en la parte superior de la ventana. Los movimientos ofensivos se lanzan contra tu objetivo enemigo, los de apoyo (curaciones, mejoras) contra tu objetivo aliado, y los movimientos solo para ti ignoran la selección. Algunos movimientos son #bold de área#!: golpean a todos los enemigos o a todos los aliados a la vez, sea cual sea tu selección. Cambiar de objetivo recalcula tu Probabilidad de Impacto a partir de tu [prowess|E] frente a la suya, tus modificadores de Impacto activos y tu propia bonificación de [pod_combat_stealth_with_icon|E]. La [pod_combat_guard_with_icon|E], la [pod_combat_dodge_with_icon|E], el [pod_combat_stealth_with_icon|E] y la [soak_damage|E] del objetivo se resuelven por separado y no alteran ese porcentaje.\n\n#bold A QUIÉN BUSCA LA IA#!\nLa tarjeta de cada combatiente de la IA tiene una línea #bold Atacando a#! que indica a quién fue a por último, tanto en enemigos como en tus aliados de la IA (tu objetivo es el indicador de arriba). Es el rival en quien se están #italic concentrando#!: una fuerte tendencia, pues los combatientes suelen seguir golpeando a la misma víctima, pero no una garantía: la IA cambiará de objetivo para rematar a uno casi caído. La línea está en blanco antes de que un combatiente haya jugado su primer turno y mientras está #bold dominado#! (su concentración se borra ese turno). Léela para detectar a quién están a punto de acorralar y para sacar a un aliado frágil de la línea de fuego.\n\n#bold ORDEN DE TURNOS#!\nEn peleas de tres o más, una #bold tira de orden de turnos#! con retratos recorre la parte superior: el orden de actuación, de izquierda a derecha. Cada combatiente tira [pod_combat_initiative|E] una sola vez al entrar en la pelea y la conserva, así que el orden se mantiene durante toda la refriega y puedes planear varios turnos por adelantado; solo una penalización de iniciativa lo altera, y solo durante una ronda. El actor actual aparece resaltado en dorado; los retratos se atenúan cuando ya han actuado o han caído, y la tira se desplaza lateralmente cuando la refriega se llena. Pueden unirse combatientes a una pelea ya en marcha (un nigromante que alza a un aliado wraith, refuerzos que llegan) y se integran en el orden a partir de la siguiente ronda."
 pod_combat.0101.t: "Interpretar el Combate"
 pod_combat.0101.desc: "#bold LAS TARJETAS DE LOS COMBATIENTES#!\nLa tarjeta de cada combatiente muestra:\n• [POD_health_track|E]: casillas de herida; se llena a medida que reciben golpes.\n• [pod_combat_morale|E]: compostura mental, independiente de la salud. Los ataques mentales directos la reducen; cada casilla de herida que un golpe inflige realmente tras Absorber también quita #bold [GuiScope.ScriptValue('pod_combat_morale_from_hp_base_ratio')|0]#! de Moral.\n• [prowess|E] / [pod_combat_hit|E] / [soak_damage|E]: cifras ofensivas y defensivas.\nPasa el cursor sobre cualquier tarjeta para ver el desglose completo, incluidos la [pod_combat_init|E] de ese combatiente y su número de [pod_combat_turn|E] en el orden.\nLos iconos de estado del borde inferior de la tarjeta señalan las posturas y aflicciones activas (Guardia, Esquiva, Sigilo, Represalia, ardiendo, aturdimiento, dominación); pasa el cursor sobre cualquiera de ellos para ver los detalles.\n\n#bold EL REGISTRO DE COMBATE#!\nEl panel desplazable bajo la barra de movimientos recoge por orden todos los sucesos relevantes, el más reciente arriba. Cada fila muestra quién actuó, el movimiento, el objetivo y todo lo que hizo el movimiento: daño, curación, drenajes, aflicciones, retroceso y contraataques, además de los fallos, bloqueos y absorciones que los detuvieron. Los aliados aparecen teñidos de dorado y los enemigos de rojo, de modo que un rápido vistazo atrás te da el ritmo de la pelea.\n\nAlgunos patrones de fila que conviene reconocer:\n• Los ataques #bold de área#! añaden #bold una fila por objetivo#! para que veas exactamente quién recibió qué (p. ej., «Mithras → Todos los enemigos (Steve)»).\n• Cuando se activa una postura como Represalia, la fila que la provocó muestra un añadido #bold + Contraataque#! junto al resultado principal.\n• Unos marcadores enmarcan la pelea: «— Comienza el combate —» abajo, «— Comienza la ronda 2 —» en cada cambio de ronda, y «— Fin del combate · Victoria —» o «— Fin del combate · Derrota —» arriba cuando termina."
 pod_combat.0102.t: "Ataque, Defensa y Efectos"
 pod_combat.0102.desc: "#bold ACERTAR UN GOLPE#!\nLa información emergente de un movimiento indica qué fases defensivas omite. Un ataque físico normal debe poder afectar primero a un espíritu incorpóreo. Después, el [pod_combat_stealth_with_icon|E] o la [pod_combat_dodge_with_icon|E] pueden evadirlo, su tirada de [pod_combat_hit_chance|E] puede fallar, y la [pod_combat_guard_with_icon|E] puede bloquear un golpe que de otro modo impactaría. Luego la [soak_damage|E] se tira por separado contra cada punto de daño, de modo que un golpe fuerte suele reducirse en vez de detenerse del todo.\n\n#bold Sin tirada de Impacto#! omite solo la tirada porcentual; #bold Inesquivable#! ignora la Esquiva y el Sigilo; #bold Afecta a espíritus incorpóreos#! siempre golpea a los espíritus aunque de otro modo no pudieras; y #bold Ignora la Guardia#! impacta a través de ella. #bold Rompe la Guardia#! o #bold Elimina Esquiva / Sigilo#! borra esa postura antes de que se resuelvan los demás efectos del movimiento. Los ataques sobrenaturales y mentales normalmente omiten la tirada de Impacto y la Guardia, pero la Esquiva y el Sigilo aún pueden evadirlos.\n\n#bold TIPOS DE DAÑO#!\n• [Concept('POD_superficial_damage','Superficial')|E]: absorbible punto por punto, se cura entre combates.\n• [Concept('POD_aggravated_damage','Agravado')|E]: inabsorbible por defecto, se cura despacio. Los ataques elementales ([fire_damage_short|E], [cold_damage_short|E], [lightning_damage_short|E], [sun_damage_short|E], [silver_damage_short|E], [gold_damage_short|E], [holy_damage_short|E], [balefire_damage_short|E], [poison_damage_short|E] y [cold_iron_damage_short|E]) son agravados solo contra los splats vulnerables a ellos, y algunos splats son directamente #bold inmunes#!: pasa el cursor sobre el tipo de daño para ver el desglose de estas vulnerabilidades.\nUnos pocos movimientos son #bold ataques drenadores#! que te curan, pero solo si el ataque inflige Daño a la salud tras Absorber. Unos pocos #bold te hieren a ti#! al usarlos: ataques temerarios a todo o nada que sacrifican parte de tu propia salud por un golpe más pesado.\n\n#bold JUEGO DEFENSIVO#!\nPuedes acumular defensas por adelantado: permanecen activas hasta que algo las pone a prueba. Un buen turno suele preparar una defensa en lugar de atacar:\n• [pod_combat_guard_with_icon|E]: bloquea el siguiente ataque que comprueba la Guardia y que de otro modo impactaría.\n• [pod_combat_dodge_with_icon|E]: anula el siguiente ataque que comprueba la Esquiva; los movimientos Inesquivables la dejan lista.\n• [pod_combat_stealth_with_icon|E]: +[GuiScope.ScriptValue('pod_combat_stealth_hit_bonus')|0]% de Impacto mientras está activo; se consume con tu siguiente movimiento de salud o de contacto hostil, o cuando evitas un ataque.\n• #bold Represalia al Impactar / al Fallar#!: contraataca a quien te pone a prueba. La información emergente del movimiento indica el contraataque exacto y si es superficial o agravado.\n\n#bold MEJORAS Y PENALIZACIONES#!\nLos efectos temporales de Impacto y Absorber vienen en niveles pequeño, medio y grande. Las mejoras y penalizaciones de Impacto, y las penalizaciones de Absorber, suman o restan #bold 10 / 20 / 30#! puntos porcentuales. Las mejoras de Absorber, en cambio, reducen en #bold 10 / 20 / 30%#! el daño restante tras el Absorber existente, así que su beneficio mostrado depende del Absorber actual del combatiente.\n\nLas versiones de ronda y de combate ocupan ranuras distintas, igual que las mejoras y las penalizaciones, por lo que pueden coexistir. Dentro de la misma estadística, dirección y duración, solo un nivel estrictamente superior sustituye al actual; un nivel igual o inferior no añade nada. Una mejora de ronda expira cuando empieza el siguiente turno de su portador, mientras que una penalización de ronda dura durante el siguiente turno de su portador y expira al final de ese turno. Los efectos de duración de combate duran hasta que termina la pelea.\n\n#bold AFLICCIONES Y CONTROL#!\nAlgunos movimientos dejan algo más que una herida:\n• #bold Daño con el tiempo#!: se activa al final de cada ronda durante unas cuantas rondas, y cada efecto se marca con el icono de su tipo de daño. Las aflicciones mentales reducen en cambio la [pod_combat_morale|E]; las de tipo indefinido simplemente hieren. Un icono de estado en la tarjeta de la víctima lo señala; pasa el cursor para ver el daño y las rondas restantes.\n• #bold Aturdimiento y atontamiento#!: algunos ataques drenan los Puntos de Acción del objetivo para su siguiente turno. Un drenaje total hace que ese turno empiece con #bold 0 PA#!; los movimientos elegibles de 0 PA siguen siendo utilizables.\n• #bold Dominación#!: unos pocos poderes mentales roban el siguiente turno de un combatiente y lo vuelven contra su propio bando. Las defensas mentales fuertes lo ignoran salvo que el lanzador pueda atravesarlas, y #bold tu#! personaje nunca puede ser manipulado."
 pod_combat.0103.t: "Resultados y Controles"
 pod_combat.0103.desc: "#bold QUEDAR FUERA DE COMBATE#!\nUn combatiente queda fuera de la pelea cuando ocurre cualquiera de estas cosas:\n• Su [POD_health_track|E] se llena por completo.\n• Su [pod_combat_morale|E] llega a cero.\n• Muere, queda #N Incapacitado#!, entra en letargo o queda atrapado en el Reino de las Sombras o en el Abismo.\nCada caída sacude a los supervivientes: cada compañero que queda pierde #bold [GuiScope.ScriptValue('pod_combat_ally_down_morale_penalty')|0]#! de [pod_combat_morale|E], pero este shock nunca puede dejarlos por debajo de 1 de Moral. #bold Ganas#! en cuanto no queda ningún enemigo. En caso contrario, si #bold tu personaje#! queda fuera de combate, pierdes de inmediato aunque queden aliados.\n\n#bold TRAS LA PELEA#!\nFuera de los combates de Práctica, cada combatiente vivo recibe #bold [GuiScope.ScriptValue('pod_combat_morale_stress_multiplier')|0]#! de [static_stress|E] por cada punto de [pod_combat_morale|E] que aún falte cuando acaba el combate. Restaurar Moral antes reduce este coste duradero. Las heridas persisten según el modo de duelo, y la energía sobrenatural u otros recursos gastados en movimientos siguen gastados. Tu equipamiento de movimientos se conserva entre combates.\n\n#bold MODOS DE DUELO#!\nEl evento que desencadenó la pelea decide las reglas de letalidad:\n• #bold Letal#!: las heridas persisten y se aplican las reglas normales de heridas, muerte y supervivencia específicas de cada splat de PoD. Algunos eventos iniciadores garantizan que el perdedor muera.\n• #bold No letal#!: las heridas se aplican con normalidad y pueden dejar fuera de combate a los combatientes, pero se bloquean las muertes por heridas. Al terminar el combate, un seguimiento de heridas completamente lleno se cura hasta dejar una casilla vacía.\n• #bold Práctica#!: el daño, la curación y la Moral funcionan durante el combate de entrenamiento y determinan quién cae, pero después se restauran todos los seguimientos de heridas previos a la pelea y la Moral que falte no genera Tensión Mental duradera. Se siguen pagando los costes normales de los movimientos, y las ganancias condicionales de energía pueden persistir.\n\n#bold BOTONES DE LA VENTANA#!\n• #bold Terminar Turno#!: confirma tu turno y pasa al siguiente combatiente por orden de iniciativa. Los PA no gastados se pierden.\n• #bold Resolución Automática#!: omite el resto del combate. Se suma la [prowess|E] en directo de cada equipo superviviente y luego este recibe una bonificación aleatoria de cero hasta ese total; gana la puntuación más alta, y los empates favorecen a tu bando. La Moral del líder perdedor cae a cero, lo que genera la máxima Tensión Mental basada en Moral fuera de la Práctica si ese líder sobrevive.\n  Omitir la pelea no sale gratis. En el forcejeo final todo combatiente que siga en pie resulta herido, incluidos los ganadores, en proporción a lo decisivamente que se resolvió la pelea: un resultado ajustado perjudica a ambos bandos por igual, y una derrota total deja casi intactos a los ganadores y malheridos a los perdedores. La [soak_damage|E] se tira con normalidad, así que un combatiente duro puede ignorarlo por completo. Los combates de práctica quedan exentos.\n  Una cosa anula esa tirada: si sigue en pie un enemigo al que #bold no tienes forma de dañar#! (un espíritu incorpóreo al que nadie de tu bando puede tocar), no hay total que gane, así que la Resolución Automática cede en lugar de tirar. El botón sigue disponible precisamente porque esa pelea no tiene otra salida, y su información emergente te avisa antes de pulsarlo. Lo inverso también se cumple, pero solo cuando #bold tu propio personaje#! es el intocable: un aliado incorpóreo no te salva, ya que pierdes en el momento en que cae tu personaje.\n• #bold Terminar Combate#!: cierra la ventana una vez resuelta la pelea (sustituye a Terminar Turno / Resolución Automática tras la victoria o la derrota).\n• Casilla #bold Avance automático#!: cuando está activada, todos los turnos de la IA de una ronda se resuelven con un solo clic en lugar de uno a uno.\n• #bold Ayuda#!: vuelve a abrir esta guía en cualquier momento.\n\nUna vez decidido el vencedor, aparece una opción #bold $pod_combat.9995.a$#!, y al elegirla vuelves al evento que exigió la pelea. No se puede abandonar un duelo a medias: llévalo hasta el final o deja que la Resolución Automática lo zanje."

