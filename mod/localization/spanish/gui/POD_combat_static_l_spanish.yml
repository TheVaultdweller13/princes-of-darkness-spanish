 ##############################################################################
 ###### POD COMBAT - STATIC LOCALIZATION
 ##############################################################################
 # Shared combat UI, log, help and rule text.
 # Per-move names and flavor live in POD_combat_moves_l_english.yml.

 ##############################################################################

 ##############################
 ###### MOVE CONFIG WINDOW
 ##############################

 pod_combat_moves_title: "#bold MOVIMIENTOS#! DE COMBATE"
 pod_combat_equipped_label: "Equipado"
 pod_combat_configure_moves: "Configurar Movimientos de Combate"
 pod_combat_configure_moves_desc: "Elige qué [pod_combat_moves|E] llevar a tu próxima pelea."
 pod_combat_configure_moves_tooltip: "Elige qué [pod_combat_moves|E] equipar para la batalla."
 pod_combat_configure_moves_tt: "Abre el editor de equipamiento de [pod_combat_move|E], donde puedes equipar hasta [EmptyScope.ScriptValue('pod_combat_max_equipped')|V0] movimientos para usar durante [pod_combat_encounters_with_icon|E]."
