 quincunx_edict_tax_modifier: "Guerra del Crepúsculo promovida"
 quincunx_edict_tax_modifier_desc: "La Guerra del Crepúsculo es el método más refinado de librar una guerra de sombras entre los [GetTrait('kueijin').GetName( GetNullCharacter )], y quizás el más interesante. En muchos sentidos, se parece más a un duelo que a una guerra. Los combatientes luchan de acuerdo con reglas de conducta prescritas, y se recurre a una parte neutral para arbitrar la disputa. El objetivo no es diezmar las posesiones del oponente, sino cumplir un objetivo designado —el asesinato de un valioso señor de la guerra, o la abdicación de un líder político popular, por ejemplo— con tanta estrategia y delicadeza como sea posible."
 quincunx_edict_army_modifier: "Guerra de la Medianoche promovida"
 quincunx_edict_army_modifier_desc: "La Guerra de la Medianoche es la forma más brutal de librar una guerra de sombras entre los [GetTrait('kueijin').GetName( GetNullCharacter )]: una vendetta en la que cada bando utiliza todas y cada una de las tácticas para eliminar al otro, y no se da cuartel. La guerra de la medianoche debe declararse abiertamente, ante un ancestro de alto rango; una vez declarada, sin embargo, no hay forma honorable de terminarla, salvo mediante algunos ritos."