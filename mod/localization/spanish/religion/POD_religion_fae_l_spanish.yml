 summer_court_religion_desc: "La Corte de Verano se enorgullece de su adhesión a la tradición y la estructura, y del estricto cumplimiento de la disciplina. Las hadas de verano son señores severos pero justos, y su amor por las Tradiciones significa que han conservado muchos tesoros y baluartes de eras pasadas."

 summer_court: "Corte de Verano"
 summer_court_adj: "Corte de Verano"
 summer_court_adherent: "De la estirpe estival"
 summer_court_adherent_plural: "De la estirpe estival"
 summer_court_desc: "Envueltos en los roles tradicionales de las hadas, la Corte de Verano está poblada por reflejos vivientes del poder menguante de la estirpe de las hadas. El núcleo mismo de esta Corte es la encarnación literal de una estasis inmutable; y en los pilares de la tradición y la historia, las hadas de verano encuentran una fuerza única. Las dignas hadas de verano son conscientes de los cambios en el reino mortal, pero han tomado la decisión consciente de resistirse a ellos. La humanidad ha olvidado las viejas costumbres. Las hadas de verano no. Para estos Tradicionalistas, es hora de recordar a los mortales el orden de las cosas: renovando todos sus lazos desvanecidos, recordándoles todas las costumbres perdidas y devolviendo a los recién llegados a su lugar adecuado en el mundo. Para las hadas de verano, el desconocimiento de la ley no es excusa. Puede que la humanidad haya olvidado muchos de sus juramentos, pero eso no significa que el castigo deba aligerarse en consecuencia."
 
 summer_court_militants: "Militantes de la Corte de Verano"
 summer_court_militants_adj: "Militante de la Corte de Verano"
 summer_court_militants_adherent: "Militante estival"
 summer_court_militants_adherent_plural: "Militantes estivales"
 summer_court_militants_desc: "A medida que la Tregua del Juramento entra en sus últimos días, las hadas de la Corte de Verano se preparan para la reanudación del conflicto con corazones alegres y hojas afiladas. La Guerra de las Estaciones es su batalla; siempre han creído que emergerán como los vencedores definitivos.\n\nLa mayoría de los dominios de verano tienen exhibiciones tradicionales y absolutamente ostentosas de influencia militar. Ya sean estandartes de guerra colgando de las vigas de la sala del trono de un palacio, o una colección de túneles bajo la tierra llenos de las notas de gaitas, flautas y arpas de una antigua canción de guerra, muchas de las hadas de verano valoran las herramientas de la guerra y son feroces defensoras de la agenda Militante. La Corte siente un odio apasionado hacia los Patronos, lo cual es lógico considerando la ardiente seguridad de las hadas de verano de que triunfarán en la Guerra de las Estaciones."

 summer_court_trucebearers: "Portadores de Tregua de la Corte de Verano"
 summer_court_trucebearers_adj: "Portador de la Tregua de la Corte de Verano"
 summer_court_trucebearers_adherent: "Portador de la Tregua de los de Verano"
 summer_court_trucebearers_adherent_plural: "Portadores de la Tregua de los de Verano"
 summer_court_trucebearers_desc: "Los Portadores de la Tregua son casi inexistentes en la Corte de Verano, y aquellos que persiguen esa agenda suelen hacerlo con la única intención de permitir que sus propios dominios tengan más tiempo para prepararse para el eventual reanudamiento de la batalla. Otros seres de verano, a lo largo de los 800 años transcurridos desde la Batalla de Stone (y especialmente durante los 100 años de la Tregua del Juramento), han forjado alianzas y amistades estrechas con los miembros de Cortes rivales, y no están precisamente ansiosos por entrar en combate contra estos nuevos camaradas. Por último, a algunos hadas no les importa si las Cortes vuelven a la guerra; simplemente preferirían no tener que participar en el conflicto. Algunos seres de verano incluso abogan por un regreso a [UmbraGlossary('arcadia')]."

 summer_court_humanists: "Humanistas de la Corte de Verano"
