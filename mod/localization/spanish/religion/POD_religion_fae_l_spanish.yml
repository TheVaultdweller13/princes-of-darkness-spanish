 autumn_court_militants_adherent_plural: "Militantes de los de Otoño"
 autumn_court_militants_desc: "Los militantes surgen de todas las Cortes, aunque la Corte de Otoño es la que tiene menos entre sus filas con ganas de batalla. Algunas hadas de Otoño están ansiosas por que termine la Tregua del Juramento para poder regresar a los combates de la Guerra de las Estaciones.\n\nLos militantes de los de Otoño tejen intrigas para manipular tanto a hadas como a mortales, sirviendo como peones en la guerra. Buscan utilizar a la humanidad y los antiguos juramentos como armas en la Guerra de las Estaciones. Los mortales, con todas sus fragilidades y debilidades, son útiles debido a los juramentos que los vinculan; útiles tanto como escudos contra la banalidad como aliados en el conflicto venidero. La Guerra de las Estaciones comenzó con asesinatos, emboscadas de escaramuzadores, ataques por delegados humanos y hadas engañados, puñaladas por la espalda, mercenarios del Solsticio y sorpresas; las hadas de Otoño creen que también puede ganarse mediante tales medios. ¡Ataca desde las sombras!"

 autumn_court_trucebearers: "Portadores de la Tregua de la Corte de Otoño"
 autumn_court_trucebearers_adj: "Portador de la Tregua de la Corte de Otoño"
 autumn_court_trucebearers_adherent: "Portador de la Tregua de los de Otoño"
 autumn_court_trucebearers_adherent_plural: "Portadores de la Tregua de los de Otoño"
 autumn_court_trucebearers_desc: "Las hadas de Otoño han abierto sus ojos y han bajado sus espadas, porque algo está muy, muy mal. La Guerra de las Estaciones es una apuesta de necios: casi imposible de ganar y devastadora para los vencedores, pues la Corte que finalmente logre la victoria estará tan debilitada por la guerra que cualquier triunfo carecerá de sentido. Las hadas de la Corte de Otoño están dirigiendo su atención hacia el hecho de que el mundo ya no es suyo. Las hadas de Otoño se dan cuenta de que lo que viene después del conflicto es, en realidad, el aspecto más importante. Los humanos poseen magia proveniente de su inventado supervisor divino, lo que hace que muchas hadas se pregunten si el Ser Supremo es, de hecho, una invención mortal o no. Desde la era del dominio de las hadas declarado abiertamente, el rostro del mundo ha cambiado demasiado como para simplemente revelarse ante los humanos y esperar miedo, adoración y respeto. Ahora, se deben emplear métodos diferentes si las hadas desean lograr sus objetivos. La Guerra de las Estaciones puede esperar. Ahora es el momento de hacer un balance del mundo y ver por qué se está librando realmente la gran guerra."
 
 autumn_court_humanists: "Humanistas de la Corte de Otoño"
 autumn_court_humanists_adj: "Humanista de la Corte de Otoño"
 autumn_court_humanists_adherent: "Humanista de los de Otoño"
 autumn_court_humanists_adherent_plural: "Humanistas de los de Otoño"
 autumn_court_humanists_desc: "Aunque la mayoría de las hadas son humanistas en un grado u otro, los miembros de esta facción pueblan significativamente la Corte de Otoño. Las hadas de la Corte de Otoño destacan por ver el panorama general y trabajar hacia sus objetivos con esto en mente. Fascinadas por la humanidad, incluso más que la mayoría de las hadas, los de Otoño son contemplativos e ingeniosos. Jurar un pacto con un hada de Otoño es muy parecido a hacer un trato con el diablo: seductor, empoderador y, a menudo, mortal en el balance final. Las hadas de Otoño miran a los humanos y su fe con asombro y ambición, y ellas, más que todas las hadas, saben que la siguiente fase de la Guerra de las Estaciones depende enteramente de cómo se trate con la humanidad. Las hadas de la Corte de Otoño buscan ocultar su verdadero ser a los humanos, dominándolos y manipulándolos tras fachadas de misteriosos benefactores."

 autumn_court_constantinians: "Constantinianos de la Corte de Otoño"
 autumn_court_constantinians_adj: "Constantiniano de la Corte de Otoño"
 autumn_court_constantinians_adherent: "Constantiniano de Otoño"
 autumn_court_constantinians_adherent_plural: "Constantinianos de Otoño"
 autumn_court_constantinians_desc: "La Corte de Otoño está inundada de constantinianos, quienes establecen contactos tentativos con mortales selectos en su inmenso empeño por comprender las complejidades y el poder de la fe humana. El poder del bautismo aterroriza a las hadas de Otoño más que a cualquier otra Corte, tanto porque la Corte consiste en gran parte de changelings, como porque han aprendido mucho sobre las intrincadas complejidades de la fe humana. El bautismo mismo es considerado unánimemente con horror, pues un ritual que puede contrarrestar inmediatamente un Bautizo y lavar a un hada de sus poderes místicos es visto como nada menos que un destino peor que la muerte.\n\nLos de Otoño son pragmáticos. En lugar de ver a la Iglesia como un enemigo al que oponerse y detener, la ven como un misterio que debe ser revelado, abierto y estudiado. Una vez que se comprenda el poder de las creencias de los mortales, tal vez incluso las Nieblas regresen a su equilibrio más benévolo." 
 
# Solstice Court
# Courtless and scattered, the unSained are the neutral faction in the War of Seasons. While most are ignored, disregarded or simply despised, the Solstice fae can also make mercenaries and diplomats of extraordinary skill and usefulness, due to their unbiased stance in the whole conflict. A Solstice fae can be either a great boon to an oathcircle, or a great burden, depending on the local fae and their opinions—and the Solstice-king's personal skills. Many of them ignore fae society completely and exist on the fringes of domains, while others carve out what lives they can as sell-swords and couriers for the high and mighty Courts.

# The Courtless fae first appeared after seasonal rule was instituted. Some fae, the story goes, refused to be part of the seasonal rule. They wold accept nothing less than true rule. Most Fae regarded this attitude with amusement and contempt, and turned such fae out of their Courts. These outcasts wandered from place to place, and eventually began acting as couriers and mercenaries to survive. The Solstice fae, as they have become known, still perform those duties today.
 
# Solstice Poem:

# We have no great song. No poem. No words. And yet,we are beholden to none; slaves to

# neither the seaons' turning nor destiny's wheel.
# They are pitied by the Spring Court, disregarded by the Autumn Courtiers, hated by the Winter-kin, and publicly despised by the Summer fae. The main accusation aimed at the Solstice fae, however, is one of stupidity. The fact is that a fae who remains unSained and unallied with a chosen Court has no claim to the human realm once the War of Seaons is won.
# Every Sained fae, eve if they are not fighters or soldiers, believes that their Court's ideology is the truest and best plan for the new world order. In the face of such dedication and fanaticism, the Solstice fae simply shrug and declare no interst, no allegiance and no desire to partake of the final prize—the world itself.
# The fact that most Solstice fae don't even hold oaths with humanity adds another layer of disadvantage to their situations. Oaths, in their most basic form, are shields against banality. Solstice fae, lacking even this basic defense for their unSained souls, are accordingly vulnerable in the human realm.
# The reputation of this faction is tattered further by the slander of the Winter and Summer Courts, for both have inner factions that hold vague legends claiming the entire War of Seasons was started by a faction of the Solstice fae known as the Coterie of Drail to be true. A few fae alive today claim to have met Drail, even though their meetings with him would have dated many years after the commencement of the War of Seasons. He is not a name spoken with kindness.
# For all their perceived vulnerabilities, Solstice mercenaries are the hirelings of choice in the War of Seasons. It is safer to acquire the services of the Solstice fae over any Sained fae, because the Courtless have no predetermined or pre-sworn loyalties. As soldiers, diplomats, message-bearers, spies and ambassadors, the Solstice fae are in their element.
# Ofcourse, everyone has a price. The Solstice fae are no exception, and it's possible that a hireling will defect or betray secret information. This is always a risk for the employer, but many Solstice fae have earned their reputations for reliability through years of diligence, effort and conflict.
# With such chaotic roots, its hardly surprising that the Solstice fae are not divided equally among the three Origins. Firstborn are by far the most numerous, followed by inanimae and changelings. While not specifically rare, changelings are certainly outnumbered by the othe Origins due to the Solstice fae's lack of oaths and associated relations with humans. Solstice firstborn are notoriously proud and difficult to deal with unless a respectful attitude is shown. Many of this creed of Solstice-kin see themselves as the elite of the elite—they are true-blooded fae, above the limitations that Court-bound fae must endure. In fact, it is these fae in particular who are eager for the Oath-Truce to finally fall, so that they can begin accepting military contracts in addition to the negotiations and diplomacy. These tend to be the Solstice-kin that make the most desirable and keen hirelings.
# While the War of Seasons close to breaking out once more, and the Courts, factions and agendas swelling with conflicting tensions and ideologies, it goes almost without saying that the Solstice fae will see a great deal of action before too long—either as instigators and mercenaries if they are shrewd and careful... or merely arrow-fodder if they are not.
 
