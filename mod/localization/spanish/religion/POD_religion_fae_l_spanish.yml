 solstice_court_militants_adherent: "Militante del Linaje del Solsticio"
 solstice_court_militants_adherent_plural: "Militantes del Linaje del Solsticio"
 solstice_court_militants_desc: "A pesar de sus percibidas vulnerabilidades, los mercenarios del Solsticio son los contratistas predilectos en la Guerra de las Estaciones. Es más seguro contratar los servicios de las hadas del Solsticio que los de cualquier hada Sained, porque los sin Corte no tienen lealtades predeterminadas o juradas. Aunque a la mayoría se le ignora, se le desprecia o simplemente se le desdén, las hadas del Solsticio también pueden ser mercenarios de extraordinaria habilidad y utilidad, debido a su postura imparcial en todo el conflicto. Como soldados, las hadas del Solsticio están en su elemento.\n\nMuchas hadas del Solsticio se han ganado su reputación por su fiabilidad mediante años de diligencia, esfuerzo y conflicto. Muchos de este credo del Linaje del Solsticio se consideran la élite de la élite: son hadas de pura sangre, por encima de las limitaciones que deben soportar las hadas vinculadas a la Corte. Son estas hadas las que ansían que la Tregua del Juramento caiga finalmente, para poder aceptar de nuevo contratos militares. Estos suelen ser los miembros del Linaje del Solsticio que resultan más deseables y prestables como mercenarios."

 solstice_court_trucebearers: "Portadores de la Tregua de la Corte del Solsticio"
 solstice_court_trucebearers_adj: "Portador de la Tregua de la Corte del Solsticio"
 solstice_court_trucebearers_adherent: "Portador de la Tregua del Linaje del Solsticio"
 solstice_court_trucebearers_adherent_plural: "Portadores de la Tregua del Linaje del Solsticio"
 solstice_court_trucebearers_desc: "Aunque a la mayoría se le ignora, se le desprecia o simplemente se le desdén, las hadas del Solsticio también pueden ser diplomáticos de extraordinaria habilidad y utilidad, debido a su postura imparcial en todo el conflicto. Como diplomáticos, mensajeros, espías y embajadores, las hadas del Solsticio están en su elemento. Los Portadores de la Tregua sin Corte son individuos aislados o pequeños grupos de hadas que trabajan fervientemente en la arena social para inclinar a las cortes locales hacia la paz. Como era de esperar, rara vez tienen éxito, pero esto solo sirve para avivar el fuego de sus corazones. La paz, sin importar el precio, es su vocación."

 solstice_court_humanists: "Humanistas de la Corte del Solsticio"
 solstice_court_humanists_adj: "Humanista de la Corte del Solsticio"
 solstice_court_humanists_adherent: "Humanista del Linaje del Solsticio"
 solstice_court_humanists_adherent_plural: "Humanistas del Linaje del Solsticio"
 solstice_court_humanists_desc: "Muy pocas hadas del Solsticio se arriesgan a un contacto prolongado con la humanidad, ya que no pueden forjar juramentos mágicos con los mortales. Esos pocos sin Corte que siguen una agenda humanista se sienten atraídos por la humanidad como una polilla a la llama. La facción humanista no defiende necesariamente la amabilidad y la tolerancia al tratar con el reino humano; más bien, abraza una ética que se ocupa primordialmente de comprender a la humanidad."

 solstice_court_constantinians: "Constantinianos de la Corte del Solsticio"
 solstice_court_constantinians_adj: "Constantiniano de la Corte del Solsticio"
 solstice_court_constantinians_adherent: "Constantiniano del Linaje del Solsticio"
 solstice_court_constantinians_adherent_plural: "Constantinianos del Linaje del Solsticio"
 solstice_court_constantinians_desc: "Las hadas de la Corte del Solsticio, habiendo rechazado la Guerra de las Estaciones y los valores de las cortes estacionales, pueden ser las más abiertas a abandonar los ideales de las hadas para buscar la conversión en la Iglesia. Si tan solo hubiera alguna forma de que pudieran mantener su naturaleza de hada mediante el bautismo y también obtener los poderes de la Fe Verdadera." 

 holy_order_winters_teeth: "Dientes del Invierno"
 holy_order_green_blades: "Hojas Verdes"
 holy_order_sun_guard: "Guardia del Sol"
 holy_order_crunch_of_leaves: "Crujido de Hojas"
 holy_order_sunset_mercenaries: "Mercenarios del Atardecer"
 holy_order_grey_monks: "Monjes Grises"
 
 empire_of_seeds: "Imperio de las Semillas"
 empire_of_seeds_adj: "Semillas"
 empire_of_seeds_adherent: "Semilla"
 empire_of_seeds_adherent_plural: "Semillas"
 empire_of_seeds_desc: "Corte de las Kúberas, un Phyla de los Inanimae. La nación de las Dríades es una agrupación silvana que comparte vidas y bienes. En el [UmbraGlossary('dreaming')], la Tierra Natal de las Ninfas es un bosque de gran alcance en el centro de los Señoríos de la Tierra Natal. Políticamente, las Dríades apoyan a los Glomios, pero tienen reservas sobre el trato que recibe la Tierra Natal de los Solimondios. Como el Phyla más afectado por la Guerra de la Creación, no son muy simpáticos con la causa de la reintegración de los Solimondios. El festival del Equinoccio de Primavera es una gran feria organizada por las Kúberas. Músicos, artistas y artesanos Inanimae se reúnen para mostrar sus mercancías y todos celebran la renovación de la vida y el fin del invierno. Si los líderes de los imperios necesitan hacer algún anuncio conjunto, este es el momento y el lugar. El consejo es una festividad en la que las Kúberas se reúnen en un enorme claro en pleno solsticio de verano en algún lugar de Rusia. Aquí se permite a las Dríades peticionar a su emperador."

 empire_of_stones: "Imperio de las Piedras"
 empire_of_stones_adj: "Piedras"
 empire_of_stones_adherent: "Piedra"
 empire_of_stones_adherent_plural: "Piedras"
 empire_of_stones_desc: "Corte de los Glomios, un Phyla de los Inanimae. El Imperio de las Piedras es una jerarquía estricta. Cada Glomio conoce su lugar en el conjunto general. Al mismo tiempo, el imperio es una meritocracia. El ascenso es rápido para aquellos que pueden promover las causas del Imperio. La Tierra Natal de los Glomios en el [UmbraGlossary('dreaming')] es una ciudadela gigantesca surgida de una montaña viva. Ha sido asediada tres veces y, en cada ocasión, los invasores fueron repelidos y aplastados. En el corazón de la estructura se encuentra una de las pocas vetas de hierro quimérico. De todos los imperios, los Glomios son los más polarizados políticamente. Mantienen una línea dura: los Solimondios deben ser destruidos. Organizado por los Glomios, el Festival del Solsticio de Invierno es un gran torneo celebrado en el [UmbraGlossary('dreaming')] similar a los Juegos Olímpicos, si estos trataran sobre la destreza marcial. Los ganadores son colmados de elogios y, si son Glomios, destinados a un ascenso rápido."

 empire_of_flames: "Imperio de las Llamas"
 empire_of_flames_adj: "Llamas"
 empire_of_flames_adherent: "Llama"
 empire_of_flames_adherent_plural: "Llamas"
 empire_of_flames_desc: "Corte de los Solimondios, un Phyla de los Inanimae. La nación de la Salamandra tiene una compleja monarquía imperial con niveles de nobleza, pompa y ceremonias que rivalizan con cualquier cosa que los Sidhe hayan ideado. Los espíritus de fuego que se enamoraron por primera vez de la carne estaban entre el imperio y, impulsados por esta pasión fatídica, pasaron eras observando a la humanidad y aprendiendo los caminos de sus extraños y asombrosos corazones de la única forma en que un amante podría hacerlo. Finalmente, incapaces de ocultarse más tiempo, se revelaron y mostraron a la carne el funcionamiento de la Llama con sus poderes de transformación y verdad. Con esto, condenaron al mundo inanimado a la esclavitud a manos de hombres y mujeres y provocaron la Guerra de la Creación, obligando a los otros Imperios a volverse contra las traicioneras llamas y excomulgarlas. Ahora, los otros Imperios Lentos buscan extinguir las Anclas de las Salamandras en el Claro. La Tierra Natal de las Salamandras en el [UmbraGlossary('dreaming')] fue una vez un paisaje de bronce con palacios y fincas, con un horizonte de llamas iluminando el cielo. El Solsticio de Verano es una mascarada majestuosa y noble de gran belleza, así como una universidad de 4 días donde los Solimondios se reunían y compartían su conocimiento."

 empire_of_tears: "Imperio de las Lágrimas"
 empire_of_tears_adj: "Lágrimas"
 empire_of_tears_adherent: "Lágrima"
 empire_of_tears_adherent_plural: "Lágrimas"
 empire_of_tears_desc: "Corte de las Ondinas, una Phyla de los Inanimae. Las Nereidas gobiernan su imperio como una democracia al estilo ateniense. Cualquier Nereida puede emitir un voto sobre cualquier asunto. La Tierra Natal del [UmbraGlossary('dreaming')] de los Coleccionistas de Corazones es un vasto océano que se extiende por todos los horizontes. Con 20 millas de profundidad, en su interior hay una ciudad gigantesca de edificios de coral y autopistas. Cualquier visitante debe ser capaz de respirar bajo el agua. Muchos capitanes piratas tienen secretos para navegar por atajos aquí a través del [UmbraGlossary('dreaming')], ya que este está conectado con cada cuerpo de agua en la Tierra y en el [UmbraGlossary('dreaming')]. Políticamente, el imperio no tiene enemigos y mantiene relaciones amistosas con todos los demás Inanimae, aunque el fuego y el agua nunca han tenido la mejor relación. El Equinoccio de Otoño es una festividad organizada conjuntamente por las Ondinas y las Parosimias. Todos están invitados a los palacios submarinos de las Nereidas con oxígeno suministrado por los Silfar. Los banquetes son magníficos y se entregan regalos."

 empire_of_skies: "Imperio de los Cielos"
 empire_of_skies_adj: "Cielos"
 empire_of_skies_adherent: "Sílfide"
 empire_of_skies_adherent_plural: "Sílfides"
 empire_of_skies_desc: "Corte de las Parosimias, una Phyla de los Inanimae. El gobierno de los Silfar puede describirse mejor como una mezcla entre anarquía y tribalismo. Una vez al año, los 13 miembros activos más antiguos se reúnen y debaten asuntos que afectan a todos los Sprites para luego hacer largas y ornamentadas proclamas que son prontamente ignoradas por todo el mundo. Encontrada en el [UmbraGlossary('deep_dreaming')], la Tierra Natal de las Parosimias parece un país entero hecho de nubes y cristal. Animales fantasmales pastan en hierba similar a las nubes y gente etérea vaga por el delicado campo a pie o volando. En el centro mismo del Señorío, una torre de nubes con forma de cuerno de unicornio se alza, tan sólida como el mármol. En la cima es donde se reúne el consejo. Las relaciones son buenas con el Imperio de las Lágrimas, con un comercio constante de Lluvia por Evaporación. El Imperio de las Piedras se considera demasiado aburrido para algo más que relaciones superficiales. Mantienen relaciones amistosas con el Imperio de las Semillas. No hay planes para unirse al bloqueo del Imperio de las Llamas. Nadie tiene nada que decir al Imperio de las Muñecas. El Equinoccio de Otoño es un festival conjunto para las Ondinas y las Parosimias. Todos están invitados a los palacios submarinos de las Nereidas con oxígeno suministrado por los Silfar. Los banquetes son magníficos y se entregan regalos." 

 empire_of_dolls: "Imperio de las Muñecas"
 empire_of_dolls_adj: "Muñecas"
 empire_of_dolls_adherent: "Muñeca"
 empire_of_dolls_adherent_plural: "Muñecas"
 empire_of_dolls_desc: "Corte de los Manikís, una Phyla de los Inanimae. Los Juguetes afirman no tener imperio ni Tierra Natal. Se reúnen ocasionalmente en partes tranquilas del [UmbraGlossary('dreaming')] para mantener sus consejos en privado y ocasionalmente aparecen para dar consejos en las cortes de los otros imperios. Un emisario que afirma hablar por todos los Manikís viste una túnica negra e incluso el Mariscal de los Glomes escucha cuando el de la túnica negra aparece con noticias. Los Manikís nunca han invitado a nadie a su lugar de reunión. En la política de los imperios, los Juguetes sirven como catalizadores del cambio. Cuando aparece su emisario, los cambios de política están a la vuelta de la esquina. Muchos se preguntan cuál es el secreto de los de túnica negra, pero los otros imperios nunca revelarán lo que se dice. Las pocas veces que un emisario se ha dirigido a todo un imperio, la guerra le ha seguido rápidamente. Aunque los Manikís no tienen un ritual anual, persisten los rumores de tiempo robado en la Nochevieja entre las 11:59 y la Medianoche. La gente susurra que en ese minuto todos los Juguetes despiertan y viven un día entero como humanos para luego volver a sus Anclajes y el tiempo retrocede hasta la Medianoche otra vez. SI esto fuera cierto, ayudaría a explicar cómo las Muñecas saben tanto de lo que permanece oculto para los otros imperios."
 
 eshu_religion: "@changeling_icon! Eshu"
 eshu_religion_adj: "Eshu"
 eshu_religion_adherent: "Eshu"
 eshu_religion_adherent_plural: "Eshu"               
 eshu_religion_desc: "Los Eshu tienen sus propios códigos de conducta que difieren de las cortes de los Sidhe. Aquellos que siguen los caminos del honor y la tradición prefieren el Ojo, o fae de luz diurna. Aquellos que siguen su filosofía de abandonar las viejas costumbres y entregarse a las pasiones, una muerte para la Tradición, se llaman a sí mismos Iku, o muerte. No pienses que esto significa que todos los Ojo son amables y generosos o que todos (o incluso la mayoría) los Iku son festejadores asesinos. Ambos grupos siguen el Uhuru. Puede ser tan malo caer en manos de un juez Ojo que no cede como caer en manos de un Iku con rencor. Los Eshu no atribuyen ningún estigma a estas filosofías, excepto en casos extremos, debido a que todos los fae se ven a sí mismos como individuos. Juzga a un Eshu por su «corte» elegido bajo tu propio riesgo."
 
 ojo_religion: "@changeling_icon! Ojo"
 ojo_religion_adj: "Ojo"
 ojo_religion_adherent: "Ojo"
 ojo_religion_adherent_plural: "Ojo"
 ojo_religion_desc: "En el lenguaje común de los Eshu, Ojo (aw-jaw) significa Luz Diurna y Vida."
 
 ojo: "Ojo"
 ojo_adj: "Ojo"
 ojo_adherent: "Ojo"
 ojo_adherent_plural: "Ojo"
 ojo_desc: "En el lenguaje común de los Eshu, Ojo (aw-jaw) significa Luz Diurna y Vida. La mayoría de los Eshu que conozcas serán, de hecho, Ojo. Surge de forma natural y la mayoría de los Elegbara extraen su fuerza de los milenios de Tradiciones e historia vinculadas a ello. Sin embargo, no siguen el Código Luminoso (que es anterior a ellos). Tienen sus propios estándares para juzgarse a sí mismos, aunque seguirán defendiendo el Luminoso, lo que suele no entrar en conflicto. Los Eshu simplemente tienen valores fundamentales diferentes.\nAtiende el Llamado del Destino — Todos los Ojo creen que los orishas ordenan todo lo que sucede.\nTransmite lo que hayas oído — Si uno no recuerda la historia, repetimos los mismos errores. Una historia olvidada es un golpe contra todos los Fae.\nBusca justicia para los que no son escuchados — Los Eshu sienten una afinidad con otros pueblos marginados y hacen todo lo posible por ayudar."
 
 ojo_humanists: "Ojo Humanistas"
 ojo_humanists_adj: "Ojo Humanista"
 ojo_humanists_adherent: "Ojo Humanista"
 ojo_humanists_adherent_plural: "Ojo Humanistas"
 ojo_humanists_desc: "Algunos de los Ojo han tomado tan en serio el enfoque de los Eshu hacia el camino changeling y la vida entre la humanidad que promueven una agenda política similar a la de los Humanistas de las Cortes Estacionales."
 
 ojo_constantinians: "Ojo Constantinianos"
 ojo_constantinians_adj: "Ojo Constantiniano"
 ojo_constantinians_adherent: "Ojo Constantiniano"
 ojo_constantinians_adherent_plural: "Ojo Constantinianos"
 ojo_constantinians_desc: "El judaísmo, el cristianismo y el islam se han extendido por África, desplazando creencias y costumbres paganas. Algunos Ojo buscan reconciliar su fe en la Luz Diurna y la Vida con la teología y las prácticas de la Iglesia humana. El Libro de Enoc es utilizado en Etiopía por la comunidad judía de Beta Israel, así como por la Iglesia Ortodoxa Etíope Tewahedo. Contenidas en sus páginas están las historias de los ángeles vigilantes, los Grigori, y sus gigantescos descendientes humano-angelicales, los Nephilim. Los Fae podrían ser los Grigori y Nephilim redimidos." 
 
 iku_religion: "@changeling_icon! Iku"
 iku_religion_adj: "Iku"
 iku_religion_adherent: "Iku"
 iku_religion_adherent_plural: "Iku"       
 iku_religion_desc: "En el lenguaje común de los Eshu, Iku (ee-ku) es Muerte y Oscuridad."
 
 iku: "Iku"
 iku_adj: "Iku"
 iku_adherent: "Iku"
 iku_adherent_plural: "Iku"
 iku_desc: "En el lenguaje común de los Eshu, Iku (ee-ku) es Muerte y Oscuridad. Los Iku ven las cosas de forma un poco diferente a los Ojo. Puede que los Eshu digan que tratan por igual a los Ojo y a los Iku, pero los Iku saben que eso no es cierto. Saben que los Ojo los ven como una broma, y una muy desagradable y amarga, y en el momento en que el resto lo sepa, bajarás varios escalones en su lista. Muchos piensan que, por no inclinarse ante el destino, no son verdaderos Elegbara, pero también tienen un código. Aunque no son tan parecidos a los Oscuros, encajan bastante bien.\nNo hay Destino — ¿Qué significa esto? ¡Son verdaderamente, en última instancia, libres!\nDeja el caos a tu paso — El caos saca a la gente de su complacencia. Haz que quienes ostentan el poder te teman y teman lo que sabes.\nLa venganza es divina — Se cuidan a sí mismos primero y se aseguran de que cualquiera que se meta con ellos acabe perdiendo algo, ya sea el ego, objetos de valor o una parte del cuerpo."
 
 iku_humanists: "Iku Humanistas"
 iku_humanists_adj: "Iku Humanista"
 iku_humanists_adherent: "Iku Humanista"
 iku_humanists_adherent_plural: "Iku Humanistas"
 iku_humanists_desc: "Algunos de los Iku han tomado tan en serio el enfoque de los Eshu hacia el camino changeling y la vida entre la humanidad que promueven una agenda política similar a la de los Humanistas de las Cortes Estacionales."
 
 mu_religion: "@changeling_icon! Cortes Mu"
 mu_religion_adj: "Cortes Mu"
 mu_religion_adherent: "Mu"
 mu_religion_adherent_plural: "Mu"        
 mu_religion_desc: "Las Cortes Mu son grupos de Hsien que se entregaron a los [Glossary('Reyes Yama','podgloss.yamaking')] en la [Glossary('Cuarta Era','game_concept_fourth_age_desc')] al no ver salida al dilema que se habían provocado al romper el Mandato del Cielo. Las dos cortes no están aliadas entre sí, pero ambas están enfrentadas a las otras Cortes Hsien."
 
 daityas: "Daityas"
 daityas_adj: "Daityas"
 daityas_adherent: "Daityas"
 daityas_adherent_plural: "Daityas"
 daityas_desc: "Los Daityas son una Corte Hsien que se alió con los [Glossary('Reyes Yama','podgloss.yamaking')] en la [Glossary('Cuarta Era','game_concept_fourth_age_desc')], pero desde entonces se ha alejado de ellos. Poco después de jurar lealtad a los [Glossary('Reyes Yama','podgloss.yamaking')], la sociedad de los Daityas se dio cuenta de que los demonios solo los corromperían y se alimentarían de sus energías vitales, por lo que abandonaron la alianza. Mediante sus propias artes oscuras, ellos también descubrieron cómo mantener sus cuerpos y evitar caer en la nada como hicieron los otros Hsien.\nLos Daityas trabajan para fomentar la llegada de la [Glossary('Sexta Era','game_concept_sixth_age_desc')]; para provocar un tiempo en el que el [Glossary('Augusto Personaje de Jade','podgloss.augustpersonageofjade')] sea expulsado de su Corte Celestial y los Dragones y Fénix luchen entre sí en una conflagración sangrienta. Al promover la falta de creencia, buscan debilitar el muro creado por el Augusto Personaje y así reclamar su lugar legítimo en la Corte Celestial.\nAunque errados a ojos de los otros Hsien, no están exentos de redención. Si quisieran, podrían volver al camino correcto y ayudar a los Hsien a evitar la Era del Dolor."
 
 kura_sau: "Kura Sau"
 kura_sau_adj: "Kura Sau"
 kura_sau_adherent: "Kura Sau" 
 kura_sau_adherent_plural: "Kura Sau"
 kura_sau_desc: "Los Kura Sau son una sociedad de Hsien corruptos. También conocidos como los Gou Zhang, son una sociedad de aquellos Hsien que se entregaron a los [Glossary('Reyes Yama','podgloss.yamaking')] y son considerados parte de las Cortes Mu. Como resultado, pueden viajar a [UmbraGlossary('yomi_wan')] sin sufrir la maldición del Augusto Personaje de Jade. Además, tienen su propia rama de Wu Tan conocida como Hac Tao, un arte vil que les permite llevar el chi contaminado de los Mil Infiernos al mundo.\nSe esfuerzan por cumplir los planes de sus oscuros amos, trayendo la [Glossary('Sexta Era','game_concept_sixth_age_desc')] y corrompiendo la mayor parte del Reino Medio. La mayoría son reflejos oscuros de los Hsien originales y algunos incluso responden a plegarias, con la condición de que impliquen derramamiento de sangre y la satisfacción de impulsos más oscuros. Algunos afirman que los Kura Sau son incluso responsables de la corrupción de algunos dragones y fénix, tentándolos con promesas de poder que solo los [Glossary('Reyes Yama','podgloss.yamaking')] pueden conceder."
 
 shinma_religion: "@changeling_icon! Shinma"
 shinma_religion_adj: "Shinma"
 shinma_religion_adherent: "Shinma"
 shinma_religion_adherent_plural: "Shinma"
 shinma_religion_desc: "Las Cortes de las Hadas Orientales, los Shinma, se basan en una ideología y una cosmovisión."
 shu_shen: "Shu Shen"
 shu_shen_adj: "Shu Shen"
 shu_shen_adherent: "Shu Shen"
 shu_shen_adherent_plural: "Shu Shen" 
 shu_shen_desc: "Los Shu Shen son los disolutos de la sociedad Shinma. Los Dioses Profanos desafían el concepto del equilibrio y persiguen extremos tanto de la carnalidad como de la violencia. Saquean, saquean, asesinan y, en general, arruinan la reputación de los benevolentes Hsien por todas partes. Son mercenarios y guardaespaldas de Shen más poderosos que puedan pagar su precio, incluyendo a [GetTrait('kueijin').GetName( GetNullCharacter )] o incluso a los Kin-jin. Pueden tener aliados entre los vampiros o incluso entre los siervos de los [Glossary('Reyes Yama','podgloss.yamaking')]."
 
 li_shen: "Li Shen"
 li_shen_adj: "Li Shen"
 li_shen_adherent: "Li Shen"
 li_shen_adherent_plural: "Li Shen"
 li_shen_desc: "También llamados los Tradicionalistas, los Dioses de la Ceremonia o simplemente los Fu, los Li Shen abrazan los valores confucianos. Creen en el [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')], pero enfatizan el orden de la naturaleza y su mantenimiento, no la iluminación del ser. La protección de la naturaleza les preocupa por encima de todo y sus números son casi en su totalidad Kamuii. Alguna vez fueron las cortes más poderosas, pero los Dioses de la Ceremonia han perdido el contacto con los otros Shen y con demasiada frecuencia los miran con desdén. Debido a este prejuicio, así como a todas las luchas internas entre ministerios, los Fu ya no cumplen su labor tan bien como podrían."
 
 tu_shen: "Tu Shen"
 tu_shen_adj: "Tu Shen"
 tu_shen_adherent: "Tu Shen"
 tu_shen_adherent_plural: "Tu Shen"
 tu_shen_desc: "Aunque la mayoría de los otros Shinma los consideran sibaritas, los Dioses de la Armonía, o Embajadores del Cielo, tienen los mismos objetivos que los Xian Mo... solo que con formas muy distintas de alcanzarlos. Buscan traer la Edad del Regocijo convenciendo a todo el mundo de que se divierta. Su objetivo es el éxtasis, la exaltación y no el mero placer físico. Entienden que una buena cena con familiares y amigos es más satisfactoria y sostiene mejor la alegría que un puñado de píldoras. Los Dioses de la Armonía actúan según sus creencias realizando buenas acciones, intentando que las diferentes cortes de Shen trabajen juntas o, al menos, hablen. Caminan, y ocasionalmente de fiesta, tal como hablan.\nLos Embajadores del Cielo son mirados con recelo por los Li Shen y sus relaciones también están tensas con los Yü. La mayoría de los demás, al menos, disfrutan de su compañía. Los Tu Shen, por su parte, dicen tener buenas relaciones con todos los grupos."
 
 xian_mo: "Xian Mo"
 xian_mo_adj: "Xian Mo"
 xian_mo_adherent: "Xian Mo"
 xian_mo_adherent_plural: "Xian Mo"
 xian_mo_desc: "También llamados los Silenciosos o Espíritus Mágicos Inmortales, los Xian Mo son místicos y fervientes creyentes en el [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')]. Creen que los individuos iluminados pueden crear un mundo perfecto y revertir el ciclo de las Eras. Este énfasis en el individuo les lleva a resistirse al orden; incluso se niegan a verse como una corte. Xian Mo es el nombre que otros Hsien les dan.\nSin embargo, los Silenciosos aportan esperanza a los Shinma, algo que la mayoría perdió al final de la [Glossary('Cuarta Era','game_concept_fourth_age_desc')] cuando el Muro les impidió acceder al [spirit_world|E]. Hanuman llevó el [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')] a un sabio Komuko en el Di Fu. El Komuko renunció a su cargo y se retiró a las montañas. Con el tiempo, sus enseñanzas condujeron a los escritos que ahora se llaman [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')], o «El Camino del Poder Inminente de los Hsien». Sus ardientes seguidores conforman ahora los Xian Mo y sus enseñanzas han llevado a algunos a pasar al otro lado del Muro."
 
 xian_mun: "Xian Mun"
 xian_mun_adj: "Xian Mun"
 xian_mun_adherent: "Xian Mun"
 xian_mun_adherent_plural: "Xian Mun"
 xian_mun_desc: "Los Xian Mun, también llamados la Sociedad Inmortal o los Mundanos, son Shinma que rechazan su verdadera naturaleza o que están más preocupados por sus vidas mortales. Algunos incluso pueden usar sus poderes para promover otras agendas. Los mejores de los Mundanos sienten que es posible seguir el [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')] fuera de la sociedad Hsien tradicional, mientras que los peores no se preocupan por ello en absoluto.\nLa Sociedad Inmortal ve a los miembros de otras cortes como necios engañados. Los individuos rinden pleitesía (con algo de dinero y jade) a los ministerios locales y a los poderosos Yü solo para que los dejen en paz. Suelen organizarse bajo muchos modelos diferentes, ya sea como familias, corporaciones u otras instituciones humanas."
 
 yellow_lotus: "Loto Amarillo"
 yellow_lotus_adj: "Loto Amarillo"
 yellow_lotus_adherent: "Loto Amarillo"
 yellow_lotus_adherent_plural: "Loto Amarillo"
 yellow_lotus_desc: "El Loto Amarillo es una sociedad secreta y sutil dentro de la sociedad Hsien. Están dispersos entre sus compañeros Hsien y sus objetivos pueden parecer contradictorios. De hecho, nadie conoce su verdadera agenda ni quiénes son sus miembros. Su único objetivo evidente es fomentar la rebelión en las filas de los Shinma. Remueven rivalidades antiguas y agravios olvidados hace mucho tiempo, todo para desbaratar el orden de los ministerios de los Li Shen. Sin embargo, también se han atribuido la responsabilidad de castigar a quienes muestran demasiado abiertamente sus formas wani, por lo que a veces actúan como una especie de policía secreta. Su labor abarca desde la difusión de rumores hasta el asesinato. ¿Qué es lo que quieren? Quizá solo les guste sembrar el caos por el puro placer de hacerlo." 
 
 yu: "Yü"
 yu_adj: "Yü"
 yu_adherent: "Yü"
 yu_adherent_plural: "Yü"
 yu_desc: "Los Yü, también llamados los Clásicos o los Diez Grandes, se modelan a sí mismos según los Diez Reyes Chinos de la prehistoria china. (Puede que incluso hayan sido algunos de ellos). Dividieron el Reino Medio en 10 provincias místicas, pero sus batallas hacen que las fronteras cambien con frecuencia. Por lo general, apoyan a los Fu y sus ministerios, siempre que puedan enfrentarlos entre sí y aprovechar sus talentos. Los Yü han acumulado jade durante siglos y poseen algunos de los artefactos de jade más poderosos hasta la fecha. También controlan muchos nidos de dragón.\nSin embargo, no todos los Yü son nobles. Algunos son solo poderosos señores de la guerra y criminales que controlan poderosas Tongs y Tríadas. Estos Shinma se enfrentan cara a cara con otros Shen que tienen intereses en los negocios menos legales del Reino Medio, como los [GetTrait('kueijin').GetName( GetNullCharacter )], los Vástagos y otros. Ninguna de las otras Cortes puede permitirse tener malas relaciones con los Yü, así que ellos, a cambio, tratan a la mayoría de los demás con respeto. Las Cortes Mu y los [GetTrait('kueijin').GetName( GetNullCharacter )] son sus mayores enemigos."

 wu_hsien: "Wu Hsien"
 wu_hsien_adj: "Wu Hsien"
 wu_hsien_adherent: "Wu Hsien"
 wu_hsien_adherent_plural: "Wu Hsien"
 wu_hsien_desc: "También llamados los Campesinos o la Familia de Hsien, los Wu Hsien son una sociedad genérica. Es un epíteto para la gran mayoría de los Shinma que viven en pequeñas aldeas y tienen fuertes vínculos con la tierra y los santuarios locales. Pueden tener organizaciones estrictas, pero solo a escala local. Pueden ser insulares y preocuparse únicamente por la gente y el entorno local.\nSin duda hay más Hirayanu que Kamuii entre los Campesinos. Estos Hsien son a menudo considerados como vasallos tanto de los Li Shen como de los Yü, pero su única lealtad reside realmente en las aldeas, los santuarios y los lugares locales de belleza natural."
 
