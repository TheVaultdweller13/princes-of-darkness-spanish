 autumn_court_religion_adherent: "Los de Otoño"
 autumn_court_religion_adherent_plural: "Los de Otoño"
 autumn_court_religion_desc: "Fascinados por la humanidad, incluso más que la mayoría de las hadas, los de Otoño son contemplativos e ingeniosos. Jurar un pacto con un hada de Otoño es muy parecido a hacer un trato con el diablo: seductor, empoderador y, a menudo, mortal en el balance final. Las hadas de Otoño miran a los humanos y su fe con asombro y ambición, y ellas, más que todas las hadas, saben que la siguiente fase de la Guerra de las Estaciones depende enteramente de cómo se trate con la humanidad."

 autumn_court: "Corte de Otoño"
 autumn_court_adj: "Corte de Otoño"
 autumn_court_adherent: "Los de Otoño"
 autumn_court_adherent_plural: "Los de Otoño"
 autumn_court_desc: "Las hadas de la Corte de Otoño buscan ocultar su verdadero ser a los humanos, dominándolos y manipulándolos tras fachadas de misteriosos benefactores. Las hadas de Otoño se dan cuenta de que los mortales están sustituyendo lentamente la presencia de las hadas en sus vidas por las encantaciones a un Dios distante.\n\nMuchos trabajan para comprender la nueva postura de la humanidad y restaurarse como soberanos semihididos, mientras que otros buscan utilizar a la humanidad y los antiguos juramentos como armas en la Guerra de las Estaciones. Los mortales, con todas sus fragilidades y debilidades, son útiles debido a los juramentos que los vinculan; útiles tanto como escudos contra la banalidad como aliados en el conflicto venidero."
 
 autumn_court_militants: "Militantes de la Corte de Otoño"
 autumn_court_militants_adj: "Militante de la Corte de Otoño"
