 spring_court_humanists_adherent_plural: "Humanistas de la estirpe primaveral"
 spring_court_humanists_desc: "La mayoría de la Corte de Primavera sigue una agenda humanista. La estirpe primaveral suele ser vista como la más protectora de la humanidad, aunque esto no es necesariamente un acto de altruismo dedicado. Las hadas de la primavera se dan cuenta de que deben reforzar la relación mutuamente beneficiosa entre las dos razas, para evitar que las hadas se desvanezcan de la mente de los mortales para siempre. En consecuencia, sus juramentos suelen implicar ayudar o proteger a los humanos, aunque tales juramentos de tal peso requieren compromisos igualmente sustanciales por parte del mortal vinculado al juramento."

 spring_court_constantinians: "Constantinianos de la Corte de Primavera"
