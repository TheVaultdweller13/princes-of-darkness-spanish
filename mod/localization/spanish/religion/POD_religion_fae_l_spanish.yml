 winter_court_religion_desc: "Los monstruos de la leyenda humana, las criaturas en las sombras de la noche: los Kin de Invierno viven para inspirar terror en la humanidad. Gran parte despectivos con la Guerra de las Estaciones, la Corte ha perdido gran parte de su impulso para triunfar finalmente sobre las otras facciones, viéndolas ahora casi como algo digno de ignorar. Las hadas de Invierno parecen incapaces de empatizar con la humanidad, al no tener ni base ni punto de partida para comprender a los mortales y sus vidas. Los changelings (y los Humanistas) son raros en esta corte."

 winter_court: "Corte de Invierno"
 winter_court_adj: "Corte de Invierno"
 winter_court_adherent: "Kin de Invierno"
 winter_court_adherent_plural: "Kin de Invierno"
 winter_court_desc: "Los más brutales de todas las hadas, los Kin de Invierno acechan bajo los puentes y en los bosques oscuros. Aunque son guerreros feroces, la mayoría no espera el fin de la Tregua del Juramento con entusiasmo alguno. La guerra organizada no es de su agrado, pero cazar a la humanidad, la emoción de las cacerías nocturnas, el sabor de la sangre y el miedo... estas cosas son muy de su gusto. Solo la idea de sumergir al mundo en una noche oscura y salvaje los impulsa a participar en la Guerra de las Estaciones."
 
 winter_court_militants: "Milicianos de la Corte de Invierno"
 winter_court_militants_adj: "Miliciano de la Corte de Invierno"
 winter_court_militants_adherent: "Miliciano Kin de Invierno"
 winter_court_militants_adherent_plural: "Milicianos Kin de Invierno"
 winter_court_militants_desc: "Muchos hadas están ansiosos por que termine la Tregua del Juramento para poder volver a los combates de la Guerra de las Estaciones. Las emociones que surgen al ser consagrado en una Corte son intensas. Los milicianos Kin de Invierno creen verdaderamente que su forma de vida es la verdadera, que los más fuertes merecen gobernar. La reanudación de la guerra de las hadas no es algo que infunda temor en sus corazones fríos. Es la señal de que la batalla para decidir el destino del mundo finalmente puede comenzar.\n\nLos Kin de Invierno son los más brutales de todas las hadas, acechan bajo los puentes y en los bosques oscuros. Guerreros feroces que depredan a la humanidad, la emoción de las cacerías nocturnas, el sabor de la sangre y el miedo... estas cosas son muy de su gusto. Ansían la Guerra de las Estaciones para poder sumergir al mundo en una noche oscura y salvaje."

 winter_court_trucebearers: "Portadores de la Tregua de la Corte de Invierno"
 winter_court_trucebearers_adj: "Portador de la Tregua de la Corte de Invierno"
 winter_court_trucebearers_adherent: "Portador de la Tregua Kin de Invierno"
 winter_court_trucebearers_adherent_plural: "Portadores de la Tregua Kin de Invierno"
 winter_court_trucebearers_desc: "A medida que la Tregua del Juramento entra en sus últimas horas, los «Portadores de la Tregua» de las hadas de Invierno no están precisamente ansiosos por luchar con colmillos y garras afiladas. La mayoría de los miembros de esta Corte son, de hecho, algo apáticos respecto a la Guerra de las Estaciones. En muchos casos, están demasiado alejados de la política de las hadas como para estar al tanto de los últimos cambios en las alianzas y traiciones; y para limitar aún más su implicación, a menudo simplemente no les importa quién apuñala a quién por algún trivial tratado local. Muchas hadas de Invierno son realistas y ven claramente que la Guerra de las Estaciones es una especie de prueba interminable. La mayoría está más preocupada por salvar su propio pellejo y proteger sus dominios de cualquier influencia humana."

 winter_court_humanists: "Humanistas de la Corte de Invierno"
 winter_court_humanists_adj: "Humanista de la Corte de Invierno"
 winter_court_humanists_adherent: "Humanista Kin de Invierno"
 winter_court_humanists_adherent_plural: "Humanistas Kin de Invierno"
 winter_court_humanists_desc: "¿Es mejor que los humanos amen o teman a las hadas? La Corte de Invierno cree que es mucho mejor ser temido. Que los humanos odien, siempre y cuando teman. Los Humanistas de la estirpe invernal se acercan a la humanidad como un niño que tortura hormigas con una lupa. Tienen una obsesión fascinante por los humanos, intentando determinar la mejor forma de aterrorizarlos y extraer Glamour a través de ese terror."

 winter_court_constantinians: "Constantinianos de la Corte de Invierno"
 winter_court_constantinians_adj: "Constantiniano de la Corte de Invierno"
 winter_court_constantinians_adherent: "Constantiniano de la estirpe invernal"
 winter_court_constantinians_adherent_plural: "Constantinianos de la estirpe invernal"
 winter_court_constantinians_desc: "Los Constantinianos de la Corte de Invierno utilizan su conocimiento de la Iglesia para su propio beneficio y en detrimento de la humanidad. Se han interesado mucho en la persecución de la Iglesia contra herejes y brujas; no tanto por el dogma, sino por sus técnicas de tortura y terror. El horror violento de la Cruzada Albigense también ha despertado la curiosidad de la estirpe invernal. Incluso los flagelantes resultan interesantes. Los sueños apocalípticos de un Cristo con espada y ángeles vengativos pueden proporcionar mucho Glamour para ser cosechado."
 
# Spring Court
# In this new age of both faith and uncertainty, the Spring Court seeks to understand and resolve the wounds created between humanity and the fae. In the War of Seasons, they are keen fighters, eager to achieve victory once and for all; and in the mortal realm, they seek to regain the mantle of relevance to the humans and be feared and respected once more. The Court of change and paradox,the Spring fae endeavor to change anything and everything to their advantage, before humanity either forgets them, or banishes the fae forever. Should such an impasse occur, the whole War of Seasons and all other efforts will come to a wasted end.
# The Spring fae embrace change in all forms, watching life progress over the reasons and reveling it all of its myriad variations (including the many different ways it can end). They have lost many of their greatest holdings from centuries past, but of all the Courts, they are the most adept at finding new homes and adapting to new surroundings.
 
# Spring Poem:
# Dawn cracks the pristine shell of day, new life does start,
# And the clasp of winter's crippled hand falls apart,
# The melt of snow runs down Nature's growing form,
# But with beauty of a blossoming flower,
# Comes not the strength to protect it from Her storm. 
 
# Spring is the season of birth—of bloom and growth. It is also the season of unpredictable weather, of storms and tempers, and of irreconcilable change.
# The Spring fae embrace change in all things, which is the great strength and great weakness of the Court itself. Change is not always progressive, nor is it always beneficial. Returning to the War of Seasons after centuries of tense 'peace' is a significant change, and one that many of the Spring Court are keen to act upon. Other fae, seeing the great conflict as an endeavor in futility, advocating changing tactics entirely, and wish to concentrate work in the human realm to ensure continued relevance of the fae.
# These fae are often seen as the most protective of humanity, although this is by no means necessarily an act of dedicated altruism. The Spring fae realize they must reinforce the mutually beneficial relationship between the two races, lest the fae slip from the minds of the mortals for all time. Consequently, their oaths often involve helping or protecting humans, although such weighty oaths require equally substantial pledges from the oath-bound mortal.
# A tempestous attitude, clashing interests and a lack of cohesive focus are characteristic of Spring fae—unsurprising considering the the relatively equal spread of the three Origins in this Court. Undeniably mighty, with their strength waxing as their seasonable bias would suggest, the Spring Court is ever split by the myriad differing approaches within their ranks.
# Changelings suffer no negative Courtly bias, although some rare bigotry does exist in a few individuals. Over time, the Spring Court's changeling population has slowly increased to meet the number of firstborn and inanimae, and continues to swell in the current age. Most Spring firstborn prefer to create new changelings in a labor of love or lust, rather than steal a human family's beloved infant. Children treated with particularly cruelty are often prized additions to the Court, however, rescued as they are from a life of abuse. Spring fae, while rarely kind in the human sense of the word, often have sympathy for downtrodden or helpless mortals, especially children. Such luckless humans are fertile ground for oaths and alliances.
# The tactics of the Spring Court are, as is to be expected, a clashing mix of action and intent. While the majority of the Court is of Humanist agenda, Militants and Constantinians are hardly rare. Complicating the matter further, many Humanists are all to happy to spend time throwing their skills into the War of Seasons, and many Militants advocate discussing the issues of the human realm in-between hostile engagements with the other courts.
# Currently, the Court is like a nest of ants that has been kicked over. Diplomats and ambassadors race to other local courts, both Spring holdings and hostile, other-Court domains. Other areas boast the presence of assembled companies of soldiers, who, although a hollow reflection of the grand armies of the Battle of Stone, are still formidable for their skill and dedication.
# Interestingly, the Patrons are also seeing a great increase in Spring fae joining their ranks. Most Spring fae who join the ranks of the Patrons tend to find themselves among the hidden enclaves of the Seekers or the bold and visible Vanguard.
  
 spring_court_religion: "@changeling_icon! Corte de Primavera"
 spring_court_religion_adj: "Corte de Primavera"
 spring_court_religion_adherent: "De la estirpe primaveral"
 spring_court_religion_adherent_plural: "De la estirpe primaveral"
 spring_court_religion_desc: "Las hadas de la primavera abrazan el cambio en todas sus formas, observando el progreso de la vida sobre las razones y deleitándose con todas sus innumerables variaciones, incluyendo las muchas formas distintas en que puede terminar. Han perdido muchos de sus mayores dominios de siglos pasados, pero de todas las Cortes, son los más expertos en encontrar nuevos hogares y adaptarse a nuevos entornos."

 spring_court: "Corte de Primavera"
 spring_court_adj: "Corte de Primavera"
 spring_court_adherent: "De la estirpe primaveral"
 spring_court_adherent_plural: "De la estirpe primaveral"
 spring_court_desc: "En esta nueva era de fe e incertidumbre, la Corte de Primavera busca comprender y sanar las heridas creadas entre la humanidad y las hadas. En la Guerra de las Estaciones, son combatientes feroces, ansiosos por lograr la victoria de una vez por todas; y en el reino mortal, buscan recuperar su relevancia ante los humanos y ser temidos y respetados una vez más.\n\nLa Corte del cambio y la paradoja, las hadas de la primavera se esfuerzan por cambiar cualquier cosa y todo para su beneficio, antes de que la humanidad las olvide o las destierre para siempre. Si ocurriera tal estancamiento, toda la Guerra de las Estaciones y todos los demás esfuerzos terminarían en nada."
 
 spring_court_militants: "Militantes de la Corte de Primavera"
 spring_court_militants_adj: "Militante de la Corte de Primavera"
 spring_court_militants_adherent: "Militante de la estirpe primaveral"
 spring_court_militants_adherent_plural: "Militantes de la estirpe primaveral"
 spring_court_militants_desc: "En la Guerra de las Estaciones, los militantes de la estirpe primaveral son combatientes feroces, ansiosos por lograr la victoria de una vez por todas; y en el reino mortal, buscan recuperar su relevancia ante los humanos y ser temidos y respetados una vez más. La Corte del cambio y la paradoja, las hadas de la primavera se esfuerzan por cambiar cualquier cosa y todo para su beneficio, antes de que la humanidad las olvide o las destierre para siempre. Muchos militantes de la estirpe primaveral abogan por debatir los asuntos del reino humano entre enfrentamientos hostiles con las otras cortes. Muchas Cortes de Primavera presumen de la presencia de compañías de soldados reunidas que, aunque son un reflejo vacío de los grandes ejércitos de la Batalla de Stone, siguen siendo formidables por su habilidad y dedicación."

 spring_court_trucebearers: "Portadores de Tregua de la Corte de Primavera"
 spring_court_trucebearers_adj: "Portador de Tregua de la Corte de Primavera"
 spring_court_trucebearers_adherent: "Portador de Tregua de la estirpe primaveral"
 spring_court_trucebearers_adherent_plural: "Portadores de Tregua de la estirpe primaveral"
 spring_court_trucebearers_desc: "Mientras que gran parte de la Corte de Primavera recibe el fin de la Tregua del Juramento como un gran cambio, los Portadores de Tregua de la estirpe primaveral sostienen que un compromiso en el que el gobierno del mundo se turne entre las cortes estacionales supondría mucho más cambio que si una sola corte, incluso la Corte de Primavera, llegara a gobernar sola."

 spring_court_humanists: "Humanistas de la Corte de Primavera"
 spring_court_humanists_adj: "Humanista de la Corte de Primavera"
