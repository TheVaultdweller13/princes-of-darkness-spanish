 ebon_centipede_creator_god_name_possessive: "$ebon_centipede_high_god_name_possessive$"

 holy_order_blackened_blades: "Filos Ennegrecidos"

 #Caminantes Silenciosos
 eatersofthedead: "Devoradores de los Muertos"
 eatersofthedead_adj: "Devoradores"
 eatersofthedead_adherent: "Devorador"
 eatersofthedead_adherent_plural: "Devoradores"
 eatersofthedead_desc: "Un grupo de entre los Caminantes Silenciosos, empujado a la clandestinidad por los demás Caminantes, donde se rumorea que practican su rito profano entre las sombras. Consume el cerebro de tu enemigo y aprende todos sus secretos: un ritual vil pero útil. Sin embargo, todos los que consumen la carne de otros enloquecen poco a poco y apestan al hedor de la Wyrm. Algunos incluso desarrollan adicción a los cerebros frescos y matarán a inocentes y culpables por igual para darse un festín."

 holy_order_children_ammit: "Hijos de Ammit"

 #Contempladores de Estrellas
 metasticbirth: "Nacimiento Metástico"
 metasticbirth_adj: "Metástico"
 metasticbirth_adherent: "Partera"
 metasticbirth_adherent_plural: "Parteras"
 metasticbirth_desc: "Estos Videntes de las Estrellas creen que la Wyrm no está enjaulada, sino en un capullo en plena metamorfosis, preparándose para una nueva realidad que está alumbrando la Tejedora. Una vez terminada su metamorfosis, saldrá de su crisálida e inaugurará el nuevo mundo. Los Videntes de las Estrellas que siguen este grupo creen que esto es bueno y que la tribu debería ayudar a otros a prepararse para ello, no combatirlo."

 #Contempladores de Estrellas
 ouroboroans: "Ourobóreos"
 ouroboroans_adj: "Ourobóreos"
 ouroboroans_adherent: "Ourobóreo"
 ouroboroans_adherent_plural: "Ourobóreos"
 ouroboroans_desc: "Buscan liberar a la Wyrm del Equilibrio de la Red. En lugar de luchar contra la Tejedora, emplean sus energías en buscar a la Wyrm en todas sus formas con la esperanza de descubrir el secreto para liberarla. Solo siguiendo a la Wyrm hasta su cueva, en lugar de combatir a sus esbirros, sienten que pueden influir de verdad en el resultado de la Guerra Final. De ahí que algunos de estos monjes crean que los modos de la Wyrm deben usarse, no rehuirse."

 holy_order_unshacklers_corruption: "Desencadenadores de la Corrupción"


