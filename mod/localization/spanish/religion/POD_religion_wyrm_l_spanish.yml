 blackspiraldancer_religion: "@werewolf_icon! Danzantes de la Espiral Negra"
 blackspiraldancer_religion_adj: "Danzantes de la Espiral Negra"
 blackspiraldancer_religion_adherent: "Danzante de la Espiral Negra"
 blackspiraldancer_religion_adherent_plural: "Danzantes de la Espiral Negra"
 blackspiraldancer_religion_desc: "También conocidos como la Tribu Perdida, los temidos Bailarines de la Espiral Negra son los Garou que se volvieron hacia la Wyrm. Antaño conocidos como los Aulladores Blancos, fueron corrompidos hasta el último tras intentar la tribu derribar a la Wyrm por sí sola."
