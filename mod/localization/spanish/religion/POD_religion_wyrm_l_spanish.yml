 hellcats: "Gatos Infernales"
 hellcats_adj: "Gatos Infernales"
 hellcats_adherent: "Gato Infernal"
 hellcats_adherent_plural: "Gatos Infernales"
 hellcats_desc: "Cuando los Bailarines de la Espiral Negra atacaron la asamblea anual de las Bastet Ceilican en Escocia, obligaron a algunas a entrar en el Laberinto de la Espiral Negra para volverlas hacia la Wyrm. Las que sobrevivieron se convirtieron en las Gatas Infernales, y su habitual locura genuina se transformó en una agresión autodestructiva y sin mente. Aguardando al Apocalipsis para honrar a su Padre Oscuro, estas criaturas corrompidas traen consigo sus potentes vínculos con los dones ilusorios de los Fae y diversos fetiches de la Wyrm que construyeron con curiosidad propia de las Bastet."

 holy_order_eyes_cahlash: "Ojos de Cahlash"

 
 mnetics: "Mnéticos"
 mnetics_adj: "Mnético"
 mnetics_adherent: "Mnético"
 mnetics_adherent_plural: "Mnéticos"
 mnetics_desc: "Los Mnéticos son los Devoradores de Secretos. Sus ojos se han abierto a la verdad de que los recuerdos son efímeros y maleables. Mientras los demás Mokolé pasan años reviviendo el pasado mediante la Mnesis, los Mnéticos saben que todo es mentira. Si todos los Mokolé recuerdan el pasado, ¿por qué es tan distinto para cada uno? Los Devoradores de Secretos se regodean retorciendo la Mnesis con sus mentiras y engaños. Muchos Mokolé han caído ante el Disolvente creyendo sus mentiras y los Mnéticos se hacen cada vez más fuertes como resultado."

 holy_order_forgotten_nightmares: "Las Pesadillas Olvidadas"