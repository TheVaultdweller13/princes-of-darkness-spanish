 holy_order_death_spiral: "Espiral de la Muerte"
 holy_order_heralds_hydra: "Heraldos de la Hidra"
 holy_order_bringers_apocalypse: "Portadores del Apocalipsis"
 holy_order_balefire_warriors: "Guerreros del Fuego Fatuo"


 blackspiraldancer: "Danzantes de la Espiral Negra"
 blackspiraldancer_adj: "Danzantes de la Espiral Negra"
 blackspiraldancer_adherent: "Danzante de la Espiral Negra"
 blackspiraldancer_adherent_plural: "Danzantes de la Espiral Negra"
 blackspiraldancer_desc: "También conocidos como la Tribu Perdida, los temidos Bailarines de la Espiral Negra son los Garou que se volvieron hacia la Wyrm. Antaño conocidos como los Aulladores Blancos, fueron corrompidos hasta el último tras intentar la tribu derribar a la Wyrm por sí sola."

 cluithi: "Cluithi"
 cluithi_adj: "Cluithi"
 cluithi_adherent: "Cluith"
 cluithi_adherent_plural: "Cluithi"
 cluithi_desc: "Dentro de la tribu de la Espiral Negra, un Grupo se ha esforzado por preservar la herencia de los Aulladores Blancos. Los Cluithi aún merodean por los páramos y bosques más desolados de Escocia, imitando el aspecto que tenían sus antepasados hace siglos. Se desgarran la ropa, se embadurnan con orgullo de pintura corporal azul y exhiben tatuajes pictos. Los gobernantes de este grupo también tienen una inclinación elitista y se consideran la nobleza de la tribu. El nombre del Grupo es una referencia a los gobernantes originales de los Reinos Pictos. Muchos Cluithi se ven a sí mismos como los hijos más auténticos de Cluid, el héroe que condujo por primera vez a los pictos a Caledonia."

 princesofruin: "Príncipes de la Ruina"
 princesofruin_adj: "Ruina"
 princesofruin_adherent: "Príncipe de la Ruina"
 princesofruin_adherent_plural: "Príncipes de la Ruina"
 princesofruin_desc: "Los Príncipes de la Ruina sostienen que la guerra por el Apocalipsis ha terminado y concluido. Predican la autocomplacencia, alegando que el cadáver agonizante del mundo es ahora suyo para gobernarlo y tratarlo como quieran. Campeones triunfantes del Corruptor, afirman que entregarse a sus propios instintos bajos es categóricamente adorar a la Wyrm."

 seekersoftheancient: "Buscadores de lo Antiguo"
 seekersoftheancient_adj: "Buscadores"
 seekersoftheancient_adherent: "Buscador"
 seekersoftheancient_adherent_plural: "Buscadores"
 seekersoftheancient_desc: "Druidas oscuros de la tierra que buscan conferenciar con la atmósfera y la geomancia que rodea a los Antiguos. No ensalzan al espíritu en sí, sino que invocan las virtudes de sus elementos, invocándolo indirectamente para que actúe a través de la naturaleza. Esto les otorga conocimiento y poder de forma indirecta, permitiéndoles desarrollar y dirigir un Foso que ha sido vinculado al paisaje circundante. Sirven como chamanes, arriesgándose a la esclavitud y la locura para comunarse con espíritus impensables y obtener conocimiento directamente."


 ##############
 #### Wyrm ####
 ##############


 wyrmbound: "Vinculado al Wyrm"
 wyrmbound_adj: "Vinculado al Wyrm"
 wyrmbound_adherent: "Corrompido"
 wyrmbound_adherent_plural: "Corrompidos"
 wyrmbound_desc: "La Wyrm cuenta con muchos entre sus siervos. Algunos sirven a sabiendas, otros sin saberlo. Pero todas sus acciones sirven al propósito mayor de la Wyrm de provocar el Apocalipsis: el fin de Gaia. Así, todas las criaturas que causan miseria, se entregan a la depravación o participan en la destrucción, de buen grado o no, a sabiendas o no, son siervos de la Wyrm."
 
 
 #Roedores de Huesos
 maneaters: "Devoradores de Hombres"
 maneaters_adj: "Devorador de Hombres"
 maneaters_adherent: "Devorador de Hombres"
 maneaters_adherent_plural: "Devoradores de Hombres"
 maneaters_desc: "Este campamento de los Roedores de Huesos obtiene poder quebrantando el precepto de la Letanía que prohíbe el canibalismo de carne humana. La mayoría de los 'conversos' de este campamento eran Garou que habían sucumbido al frenesí con demasiada frecuencia. Hoy en día son pocos y muchos de los que quedan se han aliado con el campamento similar de los Devoradores de los Muertos entre los Caminantes Silenciosos.\nLas ocasionales historias macabras de hombres lobo voraces también dan crédito a la existencia de los Devoradores de Hombres — después de todo, en tiempos de hambruna, es demasiado tentador para un Roedor alimentarse y eliminar una o tres bocas hambrientas sobrantes al mismo tiempo."

 holy_order_butchers_men: "Carniceros de Hombres"

 #Señores de las Sombras
 masks: "Máscaras"
 masks_adj: "Máscaras"
 masks_adherent: "Máscara"
 masks_adherent_plural: "Máscaras"
 masks_desc: "Una sociedad secreta de los Señores de la Sombra dedicada a infundir miedo en sus enemigos, la dedicación de las Máscaras a sus artes oscuras es tan fanática que supuestamente practican la mutilación ritualizada sobre sí mismos para inspirar mayor horror en sus víctimas. Dado que lo desconocido es el patio de recreo del miedo, ninguna Máscara verdadera revela jamás su pertenencia al campamento a los forasteros, salvo a aquellos que son el objetivo de adoctrinamiento en sus filas." 

 #Señores de las Sombras
 societyofnidhogg: "Sociedad de Nidhogg"
 societyofnidhogg_adj: "Nidhogg"
 societyofnidhogg_adherent: "Nidhoggista"
 societyofnidhogg_adherent_plural: "Nidhoggistas"
 societyofnidhogg_desc: "Todos los Señores de la Sombra comprenden el poder de la oscuridad, pero ninguno tan profundamente como los miembros de este campamento secreto y místico. Tan fuerte es su fanatismo que afirman que la luz del sol en sí misma es una amenaza para las fuerzas del Trueno, y buscan sumir al mundo en la oscuridad eterna." 

 holy_order_writhing_shadows: "Las Sombras Serpenteantes"

 #Hakken
 ebon_centipede: "Ciempiés de Ébano"
 ebon_centipede_adj: "Ébano"
 ebon_centipede_adherent: "Buscador del Laberinto"
 ebon_centipede_adherent_plural: "Buscadores del Laberinto"
 ebon_centipede_desc: "Cuando las sombras se vuelven tan profundas que la desesperación o la crueldad abruman a uno de los Hakken, este puede someterse al Laberinto de Ébano y jurarse a Ciempiés. Criaturas solitarias, desdichadas y violentas, son una plaga para todo lo espiritualmente bueno, igual que los degenerados hombres lobo destructores de Occidente." 

 ebon_centipede_high_god_name: "Ciempiés"
 ebon_centipede_high_god_name_possessive: "De Ciempiés"
