  #Zoroastrian-Group Faiths
 
  roadofagramainyu: "Vía de Angra Mainyu"
  roadofagramainyu_adj: "Vía de Angra Mainyu"
  roadofagramainyu_adherent: "Corruptor"
  roadofagramainyu_adherent_plural: "Corruptores"
  roadofagramainyu_desc: "Los zoroastrianos creen que ellos —sujetos a Angra Mainyu, al Hambre y a la noche eterna— están malditos por Angra Mainyu. Deben explorar este estado del ser y, una vez que comprendan plenamente el mal, elegir ser buenos y volver a la gracia de Ahura Mazda. Por supuesto, no todos lo consiguen."
 
  roadofahuramazda: "Vía de Ahura Mazda"
  roadofahuramazda_adj: "Vía de Ahura Mazda"
  roadofahuramazda_adherent: "Penitente"
  roadofahuramazda_adherent_plural: "Penitentes"
  roadofahuramazda_desc: "El camino a la redención es a través de Ahura Mazda. Habiendo pasado por el mal de Angra Mainyu, eligen ser buenos y volver a la gracia de Ahura Mazda. El iniciado de la Vía de Ahura Mazda se purifica extensamente con agua."
  
  pathofdaena: "Senda de Daena"
  pathofdaena_adj: "Senda de Daena"
  pathofdaena_adherent: "Behdin"
  pathofdaena_adherent_plural: "Behdins"
  pathofdaena_desc: "La Senda de Daena enseña que los actos virtuosos y la adhesión a la ley y al deber aportan un gran poder personal. Al actuar de acuerdo con estas leyes y su deber, serán recompensados justamente. Las leyes proporcionan estructura para una sociedad civil; si se rompe la ley, la propia sociedad se desmorona."
 
