  cultofzilah_desc: "Un grupo de $pod_cainites$ centrados en el Maestro Lloroso y su discípulo Anosh. Tras el hallazgo de una piedra llorosa en un valle perdido, el culto se convirtió en adorador de la vampira de segunda generación llamada Zilah. Ahora se presentan como enemigos de la tercera generación, que se rebeló contra Caín y las órdenes de los chiquillos de Caín."
