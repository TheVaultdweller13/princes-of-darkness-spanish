 #Kuei-jin Group Religios
 kueijin_religion: "@kueijin_icon! Dharma herético"
 kueijin_religion_adj: "Herético"
 kueijin_religion_adherent: "Herejía"
 kueijin_religion_adherent_plural: "Herejías"
 kueijin_religion_desc: "Existe un número de vampiros que existen sin seguir uno de los cinco [Glossary('Dharma','podgloss.dharma')] atribuidos a [GetScriptedCharacterByHistoryID('791111').GetFirstName]. Siguen otros caminos, que los ancestros de las Cinco Cortes Augustas marcan como herejías."
 
 boneflowers_religion: "@kueijin_icon! Canto de la Sombra"
 boneflowers_religion_adj: "Cantante"
 boneflowers_religion_adherent: "Cantante"
 boneflowers_religion_adherent_plural: "Cantantes"
 boneflowers_religion_desc: "El Canto de la Sombra, de aspecto yin, también conocido como Flores de Hueso, son nigromantes fríamente lógicos que buscan el razonamiento desapasionado y la aplicación del equilibrio dhármico. También están estrechamente ligados a la sociedad mortal a través de sus descendientes, y a menudo ayudan a sus familias incluso siglos después."

 deviltigers_religion: "@kueijin_icon! Tigre Diablo"
 deviltigers_religion_adj: "Tigre"
 deviltigers_religion_adherent: "Demonio del Cielo"
 deviltigers_religion_adherent_plural: "Demonios del Cielo"
 deviltigers_religion_desc: "Los Tigres Diablo creen que son los reemplazos de los demonios incompetentes de eras pasadas; castigan a los pecadores y buscan la Iluminación a través del dolor y la violencia."

 resplendentcranes_religion: "@kueijin_icon! Grulla Resplandeciente"
 resplendentcranes_religion_adj: "Legalista"
 resplendentcranes_religion_adherent: "Magistrado"
 resplendentcranes_religion_adherent_plural: "Magistrados"
 resplendentcranes_religion_desc: "El Camino de la Grulla Resplandeciente es una colección de escuelas altamente legalistas, dedicadas a revertir la [Glossary('Rueda de las Eras','podgloss.wheelofages')] y restaurar la virtud."

 thousandwhispers_religion: "@kueijin_icon! Mil Susurros"
 thousandwhispers_religion_adj: "Susurrante"
 thousandwhispers_religion_adherent: "Susurrador"
 thousandwhispers_religion_adherent_plural: "Susurradores"
 thousandwhispers_religion_desc: "Los Mil Susurros viven una secuencia de máscaras, nuevas identidades que construyen tras la muerte para comprender la vida mortal y, con suerte, trascenderla."

 thrashingdragons_religion: "@kueijin_icon! Dragón Azotador"
 thrashingdragons_religion_adj: "Danzante"
 thrashingdragons_religion_adherent: "Danzante"
 thrashingdragons_religion_adherent_plural: "Danzantes"
 thrashingdragons_religion_desc: "El a menudo incomprendido [Glossary('Dharma','podgloss.dharma')] Dragón Azotador reconoce que está muerto, pero busca alcanzar la Iluminación imitando e interactuando con los vivos. A pesar de la estupefacción de algunos Grullas Resplandecientes, son un [Glossary('Dharma','podgloss.dharma')] plenamente reconocido, incluso si parecen comer y follárselo todo a su paso por la no-vida."

 #Kuei-jin Group Faiths

 faceofthegods: "Tribu celestial"
 faceofthegods_adj: "Divinidad"
 faceofthegods_adherent: "Semidios"
 faceofthegods_adherent_plural: "Semidioses"
 faceofthegods_desc: "Posiblemente la más extrema de las herejías; la Tribu Celestial afirma que los [Glossary('Wan Kuei','game_concept_kuei_jin_desc')] son descendientes divinos exiliados de la agraviada Sita de los mitos indios. Establecen sus propios cultos con adoradores y extraen chi mediante la oración."

 faceofthegoddess: "Rostros de la Diosa"
 faceofthegoddess_adj: "Divinidad"
 faceofthegoddess_adherent: "Shaktista"
 faceofthegoddess_adherent_plural: "Shaktistas"
 faceofthegoddess_desc: "Una variante de la Tribu Celestial, este [Glossary('Dharma','podgloss.dharma')] afirma que alguna vez fueron humanos antes de ser elegidos por Shakti para reencarnar en una etapa transitoria entre su mortalidad pasada y su futura divinidad."

 flameoftherisingphoenix: "Fénix Naciente"
 flameoftherisingphoenix_adj: "Sol Naciente"
 flameoftherisingphoenix_adherent: "Fénix"
 flameoftherisingphoenix_adherent_plural: "Fénix"
 flameoftherisingphoenix_desc: "La Llama del Fénix Naciente [Glossary('Dharma','podgloss.dharma')] sostiene que el propósito del Segundo Aliento es resarcir los crímenes de la vida de uno. A menudo viven entre su familia mortal, protegiéndolos y ayudándoles a prosperar tanto como pueden."

 thegreatclans: "Los Grandes Clanes"
 thegreatclans_adj: "Clan"
 thegreatclans_adherent: "Miembro del clan"
 thegreatclans_adherent_plural: "Miembros del clan"
 thegreatclans_desc: "Los Grandes Clanes son una institución nativa de las islas japonesas. En esencia, son redes familiares extendidas en las que los Muertos Hambrientos velan y protegen los intereses de sus descendientes. En algunas familias vasallas de los Grandes Clanes, los descendientes mortales incluso conocen y están al tanto de los planes de sus ancestros.\nLos más antiguos de los Grandes Clanes tienen raíces en el periodo Jomon, pero su transformación más profunda ocurrió tras la llegada de los [Glossary('Dharma','podgloss.dharma')] indios y chinos en el siglo VI d. C."

 inwardway: "Camino Interior"
 inwardway_adj: "Buscador"
 inwardway_adherent: "Buscador"
 inwardway_adherent_plural: "Buscadores"
 inwardway_desc: "Una secta considerada herética por las Cortes principales; los Buscadores del Camino Interior creen que el mundo es una ilusión y utilizan los preceptos filosóficos taoístas para ampliar su comprensión de la realidad «verdadera»."

 inwardfocus: "Enfoque Interior"
 inwardfocus_adj: "Tempestuoso"
 inwardfocus_adherent: "Kabalyeru"
 inwardfocus_adherent_plural: "Kabalyeru"
 inwardfocus_desc: "Una secta considerada herética por las Cortes principales; la Tempestad del Enfoque Interior cree que el mundo es una ilusión y desea destrozarlo utilizando cantidades extremas de violencia y tácticas de terror."

 spiritlivingearth: "Tierra Viva"
 spiritlivingearth_adj: "Cerúleo"
 spiritlivingearth_adherent: "Kannushi"
 spiritlivingearth_adherent_plural: "Kannushi"
 spiritlivingearth_desc: "Basándose en diversas tradiciones sintoístas y animistas, este [Glossary('Dharma','podgloss.dharma')] es introspectivo y se centra en interactuar principalmente con el mundo espiritual. El hecho de que consideren a los demonios y espíritus malignos como mentores adecuados les ha marcado como herejes a ojos de las Cortes principales."

 kinofizanami: "Parentela de Izanami"
 kinofizanami_adj: "Parentela"
 kinofizanami_adherent: "Parentela"
 kinofizanami_adherent_plural: "Parentela"
 kinofizanami_desc: "La Parentela cree que son encarnaciones fragmentadas de Izanami-no-mikoto, la kami primordial de la muerte y la impureza. También creen que hay otros dispersos por los señoríos —humanos, espíritus salvajes y otros— que son fragmentos de Izanami como ellos, esperando ser encontrados y despertados mediante la tortura, el asesinato ritual y el Chi impuro.\n\nEs por esta razón que la Parentela de Izanami se esconde muy bien entre sus primos del Velo, pues son perseguidos cada vez que son descubiertos."

 holy_order_fallen_heroes: "Los Héroes Caídos"
 holy_order_jinhai_remembrance: "El Recuerdo de Jinhai"
 holy_order_cursed_golden_children: "Los Niños Dorados Malditos"
 holy_order_followers_of_arhat: "Los Seguidores de [Glossary('Arhat','podgloss.arhat')]"
 holy_order_second_breath: "El Segundo Aliento"
 holy_order_masters_high_war: "Los Maestros de la Gran Guerra"
 
 empty_hands: "Manos Vacías"
 empty_hands_adj: "Manos"
 empty_hands_adherent: "$boneflowers_religion_adherent$"
 empty_hands_adherent_plural: "$boneflowers_religion_adherent_plural$"
 empty_hands_desc: "La escuela de pensamiento de las Manos Vacías cree que deben mantenerse libres de toda impureza, pero no tienen derecho a interferir en la búsqueda de conocimiento de otro, incluso cuando tratan con [akuma|E]."
 
 fishhooks: "Anzuelos"
 fishhooks_adj: "Anzuelos"
 fishhooks_adherent: "$boneflowers_religion_adherent$"
 fishhooks_adherent_plural: "$boneflowers_religion_adherent_plural$"
 fishhooks_desc: "Los Anzuelos estudian, interrogan, engañan y torturan a los [akuma|E]. Al hacerlo, buscan comprender a los [Glossary('Reyes Yama','podgloss.yamaking')] y la condenación sin arriesgar sus propias almas. Harán o dirán cualquier cosa para obtener información de un [akuma|E]."

 august_body_of_sagacious_devils: "Augusto Cuerpo de Demonios Sagaces"
 august_body_of_sagacious_devils_adj: "Sagaz"
 august_body_of_sagacious_devils_adherent: "Diablo de Jade"
 august_body_of_sagacious_devils_adherent_plural: "Diablos de Jade"
 august_body_of_sagacious_devils_desc: "Los líderes oficiales de los Tigres Diablo, el Augusto Cuerpo, utilizan un sistema de rangos extremadamente competitivo para canalizar la energía colérica del P'o en un trabajo productivo para el bien común de los [GetTrait('kueijin').GetName( GetNullCharacter )]."
 
 thousand_embers_righteousness_societies: "Sociedades de las Mil Brasas"
 thousand_embers_righteousness_societies_adj: "Rectitud"
 thousand_embers_righteousness_societies_adherent: "$deviltigers_religion_adherent$"
 thousand_embers_righteousness_societies_adherent_plural: "$deviltigers_religion_adherent_plural$"
 thousand_embers_righteousness_societies_desc: "El núcleo social de los Tigres Diablo, las sociedades son grupos a pequeña escala que trabajan, entrenan y se iluminan juntos. Sin embargo, el propósito de cada sociedad a largo plazo es actuar como una distracción para el [Glossary('Emperador Demonio','podgloss.demonemperor')], como una célula de guerrilla que prenderá fuego a la sociedad mortal para evitar que los [Glossary('Reyes Yama','podgloss.yamaking')] prosperen."
 
 searing_wind: "Viento abrasador"
 searing_wind_adj: "Abrasador"
 searing_wind_adherent: "Infundidor del infierno"
 searing_wind_adherent_plural: "Infundidores del infierno"
 searing_wind_desc: "Siguiendo a su Gran [Glossary('Arhat','podgloss.arhat')] Hon Li, estos Tigres Diablo rechazan la estructura de las Cortes. En su lugar, se preparan para la batalla final contra el [Glossary('Emperador Demonio','podgloss.demonemperor')] y están dispuestos a quemar el mundo para lograr la victoria si fuera necesario."
 
 societies_brigands_devils: "Sociedad de derrocamiento de dinastías"
 societies_brigands_devils_adj: "Derrocador"
 societies_brigands_devils_adherent: "Diablo bandido"
 societies_brigands_devils_adherent_plural: "Bandidos diablos"
 societies_brigands_devils_desc: "La Sociedad de Bandidos y Diablos Decadentes de Derrocamiento de Dinastías es principalmente una turba de discípulos socialmente desfavorecidos utilizados por sus Antiguos cuando sienten que el mundo mortal necesita un sangriento sacudón. Su aparición en masa siempre presagia tiempos difíciles."

 black_iron_talons: "Garras de hierro negro"
 black_iron_talons_adj: "de Hierro"
 black_iron_talons_adherent: "Garra Roja"
 black_iron_talons_adherent_plural: "Garras Rojas"
 black_iron_talons_desc: "Las Garras de hierro negro son la fuerza paramilitar de los Tigres Diablo, organizándose bajo una cadena de mando militar. También se les conoce como investigadores sin igual y una Garra siempre se asegura de que su objetivo sea de hecho malvado antes de atacar."

 brillant_coals: "Carbones brillantes"
 brillant_coals_adj: "Carmesí"
 brillant_coals_adherent: "Tigre carmesí"
 brillant_coals_adherent_plural: "Tigres carmesíes"
 brillant_coals_desc: "Las Carbones brillantes es la filosofía tradicional de los Tigres Diablo adaptada a la Corte del Fénix Escarlata. Como tal, es matriarcal y se centra más en el impulso carnal que en la violencia pura."
 
 electric_money: "Cártel mercantil del Tigre carmesí"
 electric_money_adj: "Carmesí"
 electric_money_adherent: "Tigre carmesí"
 electric_money_adherent_plural: "Tigres carmesíes"
 electric_money_desc: "El «banco de inversión» de los Tigres Diablo es una sociedad dedicada a luchar contra los [Glossary('Reyes Yama','podgloss.yamaking')] en el campo de batalla económico. Están más que dispuestos a hundir economías enteras si los demonios de Yomi pierden activos importantes en el proceso."
   
 righteous_smiting_fist: "Puño de castigo justo"
 righteous_smiting_fist_adj: "Puño"
 righteous_smiting_fist_adherent: "Liberador"
 righteous_smiting_fist_adherent_plural: "Liberadores"
 righteous_smiting_fist_desc: "El Puño de castigo justo de la Tierra es una sociedad que rechaza la política de coexistencia de las Cortes con los wraiths. En su lugar, quieren derrocar el Reino Oscuro de Jade y a su corrupto gobernante para liberar las almas allí prisioneras."
 
 sinner_punishing_society: "Sociedad de castigo de pecadores"
 sinner_punishing_society_adj: "Castigador"
 sinner_punishing_society_adherent: "Castigador"
 sinner_punishing_society_adherent_plural: "Castigadores"
 sinner_punishing_society_desc: "La Distinguida Sociedad de Castigo de Pecadores llega a extremos tales para castigar a los malvados que incluso otros Tigres Diablo se echan atrás. Sus ejecuciones públicas y ultra violentas hacen que sean considerados un lastre para la causa de los Tigres Diablo en su conjunto."

 shan_bo_heresy: "Herejía de Shan-bo"
 shan_bo_heresy_adj: "Shan"
 shan_bo_heresy_adherent: "Ascendido"
 shan_bo_heresy_adherent_plural: "Ascendido"
 shan_bo_heresy_desc: "Un filósofo de los Tigres Diablo, Shan-bo, impulsó la idea radical de que el [Glossary('Augusto Personaje de Jade','podgloss.augustpersonageofjade')] podría haber cometido un error con el destierro del $pod_kueijin$ y se ha retirado vergonzosamente del mundo tras darse cuenta de ello. Shan-bo nunca renunció a su visión a pesar de las múltiples censuras de las Cortes y su pequeño pero dedicado grupo de seguidores sobrevive hasta hoy."
 
 shining_ice_guardians: "Guardianes del hielo brillante"
 shining_ice_guardians_adj: "Brillante"
 shining_ice_guardians_adherent: "$resplendentcranes_religion_adherent$"
 shining_ice_guardians_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 shining_ice_guardians_desc: "Como la rama principal de las Grullas Resplandecientes [Glossary('Dharma','podgloss.dharma')], los guardianes se enorgullecen de su estricta adhesión al Camino de los Ocho Lotos."
 
 eight_lotus_blooming: "Florecimiento de los ocho lotos"
 eight_lotus_blooming_adj: "Loto"
 eight_lotus_blooming_adherent: "$resplendentcranes_religion_adherent$"
 eight_lotus_blooming_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 eight_lotus_blooming_desc: "Esta secta de las Grullas Resplandecientes se centra más en un viaje interno hacia la ley y el orden, poniendo gran énfasis en la meditación y las búsquedas espirituales."
 
 empty_throne: "Trono vacío"
 empty_throne_adj: "Trono"
 empty_throne_adherent: "$resplendentcranes_religion_adherent$"
 empty_throne_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 empty_throne_desc: "Una secta moderada que fomenta la acción justa por encima de métodos y regulaciones específicas. Creen que incluso los más malvados pueden ser alentados a rechazar sus caminos ante la virtud."
 
 two_li_road: "Camino de dos Li"
 two_li_road_adj: "Camino"
 two_li_road_adherent: "$resplendentcranes_religion_adherent$"
 two_li_road_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 two_li_road_desc: "Esta secta cree que la civilización moderna es la verdadera causa de la maldad y busca volver a formas de vida más sencillas y tradicionales."
		
 yellow_moon: "Luna Amarilla"
 yellow_moon_adj: "Luna"
 yellow_moon_adherent: "$resplendentcranes_religion_adherent$"
 yellow_moon_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 yellow_moon_desc: "Fundada por tres mandarines que creían en la Iluminación que se puede encontrar en las filosofías de los mortales, esta secta ha sobrevivido a su caída de la Gracia y fue aceptada a regañadientes como legítima."
		
 fellowship_of_the_travelers_of_the_great_earth: "Hermandad de los Viajeros de la Gran Tierra"
 fellowship_of_the_travelers_of_the_great_earth_adj: "Fellowship"
 fellowship_of_the_travelers_of_the_great_earth_adherent: "$resplendentcranes_religion_adherent$"
 fellowship_of_the_travelers_of_the_great_earth_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 fellowship_of_the_travelers_of_the_great_earth_desc: "Una secta ilegal que busca un nuevo Emperador para unir el Reino Medio en un solo estado. Con este fin, interfieren en los asuntos mortales mucho más de lo que acepta la doctrina convencional."
		
 liberators_of_the_wheel: "Libertadores de la Rueda"
 liberators_of_the_wheel_adj: "Liberadores"
 liberators_of_the_wheel_adherent: "$resplendentcranes_religion_adherent$"
 liberators_of_the_wheel_adherent_plural: "$resplendentcranes_religion_adherent_plural$"
 liberators_of_the_wheel_desc: "Una secta ilegal que cree que la [Glossary('Rueda de las Eras','podgloss.wheelofages')] gira debido a lugares más allá del Reino Medio que están demasiado sumidos en el pecado como para ser redimidos. Siguiendo esto, emplean ataques terroristas para desestabilizar el mundo más allá del Reino Medio."
 
 wise_centipedes: "Ciempiés Sabios"
 wise_centipedes_adj: "Ciempiés"
 wise_centipedes_adherent: "$thousandwhispers_religion_adherent$"
 wise_centipedes_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 wise_centipedes_desc: "Los Susurros de Equilibrio Central se llaman a sí mismos simplemente Ciempiés Sabios, y se preocupan por mantener el equilibrio una vez que se ha logrado en un lugar o persona."
 
 bunraku: "Bunraku"
 bunraku_adj: "Bunraku"
 bunraku_adherent: "$thousandwhispers_religion_adherent$"
 bunraku_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 bunraku_desc: "Orientados al norte, los Bunraku operan desde las sombras para imponer el Equilibrio dentro del Reino Medio."
 
 dancing_peacocks: "Pavos Reales Danzantes"
 dancing_peacocks_adj: "Pavos Reales"
 dancing_peacocks_adherent: "$thousandwhispers_religion_adherent$"
 dancing_peacocks_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 dancing_peacocks_desc: "Orientados al este, los Pavos Reales viven entre los mortales y son quienes más se involucran en sus asuntos."
 
 scarlet_centipedes: "Ciempiés Escarlata"
 scarlet_centipedes_adj: "Ciempiés"
 scarlet_centipedes_adherent: "$thousandwhispers_religion_adherent$"
 scarlet_centipedes_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 scarlet_centipedes_desc: "Orientados al sur, los Ciempiés Escarlata son alborotadores y guerreros que buscan subvertir el Status Quo."
 
 exalted_jade_masks: "Máscaras de Jade Exaltadas"
 exalted_jade_masks_adj: "Máscaras"
 exalted_jade_masks_adherent: "$thousandwhispers_religion_adherent$"
 exalted_jade_masks_adherent_plural: "$thousandwhispers_religion_adherent_plural$"
 exalted_jade_masks_desc: "Orientados al oeste, las Máscaras de Jade cazan fantasmas, buscando corregir su desequilibrio permitiéndoles partir o matándolos si se niegan."
 
 laughing_rainbows: "Arcoíris Risueños"
 laughing_rainbows_adj: "Arcoíris"
 laughing_rainbows_adherent: "$thrashingdragons_religion_adherent$"
 laughing_rainbows_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 laughing_rainbows_desc: "Los moderados de los Dragones Azotadores; esta es la visión ortodoxa de este [Glossary('Dharma','podgloss.dharma')] que busca un compromiso entre la búsqueda de nuevas experiencias y la contemplación de las pasadas."

 return_to_power: "Honorable Regreso al Poder"
 return_to_power_adj: "Regresando"
 return_to_power_adherent: "$thrashingdragons_religion_adherent$"
 return_to_power_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 return_to_power_desc: "Fundada por el Dragón Azotador Kang Cho-lu, esta escuela de pensamiento cree que los Wan Kuei deberían apoderarse del trono de los reinos mortales y gobernar como dioses benevolentes, tal como hacían antes de su caída. Solo entonces serán perdonados por el [Glossary('Augusto Personaje de Jade','podgloss.augustpersonageofjade')]."
  
 the_thousand_faced_thunders: "Los Mil Truenos de Mil Caras"
 the_thousand_faced_thunders_adj: "Truenos"
 the_thousand_faced_thunders_adherent: "$thrashingdragons_religion_adherent$"
 the_thousand_faced_thunders_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_thousand_faced_thunders_desc: "Una secta dedicada al [Glossary('Mundo Yang','game_concept_yang_world_desc')], particularmente hábil tratando con los espíritus que habitan allí. Suelen seguir las innovaciones de los mortales con atención para anticipar el nacimiento de nuevos espíritus."
 
 the_ten_seasons_sect: "Secta de las Diez Estaciones"
 the_ten_seasons_sect_adj: "Secta"
 the_ten_seasons_sect_adherent: "$thrashingdragons_religion_adherent$"
 the_ten_seasons_sect_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_ten_seasons_sect_desc: "Una secta dedicada a la veneración de los ciclos naturales y al cuidado esmerado de los «jardines», ya sean literales, familias, organizaciones o incluso naciones."
 
 the_passion_bloodflowers: "Las Flores de Sangre de la Pasión"
 the_passion_bloodflowers_adj: "Flores de Sangre"
 the_passion_bloodflowers_adherent: "$thrashingdragons_religion_adherent$"
 the_passion_bloodflowers_adherent_plural: "$thrashingdragons_religion_adherent_plural$"
 the_passion_bloodflowers_desc: "Las Flores de Sangre adoptan una postura aún más extrema sobre el disfrute de la vida que los Arcoíris Risueños, a veces rozando lo animal."

 thousandhells_religion: "@kueijin_icon! Mil Infiernos" # TODO YAMAKINGS: replace with yama king / defiled icon
 thousandhells_religion_adj: "Infernal"
 thousandhells_religion_adherent: "Akuma"
 thousandhells_religion_adherent_plural: "Akumas"
 thousandhells_religion_desc: "Un [Glossary('Dharma','podgloss.dharma')] que se opone al Camino Quíntuple. Sus seguidores predican la unión con los [Glossary('Reyes Yama','podgloss.yamaking')] y ven su nuevo estado como una forma de servir al Augusto Personaje como destructores."

 wayofthetenthousandscreams: "Diez Mil Gritos"
 wayofthetenthousandscreams_adj: "Gritante"
 wayofthetenthousandscreams_adherent: "Gritón"
 wayofthetenthousandscreams_adherent_plural: "Gritones"
 wayofthetenthousandscreams_desc: "Un [Glossary('Dharma','podgloss.dharma')] que se opone al Camino Quíntuple. Sus seguidores predican la unión con los [Glossary('Reyes Yama','podgloss.yamaking')] y ven su nuevo estado como una forma de servir al Augusto Personaje como destructores."
 
 thousandhells_emma_o: "Emma-o"
 thousandhells_emma_o_adj: "Emma-o"
 thousandhells_emma_o_adherent: "Shikome"
 thousandhells_emma_o_adherent_plural: "Shikome"
 thousandhells_emma_o_desc: "Emma-O, el Señor Oscuro de los [Glossary('Kakuri','podgloss.kakuri')], es el favorito actual en la gran guerra de los [Glossary('Reyes Yama','podgloss.yamaking')] por el trono del [Glossary('Emperador Demonio','podgloss.demonemperor')].\nLa personificación del aspecto Yin, Emma-O es un individuo astuto y calculador que carece de piedad. Suele aparecer como un hombre extremadamente alto, con una larga barba y, por lo general, de apariencia velluda, con piel de obsidiana y vestido con telas Ainu que llevan diseños de batalla, enfermedad y muerte. A menudo le acompañan sus hermosos sirvientes [Glossary('Shikome','podgloss.shikome')].\n\nEmma-O es el único [Glossary('Rey Yama','podgloss.yamaking')] actualmente activo que puede presumir de haber triunfado sobre uno de sus iguales y haber absorbido su señorío y su poder, siendo él el antiguo Juez del Equilibrio, Yen-Lo."
 
 thousandhells_mikaboshi: "Mikaboshi"
 thousandhells_mikaboshi_adj: "Mikaboshi"
 thousandhells_mikaboshi_adherent: "Ejecutivo malvado"
 thousandhells_mikaboshi_adherent_plural: "Ejecutivos malvados"
 thousandhells_mikaboshi_desc: "Mikaboshi, señor de la [Glossary('Ciudad Malvada','podgloss.wickedcity')], es un [Glossary('Rey Yama','podgloss.yamaking')] que antaño fue un erudito y arquitecto japonés. Aunque es muy joven comparado con sus iguales, su afán por la innovación implacable y la creación de un «estado máquina» que convertirá a la humanidad en cáscaras sin alma lo convierte en una estrella ascendente a medida que las civilizaciones de la humanidad se expanden cada vez más."
 
 thousandhells_ravana: "Ravana"
 thousandhells_ravana_adj: "Ravana"
 thousandhells_ravana_adherent: "Raksha"
 thousandhells_ravana_adherent_plural: "Rakshas"
 thousandhells_ravana_desc: "Ravana fue antaño el más arrogante y egoísta de todos los [Glossary('Reyes Yama','podgloss.yamaking')]. Creía verdaderamente que ningún ser podría superarlo en poder, intelecto o crueldad. Esta arrogancia lo hizo muy peligroso pero también muy predecible, lo que condujo a su caída.\nAhora durmiente en la ciudad en ruinas de Lanka, parece que la oportunidad del Rajá de los Demonios de convertirse en [Glossary('Emperador Demonio','podgloss.demonemperor')] ha pasado."
 
 thousandhells_rangda: "Rangda"
 thousandhells_rangda_adj: "Rangda"
 thousandhells_rangda_adherent: "Portador de la plaga"
 thousandhells_rangda_adherent_plural: "Portadores de la plaga"
 thousandhells_rangda_desc: "Rangda es la menos arrogante de los [Glossary('Reyes Yama','podgloss.yamaking')]. Ni altiva ni codiciosa, Rangda siente que la enfermedad y la muerte lenta deberían estar al alcance de todos, ya sean ricos o pobres, habitantes de la ciudad o del campo.\nCon este fin, es la más igualitaria de los Reyes Yama. Solo desea que todos los seres vivos caigan bajo su dominio y mueran tras soportar la mayor agonía posible."
 
 thousandhells_tou_mu: "Tou Mu"
 thousandhells_tou_mu_adj: "Tou Mu"
 thousandhells_tou_mu_adherent: "Araña"
 thousandhells_tou_mu_adherent_plural: "Arañas"
 thousandhells_tou_mu_desc: "Los $pod_kueijin$ tienen un enemigo formidable en un [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] más terrible que cualquier otro, y su nombre es Tou Mu.\nTou Mu se encuentra entre los más maliciosos de los [Glossary('Reyes Yama','podgloss.yamaking')], y es esta odiosidad la que la ha traído tan cerca del trono del [Glossary('Emperador Demonio','podgloss.demonemperor')]. La Emperatriz de Hierro es, con diferencia, la Reina Yama mejor conocida y es famosa por su apasionado odio hacia los Vástagos de Oriente.\nMientras que otros [Glossary('Reyes Yama','podgloss.yamaking')] intentarán corromperlos y atraparlos, trabajar para la Emperatriz de Hierro es, en el mejor de los casos, un aplazamiento de la ejecución."
 
 thousandhells_dokhor_khan: "Dokhor-Khan"
 thousandhells_dokhor_khan_adj: "Dokhor-Khan"
 thousandhells_dokhor_khan_adherent: "Elegido"
 thousandhells_dokhor_khan_adherent_plural: "Elegidos"
 thousandhells_dokhor_khan_desc: "Dokhor-Khan es el [Glossary('Rey Yama','podgloss.yamaking')] del [Glossary('Infierno de las Cadenas de Púas','podgloss.hellspikedchains')].\nA partir de 1230, es uno de los [Glossary('Reyes Yama','podgloss.yamaking')] más poderosos que existen y su control sobre las estepas es casi indiscutible. Se alimenta de la agonía y el odio y es conocido por sus audaces, a veces temerarios, planes para lograr el dominio sobre sus rivales."
 
 thousandhells_wu_hua: "Wu Hua"
 thousandhells_wu_hua_adj: "Wu Hua"
 thousandhells_wu_hua_adherent: "Prisionero"
 thousandhells_wu_hua_adherent_plural: "Prisioneros"
 thousandhells_wu_hua_desc: "Wu Hua, señor del Foso de Sal e Hierro, es un [Glossary('Rey Yama','podgloss.yamaking')]. Aunque su Infierno y su poder general son menores que los de algunos de sus rivales, no le falta maldad.\nHaciendo trabajar a sus prisioneros hasta los huesos, Wu Hua solo ofrece los Burdeles de Hierro como una potencial ruta de escape que muchos terminan lamentando haber elegido.\nLa estructura organizativa de Wu Hua ha sido modelada según las estructuras burocráticas de la China primitiva. Los sirvientes obedientes son recompensados con regalos y ascensos. Los lacayos desobedientes son castigados y finalmente destruidos. Cualquier criatura que haya ascendido a través de estas filas retorcidas es sin duda una criatura de gran maldad y astucia, y debe ser tratada con precaución."
 
 thousandhells_the_wandering_overlord: "El Señor Errante"
 thousandhells_the_wandering_overlord_adj: "Errante"
 thousandhells_the_wandering_overlord_adherent: "Vagabundo"
 thousandhells_the_wandering_overlord_adherent_plural: "Vagabundos"
 thousandhells_the_wandering_overlord_desc: "Entre los enigmas de Yomi, el Señor Errante es uno de sus mayores misterios, incluso para sus propios compañeros [Glossary('Reyes Yama','podgloss.yamaking')]. No posee dominio alguno, no tiene servidores y parece sentirse igualmente cómodo en Yomi que en el Reino Medio.\nLos objetivos del Señor Errante son desconocidos. A veces ayuda a quienes lo necesitan sin motivo aparente. En otras ocasiones, manipula los acontecimientos de tal manera que miles sufren. No ofrece explicación alguna por sus actos y los otros Reyes Yama, quizás temerosos de la respuesta, nunca se las han pedido."
 
 thousandhells_haha_no_fukami: "Haha no Fukami"
 thousandhells_haha_no_fukami_adj: "Haha no Fukami"
 thousandhells_haha_no_fukami_adherent: "Sirviente de perla"
 thousandhells_haha_no_fukami_adherent_plural: "Sirvientes de perla"
 thousandhells_haha_no_fukami_desc: "Haha no Fukami no formaba parte de los [Glossary('Reyes Yama','podgloss.yamaking')] originales, y algunos dirían que todavía no es lo suficientemente corrupta como para estar entre ellos. Solo su dominio sobre uno de los Mil Infiernos la sitúa en tal compañía.\nHaha no Fukami era la madre oceánica primigenia al final de la Primera Era, y solo cuando el [Glossary('Augusto Personaje de Jade','podgloss.augustpersonageofjade')] le pidió que se convirtiera en la castigadora de los crímenes contra los océanos y de los crímenes cometidos con fuego o agua, su posición celestial quedó consolidada."
 
 thousandhells_honoyeta: "Honoyeta"
 thousandhells_honoyeta_adj: "Honoyeta"
 thousandhells_honoyeta_adherent: "Serpiente"
 thousandhells_honoyeta_adherent_plural: "Serpientes"
 thousandhells_honoyeta_desc: "Esta deidad serpiente polinesia también es conocida como Basuki entre los balineses, y como Kaliya o Naga Pahoda en la India. Honoyeta es un espíritu de energías Yang corruptas de muerte y enfermedad. Honoyeta sabe que nunca ascenderá al trono del [Glossary('Emperador Demonio','podgloss.demonemperor')], pero sus amistosas —algunos dicen que serviles— relaciones con los Maeljin Aliara le ofrecen otras opciones.\nHonoyeta prefiere las serpientes venenosas como agentes de su poder y servidores."
 
 thousandhells_hine_nui_te_po: "Hine-Nui-Te-Po"
 thousandhells_hine_nui_te_po_adj: "Hine-Nui-Te-Po"
 thousandhells_hine_nui_te_po_adherent: "Sembrador de desesperación"
 thousandhells_hine_nui_te_po_adherent_plural: "Sembradores de desesperación"
 thousandhells_hine_nui_te_po_desc: "Esta [Glossary('Reina Yama','podgloss.yamaking')] de aspecto Yin se encuentra entre los más débiles de los señores que gobiernan en Yomi. Se manifiesta como una nube de oscuridad y se alimenta de sentimientos de autodesprecio.\nLas almas que caen en la desesperación y el suicidio en las Islas del Pacífico se sumergen en su dominio de mares helados. Sus raros y fanáticos [akuma|E] acechan principalmente en los confines de la Corte del Fénix Escarlata."
 
 thousandhells_malaveyovo: "Malaveyovo"
 thousandhells_malaveyovo_adj: "Malaveyovo"
 thousandhells_malaveyovo_adherent: "Caníbal"
 thousandhells_malaveyovo_adherent_plural: "Caníbales"
 thousandhells_malaveyovo_desc: "Originalmente asignado por el Cielo para velar por las almas de aquellos que murieron de hambre, este demonio fue rápido en abandonar sus deberes por el atractivo del poder.\nOtro de los [Glossary('Reyes Yama','podgloss.yamaking')] que compite por el control de la Corte del Fénix Escarlata, Malaveyovo gobierna un pequeño dominio en Yomi. Al afligir a sus seguidores con un ansia insaciable, los empuja al canibalismo, que luego recompensa con sensaciones de euforia y éxtasis."
 
 thousandhells_grandmother_witch: "Grandmother Witch"
 thousandhells_grandmother_witch_adj: "Abuela"
 thousandhells_grandmother_witch_adherent: "Nieto"
 thousandhells_grandmother_witch_adherent_plural: "Nietos"
 thousandhells_grandmother_witch_desc: "La Bruja Abuela es una aspirante al trono del [Glossary('Emperador Demonio','podgloss.demonemperor')] —quizá incluso una aspirante seria, aunque pocos son conscientes de ella todavía. La Bruja Abuela tiene una teoría sobre la Edad del Pesar: será la era mágica más poderosa jamás vista, aunque no será una forma de magia que el mundo actual pueda sobrevivir. Con ese fin, envía a sus agentes por todo el mundo para recolectar artefactos malditos, reclutar infernalistas y brujos con talento, y apuntalar su derecho al trono con toda la hechicería prohibida que pueda encontrar."
 
 thousandhells_tou_shen: "Tou Shen"
 thousandhells_tou_shen_adj: "Tou Shen"
 thousandhells_tou_shen_adherent: "Monstruo de la viruela"
 thousandhells_tou_shen_adherent_plural: "Monstruos de la viruela"
 thousandhells_tou_shen_desc: "El Infierno Febril es un pequeño Señorío de Yomi poblado por aquellos que han causado o se han beneficiado de la propagación de la viruela. Muchas almas de este Infierno han sido robadas por Rangda mientras consolida su papel como la [Glossary('Reina Yama','podgloss.yamaking')] de las enfermedades en su conjunto."
 
 thousandhells_hluh: "Hluh"
 thousandhells_hluh_adj: "Hluh"
 thousandhells_hluh_adherent: "Caldera"
 thousandhells_hluh_adherent_plural: "Calderas"
 thousandhells_hluh_desc: "El nombre del Infierno del Aceite Hirviendo es erróneo, ya que el Señorío no está lleno de aceite hirviendo, sino de grasa humana derretida. Trozos de grasa carbonizada y ardiente flotan sobre el océano circundante de grasa espesa y burbujeante. En algunos puntos, una espuma gris oscura de residuo sobrecocinado flota en la superficie.\n\nEl [Glossary('Rey Yama','podgloss.yamaking')] de este Señorío es quizás el menos humano de todos los Reyes Yama. Su nombre es Hluh, y se cree que es una criatura gelatinosa que se asemeja a una medusa acorazada de color rojo brillante del tamaño de una isla, con bocas de ventosa de dientes afilados en los extremos de cada uno de sus tentáculos.\nDada la naturaleza de su hogar elegido, es poco probable que esta criatura exista de una forma que la mente mortal pueda comprender fácilmente (o con comodidad)."
 
 thousandhells_ku_of_the_thousand_tears: "Ku de las Mil Lágrimas"
 thousandhells_ku_of_the_thousand_tears_adj: "Ku de las Mil Lágrimas"
 thousandhells_ku_of_the_thousand_tears_adherent: "Guardián del Umbral"
 thousandhells_ku_of_the_thousand_tears_adherent_plural: "Guardianes de la Puerta"
 thousandhells_ku_of_the_thousand_tears_desc: "Feng-tu es un Infierno de Yomi que imita la entrada al Infierno en los mitos budistas. Aunque es controlado principalmente por el Emperador de Jade Yu Huang, el [Glossary('Rey Yama','podgloss.yamaking')] Ku de las Mil Lágrimas también hace su hogar aquí, dominando a aquellos que mueren por disidencia política."


