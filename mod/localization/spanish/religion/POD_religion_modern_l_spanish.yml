l_spanish: 
 
  #Common Modern Anarch Localization
  modernanarch_religion: "@vampire_icon! Anarquistas"
  modernanarch_religion_adj: "Anarquista"
  modernanarch_religion_adherent: "Anarquista"
  modernanarch_religion_adherent_plural: "Anarquistas"
  modernanarch_religion_desc: "Los Anarquistas son vampiros que rechazan el statu quo de la sociedad $pod_cainite$."
  modernanarch_high_god_name: "Libertad"
  modernanarch_high_god_name_alternate: "Libertad"
  modernanarch_creator_god_name: "Libertad"
 
  #ModernAnarch-Group Faiths
  
  freeanarch: "Anarquista libre"
  freeanarch_adj: "Anarquista libre"
  freeanarch_adherent: "Anarquista libre"
  freeanarch_adherent_plural: "Anarquistas libres"
  freeanarch_desc: "Estos $pod_cainites$ nunca se inclinarán ante ninguna autoridad que no sea la que ellos mismos elijan, sin importar las probabilidades. Los bastiones anarquistas suelen ser salvajes e ingobernables, pero son un faro de esperanza y libertad para muchos vampiros jóvenes. Y algo que sus antiguos deben aplastar rápidamente."
  
  #Common Camarilla Localization
  camarilla_religion: "@vampire_icon! Camarilla"
  camarilla_religion_adj: "Camarilla"
  camarilla_religion_adherent: "Camarilla"
  camarilla_religion_adherent_plural: "Camarilla"
  camarilla_religion_desc: "Además de evitar que las crecientes masas de mortales descubran la existencia de los vampiros, la Camarilla pretende mantener el statu quo de la sociedad de los Vástagos; como tal, gran parte de su estructura y tradiciones reflejan las de la sociedad $pod_cainite$ de la Europa feudal de la Edad Oscura."
  
  #Camarilla-Group Faiths
  
  camahumanity: "Camarilla (Humanidad)"
  camahumanity_adj: "Camarilla"
  camahumanity_adherent: "Camarilla"
  camahumanity_adherent_plural: "Camarilla"
  camahumanity_desc: "Se anima a los Vástagos a mezclarse con los mortales lo mejor posible y a conservar la civilidad y la compostura que provienen de aferrarse a las características humanas de uno. Casi todos los miembros de la Camarilla siguen la \"Senda\" de la Humanidad, mientras que otras Sendas de Iluminación son fuertemente desaconsejadas y normalmente solo las practican los antiguos."
 
  camaanarchs: "Camarilla (Anarquistas)"
  camaanarchs_adj: "Anarquista"
  camaanarchs_adherent: "Anarquista"
  camaanarchs_adherent_plural: "Anarquistas"
  camaanarchs_desc: "La mayoría de los anarquistas respetan y mantienen la Mascarada y algunas de las otras Tradiciones, incluso si no respetan a los vampiros que las imponen o al sistema que se beneficia de ellas.\nBajo los términos de la Convención de Espinas, los anarquistas son considerados una facción de la Camarilla por sus miembros, pero a diferencia del Sabbat, son tolerados."
     
  #Common Sabbat Localization
  sabbat_religion: "@vampire_icon! Sabbat"
  sabbat_religion_adj: "Sabbat"
  sabbat_religion_adherent: "Sabbat"
  sabbat_religion_adherent_plural: "Sabbat"
  sabbat_religion_desc: "El Sabbat es una organización laxa de $pod_cainites$ que rechazan las Tradiciones. A diferencia de la Camarilla, el Sabbat cree en los [Glossary('Antediluvians','game_concept_antediluvian_desc')] y en Caín. También conocido como la Espada de Caín, ya que creen que serán el ejército que él usará para destruir a los [Glossary('Antediluvians','game_concept_antediluvian_desc')] una vez que llegue la Gehenna."
  sabbat_religious_head_title: "Priscus"
  sabbat_religious_head_title_name: "Priscus"
  sabbat_religious_text: "Libro de Nod"
 
  #Sabbat-Group Faiths
  
  pathofhonorableaccord: "Senda del Acuerdo Honorable"
  pathofhonorableaccord_adj: "Patriotas del Sabbat"
  pathofhonorableaccord_adherent: "Patriota"
  pathofhonorableaccord_adherent_plural: "Patriotas"
  pathofhonorableaccord_desc: "La Senda del Acuerdo Honorable es una Senda de Iluminación que aprovecha a la Bestia a través de la práctica rigurosa de un comportamiento honorable y caballeresco.\nLos $pod_cainites$ en la Senda del Acuerdo Honorable dan un gran valor al ritual y la ceremonia. Los Caballeros del Sabbat, por lo tanto, siempre participan en partidas de guerra, ritae, ceremonias y otros eventos de manada. En conjunto, los seguidores de la Senda buscan unir a las facciones dispares de la secta bajo el estandarte común de la lealtad a una causa."
  
  pathofdeathandthesoul: "Senda de la Muerte y el Alma"
  pathofdeathandthesoul_adj: "Nigronomistas del Sabbat"
  pathofdeathandthesoul_adherent: "Nigronomista"
  pathofdeathandthesoul_adherent_plural: "Nigronomistas"
  pathofdeathandthesoul_desc: "La Senda de la Muerte y el Alma es una Senda de Iluminación que suprime a la Bestia mediante el estudio desapegado de la muerte, la no-muerte y el alma.\nComo una de las sendas más eruditas, los nigronomistas ven la existencia vampírica como un medio para explorar los misterios de la vida y la muerte. Dividen el universo en el reino racional de la carne y la física y el reino irracional del dolor, los misterios y los fenómenos sobrenaturales. Para explorar estas diferencias y encontrar la respuesta a sus preguntas, un vampiro tiene que explorar su propio estado y la naturaleza del alma."
  
  pathofpowerandtheinnervoice: "Senda del Poder y la Voz Interior"
  pathofpowerandtheinnervoice_adj: "Unificadores del Sabbat"
  pathofpowerandtheinnervoice_adherent: "Unificador"
  pathofpowerandtheinnervoice_adherent_plural: "Unificadores"
  pathofpowerandtheinnervoice_desc: "La Senda del Poder y la Voz Interior es una Senda de Iluminación que controla a la Bestia a través de una determinación rigurosa y la acumulación de poder mundano.\nLos seguidores de esta Senda creen que la verdad reside en su interior y se encuentra mejor mediante una búsqueda interna de iluminación personal que conduce en última instancia a la acumulación de poder. El control de uno mismo y del mundo exterior es el único objetivo que vale la pena perseguir. Con este fin, un vampiro debe desarrollar sus habilidades, extender su influencia y colocar a sus peones."
  
  pathofthebeast: "Senda de la Bestia"
  pathofthebeast_adj: "Bestias del Sabbat"
  pathofthebeast_adherent: "Bestia"
  pathofthebeast_adherent_plural: "Bestias"
  pathofthebeast_desc: "La Senda de la Bestia es una Senda de Iluminación que busca controlar a la Bestia aceptando sus impulsos como naturales y aceptando su papel como cazador entre cazadores.\nDesorganizados y rehuyendo los adornos de la civilización, los seguidores de la Senda a menudo evitan la tecnología en favor de sus talentos inherentes a su forma de no-muerto." 
  
  pathofmetamorphosis: "Senda de la Metamorfosis"
  pathofmetamorphosis_adj: "Metamorfosistas del Sabbat"
  pathofmetamorphosis_adherent: "Metamorfosista"
  pathofmetamorphosis_adherent_plural: "Metamorfosistas"
  pathofmetamorphosis_desc: "La Senda de la Metamorfosis es una Senda de Iluminación que controla a la Bestia estudiando sus límites y los límites del vampirismo en general.\nCreen que el siguiente paso es un estado similar a la apoteosis, que llaman Azhi Dahaka, por el dragón de la mitología persa, y harán cualquier cosa —cualquier cosa— para lograrlo. Es una filosofía distante y solitaria, alejada de cualquier necesidad que no sea la cuestión del sustento."
  
  pathofcathari: "Senda de los Cátaros"
  pathofcathari_adj: "Albigenses del Sabbat"
  pathofcathari_adherent: "Albigense"
  pathofcathari_adherent_plural: "Albigenses"
  pathofcathari_desc: "La Senda de los Cátaros se presenta como la contraparte directa de los cátaros medievales: los vampiros son espíritus arcónticos, carceleros del Demiurgo, situados en este mundo para asegurar que la humanidad nunca lo trascienda. Caín fue condenado por el buen creador a la fisicidad y al sufrimiento sin fin, pero situado por encima de la humanidad en el proceso, para evaluar a los humanos y tentarlos a alejarse de la gnosis. Con este fin, los albigenses (la titulación formal de un seguidor de la senda) fomentan el exceso mortal y el materialismo y rompen deliberadamente los muchos tabúes de los antiguos cátaros."
  
  pathofcaine: "Senda de Caín"
  pathofcaine_adj: "Nodistas del Sabbat"
  pathofcaine_adherent: "Nodista"
  pathofcaine_adherent_plural: "Nodistas"
  pathofcaine_desc: "La Senda de Caín es una Senda de Iluminación que emula al Padre Oscuro para protegerse de la Bestia.\nEl corazón de la Senda de Caín reside en la ejemplificación de la naturaleza vampírica: las cuestiones de la existencia, los límites de la forma vampírica y los cambios provocados por el Abrazo impulsan a los nodistas a una especulación, debate, estudio e investigación interminables. La erudición y la visión histórica son valiosas, pero el vampiro debe desarrollarse simultáneamente espiritual y físicamente, para explorar los límites de su forma de no-muerto."
  
  pathofharmony: "Senda de la Armonía"
  pathofharmony_adj: "Armonistas del Sabbat"
  pathofharmony_adherent: "Armonista"
  pathofharmony_adherent_plural: "Armonistas"
  pathofharmony_desc: "Una variante de la Senda de la Bestia en el sentido de que acepta a la Bestia como necesaria para la supervivencia del vampiro.\nLos armonistas no creen que nada de lo que existe sea antinatural. El simple hecho de ser significa que un individuo o fuerza tiene un lugar. Esto incluye a los vampiros. Sí, el papel del vampiro en el orden natural es algo desagradable, pero el conejo probablemente sentiría lo mismo respecto al zorro."
  
  pathofnight: "Senda de la Noche"
  pathofnight_adj: "Nihilistas del Sabbat"
  pathofnight_adherent: "Nihilista"
  pathofnight_adherent_plural: "Nihilistas"
  pathofnight_desc: "La Senda de la Noche, a veces llamada Senda de la Noche Aliada, es una Senda de Iluminación que predica la aceptación de la maldición de Caín y de la Bestia. Los cainitas deben aprovechar sus poderes para servir al propósito ordenado del vampirismo —causar estragos entre los mortales e inspirar pavor— y así encontrar la salvación."
 
  vasantasenadharma: "Vasantasenadharma"
  vasantasenadharma_adj: "Vasantasenadharma"
  vasantasenadharma_adherent: "Seguidor de Vasantasena"
  vasantasenadharma_adherent_plural: "Seguidores de Vasantasena"
  vasantasenadharma_desc: "Vasantasena y su sire Malkavian Unmada viajaron por el mundo durante la Edad Media, predicando contra el Vínculo de Sangre. Rechazaron el vinculum, la jerarquía tradicional de los Vástagos y toda pérdida de libre albedrío. En última instancia, condenaron a los Antediluvianos por su cruel tiranía a través de la Yihad, uniéndose al Sabbat durante su formación."
 
  pathofredemption: "Senda de la Redención"
  pathofredemption_adj: "Mártires del Sabbat"
  pathofredemption_adherent: "Mártir"
  pathofredemption_adherent_plural: "Mártires"
  pathofredemption_desc: "La Senda de la Redención es una Senda de Iluminación que lucha contra la Bestia esforzándose por la salvación al servicio de Dios. Naturalmente, estas afirmaciones son algo inconvenientes en las sociedades actuales de los Condenados, pero los seguidores de la senda suelen estar más decididos a obtener la gracia que a preocuparse por los demás."
  
  pathofleviathansabbat: "Senda del Leviatán"
  pathofleviathansabbat_adj: "Leviatán"
  pathofleviathansabbat_adherent: "Leviatán"
  pathofleviathansabbat_adherent_plural: "Leviatanes"
  pathofleviathansabbat_desc: "Esta religión no canónica ha sido encargada por un mecenas.\n\nOriginaria del antiguo uniformismo chino, se dedica a construir un colectivo similar al Leviatán, creando un concepto colectivo del cuerpo erudito a través de un adoctrinamiento flexible y leyes duras, y finalmente creando una voluntad colectiva unificada para evolucionar espiritualmente como un organismo unicelular en un organismo multicelular."
