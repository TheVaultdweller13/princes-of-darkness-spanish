l_spanish:

 podcappadocian.1.t: "Hijas de Lilith"
 podcappadocian.1.desc: "La misteriosa línea de sangre Lamia está vinculada al clan Capadocio por voluntad propia. Las hijas de Lilith son un grupo difícil de entender, pero siempre han demostrado ser fiables y constantes en el cumplimiento del trato que hicieron hace mucho tiempo con Capadocio: servir como guardaespaldas de Capadocios eminentes.\nHa llegado el momento de que solicites una de estas compañeras. El procedimiento habitual sería simplemente pedírselo a una sacerdotisa lamia, lo que resultaría en que se te asignara a uno de sus miembros más jóvenes. Un curso de acción más complejo sería insistir en participar en el proceso, lo que podría molestar a las lamias, pero también te daría más control sobre quién sería esta compañera potencialmente de por vida."
 podcappadocian.1.a: "Sacerdotisa, confío en tu elección."
 podcappadocian.1.b: "Quiero saber más sobre las hijas de Lilith antes de elegir."
 lamia_bodyguard_generic_tt: "Se te presentará una joven Lamia, probablemente hábil en la batalla pero poco excepcional en lo demás."
 lamia_bodyguard_specialized_tt: "Tendrás más opciones y se te propondrán candidatos potencialmente mejores, por un coste de prestigio."
 
 podcappadocian.2.t: "La hermana menor"
 podcappadocian.2.desc: "El templo de Lamia ha aceptado tu petición de un guardaespaldas y la elegida ha llegado recientemente para comenzar su trabajo a tu servicio. No hay sorpresas reales, se ha enviado a un miembro bastante joven de las Lamia, una a la que se le ha enseñado lo suficiente de esgrima para ser útil, pero no mucho más. Aun así, la lealtad y el empuje de estas jóvenes lamias son legendarios y le queda mucho tiempo para crecer.\nHasta entonces, espera tus órdenes."
 podcappadocian.2.a: "El comienzo de una relación fructífera."
   
 podcappadocian.3.t: "Misterios de Lilith"
 podcappadocian.3.desc: "A pesar de su estrecha asociación con el clan Capadocio, a las Lamia no les hace mucha gracia que husmees en su templo y en sus prácticas de culto. Aun así, han aceptado a regañadientes enseñarte las tres caras de Lilith: la Doncella, la Madre y la Anciana. Cada una de ellas representa una parte diferente de la vida de una mujer y se celebra en consecuencia. Tu guía se niega a decirte más y las Lamia te instan a elegir rápidamente una compañera y dejarlas con sus rituales.\nPor lo que has podido averiguar, es probable que las sacerdotisas de la Doncella sean jóvenes y hermosas, expertas en diplomacia. Las sacerdotisas de la Madre son administradoras maternales, que se encargan del día a día de los cultos. Por último, las sacerdotisas de la Anciana son viejas brujas, guardianas de los rituales sagrados de Lilith."
 podcappadocian.3.a: "Una sacerdotisa de la Doncella."
 podcappadocian.3.b: "Una sacerdotisa de la Madre."
 podcappadocian.3.c: "Una sacerdotisa de la Anciana."

 podcappadocian.4.t: "La hermana joven"
 podcappadocian.4.desc: "Eliges a una sacerdotisa de la Doncella para que te acompañe. Una criatura hermosa, que a menudo roza lo seductor, parece lo suficientemente contenta de estar ligada a ti en el futuro previsible. Es fácil hablar con ella, pero pronto se asegurará de que cada conversación termine con ella alabando los grandes placeres que se pueden obtener si uno se entrega completamente a Lilith.\nElla es sencilla, inalterada, libertad y belleza, la inocencia de la joven doncella canalizada a través de cada uno de sus movimientos. Volver a ser joven, al menos de espíritu, es siempre una perspectiva tentadora..."
 podcappadocian.4.a: "No volvamos a hablar de religión."
 podcappadocian.4.b: "Me siento influenciado..."
 
 podcappadocian.5.t: "La hermana mediana"
 podcappadocian.5.desc: "Eliges a una sacerdotisa de la Madre para que te acompañe. Mujeres fuertes y dedicadas, las servidoras de la Madre son propensas a asumir los deberes y la carga de quienes las rodean, a menudo a su propia costa. Son las representantes de la esencia creativa divina de Lilith, a menudo malinterpretada como \"Madre de Monstruos\" en los mitos. Las servidoras de la Madre asumen sus responsabilidades con el mayor cuidado y muy raras veces se las ve sin estar profundamente ocupadas canalizando a las Doncellas y cuidando de las Ancianas."

 podcappadocian.6.t: "La hermana mayor"
 podcappadocian.6.desc: "Eliges a una sacerdotisa de la Anciana para que te acompañe. Los miembros más temidos del culto de Lilith, las Ancianas son las depositarias del conocimiento prohibido de Lilith. Nadie conoce realmente el alcance del saber de los Lilim, pero incluso el nodista más obstinado aceptará que el papel de Lilith en el Génesis es el relato más misterioso y aterrador de aquellos acontecimientos.\nLas Ancianas no hablan, pero disfrutan demostrando que conocen la verdad, sea cual sea, y su sonrisa inquietante promete mucho más conocimiento para aquellos dispuestos a entregarse a la Madre Oscura."
