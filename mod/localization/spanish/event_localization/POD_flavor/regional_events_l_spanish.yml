l_spanish:
 baybars_purge_small_modifier: "Purga de Baybars: Virutas"
 baybars_purge_small_modifier_desc: "Lo sobrenatural está siendo cazado aquí, los mamelucos de Baybars patrullan las calles e interrumpen cualquier actividad sospechosa."
 
 PODexile_modifier: "En el exilio"
 PODexile_modifier_desc: "Este personaje se esconde de una amenaza poderosa y no puede gestionar adecuadamente su reino mientras tanto." 
 
 podregionalevents.2.t: "Purga de Baybars: Virutas"
 podregionalevents.2.desc: "El actual sultán mortal de Egipto es un mameluco, un esclavo turco comprado y criado para luchar, que logró ascender a la cima con una brillante (y despiadada) eficiencia que sorprendió a muchos. Tras ocuparse de forma concluyente de los cruzados (envenenando cada pozo de su zona y creando un desierto), este Baybars dirige ahora su atención de forma preocupante hacia lo sobrenatural en Egipto.\nParece estar muy bien informado, mucho más de lo que cualquier mortal debería estar, y cuenta con el respaldo de un grupo hasta ahora misterioso. Combinado con su valor inquebrantable y su gran práctica en erradicar enemigos, Baybars está demostrando ser una amenaza genuina para lo sobrenatural egipcio, con muchas raíces de su influencia ya desenterradas y (a veces literalmente) quemadas.\nAlgunos vampiros preocupados y otras criaturas señaladas ya están considerando el exilio como una alternativa preferible a este peligro, razonando que Baybars sigue siendo un mortal, y el tiempo acabará alcanzándole tarde o temprano."
 podregionalevents.2.a: "Hora de visitar nuevas tierras..."
 podregionalevents.2.custom: "Liquidas tus activos y huyes de Egipto.\nSeguirás siendo informado del paradero de Baybars pero no serás un objetivo directo suyo en el futuro."
 podregionalevents.2.b: "¡Mortal engreído!"
 podregionalevents.2.customb: "Te quedas en Egipto, arriesgándote a la plena ira de Baybars en el futuro pero también abriendo potencialmente nuevas oportunidades en el caos."
 
 baybars_purge_medium_modifier: "Purga de Baybars: Fuegos"
 baybars_purge_medium_modifier_desc: "Lo sobrenatural está siendo cazado aquí, los mamelucos de Baybars matan y queman con una eficiencia despiadadamente precisa."
  
 podregionalevents.3.t: "Purga de Baybars: Idolatría"
 podregionalevents.3.desc: "La mayor parte de lo sobrenatural en Egipto proviene de una época antigua en la que se veneraba a múltiples dioses en esta tierra. Para Baybars y sus mamelucos fanáticos, no son más que idólatras que adoran a deidades paganas o incluso a entidades más oscuras. A medida que aumenta sus esfuerzos por erradicar a cualquier ser sobrenatural en su sultanato, Baybars se dirige ahora especialmente a los santuarios \"paganos\" y otras viejas reliquias de una era pasada.\nTan eficientes como siempre, sus tácticas están demostrando ser muy efectivas para destruir incontables artefactos y preciados símbolos del antiguo Egipto en manos de lo sobrenatural.\nSi no son atrapados en los propios fuegos, parece que los vampiros egipcios y otras criaturas tendrán poco con lo que recordar su fe en el futuro."
 podregionalevents.3.a: "¡Debo proteger esas reliquias!"
 podregionalevents.3.effect.success.desc: "¡Artefactos salvaguardados!"
 podregionalevents.3.critical.failure.effect.desc: "Tanto conocimiento perdido..."
 podregionalevents.3.b: "Esto es demasiado, hora de huir."
 podregionalevents.3.c: "Qué tragedia..."
 podregionalevents.3.custom: "Como exiliado, solo se te informa de estos eventos."
  
 podregionalevents.4.t: "Purga de Baybars: Activos en llamas"
 podregionalevents.4.desc: "Baybars y sus mamelucos siguen campando a sus anchas en Egipto e incluso aumentando su empeño por erradicar lo sobrenatural. Los esfuerzos para contrarrestarlos han sido en gran medida infructuosos, principalmente debido a los misteriosos mecenas de Baybars. Estas figuras esquivas utilizan tácticas más sutiles que el sultán y están interesadas sobre todo en destruir cualquier apoyo que sus enemigos pudieran haber preparado en Egipto. Como tal, muchos vampiros e incluso otras criaturas han visto cómo sus bases de poder, a menudo forjadas durante décadas, eran repentinamente atacadas por los agentes más sombríos de Baybars.\nAquellos que intentaron resistir por la fuerza de las armas pronto se encontraron en las piras, por lo que la única solución, además del exilio, parece ser cubrir los activos existentes bajo capas de engaño aún más densas de lo habitual. No es una hazaña fácil contra esos enemigos que parecen muy capaces de descubrir la influencia sobrenatural."
 podregionalevents.4.a: "¡No tendrán mi oro!"
 podregionalevents.4.effect.success.desc: "¡Tesoro salvaguardado!"
 podregionalevents.4.critical.failure.effect.desc: "Mi tesoro..."
 
 baybars_purge_high_modifier: "Purga de Baybars: Infierno"
 baybars_purge_high_modifier_desc: "Lo sobrenatural está siendo cazado aquí, los mamelucos de Baybars quieren matar hasta al último de ellos. Y están preocupantemente cerca de lograrlo."
 
 baybars_purge_scorched_modifier: "Purga de Baybars: Tierra quemada" 
 baybars_purge_scorched_modifier_desc: "Aquí no queda nada más que los lamentos de desesperación de aquellos atrapados en el fuego cruzado entre Baybars y lo sobrenatural."
 
 podregionalevents.5.t: "Purga de Baybars: Tierra quemada"
 podregionalevents.5.desc: "Baybars está intensificando una vez más su campaña de destrucción contra lo sobrenatural. Esta vez, ha optado por utilizar las tácticas que le ayudaron a ganar contra los cruzados: tierra quemada. Después de todo, si no hay comunidades en las que sus enemigos puedan esconderse, serían mucho más fáciles de encontrar.\nSus mamelucos están ahora arrasando el país, buscando cualquier rumor sobre la presencia de un vampiro como excusa para quemar y destruir. Aunque ciertamente despiadada, es difícil negar la efectividad de esta estrategia a medida que más y más seres sobrenaturales se ven obligados a salir al campo para proteger a su ganado, culto o incluso familias. Algunos, sin embargo, simplemente han elegido unirse a otros en el exilio."
 podregionalevents.5.a: "¡Debo resistir!"
 podregionalevents.5.effect.success.desc: "¡Son rechazados!"
 podregionalevents.5.critical.failure.effect.desc: "Tanta muerte y destrucción..."
 
 podregionalevents.6.t: "Purga de Baybars: Mamelucos por todas partes"
 podregionalevents.6.desc: "Baybars está intensificando una vez más su campaña de destrucción contra lo sobrenatural. Ahora parece haber mamelucos por todas partes, apoyados por el misterioso culto que ayuda al sultán desde el principio, y son implacables al eliminar cualquier cosa (o persona) tangencialmente relacionada con los $POD_splat_vampire_plural$, los $glossary_fera$ y otras criaturas. Nadie sabe cómo se las arreglan para estar aparentemente siempre en el lugar adecuado en el momento adecuado, pero ciertamente les está dando resultados.\nA medida que la red se cierra sobre los pocos valientes que eligen permanecer en Egipto, se ven obligados a tomar medidas cada vez más extremas. Abundan las historias de criaturas antaño poderosas reducidas a esconderse en la arena del desierto, esperando un respiro de la implacable persecución de Baybars."
 podregionalevents.6.a: "Debo esconderme bien..."
 podregionalevents.6.effect.success.desc: "¡No me encontraron!"
 podregionalevents.6.critical.failure.effect.desc: "Huyendo por mi vida..."
 
 podregionalevents.7.t: "Purga de Baybars: Asalto a Ombos"
 podregionalevents.7.desc: "A pesar de los mejores esfuerzos de los Setitas restantes en Egipto, Baybars finalmente encontró el premio más grande de todos: el templo de Ombos. Según las leyendas, este fue el primer templo creado por el propio Set y albergó el cuerpo en letargo del poderoso vampiro durante mucho tiempo. Desde entonces, ha servido como la capital principal de los Seguidores de Set y nunca había estado en peligro... hasta ahora.\nRespaldado por sus veteranos mamelucos y la orden de misteriosos cazadores que le ayudan, Baybars está ahora asediando la antigua fortaleza, decidido a poner fin al sombrío gobierno de los antiguos vampiros sobrenaturales sobre los fieles egipcios de hoy. Las defensas de Ombos son poderosas, pero cuentan con poco personal debido a la huida de muchos de sus defensores durante las primeras noches de la purga. El resultado de la batalla es aún incierto, pero parece estar a favor del sultán."
 podregionalevents.7.a: "¡Debemos defender el templo!"
 podregionalevents.7.effect.success.desc: "¡Son rechazados!"
 podregionalevents.7.critical.failure.effect.desc: "No puede ser..."
   
 baybars_ombos_temple_tt: "El Templo de Ombos, una maravilla en la provincia del mismo nombre, podría ser destruido por el ataque de Baybars."
 podregionalevents.9.a: "¡Que alguien detenga a este mortal!"
 
 podregionalevents.8.t: "Purga de Baybars: Asalto a la Corte de Fuego"
 podregionalevents.8.desc: "A pesar de los mejores esfuerzos de los Setitas restantes en Egipto, Baybars finalmente encontró uno de los premios más grandes de todos: la Corte de Fuego. Un bastión de la ortodoxia setita, la Corte de Fuego es el segundo templo más poderoso (después de la propia Ombos) del clan, y ha servido como repositorio de conocimiento oculto y métodos de enseñanza durante milenios. Nunca había estado en peligro... hasta ahora.\nRespaldado por sus veteranos mamelucos y la orden de misteriosos cazadores que le ayudan, Baybars está ahora asediando la antigua fortaleza, decidido a poner fin al sombrío gobierno de los antiguos vampiros sobrenaturales sobre los fieles egipcios de hoy. Las defensas de la Corte son poderosas, pero cuentan con poco personal debido a la huida de muchos de sus defensores durante las primeras noches de la purga. El resultado de la batalla es aún incierto, pero parece estar a favor del sultán."
 
 baybars_fire_court_tt: "La Corte de Fuego, una maravilla en la provincia de Al-Bahriya, podría ser destruida por el ataque de Baybars."
  
 podregionalevents.15.t: "Purga de Baybars: Solo un hombre mortal"
 podregionalevents.15.desc: "Al final, los hombres mortales siguen siendo hombres mortales. A pesar de todo el terror que infligió a lo sobrenatural egipcio, Baybars murió de forma bastante tranquila. Algunos dicen que a manos de un asesino Banu Haqim, pero otros simplemente hablan de una herida infectada o incluso de una enfermedad común. Con su fallecimiento, el impulso tras su purga se ha extinguido por completo y sus sombríos aliados se han retirado a donde vinieron. Tanto los príncipes exiliados como los jefes de guerra $glossary_fera$ suspiran aliviados y regresan a sus ciudades, y Egipto parece una vez más seguro para los habitantes de su yo sombrío.\nAlgunos se preguntan abiertamente qué habría pasado si los esfuerzos de Baybars hubieran sido seguidos por más gobernantes, y el miedo a lo que los mortales pueden lograr realmente permanecerá bien presente en la mente de muchos vampiros egipcios durante mucho tiempo."
 podregionalevents.15.a: "El tiempo es nuestra mejor arma."
  
 podregionalevents.12.t: "Purga de Baybars: ¿No perseguir?"
 podregionalevents.12.desc: "Eres una de las pocas almas valientes que ha elegido quedarse en Egipto a pesar del desenfreno de Baybars contra los de tu clase. Fue un movimiento peligroso, pero esto también ha abierto algunas oportunidades. Has logrado reunir algo de inteligencia sobre el paradero del sultán y sus benefactores, los Nur al-Allah (la Luz de Dios).\nCon un poco más de reconocimiento, podrías intentar enfrentarte al hombre en persona. Hacer tal cosa sería extremadamente peligroso, obviamente, ya que básicamente estarías solo contra la guardia personal del mameluco y sus acólitos hechiceros. Pero la perspectiva de poner a este hombre impresionante de rodillas ante lo que tanto odia tiene bastante atractivo..."
 podregionalevents.12.a: "Le encontraré..."
 baybars_pursuit_tt: "#R Esta es, obviamente, una elección muy peligrosa. Has sido advertido.#!"  
 podregionalevents.12.effect.success.desc: "Aquí estás..."
 podregionalevents.12.critical.failure.effect.desc: "¡Abortar la misión!"
 podregionalevents.12.b: "Demasiado peligroso." 
  
 nick_father_conquests: "Padre de las Conquistas"
 
 podregionalevents.13.t: "Purga de Baybars: El hombre en persona"
 podregionalevents.13.desc: "Tras usar todas las herramientas e influencia a tu disposición, finalmente has llegado al hombre en persona: Baybars. Has logrado penetrar en su palacio y crear una distracción para igualar las probabilidades, pero puede que el sultán no sea la amenaza más apremiante. Aunque ciertamente es un luchador consumado, Baybars es solo un mortal, lo que no puede decirse de sus sombríos mecenas de los Nur al-Allah.\nAunque muchos de ellos están distraídos u ocupados en otros lugares, incluso el pequeño número de los que quedan protegiendo al mameluco demuestran ser una defensa mortal. En esta etapa, sin embargo, ya no es posible dar marcha atrás, no te dejarán escapar con vida.\nEsto no será fácil."
 podregionalevents.13.a: "¡Tu purga termina aquí!"
 podregionalevents.13.effect.success.desc: "¡Victorioso!"
 podregionalevents.13.critical.failure.effect.desc: "Uno más purgado..."
 
 podregionalevents.20.t: "La guerra por Livonia"
 podregionalevents.20.desc: "Lord Jürgen, dos problemas importantes torturan su mente en este momento. Primero, los Salvajes de Livonia han aplastado recientemente a un contingente de Caballeros de la Cruz Negra enviados para convertirlos, y las últimas posesiones de los caballeros en Prusia están bajo mucha presión. Segundo, Alejandro de París, el señor exiliado de Francia, es una espina constante en su costado y sus demandas de apoyo para reclamar su trono son cada vez más apremiantes noche tras noche. Por suerte, la astuta Lady Rosamunda ha ofrecido una solución potencial para ambos en una reciente sesión de la corte.\nEl plan es sencillo. Enviar a Alejandro a dirigir a los Caballeros de la Cruz Negra restantes y aplastar Livonia. ¿Si gana? Habrá sometido a los paganos y Alejandro tendrá su apoyo para marchar sobre París. ¿Si pierde? Bueno, al menos se lo habrá quitado de encima (a usted y a Lady Rosamunda). Un beneficio mutuo, verdaderamente."
 podregionalevents.20.a: "Lord Alejandro, tengo una oferta..."
 podregionalevents.20.b: "Puedo encargarme de Alejandro y Qarakh yo mismo."
 podregionalevents.20.tt: "Si Alejandro acepta, partirá hacia Prusia y usted recuperará sus posesiones."
 
 podregionalevents.16.desc: "Lord Alejandro, su reacio anfitrión, Jürgen von Verden, le ha ofrecido recientemente una misión intrigante. Usted tomaría el mando de los Caballeros de la Cruz Negra restantes en Prusia, recibiría refuerzos de Alemania y luego marcharía sobre los Salvajes de Livonia. Esos bárbaros Gangrel han propinado recientemente una paliza aplastante a los caballeros, de ahí la situación actual.\nEsto podría ser un sólido primer paso hacia su regreso triunfal a París, con caballeros alemanes curtidos en batalla a su mando y el prestigio de una victoria gloriosa también para usted. Incluso la bella Lady Rosamunda le anima a proseguir esta noble búsqueda para ser digno de su amor eterno."
 podregionalevents.16.a: "Un buen primer paso hacia mi regreso."
 podregionalevents.16.b: "Tengo otros planes."
 podregionalevents.16.tt: "Se hará cargo de las posesiones restantes de los Caballeros de la Cruz Negra en Prusia y devolverá Mersenburg a Jürgen."
 
 podregionalevents.17.desc: "Lord Alejandro, ha llegado a Prusia y ha hecho su trabajo de campo sobre sus nuevos vecinos. Este Qarakh parece impresionante (para ser un Gangrel salvaje) y debe admitir un pequeño ápice de respeto por la destreza que muestra su tribu. Esto le ha hecho preguntarse si no sería posible un curso de acción alternativo. Podría extender una oferta de alianza a este hombre, usando a sus guerreros para su beneficio y consolidando su posición aquí. Obviamente, esto significaría renunciar a los refuerzos prometidos por Jürgen y no hay seguridad de que el Gangrel acepte de todos modos. Podría ser más seguro simplemente seguir el plan inicial, aplastar a los Salvajes y luego usar la ayuda de los alemanes para volver a París."
 podregionalevents.17.a: "Simplemente acabemos con estos bárbaros."
 podregionalevents.17.b: "Enviar a pedir una reunión con el cacique."
 podregionalevents.17.tt: "Si Qarakh acepta, se aliará con él pero no obtendrá tropas adicionales de la Cruz Negra. Si Qarakh se niega, irá a la guerra pero con menos refuerzos a medida que Jürgen se entere de su complot."
 
 podregionalevents.18.desc: "Cacique Qarakh, acaba de recibir noticias de que los Caballeros de la Cruz Negra han lanzado una vez más un ataque contra sus aldeas periféricas. Aunque aplastó su primer intento hace una década, no se hacía ilusiones de que esto fuera el fin. Deverra le advirtió que el líder de esta expedición específica, Alejandro, no es un mero teniente alemán. Es el poderoso Príncipe exiliado de París, con una edad y poderes que superan con creces los suyos.\nCon un enemigo tan temible a su cabeza y un número mucho mayor de caballeros esta vez, su tribu podría verse abrumada. Aun así, no es un cobarde y si se necesita la guerra para proteger a su pueblo, entonces guerra es lo que le dará a este arrogante Ventrue."
 podregionalevents.18.a: "Estábamos preparados para esto."
  
 podregionalevents.19.desc: "Cacique Qarakh, como era de esperar, los Caballeros de la Cruz Negra han vuelto. Gracias a la advertencia de Deverra, estaba preparado para esta eventualidad y está listo para la guerra. Sin embargo, no estaba preparado para que su nuevo líder le tendiera una mano de amistad.\nAl parecer, este Alejandro de París es un Príncipe exiliado con poco amor por los cristianos alemanes. Sus ojos están centrados en la reconquista de su trono francés y ofrece una alianza con su tribu. Usted aceptaría ayudarle a reconquistar Francia cuando llegue el momento. Por su parte, él detendría los ataques de los Caballeros de la Cruz Negra a sus tierras mientras esté en el poder, asegurando a su tribu para el futuro previsible. Sabe que probablemente pretenda usar a su gente como carne de cañón para sus guerras, pero nadie dijo que la alianza fuera eterna... Este respiro temporal podría ser exactamente lo que necesita."
 podregionalevents.19.a: "No. Luchamos."
 podregionalevents.19.b: "Aceptamos."
 podregionalevents.19.a.desc: "¡Eligió la guerra!"
 
 alexander_livonia_decision: "La guerra por Livonia"
 alexander_livonia_decision_tooltip: "¿De vuelta a Francia?"
 alexander_livonia_decision_desc: "Una vez que hayas hecho el trabajo sucio de Jürgen y aplastado a los paganos, será el momento de obligar al alemán a cumplir su promesa de ayudarte a volver a Francia."
 alexander_livonia_decision_confirm: "De vuelta a los asuntos serios."
 alexander_livonia_decision_effect_tooltip: "Tendrás un evento para elegir si volver a Francia o traicionar a Jürgen y quedarte en Livonia."
 
 podregionalevents.21.desc: "Aunque aplastar a los paganos de Livonia fue una distracción agradable (es la primera vez que has tenido que levantar tu espada en siglos, después de todo), no fue más que un peldaño hacia tu verdadero objetivo. Estas tierras son una sombra lamentable de tu amada París y tu sangre hierve ante la idea de hacer pagar a los traidores Salianna y Geoffrey.\nSegún las estipulaciones de tu trato con Jürgen von Verden, tendrás que renunciar al control sobre Livonia (y Prusia, que te fue prestada para esta guerra) y la Cruz Negra te entregará a cambio su posesión de Vaucouleurs y un ejército considerable para comenzar tu regreso triunfal a la Gran Corte."
 podregionalevents.21.a: "No me traiciones, alemán."
 podregionalevents.21.b: "Esta tierra me está empezando a gustar..."
 podregionalevents.21.effect.success.desc: "¡Alejandro cumplió su palabra!"
 jurgen_gets_livonia_tt: "¡Alejandro entrega el control de Livonia!"
 podregionalevents.21.effect.failure.desc: "¡Alejandro te traiciona!"
 jurgen_dont_get_livonia_tt: "Alejandro se queda en Livonia"
 
 podregionalevents.22.desc: "Con tu nueva alianza asegurada, es hora de mirar hacia Francia una vez más. A pesar de los mejores esfuerzos de Salianna y Geoffrey por expulsar a tus leales restantes, todavía hay algunos que son fieles al que fue y será el señor de Francia. El más prominente entre ellos es Francois d'Alencourt, el Príncipe de Lyon. Aunque no es especialmente amigo tuyo, es leal hasta la médula y, por tanto, le desagradó el engañoso golpe perpetrado contra ti. Debería ser fácil convencerle de que hinque la rodilla y ayude a tu regreso triunfal.\nTambién está el pequeño asunto de que traicionaste a Jürgen von Verden al aliarte con Qarakh y quedarte con Prusia para ti. Pero, francamente, ¿a quién le importa lo que piense un humilde Príncipe alemán? Debería haber saltado ante la ocasión de ayudarte cuando honraste su corte con tu presencia por primera vez, no haberte hecho pasar por estos molestos aros."
 podregionalevents.22.a: "Primero Lyon, luego París."
 jurgen_dont_get_livonia_worse_tt: "¡Se alió con Qarakh!" 
 
 qarakh_livonia_decision: "La guerra por Livonia"
 qarakh_livonia_decision_tooltip: "Hora de arreglar las cosas."
 qarakh_livonia_decision_desc: "Con la segunda invasión de la Cruz Negra resuelta, es hora de obligar a los cruzados a sentarse a la mesa de paz. Bajo tus términos."
 qarakh_livonia_decision_confirm: "Ganamos."
 qarakh_livonia_decision_effect_tooltip: "Forzarás una tregua con Jürgen von Verden y los Feudos de la Cruz Negra. Te harán una oferta para recuperar Malbork, su principal fortaleza prusiana."
 
 podregionalevents.23.desc: "Cacique Qarakh, por segunda vez, los ejércitos de la Cruz Negra son aplastados bajo el poder de su tribu. Ni siquiera el liderazgo del poderoso Alejandro fue suficiente para quebrar su espíritu. A pesar de las celebraciones que tienen lugar en Livonia, usted es muy consciente de que los alemanes siguen siendo una amenaza. Por eso se sorprendió al oír que Jürgen von Verden pedía una negociación de paz.\nEl hombre (mucho más aceptable que Alejandro, debe admitirlo) no parece tan afectado por la última derrota. En todo caso, tiene la impresión de que está acogiendo con agrado su victoria por alguna razón desconocida. Acepta un tratado de paz de 20 años entre Livonia y la Cruz Negra sin mucha persuasión. Sin embargo, le gustaría que Malbork fuera devuelta a su orden y está preparado para hacer concesiones para que así sea."
 podregionalevents.23.a: "Aceptamos su tributo."
 podregionalevents.23.b: "No. Vuelva a Alemania."
 podregionalevents.23.effect.failure.desc: "Alejandro perdió la guerra"
 jurgen_dont_get_malbork_tt: "Al menos, se lo ha quitado de encima." 
 jurgen_get_malbork_tt: "Qarakh le devolvió Malbork a cambio de una paz más larga." 
