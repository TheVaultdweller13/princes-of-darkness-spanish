l_spanish:
 
  pod_lasombraevents.1.n: "Viendo rostros"
  pod_lasombraevents.1.desc: "Rostros. La última semana has sido agudamente consciente de ellos. Ya sean mortales, vampiros o un montón de rocas dispuestas de la forma adecuada, todo tiene un rostro. Incluyéndote a ti, por supuesto. Excepto que, como todos los de nuestro $pod_clan$, estás maldito a no volver a ver tu rostro ni tu cuerpo nunca más. ¿Cuánto tiempo ha pasado desde la última vez que viste tu propio reflejo? ¿Lo has visto alguna vez, de todos modos? Fuiste un mortal hace tanto tiempo... ¿Cómo reacciona la gente cuando te ve por primera vez? ¿Se asustan, se quedan embelesados o se ríen a tus espaldas?\nEstas preguntas están teniendo demasiado efecto en ti y es hora de hacer algo al respecto. La forma más directa es contratar a un artista y hacer que dibuje tu retrato. Al menos, podría aliviar el dolor."
  pod_lasombraevents.1.loverdesc: "Rostros. Los últimos días has sido agudamente consciente de ellos. Ya sean mortales, vampiros o un montón de rocas dispuestas de la forma adecuada, todo tiene un rostro. Incluyéndote a ti, por supuesto. Excepto que, como todos los de nuestro $pod_clan$, estás maldito a no volver a ver tu rostro ni tu cuerpo nunca más. ¿Cuánto tiempo ha pasado desde la última vez que viste tu propio reflejo? ¿Lo has visto alguna vez, de todos modos? Fuiste un mortal hace tanto tiempo... ¿Cómo reacciona la gente cuando te ve por primera vez? ¿Se asustan, se quedan embelesados o se ríen a tus espaldas?\nEstas preguntas están teniendo demasiado efecto en ti y es hora de hacer algo al respecto. La forma más directa es contratar a un artista y hacer que dibuje tu retrato. También podrías pedirle a tu amante, [helper.GetTitledFirstName], que te haga una buena descripción, ¿quién sabe?"
  pod_lasombraevents.1.a: "Necesito un retrato..."
  pod_lasombraevents.1.b: "No tengo necesidad de ello."
  pod_lasombraevents.1.c: "¡Pff! ¡No necesito esto!"
  pod_lasombraevents.1.d: "Pediré ayuda."
  pod_lasombraevents.1.a.t: "Contratas a un artista para que haga tu retrato."
  pod_lasombraevents.1.b.t: "Tienes cosas más urgentes en las que gastar el dinero."
  pod_lasombraevents.1.b.beast: "#beast No necesitas nada. Me tienes a mí.#!"
  pod_lasombraevents.1.c.t: "Siempre te ves bien."
  pod_lasombraevents.1.d.t: "Y recibes ayuda."
  
  POD_courts_blood_interaction: "Petición de diablerie autorizada"
  POD_courts_blood_interaction_desc: "Presenta una petición a las Cortes de Sangre, exponiendo un caso sobre por qué este personaje debería ser retirado de la protección de los Lasombra y cazado por su propia alma."
  courts_blood_tooltip: "Si ganas el caso, este personaje ya no costará piedad para ser diabolizado. Si no lo ganas, probablemente te habrás ganado un rival para la no-vida."
  
  POD_asdiqa_al_lail_interaction: "Petición de diablerie autorizada"
  POD_asdiqa_al_lail_interaction_desc: "Presenta una petición a los Asdiqa al-Lail, exponiendo un caso sobre por qué este personaje debería ser retirado de la protección de los Lasombra y cazado por su propia alma."
   
  POD_amis_noirs_interaction: "Petición de diablerie autorizada"
 
  pod_lasombraevents.2.n: "¿Un nuevo caso?"
  pod_lasombraevents.2.desc: "Las Cortes de Sangre son el cuerpo judicial del $pod_clan$ Lasombra. A estos Antiguos, que permanecen en el anonimato, se les puede presentar peticiones para que juzguen diversos asuntos relacionados con el clan en su conjunto. Sin embargo, el tiempo de estos Antiguos es precioso, por lo que las Cortes de Sangre suelen convocarse solo para los casos más graves: la $pod_diablerie$ autorizada.\nEl clan Lasombra valora el ansia de poder por encima de todo, y se enorgullece de asegurarse de que cada uno de sus vástagos sea digno. Como tal, cualquier Lasombra puede presentar una petición a las Cortes para alegar que otro Lasombra es indigno incluso de estar vivo, y que su sangre serviría mejor para fortalecer a otro.\nNo es de extrañar que tales casos sean a menudo el inicio de rivalidades legendarias, y siempre son objeto de acalorados debates."
  pod_lasombraevents.2.a: "Proceder con el caso."
  pod_lasombraevents.2.b: "Pensándolo mejor..."
 
  pod_lasombraevents.3.n: "Sesión de apertura"
  pod_lasombraevents.3.desc: "Una sesión de las Cortes de Sangre es un asunto extraño. Envueltos en la oscuridad, los jueces no son visibles y sus voces también están enmascaradas, lo que le da a todo el asunto un aire muy surrealista. Aun así, lo que está en juego es mucho más importante de lo que la teatralidad podría hacer pensar.\nTú y el defensor habéis sido convocados a la Corte y ahora es el momento de que ambos convenzáis a los Antiguos de vuestra respectiva valía. Sabes que, al final, a las Cortes no les importa realmente la verdad del asunto. Simplemente quieren asegurarse de que la sangre de Lasombra solo se entregue a los dignos, por lo que el objetivo final de este proceso es demostrar que eres un individuo más ambicioso, despiadado y merecedor que tu oponente."
  pod_lasombraevents.3.a: "Estimados jueces..."
  pod_lasombraevents.3.effect.success.desc: "Eres convincente."
  pod_lasombraevents.3.critical.failure.effect.desc: "No convenciste."
  
  pod_lasombraevents.4.n: "Engrasando los engranajes"
  pod_lasombraevents.4.desc: "Mientras que los jueces de la Corte de Sangre permanecen en el anonimato, los Amici Noctis, la organización de Antiguos que gobierna el clan Lasombra, no lo son. Es relativamente fácil encontrar a uno de sus representantes en cada ciudad importante, aunque solo sea para iniciar una petición oficial.\nEstos intermediarios rara vez son dechados de virtud y pueden ser sobornados fácilmente para asegurarse de que alguna prueba aparezca de repente ante los jueces (o nunca lo haga en algunos casos). Esto es un secreto a voces, y se espera que los Lasombra astutos tengan los medios para llevar a cabo tales \"negocios\". Después de todo, la riqueza es una forma de medir tu valía."
  pod_lasombraevents.4.a: "Una donación sensata."
  pod_lasombraevents.4.b: "No necesito eso para ganar."
  won_round_court_blood_tt: "El caso de las Cortes de Sangre progresa a tu favor."
  
  pod_lasombraevents.5.n: "Justicia callejera"
  pod_lasombraevents.5.desc: "Todo vale en la guerra y en la justicia en el $pod_clan$ Lasombra. Estás intentando acabar con la no-vida de un compañero Lasombra y ellos están intentando todos los trucos posibles para sobrevivir y atraer a la Corte a su favor. Contratar a un grupo de matones locales para que te den una paliza entre los recesos de la Corte es su último esfuerzo desesperado.\nEste es un intento desesperado y no corres un peligro real. Pero la facilidad con la que seas capaz de despachar a esas pestes se reflejará en el juicio general. Después de todo, se supone que los Lasombra están muy por encima de tales preocupaciones insignificantes y son capaces de mostrar fácilmente su superioridad sobre los mortales."
  pod_lasombraevents.5.a: "Apuntaste al Lasombra equivocado."
  pod_lasombraevents.5.effect.success.desc: "¡Perfecto!"
  pod_lasombraevents.5.critical.failure.effect.desc: "Victoria pírrica."
   
  pod_lasombraevents.6.n: "Muestra de piedad"
  pod_lasombraevents.6.desc: "El clan Lasombra valora la convicción. En muchos sentidos, son un clan de fe, aferrándose a cualquier nueva innovación mortal en este campo para crear su propia versión retorcida de ellas. Al final de la noche, no importa qué tipo de fe sigas, siempre que hagas una demostración suficiente de hacerlo de forma convincente.\nPara atraer a los jueces y demostrar que eres un digno vástago de los Lasombra, una muestra de piedad podría ser una buena elección."
  pod_lasombraevents.6.a: "Puedo hacer que ocurran milagros."
   
  pod_lasombraevents.7.n: "Mostrando fuerza"
  pod_lasombraevents.7.desc: "Los Lasombra son trepadores sociales hasta el extremo. La cultura de su clan obliga a sus miembros a intentar siempre superarse unos a otros en todos los campos posibles. A menudo, esto lleva a que solo los Lasombra más despiadados y competentes sean capaces de liderar, pero a veces, da como resultado que necios pomposos con mucha influencia sean elevados muy por encima de su habilidad.\nDurante esta sesión de la Corte, podría valer la pena que te involucres en algo de política, alardeando de tus logros y menospreciando los de tu oponente."
  pod_lasombraevents.7.a: "¿Sabíais que yo...?"
    
  pod_lasombraevents.8.n: "Solo nosotros dos"
  pod_lasombraevents.8.desc: "Tu oponente durante esta sesión de la Corte de Sangre ha adoptado una postura agresiva. En lugar de intentar defenderse de tus acusaciones, está atacando tus logros y calumniando tu carácter, sin duda impecable. Esta es una estrategia bastante válida, ya que los Antiguos de la Corte valoran la fuerza del Clan por encima de todo y si se convencen de que eres de menor estatura que tu víctima, la mayor parte de tu caso se desmoronará.\nEs hora de que respondas a estas acusaciones y vuelvas a poner a los jueces a tu favor."
  pod_lasombraevents.8.a: "¡No tengo debilidades!"
  pod_lasombraevents.8.effect.success.desc: "Soy verdaderamente grande."
  pod_lasombraevents.8.critical.failure.effect.desc: "Cometí algunos errores."
   
  pod_lasombraevents.10.n: "¡Objeción!"
  pod_lasombraevents.10.desc: "La Corte de Sangre ha dado su veredicto final y no es bueno para ti. Tu oponente ha sido considerado un Lasombra digno y tus acusaciones no fueron lo suficientemente convincentes como para atraer a los Antiguos. Esto se reflejará mal en ti, y ahora tienes un némesis probablemente duradero que no olvidará el juicio al que lo sometiste.\nLa justicia es verdaderamente ciega, o al menos no amigable contigo por el momento."
  pod_lasombraevents.10.a: "¡Claramente, sobornaron a los jueces!"
  
  sentenced_court_blood_modifier: "Sentenciado por la Corte de Sangre"
  sentenced_court_blood_modifier_desc: "Este Lasombra ha sido hallado culpable de ser indigno por la Corte de Sangre. Ahora es un objetivo legítimo para la diablerie en lo que respecta a su clan."
  
  pod_lasombraevents.11.n: "Juicio y éxito"
  pod_lasombraevents.11.desc: "La Corte de Sangre ha dado su veredicto final y es bueno para ti. Tu oponente ha sido hallado falto de méritos, indigno de la gran sangre de Lasombra, y tus acusaciones fueron lo suficientemente convincentes como para atraer a los Antiguos. Esto se reflejará bien en ti, y ahora tienes a un némesis acorralado que está oficialmente abierto para la \"reclamación de la sangre\".\nVerdaderamente se ha hecho justicia."
  pod_lasombraevents.11.a: "Amo nuestro sistema judicial."
  victory_court_blood_tt: "Tu oponente tendrá ahora un modificador negativo durante 30 años. Durante este tiempo, una $pod_diablerie$ sobre él no costará piedad y no será considerada un asesinato."
  end_lasombra_cw_tt: "La guerra civil Lasombra termina. La [character_interaction|E] de Petición de diablerie autorizada es ahora utilizable en todos los Lasombra, y no solo en tu bando de la guerra civil."
  
  pod_lasombraevents.12.n: "Funcionamiento interno del Clan de las Sombras"
  pod_lasombraevents.12.desc: "El clan Lasombra prospera gracias a un sistema de despiadado ascenso social, donde solo a los mejores se les permite formar parte de este augusto linaje. Los Amici Noctis son un cuerpo secreto de Antiguos que se encargan de asegurar que ningún indigno herede por mucho tiempo la sangre de Lasombra. Con ese fin, han formado las Cortes de Sangre, un cuerpo judicial que permite a cualquiera presentarles una petición para pedir permiso para realizar la temida $pod_diablerie$ sobre otro Lasombra que haya demostrado ser indigno.\nLa actual guerra civil Lasombra ha dividido las Cortes entre los [Glossary('Ashirra','game_concept_ashirra_desc')] y los leales, y cada bando ya no reconoce la autoridad del otro. \n #X Como Lasombra, puedes presentar una Petición de diablerie autorizada sobre cualquier otro Lasombra siempre que esté en tu bando de la guerra civil. Si la guerra civil terminara, las Cortes volverían a tener autoridad sobre todos los Lasombra.#!"
  pod_lasombraevents.12.a: "Dirigiré al clan Lasombra hacia su destino."
  pod_lasombraevents.12.b: "Quizás podría unirme a ellos..."
  member_amici_noctis_tt: "Tu personaje ya forma parte de los Amici Noctis, es posible que se te pida que tomes decisiones importantes respecto al clan en el futuro."
  not_member_amici_noctis_tt: "Tu personaje no forma parte de los Amici Noctis, es posible que se te pida que te unas más adelante dependiendo de su prestigio y poder."
   
  pod_lasombraevents.20.n: "Una oferta sombría"
  pod_lasombraevents.20.desc: "Recientemente se te ha acercado un individuo misterioso, que ha hecho extrañas indagaciones sobre ti... Lo que debería ser un acontecimiento preocupante es, en cambio, una fuente de anticipación para ti. De hecho, es sabido que los misteriosos Amici Noctis, la organización de Antiguos que dirige el clan Lasombra, inician su proceso de reclutamiento mediante tal método.\nYa conoces el resto. Si muestras interés, serás encerrado en una tumba durante un par de noches para que puedas \"comulgar con la oscuridad\" sin distracciones. Luego, serás presentado ante un grupo anónimo de Antiguos que te pedirán formalmente que te unas a los Amici Noctis.\nEn definitiva, esto no es más que una formalidad, aunque estresante; el verdadero proceso de selección ocurre antes del secuestro, así que, a menos que no quieras participar en esta tradición, ya estás prácticamente dentro."
  pod_lasombraevents.20.a: "Estoy listo para unirme a vosotros."
  pod_lasombraevents.20.b: "Esta organización decrépita no es para mí."
  join_amici_noctis_tt: "Unirse a los Amici Noctis podría ofrecerte nuevas oportunidades para fomentar la agenda del clan Lasombra."
  end_amici_noctis_tt: "Esta es una oferta única. Ya no podrás unirte a los Amici Noctis en el futuro."
    
  pod_lasombraevents.15.n: "¿Eres tú la ley?"
  pod_lasombraevents.15.desc: "Como miembro de los Amici Noctis, se espera que te sientes en las Cortes de Sangre de vez en cuando. Este no es un proceso peligroso, ya que los jueces siempre están envueltos en el anonimato para evitar represalias, pero puede ser tedioso.\nEl caso de esta noche es uno menor entre dos Lasombra sin importancia. Nadie te culparía si simplemente eligieras un veredicto al azar, pero los ideales del clan Lasombra podrían exigir que sigas prestando toda tu atención incluso al caso más aburrido."
  pod_lasombraevents.15.a: "La corte está en sesión."
  pod_lasombraevents.15.b: "La corte está en sesión..."
    
  pod_lasombraevents.16.n: "Malversación sombría"
  pod_lasombraevents.16.desc: "Aunque los Amici Noctis sean una organización sombría de poderosos Antiguos, sigue teniendo costes de funcionamiento. Sus múltiples agentes y representantes esperan una compensación por su trabajo, y asegurarse de que el viaje sea seguro para los jueces durante las Cortes de Sangre tampoco es barato. Como tal, agradecen las \"donaciones\" que a menudo hacen los jóvenes y ambiciosos Lasombra que quieren alardear de su riqueza ante todo el $pod_clan$.\nUna de esas donaciones ha llegado recientemente a tus manos y es hora de que la pongas en las arcas de los Amici... ¿o no?"
  pod_lasombraevents.16.a: "El Clan es lo primero."
  pod_lasombraevents.16.b: "¡Truco del oro que desaparece!"
     
  pod_lasombraevents.17.n: "Encontrando a los Amigos"
  pod_lasombraevents.17.desc: "Los Amici Noctis se ocultan en el anonimato. Desde su punto de vista, esta es una precaución necesaria para evitar ser blanco de los enemigos del clan, y poder juzgar los asuntos imparcialmente en las Cortes de Sangre.\nSin embargo, para los miembros más jóvenes del clan Lasombra, esto podría verse como una prueba de cobardía y debilidad, y muchos han intentado a lo largo de los años descubrir su identidad. Uno de esos grupos está haciendo progresos preocupantes recientemente y tienes que actuar. Castigar solo al perpetrador principal probablemente bastaría, pero descubrir a todos sus cómplices enviaría un mensaje mucho más poderoso."
  pod_lasombraevents.17.a: "Los castigaremos a todos."
  pod_lasombraevents.17.b: "Un solo culpable bastará."
  pod_lasombraevents.17.effect.success.desc: "Todos han sido encontrados."
  pod_lasombraevents.17.critical.failure.effect.desc: "Escaparon..."
    
  pod_lasombraevents.18.n: "Amigos de la Noche"
  pod_lasombraevents.18.desc: "Los Amici Noctis son conocidos como una poderosa organización que dirige al $pod_clan$ Lasombra hacia sus misteriosos objetivos. Pero además de esta importancia política, también son conocidos como maestros de la Obtenebración, el poder característico de los Lasombra. Incluso aquellos raros Amici Noctis que no son maestros de ella antes de su entrada en la sociedad aprenden rápidamente a dominarla, como se espera de su nueva posición."
  pod_lasombraevents.18.a: "Soy un maestro de las sombras, como debe ser."
  pod_lasombraevents.18.b: "Todavía debo aprender más sobre la Obtenebración."
  pod_lasombraevents.18.c: "Debo trabajar en aprenderla lo antes posible."
  
  pod_lasombraevents.19.n: "Atribuirse el mérito"
  pod_lasombraevents.19.desc: "Los Amici Noctis se encargan de muchas amenazas para el $pod_clan$ Lasombra, ya sean internas o externas. Una de esas amenazas surgió en tu zona y la organización se apresuró a mostrar su apoyo y ofrecerte los medios para lidiar con ella de forma decisiva.\nTu corte está alabando esta victoria perfecta y es hora de que reveles que los Amici Noctis fueron una ayuda importante en este asunto, para fomentar la unidad del clan... o simplemente puedes glorificarte a ti mismo y pasar por alto su participación."
  pod_lasombraevents.19.a: "Sí, soy bastante grande."
  pod_lasombraevents.19.b: "Tuve ayuda."
