l_spanish:

 podgiovanni.1.t: "La Familia sabe lo que conviene"
 podgiovanni.1.desc: "Aunque han ampliado enormemente su horizonte desde sus humildes comienzos como misteriosos nigromantes venecianos, los Giovanni siguen siendo, ante todo, una familia. Muchos dirían que esta sigue siendo su mayor fortaleza: poder contar en todo momento con una familia poderosa y bien conectada es un lujo con el que otros solo pueden soñar.\nDesde su entrada en el mundo de los vampiros, los Giovanni siguen vigilando de cerca a sus parientes mortales, preparándolos con cuidado para la grandeza antes de ofrecer el $pod_Embrace$ a los verdaderamente dignos. Unos pocos Giovanni, sin embargo, desdeñan esta práctica y escogen a sus posibles Chiquillos exclusivamente fuera de la familia, dejando a sus parientes mortales a su suerte.\nComo estimado Giovanni que eres, es hora de que des a conocer tu postura sobre esta tradición."
 podgiovanni.1.a: "Ya tengo el ojo puesto en algunos prospectos..."
 podgiovanni.1.b: "Una tradición respetable, pero no la necesito por el momento."
 podgiovanni.1.c: "Dejad a la familia en paz."
 start_giovanni_content_tt: "Se te presentarán varias opciones que perfilarán tu tipo preferido para un chiquillo Giovanni. Una vez que se encuentre un candidato apropiado, se te informará de ello."
 delayed_start_giovanni_content_tt: "Se te presentará esta opción de nuevo para la próxima generación de prospectos Giovanni mortales, en aproximadamente 20 a 40 años."
 end_giovanni_content_tt: "Nunca se te volverá a presentar esta posibilidad."
 pod_giovanni_name: "[optional_child.GetFirstNameNoTooltip] Giovanni" 
 
 podgiovanni.2.t: "Hijos e hijas de los Giovanni"
 podgiovanni.2.desc: "Aunque muy patriarcales desde sus primeros días como familia de mercaderes romanos, los Giovanni han aprendido rápidamente una verdad del vampirismo: las mujeres son fácilmente iguales a los hombres. Este repentino cambio de mentalidad ha sido una bendición para las hijas de la Familia, que se ven valoradas tanto como sus hermanos por el potencial que podrían aportar a los Giovanni. Algunos han llegado a priorizarlas sobre sus homólogos masculinos, viendo que muchas están muy ansiosas por demostrar que este nuevo aprecio está, de hecho, justificado. Otros tienen un poco más de dificultad para superar su anticuada mentalidad mortal, y gravitarán naturalmente hacia los jóvenes varones Giovanni en su lugar.\nAl final, sin embargo, no hay una elección incorrecta aquí."
 podgiovanni.2.a: "Hijos..."
 podgiovanni.2.b: "...o hijas."
 
 giovanni_content_risks_increase_tt: "Cuanto más pidas, más difícil y potencialmente costoso será asegurar a tu prospecto frente a otros competidores."
 
 podgiovanni.3.t: "Belleza familiar"
 podgiovanni.3.desc: "Su herencia romana ha dejado a los Giovanni bastante orgullosos de sus buenos genes. Considerándose primero como los únicos habitantes no contaminados por los bárbaros en la península tras la caída de Roma, y luego como la mezcla perfecta de la perfección romana clásica y la belleza italiana moderna, han valorado (y utilizado) continuamente lo que la naturaleza les ha dado. Aun así, a pesar de sus audaces afirmaciones, no hay pruebas reales de que la Familia esté más o menos bendecida en el departamento de la apariencia que otros y, como tal, los vástagos de la familia que realmente muestran tales figuras tan cacareadas son especialmente buscados para servir como ejemplos inmortales del estilo Giovanni."
 podgiovanni.3.a: "¡Solo servirá un Apolo renacido!"
 podgiovanni.3.b: "Puedo conformarme con la casi perfección."
 podgiovanni.3.c: "Unas curvas elegantes nunca hicieron daño a nadie."
 podgiovanni.3.d: "La belleza está sobrevalorada."
 
 podgiovanni.4.t: "Intelecto familiar"
 podgiovanni.4.desc: "Más que la fuerza bruta o la belleza, los Giovanni valoran el intelecto por encima de todo. Como mercaderes y nigromantes secretos en Italia desde hace siglos, enseguida comprendieron que los miembros demasiado lentos en aprender cuándo no hablar de la familia con extraños pueden ser un lastre realmente amenazante. Por ello, si no demuestras al menos un mínimo de astucia, pronto serás relegado a músculo de la familia o, peor, a las fronteras.\nEste es uno de los «requisitos ocultos» más conocidos entre la Familia mortal y los ambiciosos tratan enseguida de superarse unos a otros con grandes hazañas de comercio hábil o diplomacia astuta en tierras lejanas para llamar la atención de sus inmortales patronos."
 podgiovanni.4.a: "Quiero lo mejor de lo mejor."
 podgiovanni.4.b: "Habilidoso, pero no perfecto."
 podgiovanni.4.c: "Al menos lo bastante inteligente como para ser interesante."
 podgiovanni.4.d: "No se requiere un intelecto avanzado para este prospecto específico."
  
 podgiovanni.5.t: "Músculo familiar"
 podgiovanni.5.desc: "La Familia siempre ha necesitado músculo a lo largo de su historia, ya sea para proteger sus bienes duramente ganados o para «apoderarse» de los de algún rival. El conflicto con la familia Rossellini puso de relieve esta necesidad crítica muy pronto en la existencia de los Giovanni y se ha perpetuado desde entonces. Varios Antiguos ambiciosos han hecho propuestas sobre crear una especie de «subfamilia» que se ocupara solo de tales asuntos físicos, asegurando así que los verdaderos vástagos Giovanni pudieran seguir dedicándose a quehaceres más elevados, pero hasta ahora no ha dado resultados. Por ello, los hijos e hijas de la Familia fuertes y bien constituidos son estimados y buscados por quienes necesitan un poco de pegada que añadir a su cartera de capacidades."
 podgiovanni.5.a: "Solo servirá un cuerpo perfecto."
 podgiovanni.5.b: "Fuerte y resistente."
 podgiovanni.5.c: "Un físico sólido siempre es útil."
 podgiovanni.5.d: "Esto no es necesario."
   
 podgiovanni.6.t: "Comienza la búsqueda"
 podgiovanni.6.desc: "Has dado a conocer tu petición a la Familia y lo único que queda por hacer ahora es esperar. Los mortales viven y mueren con una rapidez divertida, como bien sabes, pero incluso ellos necesitan varias décadas antes de empezar a ser útiles. Si pediste a alguien muy específico, podría pasar mucho tiempo antes de que los Giovanni produzcan a tal individuo."
 podgiovanni.6.a: "El tiempo está de mi lado."
 giovanni_wait_time_tt: "Cuanto más hayas pedido, más tiempo pasará antes de que aparezca un candidato adecuado."
 
 podgiovanni.8.t: "¿Un candidato digno?"
 podgiovanni.8.desc: "Un vástago de la familia mortal Giovanni ha sido finalmente puesto en tu conocimiento para satisfacer tu petición actual. Has usado tu prestigio familiar acumulado para asegurarte de ser el primero en poder evaluar sus capacidades. Este está ansioso por servir, encantado de haber sido elegido como un candidato digno para el verdadero poder en los Giovanni pero, al final, lo que hagas con él depende de ti y solo de ti."
 podgiovanni.8.a: "No me decepciones."
 giovanni_content_end_tt: "Se te ha retirado algo de prestigio para «pagar» la influencia necesaria para asegurar a este candidato.\nLa opción de solicitar otro posible Chiquillo se te presentará dentro de varias décadas." 
 
 podgiovanni.9.t: "Disputas familiares"
 podgiovanni.9.desc: "Mientras vigilas a diversos posibles Giovanni mortales que podrían ajustarse a tu petición, por desgracia tienes que participar en asuntos familiares más de lo habitual. Esta no es la parte más atractiva de la vida Giovanni, pues las mezquinas preocupaciones sobre lo que algún tío abuelo le hizo a algún otro primo lejano nunca mueren aquí. Es, francamente, un aburrimiento, pero tienes que intentar al menos mantener el interés si quieres que la familia siga de tu lado y no sabotee tu futuro, como se sabe que ocurre con quienes «faltan» con demasiada frecuencia a las reuniones familiares."
 podgiovanni.9.a: "Poner una excusa."
 podgiovanni.9.b: "Iré..."
 podgiovanni.9.c: "¡Tengo asuntos mucho más importantes de los que ocuparme!"
 giovanni_head_tt: "Ser el cabeza de familia tiene sus ventajas."
 
 podgiovanni.10.t: "Destino familiar"
 podgiovanni.10.desc: "Un prometedor vástago de la familia ha captado tu atención y podría ser el destinado para ti. Sin embargo, aún es joven y, como tal, todavía es muy susceptible al fracaso en algún hito importante. No tienes ganas de esperar al siguiente candidato remotamente competente y ahora estás considerando allanar claramente el camino hacia la grandeza para esta joven persona.\nUsando tu influencia duramente ganada, podrías asegurarte de que asista a las mejores universidades italianas y tenga los mejores profesores privados que los Giovanni puedan pagar. Esto ciertamente debería ayudarle a alcanzar su potencial."
 podgiovanni.10.a: "Que así sea."
 podgiovanni.10.b: "Puede hacerlo por sí mismo."
 podgiovanni.10.c: "La Familia tiene muchos favores pendientes que pueden usarse para esto."
 giovanni_adopt_boosted_tt: "Tu candidato tendrá +3 en cada estadística al final de su juventud."
  
 podgiovanni.11.t: "Duelos familiares"
 podgiovanni.11.desc: "La esgrima y los duelos están de moda en las ciudades italianas últimamente. Aunque es principalmente una tradición noble, la línea entre la nobleza y los mercaderes a menudo se difumina en Italia y, como tal, muchos jóvenes Giovanni prueban con entusiasmo su destreza en este arte mortal. Uno de los jóvenes prometedores que supervisas es aficionado a este pasatiempo y ha demostrado ser bastante competente en él. Esto te ha llevado a reflexionar sobre si empujarle o no aún más por este camino, con profesores privados y demás. Al fin y al cabo, un esgrimista letal puede ser una fuerza a tener en cuenta también en la batalla, no solo en los salones elegantes."
 podgiovanni.11.a: "Que así sea."
 podgiovanni.11.b: "Esto no es necesario."
 podgiovanni.11.c: "La Familia tiene varios maestros duelistas a su disposición."
 giovanni_adopt_blademaster_tt: "Tu candidato tendrá el rasgo de maestro de armas al final de su juventud."
  
 podgiovanni.12.t: "Intrigas familiares"
 podgiovanni.12.desc: "Las ciudades-estado italianas han elevado la intriga al rango de arte, con algunas de las mayores obras artísticas de la época «celebrando» a los infames apuñaladores por la espalda y a los ambiciosos nobles y mercaderes de la península. La juventud Giovanni nace y se cría en este entorno, con la salvedad añadida de formar parte de una familia inmortal de Nigromantes que recompensa la crueldad hasta el extremo. Por ello, a los lentos y perezosos suelen eliminarlos antes incluso de que los inmortales reparen en ellos, aplastados por sus pares más ambiciosos. Aun así, la verdadera excelencia en el juego de capa y espada requiere formación y pericia, por lo que estás considerando preparar algunas «pruebas» para que tu posible protegido las resuelva, enseñándole, con suerte, algunas lecciones valiosas en el proceso."
 podgiovanni.12.a: "Que así sea."
 podgiovanni.12.b: "Esto no es necesario."
 podgiovanni.12.c: "La Familia puede ofrecer muchas pruebas «divertidas»."
 giovanni_adopt_schemer_tt: "Tu candidato tendrá el rasgo de intrigante al final de su juventud."
  
 podgiovanni.13.t: "Hechicería familiar"
 podgiovanni.13.desc: "Antes de renacer como vampiros, los Giovanni eran conocidos como competentes Nigromantes mortales. Aun así, nunca se consideraron «verdaderos magos», como afirman ser los Tremere, y se sentían más cómodos con lo que llaman «magia lineal», una forma muy codificada y estructurada de trabajo de la voluntad que les permitió aumentar lenta pero constantemente su maestría nigromántica a lo largo de las eras, pero sin ramificarse nunca de verdad hacia otras esferas mágicas de pericia.\nHasta esta noche, algunos jóvenes de la familia siguen naciendo con esta capacidad para la magia lineal y son muy apreciados por la familia en su conjunto. Estos pocos elegidos son, sin embargo, cada noche más raros, lo que al parecer empuja a la Familia a transitar por completo hacia la hechicería de sangre Nigromántica en algún momento de su existencia. Hasta entonces, no obstante, estos jóvenes Giovanni dotados son el mayor premio que buscan los futuros Sires."
 podgiovanni.13.a: "¡Necesito tal talento!"
 podgiovanni.13.b: "Esto no es necesario."
 podgiovanni.13.c: "La Familia no puede negármelo."
 giovanni_adopt_sorcerer_tt: "Tu candidato tendrá el rasgo de hechicero al final de su juventud."