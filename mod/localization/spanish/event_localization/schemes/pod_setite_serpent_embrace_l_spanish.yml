l_spanish:

 # SETITE — Serpent's Embrace: Success
 pod_setite_serpent_embrace.0001.t: "Las espirales de la Serpiente se tensan"
 pod_setite_serpent_embrace.0001.desc: "Está hecho.\n\nEl largo cortejo ha llegado por fin a su fin. [target.GetFirstNameNoTooltip] acudió a ti esta noche por [target.GetHerHis] propia voluntad, con los ojos huecos bajo el peso de cada certeza que desmontaste con paciencia, cada consuelo que envenenaste despacio, cada placer que mantuviste justo fuera de su alcance. [target.GetSheHe|U] se arrodilló, no ante ti, sino ante la verdad que habías susurrado a su alma noche tras noche: que el mundo lo había abandonado y que solo la sabiduría de Set podía dar sentido a su sufrimiento.\n\n[target.GetSheHe|U] pronuncia las palabras de la conversión con el fervor tembloroso de quien ha sido rehecho. La serpiente no ataca a su presa: espera, vigila y sabe que, con el tiempo, la presa se arrastrará de buen grado hasta su boca. Sientes la aprobación de Set como escamas frías sobre tu espalda, otra alma atraída a la larga y sinuosa oscuridad, otra lámpara apagada en el mundo de arriba. La noticia de esta conversión se extenderá, y otros que veían a [target.GetFirstNameNoTooltip] como firme empezarán a preguntarse cuán firmes son ellos mismos en realidad.\n\nEl Camino de Set se cobra otro más. El mundo de arriba se oscurece un poco y las espirales de la gran serpiente se ensanchan un poco más."
 pod_setite_serpent_embrace.0001.a: "Set recompensa a sus pacientes siervos."

 pod_setite_serpent_embrace.0002.t: "El susurro de la Serpiente"
 pod_setite_serpent_embrace.0002.desc: "Han pasado meses, quizá más, desde que [scheme_owner.GetFirstNameNoTooltip] se cruzó por primera vez en tu camino. En su momento no le diste importancia: un encuentro casual, un regalo de vino, un giro ingenioso de la conversación. Luego otro encuentro. Luego una carta. Luego una velada tranquila de filosofía y risas que te dejó, de algún modo, dudando de cosas que nunca habías cuestionado.\n\nEsta noche lo entiendes. Los sueños que te han hecho despertar con el nombre de Set en los labios. Los argumentos de tu antigua fe que de repente suenan huecos cuando intentas recitarlos. La extraña certeza, al cerrar los ojos, de que el mundo de arriba es una mentira de luz empapelada sobre una oscuridad más profunda y verdadera.\n\n[scheme_owner.GetFirstNameNoTooltip] está aquí de nuevo y por fin comprendes lo que [scheme_owner.GetSheHe] ha estado haciendo. Las espirales de la serpiente ya te rodean. No se trata de si serás convertido, sino de si lo aceptarás como iluminación o lucharás por librarte de una doctrina que ya ha reclamado la mitad de tu alma."
 pod_setite_serpent_embrace.0002.a: "La verdad de Set me ha encontrado. Recorreré de buen grado el camino oscuro."
 pod_setite_serpent_embrace.0002.b: "No me convertiré en una criatura de Set."