l_spanish:

 POD_murder_outcome.1001.t: "Viendo el Sol"
 POD_murder_outcome.1001.desc: "Matar vampiros es, en el fondo, bastante fácil. El sol lo hará sin falta cada vez. La parte difícil es asegurarse de que el objetivo esté fuera cuando los rayos de luz de Dios bendigan este mundo.\nPara esta ocasión, has elegido el método de 'demolición'. No hay necesidad de mover al vampiro durmiente si el propio techo es retirado durante la noche. Solo necesitas algunos hombres buenos capaces de crear una distracción en el [target.Custom('PODDomicile')] para que tu equipo de expertos pueda ponerse a trabajar.\n¿Qué podría salir mal?"
 POD_murder_outcome.1001.a: "Un clásico, de verdad"
 POD_murder_outcome.1001.b: "Ahora no es el momento"

 POD_murder_outcome.2001.t: "Viendo el Sol"
 POD_murder_outcome.2001.opening_1: "Matar vampiros es, en el fondo, bastante fácil. El sol lo hará sin falta cada vez. La parte difícil es asegurarse de que el objetivo esté fuera cuando los rayos de luz de Dios bendigan este mundo.\nPara esta ocasión, has elegido el método de 'demolición'. No hay necesidad de mover al vampiro durmiente si el propio techo es retirado durante la noche. Solo necesitas algunos hombres buenos capaces de crear una distracción en el [target.Custom('PODDomicile')] para que tu equipo de expertos pueda ponerse a trabajar.\n¿Qué podría salir mal?\n\n[target.GetTitledFirstName] debería agradecértelo, si pudiera, ya que muchos cainitas sueñan con volver a ver el Sol después de su $pod_Embrace$. Bueno, tal vez no al ser despertados por él gritando y retorciéndose, y probablemente preguntándose '¡¿dónde demonios está mi techo?!'. Pero bueno, nadie dijo que la no-vida fuera fácil."
 POD_murder_outcome.2001.owner_is_known_1: "\n\nDesafortunadamente, uno de tus agentes fue encontrado con un trozo de techo bastante comprometedor en sus manos antes de que pudiera abandonar el [target.Custom('PODDomicile')]. Rápidamente reveló tu implicación en todo el asunto."
 POD_murder_outcome.2001.no_awareness_1: "\n\nCon tus agentes lejos mucho antes de que el resto del [target.Custom('PODDomicile')] pudiera reaccionar, no hay nada que pueda incriminarte."
 POD_murder_outcome.2001.a.discovered: "Es hora de revisar mi propio techo."
 POD_murder_outcome.2001.a: "¡Alabado sea el Sol!"

 murder_outcome.5001.vampire_sun: "Me despierta el olor a carne quemada... mi propia carne. El sol todavía está alto en el cielo y, por alguna misteriosa razón, mi techo parece haber desaparecido. El resultado es rápido pero doloroso. No se debe jugar con la Maldición de Dios, y me apresuro a buscar refugio mientras me prendo fuego como una antorcha viviente.\nMi esfuerzo frenético es demasiado poco y demasiado tarde, y pronto me convierto en cenizas llameantes."
 murder_outcome.5001.a: "Un fin a la eternidad."   

 POD_murder_outcome.4001.t: "Viendo el Sol"
 POD_murder_outcome.4001.failure_declaration_1: "Matar vampiros es, en el fondo, bastante fácil. El sol lo hará sin falta cada vez. La parte difícil es asegurarse de que el objetivo esté fuera cuando los rayos de luz de Dios bendigan este mundo.\nPara esta ocasión, has elegido el método de 'demolición'. No hay necesidad de mover al vampiro durmiente si el propio techo es retirado durante la noche. Solo necesitas algunos hombres buenos capaces de crear una distracción en el [target.Custom('PODDomicile')] para que tu equipo de expertos pueda ponerse a trabajar.\n¿Qué podría salir mal?\n\n"
 POD_murder_outcome.4001.failed_attempt_1: "Tus agentes pudieron crear una distracción, pero no lo suficiente como para que tu equipo de demolición hiciera un agujero en el techo, claramente bien reforzado, de mi objetivo."
 POD_murder_outcome.4001.disastrous_attempt_1: "\n\nPronto llegaron los guardias y atraparon a algunos de tus hombres, revelando tu implicación en todo el asunto."
 POD_murder_outcome.4001.unknown_so_far: "\n\nCuando aparecieron los guardias, tus hombres pudieron escapar, ocultando al menos tu implicación en toda esta intriga."
 POD_murder_outcome.4001.a: "¡Era solo una inspección de techo planificada, lo juro!"
 POD_murder_outcome.4001.b: "Hoy en día no se encuentran buenos constructores."

 murder_outcome.5002.vampire_sun: "Me despierta el olor a carne quemada... mi propia carne. El sol todavía está alto en el cielo y, por alguna misteriosa razón, mi techo parece haber desaparecido. El resultado es rápido pero doloroso. No se debe jugar con la Maldición de Dios, y me apresuro a buscar refugio mientras me prendo fuego como una antorcha viviente.\nMi salvación reside en un establo cercano donde me siento en un rincón oscuro tras apagar las llamas. No es una forma muy digna de pasar el día, pero al menos significa que sobreviviré por el momento."

 POD_murder_outcome.1002.t: "Cazadores Cazando"
 POD_murder_outcome.1002.desc: "Hay muchísima gente a la que le gusta matar vampiros e incluso puedes encontrar algunas organizaciones dedicadas a esa causa. Van desde una mera molestia hasta enemigos dignos, pero tal vez también podrían ser útiles en el asunto de esta noche. Si revelaras la ubicación del [target.Custom('PODDomicile')] de tu objetivo a algunos terceros interesados, podrías estar seguro de que algo sucedería.\nPodría ser una buena forma de no involucrarse demasiado, asegurándose al mismo tiempo de que se cumpla el objetivo. ¿Quién dijo que los mortales eran inútiles contra los vampiros? Bien guiados, todos tienen un papel que desempeñar..."
 POD_murder_outcome.1002.a: "Yo soy el titiritero"
 POD_murder_outcome.1002.b: "Ahora no es el momento"

 POD_murder_outcome.2002.t: "Cazadores Cazando"
 POD_murder_outcome.2002.opening_1: "Hay muchísima gente a la que le gusta matar vampiros e incluso puedes encontrar algunas organizaciones dedicadas a esa causa. Van desde una mera molestia hasta enemigos dignos, pero tal vez también podrían ser útiles en el asunto de esta noche. Si revelaras la ubicación del [target.Custom('PODDomicile')] de tu objetivo a algunos terceros interesados, podrías estar seguro de que algo sucedería.\nPodría ser una buena forma de no involucrarse demasiado, asegurándose al mismo tiempo de que se cumpla el objetivo. ¿Quién dijo que los mortales eran inútiles contra los vampiros? Bien guiados, todos tienen un papel que desempeñar...\n\nUn grupo de mortales experimentados ha rastreado la posición de tu objetivo y ha lanzado un asalto a gran escala contra el [target.Custom('PODDomicile')].\nSolo dejaron tras de sí las ruinas humeantes y los cadáveres calcinados de los defensores, incluido el de tu víctima. Una tragedia, de verdad, ¿es que no tienen vergüenza?"
 POD_murder_outcome.2002.owner_is_known_1: "\n\nDesafortunadamente, uno de los cazadores fue capturado durante su huida y reveló tu implicación en el descubrimiento 'milagroso' del [target.Custom('PODDomicile')]..."
 POD_murder_outcome.2002.no_awareness_1: "\n\nCon los cazadores logrando una huida limpia, nada puede incriminarte en este asunto."
 POD_murder_outcome.2002.a.discovered: "¡Solo estaba ayudando!"
 POD_murder_outcome.2002.a: "Enviad mis saludos a los herederos"

 murder_outcome.5001.vampire_hunters: "Aunque los ataques de cazadores no son infrecuentes, este te pilló por sorpresa. No ha habido advertencias, ni rastreos de alguno de ellos intentando localizar tu [ROOT.Char.Custom('PODDomicile')], solo un asalto repentino y preciso, como si lo supieran... Sin embargo, no tienes tiempo para considerar demasiado el asunto ahora mismo, ya que tu no-vida está en juego.\nA pesar de tus mejores esfuerzos, son demasiado numerosos y están demasiado bien organizados... y parecen poseer también algunos aliados sobrenaturales, lo que confirma que alguien está detrás de ese ataque. Pero es demasiado poco y demasiado tarde, y solo puedes esperar que algún día se arrepientan de haberse metido con los propios cazadores."

 POD_murder_outcome.4002.t: "Cazadores Cazando"
 POD_murder_outcome.4002.failure_declaration_1: "Hay muchísima gente a la que le gusta matar vampiros e incluso puedes encontrar algunas organizaciones dedicadas a esa causa. Van desde una mera molestia hasta enemigos dignos, pero tal vez también podrían ser útiles en el asunto de esta noche. Si revelaras la ubicación del [target.Custom('PODDomicile')] de tu objetivo a algunos terceros interesados, podrías estar seguro de que algo sucedería.\nPodría ser una buena forma de no involucrarse demasiado, asegurándose al mismo tiempo de que se cumpla el objetivo. ¿Quién dijo que los mortales eran inútiles contra los vampiros? Bien guiados, todos tienen un papel que desempeñar...\n\n"
 POD_murder_outcome.4002.failed_attempt_1: "Un grupo de mortales experimentados ha rastreado la posición de tu objetivo y ha lanzado un asalto a gran escala contra el [target.Custom('PODDomicile')].\nSin embargo, ni siquiera eso fue suficiente, y las sólidas defensas del [target.Custom('PODDomicile')] pudieron repeler el ataque, dejando toda esta intriga en un rotundo fracaso."
 POD_murder_outcome.4002.disastrous_attempt_1: "\n\nPeor aún, algunos cazadores fueron capturados y revelaron rápidamente todo lo que sabían, lo suficiente como para soltar el nombre de uno de tus contactos..."
 POD_murder_outcome.4002.unknown_so_far: "\n\nAl menos, los cazadores que sobrevivieron pudieron escapar, asegurándose de que nadie pueda saber de tu implicación."
 POD_murder_outcome.4002.a: "¿Tengo que hacerlo todo yo mismo?"
 POD_murder_outcome.4002.b: "De verdad, los mortales son inútiles."

 murder_outcome.5002.vampire_hunters: "Aunque los ataques de cazadores no son infrecuentes, este te pilló por sorpresa. No ha habido advertencias, ni rastreos de alguno de ellos intentando localizar tu [ROOT.Char.Custom('PODDomicile')], solo un asalto repentino y preciso, como si lo supieran... Sin embargo, no tienes tiempo para considerar demasiado el asunto ahora mismo, ya que tu no-vida está en juego.\nPor suerte, las defensas de tu [ROOT.Char.Custom('PODDomicile')] estaban bien planificadas y fueron suficientes para repeler incluso esto. Fue una batalla duramente disputada, con algunos momentos críticos aquí y allá, pero nada que realmente te suponga un contratiempo. Ahora, a descubrir qué ha pasado realmente..."

 POD_murder_outcome.1003.t: "Lobos a su Puerta"
 POD_murder_outcome.1003.desc: "Incluso depredadores tan terribles como los vampiros pueden convertirse en presas de vez en cuando. Tal es el caso de los temidos 'lupinos', u hombres lobo, los feroces cambiapieles con un odio profundamente arraigado hacia los chupasangres. Esto es algo que podrías usar.\nAl filtrar información sobre un próximo viaje de tu objetivo cerca de una zona boscosa, podrías asegurarte de que su grupo sea atacado. Entonces, el salvajismo y la temible destreza en combate de estas bestias podrían ser suficientes para encargarse del problema por ti."
 POD_murder_outcome.1003.a: "¡Soltad a los perros de la guerra!"
 POD_murder_outcome.1003.b: "Ahora no es el momento"

 POD_murder_outcome.2003.t: "Lobos a su Puerta"
 POD_murder_outcome.2003.opening_1: "Incluso depredadores tan terribles como los vampiros pueden convertirse en presas de vez en cuando. Tal es el caso de los temidos 'lupinos', u hombres lobo, los feroces cambiapieles con un odio profundamente arraigado hacia los chupasangres. Esto es algo que podrías usar.\nAl filtrar información sobre un próximo viaje de tu objetivo cerca de una zona boscosa, podrías asegurarte de que su grupo sea atacado. Entonces, el salvajismo y la temible destreza en combate de estas bestias podrían ser suficientes para encargarse del problema por ti.\n\nLos hombres lobo son de lo más fiables en su odio hacia los vampiros. Incluso el más mínimo indicio de una posible presa fue suficiente para que prepararan una emboscada a gran escala contra tu objetivo.\nFue, como se esperaba, una carnicería. Las poderosas bestias acabaron rápidamente con los defensores y, aunque no sabes qué le ocurrió exactamente a [target.GetTitledFirstName], apuestas a que fue rápido pero sangriento y doloroso."
 POD_murder_outcome.2003.owner_is_known_1: "\n\nDesafortunadamente, más cerca de casa, uno de tus agentes que servía de intermediario con los lupinos fue capturado y reveló tu implicación en la emboscada."
 POD_murder_outcome.2003.no_awareness_1: "\n\nNi los herederos de tu objetivo ni los propios hombres lobo tienen la menor idea de tu implicación."
 POD_murder_outcome.2003.a.discovered: "El enemigo de mi enemigo..."
 POD_murder_outcome.2003.a: "Buenos chicos."

 murder_outcome.5001.vampire_werewolves: "Un viaje cerca de un bosque es siempre una perspectiva peligrosa para un vampiro, ya que los hombres lobo, los feroces cambiapieles con un profundo odio por los de tu clase, acechan entre esos árboles. Tomaste todas las precauciones posibles para evitar llamar su atención, pero al parecer no fue suficiente. Mientras caen sobre tu grupo con colmillos y garras fuera, te preguntas ¿cómo pudieron conocer tu ruta de viaje?\nProbablemente nunca obtendrás la respuesta, ya que los lupinos abruman fácilmente a tu escolta y se cierran sobre ti. A pesar de tus sin duda formidables poderes, poco puedes hacer contra tantos asesinos sedientos de sangre. Serás una víctima más en la guerra interminable entre vuestras razas."

 POD_murder_outcome.4003.t: "Lobos a su Puerta"
 POD_murder_outcome.4003.failure_declaration_1: "Incluso depredadores tan terribles como los vampiros pueden convertirse en presas de vez en cuando. Tal es el caso de los temidos 'lupinos', u hombres lobo, los feroces cambiapieles con un odio profundamente arraigado hacia los chupasangres. Esto es algo que podrías usar.\nAl filtrar información sobre un próximo viaje de tu objetivo cerca de una zona boscosa, podrías asegurarte de que su grupo sea atacado. Entonces, el salvajismo y la temible destreza en combate de estas bestias podrían ser suficientes para encargarse del problema por ti.\n\n"
 POD_murder_outcome.4003.failed_attempt_1: "Los hombres lobo son de lo más fiables en su odio hacia los vampiros. Incluso el más mínimo indicio de una posible presa fue suficiente para que prepararan una emboscada a gran escala contra tu objetivo.\nLamentablemente, aunque la batalla fue duramente disputada, tu objetivo logró abrirse paso en la emboscada y reapareció varias noches después en su [target.Custom('PODDomicile')], todavía no-muerto y bien. Parece que hará falta algo más que eso para deshacerse de él."
 POD_murder_outcome.4003.disastrous_attempt_1: "\n\nPeor aún, más cerca de casa, uno de tus agentes que servía de intermediario con los lupinos fue capturado y reveló tu implicación en la emboscada."
 POD_murder_outcome.4003.unknown_so_far: "\n\nSin embargo, ni tu objetivo ni los propios hombres lobo tienen la menor idea de tu implicación, así que eso es un pequeño alivio."
 POD_murder_outcome.4003.a: "Parece que el enemigo de mi enemigo es inútil."
 POD_murder_outcome.4003.b: "¡Malos perros!"

 murder_outcome.5002.vampire_werewolves: "Un viaje cerca de un bosque es siempre una perspectiva peligrosa para un vampiro, ya que los hombres lobo, los feroces cambiapieles con un profundo odio por los de tu clase, acechan entre esos árboles. Tomaste todas las precauciones posibles para evitar llamar su atención, pero al parecer no fue suficiente. Mientras caen sobre tu grupo con colmillos y garras fuera, te preguntas ¿cómo pudieron conocer tu ruta de viaje?\nSin embargo, tú también eres una fuerza a tener en cuenta y, mientras tu escolta muere para protegerte, logras abrirte paso a través de la horda bestial. Las noches y días siguientes son un borroso recuerdo de esconderse del sol en cualquier lugar remoto que puedas encontrar antes de llegar finalmente de vuelta a tu [ROOT.Char.Custom('PODDomicile')]. Es hora de entender qué ha pasado realmente ahí fuera..."

 POD_murder_outcome.1004.t: "A las Cenizas"
 POD_murder_outcome.1004.desc: "Además del sol, el mayor enemigo de cualquier vampiro puede ser el fuego. Y, a pesar de sus mejores esfuerzos, a menudo puede ser más difícil esconderse de cualquier material inflamable que de los rayos de luz. Por ello, estás considerando prender fuego al [target.Custom('PODDomicile')] de tu objetivo.\nNecesitarás agentes para provocar una conmoción y suficiente combustible alrededor para asegurarte de que arda absolutamente todo. Es una solución potencial bruta, aunque sencilla y eficaz, para deshacerse de cualquier cosa que haya dentro del lugar."
 POD_murder_outcome.1004.a: "¡Buscadme algunos pirómanos!"
 POD_murder_outcome.1004.b: "Ahora no es el momento"

 POD_murder_outcome.2004.t: "A las Cenizas"
 POD_murder_outcome.2004.opening_1: "Además del sol, el mayor enemigo de cualquier vampiro puede ser el fuego. Y, a pesar de sus mejores esfuerzos, a menudo puede ser más difícil esconderse de cualquier material inflamable que de los rayos de luz. Por ello, estás considerando prender fuego al [target.Custom('PODDomicile')] de tu objetivo.\nNecesitarás agentes para provocar una conmoción y suficiente combustible alrededor para asegurarte de que arda absolutamente todo. Es una solución potencial bruta, aunque sencilla y eficaz, para deshacerse de cualquier cosa que haya dentro del lugar.\n\nLa operación se ha puesto en marcha con sólida eficacia. Un grupo de tus hombres distrajo a algunos de los guardias mientras otros preparaban antorchas y combustible. Pronto, todo el lugar estaba ardiendo.\nTus agentes se quedaron todo el tiempo que pudieron, e informan de que nadie salió del infierno mientras impedían que llegara cualquier ayuda. Te hablan de un gran y salvaje grito que emanó de debajo del [target.Custom('PODDomicile')]. Con suerte, lo último que sabrás de [target.GetTitledFirstName]."
 POD_murder_outcome.2004.owner_is_known_1: "\n\nDesafortunadamente, uno de tus agentes fue capturado antes de que pudiera huir y ha sido obligado a revelar tu implicación."
 POD_murder_outcome.2004.no_awareness_1: "\n\nTus agentes huyeron sin problemas, ocultando cualquier cosa que pudiera vincularte con esta intriga."
 POD_murder_outcome.2004.a.discovered: "¡Quiero agua cerca en todas partes en mi [ROOT.Char.Custom('PODDomicile')]!"
 POD_murder_outcome.2004.a: "Ceniza a la ceniza"

 murder_outcome.5001.vampire_fire: "Fuego. El miedo instintivo de los de tu clase a este elemento voluble despierta tus sentidos plenamente ante el terrible peligro en el que te encuentras. De algún modo, tu [ROOT.Char.Custom('PODDomicile')] está ardiendo a tu alrededor. ¿Un accidente? Conociendo a los numerosos enemigos que tienes, probablemente no. Pero no es el momento de considerar esto.\nIntentas por todos los medios encontrar una salida del infierno abrasador, pero es en vano. Pronto, tu Bestia toma el control y corre frenéticamente hacia un rincón. No hay escapatoria, y las llamas que dan vida pronto te darán la Muerte Definitiva."

 POD_murder_outcome.4004.t: "A las Cenizas"
 POD_murder_outcome.4004.failure_declaration_1: "Además del sol, el mayor enemigo de cualquier vampiro puede ser el fuego. Y, a pesar de sus mejores esfuerzos, a menudo puede ser más difícil esconderse de cualquier material inflamable que de los rayos de luz. Por ello, estás considerando prender fuego al [target.Custom('PODDomicile')] de tu objetivo.\nNecesitarás agentes para provocar una conmoción y suficiente combustible alrededor para asegurarte de que arda absolutamente todo. Es una solución potencial bruta, aunque sencilla y eficaz, para deshacerse de cualquier cosa que haya dentro del lugar.\n\n"
 POD_murder_outcome.4004.failed_attempt_1: "La operación se ha puesto en marcha con sólida eficacia. Un grupo de tus hombres distrajo a algunos de los guardias mientras otros preparaban antorchas y combustible. Pronto, todo el lugar estaba ardiendo.\nSin embargo, no fue suficiente, ya que tus agentes fueron pronto despedazados por el vengativo [target.GetTitledFirstName], que logró encontrar una salida del infierno abrasador antes de huir hacia el interior de la ciudad. Has perdido esta ronda."
 POD_murder_outcome.4004.disastrous_attempt_1: "\n\nPeor aún, uno de tus agentes fue capturado antes de que pudiera huir y ha sido obligado a revelar tu implicación."
 POD_murder_outcome.4004.unknown_so_far: "\n\nTus agentes huyeron sin problemas, ocultando cualquier cosa que pudiera vincularte con esta intriga, así que eso es un pequeño alivio."
 POD_murder_outcome.4004.a: "¿El comienzo de una ardiente venganza?"
 POD_murder_outcome.4004.b: "Solo un accidente, obviamente."

 murder_outcome.5002.vampire_fire: "Fuego. El miedo instintivo de los de tu clase a este elemento voluble despierta tus sentidos plenamente ante el terrible peligro en el que te encuentras. De algún modo, tu [ROOT.Char.Custom('PODDomicile')] está ardiendo a tu alrededor. ¿Un accidente? Conociendo a los numerosos enemigos que tienes, probablemente no. Pero no es el momento de considerar esto.\nManteniéndote fuerte bajo la presión, logras encontrar una salida del infierno sin demasiados daños. Exhalando un (inútil) suspiro de alivio por la fuerza de la costumbre, te preguntas si habrá pistas en las ruinas humeantes sobre lo que realmente ha pasado aquí..."

 POD_murder_outcome.1005.t: "Una traición repentina pero esperada"
 POD_murder_outcome.1005.desc: "Siempre hay un eslabón débil en el refugio de cualquier vampiro. Puede ser ese [ghoul|E] que quiere ser Abrazado, o ese sirviente que recibió una paliza de más, o incluso ese guardia que tiene dudas sobre servir a un maldito cainita. Si puedes encontrar ese eslabón débil, solo será cuestión de organizar que el ataúd del vampiro vea la luz del día por la mañana.\nTienes varios informes sobre la corte de tu enemigo y podrías usarlos para iniciar tal operación."
 POD_murder_outcome.1005.a: "Sobórnalos, engatúsalos o amenázalos"
 POD_murder_outcome.1005.b: "Ahora no es el momento"

 POD_murder_outcome.2005.t: "Una traición repentina pero esperada"
 POD_murder_outcome.2005.opening_1: "Siempre hay un eslabón débil en el refugio de cualquier vampiro. Puede ser ese [ghoul|E] que quiere ser Abrazado, o ese sirviente que recibió una paliza de más, o incluso ese guardia que tiene dudas sobre servir a un maldito cainita. Si puedes encontrar ese eslabón débil, solo será cuestión de organizar que el ataúd del vampiro vea la luz del día por la mañana.\nTienes varios informes sobre la corte de tu enemigo y podrías usarlos para iniciar tal operación.\n\nUn éxito rotundo. Tu infiltrado nunca fue descubierto antes de que despachara hábilmente a los guardias con un recado y se asegurara de que [target.GetTitledFirstName] estuviera de cara al sol de la mañana.\nUn plan sencillo, de verdad, pero a veces esos son más que suficientes."
 POD_murder_outcome.2005.owner_is_known_1: "\n\nDesafortunadamente, los estertores de muerte de tu objetivo se oyeron bastante lejos y tu hombre fue capturado antes de que pudiera huir. Has sido revelado como el cerebro tras esta intriga."
 POD_murder_outcome.2005.no_awareness_1: "\n\nObviamente, te encargaste de tu infiltrado después, asegurándote de que nadie pueda saber de tu implicación en esta intriga."
 POD_murder_outcome.2005.a.discovered: "¡Solo le estaba ayudando, nada más!"
 POD_murder_outcome.2005.a: "Hoy en día es difícil encontrar buena ayuda"

 murder_outcome.5001.vampire_betrayal: "Estás muriendo.\nEste es el primer pensamiento que te viene a la cabeza mientras el sol brilla en tu cara... y te convierte en una antorcha viviente. ¿Cómo has acabado en esta situación?\nEntonces lo ves. Ese humilde guardia, sirviente... ¿o [ghoul|E]? que te observa con una mirada satisfecha mientras te consumes. Alguien hizo esto, alguien ayudó a este traidor llorón a matarte. Y ese alguien probablemente esté triunfando ahora mismo, disfrutando de tu ardiente desaparición."

 POD_murder_outcome.4005.t: "Una traición repentina pero esperada"
 POD_murder_outcome.4005.failure_declaration_1: "Siempre hay un eslabón débil en el refugio de cualquier vampiro. Puede ser ese [ghoul|E] que quiere ser Abrazado, o ese sirviente que recibió una paliza de más, o incluso ese guardia que tiene dudas sobre servir a un maldito cainita. Si puedes encontrar ese eslabón débil, solo será cuestión de organizar que el ataúd del vampiro vea la luz del día por la mañana.\nTienes varios informes sobre la corte de tu enemigo y podrías usarlos para iniciar tal operación.\n\n"
 POD_murder_outcome.4005.failed_attempt_1: "La operación ha sido un desastre. Tu infiltrado fue torpe y demasiado obvio en sus intenciones, lo que provocó que fuera detenido mucho antes de que pudiera siquiera acercarse a tu objetivo."
 POD_murder_outcome.4005.disastrous_attempt_1: "\n\nPeor aún, fue capturado y reveló tu implicación en esta intriga."
 POD_murder_outcome.4005.unknown_so_far: "\n\nAl menos, logró escapar. Lo despachaste rápidamente cuando intentó refugiarse en tu corte, cubriendo tus huellas."
 POD_murder_outcome.4005.a: "Bueno, eso es un contratiempo"
 POD_murder_outcome.4005.b: "Hoy en día no se puede confiar en nadie"

 murder_outcome.5002.vampire_betrayal: "Uno de tus sirvientes menores hizo el ridículo ayer. Durante tu sueño, intentó llegar hasta ti para, al parecer, llevarte al sol. Obviamente, tus guardias lo detuvieron antes de que pudiera causar algún daño, pero eso plantea una pregunta: ¿trabajaba solo?\nPodrías imaginar la mano de uno de tus muchos enemigos detrás de este débil intento contra tu no-vida..."

 POD_murder_save.0001.t: "$murder_save_header$ A prueba de sol"
 POD_murder_save.0001.desc: "Matar vampiros es, en el fondo, bastante fácil. El sol lo hará sin falta cada vez. La parte difícil es asegurarse de que el objetivo esté fuera cuando los rayos de luz de Dios bendigan este mundo.\nPara esta ocasión, has elegido el método de 'demolición'. No hay necesidad de mover al vampiro durmiente si el propio techo es retirado durante la noche. Solo necesitas algunos hombres buenos capaces de crear una distracción en el [target.Custom('PODDomicile')] para que tu equipo de expertos pueda ponerse a trabajar.\n¿Qué podría salir mal?\n\nTu complot estaba funcionando perfectamente bien y el sol empezó a quemar a tu objetivo... pero ni siquiera eso fue suficiente. Usando sus tremendos poderes físicos, [target.GetTitledFirstName] simplemente ignoró los rayos de luz el tiempo suficiente para correr a refugiarse. Pronto, los guardias volvieron para ayudar a su señor y todo el asunto fue, al final, un rotundo fracaso."
 POD_murder_save.0001.a: "Me rindo"
 POD_murder_save.0001.b: "¡Debo intentarlo de nuevo!"

 POD_murder_save.1001.t: "$murder_save_header$ A prueba de sol"
 POD_murder_save.1001.desc: "Me despierta el olor a carne quemada... mi propia carne. El sol todavía está alto en el cielo y, por alguna misteriosa razón, mi techo parece haber desaparecido. El resultado es rápido pero doloroso. No se debe jugar con la Maldición de Dios, y me apresuro a buscar refugio mientras me prendo fuego como una antorcha viviente.\nPor suerte, mi maestría en los poderes de la sangre es suficiente para ayudarme a soportar este tormento el tiempo suficiente para encontrar refugio. Mis guardias están pronto a mi lado y el peligro ha pasado... al menos por ahora. Claramente no fue un accidente."
 POD_murder_save.1001.a: "¡Encontraré a quien hizo esto!"
 POD_murder_save.1001.b: "¡Es obvio quién estaba detrás de esto!"

 POD_murder_save.0002.t: "$murder_save_header$ Accidente de caza"
 POD_murder_save.0002.desc: "Hay muchísima gente a la que le gusta matar vampiros e incluso puedes encontrar algunas organizaciones dedicadas a esa causa. Van desde una mera molestia hasta enemigos dignos, pero tal vez también podrían ser útiles en el asunto de esta noche. Si revelaras la ubicación del [target.Custom('PODDomicile')] de tu objetivo a algunos terceros interesados, podrías estar seguro de que algo sucedería.\nPodría ser una buena forma de no involucrarse demasiado, asegurándose al mismo tiempo de que se cumpla el objetivo. ¿Quién dijo que los mortales eran inútiles contra los vampiros? Bien guiados, todos tienen un papel que desempeñar...\n\nUn grupo de mortales experimentados ha rastreado su posición y ha lanzado un asalto a gran escala contra el [target.Custom('PODDomicile')].\nLamentablemente, no fueron rival para la terrible destreza en combate que posee [target.GetTitledFirstName], y fueron despachados fácilmente. Todo tu complot es un fracaso."
 POD_murder_save.0002.a: "Me rindo"
 POD_murder_save.0002.b: "¡Debo intentarlo de nuevo!"

 POD_murder_save.1002.t: "$murder_save_header$ Accidente de caza"
 POD_murder_save.1002.desc: "Aunque los ataques de cazadores no son infrecuentes, este te pilló por sorpresa. No ha habido advertencias, ni rastreos de alguno de ellos intentando localizar tu [ROOT.Char.Custom('PODDomicile')], solo un asalto repentino y preciso, como si lo supieran... Sin embargo, no tienes tiempo para considerar demasiado el asunto ahora mismo, ya que tu no-vida está en juego.\nSin embargo, eres más que capaz de valerte por ti mismo y, muy pronto, estos cazadores no son más que compañeros de entrenamiento involuntarios. Y se sabe que entrenas duro."
 POD_murder_save.1002.a: "¡Encontraré a quien hizo esto!"
 POD_murder_save.1002.b: "¡Es obvio quién estaba detrás de esto!"

 POD_murder_save.0003.t: "$murder_save_header$ Bailando con lobos"
 POD_murder_save.0003.desc: "Incluso depredadores tan terribles como los vampiros pueden convertirse en presas de vez en cuando. Tal es el caso de los temidos 'lupinos', u hombres lobo, los feroces cambiapieles con un odio profundamente arraigado hacia los chupasangres. Esto es algo que podrías usar.\nAl filtrar información sobre un próximo viaje de tu objetivo cerca de una zona boscosa, podrías asegurarte de que su grupo sea atacado. Entonces, el salvajismo y la temible destreza en combate de estas bestias podrían ser suficientes para encargarse del problema por ti.\n\nLos hombres lobo son de lo más fiables en su odio hacia los vampiros. Incluso el más mínimo indicio de una posible presa fue suficiente para que prepararan una emboscada a gran escala contra tu objetivo.\nLamentablemente, esto no fue suficiente, ya que tu objetivo utilizó sus considerables poderes para confundir a los lupinos el tiempo suficiente para encontrar una salida. Ese complot ha sido frustrado."
 POD_murder_save.0003.a: "Me rindo"
 POD_murder_save.0003.b: "¡Debo intentarlo de nuevo!"

 POD_murder_save.1003.t: "$murder_save_header$ Bailando con lobos"
 POD_murder_save.1003.desc: "Un viaje cerca de un bosque es siempre una perspectiva peligrosa para un vampiro, ya que los hombres lobo, los feroces cambiapieles con un profundo odio por los de tu clase, acechan entre esos árboles. Tomaste todas las precauciones posibles para evitar llamar su atención, pero al parecer no fue suficiente. Mientras caen sobre tu grupo con colmillos y garras fuera, te preguntas ¿cómo pudieron conocer tu ruta de viaje?\nPor suerte, controlas algunos fuertes poderes ferales, lo que te permite confundir a los lupinos el tiempo suficiente para encontrar una salida. Aun así, ha sido por poco."
 POD_murder_save.1003.a: "¡Encontraré a quien hizo esto!"
 POD_murder_save.1003.b: "¡Es obvio quién estaba detrás de esto!"

 POD_murder_save.0004.t: "$murder_save_header$ A prueba de fuego"
 POD_murder_save.0004.desc: "Además del sol, el mayor enemigo de cualquier vampiro puede ser el fuego. Y, a pesar de sus mejores esfuerzos, a menudo puede ser más difícil esconderse de cualquier material inflamable que de los rayos de luz. Por ello, estás considerando prender fuego al [target.Custom('PODDomicile')] de tu objetivo.\nNecesitarás agentes para provocar una conmoción y suficiente combustible alrededor para asegurarte de que arda absolutamente todo. Es una solución potencial bruta, aunque sencilla y eficaz, para deshacerse de cualquier cosa que haya dentro del lugar.\n\nLa operación se ha puesto en marcha con sólida eficacia. Un grupo de tus hombres distrajo a algunos de los guardias mientras otros preparaban antorchas y combustible. Pronto, todo el lugar estaba ardiendo.\nSin embargo, no lo suficientemente rápido como para preocupar realmente a tu objetivo. Usando sus considerables poderes, lograron repeler el fuego y escaparon rápidamente del infierno antes de que fuera demasiado tarde. Ese plan no funcionó."
 POD_murder_save.0004.a: "Me rindo"
 POD_murder_save.0004.b: "¡Debo intentarlo de nuevo!"

 POD_murder_save.1004.t: "$murder_save_header$ A prueba de fuego"
 POD_murder_save.1004.desc: "Fuego. El miedo instintivo de los de tu clase a este elemento voluble despierta tus sentidos plenamente ante el terrible peligro en el que te encuentras. De algún modo, tu [ROOT.Char.Custom('PODDomicile')] está ardiendo a tu alrededor. ¿Un accidente? Conociendo a los numerosos enemigos que tienes, probablemente no. Pero no es el momento de considerar esto.\nSin embargo, usando tus considerables poderes físicos, eres capaz de repeler el fuego el tiempo suficiente para escapar del infierno abrasador. Aun así, ha sido por poco."
 POD_murder_save.1004.a: "¡Encontraré a quien hizo esto!"
 POD_murder_save.1004.b: "¡Es obvio quién estaba detrás de esto!"

 POD_murder_save.0005.t: "$murder_save_header$ Traición esperada"
 POD_murder_save.0005.desc: "Siempre hay un eslabón débil en el refugio de cualquier vampiro. Puede ser ese [ghoul|E] que quiere ser Abrazado, o ese sirviente que recibió una paliza de más, o incluso ese guardia que tiene dudas sobre servir a un maldito cainita. Si puedes encontrar ese eslabón débil, solo será cuestión de organizar que el ataúd del vampiro vea la luz del día por la mañana.\nTienes varios informes sobre la corte de tu enemigo y podrías usarlos para iniciar tal operación.\n\nBueno, eso no funcionó. [target.GetTitledFirstName] de algún modo parecía conocer la inminente traición, tal vez gracias a sus considerables poderes. Tu agente fue detenido incluso antes de que pudiera poner realmente el plan en marcha. Todo eso fue para nada."
 POD_murder_save.0005.a: "Me rindo"
 POD_murder_save.0005.b: "¡Debo intentarlo de nuevo!"

 POD_murder_save.1005.t: "$murder_save_header$ Traición esperada"
 POD_murder_save.1005.desc: "Advertido por tus considerables poderes proféticos, pudiste conocer una intriga dirigida contra tu no-vida. Un sirviente menor tuyo planeaba moverte durante tu sueño diurno para que te enfrentaras al sol, probablemente matándote en el proceso.\nTe encargaste de él, pero la conspiración probablemente sea más profunda que un simple subordinado descontento..."
 POD_murder_save.1005.a: "¡Encontraré a quien hizo esto!"
 POD_murder_save.1005.b: "¡Es obvio quién estaba detrás de esto!"

 POD_murder_save.0006.t: "$murder_save_header$ Victoria impecable"
 POD_murder_save.0006.desc: "Usar un asesino, aunque no es una mala idea en sí misma, era probablemente un plan condenado desde el principio. Ninguna preparación podría bastar contra una potencia como [target.GetTitledFirstName]. A pesar del efecto sorpresa y de la cuidadosa ejecución del plan, los asesinos fueron fácilmente masacrados antes de que pudieran causar algún daño.\nParece que necesitarás algo más que fuerza bruta."
 POD_murder_save.0006.a: "Me rindo"
 POD_murder_save.0006.b: "¡Debo intentarlo de nuevo!"

 POD_murder_save.1006.t: "$murder_save_header$ Victoria impecable"
 POD_murder_save.1006.desc: "Unos necios han intentado matarte esta noche. Bueno, ahora están muertos, ya que fuiste más que capaz de despacharlos fácilmente usando tu formidable destreza en combate.\nAun así, surge la pregunta: ¿quién planeó este asalto? Puede que su próximo ataque no sea tan fácil de manejar..."
 POD_murder_save.1006.a: "¡Encontraré a quien hizo esto!"
 POD_murder_save.1006.b: "¡Es obvio quién estaba detrás de esto!"

 POD_murder_save.0007.t: "$murder_save_header$ Personalidad encantadora"
 POD_murder_save.0007.desc: "Tu intriga de asesinato ha tenido un avance potencial. Tu objetivo pronto tendrá que viajar a una zona densamente poblada y tus agentes informan de que los mortales de esta región ya están cerca de un punto de ruptura. Unas palabras en los oídos adecuados y sobornos en la mano adecuada podrían iniciar una revuelta muy volátil.\n\nEsa idea podría haber funcionado bien... si [target.GetTitledFirstName] no fuera un practicante tan hábil de la magia mental. Poniendo fácilmente a la multitud a su favor, lidiaron con cualquier hostilidad rápidamente y regresaron a su corte ilesos.\nDemasiado encantador para morir de esa manera, de verdad."
 POD_murder_save.0007.a: "Me rindo"
 POD_murder_save.0007.b: "¡Debo intentarlo de nuevo!"

 POD_murder_save.1007.t: "$murder_save_header$ Personalidad encantadora"
 POD_murder_save.1007.desc: "Esta noche ha ocurrido un incidente menor, con los mortales de la zona soliviantados contra ti por algo... o por alguien. Usando tus considerables poderes mentales, lidiaste con ellos fácilmente, pero la cuestión del instigador permanece.\nSi esto fue algún tipo de intriga, su próximo ataque podría ser más peligroso que este."
 POD_murder_save.1007.a: "¡Encontraré a quien hizo esto!"
 POD_murder_save.1007.b: "¡Es obvio quién estaba detrás de esto!"

 POD_murder_save_physical: "Es poco probable que este método de asesinato funcione contra defensas físicas fuertes, por ejemplo, Fortaleza Avanzada."
 POD_murder_save_perception: "Es poco probable que este método de asesinato funcione contra defensas de conciencia fuertes, por ejemplo, Auspex Avanzado."
 POD_murder_save_fighter: "Es poco probable que este método de asesinato funcione contra luchadores fuertes con una puntuación de destreza alta."
 POD_murder_save_charisma: "Es poco probable que este método de asesinato funcione contra defensas de carisma fuertes, por ejemplo, Presencia Avanzada."
