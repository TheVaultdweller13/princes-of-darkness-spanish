l_spanish:

 POD_ghoulify.100.t: "Un Servidor Leal"
 POD_ghoulify.100.option.a: "Tu servicio será recompensado."
 POD_ghoulify.100.option.b: "No son dignos."
 POD_ghoulify.100.desc: "\nTras una cuidadosa preparación y planificación, has podido reclutar a este mortal como tu esclavo [ghoul|E].\n"
 POD_ghoulify.200.t: "Un Compañero Gourmet"
 POD_ghoulify.200.option.a: "Prueba el poder."
 POD_ghoulify.200.option.b: "Esto no está bien."
 POD_ghoulify.200.desc: "\nTentándolo con la promesa de un poder inhumano, has logrado convencer a [target.GetTitledFirstName] de que se una a ti en el hábito de consumir $pod_vitae$ de vástago.\n"
