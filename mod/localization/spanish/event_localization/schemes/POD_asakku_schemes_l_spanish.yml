 # Soul Infection scheme event chain
 POD_asakku.0030.t: "Algo en la sangre"
 POD_asakku.0030.desc: "Lo percibes antes de comprenderlo: una anomalía en el modo en que se mueve tu sangre, como si algo pusiera a prueba la corriente. Algo anda muy, muy mal. La Vicisitud de tus venas se siente distinta esta noche. Más pesada.\n\nEn verdad, no empezó esta noche. Pequeñas cosas, como un sabor al fondo de la garganta que no pertenecía a ninguna comida, o un momento de desorientación al buscar una disciplina conocida y sentir, por un brevísimo instante, que algo más se estiraba contigo. Manos que no eran tuyas, moviéndose en tándem con las tuyas.\n\nNo sabes qué te está haciendo esto. Solo sabes que es paciente y que esta noche está más cerca que la anterior."
 POD_asakku.0030.a: "Combatirlo."
 POD_asakku.0030.b: "Dejarlo entrar."
 POD_asakku.0031.t: "La contienda"
 POD_asakku.0031.desc: "La sangre de [defender.GetFirstNamePossessive|U] resiste. No con comprensión, pues [defender.GetSheHe] aún no sabe qué se mueve por [defender.GetHerHim], sino con la terquedad de la vieja $pod_vitae$ que reconoce una voluntad ajena. Sientes el rechazo como una presión contra un puño cerrado. Puedes abrirte paso. La cuestión es si esta noche merece la pena pagar el coste."
 POD_asakku.0031.a: "Abrirte paso a través de la resistencia."
 POD_asakku.0031.a.success.desc: "La infección arraiga. La resistencia de [defender.GetFirstNamePossessive|U] se desmorona."
 POD_asakku.0031.a.failure.desc: "[defender.GetFirstName|U] la repele. La sangre rechaza la semilla."
 POD_asakku.0031.b: "Retirarte del intento."
 POD_asakku_cancel_scheme_tt: "Cancelar la conjura de Infección del alma."
 POD_asakku.0032.t: "La semilla echa raíces"
 POD_asakku.0032.desc: "Está hecho. La infección ha arraigado. Lo sientes, como sientes tu propio latido en la sangre de otro. [defender.GetSheHe|U] aún no sabe qué le ha ocurrido a [defender.GetHerHim]. Lo sabrá.\n\nLa voz en tus pensamientos señala la culminación como un artesano señala una obra terminada. Hay en ello una satisfacción, de algún tipo, pero esa satisfacción no es del todo tuya. Tú eres quien hizo el trabajo. La entidad es aquella para quien se hizo. Se está volviendo difícil, en noches como esta, saber quién sostenía las riendas."
 POD_asakku.0032.a: "Más manos en el mundo."
 POD_asakku.0033.t: "Resistencia"
 POD_asakku.0033.desc: "El intento fracasa. Algo en la sangre de [defender.GetFirstNamePossessive] resiste, no por comprensión ni por fe, sino por la simple terquedad de una maldición bíblica que advierte cuándo algo está profundamente mal y no debería estar ahí."
 POD_asakku.0033.a: "[defender.GetSheHe|U] es más fuerte de lo esperado."
 POD_asakku.0034.t: "Algo ha cambiado"
 POD_asakku.0034.desc: "Despiertas con una voz que no es tuya. No habla con palabras. Habla con ansia, con paciencia y con una certeza que nada tiene que ver con la fe. Has cambiado.\n\nLa Vicisitud que ha estado contigo durante siglos se siente ahora distinta, como si hubiera recordado algo que había olvidado. Cuando la buscas esta noche, algo te busca a ti. La disciplina no te ha sido arrebatada; solo ha revelado que nunca fuiste su único dueño.\n\nSigues siendo tú. En su mayor parte. La parte de ti que aún es tú ya intenta identificar qué es la otra parte y ya descubre que esa es una pregunta más difícil de lo que debería."
 POD_asakku.0034.a: "¿En qué me he convertido?"
 POD_asakku.0035.t: "Has resistido"
 POD_asakku.0035.desc: "Alguien intentó plantar algo en tu sangre. Esta vez lo has repelido. El recuerdo de la intrusión perdura como un sabor que no logras identificar.\n\nFuera lo que fuese, no le interesabas tú en concreto, sino la Vicisitud, y tú eras solo la habitación donde esta resultaba vivir. El pensamiento no es reconfortante. Implica, entre otras cosas, que el siguiente intento no requerirá un esfuerzo nuevo. La habitación sigue ahí. Alguien ha cartografiado ya la puerta."
 POD_asakku.0035.a: "Tendré más cuidado."

 # Kamut Recruitment scheme event chain
 POD_asakku.0250.t: "Una propuesta"
 POD_asakku.0250.desc: "[attacker.GetSheHe|U] se te acerca como se acercan los portadores de un conocimiento terrible: con cuidado, con la paciencia específica de quien ha aprendido que casi nadie quiere oír lo que tiene que decir.\n\nLas pruebas no son dramáticas. Un patrón de cambios de comportamiento en $pod_cainites$ que portan Vicisitud. Una serie de desapariciones en cortes que, al ponerlas sobre el mapa, apuntan a un único punto del que irradian, en el Cáucaso. Nombres que aparecen en informes de inteligencia y luego dejan de aparecer, no porque esos individuos hayan muerto, sino porque han dejado de ser, en cualquier sentido significativo, ellos mismos.\n\nEl Elioud que te trae esto no parece un cazador. [attacker.GetSheHe|U] parece cansado, como alguien que ha cargado a solas con este conocimiento más tiempo del que es sano.\n\n[attacker.GetSheHe|U] te pide que cargues con parte de él."
 POD_asakku.0250.a: "Negarte. Esta no es mi lucha."
 POD_asakku.0250.b: "Aceptar. Muéstrame qué nos caza."
 POD_asakku.0251.t: "Un nuevo cazador"
 POD_asakku.0251.desc: "[defender.GetFirstName|U] acepta. No con entusiasmo, lo que sería preocupante, ni con reticencia, lo que sería inútil. [defender.GetSheHe|U] acepta con la lúgubre claridad de quien ha examinado las pruebas y ha comprendido lo que significan. Esa es la clase de aceptación que perdura.\n\nLe muestras los protocolos. Las agujas de hierro que Yamadanda diseñó para marcar a los corrompidos. Las señales que buscar en un $pod_cainite$ cuya Vicisitud ha empezado a responder a algo distinto de su dueño. El silencio específico que cae sobre una corte donde la infección ha arraigado.\n\n[defender.GetSheHe|U] lo asimila. Para su mérito, [defender.GetSheHe] no se inmuta. Cuando terminas, [defender.GetSheHe] te hace la pregunta que hace todo nuevo cazador, la que separa a los que durarán de los que no: «¿Cómo sabremos que hemos ganado?»\n\nLe das la respuesta que da todo cazador veterano: «No lo sabremos. Solo sabremos que aún no hemos perdido.»"
 POD_asakku.0251.a: "Bienvenido al kamut."
 POD_asakku.0252.t: "Reclutamiento rechazado"
 POD_asakku.0252.desc: "[defender.GetFirstName|U] escucha. [defender.GetSheHe|U] reflexiona. Y entonces [defender.GetSheHe] declina, como declinan las personas razonables las peticiones irrazonables, con la cuidadosa cortesía de quien ha decidido que quien le habla está equivocado o enfermo.\n\nNo puedes culpar a [defender.GetHerHim]. Las pruebas, expuestas ante alguien que no ha pasado años aprendiendo a leerlas, parecen paranoia. Patrones en desapariciones de cortes. Cambios de comportamiento que podrían explicarse por una docena de causas mundanas. Una teoría de la conspiración sobre una entidad antigua que cabalga en la sangre de los portadores de Vicisitud. A oídos de un profano suena exactamente como lo que un $pod_cainite$ se cuenta a sí mismo cuando la Larga Noche se ha alargado demasiado y las sombras empiezan a parecer tener intenciones.\n\nGuardas las pruebas. Le agradeces [defender.GetHerHis] tiempo. Sales a la noche sabiendo que, la próxima vez que veas a [defender.GetHerHim], estarás atento a las señales. Porque la entidad no necesita creyentes. Solo necesita portadores."
 POD_asakku.0252.a: "Habrá otros."

 # Decision events
 POD_asakku.0301.t: "Inducción de Sangre"
 POD_asakku.0301.desc: "La entidad que emerge del pozo no da, sustituye. Abres la vena y dejas que el prisionero beba hasta que [target.GetSheHe] ya no esté vacío.\n\n[target.GetSheHe|U] se resiste al principio. Luego el sabor llega a [target.GetHerHim] y la resistencia termina. [target.GetSheHe|U] bebe, más allá del punto en que la sangre corriente habría dejado de ser interesante. [target.GetSheHe|U] bebe hasta que algo en [target.GetHerHis] rostro cambia: una leve flacidez en la comisura de la boca, una quietud en los ojos que antes no estaba.\n\nPor la mañana [target.GetSheHe] despertará y algo que antes no estaba mirará a través de [target.GetHerHis] ojos. [target.GetSheHe|U] no recordará el cambio como una violencia. [target.GetSheHe|U] lo recordará, si lo recuerda, como un regreso a casa."
 POD_asakku.0301.a: "Más manos en el mundo."
 POD_asakku.0302.t: "A la mañana siguiente"
 POD_asakku.0302.desc: "[target.GetFirstName|U] despierta desorientado, como esperabas. Lo que no esperabas es que te mire como mira un espejo, con una expresión que no es del todo [target.GetHerHis].\n\n[target.GetSheHe|U] habla con una voz que quizá no sea [target.GetHerHis].\n\nLo notas. Y la voz de tu sangre nota que lo has notado, y hay entre vosotros un momento de algo parecido a una diversión compartida cuya costura no logras localizar. No estás seguro, cuando dejas de reír, de cuál de los dos empezó."
 POD_asakku.0302.a: "Bien."
 POD_asakku.0310.t: "Sembrar el Jardín"
 POD_asakku.0310.desc: "La sangre se hunde más deprisa de lo que debería. Por la mañana, la hierba en el límite de tu propiedad ha adquirido un matiz rojizo. La voz en tus pensamientos está satisfecha de un modo en que rara vez lo está con las personas."
 POD_asakku.0310.a: "Que crezca."
 POD_asakku.0320.t: "Susurros del Alma"
 POD_asakku.0320.desc: "Extiendes la mano a través de la conexión. Cada vez cuesta menos esfuerzo. A través de la sangre que plantaste en ellos, sientes lo que sienten y aprendes lo que han aprendido."
 POD_asakku.0320.a: "El conocimiento es poder."

