 pod1230objectives_fae.140.a: "Fusionar el Sueño con la Tierra."
 fae_ending_tooltip: "Con la fusión de [UmbraGlossary('arcadia')] con la Tierra, tu partida habrá terminado, ya que el mundo que una vez conociste habrá cambiado para siempre."
 pod1230objectives_fae.140.b: "Aún tengo cosas que hacer."
 
 underbridge_kingdom_objective_decision: "Rey de Bajopuente"
 underbridge_kingdom_objective_decision_desc: "Al asegurar cada vez más puentes, expandes el señorío de Bajopuente hasta convertirlo en un poderoso reino. Tendrás lo que te corresponde. Lástima del pobre viajero que no pueda pagar tus peajes."
 underbridge_kingdom_objective_decision_tooltip: "Te convertirás en el Rey de Bajopuente."
 underbridge_kingdom_objective_decision_confirm: "Nadie cruzará sin mi permiso"
 underbridge_kingdom_objective_decision_custom: "Soy capaz de usar la Guerra de los Puentes [casus_belli|E]"
 underbridge_kingdom_objective_decision_custom2: "$unlocks_sailable_major_rivers$"
