 prevent_black_death_anda_objective_decision: "Detener la Horda"
 prevent_black_death_anda_objective_decision_tooltip: "Evitarás la Profecía de la Rata deteniendo a los mongoles y atacando a sus guardaespaldas [Glossary('Anda','podgloss.anda')] para debilitarlos."
 prevent_black_death_anda_objective_decision_desc: "Esa Profecía de los Ratkin no está clara, pero tienes la sensación de que lidiar con las hordas mongolas y [Glossary('Anda','podgloss.anda')] puede ayudar."
 prevent_black_death_anda_objective_decision_confirm: "No más saqueos"
 
 destroy_inquisition_objective_decision: "Destruir la Inquisición de las Sombras"
 destroy_inquisition_objective_decision_tooltip: "Destruirás la Inquisición de las Sombras."
 destroy_inquisition_objective_decision_desc: "La Iglesia y su temida Inquisición persiguen a los paganos y a las hadas. Convierten mediante la espada, o torturan y queman hasta la muerte a los seguidores de los Antiguos Dioses y a los practicadores de las artes místicas. Sus sacerdotes utilizan el bautismo ritual sobre los niños changeling para robarles para siempre su naturaleza encantada y extinguir la chispa del Glamour. Los papas Celeste II e Inocente III han declarado la conversión violenta de Livonia mediante una Cruzada. Una bula papal ha declarado que luchar contra los paganos bálticos tiene el mismo rango que participar en la Cruzada por Jerusalén. Para que las hadas permanezcan en la Tierra, es hora de detener esto."
 destroy_inquisition_objective_decision_confirm: "Poner fin a la Era de la Quema"
 destroy_inquisition_objective_decision_before_last_date: "Este objetivo debe completarse antes del año [GetPlayer.MakeScope.ScriptValue('inquisition_spawn_year')|0]"
