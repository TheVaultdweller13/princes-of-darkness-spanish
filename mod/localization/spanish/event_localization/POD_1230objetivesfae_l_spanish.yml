 pod1230objectives_fae.150.t: "Rey de Bajopuente"
 pod1230objectives_fae.150.desc: "He asegurado más y más puentes, y he expandido mi señorío de Bajopuente hasta convertirlo en un poderoso reino. Tendré lo que me pertenece. Lástima del pobre viajero que no pueda pagar mis peajes. Hadas siniestras y monstruos terribles acuden a mis estandartes y a la corriente oscura."
 pod1230objectives_fae.150.a: "Nadie cruzará sin mi permiso"
 
 pod1230objectives_fae.151.t: "Alto Rey de Bajopuente"
 pod1230objectives_fae.151.desc: "Con los ríos de toda Europa Oriental bajo tu control, el espeluznante espacio bajo tantos puentes será tu gran dominio. Nadie podrá cruzar las aguas rugientes sin tu consentimiento. Todos te pagarán lo que deben, mientras tú puedes mover criaturas de pura pesadilla al mundo con la misma facilidad con la que se da un paseo agradable."
 pod1230objectives_fae.151.a: "Nadie cruzará sin mi permiso"
 
 sidhe_house_dominance_beaumayn_objective_decision: "La Guerra de los Hermanos"
 sidhe_house_dominance_beaumayn_objective_decision_desc: "La Casa Beaumayn ha sido dividida por una amarga disputa clandestina entre los hermanos [GetScriptedCharacterByHistoryID('POD_fae_character_53').GetFirstName] y [GetScriptedCharacterByHistoryID('POD_fae_character_54').GetFirstName]. Todos los miembros de la casa están obsesionados con la fatal profecía final del Duque [GetScriptedCharacterByHistoryID('POD_fae_character_52').GetFirstName]: ¿promete el Camino de Hierro la salvación o la destrucción? La Casa determinará su camino a través de una guerra secreta."
 sidhe_house_dominance_beaumayn_objective_decision_tooltip: "Derrotarás el argumento del bando contrario, permanentemente."
 sidhe_house_dominance_beaumayn_objective_decision_confirm: "Resolver el debate de una vez por todas"
 brandell_victory_modifier: "Poseedor de la reversión"
 markesh_victory_modifier: "Heraldos del Éxodo"
 sidhe_house_dominance_beaumayn_objective_decision_custom: "[TARGET_CHARACTER.GetFirstName] debe estar muerto"
 
 pod1230objectives_fae.160.t: "Cisma de Hierro"
 pod1230objectives_fae.160.desc: "El debate sobre la profecía fatal final del Duque [GetScriptedCharacterByHistoryID('POD_fae_character_52').GetFirstName] se resuelve con la destrucción del bando contrario. A través de la sangre, la unidad de la casa ha sido restaurada, y tu liderazgo en la Casa Beaumayn no tiene cuestionamiento."
 pod1230objectives_fae.160.a: "¡Los seguidores de [GetScriptedCharacterByHistoryID('POD_fae_character_53').GetFirstName] han vencido y aplicarán la reversión!"
 pod1230objectives_fae.160.b: "Los Heraldos del Éxodo nos guiarán a todos por el Camino de Hierro"
 
 sidhe_house_dominance_dougal_objective_decision: "Del Oro al Acero"
 sidhe_house_dominance_dougal_objective_decision_desc: "La Casa Dougal es reconocida entre los Sidhe como herreros. En las maquinaciones de la política, muchos creen que la Casa Dougal es superflua, pero son sus dispositivos los que alimentan las intrigas de la Casa Eiluned. La impetuosa Fiona se pelea por sus hermosas creaciones. Los señores de la Casa Gwydion realizan sus grandes hazañas con espadas Dougal, revestidos con cota de malla Dougal. Mientras la mayoría de las otras casas se pelean, hacen pucheros y pierden el tiempo, Dougal trabaja, construye y crea. Ahora que el Bronce ha sido superado por el Hierro y el Acero, la Casa Dougal necesita crear un vasto arsenal de armas y armaduras. Los oficiales y talleres de los Dougal se centrarán en la creación de tal armería, pero no será barato."
 sidhe_house_dominance_dougal_objective_decision_tooltip: "Crearás un tesoro masivo de armas y armaduras"
 sidhe_house_dominance_dougal_objective_decision_confirm: "Un golpe de herrero equivale a cien golpes de orfebre"
 dougal_victory_modifier: "Del Oro al Acero"
 
 pod1230objectives_fae.161.t: "Del Oro al Acero"
 pod1230objectives_fae.161.desc: "Aunque ha supuesto un gran gasto, tu liderazgo sobre los maestros artesanos de la Casa Dougal ha construido una armería de un poder y alcance verdaderamente legendarios. Con armas como estas, las hadas pueden conquistar el mundo entero. ¡Miles que están en armas y esperan con ansias la Señal para ascender!"
 pod1230objectives_fae.161.a: "¡A las armas! ¡A las armas!"
 
 sidhe_house_dominance_eiluned_objective_decision: "Feudos Fortificados"
 sidhe_house_dominance_eiluned_objective_decision_desc: "La Casa de los Secretos ha conspirado con muchas entidades y poderes oscuros y misteriosos para reunir conocimientos mágicos. Con muchos videntes dotados, los Eiluned están prevenidos y, por tanto, buscan estar preparados. Con visiones y profecías del futuro, los arquitectos de Eiluned proponen fortificaciones elaboradas que anticipan cualquier tipo de asedio, llenas de pasadizos secretos, laberintos, agujeros de escape, matacanes y trampas de encantamientos mágicos. La construcción de tales fortificaciones tan elaboradas no será barata."
 sidhe_house_dominance_eiluned_objective_decision_tooltip: "Con la previsión, construir fortificaciones elaboradas"
 sidhe_house_dominance_eiluned_objective_decision_confirm: "Prevenidos y preparados"
 eiluned_victory_modifier: "Feudos Fortificados"
 
 pod1230objectives_fae.162.t: "Feudos Fortificados"
 pod1230objectives_fae.162.desc: "Estar prevenido es estar preparado. Gracias a tu percepción sobrenatural de las posibilidades futuras, los arquitectos de la Casa Eiluned han construido elaboradas fortificaciones defensivas capaces de resistir cualquier tipo de asedio. Tus defensas están llenas de pasadizos secretos, laberintos, agujeros de escape, matacanes y trampas de encantamientos mágicos. Por fin, te sientes seguro."
 pod1230objectives_fae.162.a: "¡Que vengan mis enemigos; serán destrozados contra las piedras!"
 
 sidhe_house_dominance_fiona_objective_decision: "Gran Amante"
 sidhe_house_dominance_fiona_objective_decision_desc: "Para los Fiona, es mucho mejor ser amado que temido. Prácticamente todos los Fiona son románticos; se entregan con alegría al amor cortés y crean elaborados juegos y rituales en torno a todos los asuntos del corazón. Las cortes de los Fiona son lugares de belleza y pasión, a menudo llenos de intrigas juguetonas, encuentros secretos y amores prohibidos. Los Fiona pueden ganar fama teniendo una gran destreza en el acto de hacer el amor, aumentando su ya sobrenatural atractivo, y también teniendo amantes variados y poderosos que les resulten útiles en sus futuros conjuros."
 sidhe_house_dominance_fiona_objective_decision_tooltip: "Debes tener seis amantes interesantes."
 sidhe_house_dominance_fiona_objective_decision_confirm: "Amar con un amor que fue más que amor"
 sidhe_house_dominance_fiona_objective_decision_custom: "Tener #V 3#! personas grandiosas como [lovers|E]"
 sidhe_house_dominance_fiona_objective_decision_werewolf: "Tener a un [GetTrait('werewolf').GetName( GetPlayer )] como [lover|E]"
 sidhe_house_dominance_fiona_objective_decision_sidhe: "Tener a un [landed|E] [GetTrait('sidhe').GetName( GetPlayer )] como [lover|E]"
 sidhe_house_dominance_fiona_objective_decision_satyr: "Tener a un [GetTrait('satyr').GetName( GetPlayer )] como [lover|E]"
 fiona_victory_modifier: "Gran Amante"
 
 pod1230objectives_fae.163.t: "El más grande de los amantes"
 pod1230objectives_fae.163.desc: "Los bardos cantarán tus hazañas románticas con gran deseo en sus corazones para siempre. Has aprendido el arte del amor de la personificación mitológica de la lujuria: los Sátiros. Personificas la belleza de la más bella de los Sidhe. Has domado el feroz corazón de un hombre lobo enfurecido y lo has encadenado a tus deseos. Los grandes personajes abandonarían sus más grandiosos planes por una sola noche en tu cama. ¡Todos te amarán y desesperarán!"
 pod1230objectives_fae.163.a: "Ámame, ámame, di que me amas" 
 
 sidhe_house_dominance_gwydion_objective_decision: "El Verdadero Rey"
 sidhe_house_dominance_gwydion_objective_decision_desc: "Con la Fractura, los Tuatha de Danaan han abandonado la Tierra para ir a [UmbraGlossary('arcadia')]. La Casa Gwydion, habituada desde hace mucho al papel de caballero andante, ha reconocido con la Fractura una nueva responsabilidad: liderar a toda la Buena Gente. Ahora era necesario que la Casa Gwydion reclamara tierras como propias y custodiara estas posesiones contra las depredaciones de los perdidos y desesperados. El fab Don de la Casa Gwydion, sobrino del rey de Venedot, [GetScriptedCharacterByHistoryID('POD_fae_character_84').GetFirstName], posee un linaje claro de Ogma y de la propia Danu. Los relatos dicen que el señor [GetScriptedCharacterByHistoryID('POD_fae_character_03').GetFirstName] estuvo presente en la coronación del primer Alto Rey que jamás gobernó y que obsequió al nuevo señor con un par de enormes grifos grises. Él afirma: «Si alguna vez la duda reclama el corazón de vuestros súbditos, que miren a los grifos, que serán los heraldos del verdadero Alto Rey». Los señores de la Casa Gwydion poseen valentía, ambición y linaje para liderar legítimamente a todo el Sidhe Luminoso hacia una renovada Edad de Oro. ¡Quién más podría emprender la búsqueda para encontrar y empuñar el rayo —la Espada de Luz— la hoja que trae la paz— [GetPODArtifact('caliburn_link').GetName], sino el Verdadero Rey!"
 sidhe_house_dominance_gwydion_objective_decision_tooltip: "Debes demostrar a todos que la Casa Gwydion es conocida en todo el mundo mediante un largo reinado en muchos Feudos, asegurando sitios venerados de glamour, adquiriendo artefactos maravillosos y logrando que se cuenten grandes epopeyas de tus hazañas; esto convencerá a toda la Buena Gente de tu legendario esplendor. Finalmente, una búsqueda para encontrar la espada del Verdadero Rey —Excalibur— [GetPODArtifact('caliburn_link').GetName] demostrará tu innegable majestad."
 sidhe_house_dominance_gwydion_objective_decision_confirm: "¡A la coronación!"
 sidhe_house_dominance_gwydion_objective_decision_custom: "Debes recuperar [GetPODArtifactName('caliburn_link')] de [great_chasm|E]"
 gwydion_victory_modifier: "Verdadero Rey"
 
 pod1230objectives_fae.164.t.king: "El Verdadero Rey Coronado"
 pod1230objectives_fae.164.t.queen: "La Verdadera Reina Coronada"
 pod1230objectives_fae.164.desc.king: "Gracias a tus esfuerzos heroicos, la Casa Gwydion con tu liderazgo ha demostrado ser la más noble de todos los Sidhe. ¡Quién más podría emprender la búsqueda para encontrar y empuñar el rayo —la Espada de Luz— la hoja que trae la paz— [GetPODArtifact('caliburn_link').GetName], sino tú, el Verdadero Rey! Toda la Buena Gente debe inclinarse ante tu majestad y reconocer tu soberanía absoluta."
 pod1230objectives_fae.164.desc.queen: "Gracias a tus esfuerzos heroicos, la Casa Gwydion con tu liderazgo ha demostrado ser la más noble de todos los Sidhe. ¡Quién más podría emprender la búsqueda para encontrar y empuñar el rayo —la Espada de Luz— la hoja que trae la paz— [GetPODArtifact('caliburn_link').GetName], sino tú, el Verdadero Rey! Toda la Buena Gente debe inclinarse ante tu majestad y reconocer tu soberanía absoluta." 
 pod1230objectives_fae.164.a: "Todos pueden ahora rendir pleitesía"
 
 sidhe_house_dominance_liam_objective_decision: "Canto mortal"
 sidhe_house_dominance_liam_objective_decision_desc: "La imaginación de los mortales ha quedado encarcelada dentro de los confines de la Iglesia. La Casa Liam lidera a la Buena Gente en su intento por comprender el dominio místico que la Iglesia ejerce sobre la humanidad. O bien se debe neutralizar la organización más tiránica de la Iglesia, o bien la Iglesia necesita que la Buena Gente se aleje de la banalidad. Si la Casa Liam tiene éxito, podrá dirigir el crecimiento de la humanidad hacia la creatividad."
 sidhe_house_dominance_liam_objective_decision_tooltip: "Integrar o neutralizar la Iglesia"
 sidhe_house_dominance_liam_objective_decision_confirm: "Mantente aquí mismo ante el Señor del canto" # With nothing, nothing on my tongue but Hallelujah
 sidhe_house_dominance_liam_objective_decision_custom1: "Has terminado la [decision|E] $destroy_inquisition_objective_decision$"
 sidhe_house_dominance_liam_objective_decision_custom2: "Tu fe es [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName] y has terminado la [decision|E] $constantinian_objective_decision$"
 sidhe_house_dominance_liam_objective_decision_custom3: "No debe haber ningún [independent_ruler|E] [GetTrait('supehunter').GetName( GetPlayer )] en el mapa"
 sidhe_house_dominance_liam_objective_decision_custom3_ex: "$sidhe_house_dominance_liam_objective_decision_custom3$ #weak ([example.GetFirstName])#!" 
 liam_victory_modifier: "Canto mortal"
 
 pod1230objectives_fae.165.t: "Canto mortal"
 pod1230objectives_fae.165.desc: "Está hecho. El rebaño ha aceptado a las hadas como sus pastores y guías. La Iglesia ya no será la amenaza para la Buena Gente que fue antaño, y toda la Buena Gente tiene a [ROOT.Char.GetFullName] que agradecer. Se cantarán alabanzas a la Casa [ROOT.Char.GetHouse.GetName] por toda la eternidad.\n\nCada hada en la tierra y en los cielos deberá considerar su relación con la Santa Iglesia y sus sagrados intercesores: los [ROOT.Char.GetHouse.GetName]. Rogad que elijan el camino recto de la salvación, o de lo contrario, el fauce abierta del infierno les aguarda por siempre jamás. ¡La Redención está al alcance! \n\nLos mortales ayudarán en todo lo que puedan creando grandes catedrales, arte magnífico y música triunfal, todo para la gloria de lo divino y sus santos mensajeros. ¡Construyamos una ciudad resplandeciente sobre la colina que sea un faro de esperanza y salvación para todos aquellos que tengan oídos para oír nuestro canto beatífico!"
 pod1230objectives_fae.165.a: "¡Aleluya!" 
 
 sidhe_house_dominance_aesin_objective_decision: "Mantente en Midgard"
 sidhe_house_dominance_aesin_objective_decision_desc: "Los seguidores del Dios Clavado se han extendido por las tierras nórdicas, alejando a la gente de sus pactos con los Aesir y los Vanir. Impostores vampiros llamados los [GetFaithByKey('viaeinherjar').GetName] están ocupando los antiguos templos de [GetTitleByKey('e_midgard').GetNameNoTier], incluido Uppsala, pervirtiendo nuestros antiguos ritos en su banal culto de sangre. Los [GetFaithByKey('getoffenris').GetName] del [GetTitleByKey('k_fimbul_winter').GetNameNoTier] rondan los páramos del norte de Suecia y deben ser sometidos. El [GetTitleByKey('d_crystal_fortress').GetNameNoTier] está en manos de los [GetFaithByKey('summer_court').GetName] [GetTrait('changeling').GetName( GetPlayer )] de la Casa [GetDynastyByID( 'POD_fae_dynasty_gwydion' ).GetBaseName] y legítimamente debería ser nuestro. Tomaremos nuestras antiguas y sagradas armas y reclamaremos nuestra Tierra Natal con sangre."
 sidhe_house_dominance_aesin_objective_decision_tooltip: "Reclama todo Midgard para los Aesin"
 sidhe_house_dominance_aesin_objective_decision_artifacts: "Debes poseer uno de estos artefactos nórdicos: [GetPODArtifactName('tapestry_of_fate_link')], [GetPODArtifactName('eilaf_link')], [GetPODArtifactName('kristrbani_link')], [GetPODArtifactName('odin_stone_link')]"
 sidhe_house_dominance_aesin_objective_decision_troll_vassals: "Tener dos [powerful_vassals|E] que sean del linaje [GetTrait('troll').GetName( GetPlayer )]."
 sidhe_house_dominance_aesin_objective_decision_troll_councillors: "Tener dos [councillors|E] que sean del linaje [GetTrait('troll').GetName( GetPlayer )]."
 sidhe_house_dominance_aesin_objective_decision_troll_bodyguard: "Tener un [GetTrait('troll').GetName( GetPlayer )] [GetCourtPositionType('bodyguard_court_position').GetName()]."
 sidhe_house_dominance_aesin_objective_decision_troll_knights: "Tener dos [knights|E] que sean del linaje [GetTrait('troll').GetName( GetPlayer )]."
 sidhe_house_dominance_aesin_objective_decision_confirm: "Mejor morir con honor que vivir con deshonor"
 aesin_victory_modifier: "Midgard preservada"
 
 pod1230objectives_fae.170.t: "Midgard preservada"
 pod1230objectives_fae.170.desc: "Con todas las criaturas sobrenaturales de Midgard bajo vuestro señorío, la cristianización de Escandinavia ha comenzado a revertirse. El pueblo nórdico honrará las antiguas costumbres y reverenciará a los Aesin como dioses en la Tierra.\n\n«Escuchad mis palabras, todas las clases de hombres, vosotros, hijos mayores y menores de Heimdall. Nos llamasteis, Aesin, para contar lo que recordamos de las hazañas más antiguas de dioses y hombres»."
 pod1230objectives_fae.170.a: "Mis cuervos vuelan cada día por todo el mundo." 
 
 sidhe_house_dominance_ailil_objective_decision: "Terminando la Guerra de las Estaciones"
 sidhe_house_dominance_ailil_objective_decision_desc: "La Casa Ailil prospera gracias al poder y ha perfeccionado sus habilidades con la diplomacia y la intriga. Las hadas Luminosas traicionaron el ciclo estacional habitual del trono y, con ello, han negado a los Ailil su turno legítimo de gobierno. Para restaurar el equilibrio, la Guerra de las Estaciones debe terminar. Si los Ailil logran poner fin a la Guerra de las Estaciones, su preeminencia entre todas las Casas Sidhe será inexpugnable."
 sidhe_house_dominance_ailil_objective_decision_tooltip: "Termina la Guerra de las Estaciones o reclama toda Irlanda y logra tu reconocimiento"
 sidhe_house_dominance_ailil_objective_decision_confirm: "Para todo hay una estación, y un tiempo para cada propósito"
 sidhe_house_dominance_ailil_objective_decision_custom: "La Contienda de la Guerra de las Estaciones ha terminado"
 ailil_victory_modifier: "Fin de la Guerra de las Estaciones"
 
 pod1230objectives_fae.171.t: "Ailil para todas las estaciones"
 pod1230objectives_fae.171.desc: "Con tus habilidades de intriga y diplomacia, has logrado poner fin al terrible conflicto que ha dividido a la Buena Gente durante tanto tiempo. Con tu liderazgo, la Casa Ailil se ha elevado por encima de las disputas mezquinas de las otras Casas Sidhe. Ahora, con la preeminencia de tu casa, los esfuerzos de la Buena Gente pueden centrarse en renovar los antiguos pactos con la humanidad. Creerán una vez más y para siempre."
 pod1230objectives_fae.171.a: "Un tiempo de guerra, y un tiempo de paz." 
 
 sidhe_house_dominance_balor_objective_decision: "Herencia de los Fomorianos"
 sidhe_house_dominance_balor_objective_decision_desc: "La Casa Balor rastrea su ascendencia hasta una línea de sidhe que mezcló su sangre con la de los Fomorianos. Creen que el Invierno Sin Fin está casi aquí, y que una mano firme debe guiar el timón para dirigir a las hadas a través de él. A través de su conexión con el $glossary_wyrm$, buscan alianzas entre los Oscuros con los Danzantes de la Espiral Negra y los Fomori. Dada la unión ancestral entre la Casa Balor y los Fomorianos, podría ser posible, mediante un ritual potente, fusionar a una hada con un poderoso espíritu de malicia para crear un híbrido hada-fomori: un Fomarca."
 sidhe_house_dominance_balor_objective_decision_tooltip: "Fusionarse con un espíritu de malicia para convertirse en un híbrido hada-fomori"
 sidhe_house_dominance_balor_objective_decision_confirm: "Invocar al Vagabundo de los Nexos"
 balor_victory_modifier: "Fomoriano"
 sidhe_house_dominance_balor_objective_decision_artifacts: "Debes poseer uno de estos artefactos de Balor: [GetPODArtifactName('balors_crystal_eye_link')], [GetPODArtifactName('steaming_spear_of_vengeance_link')], [GetPODArtifactName('cauldron_of_fear_link')] o Escoria de Sangre"

 pod1230objectives_fae.172.t: "Fomorianos por siempre"
 pod1230objectives_fae.172.desc.start: "La Casa Balor ha rastreado tu ascendencia hasta una línea de sidhe que mezcló su sangre con la de los Fomorianos. El Invierno Sin Fin está casi aquí, y necesitas guiar a las hadas a través de él, ya sea que consientan tu mandato o no. Has preparado el ritual para fusionar tu ser de hada con un poderoso espíritu de malicia para crear un híbrido hada-fomori: un Fomarca. El Ojo de Cristal de Balor brilla con un rojo apagado y irradia un gran calor."
 pod1230objectives_fae.172.desc.steaming_spear_of_vengeance: "Empuñando la [GetPODArtifact('steaming_spear_of_vengeance_link').GetName], lamas la sangre caliente de su hoja sintiendo cómo te invade la Furia."
 pod1230objectives_fae.172.desc.cauldron_of_fear: "Tras haber preparado la impura y mística mezcla, bebes profundamente del [GetPODArtifact('cauldron_of_fear_link').GetName]."
 pod1230objectives_fae.172.desc.blood_dross: "Al aplastar el diminuto vial de azúcar cristalizada, bebes la sangre vampírica contenida en la Escoria de Sangre y te llenas de Glamour Tenebroso."
 pod1230objectives_fae.172.desc.end: "Abres un sendero al [umbra|E] para convocar al Vagabundo de los Nexos.\nUn brillo negro aparece en el aire junto con un gemido vibrante y entrecortado. Sientes en la piel una sensación como si te rasparan una pizarra con las uñas. El aire apesta a un aroma miasmático que recuerda a una enfermedad cancerosa. El espíritu del $glossary_wyrm$ se manifiesta en un avatar repugnante y horroroso. Sus garras y colmillos desgarran tu carne y se introduce violentamente en tu cavidad torácica. Te invade un dolor insoportable. Y entonces...\nEstamos unidos. Por siempre."
 
 pod1230objectives_fae.172.a: "¡Somos el Fomarch!"

 sidhe_house_dominance_daireann_objective_decision: "Sanador-Guerrero"
 sidhe_house_dominance_daireann_objective_decision_desc: "La Casa obtuvo su noble posición cuando [GetScriptedCharacterByHistoryID('POD_fae_character_21').GetFirstName] curó a un señor de Gwydion, pero ganaron su verdadero respeto por el valor de su guerrero [GetScriptedCharacterByHistoryID('POD_fae_character_88').GetFirstName]. Los Daireann saben muy bien que la mano que puede curar también puede dañar. Una copa puede contener tanto veneno como un antídoto. Una hoja puede usarse para curar, y puede usarse para cortar el hilo de una vida."
 sidhe_house_dominance_daireann_objective_decision_martial: "Tienes una [education|E] [martial|E]"
 sidhe_house_dominance_daireann_objective_decision_martial_prowess: "Tienes una [education|E] de destreza [prowess|E] marcial"
 
 sidhe_house_dominance_daireann_objective_decision_tooltip: "Desarrolla tanto tu habilidad en la guerra como en la medicina"
 sidhe_house_dominance_daireann_objective_decision_confirm: "Para todo hay un tiempo"
 daireann_victory_modifier: "Sanador-Guerrero"
 
 pod1230objectives_fae.173.t: "Sanador-Guerrero"
 pod1230objectives_fae.173.desc: "Como líder de la Casa Daireann, te has esforzado por ejemplificar la naturaleza dual de sanador y guerrero. Tu mano puede curar y tu mano puede dañar. Eres como una copa que puede contener tanto veneno como un antídoto, como una hoja que puede usarse para curar o para cortar el hilo de una vida."
 pod1230objectives_fae.173.a: "Sanador-Guerrero" 
 
 sidhe_house_dominance_leanhaun_objective_decision: "La Maldición de Leanhaun"
 sidhe_house_dominance_leanhaun_objective_decision_desc: "La maldición secreta sobre [GetScriptedCharacterByHistoryID('POD_fae_character_15').GetFirstName] se extiende a toda su Casa y provoca que sus miembros envejezcan rápidamente sin rhapsodizar a los mortales. Se profetiza que no terminará «hasta que las estrellas lloren sangre y la tierra misma se enfríe bajo tus pies», lo cual parece poco probable que ocurra pronto. Normalmente, los Leanhaun encantan y rhapsodizan a una víctima mortal a la vez. Se especula que si se cultivan suficientes Soñadores y el Glamour de esos Soñadores es de gran cantidad, el impacto de la maldición podría mitigarse, si no eliminarse."
 sidhe_house_dominance_leanhaun_objective_decision_tooltip: "Mitigar la maldición explotando un criadero de Soñadores"
 sidhe_house_dominance_leanhaun_objective_decision_confirm: "Nuestros tormentos pueden convertirse en nuestros elementos"
 sidhe_house_dominance_leanhaun_objective_decision_custom: "Tener #V 7#! [dreamers|E]"
 sidhe_house_dominance_leanhaun_objective_decision_great: "Tener #V 3#! grandes personas como [dreamers|E]"
 leanhaun_victory_modifier: "Maldición de Leanhaun mitigada"
 
 pod1230objectives_fae.174.t: "La Maldición de Leanhaun"
 pod1230objectives_fae.174.desc: "Como líder de la Casa Leanhaun, has descubierto una forma de mitigar la maldición de toda tu dinastía. En lugar de limitarte a pasar de un mortal rhapsodizado a otro cuando tienes una necesidad desesperada, cultivas un gran criadero de mortales para la cosecha, incluyendo algunos grandes trofeos que rebosaban de Glamour. Al drenar repetidamente una reserva de Glamour tan grande, has sido capaz de mitigar la maldición."
 pod1230objectives_fae.174.a: "La Maldición de Leanhaun" 
 
 sidhe_house_dominance_varich_objective_decision: "Espíritus de los Rus"
 sidhe_house_dominance_varich_objective_decision_desc: "Los Inanimae, espíritus de la tierra y el cielo, siempre han sido los siervos de [GetScriptedCharacterByHistoryID('POD_fae_character_19').GetFirstName]; sus hijos. La tierra de Rusia antaño rebosaba de Inanimae. Estos espíritus formaban parte de todo para las hadas: la tierra, los ríos, sus Feudos y la interminable taiga que los rodeaba. Los Varich entienden cómo complacer a estos espíritus tanto como saben cómo usarlos. Los espíritus del hogar y la alcoba son tan poderosos y útiles como el tamaño y la magnificencia de sus Anclas, así como la cantidad de respeto que se les rinda, lo permitan. Ninguna posesión Varich está completa sin ellos, y ningún miembro de la Casa Varich insultará a sabiendas a estos espíritus serviciales. Refuerza las filas de la Casa Varich trayendo más Inanimae al vasallaje."
 sidhe_house_dominance_varich_objective_decision_phyla_vassals: "Tener cinco [powerful_vassals|E] que sean del grupo [GetTraitGroup('phyla').GetName()] de los Inanimae de la cultura [culture|E] rusa."
 sidhe_house_dominance_varich_objective_decision_culture: "Eres el [cultural_head|E]."
 sidhe_house_dominance_varich_objective_decision_tooltip: "Lidera la cultura rusa y ten muchos recipientes Inanimae"
 sidhe_house_dominance_varich_objective_decision_confirm: "Нет плохой земли, есть плохие хозяева" 
 # There is no bad earth, only bad owners
 varich_victory_modifier: "Espíritus de los Rus"
 
 pod1230objectives_fae.175.t: "Espíritus de los Rus"
 pod1230objectives_fae.175.desc: "Como líder de la Casa Varich, has cultivado una fuerte relación con los espíritus de la naturaleza de las tierras de los Rus. Estos espíritus formaban parte de todo para las hadas: la tierra, los ríos, sus Feudos y la interminable taiga que los rodeaba. Entiendes cómo complacer a estos espíritus tanto como sabes cómo usarlos. Los espíritus del hogar y la alcoba son tan poderosos y útiles como el tamaño y la magnificencia de sus Anclas, así como la cantidad de respeto que les hayas rendido. Las obligaciones de nobleza y servidumbre fluyen en dos direcciones, y los Inanimae están listos para actuar según tu voluntad."
 pod1230objectives_fae.175.a: "Son los espíritus de una buena tierra." 
 
 sidhe_house_dominance_scathach_objective_decision: "Edictos de los Oráculos Morfeanos"
 sidhe_house_dominance_scathach_objective_decision_desc: "Desde que [GetScriptedCharacterByHistoryID('POD_fae_character_17').GetFirstName] derrotó a Octriallach, el Rey Blanco de los Fomorianos, en la Guerra de los Árboles, los Oráculos Morfeanos han sido la fuerza determinante dentro de la Casa Scathach. Aunque los Edictos de los Oráculos Morfeanos no siempre tienen sentido para los miembros de la casa, esta se mantiene unida al seguirlos. Sin embargo, los Oráculos predijeron la calamidad si la Espada de Tethra entraba en el Corazón del [UmbraGlossary('dreaming')], y los Scathach atacaron a Gwydion cuando intentaba moverla. Durante la sangre derramada, la hoja desapareció en el Sueño circundante. Las consecuencias políticas de la batalla provocaron que los Scathach se convirtieran en una Casa exiliada y repudiada por los Luminosos. Aun así, los miembros de la casa siguen los Edictos de los Oráculos. A pesar de esta unidad, la Casa está dividida entre los changelings encargados de quedarse mientras la mayoría de los Sidhe huyen a [UmbraGlossary('arcadia')], y [GetScriptedCharacterByHistoryID('POD_fae_character_87').GetFirstName] y sus seguidores hadas primogénitos buscan en el [UmbraGlossary('sea_of_silver')] del [UmbraGlossary('deep_dreaming')] algo que preserve tanto el Mundo de Otoño como la derrota de los Fomorianos."
 sidhe_house_dominance_scathach_objective_decision_tooltip: ""
 sidhe_house_dominance_scathach_objective_decision_confirm: "Mantenerse en el Camino"
 sidhe_house_dominance_scathach_objective_decision_custom: "Se evita la [Glossary('Fractura','game_concept_shattering_desc')]"
 scathach_victory_modifier: "Edictos de los Oráculos Morfeanos"
 
 pod1230objectives_fae.180.t: "Edictos de los Oráculos Morfeanos"
 pod1230objectives_fae.180.desc.fae: "Aunque los Edictos de los Oráculos Morfeanos no siempre tienen sentido para los miembros de la casa, esta se mantiene unida al seguirlos. Como líder hada primogénito de la Casa Scathach, has viajado al [UmbraGlossary('deep_dreaming')] y al [UmbraGlossary('sea_of_silver')] para encontrar lo que se profetizó que sería hallado. ¿Será suficiente?"
 pod1230objectives_fae.180.desc.changeling: "Aunque los Edictos de los Oráculos Morfeanos no siempre tienen sentido para los miembros de la Casa Scathach, esta se mantiene unida al seguirlos. Como líder changeling de la Casa, has seguido estrictamente el mandato de Scathach de permanecer en el Mundo de Otoño incluso ante la creciente banalidad. ¿Será suficiente?"
 pod1230objectives_fae.180.a: "Como siempre, honramos a los Oráculos Morfeanos" 
 
 sidhe_house_dominance_danaan_objective_decision: "Guardia de los Soñadores"
 sidhe_house_dominance_danaan_objective_decision_desc: "La Casa Danaan recorre los múltiples caminos a través del [UmbraGlossary('dreaming')]. Custodian sus pasos y abren nuevas sendas. Guían a los soñadores y, mediante su Juramento del Dragón, obtienen el favor de muchas Chimera. Un líder de la casa que haya viajado lejos en el [UmbraGlossary('dreaming')] podría ser capaz de reunir una impresionante horda de Chimera para desatarla sobre el Mundo de Otoño cuando llegue el momento oportuno."
 sidhe_house_dominance_danaan_objective_decision_tooltip: "Viaja por el mundo y el [UmbraGlossary('dreaming')] y aprende sus secretos para construir un ejército de Chimera."
 sidhe_house_dominance_danaan_objective_decision_confirm: "Dos caminos se bifurcaban en la niebla, y yo tomé el menos transitado"
 danaan_victory_modifier: "Busca a la Guardia de los Soñadores"
 sidhe_house_dominance_danaan_objective_decision_traits: "Eres un [GetTrait('eshu').GetName( GetPlayer )], [GetTrait('lifestyle_traveler').GetName( GetPlayer )], [GetTrait('pilgrim').GetName( GetPlayer )] o un [GetTrait('adventurer').GetName( GetPlayer )]."
 sidhe_house_dominance_danaan_objective_decision_mount: "Tener una montura: [GetPODArtifactName('ship_of_the_four_quarters_link')], [GetPODArtifactName('nightmare_horse_link')], [GetPODArtifactName('sorn_link')], [GetPODArtifactName('vozhd_palanquin_link')], [GetPODArtifactName('sorel_link')], un caballo, un lobo, un oso, un león o un tigre" 

 sidhe_house_dominance_danaan_objective_decision_artifact: "Tener un tesoro útil para un viajero: Polvo de sendero, [GetPODArtifactNameWithFallback('pegasus_bridle_link',Localize('artifact_pegasus_bridle_name'))], $artifact_eye_of_opening_name$, [GetPODArtifactName('dreamstone_of_madoc_link')], [GetPODArtifactNameWithFallback('havens_compass_link',Localize('artifact_havens_compass_name'))], [GetPODArtifactNameWithFallback('broach_of_scrying_link',Localize('artifact_broach_of_scrying_name'))] o [GetPODArtifactName('tapestry_of_fate_link')]."

 pod1230objectives_fae.181.t: "Guardia de los Soñadores"
 pod1230objectives_fae.181.desc: "Como líder de la Casa Danaan, has recorrido los múltiples caminos a través del [UmbraGlossary('dreaming')]. Ahora custodias sus pasos y abres nuevas sendas. Has actuado como guía para muchos soñadores. Por tu Juramento al Dragón has ganado el favor de muchas Chimera. Has reunido una impresionante horda de Chimera que aguarda tus órdenes, dispuesta incluso a invadir el Mundo de Otoño cuando lo llames."
 pod1230objectives_fae.181.a: "¡Por la defensa de los pasos hacia Arcadia!"  
 

 become_santa_objective_decision: "Convertirse en Santa Claus"
 become_santa_objective_decision_desc: "Tienes un plan particularmente loco para evitar la pérdida de la inmortalidad que llegará con el Quebrantamiento. Al distribuir regularmente juguetes quiméricos a innumerables niños cada Navidad, vivirás eternamente gracias a su fe en ti. Te escribirán cartas solicitando ayuda. Honrarán las viejas costumbres y dejarán ofrendas para satisfacer tu insaciable Ansia."
 become_santa_objective_decision_before_last_date: "¡Debes convertirte en Santa Claus antes de la Peste Negra y el Quebrantamiento!"
 become_santa_objective_decision_winter_capital: "Debe ser invierno en tu capital"
 become_santa_objective_decision_court_antiquarian_excellent: "Debes emplear a un [GetTrait('boggan').GetName( GetPlayer )] o a un [GetTrait('nocker').GetName( GetPlayer )] [GetCourtPositionType('antiquarian_court_position').GetName()] con buena [aptitude|E]"
 become_santa_objective_decision_tooltip: "Te volverás inmortal distribuyendo juguetes quiméricos a innumerables niños cada Navidad"
 become_santa_objective_decision_deer_pooka: "Necesitas al menos un cortesano [GetTrait('pooka').GetName( GetPlayer )] con un [GetModifier('POD_pooka_deer_affinity_modifier').GetNameWithTooltip]. ¡Santa necesita un reno!"
 become_santa_objective_decision_elves: "Necesitas al menos tres cortesanos [GetTrait('nocker').GetName( GetPlayer )] y tres [GetTrait('boggan').GetName( GetPlayer )]. El taller de Santa necesita «elfos»."
 become_santa_objective_decision_confirm: "Me convertiré en Santa Claus, el Portador de Regalos"
 become_santa_objective_decision_louhi: "[GetScriptedCharacterByHistoryID('790633').GetFirstName] la Malvada puede intentar impedir tu ascensión; debe estar muerta o en $pod_torpor$" 
 become_santa: "¡Te conviertes en Santa Claus!"
 pod1230objectives_fae.1000.t: "¡Santa Eterno!"
 pod1230objectives_fae.1000.desc: "¡Se ha cumplido! Se han entregado regalos quiméricos a innumerables niños. ¡Innumerables niños creen en ti! ¡Sus sueños te llenan con una fuente inagotable de glamour! El mundo puede verse sacudido por guerras sangrientas, plagas horribles, inquisiciones espantosas y una banalidad que aplasta el alma, ¡pero tú perdurarás!\n\n #EMP 'En este día la tierra resonará \ncon el canto que los niños cantan \nal Señor, Cristo nuestro Rey, \nnacido en la tierra para salvarnos; \na él el Padre nos dio.\n\nSuyo es el destino, nuestro el júbilo; \ncuando bajó a la tierra, \nBelén vio su nacimiento; \nox y as a su lado \ndel frío lo habrían ocultado.\n\n La brillante estrella de Dios, sobre su cabeza, \na tres Reyes Magos guio hasta Ã©l; \nse arrodillan ante su lecho, \nponen sus dones ante él, \nle alaban y le adoran. \n\nEn este día cantan los ángeles; \ncon su canto la tierra resonará, \nalabando a Cristo, Rey del cielo, \nnacido en la tierra para salvarnos; \npaz y amor nos dio.\n\nIdeo, o, o, Ideo, o, o, \nideo gloria in excelsis Deo!'#!" 
 
# The Latin text is probably a musical parody of an earlier 12th century song beginning "intonent hodie voces ecclesie", written in honour of Saint Nicholas, the patron saint of Russia, sailors and children – to whom he traditionally brings gifts on his feast day, 6 December. https://en.wikipedia.org/wiki/Personent_hodie
 
 pod1230objectives_fae.1000.a: "¡Jo, jo, jo!"

 POD_region_borbetomagus: "Borbetomagus"
 POD_region_rhineland: "Renania"
 POD_region_rhineland_empire: "Renania Imperial"
 
 rhineland_duchy_objective_decision: "Reclamar Borbetomagus"
 rhineland_duchy_objective_decision_desc: "Las leyendas de Sigfrido, Gunther y los Nibelungos se siguen escuchando en cada hogar del pueblo germánico. Incluso los actuales Arzobispos mortales de Maguncia se llaman Sigfrido. La sede ancestral de los Gibichungos, la capital de la Antigua Borgoña, debería volver a estar bajo el control de las hadas. Tomar el control de Worms es el siguiente paso para reclamar el Rin para las hadas."
 rhineland_duchy_objective_decision_tooltip: "Asegurar la antigua capital de la Antigua Borgoña"
 rhineland_duchy_objective_decision_confirm: "Reclamar Borbetomagus"
# rhineland_duchy_objective_borbetomagus: "You [completely_control|E] the ancient capital of Borbetomagus, now called [GetTitleByKey('c_worms').GetNameNoTier], as well as [GetTitleByKey('c_speyer').GetNameNoTier] and [GetTitleByKey('c_kaiserslautern').GetNameNoTier]"
 rhineland_duchy_objective_rhineland_dejure: "[GetTitleByKey('d_rhineland').GetName] se convierte en el Señorío [de_jure|E] de [GetTitleByKey('c_worms').GetNameNoTier], [GetTitleByKey('c_speyer').GetNameNoTier] y [GetTitleByKey('c_kaiserslautern').GetNameNoTier]"
 rhineland_duchy_objective_rhineland_county_claims: "Ganar [unpressed_claims|E] sobre el Oberrhein ([GetTitleByKey('d_alsace').GetName] y los [counties|E] de [GetTitleByKey('c_breisgau').GetNameNoTier], [GetTitleByKey('c_sundgau').GetNameNoTier], [GetTitleByKey('c_colmar').GetNameNoTier], [GetTitleByKey('c_strassburg').GetNameNoTier], [GetTitleByKey('c_baden').GetNameNoTier], [GetTitleByKey('c_erbach').GetNameNoTier], [GetTitleByKey('c_frankfurt').GetNameNoTier] y [GetTitleByKey('c_mainz').GetNameNoTier]) y parte del Mittelrhein ([GetTitleByKey('c_koblenz').GetNameNoTier] y [GetTitleByKey('c_sayn').GetNameNoTier])."
 
 pod1230objectives_fae.1100.t: "¡Borbetomagus reclamado!"
 pod1230objectives_fae.1100.desc: "La sede ancestral de la Antigua Borgoña es ahora parte de tu señorío."
 pod1230objectives_fae.1100.a: "El camino hacia el Rin se abre ante mí."
 
 rhineland_kingdom_objective_decision: "Reino de Renania"
 rhineland_kingdom_objective_decision_tooltip: "Expandir el [GetTitleByKey('d_rhineland').GetName] en un [kingdom|E] propiamente dicho a lo largo del río Rin."
 rhineland_kingdom_objective_decision_desc: "Una vez establecido un tribunal en la antigua capital borgoñona de [GetTitleByKey('d_rhineland').GetName], todo Renania quedará abierto a la conquista. Cuando el Rin esté asegurado, la búsqueda del legendario tesoro de los Nibelungos —el [GetGlobalVariable('rhinegold').Artifact.GetName]— podrá comenzar en serio."
 rhineland_kingdom_objective_decision_confirm: "Celebrar la Coronación"
# rhineland_kingdom_objective_counties: "You [completely_control|E] the [GetTitleByKey('d_rhineland').GetName] and all counties along the river Rhine — Alpenrhein ([GetTitleByKey('c_grisons').GetNameNoTier], [GetTitleByKey('c_ravensburg').GetNameNoTier], [GetTitleByKey('c_sankt_gallen').GetNameNoTier]), Hochehein ([GetTitleByKey('c_grunningen').GetNameNoTier], [GetTitleByKey('c_furstenberg').GetNameNoTier], [GetTitleByKey('c_zurich').GetNameNoTier]), Oberrhein ([GetTitleByKey('c_breisgau').GetNameNoTier], [GetTitleByKey('c_sundgau').GetNameNoTier], [GetTitleByKey('c_colmar').GetNameNoTier], [GetTitleByKey('c_strassburg').GetNameNoTier], [GetTitleByKey('c_speyer').GetNameNoTier], [GetTitleByKey('c_baden').GetNameNoTier], [GetTitleByKey('c_erbach').GetNameNoTier], [GetTitleByKey('c_worms').GetNameNoTier], [GetTitleByKey('c_kaiserslautern').GetNameNoTier], [GetTitleByKey('c_frankfurt').GetNameNoTier], [GetTitleByKey('c_mainz').GetNameNoTier]), Mittelrhein ([GetTitleByKey('c_koblenz').GetNameNoTier], [GetTitleByKey('c_sayn').GetNameNoTier]), Niederrhein ([GetTitleByKey('c_cologne').GetNameNoTier], [GetTitleByKey('c_bergh').GetNameNoTier], [GetTitleByKey('c_dortmund').GetNameNoTier], [GetTitleByKey('c_cleves').GetNameNoTier]) and Deltarhein ([GetTitleByKey('c_zutphen').GetNameNoTier], [GetTitleByKey('c_guelders').GetNameNoTier], [GetTitleByKey('c_maastricht').GetNameNoTier], [GetTitleByKey('c_antwerpen').GetNameNoTier], [GetTitleByKey('c_zeeland').GetNameNoTier], [GetTitleByKey('c_holland').GetNameNoTier].)"
 
 rhineland_duchy_objective_rhineland_duchy_claims: "Ganar [pressed_claims|E] sobre todos los [duchies|E] del río Rin: [GetTitleByKey('d_currezia').GetNameNoTier], [GetTitleByKey('d_augsburg').GetNameNoTier], [GetTitleByKey('d_swabia').GetNameNoTier], [GetTitleByKey('d_alsace').GetNameNoTier], [GetTitleByKey('d_west_franconia').GetNameNoTier], [GetTitleByKey('d_lower_lorraine').GetNameNoTier], [GetTitleByKey('d_julich').GetNameNoTier], [GetTitleByKey('d_gelre').GetNameNoTier], [GetTitleByKey('d_brabant').GetNameNoTier] y [GetTitleByKey('d_holland').GetNameNoTier]."
 
 POD_rhinegold_heist_tt: "Has ganado acceso a una [infiltration_mission|E] para recuperar el [GetGlobalVariable('rhinegold').Artifact.Custom('ColorizedArtifactName')]."

 pod1230objectives_fae.1200.t: "¡Rey del Rin!"
 pod1230objectives_fae.1200.desc: "Todo el río Rin está ahora bajo tu control. El Oro del Rin debe estar escondido en algún lugar de este río místico."
 pod1230objectives_fae.1200.a: "En la tierra del Rin, sé... ¡rey, rey, rey, rey!" 
 
 rhineland_empire_objective_decision: "Imperio del Rinlandia"
 rhineland_empire_objective_decision_tooltip: "Expande el [GetTitleByKey('k_rhineland').GetName] a lo largo del río para que se convierta en un [empire|E]."
