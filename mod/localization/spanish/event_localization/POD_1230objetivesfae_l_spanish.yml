 prevent_black_death_cat_objective_decision: "¡Gatitos!"
 prevent_black_death_cat_objective_decision_tooltip: "Evitarás la Profecía de la Rata haciendo que todo el mundo adore a los gatos."
 prevent_black_death_cat_objective_decision_desc: "Claramente, para evitar la Profecía de la Rata, ¡deberías hacer que todo el mundo ame a los gatos!"
