 prevent_black_death_rat_objective_decision: "Conjuras de los Ratkin"
 prevent_black_death_rat_objective_decision_desc: "Muchos Videntes de las hadas están teniendo sueños proféticos sobre un evento cataclísmico en el futuro que matará a millones de Soñadores. Los detalles son vagos, pero parece que involucra hordas de ratas que vienen del amanecer, pilas de cadáveres ardiendo, esqueletos danzantes, dedos y pies ennegrecidos. Algunas hadas están convencidas de que los Ratkin y sus accesorios de la Wyrm enfermiza deben ser destruidos."
