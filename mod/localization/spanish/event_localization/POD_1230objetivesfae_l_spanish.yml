 underbridge_king_modifier: "Rey de Bajopuente"
 
 underbridge_empire_objective_decision: "Alto Rey de Bajopuente"
 underbridge_empire_objective_decision_desc: "Cuando los ríos de toda Europa Oriental caigan bajo tu control, el aterrador espacio debajo de tantos puentes será tu gran dominio. Nadie podrá moverse sobre las aguas rugientes sin tu consentimiento. Todos te pagarán lo que te deben, mientras tú puedes mover criaturas de pura pesadilla al mundo tan fácilmente como si fuera un agradable paseo."
 underbridge_empire_objective_decision_tooltip: "Te convertirás en el Alto Rey de Bajopuente."
 underbridge_empire_objective_decision_confirm: "Nadie cruzará sin mi permiso"
 underbridge_empire_objective_decision_custom: "Cada condado de la Ribera tomado mediante la [casus_belli|E] de la Guerra de los Puentes se convertirá en un [counties|E] [de_jure|E] de [GetTitleByKey('e_underbridge').GetNameNoTier]"
 underbridge_empire_objective_decision_riverside_county_contol_tt: "Has [completely_control|E] cada uno de los [counties|E] de la Ribera de [GetTitleByKey('e_shadow_curtain').GetNameNoTier] ([SCOPE.ScriptValue('underbridge_empire_controlled_riverside_county_value')|0]/[SCOPE.ScriptValue('underbridge_empire_total_riverside_county_value')|0])"
