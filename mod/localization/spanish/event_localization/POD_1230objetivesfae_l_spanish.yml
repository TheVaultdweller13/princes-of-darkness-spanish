 prodigal_objective_decision: "Traer de vuelta a los Pródigos"
 prodigal_objective_decision_tooltip: "Recordarás a los Pródigos quiénes son."
 prodigal_objective_decision_desc: "Según las creencias de las hadas, los vampiros, hombres lobo, magos, momias y fantasmas son todas razas de hadas que han olvidado sus orígenes en el [UmbraGlossary('dreaming')]. Aunque los mitos de creación individuales de cada una de estas razas sobrenaturales contradicen ciertamente esta idea, las posibilidades ilimitadas presentes en el Sueño ciertamente significan que podría ser verdad. Las hadas se refieren a estos otros seres sobrenaturales como «Pródigos». Los Pródigos han olvidado sus orígenes en el [UmbraGlossary('dreaming')], es hora de recordarles quiénes son."
 prodigal_objective_decision_confirm: "Volved a casa, hijos descarriados"
 prodigal_objective_decision_custom: "No debe haber ningún [independent_ruler|E] sin el rasgo de hada y con opinión negativa hacia ti en el mapa"
 prodigal_objective_decision_custom_ex: "$prodigal_objective_decision_custom$ #weak ([example.GetFirstName])#!"
 prodigal_objective_decision_custom1: "Todos los demás seres sobrenaturales serán renombrados como pródigos"
 prodigal_objective_decision_custom2: "Los seres sobrenaturales Pródigos aceptarán siempre tu oferta de vasallaje"
 prodigal_objective_decision_osiris_flail: "Debes poseer el [GetPODArtifactName('osiris_flail_link')], que registró toda la historia."
 prodigal_objective_decision_tapestry_of_fate: "Debes poseer el [GetPODArtifactName('tapestry_of_fate_link')], que contiene cada [Glossary('Nombre Verdadero','podgloss.truename')] que existe, así como el destino del [UmbraGlossary('dreaming')]."
 prodigal_objective_decision_book_of_nod: "Debes reunir el [GetPODArtifactName('book_of_nod_link')], que contiene la historia de los Cainitas." 
 prodigal_objective_decision_baizetu: "Debes reunir los cinco fragmentos del [GetPODArtifactName('baizetu_link')], el legendario grimorio escrito por el Emperador Amarillo que contiene los secretos de los 11.520 tipos de criaturas sobrenaturales."  
 prodigal_objective_decision_ural: "[completely_control|E] el señorío del Túmulo de la Luna Creciente ([GetTitleByKey('b_voronezh').GetNameNoTier]), fundado durante el Impergium."
 prodigal_objective_decision_book_of_the_spirits_secrets: "Debes poseer el [GetPODArtifactName('book_of_the_spirits_secrets_link')]"
 prodigal_objective_decision_mayo: "[completely_control|E] la Corte de Todos los Reyes ([GetTitleByKey('c_mayo').GetNameNoTier])."
 prodigal_objective_decision_enoch: "[completely_control|E] las ruinas de Enoc ([GetTitleByKey('c_edessa').GetNameNoTier]), la Primera Ciudad de los Cainitas"
 prodigal_objective_decision_giza: "[completely_control|E] el Valle de los Reyes ([GetTitleByKey('c_giza').GetNameNoTier]), hogar de la necrópolis de los faraones y de la Gran Pirámide."
 prodigal_objective_decision_khotan: "[completely_control|E] [GetTitleByKey('c_khotan').GetNameNoTier], capital del reino de Hsien"
 pod1230objectives_fae.100.t: "La Profecía de la Rata"
 pod1230objectives_fae.100.desc: "En los primeros años del siglo XIII, los inviernos se hicieron largos y fríos y las lluvias caían con una duración similar a la de un monzón. Las cosechas se ahogaron. Los caminos quedaron reducidos a pantanos de lodo. El hambre y el frío hicieron su parte para llenar los cementerios. Existen sueños proféticos sobre un evento cataclísmico en el futuro que matará a millones de soñadores. Los detalles son vagos, pero parece involucrar hordas de ratas que vienen desde el amanecer, pilas de cadáveres ardiendo, esqueletos danzantes, dedos y pies ennegrecidos. Algunas hadas están convencidas de que los Ratkin y sus aliados de la Wyrm deben ser destruidos.\nTu Vidente ha hablado, diciendo que ha visto un futuro oscuro peor que la Fractura: la Profecía de la Rata. Deberías centrarte en la sanación durante el próximo siglo para asegurarte de que no ocurra."
 pod1230objectives_fae.100.a: "¡Los Ratkin y sus accesorios!"
 pod1230objectives_fae.100.b: "¡Para detener a las ratas, necesitamos gatos!"
 unlock_convert_to_catlover_scheme: "Desbloquear la interacción $POD_convert_to_catlover_interaction$ [interaction|E]."
 pod1230objectives_fae.100.c: "¡La horda mongola tiene la culpa!"
 
 pod1230objectives_fae.101.t: "La Conjura de los Ratkin"
 pod1230objectives_fae.101.desc: "Se fragmentó un plan oscuro por parte de los viles Ratkin; crearon la enfermedad más mortal jamás conocida: la Peste Negra. Te alegras de haberlos detenido antes de que la liberaran por completo sobre el mundo."
 pod1230objectives_fae.101.a: "Ratas asquerosas."
 
 pod1230objectives_fae.102.t: "CATástrofe"
 pod1230objectives_fae.102.desc: "Ahora todo el mundo adora a los gatos; la Profecía del Ratón no se cumplirá, pero puede que surja otro problema con el que lidiar."
 pod1230objectives_fae.102.a: "Oh, cielos..."
 
 pod1230objectives_fae.103.t: "Azote"
 pod1230objectives_fae.103.desc: "La Horda Mongola se está frenando gracias a ti, y tu Vidente confirma que has detenido un futuro de mongoles catapultando ratas muertas durante los asedios que podría haber propagado una pandemia."
 pod1230objectives_fae.103.a: "Tenía razón."
 
 pod1230objectives_fae.110.t: "Cuarta Era"
 pod1230objectives_fae.110.desc: "Antaño servidores de los dioses más poderosos en la jerarquía celestial, los Hsien eran responsables de responder a las plegarias de los mortales de acuerdo con los deseos de sus superiores. Durante los terribles sucesos de la Guerra del Río Dragón al principio de la [Glossary('Cuarta Era','game_concept_fourth_age_desc')], y la caída de los [Glossary('Wan Xian','game_concept_kuei_jin_desc')] en la [Glossary('Tercera Era','game_concept_third_age_desc')], muchos Shinma se rebelaron contra su posición en la Burocracia Celestial, ya fuera para ayudar a los mortales o para volverse contra ellos. Como resultado, fueron castigados por la Persona Augusta. Aquellos que se atrevieron a situarse en la posición de los [Glossary('Wan Xian','game_concept_kuei_jin_desc')] fueron expulsados y obligados a vivir entre los mortales del Reino Medio."
 pod1230objectives_fae.110.a: "¿Me equivoco?"
 pod1230objectives_fae.110.a.t: "Estás obligado a ser un changeling; obtendrás automáticamente un heredero clon tras tu muerte natural. Completa tu objetivo para volver a ser fae."
 
 pod1230objectives_fae.111.t: "Tao Te Hsien"
 pod1230objectives_fae.111.desc: "Al estudiar el Nei Tan y obtener el nido de dragón más poderoso, te has convertido en Tao Te Hsien y ahora puedes comulgar con el Cielo de nuevo."
 pod1230objectives_fae.111.a: "He vuelto"
 
 pod1230objectives_fae.120.t: "Fin de la Inquisición"
 pod1230objectives_fae.120.desc: "La creación de la Inquisición fue la culminación del Cisma, mientras la Iglesia, en sus búsquedas doctrinales, intentaba eliminar del mundo todos los elementos sobrenaturales indeseables, incluidos las hadas. Pero ahora ha terminado."
 pod1230objectives_fae.120.a: "¡Más supersticiones!"
 
 pod1230objectives_fae.121.t: "El regreso de los Pródigos"
 pod1230objectives_fae.121.desc: "Todos los demás moradores sobrenaturales del Mundo de Tinieblas son facciones de las hadas que han olvidado sus orígenes en el [UmbraGlossary('dreaming')]. Ahora han vuelto en sí."
 pod1230objectives_fae.121.a: "Bienvenido de vuelta."
 
 POD_fae_maintenance.21.t: "El Quebranto"
 POD_fae_maintenance.21.desc: "No pudiste evitar la Profecía.\nCon el tiempo, los hilos se tensaron tanto entre el reino mortal y el [UmbraGlossary('dreaming')] que empezaron a romperse. Esta ruptura ha traído la [Glossary('Fractura','game_concept_shattering_desc')]. No solo ha roto los vínculos entre [UmbraGlossary('arcadia')] y la Tierra, sino que también ha desvanecido las esperanzas de que pudiera revertirse.\nDebes elegir una forma de lidiar con esto."
 POD_fae_maintenance.21.a: "Adopta el Camino del Changeling y renuncia a tu inmortalidad."
 POD_fae_maintenance.21.b: "Huye a Arcadia."
 POD_fae_maintenance.21.c: "Refúgiate en un Feudo" #Become a Lost One.
 POD_fae_maintenance.21.d: "Has encontrado tu propio camino hacia la inmortalidad."
 POD_fae_maintenance.21.d.tt: "El Quebranto no tiene ningún impacto en ti, personalmente."
 POD_fae_maintenance.22.t: "El Quebranto"
 POD_fae_maintenance.22.desc: "Con el tiempo, los hilos que se tensaron tanto entre el reino mortal y el [UmbraGlossary('dreaming')] empezaron a romperse. Esta ruptura es la [Glossary('Fractura','game_concept_shattering_desc')]. No solo ha roto los vínculos entre [UmbraGlossary('arcadia')] y la Tierra, sino que también ha desvanecido las esperanzas de que pudiera revertirse."
 POD_fae_maintenance.22.a: "¿Qué alegría?"
 
 POD_fae_maintenance.31.t: "El Interregno"
 POD_fae_maintenance.31.desc: "El período sin sidhe ni Hadas Verdaderas en la Tierra, con los «diluidos» changelings restantes teniendo que valerse por sí mismos después de las convulsiones finales de la [Glossary('Fractura','game_concept_shattering_desc')] alrededor del 1400 d. C. es el Interregno, ya que los changelings tuvieron que tratar de descubrir cómo sobrevivir por sí mismos."
 POD_fae_maintenance.31.a: "Nuestro tiempo se ha ido."
 POD_fae_maintenance.31.b: "Nuestro tiempo ha llegado."
 
 constantinian_objective_decision: "Integrarse en la Iglesia"
 constantinian_objective_decision_tooltip: "La Iglesia llegará a ver a las hadas como siervos sagrados de lo divino: ángeles, profetas, taumaturgos y los verdaderamente bendecidos."
 constantinian_objective_decision_desc: "En lugar de ver a la Iglesia como un enemigo al que oponerse y detener, los Constantinianos la ven como un misterio que debe ser revelado, estudiado y guiado. Una vez que se comprenda el poder de las creencias de los mortales, quizá incluso las Nieblas regresen a su equilibrio más benévolo y las hadas puedan cosechar el glamour de la creatividad de los fieles."
 constantinian_objective_decision_confirm: "Establecer el Catecismo Constantiniano"
 constantinian_objective_decision_custom_artifact: "Debes poseer una de las reliquias sagradas [artifacts|E] del cristianismo: el Santo Grial, un Fragmento de la Santa Cruz, la Lámpara de Constantino, el Flagelo de la Pasión, la Lanza de la Destino, el Cáliz de Valencia o la Trompeta de Gabriel."
 constantinian_objective_decision_custom_byzantion: "El poseedor de [GetTitleByKey('c_byzantion').GetNameNoTier] debe ser un [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] o un [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]"
 constantinian_objective_decision_custom_roma: "El poseedor de [GetTitleByKey('c_roma').GetNameNoTier] debe ser un [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] o un [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]"
 constantinian_objective_decision_custom_jerusalem: "El poseedor de [GetTitleByKey('c_jerusalem').GetNameNoTier] debe ser un [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] o un [GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]" 
 constantinian_objective_decision_custom1: "Los $POD_splat_hunter_plural$ dejarán de ver a las hadas como un enemigo incompatible. En su lugar, las hadas serán vistas como ángeles, profetas, taumaturgos o como seres especialmente bendecidos."
 constantinian_objective_decision_custom2: "Puede reclutar a [GetMaA('witchhunters').GetName] como [men_at_arms|E]"
 constantinian_objective_decision_custom3: "El cazador [GetFaithDoctrine('special_doctrine_constantinian_catechism').GetBaseName] siempre aceptará tu oferta de vasallaje"
 
 pod1230objectives_fae.122.t: "Catecismo Constantiniano"
 pod1230objectives_fae.122.desc: "Padre nuestro en los cielos,\nsantificado sea tu nombre.\nQue venga tu reino.\nQue tus Espíritus Sagrados desciendan sobre nosotros y nos limpien.\nHágase tu voluntad, tanto en la tierra como en el cielo.\nDanos cada día nuestro pan de mañana,\ny perdónanos nuestros pecados, pues nosotros mismos honramos nuestras Obligaciones.\nY no nos dejes caer en el tiempo de la prueba —el Quebranto—, ni nos tientes con la banalidad.\nPorque tuyos son el reino, el poder y la gloria por siempre."
 pod1230objectives_fae.122.a: "Amén."
 
 destroy_order_of_reason_objective_decision: "Más allá de la Razón"
 destroy_order_of_reason_objective_decision_tooltip: "Impedirás que la Orden de la Razón traiga más banalidad al mundo."
 destroy_order_of_reason_objective_decision_desc: "Los hombres de letras buscan vincular el mundo a la Razón y la Ciencia. Sus esfuerzos mundanos por catalogar, definir y limitar el mundo amenazan con poner fin a la creencia en lo misterioso e incontrolable. Los Craftmasons, sucesores del Collegium Praecepti de la antigua Roma en su nueva alianza con la Hermandad del Dominio, buscan vincular la realidad mediante regulaciones restrictivas, como una suerte de banales procuradores de las leyes de hierro frío de la Ars Praeclarus. Están rastreando las líneas ley para encontrar fuentes de glamour, que llaman nodos, que luego drenan y destruyen. En 1210 d. C., los Craftmasons destruyeron la Alianza de Mistridge con largos tubos de hierro forjado que disparaban bolas de hierro frío en un proceso que llaman «fuego de cañón». Se dice que la traidora y pródiga Casa Tremere, antaño magos herméticos —ahora vampiros—, ha contribuido a esta victoria de los Craftmasons. Estos «hombres razonables» masacraron a cada bruja y hada que pudieron encontrar en las ruinas de Mistridge y sus alrededores. ¡Deben ser detenidos a toda costa!"
 destroy_order_of_reason_objective_decision_confirm: "No más estasis"
 destroy_order_of_reason_objective_decision_before_last_date: "La fecha es 1851.1.1 o anterior"
 destroy_order_of_reason_objective_decision_custom: "La Orden de la Razón [title|E] debe ser destruida.\nDebes controlar los talleres de arsenales de hierro forjado de Innsbruck en el Ducado de Tiroles."
 destroy_order_of_reason_objective_decision_grimgroth: "[GetScriptedCharacterByHistoryID('505107').GetFirstName], el Azote de Mistridge, debe estar muerto o en $pod_torpor$"
 
 pod1230objectives_fae.130.t: "Más allá de la Razón"
 pod1230objectives_fae.130.desc: "Las maquinaciones de la Orden de la Razón han sido deshechas. Sus planes para vincular el mundo a la Razón y la Ciencia se han frustrado. Sus talleres de hierro frío han sido silenciados. Con los Tremere destruidos, su Guerra Massasa con la Orden de Hermes terminó en derrota para los Brujos Usurpadores no-muertos. Las casas herméticas unidas pudieron dirigir toda su atención y furor hacia la destrucción de Mistridge contra los Craftmasons y su furtiva alianza con eruditos de ideas afines, avaros tacaños, puritanos moralistas y otros propagadores de la banalidad. Sin los filósofos «racionales», la humanidad ya está regresando a sus antiguas creencias y a sus antiguos pactos con las hadas para dar sentido al mundo fantástico y sobrevivir en él."
 pod1230objectives_fae.130.a: "Hay más cosas en el cielo y en la Tierra de las que tu filosofía es capaz de soñar"
 
 inert_cold_iron_objective_decision: "Hierro Frío Inerte"
 inert_cold_iron_objective_decision_tooltip: "Alterarás la «realidad» científica, buscando una forma de transmutar o cambiar de otro modo las propiedades del hierro frío para volverlo inerte."
 inert_cold_iron_objective_decision_desc: "Las hadas luchan por comprender por qué el hierro frío les daña. Puede causar la destrucción permanente de un espíritu de hada. [GetScriptedCharacterByHistoryID('POD_fae_character_04').GetFirstName] dio su vida para intentar romper el dominio del hierro frío sobre las hadas. Muchos creen que el hierro representa la fuerza de la Fractura; la división filosófica entre la humanidad y el [UmbraGlossary('dreaming')] incorporado... hecho carne. No se formó por ninguna «cosa», sino como un efecto «natural» cuando la Banalidad alcanzó un nivel crítico. Las hadas deben estudiar el hierro frío y, de algún modo, volverlo inerte."
 inert_cold_iron_objective_decision_confirm: "¡Transmuta el paradigma!"
 inert_cold_iron_objective_decision_before_last_date: "La fecha es 1510.1.1 o anterior"
 inert_cold_iron_objective_decision_dougal: "Debes ser de la Casa [GetDynastyByID( 'POD_fae_dynasty_dougal' ).GetBaseName]."
 inert_cold_iron_objective_decision_strathcurach_forge: "Tú [completely_control|E] la Forja de Dougal en Stratchcruach ([GetTitleByKey('c_lennox').GetNameNoTier]), así como el ducado circundante de [GetTitleByKey('d_galloway').GetNameNoTier]"
 inert_cold_iron_objective_decision_valiant_forge: "Tú [completely_control|E] la Forja Valerosa ([GetTitleByKey('c_warwickshire').GetNameNoTier]), así como los ducados de [GetTitleByKey('d_valiant_forge').GetNameNoTier] y [GetTitleByKey('d_hereford').GetNameNoTier]"
 inert_cold_iron_objective_decision_lost_forge: "Tú [completely_control|E] la Forja Perdida de Vulcano ([GetTitleByKey('c_messina').GetNameNoTier]), así como el ducado de [GetTitleByKey('d_sicily').GetNameNoTier]" 
 inert_cold_iron_objective_decision_anweyth: "Debes tener: la creación final sin par de Dougal, la Espada de la Invención, [GetPODArtifactName('anweyth_link')], hierro frío transformado en la primera espada de acero."
 inert_cold_iron_objective_decision_caliper_of_aife: "Debes tener el [GetPODArtifactName('caliper_of_aife_link')], que puede medir cualquier cosa."
 inert_cold_iron_objective_decision_achen: "Debes tener [GetPODArtifactName('achen_link')], el martillo de doble cara de Dougal"
 inert_cold_iron_objective_decision_vulcans_hammer: "Debes tener [GetPODArtifactName('vulcans_hammer_link')]"
 inert_cold_iron_objective_decision_gold_mines: "Gastas 10000 de oro o [completely_control|E] al menos una de estas minas de oro: [GetTitleByKey('b_turoc').GetNameNoTier], [GetTitleByKey('b_abrudbanya').GetNameNoTier], [GetTitleByKey('c_chalkidike').GetNameNoTier], [GetTitleByKey('c_allaqi').GetNameNoTier], [GetTitleByKey('b_wasulu').GetNameNoTier], [GetTitleByKey('b_diakha').GetNameNoTier], [GetTitleByKey('b_goundafa').GetNameNoTier]"
 inert_cold_iron_objective_decision_no_murder: "El hierro frío será vuelto inerte y ya no amenazará a los espíritus de las hadas. Todas las hadas Primogénitas dejarán de ser objetivos aptos para esquemas de asesinato."
 pod1230objectives_fae.131.t: "Hierro Frío Inerte"
 pod1230objectives_fae.131.desc: "Los «filósofos naturales» se equivocan al decir que el universo está sujeto a leyes rígidas y descubribles. Con gran esfuerzo, tiempo, gasto y pura fuerza de voluntad, has demostrado lo que todos los alquimistas que buscaron la Piedra Filosofal sospechaban. Al realizar miles de experimentos, perseveraste y finalmente lograste los resultados que buscabas. La realidad se doblega ante quienes tienen la mente y la confianza para materializar sus deseos. Si algo tan básico como la legendaria búsqueda de los alquimistas por transmutar el plomo en oro es posible, ¿por qué no podría anularse también la transmutación del hierro frío para neutralizar sus propiedades y destruir las almas inmortales de las hadas? ¡Eureka! ¡Lo has logrado!"
 pod1230objectives_fae.131.a: "¡La realidad es lo que yo diga que es!"
 
