l_spanish:
 POD_fae_house_event.1.t: "Cisma del Hierro"
 POD_fae_house_event.1.desc: "El debate sobre la profecía final y fatal del duque [GetScriptedCharacterByHistoryID('POD_fae_character_52').GetFirstName] se zanja con la destrucción del otro bando. A través de la sangre se ha restaurado la unidad de la casa y tu liderazgo sobre los Beaumayn es incuestionable."
 POD_fae_house_event.1.a: "¡Los seguidores de [GetScriptedCharacterByHistoryID('POD_fae_character_53').GetFirstName] son victoriosos e impondrán el Eschet!"
 POD_fae_house_event.1.b: "Los Heraldos del Éxodo nos guiarán a todos por el Camino de Hierro"

 POD_fae_house_event.2.t: "Del Oro al Acero"
 POD_fae_house_event.2.desc: "Aunque costó un gran precio, tu liderazgo sobre los maestros artesanos de la Casa Dougal ha levantado un arsenal de poder y alcance verdaderamente legendarios. Con armas como estas, los fae pueden conquistar el mundo entero. ¡Miles se alzan en armas y aguardan con anhelo la Señal para ascender!"
 POD_fae_house_event.2.a: "¡A las armas! ¡A las armas!"
 
 POD_fae_house_event.3.t: "Freeholds Fortificados"
 POD_fae_house_event.3.desc: "Hombre prevenido vale por dos. Con tu visión sobrenatural de las posibilidades futuras, los arquitectos de la Casa Eiluned han construido elaboradas fortificaciones defensivas capaces de resistir cualquier tipo de asedio. Tus defensas están repletas de pasadizos secretos, laberintos, escondrijos, matacanes y trampas de trucos mágicos. Por fin te sientes seguro."
 POD_fae_house_event.3.a: "Que vengan mis enemigos: ¡se estrellarán contra las piedras!"
 
 POD_fae_house_event.4.t: "El mayor de los amantes"
 POD_fae_house_event.4.desc: "Los bardos cantarán tus hazañas románticas con gran deseo en el corazón para siempre. Has aprendido el arte del amor de la personificación mitológica de la lujuria: los sátiros. Personificas la belleza de los más bellos sidhe. Has domado el corazón feroz de un hombre lobo rabioso y lo has atado a tus deseos. Grandes personajes abandonarían sus más grandiosos designios por una noche en tu lecho. ¡Todos te amarán y se desesperarán!"
 POD_fae_house_event.4.a: "Ámame, ámame, di que me amas" 
 
 POD_fae_house_event.5.t.king: "El Verdadero Rey, coronado"
 POD_fae_house_event.5.t.queen: "La Verdadera Reina, coronada"
 POD_fae_house_event.5.desc.king: "Mediante esfuerzos heroicos, la Casa Gwydion, bajo tu liderazgo, ha demostrado ser la más noble de todos los sidhe. ¿Quién más podría emprender la búsqueda para encontrar y empuñar el rayo, la Espada de Luz, la hoja del pacificador, [GetPODArtifact('caliburn_link').GetName], sino tú, el Verdadero Rey? Todos los fae deben inclinarse ante tu majestad y reconocer tu soberanía suprema."
 POD_fae_house_event.5.desc.queen: "Mediante esfuerzos heroicos, la Casa Gwydion, bajo tu liderazgo, ha demostrado ser la más noble de todos los sidhe. ¿Quién más podría emprender la búsqueda para encontrar y empuñar el rayo, la Espada de Luz, la hoja del pacificador, [GetPODArtifact('caliburn_link').GetName], sino tú, el Verdadero Rey? Todos los fae deben inclinarse ante tu majestad y reconocer tu soberanía suprema." 
 POD_fae_house_event.5.a: "Ahora todos pueden rendir pleitesía"
 
 POD_fae_house_event.6.t: "Canción Mortal"
 POD_fae_house_event.6.desc: "Está hecho. El rebaño ha aceptado a los fae como sus pastores y guías. La Iglesia ya no será la amenaza para los fae que fue en otro tiempo, y todo el pueblo feérico tiene que agradecérselo a [ROOT.Char.GetFullName]. Se cantarán alabanzas a la Casa [ROOT.Char.GetHouse.GetName] por toda la eternidad.\n\nTodos los fae de la tierra y de los cielos deberán considerar su relación con la Santa Iglesia y sus sagrados intercesores: los [ROOT.Char.GetHouse.GetName]. Recen para que elijan el camino justo de la salvación, o sin duda las fauces abiertas del infierno los aguardan por siempre jamás. ¡La redención está cerca!\n\nLos mortales ayudarán de todas las formas que puedan erigiendo grandes catedrales, magnífico arte y música triunfal, todo para gloria de lo divino y de sus santos mensajeros. ¡Construyamos una ciudad resplandeciente sobre la colina que sea faro de esperanza y salvación para todos los que tengan oídos para oír nuestro canto beatífico!"
 POD_fae_house_event.6.a: "¡Aleluya!" 
 
 POD_fae_house_event.7.t: "Midgard Preservado"
 POD_fae_house_event.7.desc: "Con todas las criaturas sobrenaturales de Midgard bajo tu dominio, la cristianización de Escandinavia ha empezado a revertirse. El pueblo nórdico honrará las viejas costumbres y venerará a los Aesin como dioses en la Tierra.\n\n«Escuchad mis palabras, todas las clases de hombres, vosotros, hijos mayores y menores de Heimdall. Nos convocasteis, Aesin, para contar lo que recordamos de las más antiguas gestas de dioses y hombres.»"
 POD_fae_house_event.7.a: "Mis cuervos, volad cada día por todo el mundo." 
 
 POD_fae_house_event.8.t: "Ailil para todas las estaciones"
 POD_fae_house_event.8.desc: "Con tus dotes para la intriga y la diplomacia, lograste poner fin al terrible conflicto que ha dividido a los fae durante tanto tiempo. Bajo tu liderazgo, la Casa Ailil se ha elevado por encima de todas las mezquinas disputas de las demás casas sidhe. Ahora, con la preeminencia de tu casa, los esfuerzos de los fae pueden centrarse en renovar los antiguos pactos con la humanidad. Creerán de nuevo y para siempre."
 POD_fae_house_event.8.a: "Un tiempo de guerra y un tiempo de paz." 
 
 POD_fae_house_event.9.t: "Fomoriano para siempre"
 POD_fae_house_event.9.desc.start: "La Casa Balor ha rastreado tu linaje hasta una estirpe de sidhe que mezclaron su sangre con la de los fomorianos. El Invierno Sin Fin está casi aquí y debes guiar a los fae a través de él, consientan o no en tu gobierno. Has preparado el ritual para fusionar tu yo feérico con un poderoso espíritu bane y crear un híbrido fae-fomoriano: un Fomarch. El Ojo de Cristal de Balor brilla en un rojo mortecino y irradia un gran calor."
 POD_fae_house_event.9.desc.steaming_spear_of_vengeance: "Alzando la [GetPODArtifact('steaming_spear_of_vengeance_link').GetName], lames la sangre caliente de su hoja y sientes cómo te llenas de ira."
 POD_fae_house_event.9.desc.cauldron_of_fear: "Una vez preparado el repugnante brebaje místico, bebes profundamente del [GetPODArtifact('cauldron_of_fear_link').GetName]."
 POD_fae_house_event.9.desc.blood_dross: "Aplastando el diminuto vial de azúcar cristalizado, bebes la sangre vampírica que contiene la Escoria de Sangre y te llenas de glamour oscuro."
 POD_fae_house_event.9.desc.end: "Abres un trod hacia la [umbra|E] para invocar al Reptador del Nexo.\nUn brillo negro aparece en el aire junto con un gemido vibrante y trémulo. Sientes en la piel algo como uñas arañando una pizarra. El aire apesta con un olor miasmático que recuerda a una enfermedad cancerosa. El espíritu $glossary_wyrm$ se manifiesta en un avatar repugnante y horrible. Sus garras y colmillos desgarran tu carne y se lanza con violencia contra tu cavidad torácica. Te inunda un dolor atroz. Y entonces...\nEstamos unidos. Para siempre."
 POD_fae_house_event.9.a: "¡Somos el Fomarch!"
 
 POD_fae_house_event.10.t: "Sanador-Guerrero"
 POD_fae_house_event.10.desc: "Como líder de la Casa Daireann, te has esforzado por ejemplificar la doble naturaleza de sanador y guerrero. Tu mano puede curar y tu mano puede herir. Eres como una copa que puede contener veneno o antídoto, como una hoja que puede usarse para sanar o para cortar el hilo de una vida."
 POD_fae_house_event.10.a: "Sanador-Guerrero" 
 
 POD_fae_house_event.14.t: "La Maldición de Leanhaun"
 POD_fae_house_event.14.desc: "Como líder de la Casa Leanhaun, has descubierto una forma de aliviar la maldición de toda tu dinastía. En lugar de pasar de un mortal arrobado a otro solo cuando la necesidad aprieta, cultivas un nutrido rebaño de mortales para la cosecha, entre ellos algunos grandes premios rebosantes de glamour. Al drenar repetidamente una reserva de glamour tan grande, has logrado mitigar la maldición."
 POD_fae_house_event.14.a: "La Maldición de Leanhaun" 
 
 POD_fae_house_event.11.t: "Espíritus de los Rus"
 POD_fae_house_event.11.desc: "Como líder de la Casa Varich, has cultivado una sólida relación con los espíritus de la naturaleza de la tierra de los Rus. Estos espíritus eran parte de todo para los fae: la tierra, los ríos, sus freeholds y la interminable taiga que los rodea. Comprendes cómo complacer a estos espíritus y cómo usarlos. Los espíritus del hogar son tan poderosos y serviciales como grandes y magníficos sean sus Anclas, así como el respeto que les hayas mostrado. Las obligaciones entre nobleza y servidor fluyen en ambos sentidos, y los Inaimae están listos para actuar según tu voluntad."
 POD_fae_house_event.11.a: "Son los espíritus de una buena tierra." 
 
 POD_fae_house_event.12.t: "Edictos de los Oráculos Morfeos"
 POD_fae_house_event.12.desc.fae: "Aunque los Edictos de los Oráculos Morfeanos no siempre tienen sentido para los miembros de la casa, la casa está unida en su cumplimiento. Como primer líder fae de nacimiento de la Casa Scathach, has emprendido la búsqueda en el [UmbraGlossary('deep_dreaming')] y el [UmbraGlossary('sea_of_silver')] para hallar lo que estaba profetizado que se hallaría. ¿Bastará?"
 POD_fae_house_event.12.desc.changeling: "Aunque los Edictos de los Oráculos Morfeanos no siempre tienen sentido para los miembros de la Casa Scathach, la casa está unida en su cumplimiento. Como líder changeling de la casa, has seguido estrictamente el mandato de Scathach de permanecer en el Mundo Otoñal incluso frente a la creciente banalidad. ¿Bastará?"
 POD_fae_house_event.12.a: "Como siempre, honramos a los Oráculos Morfeanos" 
 
 POD_fae_house_event.13.t: "Guardia del Ensueño"
 POD_fae_house_event.13.desc: "Como líder de la Casa Danaan, has recorrido los muchos senderos del [UmbraGlossary('dreaming')]. Ahora custodias sus trods y abres nuevas rutas. Has sido guía de muchos soñadores. Por tu Juramento al Dragón te has ganado el favor de muchas quimeras. Has reunido una impresionante horda de quimeras que aguardan tus órdenes, dispuestas incluso a invadir el Mundo Otoñal a tu llamada."
 POD_fae_house_event.13.a: "¡Por la defensa de los trods hacia Arcadia!"  

 POD_fae_house_event.15.t: "Hierro Frío Inerte"
 POD_fae_house_event.15.desc: "Los «filósofos naturales» se equivocan al afirmar que el universo está sujeto a leyes rígidas y descubribles. Con gran esfuerzo, tiempo, gasto y pura fuerza de voluntad has demostrado lo que todos los alquimistas que buscaban la Piedra Filosofal sospechaban. Tras realizar miles de experimentos, perseveraste y al final lograste los resultados que buscabas. La realidad se doblega ante quienes tienen la mente y la confianza para materializar sus deseos. Si algo tan bajo como la legendaria búsqueda de los alquimistas de transmutar plomo en oro es posible, ¿por qué no podría anularse también la transmutación del hierro frío para que sus cualidades de destruir las almas inmortales de los fae queden neutralizadas? ¡Eureka! ¡Lo has logrado!"
 POD_fae_house_event.15.a: "¡La realidad es lo que yo digo que es!"

 POD_fae_house_event.16.t: "Mirado por el Ensueño"
 POD_fae_house_event.16.desc: "Nosotros, no. Yo lo hice.\n\nHice algo tan grande que el propio Ensueño reconoció mis esfuerzos y me concedió el título de noble."
 POD_fae_house_event.16.a: "Antes plebeyo, ahora noble."