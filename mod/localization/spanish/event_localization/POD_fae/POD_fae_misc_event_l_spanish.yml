l_spanish:
 POD_fae_misc.1.title: "Pooka encontrado"
 POD_fae_misc.1.desc: "Has encontrado al pooka que buscabas"
 POD_fae_misc.1.a: "Qué dientes tan grandes tienes." 
 POD_fae_misc.1.b: "Este es una risa." 
 POD_fae_misc.1.c: "Gatito, gatito, te quiero."
 POD_fae_misc.1.d: "Este puede llamar a la puerta de mi alcoba." 
 POD_fae_misc.1.e: "Creo que este será estupendo para la cetrería." 
 POD_fae_misc.1.f: "Este es soportable." 
 POD_fae_misc.1.g: "Hay algo fantástico en este." 
 POD_fae_misc.1.h: "Hasta luego, cocodrilo" 
 POD_fae_misc.1.i: "Qué ojos tan hipnóticos." 
 POD_fae_misc.1.j: "Aúlla conmigo." 
 POD_fae_misc.1.k: "Necesito un laberinto y queso, ¡ya!" 
 POD_fae_misc.1.l: "Perfecto para un trineo." 
 POD_fae_misc.1.m: "¡Qué sonrisa!" 
 POD_fae_misc.1.n: "Ven por aquí, que esto es una vaca-nzada" 
 POD_fae_misc.1.o: "¿Por qué esa cara tan larga? Ah, ya veo, estás un poco ronco." 
 POD_fae_misc.1.p: "Si me muerden, ¿me convertiré en vampiro?" 
 POD_fae_misc.1.q: "Estoy jabalí-do." 
 POD_fae_misc.1.r: "¡Cuántos ojos!" 
 POD_fae_misc.1.s: "Ese bicho me pica la curiosidad." 
 POD_fae_misc.1.t: "¡Deberíamos andar todos de lado!" 
 POD_fae_misc.1.u: "Mono ve, mono hace." 
 POD_fae_misc.1.v: "Bzzzzz." 
 POD_fae_misc.1.w: "Ese es un trabajador duro." 
 POD_fae_misc.1.x: "El cazador paciente se lleva la presa." 
 POD_fae_misc.1.y: "¡Cuántas patas!" 
 POD_fae_misc.1.z: "¿Puedo tener un caparazón?" 
 POD_fae_misc.1.aa: "¡Este parece peligroso!" 
 POD_fae_misc.1.ab: "Qué alas tan delicadas y coloridas." 
 POD_fae_misc.1.ac: "Los conejos son los animales más temidos y gloriosos, así que es justo que tenga uno que los represente en mi corte." 
 POD_fae_misc.1.ad: "Creo que lo llamaré Blandito." 
 POD_fae_misc.1.ae: "¿Buscaba un pooka, yo? Creo que no." 

 POD_fae_misc.2.t: "$POD_lilin_objective_decision$"
 POD_fae_misc.2.desc: "Los actores están en su sitio y poseo todo el conocimiento necesario para recrear la leyenda de Lilith conmigo como ella. El gran espectáculo está a punto de comenzar y pronto nacerá otra Lilith.\n\nAsí que la obra ha empezado, la recreación de la Leyenda en el Ensueño Lejano. Los actores interpretan su papel y yo estoy en el centro. La creación del Primer Hombre y la Primera Mujer, la Disolución de Lilith y su Creador, la Rebelión, la Huida. Todos los actos principales se representan en secuencia, y nos olvidamos de nosotros mismos en nombre de la obra. Todo está recreado a la perfección, nada falla.\n\nY el Acto ha terminado, los actores vuelven a su vida normal. Y el propio Ensueño ha aceptado nuestra versión como otra faceta del mismo suceso. Y renazco de nuevo. Puede que no sea Lilith, pero no soy solo una lilin."
 POD_fae_misc.2.a: "Apoteosis oscura"

 POD_fae_misc.3.t: "La guía de la humanidad"
 POD_fae_misc.3.desc: "La humanidad es ciega al maravilloso mundo del Ensueño y solo puede captar un fragmento cuando duerme. Por eso no es de extrañar que se desviara del buen camino hacia la incredulidad.\n\nPero por fortuna estabas allí, antes de que la humanidad cometiera un error mayúsculo. Guiaste a los descarriados hacia el camino correcto y, con tu control sobre las principales fuentes de conocimiento, puedes asegurarte de que no vuelva a suceder."
 POD_fae_misc.3.a: "Nos espera un futuro maravilloso."
 POD_fae_misc.3_custom1: "Mejora significativamente la difusión de la cultura y el acceso a la decisión de desarrollar el condado si no eres unseelie."


 POD_fae_misc.4.t: "Deseo concedido"
 POD_fae_misc.4.a: "Tu deseo es mi orden."
 POD_fae_misc.4.desc_brains_wish: "Así que... ¿deseas ser el cerebro de la familia?\n\nTus sesos estarán más cerca de la familia de lo que te gustaría."
 POD_fae_misc.4.desc_enemies_wish: "Así que... ¿deseas ver a tus enemigos antes de que ataquen?\n\nY atacarán, sí... en tu mente."
 POD_fae_misc.4.desc_feared_wish: "Así que... ¿deseas ser temido?\n\nY así te temerán, a ti y a todo lo que eres."
 POD_fae_misc.4.desc_marriage_wish: "Así que... ¿deseas dar más sazón a tu vida matrimonial?\n\nSazonada estará, aunque quizá no para mejor."
 POD_fae_misc.4.desc_speaking_wish: "Así que... ¿deseas que todos estén pendientes de cada una de tus palabras?\n\nY esas palabras quedarán pendientes... si es que logras pronunciarlas."
 POD_fae_misc.4.desc_dwarf_wish: "Así que... ¿deseas mirar por encima del hombro a tus enemigos?\n\nY serás un enano."
 POD_fae_misc.4.desc_appearance_wish: "Así que... ¿deseas que se giren a mirarte allá donde vayas?\n\nY se girarán, sin duda, aunque quizá no como tú quieres."
 POD_fae_misc.4.desc_spouse_wish: "Así que... ¿deseas que tu cónyuge solo tenga ojos para ti?\n\nY solo te verá a ti."
 POD_fae_misc.4.desc_wealth_wish: "Así que... ¿deseas una riqueza sin parangón?\n\n¿Con qué vas a compararla?"
 POD_fae_misc.4.desc_knowledge_wish: "Así que... ¿deseas un conocimiento más allá de tu comprensión?\n\nConocimiento tendrás, y estará más allá de tu comprensión."
 POD_fae_misc.4.desc_conscience_wish: "Así que... ¿deseas librarte de tus preocupaciones y remordimientos?\n\nTe librarás de ellos cuando todo quede al descubierto para que todos lo oigan."

 POD_fae_misc.400.t: "Deseos Concedidos"
 POD_fae_misc.400.desc: "Tu fama de conceder deseos, aunque no del todo como la gente espera, ha afectado a diversos sobrenaturales poderosos.\nIncluso los mortales cuentan historias de los infames djinn y sus mañas, por lo que sin duda esto tendrá un efecto significativo en la capacidad de los djinn para resistir los estragos de la banalidad."
 POD_fae_misc.400.a: "Me salió de forma natural."