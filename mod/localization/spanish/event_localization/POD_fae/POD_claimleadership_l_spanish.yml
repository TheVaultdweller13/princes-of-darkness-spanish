l_spanish:
 POD_claimleadership_events.1.t: "Reclamar el título de $PODWarOfSeasonsLeader_autumn$"
 POD_claimleadership_events.1.desc: "El plan es sencillo: demostrar quién es realmente digno del título de $PODWarOfSeasonsLeader_autumn$. Puede lograrse por varios medios, y se usarán todos y cada uno, salvo el asesinato. Al fin y al cabo, no soy un salvaje..."
 POD_claimleadership_events.1.a: "¡Hagámoslo!"
 POD_claimleadership_events.1.b: "No nos precipitemos."

 POD_claimleadership_events.2.t: "Reclamar el título de $PODWarOfSeasonsLeader_autumn$"
 POD_claimleadership_events.2.desc: "Todo salió según el plan y toda la reputación de [target.GetNamePossessive] ha sido reducida a cenizas. Ahora todos saben que yo, [GetPlayer.GetName], soy el verdadero $PODWarOfSeasonsLeader_autumn$"
 POD_claimleadership_events.2.a: "¡[target.GetSheHe] se llevará una buena sorpresa mañana!"
 POD_claimleadership_events.2.b: "¿Y qué si lo saben? ¡Gané de todos modos!"

 POD_claimleadership_events.3.t: "Reclamar el título de $PODWarOfSeasonsLeader_autumn$: Fracaso"
 POD_claimleadership_events.3.desc: "¡NO, NO, NO, esos idiotas! ¡Fracasaron! ¡La reputación de [target.GetNamePossessive] sigue intacta pese a mis diversos intentos! ¿Y lo peor? ¡Quedo patético!"
 POD_claimleadership_events.3.a: "Vaya..."