l_spanish:
 POD_mummy_elixir_of_eternal_life.001.t: "Pedir ayuda"
 POD_mummy_elixir_of_eternal_life.001.desc: "«El Camino es inexplicable, el Sendero está más allá de toda enseñanza, la Vía más allá de toda palabra. Intentarlo, o peor aún, lograrlo, sería una maldición sobre tu futuro. Ni siquiera el poderoso árbol puede alcanzar su altura plena con luz robada. Solo aprendiendo demuestras ser digno de enseñar. Solo con tu propio esfuerzo avanzarás y te acercarás de verdad a la Tercera Encarnación. Aun así, seremos como la piedra de afilar de tu hoja. Con cada paso que des, te guiaremos para que puedas dar otro, pues los pasos son tuyos.»"
 POD_mummy_elixir_of_eternal_life.001.a: "Este humilde te agradece tu guía."
 POD_mummy_elixir_of_eternal_life.001.a.tt: "Cada vez que completes un [journey|E], las intuiciones de los Ocho Inmortales te otorgan #color_white 5.00#! de [trait_level_track_xp|E] adicionales en el Elixir de la Vida Eterna #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"

 POD_mummy_elixir_of_eternal_life.002.t: "Maestría interna"
 POD_mummy_elixir_of_eternal_life.002.desc: "Es hora de cambiarme a mí mismo, de librarme de esos rasgos que me frenan. Un camino arduo, sin duda, pero necesario."
 POD_mummy_elixir_of_eternal_life.002.option.desc: "Prueba del yo"
 POD_mummy_elixir_of_eternal_life.002.success: "Superas la prueba"
 POD_mummy_elixir_of_eternal_life.002.failure: "Fallas la prueba"
 POD_mummy_elixir_of_eternal_life.002.a: "El alcohol no nublará mi mente."
 POD_mummy_elixir_of_eternal_life.002.a.tt: "Intentarás librarte de [GetTrait('drunkard').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.b: "No me castigaré."
 POD_mummy_elixir_of_eternal_life.002.b.tt: "Intentarás librarte de [GetTrait('flagellant').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.c: "Quizá coma demasiado."
 POD_mummy_elixir_of_eternal_life.002.c.tt: "Intentarás librarte de [GetTrait('comfort_eater').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.d: "No dejaré que mi ira me controle."
 POD_mummy_elixir_of_eternal_life.002.d.tt: "Intentarás librarte de [GetTrait('irritable').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.e: "No dejaré que la lujuria me guíe."
 POD_mummy_elixir_of_eternal_life.002.e.tt: "Intentarás librarte de [GetTrait('rakish').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.f: "No puedo esconderme de mis problemas."
 POD_mummy_elixir_of_eternal_life.002.f.tt: "Intentarás librarte de [GetTrait('hashishiyah').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.g: "La codicia no es buena."
 POD_mummy_elixir_of_eternal_life.002.g.tt: "Intentarás librarte de [GetTrait('profligate').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.h: "¿Huyo de lo que hay que hacer?"
 POD_mummy_elixir_of_eternal_life.002.h.tt: "Intentarás librarte de [GetTrait('craven').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.i: "¿Permito que la ira me alimente?"
 POD_mummy_elixir_of_eternal_life.002.i.tt: "Intentarás librarte de [GetTrait('wrathful').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.j: "¿Dejo que la lujuria me desborde?"
 POD_mummy_elixir_of_eternal_life.002.j.tt: "Intentarás librarte de [GetTrait('lustful').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.k: "¿Persigo en exceso mi propio poder?"
 POD_mummy_elixir_of_eternal_life.002.k.tt: "Intentarás librarte de [GetTrait('ambitious').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.l: "¿Evito lo que debe hacerse?"
 POD_mummy_elixir_of_eternal_life.002.l.tt: "Intentarás librarte de [GetTrait('lazy').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.m: "¿Amo el dinero más que a las personas?"
 POD_mummy_elixir_of_eternal_life.002.m.tt: "Intentarás librarte de [GetTrait('greedy').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.n: "¿Dejo que la comida me consuma?"
 POD_mummy_elixir_of_eternal_life.002.n.tt: "Intentarás librarte de [GetTrait('gluttonous').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.o: "¿Me deleito en la crueldad?"
 POD_mummy_elixir_of_eternal_life.002.o.tt: "Intentarás librarte de [GetTrait('sadistic').GetName(GetNullCharacter)]"
 POD_mummy_elixir_of_eternal_life.002.p: "Da igual."

 POD_mummy_elixir_of_eternal_life.003.t: "Una parte hecha, otra comenzada"
 POD_mummy_elixir_of_eternal_life.003.desc: "Una vez alcanzada una comprensión básica del Elixir de la Vida Eterna, tu camino original ya no basta para seguir creciendo. Para crear el Elixir hay que comprenderse a uno mismo y al universo en el que se vive. Para lograrlo, tendrás que recorrer el mundo para reunir registros antiguos, aprender de los fracasos ajenos y meditar sobre las lecciones recogidas. Además, tendrás que dedicar tiempo a investigar, a traducir despacio los registros, a elaborar pociones y a reforzar tu base de cultivo.\n\n#help Para alcanzar 90 de [trait_level_track_xp|E] en el Elixir de la Vida Eterna y avanzar más, tendrás que acumularla de forma pasiva y realizar [journeys|E]. Consulta [Concept('POD_elixir_of_eternal_life', 'esta descripción')|E] y la del rasgo Buscador del Renacimiento Eterno de tu personaje para saber más.#!"
 POD_mummy_elixir_of_eternal_life.003.a: "Mi búsqueda aún no ha terminado..."

 POD_mummy_elixir_of_eternal_life.100.t: "Vitriolo de Vinculación Eterna"
 POD_mummy_elixir_of_eternal_life.100.desc: "Un hombre con un traje perfectamente entallado entra en tu sala del trono, sorteando a tus guardias. Lleva el pelo peinado hacia atrás, tan liso y moldeado a la perfección que parece un casco colocado sobre su cabeza. Las piezas de maquinaria metálica que asoman a través de su carne no hacen sino realzar la imagen artificiosa.\n\nSe presenta como agente del [Glossary('Rey Yama','podgloss.yamaking')] [Glossary('Mikaboshi','podgloss.mikaboshi')]. Ha oído hablar de tu búsqueda del Elixir de la Vida Eterna y desea hacerte una oferta. Vincularás tu ritual a la [Glossary('Ciudad Malvada','podgloss.wickedcity')] y usarás tus conocimientos para crear una fuerza de Wu Kuei, momias que trabajan por la creación de un estado máquina. A cambio, te ayudará a transformar tu señorío en uno de mundanidad y trabajo robótico, que maximice los beneficios, minimice las pérdidas e innove sin cesar.\n\nLa [Glossary('Sexta Era','game_concept_sixth_age_desc')] llegará, así que ¿por qué no te unes al bando ganador? No necesitas vivir tu existencia inmortal sufriendo ni siquiera aplastado bajo el talón de los señores de Yomi, como las masas corrientes, cuando podrías vivir con comodidad y lujo. ¿De verdad quieres optar por siglos incontables de vida en el infierno solo para conservar un saber y una sabiduría que solo un puñado puede apreciar de veras? ¿Tanto te importa tu deber hacia un Cielo ausente? ¿Rechazarías de verdad una oferta tan generosa?"
 POD_mummy_elixir_of_eternal_life.100.a: "Un trato que merece la pena."
 POD_mummy_elixir_of_eternal_life.100.b: "¡Nunca tendrás mi alma!"
 POD_mummy_elixir_of_eternal_life.100.c: "Mi alma ya está perdida."
 POD_mummy_elixir_of_eternal_life.100.d: "Mi dominio de la magia vuelve inútiles tus poderes aquí."
 POD_mummy_elixir_of_eternal_life.100.d.tt: "Tras elaborar muchas pociones y tratar con la [umbra|E], puedes resistir sus poderes infernales"
 POD_mummy_elixir_of_eternal_life.100.effect.success: "Resistes el asalto del agente"
 POD_mummy_elixir_of_eternal_life.100.effect.failure: "El asalto domina tu mente"
 POD_mummy_elixir_of_eternal_life.100.effect.pactadvantage: "Tu pacto con un [Glossary('Rey Yama','podgloss.yamaking')] te facilitará reducir los ataques de sus rivales"
 POD_eoel_mikaboshi_boon_modifier: "Don de [Glossary('Mikaboshi','podgloss.mikaboshi')]"
 POD_eoel_mikaboshi_boon_modifier_desc: "El Señor de la [Glossary('Ciudad Malvada','podgloss.wickedcity')] sabe cómo exprimir el mayor beneficio posible a una región."

 POD_mummy_elixir_of_eternal_life.101.desc: "Una mujer picada de viruelas, cubierta de pústulas que no dejan de supurar, entra en tu sala del trono, sorteando a tus guardias. Tiene el pelo pringoso de pus y la piel cubierta de un brillo de sudor. Un regusto ácido llena el aire y te quema los pelos de la nariz.\n\nSe presenta como agente del [Glossary('Rey Yama','podgloss.yamaking')] [GetFaithByKey('thousandhells_tou_shen').GetName]. Ha oído hablar de tu búsqueda del Elixir de la Vida Eterna y desea hacerte una oferta. Vincularás tu ritual al Infierno Febril y usarás tus conocimientos para crear una fuerza de Wu Kuei, momias que trabajan por la propagación de la viruela. A cambio, te ayudará a transformar tu señorío en uno de enfermedad, donde la pestilencia y el miedo sean rentables. Está dispuesto a ofrecer mucho por la oportunidad de superar a Rangda.\n\nLa [Glossary('Sexta Era','game_concept_sixth_age_desc')] llegará, así que ¿por qué no te unes al bando ganador? No necesitas vivir tu existencia inmortal sufriendo ni siquiera aplastado bajo el talón de los señores de Yomi, como las masas corrientes, cuando podrías vivir con comodidad y lujo. ¿De verdad quieres optar por siglos incontables de vida en el infierno solo para conservar un saber y una sabiduría que solo un puñado puede apreciar de veras? ¿Tanto te importa tu deber hacia un Cielo ausente? ¿Rechazarías de verdad una oferta tan generosa?"
 POD_eoel_tou_shen_boon_modifier: "Don de Tou Shen"
 POD_eoel_tou_shen_boon_modifier_desc: "El Señor del Infierno Febril sabe cómo convertir el miedo en beneficio."

 POD_mummy_elixir_of_eternal_life.102.desc: "Un hombre con armadura al estilo bushi entra en tu sala del trono, sorteando a tus guardias. Sostiene un portapapeles en la mano, y de su cinto cuelgan un lío de cuerda y un látigo trenzado con esquirlas de cristal.\n\nSe presenta como agente del [Glossary('Rey Yama','podgloss.yamaking')] [Glossary('Wu Hua','podgloss.wuhua')]. Ha oído hablar de tu búsqueda del Elixir de la Vida Eterna y desea hacerte una oferta. Vincularás tu ritual al Pozo de Sal y Hierro y usarás tus conocimientos para crear una fuerza de Wu Kuei, momias que trabajan por la eficiencia perfecta. A cambio, te ayudará a transformar tu señorío en uno de buen orden, producción máxima y burocracia sin fin.\n\nLa [Glossary('Sexta Era','game_concept_sixth_age_desc')] llegará, así que ¿por qué no te unes al bando ganador? No necesitas vivir tu existencia inmortal sufriendo ni siquiera aplastado bajo el talón de los señores de Yomi, como las masas corrientes, cuando podrías vivir con comodidad y lujo. ¿De verdad quieres optar por siglos incontables de vida en el infierno solo para conservar un saber y una sabiduría que solo un puñado puede apreciar de veras? ¿Tanto te importa tu deber hacia un Cielo ausente? ¿Rechazarías de verdad una oferta tan generosa? Al fin y al cabo, [Glossary('Wu Hua','podgloss.wuhua')] siempre recompensa a los leales y destruye a los desobedientes."
 POD_eoel_wu_hua_boon_modifier: "Don de [Glossary('Wu Hua','podgloss.wuhua')]"
 POD_eoel_wu_hua_boon_modifier_desc: "El Señor del Pozo de Sal y Hierro sabe bien que los esclavos obedientes son esclavos rentables."

 POD_mummy_elixir_of_eternal_life.110.t: "Cieno en Constante Cambio"
 POD_mummy_elixir_of_eternal_life.110.desc: "Un hombre encorvado, al parecer forjado en hierro ennegrecido, entra en tu sala del trono, sorteando a tus guardias. Sus tres ojos multifacéticos brillan con el rojo de un desierto al crepúsculo. De las articulaciones fluye arena, que deja un rastro tras la criatura.\n\nSe presenta como agente de la [Glossary('Reina Yama','podgloss.yamaking')] [Glossary('Tou Mu','podgloss.toumu')]. Ha oído hablar de tu búsqueda del Elixir de la Vida Eterna y desea hacerte una oferta. Vincularás tu ritual al [UmbraGlossary('hell_of_being_skinned_alive')] y usarás tus conocimientos para crear una fuerza de Wu Kuei, momias que trabajan por su ascenso al trono del [Glossary('Emperador Demonio','podgloss.demonemperor')]. A cambio, te ayudará a obtener venganza contra todos los que te hicieron daño, a superarlos en gloria y a torturarlos por toda la eternidad.\n\nLa [Glossary('Sexta Era','game_concept_sixth_age_desc')] llegará, así que ¿por qué no te unes al bando ganador? No necesitas vivir tu existencia inmortal sufriendo ni siquiera aplastado bajo el talón de los señores de Yomi, como las masas corrientes, cuando podrías vivir con comodidad y lujo. ¿De verdad quieres optar por siglos incontables de vida en el infierno solo para conservar un saber y una sabiduría que solo un puñado puede apreciar de veras? ¿Tanto te importa tu deber hacia un Cielo ausente? Ella ofrece grandes oportunidades antes de concederte una muerte rápida, una bondad comparada con el mundo que traerá consigo."
 POD_mummy_elixir_of_eternal_life.110.a: "Podemos llegar a un acuerdo."
 POD_mummy_elixir_of_eternal_life.110.b: "¡Nunca tendrás mi alma!"
 POD_mummy_elixir_of_eternal_life.110.c: "Mi alma ya está perdida."
 POD_mummy_elixir_of_eternal_life.110.d: "He alimentado mi señorío. Aquí no tienes poder."
 POD_mummy_elixir_of_eternal_life.110.d.tt: "Tras dominar tu señorío y tu familia, puedes resistir sus poderes infernales"
 POD_mummy_elixir_of_eternal_life.110.effect.success: "Resistes el asalto del agente"
 POD_mummy_elixir_of_eternal_life.110.effect.failure: "El asalto domina tu mente"
 POD_eoel_tou_mu_boon_modifier: "Don de [Glossary('Tou Mu','podgloss.toumu')]"
 POD_eoel_tou_mu_boon_modifier_desc: "La Señora del [UmbraGlossary('hell_of_being_skinned_alive')] ha dominado el arte de mantener un puño de hierro sobre sus dominios."

 POD_mummy_elixir_of_eternal_life.111.desc: "Un hombre envuelto en sombras que parecen brillar y, sin embargo, devoran la luz se desvanece en tu sala del trono, sorteando a tus guardias. Su rostro es el de un niño inocente ensombrecido por unos ojos que han visto demasiado. Curiosamente, hay algo aviar en su porte.\n\nSe presenta como agente del [Glossary('Rey Yama','podgloss.yamaking')] Bao Zhong. Ha oído hablar de tu búsqueda del Elixir de la Vida Eterna y desea hacerte una oferta. Vincularás tu ritual al Infierno del Pesar Imperecedero y usarás tus conocimientos para crear una fuerza de Wu Kuei, momias que trabajan por el exterminio de todos los demás [Glossary('Reyes Yama','podgloss.yamaking')]. A cambio, te ayudará a crear un mundo nuevo libre de la tiranía del Augusto Personaje de Jade, un mundo en el que serás el glorioso campeón de Bao Zhong.\n\nLa [Glossary('Sexta Era','game_concept_sixth_age_desc')] llegará, así que ¿por qué no te unes al bando ganador? No necesitas vivir tu existencia inmortal sufriendo ni siquiera aplastado bajo el talón de los señores de Yomi, como las masas corrientes, cuando podrías vivir con comodidad y lujo. ¿De verdad quieres optar por siglos incontables de vida en el infierno solo para conservar un saber y una sabiduría que solo un puñado puede apreciar de veras? ¿Tanto te importa tu deber hacia un Cielo ausente? Él ofrece oportunidades tan grandiosas."
 POD_eoel_bao_zhong_boon_modifier: "Don de Bao Zhong"
 POD_eoel_bao_zhong_boon_modifier_desc: "El Señor del Infierno del Pesar Imperecedero recuerda mucho, como uno de los 4 Wan Xian que escaparon de la maldición del Augusto Personaje de Jade."

 POD_mummy_elixir_of_eternal_life.112.desc: "Un hombre rezumante de influencias infernales entra en tu sala del trono, sorteando a tus guardias. De cada prenda cuelgan gemas y abalorios extraños que tintinean a cada paso. De esos objetos emana un poder inusual que te oprime con el peso de un océano, una intención homicida que te llena de miedo.\n\nSe presenta como agente de la [Glossary('Reina Yama','podgloss.yamaking')] Abuela Bruja. Ha oído hablar de tu búsqueda del Elixir de la Vida Eterna y desea hacerte una oferta. Vincularás tu ritual al Infierno de la Magia Miserable y usarás tus conocimientos para crear una fuerza de Wu Kuei, momias que trabajan por reunir toda la magia, incluida la que más valdría no conocer. A cambio, te concederá un gran saber y un poder infernal.\n\nLa [Glossary('Sexta Era','game_concept_sixth_age_desc')] llegará, así que ¿por qué no te unes al bando ganador? No necesitas vivir tu existencia inmortal sufriendo ni siquiera aplastado bajo el talón de los señores de Yomi, como las masas corrientes, cuando podrías vivir con comodidad y lujo. ¿De verdad quieres optar por siglos incontables de vida en el infierno solo para conservar un saber y una sabiduría que solo un puñado puede apreciar de veras? ¿Tanto te importa tu deber hacia un Cielo ausente? Ella ofrece oportunidades tan grandiosas."
 POD_eoel_grandmother_witch_boon_modifier: "Don de la Abuela Bruja"
 POD_eoel_grandmother_witch_boon_modifier_desc: "La Señora del Infierno de la Magia Miserable ha aprendido a usar su posición para reunir cada vez más saber y magia."

 POD_mummy_elixir_of_eternal_life.120.t: "Smog que Todo lo Oye"
 POD_mummy_elixir_of_eternal_life.120.desc: "Una mujer de belleza sobrenatural pasa con paso felino ante tus guardias, cuyos ojos están ciegos a todo lo que no sea ella. Como una estatua tallada en hielo por un maestro, carece de defectos. Cada paso revela una gracia letal, la de un gato que se prepara para saltar.\n\nSe presenta como agente del [Glossary('Rey Yama','podgloss.yamaking')] [Glossary('Emma-O','podgloss.emmao')]. Ha oído hablar de tu búsqueda del Elixir de la Vida Eterna y desea hacerte una oferta. Vincularás tu ritual a [Glossary('Kakuri','podgloss.kakuri')] y usarás tus conocimientos para crear una fuerza de Wu Kuei, momias que trabajan por un vacío infinito de hielo y nieve. A cambio, te concederá un gran poder y te convertirá en su cuchillo en la oscuridad. Poco podrá oponerse a ti con su ayuda.\n\nLa [Glossary('Sexta Era','game_concept_sixth_age_desc')] llegará, así que ¿por qué no te unes al bando ganador? No necesitas vivir tu existencia inmortal sufriendo ni siquiera aplastado bajo el talón de los señores de Yomi, como las masas corrientes, cuando podrías vivir con comodidad y lujo. ¿De verdad quieres optar por siglos incontables de vida en el infierno solo para conservar un saber y una sabiduría que solo un puñado puede apreciar de veras? ¿Tanto te importa tu deber hacia un Cielo ausente? Basta con que abandones los deberes que te impuso tu indiferente amo, el Augusto Personaje de Jade, y aceptes otros que sí te ayudarán de verdad."
 POD_mummy_elixir_of_eternal_life.120.a: "Una sorpresa, pero bienvenida."
 POD_mummy_elixir_of_eternal_life.120.b: "¡Nunca tendrás mi alma!"
 POD_mummy_elixir_of_eternal_life.120.c: "Mi alma ya está perdida."
 POD_mummy_elixir_of_eternal_life.120.d: "Me he dominado a mí mismo. Aquí no tienes poder."
 POD_mummy_elixir_of_eternal_life.120.d.tt: "Tras dominar tu cuerpo y tu mente, puedes resistir sus poderes infernales"
 POD_mummy_elixir_of_eternal_life.120.effect.success: "Resistes el asalto del agente"
 POD_mummy_elixir_of_eternal_life.120.effect.failure: "El asalto domina tu mente"
 POD_eoel_emmao_boon_modifier: "Don de [Glossary('Emma-O','podgloss.emmao')]"
 POD_eoel_emmao_boon_modifier_desc: "El Señor de [Glossary('Kakuri','podgloss.kakuri')] ha dominado el arte del subterfugio."

 POD_mummy_elixir_of_eternal_life.121.desc: "Un hombre que porta las imágenes de una gran religión entra en tu sala del trono, sorteando a tus guardias. La fe y el fanatismo brillan en sus ojos, apenas atenuados por las rojas pústulas que cubren cada palmo de carne visible.\n\nSe presenta como el representante de lo divino, la voz de aquel a quien llaman Hen Tian. Lo divino ha oído hablar de tu búsqueda del Elixir de la Vida Eterna y desea hacerte una oferta. Vincularás tu ritual al [UmbraGlossaryLocalized('hell_of_bitter_truth','Señorío de la Redención y la Verdad')] y usarás tus conocimientos para crear una fuerza de Wu Kuei, momias que trabajan por la salvación de todos y la revelación de la verdad absoluta. A cambio, te ayudará a difundir esa redención en secreto para que los enemigos de la verdad no puedan detenerte.\n\nLa [Glossary('Sexta Era','game_concept_sixth_age_desc')] llegará, así que ¿por qué no te unes al bando ganador? No necesitas vivir tu existencia inmortal sufriendo ni siquiera aplastado bajo el talón de los señores de Yomi, como las masas corrientes, cuando podrías vivir con comodidad y lujo. ¿De verdad quieres optar por siglos incontables de vida en el infierno solo para conservar un saber y una sabiduría que solo un puñado puede apreciar de veras? ¿Tanto te importa tu deber hacia un Cielo ausente? Basta con que abandones los deberes que te impuso tu indiferente amo, el Augusto Personaje de Jade, y aceptes otros que sí te ayudarán de verdad."
 POD_eoel_hen_tian_boon_modifier: "Don de Hen Tian"
 POD_eoel_hen_tian_boon_modifier_desc: "El Señor del [UmbraGlossaryLocalized('hell_of_bitter_truth','Señorío de la Redención y la Verdad')] ha dominado el arte de sobornar a la gente para sus propios fines y engañarla para que cumpla sus designios."

 POD_mummy_elixir_of_eternal_life.122.desc: "Un hombre cuya piel está visible y permanentemente manchada de sangre entra en tu sala del trono, sorteando a tus guardias. Como su ama, le salen del torso y la espalda varios brazos, cada uno rematado en una boca de dientes rechinantes.\n\nSe presenta como agente de la [Glossary('Reina Yama','podgloss.yamaking')] Yargra de Muchas Bocas. Ha oído hablar de tu búsqueda del Elixir de la Vida Eterna y desea hacerte una oferta. Vincularás tu ritual a Pueleko y usarás tus conocimientos para crear una fuerza de Wu Kuei, momias que trabajan por la creación de infiernos sin fin y el consumo de todas las cosas. A cambio, te ayudará a devorar a todo el que se interponga en tu camino.\n\nLa [Glossary('Sexta Era','game_concept_sixth_age_desc')] llegará, así que ¿por qué no te unes al bando ganador? No necesitas vivir tu existencia inmortal sufriendo ni siquiera aplastado bajo el talón de los señores de Yomi, como las masas corrientes, cuando podrías vivir con comodidad y lujo. ¿De verdad quieres optar por siglos incontables de vida en el infierno solo para conservar un saber y una sabiduría que solo un puñado puede apreciar de veras? ¿Tanto te importa tu deber hacia un Cielo ausente? Basta con que abandones los deberes que te impuso tu indiferente amo, el Augusto Personaje de Jade, y aceptes otros que sí te ayudarán de verdad."
 POD_eoel_yargra_boon_modifier: "Don de Yargra"
 POD_eoel_yargra_boon_modifier_desc: "La Señora de Pueleko acecha a su presa antes de devorarla."
 POD_eoel_yargra_vampiric_boon_modifier: "Don de Yargra"
 POD_eoel_yargra_vampiric_boon_modifier_desc: "La Señora de Pueleko acecha a su presa antes de devorarla."

 POD_mummy_elixir_of_eternal_life.130.t: "Fuego Infernal que Todo lo Consume"
 POD_mummy_elixir_of_eternal_life.130.desc: "Un hombre vestido con un deel mongol entra en tu sala del trono, sorteando a tus guardias. Su cuerpo parece hinchado de energías corrompidas y en sus ojos arde un odio sin rumbo. En lugar de pasos, sus zapatos producen el sonido de cadenas que tintinean y gritos que hielan la sangre.\n\nSe presenta como agente del [Glossary('Rey Yama','podgloss.yamaking')] [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]. Ha oído hablar de tu búsqueda del Elixir de la Vida Eterna y desea hacerte una oferta. Vincularás tu ritual al [Glossary('Infierno de las Cadenas Espinosas','podgloss.hellspikedchains')] y usarás tus conocimientos para crear una fuerza de Wu Kuei, momias que trabajan por aplastar a los últimos reductos que impiden su ascenso a [Glossary('Emperador Demonio','podgloss.demonemperor')]. A cambio, te infundirá el poder de aplastar a tus enemigos y hacerlos sufrir.\n\nLa [Glossary('Sexta Era','game_concept_sixth_age_desc')] llegará, así que ¿por qué no te unes al bando ganador? No necesitas vivir tu existencia inmortal sufriendo ni siquiera aplastado bajo el talón de los señores de Yomi, como las masas corrientes, cuando podrías vivir con comodidad y lujo. ¿De verdad quieres optar por siglos incontables de vida en el infierno solo para conservar un saber y una sabiduría que solo un puñado puede apreciar de veras? ¿Tanto te importa tu deber hacia un Cielo ausente? Un gran poder, muy por encima de lo que imaginan los decrépitos necios del Cielo, podría ser tuyo. ¿Tan firme es tu entrega que lo rechazarás?"
 POD_mummy_elixir_of_eternal_life.130.a: "¡Poder ilimitado!"
 POD_mummy_elixir_of_eternal_life.130.b: "¡Nunca tendrás mi alma!"
 POD_mummy_elixir_of_eternal_life.130.c: "Mi alma ya está perdida."
 POD_mummy_elixir_of_eternal_life.130.effect.success: "Resistes el asalto del agente"
 POD_mummy_elixir_of_eternal_life.130.effect.failure: "El asalto domina tu mente"
 POD_eoel_dokhor_khan_boon_modifier: "Don de [Glossary('Dokhor-Khan','podgloss.dokhorkhan')]"
 POD_eoel_dokhor_khan_boon_modifier_desc: "El Señor del [Glossary('Infierno de las Cadenas Espinosas','podgloss.hellspikedchains')] ha alcanzado su poder aplastando a todo el que se le pone delante, a menudo con bastante temeridad."

 POD_mummy_elixir_of_eternal_life.131.desc: "Una mujer que apenas viste nada, y que deja ver las lesiones putrefactas que le cubren la carne, entra en tu sala del trono, sorteando a tus guardias. El olor a podredumbre, el sonido del chapoteo, la visión de una carne que parece derretirse y de larvas que se retuercen bajo su piel provocan un impulso instintivo de arcadas.\n\nSe presenta como agente de la [Glossary('Reina Yama','podgloss.yamaking')] Rangda. Ha oído hablar de tu búsqueda del Elixir de la Vida Eterna y desea hacerte una oferta. Vincularás tu ritual al [UmbraGlossary('hell_of_burrowing_maggots')] y usarás tus conocimientos para crear una fuerza de Wu Kuei, momias que trabajan por la agonía eterna de todo ser vivo. A cambio, convertirá a tus hombres en monstruos, incapaces de sentir el dolor y la putrefacción que propagan a cada paso.\n\nLa [Glossary('Sexta Era','game_concept_sixth_age_desc')] llegará, así que ¿por qué no te unes al bando ganador? No necesitas vivir tu existencia inmortal sufriendo ni siquiera aplastado bajo el talón de los señores de Yomi, como las masas corrientes, cuando podrías vivir con comodidad y lujo. ¿De verdad quieres optar por siglos incontables de vida en el infierno solo para conservar un saber y una sabiduría que solo un puñado puede apreciar de veras? ¿Tanto te importa tu deber hacia un Cielo ausente? Un gran poder, muy por encima de lo que imaginan los decrépitos necios del Cielo, podría ser tuyo. ¿Tan firme es tu entrega que lo rechazarás?"
 POD_eoel_rangda_boon_modifier: "Don de Rangda"
 POD_eoel_rangda_boon_modifier_desc: "La Señora del [UmbraGlossary('hell_of_burrowing_maggots')] bañará el mundo en larvas. Tus soldados son solo el primer paso."

 POD_mummy_elixir_of_eternal_life.132.desc: "Un hombre con las cicatrices de latigazos y quemaduras entra en tu sala del trono, sorteando a tus guardias. De su cintura gotea sangre un látigo de nueve colas con esquirlas de cristal incrustadas. Sobre su yelmo descansa una vela encendida con una llama verde que arde con fiereza y hace gotear la cera sobre él. Y, sin embargo, la vela nunca se consume.\n\nSe presenta como agente del [Glossary('Rey Yama','podgloss.yamaking')] Danoru Ka. Ha oído hablar de tu búsqueda del Elixir de la Vida Eterna y desea hacerte una oferta. Vincularás tu ritual a la Caverna Nunca Iluminada y usarás tus conocimientos para crear una fuerza de Wu Kuei, momias que reúnen espíritus para completar su túnel en las [UmbraGlossary('shadowlands')]. A cambio, convertirá a tus caballeros en capataces capaces de manejar vastas hordas de esclavos. \n\nLa [Glossary('Sexta Era','game_concept_sixth_age_desc')] llegará, así que ¿por qué no te unes al bando ganador? No necesitas vivir tu existencia inmortal sufriendo ni siquiera aplastado bajo el talón de los señores de Yomi, como las masas corrientes, cuando podrías vivir con comodidad y lujo. ¿De verdad quieres optar por siglos incontables de vida en el infierno solo para conservar un saber y una sabiduría que solo un puñado puede apreciar de veras? ¿Tanto te importa tu deber hacia un Cielo ausente? Un gran poder, muy por encima de lo que imaginan los decrépitos necios del Cielo, podría ser tuyo. ¿Tan firme es tu entrega que lo rechazarás?"
 POD_eoel_danoru_ka_boon_modifier: "Don de Danoru Ka"
 POD_eoel_danoru_ka_boon_modifier_desc: "El Señor de la Caverna Nunca Iluminada ha esclavizado a muchos seres y creado muchos capataces para completar su túnel. Abundan las teorías sobre su destino..."

 POD_mummy_elixir_of_eternal_life.140.t: "Un último paso"
 POD_mummy_elixir_of_eternal_life.140.desc: "A lo largo de la historia, el Elixir de la Vida Eterna se ha descubierto incontables veces, solo para que ese saber se perdiera. Algunos han teorizado que los Ocho Inmortales imponen a propósito el ciclo del redescubrimiento y usan la búsqueda como prueba para identificar a los dignos del renacimiento eterno. Permiten que los virtuosos beban del Elixir y conceden su receta a los más dignos. No sería la primera vez que lo hacen; pues, si existe la Tercera Encarnación, a los Wu T'ian iluminados que la han alcanzado se les ha prohibido hablar de sus logros. Al fin y al cabo, los hombres no pueden labrar su propio camino cuando buscan seguir sendas pavimentadas por otros.\n\nSea como fuere, tras haberte ocupado de los [Glossary('Reyes Yama','podgloss.yamaking')], te hallas al borde del éxito. Reunir unas últimas cosas y tomar una última decisión es todo lo que te separa del desafío final de tu búsqueda."
 POD_mummy_elixir_of_eternal_life.140.a: "Es hora de exponer mi caso y reclamar mi lugar."

 POD_mummy_elixir_of_eternal_life.201.t: "La Quietud"
 POD_mummy_elixir_of_eternal_life.201.desc: "A la hora en que naciste en su día, te acomodas en una postura cómoda. Aquietas tu cuerpo, tu mente y tu alma. Cada latido de tu corazón es cada vez más lento, cada golpe más callado. Los pensamientos rebotan en tu mente sin lograr irrumpir en la serenidad. Las preocupaciones, los miedos, los afanes de este mundo se alejan de tu alma y se asientan en menos que el hilillo de un manantial de montaña. Cada instante se estira hasta la eternidad mientras pierdes toda noción del paso del tiempo, hasta que tus ojos se cierran.\n\nPese a no tener cuerpo alguno, sientes un dolor atroz cuando tu cuerpo, tu mente y tu alma se desgarran unos de otros. Con tu ojo espiritual ves tres esferas que giran en espiral una en torno a otra. A medida que las órbitas se aceleran, la esencia empieza a fluir entre ellas mientras las esferas pierden su forma coherente y se esparcen en una nube circundante. Cada vez más deprisa, las hebras rojas de energía empiezan a girar hacia dentro, hacia el núcleo blanco unificado que se ha formado, cada vez más brillante a medida que se acercan al centro. Cuando todo se ha fundido en un único punto infinitesimal, tu forma reaparece de modo que puedes ver de nuevo a través de tus ojos y te revela la Puerta del Cielo, cerrada. La puerta tiene la estructura de un intrincado hierro forjado, pero hecha de oro rojo, con la cerradura trabajada en jade precioso. A ambos lados se alzan muros hechos de incontables perlas, unidas como si fueran un solo ser. Ante las puertas se alzan ocho seres, de aspecto humano y, sin embargo, mucho más.\n«Dinos, joven, ¿qué buscas?»$POD_debate_debate_explanation_footer_description$ #R Los Inmortales consultarán a los 6 Wu T'ian antiguos y jugables que siguen activos entre los sobrenaturales y tendrán en cuenta su opinión sobre ti para determinar la Fuerza de Debate contraria, junto con tus actos pasados, como a cuánta gente has asesinado.#!$POD_debate_debate_explanation_footer_initial_score$"
 POD_mummy_elixir_of_eternal_life.201.a: "¡Busco el Elixir de la Vida Eterna!"
 POD_mummy_elixir_of_eternal_life.201.b: "Pensándolo mejor..."

 POD_mummy_elixir_of_eternal_life.202.t: "La infusión final"
 POD_mummy_elixir_of_eternal_life.202.desc: "Ha llegado la hora de preparar el elixir final. Asciendes a la cima más alta en un día propicio, armado con un talismán. Hablas con el espíritu de la montaña para recibir los Alientos de los Nueve Cielos. Nueve veces sometido al fuego a nueve intervalos regulares de tiempo, alternado entre sólido y vapor: así es como se prepara el cinabrio. Dejas que la luz del sol fluya a través del recipiente mientras añades las flores de oro, el rocío de jade, el azufre, el azogue, la resina de pino, los huesos de melocotón, los cardos, el plomo, las perlas disueltas, el sedimento del agua y del fuego, los restos de bestias pretéritas, varias toxinas mortales y tu propia sangre. Los muchos se hacen uno, y brillan con todos los colores de la luz divina. Lo lavas hasta que es puro como la nieve recién caída. Lo mueles hasta que es completo como el cinabrio. Lo disuelves en agua perfumada y en vino de hierba bermellón. Por fin, bebes el líquido que brilla con el color de los cielos para que sublime lo terrenal y purifique la carne, y deje solo lo incontaminado.\n\nGrandes pesos tiran de tus párpados y los cierran mientras sientes que te separas del reino mortal. Cuando el peso desaparece y puedes abrirlos de nuevo, ves la Puerta del Cielo, cerrada. La puerta tiene la estructura de un intrincado hierro forjado, pero hecha de oro rojo, con la cerradura trabajada en jade precioso. A ambos lados se alzan muros hechos de incontables perlas, unidas como si fueran un solo ser. Ante las puertas se alzan ocho seres, de aspecto humano y, sin embargo, mucho más.\n«Dinos, joven, ¿qué buscas?»$POD_debate_debate_explanation_footer_description$#R Los Inmortales consultarán a los 6 Wu T'ian antiguos y jugables que siguen activos entre los sobrenaturales y tendrán en cuenta su opinión sobre ti para determinar la Fuerza de Debate contraria, junto con tus actos pasados, como a cuánta gente has asesinado.#!$POD_debate_debate_explanation_footer_initial_score$"
 POD_mummy_elixir_of_eternal_life.202.a: "¡Busco el Elixir de la Vida Eterna!"
 POD_mummy_elixir_of_eternal_life.202.b: "Pensándolo mejor..."

 POD_mummy_elixir_of_eternal_life.203.t: "El segundo nacimiento"
 POD_mummy_elixir_of_eternal_life.203.desc: "Con la ayuda de tus amigos has llevado a cabo un ritual íntimo que culmina en tu suicidio con un arma cuidadosamente diseñada. Con tu sede de vida desalojada, el ojo de tu mente desciende hasta tu ombligo. Una galaxia luminosa gira, a la espera de que ejerzas presión y la condenses en una vida nueva. Al concentrarte en ella, empiezas a cultivar y a canalizar esencia hacia ella. Mientras la esencia regresa al vacío, el inmortal embrionario despierta dentro de ti. Con cada llanto, el infante crece en ti. Un elemento empuja, otro tira. Así gira la rueda. Así nace el nuevo inmortal. Así naces tú, ante la Puerta del Cielo cerrada. La puerta tiene la estructura de un intrincado hierro forjado, pero hecha de oro rojo, con la cerradura trabajada en jade precioso. A ambos lados se alzan muros hechos de incontables perlas, unidas como si fueran un solo ser. Ante las puertas se alzan ocho seres, de aspecto humano y, sin embargo, mucho más.\n«Dinos, joven, ¿qué buscas?»$POD_debate_debate_explanation_footer_description$#R Los Inmortales consultarán a los 6 Wu T'ian antiguos y jugables que siguen activos entre los sobrenaturales y tendrán en cuenta su opinión sobre ti para determinar la Fuerza de Debate contraria, junto con tus actos pasados, como a cuánta gente has asesinado.#!$POD_debate_debate_explanation_footer_initial_score$"
 POD_mummy_elixir_of_eternal_life.203.a: "¡Busco el Elixir de la Vida Eterna!"
 POD_mummy_elixir_of_eternal_life.203.b: "Pensándolo mejor..."

 POD_mummy_elixir_of_eternal_life.21.t: "Audiencia: la carga de la inmortalidad"
 POD_mummy_elixir_of_eternal_life.21.desc: "$POD_debate_debate_strength_header$«No eres el primero ni serás el último en emprender una búsqueda así. Sin embargo, escalar una montaña es cargar con su peso a la espalda. La inmortalidad, incluso una atada a los ciclos del renacimiento como la nuestra, es una carga que remodela el alma. Con cada paso de tu ascenso, irás acumulando pérdidas y tus recuerdos se erosionarán. Renunciarás a todo lo que da sentido a un mortal. Cuando la montaña no tiene cima, ¿tiene sentido la escalada? ¿Hay valor en la lucha sin fin? No para todos. Tales cosas son como un río que labra un cañón. Aunque la separación empieza siendo pequeña, llega un momento en que nada puede salvar el abismo entre tú y la experiencia mortal. Te desligarás de ella y no podrás participar plenamente en ella. Ese dolor solo empeora cuando tienes el poder de conceder la inmortalidad pero sabes que no debes usarlo.\n\n«Esto es una maldición y una carga. ¿Seguirás viendo cada copo de nieve individual dentro de la ventisca, como tantos otros antes que él y, sin embargo, completamente único? ¿Seguirás amándolos, cuidándolos, protegiéndolos? ¿Podrás soportarlo, o te convertirás en un monstruo? ¿Seguirás usando tu saber con sabiduría y concederás el renacimiento eterno solo a quienes puedan soportarlo por sí mismos?»"
 POD_mummy_elixir_of_eternal_life.21.a: "Ya cargamos con el peso de la inmortalidad."
 POD_mummy_elixir_of_eternal_life.21.b: "El propósito que vosotros dais impide la falta de sentido."
 POD_mummy_elixir_of_eternal_life.21.c: "Vosotros os adaptasteis; nosotros también podemos."

 POD_mummy_elixir_of_eternal_life.22.t: "Audiencia: mantener el equilibrio"
 POD_mummy_elixir_of_eternal_life.22.desc: "$POD_debate_debate_strength_header$«Así como la inmortalidad y la capacidad de concederla transforman la relación entre uno mismo y los demás, también transforman la relación con el mundo. Vida y muerte, orden y caos, nacimiento y decadencia. Todo existe en perfecto equilibrio, y nosotros somos sus guardianes. Con la creación de cada Imperecedero, ya bordeamos el filo del desequilibrio y sacudimos el árbol. Unas pocas sacudidas no amenazarán al mundo. Sin embargo, concederte el saber para elaborar el Elixir crea la posibilidad de sacudir el árbol demasiado a menudo y dejarlo sin hojas. Ampliar nuestro círculo no sería un acto neutro: solo serviría para tensar los ecosistemas espirituales. Si la tensión creciera demasiado, hablar de ondas no haría justicia a las deudas invisibles y las ataduras kármicas.\n\n«¿Mantendrás el equilibrio entre los reinos? ¿Abusarás del saber para crear un ejército de Imperecederos y abrir un agujero en la muerte misma?»"
 POD_mummy_elixir_of_eternal_life.22.a: "El equilibrio evoluciona; no es estático."
 POD_mummy_elixir_of_eternal_life.22.b: "Seguiréis regulando nuestro número."
 POD_mummy_elixir_of_eternal_life.22.c: "Causamos menos daño que otros y reparamos el que ellos causan."

 POD_mummy_elixir_of_eternal_life.23.t: "Audiencia: el valor de la mortalidad"
 POD_mummy_elixir_of_eternal_life.23.desc: "$POD_debate_debate_strength_header$«Hay más daño que el que se inflige al equilibrio o la tensión de la carga de la inmortalidad. Como dijimos antes, la inmortalidad nos separa de los mortales, nos desliga de su mundo y nos priva de empatía. Sin arena que se vacíe del reloj, carecemos de urgencia y de necesidad de crecer. Quitar la presión de la muerte y taponar el cristal es perder el impulso de convertirse en algo nuevo o mayor, de cambiar. Si te diéramos la receta del Elixir de la Vida Eterna, la usarías para crear más Imperecederos y los privarías así de la oportunidad de vivir una existencia humana completa. En su lugar, los condenas a una vida de días interminables, a una monotonía sin fin y al agotamiento de un oficio al que nunca podrán escapar. Incluso si lo desearan o te buscaran para ello, nadie puede comprender de verdad la pérdida que supone la inmortalidad hasta después de haberla recibido. Les robas todo eso sin que lleguen a comprender su pérdida. Incluso ha habido quienes usaron la inmortalidad para castigar y torturar a sus rivales y privarlos de una vida normal.\n\n«¿Estás dispuesto a robar ese potencial? ¿Abusarías del poder sin reflexión ni consideración por el dolor causado? ¿Causarás daño y sufrimiento?»"
 POD_mummy_elixir_of_eternal_life.23.a: "Preservamos la humanidad, no la borramos."
 POD_mummy_elixir_of_eternal_life.23.b: "La inmortalidad no es el final, sino solo el comienzo de un nuevo viaje."
 POD_mummy_elixir_of_eternal_life.23.c: "La mortalidad conduce al sufrimiento, la ignorancia y el potencial desperdiciado."

 POD_mummy_elixir_of_eternal_life.24.t: "Audiencia: tu insuficiencia"
 POD_mummy_elixir_of_eternal_life.24.desc: "$POD_debate_debate_strength_header$«El conocimiento es poder. El Elixir de la Vida Eterna tiene el poder de controlar la Rueda, de controlar el ciclo del renacimiento, de permitir que un hombre persista mucho más allá de su final natural. Para los mortales, el poder apenas sirve para revelar la verdad interior, pero para los eternos es mucho más peligroso. Estarás rodeado de magia, de poder. Saber que podrías cambiar las cosas, que podrías arreglarlas: no muchas buenas personas pueden soportar esa carga. No sucumbir a la tentación de construir un mundo perfecto, a ese canto de sirena, es una empresa agotadora que erosiona la voluntad con cada siglo que pasa. El poder invita a la corrupción incluso del más puro de corazón, incluso de quienes tienen las mejores intenciones. Solo los mejores pueden manejarlo, pues, aunque una montaña se erosionará algún día, tarda mucho más que un montón de polvo.\n\nConcederte tal poder antes de que estés listo sería una crueldad hacia ti y el colmo de la necedad, poco distinto de regalar la omnipotencia a un niño. Cargar con el saber que hay tras la creación del Elixir exige haber aprendido ciertas lecciones sobre desapego, humildad y armonía.\n\n«No eres necesariamente indigno. Más bien eres aún joven e incompleto. Concederte lo que buscas sería irresponsable. ¿Por qué deberíamos hacerlo? ¿Qué pruebas ofreces de tu madurez y de tu capacidad para resistir la corrupción?»"
 POD_mummy_elixir_of_eternal_life.24.a: "Ya nos hemos demostrado al llegar hasta aquí."
 POD_mummy_elixir_of_eternal_life.24.b: "La perfección es imposible y el crecimiento, eterno."
 POD_mummy_elixir_of_eternal_life.24.c: "El crecimiento exige responsabilidad."

 POD_mummy_elixir_of_eternal_life.25.t: "Audiencia: el legado del poder"
 POD_mummy_elixir_of_eternal_life.25.desc: "$POD_debate_debate_strength_header$«Digamos que aceptamos tu dignidad y tu capacidad para manejar como es debido el poder inherente al Elixir de la Vida Eterna. El poder de este saber es un legado tan eterno como los seres que crea. Cada cambio lanza ondas por el estanque de los hombres, que se extienden cada vez más lejos. Al concederte el saber para elaborar el Elixir, perpetuamos ese legado, un legado que transmitirás a todos los que transformes o a quienes se lo enseñes. Confiar en ti ahora nos exige confiar en todos los que vengan después de ti, confiar en el legado que crees. Hasta una onda pequeña puede convertirse algún día en una marea que supere incluso nuestro poder para frenarla. En el gran poema de la historia, esos versos que riman se repiten a menudo, y la confianza rara vez se ve recompensada.\n\n«¿Por qué deberíamos depositar esa confianza en este momento? ¿Por qué deberíamos confiar en quienes vengan después? Aunque tus intenciones sean nobles, ¿compartirán las generaciones futuras tus virtudes y tus valores? ¿Por qué deberíamos correr tal riesgo?»"
 POD_mummy_elixir_of_eternal_life.25.a: "El estancamiento es un peligro en sí mismo."
 POD_mummy_elixir_of_eternal_life.25.b: "Toda tradición corre el riesgo de corromperse, pero no por ello debe abandonarse."
 POD_mummy_elixir_of_eternal_life.25.c: "Aunque es difícil, pueden establecerse salvaguardas."

 POD_mummy_elixir_of_eternal_life.26.t: "Audiencia: ¿Por qué...?"
 POD_mummy_elixir_of_eternal_life.26.desc: "$POD_debate_debate_strength_header$«Una última pregunta se alza ante nosotros: tú. ¿Qué te condujo hasta donde estás ahora? Al fin y al cabo, la tuya no fue una búsqueda fácil ni breve, ni exenta de dificultades. ¿Qué te dio fuerzas cuando cuestionaste tu propósito? Bajo todas las cuestiones prácticas, bajo todos los argumentos filosóficos, ¿cuál era tu intención? ¿Buscas el control o ser recordado? ¿Buscas por miedo o por desafío? Si es así, satisfacer tus deseos solo servirá para amplificar esos defectos. ¿Tienes una razón que supere esos impulsos bajos?»"
 POD_mummy_elixir_of_eternal_life.26.a: "Proteger el mundo."
 POD_mummy_elixir_of_eternal_life.26.b: "Trascender la limitación."
 POD_mummy_elixir_of_eternal_life.26.c: "Ascender en iluminación." 
 POD_mummy_elixir_of_eternal_life.26.d: "Cargar con la carga que otros no pueden."
 POD_mummy_elixir_of_eternal_life.26.e: "Preservar el saber y el propósito."

 POD_mummy_elixir_of_eternal_life.270.t: "Audiencia: éxito"
 POD_mummy_elixir_of_eternal_life.270.desc.internal: "«Tras mucha deliberación, hemos aceptado tu propuesta y colmaremos las lagunas de tu saber. También puedes beber de él, si lo deseas. Si lo rechazas ahora y cambias de parecer más tarde, tendrás que beberlo sin nuestra ayuda. Esperemos que nuestra confianza en ti esté bien depositada.\n\n«Para empezar a elaborar el Elixir de la Vida Eterna, recoge tus lágrimas de las 11 de la noche a las 3 de la madrugada, tu sudor de las 11 de la mañana a las 3 de la tarde, tu saliva de las 7 a las 11 de la mañana, tu mucosidad de las 3 a las 7 de la madrugada y tu orina de las 3 a las 7 de la tarde. Luego, mézclalos sobre una llama durante 15 minutos...»"
 POD_mummy_elixir_of_eternal_life.270.desc.external: "«Tras mucha deliberación, hemos aceptado tu propuesta y colmaremos las lagunas de tu saber. También puedes beber de él, si lo deseas. Esperemos que nuestra confianza en ti esté bien depositada.\n\n«Para empezar a elaborar el Elixir de la Vida Eterna, muele jade hasta reducirlo a un polvo fino y viértelo en una pequeña cantidad de oro fundido...»"
 POD_mummy_elixir_of_eternal_life.270.desc.nourishing: "«Tras mucha deliberación, hemos aceptado tu propuesta y colmaremos las lagunas de tu saber. También puedes beber de él, si lo deseas. Esperemos que nuestra confianza en ti esté bien depositada.\n\n«Para empezar a elaborar el Elixir de la Vida Eterna, realiza la técnica del Juego de los Cinco Animales con varios aliados de confianza, y que cada uno de vosotros envíe su esencia, su aliento y su espíritu hacia un caldero de agua hirviendo. Luego...»"
 POD_mummy_elixir_of_eternal_life.270.a: "Este humilde te agradece tu guía."
 POD_mummy_elixir_of_eternal_life.270.b: "Este humilde os agradece la oportunidad."
 eoel_become_mummy_wutian_tt: "Te convertirás en una Momia, lo que cambiará radicalmente tu forma de jugar, desactivará tus edificios y destruirá tus títulos de alto Señorío.\nEs probable que esto paralice tu campaña si no estás preparado para ello."

 POD_mummy_elixir_of_eternal_life.271.t: "Audiencia: éxito parcial"
 POD_mummy_elixir_of_eternal_life.271.desc: "«Como tantos antes que tú, no te concederemos el saber necesario para perfeccionar el Elixir de la Vida Eterna. Sin embargo, has mostrado la sabiduría necesaria para beber de él. Por eso te ofrecemos la oportunidad de dejar atrás tu forma actual y alcanzar una nueva vida y un nuevo propósito, el del renacimiento eterno al servicio del Augusto Personaje de Jade. Si lo rechazas ahora y cambias de parecer más tarde, tendrás que beberlo sin nuestra ayuda. ¿Aceptas?»"
 POD_mummy_elixir_of_eternal_life.271.a: "Este humilde agradece vuestra generosa oferta."
 POD_mummy_elixir_of_eternal_life.271.b: "Este humilde debe rechazar vuestra generosa oferta."

 POD_mummy_elixir_of_eternal_life.272.t: "Audiencia: fracaso"
 POD_mummy_elixir_of_eternal_life.272.desc: "«Tras mucha deliberación, te consideramos demasiado joven. Eres un hueso de melocotón que apenas empieza a brotar. Si te concediéramos el saber necesario para elaborar el Elixir de la Vida Eterna, cargaríamos con la responsabilidad de que te corrompiera. Podrías enseñarlo a los indignos. Podrías torturar a tus rivales o robar las ventajas de la mortalidad a quienes no estén preparados para tal pérdida.»"
 POD_mummy_elixir_of_eternal_life.272.a: "Este humilde volverá más tarde."
 POD_mummy_elixir_of_eternal_life.272.b: "¡Decrépitos necios! ¡Encontraré a quienes valoren mi habilidad!"

 POD_mummy_elixir_of_eternal_life.30.t: "Un lugar entre los tormentos"
 POD_mummy_elixir_of_eternal_life.30.desc: "El Amo Sapientísimo tiene grandes planes para ti. Tras descender al dominio del Amo Potentísimo y encontrarte ahora ante él, te presenta tu próxima tarea. El Amo Prudentísimo proclama la necesidad de más como tú. Tales siervos necesitarán adiestramiento y preparación bajo el cuidado del Amo Temibilísimo. Por desgracia, el señorío del Amo Inescrutabilísimo no cuenta con un espacio dedicado a tal fin. Por ello, el Amo Poderosísimo te ordena reclamar un fragmento de su Infierno para cultivar más siervos. No quieres decepcionar al Amo Temibilísimo, pero tendrás que vértelas con tus rivales entre los demás siervos del Amo Dominantísimo y con los moradores de la tierra.\n\n #R Esta empresa usa una puntuación llamada Fuerza Militar. Esta puntuación se inicia atendiendo a la destreza tuya y de tus campeones. Aumentará o disminuirá durante la propia empresa.\nTu Fuerza Militar inicial es [GetPlayer.MakeScope.GetVariable('character_eoel_wk_force').GetValue|0]#!"
 POD_mummy_elixir_of_eternal_life.30.a: "Demostraré ser digno."  # starts hunt, display POD_mummy_elixir_of_eternal_life_rivals_start_hunt_tt as tooltip
 POD_mummy_elixir_of_eternal_life.30.b: "Reuniré a mis fuerzas y volveré."
 POD_mummy_elixir_of_eternal_life.30.tt.east: "Tu don de un [Glossary('Rey Yama','podgloss.yamaking')] alineado con el este favorece tus esfuerzos."
 POD_mummy_elixir_of_eternal_life.30.tt.north: "Tu don de un [Glossary('Rey Yama','podgloss.yamaking')] alineado con el norte favorece tus esfuerzos."
 POD_mummy_elixir_of_eternal_life.30.tt.west: "Tu don de un [Glossary('Rey Yama','podgloss.yamaking')] alineado con el oeste favorece tus esfuerzos."
 POD_mummy_elixir_of_eternal_life.30.tt.south: "Tu don de un [Glossary('Rey Yama','podgloss.yamaking')] alineado con el sur favorece tus esfuerzos."

 POD_mummy_elixir_of_eternal_life_rivals_start_hunt_tt: "Se estima que la Fuerza Militar de tus rivales es de #V 2000#!"
 POD_CHANGE_CHARACTER_EOEL_WK_FORCE_ADD: "#P Ganas#! $VALUE|0V$ de Fuerza Militar"
 POD_CHANGE_CHARACTER_EOEL_WK_FORCE_SUBTRACT: "#N Pierdes#! $VALUE|0V$ de Fuerza Militar"
 POD_CHANGE_RIVALS_EOEL_WK_FORCE_ADD: "Tus rivales #N ganan#! $VALUE|0V$ de Fuerza Militar"
 POD_CHANGE_RIVALS_EOEL_WK_FORCE_SUBTRACT: "Tus rivales #P pierden#! $VALUE|0V$ de Fuerza Militar"
 POD_mummy_elixir_of_eternal_life_military_strength: "#clickable Tu Fuerza Militar actual es [GetPlayer.MakeScope.GetVariable('character_eoel_wk_force').GetValue|V0]\nSe estima que la Fuerza Militar de tus rivales es [GetPlayer.MakeScope.GetVariable('rivals_eoel_wk_force').GetValue|V0]#!\n\n"

 POD_mummy_elixir_of_eternal_life.31.t: "Lecciones de condenación"
 POD_mummy_elixir_of_eternal_life.31.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Tras aceptar el mandato del Amo Soberanísimo, es hora de recibir la lección del Amo Profundísimo. Será el principio rector sobre el que se funde tu espacio y en torno al cual se moldeará a los nuevos Wu Kuei. ¿Con cuánta firmeza interiorizarás y aplicarás estas palabras de tanta sabiduría?"
 POD_mummy_elixir_of_eternal_life.31.a: "El sufrimiento es el propósito supremo de la vida."  # default
 POD_mummy_elixir_of_eternal_life.31.b: "Explotar el sufrimiento como moneda."  # mikaboshi
 POD_mummy_elixir_of_eternal_life.31.c: "El miedo es el beneficio más puro."  #tou shen
 POD_mummy_elixir_of_eternal_life.31.d: "Los espíritus quebrados son rentables."  #wu hua
 POD_mummy_elixir_of_eternal_life.31.e: "El control debe ser absoluto."  #tou mu
 POD_mummy_elixir_of_eternal_life.31.f: "La memoria es poder."  #bao zhong.
 POD_mummy_elixir_of_eternal_life.31.g: "El conocimiento por encima de todo."  #grandmother witch
 POD_mummy_elixir_of_eternal_life.31.h: "La sutileza gana las guerras."  #emma-o
 POD_mummy_elixir_of_eternal_life.31.i: "Explota a los ciegos."  # hen tian
 POD_mummy_elixir_of_eternal_life.31.j: "Golpea sin ser visto; devóralo todo."  # yargra
 POD_mummy_elixir_of_eternal_life.31.k: "Aplasta a todo el que se te ponga delante."  #dokhor-khan
 POD_mummy_elixir_of_eternal_life.31.l: "Propaga la corrupción y la agonía."  #rangda
 POD_mummy_elixir_of_eternal_life.31.m: "Expándete mediante la esclavitud."  #danoru ka
 POD_mummy_elixir_of_eternal_life.31.effect.success.desc: "La lección se graba en tu mente"
 POD_mummy_elixir_of_eternal_life.31.effect.failure.desc: "La lección resbala por tu mente sin llegar a calar"

 POD_mummy_elixir_of_eternal_life.32.t: "Un pozo sin dueño"
 POD_mummy_elixir_of_eternal_life.32.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Tras oír la lección del Amo Augustísimo e interiorizarla, partes hacia la tierra que te ha asignado el Amo Generosísimo. La marcha es larga y agotadora. Aunque el tamaño de tus fuerzas disuade a las bestias menores de importunarte, necios envidiosos entre los seguidores del Amo Misericordiosísimo buscan usurpar tu posición privilegiada. Repeler sus vanos asaltos es poco problema para alguien tan bendecido por el Amo Poderosísimo como tú. Sin embargo, esas interrupciones fatigan a las partes más frágiles de tu fuerza. Esos débiles son abandonados a los yermos del Infierno. Los más fuertes de entre ellos sobrevivirán y completarán el viaje por su cuenta, así que se pierde poco.\n\nAunque ninguno de los demás siervos principales del Amo Eminentísimo reclama por ahora la tierra, el pozo que se extiende ante ti sigue habitado por algunas de las criaturas menores que vagan por el señorío del Amo Excelsísimo. Expulsarlas costaría poco, pero poco se ganaría con ello para los fines de tu tarea actual. Como alternativa, podrías arriesgar parte de tus recursos y retrasar tus esfuerzos a cambio de la ocasión de esclavizarlas y encaminarlas a apoyar tu empresa."
 POD_mummy_elixir_of_eternal_life.32.a: "Hacerlas retroceder a los yermos."
 POD_mummy_elixir_of_eternal_life.32.b: "Esclavizarlas y ponerlas a trabajar."
 POD_mummy_elixir_of_eternal_life.32.c: "Vincularlas con magia."
 POD_mummy_elixir_of_eternal_life.32.effect.success.desc: "La amenaza queda resuelta. Para siempre."
 POD_mummy_elixir_of_eternal_life.32.effect.failure.desc: "Aunque resuelta, se han malgastado algunos recursos"
 
 POD_mummy_elixir_of_eternal_life.33.t: "Rivales en la Corte del Infierno"
 POD_mummy_elixir_of_eternal_life.33.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Con tu pozo reclamado y sus antiguos moradores resueltos, tus rivales en la corte del Amo Imperiosísimo toman medidas más activas para interferir en tu tarea. Por osar estorbar la tarea del Amo Inexorabilísimo, debes procurar que se los castigue y humille como es debido a ojos del Amo Perspicacísimo. Aunque eliminarlos sería más satisfactorio, el Amo Prudentísimo desaprueba el desperdicio de recursos. Quizá el Amo Generosísimo te conceda sus almas para castigo y adiestramiento. Pero, antes de tales consideraciones, debes decidir la mejor manera de abordar sus intrigas. Quizá las uses para promover tu propia leyenda o dispongas que los castiguen por su descuido al permitirte descubrir sus esfuerzos. O bien podrías ignorarlos por simple desdén."
 POD_mummy_elixir_of_eternal_life.33.a: "Usar su odio para alimentar tu fama."
 POD_mummy_elixir_of_eternal_life.33.b: "Superarlos en obra y en resistencia. Capearé el temporal."
 POD_mummy_elixir_of_eternal_life.33.c: "Desvelar sus intrigas. Tal descuido será castigado."
 POD_mummy_elixir_of_eternal_life.33.effect.success.desc: "Sus mayores intrigas no son más que bagatelas"
 POD_mummy_elixir_of_eternal_life.33.effect.failure.desc: "Qué molestia..."

 POD_mummy_elixir_of_eternal_life.34.t: "Combustible para los fuegos de la condenación"
 POD_mummy_elixir_of_eternal_life.34.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Para alimentar los motores de tortura de tu pozo necesitas inmensas cantidades de esencia. Esta esencia solo puede extraerse infligiendo un dolor y un sufrimiento inmensos a las almas reunidas, exprimiéndoles hasta la última gota de fuerza vital. Refinarás esos recursos en bruto hasta convertirlos en algo más útil para los planes del Amo Potentísimo, en inmensas cubas. Cada gota se procesará y tratará con esmero, lista para arrojarse a los hornos y crear una forma retorcida de vapor que dará energía a los motores de destrucción. Sin embargo, la agonía corriente no basta para tus fines. Si no quieres consumir cantidades ingentes de almas por una sola gota, necesitarás magia potente para amplificar la miseria y destilar la esencia que requieres. ¡Aguardas con ansia la sinfonía de la destrucción!"
 POD_mummy_elixir_of_eternal_life.34.a: "Asaltar los infiernos cercanos."
 POD_mummy_elixir_of_eternal_life.34.b: "Refinar las almas existentes."
 POD_mummy_elixir_of_eternal_life.34.c: "Sacrificar mortales para obtener más almas."
 POD_mummy_elixir_of_eternal_life.34.effect.success.desc: "Ahora tendremos combustible de sobra"
 POD_mummy_elixir_of_eternal_life.34.effect.failure.desc: "Qué desperdicio de recursos"

 POD_mummy_elixir_of_eternal_life.35.t: "Forjar a los condenados"
 POD_mummy_elixir_of_eternal_life.35.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Por todo el mundo hay innumerables arrabales, regiones decrépitas y tierras empobrecidas. En cada tierra y en cada lugar, los sin techo, los hambrientos, los desesperanzados conocen la verdad: ¡a nadie le importan! ¡Nadie sabe siquiera que existen! ¡No tienen nada! ¡Jamás tendrán nada... salvo su ira! ¡Su odio! ¡Qué delicioso odio! ¡Tomarás esa chispa y la convertirás en un infierno que abrase los cielos mismos!\n\nSin embargo, avivar la llama requerirá un buen atizador, y antes de poder servir al Amo Imperialísimo, deben forjarse hasta ser herramientas útiles. ¿Cómo transformarás estos lastimosos despojos en lo que necesitas? ¿Simplemente les darás equipo para compensar la debilidad de su carne? ¿Tomarás solo a los mejores y los pulirás? ¿Moldearás hasta a los más miserables para convertirlos en algo digno de uso?"
 POD_mummy_elixir_of_eternal_life.35.a: "Usaré un acondicionamiento brutal."
 POD_mummy_elixir_of_eternal_life.35.b: "Optimizaré su adiestramiento." 
 POD_mummy_elixir_of_eternal_life.35.c: "Reclutaré solo a los mejores."
 POD_mummy_elixir_of_eternal_life.35.d: "Los equiparé con el mejor equipo."
 POD_mummy_elixir_of_eternal_life.35.effect.success.desc: "Forjados hasta una perfección oscura"
 POD_mummy_elixir_of_eternal_life.35.effect.failure.desc: "Muchos mueren antes de que el programa se perfeccione"

 POD_mummy_elixir_of_eternal_life.36.t: "El tormento se desata"
 POD_mummy_elixir_of_eternal_life.36.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Como es debido, el Amo Dominantísimo ostenta un poder absoluto en su dominio. Sin embargo, el pozo que reclamaste es responsabilidad tuya. Por desgracia, han sido muchas las demandas sobre tu tiempo, incluido tu territorio reclamado entre los mortales. Eso creó una oportunidad que tus esbirros han aprovechado.\n\nAlgunos de los esclavos menores corren desbocados, prenden fuegos al azar y sueltan a las bestias que habías capturado. Los esbirros solo conspiran contra ti, mientras que los más previsores buscan suplantarte ante los ojos del Amo Augustísimo.\n\nA largo plazo, los necios suponen poco riesgo. Como mínimo, eres demasiado importante para los planes del Amo Perspicacísimo. Sin embargo, podrían resultar un inconveniente y retrasar tus iniciativas. ¿Cómo afrontarás su necia insurrección?"
 POD_mummy_elixir_of_eternal_life.36.a: "¡Reafirmar el control por la fuerza!"
 POD_mummy_elixir_of_eternal_life.36.b: "Usar el caos para refinarlos."
 POD_mummy_elixir_of_eternal_life.36.c: "Quizá sea necesaria la ayuda del Amo Poderosísimo."
 POD_mummy_elixir_of_eternal_life.36.effect.success.desc: "Todo según lo previsto"
 POD_mummy_elixir_of_eternal_life.36.effect.failure.desc: "¡Cuánto desperdicio!"

 POD_mummy_elixir_of_eternal_life.37.t: "El juicio del Amo"
 POD_mummy_elixir_of_eternal_life.37.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Tras mucho trabajo, el pozo que has excavado en el Infierno del Amo Inexorabilísimo gime de tormento. Las cadenas tintinean sobre calzadas de hierro suspendidas sobre mares de almas que gritan. Los hornos rugen como leones hambrientos con agonía destilada mientras los primeros espíritus quebrados son arrastrados hacia las cubas de corrupción, con su esencia lista para ser forzada en recipientes mortales.\n\nAntes de que puedas conseguir necios en los que infundir los espíritus, te llaman ante el Amo Perspicacísimo. Cuando la mirada del Amo Augustísimo se posa sobre ti, la corte enmudece. Tus rivales aguardan con avidez tu humillación mientras incontables siervos menores se desploman presas de un terror trémulo. Ha llegado la hora de evaluar la calidad del sufrimiento y el tormento que generas. ¿Has construido meramente otro pozo de gritos entre mil, o has erigido una tierra de desesperación verdaderamente digna del señorío del Amo Excelsísimo? ¿Favorecerán tus esfuerzos las grandes ambiciones del Amo Inexorabilísimo o desperdiciarán recursos más idóneos para otras empresas? Solo un juicio por combate determinará el destino tuyo y de tus esfuerzos."
 POD_mummy_elixir_of_eternal_life.37.a: "¡Demostrad vuestro poder, esbirros míos!"
 POD_mummy_elixir_of_eternal_life.37.b: "¡No solo recluté campesinos, sino también a mis campeones!"
 POD_mummy_elixir_of_eternal_life.37.c: "¡Monté toda una campaña de reclutamiento!"
 POD_mummy_elixir_of_eternal_life.37.d: "¡Dad un espectáculo, esbirros míos!"
 POD_mummy_elixir_of_eternal_life.37.effect.success.desc: "Hasta el Amo Implacabilísimo parece algo impresionado"
 POD_mummy_elixir_of_eternal_life.37.effect.failure.desc: "Su actuación no hace sino reforzar las pretensiones de tus rivales"
 POD_mummy_elixir_of_eternal_life.37.final_check: "Se comparará tu Fuerza Militar con la de tus rivales y enemigos para determinar el resultado final"

 POD_mummy_elixir_of_eternal_life.38.t: "El Infierno del Amo Soberanísimo"
 POD_mummy_elixir_of_eternal_life.38.desc: "El Amo Sapientísimo ha visto tu valía. Con un solo gesto de cabeza, reconoce tu éxito.\n\nDe regreso a tu pozo, ahora de verdad tuyo, lo contemplas. Los hornos arden, las fábricas rugen. Las chimeneas humean, las sombras se extienden. Las cadenas tintinean, las maldiciones reptan. Las almas gritan, los espectros fluyen. Los desdichados lloran, los wraiths se retuercen. Una sonrisa cruza tu rostro mientras grandes ambiciones cristalizan en tu mente. El Amo Generosísimo te ha concedido esta oportunidad, y sería de mala educación no aprovecharla al máximo."
 POD_mummy_elixir_of_eternal_life.38.a: "Tantas almas esperando convertirse en Wu Kuei."
 POD_mummy_elixir_of_eternal_life.38.b: "Yo seré la primera de ellas."

 POD_mummy_elixir_of_eternal_life.39.t: "El precio supremo"
 POD_mummy_elixir_of_eternal_life.39.desc: "El Amo Excelsísimo no tolera la debilidad, y tus esfuerzos han resultado insuficientes. Tus rivales se dan ahora un festín con tu fracaso y desgarran el cadáver de tu pozo. Poco te importa, pues la decepción del Amo Temibilísimo perdurará mucho más que tu existencia."
 POD_mummy_elixir_of_eternal_life.39.a: "No. NO. ¡NO! ¡¡¡NOOOO!!! ¡¡¡AAAAHHHHH!!!"

 # TODO YK: turn these into proper events
 # TODO YK: balance costs and skill requirements based on final YK design
 POD_mummy_elixir_of_eternal_life.40.t: "Un facsímil de vida"
 POD_mummy_elixir_of_eternal_life.40.desc: "Los gritos de los condenados te rodean y se funden en un único muro. Donde otros sentirían que los oprime con una presión tangible, a ti te rejuvenece. De su sufrimiento has moldeado montañas. De sus remordimientos has tallado ríos. De su culpa has construido tu señorío. De su odio te has alimentado. Sus tormentos son tuyos. Sus cuerpos son tuyos. Sus almas son tuyas.\n\nSin embargo, sus almas siguen atrapadas en tu señorío, inútiles para tus mayores ambiciones. Incluso si regresaran al mundo mortal como un [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], sería como un burdo facsímil de vida. Los Wu Kuei ofrecen la posibilidad de crear seres inmortales capaces de vida verdadera, seres que renacerán eternamente. Los Wu Kuei ocupan su nicho, pero tienen ciertas... limitaciones, sobre todo en comparación con sus primos llamados «justos». Si completaras el Elixir de la Vida Eterna, podría crearse un contrapeso adecuado a los Wu T'ian.\n\n #R Esta empresa usa una puntuación llamada Conocimiento Experimental. Esta puntuación se inicia atendiendo a tu saber y a tu poder. Aumentará o disminuirá durante la propia empresa.\nTu Conocimiento Experimental inicial es [GetPlayer.MakeScope.GetVariable('character_eoel_diy_knowledge').GetValue|0]#!"
 POD_mummy_elixir_of_eternal_life.40.a: "¡Nada se interpondrá en mi camino!"  # starts hunt, display POD_mummy_elixir_of_eternal_life_diy_start_hunt_tt as tooltip
 POD_mummy_elixir_of_eternal_life.40.b: "Tengo siglos para lograrlo."

 POD_mummy_elixir_of_eternal_life_diy_start_hunt_tt: "Se estima que el Conocimiento Experimental requerido es de #V 2500#!"
 POD_CHANGE_CHARACTER_EOEL_DIY_FORCE_ADD: "Tú #P ganas#! $VALUE|0V$ de Conocimiento Experimental"
 POD_CHANGE_CHARACTER_EOEL_DIY_FORCE_SUBTRACT: "Tú #N pierdes#! $VALUE|0V$ de Conocimiento Experimental"
 POD_CHANGE_OPPOSITION_EOEL_DIY_FORCE_ADD: "Tú #N ganas#! $VALUE|0V$ de Conocimiento Experimental requerido"
 POD_CHANGE_OPPOSITION_EOEL_DIY_FORCE_SUBTRACT: "Tú #P pierdes#! $VALUE|0V$ de Conocimiento Experimental requerido"
 POD_mummy_elixir_of_eternal_life_experimental_knowledge: "#clickable Tu Conocimiento Experimental actual es [GetPlayer.MakeScope.GetVariable('character_eoel_diy_knowledge').GetValue|V0]\nSe estima que tu Conocimiento Experimental requerido es [GetPlayer.MakeScope.GetVariable('opposition_eoel_diy_knowledge').GetValue|V0]#!\n\n"

 POD_mummy_elixir_of_eternal_life.41.t: "Un Laboratorio de Mil Agonías"
 POD_mummy_elixir_of_eternal_life.41.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Tus esfuerzos pasados te han proporcionado una gran cantidad de saber, bastante incluso para crear Wu Kuei. Sin embargo, el mero saber no basta. Hacen falta experiencia activa y aplicación práctica. Se encenderán los hornos. Los esclavos trabajarán. Las almas se reducirán a memoria y esencia. La vida y la muerte se disecarán hasta que no tengan secretos para ti.\n\nPuede que haga falta mucho fracaso. Puede que se gasten muchos recursos. Son costes que estás dispuesto a asumir."
 POD_mummy_elixir_of_eternal_life.41.a: "Experimentar con los condenados."  # 20 martial; +100/-100 you
 POD_mummy_elixir_of_eternal_life.41.b: "Los ambiciosos deberían ofrecerse con entusiasmo."  # yang-aligned only; -100 gold for +100 you
 POD_mummy_elixir_of_eternal_life.41.c: "Pueden conseguirse sujetos vivos."  # yin-aligned only; -100 prestige for +100 you
 POD_mummy_elixir_of_eternal_life.41.effect.success.desc: "Qué... fascinante"
 POD_mummy_elixir_of_eternal_life.41.effect.failure.desc: "Los sacrificios eran inevitables"

 POD_mummy_elixir_of_eternal_life.42.t: "La primera destilación"
 POD_mummy_elixir_of_eternal_life.42.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Los experimentos han comenzado. Se ha establecido un proceso coherente con cada variable controlada. Cada sujeto se clasifica y cada fracaso se cataloga. Nada se pasa por alto ni se olvida, pues la verdad puede estar en cualquier parte.\n\nPerecen cien. Luego mil. Luego diez mil. Luego cien mil. La mayoría de las almas se reducen a ceniza, si es que a tanto. Unas pocas, preciosas, sobreviven al proceso unos instantes antes de deshacerse.\n\nCon cada fracaso se aprende algo, pues queda un residuo. Una mancha. No logras identificarla. Todavía."
 POD_mummy_elixir_of_eternal_life.42.a: "Perfeccionar aún más el proceso."  # 25 stewardship; +100/-100 you
 POD_mummy_elixir_of_eternal_life.42.b: "Apartar a los sujetos que lo logran para estudiarlos más."  # 25 learning; +100/-100 you
 POD_mummy_elixir_of_eternal_life.42.c: "Consumir yo mismo el residuo."  # 70 prowess; +200 you or 2 aggravated damage
 POD_mummy_elixir_of_eternal_life.42.effect.success.desc: "¡Así que eso es lo que hace!"
 POD_mummy_elixir_of_eternal_life.42.effect.failure.desc: "Cuántos recursos desperdiciados"

 POD_mummy_elixir_of_eternal_life.43.t: "El Tesoro de los Pesares"
 POD_mummy_elixir_of_eternal_life.43.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Tras incontables experimentos, por fin se ha identificado el ingrediente que faltaba. Mejor aún, has hallado un medio fiable de crearlo. A diferencia del oro, no puede simplemente extraerse. A diferencia de la seda, no puede simplemente cosecharse. A diferencia de las mercancías, no puede simplemente comprarse. Solo pueden formarlo instantes de sufrimiento verdadero, profundo y que cambia vidas. Los sufrimientos del nacimiento, la vejez, la enfermedad, la muerte, el encuentro con lo desagradable, la pérdida de lo agradable y no recibir lo deseado. Los sufrimientos de la forma, el sentimiento, la percepción, la formación y la conciencia. El remordimiento. La traición. La obsesión. La desesperación. Cada instante crea una gota que puede destilarse en esencia, una esencia que puedes usar.\n\nAfortunadamente, posees una abundancia de tragedias. Las almas de los akuma y de sus siervos han sido vinculadas en adornos de jade y selladas en tu tesoro con puertas de ébano. Cada una representa una vida entregada voluntariamente a la corrupción, a menudo tras mucho sufrimiento, en vida o en la muerte. Aunque podrían contener la esencia que falta, costaría mucho, de modo que quizá convenga una alternativa."
 POD_mummy_elixir_of_eternal_life.43.a: "Ampliar las fábricas de tormento."  # 15 stewardship, -100 gold; +100/-100 you
 POD_mummy_elixir_of_eternal_life.43.b: "Diseñar nuevas formas de sufrimiento."  # 25 intrigue; +100/-100 you
 POD_mummy_elixir_of_eternal_life.43.c: "Arrebatar almas de las avaras garras de Yu Huang."  # 25 martial; +100/-100 you
 POD_mummy_elixir_of_eternal_life.43.d: "¡Abrir las cámaras!"  # kill a random Defiled; +200 you
 POD_mummy_elixir_of_eternal_life.43.effect.success.desc: "¡Por fin! ¡Más que suficiente esencia!"
 POD_mummy_elixir_of_eternal_life.43.effect.failure.desc: "Hicieron falta muchísimos de ellos"

 POD_mummy_elixir_of_eternal_life.44.t: "Ojos más allá del velo"
 POD_mummy_elixir_of_eternal_life.44.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Ya corren rumores por las Tierras de las Sombras de que tu atención está puesta en otra parte. Los Reyes Diablo rivales envían espías e incursiones de tanteo. Las Fuentes Amarillas y su señor hacen preguntas. Nunca ha perdonado a los Reyes Yama que le robaran porciones de las Tierras de las Sombras y hace tiempo que busca recuperarlas.\n\nTus verdaderos objetivos no permanecerán ocultos para siempre, en parte por los recursos que has gastado y estás gastando. Sin embargo, esos mismos recursos gastados debilitan tu posición. Peor aún, la posibilidad de adquirir semejante poder puede invitar a una intervención antes de que lo logres."
 POD_mummy_elixir_of_eternal_life.44.a: "¡Que vengan!"  # 25 martial; +100/-100 you
 POD_mummy_elixir_of_eternal_life.44.b: "Alimentarlos con conclusiones falsas."  # 25 intrigue; +100/-100 you
 POD_mummy_elixir_of_eternal_life.44.c: "Sacrificar a unos cuantos peones prescindibles."  # -100 gold; +100/-100 you
 POD_mummy_elixir_of_eternal_life.44.effect.success.desc: "Su atención se desvía"
 POD_mummy_elixir_of_eternal_life.44.effect.failure.desc: "Cuánto desperdicio para lidiar con ellos"

 POD_mummy_elixir_of_eternal_life.45.t: "Imperfecciones inevitables"
 POD_mummy_elixir_of_eternal_life.45.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Con las últimas mejoras y la adición de ese ingrediente especial, los sujetos de prueba ya no se deshacen en incontables hebras de carne y hueso. Aunque esas hebras han servido para confeccionar ropajes eternamente chirriantes, nunca constituyeron los Wu Kuei mejorados que deseas.\n\nEn lugar de perecer, quedan con algo menos que vida. Sus heridas se cierran. Su carne perdura. Sin embargo, quedan como abominaciones gritonas mantenidas con vida solo por tu voluntad. Si alguna vez abandonaran tu señorío, sus cuerpos se desplomarían en más hebras. Aunque su forma física persiste, sus mentes se degradan en locura, ansia y desesperación.\n\nAlgún defecto debe de ocultarse en el proceso."
 POD_mummy_elixir_of_eternal_life.45.a: "Fortalecer a los sujetos mediante la disciplina."  # 25 martial; +100/-100 you
 POD_mummy_elixir_of_eternal_life.45.b: "Examinar sus deseos y ambiciones."   # 25 diplomacy; +100/-100 you
 POD_mummy_elixir_of_eternal_life.45.c: "Diseccionarlos antes de la degeneración."  # 25 learning; +100/-100 you
 POD_mummy_elixir_of_eternal_life.45.effect.success.desc: "¡Así que eso es lo que hace!"
 POD_mummy_elixir_of_eternal_life.45.effect.failure.desc: "Más fracasos que limpiar"

 POD_mummy_elixir_of_eternal_life.46.t: "El prototipo rebelde"
 POD_mummy_elixir_of_eternal_life.46.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Por fin, ¡POR FIN!, uno de los sujetos conserva su forma original en lugar de convertirse en un monstruo horrendo que ni siquiera tú soportas mirar. ¡Habla! ¡Recuerda! ¡Razona!\n\nAl principio te deja realizar tus experimentos de seguimiento. Se obtienen algunas intuiciones, pero entonces, ¡OSA negarse a una orden! ¡OSA actuar contra tu voluntad! ¡PRETENDE tener #italic «libre albedrío»#!! ¡#italic Supuestamente#!, hay verdades ocultas a TU VISTA! ¡Según él, el sufrimiento es #italic «insuficiente»#! y la #italic «libertad»#!, nada menos, es necesaria! ¡Como si tu gloria y tu poder pudieran ser #bold insuficientes#! para algo! ¡La idea es un absoluto disparate!\n\nSea como sea, necesitas el prototipo para proseguir tus experimentos."
 POD_mummy_elixir_of_eternal_life.46.a: "La tortura quebrará su voluntad."  # 25 intrigue; +100/-100 you
 POD_mummy_elixir_of_eternal_life.46.b: "Destruirlo y conservar los restos."   # 25 martial; +100/-100 you
 POD_mummy_elixir_of_eternal_life.46.c: "Ofrecerle un trato."   # 25 diplomacy; +100/-100 you
 POD_mummy_elixir_of_eternal_life.46.d: "¡ME OBEDECERÁ!"  # only if can bind wraiths; +100 you
 POD_mummy_elixir_of_eternal_life.46.effect.success.desc: "¡PENSASTE EN DESOBEDECERME!"
 POD_mummy_elixir_of_eternal_life.46.effect.failure.desc: "Tendré que hacer otro"

 POD_mummy_elixir_of_eternal_life.47.t: "Una última prueba"
 POD_mummy_elixir_of_eternal_life.47.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Cada año de trabajo, cada experimento, cada fracaso, cada sacrificio de recursos, todo ello te ha conducido a este momento. Crees haber creado con éxito el Elixir de la Vida Eterna, una fórmula capaz de conceder el renacimiento eterno. Sin embargo, no puedes estar seguro a menos que pruebes como es debido la versión final. Fue difícil y carísimo de elaborar. Si fracasaras, podría pasar algún tiempo antes de que pudieras reunir los materiales necesarios para intentarlo de nuevo."
 POD_mummy_elixir_of_eternal_life.47.a: "Probarlo con un alma condenada."  # 80 stewardship; +0/+500 required knowledge
 POD_mummy_elixir_of_eternal_life.47.b: "Probarlo con un cautivo fuerte."  # 60 stewardship, requires prisoner with >=50 prowess; +0/+500 required knowledge
 POD_mummy_elixir_of_eternal_life.47.c: "Probarlo con un esclavo leal."  # 40 stewardship, requires a Defiled; +0/+500 required knowledge
 POD_mummy_elixir_of_eternal_life.47.d: "Probarlo con mi siervo más capaz."  # 20 stewardship, requires a Favorite Defiled; +0/+500 required knowledge
 POD_mummy_elixir_of_eternal_life.47.effect.success.desc: "Mi éxito era inevitable"  # if you pass this check, the prisoner/Defiled becomes the empowered Wu Kuei, regardless of their current splat
 POD_mummy_elixir_of_eternal_life.47.effect.failure.desc: "Su muerte es... desafortunada"  # if you fail this check, the prisoner/Defiled dies
 POD_mummy_elixir_of_eternal_life.47.final_check: "Se comparará tu Conocimiento Experimental con la cantidad requerida para determinar el resultado final"

 #success
 POD_mummy_elixir_of_eternal_life.48.t: "Renacimiento eterno"
 POD_mummy_elixir_of_eternal_life.48.desc: "Todos viven y mueren. Algunos regresan al reino mortal en un estado intermedio. Solo unos pocos viven, mueren y vuelven a la vida como ellos mismos. Tu trabajo anterior sobre el Elixir de la Vida Eterna te permitió crear una versión burda de estos Imperecederos, seres a los que llamas Wu Kuei. Sin embargo, siempre tuvieron sus limitaciones, y sus almas carecían del estado intacto de las que crean los arrogantes Ocho Inmortales.\n\nAhora ves cómo el sujeto muere bajo tus instrumentos y vuelve a alzarse. Cada prueba confirma que su cuerpo está vivo y que su lealtad es absoluta. Son tuyos y, pronto, serán legión."
 POD_mummy_elixir_of_eternal_life.48.a: "¡Que tiemblen los Cielos!"  # learn the elixir

 #failure
 POD_mummy_elixir_of_eternal_life.480.t: "La Gran Contaminación"
 POD_mummy_elixir_of_eternal_life.480.desc: "Tu laboratorio enmudece. La fórmula, los cálculos, los preparativos. ¡Todo era impecable! ¡Tu trabajo era impecable! ¡Y, sin embargo, ha fallado! Peor aún, con cada segundo, la carne del sujeto de prueba se desprende de sus huesos, huesos que se están licuando activamente. El charco de carne bronceada, sangre carmesí y hueso de marfil se acumula a tus pies antes de salir despedido violentamente contra las paredes cuando el alma se rompe. Secciones enteras del laboratorio se derrumban en yermos que gritan. Partes de tu señorío y de su barrera se astillan cuando la onda de choque espiritual de la explosión se estrella contra ellas.\n\nLlevará tiempo reparar el daño y volver a afianzar tu posición entre los Reyes Yama. Por ahora, el trabajo debe terminar..."
 POD_mummy_elixir_of_eternal_life.480.a: "Pero tengo la eternidad para completarlo..."
