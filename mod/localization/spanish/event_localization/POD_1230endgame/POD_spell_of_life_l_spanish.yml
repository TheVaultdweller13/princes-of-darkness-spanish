 POD_mummy_spell_of_life.1.t: "Solicitar acceso"
 POD_mummy_spell_of_life.1.desc: "Para proseguir nuestra investigación sobre los medios del renacimiento eterno, necesitaremos acceder a los Escritos Secretos de Cabirus. El actual propietario, [writings_cabirus_owner.GetFirstName], ha tenido la gentileza de ofrecernos una audiencia. Sin embargo, querrá algo a cambio de permitirnos el acceso al artefacto."
 POD_mummy_spell_of_life.1.a: "Tengo libros que ofrecer a cambio."
 POD_mummy_spell_of_life.1.b: "Apoyaré tus esfuerzos de guerra."
 POD_mummy_spell_of_life.1.c: "Proporcionaré combustible para tus experimentos."
 POD_mummy_spell_of_life.1.c.fuel_experiments: "El nivel de [development|E] de todos los condados del [duchy|E] [de_jure|E] de tu capital disminuirá en 5 y obtendrán el modificador [GetModifier('extinguish_life_modifier').GetNameWithTooltip] durante 1 año"
 POD_mummy_spell_of_life.1.d: "Como miembro del Consejo Privado, exijo acceso"
 POD_mummy_spell_of_life.1.e: "El coste es demasiado alto"

 POD_mummy_spell_of_life.2.t: "La última copia destruida"
 # Inspired by karde mentioning that Horus rampaged through Marseilles while looking for the Uraeus of Orisis, among other things
 POD_mummy_spell_of_life.2.desc: "Con un control estricto, Horus esperaba salvaguardar los secretos de la inmortalidad, de modo que nadie indigno del don lo recibiera. Sin embargo, los secretos tienen una manera de llegar a saberse. Según las historias, un joven momia llamado Cabirus viajó a Grecia en el siglo VI a. C. y cambió un libro a un mago mortal, que regresó a casa y fue copiándolo poco a poco él mismo. De allí se distribuyó a unos pocos magos mortales más, y se han creado varias momias basándose en la versión del gran rito de Osiris preservada en lo que llegó a conocerse como los #italic Escritos Secretos de Cabirus#!. A lo largo de los siglos, Horus y sus siervos han dado caza y quemado casi todas las copias. Sin embargo, no lograron dar con todas. Una permaneció a salvo en la gran fortaleza de montaña de Ceoris, ciudadela del clan vampírico de los Tremere. Fracasaron... hasta ahora.\n\nMientras los fuegos de la Inquisición arrasan Europa, neonatos, Furores, Brujah y otros se han alzado contra sus Antiguos en lo que ahora se llama la Revuelta Anarquista. En medio del caos, Horus vio una oportunidad. Reunió a sus fuerzas de vampiros, Fera y momias y se abrió paso a sangre y fuego por los salones de Ceoris. Aunque no eran la maldita progenie de su tío, su magia oscura, sus crueles experimentos y su sed insensata de conocimiento los hacían apenas más dignos del Gran Rito. Mientras su magia llevaba la luz del sol a los salones oscurecidos, avanzó sin regodearse en ello como algunos de sus compañeros, aceptando simplemente la necesidad. Con cada mandoble, su hoja separaba las cabezas de sus cuerpos inmundos, y se acercaba más a su cámara oculta. Sus hechizos y rituales resbalaban sobre él, y ni siquiera las protecciones de la cámara pudieron detenerlo. De un chasquido, brotó una llama voraz en torno a cierto libro, la última copia de aquel texto creado por un necio hace tanto tiempo. Mientras las páginas ardían y se enroscaban sobre sí mismas, mientras la ceniza caía sobre la mesa y el humo le llenaba las fosas nasales, mientras el fuego crepitaba y las llamas se extendían, una leve sonrisa se abrió camino en su rostro."
 POD_mummy_spell_of_life.2.a: "Tanto perdido, y tan deprisa."
 POD_mummy_spell_of_life.2.a.tt: "Los requisitos de la decisión «$spell_of_life_stage1_cabirus_phase1_decision$» han cambiado"

 POD_mummy_spell_of_life.3.t: "Una parte hecha, otra comenzada"
 POD_mummy_spell_of_life.3.desc: "Una vez alcanzada una comprensión básica del Hechizo de la Vida, tu mentor no puede enseñarte más. Te dice que la magia es algo que debe dominarse por uno mismo, no enseñarse en un aula. Quizá simplemente no quiera enseñarte más detalles, pero el resultado es el mismo. Tendrás que recorrer el mundo para reunir registros antiguos, aprender de los fracasos ajenos y estudiar con otros que tengan una comprensión parcial del Hechizo. Al fin y al cabo, oír la misma lección de otra boca suele ser valioso cuando se intenta dominar una materia. Además, tendrás que dedicar tiempo a investigar, a traducir despacio los registros y a realizar experimentos.\n\n#help Para alcanzar 90 de [trait_level_track_xp|E] en el Hechizo de la Vida y avanzar más, tendrás que acumularla de forma pasiva y completando [journeys|E]. Consulta la [story_cycle|E] $POD_story_spell_of_life_explanation$ y la descripción del rasgo Buscador del Renacimiento Eterno de tu personaje para saber más.#!"
 POD_mummy_spell_of_life.3.desc.b: "Una vez alcanzada una comprensión básica del Hechizo de la Vida, la pura experimentación no puede llevarte más lejos. La magia es algo que debe dominarse mediante la práctica, no enseñarse en un aula. Tendrás que recorrer el mundo para reunir registros antiguos, aprender de los fracasos ajenos y estudiar con otros que tengan una comprensión parcial del Hechizo. Al fin y al cabo, oír la misma lección de otra boca suele ser valioso cuando se intenta dominar una materia. Además, tendrás que dedicar tiempo a investigar, a traducir despacio los registros y a realizar más experimentos.\n\n#help Para alcanzar 90 de [trait_level_track_xp|E] en el Hechizo de la Vida y avanzar más, tendrás que acumularla de forma pasiva y completando [journeys|E]. Consulta la [story_cycle|E] $POD_story_spell_of_life_explanation$ y la descripción del rasgo Buscador del Renacimiento Eterno de tu personaje para saber más.#!"
 POD_mummy_spell_of_life.3.a: "Mi búsqueda aún no ha terminado..."

 POD_mummy_spell_of_life.4.t: "Una advertencia para que cese"
 POD_mummy_spell_of_life.4.desc: "Algo está ocurriendo... cambiando... desgarrándose. Aparecen desgarros en el Manto que pende entre las tierras materiales y las de las sombras. Soplan tormentas sobre las tierras de los muertos, no lo bastante para marcar una nueva era, pero aun así barren a muchos espíritus hacia los lugares oscuros. Las bestias se alzan, los monstruos se extienden y los espíritus se congregan.\n\nUn eclipse oculta el rostro del Sol y proyecta sombras cargadas de sentido. Hombres y mujeres, niños y ancianos, mortales de toda clase dicen cosas extrañas al encontrarse contigo, con los ojos arremolinados de oro y las voces cargadas de una edad imposible en seres como ellos. Mensajes crípticos aparecen dondequiera que mires, grabados a fuego en las paredes, y hablan de los muertos sin reposo. Lo poco que logras sacar en claro indica que tu creación de momias y tu uso de la magia del renacimiento eterno están dañando... #bold ESO#!."
 POD_mummy_spell_of_life.4.a: "Extraños augurios, en efecto..."

 POD_mummy_spell_of_life.5.t: "El largo viaje del día hacia la noche"
 POD_mummy_spell_of_life.5.desc: "Quizá sea consecuencia de la falta de contención, de no dejar algunas cosas ocultas. Quizá fuera tu objetivo desde el principio, cuando buscaste la magia del renacimiento eterno. Al final, da igual. Ya casi nada importa.\n\nHay muchos relatos sobre el fin de los tiempos y muchos nombres para él. Algunos vieron un diluvio de sangre que barría el mundo hasta dejarlo limpio. Otros predijeron el ascenso del avatar del mal supremo. Pocos acertaron al decir que acabaría con la ruptura del velo entre los mundos.\n\nLo que antes eran desgarros son ahora grandes rasgaduras que dejan el Manto reducido a poco más que jirones de cortina. Grietas hacia el abismo sin fin rezuman una niebla verdosa y enfermiza que devora la tierra. Vagan pesadillas, a las que dan forma todos nuestros miedos, miedos con una vida nueva en estos días oscurecidos. Sombras vivientes, restos de quienes se rindieron a la oscuridad interior, acechan en los valles anegados de niebla y en los bosques engullidos. Formas, poseídas en mente, cuerpo y espíritu por horrores más allá de la comprensión mortal, recorren las tierras, seducen y tientan. Una tormenta como ninguna otra engulle las tierras de los muertos y las arroja a unas fauces que no conocen la saciedad. Ante tales vientos, hasta los sellos del propio Abismo se resquebrajaron. La furia de los vientos se extiende incluso al mundo material, consume la luz del sol y permite caminar libres a quienes temen sus rayos. Aquellos cuyos cuerpos se convirtieron en polvo hace mucho merodean por las tierras en busca de cuerpos que robar para convertirse en inmortales no vivos que se dan un festín de sangre y aliento. Las aguas se tornan rojas de sangre cuando los manantiales de lo profundo se abren. Langostas con coronas de oro, rostros de hombre, dientes de león y colas de escorpión azotan las tierras y se extienden en enjambres tan vastos que sus alas bastan para ensordecer a los muertos.\n\nEn medio de los horrores, los mortales oyen voces en la cabeza y ven mensajes en las paredes, que los dotan del poder de lograr hazañas que ni siquiera los inmortales conseguirían replicar. Los primeros entre sus blancos son los Imperecederos, los renacidos eternamente, cuya creación condujo a esto. Con cada golpe, buscan remendar los desgarros. Siguen extendiéndose rumores de dos seres alados, extraños y resplandecientes, que ayudan a estos cazadores y tratan de nuevo, activamente, de separar a los muertos de los vivos. Solo el tiempo dirá si sus esfuerzos dan fruto, pero esa es una historia para otro día..."
 POD_mummy_spell_of_life.5.a: "Y así terminan las cosas, por ahora..."
 POD_mummy_spell_of_life.5.a.tt: "El mundo se acerca a su fin mientras la [umbra|E] sigue fundiéndose con las Tierras de Piel. #X La partida ha terminado, pues el mundo que conocías llega a su fin.#!"

 POD_mummy_spell_of_life.10.t: "Una audiencia con Horus"
 POD_mummy_spell_of_life.10.desc: "$POD_debate_debate_strength_header$Solo Horus posee el Hechizo de la Vida. Hace muchísimo tiempo que no crea una momia nueva con el Hechizo. Desde luego, tal como están las cosas, no compartirá el Hechizo contigo.\n\nSin embargo, tus servicios anteriores han bastado para que te conceda una audiencia. Si lograras presentar argumentos lo bastante convincentes, podrías obtener su ayuda en tu búsqueda y hacerla bastante más fácil.$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.10.a: "Viajaré hasta su corte."
 POD_mummy_spell_of_life.10.b: "Pensándolo mejor..."

 POD_mummy_spell_of_life.11.t: "Audiencia: ¿administrador o mercader?"
 POD_mummy_spell_of_life.11.desc: "$POD_debate_debate_strength_header$«Así que... tú eres el joven cachorro que busca aprender el Hechizo de la Vida. Tus servicios te han valido una audiencia, pero nada más.\n«Recuerda: no soy un mero mercader. No puedo ser comprado. No voy a #italic simplemente #! vender el Hechizo de la Vida. Soy un administrador de un saber poderoso. Entregarte el Hechizo de la Vida sería como poner una corona en manos de un gobernante sin probar. Algunos necios podrían incluso usarlo para intentar igualarse a Osiris o a los Jueces de Ma'at. Tantos necios buscan la divinidad, un poder que los engrandezca. En verdad, el Hechizo te ata a consecuencias de las que no puedes escapar, vigilado por poderes a los que no puedes eludir y juzgado por cada aliento que restaures.\n\n«¿Qué respuesta ofreces?»"
 POD_mummy_spell_of_life.11.a: "La herramienta de un administrador actúa conforme a la ley. Hazme una herramienta así."
 POD_mummy_spell_of_life.11.b: "Si lo niegas todo, solo los indignos lo tendrán."
 POD_mummy_spell_of_life.11.c: "El Hechizo es el precio; ninguno puede ser más pesado."

 POD_mummy_spell_of_life.12.t: "Audiencia: ¿y la cobardía?"
 POD_mummy_spell_of_life.12.desc: "$POD_debate_debate_strength_header$«Durante muchos milenios he librado una sola guerra, una guerra contra el caos y los traidores. Quienes reciben el renacimiento eterno mediante el Hechizo de la Vida de mi madre son llamados a ayudar en esa guerra. Y, sin embargo, ha habido traidores y cobardes que abandonaron nuestra causa. Sus siglos de renacimiento los han dejado apáticos y cobardes. Algunos se mataron, abandonándonos. Otros solo se preocuparon de su propia existencia y placer inmediatos y se marcharon a vagar por el desierto.\n«¿Cuánta más responsabilidad recae sobre quien posee el propio Hechizo? ¿Qué clase de criatura serás dentro de un siglo, de cinco, de cien? ¿Seguirás siendo fiel? ¿Buscarás el alivio de la verdadera muerte? ¿Huirás aterrado al ver por primera vez a un Hijo de Set, ya sea el devorador de sangre o el imperecedero?»"
 POD_mummy_spell_of_life.12.a: "Combatí a los setitas para reclamar el Alto Egipto. No les temo."
 POD_mummy_spell_of_life.12.b: "No soy un neonato. Sé lo que hace la edad."

 POD_mummy_spell_of_life.13.t: "Audiencia: ¿y la traición?"
 POD_mummy_spell_of_life.13.desc: "$POD_debate_debate_strength_header$«Quizá me traiciones de forma más directa, ¿mm? Kemintiri sirvió en su día entre los seguidores de mi madre, pero era una espía de Set. ¿Eres tú una espía? Cuando me reveló sus verdaderas impresiones, la perdoné. Sin embargo, Set la capturó y la torturó durante muchas, muchas lunas. Aunque debe sufrir por sus muchos otros crímenes, admitiré que no le entregó el Hechizo. ¿Puedes decir tú lo mismo? ¿Y el espía macedonio que se infiltró entre los sacerdotes de mi madre en mi ausencia? Estuvo a punto de lograr robar el Hechizo de la Vida, y solo se lo impidió su propia arrogancia. Eso creó las abominaciones que otros llaman Momias Bane.\n\n«¿Caerás en una treta así? ¿Se infiltrará entre tus seguidores quien permita que se robe el Hechizo de la Vida? ¿Y si Set te ofrece un millón de monedas de oro o todos los placeres que este mundo tiene que ofrecer? No carece de poder. ¿Te tentará una oferta así? ¿Le darás el Hechizo de la Vida?»"
 POD_mummy_spell_of_life.13.a: "Puedo resistirlo todo, tortura o placer."
 POD_mummy_spell_of_life.13.b: "Soy cauteloso y sé guardar un secreto."
 POD_mummy_spell_of_life.13.c: "Toma mi nombre verdadero para asegurar mi fidelidad."  # mimic Astrokhen
 POD_mummy_spell_of_life.13.c.prohibited_from_teaching: "Horus te prohíbe enseñar el Hechizo de la Vida a otros"

 POD_mummy_spell_of_life.14.t: "Audiencia: ¿la perspectiva de la edad?"
 POD_mummy_spell_of_life.14.desc: "$POD_debate_debate_strength_header$«En mi ausencia, los sacerdotes de mi madre ofrecieron el renacimiento eterno a muchos indignos. En lugar de preservar a los mejores y más brillantes, dejaron que la política y el dinero guiaran sus decisiones. Incluso cuando eligieron a quienes lo merecían en el momento, ignoraron la sostenibilidad a largo plazo de los elegidos. Las mentes y la valentía de muchos de esos elegidos se han erosionado con los milenios.\n\n«¿Mostrarás ese grado de #italic sabiduría #!? Por tu juventud, ¿podría faltarte perspectiva? ¿Permitirás que los sentimientos y las emociones personales te influyan? ¿Ignorarás la idoneidad para conservar vínculos y seres queridos?»"
 POD_mummy_spell_of_life.14.a: "¡Jamás!"
 POD_mummy_spell_of_life.14.b: "Los Jueces atraparían a los indignos."
 POD_mummy_spell_of_life.14.c: "Tú me guiarías."

 POD_mummy_spell_of_life.15.t: "Audiencia: ¿mantener la Ma'at?"
 POD_mummy_spell_of_life.15.desc: "$POD_debate_debate_strength_header$«El Hechizo de la Vida es mucho más que un simple hechizo. Las momias existen fuera del orden natural de las cosas. No es propio volver una y otra vez al mismo cuerpo. Causamos menos daño que los muertos que subsisten con sangre o vida. Somos los campeones de la Ma'at, el equilibrio, en una [Glossary('guerra eterna','podgloss.warofbalance')]. Cazamos y matamos a quienes buscan romperlo y traer el caos. Y, sin embargo, por el mero hecho de existir, somos obstáculos para su restauración. En pequeño número, el daño es insignificante y queda muy compensado por nuestra guerra. Disponemos de mecanismos para controlar el daño y liberar con cuidado el veneno. Sin embargo, llegará un momento en que la Ma'at exija que nos matemos y pongamos fin a nuestros ciclos de renacimiento. Con cada nueva momia, anudamos y retorcemos el ciclo de la muerte y proyectamos la paradoja de nuestra existencia sobre el Inframundo. Cada nueva momia perturba más el equilibrio y desgasta el velo que separa el Inframundo de las tierras de los vivos. Cada nueva momia acerca el día de nuestro fin, el punto en que el daño que causamos sea demasiado grande, demasiado irreversible.\n\n«Al darte el Hechizo de la Vida, garantizo que se crearán nuevas momias, pues no hay otra razón para buscarlo. ¿Por qué debería correr ese riesgo y ayudarte? ¿Compensarás el daño que causes?»"
 POD_mummy_spell_of_life.15.a: "Enseñar el Hechizo reduce su número frente al redescubrimiento independiente."
 POD_mummy_spell_of_life.15.b: "Si me enseñas, controlas lo que venga después."
 POD_mummy_spell_of_life.15.c: "Rechazar a nuevos campeones daña más a la Ma'at."

 POD_mummy_spell_of_life.16.t: "Audiencia: éxito"
 POD_mummy_spell_of_life.16.desc: "«Muy bien... tus argumentos son convincentes. Si te pruebas a ti mismo y demuestras tu compromiso con la guerra, te ayudaré en tu búsqueda del Hechizo de la Vida. No te daré el Hechizo. Solo adquiriéndolo tú mismo lo apreciarás y comprenderás de verdad. Sin embargo, te daré algo de orientación para ayudarte a recomponer los fragmentos de saber que se han esparcido a los cuatro vientos.»"
 POD_mummy_spell_of_life.16.a: "Agradezco tu tutela."

 POD_mummy_spell_of_life.17.t: "Audiencia: fracaso"
 POD_mummy_spell_of_life.17.desc: "«¡Necio! ¡He custodiado la Ma'at durante más de seis milenios! ¿Crees que unas palabras tan bonitas bastarán para persuadirme? ¿Me tomas por un político que seguirá los vientos del cambio? ¿Me ves como un mercader que cambiará de opinión según el oro?\n\n«Quizá dentro de unos años o décadas muestres mayor sabiduría. ¡Regresa entonces!»"
 POD_mummy_spell_of_life.17.a: "Muy bien, volveré más tarde."

 

 POD_mummy_spell_of_life.20.t: "Consejo: ¿a quién convocar?"
 POD_mummy_spell_of_life.20.desc: "Buscar el Hechizo de la Vida no es una empresa menor y exigirá gran parte de nuestra atención. Si lograras organizar el apoyo de nuestros semejantes, tendrías más tiempo y más recursos que dedicar a tus esfuerzos. Incluso una promesa de no interferencia bastaría.\n\nLa cuestión es a quién convocar. Solo puedes invitar a los más poderosos, así que no podrías elegir a quién concretamente invitar. En su lugar, debes considerar quiénes serían más propensos a aceptar tu propuesta. ¿Quiénes te prestarían la mayor ayuda?"
 POD_mummy_spell_of_life.20.a: "Convocar a nuestra Familia."  # same dynasty
 POD_mummy_spell_of_life.20.c: "Convocar a quienes siguen nuestro camino."  # same faith
 POD_mummy_spell_of_life.20.d: "Pensándolo mejor..."

 POD_mummy_spell_of_life.21.t: "Consejo: hora de empezar"
 POD_mummy_spell_of_life.21.desc: "$POD_debate_debate_strength_header$Ha llevado algún tiempo. Sin embargo, por fin has reunido un consejo de 5 representantes. Proseguir tu investigación exigirá mucho tiempo y muchos recursos. Debes convencerlos de que se sumen a tus esfuerzos y dediquen sus recursos a tu causa. Una promesa así aceleraría tus esfuerzos y te ayudaría a protegerte de fuerzas externas. Incluso una promesa de no interferencia reduciría el riesgo. Al fin y al cabo, no quieres lidiar con algún pariente idiota que intente robarte la investigación.$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.21.a: "Que todos tomen asiento. Hay mucho que hacer."
 POD_mummy_spell_of_life.21.b: "Pensándolo mejor..."

 POD_mummy_spell_of_life.22.t: "Consejo: donde otros fracasaron"
 POD_mummy_spell_of_life.22.desc: "$POD_debate_debate_strength_header$«El Hechizo de la Vida es una pérdida de tiempo, una búsqueda aún más necia que la del Grial. Muy, muy pocos han poseído el Hechizo de la Vida, y todos lo recibieron de otro. Isis, una de las mayores magas de la historia, lo recibió como regalo de un ser al que llamó Thoth. Horus, uno de los dos únicos que lo conocen en la era actual, lo aprendió de su madre. Cabirus, el otro de los dos, practicaba una versión incompleta y defectuosa, modificada a partir de una copia que le regaló un ismaelita desconocido. Los pocos otros poseedores confirmados procedían del Culto de Isis y fueron instruidos igualmente por otros. Todo lo demás son meros rumores.\nMuchísimos han intentado adquirirlo por otros medios. Set pasó incontables siglos persiguiendo el Hechizo. Ya fuera infiltrándose en el Culto de Isis, torturando a un poseedor del Hechizo de la Vida o realizando experimentos de escala increíble, él, un [Glossary('antediluviano','game_concept_antediluvian_desc')] [Glossary('Cainita','game_concept_cainite_desc')], fracasó siempre. Lo máximo que logró fueron las muy defectuosas Momias Bane. Las propias Momias Bane pasaron siglos en la misma búsqueda infructuosa. Varios ismaelitas lo han intentado también. Lo más cerca que estuvieron fue un hechizo que creó vampiros.\n\n«¿De veras crees que puedes crear el Hechizo de la Vida sin que te lo regalen? ¿Te consideras tan especial, tan distinto, que triunfarás donde tantos mejores fracasaron?»"
 POD_mummy_spell_of_life.22.a: "Las herramientas, el saber y la magia han evolucionado desde entonces."
 POD_mummy_spell_of_life.22.b: "Es un hechizo con muchas capas y variantes."
 POD_mummy_spell_of_life.22.c: "Ellos trabajaron por separado. De ahí que vosotros..."

 POD_mummy_spell_of_life.23.t: "Consejo: ¿cuál es el coste?"
 POD_mummy_spell_of_life.23.desc: "$POD_debate_debate_strength_header$«¿Quieres oro? ¿Recursos? ¿Mano de obra? ¿Acceso a nuestras bibliotecas? ¿Lo más precioso de todo, incluso para nosotros: el tiempo? Quizá no te hayas dado cuenta, pero los nuestros están en guerra constante, por dentro y por fuera. Los cazadores son cada vez más decididos, persistentes y numerosos. Algunos de los más antiguos entre nosotros han desaparecido, se han quitado la vida o han sido cazados. Nuestros rivales lanzan maquinaciones políticas cada vez más complejas. Nuestras propias conjuras e investigaciones exigen cada vez más gasto. No puedes esperar en serio que arriesguemos lo poco que podemos permitirnos por una búsqueda esotérica que quizá no rinda más que fracaso. Aun aceptando que el Hechizo de la Vida sea teóricamente posible, el coste de oportunidad es inaceptable.»"
 POD_mummy_spell_of_life.23.a: "Es una solución para la supervivencia, no una distracción de ella."
 POD_mummy_spell_of_life.23.b: "Ya aceptáis investigaciones arriesgadas, como corresponde a vuestras tradiciones."
 POD_mummy_spell_of_life.23.c: "Requiere menos de lo que creéis."

 POD_mummy_spell_of_life.24.t: "Consejo: ¿cuál es la recompensa?"
 POD_mummy_spell_of_life.24.desc: "$POD_debate_debate_strength_header$«Tenemos nuestros propios asuntos que gestionar, nuestras propias bases de poder, dominios, seguidores leales. Tendríamos que sacrificar parte de nuestros recursos para ayudarte, debilitándonos y creando una brecha. Si fracasas, habremos malgastado tiempo, dinero y esfuerzo valiosos en una empresa descabellada. Sin embargo, dejemos eso a un lado y digamos que aceptamos tus argumentos. Si lo logras... bueno, eso es otro problema en sí mismo. Nos habremos debilitado para fortalecerte a ti. Ahora eres un competidor o menos. Después, podrías ser un rival capaz de derrocarnos. En comparación, nosotros no recibiríamos nada. ¿Por qué no íbamos a exigir recursos? ¿Por qué no íbamos a robarte el Hechizo? En pocas palabras: ¿qué ganamos nosotros?»"
 POD_mummy_spell_of_life.24.a: "Tengo una gran cantidad de oro."
 POD_mummy_spell_of_life.24.b: "Os deberé favores."
 POD_mummy_spell_of_life.24.c: "Os prestaré mis fuerzas."

 POD_mummy_spell_of_life.25.t: "Consejo: ¿invitar a la catástrofe?"
 POD_mummy_spell_of_life.25.desc: "$POD_debate_debate_strength_header$«Muchos otros han buscado el Hechizo de la Vida, muchísimos otros. Tales seres tienen vidas largas, poderes potentes y no abandonarían una búsqueda así. Si logras lo que ellos no lograron, podrías atraer la atención de grandes poderes. Su atención no trae menos que la catástrofe, para ti... y para nosotros si te ayudamos. ¿Crees que podría resistirse a tales poderes? ¿Que podrías resistirlos tú? ¿Quizá piensas que les darás demasiado miedo para interferir?»"
 POD_mummy_spell_of_life.25.a: "Hace mucho que se han ido. No hay motivo para temerlos."  # extremely hard learning check
 POD_mummy_spell_of_life.25.b: "Mis caballeros y yo nos mantendremos firmes."  # extremely hard prowess check
 POD_mummy_spell_of_life.25.c: "Todos juntos los resistiremos."  # extremely hard stewardship check

 POD_mummy_spell_of_life.26.t: "Consejo: éxito"
 POD_mummy_spell_of_life.26.desc: "«Muy bien... tus argumentos son convincentes. Te prestaremos algunos recursos para llevar adelante tus experimentos, aunque no nos comprometeremos del todo con una empresa casi condenada al fracaso. No los malgastes.»"
 POD_mummy_spell_of_life.26.a: "Agradezco vuestra ayuda."

 POD_mummy_spell_of_life.27.t: "Consejo: fracaso"
 POD_mummy_spell_of_life.27.desc: "«¡Necio! Pides demasiado a cambio de demasiado poco. No apoyaremos tu insensatez.\n\n«Quizá dentro de unos años o décadas demuestres ser capaz de presentar un caso convincente. ¡Entonces, convócanos de nuevo!»"
 POD_mummy_spell_of_life.27.a: "Muy bien, hablaremos más tarde."



 POD_mummy_spell_of_life.30.t: "El asalto de Horus"
 POD_mummy_spell_of_life.30.desc: "Horus ha sido siempre el guardián del Hechizo de la Vida, el único vivo en la actualidad que conoce el Hechizo completo. Vive según su código, el Wat Hor, y lo hace cumplir en el mundo. El Precepto 6 prohíbe la creación de momias y restringe así, por naturaleza, el acceso al Hechizo de la Vida. Da caza a los Escritos Secretos de Cabirus, que solo filtran detalles incompletos del Hechizo de la Vida. Te has acercado muchísimo a construir el Hechizo de la Vida completo y has atraído sobre ti la furia de Horus en una medida muy superior a la que jamás se ganaron los escritos de Cabirus.\n\nAhora, Horus y sus seguidores momias han llegado ante tu refugio y planean atacar de día, cuando son más fuertes bajo la luz dorada de Ra. Forman filas y se preparan para arrollar tus defensas. Sus espadas relucen bajo el sol de mediodía, ansiosas de derramar tu sangre. Su magia se concentra a su alrededor y distorsiona la zona como la calima sobre una antorcha o un tejado de mampostería en verano. A una señal inaudible, cargan. No te queda más remedio que resistir su asalto."
 POD_mummy_spell_of_life.30.a: "¡Aguanta! ¡Aguanta! ¡AGUANTA!"
 POD_mummy_spell_of_life.30.b: "¡Por favor! ¡Dejadme vivir! ¡Os lo ruego!"
 POD_mummy_spell_of_life.30.stage3.success: "De algún modo, pese a todo, te mantienes triunfante"
 POD_mummy_spell_of_life.30.stage3.successful_groveling: "Horus acepta tus lastimeras súplicas"
 POD_mummy_spell_of_life.30.stage3.failure: "Caes como el trigo ante la guadaña"
 POD_mummy_spell_of_life.30.stage3.successful_sale: "Les entregas tu investigación a cambio de que te dejen en paz"
 POD_mummy_spell_of_life.30.kemintiri_fight: "El apoyo de Kemintiri ha reducido las fuerzas desplegadas contra ti"
 POD_mummy_spell_of_life.30.kemintiri_begging: "El apoyo de Kemintiri habla bien de tu fiabilidad"
 POD_mummy_spell_of_life.30.stage3.successful_groveling.tt: "Tu progreso en la búsqueda del Hechizo de la Vida se reiniciará. Aunque conservarás el apoyo ganado antes, tendrás que elegir un nuevo camino de decisiones para volver a avanzar."
 POD_mummy_spell_of_life_total_prowess_check: "La [prowess|E] acumulada de tu [coterie|E] se comparará con la de tu enemigo, con una bonificación basada en la escala de su influencia, reflejada en la extensión de su [faith|E]"
 POD_mummy_spell_of_life_total_learning_check: "El [learning|E] acumulado de tu [coterie|E] se comparará con el de tu enemigo, con una bonificación basada en la escala de su influencia, reflejada en la extensión de su [faith|E]"
 POD_mummy_spell_of_life_total_intrigue_check: "La [intrigue|E] acumulada de tu [coterie|E] se comparará con la de tu enemigo, con una bonificación basada en la escala de su influencia, reflejada en la extensión de su [faith|E]"
 POD_mummy_spell_of_life_total_stewardship_check: "La [stewardship|E] acumulada de tu [coterie|E] se comparará con la de tu enemigo, con una bonificación basada en la escala de su influencia, reflejada en la extensión de su [faith|E]"

 POD_mummy_spell_of_life.31.t: "El asalto de los Shemsu-Heru"
 POD_mummy_spell_of_life.31.desc: "Horus ha sido siempre el guardián del Hechizo de la Vida, el único vivo en la actualidad que conoce el Hechizo completo. Vive según su código, el Wat Hor, y lo hace cumplir en el mundo. El Precepto 6 prohíbe la creación de momias y restringe así, por naturaleza, el acceso al Hechizo de la Vida. Da caza a los Escritos Secretos de Cabirus, que solo filtran detalles incompletos del Hechizo de la Vida. Aunque Horus esté ausente, te has acercado muchísimo a construir el Hechizo de la Vida completo, lo que ha atraído sobre ti la furia de los seguidores de Horus en una medida muy superior a la que jamás se ganaron los escritos de Cabirus.\n\nAhora, los Shemsu-Heru han llegado ante tu refugio y planean atacar de día, cuando son más fuertes bajo la luz dorada de Ra. Forman filas y se preparan para arrollar tus defensas. Sus espadas relucen bajo el sol de mediodía, ansiosas de derramar tu sangre. Su magia se concentra a su alrededor y distorsiona la zona como la calima sobre una antorcha o un tejado de mampostería en verano. A una señal inaudible, cargan. No te queda más remedio que resistir su asalto."
 POD_mummy_spell_of_life.31.a: "¡Aguanta! ¡Aguanta! ¡AGUANTA!"
 POD_mummy_spell_of_life.31.b: "¡Por favor! ¡Dejadme vivir! ¡Os lo ruego!"
 POD_mummy_spell_of_life.31.stage3.successful_groveling: "Tus lastimeras súplicas son aceptadas"

 POD_mummy_spell_of_life.300.t: "La carta de Horus"
 POD_mummy_spell_of_life.300.desc: "Recibes una carta de Horus. No es un hecho inusual ni sorprendente, pues así es como principalmente os habéis comunicado mientras te esforzabas por profundizar tu comprensión precisa del Hechizo de la Vida. Sin embargo, esta vez la carta no trae ninguna pista ni un documento confuso, pero a la postre revelador, anterior a la mayoría de las civilizaciones que conoces.\n\n«Tras seguir tu progreso, deberías estar acercándote al punto en que atas tu Hechizo a un señorío de sombras concreto. Aunque al principio dudé en tolerar o apoyar tu búsqueda, cuando llegue el momento te recomiendo que visites Amenti. Creo que te has ganado el derecho a exponer tu caso ante los Jueces de Ma'at.»"
 POD_mummy_spell_of_life.300.a: "Mm, una idea interesante..."

 POD_mummy_spell_of_life.32.t: "La oferta de Celestyn"
 POD_mummy_spell_of_life.32.desc: "Antaño conocidos como Casa Tremere entre los magos de la Orden de Hermes, buscaron diversos medios de inmortalidad. Su investigación inicial los condujo al vampirismo. Sin embargo, algunos de ellos nunca abandonaron su búsqueda. Celestyn, el maestro bibliotecario e investigador cómodo en el campo, desarrolló un interés particular por las momias. Incluso adquirió una de las últimas copias, si no la última, de los Escritos Secretos de Cabirus. Te has acercado muchísimo a construir el Hechizo de la Vida completo, y eso ha atraído toda su atención. Con la esperanza de alcanzar una inmortalidad sin las maldiciones del vampirismo, han llegado muchos «investigadores» de campo Tremere y sus siervos gárgola. Celestyn da un paso al frente:\n\n«Somos colegas académicos. Para haber llegado tan lejos y haber aprendido lo que sabes del Hechizo de la Vida, eres claramente alguien de gran inteligencia e intelecto. Sin duda ves que somos mucho más poderosos que tú, capaces de volar tu refugio con nuestras disciplinas. Sin embargo, ese derramamiento de sangre es innecesario. Entréganos tu investigación y te dejaremos en paz para que continúes con tus esfuerzos.»"
 POD_mummy_spell_of_life.32.a: "¿¡Pensáis robar mi obra!?"
 POD_mummy_spell_of_life.32.b: "¡Tomadla y dejadme en paz!"

 POD_mummy_spell_of_life.33.t: "La oferta del Clan Tremere"
 POD_mummy_spell_of_life.33.desc: "Antaño conocidos como Casa Tremere entre los magos de la Orden de Hermes, buscaron diversos medios de inmortalidad. Su investigación inicial los condujo al vampirismo. Sin embargo, algunos de ellos nunca abandonaron su búsqueda. El maestro bibliotecario de los Tremere desarrolló un interés particular por las momias e incluso adquirió una de las últimas copias, si no la última, de los Escritos Secretos de Cabirus. Aunque él esté ausente, te has acercado muchísimo a construir el Hechizo de la Vida completo, y eso ha atraído toda la atención del Clan. Con la esperanza de alcanzar una inmortalidad sin las maldiciones del vampirismo, han llegado muchos «investigadores» de campo Tremere y sus siervos gárgola. Uno de ellos da un paso al frente:\n\n«Somos colegas académicos. Para haber llegado tan lejos y haber aprendido lo que sabes del Hechizo de la Vida, eres claramente alguien de gran inteligencia e intelecto. Sin duda ves que somos mucho más poderosos que tú, capaces de volar tu refugio con nuestras disciplinas. Sin embargo, ese derramamiento de sangre es innecesario. Entréganos tu investigación y te dejaremos en paz para que continúes con tus esfuerzos.»"
 POD_mummy_spell_of_life.33.a: "¿¡Pensáis robar mi obra!?"
 POD_mummy_spell_of_life.33.b: "¡Tomadla y dejadme en paz!"

 POD_mummy_spell_of_life.320.t: "La ayuda de Cabirus"
 POD_mummy_spell_of_life.320.desc: "Durante milenios, Cabirus ha sufrido presiones por todos lados de quienes buscaban su saber o querían matarlo por poseerlo. Últimamente, ha sido el clan vampírico de los Tremere. Dada tu comprensión cada vez mejor del Hechizo de la Vida, probablemente habrían vuelto su atención hacia ti. Por suerte, quebraste su base de poder e impediste cualquier esfuerzo concentrado por adquirir el saber de Cabirus o tu investigación. Aunque Cabirus siempre se ha mostrado reacio a usar sus habilidades por temor a atraer la atención, debilitar a los Tremere le ha permitido actuar con más libertad. Alguien de su poder despacha con facilidad a las fuerzas dispersas. Además, Cabirus te ha ofrecido la oportunidad de atar tu Hechizo de la Vida a Hades y usarlo como tu señorío de sombras. Aunque necesitaría estabilización y expansión, tales esfuerzos serían más fáciles que labrar tu propio señorío."
 POD_mummy_spell_of_life.320.a: "Una propuesta interesante..."

 POD_mummy_spell_of_life.34.t: "El golpe de Kemintiri"
 POD_mummy_spell_of_life.34.desc: "Aunque carecen del abrumador fanatismo de Horus y los Shemsu-Heru, los Hijos de Osiris y el Culto de Isis están, no obstante, dedicados a proteger el secreto del Hechizo de la Vida. Aunque Set se ha infiltrado en ellos en muchas ocasiones y estuvieron a punto de perder el Hechizo de la Vida a manos de él, siguen leales a la misión de impedir su abuso. La propia Kemintiri sufrió lo indecible a manos de Set, y se negó a darle ninguna información al respecto.\n\nAhora han descubierto tu investigación y se mueven contra ti. Donde otros podrían asaltar tu refugio con un ejército, ellos han enviado asesinos y a la propia Kemintiri para poner fin a tu investigación. Por desgracia para ti, eso significa ponerte fin a ti también."
 POD_mummy_spell_of_life.34.a: "¡Encontradla! No dejéis piedra sin remover..."
 POD_mummy_spell_of_life.34.b: "¡Quemad la investigación, y rezad para que nos deje en paz!"
 POD_mummy_spell_of_life.34.stage3.successful_groveling: "Despiertas aún con vida, al parecer por clemencia"
 POD_mummy_spell_of_life.34.horus_fight: "El apoyo de Horus ha reducido el número de asesinos enviados contra ti"
 POD_mummy_spell_of_life.34.horus_begging: "El apoyo de Horus habla bien de tu fiabilidad"

 POD_mummy_spell_of_life.35.t: "El golpe de los Hijos de Osiris"
 POD_mummy_spell_of_life.35.desc: "Aunque carecen del abrumador fanatismo de Horus y los Shemsu-Heru, los Hijos de Osiris y el Culto de Isis están, no obstante, dedicados a proteger el secreto del Hechizo de la Vida. Aunque Set se ha infiltrado en ellos en muchas ocasiones y estuvieron a punto de perder el Hechizo de la Vida a manos de él, siguen leales a la misión de impedir su abuso.\n\nAhora han descubierto tu investigación y se mueven contra ti. Donde otros podrían asaltar tu refugio con un ejército, ellos han enviado asesinos para poner fin a tu investigación. Por desgracia para ti, eso significa ponerte fin a ti también."
 POD_mummy_spell_of_life.35.a: "¡Encontradlos! No dejéis piedra sin remover..."
 POD_mummy_spell_of_life.35.b: "¡Quemad la investigación, y rezad para que nos dejen en paz!"

 POD_mummy_spell_of_life.340.t: "El apoyo de Kemintiri"
 POD_mummy_spell_of_life.340.desc: "Al salir de tus salas del trono, un escalofrío te recorre de pronto la espalda mientras las sombras del pasillo empiezan a moverse. Fluyen hacia dentro, se apartan de los lados y cubren el suelo. Empiezan a fundirse en un charco antes de elevarse hasta adoptar una forma humanoide. Primero parece un maniquí de rasgos toscos, luego una estatua de cortes más precisos, hasta resolverse por fin en la carne de alguien a quien reconoces: Kemintiri.\n\n«Te agradezco que me ayudaras a recuperar la memoria. Para devolverte el favor, sabe que he hablado en tu nombre entre los seguidores de Osiris e Isis. No interferirán en tu búsqueda del Hechizo de la Vida. Además, tendrás la oportunidad de hablar con los Jueces de Ma'at y de hacer de Amenti tu hogar.»"
 POD_mummy_spell_of_life.340.a: "Gracias por tu apoyo"

 POD_mummy_spell_of_life.36.t: "El asedio de Qufur am-Heru"
 POD_mummy_spell_of_life.36.desc: "Set, un antiguo antediluviano, pasó muchos milenios persiguiendo el Hechizo de la Vida que fortaleció a su sobrino. Se infligieron horrores indescriptibles. Innumerables personas murieron en sus experimentos. Se urdieron incontables conjuras para robarlo. Lo más cerca que estuvo fue engañar a Niklos, un alto sacerdote del Culto de Isis, para que aceptara a uno de los siervos de Set como protegido. Y, sin embargo, ni siquiera eso proporcionó más que una versión parcial del Hechizo de la Vida, que condujo a las abominaciones conocidas como Momias Bane. Aunque Set se haya retirado, sus chiquillos no han abandonado su búsqueda. Ahora, Qufur am-Heru, Campeón de Set, se alza ante tu refugio con una gran hueste.\n\n«Entréganos el Hechizo de la Vida y quizá te permitamos continuar tu investigación. Resiste y extraeremos el saber que necesitamos de los fragmentos rotos de tu mente. Tendremos lo que queremos; lo único que cambia es cuánto tardemos.»\n\n#clickable La fuerza de tu [coterie|E] es [GetPlayer.MakeScope.GetVariable('total_character_coterie_stewardship').GetValue|V0].\nLa fuerza de la [coterie|E] de tu enemigo es [GetPlayer.MakeScope.GetVariable('total_opponent_coterie_stewardship').GetValue|V0].#!"
 POD_mummy_spell_of_life.36.a: "Preparad las defensas..."
 POD_mummy_spell_of_life.36.b: "Tomadlo sin más..."

 POD_mummy_spell_of_life.37.t: "El asedio de los setitas"
 POD_mummy_spell_of_life.37.desc: "Set, un antiguo antediluviano, pasó muchos milenios persiguiendo el Hechizo de la Vida que fortaleció a su sobrino. Se infligieron horrores indescriptibles. Innumerables personas murieron en sus experimentos. Se urdieron incontables conjuras para robarlo. Lo más cerca que estuvo fue engañar a Niklos, un alto sacerdote del Culto de Isis, para que aceptara a uno de los siervos de Set como protegido. Y, sin embargo, ni siquiera eso proporcionó más que una versión parcial del Hechizo de la Vida, que condujo a las abominaciones conocidas como Momias Bane. Aunque Set se haya retirado, sus chiquillos no han abandonado su búsqueda. Ahora, los setitas se alzan ante tu refugio, reunidos en una gran hueste.\n\n«Entréganos el Hechizo de la Vida y quizá te permitamos continuar tu investigación. Resiste y extraeremos el saber que necesitamos de los fragmentos rotos de tu mente. Tendremos lo que queremos; lo único que cambia es cuánto tardemos.»\n\n#clickable La fuerza de tu [coterie|E] es [GetPlayer.MakeScope.GetVariable('total_character_coterie_stewardship').GetValue|V0].\nLa fuerza de la [coterie|E] de tu enemigo es [GetPlayer.MakeScope.GetVariable('total_opponent_coterie_stewardship').GetValue|V0].#!"
 POD_mummy_spell_of_life.37.a: "Preparad las defensas..."
 POD_mummy_spell_of_life.37.b: "Tomadlo sin más..."

 POD_mummy_spell_of_life.360.t: "El respaldo de los aliados"
 POD_mummy_spell_of_life.360.desc: "Tu canciller y tu maestro de espías te traen informes inquietantes: los setitas y las Momias Bane se movilizan contra ti. Como eres quien más se ha acercado al Hechizo de la Vida desde el propio Set, ven la posibilidad de completar su búsqueda. Sin embargo, acudes a tus aliados y partidarios. Invocando tus acuerdos anteriores, logras ejercer, de forma directa e indirecta, presión diplomática y marcial sobre los setitas. Hasta los errantes que carecen de un territorio que proteger se ven sin ocasión de atacarte."
 POD_mummy_spell_of_life.360.a: "Bien. ¡Esos ladrones no se beneficiarán de mi obra!"



 POD_mummy_spell_of_life.40.t: "Una audiencia con los Jueces de Ma'at"
 POD_mummy_spell_of_life.40.desc: "$POD_debate_debate_strength_header$Con la ayuda de tus dos amigos wraith, has abierto una puerta a [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]. Por desgracia, un mar incomprensible y siempre cambiante de arena y agua te rodea por todas partes, y el agua parece intercambiarse con la arena cada vez que fijas en ella tu atención. Las sombras cubren de oscuridad buena parte de él y ocultan a tu vista riesgos y tesoros desconocidos. Algo que solo puedes percibir como un huracán de recuerdos y energía pura gira a tu alrededor y te zarandea. Plasma y materiales innombrables llueven sobre tu cabeza. Tus pasos no logran avance alguno, pues las dunas se mueven contigo, el océano retrocede y avanza, los vientos te combaten y extrañas bestias te asaltan. Solo un camino despejado se extiende ante ti, un río que crees que es el [UmbraGlossary('river_of_death')]. No puedes continuar sin la ayuda de Anubis. Hasta que llegue a investigar tu entrada poco convencional, debes repeler a los monstruos que puedan acechar entre los mares de arena.$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.40.a: "Aguardamos a Anubis."
 POD_mummy_spell_of_life.40.b: "Volvamos antes de que se cierre la puerta."
 POD_mummy_spell_of_life.40.effect.success.desc: "Resistes la línea hasta su llegada"
 POD_mummy_spell_of_life.40.critical.failure.effect.desc: "Los espectros te desbordan y te obligan a retirarte"

 POD_mummy_spell_of_life.41.t: "Audiencia: la llegada de Anubis"
 POD_mummy_spell_of_life.41.desc: "$POD_debate_debate_strength_header$Tras horas... ¿días?... aparece una gran puerta de piedra oscura y vítrea que salva el [UmbraGlossary('river_of_death')]. Cuando extiendes la mano para tocar el tirador, un ser extraño se alza de las arenas movedizas a tu izquierda. Más aún que la mayoría de los #TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] #L wraiths#!#!, su cuerpo parece a la vez líquido y sólido, fluye y, sin embargo, conserva una forma. Esa forma es la de un $POD_splat_garou$ parcialmente transformado, con cabeza de chacal. El color de su piel es el del alquitrán, oscuro como la muerte misma. Lleva una linterna brillante suspendida de una larga pértiga. Con una voz como un desprendimiento de rocas en un pozo hueco, habla:\n\n«¿Por qué no habría de ejecutarte de inmediato por osar traspasar los límites de [UmbraGlossary('neter_khertet')], donde ni siquiera los wraiths del [UmbraGlossary('dark_kingdom_of_iron')] se atreven a pisar? ¿Por qué iba siquiera a considerar la posibilidad de escoltarte ante los Jueces de Ma'at?»"  # description of Anubis inspired by Silent Striders tribebook
 POD_mummy_spell_of_life.41.a: "No me atan los tratados con Caronte."
 POD_mummy_spell_of_life.41.b: "Pesa mi corazón y toma tu decisión."
 POD_mummy_spell_of_life.41.c: "Deseo proteger Neter-Khertet. Que los Jueces me consideren indigno."

 POD_mummy_spell_of_life.42.t: "Audiencia: ¿te mantendrás fiel?"
 POD_mummy_spell_of_life.42.desc: "$POD_debate_debate_strength_header$Las puertas se abren y Anubis te guía a través de ellas. Mientras caminas por la tierra, miras a tu alrededor. [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] lleva los ecos de las tierras de los vivos, formados por las pasiones y los deseos depositados en las grandes ciudades, tumbas y templos del Reino. Sin embargo, es mucho más que meras ruinas o ecos. Sus moradores moldean con facilidad la sustancia del Reino. Sus milenios de tiempo han dado a los Jueces de Ma'at y a los Shemsu-Heru que han regresado tiempo más que suficiente para crear una asombrosa exhibición de grandeza. Increíbles picos de oro y de piedra caliza blanca se alzan a lo lejos y se extienden sobre las dunas que te rodean. Sin que nada cambie de forma perceptible, 42 personas se alzan ahora rodeándote a ti y a Anubis, ataviadas con suntuosos shendyt y empuñando cayados faraónicos. Hablan por turnos, y cada una pronuncia la frase siguiente.\n\n«El Hechizo de la Vida no se limita a resucitar. Ancla un alma a lo largo de ciclos innumerables. No fuiste forjado, adiestrado ni quebrado hasta ser un recipiente capaz de sostener esa arquitectura. Concederte el renacimiento invitaría a tu propia corrupción. Si no mañana, dentro de cien, mil, diez mil años. Aunque podríamos arrojarte a Amemait, ¿por qué correr tal riesgo? Podrías causar mucho daño antes de entonces. Peor aún, no buscas el renacimiento solo por el equilibrio, sino por la continuación del yo, de la voluntad, de la identidad. Los Amenti son instrumentos de la Ma'at, no supervivientes. Tu deseo de vivir te deja vulnerable a los susurros de nuestros enemigos. Una sola vida, aunque sea recta, no pesa más que la larga memoria de la balanza ni demuestra tu capacidad para mantenerte firme.»"
 POD_mummy_spell_of_life.42.a: "No soy un neonato. Puedo resistir la corrupción de la edad."
 POD_mummy_spell_of_life.42.b: "No podría resistirme a vuestro juicio."
 POD_mummy_spell_of_life_42_b_note: "Tu probabilidad de éxito aumenta si los Jueces son más fuertes que tú"
 POD_mummy_spell_of_life.42.c: "Me mantendría leal, como otros antes que yo."

 POD_mummy_spell_of_life.43.t: "Audiencia: ¿eres digno?"
 POD_mummy_spell_of_life.43.desc: "$POD_debate_debate_strength_header$«Cuando el proceso estaba debidamente gobernado y supervisado, los Shemsu-heru eran elegidos porque habían demostrado ser dignos. Sus habilidades merecían ser preservadas. Su servicio a la Ma'at era verdadero y abarcaría encarnaciones. Amen Khal, Hetch-Abehu y Neith eran soldados y tácticos hábiles que se probaron en el campo de batalla. Sahu-Ra era un escriba y artesano sin igual. Tjehenu demostró ser un mago de gran potencial. Merit-neferu era una mercader de notable habilidad y lealtad. Aunque era una reina de relevancia política, a Neferukhayt se la eligió por su erudición, su cultura y su sed de saber.\n\n¿Qué hay en ti que merezca ser preservado? ¿Qué has hecho para ganarte un lugar entre los Shemsu-heru?»"
 POD_mummy_spell_of_life.43.a: "Descubrí casi todo el Hechizo de la Vida."
 POD_mummy_spell_of_life.43.b: "Yo también soy un táctico de gran renombre."
 POD_mummy_spell_of_life.43.c: "Pocos artesanos pueden compararse con mi obra."

 POD_mummy_spell_of_life.44.t: "Audiencia: ¿distraerías?"
 POD_mummy_spell_of_life.44.desc: "$POD_debate_debate_strength_header$«Llevas creencias y recuerdos ajenos a la cruzada. Llevas lealtades más allá de los Imperecederos hacia fuerzas que desconocemos. Podrías tentarlos a tus intrigas. Podrías implicarnos en conflictos ajenos y distraernos de la cruzada decisiva contra la progenie de Set.\n\nIgual de preocupante es que el equilibrio entre los Amenti se mantiene con cuidado. Algunos, los llamados ismaelitas, se han apartado del camino debido. Sin embargo, aun así pasaron muchos siglos leales a la guerra antes de convertirse en traidores. Tu presencia en este lugar de recuperación quebraría nuestra cuidadosamente preservada unidad de propósito. Se resucitarían antiguas rivalidades y cismas entre los Imperecederos, agravados por tus lealtades externas. Volverían sus hojas de las gargantas de los setitas a las gargantas de los demás. Tal faccionalismo y tales distracciones serían un desastre.»"
 POD_mummy_spell_of_life.44.a: "Yo resuelvo conflictos, no los causo."
 POD_mummy_spell_of_life.44.b: "Mi lealtad estabilizaría aún más ese equilibrio."

 POD_mummy_spell_of_life.45.t: "Audiencia: suplicantes e intrigantes"
 POD_mummy_spell_of_life.45.desc: "$POD_debate_debate_strength_header$«Digamos que aceptamos tus argumentos y te permitimos usar este señorío. Entonces atarías tu Hechizo de la Vida a [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')]. Sin embargo, tal acto permitiría que cualquiera sobre quien lances tu Hechizo de la Vida entrara en nuestro señorío en números insostenibles, números que tensarían el equilibrio. ¿Elegirías siempre solo a los dignos para unirse a nuestras filas? Buscadores, suplicantes e intrigantes se acercarán a ti. Incontables ambiciosos te darán caza. ¿Les concederías todos sus deseos, ya sea la inmortalidad o el propio Hechizo? ¿Mostrarías el discernimiento adecuado al elegir a quienes recibirán el renacimiento eterno? ¿Seguirías siendo un protector firme del secreto del hechizo, o te lo robarían cuando confiaras en quien no lo merece? Cada nuevo Imperecedero perturba la Ma'at y debe trabajar para restaurarla. ¿Desbordarás la Ma'at ofreciendo el renacimiento eterno a demasiados?»"
 POD_mummy_spell_of_life.45.a: "Sé cómo identificar a los dignos."
 POD_mummy_spell_of_life.45.b: "Puedo proteger el Hechizo. ¿Qué más importa?"

 POD_mummy_spell_of_life.46.t: "Audiencia: éxito"
 POD_mummy_spell_of_life.46.desc: "Los Jueces se vuelven unos hacia otros y parecen debatir entre ellos. Aunque no se marchan y ves moverse sus labios, no puedes oírlos ni deducir lo que dicen por el movimiento de los labios. En un momento dado, Anubis se une a la conversación. El suelo parece casi retumbar, aunque sus palabras también quedan veladas. Por fin, se vuelven de nuevo hacia ti.\n\n«Muy bien. Te concederemos permiso para usar [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] a fin de regenerarte hasta que estés listo para habitar tu cuerpo de nuevo. Anubis te concederá las intuiciones necesarias para modificar tu Hechizo de la Vida según haga falta.»"
 POD_mummy_spell_of_life.46.a: "Gracias, lo usaré con sabiduría."

 POD_mummy_spell_of_life.47.t: "Audiencia: fracaso"
 POD_mummy_spell_of_life.47.desc: "Los Jueces se vuelven unos hacia otros y parecen debatir entre ellos. Aunque no se marchan y ves moverse sus labios, no puedes oírlos ni deducir lo que dicen por el movimiento de los labios. En un momento dado, Anubis se une a la conversación. El suelo parece casi retumbar, aunque sus palabras también quedan veladas. Por fin, se vuelven de nuevo hacia ti.\n\n«Hemos considerado tus palabras y las hemos hallado faltas de sabiduría. Permitirte recuperarte en [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] aseguraría nuestra perdición final y la de la propia Ma'at. Por bondad, te permitiremos marcharte en paz con Anubis como escolta. Sin embargo, si regresas, Anubis se encargará de que no vuelvas a interrumpirnos con tus palabras sin valor.»\nUna sonrisa depredadora se extiende por el hocico de chacal de Anubis y deja ver sus afilados dientes."
 POD_mummy_spell_of_life.47.a: "Muy bien, acepto vuestro juicio."
 POD_mummy_spell_of_life.47.b: "Decrépitos necios, recordaréis este día cuando derribe vuestros tronos."
 
 POD_mummy_spell_of_life_stage4_umbra_battles_strengths: "#clickable Tu Fuerza Militar actual es [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|V0]\nSe estima que la Fuerza Militar de la [umbra|E] y de los #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Espectros#!#! es [GetPlayer.MakeScope.GetVariable('spectre_shadow_realm_force').GetValue|V0]#!\n\n"
 POD_CHANGE_CHARACTER_SHADOW_REALM_FORCE_ADD: "#P Ganas#! $VALUE|0V$ de Fuerza Militar"
 POD_CHANGE_CHARACTER_SHADOW_REALM_FORCE_SUBTRACT: "#N Pierdes#! $VALUE|0V$ de Fuerza Militar"
 POD_CHANGE_SPECTRE_SHADOW_REALM_FORCE_ADD: "La [umbra|E] y los #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Espectros#!#! #N ganan#! $VALUE|0V$ de Fuerza Militar"
 POD_CHANGE_SPECTRE_SHADOW_REALM_FORCE_SUBTRACT: "La [umbra|E] y los #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Espectros#!#! #P pierden#! $VALUE|0V$ de Fuerza Militar"

 POD_mummy_spell_of_life.50.t: "Derrotar a los muertos"
 POD_mummy_spell_of_life.50.desc: "Cuando [GetScriptedCharacterByHistoryID('792600').GetFirstName] creó por primera vez su versión del Hechizo de la Vida, se enfrentó al problema de no poder entrar en [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], el reino de los muertos del Antiguo Egipto donde las Momias se toman el tiempo de recomponerse entre cada muerte. Por ello, aseguró una porción muy pequeña de las [UmbraGlossary('shadowlands')] a la que llamó «Hades» como su propio [UmbraGlossary('shadow_realm')] y de algún modo logró convencer a Caronte, el líder del [UmbraGlossaryLocalized('shadowlands','Inframundo')], de que aceptara este enclave. Algunas leyendas atribuyen el mérito a su herencia micénica común, y un texto dice que Cabirus tiene relación con los Barqueros, muchos de los cuales también son micénicos. Sea cual sea la verdad, [UmbraGlossary('hades')] sigue siendo una copia lastimosa de [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] y apenas puede ayudar a las Momias a lograr su verdadera inmortalidad.\n\nSi también vamos a usar [UmbraGlossary('hades')], tendremos que ampliar su territorio y estabilizarlo. Dada la dificultad que afrontó [GetScriptedCharacterByHistoryID('792600').GetFirstName], no será tarea fácil. Habrá que satisfacer a los gobernantes del [UmbraGlossaryLocalized('shadowlands','Inframundo')] para que no actúen contra nosotros. Habrá que hacer retroceder a los #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Espectros#!#!. El nuevo señorío necesitará defensores. Tanto por hacer...\n\n #R Esta batalla usa una puntuación llamada Fuerza Militar. Esta puntuación se inicia atendiendo a la destreza tuya, de tus campeones y de tu [coterie|E]. Aumentará o disminuirá durante el propio conflicto.\nTu Fuerza Militar inicial es [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!"
 POD_mummy_spell_of_life.50.a: "Es hora de empezar."
 POD_mummy_spell_of_life.50.b: "Esto es demasiado arriesgado."
 POD_mummy_spell_of_life_hades_start_battle_tt: "La Fuerza Militar de la [umbra|E] y de los #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Espectros#!#! se #italic estima #! en #V 1800#!"

 POD_mummy_spell_of_life.51.t: "Persuasión"
 POD_mummy_spell_of_life.51.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$De algún modo, Cabirus convenció a Caronte de que permitiera un enclave. Nadie sabe con certeza cómo lo logró. Por suerte, no necesitas convencerlo, pues ya se ha establecido un enclave. Debes hablar con un gobernante local para que permita la ampliación de [UmbraGlossary('hades')]. Los mariscales supervisan y coordinan las patrullas de una región, así que serán ellos quienes se topen con [UmbraGlossary('hades')]. Los Inspectores y los Ministros dirigen las partes administrativas de la burocracia local. Sin embargo, todos carecen de autoridad para autorizar la ampliación. Reunirte con el Consejo local de Anacreontes es tu mejor oportunidad de convencer a quienes tienen poder suficiente para garantizar el asunto.\n\nCon la ayuda de Cabirus y de tus wraiths aliados, logras llegar a la necrópolis más cercana y empiezas a rellenar los formularios para solicitar una audiencia. Los formularios y los trámites llevan días. Luego, el escribiente te entrega un número que se llamará cuando llegue el momento de tu audiencia. El número es 10.712.461.\n\nTras semanas de espera, te llevan ante el Consejo y empiezas a presentar tu caso."
 POD_mummy_spell_of_life.51.a: "Para empezar, explicaré por qué..."
 POD_mummy_spell_of_life.51.b: "Creo que podemos llegar a un acuerdo."
 POD_mummy_spell_of_life.51.effect.success.critical.desc: "¡Nos ayudarán!"
 POD_mummy_spell_of_life.51.effect.success.desc: "¡Convencido!"
 POD_mummy_spell_of_life.51.critical.failure.effect.desc: "Necios obstinados..."

 POD_mummy_spell_of_life.52.t: "Conseguir ayuda local"
 POD_mummy_spell_of_life.52.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Cuando muere un wraith, entra en el inframundo cubierto por un capullo plásmico llamado placenta. La placenta lo mantiene dócil hasta que se la quitan. Mientras la placenta está presente, permanece en un estado plácido, onírico, y por lo general ajeno a su entorno. Durante ese período es extremadamente vulnerable a ataques, modificaciones, esclavización, moliación o forja de almas. Solo otro wraith puede retirar la placenta, pero carecemos de segadores de Estigia o de la ayuda de Anubis. Cabirus sí encontró a un wraith dispuesto que se ha encargado de retirar placentas desde entonces. Sin embargo, es insuficiente para manejar la afluencia de momias que puedas introducir. Esto exige un gran grupo de residentes permanentes en [UmbraGlossary('hades')] que retiren placentas.\n\nPor desgracia, los wraiths tienen una economía extraña. Comercian con bienes forjados de almas, cristales de fuego de alma, pathos líquido, angustia en polvo, reliquias, papel estigio, plasma del [UmbraGlossary('sunless_sea')], mena de muerte y objetos similares. Ninguno de esos objetos podría obtenerse de forma eficiente y constante para pagar a ningún wraith. Tendremos que hallar la manera de conseguir y conservar sus servicios."
 POD_mummy_spell_of_life.52.a: "Mis wraiths vinculados bastarán."
 POD_mummy_spell_of_life.52.b: "Mi investigación hallará la solución."
 POD_mummy_spell_of_life.52.c: "Llegaremos a un acuerdo."
 POD_mummy_spell_of_life.52.effect.success.desc: "¡Convencido!"
 POD_mummy_spell_of_life.52.critical.failure.effect.desc: "Apenas basta, pero servirá..."

 POD_mummy_spell_of_life.53.t: "Aislarse"
 POD_mummy_spell_of_life.53.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Los registros antiguos indican que [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] y el [UmbraGlossaryLocalized('shadowlands','Inframundo')] estuvieron atrapados en una guerra durante incontables décadas o siglos, y esta solo terminó cuando Anubis negoció un tratado. Antes de ese tratado, mientras que [UmbraGlossary('neter_khertet')] cayó con rapidez, los moradores más pequeños y menos numerosos de [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] lograron aun así mantener su terreno. Si replicas algunas de sus defensas, deberías poder resistir cualquier asalto de los espectros. Aunque los Anacreontes revoquen su decisión, podrías sobrevivir hasta resolver el problema.\n\nUna de sus mayores hazañas fue aislar [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] del resto del [UmbraGlossaryLocalized('shadowlands','Inframundo')]. Dejó de ser un simple lugar dentro de un señorío mayor. Pasó a ser un señorío aparte, solo accesible por caminos cuidadosamente mantenidos y controlados. Imitar un sistema así te permitiría restringir el acceso a [UmbraGlossary('hades')] y limitar la amenaza de las fuerzas externas. Sin embargo, no sería fácil, ni barato, ni siquiera posible. Al fin y al cabo, solo lo lograron antes Osiris, un vampiro de inmenso poder que de algún modo ascendió más allá de su naturaleza vampírica, y Anubis, un wraith que demostró una comprensión de la naturaleza de la [umbra|E] mayor que la de los Barqueros."
 POD_mummy_spell_of_life.53.a: "Lo haré yo mismo."
 POD_mummy_spell_of_life.53.b: "Seguro que hay una opción asequible."
 POD_mummy_spell_of_life.53.c: "El coste no es un problema."
 POD_mummy_spell_of_life.53.d: "Esto es una empresa de necios."
 POD_mummy_spell_of_life.53.effect.success.desc: "¡Funcionó!"
 POD_mummy_spell_of_life.53.critical.failure.effect.desc: "Estamos a salvo, pero no aislados..."

 POD_mummy_spell_of_life.54.t: "Una horda incansable"
 POD_mummy_spell_of_life.54.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Los registros antiguos indican que [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] y el [UmbraGlossaryLocalized('shadowlands','Inframundo')] estuvieron atrapados en una guerra durante incontables décadas o siglos, y esta solo terminó cuando Anubis negoció un tratado. Antes de ese tratado, mientras que [UmbraGlossary('neter_khertet')] cayó con rapidez, los moradores más pequeños y menos numerosos de [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] lograron aun así mantener su terreno. Si replicas algunas de sus defensas, deberías poder resistir cualquier asalto de los espectros. Aunque los Anacreontes revoquen su decisión, podrías sobrevivir hasta resolver el problema.\n\nEl ejército de [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] consistía en vastas legiones de Ushabti. Estas estatuas animadas servían como mano de obra infatigable en tiempos de paz y como fuerza implacable en la guerra. Palabras de poder cuidadosamente elegidas, inscritas en sus cuerpos, daban fuerza a estos constructos de madera, metal y piedra por lo demás corrientes. Podríamos construir constructos propios o vincular wraiths para establecer una fuerza defensiva similar. Con algo de suerte, reunirás lo bastante para que sirvan de algo más que simples guardianes."
 POD_mummy_spell_of_life.54.a: "Llamar a los artesanos."
 POD_mummy_spell_of_life.54.b: "Adquirir materiales de fabricación superiores."
 POD_mummy_spell_of_life.54.c: "Preparar a los psíquicos."
 POD_mummy_spell_of_life.54.effect.success.desc: "¡Contemplad mi ejército!"
 POD_mummy_spell_of_life.54.critical.failure.effect.desc: "Apenas basta..."
 POD_mummy_spell_of_life_bound_wraith_strength_bonus: "Gana fuerza por cada wraith vinculado"

 POD_mummy_spell_of_life.55.t: "Mantener los recuerdos"
 POD_mummy_spell_of_life.55.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$El [UmbraGlossaryLocalized('shadowlands','Inframundo')] es un señorío de recuerdos. Las reliquias y los lugares se desvanecen a medida que se olvidan. Como el más allá y el inframundo griegos, [UmbraGlossary('hades')] está indisolublemente ligado a la religión griega. Con el auge del cristianismo y el declive de la cultura helenística, [UmbraGlossary('hades')] ha declinado con ellos. Esto ha contribuido en gran medida al declive y la inestabilidad generales del [UmbraGlossary('shadow_realm')].\n\nPara nuestra fortuna, el cristianismo usa la palabra griega «Hades» para referirse a una zona de retención temporal de las almas, buenas y malas, a la espera del juicio. De las 3 partes del Hades cristiano, un recoveco recibe a veces el nombre de Tártaro. Si pudieras reforzar esa conexión, podrías asentar [UmbraGlossary('hades')] en la mente de los mortales y estabilizarlo así mientras el cristianismo siga en la conciencia popular. Por desgracia, tal acción debilitaría nuestros lazos con nuestra herencia griega."
 POD_mummy_spell_of_life.55.a: "Hablar con los sacerdotes."
 POD_mummy_spell_of_life.55.b: "Reviviremos la cultura helenística."

 POD_mummy_spell_of_life.56.t: "Partidas de incursión"
 POD_mummy_spell_of_life.56.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Ha llegado la hora. Las fronteras actuales de [UmbraGlossary('hades')] se han asegurado y estabilizado lo mejor que hemos podido. Tus fuerzas están listas para marchar y hacer retroceder a las hordas de espectros. Tus wraiths están preparados para reclamar el territorio y recuperar nuestras almas cuando llegue el momento. Tus soldados están reunidos para mantener el territorio una vez capturado.\n\n[UmbraGlossary('hades')] siempre ha existido en una zona aislada del [UmbraGlossaryLocalized('shadowlands','Inframundo')], lo que permite que los espectros campen a sus anchas más allá de sus fronteras. Antes de que comience el asalto, existe la opción de enviar partidas de incursión para hostigarlos. Si funcionara, las incursiones mermarían su número y facilitarían el conflicto que se avecina. Sin embargo, esas incursiones entrañarían grandes riesgos."
 POD_mummy_spell_of_life.56.a: "Acercarnos a ellos por la izquierda para..."
 POD_mummy_spell_of_life.56.b: "Algunos de vosotros podéis morir..."
 POD_mummy_spell_of_life.56.c: "No merece el riesgo."
 POD_mummy_spell_of_life.56.effect.success.desc: "Su número ha disminuido, mi señor"
 POD_mummy_spell_of_life.56.critical.failure.effect.desc: "Se perdió la compañía entera, mi señor"

 POD_mummy_spell_of_life.57.t: "Se entabla la batalla"
 POD_mummy_spell_of_life.57.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Esta es la última batalla. Si al final tu Fuerza Militar es inferior a la de las fuerzas que se te oponen, tu camino terminará aquí.#!\n\nSacas a tus fuerzas del enclave protegido de [UmbraGlossary('hades')]. Una horda interminable de espectros te aguarda, y parece empujar sin cesar contra las defensas que levantaste. Sus formas pálidas y alargadas detectan de inmediato tu salida y empiezan a abalanzarse hacia tu ejército. La presencia concentrada de la mácula del Olvido es un hedor tangible que contamina el aire. La inmensa mayoría son figuras esqueléticas con garras para desgarrar la carne o gélidos fuegos negros ardiendo en los ojos. Unas pocas bestias de tamaño infantil corren entre las piernas, cacareando como locas. Monstruos salvajes y bestiales, con varias hileras de dientes de tiburón y masas de tejido desgarrado colgando de esqueletos deformes, marchan entre las primeras filas. Su lujuria, su odio y su pasión son bien visibles y casi parecen emanar de sus corpulentas formas. Todos ansían probar la sangre de los vivos, robar algún jirón de esa vitalidad y causar dolor y destrucción. A pesar de esa sed, actúan de concierto, como una sola masa, en lugar de lanzarse hacia delante. Unos pocos seres con lesiones y tumores irregulares y supurantes los empujan hacia delante en formaciones organizadas, según algún plan oculto.\n\nAunque se los dirige y se los enfoca, estos espectros corrientes no tienen inteligencia independiente ni capacidad de respuesta estratégica ante una acción rápida. Si logras tiempo y espacio para maniobrar, un empujón bien cronometrado podría desorganizar la horda y permitir que tus fuerzas arrollen a una parte de ellos. Como alternativa, podrías recurrir a tus reservas, que hasta ahora permanecieron sobre todo en el mundo mortal. Aunque servirían de poco más que de carne de cañón, aun así podrían marcar la diferencia."
 POD_mummy_spell_of_life.57.a: "¡No podemos detenernos ahora! ¡ADELANTE!"
 POD_mummy_spell_of_life.57.b: "¡Convocad a nuestras reservas! ¡Hasta el último de ellos!"
 
 POD_mummy_spell_of_life.58.t: "Santo de los devorados por la sombra"
 POD_mummy_spell_of_life.58.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$La horda empieza a debilitarse. Se abren huecos en sus líneas que te permiten adentrarte cada vez más en sus formaciones. Solo un obstáculo se interpone en la ampliación de [UmbraGlossary('hades')]: el líder de los espectros.\n\nTras abrirte paso entre incontables espectros, ves a un humano con una máscara que imita la máscara griega de la tragedia. Viste raídas túnicas negras moteadas de manchas blancas leprosas y sostiene una guadaña hecha añicos. Por la túnica asoman púas deslucidas y espinosas de las que gotea despacio un líquido negro y viscoso que, al caer al suelo, parece chisporrotear. Lo protegen múltiples fauces abiertas y garras perversas unidas por una maraña de tendones y piel tensa. De algunas de sus masas de carne tumorosa brotan tentáculos translúcidos que restallan y matan a cualquier espectro que se acerque demasiado, reflejo de su violencia apenas contenida. Tú y tus aliados os acercáis para lo que será un gran enfrentamiento.\n\nCada golpe del portador de la guadaña es preciso, y sus mandobles caen sobre tus fuerzas tan inevitables como la entropía. Cada soldado alcanzado parece desmontarse en una mancha homogénea de carbono, algunos metales y una nube de gases en lenta expansión, aunque incluso estos se descomponen enseguida en sus componentes invisibles antes de ser aniquilados por completo. Esto contrasta con las monstruosidades cuyos puñetazos, que resquebrajan el suelo, llueven a tu alrededor. Cada golpe cubre el reposicionamiento de su amo y permite estrategias más complejas. Aunque las bestias exhiben muchas emociones, ninguna te da indicios que leer ni debilidades que explotar. Logras arrancarle la máscara, pero eso poco ayuda. El rostro ennegrecido, sin ojos ni boca, de esta sombra viviente revela poco, más allá del abrazo inevitable de todas las cosas en los brazos del Vacío.\n\nMientras tus fuerzas barren a tu alrededor y empiezan a rebasar a la horda de espectros, hay pocas dudas de que esta será una lucha por tu existencia, una que te llevará al límite. Si ganara, la batalla se volverá contra tu ejército y habrá pocas esperanzas de éxito."
 POD_mummy_spell_of_life.58.a: "No hay vuelta atrás..."  # straight check
 POD_mummy_spell_of_life.58.b: "¡Cargad!"  # all MaA destroyed
 POD_mummy_spell_of_life.58.c: "¡Aunque me cueste la mente!"  # all MaA destroyed, lifestyle XP penalty
 POD_mummy_spell_of_life.58.d: "¡Cueste lo que cueste!"  # all MaA destroyed, lifestyle XP penalty, in debt
 POD_mummy_spell_of_life.58.effect.success.desc: "Todos caen..."
 POD_mummy_spell_of_life.58.effect.failure.desc: "La dulce nada del Vacío..."
 POD_mummy_spell_of_life.58.final_check: "Se comparará tu Fuerza Militar con la de los espectros para determinar el resultado final"
 POD_mummy_spell_of_life.58.critical.failure.effect.desc: "Las arenas solitarias y llanas se extienden a lo lejos..."  # reference to Ozymandius

 POD_mummy_spell_of_life.59.t: "Victoria, por fin"
 POD_mummy_spell_of_life.59.desc: "Tras horas (¿?) de lucha, acabas por fin con la última de las bestias y obligas al portador de la guadaña a retroceder. Entonces, en el espacio de apenas un parpadeo, su cuerpo empieza a desplazarse, a desdibujarse, a distorsionarse, a fruncirse y a plegarse hasta que sencillamente... desaparece. Mientras recuperas el aliento, un gesto calmante cuando menos, te tomas un momento para mirar a tu alrededor. Ves cómo abaten a los últimos espectros. Tus soldados ya empiezan a levantar defensas y fortificaciones para mantener el territorio hasta que los tuyos puedan asegurarlo como es debido.\n\nUnos días después, ves cómo las nuevas fronteras de [UmbraGlossary('hades')] se estabilizan ante ti. Sus límites cobran nitidez, hacen retroceder las siempre presentes tormentas de almas y reclaman la tierra por completo. Los wraiths aguardan listos para recoger y ayudar a las momias que puedan viajar hasta aquí. Con esto completado, es hora de volver a casa y terminar la última parte del Hechizo de la Vida."
 POD_mummy_spell_of_life.59.a: "Esa runa encaja ahí, ahora solo me falta..."




 POD_mummy_spell_of_life.60.t: "Derrotar a los muertos"
 POD_mummy_spell_of_life.60.desc: "Cuando [GetScriptedCharacterByHistoryID('792600').GetFirstName] creó por primera vez su versión del Hechizo de la Vida, se enfrentó al problema de no poder entrar en [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], el reino de los muertos del Antiguo Egipto donde las Momias se toman el tiempo de recomponerse entre cada muerte. Por ello, aseguró una porción muy pequeña de las [UmbraGlossary('shadowlands')] a la que llamó «Hades» como su propio [UmbraGlossary('shadow_realm')] y de algún modo logró convencer a Caronte, el líder del [UmbraGlossaryLocalized('shadowlands','Inframundo')], de que aceptara este enclave. Aun así, [UmbraGlossary('hades')] sigue siendo una copia lastimosa de [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')].\n\nPese a sus defectos, tendrás que repetir la hazaña de Cabirus de crear un nuevo [UmbraGlossary('shadow_realm')]. Dada la dificultad que afrontó Cabirus, no será tarea fácil. No tienes con Caronte una conexión que te permita recibir autorización, así que habrá que sortear o aplacar al gobierno de Estigia para que no actúe contra nosotros. Habrá que hacer retroceder a los #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Espectros#!#!. Hay que preparar Hechizos para reclamar y mantener el territorio. El nuevo señorío necesitará defensores. Para mayor molestia, debes asentarte antes de que la burocracia estigia descubra tu presencia y se recupere lo bastante para atacar. Además, tu mera presencia atraerá hordas cada vez mayores de espectros hasta que se complete el trabajo, así que cualquier retraso dificultará la batalla final. Tanto por hacer, tan poco tiempo...\n\n #R Esta batalla usa una puntuación llamada Fuerza Militar. Esta puntuación se inicia atendiendo a la destreza tuya, de tus campeones y de tu [coterie|E]. Aumentará o disminuirá durante el propio conflicto.\nTu Fuerza Militar inicial es [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!"
 # Triggers if recent Great Maelstrom
 POD_mummy_spell_of_life.60.desc.b: "Cuando [GetScriptedCharacterByHistoryID('792600').GetFirstName] creó por primera vez su versión del Hechizo de la Vida, se enfrentó al problema de no poder entrar en [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], el reino de los muertos del Antiguo Egipto donde las Momias se toman el tiempo de recomponerse entre cada muerte. Por ello, aseguró una porción muy pequeña de las [UmbraGlossary('shadowlands')] a la que llamó «Hades» como su propio [UmbraGlossary('shadow_realm')] y de algún modo logró convencer a Caronte, el líder del [UmbraGlossaryLocalized('shadowlands','Inframundo')], de que aceptara este enclave. Aun así, [UmbraGlossary('hades')] sigue siendo una copia lastimosa de [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')].\n\nPese a sus defectos, tendrás que repetir la hazaña de Cabirus de crear un nuevo [UmbraGlossary('shadow_realm')]. Dada la dificultad que afrontó Cabirus, no será tarea fácil. No tienes con Caronte una conexión que te permita recibir autorización, así que habrá que sortear o aplacar al gobierno de Estigia para que no actúe contra nosotros. Habrá que hacer retroceder a los #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Espectros#!#!. Por el reciente Gran Maelstrom, abundan especialmente, aunque la distracción de Estigia puede ayudarnos. Hay que preparar Hechizos para reclamar y mantener el territorio. El nuevo señorío necesitará defensores. Para mayor molestia, debes asentarte antes de que la burocracia estigia descubra tu presencia y se recupere lo bastante para atacar. Además, tu mera presencia atraerá hordas cada vez mayores de espectros hasta que se complete el trabajo, así que cualquier retraso dificultará la batalla final. Tanto por hacer, tan poco tiempo...\n\n #R Esta batalla usa una puntuación llamada Fuerza Militar. Esta puntuación se inicia atendiendo a la destreza tuya, de tus campeones y de tu [coterie|E]. Aumentará o disminuirá durante el propio conflicto.\nTu Fuerza Militar inicial es [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!"
 POD_mummy_spell_of_life.60.a: "Es hora de empezar."
 POD_mummy_spell_of_life.60.b: "Esto es demasiado arriesgado."
 POD_mummy_spell_of_life_independent_start_battle_tt: "La Fuerza Militar de la [umbra|E] y de los #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Espectros#!#! se #italic estima #! en #V 2300#!"

 POD_mummy_spell_of_life.61.t: "Guardia Nocturna"
 POD_mummy_spell_of_life.61.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Te preparas para partir hacia la [umbra|E]. Sin embargo, serías necio si creyeras que tus esfuerzos, aun si tienen éxito, serán rápidos, y no podrás regresar ni siquiera brevemente, pues tales proyectos no pueden detenerse hasta completarse. Los wraiths que se opongan a tu plan pueden entrar en las [Glossary('Tierras de Piel','game_concept_skinlands_desc')] para amenazar tu señorío. Mucho más problemático es que tus rivales, enemigos y vasallos desleales caerán sin duda sobre tus fuerzas. Unos buscarán tu investigación sobre el Hechizo de la Vida y otros simplemente querrán usurparte en tu ausencia. Tales ataques cortarían las comunicaciones y las líneas de suministro, te atraparían en el [UmbraGlossaryLocalized('shadowlands','Inframundo')] y te impedirían obtener ayuda.\n\nEso te deja dos opciones. Puedes marcharte y esperar que tu señorío resista sin tu supervisión directa. O bien puedes dejar aquí a una parte de tus fuerzas para guardar el frente interno, sabiendo perfectamente que se las echará en falta al otro lado."
 POD_mummy_spell_of_life.61.a: "Mi reino es fuerte."
 POD_mummy_spell_of_life.61.b: "Nuestra retaguardia debe estar segura."
 POD_mummy_spell_of_life.61.effect.success.desc: "¡Permanecemos unidos!"
 POD_mummy_spell_of_life.61.critical.failure.effect.desc: "¿Permanecemos unidos?"

 POD_mummy_spell_of_life.62.t: "Inframundos regionales"
 POD_mummy_spell_of_life.62.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Tu extensa investigación ha revelado una oportunidad interesante. [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] se construyó dentro de [UmbraGlossary('neter_khertet')], el antiguo Inframundo egipcio. [Glossary('Kakuri','podgloss.kakuri')] fue el Inframundo ainu antes de que [Glossary('Emma-O','podgloss.emmao')], antaño guardián de los muertos ainu, lo transformara en un [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')] digno de un [Glossary('Rey Yama','podgloss.yamaking')]. Estos precedentes indican que los inframundos regionales tienen gran potencial como puntos de apoyo para empresas mayores. Están comparativamente libres de espectros y pueden recurrir a la creencia local para ofrecer cierta estabilidad. Además, sus cuidadores, custodios y guardianes complementarían nuestros propios esfuerzos.\n\nAunque el predominio del cristianismo ha eliminado la mayoría de esos señoríos, algunos aún quedan. Estigia puede reclamar todos los inframundos occidentales, pero [UmbraGlossary('umi')] reclama de igual modo todo el Pacífico y nunca ha logrado aplastar a todos los señoríos espirituales independientes. Tu loca búsqueda de formar un [UmbraGlossary('shadow_realm')] independiente fracasará si no localizas un inframundo regional y lo aseguras como es debido. Por tanto, la única cuestión es cuánto tardarás."
 POD_mummy_spell_of_life.62.a: "¡Buscad en nuestros registros!"
 POD_mummy_spell_of_life.62.b: "Reclutar más bibliotecarios que me ayuden."
 POD_mummy_spell_of_life.62.effect.success.desc: "¡Encontrado!"
 POD_mummy_spell_of_life.62.critical.failure.effect.desc: "Cuántos retrasos..."

 POD_mummy_spell_of_life.620.t: "Dioses de la muerte"
 POD_mummy_spell_of_life.620.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Cuando muere un wraith, entra en el inframundo cubierto por un capullo plásmico llamado placenta. La placenta lo mantiene dócil hasta que se la quitan. Mientras la placenta está presente, permanece en un estado plácido, onírico, y por lo general ajeno a su entorno. Durante ese período es extremadamente vulnerable a ataques, modificaciones, esclavización, moliación o forja de almas. Solo otro wraith puede retirar la placenta, pero carecemos de segadores de Estigia o de la ayuda de Anubis.\n\nEl inframundo regional que usarás presenta una oportunidad interesante: nuestro propio Anubis. Un señorío así ya contendría muchos residentes permanentes y tendría un dios de la muerte que lo gestionara y custodiara. Podrían recoger a las momias que acaban de viajar hasta aquí y complementar tus esfuerzos defensivos. Sin embargo, su lealtad es para su propia gente, así que tendrás que ganártelos para tu causa. No será fácil, pues podrían verte como una fuerza invasora, poco mejor que la burocracia avasalladora de Estigia. Una cosa que puede ayudar a tu causa es que no necesitas todo su señorío, al menos al principio."
 # Triggers if recent Great Maelstrom
 POD_mummy_spell_of_life.620.desc.b: "$POD_mummy_spell_of_life.620.desc$ Otra ayuda es el caos provocado por un reciente Gran Maelstrom. La afluencia de espectros los hará más desesperados por contar con tu apoyo."
 POD_mummy_spell_of_life.620.a: "Ofrecemos protección para una pequeña región."
 POD_mummy_spell_of_life.620.effect.success.desc: "Aceptan"
 POD_mummy_spell_of_life.620.critical.failure.effect.desc: "Cuántos retrasos..."

 POD_mummy_spell_of_life.63.t: "Pescar el caos"
 POD_mummy_spell_of_life.63.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Los registros antiguos indican que [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] y Estigia estuvieron atrapadas en una guerra durante incontables décadas o siglos. [UmbraGlossary('neter_khertet')] cayó con rapidez, y la guerra solo terminó cuando Anubis hizo un regalo increíble a los Barqueros.\n\nEso fue hace mucho, y Estigia no ha hecho sino calcificarse más. Sin sombra de duda, Estigia no permitirá la creación de un nuevo [UmbraGlossary('shadow_realm')] ni la independencia de un inframundo subordinado. Puede enviar sus propias fuerzas contra ti o provocar aún más a los espectros contra ti. En cualquier caso, su interferencia complicará mucho las cosas. Sin embargo, para que Estigia actúe contra ti, tendría que detectar tus acciones a tiempo para interferir y contar con las fuerzas necesarias.\n\nEs una oportunidad interesante para debilitar a ambos posibles enemigos. Si encuentras un «cebo» para los espectros, podrías disponer que asalten las Necropolis cercanas. Sin embargo, si capturan a tu agente, podría delatarte y volverse contra ti."
 POD_mummy_spell_of_life.63.a: "Preparar el señuelo y buscarme un wraith que lo lance."
 POD_mummy_spell_of_life.63.b: "Agravaremos el caos del Gran Maelstrom."
 POD_mummy_spell_of_life.63.effect.success.desc: "Tu agente escapa sin ser sospechado"
 POD_mummy_spell_of_life.63.critical.failure.effect.desc: "Tu agente es capturado"

 POD_mummy_spell_of_life.630.t: "Untar palmas"
 POD_mummy_spell_of_life.630.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Aunque las Necropolis cercanas y los burócratas estigios puedan estar distraídos, siguen suponiendo una amenaza. Tus acciones son ilegales y nunca se permitirán públicamente. Sin embargo, su muerte no ha vuelto incorruptibles a estos wraiths. Los mariscales supervisan y coordinan las patrullas de una región, así que serán ellos quienes se topen contigo. Los Inspectores y los Ministros dirigen las partes administrativas de la burocracia local y gestionan las redes de inteligencia. Un soborno bien colocado garantizará que las patrullas se desvíen alrededor de tu territorio para retrasar su descubrimiento oficial. Más sobornos asegurarán que los primeros ataques contra nosotros sean esfuerzos simbólicos.\n\nAhora bien, el coste de tal servicio será alto. Los wraiths tienen una economía extraña. Comercian con bienes forjados de almas, cristales de fuego de alma, pathos líquido, angustia en polvo, papel estigio, plasma del [UmbraGlossary('sunless_sea')], mena de muerte y objetos similares, pero esos objetos son inalcanzables o no valen lo bastante. Las reliquias, recuerdos a los que se da forma al cruzar el Manto, son la opción perfecta. No se rompen, sustituyen rasgos prescindibles, no pueden rastrearse hasta nosotros y pueden trocarse con facilidad por otros objetos deseados.\n\nSi tienes capacidad, quizá puedas fabricar algunas. El Diezmo de los Muertos deja claro que a veces pueden crearse reliquias a partir de objetos colocados sobre los ojos de los muertos, aunque no fueran griegos ni practicaran la religión griega. Cierta magia puede eliminar la incertidumbre de ese proceso o incluso la necesidad de sacrificios."
 POD_mummy_spell_of_life.630.a: "Las efigies pueden atravesar el Manto."
 POD_mummy_spell_of_life.630.b: "Dádselo a los prisioneros... y luego, ejecutadlos."
 POD_mummy_spell_of_life.630.c: "Traed a los prisioneros y preparad el ritual."
 POD_mummy_spell_of_life.630.d: "¿Dónde está ese psíquico mío?"
 POD_mummy_spell_of_life.630.e: "Convocar a un psíquico a mi corte."

 POD_mummy_spell_of_life.64.t: "Aislarse"
 POD_mummy_spell_of_life.64.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Los registros antiguos indican que [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] y Estigia estuvieron atrapadas en una guerra durante incontables décadas o siglos. [UmbraGlossary('neter_khertet')] cayó con rapidez, y la guerra solo terminó cuando Anubis hizo un regalo increíble a los Barqueros. Si replicas algunas de las defensas de [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], deberías poder resistir cualquier asalto de los espectros. Incluso cuando Estigia repare inevitablemente en ti, podrías sobrevivir hasta que el problema se resolviera.\n\nUna de sus mayores hazañas fue aislar [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] del resto del [UmbraGlossaryLocalized('shadowlands','Inframundo')]. Dejó de ser un simple lugar dentro de un señorío mayor. Pasó a ser un señorío aparte, solo accesible por caminos cuidadosamente mantenidos y controlados. Imitar un sistema así te permitiría restringir el acceso a tu nuevo [UmbraGlossary('shadow_realm')] y limitar la amenaza de las fuerzas externas. Sin embargo, no sería fácil, ni barato, ni siquiera posible. Al fin y al cabo, solo lo lograron antes Osiris, un vampiro de inmenso poder que de algún modo ascendió más allá de su naturaleza vampírica, y Anubis, un wraith que demostró una comprensión de la naturaleza de la [umbra|E] mayor que la de los Barqueros."
 # Triggers if recent Great Maelstrom
 POD_mummy_spell_of_life.64.desc.b: "$POD_mummy_spell_of_life.64.desc$Por suerte, el reciente Gran Maelstrom ha debilitado ligeramente la [umbra|E] y ha hecho que manipularla sea más fácil de lo normal."
 POD_mummy_spell_of_life.64.a: "Lo haré yo mismo."
 POD_mummy_spell_of_life.64.b: "Seguro que hay una opción asequible."
 POD_mummy_spell_of_life.64.c: "El coste no es un problema."
 POD_mummy_spell_of_life.64.d: "Esto es una empresa de necios."
 POD_mummy_spell_of_life.64.effect.success.desc: "Flotas libre en un mar sin sol..."
 POD_mummy_spell_of_life.64.critical.failure.effect.desc: "Atado a la realidad..."

 POD_mummy_spell_of_life.640.t: "Una horda incansable"
 POD_mummy_spell_of_life.640.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Los registros antiguos indican que [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] y Estigia estuvieron atrapadas en una guerra durante incontables décadas o siglos. [UmbraGlossary('neter_khertet')] cayó con rapidez, y la guerra solo terminó cuando Anubis hizo un regalo increíble a los Barqueros. Si replicas algunas de las defensas de [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')], deberías poder resistir cualquier asalto de los espectros. Incluso cuando Estigia repare inevitablemente en ti, podrías sobrevivir hasta que el problema se resolviera.\n\nEl ejército de [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] consistía en vastas legiones de Ushabti. Estas estatuas animadas servían como mano de obra infatigable en tiempos de paz y como fuerza implacable en la guerra. Palabras de poder cuidadosamente elegidas, inscritas en sus cuerpos, daban fuerza a estos constructos de madera, metal y piedra por lo demás corrientes. Podríamos construir constructos propios o vincular wraiths para establecer una fuerza defensiva similar. Con algo de suerte, reunirás lo bastante para que sirvan de algo más que simples guardianes."
 POD_mummy_spell_of_life.640.a: "Llamar a los artesanos."
 POD_mummy_spell_of_life.640.b: "Adquirir materiales de fabricación superiores."
 POD_mummy_spell_of_life.640.c: "Preparar a los psíquicos."
 POD_mummy_spell_of_life.640.effect.success.desc: "¡Contemplad mi ejército!"
 POD_mummy_spell_of_life.640.critical.failure.effect.desc: "Apenas basta..."

 POD_mummy_spell_of_life.65.t: "Ido pero no olvidado"
 POD_mummy_spell_of_life.65.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$El [UmbraGlossaryLocalized('shadowlands','Inframundo')] recoge almas a lo largo de siglos y milenios. En particular, quienes tienen asuntos pendientes o finales violentos tienden a convertirse en wraiths. Es una apuesta segura que algunos de tus antiguos campeones y aliados figuran entre ellos. Si se los recluta, serían ayudantes leales y poderosos. Su ayuda sería inestimable para complementar tus fuerzas en la batalla que se avecina y para cuidar de tu [UmbraGlossary('shadow_realm')] en el futuro. Sin embargo, no cabe duda de que sus mentes y sus corpus estarían muy debilitados. Llevaría un tiempo valioso localizarlos y restaurarlos."
 POD_mummy_spell_of_life.65.a: "Recuerda quién eras..."
 POD_mummy_spell_of_life.65.b: "No merece el tiempo."
 POD_mummy_spell_of_life.65.effect.success.desc: "Bienvenido de nuevo"
 POD_mummy_spell_of_life.65.critical.failure.effect.desc: "Una pérdida de tiempo..."

 POD_mummy_spell_of_life.66.t: "Partidas de incursión"
 POD_mummy_spell_of_life.66.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Ha llegado la hora. Tus fuerzas están listas para marchar y hacer retroceder a las hordas de espectros. Tus wraiths están preparados para reclamar el territorio y recuperar nuestras almas cuando llegue el momento. El dios de la muerte nativo ha sumado su fuerza a tu propia magia. Tus soldados están reunidos para mantener el territorio una vez capturado.\n\nElegido por su distancia de cualquier centro de poder estigio, el inframundo que has escogido siempre ha existido en una zona aislada, lo que permite que los espectros campen a sus anchas más allá de sus fronteras. Antes de que comience el asalto, existe la opción de enviar partidas de incursión para hostigarlos. Si funcionara, las incursiones mermarían su número y facilitarían el conflicto que se avecina. Sin embargo, esas incursiones entrañarían grandes riesgos."
 POD_mummy_spell_of_life.66.a: "Primero, tendrás que..."
 POD_mummy_spell_of_life.66.b: "Algunos de vosotros podéis morir..."
 POD_mummy_spell_of_life.66.c: "No merece el riesgo."
 POD_mummy_spell_of_life.66.effect.success.desc: "Su número ha disminuido, mi señor"
 POD_mummy_spell_of_life.66.critical.failure.effect.desc: "Se perdió la compañía entera, mi señor"

 POD_mummy_spell_of_life.67.t: "Se entabla la batalla"
 POD_mummy_spell_of_life.67.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Esta es la última batalla. Si al final tu Fuerza Militar es inferior a la de las fuerzas que se te oponen, tu camino terminará aquí.#!\n\nSacas a tus fuerzas del enclave protegido del inframundo que has elegido. Una horda interminable de espectros te aguarda, y parece empujar sin cesar contra las defensas que levantaste. Sus formas pálidas y alargadas detectan de inmediato tu salida y empiezan a abalanzarse hacia tu ejército. La presencia concentrada de la mácula del Olvido es un hedor tangible que contamina el aire. La inmensa mayoría son figuras esqueléticas con garras para desgarrar la carne o gélidos fuegos negros ardiendo en los ojos. Unas pocas bestias de tamaño infantil corren entre las piernas, cacareando como locas. Monstruos salvajes y bestiales, con varias hileras de dientes de tiburón y masas de tejido desgarrado colgando de esqueletos deformes, marchan entre las primeras filas. Su lujuria, su odio y su pasión son bien visibles y casi parecen emanar de sus corpulentas formas. Todos ansían probar la sangre de los vivos, robar algún jirón de esa vitalidad y causar dolor y destrucción. A pesar de esa sed, actúan de concierto, como una sola masa, en lugar de lanzarse hacia delante. Unos pocos seres con lesiones y tumores irregulares y supurantes los empujan hacia delante en formaciones organizadas, según algún plan oculto.\n\nAunque se los dirige y se los enfoca, estos espectros corrientes no tienen inteligencia independiente ni capacidad de respuesta estratégica ante una acción rápida. Si logras tiempo y espacio para maniobrar, un empujón bien cronometrado podría desorganizar la horda y permitir que tus fuerzas arrollen a una parte de ellos. Como alternativa, podrías recurrir a tus reservas, que hasta ahora permanecieron sobre todo en el mundo mortal. Aunque servirían de poco más que de carne de cañón, aun así podrían marcar la diferencia."
 POD_mummy_spell_of_life.67.a: "¡No podemos detenernos ahora! ¡ADELANTE!"
 POD_mummy_spell_of_life.67.b: "¡Convocad a nuestras reservas! ¡Hasta el último de ellos!"
 POD_mummy_spell_of_life.67.critical.failure.effect.desc: "Las arenas solitarias y llanas se extienden a lo lejos..."
 
 POD_mummy_spell_of_life.670.t: "Santo de los devorados por la sombra"
 POD_mummy_spell_of_life.670.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$La horda empieza a debilitarse. Se abren huecos en sus líneas que te permiten adentrarte cada vez más en sus formaciones. Solo un obstáculo se interpone en la creación de un [UmbraGlossary('shadow_realm')]: el líder de los espectros.\n\nTras abrirte paso entre incontables espectros, ves a un humano con una máscara que imita la máscara griega de la tragedia. Viste raídas túnicas negras moteadas de manchas blancas leprosas y sostiene una guadaña hecha añicos. Por la túnica asoman púas deslucidas y espinosas de las que gotea despacio un líquido negro y viscoso que, al caer al suelo, parece chisporrotear. Lo protegen múltiples fauces abiertas y garras perversas unidas por una maraña de tendones y piel tensa. De algunas de sus masas de carne tumorosa brotan tentáculos translúcidos que restallan y matan a cualquier espectro que se acerque demasiado, reflejo de su violencia apenas contenida. Tú y tus aliados os acercáis para lo que será un gran enfrentamiento.\n\nCada golpe del portador de la guadaña es preciso, y sus mandobles caen sobre tus fuerzas tan inevitables como la entropía. Cada soldado alcanzado parece desmontarse en una mancha homogénea de carbono, algunos metales y una nube de gases en lenta expansión, aunque incluso estos se descomponen enseguida en sus componentes invisibles antes de ser aniquilados por completo. Esto contrasta con las monstruosidades cuyos puñetazos, que resquebrajan el suelo, llueven a tu alrededor. Cada golpe cubre el reposicionamiento de su amo y permite estrategias más complejas. Aunque las bestias exhiben muchas emociones, ninguna te da indicios que leer ni debilidades que explotar. Logras arrancarle la máscara, pero eso poco ayuda. El rostro ennegrecido, sin ojos ni boca, de esta sombra viviente revela poco, más allá del abrazo inevitable de todas las cosas en los brazos del Vacío.\n\nMientras tus fuerzas barren a tu alrededor y empiezan a rebasar a la horda de espectros, hay pocas dudas de que esta será una lucha por tu existencia, una que te llevará al límite."
 POD_mummy_spell_of_life.670.a: "No hay vuelta atrás..."  # straight check
 POD_mummy_spell_of_life.670.b: "¡Cargad!"  # all MaA destroyed
 POD_mummy_spell_of_life.670.c: "¡Aunque me cueste la mente!"  # all MaA destroyed, lifestyle XP penalty
 POD_mummy_spell_of_life.670.d: "¡Cueste lo que cueste!"  # all MaA destroyed, lifestyle XP penalty, in debt
 POD_mummy_spell_of_life.670.effect.success.desc: "Todos caen..."
 POD_mummy_spell_of_life.670.effect.failure.desc: "La dulce nada del Vacío..."
 POD_mummy_spell_of_life.670.final_check: "Se comparará tu Fuerza Militar con la de los espectros para determinar el resultado final"
 POD_mummy_spell_of_life.670.critical.failure.effect.desc: "Las arenas solitarias y llanas se extienden a lo lejos..."  # reference to Ozymandius

 POD_mummy_spell_of_life.68.t: "Victoria, por fin"
 POD_mummy_spell_of_life.68.desc: "Tras horas (¿?) de lucha, acabas por fin con la última de las bestias y obligas al portador de la guadaña a retroceder. Entonces, en el espacio de apenas un parpadeo, su cuerpo empieza a desplazarse, a desdibujarse, a distorsionarse, a fruncirse y a plegarse hasta que sencillamente... desaparece. Mientras recuperas el aliento, un gesto calmante cuando menos, te tomas un momento para mirar a tu alrededor. Ves cómo abaten a los últimos espectros. Tus soldados ya empiezan a levantar defensas y fortificaciones para mantener el territorio hasta que los tuyos puedan asegurarlo como es debido.\n\nUnos días después, ves cómo las nuevas fronteras de tu [UmbraGlossary('shadow_realm')] personal se estabilizan ante ti. Sus límites cobran nitidez, hacen retroceder las siempre presentes tormentas de almas y reclaman la tierra por completo. Los wraiths aguardan listos para recoger y ayudar a las momias que puedan viajar hasta aquí. Con esto completado, es hora de volver a casa y terminar la última parte del Hechizo de la Vida."
 POD_mummy_spell_of_life.68.a: "Esa runa encaja ahí, ahora solo me falta..."

 POD_mummy_spell_of_life.610.t: "Una pesadilla viviente"
 POD_mummy_spell_of_life.610.desc: "Tras horas (¿?) de lucha, acabas por fin con la última de las bestias y obligas al portador de la guadaña a retroceder. Entonces, en el espacio de apenas un parpadeo, su cuerpo empieza a desplazarse, a desdibujarse, a distorsionarse, a fruncirse y a plegarse hasta que sencillamente... desaparece. Mientras recuperas el aliento, un gesto calmante cuando menos, te tomas un momento para mirar a tu alrededor. Ves cómo abaten a los últimos espectros. Tus soldados ya empiezan a levantar defensas y fortificaciones para mantener el territorio hasta que los tuyos puedan asegurarlo como es debido.\n\nUnos días después, sientes cómo tu nuevo [UmbraGlossary('shadow_realm')] se estabiliza a tu alrededor. Sus límites cobran nitidez y hacen retroceder las siempre presentes tormentas de almas. Con esto completado, es hora de volver a casa.\n\nPor desgracia, tu prolongada ausencia y tu presunta muerte o debilitamiento han desatado a las facciones de tu propia corte, mientras tus rivales maniobran por tu territorio. Todo el señorío es un caos mientras las distintas fuerzas intentan imponerse. Peor aún, todas tienen la misma idea: eliminarte ahora, mientras sigues debilitado, les daría la mejor pretensión sobre lo que quede cuando este torbellino de violencia por fin cese. En un último conflicto, tu maltrecho ejército debe hallar la fuerza o el carisma para reunir los restos leales que pueda haber y recordar a estos necios por qué ese trono era tuyo desde el principio. Solo entonces tendrás tiempo de terminar el Hechizo de la Vida."
 POD_mummy_spell_of_life.610.a: "Mi gente sigue firme y leal."
 POD_mummy_spell_of_life.610.b: "Mis agentes conocen a los leales y pueden matar al resto."
 POD_mummy_spell_of_life.610.c: "Mi genio táctico asegura la victoria en la batalla."
 POD_mummy_spell_of_life.610.d: "El combate singular demostrará quién es el legítimo aspirante."
 POD_mummy_spell_of_life.610.e: "El pueblo es mío. Nadie puede resistir la marea común."
 POD_mummy_spell_of_life.610.f: "No eres el primero de la historia en intentarlo, así que me preparé."
 POD_mummy_spell_of_life.610.effect.success.desc: "Restableces cierta apariencia de orden"
 POD_mummy_spell_of_life.610.critical.failure.effect.desc: "¡Vuelve aquí con eso! ¡NO! ¡No hagas eso!"

 POD_mummy_spell_of_life.70.t: "La gracia de Horus"
 # not horus phase 3
 POD_mummy_spell_of_life.70.desc: "Llegas a tu audiencia con Horus. «Saludos, mi señor. Sé que has cuestionado mis acciones y mis motivos. Crees que he violado el Precepto 6 de tu código. Durante mucho tiempo he perseguido todas las pistas relacionadas con el Hechizo de la Vida que se usó una vez para crearnos, los Shemsu-heru. Reuní diversos registros históricos y mágicos que conservaban algunos detalles del Hechizo. Pasé tiempo en la [umbra|E] para determinar el vínculo adecuado entre un [UmbraGlossary('shadow_realm')] y el Hechizo de la Vida. Con mi investigación completa, he obtenido la mayoría de los registros que sobreviven. Busqué a propósito fuentes alternativas ajenas a ti para asegurarme de reunir una colección lo más amplia posible. Ahora te lo entrego todo para que lo destruyas y te pido que borres el Hechizo de la Vida de mi memoria.»\n\nDurante un momento, Horus permanece sentado, considerándote en silencio. «Tras el ataque inicial contra tu tumba, consideré una oleada interminable de asaltos hasta que cayeras ante tus hermanos más leales y se quemara tu investigación. Me alegro de haber descartado ese camino, pues hoy te has redimido. Te agradezco tu servicio y destruiré gustoso estos registros. Sin embargo, tus acciones muestran una gran sabiduría. Donde tantos otros han fracasado, has demostrado que puedes usar el Hechizo de la Vida con responsabilidad. Aunque te prohíbo enseñar el Hechizo a otros, te permitiré conservar tus recuerdos de él y usarlo como mejor te parezca. Te has demostrado digno de tal consideración. Incluso te ayudaré a perfeccionar tu Hechizo de la Vida. Además, emitiré un edicto entre los Shemsu-heru para protegerte, salvaguardando a un ayudante tan leal en la guerra contra Set e impidiendo que se robe tu saber. Bien hecho, mi bueno y fiel siervo.»"
 # horus phase 3 done
 POD_mummy_spell_of_life.70.desc.b: "Llegas a tu audiencia con Horus. «Saludos, mi señor. Como sabes, he pasado mucho tiempo persiguiendo todas las pistas relacionadas con el Hechizo de la Vida que se usó una vez para crear a los Shemsu-heru. Con tu ayuda, procuré comprender el Hechizo. Reuní diversos registros históricos y mágicos que conservaban algunos detalles del Hechizo. Pasé tiempo en la [umbra|E] para determinar el vínculo adecuado entre un [UmbraGlossary('shadow_realm')] y el Hechizo de la Vida. Con mi investigación completa, he obtenido la mayoría de los registros que sobreviven. Ahora te lo entrego todo para que lo destruyas y te pido que borres el Hechizo de la Vida de mi memoria.»\n\nDurante un momento, Horus permanece sentado, considerándote en silencio. «Aunque en su día cuestioné la sensatez de permitir tu búsqueda, ahora veo que fue acertada mi decisión de ayudar a tu obra. Te agradezco tu servicio y destruiré gustoso estos registros. Sin embargo, tus acciones muestran una gran sabiduría. Donde tantos otros han fracasado, has demostrado que puedes usar el Hechizo de la Vida con responsabilidad. Aunque te prohíbo enseñar el Hechizo a otros, te permitiré conservar tus recuerdos de él y usarlo como mejor te parezca. Te has demostrado digno de tal consideración. Incluso te ayudaré a perfeccionar tu Hechizo de la Vida. Además, emitiré un edicto entre los Shemsu-heru para protegerte, salvaguardando a un ayudante tan leal en la guerra contra Set e impidiendo que se robe tu saber. Bien hecho, mi bueno y fiel siervo.»"
 POD_mummy_spell_of_life.70.a: "Gracias, mi señor."
 POD_mummy_spell_of_life_cant_teach_spell_of_life: "Ya no puedes enseñar el Hechizo de la Vida"
 POD_mummy_spell_of_life_make_only_shemsuheru: "Si no lo hacía ya, tu Hechizo de la Vida creará ahora Shemsu-heru"
 blessing_of_horus_modifier: "Bendición de Horus"
 blessing_of_horus_modifier_desc: "Como recompensa por tu gran servicio y tu lealtad, Horus te ha bendecido con un gran poder que aumenta a la par que tu fervor y tu lealtad."

 POD_mummy_spell_of_life.71.t: "Heraldo de Set"
 POD_mummy_spell_of_life.71.desc: "«¿Quién perturba mi hibernación?»\n\n«Mi señor. Vengo ante ti para ofrecerte el Hechizo de la Vida, robado a la prole de Horus.»\n\n«Has triunfado donde todos mis otros chiquillos fracasaron. Muy bien, tendrás tu recompensa.»\n\n«G-gracias, mi señor.»\n\nSientes un tirón mental y luego una claridad y una paz perfectas cuando algo nuevo se une a ti dentro de tu mente.\n\n«Aunque Malkav fue un necio al destruir su cuerpo corpóreo, una forma menor del vínculo tiene sus ventajas. Tu mente es ahora una con la mía para que puedas servirme mejor como agente mío. Regresa con tus hermanos. Recuérdales su propósito y prepara el camino para mí. Mi despertar está cerca. Regresaré al frente de una gran hueste de Imperecederos para recompensar a mis fieles y condenar a mis enemigos.»"
 POD_mummy_spell_of_life.71.a: "Proclamaré tu nombre."
 set_mind_control_tooltip: "Tu personalidad cambia cuando la mente de Set se impone sobre la tuya"
 herald_of_set_modifier: "Heraldo de Set"
 # chose to use only a few middle english words to make it feel old-timey but still recognizable
 herald_of_set_modifier_desc: "Quien tenga oídos, que oiga. La venida de nuestro Señor Set está cerca. Temblad y desesperad, todos los infieles."
 sets_herald_tooltip: "Todo [GetTrait('setite').GetName(GetNullCharacter)] y todo adorador de Set tendrá más probabilidad de aceptar tu vasallaje."
 recreate_setite_empire_effect_tooltip: "Con la ayuda de Set, recreas el [title|E] del Imperio Setita." 
 transfer_setite_empire_effect_tooltip: "Por orden de Set, tomas el control del [title|E] del Imperio Setita."

 POD_mummy_spell_of_life.72.t: "Un festín final"
 POD_mummy_spell_of_life.72.desc: "Te atiborras del terror, la miseria y la agonía de tus prisioneros. Al hacerlo, sientes una extraña conexión a través del espíritu que se fundió contigo. Tu conocimiento del Hechizo de la Vida fluye por tu mente y por la conexión hacia tu amo oculto.\n\nCuando la transferencia se completa, extrañas vibraciones recorren el mundo mientras el equilibrio se derrumba. Furia pura, locura y malicia se filtran en los mortales de todo el mundo. Un hambre voraz, la codicia y la lujuria los llenan. La desesperanza los consume y los empuja a buscar satisfacción antes del inevitable derrumbe de todo. Los Bane se funden con las almas de mortales muy parecidos a lo que tú fuiste, y los transforman con el recién completado Hechizo de la Vida. Percibes cómo una tormenta sin parangón barre el [UmbraGlossaryLocalized('shadowlands','Inframundo')]. Fragmentos interminables de djinn y de almas se cuelan por la barrera y te permiten atiborrarte de ellos. Se abren agujeros en el [UmbraGlossary('pod_realm_labyrinth')] que dejan salir a ejércitos de espectros de tamaño incomparable. Los antiguos hijos y siervos de tu amo despiertan en medio del caos. Tu amo se alza desde debajo del [UmbraGlossary('well_of_the_void')], despertando para devorar el mundo mismo."
 POD_mummy_spell_of_life.72.a: "¡No queda más que festejar! ¡Festejar! ¡FESTEJAR!"


 POD_mummy_spell_of_life.80.t: "Un nuevo nombre"
 POD_mummy_spell_of_life.80.desc: "Con tu éxito, es hora de dar nombre a tu nueva Dinastía de #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Imperecederos#!#!. Los Shemsu-Heru recibieron la inmortalidad de Horus y siguen su código. Los Cabiri fueron creados por el Hechizo de la Vida de Cabirus. Los Apepnu fueron creados por los defectuosos rituales de Set.\n\n¿Cómo deseas llamar a quienes concedas el renacimiento eterno mediante tu versión del Hechizo? Quizá os llaméis los Inanna-ene o Baldar, por los dioses que murieron y renacieron. Quizá os llaméis como los grupos que practicaron la momificación, como las momias de las turberas o las momias ahumadas, o como los errantes malditos de incontables relatos. Quizá os llaméis como los santos incorruptos, los monjes ascetas y los grandes alquimistas, desde Baruch hasta Teresa y desde los Sokushinbutsu hasta Flamel, cuyos cuerpos nunca se descompusieron y que, según algunos, aún caminan entre nosotros. Hay muchos nombres que podrías usar."
 POD_mummy_spell_of_life.80.a: "Elegir este nombre."
 POD_mummy_spell_of_life.80.b: "Conservar el nombre predeterminado #italic ([GetPlayer.Custom('PODGetDefaultCustomMummyDynastyName')])#!."

 POD_mummy_spell_of_life.81.t: "Un nuevo señorío"
 POD_mummy_spell_of_life.81.desc: "Con tu éxito, es hora de dar nombre a tu nuevo [UmbraGlossary('shadow_realm')]. Al morir, los Shemsu-Heru regresan a [UmbraGlossaryLocalized('dark_kingdom_of_sand','Amenti')] hasta que renacen. Los Cabiri viajan a [UmbraGlossary('hades')].\n\nAhora que has labrado tu propio señorío, ¿cómo deseas llamar a este señorío al que regresarán a descansar las almas de tus seguidores entre renacimientos? Quizá lo llames Helheim, Sheol, Yomi, Irkalla, Tuonela, las Islas Verdes, la Morada del Canto, las Montañas del Inmortal, el Inframundo, el Limbo, la Sala de Espera, la Tierra del Retorno o los Salones del Reposo. Hay muchos más allás y muchos nombres que podrías usar."
 POD_mummy_spell_of_life.81.a: "Elegir este nombre."
 POD_mummy_spell_of_life.81.b: "Conservar el nombre predeterminado #italic ([GetPlayer.Custom('PODGetDefaultCustomMummyDynastyShadowRealm')])#!."

 POD_mummy_spell_of_life.82.t: "Un nuevo camino"
 POD_mummy_spell_of_life.82.desc: "Con tu éxito, es hora de construir el camino que guiará a tus seguidores hacia el futuro, el código que gobernará sus acciones, la postura que determinará su lugar en la Guerra por el Equilibrio, la tierra que llamarán hogar. Elige con sabiduría, pues tus palabras quedarán grabadas en piedra, inalterables a través de las eras."
 POD_mummy_spell_of_life.82.a: "¡Proclamar nuestro nuevo camino!"
 POD_mummy_spell_of_life.82.b: "Un camino más sencillo bastará..."
