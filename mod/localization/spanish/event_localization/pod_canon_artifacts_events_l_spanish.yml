 dominate_decision: "Artefacto de Dominación"
 dominate_decision_tooltip: "Finalmente, tendrán que escuchar"
 dominate_decision_desc: "Tienes un artefacto potente a tu disposición. Aprovechar su poder te daría un gran conocimiento sobre la disciplina vampírica de $pod_discipline$ de Dominación."
 dominate_decision_confirm: "Obedecerán"
 
 obtenebration_decision: "Artefacto abisal"
 obtenebration_decision_tooltip: "Mirar hacia el abismo..."
 obtenebration_decision_desc: "Tienes un potente artefacto abisal a tu disposición. Aprovechar su poder te daría un gran conocimiento sobre la disciplina vampírica de $pod_discipline$ de Obtenebración."
 obtenebration_decision_confirm: "Mucho más por aprender"
  
 gaffari_scrolls_decision: "Los Pergaminos de Gaffari"
 gaffari_scrolls_decision_tooltip: "Una lectura interesante"
 gaffari_scrolls_decision_desc: "La prueba de una conspiración en Alamut; a los líderes de los Banu Haqim les encantaría poner sus manos sobre esto... o sobre los conspiradores."
 gaffari_scrolls_decision_effect_tooltip: "Usarás los pergaminos para tu propio beneficio, de una forma u otra" 
 gaffari_scrolls_decision_confirm: "Pensemos..."
   
 POD_canon_artifacts.600.t: "Los Pergaminos de Gaffari"
 POD_canon_artifacts.600.desc: "Estos pergaminos revelan la existencia de una vasta conspiración dentro del clan Banu Haqim, destinada a purgarlos de las «religiones nuevas y débiles» y allanar el camino para el regreso de un no nombrado «Pastor Negro».\nSon, obviamente, de tremenda importancia para los líderes Assamita que llevan tiempo buscándolos. Pero también interesarían a los propios conspiradores, que podrían pagar un buen precio por recuperarlos..."
 POD_canon_artifacts.600.a: "Vendérselos a los conspiradores"
 POD_canon_artifacts.600.b: "Revelar la conspiración a los Ancianos"
 POD_canon_artifacts.600.c: "Podría usarlos para mi propia ambición..."

 animalismadvanced_decision: "Reliquia salvaje"
 animalismadvanced_decision_tooltip: "Estaré en comunión con la naturaleza."
 animalismadvanced_decision_desc: "Tienes una poderosa reliquia salvaje a tu disposición. Aprovechar su poder te daría un gran conocimiento sobre la disciplina vampírica de $pod_discipline$ de Animalismo."
 animalismadvanced_decision_confirm: "Un maestro de la metamorfosis"
 
 POD_inquihunt_truecross_tt: "El portador de la Santa Cruz obtiene una seria bonificación de Destreza durante la duración de este evento."

 grail_ashes_decision: "El Cáliz de las Cenizas Amargas"
 grail_ashes_decision_tooltip: "¿Una simple bebida?"
 grail_ashes_decision_desc: "Se dice que el Cáliz desbloquea poderes fabulosos para los de corazón puro. ¿Eres digno?"
 grail_ashes_decision_effect_tooltip: "Beberás del Cáliz. ¿Quién sabe qué podría pasar?" 
 grail_ashes_decision_confirm: "¿Un sabor a cielo?"
 
 POD_canon_artifacts.700.t: "La valentía del aspirante al Cáliz"
 POD_canon_artifacts.700.desc: "El Santo Grial, o el Cáliz de las Cenizas Amargas, es una leyenda tanto para los Cainitas como para los mortales. ¿Qué poderes milagrosos podría desbloquear para ti? Solo beber de él lo dirá.\nEn cuanto des el primer sorbo a esta reliquia sagrada, sentirás que tu mente se evade e imaginarás que estás rodeado de figuras encapuchadas que hablan en una lengua extranjera. Se lanzan rápidamente contra ti con las espadas desenvainadas.\nY, de algún modo, puedes sentir su presencia física a tu alrededor como si estuvieran aquí..."
 POD_canon_artifacts.700.a: "¡No temo ni al hombre ni al fantasma!"
 POD_canon_artifacts.700.effect.success.desc: "Victorioso, continúas bebiendo."
 POD_canon_artifacts.700.critical.failure.effect.desc: "Derrotado, devuelves el Cáliz antes de ser abrumado." 

 POD_canon_artifacts.701.t: "El alma del aspirante al Cáliz"
 POD_canon_artifacts.701.desc: "Los fantasmas de los aspirantes caídos se han ido y el primer sorbo del Cáliz danza en tu lengua. Aunque ya puedes sentir el poder de esta reliquia, necesitarás más si quieres desbloquearla por completo.\nAl continuar bebiendo, te encuentras divagando de nuevo; esta vez, se te recuerda cada vez que tu alma fue manchada por actos crueles o egoístas. Parece que el Cáliz no sirve fácilmente a los villanos."
 POD_canon_artifacts.701.a: "¡Soy digno!"
 drink_grail_tt: "Tu alma y tu personalidad están siendo puestas a prueba."

 POD_canon_artifacts.702.t: "El demonio del aspirante al Cáliz"
 POD_canon_artifacts.702.desc: "El último obstáculo en tu empeño por reclamar el Cáliz eres... tú, al parecer. Te enfrentas a una visión grotesca de ti mismo, más feroz que mortal, que te gruñe y parece desafiarte a intentar terminar esta bebida.\nLa Bestia, esta Maldición Impía en el alma de cada Cainita, se siente amenazada por esta repentina intrusión de lo Sagrado en tu maldito cuerpo. No se rendirá sin una terrible lucha mental, intentando ya imponer su control sobre ti."
 POD_canon_artifacts.702.a: "¡Yo tengo el control!"
 drink_grail_tt2: "¿Es tu Bestia más fuerte que tu voluntad?"

 POD_canon_artifacts.703.t: "El Caballero del Grial se alza"
 POD_canon_artifacts.703.desc: "Se ha cumplido. Has demostrado tu valentía, tu alma y tu Fuerza de Voluntad ante el Grial y ahora puedes beber libremente. Aun así, incluso con esas victorias, duele mucho, ya que el Grial altera fundamentalmente quién eres.\nIncluso esta poderosa reliquia no es suficiente para superar verdaderamente la maldición de Dios sobre Caín, pero sigue siendo un cambio profundo y milagroso. Ahora eres algo más que un mero vampiro y irradias energía sagrada[AddTextIf( PlayerHasBeast, ' mientras la Bestia en tu interior suelta su último y agónico aullido' )]."
 POD_canon_artifacts.703.a: "¿Salvación por fin?"
 drink_grail_tt3: "Como [GetTrait('POD_grail_knight').GetName(GetPlayer)], obtienes lo siguiente:\n $BULLET_WITH_TAB$Tienes sangre infinita\n $BULLET_WITH_TAB$Nunca volverás a entrar en Frenesí\n $BULLET_WITH_TAB$Tus Ghouls (creados a partir de mortales) comienzan siendo físicamente más fuertes\n $BULLET_WITH_TAB$Puedes reclutar a [GetMaA('order_bitter_ashes_maa').GetName] como hombres de armas."
 drink_grail_tt4: "Como [GetTrait('POD_grail_knight').GetName(GetPlayer)], tus Ghouls son más fuertes al compartir un poco de tu sangre sagrada."
 
 POD_canon_artifacts.704.t: "El aspirante indigno del Grial"
 POD_canon_artifacts.704.desc: "Los caminos del Grial son misteriosos. Mientras sufres el terrible dolor de beber de la reliquia sagrada, el líquido se convierte repentinamente en cenizas, tal como Dios maldijo a Caín. Mientras la Bestia ríe ante la visión de tu derrota, lanzas violentamente la copa, símbolo de tu vergüenza, lejos.\nEs difícil decir si intentar el ritual de nuevo después de algún tiempo daría un resultado diferente. Podrías intentarlo más tarde, pero el Grial tendría entonces que permanecer aquí, como un recordatorio para todos de tu ingloriosa derrota."
 POD_canon_artifacts.704.a: "¡Arrojad esta baratija al mar!"
 POD_canon_artifacts.704.b: "Una noche, seré digno." 
 
 full_glamour_decision: "La Rosa"
 full_glamour_decision_desc: "Este tesoro se ha mantenido puro y vibrante mientras sostenía a su poseedor sin necesidad de Rhapsodizar. Las hadas que poseen la Rosa extraen el Glamour directamente de ella."
 full_glamour_decision_tooltip: "Rhapsodizar es cosa del pasado"
 full_glamour_decision_confirm: "Extrae Glamour"
 
 baizetu_decision: "Bai Ze Tu"
 baizetu_decision_tooltip: "¿La guía definitiva para la caza de monstruos?"
 baizetu_decision_desc: "Se rumorea que fue escrita por el propio Emperador Amarillo; el Bai Ze Tu se ha fragmentado a lo largo de los siglos, pero aún podría ser posible reconstruirlo."
 baizetu_decision_confirm: "Hora de leer"
 baizetu_decision_custom: "Necesitas tener en tu posesión los cinco fragmentos del Bai Ze Tu" 
  
 artifact_baizetu_name: "Bai Ze Tu"
 artifact_baizetu_description: "Un grimorio legendario escrito por nada menos que el divino Emperador Amarillo, que se dice que contiene los secretos de los 11 520 tipos de criaturas sobrenaturales.\nCon el tomo completo en sus manos, uno conocería cada fuerza y debilidad de sus enemigos, y con esa sabiduría sería imparable.\nLa verdad es un poco más complicada: el tomo es difícil de descifrar y está lleno de engaños, aunque sigue siendo muy útil para el lector dedicado y paciente."
 
 spear_orthia_decision: "Reforjar la lanza destrozada"
 spear_orthia_decision_tooltip: "¿Un símbolo de valentía forjado de nuevo?"
 spear_orthia_decision_desc: "La Lanza de Artemisa Orthia se hizo añicos cuando ella asaltó valientemente las murallas de Cartago. Con la ayuda de un hábil herrero sobrenatural, podría ser reconstruida."
 spear_orthia_decision_confirm: "¡Un arma de leyenda!"
 shattered_spear_decision_custom: "[TARGET_CHARACTER.GetFirstName] debe ser tu [friend|E], miembro de tu [coterie|E] o tu [soulmate|E]" 
 
 artifact_spear_orthia_name: "Lanza de Artemisa Orthia"
 artifact_spear_orthia_description: "Un arma legendaria empuñada antaño por una guerrera legendaria. Se dice que Artemisa Orthia, la amada del propio Ventrue, cargó valientemente contra la locura de Cartago como se esperaba de una diosa espartana. Aunque su lanza se hizo añicos durante la lucha, ahora ha sido reforjada para recuperar su antigua gloria."
 
 truth_saulot_decision_tt: "Descifrarás el diario de Javaniel y las tablillas, y luego decidirás qué hacer con ellos."
 truth_saulot_decision: "¿La Verdad sobre Saulot?"
 truth_saulot_decision_tooltip: "¿Qué se puede aprender de este misterioso diario?"
 truth_saulot_decision_desc: "El diario que has encontrado parece haber sido escrito por un vampiro Salubri. Está encriptado y necesitarás descifrarlo con una clave específica si deseas leer su contenido."
 truth_saulot_decision_confirm: "Empecemos a leer"
 
 POD_canon_artifacts.800.t: "¿La Verdad sobre Saulot?"
 POD_canon_artifacts.800.desc: "Finalmente has desbloqueado el diario de Javaniel y su contenido es... inquietante.\nJavaniel fue un Salubri activo hace mucho tiempo, compañero de Saulot y Samiel durante las Guerras Baali. Su relato de los hechos describe a Saulot como una mente maestra despiadada, si no directamente malvada, tras la creación de los infernalistas Baali, lejos de su imagen de mentor santo. Las Tablillas de Marfil que también posees confirman este hecho, afirmando que Saulot está dispuesto a quemar el mundo entero si eso significa reinar sobre él durante «el próximo giro de la Rueda».\nJavaniel murió hace mucho tiempo, aparentemente asesinado por el propio Saulot para ocultar la verdad, así que tú eres el único con pruebas concretas de este lado menos conocido del amado Antediluviano. Si lo revelaras, el clan Salubri quedaría conmocionado hasta sus cimientos y sus enemigos se sentirían envalentonados."
 POD_canon_artifacts.800.a: "Las reliquias vampíricas me sirven de poco, aparte para la investigación académica."
 POD_canon_artifacts.800.b: "¡El mundo debe conocer la verdad!" 
 POD_canon_artifacts.800.custom: "Los Salubri perderán mucho prestigio y ganarán una cantidad masiva de estrés.\nLos Tremere ganarán algo de prestigio y perderán algo de estrés al mismo tiempo."
 POD_canon_artifacts.800.c: "Destruiré el diario y me guardaré la verdad para mí."
 POD_canon_artifacts.800.d: "¡Mentiras! ¡MENTIRAS!" 
 
 samiel_code_decision: "Reconstruir el Código de Samiel"
 samiel_code_decision_tooltip: "El legado de Samiel, apenas aferrándose a la vida."
 samiel_code_decision_desc: "La única copia superviviente del Código de Samiel se fracturó en dos partes durante el ascenso temprano de los Tremere. Encontrar y combinar ambas restauraría su antigua gloria. Una victoria pequeña pero valiosa para los Salubri."
 samiel_code_decision_confirm: "El legado de Samiel perdura."

 incunabulum_kupalam_decision: "Incunabulum Kupalam"
 incunabulum_kupalam_decision_tooltip: "Una parte del demonio bajo la historia de Transilvania."
 incunabulum_kupalam_decision_desc: "Muchos han intentado codificar lo que saben sobre el maestro demoníaco de Transilvania, Kupala. Si todo este conocimiento pudiera compilarse en un solo tomo, quizás parte de la verdad podría conocerse finalmente."
 incunabulum_kupalam_decision_confirm: "¿La respuesta definitiva?"
 incunabulum_kupalam_decision_requirement: "Necesitas encontrar al menos 5 tratados sobre artefactos de Kupala para poder codificar este tratado."
 incunabulum_kupalam_decision_effect: "Combinas todos tus apuntes para crear el [GetPODArtifactName('incunabulum_kupalam_link')]" 

 codex_mortis_decision: "El Codex Mortis"
 codex_mortis_decision_tooltip: "Los secretos de la muerte al alcance de tu mano."
 codex_mortis_decision_desc: "Un gran libro hecho de varios pergaminos que, al parecer, contiene los secretos de la Necromancia. Parece que no se puede leer nada hasta que su guardiana fantasma, Titia Sabina, sea convencida o coaccionada para ayudar."
 codex_mortis_decision_confirm: "¡Wraith, escúchame!"
 codex_mortis_decision_tt: "Intentarás convencer a Titia Sabina para que desista, permitiéndote con suerte aprender los secretos del libro."
 
 POD_canon_artifacts.900.desc: "Algunas investigaciones han confirmado que el libro que tienes en tus manos contiene el conocimiento necromántico secreto de la familia Iovanus, más conocida hoy en día como los Giovanni. Este códice fue creado por un miembro rebelde de su linaje mucho antes de que se convirtieran en vampiros y lo conservó desde entonces, principalmente como un acto de despecho contra la familia que le lo quitó todo.\nEste hombre, Aurelius Flavius Iovianus, vinculó el alma de su esposa asesinada, Titia Sabina, al libro en un esfuerzo por salvarla y también para crear un poderoso guardián para el códice. Este esfuerzo valió la pena y estás convencido de que no puedes acceder al contenido del libro sin la aprobación de Titia.\nUn conflicto directo sería imprudente, ya que has averiguado que Titia tiene varios [Fetters|E] en este mundo, por lo que podría destruir fácilmente el libro si intentaras una acción hostil contra ella. Una diplomacia astuta parece ser el único camino a seguir."
 POD_canon_artifacts.900.a: "¿Por qué brilla en rojo?"
 codex_mortis_kill_tt: "Titia sabe que mataste a su amado Aurelius. Destruye el libro por venganza."
 POD_canon_artifacts.900.b: "¡Aurelius puede hablar bien de mí!" 
 codex_mortis_friend_tt: "Tienes una buena relación con su amado Aurelius. Por lo tanto, Titia abre el libro sin ningún problema."
 POD_canon_artifacts.900.custom: "Los Salubri perderán mucho prestigio y ganarán una cantidad masiva de estrés.\nLos Tremere ganarán algo de prestigio y perderán algo de estrés al mismo tiempo."
 POD_canon_artifacts.900.c: "Puedo convencer a un wraith. Probablemente."
 POD_canon_artifacts.900.effect.success.desc: "¡Titia abre el libro!"  
 POD_canon_artifacts.900.critical.failure.effect.desc: "Titia se niega a abrir el libro..."
 codex_mortis_fail_tt: "El códice te rechaza, dejándote con un libro vacío e inútil."
 
 broken_blade_michael_decision: "Reforjar la Espada de Miguel"
 broken_blade_michael_decision_tooltip: "¿Un símbolo de valentía forjado de nuevo?"
 broken_blade_michael_decision_desc: "Un símbolo de amor y odio, divinidad y demonía; la rota Espada de Miguel es muchas cosas. Sin embargo, en su estado actual, no es más que una prestigiosa pieza de metal."
 broken_blade_michael_decision_confirm: "Un arma de leyenda, de vuelta al mundo."
 
 artifact_blade_michael_name: "Espada de Miguel"
 artifact_blade_michael_description: "Esta antigua hoja fue la propia espada de Miguel mucho antes de que se convirtiera en Miguel. Fue utilizada por una joven de Ebla para suicidarse cuando su amor eterno nunca llegó a salvarlos. Fue recuperada siglos después por esta misma joven, ahora inmortal ella misma, y empoderada con su odio demoníaco hacia aquel que la abandonó.\nFinalmente, en 1204, la espada volvió a su dueño original y su destrucción fue el penúltimo acto de venganza de quien fuera una niña de Ebla.\nAhora ha sido reforjada a su antigua gloria, pero su turbulento pasado aún puede ser sentido por aquellos con verdadera percepción."
  
 akhu_decision: "Hechicería de Sangre Akhu"
 akhu_decision_tooltip: "Magia serpentina"
 akhu_decision_desc: "Aunque es un secreto bien guardado por los pocos Seguidores de Set que lo conocen, el Akhu ha sido codificado varias veces a lo largo de las eras. Puedes usar tu artefacto para comenzar tu viaje hacia su comprensión."
 akhu_decision_effect_tooltip: "Ahora podrás progresar en el árbol de la Hechicería de Sangre Akhu." 
 akhu_decision_confirm: "Secretos de Egipto."
  
 
 sword_of_fever_decision: "Desenvainar la Espada de la Fiebre"
 sword_of_fever_decision_tooltip: "Tanta muerte..."
 sword_of_fever_decision_desc: "La Espada de la Fiebre contiene a todos los espíritus de la enfermedad de Entoban. Con el máximo cuidado, puede desenvainarse apenas un dedo de su vaina para infligir enfermedad a tus enemigos. Sin embargo, si la desenvainas por completo, desatará una plaga terrible y destructiva sobre la tierra."
 sword_of_fever_decision_effect_tooltip: "Podrás desenvainar la hoja por completo, si así lo deseas."
 sword_of_fever_decision_confirm: "He decidido."


 POD_canon_artifacts.1000.t: "Leer el Tapiz del Destino"
 POD_canon_artifacts.1000.desc: "El Tapiz del Destino contiene todos los [Glossary('Nombres Verdaderos','podgloss.truename')] que existen, así como el destino del [UmbraGlossary('dreaming')]. En realidad, es menos difícil de entender de lo que temías, pero aprender los nombres seguirá requiriendo cierto esfuerzo por tu parte.\nCrees que es más prudente estudiar un concepto a la vez para evitar una sobrecarga de información potencialmente peligrosa. ¿Cuál será tu enfoque hoy?"
 POD_canon_artifacts.1000.k: "Este no es un buen momento"
 POD_canon_artifacts.1000.personality: "Personalidad"
 POD_canon_artifacts.1000.education: "Educación"
 POD_canon_artifacts.1000.commander: "Comandante"
 POD_canon_artifacts.1000.lifestyle: "Estilo de vida"
 POD_canon_artifacts.1000.fame: "Fama"
 POD_canon_artifacts.1000.stress: "Estrés"
 POD_canon_artifacts.1000.health: "Salud"
 POD_canon_artifacts.1000.physical: "Físico"
 
 POD_canon_artifacts.1011.t: "$learning_true_names_head$ Nuevo Nombre Verdadero descubierto"
 POD_canon_artifacts.1011.desc: "Has aprendido con éxito el [Glossary('Nombre Verdadero','podgloss.truename')] de [trait.GetName( GetPlayer.Self )]; ahora puedes usarlo para nombrar conjuros menores."
 POD_canon_artifacts.1011.a: "Continuaré estudiando."
 
 POD_canon_artifacts.1012.t: "$learning_true_names_head$ No hay Nombre Verdadero que descubrir"
 POD_canon_artifacts.1012.desc: "Has aprendido todos los [Glossary('Nombre Verdadero','podgloss.truename')] sobre este tema que podrías usar jamás."
 POD_canon_artifacts.1012.a: "Descansaré ahora."

 POD_canon_artifacts.1020.t: "Dragón de la noche"
 POD_canon_artifacts.1020.desc: "Conoces las historias. El arma que portas es, quizás, la más infame del mundo. Hace mucho tiempo, el maestro espadero Isamu Harujiro no tenía parangón, e incluso los dioses pedían sus hojas. Aunque al principio era honrado, se hartó de las insignificantes peticiones que le hacían y que entorpecían su trabajo, y decidió reservarse su mejor hoja para sí mismo: Tatsuko Sayo.\nEbrio de poder, declaró la guerra al Mundo Espiritual y así comenzaron las 4000 Noches de Dolor Sin Fin. La carnicería causada por Isamu fue tan grande que el Mundo Espiritual, notoriamente dividido, se unió y envió a su campeón, Ishitaro, para detenerlo. Los dos guerreros perecieron en la batalla y la katana se perdió.\n\nLa historia del espadero continúa durante más tiempo, regresando como un wraith y siendo coaccionado por el Emperador del Reino Oscuro de Jade para conseguirle la katana. Al regresar a la Tierra como un Risen, Isamu es detenido por una nueva coalición antes de que pueda encontrar su hoja y así termina la historia... o eso parece.\n\nUna parte del alma de Isamu aún perdura en Tatsuko Sayo, pues fue su plan de contingencia definitivo. Esta alma busca un nuevo huésped, lo suficientemente digno para el espadero, y tienta a los dueños de la hoja con sus increíbles poderes antes de evaluar si debería intentar poseerlos... o «descartarlos» si no son dignos.\n\nNo hace falta decir que conservar esta katana por más tiempo sería un movimiento muy peligroso."
 POD_canon_artifacts.1020.b: "Solo historias... ¿verdad?"

 POD_canon_artifacts.1021.t: "Indigno"
 POD_canon_artifacts.1021.desc: "Tatsuko Sayo te ha estado proporcionando inmensos poderes desde que decidiste conservarla, pero puedes sentir que el alma en su interior está... insatisfecha con tu falta de ambición. Después de todo, alguna vez fue propiedad de alguien que desafió a todo el reino de los dioses.\nTras una batalla reciente, puedes sentir que de repente se niega a ser envainada... o más exactamente, intenta envainarse en tu torso. Como cuentan las historias, aquel que sea considerado indigno será, en efecto, descartado por la katana.\n\nSe dice que algunos de sus antiguos dueños lograron encontrar rituales y preparaciones para imponer su voluntad a la hoja y evitar este fatídico destino. Esperemos que tus conocimientos al respecto sean suficientes."
 POD_canon_artifacts.1021.a: "¡Yo mando aquí!"
 POD_canon_artifacts.1021.b: "Deshazte de la hoja."
 POD_canon_artifacts.1021.effect.success.desc: "Luchas por el control de la hoja"
 POD_canon_artifacts.1021.critical.failure: "Indigno, en efecto."
 
 POD_canon_artifacts.1022.t: "Isamu Harujiro"
 POD_canon_artifacts.1022.desc: "Aunque pensabas que finalmente habías logrado controlar Tatsuko Sayo para siempre, la amarga verdad se revela pronto. La hoja ha estado latente porque se ha impresionado por tu reciente muestra de Fuerza de Voluntad. En resumen, has sido considerado digno de ser habitado por el alma del espadero.\n\nObviamente, tú no tienes voz ni voto en este asunto.\n\nSúbitamente sumergido en el mundo Yin, te enfrentas a la verdadera forma de la katana: el Espectro de Isamu Harujiro. Si logras triunfar aquí, su alma será finalmente purgada de la katana para siempre. Si fallas, sin embargo... bueno, al menos serás un buen cuerpo para el vengativo espadero.\nEs hora de poner a prueba tu temple contra alguien que sacudió los cielos hace mucho tiempo.\n\nSin presiones."
 POD_canon_artifacts.1022.a: "Lamento mis decisiones de vida."
 POD_canon_artifacts.1022.effect.success.desc: "¡Un triunfo!"
 POD_canon_artifacts.1022.critical.failure.effect.desc: "¡Un triunfo! Pero no para ti." 
 
 POD_canon_artifacts.1023.t: "Domando al dragón"
 POD_canon_artifacts.1023.desc: "Mientras el Espectro de Isamu se disuelve ante ti, puedes sentir finalmente cómo la katana se libera del alma invasora de su creador.\nSin más sorpresas, sin más intentos de dominación, has triunfado sobre la infame maldición de Tatsuko Sayo. Puedes disfrutar de los frutos de tu victoria: uno de los armas más poderosas del mundo a tu disposición y la fama de haberla domado para siempre."
 POD_canon_artifacts.1023.a: " #italic Un elegante envainado de tu katana #! "

 POD_canon_artifacts.1024.t: "Bienvenido de nuevo, maestro"
 POD_canon_artifacts.1024.desc: "Mientras el necio que intentó domar Tatsuko Sayo yace muriendo lentamente a tus pies, te preguntas si la katana ha elegido bien a su nuevo huésped. ¿Sería mejor simplemente acabar con este debilucho y buscar a alguien mejor?\nNo, ha pasado demasiado tiempo desde que te recuperaste en la hoja y es poco probable que encuentres una oportunidad mejor durante un tiempo. Este necio servirá para tu renacimiento.\n\nSí, les vendrá bien."
 POD_canon_artifacts.1024.a: "Mi guerra no ha terminado."

 nick_vengeful_spectre: "el Espectro Vengativo"
 nick_vengeful_spectre_desc: "Incluso la muerte fue solo un contratiempo para aquel que hizo llorar a los Cielos."
 Isamu_Harujiro: "Isamu Harujiro"
 isamu_modifier: "Portador del Dolor"
 isamu_modifier_desc: "El mundo sabe que estás en guerra con cada uno de ellos. No importa, Tatsuko Sayo tiene sed por siempre."

 robe_golden_mandarin_decision: "Túnicas del Mandarín Dorado"
 robe_golden_mandarin_decision_tooltip: "Una maldición dorada"
 robe_golden_mandarin_decision_desc: "La protección mágica de Gan Lau Kien para sus preciosas túnicas es formidable. ¿Eres lo bastante culto como para encontrar la forma de esquivarlas y desbloquear el verdadero poder de este ilustre artefacto?"
 robe_golden_mandarin_decision_confirm: "Nada puede con mi intelecto."


 POD_canon_artifacts.1100.t: "La Espada de la Fiebre"
 POD_canon_artifacts.1100.desc: "Has decidido desenvainar completamente la Espada de la Fiebre, desatando así una calamidad que se llevará innumerables vidas. Nadie conoce realmente tus razones para hacer esto, quizás ni siquiera tú mismo. Independientemente de ello, si tenías alguna duda, esta es la última oportunidad para abandonar esta idea..."
 POD_canon_artifacts.1100.a: "¡Sí, desenvainala!"
 POD_canon_artifacts.1100.b: "Quizá esta no sea una buena idea."
 sword_of_fever_used_modifier: "Desenvainó la hoja"
 sword_of_fever_used_modifier_desc: "Por razones desconocidas, sentenciaste a millones de personas a la muerte al desatar una enfermedad mortal."