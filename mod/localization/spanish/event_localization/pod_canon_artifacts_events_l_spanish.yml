 POD_canon_artifacts.100.t: "La espada llama"
 POD_canon_artifacts.100.desc: "Conoces las historias. El arma que portas es, quizás, la más infame del mundo. La Espada de Nul fue creada hace mucho tiempo como un receptáculo para el poderoso demonio Drakonskyr en la antigua Sumeria. Justo antes de ser liberado finalmente en el mundo mortal, fue frustrado por una vampiro llamada Tiamat, quien lo atrapó en su propio cuerpo y luego arrojó la espada maldita lejos.\nDesde entonces, siempre ha intentado reunirse con su amo, y se sabe que la mayoría de sus dueños sufren una muerte prematura si no ceden al llamado del demonio en un momento u otro..."
 POD_canon_artifacts.100.a: "¡No dejaré que una espada me dé órdenes!"
 POD_canon_artifacts.100.b: "...Seguiré el llamado"
 sword_of_nul_warning: "Este camino es, obviamente, muy peligroso..."

 POD_canon_artifacts.101.t: "La espada llama II"
 POD_canon_artifacts.101.desc: "Al responder a su atracción, te das cuenta rápidamente de que a la Espada de Nul no le importa en absoluto tu bienestar. Te empuja implacablemente hacia el lugar de descanso de su amo, intentando incluso mantenerte despierto durante el día. Como tal, vas de peligro en peligro, ya sean bosques oscuros, la falta de sangre o la dificultad de encontrar un lugar de descanso en tierras extrañas.\nA este ritmo, te unirás a la larga lista de víctimas de la Espada; necesitas reducir el ritmo y planear un curso de acción antes de que sea demasiado tarde."
 POD_canon_artifacts.101.a: "Déjame preparar una guía de viaje..."
 POD_canon_artifacts.101.b: "¡Pagar por guías y una escolta armada!"
 POD_canon_artifacts.101.effect.success.desc: "Evitando el peligro"
 POD_canon_artifacts.101.critical.failure.effect.desc: "Otra víctima de la espada..." 
 POD_canon_artifacts.101.critical.failure: "Otra víctima más..."
 
 POD_canon_artifacts.102.t: "La espada llama III"
 POD_canon_artifacts.102.desc: "Finalmente estás cerca del lugar de descanso de Drakonskyr y casi puedes sentir la Espada de Nul rebosante de anticipación. Sin embargo, hay un pequeño problema: el demonio descansa en un laberinto lleno de trampas para disuadir a cualquier intruso no deseado.\nObviamente, tienes la Espada, así que puedes simplemente «seguir» su dirección para evitar la mayoría de los peligros que hay allí. Pero siempre existe el riesgo de dar un giro equivocado... Aunque ya no hay vuelta atrás, puesto que estás casi seguro de que la Espada te atacará si das un paso atrás en este punto."
 POD_canon_artifacts.102.a: "Cuidado, cuidado..."
 POD_canon_artifacts.102.effect.success.desc: "¡Lo he logrado!"
 POD_canon_artifacts.102.critical.failure.effect.desc: "¿Qué hace esa roca ahí?" 
 POD_canon_artifacts.102.critical.failure: "Aplastado por una roca"
 
 drakonskyr_reborn_modifier: "Drakonskyr renacido"
 drakonskyr_reborn_modifier_desc: "Drakonskyr renacido"

 POD_canon_artifacts.103.t: "# sin cambios"
 POD_canon_artifacts.103.desc: "Todo ha terminado, finalmente estás ante Tiamat-Drakonskyr. El demonio se ha despertado de su Letargo, advertido de tu llegada por su fiel Espada. El señor infernal es todo dulzura y miel, agradeciéndote que lo hayas liberado y prometiéndote generosas recompensas por tu ayuda.\nPronto comprendes que es demasiado tarde para oponerte a él ahora, ya que con la Espada de Nul a su lado es demasiado fuerte incluso para ti, así que consideras tus opciones.\nPor un lado, Drakonskyr te ofrece el contenido del tesoro de esta tumba y dejarte conservar la Espada, tras haber extraído obviamente su esencia de ella. Por otro, el demonio intenta tentarte con la posibilidad de convertirte en su nuevo huésped, con la promesa de un poder eterno si ambos estuvierais «trabajando juntos»."
 POD_canon_artifacts.103.a: "¡Ni hablar!"
 POD_canon_artifacts.103.b: "¡Claro que sí!"
 drakonskyr_free: "Enhorabuena, has liberado a un señor infernal. Al menos la Espada de Nul te será fiel ahora."

 tablet_of_destiny_decision: "La Tabla del Destino"
 tablet_of_destiny_decision_tooltip: "¡Conocimiento infinito!"
 tablet_of_destiny_decision_desc: "La Tabla del Destino posee el conocimiento de todos los poderes de sangre de Enoc. Vale mucho la pena estudiarla."
 tablet_of_destiny_decision_effect_tooltip: "Podrás aprender nuevas [Glossary('Disciplinas','game_concept_discipline_desc')] de la Tabla" 
 tablet_of_destiny_decision_confirm: "¡Nuevos poderes!"
 
 POD_canon_artifacts.200.t: "Descifrando la Tabla del Destino"
 POD_canon_artifacts.200.desc: "La Tabla del Destino fue el plano original de las [Glossary('Disciplinas','game_concept_discipline_desc')], quizás codificado por el propio Caín. En realidad, es menos difícil de entender de lo que temías, pero practicar los rituales necesarios para desbloquear los poderes de tu sangre requerirá cierto esfuerzo por tu parte.\nCrees que es más sensato estudiar una $pod_discipline$ a la vez para evitar una potencialmente peligrosa sobrecarga de información. ¿En cuál te centrarás esta noche?"
 POD_canon_artifacts.200.option.a: "Dominación"
 POD_canon_artifacts.200.option.b: "Animalismo"
 POD_canon_artifacts.200.option.c: "Auspex"
 POD_canon_artifacts.200.option.d: "Celeridad"
 POD_canon_artifacts.200.option.e: "Ofuscación"
 POD_canon_artifacts.200.option.f: "Potencia"
 POD_canon_artifacts.200.option.g: "Presencia"
 POD_canon_artifacts.200.option.h: "Protean"
 #POD_canon_artifacts.200.option.i: "Blood Sorcery"
 POD_canon_artifacts.200.option.j: "Fortaleza"
 #POD_canon_artifacts.200.option.k: "Obtenebration"
 POD_canon_artifacts.200.option.l: "Este no es un buen momento"
 
 tapestry_of_fate_decision: "El Tapiz del Destino"
 tapestry_of_fate_decision_tooltip: "¡Conocimiento infinito!"
 tapestry_of_fate_decision_desc: "El Tapiz del Destino contiene cada uno del [Glossary('Nombre Verdadero','podgloss.truename')]. Vale mucho la pena estudiarlo."
 tapestry_of_fate_decision_effect_tooltip: "Podrás aprender nuevos [Glossary('Nombres Verdaderos','podgloss.truename')] a partir del Tapiz." 
 tapestry_of_fate_decision_confirm: "¡Nuevos nombres!"
 
 eye_of_hazimel_decision: "El Ojo de Hazimel"
 eye_of_hazimel_decision_tooltip: "Te está observando..."
 eye_of_hazimel_decision_desc: "El Ojo de Hazimel es una reliquia malévola, conocida por arrebatar mentes y almas si no se maneja con cuidado. Has sido prudente hasta ahora, encerrando el Ojo en una caja, pero eso también te ha impedido aprovechar sus verdaderos poderes."
 eye_of_hazimel_decision_effect_tooltip: "Intentarás aprovechar todo el poder del Ojo... sin perderte a ti mismo" 
 eye_of_hazimel_decision_confirm: "Déjame pensarlo"
  
 POD_canon_artifacts.300.t: "Plantando el Ojo"
 POD_canon_artifacts.300.desc: "El Ojo de Hazimel es una reliquia malévola de orígenes ocultos, conocida por otorgar grandes poderes a cualquiera que reemplace su propio ojo con ella, pero también por exigir un gran tributo mental. Algunos se han perdido en la locura de las visiones que esta otorga, y el propio Ojo parece deleitarse transformando a su huésped en una extensión de su voluntad corruptora.\nHasta ahora has resistido su llamado, dejándolo a salvo dentro de una caja sellada, pero la tentación está siempre presente. ¿Quizás seas lo suficientemente fuerte como para aprovechar sus poderes sin perderte? ...o tal vez este sentimiento de arrogancia sea un delirio compartido por el Ojo para atraerte."
 POD_canon_artifacts.300.a: "¡Soy más fuerte que esta cosa!"
 POD_canon_artifacts.300.b: "Mantengamos la caja cerrada"
 eye_of_hazimel_warning: "Este camino es, obviamente, muy peligroso..."
 
 POD_canon_artifacts.301.t: "Plantando el Ojo II"
 POD_canon_artifacts.301.desc: "Te arrancaste tu propio ojo, abriste la caja sellada y viste con horror cómo el Ojo de Hazimel literalmente saltaba hacia tu cuenca ocular para implantarse. La sensación es confusa. No es exactamente dolor, ya que estás muy por encima de tales preocupaciones triviales, pero el volumen de imágenes y recuerdos que te inundan de repente es abrumador. Ves civilizaciones alzarse y caer, y Cainitas mucho más antiguos que tú luchando entre sí en guerras interminables... Y mientras tanto, el Ojo extiende sus tentáculos en tu cuerpo inerte, intentando tomar el control mientras estás distraído.\nTe das cuenta justo a tiempo para tener una oportunidad de defenderte, pero el Ojo intensifica su ataque a tu mente diez veces cuando ve que aún no te has rendido..."
 POD_canon_artifacts.301.a: "¡Resiste!"
 POD_canon_artifacts.301.effect.success.desc: "¡Puedo lograrlo!"
 POD_canon_artifacts.301.critical.failure.effect.desc: "Tantas maravillas que ver..." 
 
 eye_of_hazimel_tamed_modifier: "Ojo de Hazimel domado"
 eye_of_hazimel_tamed_modifier_desc: "El Ojo te ha reconocido como un huésped digno y no intenta tomar el control. Por ahora."
 
 POD_canon_artifacts.302.t: "Plantando el Ojo III"
 POD_canon_artifacts.302.desc: "Eres más fuerte que una mera reliquia de carne, incluso una tan vengativa como el Ojo de Hazimel. Poco a poco, pieza a pieza, combatiste la influencia corruptora en tu mente y regresaste a la conciencia. El Ojo intentó otros trucos, desde visiones alimentadas por pesadillas hasta dolor físico básico, pero te mantuviste firme.\nAgotado, o quizás simplemente impresionado por tu resiliencia, el artefacto ha dejado de luchar contra ti y ahora parece contento con servir como tu propio ojo. Sin embargo, sigue siendo un ser sintiente, y puedes sentir que el poder en su interior está muy cerca de tu alcance. Nace una alianza extraña, pero muy provechosa."
 POD_canon_artifacts.302.a: "¡Lo veo todo!"

 eye_of_hazimel_unleashed_modifier: "Ojo de Hazimel desatado"
 eye_of_hazimel_unleashed_modifier_desc: "Tú y el Ojo sois uno. Excepto que él tiene el control la mayor parte del tiempo."
 
 POD_canon_artifacts.303.t: "Plantando el Ojo III"
 POD_canon_artifacts.303.desc: "Hiciste lo mejor que pudiste. E incluso en su triunfo, el Ojo reconoce que eres uno de sus huéspedes con más voluntad y que puedes ser útil. Esta victoria superficial significa que aún conservas un mínimo de libre albedrío, pero el Ojo toma el control cuando le apetece. Y siempre es desagradable para quienes te rodean cuando eso sucede.\nCiertamente, eres más poderoso e intimidante de lo que jamás fuiste, pero el precio fue alto. Lo bueno es que no estás en un estado en el que puedas reflexionar sobre si valió la pena."
 POD_canon_artifacts.303.a: "¡Lo vemos todo!"

 ankaran_sarcophagus_decision: "El Sarcófago de Ankaran"
 ankaran_sarcophagus_decision_tooltip: "¿Qué hay dentro?"
 ankaran_sarcophagus_decision_desc: "Un sentimiento de presentimiento emana de este sarcófago, como si un mal antiguo e innegable estuviera esperando en su interior. O podría ser simplemente una caja vacía. ¿Quién lo sabe?"
 ankaran_sarcophagus_decision_effect_tooltip: "No tienes ni idea de lo que pasará" 
 ankaran_sarcophagus_decision_confirm: "¿Realmente quiero probar mi suerte?"
  
 POD_canon_artifacts.400.t: "El Sarcófago de Ankaran"
 POD_canon_artifacts.400.desc: "Hay algo espeluznante en este sarcófago y no eres el único que lo siente. Muchos vampiros, e incluso otras criaturas, ya han muerto intentando poner sus manos en él, lo que aumenta su creciente reputación. Los murales de la superficie del sarcófago representan figuras bebiendo cuencos de sangre, lo que sugiere alguna forma de vampirismo.\nLos rumores más fantasiosos hablan de un Antediluviano descansando en su interior, prometiendo poder eterno o la condenación a quien lo abra. El artefacto ya es útil de por sí, ya que actúa como una distracción conveniente para tus rivales, pero el atractivo de descubrir sus secretos sigue ahí. ¿Te arriesgarás ante el inmenso peligro potencial por recompensas potencialmente aún mayores?"
 POD_canon_artifacts.400.a: "¡Ábrelo!"
 POD_canon_artifacts.400.b: "No lo abras"
 ankaran_sarcophagus_warning: "Este camino es, obviamente, potencialmente peligroso..."
 
 POD_canon_artifacts.401.t: "El Sarcófago de Ankaran II"
 POD_canon_artifacts.401.desc: "Bueno, eso ha sido un desencanto.\nA pesar de toda la aura de misterio que rodea a este sarcófago, resulta que solo contenía una momia mundana, aunque bien conservada. Probablemente un rey mortal de algún tipo, nadie realmente importante para ti. A pesar de esta decepción, aún puede serte útil, ya que nadie más conoce la verdad. Podrías atrapar el sarcófago para ladrones descuidados en tu dominio o vender el derecho a verlo a eruditos curiosos. O incluso, siendo más audaz, ¡contar la verdad! ...solo a unos pocos aliados de confianza, por supuesto. ¿Cómo aprovecharás este descubrimiento?"
 POD_canon_artifacts.401.a: "Estudiar la momia con mayor detalle"
 POD_canon_artifacts.401.b: "¡Meterle serpientes! Las serpientes son divertidas"
 POD_canon_artifacts.401.c: "Decir la verdad a algunos «amigos» que pronto te estarán agradecidos"
 POD_canon_artifacts.401.d: "Montar una trampa para turistas Cainitas"
 
 #beatific_decision: "Holy Relic"
 #beatific_decision_tooltip: "A present of the Divine at your fingertips"
 #beatific_decision_desc: "You have one of the holiest relics of the Faith at your disposal. Its aura shines bright and gives you extraordinary powers."
 #beatific_decision_confirm: "A gift from the Divine, no doubt"
 murder_prevented_tf_tt: "Este objetivo está demasiado protegido por la Fe Verdadera"   
 
 full_blood_decision: "Reliquia de sangre"
 full_blood_decision_tooltip: "El Ansia es cosa del pasado"
 full_blood_decision_desc: "Tienes en tu posesión uno de los inestimables artefactos capaces de crear sangre lo suficientemente fuerte como para sustentar tu cuerpo no-muerto. Con esto a tu disposición, nunca volverás a pasar hambre."
 full_blood_decision_confirm: "La sangre fluirá"
   
 shemaziel_sarcophagus_decision: "El sarcófago de Shemiazel"
 shemaziel_sarcophagus_decision_tooltip: "¿Qué hay dentro?"
 shemaziel_sarcophagus_decision_desc: "Un sentimiento de presentimiento emana de este sarcófago, como si un mal antiguo e innegable estuviera esperando en su interior. O podría ser simplemente una caja vacía. ¿Quién lo sabe?"
 shemaziel_sarcophagus_decision_effect_tooltip: "No tienes ni idea de lo que pasará" 
 shemaziel_sarcophagus_decision_confirm: "¿Realmente quiero probar mi suerte?"
   
 POD_canon_artifacts.500.t: "El sarcófago de Shemiazel"
 POD_canon_artifacts.500.desc: "Hay algo espeluznante en este sarcófago y no eres el único que lo siente. Muchos vampiros, e incluso otras criaturas, ya han muerto intentando ponerle las manos encima, lo que aumenta su creciente reputación. Está hecho de una piedra negra, quizás obsidiana u ónice, sin tallas visibles ni indicios de su origen.\nLos rumores más fantasiosos hablan de un demonio durmiendo en su interior o incluso de un foso de sacrificios en movimiento lleno de horrores infernales. ¿Te arriesgarás ante el inmenso peligro potencial por recompensas potencialmente aún mayores?"
 POD_canon_artifacts.500.a: "¡Ábrelo!"
 POD_canon_artifacts.500.b: "No lo abras"
 shemaziel_sarcophagus_warning: "Este camino es, obviamente, muy peligroso..."
  
 shemaziel_reborn_modifier: "Shemiazel Renacido"
 shemaziel_reborn_modifier_desc: "¡Salve a Shemiazel, Duque del Orgullo, Profeta de las Vanidades, Pontífice de la Arrogancia y el Desdén!"
  
 POD_canon_artifacts.501.t: "El sarcófago de Shemiazel II"
 POD_canon_artifacts.501.desc: "Vaya, los rumores eran ciertos.\nDentro del sarcófago yace un auténtico Duque del Infierno, uno que se está levantando lentamente hacia ti. Ves imágenes de campos de batalla divinos, prisiones abisales y entidades que jamás comprenderás. Y ves que no eres nada para esta criatura que desgarrará tu alma para reclamar tu cuerpo como huésped. Tu Bestia se acobarda de miedo en tu mente y te cuesta reaccir. ¿Qué puedes hacer contra tal entidad?\nBueno... quizá volver a sellar el sarcófago antes de que sea demasiado tarde y arrojarlo al mar podría funcionar. O simplemente podrías aceptar tu destino infernal."
 POD_canon_artifacts.501.a: "La resistencia es inútil"
 POD_canon_artifacts.501.b: "¡Vuelve a dormir!"
    
 oblivionadvanced_decision: "Reliquia de la muerte"
 oblivionadvanced_decision_tooltip: "Los secretos de la vida y la muerte son tuyos"
 oblivionadvanced_decision_desc: "Tienes una poderosa reliquia nigromántica a tu disposición. Aprovechar su poder te daría un gran conocimiento sobre los asuntos del más allá."
 oblivionadvanced_decision_confirm: "¡La tumba me obedece!"
       
 bloodsorceryadvanced_decision: "Reliquia mágica"
 bloodsorceryadvanced_decision_tooltip: "Los secretos más profundos de la sangre son tuyos"
 bloodsorceryadvanced_decision_desc: "Tienes una poderosa reliquia taumatúrgica a tu disposición. Aprovechar su poder te daría un gran conocimiento sobre los asuntos de la Hechicería de Sangre."
 bloodsorceryadvanced_decision_confirm: "Un despertar sangriento"
       
 auspexadvanced_decision: "Reliquia de la visión"
 auspexadvanced_decision_tooltip: "¡Lo verás todo!"
 auspexadvanced_decision_desc: "Tienes una poderosa reliquia profética a tu disposición. Aprovechar su poder te daría un gran conocimiento sobre la disciplina vampírica $pod_discipline$ de Auspex."
 auspexadvanced_decision_confirm: "Una percepción perfecta"
     
 truefaith_decision: "Artefacto de fe"
 truefaith_decision_tooltip: "La fe es un arma poderosa"
 truefaith_decision_desc: "Tienes un poderoso artefacto sagrado a tu disposición. Aprovechar su poder te daría un gran conocimiento sobre las bendiciones de los fieles."
 truefaith_decision_confirm: "Bendecido por lo Divino"
     
 obfuscate_decision: "Artefacto sombrío"
 obfuscate_decision_tooltip: "Nos adentramos en la oscuridad"
 obfuscate_decision_desc: "Tienes un poderoso artefacto a tu disposición. Aprovechar su poder te daría un gran conocimiento sobre la disciplina vampírica $pod_discipline$ de Ofuscación."
 obfuscate_decision_confirm: "Tanto que ocultar..."
     
 auspex_decision: "Artefacto de la visión"
 auspex_decision_tooltip: "Lo verás todo"
 auspex_decision_desc: "Tienes un poderoso artefacto profético a tu disposición. Aprovechar su poder te daría un gran conocimiento sobre la disciplina vampírica $pod_discipline$ de Auspex."
