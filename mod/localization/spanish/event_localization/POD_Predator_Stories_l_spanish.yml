l_spanish:

 #Multi Use
 POD_predatorstories_artifact: "[newly_created_artifact.GetName]"
 POD_predatorstories_beast_takeover_tooltip: "Tu Bestia en frenesí te llevará a un lugar seguro"

 vampire_attacks_on_domain_modifier: "Señorío bajo ataque de Vampiros"
 weak_fae_curse_modifier: "Maldición débil de las hadas"
 strong_fae_curse_modifier: "Maldición fuerte de las hadas"
 drunkard_intoxicated_modifier: "Sentirse de maravilla"
 intoxicated_modifier: "Sentirse embriagado"

 #Victim fights back
 POD_predatorstories.1010.t: "Mortal engreído"
 POD_predatorstories.1010.bloodleech.t: "Presa engreída"
 POD_predatorstories.1010.desc: "Es raro que el objetivo de una alimentación vampírica sea capaz de defenderse. Los colmillos perforando la piel de alguien provocan una sensación de éxtasis (conocida como «el beso») que vuelve dóciles a la mayoría de las víctimas. Obviamente siempre existen excepciones, ya sea por una Fuerza de Voluntad especialmente fuerte o por una intervención externa que rompa el trance.\nEsta noche es uno de esos raros casos: tu posible víctima está intentando resistirse. Aunque no representa una amenaza real para alguien de tu poder, sus gritos de ayuda podrían atraer el tipo de atención equivocado."
 POD_predatorstories.1010.a: "Silencialos"
 POD_predatorstories.1010.c: "No valen la pena"
 
 POD_predatorstories.1010.a.success: "Silenciado"
 POD_predatorstories.1010.a.success.toast: "Nunca tuvieron una oportunidad"
 POD_predatorstories.1010.a.failure: "¡Deja de gritar!"
 POD_predatorstories.1010.a.failure.toast: "¡¿Frustrado por un mortal?!"
 POD_predatorstories.1010.b.failure.toast: "Vergonzoso..."
 
 #Victim is a hunter
 POD_predatorstories.1020.t: "Presa acechante"
 POD_predatorstories.1020.desc: "Es solo otra noche y otra víctima de la que extraer sangre... hasta que te das cuenta de que son otras personas escondidas en las sombras. Resulta que tu «víctima» estaba preparada para ti, probablemente parte de una banda local de cazadores que estudiaron tus hábitos de alimentación.\nPor suerte, detectaste su emboscada antes de que la situación se volviera realmente grave, dejándote tiempo suficiente para reaccionar. Aun así, una lucha prolongada podría llevar a la exposición de tu verdadera naturaleza ante un público más amplio de lo que te convendría." 
 
 POD_predatorstories.1020.a.success.toast: "Nunca aprenden"
 POD_predatorstories.1020.a.failure.toast: "¡Maldito seas!"
 
 #Victim is a vampire
 POD_predatorstories.1030.t: "Cuatro Colmillos"
 POD_predatorstories.1030.desc: "Has estado rastreando a tu presa para satisfacer tu necesidad de sangre nocturna durante un tiempo. Son especialmente cautelosos, casi como si supieran manejar la noche tan bien como tú, y esto ha despertado tu curiosidad.\nTras un tiempo en este juego, tu «presa» finalmente te acorrala, revelándose como un vampiro. Pensaban que los estabas rastreando para una potencial Diablerie y, comprensiblemente, desconfían de tu explicación sobre este malentendido."
 POD_predatorstories.1030.a: "Intentar resolver la situación pacíficamente"
 POD_predatorstories.1030.c: "Ignóralos"
 
 POD_predatorstories.1030.a.success: "Logras calmar la situación"
 POD_predatorstories.1030.a.success.toast: "Pacificado"
 POD_predatorstories.1030.a.failure: "No logras calmar la situación"
 POD_predatorstories.1030.a.failure.tooltip: "Los colmillos tendrán que bastar"
 
 POD_predatorstories.1030.b.failure: "Te derrotan"
 POD_predatorstories.1030.b.failure.toast: "Patético espectáculo"
 
 POD_predatorstories.1031.t: "Situación escalada"
 POD_predatorstories.1031.desc: "Tu explicación solo ha aumentado sus sospechas sobre tus intenciones. Mientras te frustras ante este callejón sin salida, de repente notas un destello en sus ojos. Se están preparando para atacarte.\nAunque no deberían representar una gran amenaza para tu poder, siguen siendo vampiros y podrían causarte un daño vergonzoso si no tienes cuidado. Mejor termina esto rápido."
 POD_predatorstories.1031.a: "¡Necio!"
 
 POD_predatorstories.1031.a.success: "Los vences"
 POD_predatorstories.1031.a.success.toast: "Los colmillos han prevalecido"
 POD_predatorstories.1031.a.failure: "Demasiado cerca"
 POD_predatorstories.1031.a.failure.toast: "¡Casi te atrapan!"
 
 #Adult witness
 POD_predatorstories.1040.t: "Testigo de la agresión"
 POD_predatorstories.1040.desc: "Alimentarse de mortales puede volverse algo rutinario con el tiempo. A pesar de ser un experto en esto, la falta de emoción en la caza puede provocar algún incidente vergonzoso. Esta noche es uno de esos casos: notas por el rabillo del ojo a un mortal con aspecto aterrado que te ha sorprendido mientras terminabas de drenar a tu víctima."
 POD_predatorstories.1040.a: "Déjalos en paz"
 POD_predatorstories.1040.c: "#beast Los muertos no cuentan historias#!"
 POD_predatorstories.1040.d: "Tengo el poder adecuado"
 POD_predatorstories.1040.d.tooltip: "Claramente habían bebido demasiado."
 POD_predatorstories.1040.e: "No hablarán de esto a nadie"
 POD_predatorstories.1040.e.tooltip: "Nunca te vieron. De hecho, nunca estuvieron aquí."
 
 POD_predatorstories.1040.a.toast: "¡Un monstruo!"
 POD_predatorstories.1040.b.toast: "¡Un demonio!"
 
 #Child witness
 POD_predatorstories.1050.t: "Cuidado nocturno"
 POD_predatorstories.1050.desc: "Alimentarse de mortales puede volverse algo rutinario con el tiempo. A pesar de ser un experto en esto, la falta de emoción en la caza puede provocar algún incidente vergonzoso. Esta noche es uno de esos casos: notas por el rabillo del ojo a un niño con aspecto aterrado que te ha sorprendido mientras terminabas de drenar a tu víctima."
 POD_predatorstories.1050.c: "#beast El monstruo debajo de la cama es real#!"
 POD_predatorstories.1050.d.tooltip: "Solo una pesadilla"
 
 #Hunter interference
 POD_predatorstories.1060.t: "Interferencia de Cazadores"
 POD_predatorstories.1060.desc: "Debido a algunos vampiros descuidados en la zona, un grupo de jóvenes locales ha formado una especie de milicia de Cazadores que busca a los «monstruos» que acechan a su comunidad durante la noche. Aunque representan una amenaza leve, siguen siendo un estorbo con el que lidiar cuando sales de caza."
 POD_predatorstories.1060.a: "Intentas eludirles y conseguir tu presa"
 POD_predatorstories.1060.a.tooltip: "Eres solo una sombra y consigues tu presa"
 POD_predatorstories.1060.b: "Abandonar la caza"
 
 POD_predatorstories.1060.a.success: "No ven nada"
 POD_predatorstories.1060.a.success.toast: "Silencioso como la muerte"
 POD_predatorstories.1060.a.failure: "¡Te han visto!"
 POD_predatorstories.1060.a.failure.tooltip: "Donde el sigilo falla... los colmillos tendrán que servir"
 POD_predatorstories.1060.a.failure.success.toast: "Vences al Cazador pero tu presa ha escapado"
 POD_predatorstories.1060.a.failure.failure.toast: "¡Casi te matan!"
 
 POD_predatorstories.1061.t: "!"
 POD_predatorstories.1061.desc: "A pesar de tus esfuerzos, este grupo de cazadores locales inadaptados te ha visto antes de que pudieras drenar por completo a tu víctima. Mientras corren hacia ti gritando por refuerzos, te das cuenta rápidamente de que tendrás que lidiar con ellos pronto o te arriesgas a que esto se prolongue durante un tiempo incómodo."
 POD_predatorstories.1061.a: "Bienvenido a tu última caza"
 POD_predatorstories.1061.a.success: "Rápido y eficiente"
 POD_predatorstories.1061.a.success.toast: "Nunca aprenden"
 POD_predatorstories.1061.a.failure: "Lento y desastroso"
 POD_predatorstories.1061.a.failure.toast: "Menudo desastre"
 
 #Vampire poaches prey
 POD_predatorstories.1070.t: "Poacher no-muerto"
 POD_predatorstories.1070.desc: "Como señor de tu dominio, esperas que los recién llegados se presenten ante ti antes de cazar en tus zonas de alimentación. Aunque la mayoría tiene el sentido común de hacerlo, siempre hay algunos necios arrogantes (o idiotas) que creen que pueden ignorarte.\nSe ha avistado a un malhechor y has decidido lidiar con él tú mismo, inculcando algo de buena educación a ese cráneo duro de intruso."
 POD_predatorstories.1070.a: "Aprende tu lugar"
 POD_predatorstories.1070.b: "Je, no me importa"
 
 POD_predatorstories.1070.a.success: "Puedes arrodillarte"
 POD_predatorstories.1070.a.success.toast: "Arrodíllate más bajo"
 POD_predatorstories.1070.a.failure: "¡Cómo te atreves!"
 POD_predatorstories.1070.a.failure.toast: "¡Cómo se atreven!"
 
 #Victim wants to be lover
 POD_predatorstories.1080.t: "Romance crepuscular"
 POD_predatorstories.1080.desc: "Mientras buscas sangre, la opción más fácil a veces es usar a los mismos mortales. El acto de alimentarse (el «Beso») es sumamente placentero para ellos y muchos no querrían nada más que experimentarlo de vuelta.\nUno de esos mortales ha sido tu objetivo durante algún tiempo y se ha quedado casi cautivado por la necesidad de complacerte. Podría ser un dócil acompañante de cama si eso es lo que buscas."
 POD_predatorstories.1080.a: "Ven a mi salón..."
 POD_predatorstories.1080.b: "¡Ni hablar!"
 POD_predatorstories.1080.c: "#beast Acércate...r#!"
 
 #Victim has gold (Not a gift)
 POD_predatorstories.1090.t: "Oro de presa"
 POD_predatorstories.1090.desc: "Esta noche de caza ha sido tranquila para ti, excepto por un pequeño detalle. Tu víctima llevaba una cantidad de oro sorprendentemente grande. Sería un juego de niños quitárselo, pero ¿estás tú, una poderosa criatura de la noche, empezando realmente a recurrir al robo común?"
 POD_predatorstories.1090.a: "Sí, lo estoy"
 POD_predatorstories.1090.b: "¡Eso sería un pecado!"
 POD_predatorstories.1090.c: "Estoy por encima de eso"
 
 #Victim has artifact (Not a gift)
 POD_predatorstories.1100.t: "Cosas brillantes"
 POD_predatorstories.1100.desc: "Esta noche de caza ha sido tranquila para ti, excepto por un pequeño detalle. Tu víctima llevaba una baratija sorprendentemente cara. Sería un juego de niños quitárselo, pero ¿estás tú, una poderosa criatura de la noche, empezando realmente a recurrir al robo común?"
 POD_predatorstories.1100.a: "Huelo el dinero"
 POD_predatorstories.1100.b: "Una nueva decoración para la pared"
 POD_predatorstories.1100.c: "[newly_created_artifact.GetName] será útil"
 
 #Victim has gold (Gift)
 POD_predatorstories.1110.t: "Regalo sangriento"
 POD_predatorstories.1110.desc: "Has estado cultivando a los mortales que forman tu preferencia habitual de alimentación durante un tiempo. La mayoría de ellos ya están bien cautivados, viéndote como un patrón al que complacer o incluso como una figura divina. Esto ha dado sus frutos recientemente, ya que uno de ellos te presenta un regalo, con la esperanza de complacerte con esta humilde ofrenda."
 POD_predatorstories.1110.a: "«Humilde», en efecto"
 POD_predatorstories.1110.b: "Esto es casi insultante"
 POD_predatorstories.1110.c: "Estoy por encima de tales preocupaciones materiales"
 
 #Victim has artifact (Gift)
 POD_predatorstories.1120.a: "Véndelo"
 POD_predatorstories.1120.b: "Exhíbelo"
 POD_predatorstories.1120.d: "Podría ser útil"
 
 #The victim dies during the feeding
 POD_predatorstories.1130.t: "Frenesí de alimentación"
 POD_predatorstories.1130.desc: "Alimentarse es una sensación intensamente placentera para los vampiros. La sangre es su vida y la tentación de tomar solo un poco más siempre está ahí. Incluso el más educado de los hijos de Caín no siempre puede resistir su naturaleza básica. Cuando esto ocurre, a menudo es demasiado tarde antes de que el vampiro recupere el control de sus sentidos y se encuentre con una víctima muerta en sus brazos, despojada hasta la última gota de sangre."
 POD_predatorstories_conscious.1130.a: "¿Qué he hecho?"
 POD_predatorstories_conviction.1130.a: "¿Y qué?"
 
 #The victim is very ill
 POD_predatorstories.1140.t: "Vampiros de la peste"
 POD_predatorstories.1140.desc: "Las enfermedades mortales no les hacen mucho a los vampiros, aparte de hacer que la experiencia de alimentarse sea menos placentera. En el peor de los casos, pueden convertirse en portadores de la enfermedad y propagarla a otros mortales durante su alimentación, pero ellos mismos no se ven afectados.\nAun así, al notar que tu víctima muestra signos de enfermedad, te planteas tu siguiente movimiento. Extraerle más sangre probablemente causaría su muerte."
 POD_predatorstories.1140.a: "Déjalos en paz"
 POD_predatorstories.1140.b: "Puedo ayudarlos"
 POD_predatorstories.1140.c: "Usar el poder de Valeren para curarlos"
 POD_predatorstories.1140.d: "Me alimentaré con cuidado"
 POD_predatorstories.1140.e: "#beast ¡Exijo más sangre!#!"
 POD_predatorstories.1140.f: "Convertirlos en Ghoul y alimentarse"
 
 POD_predatorstories.1140.d.toast: "Probablemente morirán pronto por tu culpa"
 
 #Victim Flees
 POD_predatorstories.1150.t: "Ratón asustado"
 POD_predatorstories.1150.desc: "A veces los mortales te sorprenden. Mientras elegías un objetivo para tu caza de esta noche, uno de ellos notó algo en tus ojos (¿quizás el miedo instintivo de la presa ante un depredador?) y salió disparado hacia una salida. Podría ser divertido perseguirlo."
 POD_predatorstories.1150.a: "Corre mientras puedas..."
 POD_predatorstories.1150.c: "Deja en paz al mortal asustado."
 
 POD_predatorstories.1151.t: "Ratón acorralado"
 POD_predatorstories.1151.desc: "Con tu velocidad sobrenatural, el mortal no tuvo ninguna oportunidad. Ahora te suplica la vida ahora que lo has alcanzado. No es que importe realmente, ya que está totalmente a tu merced."
 POD_predatorstories.1151.a: "Perdónalos"
 POD_predatorstories.1151.c: "Sangre aterrada..."
 POD_predatorstories.1151.e: "La caza ha terminado"
 
 POD_predatorstories.1151.a.toast: "Muestras misericordia a pesar del riesgo para la Mascarada"
 POD_predatorstories.1151.c.toast: "Muestras misericordia tras alimentarte a pesar del riesgo para la Mascarada"
 
 POD_predatorstories.1152.desc: "Con tu velocidad sobrenatural, el mortal no tuvo ninguna oportunidad. No es consciente de que lo has alcanzado y ahora intenta recuperar el aliento pensando que está a salvo. No es que importe realmente ahora, ya que está totalmente a tu merced."
 
 #Victim needs gold to clear debts
 POD_predatorstories.1160.t: "Oro rojo"
 POD_predatorstories_consensualist.1160.desc: "Trabajar con mortales dispuestos a darte su sangre tiene varias ventajas para aquellos vampiros que no buscan la emoción de la caza. Aun así, también plantea problemas únicos, como tener que cuidar de su bienestar para que estén en condiciones de seguir ayudándote.\nUno de tus donantes de sangre consensuados tiene graves problemas financieros. Si no lo ayudas, está destinado a acabar golpeado o quizás algo peor, lo que podría sacarlo de tu red, tal vez para siempre."
 POD_predatorstories_familias.1160.desc: "Trabajar con mortales dispuestos a darte su sangre tiene varias ventajas para aquellos vampiros que no buscan la emoción de la caza. Aun así, también plantea problemas únicos, como tener que cuidar de su bienestar para que estén en condiciones de seguir ayudándote.\nUna de las familias de las que te alimentas tiene graves problemas financieros. Si no los ayudas, están destinados a acabar golpeados o quizás algo peor, lo que podría sacarlos de tu red, tal vez para siempre."
 POD_predatorstories_cultist.1160.desc: "Trabajar con mortales dispuestos a darte su sangre tiene varias ventajas para aquellos vampiros que no buscan la emoción de la caza. Aun así, también plantea problemas únicos, como tener que cuidar de su bienestar para que estén en condiciones de seguir ayudándote.\nUno de los miembros de tu culto tiene graves problemas financieros. Si no lo ayudas, está destinado a acabar golpeado o quizás algo peor, lo que podría sacarlo de tu red, tal vez para siempre."
 POD_predatorstories.1160.a: "Soy un patrón generoso."
 POD_predatorstories.1160.b: "¡Soluciona tus propios problemas!"
 POD_predatorstories.1160.c: "Creo que conozco a tus acreedores..."
 POD_predatorstories.1160.d: "Se olvidarán del asunto." 
 POD_predatorstories.1160.e: "Es hora de cambiar de apariencia."
 POD_predatorstories.1160.f: "Yo lo arreglaré todo."
 POD_predatorstories.1160.g: "Es hora de que sangren."
 
 #Victim hires or performs attempted exorcism on vampire
 POD_predatorstories.1170.t: "Demonio con colmillos"
 POD_predatorstories.1170.desc: "Aunque la mayoría de los mortales pueden comprender instintivamente que no eres uno de ellos, pocos pueden entender realmente qué eres en realidad. Como tal, muchos recurren a la categorización bastante amplia de «demonio»... lo que significa que te divierte más de lo que te sorprende oír que algunos aspirantes a exorcistas te están buscando. No es una gran preocupación por sí misma, pero siempre existe el riesgo de que estos bufones atraigan la atención de cazadores más experimentados y peligrosos."
 POD_predatorstories.1170.a: "Los rumores son inofensivos."
 POD_predatorstories.1170.b: "¡Exorciza eso!"
 POD_predatorstories.1170.c: "Hacer que lo olvide."
 
 #Vampire attacks on your cult/family/consensual partners
 POD_predatorstories.1180.t: "Protegiendo a tu Rebaño"
 POD_predatorstories.1180.desc: "La mayoría de los vampiros respetan tu autoridad y saben que tu [POD_herd|E] es estrictamente intocable. Sin embargo, «la mayoría» no significa todos. Un malandrín ha tomado sangre de tus mortales recientemente, ya sea por desafío o por idiotez. Hay que dar un ejemplo."
 POD_predatorstories.1180.a: "Hay sangre de sobra para todos."
 POD_predatorstories.1180.b: "¡Cómo se atreven!"
 POD_predatorstories.1180.c: "Destruiré su mente."
 
 POD_predatorstories.1180.b.success: "Se ha hecho justicia"
 POD_predatorstories.1180.b.failure: "¡Escaparon!"
 
 #Mortal interference
 POD_predatorstories.1191.t: "Interferencia mortal"
 POD_predatorstories_alleycat.1191.desc: "Mientras rondas en busca de sangre, desafortunadamente has sido visto y posteriormente detenido por la voz de uno de los patrulleros nocturnos. «¡Oye! Tú, ¿qué haces fuera a estas horas de la noche? Te lo diré, te dejaré pasar con una advertencia si haces una donación al fondo de...» hace una pausa y se aclara la garganta «...protección»."
 POD_predatorstories_bedlamite.1191.desc: "Mientras rondas en busca de sangre en el manicomio, desafortunadamente has sido visto y posteriormente detenido por la voz de uno de los empleados del manicomio acompañado de guardias. «Están invadiendo las instalaciones del manicomio, retíralos». Los guardias te miran con amenaza mientras sus manos se dirigen hacia la empuñadura de sus armas." 
 POD_predatorstories_cauchemar.1191.desc: "Mientras rondas en busca de sangre, desafortunadamente has sido visto y posteriormente detenido por la voz de uno de los patrulleros nocturnos. «¡Oye! Tú, ¿qué haces fuera a estas horas de la noche? Te lo diré, te dejaré pasar con una advertencia si haces una donación al fondo de...» hace una pausa y se aclara la garganta «...protección»."
 POD_predatorstories_cenobite.1191.desc: "Mientras rondas en busca de sangre en el monasterio, desafortunadamente has sido visto y posteriormente detenido por la voz de uno de los habitantes del monasterio acompañado de guardias. «Están invadiendo las instalaciones del monasterio, por favor, retíralos de este lugar sagrado». Los guardias te miran con amenaza mientras sus manos se dirigen hacia la empuñadura de sus armas."
 POD_predatorstories_footpad.1191.desc: "Mientras rondas en busca de sangre, desafortunadamente has sido visto y posteriormente detenido por la voz de uno de los patrulleros nocturnos. «¡Oye! Tú, ¿qué haces fuera a estas horas de la noche? Te lo diré, te dejaré pasar con una advertencia si haces una donación al fondo de...» hace una pausa y se aclara la garganta «...protección»."
 POD_predatorstories_gentry.1191.desc: "Mientras rondas en busca de sangre en un evento privado de la aristocracia, un par de guardaespaldas parecen creer que te has colado en el evento y han avanzado para bloquear tu camino. uno de los guardias habla: «Este es un evento privado de los señores, presente su invitación o será expulsado por la fuerza»." 
 POD_predatorstories_graverobber.1191.desc: "Mientras rondas en busca de sangre en el cementerio, desafortunadamente has sido visto y posteriormente detenido por la voz del sepulturero acompañado de vigilantes nocturnos. «Están profanando este cementerio a estas horas, arrestenlos». Los vigilantes nocturnos te miran con amenaza mientras sus manos se dirigen hacia la empuñadura de sus armas."
 POD_predatorstories_phlebotomist.1191.desc: "Mientras rondas en busca de sangre en el hospital, desafortunadamente has sido visto y posteriormente detenido por la voz de uno de los empleados del hospital acompañado de guardias. «Están invadiendo las instalaciones del hospital, retírenlos». Los guardias te miran con amenaza mientras sus manos se dirigen hacia la empuñadura de sus armas."
 POD_predatorstories_siren.1191.desc: "Parece que el señor del crimen local se ha interesado en tus actividades aparentemente amorosas; ya que, mientras rondabas en busca de sangre en la bulliciosa taberna local, has sido detenido por la voz de uno de un par de matones: «Oye, preciosa, esta taberna y todo lo que hay en ella es propiedad del jefe, paga o recibe una buena paliza»." 
 POD_predatorstories_farmer.1191.desc: "Acechando en busca de sangre, desafortunadamente has sido avistado y posteriormente detenido por la voz de uno de los miembros de una patrulla de la guardia del rey. «¡Alto, campesino simplón! Por desafiar las leyes de caza establecidas por nuestro señorío, se te condena por la presente a pagar una multa o sufrir prisión»."
 POD_predatorstories_alleycat.1191.a: "Conozco personalmente al capitán de la guardia nocturna."
 POD_predatorstories_bedlamite.1191.a: "¡Soy un nuevo boticario!"
 POD_predatorstories_cenobite.1191.a: "¡Estoy aquí para probar el vino del monasterio!"
 POD_predatorstories_gentry.1191.a: "¿Sabes quién soy?"
 POD_predatorstories_siren.1191.a: "Puedo causar muchos problemas a tu jefe..."
 POD_predatorstories_farmer.1191.a: "Soy buen amigo de su señoría."
 POD_predatorstories.1191.b: "Luchar para pasar a través de ellos"
 POD_predatorstories.1191.b.success: "Los vences"
 POD_predatorstories.1191.b.success.toast: "Lograste abrirte paso entre los mortales sin sufrir daños"
 POD_predatorstories.1191.b.failure: "Te derrotan"
 POD_predatorstories.1191.b.failure.toast: "Resultas herido por los mortales, pero lograste escapar"
 POD_predatorstories.1191.c: "Puedo pagarte para que mires hacia otro lado."
 POD_predatorstories.1191.d: "Solo me iba."
 POD_predatorstories.1191.e: "Distráelos con una ilusión."
 
 POD_predatorstories.1192.t: "Sangre sigilosa"
 POD_predatorstories.1192.desc: "Ya sea manteniéndote oculto o utilizando la identidad de otra persona, estás preparado y listo para alimentarte de tu presa sin problemas."
 POD_predatorstories.1192.a: "Beber"
 POD_predatorstories.1192.b: "Beber hasta matarlos"
 
 POD_predatorstories.1193.t: "Atención no deseada"
 POD_predatorstories_alleycat.1193.desc: "La desafortunada maldición que marca tu rostro hace que sea difícil pasar por un mortal. Como tal, sus reacciones al encontrarte en un lugar donde no deberías estar suelen ser agresivas.\nAcechando en busca de sangre, desafortunadamente has sido avistado por una patrulla de la guardia nocturna. Al creer que eres algo así como un monstruo o quizás una Bestia feral, los guardias nocturnos avanzan para atacar."
 POD_predatorstories_bedlamite.1193.desc: "La desafortunada maldición que marca tu rostro hace que sea difícil pasar por un mortal. Como tal, sus reacciones al encontrarte en un lugar donde no deberías estar suelen ser agresivas.\n«Mientras acechabas en busca de sangre en el manicomio, desafortunadamente has sido avistado por uno de los empleados que ha traído guardias con él. Al creer que eres algo así como un monstruo o quizás una Bestia feral, los guardias avanzan para atacar." 
 POD_predatorstories_cauchemar.1193.desc: "La desafortunada maldición que marca tu rostro hace que sea difícil pasar por un mortal. Como tal, sus reacciones al encontrarte en un lugar donde no deberías estar suelen ser agresivas.\nAcechando en busca de sangre, desafortunadamente has sido avistado por una patrulla de la guardia nocturna. Al creer que eres algo así como un monstruo o quizás una Bestia feral, los guardias nocturnos avanzan para atacar."
 POD_predatorstories_cenobite.1193.desc: "La desafortunada maldición que marca tu rostro hace que sea difícil pasar por un mortal. Como tal, sus reacciones al encontrarte en un lugar donde no deberías estar suelen ser agresivas.\nMientras acechabas en busca de sangre en el monasterio, desafortunadamente has sido avistado por uno de los habitantes del monasterio que ha traído guardias con él. Al creer que eres algo así como un monstruo o quizás una Bestia feral, los guardias avanzan para atacar."
 POD_predatorstories_footpad.1193.desc: "La desafortunada maldición que marca tu rostro hace que sea difícil pasar por un mortal. Como tal, sus reacciones al encontrarte en un lugar donde no deberías estar suelen ser agresivas.\nAcechando en busca de sangre, desafortunadamente has sido avistado por una patrulla de la guardia nocturna. Al creer que eres algo así como un monstruo o quizás una Bestia feral, los guardias nocturnos avanzan para atacar."
 POD_predatorstories_graverobber.1193.desc: "La desafortunada maldición que marca tu rostro hace que sea difícil pasar por un mortal. Como tal, sus reacciones al encontrarte en un lugar donde no deberías estar suelen ser agresivas.\nMientras acechabas en busca de sangre en el cementerio, desafortunadamente has sido avistado por el guardián del cementerio que ha traído guardias nocturnos con él. Al creer que eres algo así como un monstruo o quizás una Bestia feral, los guardias nocturnos avanzan para atacar."
 POD_predatorstories_farmer.1193.desc: "La desafortunada maldición que marca tu rostro hace que sea difícil pasar por un mortal. Como tal, sus reacciones al encontrarte en un lugar donde no deberías estar suelen ser agresivas.\nAcechando en busca de sangre, desafortunadamente has sido avistado por una patrulla de la guardia. Al creer que eres algo así como un monstruo o quizás una Bestia feral, los guardias avanzan para atacar."
 POD_predatorstories_invalid_feeding_type.1193.desc: "Este tipo de alimentación no es válido para ti. No deberías tener este tipo de alimentación con tu apariencia (es probable que seas una Gárgola o un Nosferatu)"
 POD_predatorstories.1193.a: "Luchar para pasar a través de ellos"
 POD_predatorstories.1193.a.success: "Los vences"
 POD_predatorstories.1193.a.success.toast: "Lograste abrirte paso entre los mortales sin sufrir daños"
 POD_predatorstories.1193.a.failure: "Te derrotan"
 POD_predatorstories.1193.a.failure.toast: "Resultas herido por los mortales, pero lograste escapar"
 POD_predatorstories.1193.b: "Deja que la Bestia tome el control"
 POD_predatorstories.1193.c: "Distráelos con una ilusión"
 
 #Family member would like a wife
 POD_predatorstories.1200.t: "Casamentero"
 POD_predatorstories.1200.desc: "Uno de los miembros de la familia de los que te alimentas desearía fervientemente casarse. Sin embargo, carece del oro necesario para pagar la dote. Como patrón no declarado de su gente, recurre a ti en busca de ayuda.\nTener que escuchar peticiones triviales como esta es uno de los inconvenientes de alimentarse de un [POD_herd|E] que lo sabe todo, pero al menos nadie te obliga a aceptar."
 POD_predatorstories.1200.a: "¿Seré invitado?"
 POD_predatorstories.1200.b: "¡¿Quién crees que soy?!"
 POD_predatorstories.1200.c: "Conozco a alguien lo suficientemente desesperado"
 
 #Family member would like vampire to take child as ward
 POD_predatorstories.1210.t: "Guardián no-muerto"
 POD_predatorstories.1210.desc: "Dado que tu método de alimentación preferido es actuar como patrón de una familia, para ellos eres una persona rica e influyente. Aunque la mayoría de las veces no comprenden qué eres en realidad, siguen pensando que eres algo superior a ellos, algo a lo que aspirar. Como tal, uno de tus miembros familiares elegidos te ha preguntado si aceptarías a su hijo como pupilo."
 POD_predatorstories.1210.a: "Los criaré"
 POD_predatorstories.1210.b: "No tengo tiempo"
 
 #Victim tries to cure you of vampirism with a potion
 POD_predatorstories.1220.t: "Garantizado que funciona"
 POD_predatorstories.1220.desc: "Un miembro de tu [POD_herd|E] se acerca a ti con una propuesta extraña. Han comprado una poción que creen que te curará del vampirismo. La noción es obviamente ridícula, pero parecen bastante orgullosos de sí mismos por adquirir tal «cura milagrosa». Quizás podrías darles el gusto."
 POD_predatorstories.1220.a: "Beberla"
 POD_predatorstories.1220.b: "No beberla"
 
 POD_predatorstories.1220.a.success.toast: "Solo agua"
 POD_predatorstories.1220.a.failure.toast: "¡¿Agua bendita?!"
 
 #Consensualist needs more convincing
 POD_predatorstories.1230.t: "Acto de persuasión"
 POD_predatorstories.1230.desc: "Como prefieres a las víctimas que consienten para tus necesidades de sangre, a veces tienes que lidiar con personas que no están especialmente dispuestas a compartir su sangre con un monstruo inmortal. Esto significa que tienes que ser creativo, o al menos lo suficientemente persuasivo, para convencerles de que lo hagan."
 POD_predatorstories.1230.a: "Respetar sus deseos"
 POD_predatorstories.1230.b: "Hacer un trato"
 POD_predatorstories.1230.c: "Hacer un buen trato"
 POD_predatorstories.1230.d: "Cambiarles de opinión"
 POD_predatorstories.1230.e: "Encantarles para que cambien de opinión"
 
 #Victim spouts prophecy
 POD_predatorstories.1240.t: "Tonterías proféticas"
 POD_predatorstories.1240.desc: "Los vampiros son criaturas supersticiosas por naturaleza y a menudo ven profecías en todas partes donde miran. Te han inquietado los recientes desvaríos de un mortal del que bebes. Parecían tonterías y tu corte te asegura que te preocupas por nada. Así que, claramente, estás fuera de peligro...\n...pero ¿y si no es así?"
 POD_predatorstories.1240.a: "Tal vez..."
 POD_predatorstories.1240.b: "Qué va, solo son tonterías."
  
 #Victim has true faith
 POD_predatorstories.1250.t: "Fiel creyente"
 POD_predatorstories.1250.desc: "Sentiste que algo iba mal con este mortal en cuanto te acercaste para beber su sangre. Se manifestó principalmente como una sensación de inquietud que crecía a medida que te aproximabas. Sin embargo, al empezar a beber de él, comprendiste la peligrosa verdad.\nEste mortal es un fiel creyente y su fe inquebrantable ahora te quema por dentro. Retraes rápidamente tus colmillos y retrocedes para reevaluar la situación."
 POD_predatorstories.1250.a: "¡Mátalos!"
 POD_predatorstories.1250.b: "¡Corre!"
 POD_predatorstories.1250.c: "No hablarán de esto."
 
 #Awoken sleeping vampire
 POD_predatorstories.1260.t: "Etiqueta de los chupasangres"
 POD_predatorstories.1260.desc: "Esta noche ha surgido una situación inusual mientras bebías de un mortal. Has notado que ya estaba algo agotado y rápidamente has comprendido la razón: otro vampiro se ha alimentado de él recientemente.\nEsto es un incumplimiento de la etiqueta, aunque no intencionado, y quizá quieras calmar la situación oficialmente."
 POD_predatorstories.1260.a: "Intentar resolver la situación pacíficamente"
 POD_predatorstories.1260.b: "Intimidarles"
 POD_predatorstories.1260.c: "Ignóralos"
 
 POD_predatorstories.1260.a.success: "Logras calmar la situación"
 POD_predatorstories.1260.a.success.toast: "Se unen a tu corte"
 POD_predatorstories.1260.a.failure: "No logras calmar la situación"
 
 POD_predatorstories.1260.b.success: "Intimidado"
 POD_predatorstories.1260.b.success.toast: "Son inferiores"
 POD_predatorstories.1260.b.failure: "Sin doblegar"
 POD_predatorstories.1260.b.failure.toast: "Permanecen desafiantes"
 
 #POD_predatorstories.1261.t: "Escalated situation"
 #POD_predatorstories.1261.desc: "Your words have provoked them further, prepare to fight."
 #POD_predatorstories.1261.a: "Fight"
 #
 #POD_predatorstories.1261.a.success: "You defeat them"
 #POD_predatorstories.1261.a.success.toast: "Where words have failed fangs have prevailed"
 #POD_predatorstories.1261.a.failure: "They defeat you"
 #POD_predatorstories.1261.a.failure.toast: "They almost killed you!"
 
 #Vampire makes an ettiquette blunder around the gentry 
 POD_predatorstories.1270.t: "Desliz"
 POD_predatorstories.1270.desc: "Alimentarse de la alta sociedad significa que tienes que mezclarte con ellos, lo cual no siempre es el asunto más interesante. Las costumbres y la etiqueta de los mortales se mueven a una velocidad vertiginosa para los vampiros, y este tipo de compañía no olvida fácilmente un error.\nLamentablemente, has cometido tal error esta noche y te estás convirtiendo rápidamente en el hazmerreír de la fiesta. Si tan solo pudieras mostrarles quién eres en realidad..."
 POD_predatorstories.1270.a: "Mantén la calma..."
 POD_predatorstories.1270.b: "Estoy seguro de que puedo salvar algo de esto."
 POD_predatorstories.1270.c: "Solo era una broma, por supuesto."
 
 #Invited to an invite only event by gentry victim
 POD_predatorstories.1280.t: "Invitación a un evento exclusivo"
 POD_predatorstories.1280.desc: "Alimentarse de la alta sociedad significa que tienes entradas para algunos eventos bastante exclusivos. Algunos socialites incluso consideran tu participación en tales eventos como un signo de estatus social, ya que eres muy misterioso e intrigante. No es que te importe realmente lo que piense un grupo de mortales pomposos, pero podría sentarte bien hacer acto de presencia."
 POD_predatorstories.1280.a: "El placer es todo suyo."
 POD_predatorstories.1280.b: "No me molesto."
 
 #Cultist starts to doubt vampires divinity
 POD_predatorstories.1290.t: "Dudas divinas"
 POD_predatorstories.1290.desc: "Como utilizas a un culto para obtener tu suministro de mortales dispuestos a alimentarte, tienes que representar el papel de ser divino ante ellos. Aunque la mayoría de las veces es relativamente fácil hacerlo (después de todo, tienes acceso a poderes impresionantes), a veces tu rebaño pide demostraciones más llamativas e impactantes. Algunos poderes, como las manifestaciones superiores de Presencia o Serpentis, están especialmente diseñados para engañar a los mortales crédulos."
 POD_predatorstories.1290.a: "¡No te atrevas a dudar de mí!"
 POD_predatorstories.1290.b: "Mi presencia es divina."
 POD_predatorstories.1290.c: "Visto las caras de los Dioses."
 
 #Cultist requires healing
 POD_predatorstories.1300.t: "Sanación divina"
 POD_predatorstories.1300.desc: "Al actuar como una figura divina para un grupo de mortales que te ofrecen su sangre, a veces tienes que representar realmente el papel de patrón divino. Uno de tus cultistas se te acerca, suplicando que lo cures de la enfermedad que lo aqueja con tus poderes divinos. Otros se reúnen alrededor para observar tus poderes divinos en acción."
 POD_predatorstories.1300.a: "No hay nada que puedas hacer para ayudarles."
 POD_predatorstories.1300.b: "La fe les curará."
 POD_predatorstories.1300.c: "Unas hierbas «divinas» ayudarán."
 POD_predatorstories.1300.d: "De hecho, poseo poderes de curación divinos."
 POD_predatorstories.1300.e: "Conviértelos en un Ghoul."
 
 #Victim is actually a prostitute
 
 POD_predatorstories.1311.t: "Sangre costosa"
 POD_predatorstories.1311.desc: "La presa que has rastreado esta noche para tus necesidades de sangre ha sido sorprendentemente dócil y se ha mostrado ansiosa por complacerte. No le diste importancia hasta que, una vez hecho el acto, te han pedido que pagues por su tiempo. Resulta que pensaban que eras un cliente con gustos inusuales.\nBueno, qué situación tan incómoda."
 POD_predatorstories.1311.a: "Ignóralos."
 POD_predatorstories.1311.b: "Bueno... claro."
 POD_predatorstories.1311.c: "Esto nunca ha sucedido."
 POD_predatorstories.1311.d: "#beast ¡Esa bolsa de sangre se atreve a hacerme exigencias!#!"
 
 POD_predatorstories.1312.t: "Amante nocturno"
 POD_predatorstories.1312.desc: "La presa que has rastread de esta noche para tus necesidades de sangre ha sido sorprendentemente dócil y se ha mostrado ansiosa por complacerte. No le diste importancia hasta que, una vez hecho el acto, te han pedido que lo repitas en algún momento, aparentemente sin inmutarse por tus claramente «gustos extraños». Parece que tienes un admirador."
 POD_predatorstories.1312.a: "Esto ha sido algo de una sola vez."
 POD_predatorstories.1312.b: "Hagamos algo un poco diferente la próxima vez."
 POD_predatorstories.1312.c: "#beast ¿A qué esperar?#!"
 
 #Scarce prey
 POD_predatorstories.1320.t: "Terrenos vacíos"
 POD_predatorstories.1320.desc: "Quizá debido a que los mortales cazan demasiado o por alguna otra razón que no comprendes del todo, últimamente ha habido escasez de Animales para alimentarte en tu zona. Esto ha hecho que tus cacerías sean más peligrosas, ya que tener que adentrarte más en el bosque puede exponerte a una atención no deseada de tamaño Lupino."
 POD_predatorstories.1320.a: "Compra algunos Animales en su lugar."
 POD_predatorstories.1320.b: "Usa tus instintos de caza."
 POD_predatorstories.1320.c: "Usa tus poderes."
 
 #Victim discovers one of your secrets and threatens to reveal it
 POD_predatorstories.1330.t: "Chantaje contra-ataque"
 POD_predatorstories.1330.desc: "El mortal que estás cazando esta noche es peculiar; parece saber más sobre tu especie (o quizás sobre ti en particular) de lo que la mayoría de los mortales debería. Tus sospechas se confirman cuando afirma haber adquirido conocimiento sobre uno de tus secretos.\n¿Cómo podría ser? Alguien ha sido descuidado o quizás trabaja para un miembro de tu corte en secreto... Sea como sea, amenaza con revelarlo si no le dejas en paz."
 POD_predatorstories.1330.a: "No tengo nada que ocultar."
 POD_predatorstories.1330.b: "Estamos en un punto muerto."
 POD_predatorstories.1330.c: "No hablarás de esto."
 POD_predatorstories.1330.d: "#beast ¡¿Se atreven a chantajearme?!#!"
 
 #Victim offers to pay you off instead
 POD_predatorstories.1340.t: "¿Confesar todo?"
 POD_predatorstories.1340.desc: "Te alimentas mediante la extorsión y el chantaje, lo cual es un método eficaz en la mayoría de los casos. Sin embargo, también deja a los mortales bajo tu «protección» inquietos por intentar librarse del trato que hiciste.\nUno de tus presas chantajeadas ha conseguido algo de oro recientemente. A cambio de este pago, te piden que olvides su secreto y les dejes en paz."
 POD_predatorstories.1340.a: "Tenemos un trato."
 POD_predatorstories.1340.b: "Prefiero mi pago en sangre."
 POD_predatorstories.1340.c: "Lo quiero todo y lo quiero ahora."
 POD_predatorstories.1340.d: "Pueden quedarse con algo del dinero y servirme en su lugar."
 
 #Blackmailed victim tips off hunters
 POD_predatorstories.1350.t: "Grupo de apoyo"
 POD_predatorstories.1350.desc: "Te alimentas mediante la extorsión y el chantaje, lo cual es un método eficaz en la mayoría de los casos. Sin embargo, también deja a los mortales bajo tu «protección» inquietos por intentar librarse del trato que hiciste.\nMientras buscabas a una de tus presas mortales chantajeadas, te han emboscado repentinamente varios Cazadores armados con estacas. Claramente pensaban que podrían librarse del trato si te causaban una prematura Muerte Definitiva. Necios."
 POD_predatorstories.1350.a: "Lidiar con esos Cazadores."
 POD_predatorstories.1350.b: "Deja que la Bestia tome el control."
 
 POD_predatorstories.1350.a.success: "Victoria fácil"
 POD_predatorstories.1350.a.failure: "Victoria muy reñida"
 
 POD_predatorstories.1351.t: "Visita a domicilio"
 POD_predatorstories.1351.desc: "Con los Cazadores ya derrotados, encuentras una nota que detalla un lugar donde te han tendido una emboscada. Reconoces la nota dirigida a los Cazadores como perteneciente a uno de tus mortales chantajeadas. Claramente están intentando que te maten para librarse del chantaje.\nEs hora de hacerles una visita."
 POD_predatorstories.1351.a: "Aliméntate como de costumbre, pero muestra piedad."
 POD_predatorstories.1351.b: "Será por exsanguinación."
 
 #Abundance of prey
 POD_predatorstories.1360.t: "Tierras prósperas"
 POD_predatorstories.1360.desc: "Últimamente ha habido más animales en la fauna de tu dominio de lo habitual. No conoces la causa de este cambio tan bienvenido, pero esto ha hecho que cazar animales para obtener su sangre sea más fácil y seguro que nunca. No hace falta adentrarse en el bosque cuando puedes encontrar presas de sobra incluso en la entrada."
 POD_predatorstories.1360.a: "Atiborrate."
 
 #Animal victim fights back
 POD_predatorstories.1371.t: "Ave enfurecida"
 POD_predatorstories.1371.desc: "Cazar animales no siempre es una tarea sencilla. Los animales no sienten amor por los vampiros y, aunque la mayoría huirá al sentir tu aproximación, algunos intentarán contraatacar, lo que a menudo conduce a resultados impredecibles. Este gallo en particular ha decidido que ya no tolerará tu presencia.\nBueno, eso no debería ser un gran desafío."
 POD_predatorstories.1371.a: "Como sacar sangre a un gallo."
 
 POD_predatorstories.1372.t: "El Besado por el Lobo"
 POD_predatorstories.1372.desc: "Cazar animales no siempre es una tarea sencilla. Los animales no sienten amor por los vampiros y, aunque la mayoría huirá al sentir tu aproximación, algunos intentarán contraatacar, lo que a menudo conduce a resultados impredecibles. Este lobo en particular ha decidido que ya no tolerará tu presencia.\nNo es precisamente un desafío difícil por sí solo."
 POD_predatorstories.1372.a: "¡Mal perrito!"
 POD_predatorstories.1372.b: "¡Huye!"
 
 POD_predatorstories.1372.a.success: "Derrotas fácilmente al lobo"
 POD_predatorstories.1372.a.success.toast: "¡Victoria!"
 POD_predatorstories.1372.a.failure: "Una victoria desastrosa"
 POD_predatorstories.1372.a.failure.toast: "¡Herido!"
 
 POD_predatorstories.1373.t: "Oso enfurecido"
 POD_predatorstories.1373.desc: "Cazar animales no siempre es una tarea sencilla. Los animales no sienten amor por los vampiros y, aunque la mayoría huirá al sentir tu aproximación, algunos intentarán contraatacar, lo que a menudo conduce a resultados impredecibles. Este oso en particular ha decidido que ya no tolerará tu presencia.\nAnimales poderosos; no deberían subestimarse a pesar de no ser rivales para los poderes sobrenaturales de la mayoría de los vampiros."
 POD_predatorstories.1373.a: "Mis manos de oso serán suficientes."
 POD_predatorstories.1373.b: "¡Huye!"
 
 POD_predatorstories.1373.a.success: "Derrotas al oso"
 
 POD_predatorstories.1374.t: "Un roedor de lo más vil"
 POD_predatorstories_sensebane.1374.desc: "Mientras merodeas en busca de presas animales, te topas con un conejo. Sin embargo, algo es inusual en este. Parece estar rodeado de sangre y cadáveres, y se fija en ti.\nDebido a tu avanzada capacidad para leer auras y detectar lo impío, sabes que este conejo está poseído por un espíritu de malicia."
 POD_predatorstories.1374.desc: "Mientras merodeas en busca de presas animales, te topas con un conejo. Sin embargo, algo es inusual en este... ¿animal? Parece estar rodeado de sangre y cadáveres, y se fija en ti.\n¡Es el roedor más vil, cruel y malhumorado que hayas visto jamás!"
 POD_predatorstories.1374.a: "Bueno, ese no es un conejo cualquiera."
 POD_predatorstories.1374.b: "¡Ese conejo tiene una vena de maldad de un kilómetro de ancho! ¡Es un asesino!"
 POD_predatorstories.1374.c: "¡Exorcizaré a este animal demoníaco!"
  
 POD_predatorstories.1375.t: "Un roedor de lo más cruel"
 POD_predatorstories.1375.desc: "El conejo se lanza ahora hacia ti con sus hileras de dientes como dagas, ahora aterradoramente visibles. Puede saltar por doquier. ¡Mira los huesos!\nClaramente es una criatura del mismísimo Diablo. ¿Sobrevivirás a este terrible encuentro?"
 POD_predatorstories.1375.a: "¡Viene hacia nosotros!"
 
 POD_predatorstories.1375.a.success: "¡Una victoria para la historia!"
 POD_predatorstories.1375.a.failure: "Huyes de esta engendro del infierno"
 POD_predatorstories.1375.a.failure.toast: "Nunca más"
 
 #Victim needs gold to purchase new cattle
 POD_predatorstories.1380.t: "Benefactor sangriento"
 POD_predatorstories.1380.desc: "Como te alimentas de personas que entienden (al menos parte de) tu naturaleza, han llegado a verte como un potencial benefactor para su familia a cambio de su sangre. Esto da lugar a diversas peticiones de ayuda que pueden resultar tediosas, pero aseguran la prosperidad de tu [POD_herd|E] en el futuro. Una de estas peticiones ha llegado; aunque no te importó recordar los detalles, consiste en que necesitan oro para algún proyecto agrícola." 
 POD_predatorstories.1380.a: "Ayudaré."
 POD_predatorstories.1380.b: "¡Arréglatelo tú mismo!"
 POD_predatorstories.1380.c: "Los animales me obedecen."
 
 #Victim is actually a Redcap
 POD_predatorstories.1390.t: "¿Solo otra víctima?"
 POD_predatorstories.1390.desc: "Mientras merodeas en busca de sangre, divisas a un candidato adecuado para alimentarte. ¿Hay algo inusual en él?... No, es solo tu imaginación. Su sangre parece especialmente tentadora incluso desde donde estás, como si tuviera una cualidad «brillante».\nEs hora de mostrar los colmillos."
 POD_predatorstories_auspexadvanced.1390.desc: "Mientras merodeas en busca de sangre, gracias a tu hábil capacidad para ver lo que otros no pueden, tus agudas dotes de observación te permiten determinar que tu presa elegida es, de hecho, una hada [GetTrait('redcap').GetName( GetNullCharacter )], no un vampiro.\n\nSabes que los Redcaps suelen entrar en combate y pueden detectar lo invisible; también sabes que alimentarse de una hada probablemente tendrá algunos efectos adversos."
 POD_predatorstories.1390.a: "Te acercas a tu víctima."
 POD_predatorstories.1390.b: "Quizá debería buscar otra presa..."

 POD_predatorstories_auspexadvanced.1391.desc: "La sangre de la víctima que has acorralado parece especialmente tentadora incluso desde donde estás, como si tuviera una cualidad «brillante». Tu Bestia está sorprendentemente silenciosa, como si estuviera ponderando si sería bueno o malo para ti devorar a este extraño ser.\nAhora que estás más cerca, tu presa te ha visto y ha adoptado una postura agresiva. Si no huyes ahora, te verás envuelto en una pelea."
 POD_predatorstories_kiasyd.1391.desc: "Ahora que estás más cerca y siendo un [GetTrait('kiasyd').GetName( GetNullCharacter )], te das cuenta de que tu víctima es, de hecho, un [GetTrait('redcap').GetName( GetNullCharacter )].\n\nSabes que los Redcaps suelen entrar en combate y detectar lo invisible; también sabes que alimentarse de un hada probablemente tendrá algunos efectos adversos.\n\nSin embargo, tu presa te ha visto y ha adoptado una postura agresiva. Si no huyes ahora, te verás envuelto en una pelea."
 POD_predatorstories_maeghar.1391.desc: "Ahora que estás más cerca y siendo un [GetTrait('maeghar').GetName( GetNullCharacter )], te das cuenta de que tu víctima es, de hecho, un [GetTrait('redcap').GetName( GetNullCharacter )].\n\nSabes que los Redcaps suelen entrar en combate y detectar lo invisible; también sabes que alimentarse de un hada probablemente tendrá algunos efectos adversos.\n\nSin embargo, tu presa te ha visto y ha adoptado una postura agresiva. Si no huyes ahora, te verás envuelto en una pelea."
 POD_predatorstories.1391.desc: "Mientras acorralas a tu extraña víctima, tu Bestia está sorprendentemente silenciosa, como si estuviera ponderando si sería bueno o malo para ti devorar a este extraño ser.\nAhora que estás más cerca, notas que tu víctima tiene una apariencia inusual; sin embargo, no tienes tiempo para procesarlo, ya que tu presa te ha visto y ha adoptado una postura agresiva. Si no huyes ahora, te verás envuelto en una pelea."
 POD_predatorstories.1391.a: "Sangre brillante..."
 POD_predatorstories.1391.b: "Esto es una mala idea..."
 
 POD_predatorstories.1391.a.success: "Los vences"
 POD_predatorstories.1391.a.success.toast: "¡Sangre brillante!"
 POD_predatorstories.1391.a.failure: "Te derrotan"
 POD_predatorstories.1391.a.failure.toast: "¡Malditas mariposas!"
 
 #Victim is actually a Sluagh
 POD_predatorstories.1401.t: "Escondite y búsqueda"
 POD_predatorstories.1401.desc: "Para ti, es solo otra noche de caza hasta que algo capta tu atención. Hay una entidad cerca que no logras ver del todo, casi como un vampiro usando Ofuscación pero también... diferente. Alguien que pregunta de forma tan sospechosa y con poderes tan extraños en tu dominio ciertamente merece ser investigado."
 POD_predatorstories.1401.a: "Echar otro vistazo"
 POD_predatorstories.1401.b: "Usar Auspex para ver lo invisible"
 
 POD_predatorstories.1401.a.success: "¡Te encontré!"
 POD_predatorstories.1401.a.failure: "Nada..."

 POD_predatorstories.1402.desc: "Los has encontrado y son, de hecho... diferentes. Algo que no habías visto antes y su sangre es... ¿brillante? Tu Bestia está sorprendentemente silenciosa, como si estuviera ponderando si deberías devorar a esta extraña entidad o no. En cualquier caso, ahora que han sido descubiertos, te espera un encuentro extraño."
 POD_predatorstories_auspexadvanced.1402.desc: "Debido a tu hábil capacidad para ver lo que otros no pueden; tus agudas habilidades de observación te permiten determinar que tu selecta presa es, de hecho, un hada [GetTrait('sluagh').GetName( GetNullCharacter )], no un [GetTrait('vampire').GetName( GetNullCharacter )].\n\nLos [GetTrait('sluagh').GetName( GetNullCharacter )] suelen intentar evitar el conflicto y detectar lo invisible.\n\nSabes que alimentarte de un hada probablemente tendrá algunos efectos adversos."
 POD_predatorstories.1402.a: "¡Te tengo!"
 POD_predatorstories.1402.b: "Quizá debería buscar otra presa..."
 
 POD_predatorstories.1403.t: "¡Localizado!"
 POD_predatorstories_auspexadvanced.1403.desc: "El [GetTrait('sluagh').GetName( GetNullCharacter )] retrocede sobresaltado y pide que, a cambio de algo de oro, lo dejes en paz.\nSu extraña y sobrenatural sangre brillante te llama; sin embargo, al dejarlo pasar, tu Bestia se pregunta a qué sabrá..."
 POD_predatorstories_kiasyd.1403.desc: "Ahora que estás más cerca, siendo un [GetTrait('kiasyd').GetName( GetNullCharacter )], te das cuenta de que tu víctima es, de hecho, un [GetTrait('sluagh').GetName( GetNullCharacter )], no un [GetTrait('vampire').GetName( GetNullCharacter )].\n\nLos [GetTrait('sluagh').GetName( GetNullCharacter )] suelen intentar evitar el conflicto y detectar lo invisible.\n\nYou sabes que alimentarte de un hada probablemente tendrá algunos efectos adversos."
 POD_predatorstories_maeghar.1403.desc: "Ahora que estás más cerca, siendo un [GetTrait('maeghar').GetName( GetNullCharacter )], te das cuenta de que tu víctima es, de hecho, un [GetTrait('sluagh').GetName( GetNullCharacter )], no un [GetTrait('vampire').GetName( GetNullCharacter )].\n\nLos [GetTrait('sluagh').GetName( GetNullCharacter )] suelen intentar evitar el conflicto y detectar lo invisible.\n\nSabes que alimentarte de un hada probablemente tendrá algunos efectos adversos."
 POD_predatorstories.1403.desc: "Ahora que estás más cerca, notas que tu víctima tiene una apariencia inusual para ser un vampiro.\n\nRetrocede sobresaltado y pide que, a cambio de algo de oro, lo dejes en paz. Su extraña y sobrenatural sangre te llama; sin embargo, al dejarlo pasar, tu Bestia se pregunta a qué sabrá..."
 POD_predatorstories.1403.a: "Tenemos un trato."
 POD_predatorstories.1403.b: "¡Sangre brillante!"
 
 POD_predatorstories.1404.t: "¡Vuelve aquí!"
 POD_predatorstories_auspexadvanced.1404.desc: "Al rechazar su oferta, el [GetTrait('sluagh').GetName( GetNullCharacter )] entra en pánico y sale disparado a una velocidad alarmante. Es claramente muy hábil para correr y esconderse, y tendrás que esforzarte y usar tu conocimiento de la zona para atraparlo (y lo más importante, su sangre brillante, como tu Bestia te recuerda con ayuda)."
 POD_predatorstories_kiasyd.1404.desc: "Al rechazar su oferta, el [GetTrait('sluagh').GetName( GetNullCharacter )] entra en pánico y sale disparado a una velocidad alarmante. Es claramente muy hábil para correr y esconderse, y tendrás que esforzarte y usar tu conocimiento de la zona para atraparlo (y lo más importante, su sangre brillante, como tu Bestia te recuerda con ayuda)."
 POD_predatorstories_maeghar.1404.desc: "Al rechazar su oferta, el [GetTrait('sluagh').GetName( GetNullCharacter )] entra en pánico y sale disparado a una velocidad alarmante. Es claramente muy hábil para correr y esconderse, y tendrás que esforzarte y usar tu conocimiento de la zona para atraparlo (y lo más importante, su sangre brillante, como tu Bestia te recuerda con ayuda)."
 POD_predatorstories.1404.desc: "Al rechazar su oferta, la víctima entra en pánico y sale disparada a una velocidad alarmante. Es claramente muy hábil para correr y esconderse, y tendrás que esforzarte y usar tu conocimiento de la zona para atraparla (y lo más importante, su sangre brillante, como tu Bestia te recuerda con ayuda)."
 POD_predatorstories.1404.a: "¡Tras ellos!"
 POD_predatorstories.1404.j: "Perseguirlos requiere demasiado esfuerzo"
 
 POD_predatorstories.1404.a.success: "¡Atrapado!"
 POD_predatorstories.1404.a.failure: "¡Malditos hadas!"

 POD_predatorstories.1405.t: "Mirando hacia otro lado"
 POD_predatorstories_auspexadvanced.1405.desc: "El [GetTrait('sluagh').GetName( GetNullCharacter )], ahora claramente nervioso, está ansioso por llegar a un acuerdo contigo y ofrece más oro a cambio de que simplemente lo dejes ir.\nSin embargo, tu Bestia desaprueba esta opción; ¿qué es el oro en comparación con la posibilidad única de saborear esa sangre tan única... brillante... palpitante?"
 POD_predatorstories_kiasyd.1405.desc: "El [GetTrait('sluagh').GetName( GetNullCharacter )], ahora claramente nervioso, está ansioso por llegar a un acuerdo contigo y ofrece más oro a cambio de que simplemente lo dejes ir.\nSin embargo, tu Bestia desaprueba esta opción; ¿qué es el oro en comparación con la posibilidad única de saborear esa sangre tan única... brillante... palpitante?"
 POD_predatorstories_maeghar.1405.desc: "El [GetTrait('sluagh').GetName( GetNullCharacter )], ahora claramente nervioso, está ansioso por llegar a un acuerdo contigo y ofrece más oro a cambio de que simplemente lo dejes ir.\nSin embargo, tu Bestia desaprueba esta opción; ¿qué es el oro en comparación con la posibilidad única de saborear esa sangre tan única... brillante... palpitante?"
 POD_predatorstories.1405.desc: "La inusual víctima, ahora claramente nerviosa, está ansiosa por llegar a un acuerdo contigo y ofrece más oro a cambio de que simplemente la dejes ir.\nSin embargo, tu Bestia desaprueba esta opción; ¿qué es el oro en comparación con la posibilidad única de saborear esa sangre tan única... brillante... palpitante?"
 POD_predatorstories.1405.a: "Demasiado alucinante."
 POD_predatorstories.1405.b: "¡Lo brillante es mío!"
 
 POD_predatorstories.1406.t: "Combate onírico"
 POD_predatorstories_auspexadvanced.1406.desc: "El [GetTrait('sluagh').GetName( GetNullCharacter )] no tiene a dónde huir.\nEs hora de ver por ti mismo cuál es la verdadera Destreza de combate de este extraño ser. Con suerte, incluso podrás capturar algo de sangre de las heridas que le inflijas. Tú (y tu Bestia) no pueden esperar esta experiencia."
 POD_predatorstories_kiasyd.1406.desc: "El [GetTrait('sluagh').GetName( GetNullCharacter )] no tiene a dónde huir.\nEs hora de ver por ti mismo cuál es la verdadera Destreza de combate de este extraño ser. Con suerte, incluso podrás capturar algo de sangre de las heridas que le inflijas. Tú (y tu Bestia) no pueden esperar esta experiencia."
 POD_predatorstories_maeghar.1406.desc: "El [GetTrait('sluagh').GetName( GetNullCharacter )] no tiene a dónde huir.\nEs hora de ver por ti mismo cuál es la verdadera Destreza de combate de este extraño ser. Con suerte, incluso podrás capturar algo de sangre de las heridas que le inflijas. Tú (y tu Bestia) no pueden esperar esta experiencia."
 POD_predatorstories.1406.desc: "La extraña criatura no tiene a dónde huir.\nEs hora de ver por ti mismo cuál es la verdadera Destreza de combate de este extraño ser. Con suerte, incluso podrás capturar algo de sangre de las heridas que le inflijas. Tú (y tu Bestia) no pueden esperar esta experiencia."
 POD_predatorstories.1406.a: "¡Mío!"
 POD_predatorstories.1406.b: "Pensándolo bien... todo esto es solo un malentendido."
 
 POD_predatorstories.1406.a.success: "¡Victoria!"
 POD_predatorstories.1406.a.success.toast: "Mariposas y arcoíris..."
 POD_predatorstories.1406.a.failure: "¡Malditos hadas!"
 POD_predatorstories.1406.a.failure.toast: "¡Retirada!"
 POD_predatorstories.1406.b.toast: "No es muy valiente de tu parte..."
 
 #House has gold (Not a gift)
 POD_predatorstories.1410.t: "Oro durmiente"
 POD_predatorstories.1410.desc: "Mientras te alimentas de mortales que duermen, tienes que entrar por la fuerza en su casa. Aunque esto suele ser una tarea sin incidentes la mayoría de las veces, podría crear algunas oportunidades como la de esta noche.\nDentro de la casa de tu víctima resulta que hay una cantidad considerable de oro. Podrías llevártelo con bastante facilidad, si así lo deseas."
 POD_predatorstories.1410.a: "Ahora es mío"
 POD_predatorstories.1410.b: "¡No soy un ladrón común!" 
 
 #House has artifact (Not a gift)
 POD_predatorstories.1420.t: "Tesoro durmiente"
 POD_predatorstories.1420.desc: "Mientras te alimentas de mortales que duermen, tienes que entrar por la fuerza en su casa. Aunque esto suele ser una tarea sin incidentes la mayoría de las veces, podría crear algunas oportunidades como la de esta noche.\nDentro de la casa de tu víctima resulta que hay una reliquia familiar. Podrías llevártelo con bastante facilidad, si así lo deseas."
 POD_predatorstories.1420.a: "Llevármelo para venderlo"
 POD_predatorstories.1420.b: "Llevármelo para exhibirlo"
 POD_predatorstories.1420.c: "Llevar [newly_created_artifact.GetName] para usarlo"

 #Victim is drunk (Drunk Modifiers Loca at the top in multi use catagory)
 POD_predatorstories.1430.t: "Resaca sangrienta"
 POD_predatorstories.1430.desc: "Mientras beben la sangre de los mortales, los vampiros suelen verse afectados por lo que exactamente estaba ocurriendo en el cuerpo de dicho mortal antes de clavarles los colmillos. Aunque las enfermedades y demás no son una preocupación para los hijos de Caín, tener diversas sustancias mezcladas con la sangre puede resultar en una... experiencia extraña para el vampiro que se alimenta.\nEsta noche estás listo para alimentarte, cuando tu víctima de repente murmura algo sobre cangrejos.\nEsto podría ser todo un viaje."
 POD_predatorstories_auspex.1430.desc: "Mientras beben la sangre de los mortales, los vampiros suelen verse afectados por lo que exactamente estaba ocurriendo en el cuerpo de dicho mortal antes de clavarles los colmillos. Aunque las enfermedades y demás no son una preocupación para los hijos de Caín, tener diversas sustancias mezcladas con la sangre puede resultar en una... experiencia extraña para el vampiro que se alimenta.\nEsta noche estás listo para alimentarte, cuando tu víctima de repente murmura algo sobre cangrejos.\n\nSin embargo, gracias a tu habilidad en la Disciplina Auspex, puedes determinar que está completamente fuera de sí. Su sangre está contaminada con sustancias que podrían afectarte hasta cierto punto si te alimentas."
 POD_predatorstories.1430.a: "Bueno... solo un poco."
 POD_predatorstories.1430.b: "¡Estoy borracho como un cura!"
 POD_predatorstories.1430.c: "Mejor no."





