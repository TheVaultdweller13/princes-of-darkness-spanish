 POD_transmogrify.500.t: "Conocimiento a cualquier precio"
 POD_transmogrify.500.desc: "¿Qué [trait|E] quieres estudiar?"
 POD_transmogrify.500.a: "He tomado mi decisión."
 POD_transmogrify.500.a.trigger: "Primero debes seleccionar un rasgo"
 POD_transmogrify.500.b: "He cambiado de opinión. Hoy no habrá experimentos."

 POD_transmogrify.501.t: "Anatomía de [GetPlayer.MakeScope.Var('current_journey').Var('target_trait').Trait.GetName(GetPlayer)]"
 POD_transmogrify.501.desc: "Ha pasado un tiempo desde la última vez que practiqué mi arte en la mazmorra, pero mis experiencias previas han permanecido conmigo.\n\nTras algo de contemplación y estudio, ahora entiendo cómo aplicar mis hallazgos."
 POD_transmogrify.501.a: "¿Quién quiere ser mi próximo sujeto de pruebas?"
 POD_transmogrify.501.a.tt: "Has obtenido una comprensión del [trait|E] [GetPlayer.MakeScope.Var('current_journey').Var('target_trait').Trait.GetName(GetPlayer)], lo que te permite usarlo en la [character_interaction|E] de [fleshcrafting|E]."