l_spanish:

 podregionalpersons.2.t: "El Cazador Cazado"
 podregionalpersons.2.desc: "Desde hace algún tiempo, tu séquito está inquieto por los rumores de un mortal que caza $pod_cainites$ por tu zona. Obviamente, los mortales suelen tener poca suerte en este empeño, especialmente cuando actúan como lobos solitarios, como parece hacer este individuo.\nLo interesante es que, a pesar de todos estos defectos, este cazador ha mostrado cierto éxito inicial, y muchos callejones oscuros son más seguros gracias a él. Sin embargo, es esquivo y no estás seguro de dónde atacará próximamente, o incluso de si lo hará. Pero podrías mantener agentes cerca del terreno en un intento de rastrearlo si así lo desearas."
 podregionalpersons.2.a: "Quiero saber todo sobre él"
 podregionalpersons.2.custom: "Ten cuidado, podría haber consecuencias graves..."
 podregionalpersons.2.b: "No es de mi incumbencia"
 podregionalpersons.2.customb: "No volverás a saber de él"
 podregionalpersons.2.c: "Quiero saber todo sobre él"
 podregionalpersons.2.customc: "¿Tal vez podrías reclutar a este individuo con talento?"
 podregionalpersons.4.t: "El Cazador Cazado II"
 podregionalpersons.4.desc: "Lo has encontrado. Este escurridizo cazador es un tal Karl Schrekt de Viena. Un hombre de pocas palabras, difícil de rastrear y aún más difícil de evaluar.\nEl celo de la furia de Dios arde en su interior, eso está claro, pero está empañado por una amargura que le impide ser consciente del sufrimiento que causa durante sus cacerías. Temes que su alma esté al límite y que el ejército de Dios pierda a un hombre impresionante si su fe flaquea aún más.\n¿Quizás puedas recordarle la gloria de Dios y mostrarle las virtudes de trabajar en un grupo coherente? Aunque será un debate difícil, ya que el hombre es extremadamente testarudo..."
 podregionalpersons.4.a: "Hermano, escucha las palabras de Dios"
 podregionalpersons.4.effect.success.desc: "Logras convencer a Karl para que se una a tu causa sin problemas"
 podregionalpersons.4.success: "¡Karl se une a ti!"
 podregionalpersons.4.failure.effect.desc: "Tu fe es puesta a prueba, pero al final logras convencerle"
 podregionalpersons.4.failure: "¡Karl se une a ti!"
 podregionalpersons.4.critical.failure.effect.desc: "Se ha perdido para la luz..."
 podregionalpersons.4.critical.failure: "Karl se ha ido"
 podregionalpersons.4.c: "Ya está demasiado perdido"
 podregionalpersons.3.t: "El Cazador Cazado II"
 podregionalpersons.3.desc: "El cazador solitario que está causando estragos en tu zona te sigue eludir, pero has logrado tener, al menos, una idea general de su modus operandi. Con este conocimiento, has ideado dos planes de acción para despistar y, con suerte, capturar a este individuo.\nAmbos planes requerirán que muevas algunos hilos y es probable que atraigan atención no deseada sobre tus operaciones. Sin embargo, no puedes echarte atrás ahora, ya que parece que el propio cazador también se está acercando a tu posición... Una confrontación es inevitable en este punto."
 podregionalpersons.3.a: "Tendremos una trampa para él"
 podregionalpersons.3.b: "Un enfrentamiento directo va más con mi estilo"
 podregionalpersons.5.t: "El Cazador Cazado III"
 podregionalpersons.5.desc: "Debes confesar que estás algo nervioso. En este momento, tus agentes deben estar esperando en la vieja mansión que has establecido como fachada para atrapar al escurridizo cazador. Ya conoces su nombre, Karl Schrekt de Viena, un lobo solitario con un ímpetu rara vez visto incluso entre los de su celosa estirpe. Estás bastante seguro de haber planeado bien tu trampa y de que tus hombres son lo suficientemente buenos para someterlo.\nPero... si lograra escapar o, peor aún, matar a tus hombres, asestaría un golpe muy serio a tu control sobre la zona. Y también habrías perdido tu única oportunidad de capturarlo."
 podregionalpersons.5.a: "Ya no hay vuelta atrás"
 podregionalpersons.5.effect.success.desc: "El plan transcurre sin contratiempos"
 podregionalpersons.5.success: "¡Lo tenemos!"
 podregionalpersons.5.failure.effect.desc: "Causó algo de daño, pero tú ganaste"
 podregionalpersons.5.failure: "¡Lo tenemos!... por poco"
 podregionalpersons.5.critical.failure.effect.desc: "Karl huye tras despachar a tus agentes"
 podregionalpersons.5.critical.failure: "Nos ha atrapado..."
 podregionalpersons.6.t: "El Cazador Cazado III"
 podregionalpersons.6.desc: "La asistencia media en tu corte esta noche es, de repente, interrumpida cuando varias antorchas caen de la nada en medio de la sala. Apenas logras contener a tu aterrorizada Bestia mientras se escuchan gritos de horror y vampiros en frenesí a tu alrededor.\nMientras intentas huir de la caótica escena, una figura encapuchada bloquea tu camino, aparentemente ajena al fuego que arde a tu alrededor.\nSin decir una palabra, empieza a acercarse a ti, con una antorcha encendida en cada mano. El celo enloquecedor de sus ojos no deja lugar a dudas: parece que el escurridizo cazador lobo solitario te ha encontrado antes de que tú lo encontraras a él..."
 podregionalpersons.6.a: "¡Detenedlo! ¡AHORA!"
 podregionalpersons.6.effect.success.desc: "¡Logras someterlo y capturarlo!"
 podregionalpersons.6.success: "¡Lo tenemos!"
 podregionalpersons.6.failure.effect.desc: "Causó algo de daño, pero tú ganaste"
 podregionalpersons.6.failure: "¡Lo tenemos!... por poco"
 podregionalpersons.6.critical.failure.effect.desc: "Lo último que ves es fuego, fuego por todas partes"
 podregionalpersons.6.critical.failure: "Qué calor..."
 podregionalpersons.7.t: "El Salón de Ulf"
 podregionalpersons.7.desc: "Te ha llegado el informe de que se ha encontrado el legendario Salón de Ulf.\nEsta pequeña isla cerca de Noruega supuestamente contiene el tesoro de los famosos Valdaermen, los Magos de las Runas nórdicos. Su tiempo ha pasado hace mucho, ya que el Dios cristiano barrió su fe en el continente. Pero parece que una pequeña cábala de ellos todavía se aferra al Salón, protegiendo lo que podría ser un gran alijo de tesoros, dado el poder que tenían en siglos pasados...\n¿Qué harás con esta información?"
 podregionalpersons.7.a: "¡Es hora de una incursión, digo yo!"
 podregionalpersons.7.custom: "Ten cuidado, podría haber consecuencias graves..."
 podregionalpersons.7.b: "¡Debemos proteger a estos siervos de Odín!"
 podregionalpersons.7.c: "Tengo asuntos más urgentes que atender"
 podregionalpersons.7.customb: "No volverás a oír hablar de esta historia"
 podregionalpersons.8.t: "El Salón de Ulf II"
 podregionalpersons.8.desc: "Una pequeña y modesta aldea de pescadores, el Salón de Ulf no es la grandiosa ciudad dorada que esperabas.\nAun así, mientras observas los alrededores, sabes que no debes subestimar a la cábala de Magos de las Runas que probablemente habita aquí. Tal como lo ves, tienes dos opciones: un asalto total ahora mismo donde no lo esperan, o fingir amistad con su causa para apuñalarlos por la espalda cuando se presente la oportunidad."
 podregionalpersons.8.a: "¡Enviaremos a estos necios a su Valhalla!"
 podregionalpersons.8.effect.success.desc: "Conquistas la aldea con facilidad"
 podregionalpersons.8.failure.effect.desc: "Has recibido un golpe serio, pero la aldea es tuya"
 podregionalpersons.8.critical.failure.effect.desc: "Los Magos de las Runas aniquilan a tus fuerzas"
 podregionalpersons.8.failure: "Has recibido un golpe"
 podregionalpersons.8.b: "Reunámonos con nuestros nuevos «amigos»..."
 podregionalpersons.8.effect.success.descb: "Te dan la bienvenida de todo corazón"
 podregionalpersons.8.critical.failure.effect.descb: "Son unos sospechosos..."
 podregionalpersons.9.t: "El salón de Ulf III"
 podregionalpersons.9.desc: "La batalla fue dura, tal como anticipabas; los Magos de las Runas se vieron sorprendidos, pero no sin defenderse. La mayoría de tus fuerzas han resultado heridas, o directamente muertas, por trampas, la plebe o los propios magos.\nPero ahora estás en el salón mismo, con solo su líder frente a ti. Y, tras él, ya puedes ver el oro reluciente del famoso tesoro...\nPuedes salir corriendo y coger todo el oro que puedas antes de huir. O podrías intentar desafiar a este poderoso mago nórdico a un duelo para obtener la recompensa completa."
 podregionalpersons.9.a: "No le tengo miedo a este tipo"
 podregionalpersons.9.effect.success.desc: "¡Has partido a este necio por la mitad! ¡El oro es tuyo!"
 podregionalpersons.9.success: "¡Una victoria total!"
 podregionalpersons.9.critical.failure.effect.desc: "No estabas preparado..."
 podregionalpersons.9.critical.failure: "El Fin"
 podregionalpersons.9.b: "No le tengo miedo a este tipo... pero sigo prefiriendo huir"
 podregionalpersons.10.t: "El salón de Ulf III"
 podregionalpersons.10.desc: "Has sido totalmente aplastado. Los Magos de las Runas tenían trampas, sistemas de advertencia místicos y la plebe estaba totalmente de su parte. Tu ejército resistió lo justo para permitir que un pequeño grupo de vosotros huyera en el bote que usasteis para venir aquí.\nAhora debes preparar el futuro, ya que este revés afectará claramente a tu prestigio en casa. Sin embargo, todavía tienes el control de la narrativa..."
 podregionalpersons.10.a: "¡Fue una estratagema para purgar a los traidores en mi Señorío!"
 podregionalpersons.10.b: "¡Eran cientos! ¡Y el mismísimo Odín luchaba con ellos!"
 podregionalpersons.11.t: "El salón de Ulf III"
 podregionalpersons.11.desc: "Has logrado hacerles creer a los Magos de las Runas que estás de su lado. Por ello, fue demasiado tarde cuando finalmente comprendieron tu verdadera naturaleza. Tus fuerzas han aniquilado a la mayor parte de la cábala y han tomado el control de la aldea.\nPero ahora ves a los dos miembros supervivientes de la cábala entrando en acción. Su líder, un robusto hombre del norte conocido como Brand, intenta inmovilizarte mientras el otro miembro recoge el tesoro para huir.\nSi pierdes tiempo con Brand, perderás parte del oro, pero potencialmente ganarás un prisionero útil..."
 podregionalpersons.11.a: "Este hombre vale más que el simple oro..."
 podregionalpersons.11.b: "¡Oro! ¡Más oro!"
 podregionalpersons.12.t: "El salón de Ulf III"
 podregionalpersons.12.desc: "Vieron a través de tu estratagema con bastante facilidad. Y te aplastaron por completo en cuanto comprendieron que mentiste sobre tus verdaderas intenciones.\nVuestros hombres apenas lograron mantener su posición para permitir que huyeras al bote que usasteis para venir aquí. Obviamente, este revés será un golpe importante para tu prestigio en casa pero... todavía puedes controlar la narrativa de la situación, en cierto modo."
 podregionalpersons.12.a: "¡Fue una estratagema para purgar a los traidores en mi Señorío!"
 podregionalpersons.12.b: "¡Eran cientos! ¡Y el mismísimo Odín luchaba con ellos!"
 podregionalpersons.13.t: "El Salón de Ulf II"
 podregionalpersons.13.desc: "Los Magos de las Runas fueron difíciles de convencer. Son un grupo cansado, ocultos durante tanto tiempo, pero vuestras Tradiciones compartidas ayudaron a encontrar un terreno común. Les hiciste saber que su posición está comprometida y que otros vendrán con intenciones más hostiles que las tuyas.\nComo tal, ahora se preparan para partir y te ofrecen una pequeña parte de su tesoro como recompensa por tu ayuda. Sin embargo, si eres lo suficientemente persuasivo, podrías convencerlos para que se unan a tu Señorío y disfruten de tu protección, lo que obviamente aportaría más beneficios."
 podregionalpersons.13.a: "¡Venid con nosotros! El Ragnarök aún puede evitarse"
 podregionalpersons.13.effect.success.desc: "¡Están convencidos!"
 podregionalpersons.13.critical.failure.effect.desc: "No están convencidos..."
 podregionalpersons.13.b: "Gracias, hermanos, y buena navegación"
 podregionalpersons.13.critical.failure: "No están convencidos..."
 podregionalpersons.14.t: "El salón de Ulf III"
 podregionalpersons.14.desc: "Pudiste convencer a los Valdaermen para que se unieran a tu Señorío y a tu protección. Ya han empezado a ser de gran ayuda en tu capital, usando sus habilidades místicas para ayudar a la población.\nAunque... también vinieron aquí con su tesoro, y podrías traicionarlos, reclamar el tesoro para ti mismo y luego expulsar a los Magos de las Runas. Seguro que a Odín no le importaría."
 podregionalpersons.14.a: "Hagamos que nuestros nuevos amigos se sientan como en casa"
 podregionalpersons.14.b: "...El oro es oro"
 podregionalpersons.15.t: "El último cátaro"
 podregionalpersons.15.desc: "Un individuo extraño ha llegado recientemente a tu corte. Este joven es aparentemente un refugiado de Montsegur, la última fortaleza de los cátaros, caída recientemente ante los cruzados. Has oído informes contradictorios sobre este suceso, desde que el famoso tesoro de los cátaros fue escondido antes del asedio, hasta que el «Cristo cátaro» maldijo a los cristianos cuando lo llevaron a la hoguera.\nNo puedes negar la piedad de este chico, pero dejarle predicar en tu corte podría ser peligroso, ya que los cátaros tienen muchos más enemigos que amigos..."
 podregionalpersons.15.a: "Invítalo a un debate teológico"
 podregionalpersons.15.b: "Deja que hable, pero vigílalo de cerca"
 podregionalpersons.15.c: "Échalo, solo traerá problemas"
 podregionalpersons.16.t: "El último cátaro II"
 podregionalpersons.16.desc: "El debate ha sido interesante, y has tenido muchos más desde entonces. ¿Quizás los «Puros» tenían razón? El joven habla de una forma para que sigas la Fe Verdadera, incluso en tu maldito estado.\nEs tentador, pero en términos políticos, tu conversión a una fe muy desconfiada podría tener graves consecuencias..."
 podregionalpersons.16.a: "La salvación de mi alma vale más que la política mezquina"
 POD_faith_commited_modifier: "Has encontrado tu vocación"
 POD_faith_commited_modifier_desc: "#N Convertir la fe mediante la interfaz de fe será absurdamente costoso mientras este modificador esté activo. #!"
 podregionalpersons.16.b: "He disfrutado nuestras charlas, pero debes marcharte ahora"
 podregionalpersons.17.t: "El último cátaro II"
 podregionalpersons.17.desc: "Como aún no lo has echado de tu corte, el joven ha empezado a verte como uno de los pocos $pod_cainites$ que son razonables. Por ello, ha planteado la idea de permitir que otros refugiados entren en tu servicio, lo que sin duda ayudaría a la prosperidad de tu Señorío.\nOtro curso de acción sería capturar y «interrogar» a este chico hasta que revele todo lo que sabe sobre el legendario tesoro de Montsegur..."
 podregionalpersons.17.a: "Tu gente es bienvenida aquí"
 podregionalpersons.17.b: "Hablemos de oro..."
 podregionalpersons.18.t: "El Monstruo"
 podregionalpersons.18.desc: "Alguien... o algo está merodeando por las calles de tu ciudad durante la noche. Y no es uno de los tuyos. Esta cosa ya ha sido acusada de asesinatos en masa, y de los más espantosos. Incluso algunos de tus agentes, por muy curtidos que estén, parecieron perturbados por los horrores que vieron. Rumores aún más oscuros hablan de experimentos de la índole más impía.\nLa ciudad se encoge de miedo y tienes que actuar antes de que la gente empiece a investigar demasiado la vida nocturna. Podrías alertar sutilmente a la Inquisición mortal, con la esperanza de que lo detengan. O podrías dejar que actúe desenfrenadamente durante un tiempo y encontrar un patrón en su locura. Finalmente, también podrías reforzar las patrullas y los guardias nocturnos, ahuyentándolo hacia otra ciudad más vulnerable." 
 podregionalpersons.18.a: "Que lo sagrado luche contra lo impío"
 podregionalpersons.18.custom: "Esto te expondrá un poco, pero con suerte detendrá a este monstruo"
 podregionalpersons.18.b: "Debe haber un método en su locura"
 podregionalpersons.18.customb: "El monstruo continuará su matanza, pero quizás surja una pista"
 podregionalpersons.18.c: "Ahuyéntalo"
 podregionalpersons.18.customc: "Ayudarás a los guardias mortales por la noche, asegurándote de que abandone tu ciudad para siempre"
 podregionalpersons.19.t: "El Monstruo II"
 podregionalpersons.19.desc: "Salió mal. Terriblemente.\nLa cosa que acecha en la noche encontró la célula inquisitorial que lanzaste sutilmente tras su rastro y les dio una lección... una bastante espantosa, en medio de la ciudad.\nLa ciudad está en pánico y ya escuchas informes de un equipo de élite de agentes de Dios en camino para purgar la ciudad. Incluso si eso significa reducirla a cenizas.\n¡Y todavía no tienes ni la más remota idea de quién o qué es esta cosa! Tu corte está en Frenesí, suplicándote que te mantengas oculto y olvides este maldito empeño antes de que sea demasiado tarde..." 
 podregionalpersons.19.a: "¡Conoceré la verdad, incluso si tengo que encontrarla yo mismo!"
 podregionalpersons.19.custom: "Mientras la Inquisición cierra el cerco sobre tu ciudad, continúas tu investigación..."
 podregionalpersons.19.b: "...Olvidemos todo esto"
 podregionalpersons.19.customb: "Olvidas esta caza y te mantienes oculto mientras la Inquisición rastrea el lugar"
 podregionalpersons.20.t: "El Monstruo III"
 podregionalpersons.20.desc: "Te ha encontrado. El monstruo que aterrorizó tu ciudad y puso en fuga a todo un ejército de inquisidores está ante ti. Un hombre alemán sorprendentemente promedio llamado Strohmann observa con calma a tus inquietos cortesanos.\n«He oído mucho sobre los de tu clase. Fascinante, en realidad. Me encantaría aprender más. ¿Podríamos llegar a un acuerdo? Yo te ayudo a lidiar con esos molestos inquisidores y, a cambio, me cuentas todo lo que hay que saber sobre la biología vampírica».\nEste hombre está claramente desequilibrado e, incluso siendo mortal, es capaz de incomodar a la mayoría de la gente. Lo cual es algo que podrías aprovechar..." 
 podregionalpersons.20.a: "Una propuesta intrigante"
 podregionalpersons.20.b: "Es el comienzo de una hermosa amistad..."
 podregionalpersons.21.t: "El Monstruo II"
 podregionalpersons.21.desc: "Salió mal. Terriblemente.\nNo has encontrado ninguna pista sobre el monstruo y, lo que es peor, ha empezado a atacar a tu propia gente; ya tienes un agente desaparecido que sospechas que no volverá. O no volverá entero.\nA medida que los cuerpos se acumulan, la ciudad está en pánico y ya escuchas informes de un equipo de élite de agentes de Dios en camino para purgar la ciudad. Incluso si eso significa reducirla a cenizas.\n¡Y todavía no tienes ni la más remota idea de quién o qué es esta cosa! Tu corte está en Frenesí, suplicándote que te mantengas oculto y olvides este maldito empeño antes de que sea demasiado tarde..." 
 podregionalpersons.21.a: "¡Conoceré la verdad, incluso si tengo que encontrarla yo mismo!"
 podregionalpersons.21.custom: "Mientras la Inquisición cierra el cerco sobre tu ciudad, continúas tu investigación..."
 podregionalpersons.21.b: "...Olvidemos todo esto"
 podregionalpersons.21.customb: "Olvidas esta caza y te mantienes oculto mientras la Inquisición rastrea el lugar"
 podregionalpersons.22.t: "El Silencioso"
 podregionalpersons.22.desc: "Un vampiro llamado Bakr ha sido traído ante ti. Este Assamita ha atacado a un grupo de caballeros de la Séptima Cruzada cerca de tu área de influencia sin tu bendición. Este comportamiento no puede tolerarse, ya que seguramente atraerá atención no deseada a tu dominio.\nBakr se disculpa y explica que estaba liberando a un joven guerrero musulmán, uno al que pretende $pod_Embrace$. Propone una suma global de oro para demostrar que no pretendía faltarte el respeto. Podrías aceptarla... o podrías tomar esta tentadora perspectiva como tuya, a pesar de no saber mucho sobre él todavía." 
 podregionalpersons.22.a: "Echa a Bakr y lleva a su protegido ante mí"
 podregionalpersons.22.custom: "Aprenderás más sobre este joven guerrero, pero esto podría tener consecuencias"
 podregionalpersons.22.b: "Estás perdonado"
 podregionalpersons.23.t: "El Silencioso II"
 podregionalpersons.23.desc: "Aprendiste el nombre del joven al que «rescataste» de Bakr, Tariq. Lamentablemente, los cruzados también se han enterado de que su prisionero está ahora bajo tu cuidado y parecen sorprendentemente decididos a recuperarlo. Lo suficiente como para lanzar un asalto a gran escala y bastante temerario contra tu dominio.\nPuedes intentar repelerlos, pero corres el riesgo de atraer aún más atención no deseada con tu Destreza sobrenatural. O podrías dejarle Tariq a ellos y simplemente olvidar esta molestia." 
 podregionalpersons.23.a: "Espero que valga la pena..."
 podregionalpersons.23.custom: "Dejas a Tariq, y toda esta historia, atrás"
 podregionalpersons.23.b: "No voy a lidiar más con esto"
 podregionalpersons.23.effect.success.desc: "Una victoria; ahora toca ocuparse de tu protegido..."
 podregionalpersons.23.critical.failure.effect.desc: "Logran recuperar a Tariq..."
 podregionalpersons.23.critical.failure: "Recuperaron a Tariq..."
 podregionalpersons.24.t: "El Silencioso III"
 podregionalpersons.24.desc: "Lidias bastante bien con el contraataque de los cruzados. Lo que no anticipaste, sin embargo, fue la muerte repentina de tus guardaespaldas y el aura de silencio aún más repentina que rodeó tu tienda. Solo se rompe por un tenue «Voy a recuperar lo que es mío» cuando de repente te das cuenta de que Bakr está aquí, y no ha olvidado que le robaste a su futuro Chiquillo.\nAhora tienes que lidiar con un poderoso y viejo Assamita decidido a tu destrucción, contando solo con un joven, aunque valiente, mortal a tu lado..." 
 podregionalpersons.24.a: "Bailemos..."
 podregionalpersons.24.custom: "No muy glorioso, pero sí eficiente"
 podregionalpersons.24.b: "Simplemente agarraré a Tariq y saldré corriendo como un loco"
 podregionalpersons.24.effect.success.desc: "¡Una victoria, Tariq es finalmente tuyo!"
 podregionalpersons.24.critical.failure.effect.desc: "Si fallas, tu muerte será rápida..."
 podregionalpersons.24.critical.failure: "Y así termina todo..."
 podregionalpersons.24.success: "¡Ganaste!"
 podregionalpersons.25.t: "Las secuelas de un sueño"
 podregionalpersons.25.desc: "A pesar de ser un asunto moralmente dudoso, la Cuarta Cruzada ha traído grandes riquezas a las ciudades-estado de Italia, principalmente de reliquias griegas saqueadas. Muchas personas, incluidos los $pod_cainites$ bizantinos, también están huyendo del caos y buscando refugio en otros lugares.\nRecientemente has oído hablar de una caravana que viaja no muy lejos de tus tierras. Como la mayoría de los refugiados, serían presas fáciles para tus agentes, y existe la posibilidad de robar cualquier riqueza que puedan llevar consigo.\nOtro curso de acción sería darles la bienvenida en tu corte. Un acto noble que también podría traer nuevas posibilidades... nadie ha dicho jamás que seas generoso sin una razón." 
 podregionalpersons.25.a: "Demos la bienvenida a nuestros pobres primos"
 podregionalpersons.25.b: "¡Traedme cualquier cosa que tenga valor!"
 podregionalpersons.25.c: "Tales asuntos están por debajo de mí"          
 podregionalpersons.26.t: "Las secuelas de un sueño II"
 podregionalpersons.26.desc: "Los refugiados bizantinos están agradecidos por tu ayuda. Hablan de su gran ciudad, Constantinopla, y de su líder espiritual, aún más grande: Miguel.\nEl Patriarca del Sueño ha caído junto con su ciudad, pero siguen hablando de él como una entidad casi más divina que un simple $pod_cainite$. Como regalo, uno de ellos te ofrece un fragmento del «espejo» de Santa Sofía donde Miguel habitaba antes de su caída. Podrías aceptarlo... pero definitivamente hay algo extraño en esta reliquia." 
 podregionalpersons.26.a: "Tu compañía es suficiente, gracias"
 podregionalpersons.26.b: "...mi tesoro"
 podregionalpersons.27.t: "Las secuelas de un sueño II"
 podregionalpersons.27.desc: "Te has deshecho fácilmente de las escasas defensas de la caravana. No hay tanto botín como esperabas, pero sigue siendo suficiente para que valga la pena. Sin embargo, un objeto en particular ha sido objeto de una feroz disputa entre tus hombres durante el reparto del botín.\nEste pequeño trozo de vidrio, quizás de un espejo o una ventana, tiene un efecto fascinante en las personas, como si llamara a su propia alma. Conoces a Miguel, el vampiro casi divino de Constantinopla antes de su caída... ¿Podría estar relacionado con él?" 
 podregionalpersons.27.a: "Solo me llevaré el oro"
 podregionalpersons.27.b: "¡Dame eso!"
 podregionalpersons.28.t: "Las secuelas de un sueño III"
 podregionalpersons.28.desc: "El fragmento ha estado siempre a tu lado estos últimos días. ¡Incluso está en tus sueños! Sueños de Constantinopla, un imperio, una trinidad de Matusalén unidos hacia una utopía mayor...\nPuedes sentir cómo erosiona lentamente tu Fuerza de Voluntad y te hace recordar cosas que ni siquiera deberías saber. Antes de que pase mucho tiempo, ya no serás la misma persona, y esta podría ser tu última oportunidad de mantener tu cordura intacta..." 
 podregionalpersons.28.a: "El Sueño es mi realidad"
 podregionalpersons.28.b: "¡No soy el títere de nadie!"
 podregionalpersons.29.t: "Padre Cráneo"
 podregionalpersons.29.desc: "Mientras la mortal Reconquista sigue arreciando en Iberia, se te ha presentado una oportunidad. Durante una batalla, se ha visto a un soldado llamado Roderigo mostrando un comportamiento extraño y poderes aún más extraños. Los rumores dicen que es uno de los legendarios Magos, los maestros de la manipulación de la realidad. Probablemente sea uno joven, o tus agentes ciertamente no habrían podido llevarlo ante tu corte para una audiencia.\nEl hombre tranquilo aparentemente no se ve afectado por tu asamblea, pareciendo contento con estudiaros a todos desde el rabillo del ojo. ¿Qué harás con él?" 
 podregionalpersons.29.a: "Tengo acceso a muchos escritos que podrían resultarte interesantes"
 podregionalpersons.29.b: "Engañarle para que se ponga a tu servicio"
 podregionalpersons.29.effect.success.desc: "Roderigo se queda en tu corte por ahora"
 podregionalpersons.29.critical.failure.effect.desc: "Roderigo abandona tu corte"
 podregionalpersons.29.critical.failure: "Roderigo se ha ido..."
 podregionalpersons.29.c: "No me sirve de nada"
 podregionalpersons.30.t: "Padre Craneo II"
 podregionalpersons.30.desc: "Roderigo se ha adaptado bien a tu corte y está disfrutando aprendiendo más sobre la muerte de ti y de otros vampiros. Su fascinación por el más allá parece no tener límites y, aunque aprendes mucho conversando con él, debes admitir que está empezando a inquietarte.\nPuedes interrumpir la investigación de Roderigo dándole el Abrazo y poniéndolo bajo tu influencia, o simplemente esperar y ver qué sucede." 
 podregionalpersons.30.a: "Aprendamos más juntos"
 podregionalpersons.30.b: "Es hora de unirte a nosotros"
 podregionalpersons.31.t: "Padre Cráneo"
 podregionalpersons.31.desc: "Roderigo ha aceptado con deber tu decisión de detener su investigación y potencialmente darte el $pod_Embrace$. Como siempre, se mantiene extrañamente callado sobre sus sentimientos al respecto y no sabes si lo considera un castigo o una recompensa.\nIndependientemente de la verdad, ahora está disponible en tu corte para cualquier tarea o futuro que elijas." 
 podregionalpersons.31.a: "Un nuevo destino le aguarda"
 podregionalpersons.32.t: "Padre Craneo III"
 podregionalpersons.32.desc: "Tu invitado mago ha descubierto verdades vertiginosas sobre la muerte y el más allá, cosas que ni siquiera te atreverías a considerar antes de su llegada a tu corte.\nSigue manteniendo la calma ante tales asuntos e informa claramente de que, si continúas dándole tu patrocinio, mucho más estará al alcance de su mano. Pero tienes la sensación de que estás yendo demasiado lejos demasiado rápido..." 
 podregionalpersons.32.a: "¡La verdad está tan cerca!"
 podregionalpersons.32.b: "Detengámonos aquí"
 podregionalpersons.33.t: "Padre Craneo IV"
 podregionalpersons.33.desc: "En estas noches, apenas estás presente en tu corte, prefiriendo conversar con Roderigo sobre sus fascinantes reflexiones sobre la muerte y el Inframundo. ¡El mago incluso parece estar cerca de abrir un portal al propio Enoch, la legendaria ciudad de los Progenitores! ¿Qué maravillas aguardan allí listas para que las reclames?\nNo puedes esperar para continuar este fascinante Viaje, pero una sensación persistente te detiene. Es como si estuvieras mirando directamente al abismo..." 
 podregionalpersons.33.a: "¿Qué hay más allá?"
 podregionalpersons.33.b: "¡Debo detener esta locura ahora mismo!"
 podregionalpersons.33.custom: "Última oportunidad para dar marcha atrás..."
 podregionalpersons.34.t: "Padre Craneo V"
 podregionalpersons.34.desc: "¡Viste Enoch! Viste la maravillosa ciudad, el Trono Negro de Caín... ¡todo! Roderigo se ha ido, pero ya no es necesario, pues las cosas están mucho más claras para ti ahora. Estás por encima de las mezquinas preocupaciones de otros vampiros porque conoces la verdad. Incluso si no puedes recordarla la mayoría de las veces...\nEn fin, no importa, ¡viste Enoch!... ¿o fue Irad? Todo está tan borroso..." 
 podregionalpersons.34.a: "Ahora estoy muy por encima de la política mezquina"
 podregionalpersons.35.t: "El Sabueso"
 podregionalpersons.35.desc: "Mientras Inglaterra sigue librando su guerra aparentemente eterna contra Francia, te enteras de una oportunidad presentada por este conflicto. Un mortal llamado Edmund FitzHenry parece ser algo más de lo que aparenta. Al parecer, un bastardo de una casa noble menor, todo indica que el joven Edmund sabe mucho más sobre lo sobrenatural de lo que la mayoría de los mortales saben.\nEste hecho podría explicar sus recientes y fulgurantes victorias en los campos de batalla de Francia. Podrías investigar más a fondo, pero otros vampiros ya le siguen la pista." 
 podregionalpersons.35.a: "Les convenceré de que es mi presa"
 podregionalpersons.35.b: "Enviarles por una pista falsa"
 podregionalpersons.35.effect.success.desc: "Han sido desviados de tu objetivo"
 podregionalpersons.35.critical.failure.effect.desc: "Siguen compitiendo contigo"
 podregionalpersons.35.c: "No tengo uso para este mortal"
 podregionalpersons.37.t: "El Sabueso: Desviado"
 podregionalpersons.37.desc: "Tus rivales siguen pisándole los talones a Edmund, y están haciendo que tu investigación sea aún más difícil. Has intentado ser sutil hasta ahora, pero podría ser el momento de recurrir a medidas más drásticas si quieres continuar con esta búsqueda." 
 podregionalpersons.37.a: "Todo el mundo tiene un precio"
 podregionalpersons.37.b: "Lanza la Inquisición tras su pista. Eso les mantendrá ocupados."
 podregionalpersons.37.c: "Esto no merece la pena"
 podregionalpersons.36.t: "El Sabueso II"
 podregionalpersons.36.desc: "Estás empezando a comprender mejor el pasado de este Edmund FitzHenry. En realidad es lo que los Lupinos llaman un «Kinfolk», que al parecer significa ser miembro de la familia extendida de estas bestias salvajes. Eso explicaría su gran fuerza y su inquietante conocimiento de lo sobrenatural.\nLo que es aún más interesante es que huye de ellos por algún motivo, lo que podría significar que agradecería tu ayuda. Lamentablemente, esto también significa que estos hombres lobo se le están acercando y no aceptarán bien tu interferencia..." 
 podregionalpersons.36.a: "Estas bestias respetan la fuerza. Vamos a reventarles algunos cráneos."
 podregionalpersons.36.b: "¡Prepara una emboscada!"
 podregionalpersons.36.effect.success.desc: "Los lobos son repelidos hacia sus bosques"
 podregionalpersons.36.critical.failure.effect.desc: "Los hombres lobo no están asustados"
 podregionalpersons.36.c: "Se está volviendo demasiado peligroso. Me rindo."
 podregionalpersons.38.t: "El Sabueso: Desviado"
 podregionalpersons.38.desc: "No has logrado deshacerte de los hombres lobo que buscan a Edmund. Y ahora, claramente también te siguen la pista a ti. Antes de que puedas continuar con tu caza, primero debes lidiar con ellos de una vez por todas.\n¿Intentarás desviarlos tú mismo o simplemente dejarás que descarguen su ira contra tus dominios?" 
 podregionalpersons.38.a: "Humo y espejos"
 podregionalpersons.38.b: "Que haya unos pocos mortales menos en mi dominio no es gran preocupación"
 podregionalpersons.38.c: "Esto no merece la pena"
 podregionalpersons.39.t: "El Sabueso III"
 podregionalpersons.39.desc: "Finalmente has logrado rastrear a este Edmund FitzHenry hasta un sombrío campo de batalla francés. El hombre ha estado a la altura de su reputación, siendo un comandante astuto y un combatiente sólido, claramente reforzado por la sangre Lupina en sus venas.\nPero la mortalidad no espera a nadie, así que te has acercado a él con una oferta de protección contra los cazadores de hombres lobo y una oferta aún más tentadora de inmortalidad. Edmund, obviamente, está interesado y se ha unido a tu corte.\nSimplemente te pide que le llames por su nombre de nacimiento, ahora que ya no tiene que ocultar su linaje." 
 podregionalpersons.39.a: "Bienvenido a la noche, «Talley»"
 #podregionalpersons.41.t: "Storm From The East"
 #podregionalpersons.41.desc: "The Gangrel bloodline known as [Glossary('Anda','podgloss.anda')] has enjoyed a long period of prosperity since the rise of their mortal counterparts, the Mongols, as masters of China. They have used this connection to assume control over several key cities of the Celestial Empire, killing or dislodging the native $pod_wan_kuei$.\nBut this time has come to an end, as the Yuan dynasty lies shattered by the rise of the Ming, the $pod_wan_kuei$ are back, unified under a new structure, the 'Quincunx'. They have already purged the Anda bloodline from their native land and most of the eastern steppes and now are looking westwards. It seems they won't stop until the last Anda lies on the ground, dying a slow and painful death..." 
 #podregionalpersons.41.a: "A reckoning has come"
 #podregionalpersons.41.player_warningb: "A powerful army of $pod_wan_kuei$ will appear in Orgoo soon"
 #first_quincunxwarlord_event_troops: "Quincunx Vanguard"

                 
