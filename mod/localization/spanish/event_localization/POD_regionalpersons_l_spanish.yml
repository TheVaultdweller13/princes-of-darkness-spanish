 podregionalpersons.43.t: "La Hechicera"
 podregionalpersons.43.desc: "Una extraña noble francesa ha estado viajando por Argel recientemente haciendo muchas preguntas sobre lo sobrenatural. Parece experta, ya que ha sido capaz de localizar la posición de tu corte. Aunque no estás seguro de sus intenciones, te desconcierta cuando se presenta una noche e indica que desea trabajar contigo.\nEsta «Elaine de Calinot» afirma ser una hechicera en una misteriosa misión en África, y podría necesitar ayuda para prepararse para su expedición hacia el interior. Estima que tú eres su mejor oportunidad para este empeño y se ofrece a enseñarte algunos secretos místicos a cambio." 
 podregionalpersons.43.a: "Podemos llegar a un acuerdo"
 podregionalpersons.43.b: "No estoy interesado"
     
 podregionalpersons.44.t: "La Hechicera II"
 podregionalpersons.44.desc: "Elaine ha regresado, eufórica de emoción. Aunque no quiere decirte exactamente qué ha encontrado, está claramente ansiosa por más. Su oferta es bastante sencilla: tú refuerzas su séquito de guardaespaldas y ella te enseñará aún más sobre la «magia verdadera».\nAunque la perspectiva es ciertamente tentadora, aún te falta saber qué ocurrió exactamente con la primera expedición, y la mirada de intensidad casi de locura en los ojos de Elaine no es tranquilizadora..." 
 podregionalpersons.44.a: "Tendrás tu escolta"
  
 podregionalpersons.45.t: "La Hechicera III"
 podregionalpersons.45.desc: "Elaine ha vuelto, irrumpiendo casi frenéticamente en tu corte. Es difícil entenderla, ya que su discurso es bastante incoherente, pareciéndose más a los desvaríos de un loco que a la mujer serena que conociste antes. Logras comprender que todavía quiere tu ayuda para una búsqueda aún más profunda de... algo, o alguien.\nA pesar de parecer bastante desequilibrada, sabes que aún sería capaz de enseñarte algunos conceptos interesantes de Magia de Sangre, pero ¿realmente te importa arriesgarte en este punto? También podrías intentar convencerla de que abandone esta misión absurda antes de que sea demasiado tarde." 
 podregionalpersons.45.a: "¿Más campeones? Por supuesto"
 podregionalpersons.45.b: "¡Recupera el sentido!"
 podregionalpersons.45.effect.success.desc: "La convences para que se detenga"
 podregionalpersons.45.critical.failure.effect.desc: "Sale furiosa de tu corte"

 dreadful_omen_modifier: "Presagio funesto"
 dreadful_omen_modifier_desc: "Algo va mal, puedes sentirlo..."

 podregionalpersons.46.t: "La hechicera IV"
 podregionalpersons.46.desc: "A Elaine la encontraron... bueno, lo que queda de ella en cualquier caso. Tus agentes la localizaron en una aldea remota donde masacró a gran parte de la población antes de morir. Por lo que han averiguado, parece que de algún modo se volvió feral, como si La Bestia se hubiera apoderado de ella... pero no era un vampiro, que tú sepas.\nNo importa, no volverás a saber de ella, pero no puedes quitarte la sensación de que husmeó en algo muy peligroso..." 
 podregionalpersons.46.a: "Todo este asunto fue una idea muy mala desde el principio"

 Elaine_de_Calinot: "Elaine de Calinot"
 nick_inquisitive_sorceress: "Hechicera inquisitiva"

 podregionalpersons.47.t: "La hechicera IV"
 podregionalpersons.47.desc: "Convenciste a Elaine para que detuviera su comportamiento temerario... en cierto modo. Le insinuaste que también podría aprender mucho si trabajaba más estrechamente contigo, ya que el mundo vampírico también está lleno de secretos. Tu maniobra dio resultado y ha aceptado quedarse en tu corte, atenta a cualquier novedad que despierte su interés.\nAhora está en tu red y podrías usarla para tu propio beneficio, o incluso considerar el $pod_Embrace$. Tiene talento, aunque a veces esté algo desequilibrada, pero tú has visto y domado cosas peores." 
 podregionalpersons.47.a: "Que tengas una estancia agradable"

 podregionalpersons.48.t: "El mameluco"
 podregionalpersons.48.desc: "Como $pod_cainite$ con intereses en Egipto, tienes agentes en el liderazgo mortal fatimí del señorío. Bueno... los tenías.\nTe acaba de llegar un informe de que tus agentes fueron hallados muertos ayer en una calle de El Cairo. Este tipo de cosas pasan, ¿pero varios de ellos al mismo tiempo y sin previo aviso? Eso es más peculiar.\nPuedes dar el caso por perdido o investigar más." 
 podregionalpersons.48.a: "Enviar nuevos agentes"
 podregionalpersons.48.b: "No estoy interesado"
     
 podregionalpersons.49.t: "El mameluco II"
 podregionalpersons.49.desc: "Bueno... estos nuevos agentes no duraron mucho. Fueron hallados muertos como los anteriores esta misma noche. Aun así, esto no ha sido en vano, pues has oído el rumor de que un sorprendente mortal llamado «Mukhtar Bey» se ha unido recientemente a la corte fatimí.\nMameluco (o guerrero esclavo) de nacimiento, este mortal es bastante capaz y hábil. También muy leal, ya que parece ser la causa del repentino aumento de la protección de los líderes fatimíes.\nEste hombre podría merecer una investigación más profunda." 
 podregionalpersons.49.a: "Enviar nuevos agentes"
 podregionalpersons.49.effect.success.desc: "Has encontrado algo..."
 podregionalpersons.49.critical.failure.effect.desc: "Nada interesante"

 podregionalpersons.50.t: "El mameluco III"
 podregionalpersons.50.desc: "Parece que Mukhtar te ha encontrado antes de que tú lo encontraras a él. Acompañado por una fuerte comitiva de mamelucos veteranos, se está acercando a tu corte, considerándola una amenaza para sus amos fatimíes.\nTienes poco tiempo para planificar este asalto frontal. Mukhtar, por su parte, ha venido preparado; has notado una buena cantidad de antorchas y estacas en la fuerza enemiga. Podrían haber otras opciones, como huir o usar cualquier suciedad que hayas podido encontrar sobre él anteriormente." 
 podregionalpersons.50.a: "¡Nos plantaremos y lucharemos!"
 podregionalpersons.50.effect.success.desc: "Mukhtar es repelido"
 podregionalpersons.50.critical.failure.effect.desc: "Una batalla difícil"
 podregionalpersons.50.b: "Sé algo interesante..."
 podregionalpersons.50.custom: "Esta opción está disponible porque tuviste éxito en el desafío de intriga anterior"
 podregionalpersons.50.c: "¡Huye!"

 podregionalpersons.51.t: "El mameluco IV"
 podregionalpersons.51.desc: "Una batalla reñida, donde tu victoria se debió principalmente a la repentina desaparición de Mukhtar durante el combate. Aunque no está claro qué ocurrió realmente, tus agentes tardaron varios días en volver a encontrarlo, solo y... bastante muerto.\nParece que alguien lo abrazó apresuradamente durante el asalto, pero el proceso no cuajó del todo, dejándolo como un simple Caitiff. Aunque te desconcierta saber quién fue exactamente su [Glossary('Sire','game_concept_Sire_desc')], la victoria es tuya al final. Solo y confundido, Mukhtar también sería un blanco fácil para llevarlo a tu mazmorra si así lo decides." 
 podregionalpersons.51.a: "¿Qué hacer contigo...?"
 
 podregionalpersons.52.t: "El mameluco IV"
 podregionalpersons.52.desc: "Una batalla reñida en la que apenas sobreviviste, debido principalmente a la repentina desaparición de Mukhtar durante el combate. Esto hizo que sus hombres perdieran el ánimo y que tu defensa se mantuviera firme.\nAunque no está claro qué ocurrió realmente, tus agentes tardaron varios días en tener noticias suyas. Parece que Mukhtar fue abrazado durante el asalto por un vampiro desconocido, pero el proceso no cuajó del todo, resultando en que se convirtiera en un Caitiff. Este golpe de suerte te ayudó a sobrevivir la noche, pero Mukhtar también lo hizo, y es probable que tenga una cuenta pendiente contigo." 
 podregionalpersons.52.a: "Uno más o uno menos..."
 
 podregionalpersons.53.t: "El mameluco IV"
 podregionalpersons.53.desc: "Durante tu investigación sobre Mukhtar Bey, te topaste con algo interesante. El mameluco es, en realidad, un hombre bastante temeroso, que lo oculta tras sus deberes con sus hombres y su fuerte sentido de la lealtad.\nConociendo esta debilidad, te preparaste en consecuencia, y una gran exhibición de fuerza sobrenatural (realmente es bastante refrescante desatarse de vez en cuando) fue suficiente para debilitar el control de Mukhtar sobre su lado cobarde. Sin su comandante, sus compañeros fueron despachados fácilmente, y ahora lo tienes a tu merced.\nA pesar de este evidente defecto suyo, podría seguir siendo valioso para ti de alguna manera." 
 podregionalpersons.53.a: "¿Qué hacer contigo...?"
 
 Mukthar_Bey: "Mukhtar Bey"
 
 genevra_interference_modifier: "Interferencia"
 genevra_interference_modifier_desc: "Alguien está interfiriendo en tus asuntos en esta zona."

 podregionalpersons.64.t: "La noble"
 podregionalpersons.64.desc: "Alguien está interfiriendo en los asuntos de la Inquisición en Italia. Todo empezó con lo que parecía ser una toma de poder sin complicaciones: una noble denunciando a sus rivales ante los cazadores, acusándolas de albergar vampiros en sus hogares (lo cual era cierto). Luego escaló a otras acusaciones y la influencia de esta Genevra creció hasta tal punto que muchas células de la Inquisición cuentan ahora con ella para su recopilación de inteligencia.\nSin embargo, esto tiene un efecto secundario: Genevra solo pone a los inquisidores tras el rastro de vampiros muy menores, y las cacerías de los objetivos más grandes se ven desviadas por toda la presa fácil reclamada por unos entusiastas inquisidores. Quizás quieras intervenir en esta situación creciente." 
 podregionalpersons.64.a: "Ayudémosla discretamente."
 podregionalpersons.64.b: "¡Traedmela!"
 podregionalpersons.64.c: "O puede que no lo haga."
                    
 podregionalpersons.65.t: "La noble II"
 podregionalpersons.65.desc: "Por fin has capturado a esta noble que interfiere. Esto ha sido mucho más difícil de lo que esperabas, ya que tenía sus garras muy hundidas en la Inquisición italiana, lo que le permitía ir un paso por delante de ti. Aun así, tenías a Dios de tu lado y el respaldo total de talentosos inquisidores, por lo que solo podría evitarte durante un tiempo.\nEsta Genevra ha sido traída ante ti. Su indesejada intervención en tus asuntos ha terminado, pero aún tienes que decidir qué hacer con ella. Claramente es una mujer competente, pero ¿puede ser redimida y digna de confianza?" 
 podregionalpersons.65.a: "Podría tener usos para ti."
 podregionalpersons.65.b: "¡A la hoguera, bruja!"
                    
 podregionalpersons.66.t: "La noble II"
 podregionalpersons.66.desc: "Tu ayuda indirecta a la noble que interfería ha sido productiva. Con tu sutil apoyo, Genevra sigue dirigiendo a la Inquisición hacia la caza de vampiros menores e irrelevantes, dejándote a ti y a tus hermanos, que son realmente importantes, libres para hacer lo que os plazca.\nLa mujer es hábil y podrías dejar que continúe con su trabajo. Otra opción sería empezar a extraer discretamente información de sus contactos, lo que podría ayudarte a saber más sobre los movimientos de los ejércitos actuales de la Inquisición." 
 podregionalpersons.66.a: "Deja que continúe."
 podregionalpersons.66.b: "Empieza a coaccionar a su red de contactos."
                    
 podregionalpersons.67.t: "La noble dama III"
 podregionalpersons.67.desc: "Parece que no eras el único vampiro interesado en Genevra. Un terrateniente menor llamado del Georgio ha empezado a hacer movimientos para darle el Abrazo.\nEsto te molesta en varios niveles. Primero, significa que la interferencia de Genevra ha terminado, ya que la Inquisición seguramente la descubrirá si se convierte en vampiro. En segundo lugar, no te agrada que este tipo de idiotas menores anden merodeando por tu patio trasero, aunque no lo sepan.\nLamentablemente, del Georgio actuó primero, lo que significa que tendrás que negociar con él si quieres recuperar a Genevra. Incluso sin su influencia en la Inquisición, ella podría seguir siendo un activo útil." 
 podregionalpersons.67.a: "Delata al sujeto ante la Inquisición."
 podregionalpersons.67.b: "Simplemente sobornadlo."
 podregionalpersons.67.c: "Irrumpe en su casa y amenázalo."
 podregionalpersons.67.d: "Simplemente quiebra su mente."
 podregionalpersons.67.e: "No merece la pena."
 
 
 
