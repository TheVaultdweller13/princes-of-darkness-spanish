 judge_research_origins_wraiths_objective_decision_desc: "Sabemos que YHWH creó todas las cosas y nos eligió para ser Su pueblo. Sin embargo, hay muchas cosas en su creación que aún no comprendemos. Debemos buscar los orígenes de los $POD_splat_wraith_plural$, posiblemente incluso contactándolos nosotros mismos a través de nuestras meditaciones. Registraremos nuestros hallazgos en una única obra titulada La Havanah."
 judge_research_origins_wraiths_objective_decision_confirm: "Encontremos la verdad"
 judge_research_origins_wraiths_objective_decision_tooltip: "Es la gloria de Dios ocultar las cosas, pero la gloria de los reyes es investigarlas."
 judge_research_origins_wraiths_objective_decision_benefit: "Descubrimos los orígenes de los $POD_splat_wraith_plural$"

 judge_research_origins_kueijin_objective_decision: "Identificar los orígenes de los Kuei-Jin"
 judge_research_origins_kueijin_objective_decision_desc: "Sabemos que YHWH creó todas las cosas y nos eligió para ser Su pueblo. Sin embargo, hay muchas cosas en su creación que aún no comprendemos. Debemos buscar los orígenes de los $pod_kueijin$ o Wan Xian. Quizá encontremos su medio original de retorno, antes de su corrupción. Registraremos nuestros hallazgos en una única obra titulada La Havanah."
 judge_research_origins_kueijin_objective_decision_confirm: "Encontremos la verdad"
 judge_research_origins_kueijin_objective_decision_tooltip: "Es la gloria de Dios ocultar las cosas, pero la gloria de los reyes es investigarlas."
 judge_research_origins_kueijin_objective_decision_benefit: "Descubrimos los orígenes de los $POD_splat_kueijin$"

