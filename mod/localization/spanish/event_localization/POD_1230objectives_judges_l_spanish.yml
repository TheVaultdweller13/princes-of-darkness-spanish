 pod_judges_promised_land: "Tierra prometida"

 e_judges_title: "Jueces"
 e_judges_title_adj: "Juez"
 
 judge_reclaim_promised_land_objective_decision: "Asentar a los Jueces"
 judge_reclaim_promised_land_objective_decision_desc: "Los Jueces son una organización descentralizada en la que cada uno protege principalmente su propia comunidad. Podríamos tomar como ejemplo a la Inquisición de las Sombras y unirnos bajo un estandarte común para ser mucho más eficientes. Solo necesitamos un líder que nos reúna y una victoria fundacional para lograrlo."
 judge_reclaim_promised_land_objective_decision_confirm: "Un nuevo comienzo."
 judge_reclaim_promised_land_objective_decision_tooltip: "Guardianes de un pueblo, uniéndose."

 judge_get_mystic_decision: "Estudiar los caminos de los sabios"
 judge_get_mystic_decision_desc: "Para cumplir debidamente mis deberes, debo estudiar los antiguos y místicos caminos de mis antepasados. Me beneficiaré de su sabiduría y me convertiré en un verdadero sabio."
 judge_get_mystic_decision_confirm: "Empecemos"
 judge_get_mystic_decision_tooltip: "Estudiaré los antiguos caminos para convertirme en un sabio"

 judge_verify_christian_claim_objective_decision: "El asunto de la Cruz"
 judge_verify_christian_claim_objective_decision_desc: "Antes de que podamos comprometernos plenamente a ayudar a la Iglesia Cristiana en su caza de los Malditos, debemos resolver nuestras diferencias teológicas con ellos."
 judge_verify_christian_claim_objective_decision_confirm: "El pragmatismo debe reinar hoy"
 judge_verify_christian_claim_objective_decision_tooltip: "Nuestros distanciados descendientes teológicos."

 judge_contact_magi_objective_decision: "Contactar con los Magos"
 judge_contact_magi_objective_decision_desc: "Siguiendo las tradiciones establecidas por el profeta Daniel, los Magos han practicado durante mucho tiempo una forma más lineal de magia de frontera. Además, se encuentran entre los pocos Jueces Mizrahíes que quedan en estos días oscuros. Restablezcamos el contacto con ellos mientras buscamos coordinar las diferentes células."
 judge_contact_magi_objective_decision_confirm: "Hablemos con ellos"
 judge_contact_magi_objective_decision_tooltip: "Aprenderemos de los Mizrahim y los Magos"

 judge_contact_ashkenazic_objective_decision: "Contactar con los Jueces Ashkenazíes"
 judge_contact_ashkenazic_objective_decision_desc: "Más que la mayoría, los Jueces Ashkenazíes han explorado y estudiado el Sefer Yetzirah. La capacidad de sus rabinos Baal Shem para crear Constructos vivientes es bien conocida y les ha permitido sobrevivir entre los Malditos. Además, han ganado la protección de dos Malditos en la región. Restablezcamos el contacto con ellos mientras buscamos coordinar las diferentes células."
 judge_contact_ashkenazic_objective_decision_confirm: "Hablemos con ellos"
 judge_contact_ashkenazic_objective_decision_tooltip: "Aprenderemos de los Ashkenazim"
 judge_contact_ashkenazic_objective_decision_befriend_josef: "El Defensor de Praga, [GetScriptedCharacterByHistoryID('505089').GetFirstName], debe ser tu [friend|E] [lover|E] [soulmate|E] o miembro de tu [GetPlayer.Custom('PODCoterie')], si aún está activo y con vida"
 judge_contact_ashkenazic_objective_decision_befriend_yitzhak: "El Rabino de las Cenizas, [GetScriptedCharacterByHistoryID('790246').GetFirstName], debe ser tu [friend|E] [lover|E] [soulmate|E] o miembro de tu [GetPlayer.Custom('PODCoterie')], si aún está activo y con vida"
 judge_contact_ashkenazic_objective_decision_know_theurgist: "Está prohibido estudiar el Sefer Yezirah a solas. Solo en grupos de dos o tres puede aprenderse. Encuentra a otro #TOOLTIP:GAME_TRAIT,theurgist,[GetNullCharacter] #L Kabalista#!#! que sea tu [friend|E], [lover|E], [soulmate|E], o miembro de tu [GetPlayer.Custom('PODCoterie')] para que pueda estudiar contigo."
 judge_contact_ashkenazic_objective_decision_popular_in_prague: "El Condado de [GetTitleByKey('c_praha').GetNameNoTier] debe estar dentro de tu territorio y tener una [county_opinion|E] de 35 o superior por parte de su poseedor."

 judge_contact_esraelawi_objective_decision: "Contactar con los Jueces Esraelawíes"
 judge_contact_esraelawi_objective_decision_desc: "Para proteger a nuestros hermanos, todos los Jueces se ven obligados a ser soldados y guerreros. Sin embargo, los Jueces Esraelawíes han mantenido específicamente las tradiciones guerreras de la Tribu de Dan. Si demostramos nuestro valor ante ellos, podrían estar dispuestos a enseñarnos sus tradiciones."
 judge_contact_esraelawi_objective_decision_confirm: "Hablemos con ellos"
 judge_contact_esraelawi_objective_decision_tooltip: "Aprenderemos de los Esraelawíes"

 judge_contact_kochinim_objective_decision: "Contactar con los Jueces Kochinim"
 judge_contact_kochinim_objective_decision_desc: "A costa de algo de dinero y de convertirnos en figuras públicas, podemos contactar con nuestros hermanos en la India. Los Kochinim son conocidos por su red comercial y la red de inteligencia construida a su alrededor. Contactarlos debería permitirnos aprovechar ambas cualidades."
 judge_contact_kochinim_objective_decision_confirm: "Hablemos con ellos"
 judge_contact_kochinim_objective_decision_tooltip: "Aprenderemos de los Kochinim"

 judge_contact_sephardim_objective_decision: "Contactar con los Jueces Sefardíes"
 judge_contact_sephardim_objective_decision_desc: "Nuestros hermanos ibéricos y norteafricanos son famosos por su comprensión de las escrituras extra-Tanaj y su habilidad para sobrevivir en esas regiones turbulentas. Si podemos contactarlos y resolver algunas de las dificultades que enfrentan, entonces deberían ser capaces de ayudarnos con nuestros futuros esfuerzos."
 judge_contact_sephardim_objective_decision_confirm: "Hablemos con ellos"
 judge_contact_sephardim_objective_decision_tooltip: "Aprenderemos de los Sefardíes"

 judge_research_origins_mummies_objective_decision: "Identificar el origen de los Inmortales"
 judge_research_origins_mummies_objective_decision_desc: "Sabemos que YHWH creó todas las cosas y nos eligió para ser su pueblo. Sin embargo, hay muchas cosas en su creación que aún no comprendemos. Debemos buscar los orígenes de los #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Inmortales#!#!, más comúnmente conocidos como Momias. Registraremos nuestros hallazgos en una única obra titulada La Havanah."
 judge_research_origins_mummies_objective_decision_confirm: "Encontremos la verdad"
 judge_research_origins_mummies_objective_decision_tooltip: "Es la gloria de Dios ocultar las cosas, pero la gloria de los reyes es investigarlas."
 judge_research_origins_mummies_objective_decision_benefit: "Descubrimos los orígenes de la #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Inmortal#!#!"
 judge_research_origins_mummies_objective_decision_befriend_cabirus: "La Momia Independiente, [GetScriptedCharacterByHistoryID('792600').GetFirstName], debe ser tu [friend|E], [lover|E], [soulmate|E] o miembro de tu [GetPlayer.Custom('PODCoterie')], si aún está activa y con vida"

 judge_research_origins_demons_objective_decision: "Identificar los orígenes de los Caídos"
 judge_research_origins_demons_objective_decision_desc: "Sabemos que YHWH creó todas las cosas y nos eligió para ser Su pueblo. Sin embargo, hay muchas cosas en su creación que aún no comprendemos. Debemos buscar los orígenes de los #TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L Caídos#!#!, más comúnmente conocidos como Demonios. Registraremos nuestros hallazgos en una única obra titulada La Havanah."
 judge_research_origins_demons_objective_decision_confirm: "Encontremos la verdad"
 judge_research_origins_demons_objective_decision_tooltip: "Es la gloria de Dios ocultar las cosas, pero la gloria de los reyes es investigarlas."
 judge_research_origins_demons_objective_decision_benefit: "Descubrimos los orígenes de los #TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L Caídos#!#!"

 judge_research_origins_fae_objective_decision: "Identificar los orígenes de las hadas"
 judge_research_origins_fae_objective_decision_desc: "Sabemos que YHWH creó todas las cosas y nos eligió para ser Su pueblo. Sin embargo, hay muchas cosas en su creación que aún no comprendemos. Debemos buscar los orígenes de los $POD_splat_fae$, aunque la falta de textos sobre el tema nos obligará a recurrir a fuentes de información alternativas. Registraremos nuestros hallazgos en una única obra titulada La Havanah."
