 judge_research_origins_vampires_caine_n_abel_objective_decision_desc: "Sabemos que YHWH creó todas las cosas y nos eligió para ser Su pueblo. Sin embargo, hay muchas cosas en su creación que aún no comprendemos. Por encima de todo están los Malditos. El siguiente paso es investigar los orígenes del propio Caín. Registraremos nuestros hallazgos en una única obra titulada La Havanah."
