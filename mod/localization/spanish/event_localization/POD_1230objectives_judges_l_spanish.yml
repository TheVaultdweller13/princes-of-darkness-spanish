 judge_research_origins_vampires_golconda_objective_decision_desc: "Sabemos que YHWH creó todas las cosas y nos eligió para ser Su pueblo. Sin embargo, hay muchas cosas en su creación que aún no comprendemos. Por encima de todo están los Malditos. El paso final es investigar las posibilidades de redención para los Malditos. Registraremos nuestros hallazgos en una única obra titulada La Havanah."
 judge_research_origins_vampires_golconda_objective_decision_confirm: "Encontremos la verdad"
 judge_research_origins_vampires_golconda_objective_decision_tooltip: "Es la gloria de Dios ocultar las cosas, pero la gloria de los reyes es investigarlas."
