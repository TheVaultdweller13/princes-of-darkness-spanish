 judge_research_origins_mortal_magic_objective_decision_desc: "Sabemos que YHWH creó todas las cosas y nos eligió para ser Su pueblo. Sin embargo, hay muchas cosas en su creación que aún no comprendemos. Debemos buscar los orígenes de toda la magia mortal, aprendiéndolas parcialmente al conocerlas todas. Registraremos nuestros hallazgos en una única obra titulada La Havanah."
 judge_research_origins_mortal_magic_objective_decision_confirm: "Encontremos la verdad"
 judge_research_origins_mortal_magic_objective_decision_tooltip: "Es la gloria de Dios ocultar las cosas, pero la gloria de los reyes es investigarlas."
 judge_research_origins_mortal_magic_objective_decision_benefit: "Ganas acceso a los poderes de Hekau, Tan y Qiao."

 judge_research_origins_vampires_3rdgen_objective_decision: "Estudiar los orígenes de la Tercera Generación"
 judge_research_origins_vampires_3rdgen_objective_decision_desc: "Sabemos que YHWH creó todas las cosas y nos eligió para ser Su pueblo. Sin embargo, hay muchas cosas en su creación que aún no comprendemos. Por encima de todo están los Malditos. El primer paso es investigar la actividad de los [Glossary('Antediluvianos','game_concept_antediluvian_desc')] poco después del Gran Diluvio. Registraremos nuestros hallazgos en una única obra titulada La Havanah."
 judge_research_origins_vampires_3rdgen_objective_decision_confirm: "Encontremos la verdad"
 judge_research_origins_vampires_3rdgen_objective_decision_tooltip: "Es la gloria de Dios ocultar las cosas, pero la gloria de los reyes es investigarlas."
 judge_research_origins_vampires_3rdgen_objective_decision_benefit: "Descubrimos la historia de la Segunda Ciudad de los [Glossary('Antediluvianos','game_concept_antediluvian_desc')] tras el Gran Diluvio"

 judge_research_origins_vampires_2ndgen_objective_decision: "Estudiar los orígenes de la Segunda Generación"
 judge_research_origins_vampires_2ndgen_objective_decision_desc: "Sabemos que YHWH creó todas las cosas y nos eligió para ser Su pueblo. Sin embargo, hay muchas cosas en su creación que aún no comprendemos. Por encima de todo están los Malditos. El siguiente paso es investigar los orígenes de la llamada Segunda Generación y su ciudad natal de antes del Gran Diluvio. Registraremos nuestros hallazgos en una única obra titulada La Havanah."
 judge_research_origins_vampires_2ndgen_objective_decision_confirm: "Encontremos la verdad"
 judge_research_origins_vampires_2ndgen_objective_decision_tooltip: "Es la gloria de Dios ocultar las cosas, pero la gloria de los reyes es investigarlas."
 judge_research_origins_vampires_2ndgen_objective_decision_benefit: "Descubrimos la historia de la Segunda Generación y la Primera Ciudad antes del Gran Diluvio"

 judge_research_origins_vampires_lilith_n_disciplines_objective_decision: "Estudiar los orígenes de las Disciplinas"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_desc: "Sabemos que YHWH creó todas las cosas y nos eligió para ser Su pueblo. Sin embargo, hay muchas cosas en su creación que aún no comprendemos. Por encima de todo están los Malditos. El siguiente paso es investigar los orígenes de las Disciplinas de los Malditos y sus interacciones con nuestro odiado enemigo, Lilith. Registraremos nuestros hallazgos en una única obra titulada La Havanah."
