 pod1230objectives_judges.1.t: "Los Magos del Profeta"
 pod1230objectives_judges.1.desc: "Durante su tiempo sirviendo a los reyes de Babilonia y Persia, el profeta Dani'el se convirtió en el principal entre los Magos. Con su conocimiento de la hechicería y la sabiduría de Dios, Dani'el se convirtió en el Jefe de los Magos y les enseñó los misterios del Tanakh para guiarlos en su oficio. Estudiaron las estrellas en busca de señales del futuro y caminos más lineales de la teúrgia tradicional enseñada por el Talmud secreto.\n\nCon el ascenso de los Malditos y los Caídos en la región, los Magos han sido ampliamente descartados como consejeros de la corte y se han visto obligados a retirarse a las academias Geónicas. Sus poderes pueden ser un enigma para nosotros, pero nacen claramente de las enseñanzas del profeta Dani'el, lo que los convierte en aliados. Tras haber recuperado el centro de su actividad, hemos podido establecer contacto con ellos por primera vez en siglos. Con su sabiduría y la ayuda de los Jueces Mizrahim, podemos transmitir secretos que antes poseían solo unos pocos y reforzar nuestra lucha eterna contra aquellos que se esconden en las sombras."
 pod1230objectives_judges.1.a: "Juntos aprendemos."

 # Menahemite special content for Magi decision
 # Subevent so event number is a bunch of 1s
 pod1230objectives_judges.111.t: "Los maestros de Menahem"
 pod1230objectives_judges.111.desc: "Tras haber tomado Bagdad de la prole de Lilith, hemos restablecido el contacto con los Magos. Son maestros del Talmud, tanto en sus versiones públicas como ocultas, habiendo sido fundados por el profeta Daniel durante el Primer Exilio. A menudo, uno entre ellos ha ostentado el título de Rosh Yeshiva o Gaon. Este legado les ha otorgado una profunda comprensión de las artes cabalísticas y hechiceras, convirtiéndolos en aliados inestimables de los Jueces.\n\nAsí fue como los Magos conocieron a Menahem cuando este viajó a Bagdad en su búsqueda de conocimiento. Le instruyeron en el uso adecuado de los dones numinosos que Adon Olam le concedió. Revelaron la existencia de los Hijos de Lilith y otras criaturas que se deslizan por las sombras. Con su ayuda, se convirtió en el hombre poderoso y erudito que nos lideró tras la muerte de su padre y nos liberó del alcance de la oscuridad.\n\nLos Magos han oído rumores de nuestras acciones, pero no se pudo establecer un contacto formal. Ahora, ofrecen resucitar la antigua alianza y enseñarnos lo que se le entregó a Menahem. Todo lo que piden a cambio es ayuda en sus esfuerzos por comprender a las criaturas de su oscuridad para que puedan ser combatidas con mayor eficacia.\n\nCon Bagdad nuestra y el apoyo de los Magos, no hay duda de que Jerusalén será reclamada de la oscuridad."
 pod1230objectives_judges.111.a: "Sigue los pasos de Menahem y luego ve más allá"
 pod1230objectives_judges.111.b: "El candelabro brilla con más fuerza"
 house_menahemites_improved_menahem_modifier: "Los pasos de Menahem"
 house_menahemites_improved_menahem_modifier_desc: "Mientras algunos dudaron alguna vez de si Menahem era realmente el Hijo de Dawid, ahora no puede haber dudas. Puede que no haya asumido plenamente el manto de Dawid en su tiempo, pero ya hemos cumplido muchas de sus promesas y estamos listos para cumplir su destino. Nos enseñó cómo reconocer y luchar contra nuestros verdaderos enemigos, un objetivo en el que ahora nos ayudan sus maestros. Nos encontramos fortalecidos, listos para rechazar la noche."
 house_menahemites_menahem_teachers_modifier: "Los maestros de Menahem"
 house_menahemites_menahem_teachers_modifier_desc: "Así como una vez enseñaron a Menahem, ahora los Magos nos transmiten sus enseñanzas, otorgándonos conocimiento sobre aquello contra lo que luchamos. Con su ayuda, el candelabro de los Jueces brilla cada vez más fuerte, haciendo retroceder la oscuridad."

 pod1230objectives_judges.2.t: "Creadores de Golems"
 pod1230objectives_judges.2.desc: "Tras mucho esfuerzo, hemos establecido contacto con los Jueces asquenazíes y los Malditos en la región. Los Malditos no desean involucrarse en nuestra caza, solo protegen a nuestros hermanos mortales. Aunque algunos Jueces más celosos puedan discrepar de esto, estamos agradecidos por su ayuda en la defensa de nuestros hermanos.\nSus rabinos Baal Shem, los llamados «maestros del nombre», han avanzado nuestro conocimiento sobre la creación de autómatas diez veces más. Usemos estos golems para proteger a todas nuestras comunidades y erradicar de las sombras a aquellos que se alimentan de nosotros."
 pod1230objectives_judges.2.a: "Juntos protegemos."

 pod1230objectives_judges.3.t: "Tradiciones de Dan"
 pod1230objectives_judges.3.desc: "Aunque deseemos ser eruditos o rabinos, todos los Jueces estamos obligados a ser soldados y guerreros, pues la protección de nuestro pueblo debe ser lo primero. Sin embargo, los Jueces Esra'elawi en Abisinia han mantenido las antiguas tradiciones guerreras de nuestro pueblo, específicamente la tribu de Dan. Los Setitas, los Inmortales, los Laibon y la Ashirra intentan constantemente aniquilar a nuestros hermanos en Beta Israel, obligando a los Jueces Esra'elawi a dominar el arte de la guerra.\nAhora que hemos establecido contacto y demostrado que somos capaces de ayudarles, nos han transmitido sus enseñanzas más antiguas. Con esta base, podemos asegurar que las Tradiciones se mantengan dentro de nuestra dinastía, ayudándonos en nuestra búsqueda para eliminar a Caín y a la prole de Lilith."
 pod1230objectives_judges.3.a: "Juntos luchamos."

 pod1230objectives_judges.4.t: "Maestros del comercio"
 pod1230objectives_judges.4.desc: "Debido a su aislamiento de la mayoría de las comunidades judías, costó cierto esfuerzo llegar a los Kochinim. Tienen un gran número de orígenes. Algunos fueron antaño comerciantes bajo el mando del Rey Salomón para alcanzar costas desconocidas. Otros vinieron aquí, huyendo de uno de los dos Exilios. Sus Jueces deben enfrentarse a tantas amenazas como ellos, ya sean los Malditos de la India, los Malditos que vienen del oeste o los Muertos Hambrientos que vienen de más al este.\n\nLos Kochinim han dominado dos áreas, lo que les permite sobrevivir, y ahora nos han legado ese dominio. Controlan una red comercial masiva que abarca la India y la región cercana para abastecer a los Jueces, y han construido una red de inteligencia sobre el comercio para ayudar a los Jueces en sus cacerías."
 pod1230objectives_judges.4.a: "Juntos vigilamos."

 pod1230objectives_judges.5.t: "Diplomáticos y teólogos de Iberia"
 pod1230objectives_judges.5.desc: "Los judíos sefardíes han pasado siglos mejorando su comprensión de nuestros textos sagrados y aprendiendo cómo sobrevivir en un entorno hostil donde un gobernante puede tolerarlos y el siguiente intenta exterminarlos. Estas habilidades se han transferido a sus Jueces locales y los han situado entre los más eficaces de nuestros hermanos.\n\nRequirió tiempo y esfuerzo, pero logramos atraer a los sefardíes a nuestro lado y ayudar a aliviar su situación. En agradecimiento por nuestros esfuerzos, han enviado rabinos para ayudarnos en nuestra guerra contra aquello que se desliza por las sombras."
 pod1230objectives_judges.5.a: "Juntos resistimos."

 pod1230objectives_judges.6.t: "Orígenes de los Inmortales"
 pod1230objectives_judges.6.desc: "Osiris fue un antiguo Maldito, abrazado por uno de los hijos de Caín y probablemente fue un $pod_cainite$ de 3.ª o 4.ª [Glossary('Generación','game_concept_vampgeneration_desc')]. Su [Glossary('Sire','game_concept_Sire_desc')] es desconocido, aunque Ilyes (progenitor del $pod_clan$ Brujah) es un contendiente común en algunos de nuestros círculos de eruditos, debido en parte a la teoría que sitúa a Isis (la esposa de Osiris) como descendiente de Lilith.\n\nAlguien (nuestros eruditos señalan a Ilyes, Lilith o a un mago llamado Thoth) regresaría más tarde para ayudar a Isis y Neftis en su búsqueda de conocimiento mágico, expandiendo el saber que la propia Isis ya poseía.\n\nCon sus magias (¿y quizás explotando la ausencia de Bene Elohim para transportar adecuadamente a los muertos?), los Inmortales vincularon para siempre las almas a sus propios cuerpos de modo que su alma pudiera eventualmente regresar al mundo físico tras recuperar sus fuerzas en el [UmbraGlossaryLocalized('shadowlands','Limbo')].\n\nMientras que los Inmortales egipcios o las Momias luchan frecuentemente contra los Malditos (¿quizás siendo utilizados por Lilith?), los otros Inmortales han logrado evitar enredarse en ese conflicto y parecen haber descubierto medios distintos para lograr un resultado similar, incluso mediante habilidades alquímicas.\n\nExtractos de un borrador preliminar de la Havanah Vol. 21, Cap. 1 y 2"
 pod1230objectives_judges.6.a: "Solo la prole de Lilith merece nuestra atención."

 pod1230objectives_judges.7.t: "Orígenes de los Caídos"
 pod1230objectives_judges.7.desc: "... y así fue como un tercio de los Bene Elohim se unió a Lucifer en su rebelión, impulsados por su codicia y orgullo. Algunos creyeron que su plan era más sabio que el de YHWH. Otros buscaron la autoridad suprema sobre la humanidad, el propio poder de YHWH, o simplemente desearon destruir todo lo que consideraban impuro o rival para el amor de Dios. Otros más encontraron fascinantes los nuevos conceptos de guerra y violencia introducidos por Caín. Independientemente de sus razones individuales, se rebelaron contra SU plan perfecto y, para sorpresa de nadie, perdieron la guerra contra Sus fieles.\nPor sus acciones, fueron expulsados del Tercer Cielo, quedando para siempre vinculados a la Tierra que tanto codiciaban y al Primer Cielo. Quedaron atrapados en una tierra llamada el Abismo, pudiendo escapar solo a través del pecado y la soberbia de los mortales. En la Tierra y en el Abismo, aguardarían el Juicio Final cuando fueran consignados al Gehinnom...\n\nPor su crimen de incitar la rebelión, Lucifer recibió una maldición adicional. Así como la Tierra había sido entregada a los Caídos por un tiempo, también los Caídos fueron entregados a sus depravaciones. Lucifer permanecería, intacto por el Abismo o por las peores perversiones del pecado, para que pudiera presenciar cómo todos aquellos que reunió bajo su mando se retorcían lentamente y cedían ante la corrupción que habían engendrado, no deseando nada más que su propia destrucción...\n\nDos veces Asmodeus y Abaddon han intentado reemplazar a los hombres con esclavos retorcidos llamados Nephilim, y dos veces Dios ha intervenido en sus planes. En la primera instancia, el Gran Diluvio borró todo rastro de aquellas Líneas de Sangre contaminadas. En respuesta a la segunda, surgió una nueva fe de la nuestra, una que sería llamada cristianismo.\n\nExtractos de Havanah Vol. 11, Cap. 2 y Vol. 18, Cap. 7"
 pod1230objectives_judges.7.a: "Me pregunto cómo responderá ÉL la próxima vez que lo intenten."

 #pod1230objectives_judges.8.t: "Was Yeshua the Ha-mashiach?"
 #pod1230objectives_judges.8.desc: "After carefully studying the matter, there is evidence indicating that Yeshua of Nazareth may be Mashiach ben Yosef. However, the matter is not conclusive so we could choose to rule against it. Is the evidence sufficient to proclaim Yeshua as the Ha-mashiach?"
 #pod1230objectives_judges.8.a: "It is."
 #pod1230objectives_judges.8.b: "It is not."
 #
 #pod1230objectives_judges.9.t: "The Ha-mashiach Has Come!"
 #pod1230objectives_judges.9.desc: "In the ninth chapter of his book, Daniel began a count from Mar 14, 445BC, as the Gentiles reckon it, when we received the order to rebuild the Second Temple. He said that the Mashiach would come 483 of our years later. As it was said, so it was done for Yeshua passed through the gates of Jerusalem on the Tenth of Nisan precisely 483 years later to be cut off and left with nothing. As Daniel warned us, our city and G-d's temple were cast down as punishment for missing this sign.\n\nLet it now be known across the land that Mashiach ben Yosef has come! Let us worship His holy name and celebrate the grace of G-d for truly thine is the kingdom and the glory forever!"
 #pod1230objectives_judges.9.a: "Hallelujah and amen!"

 pod1230objectives_judges.9.t: "La verdad de Yeshua"
 pod1230objectives_judges.9.desc: "El hombre conocido comúnmente como Yeshua de Nazaret ha sido un enigma para nosotros durante mucho tiempo. Algunos de nuestros eruditos creen que en verdad es un Eterno llamado Melquisedec. Como muchos Eternos, poseería la capacidad de imitar la resurrección, despertando en su propio cuerpo tras una cierta cantidad de tiempo. Esta visión se apoya en los informes de que su tumba fue hallada vacía, salvo por las vendas funerarias, una característica común entre los Eternos...\n\nEsta especulación, algo descabellada, aún carece de fuentes creíbles y nuestra orden ha acordado mantenerla como tal, una hipótesis, para evitar enfurecer a nuestros compañeros cazadores cristianos. La cooperación con ellos ha resultado fructífera muchas veces en el pasado, y callar nuestras diferencias teológicas mientras nos centramos en la verdadera amenaza es un enfoque mucho más pragmático y eficiente.\n\nExtracto de Havanah Vol. 21, Cap. 16, nunca publicado fuera de los círculos de los Altos Jueces."
 pod1230objectives_judges.9.a: "Podemos estar de acuerdo en que no estamos de acuerdo."

 pod1230objectives_judges.11.t: "Orígenes de las hadas"
 pod1230objectives_judges.11.desc: "Todos los hombres fueron creados a imagen de Dios y a su semejanza. Como Él es el Creador de todas las cosas, así también los hombres desean crear y son capaces de hacerlo. Como sus reflejos menores, la humanidad puede hacer realidad sus sueños y pesadillas. Las hadas se crean cuando la humanidad crea literalmente cosas a partir de sus sueños y pesadillas, reflejando los ideales y temores de cualquiera en la zona local...\n\nSu conexión con la creencia significa que la realidad, el pesimismo, la falta de asombro y la falta de caos son capaces de herirlos físicamente o restringir sus poderes...\n\nEl hierro frío, forjado en orden mediante pura Fuerza de Voluntad, es conocido por destruir fácilmente a estos seres de sueños...\n\nLas hadas son actualmente seres malvados, reflejos de la naturaleza salvaje y sus Bestias mientras buscan destruir la civilización. Sin embargo, cambios suficientes en las creencias generales, los valores y los temores pueden resultar en cambios en la naturaleza de las hadas y transformarlas en aliados útiles en la caza. La excepción serían aquellos que se llaman a sí mismos los Shedim, los llamados Djinn, que creemos que nacieron de los sueños de Lilith y su prole. Ellos llevarán siempre su mancha.\n\nExtractos de Havanah Vol. 51, Cap. 1 y 3 y Vol. 52, Cap. 20"
 pod1230objectives_judges.11.a: "¿Puede nuestra fe y nuestros sueños retocar la realidad para ayudar en nuestra caza?"

 pod1230objectives_judges.12.t: "Orígenes de los wraiths"
 pod1230objectives_judges.12.desc: "Los wraiths son el tipo más fundamental de criatura antinatural, el bloque de construcción a partir del cual se pueden derivar muchos de los otros, particularmente cuando se vinculan a un cuerpo. En este ensayo, demostraré cómo...\n\nSin los Caídos para servir como psicopompos y llevar a los muertos al más allá, estos comenzaron a acumularse en la Tierra e incluso empezaron a abrumar a los vivos. Peor aún, algunos Caídos buscaron activamente recolectar las almas de los muertos en una tierra envuelta por un Velo de dolor y sufrimiento...\n\nCon el tiempo, los fieles Bene Elohim atravesaron este Velo, capturaron a los Caídos y los llevaron ante Dios para su juicio...\n\nAl no querer condenar a las muchas almas capturadas en la trampa de este lugar simplemente destruyendo el señorío, Dios habló, los océanos se dividieron y el Velo fue colocado entre los dos océanos. Un lado fue entregado a los vivos y el otro lado, [UmbraGlossaryLocalized('shadowlands','Limbo')], fue entregado a los Muertos Sin Reposo que aún no estaban dispuestos a partir...\n\nDios dotó a Eva, la primera mujer y una madre que aún buscaba hacer las paces con su hijo, para seleccionar un protector para los Muertos Sin Reposo. Para luchar contra las manchas oscuras dejadas en [UmbraGlossaryLocalized('shadowlands','Limbo')], eligió a un teriantropo, uno de los hombres lobo, que llegaría a ser conocido como Anubis, al menos para el Inmortal al que ayudó. Esta mancha corrompe todas las almas atrapadas en este señorío, susurrando siempre a sus oídos para que sucumban a todo lo que es Oscuridad...\n\nEn el mismo siglo en que Moisés dividió el Mar Rojo, aunque se desconoce si existe una correlación, Eva regresó para seleccionar a un gobernador para los Muertos Sin Reposo. El nombre del creador Caído de [UmbraGlossaryLocalized('shadowlands','Limbo')] fue dado a un micénico, transfiriendo parte del poder del señorío de los Caídos y permitiendo al micénico separar a los vivos de los muertos y ayudar a los muertos a alcanzar el más allá. Se le conoció como Caronte...\n\nCualquier cosa que no haya sido creada por Dios mismo debe eventualmente llegar a su fin, pues todas las creaciones no pueden ser creadores perfectos. Aquello que se conoce como [UmbraGlossaryLocalized('oblivion','Olvido')] es la esencia de esto. Es el final inevitable, la destrucción y la corrupción de esta extraña tierra creada originalmente por los Caídos. No hay voluntad ni inteligencia aquí, simplemente entropía que vuelve incoherente toda información y hace inútil toda energía, manifestada por los males de los Caídos y los temores de los wraiths atrapados en esta extraña tierra.\n\nExtractos de la Havanah Vol. 23, Cap. 1, 2, 5 y 6"
 pod1230objectives_judges.12.a: "Un extraño grupo de seres que debería dar lástima."

 pod1230objectives_judges.13.t: "Orígenes de los Kuei-Jin"
 pod1230objectives_judges.13.desc: "Debido a la falta de nuestros hermanos en la región hasta milenios más recientes, las fechas exactas son difíciles de identificar al hablar de los Muertos Hambrientos. Sin embargo, sus orígenes parecen ligados a lo que llaman la Tercera Era. Basándose en sus esquemas de denominación, la Primera Era se refiere al tiempo en que la Tierra no tenía forma y era un vacío, y la oscuridad estaba sobre la faz del abismo. Y el Espíritu de Dios se movía sobre la faz de las aguas. Su Segunda Era comenzó cuando Dios separó la luz de las tinieblas y separó las aguas. Terminó con la Caída que creó toda clase de seres malvados, de los cuales solo algunos fueron los Caídos. En respuesta a la Caída, Dios, conocido como la Augusta Persona de Jade en el Este, eligió a un ángel para seleccionar a 10 mil héroes, protectores y guías para la humanidad...\n\nManchados como todos los hombres por el Pecado Original, estos héroes fueron corrompidos por su poder, robando la vida de aquellos a su cuidado para fortalecerse y haciendo tratos con los Caídos para obtener aún más poder. Los Bene Elohim apenas pudieron reemplazar a todos aquellos que murieron en sus conflictos internos, impulsados por su orgullo y deseo de más gloria...\n\nSus males culminaron en la Guerra de la Vergüenza cuando mataron a sus propios hijos, corrompieron lugares sagrados bendecidos por Dios y custodiados por dragones y seres cambiantes, y crearon los Nueve Soles Falsos...\n\nIncluso las pruebas de selección fueron corrompidas de tal manera que solo los malvados se unirían a su número...\n\nIncapaz de retener el juicio o concederles la misericordia por más tiempo, Dios lanzó una maldición sobre los 10 mil antiguos héroes, salvando solo a cuatro, uno de los cuales pasaría a unirse a aquello contra lo que una vez luchó. Esta maldición les otorgó un vistazo al tormento que les esperaba en el más allá y les despojó de los poderes que una vez se les concedieron, obligándoles a drenar humanos para obtener energía si deseaban conservar esos poderes. Estos antiguos héroes no fueron los únicos seres en la zona atrapados en el reino físico, y no todos han permanecido atrapados, pues Dios es misericordioso y siempre deja un camino de reunión para aquellos dispuestos a recorrerlo...\n\nExiste la idea errónea de que los ahora conocidos como Kuei-Jin están restringidos a las regiones orientales de Asia y Oceanía. En realidad, estos antiguos héroes y criminales prófugos pueden surgir en cualquier lugar. Sin embargo, los Malditos los exterminan en las regiones donde son prevalentes, viéndolos simplemente como wights Caitiff o wraiths inusualmente fuertes. Históricamente, los teriantropos se consideraban más fieles, por lo que desarrollaron un odio y asco hacia los Kuei-Jin.\nAunque las razones se han olvidado, el odio permanece, de modo que los teriantropos también exterminan a cualquier recién nacido Kuei-Jin en su territorio. Solo el Este poseía suficientes Malditos o teriantropos con mentalidad abierta para que los Kuei-Jin echaran raíces, momento en el cual pudieron facilitar la transición e inserción de futuros Kuei-Jin.\n\nExtractos de Havanah Vol. 46, Cap. 1, 3 y 9 y Vol. 50, Cap. 4"
 pod1230objectives_judges.13.a: "¿Podemos replicar los poderes de aquellos a quienes Dios dotó una vez?"

 pod1230objectives_judges.14.t: "Orígenes de los teriantropos"
 pod1230objectives_judges.14.desc: "Tras la Caída, Dios eligió a un ángel para seleccionar a 10 mil héroes y protectores para la humanidad. Este ángel eligió las almas de mortales fieles que habían muerto a manos de los Caídos y les dio una segunda oportunidad en la vida. Renacidas como los Malhim, estas almas igualaron la brutalidad que se les había mostrado, sembrando el miedo en los corazones de todos los Caídos con su afán por exterminarlos. Podían seguir y cazar a sus presas en cualquier rincón de la creación, llegando incluso a perforar el reino del [UmbraGlossaryLocalized('shadowlands','Limbo')]. Bendecidos por su patrón, podían exigir la ayuda de la naturaleza, tanto de la flora como de la fauna. De hecho, incluso podían transformarse en diferentes animales para ayudarlos en sus cacerías y batallas, siendo los osos-teriantropos los más antiguos y sabios entre ellos...\n\nEn aquel entonces, estaban divididos por a quién cazaban o por su papel en el apoyo a las Huestes Celestiales. Por ejemplo, aquellos conocidos ahora como Rokea cazaban principalmente a la Casa Lammasu, mientras que el Khan Bastet se agrupaba con otros teriantropos como infantería pesada...\n\nComo tantos otros, estos héroes sucumbieron a las tentaciones de sus posiciones y poder. Esclavizaron a la humanidad, manteniéndola como ganado tal como hicieron los Malditos. Por sus crímenes, fueron malditos con la naturaleza de los animales con los que trabajaban y a los que se asemejaban. Con el tiempo, los antaño poderosos Malhim degeneraron en los seres que hoy conocemos como teriantropos...\n\nAlgunos eruditos han postulado que la Guerra de la Rabia causó el colapso definitivo de los Malhim hacia los teriantropos. Hubo muchos conflictos territoriales, disputas por los mejores rebaños de personas, intentos de determinar la raza más fuerte y supuestas traiciones a su Madre Patrona. Todo culminó cuando un Nagah corrompido por un Caído mató a un importante Garou que portaba un mensaje crucial y echó la culpa a otras tribus. Cuando los Gurahl se negaron a resucitar al mensajero Garou, los Garou atacaron a los Gurahl, quienes contraatacaron con sus propios aliados entre los Grondr. Con la guerra ya iniciada, los Garou aprovecharon para cumplir todos sus deseos: su orgullo, su codicia por los secretos ajenos y su creencia en su derecho a gobernar sobre todas las demás tribus...\n\nUna nota interesante respecto a los teriantropos es su conexión única con ciertos cuerpos que se ven en el Segundo Cielo. Basándonos en nuestras investigaciones sobre el [UmbraGlossaryLocalized('shadowlands','Limbo')], el [UmbraGlossaryLocalized('dreaming','Mundo de los Sueños')] y otros reinos de la Umbra, parecería que la mayoría, si no todos, los cuerpos celestes son manifestaciones de los sueños y creencias de la humanidad, de tal modo que es posible que dichos cuerpos no existieran antes de que la humanidad decidiera que esas estrellas debían ser distintas de las demás. Por favor, consulte el siguiente capítulo y el Volumen 52 para profundizar en la discusión sobre...\n\nExtractos de Havanah Vol. 31, Cap. 1 y 2, Vol. 39, Cap. 2"
 pod1230objectives_judges.14.a: "¿Podemos replicar los poderes de aquellos a quienes Dios dotó una vez?"

 pod1230objectives_judges.15.t: "Orígenes de la magia mortal"
 pod1230objectives_judges.15.desc: "La humanidad ha dado la espalda a Dios muchas, muchas veces. Todos los hijos de Adán y las hijas de Eva llevan la marca del Pecado Original. Caín creó a los Malditos a través de sus numerosos crímenes, desde el asesinato hasta la violación e incluso su negativa a arrepentirse. Muchos humanos se unieron a los Caídos en su rebelión contra Dios...\n\nAunque por ahora ha apartado Su rostro de nosotros, nunca ha olvidado a la humanidad. La discusión sobre el Ha-mashiach y la naturaleza elegida de los hijos de Israel está fuera del alcance de esta obra, así que, por favor, consulte los volúmenes y textos rabínicos apropiados. En lo que respecta a la discusión actual, Dios dejó tras de sí a múltiples trabajadores para ayudar a la humanidad, como Eva y dos Bene Elohim llamados Ziana de la Casa Rabisu y Raziel de la Casa Lammasu. Estos últimos son titulados los Mensajeros...\n\nPoco después de la Caída e incluso antes del Gran Diluvio, Raziel eligió a diez mil héroes que lucharon con su belleza y su conocimiento, ayudando siempre a la humanidad a avanzar. Estos héroes inspiraron historias sobre los Wan Xian y gran parte de su conocimiento fue transmitido a los Wu T'ian, permitiéndoles crear el Elixir de la Vida Eterna y estando de algún modo vinculados a los Ocho Inmortales que incluso ahora trabajan para Dios en el Tercer Cielo. Los Ocho Inmortales todavía se comunican con los Wu T'ian, asignándoles tareas sobre cómo mitigar problemas. Del mismo modo, Ziana eligió a diez mil héroes que lucharon con la propia naturaleza, controlando y asumiendo aspectos de la flora y fauna naturales. Podían ordenar a las plantas que los ayudaran y asumir la forma del espíritu animal que los había elegido. De los sueños de estos héroes, bendecidos con magias únicas, surgieron los seres conocidos como las Hadas. Si bien los sueños modernos pueden alterar a las Hadas, fueron estos primeros sueños los que dieron origen a las verdaderas Hadas Primigenias...\n\nAnte el fracaso de sus héroes individuales, estos dos Mensajeros decidieron combinar sus esfuerzos y alterar la manera en que trabajaban. Esas facultades ya no se confiarían a una sola persona, sino que se dividirían. Algunas habilidades se aprenderían, con los Mensajeros alentando a la gente hacia el conocimiento oculto a través del Anhelo. Otras habilidades se otorgarían al nacer, para ser exploradas con el tiempo. Otras facultades más se concederían como recompensa por soportar algo o como ayuda para resistir algo, a menudo acompañadas de un mensaje de guía. (Nota del traductor: ¿Por qué los Mensajeros tienen que ser tan confusos con su guía? ¿Por qué no puede ser simplemente «ve aquí y haz esto»?). Estas habilidades permiten a los humanos escuchar, ver y hablar los misterios que el oído carnal, el ojo gelatinoso y la lengua de arcilla no pueden. Cada Bendecido puede acercarse y usar su Don de diferentes maneras y formas: esoterismo, misticismo, alquimia, Rituales, Hechizos, oraciones, meditación y habilidades mentales...\n\nDe los héroes de Raziel, solo 8 encontraron la verdadera paz y fueron aceptados de nuevo en los brazos de Dios. Inspirados por los nuevos esfuerzos de Raziel y Ziana, estos Ocho Inmortales transmitieron parte de su conocimiento a los Wu T'ian, permitiéndoles crear el Elixir de la Vida Eterna sin depender de las retorcidas magias de la prole de Lilith. Los Ocho Inmortales se comunican activamente con los Wu T'ian, asignándoles tareas aparentemente aleatorias y sin relación...\n\nEl objetivo de los Mensajeros y de los otros agentes de Dios es, en última instancia, desconocido, aunque algunos dicen que están mitigando el daño antes de que sea demasiado grave. ¿Quizás nos están poniendo a prueba? El tiempo lo dirá...\n\nExtractos de Havanah Vol. 22, Cap. 1 y Vol. 31, Cap. 1 y Vol. 46, Cap. 4"
 pod1230objectives_judges.15.a: "Aprendamos las artes de aquellos primeros héroes."

 pod1230objectives_judges.16.t: "Relatos de la Segunda Ciudad"
 pod1230objectives_judges.16.desc: "En su sabiduría, Dios vio una forma de abordar muchos pecados a la vez y por ello envió el Gran Diluvio para purgar las abominaciones de los Caídos, los corruptos entre sus antiguos siervos y el orgullo de los Malditos...\n\nTras el Gran Diluvio, Caín se exilió. Había creado tanto que no podía ser borrado en un solo año, con tan solo un puñado de los más de 200 Malditos sobreviviendo al Gran Diluvio. No es que importara. A pesar de todo su trabajo, nada mejoró jamás, solo cambió de formas mínimas...\n\nSin Caín para contenerlos, se permitió a la Tercera Generación cumplir sus peores vicios y sus peores brotes de paranoia. Al combinarse con el limitado suministro de alimentos a medida que los descendientes de Noé se extendían, la Tercera Generación decidió rápidamente volverse contra sus sires supervivientes, obligándolos al Letargo pero sin ser capaces de matarlos por completo. Algunos dicen que Irad ayudó en sus esfuerzos antes de que también se volvieran contra él. Otros dicen que Zillah fue la última en caer, clamando por la ayuda de Caín mientras veía caer a sus hermanos. Él escuchó sus súplicas y tuvo piedad de ella, transformándola en piedra para que no fuera encontrada ni asesinada. Además, Caín prometió a su amada Zillah que volverían a caminar juntos por la noche cuando todo se hubiera reparado. Otros dicen que Jabal logró escapar por completo, acompañando a Caín en su exilio como el siempre fiel siervo...\n\nInspirando muchos mitos de una deidad vengativa, la ira de Caín no tuvo límites cuando se enteró de lo que les sucedió a su consejero, su general y su esposa a manos de sus propios chiquillos. Arrasando en su llamada Segunda Ciudad, impuso tres maldiciones a cada uno de los 13 miembros de la Tercera Generación: una amplificación personal de los mayores defectos o miedos del objetivo, y dos maldiciones generales aplicadas a todos. Cada [Glossary('Generación','game_concept_vampgeneration_desc')] alejada de Caín sería más débil que la anterior, y ninguna [Glossary('Generación','game_concept_vampgeneration_desc')] conocería jamás la paz, pues todas quedarían atrapadas en una contienda eterna para suplantar a sus predecesores. De hecho, es posible que la Tercera Generación tuviera un poder comparable al de los chiquillos directos de Caín antes de que este impusiera sus maldiciones. Finalmente, Caín implantó una desconfianza innata y miedo hacia los Caídos, alentando a sus descendientes a evitar a los Caídos o aniquilar a sus seguidores, lo que potencialmente explica por qué las Guerras Baali y el asalto de Cartago se encuentran entre los poquísimos ejemplos de numerosos Clanes trabajando juntos. Tal como la Tercera Generación había intentado, cada [Glossary('Generación','game_concept_vampgeneration_desc')] intentaría aniquilar a quienes les precedieron, siempre con el temor de lo que la [Glossary('Generación','game_concept_vampgeneration_desc')] anterior, más poderosa, pudiera hacerles. Estas maldiciones también sirvieron para amplificar la tensión entre miembros de la misma [Glossary('Generación','game_concept_vampgeneration_desc')], creando un miedo constante el uno hacia el otro...\n\nIncluso antes de que Caín los maldijera, la Tercera Generación buscó recrear la gloria de la ciudad de Caín. Abrazaron a nuevos miembros de la Cuarta Generación. Reclutaron a los descendientes de Noé para adorarlos y alimentarlos...\n\nSin embargo, nunca pudieron librarse de las maldiciones de Caín. Aniquilaron a cualquiera que intentara Abrazar a sus propios chiquillos. Convirtieron a cada residente de su ciudad en peones, nada más que una pieza para ser movida en un juego inimaginable...\n\nAbsortos en sus juegos, nunca notaron cómo su ciudad envejecía y moría a su alrededor. Cuando finalmente huyeron, era casi demasiado tarde, y muchos de ellos murieron en su huida...\n\nCaín se rió mientras usaba su maestría en la Dominación para alterar todos los recuerdos de esta Segunda Ciudad, llegando incluso a eliminar su nombre. Poco quedó en la mente de los supervivientes excepto el cómo cayó su ciudad y los recuerdos de sus propios fallos.\n\nExtractos de Havanah Vol. 1, Cap. 14 y 17"
 pod1230objectives_judges.16.a: "Como siempre, se destruyeron y se condenaron a sí mismos."

 pod1230objectives_judges.17.t: "Relatos de la Primera Ciudad"
 pod1230objectives_judges.17.desc: "En sus errancias, Caín desarrolló dos cosas: sed de poder y deseo de una nueva familia. La oportunidad de cumplir ambas llegó cuando un hombre llamado Enoc lo encontró. El rey y la reina de Ubar (¿pero eso haría de Ubar la Primera Ciudad?) enviaron a Enoc, su ciudadano más ilustre, para encontrar un guardián y un dios para su ciudad. Caín fue a quien Enoc trajo de vuelta...\n\nPor primera vez, Caín abrazó a tres personas: a Enoc por llevarlo a Ubar, y al rey y la reina de Ubar (¡especulación de un tomo árabe!) para preservar su amor y sabiduría. En estos dos últimos, Caín esperaba que su amor pudiera empezar a mitigar sus acciones. Sin embargo, caminaron hacia el sol para morir tras descubrir que ya no podían dar a luz a chiquillos verdaderos. Caín juró no volver a abrazar jamás, un juramento que duró hasta que las palabras de Enoc y la propia soledad de Caín le hicieron cambiar de opinión...\n\nIrad era el mayor general vivo en aquel entonces, elegido por Caín para proteger la ciudad de Ubar. Si bien su nueva naturaleza mejoró sus habilidades como líder, también aumentó la sed de sangre de Irad...\n\nZillah despertó el deseo de Caín de tener una esposa que le acompañara por la eternidad, pero ella se mostró resistente a sus encantos, así que él buscó otros medios para ganarse su afecto. En su desesperación, Caín buscó a la segunda esposa de su padre, Levatel, quien había sido expulsada del jardín por Adán debido al rechazo que le producía ver su creación. Prometiéndole enseñarle el secreto, ella vinculó a Caín a sí misma, convirtiéndolo en su sirviente y su Esclavo. A través de su vínculo, obligó a Caín a abrazarla (poco probable, no hay fuentes Cainitas que lo respalden) y le robó algunos de sus chiquillos de la Segunda y Tercera Generación. Sin embargo, mientras estaba sujeto al vínculo, Caín aprendió sus secretos y se preparó para matar a Levatel. Un año y un día después de ser esclavizado por primera vez, el vínculo se debilitó lo suficiente como para que Caín apuñalara a Levatel y la dejara a merced del sol. Sus chiquillos, a los que ella había reclamado, y sus propios chiquillos no pudieron salvarla, creando un odio eterno hacia los Cainitas que continuó a través de los pocos que sobrevivieron al Gran Diluvio y los llevó a unirse a la prole de Lilith. Con el Vínculo de Sangre, Caín vinculó a Zillah a sí mismo, aunque no está claro si el vínculo creó una ilusión de amor o si ella realmente llegó a amarlo con el tiempo...\n\nEn lugar de abrazarlo, Caín transformó al jefe de sus siervos en el primer Ghoul o Aparecido. Con un poder comparable al de la Tercera Generación, Jabal era el mortal de mayor rango en la Primera Ciudad...\n\nCaín gobernó Ubar con mano de hierro, exiliando o matando a cualquier Maldito que rompiera sus reglas, como por confraternizar con los Caídos o asesinarse entre sí. Teniendo en cuenta cuántos de la Tercera Generación fueron abrazados sin su permiso, es interesante que nunca tomara medidas al respecto. Además, era más amable con los mortales que sus propios chiquillos. Algunos dicen que no quería arriesgar su fuente de alimento, mientras otros dicen que aún buscaba la redención por sus actos, aunque esto último es poco probable considerando la historia de Zillah y sus prohibiciones religiosas. Concretamente, Caín prohibió que nadie adorara a Dios y prohibió todos los templos que no fueran para él o para los otros Malditos. En su propio templo, proclamaba con frecuencia cómo todos sus chiquillos estaban condenados a pudrirse para siempre, a sufrir en el Infierno si alguna vez morían, y a ser ignorados por Dios cuando el Apocalipsis finalmente llegara...\n\nSe desconoce cómo logró Enoc convencer a todo el mundo de que Caín renombró Ubar en honor a Enoc (¿lo hizo o es solo una especulación para reconciliar Ubar y Enoc?). Quizás usó la Dominación para reescribir los recuerdos, o quizás sus chiquillos, los más numerosos de los tres grupos, lograron hablar más alto que todos los demás.\n\nExtractos de un borrador descartado de Havanah Vol. 1, Cap. 5-12"
 pod1230objectives_judges.17.a: "Un relato oscuro, sin duda."

 pod1230objectives_judges.18.t: "Relatos de Lilith y las Disciplinas"
 pod1230objectives_judges.18.desc: "Lilith fue la primera esposa de Adán y fue expulsada por dos razones: por su desobediencia a los mandatos de Adán y por su infidelidad con un Ben Elohim antes del Pecado Original y antes de la Caída. Tras vagar por los confines de la creación de Dios, regresó al Jardín del Edén y convenció a su amante angelical para que le permitiera el acceso. Usando extrañas magias robadas a los Bene Elohim, se transformó en la Serpiente que tentó a la ingenua Eva y fomentó el Pecado Original...\n\nDurante sus andanzas, Caín encontró a Lilith en su imitación del Jardín del Edén. Ella se sintió atraída por la marca de Dios que lo señalaba como un asesino y por el poder que esta representaba. Lo invitó a su hogar, le dio de comer, curó sus heridas y se convirtió en su amante. Con el tiempo, Caín se dio cuenta de que Lilith poseía magias extrañas y le suplicó que se las concediera, ya fuera por amor o para que él pudiera mitigar la maldición de Dios. Así, Lilith preparó una ceremonia especial y alimentó a Caín con parte de su sangre vital. Tras participar de su sangre, Caín recibió la visita de los 4 Hayyot Bene Elohim y los Arcángeles que portan la Merkavah Divina; cada uno le ofreció una oportunidad para arrepentirse y cada uno lo maldijo más que al anterior conforme él se negaba. Cuando Caín rechazó a Mikha'el (Quien/ninguno es como Dios), Mikha'el maldijo a Caín para que temiera su fuego viviente. Cuando Caín rechazó a Rafa'el (Dios ha sanado), Rafa'el maldijo a Caín para que temiera el amanecer, pues la gloria del sol ardería como el fuego viviente de Mikha'el. Cuando Caín rechazó a Auri'el (Dios es mi luz), Auri'el maldijo a Caín para que se aferrara a las sombras, para que bebiera sangre como lo hizo en aquella ceremonia y como la sangre de su hermano derramada, para consumir las cenizas dejadas por el fuego viviente de Mikha'el, para congelarse en el punto de la muerte y para que todo lo que toque se desmorone en el polvo del que están hechas todas las cosas. Gavri'el (Dios es mi fuerza) ofreció una última oportunidad que no podía ser rechazada y que nunca se desvanecería: la única forma restante de recibir la misericordia de Dios y levantar la maldición. Cuando despertó de estas visiones, Caín había recibido las 9 magias que forman la base de las Disciplinas modernas. Después de esto, abandonó a Lilith por razones desconocidas, creando así el odio que Lilith y su prole aún guardan hacia los Cainitas. Algunos han postulado que Dios impuso Su maldición sobre Lilith por su participación en el Pecado Original, asegurando así que su monstruosa prole nunca trabaje junto a los Malditos...\n\nLa ubicación actual de Lilith es desconocida, ya que el Gran Diluvio destruyó muchos rastros de su actividad, incluido su jardín. Algunas fuentes afirman que se retiró al [UmbraGlossaryLocalized('shadowlands','Limbo')] o al [UmbraGlossaryLocalized('dreaming','Tierras de los Sueños')], donde reconstruyó su jardín para esperar el día en que pueda aniquilar todas las amenazas para sus «hijos» y ejecutar su terrible venganza contra Caín. Ciertos eventos en la historia de los Cainitas también pueden rastrearse hasta ella como un intento de debilitar a sus enemigos en preparación para...\n\nExtractos de Havanah Vol. 1, Cap. 2-4"
 pod1230objectives_judges.18.a: "Caín era un necio, pero Dios era sabio."

 pod1230objectives_judges.19.t: "Relatos de Caín"
 pod1230objectives_judges.19.desc: "Después de que Caín se convirtiera en trabajador de la tierra y Abel en pastor de ovejas, Caín y Abel decidieron llevar ofrendas a YHWH. YHWH quedó complacido con el sacrificio de Abel, pero no con el de Caín. Caín no entregó sus primeros frutos ni lo mejor de su cosecha. Peor aún, Caín ofreció sacrificios por las razones equivocadas: para mostrar su prosperidad y para ganar la atención de su hermana gemela a la que deseaba desposar. Caín se llenó de furia al ver que Dios ignoraba su sacrificio. Un futuro Caído, que siempre había odiado la piedad de Abel, excitó la ira y los celos de Caín, proporcionando un sueño de inspiración. Aparecieron dos seres parecidos a Caín y Abel. Entonces, uno reprochó al otro. El reprochado se enfureció con el otro y tomó una reja de arado desgastada.\n\nIgnorando todos los ruegos de misericordia, el reprochado cortó la garganta del otro y lo mató. Manteniendo encendida la brasa de la ira y sin permitir jamás que se extinguiera, Caín se convenció de que no había juicio ni Juez Todopoderoso, ni recompensa para los justos ni venganza para los malvados. Su envidia hacia su hermano se enconó y solo creció cuando sus padres dispusieron que Abel se casara con la hermana gemela de Caín. Caín tomó su arado, lo golpeó para crear una hoja, se acercó a su hermano en los campos y le cortó la garganta a Abel. Así fue como Caín derramó la sangre de su hermano Abel sobre la tierra; la sangre de Abel fluyó por la tierra y su vientre fue abierto ante el rebaño.\n\nDios escuchó los clamores de Abel y vio las consecuencias futuras, así que castigó a Caín. La tierra ya no entregaría su fuerza a Caín. Para siempre sería un fugitivo y un errante. Sin embargo, Dios comprendió la influencia de otros en la situación y que, como primer asesino, a Caín le faltaba plena comprensión de las consecuencias de sus actos. Como tal, Caín fue simplemente maldito y se le concedió protección contra cualquiera que pudiera atacarlo.\n\nExtractos de Havanah Vol. 1, Cap. 1"
 pod1230objectives_judges.19.a: "Pero el nuestro es un Dios de segundas oportunidades. ¿Hay algo más en este relato?"

 pod1230objectives_judges.20.t: "Redención incluso para los Malditos"
 pod1230objectives_judges.20.desc: "A un nivel fundamental, los Malditos, conocidos comúnmente como vampiros, son wraiths que poseen su propio cadáver, sirviendo tanto su cuerpo como la maldición de Caín como ataduras. En Su eterna misericordia y a pesar de la negativa de Caín a aceptar el regalo, Dios le dio a Caín y a sus descendientes una vía llamada ahora Golconda para eliminar su maldición y salvar sus almas de la condenación eterna. Si bien puede afirmarse con cierta certeza que Caín no había alcanzado la Golconda antes del Gran Diluvio, han pasado milenios desde entonces, por lo que los estudiosos han presentado argumentos muy convincentes de que es probable que Caín haya alcanzado la Golconda pero que aún no haya pasado al más allá porque primero debe resolver sus asuntos con sus descendientes. Para profundizar en el estado actual de Caín, consulte los comentarios y artículos del Capítulo 18...\n\nSaulot afirmó haber alcanzado la Golconda tras robar parte del conocimiento otorgado a los descendientes de los Wan Xian por Raziel. Transmitió esas enseñanzas al clan Salubri, otorgándoles su icónico tercer ojo y guiando a muchos de ellos hacia la Golconda. Sin embargo, descubrimientos recientes realizados por Jueces locales apuntan a que el propio Saulot nunca alcanzó la Golconda. Además, los Tremere se han esforzado enormemente en sus intentos de aniquilar a los Salubri en general y a aquellos que alcanzaron la Golconda en particular...\n\nSaulot incluso robó el nombre de los místicos orientales, con el término refiriéndose poéticamente a la gran riqueza espiritual que poseen tales seres trascendentales. Irónicamente, esos místicos odian el término Golconda porque no es el más preciso, sino aquel que Saulot tomó y popularizó entre los Malditos de Occidente...\n\nPara alcanzar la Golconda, un Maldito debe encontrar un mentor, retener o recuperar su Humanidad y enmendar todos sus pecados. Tras una investigación y meditación suficientes, puede experimentar una visión especial. Con esa visión, finalmente puede comenzar un suspire, que es una búsqueda espiritual en sus sueños y su alma. Durante el suspire, descubre el sentido de la existencia, los orígenes de su Bestia interior y su conexión con Caín. Si no logra alcanzar la Golconda durante el suspire, no tendrá otra oportunidad, si es que su cuerpo y mente sobreviven. Lo mismo ocurre si pierde la Golconda por cometer cualquier pecado...\n\nSi se alcanza, la Golconda elimina el riesgo de que un Maldito sea consumido por su Bestia interior, reduce casi por completo su necesidad de sangre y anula las maldiciones que Caín impuso a sus descendientes, incluyendo las maldiciones de clan y los límites de [Glossary('Generación','game_concept_vampgeneration_desc')]. En comparación con la prole de Lilith, los Cainitas son algo que cazamos debido a su crueldad más que por cualquier otra cosa. Como tal, aquellos que han alcanzado la Golconda están exentos de nuestras cacerías, lo que nos permite dedicar nuestros recursos a eliminar amenazas mucho mayores para nuestros hermanos.\n\nBorrador descartado de Havanah Vol. 1, Cap. 3, marcado como «falta de fuentes serias»."
 pod1230objectives_judges.20.a: "Lilith siempre será nuestra prioridad."

 #pod1230objectives_judges.21.t: "The Wandering Sage"
 #pod1230objectives_judges.21.desc: "A strange man, completely wrapped in a cloak and his face obscured with more than simply cloth, has appeared in our most secure of inner sanctums. Identifying himself as the Wandering Sage, he called me by name and asked to meet me face-to-face. Oddly, he seemed to speak in the native tongue of all that were present, even though they came from different lands. Should I go?"
 #pod1230objectives_judges.21.a: "Let's hear him out."
 #pod1230objectives_judges.21.b: "It's a trap. Purge it with fire!"
 #
 #pod1230objectives_judges.22.t: "Caine Lives in Death"
 #pod1230objectives_judges.22.desc: "Once alone with us, he names himself Caine, first of the Cursed Ones commonly called vampires. In our quest for the truth, we drew his attention during his wanderings. He sees a chance in us to redeem himself before YHWH and to judge his twisted offspring so he offers me two choices: his blessing or his touch. He urges me to choose quickly for he is not yet permitted to rest and must soon continue his wanderings. After all, he still has many affairs to wind up and a few matters to resolve.\n\nI desire ..."
 #pod1230objectives_judges.22.a: "His Blessing."
 #pod1230objectives_judges.22.b: "His Touch."
 #
 #pod1230objectives_judges.23.t: "Purging It With Fire"
 #pod1230objectives_judges.23.desc: "Using our greatest theurgists and sorcerers, we purged the sanctum with fire, eliminating everything alive within it. However, the so-called Wandering Sage simply walked out of the fire, untouched. With a wave of his hand, not even the strongest among us could move to stop his exit from our sanctum. Over his shoulder, he said \"I sympathize with your decision, but this will be the end of our business together. Do not fear though, I am no longer the vengeful man that I once was. Good health and the L-rd's blessing be upon you.\""
 #pod1230objectives_judges.23.a: "Shall we ever hear from him again, and do we want to?"

 pod1230objectives_judges.24.t: "Difundid la Palabra"
 pod1230objectives_judges.24.desc: "Los Jueces, al igual que las comunidades que protegen, están dispersos por todo el mundo. Si bien esto ha sido un estado de cosas aceptable (incluso una ventaja en algunos casos, como enterarse de monstruos sobrenaturales desde lejos), también es una debilidad. Un grupo descentralizado tiene un límite de acción.\n\nVuestras recientes victorias y descubrimientos os han colocado en una posición central de autoridad sin parangón para los Jueces. Vuestra palabra tiene peso y es suficiente para atraer a cazadores de todo el mundo a vuestra creciente organización.\n\nCon la Tierra Santa, purgada de monstruos, como base de operaciones, la esperanza de una victoria definitiva sobre los hijos de Lilith nunca ha sido tan alta."
 pod1230objectives_judges.24.a: "¡Alabado sea el Señor en las alturas!"

 #pod1230objectives_judges.25.t: "Hebrew Culture Arises Once More"
 #pod1230objectives_judges.25.desc: "With the Promised Land once more under the control of the Israelites, they have set about reforming their culture into a cohesive group. All those within the Promised Land will be joining them."
 #pod1230objectives_judges.25.a: "We are reunited."
 #pod1230objectives_judges.25.b: "Can't beat 'em, join 'em."

