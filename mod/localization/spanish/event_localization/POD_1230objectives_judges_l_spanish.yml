 magi_modifier: "Rab-mag"
 magi_modifier_desc: "Tu conocimiento de las fuerzas místicas, combinado con las enseñanzas de los Magos, te ha enseñado mucho."
 ashkenazic_modifier: "Avra K'davra"
 ashkenazic_modifier_desc: "Tu dinastía ha aprendido los secretos necesarios para permutar el lenguaje y crear Constructos similares a la vida a partir de mero polvo."
 esraelawi_modifier: "Tradiciones Danitas"
 esraelawi_modifier_desc: "Tu dinastía ha recibido parte de las Tradiciones de guerra danitas de manos de los pocos Jueces que aún las recuerdan."
 kochinim_modifier: "Zaken Roshi"
 kochinim_modifier_desc: "Como Antiguo jefe de los Kochinim, tu dinastía supervisa ahora sus redes de comercio e inteligencia."
 sephardim_modifier: "Rabino de la Corona"
 sephardim_modifier_desc: "Los Sefardíes han enviado rabinos administrativos para ayudar y asesorar a tu dinastía."
 second_city_modifier: "Lecciones de la Segunda Ciudad"
 second_city_modifier_desc: "La Segunda Ciudad era un lugar plagado de Intriga, ya que cada residente participaba en el Gran Juego e intentaba suplantar a sus superiores, a menudo mediante el asesinato o la Diablerie."
 first_city_modifier: "Lecciones de la Primera Ciudad"
 first_city_modifier_desc: "A pesar de todos sus otros defectos y pecados, Caín fue un gobernante competente y hábil. Podemos aprender algunas lecciones de sus acciones y de cómo gestionó Ubar, la Primera Ciudad."
 lilith_and_disciplines_modifier: "Magia de Lilith y Caín"
 lilith_and_disciplines_modifier_desc: "Caín recibió ciertas magias de Lilith antes de abandonarla. Nuestra investigación sobre el tema nos ha proporcionado algunas ideas útiles que podrían aplicarse a la investigación en otros campos."
 caine_and_abel_modifier: "Compartir la historia de Caín"
 caine_and_abel_modifier_desc: "Tras descubrir y compartir la historia completa de Caín, hemos reunido más apoyo contra los Malditos y hemos unido a muchos aliados."

 mashiach_cometh_name: "Historia compartida judeocristiana"
 special_doctrine_mashiach_cometh_name: "Historia compartida judeocristiana"
 special_doctrine_mashiach_cometh_desc: "Aunque discrepamos en muchos puntos con nuestros hermanos cristianos, aún podemos trabajar más estrechamente junto a la Inquisición de las Sombras de la Iglesia y apoyar sus esfuerzos."

 mummy_origins_modifier: "Comprensión de los Inmortales"
 mummy_origins_modifier_desc: "Tras estudiar a los Inmortales, somos capaces de combinar sus habilidades alquímicas con nuestro kabbalismo, proporcionando fondos adicionales para la caza."
 demon_origins_modifier: "Comprensión de los Caídos"
 demon_origins_modifier_desc: "Tras estudiar a los Caídos, estamos mejor equipados para resistir sus avances."
 fae_origins_modifier: "Comprensión de las hadas"
 fae_origins_modifier_desc: "Tras estudiar a las hadas, somos capaces de retocar sutilmente la realidad con nuestra fe y nuestros sueños, mejorando nuestra capacidad para construir nuevas estructuras."
 kueijin_origins_modifier: "Comprensión de los Kuei-Jin"
 kueijin_origins_modifier_desc: "Tras estudiar a los Kuei-Jin y a los originales Diez Mil Héroes, somos capaces de extender nuestra longevidad, mejorando nuestra capacidad de caza."
 therianthrope_origins_modifier: "Comprensión de los Teriantropos"
 therianthrope_origins_modifier_desc: "Tras estudiar a los Teriantropos, es posible que podamos fortalecernos como ellos lo hicieron una vez."
 
 undone_diaspora_modifier: "Jueces del regreso"
 undone_diaspora_modifier_desc: "Desde las Islas Británicas hasta las costas de China, los Jueces regresan a casa y traen consigo gran prosperidad, conocimiento y manos de obra. Hay cierto malestar entre las diferentes Tradiciones y con aquellos que residen actualmente en la Tierra Prometida, pero aprenderemos a adaptarnos, como siempre lo hemos hecho."

 doctrine_origins_improvements_name: "Beneficios de la investigación"
 wraith_origins_name: "Comprensión de los wraiths"
 wraith_origins_desc: "Tras estudiar a los Inmortales, hemos aumentado nuestra capacidad para operar entre las sombras."
 mortal_magic_origins_name: "Comprensión de toda la magia mortal"
 mortal_magic_origins_desc: "Tras una extensa y, para algunos, excesiva investigación, descubrimos el origen de toda la magia mortal. Con nuestro nuevo entendimiento, hemos dominado muchas de las habilidades básicas asociadas a cada forma."

 doctrine_prioritized_hunting_name: "Caza prioritaria"
 golconda_repentance_name: "La verdad de los Malditos"
 golconda_repentance_desc: "Tras tanto estudio, hemos alcanzado una verdadera comprensión de la naturaleza de los Malditos, lo que nos permitirá trabajar junto a aquellos tocados por la misericordia de Dios en la búsqueda de la prole de Lilith. Además, todos nuestros hermanos judíos, malditos y mortales, pueden trabajar ahora juntos para alcanzar nuestros verdaderos objetivos."
 doctrine_parameter_hostility_override_golconda_repentance: "Otras [faiths|E], tanto $pod_cainite$ como cazadores, que tengan la [GetFaithDoctrine('golconda_repentance').GetBaseName] [doctrine|E], se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_evil_tooltippable$"

 judge_research_origins_mummies_objective_decision_osiris_flail: "Debes poseer el [GetPODArtifact('osiris_flail_link').GetName], que registra toda la historia de las Momias."
 judge_research_origins_mummies_objective_decision_book_thoth: "Debes poseer el [GetPODArtifact('book_thoth_link').GetName], que proporciona conocimientos sobre la hechicería de las Momias tal como Isis aprendió de Thoth."
 judge_research_origins_mummies_objective_decision_isis_fragments: "Debes poseer el [GetPODArtifact('isis_fragments_link').GetName], que registra la historia de las Momias egipcias desde la perspectiva del culto de Isis."
 judge_research_origins_mummies_objective_decision_writings_cabirus: "Debes poseer el [GetPODArtifact('writings_cabirus_link').GetName], que es una copia mal traducida de su versión del Hechizo de Vida."

 judge_research_origins_demons_objective_decision_dreams_angra: "Debes poseer el [GetPODArtifact('dreams_angra_link').GetName], que otorga conocimientos sobre los antiguos rituales de Ba'al."
 judge_research_origins_demons_objective_decision_incunabulum_kupalam: "Debes poseer el [GetPODArtifact('incunabulum_kupalam_link').GetName], que otorga conocimientos sobre la naturaleza del demonio Kupala y los rituales para convocarle y vincularle."
 judge_research_origins_demons_objective_decision_book_tobit: "Debes poseer el [GetPODArtifact('book_tobit_link').GetName], que describe las formas en que Dios utilizó a los demonios para probar a los fieles y el saber infernal de los antiguos [Glossary('Clanes','game_concept_Clan_desc')]."
 judge_research_origins_demons_objective_decision_control_tunis: "Controlas [GetTitleByKey('c_tunis').GetNameNoTier], donde los Baali sacrificaron a muchos niños y propagaron su locura."
 judge_research_origins_demons_objective_decision_control_chandax: "Controlas [GetTitleByKey('c_chandax').GetNameNoTier], donde el cuerpo de Namtaru aún descansa."
 
 judge_research_origins_fae_objective_decision_mayo: "Controlas [GetTitleByKey('c_mayo').GetNameNoTier], hogar de la Puerta de Plata, donde se reunía antaño la Corte de Todos los Reyes, y un centro de su conflicto."
 judge_research_origins_fae_objective_decision_atholl: "Controlas [GetTitleByKey('c_atholl').GetNameNoTier], actual hogar de los Tuath de Chronos, donde muchos hadas, incluidos algunos videntes, se refugian actualmente de la tormenta."
 judge_research_origins_fae_objective_decision_aviovara: "Controlas [GetTitleByKey('c_aviovara').GetNameNoTier], conocido por las hadas como la Fortaleza de Cristal y un centro de su conflicto."
 judge_research_origins_fae_objective_decision_ailech: "Controlas [GetTitleByKey('c_ailech').GetNameNoTier], antiguo hogar de Balor del Ojo Maligno y rey de los Fomorios."
 judge_research_origins_fae_objective_decision_monmouthshire: "Controlas [GetTitleByKey('c_monmouthshire').GetNameNoTier], hogar del corazón de la mítica Camelot y un lugar para vislumbrar el [UmbraGlossaryLocalized('dreaming','Mundo de los Sueños')]."
 judge_research_origins_fae_objective_decision_lennox: "Controlas [GetTitleByKey('c_lennox').GetNameNoTier], conocido como el Camino de Sangre de las hadas."
 judge_research_origins_fae_objective_decision_reval: "Controlas [GetTitleByKey('c_reval').GetNameNoTier], hogar del Palacio de Ámbar."
 judge_research_origins_fae_objective_decision_bayeux: "Controlas [GetTitleByKey('c_bayeux').GetNameNoTier], hogar del Pozo de las Hadas."
 judge_research_origins_fae_objective_decision_warwickshire: "Controlas [GetTitleByKey('c_warwickshire').GetNameNoTier], hogar de la Forja Valerosa donde las hadas crean cosas maravillosas."
 judge_research_origins_fae_objective_decision_black_torc_of_carniog: "Debes poseer el [GetPODArtifact('black_torc_of_carniog_link').GetName], que podría permitirnos ordenar a las hadas que ayuden en nuestros esfuerzos."
 judge_research_origins_fae_objective_decision_tapestry_of_fate: "Debes poseer el [GetPODArtifact('tapestry_of_fate_link').GetName], que otorga conocimientos sobre los [Glossary('Nombres Verdaderos','podgloss.truename')] y el destino del [UmbraGlossaryLocalized('dreaming','Mundo de los Sueños')]."

 judge_research_origins_demons_objective_decision_book_of_the_spirits_secrets: "Debes poseer el [GetPODArtifact('book_of_the_spirits_secrets_link').GetName], que proporciona información teúrgica sobre el reino de los espíritus conocido como el [umbra|E]."
 judge_research_origins_demons_objective_decision_khazar_diary: "Debes poseer el [GetPODArtifact('khazar_diary_link').GetName], escrito por uno de nuestros hermanos, que describe las fronteras entre nuestro reino y el [UmbraGlossaryLocalized('shadowlands','Limbo')]."
 judge_research_origins_demons_objective_decision_book_going_night: "Debes poseer el [GetPODArtifact('book_going_night_link').GetName], que proporciona conocimientos sobre ciertos rituales y hechizos para entrar en el más allá, aunque sea desde la perspectiva de un Maldito egipcio."
 judge_research_origins_demons_objective_decision_ignace_notes: "Debes poseer el [GetPODArtifact('ignace_notes_link').GetName], que podría proporcionarnos un mapa de los reinos espirituales."
 judge_research_origins_demons_objective_decision_black_torc_of_carniog: "Debes poseer el [GetPODArtifact('black_torc_of_carniog_link').GetName], que tradicionalmente permite al portador capturar almas y puede darnos alguna pista sobre cómo el [UmbraGlossaryLocalized('shadowlands','Limbo')] pudo haber capturado a sus residentes."

 judge_research_origins_kueijin_objective_decision_lhasa: "Controlas [GetTitleByKey('c_lhasa').GetNameNoTier], capital del Tíbet y un importante lugar sagrado."
 judge_research_origins_kueijin_objective_decision_purang: "Controlas [GetTitleByKey('c_purang').GetNameNoTier], hogar de lo que antaño fue Meru, la mítica sede de los Wan Xian."
 judge_research_origins_kueijin_objective_decision_baizetu: "Debes reunir los 5 fragmentos del Bai Ze Tu, el legendario grimorio escrito por el Emperador Amarillo que contiene los secretos de los 11.520 tipos de criaturas sobrenaturales."

 judge_research_origins_therianthropes_objective_decision_torture_therian: "Debido a su dependencia de las tradiciones orales, debes capturar al menos 5 [Glossary('Therianthropes', 'glossary_fera_tt')] que puedas interrogar."
 judge_research_origins_therianthropes_objective_decision_torture_fallen: "Captura e interroga a un #TOOLTIP:GAME_TRAIT,demonio,[GetNullCharacter] #L Caído#!#!, ya que su miedo a los [Glossary('Therianthropes', 'glossary_fera_tt')] indica que podrían poseer alguna pista sobre los orígenes teriántropos."

 judge_research_origins_mortal_magic_objective_decision_origins_mummies: "Debes haber descubierto los orígenes de los #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Inmortales#!#!."
 judge_research_origins_mortal_magic_objective_decision_origins_wraiths: "Debes haber descubierto los orígenes de los $POD_splat_wraith_plural$."
 judge_research_origins_mortal_magic_objective_decision_origins_kueijin: "Debes haber descubierto los orígenes de los $POD_splat_kueijin$."
 judge_research_origins_mortal_magic_objective_decision_origins_fallen: "Debes haber descubierto los orígenes de los #TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L Caídos#!#!."
 judge_research_origins_mortal_magic_objective_decision_origins_therians: "Debes haber descubierto los orígenes de los [Glossary('Therianthropes', 'glossary_fera_tt')]."
 judge_research_origins_mortal_magic_objective_decision_origins_fae: "Debes haber descubierto los orígenes de los $POD_splat_fae$."

 judge_research_origins_vampires_3rdgen_objective_decision_promised_land: "Tu [capital|E] está en [GetGeographicalRegion('pod_judges_promised_land').GetName]."
 judge_research_origins_vampires_3rdgen_objective_decision_sargon_codex: "Debes haber descubierto los 13 fragmentos del Códice de Sargon."
 judge_research_origins_vampires_3rdgen_objective_decision_tale_of_the_first_city: "Debes poseer el [GetPODArtifact('tale_of_the_first_city1').GetName] O el [GetPODArtifact('tale_of_the_first_city2').GetName], que trata sobre los tiempos antes y después del Gran Diluvio."
 judge_research_origins_vampires_3rdgen_objective_decision_biblia_negra: "Debes poseer el [GetPODArtifact('biblia_negra_link').GetName], que trata sobre 67 entidades atrapadas destinadas a destruir o tomar el control del mundo, 13 de las cuales son [Glossary('Antediluvianos','game_concept_antediluvian_desc')]."
 judge_research_origins_vampires_3rdgen_objective_decision_chronicles_heartblood: "Debes poseer el [GetPODArtifact('chronicles_heartblood_link').GetName], que es una historia de los Banu Haqim"
 judge_research_origins_vampires_3rdgen_objective_decision_karalavanisha_vrana: "Debes poseer el [GetPODArtifact('karalavanisha_vrana_link').GetName], que trata sobre los orígenes de los Ravnos de la India"
 judge_research_origins_vampires_3rdgen_objective_decision_canticle_japhet: "Debes poseer el [GetPODArtifact('canticle_japhet_link').GetName], que afirma que Caín ha muerto"
 judge_research_origins_vampires_3rdgen_objective_decision_book_enoch: "Debes poseer el [GetPODArtifact('book_enoch_link').GetName], que contiene algunas de las profecías, sagas y leyendas Cainitas más antiguas"

 judge_research_origins_vampires_2ndgen_objective_decision_chronicle_of_caine: "Debes poseer la Crónica de Caín, que aporta detalles adicionales sobre la época de la Primera Ciudad"
 judge_research_origins_vampires_2ndgen_objective_decision_codex_damned: "Debes poseer el [GetPODArtifact('codex_damned_link').GetName], que describe el dominio de la Primera y la Segunda Ciudad"
 judge_research_origins_vampires_2ndgen_objective_decision_ubar_chronicles: "Debes poseer el [GetPODArtifact('ubar_chronicles_link').GetName], que resuelve historias contradictorias sobre Enoc y Ubar"
 judge_research_origins_vampires_2ndgen_objective_decision_gospels_irad: "Debes poseer el [GetPODArtifact('gospels_irad_link').GetName], que trata sobre la historia de Irad y otra de los chiquillos de Caín llamada Adah"

 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_tablet_of_destiny: "Debes poseer el [GetPODArtifact('tablet_of_destiny').GetName], que describe toda la magia de sangre dominada por Enoc"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_tapestry_noir: "Debes poseer el [GetPODArtifact('tapestry_noir_link').GetName], que representa la Crónica de Caín del Libro de Nod"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_chronicle_of_caine: "Debes poseer la Crónica de Caín, que ofrece una visión de cómo Caín obtuvo sus poderes"
 judge_research_origins_vampires_lilith_n_disciplines_objective_decision_cycle_lilith: "Debes poseer el [GetPODArtifact('cycle_lilith_link').GetName], que es una compilación de cantos orales que narran la historia de Nodd desde la sucia perspectiva de Lilith"

 judge_research_origins_vampires_caine_n_abel_objective_decision_book_of_nod: "Debes poseer el Libro de Nod, que cuenta la historia completa de Caín y sus chiquillos"
 judge_research_origins_vampires_caine_n_abel_objective_decision_gospel_laodice: "Debes poseer el [GetPODArtifact('gospel_laodice_link').GetName], que explica la visión Cainita sobre su relación con Dios"
 judge_research_origins_vampires_caine_n_abel_objective_decision_erciyes_fragments: "Debes poseer el [GetPODArtifact('erciyes_fragments').GetName], que describe la historia de la creación Cainita y otros relatos apócrifos"

 judge_research_origins_vampires_golconda_objective_decision_book_sun: "Debes poseer el [GetPODArtifact('book_sun_link').GetName], que es el relato de un Maldito que buscó el [golconda|E]"
 judge_research_origins_vampires_golconda_objective_decision_consolation_philosophy: "Debes poseer el [GetPODArtifact('consolation_philosophy_link').GetName], que trata sobre la naturaleza de la maldición de Dios y la oportunidad de arrepentimiento"

 judge_verify_christian_claim_objective_decision_byzantion: "El condado de [GetTitleByKey('c_byzantion').GetNameNoTier] debe estar dentro de tu territorio y ser gobernado por alguien de tu fe. Alternativamente, que sea gobernado por un personaje Akritai también funcionará."
 judge_verify_christian_claim_objective_decision_jerusalem: "El condado de [GetTitleByKey('c_jerusalem').GetNameNoTier] debe estar dentro de tu territorio y ser gobernado por alguien de tu fe."
 judge_verify_christian_claim_objective_decision_rome: "El condado de [GetTitleByKey('c_roma').GetNameNoTier] debe estar dentro de tu territorio y ser gobernado por alguien de tu fe. Alternativamente, que sea gobernado por un personaje de la Inquisición de las Sombras también funcionará."

