 judge_research_origins_therianthropes_objective_decision_desc: "Sabemos que YHWH creó todas las cosas y nos eligió para ser Su pueblo. Sin embargo, hay muchas cosas en su creación que aún no comprendemos. Debemos buscar los orígenes de los [Glossary('Therianthropes', 'glossary_fera_tt')]. Registraremos nuestros hallazgos en una única obra titulada La Havanah."
