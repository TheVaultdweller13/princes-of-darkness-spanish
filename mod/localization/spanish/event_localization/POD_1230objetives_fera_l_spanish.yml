l_spanish:

 blackfury_objective_decision: "Hijas de Gaia"
 blackfury_objective_decision_tooltip: "Las Furias Negras deben dar un paso al frente y liderar la Nación Garou."
 blackfury_objective_decision_desc: "Si las Furias Negras han de alejar a la Nación Garou de sus mezquinas disputas, primero deberán encontrar una Matriarca digna y consolidar su Tierra Natal."
 blackfury_objective_decision_effect_tooltip: "Obtendrás el Imperio de las Furias Negras [title|E], una poderosa reliquia de tu tribu, y estarás un paso más cerca de unir a los Garou." 
 blackfury_objective_decision_confirm: "Madres, hijas y líderes"
 blackfury_decision_custom: "El Túmulo de la Gloria del Sol, en [GetTitleByKey('b_montbelliard').GetNameNoTier], debe estar completamente construido"
 blackfury_decision_custom_a: "Debes tener 5 o más caballeras con Destreza 50 o superior."
 blackfury_decision_custom_c: "El nivel de desarrollo de al menos 5 condados es 10 o inferior."

 pod1230objectives_fera.1.t: "Hijas de Gaia"
 pod1230objectives_fera.1.desc: "Las Furias Negras han estado ligadas durante mucho tiempo a su Tierra Natal ancestral en el Mediterráneo. El ascenso de Roma y el crecimiento de las ciudades que lo acompañó marcaron el fin de su dominio sobre la región y ayudaron a los vampiros a reducir la influencia de las Furias poco a poco. Eso se acabó.\nGracias a una sucesión de poderosas Matriarcas, al uso astuto de las instituciones mortales contra los vampiros y a algunos asaltos audaces dignos de las amazonas, las Furias Negras han vuelto a consolidar un firme punto de apoyo.\nLas otras tribus observan ahora, preguntándose si las Furias podrán capitalizar esta victoria sorprendente. ¿Quizás Gaia realmente pretende que sus campeones estén unidos bajo sus hijas después de todo?"
 pod1230objectives_fera.1.a: "¡Madre, escucha nuestro grito de victoria!"
 pod1230objectives_fera.2.a: "¡Presuntuosos Lupinos!"
 pod1230objectives_fera.2.b: "Las amazonas cabalgan una vez más"
 
 bonegnawer_objective_decision: "La risa de Gaia"
 bonegnawer_objective_decision_tooltip: "¿No sería una broma pesada que los carroñeros se convirtieran en los líderes?"
 bonegnawer_objective_decision_desc: "Somos la base de la cadena alimentaria en la Nación Garou. Pero con nuestros trucos y nuestra astucia, podríamos demostrar a todas estas tribus altaneras lo útiles que podemos llegar a ser realmente."
 bonegnawer_objective_decision_effect_tooltip: "Obtendrás el Imperio de los Roehuesos [title|E], una poderosa reliquia de tu tribu, y estarás un paso más cerca de unir a los Garou." 
 bonegnawer_objective_decision_confirm: "¡Derrocad los tronos!"
 bonegnawer_decision_custom: "El Túmulo del Campo de las Estrellas, en [GetTitleByKey('b_oviedo').GetNameNoTier], debe estar completamente construido"
  
 pod1230objectives_fera.3.t: "La risa de Gaia"
 pod1230objectives_fera.3.desc: "Mientras los poderosos Señores de la Sombra y los Colmillos Plateados discutían, mientras los valientes Camada de Fenris y los Fianna libraban batallas desesperadas, los Roehuesos esperaban. Ayudados por el crecimiento de la civilización humana, los hijos de la Rata hicieron lo que mejor saben hacer: sobrevivir, adaptarse y prosperar.\nMientras las otras tribus parecen cada vez más reliquias del pasado, los Roehuesos se sienten más cómodos con esta humanidad cambiada que nunca, y ahora todos, a regañadientes, buscan su ayuda y consejo sobre cómo lidiar con esta sociedad transformada. La base de la Nación Garou se está vengando y, un favor tras otro, está escalando rápidamente en la jerarquía..."
 pod1230objectives_fera.3.a: "¡Las ratas no abandonan el barco, lo comandan!"
 pod1230objectives_fera.4.b: "¿De carroñeros a líderes?"
  
 childofgaia_objective_decision: "La unidad de Gaia"
 childofgaia_objective_decision_tooltip: "Demostrar que la unidad no es una debilidad es un desafío interminable."
 childofgaia_objective_decision_desc: "Siempre nos esforzamos por la unidad entre la Nación Garou, pero las tribus más belicosas aún nos rechazan. Solo a través de la fuerza que deben respetar, o fomentando relaciones que no puedan ignorar, podrá comenzar la unificación."
 childofgaia_objective_decision_effect_tooltip: "Obtendrás el Imperio de los Hijos de Gaia [title|E], una poderosa reliquia de tu tribu, y estarás un paso más cerca de unir a los Garou." 
 childofgaia_objective_decision_confirm: "Reuníos y escuchad"
 childofgaia_decision_custom: "El Túmulo del Mar Blanco, en [GetTitleByKey('b_kem').GetNameNoTier], debe estar completamente construido"
   
 pod1230objectives_fera.5.t: "La unidad de Gaia"
 pod1230objectives_fera.5.desc: "A menudo descartados como una tribu pacífica y débil, los Hijos de Gaia son una fuerza para la unidad y el propósito por encima de todo. En el pasado, sus esfuerzos por convencer a sus tribus hermanas de sentarse y hablar sobre sus disputas (en lugar de estamparse las cabezas unos contra otros) no han dado frutos.\nSin embargo, esto ha cambiado recientemente, ya que han demostrado la fuerza de su convicción y los grandes resultados que se pueden lograr si todos los campeones de Gaia actuaran como uno solo. Finalmente, quizás por primera vez, las tribus están escuchando y la Nación Garou nunca ha parecido tan fuerte y unida.\nVerdaderamente, Gaia debe estar sonriendo a sus hijos en este momento."
 pod1230objectives_fera.5.a: "Finalmente lo entienden."
 pod1230objectives_fera.6.b: "¿Garou unidos? Una perspectiva temible."
   
 fianna_objective_decision: "Héroes de Gaia"
 fianna_objective_decision_tooltip: "¡Las Islas son la tierra de nuestros ancestros y ninguna sanguijuela nos echará de aquí!"
 fianna_objective_decision_desc: "Tras haber sido los dueños indiscutibles de las Islas, los Fianna han pasado por tiempos difíciles con el regreso de Mithras y la plaga de los desollados. ¡Debemos contraatacar antes de que sea demasiado tarde!"
 fianna_objective_decision_effect_tooltip: "Obtendrás el Imperio de los Fianna [title|E], una poderosa reliquia de tu tribu, y estarás un paso más cerca de unir a los Garou." 
 fianna_objective_decision_confirm: "¡Hora de un banquete!"
 fianna_decision_custom: "El Túmulo del Mar Salvaje, en [GetTitleByKey('b_castletown').GetNameNoTier], debe estar completamente construido"
 fianna_decision_custom_a: "Las Baronías de Ávalon y las Hermanas de St-John no existen o están bajo tu control."
 fianna_decision_custom_b: "Ninguna de tus condados tiene una fe que sea hostil a las hadas."
 
 pod1230objectives_fera.7.t: "Héroes de Gaia"
 pod1230objectives_fera.7.desc: "Aunque son muy respetados por su destreza en combate y sus famosos narradores, los Fianna suelen ser considerados demasiado indisciplinados por las otras tribus. Esta falta de disciplina les ha hecho sufrir importantes reveses en las Islas, llevándolos a estar cada vez más aislados del resto de la Nación Garou.\nSin embargo, eso se acabó, ya que una sólida sucesión de gobernantes y un renovado sentido de propósito han visto a los Fianna ascender una vez más como los señores de Britania. Mientras ya se están componiendo canciones para inmortalizar esta gran hazaña, los Fianna empezarán ahora a mirar hacia el exterior, quizás para brindar su ayuda al resto de la Nación.\n...Después de recuperarse del banquete más épico que jamás hayan organizado."
 pod1230objectives_fera.7.a: "...me duele la cabeza."
 pod1230objectives_fera.8.b: "Los celtas vienen."
   
 get_fenris_objective_decision: "Berserkers de Gaia"
 get_fenris_objective_decision_tooltip: "La camada de Odín sigue viva. ¡Una afrenta para todos los guerreros del Gran Fenris!"
 get_fenris_objective_decision_desc: "A pesar de la batalla titánica que se libró contra Wotan, su descendencia aún acecha en el Sur, mientras que las sanguijuelas alemanas también avanzan en nuestras tierras. ¡Todos deben ser castigados!"
 get_fenris_objective_decision_effect_tooltip: "Obtendrás el Imperio de la Camada de Fenris [title|E], una poderosa reliquia de tu tribu, y estarás un paso más cerca de unir a los Garou." 
 get_fenris_objective_decision_confirm: "¡Derribaremos el Valhalla!"
 get_fenris_decision_custom: "El Túmulo del Invierno Fimbul, en [GetTitleByKey('b_biton').GetNameNoTier], debe estar completamente construido"
 get_fenris_decision_custom_a: "El Estado Libre y el imperio de Midgard no existen o están bajo tu control."
 
 pod1230objectives_fera.9.t: "Berserkers de Gaia"
 pod1230objectives_fera.9.desc: "Los Camada de Fenris son combatientes absolutamente temibles y nadie en la Nación Garou lo niega. Pero sus métodos violentos, que rozan lo abusivo, los mantienen enfrentados al resto de las tribus. Pero los tiempos han cambiado.\nCon el crecimiento desenfrenado de la civilización y las sanguijuelas que la controlan, los Camada de Fenris abogan por la unidad de la Nación Garou bajo su liderazgo como Alfas indiscutibles. Con la exitosa recuperación de su Tierra Natal sueca, presentan argumentos sólidos a su favor y muchos ya están acudiendo en masa a sus estandartes.\nLa sangre y la violencia derribarán a los enemigos de Gaia, y si eso no es suficiente, aún más derramamiento de sangre debería bastar..."
 pod1230objectives_fera.9.a: "¡Derribaremos los cielos!"
 pod1230objectives_fera.10.b: "¿Hacia el Ragnarok?"
   
 redtalon_objective_decision: "Ira de Gaia"
 redtalon_objective_decision_tooltip: "El $glossary_wyld$ aún no ha muerto."
 redtalon_objective_decision_desc: "La civilización avanza cada vez más sin control y las otras tribus se niegan a actuar. Nos corresponde a nosotros salvar finalmente a Gaia de esta maldita humanidad."
 redtalon_objective_decision_effect_tooltip: "Obtendrás el Imperio de las Garras Rojas [title|E], una poderosa reliquia de tu clan, y estarás un paso más cerca de unir a los Garou." 
 redtalon_objective_decision_confirm: "Recordad las profecías"
 redtalon_decision_custom: "El Túmulo del Bosque de Invierno, en [GetTitleByKey('b_kazan').GetNameNoTier], debe estar completamente construido"
 redtalon_decision_requirement: "Debes tener un [spirit_companion|E] de [GetFaithByKey('velvet_brood').GetName] con rango máximo." 
 
 pod1230objectives_fera.11.t: "Ira de Gaia"
 pod1230objectives_fera.11.desc: "Las Garras Rojas nunca cedieron ante el Impergium, esa purga de la humanidad que consideran necesaria. Mientras las otras tribus abandonaban la idea, se vieron cada vez más aisladas. Pero las Garras Rojas no son nada si no es paciencia.\nRetirándose a las estepas aún salvajes, se aseguraron de purgar la zona de cualquier forastero no deseado y esperaron su momento. Mientras las otras tribus caen presa del crecimiento de la humanidad y los vampiros que la acompaña, las Garras Rojas prosperan. Y ahora, son la fuerza más poderosa que queda en la Nación Garou y sus aullidos se harán oír.\nEl Impergium seguirá según lo previsto y Gaia será salvada con la sangre de la humanidad, les guste o no."
 pod1230objectives_fera.11.a: "Volverán a temer a los lobos."
 pod1230objectives_fera.12.b: "El hombre contra la naturaleza, otra vez"
  
 warderofmen_objective_decision: "Resiliencia de Gaia"
 warderofmen_objective_decision_tooltip: "Para sobrevivir, debemos adaptarnos"
 warderofmen_objective_decision_desc: "La humanidad ha llegado para quedarse; debemos demostrar a la Nación Garou que el camino a seguir es con ellos, no contra ellos."
 warderofmen_objective_decision_effect_tooltip: "Obtendrás el Imperio del Protector de los Hombres [title|E], una poderosa reliquia de tu clan, y estarás un paso más cerca de unir a los Garou." 
 warderofmen_objective_decision_confirm: "Un nuevo camino juntos"
 warderofmen_decision_custom: "El Túmulo de la Promesa Brillante, en [GetTitleByKey('b_acre').GetNameNoTier], debe estar completamente construido"
 warderofmen_decision_custom_a: "Posees al menos 5 libros, diarios o artefactos de inventario similares."
 
 pod1230objectives_fera.13.t: "Resiliencia de Gaia"
 pod1230objectives_fera.13.desc: "Los Protectores de los Hombres son rápidamente descartados por otras tribus como «amantes de la humanidad», pero al Protector no le importa. Al igual que su tótem espiritual, la cucaracha, se esfuerzan y sobreviven a todo. La humanidad y la civilización son ahora ascendentes, y el Protector lo sabe. Su profundo conocimiento de la inevitabilidad de la victoria de la humanidad es lo que les ha llevado a la posición de fuerza en la que se encuentran hoy.\nMientras las otras tribus intentan aferrarse a eras pretéritas, los Protectores allanan el camino hacia adelante, confiados en la racionalidad de sus planes. Al igual que ellos, la Nación Garou perdurará y evolucionará pero, lo más importante, sobrevivirá."
 pod1230objectives_fera.13.a: "Sobrevivir, perdurar, prosperar."
 pod1230objectives_fera.14.b: "¿Lobos de las ciudades?"
  
 shadowlord_objective_decision: "La Sombra de Gaia"
 shadowlord_objective_decision_tooltip: "Estamos destinados a liderar la Nación Garou, no a esos pomposos Colmillos Plateados"
 shadowlord_objective_decision_desc: "Si queremos que el resto de las tribus reconozcan nuestro legítimo derecho a gobernarlas, primero debemos hacer una fuerte demostración de fuerza."
 shadowlord_objective_decision_effect_tooltip: "Obtendrás el Imperio de los Señores de la Sombra [title|E], una poderosa reliquia de tu clan, y estarás un paso más cerca de unir a los Garou." 
 shadowlord_objective_decision_confirm: "¡Ya era hora!"
 shadowlord_decision_custom: "El Túmulo del Cielo Nocturno, en [GetTitleByKey('b_okachiv').GetNameNoTier], debe estar completamente construido"
 
 pod1230objectives_fera.15.t: "La Sombra de Gaia"
 pod1230objectives_fera.15.desc: "Durante demasiado tiempo, la Nación Garou ha carecido de un liderazgo adecuado. Los Colmillos Plateados, esos bufones parlanchines, se han jactado de «liderarnos». Pero solo han sumido a las tribus en la división y en batallas sin esperanza.\nCon nuestra Tierra Natal segura de nuevo, hemos demostrado que solo los Señores de la Sombra son aptos para liderar la Nación Garou hacia adelante. Y ahora, utilizaremos todas las herramientas a nuestra disposición para asegurar que Gaia triunfe al final. Las tribus nos seguirán hacia la victoria contra el Apocalipsis... les guste o no."
 pod1230objectives_fera.15.a: "Gaia necesita campeones astutos."
 pod1230objectives_fera.16.b: "El trono de los Colmillos Plateados ha caído."

 
 hakken_objective_decision: "Lobos de Nippon"
 hakken_objective_decision_tooltip: "Una nueva Tierra Natal para los lobos."
 hakken_objective_decision_desc: "Tras la Guerra de la Vergüenza, muchos Hakken se exiliaron en Nippon. Aunque toleramos a los [GetTrait('kueijin').GetName(GetNullCharacter)] locales, su gobierno es severo. Nippon solo puede ser gobernada con honor, y nosotros seremos los dueños de nuestro propio destino."
 hakken_objective_decision_confirm: "Es hora de que echemos raíces y hagamos de esta tierra un hogar."
 hakken_objective_decision_requirement_example: "$hakken_objective_decision_requirement$ #weak ([example.GetName])#!"
 hakken_objective_decision_requirement: "Ningún [GetTrait('vampire').GetName(GetNullCharacter)] posee tierras en [GetGeographicalRegion('world_asia_japan').GetName]"
 hakken_objective_decision_requirement_example2: "$hakken_objective_decision_requirement2$ #weak ([example.GetName])#!"
 hakken_objective_decision_requirement2: "Todos los $glossary_fera$ y [GetTrait('kueijin').GetName(GetNullCharacter)] en [GetGeographicalRegion('world_asia_japan').GetName] son tus [vassals|E]"
 hakken_objective_decision_effect: "Obtendrás el título de [GetTitleByKey('h_cherry_phoenix_court').GetNameNoTier] [title|E], que abarca todo [GetGeographicalRegion('world_asia_japan').GetName] y [GetGeographicalRegion('world_asia_korea').GetName]"
 pod1230objectives_fera.60.t: "Lobos del Este"
 pod1230objectives_fera.60.desc: "Durante mucho tiempo hemos estado en marcha. Desde nuestras primeras expediciones desde los Cárpatos, pasando por las tierras gobernadas por los Colmillos Plateados e incluso más allá de los Contemplaestrellas, hemos sido, en su mayor parte, guerreros mercenarios. Entre guerras llenas de locura y la condena de nuestros campeones por ello, nos hemos perdido. Pero no más. Ahora nos asentamos, unimos a nuestros clanes en esta zona que el resto de las Cortes de la Bestia consideran un rincón olvidado, y la hacemos nuestra. Ya han llegado noticias de nuestro éxito a las Cortes del continente, y están profundamente impresionadas con nuestros triunfos contra los nativos Uji y Tsuchigumo. Nos mantenemos firmes, orgullosos y dignos de nuestro derecho de nacimiento como guerreros de Gaia. Pero el trabajo está lejos de terminar. El Ciempiés y los Reyes Demonio siguen prosperando, a su manera. ¿Pero ahora? Ahora podemos llevarles la lucha a ellos. Como es debido, como orgullosos lobos de la Madre Esmeralda."
 pod1230objectives_fera.60.a: "Hemos encontrado un hogar adecuado."


 silentstrider_objective_decision: "El Nuevo Hogar de los Exiliados"
 silentstrider_objective_decision_tooltip: "Egipto se nos ha perdido; debemos reconstruir y empezar de nuevo."
 silentstrider_objective_decision_desc: "Aunque Marrakech es nuestro nuevo hogar desde la pérdida de Egipto, podemos trabajar para romper la maldición con la que Set nos ha vinculado. Debemos usar el conocimiento de la liga osiriana para destruir este impío encantamiento."
 silentstrider_objective_decision_effect_tooltip: "Obtendrás el Imperio de los Caminantes Silenciosos [title|E], una poderosa reliquia de tu clan, y estarás un paso más cerca de unir a los Garou." 
 silentstrider_objective_decision_confirm: "Estamos preparados ahora"
 silentstrider_decision_custom: "El Túmulo de la Rueda de Ptah, en [GetTitleByKey('b_marrakesh').GetNameNoTier], debe estar completamente construido"
 silentstrider_decision_custom_b: "[GetScriptedCharacterByHistoryID('505094').GetFirstName] y [GetScriptedCharacterByHistoryID('790126').GetFirstName], los dos principales oponentes vampiros de los Caminantes Silenciosos, deben estar muertos o en $pod_torpor$"
 silentstrider_decision_custom_c: "Un personaje con una fe de la Liga Osiriana tiene el control de El Cairo"
 
 pod1230objectives_fera.17.t: "El regreso de los exiliados a su hogar"
 pod1230objectives_fera.17.desc: "Tras su larga lucha contra Set, los Caminantes Silenciosos se vieron obligados al exilio de su Tierra Natal, Egipto. Convertidos en nómadas durante un tiempo, finalmente se asentaron en Marrakech y su fortuna ha mejorado mucho desde entonces.\nAhora que vuelven a tener el control firme de su Tierra Natal, los Caminantes Silenciosos regresan como una fuerza a la que hay que temer. La sabiduría y la fuerza de convicción que adquirieron durante su exilio también hacen que las otras tribus los busquen cada vez más, preguntándose si los Caminantes podrían no ser un candidato nuevo, poco común pero prometedor para liderar la Nación Garou."
 pod1230objectives_fera.17.a: "¡Juntos hacia Egipto!"
  
 silverfang_objective_decision: "El regreso del rey"
 silverfang_objective_decision_tooltip: "Somos los líderes de la Nación Garou, ahora y siempre."
 silverfang_objective_decision_desc: "Nuestro liderazgo sobre las otras tribus ha sido cuestionado últimamente. Se necesita una demostración de fuerza para silenciar a los disidentes."
 silverfang_objective_decision_effect_tooltip: "Obtendrás el Imperio de los Colmillos Plateados [title|E], una poderosa reliquia de tu tribu, y estarás un paso más cerca de unir a los Garou." 
 silverfang_objective_decision_confirm: "Asumo el control directo"
 silverfang_decision_custom: "El Túmulo de la Luna Creciente, en [GetTitleByKey('b_voronezh').GetNameNoTier], debe estar completamente construido"
 
 pod1230objectives_fera.19.t: "El regreso del rey"
 pod1230objectives_fera.19.desc: "Desde la época de Roma, los Colmillos Plateados han sido los líderes tradicionales de la Nación Garou. Con la caída del Imperio y el gradual desplazamiento de la tribu hacia un enfoque más oriental, esta tradición ha sido cuestionada. Tribus como los Señores de la Sombra o las Garras Rojas han surgido en el vacío de poder para socavar la autoridad de los Colmillos Plateados, mientras que otras como los Caminantes Silenciosos o los Fianna simplemente se han perdido debido a la distancia geográfica.\nSin embargo, con su reciente éxito en Rusia, los Colmillos Plateados están demostrando que solo han trasladado su sede de poder y no han perdido las capacidades que los hicieron tan respetados en primer lugar. No todas las tribus están fallando en su línea todavía, pero la nobleza de los hombres lobo se está acercando a reafirmar sus derechos naturales."
 pod1230objectives_fera.19.a: "¡Salve a los Reyes!"
 pod1230objectives_fera.20.b: "Conservan su trono... por ahora"
    
 stargazer_objective_decision: "La sabiduría de Gaia"
 stargazer_objective_decision_tooltip: "De la paz interior puede surgir una mayor unidad."
 stargazer_objective_decision_desc: "Predicamos la moderación y hemos elegido mantenernos al margen de la Nación Garou. Pero la inacción solo puede durar hasta que se convierta en indiferencia."
 stargazer_objective_decision_effect_tooltip: "Obtendrás el Imperio de los Contemplaestrellas [title|E], una poderosa reliquia de tu tribu, y estarás un paso más cerca de unir a los Garou." 
 stargazer_objective_decision_confirm: "Es hora de conocer a nuestros primos occidentales"
 stargazer_decision_custom: "El Túmulo del Leopardo de las Nieves, en [GetTitleByKey('b_xigaze').GetNameNoTier], debe estar completamente construido"
 
 pod1230objectives_fera.21.t: "La sabiduría de Gaia"
 pod1230objectives_fera.21.desc: "No participamos en la Guerra de la Rabia y nos hemos mantenido neutrales desde entonces, siguiendo nuestro propio camino. Sin embargo, hay un límite para cuánto tiempo podemos permanecer alejados de nuestros primos occidentales. Claramente, las amenazas que enfrentan los Garou en esta nueva era requieren unidad.\nLas otras tribus han demostrado una y otra vez su propensión a la acción precipitada y su falta de planificación cuidadosa. Nosotros podemos proporcionar un liderazgo sagaz para canalizar esta ira hacia asuntos más productivos. Es hora de que la Nación Garou adopte la sabiduría de Gaia."
 pod1230objectives_fera.21.a: "Es hora de calmarse y escuchar, primos."
 pod1230objectives_fera.22.b: "Tipos extraños estos"
    
 gaia_objective_decision: "El triunfo de Gaia"
 gaia_objective_decision_tooltip: "¡Hemos reclamado nuestro derecho a liderar la Nación Garou, ahora es el momento de demostrar que somos dignos!"
 gaia_objective_decision_desc: "¡Hemos reclamado nuestro derecho a liderar la Nación Garou, ahora es el momento de demostrar que somos dignos!"
 gaia_objective_decision_effect_tooltip: "Obtendrás el Imperio de la Nación Garou [title|E], una poderosa doctrina de fe especial, y los gobernantes que no sean hombres lobo quedarán tullidos." 
 gaia_objective_decision_confirm: "¡Por Gaia! ¡Adelante!"
 
 pod1230objectives_fera.23.t: "El triunfo de Gaia"
 pod1230objectives_fera.23.desc: "A pesar de la Plaga de la Desollación y el crecimiento desenfrenado de la civilización, los Garou han resistido. Bajo un liderazgo nuevo y respetado, las tribus se han unido para librar una guerra común contra los temidos vampiros y sus numerosos secuaces. Paso a paso, los hombres lobo están recuperando Túmulos perdidos, frenando el crecimiento de las ciudades y asegurándose de que la humanidad permanezca en su lugar adecuado. A medida que más y más sanguijuelas son destrozadas por colmillos y garras, no queda duda: esta es la era del Lobo.\nEl Apocalipsis puede esperar, pues los Garou están más preparados que nunca para vigilar a su amada Gaia."
 pod1230objectives_fera.23.a: "¡La Madre ha sido salvada!"
 pod1230objectives_fera.24.b: "¿Está Gaia realmente salvada?"
 pod1230objectives_fera.23.custom: "Los gobernantes que no sean hombres lobo recibirán un poderoso efecto negativo, Colapso de la Civilización, durante los próximos 100 años. Los gobernantes hombre lobo de rango inferior aceptarán ahora siempre la vasallización de este personaje, excepto los Danzantes de la Espiral Negra."
    
 blackspiraldancer_objective_decision: "Nietos adorados"
 blackspiraldancer_objective_decision_tooltip: "¡La Yaya espera que seamos amables!"
 blackspiraldancer_objective_decision_desc: "La Bruja, Baba Yaga, es una de las servidoras más fieles de nuestro amo. Si la complacemos destruyendo a sus enemigos, ¡ciertamente nos recompensará!"
 blackspiraldancer_objective_decision_effect_tooltip: "Baba Yaga te otorgará la inmortalidad, en cierto modo." 
 blackspiraldancer_objective_decision_confirm: "¿Estás feliz, Yaya?"
 blackspiraldancer_victory_objective_decision_custom: "El [title|E] de [GetTitleByKey('k_crescent_moon').GetNameNoTier] debe ser destruido o controlado por ti"
     
 pod1230objectives_fera.25.t: "Nietos adorados"
 pod1230objectives_fera.25.desc: "La rápida expansión del Velo de Sombras, en gran parte gracias a ti, ha complacido enormemente a la Pequeña Abuela, Baba Yaga. La destrucción de cualquier amenaza cercana a su dominio le permite concentrarse en asuntos más importantes, pero eso no significa que se haya olvidado de ti.\nTras un extenso ritual para asegurar que (probablemente) sobrevivas, la Bruja te ha [Glossary('Embraced','game_concept_Embrace_desc')], convirtiéndote en uno de sus «Vrykolakas», el híbrido entre vampiros y hombres lobo que algunos llaman «Abominaciones». Ahora eres inmortal y capaz de invocar algunos de los poderes de tus dos mundos. La mayoría retrocederá ante tu horrible transformación, pero tú sabes lo que realmente es: el mayor de los regalos."
 pod1230objectives_fera.25.a: "He alcanzado la perfección."
 pod1230objectives_fera.25.b: "Eso podría ser un poco excesivo..."
 pod1230objectives_fera.26.a: "¡¿Qué clase de cosa inmunda es esta?!"
 pod1230objectives_fera.26.b: "¡¿Qué clase de cosa inmunda es esta?!"   
 
 become_abomination_tt: "Como Abominación, tienes acceso total a los poderes de los vampiros excepto al Abrazo. Sin embargo, ya no eres un hombre lobo, pero mantienes el acceso a los dones de Raza y Auspicio, así como la opción de Cambio de Forma."
 become_abomination_holdings_tt: "Tus dominios cambiarán de tribales a castillos, perdiendo en el proceso sus edificios actuales, que ahora resultan incompatibles."
 
 storyteller_quest_decision: "Gran misión de Gaia"
 storyteller_quest_decision_desc: "Los hombres lobo viven (y a menudo mueren) por misiones épicas concedidas por entidades espirituales. Emprender una te reportaría grandes recompensas si logras tener éxito.\nRecopilar libros legendarios sería un esfuerzo que valdría la pena para Gaia."
 storyteller_quest_decision_tooltip: "Gana el don legendario."
 storyteller_quest_decision_confirm: "¡Por Gaia!"
 
 release_from_bondage_quest_decision: "Gran misión de la Incarna Maeljin"
 release_from_bondage_quest_decision_desc: "Los hombres lobo viven (y a menudo mueren) por misiones épicas concedidas por entidades espirituales. Emprender una te reportaría grandes recompensas si logras tener éxito.\nDestruir el opresivo Velo de Sombras ciertamente complacería a la Incarna."
 release_from_bondage_quest_decision_tooltip: "Gana el don legendario."
 release_from_bondage_quest_decision_confirm: "Abajo el muro"
 release_from_bondage_quest_decision_custom: "El título [GetTitleByKey('e_shadow_curtain').GetNameNoTier] debe ser destruido"
 
 firebringer_quest_decision: "Gran misión de Coyote"
 firebringer_quest_decision_desc: "Los hombres lobo viven (y a menudo mueren) por misiones épicas concedidas por entidades espirituales. Emprender una te reportaría grandes recompensas si logras tener éxito.\nEl bromista Coyote ciertamente estaría complacido con una misión caprichosa."
 firebringer_quest_decision_tooltip: "Gana el don legendario."
 firebringer_quest_decision_confirm: "Eso debería ser suficiente, espero"
 firebringer_quest_decision_custom: "Conceder un [title|E] de [empire|E]"
 
 prelude_to_apocalypse_quest_decision: "Gran misión de la Incarna Maeljin"
 prelude_to_apocalypse_quest_decision_desc: "Los hombres lobo viven (y a menudo mueren) por misiones épicas concedidas por entidades espirituales. Emprender una te reportaría grandes recompensas si logras tener éxito.\nPara complacer a la Maeljin, debes traer la destrucción a la tierra y demostrar tu maestría sobre las fuerzas de la corrupción."
 prelude_to_apocalypse_quest_decision_tooltip: "Gana el don legendario."
 prelude_to_apocalypse_quest_decision_confirm: "¡Poder ilimitado!"
 prelude_to_apocalypse_quest_decision_requirement: "Debes tener un [spirit_companion|E] de [GetFaithByKey('wyrmbound').GetName] en rango máximo."
 
 coruroc_quest_decision: "Misión personal de Coruroc"
 coruroc_quest_decision_desc: "Coruroc te ha pedido que limpies la mancha de los Danzantes de la Espiral Negra en nombre de los Aulladores Blancos. ¡Cada uno de sus impuros nidos debe ser purgado!"
 coruroc_quest_decision_tooltip: "Vengar a los Aulladores."
 coruroc_quest_decision_confirm: "¿Purificado al fin?"
 coruroc_quest_decision_custom: "No debe haber ningún [ruler|E] que siga la religión [religion|E] de los [GetReligionByKey('blackspiraldancer_religion').GetName] en el mapa"
 coruroc_quest_decision_custom_ex: "$coruroc_quest_decision_custom$ #weak ([example.GetFirstName])#!"      
 
 aidan_farwatcher_quest_decision: "Misión personal de Aidan Farwatcher"
 aidan_farwatcher_quest_decision_desc: "Impulsado por la venganza por su tribu traicionada, Aidan Farwatcher te ha pedido que mates a los Danzantes de la Espiral Negra."
 aidan_farwatcher_quest_decision_tooltip: "¿La Espiral deshecha?"
 aidan_farwatcher_quest_decision_confirm: "Una venganza sangrienta"
 
 stop_flaying_plague_decision: "Detener la Plaga de la Desollación"
 stop_flaying_plague_decision_tooltip: "¡Debe haber una solución!"
 stop_flaying_plague_decision_desc: "La Plaga de la Desollación está cobrándose incontables vidas de Garou y Parentela a su paso. Si no se hace nada al respecto, este podría ser el fin de los que antaño fueron los orgullosos guerreros de Gaia.\n\nLos Caminantes Silenciosos están trabajando en una solución. Si no se hace nada antes de ese momento, creen que podrán lograr resultados para 1265."
 stop_flaying_plague_decision_effect_tooltip: "La Plaga de la Desollación detendrá su propagación actual." 
 stop_flaying_plague_decision_confirm: "¡Es ahora o nunca!"
 stop_flaying_plague_decision_custom: "Necesitas 10 o más en cada atributo, excepto en Destreza, donde se necesitan 40 o más. Los atributos de los miembros de tu manada también pueden servir."
 
 pod1230objectives_fera.27.t: "Acabar con una enfermedad"
 pod1230objectives_fera.27.desc: "Gracias a las habilidades de tu manada y de tu séquito, has logrado descubrir pistas sobre la verdad respecto a la Plaga de la Desollación. Esta terrible enfermedad era, en efecto, de origen sobrenatural, aparentemente creada por un grupo de magos dedicados al $glossary_wyrm$ que se hacían llamar el Círculo del Rojo.\nEstos necios ya estaban detrás de varios ataques descarados contra Túmulos orientales, especialmente en Sofía, y aunque intentaron borrar sus huellas, no lo han hecho bien ni con suficiente rapidez.\nAl asaltar su guarida, has sentido una gran satisfacción al abrirte paso a tajos entre estos cultistas corrompidos por el Wyrm hasta que sus círculos rituales quedaron rojos con su propia sangre.\nAunque la amenaza de la Plaga de la Desollación ha quedado atrás, aún quedan dudas sobre los detalles de su creación: algunas pistas apuntan a un misterioso vampiro y otras a un demonio. Esto podría merecer la pena investigarlo en el futuro pero, al menos por ahora, tu deber con Gaia se ha cumplido."
 pod1230objectives_fera.27.a: "¡Un triunfo legendario!"
 pod1230objectives_fera.28.a: "Es bueno para los lobos, supongo."
 pod1230objectives_fera.28.b: "¡Finalmente!"
 
 weaponize_flaying_plague_decision: "Convertir la Peste de la Desollación en arma"
 weaponize_flaying_plague_decision_tooltip: "¿El arma definitiva contra los hombres lobo?"
 weaponize_flaying_plague_decision_desc: "Los $POD_splat_werewolf_plural$ y sus familias, los [GetTrait('kinfolk').GetName(GetNullCharacter)], se han visto afectados recientemente por una enfermedad muy letal: la Peste de la Desollación. Claramente están trabajando duro para encontrar una solución pero, hasta entonces, este raro método para romper las defensas de un lupino presenta una oportunidad."
 weaponize_flaying_plague_decision_effect_tooltip: "Podrás propagar la Peste de la Desollación como una interacción." 
 weaponize_flaying_plague_decision_effect_tooltip_2: "Al usar la Peste de la Desollación en un prisionero, puedes tener cierto éxito al abrazarlo y convertirlo en una [GetTrait('abomination').GetName(GetNullCharacter)] (excepto los $glossary_fera$ que no pueden convertirse en abominación en absoluto)." 
 weaponize_flaying_plague_decision_confirm: "¡Mi arma secreta perfeccionada!"
 weaponize_flaying_plague_decision_custom: "Necesitas 3 o más hombres lobo prisioneros para experimentar con ellos."
 weaponize_flaying_plague_decision_customb: "Los hombres lobo están trabajando duro para encontrar el origen de la Peste de la Desollación. Una vez que lo hagan (alrededor de 1240), esta decisión desaparecerá."
 
 pod1230objectives_fera.29.t: "Peste de la Desollación convertida en arma"
 pod1230objectives_fera.29.desc: "Los verdaderos orígenes de la Peste de la Desollación son misteriosos. El infernalista Círculo del Rojo parece ser el culpable más probable, pero también te has topado con menciones de interferencias de un demonio importante e incluso de algunos vampiros. En cualquier caso, es una hazaña muy impresionante de magia ritualizada con un claro tinte infernal.\nTus propios experimentos con los hombres lobo a tu disposición han logrado descubrir lo suficiente del proceso como para comprender ahora cómo replicarlo si fuera necesario.\nIncluso si los hombres lobo terminan destruyendo la fuente de la actual Peste de la Desollación, podrás usarla en el futuro."
 pod1230objectives_fera.29.a: "Una herramienta útil, sin duda..."
#pod1230objectives_fera.30.a: "I don't care"
#pod1230objectives_fera.30.b: "What it mean?"   

 gaian_church_objective_decision: "La Madre de Todo"
 gaian_church_objective_decision_tooltip: "La Humanidad debe llegar a comprender a Gaia."
 gaian_church_objective_decision_desc: "Algunos hombres lobo intentan infiltrarse en la Iglesia por verdadera devoción u oportunismo. Intentan confundir a Gaia con la Virgen María y empujar a esta última hacia un mayor protagonismo en las enseñanzas de Roma."
 gaian_church_objective_decision_effect_tooltip: "Cambiarás las enseñanzas de la iglesia y casarás los ideales gaianos con la institución humana." 
 gaian_church_objective_decision_confirm: "Guíanos, Madre"
 gaian_church_objective_decision_custom1: "Los $POD_splat_hunter_plural$ dejarán de ver a los Garou como un enemigo incompatible. En su lugar, los Garou serán considerados guardianes, protectores, hacedores de milagros o encargados de una misión divina.\nEsto resultará en que sus fes puedan cooperar con mayor facilidad."

 pod1230objectives_fera.125.desc: "Mientras que la mayoría de los hombres lobo se horrorizaron ante el ascenso del cristianismo, unos pocos vieron una oportunidad, y menos aún vieron un indicio de Gaia en la reverencia de los mortales hacia María. Aunque al principio fueron facciones marginales, utilizaron bien el rápido crecimiento del poder de la Iglesia e influyeron sutilmente en los debates teológicos para favorecer el culto a María siempre que fue posible.\nHa pasado mucho tiempo y muchos intentos fallidos, pero los resultados empiezan a verse. Con esta influencia aparentemente sutil, la «Iglesia de Gaia» ha logrado crear un efecto de cascada que culmina en que la Iglesia Católica desvíe silenciosamente su atención de los hombres lobo hacia otras preocupaciones."
 pod1230objectives_fera.125.a: "Todos bajo una sola Madre"
 gaiachurch_objective_decision_custom_roma: "El poseedor de [GetTitleByKey('c_roma').GetNameNoTier] debe ser un [GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName] o de tu fe."
 
 bagheera_objective_decision: "Akari, Pourra, Doyala"
 bagheera_objective_decision_tooltip: "Búsqueda, Fundación, Legado"
 bagheera_objective_decision_desc: "Los Bagheera se ven a sí mismos como los más polifacéticos de la estirpe felina. Sus muchos talentos y su gran carisma convierten a las panteras en la única tribu aceptada como amiga por todas las demás. ¿Quizás podrían aprovechar este hecho para presionar por la unidad en la Nación Bastet?"
 bagheera_objective_decision_effect_tooltip: "Desbloquearás una cadena de eventos que te pondrá en el camino para unir la Nación Bastet. Como Bagheera, este proceso será un poco más fácil." 
 bagheera_objective_decision_confirm: "Firme como un gato."
 bagheera_objective_decision_custom: "Necesitas 10 o más en cada atributo, excepto en Destreza, donde se necesitan 40 o más. Los atributos de los miembros de tu manada también pueden servir."
  
 pod1230objectives_fera.31.desc: "Según sus leyendas, los Bagheera fueron creados una vez como los jueces de la estirpe felina. Aunque este papel fue abandonado hace mucho tiempo, han conservado la curiosidad natural y el carisma amistoso que ello conllevaba. Como suelen decir, son la encarnación más pura del espíritu felino: sabiduría, amor e ira, todo fundido en uno solo. De forma única entre las fracturadas tribus Bastet, los Bagheera lograron mantener una relación cordial con todos sus primos y, con su reciente ascenso a la fama, ha nacido la idea de que tal vez es hora de que las panteras lobo aprovechen esta fuerza y presionen para la unificación de la dividida Nación Bastet.\nAunque las otras tribus se muestran escépticas en el mejor de los casos, el actual y talentoso liderazgo de los Bagheera ha logrado, al menos, sentarlos en la mesa de negociación. Ahora queda por ver si las carismáticas panteras llevarán este esfuerzo hasta una conclusión satisfactoria."
 pod1230objectives_fera.31.a: "¡Todos somos hijos de Seline!"

 bubasti_objective_decision: "Gato contra Serpiente"
 bubasti_objective_decision_tooltip: "Somos pacientes. Esperaremos nuestra venganza triunfal."
 bubasti_objective_decision_desc: "Los Bubasti, antaño venerados como dioses por los egipcios, lo han perdido todo debido a su guerra contra los Setitas. Pero, al igual que la propia Bast, son pacientes, y los seguidores de la serpiente aún no han visto lo último de los gatos negros de Medianoche de Khem."
 bubasti_objective_decision_effect_tooltip: "Liberarás a tus parientes felinos capturados, lo que te permitirá recibir ayuda de ellos en el futuro.\nTambién desbloquearás una cadena de eventos que te pondrá en el camino para unir la Nación Bastet." 
 bubasti_objective_decision_confirm: "En acecho."
 bubasti_objective_decision_extra1: "Debes tener al menos 20 [perks|E] en [sorcery_lifestyle|E]"
  
 pod1230objectives_fera.32.desc: "Una vez venerados como dioses por el pueblo de Egipto, los Bubasti lo perdieron todo en su guerra contra los seguidores de Set. Sin embargo, han sido pacientes, y sus milenios de conocimiento de las artes mágicas les permitieron observar y esperar el momento adecuado para contraatacar.\nY lo han encontrado.\nLiderando una audaz fuerza combinada de la $glossary_osirian_league$ en el templo setita de Ombos, los Bubasti lograron rescatar a sus parientes perdidos, los gatos Kyphur, y asestar un poderoso golpe a sus enemigos eternos.\nCon su orgullo restaurado y permitiéndose finalmente que sus parientes felinos prosperen de nuevo, los gatos de Medianoche de Khem han causado una gran impresión en el resto de la Nación Bastet. Aunque muchos todavía desconfían de su extraña hechicería, la mayoría está, al menos, dispuesta a considerar la idea de permitir que los Bubasti asuman un papel más prominente en el futuro."
 pod1230objectives_fera.32.a: "Inclínate ante el gato de las sombras."

 ceilican_objective_decision: "Danza de locos"
 ceilican_objective_decision_tooltip: "El tiempo del ocio y el descuido ha terminado. Los traidores Faerie pagarán."
 ceilican_objective_decision_desc: "Que alguna vez fueron despreocupados y vivieron una vida de hedonismo, los Ceilican han sido traicionados por el señor Faerie Samhach, quien los cazó con tanta eficiencia que casi los lleva a la extinción. Liberar a estos cautivos requeriría un plan sólido y un grupo de héroes aún más sólido, pero podría ser la única esperanza de supervivencia para la tribu Ceilican."
 ceilican_objective_decision_effect_tooltip: "Liberarás a tus hermanos y hermanas capturados, quienes entonces se unirán a tu corte.\nTambién desbloquearás una cadena de eventos que te pondrá en el camino para unir la Nación Bastet." 
 ceilican_objective_decision_confirm: "Otro tipo de danza..."
   
 pod1230objectives_fera.33.desc: "Que alguna vez fueron despreocupados y vivieron una vida de hedonismo, los Ceilican han sido traicionados por el señor Faerie Samhach, quien los cazó con tanta eficiencia que casi los lleva a la extinción. Sin embargo, los «gatos volubles» no estaban dispuestos a rendirse y, bajo tu diligente liderazgo, lograron protagonizar un sorprendente regreso, asaltando la corte Faerie del señor Samhach y liberando a sus hermanos cautivos.\nMientras los victoriosos Ceilican bailan y celebran entre las ruinas de la corte del odiado traidor, el resto de la Nación Bastet nota este desconcertante acontecimiento. Considerados extintos alguna vez, parece que ahora será el momento de dar la bienvenida de nuevo a los Ceilican entre sus hermanos felinos, ¿quizás una señal de la voluntad de la Madre Seline para que sus hijos finalmente dejen atrás sus rencores personales y se unan bajo una sola bandera?"
 pod1230objectives_fera.33.a: "¡La fiesta no ha terminado!"

 khan_objective_decision_judgment_hammer: "Debes recuperar el [GetPODArtifact('judgment_hammer').GetName], el arma más preciada del Khan y, posiblemente, la más poderosa de todo el Bastet."
 khan_objective_decision: "Tigres sabios y feroces"
 khan_objective_decision_tooltip: "Al alcanzar el equilibrio perfecto, mostraremos el camino para la Nación Bastet."
 khan_objective_decision_desc: "Cazadores regios, guerreros y Mentores, los Khan son la verdadera nobleza del Bastet a pesar de lo que los tiránicos Simba puedan afirmar. Al perfeccionarse, podrán demostrar a la estirpe felina que son verdaderamente elegidos por la Madre Seline para guiarlos hacia un futuro glorioso."
 khan_objective_decision_effect_tooltip: "Esto mejorará el Martillo del Juicio.\nTambién desbloquearás una cadena de eventos que te pondrá en el camino para unificar la Nación Bastet." 
 khan_objective_decision_confirm: "Pasión, vigor y sabiduría."
  
 pod1230objectives_fera.34.desc: "Los coléricos Simba creen que el Bastet debería ser liderado por un león, una criatura perezosa que depende de sus hembras para cazar y de su fuerza para someter a los demás mediante la intimidación. Los Khan muestran, en cambio, el ejemplo del tigre: un depredador sabio y elegante que lucha por sí mismo cuando es necesario, pero que por lo demás busca mejorar su condición y la de su manada. Durante mucho tiempo, los demás Bastet han esperado secretamente que los Khan asuman un papel más prominente en la Nación Bastet para contrarrestar a los Simba.\nGracias a tu liderazgo constante y a la recuperación de la legendaria Martillo del Juicio, este momento ha llegado. Los Simba podrán posar y gruñir todo lo que quieran, pero las otras tribus se están agrupando ahora tras el llamado de unidad de los tigres."
 pod1230objectives_fera.34.a: "¡Comienza una era brillante para la estirpe felina!"

 simba_objective_decision: "Los tiranos leones"
 simba_objective_decision_tooltip: "El león es el rey de la naturaleza. Es hora de recordárselo."
 simba_objective_decision_desc: "Los Simba son los legítimos gobernantes de la estirpe felina. Sin embargo, los momentos de debilidad y las acusaciones de «gobierno tiránico» han erosionado este derecho. Es hora de recordar a las otras tribus quién manda."
 simba_objective_decision_effect_tooltip: "También desbloquearás una cadena de eventos que te pondrá en el camino para unificar la Nación Bastet." 
 simba_objective_decision_confirm: "Larga vida a los reyes."
  
 ruler_catkind_dynasty_modifier: "Leones regios y pavorosos"
 ruler_catkind_dynasty_modifier_desc: "Los Simba han reafirmado su derecho al dominio sobre las demás tribus del Bastet. Los leones están preparados para defenderlo ante cualquiera que sea lo bastante necio como para cuestionar esta verdad." 
 pod1230objectives_fera.35.desc: "Las leyendas de los Simba afirman que cada tribu del Bastet fue creada por la Madre Seline con un propósito en mente. La suya era ser el señor. Obviamente, los demás Bastet suelen discrepar profundamente de esa interpretación. Sin embargo, sus patéticos gemidos no son de importancia para los poderosos leones.\nMientras las otras tribus se pierden en inútiles preocupaciones mezquinas, los Simba hacen lo único que vale la pena: conquistan y afirman su derecho a gobernar África y más allá como los verdaderos reyes de esta tierra. Y con sus recientes éxitos al respaldar esa afirmación, las otras tribus guardan silencio por una vez."
 pod1230objectives_fera.35.a: "Un verdadero rey busca lo que puede tomar."
 
 swara_spiritual_guardians_modifier: "Espíritu de Damaa"
 swara_spiritual_guardians_modifier_desc: "Gracias a sus estrechos vínculos con el mundo espiritual, los Swara pueden confiar en la ayuda de otros mundos con mucha más facilidad que las demás tribus del Bastet."
 swara_objective_decision: "Guardianes de los lugares puros"
 swara_objective_decision_tooltip: "Mientras los demás discuten, nosotros cumplimos el trabajo que la Madre Seline nos confió."
 swara_objective_decision_desc: "Los Swara son los guardianes de los lugares cargados espiritualmente. Mientras otras tribus del Bastet los descartan como cobardes y solitarios, defienden secretamente la pureza de África con un celo que incluso un Khan envidiaría."
 swara_objective_decision_effect_tooltip: "También desbloquearás una cadena de eventos que te pondrá en el camino para unificar la Nación Bastet." 
 swara_objective_decision_confirm: "Hacemos lo que debe hacerse."
 swara_objective_decision_caern_tooltip: "Necesitas tener un Túmulo de cada tipo al máximo (Edificios ducales de nivel 5, Túmulo de la Voluntad, Furia, Liderazgo, Sabiduría y Enigmas)"

 pod1230objectives_fera.36.desc: "Los werecheetah son misteriosos para las otras tribus. Muchos los descartan como cobardes, que aparentemente siempre huyen sin rumbo de un lugar a otro evitando el conflicto. Nada está más lejos de la realidad. Los Swara son defensores diligentes de la pureza de la tierra y luchan con tanta dureza como cualquier león cuando su deber sagrado se ve amenazado.\nAunque no lo han estado pregonando, su trabajo ha empezado a ganar reconocimiento entre la Nación Bastet últimamente. Las otras tribus guardan silencio, contemplando que estuvieron discutiendo u obsesionándose con preocupaciones triviales mientras los Swara cumplían las órdenes de la Madre Seline. Esto ha generado un impulso sorprendente que los sitúa a la vanguardia del renovado llamado a la unidad del Bastet. Queda por ver si el habitualmente aislacionista Pueblo de Plata atenderá ese llamado en el futuro."
 pod1230objectives_fera.36.a: "¿Están empezando a comprenderlo?"
 
 pod1230objectives_fera.37.t: "Unificación de la Nación Bastet"
 pod1230objectives_fera.37.desc: "Con tu reciente éxito al situar a tu tribu a la vanguardia del Bastet, la idea de consolidar las tribus dispersas en un todo cohesivo ha resurgido una vez más. La mayoría de las leyendas de la estirpe felina coinciden en que la Madre Seline pretendía originalmente que trabajaran juntos y que la división ocurrida en los primeros días fue la causa principal de su derrota contra los hombres lobo durante la Guerra de la Rabia.\nAun así, a pesar de este hecho aceptado, será una tarea muy difícil reunir de nuevo a la estirpe felina. Cada tribu tendrá que ser convencida, y los gatos no son más que criaturas tercas y volubles al mismo tiempo."
 pod1230objectives_fera.37.a: "Escuchemos su punto de vista."
 
 pod1230objectives_fera.38.desc: "Los Bagheera están totalmente de acuerdo con tu plan para restaurar la Nación Bastet. Después de todo, han abogado por ello durante siglos. Sin embargo, los jueces de la estirpe felina no quieren que se repitan los errores del pasado y quieren estar seguros de que eres apto para guiar a tus hermanos hacia un futuro próspero.\nPretenden observar cómo trabajas y cómo te rodeas como gobernante antes de comprometerse plenamente con la causa. Para ayudar en este asunto, han ofrecido las enseñanzas de uno de sus Mentores más sabios para trabajar en tus debilidades mientras mejoras tus fortalezas."
 pod1230objectives_fera.38.a: "Nos las arreglaremos bien por nuestra cuenta."
 pod1230objectives_fera.38.b: "Se agradece su disposición a ayudar."
 new_objective_effect_tooltip: "Hay una nueva decisión importante disponible."
 
 bagheera_nation_decision_custom: "Necesitas 15 o más en cada atributo, excepto en Destreza, donde se necesitan 50 o más. Los atributos de los miembros de tu Manada también pueden contar."
 bastet_nation_progress_objective_decision_effect_tooltip: "Estarás un paso más cerca de restaurar la Nación Bastet."
 bagheera_nation_objective_decision: "La Nación Bastet: los Bagheera"
 bagheera_nation_objective_decision_tooltip: "Debemos ser juzgados como dignos."
 bagheera_nation_objective_decision_desc: "Los Bagheera se ven a sí mismos como los más equilibrados de la estirpe felina. Sus múltiples talentos y su gran Carisma convierten a las Panteras en la única tribu aceptada como amiga por todas las demás. Están ansiosos por participar en tu empeño por unificar el Bastet, pero quieren asegurarse primero de que serás un gobernante sabio y competente."
 bagheera_nation_objective_decision_confirm: "Una excelente muestra de liderazgo."
 
 pod1230objectives_fera.39.desc: "Los Bubasti, francamente, no parecen mostrar interés alguno por tu deseo de unificar la Nación Bastet. Los misteriosos felinos de las sombras de Egipto tienen sus propios problemas que resolver, sobre todo el secuestro de su parentela, los gatos Kyphur, por parte de los Seguidores de Set. Están dispuestos a aceptarte como el gobernante de la estirpe felina... si prometes dedicar tus considerables recursos a ayudarlos. Sin embargo, no vienen con las manos vacías: se ofrecen a enseñarte los secretos de su magia ancestral, heredada de los días en que la propia Isis nutrió a su tribu."
 pod1230objectives_fera.39.a: "Nuestra causa es la vuestra."
 pod1230objectives_fera.39.b: "¿Has dicho magia?"
 pod1230objectives_fera.39.c: "Estoy seguro de que podemos convencerles para que lo reconsideren."
 used_bagheera_joker_tooltip: "Usarás tu «joker», una oportunidad única para reunir directamente a esta tribu en tu causa en lugar de tener que cumplir su petición."
 
 bubasti_knight_help_modifier: "Ayudando a los Bubasti"
 bubasti_knight_help_modifier_desc: "Muchos de tus mejores campeones se encuentran actualmente lejos, ayudando a los Bubasti a planificar la liberación de su parentela de los Seguidores de Set."
 bubasti_nation_objective_decision: "La Nación Bastet: los Bubasti"
 bubasti_nation_objective_decision_tooltip: "Es hora de que salgan de las sombras."
 bubasti_nation_objective_decision_desc: "Los Bubasti, antaño venerados como dioses por los egipcios, lo han perdido todo debido a su guerra contra los Setitas. Se comprometerán con tu causa si les proporcionas el apoyo suficiente para recuperar su gloria perdida, empezando por su parentela capturada."
 bubasti_nation_objective_decision_confirm: "Eso debería ser suficiente."
  
 ceilican_nation_objective_decision: "La Nación Bastet: los Ceilican"
 pod1230objectives_fera.40.desc: "Un invitado inesperado ha conmocionado a los representantes reunidos de la Bastet al afirmar que es miembro de los Ceilican. Se pensaba desde hacía mucho tiempo que los «gatos mercuriales» del folclore celta habían muerto, pero un puñado de ellos logró esconderse y sobrevivir. Al enterarse del renovado esfuerzo por unificar la Bastet, han venido a solicitar humildemente tu asistencia para liberar a sus supervivientes del alcance de su némesis.\nComo posible gobernante de todos los Hijos de Seline, te resultaría difícil rechazar tal súplica de ayuda."
 pod1230objectives_fera.40.b: "¿Escondiéndose tanto tiempo? Debes conocer algún truco o dos."  
 ceilican_nation_objective_decision_tooltip: "Primos olvidados que regresan a la familia."
 ceilican_nation_objective_decision_confirm: "¡Una victoria digna del nuevo gobernante de la Bastet!"
 any_knight_ceilican_tooltip: "Debes tener 5 o más caballeros con al menos 45 de Destreza."
 
 khan_nation_objective_decision: "La Nación Bastet: los Khan"
 pod1230objectives_fera.41.desc: "Los poderosos hombres-tigre siempre han sido considerados candidatos fuertes para el liderazgo de la nación Bastet; su fuerza inigualable y su conducta honorable les hacen respetados por los demás. Aun así, han aceptado con benevolencia dejar un segundo plano a tus propias ambiciones, reconociendo tu impresionante éxito hasta ahora. Los Khan, sin embargo, te han planteado un desafío para demostrar que eres, en efecto, el elegido de Seline que pretendes ser. Incluso se han ofrecido a someterte a su prueba tradicional para la nobleza Khan, un ejercicio despiadado y difícil muy conocido. Aunque no sería suficiente para ganar su lealtad, esto ciertamente mejoraría tu legitimidad ante la Bastet en su conjunto."
 pod1230objectives_fera.41.a: "Escucharé vuestra petición."
 pod1230objectives_fera.41.b: "Sobre esa prueba..."
 khan_nation_objective_decision_desc: "Cazadores regios, guerreros y Mentores, los Khan son la verdadera nobleza de la Bastet a pesar de lo que pueda afirmar el tiránico Simba. No aceptarán a un gobernante que no muestre la misma perfección tanto en cuerpo como en mente."
 khan_nation_objective_decision_tooltip: "Hacer amistad con los tigres."
 khan_nation_objective_decision_confirm: "Soy el Khan de los Khans."
   
 simba_nation_objective_decision: "La Nación Bastet: los Simba"
 pod1230objectives_fera.42.desc: "Como reyes autoproclamados de la nación Bastet, los orgullosos y arrogantes hombres-león siempre han alardeado de que ellos deberían gobernar, llegando a menudo a las manos con otros Bastet para defender su derecho si fuera necesario.\nDe algún modo, ha ido incluso peor.\nHa hecho falta mucho esfuerzo para someter a los delegados Simba y evitar que se lanzaran sobre ti con las garras por delante para «castigarte por tu impudencia». Todavía están gritando desesperadamente mientras son arrastrados fuera de la sala y te dejan solo para considerar tu siguiente movimiento. Está quedando claro que los leones solo serán sometidos si demuestras tu poder en su propio territorio: África."
 pod1230objectives_fera.42.a: "Es hora de domesticarlos."
 pod1230objectives_fera.42.b: "Necesitamos una cabeza de puente para comenzar nuestra invasión."
 simba_nation_objective_decision_desc: "Los Simba son los legítimos gobernantes de la estirpe felina... al menos según ellos mismos. No renunciarán a este derecho hasta que sus tierras ancestrales sean conquistadas por alguien dispuesto a desafiarlos en su propio territorio."
 simba_nation_objective_decision_tooltip: "Cazar leones."
 simba_nation_objective_decision_confirm: "Es hora de lanzarlos por un precipicio."
 POD_simba_heartlands: "Tierras ancestrales de los Simba: Hausaland, Igbo-Benue, Yorubaland y Borgu"  
   
 swara_nation_objective_decision: "La Nación Bastet: los Swara"
 pod1230objectives_fera.43.desc: "Como prueba de su respeto, los aislacionistas Swara te han invitado a uno de sus señoríos para discutir tu propuesta de reunificar la Nación Bastet. Los hombres-guepardo no tienen intención de interponerse en tu camino ni de cuestionar tu derecho, pero te recuerdan el deber sagrado de los Hijos de Seline: proteger las tierras puras. Si puedes demostrar tu compromiso con este deber ancestral, se unirán plenamente a la causa. De lo contrario, seguirán a su aire, lejos de las intrigas del resto de la estirpe felina, como siempre lo han hecho.\nA juzgar por algunas debilidades estructurales que has notado en este señorío específico, crees que podrías hacer una donación para ayudarles a mejorar sus defensas aquí, demostrando que te tomas su petición muy en serio."
 pod1230objectives_fera.43.a: "Consideraré vuestra petición."
 pod1230objectives_fera.43.b: "Una tarea importante. Permíteme ayudar ahora mismo."
 swara_nation_objective_decision_desc: "Los Swara son los guardianes de los lugares con carga espiritual. Quieren ver tu compromiso con su causa antes de unirse plenamente a tu proyecto de reconstrucción de la Nación Bastet."
 swara_nation_objective_decision_tooltip: "Los protectores necesitan nuestra protección."
 swara_nation_objective_decision_confirm: "Una gran hazaña para un gran gobernante."
 
 pod1230objectives_fera.44.t: "La Nación Bastet"
 pod1230objectives_fera.44.desc: "Con astuta diplomacia, fuerza de voluntad y una no pequeña cantidad de persuasión más «directa», finalmente has reunido a todas las tribus bajo tu estandarte. Una por una vienen a reconocer tu triunfo y el nuevo gobernante de la Nación Bastet unida. Toda la estirpe felina trabaja finalmente como una sola, algo nunca visto desde los tiempos de las Leyendas, mucho antes de la guerra perdida contra los tiránicos Garou.\nAlgunos de tus nuevos «súbditos» esperan que caigas rápidamente, mientras que otros creen sinceramente en ti y en el futuro que prometiste. Al final, no importa realmente. Te has ganado esta victoria.\nAhora guiarás a tus semejantes felinos hacia un futuro brillante. La era del gato finalmente está cerca."
 pod1230objectives_fera.44.a: "Desde la luna, la Madre Seline sonríe."
 blessed_seline_modifier: "Bendecid[ROOT.Char.Custom('ES_OA')] por Seline"
 blessed_seline_modifier_desc: "La Madre de la estirpe felina sonríe a su campeona elegida."
 bastet_nation_unifier_tooltip: "Mientras ostentes el título de Nación Bastet, tendrás acceso a todos los hombres en armas Bastet."
 
 artifact_attacker_advantage_5_modifier: "[command_modifier_i|E]Ventaja del atacante [advantage|E]: #P +5#!"
 artifact_monthly_prestige_10_modifier: "[prestige|E] mensual: #P +40%#!"
 

 entoban_objective_decision: "Unificar Entoban"
 entoban_objective_decision_tooltip: "El antiguo Entoban volverá a los hijos de Gaia, íntegro una vez más."
 entoban_objective_decision_desc: "Aquí en Entoban, el corazón del mundo es donde despertamos al principio de la Edad del Sueño. Aquí guiamos a las razas más jóvenes mientras llegaban a existir. Y es aquí donde fuimos traicionados por los #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Rompehuevos#! cuando asesinaron a nuestros parientes y aliados. Entoban volverá a ser nuestro, y los hombres lobo no podrán detenernos."
 entoban_objective_decision_confirm: "Nuestro hogar primigenio."
 entoban_objective_decision_requirement_example: "$entoban_objective_decision_requirement$ #weak ([example.GetName])#!"
 entoban_objective_decision_requirement: "Ningún #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Garou#! o su [GetTrait('kinfolk').GetName(GetNullCharacter)] posee tierras en [GetGeographicalRegion('world_africa').GetName]"
 entoban_objective_decision_effect: "Ganarás el [GetTitleByKey('h_entoban').GetNameNoTier] [title|E] que abarca todo [GetGeographicalRegion('world_africa').GetName]"
 entoban_objective_decision_effect2: "Los $glossary_fera$ con capitales en [GetGeographicalRegion('world_africa').GetName] tendrán una mayor probabilidad de aceptar la vasallización"
 pod1230objectives_fera.50.t: "Entoban"
 pod1230objectives_fera.50.desc: "En eras pasadas, las tierras conocidas como África para la humanidad fueron una vez el corazón de una civilización global. Aquí hubo ciudades del tamaño de naciones hechas de maravillas y posibilidades, donde todos los estilos de vida prosperaron mucho antes de la Era de los Mamíferos. Pero ese tiempo llegó a su fin y Entoban quedó dividida. En nuestros eones de Hibernación, se fracturó y se rompió en nuestra ausencia. Pero eso fue una lástima del pasado. Ahora, mientras dejas tu Cenagal y contemplas el horizonte, todo lo que está bajo la mirada del sol es parte de un solo todo. Esas eras de glorias y maravillas perdidas aún podrían ser reclamadas. Este es el primer paso en un Camino para alcanzar las mismas alturas de grandeza que la Edad de los Reyes. Hay mucho trabajo por hacer. Pero ya has asegurado que habrá un punto de apoyo para las generaciones venideras."
 pod1230objectives_fera.50.a: "Como los Reyes Dragón de antaño, toma tu trono en el Corazón del Mundo."
 entoban_vassal_acceptance: "Entoban: $VALUE|=+0$"


 mokole_mbembe_spear_objective_decision: "Encontrar la Lanza"
 mokole_mbembe_spear_objective_decision_tooltip: "A través de una astuta diplomacia y explorando lugares perdidos, se puede encontrar una reliquia sagrada."
 mokole_mbembe_spear_objective_decision_desc: "La lanza de [GetScriptedCharacterByHistoryID('795111').GetFirstName] se ha perdido en los tiempos. Se vio por última vez en el [umbra|E], pero con los [innocents|E] merodeando, muchos Mokolé no se arriesgan a buscarla. Nuestros [spirit_companions|E], por otro lado, están mucho mejor capacitados para la tarea."
 mokole_mbembe_spear_objective_decision_confirm: "De vuelta en manos de los Mokolé."
 mokole_mbembe_spear_objective_decision_requirement: "[GetBuilding('umbral_lake_tele_03').GetName] debe estar completamente construido"
 mokole_mbembe_spear_objective_decision_requirement2: "Obtener [GetModifier('paleontologist_modifier').GetNameWithTooltip] de [UmbraGlossary('pangaea')]"
 mokole_mbembe_spear_objective_decision_requirement3: "Tienes un [spirit_companion|E] en rango máximo" 
 mokole_mbembe_spear_objective_decision_requirement4: "Tienes dos [spirit_companions|E] en rango máximo"
 pod1230objectives_fera.51.t: "Lanza del Primero"
 pod1230objectives_fera.51.desc: "Mientras atraviesas Pangea, los espíritus te guían hacia un claro olvidado, oculto bajo el cuerpo de un colosal y muerto Rey Dragón. Bajo su vientre, en una caverna formada en sus costillas, hay una única y poderosa lanza clavada profundamente en un corazón de piedra. A pesar de los restos fosilizados del Rey, la lanza sigue siendo perfecta e ilustre dentro de su corazón, manteniéndose fuerte y decidida contra los estragos del tiempo. Para una criatura de tu fuerza, es un asunto sencillo liberarla. Al retirar la lanza, el antiguo Rey se disuelve en polvo, y este rincón oculto desaparece de todo excepto de tu memoria. El peso de las eras recae sobre ti mientras la Lanza acepta a su nuevo portador."
 pod1230objectives_fera.51.a: "Un arma poderosa digna de un Rey."


 tkash_objective_decision: "Restaurar el Equilibrio"
 tkash_objective_decision_tooltip: "La oscuridad no debe vencer a la luz."
 tkash_objective_decision_desc: "Las viles criaturas de la noche amenazan a Rta, el Orden Cósmico. Deben ser consumidas por el fuego antes de que su impureza se extienda por nuestras selvas."
 tkash_objective_decision_confirm: "El Equilibrio ha sido restaurado"
 tkash_objective_decision_effect: "Ganarás el [GetTitleByKey('h_tkash').GetNameNoTier] [title|E] que abarca todo [GetGeographicalRegion('world_india').GetName]"
 tkash_objective_decision_effect2: "Todas las $POD_splat_vampire_plural$ y [GetTrait('kueijin').GetName(GetNullCharacter)] con tierras en la India sufrirán #V 5#! de daño por fuego"
 pod1230objectives_fera.52.t: "Selva Primigenia"
 pod1230objectives_fera.52.desc: "Durante milenios, esta tierra ha sido un campo de batalla. Entre las guerras de las Sanguijuelas y los Demonios Escapados, agravadas por el descuido de los Khans y la locura de los bastardos del $glossary_wyld$, a pesar de las defensas naturales de esta tierra, ha sido el epicentro de una guerra nocturna interminable desde que llegó el Demonio de Sangre. Pero, finalmente, ya no. Tu control sobre la tierra conocida por tu pueblo como T'kash es ahora absoluto, ya que ninguno de ellos esperaba tu ascenso. La miríada de inmortales está ahora dispersa y escondida. Pero no pueden escapar de la ira de tu pueblo. Como parte de una gran coronación, la luz de Helios comienza a impregnar la propia selva, esperando el momento adecuado. Mientras los Weresuchids reunidos proclaman tu nombre y la restauración de este antiguo imperio, la corona brilla mientras los Antiguos la colocan sobre tu frente. La Furia de Helios no conocerá límites cuando la luz que emana comience a arder y la luz solar, en un breve destello, bañe la India. El propio Helios ha reconocido tu derecho a gobernar. La Guerra Eterna finalmente ha terminado."
 pod1230objectives_fera.52.a: "T'kash es libre; será verdaderamente eterna."



 makara_mace_objective_decision: "Canciones en los Vientos"
 makara_mace_objective_decision_tooltip: "Canta conmigo."
 makara_mace_objective_decision_desc: "Los Makara siempre han sido los más sociales de las cuatro Corrientes, su naturaleza gregaria les ha llevado a muchas amistades. Sin embargo, la mayoría de las amistades no son suficientes para sobrevivir a estos tiempos difíciles. Aunque la legendaria maza de los Makara sería una amiga maravillosa."
 makara_mace_objective_decision_confirm: "Una actuación arrolladora."
 makara_mace_objective_decision_requirement: "Dos de tus [friends|E] deben ser de nivel al menos [kingdom|E]"
 makara_mace_objective_decision_requirement2: "Conoces al menos 8 [languages|E]"
 pod1230objectives_fera.53.t: "La maza de los vientos"
 pod1230objectives_fera.53.desc: "A medida que la actuación llega a su fin, te desplomas, exhausto/a, pero increíblemente realizado/a. Aunque muchas de las otras Corrientes considerarían tal actuación como una tontería, realizarla ha sido totalmente catártico. La ceremonia, una confirmación de amistad en tiempos de tribulación, se ha llevado a cabo con éxito. Para la mayoría de los intérpretes, la verdadera naturaleza del ritual era un misterio. Pero ahora, mientras yaces en un gran charco de reptil, surge la luz guía formada y llamada por el canto. La Maza de los Vientos, una reliquia sagrada de los Makara perdida hace mucho tiempo, ha sido invocada y entregada para ti, sabiendo que los Makara son dignos de ella una vez más. Sonríes. Ha llegado el momento del bis."
 pod1230objectives_fera.53.a: "Los vientos cantarán conmigo."


 zhong_guo_objective_decision: "Hijos de los Wani"
 zhong_guo_objective_decision_tooltip: "Estamos destinados a liderar."
 zhong_guo_objective_decision_desc: "Los Zhong Lung son los descendientes de los Reyes Dragón. Nos corresponde liderar a la joven $glossary_fera$ en el Reino Medio; nuestra edad y sabiduría darán paso a una era de prosperidad infinita."
 zhong_guo_objective_decision_confirm: "Nos convertimos en los Grandes Dragones."
 zhong_guo_objective_decision_requirement: "Debes tener tanto un [GetTrait('werewolf').GetName(GetNullCharacter)] como un [GetTrait('bastet').GetName(GetNullCharacter)] en tu [GetPlayer.Custom('PODCoterie')] que sean miembros de las [GetFaithDoctrine('doctrine_fera_beast_courts').GetBaseName]"
 zhong_guo_objective_decision_requirement2: "Tu [GetPlayer.Custom('PODCoterie')] debe tener al menos 30 en todas las [skills|E]"
 zhong_guo_objective_decision_requirement3: "Tu [GetPlayer.Custom('PODCoterie')] debe tener al menos 75 de [prowess|E]"
 zhong_guo_objective_decision_effect: "Ganarás el título de [GetTitleByKey('h_zhong_guo').GetNameNoTier] [title|E], que abarca toda la región de [GetGeographicalRegion('world_asia_china').GetName]"
 zhong_guo_objective_decision_effect2: "Todas las [faiths|E] de las [GetFaithDoctrine('doctrine_fera_beast_courts').GetBaseName] ganarán [GetFaithDoctrine('special_zhong_guo_reward_doctrine').GetBaseName]"
 pod1230objectives_fera.54.t: "Zhong Guo"
 pod1230objectives_fera.54.desc: "Para la gran mayoría de las Corrientes, los Mokolé han creído durante mucho tiempo que su época como Reyes ha pasado, y en su mayor parte se han rendido. Pero no los Zhong Lung. Mientras otras Corrientes son diezmadas, los Zhong Lung han permanecido fuertes y han encontrado un nuevo papel como filósofos y eruditos. Cambiaron y se adaptaron. Tal como has hecho tú ahora. Eres quizás una de las criaturas más fuertes del mundo, una imagen viviente de los antiguos Reyes Dragón. Las Cortes de la Bestia, la Luna y el Sol te han reconocido a ti como la nueva manifestación de los Reyes en este giro de la Rueda de las Eras. No mediante la guerra, sino por la majestad y la diplomacia, una nueva Edad de los Reyes acaba de nacer. El mundo se extiende ante ti, con la Cuna de los Wani como un corazón inexpugnable. La Segunda Era de los Reyes ha llegado."
 pod1230objectives_fera.54.a: "Me he convertido en un verdadero Príncipe de los Wani."


 gaias_memory_objective_decision: "Memoria de Gaia"
 gaias_memory_objective_decision_tooltip: "Nada puede olvidarse verdaderamente."
 gaias_memory_objective_decision_desc: "Los Mokolé son la memoria de Gaia; es hora de que cumplamos nuestro deber. Ya sea la historia de la $glossary_fera$, el giro de la [Glossary('Wheel of Ages','podgloss.wheelofages')] o el mundo mortal, lo hemos visto todo. Ahora simplemente necesitamos recordarlo."
 gaias_memory_objective_decision_confirm: "Recuerda el principio."
 gaias_memory_objective_decision_requirement: "Tu [GetPlayer.Custom('PODCoterie')] debe tener al menos otros dos $glossary_fera$ de Rango 4"
 gaias_memory_objective_decision_requirement2: "Obtén el #ILLUSTRIOUSPURPLE Eco de las Eras#! en la [journey|E] Búsqueda del Espíritu"
 gaias_memory_objective_decision_requirement3: "Un [GetTrait('kueijin').GetName(GetNullCharacter)] debe ser tu [friend|E], [best_friend|E], [lover|E] o [soulmate|E]"
 pod1230objectives_fera.55.t: "Memoria eterna"
 pod1230objectives_fera.55.desc: "Mnesis siempre ha sido una presencia contradictoria para los Mokolé. Como Memoria de Gaia, todos los Mokolé pueden deslizarse en sus sueños compartidos, pero la mayoría solo puede extraer fragmentos y retazos rotos. Pero eso no es algo con lo que te conformes. A través de una estrecha discusión con los guardianes del mundo y la búsqueda de conocimientos olvidados, aún podrías sumergirte en las profundidades de la memoria y descubrir verdades perdidas hace mucho tiempo. Todo lo que tienes que hacer ahora es atreverte a hacerlo."
 pod1230objectives_fera.55.a: "Que nunca volvamos a olvidar."


 undying_body_objective_decision: "Cuerpo Inmortal"
 undying_body_objective_decision_tooltip: "Estamos solos."
 undying_body_objective_decision_desc: "Japón está infestada de todos estos seres sobrenaturales; es hora de deshacernos de ellos. Reclamaremos estas tierras y aguardaremos el Apocalipsis. Ellos morirán y nosotros viviremos."
 undying_body_objective_decision_confirm: "Un punto demostrado."
 undying_body_objective_decision_requirement_example: "$undying_body_objective_decision_requirement$ #weak ([example.GetName])#!"
 undying_body_objective_decision_requirement: "Ninguna otra Raza $glossary_fera$ posee tierras en [GetGeographicalRegion('world_asia_japan').GetName]"
 undying_body_objective_decision_requirement2: "Tienes al menos un #V 80%#! de [soak_chance|E]"
 undying_body_objective_decision_effect: "La forma Archid gana: [GetModifier('archid_undying_flesh_modifier').GetNameWithTooltip] "
 pod1230objectives_fera.56.t: "Maestría del Cuerpo"
 pod1230objectives_fera.56.desc: "Para la mayoría, la historia de los Hengeyokai ha sido que Japón es un reclusorio aislado y remoto en el fin del mundo. Hogar principalmente de los Muertos Hambrientos y otras cosas más despreciables; algunos de los hijos de la Madre Esmeralda llamaron a esta tierra su hogar, pero claramente erraron en su deber. Los perros que casi aniquilan a tu pueblo están dispersos, los jóvenes de las otras razas han huido y ahora, solo quedáis tú y tu nidada. Un testimonio de tu voluntad y de dónde reside el favor de la Madre Esmeralda. Será duro protegerla en el fin del mundo, pero ahora, al menos tienes una base para la reclamación. Una que no puede ser negada."
 pod1230objectives_fera.56.a: "El mundo podrá romperse, pero yo no."



 zhong_lung_pearls_objective_decision: "Dominio sobre el Agua"
 zhong_lung_pearls_objective_decision_tooltip: "Somos los Señores de los Ríos."
 zhong_lung_pearls_objective_decision_desc: "Como la Corriente de Agua, nosotros, los Zhong Lung, disfrutamos de un mando aterrador sobre las aguas del mundo. Si sin embargo se pudieran recuperar las perdidas Perlas de los Reyes Dragón, nuestro poder sería absoluto."
 zhong_lung_pearls_objective_decision_confirm: "Flujo y reflujo."
 zhong_lung_pearls_objective_decision_requirement: "La regeneración de $POD_energy_gnosis$ es de al menos #V 50%#!"
 pod1230objectives_fera.57.t: "Dragón de Agua"
 pod1230objectives_fera.57.desc: "Al bañarte en la luz del sol dentro de tu Corte, el río fluye sobre ti mientras meditas en la naturaleza de lo que está por venir. El Zhong Lung ha sido considerado durante mucho tiempo como la Corriente de Agua, pero sin las Perlas de los Reyes Dragón, el título era más formal que práctico. Durante mucho tiempo, el Zhong Lung ha sufrido esta humillación, pues se rumoreaba que, tal vez, los ríos algún día os abandonarían a todos. Pero al levantarte de las aguas, envuelto en las Perlas perdidas, los detractores callarán y sus mentiras morirán en sus labios. Ya no es solo una pretensión formal. Los ríos vuelven a las garras donde pertenecen."
 pod1230objectives_fera.57.a: "El control de las aguas es mío."


 prehistoric_dreams_objective_decision: "Sueños prehistóricos"
 prehistoric_dreams_objective_decision_tooltip: "El mundo tal como fue una vez."
 prehistoric_dreams_objective_decision_desc: "Nuestras formas actuales están limitadas por lo que podemos soñar, pero estamos limitados por nuestros tiempos actuales. A través de la arena y el agua podemos recordar una época en la que los dinosaurios caminaban por el mundo. Con estos recuerdos, podemos moldear nuestras formas en algo verdaderamente aterrador."
 prehistoric_dreams_objective_decision_confirm: "El mito hecho realidad."
 prehistoric_dreams_objective_decision_requirement: "Haber descubierto todos los Dinosaurios en los [UmbraGlossary('astral_reaches')]"
 prehistoric_dreams_objective_decision_requirement2: "Haber visitado cada [holy_site|E]"
 prehistoric_dreams_objective_decision_effect: "La forma de Archid gana: [GetModifier('archid_prehistoric_terror_modifier').GetNameWithTooltip] "
 pod1230objectives_fera.58.t: "Sueños prehistóricos"
 pod1230objectives_fera.58.desc: "Dormir. Algo con lo que muchos Mokolé están familiarizados como un Espectro, un llamado a lo que muchos Mokolé consideran tiempos mejores, cuando sus cuerpos podían igualar a sus espíritus. Con demasiada frecuencia, es el fantasma de estas formas que eluden vuestros cuerpos lo que hace que tantos de los vuestros sean melancólicos, depresivos y retraídos. Pero al final de vuestro Viaje, enterrados bajo la arena entre los huesos de vuestros antepasados, esos sueños de cuerpos que se os negaron durante tanto tiempo no se desvanecen mientras os agitáis. Os levantáis, con la arena desprendiéndose de vuestra frente y crestas. Un cuerpo de dragones, una forma de Reyes surge de la arena, ese sueño hecho realidad. Habéis recorrido los Caminos sagrados, habéis recordado lo que todos fuisteis. Y ahora, estará con vosotros cada vez que despertéis, el mundo es ahora vuestro sueño viviente."
 pod1230objectives_fera.58.a: "Una pesadilla para mis enemigos."



 walking_world_objective_decision: "Caminar por el Mundo"
 walking_world_objective_decision_tooltip: "Para comprender el pasado, primero hay que conocer el presente."
 walking_world_objective_decision_desc: "El mundo ya no es como era antes, eso ha quedado claro. A medida que el pasado se desvanece en la Mnesis, debemos contemplar las maravillas que tenemos ante nosotros. Ellas también se convertirán en la Mnesis del futuro."
 walking_world_objective_decision_confirm: "El ciclo continúa siempre."
 walking_world_objective_decision_requirement: "Has visitado #V 30#! [points_of_interest|E] #weak (Actual: [THIS.Var('poi_visited').GetValue|V0])#!"
 walking_world_objective_decision_requirement2: "Tienes un #V 200%#! de [umbra_aptitude|E]"
 pod1230objectives_fera.59.t: "El tiempo sigue su marcha..."
 pod1230objectives_fera.59.desc: "A menudo, los Mokolé sueñan con eras pasadas, anhelando su regreso. Negar las obras de la modernidad y obsesionarse con el pasado. Y con demasiada frecuencia, se pudren y se corrompen en ese deseo, ciegos al mundo que les rodea. Vosotros, sin embargo, no os habéis permitido perderos en esa misma desesperación. Con el tiempo, los recuerdos de vuestra Generación serán Mnesis. Y donde otros se esconden egoístamente en sus propios recuerdos, vosotros habéis optado por crear los vuestros. Gran parte de la belleza del mundo moderno se ha sumado ahora a los recuerdos de quienes sigan vuestros pasos. Para los que vengan después de vosotros, tendrán recuerdos de las maravillas, tragedias y majestades de la humanidad y de las criaturas del mundo nocturno. Los armaréis con recuerdos modernos, frescos con todo lo que puedan necesitar no solo para sobrevivir, sino para prosperar. Un legado que el tiempo no puede borrar. Uno que perdurará y sobrevivirá a las arenas del tiempo."
 pod1230objectives_fera.59.a: "Y, sin embargo, queda mucho más por ver..."

 garou_objective_decision_caern_tooltip: "Necesitas tener un Túmulo de cualquier tipo al máximo (Edificios ducales de nivel 5, Túmulo de la Voluntad, la Furia, el Liderazgo, la Sabiduría o los Enigmas)." 


 beast_of_war_objective_decision: "La Bestia de Guerra"
 beast_of_war_objective_decision_tooltip: "Cuánta muerte."
 beast_of_war_objective_decision_desc: "El $glossary_wyrm_calamity$ desea la destrucción. A través de la calamidad y la carnicería seremos fortalecidos, para así llevar la gloria al $glossary_wyrm$."
 beast_of_war_objective_decision_confirm: "¡Llega la calamidad!"
 beast_of_war_objective_decision_requirement: "Todos vuestros [powerful_vassals|E] deben estar [intimidated|E] o [cowed|E] ante vos"

 eater_of_souls_objective_decision: "El Devora Almas"
 eater_of_souls_objective_decision_tooltip: "Mi cuerpo y sus almas."
 eater_of_souls_objective_decision_desc: "Para servir al $glossary_wyrm_consumption$, uno debe sacrificar mucho. Solo cuando nuestros propios cuerpos recorran con el poder puro del $glossary_wyrm$ y las tierras se vean drenadas de vida, esta cabeza de la Hidra estará satisfecha."
 eater_of_souls_objective_decision_confirm: "¡Consumid todo!"
 eater_of_souls_objective_decision_requirement: "Tener al menos #V 4#! [fetishes|E] equipados y activos"

 defiler_wyrm_objective_decision: "El Wyrm Profanador"
 defiler_wyrm_objective_decision_tooltip: "Todos servirán, tarde o temprano."
 defiler_wyrm_objective_decision_desc: "El $glossary_wyrm$ crece corrompiendo a otros, lo que hace que la $glossary_wyrm_corruption$ sea posiblemente la cabeza más fuerte. Uno solo puede hacer poco por su cuenta; necesitaremos más de sus secuaces para profanar el mundo."
 defiler_wyrm_objective_decision_confirm: "¡Hermosa corrupción!"
 defiler_wyrm_objective_decision_requirement: "Haber descubierto todos los [men_at_arms|E] de tipo Maligno en [UmbraGlossary('malfeas')]"
 defiler_wyrm_objective_decision_requirement2: "Tienes dos [GetFaithByKey('wyrmbound').GetName] [spirit_companions|E] en rango máximo"

 wyrm_hydra_objective_decision: "Devoción a la Hidra"
 wyrm_hydra_objective_decision_tooltip: "La verdadera Tríada asciende."
 wyrm_hydra_objective_decision_desc: "Nuestra dinastía ha servido bien al $glossary_wyrm$. Estamos preparados para dar paso a una nueva era bajo el liderazgo de los más fuertes. Entonces el mundo conocerá el verdadero miedo."
 wyrm_hydra_objective_decision_confirm: "Ahora estoy completo."
 wyrm_hydra_objective_decision_effect: "Ganarás el [GetTitleByKey('h_wyrm').GetNameNoTier] [title|E], que incluirá cualquier [empires|E] que poseas"
 pod1230objectives_fera.61.t: "El Wyrm Ascendente"
 pod1230objectives_fera.61.desc: "El poder del $glossary_wyrm_triatic$ es ahora absoluto. El $glossary_triat$ se ha debilitado. Ahora el mundo aguarda, sin saber que su fin se aproxima.\n\nNo habrá refugio para vuestra furia. Sus armas y armaduras no significarán nada, y su fe mucho menos. Verán cómo el mundo llega a su fin. Muchos resistirán, con una tenacidad admirable pero inútil, pues el mundo ya cabalga hacia las fauces del Apocalipsis. ¡No hay esperanza, no hay futuro, toda la vida está condenada!"
 pod1230objectives_fera.61.a: "¡Yo soy el fin de todas las cosas!"