l_spanish:
 
  POD_gehenna_omens.1231.notification: "Presagio de la Gehenna"
  POD_gehenna_omens.1231.desc: "Ha nacido una vaca de dos cabezas."
  POD_gehenna_omens_1231_notification_tooltip: "En serio, ha nacido una vaca de dos cabezas."
  
  POD_gehenna_omens.1240.t: "Presagio de la Gehenna"
  POD_gehenna_omens.1240.opening: "Llegan noticias de Rusia:"
  POD_gehenna_omens.1240.desc: "Los gemelos lupinos Colmillos Plateados Yuri Tvarivich y Sophia Tvarivich lideraron a varios hombres lobo contra el Zmei Sharkala el Cruel en Rusia, incluyendo a cinco Colmillos Plateados: Georges de Armenai, Boris, Foma, Vassili y Utra. También les acompañaban Pyotor, de los Caminantes de Cristal; Ulu, de los Contemplaestrellas; el Roedor de Huesos Igor Valkof; Mehmet, de los Caminantes Silenciosos; Katja, de las Furias Negras, y el héroe de la Camada de Fenris, Ragnor. Utra, Ragnor, Boris y Katja murieron en la batalla, al igual que Sophia, y Yuri fue aplastado por Sharkala mientras asestaba el golpe final."
  POD_gehenna_omens.1240.a: "¡Los Zmei están enfurecidos!" 
  POD_gehenna_omens.1240.a.tt.beast: "#beast ¡La rabia hace que las cosas se cumplan!#!"
 
  POD_gehenna_omens.1241.t: "Presagio de la Gehenna"
  POD_gehenna_omens.1241.opening: "Llegan noticias de Rusia:"
  POD_gehenna_omens.1241.desc: "La Horda Mongola llega desde las estepas como un gran diluvio, barriendo las tierras de Rusia, con sus reyes mortales sumergidos en una inundación de violencia. Pero más preocupantes aún son las historias de manadas de lupinos mezcladas entre la marea humana. Esta tribu de hombres lobo se hace llamar los Señores de las Sombras y dejan tras de sí los cadáveres tanto de ganado como de vástagos. ¿Acaso el desenfreno de las Bestias de la Luna prefigura la llegada de la Gehenna?"
  POD_gehenna_omens.1241.a: "¿¡Hasta dónde llegarán estos mongoles y sus perros!?" 
  
  POD_gehenna_omens.1242.t: "Amor y condenación"
  POD_gehenna_omens.1242.desc: "Enkara, una respetada guerrera de los Banu Haqim, no ha regresado de su reciente expedición para salvar a su [Glossary('Sire','game_concept_Sire_desc')], el antaño heroico Izhim. Peor aún, los temores albergados por los hechiceros antes de su partida han demostrado ser solo una sombra de la terrible verdad.\nIzhim ha sido corrompido por el demonio Namtaru y, aparentemente usando a Enkara como sacrificio final, su despertar maldijo a los Banu Haqim con toda la fuerza del ritual Baali lanzado sobre ellos hace tanto tiempo. Los antaño orgullosos y disciplinados guerreros de Haqim sienten ahora un intenso ansia de sangre vampírica y el odiado acto de la $pod_diablerie$ se está volviendo cada vez más común. Incluso resistir la mera llamada de la dulce sangre es ahora un asunto difícil y estresante para el $pod_clan$.\nSin embargo, los Banu Haqim son ingeniosos, y las tres castas están trabajando duro para encontrar una solución antes de que sea demasiado tarde."
  POD_gehenna_omens.1242.a: "¡Debemos aguantar!"  
  POD_gehenna_omens.1242.a.tt: "Izhim ur-Baal ha despertado con un fuerte ejército en el noreste de Persia.\nTodos los Banu Haqim reciben un modificador negativo que representa la actual maldición de sangre.\nSi los líderes de las tres facciones principales (Jamal, Al-Ashrad y Thetmes) siguen vivos en 10 años, ofrecerán soluciones para lidiar con ello."
  POD_cult_of_izhim_ur_baal: "Culto de Izhim ur-Baal"
  
  POD_gehenna_omens.6667.t: "El destino de Enkara"
  POD_gehenna_omens.6667.desc: "En el pasado antiguo, la renombrada guerrera Banu Haqim Enkara luchó junto a su [Glossary('Sire','game_concept_Sire_desc')] Izhim durante las trascendentales Guerras Baali. Izhim se perdió durante la última batalla, sacrificándose para evitar que el demonio Namtaru cruzara al mundo. Desde entonces, Enkara ha trabajado incansablemente para encontrar una forma de salvar a su amado [Glossary('Sire','game_concept_Sire_desc')]. Y parece que finalmente la ha encontrado.\nHay una gran inquietud en Alamut, la capital de los Banu Haqim, mientras Enkara se prepara para rescatar al heroico Izhim. Pero algo va mal: algunos de los más grandes líderes de los Banu Haqim, incluido el muy respetado Al-Ashrad, están discutiendo con Enkara, diciéndole que no busque más a su [Glossary('Sire','game_concept_Sire_desc')] o se arriesgará a que ocurra una gran catástrofe. Sin embargo, cuanto más la presionan, más decidida está ella a ir y la situación parece bloqueada.\nSi no se hace algo pronto, Enkara partirá, y el destino de los Banu Haqim podría cambiar para siempre."
  POD_gehenna_omens.6667.a: "Enkara, por favor, atiende a razones."
  POD_gehenna_omens.6667.effect.success.desc: "¡Enkara se echa atrás!"
  POD_gehenna_omens.6667.critical.failure.effect.desc: "El destino sigue su curso..."
  POD_gehenna_omens.6668.a: "Solo la fuerza la detendrá."
  POD_gehenna_omens.6668.effect.success.desc: "Enkara es amargamente derrotada."
  POD_gehenna_omens.6668.critical.failure.effect.desc: "El destino sigue su curso..."
  POD_gehenna_omens.6667.c: "Los necios marchitos y las viejas profecías no importan."
  
  POD_gehenna_omens.6669.t: "Viviendo con la maldición"
  POD_gehenna_omens.6669.desc: "Han pasado diez largos años desde que la insensata expedición de Enkara condenó a los Banu Haqim a sufrir toda la fuerza de la Maldición Baali. Ha sido un periodo difícil para el $pod_clan$, con muchos desafortunados eventos de $pod_diablerie$ empañando su antaño estelar reputación. Aun así, los Hijos de Haqim han aguantado, como siempre hacen.\nPuede que la Maldición nunca desaparezca realmente, y ha dejado cicatrices viciosas en la cultura del clan, pero ahora se acepta como un hecho de la no-vida, con cada Banu Haqim individual encontrando su propia forma de lidiar con este estorbo.\nLos Banu Haqim nunca serán los mismos, pero siguen aquí para aprender y crecer, como pretendía el progenitor."
  POD_gehenna_omens.6669.a: "Hemos aguantado."  
  POD_gehenna_omens.6669.a.tt: "Los Banu Haqim sufren ahora un modificador de Maldición Baali menos severo."
  POD_gehenna_omens.6669.b: "Encontrar consuelo en la fe puede ayudarme."  
  POD_gehenna_omens.6669.b.tt: "Jamal está enseñando a otros Banu Haqim a protegerse contra la Maldición Baali encontrando consuelo en lo Divino, sin importar la forma que adopte. Podrías seguir su ejemplo."
  POD_gehenna_omens.6669.c: "El Amr tiene una solución eficiente."  
  POD_gehenna_omens.6669.c.tt: "Al-Ashrad, el Amr, ha desarrollado un ritual para una \"falsa diablerie\" que permite al usuario entregarse a la Maldición sin efectos negativos. Sin embargo, es un ritual difícil y, como tal, solo está disponible para unos pocos elegidos."
  POD_gehenna_omens.6669.d: "Hay otra posibilidad..."  
  POD_gehenna_omens.6669.d.tt: "Thetmes predica abrazar la Maldición. ¿Por qué luchar contra ella? Si alguien es lo suficientemente débil como para dejarse diabolizar, significa que su alma era probablemente más útil como comida para ti que para él."
     
  #POD_gehenna_omens.1244.t: "Gehenna: ¡El fin profetizado de la Equidna!"
  #POD_gehenna_omens.1244.desc: "Hace mucho tiempo, las [scylla.GetHouse.GetBaseName] profetizaron la perdición de los [last_of_the_glycon.GetHouse.GetBaseName] así como su propia desaparición. En un esfuerzo inútil por evitar la profecía, los Guerreros buscaron destruir a las Brujas. El último de los Glycon, [last_of_the_glycon.GetFirstName], ha matado a la chiquilla de Equidna. Mientras [scylla.GetFirstName] se desmoronaba en polvo, lanzó una última profecía: 'Bajo el pie de un esclavo se retorcerán las serpientes del Nilo'. \n\nHay rumores de que algunas de las Brujas de Equidna aún sobreviven."
  #POD_gehenna_omens.1244.a: "Atraer al guerrero para que se una a mi corte."
  #POD_gehenna_omens.1244.a_success_glycon_1: "[last_of_the_glycon.GetFirstName] se une a tu corte."
  #POD_gehenna_omens.1244.a.tt.beast: "#beast ¡No! ¡Anhela nuestra sangre! ¡Conocemos bien el hambre!#!"
  #POD_gehenna_omens.1244.b: "Ofrecer refugio a las brujas"
  #POD_gehenna_omens.1244.b_success_witch_1: "[witch_of_echidna_1.GetFirstName] se une a tu corte."
  #POD_gehenna_omens.1244.b_success_witch_2: "[witch_of_echidna_2.GetFirstName] se une a tu corte."
  #POD_gehenna_omens.1244.b_success_witch_3: "[witch_of_echidna_3.GetFirstName] se une a tu corte."
  #POD_gehenna_omens.1244.b.tt.beast: "#beast ¡Sí! ¡Atráelas aquí y luego toma su sangre!#!"
  #POD_gehenna_omens.1244.c: "¡La profecía se ha cumplido! Los últimos tifonistas no son de mi incumbencia."
  #POD_gehenna_omens.1244.c.tt.beast: "#beast ¡Buen viaje! No vamos a derramar ninguna lágrima por estos cultistas condenados.#!"
  
  setite_infighting_modifier: "Luchas internas"
  setite_infighting_modifier_desc: "La represión de los movimientos heréticos en el Clan Setita ha sido contraproducente, resultando en que tanto las Brujas de Equidna como los Guerreros de Glycon se hayan descontrolado."
  setite_infighting_glycon_modifier: "Guerreros Setitas triunfantes"
  setite_infighting_glycon_modifier_desc: "Las noches de luchas internas han terminado para los Setitas, los Glycon se han reformado en una nueva facción de Guerreros Setitas más leal, mientras que las Brujas parecen haber desaparecido para siempre."
  setite_infighting_echidna_modifier: "Brujas de Equidna triunfantes"
  setite_infighting_echidna_modifier_desc: "Las noches de luchas internas han terminado para los Setitas, los brutales Glycon han desaparecido (aparentemente) para siempre, mientras que las Brujas de Equidna han sido plenamente reintegradas en el culto de Set."
  
  POD_gehenna_omens.1244.t: "Pícaros y brujas"
  POD_gehenna_omens.1244.desc: "El clan Setita está dividido entre muchas facciones. Lo que antaño fue una fortaleza se está convirtiendo ahora en una debilidad.\nPor un lado, los brutales y hambrientos de poder Guerreros de Glycon campan a sus anchas, empañando la reputación de sutileza del clan con su comportamiento insensible tras las Cruzadas. Aunque antaño fueron una parte importante del triunvirato gobernante (Sacerdotes, Guerreros, Brujas), ahora son vistos como un lastre por muchos.\nPor otro lado, las Brujas de Equidna han profetizado su inminente perdición y la de los Guerreros también, algo que parecen tener prisa por provocar con su dedicación herética a un papel de \"madre de monstruos\".\nLos Hierofantes decretaron recientemente una purga de ambas facciones, lo que ha llevado a una violenta lucha interna en las filas. También lleva a que ambas busquen aliados donde puedan encontrarlos, prometiendo pagar sus deudas más adelante."
  POD_gehenna_omens.1244.a: "Los Guerreros tienen mi apoyo."
  POD_gehenna_omens.1244.b: "Las Brujas deben ser protegidas."
  POD_gehenna_omens.1244.c: "Buen viaje."
  setite_faction_choice_tt: "Esta facción recordará que acudiste en su ayuda."
 
  POD_gehenna_omens.6670.t: "De pícaros a cobras"
  POD_gehenna_omens.6670.desc: "Las luchas internas entre las diversas facciones dentro del clan Setita han cesado tras la purga (aparentemente) completa de las Brujas de Equidna. Sin embargo, los Guerreros de Glycon lograron salir de esta prueba sorprendentemente más fuertes que antes, habiendo frenado sus peores excesos para reinventarse como los \"Guerreros Setitas\". Ahora apodados las \"Cobras\", proporcionan al clan una fuente leal de músculo, a menudo muy necesario.\nLlevará algún tiempo que todos asimilen completamente este importante cambio, pero el clan Setita es ahora más fuerte gracias a esta nueva unidad.\nSin olvidar el apoyo que les brindaste durante su tiempo de necesidad, los Guerreros han enviado a un miembro de su culto para servirte como forma de recompensa."
  POD_gehenna_omens.6670.a: "Las Brujas cumplieron su propia profecía."
  
  POD_gehenna_omens.6671.t: "Brujería por doquier"
  POD_gehenna_omens.6671.desc: "Las luchas internas entre las diversas facciones dentro del clan Setita han cesado tras la purga (aparentemente) completa de los Guerreros de Glycon. Sin embargo, las Brujas de Equidna lograron salir de esta prueba sorprendentemente más fuertes que antes, habiendo frenado sus peores excesos para reinventarse como las sacerdotisas de las diversas máscaras de Set. Ahora proporcionan al clan una fuente leal de sentido cultural, a menudo muy necesario, permitiendo a los Setitas adaptarse a nuevas fes y países mucho más fácilmente que antes.\nLlevará algún tiempo que todos asimilen completamente este importante cambio, pero el clan Setita es ahora más fuerte gracias a esta nueva unidad.\nSin olvidar el apoyo que les brindaste durante su tiempo de necesidad, las Brujas han enviado a un miembro de su culto para servirte como forma de recompensa."
  POD_gehenna_omens.6671.a: "Los Guerreros rabiaron hasta su propio fin."
 
  POD_gehenna_omens.6672.t: "Purga de serpientes"
  POD_gehenna_omens.6672.desc: "Las luchas internas entre las diversas facciones dentro del clan Setita han cesado tras la purga (aparentemente) completa de los Guerreros de Glycon y las Brujas de Equidna. Los Hierofantes declararon recientemente terminada la purga y el clan Setita está una vez más unido tras su único propósito verdadero. Algunos lamentan discretamente la pérdida de la fuerza muscular y la experiencia profética que antaño proporcionaban estas dos importantes facciones.\nLlevará algún tiempo que todos asimilen completamente este importante cambio, pero el clan Setita es ahora más fuerte gracias a esta nueva unidad."
  POD_gehenna_omens.6672.a: "Guerreros y Brujas unidos en la muerte."
   
  POD_gehenna_omens.1251.notification: "Presagio de la Gehenna: Segundo gran incendio de Lübeck"
  POD_gehenna_omens.1251.desc: "La ciudad de Lübeck sufre una segunda gran conflagración. Sus muchos edificios de madera convertidos en ceniza y brasas.\n\n¿Quizás deberían intentar construir con piedra?"
 
  POD_gehenna_omens.1252.notification: "Presagio de la Gehenna: Inquisición en las Sombras"
  POD_gehenna_omens.1252.desc: "La Inquisición en las Sombras de la Iglesia Católica descubrió y destruyó a un vampiro Ventrue.\n\nEra demasiado arrogante para alguien tan joven."
 
  POD_gehenna_omens.1253.notification: "Presagio de la Gehenna: Incendio de Utrecht"
  POD_gehenna_omens.1253.desc: "Un gran incendio asola la ciudad de Utrecht, en el condado de Nedersticht, durante nueve noches, destruyendo la mayor parte de la ciudad.\n\n¿Está la Inquisición en las Sombras quemando las ciudades para purgar a los Vástagos?"
 
  POD_gehenna_omens.1257.notification: "Presagio de la Gehenna: Erupción del Samalas"
  POD_gehenna_omens.1257.desc: "¡Lejos, al este, en la pequeña isla de Lombrok, la montaña de Samalas ha explotado! Como Pompeya antes que ella, la ciudad de Pamatan ha sido totalmente destruida. A más de 200 millas de distancia, la ceniza cae sobre Java. El humo oculta el sol."
 
  POD_gehenna_omens.1258.notification: "Presagio de la Gehenna: Saqueo de Bagdad"
  POD_gehenna_omens.1258.desc: "El Ilkanato mongol ha saqueado la gran ciudad de Bagdad. La ciudad está despoblada y en ruinas. La Casa de la Sabiduría ha sido destruida. El Tigris baja rojo de sangre y negro de la tinta de los libros destruidos. Con la muerte de Al-Musta'sim, también muere el Califato Abasí."
 
  POD_gehenna_omens.1259.notification: "Presagio de la Gehenna: El gran invierno de Ávalon" 
  POD_gehenna_omens.1259.desc: "Comenzó con una misteriosa niebla seca y una nube persistente. El invierno en el norte ha sido particularmente severo. Una hambruna se ha extendido por las tierras del norte, con Gran Bretaña especialmente afectada. Veinte mil mortales mueren de hambre en Londres. ¿Es este el inminente invierno eterno de las Hadas?"
 
  POD_gehenna_omens.1260.notification: "Presagio de la Gehenna: La purga de Baybars" 
  POD_gehenna_omens.1260.desc: "En Egipto, el sultán de los mamelucos está iniciando una purga implacable contra los seres sobrenaturales no musulmanes. Las serpientes se esconden en sus agujeros."
  
  POD_gehenna_omens.1268.notification: "Presagio de la Gehenna: Terremoto de Cilicia"
  POD_gehenna_omens.1268.desc: "El suelo mismo tembló, trayendo la ruina a la ciudad de Adana. Más de sesenta mil mortales han muerto aplastados. Todos los edificios se han derrumbado."
 
  POD_gehenna_omens.1271.notification: "Presagio de la Gehenna: Tercer gran incendio de Lübeck"
  POD_gehenna_omens.1271.desc: "Un tercer gran incendio quema una parte de la ciudad de Lübeck. A los edificios de piedra les va mucho mejor que a los de madera."
  
  POD_gehenna_omens.1287.t: "Gehenna: Tras la inundación de Santa Lucía"
  POD_gehenna_omens.1287.desc: "En la víspera de Santa Lucía, una tormenta masiva inunda la costa de Frisia. Ochenta mil personas arrastradas por las aguas para morir ahogadas. Cientos de aldeas perdidas. Al ser en el solsticio de invierno para las tierras del norte, la inundación y la muerte masiva han ocurrido en un momento de lo más ominoso, cuando la barrera entre los vivos y los muertos es más delgada. Varios profetas vástagos han aparecido en este caos con la intención de tomar la praxis. Curiosamente, todos se llaman Lucía."
  POD_gehenna_omens.1287.a: "Los desastres naturales ocurren, no es la voluntad de los dioses, antiguos o nuevos."
  POD_gehenna_omens.1287.a.tt: "Quienes lo recuerdan dicen que esta inundación fue peor que la Gran Inundación del Mar del Norte de Noord-Holland de 1212. La inundación de Noord-Holland duró seis meses, pero el desastre de Santa Lucía llegó en una sola noche. Es la peor inundación de la historia de Europa. Se forma un nuevo mar que un día se llamará 'Zuiderzee'."
  POD_gehenna_omens.1287.a.tt.malk: "#MALKBLUE ¡hA hAbIdO cOmO eNtRe TrEs Y dIeCiSiEtE hAsTa AhOrA eN eStE mArCaDoR!#!"
  POD_gehenna_omens.1287.b: "Lucía ha regresado para traer la redención o la destrucción. ¡Seré redimido!"
  POD_gehenna_omens.1287.b.tt: "En el siglo IV d.C., Santa Lucía llevó comida a los cristianos que se escondían en las catacumbas bajo Roma, pero nosotros, los no muertos, tenemos otras ideas sobre lo que ocurría allí. Lucía se curó mágicamente de una enfermedad gracias a sus oraciones. Lucía se negó entonces a casarse con un pagano con el que estaba prometida. Los paganos intentaron quemarla en la hoguera, pero fracasaron. Le clavaron una lanza en la garganta, pero ella no dejó de hablar. Le sacaron los ojos, pero le fueron restaurados milagrosamente. No murió hasta que un sacerdote le dio la extremaunción cristiana.\n\nSu cuerpo permaneció imperturbado en Sicilia durante 400 años. Luego las reliquias fueron trasladadas a Constantinopla para protegerlas de las incursiones sarracenas. Después su cadáver desapareció durante el saqueo de Constantinopla en 1204 y la ruina del sueño de Miguel.\n\n¿Por qué ha vuelto Dios a los caminos del Antiguo Testamento castigando a los hombres malvados de Frisia con este diluvio épico en la noche sagrada de Santa Lucía? Muchas de estas almas habían aceptado la fe de los Pescadores y buscan viajar al paraíso de las [UmbraGlossaryLocalized('far_shore','Tierras Lejanas')]. Santa Lucía nos llama a volver a la Vía del Cielo."
  POD_gehenna_omens.1287.b.tt.malk: "#MALKBLUE ¡bOllOs dE vIeRnEs sAnTo! ¡bOllOs dE vIeRnEs sAnTo! uNo pOr uN pEnIqUe, dOs pOr uN pEnIqUe, ¡bOllOs dE vIeRnEs sAnTo! sI nO tIeNeS hIjAs, dÁsElOs a tUs hIjOs. ¡uNo pOr uN pEnIqUe, dOs pOr uN pEnIqUe, bOllOs dE vIeRnEs sAnTo!#!"
  POD_gehenna_omens.1287.c: "¡Los Lussiferda cabalgan de nuevo! ¡Preparad mi corcel para unirme a ella!"
  POD_gehenna_omens.1287.c.tt: "Los hombres del norte tienen otro nombre para esta noche de pavor, 'Lussinatta'. Se decía que Lussi, algún tipo de ser sobrenatural femenino malvado, cabalgaba por el aire con sus seguidores, los Lussiferda. Trolls, espíritus malignos y los muertos se levantarían en masa para alimentarse de los mortales desprevenidos en esa larga y oscura noche. Los niños son sus comidas favoritas, siendo arrebatados directamente de sus hogares. Los hombres del norte permanecen despiertos toda la noche para vigilar sus hogares. Ahora, con esta devastación, muchos de estos hombres del norte han muerto. La gente que practica las viejas costumbres siente que su destino es servir a Hel en Niflheim, donde sus almas construirán su flota para el Ragnarok."
  POD_gehenna_omens.1287.c.tt.malk: "#MALKBLUE ¡mI lAnZa y mI cAsCo mÁgIcO! ¿tU lAnZa y tU cAsCo mÁgIcO? ¡mI lAnZa y mI cAsCo mÁgIcO! ¿cAsCo mÁgIcO? ¡cAsCo mÁgIcO! cAsCo mÁgIcO... ¡SÍ! ¡cAsCo mÁgIcO y tE dArÉ uNa mUeStRa!#!"
  POD_gehenna_omens.1287.d: "¡Alina es un avatar de Lilith, contemplad su brillantez!"
  POD_gehenna_omens.1287.d.tt: "Lucía viene de la palabra latina 'lux', que significa portadora de luz. Su nombre griego es Alina. Lucía, Lussi, Lucifer o Alina: todas manifestaciones de la divina Lilith. Con la magia de Lilith creando este diluvio en burla al Demiurgo, la sacerdotisa de Lilith ha venido a reclamar sus almas condenadas. Las Lamias responden a la llamada a las armas en este mundo y en las [UmbraGlossary('shadowlands')]."
  POD_gehenna_omens.1287.d.tt.malk: "#MALKBLUE ¡nAdA dE bRoMaS sObRe lIl! ¡jAjA! vAlE. qUiZáS uNa pEqUeÑa bRo... ¡aCk! ¡eRgH! ¡gUlP!#!"
  POD_gehenna_omens.1287.e: "Frisia será gobernada por príncipes y leyes, no por cultistas de un dios muerto."
  POD_gehenna_omens.1287.e.tt: "Frisia será gobernada por príncipes y leyes, no por cultistas de un dios muerto." 
  POD_gehenna_omens.1287.e.tt.malk: "#MALKBLUE ¡tOdA cOrTe nEcEsItA uN bUfÓn!#!"
  POD_gehenna_omens.1287.f: "Místico o no, esto no me importa. Sigo mi propio camino."
  POD_gehenna_omens.1287.f.tt.malk: "#MALKBLUE rEmA rEmA rEmA tU bArCo, sUaVeMeNtE pOr eL gRiTo#!"
