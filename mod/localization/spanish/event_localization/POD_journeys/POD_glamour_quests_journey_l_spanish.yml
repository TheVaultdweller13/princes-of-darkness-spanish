l_spanish:
 POD_glamour_quests_journey.1.t: "La búsqueda del Glamour"
 POD_glamour_quests_journey.1.desc: "Las Hadas pueden impedir que la Banality se afiance en sus almas, como se ha descrito arriba, pero para liberar un alma que ya ha sentido el gélido roce de la Banality hay que tomar medidas mayores. La única manera de caldear un alma es emprender una búsqueda que resuene con el Ensueño, ligar el alma propia a esa búsqueda con un juramento y cumplirlo. Tales juramentos pueden hacerse a título individual o en grupo: las Hadas de una cuadrilla que juran todas lo mismo se benefician todas, si tienen éxito.\n\nY yo, tras muchos largos años, he cumplido por fin lo que mi juramento exigía de mí. Y con ello siento que el dominio de la banality sobre mi alma disminuye de forma considerable."
 POD_glamour_quests_journey.1.a: "Mi juramento está cumplido"
 glamour_quest_widget_tt: "Comenzarás de inmediato otro [journey|E] del mismo tipo."
 glamour_quest_widget_desc: "¿Seguir purgándote de la [banality|E]?"