 skilled_umbra_explorer_modifier: "Explorador[X.Custom('ES_OA')] experto en la [umbra|E]"
 POD_umbra_gp.114.t: "El Explorador Umbral"
 POD_umbra_gp.114.desc: "Aparte de sus bancos, su fuente y sus puertas, el Gran Salón está vacío. En ocasiones extrañas, un viajero podría encontrarse con otro; sin embargo, el tráfico es lo suficientemente ligero como para que puedas vagar por el Salón durante días sin cruzar el camino de otro ser. Los pasillos se dirigen en todas las direcciones, ramificándose ocasionalmente en tramos de escaleras, pozos y nichos. El loco diseño de los pasillos infinitos frustra cualquier intento de «hacer trampas» y usar alguna forma de magia para encontrar el camino correcto.\nComo tal, no es de extraña que el Gran Salón atraiga al tipo más curioso de entidades umbrales: aquellas que se dedican al espíritu de la aventura y la exploración. El que quería contactar contigo te dice que se está aburriendo de viajar por el Gran Salón y que le gustaría convertirse en tu Explorador Umbral oficial. Parece bastante hábil en su oficio y podría ser una ventaja para el posterior cartografiado del [umbra|E], lo que lo convierte en una perspectiva tentadora."
 POD_umbra_gp.114.a: "Estáis contratados."
 POD_umbra_gp.114.b: "No lo eres."
 POD_umbra_gp.115.t: "Fe perfeccionada"
 POD_umbra_gp.115.desc: "Todos los cielos existen en este Señorío: Paraísos surgidos de la tradición africana, la doctrina islámica, el ethos cristiano y las esperanzas de los nativos americanos. Los victoriosos guerreros nórdicos se dan un festín en el Valhalla mientras las almas de la Antigua Grecia compiten en los Campos Elíseos. Se dice que cada fe tiene su mejor reflejo en el Paraíso, y cada una se contenta con dejar en paz a las demás. Solo los muertos dignos, los no nacidos o los verdaderamente fieles pueden entrar y, si alguno se atreviera a amenazar el Señorío, encontraría a los ángeles y héroes más poderosos alineados contra él.\nTu guía es una mujer (aparentemente) joven llamada Kalina y, con ella liderando el camino, atraviesas la Ciudad del Crepúsculo. Edificios de todas las fes, desde mezquitas hasta templos, catedrales y simples logias, bordean las grandes avenidas por las que caminas, y los signos terrenales de la vida urbana —la miseria, el comercio, el vicio y la decadencia— no se ven por ninguna parte. La ciudad parece existir solo con dos propósitos: impresionar la vista y elevar el corazón.\nLuego te guía a través de la Gran Montaña, el Océano Infinito, el Santuario de los Animales... y te maravillas ante la belleza de todo ello.\nEste reino podría ser solo una sombra de una gloria demasiado expansiva para que la mente humana la comprenda; una sombra moldeada a partir de lo que las mentes mortales imaginan que es el Paraíso, pero cuando llegue el momento de marcharte, te sentirás revitalizado[ROOT.Char.Custom('ES_OA')] y más convencido de tu fe de lo que jamás estuviste."
 POD_umbra_gp.115.a: "Perfección."
 POD_umbra_gp.116.t: "La Fortaleza del Gobierno"
 POD_umbra_gp.116.desc: "Sobre una extensión de roca yerma y árboles raquíticos se alza la Fortaleza de las locuras de la humanidad. Un castillo monumental de madera y piedra, el baluarte de la sabiduría, la fuerza y la codicia, rodea una montaña de mierda. En lo alto de la apestosa pila, a cientos de metros a la redonda, se erige un perfecto arbusto de rosas blancas. ¿Valen las flores el esfuerzo de alcanzarlas? ¿Es necesaria la Fortaleza? ¿Quién recogería las rosas si pudiera?, y ¿qué pasaría si lo hiciera? Los hombres han debatido estas cuestiones durante milenios. Y, sospechas, siempre lo harán."
 POD_umbra_gp.116.a: "La Fortaleza y las rosas están unidas."
 POD_umbra_gp.116.b: "La Fortaleza nos protege de las rosas."
 POD_umbra_gp.116.c: "La Fortaleza nos protege de nosotros."
 POD_umbra_gp.116.d: "¡Debo tener las rosas!"
 POD_umbra_gp.116.e: "Este lugar es un espejo de nuestra locura, nada más."

 ############
 # Gauntlet #
 ############
 
 POD_gauntlet.101.t: "La Celosía"
 POD_gauntlet.101.desc: "La Celosía, también llamada el Muro en el Reino Medio, es la barrera que rodea la realidad material, separándola del [umbra|E].\n\nLa Celosía nunca puede reducirse por debajo de 1, y si se eleva a 10, los espíritus en las inmediaciones deben gastar Fuerza de Voluntad o huir de la zona."
 POD_gauntlet.101.a: "Fortalecer la Celosía."
 POD_gauntlet.101.b: "Debilitar la Celosía."
 POD_gauntlet.101.c: "¡Derribad la Celosía!"
 POD_gauntlet.101.d: "No importa."
 
 POD_gauntlet.102.t: "El Muro"
 POD_gauntlet.102.desc: "Los reinos espirituales están separados del Reino Medio por una barrera mística conocida como el Muro. Este impide el contacto entre lo mortal y los [spirit_worlds|E]. Es más fuerte en algunas zonas y más débil en otras, pero nunca está del todo ausente.\n\nEl Muro nunca puede reducirse por debajo de 1, y si se eleva a 10, ningún ser de la zona podrá usar poderes de Chi de ningún tipo. Los espíritus en una zona con un valor de Muro de 10 deben gastar Fuerza de Voluntad o huir de la zona; en cualquier caso, estarán extremadamente incómodos e incapaces de gastar Chi."
 POD_gauntlet.102.a: "Fortalecer el Muro."
 POD_gauntlet.102.b: "Debilitar el Muro."
 POD_gauntlet.102.c: "¡Derribad el Muro!"
 POD_gauntlet.102.d: "No importa."
 
 POD_shroud.101.t: "El Manto"
 POD_shroud.101.desc: "El [UmbraGlossaryLocalized('shadowlands','Underworld')] está separado de las [Glossary('Skinlands','game_concept_skinlands_desc')] por una barrera mística conocida como el Manto. El Manto hace que el [UmbraGlossary('shadowlands')] sea imperceptible para la mayoría de los seres vivos y oculta la actividad de las [Glossary('Skinlands','game_concept_skinlands_desc')] a los muertos. Es más fuerte en algunas zonas y más débil en otras, pero nunca está del todo ausente.\n\nEl Manto nunca puede reducirse por debajo de 1, y si se eleva a 10, los espíritus en las inmediaciones deben gastar Fuerza de Voluntad o huir de la zona."
 POD_shroud.101.a: "Fortalecer el Manto."
 POD_shroud.101.b: "Debilitar el Manto."
 POD_shroud.101.c: "¡Derribad el Manto!"
 POD_shroud.101.d: "No importa."
 
 
