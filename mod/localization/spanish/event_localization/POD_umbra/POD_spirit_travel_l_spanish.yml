 POD_umbra_pet.311.f.failure.tt: "[m_horse.GetTitledFirstNameNoTooltip] fracasa al entrenar a [ROOT.Char.Custom('PegasusStoryName')]."

 POD_umbra_pet.312.t: "[ROOT.Char.Custom('PegasusStoryName')|U]: Un tiempo agradable"
 POD_umbra_pet.312.desc: "Mientras me dirijo al establo, me reciben los alegres relinchos de [ROOT.Char.Custom('PegasusStoryName')]. [ROOT.Char.Custom('PegasusStorySheHe')|U] parece ansioso por estirar [ROOT.Char.Custom('PegasusStoryHerHis')] patas con este clima tan hermoso, y no puedo hacer más que estar de acuerdo."
