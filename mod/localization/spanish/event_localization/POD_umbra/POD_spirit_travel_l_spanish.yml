l_spanish:
 
 ########
 # Pass #
 ########
 POD_umbra_pass.101.t: "Abrir un Nihil"
 POD_umbra_pass.101.desc: "Existe una membrana entre las [UmbraGlossary('shadowlands')] y la [UmbraGlossary('tempest')]; no puedes entrar en la [UmbraGlossary('tempest')] sin abrir un [GetModifier('nihil_modifier').GetNameWithTooltip]"
 POD_umbra_pass.101.a: "Haré un sacrificio para abrirlo."
 POD_umbra_pass.101.b: "Usaré mi Nihil instantáneo."
 POD_umbra_pass.101.c: "No importa."
 
 POD_umbra_pass.103.t: "Deja de merodear"
 POD_umbra_pass.103.desc: "No estás vinculado al mundo de los vivos en absoluto y puedes realizar un viaje sin retorno al [UmbraGlossaryLocalized('shadowlands','Inframundo')] cuando quieras. La única razón por la que sigues aquí es porque quieres estarlo, no porque tengas que hacerlo como la mayoría de las apariciones. ¿Estás seguro de querer realizar este viaje ahora?"
 POD_umbra_pass.103.a: "Es hora de cruzar la [UmbraGlossary('tempest')]."
 POD_umbra_pass.103.b: "Aún tengo cosas que hacer."
 
 POD_umbra_pass.104.t: "Cruzar el Manto"
 POD_umbra_pass.104.desc: "¿Estás seguro de lanzarte a través del Manto a la misma velocidad que un proyectil? Esto dañará tu [Corpus|E] (al mismo nivel que el Manto local)."
 POD_umbra_pass.104.a: "¡Sí!"
 POD_umbra_pass.104.b: "No."

 POD_umbra_pass.202.t: "Pasar por el Templo Obscura"
 POD_umbra_pass.202.desc: "El Templo Obscura es un lugar en [UmbraGlossary('malfeas')] a la entrada del [UmbraGlossary('black_spiral_labyrinth')]. Es una mezcla colosal de mezquita y catedral, de minaretes orientales y flautas occidentales."
 POD_umbra_pass.202.a: "Pediré permiso para pasar."
 POD_umbra_pass.202.a.tt: "Esta opción está disponible porque sirves al $glossary_wyrm$."
 POD_umbra_pass.202.b: "Quiero entrar a hurtadillas"
 POD_umbra_pass.202.b.duel.tt.success: "Eso ha sido sólido."
 POD_umbra_pass.202.b.duel.tt.failure: "!"
 POD_umbra_pass.202.c: "Será mejor que no entre aquí."
 
 POD_umbra_pass.205.t: "¡Alto!"
 POD_umbra_pass.205.desc: "¡Alto!"
 POD_umbra_pass.205.a: "Te han detenido unos guardias; no te reconocen como parte del reino de los wraiths en Estigia, ¿cómo procederás?"
 POD_umbra_pass.205.b: "He venido aquí para unirme a la Legión."
 POD_umbra_pass.205.c: "¡Quiero ser parte del gremio!"
 POD_umbra_pass.205.d: "¡Ya soy uno de los vuestros!"
 
 POD_umbra_pass.206.t: "¡Alto!"
 POD_umbra_pass.206.desc: "Unos guardias te detienen; no te reconocen como parte de la [UmbraGlossary('far_shore')], ¿cómo procederás?"
 POD_umbra_pass.206.a: "He venido aquí para alabar a los Resplandecientes."
 POD_umbra_pass.206.b: "¡Quiero ser parte del gremio!"
 POD_umbra_pass.206.c: "¡Ya soy uno de los vuestros!"
 
 POD_umbra_pass.207.t: "¡Alto!"
 POD_umbra_pass.207.desc: "He venido aquí para alabar a los Resplandecientes."
 POD_umbra_pass.207.a: "Dis está protegida por un laberinto de barcos naufragados, habitada por grupos de Espectros esclavizados con el Abrazo de Nhudri para mantener a raya a los wraiths curiosos y a los espectros hostiles. Los caminos a través del laberinto cambian constantemente y es casi imposible entrar en Dis sin el consentimiento de la Sociedad de los Barqueros. ¿Cómo procederás?"
 POD_umbra_pass.207.b: "¡Ya soy uno de los vuestros!"
 POD_umbra_pass.207.a.duel.desc: "Quiero jurarte un juramento."
 
 POD_umbra_pass.208.t: "Ritual de Separación"
 POD_umbra_pass.208.desc: "El área del [UmbraGlossary('deep_umbra')] que alberga a Helios no es más que calor y una brillante luz blanca. Cualquier superficie dentro del Señorío de Helios es demasiado caliente para estar de pie o permanecer cerca por mucho tiempo. Solo los espíritus voladores entran en esta zona del [UmbraGlossary('deep_umbra')], y los viajeros sin la capacidad de volar se consumen en el fuego antes de que tengan la oportunidad de darse cuenta de su error.\n\n¿Estás seguro de que quieres tocar el sol mismo?"
 POD_umbra_pass.208.a: "¡Oh, sí, tocaré el sol mismo! ¡Es una idea excelente!"
 POD_umbra_pass.208.b: "Helios protegerá mi alma."
 POD_umbra_pass.208.c: "Helios protegerá mi alma."
 POD_umbra_pass.208.d: "¡Corre!"
 
 ########
 # Lost #
 ########
 
 POD_umbra_lost.100.t: "#X Caer en el Olvido#!"
 POD_umbra_lost.100.desc: "#X Caes en el Olvido...#!"
 POD_umbra_lost.100.a: "#X ...#!"
 
 POD_umbra_lost.101.t: "Perdido en la Tempestad"
 POD_umbra_lost.101.desc: "No has podido orientarte en la siempre cambiante Tempestad; has acabado en el mismo lugar donde empezaste."
 POD_umbra_lost.101.a: "Está bien."
 
 POD_umbra_lost.102.t: "Atrapado en el Laberinto"
 POD_umbra_lost.102.desc: "No has podido orientarte en el absurdo Laberinto; has acabado en el mismo lugar donde empezaste."
 POD_umbra_lost.102.a: "Estoy perdido."
 
 POD_umbra_lost.103.t: "Atrapado en el Yomi"
 POD_umbra_lost.103.desc: "No has podido orientarte en el infernal [UmbraGlossaryLocalized('yomi_wan','Infierno Yomi')]; has acabado en el mismo lugar donde empezaste."
 POD_umbra_lost.103.a: "Estoy perdido."
 
 POD_umbra_lost.104.t: "Atrapado en el Abismo"
 POD_umbra_lost.104.desc_demon: "Caes una vez más en la prisión eterna creada para los de tu clase tras la rebelión de Lucifer. Dios, al parecer, sigue riéndose al último."
 POD_umbra_lost.104.desc_infernalist: "Caes en el foso y no ves forma de salir a menos que prometas hacer un sacrificio a un señor demonio..."
 POD_umbra_lost.104.a: "¡Escaparé!"
 POD_umbra_lost.104.b: "Sacrificaré a un prisionero."
 POD_umbra_lost.104.c: "¡No hago tratos con demonios!"
 
 POD_umbra_lost.105.t: "Atrapado en [UmbraGlossary('malfeas')]"
 POD_umbra_lost.105.desc: "No has podido orientarte en el horrible [UmbraGlossary('malfeas')]; has acabado en el mismo lugar donde empezaste."
 POD_umbra_lost.105.a: "Estoy perdido."
 
 #########
 # Train #
 #########
 
 POD_umbra_diplomacy.success: "Desafío de Diplomacia: Éxito"
 POD_umbra_diplomacy.fail: "Desafío de Diplomacia: Fallo"
 POD_umbra_diplomacy.desc: "Alguien que habita esta zona te detiene, ¿quizá puedas convencerle para que te enseñe cómo pasar de ese punto? Los Moradores de la [umbra|E] son notoriamente difíciles de entender y aún más difíciles de convencer."
 POD_umbra_martial.success: "Desafío de Marcialidad: Éxito"
 POD_umbra_martial.fail: "Desafío de Marcialidad: Fallo"
 POD_umbra_martial.desc: "Te detiene un acertijo en forma de juego de guerra. Es hora de demostrar lo bueno que eres en ello. Sin embargo, jugar con piezas de «acción real» en forma de espíritus Vinculados es bastante difícil de asimilar al principio, lo que convierte esto en una experiencia perturbadora y surrealista."
 POD_umbra_stewardship.success: "Desafío de Administración: Éxito"
 POD_umbra_stewardship.fail: "Desafío de Administración: Fallo"
 POD_umbra_stewardship.desc: "Un acertijo en forma de ecuación te detiene, ¿eres bueno con las matemáticas? Tendrás que descifrar primero los números utilizados por los espíritus embaucadores, lo que hace que el problema sea aún más difícil de resolver."
 POD_umbra_intrigue.success: "Desafío de Intriga: Éxito"
 POD_umbra_intrigue.fail: "Desafío de Intriga: Fallo"
 POD_umbra_intrigue.desc: "Te encuentras con un poderoso espíritu guardián en tu camino, ¿quizá puedas distraerle con algún truco? Que sea convincente, pues no parece nada amigable."
 POD_umbra_learning.success: "Desafío de Aprendizaje: Éxito"
 POD_umbra_learning.fail: "Desafío de Aprendizaje: Fallo"
 POD_umbra_learning.desc: "Un rompecabezas te detiene, ¿puedes resolverlo? Siendo la [umbra|E] una versión retorcida del mundo «real», puedes encontrar algunos patrones e indicios que tengan, al menos, un mínimo de sentido para ti."
 POD_umbra_prowess.success: "Desafío de Destreza: Éxito"
 POD_umbra_prowess.fail: "Desafío de Destreza: Fallo"
 POD_umbra_prowess.desc: "Un espíritu te detiene, quizá puedas luchar contra él y saquearle."
 
 ##############
 # Expedition #
 ##############
 
 # Core
 
 umbra_expedition_challange_spirit: "Has comenzado un [single_combat_duel|E] con un espíritu."
 umbra_expedition_challange_spirit.win: "Ganas una bendición [modifier|E] o [prestige|E]."
 umbra_expedition_challange_spirit.lose: "#bold Podrías#! @death_icon!Morir."
 
 POD_umbra_expedition.101.t: "Victoria espiritual"
 POD_umbra_expedition.101.desc: "Elige una bendición."
 POD_umbra_expedition.101.fallback: "Las rechazo."
 
 POD_umbra_expedition.201.t: "Mercader espiritual"
 POD_umbra_expedition.201.desc: "Has encontrado a un espíritu que vende artefactos, ¿cuál quieres comprar?"
 POD_umbra_expedition.201.reroll: "¿Otras opciones?"
 POD_umbra_expedition.201.fallback: "No necesito eso."
 POD_umbra_expedition.201.artifact_1: "[artifact_1.Custom('ColorizedArtifactNameNoTooltip')]"
 POD_umbra_expedition.201.artifact_2: "[artifact_2.Custom('ColorizedArtifactNameNoTooltip')]"
 POD_umbra_expedition.201.artifact_3: "[artifact_3.Custom('ColorizedArtifactNameNoTooltip')]"
 
 # Legendary Gift
 
 POD_umbra_expedition.300.t: "Encuentro con el Incarna Guerrero"
 POD_umbra_expedition.300.desc: "El Incarna es un término utilizado por los $glossary_fera$ para describir a una cierta clase de espíritus; más débiles que los Celestes, pero aun así espíritus superiores en cualquier medida. Los Incarnae tienen un propósito y una esfera de influencia definidos, pero son lo suficientemente poderosos como para existir en múltiples niveles de la realidad.\nSiguiendo la pista, has encontrado con éxito al Incarna Guerrero; promete enseñarte el legendario don del guerrero imparable si puedes completar una misión: matar al gobernante de los Wyrm más poderoso del mundo."
 POD_umbra_expedition.300.a: "Desafío aceptado."
 POD_umbra_expedition.302.t: "Guerrero imparable"
 POD_umbra_expedition.302.desc: "Has llegado a la ubicación del enemigo predestinado por tu misión, es hora de un duelo a muerte."
 POD_umbra_expedition.302.a: "¡Aquí estoy!"
 POD_umbra_expedition.304.t: "La recompensa"
 POD_umbra_expedition.304.desc: "Has demostrado tu valía, el Incarna Guerrero te enseña el don. Has alcanzado la cúspide de la destreza de combate de los hombres lobo."
 POD_umbra_expedition.304.a: "¡Un triunfo para la historia!"
 
 POD_umbra_expedition.399.t: "Pensándolo bien"
 POD_umbra_expedition.399.desc: "¿Quizá no sea buena idea que un adorador del $glossary_wyrm$ se reúna con un poderoso espíritu gaiano?"
 POD_umbra_expedition.399.a: "¡Corre!"
 POD_umbra_expedition.399.b: "Qué va."
 
 POD_umbra_expedition.400.t: "Encuentro con el Avatar de Gaia"
 POD_umbra_expedition.400.desc: "Gaia es superior a un Celeste y uno de los espíritus más poderosos que se sabe que existen; posiblemente la primera y la más poderosa. Se le atribuye la creación de los Garou y de la mayoría de los $glossary_fera$ para que sirvan como sus guerreros y agentes tanto en el mundo material como en el [spirit_worlds|E].\nSiguiendo la pista, has encontrado con éxito al Avatar de Gaia; promete enseñarte el legendario don del cuentacuentos si puedes completar una misión: recolectar libros raros e importantes."
 POD_umbra_expedition.400.a: "Desafío aceptado."
 
 POD_umbra_expedition.500.t: "Encuentro con un espíritu poderoso"
 POD_umbra_expedition.500.desc: "Los espíritus y el [spirit_world|E] son un aspecto fundamental de la vida y las culturas de los Garou y de las otras Razas Cambiantes. En particular, los Teúrgos son especialistas en negociar con los espíritus mediante la chiminaje y en vincularlos mediante Dones y ritos.\nSiguiendo la pista, has encontrado con éxito un espíritu especialmente poderoso; promete enseñarte el legendario don de la liberación de las ataduras si puedes completar una misión: destruir la Cortina de Sombras infestada por el $glossary_wyrm$."
 POD_umbra_expedition.500.a: "Desafío aceptado."
 
 POD_umbra_expedition.600.t: "Encuentro con Coyote"
 POD_umbra_expedition.600.desc: "El embaucador definitivo, más Ragabash que Ragabash, Coyote es un avatar del caos. Totalmente impredecible, a menudo insensato, pero sin duda brillante, Coyote es tanto un maestro del engaño como un guerrero muy astuto.\nSiguiendo la pista, has encontrado con éxito un avatar del embaucador Coyote; promete enseñarte el legendario don del portador del fuego si puedes completar una misión: entregar un imperio a otra persona. Solo Coyote sabe por qué pediría algo así."
 POD_umbra_expedition.600.a: "Desafío aceptado."
 
 POD_umbra_expedition.700.t: "Encuentro con Gaia"
 POD_umbra_expedition.700.desc: "Gaia es superior a un Celeste y uno de los espíritus más poderosos que se sabe que existen; posiblemente la primera y la más poderosa. Se le atribuye la creación de los Garou y de la mayoría de los $glossary_fera$ para que sirvan como sus guerreros y agentes tanto en el mundo material como en el [spirit_worlds|E].\nSiguiendo la pista, has encontrado a la propia Gaia; promete enseñarte el legendario don del renacimiento si puedes unir a la Nación Garou. Conociendo la naturaleza fracturada de tus hermanos, esta podría ser la misión más difícil de todas."
 POD_umbra_expedition.700.a: "Volveré cuando esté hecho, madre."
 POD_umbra_expedition.700.b: "¡Lo he logrado!"
 
 POD_umbra_expedition.800.t: "Encuentro con los Espíritus Ancestrales Fianna"
 POD_umbra_expedition.800.desc: "Los Fianna son conocidos entre los Garou por su pasión por el placer de la vida, sus habilidades y ferocidad en batalla, y como guardianes de la música, las historias y el saber de los Garou. Sus espíritus ancestrales suelen ser algunos de los más sabios de todos.\nSiguiendo la pista, has encontrado con éxito algunos espíritus ancestrales Fianna; prometen enseñarte el legendario don si puedes completar el objetivo Héroes de Gaia."
 POD_umbra_expedition.800.a: "Volveré cuando esté hecho, ancestros."
 POD_umbra_expedition.800.b: "¡Lo he logrado!"
 
 POD_umbra_expedition.900.t: "Encuentro con el Gran Fenris"
 POD_umbra_expedition.900.desc: "Las leyendas nórdicas hablan del voraz Dios-Lobo Fenris, la bestia que devorará el sol al final de los días. Fenris es poderoso, sanguinario y nunca concede ni espera cuartel. El espíritu patrón de la Camada de Fenris es un tótem de guerrero, interesado solo en las manadas de Garou que derramen la sangre de sus enemigos con frecuencia.\nSiguiendo la pista, has encontrado al propio Gran Fenris; promete enseñarte el legendario don si puedes completar el objetivo Berserkers de Gaia."
 POD_umbra_expedition.900.a: "Volveré cuando esté hecho, Gran Fenris."
 POD_umbra_expedition.900.b: "¡Lo he logrado!"
 
 POD_umbra_expedition.1000.t: "Encuentro con el Lobo Progenitor"
 POD_umbra_expedition.1000.desc: "Los Talones cuentan que su Tribu se formó directamente de Gaia y que siguieron siendo los Garou más puros que mantuvieron el contacto con su forma original. Como tales, veneran a los primeros lobos de la historia más que a las otras tribus.\nSiguiendo la pista, has encontrado al propio Lobo Progenitor; promete enseñarte el legendario don si puedes completar el objetivo Ira de Gaia."
 POD_umbra_expedition.1000.a: "Volveré cuando esté hecho, Progenitor."
 POD_umbra_expedition.1000.b: "¡Lo he logrado!"
 
 POD_umbra_expedition.1100.t: "Encuentro con el Avatar de Gaia"
 POD_umbra_expedition.1100.desc: "Gaia es superior a un Celeste y uno de los espíritus más poderosos que se sabe que existen; posiblemente la primera y la más poderosa. Se le atribuye la creación de los Garou y de la mayoría de los $glossary_fera$ para que sirvan como sus guerreros y agentes tanto en el mundo material como en el [spirit_worlds|E].\nSiguiendo la pista, has encontrado al Avatar de Gaia; promete enseñarte el legendario don si puedes completar el objetivo El Regreso del Rey."
 POD_umbra_expedition.1100.a: "Volveré cuando esté hecho, madre."
 POD_umbra_expedition.1100.b: "¡Lo he logrado!"
 
 POD_umbra_expedition.1200.t: "Encuentro con el Avatar de Chimera"
 POD_umbra_expedition.1200.desc: "Patrona de los Contemplaestrellas, Chimera es la personificación del Enigma. Ella de las Mil Caras invita a sus manadas a encontrar la sabiduría que cada hombre lobo guarda en su interior, bajo capas de acertijos y autoengaño.\nSiguiendo la pista, has encontrado al Avatar de Chimera; promete enseñarte el legendario don si puedes completar el objetivo Sabiduría de Gaia."
 POD_umbra_expedition.1200.a: "Volveré cuando esté hecho, Chimera."
 POD_umbra_expedition.1200.b: "¡Lo he logrado!"
 
 POD_umbra_expedition.1300.t: "Encuentro con una Incarna Maeljin"
 POD_umbra_expedition.1300.desc: "Los Maeljin fueron antaño mortales, pero llegaron a estar tan profundamente corrompidos por un Impulso particular que se transformaron en poderosos espíritus que encarnaban ese Impulso. Cada uno sirve a su patrón hasta que falla de alguna manera, o hasta que un candidato más nuevo y poderoso emerge. Los Maeljin actúan como los ojos, oídos, voces y, ocasionalmente, manos de los Impulsos cuando es necesaria una acción más directa.\nSiguiendo la pista, has encontrado con éxito a una Incarna Maeljin; promete enseñarte el legendario don si puedes demostrar tu devoción al Wyrm."
 POD_umbra_expedition.1300.a: "Desafío aceptado."
 POD_umbra_expedition.1300.tooltip: "Desbloquearás una decisión que te recompensará con [GetPerk('prelude_to_apocalypse_perk').GetName(GetPlayer)]."
 
 POD_umbra_expedition.1400.t: "Encuentro con Susurros"
 POD_umbra_expedition.1400.desc: "El espíritu de los secretos, Susurros guía a sus aliados hacia descubrimientos. Con un poco de esfuerzo, sus elegidos pueden descifrar mensajes que ninguna persona normal podría entender. Este Jamak flota en el aire, invisible y apenas audible. Se dice que es el eco de los propios Jamaa, de voces celestiales que se filtran al mundo mortal como recuerdos a medio oír. Es un Jamak difícil de encontrar y suele revelarse solo ante los Bastet más sabios.\nSiguiendo la pista, has encontrado con éxito a Susurros, y el misterioso espíritu te pone en el camino hacia el secreto definitivo, el Escarabajo Fugaz. Este ritual es aparentemente la clave para alcanzar la inmortalidad para un Bubasti, una derivación del Hechizo de la Vida de Isis con una reputación más siniestra. Si tan solo pudieras hacer que las Momias hablaran..."
 POD_umbra_expedition.1400.a: "Nueve vidas nunca fueron suficientes."
 
 POD_umbra_expedition.1500.t: "Encuentro con el Deshacedor"
 POD_umbra_expedition.1500.desc: "El Deshacedor es el nombre Bastet para el Equilibrio $glossary_wyrm$, antes de su encarcelamiento y corrupción. Los Bastet dicen que [Glossary('Cahlash', 'glossary_wyrm_tt')], el nombre original del Purificador equilibrado de la $glossary_triat$, aún existe, sirviendo fielmente su propósito original. Esto choca con la mayor parte del folclore de otros $glossary_fera$ donde el Wyrm en su totalidad es ahora una fuerza maligna.\nSea cual sea la verdad, se sabe que Cahlash siente afecto por los poderosos Simba. Al notar vuestro poder, el espíritu os ofrece un desafío. ¿Vuestra recompensa? Un poder lo suficientemente fuerte como para estar prohibido al resto de la Nación Bastet..."
 POD_umbra_expedition.1500.a: "Desafío aceptado."
 
 POD_umbra_expedition.1600.t: "Encuentro con el Gran Abuelo"
 POD_umbra_expedition.1600.desc: "Según su tradición, los Gurahl son los protectores originales de Gaia, creados para repeler el poder destructivo del «Destructor de Patrones».\nSiguiendo la pista, habéis encontrado con éxito al Gran Abuelo, uno de los espíritus patrón originales de los Gurahl; él promete enseñaros el legendario don si podéis completar una misión."
 POD_umbra_expedition.1600.a: "Desafío aceptado."
 
 POD_umbra_expedition.1700.t: "Encuentro con Wani"
 POD_umbra_expedition.1700.desc: "Wani, también conocidos como Reyes Dragón o Lu Lung, son términos utilizados por los Nagah para describir a los grandes espíritus dragón que actúan como patrones de su especie, los únicos espíritus que conocen el Secreto Sagrado.\nSiguiendo la pista, habéis encontrado con éxito a los Wani; ellos prometen enseñaros el legendario don si podéis completar una misión."
 POD_umbra_expedition.1700.a: "Desafío aceptado."
 
 POD_umbra_expedition.1800.t: "Encuentro con Coyote"
 POD_umbra_expedition.1800.desc: "El bromista definitivo, más Ragabash que Ragabash, Coyote es un avatar del caos. Totalmente impredecible, a menudo insensato, pero sin duda brillante, Coyote es tanto un maestro del engaño como un guerrero muy astuto.\nSiguiendo la pista, habéis encontrado con éxito a Coyote; él promete enseñaros el legendario don si podéis completar una misión."
 POD_umbra_expedition.1800.a: "Desafío aceptado."
 
 # crisis
 
 POD_umbra_crisis.101.t: "Demasiado tarde"
 POD_umbra_crisis.101.desc: "El ritual wyrmish ha terminado; un poderoso espíritu wyrm ha sido invocado en [crisis_location.GetName] y ha devastado la región."
 POD_umbra_crisis.101.a: "¡Maldición!"
 POD_umbra_crisis.101.a.tt: "Todos los edificios en [crisis_location.GetName] son eliminados."
 
 POD_umbra_crisis.110.t: "El culpable"
 POD_umbra_crisis.110.desc: "Habéis encontrado la ubicación del maestro del ritual, ¡es hora de acabar con ellos antes de que puedan invocar a un Vagabundo de los Nexos o a una abominación aún peor!"
 POD_umbra_crisis.110.a: "¡Detente ahora mismo, escoria del Wyrm!"
 
 POD_umbra_crisis.201.t: "Demasiado tarde"
 POD_umbra_crisis.201.desc: "[this_character.GetName] ha sido liberad[ROOT.Char.Custom('ES_OA')] de la [UmbraGlossary('tempest')], pero [this_character.GetSheHe] ya no quiere explorar la [umbra|E] por vos."
 POD_umbra_crisis.201.a: "¡Maldición!"
 
 POD_umbra_crisis.210.t: "Rescate"
 POD_umbra_crisis.210.desc: "[this_character.GetName] ya no está perdid[ROOT.Char.Custom('ES_OA')] en la [UmbraGlossary('tempest')]."
