 POD_artifact_pieces.300.c: "Regalia"
 POD_artifact_pieces.300.c.invalid: "#bold no#! tienes ningún regalia equipado que no esté ya fortalecido."
 POD_artifact_pieces.300.d: "Casco"
 POD_artifact_pieces.300.d.invalid: "No tienes #bold no#! tener ningún casco equipado que no esté ya fortalecido."
 
 # Great Maelstrom event
 POD_great_maelstrom.2.t: "Segundo Gran Maelstrom"
 POD_great_maelstrom.2.desc: "Una violenta supertormenta ocurrió recientemente dentro de la [UmbraGlossary('tempest')] causada por la Peste Negra, trayendo una muerte y un sufrimiento incalculables por todo el mundo. Todas las ubicaciones del [UmbraGlossaryLocalized('shadowlands','Inframundo')] son peligrosas de explorar durante #V 15#! años."
 POD_great_maelstrom.3.t: "Tercer Gran Maelstrom"
 POD_great_maelstrom.3.desc: "Una violenta supertormenta ocurrió recientemente dentro de la [UmbraGlossary('shadowlands')] causada por las guerras y enfermedades traídas por los invasores europeos a las civilizaciones americanas. Todas las ubicaciones del [UmbraGlossaryLocalized('shadowlands','Inframundo')] son peligrosas de explorar durante #V 15#! años."
 POD_great_maelstrom.4.t: "Cuarto Gran Maelstrom"
 POD_great_maelstrom.4.desc: "Una violenta supertormenta ocurrió recientemente dentro de la [UmbraGlossary('shadowlands')] causada por los horrores desatados por la Primera Guerra Mundial y la gripe española. Todas las ubicaciones del [UmbraGlossaryLocalized('shadowlands','Inframundo')] son peligrosas de explorar durante #V 15#! años."
 POD_great_maelstrom.5.t: "Quinto Gran Maelstrom"
 POD_great_maelstrom.5.desc: "Una violenta supertormenta ocurrió recientemente dentro de la [UmbraGlossary('shadowlands')] causada por el dolor y el sufrimiento desatados por la Segunda Guerra Mundial. Todas las ubicaciones del [UmbraGlossaryLocalized('shadowlands','Inframundo')] son peligrosas de explorar durante #V 15#! años."
 POD_great_maelstrom.6.t: "Sexto Gran Maelstrom"
 POD_great_maelstrom.6.desc: "Una violenta supertormenta ocurrió recientemente dentro de la [UmbraGlossary('shadowlands')] cuando la Semana de las Pesadillas azotó al mundo entero. Todas las ubicaciones del [UmbraGlossaryLocalized('shadowlands','Inframundo')] son peligrosas de explorar durante #V 15#! años."
 
