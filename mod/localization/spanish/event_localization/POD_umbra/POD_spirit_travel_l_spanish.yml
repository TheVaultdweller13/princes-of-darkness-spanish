 #Dragon
 POD_umbra_pet.101.t: "El Dragón"
 POD_umbra_pet.101.desc: "Mientras acaricio al dragón en la cabeza, [ROOT.Char.Custom('DragonStorySheHe')] agita felizmente [ROOT.Char.Custom('DragonStoryHerHis')] cola. ¿Qué nombre le vendría bien a [ROOT.Char.Custom('DragonStoryHerHim')]? ¿Algo histórico? Es una decisión importante, y mientras el dragón se da la vuelta para dejarme acariciar [ROOT.Char.Custom('DragonStoryHerHis')] vientre, me quedo distraído un rato.\n\n¡Pero espera, ya lo sé! Llamaré a [ROOT.Char.Custom('DragonStoryHerHim')]..."

 POD_umbra_pet.199.t: "[ROOT.Char.Custom('DragonStoryName')]: Pretérito es Pretérito"
 POD_umbra_pet.199.desc: "[ROOT.Char.Custom('DragonStoryName')] ha caminado a mi lado durante muchos años, y el paso de la banalidad/consenso no perdona a los dragones. A medida que la humanidad se aleja de las maravillas del pasado hacia un futuro mecánico, ya no queda espacio para la magia. La Tierra ya no es apta para estas criaturas mágicas y el único recurso para evitar un destino terrible es trasladarse al [umbra|E]."
 POD_umbra_pet.199.a: "¡Te echaré de menos, [ROOT.Char.Custom('DragonStoryName')]!"
 
 POD_umbra_pet.121.t: "Acariciando a [ROOT.Char.Custom('DragonStoryName')|U]"
 POD_umbra_pet.121.desc: "Encuentro a [ROOT.Char.Custom('DragonStoryName')] durmiendo en mis aposentos y, al sentarme junto a [ROOT.Char.Custom('DragonStoryHerHim')], me recibe con un gorjeo tranquilo y confundido.\n\nSin embargo, cuando empiezo a pasar los dedos por [ROOT.Char.Custom('DragonStoryHerHis')] escamas, [ROOT.Char.Custom('DragonStorySheHe')] comienza enseguida a ronronear de satisfacción, y el sonido parece relajar todo mi ser."

 POD_umbra_pet.122.desc: "Encuentro a [ROOT.Char.Custom('DragonStoryName')] fuera, pavoneándose por el patio. En cuanto [ROOT.Char.Custom('DragonStorySheHe')] me ve, [ROOT.Char.Custom('DragonStorySheHe')] gorjea y se acerca con paso tranquilo, frotándose contra mi pierna.\n\nPaso muchos minutos agachado a [ROOT.Char.Custom('DragonStoryHerHis')] lado, acariciando a [ROOT.Char.Custom('DragonStoryHerHim')] y rascando a [ROOT.Char.Custom('DragonStoryHerHim')] bajo la barbilla, y cuando vuelvo a levantarme me siento más ligero que en mucho tiempo."

 POD_umbra_pet.111.t: "[ROOT.Char.Custom('DragonStoryName')]: Exhibición de poder"
 POD_umbra_pet.111.desc: "Tener un dragón es increíble, pero mostrarlos en tu corte, con todos tus súbditos presentes, es una gran demostración de poder. [ROOT.Char.Custom('DragonStoryName')] ruge y se estira para deleite de tus cortesanos. Cuando [ROOT.Char.Custom('DragonStorySheHe')] da señales de empezar a tomar aire profundamente, otros cortesanos se asustan de repente por el fuego mítico que se dice que estas criaturas pueden crear. Pero gracias al buen comportamiento de [ROOT.Char.Custom('DragonStoryHerHis')] hasta ahora, no ocurre ningún incidente."
 POD_umbra_pet.111.a: "¡Incluso los dragones me obedecen!"
 
 POD_umbra_pet.112.t: "[ROOT.Char.Custom('DragonStoryName')]: Vasallo encantado"
 POD_umbra_pet.112.desc: "Me encuentro con mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] [vassal.GetTitledFirstName] admirando a mi dragón, [ROOT.Char.Custom('DragonStoryName')].\n\n«¡Esta maravillosa bestia es incluso más impresionante de lo que cuentan las historias, mi [ROOT.Char.GetLadyLord]!». Parece que mi inusual mascota está causando una gran impresión, como era de esperar, en mis vasallos."
 POD_umbra_pet.112.a: "¡Un símbolo de mi poder!"
 
 POD_umbra_pet.113.t: "[ROOT.Char.Custom('DragonStoryName')]: Aliento de dragón"
 POD_umbra_pet.113.desc: "«[ROOT.Char.GetFirstNameNoTooltip], ¡esta bestia tiene que irse!»\n\nMi sirviente señala a [ROOT.Char.Custom('DragonStoryName')]. «[ROOT.Char.Custom('DragonStorySheHe')] ha estado lanzando fuego mientras no mirabas, ¡[ROOT.Char.Custom('DragonStorySheHe')] es peligrosa de tener cerca!»\n\n¿Podría ser que incluso estas majestuosas bestias son engañosas por naturaleza? ¿O es simplemente que sus instintos naturales se imponen cuando tú no estás para controlarlos?"
 POD_umbra_pet.113.a: "¡Eso... eso debe haber sido un error!"
 POD_umbra_pet.113.b: "¡Tú, #EMP beast#!!"

 POD_umbra_pet.201.t: "El Unicornio"
 POD_umbra_pet.201.desc: "Mientras admiro al unicornio que ahora sigue cada uno de mis comandos, reflexiono sobre cómo llamar a [ROOT.Char.Custom('PegasusStoryHerHim')]..."
 
 POD_umbra_pet.211.t: "[ROOT.Char.Custom('UnicornStoryName')|U]: Fiel unicornio"
 POD_umbra_pet.211.desc: "Un renombrado entrenador se ha acercado a mí tras oír rumores sobre mi poderoso unicornio [ROOT.Char.Custom('UnicornStoryName')], y ofrece [ROOT.Char.Custom('RandomHerHis')] servicios.\n\n«Todo lo que pido a cambio es una pequeña compensación»."
 POD_umbra_pet.211.a: "[ROOT.Char.Custom('UnicornStorySheHe')|U] necesita ser más fuerte."
 POD_umbra_pet.211.b: "Aprender a moverse con mayor rapidez es algo que [ROOT.Char.Custom('UnicornStorySheHe')] necesita aprender."
 POD_umbra_pet.211.c: "[ROOT.Char.Custom('UnicornStorySheHe')|U] necesita trabajar [ROOT.Char.Custom('UnicornStoryHerHis')] resistencia."
 POD_umbra_pet.211.d: "¡Si hay algo de lo que [ROOT.Char.Custom('UnicornStorySheHe')] carece es de ferocidad!"
 POD_umbra_pet.211.e: "No me interesa."
 POD_umbra_pet.211.e.tt: "#F «¡[THIS.Char.Custom('UnicornStoryName')] no necesita a ningún otro entrenador que no sea yo!»#!"
 POD_umbra_pet.211.f: "¡Para eso pago a un $master_of_horse_court_position$!"
 POD_umbra_pet.211.f.tt: "Tu $master_of_horse_court_position$ comienza el entrenamiento de [THIS.Char.Custom('UnicornStoryName')]"
 POD_umbra_pet.211.f.failure: "Sobreestimaste a tu $master_of_horse_court_position$"
 POD_umbra_pet.211.f.failure.tt: "[m_horse.GetTitledFirstNameNoTooltip] fracasa al entrenar a [ROOT.Char.Custom('UnicornStoryName')]."

 POD_umbra_pet.212.t: "[ROOT.Char.Custom('UnicornStoryName')|U]: Un tiempo agradable"
 POD_umbra_pet.212.desc: "Mientras me dirijo al establo, me reciben los alegres relinchos de [ROOT.Char.Custom('UnicornStoryName')]. [ROOT.Char.Custom('UnicornStorySheHe')|U] parece ansioso por estirar [ROOT.Char.Custom('UnicornStoryHerHis')] patas con este clima tan hermoso, y no puedo hacer más que estar de acuerdo."
 POD_umbra_pet.212.a: "¡Debo aprovechar cada momento para practicar!"
 POD_umbra_pet.212.b: "¡El tiempo es demasiado bueno como para no disfrutarlo debidamente!"

 POD_umbra_pet.213.t: "[ROOT.Char.Custom('UnicornStoryName')|U]: Entusiasta de los caballos"
 POD_umbra_pet.213.desc: "[horse_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] observa a [ROOT.Char.Custom('UnicornStoryName')] de arriba abajo, asintiendo con aprobación.\n\n«¡Tiene usted un unicornio magnífico aquí, mi [ROOT.Char.GetTitleTierName]! Si me permitiera dar un paseo con [ROOT.Char.Custom('UnicornStoryHerHim')], se lo agradecería mucho»."
 POD_umbra_pet.213.a: "¡Disfruta!"
 POD_umbra_pet.213.a.tt: "[THIS.Char.Custom('UnicornStoryName')] es una montura feroz, y [horse_vassal.GetFirstNameNoTooltip] no es conocido por su Destreza; ¿le irá bien a [horse_vassal.GetSheHe]?"
 POD_umbra_pet.213.b: "¡Nadie monta a [ROOT.Char.Custom('UnicornStoryName')] excepto yo!"
 
 POD_umbra_pet.299.t: "[ROOT.Char.Custom('UnicornStoryName')]: El Pretérito es el Pretérito"
 POD_umbra_pet.299.desc: "Mi fiel [ROOT.Char.Custom('UnicornStoryName')] se ve afectado cada vez más por la banalidad/consenso. A medida que la humanidad se aleja de las maravillas del pasado hacia un futuro mecánico, ya no queda lugar para la magia. La Tierra ya no es apta para estas criaturas mágicas y el único recurso para evitar un destino terrible es trasladarse a la [umbra|E]."
 POD_umbra_pet.299.a: "¡Te echaré de menos, [ROOT.Char.Custom('UnicornStoryName')]!"
 
 POD_umbra_pet.301.t: "El Pegaso"
 POD_umbra_pet.301.desc: "Mientras admiro al pegaso que ahora sigue cada uno de mis mandatos, reflexiono sobre cómo llamar a [ROOT.Char.Custom('PegasusStoryHerHim')]..."

