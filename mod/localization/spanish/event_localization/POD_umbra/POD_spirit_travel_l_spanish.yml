 POD_umbra_pet.399.t: "[ROOT.Char.Custom('PegasusStoryName')]: El Pretérito es el Pretérito"
 POD_umbra_pet.399.desc: "Mi fiel [ROOT.Char.Custom('PegasusStoryName')] se ve cada vez más afectado por la banalidad/consenso. A medida que la humanidad se aleja de las maravillas del pasado hacia un futuro mecánico, ya no queda espacio para la magia. La Tierra ya no es apta para estas criaturas mágicas y el único recurso para evitar un destino terrible es trasladarse al [umbra|E]."
 POD_umbra_pet.399.a: "¡Te echaré de menos, [ROOT.Char.Custom('PegasusStoryName')]!"
 
 POD_umbra_pet.400.t: "[ROOT.Char.Custom('UnicornStoryName')|U] y [ROOT.Char.Custom('PegasusStoryName')]: Alicornio"
 POD_umbra_pet.400.desc: "Un unicornio alado (alicornio, ceráptero, unicornio volador o unisus) es un ungulado mágico, representado habitualmente como un caballo, con alas como las de Pegasus y el cuerno de un unicornio. Pero ahora, con mi unicornio [ROOT.Char.Custom('UnicornStoryName')|U] y mi pegaso [ROOT.Char.Custom('PegasusStoryName')], podría tener los medios para dar vida a esta criatura mítica en nuestro plano de existencia."
 POD_umbra_pet.400.a: "Vale la pena intentarlo."
 POD_umbra_pet.400.b: "Lamentablemente, [ROOT.Char.Custom('UnicornStorySheHe')|U] y [ROOT.Char.Custom('PegasusStorySheHe')|U] no son compatibles."
