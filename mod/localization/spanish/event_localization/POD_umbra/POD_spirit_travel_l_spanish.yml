 POD_umbra_gp.101.t: "Enfrentarse al último Aullador Blanco"
 POD_umbra_gp.101.desc: "Un miembro de la Manada Sacudidor del Cielo, Coruroc fue el único miembro de la tribu de los Aulladores Blancos que logró escapar de la Espiral Negra y huir de vuelta a la superficie. Su parentela contaminada lo cazó y casi lo mata, pero fue rescatado por Bone-Whittler, un Teúrgo, que estaba poseído por el ancestro Aullador Blanco, Aidan Farwatcher. Logró advertir a la Nación Garou de que los Aulladores Blancos se habían perdido antes de morir.\nTras su muerte, no pudo convertirse en un Espíritu Ancestral, porque la Patria Tribal de los Aulladores Blancos había sido transformada por la Marca del Wyrm. En su lugar, descendió al [UmbraGlossaryLocalized('shadowlands','Dark Umbra')], donde vagó como un wraith. Atormentado por sus recuerdos, apenas logró evitar el [UmbraGlossary('oblivion')], hasta que una pequeña manada de Danzantes de la Espiral Negra visitó el [UmbraGlossaryLocalized('shadowlands','Dark Umbra')]. Coruroc intentó razonar con ellos y, cuando sus peticiones fueron recibidas con burla, extrajo sus almas de sus cuerpos, convirtiéndolos a ellos también en wraiths. Pasó largos años purgándolos de su Marca del Wyrm y los formó en una pequeña manada propia. Esta manada ahora viaja por el [UmbraGlossary('shadowlands')], buscando destruir los espíritus de la Parentela corrupta de los Aulladores Blancos o convertir (y, si es necesario, destruir) a otros Espirales Negros.\nTras encontrarlo, ofrece un pacto de ayuda mutua si podéis completar una misión."
 POD_umbra_gp.101.a: "¿Cuál es vuestro deseo, último de vuestra tribu?"
 POD_umbra_gp.101.b: "No tengo tiempo."
 
 POD_umbra_gp.102.t: "Enfrentarse al único Espíritu Ancestral Aullador Blanco"
 POD_umbra_gp.102.desc: "Aidan Farwatcher fue un Homid Galliard Aullador Blanco durante el 31 a. C. Bajo el Rito de la Persecución Imperecedera, el espíritu de Aidan persiguió al Rey Ahogado incluso después de su muerte. En el año 200, Aidan poseyó a un guía Aullador Blanco conocido como «Bone-Whittler», un Teúrgo del Sept de Loch de Mil Profundidades. Aidan estuvo presente para ver la perdición de su tribu, pereciendo noblemente luchando contra los primeros Danzantes de la Espiral Negra, pero no pudo hacer nada para evitarlo. Entonces se convirtió en el único Espíritu Ancestral superviviente de la perdida tribu de los Aulladores Blancos.\nÉl os ofrece su servicio si podéis completar su misión (y puede enseñaros Dones de los Aulladores Blancos si sois un hombre lobo)."
 POD_umbra_gp.102.a: "Os escucharé, sabio Anciano."
 POD_umbra_gp.102.b: "No tengo tiempo."
 
 POD_umbra_gp.103.t: "Aristóteles"
 POD_umbra_gp.103.desc: "Aristóteles fue un filósofo y polímata de la Antigua Grecia. Sus escritos abarcan una amplia gama de temas que van desde las ciencias naturales, la filosofía, la lingüística, la economía, la política, la psicología y las artes. Como fundador de la escuela peripatética en el Liceo de Atenas, inició la más amplia tradición aristotélica que le siguió, la cual sentó las bases para el desarrollo de la ciencia moderna. La etapa final de la vida de Aristóteles se vio empañada por su cada vez peor relación con su antiguo discípulo, Alejandro. Forzado a huir de su hogar en Atenas, su muerte fue poco gloriosa para un monumento tan venerado del pensamiento filosófico, lo que podría haber sido la causa de su partida al reino de Caronte tras su muerte.\nEste wraith específico que afirma ser el propio Aristóteles es dudoso. Parece poco probable que el famoso filósofo no hubiera sucumbido ya a su sombra o no hubiera alcanzado la trascendencia. Es bastante común que estas entidades espectrales suplanten a tales grandes figuras (incluso creyendo verdaderamente que lo son). En cualquier caso, este wraith es ciertamente muy culto y podría servir para un propósito en vuestra corte.\nInteresado por el mundo mortal como suelen ser la mayoría de los wraiths, le habéis convencido fácilmente para que visite vuestro dominio."
 POD_umbra_gp.103.a: "¿Podrías convertirme en el próximo Alejandro Magno?"
 POD_umbra_gp.103.b: "No me interesa."
 
 POD_umbra_gp.104.t: "Hipatia"
 POD_umbra_gp.104.desc: "Hipatia fue una filósofa neoplatónica, astrónoma y matemática que vivió en Alejandría, Egipto, que entonces formaba parte del Imperio Romano de Oriente. Fue una pensadora prominente en Alejandría, donde enseñó filosofía y astronomía. Es la primera matemática mujer cuya vida está razonablemente bien documentada. Hipatia fue reconocida en su tiempo como una gran maestra y una sabia consejera. Escribió un comentario sobre la *Arithmetica* de trece volúmenes de Diofanto, y otro comentario sobre el tratado de Apolonio de Perga sobre las secciones cónicas.\nComo inventora, Hipatia construyó astrolabios e hidrómetros. Era tolerante con los cristianos y enseñó a muchos estudiantes cristianos, incluido Sinesio, el futuro obispo de Ptolemais. Hipatia era ampliamente amada tanto por paganos como por cristianos y estableció una gran influencia entre la élite política de Alejandría. Hacia el final de su vida, Hipata aconsejó a Orestes, el prefecto romano de Alejandría, quien se encontraba en medio de una disputa política con Cirilo, el obispo de Alejandría. Corrieron rumores acusándola de impedir que Orestes se reconciliara con Cirilo y, en marzo del 415 d. C., fue asesinada por una turba de cristianos liderada por un lector llamado Pedro.\nVagando por la [umbra|E], habéis encontrado a un espíritu que afirma ser ella trabajando al frente del Mouseion de la [umbra|E]. Podría ser una aliada valiosa."
 POD_umbra_gp.104.a: "¡Por favor, aprendería mucho en mi corte!"
 POD_umbra_gp.104.b: "No me interesa."
 
 POD_umbra_gp.105.t: "Mahfuz Alam"
 POD_umbra_gp.105.desc: "Mahfuz Alam, un guerrero musulmán que murió gloriosamente defendiendo Jerusalén de los caballeros europeos de las cruzadas, lidera un grupo de wraiths Renegados. Su lugar en el Cielo estaba asegurado mediante su martirio, y la llamada Necrópolis de Jerusalén es para él una burla vil. Ha oído demasiadas historias falsas sobre las [UmbraGlossaryLocalized('far_shore','Sotaventos')], a través del gran [UmbraGlossary('sunless_sea')], como para creer que se puede llegar al Paraíso con mero esfuerzo físico.\nEn consecuencia, Alam y sus aliados (menos de una docena, pero en aumento) desean desalojar a los miles de Legionarios Estigios que ocupan la Necrópolis de Jerusalén y establecer un reino musulmán en el más allá, para desafiar la supremacía de los Pescadores (como se llama a los cristianos) y de los obviamente indignos Estigios.\nFrente al guerrero musulmán, le habéis convencido de que enfrentarse a Estigia con su fuerza actual sería similar al [UmbraGlossary('oblivion')]. Trabajar con vos por ahora mientras reúne fuerzas será más adecuado para sus planes."
 POD_umbra_gp.105.a: "Creceremos juntos."
 POD_umbra_gp.105.b: "No me interesa."

 POD_umbra_gp.107.t: "La Corte de las Musas"
 POD_umbra_gp.107.desc: "Con el renacimiento del interés por los antiguos mitos griegos, una vieja Corte ha resurgido del inconsciente colectivo con nuevos miembros y un vigor y propósito renovados en el Señorío moderno de las altas ideas. Estas son las Musas, que también eran conocidas como apsaras en la India o las Valquirias en el mito nórdico, pero cuyos nombres individuales y ámbitos de influencia fueron mejor adivinados por los antiguos griegos.\nLas Musas tienen su propia Corte en una Aguja cuya base se encuentra cerca del Mouseion en la Vulgata; esta Aguja se asemeja al monte Helicón en Grecia, que se cree que fue el hogar de las Musas en la antigüedad.\nOriginalmente había nueve Musas, además de las Musas Antiguas y su Líder; este número se ha duplicado, pero las nueve originales siguen existiendo, aunque sus especialidades y áreas de influencia han cambiado ligeramente. A medida que los modos y medios de expresión humana crecieron, también lo hizo la variedad de Musas. Las hijas originales de Zeus y Mnemosine han modernizado algo su apariencia y sus ámbitos.\nTu tiempo en esta corte no será infinito, ya que las Musas Antiguas solo toleran a los invitados para el entretenimiento de sus hermanos menores. ¿Con qué grupo de Musas jóvenes deseas mezclarte?"
 POD_umbra_gp.107.a: "Las Musas de los Medios de Comunicación, las portadoras de la cultura."
 POD_umbra_gp.107.b: "Las Musas del Modo, analíticas y filosóficas."

 POD_umbra_gp.108.t: "Las Musas de los Medios de Comunicación"
 POD_umbra_gp.108.desc: "Calíope, Musa de la Voz. Originalmente la Musa del Canto Épico, el ámbito de Calíope se ha expandido para incluir todos los usos de la voz: cantar, anunciar, dar conferencias, narrar historias y cualquier tipo de actuación donde solo se escuche la voz.\nClío, Musa de la Palabra Escrita. Originalmente la Musa de la Historia, Clío ahora inspira todas las formas de escritura, sea cual sea el estilo, el tema o la intención.\nEuterpe, Musa de la Música. Originalmente la Musa del Canto Lírico, Euterpe ha cambiado su ámbito para incluir toda la música, excepto la producida por la voz humana, que es el dominio de Calíope.\nTerpsícore, Musa de la Danza. Terpsícore es, como siempre ha sido, la Musa de la Danza, pero ha expandido su dominio para incluir a todos aquellos para quienes el movimiento del cuerpo es el hecho central de su oficio.\nArquiope, Musa de la Arquitectura. Una nueva Musa, el ámbito de Arquiope es el del cerramiento y la demarcación espacial (normalmente refugios permanentes, aunque las tiendas y los cobertizos también entran en su jurisdicción).\nTamaraponme, Musa del Atuendo. Otra nueva Musa es Tamaraponme, cuyo dominio incluye todos los aspectos externos de la apariencia individual y la presentación personal.\nEudore, Musa del Drama. El ámbito de Eudore es la proyección física de un personaje pretendido, ya sea el propio, el de otra persona o el de una persona totalmente ficticia.\nFidia, Musa de la Escultura. Al ser mortal, la destreza de Fidias para dar forma a la piedra impresionó tanto a los dioses que fue invitado a convertirse en la Musa de la Escultura.\nXerops, Musa de la Pintura. Xerops es la nueva Musa de las imágenes bidimensionales, tanto representativas como abstractas, y gobierna la pintura y el dibujo en el sentido clásico."
 POD_umbra_gp.108.a: "Pasar tiempo con Calíope."
 POD_umbra_gp.108.b: "Pasar tiempo con Clío."
 POD_umbra_gp.108.c: "Pasar time con Euterpe."
 POD_umbra_gp.108.d: "Pasar tiempo con Terpsícore."
 POD_umbra_gp.108.e: "Pasar tiempo con Arquiope."
 POD_umbra_gp.108.f: "Pasar tiempo con Tamaraponme."
 POD_umbra_gp.108.g: "Pasar tiempo con Eudore."
 POD_umbra_gp.108.h: "Pasar tiempo con Fidia."
 POD_umbra_gp.108.i: "Pasar tiempo con Xerops."

 POD_umbra_gp.109.t: "Las Musas del Modo"
 POD_umbra_gp.109.desc: "Erato, Musa del Romance. Originalmente la Musa de la poesía erótica, Erato se ocupa de las pasiones abrumadoras de la vida, especialmente aquellas que unen a las personas, como el amor y el deseo. Prefiere los finales felices, pero puede llevar a sus filiales a través de tribulaciones interminables para lograrlos.\nMelpómene, Musa de la Tragedia. Melpómene sigue siendo la Musa de la Tragedia, pues el dolor que los mortales se infligen unos a otros ha cambiado muy poco en los últimos miles de años. No se deleita en este dolor, sino que intenta guiar a las personas a través de él hacia la comprensión de por qué ha ocurrido y qué podría hacerse para evitarlo en el futuro.\nPolimnia, Musa de la Religión. Polimnia era la Musa de los cantos sagrados, y ahora presta su guía a quienes siguen un camino espiritual y buscan comprender los misterios del alma.\nTalía, Musa de la Comedia. Talía fue y sigue siendo la Musa de la Comedia, siempre sensible a las absurdidades inherentes de la vida, señalando el humor de cualquier situación.\nUrania, Musa de la Ciencia. Urania era la Musa de la astronomía, y ahora extiende su dominio a toda la Ciencia, siempre dispuesta para quienes buscan descubrir y comprender.\nArquíloco, Musa de la Acción. Se le atribuye ser uno de los primeros poetas satíricos de la tierra; el ingenio de Arquíloco se ejercía con una beligerancia tan inquebrantable que a menudo tenía que defender sus versos mediante el combate real. Así se ha convertido en la Musa de la Acción.\nSolón, Musa de la Justicia. Solón de Atenas fue identificado con la conciencia moral de la raza humana, enfatizando la igualdad y el juego limpio en la ejecución de la ley, y por ello es ahora la Musa de la Justicia.\nPseudolos, Musa de la Intriga. Siendo en realidad un personaje ficticio de las obras de Plauto, Pseudolos recibió vida Umbral como la Musa de la Intriga debido a todo el esquema, la conspiración y los tratos sucios que ocurren en el mundo.\nLenore, Musa del Horror. Se cree que la Musa del Horror ha estado con la humanidad desde los primeros indicios de la conciencia, aunque pocos se atreven a mencionar su nombre."
 POD_umbra_gp.109.a: "Pasar tiempo con Erato."
 POD_umbra_gp.109.b: "Pasar tiempo con Melpómene."
 POD_umbra_gp.109.c: "Pasar tiempo con Polimnia."
 POD_umbra_gp.109.d: "Pasar tiempo con Talía."
 POD_umbra_gp.109.e: "Pasar tiempo con Urania."
 POD_umbra_gp.109.f: "Pasar tiempo con Arquíloco."
 POD_umbra_gp.109.g: "Pasar tiempo con Solón."
 POD_umbra_gp.109.h: "Pasar tiempo con Pseudolos."
 POD_umbra_gp.109.i: "Pasar tiempo con Lenore."
 
 artifact_elemental_armor_name: "Armadura Elemental"
 artifact_elemental_armor_description: "Una misteriosa armadura hallada en la Corte Elemental de la Tierra. Parece resonar con el poder de las cuatro Cortes Elementales, utilizándolo para fortalecerse si se le da la oportunidad."
 POD_umbra_gp.110.t: "La Armadura Elemental"
 POD_umbra_gp.110.desc: "Las Cortes de los Elementos se encuentran a mitad de una Aguja, antes de que un viajero alcance las Cinco Puertas, con cada Elemento representado por un Señorío que expresa su naturaleza intrínseca. Hallados principalmente en la cara norte de una Aguja, los señoríos de la Tierra no siempre son distinguibles de inmediato de la sustancia de la propia Aguja hasta que se presentan o se examinan con sentidos mágicos, apareciendo como cuevas o extrañas formaciones rocosas. La tangibilidad efímera de estos señoríos y sus residentes corresponde a la materia en su estado sólido, manteniendo una forma y volumen distintos a menos que actúen fuerzas externas.\nEl viaje es algo arduo pero, gracias al exhaustivo reconocimiento previo del área, logras localizar el objetivo de tu expedición: una extraña armadura (obviamente mágica). Un rápido examen revela que no es una armadura muy impresionante, considerando todo, a pesar de que parece absorber la energía de la Corte Elemental. Sin embargo, no hay daño en llevártela, así que lo haces. Puede que haya formas de mejorar su potencial en el futuro."
 POD_umbra_gp.110.a: "Continuará, supongo."
 POD_umbra_gp.111.desc: "Las Cortes de los Elementos se encuentran a mitad de una Aguja, antes de que un viajero alcance las Cinco Puertas, con cada Elemento representado por un Señorío que expresa su naturaleza intrínseca. Al subir por la ladera sur de una Aguja, el viajero astral puede encontrarse con los señoríos del Fuego: llamas abiertas y zonas ardientes que pueden parecer claramente fuera de lugar, excepto cuando aparecen como respiraderos geotérmicos o aperturas volcánicas.\nTu Armadura Elemental está reaccionando a estas poderosas energías, aparentemente queriendo que te acerques lo más posible a este infierno para disfrutarlo de verdad. Una perspectiva algo estresante."
 POD_umbra_gp.111.a: "¡Caliente, caliente, caliente!"
 POD_umbra_gp.111.b: "No merece la pena."
 POD_umbra_gp.112.desc: "Las Cortes de los Elementos se encuentran a mitad de una Aguja, antes de que un viajero alcance las Cinco Puertas, con cada Elemento representado por un Señorío que expresa su naturaleza intrínseca. Hallados generalmente en la cara este de una Aguja, los señoríos del Aire podrían confundirse con nubes epifámicas por los no iniciados, excepto que su naturaleza se hace evidente al estudiar las formas y actividades de los espíritus que se mueven en ellos y a su alrededor. Su tangibilidad efímera corresponde al estado gaseoso de la materia, expandiéndose y permeando para llenar el espacio que ocupan.\nTu Armadura Elemental está reaccionando a estas poderosas energías, aparentemente queriendo que te acerques lo más posible al huracán para disfrutarlo de verdad. Una perspectiva algo estresante."
 POD_umbra_gp.112.a: "Viento en mi pelo..."
 POD_umbra_gp.113.desc: "Las Cortes de los Elementos se encuentran a mitad de una Aguja, antes de que un viajero alcance las Cinco Puertas, con cada Elemento representado por un Señorío que expresa su naturaleza intrínseca. Hallados habitualmente en las laderas occidentales de una Aguja, los señoríos del Agua pueden aparecer como manantiales de montaña, cascadas o incluso un lago en una amplia cornisa. La tangibilidad efímera de estos señoríos y sus habitantes corresponde al estado líquido de la materia, fluyendo hacia la forma del espacio que ocupan pero manteniendo un volumen constante.\nTu Armadura Elemental está reaccionando a estas poderosas energías, aparentemente queriendo que te acerques lo más posible a las olas embravecidas para disfrutarlo de verdad. Una perspectiva algo estresante."
 POD_umbra_gp.113.a: "Cuidado de no ser arrastrado..."
