 # Other Event #
 ###############
 
 # KJ only event
 
 POD_umbra_kj.1001.t: "Inspiración"
 POD_umbra_kj.1001.desc: "Las zonas de los [spirit_worlds|E] cercanas al Muro se llaman Tierras Espejo, llamadas así porque aparecen como reflejos fantasmales del cercano Reino Medio.\n\nObservar este extraordinario paisaje te hace sentir inspirado."
 POD_umbra_kj.1001.a: "¡Es increíble!"
 
 POD_umbra_kj.1002.t: "Enseñanzas de los Espíritus"
 POD_umbra_kj.1002.desc_opening: "Entraste en el [spirit_world|E], tan profundo como pudiste, y entonces recibiste instrucciones de"
 POD_umbra_kj.1002.desc_high: "un antiguo y legendario [Glossary('Wan Kuei','game_concept_kuei_jin_desc')], un Gran Ancestro"
 POD_umbra_kj.1002.desc_yin: "a [Glossary('Yama King','podgloss.yamaking')]"
 POD_umbra_kj.1002.desc_yang: "un poderoso espíritu"
 POD_umbra_kj.1002.desc_low: "un espíritu normal"
 POD_umbra_kj.1002.desc_ending: "que compartió algo de entendimiento sobre el [Glossary('Dharma','podgloss.dharma')]."
 POD_umbra_kj.1002.a: "Mi mentor espiritual."
 
 # Action event
 
 POD_umbra_action.1001.t: "Campo de Batalla"
 POD_umbra_action.1001.desc: "El Campo de Batalla es un reino dedicado a la violencia y la furia, donde reina el caos mientras los ejércitos se mezclan: soldados Qin que terminan luchando contra legiones romanas y cruzados que se alían con bárbaros vikingos contra tropas mayas. Mientras no se entre en uno de los conflictos, el visitante camina por una «vía» apropiada para la batalla que presencia (un barco para una batalla naval, un camino romano para un conflicto durante las guerras púnicas, etc.). Mientras no se salgan de la vía, no serán atacados directamente.\nEsta es una excelente manera de aprender nuevas (o antiguas) estrategias que podrían ser relevantes para tu era de alguna forma."
 
 POD_umbra_action.1101.t: "Sede"
 POD_umbra_action.1101.desc: "Seat es el palacio del señor de la muerte y el cuartel general de la Legión, ¿cuál quieres visitar?"
 POD_umbra_action.1101.a: "Sede de las Aguas Ardientes"
 POD_umbra_action.1101.b: "Sede del Polvo"
 POD_umbra_action.1101.c: "Sede de las Lágrimas de Oro"
 POD_umbra_action.1101.d: "Sede de las Sombras"
 POD_umbra_action.1101.e: "Sede del Silencio"
 POD_umbra_action.1101.f: "Sede del Socorro"
 POD_umbra_action.1101.g: "Sede de las Espinas"
 
 # Reweave Artifact
 POD_artifact_pieces.100.t: "Rehilvanar piezas de reliquias"
 POD_artifact_pieces.100.desc: "Has encontrado a un herrero wraith, [creator.GetFirstName], [creator.GetSheHe] puede ayudarte a rehilvanar las piezas de reliquia que lleves equipadas. ¿Qué estás buscando exactamente?"
 POD_artifact_pieces.100.b: "Usa las piezas para fortalecer un artefacto equipado."
 POD_artifact_pieces.100.c: "Potencia la pieza."
 POD_artifact_pieces.100.c.tt: "Intentarás fusionar tus piezas equipadas en una más fuerte."
 POD_artifact_pieces.100.c.success: "Tu pieza equipada ha sido potenciada y ahora es una más fuerte."
 POD_artifact_pieces.100.d: "Quizá otra noche."
 POD_artifact_pieces.100.back: "Volver a la opción anterior."

 POD_artifact_pieces.300.t: "Fortalecer reliquia"
 POD_artifact_pieces.300.desc: "¿Qué artefacto quieres fortalecer?"
