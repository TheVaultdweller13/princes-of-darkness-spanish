l_spanish:
 pod_laibon.100.t: "El suplicante mortal"
 pod_laibon.100.desc: "Un mortal de tu dominio solicita audiencia. Trae una disputa sin fácil respuesta: un conflicto de lindes entre dos familias, una acusación de brujería contra un sanador, una petición de que intervengas en una sequía apelando a los espíritus. A la antigua usanza, un Laibon es más que un gobernante: es el puente vivo entre la comunidad y las fuerzas que rigen su destino. El mortal no sabe lo que eres, solo que tu juicio tiene un peso que ningún anciano corriente podría reclamar. Rechazarlo es dejar que el mundo de los vivos se te escape un poco más de las manos."
 pod_laibon.100.a: "Juzgar la disputa personalmente."
 pod_laibon.100.a.success: "Tu juicio es sabio y justo. Los mortales quedan impresionados."
 pod_laibon.100.a.failure: "Tu juicio yerra el blanco. Los mortales quedan decepcionados."
 pod_laibon.100.b: "Delegar en un consejero mortal."
 pod_laibon.100.c: "Tienes asuntos más urgentes. Despídelo."
 pod_laibon.101.t: "Voces en el viento"
 pod_laibon.101.desc: "En las horas previas al amanecer, oyes algo, no con los oídos, sino más hondo. Una voz que podría ser un ancestro, un espíritu de la tierra o tu propia [Glossary('Bestia','game_concept_beast_desc')] hablando en lenguas que casi entiendes. Ofrece un fragmento de conocimiento, pero exige tu atención. Los Laibon siempre han caminado entre el mundo de los vivos y el mundo de los espíritus: estas voces no son alucinación ni bendición, sino algo más antiguo que ambas categorías. Tus mayores advertían de que un Laibon que ignora las voces de Orun lo hace por su cuenta y riesgo, pero quien sigue cada susurro hacia la oscuridad rara vez regresa entero."
 pod_laibon.101.a: "Escuchar y seguir la voz hasta el retiro."
 pod_laibon.101.a.success: "La voz puede revelar verdades ocultas sobre un gobernante vecino."
 pod_laibon.101.a.failure: "La voz te hace dar vueltas en círculo. Vuelves sin nada más que desasosiego."
 pod_laibon.101.b: "Reconocer la voz, pero permanecer donde estás."
 pod_laibon.101.c: "Silenciarla. El mundo espiritual está lleno de embaucadores y mentirosos."
 pod_laibon.102.t: "El fuego de la reunión"
 pod_laibon.102.desc: "Acoges una reunión de Laibon locales, no una Asamblea formal de los Legados, sino un encuentro informal en torno al fuego. Se comparten historias, se ventilan disputas y se observan los viejos rituales. Se sacrifica la cabra, se comparte la sangre, se invoca a los ancestros. Estas pequeñas reuniones son el alma de la sociedad Laibon: un recordatorio de que los no-muertos siguen ligados por las obligaciones de la comunidad viva a la que antaño pertenecieron. Los lazos forjados junto al fuego suelen ser más fuertes que los jurados en las Asambleas formales, y las deudas recordadas en el humo de una ofrenda rara vez quedan impagadas."
 pod_laibon.102.a: "Dirigir tú mismo el ritual, honrando tanto a los vivos como a los muertos."
 pod_laibon.102.b: "Centrar la reunión en asuntos políticos."
 pod_laibon.102.c: "Centrar la reunión en la comunión espiritual."
 pod_laibon.103.t: "El descendiente mortal"
 pod_laibon.103.desc: "Aparece en tu dominio un mortal que guarda un asombroso parecido con alguien que conociste en vida, un descendiente de tu familia mortal, portador de una sangre que fue tuya hace siglos. No sabe lo que eres, pero hay un reconocimiento en sus ojos. Es una de las sensaciones más desorientadoras que puede experimentar un Laibon: ver tu propio gesto, tu propia risa, la misma inclinación de cabeza para escuchar mejor, alojados en un cuerpo que aún respira y envejece. Los ancestros dicen que tales convergencias nunca son casualidad. Algo sin resolver ha pasado por la sangre, a la espera del momento adecuado para ser abordado."
 pod_laibon.103.a: "Velar por él desde las sombras. Asegurar su prosperidad."
 pod_laibon.103.b: "Abrazarlo. Lleva tu sangre. Merece el don de la vida eterna."
 pod_laibon.103.a.success: "El mortal será llevado a tu corte para prepararse para el Abrazo."
 pod_laibon.103.a.message: "Ha llegado el descendiente"
 pod_laibon.103.c: "No te conciernen."
 pod_laibon.104.t: "La Bestia espiritual"
 pod_laibon.104.desc: "Un espíritu se manifiesta cerca de tu refugio, no un fantasma, sino algo más antiguo. Adopta la forma de un gran animal: un león, una serpiente, una araña, un águila. Te observa con ojos que ven a través de la carne. Quiere algo. Los espíritus animales son los emisarios más antiguos de Orun: son anteriores a los ancestros, anteriores incluso al primer Laibon, y no negocian con palabras. Un espíritu que te busca en persona no es un asunto que puedas dejar sin respuesta. Sea lo que sea lo que quiere, que haya venido a ti en lugar de esperar a ser invocado significa que la negociación ya ha comenzado."
 pod_laibon.104.a: "Acercarte y ofrecerle sangre."
 pod_laibon.104.a.success: "El espíritu acepta tu ofrenda. Su bendición te envuelve como una armadura."
 pod_laibon.104.a.failure: "El espíritu rechaza tu ofrenda con violencia."
 pod_laibon.104.b: "Observarlo desde lejos. Aprender de su presencia."
 pod_laibon.104.c: "Ahuyentarlo. No se puede confiar en espíritus que exigen ofrendas de sangre cerca de tu dominio."
 pod_laibon.105.t: "La cosecha"
 pod_laibon.105.desc: "Los mortales de tu dominio han tenido una buena temporada. La cosecha es rica, las rutas comerciales fluyen y los niños están sanos. Tu administración, aunque indirecta, ha mantenido a raya a los depredadores. La comunidad prospera. Un Laibon entiende mejor que nadie que los mortales prósperos son el cimiento de todo: son la fuente de la sangre, de Aye, de la conexión con el mundo de los vivos que te separa de los muertos huecos que vagan por Orun sin nada que los ancle. Esta noche salen los tambores y las hogueras brillan. Has hecho bien tu trabajo."
 pod_laibon.105.a: "Pasear entre ellos durante la celebración. Estar presente."
 pod_laibon.105.b: "Tomar tu parte, un diezmo mayor del excedente."
 pod_laibon.105.c: "Tomar lo que necesitas: el excedente significa más mortales de los que alimentarte sin consecuencias."
 pod_laibon.106.t: "El espíritu de la encrucijada"
 pod_laibon.106.desc: "Llegas a una encrucijada a medianoche, un lugar donde se cruzan los caminos y el límite entre Aye y Orun se adelgaza. Alguien ha dejado una ofrenda: una vasija de barro, un manojo de plumas, una figura tallada. Está destinada a ti. O a algo como tú. Las encrucijadas siempre han sido lugares liminales: sagrados para los espíritus, peligrosos para los descuidados y curiosamente atractivos para quienes ya existen en la frontera entre mundos. La ofrenda sugiere que alguien sabe que pasas por aquí. Si pretenden hacerte un regalo, proponerte un trato o desviar tu atención de algo que hacen cerca es otra cuestión muy distinta."
 pod_laibon.106.a: "Dejar tu propia ofrenda y meditar en la encrucijada."
 pod_laibon.106.b: "Tomar la ofrenda. El poder está ahí para quien lo tome."
 pod_laibon.106.c: "Tomar la ofrenda pero no entretenerte: las encrucijadas atraen cosas peores que los espíritus ancestrales."
 pod_laibon.107.t: "El sueño de Cagn"
 pod_laibon.107.desc: "Sueñas, algo que los vampiros rara vez hacen. En el sueño ves una figura que podría ser Cagn, el Primer Laibon, o podría ser tu propia [Glossary('Bestia','game_concept_beast_desc')] con el rostro de Cagn. Habla en una lengua más antigua que cualquiera que conozcas, pero la entiendes. Te muestra una visión. Se dice que Cagn fue el primero en descubrir el equilibrio entre Aye y Orun y que pagó un precio enorme por ese conocimiento. Si es un ancestro verdadero, una construcción espiritual o un mito que la sangre usa para explicar su propia naturaleza es un debate que los Laibon más antiguos han mantenido durante siglos sin resolverlo. Lo que ninguno discute es que soñar con él significa que algo está a punto de cambiar."
 pod_laibon.107.a: "La visión muestra el mundo mortal, tu dominio como podría ser, próspero y protegido."
 pod_laibon.107.b: "La visión muestra el mundo espiritual: vasto, luminoso y que te llama."
 pod_laibon.107.c: "Interrogar a la figura. ¿Es de verdad Cagn o algo que lleva su rostro?"
 pod_laibon.107.c.success: "La figura sonríe. Es ambas cosas y ninguna. La comprensión te inunda."
 pod_laibon.107.c.failure: "La sonrisa de la figura se vuelve fría. Has ofendido a algo que no comprendes."
 pod_laibon.108.t: "La brecha de la Mascarada"
 pod_laibon.108.desc: "Tu creciente conexión con el mundo espiritual se está notando. Un mortal de tu dominio, un sacerdote o una sabia, ha notado que algo va mal. Aún no lo ha nombrado, pero los susurros empiezan. El Secreto corre peligro. La Mascarada es más complicada para los Laibon que para los Vástagos que se ocultan por completo: de un Laibon se espera que sea una figura de autoridad espiritual, lo que significa que ya se presupone cierta cualidad sobrenatural. Pero hay una línea entre ser un venerado chamán y ser reconocido como uno de los no-muertos, y alguien de tu dominio acaba de acercarse demasiado a ella."
 pod_laibon.108.a: "Ocuparte del mortal directamente. Dominarlo o silenciarlo."
 pod_laibon.108.a.success: "El mortal olvida. Los susurros se apagan."
 pod_laibon.108.a.failure: "No lograste contener la situación. Los susurros se han vuelto rumores."
 pod_laibon.108.b: "Retirarte temporalmente de los asuntos mortales. Dejar que los rumores mueran."
 pod_laibon.108.c: "Aprovecharlo. Dejar que crean que eres un espíritu ancestral."
 pod_laibon.109.t: "La tumba del ancestro"
 pod_laibon.109.desc: "Descubres o recuerdas el lugar de enterramiento de tus ancestros mortales. La tumba es vieja, está cubierta de maleza, quizá olvidada por los vivos. Pero los espíritus de allí no se han ido. Para el Laibon, los muertos no desaparecen: perduran en Orun, en la propia tierra, en la sangre de los descendientes que los llevan adelante sin saberlo. Una tumba olvidada es una herida en la memoria de la comunidad, y los espíritus de los muertos desatendidos pueden inquietarse de maneras que dificultan la existencia de todos. Les debes algo a esas gentes. Si decides pagar esa deuda es otro asunto."
 pod_laibon.109.a: "Restaurar la tumba y realizar los antiguos ritos."
 pod_laibon.109.b: "Comulgar con los espíritus, pero dejar la tumba como está."
 pod_laibon.109.c: "La tumba ocupa un terreno valioso. Despejarla y construir algo útil."
 pod_laibon.200.t: "El peso de la corona"
 pod_laibon.200.desc: "Una disputa entre tus vasallos amenaza con desbordarse hacia el mundo mortal: Laibon enfrentados que se alimentan sin cuidado, perturban el comercio y aterrorizan a los mortales que sostienen el dominio. Como Guruhi, esto es responsabilidad tuya. La Tierra es tuya para protegerla. Los Guruhi no gobiernan solo por conquista: gobiernan porque aceptaron un convenio con la tierra y con la gente que la trabaja. Cuando la tierra sufre, es el Guruhi quien responde por ello: ante los mortales, ante los demás Legados y ante los ancestros que observan desde Orun. No pediste esta corona. La llevas igualmente."
 pod_laibon.200.a: "Intervenir en persona. Restaurar el orden entre los Laibon y los mortales."
 pod_laibon.200.b: "Ocuparte solo de la disputa entre los Laibon. Los mortales ya se las arreglarán."
 pod_laibon.201.t: "La Oscuridad Interior"
 pod_laibon.201.desc: "Las sombras de tu refugio se mueven por voluntad propia: se estiran, agarran, susurran. No están vivas, exactamente, pero tampoco vacías. La oscuridad es una puerta a Orun y siempre está abierta para ti. Otros Vástagos que dominan la oscuridad la tratan como un arma, una herramienta para el miedo y el ocultamiento. Tú la conoces de otro modo. Las sombras no son espacio vacío, sino la sustancia del límite entre mundos, y lo que moldeas con ellas toca algo que existe a ambos lados del velo. Esta noche están más activas de lo habitual. Algo se ha acercado a la puerta desde el otro lado."
 pod_laibon.201.a: "Adentrarte en la oscuridad. Dejar que te muestre lo que hay más allá."
 pod_laibon.201.b: "Mandar sobre las sombras, pero no entrar. Mantener la distancia."
 pod_laibon.202.t: "El consejo de la Bestia"
 pod_laibon.202.desc: "Tu [Glossary('Bestia','game_concept_beast_desc')] se agita, no por ansia ni por furia, sino por conversar. Te muestra algo a través de sentidos animales: las pautas migratorias de los ñus, las marcas territoriales de un leopardo, los lazos sociales de una manada de elefantes. Hay una lección aquí, si sabes leerla. Los Laibon no hablan de [Glossary('La Bestia','game_concept_beast_desc')] como los Vástagos europeos, no como un demonio al que enjaular, sino como un yo más antiguo, una parte de ti que recuerda lo que la humanidad olvidó al construir su primera ciudad. Si esa comprensión es sabiduría o una mentira cómoda que la sangre cuenta para que te sientas a gusto con lo que eres es una pregunta que cada Laibon debe responder al fin por sí mismo."
 pod_laibon.202.a: "Escuchar a la Bestia. Aprender del mundo animal."
 pod_laibon.202.b: "Usar la perspicacia de la Bestia para obtener una ventaja práctica."
 pod_laibon.203.t: "La furia exige"
 pod_laibon.203.desc: "Tu furia se agita, el fuego familiar que define tu legado. Pero la furia carece de forma sin una dirección. ¿Qué te impulsa esta noche? Los Legados guerreros de los Laibon siempre han entendido que la ira y el impulso de actuar son tanto un don como una maldición, pero mientras los Brujah combaten por una filosofía, el guerrero Laibon lucha por algo más antiguo e inmediato: protección, justicia, honor hecho forma mediante la acción. Aun así, la línea entre la furia justa y el simple ansia de violencia de la [Glossary('Bestia','game_concept_beast_desc')] es esta noche más fina que ayer. Asegúrate de saber en qué lado de ella te encuentras."
 pod_laibon.203.a: "Luchar por mi gente. Los mortales bajo mi protección están amenazados."
 pod_laibon.203.b: "Luchar por el honor. Los espíritus guerreros de mis ancestros exigen excelencia."
 pod_laibon.203.c: "Rendirme por completo a la furia. No contenerme en nada."
 pod_laibon.204.t: "El dilema del Juez de la Tormenta"
 pod_laibon.204.desc: "Llega ante ti un caso: un Laibon acusado de alimentarse sin cuidado y poner en peligro el Secreto. Las pruebas no son claras. El acusador es poderoso. El acusado proclama su inocencia. Como Shango, tu juicio tiene el peso de la tormenta. Los Shango son los árbitros de los Laibon, un papel que no se les concedió, sino que ganaron durante siglos zanjando disputas que nadie más podía resolver sin desatar una guerra. Cuando un Shango pronuncia sentencia, sus palabras llevan la autoridad de todos los ancestros que ocuparon antes tu lugar. Esa autoridad no significa nada si no la empuñas con cuidado."
 pod_laibon.204.a: "Invocar a los ancestros. Dejar que los espíritus guíen mi juicio."
 pod_laibon.204.a.success: "Los ancestros hablan con claridad. Se hace justicia."
 pod_laibon.204.a.failure: "Los ancestros callan. Tu juicio flaquea."
 pod_laibon.204.b: "Juzgar solo por pruebas y testimonios. A la manera mortal."
 pod_laibon.205.t: "El vicio se extiende"
 pod_laibon.205.desc: "Tu vicio llama. El mundo mortal ofrece sus placeres: una fiesta, un mercado, una reunión de mortales hermosos y dispuestos. Tu cuerpo ansía el exceso. Esto es a la vez tu conexión con el mundo de los vivos y lo que podría cortarla. Los Ishtarri siempre han entendido algo que los Vástagos más ascetas se niegan a admitir: el placer no es debilidad, es un ancla. El vampiro que no siente nada por las alegrías mortales ya ha empezado a derivar hacia los lugares vacíos entre mundos. Pero hay una diferencia entre darse el gusto con conciencia y ahogarse en el apetito, y esta noche esa distinción parece muy fina."
 pod_laibon.205.a: "Darte el gusto con cuidado. Disfrutar de los placeres del mundo mortal sin destruirlo."
 pod_laibon.205.a.success: "Caminas por la línea entre el exceso y la contención. Los mortales no se enteran de nada."
 pod_laibon.205.a.failure: "Tus apetitos te han podido. La comunidad lo recordará."
 pod_laibon.205.b: "Canalizar el ansia hacia el mundo espiritual. Buscar en su lugar un placer sobrenatural."
 pod_laibon.206.t: "La encrucijada del Fixer"
 pod_laibon.206.desc: "Llegas a una encrucijada, literal y figurada. Una caravana mortal necesita protección contra bandidos. Un anciano Laibon necesita que le recuperen un amuleto espiritual de un bosque sagrado. Ambos son rentables. El tiempo solo permite uno. Los Ramanga siempre han ocupado este espacio entre mundos: los negociadores, los intermediarios, quienes entienden que el mundo mortal y el mundo Laibon no están tan separados como otros fingen. Cada elección como esta es un pequeño acto de comercio entre esos dos mundos, y tu reputación en ambos depende de cómo la manejes. El truco está en asegurarte de que cada parte te pague como es debido."
 pod_laibon.206.a: "Proteger la caravana."
 pod_laibon.206.b: "Recuperar el amuleto espiritual."
 pod_laibon.206.c: "Cerrar un trato por el que los guardias de la caravana te acompañen al bosque y resolver así ambos problemas."
 pod_laibon.206.c.success: "Tu lengua de plata hace maravillas. Ambos trabajos hechos, ambos clientes satisfechos."
 pod_laibon.206.c.failure: "El trato se viene abajo. Consigues migajas de ambos, pero no satisfaces del todo a nadie."
 pod_laibon.207.t: "La tierra recuerda"
 pod_laibon.207.desc: "Durante tu reposo bajo tierra, la tierra habla. No con palabras, sino con sensaciones. El peso de la piedra, el movimiento de las raíces, el lento pulso de cosas que ya eran viejas cuando la humanidad era joven. El hondo Orun presiona tu conciencia. Los Nagloper siempre han sostenido que la parte más antigua del mundo espiritual no está en el cielo ni en el horizonte, sino bajo los pies, donde los muertos vuelven a la tierra y la tierra absorbe todo lo que alguna vez estuvo vivo. La mayoría de los Laibon duermen sobre el suelo, cerca del mundo que conocen. Tú duermes bajo él, lo que significa que oyes cosas que ellos no oyen."
 pod_laibon.207.a: "Abrirte a la tierra profunda."
 pod_laibon.207.b: "Resistir. Eres un vampiro, no una raíz."
 pod_laibon.208.t: "El regalo de la Bomkazi"
 pod_laibon.208.desc: "Tu Bomkazi acude a ti al anochecer, como siempre. La alimentación es un ritual más antiguo que ninguno de los dos: vida dada libremente para sostener la muerte. Pero esta noche se demora después. Tiene algo que compartir. Las Bomkazi son exclusivas de los Laibon: mujeres que ligan voluntariamente su sangre a un vampiro y la ofrecen con regularidad a cambio de protección, posición y un lugar al borde del mundo entre los vivos y los muertos. La relación no es de posesión, no exactamente. Es un pacto entre dos personas que, cada una a su manera, han elegido vivir fuera de los límites ordinarios de la vida humana."
 pod_laibon.208.a: "Escucharla. Compartir lo que sabes de los muertos a cambio de lo que ella sabe de los vivos."
 pod_laibon.208.b: "Atender sus necesidades. Está envejeciendo y su magia le pasa factura."
 pod_laibon.208.c: "Pedirle que te ayude a contactar con un ancestro concreto mediante un ritual conjunto."
 pod_laibon.208.c.success: "El ritual conjunto tiene éxito. El ancestro habla a través del límite entre mundos."
 pod_laibon.208.c.failure: "El ritual chisporrotea y se apaga. El ancestro no responde."
 pod_laibon.209.t: "La oscuridad de antes"
 pod_laibon.209.desc: "La caza ha terminado. El bosque calla. En la quietud tras la muerte, algo se agita en ti que no es [Glossary('La Bestia','game_concept_beast_desc')], o quizá es [Glossary('La Bestia','game_concept_beast_desc')] antes de tener nombre. La oscuridad primordial que hizo a tu fundador se mueve en tu sangre. No habla. Simplemente es: vasta, paciente y más antigua que los ancestros. Los Bonsam no hablan de esto abiertamente, ni siquiera entre ellos. Las Tradiciones de la sociedad Laibon se erigieron sobre el entendimiento de que Aye y Orun se equilibran mutuamente. Lo que se agita en tu sangre es anterior a ese equilibrio: una tercera cosa que se niega a ser categorizada. Aprender a convivir con ella sin ser engullido es la primera y la última lección de tu Legado."
 pod_laibon.209.a: "Descender a la oscuridad. Dejar que te muestre lo que existía antes de los mundos."
 pod_laibon.209.b: "Abrirte a la oscuridad, pero mantener una mano en el mundo."
 pod_laibon.209.c: "Rechazarla. Cazar en su lugar. Encontrar a un mortal, una bestia, algo real."
 pod_laibon.210.t: "El dilema del erudito"
 pod_laibon.210.desc: "Te llega un rumor: un erudito mortal de una ciudad lejana ha adquirido una colección de textos. Entre ellos hay, posiblemente, un fragmento de algo más antiguo: un registro de los Laibon anterior a que se escribieran las Tradiciones. Un conocimiento así no permanece oculto mucho tiempo. Los muertos susurran que debes llegar primero. Los Mla Watu fueron expulsados del viejo orden por razones que los distintos Legados explican de forma distinta, según a quién preguntes, pero lo que nadie discute es que entiendes el conocimiento como poder de maneras que otros prefieren dejar en lo teórico. Si hay un registro de lo que fueron los Laibon antes de que las Tradiciones los moldearan, pretendes leerlo antes de que nadie más tenga ocasión de decidir lo que significa."
 pod_laibon.210.a: "Enviar a un wraith vinculado a robar los textos antes de que nadie más pueda alcanzarlos."
 pod_laibon.210.b: "Viajar tú mismo hasta el erudito. Acercarte como un colega buscador de conocimiento."
 pod_laibon.210.b.success: "El erudito queda impresionado por tu erudición. Nace una alianza."
 pod_laibon.210.b.failure: "El erudito ve a través de tu fachada. Te marchas con fragmentos, no con el todo."
 pod_laibon.210.c: "Alzar a los muertos en la ciudad del erudito. Interrogar a quienes escribieron los textos cuando estaban vivos."
 pod_laibon.300.t: "La revelación del Caminante"
 pod_laibon.300.desc: "Ocurre entre un latido y el siguiente, aunque tu corazón ya no late. Los dos mundos se alinean. Los ves ambos a la vez: la aldea mortal durmiendo a la luz de la luna y la aldea espiritual que reluce tras ella, los vivos y los muertos recorriendo los mismos caminos, separados por un velo fino como un aliento. A todo Laibon se le dice que esto es posible. Muy pocos viven lo bastante para estar aquí y reconocerlo por lo que es. Los ancianos dicen que el propio Cagn estuvo una vez en esta misma encrucijada y vio toda la creación extendida ante él, tanto la luz como la oscuridad, tanto los vivos como los muertos, y comprendió que ninguno era más real que el otro."
 pod_laibon.300.a: "Estás en ambos lados."
 pod_laibon.301.t: "El vacío"
 pod_laibon.301.desc: "El silencio es ahora total. Ni susurros de los ancestros. Ni calor de los vivos. Estás en un lugar que no es ni Aye ni Orun: un vacío entre los mundos donde nada crece y nada muere. [Glossary('La Bestia','game_concept_beast_desc')] te observa desde el otro lado de este vacío, paciente como la piedra. Lleva esperando esto. Los Laibon lo llaman el Hueco: no un lugar, sino una condición, el equivalente espiritual de una herida que no se cierra. Otros Vástagos caen ante [Glossary('La Bestia','game_concept_beast_desc')] por el ansia y la furia. Los Laibon pueden caer por ausencia: dejando simplemente que ambas conexiones se apaguen hasta que no quede más que el depredador con tu rostro, esperando permiso para tomar el control por completo."
 pod_laibon.301.a: "Buscar a Aye. Recordar a los vivos: un rostro, un nombre, una deuda sin saldar."
 pod_laibon.301.a.success: "Aflora un recuerdo, cálido, vívido, real. El mundo de los vivos te arrastra de vuelta."
 pod_laibon.301.a.failure: "El recuerdo se desmorona. No queda nada a lo que aferrarse. La Bestia toma lo que queda."
 pod_laibon.301.b: "Buscar a Orun. Llamar a los ancestros. Suplicarles que respondan."
 pod_laibon.301.b.success: "Una voz responde desde el otro lado. Los ancestros no te han abandonado."
 pod_laibon.301.b.failure: "Silencio. Los ancestros se han apartado. La Bestia da un paso al frente."
 pod_laibon.301.c: "Rendirte. Estás demasiado cansado para luchar."
 pod_laibon.400.t: "Los dos mundos"
 pod_laibon.400.desc.intro: "Te instalas en la quietud y vuelves tu conciencia hacia dentro, al lugar donde la sangre se encuentra con el espíritu. Todo Laibon camina entre dos mundos: #bold Aye#!, el mundo de los vivos, y #bold Orun#!, el mundo de los espíritus y los ancestros. Tu fuerza fluye del equilibrio que mantienes entre ellos.\n\n"
 pod_laibon.400.desc.aye_tier3: "#bold Aye:#! Eres un #bold Hijo de Aye#!: profundamente arraigado en el mundo de los vivos. Los mortales sienten tu autoridad en los huesos.\n"
 pod_laibon.400.desc.aye_tier2: "#bold Aye:#! Tu conexión con el mundo de los vivos es #bold fuerte#!. Los mortales a tu alrededor prosperan bajo tu influencia.\n"
 pod_laibon.400.desc.aye_tier1: "#bold Aye:#! Tienes una conexión #bold modesta#! con el mundo de los vivos. Los mortales perciben algo, pero no saben nombrarlo.\n"
 pod_laibon.400.desc.aye_none: "#bold Aye:#! Estás #bold desconectado#! del mundo de los vivos. Los mortales no sienten tu presencia.\n"
 pod_laibon.400.desc.orun_tier3: "#bold Orun:#! Eres un #bold Hijo de Orun#!: el mundo espiritual responde cuando llamas. Los ancestros caminan a tu lado.\n"
 pod_laibon.400.desc.orun_tier2: "#bold Orun:#! Tu conexión con el mundo espiritual es #bold fuerte#!. Los ancestros susurran consejos en las horas previas al amanecer.\n"
 pod_laibon.400.desc.orun_tier1: "#bold Orun:#! Tienes una conexión #bold modesta#! con el mundo espiritual. Los ancestros se agitan cuando estás cerca.\n"
 pod_laibon.400.desc.orun_none: "#bold Orun:#! Estás #bold desconectado#! del mundo espiritual. Los ancestros callan.\n"
 pod_laibon.400.desc.walker: "\n#bold Eres un Caminante entre Mundos#!: has dominado tanto Aye como Orun y te alzas en la encrucijada de la propia existencia."
 pod_laibon.400.desc.hollow: "\n#bold Eres el Hueco#!: cercenado de ambos mundos, a la deriva en el vacío entre ellos. [Glossary('La Bestia','game_concept_beast_desc')] observa y espera."
 pod_laibon.400.a: "¿Qué es Aye, el mundo de los vivos?"
 pod_laibon.400.b: "¿Qué es Orun, el mundo espiritual?"
 pod_laibon.400.c: "¿Cómo funciona este equilibrio?"
 pod_laibon.400.d: "Lo entiendo."
 pod_laibon.401.t: "El mundo de los vivos"
 pod_laibon.401.desc.intro: "#bold Aye#! es tu conexión con el mundo mortal: la tierra, la gente, el pulso vivo de tu dominio. Un Laibon fuerte en Aye no gobierna solo por el miedo, sino por la presencia. Los mortales obedecen porque sienten el peso de tu autoridad. La propia tierra te reconoce como su guardián.\n\nA medida que tu Aye crece, ganas influencia sobre la opinión de los mortales, el gobierno y la estabilidad de tu dominio. En su cima, puedes Invocar la Autoridad de los Vivos, un poder que impone obediencia a mortales y Laibon por igual.\n\n"
 pod_laibon.401.desc.tier3: "#bold Situación actual:#! Has alcanzado el nivel más alto de Aye: #bold Hijo de Aye#!. El mundo de los vivos es tuyo para mandar."
 pod_laibon.401.desc.tier2: "#bold Situación actual:#! Tu Aye es #bold fuerte#!: estás bien arraigado en el mundo de los vivos, pero aún no has alcanzado su cima."
 pod_laibon.401.desc.tier1: "#bold Situación actual:#! Tu Aye es #bold modesto#!: una base, pero queda mucho por crecer."
 pod_laibon.401.desc.none: "#bold Situación actual:#! Estás #bold desconectado#! de Aye. Sin esta conexión, sufres penalizaciones a tu influencia sobre los mortales."
 pod_laibon.401.desc.factors: "\n\n#bold Qué fortalece Aye:#!\n- Disciplinas de Presencia y Dominación\n- Mantener un rebaño y ocuparte de los asuntos mortales\n- Legados favorables a Aye (Guruhi, Ishtarri) y caminos de fe\n- Eventos que te conectan con el mundo mortal\n\n#bold Qué debilita Aye:#!\n- Frenesí y pérdida de control\n- Matar o desangrar mortales con imprudencia\n- Decaimiento natural con el tiempo: Aye debe mantenerse activamente"
 pod_laibon.401.a: "Cuéntame más sobre los dos mundos."
 pod_laibon.401.b: "He visto suficiente."
 pod_laibon.402.t: "El mundo espiritual"
 pod_laibon.402.desc.intro: "#bold Orun#! es tu conexión con el mundo más allá del velo: el reino de los ancestros, los espíritus y los muertos. Un Laibon fuerte en Orun camina con lo invisible. Los ancestros comparten sus secretos, los espíritus prestan su fuerza y el límite entre la vida y la muerte se adelgaza hasta desaparecer.\n\nA medida que tu Orun crece, ganas destreza, temor y resistencia a las conjuras hostiles. En su cima, puedes Comulgar con los Ancestros, un ritual que arranca secretos al mundo espiritual y te envuelve en la fuerza de los muertos.\n\n"
 pod_laibon.402.desc.tier3: "#bold Situación actual:#! Has alcanzado el nivel más alto de Orun: #bold Hijo de Orun#!. El mundo espiritual responde a tu llamada."
 pod_laibon.402.desc.tier2: "#bold Situación actual:#! Tu Orun es #bold fuerte#!: los ancestros hablan con claridad, pero los misterios más profundos siguen velados."
 pod_laibon.402.desc.tier1: "#bold Situación actual:#! Tu Orun es #bold modesto#!: los espíritus se agitan, pero sus voces son débiles."
 pod_laibon.402.desc.none: "#bold Situación actual:#! Estás #bold desconectado#! de Orun. Sin esta conexión, eres vulnerable y estás mermado."
 pod_laibon.402.desc.factors: "\n\n#bold Qué fortalece Orun:#!\n- Disciplinas de Obtenebración y Necromancia\n- Alimentarte de vampiros y el vínculo de sangre\n- Legados favorables a Orun (Ramanga, Nagloper, Bonsam, Impundulu, Mla Watu) y caminos de fe\n- Eventos que te conectan con el mundo espiritual\n\n#bold Qué debilita Orun:#!\n- Decaimiento natural con el tiempo. Orun debe mantenerse activamente\n- Descuidar el mundo espiritual en favor de las preocupaciones mortales"
 pod_laibon.403.t: "El equilibrio"
 pod_laibon.403.desc.intro: "El sistema Aye/Orun registra tu situación espiritual en dos ejes. Cada uno va de vacío a lleno, con umbrales en tres niveles. Tu legado, tu fe, tus disciplinas y tus decisiones determinan dónde te encuentras.\n\n"
 pod_laibon.403.desc.decay: "#bold Decaimiento anual:#! Tanto Aye como Orun se erosionan de forma natural con el tiempo. Cuanto más alto es tu nivel, más rápido decae. Debes cultivar activamente tus conexiones o arriesgarte a perderlas. Si ambos ejes caen por debajo del primer umbral, te conviertes en #bold el Hueco#!: cercenado de ambos mundos, sufres graves penalizaciones hasta que logras remontar.\n\n"
 pod_laibon.403.desc.affinity: "#bold Legado y fe:#! Tu legado Laibon (clan) y tu camino de fe inclinan cada uno tu equilibrio. Los legados favorables a Aye, como los Guruhi y los Ishtarri, te atraen de forma natural hacia el mundo de los vivos. Los legados favorables a Orun, como los Ramanga y los Nagloper, te atraen hacia los espíritus. Los legados equilibrados, como los Osebo y los Akunanse, dejan la elección en tus manos. Tu camino de fe funciona de modo similar: elige uno que se ajuste al camino que deseas, o uno que contrarreste tu legado.\n\n"
 pod_laibon.403.desc.special: "#bold Maestría:#! Si alcanzas el nivel más alto en Aye y en Orun a la vez, te conviertes en un #bold Caminante entre Mundos#!: un raro estado de armonía espiritual que concede perspicacia, calma y el respeto de tus iguales.\n\n#bold Habilidades de nivel 3:#! Alcanzar el nivel más alto en cualquiera de los ejes desbloquea una decisión poderosa. El Hijo de Aye puede Invocar la Autoridad de los Vivos para un aumento de influencia mortal. El Hijo de Orun puede Comulgar con los Ancestros para arrancar secretos al mundo espiritual.\n\n#bold Disciplinas:#! Presencia y Dominación fortalecen pasivamente Aye. Obtenebración y Necromancia fortalecen pasivamente Orun.\n\n#bold Alimentación y Frenesí:#! Mantener un rebaño fortalece Aye. Alimentarte de vampiros o el vínculo de sangre fortalece Orun. Matar o desangrar mortales debilita Aye. Caer en frenesí te desplaza hacia Orun."
