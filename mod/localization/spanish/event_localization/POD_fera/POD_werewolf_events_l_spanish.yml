l_spanish:

 POD_werewolves.1.t: "Canciones primordiales"
 POD_werewolves.1.desc: "Los hombres lobo Galliard son la voz del Pueblo, llamándolos a la batalla e inspirándolos a la grandeza en la vida y en la muerte. También son guardianes de las tradiciones, portando el saber de las tribus desde el principio de los tiempos.\nComo narradores alrededor de la hoguera, los Galliard transmiten historias y canciones contadas desde el inicio de los tiempos. ¿Cuál será hoy?"
 POD_werewolves.1.option.a: "Una canción de unidad tribal."
 primal_song_modifier: "Canción de unidad"
 primal_song_modifier_desc: "¡Como los héroes de antaño, debemos permanecer unidos!"
 POD_werewolves.1.option.b: "Un relato de victorias antiguas."
 song_heroes_modifier: "Canción de héroes"
 song_heroes_modifier_desc: "Hay sabiduría que hallar en las victorias, e incluso en las derrotas, de nuestros antepasados."
 POD_werewolves.1.option.c: "Un relato de sangre y batalla."
 song_rage_modifier: "Canción de la $glossary_rage$"
 song_rage_modifier_desc: "Ante todo, somos guerreros y debemos recordar siempre nuestro espíritu de lucha."
 POD_werewolves.1.option.d: "Un relato de unidad y valor."


 POD_werewolves.2.t: "Convocar duplicados sombríos"
 POD_werewolves.2.desc: "Con tu dominio del Don del espíritu de la noche, puedes intentar invocar duplicados sombríos de ti mismo para el combate."
 POD_werewolves.2.option.a: "¡Yo os convoco!"
 POD_werewolves.2.option.a.tt: "Intentarás convocar duplicados sombríos"
 POD_werewolves.2.option.a.desc: "Una lucha con tu fuerza de voluntad"
 POD_werewolves.2.option.a.tt.success: "Tu duplicado sombrío ha sido convocado con éxito"
 POD_werewolves.2.option.a.tt.failure: "No logras convocar a tu duplicado sombrío"
 POD_werewolves.2.option.b: "Ahora no es el momento adecuado"
 POD_werewolves.2.option.b.tt: "Abandonarás tu idea de convocar duplicados sombríos"
 POD_werewolves.3.t: "Convocar duplicados sombríos"
 POD_werewolves.3.desc: "Con tu maestría en el Don del espíritu de la noche, has logrado convocar con éxito duplicados sombríos de ti mismo, ahora es el momento de dar órdenes."
 POD_werewolves.3.option.a: "Luchad por mí en la batalla"
 POD_werewolves.3.option.a.tt: "Tu duplicado sombrío ha sido convocado con éxito."
 POD_werewolves.4.t: "Convocar duplicados sombríos"
 POD_werewolves.4.desc: "Incluso tu maestría en el Don del espíritu de la noche no es suficiente para convocar a tu duplicado sombrío... por ahora."
 POD_werewolves.4.option.a: "Aún no estoy preparado"
 POD_werewolves.4.option.a.tt: "No has logrado convocar a tu duplicado sombrío"
 POD_werewolves.5.t: "El duplicado sombrío se desvanece"
 POD_werewolves.5.desc: "Tu duplicado sombrío ha sufrido un incidente y se ha desvanecido."
 POD_werewolves.5.option.a: "Mi duplicado sombrío es destruido"
 POD_werewolves.5.option.a.tt: "Tu duplicado sombrío ya no existe"

 POD_werewolves.7.t: "Es un niño..."
 POD_werewolves.7.desc: "Parece que Gaia no ha creído conveniente bendecirte hoy: tu bebé es un niño. La sociedad de las Furias Negras es muy estricta sobre lo que debe hacerse y sabes que ha sido el camino de tu tribu durante generaciones.\nHay algunos varones entre tu gente, por lo que elegir quedarte con este niño no carecería de precedentes si así lo desearas, pero seguiría siendo una gran afrenta a la tradición y sería considerado como un signo de debilidad por tus hermanas. Al final del día, sin embargo, la elección es solo tuya."
 POD_werewolves.7.option.a: "¡Un varón débil no tiene lugar entre nosotras!"
 POD_werewolves.7.option.b: "¡Sigo siendo su madre!"
 POD_werewolves.100.t: "Tambores de Batalla"
 POD_werewolves.100.desc: "Tras hacer todos los preparativos necesarios, has llegado ante [recipient.GetTitledFirstName]. Tu corazón se acelera en respuesta al combate que se avecina y late con su propio ritmo atronador. Los dos estáis listos.\n\nAhora llega la verdadera prueba... ¿resistir o perecer?"
 POD_werewolves.100.option.a: "¡Enfréntate a mí!"
 POD_werewolves.100.option.b: "Quizá esto no sea buena idea..."
 POD_werewolves.103.t: "Victoria"
 POD_werewolves.103.desc: "Ya fuera fuerza, destreza o suerte, no importa. [recipient.GetTitledFirstName] yace ensangrentado y quebrado a tus pies. La victoria es tuya. El destino de [recipient.GetHerHis] no tiene importancia; aunque [recipient.GetSheHe] sobreviva, ya no será una amenaza."
 POD_werewolves.103.option.a: "Otro más cae ante mí."
 POD_werewolves.104.t: "Maltrecho y Quebrado"
 POD_werewolves.104.desc: "Parece que no eras tan poderoso como creías. [recipient.GetTitledFirstName] ha logrado derrotarte y te ha abandonado a tu suerte. Que vivas o mueras depende ahora de tu propio cuerpo."
 POD_werewolves.104.option.a: "He... fracasado..."
 POD_werewolves.105.t: "Victoria"
 POD_werewolves.105.desc: "Para decepción de [recipient.GetTitledFirstName], parece que $glossary_luna$ te ha favorecido en este combate. La victoria es tuya."
 POD_werewolves.105.option.a: "Una buena pelea."
 POD_werewolves.106.t: "práctica perdida"
 POD_werewolves.106.desc: "jaja ¿cómo has perdido?"
 POD_werewolves.106.option.a: "ni idea"
 POD_werewolves.107.t: "Aparece un Nuevo Rival"
 POD_werewolves.107.desc: "Tu Gruñido ha atraído la atención de [ahroun_target.GetTitledFirstName]. [ahroun_target.GetSheHe] se te acerca, listo para aceptar tu desafío.\n\nLa muerte llega para todos, pero ¿a quién alcanzará primero?"
 POD_werewolves.107.option.a: "¡La gloria será mía!"
 POD_werewolves.107.option.b: "Esta no es una batalla que vaya a ganar."
 POD_werewolves.108.t: "Solo Uno Permanece"
 POD_werewolves.108.desc.a: "$POD_werewolves.103.desc$"
 POD_werewolves.108.desc.b: "$POD_werewolves.104.desc$"
 POD_werewolves.108.option.a: "$POD_werewolves.103.option.a$"
 POD_werewolves.108.option.b: "$POD_werewolves.104.option.a$"
 POD_werewolves.109.t: "Guerrero imparable"
 POD_werewolves.109.desc: "Allá donde vas, te sigue un rastro de destrucción. Una y otra vez tus enemigos se han alzado contra ti solo para caer a tus manos. Tu poderío está en muchas bocas, ya sea con admiración o con miedo. Muchos dicen que nadie puede igualarte; quizá tengan razón.\n\nAhora, con el Don final de $glossary_luna$, eres verdaderamente imparable."
 POD_werewolves.109.option.a: "La muerte puede tenerme cuando se lo gane."
 POD_werewolves.119.t: "Cuentacuentos"
 POD_werewolves.119.desc: "A través de cada canción de pesar, himno de batalla y dulce nana, has cargado con el peso de tus antepasados y has vuelto a contar sus grandes relatos. Al elaborar historias y canciones capaces de conmover incluso al más frío de los tuyos, tu voz se ha convertido en el corazón de tu pueblo. Al compartir los antiguos relatos de héroes, villanos, victorias y derrotas, has asegurado que el recuerdo de tus antepasados nunca se desvanezca.\n\nHabiéndote ganado el Don final de $glossary_luna$, tu voz está llamada sin duda a moldear generaciones."
 POD_werewolves.119.option.a: "Los mejores relatos son los que perduran."
 POD_werewolves.129.t: "Romper los vínculos"
 POD_werewolves.129.desc: "Bajo la luz constante de la media luna, te has alzado como el pilar en el que descansa tu manada. Con entrenamiento incansable y tu mano firme guiándolos, has forjado vínculos más fuertes que el hierro. Cada disputa amarga nacida de la ira y el orgullo zanjada, cada debilidad convertida en una nueva fortaleza por tu liderazgo, han consolidado tu papel de supremo guardián de la ley.\n\nHabiendo forjado la manada perfecta y bendecido con el Don final de $glossary_luna$, tu palabra se convierte en ley."
 POD_werewolves.129.option.a: "El liderazgo en su cumbre."
 POD_werewolves.139.t: "Portador del fuego"
 POD_werewolves.139.desc: "Te llaman vagabundo. Ladrón sin honor. Un contrario que desprecia las vías probadas. Que se aferren a sus rígidas tradiciones. Tus subversiones iluminarán el verdadero camino hacia delante. Ya has hecho burla de los santurrones, tomando para ti el favor de $glossary_luna$ una y otra vez.\n\nHabiendo demostrado tu astucia, te alzas como un lobo entre ovejas. Con el Don final de $glossary_luna$, la Luna Nueva brilla con intensidad sobre ti, el mayor de los embaucadores."
 POD_werewolves.139.option.a: "Que nada quede sin cuestionar ni desafiar."
 POD_werewolves.149.t: "Presencia Invocada"
 POD_werewolves.149.desc: "El velo entre el mundo material y el espiritual es uno que has cruzado ya innumerables veces. Has dado el paso lateral una y otra vez, atando a los moradores del reino a tu voluntad, tratando con Espíritus traviesos y explorando las partes más profundas de la Umbra. Otros se agolpan a tu alrededor en los Túmulos y escuchan con reverencia tu sabiduría ganada a pulso.\n\nCon el último Don de $glossary_luna$ concedido, los secretos de ambos mundos quedan ahora al descubierto."
 POD_werewolves.149.option.a: "El conocimiento es poder, y yo tengo de sobra."