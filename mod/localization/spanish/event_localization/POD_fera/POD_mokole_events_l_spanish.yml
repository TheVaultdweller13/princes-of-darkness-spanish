  mokole_3_pulse_title: "Mokolé"
 
 
 
 
  POD_mokole.100.t: "Soñando tu forma"
  POD_mokole.100.desc: "A diferencia de la mayoría de los $glossary_fera$, cuyas formas de guerra parecen casi idénticas entre sí, nunca encontrarás dos Mokolé con la misma forma Archid.\nLa forma del Archid se toma del sueño, que llega con el Primer Cambio del Mokolé. A través de la Mnesis, sueñan con los reptiles, aves y dinosaurios del pasado, lo que determina las características de su nueva forma Archid. En esta experiencia mística, el Mokolé experimenta realmente las vidas de sus ancestros recordados y su forma Archid se crea a partir de las formas de sus cuerpos.\nLa forma suele parecerse a un cocodrilo, un dinosaurio o un dragón, aunque hay Mokolé pterosaurios y serpientes marinas. Estas formas suelen tener partes del cuerpo que en la naturaleza no se dan en el mismo animal, como alas en un cocodrilo: las formas son soñadas, no estrictamente recordadas.\n\n¿Cuál es tu forma?"
  POD_mokole.100.option.a: "Mis sueños me han dado forma."
  POD_mokole.100.tooltip1: "@warning_icon!#warning Debes elegir todas las opciones disponibles para continuar#!"
  POD_mokole.100.tooltip2: "Tus opciones seleccionadas se añadirán a tu [GetModifier('POD_mokole_form_archid_modifier').GetNameWithTooltip]"
 
 
