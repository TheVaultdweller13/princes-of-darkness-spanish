  POD_ARCHID_REMAINING_OPTIONS: "Opciones restantes:"
 
 
 
 
  POD_mokole.101.t: "Señor de las Bestias"
  POD_mokole.101.desc: "Tras años de búsqueda constante a través de la Umbra y los lugares olvidados del mundo, has encontrado a los últimos supervivientes de los parientes de los Reyes Dragón. Tras tu catalogación, aún pueden ser devueltos al mundo, seguros y sanos bajo tu cuidado."
  POD_mokole.101.option.a: "La vida se abre camino..."
 
 
  POD_mokole.300.t: "Bajo las arenas"
  POD_mokole.300.desc: "Mientras recibes informes sobre la finalización de la etapa actual de la restauración de Cocodrilópolis, recibes un informe más curioso. Se han encontrado dos antiguos 'muertos' momificados, pero al ser llevados a la superficie, se despertaron de sus relicarios y se transformaron. Al saludarlos, los dos antiguos Mokolé te revelan en su lengua compartida que una vez fueron los hijos de un campeón mayor, pero en la caída de la ciudad, todos cayeron en el sueño. Te agradecen que los hayas despertado y se han unido a tu colección de campeones. Sin embargo, te piden que vayas más profundo, ya que existe la posibilidad de que su progenitor más fuerte estuviera en un estado similar al de ellos."
  POD_mokole.300.option.a: "Si ellos son estudiantes, ¿qué hay aún más profundo?"
 
 
  POD_mokole.301.t: "Guerrero antiguo"
  POD_mokole.301.desc: "Mientras supervisas los pasos finales de la restauración de Cocodrilópolis, las palabras de los hermanos resuenan en tu cabeza, al descubrirse una tumba final. Tan pronto como se abre la tumba y el sol brilla en el interior, un cocodrilo colosal de ojos lechosos surge de ella. Se estira, antes de volver a transformarse en la forma de un humano. Te acercas a él, mientras reconoce al Antiguo del pueblo que lo despertó. A pesar de su ceguera, puedes notar solo por su movimiento que la agudeza de sus instintos no tiene rival. Vestido con las galas de un Campeón de Anubis, es un verdadero tritón fuera del agua. Después de unos días, comprende el mundo según tu mejor saber y entender, y por restaurar su hogar, ha decidido unirse a ti. Dados los innumerables cadáveres de antiguos Setitas en su tumba, este fue un hallazgo tremendamente valioso."
  POD_mokole.301.option.a: "Anubis te ha concedido otro gran regalo."
 
 
  POD_mokole.502.t: "Cuatro eran Uno"
  POD_mokole.502.desc: "Una vez, todos los Mokolé eran de una sola Corriente. Para los Reyes Dragón, no había Mokolé-mbembe, Gumagan, Makara o Zhong Lung, sino simplemente Reyes. Mientras sueñas con aquellos tiempos, tu propia Corriente comienza a converger, a medida que se te abren nuevos Dones."
  POD_mokole.502.option.a: "Sueño de los Mokolé-mbembe"
  POD_mokole.502.option.b: "Sueño de los Gumagan"
  POD_mokole.502.option.c: "Sueño de los Makara"
  POD_mokole.502.option.d: "Sueño de los Zhong Lung"
 
 
 
 
  mnesis_quest_message_title: "Mnesis"
  
 
  POD_mokole.600.desc: "Sueñas con tiempos más relajantes."
  POD_mokole.601.desc: "Sueñas con Mokolé muertos."
  POD_mokole.602.desc: "Sueñas con tiempos pacíficos."
  POD_mokole.603.desc: "Sueñas con pesadillas oscuras y confusas."
  POD_mokole.604.desc: "Sueñas con estar bañado en Gnosis."
  POD_mokole.605.desc: "Sueñas con una Nidada perdida hace mucho tiempo, acurrucada para obtener calor y seguridad."
  POD_mokole.606.desc: "Sueñas con las selvas de Ambalasokei, feroces y salvajemente hermosas."
  POD_mokole.607.desc: "Sueñas con guerra y restos rotos, lucha y miedo sin fin."
  POD_mokole.608.desc: "Sueñas con Gendasi, las llanuras interminables calmando tu sueño."
  POD_mokole.609.desc: "Sueñas con el Pacto del Río, de la esperanza sin precedentes de paz entre lagartos y lobos."
  POD_mokole.610.desc: "Sueñas con amistades que se agrian, dando a luz a las amargas rivalidades."
  POD_mokole.611.desc: "Sueñas con el poderoso Brazentusk Mightyhoof, el último rey Grondr cayendo ante las garras Garou."
  POD_mokole.612.desc: "Sueñas con el último Apis de Creta, calumniado en la memoria Garou y mortal."
  POD_mokole.613.desc: "Sueñas con el antiguo Khem, donde los parientes Mokolé se aseguraban de que el Sol recibiera la adoración adecuada."
  POD_mokole.614.desc: "Sueñas con el inicio de la vida en Entoban, mucho antes de que todo y todos los demás existieran."
  POD_mokole.615.desc: "Sueñas con Bandaiyan abrasada por el sol, para siempre libre de mácula."
  POD_mokole.616.desc: "Sueñas contigo soñando durante la Era del Sueño."
  POD_mokole.617.desc: "Sueñas con hombres pavimentando ciudades con oro, antes de inundarlas con ríos de sangre."
  POD_mokole.618.desc: "Sueñas con Oannes, donde la sabiduría fue compartida y robada."
  POD_mokole.619.desc: "Sueñas con sueños perdidos, y los pierdes."
  POD_mokole.620.desc: "Sueñas con los objetivos de Gaia, pero no puedes alcanzarlos."
  POD_mokole.621.desc: "Sueñas con los Reyes Dinosaurio, rugiendo ferozmente e inconscientes del destino que les aguarda."
  POD_mokole.622.desc: "Sueñas con los Últimos Tiempos, donde todo comenzó y terminó."
  POD_mokole.623.desc: "Sueñas con coronas y cetros, convirtiéndose en polvo mientras el tiempo los reduce a todos a la nada."
  POD_mokole.624.desc: "Sueñas con los jueces serpentinos, e intentan robar tu sueño mientras roban tu forma."
  POD_mokole.625.desc: "Sueñas con los Wani, entregando sus huevos a la Reina Madre para que los lleve al Reino Medio."
  POD_mokole.626.desc: "Sueñas con los Hakken, mientras se exilian a las islas de Nihon."
  POD_mokole.627.desc: "Sueñas con los antiguos templos de los Reyes Lagarto, dedicados a Helios, el padre Sol."
  POD_mokole.628.desc: "Sueñas con la Guerra de la Vergüenza y el establecimiento de las Cortes de las Bestias."
  POD_mokole.629.desc: "Sueñas con el fracaso de los Mokolé, y la solución de Gaia de crear las otras razas $glossary_fera$."
  POD_mokole.630.desc: "Sueñas con grandes dinosaurios y sus cuidadores Reyes Lagarto."
 
 
 
 
 
 
 
 
 
 
 
 
 
  POD_mokole.681.t: "Sueños perdidos"
  POD_mokole.681.desc: "Mientras que la mayoría de los Mokolé se entregan y se esconden dentro de sus sueños, siempre hay una amenaza en la nostalgia. Para los Mokolé, son los Cazadores de Sueños, acechadores umbrales azotados y retorcidos por sus sueños que buscan silenciar su anhelo. Desafortunadamente, en tu propio sueño, uno ha comenzado a invadir tus pensamientos, buscando tu destrucción."
  POD_mokole.681.option.a: "Convencerlo de que se vaya."
  POD_mokole.681.option.b: "Ahuyentarlo."
 
  POD_mokole.682.t: "Un invasor"
  POD_mokole.682.desc: "Esconderse dentro de los reconfortantes recuerdos de la Mnesis es un lujo único de los Mokolé, pero no está exento de riesgos. Los Cazadores de Sueños, acechadores umbrales que acosan a los Mokolé en todos sus escapes personales, han venido a buscarte en tu propio respiro en la Mnesis, ansiosos por añadir tu muerte a la memoria ancestral de la Mnesis."
  POD_mokole.682.option.a: "Superarlo en maniobra."
  POD_mokole.682.option.b: "Ahuyentarlo."
 
 
 
 
  POD_mokole.689.good: "Lograste aprender algo del Cazador de Sueños derrotado."
 
 
 
 
  POD_mokole.690.t: "Despierto de nuevo"
  POD_mokole.690.desc: "A medida que la conclusión de la búsqueda de Mnesis llega a su fin, el mundo de los vivos y los mortales te llama de nuevo. Te agitas, mientras los recuerdos vienen contigo, más de la memoria compartida de los Mokolé ahora es tuya. Despiertas de la memoria, la elección de qué hacer con ella ahora depende de ti."
  POD_mokole.690.option.a: "Dormir, tal vez soñar."
 
  mokole_mnesis_quest_widget_tt: "Comenzarás inmediatamente otro [journey|E] de #bold Mnesis#!."
  mokole_mnesis_quest_widget_desc: "¿Ir a otro [journey|E] de #bold Mnesis#!?"
 
 
 
 
 
 
 
 
  POD_mokole.torment: "¡Tormento!"
  POD_mokole.torment_desc: "¡Uno de tus [tormentors|E] está actuando contra ti!"
 
  POD_mokole.700.t: "Ataque de inocente"
  POD_mokole.700.desc: "¡Un [innocent|E] te ha atacado!"
  POD_mokole.701.t: "Siendo seguido"
  POD_mokole.701.desc: "Algo siniestro te sigue en la Umbra."
  POD_mokole.702.t: "Drenado"
  POD_mokole.702.desc: "Un [innocent|E] oculto ha drenado tu fuerza."
  POD_mokole.703.t: "Asalto"
  POD_mokole.703.desc: "¡Un par de [innocents|E] te han atacado!"
  POD_mokole.704.t: "Emboscada de plata"
  POD_mokole.704.desc: "¡Un [innocent|E] imbuido de plata te ha emboscado!"
  POD_mokole.705.t: "Terror"
  POD_mokole.705.desc: "Los espantosos sonidos de los [innocents|E] han logrado intimidarte."
  POD_mokole.706.t: "Cuerpo roto"
  POD_mokole.706.desc: "¡Los [innocents|E] han devastado tu cuerpo!"
 
 
  POD_mokole.720.t: "La oscuridad se aproxima"
  POD_mokole.720.desc: "Muchos Mokolé no logran refrenar sus emociones cuando encuentran recuerdos oscuros durante su Mnesis, los [innocents|E] son el resultado. Estas emociones negativas se unen en un espíritu maligno que busca destruir tanto a su creador como a todos los demás Mokolé. Desafortunadamente, como se alimentan de Gnosis, uno de los Inocentes se ha dedicado a acecharte, con el deseo de convertirte en su cena."
  POD_mokole.720.a: "¡Debo resistir!"
  POD_mokole.720.b: "¡Protegedme!"
  POD_mokole.720.c: "No puedo aguantar más..."
 
  POD_mokole.721.t: "Pesadilla encarnada"
  POD_mokole.721.desc: "Muchos Mokolé no logran refrenar sus emociones cuando encuentran recuerdos oscuros durante su Mnesis, los [innocents|E] son el resultado. Estas emociones negativas se unen en un espíritu maligno que busca destruir tanto a su creador como a todos los demás Mokolé. Desafortunadamente, uno de ellos ha robado la forma de otro Mokolé, y ha decidido que quiere tomar tu propia forma Archid para sí mismo."
  POD_mokole.721.a: "¡A la batalla!"
  POD_mokole.721.b: "¡Esto lo distraerá!"
  POD_mokole.721.c: "¡Debo huir!"
