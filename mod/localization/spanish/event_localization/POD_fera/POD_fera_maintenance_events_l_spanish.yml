l_spanish:

 POD_fera_maintenance.2.t: "Primer Cambio"
 POD_fera_maintenance.2.desc: "El Primer Cambio es el nombre de la primera transformación de un joven $glossary_fera$. Suele ir acompañado del primer frenesí y del primer uso de la forma de batalla en situaciones de mucho estrés.\nAcabas de vivir este suceso traumático y eres ya oficialmente un $glossary_fera$, un miembro de pleno derecho de tu tribu con todas las responsabilidades y privilegios que conlleva tal papel."
 POD_fera_maintenance.2.option.a: "Ahora soy un adulto."


 POD_fera_maintenance.101.t: "Regeneración"
