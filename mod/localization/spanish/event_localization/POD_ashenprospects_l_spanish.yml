l_spanish:

 POD_ashen_prospect.001.t: "Invitar a prospecto ceniciento"
 POD_ashen_prospect.001.desc: "Tu estatus e influencia en los mundos tanto de los Vástagos como del Ganado te permiten traer posibles sirvientes a tu corte."
 POD_ashen_prospect.001.option.a: "Prospecto noble"
 POD_ashen_prospect.001.option.a.tt: "Convoca a $pod_cainites$ de linaje noble que puedan servirte."
 POD_ashen_prospect.001.option.b: "Prospecto caballero"
 POD_ashen_prospect.001.option.b.tt: "Haz un llamamiento a $pod_cainites$ de proeza marcial y fuerza de armas."
 POD_ashen_prospect.001.option.c: "Prospecto senescal"
 POD_ashen_prospect.001.option.c.tt: "Atrae a administradores y senescales a tu corte con promesas de riqueza y prestigio."
 POD_ashen_prospect.001.option.d: "Prospecto ladrón"
 POD_ashen_prospect.001.option.d.tt: "Invita a $pod_cainites$ expertos en pasar desapercibidos y en ignorar la autoridad del príncipe."
 POD_ashen_prospect.001.option.e: "Prospecto de culto"
 POD_ashen_prospect.001.option.e.tt: "Contacta con $pod_cainites$ ambiciosos que controlan a mortales en cultos."

 POD_ashen_prospect.101.t: "¡La llamada ha sido respondida!"
 POD_ashen_prospect.101.desc.noble: "No todos los de linaje noble buscan gobernar; algunos se contentan con servir cerca de los centros de poder. Por un precio, su consejo puede ser tuyo."
 POD_ashen_prospect.101.desc.knight: "Las guerras de los mortales crean un mundo lleno de $pod_cainites$ expertos en las artes de la guerra, dispuestos a ofrecer su espada y su servicio a un Príncipe generoso, por el precio adecuado."
 POD_ashen_prospect.101.desc.seneschal: "Aunque las existencias e inventarios puedan diferir de los del mundo mortal, un señor $pod_cainite$ sensato valora a un buen senescal para administrar sus posesiones."
 POD_ashen_prospect.101.desc.thief: "Incluso los vástagos no pueden llevar una vida honorable cuando son oprimidos por los que gobiernan; tener a uno de ellos a tu servicio puede resultar útil."
 POD_ashen_prospect.101.desc.cult: "La religión es muy importante para los mortales. Por eso algunos $pod_cainites$ se ponen una máscara de dioses o de sus servidores para manipular al ganado y convertirlos en sus esbirros."
 POD_ashen_prospect.101.option.a: "Elijo a [prospect_one.GetFirstName]"
 POD_ashen_prospect.101.option.a.tt: "[prospect_one.GetFirstName] se une a tu corte, [prospect_two.GetFirstName] y [prospect_three.GetFirstName] son despedidos."
 POD_ashen_prospect.101.option.b: "Elijo a [prospect_two.GetFirstName]"
 POD_ashen_prospect.101.option.b.tt: "[prospect_two.GetFirstName] se une a tu corte, [prospect_one.GetFirstName] y [prospect_three.GetFirstName] son despedidos."
 POD_ashen_prospect.101.option.c: "Elijo a [prospect_three.GetFirstName]"
 POD_ashen_prospect.101.option.c.tt: "[prospect_three.GetFirstName] se une a tu corte, [prospect_one.GetFirstName] y [prospect_two.GetFirstName] son despedidos."