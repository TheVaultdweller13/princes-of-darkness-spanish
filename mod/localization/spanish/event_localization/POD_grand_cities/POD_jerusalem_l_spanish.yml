 POD_jerusalem.33.t: "El Semidivino Eterno"
 POD_jerusalem.33.desc: "¡Está hecho! Has retocado las historias e incluso tu propia forma. Has reclutado maestros de la magia y grandes académicos. Has conectado con la fuente de glamour que es el fervor de tantos mortales en un área tan pequeña, amplificado por una presencia cercana. ¡No hay límites para esa creencia! Tus descendientes estarán protegidos de los estragos de los rituales religiosos, ¡incluso del bautismo! El mundo puede ser azotado por guerras sangrientas, plagas horribles, inquisiciones espantosas y una banalidad que aplasta el alma, ¡pero tú perdurarás! ¡Mientras haya humanos que crean en lo divino, tú permanecerás!\n\n\n #EMP «Ángeles, silenciosos, con la sabiduría desplegada,\nvigilando con cuidado nuestro mundo,\naayudando, flotando, guardando y guiando:\ntras el velo que cubre a los ángeles que moran.\n\nÁngeles, acercándose mientras dormimos,\nnos llaman: «entrad aquí en lo profundo»,\ntransformad todo arrepentimiento y vacío plan.\nSus sagradas siluetas danzan en nuestro sueño.\n\nÁngeles, cuando despertamos, vened, uno a uno,\ntareas que cumplir hasta que el día termine.\nSentid su tierno cuidado, aunque su forma esté enmascarada.\nLos ángeles están en todas partes. Recibidles con calidez».#!"
 POD_jerusalem.33.a: "¡Alabadme!"

 grigori_fae_modifier: "Un Ser Semidivino"
 grigori_fae_modifier_desc: "Profeta, Grigori, Nephilim, Chayot, Ofanim, Erelim, Hashmal, Serafín, Malakhim, Bene Elohim, Querubín, Ishim, Chalkydri, Chashmalim, Memitim, Keruvim, Hamalat al-Arsh, Mu'aqqibat, Hafaza, Kiraman Katiban."



 mummies_tap_web_faith_decision: "Conectar con la Red"
 mummies_tap_web_faith_decision_desc: "Nuestro hekau se alimenta del Sekhem que obtenemos de la Red de la Fe. Aunque algunos han descubierto otros medios para obtenerlo, la Red de la Fe sigue siendo el proveedor más eficiente y fiable de Sekhem. Jerusalén se encuentra entre los nodos más poderosos y presenta una oportunidad única para conectar ocasionalmente con la Red de la Fe para obtener Sekhem adicional."
 mummies_tap_web_faith_decision_confirm: "Preparar el surtidor metafórico"
 mummies_tap_web_faith_decision_tooltip: "Jerusalén es un nodo poderoso en la Red de la Fe y ofrece una oportunidad"
 mummies_tap_web_faith_decision_effect: "Recibirás experiencia del Estilo de vida de Hekau basada en tu [trait_level_track_xp|E] de $POD_splat_mummy$"

 POD_jerusalem.34.t: "Conectando con la Red de la Fe"
 POD_jerusalem.34.desc: "Tu magia hekau e incluso tu larga vida se alimentan del Sekhem extraído de la Red de la Fe, una red mística que une nodos por todo el norte de África, Oriente Medio y Persia. Tu control sobre Jerusalén te ha permitido conectar con la Red de la Fe, otorgándote Sekhem adicional e incluso conocimiento sobre su uso. A diferencia de las conexiones más estables, esta conexión tiene sus limitaciones, pero crea algunas posibilidades intrigantes."
 POD_jerusalem.34.a: "No puedo esperar a explorarlas."









 jerusalem_shift_balance_of_power_decision: "Cambiar el equilibrio de poder de Jerusalén"
 jerusalem_shift_balance_of_power_decision_desc: "La [grand_city|E] de [holy_jerusalem|E] se equilibra en el filo de una navaja, tambaleándose entre las tres principales facciones religiosas. Judíos, cristianos y musulmanes luchan constantemente por un mayor control dentro de su ciudad santa. Sus contrapartes sobrenaturales se involucran con frecuencia en estos conflictos por un motivo u otro. Si dispones de los recursos, podrías inclinar la balanza del poder a favor de tu facción preferida, o podrías intentar mantener el equilibrio."
 jerusalem_shift_balance_of_power_decision_confirm: "Echemos un vistazo"
 jerusalem_shift_balance_of_power_decision_tooltip: "Jerusalén se mantiene en el filo de la navaja. Vamos a inclinar la balanza."
 jerusalem_shift_balance_of_power_decision_effect: "Puedes revisar el equilibrio de poder actual o alterarlo."

 jerusalem_influence_message_title: "Equilibrio de poder"
 jerusalem_influence_message_desc: "Tras completar un nuevo edificio, el equilibrio de poder en la [grand_city|E] de Jerusalén ha cambiado."
 jerusalem_influence_gain: "[holy_jerusalem|E] #P gana#! [SCOPE.GetValue('influence_delta')|V0] [Localize(SCOPE.GetFlagName('influence_type'))]"
 jerusalem_influence_loss: "[holy_jerusalem|E] #N pierde#! [Abs_CFixedPoint(SCOPE.GetValue('influence_delta'))|V0] [Localize(SCOPE.GetFlagName('influence_type'))]"

 POD_jerusalem.35.t: "Equilibrio de poder"
 POD_jerusalem.35.desc: "La [grand_city|E] de [holy_jerusalem|E] se mantiene en el filo de la navaja, vacilando entre las tres principales facciones religiosas. Dependiendo de tus objetivos con respecto a las estructuras de Jerusalén, tendrás que inclinar el equilibrio de poder a favor de diferentes facciones."
 POD_jerusalem.35.a: "Alterar la influencia @piety_level_3_icon_christian!cristiana"
 POD_jerusalem.35.b: "Alterar la influencia @piety_level_3_icon_islam!musulmana"
 POD_jerusalem.35.c: "Alterar la influencia @piety_level_3_icon_judaism!judía"
 POD_jerusalem.35.d: "Pensándolo mejor..."
 
 POD_jerusalem.36.t: "Influencia cristiana en Jerusalén"
 POD_jerusalem.36.desc: "Durante casi dos siglos, Jerusalén ha pasado de manos de unos a otros entre las distintas facciones cristianas y musulmanas. Recientemente, la Sexta Cruzada concluyó con la exitosa toma de Jerusalén por parte de Federico II, el emperador del Sacro Imperio Romano Germánico. Además, el tratado de paz ha provocado que el sultán al-Kamil de Egipto desvíe su atención de Jerusalén hacia el emir an-Nasir Dawud de Damasco. Cinco órdenes de caballeros tienen presencia en Jerusalén para apoyar los objetivos cristianos. Tres estados cruzados proporcionan apoyo adicional desde el norte. Además, la población de la ciudad ha crecido hasta alcanzar los cien mil habitantes, lo que iguala o supera su tamaño bajo el califato fatimí, aumentando la influencia cristiana a medida que más gente se traslada a Jerusalén.\n\nLamentablemente, los cristianos se enfrentan a diversas contiendas. El Reino de Jerusalén está dividido por una guerra civil, un conflicto que se extiende incluso a las órdenes de cruzados. Más allá de eso, la tregua de Federico expirará en 1239, y no cabe duda de que los países musulmanes circundantes atacarán."
 POD_jerusalem.36.a: "@gold_icon! Apoyar a los mercaderes italianos"    #gold to strengthen
 POD_jerusalem.36.b: "@prestige_icon! Aumentar la unidad en la región" #prestige to strengthen
 POD_jerusalem.36.c: "@gold_icon! Organizar ataques selectivos"     #gold to weaken
 POD_jerusalem.36.d: "@prestige_icon! Avivar las llamas de la guerra civil"      #prestige to weaken

 POD_jerusalem.37.t: "Influencia musulmana en Jerusalén"
 POD_jerusalem.37.desc: "Durante casi dos siglos, Jerusalén ha pasado de manos de unos a otros entre las distintas facciones cristianas y musulmanas. Recientemente, la Sexta Cruzada concluyó con la exitosa toma de Jerusalén por parte de Federico II, el emperador del Sacro Imperio Romano Germánico. Aunque el gobierno de la ciudad se perdió temporalmente, el tratado garantizó el derecho de los musulmanes a continuar su culto. Tras la caída de Jerusalén en 1244 ante el Imperio Corasmio, no volverá a caer en manos musulmanas durante siglos. Incluso antes de eso, tanto los gobernantes como los habitantes mortales y sobrenaturales de esta región son predominantemente musulmanes.\n\nSin embargo, en este momento, Jerusalén está controlada por mortales cristianos. Los sultanes y emires musulmanes luchan entre sí, y la incursión mongola de 1260 debilitará aún más la influencia musulmana en la región."
 POD_jerusalem.37.a: "@gold_icon! Expandir los esfuerzos de islamización"    #gold to strengthen
 POD_jerusalem.37.b: "@prestige_icon! Fomentar las incursiones de ghazwa"         #prestige to strengthen
 POD_jerusalem.37.c: "@gold_icon! Distraer a los gobernantes musulmanes mortales"  #gold to weaken
 POD_jerusalem.37.d: "@prestige_icon! Expulsar a los alborotadores musulmanes"     #prestige to weaken

 POD_jerusalem.38.t: "Influencia judía en Jerusalén"
 POD_jerusalem.38.desc: "Durante casi dos siglos, Jerusalén ha pasado de manos de unos a otros entre las distintas facciones cristianas y musulmanas. Solo una cosa ha permanecido constante: muchos judíos han muerto. En las Semanas de Sangre, los cruzados cristianos masacraron y mantuvieron en cautiverio a muchos judíos. Aunque los gobernantes musulmanes han sido más tolerantes, nunca han rehuido de diezmar a la población judía. Las sinagogas y los antiguos lugares sagrados son frecuentemente reclamados, profanados o simplemente destruidos.\n\nAnte todas estas dificultades que enfrentan los judíos en Jerusalén, podrías aniquilarlos fácilmente o luchar por mantenerlos dependiendo de tus intenciones."
 POD_jerusalem.38.a: "@gold_icon! Organizar guardias y defensas"  #gold to strengthen
 POD_jerusalem.38.b: "[GetLocalPlayerPietyTextIcon] Fomentar la aliyá"        #piety to strengthen
 POD_jerusalem.38.c: "@gold_icon! Construir sobre sinagogas"          #gold to weaken
 POD_jerusalem.38.d: "[GetLocalPlayerPietyTextIcon] Incentivar conversiones, voluntarias o de otro tipo"         #piety to weaken