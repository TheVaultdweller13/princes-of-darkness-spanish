l_spanish:
 supehunter_purify_jerusalem_pit_decision: "Purificar el foso en Ketef Hinnom"
 supehunter_purify_jerusalem_pit_decision_desc: "Cerca de la ciudad santa de Jerusalén y bajo las ruinas de Ketef Hinnom, hay un foso profundo. Todos los que se acercan demasiado, tanto humanos como sobrenaturales, son víctimas de la locura, e incluso aquellos que están más lejos parecen verse afectados por cierto grado de manía. Tal abominación no puede tolerarse tan cerca de Jerusalén. Como tal, es nuestro deber purificar este foso.\n\n#R Tus posibilidades de éxito en esta misión son absurdamente bajas, especialmente si eres un mortal. No lo intentes si te importa el bienestar de tu personaje. Ni siquiera guardar y cargar la partida para cambiar las probabilidades te salvará.\n\nAsí que reza a tus dioses y recuerda que los virtuosos tendrán éxito donde los pecadores fracasarán. ¡HAS SIDO ADVERTIDO!#!"
 supehunter_purify_jerusalem_pit_decision_confirm: "¡El foso debe ser purificado!"
 supehunter_purify_jerusalem_pit_decision_tooltip: "¡No podemos tolerar tal maldad tan cerca de la Ciudad Santa!"
 
 POD_jerusalem.1.t: "La Caza: Preparación inicial"
 POD_jerusalem.1.desc: "Sabemos a dónde debemos ir finalmente, pero primero hay preparaciones que hacer. Si queremos sobrevivir a esta caza, debemos entrar con todas las ventajas posibles.\n\nAunque tenemos muchos aliados y soldados propios, puede ser útil reunir más ayuda. Debido a la naturaleza sagrada de Jerusalén, se pueden encontrar muchísimos cazadores de diferentes credos en los alrededores. Si quisiéramos, podríamos contar con todos ellos o solo reclutar aliados de la misma religión."
 POD_jerusalem.1.a: "Necesitamos toda la ayuda posible." #cost prestige and piety
 POD_jerusalem.1.b: "Solo se puede confiar en los creyentes." #cost prestige
 POD_jerusalem.1.c: "No traigamos a forasteros." #no cost

 POD_jerusalem.2.t: "La Caza: El conocimiento es poder"
 POD_jerusalem.2.desc: "Como se ha dicho durante mucho tiempo, el conocimiento es poder. Saber qué esperar cuando nos sumerjamos en el foso sería una gran ayuda en nuestra caza.\n\nCarecemos de los libros y artefactos necesarios para responder a nuestras preguntas. Por ello, localicemos una biblioteca que contenga todo lo que necesitamos."
 POD_jerusalem.2.a: "Ofrecer una recompensa por información." #gold
 POD_jerusalem.2.b: "Cobrar algunos favores." #prestige
 POD_jerusalem.2.c: "Nuestras bibliotecas tienen algunas pistas." #learning challenge for a little bit of gold & prestige
 POD_jerusalem.2.effect.success.desc: "Así que así es como ha terminado..."
 POD_jerusalem.2.critical.failure.effect.desc: "¿Dónde estará ese asistente...?"

 POD_jerusalem.3.t: "La Caza: Puertas cerradas"
 POD_jerusalem.3.desc: "Hemos localizado una biblioteca $pod_cainite$ con el conocimiento que buscamos. Sin embargo, han cerrado sus puertas y establecido defensas antinaturales mediante los poderes otorgados por su maldad. No podemos simplemente renunciar a nuestra misión ahora, así que lo único que queda es determinar cómo adquirir los textos que necesitamos."
 POD_jerusalem.3.a: "¡Asaltad las puertas!" #martial challenge or death, boost chances if Organizer or Military Engineer
 POD_jerusalem.3.a.effect.success.desc: "Ninguna puerta puede detenernos"
 POD_jerusalem.3.b: "¡A la puerta trasera!" #intrigue challenge or gold
 POD_jerusalem.3.b.effect.success.desc: "No pueden vigilar cada puerta"
 POD_jerusalem.3.critical.failure: "Y así termina nuestra misión..."
 POD_jerusalem.3.critical.failure.effect.desc: "Nuestra fe fue insuficiente"

 POD_jerusalem.4.t: "La Caza: Acceso concedido"
 POD_jerusalem.4.desc: "Por las buenas o por las malas, hemos conseguido los libros que buscábamos.\n\nNuestra investigación nos cuenta la historia de una $pod_cainite$ llamada [GetScriptedCharacterByHistoryID('790147').GetFirstName]. [GetScriptedCharacterByHistoryID('790368').GetFirstName] es responsable de su $pod_Embrace$, un evento que ocurrió en las profundidades del Laberinto de Knossos. Se dice que tras la caída de [GetScriptedCharacterByHistoryID('790368').GetFirstName] durante la Segunda Guerra Baali, el propio Namtaru dejó una impronta en su alma que se alimentó de su odio hacia los Baali que traicionaron a su [Glossary('Sire','game_concept_Sire_desc')].\nMucho tiempo después, resurgió brevemente en Cartago para vincular a Troile y Moloch antes de salar la tierra. Supuestamente, regresó a las ruinas de Knossos, pero hemos encontrado pruebas que indican que llegó a Jerusalén y que podría ser ahora la bestia del foso.\n\nHueve que hay anomalías en su relato. Algunos dicen que era una Malkavian y la líder de un culto. Otros se centran en su $pod_Embrace$ de [GetScriptedCharacterByHistoryID('790217').GetFirstName], madre de Alejandro Magno, o de [GetScriptedCharacterByHistoryID('791970').GetFirstName], autor del [GetGlobalVariable('dreams_angra_link').Artifact.GetName], aunque estas genealogías a veces se atribuyen a otros."
 POD_jerusalem.4.a: "Solo son rumores. Que comience la caza." #skip POD_jerusalem.5 to 6
 POD_jerusalem.4.b: "Hay más en esta historia." #trigger POD_jerusalem.5 if javaniel stuff

 POD_jerusalem.5.t: "La Caza: La historia completa"
 POD_jerusalem.5.desc: "Tras mucho trabajo, hemos combinado la historia de [GetScriptedCharacterByHistoryID('790147').GetFirstName] con ciertos artefactos que obran en nuestro poder.\n\nParece que el [Glossary('Antediluviano','game_concept_antediluvian_desc')] Malakai ha sido borrado de la mayoría de los registros cainitas. Sin embargo, hemos reconstruido parte de lo ocurrido. Como su hermano Set, Malakai aspiraba a ser un dios entre los hombres. Como su hermano Malkav, Malakai se vio atormentada por visiones del futuro, obsesionada por la imagen de Caín, investido por el mismo Dios para juzgar a los Malditos.\n\nFue cerca de ese momento cuando Saulot creó un $pod_clan$ capaz de elevarlo primero a la divinidad, de conceder el mando sobre el siguiente giro de la Rueda y de resistir el juicio venidero de Caín. En un intento, mató a cientos de un solo golpe y lo utilizó para invocar a un «Hijo de la Oscuridad Exterior» (¿un demonio poderoso?). Cuando el sacrificio concluyó, el primero de los que llegarían a ser conocidos como los Baali salió arrastrándose del pozo. ¿Fue el pozo que investigamos ahora? Es difícil decirlo, pues algunos textos lo sitúan en un lugar llamado Corazín.\n\nMuchos acontecimientos siguieron a este: Saulot permitió que Tremere lo diablerizara para crear otro $pod_clan$ al servicio de su objetivo último; Malkav (al parecer) dejó que sus Chiquillos lo diablerizaran tras un encuentro casi mortal con otro [Glossary('Antediluviano','game_concept_antediluvian_desc')], y ahora usa a todos sus descendientes, mediante fragmentos de sí mismo incrustados en ellos, para avanzar en su propia búsqueda de ascensión o iluminación; y la propia Malakai cayó en $pod_torpor$ bajo las ruinas de Ketef Hinnom.\nOtra versión sostiene que quien está aquí es, en cambio, Malkav, o al menos los restos sangrientos de su forma corpórea largo tiempo perdida.\n\nProcedan de Malkav o de Malakai, los sueños de estas poderosas entidades siguen afectando claramente a la región circundante, empujando a quienes se tambalean al borde de cualquier cosa, desde la locura hasta el asesinato, a arrebatos abrumadores de manía y sed de sangre."
 POD_jerusalem.5.a: "Oremos para sentir solo sus Sueños y no sus manos."  #TODO: may be too long

 POD_jerusalem.6.t: "La Caza: La gran inmersión"
 POD_jerusalem.6.desc: "Tras todos nuestros preparativos, nos encontramos reunidos ante las ruinas de Ketef Hinnom. Todo lo que queda es avanzar y sumergirnos en este gran foso de maldad. Pero, ¿deberíamos dar media vuelta? ¿Está esta búsqueda más allá de nuestras capacidades? ¿Podríamos hacer más bien permaneciendo con vida y continuando con nuestros esfuerzos habituales?"
 POD_jerusalem.6.a: "Que nuestra fe nos guíe."
 POD_jerusalem.6.b: "Esto fue una locura desde el principio." #terminates the hunt here & now, allowing you to restart later; remove supehunter_purify_jerusalem_pit_begun flag

 POD_jerusalem.7.t: "La Caza: Las grandes fauces"
 POD_jerusalem.7.desc: "El mero acto de alcanzar la entrada del foso es una gran prueba para nuestras habilidades. Las catacumbas en las que descansa se extienden como un laberinto a través del valle e incluso bajo la Ciudad Santa. Peor aún, el simple hecho de contemplar las fauces del foso abrasa la carne y el espíritu de nuestros hermanos. Sus lágrimas y lamentos resuenan en nuestras mentes mientras sus cuerpos semivivos se retuercen de agonía en el suelo.\n\nMentes abrumadas por imágenes de un futuro horroroso. Innumerables hombres y mujeres se postran ante grandes estatuas doradas. Pirámides invertidas hechas de hierro y piedra negra se hunden en las profundidades de la Tierra. De forma ostentosa, dentro de ellas hay altares de sacrificio donde cautivos que lloran son cortados lentamente hasta la muerte durante semanas agónicas con cuchillos serrados de obsidiana.\n\nFábricas hechas de carne mutilada y metal, impulsadas por forjas de azufre, producen armas interminables para alimentar los mecanismos del habitante del foso. Nos vemos a nosotros mismos, retorcidos y marcados por el mal, liderando los ejércitos de los Condenados."
 POD_jerusalem.7.a: "Debemos... seguir... adelante..."  #diplomacy check, boost chances if True Faith/Beatific or Pilgrim exp. or Zealous, lowers chance if Cynical or Lunatic/Possessed
 POD_jerusalem.7.effect.success.desc: "Nuestra voluntad es indomable"
 POD_jerusalem.7.critical.failure.effect.desc: "Nuestra carne y nuestras mentes quedan desgarradas"
 POD_jerusalem.7.critical.failure: "Perdidos ante el dolor"

 POD_jerusalem.8.t: "La Caza: La sala de espera"
 POD_jerusalem.8.desc: "A medida que descendemos por las escaleras y perdemos de vista la superficie, nos asaltan inmediatamente visiones enloquecedoras que prometen desde gloria hasta conocimiento e inmortalidad. Finalmente, las escaleras se abren en una red de cuevas similar a un laberinto que serpentea y gira de una manera que nuestros mejores cartógrafos apenas pueden mapear. Senderos interminables y habitaciones llenas de muebles que cambian cada vez que regresas a la estancia. ¿Es la misma habitación? Cuando caminamos en línea recta, de algún modo regresamos a un punto donde marcamos la pared.\n\nPero, no habíamos marcado una pared con musgo, ¿verdad? Cuando doblamos una esquina, nos encontramos en un pasillo que comparte el espacio con otro pasillo y que, sin embargo, va en una dirección diferente, ¿o es que siempre hemos ido en esta dirección?\n\nLas visiones no cesan, y no contamos con la ayuda de los habitantes locales que vagan sin rumbo, buscando eternamente el camino hacia las profundidades donde podrán recibir sus recompensas prometidas. No podemos permanecer aquí mucho más tiempo o acabaremos como ellos, desperdiciando los sacrificios ya realizados."
 POD_jerusalem.8.a: "¿Deberíamos ir a la izquierda o a la derecha?"  #stewardship check, boost chances if Traveler exp., boost chances if True Faith/Beatific
 POD_jerusalem.8.effect.success.desc: "Ningún laberinto puede detenernos"
 POD_jerusalem.8.critical.failure.effect.desc: "Fractales de muebles, cascadas de alfombras"  #nod to youtu.be/n6gGE9kxe1M
 POD_jerusalem.8.critical.failure: "Retorcidos en senderos infinitos"

 POD_jerusalem.9.t: "La Caza: Tormentas interminables"
 POD_jerusalem.9.desc: "Mientras descendemos las escaleras hacia el siguiente nivel, las visiones y promesas cambian para tentarnos con nuestros deseos más carnales y lujuriosos. Estas visiones son tan distractoras que, cuando ponemos un pie en el suelo, somos arrastrados casi de inmediato por los poderosos vientos y tormentas que asolan la zona. No podemos ser vencidos por meras ráfagas. No podemos unirnos a las filas de estas almas inquietas y eternamente azotadas."
 POD_jerusalem.9.a: "Mantente firme ante la tormenta."  #Prowess check, lowers chance if Lustful, boost chances if Chaste, boost chances if True Faith/Beatific
 POD_jerusalem.9.effect.success.desc: "Ninguna simple brisa puede detener a lo sagrado"
 POD_jerusalem.9.critical.failure.effect.desc: "Ya no estamos en Jerusalén, Tutyahu"
 POD_jerusalem.9.critical.failure: "Más allá del arcoíris"

 POD_jerusalem.10.t: "La Caza: Corazón de hielo"
 POD_jerusalem.10.desc: "Una vez más, las escaleras nos llevan más profundo en la Tierra. Una vez más, las visiones cambian. Una lluvia infecta cae sin cesar, empapándolo todo con su lodo helado. Mientras atravesamos este nuevo disco, las almas perdidas se revuelcan como gusanos ciegos y sordos, retorciéndose en un limo pútrido que cubre cada superficie. Claman por muchísimas cosas, desde comida hasta bebida, desde drogas hasta placer; por todas las cosas que adictan a las almas de los hombres.\n\nAnte la puerta del siguiente nivel se encuentra una bestia voraz, que se asemeja tanto a un lobo rabioso como a los grandes Wyrm de los mitos. Si queremos continuar, debemos engañar a aquello que no puede ser derrotado en batalla."
 POD_jerusalem.10.a: "Quizá podamos aprovechar su apetito."  #Intrigue check, lowers chance if Eager Reveler exp. or Gluttonous, boost chances if Temperate, boost chances if True Faith/Beatific
 POD_jerusalem.10.effect.success.desc: "Una boca llena de lodo no puede comernos"
 POD_jerusalem.10.critical.failure.effect.desc: "Vaya, qué dientes tan grandes tienes"
 POD_jerusalem.10.critical.failure: "La mordida del perro y el bocado del gusano"
 
 POD_jerusalem.11.t: "La Caza: El gran ascenso"
 POD_jerusalem.11.desc: "Al salir de las escaleras, nos damos cuenta de que avanzar requerirá un enfoque diferente. En lugar de bajar hacia el centro, hemos emergido en el centro y debemos subir hacia las escaleras incrustadas en las paredes laterales. Tanto los avaros como los tacaños, el acumulador y el pródigo, empujan eternamente grandes sacos de monedas por estos escarpados acantilados. Al oponerse a ellos, surge una inundación de oro fundido que fluye perpetuamente por los costados en ríos interminables de hermosa muerte.\n\nSería tan fácil dejarse llevar por las visiones y el paisaje de este nivel; solo tendríamos que reducir un poco el ritmo."
 POD_jerusalem.11.a: "Marchad hacia adelante y no miréis atrás."  #stewardship check, lowers chance if Greedy or Callous or Avaricious, boost chances if Generous or Compassionate or Improvident, boost chances if True Faith/Beatific
 POD_jerusalem.11.effect.success.desc: "¡Por fin, las escaleras!"
 POD_jerusalem.11.critical.failure.effect.desc: "Todo lo que brilla es oro fundido, derritiendo tu carne"
 POD_jerusalem.11.critical.failure: "Tocado por Midas"
 
 POD_jerusalem.12.t: "La Caza: La ciudad de los Condenados"
 POD_jerusalem.12.desc: "Al dejar la escalera, nos encontramos con un gran pantano y un río que conduce hacia lo más profundo. En las afueras, vemos a algunos seres miserables arañándose unos a otros como bestias salvajes mientras luchan por mantenerse a flote, mientras otros bajo las olas nos miran con gran odio en sus ojos.\n\nSiguiendo el río, vemos una ciudad negra cuyas murallas se extienden hacia el cielo. Cientos de formas que gimen claman desde las cruces invertidas que rodean la ciudad. Columnas de humo emanan de forjas ocultas, e imitaciones retorcidas de nuestros lugares sagrados nos miran con burla. Todo nos recuerda a nuestras visiones cuando estuvimos ante las fauces del foso.\n\nEsta es nuestra primera vez encontrando seres inteligentes y conscientes en este foso olvidado, y bloquean nuestro camino hacia las escaleras que bajan más, diciendo que no somos lo suficientemente devotos de su dios oscuro. Si queremos avanzar sin unirnos a aquello que despreciamos, tendremos que abrirnos paso luchando sin ceder ante los impulsos oscuros que este lugar despierta."
 POD_jerusalem.12.a: "Ataca rápido y busca las escaleras."  #martial check, lowers chance if Wrathful or Impatient or Aggressive Attacker or Reckless, boost chances if Patient or Calm or Holy Warrior or Cautious Leader or Blademaster exp, boost chances if True Faith/Beatific
 POD_jerusalem.12.effect.success.desc: "Nada detiene a los fieles"
 POD_jerusalem.12.critical.failure.effect.desc: "¡¿Hay matacangos?!"
 POD_jerusalem.12.critical.failure: "Todos caen ante las Puertas Oscuras"
 POD_jerusalem.12.b: "¡Estamos aquí para jurar lealtad a tu Dios Oscuro!"

 POD_jerusalem.13.t: "La Cacería: Lago de Fuego"
 POD_jerusalem.13.desc: "En las orillas asfixiadas por el aceite y con olor a azufre de este gran Lago de Fuego, hay peregrinos meditando y cantando, junto a demonios que han sido vinculados por el señor del foso. En sus abominables templos, cometen actos innombrables y buscan visiones del futuro para conocer la voluntad de su señor.\n\nAlgunos se deleitan en el dolor mientras permiten que el fuego del lago los consuma. Si sobreviven gracias a su fuerza de voluntad y a una devoción brutal, estos llamados Bautizados surgen como esqueletos ennegrecidos cuyas ojos reflejan las llamas que soportaron. Poseen una fuerza mayor que la de cualquier otro, salvo los Cainitas más fuertes, y sirven como sacerdotes de su nuevo señor.\n\nAfortunadamente, a los recién Bautizados solo les importa regresar a la ciudad que se encuentra sobre nosotros. Con algo de sigilo y alguna bendición divina, quizá podamos escabullirnos hasta las escaleras sin que el fuego nos queme."
 POD_jerusalem.13.a: "¡Escóndete tras esa roca!"  #Intrigue check, lowers chance if Cynical, boost chances if Zealous or Holy Warrior or Theologian, boost chances if True Faith/Beatific
 POD_jerusalem.13.effect.success.desc: "Nadie espera a la Inquisición de las Sombras... ni a nosotros"
 POD_jerusalem.13.critical.failure.effect.desc: "Nos obligan a retroceder hacia el Lago de Fuego hasta que no quede nadie"
 POD_jerusalem.13.critical.failure: "Emboscada y Azufre"

 POD_jerusalem.14.t: "La Cacería: Una pesadilla de tres anillos"
 POD_jerusalem.14.desc: "No solo evadimos a los Bautizados, sino también a sacerdotes con cabezas de toro que portan los símbolos de civilizaciones desaparecidas hace mucho tiempo: minoica, babilónica, kartveliana, maykop y otras cuyos nombres se han perdido en las brumas del tiempo. Solo con ayuda divina logramos alcanzar las escaleras al siguiente nivel y continuar nuestro descenso.\n\nA diferencia de los niveles anteriores, descubrimos que este se divide en tres anillos. El primero es el Mar Sangriento, que sacia la sed de los habitantes del foso, nacido de la sangre derramada por la humanidad. El segundo es el Bosque de los Lamentos, cuya madera alimenta las forjas del foso y cuyos árboles están hechos de seres transfigurados que desecharon sus propios cuerpos pero que aun así no cumplieron las expectativas del señor del foso. El tercero son las Arenas Ardientes, un desierto constantemente abrasado por las escamas de fuego que caen desde el techo del nivel anterior.\n\nQuizá cuestionando a aquellas almas atrapadas en los árboles podamos localizar las escaleras que conducen más abajo."
 POD_jerusalem.14.a: "Dónde está el «Abrazador de Árboles» cuando se le necesita."  #diplomacy check, lowers chance if Murderer or Kinslayer or Torturer or Reaver or Sadistic, boost chances if Just or Forgiving or Calm, boost chances if True Faith/Beatific
 POD_jerusalem.14.effect.success.desc: "Las hojas susurran nuestra respuesta"
 POD_jerusalem.14.critical.failure.effect.desc: "Esos malditos árboles nos han traicionado"
 POD_jerusalem.14.critical.failure: "¡Sorpresa!"

 POD_jerusalem.15.t: "La Cacería: Todo el mundo es un escenario"
 POD_jerusalem.15.desc: "A medida que nos acercamos al fondo de este paisaje infernal, seguimos asombrados y horrorizados por lo que presenciamos. Todo este nivel se asemeja a un anfiteatro masivo donde las almas perdidas cuentan eternamente los relatos de cada vez que sembraron la discordia, cometieron fraude, extraviaron a otros, sedujeron, halagaron, engañaron, mintieron y robaron. Los siervos del verdadero señor del foso recorren los pasillos de asientos, el escenario y el camerino, lanzando sus magias malignas y potentes ritos. Mientras que otros usaban la fuerza bruta, estos seres despreciables canalizan el poder de su señor a través de los restos de sus cuerpos, lo que les otorga el poder de deformar el mundo a imagen retorcida de su señor mediante la creencia y la Fuerza de Voluntad.\n\nSobre todo ello cuelga un vacío sin estrellas, un facsímil desconcertante del cielo moldeado por nuestro Señor divino. La única fuente de luz en ese vacío es un círculo similar a la luna, que ilumina el mundo extendido debajo de él con su brillo rojo.\n\nFinalmente, vemos las señales que indican la presencia de una escalera cercana. Custodiando las escaleras hay un ejército de gigantes que van desde los 2,5 hasta los 13 metros de altura, poderosos en fuerza y capaces de aplastarnos como hormigas. Bloquean cada camino hacia adelante, así que no nos queda otra opción que luchar."
 POD_jerusalem.15.a: "El único camino es seguir adelante."  #martial check, lowers chance if Arbitrary, boost chances if Just, boost chances if True Faith/Beatific
 POD_jerusalem.15.effect.success.desc: "Incluso las hormigas pueden derrotar a un escorpión"
 POD_jerusalem.15.critical.failure.effect.desc: "Un final desastroso para un gran héroe"
 POD_jerusalem.15.critical.failure: "¡SPLASH!"

 POD_jerusalem.16.t: "La Cacería: Una buena defensa es una buena ofensiva"
 POD_jerusalem.16.desc: "Ante ti se extiende un mar interminable de hielo congelado. Todos los que alguna vez han traicionado al señor del foso han sido enterrados en este paisaje, obligados a contemplar eternamente a aquel al que traicionaron.\n\nA medida que avanzamos, el área se reforma y se reconstruye constantemente para adaptarse a los sueños oscuros que emanan de lo más profundo. Nos abrimos paso a través de un vórtice mucho más fuerte y letal de lo que enfrentamos en el segundo nivel. En un momento luchamos contra hordas de cadáveres y al siguiente, extraños hombres de relojería con humo negro saliendo de sus espaldas intentan matarnos. Gigantes, esqueletos carbonizados, cultistas que cantan sin cesar e incluso demonios menores atraídos por el Sueño se yerguen contra nosotros.\n\nLas montañas surgen de llanuras antes de colapsar rápidamente de nuevo en un paisaje virgen. Los ríos tallan la roca antes de secarse y ser rellenados. El sol falso en el cielo sobre nosotros cambia de color, pasando del rojo al azul como un arco iris distorsionado de su verdadero significado de fidelidad divina a una imagen de desprecio."
 POD_jerusalem.16.a: "¡Que empiece la lucha!"  #Uncapped prowess check, lowers chance if Craven or Arrogant or Deceitful, boost chances if Brave or Humble or Honest, boost chances if True Faith/Beatific
 POD_jerusalem.16.effect.success.desc: "El final está a la vista"
 POD_jerusalem.16.critical.failure.effect.desc: "Fallar ahora, de todas las ocasiones posibles"
 POD_jerusalem.16.critical.failure: "¡Nooooo!"

 POD_jerusalem.17.t: "La Cacería: Prueba final"
 POD_jerusalem.17.desc: "Después de todas esas batallas, todos esos esfuerzos, todas esas muertes, finalmente estamos ante el Señor del Foso, la bestia cuyos sueños remodelan la realidad a su alrededor, el monstruo que ha tentado a tantas almas aquí abajo con promesas incumplidas. Como suele ocurrir, el mal que sabemos que está presente se esconde tras el rostro banal de una persona común. La única pista de su verdadera naturaleza es el contorno de tinta alrededor de ella que ven aquellos bendecidos por lo divino, indicando que una parte de su mente está atrapada en otro reino.\n\nCuando te acercas para destruirla permanentemente con fuego sagrado, te quedas paralizado, con la antorcha extendida. Tu mente y las mentes de tus compañeros restantes se ven abrumadas por una visión.\n\nLa mujer ante nosotros desarrolla un halo oscuro mientras nos rodeamos a su alrededor, guiando a sus ejércitos desde lejos y manipulando a todos en la zona, incluyéndonos a nosotros. Ofrece inmortalidad y un poder que solo los Matusalén Cainitas más antiguos pueden igualar. Todo lo que pide a cambio es nuestra adoración."
 POD_jerusalem.17.a: "Resiste... debo resistir."  #diplomacy check, lowers chance if Obfuscate or Obtenebration or Infernalist or Demonology or Daimonion, boost chances if Holy Arts, boost chances if True Faith/Beatific
 POD_jerusalem.17.b: "Un precio tan pequeño para un premio tan grande."
 POD_jerusalem.17.effect.success.desc: "¡MUERE, BESTIA INMUNDA!"
 POD_jerusalem.17.critical.failure.effect.desc: "«Hay un precio por la arrogancia, joven»"
 POD_jerusalem.17.critical.failure: "Tan cerca y, sin embargo, tan lejos"

 POD_jerusalem.18.t: "La Cacería: ¡Victoria!"
 POD_jerusalem.18.desc: "Reconocemos las visiones como las mentiras que son y las rechazamos. Nada nos impedirá limpiar el mundo de este horrible mal. Lanzas la antorcha bendita y los restos de tu grupo invocan sus bendiciones divinas para fortalecer el calor de esas llamas purificadoras. Al revelarse que estaba aletargada, su cuerpo se incendia. Mientras se desmorona en cenizas, el vórtice de sueños a nuestro alrededor se vuelve cada vez más caótico, una hazaña que nunca habríamos imaginado posible.\n\nPasado un tiempo, los sueños amainan y solo queda la realidad. Una vez más, estamos en las ruinas de Ketef Hinnom, donde antes intentamos entrar en las fauces del foso. Donde antes estaba el foso, hay un círculo dorado que brilla con felicidad divina ante nuestro éxito, y himnos resuenan con el viento desde una fuente imperceptible.\n\nDe vuelta en nuestro reino, hay historias de vampiros enloquecidos por gritos en sus mentes que les ordenan exterminarnos. Sin embargo, ese es un problema para otro momento y otra Generación. Por ahora, celebremos nuestro gran logro que alguna vez se consideró imposible."
 POD_jerusalem.18.a: "¡Alabado sea el Señor por nuestro gran éxito!"
 
 POD_jerusalem.20.t: "La Cacería: Un regalo"
 POD_jerusalem.20.desc: "Al aceptar su Abrazo, la Maestra te introduce en el vórtice de sus sueños. Te has demostrado a ti mismo al alcanzarla a pesar de todas las pruebas. Como recompensa, te acepta como su hijo y te encomienda la tarea de cumplir su gran visión.\n\nSueña con un mundo que volverá a recorrer. Sueña con un mundo donde se le adore como al dios que es. Sueña con un mundo en paz, el tipo de paz que solo una hoja puede traer.\n\nCon su Sueño guiándote, no puedes fallar."
#POD_jerusalem.19.a: "Much work remains."  #become a 4th gen Vampire of the Eyes of Malakai faith; Auspex, Dementation, Daimonion, Presence, Obfuscate, Dark Thaumaturgy
 fervor_new_prophet_malakai: "La Maestra ha nombrado a un nuevo profeta"

 POD_jerusalem.19.t: "La Caza: Una bendición"
 POD_jerusalem.19.desc: "Quizá se deba a todo aquello por lo que hemos luchado, pero nunca antes nos habíamos sentido tan atraídos por las promesas de la oscuridad. Cuando los guardias nos desafían, nos arrodillamos y proclamamos nuestra lealtad a su Dios Oscuro. Aunque se muestran escépticos, deciden escoltarnos hasta el gran templo de la ciudad. Ante su sumo sacerdote, juramos lealtad al dios oscuro.\n\nMientras las palabras caen de nuestros labios, podemos sentir una extraña esencia deslizarse entre ellos. Sabe a hierro mientras se desliza por nuestra garganta y se filtra en nuestros huesos. Un hormigueo se extiende por nuestros cuerpos, seguido de un dolor... un dolor inimaginable. Mirando primero a la izquierda y luego a la derecha, ves los cuerpos de tus camaradas transformarse y deformarse en algo que alguna vez habrías llamado una Abominación.\n\nDespiertas en la superficie, al pie de las grandes fauces del foso. Una voz susurra en tu mente: «Ve y trae la paz con el filo de tu espada»."
 POD_jerusalem.19.a: "Queda mucho trabajo por hacer."  #entire coterie becomes a revenant of the Eyes of Malakai faith; Auspex, Dementation, Daimonion

 building_pit_of_malkav_04: "Foso Santificado de Ketef Hinnom"
 building_pit_of_malkav_04_desc: "Donde antes había voces de locura, ahora hay himnos que susurran en los vientos. Donde antes la locura se derramaba sobre esta tierra santa, ahora fluyen bendiciones y sabiduría. Donde antes una bestia maligna asolaba las mentes de todos los que la rodeaban, ahora surgen plegarias desde la tierra. Donde antes unas fauces voraces consumían a los incautos y a los pecadores, ahora los fieles peregrinan al gran templo construido sobre lo que antaño fue profano."
 POD_requirements_purified_pit_malkav: "El [holder|E] debe seguir una fe [GetReligionByKey('hunters_religion').GetAdjective], ser un [GetTrait('supehunter').GetName( GetPlayer )] y haber purificado el Foso mediante la [decision|E]."




 malkavian_search_for_sister_decision: "Buscar a su/nuestra/mi Hermana"
 malkavian_search_for_sister_decision_desc: "Todos los Malkavian lo saben, ya sea por experiencia personal o por rumores. Al entrar en Jerusalén, todos los Malkavian sienten el mandato emanando a través de la Red de la Locura. Muchas voces, una sola voz, tu propia voz; todas repiten «Hermana... recupera a la Hermana». Si encuentras una pista y te sumerges en la Red de la Locura para entregarla, sabrás que habrá gratitud."
 malkavian_search_for_sister_decision_confirm: "Que comience la búsqueda"
 malkavian_search_for_sister_decision_tooltip: "Buscar pistas sobre la ubicación de la Hermana"
 malkavian_search_for_sister_decision_effect: "Puede que encuentres lo que buscas, pero es muy probable que solo encuentres más locura"
 
 madness_network_malakai_modifier: "Red de la Locura - Recompensa"
 madness_network_malakai_modifier_desc: "Algo en la Red de la Locura está complacido con tu éxito al encontrar pistas hacia SU ubicación"

 POD_jerusalem.21.t: "Buscar a su/nuestra/mi Hermana: Atrapado"
 POD_jerusalem.21.desc: "En tu búsqueda de ELLA, introduces tu mente en la Red de la Locura, buscando algún signo de su presencia. A medida que tu mente se expande, sientes algo parecido a una sensación de succión mientras caes presa de un... ¿remolino?\n\nCuando recuperas la capacidad de percibir, te das cuenta de que la zona está siendo constantemente remodelada y reformada. Las montañas surgen de llanuras planas antes de colapsar rápidamente de nuevo en un paisaje virgen. Los ríos tallan la roca antes de secarse y ser rellenados. El sol falso en el cielo sobre nosotros cambia de color, pasando del rojo al azul como un arco iris retorcido de su verdadero significado como símbolo de fidelidad divina a una imagen de desprecio.\n\n¿Qué es esto? ¿Por qué no puedes escapar? ¿Por qué no puedo escapar?"
 POD_jerusalem.21.a: "¡¿Por qué no puedo escapar?!"

 POD_jerusalem.22.t: "Buscar a su/nuestra/mi Hermana: Tensión Mental"
 POD_jerusalem.22.desc: "En tu búsqueda de ELLA, introduces tu mente en la Red de la Locura, buscando algún signo de su presencia. Pasas minutos, horas, días buscando cualquier indicio de ELLA. Para cuando finalmente logras salir, tu mente está agotada y te cuesta mantenerte en pie."
 POD_jerusalem.22.a: "Necesito tiempo para recuperarme."

 POD_jerusalem.23.t: "Buscar a su/nuestra/mi Hermana: Polizón"
 POD_jerusalem.23.desc: "En tu búsqueda de ELLA, introduces tu mente en la Red de la Locura, buscando algún signo de su presencia. Pasas minutos, horas, días buscando cualquier indicio de ELLA.\n\nFinalmente, logras salir, lamentablemente sin éxito alguno. Mientras retomas tus actividades habituales de gobernar un país, sientes una presencia extraña que te hace cosquillas en la parte posterior de la mente. Parece estar empujándote en direcciones inusuales y ajenas."
 POD_jerusalem.23.a: "Bueno, esto podría ser un problema."

 POD_jerusalem.24.t: "Buscar a su/nuestra/mi Hermana: Reacción"
 POD_jerusalem.24.desc: "En tu búsqueda de ELLA, introduces tu mente en la Red de la Locura, buscando algún signo de su presencia. Pasas minutos, horas buscando cualquier indicio de ELLA. Puedes sentir algo, justo en el límite de tu percepción. Entonces, con un estallido repentino, tu mente es lanzada por la fuerza de vuelta a tu cuerpo. Puedes sentir la reacción forzando su camino desde tu mente, bajando por tu columna y llegando a cada rincón de tu cuerpo."
 POD_jerusalem.24.a: "Menudo impacto."

 POD_jerusalem.25.t: "Buscar a su/nuestra/mi Hermana: Indicios"
 POD_jerusalem.25.desc: "En tu búsqueda de ELLA, introduces tu mente en la Red de la Locura, buscando algún signo de su presencia. Pasas minutos, horas buscando cualquier indicio de ELLA. Puedes sentir algo, justo en el límite de tu percepción. Entonces... ¡lo tienes! Has encontrado un indicio hacia su ubicación. No es mucho, pero percibes una sensación de gratitud fluyendo a través de la Red de la Locura."
 POD_jerusalem.25.a: "Algo es mejor que nada."

 POD_jerusalem.26.t: "Buscar a su/nuestra/mi Hermana: Una pista"
 POD_jerusalem.26.desc: "En tu búsqueda de ELLA, introduces tu mente en la Red de la Locura, buscando algún signo de su presencia. Pasas minutos, horas buscando cualquier indicio de ELLA. ¡LO TIENES! No es un mero indicio, sino una verdadera pista que señala su ubicación y proporciona orientación para liberarla de su Sueño.\n\nTe sumerges en la Red de la Locura y entregas esta pista. Puedes sentir la gratitud emanando a través de la red y llenándote de nuevas revelaciones, concedidas por una entidad que te resulta familiar pero es desconocida."
 POD_jerusalem.26.a: "Bueno... esto es nuevo."




 malakaite_mistress_boon_decision: "El Don de Malakai"
 malakaite_mistress_boon_decision_desc: "Mientras luchamos por cumplir el Sueño de la Maestra, a veces encontramos dificultades de índole marcial. Quizá la Maestra nos conceda un don para ayudar en nuestros esfuerzos."
 malakaite_mistress_boon_decision_confirm: "Espero que la Mistress sea generosa"
 malakaite_mistress_boon_decision_tooltip: "Espero que la Mistress sea generosa"
 malakaite_mistress_boon_decision_effect: "Quizá la Maestra nos conceda un don"
 malakaite_mistress_boon_decision_toast_success: "La Maestra es generosa"
 malakaite_mistress_boon_decision_toast_fail: "Debemos ganarnos nuestro don"




 vamp_lower_gen_jerusalem_decision: "Fuentes de carmesí brillante"
 vamp_lower_gen_jerusalem_decision_desc: "Ocultos en las profundidades de Jerusalén y entre sus antiguas alcantarillas, existen relatos de ríos de sangre que fluyen desde fuentes ocultas. Con esta sangre, podríamos acercarnos al primer vampiro, reduciendo nuestra Generación y aumentando enormemente nuestro poder. Si lográramos contactar con los Nosferatu o los Baali locales, podrían guiarnos hacia lo que buscamos, siempre que los #italic alentemos#!.\n\nSin embargo, debemos tener en cuenta que un premio de tal magnitud probablemente venga acompañado de un gran precio, por lo que debemos estar preparados."
 vamp_lower_gen_jerusalem_decision_confirm: "Que comience la caza"
 vamp_lower_gen_jerusalem_decision_tooltip: "Quizá deberíamos encontrar nuestra propia agua bendita en esta llamada Tierra Santa"
 vamp_lower_gen_jerusalem_decision_effect: "Reducirás tu [Glossary('Generación','game_concept_vampgeneration_desc')] en 1, pero las #beast secuelas de la Bestia#! podrían no ser agradables."
 vamp_lower_gen_jerusalem_decision_generation_requirement: "Debes ser de quinta [Glossary('Generación','game_concept_vampgeneration_desc')] o superior"

 POD_jerusalem.27.t: "Contactando con los lugareños"
 POD_jerusalem.27.desc: "Si pretendes encontrar tales maravillas ocultas, necesitarás ayudantes locales que despejen el camino de obstáculos y te guíen hasta allí. Hay dos opciones evidentes para seguir adelante: los Nosferatu y los Baali.\n\nNadie conoce las alcantarillas, las catacumbas y los rincones más oscuros de ninguna ciudad mejor que los Nosferatu, y mucho menos las trampas que puedan acechar en ellos. Teniendo en cuenta su predilección por la religión y la importancia de Jerusalén, tienen una presencia sustancial en la ciudad. Con algo de esfuerzo, podrías #italic alentarlos#! a ayudarnos, ya sea mediante el engaño o la tortura.\n\nAlternativamente, podrías acercarte a los Baali. Por alguna razón, algunos de sus neonatos se han hecho a la idea de que esos ríos de sangre indican la presencia de uno de sus «Durmientes» o del mismísimo Malkavian. Si lo desearas, podrías prometer ayuda, usarlos para abrirte paso entre trampas o dificultades y luego traicionarlos tras encontrar lo que buscas. Después de todo, tal poder no es algo que deba compartirse, especialmente con gente como ellos."
 POD_jerusalem.27.a: "Contactar con los Nosferatu." #intrigue duel, boost if Nosferatu or road of heaven religion or Torturer, hurt if Ventrue or Toreador
 POD_jerusalem.27.a.success: "Tanto para su astucia"
 POD_jerusalem.27.a.critical.failure: "No puedes ser más astuto que el astuto"
 POD_jerusalem.27.b: "Contactar con los Baali." #prowess duel, boost if Baali or sinner religion or Strategist, hurt if Salubri or Banu Haqim
 POD_jerusalem.27.b.success: "Tanto para su fuerza"
 POD_jerusalem.27.b.critical.failure: "Ahora sé que mi fuerza es ligeramente inferior a 10 Baali"
 POD_jerusalem.27.c: "Pensándolo mejor..."

 POD_jerusalem.28.t: "Ayuda de los Nosferatu"
 POD_jerusalem.28.desc: "¡Lo has logrado! A pesar de su reputación de astucia, lograste engañar a ciertos Nosferatu particularmente informados para que se reunieran contigo. Para su sorpresa, era una trampa y los capturaste. Una vez en tus mazmorras, solo fueron necesarios unos pocos días para extraer la información que necesitabas. Con esa información, trazaste un mapa anotado con cada trampa y te abriste paso por los túneles.\n\nOyes el sonido de agua rugiente a lo lejos y la sigues hasta un río impuro, contaminado con sangre coagulada y que parece fluir hacia el Mar Muerto. Por instinto, haces que un insignificante siervo beba del río, lo que te salva de la aparente toxicidad y del Rötschreck. No te rindes y sigues explorando hasta que encuentras limo viejo y seco, como si un río hubiera desbordado sus márgenes alguna vez y cubierto el suelo aquí. Entre el limo, encuentras una sola gota de sangre pura e impoluta. Al tragarla, puedes sentir el poder recorriendo tus venas. ¡Al experimentar con tus nuevas habilidades, descubres que los rumores eran ciertos! ¡Toda la evidencia indica que has descendido una [Glossary('Generación','game_concept_vampgeneration_desc')] entera!"
 POD_jerusalem.28.a: "¡El éxito es dulce!"

 POD_jerusalem.29.t: "Ayuda de los Baali"
 POD_jerusalem.29.desc: "Mientras tú y tus Compañeros Baali os aventuráis por los túneles, os abres paso entre trampas y emboscadas de los Nosferatu. Algunos Baali mueren, no es gran cosa. Tras muchas horas, oyes el sonido de agua rugiente a lo lejos y la sigues hasta un río impuro, contaminado con sangre coagulada y que parece fluir hacia el Mar Muerto. Por instinto, haces que un insignificante siervo beba del río, lo que te salva de la aparente toxicidad y del Rötschreck. No te rindes y sigues explorando hasta que encuentras limo viejo y seco, como si un río hubiera desbordado sus márgenes alguna vez y cubierto el suelo aquí. Entre el limo, encuentras una sola gota de sangre pura e impoluta.\n\nEn el momento en que se detecta la sangre, te lanzas sobre los Baali y comienzas a despedazarlos. Dada la sorpresa en sus ojos, está claro que te has anticipado a su propia traición. Tales engendros apenas merecen la molestia de ser exterminados.\n\nFinalmente, son eliminados y regresas a la gota de sangre que descansa entre el limo. Al tragarla, puedes sentir el poder recorriendo tus venas. ¡Al experimentar con tus nuevas habilidades, descubres que los rumores eran ciertos! ¡Toda la evidencia demuestra que has descendido una [Glossary('Generación','game_concept_vampgeneration_desc')] entera!"

 POD_jerusalem.30.t: "Signos de un [unconquered_soul|E]"
 POD_jerusalem.30.desc: "Uno de tus siervos ha señalado que últimamente has cambiado algunos de tus hábitos, algo que no ocurre con frecuencia en tu clase. Peor aún, has tomado decisiones extrañas y poco acertadas que han perjudicado tu posición en la política de [GetTrait('vampire').GetName( GetPlayer )], decisiones que no recuerdas. Esto te recuerda los rumores sobre las terribles consecuencias de $pod_diablerie$ y su posible coste para tu propia alma.\n\n¿Podría ser que la sangre del río oculto de Jerusalén escondiera un alma o un fragmento de una? ¿Está intentando defenderse? Un prospecto preocupante, sin duda..."
 #The duel is to determine how much it costs with a tiny chance of becoming a Wight
 #major_stress_gain vs minor_stress_gain, broken_authority_modifier for 15yrs, drained_troops_modifier for 15yrs, add_legitimacy = -450, add_tyranny = 100, add_piety = -500, add_piety_level = -1, add_prestige = -500, POD_masquerade_exposure_increase_multiple_effect = { AMOUNT = 5 }, lunatic, possessed
 POD_jerusalem.30.a: "Algo va muy, muy mal..."
 POD_jerusalem.30.a.success: "Recuperar tu mente"
 POD_jerusalem.30.a.failure: "Recuperar tu mente, a un alto coste"
 POD_jerusalem.30.a.critical.failure: "TODO SE CONVERTIRÁ EN FUENTES CARMESÍ"




 molochite_maintain_the_sleep_decision: "Mantener al Durmiente"
 molochite_maintain_the_sleep_decision_desc: "Hemos descubierto que una criatura antigua y olvidada hace mucho tiempo ha sido encarcelada en un estado de sueño bajo Ketef Hinnom, a las afueras de Jerusalén. Aunque tal entidad no es un Hijo de la Oscuridad Exterior y no representa el mismo peligro, los sueños de este metusalén son lo suficientemente potentes como para retorcer la tierra y causar locura en las mentes cercanas. Tal ser debe mantenerse saciado para evitar que despierte y escape."
 molochite_maintain_the_sleep_decision_confirm: "Alimentar al Durmiente"
 molochite_maintain_the_sleep_decision_tooltip: "Debemos mantener al Durmiente saciado"
 molochite_maintain_the_sleep_decision_effect: "Mientras el Durmiente permanezca dormido, se puede extraer conocimiento de su Sueño"
 molochite_maintain_the_sleep_decision_jerusalem_development_requirement: "El nivel de [development|E] en [GetTitleByKey('c_jerusalem').GetName] disminuirá en 15"

 POD_jerusalem.31.t: "El Poder de los Nombres"
 POD_jerusalem.31.desc: "Tras pasar tanto tiempo extrayendo información del Sueño del Durmiente en Jerusalén, te has familiarizado con lo que cabe esperar y cómo navegar por ellos. No solo esto te ha enseñado más sobre tus $pod_disciplines$, sino que te ha otorgado una comprensión única de los [Glossary('Nombres Verdaderos','podgloss.truename')] más allá de lo que normalmente está disponible para una [GetTrait('demonology').GetName( GetPlayer )]. Tu nuevo conocimiento es muy similar a los poderes utilizados por los Inmortales en África y te permite un nuevo poder para ayudar en tu misión."
 POD_jerusalem.31.a: "Conocer el nombre verdadero es poseer el alma de algo."
 
 dreams_of_the_sleeper_modifier: "Sueños del Durmiente"




 nergalite_wake_the_sleeper_decision: "Despertar al Durmiente"
 nergalite_wake_the_sleeper_decision_desc: "Hemos descubierto que una criatura antigua y olvidada hace mucho tiempo ha sido encarcelada en un estado de sueño bajo Ketef Hinnom, a las afueras de Jerusalén. Aunque tal entidad no es un Hijo de la Oscuridad Exterior y no ofrece el mismo poder, los sueños de este metusalén son lo suficientemente potentes como para retorcer la tierra y causar locura en las mentes cercanas. Tal ser debe ser despertado para que podamos hacer un trato con él y canalizar su poder hacia nuestros propios objetivos."
 nergalite_wake_the_sleeper_decision_confirm: "Alimentar al Durmiente"
 nergalite_wake_the_sleeper_decision_tooltip: "Debemos despertar al Durmiente"
 nergalite_wake_the_sleeper_decision_effect: "A medida que el Durmiente despierte, su gratitud aumentará"
 nergalite_wake_the_sleeper_decision_jerusalem_duchy_development_tt: "Cada [county|E] en el [duchy|E] [de_jure|E] de [GetTitleByKey('c_jerusalem').GetNameNoTier] debe tener más de 5 de [development|E]"
 nergalite_wake_the_sleeper_decision_jerusalem_kingdom_development_tt: "Cada [county|E] en el [kingdom|E] [de_jure|E] de [GetTitleByKey('c_jerusalem').GetNameNoTier] debe tener más de 5 de [development|E]"
 nergalite_wake_the_sleeper_decision_jerusalem_empire_development_tt: "Cada [county|E] del [de_jure|E] [empire|E] de [GetTitleByKey('c_jerusalem').GetNameNoTier] debe tener más de 5 [development|E]"
 nergalite_wake_the_sleeper_decision_jerusalem_development_effect: "El nivel de [development|E] en [GetTitleByKey('c_jerusalem').GetName] disminuirá en 5 y ganará el modificador [GetModifier('extinguish_life_modifier').GetNameWithTooltip] durante 5 años"
 nergalite_wake_the_sleeper_decision_jerusalem_duchy_development_effect: "El nivel de [development|E] de todos los condados del [duchy|E] [de_jure|E] de [GetTitleByKey('c_jerusalem').GetNameNoTier] disminuirá en 5 y ganarán el modificador [GetModifier('extinguish_life_modifier').GetNameWithTooltip] durante 5 años"
 nergalite_wake_the_sleeper_decision_jerusalem_kingdom_development_effect: "El nivel de [development|E] de todos los condados del [kingdom|E] [de_jure|E] de [GetTitleByKey('c_jerusalem').GetNameNoTier] disminuirá en 5 y ganarán el modificador [GetModifier('extinguish_life_modifier').GetNameWithTooltip] durante 10 años"
 nergalite_wake_the_sleeper_decision_jerusalem_empire_development_effect: "El nivel de [development|E] de todos los condados del [empire|E] [de_jure|E] de [GetTitleByKey('c_jerusalem').GetNameNoTier] disminuirá en 5 y ganarán el modificador [GetModifier('extinguish_life_modifier').GetNameWithTooltip] durante 10 años"


 POD_jerusalem.32.t: "¡¡¡Poder ilimitado!!!"  #couldn't help myself
 POD_jerusalem.32.desc: "Has estado alimentando lentamente al Durmiente y persuadiendo a su alma para que se acerque a su cuerpo, permitiéndote canalizar algún fragmento de su poder. Tras suficientes banquetes, hemos atraído toda la atención del Durmiente. Se ha extendido y ha tocado nuestras mentes, recompensando tus esfuerzos al canalizar una fracción de su poder y conocimiento a través de ti. Con este poder, eventualmente podrías alcanzar o superar las alturas de Nergal. Todo lo que queda es aceptar..."
 POD_jerusalem.32.a: "¡Hazlo!"
 POD_jerusalem.32.a.tt: "Ganas acceso al Estilo de vida de Erudición."
 POD_jerusalem.32.a.effect.success.desc: "Este cuerpo tiene un nuevo amo"




 constantinian_channel_religious_fervor_decision: "Canalizar Fervor Religioso"
 constantinian_channel_religious_fervor_decision_desc: "Por razones desconocidas, la región alrededor de Jerusalén está saturada de glamour y fervor religioso. Tras establecer el Catecismo Constantiniano, comprendemos los medios para cosechar el glamour de los fieles. Si se aprovecha adecuadamente con nuestro nuevo conocimiento, la cantidad de fervor de Jerusalén presenta una oportunidad única para asegurar una creencia incesante en ti y, por ende, tu vida eterna."
 constantinian_channel_religious_fervor_decision_confirm: "Es hora de aprovechar el poder de la fe"
 constantinian_channel_religious_fervor_decision_tooltip: "La manía religiosa de Jerusalén presenta una oportunidad única"
 constantinian_channel_religious_fervor_decision_effect: "Ya sea como Grigori, Nephilim o profeta imbuido de poder, me saciaré con la manía religiosa de Jerusalén"
 constantinian_channel_religious_fervor_decision_holy_city_jerusalem_requirement_tooltip: "Debes controlar y convertir la ciudad de [GetTitleByKey('c_jerusalem').GetNameNoTier], ya que es un sitio sagrado clave para las fes abrahámicas y las hadas locales, aumentando tu influencia sobre el glamour local"
 constantinian_channel_religious_fervor_decision_holy_city_antioch_requirement_tooltip: "Debes controlar y convertir la ciudad de [GetTitleByKey('c_antiocheia').GetNameNoTier], ya que es un sitio sagrado clave para las fes abrahámicas y las hadas locales, aumentando tu influencia sobre el glamour local"
 constantinian_channel_religious_fervor_decision_holy_city_acre_requirement_tooltip: "Debes controlar y convertir la ciudad de [GetTitleByKey('c_acre').GetNameNoTier], ya que es un sitio sagrado clave para las fes abrahámicas y las hadas locales, aumentando tu influencia sobre el glamour local"
 constantinian_channel_religious_fervor_decision_holy_city_alexandria_requirement_tooltip: "Debes controlar y convertir la ciudad de [GetTitleByKey('c_alexandria').GetNameNoTier], ya que es un sitio sagrado clave para las fes abrahámicas y las hadas locales, aumentando tu influencia sobre el glamour local"
