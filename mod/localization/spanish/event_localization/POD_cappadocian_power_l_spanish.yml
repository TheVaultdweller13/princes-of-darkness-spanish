 POD_cappadocian_power.2000.title: "Chiquillos estudiosos"
 POD_cappadocian_power.2000.desc: "Llegan noticias de la corte de [recipient.GetNamePossessive]: ¡tu Chiquillo ha tenido un gran éxito! Ha subsanado errores de juicio, suavizado agravios y construido nuevos puentes. \n A [recipient.GetName] le ha complacido mucho el regalo que le hiciste a [recipient.GetHerHim]. [recipient.GetSheHe|U] te ha notificado que tu Chiquillo permanecerá por ahora a [recipient.GetHerHis] lado y que [recipient.GetSheHe] te debe un favor por los servicios prestados."
 
 POD_cappadocian_power.3000.title: "Chiquillos estudiosos"
 POD_cappadocian_power.3000.desc: "Llegan noticias de la corte de [recipient.GetNamePossessive]: ¡tu Chiquillo ha tenido un gran éxito! Ha aumentado los ingresos, eliminado gastos innecesarios y mejorado los lazos con la población. \n A [recipient.GetName] le ha complacido mucho el regalo que le hiciste a [recipient.GetHerHim]. [recipient.GetSheHe|U] te ha notificado que tu Chiquillo permanecerá por ahora a [recipient.GetHerHis] lado y que [recipient.GetSheHe] te debe un favor por los servicios prestados."
 
 POD_cappadocian_power.4000.title: "Chiquillos estudiosos"
 POD_cappadocian_power.4000.desc: "Llegan noticias de la corte de [recipient.GetNamePossessive]: ¡tu Chiquillo ha tenido un gran éxito! Ha adiestrado tropas, construido líneas de suministro y elaborado nuevas estrategias. \n A [recipient.GetName] le ha complacido mucho el regalo que le hiciste a [recipient.GetHerHim]. [recipient.GetSheHe|U] te ha notificado que tu Chiquillo permanecerá por ahora a [recipient.GetHerHis] lado y que [recipient.GetSheHe] te debe un favor por los servicios prestados."
 
 POD_cappadocian_power.5000.title: "Chiquillos estudiosos"
 POD_cappadocian_power.5000.desc: "Llegan noticias de la corte de [recipient.GetNamePossessive]: ¡tu Chiquillo ha tenido un gran éxito! Ha tejido contactos, eliminado posibles filtraciones y adiestrado a agentes clandestinos. \n A [recipient.GetName] le ha complacido mucho el regalo que le hiciste a [recipient.GetHerHim]. [recipient.GetSheHe|U] te ha notificado que tu Chiquillo permanecerá por ahora a [recipient.GetHerHis] lado y que [recipient.GetSheHe] te debe un favor por los servicios prestados."
 
 POD_cappadocian_power.6000.title: "Chiquillos estudiosos"
 POD_cappadocian_power.6000.desc: "Llegan noticias de la corte de [recipient.GetNamePossessive]: ¡tu Chiquillo ha tenido un gran éxito! Ha leído las Escrituras, actuado con virtud y mejorado los lazos con la población. \n A [recipient.GetName] le ha complacido mucho el regalo que le hiciste a [recipient.GetHerHim]. [recipient.GetSheHe|U] te ha notificado que tu Chiquillo permanecerá por ahora a [recipient.GetHerHis] lado y que [recipient.GetSheHe] te debe un favor por los servicios prestados."
 
 POD_cappadocian_power.7000.title: "Chiquillos desastrosos"
 POD_cappadocian_power.7000.desc: "Llegan noticias de la corte de [recipient.GetNamePossessive]: ¡tu Chiquillo ha fracasado por completo! Ha causado daños y caos indecibles en el campo que escogió. \n [recipient.GetName] está furioso/a por el «regalo» que le hiciste a [recipient.GetHerHim]. [recipient.GetSheHe|U] te ha notificado que tu Chiquillo volverá a tu corte lo antes posible y que [recipient.GetSheHe] siente una gran decepción por cómo decidiste abusar de [recipient.GetHerHis] confianza. [recipient.GetSheHe|U] esperará que te enmiendes, tarde o temprano."
 
 POD_cappadocian_power.8000.title: "Chiquillos desastrosos"
 POD_cappadocian_power.8000.desc: "Llegan noticias de la corte de [recipient.GetNamePossessive]: ¡tu Chiquillo ha fracasado por completo! Ha causado daños y caos indecibles en el campo que escogió. \n [recipient.GetName] está furioso/a por el «regalo» que le hiciste a [recipient.GetHerHim]. [recipient.GetSheHe|U] te ha notificado que tu Chiquillo seguirá a [recipient.GetHerHis] lado, pero ya no como invitado, y que [recipient.GetSheHe] siente una gran decepción por cómo decidiste abusar de [recipient.GetHerHis] confianza. [recipient.GetSheHe|U] esperará que te enmiendes, tarde o temprano."
 
 POD_cappadocian_power.optiongood: "Excelente."
 POD_cappadocian_power.optionbad: "¿Había cometido un error?....."
 
