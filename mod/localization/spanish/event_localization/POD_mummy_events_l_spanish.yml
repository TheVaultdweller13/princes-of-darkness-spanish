l_spanish:
  POD_mummy_resurrection.1.t: "¿Verdaderamente inmortal?"
  POD_mummy_resurrection.1.desc: "Cuando mueren, las momias pasan por un proceso largo (y desagradable) en el que su alma es arrojada a un reino espiritual llamado la [UmbraGlossary('tempest')]. Allí, regresan lentamente a la [UmbraGlossary('earth')]. Además, algunos tipos de $POD_splat_mummy_plural$ también serán juzgados.\nLas momias Shemsu-heru van a Amenti, el reino de los muertos egipcios, para reunirse con Anubis y los jueces de Ma'at, mientras que las momias Cabiri van al Hades, donde tienen que valerse por sí mismas en un entorno más hostil."
  POD_mummy_resurrection.1.a: "Júzgame"
  POD_mummy_resurrection.1.a.tt: "Tras la muerte, serás juzgado en función de tu integridad."
  POD_mummy_resurrection.1.b: "He perdido algo importante..."
  POD_mummy_resurrection.1.b.tt: "Debido a tus cimientos inestables, perdiste parte de ti mismo en la [UmbraGlossary('tempest')]"
  POD_mummy_resurrection.1.c: "Maestro, he fallado."
  POD_mummy_resurrection.1.c.tt: "$glossary_wyrm_apophis$ no es conocido por su indulgencia ante los fracasos..."
  POD_mummy_resurrection.1.d: "Volveré"
  POD_mummy_resurrection.1.d.tt: "Debido a tus fuertes cimientos, lograste sobrevivir en la [UmbraGlossary('tempest')] sin perder nada"
 
  POD_mummy_resurrection.2.t: "Las balanzas de Ma'at"
  POD_mummy_resurrection.2.desc: "Has muerto. Ahora te encuentras en las [UmbraGlossaryLocalized('shadowlands','Tierras de las Sombras')] y deberás pasar un juicio para demostrar que eres digno de resucitar.\nComienza esperando a que Anubis te localice, lo que puede ser un proceso largo y estresante, antes de ser llevado ante los jueces de Ma'at, que evaluarán si trabajaste diligentemente para fomentar la causa del equilibrio en tu última vida."
 POD_mummy_resurrection.2.t.wutian: "Balanza de los Ocho"
 POD_mummy_resurrection.2.desc.wutian: "Has muerto. Ahora te encuentras en las [UmbraGlossaryLocalized('shadowlands','Tierras de las Sombras')] y deberás pasar un juicio para demostrar que eres digno de resucitar.\nDe pie ante las Puertas del Cielo, aguardas a los Ocho Inmortales, que evaluarán si trabajaste diligentemente por la misión que se te encomendó y por la causa de los Cielos en tu última vida."
 POD_mummy_resurrection.2.t.custom: "Balanza del Uno"
 POD_mummy_resurrection.2.desc.custom: "Has muerto. Ahora te encuentras en las [UmbraGlossaryLocalized('shadowlands','Tierras de las Sombras')] y deberás pasar un juicio para demostrar que eres digno de resucitar.\nComienza esperando a que te recuperen los wraith que juraron recoger almas cuando este reino se estableció por primera vez, antes de ser llevado ante quien estabilizó [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')] y se erigió a sí mismo como Juez de los [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)]."
 POD_mummy_resurrection.2.t.evil: "Balanza del Amo"
 POD_mummy_resurrection.2.desc.evil: "Has muerto. Ahora te encuentras en las [UmbraGlossaryLocalized('shadowlands','Tierras de las Sombras')] y deberás pasar un juicio para demostrar que eres digno de resucitar.\nHas sido llamado de vuelta, directamente a los brazos del Amo. Tu tiempo a su servicio será evaluado a la luz de tu reciente fracaso en seguir con vida. Se reservará tiempo para asegurar que has aprendido bien la lección."
  POD_mummy_resurrection.2.a: "Pesa mis pecados."
  POD_mummy_resurrection.2.a.tt: "El castigo que recibirás se basa en tu nivel de Integridad."
 POD_mummy_resurrection.2.a.tt.forgiveness: "Tu servicio se considera... aceptable"
 POD_mummy_resurrection.2.a.tt.evil: "Soportarás una instrucción muy #italic punzante#! por parte del Amo"
  POD_mummy_resurrection.2.b: "No os necesito."
  POD_mummy_resurrection.2.b.tt: "Buscarás a otro maestro, convirtiéndote en lo que juraste destruir."
  POD_mummy_resurrection.2.c: "¡Lo haré mejor!"
  POD_mummy_resurrection.2.c.tt: "Suplicarás a tus jueces. Esto no volverá a funcionar durante los próximos 50 años."
 POD_mummy_resurrection.2.d: "¡Yo soy el Juez!"
 POD_mummy_resurrection.2.d.tt: "Te declaras perfecto y sin defecto. No se realiza ninguna prueba"
 POD_mummy_resurrection.2.e: "¡Yo soy el Noveno!"
  
  podmummy.1.homelandandtomb: "[POD_homeland|E] y tumba"
  podmummy.1.homeland: "[POD_homeland|E]:"
  podmummy.1.tomb: "Debido a tu tumba:"
  POD_not_in_homelands_tt: "No estás en tu [POD_homeland|E] y, por tanto, no has ganado Memoria de ella."
  POD_no_tomb_memory_tt: "\nTu tumba no proporcionó ninguna Memoria."
 podmummy.3.t: "Mandatos quebrantados"
 podmummy.3.desc: "De pronto, sin fanfarria ni nube de humo, un hombre vestido con túnicas blancas aparece ante ti. Su rostro está libre de las cicatrices de la edad, pero el peso y la decepción de su mirada lo compensan de sobra. Puede que sea un extraño para la mayoría, pero tú lo conoces bien, pues es el rostro que ves siempre que regresas a las Puertas del Cielo.\n\n«Nuestra vista no se ha apagado con la edad, ni nos hemos vuelto más indulgentes con el tiempo. Salvo en contadas circunstancias, damos a cada Wu T'ian una vida entera para cometer errores y buscar la penitencia. Sin embargo, hay ciertas violaciones de los Mandatos del Cielo que deben abordarse antes de que puedan crearse verdaderos horrores. Has vendido tu alma a una fuerza oscura, un alma que habías ligado voluntariamente a las misiones del Cielo. Ahora... ahora has elegido el poder antes que el deber y por ello perderás ese poder.»"
 podmummy_3_wutian_witch: "@warning_icon! #X Convertirte en [GetTrait('witch').GetName(GetPlayer)] es una violación grave de los Diez Mandatos del Cielo, a los que están sujetos todos los Wu T'ian. #!"
  
  podmummy.1000.t: "¡Saqueadores de tumbas!"
  podmummy.1000.desc: "Tu tumba alberga una gran cantidad de posesiones sentimentales de tus vidas pasadas... que son vistas como tesoros inestimables para el inculto ojo moderno. El saqueo de tumbas ha sido una tradición desde que existen las propias tumbas y una pesadilla para la existencia de las momias, que a menudo se encuentran con que les faltan recuerdos clave al despertar para un nuevo ciclo.\nComo tal, han desarrollado cultos y trampas para proteger lo que es legítimamente suyo de los codiciosos, pero a veces incluso las defensas más cuidadosamente construidas pueden ser rotas por pura suerte por estos molestos aventureros."
  podmummy.1000.a: "¡¿Quién se atreve a perturbar mi sueño?!"
  podmummy.1000.b: "Es hora de aplastar yo mismo a estas molestas hormigas."
  podmummy.1000.c: "Tengo cosas mejores que hacer."
 
  podmummy.1001.t: "¡Vampiros saqueadores de tumbas!"
  podmummy.1001.desc: "Los vampiros han estado fascinados por las momias desde que entraron en contacto unos con otros. Esta forma de inmortalidad (aparentemente) más \"pura\", libre de la maldición de Caín, les resulta atractiva, especialmente porque ven a las momias como \"verdaderos inmortales\", ya que incluso la muerte definitiva solo inicia un nuevo ciclo para ellas. Por ello, no es de extrañar que muchos vampiros se hayan obsesionado con intentar descubrir los secretos de vuestra clase.\nLamentablemente, esto a menudo los hace iguales a cualquier saqueador de tumbas habitual, ya que ven vuestras reliquias como posibles llaves para vuestros secretos. Sin embargo, los vampiros suelen acabar siendo una amenaza mucho mayor porque saben lo que podéis hacer y tienen acceso a poderes con los que los aventureros mortales solo pueden soñar."
  podmummy.1001.a: "Debería hacer una tumba bañada por el sol..."
  podmummy.1001.b: "¡Te mostraré la verdadera inmortalidad!"
  podmummy.1001.c: "Tengo cosas mejores que hacer."
 podmummy.6000.t: "Un nuevo camino"
 podmummy.6000.desc: "Cuando te convertiste en Wu T'ian, tu personalidad guió tu elección entre las dinastías [GetDynastyByID( 'POD_mummy_dynasty_xianlung' ).GetBaseName] y [GetDynastyByID( 'POD_mummy_dynasty_wufeng' ).GetBaseName]. Sin embargo, la eternidad es muy larga y lo que una vez te atrajo hacia un camino ya no está presente. Al haber alterado el equilibrio de tu aspecto, puedes elegir un nuevo camino y asumir sus ventajas y desventajas."
 podmummy.6000.a: "[GetDynastyHouseByID( 'house_white_lotus_society' ).GetBaseName]"
 podmummy.6000.b: "[GetDynastyHouseByID( 'house_twilight_scholars' ).GetBaseName]"
 podmummy.6000.c: "[GetDynastyHouseByID( 'house_jade_sentinels' ).GetBaseName]"
 podmummy.6000.d: "[GetDynastyHouseByID( 'house_celestial_arrows' ).GetBaseName]"
 podmummy.6000.e: "[GetDynastyHouseByID( 'house_righteous_peach_blossoms' ).GetBaseName]"
 podmummy.6000.f: "[GetDynastyHouseByID( 'house_brotherhood_of_the_scarlet_lantern' ).GetBaseName]"
 podmummy.6001.t: "Elegir un Aspecto"
 podmummy.6001.desc.xianlung: "Tu alma pasa al Mundo Yin, una tierra de desapego. A lo lejos, espíritus encorvados avanzan penosamente bajo un vacío inmóvil y sin nubes por caminos como lisos fragmentos negros de hueso. De la quietud surge volando un dragón dorado. Tras saludarte, el dragón se dispone a abrir un portal a la Puerta del Cielo. Al cruzarlo, un espíritu se infundirá en tu naturaleza actual y acentuará lo que ya hay en ella. Sin embargo, antes debes elegir tu aspecto, que afectará a tu papel en los planes del Cielo. Según el dragón, aunque tu alma tiene predisposición hacia las tareas de [GetDynastyByID( 'POD_mummy_dynasty_xianlung' ).GetBaseName], quizá reconozcas un desequilibrio en tu interior y busques un cambio.\n\n¿A qué casa te unirás? ¿Qué tareas deseas?"
 podmummy.6001.desc.wufeng: "Tu alma pasa al Mundo Yang, una tierra de salvajismo. A lo lejos, insectos enormes zumban a través del embravecido mar del caos. Como un incendio forestal, una energía hirviente y caprichosa te azota. De la locura surge volando un fénix dorado. Tras saludarte, el fénix se dispone a abrir un portal a la Puerta del Cielo. Al cruzarlo, un espíritu se infundirá en tu naturaleza actual y acentuará lo que ya hay en ella. Sin embargo, antes debes elegir tu aspecto, que afectará a tu papel en los planes del Cielo. Según el dragón, aunque tu alma tiene predisposición hacia las tareas de [GetDynastyByID( 'POD_mummy_dynasty_wufeng' ).GetBaseName], quizá reconozcas un desequilibrio en tu interior y busques un cambio.\n\n¿A qué casa te unirás? ¿Qué tareas deseas?"
 
  POD_mummy_hekau.201.t: "Separar Khaibit"
  POD_mummy_hekau.201.desc: "Con tu maestría en Necromancia, puedes intentar separar tu Khaibit para usarlo como un sirviente similar a un Espectro."
  POD_mummy_hekau.201.option.a: "¡Fuera de mi sombra! Sírveme."
  POD_mummy_hekau.201.option.a.tt: "Intentarás separar tu Khaibit"
  POD_mummy_hekau.201.option.a.desc: "Una lucha con tu sombra interior"
  POD_mummy_hekau.201.option.a.tt.success: "Tu Khaibit se ha separado con éxito"
  POD_mummy_hekau.201.option.a.tt.failure: "No logras separar tu Khaibit"
  POD_mummy_hekau.201.option.b: "Ahora no es el momento adecuado"
  POD_mummy_hekau.201.option.b.tt: "Abandonarás tu idea de separar tu Khaibit"
 
  POD_mummy_hekau.202.t: "Separar Khaibit II"
  POD_mummy_hekau.202.desc: "Con tu maestría en Necromancia, has logrado separar con éxito tu Khaibit de ti; ahora es el momento de dar órdenes."
  POD_mummy_hekau.202.option.a: "Mi propio espectro"
  POD_mummy_hekau.202.option.a.tt: "Tu Khaibit se ha separado con éxito."
 
  POD_mummy_hekau.203.t: "Separar Khaibit II"
  POD_mummy_hekau.203.desc: "Ni siquiera tu maestría en Necromancia es suficiente para separar tu Khaibit... por ahora."
  POD_mummy_hekau.203.option.a: "Aún no estoy listo"
  POD_mummy_hekau.203.option.a.tt: "No lograste separar tu Khaibit"
 
  POD_mummy_hekau.204.t: "Regreso del Khaibit"
  POD_mummy_hekau.204.desc: "Tu Khaibit separado ha sufrido un incidente y debe regresar a ti."
  POD_mummy_hekau.204.option.a: "Mi sombra ha regresado"
  POD_mummy_hekau.204.option.a.tt: "Tu Khaibit y tú sois uno de nuevo"
 
