l_spanish:
  POD_mummy_resurrection.1.t: "¿Verdaderamente inmortal?"
  POD_mummy_resurrection.1.desc: "Cuando mueren, las momias pasan por un proceso largo (y desagradable) en el que su alma es arrojada a un reino espiritual llamado la [UmbraGlossary('tempest')]. Allí, regresan lentamente a la [UmbraGlossary('earth')]. Además, algunos tipos de $POD_splat_mummy_plural$ también serán juzgados.\nLas momias Shemsu-heru van a Amenti, el reino de los muertos egipcios, para reunirse con Anubis y los jueces de Ma'at, mientras que las momias Cabiri van al Hades, donde tienen que valerse por sí mismas en un entorno más hostil."
  POD_mummy_resurrection.1.a: "Júzgame"
  POD_mummy_resurrection.1.a.tt: "Tras la muerte, serás juzgado en función de tu integridad."
  POD_mummy_resurrection.1.b: "He perdido algo importante..."
  POD_mummy_resurrection.1.b.tt: "Debido a tus cimientos inestables, perdiste parte de ti mismo en la [UmbraGlossary('tempest')]"
  POD_mummy_resurrection.1.c: "Maestro, he fallado."
  POD_mummy_resurrection.1.c.tt: "$glossary_wyrm_apophis$ no es conocido por su indulgencia ante los fracasos..."
  POD_mummy_resurrection.1.d: "Volveré"
  POD_mummy_resurrection.1.d.tt: "Debido a tus fuertes cimientos, lograste sobrevivir en la [UmbraGlossary('tempest')] sin perder nada"
 
  POD_mummy_resurrection.2.t: "Las balanzas de Ma'at"
  POD_mummy_resurrection.2.desc: "Has muerto, ahora te encuentras en las [UmbraGlossaryLocalized('shadowlands','Tierras de las Sombras')] y deberás pasar un juicio para demostrar que eres digno de resucitar.\nComienza esperando a que Anubis te localice, lo que puede ser un proceso largo y estresante, antes de ser llevado ante los jueces de Ma'at, que evaluarán si trabajaste diligentemente para fomentar la causa del equilibrio en tu última vida."
  POD_mummy_resurrection.2.a: "Pesa mis pecados."
  POD_mummy_resurrection.2.a.tt: "El castigo que recibirás se basa en tu nivel de Integridad."
  POD_mummy_resurrection.2.b: "No os necesito."
  POD_mummy_resurrection.2.b.tt: "Buscarás a otro maestro, convirtiéndote en lo que juraste destruir."
  POD_mummy_resurrection.2.c: "¡Lo haré mejor!"
  POD_mummy_resurrection.2.c.tt: "Suplicarás a los Jueces. Esto no volverá a funcionar durante los próximos 50 años."
  
  podmummy.1.homelandandtomb: "[POD_homeland|E] y tumba"
  podmummy.1.homeland: "[POD_homeland|E]:"
  podmummy.1.tomb: "Debido a tu tumba:"
  POD_not_in_homelands_tt: "No estás en tu [POD_homeland|E] y, por tanto, no has ganado Memoria de ella."
  POD_no_tomb_memory_tt: "\nTu tumba no proporcionó ninguna Memoria."
  
  podmummy.1000.t: "¡Saqueadores de tumbas!"
  podmummy.1000.desc: "Tu tumba alberga una gran cantidad de posesiones sentimentales de tus vidas pasadas... que son vistas como tesoros inestimables para el inculto ojo moderno. El saqueo de tumbas ha sido una tradición desde que existen las propias tumbas y una pesadilla para la existencia de las momias, que a menudo se encuentran con que les faltan recuerdos clave al despertar para un nuevo ciclo.\nComo tal, han desarrollado cultos y trampas para proteger lo que es legítimamente suyo de los codiciosos, pero a veces incluso las defensas más cuidadosamente construidas pueden ser rotas por pura suerte por estos molestos aventureros."
  podmummy.1000.a: "¡¿Quién se atreve a perturbar mi sueño?!"
  podmummy.1000.b: "Es hora de aplastar yo mismo a estas molestas hormigas."
  podmummy.1000.c: "Tengo cosas mejores que hacer."
 
  podmummy.1001.t: "¡Vampiros saqueadores de tumbas!"
  podmummy.1001.desc: "Los vampiros han estado fascinados por las momias desde que entraron en contacto unos con otros. Esta forma de inmortalidad (aparentemente) más \"pura\", libre de la maldición de Caín, les resulta atractiva, especialmente porque ven a las momias como \"verdaderos inmortales\", ya que incluso la muerte definitiva solo inicia un nuevo ciclo para ellas. Por ello, no es de extrañar que muchos vampiros se hayan obsesionado con intentar descubrir los secretos de vuestra clase.\nLamentablemente, esto a menudo los hace iguales a cualquier saqueador de tumbas habitual, ya que ven vuestras reliquias como posibles llaves para vuestros secretos. Sin embargo, los vampiros suelen acabar siendo una amenaza mucho mayor porque saben lo que podéis hacer y tienen acceso a poderes con los que los aventureros mortales solo pueden soñar."
  podmummy.1001.a: "Debería hacer una tumba bañada por el sol..."
  podmummy.1001.b: "¡Te mostraré la verdadera inmortalidad!"
  podmummy.1001.c: "Tengo cosas mejores que hacer."
 
  POD_mummy_hekau.201.t: "Separar Khaibit"
  POD_mummy_hekau.201.desc: "Con tu maestría en Nigromancia, puedes intentar separar tu Khaibit para usarlo como un sirviente similar a un espectro."
  POD_mummy_hekau.201.option.a: "¡Fuera de mi sombra! Sírveme."
  POD_mummy_hekau.201.option.a.tt: "Intentarás separar tu Khaibit"
  POD_mummy_hekau.201.option.a.desc: "Una lucha con tu sombra interior"
  POD_mummy_hekau.201.option.a.tt.success: "Tu Khaibit se ha separado con éxito"
  POD_mummy_hekau.201.option.a.tt.failure: "No logras separar tu Khaibit"
  POD_mummy_hekau.201.option.b: "Ahora no es el momento adecuado"
  POD_mummy_hekau.201.option.b.tt: "Abandonarás tu idea de separar tu Khaibit"
 
  POD_mummy_hekau.202.t: "Separar Khaibit II"
  POD_mummy_hekau.202.desc: "Con tu maestría en Nigromancia, has logrado separar con éxito tu Khaibit de ti; ahora es el momento de dar órdenes."
  POD_mummy_hekau.202.option.a: "Mi propio espectro"
  POD_mummy_hekau.202.option.a.tt: "Tu Khaibit se ha separado con éxito."
 
  POD_mummy_hekau.203.t: "Separar Khaibit II"
  POD_mummy_hekau.203.desc: "Ni siquiera tu maestría en Nigromancia es suficiente para separar tu Khaibit... por ahora."
  POD_mummy_hekau.203.option.a: "Aún no estoy listo"
  POD_mummy_hekau.203.option.a.tt: "No lograste separar tu Khaibit"
 
  POD_mummy_hekau.204.t: "Regreso del Khaibit"
  POD_mummy_hekau.204.desc: "Tu Khaibit separado ha sufrido un incidente y debe regresar a ti."
  POD_mummy_hekau.204.option.a: "Mi sombra ha regresado"
  POD_mummy_hekau.204.option.a.tt: "Tu Khaibit y tú sois uno de nuevo"
 
  learning_true_names_head: "Aprendiendo Nombres Verdaderos:"
 
  
  POD_mummy_scheme.100.t: "Ojo de Sakhmet"
  POD_mummy_scheme.100.desc: "Inscribiste el símbolo de Sakhmet en el objetivo, haciendo que la curación de las heridas sea más difícil y duradera."
  POD_mummy_scheme.100.a: "Bien."
  
  POD_discover_true_name_outcome.2000.t: "¡No has podido aprender el ren de [target.GetTitledFirstNamePossessive]!"
  POD_discover_true_name_outcome.2000.desc: "Después de pasar meses descomponiendo el nombre en las palabras que lo componen, aprendiendo su enunciación correcta, aprendiendo el significado de cada una e intentando descubrir su naturaleza más íntima, he fracasado."
  POD_discover_true_name_outcome.2000.a: "Me rindo."
  POD_discover_true_name_outcome.2000.b: "¡El ren de [target.GetTitledFirstNamePossessive] será mío para mandarlo!"
 
  POD_command_effigy_ongoing.1030.option.b.t.PAY_MINOR: "Buen trato"
  POD_command_effigy_ongoing.1030.option.b.t.PAY_MEDIUM: "Trato decente"
  POD_command_effigy_ongoing.1030.option.b.t.PAY_MAJOR: "Trato terrible"
 
  POD_show_known_true_names_events.100.t: "Ren conocidos"
  POD_show_known_true_names_events.100.desc: "[PlayerGuiBuildTooltip('POD_display_known_ren_sgui')]"
  POD_show_known_true_names_events.100.option.a: "Aceptar"
  POD_show_known_true_names_events.100.option.b: "¿Qué se puede hacer con la flora?"
  POD_show_known_true_names_events.100.option.c: "¿Qué se puede hacer con la anatomía humana?"
  POD_show_known_true_names_events.100.option.d: "¿Qué se puede hacer con los animales?"
  POD_show_known_true_names_events.100.option.e: "¿Qué se puede hacer con los metales?"
  POD_show_known_true_names_events.110.t: "Flora"
  POD_show_known_true_names_events.110.desc: "Los Amenti con conocimiento del ren de la flora pueden aplicar diversas bendiciones o maldiciones a la tierra. También pueden transformar su piel en materia vegetal."
  POD_show_known_true_names_events.110.option.a: "Aceptar"
  POD_show_known_true_names_events.110.option.b: "Volver al menú anterior"
  POD_show_known_true_names_events.130.t: "Animales"
  POD_show_known_true_names_events.130.desc: "Los Amenti con el conocimiento del ren de diferentes animales pueden llamar a esos animales en su ayuda (MaA) o transformarse en ese animal."
  POD_show_known_true_names_events.140.t: "Metales"
  POD_show_known_true_names_events.140.desc: "Los Amenti con conocimiento del ren de diferentes metales pueden hacer aparecer metales preciosos o transformar su piel en ese metal."