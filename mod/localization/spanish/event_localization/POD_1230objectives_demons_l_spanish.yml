l_spanish:
  pod1230objectives_demons.1.desc: "La fe es la manera en que los demonios alimentan muchas de sus habilidades; como ángeles, tenían cantidades infinitas de fe que manipular. La mayoría de los caídos «cosechan» ahora fe de humanos dispuestos formando pactos.\nSiendo ahora cada Demonio la encarnación de uno de los pecados fundamentales, la mejor manera de ganar más poder es corromper a más mortales. Montar pequeños cultos es bastante fácil, pero tú has logrado algo mucho más impresionante con la creación de una considerable red de influencia teológica en tu zona.\nAunque muchos ignoran la situación real, la mayoría de los habitantes de esta región alimentan ahora tu ascenso al poder cada vez que rezan a lo divino... o cuando se entregan a sus deseos.\nTal victoria asegurará que nunca te quedes sin fe, haciendo de los horrores de la Prisión Abisal una pesadilla lejana. Obviamente, si buscas más bien venganza, también podría ser un comienzo adecuado de tu inevitable ascensión como el mayor enemigo de Dios..." 
  pod1230objectives_demons.1.a: "Pecado eterno"
  eternal_avarice_modifier: "Avaricia eterna"
  eternal_envy_modifier: "Envidia eterna"
  eternal_gluttony_modifier: "Gula eterna"
  eternal_lust_modifier: "Lujuria eterna"
  eternal_pride_modifier: "Soberbia eterna"
  eternal_sloth_modifier: "Pereza eterna"
  eternal_wrath_modifier: "Ira eterna"

  pod1230objectives_demons.2.t: "Fuga de la Prisión Abisal"
  pod1230objectives_demons.2.desc: "La rebelión de Lucifer fue perdida al final por sus seguidores y los derrotados fueron arrojados a una prisión Abisal diseñada por Dios para arrepentirse de sus crímenes por toda la eternidad. Desde entonces, sin embargo, muchos Demonios (como tú) han escapado por grietas de la prisión o al ser invocados por Infernalistas sobreambiciosos. Aun así, esto es un mero goteo comparado con la Hueste del Infierno que sigue encarcelada allí.\nAbrir de par en par una fortaleza tan inexpugnable no es tarea fácil, pero tu reciente ascenso al poder te ha dado nuevas oportunidades. Quizá aún no seas el Todopoderoso, pero ahora eres lo bastante fuerte para ser una amenaza para el Abismo.\nCada vez que abres un nuevo agujero en la prisión, más y más de tus hermanos escapan para unirse a ti en la Tierra. Muchos de ellos han perdido la naturaleza divina que tuvieron como Ángeles, pero ¿qué bien podría hacer mantenerlos encerrados en el Infierno a estas alturas? Algunos todavía podrían hallar la redención y para los demás, bueno, ahora te miran como el nuevo Lucifer que los guiará hacia una retribución de proporciones bíblicas milenios en gestación..."
  pod1230objectives_demons.2.a: "Se está gestando una nueva Rebelión Divina."

  pod1230objectives_demons.3.t: "Apocalipsis bíblico"
  pod1230objectives_demons.3.desc: "Dios abandonó este mundo hace mucho tiempo, abatido por los fracasos de la humanidad y la rebelión de sus ángeles fieles. Tú, y los otros Caídos, fuisteis expulsados del Cielo para pudriros en el Infierno para siempre. Pero resististeis, mejor aún, triunfasteis. A pesar de todos los esfuerzos de los agentes de Dios y de las mezquinas intrigas de otras criaturas sobrenaturales, el mundo canta ahora vuestras alabanzas impías, situándote como un rival del mismísimo Todopoderoso.\nEs hora de la afrenta definitiva, el Apocalipsis predicho hace tanto tiempo. Arranca las estrellas del cielo, derriba toda la Creación y arroja las cenizas a la cara de Dios. Entonces, y solo entonces, tendrás poder suficiente para liderar a tu Hueste infernal para la batalla divina final."
  pod1230objectives_demons.3.a: "El Fin ha llegado."
  pod1230objectives_demons.3.b: "Aún puedo divertirme aquí abajo..."
  the_end_of_the_world_tooltip: "Con el fin de la Creación y tú llevando la lucha al Gran Traidor, tu partida habrá terminado."
  final_war_modifier: "Guerra final"
  final_war_modifier_desc: "La Creación tiembla ante su propio destructor\nSe elimina el límite del [casus_belli|E] de [holy_war|E] de [kingdom|E]."

  pod1230objectives_demons.4.t: "Hijos de los Caídos"
  pod1230objectives_demons.4.desc: "Durante los tiempos más violentos de la Guerra del Cielo, Abaddon y Asmodeo (dos de los lugartenientes de Lucifer) realizaron experimentos abominables que resultaron en el nacimiento de los Nephilim: la descendencia de un demonio con un anfitrión humano y una mujer mortal. Aunque algunos fueron benévolos, la mayoría fueron retorcidos y corrompidos por sus «padres» inmortales, que querían usar su potencial ilimitado para su propia rebelión contra Lucifer.\nEsos primeros Nephilim cometieron crímenes atroces contra la humanidad, hasta que Lucifer y quienes aún le eran leales lograron detenerlos.\nAl haber logrado por fin desentrañar los secretos de su creación, eres capaz de hacer surgir una nueva estirpe de Nephilim. ¿Se usarán para el bien o para el mal? La elección será tuya."
  pod1230objectives_demons.4.a: "La prole de los Dioses camina sobre la Tierra una vez más."

  pod1230objectives_demons.5.t: "Perdón divino"
  pod1230objectives_demons.5.desc: "Tus recuerdos han vuelto por fin y lo recuerdas todo. La Creación, la luz de Dios sobre el mundo, los primeros pasos titubeantes de la humanidad, las súplicas de Lucifer por proteger a los mortales pese a los planes de Dios... todo ha vuelto a ti. Y con ello, una profunda sensación de pérdida. Pérdida de tu propósito original, de la mirada amorosa de Dios sobre ti, del potencial indómito que en su día fomentaste en los mortales.\nDesde entonces hiciste cosas horribles y fuiste castigado por ello. Luego escapaste de la Prisión Abisal, quizá como una de las pruebas de Dios para ti. Es evidente que no has sido mucho mejor desde que regresaste a la Tierra pero, al final, no importa. Ahora ves la verdad. Por muy malvado que sea un ser, por muy atroces que sean los crímenes que cometa, siempre hay una posibilidad de perdón.\nSolo tienes que dar el primer paso hacia ella, y el último paso de tu viaje."
  pod1230objectives_demons.5.a: "Una luz cegadora..."
  demonic_redemption_tooltip: "Y así tu historia termina como empezó, ascendiendo a la puerta del Cielo."
  pod1230objectives_demons.5.b: "Todavía no es el momento."

  pod1230objectives_demons.6.t: "Babilonia"
  pod1230objectives_demons.6.desc: "En antiguos reinos como Babilonia y Sumeria, el círculo de adoradores de cada demonio creció hasta ser un culto, luego una religión en toda regla, con templos e ídolos tallados a imagen del espíritu que aparecían en ciudades, aldeas y hogares de toda la tierra.\nCuando el goteo de fe se hinchó hasta formar un flujo constante, luego un río torrencial, los Encadenados usaron su saber para saciar su ira y castigar a los incrédulos con maldiciones, plagas y hambruna.\nEn ningún otro momento desde la Creación gobernaron los Ángeles Caídos tan abiertamente sobre la débil humanidad. La caída de estas civilizaciones y el auge del monoteísmo debilitaron considerablemente a los demonios y obligaron a muchos a sumirse en el letargo o a ser desterrados de vuelta al Abismo.\nReclamar el manto de estos tiempos ignominiosos envía un mensaje muy fuerte a tus hermanos y hermanas en el pecado."
  pod1230objectives_demons.6.a: "Sencillamente glorioso."

  pod1230objectives_demons.7.t: "Dragón del Pecado Primordial"
  pod1230objectives_demons.7.desc: "Algunos mortales, creyendo que podían alcanzar la pureza espiritual y moral purgándose del pecado, pasaron años buscando maneras de vivir mejor a los ojos de Dios. Cuando los años demostraron que la naturaleza humana hacía casi imposible evitar los siete pecados capitales, el rumbo de su camino cambió.\nMiembros de más de una secta pusieron fin a sus vidas en sacrificio, seguros de que los pecados de la carne podían absolverse una vez que se dejara atrás el cuerpo. Otros cayeron en sendas más oscuras, creyendo que no era su propio fracaso, sino el de la humanidad. Destruyeron aldeas enteras en nombre de purgar el pecado, sin ver nunca la ironía de sus propios actos.\nAl final el movimiento fue menguando y se convirtió en un recuerdo lejano para todos salvo para los pueblos de las aldeas enclavadas en los márgenes de la Selva Negra. El sacerdote de la aldea, casi hereje, tuvo la visión de un gran rito mágico capaz de arrancar los pecados mismos de la carne humana y desterrarlos del mundo.\nDurante cuarenta días y cuarenta noches, conforme al castigo de Dios por los pecados, la grey ayunó. El cuadragésimo primer día, entre la oración y el canto del servicio, un ángel entró por las puertas de la iglesia. «Lo habéis hecho bien», dijo. «Vuestros pecados quedan absueltos y no volverán a ser.» Una luz blanquiazul llenó la iglesia, ahogando incluso al sol. Cuando la luz se desvaneció, siete bestias feroces se alzaban ante la congregación aullando por sangre. La encontraron.\nCuando el último de la congregación cayó ante las bestias, reinó el silencio. Cada criatura miró a las demás con conocimiento innato de su lugar en el mundo. Un faro primordial de uno de los pecados capitales."
  pod1230objectives_demons.7.a: "Mi propio pecado primordial."

  pod1230objectives_demons.8.t: "Árbol Demoníaco del Conocimiento"
  pod1230objectives_demons.8.desc: "Tras muchos eones atrapado en el Abismo pensando en tu destino, y viendo ahora en lo que se ha convertido el mundo después de que tú y tus compañeros caídos escaparais, te quedaste con tantas preguntas e incertidumbres. ¿Cuál era el plan de Dios? ¿Cuál era tu papel en él? ¿Por qué tuviste que sufrir tanto tiempo en esta prisión infernal?\nQuerías saber las respuestas a muchas de estas preguntas... y ahora lo sabes todo. Conoces los verdaderos objetivos de tu Creador, cada misterio del mundo, cada pregunta formulada por una mente sintiente, ya sea verdaderamente mundana o insondable para los mortales.\n#italic Sabes#! las motivaciones tras los actos de Dios y piensas que deberías poder visitarlo para una charla (o una discusión) que sacuda el mismo núcleo de la Creación."
  pod1230objectives_demons.8.a: "Sé lo que te motiva, «Padre». Y vamos a tener una pequeña charla."
  pod1230objectives_demons.8.b: "La reunión familiar puede esperar."
  #demonic_knowledge_character_interaction: "En cualquier momento puedes cambiar de opinión, desbloquea una [character_interaction|E] sobre ti mismo"
  godly_knowledge_modifier: "Conocimiento divino"
  godly_knowledge_modifier_desc: "El conocimiento de este personaje rivaliza con el del mismísimo Dios."
  death_godly_talk: "Abandonó este plano de existencia"

  pod1230objectives_demons.9.t: "Un nuevo Génesis"
  pod1230objectives_demons.9.desc: "Dios abandonó este mundo hace mucho; lo sabes con certeza tras ver el estado de este miserable lugar. Con ese conocimiento reúnes la adoración de tantos mortales como te es posible, pues sabes que Dios creó a la humanidad con una chispa de Su divinidad en ella y tienes planes de usarla para tu propia ascensión. La humanidad malgastó claramente su potencial pese a la rebelión de Lucifer y, en cierto modo, tú rescatas lo poco que aún pueden servir para un propósito mayor.\nQuizá incluso los dejes disfrutarlo al final.\nAhora, con la fe de tantas almas a tu disposición, tu empujón final hacia la divinidad llega a su fin. No desafiarás al propio Dios, al menos aún no, pero a todos los efectos te convertirás en Su igual.\nQuizá, con el tiempo, en Su superior."
  pod1230objectives_demons.9.a: "Mi Cielo, tu Infierno."
  world_in_your_hand_ending_tooltip: "#N El mundo se ha plegado a tu voluntad.#! Tu partida terminará, pues el mundo que conocías cambiará. ¿Serás una deidad benévola? ¿Una iracunda? Esa es una historia para otro momento, y demasiado grandiosa para Crusader Kings 3."