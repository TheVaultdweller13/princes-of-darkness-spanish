 awaketorpor_my_rival: "Tu Víctima: $VALUE|=+0$"
 POD_awaketorpor.667.t: "Rastro perdido"
 POD_awaketorpor.667.desc: "Quizá tu presa ya haya despertado, o tus pistas fueran falsas desde el principio. En cualquier caso, has perdido el rastro del vampiro aletargado y deberás empezar de cero si aún estás decidido a localizarlo."
 POD_awaketorpor.667.option.a: "Parece que me estaban esperando"
 POD_awaketorpor.1.t: "Preguntas y respuestas"
 POD_awaketorpor.1.desc: "Has encontrado una pista importante sobre la ubicación del vampiro dormido que buscas. Lamentablemente, esa pista tiene un límite y, de hecho, te ha llevado a una pequeña aldea donde nadie quiere hablar contigo.\n¿Quizás están bajo el control de tu presa? Es difícil de decir, pero no puedes vagar por la zona demasiado tiempo, así que tendrás que convencerles para que respondan a tus preguntas."
 POD_awaketorpor.1.option.a: "¡Eh, tú! ¡Responde!"
 POD_awaketorpor.1.option.aa.effect.success.desc: "Un éxito crítico hará que tu plan avance sin problemas"  
 POD_awaketorpor.1.option.ab.effect.success.desc: "Puede que pierdas algo en el camino..."      
 POD_awaketorpor.1.option.ac.effect.success.desc: "Pierdes el rastro..."      
 POD_awaketorpor.1.option.b: "No merece la pena tanto lío"       
 POD_awaketorpor.1.option.b.custom: "Terminas tu Viaje aquí, dejando al vampiro dormido en su Hibernación"       
 POD_awaketorpor.1.success: "El oro abre muchas puertas"
 POD_awaketorpor.2.t: "El Laberinto"
 POD_awaketorpor.2.desc: "Obviamente, tenía que ser un laberinto. Tu objetivo construyó o tomó prestada una serie de cuevas subterráneas y ahora está atrincherado allí. Y, como has adivinado, hay trampas por todas partes.\nPuedes intentar navegar por este laberinto para llegar a tu presa, pero es probable que salgas herido en el proceso."
 POD_awaketorpor.2.option.a: "Un paso a la vez..."
 POD_awaketorpor.2.success: "¡Ay! ¡En la cabeza no!"
 POD_awaketorpor.3.t: "Los Esclavos"
 POD_awaketorpor.3.desc: "Has encontrado dónde yace tu objetivo... pero también has hallado a todo un ejército de mercenarios protegiendo el lugar, aparentemente pagados mediante una compleja Conjura dirigida por algunos de los siervos del vampiro. Tienes tu propio ejército no muy lejos, obviamente, pero los mercenarios están atrincherados y esperan problemas.\nLa elección es tuya: si sigues adelante, tendrás que ganar rápidamente antes de que muevan al vampiro aletargado a otro lugar. También podrías cancelar la operación si no quieres arriesgarte."
 POD_awaketorpor.3.option.a: "¡Cargad!"
 POD_awaketorpor.3.option.b: "No merece la pena tanto lío"
 POD_awaketorpor.3.success: "Una victoria desastrosa"
 POD_awaketorpor.10.t: "La Elección"
 POD_awaketorpor.10.desc: "Cualquier obstáculo en el camino hacia tu objetivo aletargado ha sido eliminado. Ahora, tienes que prepararte para la confrontación con tu presa, ya que los vampiros recientemente Despertados no son las personas más amables.\nTienes que elegir cuál es tu objetivo con el monstruo dormido que te aguarda."
 POD_awaketorpor.10.option.a: "Quiero despertarlos y reclutarlos"
 POD_awaketorpor.10.option.b: "¡Otra alma para devorar!"
 POD_awaketorpor.11.t: "Regreso a casa"
 POD_awaketorpor.11.desc: "Has perdido el rastro de tu objetivo y regresas a tu corte sin mucho, o nada, que mostrar de tu Viaje. Obviamente, este es un momento difícil, ya que tus rivales ya se burlan a tus espaldas.\n¿Cómo manejarás esta situación?"
 POD_awaketorpor.11.option.a: "Financiar una demostración de fuerza para sofocar el descontento"
 POD_awaketorpor.11.option.b: "Se callarán a tiempo"
 POD_awaketorpor.12.t: "Charla somnolienta"
 POD_awaketorpor.12.desc: "Has encontrado a tu presa y has utilizado a un donante de sangre «voluntario» para ayudar a disipar el sueño de los siglos. Sin demasiados problemas, aunque obviamente te mantuviste alejado durante todo el proceso.\nAhora, tu objetivo está totalmente despierto y escucha atentamente lo que le ofreces. Es ahora o nunca cuando asegurarás su participación y regresarás a tu corte. Más vale que estés seguro de lo que dirás a continuación..."
 POD_awaketorpor.12.option.a: "No rechazarás mi oferta"
 POD_awaketorpor.12.option.aa.effect.success.desc: "¡Tu objetivo se une a tu corte!"  
 POD_awaketorpor.12.option.ab.effect.success.desc: "Tuviste que suplicar, pero funcionó"      
 POD_awaketorpor.12.option.ac.effect.success.desc: "Un rechazo rotundo, te vas solo"           
 POD_awaketorpor.12.option.b.custom: "Terminas tu Viaje aquí, dejando al vampiro dormido en su Hibernación"       
 POD_awaketorpor.12.success: "¡Bienvenidos!"
 POD_awaketorpor.12.successb: "...¡Bienvenido!" 
 POD_awaketorpor.12.successc: "Todo para nada..."  
 POD_awaketorpor.13.t: "El Guardián"
 POD_awaketorpor.13.desc: "Solo queda un obstáculo en el camino de tu presa: un guerrero de aspecto duro que protege al vampiro dormido. Podría ser un [ghoul|E], pero parece muy bien entrenado, y sospechas que otros acechan cerca.\nEl espacio es demasiado estrecho para lanzar un asalto con un ejército, y no puedes dar marcha atrás ahora o moverán el cuerpo de su señor. Así que es una lucha en la que estás claramente en desventaja, pero puedes sentir la sangre pulsante de tu presa cerca, llamándote..."
 POD_awaketorpor.13.option.a: "Te mataré a ti primero. ¡Luego será el turno de tu señor!"
 POD_awaketorpor.13.option.abis: "¡No me detendrás!"
 POD_awaketorpor.13.option.aa.effect.success.desc: "¡Una victoria total!"  
 POD_awaketorpor.13.option.ab.effect.success.desc: "Fue duro..."      
 POD_awaketorpor.13.option.ac.effect.success.desc: "¡Espera! ¡Usar flechas de fuego es hacer trampas!"           
 POD_awaketorpor.13.success: "...tan cerca"
 POD_awaketorpor.14.t: "El Premio"
 POD_awaketorpor.14.desc: "Finalmente, tu objetivo dormido está indefenso ante ti. Casi tiemblas de anticipación, lo cual es obviamente imposible en tu estado. El tiempo parece detenerse mientras muestras tus colmillos, listo para consumir el alma por la que has luchado.\nTu Bestia está encantada y dejarás este lugar más fuerte de lo que viniste... pero quizás menos humano."
 POD_awaketorpor.14.option.a: "Una victoria sangrienta."
 POD_awaketorpor.14.option.b: "Simplemente acaba con ellos."
 POD_awaketorpor.14.desc.b: "Finalmente, tu objetivo dormido está indefenso ante ti. No te queda más que terminar la sombría tarea por la que has venido. Puede que no sea una forma muy climática de terminar esta aventura, pero asegurarse de que este enemigo nunca despierte para estorbarte en el futuro es un éxito en sí mismo."
