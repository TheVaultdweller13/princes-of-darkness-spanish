 ####Court Positions####
 hibernation_attendant_court_position: "Ayudante de Hibernación"
 hibernation_attendant_court_position_desc: "Mientras está en Mnesis, un Mokolé es vulnerable tanto en sus sueños como en la realidad. El Ayudante de Hibernación defiende a su señor y vela para que nada perturbe sus sueños."
 wallow_warden_court_position: "Guardián del Cenagal"
 wallow_warden_court_position_desc: "Un Cenagal es el corazón de una nidada de Mokolé. Es un santuario, una escuela y, lo más importante, un hogar. Supervisar su construcción y protección es un gran honor, pero una responsabilidad aún mayor."
 sun_herald_court_position: "Heraldo del Sol"
 sun_herald_court_position_desc: "Todos los Mokolé son capaces de communar con el Padre Sol, pero es el Heraldo quien dedica su tiempo a intentar comprender verdaderamente la sabiduría del Sol."
 crested_purifier_court_position: "Purificador Crestado"
 crested_purifier_court_position_desc: "Ya sean los no-muertos, demonios o incluso otras Razas Cambiantes, el Purificador de la Cresta lidera a sus compañeros Mokolé contra sus enemigos."
 solar_salvager_court_position: "Recolector Solar"
 solar_salvager_court_position_desc: "Los Mokolé son maestros de su oficio y su necesidad de materiales de forja es infinita. El Recolector es responsable de identificar y saquear el equipo desechado que puede ser reforjado en las Forjas Solares de los Mokolé."