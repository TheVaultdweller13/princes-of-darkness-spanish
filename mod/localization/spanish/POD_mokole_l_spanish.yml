 ####Dream the Beast####
 artifact_archator_name: "Archator"
 artifact_archator_description: "Una gran fusión de un dinosaurio y la forma Archid del Mokolé. Esta gran bestia lleva ferozmente a su Compañero saurio a la batalla, donde puede alimentarse fácilmente de quienes se interpongan en su camino."
 artifact_dipelta_name: "Dipelta"
 artifact_dipelta_description: "Toma el escudo más grande y resistente que encuentres, añádele patas y tendrás un Dipelta. Este dinosaurio ignorará la mayoría de los ataques mientras carga hacia adelante."
 artifact_avithon_name: "Avithon"
 artifact_avithon_description: "Este dinosaurio volador con plumas llevará a su jinete a través de los cielos, donde podrá evitar fácilmente la mayoría de los peligros."
 artifact_dicravenator_name: "Dicravenator"
 artifact_dicravenator_description: "Ni siquiera los caballos más veloces pueden aspirar a igualar la velocidad de un Dicravenator. No se detendrá hasta que haya alcanzado a su presa."
 artifact_rhincanthus_name: "Rhincanthus"
 artifact_rhincanthus_description: "No importa cuánto resulte herido un Rhincanthus, nunca se detendrá. Un motor de destrucción decidido que obliterará todo a su paso."
 artifact_baroceratops_name: "Baroceratops"
 artifact_baroceratops_description: "Si el enemigo se acobarda tras sus murallas y cierra sus puertas, simplemente crea tu propia entrada con tu Baroceratops."
 artifact_dracomus_name: "Dracomus"
 artifact_dracomus_description: "Inflige 1 de daño de fuego [POD_aggravated_damage_with_box|E] a los [knights|E] y [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\n\nUn gran dinosaurio dracónico que se recubre de una mucosidad altamente inflamable que enciende al chocar sus garras. Una monstruosidad ardiente que nunca debería haber salido de los sueños del Mokolé."
 artifact_archeorex_name: "Archeorex"
 artifact_archeorex_description: "Un depredador alfa traído a la realidad. Una bestia descomunal de pura Ansia y destrucción. Si un Mokolé lograra soñar con algo aún más espantoso, traería el Apocalipsis."

