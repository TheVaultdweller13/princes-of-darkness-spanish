 game_concept_theurgy_lifestyle_desc: "La Teúrgia es similar a la Magia de Senda, pero las supersticiones y sacrificios que potencian este [Glossary('Numinum','game_concept_numina_desc')] seguirán los modismos de la Iglesia Cristiana."
 
