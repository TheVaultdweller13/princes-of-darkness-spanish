l_spanish:
 
  tribalgifts_bastet_focus: "Enfoque en Dones de Tribu"
  tribalgifts_bastet_focus_modifier: "[GetFocus('tribalgifts_bastet_focus').GetName]"
  tribalgifts_bastet_focus_desc: "Dones de tribu de los Bastet."
  tribalgifts_bastet_focus_effect_desc: "Centrarse en Dones de Tribu otorga:"
 
  pathfinders_pride_perk_name: "Orgullo del explorador"
  silent_stalking_perk_name: "Acecho silencioso"
  shriek_perk_name: "Alarido"
  cheshire_prank_perk_name: "Travesura de Cheshire"
  freyjas_blessing_perk_name: "Bendición de Freyja"
  fortuna_perk_name: "Fortuna"
  jump_to_the_moon_perk_name: "Salto a la luna"
  withering_stare_perk_name: "Mirada marchitante"
 
  PATHFINDERS_PRIDE_PERK_EFFECT: "#flavor Los gatos tienen un sentido de la orientación notablemente bueno. Con este Don, un Bastet puede mejorar esa habilidad para encontrar la salida de la mayoría de los laberintos, desiertos o bosques. La gente digna puede aprender este Don de los espíritus de las aves, pero ningún hombre gato lo admite voluntariamente en público.#!"
  SILENT_STALKING_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_silent_stalking')]\n#flavor Este truco común permite a una Bastet moverse sin hacer ningún ruido. Incluso las superficies chirriantes o inestables, como suelos de madera o montones de ramitas, pueden recorrerse sin ruido. #!"
  CHESHIRE_PRANK_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_nights_passage')]\n#flavor Unas emprendedoras Bastet descubrieron el secreto para desaparecer a plena vista. Pronto se convirtió en un truco valioso y popular. #!"
  FORTUNA_PERK_EFFECT: "#flavor Los gatos aman a sus amigos, y son famosos por su suerte. Este Don les permite compartir algo de esa buena fortuna con otros, o incluso usar un poco ellos mismos.#!"
  SHRIEK_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_shriek')]\nAplica el [modifier|E] [GetModifier('shriek_perk_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n#flavor Con un grito ensordecedor, la Bastet deja sorda a toda la gente cercana. #!"
  FREYJAS_BLESSING_PERK_EFFECT: "Como [character_interaction|E], permite dejar embarazada al objetivo.\n#flavor La antigua diosa nórdica de la fertilidad y el amor viajaba en un carro tirado por gatos. Ahora recuerda el servicio regalando a ciertos hombres gato una profunda fertilidad, que pueden otorgar a otros si lo desean. Aunque el Don no asegura que un apareamiento determinado engendre un cachorro Bastet, muchos entre el Pueblo afirman que sin la Bendición, su especie podría estar virtualmente extinguida.#!"
  JUMP_TO_THE_MOON_PERK_EFFECT: "#flavor Las más grandes de las Bastet pueden volver a $glossary_luna_seline$ para breves visitas. Al formar un Puente Lunar desde su Reino-Guarida hasta la luna, la mujer gato parte hacia la corte de Seline. Allí puede respirar y moverse con normalidad; mientras tenga cuidado, será una estancia gloriosa. #!"
  WITHERING_STARE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_withering_stare')]\nComo [character_interaction|E], te permite infligir una herida al objetivo, de gravedad dependiente de tu destreza.\n#flavor Este Don permite a una mujer gato matar con la mirada, un truco favorito de los señores Simba y de los Pumonca errantes. Usar este Don contra otras Bastet se considera profundamente deshonroso, pero ocurre.#!"
  
  sweet_hunters_smile_perk_name: "Dulce sonrisa del cazador"
  cat_claws_perk_name: "Garras de gato"
  eavesdroppers_ear_perk_name: "Oído del fisgón"
  babels_cure_perk_name: "Cura de Babel"
  deny_the_hungry_perk_name: "Negar al hambriento"
  madness_perk_name: "Locura"
  
  SWEET_HUNTERS_SMILE_PERK_EFFECT: "\n#flavor Este Don dota a las palabras de un homínido de credibilidad y convicción intrínsecas, haciendo que suenen verdaderas al oído y pesen en el corazón.#!"
  CAT_CLAWS_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_cat_claws')]\n\n#flavor Al invocar su herencia, una Bastet en forma Homínida o Sokto puede desenvainar sus garras y atacar como si estuviera en Crinos.#!"
  EAVESDROPPERS_EAR_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$\n\n#flavor Los secretos son una mercancía importante, y quienes se esfuerzan por guardar los suyos bien pueden estar ocultando algo peligroso. Este Don fue desarrollado para desenmascarar a posibles traidores o conspiradores.#!"
 fist_of_cahlash_perk_name: "Puño de [Glossary('Cahlash', 'glossary_wyrm_tt')]"
 FIST_OF_CAHLASH_PERK_EFFECT: "\n#flavor Al canalizar poder destructivo en bruto, una Bastet enfurecida puede destruir cualquier cosa material con un gruñido.#!"
  BABELS_CURE_PERK_EFFECT: "Puede aprender #V 1#! [language|E] adicional sin penalizaciones.\n\n#flavor Al flexionar los poderes de Rahjah, una Bastet puede traducir cualquier idioma humano en sus proximidades.#!"
 redeem_the_waste_perk_name: "Redimir el Páramo"
 REDEEM_THE_WASTE_PERK_EFFECT: "\n#flavor Un Homínido puede invocar el poder sanador de Gaia para renovar zonas que han sido profanadas. Olfateando y sintonizándose con la tierra, puede prestarle parte de su propia fuerza curativa.#!"
  DENY_THE_HUNGRY_PERK_EFFECT: "[character_interaction|E]: Aplica a un condado [GetModifier('deny_the_hungry_perk_modifier').GetNameWithTooltip] y reduce su [control|E].\n\n#flavor Las leyendas atribuyen este Don a los Bubasti, que lo usaron para castigar a comunidades irrespetuosas con hambruna y sequía en el Antiguo Egipto.#!"
 deny_the_hungry_perk_modifier: "Negar al hambriento"
  MADNESS_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_madness')]\n[character_interaction|E]: Convierte a un personaje en un [GetTrait('lunatic_1').GetName(GetNullCharacter)] [stressed|E].\n\n#flavor Con este Don, quien lo lanza puede obligar a otros a enfrentarse a sus demonios interiores, incluidos la demencia y la locura. La naturaleza del trastorno varía de un individuo a otro, pero siempre será grave y hará imposible que la víctima funcione con normalidad.#!"
 
  kittens_cry_perk_name: "Llanto del gatito"
  mark_as_mine_perk_name: "Marcar como mío"
  perfect_cover_perk_name: "Cobertura perfecta"
  underbelly_perk_name: "Vientre bajo"
  
  KITTENS_CRY_PERK_EFFECT: "\n#flavor Este Don dota a quien lo usa de un tono tan patético que todo el que lo oye hace lo posible por consolarla. La mayoría de las Bastet lo consideran un truco sucio pero útil. #!"
  MARK_AS_MINE_PERK_EFFECT: "Desbloquea la [buy_artifact_claim_interaction|E].\n\n#flavor Al rociar una zona u objeto con su almizcle, una Bastet puede reclamarlo. Otras criaturas sobrenaturales saben que se ha colocado algún tipo de señal prohibitoria o protección.#!"
 blinding_moonbeam_gaze_perk_name: "Mirada de Rayo de Luna Cegadora"
 BLINDING_MOONBEAM_GAZE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_killers_leap')]\n\n#flavor Al invocar a la Madre $glossary_luna_seline$, la mujer gato dispara brillantes rayos de luz de luna por los ojos. No infligen daño real, pero pueden cegar o distraer a un oponente y también proporcionan iluminación.#!"
  PERFECT_COVER_PERK_EFFECT: "\n#flavor Al arañar alrededor del lugar, rastro u objeto que se quiere ocultar, la Bastet lo oculta a la vista normal y mágica.#!"
  UNDERBELLY_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_underbelly')]\n\n#flavor Al evaluar a un enemigo u obstáculo, una Bastet puede intuir su punto más débil.#!"
 moons_gateway_perk_name: "Portal de la Luna"
 MOONS_GATEWAY_PERK_EFFECT: "[character_interaction|E]: Desbloquea #V Abrir Puente Lunar#! para teletransportarte entre Túmulos.\n\n#flavor Al pedir ayuda a una Lune, la Bastet abre un Puente Lunar entre túmulos o Reinos-Guarida. El Portal se forma como una niebla luminosa que poco a poco gira hasta adoptar la forma del destino al que se dirige la mujer gato.#!"
 wrath_of_nala_perk_name: "Ira de Nala"
 WRATH_OF_NALA_PERK_EFFECT: "Desbloquea la opción de Magia Climática: #V Tormenta#! a nivel de [duchy|E].\n\n#flavor Este Don levanta una tormenta salvaje que devasta los alrededores de la mujer gato. Esta tempestad surge de la nada y luego se calma y se dispersa.#!"
 moon_sense_perk_name: "Sentido Lunar"
 MOON_SENSE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_revolt_of_land')]\n\n#flavor Al meditar sobre un charco de agua iluminada por la luna, una Bastet puede ver cualquier cosa que ocurra bajo el resplandor de $glossary_luna_seline$.#!"
 
 
  tribalgifts_bastet_bagheera_visible: "Dones Bagheera"
  tribalgifts_bastet_bubasti_visible: "Dones Bubasti"
  tribalgifts_bastet_khan_visible: "Dones Khan"
  tribalgifts_bastet_simba_visible: "Dones Simba"
  tribalgifts_bastet_swara_visible: "Dones Swara"
  tribalgifts_bastet_celican_visible: "Dones Ceilican"
  
  humbabas_escape_perk_name: "Escape de Humbaba"
  treeclimber_perk_name: "Trepador de árboles"
  ojas_surge_perk_name: "Oleada de Ojas"
  cobras_dance_perk_name: "Danza de las cobras"
  travelers_tongues_perk_name: "Lenguas de los viajeros"
  the_paradox_of_time_perk_name: "La paradoja del tiempo"
  shivas_might_perk_name: "Poder de Shiva"
  part_the_curtain_perk_name: "Descorrer la cortina"
  
  TREECLIMBER_PERK_EFFECT: "#flavor Extendiendo y afilando sus garras, e invocando luego este Don, un Bastet puede subir o bajar por cualquier superficie vertical, desde la corteza de un árbol hasta el hormigón. Los leopardos destacan en la escalada, y la mayoría de los kuasha enseñan este secreto primero.#!"
  TRAVELERS_TONGUES_PERK_EFFECT: "#flavor Flexionando los poderes de Rahjah, un Bastet puede traducir cualquier lenguaje humano en su vecindad. Invocar al Deshacedor convertirá todo en galimatías.#!" 
  PART_THE_CURTAIN_PERK_EFFECT: "#flavor Al igual que el Don Común de Nivel Cuatro: Caminar entre Mundos, este hechizo permite a un leopardo cruzar a la Umbra Próxima. Esta variación, sin embargo, le permite llevar a otros consigo también.#!"  
  HUMBABAS_ESCAPE_PERK_EFFECT: "Ya no puedes ser encarcelado durante [sieges|E] o [raids|E].\n#flavor Este Don permite a una mujer leopardo dislocarse las extremidades y deslizarse por aberturas pequeñas. #!"
  OJAS_SURGE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_ojas_surge')]\nComo [character_interaction|E], te permite aumentar temporalmente un atributo.\n#flavor Al canalizar la energía espiritual que lleva dentro, el Bagheera puede elevar sus capacidades físicas y perceptivas a niveles imposibles.#!"
  COBRAS_DANCE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_cobras_dance')]\nMás probabilidades de [imprison|E] a [characters|E] tras un [siege|E] o [raid|E] exitoso.\n#flavor Hace mucho, una pantera llamada Tola entró en negociaciones con el Rey Serpiente. Tras semanas de discusión y debate, ambos llegaron a una especie de entendimiento. Nadie sabe qué secretos ofreció Tola al Rey Serpiente, pero él aprendió este Don como parte del intercambio. La Danza permite a un felino paralizar a su presa con la mirada. #!"
  THE_PARADOX_OF_TIME_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_paradox_of_time')]\nAplica el [modifier|E] [GetModifier('the_paradox_of_time_perk_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n#flavor La mujer gato muestra a su objetivo una visión vertiginosa y no lineal del vasto devenir del tiempo, que produce náuseas y confusión en lugar de iluminación. #!"
  SHIVAS_MIGHT_PERK_EFFECT: "Desbloquea la opción de cambio de forma [GetModifier( 'POD_shapeshift_form_shiva_modifier' ).GetNameWithTooltip|L] o [GetModifier( 'POD_shapeshift_form_kali_modifier' ).GetNameWithTooltip|L].\n#flavor Los más poderosos de los hombres leopardo pueden transformarse en una forma Juddho que recuerda a Shiva el Destructor. En un estallido de luz sagrada, el Bastet se convierte en un hombre gato Crinos de 12 pies de altura y seis brazos que blande armas místicas llameantes, que asola todo a su alrededor hasta que nada se mueve.#!"
  
  alms_to_the_poor_perk_name: "Limosna para los pobres"
  scholars_friend_perk_name: "Amigo del erudito"
  mousemaze_perk_name: "Laberinto del ratón"
  banish_cahlashs_brood_perk_name: "Desterrar la prole de [Glossary('Cahlash', 'glossary_wyrm_tt')]"
  the_many_tongues_of_ptah_perk_name: "Las muchas lenguas de Ptah"
  the_scarabs_flight_perk_name: "El vuelo del escarabajo"
  shadow_brethren_perk_name: "Hermanos de las sombras"
  spirit_wall_perk_name: "Muro espiritual"
  the_fleeing_scarab_perk_name: "El escarabajo fugitivo"
  
  ALMS_TO_THE_POOR_PERK_EFFECT: "#flavor El hombre gato puede invocar una pequeña cantidad de dinero o comida, generalmente para dársela a un mendigo. Si el gato usa la \"limosna\" para sí mismo, se queda con un sabor amargo en la boca y las palmas de las manos grasientas.#!"
  SCHOLARS_FRIEND_PERK_EFFECT: "#flavor El Bubasti puede leer cualquier pergamino, tablilla o libro que se le ponga delante, sin importar en qué idioma esté. Los mensajes cifrados permanecen escritos en código.#!"
  BANISH_CAHLASHS_BROOD_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_banish_cahlash_brood')]\n#flavor Al invocar al Padre de los Espíritus Oscuros, un Bubasti puede ordenar a los espíritus de la Wyrm que se marchen. Cada vez que lo hace, su pelaje adquiere un tono más profundo de negro y sus actos se vuelven más... erráticos. Sentir $glossary_wyrm$ detecta un leve rastro de mancha de la Wyrm en la Bastet durante una semana después. #!"
  THE_MANY_TONGUES_OF_PTAH_PERK_EFFECT: "#flavor Este Don permite a los guerreros de Gaia leer y manejar el espíritu del habla, evitando la necesidad de aprender diferentes idiomas y dialectos.#!"
  THE_SCARABS_FLIGHT_PERK_EFFECT: "#flavor Al reunir los elementos de su alma, un Bubasti puede enviarlos fuera de su cuerpo por un tiempo. El cuerpo mismo entra en un trance similar a la muerte hasta que el Escarabajo regresa; aunque no se descompone, todos los demás signos (mágicos y de otro tipo) declaran que el gato ha muerto. El Escarabajo volador se parece a un insecto ordinario a menos que se inspeccione con sentidos mágicos, en cuyo caso brilla intensamente.#!"
  SHADOW_BRETHREN_PERK_EFFECT: "Como [character_interaction|E], permite crear un clon de ti mismo.\n#flavor El Bubasti convoca duplicados sombríos de sí mismo para que le apoyen en la batalla. Estos gatos-sombra se parecen al Bubasti y tienen algunas de sus mismas capacidades. Un espíritu nocturno enseña este Don.#!"
  SPIRIT_WALL_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_spirit_barrier')]\n#flavor Uno de los mayores trucos que aprende un Bubasti es el arte de reunir a espíritus menores de los alrededores y formar con ellos un muro umbral lastimero. Tales magias no hacen que un felino sea querido por los espíritus en general, pero para cuando alcanza este Rango, un Bubasti debería tener juicio suficiente para usar ese poder con sensatez, y poder suficiente para protegerse cuando lo usa.#!"
  MOUSEMAZE_PERK_EFFECT: "Otorga el [modifier|E] [GetModifier('mousemaze_perk_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu enemigo durante los [single_combat_duel_plural|E].\n#flavor Un inquietante hechizo de confusión, este Don desorienta a un objetivo hasta que tropieza en un pánico. Las paredes cambian y se cierran, las sombras se alargan, los sonidos llegan a sus oídos desde todos los rincones y los lugares familiares parecen extraños y amenazadores. Aunque la magia no tiene un efecto real en el entorno de la persona, su terror y confusión lo envían a un frenesí, convirtiéndolo en un blanco fácil para el hombre gato que acecha cerca.#!"
  THE_FLEEING_SCARAB_PERK_EFFECT: "Permite la resurrección si mueres por causas no naturales.\n#F Uno de los secretos tribales más oscuros de los Bubasti, este Don permite a un felino extraer su alma, encarnarla y enviarla fuera de peligro mientras su cuerpo muere. El alma, que a menudo adopta la forma de un escarabajo volador, busca un nuevo cuerpo anfitrión apropiado, se introduce en su boca mientras duerme y \"deposita\" el alma antigua en el nuevo anfitrión. El Bubasti que conoce este secreto prohibido (y existen menos de ocho gatos así) es teóricamente inmortal, aunque tal longevidad se compra con las vidas de otros seres.#!"
  THE_FLEEING_SCARAB_REQUIREMENT: "@warning_icon!#X Necesitas terminar una misión de Susurros (estaciona a un explorador en cualquier reino de la [umbra|E] para encontrar una pista sobre la ubicación e inicia una [umbra_expedition|E] para llegar a ellos y recibir una misión) para desbloquear esta ventaja.#!"
  
  rhinos_favor_perk_name: "Favor del rinoceronte"
  skin_of_jade_perk_name: "Piel de jade"
  ricepaper_walk_perk_name: "Caminar sobre papel de arroz"
  paws_of_the_raging_spirit_tiger_perk_name: "Garras del tigre espiritual furioso"
  makers_charm_perk_name: "Amuleto del hacedor"
  dragonroar_perk_name: "Rugido del dragón"
  call_to_battle_perk_name: "Llamada a la batalla"
  thousand_thunder_strike_perk_name: "Golpe de los mil truenos"
  
  RHINOS_FAVOR_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_rhinos_favor')]\n#flavor Al invocar al espíritu del rinoceronte, la Khan puede hacerse crecer un cuerno en el cráneo. Aunque antiestético, este saliente constituye un arma excelente. #!"
  SKIN_OF_JADE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_skin_of_jade')]\n#flavor Al volverse sólido por pura voluntad, la piel del Khan adquiere la dureza del jade.#!"
  RICEPAPER_WALK_PERK_EFFECT: "#flavor Al sintonizar sus energías internas, el Khan puede caminar sobre una superficie ligera o frágil sin perturbarla, sin importar la forma que vista.#!"
  MAKERS_CHARM_PERK_EFFECT: "Financiar las inspiraciones para artefactos o encargar uno es ahora menos costoso.\n#flavor El Bastet puede dar forma a material que una vez estuvo vivo (¡pero no a los no muertos!) en una variedad de objetos instantáneamente. Los árboles pueden convertirse en refugio, las astas de ciervo en lanzas, las pieles de animales en armaduras y las flores en perfumes.#!"
  DRAGONROAR_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_dragonroar')]\n#flavor Bramando como un trueno, el Khan exhala una bola de fuego sobre sus enemigos. #!"
  THOUSAND_THUNDER_STRIKE_PERK_EFFECT: "#flavor Al golpear sus garras entre sí e invocar a Rahjah o a una de sus manifestaciones (Shiva, Pan Gu, etc.), un tigre enfurecido provoca una onda de choque que puede nivelar edificios o desbaratar espíritus impuros. El Rey de los Gatos, en sus aspectos más regios, enseña este Don a los Khan dignos.#!"
  PAWS_OF_THE_RAGING_SPIRIT_TIGER_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_spirit_tiger_paws')]\n#flavor Al canalizar su chi a través de este Don, el Khan envuelve sus patas o manos en un poder espiritual chisporroteante. Así fortalecido, el hombre tigre puede desgarrar a los enemigos del [spirit_world|E] sin dar el paso lateral, siempre que pueda verlos. #!"
  CALL_TO_BATTLE_PERK_EFFECT: "Otorga a los [knights|E] aliados cuando actúes como [commander|E] durante la [combat_phase|E] o a ti mismo durante los [single_combat_duel_plural|E] el modificador [GetModifier('call_to_battle_perk_modifier').GetNameWithTooltip].\n#flavor El Khan con este Don podría guiar a su manada hasta las puertas del mismísimo Infierno si eso fuera necesario.#!"
  
  bastet_majesty_perk_name: "Majestad"
  submit_perk_name: "Someterse"
  rallying_challenge_perk_name: "Desafío de reagrupamiento"
  fireroar_perk_name: "Rugido de fuego"
  shadow_the_moons_light_perk_name: "Sombrear la luz de la luna"
  king_of_beasts_perk_name: "Rey de las bestias"
  command_the_multitude_perk_name: "Comandar a la multitud"
  rising_sun_perk_name: "Sol naciente"
  royal_privilege_perk_name: "Privilegio real"
  
  BASTET_MAJESTY_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_majesty')]\n#flavor Este Don permite al Simba imponer el respeto de los demás. Lo enseña un espíritu de tiburón. #!"
  SUBMIT_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_submit')]\n#flavor Al señalar con un dedo o una garra a un objetivo, un Simba puede obligarlo a arrodillarse. Solo los de voluntad más fuerte pueden hacer algo más que esforzarse y maldecir en respuesta. Este Don lo enseña una de las crías de Pegaso. #!"
  RALLYING_CHALLENGE_PERK_EFFECT: "Como [character_interaction|E], permite aumentar temporalmente un atributo.\n#flavor Al enviar su poder interno hacia el exterior, un Simba puede reagruparse para lograr cosas que normalmente están fuera de su alcance. Con un grito demoledor, eleva su fuerza física o su fuerza de personalidad a alturas inusuales.#!"
  FIREROAR_PERK_EFFECT: "#flavor Bramando como un trueno, el Simba vomita una bola de fuego sobre sus enemigos. Esta exhalación ardiente continúa ardiendo hasta que ella o su objetivo se consumen.#!"
  SHADOW_THE_MOONS_LIGHT_PERK_EFFECT: "#flavor Hay un momento para todo, incluso para el sigilo. Como cazadores nocturnos, los reyes felinos han perfeccionado un secreto que les permite atenuar la luz a medida que se acercan. Aunque no puede extinguir realmente la luna, este Don sofoca las luces naturales, mágicas y artificiales por igual.#!"
  COMMAND_THE_MULTITUDE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_obedience')]\n#flavor Como el Don de Nivel Uno: Someter, salvo que afecta a todos en un radio de 60 metros y requiere Gnosis. #!"
  KING_OF_BEASTS_PERK_EFFECT: "#flavor La autoridad del Simba se extiende incluso al reino de las bestias, de tal manera que puede comandar la lealtad de todos los animales en un radio de 300 pies. Si tiene éxito, los animales siguen sus órdenes voluntaria e incondicionalmente.#!" 
  RISING_SUN_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_sun_claws')]\nInflige 1 de daño de [sun_damage_short_with_icon|E] a los [knights|E] y [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n#flavor Se dice que el león lleva el sol en el corazón; el dicho puede contener más verdad que poesía. Algunos Simba poderosos pueden hacer que la tierra a su alrededor arda de luz solar, incluso de noche.#!"
  ROYAL_PRIVILEGE_PERK_EFFECT: "Permite elegir otro estilo de vida de dones de raza y tribu sin el rasgo de raza [trait|E] o fe [faith|E] correspondiente.\n#F Este engaño profundamente despreciado permite a un león antiguo y poderoso robar los Dones de otro hombre gato, incluso aquellos que tradicionalmente pertenecen solo a esa tribu o raza. Aunque puede haber Bastet que conozcan el Don, no tienen muchos amigos.#!"
  ROYAL_PRIVILEGE_REQUIREMENT: "@warning_icon!#X Necesitas terminar una misión del Deshacedor (estaciona a un explorador en cualquier reino de la [umbra|E] para encontrar una pista sobre la ubicación e inicia una [umbra_expedition|E] para llegar a ellos y recibir una misión) para desbloquear esta ventaja.#!"
  
  diamond_claws_perk_name: "Garras de diamante"
  impalas_flight_perk_name: "Vuelo del impala"
  walking_between_worlds_perk_name: "Caminar entre mundos"
  dance_of_the_chaya_perk_name: "Danza de los chaya"
  clearwater_passage_perk_name: "Paso de agua clara"
  ghost_caress_perk_name: "Caricia fantasma"
  river_of_blood_perk_name: "Río de sangre"
  all_beasts_under_the_sun_perk_name: "Todas las bestias bajo el sol"
  
  DIAMOND_CLAWS_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_diamond_claws')]\n#flavor Al rastrillar sus garras sobre piedra, acero u otra superficie dura, la Bastet las afila hasta dejarlas como navajas. Lo enseña un espíritu de felino u oso. #!"
  IMPALAS_FLIGHT_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_impalas_flight')]\n#flavor La Bastet duplica su velocidad de carrera. Lo enseña un espíritu de correcaminos o guepardo. #!"
  RIVER_OF_BLOOD_PERK_EFFECT: "#flavor El suelo de África ha sido bañado en sangre durante decenas de miles de años. Con este Don, un Swara convoca esa sangre derramada a través del suelo y le da forma, creando un pozo, un río, una masa de tentáculos o una variedad de otras cosas.#!"
  WALKING_BETWEEN_WORLDS_PERK_EFFECT: "#flavor Algunos relatos afirman que Coyote enseñó a los Bastet a caminar de lado; otros insisten en que el truco fue robado a los Garou. En cualquier caso, este Don permite a un hombre gato entrar en la [umbra|E] como lo hacen los Garou.#!"
  DANCE_OF_THE_CHAYA_PERK_EFFECT: "Desbloquea la [decision|E] $seek_aid_of_the_spirits_decision$.\n#flavor Uno de los mayores favores que una Bastet puede ofrecer a un espíritu es la oportunidad de montar en su piel durante un tiempo. Aunque la mayoría de los felinos nunca considerarían semejante «préstamo», muchos Swara ven la posesión voluntaria como un servicio, no como una carga. Este Don, que comienza con una danza frenética, permite que un chaya entre en la mujer gato y «tome el control» durante un tiempo. El espíritu obtiene un cuerpo que montar y la mujer gato obtiene ciertos... beneficios. La Danza se ve más como un acto de amor o afecto que de servidumbre, un sentimiento que pocas Bastet llegarían a comprender. #!"
  CLEARWATER_PASSAGE_PERK_EFFECT: "Desbloquea la opción de cambio de forma [GetModifier( 'POD_shapeshift_form_water_modifier' ).GetNameWithTooltip|L].\n#flavor Al convertirse en líquido, una Swara puede atravesar barreras sin pasar completamente a la [umbra|E]. Como el agua, se filtra por las grietas, se escurre alrededor de los obstáculos y empapa los materiales.#!"
  GHOST_CARESS_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_ghost_caress')]\nComo [character_interaction|E], te permite infligir una herida al objetivo, de gravedad dependiente de la rareza del artefacto del destinatario reclamado.\n#flavor La Swara puede usar magia simpática para enviar sensaciones a distancia. Aunque la magia no puede dañar físicamente a su objetivo, puede volverlo loco mientras dolores o placeres fantasma lo inundan sin causa aparente. #!"
  ALL_BEASTS_UNDER_THE_SUN_PERK_EFFECT: "Permite el cambio de forma a varias formas animales.\n#flavor El Bastet con este Don puede transformarse en cualquier animal entre los tamaños de un pájaro pequeño y un bisonte. El Bastet gana todos los poderes especiales (vuelo, branquias, veneno, habilidades sensoriales, etc.) del animal que imita.#!"
  not_kinfolk_tt: "#N Los Kinfolk no pueden obtener esta ventaja ni nada por encima de ella.#! \n"
  
  mothers_blessing_curse_perk_name: "Bendición/Maldición de la madre"
  satyrs_wisdom_perk_name: "Sabiduría del sátiro"
  banish_burning_perk_name: "Desterrar el ardor"
  sorcerers_blade_perk_name: "Hoja del hechicero"
  phantasm_perk_name: "Fantasma"
  small_cousin_perk_name: "Primo pequeño"
  chariot_of_lions_perk_name: "Carro de leones"
  the_madness_of_crowds_perk_name: "La locura de las multitudes"
  
  SATYRS_WISDOM_PERK_EFFECT: "#flavor El Ceilican puede tocar cualquier instrumento musical como si se hubiera criado con él en las manos.#!"
  BANISH_BURNING_PERK_EFFECT: "#flavor Una vez que los humanos domesticaron el fuego para mantenerse calientes y para ahuyentar a las bestias salvajes, fueron el antiguo pacto de la humanidad con los espíritus del fuego. Los espíritus de la llama aceptan contener su hambre cuando el Bastet los toca.#!"
  PHANTASM_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_phantasm')]\n#flavor La Bastet crea una ilusión inmóvil que contiene elementos visuales, auditivos, olfativos e incluso táctiles. Lo enseña un espíritu de grano, el llamado «espíritu de espíritus».#!"
  CHARIOT_OF_LIONS_PERK_EFFECT: "#flavor Este Don nada sutil permite a un Ceilican conjurar un carro tirado por enormes felinos. Al igual que el vehículo de la diosa Freyja, este carro está hecho de madera toscamente cortada y cubierto con diseños nórdicos. Los dos enormes felinos que lo tiran corren tan rápido como un coche medio y pueden, en un apuro, llevar al Ceilican y a un pasajero por el aire durante unos momentos. Solo la Señora de la Especie Felina enseña este Don; aprenderlo sin sus bendiciones es un grave insulto.#!"
  MOTHERS_BLESSING_CURSE_PERK_EFFECT: "Como [character_interaction|E], permite otorgar la [GetModifier( 'mothers_blessing_perk_modifier' ).GetNameWithTooltip|L] o la [GetModifier( 'mothers_curse_perk_modifier' ).GetNameWithTooltip|L] a un objetivo embarazada.\n#flavor El folclore sostiene que un gato tenía la capacidad de bendecir o maldecir a una mujer embarazada. En el caso de los Ceilican, esta leyenda es cierta. Un Bastet amable puede ofrecer una bendición a la madre, mientras que uno rencoroso puede dañarla de alguna forma menor pero memorable.#!"
  SORCERERS_BLADE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_bastet_sorcerers_blade')]\n$unlock_enhancing_node$ [GetModifier('sorcerers_blade_modifier').GetNameWithTooltip]\n#flavor La mujer gato puede encantar un arma blanca para que se vuelva sobrenaturalmente potente.#!"
  SMALL_COUSIN_PERK_EFFECT: "Desbloquea la opción de cambio de forma [GetModifier( 'POD_shapeshift_form_cat_modifier' ).GetNameWithTooltip|L].\n#flavor El Ceilican gana la capacidad de cambiar de forma a un gato doméstico. Aunque no es terriblemente útil físicamente, esta forma es muy discreta.#!"
  THE_MADNESS_OF_CROWDS_PERK_EFFECT: "Como [character_interaction|E], permite iniciar una [GetModifier( 'lunatic_summon_modifier' ).GetNameWithTooltip|L].\nPuede reclutar [GetMaA('maniacs').GetName] como [men_at_arms|E].\n#flavor Este Don convoca a una horda de espíritus malévolos para provocar disturbios violentos entre los habitantes de una ciudad. El Don juega con el odio y el miedo de los marginados de la ciudad: los sintecho, los pobres e incluso los animales callejeros.#!"
