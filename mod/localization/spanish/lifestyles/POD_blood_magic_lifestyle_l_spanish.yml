 commuta_perk_name: "Commuta"
 conforma_perk_name: "Conforma"
 scinde_perk_name: "Scinde"
 mutate_perk_name: "Mutar"
 transmutate_perk_name: "Transmutar"

 COMMUTA_PERK_EFFECT: "#flavor Con un gesto de la mano y una sangría ritual de vitae, el hechicero puede usar su vitae para «congelar» líquidos hasta volverlos sólidos o hacer que los sólidos fluyan como líquidos.#!"
 CONFORMA_PERK_EFFECT: "Mejora el [crafting_node|E] de [crafting_forging|E] #V $basic_node_general_improvment_loca$#! aumentando en #P +50%#! la probabilidad de [modifier|E], pero con un coste adicional de [PlayerBlood('(CFixedPoint)1')]#!\n#flavor Al avivar lentamente su vitae, el taumaturgo puede dar forma a los objetos de maneras pequeñas pero importantes, como afilar una hoja o añadir grabados decorativos.#!"
 SCINDE_PERK_EFFECT: "Coste de [reforge|E] y [repair|E] de [artifact|E]: #P -50%#!.\n#flavor Este poder permite remodelar por completo un objeto inanimado a voluntad; el proceso es muy lento, pero permite grandes cambios de forma, como transformar una espada en un escudo.#!"
 MUTATE_PERK_EFFECT: "#flavor Con el poder de Mutar, el taumaturgo puede alterar sutilmente la estructura elemental misma de un objeto natural inanimado. Del hierro al acero, o viceversa. Es imposible afectar a objetos fabricados por el hombre, como monedas o cubertería.#!"
 TRANSMUTATE_PERK_EFFECT: "[bs_spell|E]: Obtén [gold_i|E]25 de [gold|E] a costa de [PlayerBloodValue('bs_transmutate_cost')], [piety_i]20 de [piety|E] y [prestige_i]20 de [prestige|E]\n#flavor La cima de la alquimia: la transmutación permite al lanzador cambiar la estructura elemental de un objeto inanimado, así como su forma, en un solo gesto. De un trozo de plomo a varias monedas de oro. Por desgracia, el proceso de transmutación completa agota enormemente al propio objeto y le causa un daño irreparable que lo reduce a polvo inútil al cabo de unas semanas.#!"

 summon_the_simplest_form_perk_name: "Invocar la Forma más Simple"
 bs_permanency_perk_name: "Permanencia"
 magic_of_the_smith_perk_name: "Magia del Herrero"
 reverse_conjuration_perk_name: "Conjuración Inversa"
 power_over_life_perk_name: "Poder sobre la Vida"

 SUMMON_THE_SIMPLEST_FORM_PERK_EFFECT: "[bs_spell|E]: Obtén un [artifact|E] $POD_rarity_common$ con #V 5#! de [durability|E] máxima a costa de [PlayerBloodValue('bs_summon_the_simplest_form_cost')].\n#flavor En este nivel de maestría, el conjurador puede crear objetos sencillos e inanimados. El objeto no puede tener partes móviles ni estar hecho de varios materiales.#!"
 BS_PERMANENCY_PERK_EFFECT: "Mejora el [bs_spell|E] [GetPerk('summon_the_simplest_form_perk').GetName(GetNullCharacter)] aumentando la [durability|E] máxima hasta #V 25#!.\n#flavor En este nivel, el conjurador ya no necesita pagar costes de Fuerza de Voluntad para mantener un objeto en existencia. El objeto es permanente, aunque solo pueden crearse objetos sencillos.#!"
 MAGIC_OF_THE_SMITH_PERK_EFFECT: "Mejora el [bs_spell|E] [GetPerk('summon_the_simplest_form_perk').GetName(GetNullCharacter)] obteniendo en su lugar un [artifact|E] $POD_rarity_masterwork$.\n#flavor El Vástago puede ahora conjurar objetos complejos de varios componentes y con partes móviles, así como con materiales más exóticos que han «pasado» por un templado más complejo.#!"
 REVERSE_CONJURATION_PERK_EFFECT: "Al destruirse un [artifact|E] obtenido mediante el [bs_spell|E] [GetPerk('summon_the_simplest_form_perk').GetName(GetNullCharacter)], recuperas la mitad de la $POD_energy_blood_icon$ empleada para crearlo.\n#flavor Este poder permite al conjurador «desterrar» a la inexistencia cualquier objeto invocado previamente por este camino.#!"
 POWER_OVER_LIFE_PERK_EFFECT: "[bs_spell|E]: Genera un [army|E] de #V 150#! [GetMaA('animal_simulacra').GetName] durante la [war|E] a costa de [PlayerBloodValue('bs_power_over_life_cost')].\n#flavor Este poder no puede crear vida verdadera, aunque sí invocar impresionantes simulacros. Las criaturas invocadas con él carecen de libre albedrío para actuar por su cuenta y siguen sin pensar las sencillas instrucciones de su conjurador.#!"
 
 contradict_perk_name: "Contradecir"
 subvert_perk_name: "Subvertir"
 dissociate_perk_name: "Disociar"
 addiction_perk_name: "Adicción"
 dependence_perk_name: "Dependencia"

 CONTRADICT_PERK_EFFECT: "[bs_spell|E]: Otorga [GetModifier('contradict_modifier').GetNameWithTooltip] a costa de [PlayerBloodValue('bs_contradict_cost')].\n#flavor El vampiro puede interrumpir los procesos mentales de un sujeto y obligar a la víctima a invertir su rumbo de acción actual. El taumaturgo nunca conoce de antemano con precisión los resultados de Contradecir, pero siempre adoptan la forma de una acción más negativa que la que el sujeto pensaba realizar originalmente.#!"
 SUBVERT_PERK_EFFECT: "[bs_spell|E]: Hace que el objetivo pierda [prestige_i]100 de [prestige|E] y [piety_i]100 de [piety|E] a costa de [PlayerBloodValue('bs_subvert_cost')].\n#flavor Este poder sigue el mismo principio que Contradecir: la liberación del lado oscuro y autodestructivo de un sujeto. Sin embargo, los efectos de Subvertir duran más que el fogonazo momentáneo de la Contradicción. Bajo la influencia de este poder, las víctimas actúan según sus tentaciones reprimidas y persiguen designios que su moral o su autocontrol les prohibirían seguir en circunstancias normales.#!"
 DISSOCIATE_PERK_EFFECT: "[bs_spell|E]: Empeora una [relation|E] aleatoria del objetivo siempre que ninguna de las partes tenga defensas mentales fuertes, a costa de [PlayerBloodValue('bs_dissociate_cost')].\n#flavor «Divide y vencerás» es una máxima que los Tremere comprenden bien, y Disociar es una poderosa herramienta con la que dividir a los enemigos del Clan. Este poder se usa para romper los lazos sociales de las relaciones interpersonales. Hasta el romance más apasionado o la amistad más antigua pueden enfriarse mediante Disociar, y los vínculos personales más débiles pueden destruirse por completo.#!"
 ADDICTION_PERK_EFFECT: "[bs_spell|E]: Otorga al objetivo un [trait|E] negativo de afrontamiento adecuado y aleatorio a costa de [PlayerBloodValue('bs_addiction_cost')].\n#flavor Este poder es una forma mucho más fuerte y potencialmente más dañina de Subvertir. La Adicción crea justo eso en la víctima. Con solo exponer al objetivo a una sensación, sustancia o acción concretas, el lanzador crea una poderosa dependencia psicológica.#!"
 DEPENDENCE_PERK_EFFECT: "Los [courtiers|E] con defensas mentales fuertes volverán automáticamente a tu [court|E] al abandonarla.\n#flavor Muchos antiguos peones del Clan Tremere afirman haber sentido una extraña sensación parecida a la depresión cuando no estaban en presencia de sus amos. Esto suele atribuirse al Vínculo de Sangre, pero a veces es resultado del dominio de Dependencia del vampiro. El poder final del Camino de la Corrupción permite al vampiro atar el alma de su víctima a la suya, engendrando sentimientos de letargo e impotencia cuando la víctima no está en su presencia o no actúa para favorecer sus deseos.#!"

 readiness_perk_name: "Preparación"
 centering_perk_name: "Centramiento"
 one_tracked_mind_perk_name: "Mente Monotemática"
 dual_thought_perk_name: "Pensamiento Dual"
 perfect_clarity_perk_name: "Claridad Perfecta"

 READINESS_PERK_EFFECT: "[bs_spell|E]: Obtén [GetModifier('readiness_modifier').GetNameWithTooltip] a costa de [PlayerBloodValue('bs_contradict_cost')].\n#flavor Usar Disposición permite al lanzador comprender más deprisa una situación comprometida. La lucidez realzada ilumina al lanzador y le permite reaccionar mejor ante situaciones cambiantes y mostrar mayor inventiva.#!"
 CENTERING_PERK_EFFECT: "[bs_spell|E]: Hace que el objetivo pierda #P @stress_loss_icon!20#! de [static_stress|E], #V 10#! si es uno mismo.\n#flavor Al invocar este poder, el taumaturgo provoca en el sujeto una calma súbita e intensa susurrándole palabras tranquilizadoras. Bajo esta serenidad, el objetivo puede concentrarse mejor en las tareas que tiene entre manos e ignorar distracciones y molestias, incluidas lesiones corporales graves.#!"
 ONE_TRACKED_MIND_PERK_EFFECT: "Reduce en #P 5#! la dificultad de las pruebas de [skill|E] en [infiltration_missions|E].\n#flavor Al extender sus poderes a otros individuos, el taumaturgo puede fijar al sujeto en una sola acción. La mente unidireccional del objetivo es tal que ignora todo lo demás que ocurre a su alrededor. Los guardias se distraen fácilmente con este poder, pues su atención queda fijada en otra parte, y la investigación se convierte en una tarea dedicada y concentrada.#!"
 DUAL_THOUGHT_PERK_EFFECT: "Mejora el [bs_spell|E] [GetPerk('readiness_perk').GetName(GetNullCharacter)] otorgando en su lugar [GetModifier('dual_thought_modifier').GetNameWithTooltip].\n#flavor Con el rigor de concentración que exige aprender Taumaturgia, muchos Tremere son capaces de tomar un control rápido y completo de una situación. Con este poder, el taumaturgo puede dividir su atención entre dos tareas completamente distintas sin problemas.#!"
 PERFECT_CLARITY_PERK_EFFECT: "Mejora el [bs_spell|E] [GetPerk('readiness_perk').GetName(GetNullCharacter)] otorgando en su lugar [GetModifier('perfect_clarity_modifier').GetNameWithTooltip].\n#flavor La Claridad Perfecta trae al taumaturgo un instante de visión sin trabas, de tipo zen. Se alcanza el enfoque puro, pensamiento y acción se vuelven uno, y una serenidad mental completa desciende sobre el mago Vástago. Esta lucidez protege al taumaturgo de las influencias tanto internas como externas; ni siquiera la Bestia Interior puede enfurecerse.#!"

 warcry_perk_name: "Grito de Guerra"
 strike_true_perk_name: "Golpe Certero"
 wind_dance_perk_name: "Danza del Viento"
 fearless_heart_perk_name: "Corazón Intrépido"
 comrades_at_arms_perk_name: "Compañeros de Armas"

 WARCRY_PERK_EFFECT: "#flavor Un vampiro al ataque puede concentrar su voluntad, volviéndose menos susceptible al miedo en la batalla o a los poderes de los no-muertos. El vampiro lanza un grito primigenio para iniciar el efecto, aunque se sabe que algunos taumaturgos prefieren pintarse la cara o cortarse.#!"
 STRIKE_TRUE_PERK_EFFECT: "#flavor El vampiro realiza un único ataque, guiado por el poder impío de su Sangre. Este ataque alcanza a su enemigo de forma infalible.#!"
 WIND_DANCE_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_blood_surge')].\n#flavor El taumaturgo invoca el poder de los vientos y se mueve como un borrón. Obtiene una ventaja preternatural para evitar los golpes de sus enemigos, apartándose de su camino antes de que el enemigo tenga ocasión de lanzarlos.#!"
 FEARLESS_HEART_PERK_EFFECT: "#flavor El vampiro aumenta temporalmente sus capacidades como guerrero. Mediante los poderes místicos de la magia de sangre, el personaje se convierte en una poderosa fuerza de combate.#!"
 COMRADES_AT_ARMS_PERK_EFFECT: "Todos los miembros de la [coterie|E] obtendrán los mismos beneficios de este camino que tú. No se acumula.\n#flavor Esta habilidad extiende el poder de las habilidades anteriores del camino. Permite aplicar cualquiera de los efectos previos a un grupo, como una manada o una Partida de Guerra.#!"

 hermetic_sight_perk_name: "Visión Hermética"
 astral_chant_perk_name: "Canto Astral"
 voice_of_command_perk_name: "Voz de Mando"
 entrap_ephemera_perk_name: "Atrapar Efímera"
 duality_perk_name: "Dualidad"

 HERMETIC_SIGHT_PERK_EFFECT: "Puede interactuar con seres de la [umbra|E] estando en la tierra.\n#flavor El vampiro puede percibir el mundo espiritual, ya sea mirando hondo en él o viendo la presencia de espíritus cercanos como una superposición brumosa sobre el mundo material.#!"
 ASTRAL_CHANT_PERK_EFFECT: "Permite formar un [spirit_pact|E] sin conocer el idioma a costa de #N -30#! de aceptación.\n#flavor Los idiomas del mundo espiritual son infinitamente variados y, en su mayoría, incomprensibles para las mentes mortales (e inmortales). El Cántico Astral no enseña al taumaturgo las lenguas de los espíritus, pero le permite entenderlos cuando le hablan y responderles en sus propios idiomas.#!"
 VOICE_OF_COMMAND_PERK_EFFECT: "#flavor Este es quizá el poder más peligroso del arsenal de Manipulación de Espíritus, pues las consecuencias de un fallo pueden ser especialmente desagradables. La Voz de Mando permite al taumaturgo dar órdenes a un espíritu y obligarlo a obedecerlas lo desee o no.#!"
 ENTRAP_EPHEMERA_PERK_EFFECT: "Puede usar [fetish|E] [artifacts|E].\n#flavor Este poder permite a un taumaturgo vincular un espíritu a un objeto físico. Puede hacerse para encarcelar al objetivo, pero con más frecuencia se realiza para crear un fetiche: un artefacto que concede beneficios místicos gracias al espíritu. Los fetiches creados con este poder suelen ser poco fiables y fallar en momentos inoportunos, pues los espíritus que contienen están comprensiblemente descontentos con su situación y aprovecharán cualquier oportunidad para escapar o frustrar a sus captores.#!"
 DUALITY_PERK_EFFECT: "Elimina el coste de entrar en la [umbra|E].\n#flavor El taumaturgo puede ahora interactuar plenamente con el mundo espiritual, un lugar extraño que solo a veces se parece al mundo real. Mientras usa este poder, existe en ambos planos de existencia a la vez. Puede tomar objetos del mundo físico y colocarlos en el mundo espiritual y viceversa. Los seres y los accidentes del paisaje de ambos reinos son sólidos para ella, y puede entablar cualquier tipo de interacción. Incluso puede usar Taumaturgia y otras Disciplinas en cualquiera de los dos mundos.#!"

 vertigo_perk_name: "Vértigo"
 contortion_perk_name: "Contorsión"
 seizure_perk_name: "Convulsión"
 body_failure_perk_name: "Fallo Corporal"
 blood_marionette_perk_name: "Marioneta"

 VERTIGO_PERK_EFFECT: "Al herir con éxito a la víctima, le otorga [GetModifier('vertigo_modifier').GetNameWithTooltip] durante 1 año.\n#flavor El taumaturgo induce una leve desorientación y mareo mediante sutiles manipulaciones en el cuerpo del sujeto. La molestia física es temporal y menor, pero un taumaturgo astuto puede usarla contra sus rivales en los momentos más inoportunos, haciendo que pierdan el aplomo.#!"
 CONTORTION_PERK_EFFECT: "Mejora [GetPerk('vertigo_perk').GetName(GetNullCharacter)] otorgando en su lugar [GetModifier('contortion_modifier').GetNameWithTooltip].\n.#flavor Con un toque, el taumaturgo provoca que un grupo de músculos de su oponente se contraiga involuntariamente, reduciéndolo a ataques de espasmos. Este efecto resulta sumamente desconcertante para el sujeto, pues deja inutilizable la extremidad o el grupo muscular.#!"
 SEIZURE_PERK_EFFECT: "Mejora [GetPerk('vertigo_perk').GetName(GetNullCharacter)] otorgando en su lugar [GetModifier('seizure_modifier').GetNameWithTooltip].\n#flavor La Convulsión hace que el cuerpo estalle en un ataque de convulsiones. Todos los músculos del cuerpo se tensan sin control, mientras la víctima echa espuma por la boca y los espasmos la sacuden con agonía. Un mortal incluso puede morir ahogado cuando su lengua le corta el suministro de aire.#!"
 BODY_FAILURE_PERK_EFFECT: "Tienes una mayor probabilidad de herir a los [knights|E] enemigos durante una [combat_phase|E] como [knight|E].\n#flavor Los taumaturgos que empuñan este espantoso poder obtienen conocimientos devastadores sobre el funcionamiento del cuerpo, lo que permite la parada total de sus sistemas. Esta súbita sobrecarga biológica suele resultar fatal para los mortales y dañina para otros seres sobrenaturales.#!"
 BLOOD_MARIONETTE_PERK_EFFECT: "Al comienzo de la batalla, retira de ella a un [knight|E] enemigo aleatorio.\n#flavor El taumaturgo que invoca la Marioneta obtiene tal dominio sobre el cuerpo de los demás que puede apoderarse mágicamente de otro ser y obligar a su víctima a actuar según sus caprichos. Este control no es tan fino como el mando directo y personal del poder de Dominación de Posesión, pero el cuerpo verdadero del taumaturgo no es tan vulnerable durante la manipulación.#!"

 control_fog_perk_name: "Control de Niebla"
 manipulate_rain_perk_name: "Controlar la Lluvia"
 command_wind_perk_name: "Controlar el Viento"
 summon_storm_perk_name: "Controlar la Tormenta"
 dominate_lightning_perk_name: "Controlar el Rayo"

 CONTROL_FOG_PERK_EFFECT: "Otorga [GetModifier('control_fog_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E].\n[PODUnlocksCombatMove('POD_combat_move_weather_control')].\n#flavor El taumaturgo puede convertir su vitae en una fina niebla que crece rápidamente en tamaño utilizando todo lo cercano como «combustible»#!"
 MANIPULATE_RAIN_PERK_EFFECT: "Mejora el [modifier|E] de batalla de [GetPerk('control_fog_perk').GetName(GetNullCharacter)] otorgando en su lugar [GetModifier('manipulate_rain_modifier').GetNameWithTooltip].\n#flavor Mediante el poder antinatural de la sangre, los vástagos pueden manipular las nubes del cielo para que empiece a llover, o viceversa.#!"
 COMMAND_WIND_PERK_EFFECT: "Mejora el [modifier|E] de batalla de [GetPerk('control_fog_perk').GetName(GetNullCharacter)] otorgando en su lugar [GetModifier('command_wind_modifier').GetNameWithTooltip].\n[PODImprovesCombatMove('POD_combat_move_weather_control')].\n#flavor Tras un ritual bastante tedioso, el vampiro puede dar una sola orden a los vientos cercanos y aumentar su intensidad hasta 50 kilómetros por hora. Cada orden adicional requiere una nueva exposición de vitae y fuerza de voluntad.#!"
 SUMMON_STORM_PERK_EFFECT: "Mejora el [modifier|E] de batalla de [GetPerk('control_fog_perk').GetName(GetNullCharacter)] otorgando en su lugar [GetModifier('summon_storm_modifier').GetNameWithTooltip].\n#flavor Invocando el poder innato de la sangre, el lanzador puede convocar una potente tormenta de un cielo despejado. Una vez invocada, la tormenta escapa a cualquier intento de control o mitigación hasta que termina por sí sola.#!"
 DOMINATE_LIGHTNING_PERK_EFFECT: "Mejora el [modifier|E] de batalla de [GetPerk('control_fog_perk').GetName(GetNullCharacter)] otorgando en su lugar [GetModifier('dominate_lightning_modifier').GetNameWithTooltip].\n[PODImprovesCombatMove('POD_combat_move_weather_control')].\n#flavor Con este poder, un taumaturgo muy diestro puede invocar un rayo que fulmine a sus enemigos, sea cual sea el clima o cualesquiera condiciones externas.#!"

 elemental_strength_perk_name: "Fuerza Elemental"
 wooden_tongues_perk_name: "Lenguas de Madera"
 animate_the_unmoving_perk_name: "Animar lo Inmóvil"
 elemental_form_perk_name: "Forma Elemental"
 summon_elemental_perk_name: "Invocar Elemental"

 ELEMENTAL_STRENGTH_PERK_EFFECT: "#flavor El vampiro puede extraer la fuerza y la resistencia de la tierra, o de los objetos que lo rodean, para aumentar su destreza física sin necesidad de grandes cantidades de sangre.#!"
 WOODEN_TONGUES_PERK_EFFECT: "#flavor Un vampiro puede hablar, aunque de manera limitada, con el espíritu de cualquier objeto inanimado. La conversación puede no ser demasiado interesante, pues a la mayoría de las rocas y sillas les importa poco lo que ocurre a su alrededor, pero el vampiro puede hacerse al menos una idea general de lo que el sujeto ha «experimentado».#!"
 ANIMATE_THE_UNMOVING_PERK_EFFECT: "Desbloquea [GetMaA('golems').GetName] como [men_at_arms|E].\n#flavor Los objetos afectados por este poder se mueven como dicta el vampiro que lo usa. Un objeto no puede realizar una acción completamente inconcebible para algo de su forma; por ejemplo, una puerta no podría saltar de sus goznes y llevar a alguien al otro lado de una calle#!"
 ELEMENTAL_FORM_PERK_EFFECT: "#flavor El vampiro puede adoptar la forma de cualquier objeto inanimado de una masa aproximadamente igual a la suya. Un escritorio, una estatua o un carruaje serían factibles, pero una casa o una pluma estarían más allá de la capacidad de este poder.#!"
 SUMMON_ELEMENTAL_PERK_EFFECT: "Desbloquea [GetMaA('fire_elemental').GetName], [GetMaA('air_elemental').GetName], [GetMaA('earth_elemental').GetName] y [GetMaA('water_elemental').GetName] como [men_at_arms|E].\n#flavor Un vampiro puede invocar a uno de los espíritus tradicionales de los elementos: una salamandra (fuego), una sílfide (aire), un gnomo (tierra) o una ondina (agua). El lanzador puede elegir qué tipo de elemental desea invocar y mandar.#!"

 bs_a_taste_for_blood_perk_name: "Un Sabor a Sangre"
 blood_rage_perk_name: "Furia de Sangre"
 bs_blood_of_potency_perk_name: "Sangre de Potencia"
 bs_theft_of_vitae_perk_name: "Robo de Vitae"
 bs_cauldron_of_blood_perk_name: "Caldero de Sangre"

 BS_A_TASTE_FOR_BLOOD_PERK_EFFECT: "[bs_spell|E]: Descubre el [secret|E] de [Glossary('Diablerista','game_concept_diablerie_desc')] del objetivo, si lo tiene, a costa de [PlayerBloodValue('bs_a_taste_for_blood_cost')].\n#flavor Este poder se desarrolló como medio para poner a prueba la fuerza de un enemigo, una capacidad importantísima en las turbulentas primeras noches del Clan Tremere. Con solo tocar la sangre de su sujeto, el lanzador puede determinar cuánta vitae le queda al sujeto y, si es un vampiro, cuándo se alimentó por última vez y su Generación aproximada.#!"
 BLOOD_RAGE_PERK_EFFECT: "[bs_spell|E]: Obtén o pierde [GetModifier('blood_rage_modifier').GetNameWithTooltip] a costa de [PlayerBloodValue('bs_blood_rage_cost')].\n#flavor Este poder permite a un vampiro obligar a otro Vástago a gastar sangre contra su voluntad. El lanzador debe tocar a su sujeto para que el poder funcione, aunque basta el roce más leve. Un vampiro afectado por este poder podría sentir una oleada física cuando el taumaturgo realza sus Atributos Físicos, podría verse de pronto con aspecto más humano o incluso al borde del frenesí al agotarse místicamente sus reservas de vitae.#!"
 BS_BLOOD_OF_POTENCY_PERK_EFFECT: "[bs_spell|E]: Aumenta la potencia de tu sangre en #V 1#! durante 10 años a costa de [PlayerBloodValue('bs_blood_of_potency_cost')].\n#flavor El taumaturgo obtiene tal control sobre su propia sangre que puede «concentrarla» eficazmente y hacerla más poderosa durante un breve tiempo. En la práctica, puede aumentar temporalmente su propia Potencia de Sangre con este poder.#!"
 BS_THEFT_OF_VITAE_PERK_EFFECT: "#P -1#! de sangre necesaria para saciar el [hunger_with_icon|E].\n#flavor Un taumaturgo que usa este poder succiona vitae de su sujeto. Nunca necesita entrar en contacto con el sujeto: la sangre brota literalmente en un torrente físico desde el sujeto hasta el Vástago (aunque a menudo se absorbe místicamente y no necesita entrar por la boca).#!"
 BS_CAULDRON_OF_BLOOD_PERK_EFFECT: "Inflige #V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0]#! de [POD_aggravated_damage|E] a #V 3#! [knights|E] enemigos aleatorios cuando actúas como [commander|E] durante la [combat_phase|E].\n#flavor Un taumaturgo que usa este poder hierve la sangre de su sujeto en sus venas como el agua en un fogón. El Vástago debe tocar a su sujeto, y es ese contacto el que hace hervir la sangre del sujeto. Este poder siempre es mortal para los mortales y causa un gran daño incluso a los vampiros más poderosos.#!"

 eyes_of_the_sea_perk_name: "Ojos del Mar"
 prison_of_water_perk_name: "Prisión de Agua"
 blood_to_water_perk_name: "Sangre a Agua"
 flowing_wall_perk_name: "Muro Fluente"
 dehydrate_perk_name: "Deshidratar"

 EYES_OF_THE_SEA_PERK_EFFECT: "#flavor El taumaturgo puede asomarse a una masa de agua y ver los sucesos acaecidos sobre ella, en ella o a su alrededor desde la perspectiva del agua. Algunos practicantes más antiguos de este arte afirman que el vampiro comulga con los espíritus de las aguas al usar este poder; los Vástagos más jóvenes se burlan de tales afirmaciones.#!"
 PRISON_OF_WATER_PERK_EFFECT: "[bs_spell|E]: Inicia [pod_combat_encounters_with_icon|E] contra el objetivo; si ganas lo [imprison|E] a costa de [PlayerBloodValue('bs_a_taste_for_blood_cost')] y [prestige_i|E]#N 2000#! de [prestige|E].\n#flavor El taumaturgo puede ordenar a una cantidad de agua suficientemente grande que se anime a sí misma y encarcele a un sujeto. Este poder requiere una cantidad significativa de líquido para ser plenamente eficaz.#!"
 BLOOD_TO_WATER_PERK_EFFECT: "[bs_spell|E]: Hace que un $POD_splat_vampire$ gane #N 3$POD_energy_blood_icon$#! (causa pérdida de sangre a los demás [splats|E]) a costa de [PlayerBloodValue('bs_blood_to_water_cost')].\n#flavor La taumaturga ha alcanzado ya poder suficiente sobre el agua como para transmutar otros líquidos en este elemento básico. El uso más común de este poder es como agresión: con un solo toque, la sangre de la víctima se transforma en agua, debilitando a los vampiros y matando a los mortales en instantes.#!"
 FLOWING_WALL_PERK_EFFECT: "#flavor Las historias sobre la incapacidad de los vampiros para cruzar aguas corrientes pueden derivar en parte de relatos confusos de este poder en acción. El taumaturgo puede animar el agua en un grado aún mayor que con la Prisión de Agua, ordenándole que se alce y forme una barrera infranqueable para casi cualquier ser.#!"
 DEHYDRATE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_dehydrate')].\n#flavor En este nivel de maestría, el taumaturgo puede atacar directamente a objetivos vivos y no vivos extrayéndoles el agua del cuerpo. Las víctimas muertas por este poder dejan tras de sí horribles cadáveres momificados.#!"

 simple_nectar_perk_name: "Néctar Simple"
 nectar_perk_name: "Néctar"
 complex_nectar_perk_name: "Néctar Complejo"
 high_nectar_perk_name: "Néctar Elevado"
 ungodly_nectar_perk_name: "Néctar Impío"

 SIMPLE_NECTAR_PERK_EFFECT: "Como [bs_spell|E], obliga al objetivo a aprender las ventajas de tu $pod_discipline$ hasta 1 punto.\n#weak Al preparar una poción con su propia $pod_vitae$, el rakta-sadhu puede imbuir al bebedor con un nivel de una disciplina o camino#!"
 NECTAR_PERK_EFFECT: "Aumenta el efecto del [bs_spell|E] de [GetPerk('simple_nectar_perk').GetName(GetPlayer)] a 2 puntos.\n#weak Al preparar una poción con su propia $pod_vitae$, el rakta-sadhu puede imbuir al bebedor con dos niveles de una disciplina o camino#!"
 COMPLEX_NECTAR_PERK_EFFECT: "Aumenta el efecto del [bs_spell|E] de [GetPerk('nectar_perk').GetName(GetPlayer)] a 3 puntos.\n#weak Al preparar una poción con su propia $pod_vitae$, el rakta-sadhu puede imbuir al bebedor con tres niveles de una disciplina o camino#!"
 HIGH_NECTAR_PERK_EFFECT: "Aumenta el efecto del [bs_spell|E] de [GetPerk('complex_nectar_perk').GetName(GetPlayer)] a 4 puntos.\n#weak Al preparar una poción con su propia $pod_vitae$, el rakta-sadhu puede imbuir al bebedor con cuatro niveles de una disciplina o camino#!"
 UNGODLY_NECTAR_PERK_EFFECT: "Aumenta el efecto del [bs_spell|E] de [GetPerk('high_nectar_perk').GetName(GetPlayer)] a 5 puntos.\n#weak Al preparar una poción con su propia $pod_vitae$, el rakta-sadhu puede imbuir al bebedor con cinco niveles de una disciplina o camino#!"

 a_sending_of_serpents_perk_name: "Un Envío de Serpientes"
 darkness_of_duat_perk_name: "Oscuridad del Duat"
 suffocation_of_the_tomb_perk_name: "Asfixia de la Tumba"
 the_narrow_house_perk_name: "La Casa Estrecha"
 consignment_to_duat_perk_name: "Envío al Duat"

 A_SENDING_OF_SERPENTS_PERK_EFFECT: "Otorga [GetModifier('a_sending_of_serpents_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_a_sending_of_serpents')].\n#weak Hace que un objetivo alucine que lo atacan serpientes.#!"
 DARKNESS_OF_DUAT_PERK_EFFECT: "Como [bs_spell|E], otorga al objetivo [GetTrait('blind').GetName(GetPlayer)] durante 5 años.\n[PODUnlocksCombatMove('POD_combat_move_darkness_of_duat')].\n#weak Ciega a un sujeto.#!"
 SUFFOCATION_OF_THE_TOMB_PERK_EFFECT: "Como [bs_spell|E], otorga al objetivo [GetModifier('suffocation_of_the_tomb_modifier').GetNameWithTooltip] durante 1 año.\n#weak Impide que la víctima hable o respire.#!"
 THE_NARROW_HOUSE_PERK_EFFECT: "Otorga [GetModifier('the_narrow_house_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_the_narrow_house')].\n#weak Paraliza a un objetivo.#!"
 CONSIGNMENT_TO_DUAT_PERK_EFFECT: "Como [bs_spell|E], mata a un personaje no inmortal, o obliga a un personaje inmortal a entrar en [GetTrait('torpor').GetName(GetPlayer)].\n[PODUnlocksCombatMove('POD_combat_move_consignment_to_duat')].\n#weak Mata a un mortal o pone a un vampiro en letargo.#!"

 whispers_of_the_sands_perk_name: "Susurros de la Arena"
 tongue_of_the_tempter_perk_name: "Lengua del Tentador"
 voice_of_the_prophet_perk_name: "Voz del Profeta"
 lord_of_storms_perk_name: "Señor de las Tormentas"
 dark_invocation_perk_name: "Invocación Oscura"

 WHISPERS_OF_THE_SANDS_PERK_EFFECT: "#weak Comunica a distancia con sus chiquillos o ghouls.#!"
 TONGUE_OF_THE_TEMPTER_PERK_EFFECT: "Como [bs_spell|E], aprende un [secret|E] del objetivo.\n#weak Hace que un sujeto revele un miedo o deseo secreto.#!"
 VOICE_OF_THE_PROPHET_PERK_EFFECT: "Como [bs_spell|E], hace que el objetivo gane opinión hacia ti y pierda [piety|E] y [prestige|E].\n#weak Entrega un mensaje críptico que habla de los deseos más profundos de un oyente.#!"
 LORD_OF_STORMS_PERK_EFFECT: "Otorga [GetModifier('lord_of_storms_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E]\n#weak Invoca una tormenta de arena o una tormenta eléctrica.#!"
 DARK_INVOCATION_PERK_EFFECT: "#weak Coloca una maldición protectora sobre un objeto o lugar.#!"

 beauty_fades_perk_name: "La Belleza se Desvanece"
 trust_withers_perk_name: "La Confianza se Marchita"
 love_dies_perk_name: "El Amor Muere"
 hope_dissolves_perk_name: "La Esperanza se Disuelve"
 thrones_crumble_perk_name: "Los Tronos se Desmoronan"

 BEAUTY_FADES_PERK_EFFECT: "Como [bs_spell|E], otorga al objetivo 50 [stress|E].\n#weak Hace que una obra de arte cause repulsión en quienes la ven.#!"
 TRUST_WITHERS_PERK_EFFECT: "Como [bs_spell|E], el objetivo pierde una relación de [friend|E] aleatoria, o degrada a un [best_friend|E] a [friend|E].\n#weak El objetivo comienza a creer que un amigo o aliado planea traicionarlo.#!"
 LOVE_DIES_PERK_EFFECT: "Como [bs_spell|E], el objetivo pierde una relación de [lover|E] aleatoria, o degrada a un [soulmate|E] a amante potencial.\n#weak Destruye los sentimientos de amor de un sujeto por otro.#!"
 HOPE_DISSOLVES_PERK_EFFECT: "Aumenta la ganancia de [stress|E] del [bs_spell|E] de [GetPerk('beauty_fades_perk').GetName(GetPlayer)] a 100.\n#weak Hace que un sujeto se deprima, creyendo que sus objetivos no se pueden alcanzar.#!"
 THRONES_CRUMBLE_PERK_EFFECT: "Como [bs_spell|E], otorga al objetivo [GetModifier('thrones_crumble_modifier').GetNameWithTooltip].\n#weak Crea desconfianza y hostilidad en un sujeto hacia una figura de autoridad.#!"

 first_taste_perk_name: "Primer Sabor"
 cross_addiction_perk_name: "Adicción Cruzada"
 the_jones_perk_name: "La Necesidad"
 fatal_compulsion_perk_name: "Compulsión Fatal"
 temperance_perk_name: "Templanza"

 FIRST_TASTE_PERK_EFFECT: "Como [bs_spell|E], otorga al objetivo [GetModifier('first_taste_modifier').GetNameWithTooltip] durante 20 años.\n#weak Crea una asociación placentera con una acción menor y repetitiva.#!"
 CROSS_ADDICTION_PERK_EFFECT: "Aumenta la probabilidad de éxito del [bs_spell|E] de [GetPerk('first_taste_perk').GetName(GetPlayer)].\n#weak Cambia temporalmente en qué se fija un adicto.#!"
 THE_JONES_PERK_EFFECT: "Como [bs_spell|E], hace que un objetivo afectado por [GetModifier('first_taste_modifier').GetNameWithTooltip] pierda [piety|E] y [prestige|E].\n#weak Elimina las inhibiciones de un sujeto para entregarse a su adicción.#!"
 FATAL_COMPULSION_PERK_EFFECT: "Como [bs_spell|E], hace que un objetivo afectado por [GetModifier('first_taste_modifier').GetNameWithTooltip] gane [GetModifier('fatal_compulsion_modifier').GetNameWithTooltip] durante 5 años en su lugar.\n#weak Hace que un objetivo sufra daño por no entregarse a su adicción.#!"
 TEMPERANCE_PERK_EFFECT: "Como [bs_spell|E], hace que un objetivo afectado por [GetModifier('first_taste_modifier').GetNameWithTooltip] se convierta en [GetTrait('depressed_1').GetName(GetPlayer)].\n#weak Impide que el sujeto obtenga placer de su adicción.#!"


##Koldunic
#Kraina de Transilvania
 burebistas_throne_perk_name: "Trono de Burebista"
 BUREBISTAS_THRONE_PERK_EFFECT: "\n#flavor El rey Burebista, que aterrorizó a los griegos durante siglos, construyó un gran trono en la cima de una montaña desde el que podía contemplar todas sus tierras y enemigos. Burebista ya no necesitaba su trono y se lo pasó a sus Chiquillos Koldun.#!"
 pietrosus_hospitality_perk_name: "Hospitalidad de Pietrosu"
 PIETROSUS_HOSPITALITY_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_pietrosus_hospitality')].\n\n#flavor Los vientos cortantes y las temperaturas gélidas del Monte Pietrosu matarán a un hombre desprotegido en cuestión de momentos. El Koldun convoca estos poderosos y gélidos vientos para que lo rodeen, dañando a todos los que están cerca. Esto también lo hace inmune al frío y a la fuerza de los vientos.#!"
 the_banks_of_the_basca_perk_name: "Las Orillas del Basca"
 THE_BANKS_OF_THE_BASCA_PERK_EFFECT: "Aumenta enormemente la probabilidad de [imprison|E] a [characters|E] después de un [siege|E] o [raid|E] exitoso en provincias costeras.\n\n#flavor Cuando llegan las lluvias, el Basca se desborda y arrastra pueblos enteros, junto con cualquier persona lo suficientemente imprudente como para buscar terreno más alto. El Koldun que usa este poder lleva consigo la creciente potencia del Basca dondequiera que vaya.#!"
 kupalas_exhalation_perk_name: "Exhalación de Kupala"
 KUPALAS_EXHALATION_PERK_EFFECT: "[bs_spell|E]: Otorga a tu ubicación [GetModifier('kupalas_exhalation_modifier').GetNameWithTooltip] durante 5 años.\n[kraina|E]: Otorga [GetModifier('kupalas_exhalation_modifier2').GetNameWithTooltip] en su lugar.\n[PODUnlocksCombatMove('POD_combat_move_kupalas_exhalation')].\n\n#flavor El Koldun convoca letales gases fríos del suelo. Cualquier llama puede encender estos gases en una terrible explosión. Se cree que estos gases son el aliento de Kupala.#!"
 restless_medias_perk_name: "Medias Inquieto"
 RESTLESS_MEDIAS_PERK_EFFECT: "[bs_spell|E]: Otorga a tu ubicación [GetModifier('weather_magic_earthquake_modifier').GetNameWithTooltip] durante 10 años.\n[kraina|E]: Otorga también a todos los condados circundantes.\n[PODUnlocksCombatMove('POD_combat_move_restless_medias')].\n\n#flavor De vez en cuando, el suelo debajo del pueblo de Medias se agita y revuelve, arrancando edificios de sus cimientos. Los lugareños culpan a los dioses, pero el Koldun sabe que es Kupala, revolviéndose inquieto dentro de su tumba de tierra. Los Koldun de mayor habilidad saben cómo provocar sus agitaciones.#!"

#Kraina del Mar Negro
 danubian_voices_perk_name: "Voces del Danubio"
 DANUBIAN_VOICES_PERK_EFFECT: "\n#flavor El Koldun conoce el verdadero valor del Danubio. Los espíritus del río le hablan, transmitiéndole lo que saben o entregándole mensajes.#!"
 grave_of_the_marea_neagra_perk_name: "Tumba de la Marea Negra"
 GRAVE_OF_THE_MAREA_NEAGRA_PERK_EFFECT: "\n#flavor El Koldun siempre puede descender con seguridad a las profundidades más bajas del Mar Negro, donde puede descansar cómodamente, protegido del sol y del mundo exterior.#!"
 pontos_euxeinos_perk_name: "Pontos Euxeinos"
 PONTOS_EUXEINOS_PERK_EFFECT: "[bs_spell|E]: Cura [POD_aggravated_damage|E] y heridas no permanentes.\n[kraina|E]: Además, gana [GetModifier('pontos_euxeinos_modifier').GetNameWithTooltip] durante 10 años.\n\n#flavor Los griegos una vez llamaron al Mar Negro Pontos Euxeinos, el Mar Hospitalario. Para el Koldun del Mar Negro, ciertamente puede serlo, sosteniéndolo en su abrazo y curándolo incluso de sus peores heridas.#!"
 minions_of_deep_marmora_perk_name: "Secuaces de la Profunda Mármara"
 MINIONS_OF_DEEP_MARMORA_PERK_EFFECT: "[bs_spell|E]: Invoca un regimiento de [GetMaA('water_spirits').GetName] para ayudarte en una guerra.\n[kraina|E]: Invoca un regimiento adicional.\n\n#flavor La leyenda dice que el Koldun Cyzicus descubrió que si derramaba su sangre en el Mar de Mármara, extrañas bestias de las profundidades emergían para hacer su voluntad. Otros Koldun han descubierto que cualquier masa de agua sirve para lo mismo.#!"
 pontos_axeinos_perk_name: "Pontos Axeinos"
 PONTOS_AXEINOS_PERK_EFFECT: "[bs_spell|E]: Reduce los [supplies|E] de un ejército hostil desembarcado en #V 20%#!.\n[kraina|E]: También inflige bajas al ejército.\n[PODUnlocksCombatMove('POD_combat_move_pontos_axeinos')].\n\n#flavor Antes de que los griegos colonizaran su costa sur, llamaban al Mar Negro Pontus Axeinos, el Mar Inhóspito. Para los enemigos del Koldun, puede ser muy inhóspito, ciertamente.#!"


#Kraina de Białowieża
 domain_breach_perk_name: "Violación del Dominio"
 DOMAIN_BREACH_PERK_EFFECT: "\n#flavor El Koldun está tan en sintonía con su dominio que puede detectar cuando un intruso se adentra en sus fronteras.#!"
 fingers_of_bialowieza_perk_name: "Dedos de Białowieża"
 FINGERS_OF_BIALOWIEZA_PERK_EFFECT: "Probabilidad de [imprison|E]: #P +10%#!\nPuede reclutar [GetMaA('animated_tree').GetName] como [men_at_arms|E].\n[PODUnlocksCombatMove('POD_combat_move_fingers_of_bialowieza')].\n\n#flavor El Koldun con este poder ordena a las plantas y árboles cercanos que atrapen y potencialmente inmovilicen a sus víctimas.#!"
 grondrskas_impasse_perk_name: "El Callejón sin Salida de Grondrska"
 GRONDRSKAS_IMPASSE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_grondrskas_impasse')].\n\n#flavor Cuenta el relato que un cazador furtivo se adentró en tierras Tzimisce. No pasó mucho antes de que huyera presa de un pánico terrible. Creía conocer el bosque, pero los árboles se movían a su alrededor, cortándole la salida y conduciéndolo directamente hacia el Koldun que lo esperaba.#!"
 mouth_of_djabalek_perk_name: "Boca de Djabalek"
 MOUTH_OF_DJABALEK_PERK_EFFECT: "Al comienzo de la batalla, retira de ella al [knight|E] enemigo de menor [prowess|E] y aliméntate de él.\n[PODUnlocksCombatMove('POD_combat_move_mouth_of_djabalek')].\n\n#flavor Djabelek es un terrorífico Tzimisce enterrado en algún lugar del Bosque de Białowieża. Se dice que de algún modo continúa alimentándose a pesar de su estado aletargado, abriendo la boca mientras sueña y consumiendo lo que caiga en ella. El Koldun abre la tierra bajo su víctima y la envía abajo para alimentar a Djabelek.#!"
 the_white_tower_perk_name: "La Torre Blanca"
 THE_WHITE_TOWER_PERK_EFFECT: "\n#flavor La Torre Blanca es el regalo de los demonios de la tierra con quienes Djabelek hizo antaño su pacto. Los huesos de todas las víctimas de la kraina de Białowieża emergen por la fuerza de la tierra y envuelven al Koldun en una torre de tierra y huesos.#!"

#Kraina del Pozo
 call_the_children_perk_name: "Llamar a los Niños"
 CALL_THE_CHILDREN_PERK_EFFECT: "Puede reclutar [GetMaA('demonhound').GetName] como [men_at_arms|E].\n\n#flavor Para dominar algo, uno debe aventurarse a conocerlo. Los demonios, al igual que los perros, siempre se esfuerzan por acudir cuando los llaman sus amos.#!"
 heed_the_hell_bound_heart_perk_name: "Escucha el Corazón Atado al Infierno"
 HEED_THE_HELL_BOUND_HEART_PERK_EFFECT: "[bs_spell|E]: Otorga a un [GetTrait('demon').GetName(GetPlayer)] o [GetTrait('witch').GetName(GetPlayer)] [GetModifier('heed_the_hell_bound_heart_modifier').GetNameWithTooltip] durante 5 años.\n[kraina|E]: Otorga [GetModifier('heed_the_hell_bound_heart_modifier2').GetNameWithTooltip] en su lugar.\n\n#flavor Ya sea por bendición o por familiaridad, un Koldun que bebe de su Pozo adquiere un sentido sobrenatural que le alerta cuando la influencia demoníaca está cerca.#!"
 aegis_alighieri_perk_name: "Égida Alighieri"
 AEGIS_ALIGHIERI_PERK_EFFECT: "Gana fuertes defensas mentales contra [GetTrait('demon').GetName(GetPlayer)]s y [GetTrait('witch').GetName(GetPlayer)]s.\nOtorga [GetModifier('aegis_alighieri_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E] si son un [GetTrait('demon').GetName(GetPlayer)] o [GetTrait('witch').GetName(GetPlayer)].\n\n#flavor La Égida Alighieri protege al Koldun de los ataques violadores, las depredaciones y la profanación por parte de fuerzas demoníacas.#!"
 heave_the_host_of_hell_perk_name: "Levantar la Hueste del Infierno"
 HEAVE_THE_HOST_OF_HELL_PERK_EFFECT: "[bs_spell|E]: Inflige #V [EmptyScope.ScriptValue('POD_base_fire_damage')|V0] de daño de Fuego#! a un [GetTrait('demon').GetName(GetPlayer)] o [GetTrait('witch').GetName(GetPlayer)]\n[kraina|E]: Inflige #V [EmptyScope.ScriptValue('POD_double_fire_damage')|V0] de daño de Fuego#! en su lugar.\n\n#flavor Después de aprender a llamar, a sentir y luego a defenderse del daño infernal, el Koldun puede borrar sus cicatrices por completo.#!"
 reap_the_well_perk_name: "Cosechar el Pozo"
 REAP_THE_WELL_PERK_EFFECT: "Puede reclutar [GetMaA('aughisky').GetName] como [men_at_arms|E].\n\n#flavor El Koldun convoca cadenas enganchadas y ensangrentadas de sus manos para atar a un demonio a su servicio.#!"


#Kraina de Enoc
 shroud_of_oblivion_perk_name: "Sudario del Olvido"
 SHROUD_OF_OBLIVION_PERK_EFFECT: "Puede interactuar con personajes al otro lado del Sudario.\n\n#flavor El Koldun arranca un trozo de la tela del [UmbraGlossary('underworld')] para saturar el área que lo rodea con sus atributos.#!"
 spectral_cloak_perk_name: "Capa Espectral"
 SPECTRAL_CLOAK_PERK_EFFECT: "\n#flavor Aprovechando la vista de los muertos, el Koldun aflige a quienes están cerca con un vistazo al mundo de los muertos. La capa oculta al Koldun y ahuyenta a los observadores con terror#!"
 pond_of_malevolent_dread_perk_name: "Estanque de Temor Malévolo"
 POND_OF_MALEVOLENT_DREAD_PERK_EFFECT: "[bs_spell|E]: Invoca dos regimientos de [GetMaA('spectres').GetName] para ayudarte en una guerra.\n[kraina|E]: Invoca cuatro regimientos en su lugar.\n\n#flavor Ubicado justo encima del abismo en el Inframundo, ningún lugar es más gélido, desprovisto de luz, tenebroso o sombrío que el Mar de Sombras, un océano de almas al borde de la aniquilación total. El Koldun forma un conducto para beber de la condena de este mar y liberar su flujo.#!"
 wrath_of_the_tempest_perk_name: "Ira de la Tempestad"
 WRATH_OF_THE_TEMPEST_PERK_EFFECT: "[bs_spell|E]: Otorga a un personaje [stress|E] que aumenta según la cantidad de personajes que has matado.\n[kraina|E]: Además, inflige #V [EmptyScope.ScriptValue('POD_base_lightning_damage')|V0] de daño de Rayo#!.\n\n#flavor El Koldun convoca los estertores de muerte de todos aquellos a los que ha vencido, perforando un agujero en la barrera entre mundos para dejar sangrar la tormenta metafísica.#!"
 hunger_of_the_void_perk_name: "Hambre del Vacío"
 HUNGER_OF_THE_VOID_PERK_EFFECT: "[bs_spell|E]: Otorga a tu ubicación [GetModifier('hunger_of_the_void_modifier').GetNameWithTooltip] durante 10 años.\n[kraina|E]: Además, drena a todos los [GetTrait('mortal').GetName(GetPlayer)]s en la provincia.\n\n#flavor El Koldun encarna las distorsiones de la Tempestad, torturando su propia alma para excavar un pozo de destrucción perfecta en la realidad.#!"

#Genius Loci
 genius_loci_1_perk_name: "Genius Loci Menor"
 GENIUS_LOCI_1_PERK_EFFECT: "Aumenta la probabilidad de éxito de todas las [krainas|E] en #P +10%#!\n\n#flavor El Koldun extiende su conciencia a través de la tierra que pisa.#!\n@warning_icon!#warning Las ventajas de este árbol se obtienen automáticamente al terminar otros caminos de [kraina|E].#!"
 genius_loci_2_perk_name: "Genius Loci Estándar"
 GENIUS_LOCI_2_PERK_EFFECT: "Aumenta la probabilidad de éxito de todas las [krainas|E] en #P +10%#!\nPuede usar [fetish|E] [artifacts|E].\n\n#flavor El Koldun extiende aún más su conciencia, mejorando sus poderes Koldúnicos.#!"
 genius_loci_3_perk_name: "Genius Loci Sostenido"
 GENIUS_LOCI_3_PERK_EFFECT: "Las [krainas|E] y sus [bs_rituals|E] cuestan 1 @blood_icon! menos cuando se lanzan desde su ubicación potenciada.\n\n#flavor El Loci del Koldun se vuelve capaz de sostenerse por sí mismo.#!"
 genius_loci_4_perk_name: "Genius Loci Elevado"
 GENIUS_LOCI_4_PERK_EFFECT: "Aumenta la probabilidad de éxito de todas las [krainas|E] en #P +15%#!\n$countermeasures_unlocks_t3_all_seeing_eye$\n\n#flavor El Loci del Koldun lo ve todo.#!"
 genius_loci_5_perk_name: "Genius Loci de Leyenda"
 GENIUS_LOCI_5_PERK_EFFECT: "Las [krainas|E] y sus [bs_rituals|E] ganan un efecto adicional cuando se lanzan desde su ubicación potenciada.\n\n#flavor El Koldun y la tierra son uno.#!"

#Camino de la Tierra
 grasping_soil_perk_name: "Suelo que Atrapa"
 GRASPING_SOIL_PERK_EFFECT: "Otorga a los [rulers|E] enemigos [GetModifier('grasping_soil_modifier').GetNameWithTooltip] al comienzo de una [war|E].\n\n#flavor El Koldun ordena a la tierra que se levante en una nube de tierra y suba por las piernas de una víctima, inmovilizándola.#!"
 endurance_of_stone_perk_name: "Resistencia de la Piedra"
 ENDURANCE_OF_STONE_PERK_EFFECT: "\n#flavor Al extraer la esencia de la tierra hacia sí mismo, el Koldun puede obtener una medida de su resistencia preternatural#!"
 hungry_earth_perk_name: "Tierra Hambrienta"
 HUNGRY_EARTH_PERK_EFFECT: "\n#flavor El Koldun arrastra a su víctima a la tierra y la aplasta con su implacable agarre.#!"
 root_of_vitality_perk_name: "Raíz de Vitalidad"
 ROOT_OF_VITALITY_PERK_EFFECT: "\n#flavor Un uso mucho menos hostil de la Tierra Hambrienta: en lugar de una agonía aplastante, el cuerpo del objetivo se enriquece con la esencia fértil de la tierra.#!"
 kupalas_fury_perk_name: "Furia de Kupala"
 KUPALAS_FURY_PERK_EFFECT: "[bs_spell|E]: Elimina una [holding|E] en tu ubicación.\n\n#flavor El Koldun despierta la mancha de Kupala con su sangre para que la fuerza arquetípica pueda roer las raíces de las montañas y sacudirse bajo la tierra como el gran dragón de la heráldica Tzimisce.#!"

#Camino del Viento
 breath_of_whispers_perk_name: "Aliento de Susurros"
 BREATH_OF_WHISPERS_PERK_EFFECT: "\n#flavor Incluso en su ausencia, los Koldun infunden un profundo temor en sus boyardos. Este poder lleva las palabras del vampiro en una brisa ligera y regresa con la respuesta del objetivo.#!"
 biting_gale_perk_name: "Vendaval Cortante"
 BITING_GALE_PERK_EFFECT: "Inflige #V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0]#! de [POD_superficial_damage|E] a los [knights|E] y [commanders|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\n\n#flavor El Koldun vengativo invoca un viento cortante que corta un área de su elección.#!"
 breeze_of_lethargy_perk_name: "Brisa de Letargo"
 BREEZE_OF_LETHARGY_PERK_EFFECT: "Otorga [GetModifier('breeze_of_lethargy_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\n\n#flavor Aunque no pueden inducir el sueño inmediato, los vientos evocados por este poder traen un cansancio creciente y un agotamiento entumecedor a través de cada músculo.#!"
 ride_the_tempest_perk_name: "Cabalgar la Tempestad"
 RIDE_THE_TEMPEST_PERK_EFFECT: "\n#flavor Un Koldun que emplea este poder se mueve a velocidades increíbles cabalgando sobre los vientos, infundiendo miedo al aparecer de repente en los distintos pueblos de su dominio.#!"
 fury_of_the_night_sky_perk_name: "Furia del Cielo Nocturno"
 FURY_OF_THE_NIGHT_SKY_PERK_EFFECT: "[bs_spell|E]: Invoca un [GetModifier('weather_magic_storm_modifier').GetNameWithTooltip] en una ubicación.\n\n#flavor Al aplicar una furia magnificada por la sangre y la voluntad, un Koldun puede proyectar toda la medida de su ira en el cielo nocturno. Nubes grises arremolinadas borran estrellas y luna, desatando ráfagas en espiral y un aguacero torrencial de lluvia helada y relámpagos.#!"

#Camino del Agua
 pool_of_lies_perk_name: "Estanque de Mentiras"
 POOL_OF_LIES_PERK_EFFECT: "\n#flavor Este poder versátil crea ilusiones tridimensionales a lo largo de la superficie de una fuente de agua. Cómo se use depende de la creatividad del Koldun.#!"
 watery_haven_perk_name: "Refugio Acuático"
 WATERY_HAVEN_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$\n\n#flavor El Koldun sumerge a su objetivo en una piscina profunda de agua para protegerlo del peligro.#!"
 fog_over_sea_perk_name: "Niebla sobre el Mar"
 FOG_OVER_SEA_PERK_EFFECT: "\n#flavor Moviéndose con la gracia antinatural de un fantasma, el Koldun camina sobre el agua tan fácilmente como sobre la tierra, sin dejar apenas una ondulación que marque su paso.#!"
 minions_of_the_deep_perk_name: "Secuaces de las Profundidades"
 MINIONS_OF_THE_DEEP_PERK_EFFECT: "Puede reclutar [GetMaA('water_elemental').GetName] como [men_at_arms|E].\n\n#flavor Al dejar caer su sangre en un cuerpo de agua, un Koldun puede convocar o despertar elementales de agua encarnados para que lo sirvan.#!"
 doom_tide_perk_name: "Marea de Perdición"
 DOOM_TIDE_PERK_EFFECT: "[bs_spell|E]: Otorga a tu objetivo [GetModifier('doom_tide_modifier').GetNameWithTooltip].\n\n#flavor Muchos barcos yacen en el fondo de los mares, destrozados por los remolinos del Koldun.#!"

#Camino del Fuego
 fiery_courage_perk_name: "Coraje Ardiente"
 FIERY_COURAGE_PERK_EFFECT: "\n#flavor Ningún vampiro puede dominar un elemento que teme, así que este poder atenúa ese miedo hasta reducirlo a una mera brasa.#!"
 combust_perk_name: "Combustión"
 COMBUST_PERK_EFFECT: "\n#flavor Los ojos del Koldun destellan con un vívido naranja de poder hechicero mientras el aire sobrecalentado se enrosca alrededor del objetivo.#!"
 wall_of_magma_perk_name: "Muro de Magma"
 WALL_OF_MAGMA_PERK_EFFECT: "\n#flavor El Koldun levanta la mano y la tierra se parte, lanzando un muro de magma incandescente que se endurece rápidamente en cualquier forma deseada.#!"
 bs_heat_wave_perk_name: "Ola de Calor"
 BS_HEAT_WAVE_PERK_EFFECT: "Inflige #V [EmptyScope.ScriptValue('POD_base_fire_damage')|V0] de fuego#! de daño a los [knights|E] y [commanders|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\n\n#flavor Actuando como conducto de géiseres de vapor, el Koldun canaliza una ráfaga de aire desecante contra una víctima dentro de su línea de visión.#!"
 volcanic_blast_perk_name: "Explosión Volcánica"
 VOLCANIC_BLAST_PERK_EFFECT: "\n#flavor La lava explota del suelo en un enorme géiser por orden del Koldun. La roca fundida se esparce a lo largo de una amplia franja antes de estrellarse contra la tierra y fluir en todas direcciones.#!"

#Camino de la Aflicción
 the_frustrations_of_nestrecha_perk_name: "Las Frustraciones de Nestrecha"
 THE_FRUSTRATIONS_OF_NESTRECHA_PERK_EFFECT: "\n#flavor Nombrado por la diosa de la pena y el fracaso, este poder permite al Koldun arrebatar a un oponente su determinación.#!"
 the_insults_of_krivda_perk_name: "Los Insultos de Krivda"
 THE_INSULTS_OF_KRIVDA_PERK_EFFECT: "[bs_spell|E]: Otorga a tu objetivo un [mental_break|E].\n\n#flavor Con el poder de Krivda, una diosa del odio y la amargura, los insultos del Koldun enfurecen a su objetivo.#!"
 the_weeping_of_kruchina_perk_name: "El Llanto de Kruchina"
 THE_WEEPING_OF_KRUCHINA_PERK_EFFECT: "Otorga 30[stress_i|E] a los [knights|E] enemigos y a su [commander|E] cuando actúas como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E].\n\n#flavor La mirada de un Koldun puede hacer que alguien se sienta tan miserable que no haga más que llorar. Este poder hace más que derramar unas pocas lágrimas, provoca llanto histérico, gemidos y crujir de dientes.#!"
 the_misfortune_of_chernogolov_perk_name: "La Desgracia de Chernogolov"
 THE_MISFORTUNE_OF_CHERNOGOLOV_PERK_EFFECT: "Otorga [GetModifier('the_misfortune_of_chernogolov_modifier').GetNameWithTooltip] al [commander|E] enemigo cuando actúas como [commander|E] durante la [combat_phase|E].\n\n#flavor Con una declaración de que una persona está condenada o destinada a fracasar, el Koldun atrae la atención de Chernogolov, el dios de bigote plateado de la desgracia, hacia su víctima.#!"
 the_starvation_of_marena_perk_name: "El Hambre de Marena"
 THE_STARVATION_OF_MARENA_PERK_EFFECT: "[bs_spell|E]: Inflige #V [EmptyScope.ScriptValue('POD_base_cold_damage')|V0]#! de Daño de [cold_damage_short_with_icon|E] a un [character|E] y otorga a su ubicación un [GetModifier('weather_magic_blizzard_modifier').GetNameWithTooltip].\n\n#flavor Al invocar a la esposa de Kupala, el Koldun convoca el frío y el hambre que son el dominio de Marena. Una ráfaga helada golpea a la víctima y la deja demacrada, como si acabara de sobrevivir al más gélido de los inviernos.#!"



 confer_with_the_blade_perk_name: "Conferir con la Hoja"
 grasp_of_the_mountain_perk_name: "Agarre de la Montaña"
 pierce_steels_skin_perk_name: "Perforar la Piel del Acero"
 razors_shield_perk_name: "Escudo de la Navaja"
 strike_at_the_true_flesh_perk_name: "Golpear la Verdadera Carne"

 CONFER_WITH_THE_BLADE_PERK_EFFECT: "Como [bs_spell|E], gana un modificador de Experiencia de [lifestyle|E] basado en la rareza de tu arma actualmente equipada.\n#weak Ver eventos e informaciones que han sucedido alrededor de un arma.#!"
 GRASP_OF_THE_MOUNTAIN_PERK_EFFECT: "#weak Refuerza místicamente el agarre de tu arma#!"
 PIERCE_STEELS_SKIN_PERK_EFFECT: "#weak Dirige tu arma para destruir cualquier medida protectora del enemigo#!"
 RAZORS_SHIELD_PERK_EFFECT: "#weak Permite desviar proyectiles#!"
 STRIKE_AT_THE_TRUE_FLESH_PERK_EFFECT: "#weak Elude cualquier protección sobrenatural en tu ataque#!"

 maskims_touch_perk_name: "Toque de Maskim"
 breath_of_ereshkigal_perk_name: "Aliento de Ereshkigal"
 nergals_blessing_perk_name: "Bendición de Nergal"
 nergals_wrath_perk_name: "Ira de Nergal"
 ill_wind_perk_name: "Viento Enfermizo"

 MASKIMS_TOUCH_PERK_EFFECT: "Como [bs_spell|E], hace que el objetivo contraiga [GetTrait('ill').GetName(GetPlayer)].\n#weak Causa síntomas de gripe en un objetivo#!"
 BREATH_OF_ERESHKIGAL_PERK_EFFECT: "Como [bs_spell|E], otorga al objetivo una enfermedad no sobrenatural aleatoria.\n#weak Aliento sobre un objetivo, infligiendo una enfermedad menor#!"
 NERGALS_BLESSING_PERK_EFFECT: "Como [bs_spell|E], elimina una enfermedad del objetivo.\n#weak Disminuye los síntomas de una enfermedad patógena#!"
 NERGALS_WRATH_PERK_EFFECT: "Como [bs_spell|E], otorga al objetivo una enfermedad no sobrenatural más grave.\n[PODUnlocksCombatMove('POD_combat_move_nergals_wrath')].\n#weak Inflige una enfermedad a elección a un objetivo#!"
 ILL_WIND_PERK_EFFECT: "Al lanzar [GetPerk('nergals_wrath_perk').GetName(GetPlayer)] sobre ti mismo, genera una epidemia en tu ubicación actual.\n#weak Propaga una enfermedad simplemente con tu presencia cercana#!"

 abyssal_mysticism_level_1_perk_name: "Misticismo Abisal 1"
 abyssal_mysticism_level_2_perk_name: "Misticismo Abisal 2"
 abyssal_mysticism_level_3_perk_name: "Misticismo Abisal 3"
 abyssal_mysticism_level_4_perk_name: "Misticismo Abisal 4"
 abyssal_mysticism_level_5_perk_name: "Misticismo Abisal 5"

 ABYSSAL_MYSTICISM_LEVEL_1_PERK_EFFECT: "#X @warning_icon! Para obtener este [perk|E] debes sacrificar nivel#weak (fila)#! de [GetTrait('obtenebration').GetName(GetNullCharacter)] a través de una [decision|E]#!\nDesbloquea los [bs_rituals|E] de nivel 1 de Misticismo Abisal"
 ABYSSAL_MYSTICISM_LEVEL_2_PERK_EFFECT: "#X @warning_icon! Para obtener este [perk|E] debes sacrificar un nivel #weak (fila)#! de [GetTrait('obtenebration').GetName(GetNullCharacter)] mediante una [decision|E]#!\nDesbloquea los [bs_rituals|E] de nivel 2 de Misticismo Abisal\n[PODUnlocksCombatMove('POD_combat_move_subsume_the_darkness')]"
 ABYSSAL_MYSTICISM_LEVEL_3_PERK_EFFECT: "#X @warning_icon! Para obtener este [perk|E] debes sacrificar un nivel #weak (fila)#! de [GetTrait('obtenebration').GetName(GetNullCharacter)] mediante una [decision|E]#!\nDesbloquea los [bs_rituals|E] de nivel 3 de Misticismo Abisal\n[PODUnlocksCombatMove('POD_combat_move_third_eye_of_rickard')]"
 ABYSSAL_MYSTICISM_LEVEL_4_PERK_EFFECT: "#X @warning_icon! Para obtener este [perk|E] debes sacrificar nivel#weak (fila)#! de [GetTrait('obtenebration').GetName(GetNullCharacter)] a través de una [decision|E]#!\nDesbloquea los [bs_rituals|E] de nivel 4 de Misticismo Abisal"
 ABYSSAL_MYSTICISM_LEVEL_5_PERK_EFFECT: "#X @warning_icon! Para obtener este [perk|E] debes sacrificar un nivel #weak (fila)#! de [GetTrait('obtenebration').GetName(GetNullCharacter)] mediante una [decision|E]#!\nDesbloquea los [bs_rituals|E] de nivel 5 de Misticismo Abisal\n[PODUnlocksCombatMove('POD_combat_move_evocation_of_the_oubliette')]"

 threads_of_the_past_perk_name: "Hilos del Pasado"
 weave_of_the_future_perk_name: "Tejido del Futuro"
 certain_fate_perk_name: "Destino Cierto"
 past_lives_perk_name: "Vidas Pasadas"
 master_of_samsara_perk_name: "Amo del Samsara"
 
 THREADS_OF_THE_PAST_PERK_EFFECT: "Como [bs_spell|E], aprende un secreto aleatorio del objetivo.\n#flavor Recibe una visión del pasado del objetivo#!"
 WEAVE_OF_THE_FUTURE_PERK_EFFECT: "Como [bs_spell|E], otorga al objetivo [GetModifier('weave_of_the_future_modifier').GetNameWithTooltip] durante 5 años\n#flavor Recibe presagios de eventos por venir#!"
 CERTAIN_FATE_PERK_EFFECT: "Como [bs_spell|E], otorga al objetivo [GetModifier('certain_fate_modifier').GetNameWithTooltip] durante 5 años\n#flavor Recibe una visión cierta de un evento futuro#!"
 PAST_LIVES_PERK_EFFECT: "Como [bs_spell|E], otorga al objetivo un [modifier|E] que da +4 a una [skill|E] aleatoria ([GetModifier('past_lives_diplomacy_modifier').GetNameWithTooltip]) durante 10 años\n[PODUnlocksCombatMove('POD_combat_move_past_lives')]\n#flavor Recibe una biografía moderadamente detallada de tu encarnación anterior#!"
 MASTER_OF_SAMSARA_PERK_EFFECT: "Como [bs_spell|E], aumenta una [skill|E] aleatoria en 1 a costa de un [modifier|E] permanente ([GetModifier('master_of_samsara_penality_modifier').GetNameWithTooltip])\nCuando te maten, otorga a tu asesino [GetModifier('master_of_samsara_modifier').GetNameWithTooltip] durante 50 años\n#flavor Obtén poder limitado sobre la futura encarnación de un objetivo#!"

 hand_of_ptah_perk_name: "Mano de Ptah"
 hand_of_khnum_perk_name: "Mano de Knum"
 hand_of_anubis_perk_name: "Mano de Anubis"
 hand_of_thoth_perk_name: "Mano de Thoth"
 hand_of_heka_perk_name: "Mano de Heka"
 
 HAND_OF_PTAH_PERK_EFFECT: "Como [bs_spell|E], daña un [artifact|E] aleatorio del objetivo. Si se lanza sobre ti mismo, repara en lugar de dañar.\n#flavor Daña o repara a distancia un objeto de 90 kg o menos#!"
 HAND_OF_KHNUM_PERK_EFFECT: "Como [bs_spell|E], otorga a un objetivo [GetTrait('mortal').GetName(GetNullCharacter)] [GetTrait('maimed').GetName(GetNullCharacter)] o [GetTrait('wounded_3').GetName(GetNullCharacter)].\n#flavor Daña o repara remotamente un animal, mortal u objeto de 453 kg o menos#!"
 HAND_OF_ANUBIS_PERK_EFFECT: "Mejora [GetPerk('hand_of_khnum_perk').GetName(GetPlayer)] permitiéndole apuntar a [splats|E] que poseen cuerpos materiales.\n[PODUnlocksCombatMove('POD_combat_move_hand_of_anubis')]\n#flavor Daña o repara a distancia criaturas sobrenaturales corpóreas u objetos de 2 toneladas o menos#!"
 HAND_OF_THOTH_PERK_EFFECT: "Mejora [GetPerk('hand_of_khnum_perk').GetName(GetPlayer)] eliminando las limitaciones de [character|E]\n#flavor Daña o repara a distancia criaturas sobrenaturales incorpóreas u objetos de 9 toneladas o menos#!"
 HAND_OF_HEKA_PERK_EFFECT: "Mejora [GetPerk('hand_of_khnum_perk').GetName(GetPlayer)] aumentando la probabilidad de éxito.\n#flavor Aplica a distancia una Disciplina u otro poder mágico a criaturas, o daña o repara objetos de 45 toneladas o menos#!"

 humiliation_perk_name: "Humillación"
 loss_perk_name: "Pérdida"
 peril_perk_name: "Peligro"
 enemy_perk_name: "Enemigo"
 the_eye_that_wounds_perk_name: "El Ojo que Hiere"
 
 HUMILIATION_PERK_EFFECT: "Como [bs_spell|E], otorga al objetivo [GetModifier('humiliation_modifier').GetNameWithTooltip] durante 5 años\n[PODUnlocksCombatMove('POD_combat_move_humiliation')]\n#flavor Causa mala suerte a una víctima en su siguiente acción#!"
 LOSS_PERK_EFFECT: "Como [bs_spell|E], destruye un [artifact|E] no único aleatorio del objetivo\n#flavor Causa que una víctima pierda una propiedad valiosa#!"
 PERIL_PERK_EFFECT: "Como [bs_spell|E], otorga al objetivo [GetModifier('peril_modifier').GetNameWithTooltip] durante 5 años\n[PODUnlocksCombatMove('POD_combat_move_peril')]\n#flavor Hace que una víctima sufra un accidente peligroso#!"
 ENEMY_PERK_EFFECT: "Como [bs_spell|E], obliga a un gobernante/miembro del consejo/cortesano vecino aleatorio a convertirse en [rival|E] del objetivo\n#flavor Causa que una víctima pierda aliados#!"
 THE_EYE_THAT_WOUNDS_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_the_eye_that_wounds')]\n#flavor Inflige daño a tu objetivo#!"

 ravages_of_the_beast_perk_name: "Estragos de la Bestia"
 weight_of_the_sun_perk_name: "Peso del Sol"
 abated_tooth_perk_name: "Diente Amortiguado"
 treacherous_bonds_perk_name: "Lazos Traicioneros"
 the_withering_of_ages_perk_name: "El Marchitamiento de las Eras"
 
 RAVAGES_OF_THE_BEAST_PERK_EFFECT: "[bs_spell|E]: Obliga a un $POD_splat_vampire$ objetivo a entrar en Frenesí.\n#flavor Desde el momento en que un Vástago es Abrazado, sufre la rabia y los instintos de una Bestia primigenia; es la primera maldición que acompaña a la Transformación. Si se la provoca, la Bestia Interior arrastra al vampiro a un frenesí demencial y enloquecido. Algunos Vástagos luchan por mantener a raya a sus Bestias, mientras que otros disfrutan cabalgando las olas de esta furia violenta. Un taumaturgo que invoca este poder insta a la Bestia a emerger en su objetivo y desata a un asesino desbocado.#!"
 WEIGHT_OF_THE_SUN_PERK_EFFECT: "[bs_spell|E]: Otorga al $POD_splat_vampire$ objetivo [GetModifier('weight_of_the_sun_modifier').GetNameWithTooltip].\n#flavor Una maldición concomitante del Abrazo es la incapacidad de permanecer despierto durante el día. Obligado a mantener una existencia furtiva por la noche, un Vástago pierde la oportunidad de volver a ver el sol. Cuando ese globo blanco y ardiente asciende por el este, los Vástagos sienten su peso aplastante, que los hunde en el sopor. Este poder permite a un taumaturgo invocar el mismo tipo de letargo que impone el sol durante las largas horas del día.#!"
 ABATED_TOOTH_PERK_EFFECT: "[bs_spell|E]: Otorga al $POD_splat_vampire$ objetivo [GetModifier('abated_tooth_modifier').GetNameWithTooltip].\n#flavor Todos los vampiros necesitan sangre para sobrevivir; dependen de recipientes mortales para su sustento y del Beso para mantener sus no-vidas. Cuando los Vástagos se alimentan, suelen extender los colmillos para atravesar con más facilidad la carne de su víctima. Al invocar este poder, un taumaturgo embota místicamente los colmillos de un sujeto, privándolo de la capacidad de usarlos con eficacia. Sus colmillos quedan tan romos que se vuelve casi imposible perforar la carne, lo que obliga al Vástago afectado a buscar métodos alternativos de alimentación.#!"
 TREACHEROUS_BONDS_PERK_EFFECT: "[bs_spell|E]: Un $POD_splat_ghoul$ aleatorio o Chiquillo del objetivo perderá #N 20#! de [opinion|E] sobre él.\n#flavor El taumaturgo que invoca este poder suscita un estado emocional instantáneo, inducido por el odio, en el esclavo de un reinante; donde antes había amor, ahora solo el aborrecimiento guía sus emociones. Este poder crea un contragolpe en la sangre del objetivo y retuerce temporalmente cualquier vínculo al que esté sometido, desde el más reciente hasta los forjados a lo largo de años.#!"
 THE_WITHERING_OF_AGES_PERK_EFFECT: "Al comienzo de la batalla, otorga [GetModifier('the_withering_of_ages_modifier').GetNameWithTooltip] a 3 [knights|E] $POD_splat_vampire$ aleatorios cuando actúas como [commander|E] durante la [combat_phase|E].\n#flavor Este poder devastador altera la sangre de los vampiros y suspende temporalmente las propiedades que sustentan su inmortalidad. Un taumaturgo que establece contacto físico con una víctima puede despojarla de su atemporalidad y dejarla brevemente decrépita. En cuestión de instantes, el cuerpo del objetivo revelará la verdad de su verdadera edad, marchitándose y encogiéndose para reflejar el peso de sus años.#!"

 force_bolt_perk_name: "Proyectil de Fuerza"
 manipulate_perk_name: "Manipular"
 bs_flight_perk_name: "Vuelo"
 repulse_perk_name: "Repulsar"
 control_perk_name: "Control"
 
 FORCE_BOLT_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_force_bolt')].\n#flavor Con un simple gesto, el hechicero puede invocar hasta 2 proyectiles de fuerza pura y dispararlos a velocidades suficientes para alterar el paso de su enemigo y derribarlo.#!"
 MANIPULATE_PERK_EFFECT: "#flavor El control del vampiro sobre su poder aumenta hasta el punto de poder manipular objetos a distancia. El movimiento a distancia es bastante lento y aún no es posible lanzar objetos con fuerza suficiente para causar daño.#!"
 BS_FLIGHT_PERK_EFFECT: "#flavor El taumaturgo puede usar este poder para levitar él mismo o a otro y volar por los cielos sin que la tierra lo perturbe. La velocidad de vuelo la determina la velocidad básica del vampiro, pero puede superarse gastando fuerza de voluntad.#!"
 REPULSE_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_force_bolt')].\n#flavor Un vampiro con este poder puede impulsar un objeto o un ser con una fuerza enorme en la dirección que desee el lanzador. La aceleración puede ser tan lenta o tan rápida como quiera el lanzador, pero la velocidad máxima no puede superar los 30 kilómetros por hora.#!"
 CONTROL_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_force_bolt')].\n#flavor La cúspide de este camino: el Control permite a los vástagos manipular un objeto desde una distancia de hasta 5 kilómetros y con una precisión comparable a la de sostenerlo directamente en la mano.#!"
 bs_candle_perk_name: "Vela"
 bs_palm_of_fire_perk_name: "Palma de fuego"
 bs_campfire_perk_name: "Hoguera de campamento"
 bs_bonfire_perk_name: "Pira"
 bs_inferno_perk_name: "Infierno"
 BS_CANDLE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_fire_control')].\n#flavor El Vástago puede pactar una alianza temporal con su mayor enemigo e invocar una pequeña llama, como la de una vela, en la punta del dedo. El fuego no quema al invocador ni a nadie más, pero provocará las reacciones psicológicas habituales en otros vampiros.#!"
 BS_PALM_OF_FIRE_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_fire_control')].\n#flavor El vampiro puede prender fuego a su propia palma; las llamas no dañan al invocador, pero sí a cualquiera que las toque.#!"
 BS_CAMPFIRE_PERK_EFFECT: "#flavor El taumaturgo puede, con un simple toque, hacer que un objeto inflamable estalle en llamas. El fuego creado de este modo dañará a todo, incluido el invocador.#!"
 BS_BONFIRE_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_fire_control')].\n#flavor En este nivel, el taumaturgo puede prender el aire mismo y dar al aire ardiente formas diversas.#!"
 BS_INFERNO_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_inferno')].\n#flavor En momentos de gran apuro, el invocador puede prender su propia vitae y liberarla sobre el mundo en un majestuoso infierno; el fuego así creado causará un daño terrible a todo, incluido el invocador.#!"

 

 sight_of_the_jackal_perk_name: "Vista del Chacal"
 weigh_the_virtues_perk_name: "Pesar las Virtudes"
 pharaohs_sentry_perk_name: "Centinela del Faraón"
 imbue_with_the_grace_of_anubis_perk_name: "Imbuir con la Gracia de Anubis"
 the_sorcery_of_life_perk_name: "La Hechicería de la Vida"
 
 SIGHT_OF_THE_JACKAL_PERK_EFFECT: "Puede interactuar con personajes al otro lado del Manto.\n[PODUnlocksCombatMove('POD_combat_move_sight_of_the_jackal')].\n#flavor Toma conciencia de los wraiths a tu alrededor#!"
 WEIGH_THE_VIRTUES_PERK_EFFECT: "Como [bs_spell|E], otorga a un objetivo $POD_splat_wraith$ encarcelado [GetModifier('weigh_the_virtues_modifier').GetNameWithTooltip] permitiendo más [bs_spells|E] de este [bs_path|E]\n#flavor Aprende sobre crímenes o actos heroicos de un muerto o no-muerto#!"
 PHARAOHS_SENTRY_PERK_EFFECT: "Como [bs_spell|E], sacrifica un objetivo $POD_splat_wraith$ con [GetModifier('weigh_the_virtues_modifier').GetNameWithTooltip] para invocar un ejército de [GetMaA('pharaohs_sentry').GetName].\n#flavor Vincula un fragmento de un wraith a un cadáver para que ejecute un solo comando.#!"
 IMBUE_WITH_THE_GRACE_OF_ANUBIS_PERK_EFFECT: "#flavor Reanima un cadáver y lo imbuye con un propósito singular vinculado a sus actos virtuosos o villanos#!"
 THE_SORCERY_OF_LIFE_PERK_EFFECT: "Como [bs_spell|E], convierte a un objetivo $POD_splat_wraith$ con [GetModifier('weigh_the_virtues_modifier').GetNameWithTooltip] de un $POD_splat_wraith$ en una $POD_splat_mummy$ Plaga con un coste de [GetModifier('the_sorcery_of_life_modifier').GetNameWithTooltip] durante 20 años y una enorme pérdida de [piety|E] si tu [faith|E] no permite $POD_splat_demon$\n#flavor Una versión atenuada del Rito Plaga, el hechicero crea una especie de proto-Momia Plaga#!"

 bestowment_of_scales_perk_name: "Concesión de Escamas"
 suffer_for_jormungandr_perk_name: "Sufrir por Jörmungandr"
 swallow_the_tail_perk_name: "Tragarse la Cola"
 cycle_of_the_midgard_serpent_perk_name: "Ciclo de la Serpiente de Midgard"
 apeps_transformation_perk_name: "Transformación de $glossary_wyrm_apep$"
 
 BESTOWMENT_OF_SCALES_PERK_EFFECT: "Como [bs_spell|E], otorga a un miembro de [POD_herd|E] objetivo [GetModifier('bestowment_of_scales_modifier').GetNameWithTooltip] durante 20 años\n#flavor Cura a un ghoul más rápido haciendo crecer piel escamada sobre sus heridas#!"
 SUFFER_FOR_JORMUNGANDR_PERK_EFFECT: "Como [bs_spell|E], otorga a un objetivo [GetTrait('scaly').GetName(GetNullCharacter)] así como [GetModifier('suffer_for_jormungandr_modifier').GetNameWithTooltip] mientras también aumenta una [skill|E] aleatoria en 5\n#flavor Otorga a un ghoul rasgos reptiles#!"
 SWALLOW_THE_TAIL_PERK_EFFECT: "Como [bs_spell|E], gana una cantidad aleatoria de 1 a 4 puntos de Sangre mientras hiere a toda tu [court|E]\n[PODUnlocksCombatMove('POD_combat_move_swallow_the_tail')]\n#flavor Atrae hacia ti la sangre derramada de tu entorno#!"
 CYCLE_OF_THE_MIDGARD_SERPENT_PERK_EFFECT: "Disminuye el coste de [lifestyle_experience|E] de enseñar disciplinas en #p -100%#!\n#flavor Otorga a un ghoul la capacidad de usar tus disciplinas#!"

 cycle_of_the_midgard_serpent_perk_tt: "Gracias a [GetPerk('cycle_of_the_midgard_serpent_perk').GetName(GetPlayer)], ¡enseñar $pod_discipline$ es gratis!"
 APEPS_TRANSFORMATION_PERK_EFFECT: "Como [bs_spell|E], sacrifica a tu $POD_splat_ghoul$ para ganar [GetModifier('apeps_transformation_modifier').GetNameWithTooltip] acumulable\n#flavor Transforma a uno de tus ghouls en una gran serpiente capaz de entender el habla humana#!"


 saut_allah_perk_name: "Saut Allah"
 SAUT_ALLAH_PERK_EFFECT: "Como [bs_spell|E], reduce el estrés de un objetivo y le otorga [GetModifier('saut_allah_modifier').GetNameWithTooltip] durante 10 años.\n\n#weak El lanzador fortifica a sus compañeros Ashirra para las dificultades venideras.#!"
 nuzra_allah_perk_name: "Nuzra Allah"
 NUZRA_ALLAH_PERK_EFFECT: "Otorga [GetModifier('nuzra_allah_modifier').GetNameWithTooltip] a tu oponente durante [single_combat_duel_plural|E].\n\n#weak Un poder defensivo que protege al lanzador del daño visible.#!"
 ruh_allah_perk_name: "Ruh Allah"
 RUH_ALLAH_PERK_EFFECT: "Compromiso con facción [faction_commitment|E] de [vassal|E]: #P -30#!\n\n#weak El Ruh Allah ayuda a un Cainita a recuperar el control de sí mismo y de los que lo rodean.#!"
 RUH_ALLAH_FACTION_REASON: "[GetPerk('ruh_allah_perk').GetName(GetPlayer)]: $VALUE|0+=$"
 ghadub_allah_perk_name: "Ghadub Allah"
 GHADUB_ALLAH_PERK_EFFECT: "Inflige a todos los gobernantes del bando opuesto [GetModifier('ghadub_allah_modifier').GetNameWithTooltip] al comenzar una [war|E] como atacante o defensor principal.\nComo [bs_spell|E], fuerza una [white_peace|E] entre tú y el objetivo.\n\n#weak Permite detener los ataques sin necesidad de contacto visual.#!"
 kubda_allah_perk_name: "Kubda Allah"
 KUBDA_ALLAH_PERK_EFFECT: "Como [bs_spell|E], gana un [strong_hook|E] sobre el objetivo y hiérelo si fallas.\n\n#weak Aplasta la no-muerte de un oponente y oblígalo a someterse. El lanzador debe estar suficientemente restringido para usar el poder para bien.#!"

 hikma_allah_perk_name: "Hikma min Allah"
 HIKMA_ALLAH_PERK_EFFECT: "#weak Mediante una introspección prolongada, el Ashirra puede enfocar su mente para resolver problemas.#!"
 idrak_allah_perk_name: "Idrak' min Allah"
 IDRAK_ALLAH_PERK_EFFECT: "Como [bs_spell|E], aprende todos los [schemes|E] y [secrets|E] de un personaje.\n\n#weak A través del poder de la oración, obtén información sobre tus enemigos.#!"
 sultat_nabi_perk_name: "Sultat el-Nabi"
 SULTAT_NABI_PERK_EFFECT: "Como [bs_spell|E], obliga a un personaje a darte aleatoriamente @gold_icon!, @prestige_icon!, un [inventory_artifact|E] Común, o un [inventory_artifact|E] Famoso.\n\n#weak Obliga al sujeto a obedecer una frase corta que no comprenda más de diez palabras.#!"
 sawt_nabi_perk_name: "Sawt el-Nabi"
 SAWT_NABI_PERK_EFFECT: "#weak El lanzador puede comunicarse con cualquier Cainita que conozca, independientemente de la distancia.#!"
 nar_iman_perk_name: "Nar el-Iman"
 NAR_IMAN_PERK_EFFECT: "Como [bs_spell|E], hiere a un personaje 3 veces y le otorga [GetModifier('nar_iman_modifier').GetNameWithTooltip] durante 10 años.\n\n#weak Explota la debilidad inherente de los vampiros en asuntos de fe, socavando la determinación del objetivo e infligiendo daño tanto mental como físico.#!"

 eyes_of_the_earth_perk_name: "Ojos de la Tierra"
 EYES_OF_THE_EARTH_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n#flavor El vampiro \"ve\" todo lo que sucede alrededor de su refugio gracias a los espíritus de la hierba, los árboles, las rocas y los animales de los alrededores.#!"
 roots_of_power_perk_name: "Raíces de Poder"
 ROOTS_OF_POWER_PERK_EFFECT: "#flavor El practicante Siélico extrae el poder latente en la tierra.#!"
 arbor_of_protection_perk_name: "Árbol de Protección"
 ARBOR_OF_PROTECTION_PERK_EFFECT: "#flavor El vampiro busca refugio dentro de la madera viva de los árboles.#!"
 course_of_the_beast_perk_name: "Curso de la Bestia"
 COURSE_OF_THE_BEAST_PERK_EFFECT: "Desbloquea varias formas de cambio de forma animal.\n#flavor El vampiro puede adoptar la forma de cualquier animal que exista dentro de su dominio.#!"
 way_of_the_stone_perk_name: "Camino de la Piedra"
 WAY_OF_THE_STONE_PERK_EFFECT: "Desbloquea la opción de cambio de forma [GetModifier('POD_shapeshift_form_stone_dolmen_modifier').GetNameWithTooltip].\n#flavor El vampiro se transforma en un gran dolmen de piedra. Las leyendas de piedras que caminan y se mueven durante la noche provienen de la práctica de este potente arte.#!"

 see_the_dead_perk_name: "Ver a los Muertos"
 SEE_THE_DEAD_PERK_EFFECT: "$POD_can_summon_wraith_trigger_loca$\n#flavor Los fantasmas de los muertos pueden ser vistos y reconocidos por el usuario.#!"
 repel_the_angry_dead_perk_name: "Repeler a los Muertos Enfadados"
 REPEL_THE_ANGRY_DEAD_PERK_EFFECT: "Puede [POD_banish|E] $POD_splat_wraith_plural$\nOtorga [GetModifier('repel_the_angry_dead_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúas como [commander|E] durante la [combat_phase|E], o a tu oponente durante [single_combat_duel_plural|E] si es un [GetTrait('wraith').GetName(GetPlayer)].\n#flavor Con este poder, los fantasmas y wraiths hostiles pueden ser desterrados del área.#!"
 command_the_freshly_dead_perk_name: "Comandar a los Recién Muertos"
 COMMAND_THE_FRESHLY_DEAD_PERK_EFFECT: "$POD_can_bind_wraith_trigger_loca$\n$POD_can_command_wraith_trigger_loca$\n#flavor El usuario puede ordenar a cualquier fantasma que pueda ver que lo obedezca.#!"
 army_of_souls_perk_name: "Ejército de Almas"
 ARMY_OF_SOULS_PERK_EFFECT: "Puede reclutar [GetMaA('spectres').GetName] como [men_at_arms|E].\n#flavor El practicante Siélico usa este poder para levantar una tropa espectral para que actúe como defensora o para enviar advertencias a sus enemigos.#!"
 walk_the_road_of_shadows_perk_name: "Caminar el Camino de las Sombras"
 WALK_THE_ROAD_OF_SHADOWS_PERK_EFFECT: "#flavor El vampiro puede cruzar al [UmbraGlossaryLocalized('shadowlands','Inframundo')] y aparecer como un wraith sólido.#!"