l_spanish:
 game_concept_wu_tan_lifestyle: "Wu Tan"
 game_concept_wu_tan_lifestyle_desc: "Los Wu Tan son las Artes de los extraños Fae orientales: los Hsien. Cada una se basa en uno de los elementos clásicos de Oriente."
 game_concept_metal_soul: "Alma de Metal"
 game_concept_metal_soul_desc: "El Alma de Metal contiene el sentido de la justicia, la honestidad y el juego limpio de una persona. Los jueces, los justicieros, los activistas de derechos humanos y los defensores de los derechos civiles tienen almas de metal fuertes."
 game_concept_wood_soul: "Alma de Madera"
 game_concept_wood_soul_desc: "El Alma de Madera es responsable de la moralidad de una persona. Controla la lujuria y la empatía. Todas las criaturas vivas poseen un alma de madera. Aunque la vida se alimenta de la vida, también abarca la compasión. Las enfermeras, los atletas, los médicos y la mayoría de las madres poseen almas de madera fuertes."
 game_concept_water_soul: "Alma de Agua"
 game_concept_water_soul_desc: "El Alma de Agua abarca la fe de una persona en los demás y en los poderes del universo. También corresponde a la fidelidad y la confianza. Los capitalistas, los Señores del Crimen y quienes aman ser objeto de lealtad y poder tienen grandes almas de agua, igual que los verdaderamente fieles."
 game_concept_fire_soul: "Alma de Fuego"
 game_concept_fire_soul_desc: "El Alma de Fuego regula el sentido de la corrección y la comprensión de los modales y los códigos de conducta. Controla el sentido del deber y el afán de hacer cumplir las leyes de la sociedad. Los policías e incluso los funcionarios del gobierno pueden poseer almas de fuego fuertes."
 game_concept_earth_soul: "Alma de Tierra"
 game_concept_earth_soul_desc: "El Alma de Tierra de una criatura sintiente rige la sabiduría, la perspicacia, la comprensión y el sentido común. Rige la capacidad de tomar decisiones sabias. Los líderes, sacerdotes y consejeros suelen tener poderosas Almas de Tierra."

