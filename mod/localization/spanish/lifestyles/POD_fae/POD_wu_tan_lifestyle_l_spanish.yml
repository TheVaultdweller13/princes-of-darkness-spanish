 READ_METAL_SOUL_PERK_EFFECT: "#F Comulgar con el [metal_soul|E] de una persona te dirá si ha hablado con sinceridad o si ignora lo que es justo.#!"
 COMMUNE_WITH_METAL_PERK_EFFECT: "#F Como otros objetos elementales, los de metal tienen sentidos limitados y formas limitadas de comunicarse.#!"
 TIEH_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F El Alquimista puede hablar con los Espíritus del Metal, siempre que se les pueda encontrar.#!"
 NURTURE_DIMINISH_METAL_SOUL_PERK_EFFECT: "#F Ampliar el [metal_soul|E] puede hacer que una persona diga la verdad. Disminuirlo facilita mentir.#!"
 INCREASE_DECREASE_METAL_ATTRIBUTES_PERK_EFFECT: "#F El Alquimista puede afectar a la Percepción o la Destreza del objetivo.#!"
 TIEH_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F Llamar a un Barco Dragón asociado al Metal es útil cuando la Línea del Dragón que sigue ha sido cubierta por un ferrocarril o si el Nido del Dragón al que se viaja o del que se parte está asociado al Metal o a la Justicia.#!"
 SUMMON_DISPEL_TIEH_SHEN_PERK_EFFECT: "Puedes reclutar [GetMaA('metal_elemental').GetName] como [men_at_arms|E].\n#F Un Alquimista del Metal puede invocar o disipar a un espíritu de metal.#!"
 TIEH_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F El metal es quizá el segundo objeto más fácil de plegar y también práctico.#!"
 METAL_FORM_PERK_EFFECT: "Desbloquea la opción de transformación [GetModifier( 'POD_shapeshift_form_metal_modifier' ).GetNameWithTooltip|L].\n#F Este es un I Chih común tanto para los Chu-ih-yu como para los Tanuki, que tienden a ser marciales, y la defensa de una piel de metal o el poder demoledor de un puño de metal resultan útiles.#!"
 PATHS_OF_IRON_PERK_EFFECT: "#F Cable de cobre, conductos metálicos o vigas de acero de edificios... las Sendas del Metal son muchas, al menos en las ciudades.#!"
 TIEH_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Como [character_interaction|E], te permite despertar [true_jade|E] para almacenar Chi.\n#F El Alquimista puede despertar el Jade Blanco.#!"
 MOVE_METAL_PERK_EFFECT: "#F Un truco útil para el guerrero al que le han arrebatado el arma de la mano.#!"
 SHAPE_SUNDER_METAL_PERK_EFFECT: "#F Los grandes obreros de la Alquimia del Metal son reconocidos artesanos y fabrican hermosas espadas y otras armas.#!"
 SUMMON_DISPEL_METAL_PERK_EFFECT: "#F Cuando necesitas un arma y no te importa cuál te toque, esta habilidad puede resultar útil.#!"
 TIEH_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F A este nivel de poder un Maestro puede volver el acero tan blando como el oro o el oro tan duro como el acero.#!"
 TRANSMUTE_METAL_PERK_EFFECT: "Como [character_interaction|E], te permite gastar Chi para obtener [gold|E].\n#F Con esta habilidad un metal puede convertirse por completo en otro metal.#!"
 READ_WOOD_SOUL_PERK_EFFECT: "#F Las [Concept('wood_soul','Almas de Madera')|E] comunican el estado de salud de un ser, entre otras cosas.#!"
 COMMUNE_WITH_WOOD_PERK_EFFECT: "#F Como la mayoría de los elementos, la madera y sus correspondencias solo pueden dar información limitada.#!"
 LIN_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F El Alquimista es capaz de hablar con los Lin Shen, siempre que estén manifiestos o que el hsien tenga la capacidad de atravesar el Muro.#!"
 NURTURE_DIMINISH_WOOD_SOUL_PERK_EFFECT: "#F Ampliar el alma puede crear lujuria, mientras que disminuirla puede causar impotencia.#!"
 INCREASE_DECREASE_WOOD_ATTRIBUTES_PERK_EFFECT: "#F El Alquimista puede aumentar o disminuir los Atributos de Apariencia o Fuerza.#!"
 LIN_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F El Alquimista puede invocar un barco dragón que lo lleve a lo largo de una línea del dragón de un nido del dragón al siguiente.#!"
 SUMMON_DISPEL_LIN_SHEN_PERK_EFFECT: "Puedes reclutar [GetMaA('wood_elemental').GetName] como [men_at_arms|E].\n#F El Alquimista puede invocar y disipar Espíritus de Madera, lo que incluye espíritus de plantas, pero no de animales.#!"
 LIN_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F El Alquimista puede ocultar dentro de su propio cuerpo un objeto regido por la Madera.#!"
 WOOD_FORM_PERK_EFFECT: "Desbloquea la opción de transformación [GetModifier( 'POD_shapeshift_form_wood_modifier' ).GetNameWithTooltip|L].\n#F El alquimista puede convertir todo o parte de su cuerpo en madera, lo que le permite recibir o repartir más daño en el combate cuerpo a cuerpo.#!"
 PATHS_OF_WOOD_PERK_EFFECT: "#F Finas redes de raíces, hongos y musgo crean una gran calzada por la que el alquimista puede viajar.#!"
 LIN_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Como [character_interaction|E], te permite despertar [true_jade|E] para almacenar Chi.\n#F El alquimista puede despertar el Jade Azul o Verde.#!"
 MOVE_WOOD_PERK_EFFECT: "#F Este I Chih permite mover objetos de madera de forma similar a la psicoquinesis.#!"
 SHAPE_SUNDER_WOOD_PERK_EFFECT: "#F Los artesanos de la madera pueden usar esta habilidad para crear hermosas artesanías o destruir objetos de madera.#!"
 SUMMON_DISPEL_WOOD_PERK_EFFECT: "#F El shinma puede invocar o disipar madera.#!"
 LIN_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F A este nivel se podría volver el roble tan blando como el pino, o los pétalos de flor o la hierba tan duros como el roble con la misma delgadez.#!"
 TRANSMUTE_WOOD_PERK_EFFECT: "#F Transmutar una madera en otra puede tener un uso limitado, pero si el cuerpo humano está regido por este Elemento, cabría transformar un árbol en un humano.#!"
 READ_WATER_SOUL_PERK_EFFECT: "#F Comulgar con el [water_soul|E] ayuda a calibrar la lealtad, la confianza, etc. de una persona...#!"
 COMMUNE_WITH_WATER_PERK_EFFECT: "#F Todos los elementos físicos tienen límites a la hora de comunicarse. El agua podría hablar del sabor de alguien que nada en ella o de su nivel de confianza en sí mismo o de si abandonó a otra persona en el agua para que se ahogara por ser desleal.#!"
 SHUI_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F Con este I Chih el alquimista puede hablar con los Shui Shen.#!"
 NURTURE_DIMINISH_WATER_SOUL_PERK_EFFECT: "#F Los líderes astutos usan este efecto para crear lealtad en sus seguidores o para quitarse los seguidores de otro.#!"
 INCREASE_DECREASE_WATER_ATTRIBUTES_PERK_EFFECT: "#F Con estas invocaciones el Alquimista puede bendecir o maldecir a un objetivo modificando su Atributo de Manipulación o Resistencia.#!"
 SHUI_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F Un alquimista usaría Shui Tan para invocar un barco Dragón si la Línea del Dragón atraviesa el agua o el cielo.#!"
 SUMMON_DISPEL_SHUI_SHEN_PERK_EFFECT: "Puedes reclutar [GetMaA('water_elemental').GetName] como [men_at_arms|E].\n#F Con esta habilidad un alquimista puede ejercer cierto control sobre los Shui Shen.#!"
 SHUI_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F Esto parece una habilidad bastante improbable de usar con el Agua, pero podría ser muy útil en efectos de cohorte, quizá plegando cantimploras.#!"
 WATER_FORM_PERK_EFFECT: "Desbloquea la opción de transformación [GetModifier( 'POD_shapeshift_form_water_modifier' ).GetNameWithTooltip|L].\n#F En el debate sobre los Wu Tan se afirma que las formas elementales siguen cumpliendo las leyes de la física.#!"
 PATHS_OF_WATER_PERK_EFFECT: "#F Moverse por el agua es obviamente algo práctico y, para quienes soporten lo desagradable que resulta, hay alcantarillas por todas partes en las ciudades.#!"
 SHUI_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Como [character_interaction|E], te permite despertar [true_jade|E] para almacenar Chi.\n#F El Alquimista puede despertar el Jade Negro.#!"
 MOVE_WATER_PERK_EFFECT: "#F Con este I Chih el Alquimista podría provocar un Alud, detener el flujo de sangre de un objetivo o sacar el agua de una piscina para salvar a una víctima que se ahoga y, si ya fuera tarde, podría extraer el agua de los pulmones de la víctima.#!"
 SHAPE_SUNDER_WATER_PERK_EFFECT: "#F Se piensa enseguida en abrir un mar. También se podría hacer que el agua se alargue para agarrar a alguien y ahogarlo. Esculpir hielo es fácil con este I Chih.#!"
 SUMMON_DISPEL_WATER_PERK_EFFECT: "#F Disipar el aire de los pulmones de alguien puede ser devastador y sacarlo de la habitación a espaldas de alguien puede causar un efecto de vacío que puede ser bastante útil.#!"
 SHUI_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F Con este efecto se podría dar al agua dulce el punto de congelación del agua salada o hacer que un gas nocivo no fuera más dañino que el vapor de agua.#!"
 TRANSMUTE_WATER_PERK_EFFECT: "#F Poder convertir agua o salmuera en sangre resulta práctico cuando no hay suministros de emergencia cerca.#!"
 READ_FIRE_SOUL_PERK_EFFECT: "#F Al comulgar con un [fire_soul|E], el shinma puede determinar los significados ocultos de la etiqueta y de sus infracciones.#!"
 COMMUNE_WITH_FIRE_PERK_EFFECT: "#F El fuego en sí es un elemento difícil de comulgar porque no permanece mucho tiempo en un sitio. Un rayo, un incendio forestal... duran poco.#!"
 HOU_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F El alquimista puede hablar con cualquier Hou Shen que se encuentre.#!"
 NURTURE_DIMINISH_FIRE_SOUL_PERK_EFFECT: "#F Al disminuir el [fire_soul|E], el Nyan puede hacer a una persona más susceptible a sus avances, mientras que el Chu Jung puede ampliar las [Concept('fire_soul','Almas de Fuego')|E] de sus cortes para crear un efecto muy parecido al primer nivel de Sovereign.#!"
 INCREASE_DECREASE_FIRE_ATTRIBUTES_PERK_EFFECT: "#F Al aumentar su Carisma e Ingenio, el Alquimista puede volverse tan popular y rápido como los grandes actores de artes marciales o, al disminuirlos, dejar a su objetivo tan socialmente inepto que nunca recupere su posición a los ojos de su corte.#!"
 HOU_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F Con este I Chih, el alquimista puede invocar un Barco Dragón para viajar por Líneas del Dragón de Luz o de Magma.#!"
 SUMMON_DISPEL_HOU_SHEN_PERK_EFFECT: "Puedes reclutar [GetMaA('fire_elemental').GetName] como [men_at_arms|E].\n#F Como dice el nombre, el Alquimista puede disipar o invocar a un elemental de Fuego.#!"
 HOU_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F Por desgracia, a un Alquimista del Fuego le resulta casi imposible usar esta habilidad sin un efecto mixto. Además, ninguna de las Cohortes del Fuego es especialmente buena almacenando Fuego. La tecnología, como los teléfonos móviles, los ordenadores o las linternas, tiende a requerir alquimia de Fuego y de Metal para afectarla, y esto causa sus propias dificultades, pues el Fuego es Adversario del Metal.#!"
 FIRE_FORM_PERK_EFFECT: "Desbloquea la opción de transformación [GetModifier( 'POD_shapeshift_form_fire_modifier' ).GetNameWithTooltip|L].\n#F Las reglas generales de esta habilidad dicen que el fuego debe obedecer las leyes de la física... que necesita combustible.#!"
 PATHS_OF_FIRE_PERK_EFFECT: "#F Aunque a primera vista parece relativamente inútil (¿quién necesita viajar por el fuego salvo en un incendio?), a medida que la electricidad y la fibra óptica se extienden por el Reino Medio, también lo hacen las sendas del Fuego.#!"
 HOU_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Como [character_interaction|E], te permite despertar [true_jade|E] para almacenar Chi.\n#F Con esta habilidad el Alquimista del Fuego puede despertar el Jade Rojo.#!"
 MOVE_FIRE_PERK_EFFECT: "Ya no sufres heridas por fuego.\n#F Aunque esta habilidad puede parecer al principio limitada a la piroquinesis, a este nivel se incluye la capacidad de doblar la luz, lo que permite efectos como la invisibilidad o incluso la creación de hologramas e ilusiones que solo incluyen la vista.#!"
 SHAPE_SUNDER_FIRE_PERK_EFFECT: "#F Combinado con la Alquimia del Metal se podrían manipular objetos tecnológicos.#!"
 SUMMON_DISPEL_FIRE_PERK_EFFECT: "Hiere a los [knights|E] y [commanders|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E], si son vampiros (u otros sobrenaturales que temen el sol).\nAplica el [modifier|E] [GetModifier('summon_dispel_fire_perk_modifier').GetNameWithTooltip] a los [knights|E] enemigos cuando actúes como [commander|E] durante la [combat_phase|E], o a tu rival durante los [single_combat_duel_plural|E].\n#F Aunque el Alquimista no puede controlar de dónde viene el Fuego, poder hacer caer fuego del cielo o llevar luz o incluso luz solar adonde no la había tiene sus ventajas.#!"
 HOU_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F Una persona de inclinación científica sabe que la Electricidad está regida por el Fuego y que el electromagnetismo es la fuerza real.#!"
 TRANSMUTE_FIRE_PERK_EFFECT: "#F De Luz a Fuego. De Electricidad a Luz. De Luz a Calor. De Magma a Luz. Todo esto es posible.#!"
 READ_EARTH_SOUL_PERK_EFFECT: "#F La gente a menudo dice más o menos de un tema de lo que sabe. Meditar sobre el [earth_soul|E] de una persona puede revelarlo.#!"
 COMMUNE_WITH_EARTH_PERK_EFFECT: "#F El alquimista puede hablar con los objetos de Tierra o de Piedra, etc... pero los objetos inanimados no tienen todos los sentidos que tienen los humanos.#!"
 DI_TAN_SPEAK_WITH_JIMU_TENNO_PERK_EFFECT: "#F El Alquimista puede hablar con los Di Shen.#!"
 NURTURE_DIMINISH_EARTH_SOUL_PERK_EFFECT: "#F Ampliar el [earth_soul|E] de una persona la ayudará a tomar decisiones sabias, mientras que Disminuirlo hará más difícil tomar decisiones sabias.#!"
 INCREASE_DECREASE_EARTH_ATTRIBUTES_PERK_EFFECT: "#F El Alquimista puede aumentar o disminuir el Atributo de Inteligencia de su objetivo.#!"
 DI_TAN_SUMMON_THE_DRAGON_BOAT_PERK_EFFECT: "#F El Alquimista puede invocar un transporte a lo largo de una Línea del Dragón que atraviese la Tierra o las montañas.#!"
 SUMMON_DISPEL_DI_SHEN_PERK_EFFECT: "Puedes reclutar [GetMaA('earth_elemental').GetName] como [men_at_arms|E].\n#F El Alquimista puede invocar y ordenar a los Di Shen.#!"
 DI_TAN_THE_ENFOLDED_OBJECT_PERK_EFFECT: "#F El Alquimista puede ocultar dentro de su propio cuerpo un objeto regido por la tierra.#!"
 EARTH_FORM_PERK_EFFECT: "Desbloquea la opción de transformación [GetModifier( 'POD_shapeshift_form_earth_modifier' ).GetNameWithTooltip|L].\n#F El Alquimista puede cambiar temporalmente todo o parte de su cuerpo en Tierra.#!"
 PATHS_OF_EARTH_PERK_EFFECT: "#F El Alquimista puede viajar a través de cualquiera de los elementos asociados a la Tierra.#!"
 DI_TAN_AWAKEN_TRUE_JADE_PERK_EFFECT: "Como [character_interaction|E], te permite despertar [true_jade|E] para almacenar Chi.\n#F El Alquimista puede despertar el Jade Amarillo.#!"
 MOVE_EARTH_PERK_EFFECT: "#F El Alquimista puede mover objetos ligados a la Tierra como con la Psicoquinesis.#!"
 SHAPE_SUNDER_EARTH_PERK_EFFECT: "#F Aunque este poder puede tener muchas aplicaciones creativas, también puede usarlo un Komuko enfurecido para crear terremotos, mientras que los benévolos pueden crear nuevos pasos por las montañas.#!"
 SUMMON_DISPEL_EARTH_PERK_EFFECT: "#F Para esas ocasiones en que debes tener ese diamante reluciente en la cámara acorazada.#!"
 DI_TAN_EXCHANGE_PROPERTIES_PERK_EFFECT: "#F Con este I Chih la piedra puede volverse tan maleable como la arcilla y los diamantes tan quebradizos como el talco.#!"
 TRANSMUTE_EARTH_PERK_EFFECT: "Como [character_interaction|E], te permite gastar Chi para obtener [prestige|E].\n#F Con este efecto un juguetón Hanuman puede convertir un puñado de guijarros en gemas... hasta que la magia se acaba y el receptor se da cuenta de que lo han engañado.#!"
 ART_SHAPECHANGE_PERK_EFFECT: "Permite transformarte en varias formas animales.\n#F Alterar el rostro, el sexo, la raza o la especie.#!"
 VISAGE_OF_DEAD_PERK_EFFECT: "#F Este efecto Yin permite al hsien matar efectivamente su cuerpo durante un período de tiempo.#!"
 AXIS_OF_TIME_PERK_EFFECT: "#F El Hsien puede reducir el control del tiempo sobre él y acelerar su propio movimiento a través del tiempo.#!"
 THE_MUTABLE_FURIES_PERK_EFFECT: "#F El hsien puede manipular sus valores de Chi.#!"
 THE_TYPHOONS_EYE_PERK_EFFECT: "#F El T'ai Chi otorga al shinma el poder de atravesar tormentas indemne.#!"
 THE_BENEVOLENT_HAND_OF_JADE_PERK_EFFECT: "#F Este I Chih vuelve probable lo improbable...#!"
 BACKSIDE_OF_THE_MONKEY_KING_PERK_EFFECT: "#F Este I Chih vuelve improbable lo probable...#!"
 FORTIFY_THE_WALL_PERK_EFFECT: "Desbloquea la opción Manipular el Muro en el panel de la [umbra|E].\n#F El portador de la llave puede reforzar temporalmente el Muro de un lugar.#!"
 UNLOCK_THE_JADE_PORTAL_PERK_EFFECT: "#F Para abrir el Muro y viajar más allá de él.#!"