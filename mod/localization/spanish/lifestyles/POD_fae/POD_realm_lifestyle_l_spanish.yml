 REALM_ACTOR_1_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre un [friend|E], [lover|E], [courtier|E], [direct_vassal|E], miembro de casa, un personaje sobre el que tengas una fuerte [title_claim|E] o un [strong_hook|E], o un personaje cuyo [secret|E] criminal conozcas.\nAdemás, el personaje no debe tener ninguna mala relación, [war|E] ni [truce|E] contigo ni estar encarcelado por ti."
 REALM_ACTOR_2_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre un [friend|E], [lover|E], [courtier|E], [guest|E], [vassal|E], [liege|E], miembro de la dinastía, un personaje sobre el que tengas un [title_claim|E] o un [hook|E], o un personaje cuyo [secret|E] conozcas.\nAdemás, el personaje no debe tener ninguna mala relación, [war|E] ni [truce|E] contigo ni estar encarcelado por ti."
 REALM_ACTOR_3_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre un personaje con cualquier buena relación, [courtier|E], [guest|E], [vassal|E], [liege|E], miembro de la dinastía, [ally|E], un personaje sobre el que tengas una reclamación o un [hook|E], o un personaje cuyo [secret|E] conozcas.\nAdemás, el personaje no debe tener ninguna mala relación ni [war|E] contigo."
 REALM_ACTOR_4_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre cualquier personaje siempre que no sea un [rival|E] ni esté en [war|E]."
 REALM_ACTOR_5_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre cualquier personaje, incluso un [rival|E] o durante una [war|E]."
 REALM_FAE_1_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre sobrenaturales menores o mortales con poderes menores."
 REALM_FAE_2_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre Changelings."
 REALM_FAE_3_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre Fae."
 REALM_FAE_4_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre la mayoría de los sobrenaturales o mortales con poderes poderosos."
 REALM_FAE_5_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] incluso sobre el sobrenatural más raro."
 REALM_PROP_1_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre artefactos comunes/de maestría varios/de corte."
 REALM_PROP_2_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre artefactos comunes/de maestría."
 REALM_PROP_3_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre artefactos famosos/ilustres no únicos."
 REALM_PROP_4_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre artefactos famosos únicos."
 REALM_PROP_5_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre artefactos ilustres únicos."
 REALM_NATURE_1_PERK_EFFECT: "Puedes lanzar [cantrips|E] sobre materiales orgánicos sin vida."
 REALM_NATURE_2_PERK_EFFECT: "Puedes lanzar [cantrips|E] sobre material vegetal orgánico vivo."
 REALM_NATURE_3_PERK_EFFECT: "Puedes lanzar [cantrips|E] sobre animales vivos no sintientes."
 REALM_NATURE_4_PERK_EFFECT: "Puedes lanzar [cantrips|E] sobre fenómenos naturales."
 REALM_NATURE_5_PERK_EFFECT: "Puedes lanzar [cantrips|E] sobre elementos naturales en estado puro."
 REALM_SCENE_1_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre un personaje a la distancia aproximada de un reino pequeño (por ejemplo: Gales de punta a punta).\nPuedes lanzar [cantrips|E] de área a escala de condado."
 REALM_SCENE_2_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre un personaje a la distancia aproximada de un reino mediano (por ejemplo: Irlanda de punta a punta).\nPuedes lanzar [cantrips|E] de área a escala de ducado."
 REALM_SCENE_3_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre un personaje a la distancia aproximada de un reino grande (por ejemplo: Francia de punta a punta).\nPuedes lanzar [cantrips|E] de área a escala de reino."
 REALM_SCENE_4_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre un personaje a la distancia aproximada de un reino enorme (por ejemplo: el Sacro Imperio Romano de izquierda a derecha).\nPuedes lanzar [cantrips|E] de área a escala de imperio."
 REALM_SCENE_5_PERK_EFFECT: "Ahora puedes lanzar [cantrips|E] sobre cualquier personaje del mapa.\nPuedes lanzar [cantrips|E] de área a escala global."
 REALM_TIME_1_PERK_EFFECT: "Los modificadores de [cantrip|E] ahora duran #V 1#! año en lugar de #V 4#! meses.\nReduce el enfriamiento de [cantrip|E] a 3/4."
 REALM_TIME_2_PERK_EFFECT: "Los modificadores de [cantrip|E] ahora duran #V 2#! años en lugar de #V 1#! año.\nReduce el enfriamiento de [cantrip|E] a la mitad."
 REALM_TIME_3_PERK_EFFECT: "Los modificadores de [cantrip|E] ahora duran #V 5#! años en lugar de #V 2#! años.\nReduce el enfriamiento de [cantrip|E] a 1/4."
 REALM_TIME_4_PERK_EFFECT: "Los modificadores de [cantrip|E] ahora duran #V 10#! años en lugar de #V 5#! años.\nReduce el enfriamiento de [cantrip|E] a una unidad."
 REALM_TIME_5_PERK_EFFECT: "Los modificadores de [cantrip|E] ahora duran para siempre.\nYa no hay enfriamiento de [cantrip|E]."
 
