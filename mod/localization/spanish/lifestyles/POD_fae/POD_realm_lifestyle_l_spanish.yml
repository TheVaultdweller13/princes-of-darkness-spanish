l_spanish:
 game_concept_realm_lifestyle: "Reino"
 game_concept_realm_lifestyle_desc: "Los seis aspectos del mundo por los que los kithain tienen afinidad, que se aplican directamente a quién o qué puedes afectar. Sin conocer los reinos adecuados, un kithain es incapaz de afectar nada. Los reinos son una parte necesaria del lanzamiento de un [cantrip|E]."
 
 realm_lifestyle_name: "Reino"
 realm_lifestyle_desc: "Céntrate en aspectos del mundo por los que los kithain tienen afinidad."
 monthly_realm_lifestyle_xp_gain_mult: "[experience|E] mensual del [lifestyle|E] de Reinos"
 
 realm_actor_focus: "Enfoque en Actor"
 realm_actor_focus_modifier: "[GetFocus('realm_actor_focus').GetName]"
 realm_actor_focus_desc: "Actor es el reino conectado con todos los seres mundanos, con una correlación directa con lo bien que los conoces."
 realm_actor_focus_effect_desc: "Centrarse en Actor otorga:"
 
 realm_fae_focus: "Enfoque en Fae"
 realm_fae_focus_modifier: "[GetFocus('realm_fae_focus').GetName]"
 realm_fae_focus_desc: "Fae trata con otros seres del [UmbraGlossary('dreaming')]. Afectar a otros Changelings, a los Nobles Sidhe, Adhene, Quimeras, o incluso controlar la propia magia Changeling, todo cae bajo el reino de Fae."
 realm_fae_focus_effect_desc: "Centrarse en Fae otorga:"
 
 realm_prop_focus: "Enfoque en Prop"
 realm_prop_focus_modifier: "[GetFocus('realm_prop_focus').GetName]"
 realm_prop_focus_desc: "Prop es el control y la manipulación de todos los objetos creados. Cuanto más complicado es el artefacto, más dominio del reino Prop se requiere."
 realm_prop_focus_effect_desc: "Centrarse en Prop otorga:"
 
 realm_nature_focus: "Enfoque en Nature"
 realm_nature_focus_modifier: "[GetFocus('realm_nature_focus').GetName]"
 realm_nature_focus_desc: "Naturaleza es el control de las plantas, la tierra y las bestias. Cualquier cosa no tocada por la creación se presta a ser controlada por el reino de la Naturaleza."
 realm_nature_focus_effect_desc: "Centrarse en Nature otorga:"
 
 realm_scene_focus: "Enfoque en Scene"
 realm_scene_focus_modifier: "[GetFocus('realm_scene_focus').GetName]"
 realm_scene_focus_desc: "Escena es el control del espacio. Cuanto más domines el reino de Escena, mayor será el área o más objetivos (en conjunción con otros reinos) podrás afectar."
 realm_scene_focus_effect_desc: "Centrarse en Scene otorga:"
 
 realm_time_focus: "Enfoque en Time"
 realm_time_focus_modifier: "[GetFocus('realm_time_focus').GetName]"
 realm_time_focus_desc: "Time es el control de cuándo ocurrirán tus cantrips o cuánto durarán. El dominio de Time dicta la duración de tus hechizos o cuánto tiempo puedes dejar un «disparador» sobre ellos."
 realm_time_focus_effect_desc: "Centrarse en Time otorga:"
 
