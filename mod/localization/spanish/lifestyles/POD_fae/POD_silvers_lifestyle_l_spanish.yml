 sliver_pyros_flavor: "El fuego arde. Esa es su naturaleza y, cuando lo hace sin control, ofrece una intensidad, una luz y un calor extremos. Pyros revela las mentiras por el desvío y el subterfugio que son, arrojando luz sobre las sombras de la vida. Crea fuego, lo controla y lo redirige, pero nunca sofoca las llamas, pues el fuego debe arder. Envuelve los puños y hace que los nudillos desnudos infligan daño letal, y realza el Glamour de los Tesoros, convirtiendo su daño en agravado. Las llamas se alzan para defender a su portador y cegar a los oponentes, dificultándoles acertar sus objetivos o facilitando escapar tras ser detectado. La intensidad del fuego arde en el corazón de todo lo vivo (e incluso de algunos Pródigos no-muertos), y Pyros realza el odio y el amor hasta alturas tales que acaba consumiendo al objetivo e infundiéndole paranoia o miedo al rechazo. Nunca trata zonas grises emocionales y lleva siempre los efectos al extremo, o causa un entumecimiento completo, como si la llama del interior del alma parpadeara y muriera."
 
