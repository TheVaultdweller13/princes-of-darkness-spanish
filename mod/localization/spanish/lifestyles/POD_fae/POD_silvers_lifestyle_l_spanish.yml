 sliver_petros_flavor: "Los Petros aportan la resistencia, la firmeza, la durabilidad y la fuerza que existen en las rocas y en la propia tierra. Solo con las manos, el lanzador es capaz de esculpir rocas en estatuas de tamaño natural en unas pocas horas, de cambiar la esencia misma del tipo de suelo o roca que es algo y hasta de transmutar minerales (pero nunca en hierro). Crea armaduras de minerales y cambia la masa y la forma de la tierra, haciendo que se alce del suelo como muros. Petros conecta a su usuario con los tiempos antiguos, lo que permite acceder a saberes e información largamente perdidos para ayudar en apuros actuales. Los Glomes suelen usar el Fragmento para imponer juramentos y contratos, atándolos con la durabilidad de la propia piedra y haciendo que los haga cumplir el Ensueño. Aunque no puede crear otras emociones, Petros es capaz de infundir devoción en otros, lo que lo convierte en una magia excelente para líderes de toda clase."

