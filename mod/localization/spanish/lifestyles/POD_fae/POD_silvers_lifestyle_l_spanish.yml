 sliver_stratus_flavor: "Stratus es la esencia del aire. Brisas tranquilas o tormentas rabiosas, nubes oscuras o cielos despejados, lluvia suave o tormentas eléctricas: todo cae en el dominio de esta magia. Al mismo tiempo, el viento también lleva mensajes para entregar o para escuchar a escondidas. Los susurros destinados a un individuo cobran fuerza como si se transmitieran por altavoces y los gritos se ahogan al instante cuando el aire se niega a transmitir sus ondas sonoras. Moverse puede ser una experiencia lenta o extremadamente rápida según cómo el phylum que Desata este Fragmento aplique su efecto mientras sus aliados atacan a sus enemigos. También crea ilusiones temporales, persuadiendo a las sombras para que oculten el movimiento y desvíen la atención y así permanecer ocultos con éxito cuando haga falta. Aunque puede crear Portales Salvajes si las cosas salen mal, Stratus también permite el teletransporte a distancias breves (como dentro de una ciudad o un rascacielos)."

