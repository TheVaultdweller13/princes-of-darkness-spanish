 sliver_verdage_flavor: "Verdage implica el control de la naturaleza viva, que abarca desde plantas hasta animales e incluso objetos hechos de materiales naturales (sin tratamientos químicos, etc.). Mediante este Fragmento, los usuarios crean y curan venenos naturales, localizan rastros del movimiento de su objetivo, despejan terreno cubierto de maleza y adivinan el futuro mirando los hilos del destino como las raíces de la propia vida. Verdage invoca fauna salvaje y quimeras nacidas a su imagen y hace posible comunicarse con ellas, infundiendo una sensación de familiaridad entre usuario y objetivo. Además, crea plantas, vuelve el suelo fértil o infértil, mueve el crecimiento incipiente y hace que florezca. Con todo, a pesar de su capacidad de animar plantas, no puede crear inteligencia. El Fragmento también permite a los lanzadores crear objetos con recursos de la naturaleza imaginándolos en su mente, así como transmutar sustancias orgánicas de una a otra."

