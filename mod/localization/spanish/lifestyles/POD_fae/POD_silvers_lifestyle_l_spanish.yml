 sliver_aquis_flavor: "El agua es vida. Es necesaria para sostener a mortales, animales y plantas. Divide y unifica, y su forma nunca es constante, siempre cambia para adaptarse a lo que (y si algo) la contiene. A través de Aquis, los inanimae pueden infundir esperanza mientras la duda se lava, o evocar el duelo por perder a alguien en el mar. Pueden curar con las lágrimas creadas por este hechizo y herir ahogando a sus víctimas. Les permite romper ilusiones y espejismos y dejar la verdad al desnudo ante todos. A través de los reflejos en el agua, ven el pasado y los sucesos lejanos mientras ocurren. Los Aquis controlan las aguas: las alzan, las dividen, las congelan, las funden e incluso las evaporan. Se alza en defensa para empujar a los enemigos hacia atrás y aplastarlos contra el suelo y oculta el movimiento tras la bruma. Cura heridas agravadas en el Ensueño Profundo y calma las emociones intensificadas por Pyros."

