 building_type_jerusalem_jewish_third_temple_01: "Tercer Templo"
 building_type_jerusalem_jewish_third_temple_01_desc: "#F El Templo es el centro de todo el culto judío. Aunque las enseñanzas rabínicas ofrecen alternativas, todos los hebreos anhelan el día en que puedan volver a utilizar el Templo como el verdadero centro de su adoración.#!"
 building_jerusalem_jewish_third_temple_01: "Muro de las Lamentaciones"
 building_jerusalem_jewish_third_temple_01_desc: "Este muro de contención es todo lo que queda del Segundo Templo tras su nivelación durante la Guerra de la Destrucción. Quizás podamos construir sobre estas ruinas para reconstruir el Templo..."
 building_jerusalem_jewish_third_temple_02: "Los Patios Exteriores y el Ulam"
 building_jerusalem_jewish_third_temple_02_desc: "Antes de poder reconstruir el Templo, debemos reconstruir los patios exteriores, los altares, los lavabos y los dos pilares de bronce del pórtico: Jaquín y Boaz. Esta zona es lo más lejos que llegarán la mayoría de los gentiles y hebreos, y será el punto focal de los sacrificios revividos. Por ello, debemos crear un área apropiada para tal fin y que refleje adecuadamente la Shejiná."
 building_jerusalem_jewish_third_temple_03: "El Vestíbulo y el Heijal"
 building_jerusalem_jewish_third_temple_03_desc: "El Santuario Principal es el lugar de trabajo de los sacerdotes y el hogar de muchos símbolos importantes. Recuperaremos o recrearemos estos símbolos para que puedan, una vez más, honrar el salón del Templo."
 building_jerusalem_jewish_third_temple_04: "Tercer Templo Completado"
 building_jerusalem_jewish_third_temple_04_desc: "Con la finalización del Sanctasanctórum y la recuperación del Arca de la Alianza, el Tercer Templo está de nuevo completo. El sacerdocio levítico vuelve a realizar sacrificios y a guiar al Pueblo de D-s en su peregrinaje a la Ciudad Santa para las festividades. ¡Que permanezca en pie 7 veces 7 veces 7 tanto como el de Salomón! ¡Que sea un símbolo para todas las naciones de la fidelidad de D-s hacia Su pueblo elegido!"
 JERUSALEM_JEWISH_THIRD_TEMPLE: "[GetBuilding('jerusalem_jewish_third_temple_04').GetName]"
 POD_jerusalem_jewish_third_temple_ark_unlock: "$EFFECT_LIST_BULLET$Obtienes acceso a la [decision|E] $jerusalem_recover_ark_covenant_decision$, si aún no se ha recuperado\n"
 POD_jerusalem_jewish_third_temple_bonus: "$EFFECT_LIST_BULLET$Obtienes acceso al [GetCourtPositionType('jerusalem_socher_court_position').GetName()]\n"

 building_type_jerusalem_jewish_library_01: "$building_jerusalem_jewish_library_02$"
 building_type_jerusalem_jewish_library_01_desc: "#F $building_jerusalem_jewish_library_02_desc$#!"
 building_jerusalem_jewish_library_01: "Genizá de Jerusalén"
 building_jerusalem_jewish_library_01_desc: "Como Pueblo del Libro, los hebreos siempre han comprendido el valor de la palabra escrita. Por ahora, solo disponemos de un depósito para textos gastados o dañados, registros administrativos, cartas y recibos. Quizá en el futuro necesitemos y podamos adquirir un espacio mayor."
 building_jerusalem_jewish_library_02: "Archivos de Jerusalén"
 building_jerusalem_jewish_library_02_desc: "Como Pueblo del Libro, los hebreos siempre han comprendido el valor de la palabra escrita. Ahora es el momento de reunir nuestro conocimiento en un archivo que rivalice con las mayores bibliotecas de la historia."
 building_jerusalem_jewish_library_03: "Biblioteca de Jerusalén"
 building_jerusalem_jewish_library_03_desc: "Aunque nuestro trabajo aún no está completo, hemos avanzado bien en la formación de una colección centralizada de nuestro conocimiento de los mundos natural y sobrenatural."
 building_jerusalem_jewish_library_04: "Gran Biblioteca de Jerusalén"
 building_jerusalem_jewish_library_04_desc: "Antaño, las traducciones griegas del Tanaj ocupaban los estantes de la Gran Biblioteca de Alejandría. Ahora, las traducciones al hebreo de #italic La República#! de Platón y de #italic La Eneida#! de Virgilio descansan en los estantes de la Gran Biblioteca de Jerusalén junto a nuestra colección completa de obras sobre el origen, la naturaleza y la debilidad de todas las cosas creadas, ya sean vivas, muertas o no-muertas."
 JERUSALEM_JEWISH_LIBRARY: "[GetBuilding('jerusalem_jewish_library_04').GetName]"

 building_type_jerusalem_jewish_castle_01: "Torre de David"
 building_type_jerusalem_jewish_castle_01_desc: "#F $building_jerusalem_jewish_castle_01_desc$#!"
 building_jerusalem_jewish_castle_01: "Torre de David"
 building_jerusalem_jewish_castle_01_desc: "Construida sobre las ruinas de fortificaciones de las eras hasmonea y herodiana, la actual Torre de David fue edificada en el siglo V d.C. Se ha utilizado como fortaleza militar desde la conquista musulmana de Jerusalén y la expulsión de los monjes que vivían en ella."
 building_jerusalem_jewish_castle_02: "Torre del Homenaje de David"
 building_jerusalem_jewish_castle_02_desc: "Aunque los bizantinos la atribuyeron por error al palacio de David, la Torre es una parte importante de las defensas y de la historia de Jerusalén. En reconocimiento de ello, hemos ampliado la Torre hasta convertirla en una fortaleza acorde con su historia y su valor."
 building_jerusalem_jewish_castle_03: "Fortaleza de David"
 building_jerusalem_jewish_castle_03_desc: "Donde antaño se alzaba una torre, se levanta ahora una poderosa fortaleza. La recién construida fortaleza protegerá a nuestro pueblo y servirá de punto seguro desde el que puedan operar nuestros ejércitos."
 building_jerusalem_jewish_castle_04: "Ciudadela de David"
 building_jerusalem_jewish_castle_04_desc: "La ciudad de Jerusalén ha caído ante fuerzas enemigas demasiadas veces a lo largo de la historia. Con la finalización de la Ciudadela de David, las muchas amenazas contra una Jerusalén hebrea afrontarán un desafío mucho mayor si osan, necias, intentar tomar de nuevo la ciudad."
 JERUSALEM_JEWISH_CASTLE: "[GetBuilding('jerusalem_jewish_castle_04').GetName]"
 POD_jerusalem_jewish_castle_bonus: "$EFFECT_LIST_BULLET$#help Si ya tienes [GetMaA('shomer').GetName]:#!\nMejora [GetMaA('shomer').GetName] a [GetMaA('blessed_shomer').GetName]\n$EFFECT_LIST_BULLET$#help Si no:#!\nObtienes acceso a [GetMaA('shomer').GetName]"

 building_type_jerusalem_jewish_palace_01: "$building_jerusalem_jewish_palace_01$"
 building_type_jerusalem_jewish_palace_01_desc: "#F $building_jerusalem_jewish_palace_01_desc$#!"
 building_jerusalem_jewish_palace_01: "Mansión en ruinas de Anás"
 building_jerusalem_jewish_palace_01_desc: "Antaño residencia del Sumo Sacerdote Anás bajo el rey Herodes, la estructura fue destruida con el resto de Jerusalén en el año 70 d. C. Poco queda aparte de ruinas."
 building_jerusalem_jewish_palace_02: "Mansión reconstruida de Anás"
 building_jerusalem_jewish_palace_02_desc: "Reconstruida a partir del casco calcinado que fue, esta gran estructura evoca una época en que Jerusalén era el hogar de un Sumo Sacerdote."
 building_jerusalem_jewish_palace_03: "Mansión palaciega de Anás"
 building_jerusalem_jewish_palace_03_desc: "Plenamente reconstruida e incluso ampliada, esta es verdaderamente una morada digna de un rey."
 building_jerusalem_jewish_palace_04: "El Palacio Real"
 building_jerusalem_jewish_palace_04_desc: "Construida sobre una mansión del Barrio Judío que fue residencia del Sumo Sacerdote Anás en tiempos del rey Herodes, esta estructura es un poderoso símbolo del regreso de los judíos a Jerusalén. Es verdaderamente un palacio y sede de gobierno digno de un rey que gobierne desde la ciudad santa de Jerusalén."
 JERUSALEM_JEWISH_PALACE: "[GetBuilding('jerusalem_jewish_palace_04').GetName]"

 building_type_jerusalem_jewish_pools_01: "Sistema de Embalses de Jerusalén"
 building_type_jerusalem_jewish_pools_01_desc: "#F Como muchas grandes ciudades del desierto, Jerusalén tiene un sistema de suministro de agua complejo, aunque deteriorado. Reconstruir este antiguo sistema permitirá que la población de Jerusalén vuelva a crecer y que el comercio fluya como las aguas.#!"
 building_jerusalem_jewish_pools_01: "Estanque de Ezequías"
 building_jerusalem_jewish_pools_01_desc: "Este antiguo embalse fue construido por el rey Ezequías para proporcionar 11 millones de litros de agua a la ciudad. El estanque estuvo rodeado en su día por grandes torres y pilares, y los reyes lo usaban como lugar de encuentro con diplomáticos extranjeros."
 building_jerusalem_jewish_pools_02: "Acueducto de Ezequías"
 building_jerusalem_jewish_pools_02_desc: "Este antiguo túnel dirige el agua desde el manantial de Gihón, lejos de la ciudad, a lo largo de 533 metros hasta el estanque de Siloé dentro de las murallas. El manantial de Gihón es la fuente de agua principal pero intermitente de Jerusalén, lo que hace que el acueducto y el estanque de Siloé sean necesarios para cuando el manantial no fluye."
 building_jerusalem_jewish_pools_03: "Tsinnor de David"
 building_jerusalem_jewish_pools_03_desc: "En el segundo milenio a. C. se construyeron una obra hidráulica y algunas fortificaciones cerca de la fuente de Guijón. Profundizadas y alargadas en siglos posteriores, servían para negar el acceso a los sitiadores a la vez que protegían el suministro de agua de la ciudad. Algunos dicen que David atacó a través de estos túneles. En cualquier caso, su excavación ha proporcionado una fuente de agua más fiable."
 building_jerusalem_jewish_pools_04: "Estanques de Salomón"
 building_jerusalem_jewish_pools_04_desc: "Cuando se construyeron por primera vez, estos 3 embalses almacenaban casi 285 millones de litros de agua. Mediante 5 acueductos exclusivos, abastecían de agua a Belén, al Monte del Templo, al Palacio de Herodes y a más lugares. Con todas nuestras reparaciones terminadas, el agua vuelve a fluir hacia Jerusalén y satisface todas nuestras necesidades."
 JERUSALEM_JEWISH_POOLS: "[GetBuilding('jerusalem_jewish_pools_04').GetName]"
 POD_jerusalem_jewish_pools_bonus: "#P El propietario de este edificio puede usar [diligent_development_focus_decision|E] si Jerusalén es su capital.#!"

 building_type_jerusalem_jewish_synagogue_01: "$building_jerusalem_jewish_synagogue_02$"
 building_type_jerusalem_jewish_synagogue_01_desc: "#F Cuando el rabino Moshe ben Nachman, más conocido como Nahmánides o Ramban, llegó a Jerusalén, lo entristeció profundamente la escasez de judíos en la ciudad y el poder que ejercían los no-muertos dentro de la Ciudad Santa. Incluso antes de su llegada, sus discípulos ya se movían por la ciudad, y él apoyó enormemente sus esfuerzos.#!"
 building_jerusalem_jewish_synagogue_01: "Shul Ramban"
 building_jerusalem_jewish_synagogue_01_desc: "Antes de poder ser una sinagoga donde se reúnan los fieles, debe ser primero una escuela que los guíe y los instruya."
 building_jerusalem_jewish_synagogue_02: "Sinagoga Ramban"
 building_jerusalem_jewish_synagogue_02_desc: "A medida que el número de hebreos ha crecido, el Shul Ramban se ha convertido en una sinagoga propiamente dicha donde los fieles pueden congregarse."
 building_jerusalem_jewish_synagogue_03: "Bet Knesset Ramban"
 building_jerusalem_jewish_synagogue_03_desc: "Lo que antaño fue un pequeño lugar de reunión y escuela ha crecido ahora hasta convertirse en una gran casa de asamblea para los fieles. Hay rumores de Jueces que viajan desde todo el mundo a este lugar, disfrazándose de peregrinos e intercambiando información."
 building_jerusalem_jewish_synagogue_04: "Bet Knesset Nahmánides"
 building_jerusalem_jewish_synagogue_04_desc: "Con su llegada a Jerusalén, Nahmánides y sus seguidores dirigen ahora la sinagoga que lleva su nombre. Con su guía se han logrado grandes avances, que ayudan a los Jueces en su gran misión."
 JERUSALEM_JEWISH_SYNAGOGUE: "[GetBuilding('jerusalem_jewish_synagogue_04').GetName]"
 POD_jerusalem_jewish_synagogue_bonus: "$EFFECT_LIST_BULLET$#help Si ya puedes usar la [interaction|E] $literalist_debate_interaction$:#!\nObtienes +100% de piedad al vencer y -50% al perder\n$EFFECT_LIST_BULLET$#help Si no:#!\nPuedes debatir con otros señores del reino a costa de [opinion|E], para ganar o perder [piety|E]"
 building_type_jerusalem_jewish_demonology_01: "$building_jerusalem_jewish_demonology_01$"
 building_type_jerusalem_jewish_demonology_01_desc: "#F La gloria de Dios es encubrir las cosas, pero la gloria de los reyes es escudriñarlas. Ese ha llegado a ser el propósito de esta sinagoga.#!"
 building_jerusalem_jewish_demonology_01: "Sinagoga de Tif'eret Yisra'el"
 building_jerusalem_jewish_demonology_01_desc: "Construido sobre ruinas que se remontan al Reino de Judá, el Shul de Tif'eret Yisra'el es ahora un lugar donde se enseñan ciertas artes místicas iniciadas por el rey Salomón y se descubren los misterios ocultos de la creación. Entre sus sombras camina un hombre extraño que lleva allí desde que nadie puede recordar."
 building_jerusalem_jewish_demonology_02: "Sinagoga renovada de Tif'eret Yisra'el"
 building_jerusalem_jewish_demonology_02_desc: "Con sus recientes reformas, la sinagoga es ahora un lugar al que acuden los estudiantes para aprender los secretos más hondos de la magia. A unos pocos se los escoge incluso para estudiar bajo un viejo rabino de cabello blanco y ralo, y ayudarlo en sus investigaciones."
 building_jerusalem_jewish_demonology_03: "Sinagoga decorada de Tif'eret Yisra'el"
 building_jerusalem_jewish_demonology_03_desc: "Recurriendo a las artes del infernalismo, el rey Salomón el Sabio halló la manera de purificar sus rituales y hechizos y eliminar el peligro de contaminarse. Ese saber constituye el fundamento de nuestras magias actuales y nos concede habilidades singulares que otros podrían juzgar antinaturales. Nuestros esfuerzos se ven reforzados por las intuiciones del rabino residente, que revela verdades ocultas en muchos textos."
 building_jerusalem_jewish_demonology_04: "Sinagoga consagrada de Tif'eret Yisra'el"
 building_jerusalem_jewish_demonology_04_desc: "Se dice que el Libro Sagrado excede la comprensión mortal hasta la venida del Mesías, que interpretará cada pasaje, cada palabra, cada espacio entre las letras. La propia Torá es el plano de la creación, y solo Deuteronomio 32 contiene toda la historia de Israel. Entre sus páginas yace cada secreto de la creación, misterios que estudiamos bajo la guía del rabino Abraham. Sea la guematría, el notarikón, la temurá, la numerología, los acrósticos, la agrupación, los macrocódigos, las separaciones equidistantes de letras, el análisis de nombres, el análisis esteganográfico, el análisis estructural heptádico o cualquier otro, hay que emplear todos los enfoques para procesar la información oculta que se nos ha concedido."
 JERUSALEM_JEWISH_DEMONOLOGY: "[GetBuilding('jerusalem_jewish_demonology_04').GetName]"
 JERUSALEM_JEWISH_DEMONOLOGY_1: "[GetBuilding('jerusalem_jewish_demonology_01').GetName]"
 JERUSALEM_JEWISH_DEMONOLOGY_2: "[GetBuilding('jerusalem_jewish_demonology_02').GetName]"
 JERUSALEM_JEWISH_DEMONOLOGY_3: "[GetBuilding('jerusalem_jewish_demonology_03').GetName]"
 POD_jerusalem_jewish_demonology_bonus: "$EFFECT_LIST_BULLET$#help Si puedes usar [Glossary('Disciplinas','game_concept_discipline_desc')]:#!\n+10% de velocidad de ritual para la hechicería de sangre\n$EFFECT_LIST_BULLET$#help Si no:#!\nObtienes acceso a todos los Rituales Dur-An-Ki"

 building_type_jerusalem_christian_holy_sepulcher_01: "Iglesia del Santo Sepulcro"
 building_type_jerusalem_christian_holy_sepulcher_01_desc: "#F Considerada el lugar más sagrado del cristianismo, la Iglesia del Santo Sepulcro está construida sobre el lugar de la muerte de Jesús y Su tumba vacía. Además, la Iglesia contiene las últimas 4 estaciones del Vía Crucis de la Vía Dolorosa.#!"
 building_jerusalem_christian_holy_sepulcher_01: "Capilla del Santo Sepulcro"
 building_jerusalem_christian_holy_sepulcher_01_desc: "Aunque los bizantinos y los cruzados hicieron algunos esfuerzos por reconstruir la Iglesia, gran parte de ella sigue en ruinas desde su destrucción por al-Hakim."
 building_jerusalem_christian_holy_sepulcher_02: "Iglesia del Santo Sepulcro"
 building_jerusalem_christian_holy_sepulcher_02_desc: "La Iglesia del Santo Sepulcro ha sido finalmente restaurada a su antigua gloria, tal como fue encargada y consagrada bajo Constantino el Grande."
 building_jerusalem_christian_holy_sepulcher_03: "Catedral del Santo Sepulcro"
 building_jerusalem_christian_holy_sepulcher_03_desc: "La Iglesia ha sido ampliada para ser una sede adecuada tanto para el Patriarca Ortodoxo como para el Patriarca Latino de Jerusalén."
 building_jerusalem_christian_holy_sepulcher_04: "Gran Catedral del Santo Sepulcro"
 building_jerusalem_christian_holy_sepulcher_04_desc: "Finalmente, este lugar sagrado cuenta con la catedral que merece, una que refleja adecuadamente la gloria y majestad de Dios. Toda la cristiandad se maravillará ante tal vista."
 JERUSALEM_CHRISTIAN_HOLY_SEPULCHER: "[GetBuilding('jerusalem_christian_holy_sepulcher_04').GetName]"
 POD_jerusalem_christian_holy_sepulcher_bonus: "$EFFECT_LIST_BULLET$Las [holy_wars|E] contra Reinos pueden declararse cada 25 años en lugar de cada 50\n"
 POD_jerusalem_christian_holy_sepulcher_bonus2: "$EFFECT_LIST_BULLET$Obtienes acceso al [GetCourtPositionType('jerusalem_puppeteer_grand_masters_court_position').GetName()]\n"

 building_type_jerusalem_christian_lazarus_01: "Orden de San Lázaro"
 building_type_jerusalem_christian_lazarus_01_desc: "#F Más conocidos como los Caballeros Leprosos, la Orden de San Lázaro proporciona sanadores a muchos hospitales y protege dichos hospitales de posibles peligros. Además, ofrecen a aquellos con una forma fatal de lepra la oportunidad de morir con gloria y honor al servicio de Dios.#!"
 building_jerusalem_christian_lazarus_01: "Casa Capitular de San Lázaro"
 building_jerusalem_christian_lazarus_01_desc: "Esta Casa Capitular proporciona alojamiento a un pequeño número de Caballeros Leprosos y sirve como estación de cuarentena."
 building_jerusalem_christian_lazarus_02: "Enclave de Hermanos Caballeros de San Lázaro"
 building_jerusalem_christian_lazarus_02_desc: "Este Enclave proporciona alojamiento a un número decente de Caballeros Leprosos y sirve como hospital de campaña."
 building_jerusalem_christian_lazarus_03: "Encomienda de la Cruz de San Lázaro"
 building_jerusalem_christian_lazarus_03_desc: "Esta Encomienda alberga a un gran contingente de Caballeros Leprosos y actúa como centro regional para administrar diversos hospitales y atender a los caballeros hermanos heridos."
 building_jerusalem_christian_lazarus_04: "Bastión de la Cruz de San Lázaro"
 building_jerusalem_christian_lazarus_04_desc: "Este Bastión proporciona alojamiento a un número masivo de Caballeros Leprosos dedicados a promover la misión de la Cruz mediante el poder marcial y la prestación de amplios servicios médicos."
 JERUSALEM_CHRISTIAN_LAZARUS: "[GetBuilding('jerusalem_christian_lazarus_04').GetName]"

 building_type_jerusalem_christian_john_01: "Orden de San Juan"
 building_type_jerusalem_christian_john_01_desc: "#F Más conocidos como los Caballeros Hospitalarios, la Orden de San Juan cuida y protege a los peregrinos enfermos, heridos y pobres que acuden a Tierra Santa. Además, son conocidos por administrar fortalezas esenciales como el Krak de los Caballeros y por ayudar en ocasiones a concertar ciertos tratados entre gobernantes cristianos.#!"
 building_jerusalem_christian_john_01: "Casa Capitular de San Juan"
 building_jerusalem_christian_john_01_desc: "Esta Casa Capitular proporciona alojamiento a un pequeño número de Caballeros Hospitalarios y sirve como pequeño fuerte para los peregrinos que buscan protección."
 building_jerusalem_christian_john_02: "Enclave de Hermanos Caballeros de San Juan"
 building_jerusalem_christian_john_02_desc: "Este Enclave proporciona alojamiento a un número decente de Caballeros Hospitalarios y sirve como fuerte de tamaño medio para los peregrinos que buscan protección."
 building_jerusalem_christian_john_03: "Encomienda de la Cruz de San Juan"
 building_jerusalem_christian_john_03_desc: "Esta Encomienda alberga a un gran contingente de Caballeros Hospitalarios y actúa como centro regional para administrar diversas obras de caridad y proteger a los peregrinos en los caminos de Tierra Santa."
 building_jerusalem_christian_john_04: "Bastión de la Cruz de San Juan"
 building_jerusalem_christian_john_04_desc: "Este Bastión proporciona alojamiento a un número masivo de Caballeros Hospitalarios dedicados a promover la misión de la Cruz mediante el poder marcial y la protección de todos los peregrinos."
 JERUSALEM_CHRISTIAN_JOHN: "[GetBuilding('jerusalem_christian_john_04').GetName]"
 POD_crusader_siege_tactics_modifier: "Tácticas de asedio de los cruzados"
 POD_crusader_siege_tactics_modifier_desc: "Siglos de experiencia en guerras santas interminables han dado un conocimiento singular de la zapa, el socavado y otras tácticas de asedio. La mayoría de los enemigos lo descubren demasiado tarde."
 POD_jerusalem_christian_john_bonus: "Inflige a los [rulers|E] enemigos [GetModifier('POD_crusader_siege_tactics_modifier').GetNameWithTooltip] al comenzar una [war|E] como atacante o defensor principal."

 building_type_jerusalem_christian_sepulchre_01: "Orden del Santo Sepulcro"
 building_type_jerusalem_christian_sepulchre_01_desc: "#F Más conocidos como los Milites Sancti Sepulcri, la Orden del Santo Sepulcro protege y gestiona lugares sagrados clave dentro de Jerusalén. Además, confieren el rango de caballero a sus mejores guerreros, haciéndolos más atractivos para el hombre común.#!"
 building_jerusalem_christian_sepulchre_01: "Casa Capitular del Santo Sepulcro"
 building_jerusalem_christian_sepulchre_01_desc: "Esta Casa Capitular proporciona alojamiento a un pequeño número de Milites Sancti Sepulcri y sirve como centro de reclutamiento menor."
 building_jerusalem_christian_sepulchre_02: "Enclave de Hermanos Caballeros del Santo Sepulcro"
 building_jerusalem_christian_sepulchre_02_desc: "Este Enclave proporciona alojamiento a un número decente de Milites Sancti Sepulcri y sirve como centro de reclutamiento de tamaño medio."
 building_jerusalem_christian_sepulchre_03: "Encomienda de la Cruz del Santo Sepulcro"
 building_jerusalem_christian_sepulchre_03_desc: "Esta Encomienda alberga a un gran contingente de Milites Sancti Sepulcri y actúa como centro regional para reclutar caballeros hermanos que defiendan enclaves clave de Tierra Santa."
 building_jerusalem_christian_sepulchre_04: "Bastión de la Cruz del Santo Sepulcro"
 building_jerusalem_christian_sepulchre_04_desc: "Este Bastión proporciona alojamiento a un número masivo de Milites Sancti Sepulcri dedicados a promover la misión de la Cruz mediante el poder marcial y el reclutamiento del hombre común para la causa."
 JERUSALEM_CHRISTIAN_SEPULCHRE: "[GetBuilding('jerusalem_christian_sepulchre_04').GetName]"

 building_type_jerusalem_christian_supreme_templar_01: "Orden del Temple de Salomón"
 building_type_jerusalem_christian_supreme_templar_01_desc: "#F Más conocidos como los Caballeros Templarios, la Orden del Temple de Salomón es una de las más orientadas a lo marcial de las 5 grandes órdenes de cruzados en Jerusalén. Son particularmente conocidos por su caballería pesada e infantería.#!"
 building_jerusalem_christian_supreme_templar_01: "Casa Capitular de la Orden Suprema"
 building_jerusalem_christian_supreme_templar_01_desc: "Esta Casa Capitular proporciona alojamiento a un pequeño número de Caballeros Templarios y sirve como campo de entrenamiento."
 building_jerusalem_christian_supreme_templar_02: "Enclave de Hermanos Caballeros de la Orden Suprema"
 building_jerusalem_christian_supreme_templar_02_desc: "Este Enclave proporciona alojamiento a un número decente de Caballeros Templarios y sirve como campo de entrenamiento de tamaño medio."
 building_jerusalem_christian_supreme_templar_03: "Encomienda de la Cruz de San Juan"
 building_jerusalem_christian_supreme_templar_03_desc: "Esta Encomienda alberga a un gran contingente de Caballeros Templarios y actúa como centro regional para entrenar a caballeros hermanos capaces de resistir cualquier asalto."
 building_jerusalem_christian_supreme_templar_04: "Bastión de la Cruz de la Orden Suprema"
 building_jerusalem_christian_supreme_templar_04_desc: "Este Bastión proporciona alojamiento a un número masivo de Caballeros Templarios dedicados a promover la misión de la Cruz mediante un poder marcial abrumador."
 JERUSALEM_CHRISTIAN_SUPREME_TEMPLAR: "[GetBuilding('jerusalem_christian_supreme_templar_04').GetName]"

 building_type_jerusalem_christian_german_mary_01: "Orden de Santa María"
 building_type_jerusalem_christian_german_mary_01_desc: "#F Más conocidos como los Caballeros Teutónicos, la Orden de Santa María ayuda a mantener el orden y el control dentro de su territorio. Aunque les queda un largo camino antes de alcanzar sus cimas eventuales en Livonia, siguen siendo útiles para regular a las otras facciones dentro de Jerusalén.#!"
 building_jerusalem_christian_german_mary_01: "Casa Capitular de Santa María"
 building_jerusalem_christian_german_mary_01_desc: "Esta Casa Capitular proporciona alojamiento a un pequeño número de Caballeros Teutónicos y sirve como celda de detención temporal."
 building_jerusalem_christian_german_mary_02: "Enclave de Hermanos Caballeros de Santa María"
 building_jerusalem_christian_german_mary_02_desc: "Este Enclave proporciona alojamiento a un número decente de Caballeros Teutónicos y sirve como tribunal secundario."
 building_jerusalem_christian_german_mary_03: "Encomienda de la Cruz de Santa María"
 building_jerusalem_christian_german_mary_03_desc: "Esta Encomienda alberga a un gran contingente de Caballeros Teutónicos y actúa como centro regional para hacer cumplir y dirimir las leyes de la cristiandad."
 building_jerusalem_christian_german_mary_04: "Bastión de la Cruz de Santa María"
 building_jerusalem_christian_german_mary_04_desc: "Este Bastión proporciona alojamiento a un número masivo de Caballeros Teutónicos dedicados a promover la misión de la Cruz mediante el poder marcial y las labores judiciales."
 JERUSALEM_CHRISTIAN_GERMAN_MARY: "[GetBuilding('jerusalem_christian_german_mary_04').GetName]"
 POD_jerusalem_christian_german_mary_bonus: "[convert_county|E] avanzará un #color_green +25%#! más rápido"

 building_type_jerusalem_divided_temple_mount_catacombs_01: "Catacumbas del Monte del Templo"
 building_type_jerusalem_divided_temple_mount_catacombs_01_desc: "#F A diferencia de la Iglesia del Santo Sepulcro, los túneles bajo el Monte del Templo están casi libres de incomodidades, ya que la fe mortal se dirige hacia arriba. Entretejiéndose en tres dimensiones a través de muchas capas bajo la superficie y con pasillos que cambian de forma extraña, estas catacumbas no son un lugar para ser explorado a la ligera. Uno podría vagar aquí por la eternidad, alimentándose de ratas y de la sangre de peces ciegos, y no volver a ver el mundo. Sin embargo, siguen proporcionando un excelente escondite de otros Vástagos y del sol.#!"
 building_jerusalem_divided_temple_mount_catacombs_01: "Extensión laberíntica decrépita"
 building_jerusalem_divided_temple_mount_catacombs_01_desc: "Las cavernas bajo el Monte del Templo y Jerusalén son húmedas y resbaladizas, marcadas por numerosos derrumbes y pasajes tortuosos. Incluso un pequeño impacto podría causar el colapso de una gran sección del corredor."
 building_jerusalem_divided_temple_mount_catacombs_02: "Catacumbas Ocultas"
 building_jerusalem_divided_temple_mount_catacombs_02_desc: "Con algunos refuerzos, has mejorado lo que yace bajo el Monte del Templo. El conjunto de cámaras, trampas y pasadizos no es menos confuso ni menos propenso a cambiar a tus espaldas, pero es mucho menos propenso a derrumbarse."
 building_jerusalem_divided_temple_mount_catacombs_03: "Salones Embrujados"
 building_jerusalem_divided_temple_mount_catacombs_03_desc: "Una oscuridad antigua parece dormir dentro de los túneles, y muchos de los túneles profundos parecen haber sido tallados hacia arriba. Sin embargo, son los otros Vástagos que viven dentro de las catacumbas los que presentan un obstáculo para tus planes. O mejor dicho, solían hacerlo..."
 building_jerusalem_divided_temple_mount_catacombs_04: "Palacio de las Sombras"
 building_jerusalem_divided_temple_mount_catacombs_04_desc: "Los túneles no conocen fin, conduciendo a secretos ocultos, reliquias perdidas y ciudades más antiguas que todos excepto unos pocos Matusalenes. Tus exploraciones y esfuerzos han dado resultados increíbles, resultados que han permitido la construcción de un palacio masivo dentro de las catacumbas. Gobiernas esta ciudad santa con puño de hierro desde este palacio oculto y, si alguien te molesta, siempre queda el laberinto interminable que conduce eternamente hacia abajo a través de pasillos que cambian locamente y atrapan a cualquiera que entre. El único precio son las carcajadas locas y los gritos que emanan de esos salones, un precio pequeño en verdad."
 POD_jerusalem_divided_temple_mount_catacombs_bonus_threshold_tier1: "#color_green -1%#! de influencia necesaria para alcanzar cada #TOOLTIP:POD_jerusalem_modifier_tooltip #L;V;italic umbral de modificador#!#!"
 POD_jerusalem_divided_temple_mount_catacombs_bonus_threshold_tier2: "#color_green -2%#! de influencia necesaria para alcanzar cada #TOOLTIP:POD_jerusalem_modifier_tooltip #L;V;italic umbral de modificador#!#!"
 POD_jerusalem_divided_temple_mount_catacombs_bonus_threshold_tier3: "#color_green -3%#! de influencia necesaria para alcanzar cada #TOOLTIP:POD_jerusalem_modifier_tooltip #L;V;italic umbral de modificador#!#!"
 POD_jerusalem_divided_temple_mount_catacombs_bonus_threshold_tier4: "$EFFECT_LIST_BULLET$#color_green -5%#! de influencia necesaria para alcanzar cada #TOOLTIP:POD_jerusalem_modifier_tooltip #L;V;italic umbral de modificador#!#!\n"
 POD_jerusalem_divided_temple_mount_catacombs_bonus_equilibrium: "$EFFECT_LIST_BULLET$Los valores de equilibrio de la influencia pasan a ser #color_white 34#! de $POD_muslim_influence$, #color_white 33#! de $POD_christian_influence$ y #color_white 33#! de $POD_jewish_influence$\n"
 JERUSALEM_DIVIDED_TEMPLE_MOUNT_CATACOMBS: "[GetBuilding('building_jerusalem_divided_temple_mount_catacombs_04').GetName]"





 building_type_jerusalem_muslim_dome_rock_01: "Cúpula de la Roca"
 building_type_jerusalem_muslim_dome_rock_01_desc: "#F La Cúpula de la Roca fue construida en la década de 690 d.C. sobre el lugar donde Adán fue creado, donde Abraham casi sacrificó a su hijo y donde Mahoma comenzó su Viaje Nocturno. Aunque la estructura sigue en buen estado después de tantos siglos, las cruzadas y los terremotos han hecho mella.#!"
 building_jerusalem_muslim_dome_rock_01: "Cúpula de la Roca"
 building_jerusalem_muslim_dome_rock_01_desc: "La Cúpula de la Roca fue construida en la década de 690 d.C. sobre el lugar donde Adán fue creado, donde Abraham casi sacrificó a su hijo y donde Mahoma comenzó su Viaje Nocturno. Aunque la estructura sigue en buen estado después de tantos siglos, las cruzadas y los terremotos han hecho mella."
 building_jerusalem_muslim_dome_rock_02: "Cúpula de la Roca Renovada"
 building_jerusalem_muslim_dome_rock_02_desc: "$building_jerusalem_muslim_dome_rock_01_desc$"
 building_jerusalem_muslim_dome_rock_03: "Cúpula de la Roca Decorada"
 building_jerusalem_muslim_dome_rock_03_desc: "$building_jerusalem_muslim_dome_rock_01_desc$"
 building_jerusalem_muslim_dome_rock_04: "Cúpula de la Roca Consagrada"
 building_jerusalem_muslim_dome_rock_04_desc: "La Cúpula de la Roca fue construida en la década de 690 d. C. sobre el lugar donde fue creado Adán, donde Abraham estuvo a punto de sacrificar a su hijo y donde Mahoma inició su Viaje Nocturno. Con los daños reparados, el tercer lugar más sagrado del islam está por fin listo para honrar como es debido los grandes logros de Alá en este emplazamiento."
 JERUSALEM_MUSLIM_DOME_ROCK: "[GetBuilding('building_jerusalem_muslim_dome_rock_04').GetName]"
 POD_jerusalem_muslim_dome_rock_bonus: "$EFFECT_LIST_BULLET$Obtienes acceso al [GetCourtPositionType('jerusalem_ashen_muhtasib_court_position').GetName()]\n"
 POD_jerusalem_muslim_dome_rock_bonus2: "$EFFECT_LIST_BULLET$#help Si ya tienes [GetTrait('truefaith').GetName(GetNullCharacter)]:#!\nObtienes [piety_i|E] #V 2500#! de [piety|E] y #V 1#! [piety_level|E] al completar el Hach\n$EFFECT_LIST_BULLET$#help Si no:#!\nObtienes [GetTrait('truefaith').GetName(GetNullCharacter)] al completar el Hach"

 building_type_jerusalem_muslim_damascus_market_01: "$building_jerusalem_muslim_damascus_market_02$"
 building_type_jerusalem_muslim_damascus_market_01_desc: "#F $building_jerusalem_muslim_damascus_market_02_desc$#!"
 building_jerusalem_muslim_damascus_market_01: "Mercado de Damasco"
 building_jerusalem_muslim_damascus_market_01_desc: "Entre la red laberíntica de callejones se compra y se vende de todo, desde mercancías importadas hasta ganado."
 building_jerusalem_muslim_damascus_market_02: "Zoco de Damasco"
 building_jerusalem_muslim_damascus_market_02_desc: "Puestos casi ordenados rebosan de coloridas especias, dulces, tallas de madera, cerámicas, productos frescos, tejidos y mucho más. Poco hay que no se encuentre entre ellos."
 building_jerusalem_muslim_damascus_market_03: "Bazar de Damasco"
 building_jerusalem_muslim_damascus_market_03_desc: "El Bazar de Damasco comercia con todo, desde mercancías importadas hasta ganado, y es el corazón financiero de Jerusalén. Todo lo que pueda comprarse legalmente se encuentra aquí."
 building_jerusalem_muslim_damascus_market_04: "Gran Bazar de Damasco"
 building_jerusalem_muslim_damascus_market_04_desc: "El Gran Bazar de Damasco comercia con todo, desde mercancías importadas hasta ganado, y es el corazón financiero de Jerusalén. Jerusalén es el punto focal en torno al cual gira el comercio mundial, y el Gran Bazar de Damasco es el centro de ese punto focal."
 JERUSALEM_MUSLIM_DAMASCUS_MARKET: "[GetBuilding('building_jerusalem_muslim_damascus_market_04').GetName]"

 building_type_jerusalem_muslim_zawiya_01: "$building_jerusalem_muslim_zawiya_01$"
 building_type_jerusalem_muslim_zawiya_01_desc: "#F $building_jerusalem_muslim_zawiya_02_desc$#!"
 building_jerusalem_muslim_zawiya_01: "Zauiya Ahmad"
 building_jerusalem_muslim_zawiya_01_desc: "Llamada así por un importante líder religioso, hoy casi olvidado, sirve como lugar de culto, escuela, monasterio y hogar de una hermandad local."
 building_jerusalem_muslim_zawiya_02: "Zauiya Ahmad Renovada"
 building_jerusalem_muslim_zawiya_02_desc: "Con las recientes reformas, la Zauiya Ahmad vuelve a recordar a la gente a un antiguo tradicionalista y guerrero de la yihad. En su día inspiró a muchos soldados y cazadores; quizá lo haga de nuevo."
 building_jerusalem_muslim_zawiya_03: "Zauiya Ahmad Ampliada"
 building_jerusalem_muslim_zawiya_03_desc: "La hermandad ha aprovechado las recientes ampliaciones de su hogar para reclutar nuevos hermanos y empezar a entrenarlos para la guerra."
 building_jerusalem_muslim_zawiya_04: "Zauiya Ahmad consagrada"
 building_jerusalem_muslim_zawiya_04_desc: "Tras su reciente reconsagración y otras mejoras, esta zauiya honra de verdad a quien le da nombre: Ahmad ibn Harb \"el Hijo de la Guerra\". De sus salas marcha una fuerza organizada y devota, lista para defender y expandir estas tierras."
 JERUSALEM_MUSLIM_ZAWIYA: "[GetBuilding('building_jerusalem_muslim_zawiya_04').GetName]"

 building_type_jerusalem_muslim_madrasa_01: "Madrasa Dho 'l-Nun"
 building_type_jerusalem_muslim_madrasa_01_desc: "#F $building_jerusalem_muslim_madrasa_02_desc$#!"
 building_jerusalem_muslim_madrasa_01: "Madrasa Dho 'l-Nun"
 building_jerusalem_muslim_madrasa_01_desc: "Llamada así por un importante líder religioso, hoy casi olvidado, sirve como institución educativa tanto en materias seculares como religiosas."
 building_jerusalem_muslim_madrasa_02: "Madrasa Dho 'l-Nun Renovada"
 building_jerusalem_muslim_madrasa_02_desc: "Con las recientes reformas, la Madrasa Dho 'l-Nun vuelve a recordar a la gente a un antiguo místico y santo. En su día inspiró a muchos eruditos y cazadores; quizá lo haga de nuevo."
 building_jerusalem_muslim_madrasa_03: "Madrasa Dho 'l-Nun Ampliada"
 building_jerusalem_muslim_madrasa_03_desc: "Los eruditos han aprovechado las recientes ampliaciones de su hogar para impartir algunas clases nuevas sobre ciertas artes místicas."
 building_jerusalem_muslim_madrasa_04: "Madrasa Dho 'l-Nun consagrada"
 building_jerusalem_muslim_madrasa_04_desc: "Tras su reciente reconsagración y otras mejoras, esta madrasa honra de verdad a quien le da nombre: Dho 'l-Nun al-Misri. De sus salas salen muchos estudiantes preparados para aplicar su conocimiento de materias seculares, religiosas y místicas."
 JERUSALEM_MUSLIM_MADRASA: "[GetBuilding('building_jerusalem_muslim_madrasa_04').GetName]"
 POD_jerusalem_muslim_madrasa_bonus: "$EFFECT_LIST_BULLET$Ganancia pasiva de [trait_level_track_xp|E] de [crafting_brewing|E] #weak ([GetTrait('pod_crafter').GetName( GetNullCharacter )])#!: #P +0.25#!\n$EFFECT_LIST_BULLET$"  # written like this to move university stuff on to new line with bullet

 building_type_jerusalem_muslim_al_yaqubi_01: "Mezquita de al-Ya'qubi"
 building_type_jerusalem_muslim_al_yaqubi_01_desc: "#F $building_jerusalem_muslim_al_yaqubi_02_desc$#!"
 building_jerusalem_muslim_al_yaqubi_01: "Mezquita de al-Ya'qubi"
 building_jerusalem_muslim_al_yaqubi_01_desc: "Llamada así por un importante líder, hoy casi olvidado, sirve como mezquita convencional, aunque una que fomenta la exploración y el estudio de la historia."
 building_jerusalem_muslim_al_yaqubi_02: "Mezquita de al-Ya'qubi renovada"
 building_jerusalem_muslim_al_yaqubi_02_desc: "Con las recientes reformas, la Mezquita de al-Ya'qubi vuelve a recordar a la gente a un antiguo historiador y geógrafo. En su día inspiró a muchos exploradores y cazadores; quizá lo haga de nuevo."
 building_jerusalem_muslim_al_yaqubi_03: "Mezquita de al-Ya'qubi ampliada"
 building_jerusalem_muslim_al_yaqubi_03_desc: "Los exploradores, mercaderes e historiadores han aprovechado las recientes ampliaciones de la mezquita para fomentar la exploración, la recopilación de relatos orales y la difusión del nombre del patrocinador de la mezquita."
 building_jerusalem_muslim_al_yaqubi_04: "Mezquita de al-Ya'qubi consagrada"
 building_jerusalem_muslim_al_yaqubi_04_desc: "Tras su reciente reconsagración y otras mejoras, esta mezquita honra de verdad a quien le da nombre: Abu l-Abbas Ahmad bin Abi Ya'qub bin Ja'far bin Wahb bin Wadih al-Ya'qubi. De sus salas salen muchos exploradores e historiadores que recuerdan cómo recogió numerosas fábulas de la era de la Yahiliyya e información detallada sobre ciudades desde el Imperio bizantino hasta China"
 JERUSALEM_MUSLIM_AL_YAQUBI: "[GetBuilding('building_jerusalem_muslim_al_yaqubi_04').GetName]"

 building_type_jerusalem_muslim_al_khanqah_salahiyya_01: "Mezquita al-Khanqah as-Salahiyya"
 building_type_jerusalem_muslim_al_khanqah_salahiyya_01_desc: "#F $building_jerusalem_muslim_al_khanqah_salahiyya_02_desc$#!"
 building_jerusalem_muslim_al_khanqah_salahiyya_01: "Mezquita al-Khanqah as-Salahiyya"
 building_jerusalem_muslim_al_khanqah_salahiyya_01_desc: "Llamada así por Salah ad-Din Yusuf ibn Ayyub, sirve como mezquita convencional y recuerda su paso por aquí. En los rincones perduran unos pocos vestigios de la época en que la mezquita fue una khanqah."
 building_jerusalem_muslim_al_khanqah_salahiyya_02: "Mezquita al-Khanqah as-Salahiyya Renovada"
 building_jerusalem_muslim_al_khanqah_salahiyya_02_desc: "Con las recientes reformas, la Mezquita al-Khanqah as-Salahiyya vuelve a recordar a la gente al gran general y sultán, a la vez que mantiene las tradiciones de la khanqah. Ha inspirado a muchos gobernantes y cazadores; quizá este lugar contribuya a mantener vivo su legado"
 building_jerusalem_muslim_al_khanqah_salahiyya_03: "Mezquita al-Khanqah as-Salahiyya ampliada"
 building_jerusalem_muslim_al_khanqah_salahiyya_03_desc: "Los dirigentes locales han aprovechado las recientes ampliaciones de la mezquita para engrandecer su propia leyenda y su prestigio."
 building_jerusalem_muslim_al_khanqah_salahiyya_04: "Mezquita al-Khanqah as-Salahiyya consagrada"
 building_jerusalem_muslim_al_khanqah_salahiyya_04_desc: "Tras su reciente reconsagración y otras mejoras, esta mezquita honra de verdad a quien le da nombre: Salah ad-Din Yusuf ibn Ayyub. En su tiempo, la mezquita alojó a sus oficiales y le sirvió de retiro espiritual personal. Su legado guía a futuros sultanes y gobernantes mientras planean el porvenir."
 JERUSALEM_MUSLIM_AL_KHANQAH_SALAHIYYA: "[GetBuilding('building_jerusalem_muslim_al_khanqah_salahiyya_04').GetName]"
 building_type_pit_of_malkav_01: "Foso de Ketef Hinnom"
 building_type_pit_of_malkav_01_desc: "#F Una brecha abierta se extiende bajo Jerusalén. Incluso acercarse duele. Sientes que la cabeza te va a estallar.#!"
 building_pit_of_malkav_01: "Foso abierto de Ketef Hinnom"
 building_pit_of_malkav_01_desc: "Tantas voces diciendo tantas cosas contradictorias... aunque en algunas todavía se vislumbra un tenue destello de sabiduría."
 building_pit_of_malkav_02: "Foso oculto de Ketef Hinnom"
 building_pit_of_malkav_02_desc: "Has arrojado piedras al foso y las voces están ahora menos frenéticas. Eres capaz de comprenderlas mejor."
 building_pit_of_malkav_03: "Foso cerrado de Ketef Hinnom"
 building_pit_of_malkav_03_desc: "Las voces callan ahora, salvo que estés muy cerca del propio foso. Estar cerca te permite separar con facilidad lo demente de lo revelador."
 building_pit_of_malkav_04: "Foso santificado de Ketef Hinnom"
 building_pit_of_malkav_04_desc: "Donde antes había voces dementes, ahora hay himnos que susurra el viento. Donde antes la locura se derramaba sobre esta tierra santa, ahora brotan bendiciones y sabiduría. Donde antes una bestia malvada asolaba las mentes de cuantos estaban cerca, ahora se alzan plegarias desde la tierra. Donde antes unas fauces voraces devoraban al incauto y al pecador, ahora los fieles peregrinan al gran templo erigido sobre lo que fue profano."
 POD_requirements_purified_pit_malkav: "El [holder|E] debe ser un [GetTrait('supehunter').GetName( GetPlayer )] y haber purificado el Foso mediante la [decision|E]."
