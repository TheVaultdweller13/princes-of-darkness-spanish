 building_type_constantinople_rebuild_seraglio_lighthouse_01: "Faro del Serrallo"
 building_type_constantinople_rebuild_seraglio_lighthouse_01_desc: "El mar de Mármara se convierte en el Cuerno de Oro en torno al faro del Serrallo, una luz en la oscuridad para los barcos que intentan llegar a la ciudad o salir de ella.\nCon los latinos expulsados de la ciudad, el faro vuelve a guiar a los barcos mercantes y no a los saqueadores."
