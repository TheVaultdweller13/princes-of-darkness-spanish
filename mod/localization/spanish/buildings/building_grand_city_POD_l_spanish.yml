 building_type_cairo_dust_bones_01: "Corte de Polvo y Huesos"
 building_type_cairo_dust_bones_01_desc: "#F Este Templo Fundador está ubicado fuera de El Cairo. Un centro de saber y hechicería Setita.#!"
 building_cairo_dust_bones_01: "Corte de Polvo y Huesos Reclamada"
 building_cairo_dust_bones_01_desc: "Este Templo Fundador está ubicado fuera de El Cairo. Un centro de saber y hechicería Setita."
