 building_type_constantinople_reform_constantinople_01: "Reformando Constantinopla"
 building_type_constantinople_reform_constantinople_01_desc: "Constantinopla nunca volverá a ser la misma. Es hora de seguir adelante y construir sobre las ruinas de lo antiguo hacia un futuro mejor."
 building_constantinople_reform_constantinople_01: "Sanando Constantinopla"
 building_constantinople_reform_constantinople_01_desc: "Una ciudad dividida entre su pasado y su presente, Constantinopla aún se está recuperando."
 building_constantinople_reform_constantinople_02: "Constantinopla Reformada"
 building_constantinople_reform_constantinople_02_desc: "Las cicatrices de 1204 se están desvaneciendo, al igual que su legado griego. Constantinopla está entrando en su siguiente etapa de evolución."
 building_constantinople_reform_constantinople_03: "Nueva Constantinopla"
 building_constantinople_reform_constantinople_03_desc: "Aunque nunca olvidará del todo su pasado, Constantinopla es ahora una ciudad nueva que se esfuerza por lograr tanto como antaño."
 
 building_type_constantinople_reform_great_palace_01: "Gran Palacio"
 building_type_constantinople_reform_great_palace_01_desc: "El Gran Palacio de Constantinopla, también conocido como el Palacio Sagrado, fue el mayor complejo palaciego imperial bizantino y se alzaba en el extremo sudoriental de la península. Sirvió como residencia imperial principal de los emperadores romanos de Oriente hasta 1081, y desde entonces fue el centro de la administración imperial.\nLa época de los emperadores se desvanece deprisa, y usar las ruinas para alojar a los necesitados mostraría la compasión de los nuevos gobernantes."
 building_constantinople_reform_great_palace_01: "Ruinas del Gran Palacio"
 building_constantinople_reform_great_palace_01_desc: "El Gran Palacio de Constantinopla, también conocido como el Palacio Sagrado, fue el mayor complejo palaciego imperial bizantino y se alzaba en el extremo sudoriental de la península. Sirvió como residencia imperial principal de los emperadores romanos de Oriente hasta 1081, y desde entonces fue el centro de la administración imperial.\nLa época de los emperadores se desvanece deprisa, y usar las ruinas para alojar a los necesitados mostraría la compasión de los nuevos gobernantes."
