 building_type_constantinople_plundered_harbor_of_sophia_01: "Puerto de Sofía"
 building_type_constantinople_plundered_harbor_of_sophia_01_desc: "Una dársena flanqueada por un arsenal rodeado de murallas; este puerto ha recibido muchos nombres a lo largo de la historia. Fue la base de la armada bizantina antes de la Cuarta Cruzada.\nAhora es el principal punto desde el que se envían los bienes robados de la ciudad caída a sus nuevos dueños occidentales."
