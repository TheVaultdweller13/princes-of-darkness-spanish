 building_constantinople_plundered_monastery_of_st_myrelaion_06: "Monasterio de San Myrelaion Destruido"
 building_constantinople_plundered_monastery_of_st_myrelaion_06_desc: "El palacio de Myrelaion fue construido sobre una gigantesca rotonda del siglo V antes de ser convertido en un convento. Este edificio es el primer ejemplo de una iglesia funeraria privada de un emperador bizantino, pero fue devastado por el fuego durante la Cuarta Cruzada y abandonado desde entonces.\nComo tumba de ricos emperadores, se ha convertido en un lugar de saqueo favorito para los conquistadores más codiciosos de Constantinopla."

 building_type_constantinople_plundered_seraglio_lighthouse_01: "Faro de Seraglio"
 building_type_constantinople_plundered_seraglio_lighthouse_01_desc: "El Mar de Mármara se convierte en el Cuerno de Oro alrededor del faro de Seraglio, una luz en la oscuridad para los barcos que intentan entrar o salir de la ciudad.\nTomado enseguida por los latinos durante la invasión, ahora señala a sus barcos cargados con las riquezas de la ciudad que abandonan el puerto."
