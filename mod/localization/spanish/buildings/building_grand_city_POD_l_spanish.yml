 building_type_constantinople_reform_the_hippodrome_01: "El Hipódromo"
 building_type_constantinople_reform_the_hippodrome_01_desc: "El Hipódromo de Constantinopla era un circo que fue el centro deportivo y social de la ciudad, famoso por sus carreras de caballos y de carros.\nLas carreras de carros son hace tiempo una moda pasada, pero las piedras que lo componen siguen siendo buenas y podrían ayudar a reconstruir la ciudad más deprisa de lo esperado."
