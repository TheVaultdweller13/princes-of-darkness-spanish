 POD_rome_cappadocian_desc: "El Panteón es la estructura más notable de esta región. Los mortales lo convirtieron en una iglesia dedicada a María y los Mártires, y trasladaron allí cientos de cuerpos de las catacumbas para volver a enterrarlos."
