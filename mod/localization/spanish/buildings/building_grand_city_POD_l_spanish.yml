 building_type_constantinople_reform_the_great_bazar_01: "El Gran Bazar"
 building_type_constantinople_reform_the_great_bazar_01_desc: "A pesar de toda la destrucción y ruina que se pudre tras las murallas de Constantinopla, nada ha podido apagar la chispa del Gran Bazar, el centro comercial donde latinos y helenos, este y oeste, mortales y cainitas, se mezclan en una gloriosa cacofonía urbana. Gracias a siglos de influencia vampírica, el Bazar nunca duerme.\nLos negocios no se preocupan mucho por quién gobierna la tierra y los mercaderes se han adaptado rápidamente a la nueva situación, devolviendo la prosperidad a la que fue una gran ciudad."
