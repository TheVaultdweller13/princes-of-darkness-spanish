 building_type_constantinople_plundered_hagia_sophia_01: "Santa Sofía"
 building_type_constantinople_plundered_hagia_sophia_01_desc: "Centro religioso y espiritual de la Iglesia ortodoxa oriental durante casi mil años, la iglesia estaba dedicada a la Santa Sabiduría. Es el mayor espacio interior del mundo y uno de los primeros en emplear una cúpula sobre pechinas. Se la considera el epítome de la arquitectura bizantina.\nConvertida en iglesia católica tras la Cuarta Cruzada, Santa Sofía ha sido despojada de casi toda su ornamentación por la primera oleada de invasores cruzados."
