 building_type_rome_st_peters_city_01: "El Vaticano"
 building_type_rome_st_peters_city_01_desc: "El Vaticano ha sido la sede del Papado desde que San Pedro creó la institución."
 building_rome_st_peters_city_01: "Esperanza de San Pedro"
 building_rome_st_peters_city_01_desc: "$building_type_rome_st_peters_city_01_desc$\n\nEl Santo Padre aprecia la presencia de la Inquisición, pero aún tendrá que demostrar su valía."
 building_rome_st_peters_city_02: "Determinación de San Pedro"
 building_rome_st_peters_city_02_desc: "$building_type_rome_st_peters_city_01_desc$\n\nLa Inquisición ha estado ocupada limpiando la ciudad de su infestación sobrenatural."
 building_rome_st_peters_city_03: "Ciudad de San Pedro"
 building_rome_st_peters_city_03_desc: "$building_type_rome_st_peters_city_01_desc$\n\nPor fin, la ciudad de Roma ha sido salvada. Sus ciudadanos pueden descansar tranquilos, sabiendo que no hay más peligros acechándolos en la noche."
 
 POD_rome_san_michele_library_desc: "Esta es una de las colecciones de saber oculto más impresionantes del mundo. Aquí se pueden encontrar libros sobre lo sobrenatural, demonología y magia. Varios Inquisidores también han donado sus colecciones privadas a la biblioteca."
 POD_rome_san_michele_library_bonus: "#P Cuando el propietario de este edificio usa Intercesión, el objetivo siempre gana [GetTrait('truefaith').GetName(GetNullCharacter)].#!"
 building_type_rome_san_michele_library_01: "Biblioteca de San Michele"
 building_type_rome_san_michele_library_01_desc: "Una sección del monasterio de San Michele, reservada para uso futuro de la Orden Roja.\n\n$POD_rome_san_michele_library_desc$"
 building_rome_san_michele_library_01: "Biblioteca di San Michele"
 building_rome_san_michele_library_01_desc: "Una sección del monasterio de San Michele, reservada para uso futuro de la Orden Roja."
 building_rome_san_michele_library_02: "Biblioteca di San Michele"
 building_rome_san_michele_library_02_desc: "Una sección del monasterio de San Michele, ocupada por la Orden Roja.\n\n$POD_rome_san_michele_library_desc$\n\n#X Si quieres mejorarlo más, necesitas completar la [decision|E] mayor para apoyar a la Orden Roja.#!"
 building_rome_san_michele_library_03: "Biblioteca di San Michele"
 building_rome_san_michele_library_03_desc: "Una sección del monasterio de San Michele, ocupada por la triunfante Orden Roja.\n\n$POD_rome_san_michele_library_desc$"
 
 POD_rome_san_michele_aedificium_desc: "Esta imponente estructura contiene las oficinas administrativas de la Inquisición, incluyendo las cámaras de trabajo del Inquisidor General, el Mayordomo, el Censor Oficial, el Condottiero General y una serie de administradores menos importantes."
 POD_rome_san_michele_aedificium_bonus: "#P Mientras la Inquisición controle este edificio, el papa siempre será solidario.#!"
 building_type_rome_san_michele_aedificium_01: "Aedificium de San Michele"
 building_type_rome_san_michele_aedificium_01_desc: "Una sección del monasterio de San Michele, reservada para uso futuro de la Casa Murnau.\n\n$POD_rome_san_michele_aedificium_desc$"
 building_rome_san_michele_aedificium_01: "Edificio di San Michele"
 building_rome_san_michele_aedificium_01_desc: "Una sección del monasterio de San Michele, reservada para uso futuro de la Casa Murnau."
 building_rome_san_michele_aedificium_02: "Edificio di San Michele"
 building_rome_san_michele_aedificium_02_desc: "Una sección del monasterio de San Michele, ocupada por la Casa Murnau.\n\n$POD_rome_san_michele_aedificium_desc$\n\n#X Si quieres mejorarlo más, necesitas completar la [decision|E] mayor para apoyar a la Casa Murnau.#!"
 building_rome_san_michele_aedificium_03: "Edificio di San Michele"
 building_rome_san_michele_aedificium_03_desc: "Una sección del monasterio de San Michele, ocupada por una triunfante Casa Murnau.\n\n$POD_rome_san_michele_aedificium_desc$"
 
 POD_rome_san_michele_reliquary_desc: "Las muchas reliquias de la Inquisición se almacenan en esta bóveda. Tiene una antecámara que se utiliza para la exhibición ocasional. La oficina del Relicario está contigua a la antecámara."
 POD_rome_san_michele_reliquary_bonus: "#P El propietario de este edificio puede comprar [artifact_claims|E], y hacerlo a un costo reducido.#!"
 building_type_rome_san_michele_reliquary_01: "Gran Relicario de San Michele"
 building_type_rome_san_michele_reliquary_01_desc: "Una sección del monasterio de San Michele, reservada para uso futuro de los Caballeros de Acre.\n\n$POD_rome_san_michele_reliquary_desc$"
 building_rome_san_michele_reliquary_01: "Grande Reliquario di San Michele"
 building_rome_san_michele_reliquary_01_desc: "Una sección del monasterio de San Michele, reservada para uso futuro de los Caballeros de Acre."
 building_rome_san_michele_reliquary_02: "Grande Reliquario di San Michele"
 building_rome_san_michele_reliquary_02_desc: "Una sección del monasterio de San Michele, ocupada por los Caballeros de Acre.\n\n$POD_rome_san_michele_reliquary_desc$\n\n#X Si quieres mejorarlo más, necesitas completar la [decision|E] mayor para apoyar a los Caballeros de Acre.#!"
 building_rome_san_michele_reliquary_03: "Grande Reliquario di San Michele"
 building_rome_san_michele_reliquary_03_desc: "Una sección del monasterio de San Michele, ocupada por los triunfantes Caballeros de Acre.\n\n$POD_rome_san_michele_reliquary_desc$"
 
 POD_rome_san_michele_basilica_desc: "Esta inspiradora basílica es el lugar principal de culto para todos los que están dentro de los muros del monasterio. Es una estructura elaborada de estilos arquitectónicos contrastantes. El nivel inferior de la basílica contiene varias capillas más pequeñas, generalmente dedicadas al culto privado."
 POD_rome_san_michele_basilica_bonus: "#P El propietario de este edificio puede meditar en retiro, lo que tiene mejores resultados cuando se hace en la Basílica.#!"
 building_type_rome_san_michele_basilica_01: "Basílica de San Michele"
 building_type_rome_san_michele_basilica_01_desc: "Una sección del monasterio de San Michele, reservada para uso futuro de las Hermanas de San Juan.\n\n$POD_rome_san_michele_basilica_desc$"
 building_rome_san_michele_basilica_01: "Basilica di San Michele"
 building_rome_san_michele_basilica_01_desc: "Una sección del monasterio de San Michele, reservada para uso futuro de las Hermanas de San Juan."
 building_rome_san_michele_basilica_02: "Basilica di San Michele"
 building_rome_san_michele_basilica_02_desc: "Una sección del monasterio de San Michele, ocupada por las Hermanas de San Juan.\n\n$POD_rome_san_michele_basilica_desc$\n\n#X Si quieres mejorarlo más, necesitas completar la [decision|E] mayor para apoyar a las Hermanas de San Juan.#!"
 building_rome_san_michele_basilica_03: "Basilica di San Michele"
 building_rome_san_michele_basilica_03_desc: "Una sección del monasterio de San Michele, ocupada por las triunfantes Hermanas de San Juan.\n\n$POD_rome_san_michele_basilica_desc$"
 
 POD_rome_san_michele_cloisters_desc: "Este edificio de tres pisos alberga a todos los Inquisidores que viven en residencia. Incluye dos cocinas, un comedor y dos cámaras de comedor más pequeñas. El primer piso de los claustros contiene una gran capilla, generalmente utilizada solo para devoción privada, y se pueden encontrar capillas privadas más pequeñas en los dos pisos superiores."
 POD_rome_san_michele_cloisters_bonus: "#P El propietario de este edificio tiene duplicada la [planning_speed|E] en el [journey|E] Encontrar Guarida.#!"
 building_type_rome_san_michele_cloisters_01: "Claustros de San Michele"
 building_type_rome_san_michele_cloisters_01_desc: "Una sección del monasterio de San Michele, reservada para uso futuro de los Oculi Dei.\n\n$POD_rome_san_michele_cloisters_desc$"
 building_rome_san_michele_cloisters_01: "Chiostri di San Michele"
 building_rome_san_michele_cloisters_01_desc: "Una sección del monasterio de San Michele, reservada para uso futuro de los Oculi Dei."
 building_rome_san_michele_cloisters_02: "Chiostri di San Michele"
 building_rome_san_michele_cloisters_02_desc: "Una sección del monasterio de San Michele, ocupada por los Oculi Dei.\n\n$POD_rome_san_michele_cloisters_desc$\n\n#X Si quieres mejorarlo más, necesitas completar la [decision|E] mayor para apoyar a los Oculi Dei.#!"
 building_rome_san_michele_cloisters_03: "Chiostri di San Michele"
 building_rome_san_michele_cloisters_03_desc: "Una sección del monasterio de San Michele, ocupada por los triunfantes Oculi Dei.\n\n$POD_rome_san_michele_cloisters_desc$"
 
 
