 building_type_constantinople_reform_harbor_of_sophia_01: "Puerto de Sophia"
 building_type_constantinople_reform_harbor_of_sophia_01_desc: "Una dársena flanqueada por un arsenal rodeado de murallas; este puerto ha recibido muchos nombres a lo largo de la historia. Fue la base de la armada bizantina antes de la Cuarta Cruzada.\nSigue teniendo importancia estratégica para los nuevos gobernantes de Constantinopla, de modo que fortificarlo sería una sólida medida defensiva."
