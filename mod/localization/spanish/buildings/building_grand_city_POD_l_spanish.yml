 building_type_cairo_khitta_lama_01: "Banu al-Lam'a"
 building_type_cairo_khitta_lama_01_desc: "#F Una $glossary_khitta$ alineada con los Ashirra.\n\nFundada por el Lasombra Sharif al-Lam'a, este es el dominio de los Lasombra de El Cairo. El bazar ubicado aquí es considerado un Elíseo para todos los vampiros, siempre que respeten las reglas.#!"
 building_cairo_khitta_lama_01: "Pequeña Khitta Banu al-Lam'a"
 building_cairo_khitta_lama_01_desc: "Una $glossary_khitta$ alineada con los Ashirra.\n\nFundada por el Lasombra Sharif al-Lam'a, este es el dominio de los Lasombra de El Cairo. El bazar ubicado aquí es considerado un Elíseo para todos los vampiros, siempre que respeten las reglas."
