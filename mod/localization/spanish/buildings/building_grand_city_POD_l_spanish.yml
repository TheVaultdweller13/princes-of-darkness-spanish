 building_type_constantinople_rebuild_the_hippodrome_01: "El Hipódromo"
 building_type_constantinople_rebuild_the_hippodrome_01_desc: "El Hipódromo de Constantinopla era un circo que fue el centro deportivo y social de la ciudad, famoso por sus carreras de caballos y de carros.\nRestaurar el lugar y reanudar los juegos complacería a la población (aunque probablemente también volverían los disturbios de los aficionados)."
