 building_type_rome_eternal_rome_01: "Roma Eterna"
 building_type_rome_eternal_rome_01_desc: "Los días de gloria del Imperio Romano pueden haber quedado atrás, pero si escuchas con atención, aún puedes oír sus ecos."
 building_rome_eternal_rome_01: "Roma Dividida"
 building_rome_eternal_rome_01_desc: "$building_type_rome_eternal_rome_01_desc$"
 building_rome_eternal_rome_02: "Roma Inconquistada"
 building_rome_eternal_rome_02_desc: "Los ciudadanos de Roma se sienten revitalizados, sabiendo que la ciudad tiene un futuro brillante por delante."
 building_rome_eternal_rome_03: "Roma Eterna"
 building_rome_eternal_rome_03_desc: "Una vez más, Roma se ha convertido en la joya de la corona del Mediterráneo. Los mortales no saben a quién deben agradecer el resurgimiento de la ciudad, pero están agradecidos de todos modos."
 
 POD_rome_colosseum_bonus: "[Select_CString(IsInGame,GuiScope.Custom('POD_colosseum_loc'),GuiScope.Custom('POD_colosseum_loc_null'))]"
 POD_rome_colosseum_bonus_dlc: "#P El propietario de este edificio puede celebrar #TOOLTIP:ACTIVITY_TYPE,activity_gruesome_festival #L Festivales Horripilantes#!#! y ejecutar [prisoners|E] alimentándolos con animales salvajes.#!"
 POD_rome_colosseum_bonus_dlc_null: "#P El propietario de este edificio puede celebrar Festivales Horripilantes y ejecutar [prisoners|E] alimentándolos con animales salvajes.#!"
 POD_rome_colosseum_bonus_nodlc: "#P El propietario de este edificio puede ejecutar [prisoners|E] alimentándolos con animales salvajes.#!"
 building_type_rome_colosseum_01: "El Coliseo"
 building_type_rome_colosseum_01_desc: "El anfiteatro más grande jamás construido. Los años lo han erosionado, los terremotos lo han dañado, sus piedras han sido tomadas y reutilizadas para otros proyectos de construcción, y sin embargo, sigue en pie, tan imponente ahora como en la antigüedad."
 building_rome_colosseum_01: "El Coliseo"
 building_rome_colosseum_01_desc: "$building_type_rome_colosseum_01_desc$\n\nUn gobernante glorioso podría restaurarlo a su propósito original.\n\n#X Si quieres mejorarlo, necesitas ser un [GetTrait('august').GetName(GetNullCharacter)] o emplear a un [GetCourtPositionType('seneschal_court_position').GetName()] con [aptitude|E] Excelente.#!"
 building_rome_colosseum_02: "Coliseo Restaurado"
 building_rome_colosseum_02_desc: "Durante el día, este gran anfiteatro alberga dramas, conciertos musicales y otros entretenimientos para los mortales. Por la noche... suceden cosas menos agradables."
 
 building_type_rome_hadrianstomb_01: "Mausoleo de Adriano"
 building_type_rome_hadrianstomb_01_desc: "Esta tumba cilíndrica es la estructura más alta de toda la ciudad. Solía contener las urnas y cenizas de muchos emperadores romanos, hasta que los saqueadores visigodos las esparcieron durante el saqueo de Roma."
 POD_rome_hadrianstomb_bonus: "#P El propietario de este edificio puede comprar [artifact_claims|E], y hacerlo a un costo reducido.#!"
 building_rome_hadrianstomb_01: "Mausoleo de Adriano"
 building_rome_hadrianstomb_01_desc: "$building_type_rome_hadrianstomb_01_desc$\n\nUn gobernante astuto podría fortificarlo y convertirlo en una cámara acorazada.\n\n#X Para mejorarlo, debes ser [GetTrait('erudite').GetName(GetNullCharacter)] o emplear a un [GetCourtPositionType('antiquarian_court_position').GetName()] con [aptitude|E] Excelente.#!"
 building_rome_hadrianstomb_02: "Castillo Sant'Angelo"
 building_rome_hadrianstomb_02_desc: "Este antiguo mausoleo se ha convertido en una fortaleza segura. Situado en medio de la ciudad, puede que no tenga mucho valor militar, pero es un gran lugar para almacenar tesoros valiosos."
 
 building_type_rome_aqueduct_01: "Acueducto"
 building_type_rome_aqueduct_01_desc: "El último acueducto funcional de la antigua Roma. En su apogeo, podía entregar 100 millones de litros de agua por día a los ciudadanos sedientos... o a los emperadores que querían darse un baño de lujo."
 POD_rome_aqueduct_bonus: "#P El propietario de este edificio puede usar [diligent_development_focus_decision|E] si este condado es su capital.#!"
 building_rome_aqueduct_01: "Aqua Virgo"
 building_rome_aqueduct_01_desc: "$building_type_rome_aqueduct_01_desc$\n\nUn gobernante experto en ingeniería podría renovarlo para mejorar el nivel de vida de la ciudad.\n\n#X Si quieres mejorarlo, necesitas ser un [GetTrait('architect').GetName(GetNullCharacter)] o emplear a un [GetCourtPositionType('royal_architect_court_position').GetName()] con [aptitude|E] Excelente.#!"
 building_rome_aqueduct_02: "Acqua Vergine"
 building_rome_aqueduct_02_desc: "Este antiguo acueducto ha sido extendido y reacondicionado empleando las técnicas de ingeniería más avanzadas. Suministra una de las aguas potables más puras de Roma, y se puede ver a muchas personas llenando recipientes para beber y cocinar."
 
 building_type_rome_pasquino_01: "Estatua Parlante"
 building_type_rome_pasquino_01_desc: "Una estatua recientemente desenterrada de algún héroe griego u otro. Los ciudadanos de Roma la están usando como tablón de anuncios, pegando críticas anónimas y poemas satíricos en su base, fingiendo que es la estatua quien los dice.\n\nAlgunos dicen que la estatua se parece a Menelao, pero eso suena a tonterías."
 POD_rome_pasquino_bonus: "#P El propietario de este edificio puede usar #V Propaganda#! [character_interaction|E] para eliminar uno de sus rasgos criminales.#!"
 building_rome_pasquino_01: "Pasquino"
 building_rome_pasquino_01_desc: "Una estatua recientemente desenterrada de algún héroe griego u otro. Los ciudadanos de Roma la están usando como tablón de anuncios, pegando críticas anónimas y poemas satíricos en su base, fingiendo que es la estatua quien los dice.\n\nUn gobernante astuto podría usarla para influir en la opinión pública.\n\n#X Si quieres mejorarlo, necesitas ser un [GetTrait('schemer').GetName(GetNullCharacter)] o tener un [spymaster|E] con al menos 20 de [intrigue|E] en el [council|E].#!"
 building_rome_pasquino_02: "Pasquino el Persuasivo"
 building_rome_pasquino_02_desc: "Los ciudadanos que dejan mensajes anónimos en esta estatua creen que critican al gobernante de la ciudad. En verdad, solo dicen lo que el #italic verdadero#! gobernante de la ciudad les permite decir."
 
 # Edificio especial para Hombres Lobo
 building_type_rome_tiber_01: "$building_rome_tiber_01$"
 building_type_rome_tiber_01_desc: "$building_rome_tiber_01_desc$"
 building_rome_tiber_01: "El Río Tíber"
 building_rome_tiber_01_desc: "La civilización tiene un control férreo sobre esta región. La poca naturaleza que queda está siendo domesticada por los habitantes de la ciudad.\n\nSin embargo, algunos Garou emprendedores han logrado lanzar incursiones nocturnas a la metrópolis, trayendo armas y otros suministros."

