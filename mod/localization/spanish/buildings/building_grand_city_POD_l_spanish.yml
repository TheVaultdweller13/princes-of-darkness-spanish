 building_constantinople_reform_aqueduct_of_valens_01_desc: "El Acueducto de Valente es un sistema de acueducto romano construido a finales del siglo IV d. C. para abastecer a Constantinopla. La construcción del acueducto comenzó durante el reinado del emperador romano Constancio II y fue completada en el 373 por el Emperador Valente. El acueducto sigue en uso hasta el día de hoy, habiendo sido extendido y mantenido por los bizantinos.\nAún realizando una tarea muy importante para la comunidad, ha sido reparado e integrado en el mantenimiento realizado por los nuevos amos de Constantinopla."
 building_constantinople_reform_aqueduct_of_valens_02: "Restos del Acueducto de Valente"
 building_constantinople_reform_aqueduct_of_valens_02_desc: "El Acueducto de Valente es un sistema de acueducto romano construido a finales del siglo IV d. C. para abastecer a Constantinopla. La construcción del acueducto comenzó durante el reinado del emperador romano Constancio II y fue completada en el 373 por el Emperador Valente. El acueducto sigue en uso hasta el día de hoy, habiendo sido extendido y mantenido por los bizantinos.\nAún realizando una tarea muy importante para la comunidad, ha sido reparado e integrado en el mantenimiento realizado por los nuevos amos de Constantinopla."
 building_constantinople_reform_aqueduct_of_valens_03: "Construyendo el Acueducto del Halcón Gris"
 building_constantinople_reform_aqueduct_of_valens_03_desc: "El Acueducto de Valente es un sistema de acueducto romano construido a finales del siglo IV d. C. para abastecer a Constantinopla. La construcción del acueducto comenzó durante el reinado del emperador romano Constancio II y fue completada en el 373 por el Emperador Valente. El acueducto sigue en uso hasta el día de hoy, habiendo sido extendido y mantenido por los bizantinos.\nAún realizando una tarea muy importante para la comunidad, ha sido reparado e integrado en el mantenimiento realizado por los nuevos amos de Constantinopla."
 building_constantinople_reform_aqueduct_of_valens_04: "Acueducto del Halcón Gris"
 building_constantinople_reform_aqueduct_of_valens_04_desc: "El Acueducto de Valente es un sistema de acueducto romano construido a finales del siglo IV d. C. para abastecer a Constantinopla. La construcción del acueducto comenzó durante el reinado del emperador romano Constancio II y fue completada en el 373 por el Emperador Valente. El acueducto sigue en uso hasta el día de hoy, habiendo sido extendido y mantenido por los bizantinos.\nAún realizando una tarea muy importante para la comunidad, ha sido reparado e integrado en el mantenimiento realizado por los nuevos amos de Constantinopla."
 building_constantinople_reform_aqueduct_of_valens_05: "Acueducto del Halcón Gris Completado"
 building_constantinople_reform_aqueduct_of_valens_05_desc: "El Acueducto de Valente es un sistema de acueducto romano construido a finales del siglo IV d. C. para abastecer a Constantinopla. La construcción del acueducto comenzó durante el reinado del emperador romano Constancio II y fue completada en el 373 por el Emperador Valente. El acueducto sigue en uso hasta el día de hoy, habiendo sido extendido y mantenido por los bizantinos.\nAún realizando una tarea muy importante para la comunidad, ha sido reparado e integrado en el mantenimiento realizado por los nuevos amos de Constantinopla."
 
 
 #############################
 ##### París Caballeresca ####
 #############################
 
 building_type_paris_chivalric_01: "París Caballeresca"
 building_type_paris_chivalric_01_desc: "#F Gobernada por los caballerescos Toreador y los nobles Ventrue, París tiene el potencial de convertirse en el centro del mundo Cainita.#!"
 building_paris_chivalric_01: "París Dividida"
 building_paris_chivalric_01_desc: "Devastada por el conflicto y la intriga, la influencia de París es un mero recuerdo de lo que una vez fue."
 building_paris_chivalric_02: "París Cortesana"
 building_paris_chivalric_02_desc: "Lenta pero seguramente, París está recuperando su estatus anterior."
 building_paris_chivalric_03: "París Caballeresca"
 building_paris_chivalric_03_desc: "Tal reino nunca antes había existido en el mundo Cainita. El esplendor de París deslumbra a todos los que lo contemplan. "
 
 building_type_paris_courts_love_01: "Cortes del Amor"
 building_type_paris_courts_love_01_desc: "#F Las Cortes del Amor es un dominio vampírico e institución feudal que fue formada por los Toreador franceses. Fue respaldada principalmente por Toreador atraídos al concepto de caballería en sus expresiones más poéticas y rápidamente se convirtió en uno de los puntos de reunión para los Cainitas interesados en la caballería.#!"
 building_paris_courts_love_01: "Corte Estancada"
 building_paris_courts_love_01_desc: "Francia está en conflicto y la Corte de París abandonada. Solo el tiempo dirá si un resurgimiento es posible."
 building_paris_courts_love_02: "Corte Floreciente"
 building_paris_courts_love_02_desc: "Un puñado de las cortes han sido reclamadas bajo la autoridad de París. Las chispas de belleza se encienden una vez más."
 building_paris_courts_love_03: "Corte Dominante"
 building_paris_courts_love_03_desc: "Francia está nuevamente bajo el control de las Cortes del Amor. París ha recuperado su ilustre posición."
 building_paris_courts_love_04: "Corte del Amor Exaltada"
 building_paris_courts_love_04_desc: "No hay mayor muestra de gracia y belleza que la Corte de París. Los Cainitas acuden de todo el mundo para tener la oportunidad de maravillarse con ella."
 POD_paris_courts_love_bonus:0 "Gana el rasgo [GetTrait('lifestyle_poet').GetName(GetNullCharacter)] cuando se construye"
 POD_requirements_paris_courts_love_02: "El [holder|E] necesita tener tres de los [Concept('duchy','ducados')|E] $glossary_courts_of_love$ bajo su control directo o controlados por sus súbditos [GetTrait('toreador').GetName(GetNullCharacter)]"
 POD_requirements_paris_courts_love_03: "El [holder|E] necesita tener cuatro de los [Concept('duchy','ducados')|E] $glossary_courts_of_love$ bajo su control directo o controlados por sus súbditos [GetTrait('toreador').GetName(GetNullCharacter)]"
 POD_requirements_paris_courts_love_04: "El [holder|E] necesita tener todos los [Concept('duchy','ducados')|E] $glossary_courts_of_love$ bajo su control directo o controlados por sus súbditos [GetTrait('toreador').GetName(GetNullCharacter)]"
 
 building_type_paris_night_tournaments_01: "Torneos Nocturnos"
 building_type_paris_night_tournaments_01_desc: "#F Una de las bases de la caballería es la destreza marcial. Aquí los caballeros vampíricos pueden entrenar y probarse unos contra otros.#!"
 building_paris_night_tournaments_01: "Compra de Terreno"
 building_paris_night_tournaments_01_desc: "Primero necesitamos un lugar para construir nuestro salón y terrenos."
 building_paris_night_tournaments_02: "Salón de la Rosa"
 building_paris_night_tournaments_02_desc: "Con la construcción del Salón de la Rosa, el entrenamiento puede comenzar ahora."
 building_paris_night_tournaments_03: "Contiendas Oscuras"
 building_paris_night_tournaments_03_desc: "Se necesita mucha moderación para que los vampiros no se despedacen entre sí durante el combate. Aunque es útil en la batalla, lamentablemente es deshonroso durante los duelos caballerescos."
 building_paris_night_tournaments_04: "Torneos Caballerescos"
 building_paris_night_tournaments_04_desc: "Con los impulsos violentos de los vampiros sometidos, ahora se permite a los mortales presenciar estos espectáculos. Algunos se preguntan por qué estos torneos ocurren solo durante la noche, pero esas preguntas se olvidan rápidamente en medio de la habilidad y belleza de los caballeros."
 POD_paris_night_tournaments_bonus:0 "Gana el rasgo [GetTrait('lifestyle_blademaster').GetName(GetNullCharacter)] cuando se construye"
 
 building_type_paris_grand_court_01: "Gran Corte"
 building_type_paris_grand_court_01_desc: "#F La Gran Corte es una institución feudal vampírica creada originalmente por el Matusalén Ventrue Alexander. Es una alianza de poderosos Ventrue y Toreador de París.#!"
 building_paris_grand_court_01: "Corte Insignificante"
 building_paris_grand_court_01_desc: "La Corte ha estado en ruinas desde el exilio de Alexander. Se debe hacer un gran esfuerzo para restaurar la influencia de los Ventrue."
 building_paris_grand_court_02: "Corte Débil"
 building_paris_grand_court_02_desc: "Muy lejos de lo que fue, aun así la influencia y el control se van recuperando poco a poco"
 building_paris_grand_court_03: "Corte Ascendente"
 building_paris_grand_court_03_desc: "Con París y sus alrededores nuevamente bajo control Ventrue, el reino finalmente se está estabilizando."
 building_paris_grand_court_04: "Gran Corte"
 building_paris_grand_court_04_desc: "La Gran Corte ha renacido bajo un nuevo gobernante. Este reino se convertirá en la envidia de todos los Ventrue."
 
 building_type_paris_alexander_court_01: "Gran Corte de Alexander"
 building_type_paris_alexander_court_01_desc: "#F Alexander era un Matusalén Ventrue que se convirtió en el Príncipe de París durante muchos siglos después de la caída de Roma. En París creó su Gran Corte, que gobernó utilizando el miedo y la justicia con la cooperación de varios Antiguos Toreador.#!"
 building_paris_alexander_court_01: "Rey Regresado"
 building_paris_alexander_court_01_desc: "Alexander, el verdadero Príncipe de París, ha regresado a su ciudad. Su obra no ha hecho más que empezar."
 building_paris_alexander_court_02: "Corte Asegurada"
 building_paris_alexander_court_02_desc: "Habiendo recuperado la mayor parte de su antigua influencia, el Matusalén ahora puede trabajar para aumentar aún más su poder."
 building_paris_alexander_court_03: "Corte Establecida"
 building_paris_alexander_court_03_desc: "La corte está vibrante con súbditos complacientes, diplomáticos visitantes y nobles caballeros, cada uno compitiendo por el favor de Alexander."
 building_paris_alexander_court_04: "Gran Monarca de las Cortes"
 building_paris_alexander_court_04_desc: "Su control sobre Francia es indiscutible, Alexander reinará eternamente. Cuidado con los vampiros impulsados por el miedo y la admiración a su amo."
 
 POD_requirements_paris_ventrue_01: "El [holder|E] también debe poseer [GetTitleByKey('d_valois').GetName]"
 POD_requirements_paris_ventrue_02: "El [holder|E] también debe poseer [GetTitleByKey('k_grand_court').GetName]"
 
 building_type_paris_tremere_chantry_01: "Casa de los Tremere"
 building_type_paris_tremere_chantry_01_desc: "#F Hay pocas cosas más importantes para los Tremere que su casa. Es un hogar, una base, una fortaleza y un archivo. La casa es lo primero que los Tremere establecen cuando establecen una presencia en una ciudad, y la defenderán hasta su última sangre. La Casa Tremere de París es una de las más antiguas del Clan y segunda en poder e influencia solo después de Ceoris.#!"
 building_paris_tremere_chantry_01: "Casa Menor"
 building_paris_tremere_chantry_01_desc: "La Casa es pequeña e insignificante, carece de muchas instalaciones que poseen la mayoría de las casas."
 building_paris_tremere_chantry_02: "Casa Expandida"
 building_paris_tremere_chantry_02_desc: "Equipada con una biblioteca, la casa está atrayendo lentamente a nuevos miembros."
 building_paris_tremere_chantry_03: "Casa Grande"
 building_paris_tremere_chantry_03_desc: "A medida que crece, las necesidades de seguridad de la casa se han satisfecho con numerosos gárgolas vinculados a sus nuevos amos."
 building_paris_tremere_chantry_04: "Casa Reverenciada"
 building_paris_tremere_chantry_04_desc: "Con sus nuevos recursos e influencia, la casa de París se ha convertido en un hogar para muchos poderosos Tremere. "
 
 POD_paris_tremere_chantry_bonus_1: "Puede reclutar [GetMaA('gargoyle_razorbats').GetName] como [men_at_arms|E]"
 POD_paris_tremere_chantry_bonus_2: "$POD_paris_tremere_chantry_bonus_1$\nPuede reclutar [GetMaA('gargoyle_scouts').GetName] y [GetMaA('gargoyle_sentinels').GetName] como [men_at_arms|E]"
 POD_paris_tremere_chantry_bonus_3: "$POD_paris_tremere_chantry_bonus_2$\nPuede reclutar [GetMaA('gargoyle_warriors').GetName] como [men_at_arms|E]"
 POD_paris_tremere_chantry_bonus_4: "El [GetTrait('tremere').GetName(GetNullCharacter)] local te ofrecerá un \"regalo\"\n\n$POD_paris_tremere_chantry_bonus_3$"
 
 building_type_paris_nosferatu_warren_01: "Madriguera Nosferatu"
 building_type_paris_nosferatu_warren_01_desc: "#F Esta Madriguera Nosferatu data de los primeros asentamientos en el río Sena. Dio origen a una Línea de Sangre Nosferatu distintiva, los traslúcidos Parisii de la Dama Mnemach.#!"
 building_paris_nosferatu_warren_01:0 "Buscar en las Profundidades"
 building_paris_nosferatu_warren_01_desc: "Los Nosferatu se escabullen en las profundidades subterráneas de las catacumbas parisinas. Sus habilidades serían inmensamente útiles si puedes conseguir su lealtad, o incluso encontrarlos."
 building_paris_nosferatu_warren_02:0 "Pasajes Sinuosos"
 building_paris_nosferatu_warren_02_desc: "Notando tu intrusión, los Nosferatu han enviado a uno de los suyos para descubrir tus intenciones."
 building_paris_nosferatu_warren_03:0 "Palacio Subterráneo"
 building_paris_nosferatu_warren_03_desc: "Habiendo negociado exitosamente con el vampiro, te llevan a su palacio subterráneo. Parece que este palacio, si se le puede llamar así, existía mucho antes que la propia París."
 building_paris_nosferatu_warren_04:0 "Sombras de París"
 building_paris_nosferatu_warren_04_desc: "Al ofrecerles privilegios normalmente reservados para los Altos Clanes, los Nosferatu han aceptado ser tus ojos y oídos en todos los rincones de París."
 
 building_type_paris_royal_palace_01: "Palacio de la Ciudad"
 building_type_paris_royal_palace_01_desc: "#F El Palacio de la Ciudad, ubicado en la Île de la Cité del río Sena, es la residencia de los Reyes de Francia. También es la ubicación de los archivos reales, el tesoro y los tribunales.#!"
 building_paris_royal_palace_01: "Controlar a los Sirvientes"
 building_paris_royal_palace_01_desc: "Tener ojos y oídos dentro del palacio será de gran ayuda para asegurarlo."
 building_paris_royal_palace_02: "Títere de la Nobleza"
 building_paris_royal_palace_02_desc: "Nobles de diferente estatus van y vienen. Sus palabras sirven como sus armas, y ahora como las tuyas."
 building_paris_royal_palace_03: "Cautivar al Conserje"
 building_paris_royal_palace_03_desc: "El segundo individuo más importante del palacio. Ahora a través de él, todas las puertas han sido abiertas."
 building_paris_royal_palace_04: "Sombra Tras el Trono"
 building_paris_royal_palace_04_desc: "Algunos vampiros podrían considerar que controlar a un poderoso monarca mortal viola la mascarada. La realidad es que esos vampiros son simplemente demasiado débiles para lograr lo que tú has hecho."
 
 building_type_paris_food_market_01: "Les Champeaux"
 building_type_paris_food_market_01_desc: "#F Originalmente un mercado de granos, se ha convertido en el principal mercado de alimentos de París.#!"
 building_paris_food_market_01: "Pavimentar el Mercado"
 building_paris_food_market_01_desc: "Pavimentar los caminos del mercado es una forma sencilla de fomentar una mayor actividad en el mercado."
 building_paris_food_market_02: "Persuadir a los Mercaderes"
 building_paris_food_market_02_desc: "Los mercaderes pueden no estar ansiosos por bajar sus precios, pero puedes ser muy persuasivo."
 building_paris_food_market_03: "Adquirir los Puestos"
 building_paris_food_market_03_desc: "El control directo de los puestos afianzará el dominio sobre el mercado de alimentos, donde puedes asegurarte de que los campesinos coman hasta hartarse. Al fin y al cabo, un campesino gordo es un campesino feliz."
 building_paris_food_market_04: "Patriarca Benigno"
 building_paris_food_market_04_desc: "Con alimentos en tan amplia oferta, tu nombre siempre es susurrado en agradecimiento en cada comida. Una cosa menor, pero una población devota es un gran activo."
 
 building_type_paris_guilds_01: "Los Gremios"
 building_type_paris_guilds_01_desc: "#F Los muchos artesanos y artífices de París estaban organizados en gremios. Estos gremios fueron creados para proteger contra la competencia y el desempleo; afortunadamente, un vampiro no es ninguna de esas cosas.#!"
 building_paris_guilds_01: "Expandir las Casas de Gremios"
 building_paris_guilds_01_desc: "Un hombre rico en la noche ofrece su patrocinio. ¿Quién resistiría tal oportunidad?"
 building_paris_guilds_02: "Reemplazar a los Proveedores"
 building_paris_guilds_02_desc: "Si su única opción es comprarte a ti, ¿quién está realmente a cargo?"
 building_paris_guilds_03: "Encantar a los Artesanos"
 building_paris_guilds_03_desc: "La promesa de riqueza y quizás algo de persuasión vampírica hará que obedezcan sin cuestionar."
 building_paris_guilds_04: "Maestro de Gremios de la Noche"
 building_paris_guilds_04_desc: "Aunque hay muchos gremios, ahora solo hay un maestro. Su riqueza fluye libremente hacia tus bolsillos."
 
 building_type_paris_university_01: "Sorbona"
 building_type_paris_university_01_desc: "#F También conocida como la Universidad de París, es la segunda universidad más antigua de toda Europa.#!"
 building_paris_university_01: "Suplantar las Enseñanzas"
 building_paris_university_01_desc: "Muchos de estos textos contienen conocimiento útil. Quizás demasiado útil para los mortales. Cuanto menos sepan, mejor. "
 building_paris_university_02: "Manipular a los Maestros"
 building_paris_university_02_desc: "A veces un mortal aprende demasiado y comienza a hacer preguntas que no debería. Una respuesta falsa los devolverá a la ignorancia."
 building_paris_university_03: "Desarrollar las Bibliotecas"
 building_paris_university_03_desc: "Los vampiros pueden ser inmortales, pero el mundo cambia constantemente. Cuanto más conocimiento tengas acceso, más fácil será adaptarse."
 building_paris_university_04: "Faro de Conocimiento"
 building_paris_university_04_desc: "Eruditos de todo tipo acuden en masa al vasto conocimiento que has acumulado. Conocimiento cuidadosamente seleccionado para alejarlos de aprender la verdad."
 
 building_type_paris_walls_augustus_01: "Muralla de Felipe II Augusto"
 building_type_paris_walls_augustus_01_desc: "#F Construida bajo el mando de Felipe Augusto, quien también contribuyó al costo de la construcción, estas murallas protegerían París de amenazas externas.#!"
 building_paris_walls_augustus_01: "Fortalecer las Murallas"
 building_paris_walls_augustus_01_desc: "Aunque ya son lo suficientemente fuertes para repeler a los mortales, algunos sobrenaturales pueden fácilmente escabullirse o incluso destruir partes de la muralla."
 building_paris_walls_augustus_02: "Convertir en Ghoul a los Guardias"
 building_paris_walls_augustus_02_desc: "Un ghoul es leal. Un ghoul es sabio. Un ghoul es efectivo. Un ghoul es prescindible."
 building_paris_walls_augustus_03: "Levantar las Torres"
 building_paris_walls_augustus_03_desc: "Muchas criaturas de la noche surcan los cielos. Disponer de un punto de observación más elevado permitirá a tus guardias recién convertidos en ghouls divisarlas con más facilidad."
 building_paris_walls_augustus_04: "Guardián de la Medianoche"
 building_paris_walls_augustus_04_desc: "Con tus mejoras en las defensas, París está ahora lista para hacer frente a cualquier ataque sobrenatural que pueda llegar."
 
 building_type_paris_monastery_01: "Saint-Germain-des-Prés"
 building_type_paris_monastery_01_desc: "#F La Abadía de Saint-Germain-des-Prés está ubicada fuera de las murallas de la ciudad. Sin embargo, esto no ha disminuido su capacidad para ser el centro de la espiritualidad de París.#!"
 building_paris_monastery_01: "Plantar la Semilla"
 building_paris_monastery_01_desc: "Preguntar es dudar."
 building_paris_monastery_02: "Engañar a los Monjes"
 building_paris_monastery_02_desc: "La duda forma el camino hacia la condenación."
 building_paris_monastery_03: "Desviar la Fe"
 building_paris_monastery_03_desc: "Y la condenación es eterna."
 building_paris_monastery_04: "Deidad Oculta"
 building_paris_monastery_04_desc: "Los susurros de una fe diferente han echado raíces, los mortales ahora rezan a un poder cuya verdadera identidad desconocen. La devoción ciega es realmente aterradora."
 POD_paris_monastery_bonus: "Aumenta el [hunger_with_icon|E] saciado de los mortales"
 
 
 #############################
 ####### París Umbría ########
 #############################
 
 building_type_paris_umbral_01: "París Umbría"
 building_type_paris_umbral_01_desc: "#F Sombras se ciernen sobre la orgullosa París.#!"
 building_paris_umbral_01: "París Desafiante"
 building_paris_umbral_01_desc: "La ciudad resiste a las criaturas de la noche."
 building_paris_umbral_02: "París Caída"
 building_paris_umbral_02_desc: "Una oscuridad inquietante se extiende por toda la ciudad."
 building_paris_umbral_03: "París Umbría"
 building_paris_umbral_03_desc: "Envuelta en sombras, la ciudad ahora sirve a su oscuro amo."
 
 building_type_paris_umbral_cite_01: "Île de la Cité"
 building_type_paris_umbral_cite_01_desc: "#F La nobleza aquí es como cualquier otra. Ferozmente protectora de su poder, tierras y títulos.\n\nSin embargo, el verdadero poder está más allá de su mezquino alcance.#!"
 building_paris_umbral_cite_01: "Île de la Cité Influenciada"
 building_paris_umbral_cite_01_desc: "La nobleza aquí es como cualquier otra. Ferozmente protectora de su poder, tierras y títulos.\n\nSin embargo, el verdadero poder está más allá de su mezquino alcance."
 building_paris_umbral_cite_02: "Île de la Cité Controlada"
 building_paris_umbral_cite_02_desc: "$building_paris_umbral_cite_01_desc$"
 building_paris_umbral_cite_03: "Île de la Cité Hipnotizada"
 building_paris_umbral_cite_03_desc: "$building_paris_umbral_cite_01_desc$"
 building_paris_umbral_cite_04: "Île de la Cité Contaminada"
 building_paris_umbral_cite_04_desc: "$building_paris_umbral_cite_01_desc$"
 
 building_type_paris_umbral_chatelet_01: "Le Châtelet"
 building_type_paris_umbral_chatelet_01_desc: "#F Los soldados de París están listos para defender la ciudad de aquellos que quieran dañarla.\n\nPero el lobo ya está entre las ovejas.#!"
 building_paris_umbral_chatelet_01: "Le Châtelet Influenciado"
 building_paris_umbral_chatelet_01_desc: "Los soldados de París están listos para defender la ciudad de aquellos que quieran dañarla.\n\nPero el lobo ya está entre las ovejas."
 building_paris_umbral_chatelet_02: "Le Châtelet Controlado"
 building_paris_umbral_chatelet_02_desc: "$building_paris_umbral_chatelet_01_desc$"
 building_paris_umbral_chatelet_03: "Le Châtelet Hipnotizado"
 building_paris_umbral_chatelet_03_desc: "$building_paris_umbral_chatelet_01_desc$"
 building_paris_umbral_chatelet_04: "Le Châtelet Profanado"
 building_paris_umbral_chatelet_04_desc: "$building_paris_umbral_chatelet_01_desc$"
 
 building_type_paris_umbral_temple_01: "L'enclos du Temple"
 building_type_paris_umbral_temple_01_desc: "#F Los Caballeros Templarios y los Caballeros Hospitalarios, así como las Órdenes Dominica y Franciscana, tienen una presencia significativa en la ciudad. Aunque no forman parte de la Inquisición de las Sombras, siguen siendo mortales poderosos impulsados por la fe.\n\nFe que puede ser retorcida.#!"
 building_paris_umbral_temple_01: "L'enclos du Temple Influenciado"
