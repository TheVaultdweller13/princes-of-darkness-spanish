 building_type_constantinople_plundered_the_great_bazar_01: "El Gran Bazar"
 building_type_constantinople_plundered_the_great_bazar_01_desc: "Pese a toda la ruina y la destrucción que se pudren tras los muros de Constantinopla, nada ha logrado aún apagar la chispa del Gran Bazar, el centro comercial donde latinos y helenos, oriente y occidente, mortales y Cainitas se entremezclan en una gloriosa cacofonía urbana. Gracias a siglos de influencia vampírica, el Bazar nunca duerme.\nCon los latinos ahora al mando de la ciudad, el comercio continúa, pero a veces se parece más a la extorsión."
