 POD_rome_salubri_desc: "Érase una vez, esta región contenía grandes mansiones, resplandecientes en mármol. Después de siglos de despoblación, disturbios civiles y de que sus piedras fueran tomadas para nuevas torres, solo quedan sus esqueletos."
