 ##### Roma para Vampiros ####
 #############################
 
 building_type_rome_roma_aeterna_01: "Roma Eterna"
 building_type_rome_roma_aeterna_01_desc: "#F Roma era tanto el centro del mundo [Glossary('Cainite','game_concept_cainite_desc')] como lo era del humano. Restaurarla a la grandeza no-muerta sería un logro tremendo.#!"
 building_rome_roma_aeterna_01: "Roma Dividua"
 building_rome_roma_aeterna_01_desc: "Los Hombres Santos patrullan las calles, disputando cualquier intento de control directo sobre el centro del mundo europeo. En esta etapa, Roma es un título prestigioso para su propietario, pero también peligroso."
 building_rome_roma_aeterna_02: "Roma Invicta"
 building_rome_roma_aeterna_02_desc: "Lentamente, la fe de Roma es erosionada, y los Vampiros pueden usar nuevamente su sutil influencia para beneficio del príncipe."
 building_rome_roma_aeterna_03: "Roma Eterna"
 building_rome_roma_aeterna_03_desc: "Finalmente, Roma está de vuelta en manos vampíricas. Los Hombres Santos se acobardan en la oscuridad mientras los hijos de Caín cantan alabanzas al gran gobernante que ha conquistado la ciudad santa."
 
 POD_rome_ventrue_desc: "Esta es la sede del venerable Foro Romano, que sirvió como el corazón palpitante de la ciudad en tiempos antiguos. Su exterior arruinado esconde cámaras cómodas y hermosas."
 POD_rome_ventrue_bonus: "#P Ser propietario de este distrito desbloquea [sell_titles_decision|E] y lo hace más barato de usar.#!"
 building_type_rome_ventrue_01: "Montium et Biberatice"
