 building_type_constantinople_reform_seraglio_lighthouse_01: "Faro del Serrallo"
 building_type_constantinople_reform_seraglio_lighthouse_01_desc: "El Mar de Mármara se convierte en el Cuerno de Oro alrededor del faro del Serrallo, una luz en la oscuridad para los barcos que intentan llegar o salir de la ciudad.\nReconstruido cuando llegaron los nuevos amos de la ciudad, vuelve a servir como un faro de luz para los barcos viajeros deseosos de visitar la ciudad en recuperación."
