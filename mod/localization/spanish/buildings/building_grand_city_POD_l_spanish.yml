 building_type_constantinople_plundered_aqueduct_of_valens_01: "Acueducto de Valente"
 building_type_constantinople_plundered_aqueduct_of_valens_01_desc: "El Acueducto de Valente es un sistema de acueducto romano construido a finales del siglo IV d. C. para abastecer a Constantinopla. Su construcción comenzó durante el reinado del emperador romano Constancio II y fue completada en el 373 por el emperador Valente. El acueducto sigue en uso hoy en día, pues los bizantinos lo ampliaron y lo mantuvieron.\nCarentes de riqueza material, los latinos lo han ignorado en su mayor parte. Sin embargo, han empezado a usar sus sillares para \"embellecer\" los palacios de los funcionarios latinos."
 building_constantinople_plundered_aqueduct_of_valens_01: "Acueducto de Valente Conquistado"
