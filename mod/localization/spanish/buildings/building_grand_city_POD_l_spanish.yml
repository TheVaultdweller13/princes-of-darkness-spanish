 POD_demon_resolve_income_from_building: "#P +1#! de $POD_energy_resolve$ al año"
 building_type_baghdad_sinful_baghdad_01: "Babilonia, el infierno en la tierra"
 building_type_baghdad_sinful_baghdad_01_desc: "Los hechiceros mesopotámicos buscaban opulencia y poder mediante el favor del Inframundo. Antes de que el infierno existiera en la imaginación humana, Babilonia pugnó por convertirse en el infierno en la tierra."
 building_baghdad_sinful_baghdad_01: "Babilonia, memorias del pecado"
 building_baghdad_sinful_baghdad_01_desc: "En el siglo V a. C., Heródoto viajó por el mundo mediterráneo. De Babilonia dejó escrito un relato condenatorio y aterrador. Era, por supuesto, enormemente inexacto.\n\nLa verdad que se le escapó era mucho peor."
 building_baghdad_sinful_baghdad_02: "Babilonia, ciudad del pecado"
 building_baghdad_sinful_baghdad_02_desc: "Llegaron los siervos de la Entropía, esos seres que sirven al espíritu primordial de la destrucción; los demonios infernales, al parecer siervos de un infierno que existe en lo más hondo de la [umbra|E] o en alguna fractura del espacio; y las Cosas-Que-No-Deberían-Ser, los moradores de la oscuridad exterior, del Vacío, esas inexplicables criaturas farfullantes que anhelan entrar en este universo.\n\nLos tres compartieron Babilonia."
 building_baghdad_sinful_baghdad_03: "Babilonia, el infierno en la tierra"
 building_baghdad_sinful_baghdad_03_desc: "Fue una época gloriosa para perder el alma. Los seres del Vacío, y pronto también los Malfeanos y otros demonios, tuvieron las riendas de la ciudad. Turbaban el sueño de los niños y susurraban al oído de los reyes."
 building_type_baghdad_sinful_palace_of_etemenanki_01: "Palacio de Etemenanki"
 building_type_baghdad_sinful_palace_of_etemenanki_01_desc: "Cerca de la muralla occidental de la vieja Babilonia se alzaba un zigurat de siete niveles llamado «Etemenanki», que significa \"el cimiento del cielo y de la tierra\"."
 building_baghdad_sinful_palace_of_etemenanki_01: "Los Anunnaku"
 building_baghdad_sinful_palace_of_etemenanki_01_desc: "Antes de la Creación, estaban los Anunnaku. Los Puros experimentaron con la Quintaesencia que algún día se convertiría en la Teluria. Pero algunos de los viejos dioses quedaron atrapados en los nudos de los hilos del Tapiz. Esos dioses atrapados se convirtieron en el Vacío, y las estrellas fueron sus prisiones."
 building_baghdad_sinful_palace_of_etemenanki_02: "Poder del Vacío"
 building_baghdad_sinful_palace_of_etemenanki_02_desc: "Pero ya desde los primeros tiempos la humanidad conoció los nombres de los dioses sin nombre. De noche, los hombres susurraban al cielo mientras miraban las estrellas y suplicaban poder. Sus plegarias fueron escuchadas."
 building_baghdad_sinful_palace_of_etemenanki_03: "Asciende la Sociedad de Etemenanki"
 building_baghdad_sinful_palace_of_etemenanki_03_desc: "En tiempos de Nabucodonosor, casi la mitad de los funcionarios y sacerdotes de Babilonia se había unido a la sociedad oscura. Influyentes seguidores del Vacío se aseguraron de que el En de Marduk, cuando no formaba parte él mismo de la conspiración, hiciera la vista gorda ante los rituales nocturnos que se celebraban en el templo de Marduk, en lo alto de Etemenanki."
 building_baghdad_sinful_palace_of_etemenanki_04: "Los Sacerdotes Impíos"
 building_baghdad_sinful_palace_of_etemenanki_04_desc: "Los conspiradores elegían a un sacerdote de entre sus filas, al que llamaban el Bel en burla de Marduk. El proceso de selección cambió a lo largo de los siglos, pero en tiempos de Nabucodonosor consistía en una competición para invocar al demonio más poderoso."
 building_baghdad_sinful_palace_of_etemenanki_05: "Etemenanki: el primer Laberinto"
 building_baghdad_sinful_palace_of_etemenanki_05_desc: "Etemenanki, guiada por un Bel u otro, se convirtió en el primer «Laberinto» incluso antes de que se usara la palabra. Desde aquel elevado mirador sobre la ciudad, los astrólogos estudiaban los signos y cumplían los deseos de sus amos."
 building_type_baghdad_sinful_hanging_gardens_01: "Los Jardines Colgantes"
 building_type_baghdad_sinful_hanging_gardens_01_desc: "La pieza más famosa de la antigua Babilonia, a la espera de ser desenterrada y reclamada por un conquistador digno que sepa apreciar su belleza sobrenatural."
 building_baghdad_sinful_hanging_gardens_01: "Jardines corrientes"
 building_baghdad_sinful_hanging_gardens_01_desc: "La Maravilla de la Humanidad sigue en un estado lamentable. Sin embargo, ya han comenzado la recuperación y las obras, y quizá algún día recobre su antigua gloria."
 building_baghdad_sinful_hanging_gardens_02: "Grandes jardines"
 building_baghdad_sinful_hanging_gardens_02_desc: "$building_baghdad_sinful_hanging_gardens_01_desc$"
 building_baghdad_sinful_hanging_gardens_03: "Jardines colgantes"
 building_baghdad_sinful_hanging_gardens_03_desc: "Estos grandes jardines aún no son los de la antigua Babilonia, pero su enorme variedad y opulencia hacen que cualquiera se lo piense dos veces antes de llamarte mentiroso."
 building_baghdad_sinful_hanging_gardens_04: "Los Jardines Colgantes"
 building_baghdad_sinful_hanging_gardens_04_desc: "¡Por fin! ¡Hasta los demonios que vivieron en los gloriosos días de antaño reconocerían tu prestigio y tu poder por haber reconstruido la maravilla de Nabucodonosor II!"
 building_baghdad_sinful_hanging_gardens_05: "Jardines voladores"
 building_baghdad_sinful_hanging_gardens_05_desc: "¿Jardines Colgantes? Qué vulgar: ¡los tuyos vuelan! Que todo el que llegue a tu ciudad los visite y se maraville de tu poder. Al fin y al cabo, es el primer paso hacia la adoración."
 building_type_baghdad_sinful_gate_of_ishtar_01: "Puerta de Ishtar"
 building_type_baghdad_sinful_gate_of_ishtar_01_desc: "El nombre «Babilonia» significa «la puerta de Dios», pero lo que cruzaba sus puertas era todo menos santo."
 building_baghdad_sinful_gate_of_ishtar_01: "Encrucijada de lo Infernal"
 building_baghdad_sinful_gate_of_ishtar_01_desc: "Aunque el misterioso Oriente y los bosques encantados de la Europa pagana conocían a los demonios desde la prehistoria, la ciudad de Babilonia fue una encrucijada de entidades Infernales."
 building_baghdad_sinful_gate_of_ishtar_02: "Puerta a la Entropía"
 building_baghdad_sinful_gate_of_ishtar_02_desc: "Siervos de la Entropía, criaturas ligadas a las estrellas procedentes del Vacío exterior y moradores del Foso anidaron entre los muros de la primera gran ciudad."
 building_baghdad_sinful_gate_of_ishtar_03: "Cuna de la Invocación"
 building_baghdad_sinful_gate_of_ishtar_03_desc: "Aunque tratar con demonios y vincular espíritus impuros es hoy práctica corriente entre los Nefandi y otros vendealmas, Babilonia fue la cuna de las artes de invocación."
 building_baghdad_sinful_gate_of_ishtar_04: "Una ciudad de malicia y profanación"
 building_baghdad_sinful_gate_of_ishtar_04_desc: "Babilonia bullía de demonios. Desde los tiempos de Hammurabi hasta la decadencia de la ciudad bajo los Seléucidas, la conspiración de Etemenanki invitó a la malicia y la profanación a entrar entre sus muros."
 building_baghdad_sinful_gate_of_ishtar_05: "Puerta Demoníaca de Ishtar"
 building_baghdad_sinful_gate_of_ishtar_05_desc: "Al final, una ciudad se define por sus demonios."
 building_type_baghdad_sinful_tower_of_babel_01: "Torre de Babel"
 building_type_baghdad_sinful_tower_of_babel_01_desc: "Vamos, edifiquémonos una ciudad y una torre cuya cúspide llegue al cielo; y hagámonos un nombre, por si fuésemos esparcidos sobre la faz de toda la tierra."
 building_baghdad_sinful_tower_of_babel_01: "Desenterrando la Torre"
 building_baghdad_sinful_tower_of_babel_01_desc: "Era entonces toda la tierra de una sola lengua y de unas mismas palabras. Y aconteció que, cuando partieron de oriente, hallaron una llanura en la tierra de Sinar, y se establecieron allí." # Genesis 11:1-2 KJV
 building_baghdad_sinful_tower_of_babel_02: "Ruinas de la Torre"
 building_baghdad_sinful_tower_of_babel_02_desc: "Y se dijeron unos a otros: Vamos, hagamos ladrillo y cozámoslo con fuego. Y les sirvió el ladrillo en lugar de piedra, y el betún en lugar de mezcla." # Genesis 11:3 KJV
 building_baghdad_sinful_tower_of_babel_03: "Reparando la Torre"
 building_baghdad_sinful_tower_of_babel_03_desc: "Y dijeron: Vamos, edifiquémonos una ciudad y una torre cuya cúspide llegue al cielo; y hagámonos un nombre, por si fuésemos esparcidos sobre la faz de toda la tierra." # Genesis 11:4 KJV
 building_baghdad_sinful_tower_of_babel_04: "Torre reconstruida"
 building_baghdad_sinful_tower_of_babel_04_desc: "Y descendió el SEÑOR para ver la ciudad y la torre que edificaban los hijos de los hombres. Y dijo el SEÑOR: He aquí el pueblo es uno, y todos éstos tienen un solo lenguaje; y han comenzado la obra, y nada les hará desistir ahora de lo que han pensado hacer." # Genesis 11:5-6 KJV
 building_baghdad_sinful_tower_of_babel_05: "Torre de Babel: afrenta a Dios"
 building_baghdad_sinful_tower_of_babel_05_desc: "Por eso fue llamado el nombre de ella Babel, porque allí confundió el SEÑOR el lenguaje de toda la tierra, y desde allí los esparció el SEÑOR sobre la faz de toda la tierra." # Genesis 11:9 KJV
 building_type_baghdad_sinful_tomb_of_nergal_01: "Tumba maldita"
 building_type_baghdad_sinful_tomb_of_nergal_01_desc: "Un templo excavado hace poco se ha convertido en escenario de sucesos extraños. Algunos dicen que es una tumba maldita por una deidad olvidada. Pocos se atreven a acercarse si no los obligan."
 building_baghdad_sinful_tomb_of_nergal_01: "Abriendo la Tumba"
 building_baghdad_sinful_tomb_of_nergal_01_desc: "La realidad titila y se deshilacha a medida que te adentras en la tumba; solo algo de un poder verdaderamente inmenso pudo causar esto. Y un ser de tal poder nunca está tan muerto como parece..."
 building_baghdad_sinful_tomb_of_nergal_02: "Despejando los escombros"
 building_baghdad_sinful_tomb_of_nergal_02_desc: "$building_baghdad_sinful_tomb_of_nergal_01_desc$"
 building_baghdad_sinful_tomb_of_nergal_03: "Identificando a la criatura"
 building_baghdad_sinful_tomb_of_nergal_03_desc: "Has hallado el sarcófago y las inscripciones que lleva grabadas; no cabe duda de lo que has encontrado... de a quién has encontrado."
 building_baghdad_sinful_tomb_of_nergal_04: "Abriendo el sarcófago"
 building_baghdad_sinful_tomb_of_nergal_04_desc: "$building_baghdad_sinful_tomb_of_nergal_03_desc$"
 building_baghdad_sinful_tomb_of_nergal_05: "Tumba abierta"
 building_baghdad_sinful_tomb_of_nergal_05_desc: "El sarcófago está vacío, pues su ocupante lo abandonó hace tiempo, pero nadie necesita saberlo: su miedo es un arma poderosa con la que forzar su obediencia."
 building_type_baghdad_sinful_temples_of_the_gods_01: "Templos de los Reyes Diablo"
 building_type_baghdad_sinful_temples_of_the_gods_01_desc: "Babilonia cayó por primera vez cuando Marduk triunfó sobre la ciudad infernal. Pero el hundimiento de las civilizaciones griega y romana dio paso a una nueva era: la Era de los Reyes Diablo."
 building_baghdad_sinful_temples_of_the_gods_01: "Templos olvidados"
 building_baghdad_sinful_temples_of_the_gods_01_desc: "De nuevo se alzaron los templos. De nuevo, manos demoníacas izaron piedras negras hasta su lugar y legiones de víctimas gritaron bajo el cuchillo de desollar."
 building_baghdad_sinful_temples_of_the_gods_02: "Reanudando las ceremonias"
 building_baghdad_sinful_temples_of_the_gods_02_desc: "$building_baghdad_sinful_temples_of_the_gods_01_desc$"
 building_baghdad_sinful_temples_of_the_gods_03: "Templos reconstruidos"
 building_baghdad_sinful_temples_of_the_gods_03_desc: "Una sucesión de poderosos sacerdotes brujos restauró la gloria de Babilonia y Ur, y levantó ciudades pequeñas pero decadentes."
 building_baghdad_sinful_temples_of_the_gods_04: "Reafirmando el dominio"
 building_baghdad_sinful_temples_of_the_gods_04_desc: "Durante casi 600 años, los Guardianes de la Puerta y sus aliados disfrutaron de los frutos del dominio místico."
 building_baghdad_sinful_temples_of_the_gods_05: "Reliquias de los Reyes Diablo"
 building_baghdad_sinful_temples_of_the_gods_05_desc: "Cuando los ejércitos del islam pusieron por fin fin a su regreso, los Reyes Diablo habían excavado elaborados templos, bibliotecas y catacumbas bajo sus ciudades. Ni siquiera los ejércitos victoriosos pudieron descubrirlos todos."
 building_type_baghdad_sinful_desecrated_second_temple_01: "Vestigios de Bhat"
 building_type_baghdad_sinful_desecrated_second_temple_01_desc: "La ciudad poseída por demonios proyectó una terrible sombra sobre la antigua Babilonia. Su derrota final dejó numerosas reliquias infernales que hoy podrían resultar útiles."
 building_baghdad_sinful_desecrated_second_temple_01: "Vestigios de la Ciudad Viviente"
 building_baghdad_sinful_desecrated_second_temple_01_desc: "Los pocos relatos que sobreviven de la ciudad cuentan que los siervos demoníacos de Nergal y Ereskigal la alzaron en una sola noche. Tras una enorme muralla de mármol negro, plantas espinosas y madera retorcida se moldearon hasta formar una extraña ciudad viva."
 building_baghdad_sinful_desecrated_second_temple_02: "Vestigios de Sangre"
 building_baghdad_sinful_desecrated_second_temple_02_desc: "De día, los habitantes dormían o recogían frutos de dulce aroma de los árboles, regados con sangre humana; de noche, los ciudadanos celebraban feroces orgías o lanzaban incursiones contra las ciudades-estado vecinas."
 building_baghdad_sinful_desecrated_second_temple_03: "Vestigios de la Derrota de Babilonia"
 building_baghdad_sinful_desecrated_second_temple_03_desc: "Auxiliados por servidores demoníacos y aterradoras máquinas de guerra (hechas de la misma madera con la que se formó la propia ciudad), los bhatoritas derribaron en varias ocasiones las murallas de la misma Babilonia y se llevaron prisioneros para sacrificarlos."
 building_baghdad_sinful_desecrated_second_temple_04: "Vestigios de la Victoria del rey Samsi-Adad"
 building_baghdad_sinful_desecrated_second_temple_04_desc: "Por fin, los vecinos contraatacaron; tras una costosa campaña, el rey Samsi-Adad de Assur dirigió una masiva fuerza confederada contra los bhatoritas. Como era costumbre en aquella época, todos los hombres, mujeres y niños de Bhat fueron pasados a cuchillo."
 building_baghdad_sinful_desecrated_second_temple_05: "Vestigios del Botín de Guerra"
 building_baghdad_sinful_desecrated_second_temple_05_desc: "Se dice que muchos grimorios de la era babilónica se escribieron en rollos de piel de bhatorita; al parecer, hechiceros de todo el reino pagaron fortunas por obtener esos trofeos, que se cree que conservan propiedades místicas más de 3000 años después de la caída de la ciudad."
 building_type_baghdad_sinful_prideful_statue: "Jezabel de Babilonia"
 building_type_baghdad_sinful_prideful_statue_desc: "Esta estatua honra a esta hija de Eva (o, peor aún, de Lilith) que olvidó la castidad cristiana por pasiones más terrenales. Como la Ramera de Babilonia, viste ricas galas y a menudo procura que se atormente y se mate a gente inocente."
 building_baghdad_sinful_prideful_statue: "Jezabel de Babilonia"
 building_baghdad_sinful_prideful_statue_desc: "$building_type_baghdad_sinful_prideful_statue_desc$"
 building_type_baghdad_sinful_enforced_rest_times: "Una ciudad construida sobre lágrimas"
 building_type_baghdad_sinful_enforced_rest_times_desc: "Mientras los esclavos mueren y son sustituidos por otros nuevos, los demonios se alimentan de la insensibilidad y la indolencia de la clase gobernante que ellos mismos fomentaron."
 building_baghdad_sinful_enforced_rest_times: "Una ciudad construida sobre lágrimas"
 building_baghdad_sinful_enforced_rest_times_desc: "$building_type_baghdad_sinful_enforced_rest_times_desc$"
 building_type_baghdad_sinful_pleasure_houses: "Matrimonios sagrados"
 building_type_baghdad_sinful_pleasure_houses_desc: "Los sacerdotes de la conspiración infernal usaban un ritual llamado «Matrimonio Sagrado» para activar su Puerta. Debilitaban la Celosía para pervertir el templo de Marduk de su propósito sagrado. Las estatuas, que solían mirar con asombro a los dioses, cerraban los ojos. En el centro de la cella se revelaba un altar con patas talladas como las de un animal."
 building_baghdad_sinful_pleasure_houses: "Matrimonios sagrados"
 building_baghdad_sinful_pleasure_houses_desc: "Los conspiradores subían a sus esposas, hijas y esclavas por las escaleras del zigurat. La «Inanna» aguardaba la atención del Bel. La intensidad de horas de cánticos y cópula —el Bel de pie, Inanna sobre el altar— daba al Vacío la fuerza para manifestarse en Babilonia."
 building_type_baghdad_sinful_feast_halls: "Mershakushtu Qurdu"
 building_type_baghdad_sinful_feast_halls_desc: "El ritual del \"Marduk Victorioso\" se celebraba al comienzo de cada año; los sacerdotes del templo proclamaban un período de renovación, con cantos de banquete, camaradería y otras festividades..."
 building_baghdad_sinful_feast_halls: "Mershakushtu Qurdu"
 building_baghdad_sinful_feast_halls_desc: "$building_type_baghdad_sinful_feast_halls_desc$"
 building_type_baghdad_sinful_spy_passages: "Llorando a Tammuz"
 building_type_baghdad_sinful_spy_passages_desc: "Cada año, al comienzo de la temporada de siembra, las ciudades sumerias representaban el regreso de Tammuz al Inframundo. Cada ciudad tomaba a su joven más querido y lo enterraba vivo. Toda la población vestía de negro durante ocho días, y los sacerdotes y sacerdotisas de Istar, durante un mes, en duelo por la muerte simbólica del dios."
 building_baghdad_sinful_spy_passages: "Llorando a Tammuz"
 building_baghdad_sinful_spy_passages_desc: "$building_type_baghdad_sinful_spy_passages_desc$"
 building_type_baghdad_sinful_gold_hoard: "Oro y azufre"
 building_type_baghdad_sinful_gold_hoard_desc: "Babilonia era una ciudad condenada. Pero, pese a todo, una ciudad condenada y rica. De los tratos con los demonios salieron muchas almas perdidas, pero también unos pocos ganadores poderosos."
 building_baghdad_sinful_gold_hoard: "Oro y azufre"
 building_baghdad_sinful_gold_hoard_desc: "$building_type_baghdad_sinful_gold_hoard_desc$"
 building_type_baghdad_sinful_fighting_pits: "Fosos del Anzu"
 building_type_baghdad_sinful_fighting_pits_desc: "Ave gigantesca con cabeza de león, el Anzu aparece en uno de los relatos de Gilgamesh. Anidaba en el árbol huluppa y, al parecer, convivía con una gran serpiente y con la propia Lilith."
 building_baghdad_sinful_fighting_pits: "Fosos del Anzu"
 building_baghdad_sinful_fighting_pits_desc: "$building_type_baghdad_sinful_fighting_pits_desc$"
 building_type_baghdad_jewel_of_allah_baghdad_01: "Bagdad: ciudad de las mil mezquitas"
 building_type_baghdad_jewel_of_allah_baghdad_01_desc: "La joya de la Edad de Oro del islam ha perdido su brillo, pero su fama perdura. Mucho puede reconstruirse y restaurarse."
 building_baghdad_jewel_of_allah_baghdad_01: "Bagdad: ciudad de una sola mezquita"
 building_baghdad_jewel_of_allah_baghdad_01_desc: "Esta ya no es la joya del islam que fue en tiempos de los abasíes, pero quizá, con voluntad y esfuerzo, pueda volver a serlo."
 building_baghdad_jewel_of_allah_baghdad_02: "Bagdad: ciudad de una docena de mezquitas"
 building_baghdad_jewel_of_allah_baghdad_02_desc: "El camino de la recuperación es largo, pero ya se ha recorrido gran parte; solo faltan un par de pasos para un regreso triunfal al primer plano."
 building_baghdad_jewel_of_allah_baghdad_03: "Bagdad: ciudad de las mil mezquitas"
 building_baghdad_jewel_of_allah_baghdad_03_desc: "La joya del islam, igual en importancia incluso a La Meca y Medina, ¡que nunca se empañe!"
 building_type_baghdad_jewel_of_allah_palace_of_the_abbasids_01: "Palacio de los Abasíes"
 building_type_baghdad_jewel_of_allah_palace_of_the_abbasids_01_desc: "El palacio de los abasíes, desde donde gobernaron de Córdoba a China; su recuerdo es motivo de orgullo y puede aprovecharse para mayor gloria de Bagdad."
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_01: "Tomando el Palacio"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_01_desc: "Una sucesión de gobernantes incompetentes y conquistadores indiferentes ha dejado el palacio en el desorden. Es hora de poner orden en esta situación."
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_02: "Eliminando a los pretendientes"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_02_desc: "$building_baghdad_jewel_of_allah_palace_of_the_abbasids_01_desc$"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_03: "Controlando a la Guardia"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_03_desc: "Has dado a conocer tu presencia. Tu influencia vendrá después."
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_04: "Controlando a los nobles"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_04_desc: "Los poderosos necesitan buen consejo. Tú eres el único que puede dárselo."
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_05: "Influyendo en el califa"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_05_desc: "Allí los asuntos espirituales y temporales están entrelazados. Aunque la fe que se exhibe puede ser un obstáculo, tu influencia crece de todos modos."
 building_type_baghdad_jewel_of_allah_house_of_wisdom_01: "La Casa de la Sabiduría"
 building_type_baghdad_jewel_of_allah_house_of_wisdom_01_desc: "La Casa de la Sabiduría, también conocida como la Gran Biblioteca de Bagdad, fue una importante academia pública y centro intelectual de la era abasí en Bagdad. Fue una de las mayores bibliotecas públicas del mundo durante la Edad de Oro del islam."
 building_baghdad_jewel_of_allah_house_of_wisdom_01: "Masas ignorantes"
 building_baghdad_jewel_of_allah_house_of_wisdom_01_desc: "Tu poder significa poco para estos eruditos, demasiado interesados en sus libros para prestar atención al resto del mundo. Tendrás que enseñarles a escucharte."
 building_baghdad_jewel_of_allah_house_of_wisdom_02: "Maestros ignorantes"
 building_baghdad_jewel_of_allah_house_of_wisdom_02_desc: "$building_baghdad_jewel_of_allah_house_of_wisdom_01_desc$"
 building_baghdad_jewel_of_allah_house_of_wisdom_03: "Investigación controlada"
 building_baghdad_jewel_of_allah_house_of_wisdom_03_desc: "Las subvenciones y los consejos susurrados a los oídos adecuados te han convertido en el actor más importante de la política interna de la Casa de la Sabiduría, aunque no el único."
 building_baghdad_jewel_of_allah_house_of_wisdom_04: "Sabiduría controlada"
 building_baghdad_jewel_of_allah_house_of_wisdom_04_desc: "$building_baghdad_jewel_of_allah_house_of_wisdom_03_desc$"
 building_baghdad_jewel_of_allah_house_of_wisdom_05: "Tu Casa de la Sabiduría"
 building_baghdad_jewel_of_allah_house_of_wisdom_05_desc: "Allí pueden aprenderse cosas fascinantes, y son muchos los que esperan que el misterioso señor de la Casa les conceda acceso."
 building_type_baghdad_jewel_of_allah_abou_hanifaa_mosque_01: "Mezquita de Allah Abou Hanifaa"
 building_type_baghdad_jewel_of_allah_abou_hanifaa_mosque_01_desc: "La mayor mezquita de la ciudad es un centro de saber, de piedad y, más importante aún, de influencia."
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_01: "Imán obstinado"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_01_desc: "La mayor mezquita de la ciudad no cederá solo porque lo pidas con buenas maneras. La fe es un obstáculo, pero se puede superar."
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_02: "Rebaño sordo"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_02_desc: "$building_baghdad_jewel_of_allah_abou_hanifaa_mosque_01_desc$"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_03: "Hadiz atento"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_03_desc: "Siguen tus palabras, escuchan tu voz, obedecen tus órdenes; solo que todavía no lo saben."
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_04: "Eruditos controlados"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_04_desc: "$building_baghdad_jewel_of_allah_abou_hanifaa_mosque_03_desc$"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_05: "Influyendo en los visitantes"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_05_desc: "Todo el que pasa por aquí acaba formando parte de tus planes. Lo sepa o no."
 building_type_baghdad_jewel_of_allah_al_mustansiriyah_university_01: "Universidad Al Mustansiriyah"
 building_type_baghdad_jewel_of_allah_al_mustansiriyah_university_01_desc: "La primera universidad del islam, fundada por el califa abasí Al-Mustansir."
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_01: "Solicitando el ingreso"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_01_desc: "Resulta que no dejan entrar a cualquiera. Tendrás que aumentar tu influencia aquí... o superar una prueba."
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_02: "Segundo intento"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_02_desc: "$building_baghdad_jewel_of_allah_al_mustansiriyah_university_01_desc$"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_03: "Por fin dentro"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_03_desc: "No pudieron detenerte tres veces, ¡y ahora todo el saber de esta universidad está a tu disposición! En cuanto encuentres tiempo para leerlo."
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_04: "Aprendiendo a aprender"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_04_desc: "Aquí no hay grandes secretos que descubrir, pero la sabiduría colectiva de la mayor ciudad del islam sigue siendo un tesoro digno de atesorarse."
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_05: "Un Camino sin fin"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_05_desc: "No se trata de saber, sino de aprender y disfrutar del proceso. Este no es un lugar para quienes levantan torres, sino para quienes gozan añadiendo ladrillos a la suya, reconocen que siempre habrá más que aprender y se alegran de ello."
 building_type_baghdad_jewel_of_allah_madrasa_mirjaniyya_01: "Complejo de la Madrasa Mirjaniyya y el Khan Mirjan"
 building_type_baghdad_jewel_of_allah_madrasa_mirjaniyya_01_desc: "Un centro de estudios y una posada combinados con tal ingenio que ninguno puede absorber al otro."
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_01: "Controlando a los eruditos"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_01_desc: "Tomar el control será difícil: tendrás que actuar en ambos lados a la vez para que ninguno pueda intervenir."
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_02: "Controlando a los mercaderes"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_02_desc: "$building_baghdad_jewel_of_allah_madrasa_mirjaniyya_01_desc$"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_03: "Desplumando a los viajeros"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_03_desc: "No tienes el control total. Todavía. Pero tienes el suficiente para subir los precios y asegurarte de que los estudiantes no tropiecen con cosas que más les vale ignorar."
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_04: "Mintiendo a los estudiantes"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_04_desc: "$building_baghdad_jewel_of_allah_madrasa_mirjaniyya_03_desc$"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_05: "Extorsionando por igual riqueza y conocimiento"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_05_desc: "Ninguna de las dos partes pudo someter a la otra, pero eso las dejó débiles ante una intervención externa, y ahora tienes en tus manos tanto la riqueza como el conocimiento."
 building_type_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01: "Mausoleo de Zumurrud Kathun"
 building_type_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01_desc: "Un mausoleo dedicado a la esposa del califa al-Mustadi, la señal más segura de un amor que resuena a través de los siglos."
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01: "Mausoleo corriente"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01_desc: "Un mausoleo entre muchos de esta ciudad, singular solo por su grandeza, testimonio de que todo muere. Pero tus sentidos te dicen que quizá sea algo más complicado..."
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_02: "Mausoleo célebre"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_02_desc: "$building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01_desc$"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_03: "Mausoleo intrigante"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_03_desc: "Los espíritus de los difuntos se agolpan en torno a este mausoleo, todos llorando; el aire aquí es tenue y la frontera entre mundos se quiebra con facilidad."
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_04: "Contactando con los wraiths"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_04_desc: "$building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_03_desc$"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_05: "Pasaje al Inframundo"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_05_desc: "Has hecho lo que hizo Orfeo y has entrado en el inframundo con el poder del amor verdadero. Que no fuera el tuyo es irrelevante."
 building_type_baghdad_jewel_of_allah_al_adudi_bimaristan_01: "Hospital Al-'Adudi"
 building_type_baghdad_jewel_of_allah_al_adudi_bimaristan_01_desc: "El hospital nació cuando el rey de la dinastía buyí, 'Adud al-Dawla, decidió construirlo unos años antes de morir. Al-'Adudi se considera uno de los hospitales más innovadores y modernos del mundo islámico."
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_01: "Corrompiendo a los médicos"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_01_desc: "Tienes conocimientos y remedios que ellos desean, y se los darás, por un precio."
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_02: "Aprendiendo sus métodos"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_02_desc: "$building_baghdad_jewel_of_allah_al_adudi_bimaristan_01_desc$"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_03: "Trayendo pacientes extraños"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_03_desc: "Con los médicos de tu parte, puedes empezar a examinar a las criaturas más... esotéricas de esta tierra."
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_04: "Descubrimientos fascinantes"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_04_desc: "$building_baghdad_jewel_of_allah_al_adudi_bimaristan_03_desc$"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_05: "Un hospital Ensombrecido"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_05_desc: "Curas a quienes quieres que vivan y aprendes de quienes no, un sistema perfecto."
 building_type_baghdad_jewel_of_allah_taj_palace_01: "Palacio de Taj"
 building_type_baghdad_jewel_of_allah_taj_palace_01_desc: "Situado a orillas del río Tigris, en el sur del este de Bagdad, justo al sur del más antiguo Palacio Hasani, era por tanto la porción más meridional de un vasto complejo palaciego, la \"Morada del Califato\"."
 building_baghdad_jewel_of_allah_taj_palace_01: "Infiltrándose en el Palacio"
 building_baghdad_jewel_of_allah_taj_palace_01_desc: "El palacio sigue albergando a muchos guardias y nobles que han engordado en ausencia de cualquier urgencia. Una oportunidad perfecta."
 building_baghdad_jewel_of_allah_taj_palace_02: "Controlando a la Guardia"
 building_baghdad_jewel_of_allah_taj_palace_02_desc: "$building_baghdad_jewel_of_allah_taj_palace_01_desc$"
 building_baghdad_jewel_of_allah_taj_palace_03: "Añadiendo nuevas guarniciones"
 building_baghdad_jewel_of_allah_taj_palace_03_desc: "Con el pueblo bajo control, es el momento de asegurarte de que nada se mueva en tu ciudad sin que lo sepas."
 building_baghdad_jewel_of_allah_taj_palace_04: "Más patrullas"
 building_baghdad_jewel_of_allah_taj_palace_04_desc: "$building_baghdad_jewel_of_allah_taj_palace_03_desc$"
 building_baghdad_jewel_of_allah_taj_palace_05: "Vigilando la ciudad"
 building_baghdad_jewel_of_allah_taj_palace_05_desc: "Lo ves todo desde aquí: cada crimen, cada susurro, cada intento de golpe. No sucede nada en esta ciudad sin tu consentimiento, y todos lo saben."
 building_type_baghdad_looted_baghdad_01: "Bagdad saqueada"
 building_type_baghdad_looted_baghdad_01_desc: "Hulagu Kan pasó esta ciudad a cuchillo y todavía agoniza con una muerte lenta y dolorosa."
 building_baghdad_looted_baghdad_01: "Bagdad en ruinas"
 building_baghdad_looted_baghdad_01_desc: "Te haré caer desde la cumbre del cielo,\nComo a un león te arrojaré a las profundidades más bajas.\nNo dejaré con vida a una sola persona en tu país,\nConvertiré en llamas tu ciudad, tus tierras y tu imperio. Si tienes el valor de salvar tu cabeza y tu antigua familia,\nEscucha con atención mi consejo.\nSi te niegas a aceptarlo, te mostraré lo que significa la voluntad de Dios."
 building_baghdad_looted_baghdad_02: "Bagdad reconstruida"
 building_baghdad_looted_baghdad_02_desc: "Bagdad pudo arder, pero no será destruida. Con gran esfuerzo pueden repararse las cicatrices y recuperar su lugar en el mundo."
 POD_baghdad_rebuild_tooltip: "Bagdad será #P reconstruida#! y habrá nuevos [buildings|E] disponibles" 
 building_type_baghdad_starving_population_01: "Población hambrienta"
 building_type_baghdad_starving_population_01_desc: "Sin comida y sin ningún almacén en pie, no hay nada que comer. Tendrás que gastar de tus propias arcas para evitar que el pueblo muera de hambre o se marche."
 building_baghdad_starving_population_01: "Hambruna generalizada"
 building_baghdad_starving_population_01_desc: "$building_type_baghdad_starving_population_01_desc$"
 building_baghdad_starving_population_02: "Hambruna persistente"
 building_baghdad_starving_population_02_desc: "$building_type_baghdad_starving_population_01_desc$"
 building_baghdad_starving_population_03: "Hambruna menguante"
 building_baghdad_starving_population_03_desc: "$building_type_baghdad_starving_population_01_desc$"
 building_type_baghdad_destroyed_infrastructure_01: "Ciudad en llamas"
 building_type_baghdad_destroyed_infrastructure_01_desc: "Se ignora cuántos habitantes murieron: los escritores musulmanes estiman entre 800 000 y dos millones de muertos, mientras que el propio Hulagu, en una carta a Luis IX de Francia, señaló que su ejército había matado a 200 000."
 building_baghdad_destroyed_infrastructure_01: "Pesadilla interminable"
 building_baghdad_destroyed_infrastructure_01_desc: "$building_type_baghdad_destroyed_infrastructure_01_desc$"
 building_baghdad_destroyed_infrastructure_02: "Caos generalizado"
 building_baghdad_destroyed_infrastructure_02_desc: "$building_type_baghdad_destroyed_infrastructure_01_desc$"
 building_baghdad_destroyed_infrastructure_03: "Luz al final"
 building_baghdad_destroyed_infrastructure_03_desc: "$building_type_baghdad_destroyed_infrastructure_01_desc$"
 building_type_baghdad_rivers_of_ink_01: "Ríos de tinta"
 building_type_baghdad_rivers_of_ink_01_desc: "Se arrojaron al Tigris tantos libros de las bibliotecas de Bagdad que \"el color del río se volvió negro por su multitud\"."
 building_baghdad_rivers_of_ink_01: "Ríos ennegrecidos"
 building_baghdad_rivers_of_ink_01_desc: "$building_type_baghdad_rivers_of_ink_01_desc$"
 building_baghdad_rivers_of_ink_02: "Ríos de tinta desbordados"
 building_baghdad_rivers_of_ink_02_desc: "$building_type_baghdad_rivers_of_ink_01_desc$"
 building_baghdad_rivers_of_ink_03: "Ríos manchados"
 building_baghdad_rivers_of_ink_03_desc: "$building_type_baghdad_rivers_of_ink_01_desc$"
 building_type_baghdad_desecrated_mosques_01: "Ciudad de las mil mezquitas en llamas"
 building_type_baghdad_desecrated_mosques_01_desc: "Ya no se oyen las voces que anunciaban la hora de la oración; ahora solo dan fe del dolor y el horror que engullen Bagdad."
 building_baghdad_desecrated_mosques_01: "Ciudad de las mil mezquitas en llamas"
 building_baghdad_desecrated_mosques_01_desc: "$building_type_baghdad_desecrated_mosques_01_desc$"
 building_baghdad_desecrated_mosques_02: "Ciudad de las mil mezquitas derrumbándose"
 building_baghdad_desecrated_mosques_02_desc: "$building_type_baghdad_desecrated_mosques_01_desc$"
 building_baghdad_desecrated_mosques_03: "Ciudad de las mil mezquitas cicatrizadas"
 building_baghdad_desecrated_mosques_03_desc: "$building_type_baghdad_desecrated_mosques_01_desc$"
 building_type_baghdad_ruined_palaces_01: "Palacios en ruinas"
 building_type_baghdad_ruined_palaces_01_desc: "Hulagu encerró al califa en una celda rodeada de sus tesoros, donde murió de hambre en cuatro días. Todo lo demás fue acarreado de vuelta a los conquistadores mongoles, probablemente para no volver a verse jamás en Bagdad."
 building_baghdad_ruined_palaces_01: "Palacios en ruinas"
 building_baghdad_ruined_palaces_01_desc:  "$building_type_baghdad_ruined_palaces_01_desc$"
 building_baghdad_ruined_palaces_02: "Palacios saqueados"
 building_baghdad_ruined_palaces_02_desc: "$building_type_baghdad_ruined_palaces_01_desc$"
 building_baghdad_ruined_palaces_03: "Palacios desiertos"
 building_baghdad_ruined_palaces_03_desc:  "$building_type_baghdad_ruined_palaces_01_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_ctesiphon_01: "Ctesifonte: el Fénix persa"
 building_type_ctesiphon_the_shadowed_pheonix_ctesiphon_01_desc: "Ctesifonte fue capital real de los imperios iranios durante más de ochocientos años, en los períodos parto y sasánida. Joya del mundo, podría volver a serlo."
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_01: "Ctesifonte: las brasas"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_01_desc: "Surgida de un pequeño campamento militar convertido en aldea, Ctesifonte tuvo unos comienzos humildes."
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_02: "Ctesifonte: las llamas"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_02_desc: "Como capital del Imperio sasánida, Ctesifonte se convirtió en una rica metrópolis comercial que se fundió con las ciudades vecinas a ambas orillas del río."
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_03: "Ctesifonte: el Fénix"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_03_desc: "A finales del siglo VI y principios del VII, algunos decían que era la mayor ciudad del mundo, y dejó un legado que pervive hasta hoy."
 building_type_ctesiphon_the_shadowed_pheonix_white_palace_01: "El Palacio Blanco"
 building_type_ctesiphon_the_shadowed_pheonix_white_palace_01_desc: "El Palacio Blanco fue la residencia principal del Rey de Reyes sasánida en la capital, Ctesifonte, fundado con toda probabilidad por el segundo monarca sasánida, Sapor I."
 building_ctesiphon_the_shadowed_pheonix_white_palace_01: "Un palacio de polvo"
 building_ctesiphon_the_shadowed_pheonix_white_palace_01_desc: "Lleva siglos sin usarse, y por una buena razón. Renovar este lugar exigirá mucho trabajo."
 building_ctesiphon_the_shadowed_pheonix_white_palace_02: "Muros rotos"
 building_ctesiphon_the_shadowed_pheonix_white_palace_02_desc: "$building_ctesiphon_the_shadowed_pheonix_white_palace_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_white_palace_03: "Contratando guardias"
 building_ctesiphon_the_shadowed_pheonix_white_palace_03_desc: "De nuevo habitable, el renovado Palacio Blanco necesita ahora personal cualificado."
 building_ctesiphon_the_shadowed_pheonix_white_palace_04: "Celebrando corte"
 building_ctesiphon_the_shadowed_pheonix_white_palace_04_desc: "$building_ctesiphon_the_shadowed_pheonix_white_palace_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_white_palace_05: "Palacio del Shāhanshāh"
 building_ctesiphon_the_shadowed_pheonix_white_palace_05_desc: "Es como si el tiempo no hubiera hecho mella en el Palacio Blanco. Vuelve a ser la corte de una vibrante dinastía persa, aunque más sombría."
 building_type_ctesiphon_the_shadowed_pheonix_taq_kasra_01: "Taq Kasra"
 building_type_ctesiphon_the_shadowed_pheonix_taq_kasra_01_desc: "A veces llamado el Arco de Ctesifonte, era la fachada del palacio principal de la ciudad y es la única estructura visible que queda de la antigua capital."
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_01: "Ruina del complejo imperial"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_01_desc: "El arco formaba parte del complejo del palacio imperial. La sala del trono, presumiblemente bajo el arco o detrás de él, hace tiempo que se perdió por los vaivenes del tiempo."
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_02: "Vestigio del complejo imperial"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_02_desc: "$building_ctesiphon_the_shadowed_pheonix_taq_kasra_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_03: "Sala de audiencias en ruinas"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_03_desc: "La estructura que se conserva hoy era el pórtico principal de la sala de audiencias de los sasánidas, que mantuvieron el mismo emplazamiento elegido por los partos."
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_04: "Sala de audiencias restaurada"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_04_desc: "$building_ctesiphon_the_shadowed_pheonix_taq_kasra_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_05: "Taq Kasra"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_05_desc: "A partir de un único pilar superviviente has restaurado el glorioso palacio principal de Ctesifonte. Un símbolo de tu poder y tu resistencia a la vista de todos."
 building_type_ctesiphon_the_shadowed_pheonix_veh_ardashir_01: "Veh Aradshir"
 building_type_ctesiphon_the_shadowed_pheonix_veh_ardashir_01_desc: "Conocida originalmente como Seleucia, esta ciudad formaba el suburbio más rico de Ctesifonte."
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_01: "Vestigios de la inundación"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_01_desc: "A mediados del siglo V, una inundación en Veh-Ardashir dividió la ciudad en dos y provocó su declive. Tu primera tarea será reparar el daño causado."
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_02: "Salvando la división"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_02_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_ardashir_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_03: "Sede del Patriarca"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_03_desc: "La Iglesia de Oriente tuvo aquí su sede en otro tiempo. El recuerdo de aquella época podría ser un instrumento útil para atraer de vuelta a la gente a tu renovada Ctesifonte."
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_04: "Un nuevo lugar de peregrinación"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_04_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_ardashir_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_05: "Veh Aradshir"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_05_desc: "Con este suburbio revitalizado, Ctesifonte está un paso más cerca de su plena recuperación."
 building_type_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01: "Bagh i Hinduvan"
 building_type_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01_desc: "El \"jardín de los indios\", construido durante el reinado del rey Cosroes II. Un lugar de belleza y descanso que hará falta en tu ambicioso proyecto para Ctesifonte."
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01: "Polvo y arena"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01_desc: "Hoy poco más que polvo y arena; de esta maravilla del mundo clásico no queda nada salvo recuerdos."
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_02: "Verdor incipiente"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_02_desc: "$building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_03: "Flor tímida"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_03_desc: "Un jardín incipiente en una ciudad incipiente, ambos creados para satisfacer la nostalgia de su sombrío gobernante."
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_04: "Dosel de sombras"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_04_desc: "$building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_05: "Bagh i Hinduvan"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_05_desc: "Probablemente no sea idéntico al clásico, pero este jardín sigue siendo un espectáculo magnífico en tu Ctesifonte restaurada."
 building_type_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01: "Wēh Antīōk Khosrow"
 building_type_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01_desc: "Wēh Antīōk Khosrow, literalmente \"mejor que Antioquía, Cosroes lo construyó\", fue una ciudad fundada por el sah Cosroes I en la orilla oriental del Tigris, cerca de Ctesifonte, y poblada por prisioneros de guerra romanos deportados."
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01: "No tan buena como Antioquía"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01_desc: "El nombre promete mucho a quien lo oye, y será tarea tuya asegurarte de que esa promesa se cumpla."
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_02: "Casi tan buena como Antioquía"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_02_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_03: "Mejor que Antioquía"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_03_desc: "Bueno, no hay competiciones oficiales entre ciudades para saber si has ganado, pero, si se me permite decirlo, has hecho un buen papel."
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_04: "Construida por ti"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_04_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_05: "Wēh Antīōk"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_05_desc: "Quitar la parte de Khosrow del nombre parece mezquino, pero seamos sinceros: el nombre mismo ya era mezquino de entrada."
 building_type_ctesiphon_the_shadowed_pheonix_dastagerd_01: "Dastagird"
 building_type_ctesiphon_the_shadowed_pheonix_dastagerd_01_desc: "La residencia real de los sasánidas, con su propia corte y fortaleza, fue una pieza fundamental del poder político de Ctesifonte."
 building_ctesiphon_the_shadowed_pheonix_dastagerd_01: "Cicatrices de Bizancio"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_01_desc: "En 628, Dastagird fue saqueada por el emperador bizantino Heraclio. Nunca más se supo de la ciudad. Es hora de reconstruir lo que los romanos destruyeron."
 building_ctesiphon_the_shadowed_pheonix_dastagerd_02: "Sobreviviendo a Heraclio"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_02_desc: "$building_ctesiphon_the_shadowed_pheonix_dastagerd_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_03: "La vieja Artemita"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_03_desc: "Antaño se alzaba aquí una ciudad más antigua, que fue encrucijada entre el mundo griego y el parto. Podría volver a ser un centro así."
 building_ctesiphon_the_shadowed_pheonix_dastagerd_04: "Dos viejas ciudades renovadas"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_04_desc: "$building_ctesiphon_the_shadowed_pheonix_dastagerd_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_05: "Dastagird"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_05_desc: "Disfrutando de las vistas del Tigris desde tu ventana, Dastagird vuelve a ser una pieza central, política y diplomática, de tu Ctesifonte restaurada."
 building_type_ctesiphon_the_shadowed_pheonix_valashabad_01: "Valashabad"
 building_type_ctesiphon_the_shadowed_pheonix_valashabad_01_desc: "Suburbio de Ctesifonte, esta ciudad fue escenario de una batalla decisiva en la caída de los sasánidas. Restaurarla enviaría un mensaje poderoso."
 building_ctesiphon_the_shadowed_pheonix_valashabad_01: "Legado de Partia"
 building_ctesiphon_the_shadowed_pheonix_valashabad_01_desc: "Valashabad fue fundada por el rey parto Vologases I antes de que los sasánidas la conquistaran. Esta larga tradición de la cultura persa seguirá en pie bajo tu vigilancia."
 building_ctesiphon_the_shadowed_pheonix_valashabad_02: "Parta y sasánida"
 building_ctesiphon_the_shadowed_pheonix_valashabad_02_desc: "$building_ctesiphon_the_shadowed_pheonix_valashabad_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_valashabad_03: "Muertos de Sabat"
 building_ctesiphon_the_shadowed_pheonix_valashabad_03_desc: "Aquí se libró una batalla decisiva entre árabes y persas. El velo es tenue; sospechas que soldados muertos hace mucho siguen combatiendo en el más allá."
 building_ctesiphon_the_shadowed_pheonix_valashabad_04: "Inframundo de Sabat"
 building_ctesiphon_the_shadowed_pheonix_valashabad_04_desc: "$building_ctesiphon_the_shadowed_pheonix_valashabad_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_valashabad_05: "Valashabad"
 building_ctesiphon_the_shadowed_pheonix_valashabad_05_desc: "Esta ciudad restaurada sigue pareciendo blasfema a los no iniciados. Sin embargo, quienes entienden a los muertos saben que las [UmbraGlossary('shadowlands')] nunca han estado tan cerca como aquí."
 building_type_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine: "Ctesifonte tifónica"
 building_type_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine_desc: "Aunque Egipto nunca poseyó esta región, su expansión durante el Imperio Nuevo trajo consigo a algunos audaces Setitas. Es como si la ciudad hubiera estado siempre destinada a la gloria de Set."
 building_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine: "Ctesifonte tifónica"
 building_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine_desc: "$building_type_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult: "Antes de Enoc"
 building_type_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult_desc: "El Tal'mahe'Ra es antiguo, más que esta misma ciudad. Pero recuerda sus orígenes en la región y contempla su futuro."
 building_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult: "Antes de Enoc"
 building_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult_desc: "$building_type_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_newest_pyramid: "Un sabor piramidal del hogar"
 building_type_ctesiphon_the_shadowed_pheonix_newest_pyramid_desc: "Ni en su apogeo llegó el antiguo Egipto tan lejos, hasta ahora. Debes asegurarte de que nadie lo olvide jamás."
 building_ctesiphon_the_shadowed_pheonix_newest_pyramid: "Un sabor piramidal del hogar"
 building_ctesiphon_the_shadowed_pheonix_newest_pyramid_desc: "$building_type_ctesiphon_the_shadowed_pheonix_newest_pyramid_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_the_suns_birth: "Cuna del Sol"
 building_type_ctesiphon_the_shadowed_pheonix_the_suns_birth_desc: "Aquí nació el propio sol, y ahora este lugar vuelve a estar en manos de los fieles. Esta vez no nos derribarán ni la traición de las seductoras egipcias ni la conquista de los buitres romanos."
 building_ctesiphon_the_shadowed_pheonix_the_suns_birth: "Cuna del Sol"
 building_ctesiphon_the_shadowed_pheonix_the_suns_birth_desc: "$building_type_ctesiphon_the_shadowed_pheonix_the_suns_birth_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_sacred_flame: "La Llama Sagrada"
 building_type_ctesiphon_the_shadowed_pheonix_sacred_flame_desc: "La llama sagrada de Ahura Mazda vuelve a brillar sobre su ciudad. Quizá pronto brille también sobre todo el mundo."
 building_ctesiphon_the_shadowed_pheonix_sacred_flame: "La Llama Sagrada"
 building_ctesiphon_the_shadowed_pheonix_sacred_flame_desc: "$building_type_ctesiphon_the_shadowed_pheonix_sacred_flame_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_temple_of_osiris: "Templo de Osiris"
 building_type_ctesiphon_the_shadowed_pheonix_temple_of_osiris_desc: "Las [UmbraGlossary('shadowlands')] están cerca aquí. Si Osiris nos observa desde Amenti, este será el lugar perfecto para crear un nuevo nexo de poder para su uso."
 building_ctesiphon_the_shadowed_pheonix_temple_of_osiris: "Templo de Osiris"
 building_ctesiphon_the_shadowed_pheonix_temple_of_osiris_desc: "$building_type_ctesiphon_the_shadowed_pheonix_temple_of_osiris_desc$"
 building_type_ctesiphon_the_shadowed_pheonix_temple_to_jupiter: "Templo del Olimpo"
 building_type_ctesiphon_the_shadowed_pheonix_temple_to_jupiter_desc: "Un templo a los viejos dioses de antes de la Cruz y la Media Luna, cuando gobernabas abiertamente y repartías el mundo con tus compañeros inmortales."
 building_ctesiphon_the_shadowed_pheonix_temple_to_jupiter: "Templo del Olimpo"
 building_ctesiphon_the_shadowed_pheonix_temple_to_jupiter_desc: "$building_type_ctesiphon_the_shadowed_pheonix_temple_to_jupiter_desc$"
 building_type_baghdad_rebuilt_baghdad_01: "Bagdad reconstruida"
 building_type_baghdad_rebuilt_baghdad_01_desc: "$building_baghdad_rebuilt_baghdad_01_desc$"
 building_baghdad_rebuilt_baghdad_01: "Bagdad: la aldea"
 building_baghdad_rebuilt_baghdad_01_desc: "El viento mece las ramas. Atrás quedaron las brumas; ahora rezamos por cielos despejados."
 building_baghdad_rebuilt_baghdad_02: "Bagdad: la ciudad"
 building_baghdad_rebuilt_baghdad_02_desc: "En este lugar se alza la eternidad. Ni las tormentas ni los hombres pueden acabar con ella."
 building_baghdad_rebuilt_baghdad_03: "Bagdad: la metrópolis"
 building_baghdad_rebuilt_baghdad_03_desc: "Sobre Bagdad cayó el cielo. Ahora remendada, ansía vivir."
 building_type_baghdad_city_of_a_thousand_mosques_01: "Ciudad de las mil mezquitas"
 building_type_baghdad_city_of_a_thousand_mosques_01_desc: "$building_baghdad_city_of_a_thousand_mosques_01_desc$"
 building_baghdad_city_of_a_thousand_mosques_01: "Ciudad de una sola mezquita"
 building_baghdad_city_of_a_thousand_mosques_01_desc: "Caída una vez, alzada dos veces. El cielo nos llama. ¿Seremos dignos?"
 building_baghdad_city_of_a_thousand_mosques_02: "Ciudad de una docena de mezquitas"
 building_baghdad_city_of_a_thousand_mosques_02_desc: "Este es el Ojo del Mundo. La oración asciende sin cesar. Más allá, no hay nada."
 building_baghdad_city_of_a_thousand_mosques_03: "Ciudad de las mil mezquitas"
 building_baghdad_city_of_a_thousand_mosques_03_desc: "Llegó la calamidad. La superamos. Ojalá nos alcemos lo bastante alto."
 building_type_baghdad_center_of_the_world_learning_01: "Centro del saber del mundo"
 building_type_baghdad_center_of_the_world_learning_01_desc: "$building_baghdad_center_of_the_world_learning_01_desc$"
 building_baghdad_center_of_the_world_learning_01: "Bagdad iletrada"
 building_baghdad_center_of_the_world_learning_01_desc: "El negro y el rojo se empañaron juntos. Una vez más, ejercemos nuestro oficio. Recordemos."
 building_baghdad_center_of_the_world_learning_02: "Bagdad sabia"
 building_baghdad_center_of_the_world_learning_02_desc: "Memoria. Solo en los registros podemos conservar la vida. Así será siempre."
 building_baghdad_center_of_the_world_learning_03: "Centro del saber del mundo"
 building_baghdad_center_of_the_world_learning_03_desc: "¿Podemos olvidar el horror? Que no lo hagamos. Pues en nuestra desgracia, las palabras volaron de nuevo."
 building_type_baghdad_oldest_city_01: "La ciudad más antigua"
 building_type_baghdad_oldest_city_01_desc: "$building_baghdad_oldest_city_01_desc$"
 building_baghdad_oldest_city_01: "Ruinas olvidadas"
 building_baghdad_oldest_city_01_desc: "Pero los terrenos encantados de Babel vigilan. De sus piedras, construimos de nuevo."
 building_baghdad_oldest_city_02: "Ciudad recordada"
 building_baghdad_oldest_city_02_desc: "A orillas del Éufrates reposó Babilonia. En su arrogancia, halló su perdición. Una que da bríos a Bagdad."
 building_baghdad_oldest_city_03: "Legado eterno"
 building_baghdad_oldest_city_03_desc: "Lo que el orgullo forjó, no pudimos repararlo. En el servicio, la expiación marca nuestros pasos."
 building_type_baghdad_heart_of_trade_01: "Corazón del comercio"
 building_type_baghdad_heart_of_trade_01_desc: "$building_baghdad_heart_of_trade_01_desc$"
 building_baghdad_heart_of_trade_01: "Mercados bulliciosos"
 building_baghdad_heart_of_trade_01_desc: "Bajo el peso del sol, el río de oro late de nuevo."
 building_baghdad_heart_of_trade_02: "Centro del comercio"
 building_baghdad_heart_of_trade_02_desc: "¡Contempla y maravíllate! Todos los caminos se encuentran aquí, en la encrucijada del universo."
 building_baghdad_heart_of_trade_03: "Corazón del comercio"
 building_baghdad_heart_of_trade_03_desc: "Venas frenéticas, un corazón eterno. Bagdad es ese corazón."
 POD_baghdad_sacked_rebuilt_modifier: "Renacida de las cenizas"
 POD_baghdad_complacency_modifier: "Magnífica autocomplacencia"
 POD_baghdad_complacency_modifier_desc: "Bagdad, el centro del mundo, ya es perfecta. No hace falta hacer nada más.\n\n#R Sin embargo, algunos agoreros predicen que en 1258 ocurrirá un cambio radical...#!\n\n"
 POD_baghdad_looted_1_modifier: "Reducida a cenizas"
 POD_baghdad_looted_1_modifier_desc: "Los mortales han sido diezmados; su ciudad tardará muchos años en recuperarse.\n#help Toda herida acaba por sanar...#!"
 POD_baghdad_looted_2_modifier: "Muerte persistente"
 POD_baghdad_looted_2_modifier_desc: "Se ha despejado la mayor parte de los escombros, pero el hedor de la muerte sigue impregnando el aire."
 POD_baghdad_looted_3_modifier: "Cicatrices en curación"
 POD_baghdad_looted_3_modifier_desc: "Se han resembrado los campos. Se han reconstruido los hogares. El pueblo de Bagdad se afana en curar las últimas heridas de su antaño gran ciudad."
 building_type_bjarkarey_hollr_01: "Hollr Bjarkarey"
 building_type_bjarkarey_hollr_01_desc: "#F La nieve se tiñe de rojo con el tributo a los Aesir. La sombra del Padre de Todos aún se cierne aquí, desafiante frente a la Cruz.#!"
 building_bjarkarey_hollr_01: "Ótryggr Bjarkarey"
 building_bjarkarey_hollr_01_desc: "Dura es la vida en el mundo, gran lujuria, edad del hacha, edad de la espada, se partirán los escudos, edad del viento, edad del lobo, antes de que el mundo se hunda."
 building_bjarkarey_hollr_02: "Tryggr Bjarkarey"
 building_bjarkarey_hollr_02_desc: "Mueren las reses, mueren los parientes, y así muere uno mismo; una sola cosa nunca muere: la fama de las hazañas de un muerto."
 building_bjarkarey_hollr_03: "Kappsamr Bjarkarey"
 building_bjarkarey_hollr_03_desc: "El sol se vuelve negro, la tierra se hunde en el mar, las estrellas brillantes caen del cielo. Las llamas abrasan las hojas de Yggdrasil, una gran hoguera alcanza las nubes más altas."
 building_type_bjarkarey_leynikirkja_01: "Leynikirkja"
 building_type_bjarkarey_leynikirkja_01_desc: "#F Algunos Cainitas aún desprecian a los Aesir y se aferran a sus creencias heréticas: alaban no al Padre de Todos, sino al Primer Asesino.#!"
 building_bjarkarey_leynikirkja_01: "Dulinn Leynikirkja"
 building_bjarkarey_leynikirkja_01_desc: "Los Herejes se reúnen en la oscuridad, ocultando el rostro de la ira de los Aesir."
 building_bjarkarey_leynikirkja_02: "Undirokaðr Leynikirkja"
 building_bjarkarey_leynikirkja_02_desc: "Con sus refugios quemados y sus nombres maldecidos por los escaldos, los no creyentes siguen aferrándose con terquedad a su fe."
 building_bjarkarey_leynikirkja_03: "Mulinn Leynikirkja"
 building_bjarkarey_leynikirkja_03_desc: "La sangre de los Herejes se derrama sobre la nieve mientras sus salas ocultas yacen arrasadas. Solo quedan unos pocos quebrantados, que claman a un dios que no responde."
 building_bjarkarey_leynikirkja_04: "Umskipaðr Leynikirkja"
 building_bjarkarey_leynikirkja_04_desc: "Los falsos sacerdotes han sido entregados al águila de sangre. Sus altares ocultos yacen ahora abiertos a los verdaderos dioses del frío norte."
 POD_bjarkarey_leynikirkja_bonus: "Tres poderosos [GetTrait('gangrel').GetName(GetPlayer)] se unirán a tu [court|E]"
 building_type_bjarkarey_throndarnes_01: "Thróndarnes"
 building_type_bjarkarey_throndarnes_01_desc: "#F El corazón de la cristiandad en Bjarkarey; la iglesia está siempre llena de mortales que rezan a su dios del sur.#!"
 building_bjarkarey_throndarnes_01: "Minnkaðr Thróndarnes"
 building_bjarkarey_throndarnes_01_desc: "Las campanas aún tañen por el Cristo Blanco, pero el rebaño mengua."
 building_bjarkarey_throndarnes_02: "Skuggvaðr Thróndarnes"
 building_bjarkarey_throndarnes_02_desc: "A la voz del sacerdote le tiembla el pulso cuando empiezan a oírse plegarias al Padre de Todos."
 building_bjarkarey_throndarnes_03: "Holr Thróndarnes"
 building_bjarkarey_throndarnes_03_desc: "La iglesia yace profanada: la cruz cuelga invertida y los cuervos se dan un festín con la carne de los sacerdotes sacrificados."
 building_bjarkarey_throndarnes_04: "Umbreytt Thróndarnes"
 building_bjarkarey_throndarnes_04_desc: "Cristo yace ahora olvidado, enterrado en la nieve junto a su templo. Un campo abierto para los blóts rituales mancha el que fuera lugar santo."
 POD_bjarkarey_throndarnes_bonus: "Obtienes el [trait|E] [GetTrait('reaver').GetName(GetPlayer)]\nPuede reclutar [GetMaA('blood_thralls_maa').GetName] como [men_at_arms|E]"
 building_type_bjarkarey_drekafloti_01: "Drekafloti"
 building_type_bjarkarey_drekafloti_01_desc: "#F En la orilla, junto a las frágiles barcas de pesca, reposa una flota de navíos negros de velas rojas. Desde esta costa partieron los Einherjar hacia el mundo, hambrientos de sangre y oro.#!"
 building_bjarkarey_drekafloti_01: "Svefndi Drekafloti"
 building_bjarkarey_drekafloti_01_desc: "Los barcos descansan en la orilla junto a los pescadores en plena faena; los mortales temen las noches en que despliegan sus velas carmesí."
 building_bjarkarey_drekafloti_02: "Bryggjur Herja"
 building_bjarkarey_drekafloti_02_desc: "Se aprestan más y más drakkars mientras se aparta a los humildes pescadores. Las tripulaciones aguardan inquietas la noche en que por fin dejarán la tranquila orilla."
 building_bjarkarey_drekafloti_03: "Úlfræskr Berserkir"
 building_bjarkarey_drekafloti_03_desc: "Los berserkers esperan listos en los poderosos barcos mientras se despliegan las velas carmesí que cubren el cielo nocturno. La armada está preparada para barrer las costas del sur y saquear cuanto encuentre a su paso."
 building_bjarkarey_drekafloti_04: "Ragnafloti"
 building_bjarkarey_drekafloti_04_desc: "El mar se ha vuelto negro bajo los oscuros cascos de la flota sangrienta. Cuando estos indiscutibles amos del mar se acercan a una costa extranjera y sus velas carmesí se divisan en el horizonte, los nativos rezan pidiendo clemencia."
 building_type_bjarkarey_blodga_langhus_01: "Blóðga Langhús"
 building_type_bjarkarey_blodga_langhus_01_desc: "#F En la colina donde antaño se alzó este gran salón hubo una iglesia modesta. Ahora, el inmortal gobernante de Bjarkarey proyecta sobre ella una larga sombra.#!"
 building_bjarkarey_blodga_langhus_01: "Aska-Salir"
 building_bjarkarey_blodga_langhus_01_desc: "Las piedras de la capilla fueron derribadas para levantar un salón sombrío y cruel en lo alto de la colina."
 building_bjarkarey_blodga_langhus_02: "Stálsalir"
 building_bjarkarey_blodga_langhus_02_desc: "Las espadas y los escudos de los enemigos caídos de los Einherjar adornan las paredes. El ganado, inquieto, aparta la mirada para no atraer la ira de alguno de sus oscuros amos."
 building_bjarkarey_blodga_langhus_03: "Herhöfðingja Sæti"
 building_bjarkarey_blodga_langhus_03_desc: "Los oscuros muros de madera parecen siempre manchados de carmesí reciente. Los formidables guerreros se sientan dentro a gusto, riendo, jactándose y peleando a su antojo."
 building_bjarkarey_blodga_langhus_04: "Eilífar Hallar"
 building_bjarkarey_blodga_langhus_04_desc: "El longhouse empapado de sangre es una fortaleza inquebrantable sobre la colina. Los Hirðmen beben a placer mientras los Esclavos de Sangre los sirven. El reinado del Padre de Todos es absoluto entre estos muros."
 building_type_bjarkarey_frjalsir_menn_01: "Frjálsir Menn"
 building_type_bjarkarey_frjalsir_menn_01_desc: "#F Los lugareños se afanan en las granjas y en la costa, con la esperanza de mantener contentos a sus señores para no atraer su ira.#!"
 building_bjarkarey_frjalsir_menn_01: "Sjalfráðr Menn"
 building_bjarkarey_frjalsir_menn_01_desc: "Los nativos de la tierra trabajan para sí mismos y descuidan sus ofrendas a ti y a los Aesir."
 building_bjarkarey_frjalsir_menn_02: "Skyldumaðr Menn"
 building_bjarkarey_frjalsir_menn_02_desc: "El pueblo se ha consagrado a trabajar con diligencia para sus oscuros señores."
 building_bjarkarey_frjalsir_menn_03: "Traustr Menn"
 building_bjarkarey_frjalsir_menn_03_desc: "Bjarkarey crece, y con ella crece la entrega del pueblo hacia ti, hacia el Padre de Todos y hacia su hogar."
 building_bjarkarey_frjalsir_menn_04: "Kappsamr Menn"
 building_bjarkarey_frjalsir_menn_04_desc: "Los ciudadanos de Bjarkarey están ahora enteramente entregados a sus amos. Nada se interpondrá en su deber."
 bjarkarey_frjalsir_menn_bonus: "Desbloquearás los [court_positions|E] de [GetCourtPositionType('kertilsveinr_court_position').GetName()] y [GetCourtPositionType('skutilsveinr_court_position').GetName()]."
 building_type_bjarkarey_blothaugr_01: "Blothaugr"
 building_type_bjarkarey_blothaugr_01_desc: "#F En una colina apartada se alza un sangriento lugar de sacrificio, cubierto de runas y piedra. Aquí se celebran blóts con frecuencia en honor de los Aesir.#!"
 building_bjarkarey_blothaugr_01: "Lítill Blothaugr"
 building_bjarkarey_blothaugr_01_desc: "El lugar de sacrificio es solo un pequeño círculo cubierto de runas y piedra."
 building_bjarkarey_blothaugr_02: "Vaxa Blothaugr"
 building_bjarkarey_blothaugr_02_desc: "El túmulo sacrificial ha crecido, y los fieles que participan en los blóts aumentan cada noche."
 building_bjarkarey_blothaugr_03: "Stórr Blothaugr"
 building_bjarkarey_blothaugr_03_desc: "El lugar de sacrificio abarca ahora una vasta extensión de tierra. Las colinas se tiñen de rojo con la sangre ofrendada a Odín."
 building_bjarkarey_blothaugr_04: "Óendanligr Blothaugr"
 building_bjarkarey_blothaugr_04_desc: "Toda Bjarkarey participa ahora en los grandes blóts. Incontables fieles, mortales e inmortales, acuden a estas colinas para aplacar a los Aesir."
 building_type_bjarkarey_solarhvelfing_01: "Sólarhvelfing"
 building_type_bjarkarey_solarhvelfing_01_desc: "#F Bajo el longhouse de la colina se extiende un vasto espacio donde los Hirðmen descansan a salvo de los abrasadores rayos del sol.#!"
 building_bjarkarey_solarhvelfing_01: "Berr Sólarhvelfing"
 building_bjarkarey_solarhvelfing_01_desc: "Las Bóvedas Solares siguen siendo un espacio espartano bajo el longhouse, apto solo para el recogimiento y poco más."
 building_bjarkarey_solarhvelfing_02: "Prýddr Sólarhvelfing"
 building_bjarkarey_solarhvelfing_02_desc: "Las Bóvedas lucen ahora decenas de trofeos en sus muros, testimonio de la fuerza de los fieles que moran en ellas."
 building_bjarkarey_solarhvelfing_03: "Brynklæddr Sólarhvelfing"
 building_bjarkarey_solarhvelfing_03_desc: "Las Bóvedas Solares, ya de por sí formidables, se han reforzado aún más para proteger a los guerreros que alojan. Ahora nada podrá derribarlas."
 building_bjarkarey_solarhvelfing_04: "Stórr Sólarhvelfing"
 building_bjarkarey_solarhvelfing_04_desc: "Más que un simple refugio subterráneo, las Bóvedas Solares se alzan ahora como un gran monumento a la fuerza y la perseverancia de todos los Einherjar."
 building_type_bjarkarey_myrkvidir_01: "Myrkviðir"
 building_type_bjarkarey_myrkvidir_01_desc: "#F El peligroso y frondoso bosque que rodea Bjarkarey actúa como línea natural de defensa de la población. Incontables hombres han desaparecido en sus profundidades y jamás se les ha vuelto a ver.#!"
 building_bjarkarey_myrkvidir_01: "Yfirvaxinn Myrkviðir"
 building_bjarkarey_myrkvidir_01_desc: "El bosque sigue siendo un lugar peligroso y aterrador, incluso para los lugareños. Nadie entra en él por voluntad propia. Pocos de los que lo hacen regresan."
 building_bjarkarey_myrkvidir_02: "Villtr Myrkviðir"
 building_bjarkarey_myrkvidir_02_desc: "Se ha impuesto una apariencia de orden en el bosque salvaje, gracias a numerosos trabajadores y cazadores empeñados en mantener seguras las afueras de Bjarkarey."
 building_bjarkarey_myrkvidir_03: "Ráðr Myrkviðir"
 building_bjarkarey_myrkvidir_03_desc: "Los árboles del bosque hacen fluir el comercio de Bjarkarey, mientras la fauna y los cazadores lo mantienen bajo control."
 building_bjarkarey_myrkvidir_04: "Bundinn Myrkviðir"
 building_bjarkarey_myrkvidir_04_desc: "Los animales salvajes protegen ahora los bosques de Bjarkarey de cualquier amenaza externa, y las vastas selvas proveen al pueblo de ricos materiales."
 building_type_bjarkarey_gullveigr_lundi_01: "Gullveigr Lundi"
 building_type_bjarkarey_gullveigr_lundi_01_desc: "#F Un bosquecillo sagrado, del que se rumorea que fue donde los Aesir atravesaron con una lanza a Gullveig, la quemaron tres veces y renació otras tantas.#!"
 building_bjarkarey_gullveigr_lundi_01: "Askr Lundi"
 building_bjarkarey_gullveigr_lundi_01_desc: "Para la mayoría, este bosquecillo es simplemente un tramo inquietante del bosque. Para los practicantes de las viejas costumbres, en cambio, es un lugar sagrado cuya tierra aún conserva poder."
 building_bjarkarey_gullveigr_lundi_02: "Eldsglóðr Lundi"
 building_bjarkarey_gullveigr_lundi_02_desc: "El abrumador olor a ceniza llena el aire mientras la savia de los árboles sangra del color del oro puro. Brujas y hechiceros acuden en bandadas a este bosquecillo para beber del antiguo poder."
 building_bjarkarey_gullveigr_lundi_03: "Brennandi Lundi"
 building_bjarkarey_gullveigr_lundi_03_desc: "El recuerdo de la quema y el renacimiento de Gullveig está grabado ahora en las mismas raíces de la tierra. Hasta los mortales sienten su poder."
 building_bjarkarey_gullveigr_lundi_04: "Logandi Lundi"
 building_bjarkarey_gullveigr_lundi_04_desc: "El bosquecillo se ha transformado en un lugar hermoso y espantoso que escupe a la cara del Cristo Blanco. Una ceniza antinatural llena el aire mientras el bosquecillo se tiñe de rojo con vitae fresca."
 POD_bjarkarey_gullveigr_lundi_rune_wise: "Obtienes el [trait|E] [GetTrait('rune_wise').GetName(GetNullCharacter)], que desbloquea los caminos rúnicos nórdicos de la #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Hechicería#!#!."
 building_type_bjarkarey_ulfahus_01: "Úlfahús"
 building_type_bjarkarey_ulfahus_01_desc: "#F Los salvajes lobos y sabuesos de Bjarkarey se mantienen en sus jaulas, a la espera de ser liberados contra cualquier necio que se atreva a atacarlos.#!"
 building_bjarkarey_ulfahus_01: "Villr Úlfahús"
 building_bjarkarey_ulfahus_01_desc: "Una rústica cabaña en lo profundo del bosque alberga a las bestias, anormalmente fuertes y crueles, de Bjarkarey. Los mortales tienden a evitarlas, pero los animales sirven como temible guardia de la población cuando hace falta."
 building_bjarkarey_ulfahus_02: "Gráðigr Úlfahús"
 building_bjarkarey_ulfahus_02_desc: "La cabaña se ha ampliado para alojar a más animales y el salón luce ahora las enormes pieles de bestias terribles. Sus aullidos, audibles a millas de distancia, sirven de eficaz advertencia a cualquier forastero."
 building_bjarkarey_ulfahus_03: "Blóðugr Úlfahús"
 building_bjarkarey_ulfahus_03_desc: "Lo que antes era una simple choza con jaulas se ha ampliado hasta convertirse en una aterradora fortaleza para los depredadores supremos de la noche. Las tablas del suelo parecen ahora permanentemente empapadas de sangre."
 building_bjarkarey_ulfahus_04: "Fenrir Úlfahús"
 building_bjarkarey_ulfahus_04_desc: "Esta extensa guarida de bestias rivaliza ahora con los grandes salones de hidromiel de antaño. Los habitantes de Bjarkarey afirman que el propio Fenrir vela por las criaturas que alberga."
 building_type_bjarkarey_hvitakristr_01: "Hvítakristr Bjarkarey"
 building_type_bjarkarey_hvitakristr_01_desc: "#F La nieve se tiñe de rojo con el tributo a Dios. La Cruz ha aplastado los últimos y obstinados vestigios de las viejas costumbres.#!"
 building_bjarkarey_hvitakristr_01: "Bjarkarey subyugada"
 building_bjarkarey_hvitakristr_01_desc: "No penséis que he venido para traer paz a la tierra; no he venido para traer paz, sino espada. - Mateo 10:34"
 building_bjarkarey_hvitakristr_02: "Bjarkarey flagelada"
 building_bjarkarey_hvitakristr_02_desc: "Derribaréis sus altares, quebraréis sus estatuas, quemaréis con fuego sus bosques, y destruiréis las esculturas de sus dioses... - Deuteronomio 12:3"
 building_bjarkarey_hvitakristr_03: "Bjarkarey santificada"
 building_bjarkarey_hvitakristr_03_desc: "Sus muertos serán arrojados, y de sus cadáveres subirá el hedor, y los montes se disolverán con su sangre. - Isaías 34:3"
 building_type_bjarkarey_cathedral_god_01: "Catedral de Dios"
 building_type_bjarkarey_cathedral_god_01_desc: "#F Thróndarnes se alza como baluarte de la cristiandad en esta tierra fría y extranjera.#!"
 building_bjarkarey_cathedral_god_01: "Capilla de Cristo"
 building_bjarkarey_cathedral_god_01_desc: "En esta humilde iglesia, los fieles se reúnen para protegerse del frío cortante y de los monstruos de la oscuridad, rezando al Señor por su amparo.\n«La luz en las tinieblas resplandece, y las tinieblas no prevalecieron contra ella.» - Juan 1:5"
 building_bjarkarey_cathedral_god_02: "Santuario de los Fieles"
 building_bjarkarey_cathedral_god_02_desc: "A medida que se fortalece la fe del rebaño, también lo hace la iglesia. La madera ha cedido paso a la sólida piedra y la gente respira más tranquila entre estos muros.\n«Y yo también te digo que tú eres Pedro, y sobre esta roca edificaré mi iglesia; y las puertas del infierno no prevalecerán contra ella.» - Mateo 16:18"
 building_bjarkarey_cathedral_god_03: "Catedral creciente"
 building_bjarkarey_cathedral_god_03_desc: "Las campanas tañen y los chapiteles se alzan hacia el cielo mientras las fes paganas se dispersan. Thróndarnes se mantiene firme como prueba de que la luz radiante de Dios llega incluso a estas tierras frías.\n«Yo he edificado casa por morada para ti, asiento en que tú habites para siempre.» - 1 Reyes 8:13"
 building_bjarkarey_cathedral_god_04: "Luz de Dios"
 building_bjarkarey_cathedral_god_04_desc: "Thróndarnes se ha convertido en un faro de fe en el confín del mundo. El Cristo Blanco ha expulsado la oscuridad de estas tierras y el pueblo se regocija.\n«Y oí una gran voz del cielo que decía: He aquí el tabernáculo de Dios con los hombres, y él morará con ellos...» - Apocalipsis 21:3"
 POD_bjarkarey_cathedral_pilgrimage_bonus_desc: "Coste de la [activity|E] [GetActivityType('activity_pilgrimage').GetName]: #P -50%#!"
 POD_bjarkarey_cathedral_pilgrimage_bonus_activity: "[hollr_bjarkarey|E]"
 building_type_bjarkarey_cathedral_caine_01: "Catedral de Caín"
 building_type_bjarkarey_cathedral_caine_01_desc: "#F Antaño santuario de cristianos, Thróndarnes sirve ahora para adorar a un Dios más oscuro.#!"
 building_bjarkarey_cathedral_caine_01: "Capilla del Padre Oscuro"
 building_bjarkarey_cathedral_caine_01_desc: "Esta humilde iglesia es el único faro de esperanza para los adoradores del Padre Oscuro.\n«Y puso el SEÑOR una señal en Caín, para que no lo matase cualquiera que lo hallara.» - Génesis 4:15"
 building_bjarkarey_cathedral_caine_02: "Santuario oscuro"
 building_bjarkarey_cathedral_caine_02_desc: "La iglesia se refuerza a medida que crece la influencia de la Herejía. La luz de Dios es rechazada en este lugar sagrado, pues toda la adoración se dirige a Caín.\n«El que come mi carne y bebe mi sangre tiene vida eterna; y yo le resucitaré en el día postrero.» — Juan 6:54"
 building_bjarkarey_cathedral_caine_03: "Catedral enraizada"
 building_bjarkarey_cathedral_caine_03_desc: "En un acto de burla contra Dios, oscuros y retorcidos chapiteles se alzan hacia el cielo mientras campanas ominosas tañen cada noche, anunciando a la gente que sus pastores inmortales están despiertos y hambrientos.\n«Y casi todo es purificado según la ley con sangre; y sin derramamiento de sangre no se hace remisión.» - Hebreos 9:22"
 building_bjarkarey_cathedral_caine_04: "Furia del Primer Asesino"
 building_bjarkarey_cathedral_caine_04_desc: "La Herejía Cainita tiene ahora una nueva fortaleza en esta iglesia de cristal ennegrecido y piedra. Su gran sombra cubre toda Bjarkarey y anuncia una gran victoria de los Herejes.\n«Porque la vida de la carne está en la sangre, y yo os la he dado para hacer expiación sobre el altar por vuestras almas...» - Levítico 17:11"
 building_type_bjarkarey_knight_fortress_01: "Fortaleza del Caballero"
 building_type_bjarkarey_knight_fortress_01_desc: "#F Lo que fue un tosco longhouse empapado de sangre se ha convertido ahora en una armería para los fieles caballeros de Dios.#!"
 building_bjarkarey_knight_fortress_01: "Longhouse santificado"
 building_bjarkarey_knight_fortress_01_desc: "Los viejos muros de madera, empapados de la sangre de cristianos, han sido purificados con agua bendita. Sirve ahora como modesto puesto avanzado y armería para los primeros guerreros cristianos lo bastante valientes para sostener esta tierra helada.\n«¿Y qué acuerdo hay entre el templo de Dios y los ídolos? Porque vosotros sois el templo del Dios viviente...» - 2 Corintios 6:16"
 building_bjarkarey_knight_fortress_02: "Guarnición ferviente"
 building_bjarkarey_knight_fortress_02_desc: "Se han alzado recios muros de piedra en torno al viejo longhouse, custodiados por caballeros disciplinados con espadas y escudos bendecidos. Los bárbaros trofeos del interior han sido sustituidos por cruces.\n«Vestíos de toda la armadura de Dios, para que podáis estar firmes contra las asechanzas del diablo.» - Efesios 6:11"
 building_bjarkarey_knight_fortress_03: "Hogar de los Cruzados del Norte"
 building_bjarkarey_knight_fortress_03_desc: "El longhouse ha sido convertido por completo en una formidable fortaleza de fe y poderío militar. Monjes, herreros y guerreros recorren sus salas, todos trabajando al unísono para formar una fuerza lo bastante fuerte para domar estas tierras.\n«Bendito sea el SEÑOR, mi fortaleza, que adiestra mis manos para la guerra y mis dedos para la batalla.» - Salmo 144:1"
 building_bjarkarey_knight_fortress_04: "Armería de Dios"
 building_bjarkarey_knight_fortress_04_desc: "La fortaleza se alza ahora como una armería reluciente e inexpugnable para los campeones del Cristo Blanco, donde los santos caballeros reúnen fuerzas para librar una guerra eterna contra los paganos.\n«Maza me sois, y armas de guerra: y por medio de ti quebrantaré naciones, y por medio de ti destruiré reinos.» - Jeremías 51:20"
 POD_bjarkarey_knight_fortress_bonus: "Tres [GetTrait('ventrue').GetName(GetPlayer)] diestros en el arte marcial se unirán a tu [court|E]"
 building_type_bjarkarey_hammer_god_01: "Martillo de Dios"
 building_type_bjarkarey_hammer_god_01_desc: "#F Antaño una poderosa flota de los nórdicos paganos, las Flotas del Dragón sirven ahora para destruir a los enemigos de Dios.#!"
 building_bjarkarey_hammer_god_01: "Barcos convertidos"
 building_bjarkarey_hammer_god_01_desc: "Las Flotas del Dragón que antaño sembraron el miedo en las costas cristianas han sido aserradas y sustituidas por la santa cruz.\n«Los que descienden al mar en naves, y hacen negocio en las muchas aguas, ellos han visto las obras del SEÑOR, y sus maravillas en lo profundo.» - Salmo 107:23-24"
 building_bjarkarey_hammer_god_02: "Velas bendecidas"
 building_bjarkarey_hammer_god_02_desc: "Tripulados por marineros y sacerdotes fieles, los poderosos barcos surcan las olas del norte para impartir justicia divina.\n«Así dice el SEÑOR, el que abre camino en el mar, y senda en las aguas impetuosas.» - Isaías 43:16"
 building_bjarkarey_hammer_god_03: "Armada de la Cruz"
 building_bjarkarey_hammer_god_03_desc: "En Bjarkarey se ha forjado una formidable armada de roble bendecido y hierro.\n«Tú dominas la braveza del mar; cuando se levantan sus ondas, tú las sosiegas.» - Salmo 89:9"
 building_bjarkarey_hammer_god_04: "Trueno de Dios"
 building_bjarkarey_hammer_god_04_desc: "Una vasta y atronadora armada de Dios controla ahora los mares del norte. Las temibles Flotas del Dragón han renacido como el Martillo de Dios, listas para aplastar a todo hereje y descreído.\n«Tu diestra, oh SEÑOR, ha sido magnificada en poder; tu diestra, oh SEÑOR, ha quebrantado al enemigo.» - Éxodo 15:6"
 POD_bjarkarey_hammer_raid_bonus_desc: "Obtienes la capacidad de [raid|E]"
 building_type_bjarkarey_hammer_caine_01: "Martillo de Caín"
 building_type_bjarkarey_hammer_caine_01_desc: "#F La armada más poderosa de los Einherjar sirve ahora para propagar la palabra y el terror del Padre Oscuro.#!"
 building_bjarkarey_hammer_caine_01: "Velas bautizadas en sangre"
 building_bjarkarey_hammer_caine_01_desc: "Los barcos vikingos conquistados han sido bautizados en la vitae de los infieles. Estos oscuros navíos sirven ahora a la Herejía.\n«Y el segundo ángel derramó su copa sobre el mar, y se convirtió en sangre como de muerto; y murió todo ser vivo que había en el mar.» - Apocalipsis 16:3"
 building_bjarkarey_hammer_caine_02: "Flotas Ensombrecidas"
 building_bjarkarey_hammer_caine_02_desc: "Tripulados por ghouls leales y guiados por capitanes vinculados por la sangre, los barcos son un medio aterradoramente eficaz de difundir la causa de los Herejes.\n«Fieras ondas del mar, que espuman su propia vergüenza; estrellas errantes, a las cuales es reservada eternamente la oscuridad de las tinieblas.» - Judas 1:13"
 building_bjarkarey_hammer_caine_03: "Armada del Padre Oscuro"
 building_bjarkarey_hammer_caine_03_desc: "Estos barcos de incursión son ya infames en las costas del norte por el terror que representan. Estandartes oscuros restallan en los vientos helados mientras los guerreros no-muertos que duermen en el interior de la flota aguardan con paciencia para desatar la ira del Padre.\n«El segundo ángel tocó la trompeta, y como un gran monte ardiendo en fuego fue precipitado en el mar; y la tercera parte del mar se convirtió en sangre...» - Apocalipsis 8:8"
 building_bjarkarey_hammer_caine_04: "Furia de Caín"
 building_bjarkarey_hammer_caine_04_desc: "La armada ha evolucionado hasta convertirse en una apocalíptica que reclama el dominio de los mares. Las flotas del dragón ya no existen. Solo quedan el Martillo de Caín y su deseo de ahogar el mundo en sangre.\n«Asimismo pondré su mano sobre el mar, y sobre los ríos su diestra.» - Salmo 89:25"
 building_type_bjarkarey_godfearing_subjects_01: "Súbditos temerosos de Dios"
 building_type_bjarkarey_godfearing_subjects_01_desc: "#F Antaño esclavos paganos de amos crueles, los habitantes de Bjarkarey siguen recelando de sus nuevos señores.#!"
 building_bjarkarey_godfearing_subjects_01: "Rebaño penitente"
 building_bjarkarey_godfearing_subjects_01_desc: "Los descendientes de los esclavos paganos comprenden quiénes son sus nuevos amos. Aunque su comprensión es sencilla, estos aldeanos recién bautizados miran ya a la Cruz con fe.\n«De modo que si alguno está en Cristo, nueva criatura es; las cosas viejas pasaron; he aquí todas son hechas nuevas.» - 2 Corintios 5:17"
 building_bjarkarey_godfearing_subjects_02: "Labriegos piadosos"
 building_bjarkarey_godfearing_subjects_02_desc: "Las viejas supersticiones paganas han sido arrancadas de raíz y sustituidas por una devoción rígida e inquebrantable.\n«El principio de la sabiduría es el temor del SEÑOR; buen entendimiento tienen todos los que practican sus mandamientos...» - Salmo 111:10"
 building_bjarkarey_godfearing_subjects_03: "Verdaderos creyentes"
 building_bjarkarey_godfearing_subjects_03_desc: "La fe se ha convertido en el cimiento de esta comunidad. Unidos en su fervor virtuoso, los habitantes de Bjarkarey están dispuestos a trabajar duro y defender a sus amos.\n«En el temor del SEÑOR está la fuerte confianza; y esperanza tendrán sus hijos.» - Proverbios 14:26"
 building_bjarkarey_godfearing_subjects_04: "Manos celosas de Cristo"
 building_bjarkarey_godfearing_subjects_04_desc: "La población de Bjarkarey se ha convertido en una población ferozmente leal y piadosa.\n«El fin de todo el discurso oído es este: Teme a Dios, y guarda sus mandamientos; porque esto es el todo del hombre.» - Eclesiastés 12:13"
 building_type_bjarkarey_terror_christ_01: "Terror de Cristo"
 building_type_bjarkarey_terror_christ_01_desc: "#F La antaño apacible plaza del pueblo se ha transformado en un brutal y sangriento escenario de retribución divina.#!"
 building_bjarkarey_terror_christ_01: "Poste del pecador"
 building_bjarkarey_terror_christ_01_desc: "En la plaza del pueblo se ha erigido un sencillo poste de madera donde se ata y azota a ladrones y pecadores menores para que sirvan de advertencia a los demás.\n«Los juicios están preparados para los escarnecedores, y los azotes para las espaldas de los necios.» - Proverbios 19:29"
 building_bjarkarey_terror_christ_02: "Castigando a los pecadores"
 building_bjarkarey_terror_christ_02_desc: "La plaza se ha ampliado para albergar horcas y recios postes de flagelación. Los gritos de los pecadores y los infieles resuenan por toda Bjarkarey y aseguran que el justo rebaño permanezca temeroso, obediente y libre de la tentación de las viejas costumbres paganas.\n«Entonces castigaré con vara su rebelión, y con azotes su iniquidad.» - Salmo 89:32"
 building_bjarkarey_terror_christ_03: "Jaulas del arrepentimiento"
 building_bjarkarey_terror_christ_03_desc: "La plaza yace ahora empapada de sangre de forma permanente, consagrada al castigo. Las piras y las brutales ejecuciones ofrecen un espectáculo horrendo y obligatorio que purifica a la comunidad mediante el puro terror.\n«Y ya también está puesta el hacha a la raíz de los árboles; y todo árbol que no da buen fruto es cortado y echado en el fuego.» - Mateo 3:10"
 building_bjarkarey_terror_christ_04: "Ira justa de Dios"
 building_bjarkarey_terror_christ_04_desc: "La plaza del pueblo se alza como monumento a una aterradora retribución divina. Cadáveres cuelgan de pequeñas jaulas de hierro suspendidas en el aire, y entre ellos hay unos pocos vivos que claman por el alivio de la muerte. Los habitantes de Bjarkarey saben ahora que la autoridad del Señor es absoluta y que ningún pecado quedará sin respuesta.\n«Horrenda cosa es caer en manos del Dios vivo.» - Hebreos 10:31"
 POD_terror_christ_bonus: "Desbloquea una nueva opción de [execution|E]"
 building_type_bjarkarey_hall_judgment_01: "Sala del Juicio"
 building_type_bjarkarey_hall_judgment_01_desc: "#F Lo que fue el ayuntamiento de los mortales locales se ha convertido en una imponente sede de la ley sagrada.#!"
 building_bjarkarey_hall_judgment_01: "Cámara de la Luz"
 building_bjarkarey_hall_judgment_01_desc: "Una modesta sala de madera en el centro del pueblo donde se zanjan las disputas y se lee la ley del Rey. Los lugareños se consuelan al saber que la ley sigue en pie, incluso ahora.\n«Se ha dado a conocer el SEÑOR en el juicio que ejecutó; en la obra de sus manos fue enlazado el impío.» - Salmo 9:16"
 building_bjarkarey_hall_judgment_02: "Tribunal de la Fe"
 building_bjarkarey_hall_judgment_02_desc: "Jueces severos, designados por la autoridad de la Iglesia, sopesan los actos y los crímenes de los hombres e imponen un orden duro pero necesario.\n«Alegría es para el justo el hacer juicio; mas destrucción a los que hacen iniquidad.» - Proverbios 21:15"
 building_bjarkarey_hall_judgment_03: "Juicio de Dios"
 building_bjarkarey_hall_judgment_03_desc: "El pequeño ayuntamiento se ha ampliado hasta convertirse en un gran tribunal. Pesados estandartes con la espada y la cruz cuelgan sobre el asiento del juez, y cada sentencia se dicta conforme a las leyes de los hombres y de Dios.\n«Estas son las cosas que habéis de hacer: Hablad verdad cada cual con su prójimo; juzgad en vuestras puertas verdad y juicio de paz.» - Zacarías 8:16"
 building_bjarkarey_hall_judgment_04: "Sede de la Rectitud"
 building_bjarkarey_hall_judgment_04_desc: "Bajo la mirada vigilante y sin parpadeo de ángeles tallados, los jueces determinan el destino de todos los hombres y mujeres de Bjarkarey.\n«Porque Dios traerá toda obra a juicio, juntamente con toda cosa encubierta, sea buena o sea mala.» - Eclesiastés 12:14"
 POD_bjarkarey_hall_judgment_bonus: "Obtienes el [trait|E] [GetTrait('truefaith').GetName(GetPlayer)]"
 building_type_bjarkarey_dark_libraries_01: "Bibliotecas oscuras"
 building_type_bjarkarey_dark_libraries_01_desc: "#F En lo hondo de las bóvedas secretas perduran el saber prohibido, las escrituras heréticas y el conocimiento oculto, a salvo de la Iglesia ortodoxa.#!"
 building_bjarkarey_dark_libraries_01: "Archivos ocultos"
 building_bjarkarey_dark_libraries_01_desc: "Una colección secreta de pergaminos prohibidos y textos heréticos permanece escondida por los eruditos de Bjarkarey, lejos de los ojos de la celosa ortodoxia.\n«Y te daré los tesoros escondidos, y los secretos muy guardados...» - Isaías 45:3"
 building_bjarkarey_dark_libraries_02: "Scriptorium secreto"
 building_bjarkarey_dark_libraries_02_desc: "Escribas cristianos copian sin descanso manuscritos prohibidos en su empeño por usar el saber oculto para contraatacar a los Paganos.\n«Ahora, hijo mío, está advertido: el hacer muchos libros no tiene fin; y el mucho estudio es fatiga de la carne.» - Eclesiastés 12:12"
 building_bjarkarey_dark_libraries_03: "Archivos malditos"
 building_bjarkarey_dark_libraries_03_desc: "Las pequeñas bóvedas se han ampliado hasta formar un gran archivo. Los estantes gimen bajo el peso de los textos blasfemos.\n«Esta sabiduría no es la que desciende de lo alto, sino terrenal, animal, diabólica.» - Santiago 3:15"
 building_bjarkarey_dark_libraries_04: "Laberinto del Pecado"
 building_bjarkarey_dark_libraries_04_desc: "Los archivos son ahora como un laberinto, de saber interminable y prohibido. Quien se atreva a buscar sabiduría aquí puede encontrar más de lo que pretendía.\n«Pero a vosotros digo... a todos los que no tenéis esa doctrina, y no habéis conocido lo que ellos llaman las profundidades de Satanás, yo no os echaré otra carga.» - Apocalipsis 2:24"
 building_type_bjarkarey_taema_01: "Temja Bjarkarey"
 building_type_bjarkarey_taema_01_desc: "#F Oculto en una isla envuelta en bruma, accesible solo a los sabios de las runas, el Salón de Ulf es una casa de gran riqueza heredada de los días del vikingo. La aldea puede ser pequeña e insignificante y seguir las viejas costumbres, pero el propio Salón aún guarda grandes riquezas y poder.#!"
 building_bjarkarey_taema_01: "Bjarkarey de Njord"
 building_bjarkarey_taema_01_desc: "Sé que colgué del árbol batido por el viento,\nColgué allí nueve noches enteras;\nHerido con la lanza, y ofrendado fui\nA Odín, yo mismo a mí mismo,\nEn el árbol que nadie sabe\nDe qué raíz brota."
 building_bjarkarey_taema_02: "Bjarkarey del Cuervo"
 building_bjarkarey_taema_02_desc: "Nadie me dio de comer pan ni cuerno,\nY miré hacia abajo;\nTomé las runas, chillando las tomé,\nY al punto caí de nuevo."
 building_bjarkarey_taema_03: "Bjarkarey de Ulf"
 building_bjarkarey_taema_03_desc: "Runas hallarás y signos del destino,\nque el rey de los cantores coloreó,\ny los poderosos dioses hicieron;\nmuy fuertes los signos, muy poderosos los signos\nque el soberano de los dioses escribe."
 building_type_bjarkarey_ulf_hall_01: "Salón de Ulf"
 building_type_bjarkarey_ulf_hall_01_desc: "#F En los confines septentrionales de Bjarkarey se alza un salón en una isla brumosa, donde plebeyos y magos practican por igual las viejas costumbres a salvo de la cruz. Quienes carecen del don de la visión de Odín nunca dan con estos salones, pero los más sabios pueden contemplar su esplendor.#!"
 building_bjarkarey_ulf_hall_01: "Longhouse velado"
 building_bjarkarey_ulf_hall_01_desc: "Los salones están hechos de recia madera, ocultos por los duros elementos del norte. Sirven de refugio a quienes rehúyen a la Iglesia mortal que avanza."
 building_bjarkarey_ulf_hall_02: "Refugio protegido"
 building_bjarkarey_ulf_hall_02_desc: "Los pilares de madera de los salones están cubiertos de runas místicas que protegen a los sabios de los ojos indiscretos de los forasteros."
 building_bjarkarey_ulf_hall_03: "Salones de ceniza"
 building_bjarkarey_ulf_hall_03_desc: "El Salón de Ulf sigue siendo una gran fortaleza del poder pagano. Aquí, los verdaderos maestros de las viejas costumbres practican su arte en paz."
 building_bjarkarey_ulf_hall_04: "Casa de Ulf"
 building_bjarkarey_ulf_hall_04_desc: "El legendario santuario de Ulf Grimsson se conserva en Bjarkarey en toda su gloria. Las mismísimas raíces de este salón están ligadas a la tierra de Escandinavia, y nada podrá romper jamás ese vínculo."
 building_type_bjarkarey_ashen_throne_01: "Trono de ceniza de Ulf"
 building_type_bjarkarey_ashen_throne_01_desc: "#F El trono del legendario Ulf Grimsson conserva un poder considerable en estas tierras, aunque hayan pasado muchos años desde que se sentó en él por última vez.#!"
 building_bjarkarey_ashen_throne_01: "Sitial tallado"
 building_bjarkarey_ashen_throne_01_desc: "Una pesada silla de madera oscura, reservada para Ulf, se mantiene siempre vacía. Detallados relieves de grandes krakens y bestias rugientes adornan la madera a lo largo de todo el trono."
 building_bjarkarey_ashen_throne_02: "Trono manchado de sangre"
 building_bjarkarey_ashen_throne_02_desc: "Aún se distingue en el trono sangre seca desde hace mucho, que llena de temor a cualquier aspirante al sitial."
 building_bjarkarey_ashen_throne_03: "Sitial de los paganos"
 building_bjarkarey_ashen_throne_03_desc: "Aunque nadie sabe de qué está hecho exactamente el trono, muchos afirman que el propio Ulf lo talló de un fresno sagrado que él mismo taló."
 building_bjarkarey_ashen_throne_04: "Sitial de poder de Ulf"
 building_bjarkarey_ashen_throne_04_desc: "El sitial es en sí mismo un gran símbolo para los Paganos de toda Escandinavia. Mientras este salón y este trono sigan en pie, nunca serán derrotados. Las viejas costumbres perdurarán."
 POD_bjarkarey_ashen_throne_bonus: "Obtendrás un poderoso artefacto al completar este edificio."
 building_type_bjarkarey_grimsson_armory_01: "Armería de Grimsson"
 building_type_bjarkarey_grimsson_armory_01_desc: "#F Ulf Grimsson guardaba muchos tesoros en su salón. Las armas que dejó son las mejores de la tierra.#!"
 building_bjarkarey_grimsson_armory_01: "Alijo del saqueador"
 building_bjarkarey_grimsson_armory_01_desc: "La entrada a la armería recibe a los guerreros con una modesta colección de hierro oxidado, escudos maltrechos y hachas manchadas de sangre, recogidas en escaramuzas olvidadas."
 building_bjarkarey_grimsson_armory_02: "Arsenal del señor de la guerra"
 building_bjarkarey_grimsson_armory_02_desc: "Más adentro de la armería se revelan armas de acero de gran calidad y pesadas cotas de malla, que exhiben los trofeos obtenidos en las incursiones de Ulf allende los mares."
 building_bjarkarey_grimsson_armory_03: "Bóvedas de los caídos"
 building_bjarkarey_grimsson_armory_03_desc: "Hojas de calidad maestra, las armaduras destrozadas de caballeros extranjeros caídos y el botín de un centenar de aldeas incendiadas se mantienen afilados y listos."
 building_bjarkarey_grimsson_armory_04: "Armería de los Aesir"
 building_bjarkarey_grimsson_armory_04_desc: "Las armas de este legendario salón podrían rechazar al mismísimo Ragnarök."
 POD_bjarkarey_grimsson_armory_bonus: "Obtendrás un poderoso artefacto al completar este edificio."
 building_type_bjarkarey_prized_jewels_01: "Joyas preciadas"
 building_type_bjarkarey_prized_jewels_01_desc: "#F Ulf había amasado un poderoso tesoro a lo largo de sus numerosas aventuras. Alberga baratijas de todo tipo y es testimonio de lo lejos que navegó por el mundo.#!"
 building_bjarkarey_prized_jewels_01: "Plata saqueada"
 building_bjarkarey_prized_jewels_01_desc: "En las bóvedas se guardan plata, cobre y oro deslustrados, arrebatados a hombres extranjeros en tierras extranjeras."
 building_bjarkarey_prized_jewels_02: "Tesoro del dragón"
 building_bjarkarey_prized_jewels_02_desc: "Los pesados cofres de hierro, rebosantes de reluciente botín, son prueba de la destreza de Ulf y sus saqueadores."
 building_bjarkarey_prized_jewels_03: "Bóvedas profundas"
 building_bjarkarey_prized_jewels_03_desc: "Las bóvedas más profundas guardan un tesoro asombroso, arrebatado a inmortales rivales y héroes legendarios que osaron desafiar a Ulf Grimsson."
 building_bjarkarey_prized_jewels_04: "Joyas de Grimsson"
 building_bjarkarey_prized_jewels_04_desc: "El legendario tesoro de Ulf alberga rubíes impecables, armas de calidad maestra y otras baratijas inestimables que irradian un aura embriagadora de poder y riqueza."
 POD_bjarkarey_prized_jewels_bonus: "Obtendrás un poderoso artefacto al completar este edificio."
 building_type_bjarkarey_bones_njord_01: "Huesos de Njörðr"
 building_type_bjarkarey_bones_njord_01_desc: "#F En las costas de Bjarkarey yace el esqueleto de una gran bestia marina que los mortales usan como lugar de culto.#!"
 building_bjarkarey_bones_njord_01: "Costillas blanqueadas de las profundidades"
 building_bjarkarey_bones_njord_01_desc: "Un puñado de enormes huesos blanquecinos yace semienterrado en las costas de Bjarkarey. Los pescadores mortales que aún adoran a los Aesir acuden a menudo aquí a dejar ofrendas y a rezar por buenas capturas o vientos favorables."
 building_bjarkarey_bones_njord_02: "Santuario de la Bestia Marina"
 building_bjarkarey_bones_njord_02_desc: "Las colosales costillas han sido izadas y levantadas en vertical, atadas entre sí para formar un imponente arco. Bajo estos huesos, los descendientes de esclavos se reúnen para adorar a Njörðr y suplicarle vientos favorables en el mar."
 building_bjarkarey_bones_njord_03: "Templo de la Marea"
 building_bjarkarey_bones_njord_03_desc: "La arena bajo los huesos parece llevar una mancha roja permanente mientras los cánticos y plegarias de los fieles se mezclan con el rugido de las olas."
 building_bjarkarey_bones_njord_04: "Gran Catedral de Njörðr"
 building_bjarkarey_bones_njord_04_desc: "Bajo los huesos de esta bestia marina muerta se ha creado un santuario imponente y sobrecogedor para los seguidores de las viejas costumbres."
 building_type_bjarkarey_loyal_thralls_01: "Esclavos leales"
 building_type_bjarkarey_loyal_thralls_01_desc: "#F Los mortales de Bjarkarey se afanan en las costas y los campos, y su duro trabajo solo beneficia a sus nuevos señores.#!"
 building_bjarkarey_loyal_thralls_01: "Pescadores subyugados"
 building_bjarkarey_loyal_thralls_01_desc: "Los aldeanos trabajan sin descanso en las costas heladas, cambiando de buen grado su libertad por la promesa de protección. Prefieren la oscuridad al frío."
 building_bjarkarey_loyal_thralls_02: "Sirvientes vinculados"
 building_bjarkarey_loyal_thralls_02_desc: "El miedo se ha convertido en el motor de los lugareños. Faenan en los mares helados con la mirada vacía y ven cómo el fruto de su esfuerzo va a parar a los bolsillos de sus amos."
 building_bjarkarey_loyal_thralls_03: "Siervos juramentados"
 building_bjarkarey_loyal_thralls_03_desc: "Generaciones de terror y manipulación han quebrado a los mortales. Los aldeanos ofrecen ahora su trabajo, a sus hijos y sus propias venas sin cuestionar nada."
 building_bjarkarey_loyal_thralls_04: "Vasallos devotos"
 building_bjarkarey_loyal_thralls_04_desc: "Los habitantes de Bjarkarey han quedado reducidos a una población completamente quebrada y ferozmente devota. Despojados de toda autonomía y esperanza, encuentran un retorcido orgullo en complacer a sus amos."
 building_type_bjarkarey_divided_throndarnes_01: "Thróndarnes dividida"
 building_type_bjarkarey_divided_throndarnes_01_desc: "#F La única iglesia cristiana de Bjarkarey sigue separada del resto de la población pagana.#!"
 building_bjarkarey_divided_throndarnes_01: "Parroquia comprometida"
 building_bjarkarey_divided_throndarnes_01_desc: "Los sacerdotes del Cristo Blanco predican, pero sus palabras se han vuelto extrañamente tolerantes. Susurros en la oscuridad los han convencido de que es la mejor manera de mantener la paz."
 building_bjarkarey_divided_throndarnes_02: "Congregación sincrética"
 building_bjarkarey_divided_throndarnes_02_desc: "La línea entre los Aesir y la Cruz se ha difuminado a propósito. Cristianos y paganos por igual asisten ahora a los sermones tolerantes de Thróndarnes."
 building_bjarkarey_divided_throndarnes_03: "Rebaño pastoreado"
 building_bjarkarey_divided_throndarnes_03_desc: "La iglesia ha sido puesta bajo control, y el clero impone la voluntad de sus amos secretos y predica la unidad y el trabajo duro para que la población mezclada se afane sin descanso por la prosperidad del dominio."
 building_bjarkarey_divided_throndarnes_04: "Thróndarnes unida"
 building_bjarkarey_divided_throndarnes_04_desc: "Thróndarnes se alza ahora como monumento al poder de la manipulación no-muerta. Los cristianos y los paganos de Bjarkarey se han unido en una única población eficiente."
 building_type_bjarkarey_shadow_fleets_01: "Flotas de Sombra"
 building_type_bjarkarey_shadow_fleets_01_desc: "#F Las flotas del dragón de la era vikinga, despojadas de su gloria pagana y reconvertidas en una armada oscura y eficiente.#!"
 building_bjarkarey_shadow_fleets_01: "Acechadores nocturnos"
 building_bjarkarey_shadow_fleets_01_desc: "Las antiguas proas de dragón se han pintado de negro como la pez, igual que las velas. Estos veloces barcos ya no buscan aterrorizar, sino deslizarse en silencio por aguas oscuras para atacar y saquear."
 building_bjarkarey_shadow_fleets_02: "Flotilla silenciosa"
 building_bjarkarey_shadow_fleets_02_desc: "Tripulada por esclavos vinculados por la sangre y absolutamente silenciosos, esta flota creciente ataca sin ruido por la noche y saquea poblaciones en busca de sangre y oro."
 building_bjarkarey_shadow_fleets_03: "Barcos fantasma"
 building_bjarkarey_shadow_fleets_03_desc: "Los habitantes de Escandinavia susurran sobre una flota de barcos fantasma que va tras su sangre."
 building_bjarkarey_shadow_fleets_04: "Armada de la Noche"
 building_bjarkarey_shadow_fleets_04_desc: "Esta armada apocalíptica reclama el dominio de los mares del norte. Las Flotas del Dragón están enterradas, sustituidas por las Flotas de Sombra, una armada imparable que permite a los amos inmortales del norte atacar y saquear costas de todo el mundo."
 POD_bjarkarey_shadow_fleets_bonus: "Desbloquearás la capacidad de saquear al completar este edificio."