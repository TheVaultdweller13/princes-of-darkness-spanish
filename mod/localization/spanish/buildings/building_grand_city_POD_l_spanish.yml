 building_type_constantinople_plundered_constantinople_01: "Constantinopla Saqueada"
 building_type_constantinople_plundered_constantinople_01_desc: "La Ciudad del Deseo del Mundo, aplastada bajo los deseos más bajos de los hombres."
 building_constantinople_plundered_constantinople_01: "Constantinopla Robada"
 building_constantinople_plundered_constantinople_01_desc: "La que antaño fuera orgullosa capital de los romanos se alza ahora mancillada por quienes afirman seguir un mandato de Roma."
 building_constantinople_plundered_constantinople_02: "Constantinopla Asaltada"
 building_constantinople_plundered_constantinople_02_desc: "En Venecia, hombres acaudalados brindan por su buena fortuna. En Constantinopla, el decrépito cadáver de una ciudad antaño grandiosa hace posible esa fortuna."
 building_constantinople_plundered_constantinople_03: "Constantinopla Despojada"
 building_constantinople_plundered_constantinople_03_desc: "1204 fue el fin de un Sueño, pero al menos ciertamente enriqueció a algunas personas."

 building_type_constantinople_plundered_great_palace_01: "Gran Palacio"
 building_type_constantinople_plundered_great_palace_01_desc: "El Gran Palacio de Constantinopla, también conocido como el Palacio Sagrado, fue el mayor complejo palaciego imperial bizantino y se alzaba en el extremo sudoriental de la península. Sirvió como residencia imperial principal de los emperadores romanos de Oriente hasta 1081, y desde entonces fue el centro de la administración imperial.\nAhora es un desastre en ruinas donde los saqueadores latinos se atiborran de las riquezas que quedan."
