 building_type_constantinople_rebuild_hagia_sophia_01: "Santa Sofía"
 building_type_constantinople_rebuild_hagia_sophia_01_desc: "Centro religioso y espiritual de la Iglesia ortodoxa oriental durante casi mil años, la iglesia estaba dedicada a la Santa Sabiduría. Es el mayor espacio interior del mundo y uno de los primeros en emplear una cúpula completa sobre pechinas. Se la considera el epítome de la arquitectura bizantina.\nDe nuevo en manos de gobernantes fieles, Santa Sofía está siendo remodelada para eclipsar incluso su gloria anterior a la Cuarta Cruzada."
