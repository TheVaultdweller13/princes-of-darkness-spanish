 POD_rome_brujah_desc: "Esta es la ubicación de la Vía Lata, la gran calzada que los emperadores usaban para marchar en sus Triunfos. También contiene el último de los acueductos funcionales, el Aqua Virgo, un lugar donde los mortales se congregan en gran número."
