 POD_rome_toreador_desc: "Los de mente artística van a esta región para reflexionar sobre las glorias de épocas pasadas. Aquí, Pompeyo el Grande construyó el primer teatro romano, y el Emperador Domiciano encargó un estadio revestido de mármol. Ambos están ahora en ruinas."
