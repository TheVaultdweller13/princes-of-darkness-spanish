 building_type_constantinople_plundered_the_hippodrome_01: "El Hipódromo"
 building_type_constantinople_plundered_the_hippodrome_01_desc: "El Hipódromo de Constantinopla era un circo que fue el centro deportivo y social de la ciudad, famoso por sus carreras de caballos y de carros.\nSe ha vuelto inquietantemente silencioso desde que los latinos tomaron el control, y los propios venecianos usan ahora el monumento robado de los Cuatro Caballos como símbolo de su ciudad."
