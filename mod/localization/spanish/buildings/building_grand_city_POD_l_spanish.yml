 building_type_constantinople_reform_hagia_sophia_01: "Santa Sofía"
 building_type_constantinople_reform_hagia_sophia_01_desc: "Centro religioso y espiritual de la Iglesia ortodoxa oriental durante casi mil años, la iglesia estaba dedicada a la Santa Sabiduría. Es el mayor espacio interior del mundo y uno de los primeros en emplear una cúpula completa sobre pechinas. Se la considera el epítome de la arquitectura bizantina.\nReconstruida por los nuevos amos de Constantinopla, Santa Sofía es ahora muy distinta, pero sigue siendo un lugar de culto querido y prestigioso."
