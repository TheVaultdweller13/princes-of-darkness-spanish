 building_type_constantinople_rebuild_aqueduct_of_valens_01: "Acueducto de Valente"
 building_type_constantinople_rebuild_aqueduct_of_valens_01_desc: "El Acueducto de Valente es un sistema de acueducto romano construido a finales del siglo IV d.C. para abastecer a Constantinopla. La construcción del acueducto comenzó durante el reinado del emperador romano Constancio II y fue completada en el 373 por el Emperador Valente. El acueducto sigue en uso hasta el día de hoy, habiendo sido extendido y mantenido por los bizantinos.\nAfortunadamente, en gran parte perdonado por los latinos, ahora vuelve a ser utilizado por los legítimos amos de Constantinopla."
