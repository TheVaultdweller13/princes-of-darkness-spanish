 building_cairo_canton_disciples_03_desc: "$building_cairo_canton_disciples_01_desc$"
 building_cairo_canton_disciples_04: "Cantón Masivo de los Vengativos"
 building_cairo_canton_disciples_04_desc: "$building_cairo_canton_disciples_01_desc$"
 POD_cairo_canton_disciples_bonus: "Mejora [GetMaA('disciples_anubis_maa').GetName] a [GetMaA('disciples_anubis_maa_upgraded').GetName]"
 
 building_type_cairo_canton_djedi_01: "Cantón de los Alegres"
 building_type_cairo_canton_djedi_01_desc: "#F Un cantón construido para los Djedi.\nLos Fae africanos no estuvieron directamente involucrados en el antiguo conflicto Osiriano. Sin embargo, ahora se han alineado con la Liga y traen la tan necesaria alegría y diversión.#!"
 building_cairo_canton_djedi_01: "Pequeño Cantón de los Alegres"
 building_cairo_canton_djedi_01_desc: "Un cantón construido para los Djedi.\nLos Fae africanos no estuvieron directamente involucrados en el antiguo conflicto Osiriano. Sin embargo, ahora se han alineado con la Liga y traen la tan necesaria alegría y diversión."
 building_cairo_canton_djedi_02: "Cantón de los Alegres"
 building_cairo_canton_djedi_02_desc: "$building_cairo_canton_djedi_01_desc$"
 building_cairo_canton_djedi_03: "Gran Cantón de los Alegres"
 building_cairo_canton_djedi_03_desc: "$building_cairo_canton_djedi_01_desc$"
 building_cairo_canton_djedi_04: "Cantón Masivo de los Alegres"
 building_cairo_canton_djedi_04_desc: "$building_cairo_canton_djedi_01_desc$"
 POD_cairo_canton_djedi_bonus: "Puede pedir a [friends|E] que se conviertan en [best_friends|E]\n\nGana [GetModifier('cairo_canton_djedi_modifier').GetNameWithTooltip] si tienes un [best_friend|E]"
 
 building_type_cairo_canton_eshu_01: "Cantón de los Errantes"
 building_type_cairo_canton_eshu_01_desc: "#F Un cantón construido para los Eshu.\nEstos Fae errantes se han unido a los Osirianos y su cruzada, no como guerreros sino como mensajeros y exploradores.#!"
 building_cairo_canton_eshu_01: "Pequeño Cantón de los Errantes"
 building_cairo_canton_eshu_01_desc: "Un cantón construido para los Eshu.\nEstos Fae errantes se han unido a los Osirianos y su cruzada, no como guerreros sino como mensajeros y exploradores."
