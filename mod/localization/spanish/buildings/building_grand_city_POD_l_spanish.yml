 building_type_constantinople_reform_aqueduct_of_valens_01: "Acueducto de Valente"
 building_type_constantinople_reform_aqueduct_of_valens_01_desc: "El Acueducto de Valente es un sistema de acueducto romano construido a finales del siglo IV d.C. para abastecer a Constantinopla. La construcción del acueducto comenzó durante el reinado del emperador romano Constancio II y fue completada en el 373 por el Emperador Valente. El acueducto sigue en uso hasta el día de hoy, habiendo sido extendido y mantenido por los bizantinos.\nAún realizando una tarea muy importante para la comunidad, ha sido reparado e integrado en el mantenimiento realizado por los nuevos amos de Constantinopla."
