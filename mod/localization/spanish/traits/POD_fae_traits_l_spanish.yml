l_spanish:
  trait_fae: "Hada Verdadera"
  trait_fae_desc: "Hada Verdadera es un término dado a cualquier espíritu nativo del [UmbraGlossary('dreaming')], que no sea una quimera y que no se haya sometido al Camino del Changeling. Aunque no existe una lista exhaustiva de estas entidades, incluiría a los Primogénitos, los Oscuros y, posiblemente, a los Inanimae."
  trait_firstbornfae: "Hada Primogénita"
  trait_firstbornfae_desc: "Los primogénitos surgieron de las Nieblas de la Creación en el pasado distante. Los nuevos primogénitos son hijos de otros primogénitos o espíritus transformados en hadas mediante poderosos cantrips. Los primogénitos afirman que gobernaron e incluso crearon el mundo entero y que solo ellos tenían el derecho de dictar las leyes y decretos de los reinos mágicos. Aunque escépticos, muchos Fae aceptaron esto y se refirieron a ellos como las 'Hadas Verdaderas'. El ascenso de la humanidad ha disminuido enormemente el poder de los Primogénitos y muchos temen por su destino si no se hace algo."
  trait_denizen: "Adhene"
  trait_denizen_desc: "Los Kithain llaman arbitrariamente «Dark-kin» a estas criaturas por su vil reputación de siervos de los Fomorianos. A pesar de su abrupta partida de las tierras humanas, los Adhene mantuvieron una conexión directa, aunque sutil, con la psique humana. Personificando diversos aspectos de los sueños o miedos humanos, el número de especies adhene es vasto y variado."
  trait_inanimae: "Inanimae"
  trait_inanimae_desc: "Los Inanimae son primos de las Hadas Verdaderas. Aunque no son verdaderos espíritus elementales, tienen un estrecho parentesco con ellos. Cada Inanimae se modela a sí mismo según un elemento específico."
  trait_changeling: "Changeling"
  trait_changeling_desc: "Un híbrido hada/humano. Las antiguas Cortes creían que la Primera Mujer que vino a yacer con el Primer Hombre había sido una de los Primogénitos. De la unión entre ambos nació el primer changeling, aunque la pareja tuvo más hijos y la Primera Mujer tuvo otros compañeros. Otras explicaciones, especialmente de las hadas más antihumanistas, eran que los Changelings eran los restos de hadas deformes y no deseadas que fueron intercambiadas por niños mortales y criadas entre ellos."
  trait_kinain: "Kinain"
  trait_kinain_desc: "Un Kinain es un mortal que posee sangre de hada, pero no es un Changeling completo."
  trait_hsien: "Hsien"
  trait_hsien_desc: "En la antigüedad, los fae de China servían como mensajeros y sirvientes del [spirit_world|E]. En aquellos días viajaban libremente entre los reinos del espíritu y de la carne. Eran los emisarios de la naturaleza, los guardianes y protectores de los lugares sagrados. Los hsien son los descendientes de seres que quedaron atrapados en el reino de la carne. Divididos por forma y por corte, los hsien luchan por sobrevivir en un mundo de mortales que han dado la espalda al reino del espíritu, un mundo lleno de otros seres sobrenaturales que querrían destruirlos."

  trait_kithain: "Kithain"
  trait_jinn: "Jinn"
  trait_african_kiths: "Kiths Africanos"
  trait_phyla: "Phyla"
 TRAIT_FLAG_DESC_cannot_use_reverie: "No puede usar @realm_actor_icon![reverie|E]"
 TRAIT_FLAG_DESC_cannot_use_revelry: "No puede usar @realm_actor_icon![revelry|E]"
