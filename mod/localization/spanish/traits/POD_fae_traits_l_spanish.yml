  trait_art_chicanery: "Arte de Chicanería"
  trait_art_chicanery_desc: "La Chicanería es el poder mágico engañoso de la ilusión y la manipulación emocional. Aquellos que la practican extensamente suelen ser considerados algo indignos de confianza por los nobles." 
  trait_art_legerdemain: "Arte de Prestidigitación"
  trait_art_legerdemain_desc: "La Prestidigitación permite a un changeling controlar su entorno mediante medios telequinéticos, desde robar bolsillos a distancia hasta agarrar y lanzar grandes objetos. Este Arte también permite la creación de objetos y criaturas ilusorios sólidos." 
  trait_art_primal: "Arte de Primitiva"
  trait_art_primal_desc: "Primitiva permite a un changeling manipular las fuerzas de la naturaleza, desde invocar los elementos hasta comulgar con objetos inanimados. También otorga poder sobre el cuerpo, permitiendo a un fae endurecer su piel como la corteza de un árbol, curar heridas, desgarrar la carne e incluso cambiar de forma." 
  trait_art_soothsay: "Arte de Adivinación"
  trait_art_soothsay_desc: "La Adivinación representa la capacidad del changeling para ver el futuro. Dependiendo de los reinos utilizados en conjunción, el changeling puede ser capaz de obtener información sobre una persona, lugar u objeto." 
  trait_art_wayfare: "Arte de Viaje"
  trait_art_wayfare_desc: "El Arte de Viaje trata sobre la capacidad de un changeling para moverse a través del espacio. Esto implica rebotar y cubrir grandes distancias, avanzar a una velocidad imposible e incluso teletransportarse de un lugar a otro." 
 trait_art_oneiromancy: "Arte de la Oniromancia"
 trait_art_oneiromancy_desc: "La Oniromancia es el Arte de difuminar la fantasía y la realidad, el sueño y la vigilia, el Ensueño y el mundo normal. Quienes la poseen pueden causar un gran daño a la sociedad changeling desde lejos y son vistos como anatema por otros changelings. La Oniromancia está completamente prohibida entre los Kithain." 
  trait_art_chronos: "Arte de Chronos"
  trait_art_chronos_desc: "Chronos es el Arte de la manipulación temporal. A diferencia de los métodos para alterar el tiempo conocidos por otros seres sobrenaturales, Chronos es bastante indirecto y casi nunca sigue un orden lineal; en su lugar, es un Arte de estar disjunto del orden adecuado del tiempo, lo que hace que sus practicantes sean difíciles de afectar con magia de Tiempo y pierdan de vista cómo debería funcionar el tiempo." 
 trait_art_dragons_ire: "Arte de la Ira del Dragón"
 trait_art_dragons_ire_desc: "La Ira del Dragón es un poderoso Arte de la batalla y el conflicto. Muchos sidhe consideran la Ira del Dragón un Arte propio que solo puede dominar debidamente un noble guerrero de dedicación inquebrantable, pero en verdad también se practica algo entre los kiths plebeyos." 
  trait_art_naming: "Arte de Nombramiento"
  trait_art_naming_desc: "Nombramiento es el Arte de los [Glossary('Nombres Verdaderos','podgloss.truename')] y el poder de las palabras. Es uno de los Artes más insidiosos conocidos por los Kithain, ya que aunque sus niveles bajos son engañosamente inofensivos, un maestro del Nombramiento puede causar fácilmente daños irreparables. Los usos excesivamente frívolos del Nombramiento no son tomados a la ligera por la nobleza, que imparte justicia rápidamente a quienes subvierten sus efectos." 
  trait_art_sovereign: "Arte de Soberanía"
  trait_art_sovereign_desc: "Soberanía es el Arte de controlar a los plebeyos y la majestad noble. Es uno de los Artes más políticos practicados comúnmente por los Kithain, y existe en gran medida para asegurar el mantenimiento de sus estructuras políticas." 
 trait_art_contract: "Arte del Contrato"
 trait_art_contract_desc: "El Arte de los Contratos permite a los poderosos del mundo Fae atar juramentos de poder, castigar a los perjuros y sellar a participantes conscientes o inconscientes en acuerdos vinculantes que impone el poder del propio Ensueño." 
 trait_art_autumn: "Arte del Otoño"
 trait_art_autumn_desc: "El Arte del Otoño es una de las magias más antiguas que los Kithain aún practican. Considerado por algunos el más temible de los cuatro Artes estacionales, es la magia de la caída, de Samhain, del paso de la luz a la oscuridad. No posee nada de la energía creativa ni de la pasión de los Artes de Primavera o Verano, ni la solemne dignidad del Invierno. Es, en cambio, un arte de sombras y decadencia, de marchitarse, de una muerte aún no aceptada y de una perdición que aún se abate sobre sus víctimas." 
 trait_art_spring: "Arte de la Primavera"
 trait_art_spring_desc: "La Primavera encarna el vibrante optimismo, el asombro y la afinidad con la naturaleza de los fae. Los cantrips de Primavera canalizan el Glamour hacia el crecimiento, la vida nueva y la protección. Aunque los changelings modernos prefieren Primal, la Primavera mantiene un grupo dedicado de practicantes, sobre todo en la Corte Seelie." 
 trait_art_summer: "Arte del Verano"
 trait_art_summer_desc: "El Arte del Verano es una de las magias más celebradas de los Kithain y está especialmente asociado a la Corte Seelie. Este poderoso Arte estacional aprovecha la magia del fuego, de la pasión, de los días calurosos de anhelo y de las noches de ensueño. Muchos changelings lo consideran una herramienta inestimable para arrancar Glamour del corazón cínico del Mundo Otoñal." 
 trait_art_winter: "Arte del Invierno"
 trait_art_winter_desc: "A pesar de una larga ausencia del Ensueño, los changelings siguen ligados a las estaciones. Cada uno de los cuatro ciclos crea una magia poderosa para los Kithain, pero ninguna tan inflexible y aterradora como el invierno. El Invierno aprovecha la conexión de los fae con los lagos helados, las noches interminables y los vientos amargos. Los cantrips del Invierno tratan del frío, el hielo, el miedo y la pérdida del deseo. Muchos ven el Invierno como un Arte Unseelie, pero cualquier changeling puede aprender magias de invierno." 
  trait_art_metamorphosis: "Arte de Metamorfosis"
  trait_art_metamorphosis_desc: "Metamorfosis es el Arte de cambiar la forma de los seres vivos. Difiere notablemente de Primitiva en que, mientras que Primitiva se relaciona con dar forma a lo no vivo, Metamorfosis da forma a lo vivo. A través de ella, una fae puede convertirse fácilmente en lo que quiera, aunque solo sea por un corto tiempo."
  trait_art_pyretics: "Arte de Pirética"
  trait_art_pyretics_desc: "Pirética es el arte de manipular el fuego real y quimérico. Además de prender fuego a las cosas, la Pirética también puede aprovechar los aspectos menos destructivos del fuego, iluminando el camino y revelando lo invisible."
 trait_art_skycraft: "Arte del Cielo"
 trait_art_skycraft_desc: "Skycraft es un Arte del viento y el clima, temido y respetado por los marineros, que saben lo peligrosa que puede ser una tormenta inesperada para su sustento. Ciertas zonas están protegidas de los efectos de Skycraft, sobre todo las zonas submarinas. No se sabe que ningún kith tenga vínculos fuertes con Skycraft, aunque los grupos dispersos que lo conocen, como los Merfolk, suelen ser reacios a compartir los secretos de su práctica."
  trait_art_petros: "Petros"
  trait_art_petros_desc: "Petros, una de las dos Astillas de Tierra, gobierna el dar forma a la piedra e imbuir al lanzador con las propiedades físicas de la roca sólida. Todos los Inanimae que conocen Petros pueden trepar por una superficie rocosa con poca dificultad."
  trait_art_aquis: "Aquis"
  trait_art_aquis_desc: "Aquis es la Astilla de Agua, que controla el movimiento del agua a través de la atmósfera, además de reflejar la asociación del agua con la empatía y la medicina. Todos los Inanimae que conocen Aquis son capaces de respirar bajo el agua y saben nadar automáticamente."
  trait_art_pyros: "Pyros"
  trait_art_pyros_desc: "Pyros es la Astilla de Fuego, que produce calor y combustión espontánea, además de afectar simbólicamente a la pasión de sangre caliente. Todos los Inanimae que conocen Pyros pueden encender una pequeña llama sin necesidad de cerillas ni equipo."
  trait_art_stratus: "Stratus"
  trait_art_stratus_desc: "Stratus es la Astilla de Aire, que despista tanto mediante movimientos cegadoramente rápidos como produciendo ilusiones brumosas. Todos los Inanimae que conocen Stratus pueden sentir los patrones climáticos que se aproximan desde kilómetros de distancia."
  trait_art_verdage: "Verdage"
  trait_art_verdage_desc: "Verdage, una de las dos Astillas de Tierra, gobierna la vida y la materia orgánica, especialmente la que compone las plantas. Todos los Inanimae que conocen Verdage son capaces de identificar inmediatamente la vida vegetal que ven."
  trait_art_tieh_tan: "Tieh Tan"
  trait_art_tieh_tan_desc: "El elemento Metal incluye todos los metales preciosos y de trabajo: oro, plata, hierro, latón y acero. Aunque su alcance es bastante limitado comparado con el de Agua o Tierra, su uso abrumador es fabricar herramientas, sobre todo para la guerra."
  trait_art_lin_tan: "Lin Tan"
  trait_art_lin_tan_desc: "La Madera representa el poder del mundo natural y, como tal, tiene poder sobre gran parte del mundo. Los fenómenos naturales con los que se asocia son cualquier tipo de planta, la juventud, la salud y el crecimiento."
  trait_art_shui_tan: "Shui Tan"
  trait_art_shui_tan_desc: "El Agua es uno de los elementos más poderosos. Abarca todas las cosas líquidas y gaseosas: nubes, metano, agua, sangre, etc. El Agua es inherentemente vital pero peligrosa y engañosa. También controla los vientos y las tormentas, pero no los rayos."
  trait_art_hou_tan: "Hou Tan"
  trait_art_hou_tan_desc: "El Fuego se asocia con el rayo, la luz, la llama y todas las demás energías visibles. Se halla en las tormentas, las llamas abiertas, las pantallas de ordenador y el magma ardiente."
  trait_art_di_tan: "Di Tan"
  trait_art_di_tan_desc: "La Tierra representa toda la roca, el suelo, la piedra, las gemas y los minerales. La Tierra es el centro de todos los elementos y el fulcro de las percepciones chinas del mundo. Representa al propio Reino Medio."
  trait_art_nei_tan: "Nei Tan"
  trait_art_nei_tan_desc: "En el habla común de los Hsien, Nei Tan es la «Alquimia Interna», la magia taoísta Wu Tan que practican los shinma que persiguen el [Glossary('Tao Te Hsien','game_concept_tao_te_hsien_desc')]."
 TRAIT_FLAG_DESC_petros_cantrips: "$cantrip_easy_bunk$ Aplica al objetivo #TOOLTIP:STATIC_MODIFIER,cantrip_basic_stone_fist_modifier #P;L Puño de Piedra#!#!\n$cantrip_standard_bunk$ Aplica al objetivo #TOOLTIP:STATIC_MODIFIER,cantrip_basic_stone_skin_modifier #P;L Piel de Piedra#!#!\n$cantrip_hard_bunk$ Aplica al objetivo #TOOLTIP:STATIC_MODIFIER,cantrip_basic_stone_heart_modifier #P;L Corazón de Piedra#!#!\n$cantrip_easy_bunk$ Da al objetivo [gold_i]#V 10#! de [gold|E]\nMejora los [crafting_nodes|E] básicos de [crafting_forging|E]"
 TRAIT_FLAG_DESC_aquis_cantrips: "$cantrip_easy_bunk$ Cura una herida\n$cantrip_standard_bunk$ Inflige una herida\n$cantrip_standard_bunk$ Aflige a alguien con un mecanismo de afrontamiento\n$cantrip_easy_bunk$ Elimina el mecanismo de afrontamiento de alguien\n$passive_cantrip_fae$ Aplica [GetModifier('cantrip_basic_aquis_modifier').GetNameWithTooltip] a los [commanders|E] enemigos al dirigir un [army|E]"
 TRAIT_FLAG_DESC_pyros_cantrips: "$cantrip_easy_bunk$ Da a alguien un nuevo [friend|E]\n$cantrip_easy_bunk$ Da a alguien un nuevo [lover|E]\n$cantrip_easy_bunk$ Da a alguien un nuevo [rival|E]\n$cantrip_standard_bunk$ Mejora la [relation|E] de alguien\n$cantrip_standard_bunk$ Empeora la [relation|E] de alguien\n$cantrip_hard_bunk$ Rompe la [relation|E] de alguien"
 TRAIT_FLAG_DESC_stratus_cantrips: "$cantrip_easy_bunk$ Teletranspórtate a tu siguiente destino al [traveling|E]\n$cantrip_standard_bunk$ Teletransporta tu [army|E] a la ubicación del objetivo\n$passive_cantrip_fae$ Aplica [GetModifier('cantrip_basic_stratus_modifier').GetNameWithTooltip] a los [knights|E] enemigos al inicio de las [wars|E]"
