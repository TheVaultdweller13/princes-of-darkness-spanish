 TRAIT_FLAG_DESC_affected_by_banality: "@banality_icon!Afectado por [GetTrait('banality').GetName(GetNullCharacter)]"
  
  trait_sidhe: "Sidhe"
  trait_sidhe_desc: "Los nobles y hermosos gobernantes de la estirpe de las hadas, los sidhe son los líderes de una belleza de otro mundo de los clásicos señores de las hadas."
  trait_boggan: "Boggan"
  trait_boggan_desc: "Prácticos y trabajadores, los boggans son los guardianes de los hogares y amas de casa industriosas."
  trait_clurichaun: "Clurichaun"
  trait_clurichaun_desc: "Divertidos y carismáticos, estos Kithain son el origen de las historias de los leprechauns."
  trait_eshu: "Eshu"
  trait_eshu_desc: "Los trotamundos definitivos, los eshu son consumados narradores y exploradores."
  trait_ghilledhu: "Ghille dhu"
  trait_ghilledhu_desc: "Espíritus de lo verde y la naturaleza, los ghille dhu fueron antaño criaturas prósperas que cambiaban su naturaleza según la estación."
  trait_oba: "Oba"
  trait_oba_desc: "Los Nobles de los Elegbara, primos terrestres de los Eshu."
  trait_nocker: "Nocker"
  trait_nocker_desc: "Estos cascarrabias malhablados pueden ser pequeños y extraños a la vista, pero su necesidad de fabricar y construir los convierte en los ingeniosos inventores de la sociedad Kithain."
  trait_piskey: "Piskey"
  trait_piskey_desc: "Los piskies son un kith inocente y de ojos grandes, compuesto por vagabundos naturales que buscan la belleza asombrosa del mundo."
  trait_pooka: "Pooka"
  trait_pooka_desc: "Bromistas en el mejor de los casos y terrores en el peor, cada uno de estos Kithain comparte una afinidad con un animal particular y adora las bromas pesadas."
  trait_troll: "Troll"
  trait_troll_desc: "Estos poderosos gigantes encarnan la lealtad, el honor y la fuerza de las hadas."
  trait_redcap: "Redcap"
  trait_redcap_desc: "Estos horribles Kithain son monstruosas máquinas de comer, aterradores de contemplar y llenos de mala actitud y violencia."
  trait_riverhag: "Mora del Río"
  trait_riverhag_desc: "Estas hadas empapadas viven en masas de agua de movimiento rápido y arrastran a presas desprevenidas para ahogarlas."
  trait_satyr: "Sátiro"
  trait_satyr_desc: "Los sátiros son el espíritu del placer y la pasión hechos forma."
 TRAIT_FLAG_DESC_satyr_discount: "Enfriamiento y coste del Banquete: #P -20%#!"
  trait_sluagh: "Sluagh"
  trait_sluagh_desc: "Estas hadas oscuras y reservadas son las mejores recolectando información y guardando secretos."
  trait_swanmaiden: "Doncella Cisne"
  trait_swanmaiden_desc: "Las Doncellas Cisne son un kith de reciente aparición nacido de los sueños de romance y amor verdadero."
  trait_wichtel: "Wichtel"
  trait_wichtel_desc: "Los mineros y otros trabajadores son la base de una comunidad porque realizan tareas que deben completarse sin importar lo desagradables que sean, se aventuran en la oscuridad y el peligro en busca de los recursos de los que depende la sociedad, y realizan un trabajo peligroso y agotador sin esperar fama ni fortuna. El trabajo se hace porque debe hacerse. Los Wichtel encarnan este espíritu."
 trait_selkie: "Selkie"
 trait_selkie_desc: "Los Selkie son fae cambiapieles, capaces de adoptar la forma de una foca gracias a una piel de foca quimérica. "
  trait_ifrit: "Ifrit"
  trait_ifrit_desc: "Forjado en las llamas y endurecido en la batalla, un Ifrit tiene poca paciencia con la debilidad."
  trait_lilin: "Lilín"
  trait_lilin_desc: "Obstinada y seductora, una Lilin sabe lo que quiere y cómo conseguirlo."
  trait_qareen: "Qareen"
  trait_qareen_desc: "Los Qurana’ tienen el don y la maldición de la memoria eidética, y otros Jinn se refieren a ellos como “bibliotecas andantes”."
  trait_shaytan: "Shaytan"
  trait_shaytan_desc: "Negociador, embaucador, tentadora, charlatán: estas son las etiquetas fijadas a un Shaytan."
 trait_qadistu: "Qadistu"
 trait_qadistu_desc: "Una Lilin que ha ascendido a Ángel de la Prostitución, lo que la acerca a Lilith."
  trait_biloko: "Biloko"
  trait_biloko_desc: "Este kith enfatiza el valor de la tradición y la herencia, estando estrechamente ligado a su cultura y comunidad y recelando de los extraños."
  trait_djedi: "Djedi"
  trait_djedi_desc: "Amantes de la sociedad, la fiesta y la alegría, los Djedi son celebridades instantáneas que están tan dotados para la hechicería como malditos por su notoriedad."
  trait_kuino: "Kuino"
  trait_kuino_desc: "Esperanzados, ambiciosos e industriosos: este kith está formado por el impulso de lograr el éxito y una vida mejor, aunque deben cuidarse de la codicia y de la pérdida de sus objetos sagrados en esa búsqueda."
  trait_obambo: "Obambo"
  trait_obambo_desc: "Este kith está formado por exploradores y aventureros dotados que conocen todos los trucos para explorar la Tierra de los Antiguos Sueños y salir airosos con el botín; son tan afables como parecen, aunque son peligrosos cuando sus seres queridos se ven amenazados." 
  trait_okubili: "Okubili"
  trait_okubili_desc: "Equilibrados y en sintonía con sus vidas pasadas y centrados en mantener el equilibrio en todas sus vidas actuales, a este kith le encanta enseñar, pero a veces se enreda en las preocupaciones de vidas pasadas." 
  trait_chuihyu: "Chu-ih-yu"
  trait_chuihyu_desc: "Un Kwannon-jin de los Hsien Orientales, los Chu-ih-yu son nobles elementales; Kamuii Shinma del elemento Metal." 
  trait_chujung: "Chu Jung"
  trait_chujung_desc: "Un Kwannon-jin de los Hsien Orientales, los Chu Jung son nobles elementales; Kamuii Shinma del elemento Fuego." 
  trait_fuhsi: "Fu Hsi"
  trait_fuhsi_desc: "Un Kwannon-jin de los Hsien Orientales, los Fu Hsi son plebeyos; Hirayanu Shinma sintonizados con el elemento Madera con la capacidad de convertirse en serpientes." 
  trait_hanumen: "Hanumen"
  trait_hanumen_desc: "Un Kwannon-jin de los Hsien Orientales, los Hanumen son plebeyos; Hirayanu Shinma sintonizados con el elemento Tierra con la capacidad de convertirse en monos." 
  trait_hengpo: "Heng Po"
  trait_hengpo_desc: "Un Kwannon-jin de los Hsien Orientales, los Heng Po son plebeyos; Hirayanu Shinma sintonizados con el elemento Agua con la capacidad de convertirse en peces." 
  trait_houchi: "Hou-chi"
  trait_houchi_desc: "Un Kwannon-jin de los Hsien Orientales, los Hou-chi son nobles elementales; Kamuii Shinma del elemento Madera." 
  trait_komuko: "Komuko"
  trait_komuko_desc: "Un Kwannon-jin de los Hsien Orientales, los Komuko son nobles elementales; Kamuii Shinma del elemento Tierra." 
  trait_nyan: "Nyan"
  trait_nyan_desc: "Un Kwannon-jin de los Hsien Orientales, los Nyan son plebeyos; Hirayanu Shinma sintonizados con el elemento Fuego con la capacidad de convertirse en gatos." 
  trait_suijen: "Suijen"
  trait_suijen_desc: "Un Kwannon-jin de los Hsien Orientales, los Suijen son nobles elementales; Kamuii Shinma del elemento Agua." 
  trait_tanuki: "Tanuki"
  trait_tanuki_desc: "Un Kwannon-jin de los Hsien Orientales: los Tanuki son plebeyos; Shinma Hirayanu en sintonía con el elemento Metal, con la capacidad de convertirse en tanuki o perros mapache (a menudo mal traducidos como «tejones»)." 
  trait_glome: "Glome"
  trait_glome_desc: "Inanimae de Tierra y miembros del Imperio de las Piedras." 
  trait_kubera: "Kubera"
  trait_kubera_desc: "Inanimae de Madera y miembros del Imperio de las Semillas." 
  trait_ondine: "Ondina"
  trait_ondine_desc: "Inanimae de Agua y miembros del Imperio de las Lágrimas." 
  trait_paroseme: "Paroseme"
  trait_paroseme_desc: "Inanimae de Aire y miembros del Imperio de los Cielos." 
  trait_solimond: "Solimond"
  trait_solimond_desc: "Inanimae de Fuego y antiguos miembros del Imperio de las Llamas." 
  trait_mannikin: "Maniquí"
  trait_mannikin_desc: "Inanimae de elementos con forma humana y miembros del Imperio de las Muñecas." 
