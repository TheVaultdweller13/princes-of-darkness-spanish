 trait_spirit_mouse: "Espíritu de Ratón"
 trait_spirit_mouse_desc: "$pact_tooltip$[GetModifier('spirit_mouse_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_chameleon: "Espíritu de Camaleón"
 trait_spirit_chameleon_desc: "$pact_tooltip$[GetModifier('spirit_chameleon_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_raccoon: "Espíritu de Mapache"
 trait_spirit_raccoon_desc: "$pact_tooltip$[GetModifier('spirit_raccoon_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_crow: "Espíritu de Cuervo"
 trait_spirit_crow_desc: "$pact_tooltip$[GetModifier('spirit_crow_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_monkey: "Espíritu de Mono"
 trait_spirit_monkey_desc: "$pact_tooltip$[GetModifier('spirit_monkey_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_toad: "Espíritu de Sapo"
 trait_spirit_toad_desc: "$pact_tooltip$[GetModifier('spirit_toad_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_tree: "Espíritu de Árbol"
 trait_spirit_tree_desc: "$pact_tooltip$[GetModifier('spirit_tree_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"


 trait_spirit_innocent: "Inocente"
 trait_spirit_innocent_desc: "$pact_tooltip$[GetModifier('spirit_innocent_pact_modifier').GetNameWithTooltip]\n\nUna criatura nacida de las pesadillas de los [GetTrait('mokole').GetName(GetNullCharacter)]. Estos espíritus deformes son agresivos con todos los $glossary_fera$, excepto con los Mokolé, a quienes cazan activamente presos de un Frenesí demente."
 trait_spirit_drattosi: "Drattosi"
 trait_spirit_drattosi_desc: "$pact_tooltip$[GetModifier('spirit_drattosi_pact_modifier').GetNameWithTooltip]\n\nLos Drattosi son depredadores esquivos que cazan a cualquiera lo bastante necio como para caer en sus trampas. Son inteligentes y pueden comunicarse, pero su objetivo principal es consumir la energía de otros."
 trait_spirit_ooralath: "Ooralath"
 trait_spirit_ooralath_desc: "$pact_tooltip$[GetModifier('spirit_ooralath_pact_modifier').GetNameWithTooltip]\n\nLos Ooralath fueron antaño siervos de la Tejedora. Ahora vagan por las tierras baldías de la Umbra destruyendo cualquier entidad que no pertenezca al Wyrm que encuentren."
 trait_spirit_nocturna: "Nocturna"
 trait_spirit_nocturna_desc: "$pact_tooltip$[GetModifier('spirit_nocturna_pact_modifier').GetNameWithTooltip]\n\nLa Nocturna, o Bruja Nocturna, es la deformadora de esperanzas y sueños. Busca a los durmientes y retuerce sus sueños hasta convertirlos en siniestras pesadillas."
 trait_spirit_raptor: "Raptor"
 trait_spirit_raptor_desc: "$pact_tooltip$[GetModifier('spirit_raptor_pact_modifier').GetNameWithTooltip]\n\nEl Raptor se alimenta del deseo sexual, no de la atracción y el afecto normales, sino de la desesperación y la conquista."
 trait_spirit_harpy: "Arpía"
 trait_spirit_harpy_desc: "$pact_tooltip$[GetModifier('spirit_harpy_pact_modifier').GetNameWithTooltip]\n\nTalladas a partir de la esencia de espíritus de Halcón capturados, las Harpías son terrores del cielo. Este Bane disfruta robando posesiones y colocándolas en otro lugar para sembrar el caos en las comunidades."
 trait_spirit_rotwalker: "Caminante de la Podredumbre"
 trait_spirit_rotwalker_desc: "$pact_tooltip$[GetModifier('spirit_rotwalker_pact_modifier').GetNameWithTooltip]\n\nLos Caminantes de la Podredumbre son espíritus de la decadencia: no de la muerte, sino de la corrupción que la sigue; no de los finales, sino de las conclusiones sin resolver que se dejan pudrir."

 trait_spirit_seeder: "Sembrador"
 trait_spirit_seeder_desc: "Los Sembradores son Banes extremadamente crueles que viajan solos. Su propósito es crear Fomori por la fuerza."
 trait_spirit_dreammaker: "Forjador de Sueños"
 trait_spirit_dreammaker_desc: "Los Forjadores de Sueños existen para corromper a los amargados y furiosos, concediéndoles sus deseos y ayudando a quienes asisten a alcanzar el poder."
 trait_spirit_nihilach: "Nihilach"
 trait_spirit_nihilach_desc: "Los Nihilach son los Banes del Olvido, la aniquilación que aguarda más allá del ansia del Wyrm. Algunos creen que son espíritus del propio Apocalipsis."
 trait_spirit_shatteredhart: "Ciervo Destrozado"
 trait_spirit_shatteredhart_desc: "Tallados a partir de la esencia de espíritus de Ciervo capturados, los Ciervos Destrozados hallan sustento en la agonía y la miseria. Dementes y violentos, los Ciervos merodean por sus cotos de caza, atacando cualquier cosa que ponga fin a la miseria en la que se recrean."

 trait_spirit_smog: "Bane Elemental del Smog"
 trait_spirit_smog_desc: "$pact_tooltip$[GetModifier('spirit_smog_pact_modifier').GetNameWithTooltip]\n\nUno de los cuatro Elementales del Wyrm corrompidos. Se cree que estos elementales de aire corrompidos están compuestos por las partes gaseosas del cuerpo del Wyrm y representan su razón e intelecto."
 trait_spirit_balefire: "Bane Elemental de Fuego Infernal"
 trait_spirit_balefire_desc: "$pact_tooltip$[GetModifier('spirit_balefire_pact_modifier').GetNameWithTooltip]\n\nUno de los cuatro Elementales del Wyrm corrompidos. Se cree que estos elementales de fuego corrompidos se formaron a partir de la sangre del Wyrm y representan su intuición y fuerza de voluntad."
 trait_spirit_sludge: "Bane Elemental de Cieno"
 trait_spirit_sludge_desc: "$pact_tooltip$[GetModifier('spirit_sludge_pact_modifier').GetNameWithTooltip]\n\nUno de los cuatro Elementales del Wyrm corrompidos. Se cree que estos elementales de tierra corrompidos están compuestos por las partes sólidas del cuerpo del Wyrm y representan sus percepciones y sensaciones físicas."
 trait_spirit_toxin: "Bane Elemental de Toxina"
 trait_spirit_toxin_desc: "$pact_tooltip$[GetModifier('spirit_toxin_pact_modifier').GetNameWithTooltip]\n\nUno de los cuatro Elementales del Wyrm corrompidos. Se cree que estos elementales de agua corrompidos se formaron a partir de los líquidos del cuerpo del Wyrm y representan sus emociones desenfrenadas."


 trait_spirit_werewolf: "Ancestro de Hombre Lobo"
 trait_spirit_werewolf_desc: "$pact_tooltip$[GetModifier('spirit_werewolf_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_bastet: "Ancestro de Bastet"
 trait_spirit_bastet_desc: "$pact_tooltip$[GetModifier('spirit_bastet_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"
 trait_spirit_mokole: "Ancestro de Mokolé"
 trait_spirit_mokole_desc: "$pact_tooltip$[GetModifier('spirit_mokole_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"

 trait_spirit_human_desc: "$pact_tooltip$[GetModifier('spirit_human_pact_modifier').GetNameWithTooltip]\n\n$trait_spirit_desc$"

 trait_faction: "Facción"
 trait_aspect: "Aspecto"
 trait_entomos_breed: "Raza"
 trait_clade: "Clado"
 trait_myrmidon: "Myrmidon"
 trait_myrmidon_desc: "Los soldados, exploradores, generales y espías de los Éntomos, los Myrmidon son la Facción orientada al combate de los Éntomos."
 trait_viskr: "Viskr"
 trait_viskr_desc: "Los sabios, jueces, ocultistas y psíquicos de los Éntomos, los Viskr son la Facción gobernante y especializada de los Éntomos."
 trait_wyrsta: "Wyrsta"
 trait_wyrsta_desc: "Los embaucadores, filósofos, disidentes y moldeadores de los Éntomos, los Wyrsta son los catalizadores del cambio dentro de los Éntomos."
 trait_succor: "Socorro"
 trait_succor_desc: "Los sanadores, terapeutas, consejeros y asesores de los Éntomos, los Socorro son una preciada Facción definida por la empatía y la comprensión."
 trait_tenere: "Tenere"
 trait_tenere_desc: "Los Ananasi alineados con la Tejedora, los Tenere poseen poderes y habilidades centrados en la memoria, el tiempo y el Gauntlet."
 trait_kumoti: "Kumoti"
 trait_kumoti_desc: "Los Ananasi alineados con el $glossary_wyld$, los Kumoti poseen dones regenerativos y de enfoque elemental, capaces de manejar el flujo como Dones."
 trait_hatar: "Hatar"
 trait_hatar_desc: "Los Ananasi alineados con el $glossary_wyrm$, los Hatar son infames seductores y manipuladores de la entropía, fermentando su sangre en veneno y golpeando al Wyrm desde dentro."
 trait_human_born: "Homínido"
 trait_human_born_desc: "Los Éntomos nacidos de humanos, los Éntomos Homínidos desorientan a los Espíritus y son los fera más competentes entre ellos. Los Éntomos Homínidos son el tipo menos común de Éntomos, debido al tiempo comparativamente largo que tardan en sufrir el Primer Cambio."
 trait_macro_born: "Macronacido"
 trait_macro_born_desc: "Los Éntomos nacidos de organismos más grandes dentro de sus Clados, los Macronacidos son poderosos titanes de su especie, que exhiben sus formas más grandes en pura gloria destructiva."
 trait_micro_born: "Micronacido"
 trait_micro_born_desc: "Los Éntomos nacidos de organismos más pequeños dentro de sus Clados, los Micronacidos son infiltrados evasivos y ágiles, dominando sus formas más pequeñas para estar en cualquier lugar y escapar de cualquier situación."
 trait_fera_born: "Manipulador"
 trait_fera_born_desc: "Los Éntomos nacidos entre Éntomos, en huevos incubados dentro de una criatura inteligente, los Manipuladores son maestros naturales de la Forma de Guerra, además de ser los mejores mediadores entre sus Colonias."
 trait_titan_born: "Titanonacido"
 trait_titan_born_desc: "La Estirpe más temida, los horripilantes Titanonacidos son los Monstruos de Ananasa, aterradores motores de extinción que invocan el Delirio en todos los no-Éntomos."

 trait_eshieho: "Eshieho"
 trait_eshieho_desc: "Los Hijos Mayores de C'et, los Eshieho son sus Maestros de la Construcción e Intermediarios, el cómodo término medio entre los C'etites con la forma del Cangrejo de Río."
 trait_mishaho: "Mishaho"
 trait_mishaho_desc: "Los Hijos Medianos de C'et, los Mishaho son sus Embajadores y Trabajadores, adoptando la versátil forma del Cangrejo para velar por la prosperidad de C'et."
 trait_bahaesh: "Bahaesh"
 trait_bahaesh_desc: "Los Hijos Menores de C'et, los Bahaesh Langosta son sus resistentes Campeones y Defensores Implacables, dominando sus enormes pinzas para aplastar a los enemigos de C'et."
 trait_ishihambi: "Ishihambi"
 trait_ishihambi_desc: "Los Señores Elegidos de las Razas Insecto, los Ishihambi son un Clado muy raro, habiendo fingido su muerte ante el resto del mundo para centrarse en su interminable guerra contra los Ka Luon y los Zigg'raugglur. Para ayudar en su incesante exploración de la [umbra|E], adoptan la forma de la noble Polilla."
 trait_iqhawe: "Iqhawe"
 trait_iqhawe_desc: "Los Campeones Elegidos de las Razas Insecto, los Iqhawe son sus caballeros de reluciente armadura, dominando un amplio abanico de Dones para plantar cara a cualquier cosa que amenace a la $glossary_weaver$. Como corresponde a sus Maestros de la Espada, los campeones de la Tejedora adoptan la Mantis como su Forma de Clado."
 trait_umakhi: "Umakhi"
 trait_umakhi_desc: "Los Constructores Elegidos de las Razas Insecto, los Umakhi son los arquitectos de las mayores obras del Imperio de las Sombras del pasado remoto, erigiendo monumentos perdurables a la gloria de la $glossary_weaver$. Para cumplir con este deber, adoptan la forma de la Termita para construir sus legados."
 trait_umlimi: "Umlimi"
 trait_umlimi_desc: "Los Saqueadores Elegidos de las Razas Insecto, los Umlimi son el Azote de cuanto se les opone, atacando en su dominada forma de enjambre y devorando todo a su paso. Como corresponde a heraldos de la hambruna, toman a las Langostas y otros Saltamontes como Parentela."
 trait_umbulali: "Umbulali"
 trait_umbulali_desc: "Los Verdugos Elegidos de las Razas Insecto, los Umbulali son los temibles asesinos consumidos por la ira de las Razas Insecto, adoptando la forma de la Avispa para reflejar mejor su fría furia al destruir a los enemigos de la $glossary_weaver$."
 trait_umhloli: "Umhloli"
 trait_umhloli_desc: "Los Soldados Elegidos de las Razas Insecto, los Umhloli son innumerables y adaptables, tan diversos como su Parentela Hormiga, para apoyar a sus primos en el enriquecimiento y protección de la $glossary_weaver$."
 trait_injiki: "Injiki"
 trait_injiki_desc: "Los Agricultores Elegidos de las Razas Insecto, los Injiki son célebres entre los Éntomos por su rica y preciada miel, dominando a su Parentela Abeja para producir una miel nutritiva con la que sostener y alimentar a los Imperios Éntomos."
 trait_kstyw: "Kstyw"
 trait_kstyw_desc: "La Raza Insecto más joven, exiliada hace mucho tiempo y borrada de los registros, los Kstyw son los Éntomos Escarabajo, fieramente introvertidos y resistentes, que prosperan gracias a la camaradería y la resistencia frente a las amenazas que los acosan."