l_spanish:

 trait_fera: "$glossary_fera$"

 TRAIT_FLAG_DESC_can_become_ancestor_spirit: "@spirit_icon!Puede convertirse en un [ancestor_spirit|E]"

 #Splats
 trait_werewolf: "Hombre lobo"
 trait_werewolf_desc: "Una criatura sobrenatural cambiaformas. Se llaman a sí mismos «Garou»."
 trait_track_werewolf: "Rango"
 trait_track_werewolf_desc: "#italic El Rango es una parte fundamental de la sociedad Garou, y la manifestación más plena de la naturaleza jerárquica de los hombres lobo.#!"
 trait_ajaba: "Ajaba"
 trait_ajaba_desc: "Los hombres-hiena son los guerreros de Gaia en África, un continente sin población de lobos. Aunque la Guerra de la Furia no llegó a África, los Ajaba fueron prácticamente destruidos por las luchas internas y su rivalidad con los Bastet."
 trait_track_ajaba: "Rango"
 trait_track_ajaba_desc: "#italic Los Ajaba siempre han reconocido la Astucia y la Ferocidad como formas de renombre, pero también valoran la Infamia, algo que preocupa a muchos de sus miembros por su impacto a largo plazo.#!"
 trait_ananasi: "Ananasi"
 trait_ananasi_desc: "Los hombres-araña no son hijos de Gaia, sino de la Reina Ananasa, un poderoso espíritu hijo de la $glossary_weaver$. Son considerados extraños e inquietantes por el resto de $glossary_fera$, y no sin razón: su forma animal es una horda de arañas reptantes, no poseen Furia, y alimentan sus poderes con sangre robada a los humanos. Su nombre proviene del embaucador/dios Anansi del África Occidental."
 trait_track_ananasi: "Rango"
 trait_track_ananasi_desc: "#italic Los Ananasi pueden ganar renombre en tres categorías, que corresponden a los tres miembros de la $glossary_triat$; intentan seguir las tres, sin importar su facción, para obtener una comprensión más profunda de la «Gran Telaraña» de la existencia. Las categorías son Astucia (por el $glossary_wyrm$), Obediencia (por la $glossary_weaver$) y Sabiduría (por el $glossary_wyld$).#!"
 trait_apis: "Apis"
 trait_apis_desc: "Hombres-uro, o «Toros Lunares», los Apis se encargaban del cultivo y la agricultura, y eran conocidos como los «Casamenteros de Gaia». Los Garou los llevaron a la extinción durante la Guerra de la Furia."
 trait_track_apis: "Rango"
 trait_track_apis_desc: "#italic Los Apis eran criaturas relativamente sociales que vivían en rebaños de entre seis y veinticuatro individuos. Un poderoso toro gobernaba cada rebaño y defendía su título contra todos los aspirantes. Este toro se encargaba de proteger al rebaño y liderarlo en la batalla.#!"
 trait_bastet: "Bastet"
 trait_bastet_desc: "Los hombres-gato tienen muchas tribus diferentes, como los Garou, aunque cada una reclama una especie distinta de gato salvaje. Están obsesionados con el conocimiento secreto y siempre lo persiguen y acaparan. Muchos son grandes magos, otros grandes guerreros, pero rara vez son animales de manada y por lo general trabajan solos. Algunas de sus tribus sufrieron mucho durante la Guerra de la Furia."
 trait_track_bastet: "Rango"
 trait_track_bastet_desc: "#italic Los Bastet reconocen una jerarquía. No denota autoridad absoluta como ocurriría entre los Garou, sino más bien deferencia cortés y reconocimiento de la experiencia. Los títulos Bastet siempre tienen un significado social más allá de su rango.#!"
 trait_camazotz: "Camazotz"
 trait_camazotz_desc: "Los Camazotz eran hombres-murciélago, los mensajeros nocturnos de Gaia en el hemisferio sur, contrapartes de los Corax."
 trait_track_camazotz: "Rango"
 trait_track_camazotz_desc: "#italic Los Camazotz eran una Estirpe muy social que vivía en enjambres igualitarios de entre una docena y un centenar de miembros. A menudo vivían en cavernas junto a su Parentela de murciélagos. Aunque propensos al secretismo, intentaban mantener relaciones amistosas y abiertas con el resto de $glossary_fera$.#!"
 trait_corax: "Corax"
 trait_corax_desc: "Los hombres-cuervo son los mensajeros, espías y exploradores de Gaia que patrullan los cielos, siempre atentos al peligro. Son unos charlatanes terribles y contarán lo que han visto a quien quiera escuchar. Escaparon de la persecución durante la Guerra de la Furia ayudando a los Garou, y mantienen las relaciones más cordiales con los hombres lobo de entre todos los $glossary_fera$."
 trait_track_corax: "Rango"
 trait_track_corax_desc: "#italic Los Corax ganan renombre como los Garou Ragabash, aunque tienden a favorecer su particular versión de la Sabiduría. La Gloria suele ser descuidada por los frágiles Corax.#!"
 trait_grondr: "Grondr"
 trait_grondr_desc: "Los hombres-jabalí se ubicaban en el norte de Europa. Su tarea era purificar la tierra; se les llamaba los aseadores de Gaia. Los Garou los llevaron a la extinción durante la Guerra de la Furia; sus espíritus ancestrales cayeron ante el $glossary_wyrm$ y se convirtieron en los monstruosos Cerdos Calavera."
 trait_track_grondr: "Rango"
 trait_track_grondr_desc: "#italic Los Grondr eran una estirpe activa y agresiva. Vivían en grupos similares a manadas llamados Piaras, cada una liderada por un rey o una reina que mantenía su título derrotando a todo aquel que le desafiara en combate ritual. Cada gobernante de una Piara era igual a los demás; no había jerarquía más allá de cada Piara individual.#!"
 trait_gurahl: "Gurahl"
 trait_gurahl_desc: "Los hombres-oso son los sanadores de Gaia, ligados a la Tierra con un vínculo más fuerte que cualquier otro $glossary_fera$. Muchos Garou creen que los Gurahl están extintos, exterminados durante la Guerra de la Furia cuando se negaron a revelar el secreto de devolver la vida a los muertos."
 trait_track_gurahl: "Rango"
 trait_track_gurahl_desc: "#italic Los Gurahl reconocen tres tipos de renombre: Honor, por la devoción y el respeto; Socorro, por actos de sanación, purificación o ayuda a otros; y Sabiduría, por restaurar, preservar o desvelar conocimiento, o alcanzar una comprensión más profunda de uno mismo.#!"
 trait_kitsune: "Kitsune"
 trait_kitsune_desc: "Los hombres-zorro son magos y políticos, que mantienen unida la sociedad de los $glossary_fera$ asiáticos. Únicos entre los Fera, los Kitsune solo se encuentran en las Cortes de la Bestia del Reino Medio, viviendo principalmente en China y Japón. Con la bendición de Luna, los Kitsune también actuaron como asesinos de las autoridades corruptas en la sociedad mortal, como magos de la corte y ladrones para proteger el Mandato Celestial."
 trait_track_kitsune: "Colas"
 trait_track_kitsune_desc: "#italic Todos los Kitsune comienzan con una cola. Gaia les concede una adicional cada vez que ascienden de rango. Los Kitsune con nueve colas han alcanzado la inmortalidad, y son respetados por su poder y virtud.#!"
 trait_mokole: "Mokolé"
 trait_mokole_desc: "Los hombres-saurio son la memoria de Gaia. Los descendientes de los Reyes Lagarto prehistóricos se han organizado en cuatro grandes «corrientes» basadas en torno a los cuatro ríos primigenios del mundo. Cuando la civilización humana caiga, los grandes reyes surgirán de las tierras baldías y gobernarán de nuevo."
 trait_track_mokole: "Rango"
 trait_track_mokole_desc: "#italic Los Mokolé usan el mismo sistema de Renombre que los Garou, venerando los Preceptos de Honor, Sabiduría y Gloria. El grado en que un Mokolé individual sigue cada precepto está determinado enteramente por su Auspicio.#!"
 trait_nagah: "Nagah"
 trait_nagah_desc: "Hombres-serpiente originarios de la India. La mayoría (si no todas) de las demás estirpes cambiantes los creen extintos, pero siguen muy presentes. Sirviendo como los «Jueces de Gaia», los Nagah desempeñan el papel de jueces silenciosos y verdugos ocultos para las Estirpes Cambiantes."
 trait_track_nagah: "Rango"
 trait_track_nagah_desc: "#italic Como los nidos son nómadas, los Nagah deben buscar a los Sesha para obtener renombre de ellos. El Sesha, tras escuchar las hazañas del nido, decide qué puntos de renombre se les conceden. Esto determina el rango y, a su vez, los dones que un Nagah aprenderá. El sistema de renombre usa Gloria, Honor y Sabiduría.#!"
 trait_nuwisha: "Nuwisha"
 trait_nuwisha_desc: "Los hombres-coyote son los maestros de Gaia, aunque como su tótem, el Viejo Coyote, prefieren enseñar exclusivamente mediante bromas. Gracias a una broma que le gastaron a Luna, ya no tienen Furia, aunque poseen una afinidad más estrecha con la [umbra|E] que cualquier otro $glossary_fera$."
 trait_track_nuwisha: "Rango"
 trait_track_nuwisha_desc: "#italic A diferencia de la mayoría de $glossary_fera$, que alcanzan el Rango mediante el honor y el favor de su Tribu, los Nuwisha ganan Renombre a través de la enseñanza. En lugar de Honor, tienen Humor, y cuanto más graciosos demuestran ser ante su deidad, una forma del Coyote encarnado, más Renombre obtienen.#!"
 trait_ratkin: "Ratkin"
 trait_ratkin_desc: "Los hombres-rata antaño velaban por la humanidad, evitando que su número creciera demasiado. Sin embargo, los Garou usurparon ese papel, y los Ratkin los han odiado desde entonces. Luchan firmemente por el $glossary_wyld$ y aprovechan cualquier oportunidad para socavar la tecnología."
 trait_track_ratkin: "Rango"
 trait_track_ratkin_desc: "#italic Las colonias Ratkin tienen una estricta jerarquía interna. Un Rey Rata gobierna la colonia, asistido por grupos de cortesanos, normalmente todos Ratkin rodens. Por debajo de los cortesanos, los hombres-rata rodens tienen prioridad.#!"
 trait_rokea: "Rokea"
 trait_rokea_desc: "Incluso el mar tiene sus protectores. Los hombres-tiburón patrullan las profundidades del mar y rara vez son vistos por los habitantes de tierra firme."
 trait_track_rokea: "Rango"
 trait_track_rokea_desc: "#italic Los Rokea aceptan tres formas de Renombre: Valor, que hace referencia a la destreza de combate y el coraje de un hombre-tiburón en defensa de una Gruta; Armonía, que significa la capacidad de un hombre-tiburón para aceptar su lugar en el mundo y actuar en consonancia con él, e Innovación, que se otorga a los hombres-tiburón que, mediante nuevas ideas, ayudan a la raza a defender el Mar y a combatir la prole de Qyrl.#!"
 trait_entomos: "Éntomos"
 trait_entomos_desc: "Un gran grupo de $glossary_fera$ creado indirectamente por la $glossary_weaver$, los Éntomos engloban a los Ananasi, las Razas Insecto y los C'etites. Todos son nietos de la Tejedora, con un anhelo innato hacia los principios de la Tejedora: Fe, Ciencia y Dogma."
 trait_track_entomos: "Rango"
 trait_track_entomos_desc: "#italic El Rango es una forma esencial en que los Éntomos se organizan, estructurándose dentro de jerarquías de experiencia y habilidad para dirigir su sociedad.#!"



 #Extra splat descs
 trait_hakken: "Hakken"
 trait_hakken_desc: "Los hombres lobo de Japón, que defienden las filosofías del bushidō."

 trait_mokole_mbembe: "Mokolé-mbembe"
 trait_mokole_mbembe_desc: "La Corriente de los Luchadores, que tradicionalmente ha merodeado por los pantanos y vías fluviales de África y las Américas. Nombrados así por el progenitor de su especie, son con diferencia la corriente más numerosa. De las cuatro corrientes, sufrieron más que ninguna otra en las Guerras de la Furia, un crimen que siempre será recordado."
 trait_gumagan: "Gumagan"
 trait_gumagan_desc: "Conocidos como la Corriente de los Precursores, son muy respetados por otros Mokolé por su conocimiento del mundo espiritual, en particular el Tiempo del Sueño. Los Gumagan se encuentran normalmente lejos del agua, y algunos pasan toda su vida en los profundos desiertos de Australia."
 trait_makara: "Makara"
 trait_makara_desc: "El subcontinente indio sirve como zona de origen de los Makara, la Corriente del Pueblo. La política, la religión y el misticismo humanos de la India han influido enormemente en esta corriente. Los Makara usan auspicios Estacionales en lugar de los auspicios Solares de sus primos."
 trait_zhong_lung: "Zhong Lung"
 trait_zhong_lung_desc: "Trabajando junto a las demás Estirpes Cambiantes asiáticas, los Zhong Lung son conocidos como la Corriente de los Filósofos. Reconocen cuatro auspicios estacionales que determinan su papel en la sociedad de los dragones y en las Cortes de la Bestia."



 trait_kumo: "Kumo"
 trait_kumo_desc: "Los hombres-araña que han caído bajo el yugo del $glossary_wyrm$."
 trait_tengu: "Tengu"
 trait_tengu_desc: "Los hombres-cuervo del Lejano Oriente, que sirven como exploradores y heraldos de las Cortes de la Bestia."
 trait_okuma: "Okuma"
 trait_okuma_desc: "Los Okuma eran una tribu de Gurahl que vivía en el sudeste asiático, incluyendo el norte de la India y hasta tan al este como Japón. Su Parentela animal incluía osos malayos, osos lunares y pandas gigantes. A diferencia de otras tribus Gurahl, que veneran a Gaia como su madre y a Luna como la fuente de sus poderes de cambio de forma, los Okuma también tenían una relación especial con Helios. El pelaje de cada Okuma estaba marcado con manchas de colores brillantes."
 trait_nezumi: "Nezumi"
 trait_nezumi_desc: "Los hombres-rata de Asia, que libran una Guerra Silenciosa contra la humanidad."
 trait_same_bito: "Same-Bito"
 trait_same_bito_desc: "Los hombres-tiburón, que se consideran mucho más refinados que los Rokea."
 trait_ozuzo: "Ozuzo"
 trait_ozuzo_desc: "Los Ozuzo son Ajaba que han caído ante el $glossary_wyrm$."
 trait_histpah: "Histpah"
 trait_histpah_desc: "Los Histpah son los Reyes Mentirosos, Bastet corrompidos por el $glossary_wyrm$."
 trait_buzzards: "Buitres"
 trait_buzzards_desc: "Los Buitres son los Hijos Perdidos, Corax corrompidos por el $glossary_wyrm$."
 trait_purgers: "Purgadores"
 trait_purgers_desc: "Los Purgadores son Gurahl caídos."
 trait_nokhomi: "Nokhomi"
 trait_nokhomi_desc: "Los Nokhomi, también llamados las Sonrisas Amargas, son los Nuwisha caídos."
 trait_mad_destroyers: "Destructores Dementes"
 trait_mad_destroyers_desc: "Los Destructores Dementes son los Ratkin caídos."
 trait_balefire_sharks: "Tiburones de Fuego Infernal"
 trait_balefire_sharks_desc: "Los Tiburones de Fuego Infernal son Rokea corrompidos por el $glossary_wyrm$."
 trait_xibalan: "Xibalan"
 trait_xibalan_desc: "Los Xibalan eran Camazotz que se habían entregado al $glossary_wyrm$ a través del aspecto corrompido de su patrón, Murciélago."
 trait_skull_pig: "Cerdo Calavera"
 trait_skull_pig_desc: "Los Cerdos Calavera son un tipo de criatura asociada al $glossary_wyrm$, creados a partir de Parentela Grondr que se puso a su servicio para sobrevivir a la Guerra de la Furia."


 #Breeds
 trait_breed: "Raza"
 trait_homid_born: "Homínido"
 trait_homid_born_desc: "Los Homínidos son una raza de $glossary_fera$ que nacieron y se criaron como humanos, que es su forma natural."
 trait_kojin: "Kojin"
 trait_kojin_desc: "Los Kojin son una raza de Kitsune que nacieron y se criaron como humanos, que es su forma natural."
 trait_balaram: "Balaram"
 trait_balaram_desc: "Los Balaram son una raza de Nagah que nacieron y se criaron como humanos, que es su forma natural."
 trait_beast_born: "Bestial"
 trait_beast_born_desc: "Los Bestiales son una raza de $glossary_fera$ que nacieron y se criaron como animales, que es su forma natural."
 trait_lupus_born: "Lupus"
 trait_lupus_born_desc: "Los Lupus son una raza de Garou que nacieron y se criaron como lobos, que es su forma natural."
 trait_hyaena_born: "Hiena"
 trait_hyaena_born_desc: "Las Hienas son una raza de Ajaba que nacieron y se criaron como hienas, que es su forma natural."
 trait_bos_born: "Bóvido"
 trait_bos_born_desc: "Los Bóvidos son una raza de Apis que nacieron y se criaron como toros, que es su forma natural."
 trait_feline_born: "Felino"
 trait_feline_born_desc: "Los Felinos son una raza de Bastet que nacieron y se criaron como grandes felinos, que es su forma natural."
 trait_chiroptera_born: "Quiróptero"
 trait_chiroptera_born_desc: "Los Quirópteros son una raza de Camazotz que nacieron y se criaron como murciélagos, que es su forma natural."
 trait_corvid_born: "Córvido"
 trait_corvid_born_desc: "Los Córvidos son una raza de Corax que nacieron y se criaron como cuervos, que es su forma natural."
 trait_scrofa_born: "Suido"
 trait_scrofa_born_desc: "Los Suidos son una raza de Grondr que nacieron y se criaron como jabalíes, que es su forma natural."
 trait_ursine_born: "Úrsido"
 trait_ursine_born_desc: "Los Úrsidos son una raza de Gurahl que nacieron y se criaron como osos, que es su forma natural."
 trait_roko_born: "Roko"
 trait_roko_born_desc: "Los Roko son una raza de Kitsune que nacieron y se criaron como zorros, que es su forma natural."
 trait_suchid_born: "Suchid"
 trait_suchid_born_desc: "Los Suchid son una raza de Mokolé que nacieron y se criaron como reptiles, que es su forma natural."
 trait_vasuki_born: "Vasuki"
 trait_vasuki_born_desc: "Los Vasuki son una raza de Nagah que nacieron y se criaron como serpientes, que es su forma natural."
 trait_latrani_born: "Latrani"
 trait_latrani_born_desc: "Los Latrani son una raza de Nuwisha que nacieron y se criaron como coyotes, que es su forma natural."
 trait_rodens_born: "Rodens"
 trait_rodens_born_desc: "Los Rodens son una raza de Ratkin que nacieron y se criaron como ratas, que es su forma natural."
 trait_squamus_born: "Squamus"
 trait_squamus_born_desc: "Los Squamus son una raza de Rokea que nacieron y se criaron como tiburones, que es su forma natural."


 #Auspices
 trait_lunar_auspice: "Auspicio"
 trait_ahroun: "Ahroun"
 trait_ahroun_desc: "Uno de los cinco Auspicios bajo los que puede nacer un Garou. La Luna Llena convierte al Ahroun en el arma viviente de Gaia. Son el guerrero entre una raza de guerreros, el campeón de un pueblo marcial. Siempre dispuestos a matar, y a morir si es necesario."
 trait_galliard: "Galliard"
 trait_galliard_desc: "Uno de los cinco Auspicios bajo los que puede nacer un Garou. Representado por la Luna Gibosa, el Galliard canta el alma del Garou. Son la voz del Pueblo, que los llama a la batalla y los inspira a la grandeza en la vida y en la muerte. También son los guardianes de las tradiciones, portando el saber de las tribus desde sus mismos orígenes."
 trait_philodox: "Philodox"
 trait_philodox_desc: "Uno de los cinco Auspicios bajo los que puede nacer un Garou. La media luna significa equilibrio y dualidad; un Garou nacido bajo su influencia suele actuar como consejero, mediador y guardián de la ley de su manada."
 trait_theurge: "Theurge"
 trait_theurge_desc: "Uno de los cinco Auspicios bajo los que puede nacer un Garou. La luna creciente en forma de hoz concede el don de la percepción. Los Theurge son los místicos de los Garou, más cercanos que ningún otro a la [umbra|E] y sus habitantes."
 trait_ragabash: "Ragabash"
 trait_ragabash_desc: "Uno de los cinco Auspicios bajo los que puede nacer un Garou. Quien nace durante la Luna Nueva actúa como los embaucadores míticos, el bufón que alterna la necedad y la sabiduría. Desempeña el papel del contrario, cuestionando la tradición para hallar el camino más sabio."
 
 trait_dawn: "Alba"
 trait_dawn_female_desc: "Uno de los dos Aspectos bajo los que puede nacer un Ajaba. Similares a los Ahroun Garou, las Alba hembras son guerreras."
 trait_dawn_male_desc: "Uno de los dos Aspectos bajo los que puede nacer un Ajaba. Similares a los Galliard Garou, los Alba machos son narradores."
 trait_dusk: "Ocaso"
 trait_dusk_female_desc: "Uno de los dos Aspectos bajo los que puede nacer un Ajaba. Una versión más violenta de los Ragabash, las Ocaso hembras son asesinas."
 trait_dusk_male_desc: "Uno de los dos Aspectos bajo los que puede nacer un Ajaba. Como Theurge muy talentosos, los Ocaso machos son místicos."
 
 trait_uzmati: "Uzmati"
 trait_uzmati_desc: "Uno de los cinco Auspicios por los que puede progresar un Gurahl a lo largo de su vida. La Luna Llena convierte al Uzmati en el arma viviente de Gaia. Son el guerrero entre una raza de guerreros, el campeón de un pueblo marcial. Siempre dispuestos a matar, y a morir si es necesario."
 trait_kojubat: "Kojubat"
 trait_kojubat_desc: "Uno de los cinco Auspicios por los que puede progresar un Gurahl a lo largo de su vida. Representado por la Luna Gibosa, el Kojubat canta el alma del Gurahl. Son la voz del Pueblo, que los llama a la batalla y los inspira a la grandeza en la vida y en la muerte. También son los guardianes de las tradiciones, portando el saber de las tribus desde sus mismos orígenes."
 trait_rishi: "Rishi"
 trait_rishi_desc: "Uno de los cinco Auspicios por los que puede progresar un Gurahl a lo largo de su vida. La media luna significa equilibrio y dualidad; un Gurahl bajo su influencia suele actuar como consejero, mediador y guardián de la ley de su manada."
 trait_kieh: "Kieh"
 trait_kieh_desc: "Uno de los cinco Auspicios por los que puede progresar un Gurahl a lo largo de su vida. La luna creciente en forma de hoz concede el don de la percepción. Los Theurge son los místicos de los Gurahl, más cercanos que ningún otro a la [umbra|E] y sus habitantes."
 trait_arcas: "Arcas"
 trait_arcas_desc: "Uno de los cinco Auspicios por los que puede progresar un Gurahl a lo largo de su vida. Quien nace durante la Luna Nueva actúa como los embaucadores míticos, el bufón que alterna la necedad y la sabiduría. Desempeña el papel del contrario, cuestionando la tradición para hallar el camino más sabio."
 
 trait_warriors: "Guerreros"
 trait_warriors_desc: "Como su nombre indica, luchadores y asesinos, la primera línea de combate, muy similares a los Ahroun de los Garou. También conocidos como «Esclavos de la Hoja»."
 trait_bards: "Bardos"
 trait_bards_desc: "Los Bardos son un Aspecto perdido de la sociedad de los hombres-rata. Conocidos coloquialmente como «Portavoces», actuaban como pacificadores de la raza: intermediarios entre los Ratkin y otras razas, recopilando leyendas para añadirlas a su Memoria de Sangre colectiva. Emisarios ante los Septos Garou en los primeros días del mundo, fueron los primeros en morir cuando su raza fue traicionada."
 trait_knife_skulkers: "Acechadores del Cuchillo"
 trait_knife_skulkers_desc: "Asesinos honrados de los Ratkin que solo trabajan por contrato. También actúan como jueces y mediadores, muy similares a un Philodox."
 trait_shadow_seers: "Videntes de las Sombras"
 trait_shadow_seers_desc: "Chamanes y guías espirituales, muy similares a un Theurge."
 trait_tunnel_runners: "Corredores de Túneles"
 trait_tunnel_runners_desc: "Exploradores y espías errantes que conectan las Madrigueras Ratkin de todo el mundo. Similares a los Ragabash."
 
 trait_pryio: "Pryio"
 trait_pryio_twilight: "Crepúsculo"
 trait_pryio_twilight_desc: "También conocido como «Favor Lunar», los Bastet determinan su lugar y cómo el gato afronta la vida y gestiona los desafíos que se le presentan a través del Pryio. Aunque suele determinarse por el momento del día en que la Bastet sufrió su Primer Cambio, el Pryio puede cambiar si la Bastet atraviesa un cambio vital severo. Los Bastet del Crepúsculo son cuestionadores y buscadores; suelen ser detectives, abogados, espías o místicos."
 trait_pryio_daylight: "Día"
 trait_pryio_daylight_desc: "También conocido como «Favor Lunar», los Bastet determinan su lugar y cómo el gato afronta la vida y gestiona los desafíos que se le presentan a través del Pryio. Aunque suele determinarse por el momento del día en que la Bastet sufrió su Primer Cambio, el Pryio puede cambiar si la Bastet atraviesa un cambio vital severo. Los Bastet del Día son abiertos y directos; suelen ser diplomáticos, guerreros, legisladores y protectores."
 trait_pryio_night: "la Noche"
 trait_pryio_night_desc: "También conocido como «Favor Lunar», los Bastet determinan su lugar y cómo el gato afronta la vida y gestiona los desafíos que se le presentan a través del Pryio. Aunque suele determinarse por el momento del día en que la Bastet sufrió su Primer Cambio, el Pryio puede cambiar si la Bastet atraviesa un cambio vital severo. Los Bastet de la Noche suelen ser retraídos y solitarios; tienden a ser asesinos, eruditos, científicos y practicantes de las artes oscuras."
 




 
 trait_solar_auspice: "Auspicio solar"
 trait_rising_sun: "Sol naciente"
 trait_rising_sun_desc: "Entre el enrojecimiento del cielo oriental y el mediodía, la luz del sol golpea los cielos. Los Mokolé nacidos en este momento del día destacan como soldados, cazadores, exploradores y buscadores."
 trait_noonday_sun: "Sol de Mediodía"
 trait_noonday_sun_desc: "Al mediodía, el sol reina supremo sobre la Tierra, viéndolo todo. La mayoría de los nacidos bajo este auspicio se convierten en jueces, agentes de la ley o guardias que patrullan las áreas cercanas a los revolcaderos."
 trait_setting_sun: "Sol Poniente"
 trait_setting_sun_desc: "Mientras el sol se pone, los sabios se protegen del mal oculto en la creciente oscuridad. Muchos se convierten en guardias, enfermeros, sanadores o cuidadores."
 trait_midnight_sun: "Sol de Medianoche"
 trait_midnight_sun_desc: "Cuando las criaturas del sol nacen de noche, ocurren sucesos extraños y contradictorios. Atraídos por la oscuridad, aun así arden con la luz de Helios. Muchos actúan como poetas, bufones, artistas, creadores de mitos o guías de los muertos."
 trait_shrouded_sun: "Sol Velado"
 trait_shrouded_sun_desc: "Cuando el sol se oscurece, fuerzas invisibles conspiran contra quienes viven en la luz. La mayoría se convierten en místicos, maestros del saber espiritual o eruditos del conocimiento secreto."
 trait_decorated_sun: "Sol Engalanado"
 trait_decorated_sun_desc: "Cuando la luz se concentra, el sol queda rodeado por un halo. Se consideran a sí mismos organizadores trabajadores, coordinadores o casamenteros."
 trait_eclipsed_sun: "Sol Eclipsado"
 trait_eclipsed_sun_desc: "En momentos de asombro astronómico, pueden ocurrir sucesos fantásticos. Los más raros de todos los Mokolé nacen durante un eclipse solar. Son los sacerdotes-gobernantes de la sociedad Mokolé; todos los hombres-saurio se someten a los Soles Eclipsados."

 trait_vasanta: "Vasanta"
 trait_vasanta_desc: "El auspicio de la primavera y los guerreros de los Mokolé de la India. También son viajeros y siempre están deseosos de escuchar novedades."

 trait_grisma: "Grisma"
 trait_grisma_desc: "El auspicio del verano y los jueces de los Makara. Se espera de ellos que busquen la verdad y la justicia. Esto puede ser un deber riguroso en una sociedad nacida de firmes creencias en el deber según la casta y el karma."

 trait_zarad: "Zarad"
 trait_zarad_desc: "El auspicio del otoño es considerado el de los místicos y espiritualistas. Aquellos cuyos orígenes les impiden ejercer deberes sacerdotales a menudo se convierten en bhagats (los divinos), que intentan fusionar su vida diaria con los rituales de la religión."

 trait_hemanta: "Hemanta"
 trait_hemanta_desc: "El auspicio del invierno son los embaucadores y pícaros. Se espera que sean astutos, pero a menudo se les atribuye un comportamiento frívolo."

 trait_tung_chun: "Tung Chun"
 trait_tung_chun_desc: "Son los guerreros y amantes, nacidos en primavera. Su color es el azul y el verde, y el viento del este sopla sobre ellos."

 trait_nam_hsia: "Nam Hsia"
 trait_nam_hsia_desc: "Nacidos en verano, son los jueces y legisladores. Cuentan con el favor del viento del sur y su calidez. Su color es el amarillo imperial."

 trait_sai_chau: "Sai Chau"
 trait_sai_chau_desc: "Aquellos cuyo color es el blanco mortecino nacen en otoño. Son los videntes y eruditos entre su ya erudito pueblo. El Viento del Oeste de la Reina Madre sopla sobre ellos."

 trait_pei_tung: "Pei Tung"
 trait_pei_tung_desc: "Son los bufones y embaucadores. Nacidos en invierno, son advertidos por el viento del norte, y son contradictorios y aman la paradoja. Su color es el negro, el «negro de la luz del día», como dicen."










 trait_path: "Senda"
 trait_eji: "Eji"
 trait_eji_desc: "El Camino del Guerrero, alineado con la Lava, a través de la Tierra y el Fuego."
 trait_doshi: "Doshi"
 trait_doshi_desc: "El Camino del Hechicero, alineado con el Rayo, a través del Aire y el Fuego."
 trait_gukutsushi: "Gukutsushi"
 trait_gukutsushi_desc: "El Camino del Ilusionista, alineado con la Niebla, a través del Agua y el Aire."
 trait_kataribe: "Kataribe"
 trait_kataribe_desc: "El Camino del Narrador, alineado con la Arcilla, a través de la Tierra y el Agua."



 
 trait_seasonal_auspice: "Auspicio estacional"
 trait_kamakshi: "Kamakshi"
 trait_kamakshi_desc: "Primavera: bendecidos por las fuerzas de la vida y la renovación, su elemento es la tierra."
 trait_kartikeya: "Kartikeya"
 trait_kartikeya_desc: "Verano: vigorosos y fieles, su energía impulsa las mayores pasiones que se pueden hallar entre el pueblo serpiente. Su elemento es el fuego."
 trait_kamsa: "Kamsa"
 trait_kamsa_desc: "Otoño: la mente del objetivo es su pasión y su fuerte. Su elemento es el aire."
 trait_kali: "Kali"
 trait_kali_desc: "Invierno: su sangre es la más fría, su visión la más certera, y su dedicación a su causa no conoce límites. Su elemento es el agua."
 
 trait_freak: "Fenómeno"
 trait_engineers: "Ingenieros"
 trait_engineers_desc: "Científicos, inventores y manitas a los que les encanta trabajar con tecnología."
 trait_munchmausen: "Munchmausen"
 trait_munchmausen_desc: "Ratkin espadachines, todos y cada uno de ellos grandiosamente ilusos."
 trait_plague_lords: "Señores de la Plaga"
 trait_plague_lords_desc: "Maestros de la enfermedad y la corrupción."
 trait_twitchers: "Convulsos"
 trait_twitchers_desc: "Anarquistas entre anarquistas, los Convulsos son hombres de demolición dementes e impredecibles."
 
 trait_aquatic_auspice: "Auspicio del Agua"
 trait_brightwater: "Agua Brillante"
 trait_brightwater_desc: "Rokea nacidos durante días luminosos o lunas llenas. Los Agua Brillante son similares a los Ahroun Garou; son guerreros y héroes. Sin embargo, a menudo desean estar cerca de la superficie del mar."
 trait_dimwater: "Agua Tenue"
 trait_dimwater_desc: "Los Agua Tenue nacen durante días nublados o de noche bajo cualquier fase lunar excepto la llena o la nueva. La mayoría de los Rokea pertenecen a este auspicio. Son los jueces y líderes de la raza Rokea y crean los pocos Fetiches que los Rokea utilizan."
 trait_darkwater: "Agua Oscura"
 trait_darkwater_desc: "Llamados los «dementes» por sus semejantes, los Agua Oscura nacen bajo eclipses o la Luna Nueva. Son curiosos, innovadores, brillantes y audaces. Disfrutan sumergiéndose en las gélidas profundidades del mar o caminando en tierra para descubrir nuevos secretos."
 
 trait_lunisolar_auspice: "Auspicio Lunisolar"
 trait_lunar: "Lunar"
 trait_lunar_desc: "Nacidos de noche, estos Apis actuaban como los guerreros de la raza, protegiendo a sus protegidos de amenazas externas."
 trait_twilight: "Crepúsculo"
 trait_twilight_desc: "Nacidos al amanecer o al atardecer, estos Apis eran los más cercanos a los señoríos espirituales."
 trait_solar: "Solar"
 trait_solar_desc: "Nacidos de día, estos Apis trabajaban más estrechamente con los humanos y otras razas."
 
 trait_gnosis: "Gnosis"
 trait_gnosis_desc: "La Gnosis es una energía espiritual y mágica. Algunos mortales con talento pueden manejarla. La Gnosis es un recurso renovable, pero menguante. Se puede recuperar en lugares sagrados, meditando o negociando con espíritus. Los lugares sagrados proporcionan Gnosis, pero si son profanados, pueden corromper a quien la posea, o simplemente puede que ya no quede disponible."
 trait_gnosis_kinfolk: "Gnosis de la Parentela"
 trait_gnosis_kinfolk_desc: "La Gnosis es una energía espiritual y mágica. Algunos miembros de la Parentela con talento pueden manejarla. La Gnosis es un recurso renovable, pero menguante. Se puede recuperar en lugares sagrados, meditando o negociando con espíritus. Los lugares sagrados proporcionan Gnosis, pero si son profanados, pueden corromper a quien la posea, o simplemente puede que ya no quede disponible."


 trait_abomination: "Abominación"
 trait_abomination_desc: "Abominación es un término usado para describir a un cambiaformas transformado en Vampiro. Huelga decir que estas criaturas son excepcionalmente raras, dado que casi todos los $glossary_fera$ son violentamente alérgicos al Vitae vampírico. Las Abominaciones son temidas tanto por Garou como por Vampiros. Son extremadamente poderosas y la mayoría enloquece rápidamente, volviéndose bestiales e incapaces de actuar de forma remotamente humana."
 trait_werewolf_abomination: "Abominación Garou"
 trait_gurahl_abomination: "Umfalla"
 trait_abomination_with_type: "Abominación [ROOT.Var('fera_type').Trait.GetNameNoTooltip(ROOT.Char.Self)]"

 trait_kinfolk: "Parentela"
 trait_kinfolk_desc: "La Parentela, a veces llamada Gallain o simplemente Kin, son aquellos humanos y animales salvajes emparentados con los $glossary_fera$ y que no son propensos al Delirio, pero que no son Fera propiamente dichos."
 trait_werewolf_kinfolk: "Parentela Garou"
 trait_werewolf_kinfolk_desc: "De sangre lobuna, un descendiente de los Garou."
 trait_kinfolk_with_type: "Parentela [ROOT.Var('fera_type').Trait.GetNameNoTooltip(ROOT.Char.Self)]"

 TRAIT_FLAG_DESC_is_spirit: "No puede sufrir daño físico sin poderes especiales"


 trait_spirit: "Espíritu"
 trait_spirit_desc: "Los Espíritus son entidades incorpóreas que se originan y habitualmente habitan en la [umbra|E]; por esa razón, algunos magos los llaman los «Umbrood»."
 trait_track_spirit: "Rango"
 trait_track_spirit_desc: "#italic El Rango de un Espíritu mide su poder espiritual. Los Espíritus más poderosos son más capaces de manifestar sus poderes en el mundo físico y ayudar a sus compañeros.#!"


