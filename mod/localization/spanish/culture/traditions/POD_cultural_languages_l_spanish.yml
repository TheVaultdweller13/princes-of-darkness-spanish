l_spanish:
 language_enochian_name: "Enoquiano"
 language_ghemalish_name: "Ghemalita"
 language_punic_name: "Púnico"
 language_ancient_egyptian_name: "Egipcio Antiguo"
 language_kaja_name: "Kaja"
 language_kaja_desc: "La antigua y extraordinariamente compleja escritura ideográfica de los [Glossary('Wan Xian','game_concept_kuei_jin_desc')]."
 language_domari_name: "Domari"
 language_spring_name: "Primavera"
 language_spring_desc: "La Corte de la Primavera habla una lengua tonal, un método de comunicación que depende tanto de la entonación y el tono de voz como de las palabras en sí. El idioma suena mucho a canto y tarareo, además de a palabras melifluas de sonido elegante. Por escrito, la lengua de la Corte de la Primavera se parece a espirales intrincadamente superpuestas y telarañas circulares sobre la página."
 language_summer_name: "Verano"
 language_summer_desc: "Los parientes del Verano se comunican en una lengua que tiene, con diferencia, el vocabulario más amplio de todos los idiomas humanos o feéricos; es famosa por tener varias palabras para casi cualquier objeto o concepto posible. Hablada, es un flujo de sílabas breves y cortantes pronunciadas con rapidez. Escrita, a primera vista se parece al lenguaje humano (en líneas horizontales), aunque basta una ojeada para ver que la lengua del Verano tiene cientos de letras y ninguna puntuación visible."
 language_autumn_name: "Otoño"
 language_autumn_desc: "Las hadas del Otoño poseen un lenguaje susurrado, puntuado e inflexionado con gestos de las manos. El estado de ánimo de quien habla se transmite en la velocidad y la agudeza de los movimientos, desde gestos calmados y lentos cuando está relajado o cansado hasta gestos cortantes y dentados cuando está enfadado; de hecho, es posible mantener conversaciones enteras sin pronunciar un sonido. Los propios susurros suenan como vientos impetuosos o suspiros largos y apenas vocalizados. Por escrito, el lenguaje aparece como tajos de líneas curvas de grosor variable."
 language_winter_name: "Invierno"
 language_winter_desc: "El lenguaje de la Corte del Invierno suena como una combinación de gruñidos, aullidos, bufidos y rugidos propios de animales. Una conversación escuchada al azar entre hadas del Invierno puede confundirse con toda facilidad con una pelea entre varios grandes depredadores, lo que da idea del extenso vocabulario de esta lengua. Por escrito, el lenguaje consiste en una enorme variedad de pictogramas, con muchos miles de palabras representadas cada una por un símbolo único."
 language_ancient_arcadian_name: "Arcadio Antiguo"
 language_ancient_arcadian_desc: "Un lenguaje escrito indescifrable parece ser un predecesor de los lenguajes de las Cortes Estacionales. Su elegante escritura está grabada en la pared de la Fortaleza de Cristal. Hasta ahora, ningún erudito ha sido capaz de dar sentido a la escritura. Puede contener secretos como el origen de los fae y su verdadero propósito en el mundo."
