 psyche_mummy_legacy_1_perk: "#flavor Con tantas vidas vividas al máximo llega la bendición, y la maldición, de saber mucho.#!"
 psyche_mummy_legacy_2_perk: "Desbloquea a [GetMaA('hoplites').GetName] y [GetMaA('companion_cavalry').GetName] como [men_at_arms|E].\n#flavor Los héroes de antaño respondieron una vez a nuestro llamado y lo harán de nuevo.#!"
 psyche_mummy_legacy_3_perk: "#flavor El peso de los siglos conlleva muchas responsabilidades, y uno debe ser capaz de alzarse para asumirlas.#!"
 psyche_mummy_legacy_4_perk: "#flavor El río Estigia es traicionero, pero los sabios aprenden de cada travesía que emprenden.#!"
 psyche_mummy_legacy_5_perk: "Desbloquea [GetActivityType('activity_chariot_race').GetName] si tienes el DLC correspondiente.\n#flavor Los juegos de antaño, sin importar cuánto hayan cambiado, conservan ese espíritu antiguo. Para nuestras almas antiguas, no podemos permitir que se desvanezcan.#!"
  
 pharaoh_mummy_legacy_track_name: "Faraón de Egipto"
 pharaoh_mummy_legacy_track_desc: "La tierra de las Momias fue también la tierra de los más grandes reyes, y su legado perdura para aquellos verdaderamente inmortales."
 pharaoh_mummy_legacy_1_name: "Legado de Cleopatra"
 pharaoh_mummy_legacy_2_name: "Legado de Ptolomeo"
 pharaoh_mummy_legacy_3_name: "Legado de Ramsés II"
 pharaoh_mummy_legacy_4_name: "Legado de Akenatón"
 pharaoh_mummy_legacy_5_name: "Legado de Keops"
 
 pharaoh_mummy_legacy_1_perk: "#flavor La gran reina casi derrocó un imperio naciente solo con su carisma.#!"
 pharaoh_mummy_legacy_2_perk: "#flavor Venido de lejos, Ptolomeo abrazó Egipto como si fuera su propia Tierra Natal.#!"
 pharaoh_mummy_legacy_3_perk: "#flavor El hijo de Ra comandó los ejércitos más grandes de Egipto y pocos fueron capaces de oponerse a su poderosa ambición.#!"
 pharaoh_mummy_legacy_4_perk: "#flavor Para bien o para mal, ningún Antiguo egipcio olvidará jamás a Akenatón, aquel que despreció a los dioses.#!"
 pharaoh_mummy_legacy_5_perk: "#flavor Al descansar para siempre en la Gran Pirámide de Guiza, Keops encontró su propia inmortalidad.#!"
 
 wutian_mummy_legacy_track_name: "Las cien escuelas de pensamiento"
 wutian_mummy_legacy_track_desc: "Las grandes mentes de China seguirán iluminando el mundo mucho después de su partida."
 wutian_mummy_legacy_1_name: "Sabiduría de Confucio"
 wutian_mummy_legacy_2_name: "Sabiduría de Sun Tzu"
 wutian_mummy_legacy_3_name: "Sabiduría de Kuei Ku Tzu"
 wutian_mummy_legacy_4_name: "Sabiduría de Mo Tzu"
 wutian_mummy_legacy_5_name: "Sabiduría de Lao Tzu"
 
 wutian_mummy_legacy_1_perk: "#flavor La sabiduría de Confucio nos enseña a respetar a nuestros mayores.#!"
 wutian_mummy_legacy_2_perk: "#flavor La mente militar de Sun Tzu continúa guiándonos hacia adelante.#!"
 wutian_mummy_legacy_3_perk: "#flavor Las habilidades flexibles de Kuei Ku Tzu nos permiten gestionar nuestras ejércitos con mayor eficacia.#!"
 wutian_mummy_legacy_4_perk: "#flavor Mo Tzu nos inspira a ser lo mejor de nosotros mismos.#!"
 wutian_mummy_legacy_5_perk: "#flavor Lao Tzu nos enseña a dejarnos llevar por la corriente.#!"
 
 mortuary_cult_mummy_legacy_track_name: "Culto mortuorio"
 mortuary_cult_mummy_legacy_track_desc: "El Culto mortuorio nutre el espíritu de los ancestros. Los sacerdotes realizan rituales diarios para su beneficio y reciben dones a cambio."
 mortuary_cult_mummy_legacy_1_name: "Danzante de Khener"
 mortuary_cult_mummy_legacy_2_name: "Sacerdote Wab"
 mortuary_cult_mummy_legacy_3_name: "Sacerdote Lector"
 mortuary_cult_mummy_legacy_4_name: "Sacerdote Sem"
 mortuary_cult_mummy_legacy_5_name: "Hem-Netjer"
 
 mortuary_cult_mummy_legacy_1_perk: "Tu [neteru|E] ganará [GetModifier('POD_neteru_legacy_1_modifier').GetNameWithTooltip].\n\n#flavor Los Danzantes de Khener servían a los dioses mediante la música y la danza. Estaban vinculados a Hathor, diosa de las mujeres y la fertilidad.#!"
 mortuary_cult_mummy_legacy_2_perk: "Tu [neteru|E] ganará un [GetModifier('POD_neteru_legacy_2_modifier').GetNameWithTooltip] mejorado.\n\n#flavor Los Puros son el tipo de sacerdote más común; se encargaban del mantenimiento diario del culto.#!"
 mortuary_cult_mummy_legacy_3_perk: "Tu [neteru|E] ganará un [GetModifier('POD_neteru_legacy_3_modifier').GetNameWithTooltip] mejorado.\n\n#flavor El Sacerdote Lector nutre el alma en el Duat recitando hechizos y haciendo ofrendas a los difuntos en la necrópolis.#!"
 mortuary_cult_mummy_legacy_4_perk: "Tu [neteru|E] ganará un [GetModifier('POD_neteru_legacy_4_modifier').GetNameWithTooltip] mejorado.\n\n#flavor Los Embalsamadores se esmeran en restaurar la integridad del cuerpo cuando momifican a los muertos.#!"
 mortuary_cult_mummy_legacy_5_perk: "Tu [neteru|E] ganará un [GetModifier('POD_neteru_legacy_5_modifier').GetNameWithTooltip] mejorado.\n\n#flavor El Sumo Sacerdote cuida del Ka de los difuntos, permitiendo su existencia continua en el Duat.#!"
 
