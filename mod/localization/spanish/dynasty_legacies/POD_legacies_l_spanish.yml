 pacts_legacy_2_perk: "La experiencia de [arcana_lifestyle|E] obtenida de [thralls|E] se multiplicará por #P 4#! en lugar de #N 3#!."
 pacts_legacy_3_name: "Intriga infernal"
 pacts_legacy_3_perk: "La experiencia de [arcana_lifestyle|E] obtenida de [thralls|E] se multiplicará por #P 5#! en lugar de #N 4#!."
 pacts_legacy_4_name: "Aura infernal"
 pacts_legacy_4_perk: "La experiencia de [arcana_lifestyle|E] obtenida de [thralls|E] se multiplicará por #P 6#! en lugar de #N 5#!."
 pacts_legacy_5_name: "Valentía infernal"
 pacts_legacy_5_perk: "La experiencia de [arcana_lifestyle|E] obtenida من [thralls|E] se multiplicará por #P 7#! en lugar de #N 6#!."
 
 seelie_romantic_legacy_track_name: "Legado romántico Seelie"
 seelie_romantic_legacy_track_desc: "Los Legados Románticos son las personalidades que los Kithain manifiestan en encuentros románticos, particularmente cuando se encuentran en la estilizada y formal danza del Amor Cortés."
 seelie_romantic_legacy_1_name: "Empático"
 seelie_romantic_legacy_1_perk: "#flavor Eres sumamente sensible a los estados de ánimo, deseos y anhelos de tu amante. Si ellos no son felices, tú tampoco lo eres.#!"
 seelie_romantic_legacy_2_name: "Amigo"
 seelie_romantic_legacy_2_perk: "Desbloquea el [GetScheme('befriend').GetTypeName] [scheme|E].\n#flavor El amor no es solo una emoción romántica. Si una relación no tiene respeto mutuo y amistad en su esencia, no es amor verdadero.#!"
 seelie_romantic_legacy_3_name: "Ingenuo"
 seelie_romantic_legacy_3_perk: "#flavor Algo ingenuo y con ojos de asombro, todavía ves solo el lado maravilloso y bueno del amor. La mayoría de las hadas suelen abandonar este legado a medida que envejecen, pero no siempre.#!"
 seelie_romantic_legacy_4_name: "Juglar"
 seelie_romantic_legacy_4_perk: "#flavor Te gusta mantener entretenidos a tus amantes (y a ti mismo). El amor es la mayor alegría y debe disfrutarse al máximo.#!"
 seelie_romantic_legacy_5_name: "Protectora"
 seelie_romantic_legacy_5_perk: "#flavor Tu amor es verdadero y deseas protegerlos de todos los males del mundo. Este Legado nace de nobles intenciones, pero puede resultar sofocante.#!"

 unseelie_romantic_legacy_track_name: "Legado romántico Unseelie"
 unseelie_romantic_legacy_track_desc: "Los Legados Románticos son las personalidades que los Kithain manifiestan en encuentros románticos, particularmente cuando se encuentran en la estilizada y formal danza del Amor Cortés."
 unseelie_romantic_legacy_1_name: "Competidor"
 unseelie_romantic_legacy_1_perk: "Tu amante más hábil te otorgará un modificador que otorga prestigio mensual.\n#flavor Eres un Olímpico del romance. Juzgas a los demás por la calidad de sus consortes y sabes que ellos te juzgan por los mismos estándares. Debes ser el mejor amante del mundo, ¿o qué sentido tiene?#!"
 unseelie_romantic_legacy_2_name: "Cínico"
 unseelie_romantic_legacy_2_perk: "#flavor Hastiado y cansado del mundo, a menudo continúas con tus propuestas románticas por hábito o por miedo a la soledad. Has bajado tus expectativas porque sabes que el «amor verdadero» solo se encuentra en los cuentos de hadas.#!"
 unseelie_romantic_legacy_3_name: "Mártir"
 unseelie_romantic_legacy_3_perk: "#flavor Trabajo tanto para que esta relación funcione, ¿y qué recibo a cambio? ¡Dolor! No esperaba que lo entendieras.#!"
 unseelie_romantic_legacy_4_name: "Jugador"
 unseelie_romantic_legacy_4_perk: "Cada [lover|E] añade: [GetModifier( 'POD_gamester_modifier' ).GetNameWithTooltip|L]. Esto es acumulativo.\n#flavor El amor es un gran juego, lleno de peligro y emoción. Puedes tener una pareja o muchas, pero el romance debe ser constantemente desafiante y dinámico.#!"
 unseelie_romantic_legacy_5_name: "Espía"
 unseelie_romantic_legacy_5_perk: "#flavor Los cotilleos y la intriga de la corte son tu sustento diario. Entre escalador social y engañador, solo te interesa estar bien informado sobre quién le hace qué a quién.#!"
 
 seelie_legacy_1_track_name: "Legado Seelie"
 seelie_legacy_1_track_desc: "Conocidos por la vitalidad de la primavera y el calor abrasador del verano, los seguidores de los Legados Seelie tienden a poner énfasis en los grupos y la comunidad."
 seelie_1_legacy_1_name: "Humanista"
 seelie_1_legacy_1_perk: "#flavor Prestas más atención a tu vida mortal que a tu vida de hada.#!"
 seelie_1_legacy_2_name: "Bromista"
 seelie_1_legacy_2_perk: "#flavor Te deleitas haciendo todo tipo de bromas y travesuras.#!"
 seelie_1_legacy_3_name: "Caminante"
 seelie_1_legacy_3_perk: "#flavor Vives el momento y actúas por impulso.#!"
 seelie_1_legacy_4_name: "Alcahuete"
 seelie_1_legacy_4_perk: "#flavor Vives para hacer felices a los demás.#!"
 seelie_1_legacy_5_name: "Trovador"
 seelie_1_legacy_5_perk: "Los poetas se vuelven más comunes en la Dinastía.\n#flavor El mundo es un lugar hermoso, y sientes esto —y todas las cosas— con más fuerza que los demás.#!"
 
 seelie_legacy_2_track_name: "Legado Seelie"
 seelie_legacy_2_track_desc: "Conocidos por la vitalidad de la primavera y el calor abrasador del verano, los seguidores de los Legados Seelie tienden a poner énfasis en los grupos y la comunidad."
 seelie_2_legacy_1_name: "Tábano"
 seelie_2_legacy_1_perk: "#flavor Mantienes a quienes ostentan el poder honestos señalando sus faltas.#!"
 seelie_2_legacy_2_name: "Dandi"
 seelie_2_legacy_2_perk: "#flavor Un escalador social de corazón, destacas en la etiqueta de la corte.#!"
 seelie_2_legacy_3_name: "Camarada"
 seelie_2_legacy_3_perk: "$PERK_CAN_SIGN_ALLIANCE$\n#flavor Valoras la amistad por encima de todo y te esfuerzas por demostrar que eres digno de la confianza de los demás.#!"
 seelie_2_legacy_4_name: "Cortesano"
 seelie_2_legacy_4_perk: "#flavor Lo único interesante de la vida es la interacción social.#!"
 seelie_2_legacy_5_name: "Regente"
 seelie_2_legacy_5_perk: "#flavor Eres la encarnación viviente del señorío, aquel elegido para hablar en nombre de la multitud.#!"
 
 seelie_legacy_3_track_name: "Legado Seelie"
 seelie_legacy_3_track_desc: "Conocidos por la vitalidad de la primavera y el calor abrasador del verano, los seguidores de los Legados Seelie tienden a poner énfasis en los grupos y la comunidad."
 seelie_3_legacy_1_name: "Campesino"
 seelie_3_legacy_1_perk: "#flavor Eres del tipo sólido y práctico que tiene una solución para cada problema.#!"
 seelie_3_legacy_2_name: "Artesano"
 seelie_3_legacy_2_perk: "#flavor La creación es la obra de tu vida.#!"
 seelie_3_legacy_3_name: "Aspirante"
 seelie_3_legacy_3_perk: "#flavor La vida es una experiencia de aprendizaje, y siempre te esfuerzas por mejorar.#!"
 seelie_3_legacy_4_name: "Sabio"
 seelie_3_legacy_4_perk: "Los místicos se vuelven más comunes en la Dinastía.\n#flavor Eres el consejero, el sabio, el maestro.#!"
 seelie_3_legacy_5_name: "Virtuoso"
 seelie_3_legacy_5_perk: "Selecciona un rasgo de estilo de vida para que sea más común en la Dinastía.\n#flavor Eres el maestro en el campo que hayas elegido, sea cual sea.#!"
 
 seelie_legacy_4_track_name: "Legado Seelie"
 seelie_legacy_4_track_desc: "Conocidos por la vitalidad de la primavera y el calor abrasador del verano, los seguidores de los Legados Seelie tienden a poner énfasis en los grupos y la comunidad."
 seelie_4_legacy_1_name: "Escudero"
 seelie_4_legacy_1_perk: "#flavor Vives para ayudar y apoyar a tu héroe actual en sus empresas.#!"
 seelie_4_legacy_2_name: "Caballero"
 seelie_4_legacy_2_perk: "#flavor Sigues los antiguos códigos de caballería y ayudas a quienes lo necesitan.#!"
 seelie_4_legacy_3_name: "Paladín"
 seelie_4_legacy_3_perk: "#flavor Eres un competidor; el atleta o héroe valiente y constante.#!"
 seelie_4_legacy_4_name: "Filántropo"
 seelie_4_legacy_4_perk: "#flavor Te esfuerzas por ayudar a los demás y realizar buenas acciones sin esperar recompensa alguna.#!"
 seelie_4_legacy_5_name: "Santo"
 seelie_4_legacy_5_perk: "#flavor Te esfuerzas por aliviar el dolor de los demás.#!"
 
 seelie_legacy_5_track_name: "Legado Seelie"
 seelie_legacy_5_track_desc: "Conocidos por la vitalidad de la primavera y el calor abrasador del verano, los seguidores de los Legados Seelie tienden a poner énfasis en los grupos y la comunidad."
 seelie_5_legacy_1_name: "Orquídea"
 seelie_5_legacy_1_perk: "#flavor Eres un inocente que se ha visto forzado a entrar en este mundo grande, vasto y peligroso.#!"
 seelie_5_legacy_2_name: "Pishogue"
 seelie_5_legacy_2_perk: "#flavor El mundo es para ti un lugar de infinito y pueril asombro.#!"
 seelie_5_legacy_3_name: "Estoico"
 seelie_5_legacy_3_perk: "#flavor Rara vez revelas tus emociones.#!"
 seelie_5_legacy_4_name: "Ermitaño"
 seelie_5_legacy_4_perk: "#flavor Prefieres tu propia compañía a la de los demás.#!"
 seelie_5_legacy_5_name: "Arcadia"
 seelie_5_legacy_5_perk: "#flavor Tu lado de hadas pesa mucho más que tu lado humano.#!"
 
 unseelie_legacy_1_track_name: "Legado Unseelie"
 unseelie_legacy_1_track_desc: "Tan colorido como una cosecha de otoño y tan caótico e aislado como una tormenta de hielo invernal, los seguidores de los Legados Unseelie tienden a ser individualistas apasionados."
 unseelie_1_legacy_1_name: "Cobarde"
 unseelie_1_legacy_1_perk: "#flavor Más vale cobarde vivo que héroe muerto.#!"
 unseelie_1_legacy_2_name: "Farsa"
 unseelie_1_legacy_2_perk: "#flavor Nada te satisface; eres gruñón, agrio y simplemente cascarrabias.#!"
 unseelie_1_legacy_3_name: "Miserable"
 unseelie_1_legacy_3_perk: "#flavor No tienes una imagen positiva de ti mismo y asumes que todos los demás te odian tanto como tú te odias a ti mismo.#!"
 unseelie_1_legacy_4_name: "Shade"
 unseelie_1_legacy_4_perk: "#flavor Eres un zombi humano, un sonámbulo sin emociones que ve el mundo como un espectáculo de horror interminable.#!"
 unseelie_1_legacy_5_name: "Necio"
 unseelie_1_legacy_5_perk: "#flavor No hay sentido en el mundo, así que actúas como un payaso.#!"
 
 unseelie_legacy_2_track_name: "Legado Unseelie"
 unseelie_legacy_2_track_desc: "Tan colorido como una cosecha de otoño y tan caótico e aislado como una tormenta de hielo invernal, los seguidores de los Legados Unseelie tienden a ser individualistas apasionados."
 unseelie_2_legacy_1_name: "Villano"
 unseelie_2_legacy_1_perk: "#flavor Grosero y maleducado, no tienes modales y te burlas de las convenciones.#!"
 unseelie_2_legacy_2_name: "Pícaro"
 unseelie_2_legacy_2_perk: "Permite el [raiding|E] de [counties|E] extranjeros para obtener botín.\n#flavor ¿Por qué trabajar para ganarse la vida cuando el mundo puede trabajar para ti?#!"
 unseelie_2_legacy_3_name: "Canalla"
 unseelie_2_legacy_3_perk: "#flavor Tientas a otros a explorar sus deseos más oscuros.#!"
 unseelie_2_legacy_4_name: "Bestia"
 unseelie_2_legacy_4_perk: "#flavor Conquistas a todo aquel que se te oponga.#!"
 unseelie_2_legacy_5_name: "Cabecilla"
 unseelie_2_legacy_5_perk: "#flavor Gobiernas tu organización con mano de hierro.#!"
 
 unseelie_legacy_3_track_name: "Legado Unseelie"
 unseelie_legacy_3_track_desc: "Tan colorido como una cosecha de otoño y tan caótico e aislado como una tormenta de hielo invernal, los seguidores de los Legados Unseelie tienden a ser individualistas apasionados."
 unseelie_3_legacy_1_name: "Petulante"
 unseelie_3_legacy_1_perk: "#flavor Eres una de las personas hermosas, los zares del estilo.#!"
 unseelie_3_legacy_2_name: "Pavo real"
 unseelie_3_legacy_2_perk: "#flavor Eres la persona más maravillosa del mundo y quieres que todo el mundo lo sepa.#!"
 unseelie_3_legacy_3_name: "Enigmático"
 unseelie_3_legacy_3_perk: "#flavor Estás enamorado de los secretos y nunca das una respuesta directa.#!"
 unseelie_3_legacy_4_name: "Vagabundo"
 unseelie_3_legacy_4_perk: "#flavor La sustancia es más importante que el estilo, así que actúas como un desaliñado para mostrar lo profundo que eres en realidad.#!"
 unseelie_3_legacy_5_name: "Sofista"
 unseelie_3_legacy_5_perk: "#flavor Compartes tus conocimientos únicamente para beneficio propio.#!"
 
 unseelie_legacy_4_track_name: "Legado Unseelie"
 unseelie_legacy_4_track_desc: "Tan colorido como una cosecha de otoño y tan caótico e aislado como una tormenta de hielo invernal, los seguidores de los Legados Unseelie tienden a ser individualistas apasionados."
 unseelie_4_legacy_1_name: "Grotesco"
 unseelie_4_legacy_1_perk: "#flavor Te encanta asquear a los demás.#!"
 unseelie_4_legacy_2_name: "Demonio"
 unseelie_4_legacy_2_perk: "#flavor Disfrutas infligiendo dolor a los demás.#!"
 unseelie_4_legacy_3_name: "Proscrito"
 unseelie_4_legacy_3_perk: "#flavor Vives para romper las reglas; no le debes nada a la sociedad y ella te lo debe todo.#!"
 unseelie_4_legacy_4_name: "Cismático"
 unseelie_4_legacy_4_perk: "#flavor Eres un destructor de instituciones sociales, ya sean gobiernos, empresas o familias.#!"
 unseelie_4_legacy_5_name: "Salvaje"
 unseelie_4_legacy_5_perk: "#flavor La civilización es una pérdida de tiempo; no hay nada más que depredación, reproducción y la ley de la selva.#!"
 
 unseelie_legacy_5_track_name: "Legado Unseelie"
 unseelie_legacy_5_track_desc: "Tan colorido como una cosecha de otoño y tan caótico e aislado como una tormenta de hielo invernal, los seguidores de los Legados Unseelie tienden a ser individualistas apasionados."
 unseelie_5_legacy_1_name: "Pandora"
 unseelie_5_legacy_1_perk: "#flavor Te encanta meter a los demás en problemas revelando sus secretos.#!"
 unseelie_5_legacy_2_name: "Bogle"
 unseelie_5_legacy_2_perk: "#flavor No te importa quién salga herido, siempre que puedas echarte unas buenas risas con ello.#!"
 unseelie_5_legacy_3_name: "Cerenaic"
 unseelie_5_legacy_3_perk: "#flavor La búsqueda del placer es tu razón de vivir.#!"
 unseelie_5_legacy_4_name: "Libertino"
 unseelie_5_legacy_4_perk: "#flavor Estás obsesionado con la experiencia material y el placer personal.#!"
 unseelie_5_legacy_5_name: "Fatalista"
 unseelie_5_legacy_5_perk: "#flavor Todo tiene fallos, y tu único placer es señalarlo.#!"

 hunter_civil_legacy_track_name: "Defensor de la Humanidad"
 hunter_civil_legacy_track_desc: "Los monstruos merodean por las calles, depredando la sangre y las almas de los Inocentes. Tú eres la última línea de defensa."
 hunter_civil_legacy_1_name: "Destruye su influencia"
 hunter_civil_legacy_1_perk: "La acción de tu Capellán de Corte para convertir condados es ahora mucho más rápida. \n#flavor Sabes exactamente dónde golpearles para erradicar sus insidiosos cultos.#!"
 POD_FASTER_COUNTY_CONVERSION_DESC: "Legado de Dinastía"
 hunter_civil_legacy_2_name: "Una Humanidad"
 hunter_civil_legacy_2_perk: "#flavor No te importa de dónde vengan ni a quién adoren. Somos nosotros, la humanidad, contra ellos, los monstruos.#!"
 hunter_civil_legacy_3_name: "Sin lugar donde esconderse"
 hunter_civil_legacy_3_perk: "#flavor Los monstruos se esconden en las sombras de los mortales. Ayudar a la humanidad a reclamar territorios nuevos y desconocidos los sacará de sus agujeros.#!"
 hunter_civil_legacy_4_name: "Amigos en todas partes"
 hunter_civil_legacy_4_perk: "#flavor Cuando comprendan tu propósito, la gran mayoría de las personas que encuentres estarán ansiosas por apoyarte de cualquier forma posible.#!"
 hunter_civil_legacy_5_name: "Pastor de la humanidad"
 hunter_civil_legacy_5_perk: "Tu Mayordomo obtiene acceso a la acción $task_develop_county$. \n#flavor Bajo tu mirada vigilante, la humanidad finalmente puede prosperar.#!"
 
 hunter_military_legacy_track_name: "Cazadores Cazando"
 hunter_military_legacy_track_desc: "Cada monstruo tiene su debilidad, cada situación su herramienta perfecta."
 hunter_military_legacy_1_name: "Elimina sus recursos"
 hunter_military_legacy_1_perk: "Tus ejércitos ahora pueden saquear. \n#flavor Antes de ir a por el golpe mortal, lo mejor es asegurarse de que estén completamente aislados.#!"
 hunter_military_legacy_2_name: "Estacas para todos"
 hunter_military_legacy_2_perk: "Puede reclutar [GetMaA('vampires_hunters').GetName] como [men_at_arms|E] \n#flavor No importa en qué cripta oscura se escondan, los encontrarás y clavarás una estaca en su corazón ennegrecido.#!"
 hunter_military_legacy_3_name: "Exorcismo pesado"
 hunter_military_legacy_3_perk: "Puede reclutar [GetMaA('demons_hunters').GetName] como [men_at_arms|E] \n#flavor Las oraciones y la fuerza de voluntad solo te llevarán hasta cierto punto. Para librar al mundo de los demonios, también necesitarás armaduras fuertes y acero más fuerte.#!"
 hunter_military_legacy_4_name: "Colección de pieles"
 hunter_military_legacy_4_perk: "Puede reclutar [GetMaA('monsters_hunters').GetName] como [men_at_arms|E] \n#flavor Fortalece tu alma contra los horribles monstruos cambiantes y luego prepara tus armas de plata.#!"
 hunter_military_legacy_5_name: "Hermandad"
 hunter_military_legacy_5_perk: "#flavor Pocos son los llamados a luchar contra la oscuridad. Menos aún aquellos dignos de estar a tu lado.#!"

 hunter_alliances_legacy_track_name: "Cazadores aliados"
 hunter_alliances_legacy_track_desc: "No eres el único que lucha contra la oscuridad. Obtener el apoyo de estos compañeros cazadores sería una gran bendición."
 hunter_alliances_legacy_1_name: "La Inquisición de las Sombras"
 hunter_alliances_legacy_1_perk: "@warning_icon!#X Este rasgo dinástico solo puede desbloquearse al completar una decisión importante específica.#! \nAhora puedes invitar a un miembro de esta organización con la decisión de contactar con otros cazadores.\n $countermeasures_unlocks_t1_all_seeing_eye$ \n#flavor La orden de cazadores más poderosa es, sin duda, la Inquisición de las Sombras. Los quieres de tu lado o, al menos, que no interfieran. #!"
 hunter_alliances_legacy_2_name: "El Ikhwan Al-Safa"
 hunter_alliances_legacy_2_perk: "@warning_icon!#X Este rasgo dinástico solo puede desbloquearse al completar una decisión importante específica.#! \nAhora puedes invitar a un miembro de esta organización con la decisión de contactar con otros cazadores.\nAhora puedes pedir una mentoría especial en Sorcería con la decisión de contactar con otros cazadores.\n#flavor Aunque carecen de una organización formal, los Ikhwan no tienen parangón cuando se trata de cazar monstruos en su territorio. Una pericia de la que puedes aprender. #!"
 hunter_alliances_legacy_3_name: "Los Jueces"
 hunter_alliances_legacy_3_perk: "@warning_icon!#X Este rasgo dinástico solo puede desbloquearse al completar una decisión importante específica.#! \nAhora puedes invitar a un miembro de esta organización con la decisión de contactar con otros cazadores.\nAhora puedes pedir una mentoría especial en Teurgia con la decisión de contactar con otros cazadores.\n#flavor Los conocedores Jueces aportarían una gran experiencia y saber místico a tu lucha si se convirtieran en tus aliados. #!"
 hunter_alliances_legacy_4_name: "Los Akritai"
 hunter_alliances_legacy_4_perk: "@warning_icon!#X Este rasgo dinástico solo puede desbloquearse al completar una decisión importante específica.#! \nAhora puedes invitar a un miembro de esta organización con la decisión de contactar con otros cazadores.\n#flavor Los defensores del cristianismo oriental son herederos del complejo sistema legal y burocrático bizantino. Una habilidad útil para una orden de cazadores en auge. #!"
 hunter_alliances_legacy_5_name: "Baghatur de Qorjin"
 hunter_alliances_legacy_5_perk: "@warning_icon!#X Este rasgo dinástico solo puede desbloquearse cumpliendo una decisión importante específica.#! \nAhora puedes invitar a un miembro de esta organización con la decisión de contactar con otros cazadores. \nPuede reclutar a [GetMaA('battlescarred_fera').GetName] como [men_at_arms|E].  \n#flavor Los cazadores mongoles tienen aliados extraños... pero su fuerza bruta hace fácil mirar hacia otro lado. #!"
  
 wraith_legacy_track_name: "Trasfondos de wraith"
 wraith_legacy_track_desc: "Las herramientas, trucos y recuerdos dolorosos de los difuntos."
 wraith_legacy_1_name: "Eidolon"
 wraith_legacy_1_perk: "Pequeña probabilidad de no recibir la pasión oscura [decision|E].\n#flavor La capacidad de un wraith para resistir a su Sombra.#!"
 wraith_legacy_2_name: "Refugio"
 wraith_legacy_2_perk: "#flavor Un refugio espiritual frente a los peligros de las [UmbraGlossary('shadowlands')].#!"
 wraith_legacy_3_name: "Legado"
 wraith_legacy_3_perk: "Curar automáticamente el [Corpus|E] cada mes.\n#flavor Las obras de un wraith en vida que continúan tras su muerte como tributo a su memoria.#!"
 wraith_legacy_4_name: "Memoriam"
 wraith_legacy_4_perk: "Ganar Pathos automáticamente cada mes.\n#flavor Los recuerdos que la gente guarda de los fallecidos. Pueden aprovecharse como fuente de Pathos... aunque los recuerdos se desvanecen.#!"
 wraith_legacy_5_name: "Reliquia"
 wraith_legacy_5_perk: "Obtener acceso a un eco aleatorio de un artefacto histórico.\n#flavor Un objeto que pasó a través del Velo con un wraith debido a la resonancia emocional.#!"
 

 kj_fuxi_legacy_track_name: "Legado de Fuxi"
 kj_fuxi_legacy_track_desc: "El primero de los Tres Soberanos, un ejemplar de la Era de las Leyendas"

 kj_fuxi_legacy_1_name: "Legado del Pescador"
 KJ_FUXI_LEGACY_1_EFFECT: "#flavor Fuxi fue el primer pescador, ayudando a enseñar al pueblo cómo alimentarse a través del mar.#!"
 kj_fuxi_legacy_2_name: "Legado del Cazador"
 KJ_FUXI_LEGACY_2_EFFECT: "Desbloquea la [activity|E] de [GetActivityType('activity_hunt').GetName] si aún no está desbloqueada.\nReduce a la mitad el coste de la [activity|E] de [GetActivityType('activity_hunt').GetName].\n#flavor Fuxi también fue el primer cazador, proporcionando comida para aquellos que vivían demasiado lejos de la costa.#!"
 kj_fuxi_legacy_3_name: "Legado del Pastor"
 KJ_FUXI_LEGACY_3_EFFECT: "Añade un nuevo modificador al edificio de Guerra Baja.\n#flavor Fuxi enseñó entonces a la humanidad cómo criar ganado, alimentándolos incluso cuando los peces y las bestias eran demasiado escasos para hacerlo.#!"
 kj_fuxi_legacy_4_name: "Legado del Arquitecto"
 KJ_FUXI_LEGACY_4_EFFECT: "#flavor Fuxi demostró cómo construir viviendas permanentes, elevando a la humanidad de su origen cavernario.#!"
 kj_fuxi_legacy_5_name: "Legado del Adivino"
 KJ_FUXI_LEGACY_5_EFFECT: "#flavor Finalmente, Fuxi también enseñó a los primeros humanos a mirar las estrellas y a reflexionar sobre qué respuestas (y lo que es más importante, qué preguntas) pueden encontrarse aquí.#!"
      
 kj_shennong_legacy_track_name: "Legado de Shennong"
 kj_shennong_legacy_track_desc: "El segundo de los Tres Soberanos, un ejemplar de la Era de las Leyendas"

 kj_shennong_legacy_1_name: "Legado de las Ofrendas"
 KJ_SHENNONG_LEGACY_1_EFFECT: "Tras la muerte de cualquier miembro de la [dynasty|E], la [dynasty|E] ganará #V 100#! de [dynasty_prestige|E]\n#flavor Shennong enseñó al pueblo cómo hacer las ofrendas adecuadas al Cielo y mantenerse a salvo de su ira.#!"
 kj_shennong_legacy_2_name: "Legado del Agricultor"
 KJ_SHENNONG_LEGACY_2_EFFECT: "#flavor Shennong inventó la agricultura, allanando el camino para que los primeros humanos crecieran y se multiplicaran.#!"
 kj_shennong_legacy_3_name: "Legado de la Tejedora"
 KJ_SHENNONG_LEGACY_3_EFFECT: "Añade un nuevo modificador al edificio de Guerra Baja.\n#flavor Shennong enseñó al pueblo cómo vestirse, asegurándose de que incluso el frío invierno pudiera soportarse.#!"
 kj_shennong_legacy_4_name: "Legado del Sacrificio"
 KJ_SHENNONG_LEGACY_4_EFFECT: "#flavor Shennong creó la idea de innovar, incluso sacrificándose a sí mism[X.Custom('ES_OA')] si el progreso para la humanidad estaba en juego.#!"
 kj_shennong_legacy_5_name: "Legado de Sanación"
 KJ_SHENNONG_LEGACY_5_EFFECT: "#flavor Shennong fue el primer médico, y su maestría con las hierbas medicinales no tenía parangón en aquella época.#!"

 kj_huangti_legacy_track_name: "Legado de Huang-ti"
 kj_huangti_legacy_track_desc: "El tercero de los Tres Soberanos, un ejemplar de la Época de las Leyendas"

 kj_huangti_legacy_1_name: "Legado del Alquimista"
 KJ_HUANGTI_LEGACY_1_EFFECT: "#flavor Huang-ti fue el primer alquimista, creando una larga y orgullosa Tradición que todavía ayuda a la gente hoy en día.#!"
 kj_huangti_legacy_2_name: "Legado del Carpintero Naval"
 KJ_HUANGTI_LEGACY_2_EFFECT: "#flavor Huang-ti enseñó a la humanidad primitiva cómo construir barcos y zarpar, trazando nuevos territorios sobre los mares.#!"
 kj_huangti_legacy_3_name: "Legado del Armero"
 KJ_HUANGTI_LEGACY_3_EFFECT: "Añade un nuevo modificador al edificio de Guerra Baja.\n#flavor Huang-ti fabricó la primera armadura, protegiendo a las comunidades de las partes menos ilustradas de la humanidad.#!"
 kj_huangti_legacy_4_name: "Legado del Defensor"
 KJ_HUANGTI_LEGACY_4_EFFECT: "#flavor Huang-ti inculcó un sentido de comunidad en los primeros humanos, asegurándose de que defendieran sus hogares como una unidad cohesiva.#!"
 kj_huangti_legacy_5_name: "Legado de la Guerra"
 KJ_HUANGTI_LEGACY_5_EFFECT: "#flavor Finalmente, Huang-ti nos enseñó cuándo contraatacar, asegurándose de que los ilustrados triunfaran sobre los bárbaros.#!"
 
