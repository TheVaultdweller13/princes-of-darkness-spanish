l_spanish:
 LOADING_TIP_0: "#high «El erudito romano Séneca se equivocaba. El dominio injusto puede ser eterno.»#! - Hardestadt"
 LOADING_TIP_1: "#high Caín no puede ser diabolizado. Lo sentimos.#!"
 LOADING_TIP_2: "#high Los vampiros Antiguos lo son por una razón. No caerán ante una intriga mal preparada.#!"
 LOADING_TIP_3: "#high Cuida la Mascarada. No querrías enfurecer a la Iglesia.#!"
 LOADING_TIP_4: "#high Este es el Mundo de Tinieblas. No tienes amigos, solo peones.#!"
 LOADING_TIP_5: "#high Tendrás un dominio muy limitado y necesitarás vasallos. No confíes en ellos.#!"
 LOADING_TIP_6: "#high Para estar seguro, espera que todo el mundo esté conspirando para tu fin. Probablemente lo estén haciendo de todos modos.#!"
 LOADING_TIP_7: "#high «Siempre hay un sire que nos dirige, y otro sire más allá de él, y así hasta llegar a Caín. No hay "destino" que puedas elegir salvo el que tus amos te permitan.»#! - Montano"
 LOADING_TIP_8: "#high «Sin mí no habría Sabbat. Y sin el Sabbat no habría Camarilla. Todo el rostro de la sociedad cainita es lo que es gracias a mí.»#! - Gratiano, delirando"
 LOADING_TIP_9: "#high «Cada problema menor es como un grano de arena; cada noche heredo el desierto.»#! - Lacroix"
 LOADING_TIP_10: "#high «Fui reina del mundo una vez, y lo seré de nuevo, te lo prometo. Ahora tienes mi permiso para morir.»#! - Petaniqua"
 LOADING_TIP_11: "#high «No somos dioses, digamos lo que digamos. No existe la Divinidad. El corazón del universo está vacío. ¿Lo cruzarás conmigo?»#! - Kemintiri"
 LOADING_TIP_12: "#high «Un alma no es más que otro trozo de arcilla para retorcer entre tus dedos.»#! - Sascha Vykos"
 LOADING_TIP_13: "#high «Los finales y los principios tienden a mezclarse y a retorcerse hasta que cuesta separar unos de otros.»#! - Anatole" #CN DA Lasombra p231
 LOADING_TIP_14: "#high «Eres un vampiro grande y malo. Oye, genial, enhorabuena. Ahora guárdatelo para ti.»#! - Smiling Jack"
 LOADING_TIP_15: "#high «Si no te queda más remedio que destruir a un Nosferatu, no lo enfrentes, bajo ninguna circunstancia, en su territorio.\nNunca encontraremos tus cenizas.»#! - al-Ashrad"  #CB Ass Rev p62
 LOADING_TIP_16: "#high «Entiende esto: no perdimos contra los Ventrue. Perdimos contra los Ventrue y todos sus aliados, sus sirvientes, sus amigos y cada pobre campesino hijo de perra que cometió el error de cruzar la mirada con su señor inmortal. Ahora ya sabes dónde reside la verdadera fuerza de los Ventrue.»#! - Lydia Dorn"
 LOADING_TIP_17: "#high «Nunca, nunca, nunca subestimes a los Lasombra. Son los Ventrue sin la fragilidad moral. Son los Tremere sin las pretensiones. Son los Setitas sin el postureo... y no son ninguna de esas cosas.»#! - Fátima al-Faqadi"
 LOADING_TIP_18: "#high «No existe la independencia en la Yihad. Solo la falta de conciencia de quiénes son nuestros amos.»#! - ur-Shulgi"
 LOADING_TIP_19: "#high «Nunca cometas el error de enfrentarte a un Setita en su propio campo de batalla, el social y el político. No notarás los colmillos hasta que los tengas en la garganta.»#! - Sukainah"
 LOADING_TIP_20: "#high «Vaya, cómo me alegro de que no me Abrazaran en el Clan Tremere. Qué pesadilla burocrática y mezquina. Sin ofender. Es solo que pasarme décadas sentado esperando mi turno para llegar a ser el ayudante júnior de nadie (de segunda clase) no me atrae en absoluto.»#! - Felton"
 LOADING_TIP_21: "#high «Estas tres cosas nunca debe hacer un Príncipe, si pretende prosperar: enfurecer a los Brujah, avergonzar a los Ventrue e ignorar a los Nosferatu.»#! - desconocido"
 LOADING_TIP_22: "#high «No apuestes contra la Bestia, porque al final siempre gana.»#! - desconocido"
 LOADING_TIP_23: "#high «Algunos temen abiertamente a los Antediluvianos y en secreto a los mortales. Otros temen abiertamente a los mortales y en secreto a los Antediluvianos. Ambos temores son exagerados. Se puede sobrevivir a la Gehena. Podemos gobernar para siempre.»#! - Mithras"
 LOADING_TIP_24: "#high «No soy un esclavo. No soy un esclavo. No soy un esclavo.\nEso es lo que él me dijo que me repitiera.»#! - Lambach"
 LOADING_TIP_25: "#high «Siempre habrá otra Gehena que buscar, Beckett. Nuestras mentes las inventan. Deberías bajarte de esa rueda en particular; gira eternamente.»#! - Drácula"
 LOADING_TIP_26: "#high «Había elegido a ciegas recorrer el camino que mi sire dispuso ante mí. Durante siglos jamás lo cuestioné, hasta que comprendí qué burla hueca de alma me había dado, qué poco servía para complacerme, para comprenderme de verdad.\nJuré, esa noche, no sufrir más.»#! - Titus Venturus Camilla"
 LOADING_TIP_27: "#high «Cree, Tremere, si te place, que tú y los tuyos sabéis más de magia de sangre que quien la dominó antes del alzamiento de Sumer. Pero te digo ahora: tu Clan nada hizo al mío que nosotros no permitiéramos.»#! - Tegyrius"
 LOADING_TIP_28: "#high «Llega un momento, Ventrue, en que es el juego el que juega con los jugadores.»#! - Izhim ur-Baal"
 LOADING_TIP_29: "#high «Viajé a la tierra de nuestros ancestros y me enfrenté al heraldo. Es oscuro y terrible: la furia de vuestro cielo y el fuego de vuestro infierno. Negro e impenetrable como la noche más profunda.»#! - Thetmes"
 LOADING_TIP_30: "#high «Las estrellas también eran hueso, aunque no meros adornos: eran los huesos de ur-Shulgi, visibles allí donde la piel de medianoche se había desprendido o agrietado y caído; eran las vainas de la esencia del heraldo, y su médula era la venganza.»#!"
 LOADING_TIP_31: "#high «Aquí nos jugamos la vida, pero los Ventrue y los Tremere todavía tienen que mearse en los zapatos del otro cada vez que pueden, y lo único que quieren hacer los Toreador es criticar el color del chorro.»#! - Theo Bell"
 LOADING_TIP_32: "#high «El mundo se va a la mierda, pero tenemos un trabajo que hacer.»#! - Theo Bell"
 LOADING_TIP_33: "#high «Las viejas ideas pueden rejuvenecer. Cartago, el ideal, es de nuevo viejo y nuevo.»#! - Critias"
 LOADING_TIP_34: "#high «Cada vez que arranco una mandíbula de un cráneo y la clavo en una cuenca ocular, sé que estoy construyendo un futuro mejor.»#! - Smiling Jack"
 LOADING_TIP_35: "#high «Solo hay una forma de sobrevivir a la oscuridad: hacer que te tema.»#! - Smiling Jack"
 LOADING_TIP_36: "#high «No encontraste la revolución, chaval. La revolución te encontró a ti.»#! - Tyler"
 LOADING_TIP_37: "#high «Todo lo que está muerto lleva los ecos de la vida. Todo lo que vive oye la llamada de su muerte.»#! - Constancia"
 LOADING_TIP_38: "#high «Podemos odiar en abundancia, y no tenemos un objeto más adecuado para nuestro odio que nosotros mismos. Así que nos levantamos cada noche porque no queremos odiarnos más de lo que ya lo hacemos, joder. Pero vamos a fracasar incluso en eso.»#! - Chas Giovanni Tello"
 LOADING_TIP_39: "#high «A lo largo de la historia, y antes de ella, los dioses de la noche han exigido sangre y carne a la humanidad. Estos son nuestros sires. Tú eres Artemisa. Tú eres Ahrimán. Eres la diosa del volcán de Catal Huyuk y Tezcatlipoca, el dios azteca del espejo humeante. Una oscuridad tan espesa que oculta el sol.»#! - Demba Makemba Adoula"
 LOADING_TIP_40: "#high «Que se queden boquiabiertos de asombro, Myca. Que me maldigan por abandonar la lucha contra la Gehena en sus términos. Que me llamen traidora, que me pongan en su absurda Lista Roja, que me maldigan por cobarde y por necia egoísta. Estoy harta de jugar al juego que el mundo ha puesto ante mí.»#! - Lucita de Aragón"
 LOADING_TIP_41: "#high «Los vampiros son la apoteosis del pecado, la encarnación de la virtud violada y arruinada. Con esto demuestras tu valía.»#! - Francisco Domingo de Polonia"
 LOADING_TIP_42: "#high «Los Jóvenes hablábamos a menudo de madrugada, justo antes de la hibernación, sobre lo deseable de una oportunidad nueva. Lo que distinguía a Gratiano era que se atrevió a actuar en consecuencia.»#! - Hermano Oso"
 LOADING_TIP_43: "#high «Pienso barrer las piezas del tablero... Libre no solo de las Sectas, sino de la guerra eterna. Mi sire y Vykos me manipularon. Su Cruzada nunca será la mía. Combatiré la llamada como pueda. Beberé hasta hartarme de sangre espesa y seguiré siendo libre y, al final, la Yihad la romperé yo, y otros como yo.»#! - Lucio Elio Sejano"
 LOADING_TIP_44: "#high «Es una lástima que la mayoría de las piezas tuvieran que ser barridas del tablero.»#! - Ambrosio Luis Moncada"
 LOADING_TIP_45: "#high «Esta existencia puede ser una diversión gloriosa, si se lo permites.»#! - Helena de Troya"
 LOADING_TIP_46: "#high «Abandonamos la Ciudad Eterna porque su corazón dejó de latir hace mucho. Agoniza... y vosotros, los señores de una ciudad antaño gloriosa, os escondéis en sus sombras, perdidos en un laberinto de vuestra propia construcción. Cuando los nuestros miren atrás hacia estos tiempos, verán vuestros logros y se preguntarán qué salió mal. Pero nunca, mientras os ocultáis, sabrán quién fue el responsable, a quién deben dirigirse el elogio o la condena. Vuestros actos se perderán para la posteridad, y todo lo que os llamarán será Incógnitos.»#! - Último discurso de Miguel a los cainitas de Roma en vísperas de su partida"
 LOADING_TIP_47: "#high «La verdad no tiene una sola forma, ni un solo símbolo. Todos los ojos la ven de manera distinta. Todas las lenguas la dicen de manera distinta. Nada –nada– existe inmutable para siempre. Ni siquiera nosotros.»#! - el Dracon"
 LOADING_TIP_48: "#high «Es casi cierto que no puede morir. Mientras exista alguien de su sangre, él existe. Mientras el mundo no se reduzca a cenizas, podrá recomponerse.»#! - el Dracon sobre los Tzimisce"
 LOADING_TIP_49: "#high «Yo mismo. Metamorfosis. Ascensión. Soy el que soy. Soy la tierra, despertada por la sangre. Ya no soy larva. La fase de pupa termina, para mí y para los demás.»#! - Tzimisce"
 LOADING_TIP_50: "#high «Ha olvidado cómo ser gentil... y ni siquiera yo sabría decir si comprende, o recuerda, lo frágiles que somos.»#! - Damek Ruthven sobre los Tzimisce"
 LOADING_TIP_51: "#high «Sírveme. No sientes ningún cariño por los Antediluvianos, ¿verdad? El día de la Gehena se acerca, y pretenden devorarte a ti, a tus amigos y a todos los demás vampiros. ¡Yo lo impediré! ¡Te daré la eternidad! ¡La vida perdurable! ¡Recibiremos a los abuelos que despierten con otro diluvio, un diluvio de su propia sangre!»#! - Vukodlak, dirigiéndose a Christof Romuald"
 LOADING_TIP_52: "#high «No cometeré los errores que cometieron mis progenitores. No elegiré el miedo ni la ignorancia. No me encogeré aterrado ante mí mismo, ante quién y qué soy. No me odiaré ni me rechazaré. Soy Myca Vykos y, una noche, el mundo me conocerá por lo que de verdad soy.»#! - Myca Vykos"
 LOADING_TIP_53: "#high «En el juego de reyes y reinas, hemos de sacrificar nuestra compasión en el altar de la certeza inexpugnable. Para gobernar con sabiduría, hay que gobernar por completo. La justicia no tiene piedad.»#! - Hardestadt el Joven"
 LOADING_TIP_54: "#high «La locura de liderar es saber que, hagas lo que hagas, a tus espaldas hay cientos convencidos de que su propia solución es la más acertada y de que tu decisión fue el subproducto de un caprichoso lanzamiento de dardos.»#! - Lacroix"
 LOADING_TIP_55: "#high «Nuestro Padre Oscuro vaga aún ahora por la noche exterior, llorando y arrepintiéndose en su sabiduría ganada a pulso. Si hasta el poderoso Caín obra así, ¿cómo es que alzamos con orgullo el rostro hacia la luna y decimos: “Hay poder en mis venas y por él reclamo la soberanía sobre el hombre y la bestia, y con mi propia sangre negra justifico mis pecados”?»#! - Anatole" #CN DA Ravnos p270
 LOADING_TIP_56: "#high «Me preguntas qué clase de gente tiene más probabilidades de ser diabolista y asesina. Te aseguro que cualquiera puede ser diabolista y asesino.»#! - Harold el Zettler"
 LOADING_TIP_57: "#high «Bailo la danza del loco. Y rezo para que me halles demente. Pues si pones las manos sobre la raíz, me conocerás sin ilusión. Y me hallarás culpable de la verdad.»#! - Malkav"
 LOADING_TIP_58: "#high «Abuelita, déjame darte un beso.»#! - Vasilisa"
 LOADING_TIP_59: "#high «Chandraputra ha entrado en el santuario, hirviendo de la furia apenas contenida de un héroe justo de los Vedas.»#! - Beckett sobre Chandraputra"
 LOADING_TIP_60: "#high «La Camarilla perdura para proteger a sus miembros de sí mismos; ese es el único propósito digno que cumple. Pero algún día fracasará, cuando sus antiguos lleguen a alimentarse en la mesa de la Gehena. Una silla quedará reservada para mí.»#! - Kemintiri"
 LOADING_TIP_61: "#high «Haz las paces con tus dioses y despídete. El diamante se ahogará en sangre, y el resto del mundo poco después.»#! - Sundervere"
 LOADING_TIP_62: "#high «La Serpiente estuvo primero en el jardín, ya sabes.»#! - Hesha Ruhadze"
 LOADING_TIP_63: "#high «Él era el objeto de nuestra devoción, el sentido que había tras el sacrificio de incontables vidas —pitagóricos, cataros, masones, alquimistas—, todos luchando en la oscuridad para que un día, generaciones después, un hombre pudiera sostener en la mano el fruto prohibido, la Piedra Filosofal, el elixir de la vida eterna. Su nombre era Goratrix, nuestro portador de luz, nuestro Prometeo, nuestro Lucifer.»#! - Aisling Sturbridge"
 LOADING_TIP_64: "#high «¿Crees que yo busqué nuestro exilio, tú, de entre todos? Mejor cien gritos de “hereje” y mil espadas Tzimisce que las palabras de desprecio de la Orden aquella horrible noche... Pero si no quieren seguirnos, que se extingan, como los dragones cuyos esqueletos de piedra arranco de los acantilados.»#! - Goratrix a Meerlinda"
 LOADING_TIP_65: "#high «No soy vuestra serpiente para ordeñarla o aplastarla, ni tampoco un verdadero mago, pero a su debido tiempo os mostraré qué soy exactamente. Y mucho después de que os hayáis ido y vuestra preciosa magia mortal sea cosa de cuentos de nodrizas, yo habré tomado lo que de verdad había que tomar y sabido lo que de verdad había que saber.»#! - Jervais, sobre Etrius"
 LOADING_TIP_66: "#high «Muchos son los hijos del Dragón, de la Serpiente, del gran Satanás, y ahora están entre vosotros. Os digo, Siervos de Cristo, que la Parusía está cerca, que la Segunda Venida llega pronto. Cada vez más fuertes crecen los hijos del Dragón, y se multiplican, y son una herida para la tierra. Y nosotros somos el bálsamo de esa herida: hemos de limpiarla con fuego y purificarla, y entonces la tierra estará lista para la Parusía y se nos juzgará dignos.»#! - Leopold von Murnau"
 LOADING_TIP_67: "#high «Conocemos la carga de la verdad a un alto precio.\nEllos pagaron de más.»#! - Los Malkavian sobre los Baali"
 LOADING_TIP_68: "#high «Lo trágico es que podríamos haberlos dejado morir. Nunca nos perdonarán que los salváramos.»#! - Los Malkavian sobre los Brujah"
 LOADING_TIP_69: "#high «Aunque pudiera contarte lo que sé de ellos, no me creerías.»#! - Los Nosferatu sobre los Tzimisce"
 LOADING_TIP_70: "#high «La Inquisición condena a sus víctimas a ser malditas por toda la eternidad, pero ellos solo se ocupan de matar. Nosotros nos ocupamos de la condenación.»#! - Rossellini, nigromante romano"
 LOADING_TIP_71: "#high «Imagino que creen que pasamos mucho tiempo espiándolos e intentando socavarlos. Como si fueran tan difíciles de descifrar.»#! - Los Nosferatu sobre los Ventrue"
 LOADING_TIP_72: "#high «Nada que merezca la pena comentar. Pronto otros solo hablarán de su recuerdo. Luego los mataremos a ellos también, y los Tremere simplemente nunca habrán existido.»#! - Los Tzimisce sobre los Tremere"
 LOADING_TIP_73: "#high «Cuando su sangre aulló de rabia por la muerte de Saulot, la nuestra cantó de alegría. Seamos felices juntos.»#! - Los Baali sobre los Salubri"
 LOADING_TIP_74: "#high «Intenta encontrar las diferencias con los Toreador, si puedes. Solo hay una: ellos tienen un plan, lo que los hace más parecidos a nosotros. No sé hasta qué punto es bueno eso.»#! - Los Giovanni sobre los Setitas"
 LOADING_TIP_75: "#high «Este no es lugar ni momento para el debate. Es momento de que te marches y abandones tu insignificante búsqueda. Si persistes y sigues adelante, no morirás como un héroe. Suplicarás. Rezarás. No recibirás respuesta.»#! - Lamia desconocida"
 LOADING_TIP_76: "#high «La manzana no cae lejos del árbol, y el árbol debería haberse talado hace mucho»#! - Los Brujah sobre los Setitas"
 LOADING_TIP_77: "#high «Bota, te presento a cara.»#! - Los Brujah sobre los Ventrue"
 LOADING_TIP_78: "#high «Te daré ventaja. Tú eres la tortuga y yo soy la liebre: una liebre cabreada, con el mundo por montera, con una cuenta que saldar y una sed como la del mismísimo diablo.»#! - Brujah desconocido"
 LOADING_TIP_79: "#high «Ponle la cola al... ¡AY, AY, AY, JODER!»#! - Los Malkavian sobre los Gangrel"
 LOADING_TIP_80: "#high «Emite lluvias de chispas. Apuntar lejos de la cara. Apuntar mejor a algún otro gilipollas.»#! - Los Nosferatu sobre los Brujah"
 LOADING_TIP_81: "#high «Yo tengo este aspecto porque no me queda otra. Estos cabrones lo eligen. Así es como la naturaleza dice: “Aléjate”.»#! - Los Nosferatu sobre los Tzimisce"
 LOADING_TIP_82: "#high «A estos tipos no les pasa nada que no se arregle clavándoles una estaca en el ataúd y prendiéndoles fuego.»#! - Los Ravnos sobre los Tzimisce"
 LOADING_TIP_83: "#high «¿Por qué demonios ibas a pensar que quería que dejaras de gritar? Los resultados me parecen mucho más melodiosos cuando te entregas al miedo.»#! - Tzimisce desconocido"
 LOADING_TIP_84: "#high «Matadlos. A todos. No perdáis el tiempo en lecciones que no deberían vivir lo bastante para comprender.»#! - Los Tzimisce sobre los Tremere"
 LOADING_TIP_85: "#high «Ah, los nuevos jugadores emergen en el campo de los milenios. Debemos disponer que se les dé una bienvenida adecuada y generosa.»#! - Los Setitas sobre los Tremere"
 LOADING_TIP_86: "#high «Patanes traicioneros. Un gusano de Lasombra intentó enredarme en su asqueroso complot. Pese a todos sus aires de superioridad, por dentro no se veía muy distinto de los demás vampiros.»#! - Los Gangrel sobre los Lasombra"
 LOADING_TIP_87: "#high «Cuando un Malkavian hable, escucha. Cuando un Malkavian actúe, márchate. Cuando se reúnan dos Malkavian, corre.»#! - Los Gangrel sobre los Malkavian"
 LOADING_TIP_88: "#high «Solo tengo una cosa que decir. Set estaba más loco que Malkav. Lo juro por los huesos de mi sire.»#! - Los Malkavian sobre los Setitas"
 LOADING_TIP_89: "#high «La política es sencilla. Dile a tus inferiores lo que han de hacer, empala a quienes osen desobedecer y sigue con los asuntos de verdadera importancia.»#! - Tzimisce desconocido"
 LOADING_TIP_90: "#high «Quieren que admiremos sus artes, ¡pero cómo se resisten a las nuestras! Tenlos de mascotas hasta que sus versos empiecen a aburrir; entonces haz que los arrojen a los fosos de Vozhd.»#! - Los Tzimisce sobre los Toreador"  
 LOADING_TIP_91: "#high «Les arrancaremos su don robado de las entrañas desolladas, los ensartaremos en los picos de los Cárpatos que profanaron, alimentaremos al Danubio con sus humores biliosos y dejaremos el resto para los pájaros carroñeros. Entonces empezaremos de verdad a enseñarles el significado del dolor.»#! - Los Tzimisce sobre los Tremere"
 LOADING_TIP_92: "#high «Tienen un admirable talento para guardar rencor.»#! - Los Ventrue sobre los Brujah"
 LOADING_TIP_93: "#high «Si parece una serpiente, sisea como una serpiente y repta como una serpiente, no vas a tender la mano para acariciarle la cabeza. Si encuentras una serpiente en tu jardín, la matas.»#! - Scatha-Columbkille sobre los Setitas"
 LOADING_TIP_94: "#high «Genial, lucha contra el poder. ¡Ayuda a la gente! Ah, espera, ¿solo vas a ayudar a la mitad? Bueno, supongo que algo es algo.»#! - Los Roehuesos sobre las Furias Negras"
 LOADING_TIP_95: "#high «Me ponen los pelos de punta. Crees que estás contando una historia verdaderamente trágica y te miran como diciendo: “¿Eso es todo?”»#! - Los Fianna sobre los Caminantes Silenciosos"
 LOADING_TIP_96: "#high «Vuestros ancestros eran casi tan fuertes como los nuestros, y vosotros sois casi tan fuertes como nosotros. ¿Qué? Es un cumplido.»#! - La Camada de Fenris sobre los Fianna"
 LOADING_TIP_97: "#high «Impresionantemente astutos. Peligrosamente subestimados. Considerablemente útiles.»#! - Los Señores de la Sombra sobre los Roehuesos"
 LOADING_TIP_98: "#high «Manéjalos bien y serán una parte vital de cualquier plan de batalla. Si te equivocas al manejarlos... bueno, mejor digamos que no te equivoques al manejarlos.»#! - Los Señores de la Sombra sobre la Camada de Fenris"
 LOADING_TIP_99: "#high «Su lealtad se agradece mucho, aunque su etiqueta sea... variable.»#! - Los Colmillos Plateados sobre los Fianna"
 LOADING_TIP_100: "#high «No entienden que ganar batallas no compensa perder la guerra.»#! - Los Roehuesos sobre la Camada de Fenris"
 LOADING_TIP_101: "#high «Dales el respeto de Gaia, pero cuidado con intimar si bailas con ellas.»#! - Los Fianna sobre las Furias Negras"
 LOADING_TIP_102: "#high «Qué uñas tan bonitas tienes. Duras como el acero y tan, tan afiladas. Desgarrarían carne y hueso. Solo quiero... arrancarlas a mordiscos.»#! - Helena de Troya"
 LOADING_TIP_103: "#high «Mi destino no lo decidirá quién haya podido ser mi tatarasire. No volverán a controlarme.»#! - Lucio Elio Sejano"
 LOADING_TIP_104: "#high «Y cuando Ella dispuso su regreso, el mundo se partió en dos. Los Chiquillos de Caín a un lado, los Chiquillos de Lilith al otro, y fue la Gehena.»#! - el fragmento Shaal"
 LOADING_TIP_105: "#high «Él viene. El Pastor Negro viene a diezmar el rebaño. El Engendro Odioso. El Heraldo de la Destrucción. Así como el Señor de la Muerte diezmó a sus chiquillos en Kaymakli, el Pastor Negro diezmará a los Hijos en Alamut.»#! - profetisa mortal desconocida"
 LOADING_TIP_106: "#high «Todo lo viejo debe dejar paso a lo nuevo. El tercero se convierte en el segundo; el segundo, en el primero. Los padres mueren para que los hijos vivan. Todos somos círculos que descienden en espiral para reinar en el infierno.»#! - Acacia"
 LOADING_TIP_107: "#high «El giro de la rueda es inexorable. No puede detenerse, pero puede cambiarse su rumbo para retrasar el momento final en que nos reduzcan a la nada y Ellos se alcen. Como es ahora, así fue antes. Como fue antes, así será en el futuro. Los Hijos de Caín siempre se alzan al borde del olvido.»#! - Vasantasena"
 LOADING_TIP_108: "#high «Somos viejos y sabios, pero con nuestra edad y nuestro poder solo nos hemos enredado en telarañas que no vemos y nos hemos atado con hilos de marioneta que no sentimos, y mucho menos podemos cortar.»#! - Vasantasena"
 LOADING_TIP_109: "#high «A lo largo de los milenios han brotado cultos a la muerte que dictan el fin del mundo y se entregan a sus libertadores. ¿Ha acabado ya el mundo? No. ¿Han sido esos libertadores algo más que bastardos hambrientos? No. Mira a los Tremere.»#! - Talley"
 LOADING_TIP_110: "#high «Y entonces el Dragón saqueó el manto de Kupala. Como se le había inducido a hacer. Y lo vistió como propio. Gobernando la tierra entre los ríos. Y cada lugar que pisó. Tal era Su voluntad.»#! - Incunabulum Kupalam"
 LOADING_TIP_111: "#high «¡Vienen! ¡Vienen a por todos nosotros!»#! - Últimas palabras de Angus, Nosferatu"
 LOADING_TIP_112: "#high «Algunos libros no están hechos para abrirse.»#! - Anatole"
 LOADING_TIP_113: "#high «Disfruta de tus libros, entregados en mano en el lugar que elegiste. Ten por seguro que solo hizo falta que muriera un Dunsirn para poder adquirirlos. Yo maté a dos para enviar un mensaje.»#! - Talley"
 LOADING_TIP_114: "#high «¿No nacieron los Tremere como una Línea de Sangre de los Tzimisce? Eso suena significativo.»#! - Anatole"
 LOADING_TIP_115: "#high «Zettler. Varrick. Vegel. Leopold. Ruhadze. Beckett. Solo los nombres más recientes de quienes intentaron controlar el Ojo y empezaron a sucumbir a sus poderes. No abras la caja.»#! - Anatole"
 LOADING_TIP_116: "#high «Cuando Hazimel acercó su frente a la mía, pareció abrirse un tercer ojo y su mente tocó la mía. Él pudo ver todo de mi vida, y sonrió. Yo pude ver todo de la suya, y empecé a gritar.»#! - Beckett"
 LOADING_TIP_117: "#high «¡La mesa habla! Está muy descontenta. Prueba tú a ser una mesa encantada en una casa vacía.»#! - Anatole"
 LOADING_TIP_118: "#high «La posesión de auténtico sarcasmo es un crimen castigado con la Muerte Definitiva en la Casa de Hardestadt.»#! - Calebros"
 LOADING_TIP_119: "#high «Hablé con el Anciano. O padre me habló a mí. Dentro de mí. Siempre dentro de mí. Por mucho que trague, el abuelo no baja.»#! - Lambach"
 LOADING_TIP_120: "#high «La prima Viorica vino de parte de Damek. Quería saber por qué cesó mi comunicación. Se lo mostré. El Anciano está alimentado. Soy un buen chico.»#! - Lambach"
 LOADING_TIP_121: "#high «Aquella acción... hace tantos años... fue vulgar y cortoplacista.»#! - Sascha Vykos"
 LOADING_TIP_122: "#high «Shivasakti, tú eres el Divino Padre y Madre. Concédeme tu devoción, destruye al malhechor y el marchitamiento de la Rueda de las Eras de donde mana el mal. Conquista toda muerte y destino bajo tu talón y que la quietud sea la ley eterna.»#! - Voormas"
 LOADING_TIP_123: "#high «Cuanto más vemos, más creemos saber. Cuanto más creemos comprender, más nos aferramos a nuestras costumbres y más limitamos nuestro potencial. Por eso la juventud es la llama que enciende el futuro. El poder no es más que pulimento sobre hojas romas. »#! - Porthos"
 LOADING_TIP_124: "#high «Como soy el Señor de la Luz, tengo dominio sobre las esferas que iluminan el cielo. Y así te entrego esta vestidura de Noche, queridísima hermana, en la que van cosidas la luna y las estrellas y todo cuanto aparece en el cielo nocturno. Vístela y gobierna la Noche como yo gobierno ahora el Día.»#! - Lucifer a Lilith"
 LOADING_TIP_125: "#high «¿Por qué debo yacer bajo ti, sobre mi espalda? Yo también fui hecha de la Tierra Verdadera y, por tanto, soy tu igual.»#! - Lilith a Adán"
 LOADING_TIP_126: "#high «Siempre andan correteando en alguna misión secreta para hallar los cráneos de sus Antiguos y molerlos hasta hacer polvo afrodisíaco o algo así. Se ponen muy estirados cuando los interrumpes.\nComo quieras, Gandalf.»#! - Los Brujah sobre los Tremere"
 LOADING_TIP_127: "#high «He sido una puta para la guerra y una puta para la paz. He sido mártir y cínica, asesina y santa. He visto cómo ocurría la historia. He contribuido al color del avance cultural con el carmesí de mi propia sangre. He visto milagros y he sido un milagro para muchos.»#! - Lucita de Aragón"
 LOADING_TIP_128: "#high «Supongo que si yo no tuviera habilidades dignas de mención, ni aspiraciones, ni dinero, también fingiría ser un animal.»#! - Los Giovanni sobre los Gangrel"
 LOADING_TIP_129: "#high «Se rompen fácil. Aunque no puedes atrapar del todo sus espíritus cuando los matas. Al parecer los reciclan de vuelta a su mundo de sueños feliz y reluciente. Qué ternura.»#! - Los Giovanni sobre las hadas"
 LOADING_TIP_130: "#high «La cagaste al morir y volviste a casa a por más. Bienvenido de nuevo.\nAhora las reglas son distintas.»#! - Un Giovanni a su chiquillo"
 LOADING_TIP_131: "#high «Ambrogino Giovanni tiene el dudoso honor de ser el cabrón más egoísta de todo un clan de cabrones egoístas.»#! - Un Giovanni"
 LOADING_TIP_132: "#high «Todos menos nosotros son estúpidos.\nTriste pero cierto.»#! - Giovanni desconocido"
 LOADING_TIP_133: "#high «Les ha tocado cargar con un nombre que nadie sabe pronunciar. Eso sí que es la condenación.»#! - Accorri Giovanni sobre los Tzimisce"
 LOADING_TIP_134: "#high «Existo. Esa es razón suficiente para que gobierne.»#! - Lasombra desconocido"
 LOADING_TIP_135: "#high «Piensa en los Lasombra. Réstales la inteligencia, la previsión, el estilo y la entrega a la supremacía. Eso son los Ventrue: como nosotros, pero estúpidos.»#! - Demba Makemba Adoula"
 LOADING_TIP_136: "#high «Dignos archienemigos. El último con el que jugué tardó cuatro noches en gritar y doce en morir. Admirable, de veras.»#! - Los Tzimisce sobre los Ventrue"
 LOADING_TIP_137: "#high «Puede que nuestro clan sea la colección más desesperada de traidores intrigantes que se pueda encontrar, pero son nuestros traidores intrigantes.»#! - Friedrich von Weber, Ventrue"
 LOADING_TIP_138: "#high «Siempre parecen ocurrir pequeños accidentes extraños a quienes se cruzan en su camino. Y si los accidentes no acaban contigo, lo harán los cantos de muerte que te lanzan y que te hacen estallar el cerebro.»#! - Los Nosferatu sobre los magos"
 LOADING_TIP_139: "#high «Rara vez me he topado con criaturas tan convencidas de su importancia para el universo y, sin embargo, tan faltas de pruebas que respalden sus delirios.»#! - Los Ravnos sobre los Toreador"
 LOADING_TIP_140: "#high «Son increíblemente valientes, asombrosamente duros, homicidamente poderosos como individuos... y completamente ineficaces como grupo.»#! - Los Setitas sobre los Gangrel"
 LOADING_TIP_141: "#high «Los Brujah dicen que saben construir una sociedad perfecta gracias a su intelecto superior. Puedes localizar esos intelectos prestando oído a los gritos de terror y al estrépito de objetos que se rompen.»#! - Los Setitas sobre los Brujah"
 LOADING_TIP_142: "#high «Para cuando te das cuenta de que un Toreador ha perdido los estribos, tu cabeza puede estar a varios pies de tu cuerpo.»#! - Los Setitas sobre los Toreador"
 LOADING_TIP_143: "#high «Unos pocos Antiguos no tienen nada que ocultar. Se los llama “muertos”.»#! - Zachariah Shale"
 LOADING_TIP_144: "#high «Ahora tengo una pregunta para ti. Entre un Antiguo Lasombra inteligente, despiadado, manipulador, fanático y empeñado en joderte, y un Antiguo Lasombra inteligente, despiadado, manipulador, fanático y convencido de que eres maravilloso, dime cuál da más miedo.»#! - Nadia"
 LOADING_TIP_145: "#high «¡¿Seguir a un Gangrel?! ¿Por qué no escupir al Príncipe o ponerse a tomar el sol?»#! - Pierre" #Blood curse 2
 LOADING_TIP_146: "#high «Las cosas que hago por ti, Lucita... Y las cosas que hago por mí mismo.»#! - Moncada" #Conspiracies
 LOADING_TIP_147: "#high «Y el nombre del camino era Gehena, y estaba pavimentado de sueños moribundos.»#! - Kli Kodesh" #Blood curse 3
 LOADING_TIP_148: "#high «Y cuando la Criba haya tenido lugar, el Fratricida se presentará ante el Traidor de la Sangre. Los lamentos y el rechinar de dientes son la sombra del Traidor, que lo sigue con más certeza que la noche al día.\nY he aquí que la Tierra abrirá su vientre y la Bestia saldrá reptando en busca de la sangre con que saciar su sed. Miguel, el más exaltado de la Gloriosa Compañía, tiembla ante la Tríada Impía completa. La Bestia camina por la Tierra. El Deshacer de los Hijos de Caín está a las puertas.»#! - José de Arimatea" #Blood curse 3
 LOADING_TIP_149: "#high «Llevan conspirando contra nosotros para vengar la muerte de Brujah desde hace unos 10.000 años. Seguro que se ponen a ello cualquier noche de estas.»#! - Los Brujah sobre los Verdaderos Brujah" #lore of the clans
 LOADING_TIP_150: "#high «La mitad de los Clanes del Sabbat solo están ahí porque les da la ocasión de matar Tremere.»#! - Gangrel desconocido" #lore of the clans
 LOADING_TIP_151: "#high «Por desgracia, hemos tenido que oír a los Ventrue y a los Brujah lloriquear por Cartago durante siglos. La verdad es que, si Cartago hubiera sido de verdad importante, se la habríamos quitado a los dos.»#! - Lasombra desconocido" #lore of the clans
 LOADING_TIP_152: "#high «Como puedes imaginar, organizar a un grupo de asesinos, ladrones y poderosos egoístas, egocéntricos y agresivamente ambiciosos no es tarea fácil.»#! - Los Lasombra sobre sí mismos" #lore of the clans
 LOADING_TIP_153: "#high «Todo Lasombra desea que las últimas palabras de su enemigo sean: “Ah, ya veo. Bien jugado.”»#! - Lasombra desconocido" #lore of the clans
 LOADING_TIP_154: "#high «¿Soy Caín? ¿Eres Caín? ¿Somos Caín?»#! - Malkavian desconocido" #lore of the clans
 LOADING_TIP_155: "#high «Por último, pero desde luego no menos importante, tenemos a los sombríos y misteriosos Inconnu, una Secta de vampiros conocida por su sombría misteriosidad. Podría decirte la verdad, pero tendría que matarte.\nQuiero decir, otra vez.»#! - Malkavian desconocido" #lore of the clans
 LOADING_TIP_156: "#high «Las bromas son un concepto difícil de traducir a quienes no pertenecen al Clan, y “complots aterradoramente anárquicos de desenlace inescrutable” tampoco es que suene muy bien.»#! - Malkavian desconocido" #lore of the clans
 LOADING_TIP_157: "#high «Quizá oigas a algún Vástago engreído y pagado de sí mismo soltar esa cantinela de los “maestros secretos”, según la cual los vampiros son de algún modo responsables de la historia humana. Es una historia preciosa, querida, pero sencillamente no es cierta. Apenas conseguimos mantener el control de nuestra propia sociedad sin que todo se rompa en “sectas”, “coteries” y demás, así que ¿cómo íbamos a controlar a la humanidad?»#! - Toreador desconocido" #lore of the clans
 LOADING_TIP_158: "#high «Los Toreador están solos en el mundo de los Vástagos. No digo que seamos mejores que los demás Clanes... aunque, por supuesto, lo somos: ¿has hablado con ellos?»#! - Toreador desconocido" #lore of the clans
 LOADING_TIP_159: "#high «Los necios Brujah de hoy afirman que Cartago era una ciudad donde los Vástagos y el ganado vivían en armonía. Supongo que es así, si por “armonía” entiendes que los mortales ni siquiera intentaban defenderse cuando los vampiros les arrebataban a sus seres queridos y los desangraban sin pensárselo dos veces.»#! - Ventrue desconocido" #lore of the clans
 LOADING_TIP_160: "#high «Reclamamos el trono que es una cruz porque la única alternativa a gobernar es ser esclavo.»#! - Ventrue desconocido" #lore of the clans
 #Bastet
 LOADING_TIP_161: "#high «Se dice que los Ceilican están extintos. Siendo yo mismo un extinto, me cuesta creerlo.»#! - Bubasti desconocido"
 LOADING_TIP_162: "#high «Una vez envié a un Khan contra un vampiro. Los resultados fueron un placer para la vista.»#! - Bubasti desconocido"
 LOADING_TIP_163: "#high «Sí, sí, supongo que son nobles y todo eso, ¡pero qué problema de actitud!»#! - Los Ceilican sobre los Simba"
 LOADING_TIP_164: "#high «Ningún rey es tan poderoso, ningún sacerdote tan santo, ninguna virgen tan pura de corazón como para que su sangre no se hiele ante el rostro de un tigre. Ante mí, no sois nada.»#! - Khan desconocido"
 LOADING_TIP_165: "#high «Les dijimos a Bagheera y a Khan: si sois mejores Reyes que nosotros, intentad tomar la corona.\nHay que reconocerles que lo intentaron.»#! - Simba desconocido"
 LOADING_TIP_166: "#high «Patético. Y muerto. Qué lástima.»#! - Los Simba sobre los Ceilican"
 LOADING_TIP_167: "#high «No me fiaría de uno ni a la distancia a la que podría lanzar una pirámide, y eso no es muy lejos.»#! - Los Ajaba sobre los Bubasti"
 LOADING_TIP_168: "#high «Bienvenido a la Perla Blanca. Nos especializamos en sueños salvajes y pesadillas aún más salvajes. Me pregunto a cuál de las dos vienes, ¿mm?»#! - Saruuro, Quadi del Cielo Rojo"
 LOADING_TIP_169: "#high «La principal diferencia entre nosotros y los demás Vástagos es que ellos solo beben sangre de sus víctimas, mientras que los Nagaraja deben consumir también la carne. De ahí nuestro apodo, los muy bien llamados Comedores de Carne. Es como si los otros Vástagos le hubieran pedido a su sobrina de 4 años que nos pusiera nombre, pero me estoy yendo por las ramas.»#! - Nagaraja desconocido" #lore of the bloodlines
 LOADING_TIP_170: "#high «Un hombre le pregunta a un psíquico si de verdad puede ver el futuro, y el psíquico responde que sí. Entonces el hombre le da un puñetazo en la cara. Mientras el psíquico yace sangrando en el suelo, preguntándose qué ha hecho para provocar tal violencia, su agresor se inclina y le dice: “¡Apuesto a que no te lo esperabas!”.\nEse chiste lo oímos mucho.»#! - Verdadero Brujah desconocido" #lore of the bloodlines
 LOADING_TIP_171: "#high «Miguel había hallado la redención en el odio de una amante, demasiado lejos ya del Sueño para volver. Su derrota fue casi tan amarga como la victoria de ella.\nY Miguel sonrió.»#!" #CN Nosferatu
 LOADING_TIP_172: "#high «Aquella ciudad fue en otro tiempo tan grandiosa. Tan correcta y tan llena de sí misma. Ahora, puesta de rodillas, Constantinopla ha sido rebajada a otro nivel: el mío. Y si ha de volver a levantarse, creo que lo hará con mi collar en la garganta.»#! - Alfonzo de Venecia" #DA CN Lasombra p130
 LOADING_TIP_173: "#high «¿El Sueño? El sueño de Miguel de una gran ciudad sigue siendo lo que siempre fue: está a nuestra espalda y está por delante. Lo llevamos con nosotros y podemos reconstruirlo con cualquier imagen que seamos capaces de imaginar, y con muchas que ninguno de nosotros, por sí solo, podría imaginar.»#! - Malaquita" #DA CN Lasombra p226
 LOADING_TIP_174: "#high «¿Condenado? Christof, tú eres la cumbre de la creación. Posees poderes que superan incluso a los del más virtuoso de los hombres. Eres una ley para ti mismo, más dios que hombre. ¡Eres inmortal! Un ángel en forma y poder: disfruta de tu posición. Saborea el exquisito poder que tu Dios ha derramado sobre ti. Úsalo para imponer tu voluntad a un mundo de pecadores.»#! - Serena" #Redemption, entering Prague university with Serena
 LOADING_TIP_175: "#high «Última oportunidad, demonio. Sé matar a los de tu especie con rapidez, pero me complacerá fingir que no.»#! - Gauthier de Dampierre a Anatole"  #DA CN Ravnos p76 
 LOADING_TIP_176: "#high «Crearemos, dentro de la Iglesia y, sin embargo, sin que la Iglesia lo sepa, un cuerpo de hombres —y de mujeres también, si Dios así lo quiere— en quienes el Santo Padre pueda confiar para llevar la Inquisitio contra las mismísimas legiones del Infierno en la tierra.»#! - Cardenal Battista Marzone"  #CN DA Ravnos p143
 LOADING_TIP_177: "#high «Es cierto que Caín es ejemplar. Es nuestro padre oscuro, progenitor de nuestra raza. Es un errante que busca el perdón y la comprensión, como nosotros. Es un maestro tiránico que castigará a quienes abandonen sus lecciones. Pero no es ningún mesías.»#! - Anatole"  #CN DA Malkavian p162
 LOADING_TIP_178: "#high «Ser Príncipe se parece mucho a ser el ganso asado de un festín: los que no te están trinchando esperan la ocasión de hincarte el diente.»#! - Olivier"  #CN DA Brujah p143
 LOADING_TIP_179: "#high «Te compadezco porque jamás has logrado nada de lo que de verdad deseabas. No puedes amar, solo poseer. No puedes gobernar, solo dominar. Espero que una noche halles la paz; no creo que la halles, pero aun así lo espero. Eres mi sire, pero el tiempo en que doblé la rodilla ante ti como ante alguien superior ha terminado. Ya no eres Príncipe aquí.»#! - Geoffrey a Alexander"  #CN DA Brujah p276
 LOADING_TIP_180: "#high «Antes íbamos armados con nuestro honor, nuestro valor y un acero bien templado. Ahora lo enfrentamos con la justa ira de Dios, y aunque levante ejércitos de las mismísimas entrañas del Infierno, #italic ¡no prevalecerá contra nosotros!#!»#! - Jürgen von Verden sobre Vladimir Rustovitch"  #CN DA Toreador p119
 LOADING_TIP_181: "#high « «Cabalga.» La palabra apenas se reconocía como habla. «Cabalga como si el mismísimo Diablo te mordiera los talones.» Qarakh sonrió, mostrando unos dientes que se habían vuelto lobunos.\n «Porque así será.» »#! - Qarakh a Marqués de Langres"  #CN DA Gangrel p44
 LOADING_TIP_182: "#high «El Rey Mono avergonzó a todos los de vuestra clase. Hicieron falta el Buda y los elementos para enseñarle a comportarse.»#! - Los Mil Susurros sobre las Grullas Resplandecientes"  #KOTE Core p65
 LOADING_TIP_183: "#high «Ver reír a Rosamund era lo más cerca de la luz del sol a lo que se atrevió jamás a acercarse un vampiro cuerdo. Oírla cantar o recitar poesía era oír a una sirena. Verla caminar era ver la belleza del amor de Dios en movimiento.\nVerla llorar era insoportable.»#! - Jürgen von Verden"  #DA CN Ventrue p38
 LOADING_TIP_184: "#high « «¿Y si empieza el combate, huirás?» Hardestadt clavó los ojos en el Lasombra, y la luz de la luna se detuvo a mirarlos. Gotzon abrió los ojos un poco más y permitió que Hardestadt viera, por un instante, lo que había tras ellos. Hardestadt dio un paso atrás. No había cedido ante un enemigo en un siglo, quizá más.\nPero es que nunca había visto de verdad el Infierno.»#!"  #DA CN Ventrue p12
 LOADING_TIP_185: "#high «Mantente lejos de ellos. Mantente lejos de sus tierras. Mantente lejos de sus susurros. Mantente lejos de sus amigos y, por lo que más quieras, de sus enemigos.»#! - Los Roehuesos sobre los Señores de la Sombra"  #WDA Revised p59
 LOADING_TIP_186: "#high «¿Vampiros? Encuentra uno, contenlo con una cruz, préndele fuego, puf, se acabó el vampiro.\n¿Hombre lobo? Encuentra uno, extiende tu cruz, pierde el brazo izquierdo, saca tu cruz, pierde el brazo derecho, ¿alguien más?»#! - Las Furias Negras sobre la Inquisición"  #BF Revised p22
 LOADING_TIP_187: "#high «La Camada de Fenris da la impresión de que entrará en frenesí y te devorará la cara en cualquier momento. Los Señores de la Sombra dan la impresión de que se escabullirán y te asesinarán mientras duermes cualquier noche.»#! - Cara"  #BF Revised p59
