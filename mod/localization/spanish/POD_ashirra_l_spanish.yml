l_spanish:
 
 #### Cargos de la corte ####
 ashirra_imam_court_position: "Imán"
 ashirra_imam_court_position_desc: "El imán es el líder espiritual de toda comunidad Ashirra. Protege a los fieles, garantiza la seguridad y la prosperidad de la comunidad y hace cumplir las leyes del islam. También se encarga de mantener la mezquita de los Ashirra de la ciudad, que es a la vez el corazón espiritual de la comunidad y un lugar de santuario al que cualquier Cainita puede acudir en paz y hacer oír sus quejas."
 ashirra_ulama_court_position: "Alim"
 ashirra_ulama_court_position_desc: "Los 'ulama son estudiosos del Corán y el Hadiz. Sirven como hombres sabios respetados de la comunidad. Los Ashirra que buscan el conocimiento religioso sirven como 'ulama en su propia comunidad nocturna. Muchos de estos Ashirra han memorizado estos textos sagrados y, en algunos casos, han pasado cientos de años contemplando y debatiendo el significado de las enseñanzas del Profeta."
 ashirra_qadi_court_position: "Qadi"
 ashirra_qadi_court_position_desc: "Los cadíes son los juristas de la fe islámica: estudian las leyes establecidas por Mahoma y las interpretan en las disputas o los delitos cometidos entre los fieles. Cada juez debe estar versado tanto en la ley expuesta en el Corán como en literalmente cientos de sentencias y precedentes anteriores dictados por los juristas a lo largo de la historia del islam. Este juez asesora al imán, al sultán y a otros vampiros en asuntos relativos a disputas legales y recomienda castigos adecuados para las infracciones de la ley islámica."
 ashirra_mullah_court_position: "Mullah"
 ashirra_mullah_court_position_desc: "Los estudiosos más respetados de los Ashirra son conocidos como mullahs. Aunque cualquier Ashirra puede aspirar a ser un estudioso de los textos sagrados, el título de mullah solo puede obtenerse tras años de estudio devoto y aclimatación por parte de los mullahs actuales de la secta. En todo el mundo musulmán, solo un puñado de vampiros ostenta el título."
 ashirra_mullah_court_position_requirement_tooltip: "Es [GetTrait('theologian').GetName(GetNullCharacter)] o [GetTrait('erudite').GetName(GetNullCharacter)]"
 
 
 
 #### Tareas de cargos de la corte ####
 POD_imam_sadaqah: "Liderar Sadaqah pública"
 POD_imam_sadaqah_desc: "Tu $ashirra_imam_court_position$ repartirá limosnas a los pobres e indigentes de tu dominio en tu nombre."
 POD_imam_sanctuary: "Proporcionar santuario"
 POD_imam_sanctuary_desc: "El $ashirra_imam_court_position$ dedicará tiempo a escuchar las quejas de los Cainitas corrientes"
 POD_qadi_judge: "Dictar sentencias"
 POD_qadi_judge_desc: "El $ashirra_qadi_court_position$ se centrará en juzgar diversos casos en tu lugar."
 POD_ulama_teachings: "Asesorar al Sultán"
 POD_ulama_teachings_desc: "El $ashirra_ulama_court_position$ asesora al Sultán con su vasto conocimiento erudito."
 POD_ulama_teachings_requirement: "#bold No#! eres un [cultural_head|E]"
 POD_ulama_learning: "Buscar más conocimiento"
 POD_ulama_learning_desc: "El camino para convertirse en $ashirra_mullah_court_position$ es largo. El $ashirra_ulama_court_position$ dedicará su tiempo a lograrlo."
 POD_ulama_learning_tooltip_requirement: "#bold No#! tiene a la vez [GetTrait('theologian').GetName(GetNullCharacter)] y [GetTrait('erudite').GetName(GetNullCharacter)]"
 POD_ulama_learning_tooltip: "Cada año, este personaje tiene una probabilidad de obtener un [perk|El] en el [learning_lifestyle|E] de [GetTrait('theologian').GetName(GetNullCharacter)] o de [GetTrait('erudite').GetName(GetNullCharacter)] hasta que tenga ambos rasgos. Esta probabilidad mejora con su [aptitude|El]."
 court_ulama_study_theology_title: "El Alim progresa"
 POD_mullah_warriors: "Convocar a los fieles"
 POD_mullah_warriors_desc: "Muchos miembros de los [Glossary('Ashirra','game_concept_ashirra_desc')] están listos para luchar contra los enemigos de Alá. No rechazarán la llamada del $ashirra_mullah_court_position$."
 POD_mullah_zealots: "Liderar a los devotos"
 POD_mullah_zealots_desc: "Un $ashirra_mullah_court_position$ es muy respetado en los [Glossary('Ashirra','game_concept_ashirra_desc')]. Sus palabras pueden convencer incluso al más cínico de los adoradores. Aquellos que le apoyen te apoyarán a ti también."
 
 
 #### Relacionado con El Cairo ####
 POD_mullah_zealots_cairo_tooltip: "Cada año, este personaje tiene una probabilidad de eliminar [GetTrait('cynical').GetName(GetNullCharacter)] de su [liege|El], de los [courtiers|El] de su señor o de los [vassals|El] de su señor. Esta probabilidad mejora según su [aptitude|El]."
 court_mullah_zealots_cairo_effect_title: "El Mullah disipa las dudas"
 cairo_mullah_aptitude_reward_tooltip: "[GetBuilding('cairo_khitta_lama_04').GetName]"
 
 POD_qadi_judge_cairo_tooltip: "Cada año, este personaje tiene una probabilidad de aumentar la [de_jure_drift|E] en el reino. Esta probabilidad mejora según su [aptitude|El]."
 court_qadi_judge_cairo_effect_title: "El Qadi acelera la integración"
 cairo_qadi_aptitude_reward_tooltip: "[GetBuilding('cairo_khitta_yashkur_04').GetName]"
 
 POD_imam_sadaqah_cairo_tooltip: "Cada año, este personaje tiene una probabilidad de convertir condados que no sean Ashirra a tu [faith|E]. Esta probabilidad mejora según su [aptitude|El]."
 court_imam_sadaqah_cairo_effect_title: "El Imán convierte un condado"
 cairo_imam_aptitude_reward_tooltip: "[GetBuilding('cairo_khitta_hajj_04').GetName]"
 
 POD_ulama_teachings_cairo_tooltip: "Cada año, este personaje tiene una probabilidad de eliminar uno de tus [Concept('fame_trait','rasgos de fama')|E] de [mental_break|E] negativos. Esta probabilidad mejora según su [aptitude|El]."
 court_ulama_teachings_cairo_effect_title: "El Alim proporciona una nueva perspectiva de la vida"
 cairo_ulama_aptitude_reward_tooltip: "[GetBuilding('cairo_khitta_fen_04').GetName]"
 
 
 
